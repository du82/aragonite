title = "Episodio 86: All About Accents! The US Coast to Coast (Part 1) - Duolingo"
description = "Listen to episodes of the Ingles-Espanol Duolingo podcast for compelling, true-life stories that improve your Ingles-Espanol listening and comprehension skills."
full_description = "Episodio 86: All About Accents! The US Coast to Coast (Part 1) Por Duolingo el miércoles 07 de febrero del 2024 Las historias de dos personas que viven en diferentes partes de Estados Unidos y las características únicas de sus acentos. Escúchanos en Suscríbete y escúchanos gratis en Spotify o donde prefieras escuchar tus podcasts. Transcripción Diana: ¡Hola, listeners! En esta temporada de “Relatos en inglés”, celebramos la riqueza y la diversidad del inglés. Revisitaremos algunos de nuestros episodios favoritos, destacando acentos únicos de diferentes países y regiones donde se habla el inglés. En el episodio de hoy, vamos a Estados Unidos, donde los acentos pueden cambiar mucho de una zona a otra, ¡a veces incluso de ciudad en ciudad! Para comenzar, visitaremos el estado de Iowa. Está prácticamente en el centro del país, en una región llamada Medio Oeste, o Midwest. Aquí, la gente habla con un acento que tiene algunas características sutiles que lo diferencian de otros dentro del país. Nuestra primera narradora es Katie Swanson-Niermann, ella vive en Des Moines, la capital de Iowa. Su acento tiene elementos del Medio Oeste. Por ejemplo, pronuncia sus “r” de forma diferente, en palabras como octubre, October, “October” o monstruo, monster, “monster”. También alarga ciertas vocales, en palabras como “camino”, path, “path” o “también”, too, “too”. ¡Veamos si puedes identificar algunas de estas características que acabamos de describir mientras oyes su historia! Diana: Des Moines, la ciudad capital del estado de Iowa es un lugar donde la gente se vuelve loca por Halloween. Eso descubrió Katie Swanson-Niermann, que usa el apodo Swany, cuando se mudó allí en el 2013 a los 26 años. Swany: I celebrated Halloween as a kid, but it was very different in Des Moines. Everyone in our neighborhood loved Halloween. Every house had amazing decorations that were both fun and scary, like spiders and ghosts. Our neighbors wore zombie costumes and tried to scare people. One man, who was very tall, dressed like a monster and walked around the streets at night. Diana: Halloween es una celebración de disfraces, adornos y travesuras. Una tradición muy conocida es el trick or treat. Los niños se disfrazan y van de puerta en puerta gritando: “trick or treat!” El trick es una travesura, puede ser una broma o un chiste, y el treat es una golosina. La verdad es que en la mayoría de los sitios, los niños ya no hacen travesuras. Swany: But in Des Moines, tricks are still part of the tradition. The kids trick-or-treat the night before Halloween, and they usually tell you jokes before you give them candy. On my first Halloween in Des Moines, I woke up to a very surprising trick. Diana: Welcome, les damos la bienvenida a “Relatos en inglés”, un podcast de Duolingo. Soy Diana Gameros. En cada episodio podrás practicar inglés a tu propio ritmo, escuchando historias reales y fascinantes contadas por las personas que las vivieron. Los protagonistas hablan en un inglés sencillo y fácil de entender para quienes están aprendiendo el idioma. En cada capítulo, yo te acompañaré, para asegurarme de que entiendas todo. También ofrecemos transcripciones completas en podcast.duolingo.com. Diana: En el 2014, Swany y su esposo compraron una casa en Des Moines, cerca de donde ella estudiaba medicina. Estaba en lo alto de una colina en un barrio histórico. Y le rentaban un cuarto a una inquilina que les ayudaba a pagar la hipoteca. Swany: To get to the front door of our house, you had to walk down a path through a small garden. It was the smallest house on the street, and it needed some improvements, but we loved it. We had friendly neighbors, a wonderful roommate, and a cute dog. But I was so busy studying and going to class that I didn’t have time to help my husband with the house. He cleaned and did all of the repairs. I felt so bad that I couldn’t help! So, in October, I got three pumpkins to decorate our porch for Halloween. They were bright orange, and I was very proud of them. Diana: Halloween se celebra la noche del 31 de octubre, y en los Estados Unidos, decorar la casa es toda una tradición. En Des Moines, era incluso más bien una pasión. Swany: Des Moines loved Halloween! All of the houses in our neighborhood had lots of decorations. Some were scary, but I enjoyed seeing everyone’s enthusiasm. I loved how all of the neighbors came together to celebrate the holiday. My pumpkins were simple, but they were special to me. They made me feel like I was part of the Halloween celebrations. Diana: Las calabazas son muy populares en Halloween. Mucha gente las vacía y las talla, o carve, con caras y otros diseños. Esas calabazas decoradas, con velas adentro, son muy populares. Se llaman “jack-o-lanterns”. Swany: Most of our neighbors had pumpkins too. They liked to carve monster faces, animals, or famous characters on them. Then, at night, they put candles in the pumpkins, and they became beautiful jack-o’-lanterns. I always carved pumpkins when I was a kid too. But that year, I didn't have time to carve my pumpkins. Diana: Aunque estaba muy ocupada, Swany estaba deseando que llegara Halloween. Esperaba que muchos niños se disfrazarán, o dress up, y fueran a su casa a hacer trick or treat. Swany: When I was a kid, I went out on Halloween with my brother and sister every year. We used to dress up in costumes and go to our neighbor's houses. When they opened their doors, we yelled, “trick or treat!” and then we got candy! We didn’t have to do any tricks. We had a map of the houses that gave the biggest chocolate bars. Our neighbors gave us so much candy! We went home when we couldn't carry any more. Diana: Pero en Des Moines, el “golosina o travesura” es un poco diferente. Primero, los niños van de puerta en puerta el día antes de Halloween, en lugar de la misma noche del 31, como sucede en los demás lugares. Y así, el 30 de octubre, a las tres de la tarde, cuando los niños comenzaron a aparecer en la puerta de Swany ya disfrazados, algo inesperado sucedió… Swany: I had a big bowl of candy. Kids came to my door, dressed like animals and monsters. When they yelled “trick or treat,” I tried to give them candy, but they said, “Wait!” They wanted to do a trick before they got their candy. Usually, the trick was a really bad joke like, “Where do pencils go on vacation? To Pennsylvania!” Diana: A Swany le encantó que las travesuras fueran chistes tontos. Pero más tarde, por la noche, a Swany le hicieron una travesura que no fue tan divertida… Swany: Right after I fell asleep, I heard some noises outside. We lived in a city, close to a bar, so it was normal to hear people outside laughing and talking while they walked home. But I could hear the noises getting louder and louder. Diana: Se oía como si la persona estuviera justo afuera de su casa. Entonces, Swany, aun medio dormida, fue a la ventana de su cuarto en el segundo piso. Swany: I looked out the window. There was a young woman walking down the garden path towards my house. At first, I thought maybe she was coming from the bar and got confused. But then, she went to my porch and picked up one of my pumpkins. So I opened the window and shouted, “Hey! Put my pumpkin down!” Diana: La mujer se quedó paralizada. Swany: I continued telling her to put down my pumpkin. But she said, “You just don’t understand! You just don’t understand!” I had no idea what she meant. Then, she started carrying the big pumpkin away. Diana: Entre todo ese alboroto, el marido de Swany se despertó. No tenía idea de lo que estaba pasando. Le preguntó a Swany por qué estaba gritando. Swany: I said, “Someone just stole the pumpkin!” He said, “It’s okay. It’s just a pumpkin.” And I said, “No! You don’t understand. She took my pumpkin!” I wanted to follow her and take my pumpkin back, but my husband convinced me to go back to bed. He said he’d get me another pumpkin. Diana: Swany se puso triste. Pero convencida de que no había nada más que hacer, se volvió a dormir. Swany: In the morning, it felt like a dream. My husband didn’t remember very much. And my roommate slept through the whole thing, so I explained what happened. As I remembered the woman carrying my pumpkin away, I became mad and sad again. I was upset that I let her take my pumpkin. Diana: Sintiéndose triste, Swany decidió sacar a pasear a su perro. Swany: When I opened the front door, there was a surprise. My pumpkin was back! I couldn’t believe it! Diana: Pero… la calabaza no se veía igual que antes. Ahora la calabaza estaba tallada con muchos detalles y con una vela adentro. Swany: Someone carved the big pumpkin into an amazing jack-o’-lantern! The pumpkin had scary eyes and a mouth with huge teeth. The details were incredible! There was also a tiny pumpkin in the jack-o’-lantern's mouth. It looked like the big pumpkin was eating the small pumpkin. Diana: La calabaza había sido tallada con unos detalles increíbles. Swany estaba sorprendida… y feliz. Swany: I loved it! I laughed when I thought about the night before. When the woman took my pumpkin and said, “You just don’t understand!” I really didn’t understand! It was a trick –– but it was a nice trick! In the end, I was happy she took the pumpkin. Diana: Swany no solo recuperó su calabaza, ¡era la mejor calabaza de toda la cuadra! Swany: My husband and I don’t live in Des Moines anymore, but we will always remember that Halloween. Now, we carve pumpkins with our kids too. But last year, we accidentally carved the mouth on the top of the pumpkin instead of the bottom! When we noticed it was wrong, we laughed. It seemed like the pumpkin was playing a trick on us! Diana: ¡Trick-or-treating suena muy divertido! Me encantó escuchar a Katie describir la tradición. Para mí, como alguien que creció escuchando inglés de Estados Unidos, su acento era muy claro y fácil de entender. ¿Qué te parece a ti? Para nuestra próxima historia, vamos a dejar el Medio Oeste y dirigirnos al sur de Estados Unidos, al estado de Alabama. Aquí, el inglés se habla con un acento propio. Tiene raíces en el inglés del siglo XVII, cuando agricultores de las regiones del norte de Inglaterra se establecieron en el sur de Estados Unidos. Por supuesto, el lenguaje y los acentos siempre están cambiando, y hoy en día el acento sureño se ha hecho más conocido en todo el mundo gracias a la música country. Las personas que hablan con un acento sureño se diferencian por las vocales, sobre todo. Por ejemplo, la palabra “supervivientes”, survivors, una persona con acento sureño convierte la “i” casi en una “a”: survivors. Nuestra próxima narradora, Joycelyn Davis, habla con un acento sureño. Mientras escuchas su historia, date cuenta de que ella quita la “g” al final de las palabras que terminan en “ing”. Por ejemplo, cuando dice la palabra incluyendo, including, la pronuncia así: including. ¡Vamos al episodio ahora y veamos si puedes escuchar otros ejemplos! Diana: De niña, Joycelyn nunca se planteó la historia de su familia. Ella es de un lugar llamado Africatown, en el estado de Alabama. Africatown fue fundado, o founded, por los antepasados ​​de Joycelyn, las últimas personas esclavizadas en llegar a los Estados Unidos. Eran sobrevivientes, o survivors, de un viaje brutal a través del Atlántico. Jocelyn: When I was growing up, I often heard the story of how my ancestors came to live in Africatown, many years ago. You can see relics of the past all over the town. The church that my ancestors founded is still there, and outside of it, there’s a bust of a man named Cudjo Lewis. He was one of the survivors of the Clotilda, the ship that brought my ancestors to the United States. Diana: Rodeada de toda esa historia, Joycelyn nunca pensó mucho en si debería hacer algo para mantenerla viva… hasta que llegó 2018. En enero de aquel año, alguien dijo haber encontrado los restos del Clotilda, el barco de esclavos. Y Africatown se llenó de gente que quería verlo y hablar con sus residentes. Así se vio Joycelyn en una reunión con una curadora del Museo Nacional de Historia y Cultura Afroamericana. Jocelyn: I talked to the curator from the museum, and I told her that my great-aunt had events at her house to honor our town’s history. I said I always thought that was so cool and that I wanted to do something like that. Diana: En respuesta, la curadora hizo algo que Joycelyn nunca olvidará, y que cambiaría su vida para siempre. La puso en evidencia, o called her out. Jocelyn: She asked, “So, what are you doing?” I realized she was calling me out. But it was a good thing. So right then and there, I said, “Now it's time for me to do something.” Diana: En enero de 2018, un periodista de Alabama publicó una historia con una revelación impactante: creía haber descubierto los restos del Clotilda. Ese fue el último barco que trajo esclavos a los Estados Unidos, según los registros históricos. Muchas personas habían buscado el barco durante décadas y la noticia saltó a la prensa de todo el país. Jocelyn: Journalists and academics from all over the country came to Alabama to cover the story. Some people were already interested in the history of the Clotilda, But other people weren’t interested, until the journalist said he found the ship. Diana: Ya que no era seguro que los restos eran del Clotilda, toda aquella atención fue un poco confusa para Joycelyn. ¿Por qué importaban tanto los restos, o wreckage, de un barco que se hundió hace más de 150 años? Jocelyn: For some people, it was important to find the wreckage of the Clotilda to make the history real. We already had a lot of evidence that the ship existed, including the captain’s diary. There was also a lot of oral history, including stories from my relatives and other community members. But until then, I felt none of that mattered to the rest of the world because there was no physical evidence of the wreckage. Diana: Joycelyn sabía que la historia era cierta, independientemente de que los restos fueran del Clotilda o no. La había oído toda su vida. Su tatarabuelo fue una de las 110 personas secuestradas en África Occidental y traídas a los Estados Unidos en cadenas, o chains en el Clotilda en 1860. Al nacer, se llamaba Oluale, pero sus captores le dieron el nombre de Charlie Lewis, por eso Joycelyn le llama Charlie Oluale. Jocelyn: The trip from Africa took almost six months. They were in chains most of the time. I often imagined what my ancestors’ lives were like. I wondered what they were doing when their captors arrived. I imagined myself on the ship. It was probably so confusing and sad. They were taken away from their families to a strange place. Diana: Durante cinco años, después de que Charlie llegó a los Estados Unidos, se vio obligado a trabajar como esclavo en una plantación en Alabama. Pero luego, en 1865, terminó la Guerra Civil y todos los que habían sido forzados a la esclavitud fueron liberados, o freed. Jocelyn: After they were freed, Charlie Oluale and a few other people from the Clotilda saved their money and bought land. Th"
