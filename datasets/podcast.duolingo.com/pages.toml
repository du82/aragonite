title = "Episode 105: La chanteuse des îles (The Island Singer) - Revisited - Duolingo"
description = "Listen to episodes of the French Duolingo podcast for compelling, true-life stories that improve your French listening and comprehension skills."
full_description = "Episode 105: La chanteuse des îles (The Island Singer) - Revisited By Duolingo on Tue 30 Jan 2024 To celebrate France’s love of culture, we’re revisiting some of our favorite episodes featuring francophone artists and performers. This episode, the story of Waaydah, a teenager from the French island of Mayotte who took the stage in her island’s first-ever opera competition. Stick around until the end for an update on what Waaydah has been up to since the first episode aired! How to Listen Listen free on Apple Podcasts or wherever you listen to podcasts. Transcript Ngofeen: Bonjour, dear listeners! For this special season of the Duolingo French Podcast, we are celebrating the arts. We’re revisiting some of our favorite episodes featuring singers, dancers, actors, and other performers in the Francophone world. Today’s episode is from August 2021 and takes us to the middle of the Indian Ocean, where we meet Waaydah Bakary. Waaydah lives on the tiny, French-speaking island of Mayotte, and she was just 17 years old when her mother signed her up for an Opera competition. The only problem… Waaydah had barely even heard of opera! Listen to the episode to find out how she did… And stay tuned until the end for an update on what Waaydah’s been up to! And now, on to the episode. Ngofeen: It was spring 2020, in the early weeks of the pandemic, and 17-year-old Waaydah Bakary was lying on her bed at home on the island of Mayotte. Mayotte is a French overseas territory, un département d’outre-mer. Waaydah was flipping through her phone, and she was singing to herself. She was almost always singing. Suddenly, an email popped up in her phone’s inbox. Waaydah: Cet e-mail venait d’une personne que je ne connaissais pas. Je l’ai ouvert, et je l’ai lu : « Félicitations, vous avez été sélectionnée pour participer au concours Voix des Outre-Mer ! ». J’ai pensé : « Un concours ? Quel concours ? Je ne me suis jamais inscrite à un concours ! ». Je ne comprenais pas du tout. Ngofeen: Waaydah read on. The mysterious singing contest she had been selected for was a competition specifically for people living in France’s overseas territories. After competing in their home territories, a select group of finalists would be invited to sing at a special gala performance in Paris’s famous grand opera house. Puzzled, Waaydah showed the email to her mom. And that’s when her mom came clean. Waaydah: Ma mère a regardé le mail et a fait un grand sourire. Elle m’a dit : « Ah, je savais que tu serais acceptée ! » J’ai compris que ma mère m’avait inscrite pour ce concours en secret, et elle ne m'avait rien dit ! J’étais abasourdie. Ngofeen: Abasourdie, stunned. Waaydah’s mom hadn’t signed her up for just any singing competition — this was an opera-singing competition! And Waaydah knew nothing about opera. Her idols were soul and R&B singers like Nina Simone, Mariah Carey, and Beyoncé… Not opera singers. That kind of singing intimidated her. Waaydah: Moi, je ne chantais pas d’opéra. Je n’en écoutais même pas. Quand j'entendais une chanteuse d'opéra, je me demandais si c'était normal de pouvoir faire ça avec sa voix ! Je me disais qu’elle devait avoir des cordes vocales spéciales… Mais moi ? Je ne pensais pas du tout être capable de chanter comme ça. Ngofeen: But Waaydah’s mother believed in her. She wanted her daughter to push herself…which is why she’d signed Waaydah up for a competition without asking her! Now she laid out a friendly challenge for her daughter. “Give this a shot,” she told Waaydah. “See where it leads you.” Waaydah could see it was a great opportunity… But still, she was hesitant. Opera singing? Her? Waaydah: J’étais juste une fille sur une toute petite île que peu de gens connaissaient. Je ne pensais pas vraiment pouvoir un jour chanter sur une scène, devant un grand public. Mais quand ma mère m’a inscrite au concours Voix des Outre-Mer, cela est devenu possible ! Ngofeen: Bienvenue and welcome back to the Duolingo French Podcast. I’m Ngofeen Mputubwele. Every episode, we bring you fascinating true stories to help you improve your French listening and gain new perspectives on the world. The storyteller will be using intermediate French, and I’ll be chiming in for context in English. If you miss something, you can always skip back and listen again. We also offer full transcripts at podcast.duolingo.com. Ngofeen: Waaydah grew up in Mayotte, a tiny, French-speaking archipelago in the middle of the Indian Ocean. Though it’s thousands of miles away from mainland France, it’s officially part of the country. Mayotte residents like Waaydah are French citizens. Waaydah: Mon île est tellement petite qu’on a du mal à la trouver sur une carte du monde. Mais Mayotte est une île magnifique ! Il y a la mer, deux montagnes, et le lagon. Ma maison est à cinq mètres de la plage ! Ngofeen: Music has always been a big part of Waaydah’s life. She sang in amateur choirs all through middle and high school. Her parents were both members of Cadence Mahoraise, a traditional Mayotte folk music group. Several of her uncles and cousins were local musicians. Waaydah: Toute ma vie, j’ai été entourée de musique. Je ne pouvais pas y échapper ! Et j’avais toujours adoré chanter. C’était une vraie passion pour moi. Parfois, je commençais à chanter sans y penser. Ngofeen: Growing up, Waaydah would spend hours watching music videos and snippets of concerts online. She daydreamed of one day touring the world, performing in front of rapt audiences. Lying in bed, she would burst into song. But her neighbors weren’t always thrilled to hear her sing. And they heard her, loud and clear because she has a voice that carries, une voix qui porte. Waaydah: On me dit souvent que j’ai la voix qui porte. On l'entend de loin. Parfois, je chante seule dans ma chambre, et tout à coup, j’entends un voisin ou une de mes tantes qui crie par la fenêtre : « Hé ho ! Mariah Carey ! Ça suffit ! » Ngofeen: Waaydah had never seriously considered becoming a professional singer. Mayotte didn’t even have a music school. But now, this contest offered her a unique opportunity, a chance to make those dreams come to life. So, Waaydah decided to go for it. Waaydah: Le concours était en deux parties. D’abord, il y avait une première sélection sur l’île de Mayotte. Je devais finir première ou deuxième pour participer à la finale à Paris. Là-bas, je retrouverais ensuite des chanteurs de tous les territoires d’outre-mer. Ngofeen: Waaydah saw that previous finalists of the Voix des Outre-Mer contest had gone on to start singing careers. During the final round of the competition, they performed in front of a panel of judges made up of distinguished music professionals. Finalists also had the chance to practice and train with a famous opera singer, Fabrice di Falco. Waaydah: Je ne connaissais pas Fabrice di Falco, mais j’ai regardé sur Internet et j'ai lu qu’il était très célèbre dans le monde de la chanson lyrique. Il a une voix incroyable et il a chanté partout dans le monde ! Ngofeen: Fabrice di Falco had come from another département d’outre-mer, the French island of Martinique in the Caribbean. He’d built an impressive career. And he was the one who’d come up with the Voix des Outre-Mer competition, to discover new voices outside of mainland France and share his love of opera. This was the first time his contest would audition the best singers in Mayotte. Waaydah: Pour les chanteurs de Mayotte, ce concours représentait une chance unique. C’était la chance d’être entendus ailleurs que sur notre île. Mais c’était aussi une chance de pouvoir apprendre avec un grand chanteur. Je n’avais jamais imaginé pouvoir être chanteuse lyrique, ni même chanteuse professionnelle. Mais maintenant, cette opportunité exceptionnelle se présentait et je ne pouvais pas la laisser passer ! Ngofeen: Waaydah decided to give the competition her all. To compete in the first round, she had to pick two songs. One could be any song of her choice. But the second had to be an aria, a song from an opera. Waaydah: Pour mon aria, j’ai choisi L’Amour est un oiseau rebelle. C’est un morceau célèbre de l’opéra Carmen, de Georges Bizet. J’ai écouté une version par la grande chanteuse Maria Callas. Je l’ai tout de suite trouvée magnifique… Mais je me suis dit : « Ça a l’air très difficile ! Comment Maria Callas peut-elle produire ces notes ? » Ngofeen: Singing the iconic aria from Georges Bizet’s opera Carmen, was a big challenge. As she listened to the recording of Maria Callas, Waaydah wondered if her voice had enough range. In choirs, she usually sang soprano. But she knew that her voice naturally tends to be deep, grave. Some of the high notes in the Carmen aria would be hard to reach. Waaydah: J’ai une voix plutôt grave. Quand j’entendais Maria Callas chanter Carmen, je commençais vraiment à douter de moi. Et je me demandais si j’étais vraiment capable de faire ça… Ngofeen: Finally, in late December, the big week came. Fabrice di Falco traveled to Mayotte to rehearse with all participants for four full days. On the fifth day, Waaydah and seven other contestants would perform in front of a live audience. Waaydah was very nervous to sing for Fabrice di Falco in rehearsals. Waaydah: La première fois que j’ai vu Fabrice en personne, je l’ai trouvé impressionnant et intimidant. Il était assis très droit sur sa chaise, avec son petit stylo, et le visage sérieux. Ngofeen: When it was Waaydah’s turn to practice with Fabrice di Falco, she could barely look at him. She fidgeted with her hands, looked down at the floor, up at the ceiling, over at the pianist Yoann… Anything but Fabrice! Waaydah: J’ai chanté : L’amour est un oiseau rebelle que nul ne peut apprivoiser… Fabrice m’a laissée finir, et à la fin de la chanson, il m’a dit : « Tu sais que je suis en face de toi ? Regarde-moi, la prochaine fois ! ». C’était très, très stressant. Ngofeen: But as the day went on, Waaydah gradually relaxed. Fabrice led the group through a series of vocal and posture exercises, demonstrating key techniques, like how to reach the high notes, les notes aiguës, and how to pronounce vowels, les voyelles. Waaydah: Fabrice nous montrait comment produire une longue note aiguë et nous faisait faire des exercices pour bien prononcer les voyelles, ce qui est très important dans l’opéra. Ngofeen: Fabrice showed them that opera was also a dramatic performance, with characters, and emotion. When he demonstrated how to enter the stage in character, something clicked for Waaydah. Waaydah: Je me suis dit : « Ah, c’est ça aussi, l’opéra ? Jouer sur scène, montrer des émotions… Ça, j’aime beaucoup. Je peux le faire ! ». Ngofeen: The second day went by and Waaydah was feeling more confident. She wanted to push her limits and impress Fabrice. On the third day of rehearsals, during a group singing exercise, Waaydah tried to hit those tough to reach high notes. Her voice rang out, clear and strong, and she felt a rush of joy! But then, in the back of her throat… Waaydah: Le troisième jour, j’ai senti que quelque chose n’allait pas. Toute la journée, j’avais tiré sur mes cordes vocales… Les notes sortaient, donc je pensais que tout allait bien. Mais à la fin de la journée, j’ai essayé de parler… Et là, plus aucun son ne sortait de ma bouche. Pas un bruit. Ngofeen: When Waaydah realized that she’d lost her voice, she panicked. Without saying a word, she stood up and left the room. Waaydah: C’était deux jours avant le concours, et j’avais complètement perdu ma voix. J’étais furieuse. Furieuse contre moi-même pour avoir forcé sur ma voix. Furieuse contre la chanson… J’avais envie de crier : « Je ne veux plus faire votre concours ! Laissez-moi tranquille ! ». Ngofeen: When Waaydah got home from her rehearsal, her mother took one look at her face and knew something was wrong. She followed Waaydah up to her room and asked her what was going on. Choking back tears, Waaydah managed to croak out a few words. Waaydah: J’ai dit à ma mère : « Je ne crois pas que j’en suis capable. Je veux abandonner. » Et là, ma mère m’a surprise, et elle m’a répondu : « Si, tu peux le faire ! Il ne faut pas que tu abandonnes. Ne t’inquiète pas, je vais te préparer un remède spécial. Tu vas reposer ta voix et demain ça ira mieux. » Ngofeen: Waaydah’s mother didn’t want her daughter to give up. So she made her daughter a home remedy of chopped ginger, honey, and lemon. Then she made Waaydah swallow spoonfuls of it. Waaydah: C’était dégoûtant ! Il n’y avait même pas de thé ni d’eau chaude, Non, non, il fallait l’avaler comme ça ! Ngofeen: It may not have tasted good, but it sure worked! The next morning, after a good night’s sleep, Waaydah’s voice was back. The next day at rehearsals, she went to see Fabrice and the pianist, Yoann, and told them what had happened. They said they’d adjust the key so she wouldn’t harm her voice when she sang her piece, son morceau lyrique. Waaydah: Fabrice et Yoann m’ont dit : « On va adapter ton morceau lyrique. Tu pourras le chanter à une note plus basse pour éviter de forcer sur ta voix. » J’avais toujours peur, mais au moins, je pouvais participer au concours. Ngofeen: The next morning was the big day: the day of the competition. The event took place at a big amphitheater in the island’s capital. There was a live audience, with a panel of judges in the front row. A camera crew was there to film the whole thing. The atmosphere was electric. Waaydah: Le jour du concours, il y avait une super énergie. J’étais nerveuse, mais aussi heureuse. On allait passer sur scène dans l’ordre de notre âge. Le plus jeune chanteur en premier, et le plus vieux en dernier. J’étais l’une des plus jeunes, alors j’allais passer en deuxième. Ngofeen: When it was Waaydah’s turn to perform, she began with her non-opera pick. After she finished, she only had a few minutes before Fabrice introduced her next piece. She rushed backstage, en coulisses, to change into her second outfit for her opera character, Carmen. Waaydah: J'étais en coulisses. Derrière le rideau, il y avait un miroir. J’ai regardé ma tenue. J’ai baissé les épaules de ma robe. J’ai arrangé mes cheveux sur le côté, et j’ai mis une fleur rouge, comme Carmen dans l’opéra de Bizet. Puis j’ai enlevé mes chaussures et je suis retournée sur scène, pieds nus et avec assurance ! Ngofeen: Barefoot, pieds nus, with the shoulders of her dress drawn down and a big red flower in her hair, Waaydah felt like a different woman. And when the music began, and she lifted her head to sing, the transformation was complete. She became Carmen. Waaydah: J’ai regardé Yoann au piano, avec un regard déterminé. Il avait l’air très content ! Il voyait que j’étais vraiment dans la peau du personnage. Pendant que je chantais, j’ai fait tout ce que Fabrice nous avait appris. J’ai traversé la scène en marchant, j’ai joué avec ma robe et avec mes cheveux… Ngofeen: It was exhilarating. Waaydah felt that she had captured the audience. Waaydah: Quand je suis arrivée à la dernière phrase "
