full_description = "Episodio 88: All About Accents! Voices from Australia Por Duolingo el miércoles 21 de febrero del 2024 Las historias de dos personas que viven en diferentes partes de Australia y las características únicas de sus acentos. Escúchanos en Suscríbete y escúchanos gratis en Spotify o donde prefieras escuchar tus podcasts. Transcripción Diana: ¡Hola, listeners! En esta temporada de “Relatos en inglés”, celebramos la riqueza y diversidad del inglés, revisitando algunos de nuestros episodios favoritos, y destacando acentos únicos de diferentes países y regiones. En este episodio vamos al sur, a una tierra que se conoce como Down Under. Es famosa por su fauna especial, como los koalas y los canguros. Australia es un lugar remoto en todos los sentidos: es una isla rodeada por tres océanos. No comparte frontera terrestre con ningún otro país. El más cercano, Papua Nueva Guinea, está a 150 kilómetros. Y, ¿por qué es el inglés el idioma en esta isla? Hace más de 200 años, los británicos enviaron 11 barcos de presos a la remota isla para iniciar una colonia penal. Pero poco después, muchos otros inmigrantes llegaron del Reino Unido e Irlanda. La gran distancia y el aislamiento de la colonia de Inglaterra continental, significaron que el inglés allí evolucionó en una dirección propia. Los australianos desarrollaron sus propias expresiones, su propio vocabulario y, por supuesto, su propio acento único. Por ejemplo en Australia, ¡la gente apenas pronuncia las “r”! Escuchemos algunos ejemplos de nuestra primera narradora. Se llama Bree Talbot y es veterinaria silvestre en el este de Australia. Pueden notar que ella no pronuncia la “r” al final de algunas palabras, como la palabra para “cuidado”, care: “care”, o “dueño”, owner: “owner”. ¡Veamos si puedes captar más ejemplos en su historia! Diana: Australia es un país totalmente rodeado de océanos. Al estar tan aislado, su ecosistema ha evolucionado hasta tener algunas de las especies más raras y fascinantes del planeta. La mayoría de los reptiles, ranas y mamíferos australianos no se encuentran en ningún otro lugar del mundo. Y sin duda, uno de los seres más emblemáticos de Australia es el koala. Bree recuerda la primera vez que vio uno. Bree: I never saw any koalas when I was growing up. The first time I ever saw one was at the Sydney Zoo. And immediately, I was in love: its little face was so cute. I just sat down and watched this koala hanging out in the trees for a very long time. That was when I knew I wanted to work at a zoo. Diana: Gracias a esas visitas al zoológico, Bree aprendió a amar profundamente a los animales. Hoy Bree es veterinaria especializada en el cuidado de animales salvajes. Y aunque a ella le importan mucho todos y cada uno de sus pacientes, lo cierto es que los koalas son para ella los más especiales. Bree: It’s hard to say why I love koalas so much. One of the reasons is because they’re adorable with their big ears and round eyes. But even though everyone thinks they’re cute, humans are one reason why the koala population is becoming smaller. That’s why I work hard to protect and save as many koalas as I can. Diana: Welcome, les damos la bienvenida a “Relatos en inglés”, un podcast de Duolingo. Soy Diana Gameros. En cada episodio podrás practicar inglés a tu propio ritmo, escuchando historias reales y fascinantes, contadas por las personas que las vivieron. Los protagonistas hablan en un inglés sencillo y fácil de entender para quienes están aprendiendo el idioma. En cada capítulo, yo te acompañaré, para asegurarme de que entiendas todo. También ofrecemos transcripciones completas en podcast.duolingo.com. Diana: Bree comenzó su carrera en Sídney, la capital del estado australiano de Nueva Gales del Sur, que está en el sudeste de Australia. Como la mayoría de veterinarios allí, atendía principalmente a animales domésticos y ganado. Pero en la primera clínica en la que trabajó, a veces recibían pacientes… salvajes. Bree: When someone brought in a wild animal, the animal didn’t have an owner and there was no one to pay its bills. So, we always took care of pets with owners before we took care of wild animals. I didn’t like that. So, I started taking care of the wild animals during my free time. I read books, talked with wildlife professionals, and took classes to learn more about wild animals. I also paid for their medicine with my own money. I felt like I was doing something very important, and I was really good at it. Diana: Finalmente, Bree aceptó un puesto en el hospital de animales exóticos y salvajes de la Universidad de Sídney. Cerca de ese hospital, a una media hora en auto, vivía una colonia de koalas. Así que frecuentemente alguno de ellos terminaba en el hospital. Bree: I really liked working with koalas. So, I offered to be the person to take care of them at that hospital. Unfortunately, I saw a lot of koalas that were hit by cars or attacked by dogs. Diana: Cuidar a los koalas motivaba especialmente a Bree porque algunas poblaciones de esta especie están en peligro de extinción, o endangered. El gobierno australiano descubrió que, sin una rápida intervención, el país podría perder toda su población de koalas salvajes en esta área antes de 2050. Bree: The endangered koalas living in southeastern Australia, are a combination of two other kinds of koalas: northern and southern. Northern koalas are usually a lot smaller than southern koalas. Sadly, all of them are endangered. Diana: Bree aprendió que hay varias amenazas para la supervivencia de los koalas, como enfermedades o incendios. Aunque uno de los mayores riesgos es la urbanización que pone en peligro su alimento principal: los eucaliptos, o eucalyptus. Bree: Koalas need to live near special types of trees because they mainly eat eucalyptus leaves. But humans are cutting those trees down to create space for new houses. So now a lot of koalas don’t have a place to live. And they have to walk across busy roads to look for new trees. It’s really dangerous. Diana: Por este motivo Bree se esfuerza tanto como puede por salvar a la mayor parte de los koalas. Todavía recuerda a uno pequeño llamado Willy, que se quedó huérfano después de que un coche arrollara a su madre cuando ambos intentaban cruzar una carretera para buscar nuevos árboles para vivir. Bree: We had to feed and take care of him because he was so little. Koalas sleep for 18 hours a day, and they usually awake later in the day. So, we had to be awake all night at the hospital to feed Willy a special diet. Diana: Cuando Willy creció, tuvo que aprender a vivir libre con otros koalas. Lo primero que hizo Bree fue ponerlo en un pequeño parque especial que lo ayudaba a desarrollar una habilidad fundamental: trepar. Bree: Koalas learn how to climb on the playground. It’s a space where they don’t get hurt if they fall. A koala expert is also there to help the babies learn how to climb. It was important for Willy to be good at climbing because koalas spend most of their time in trees. If you see a koala on the ground, that usually means it’s sick. Diana: A medida que Willy crecía y se hacía más y más fuerte, Bree y su equipo hacían que la zona de juegos fuera más alta y compleja para que el koala ganara fuerza y confianza. Bree: Willy usually got tired after climbing for a while, so then we put him in a little basket to sleep. He always looked so comfortable! We really wanted to give Willy a comfortable environment, with the kind of care that joeys usually get from their mothers. That was so important. Diana: Los koalas son marsupiales, esto es, un tipo de animal que no está completamente desarrollado al nacer. Y por eso, las madres llevan y amamantan a los bebés marsupiales, o joeys, en una bolsa en su vientre, o pouch. Bree: After a baby koala is ready to leave the pouch, they still need support from their mothers. So, Willy slept while holding a toy bear. It was kind of like a mother for him, and it helped him feel more comfortable. Diana: Durante varios meses, Bree seguía vigilando a Willy para asegurarse que creciera sano. Los koalas que nacen en cautiverio pasan por lo que Bree describe como un programa de “deshumanización” para prepararlos para la vida en el bosque australiano, o bush. Bree: Soon, Willy was ready to go outside and spend time in nature. This is when we avoid touching the koalas. We want to make sure that they can live without us in the bush. Basically, we want them to be scared of people by the time they go back to the wild. Diana: Esta parte del tratamiento del koala suele ser difícil para Bree. Para ella, es fácil encariñarse con estos animales peluditos. Bree: Everyone at work fell in love with Willy because he was so cute. We took a lot of photos of him and his toy bear all the time. We loved him, but we had to remember that he was a wild animal. And teaching koalas to stay away from people is important, because it means they will be safer in the wild. And the wild is the best place for koalas, even if it is difficult to say goodbye to animals like Willy. Diana: Después de ocho meses de tratamiento, Willy ya estaba fuerte y sano. Había aprendido a moverse como un koala y estaba listo para volver a enfrentarse al ecosistema australiano. Bree: I know Willy is doing better in the wild, because that’s where he needs to be. I hope his story will make more people care about protecting wildlife in Australia. And I also want more people to know about the work that wildlife veterinarians do. Then, people can bring injured wild animals to hospitals like mine. Diana: Su mayor deseo es que los koalas sean retirados de la lista de especies en peligro de extinción. Bree: It’s a very stressful job, but it makes me very happy to see animals like Willy go back to their homes. Seeing those wild animals returning to nature is the best feeling in the world. Diana: El trabajo de Bree es muy importante. Mientras escuchaste su episodio, ¿captaste más ejemplos de “r” mudas? Aquí tienes algunos más: la palabra “recordar”, remember: “remember”, y “mejor”, better: “I know Willy is doing better in the wild”. Australia no solo es conocida por su fauna única, sino también por sus vibrantes ciudades, como Sídney. Sídney es famosa por su icónica ópera, y es donde vive nuestra siguiente narradora, Britta Joregensen. Al igual que Bree, ella no pronuncia las “r”. Pero también notarás que sus vocales pueden sonar distintas, como la “i” en life, “vida”: “life”. ¡Escuchemos su historia! Britta: The Tape had all of my dad's favorite songs. They were old songs — from a long time before I was born. When one side of The Tape finished playing, we took it out, turned it over, and played the other side. We listened to The Tape and sang during so many car rides. Diana: “La Cinta” era un casete, lo que se conoce como un mixtape. Un mixtape es una colección de canciones, normalmente de diferentes artistas, grabadas en una cinta de casete o en un CD. Es lo que se conocería hoy como un playlist. El papá de Britta había grabado “La Cinta” y la había hecho muy personalizada. Britta: I knew every word of every song on The Tape. We called it “The Tape” because it was the only tape in the car. It was “The Tape.” Diana: Pero cuando Britta tenía 12 o 13 años, decidió que ya no quería escuchar la misma música que sus papás. Compró su propio reproductor de CDs, o discman, que venía con su primer par de auriculares, o headphones. Britta: After I got my discman, I could put on my headphones and listen to my own music all the time. I remember going on a two-day road trip with my family. I listened to my new Destiny's Child album again and again, and looked out the window, thinking about my own teenage problems. It didn’t seem important at the time, but my dad and I never listened to The Tape together again. I didn’t know that one day, The Tape was going to become really important to me again. Diana: Britta se crió en las playas de Sídney, en Australia, durante los años 90. Pasaba mucho tiempo en la playa con su familia. Britta: Almost every weekend, during the 1990s and early 2000s, my dad drove me and my sister to the beach. In summer, we played in the sand and swam in the water. In winter, we explored the cliffs by the ocean. Then, on the way home, we bought ice cream and ate it in the back seat of the car. Diana: El padre de Britta se había criado en esas playas también y con su madre surfeaba en los años setenta. Por eso, muchas de sus canciones favoritas eran de esa época, de bandas como ABBA, o The Animals. Britta: The Tape had a lot of songs from the 70s and 80s. I think that was a really happy time in my dad's life. It was when he was young, in love, and enjoying his life surfing at the beach. I asked him about every song on The Tape. Like, for example, why he picked a specific song or what the lyrics of a song meant. Diana: Una de las canciones favoritas de Britta en La Cinta se llamaba The Logical Song, de la banda Supertramp. A su padre le encantaba porque el tema de la canción era cómo pensar por uno mismo. El padre de Britta odiaba que le dijeran cómo pensar; de hecho, dejó la escuela a los catorce años de edad porque no la soportaba. Britta: I loved The Logical Song because it used a lot of big words. I loved learning new words and what they meant. I wasn't like my dad — I loved school! My dad was always so proud of everything I achieved in school. We spent a lot of time talking about the world and how to think independently. Diana: Britta a menudo le preguntaba a su padre sobre su canción favorita, House of the Rising Sun, de la banda The Animals. En ella, un hombre se arrepiente de haber tomado el camino equivocado en la vida. Britta: My dad wasn't like the person in the song. He was grateful for his path in life. He was 42 when I was born, so he was older than a lot of dads. Before my sister and I were born, he didn't know if he would have the opportunity to be a dad, so he enjoyed spending time with us when we were young. I think he learned a lot during the years when he wasn’t a parent, and he wanted to share that knowledge with us. Diana: Cuando la hermana mayor de Britta entró en la adolescencia, empezó a pasar los fines de semana con sus amigos. Así que Britta y su padre iban solos a la playa. Ponían “La Cinta” y para cenar, compraban algo muy típico de Australia: pescado con papas fritas, o fish and chips. Britta: When it was just me and my dad in the car, I got to sit in the front seat and control The Tape. I didn't play the songs I didn’t like. And when the songs I loved came on, I sang as loud as I could. I felt lucky to spend that time in the car with my dad. We played games, and I asked him questions. I usually had sand on my feet and water from the sea in my hair. When we bought fish and chips to bring home for dinner, I always ate some of the chips before we got home. Diana: Ya cuando Britta se hizo adolescente, comenzó a escuchar música más de su generación, como Beyoncé y Rihanna. Pero cada vez que escuchaba una canción de “La Cinta”, en una fies"
