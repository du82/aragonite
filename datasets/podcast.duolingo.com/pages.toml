title = "Episódio 44: Vida em NY - Pizza e Bagels - Duolingo"
description = "Listen to episodes of the Ingles-Portugues Duolingo podcast for compelling, true-life stories that improve your Ingles-Portugues listening and comprehension skills."
full_description = "Episódio 44: Vida em NY - Pizza e Bagels Por Duolingo — quarta, 29 de novembro de 2023 Duas histórias sobre pratos famosos de Nova York e duas pessoas que se esforçam pra manter vivas essas tradições culturais. Clique aqui para baixar o Duolingo, o aplicativo Nº1 do mundo para aprender idiomas. É grátis, divertido e funciona! Como ouvir os episódios Ouça de graça no Spotify ou na sua plataforma preferida. Transcrição Helena: Scott Wiener ama pizza. O sabor, as sensações que ela provoca na boca e o jeito como ela une as pessoas. Scott: It’s not possible to talk about pizza without smiling. Everyone loves pizza! Helena: A pizza em fatias tá no DNA da cultura de Nova York… A massa, o molho, o queijo e os outros ingredientes… Scott: In New York City, we eat while we’re on our way to other places. And in about 90 seconds or less, you can go inside a restaurant, order, and then leave with a hot slice of cheese pizza. For me, that’s the ultimate New York City experience. I love it so much that I made it my career. Helena: Atenção, passageiras e passageiros, welcome to Destinos Duolingo! Eu sou Helena Fruet e vou te guiar nessa viagem. Nesse podcast, vamos explorar a história e a cultura de diferentes cidades do mundo e aprender inglês com os próprios moradores! Eu vou te acompanhar em cada destino e não vou deixar você se perder. Você encontra a transcrição completa de cada episódio em podcast.duolingo.com. Nessa primeira temporada do podcast, embarcamos pra Nova York, a cidade que nunca dorme! Você vai conhecer alguns dos seus 8 milhões de habitantes e explorar lugares que muita gente sempre sonhou em visitar. Hoje temos duas histórias sobre comidas famosas de Nova York — e duas pessoas que se esforçam pra manter vivas essas tradições culinárias. Então vamo lá? Partiu Nova York! Helena: Scott Wiener sempre gostou de pizza, desde criança. Ele cresceu muito perto de Nova York: em Nova Jersey, que fica do outro lado do Rio Hudson. Mas, quando entrou na faculdade, a pizza ganhou ainda mais importância na vida dele. Scott: I played guitar in a band with some of my friends from college. We went on tours around the U.S., and we often ate pizza in different cities. So, I started writing about those experiences. I filled five or six journals with notes about the pizzerias where we ate. Helena: Os amigos de Scott perceberam que o interesse dele por tudo relacionado a pizza só aumentava. Scott: My friends told me about websites that were all about pizza and big pizza events happening in nearby cities. And that’s when I became obsessed with pizza. Helena: Scott estudou a história de diferentes pizzarias. Ele também passou um tempo analisando as variedades de pizza e o que fazia cada estilo ser único — pode ser a massa, ou crust, ou as diferentes temperaturas do forno, por exemplo. Scott: There are so many ways to make pizza. For example, Sicilian pizza has a thick, square crust. And Grandma pizza is the same shape, but it has a thinner crust. Then there’s the classic Neapolitan pizza. It’s baked in a very hot oven for a shorter amount of time, so it’s very soft. Helena: Como a pizza napolitana fica pouco tempo no forno, ela é coberta com pouco queijo e molho de tomate. O nome “napolitana” é porque veio de Nápoles, na Itália. Scott: Many Italian people came to New York City in the late 19th century and moved to a neighborhood that is now called Little Italy. They brought their knowledge of pizza with them. Helena: As primeiras pizzarias de que se tem registro nos Estados Unidos abriram no bairro de Little Italy, em Manhattan, no final do século 19. Depois, outras foram abrindo e viraram pontos de encontro. Os italianos transmitiram pra outras comunidades a paixão pela pizza. E foi a pizza napolitana que inspirou o que hoje são as fatias de pizza, tão famosas em Nova York. Scott: But it’s not the same as Neapolitan pizza. A New York style pizza is bigger and crunchier, usually about 46 centimeters. While a Neapolitan pizza is smaller and softer, usually about 35 centimeters. Tomato sauce and mozzarella cheese are common toppings. Helena: Os toppings são as coberturas ou, no caso da pizza, os ingredientes usados em cima do recheio, como orégano ou pepperoni. O estilo de Nova York é especial, e hoje é um dos tipos de pizza mais famosos dos Estados Unidos. Scott: It quickly became my favorite kind of pizza after I moved to New York City. It’s just perfect. Helena: Pra Scott, Nova York era tipo o epicentro do mundo da pizza. E a pizza é realmente um pilar da vida na cidade. Scott: There’s good pizza everywhere. You can grab a cheap slice at a small shop or go to bigger pizzerias where lots of people hang out. You can also get a pizza at an expensive restaurant. You can spend anything from one dollar to seven dollars on a slice. There are so many different options for pizza in New York City. Helena: Em pouco tempo, Scott virou especialista em pizza — e uma referência pros amigos. Eles viviam pedindo a opinião dele sobre uma certa pizza ou pizzaria. Eles também perguntavam sobre o número de pizzas pra pedir, porque Scott desenvolveu uma fórmula pra calcular a quantidade certinha de fatias pra um determinado número de pessoas. Scott: For every person who wants pizza, you should order two and a half slices. But it’s also good to order more than that because then you’ll have the two most beautiful words in the world: extra pizza. Helena: Mas a vida era mais do que pizza. Uns anos depois de terminar a faculdade, Scott foi trabalhar como coordenador de eventos. Era um trabalho bom e estável. Scott: Then, on my one-year anniversary at my job, one of my colleagues came into my office. She said, “Congratulations on working here for one year! Now you only need to work 24 more years before you can retire!” The idea of spending the next 24 years at that job, waiting to retire, made me very sad. Helena: Depois disso, Scott começou a sentir um desânimo constante. Ele gostava do emprego, mas não entendia como os colegas conseguiam suportar a ideia de continuar num trabalho tão monótono, todos os dias, durante as próximas duas décadas… ou mais. Então no ano seguinte ele pediu demissão. Scott: I had no idea what I was going to do. But I was lucky because my life wasn’t very expensive at that time. So, I was able to stop working for six months and think about what kind of career I wanted. Helena: Scott ia fazer 26 anos. E pra comemorar o aniversário, ele organizou uma excursão por pizzarias de toda a cidade. Scott: I planned to go to a lot of different pizzerias, and I rented a school bus for the day. I even gave the bus driver a paper map, and I circled all of the places I wanted to go. It was a mix of very old pizzerias, like L&B Spumoni Gardens, and places that were newer at the time, like Franny’s in Brooklyn. Helena: No tour pelas pizzarias, Scott contou a história da pizza pros amigos. Scott: We went to places that had all of my favorite styles of pizza. I told my friends about the ovens at the places we went to and about the different ways of baking pizzas. Everyone had a lot of fun. And they told me that other people — people I didn’t know — might be interested in doing a tour like this. But giving a tour to strangers was really scary to me! Helena: Os amigos de Scott levaram a ideia a sério. Mas ele não tinha nenhum interesse em montar seu próprio negócio. Scott: A few months passed, and my friends kept telling me that I needed to start my own pizza tour business. So, I started to listen to them. I researched what I needed to do to start the business. I thought, “If I lose all of my money at the age of 26, at least it’s for pizza.” Helena: Então Scott resolveu arriscar. Em abril de 2008, a Scott’s New York Pizza Tours organizou sua primeira excursão oficial. Scott: I knew I loved pizza, and I knew many other people loved pizza too. So I was confident that it could work, that I could make a career out of pizza. Helena: Depois de um tempo, Scott já tava totalmente imerso na nova rotina de guia turístico. Scott: Every tour meets at a different pizzeria. First, I always try to understand who is in the crowd. So, I ask everyone questions. For example: “What is more important for you: crust or sauce?” And, “What kind of things do you like on your pizza?” I try to understand what everyone is interested in, so I can talk about those things. Like the history of certain crust styles — or why New Yorkers usually eat pizza with only cheese and sauce. So that’s the first part of the tour. Helena: Aí, Scott leva o grupo na primeira pizzaria. Eles passam pela cozinha, aprendem como funciona o forno, comem uma fatia e falam sobre como aquele estilo se encaixa na história da pizza. Scott: Through history, pizza has changed because ovens have changed. When ovens change, it means the ingredients of the pizza change too. And on my tours, I describe how history, culture, and science have affected pizza. Helena: Seis meses depois de abrir o negócio, Scott sentiu que as turnês tavam fazendo sucesso. Scott: A lot of newspapers wanted to do stories about my tours. And people were really excited to learn about the city’s pizza history! Helena: Pizza é um estilo de vida pra Scott. Ele fala de pizza o dia todo e pensa em pizza o dia todo também! E ele bateu o recorde mundial da maior coleção de caixas de pizza: mais de 1.600! Scott: No one else in the world has a pizza box collection like mine. Lots of people have sent me boxes. I have one from Finland with incredible art. And during a trip to Brazil, I got several boxes in the shape of an octagon. Helena: Mas vale lembrar: Scott limita seu consumo de pizza a 15 fatias por semana. Scott: In New York City, there are 16 slices in 2 large pizzas. I don’t want to be the guy who eats more than 2 large pizzas a week, so I only eat 15 slices each week. It’s also because I don’t want to get tired of it. If I ever wake up one morning and I’m not excited about pizza, that’s a huge problem. I hope that day never comes! Helena: Pra Niki Russ Federman, a melhor comida de Nova York não é a pizza. É o bagel. Niki: Bagels with cream cheese or butter can be a simple and inexpensive meal, especially if you’re busy. I think that’s why they’re so popular in New York City. Helena: Em Nova York você pode encontrar todo tipo de bagel. Mas na Russ & Daughters, a loja da família de Niki, os bagels são tradicionais. Niki: You’ll never find jalapeño or fruit bagels at Russ & Daughters. We only have the classics, like plain and “everything bagels.” Helena: O everything bagel, ou “bagel com tudo”, tem vários ingredientes: sementes de papoula, sementes de gergelim, cebola, alho e sal de pretzel. Pra Niki, o bagel é mais que um pão redondo com um buraco no meio. Ela explica que primeiro o bagel é fervido, ou boiled, e depois é colocado no forno. A massa é crocante, ou crunchy. Niki: It’s boiled before it’s baked, and it has a soft but crunchy crust. You can put lots of things on bagels, like cream cheese or smoked salmon. Helena: O bagel and lox, ou “bagel com salmão defumado”, teve origem nas comunidades judaicas da cidade. Com o tempo, ele ficou conhecido e virou um item básico de Nova York. Gente do mundo todo quer provar esse bagel quando vai pra lá. Niki: I think the classic bagel with cream cheese and lox is perfect. I could eat it every day for the rest of my life. In New York City, it’s also the ideal food because it’s not too expensive, it’s quick to make, and it tastes great. Helena: A família Russ tem aperfeiçoado a arte de fazer bagels com salmão defumado por mais de um século. Niki cresceu em meio à rotina e aos aromas da Russ & Daughters, que foi administrada por várias gerações. Niki: My family’s shop still looks the same as it did when I was a kid. It’s a small, narrow space. People come in, take a number, and then give their order when their number is called. There’s a long glass case where you can see all of the smoked fish. On the shelves, there are lots of fresh bagels, crackers, and jars full of things like nuts and olives. Helena: Pra Niki, o cheiro é uma das coisas que deixa a loja especial. Niki: The store smells delicious, like smoked fish and fresh bread. It also smells a little sweet because there are candies and dried fruit in the windows. It’s my favorite smell. Some of our customers tell us that we could sell the smell. We just need to find a way to put it in a bottle! Helena: A vitrine da Russ & Daughters tá muito ligada à cultura e à gastronomia do Leste Europeu. Quando os nova-iorquinos não tinham tempo de cozinhar, eles comiam pratos como o peixe defumado, que já vinha pronto e não precisava ser reaquecido. Os aperitivos frios servidos em casa eram uma ótima opção pros dias corridos ou pra ocasiões especiais. Eles eram vendidos nos appetizing counters, ou balcões de aperitivos. Niki: Appetizing counters became a New York City tradition, and now our shop has so many customers for every big holiday, not just Jewish ones. Helena: As pessoas se espremem no pequeno espaço da Russ & Daughters pra comprar as iguarias que eles vendem, como uma bolacha recheada chamada rugelach, a bolacha preta e branca e o babka, um bolo trançado com chocolate ou canela. Niki: Food is such an important part of the Jewish-American experience. And my family has always been very proud to serve foods that represent New York City. Helena: O produto mais popular da loja durante o ano todo é o bagel com salmão defumado e cream cheese, o bagel and lox. Niki: To make our classic bagel and lox, we start with one of our homemade bagels. We bake our bagels every day; they’re so fresh that we don’t need to toast them. We just slice it in half and put cream cheese on the bagel. After that, we cut very thin slices of smoked salmon, which has a soft texture. Then we put several slices of it over the cream cheese. After that, we put the other half of the bagel on top and cut it in half. That’s a bagel and lox. And many people will eat it right in the store. Helena: Hoje, a Russ & Daughters é famosa pelos bagels, mas nem sempre foi assim. A história da loja começou em 1907, quando o bisavô de Niki, Joel Russ, chegou em Nova York. Niki: My great-grandfather came to the U.S. from Eastern Europe. His sister already lived in New York City, and she helped him get a barrel of salted fish. Then, he sold it on the streets. It was cheap and healthy, and it was a food that was very familiar to many Jewish and Eastern European immigrants in the neighborhood. Helena: O negócio ia bem. Então, ele trocou o barril que usava pra vender peixe salgado por um carrinho de mão. Em 1914, ele abriu a primeira loja física. E conforme o negócio foi crescendo, pediu pras três filhas ajudarem. Niki: My great-grandfather changed the name of the business to Russ & Daughters in 1935 because his three daughters started working there. And future generations continued to manage the shop, including my parents. Helena: Apesar de ter crescido numa loja de comida tão famosa de Nova York, Niki nunc"
