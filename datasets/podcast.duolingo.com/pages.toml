["https://podcast.duolingo.com/episodio-42-vida-em-ny-tradicoes-festivas-pt.html"]
title = "Episódio 42: Vida em NY - Tradições festivas - Duolingo"
description = "Listen to episodes of the Ingles-Portugues Duolingo podcast for compelling, true-life stories that improve your Ingles-Portugues listening and comprehension skills."
full_description = "Episódio 42: Vida em NY - Tradições festivas Por Duolingo — quarta, 15 de novembro de 2023 Nesse episódio, você vai conhecer duas famosas tradições de fim de ano de Nova York e algumas das pessoas que fazem tudo acontecer. Clique aqui para baixar o Duolingo, o aplicativo Nº1 do mundo para aprender idiomas. É grátis, divertido e funciona! Como ouvir os episódios Ouça de graça no Spotify ou na sua plataforma preferida. Transcrição Helena: O balão de hélio do Ronald McDonald pesava quase 240 quilos e media quase 15 metros de altura. E Ann Gault, uma mãe de quatro filhos, segurava as cordas dele como se sua vida dependesse daquilo. Ann: He was one of the giants. And when I was under that huge balloon, I felt really small. It was a totally new feeling for me. Helena: Era novembro de 2009. Ann e mais 75 pessoas seguravam as cordas do gigantesco balão do palhaço do McDonald’s enquanto participavam de um desfile, ou parade. Não era um desfile qualquer. Era o desfile do Dia de Ação de Graças da loja Macy’s, na cidade de Nova York. Ann: My first parade was one of the happiest days of my life. It was just so exciting! I walked with the balloon on some very pretty streets with fancy hotels. I even walked past Central Park, one of the most famous parks in the world. At one point, I heard my youngest daughter, Caroline, shouting, “Mom, mom!” in the crowd of people. I looked up at her, but I couldn’t wave. I needed to hold the balloon during the whole parade. My kids thought it was so cool. I was like a celebrity for a minute. Helena: Atenção, passageiras e passageiros! Welcome to Destinos Duolingo! Eu sou Helena Fruet e vou te guiar nessa viagem. Nesse podcast, vamos explorar a história e a cultura de diferentes cidades do mundo e aprender inglês com os próprios moradores. Eu vou te acompanhar em cada destino e não vou deixar você se perder. Você encontra a transcrição completa de cada episódio em podcast.duolingo.com. Nessa primeira temporada do podcast embarcamos pra Nova York, a cidade que nunca dorme. Você vai conhecer alguns dos seus 8 milhões de habitantes e explorar lugares que muita gente sempre sonhou em visitar! No episódio de hoje, temos duas histórias sobre as comemorações dos dias festivos mais importantes de Nova York. Helena: Ann Gault nasceu na Carolina do Norte, mas adora tudo o que tem a ver com Nova York. Ela é apaixonada por uma das tradições mais populares da cidade: o desfile do Dia de Ação de Graças da Macy’s, ou the Macy’s Thanksgiving Day Parade. Ann: I’ve always loved this parade. It’s an iconic New York City tradition, and for me, it’s a very special part of Thanksgiving. Helena: O desfile acontece no Dia de Ação de Graças, um feriado comemorado na quarta quinta-feira de novembro. As famílias costumam se reunir pra agradecer suas conquistas e preparar um banquete com peru, purê de batata, molho de cranberry, torta, ou pie, de abóbora, entre outras delícias. Ann: Thanksgiving was one of my favorite holidays as a kid, and we always watched the parade on TV in the morning, just like millions of other Americans. Helena: Patrocinado pela rede de loja de departamento Macy’s, o primeiro desfile aconteceu em 1924. Naquele ano, os funcionários caminharam 4 quilômetros até a loja principal, em Nova York. Eles queriam atrair clientes pras compras de Natal. Tinha fantasias, carros alegóricos, bandas marciais, ou marching bands, e até animais do zoológico do Central Park! Com o tempo, o desfile cresceu e passou por mudanças. Hoje, é um grande espetáculo, um dos maiores desfiles do mundo! Ann: I was always fascinated by the parade. I loved the big balloons and the costumes. But the best part was that it was in New York City. I’ve always loved this city, and the parade is a classic New York City tradition. Helena: Ann amava Nova York, mas foi só em 1989, quando tinha vinte e tantos anos, que ela conseguiu se mudar pra lá pra começar sua carreira de jornalista. Ela já adorava o desfile da Macy’s e, agora, finalmente poderia ver o espetáculo de pertinho. Ann: I love the energy of being at the parade in person. It’s different than just watching it on TV. There are so many sounds and smells, and it’s such a beautiful experience. When I saw the balloons for the first time, I was really impressed. They’re so much bigger than they seem on TV. Helena: Uma parte muito importante do desfile são os gigantescos balões de hélio no formato de personagens famosos, como o Bob Esponja ou o Mickey Mouse. Eles chegam a ter cinco ou até seis andares de altura. E pra segurar as cordas dos balões são necessárias até 100 pessoas! Ann: After I started attending the parade, I thought, “Wow, maybe I can be a part of this.” It seemed like such a fun way to experience New York City. But I didn’t know how I could do it. Helena: Durante muitos anos, Ann quis participar do desfile. Mas ela nunca contou isso pra ninguém e não sabia se conseguiria realizar esse sonho. Até que, um dia, o destino deu uma mãozinha… Ann: My husband and I were drinking wine with some friends, and we started to talk about our dreams or the things we’ve always wanted to do. I told them that I wanted to be a part of the Macy’s Parade. My husband was really surprised. It was the first time I talked about it because I never thought it was possible. That’s when my friend said, “I know someone who can help you!” And suddenly, I had a connection. Helena: Essa amiga conhecia uma pessoa que participava do desfile como voluntária, segurando os balões. Essa pessoa disse que poderia indicar Ann — porque pra participar precisava ter indicação. Primeiro ela precisaria fazer um treinamento, ou training, especial, além de ter que cumprir uns requisitos de idade e peso. Ann cumpria todos, inclusive o requisito de querer se divertir. Mas quando recebeu a ligação confirmando que poderia segurar os balões, ela entrou em pânico. Ann: Could I really do it? I needed to go to a training session, but I had four very young kids, so it was very complicated. And I also usually prepare a big Thanksgiving dinner at my house for 20 people. So I wasn’t sure if being in the parade was possible. I thought, “I’m so busy. How am I going to do this?” Helena: Pra muitas famílias nos Estados Unidos, preparar a ceia de Ação de Graças pode levar um dia inteiro — geralmente todo o feriado de quinta-feira. E agora Ann tava preocupada porque se fosse no desfile na quinta de manhã, não ia poder preparar a ceia. Ann: My husband knew that I was really excited to be a part of the parade, so he told me that he could organize everything for Thanksgiving. I immediately felt much better. And the parade was such an amazing opportunity, so I decided to do it. Helena: Como seu marido prometeu cuidar das crianças e da ceia de Ação de Graças, Ann pôde se concentrar nos preparativos pro grande dia. Ann: The morning of the parade was pretty crazy. I woke up at 4:30 a.m. I was too nervous to eat, so I just quietly got ready to go and left. Helena: Era tão cedo que quase não tinha carros nas ruas enquanto ela dirigia pro centro da cidade. Quando chegou, Ann recebeu um macacão pra vestir. Depois, levaram ela pra conhecer a equipe e o capitão, um piloto de aviões que iria pilotar o balão. Ann: On the night before the parade, they fill the balloons with air. Then, they cover them and tie them to the ground. So, in the morning, when it was time for our team to join the parade, we uncovered the balloon, walked under it, and then put it up in the air. Helena: Ann achou que tinha muita sorte porque sua equipe ia levar um dos maiores balões do desfile. Com as cordas nas mãos e o balão gigante do Ronald McDonald flutuando sobre a cabeça, ela desfilou ao lado da equipe toda. Era oficial! Ann não tava só vendo o desfile pela TV ou na calçada. Ela tava lá, no famoso Desfile de Ação de Graças da Macy’s. Ann: It was so fascinating to see the parade in a new way. So many people were part of it, including costume designers, makeup artists, and balloon pilots. And everyone worked so hard to make sure we were all in the right place at the right time. We needed everything to be perfect. Helena: Caminhando embaixo daquele balão, Ann tava tão emocionada quanto os espectadores, que ficaram de queixo caído. Ann: So many exciting things were happening! I saw clowns doing ballet, marching bands, and all kinds of dancers wearing interesting costumes. Helena: Ann participou do Desfile do Dia de Ação de Graças da Macy’s por 10 anos. Ela gostou tanto que até incluiu a experiência no seu currículo. Ann: People who interview me ask, “You were in the parade? That’s so cool!” It will always be something fun to talk about. And who doesn’t love a parade? Helena: Ann diz que sempre vai se sentir parte do Desfile de Ação de Graças da Macy’s, mesmo que não participe mais. Ela ainda acha muito incrível pensar que nunca teria desfilado se não fosse por aquele dia em que falou sobre seu sonho num simples papo com amigos. Ann: Start telling people about your dreams. Someone might be able to make them a reality! Helena: Essa história aconteceu em 1991, na véspera do Ano-Novo. Vamos pra Times Square, uma região cheia de prédios altos e luzes brilhantes, um dos destinos turísticos mais famosos do mundo. No terraço de um arranha-céu, Treb Heining caminhava ansiosamente de um lado pro outro. Faltava 1 minuto pra meia-noite, e ele tava prestes a lançar, ou launch, 900 quilos de confete do topo do prédio. Treb: I was very excited to see how the confetti was going to look. And I needed to launch it at the exact right time. Helena: Todo dia 31 de dezembro, milhares de pessoas se aglomeram na Times Square pra ver uma bola iluminada descer de um arranha-céu na contagem pro Ano-Novo. E naquele ano, Treb teve uma grande ideia pra deixar a festa ainda mais espetacular: jogar um monte de confete de cima de vários prédios ao mesmo tempo. Tudo tinha que ser perfeito! Treb: I was walking around in circles because I was really nervous. I had a radio to communicate with the rest of my team in other buildings. And I said, “Wait. Wait for my instructions.” Helena: Essa celebração de Ano-Novo é vista por milhões de pessoas no mundo todo. Exatamente às 11h59 da noite de 31 de dezembro, uma grande bola brilhante começa a descer de um mastro, ou pole, no topo de um prédio no meio da Times Square. Treb: The ball slowly comes down the pole, and it reaches the bottom at midnight. That’s when the crowd starts to cheer and the party begins. Helena: A tradição de deixar a bola cair, ou drop, vem do começo do século 20, na época das chamadas bolas do tempo, dispositivos que os navegadores usavam pra ajustar seus cronômetros marítimos. Em 1907, o dono do jornal The New York Times construiu uma esfera desse tipo pra comemoração do Ano-Novo na Times Square. A bola pesava 300 quilos e era coberta por 100 lâmpadas. Treb: My earliest memory of New Year’s Eve is being at my grandmother’s house when I was three. I remember watching the ball drop at Times Square on a black-and-white TV. It’s something that the people of New York City are very proud of. Helena: Antes do grande espetáculo de Ano-Novo, Treb já era famoso por saber muito sobre balões. Ele trabalhava com decoração de balões e fazia eles caírem em todo tipo de evento, como no Super Bowl e na cerimônia de abertura dos Jogos Olímpicos de Los Angeles. Treb: I invented balloon columns and balloon arches. We made interesting balloon decorations for parties and we did spectacular balloon drops at political meetings. And we have many years of experience. Helena: Em 1991, um grupo de empresários locais de Nova York se reuniu pra organizar a descida da bola na Times Square – e aumentar a segurança do evento. Treb: Before 1991, the ball drop at Times Square was disorganized and kind of crazy. Shop owners had to cover their windows because the crowds were huge, and people were sometimes pushed through the windows. So, the city decided to improve the New Year’s Eve experience at Times Square. They wanted it to be a safe place for families to watch the ball drop. Helena: Naquele ano, o grupo contratou agentes de segurança pra ajudar a controlar a multidão, mas eles também queriam que a descida da bola fosse mais atrativa visualmente. Então, eles procuraram Treb por causa da experiência dele com balões — e na esperança de que ele tivesse ideias de como tornar aquela véspera de Ano-Novo ainda mais inesquecível. Treb: Times Square is huge! I wanted to use confetti because it could have the biggest impact on such a large area. And you can use it even when it’s cold or raining outside. But I knew it was going to be difficult to make it work. Helena: A Times Square é uma região especialmente complicada porque as ruas se cruzam na diagonal, provocando correntes de vento imprevisíveis. Treb queria que o confete voasse bem alto, mas poderia acontecer de voar bem longe, sem chegar na multidão que esperava lá embaixo. Treb: I wasn’t sure that the confetti was going to be as spectacular as I dreamed. But I was going to try my best. So, I told everyone it was going to be spectacular. Helena: Pra acalmar os nervos, Treb começou a trabalhar num plano detalhado. Primeiro, ele teve que encontrar uns 50 voluntários pra jogar o confete manualmente da cobertura dos arranha-céus, que tinham mais ou menos 200 metros de altura. Treb: Times Square is huge, so we needed to use almost 1,000 kilograms of confetti. We didn’t have a machine that could launch that much confetti, so we decided to do it by hand. Helena: Depois, ele teve que conseguir permissão pra que ele e os voluntários subissem nos oito prédios da Times Square. Treb: I didn’t want to launch confetti from just one or two buildings, I wanted to cover all of Times Square! But it was a lot of work to get permission. I had a formal meeting with the building managers to explain that it was going to be very professional and safe. I told them not to worry. Helena: Depois de vários meses de planejamento, finalmente chegou o grande dia. Treb dormiu bem na noite anterior. Mas quando acordou, ele tava muito nervoso. Treb: On the morning of New Year’s Eve, almost everything was ready. At 7 p.m., I went to a building in the middle of Times Square. It was the perfect place to watch all of the other confetti locations. Helena: Embaixo dele, uma multidão começava a se juntar na Times Square. Tava uma noite gelada. E finalmente, às 11h59, a bola começou a descer lentamente pelo mastro. Treb: The city asked me to launch the confetti 20 seconds before midnight. So that the people watching on their TVs at home could see the confetti, too. So that was important. But it was really difficult because at that time, there were no clocks in Times Square. Helena: Isso foi antes da popularização dos celulares. Então os relógios ainda não tavam sincronizados com o horário oficial. Treb: So I had to estimate as the ball was dropping. When I thought it was the right moment, I said into the radio, “Go confetti!” And then I put my radio down and started laun"
