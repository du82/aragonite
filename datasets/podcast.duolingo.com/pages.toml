full_description = "Episode 107: Traditions iconiques - Fête de la musique - Revisited By Duolingo on Tue 13 Feb 2024 To celebrate France’s love of culture, we’re revisiting some of our favorite episodes featuring francophone artists and performers. This episode, we’ll dive into la Fête de la Musique. Every summer solstice, on this holiday, anyone in France can take to the streets and perform music. But for Fanny, sharing her birthday with this festival was a bit of a curse…until she discovered how to help her favorite band take on the challenge of that special night. How to Listen Listen free on Apple Podcasts or wherever you listen to podcasts. Transcript Ngofeen: Bonjour, dear listeners! For this special season of the Duolingo French Podcast, we’re celebrating the arts. We’re revisiting some of our favorite episodes featuring singers, dancers, actors, and other performers in the Francophone world. Today’s episode is from June 2020, and tells the story of an iconic French tradition: la Fête de la Musique. Every year on June 21, streets all over France open up for a night of music, dancing, and high spirits. Our storyteller, Fanny, has a… unique relationship with this musical holiday. Keep listening to hear her story, and stick around until the end to hear how Fanny celebrated this year’s Fête de la Musique! Ngofeen: It’s June 21st, 1988, and today is Fanny’s 13th birthday. To celebrate, her parents are taking her to visit Paris for the very first time. When she gets there, she can’t believe her eyes. Or ears. Fanny: Les rues de Paris sont pleines de monde. On entend de la musique partout. Il y a des artistes, des danseurs et des musiciens avec leurs instruments. Ils jouent, ils chantent, ils dansent. Ça a l’air spontané… C’est comme si tout le monde avait décidé de descendre dans la rue et de jouer de la musique. C’est incroyable. Ngofeen: Paris is celebrating a special holiday: “La Fête de la musique,” and for the occasion, the city has turned into a giant festival. Music is everywhere… A lone musician or a band stands on every street, every corner, and Fanny and her parents have just arrived in the heart of Paris’s student quarter, the bustling quartier Latin. Fanny: On passe à côté d’une chanteuse, puis d’un violoniste. Il y a plusieurs styles de musique différents que je n’ai jamais entendus. J’adore ça. Nous arrivons dans un restaurant dans le quartier Latin. C’est un restaurant grec et des musiciens jouent de la musique traditionnelle. L’un des musiciens a une guitare pas comme les autres. Mon père m’explique que c’est un bouzouki, une guitare grecque. Ngofeen: Fanny is fascinated by all this strange music and the joy she sees on every face. But what pleases her most is her belief that this beloved national holiday is for her. She is convinced that everybody is here to celebrate her thirteenth birthday. It’s a belief that will shape her relationship to la Fête de la musique for the rest of her life. Fanny: Je regarde le guitariste avec son bouzouki, et les gens qui dansent dans le restaurant et dans la rue et je suis fascinée. Je crois vraiment que tout cela est pour moi. Et c'est formidable. Ngofeen: Bienvenue and welcome to the Duolingo French Podcast — I’m Ngofeen Mputubwele. This season, to help you improve your listening skills and gain a deeper understanding of France, we’re exploring iconic French traditions, les traditions iconiques françaises. Together, we’ll be taking a close look at the daily rituals, savoir-faire and big celebrations that make the French way of life. The storyteller will be using intermediate French and I’ll be chiming in for context in English. If you miss something, you can always skip back and listen again – we also offer full transcripts at podcast.duolingo.com. In today’s episode, we’re headed to Paris, and Lille, to learn how to celebrate France’s most recent holiday, la Fête de la musique. Ngofeen: La Fête de la musique, or Music Day, is a French tradition that has spread across the world. Every year, 700 cities and 120 countries celebrate musicians and music-making. But it all started in France in the early eighties with a political revolution. Fanny: En 1981, pour la première fois, un candidat socialiste a gagné les élections présidentielles en France. François Mitterrand est devenu président de la République. Il a alors décidé d’engager le pays dans un grand mouvement d’ouverture culturelle. L’objectif était de rendre la culture plus accessible. Ngofeen: François Mitterrand, the new socialist president, wanted to change society. So he launched many bold projects, some targeting the economy, and others aimed at French culture. Mitterrand was fond of the arts, so he commissioned a glass pyramid in the courtyard of the Louvre Museum and his Minister of Culture created a new national holiday. Fanny: L’idée de la Fête de la musique, c’est que chacun puisse montrer ses talents de musicien, de danseur ou de chanteur. Tout le monde peut jouer sur les places publiques, dans les parcs, dans la rue ou à sa fenêtre, même les amateurs. C’est comme une grande fête en plein air. Ngofeen: But in 1982, when the government came up with the new holiday, Fanny had a difficult year. Her father had just remarried. She felt she had to share everything with her sister, her brother, and now a stepmother and two additional siblings. Fanny: Dans ma famille, on était cinq frères et sœurs, alors mes parents n’avaient pas beaucoup de temps pour moi. Mais mon anniversaire, c’était ma journée. Ngofeen: Fanny made sure everybody at school knew about her birthday. That year, she was turning seven. So when her school teacher, sa maîtresse, mentioned that date in class, Fanny listened carefully. Fanny: À l’école, la maîtresse nous a demandé : « Qu’est-ce qu’il se passe le 21 juin ? ». Tout le monde a levé la main et a répondu : « C’est l’anniversaire de Fanny ! ». Ça m’a fait très plaisir. Ngofeen: The teacher laughed and she explained that June 21st was also the summer solstice, the first day of summer, and the longest day of the year. In the French countryside, that night had traditionally been celebrated with big bonfires and wild dancing. But now it would be the day for people all around the country to express their creativity through music. Fanny: C’était la première fois que j’entendais parler de cette fête, et je n’étais pas sûre de vouloir partager mon anniversaire avec un solstice et la Fête de la musique… Ngofeen: Fanny asked her father about the new holiday when she got home from school. His response thrilled her. He claimed that he was the one who had convinced the Minister of Culture to create la Fête de la musique…and that he had done it all for her. Fanny: Mon père m’a expliqué qu’il était ami avec le ministre. Il lui avait demandé d’organiser une fête nationale pour mon anniversaire. J’avais sept ans et je l’ai cru. J’adorais l’idée d’avoir une fête rien que pour moi. Ngofeen: Fanny welcomed la Fête de la musique, and so did people all over France. That first year started as an eclectic outburst of creativity and fun. Rock bands played concerts in front of their homes, electro DJs showed their best skills in public parks… Even classical conservatory schools offered outdoor practice sessions and lessons. Fanny: La Fête de la musique a tout de suite été un grand succès. Toute la France a participé : les villages de campagne, les grandes villes, les étudiants, les adultes… Tout le monde est sorti dans les rues pour jouer de la musique ou écouter des musiciens. En passant d’une rue à l’autre, c’était comme si on faisait un voyage musical. Ngofeen: Fanny grew up with la Fête de la musique. And every year, the party grew bigger. Soon it wasn’t just people taking to the streets. Radio stations and local mayors organized big concerts. You could even hear choirs, des chorales, sing. Some people would take a day off to enjoy la Fête to the fullest. Fanny: La Fête de la Musique est un vrai succès populaire. Tout le monde y va et on peut entendre tous les genres musicaux. On se promène dans la ville et on rencontre des musiciens qui jouent du rock ou une chorale qui chante. On peut aussi entendre de l’accordéon ou des chanteurs de R&B. Ngofeen: Little by little, Fanny got to take part in the fun. First, she went with her parents. Then she followed her older siblings to see different musicians in their hometown. Fanny: Le soir de la Fête de la musique, c’était génial. Ce soir-là, j’avais le droit de rentrer tard, même si j’avais cours le lendemain. Ngofeen: In France, on June 21st, the sun goes down at 10 p.m., so it’s fairly safe for teenagers to go out much later than usual. For high schoolers, the night is a rite of passage. Fanny grew up in Lille, a big city in the North of France with a large central square, la Grand’Place. And when she turned 15, her parents gave her permission to stay out until sundown the night of Music Day. Fanny: Quand j’ai eu 15 ans, mes parents m’ont donné la permission d’aller avec des amies en ville. Alors j’allais sur la Grand’Place pour écouter un concert. Il y avait beaucoup de gens qui dansaient et buvaient de la bière. Je me sentais adulte ! Ngofeen: After the big thumping concert, Fanny and her friends went to a bar. It was her big brother’s favorite bar, so Fanny felt very safe there. She listened to rock music and she enjoyed being allowed to hang out with the grown-ups. Fanny: Tout le monde connaissait mon grand-frère, alors je me sentais protégée. J’écoutais du rock, et je dansais. Mes amies et moi, on se sentait grandes et on aimait ça. Ngofeen: As the night was coming to an end, Fanny felt so happy. The air was warm and the sunset was orange and purple. The rock music was thumping… Everyone was grooving. And Fanny wanted to brag that it was all thanks to her. After all, la Fête de la musique was her holiday. But then suddenly, in that moment, it dawned on her. Fanny: J’ai réalisé que c’était un mensonge. Bien sûr, cette fête était pour tout le monde, et pas seulement pour moi… J’étais embarrassée, et je me demandais comment j’avais pu croire ça aussi longtemps. Ngofeen: As a child, Fanny had trusted her father’s story: after all, he was a man with connections and friends who worked in politics. But now, as a teenager, she was struck with an epiphany: la Fête de la musique wasn’t actually for her. She believed it as a child, and since then, she’d never thought to question it. But now, she wanted to confront her father. Fanny: Je suis allée voir mon père et je lui ai dit : « C’était une blague, non ? ». Mon père a ri. Alors nous avons ri ensemble. Mais en fait, j’étais terriblement gênée… Ngofeen: Fanny realized that it had just been a joke. La Fête de la musique had nothing to do with her birthday! She felt silly, and so embarrassed. How could she have believed this for so long? Fanny: Je n'en ai parlé à personne. J’ai gardé ce secret pour moi. Chaque année, au lycée, je faisais la Fête de la musique, comme tout le monde. Mais pour moi, ça n’avait plus rien de spécial. C’était comme si la fête avait perdu un peu de sa magie. Ngofeen: After Fanny turned 18, she went to study at university and she made new friends and new habits. She was the kind of person who liked to show up for the people she loved, especially on their birthdays. Fanny: À l’université, j’ai réalisé que j’aimais faire plaisir à mes amis avec un bon repas. Quand un ami fêtait son anniversaire, je proposais souvent de cuisiner le plat ou le dessert. C’est important pour moi de réunir les personnes que j’aime autour d’une table. Ngofeen: But Fanny also realized she never enjoyed this kind of dinner on her own birthday. She’d always celebrated in a bar or at a concert. And because the north of France is beer country, she drank beers at refreshment stands, des buvettes, and ate fries at food stands in the streets to celebrate la Fête de la musique. Fanny: Ce jour-là, dans les rues, il y a des buvettes et des stands qui vendent de la bière et des boissons. Il y a aussi des foodtrucks avec leurs frites et leurs saucisses. Ce n'est pas un dîner d’anniversaire classique, mais c’est très festif. Ngofeen: And then a young university student who played bass guitar, de la basse, entered Fanny’s life… And once again her birthday took on a different meaning. Fanny: À l’université, j’ai rencontré mon copain, et nous sommes vite tombés amoureux. Il était musicien. Il jouait de la basse. Alors la musique a commencé à prendre une place particulière dans ma vie. Ngofeen: Once she started dating a musician, Fanny began celebrating la Fête de la musique in a new way. She enjoyed hunting for cool bands with her boyfriend… But to her, the coolest band was his. The band had five musicians, including a keyboardist, un joueur de clavier, and a drummer, un batteur. Fanny: Mon petit ami a monté son groupe avec le copain de ma sœur. Il jouait de la basse, et le copain de ma sœur de la guitare. Puis un saxophoniste, un joueur de clavier et un batteur ont intégré le groupe. Ngofeen: By the time Fanny was in her mid-twenties, the band had developed their own repertoire and their own sound. It was a mix of jazz and alternative rock. They called themselves: Spectrum Orchestrum. Fanny loved their music. Fanny: La musique du groupe Spectrum Orchestrum est très énergique, mais aussi très relaxante. Ils ne chantent pas, c’est seulement de la musique, donc ça permet de se concentrer sur l’essentiel : les instruments et les sensations. Ngofeen: Every Fête de la musique in Lille, a lot of bands take to the streets, and it’s hard to capture people’s attention. There’s always another band playing down the street… Plus radio stations bring some big names and build large stages in parks with big thumping loudspeakers. But Fanny and the band knew there were a lot of potential fans for Spectrum Orchestrum. Fanny: J’adore leur style musical. J’étais sûre que si les gens s'arrêtaient pour écouter la musique de Spectrum Orchestrum, ils allaient adorer le groupe. Ngofeen: To attract and retain listeners, they knew the band needed a good location. And they thought they’d found the perfect spot. Renaissance Street was a dark and dirty alley behind an old garage. But it had the potential to funnel in large crowds from the main street. So they asked the owner of the garage to let them set up there. Fanny: On a demandé au propriétaire du lieu si on pouvait utiliser son électricité pour nos microphones et avoir de la lumière. Il nous a dit oui et nous a donné la permission de faire le concert dans l’allée. Alors avec ma sœur, nous avons passé la journée à tout nettoyer et à tout arranger avec les membres du groupe. Ngofeen: Fanny tried to turn the alley into a welcoming, fun place. Fanny: J’avais pris une table et une nappe pour faire un buffet. J’ai préparé à manger et j’ai amené des boissons. Le public a commencé à arriver. C’était l’heure de l’apéritif, et on était prêts. Ngofeen: The show started around 7 p.m. The band began playing and people trickled in. And t"
