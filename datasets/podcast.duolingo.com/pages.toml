["https://podcast.duolingo.com/episodio-90-all-about-accents-voices-from-singapore-and-south-africa-es.html"]
title = "Episodio 90: All about Accents! Voices from Singapore and South Africa - Duolingo"
description = "Listen to episodes of the Ingles-Espanol Duolingo podcast for compelling, true-life stories that improve your Ingles-Espanol listening and comprehension skills."
full_description = "Episodio 90: All about Accents! Voices from Singapore and South Africa Por Duolingo el miércoles 06 de marzo del 2024 Las historias de dos personas que viven en diferentes partes de Singapur y Sudáfrica, y las características únicas de sus acentos. Escúchanos en Suscríbete y escúchanos gratis en Spotify o donde prefieras escuchar tus podcasts. Transcripción Diana: ¡Hola listeners! En esta temporada de “Relatos en inglés”, hemos celebrado la riqueza y diversidad del idioma inglés. Hemos revisitado algunos de nuestros episodios favoritos, destacando acentos únicos de diferentes países y regiones donde se habla inglés. Hoy vamos a visitar dos países con historias de colonia muy diferentes, pero ambos tienen inglés como un idioma oficial. Primero vamos a viajar a Singapur, una isla tropical en el Sudeste Asiático, justo en la punta sur de la Península de Malaca. Es una ciudad, pero también es todo un país, con decenas de pequeñas islas a su alrededor. Durante más de 100 años, hasta 1963, formó parte del imperio británico. Su población es muy diversa. Así que, aunque la mitad habla inglés y este es el idioma principal en las escuelas, Singapur tiene otros tres idiomas oficiales: chino mandarín, malayo y tamil. Esta mezcla de culturas ha influido el acento inglés de Singapur, y ha creado una variedad coloquial única de inglés llamada Singlish. Todavía se notan bastantes rastros del acento británico, así que cuando escuches a nuestra primera narradora, Sarah Huang Benjamin, fíjate si notas cómo omite el sonido de algunas “r” como con este término para los centros de vendedores ambulantes, o hawker center: “hawker center”. Ahora, vamos a conocer a Sarah y aprender más sobre su vida creciendo en Singapur. Diana: Sarah es una escritora gastronómica y presentadora de televisión que nació y creció en Singapur. Al menos una vez a la semana, almuerza en uno de los varios centros de vendedores ambulantes, o hawker centers: los tan conocidos puestos de comida al aire libre de Singapur. Entre el ruido y los olores, comida salteada, o stir fried food, y todo tipo de especias, o spices, se trata de una verdadera experiencia sensorial. Sarah: When you enter a hawker center, the first thing that you notice is the sound. You hear people cooking and customers shouting their orders and trying to find seats. Then, you smell the food: stir-fried garlic, fish, Indian spices, and sweet coconut milk. Diana: Hawker es otra palabra que se utiliza para nombrar vendedores ambulantes, generalmente elevando su voz para llamar a los potenciales clientes a su puesto. En los centros de vendedores ambulantes, los singapurenses como Sarah disfrutan de la comida rápida y deliciosa de todo el continente asiático. Hay fideos, o noodles, arroz y mucho más. Sarah: It’s my job to write about food from Singapore. But it’s still really hard for me to decide what to eat at a hawker center. There are so many options, including curry, fresh noodles with pork or chicken, and rice bowls. And whatever I choose, it’s always so delicious. I’ve always loved the hawker centers, but I wasn’t always a Singapore food expert. I had to work really hard to learn about the food from my country. Diana: Welcome, les damos la bienvenida a “Relatos en inglés”, un podcast de Duolingo. Soy Diana Gameros. En cada episodio podrás practicar inglés a tu propio ritmo, escuchando historias reales y fascinantes, contadas por las personas que las vivieron. Los protagonistas hablan en un inglés sencillo y fácil de entender para quienes están aprendiendo el idioma. En cada capítulo, yo te acompañaré, para asegurarme de que entiendas todo. También ofrecemos transcripciones completas en podcast.duolingo.com. Diana: Singapur es un país cálido y húmedo en el extremo sur de Malasia. Todo el país está formado por una gran ciudad, en una isla repleta de famosos jardines floreados y rascacielos futuristas. Sarah es una de los casi seis millones de habitantes que consideran a Singapur su hogar. Sarah: Around the world, people don’t always know much about Singapore. Some people think Singapore is very modern, like it’s from the future. But it’s actually modern and traditional. Yes, there are a lot of shiny, new buildings in Singapore, but there’s also a lot of history and tradition. Diana: Durante más de 100 años, Singapur fue una colonia británica hasta que obtuvo su independencia en 1965. Como país recién independizado, es llamativamente diverso y multicultural, con grandes comunidades malayas, chinas e indias. Tal es así, que cada grupo trajo sus propios dialectos, religiones y, por supuesto, sus propias tradiciones culinarias. Sarah: In Singapore, we are very proud of our food. Our country isn’t very old, so our food is a way for us to create a national identity. If you ask a Singaporean, “What is Singaporean food?” they can describe it immediately. A lot of our favorite dishes are actually from other parts of Asia, but when they came to Singapore, they changed. And that is why Singapore dishes are so unique. They are a mix of cultures and recipes. For example, there’s a Singaporean dish called mee rebus. It’s a spicy sauce with noodles, egg, shrimp, sweet potato, and fried onion. It’s a combination of Malay, Indonesian, and Chinese food. Diana: Desde que tiene memoria, Sarah está profundamente enamorada de la comida, especialmente de la comida de Singapur. A medida que fue creciendo, comer la deliciosa comida local en los centros de vendedores ambulantes, la inspiró a empezar a cocinar. Pero los únicos libros de cocina que encontró eran europeos. Sarah: When I was around eight years old, I started to learn how to cook by reading books. But there weren’t a lot of Singaporean recipes in books at that time. And it was before the Internet, so I couldn’t just look online. It was sad because I loved Singaporean food so much. Diana: A pesar de no encontrar en los libros los platos tradicionales de Singapur que amaba, Sarah aprendió a cocinar los platillos de su familia. Uno de los platos favoritos de Sarah era sencillo: lo llamaban arroz con pollo, o chicken rice. Hervido, o boiled, el pollo se coloca sobre un colchón de arroz blanco. Y aunque nunca cocinaban arroz con pollo en casa, la familia de Sarah lo comía frecuentemente, comprándolo en los hawker centers. Sarah: I can eat chicken rice three times in one week and never get tired of it! Basically, it’s just boiled chicken, which doesn’t sound delicious, but it really is! The chicken is cooked perfectly, and it’s very soft. Diana: El arroz es la estrella del plato. Se cocina con grasa de pollo, ajo, chalotes y hierba limón. Es comida que te hace sentir bien, o comfort food. Sarah: If you look at it, it’s white chicken on white rice. It doesn’t look like it has a lot of flavor, but it does! It’s my favorite comfort food because it’s warm and delicious, but it’s also simple. To me, it tastes like home. And it makes me feel connected to my culture. Diana: La madre de Sarah es china y su padre es blanco y británico. Y aunque ella es singapurense, también es de raza mixta, o mixed race. Ella percibía que los demás la veían de una manera distinta, dependiendo de en qué lugar del mundo estuviera. Como en 2008, cuando se fue a estudiar a Escocia. Sarah: I thought if I moved to the United Kingdom, I would be very comfortable because when I was growing up in Singapore, people always thought I was British like my dad. But when I went to Scotland, it was the opposite! Because I’m mixed race, everyone I met in Scotland seemed to think I was just “Asian.” They didn’t really know about Singapore, and they asked me about other languages I don’t even speak. Diana: En Escocia, cuando llegó el Año Nuevo chino en 2009, Sarah extrañaba las comidas que disfrutaba durante esa época tan especial en Singapur. Allá el Año Nuevo chino es una festividad muy popular. Por eso decidió cocinar un plato de comida de Singapur para sus amigos de la universidad. Sarah: It was so annoying because I couldn’t make my food taste like the food back in Singapore! I wanted to introduce all my friends to my culture with this meal. But they just thought it was Chinese food! The only recipes I could find online were for foods I didn’t usually eat at home or in hawker centers, and the foods that were more familiar to me didn’t taste right. I felt so sad. Diana: Sarah estudió en el extranjero durante cinco años. En 2012, cuando regresó a Singapur para finalmente vivir cerca de su familia y amigos, tenía una percepción diferente sobre su tierra natal y sobre la comida. Sarah: I always felt like I was a little different from everyone else. First, when I was growing up in Singapore, and then when I went to study in Scotland. When I came back home, I really wanted to learn everything about my country’s food to feel more connected to my culture. Diana: Después de su regreso a Singapur, Sarah decidió dedicarse seriamente a estudiar el patrimonio cultural que es la escena gastronómica de su país natal. Y particularmente a los tan amados centros de vendedores ambulantes. Comenzó a trabajar con sus padres que eran antropólogos, o anthropologists. Sarah: Both of my parents are anthropologists. They started a research project, studying Singapore’s hawker centers, and they asked me for help. It was the perfect time because I really wanted to learn more about my country and its food. So I said, “Absolutely, let’s do it!” Diana: Sarah y sus padres comenzaron a visitar a los vendedores en sus puestos de comida, o stalls, y a entrevistarlos sobre sus métodos en la cocina, sus tradiciones y sus historias personales. Para Sarah, conocer el trasfondo de estas historias significó un arraigo mayor a su país natal. Sarah: As we visited each hawker center, I learned more about Singapore’s culture and history. And I also learned about the dishes that I loved eating! One of the places we visited was a stall owned by a cook named Mr. Tan. He sells a pork dish called kueh chap. It’s one of my favorite dishes. Diana: Cuando Sarah pidió kueh chap, seleccionó las partes del cerdo que quería y luego observó cómo el Señor Tan las sacaba de la olla y las picaba. El hombre sirvió el plato con salsa picante y fideos. Luego, Sarah se sentó junto a él y le preguntó más sobre su oficio. Sarah: As I listened to Mr. Tan, I realized he was a great chef. A lot of people don’t think that kueh chap is a very interesting dish, but Mr. Tan talked about it with passion. He learned to make it from his father, in a small shop. Singapore is full of these stalls that have been owned by families for many generations. And my research showed that they are an important part of Singaporean history and food culture. Diana: Después del proyecto de investigación sobre los centros de vendedores ambulantes, la pasión de Sarah por la escena gastronómica de Singapur continuó. A medida que aprendió sobre la historia y los matices de cada plato, comenzó a jugar con sus propias innovaciones. Eso le permitió afianzar su identidad singapurense. Sarah: I think the project of learning about Singapore’s food is a way to connect with my culture. Sometimes I still worry that other people don’t see me as Singaporean because of my mixed race background. But then I remember that Singapore is full of people like me — diverse people from different parts of the world. And now I’m an expert on Singapore’s food, which is such an important part of our culture! And that makes me feel confident. I’m Singaporean and I’m proud of it. Diana: Como hemos visto esta temporada, el imperio británico se extendió por todo el mundo, y el inglés ha pervivido en muchos lugares diferentes. Más de 1300 millones de personas hablan inglés como idioma principal o secundario en todo el mundo. Sí, ¡1300 millones! De ellos casi 5 millones viven en Sudáfrica, en la punta sur del continente africano. Sudáfrica es un país multicultural, con 12 idiomas oficiales. Aunque muchas personas hablan más de un idioma, el inglés lo usan aun diferentes culturas y razas. Fue introducido en el siglo XVII, cuando los británicos llegaron al Cabo de Buena Esperanza. Es muy interesante cómo el inglés jugó un papel en la lucha contra el racismo y el apartheid a mediados del siglo XX. Al principio, los supremacistas blancos que discriminaban a las personas negras, lo eliminaron del gobierno. Esos supremacistas hablaban afrikáans, es una lengua germánica derivada del neerlandés, que desarrollaron los colonos holandeses, alemanes y franceses en el siglo XVII. Pero muchos movimientos de liberación negra usaron el inglés para poder comunicarse entre ellos y con el mundo. En nuestra próxima historia, vas a escuchar a Zandi Ndhlovu hablar sobre su relación con el mar. Similar al acento australiano que escuchamos anteriormente esta temporada, notarás que en el inglés de Sudáfrica no se pronuncia la “r” en medio de algunas palabras. Por ejemplo con “practicar esnórquel” o snorkel, Zandi lo dice así: I’d always wanted to snorkel. Tampoco suelen pronunciar la “r” al final de las palabras, por ejemplo con “agua”, o water, dice I jumped in the water. Diana: Zandi nació y creció en Sudáfrica, un país rodeado por el mar. Pero aunque sabía que el mar estaba allí, no llegó a ver el océano cuando creció… Zandi: I grew up in Soweto, a community in the city of Johannesburg, which is the capital of South Africa. The closest beach was six hours from my town. I was 12 years old when I stepped into the ocean for the first time. Diana: Zandi dice que muchas personas negras en Sudáfrica le temen al océano por razones históricas, incluida la trata de esclavos por mar. Además, está el apartheid, que era un sistema de segregación racial que discriminaba a los ciudadanos de raza negra. Durante décadas, a los sudafricanos negros se les negó la igualdad de derechos y el acceso a muchos lugares, incluidas las playas. Como resultado, el miedo al mar se transmitió de generación en generación. La madre de Zandi siempre les recordaba a ella y a sus hermanos que se quedaran en zonas de poca profundidad. Zandi: Black South Africans generally did not have access to the ocean as a place to relax and have fun. My mother always made sure that the water did not go past our ankles. We were told there were snakes in the sea, and if we went swimming, the white waters would take us away… Diana: Zandi tuvo su primera experiencia nadando en la escuela. No le fue muy bien. Zandi: My classmate knew how to swim, so the plan was to ride on her back across the pool. But when we got to the deep part of the pool, she made a turn, and I fell off her back and she kept swimming. My teacher had to pull me out of the pool. After that happened I taught myself how to swim! Diana: Pero a pesar de que Zandi aprendió a nadar, el océano todavía le resultaba ajeno. Y dado que vivía a seis horas de distancia de la costa, no era un lugar en el que pensara mucho. Pero, a los veintiocho años, el matrimonio de Zandi comenzó a desmoronarse… y es entonces cuando el océano irrumpió en su vida d"
