full_description = "Episode 104: La comédienne de balcon (The Balcony Performer) - Revisited By Duolingo on Tue 23 Jan 2024 To celebrate France’s love of culture, we’re revisiting some of our favorite episodes featuring francophone artists and performers. This episode, the story of Marie, a stage actor who found a way to keep French theater alive during the Covid lockdowns. Stick around until the end for an update on what Marie has been up to since the first episode aired! Read more… Episode 103: Le clown « undercover » (The Undercover Clown) - Revisited By Duolingo on Tue 16 Jan 2024 To celebrate France’s love of culture, we’re revisiting some of our favorite episodes featuring francophone artists and performers. This episode, the story of David, an engineer by day and French clown by night. Stick around until the end for an update on what David has up to since the first episode aired! Read more… Episode 102: La joie du cancan (The Joy of Cancan) - Revisited By Duolingo on Tue 09 Jan 2024 To celebrate France’s love of culture, we’re revisiting some of our favorite episodes featuring francophone artists and performers. This episode, the story of Monika, who has been dancing the French Cancan in Paris since the 1960s. Stick around until the end for an update on what Monika has been up to since the first episode aired! Read more… Episode 101: The Secret Life of Josephine Baker - Josephine : L’héroïne By Duolingo on Tue 14 Nov 2023 Josephine embarks on perilous spy missions…and her wartime service brings her face to face with the man who inspired her to join the Resistance. With Ariana DeBose. Read more… Episode 100: The Secret Life of Josephine Baker - Josephine, La résistante By Duolingo on Tue 07 Nov 2023 With France under German occupation, Josephine takes refuge at her sanctuary, Les Milandes. Until the enemy comes knocking at the gates. With Ariana DeBose. Read more…"
