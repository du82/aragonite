["https://podlove.org/contact"]
title = "Contact | Podlove"
full_description = "Contact usPodlove is an open initiative and we are happy about your requests and questions. He are the points of contact and information resources we’d like you to use to make things easy for us and you.Podlove Community: General support with Podlove software and specsMany requests are just general questions or you are looking for some support to get our technologies and software to run the way you want.For these kind of requests, your first stop should be the Podlove Community which is an open web forum. Get an account and select the proper category. All the team Podlove members and a larger community around the project is following the discussions and is willing to help. Primary language is english but we process requests and German too (keep in mind english requests will better serve the international community and will widen the number of people that can help).As a Germany-based project we also have our eyes at the exceptionally busy and supportive For these kind of requests, your first stop should be the Sendegate community site which also includes a dedicated Podlove category where you can discuss all things Podlove in German.Professional support and private requestsIf you have any other private request or want to get into some kind of collaboration with us either contact us via Twitter DMs or send us an e-mail at podlove@podlove.org."
