["https://podlove.org"]
title = "Home | Podlove"
full_description = "PodlovePodcast Publishing made easyPodlove is a group of Wordpress plugins and allows you to self-host your podcast. With Podlove you become an active part of an open, independent internet. You are in full control of your content and do not depend on a third-party hosting-company.Podlove PublisherOnce set up the Podlove Publisher lets you release new episodes with elegance and ease. Our clean and slim UI integrates seamlessly into your well known Wordpress environment and makes publishing a podcast as easy as publishing a blogpost.Read more ...Podlove Web PlayerPodlove Web Player is a HTML5 based web player for audio and video media files that is optimized and extended for the specific needs of podcasters. This player is the integrated player for the Podlove Podcast Publisher but can be used independent from it.Read more ...Podcast Subscribe ButtonIntegrate your RSS-Feed on any website with this simple widget. With one click on the “subscribe”-button it is super easy to pass exactly the right URL to the podcast app of your listeners choice.Read more ...Great PluginGreat Open Source Plugin for having a free, but complex podcasting suite.benhartwicheasy to use, free, no cloud dependenciesThis plugin is really easy to use and works as expected. The podcast pages as well as the podcast feed look very good and contain all information. There’s a good player included and it combines well with the “Podlove Subscribe Button”.rahra0Nice ProjectI’ve been using the player for many years. The project is open source and is maintained very lovingly by only a few people. I am thoroughly satisfied.Sven de VriesAmazing and quick to integrateI’ve blocked an hour this evening to peek into podlove publisher and get an idea of what efforts I will require to publish my (first) podcast. It blew me away, that it took me less than an hour to get all the stuff up and running.sv3n.spandauPodcasts using Podlove softwareand many more..."
