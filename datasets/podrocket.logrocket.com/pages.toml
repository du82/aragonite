title = "PodRocket - A web development podcast from LogRocket - Brendan Downing"
full_description = '''Brendan Downing Co-Host of PodRocket - A web development podcast from LogRocket Director of Product Engineering at LogRocket Brendan Downing has hosted 16 Episodes. Aviator with Ankit Jain September 2nd, 2022 | Season 2 | 35 mins 8 secs automation, engineering productivity, workflows Aviator is a suite of tools to avoid broken builds, manage stacked PRs, simplify cumbersome merge processes, and suppress flaky tests. Ankit Jain, Co-Founder and CEO at Aviator, joins us to talk about his experience leading high-growth teams, how Aviator is improving engineering productivity for teams, and more. Speeding up the supply chain using commercial vehicle data with Jin Zang and Dhruv Gupta July 8th, 2022 | Season 2 | 37 mins data, universal data platform, vehicle applications Axle is a universal data platform for trucking and supply chains that makes developing universal vehicle applications easy. We talk to Jin Zang and Dhruv Gupta, co-founders of Axle, about how Axle integrates across providers seamlessly, reduces development time and costs, and enables new vehicle applications. Building data-driven APIs at the Edge with Rob Sutter June 3rd, 2022 | Season 2 | 45 mins 9 secs apis, edge computing, serverless In this episode, we talk to Rob Sutter, Head of Developer Advocacy at Fauna, about how to build data-driven APIs at the Edge, Fauna, and more! Compiling and bundling JavaScript with Michele Riva May 25th, 2022 | Season 2 | 29 mins 1 sec frontend development, javascript, web development We talk to Michele Riva, Senior Software Architect for Nearform, about his recent BeJS conference talk, "Compiling and bundling JavaScript," including why it's difficult and how to make it painless. Nuxt 3 with Daniel Roe May 17th, 2022 | Season 2 | 39 mins 46 secs nuxt, vue, web development With Nuxt 3 set to release its stable version in June, we talk to Daniel Roe, Nuxt core team member, about what Nuxt 3 has to offer, including the new server integration and developer experience improvements. Graphite with Tomas Reimers and Greg Foster May 11th, 2022 | Season 2 | 36 mins 12 secs business, code review, developer experience, startup, web development Tomas Reimers and Greg Foster join us to talk about Graphite, an open-source CLI and a code review dashboard built for engineers who want to write and review smaller pull requests, stay unblocked, and ship faster. We talk about developer workflows, the pivot from Screenplay to Graphite, Graphite's recent Series A announcement, and more. Gitpod with Chris Weichel May 10th, 2022 | Season 2 | 38 mins 40 secs development environment, gitpod We talk to Gitpod CTO and host of the DevX Pod, Chris Weichel, about building Gitpod from the ground up, how Gitpod essentially turns READMEs into code, and the future of development environments. RedwoodJS: Part 2 with Amanda Giannelli May 3rd, 2022 | Season 2 | 26 mins 32 secs javascript, open source, redwoodjs Redwood is a fully integrated, end-to-end, production-ready, fully tested framework. We talk to Amanda Giannelli, Software Engineer at Auth0 and a member of the RedwoodJS core team, about Redwood V1 and more. 1Password with Andrew Beyer April 20th, 2022 | Season 2 | 40 mins 7 secs frontend, security, web development In this episode, we talk to Andrew Beyer, senior engineering manager at 1Password, about how 1Password helps people generate and store unique passwords, how 1Password's engineering org has evolved, and the future of passwords. Flightcontrol with Brandon Bayer April 12th, 2022 | Season 2 | 34 mins 28 secs frontend development, javascript, web development, webdev In this episode, we talk with Flightcontrol's CEO and Cofounder Brandon Bayer about how Flightcontrol is making it easy for developers to deploy scalable, secure applications without any DevOps, how it compares to Heroku, and what it was like going through Y Combinator. Solo.io with Brian Gracely March 25th, 2022 | Season 2 | 31 mins 26 secs career, product management, product strategy Brian Gracely, VP of Product Strategy at Solo.io and co-host of The Cloudcast, joins us to talk about service mesh management, what it's like to host a podcast for twelve years, and what a career in Product Strategy looks like. Accessibility with Ben Myers March 11th, 2022 | Season 2 | 39 mins 20 secs a11y, accessibility, web development Ben Myers is an accessibility advocate, a Software Engineer at Microsoft, host of Some Antics (a weekly Twitch show), and a moderator on both the Lunch Dev Discord and the Frontend Horse Discord. Ben joins us on PodRocket to talk about all things accessibility, streaming, and more. Hyperscaling and engineering management with Dave Hauenstein March 2nd, 2022 | Season 2 | 40 mins 19 secs engineering, management, startups Dave Hauenstein, VP of Engineering at Particle Health, joins us to talk about managing engineering teams, strategies around building an organization, what it's like scaling teams quickly, career ladders, and more. Git and monorepos with Derrick Stolee February 22nd, 2022 | Season 2 | 41 mins 10 secs development, git, tech, web development We talk to Derrick Stolee, Principal Software Engineer at GitHub, about monorepos, finding pain points of Git, Git performance at scale, what Git will look like in the future, and more. Benthos and blobfish with Ash Jeffs February 9th, 2022 | Season 2 | 41 mins 55 secs open source, software engineering, tech, technology, web development We talk to Ash Jeffs about Benthos, a declarative data streaming service with a unique mascot and documentation that is both informative and entertaining. In this episode, we discuss stream processing, burnout, and the blobfish. Building technical, open-source, and inclusive communities with Hannah Neil February 4th, 2022 | Season 2 | 36 mins 20 secs community management, frontend development, frontend web development, marketing, software engineering, tech, technology, web development We talk to Hannah Neil, Senior OSS Community Manager at NGINX and former Technical Community Manager at Postman, about creating a career in community management for API-focused products, the difference between community stewardship and community management, and inclusion in technical communities.'''
