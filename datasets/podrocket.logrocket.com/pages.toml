title = "PodRocket - A web development podcast from LogRocket - Noel Minchow"
full_description = "Noel Minchow Co-Host of PodRocket - A web development podcast from LogRocket Software Engineer at LogRocket Noel Minchow has hosted 134 Episodes. Building Async UIs without the hassle with Dev Agrawal February 13th, 2025 | Season 4 | 28 mins 4 secs ui In this episode of PodRocket, Dev Agrawal, dev advocate and developer, talks about building efficient asynchronous UIs, the challenges and solutions for handling complex state management, utilizing React and Solid frameworks, and the potential of suspense boundaries and transitions in modern web development. Make the web weird again with Elian Van Cutsem January 16th, 2025 | Season 4 | 22 mins 38 secs web development Elian Van Cutsem, leader of dev relations at React Bricks, talks about making the web fun and weird again! In this episode, we discuss quirky APIs like the Battery API, WebHID, and WebMIDI, balancing productivity with creativity, and share tips on how to inject joy into web development projects. 8 things you should know about microfrontends with Florian Rappl January 9th, 2025 | Season 4 | 29 mins 12 secs microfrontends Florian Rappl, solutions architect at smapiot GmbH, joins the podcast to give insights on micro frontends, discussing the misconceptions, architectural patterns, challenges, and exciting benefits of using micro frontends over traditional monolithic applications. Rocket Surgery 2024: Year in review December 19th, 2024 | Season 4 | 38 mins 12 secs rocket surgery Join us on PodRocket's yearly wrap-up episode as Emily and our hosts— Paige, Noel, Josh, and Paul—discuss significant tech trends of 2024 and predictions for 2025. Topics include AI advancements, React development, the potential impact of Void0, and the controversy surrounding Oracle's JavaScript trademark. Mastering Dependency Management with Carmen Huidobro December 5th, 2024 | Season 4 | 29 mins 28 secs Carmen Huidobro shares her journey and insights on effectively managing dependencies in React project, discussing the challenges and strategies for keeping a codebase up-to-date, including auditing and upgrading dependencies. She also talks tools and techniques that can simplify the process! TanStack and TanRouter with Tanner Linsley [Repeat] November 28th, 2024 | Season 4 | 30 mins 34 secs tanstack In this Thanksgiving repeat episode, Tanner Linsley, creator of TanStack and co-founder at Nozzle, dives into the evolution and philosophy behind TanStack, his work on TanRouter, and shares insights on the importance of type safety in routing within web development. Component composition with Dominik Dorfmiester October 24th, 2024 | Season 4 | 19 mins 3 secs react In this episode, Dominik Dorfmeister, TanStack maintainer, joins us to discuss component composition in React. He discusses breaking components apart, managing conditional rendering, and the benefits of early returns in improving code readability and maintainability. Cloudflare Workers, OpenNext with Brendan Irvine-Broque October 10th, 2024 | Season 4 | 33 mins 31 secs cloudflare Brendan Irvine-Broque, Director of Product at CloudFlare, about the latest updates to CloudFlare Workers, including persistent logging, service bindings, and the cutting-edge Hyperdrive. Discover how these innovations are shaping the future of web development and deployment. Astro 5 with Matt Kane October 9th, 2024 | Season 4 | 31 mins 22 secs astro Matt Kane, core maintainer for Astro, discusses the exciting new features in Astro 5. He talks about the content layer API, server islands, and the future developments that Astro users can look forward to. SSR performance, Remix and ChatGPT, and favorite new tools September 26th, 2024 | Season 4 | 37 mins 34 secs ai, remix, ssr performance In this panel episode, our hosts dive into the latest tools and frameworks, AI integration, the performance bottlenecks of server-side rendering, and more. Tune in to hear hot takes and insights from our industry experts. TanStack and TanRouter with Tanner Linsley September 19th, 2024 | Season 4 | 30 mins 34 secs tanstack Tanner Linsley, creator of TanStack and co-founder at Nozzle, dives into the evolution and philosophy behind TanStack, his work on TanRouter, and shares insights on the importance of type safety in routing within web development. The invisible hand of React performance with Ivan Akulov September 4th, 2024 | Season 4 | 32 mins 23 secs react Ivan Akulov, Senior Performance Engineer at Framer, discusses optimizing React performance and major advancements in React, including hooks, concurrency, and the crucial invisible performance enhancements that make modern web applications smoother and faster. Exploring Node.js with David Neal August 29th, 2024 | Season 4 | 27 mins 29 secs node.js David Neal, developer advocate and Asana content creator, discusses his talk, The Illustrated Guide to Node.js. David shares insights from his 10-year journey with Node.js, discussing its origins, use cases, and why it remains a vital tool for developers, giving insights into JavaScript's evolution and practical tips for navigating the Node.js ecosystem. AI for React developers and beyond with Alexandra Spalato August 7th, 2024 | Season 4 | 29 mins 37 secs ai Alexandra Spalato, AI integration specialist and frontend visionary, discusses how AI is revolutionizing the workflow for React developers, the indispensable tools making development faster and more efficient, and the exciting possibilities AI opens up for the entire software development process. The future of serverless is WASM with David Flanagan July 25th, 2024 | Season 4 | 34 mins 15 secs wasm David Flanagan, founder of Rawdoke Academy, discusses why WebAssembly (WASM) could be the future of serverless technology and explores the evolution, benefits, and potential of WASM in transforming server-side applications across various environments. The Rise of Serverless Fullstack with Brian Leroux July 24th, 2024 | Season 4 | 32 mins 50 secs serverless fullstack In this episode, Brian LeRoux, co-founder of Begin.com, discusses the evolution and rise of serverless full stack development. Brian shares insights on the history and future of JavaScript, the benefits of serverless architecture, and how front-end developers can leverage these technologies to build scalable and maintainable applications."
