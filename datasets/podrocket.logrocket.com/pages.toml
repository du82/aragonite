eb development We welcome on The Primeagen, content creator, Twitch streamer, and all-around fun internet guy, to give his take on all the latest trends in web development. Turborepo and Turbopack with Anthony Shew January 18th, 2024 | Season 4 | 32 mins 35 secs turbopack, turborepo In today's episode, Anthony Shew, Turbo DX at Vercel, joins us to discuss Turborepo 1.11, Turbopack in 2024, and more. Rocket surgery: 2023 in review December 21st, 2023 | Season 3 | 39 mins 42 secs javascript, web development Our panel of hosts come together for one last episode of 2023, reviewing all the past events of the year, what they loved and what they hated, and what they’re looking forward to in 2024. Modern CSS in real life with Chris Coyier October 17th, 2023 | Season 3 | 43 mins 35 secs css We welcome back THE CSS guy, Chris Coyier, founder of CSS Tricks and co-founder of CodePen, as he talks to us about why he loves CSS, how to use the newest features of CSS, understanding colors, and more. Astro 3.0 with Matthew Phillips and Ben Holmes August 30th, 2023 | Season 3 | 33 mins 32 secs astro With Astro 3.0 out today, Astro co-creator Matthew Phillips and Ben Holmes, dev on the Astro team, come to talk about the new features, road map, and more. Your next component with Dan Mall August 8th, 2023 | Season 3 | 38 mins 24 secs design systems Learn about design systems as we talk to Design System University founder Dan Mall about his Config 2023 talk, “Your next component.” Supabase in 2023 with Jon Meyers June 2nd, 2023 | Season 3 | 18 mins 55 secs resumable uploads, supabase auth, supabase edge runtime Jon Meyers talks to us about Supabase Edge Runtime, Resumable Uploads, Supabase Auth, and more! Listen now. Vercel with Lee Robinson May 17th, 2023 | Season 3 | 39 mins 32 secs vercel, vercel secure compute, vercel spaces, vercel storage Lee Robinson, VP of Developer Relations at Vercel, joins us to talk about the suite of products launched earlier this month. We cover Vercel Storage, Vercel Secure Compute, Vercel Spaces, and more. React and frontend development with Josh Comeau April 20th, 2023 | Season 3 | 23 mins 32 secs ai, frontend development, react Will AI take our jobs? Is React still a good choice? Josh Comeau joins us to talk about React, the future of web development, and more."
