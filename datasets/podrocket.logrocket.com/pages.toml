full_description = "Paige Niedringhaus Co-Host of PodRocket - A web development podcast from LogRocket Website Twitter LinkedIn Paige is a full stack software engineer with a focus on frontend development. She also writes and speaks about web development, JavaScript, and technology. Paige Niedringhaus has hosted 27 Episodes. Relatively New Things You Should Know about HTML with Chris Coyier January 30th, 2025 | Season 4 | 40 mins 26 secs html Chris Coyier, co-founder of CodePen, talks about the evolving landscape of HTML heading into 2025. He delves into topics like the slow evolution of HTML compared to CSS and JavaScript, the importance of backwards compatibility, new HTML elements and pseudo-elements, and the potential of declarative shadow DOM for server-side rendering in web components. Universal React with Mo Khazali January 23rd, 2025 | Season 4 | 36 mins 9 secs react Mo Khazali, head of mobile and tech lead at Theodo UK, talks about the novel concept of Universal React. He discusses cross-platform development, overcoming performance challenges, and its impact on empowering small development teams to compete with big tech. Rocket Surgery 2024: Year in review December 19th, 2024 | Season 4 | 38 mins 12 secs rocket surgery Join us on PodRocket's yearly wrap-up episode as Emily and our hosts— Paige, Noel, Josh, and Paul—discuss significant tech trends of 2024 and predictions for 2025. Topics include AI advancements, React development, the potential impact of Void0, and the controversy surrounding Oracle's JavaScript trademark. An App Developer's Guide to React 19 with Michael Chan December 12th, 2024 | Season 4 | 26 mins 1 sec react Michael Chan discusses the latest updates in React 19. He talks new features like React server components, the shift towards TypeScript, deprecations of older APIs, and the adoption of Testing Library as the preferred testing tool. Web without walls with Dan Abramov October 2nd, 2024 | Season 4 | 27 mins 40 secs bluesky Dan Abramov discusses how innovative platform BlueSky reimagines user data control and customization with its unique app protocol, and the potential it brings for the future of social media. SSR performance, Remix and ChatGPT, and favorite new tools September 26th, 2024 | Season 4 | 37 mins 34 secs ai, remix, ssr performance In this panel episode, our hosts dive into the latest tools and frameworks, AI integration, the performance bottlenecks of server-side rendering, and more. Tune in to hear hot takes and insights from our industry experts. Custom DevTools for your React App with Cory House September 18th, 2024 | Season 4 | 33 mins 29 secs react React and JavaScript expert Cory House discusses the creation of custom development tools for React applications, sharing insights from his recent talk at React Rally and exploring how the right tools can shape development workflows and enhance automated testing strategies. React 19 with Shruti Kapoor September 5th, 2024 | Season 4 | 30 mins 6 secs react Shruti Kapoor, lead member of Technical Staff at Slack, explores the new features and updates in React 19. From enhanced form handling to the introduction of React Actions and the React Compiler, this episode provides valuable insights for developers eager to leverage the latest advancements in React. Using RSCs in Expo Router with Evan Bacon August 1st, 2024 | Season 4 | 33 mins 11 secs expo router Evan Bacon joins to the pod to talk about the latest advancements in React Native and the Expo Router. He discusses React Server Components, state management, and the new features coming in Expo SDK 52. React Compiler with Sathya Gunasekaran and Joe Savona July 11th, 2024 | Season 4 | 25 mins 41 secs react Join Sathya Gunasekaran and Joe Savona from the React Team as they discuss latest advancements, challenges, and future plans for the React Compiler, an innovative tool designed to simplify and optimize development workflows. CSS in React Server Components with Josh Comeau July 10th, 2024 | Season 4 | 42 mins 14 secs css in react Josh Comeau, an indie hacker and educator, delves into CSS in React Server Components, shares his journey in web development, offers insights on server-side rendering, and provides tips on mastering CSS for JavaScript developers. 50 shades of React rendering in Next.js with Ben Ilegbodu June 12th, 2024 | Season 4 | 27 mins 2 secs next.js, react Ben Ilegbodu, a front-end tech lead at Netflix, explains React rendering in Next.js, covering various rendering strategies. He also discusses the transition from the pages router to the app router. React Components as a service with Steven Fabre April 3rd, 2024 | Season 4 | 26 mins 35 secs react components We talk to Steven Fabre, Co-founder of Liveblocks, about the concept of React Components as a service, the challenges faced, and the focus on enabling collaborative experiences. Devin, INP, and the diminishing frontend dev March 27th, 2024 | Season 4 | 39 mins 45 secs panel On this month’s panel episode, PodRocket hosts Paige, Chris, Noel, and Paul talk about the introduction of Devin, the first AI engineer, Google’s rollout of INP, and if the frontend dev is being diminished. Partial pre-rendering in Next.js with Delba de Oliveira and Wyatt Johnson March 14th, 2024 | Season 4 | 26 mins 21 secs nextjs We welcome on Debla de Oliveira, Developer Advocate at Vercel, and Wyatt Johnson, Software Engineer at Vercel, to talk about partial pre-rendering and how it can be accomplished in Next.js. Stop building synchronous apps with Allen Helton February 15th, 2024 | Season 4 | 37 mins 22 secs synchronous apps We talk to Allen Helton, AWS Serverless Hero and Ecosystem Engineer at Momento, about why we should top building synchronous apps."
