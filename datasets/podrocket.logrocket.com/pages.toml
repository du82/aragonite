title = "PodRocket - A web development podcast from LogRocket - Tejas Kumar"
full_description = "Tejas Kumar Co-Host of PodRocket - A web development podcast from LogRocket Website Twitter YouTube LinkedIn Tejas helps devtools companies do devrel well. Tejas Kumar has hosted 27 Episodes. Deno 2 with Ryan Dahl September 11th, 2024 | Season 4 | 27 mins 39 secs Ryan Dahl, co-creator of Deno and creator of Node.js, discusses the evolution and future of Deno, covering its advantages, new features, and its potential impact on web development. Generative UI and React components with Malte Ubl August 14th, 2024 | Season 4 | 24 mins 57 secs ai, react In this episode of PodRocket, Malte Ubl, CTO of Vercel, talks about generative UI and React components. He discusses the evolution of AI in UI development, the role of AI state, and explores practical applications of AI SDK in the industry. SolidStart v1 with Atila Fassina June 26th, 2024 | Season 4 | 24 mins 21 secs Atila Fassina, a GDE for web technologies and SolidJS developer, discusses the exciting release of SolidStart v1.0, its unique philosophy, and the journey behind its development. Dan Abramov on React, RSCs, and the future [Repeat] April 24th, 2024 | Season 4 | 35 mins 45 secs react We welcome on The React Guy, Dan Abramov, to talk about his time working on the React core team, demystifying React Server Components, how React has evolved, and more! Next.js App Router migration with Brandon Bayer March 13th, 2024 | Season 4 | 33 mins 13 secs nextjs Brandon Bayer, CEO and Co-founder of Flightcontrol, talks about how he migrated the Flightcontrol dashboard to the Next.js App Router and all the good, bad, and ugly that came with it. Dan Abramov on React, RSCs, and the future February 1st, 2024 | Season 4 | 35 mins 45 secs react We welcome on The React Guy, Dan Abramov, to talk about his time working on the React core team, demystifying React Server Components, how React has evolved, and more! Eddie Jaoude on GitHub Stars and MDX documentation January 4th, 2024 | Season 4 | 36 mins 48 secs open source, react Eddie Jaoude, open-source GitHub star, educator, and founder of EddieHub, joined us to talk about what it means to be a GitHub Star, open source, and why MDX is a game changer for React documentation. Builder.io, Visual Copilot, and Partytown with Misko Hevery November 28th, 2023 | Season 3 | 39 mins 12 secs builder.io, partytown, visual copilot Miško Hevery, CTO of Builder.io and creator of Angular, returns to talk about Builder.io’s new AI tool, Visual Copilot, Partytown, and more in the Builder.io ecosystem. useWat with David Khourshid November 27th, 2023 | Season 3 | 46 mins 48 secs react David Khourshid, founder of Stately, talks about the “weird stuff” in React and how developers can better utilize the framework and understand its quirks. The rendering dilemma with Atila Fassina November 20th, 2023 | Season 3 | 41 mins 32 secs frameworks, reactivity, signals, solid.js In a sea of frameworks, what provides the best way to handle reactivity? Atila Fassina, DevRel Engineer at Crab Nebula and Google Dev Expert, returns to answer this question, talk about why Signals and Solid.js are good options, and more. Next.js 13.4 with Tim Neutkens (Repeat) November 10th, 2023 | Season 3 | 39 mins 13 secs nextjs 13.4, nextjs app router In this repeat episode, Tim Neutkens is the Next.js lead at Vercel. Tim joins us to talk about the Next.js App Router and some other new features from the latest release. Advocate for your engineering teams with Amanda Martin November 9th, 2023 | Season 3 | 22 mins 12 secs career In our second episode where Tejas sits down and chats with his friends, we interview Amanda Martin, Developer Advocate at Wix, who talks about how she supports the various engineering teams, being an advocate for open source, and why where you are now in your developer journey is ok. Tauri 2.0 with Daniel Thompson-Yvetot October 25th, 2023 | Season 3 | 38 mins 17 secs tauri Daniel Thompson-Yvetot comes back on PodRocket to give us a rundown of Tauri 2.0, CrabNebula, and more! Tejas and friends: Mark Erikson October 13th, 2023 | Season 3 | 20 mins 7 secs react, redux In our newest episode, PodRocket host Tejas Kumar talks to his friends about their lives in web development. In this month’s episode, he chats with Mark Erikson about how he got into React, how he got involved in Redux, and more! SolidJS for React developers with Erik Rasmussen October 12th, 2023 | Season 3 | 36 mins 59 secs react, solid Erik Rasmussen, creator of Redux Form and Final Form, comes on to talk about how, as a React developer, he got started with Solid and why React developers should try it. Angular in 2023 with Minko Gechev (Repeat) October 10th, 2023 | Season 3 | 44 mins 46 secs angular In today’s repeat episode from August, Minko Gechev, Engineering Product and DevRel lead at Google for Angular, returns to talk about how Angular has evolved over the years and how its momentum has not let up in 2023."
