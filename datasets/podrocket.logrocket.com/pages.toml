["https://podrocket.logrocket.com/hosts/katetrahan"]
title = "PodRocket - A web development podcast from LogRocket - Kate Trahan"
full_description = '''Kate Trahan Co-Host of PodRocket - A web development podcast from LogRocket Producer of PodRocket Kate Trahan has hosted 48 Episodes. Storybook with Chantastic (Repeat) July 5th, 2022 | Season 2 | 51 mins 59 secs chromatic, storybook, web development Chantastic joins us to talk about Chromatic, component-driven development, testing, Spider-Man, and more. Modern React with Paige Niedringhaus (Repeat) July 1st, 2022 | Season 2 | 50 mins frontend development, frontend web development, react, reactjs, software engineering, tech, technology, web development Paige Niedringhaus, Staff Software Engineer at Blues Wireless and author of the Modernizing React Apps course, joins us to talk about keeping your React application up to date, challenges React developers are experiencing, VS Code extensions that you should try, career changes, and more. 100ms with Kshitij Gupta April 21st, 2022 | Season 2 | 34 mins 21 secs frontend development, video, web development Kshitij Gupta, CEO and Cofounder at 100ms, talks about how he went from a video game designer for Disney+ Hotstar and building infrastructure at Facebook Live to creating and serving video infrastructure for startups in hopes to democratize API access. Remix with Chance Strickland April 15th, 2022 | Season 2 | 26 mins 8 secs frontend development, javascript, react We talk to Chance Strickland, software engineer at Remix Software, about Remix, how it builds better websites out of the box, and why the team calls it a full-stack framework. Storybook with Chantastic April 6th, 2022 | Season 2 | 51 mins 59 secs chromatic, storybook, web development Chantastic joins us to talk about Chromatic, component-driven development, testing, Spider-Man, and more. KendoReact with Kathryn Grayson Nanz April 5th, 2022 | Season 2 | 42 mins 39 secs design, kendoui, react, ux KendoReact is a professional UI kit on a mission to help you design and build business apps with React much faster. We talk to Kathryn Grayson Nanz, Developer Advocate for KendoUI, about KendoReact, component libraries, how to add KendoReact to an existing application, design, and more. SPAs, island architecture, and the future of development with Ryan Carniato and Dylan Piercey March 29th, 2022 | Season 2 | 51 mins island architecture, single-page applications, software engineering, tech, web development Ryan Carniato joined us back in September to talk about SolidJS, a declarative, efficient, and flexible JavaScript library for building user interfaces, and Dylan Piercey joined us in February to share about Marko, a declarative, HTML-based language that makes building web apps fun. Today, both Ryan and Dylan join us for a special episode where we cover trends in web development. Open-source supply chain security with Feross Aboukhadijeh March 22nd, 2022 | Season 2 | 44 mins 8 secs open source, security, web development Feross Aboukhadijeh is the creator of WebTorrent, StandardJS, and Wormhole. We talked to Feross about Wormhole back in June and he joins us now to talk about Socket.dev, a new security company that can protect your most critical apps from supply chain attacks. Polaris: The Shopify design system with Alex Page and Yuraima Estevez March 18th, 2022 | Season 2 | 50 mins 51 secs accessibility, design, react, ui Polaris is Shopify's design system that helps Shopify build a great experience for all of its merchants. Alex Page and Yuraima Estevez join us to talk about their work on the Polaris design system, why we need design systems, React components, and more. Final Form with Erik Rasmussen March 16th, 2022 | Season 2 | 41 mins 32 secs frontend development, react, redux, web development Final Form is framework agnostic, high performance, subscription-based form state management. Erik Rasmussen creator of Final Form, joins us to talk about state management, why you should not use Redux Form, and more. Kernel (with an E L) with Angela Gilhotra March 15th, 2022 | Season 2 | 32 mins 37 secs bitcoin, blockchain, crypto, web3 Kernel is a custom web3 educational community. Angela Gilhotra joins us to talk about Kernel, creator economies, Convo (a convivial tool that helps Kernel grow environments for dialogue by easing the coordination required), how to correctly spell Kernel, and more. Accessibility with Ben Myers March 11th, 2022 | Season 2 | 39 mins 20 secs a11y, accessibility, web development Ben Myers is an accessibility advocate, a Software Engineer at Microsoft, host of Some Antics (a weekly Twitch show), and a moderator on both the Lunch Dev Discord and the Frontend Horse Discord. Ben joins us on PodRocket to talk about all things accessibility, streaming, and more. Composing layouts with Travis Waith-Mair March 8th, 2022 | Season 2 | 40 mins 35 secs css, design, open-source Travis Waith-Mair joins us to talk about Bedrock Layout Primitives -- foundational layout building blocks for your React app. We talk about design patterns, how Bedrock is "the Lodash of web layouts", and more. NuxtJS with Alex Lichter March 1st, 2022 | Season 2 | 45 mins 58 secs nuxt.js, open source, vue Nuxt is a meta-framework based on Vue.js that makes developers' lives easier and makes developing full-fledged applications a breeze. NuxtJS core maintainer, Alex Lichter, joins us to talk about Nuxt, Vue 3, and making the web snappy. Slinkity with Ben Holmes February 23rd, 2022 | Season 2 | 32 mins 59 secs 11ty, tech, web development, webdev Ben Holmes joins us to talk about Slinkity -- the simplest way to handle styles and component frameworks on your 11ty site. Git and monorepos with Derrick Stolee February 22nd, 2022 | Season 2 | 41 mins 10 secs development, git, tech, web development We talk to Derrick Stolee, Principal Software Engineer at GitHub, about monorepos, finding pain points of Git, Git performance at scale, what Git will look like in the future, and more.'''
