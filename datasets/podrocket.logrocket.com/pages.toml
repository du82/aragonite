full_description = "PodRocket - A web development podcast from LogRocket RSS Apple Podcasts Amazon Music Breaker Castro Overcast Pocket Casts RadioPublic iHeartRadio Spotify Stitcher TuneIn About the show PodRocket covers everything you need to know about frontend web development on a weekly basis. Join LogRocket cofounder Ben Edelstein, the LogRocket engineering team, and more, as they interview experienced developers about all the libraries, frameworks, and tech industry issues they deal with every day. PodRocket - A web development podcast from LogRocket on social media Your Hosts Ben Edelstein Kate Trahan Brendan Downing Noel Minchow Paul Mikulskis Kaelan Cooter Chris Botaish Sean Rayment Emily Kochanek Ketner Matthew Arbesfeld Paige Niedringhaus Chris Bautista Tejas Kumar Mike Karan Josh Goldberg Episodes React 19 with Shruti Kapoor September 5th, 2024 | Season 4 | 30 mins 6 secs react Shruti Kapoor, lead member of Technical Staff at Slack, explores the new features and updates in React 19. From enhanced form handling to the introduction of React Actions and the React Compiler, this episode provides valuable insights for developers eager to leverage the latest advancements in React. The invisible hand of React performance with Ivan Akulov September 4th, 2024 | Season 4 | 32 mins 23 secs react Ivan Akulov, Senior Performance Engineer at Framer, discusses optimizing React performance and major advancements in React, including hooks, concurrency, and the crucial invisible performance enhancements that make modern web applications smoother and faster. Exploring Node.js with David Neal August 29th, 2024 | Season 4 | 27 mins 29 secs node.js David Neal, developer advocate and Asana content creator, discusses his talk, The Illustrated Guide to Node.js. David shares insights from his 10-year journey with Node.js, discussing its origins, use cases, and why it remains a vital tool for developers, giving insights into JavaScript's evolution and practical tips for navigating the Node.js ecosystem. Fullstack TypeScript with Erik Hanchett August 28th, 2024 | Season 4 | 32 mins 55 secs fullstack typescript In this episode, Erik Hanchett, senior developer advocate at AWS Amplify, explores the world of Fullstack TypeScript. He discusses the significance of end-to-end type safety, the tools to achieve it, and delves into the benefits and functionalities of AWS Amplify. Production horror stories with Dan Neciu August 22nd, 2024 | Season 4 | 27 mins 17 secs production Dan Neciu, technical co-founder and tech lead of CareerOS, shares intriguing production horror stories, discusses the importance of rigorous testing, and provides valuable insights into preventing and managing software bugs in both backend and frontend development. Mastering durable, event-driven workflows with Joel Hooks August 21st, 2024 | Season 4 | 30 mins 28 secs event-driven workflows In this episode of PodRocket, Joel Hooks, creator of egghead.io, talks about the power of durable, event-driven workflows, the practicalities and benefits of serverless as a billing model, the intricacies distributed systems, and more. It's 2024: Let's talk about Atomic CSS with Matheus Albuquerque August 15th, 2024 | Season 4 | 30 mins 43 secs atomic css Matheus Albuquerque discusses the basics, benefits, and common pitfalls of Atomic CSS, while giving insights into best practices for using utility-first styling in modern web development projects. Generative UI and React components with Malte Ubl August 14th, 2024 | Season 4 | 24 mins 57 secs ai, react In this episode of PodRocket, Malte Ubl, CTO of Vercel, talks about generative UI and React components. He discusses the evolution of AI in UI development, the role of AI state, and explores practical applications of AI SDK in the industry. Integrating TypeScript into Node.js with Marco Ippolito August 8th, 2024 | Season 4 | 25 mins 48 secs node.js Marco Ippolito, Node.js collaborator and TSC member, discusses the exciting integration of TypeScript into Node.js. He explores the new experimental features, the challenges faced in development, and what this means for the future of JavaScript and TypeScript development. (Please note that the ideas and opinions expressed in this video are Marco’s own and do not reflect the views of the entire project or its contributors.) AI for React developers and beyond with Alexandra Spalato August 7th, 2024 | Season 4 | 29 mins 37 secs ai Alexandra Spalato, AI integration specialist and frontend visionary, discusses how AI is revolutionizing the workflow for React developers, the indispensable tools making development faster and more efficient, and the exciting possibilities AI opens up for the entire software development process. Using RSCs in Expo Router with Evan Bacon August 1st, 2024 | Season 4 | 33 mins 11 secs expo router Evan Bacon joins to the pod to talk about the latest advancements in React Native and the Expo Router. He discusses React Server Components, state management, and the new features coming in Expo SDK 52. Navigating the complexities of full-stack development with James Quick July 31st, 2024 | Season 4 | 43 mins 9 secs full-stack In this episode, James Quick, seasoned JavaScript developer, speaker, and teacher, chats about full stack web development. From single-page applications and static site generators to the latest in server components and hybrid rendering, he covers the evolution of modern web development practices and gives personal insights on navigating these new technologies. The future of serverless is WASM with David Flanagan July 25th, 2024 | Season 4 | 34 mins 15 secs wasm David Flanagan, founder of Rawdoke Academy, discusses why WebAssembly (WASM) could be the future of serverless technology and explores the evolution, benefits, and potential of WASM in transforming server-side applications across various environments. The Rise of Serverless Fullstack with Brian Leroux July 24th, 2024 | Season 4 | 32 mins 50 secs serverless fullstack In this episode, Brian LeRoux, co-founder of Begin.com, discusses the evolution and rise of serverless full stack development. Brian shares insights on the history and future of JavaScript, the benefits of serverless architecture, and how front-end developers can leverage these technologies to build scalable and maintainable applications. Why you should use Redux in 2024 with Mark Erikson July 18th, 2024 | Season 4 | 39 mins 57 secs redux Mark Erikson, Redux maintainer and a senior front-end engineer at replay.io discusses why Redux remains a powerful tool for state management in 2024, the evolution of Redux Toolkit, and the common pitfalls developers face. The State of JavaScript with Sacha Greif July 17th, 2024 | Season 4 | 38 mins 38 secs javascript On this episode, Sacha Greif, designer, developer, and entrepreneur, talks about the state of JavaScript in 2023 survey results. We discuss trends in the JavaScript ecosystem and the future of popular frameworks and tools. Learn about the challenges and innovations shaping the world of JavaScript today."
