["https://podrocket.logrocket.com/hosts/benedelstein"]
title = "PodRocket - A web development podcast from LogRocket - Ben Edelstein"
full_description = "Ben Edelstein Co-Host of PodRocket - A web development podcast from LogRocket Cofounder at LogRocket Ben Edelstein has hosted 89 Episodes. ICYMI: Next.js 13, Vercel, and the future with Guillermo Rauch July 22nd, 2023 | Season 3 | 50 mins 21 secs next 13, next js In this repeat episode picked by host Sean Rayment, Guillermo Rauch, CEO and founder of Vercel, returns to PodRocket to talk about all the new Next 13 features, how Next has changed since its inception, and the future of the framework as it continues to grow. Bun with Jarred Sumner (Repeat) December 27th, 2022 | Season 2 | 27 mins 56 secs bun, javascript, runtime Originally published on August 5th, 2022. We are taking some time off from production. We will be back with new episodes on January 3rd, 2023. Bun has been one of the most talked about JavaScript runtimes since its release, and we got to talk to Jarred Sumner, the creator of Bun, about why it’s so fast, how it’s competing with Node, and more. Engineering at Mailchimp with CTO, Eric Muntz December 13th, 2022 | Season 2 | 35 mins 47 secs mailchimp CTO of Mailchimp, Eric Muntz, joins us to talk about how he started as a software engineer at Mailchimp almost thirteen years ago, the engineering team's mission statement, a few “ghost” stories, and more. A guide to React rendering behavior with Mark Erikson November 30th, 2022 | Season 2 | 39 mins 50 secs react, react rendering Mark Erikson, Senior Frontend Engineer at Replay and Redux maintainer, rejoins the pod to talk about his latest conference talk, “A guide to React rendering behavior,” where he goes in-depth about React rendering and issues that can appear while attempting it. Next.js 13, Vercel, and the future with Guillermo Rauch November 29th, 2022 | Season 2 | 49 mins 30 secs next 13, next js Hot off the Next.js 13 announcement, Guillermo Rauch returns to PodRocket to talk about all the new Next 13 features, how Next has changed since its inception, and the future of the framework as it continues to grow. Remix and React Router with Michael Jackson (Repeat) November 23rd, 2022 | Season 2 | 33 mins 26 secs remix, web app architecture, web apps Originally published on August 9th, 2022 We are taking some time off from production. We will be back with new episodes on November 29th. Remix is a full-stack web framework that lets you focus on the user interface. We talk to Michael Jackson, co-founder of Remix and creator of React Router, about Remix, nested routes, improving UI, and more. Redwood, startups, and the future with Tom Preston-Werner (Repeat) November 11th, 2022 | Season 2 | 47 mins 20 secs devtools, redwoodjs, startups Originally published on July 19th, 2022. We are taking some time off from production. We will be back with new episodes on November 15th. In this episode, we talk to Tom Preston-Werner, creator of RedwoodJS, Jekyll, and cofounder of GitHub, about why he wanted to create RedwoodJS, how it benefits startups, and the future of investing in startups. Azure security with Sarah Young October 28th, 2022 | Season 2 | 36 mins 30 secs azure, cloud security, microsoft, security, zero trust Sarah Young is a Senior Cloud Security Advocate at Microsoft. Sarah joins us today to talk about Azure security, Zero Trust principles, and important investments in the security ecosystem. Svelvet with Andrew Widjaja September 21st, 2022 | Season 2 | 17 mins 40 secs frontend, svelte, svelvet We sit down with the co-creator of Svelvet, Andrew Widjaja, to talk about how Svelvet allows developers to design beautiful flow charts easily, why they chose to create it for Svelte, and what’s coming up for the library. Radix with Benoît Grélard September 20th, 2022 | Season 2 | 27 mins 22 secs accessibility, frontend development, radix We sit down with Benoît Grélard, lead web developer at WorkOS and Radix maintainer, about Radix, the open-source UI component library for building high-quality, accessible design systems and web apps. Building a consistent developer experience with Ravi Lachhman September 13th, 2022 | Season 2 | 25 mins 38 secs developer experiences, harness We talk to Ravi Lachhman, Principal Product Manager at Harness, about his work at Harness and his recent conference talk, “KISS - Building a Consistent Developer Experience,” where he gives actionable insights into creating and maintaining good developer experiences. Plasmo with Stefan Aleksic and Louis Vilgo August 17th, 2022 | Season 2 | 28 mins 45 secs chrome, frontend, web development We sit down with Stefan Aleksic and Louis Vilgo to talk about their platform, Plasmo, and how they’re trying to revolutionize how Chrome extensions are developed, tested, and deployed. Web Component Tricks with Dave Rupert August 10th, 2022 | Season 2 | 23 mins 27 secs luro, paravel, web components Web components help you break your code into smaller chunks, build design systems, and also ship less code. Dave Rupert, the co-founder of Luro, lead developer at Paravel, and co-host of ShopTalk, joins us to talk about his course on web components and the other projects he is working on. Remix and React Router with Michael Jackson August 9th, 2022 | Season 2 | 34 mins 26 secs react, react router, remix Remix is a full-stack web framework that lets you focus on the user interface. We talk to Michael Jackson, co-founder of Remix and creator of React Router, about Remix, nested routes, improving UI, and more. Bun with Jarred Sumner August 5th, 2022 | Season 2 | 28 mins 50 secs bun, javascript, runtime Bun has been one of the most talked about JavaScript runtimes since its release, and we got to talk to Jarred Sumner, the creator of Bun, about why it’s so fast, how it’s competing with Node, and more. Scaling Klaviyo with CTO, Allen Chaves July 29th, 2022 | Season 2 | 30 mins 30 secs data, ecommerce, klaviyo Klaviyo is a unified customer platform for email and SMS, empowering online brands to own their data and grow on their own terms. CTO, Allen Chaves, joins us to talk about how he helped scale the company's technology during the pandemic, what technologies Klaviyo is using, and how it helps engineering teams."
