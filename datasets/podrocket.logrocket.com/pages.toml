description = "PodRocket covers everything you need to know about frontend web development on a weekly basis. Join LogRocket cofounder Ben Edelstein, the LogRocket engineering team, and more, as they interview experienced developers about all the libraries, frameworks, and tech industry issues they deal with every day."
full_description = "PodRocket - A web development podcast from LogRocket RSS Apple Podcasts Amazon Music Breaker Castro Overcast Pocket Casts RadioPublic iHeartRadio Spotify Stitcher TuneIn About the show PodRocket covers everything you need to know about frontend web development on a weekly basis. Join LogRocket cofounder Ben Edelstein, the LogRocket engineering team, and more, as they interview experienced developers about all the libraries, frameworks, and tech industry issues they deal with every day. PodRocket - A web development podcast from LogRocket on social media Your Hosts Ben Edelstein Kate Trahan Brendan Downing Noel Minchow Paul Mikulskis Kaelan Cooter Chris Botaish Sean Rayment Emily Kochanek Ketner Matthew Arbesfeld Paige Niedringhaus Chris Bautista Tejas Kumar Mike Karan Josh Goldberg Episodes Open source at Facebook with Dmitry Vinnik May 11th, 2021 | Season 1 | 32 mins 8 secs developer advocate, developer relations, open source, open source technology, software engineering, tech, technology, web development Facebook Open Source now has over 600 publicly available projects in its portfolio including some well-known projects like React, React Native, PyTorch, Docusaurus, GraphQL, Jest, and more. Listen to this episode of PodRocket to hear Dmitry Vinnick, a Developer Advocate at Facebook Open Source, talk about what it means to be open source at Facebook, how to manage such a large portfolio, and what it's like to engage with a community remotely. Redux is alive and well with Mark Erikson May 4th, 2021 | Season 1 | 45 mins 58 secs frontend development, frontend web development, react, redux, software engineering, tech, technology, web development What is modern Redux? What is it with the obsession of declaring Redux dead? In this episode, Ben and Brian interview Mark Erikson to talk about all things Redux. Founder Friday: Madeleine Reese of Allma April 30th, 2021 | Season 1 | 30 mins 56 secs business, frontend development, incident management, software engineering, startup, tech, web development Ben interviews Madeleine Reese, Founder and CEO of Allma. Allma is building next-generation alerting, incident response, and service cataloging natively in Slack. Their focus is on helping the entire organization to resolve incidents faster and be able to communicate more effectively during an incident. Learn more about Allma in this episode. Firebase, development, and design in 2021 with David East April 27th, 2021 | Season 1 | 28 mins 4 secs design, developer relations, firebase, frontend development, frontend web development, software engineering, tech, technology, web development In this episode, Ben and Kate talk to David East, Developer Relations Engineer at Firebase. They talk about the three tiers of the Firebase product -- Build, Release & Monitor, and Engage. They also get into design vs. development and what that means for web developers in 2021. What you need to know about Wasp with Martin Šošić April 20th, 2021 | Season 1 | 20 mins frontend development, frontend web development, software engineering, tech, technology, web development Ben interviews Martin Šošić about Wasp, an open-source, declarative DSL for devs. Learn more about how Wasp works and why it has been getting attention on Product Hunt and Hacker News. spACE jam April 13th, 2021 | Season 1 | 29 mins 45 secs developer experience, devrel, frontend development, frontend engineering, software engineering, web development Brian interviews Adewale Abati, also known as Ace, a frontend engineer and developer advocate at Flutterwave. Ace is known for sharing his developer experiences through social media, technical writing, public speaking, and his YouTube channel. He also maintains Made in Nigeria -- a curation of awesome open source tools and projects built by Nigerian developers. Typesense with Jason Bosco April 6th, 2021 | Season 1 | 22 mins 17 secs frontend development, frontend web development, software engineering, tech, technology, web development Ben interviews Jason Bosco, cofounder of Typesense, an open source search engine that’s optimized for both performance and ease of use. They talk about how Typesense compares to Algolia and Elasticsearch, how to get started using Typesense, and how you can get involved. Rocket Surgery: Different flavors of frontend March 30th, 2021 | Season 1 | 28 mins 25 secs frontend development, frontend web development, software engineering, tech, technology, web development Should all frontend developers know CSS and HTML like the back of their hand? What about React, Angular, Vue, and webpack? Where does the list end? In this episode, Kaelan and Brian talk about the nature of frontend and what that means for the future of the profession. Founder Friday: David Thor of Architect.io March 26th, 2021 | Season 1 | 37 mins 13 secs business, developer operations, devops, software engineering, tech, web development In this Founder Friday episode, Ben interviews David Thor, founder and CEO of Architect, the world’s first DevOps-as-a-Service platform. They talk about the DevOps landscape, how Architect improves developer productivity, and how it helps teams adopt best practices. Expo with Charlie Cheever March 23rd, 2021 | Season 1 | 38 mins 58 secs expo, frontend development, mobile development, react native, software engineering, tech, technology, web development Ben interviews Charlie Cheever, CEO and cofounder of Expo. They talk about the difficulties of building a cross-platform app and what Expo is doing to make that easier for developers. They also get into the state of React Native and more. goober with Cristian Bote March 16th, 2021 | Season 1 | 20 mins 24 secs css-in-js, engineering, frontend development, javascript, software engineering, tech, web development Shawn Swyx Wang: swyxtape vol. 1 March 9th, 2021 | Season 1 | 37 mins 19 secs developer experience, developer relations, devrel, frontend development, software engineering, tech, web development Ben and Brian talk to Shawn Wang, better known as Swyx, about infinite building, his experience as a Reddit moderator, blogging platforms, scaling developer relations, and more. Alpine.js with Caleb Porzio March 2nd, 2021 | Season 1 | 31 mins 47 secs alpinejs, frontend development, javascript, javascript frameworks, software engineering, tech, web development Ben and Kate talk to Caleb Porzio about Alpine.js and what to expect in 2021. They also get into some of Caleb’s other creations like Laravel Livewire and makevscodeawesome.com. Founder Friday: Tomas Reimers and Greg Foster of Screenplay February 26th, 2021 | Season 1 | 25 mins 1 sec business, founder, founders, frontend development, mobile development, react native, software engineering, startup, tech In the second installment of our Founder Friday series, Ben talks with Screenplay cofounders, Tomas Reimers and Greg Foster. They discuss the technical details behind Screenplay, what it’s like trying to get funding during a pandemic, and the Screenplay roadmap. Feathers with David Luecke February 23rd, 2021 | Season 1 | 31 mins 51 secs computer programming, frontend development, frontend web development, open source, software engineering, tech, technology, web development Ben and Kate talk to David Luecke, creator of Feathers, a framework for real-time applications and REST APIs. They talk about where Feathers fits in the fullstack framework space, pros and cons of building a modular framework, and what it has been like to maintain a project that needs to keep up with React. Spoiler alert: it’s hard. RedwoodJS with David Price February 16th, 2021 | Season 1 | 42 mins 50 secs frontend development, javascript, javascript frameworks, open source, software engineering, tech, web development Today, Ben and Kate interview David Price, a core member of RedwoodJS and developer-in-residence at Preston-Werner Ventures. They talk about what it means to be fullstack JAMstack, how RedwoodJS gives you your time back, and what it takes to create a 