description = "PodRocket covers everything you need to know about frontend web development on a weekly basis. Join LogRocket cofounder Ben Edelstein, the LogRocket engineering team, and more, as they interview experienced developers about all the libraries, frameworks, and tech industry issues they deal with every day."
full_description = "PodRocket - A web development podcast from LogRocket RSS Apple Podcasts Amazon Music Breaker Castro Overcast Pocket Casts RadioPublic iHeartRadio Spotify Stitcher TuneIn About the show PodRocket covers everything you need to know about frontend web development on a weekly basis. Join LogRocket cofounder Ben Edelstein, the LogRocket engineering team, and more, as they interview experienced developers about all the libraries, frameworks, and tech industry issues they deal with every day. PodRocket - A web development podcast from LogRocket on social media Your Hosts Ben Edelstein Kate Trahan Brendan Downing Noel Minchow Paul Mikulskis Kaelan Cooter Chris Botaish Sean Rayment Emily Kochanek Ketner Matthew Arbesfeld Paige Niedringhaus Chris Bautista Tejas Kumar Mike Karan Josh Goldberg Episodes Supabase with Paul Copplestone February 9th, 2021 | Season 1 | 31 mins 13 secs database, frontend development, frontend engineering, frontend web development, open source, software engineering, tech, technology, web development Today Ben and Kate talk with Paul Copplestone, CEO and cofounder of Supabase, the open source firebase alternative. They discuss how Supabase works, whats in store for 2021, why open source matters, and the role HackerNews played in Supabase’s launch. Prisma with Nikolas Burk February 2nd, 2021 | Season 1 | 37 mins 23 secs computer programming, database, frontend development, frontend engineering, open source, software engineering, tech, technology, web development Today Ben and Kate sit down with Nikolas Burk, Prisma’s Head of Developer Success. They talk about how Prisma helps developers build better web apps, how it works with TypeScript, the Prisma roadmap, and, of course, building an open-source community. Founder Friday: Chris Mather of Elements January 29th, 2021 | Season 1 | 30 mins 35 secs business, founder, frontend development, javascript, software engineering, tech, web development This is our first-ever Founder Friday episode where we feature founders of startups and devtool projects. Today, Ben talks with Chris Mather, founder of Elements, a new fullstack JavaScript framework. Ben talks to Chris about how he created Elements, his journey from CTO to founder, the process of getting funding for the project, and how you can get started with Elements today. Niche jokes and niche communities with Cassidy Williams January 26th, 2021 | Season 1 | 30 mins 45 secs developer experience, devrel, frontend development, frontend engineering, software engineering, web development In this episode, Brian and Ben talk with Cassidy Williams about being “tech famous,” web developer comedy as a genre, and what it’s like to create content specifically for web developers. We also get into developer experience for a little bit, touching on both the future and importance of niche communities. Creating content for web developers with Jessica Chan January 19th, 2021 | Season 1 | 25 mins 15 secs frontend development, frontend web development, marketing, software engineering, tech, technology, web development Today, we have Jessica Chan from Coder Coder: a collection of resources that help aspiring web developers learn to code. Brian talks with Jessica about creating content for web developers, using YouTube and Instagram as platforms, building a brand, and we even launch into a few marketing rants. Blitz.js with Brandon Bayer January 12th, 2021 | Season 1 | 23 mins 37 secs frontend development, frontend engineering, software engineering, web development In today’s episode, Ben and Brian talk to Brandon Bayer, creator of Blitz.js. We take a deep dive into everything Blitz has to offer. More specifically, we address how Blitz compares with other fullstack frameworks and how Blitz balances being opinionated with being flexible for each aspect of the toolchain. We also talk about community building and beyond. Rocket Surgery: Year in review January 12th, 2021 | Season 1 | 33 mins 43 secs frontend development, frontend engineering, javascript, reactjs, software engineering, web development, webpack Brian sits down with Kaelan, one of LogRocket's frontend engineers, to talk about things that are coming in 2021. We also reflect on the most significant trends and updates to browsers, web standards, and programming languages throughout the course of 2020. Component-driven development with Zoltan Olah January 12th, 2021 | Season 1 | 27 mins 10 secs frontend development, frontend web development, software engineering, tech, technology, web development Today, our co-founder Ben Edelstein sits down with the CEO and founder of Chromatic, Zoltan Olah. Ben and Zoltan discuss frontend testing, the philosophy of component-driven development, Storybook, and more. Snowpack and webpack November 11th, 2020 | Season 1 | 54 mins 42 secs frontend development, frontend engineering, snowpack, software engineering, web development, webpack In this episode, Ben interviews Fred Schott, founder of Pika and creator of Snowpack. Brian sits down with one of LogRocket's frontend engineers to discuss webpack 5."
