e of social media. Bonus: The Dev Starter Pack with Dani Grant, Beyang Liu, Ricky Robinett, and Matt Arbesfeld September 27th, 2024 | Season 4 | 22 mins 49 secs frontend development, startup, technology, web development In this special episode of PodRocket introducing the Dev Starter Pack, Matt Arbesfeld, CEO of LogRocket, talks to Dani Grant (CEO of Jam.dev), Ricky Robinett (VP of Developer Relationships at CloudFlare), and Beyang Liu (CTO and co-founder of Sourcegraph), about this new alliance of essential development tools designed for next-generation developers building the future of technology. They talk about the benefits of the stack, insights into each tool provided by the guests, and the potential impact of AI on web development. SSR performance, Remix and ChatGPT, and favorite new tools September 26th, 2024 | Season 4 | 37 mins 34 secs ai, remix, ssr performance In this panel episode, our hosts dive into the latest tools and frameworks, AI integration, the performance bottlenecks of server-side rendering, and more. Tune in to hear hot takes and insights from our industry experts. The vanishing network with Kent C. Dodds September 25th, 2024 | Season 4 | 33 mins 32 secs react Kent C. Dodds, web dev educator, discusses the evolution of web architectures, the potential of React Server Components, and the latest advancements in React 19, offering insights perfect for developers eager to stay ahead. TanStack and TanRouter with Tanner Linsley September 19th, 2024 | Season 4 | 30 mins 34 secs tanstack Tanner Linsley, creator of TanStack and co-founder at Nozzle, dives into the evolution and philosophy behind TanStack, his work on TanRouter, and shares insights on the importance of type safety in routing within web development. Custom DevTools for your React App with Cory House September 18th, 2024 | Season 4 | 33 mins 29 secs react React and JavaScript expert Cory House discusses the creation of custom development tools for React applications, sharing insights from his recent talk at React Rally and exploring how the right tools can shape development workflows and enhance automated testing strategies. Software migrations at scale with Ruben Casas September 12th, 2024 | Season 4 | 33 mins 14 secs software migration Ruben Casas discusses software migrations at scale, understanding different migration patterns, making critical decisions on whether a full rewrite is necessary, and more. This episode covers all the essentials you need to navigate your next big software transformation. Deno 2 with Ryan Dahl September 11th, 2024 | Season 4 | 27 mins 39 secs Ryan Dahl, co-creator of Deno and creator of Node.js, discusses the evolution and future of Deno, covering its advantages, new features, and its potential impact on web development."
