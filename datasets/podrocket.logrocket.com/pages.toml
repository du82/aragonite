5. Topics include AI advancements, React development, the potential impact of Void0, and the controversy surrounding Oracle's JavaScript trademark. The Rise of the Metaframeworks with Daniel Roe November 21st, 2024 | Season 4 | 31 mins 16 secs nuxt Daniel Roe, Nuxt core team leader, talks about the wide-ranging topic of meta-frameworks. Discover the benefits, use cases, and how these frameworks can transform the productivity of your development team, and delve into the rise of server-side rendering, React server components, and the role of AI in web development. How Platformatic is simplifying Node.js app management with Matteo Collina and Luca Maraschi November 7th, 2024 | Season 4 | 35 mins node.js, platformatic Matteo Collina and Luca Maraschi join the podcast to talk about Platformatic. Learn about Platformatics’ incredible 4.3 million dollar seed round, its robust features and modular approach, and how it addresses the unique challenges faced by devs and enterprises. Rewriting JavaScript, Svelte 5, and Void(0) October 31st, 2024 | Season 4 | 37 mins 19 secs javascript, panel, svelte, void0 In this panel episode, join our producer Emily and hosts Josh and Paul as they discuss the debate around rewriting JavaScript tools in faster languages, the exciting release of Svelte 5, and the newly introduced Void Zero toolchain. Breaking free from SPA dominance with Anthony Alaribe October 17th, 2024 | Season 4 | 36 mins 36 secs api toolkit Anthony Alaribe, co-founder of API Toolkit, discusses the power of the browser for building data-heavy applications. He talks about myths around single-page apps versus multi-page apps, leveraging tools like HTMX and Workbox, and the significance of browser-native features for interactive web development. New performance features in Chrome DevTools with Umar Hansa October 16th, 2024 | Season 4 | 31 mins 56 secs chrome devtools Join us in this episode as we delve into new performance features in Chrome DevTools with Umar Hansa. Learn about preloading, debugging techniques, and how to optimize website performance by focusing on key metrics. How I bought booze with a JSON web token with Rizèl Scarlett October 3rd, 2024 | Season 4 | 25 mins 56 secs verifiable credentials Rizél Scarlett, staff developer advocate at TBD Devs and Block explores the fascinating world of verifiable credentials, diving into their usage, security, and potential to revolutionize everyday processes. SSR performance, Remix and ChatGPT, and favorite new tools September 26th, 2024 | Season 4 | 37 mins 34 secs ai, remix, ssr performance In this panel episode, our hosts dive into the latest tools and frameworks, AI integration, the performance bottlenecks of server-side rendering, and more. Tune in to hear hot takes and insights from our industry experts. The vanishing network with Kent C. Dodds September 25th, 2024 | Season 4 | 33 mins 32 secs react Kent C. Dodds, web dev educator, discusses the evolution of web architectures, the potential of React Server Components, and the latest advancements in React 19, offering insights perfect for developers eager to stay ahead. Software migrations at scale with Ruben Casas September 12th, 2024 | Season 4 | 33 mins 14 secs software migration Ruben Casas discusses software migrations at scale, understanding different migration patterns, making critical decisions on whether a full rewrite is necessary, and more. This episode covers all the essentials you need to navigate your next big software transformation. Production horror stories with Dan Neciu August 22nd, 2024 | Season 4 | 27 mins 17 secs production Dan Neciu, technical co-founder and tech lead of CareerOS, shares intriguing production horror stories, discusses the importance of rigorous testing, and provides valuable insights into preventing and managing software bugs in both backend and frontend development. Mastering durable, event-driven workflows with Joel Hooks August 21st, 2024 | Season 4 | 30 mins 28 secs event-driven workflows In this episode of PodRocket, Joel Hooks, creator of egghead.io, talks about the power of durable, event-driven workflows, the practicalities and benefits of serverless as a billing model, the intricacies distributed systems, and more."
