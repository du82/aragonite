["https://podrocket.logrocket.com/hosts/sean-rayment"]
title = "PodRocket - A web development podcast from LogRocket - Sean Rayment"
full_description = "Sean Rayment Co-Host of PodRocket - A web development podcast from LogRocket Software engineer at LogRocket, avid runner, sci-fi fan. Sean Rayment has hosted 24 Episodes. ICYMI: Svelte 4 with Geoff Rich November 19th, 2023 | Season 3 | 31 mins 49 secs svelte In this repeat episode picked by host Noel Minchow, Geoff Rich and Mike Karan talk about the stable release of Svelte 4 and the next generation of Svelte. ICYMI: Building tech for social good with low-code tools with Vic Vijayakumar October 14th, 2023 | Season 3 | 32 mins 30 secs low code tools In this repeat episode picked by host Noel Minchow, we talk with Vic Vijayakumar. When Vic saw his daughter’s preschool struggling with an inefficient and non-digital admissions process, he decided to lend a hand by building an admissions system using low-code tools with limited costs. He joins us to talk about this project and how other developers can provide impactful tech while cutting time and costs. ICYMI: Figma with Dylan Field September 2nd, 2023 | Season 3 | 46 mins 38 secs figma In this repeat episode picked by PodRocket host Sean Rayment, CEO and Co-Founder of Figma, Dylan Field, joins us to talk about the collaborative design tool, the importance of design, and more. ICYMI: Svelte and modern frontends with Scott Spence August 5th, 2023 | Season 3 | 24 mins 14 secs svelte In this repeat episode picked by host Paul Mikulskis, Scott Spence, the Svelte Society London Meetup Organizer and a Developer Relations Engineer at Storyblok, joins us to talk about building with SvelteKit, advice for teams who want to get started with Svelte, and more! React Server Components with Sanket Sahu July 25th, 2023 | Season 3 | 25 mins 17 secs react Sanket Sahu, founder of GeekyAnts, comes on to talk about the intricacies of React Server Components. ICYMI: Next.js 13, Vercel, and the future with Guillermo Rauch July 22nd, 2023 | Season 3 | 50 mins 21 secs next 13, next js In this repeat episode picked by host Sean Rayment, Guillermo Rauch, CEO and founder of Vercel, returns to PodRocket to talk about all the new Next 13 features, how Next has changed since its inception, and the future of the framework as it continues to grow. ICYMI: Making typesafe APIs easy with tRPC with Trash Dev (Repeat) July 1st, 2023 | Season 3 | 24 mins 27 secs typesafe apis In this repeat episode picked by host Noel Minchow, Chris Bautista, Senior Software Engineer at Netflix, also known as Trash Dev online and to his Twitch community, joins us to go through his recent Next.js Conf talk, “Making typesafe APIs easy with tRPC.” The state of CSS in 2023 with Adam Argyle (Repeat) May 20th, 2023 | Season 3 | 36 mins 42 secs css, ui, ux CSS all-star Adam Argyle, Chrome CSS and UI Developer Relations at Google and part of the CSS Working Group, joins us to review how CSS changed in 2022 and what we should expect in 2023. Building video games in React with Joe Hart April 26th, 2023 | Season 3 | 29 mins 40 secs react, video games Ever wanted to know how to build a video game with React? Joe Hart, a web engineering consultant, teaches us how to build “Age of Empires 2” using React. React Hooks broke my tests with Daniel Afonso April 12th, 2023 | Season 3 | 31 mins 30 secs react, react hooks React Hooks can seem great, but when it comes time for testing, they can point out issues. Daniel Afonso, Dev Advocate at OLX, teaches us how to reconfigure how to test React applications to work better with React Hooks. Refactoring large JavaScript codebases with Michele Riva April 11th, 2023 | Season 3 | 26 mins 33 secs javascript codebases, orama search, refractoring We welcome back Michele Riva, co-founder and CTO of Orama Search, to discuss how developers can easily refactor large JavaScript codebases. Writing (really) good tests with Markus Oberlehner April 4th, 2023 | Season 3 | 27 mins 53 secs test driven development, test writing Markus Oberlehner, software architect, speaker, and open source contributor, comes onto the show to talk about how to better write tests with test-driven development. Enhancing FWAs with web components with Brian LeRoux February 14th, 2023 | Season 3 | 34 mins 40 secs function web apps, web components Brian LeRoux, founder of Begin, comes to talk about their conference talk, “Enhance your functional web apps with web components” from last year’s CascadiaJS conference. Handling breaking changes in GraphQL with Kadi Kraman February 3rd, 2023 | Season 3 | 26 mins 41 secs graphql Kadi Krama, Head of Mobile Development at Formidable Labs, comes on to talk about her recent conference talk from GraphQL Galaxy, “Handling breaking changes in GraphQL.“ Svelte and modern frontends with Scott Spence January 26th, 2023 | Season 3 | 23 mins 40 secs development, svelte, web dev Scott Spence is the Svelte Society London Meetup organizer and a Developer Relations Engineer at Storyblok. Scott joins us to talk about building with SvelteKit, advice for teams who want to get started with Svelte, and more! The state of CSS in 2023 with Adam Argyle January 20th, 2023 | Season 3 | 35 mins 22 secs css CSS all-star Adam Argyle, Chrome CSS and UI Developer Relations at Google and part of the CSS Working Group, joins us to review how CSS changed in 2022 and what we should expect in 2023."
