full_description = "Emily Kochanek Ketner Co-Host of PodRocket - A web development podcast from LogRocket Website Twitter producer for PodRocket | content for LogRocket Emily Kochanek Ketner has hosted 34 Episodes. Rocket Surgery 2024: Year in review December 19th, 2024 | Season 4 | 38 mins 12 secs rocket surgery Join us on PodRocket's yearly wrap-up episode as Emily and our hosts— Paige, Noel, Josh, and Paul—discuss significant tech trends of 2024 and predictions for 2025. Topics include AI advancements, React development, the potential impact of Void0, and the controversy surrounding Oracle's JavaScript trademark. Rewriting JavaScript, Svelte 5, and Void(0) October 31st, 2024 | Season 4 | 37 mins 19 secs javascript, panel, svelte, void0 In this panel episode, join our producer Emily and hosts Josh and Paul as they discuss the debate around rewriting JavaScript tools in faster languages, the exciting release of Svelte 5, and the newly introduced Void Zero toolchain. SSR performance, Remix and ChatGPT, and favorite new tools September 26th, 2024 | Season 4 | 37 mins 34 secs ai, remix, ssr performance In this panel episode, our hosts dive into the latest tools and frameworks, AI integration, the performance bottlenecks of server-side rendering, and more. Tune in to hear hot takes and insights from our industry experts. Your JavaScript runtime questions answered [Repeat] July 3rd, 2024 | Season 4 | 44 mins 40 secs javascript, javascript runtime In this repeat episode, you asked us your most pressing questions about JavaScript runtimes, so join Matteo Collina, Node.js TSC member and Co-founder and CTO of Platformatic, and Kevin Whinnery, Dev Rel at Deno, as they answer those questions. Mid-year recap, Vercel Ship, and remixing React Router June 6th, 2024 | Season 4 | 39 mins 40 secs panel, react, recap, vercel Join Emily and PodRocket hosts Noel and Paul as they revisit predictions from last year, dive into the latest announcements from Vercel Ship including React 19 and Next.js 15, explore the merging of Remix into React Router, and share their hot takes on current industry trends. Web development according to The Primeagen [Repeat] May 1st, 2024 | Season 4 | 36 mins 34 secs web development trends On this repeat episode, The Primeagen, content creator, Twitch streamer, and all-around fun internet guy, gives his take on all the latest trends in web development. Your JavaScript runtime questions answered February 29th, 2024 | Season 4 | 44 mins 40 secs javascript You asked us your most pressing questions about JavaScript runtimes, so join Matteo Collina, Node.js TSC member and Co-founder and CTO of Platformatic, and Kevin Whinnery, Dev Rel at Deno, as they answer those questions. React frustrations, web components, and hot takes January 31st, 2024 | Season 4 | 37 mins 30 secs react, web components, web development In this month’s panel episode, we talk to Cassidy Williams, Michael Chan, and Atila Fassina about why web components are having a moment, mounting frustrations with React, and our guests’ hottest takes on web development. The best of PodRocket in 2023 December 29th, 2023 | Season 3 | 11 mins 38 secs next.js 13.4, transitional web, type safety It’s the end of the year, so we want to give you a taste of our most popular episodes from 2023, starting with Tim Neutkens and the release of Next.js 13.4, followed by Chris Ferdinandi talking about the transitional web, and ending with Kent C. Dodds talking about type safety. Rocket surgery: 2023 in review December 21st, 2023 | Season 3 | 39 mins 42 secs javascript, web development Our panel of hosts come together for one last episode of 2023, reviewing all the past events of the year, what they loved and what they hated, and what they’re looking forward to in 2024. Building on Vercel's stack, opt-in design, and CSS nesting December 15th, 2023 | Season 3 | 11 mins 13 secs css nesting, opt-in design, vercel's stack In this week’s roundup episode, we cover why React Miami’s creator chose to build her conference infrastructure on Vercel’s stack, what opt-in design is, and the evolution of CSS testing. Rendering dilemma, Pinia, and not using Next.js December 1st, 2023 | Season 3 | 10 mins 8 secs frameworks, next.js, pinia, react, reactivity, vuex In this week’s roundup episode, we cover how different frameworks handle reactivity, the differences between Vuex and Pinia, and the TL;DR of why Kent C. Dodds won’t use Next.js. Choosing React, Storybook, and native SSR November 17th, 2023 | Season 3 | 12 mins 6 secs react, reason, remix, svelte In this week’s roundup episode, learn why Chance Strickland still chooses to use React, why Amy Dutton uses Storybook for design-driven development, and how to use Reason and OCaml to natively render React apps. React’s future, metaframeworks, and Tauri November 3rd, 2023 | Season 3 | 11 mins 2 secs metaframeworks, react, solidjs, tauri In this week’s roundup, hear from Theo Browne about the future of React, Ryan Carniato on metaframeworks, and Daniel Thompson-Yvetot on what sets Tauri apart from other frameworks. Your JavaScript questions answered October 27th, 2023 | Season 3 | 36 mins 15 secs frontend development, javascript, logrocket, podrocket, technology podcast, web development We answer your JavaScript questions covering performance, TypeScript, and the ecosystem with this month’s panel of JavaScript experts: Josh Goldberg, Colby Fayock, Paige Neidringhaus, and Noel Minchow. Bun vs. Node, CSS containers, and complex UIs October 6th, 2023 | Season 3 | 12 mins 47 secs bun, css, ui In this week’s roundup, hear snippets of our discussions about how Bun is creating runtime competition, what CSS containers actually are, and how to deal with complex UIs."
