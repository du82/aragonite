title = "PodRocket - A web development podcast from LogRocket"
description = "PodRocket covers everything you need to know about frontend web development on a weekly basis. Join LogRocket cofounder Ben Edelstein, the LogRocket engineering team, and more, as they interview experienced developers about all the libraries, frameworks, and tech industry issues they deal with every day."
full_description = "PodRocket - A web development podcast from LogRocket RSS Apple Podcasts Amazon Music Breaker Castro Overcast Pocket Casts RadioPublic iHeartRadio Spotify Stitcher TuneIn About the show PodRocket covers everything you need to know about frontend web development on a weekly basis. Join LogRocket cofounder Ben Edelstein, the LogRocket engineering team, and more, as they interview experienced developers about all the libraries, frameworks, and tech industry issues they deal with every day. PodRocket - A web development podcast from LogRocket on social media Your Hosts Ben Edelstein Kate Trahan Brendan Downing Noel Minchow Paul Mikulskis Kaelan Cooter Chris Botaish Sean Rayment Emily Kochanek Ketner Matthew Arbesfeld Paige Niedringhaus Chris Bautista Tejas Kumar Mike Karan Josh Goldberg Episodes Tldraw’s accidental AI play with Steve Ruiz February 27th, 2025 | Season 4 | 28 mins 10 secs ai Steve Ruiz, founder of TLDraw, discusses the revolutionary AI applications in TLDraw, the intricacies of infinite canvas editors, and the impact of AI on design and development. Prisma Postgres with Nikolas Burk February 20th, 2025 | Season 4 | 28 mins 18 secs prisma Nikolas Burk, DevRel at Prisma, talks about Prisma Postgres, its unikernel architecture, and its seamless integration with cloud infrastructure. Discover how Prisma Postgres is revolutionizing database management with features like cold start elimination, real-time event handling and advanced caching strategies! Building Async UIs without the hassle with Dev Agrawal February 13th, 2025 | Season 4 | 28 mins 4 secs ui In this episode of PodRocket, Dev Agrawal, dev advocate and developer, talks about building efficient asynchronous UIs, the challenges and solutions for handling complex state management, utilizing React and Solid frameworks, and the potential of suspense boundaries and transitions in modern web development. You're Probably Doing Web Performance Wrong with Sia Karamalegos February 6th, 2025 | Season 4 | 27 mins 11 secs web performance Sia Karamalegos, performance engineer, web developer, and Google Developer Expert in Web Technologies & Web Performance, discusses the pitfalls of relying solely on Lighthouse scores, the importance of Real User Monitoring (RUM), and dive deep into metrics like Core Web Vitals and various other performance indicators, giving practical insights to enhance user experience on your website! Relatively New Things You Should Know about HTML with Chris Coyier January 30th, 2025 | Season 4 | 40 mins 26 secs html Chris Coyier, co-founder of CodePen, talks about the evolving landscape of HTML heading into 2025. He delves into topics like the slow evolution of HTML compared to CSS and JavaScript, the importance of backwards compatibility, new HTML elements and pseudo-elements, and the potential of declarative shadow DOM for server-side rendering in web components. Universal React with Mo Khazali January 23rd, 2025 | Season 4 | 36 mins 9 secs react Mo Khazali, head of mobile and tech lead at Theodo UK, talks about the novel concept of Universal React. He discusses cross-platform development, overcoming performance challenges, and its impact on empowering small development teams to compete with big tech. Make the web weird again with Elian Van Cutsem January 16th, 2025 | Season 4 | 22 mins 38 secs web development Elian Van Cutsem, leader of dev relations at React Bricks, talks about making the web fun and weird again! In this episode, we discuss quirky APIs like the Battery API, WebHID, and WebMIDI, balancing productivity with creativity, and share tips on how to inject joy into web development projects. 8 things you should know about microfrontends with Florian Rappl January 9th, 2025 | Season 4 | 29 mins 12 secs microfrontends Florian Rappl, solutions architect at smapiot GmbH, joins the podcast to give insights on micro frontends, discussing the misconceptions, architectural patterns, challenges, and exciting benefits of using micro frontends over traditional monolithic applications. How to think like a performance engineer with Harry Roberts January 2nd, 2025 | Season 4 | 32 mins 10 secs performance engineering Harry Roberts, Google Developer Expert and web performance consultant, chats about thinking like a performance engineer. Learn about Core Web Vitals, user journey testing, and practical tips for optimizing website speed and user experience. void(0) with Evan You [Repeat] December 26th, 2024 | Season 4 | 46 mins 48 secs void0 In this holiday repeat episode, Evan You, creator of Vue and Vite, discusses his new venture, void(0). He discusses the motivations behind founding void(0), the inefficiencies in JavaScript tooling, and the future of unified tooling stacks. Rocket Surgery 2024: Year in review December 19th, 2024 | Season 4 | 38 mins 12 secs rocket surgery Join us on PodRocket's yearly wrap-up episode as Emily and our hosts— Paige, Noel, Josh, and Paul—discuss significant tech trends of 2024 and predictions for 2025. Topics include AI advancements, React development, the potential impact of Void0, and the controversy surrounding Oracle's JavaScript trademark. An App Developer's Guide to React 19 with Michael Chan December 12th, 2024 | Season 4 | 26 mins 1 sec react Michael Chan discusses the latest updates in React 19. He talks new features like React server components, the shift towards TypeScript, deprecations of older APIs, and the adoption of Testing Library as the preferred testing tool. Mastering Dependency Management with Carmen Huidobro December 5th, 2024 | Season 4 | 29 mins 28 secs Carmen Huidobro shares her journey and insights on effectively managing dependencies in React project, discussing the challenges and strategies for keeping a codebase up-to-date, including auditing and upgrading dependencies. She also talks tools and techniques that can simplify the process! TanStack and TanRouter with Tanner Linsley [Repeat] November 28th, 2024 | Season 4 | 30 mins 34 secs tanstack In this Thanksgiving repeat episode, Tanner Linsley, creator of TanStack and co-founder at Nozzle, dives into the evolution and philosophy behind TanStack, his work on TanRouter, and shares insights on the importance of type safety in routing within web development. The Rise of the Metaframeworks with Daniel Roe November 21st, 2024 | Season 4 | 31 mins 16 secs nuxt Daniel Roe, Nuxt core team leader, talks about the wide-ranging topic of meta-frameworks. Discover the benefits, use cases, and how these frameworks can transform the productivity of your development team, and delve into the rise of server-side rendering, React server components, and the role of AI in web development. void(0) with Evan You November 14th, 2024 | Season 4 | 46 mins 48 secs void0 Evan You, creator of Vue and Vite, discusses his new venture, void(0). He discusses the motivations behind founding void(0), the inefficiencies in JavaScript tooling, and the future of unified tooling stacks."
