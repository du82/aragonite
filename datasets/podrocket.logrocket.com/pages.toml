title = "PodRocket - A web development podcast from LogRocket - Josh Goldberg"
full_description = "Josh Goldberg Co-Host of PodRocket - A web development podcast from LogRocket Website Twitter YouTube LinkedIn Josh is an open source maintainer in the TypeScript ecosystem. He works to make web development better, most notably on typescript-eslint: the tooling that enables ESLint and Prettier run on TypeScript code. He is the author of Learning TypeScript (O’Reilly), a Microsoft MVP, an international conference speaker, a mentor, and a live code streamer. Josh Goldberg has hosted six Episodes. void(0) with Evan You [Repeat] December 26th, 2024 | Season 4 | 46 mins 48 secs void0 In this holiday repeat episode, Evan You, creator of Vue and Vite, discusses his new venture, void(0). He discusses the motivations behind founding void(0), the inefficiencies in JavaScript tooling, and the future of unified tooling stacks. Rocket Surgery 2024: Year in review December 19th, 2024 | Season 4 | 38 mins 12 secs rocket surgery Join us on PodRocket's yearly wrap-up episode as Emily and our hosts— Paige, Noel, Josh, and Paul—discuss significant tech trends of 2024 and predictions for 2025. Topics include AI advancements, React development, the potential impact of Void0, and the controversy surrounding Oracle's JavaScript trademark. void(0) with Evan You November 14th, 2024 | Season 4 | 46 mins 48 secs void0 Evan You, creator of Vue and Vite, discusses his new venture, void(0). He discusses the motivations behind founding void(0), the inefficiencies in JavaScript tooling, and the future of unified tooling stacks. Rewriting JavaScript, Svelte 5, and Void(0) October 31st, 2024 | Season 4 | 37 mins 19 secs javascript, panel, svelte, void0 In this panel episode, join our producer Emily and hosts Josh and Paul as they discuss the debate around rewriting JavaScript tools in faster languages, the exciting release of Svelte 5, and the newly introduced Void Zero toolchain. Fullstack TypeScript with Erik Hanchett August 28th, 2024 | Season 4 | 32 mins 55 secs fullstack typescript In this episode, Erik Hanchett, senior developer advocate at AWS Amplify, explores the world of Fullstack TypeScript. He discusses the significance of end-to-end type safety, the tools to achieve it, and delves into the benefits and functionalities of AWS Amplify. Integrating TypeScript into Node.js with Marco Ippolito August 8th, 2024 | Season 4 | 25 mins 48 secs node.js Marco Ippolito, Node.js collaborator and TSC member, discusses the exciting integration of TypeScript into Node.js. He explores the new experimental features, the challenges faced in development, and what this means for the future of JavaScript and TypeScript development. (Please note that the ideas and opinions expressed in this video are Marco’s own and do not reflect the views of the entire project or its contributors.)"
