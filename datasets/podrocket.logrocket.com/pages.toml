full_description = "Matthew Arbesfeld Co-Host of PodRocket - A web development podcast from LogRocket LinkedIn CEO and Co-Founder at LogRocket Matthew Arbesfeld has hosted eight Episodes. Bonus: The Dev Starter Pack with Dani Grant, Beyang Liu, Ricky Robinett, and Matt Arbesfeld September 27th, 2024 | Season 4 | 22 mins 49 secs frontend development, startup, technology, web development In this special episode of PodRocket introducing the Dev Starter Pack, Matt Arbesfeld, CEO of LogRocket, talks to Dani Grant (CEO of Jam.dev), Ricky Robinett (VP of Developer Relationships at CloudFlare), and Beyang Liu (CTO and co-founder of Sourcegraph), about this new alliance of essential development tools designed for next-generation developers building the future of technology. They talk about the benefits of the stack, insights into each tool provided by the guests, and the potential impact of AI on web development. ICYMI: Figma with Dylan Field September 2nd, 2023 | Season 3 | 46 mins 38 secs figma In this repeat episode picked by PodRocket host Sean Rayment, CEO and Co-Founder of Figma, Dylan Field, joins us to talk about the collaborative design tool, the importance of design, and more. ICYMI: Remix in 2023 with Michael Jackson August 19th, 2023 | Season 3 | 31 mins 41 secs remix, shopify In this repeat episode picked by host Noel Minchow, Michael Jackson joins us to talk about Remix joining Shopify! We cover topics like Hydrogen (the Shopify stack for headless commerce), the future of Remix, and more! Deno with Ryan Dahl (Repeat) June 17th, 2023 | Season 3 | 31 mins 34 secs deno, javascript runtimes, node.js We sit down with Ryan Dahl, creator of Deno and Node.js, to talk about his experience in web development, why he created Node.js, and why he sees Deno as the next step for JavaScript runtimes Remix in 2023 with Michael Jackson January 24th, 2023 | Season 3 | 31 mins 26 secs #remix #shopify In this episode, Michael Jackson joins us to talk about Remix joining Shopify! We cover topics like Hydrogen (the Shopify stack for headless commerce), the future of Remix, and more! Deno with Ryan Dahl December 14th, 2022 | Season 2 | 31 mins 25 secs deno, javascript runtimes, nodejs, web development We sit down with Ryan Dahl, creator of Deno and Node.js, to talk about his experience in web development, why he created Node.js, and why he sees Deno as the next step for JavaScript runtimes. Figma with Dylan Field December 7th, 2022 | Season 2 | 46 mins 22 secs design, development, figma CEO and Co-Founder of Figma, Dylan Field, joins us to talk about the collaborative design tool, the importance of design, the early stages of Figma, and more. Introducing LogRocket’s Galileo October 27th, 2022 | Season 2 | 7 mins 50 secs dev tools, logrocket Today, we have a message from LogRocket, the company behind PodRocket. LogRocket CEO, Matthew Arbesfeld, and Senior Engineering Manager, Renzo Lucioni, sit down to talk about LogRocket's new machine learning layer Galileo. Galileo cuts through the noise of traditional monitoring and analytics tools while proactively scanning your applications to surface the most critical issues impacting your users."
