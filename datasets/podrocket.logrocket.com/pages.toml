full_description = "Kaelan Cooter Co-Host of PodRocket - A web development podcast from LogRocket Software Engineer at LogRocket Kaelan Cooter has hosted eight Episodes. Rocket Surgery: 2022 in review with Kaelan Cooter and Noel Minchow December 21st, 2022 | Season 2 | 1 hr 4 mins frontend development, javascript, web development It’s the most wonderful time of the year… to serve hot takes on 2022. Join PodRocket hosts Noel and Kaelan as they discuss the ups and downs of web development in 2022, what they hated, what they loved, and how they think the industry will change in 2023. What's new in Firebase with Kirupa Chinnathambi June 17th, 2022 | Season 2 | 22 mins 7 secs data, firebase, google Kirupa Chinnathambi, Product Manager at Google, joins us to talk about Firebase Extensions, integrations, and more. Remix with Chance Strickland April 15th, 2022 | Season 2 | 26 mins 8 secs frontend development, javascript, react We talk to Chance Strickland, software engineer at Remix Software, about Remix, how it builds better websites out of the box, and why the team calls it a full-stack framework. Rocket Surgery: 2021 year in review and 2022 predictions January 4th, 2022 | Season 2 | 56 mins 33 secs frontend development, frontend web development, software engineering, tech, technology, web development Happy New Year! In this episode, we revisit the predictions we made last year for 2021, we reflect on the most significant trends in web development in 2021, including updates, dev tooling, programming languages, and more. We also make some predictions for 2022. Qwik, Partytown, and builder.io with Misko Hevery November 9th, 2021 | Season 1 | 47 mins 29 secs frontend development, frontend web development angular, software engineering, tech, technology, web development Misko Hevery, the creator of Angular, joins us to talk about his latest projects at builder.io including Qwik, the HTML first framework, and Partytown, a lazy-loaded 6kb library to help relocate resource-intensive scripts into a web worker, and off of the main thread. Learn more in this episode. Progressive web apps with Aaron Gustafson November 2nd, 2021 | Season 1 | 48 mins 28 secs frontend development, frontend web development, progressive web apps, software engineering, tech, technology, web development We talk to Aaron Gustafson, author, speaker, Principal Program Manager on the Microsoft Edge team, and long-time web standards advocate, about progressive web apps. Listen now. RxJS with Ben Lesh August 17th, 2021 | Season 1 | 40 mins 15 secs frontend development, frontend web development, rxjs, software engineering, tech, technology, web development In this episode, we sit down with Ben Lesh, RxJS Project Lead. We wanted to know more about observables, use cases, and common pitfalls when using RxJS. Learn more in this episode. Rust with Luca Palmieri July 30th, 2021 | Season 1 | 28 mins 10 secs backend development, rust, software engineering, tech, web development In the episode, Ben and Kaelan interview Luca Palmieri, author of Zero To Production In Rust. They talk about the Rust ecosystem, Rust frameworks, and telemetry for Rust APIs."
