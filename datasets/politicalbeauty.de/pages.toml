["https://politicalbeauty.de/soko-chemnitz.html"]
title = "SOKO Chemnitz | Zentrum für Politische Schönheit"
description = "Das Herzstück der Soko-Fahndung: Ein Katalog mit 1.500 Fahnenflüchtigen des Grundgesetzes. Wer sind die Drückeberger vor der Demokratie? Was tun sie den ganzen Tag? Wer legte die drittgrößte Stadt im Osten Deutschlands symbolpolitisch in Schutt und Asche?"
full_description = "JETZT MITMACHEN Kompliz:in werdenSpenden · ÜberweisenPaypal News InstagramTwitterYouTube Sites StartAktionenEnglischImpressum & Datenschutz Es war DAS Fanal nach 1945: Während normale Menschen arbeiten, treiben tausende Arbeitnehmer (und Staatsdiener) Ausländer durch Chemnitz, greifen die freie Presse und Polizeibeamte an und grüßen Hitler. – Was sagt eigentlich ihr Chef dazu?Um das herauszufinden, haben wir über 3 Millionen Bilder von 7.000 Verdächtigen ausgewertet. Das Ziel: den Rechtsextremismus systematisch zu identifizieren und unschädlich zu machen. Mit der »Soko Chemnitz« rollt die größte Entnazifizierungsaktion des Landes seit 1945 an.Die Bevölkerung ist aufgerufen, Arbeitskollegen, Nachbarn und Bekannte bei der Soko zu denunzieren und Sofort-Bargeld zu kassieren. In überwältigendem Ausmaß wird der Soko Chemnitz bei ihrer Aufklärungsarbeit geholfen. Gemeinsam verbannen wir Problemdeutsche großflächig aus Wirtschaft und öffentlichem Dienst. »Aktionen, mit denen Menschen kreativ auf eine Veränderung der Verhältnisse hinwirken, hat Joseph Beuys als Kunstform bezeichnet, als soziale Plastik. Mit seiner Intervention ermöglicht das ZPS eine neue Interpretation seiner erklärten Gegenspieler im öffentlichen Raum: Was sich da auf der Straße zeigt und umstürzen will, das ist der Mob als nationalsoziale Plastik.« »Die linksextreme Gruppe Zentrum für Politische Schönheit ruft dazu auf, Demonstrationsteilnehmer in bester Stasi-Manier zu denunzieren, um deren wirtschaftliche Existenz zu vernichten. Ein Land, in dem so etwas ›Kunst‹ ist und dessen Medien dies sogar noch positiv und unkritisch berichten, ist krank. Die Strafanzeigen sind richtig und notwendig.« Das Herzstück der Soko-Fahndung: Ein Katalog mit 1.500 Fahnenflüchtigen des Grundgesetzes. Wer sind die Drückeberger vor der Demokratie? Was tun sie den ganzen Tag? Wer legte die drittgrößte Stadt im Osten Deutschlands symbolpolitisch in Schutt und Asche? Belohnungen für gesuchte Nazis stockt die Zivilgesellschaft per Paypal auf. Die wichtigste Frage der Nazis an die Polizei (laut Strafanzeige): Ist das Kopfgeld steuerpflichtig?Bei den Informanten handelt es sich in der Regel nicht um lupenreine Demokraten. Der Nazi-Kumpel verpfeift seinen besten Freund für 100 Euro."
