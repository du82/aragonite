["https://politicalbeauty.de/2099.html"]
title = "2099 | Zentrum für Politische Schönheit"
description = "Vier Philosophen reisen auf die Bühne des Schauspiel Dortmund, um das Rad der Geschichte zu drehen, bevor es zu spät ist."
full_description = "JETZT MITMACHEN Kompliz:in werdenSpenden · ÜberweisenPaypal News InstagramTwitterYouTube Sites StartAktionenEnglischImpressum & Datenschutz Ein Zeitreise-Team aus dem Jahr 2099 macht sich in unsere Gegenwart auf. Im Gepäck: Das Wissen um die Geschichte des 21. Jahrhunderts: Adschembas »Große Katastrophen« (Ostafrika, 2029-2034), die Verbrechen des chinesischen Nationalisten Hao Kim Helian (ab 2082) und das Attentat auf den »aggressiven Humanisten« und Bundeskanzler Franz-Kevin Wegener. Vier Philosophen reisen auf die Bühne des Schauspiel Dortmund, um das Rad der Geschichte zu drehen, bevor es zu spät ist.Menschen vom Ende des Jahrhunderts stehen Menschen vom Beginn des Jahrhunderts gegenüber. Aus dieser Konfrontation springt der Funke einer historischen Kraft: Menschen, die sich gerade aufmachen, ihr politisches Wollen zu erkunden, werden mit dem Urteil der Geschichte konfrontiert. Im theatre noir geht es um einen Materialfehler der menschlichen Vorstellungskräfte, den Alexander Kluge an einer jungen Mutter im Bombenkeller Halberstadts aus dem Jahre 1944 festmacht. Kluge stößt auf ein promethisches Gefälle zwischen Organisations- und Bewusstseinsfrage: »Sie hätte vielleicht Mittel gehabt im Jahr 1928, wenn sie sich da noch, vor einer Entwicklung, die dann auf Papen, Schleicher und Hitler zuläuft, mit andern organisiert hätte. Also die Organisationsfrage liegt 1928 und das dazu gehörige Bewusstsein liegt 1944.«Die junge Frau hätte im Jahre 1919 – spätestens 1928 – den Kampf gegen Hitler organisieren müssen. Aber die Dringlichkeit der Organisation, die Frage, warum sie 1919 hätte handeln müssen, wird ihr erst 1944 schmerzlich bewusst – zu spät, um sich vor den Bombenangriffen der Alliierten in Sicherheit zu bringen. Die amerikanischen Bombenpiloten fliegen unerreichbar über ihr. Aufrütteln anno 1915: Der Heizer Johann warnt in der »Pension Schöller« (in der Volksbühne) vor einer Katastrophe ungeahnten Ausmaßes. Durch die Retrospektivierung der Gegenwart werden historisches Denken und Fühlen erst möglich. Weil die meisten Menschen sich die Zukunft nicht vorstellen können, kommt alles darauf an, ihnen eine Vorstellung von der Zukunft zu geben."
year_published = 2025
clearnet = "https://politicalbeauty.de/2099.html"
tags = ["1915:", "1928,", "1944.«die", "2099:", "aber", "abschlachten.", "adschembas", "aktion", "aktionskünstler", "alexander"]
