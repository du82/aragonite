["https://politicalbeauty.de/75-jahre-weisse-rose.html"]
title = "Sophie und Hans Scholl | Zentrum für Politische Schönheit"
description = "Werde Teil der Legende: Staatsregierung sucht junge Menschen für einen außergewöhnlichen Wettbewerb. Wie sehen die Geschwister Scholl heute aus? Unter dem Motto »Mach mit« rollt durch den Freistaat Bayern die Promo-Tour für die Suche nach den Helden von morgen.In den Fußstapfen der Geschichte: Die Staatsregierung unter Joachim Herrmann sucht nach den neuen Geschwister Scholl. Du bist mutig, engagiert und träumst davon, Geschichte zu schreiben? Mit Infoständen vor der Ludwig-Maximilian-Uni, auf Schulhöfen, an der Gedenkstätte der Weißen Rose, in der Kaufinger- und Maximilianstraße."
full_description = "JETZT MITMACHEN Kompliz:in werdenSpenden · ÜberweisenPaypal News InstagramTwitterYouTube Sites StartAktionenEnglischImpressum & Datenschutz Im Sommer 1942 schreiben Hans und Sophie Scholl Geschichte. Als Mitglieder der Weißen Rose verfassen sie vier von sechs kühnen Flugblättern und bringen sie in Umlauf. Mit ihrem Mut dringen sie ins kollektive Gedächtnis ein und wirken bis heute fort. Wie würden sie das Schweigen unserer Gegenwart durchbrechen, die sich immer noch vor Diktatoren wegduckt? Wie würden sie heute versuchen, die Welt von der Tyrannei zu befreien?Mutige Jugendliche gesucht: Die Bayerische Staatsregierung ruft den Schülerwettbewerb »Scholl 2017 – Von der Vergangenheit lernen« ins Leben. Zum 75. Jubiläum der Weißen Rose sollen die Widerstandstaten der Geschwister Scholl reaktiviert werden. Staatsminister Joachim Herrmann und Ludwig Spaenle suchen junge Menschen, die bereit sind, in eine Diktatur zu reisen, um Flugblätter gegen die Diktatur zu verteilen. Auf den Spuren der Weißen Rose: Bus-Tour sucht Nachwuchshelden. Ein Bus tourt durch den Freistaat: in der Schüler-Registratur auf Münchens teuerster Einkaufsstraße werden junge Menschen gesucht, die sich als neue Geschwister Scholl registrieren und Flugblätter in einer Diktatur verteilen. Werde Teil der Legende: Staatsregierung sucht junge Menschen für einen außergewöhnlichen Wettbewerb. Wie sehen die Geschwister Scholl heute aus? Unter dem Motto »Mach mit« rollt durch den Freistaat Bayern die Promo-Tour für die Suche nach den Helden von morgen.In den Fußstapfen der Geschichte: Die Staatsregierung unter Joachim Herrmann sucht nach den neuen Geschwister Scholl. Du bist mutig, engagiert und träumst davon, Geschichte zu schreiben? Mit Infoständen vor der Ludwig-Maximilian-Uni, auf Schulhöfen, an der Gedenkstätte der Weißen Rose, in der Kaufinger- und Maximilianstraße. »Flugblätter verunsichern Diktaturen und sind heute noch notwendig. So verstehe ich diese Aktion!« Das Bildungsministerium ruft Gymnasien zu Widerstands-Unterricht auf. Die Weiße Rose inspirierte 75 Jahre lang ganze Generationen. Nun ruft Bayerns Bildungsministerium die Schulen zum Handeln auf: Arbeitsmaterialien und Aufgaben für den Unterricht werden zusammen mit der Anordnung des bayerischen Bildungsministers an über 450 Gymnasien per Einschreiben verschickt. Unverzüglich sind zwei Doppelschulstunden anzusetzen und die Schülerinnen und Schüler auf die Möglichkeit des Auslandseinsatzes hinzuweisen. Bayern will unbedingt ein Zeichen gegen die drohende Diktatur setzen."
