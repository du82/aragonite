title = "Frieda Belinfante | Zentrum für Politische Schönheit"
description = "Frieda Belinfante (* 10. Mai 1904 in Amsterdam; † 5. März 1995 in Santa Fe, New Mexico) war eine niederländisch-amerikanische Cellistin, Dirigentin und Widerstandskämpferin gegen den Nationalsozialismus."
full_description = "JETZT MITMACHEN Kompliz:in werdenSpenden · ÜberweisenPaypal News InstagramTwitterYouTube Sites StartAktionenEnglischImpressum & Datenschutz Frieda Belinfante (* 10. Mai 1904 in Amsterdam; † 5. März 1995 in Santa Fe, New Mexico) war eine niederländisch-amerikanische Cellistin, Dirigentin und Widerstandskämpferin gegen den Nationalsozialismus. Sie gründete gemeinsam mit Frauen der Künstlervereinigung Kunst voor Allen, als erste weibliche Dirigentin in Europa, ihr eigenes Orchester. Dieses Kammerorchester trug den Namen Kleine Orkest und trat zum ersten Mal 1938 im Concertgebouw auf. Bei einem von Hermann Scherchen organisierten Dirigierwettbewerb in der Schweiz 1939 belegte Frieda Belinfante als einzige Frau im Wettbewerb den ersten Platz. Mit Beginn der deutschen Besatzung der Nieder­lande durch die Wehr­macht 1940 be­gin­gen Belin­fantes Bruder und dessen Frau Selbst­mord. Frieda löste ihr Orchester auf, da sie einige jüdische Mit­glie­der des Orchesters nicht gefährden wol­lte. Nach der Zwangs­gründung der an das Modell der deutschen NS-»Reichs­kul­tur­kam­mer« an­ge­lehn­ten nieder­ländischen »Kultur­kammer« mussten alle hol­län­dischen Künst­ler eine sogenannte »Ariererklärung« abgeben oder eine Ausnahmeregelung beantragen, um weiter als Musiker arbeiten zu können. Belinfante, die der NS-Rassenideologie zufolge als sogenannte »Halbjüdin« eingestuft wurde, weigerte sich, diese Ausnahme zu beantragen, weil für sie diese Art der Menschenselektion nicht in Frage kam. Sie ging schließlich in den Widerstand. Um die jüdischen Mitglieder ihres Orchesters sowie ihre Freundinnen und Kolleginnen vor Repressalien seitens der Gestapo zu schützen, begann sie im Alleingang, Ausweisdokumente zu fälschen. Später händigte sie die Dokumente an einen erweiterten Kreis an Personen aus, die von der Gestapo gesucht wurden. Diesen Akt des Widerstands führte Belinfante wenig später mit einem Netzwerk aus Kunstschaffenden fort, darunter der niederländische Kunstmaler und Schriftsteller Willem Arondeus sowie der niederländische Bildhauer Gerrit van der Veen. Beide waren Mitglieder der Widerstandsgruppe Persoonsbewijzencentrale (PBC), welche von Gerrit van der Veen und Frans Duwaer gegründet wurde. Allein die PBC und ihr Team aus Grafikern,"
