["https://politicalbeauty.de/die-toten-kommen.html"]
title = "Die Toten kommen | Zentrum für Politische Schönheit"
description = "Wir haben die toten Einwanderer Europas von den EU-Außengrenzen in die Schaltzentrale des europäischen Abwehrregimes geholt: in die deutsche Hauptstadt. Gemeinsam mit den Angehörigen haben wir menschenunwürdige Grabstätten geöffnet, die Toten identifiziert, exhumiert und nach Deutschland überführt."
full_description = "JETZT MITMACHEN Kompliz:in werdenSpenden · ÜberweisenPaypal News InstagramTwitterYouTube Sites StartAktionenEnglischImpressum & Datenschutz Wir verlieren jeden Tag hunderte Einwanderer. Europas Grenzen sind militärisch abgeriegelt – die tödlichsten Grenzen der Welt. Jahr für Jahr sterben Tausende Menschen beim Versuch, sie zu überwinden. Die Opfer der Abschottung werden massenhaft im Hinterland südeuropäischer Staaten verscharrt. Sie tragen keine Namen. Ihre Angehörigen werden nicht ermittelt. Niemand schenkt ihnen Blumen.Wir haben die toten Einwanderer Europas von den EU-Außengrenzen in die Schaltzentrale des europäischen Abwehrregimes geholt: in die deutsche Hauptstadt. Menschen, die auf dem Weg in ein neues Leben vor der Europäischen Union ertrunken sind, haben es über den Tod hinaus ans Ziel ihrer Träume geschafft. Gemeinsam mit den Angehörigen haben wir menschenunwürdige Grabstätten geöffnet, die Toten identifiziert, exhumiert und nach Deutschland überführt. Gegen alle Regeln der Wahrscheinlichkeit haben wir eine Mutter, die bei ihrer Einwanderung nach Europa durch unsere Untätigkeit ertrunken ist und von den Behörden »unbekannt« auf Sizilien verscharrt wurde, zu ihren Liebsten nach Deutschland überführt. Ihr zweijähriges Kind durften wir nicht mitbeerdigen. Dafür haben wir einen sechzigjährigen Einwanderer, der auf der Höllentortur des Mittelmeers kollabiert ist – und dessen toter Körper von den Behörden zehn Wochen beschlagnahmt wurde (um von seinen Angehörigen ein Geständnis gegen den Fluchthelfer wegen »Schlepperei« zu erpressen) – aus den Fängen der Bürokratie herausgelöst. Wir haben den gescheiterten Einwanderern die Würde zurückgegeben, die ihnen gebührt. Aber es geht nicht nur um die Rettung der Würde der Einwanderer. »Der Stunt, den diese Aktion bedeutet, die Radikalität, auch gedanklich, der Mut, der Schock, all das findet nicht statt in diesem tiefgefrorenen Milieu.« »Künstler graben auf Sizilien Flüchtlingsleichen aus und fahren sie unter Drogeneinfluss nach Deutschland.«"
