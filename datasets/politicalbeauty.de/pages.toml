["https://politicalbeauty.de/koeppel.html"]
title = "Schweiz entköppeln | Zentrum für Politische Schönheit"
description = "Die Kunst des Aufschreis: Warum das Abbild so herausfordernd ist. Wenn die Beschaffenheit der Reflexionsoberfläche dem zu spiegelnden Objekt entspricht, werden Spiegelreflexe ausgelöst. Es braucht bedrohlichen Stumpfsinn, Primitivität und Populismus, um dem wahren Abbild zu entsprechen. Eine Gesellschaft kann sich durch den Spiegel der Kunst selbst erkennen. Nichts ist wichtiger als die Förderung der Selbsterkenntnis. Die Erkenntnis kann weh tun und verletzen, der Aufschrei sogar die Kunst vernichten. Denn Kunst soll gefälligst argumentieren und unterhalten, bloss keinen Spiegel vorhalten. Schon gar nicht mehrere gleichzeitig.Die Bühnen stehen an unterschiedlichen Orten, aber niemals im Theaterraum. Dass ziemlich viele Menschen auf unsere Bühne rennen und offensichtlich nicht merken, dass sie da – im grellsten Scheinwerferlicht ausgeleuchtet – verloren rumstehen, ist nur in der Schweiz möglich. Die unfreiwilligen Akteure schreiben sich ihre Sprechrollen gleich selbst und die Theatermacher dürfen Pöatz nehmen und die Performance-Perlen in der real existierenden Weiteraufführung bestaunen."
full_description = "JETZT MITMACHEN Kompliz:in werdenSpenden · ÜberweisenPaypal News InstagramTwitterYouTube Sites StartAktionenEnglischImpressum & Datenschutz Theater gegen totalitäre Politik: Der Schweizer Rechtspopulist »Roger Köppel« ist vom Geist von Julius Streicher besessen. Dieser fremdenfeindliche Geist muss sofort exorziert werden. Es kommt zur unvermeidlichen Konfrontation: Theater gegen totalitäre Politik. SVP gegen die Macht der Fiktion. Ein afrikanischer Voodoo-Priester wird am Flughafen Zürich von den Schweizer Behörden an seiner Einreise gehindert – angeblich wegen fehlender Arbeitserlaubnis. Er verfluchte Roger Köppel von der Flughafen-Toilette aus. Ein politischer Exorzist springt daraufhin ein und setzt alles daran, den SVP-Politiker und Chefredakteur der »Weltwoche« vom Geiste des fanatischen Hetzers zu befreien.Aber die SVP möchte ihr Monopol auf Bürgerhetze wahren und verteidigt sich (von der SVP-Hetzpolitik in der »Weltwoche« ganz zu schweigen: »Totengräber der Demokratie«, »Der Falschmünzer«, »Die talentiertesten Subventionsjäger«). Ein ganzes Land gerät in einen kollektiven Tobsuchtsanfall. Eine Empathie-Erweiterungsaktion, die sich sachlich und argumentativ vollkommen korrekt und werkgetreu mit Roger Köppel auseinandersetzt, sorgt – statt mit der geplanten Entköppelung – für die totale Verköppelung eines Landes. An was man sich in Politik und Journalismus längst gewöhnt hat, also Flüchtlingshetze, persönliche Angriffe, Vernichtungswünsche, überschreitet in der Kunst »den guten Geschmack« und die »rote Linie«. »Linke Stimmen haben in diesem Diskurs schon lange nichts mehr zu sagen, der einzige grosse öffentliche Diskurs, der in diesem Land noch stattfindet, besteht aus einem Pingpong der SVP und hyperventilierenden Medien.« »Ist es mehr ein Wunder oder viel mehr ein Skandal, dass vermeintlich kritische und kluge Journalisten bis zum heutigen Tag über jedes verdammte Stöckchen springen, das ihnen Blocher hinhält?«"
