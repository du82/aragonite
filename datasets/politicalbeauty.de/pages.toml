["https://politicalbeauty.de/flyerservice-hahn.html"]
title = "Flyerservice Hahn | Zentrum für Politische Schönheit"
description = "»Die Jury zeichnet das Zentrum für Politische Schönheit aus, weil es eine neue, originelle Interpretation der Beziehung zwischen Fiktion, Realität und Geschichte im politischen Aktivismus darstellt. Die Gruppe ist bekannt für ihre kontroversen Aktionen und ihren Modus Operandi. Ihre eindringlichen Aussagen sind gut durchdacht und sorgfältig formuliert. Mit ihren Interventionen zeigen sie immer wieder, wie schlagkräftig man sein kann und sollte, wenn es um Humanismus geht. Das Zentrum spielt eine wichtige Rolle in der aktuellen politischen Sphäre, um die Öffentlichkeit für die gefährlichen Veränderungen zu sensibilisieren, die sich in ganz Europa vollziehen.«Der renommierte Professor Andreas Fischer-Lescano hat eigens ein Gutachten für den Flyerservice Hahn geschrieben. Darin findet er harsche Worte, dass Staatsanwaltschaft und das zuständige Gericht das fiktive Unternehmen nicht unter Artenschutz-Grundrechtsschutz stellen (»der zweifellos unter Grundrechtsschutz stehenden Aktion ›Flyerservice Hahn‹«). Auf 30 Seiten gelangt Fischer-Lescano zu dem Schluss: »Die Aktion Flyerservice Hahn des Zentrums für Politische Schönheit stellt nach allen drei Kunstbegriffen, die das Bundesverfassungsgericht entwickelt hat, Kunst im Sinne des Art. 5 Abs. 3 Satz 1 GG dar.«Die Aktion beschreibt er als eine Art schwarzes Loch, das die AfD – qua ihrer Kunstaffinität – in sich hineinziehen sollte: »Zu keinem Zeitpunkt handelten Mitglieder des Zentrums in der Absicht, rechtlich wirksame Transaktionen oder gar Vermögensverschiebungen zu bewirken. Das war auch nicht die sichere Folge der Aktion, deren Ziel als hyperrealistische Aktionskunst es war, die AfD über die künstlerische Mimikry eines Flyer-Dienstleisters in die künstlerische Inszenierung einzubinden […]. Der Flyerservice war insofern das künstlerische Instrument, um mit der AfD in künstlerischen Kontakt zu treten – nicht, um die AfD im Rechtssinne zu täuschen, sondern um sich mit ihr im Kunstsinne auseinanderzusetzen«. (S. 23) Auch die Durchsuchungsbeschlüsse gegen das Zentrum hält Fischer-Lescano für »verfassungsrechtlich nicht gerechtfertigt«. Und dem Gericht empfiehlt er letztlich vornehmer ausgedrückt einen Nachhilfekurs in Sachen Grundgesetz und Kunstfreiheit: »In der Sache hat das Gericht den Einfluss der Grundrechte grundlegend verkannt.« (S. 30)"
full_description = "JETZT MITMACHEN Kompliz:in werdenSpenden · ÜberweisenPaypal News InstagramTwitterYouTube Sites StartAktionenEnglischImpressum & Datenschutz Das Zentrum für Politische Schönheit hat im Superwahljahr 2021 den Flyerservice Hahn gegründet: den besten Flyerservice Europas!Unglaublich, aber wahr: Eine nichtexistierende GmbH, ohne reale Geschäftsadresse, Handelsregistereintrag oder Steuernummer, macht allen AfD-Verbänden in der Republik ein unschlagbares Angebot – das sie nicht ablehnen können.Ein fiktives Unternehmen akquiriert Aufträge in Millionenhöhe. Warum sollte eine Superpartei und echte Alternative ihre Flyer auch selbst verteilen wie die ganzen Trottel von den Altparteien?Das Ergebnis: 85 faule Orts-, Kreis- und Landesverbände der AfD liefern und liefern fleissig in das bundesweite Netzwerk von Logistikzentren unseres Weltmarktführers ein. Am Ende vergammeln in unseren Lagern: 5 Millionen Flyer. 72 Tonnen übelster rechtsextremer Propaganda. Willkommen beim Flyerservice Hahn! Die einzige weltweit nur von Björn Höcke anerkannte Terrororganisation. Wir machen für Sie Stress und radikalen Humanismus. Als Kompliz:in leisten Sie einen unschätzbaren Beitrag zur Erregung öffentlicher Unruhe. Sie erhalten nirgends so viel Aufruhr und Dissens für jeden gespendeten Euro wie bei uns. Nein. Wir haben der AfD lediglich angeboten, ihre Wahlkampfmaterialien für sie zu verteilen. Die Partei hat das Angebot dankbar angenommen und uns 72 Tonnen Müll geliefert. Weil wir so entsetzt von der Propaganda waren, haben wir es dann leider nicht mehr geschafft, irgendwelches Material zu verteilen. Nein. Wir sind fest davon überzeugt, dass unsere schmierigen Lieferanten von der AfD keinerlei Anspruch auf die Verteilung demokratiefeindlicher Propaganda – noch dazu von einer Phantasiefirma ohne jede Rechtsform – haben. So etwas müssten sie schon selbst erledigen. Es ist ja nicht unser Problem, dass die AfD keinerlei Mitglieder hat, die bereit sind, Flyer zu verteilen, sondern die offenbar den ganzen Tag damit beschäftigt sind, Hitlergrüße im eigenen Vorgarten zu zeigen. Die AfD hatte die freie Wahl, welchen Dienstleister sie beauftragen will. Wir haben sie zu nichts gezwungen. Und ob bei der Auftragsvergabe innerhalb der AfD alles mit Rechten Dingen zugegangen ist – da dürften noch einige Überraschungen folgen. Wir freuen uns auf die juristische Aufarbeitung und werden unsere klagefreudigen Kund*innen ins Scheinwerferlicht rücken – mit ihren Verbindungen ins rechtsextreme Milieu (honey pots) und den tatsächlichen Finanziers ihrer Propaganda."
