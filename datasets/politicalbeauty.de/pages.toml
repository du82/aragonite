["https://politicalbeauty.de/kriminelle_vereinigung.html"]
title = "§ 129 StGB - Bildung einer kriminellen Vereinigung"
description = "Schwerer Angriff auf die Kunstfreiheit: Der Staat ermittelte 16 Monate gegen das Zentrum für Politische Schönheit (ZPS) nach § 129 StGB als »kriminelle Vereinigung«."
full_description = "JETZT MITMACHEN Kompliz:in werdenSpenden · ÜberweisenPaypal News InstagramTwitterYouTube Sites StartAktionenEnglischImpressum & Datenschutz Schwerer Angriff auf die Kunstfreiheit: Der Staat ermittelte 16 Monate gegen das Zentrum für Politische Schönheit nach § 129 StGB als »kriminelle Vereinigung«. Das dürfte einmalig in der Geschichte der Bundesrepublik sein. In einem Rechtsstaat wird die politische Kunst als Form der »organisierten Kriminalität« verfolgt und die Verfassung gebrochen, die das Recht auf eine freie und kritische Kunst garantiert. Gemäß § 129 ist das ZPS eine Organisation, deren hauptsächlicher Zweck darin besteht, schwere Straftaten zu verüben. Auf der entsprechenden Liste in Thüringen standen wir mit zwölf weiteren Terrororganisationen (vom »Islamischen Staat« bis »Al Nusra Front«).Der ermittelnde Staatsanwalt wird vom Staatsschutz versetzt. Wer trägt die politische Verantwortung dafür? Wir benötigen jede Form der Solidarität, um diesen Bruch mit der Verfassung nicht auf sich beruhen zu lassen! Wer die Kunstfreiheit angreift, greift die Verfassung an. »Ist Ihnen ein ähnlicher Fall bekannt? – Nein, absolut nicht.«Jürgen Möthrath · Präsident des deutschen Strafverteidigerbundes · DIE ZEIT»Man muss es dreimal sagen, um den Wahnsinn, der hinter diesen Ermittlungen steckt, zu begreifen! Ich kenne keinen einzigen vergleichbaren Fall! Ich kenne keine Gruppe, die eine intellektuelle Auseinandersetzung sucht, die nach Paragraf 129 verfolgt wurde.«Peter Raue · Rechtsanwalt und Notar · Deutschlandfunk»Mit § 129 wird üblicherweise gegen Rockerbanden und Drogenkartelle ermittelt. Solche Ermittlungen wegen der Bildung einer kriminellen Vereinigung setzen voraus, dass besonders schwere Straftaten begangen oder geplant werden – Mord, Totschlag, Raub, Vergewaltigung, Drogenhandel. Sie ermöglichen einen intensiven Zugriff auf die Verdächtigen. […] Es entsteht so der Eindruck, dass sich die Staatsanwaltschaft Gera in Gestalt des Staatsanwalts Zschächer zu Höckes Handlanger macht. Es riecht nach Rechtsbeugung.«Heribert Prantl · Jurist und Publizist · Süddeutsche Zeitung»Entgegen weit verbreiteter Meinung ist die Weisungsabhängigkeit der Staatsanwaltschaft keineswegs undemokratisch oder rechtsstaatswidrig. Die Staatsanwaltschaft ist Exekutive und grundsätzlich der politischen Leitung verantwortlich! Auch Nichtstun der Regierung ist politisches Verhalten.«Henning Ernst Müller · Professor für Strafrecht · Twitter»Ziemlicher Wahnsinn und höchst brisant. Gegen eine Künstlergruppe ist dieser Paragraf überhaupt noch nie in Stellung gebracht worden!«Hartmut Wächtler · Rechtsanwalt und Strafrechtsexperte · Süddeutsche Zeitung»Es ist meines Wissens noch nie passiert, dass Kunst im Zusammenhang mit der Bildung einer kriminellen Vereinigung eine Rolle gespielt hätte. […] Es ist ein Novum.«Uwe Scheffler · Professor für Strafrecht · Freie Presse»Ich kann auch in den anderen Aktivitäten des Zentrums nichts erkennen, das die Auffassung bestärkte, es sei zur Begehung von Straftaten gegründet worden.«Christoph Möllers · Professor für Verfassungsrecht · Berliner Zeitung"
year_published = 2025
