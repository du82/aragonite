["https://politicalbeauty.de/25000.html"]
title = "25.000 Euro Belohnung | Zentrum für Politische Schönheit"
description = "25.000 Euro Belohnung auf die Eigentümer des Panzerkonzerns Krauss-Maffei Wegmann (KMW), um sie dorthin zu bringen, wo sie hingehören: ins Gefängnis. Großplakate in ganz Deutschland versprechen Geld für Hinweise auf Delikte wie Steuerhinterziehung, Geldwäsche oder Kapitalanlagebetrug."
full_description = "JETZT MITMACHEN Kompliz:in werdenSpenden · ÜberweisenPaypal News InstagramTwitterYouTube Sites StartAktionenEnglischImpressum & Datenschutz Das Ziel: Das größte Waffengeschäft in der jüngeren deutschen Geschichte verhindern. Der Weg: Wir loben 25.000 Euro Belohnung aus, um einen der Eigentümer des Panzerkonzerns Krauss-Maffei Wegmann (KMW) ins Gefängnis zu bringen. Großplakate in ganz Deutschland versprechen Geld für Hinweise auf Delikte wie Steuerhinterziehung, Geldwäsche oder Kapitalanlagebetrug.Beabsichtigter Nebeneffekt: die verschwiegenen Waffenhändler werden über Nacht aus ihrem Schattendasein geholt und gelangen unfreiwillig zu bundesweiter Berühmtheit. Die etablierten Medien können mit Hilfe der Aktion die zentralen Profiteure des Milliardendeals der Bundesregierung mit Saudi-Arabien benennen. Es geht immerhin um den Export von 270 Leopard II-Panzern in eine zweifelhafte Diktatur.In drei Monaten erscheinen über 2.500 Artikel, die die Kraft dieser neuen Form von »sozialer Würgeplastik« entfalten. Selbst engste Vertraute, Arbeitgeber und Weggefährten wenden sich von den Besitzern ab. Und der Waffendeal mit Saudi-Arabien scheitert. Den Eigentümern drohen für ihre Waffenlieferungen an ein Schreckensregime eigentlich keinerlei rechtliche Konsequenzen. Aber: Gemeinsam bringen wir sie dennoch in den Knast! Plakate, Fahndungsposter, Flyer, Postkarten versprechen den Tippgebern 25.000 Euro Belohnung, wenn es gelingt, einen der Eigentümer des Panzerkonzerns Krauss-Maffei Wegmann zu verurteilen. Sogar Graffitis der Konterfeis der Waffenhändler tauchen in deutschen Großstädten auf – Street-Art für Gerechtigkeit. Visuelle Schändung von 38 deutschen Waffenhändlern: Statt sich auf die Waffenfirma einzuschiessen, treiben die Helferinnen der Gerechtigkeit die Eigentümer vor sich her. Die Zentrums-Erinye Tisiphone schleppt Wasser herbei, um die Waffenhändler im Bildnis zu ertränken (executio in effigie). Waldorfschüler, Künstler, Fotografen, Lehrer, Psycho