["https://politicalbeauty.de/mahnmal.html"]
title = "Höckes Holocaust-Mahnmal | Zentrum für Politische Schönheit"
description = "Höcke hat die Presse exzessiv und aktiv in sein »Bullerbü« (Höcke in der NZZ) geholt und sein Haus wiederholt zur Propagandabühne gemacht. Er freut sich auch »über die Gespräche mit den Nachbarn über die kleinen Sorgen und Nöte« (wir sind seine direkten Nachbarn). Er erwähnt seinen Wohnort in jedem Interview. Das tat er auch schon 2011 und 2012, als er noch als Landolf Ladig die NPD hochschrieb und die deutsche Kriegsschuld leugnete. Einen Tag vor der Dresdner Rede schreibt er in einem Rundbrief an die AfD-Mitglieder: »Das Thüringische Eichsfeld ist zu meinem Refugium geworden. Es ist mir Rückzugs-, Inspirations- und Regenerationsraum.« Er hat wiederholt Aufnahmen seines Wohnhauses gezeigt und inszeniert sein braunes Haus. Es zirkulieren sogar öffentliche Aufnahmen aus seinem Garten und aus dem Hausinneren. Höcke hat das Private längst öffentlich gemacht und für Propagandazwecke instrumentalisiert.Das Landgericht Köln hat letzten Endes aus diesem Grund seine Klage gegen uns wegen Verletzung seiner Privatsphäre auch abgeschmettert und festgestellt, dass das Recht auf Privatsphäre und Persönlichkeitsrechte in diesem Fall der Kunstfreiheit unterliegt. Es ist ein bahnbrechendes Urteil für die Freiheit der Kunst: hier die letzten zehn Seiten."
full_description = "JETZT MITMACHEN Kompliz:in werdenSpenden · ÜberweisenPaypal News InstagramTwitterYouTube Sites StartAktionenEnglischImpressum & Datenschutz Ein Mahnmal gegen die schleichende Normalisierung des Faschismus in Deutschland. Das Zentrum für Politische Schönheit hat sich eine Immobilie in bester Lage im Kampf gegen den modernen Rechtsextremismus gesichert: in direkter Nachbarschaft zum thüringischen AfD-Fraktionschef Björn Höcke. Seit Februar 2017 ist das Zentrum für Politische Schönheit im Besitz des direkten Nachbargrundstücks von Höcke. Es ist ein symbolischer Schlag gegen die rechtsextreme Szene, am 22. November um 6 Uhr früh. Der Lärm von Betonpumpen reißt den AfD-Fraktionsvorsitzenden Björn Höcke in aller Früh aus dem Schlaf. Sein 500 Jahre altes Pfarrhaus bebt. Als er zum Fenster stürmt, traut er seinen Augen nicht: Direkt vor seinem Haus entsteht der Erweiterungsbau des Denkmals für die ermordeten Juden Europas. Höcke zittert. Seit diesem kalten Novembertag wird zurückgedacht. 24 Stelen, am Computer geplant, das Gelände mit Lasern ausgemessen, die Bauteile vorgefertigt und in einer verdeckten Operation über Wochen angeliefert. Unser hundertköpfiges Bauteam errichtet in einer Rekordzeit von nur fünf Tagen das Mahnmal am Rande der Schande. Eine Meisterleistung: Höcke bemerkt nichts. Jede Stele eine Maßanfertigung, auf 18 x 13 Metern, winter- und sturmfest, zudem auch sicher gegen Nazis. Eine Trutzburg der wehrhaften Demokratie. Die Polizei observiert mit Helikoptern aus der Luft – und am Boden. Weil ein Holocaust-Mahnmal nach Thüringen erweitert wird. Nach den ersten Drohungen und Schäden an unserem Denkmal zieht sich die Polizei zurück und kündigt an: »In Deutschland ist jeder selbst für den Schutz seines Eigentums zuständig«, was einer Einladung an die Neonaziszene gleichkommt. Die Verfassungsgarantie Kunstfreiheit wird scheinbar nicht allzu groß geschrieben in der rational befreiten Zone Bornhagen. Die Polizei in Thüringen verweigert den Schutz: Das Mahnmal gegen Nazis ist auf sich allein gestellt. Und dennoch triumphiert es am Ende über Wind, Wetter und Nazis."
