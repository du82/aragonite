full_description = "JETZT MITMACHEN Kompliz:in werdenSpenden · ÜberweisenPaypal News InstagramTwitterYouTube Sites StartAktionenEnglischImpressum & Datenschutz Unterstützen Sie uns jetzt! Als Kompliz:in leisten Sie einen unschätzbaren Beitrag zur Erregung öffentlicher Unruhe – für den radikalen Humanismus. Werden Sie jetzt konkret und machen Eskalation möglich. Jeder Beitrag hilft. Kompliz:in werden Sie mit einer jährlichen Unterstützung ab 120 € (10 €/Monat). Sie erhalten nirgendwo so viel Aufruhr und Dissens für jeden gespendeten Euro wie bei uns. Politischer StressWollen Sie radikalen Humanismus? Das Zentrum für Politische Schönheit wird von über 4.000 Kompliz:innen und Komplizen möglich gemacht. Die Aktionen werden von Privatpersonen wie Ihnen finanziert. Schon Ihr kleiner, regelmäßiger Beitrag hilft uns, robuster zu handeln und Menschenverachtung nicht davonkommen zu lassen. Als Komplizin ermöglichen Sie dem Zentrum für Politische Schönheit, sich juristisch zur Wehr zu setzen und Aktionen zu verwirklichen. Die Zukunft der RevolutionWerfen Sie einen Blick auf die Zukunft: Wo sich die klassischen Formen des Protests (Lichterketten und Onlinepetitionen) totlaufen, finden wir neue! Unsere Aktionen haben schon Geschäftsleute in Seenotretter, Mitglieder der Bundesregierung in Humanisten und Waffenhändler in Aussteiger verwandelt. Erfahren Sie zuerst von unseren Aktionen, die Staatsrechtler Prof. Gerd Seidel als »eine Gefahr für die nationale Sicherheit Deutschlands« bezeichnet hat. Und hören Sie die Geschichten hinter den Kulissen. Gewaltiger Protest – ganz ohne GewaltSeien Sie dabei und werden Komplize der weltweit einzigen, nur von Höcke, Erdogan und dem Freistaat Thüringen anerkannten Terrororganisation.Unsere Garantie: Wir sind die einzige terroristische Vereinigung der Welt, die für die Menschenrechte kämpft!In unseren Aktionen stecken monatelange professionelle Hintergrundrecherchen. Am Ende stehen durchdachte Aktionen, die auf die Macht der Idee setzen. Wir protestieren nicht mit Pressemitteilungen."
