["https://politicalbeauty.de/jean-monnet-bruecke.html"]
title = "Die Jean-Monnet-Brücke | Zentrum für Politische Schönheit"
description = "Es wird nicht weniger als ein Jahrhundertwerk der Humanität: eine Brücke von Nordafrika nach Europa. Die Jean-Monnet-Brücke ist die zentrale Maßnahme im Kampf gegen Schleuser und Schlepper."
full_description = "JETZT MITMACHEN Kompliz:in werdenSpenden · ÜberweisenPaypal News InstagramTwitterYouTube Sites StartAktionenEnglischImpressum & Datenschutz Die Zukunft verbinden: Es soll nicht weniger als die Lebensader zweier Kontinente verknüpfen und das größte Konjunkturprogramm in der Geschichte der EU werden: eine Brücke von Nordafrika nach Europa. Die visionäre Brücke im Werbevideo. Größtes Infrastrukturprojekt der EU – Lebensader zweier Kontinente: 230 Milliarden Euro Kosten. Baubeginn ist bald – zeitgleich von beiden Kontinenten aus. Fertigstellung: 2030. Der Bauantrag wurde als Revision des »nationalen Programms« für die Republik Österreich beim ISF Grenzen der Europäischen Union eingereicht. Und das Beste: Die »Jean-Monnet-Brücke« ist die zentrale Maßnahme im Kampf gegen Schleuser und Schlepper! Festverankerung mit Beton, doppelter Verankerung und Zinkketten: alles im guten Namen Österreichs. Die Alpenrepublik hat die erste Rettungsplatt form auf dem Mittelmeer teilfinanziert. Der Kostenvoranschlag des Projektes, ein Beweisstück der Kaltherzigkeit für zukünftige Historiker: 20 Millionen Euro inkl. Mehrwertsteuer hätten 1.000 Rettungsinseln gegen das Ertrinken im Mittelmeer gekostet. Die Produktionsdauer für alle Plattformen beträgt 16 Wochen ab Auftragserteilung. Die Menschheit kann nicht bis zur Fertigstellung der Brücke warten: Das Mittelmeer – ein Massengrab. Jahr für Jahr ertrinken Tausende Flüchtlinge in den Sterbezonen an den Außengrenzen Europas. Laut Jean Ziegler sind es 36.000 Tote jährlich, d.h. mehr Menschen pro Jahr, als in der gesamten Zeit des Kalten Krieges am Eisernen Vorhang gestorben sind.Um das stille Sterben wirksam zu bekämpfen, werden jetzt 1.000 Rettungsplattformen installiert. 1.000 Positionslichter als internationales Bekenntnis zur abendländischen Humanität. Ein monumentales Symbol des 21. Jahrhundert. Denn noch jede Zivilisation hat irgendein Zeichen der Großzügigkeit oder Wohltätigkeit der Geschichte hinterlassen.Durch seine Verbindungen zu den Rebellen gelingt es ihm immer wieder, in Krisenherde zu reisen und wie etwa im Falle der Kindertransporthilfe des Bundes mit Kindern in einem Rebellenstadtteil Aleppos das Herzstück eines hyperrealen Theaterstücks zu proben – ihre Rettung durch die deutsche Bundesregierung."
year_published = 2025
clearnet = "https://politicalbeauty.de/jean-monnet-bruecke.html"
