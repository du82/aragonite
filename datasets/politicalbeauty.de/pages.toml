["https://politicalbeauty.de/afd-verbot.html"]
title = "AfD-Verbot | Zentrum für Politische Schönheit"
description = "In einer beispiellosen Aktion hat Bundeskanzler Olaf Scholz die Hinweisplattform afd-verbot.de ins Leben gerufen. Das Portal dient dazu, Beweise und Hinweise zu sammeln, um einen Verbotsantrag gegen die Partei »Alternative für Deutschland« (AfD) zu fördern."
full_description = "JETZT MITMACHEN Kompliz:in werdenSpenden · ÜberweisenPaypal News InstagramTwitterYouTube Sites StartAktionenEnglischImpressum & Datenschutz In einer beispiellosen Aktion hat Bundeskanzler Olaf Scholz die Hinweisplattform afd-verbot.de ins Leben gerufen. Das Portal dient dazu, Beweise und Hinweise zu sammeln, um einen Verbotsantrag gegen die Partei »Alternative für Deutschland« (AfD) zu fördern. Diese Initiative, die in Zusammenarbeit mit dem Zentrum für Politische Schönheit entstand, markiert einen entscheidenden Schritt im Kampf gegen den Rechtsextremismus in Deutschland und zur Bewahrung der Demokratie.Bisher sind auf der Plattform über 2.000 Sachverhalte zu rund 350 Personen erfasst, die die Bedrohungslage, Dringlichkeit und Ernsthaftigkeit des Vorhabens unterstreichen. Die Sammlung der Informationen dient als unterstützendes Material für einen Verbotsantrag, den die Bundesregierung am 5. Todestag von Walter Lübcke, dem 2. Juni 2024, vor dem Verfassungsgericht in Karlsruhe einreichen will.»Dieser Schritt beweist die Entschlossenheit des Bundeskanzlers, gegen den politischen Extremismus vorzugehen«, erklärt Philipp Ruch, Chefunterhändler des Zentrums für Politische Schönheit. »Es ist Olaf Scholz eine Herzensangelegenheit, all den von Hetze, Bedrohung oder Verfolgung betroffenen Menschen im Land zu zeigen, dass die Bundesregierung die Mittel der Verfassung ausschöpfen wird, bevor es zu spät ist.«Das Zentrum für Politische Schönheit betont, alle eingereichten Hinweise und Beweise im Namen der Bundesregierung sorgfältig zu prüfen und im Einklang mit rechtsstaatlichen Grundsätzen zu behandeln. Die Plattform dient als transparentes Mittel, um Öffentlichkeit und Behörden fortlaufend relevante Informationen zur Verfügung zu stellen. »Nicht der Kanzler, den Deutschland verdient. Aber der, den die Welt braucht. (Oder: Selbst eine KI kann es besser...)« »Jetzt wissen wir auch, weshalb Olaf so ruhig war in den letzten Tagen. Er musste das wichtigste Youtube-Video seiner Kanzlerschaft aufzeichnen.«"
