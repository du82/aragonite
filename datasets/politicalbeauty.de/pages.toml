["https://politicalbeauty.de/sucht-nach-uns.html"]
title = "Sucht nach uns | Zentrum für Politische Schönheit"
description = "Eine Eisenurne, als Warnung vor den Menschen. Grundlage aller Politik ist das Bewusstsein, dass von diesem Land aus der Holocaust begangen und organisiert wurde. Dass er politisch möglich war. Die Säule ist ein Geschichtsreaktor, ein gigantischer Schrei, ein Zeugnis von Millionen vernichteter Menschen. Eine überzeitliche Warnung vor dem Krater der Unmenschlichkeit, der politisch möglich ist. Wir leben in einer Zeit, in der auf den Straßen Naziparolen gebrüllt, Synagogen angegriffen, Menschen gejagt, Todeslisten angelegt und Politiker hingerichtet werden. Die Tyrannei der Zukunft lässt sich frei wählen.Die Asche der Opfer des Nationalsozialismus ist das Erbe der Bundesrepublik. Ein Erbe, das nicht bewältigt werden kann. Es gibt nicht nur eine Schuld am Holocaust. Es gibt auch einen Auftrag: Was tun wir heute, um den Faschismus zu bekämpfen? Gedenken heißt nicht Diskutieren. Gedenken heißt Handeln. Gedenken heißt Kämpfen. Wie verhindern wir den Faschismus? Unser Gedenken ist zu abstrakt. Die Säule lässt die Erschütterung neu einrieseln, ganz konkret und sie reißt den Abgrund erneut auf."
full_description = "JETZT MITMACHEN Kompliz:in werdenSpenden · ÜberweisenPaypal News InstagramTwitterYouTube Sites StartAktionenEnglischImpressum & Datenschutz Vergessen nimmt uns die Angst vor den Möglichkeiten der Politik. Ein Aufruf zur Verhinderung des Faschismus. Es gibt nicht nur eine Schuld am Holocaust. Er gibt auch den Auftrag: Über das abstrakte Gedenken hinaus den Faschismus ganz konkret, ganz real zu verhindern. Durch jede Zeit werden wir neu herausgefordert zu beantworten, was das bedeutet. Heute werden Naziparolen offen auf Straßen gebrüllt, Synagogen angegriffen, Menschen gejagt, Todeslisten angelegt und CDU-Politiker hingerichtet. Was tun wir?Die Toten schreien. Denn die Verfassungsfeinde sind zurück. Sie haben ein Drittel der Wählerstimmen im Osten. Sie sind bundesweit zweitstärkste Kraft. Unter den Vorsitzenden sind Mitglieder der harten rechtsextremen Naziszene. Und auch die Verräter der Demokratie sammeln sich. Der Holocaust ist kein Ereignis aus der mythischen Vorzeit. Er war möglich. Er ist möglich. Und er bleibt möglich. Es gibt kein »damals«, es gibt nur ein »dort«: Einen Ort, an dem der Abgrund klafft – für immer. Wenn wir diesen Abgrund nicht schließen können, müssen wir ihn bewachen. Die Geschichte lehrt, die Vorzeichen zu erkennen. Sie lehrt nur nicht, wie diese aussehen. Deshalb: Seht die Bedrohung. Seht die Geschichte. Seht den Auftrag: Gedenken heißt kämpfen.Geschichte ist das Ergebnis von Politik. Der Holocaust ist das Ergebnis von Politik – in ihrer schrecklichsten Ausprägung. Er ist das Trauma vom Ende der Aufklärung, des Fortschritts, des Idealismus und von Zeit an sich. Der Holocaust ist das unentdeckte Ende der Geschichte. Das Zentrum für Politische Schönheit hat die Asche der Ermordeten der Nazidiktatur ins Regierungsviertel überführt – an jenen Ort, an dem 1933 die Demokratie beseitigt wurde. Gegenüber dem Bundestag nahm die Vernichtung von Millionen von Menschen ihren Lauf. Auf dem Gelände der ehemaligen Kroll-Oper legte der Konservatismus die deutsche Demokratie in die Hände von Mördern. Nichts erinnert dort bis heute an diesen Verrat.Bei aller Lust an preussischen Repräsentationsbauten haben wir vergessen, den Ort des Verrats an der Demokratie zu markieren. Geschichte besteht nicht nur aus Stadtschlössern. Die Gefahr einer faschistischen Machtaushändigung ist heute so real wie nie. Kreise des Konservatismus strecken die Hände nach den Faschisten aus. Sie machen sich Gedanken, ob die AfD nicht doch ein guter Regierungspartner sein könnte. Es gibt eine rote Linie zu Feinden der Demokratie. Der Konservatismus trägt nicht nur die historische Schuld – die Konsequenzen seiner Naivität, Leichtfertigkeit und Machtbesessenheit waren mörderisch. Verfassungsfeinde gilt es zu fürchten.Und die Geschichte hat uns etwas zu erzählen: Die Toten haben uns etwas zu erzählen. Gedenken heißt Kämpfen. Wem das Mahnmal zu konkret ist, für den wurde es geschaffen. Unsere Zeit ist verantwortlich für das Erinnern. Die Form dieser Erinnerung bestimmt, ob wir die Fähigkeit besitzen, den Abgrund zuzuhalten. Die Macht der Geschichte hängt von unserem Gedenken ab. Handeln wir, ehe es zu spät ist."
