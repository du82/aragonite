title = "Die Säulen der Schande | Zentrum für Politische Schönheit"
description = "Die Säulen der Schande sind ein gigantisches Mahnmal gegen das Vergessen der Nächte der europäischen Schande und eine Medienwaffe, die der UN vor Augen führt, welche Verantwortung sie am Völkermord von Srebrenica trägt."
full_description = "JETZT MITMACHEN Kompliz:in werdenSpenden · ÜberweisenPaypal News InstagramTwitterYouTube Sites StartAktionenEnglischImpressum & Datenschutz Vergessen tötet! Die Opfer von Srebrenica mögen einem bestimmten Volk und einer bestimmten Religion entstammen. Aber sie symbolisieren einen gigantischen Verrat an der gesamten Menschheit.Die Säulen der Schande sind die Metapher gegen diesen Verrat, begangen von den Vereinten Nationen und der westlichen Welt. Ein gigantisches Mahnmal wider das Vergessen der Nächte der europäischen Schande. Und eine Medienwaffe, die der UN vor Augen führt, welche Verantwortung sie am Völkermord von Srebrenica trägt. Die Säulen der Schande bestehen aus einer 16 m langen und 8 m hohen Stahlkonstruktion, die mit 16.744 Schuhen für 8.372 Opfer angefüllt ist. Aus der Ferne ergibt sich das Bild zweier Buchstaben in leuchtendem Weiss – »U« und »N«. Sie werden von drei monumentalen Einschusslöchern durchbrochen, in die 200 Schuhe aus den ostbosnischen Massengräbern eingelassen sind. Das Projekt wird offiziell unterstützt von der Gedenkstätte Potocari-Srebrenica und von den Hinterbliebenen-Verbänden (Srebreničke majke, Udruženje Majki Srebrenice i Podrinja, Žene Srebrenice, Pokret Majke enklava Srebrenica i Žepa). Die Skulptur formt eine Antwort darauf, dass den Hinterbliebenen bislang kein Respekt entgegengebracht wurde. Die Überlebenden entscheiden über Aufstellungsort und die Namen der (westlichen) Politiker und Generäle, die das Mahnmal beschämen wird. In einer Rekordzeit von 40 Tagen kommen weit mehr Schuhe zusammen, als eigentlich benötigt werden. Jedes Schuhpaar steht nicht nur für einen Toten, sondern auch für die Entschlossenheit eines Lebenden, die Weltorganisation UN endlich zur Rechenschaft zu ziehen. Schuhe der Erinnerung: Was bleibt von 8.372 getöteten Menschen? Ein Bild, das am internationalen Gedenktag von Srebrenica um die Welt geht: 16.744 Schuhe, das Baumaterial für die Säulen der Schande, aufgeschüttet vor dem Brandenburger Tor."
