["https://politicalbeauty.de/impact.html"]
title = "Wie wirkt meine Unterstützung? | Zentrum für Politische Schönheit"
description = "Der Begriff drückt die Einsicht aus, dass der Kampf um Menschenrechte viel zu höflich geführt wird – wo offensives oder illegales Auftreten legitim wären. Der aggressive Humanismus verweist auf den radikalen Einsatz großer Menschenrechtler wie Varian Fry, Beate Klarsfeld, Soghomon Tehlirian, Peter Bergson, Frieda Belinfante und Simon Wiesenthal. Keine Frage macht die Humanität so sichtbar wie die, wer gegen Massenmord aufbegehrte – und zwar notfalls gegen eigene Karriere, Freunde und Gefühle. Der Mut zur Humanität macht die Schönheit des Menschen erst möglich."
full_description = "JETZT MITMACHEN Kompliz:in werdenSpenden · ÜberweisenPaypal News InstagramTwitterYouTube Sites StartAktionenEnglischImpressum & Datenschutz Ein Holocaust-Mahnmal direkt neben Höckes Wohnhaus, das noch heute in Thüringens braunster Ecke steht und sich wehrt. Die Hälfte des gesamten Wahlkampfmaterials der AfD (5.000.000 Flyer) im Bundestagswahlkampf nicht verteilt, sondern geschreddert – mithilfe des mittelständischen Champions »Flyerservice Hahn«. Das Zentrum für Politische Schönheit bringt nicht nur einen Waffenhändler dazu, aus seinem Familienunternehmen auszusteigen und stattdessen eine Flüchtlingsstiftung zu gründen, der Kampfpanzerdeal mit Saudi-Arabien wird sogar zum Platzen gebracht. Hunderte junger Menschen steigen in unsere Busse, um zum 25jährigen Jubiläum des Mauerfalls die EU Außen-Grenze einzureißen. Damit nicht genug, eine Person gründet daraufhin sogar die erste deutsche Rettungsorganisation im Mittelmeer: die Sea Watch. Wie wäre es, eine Brücke von Afrika nach Europa zu bauen, statt Menschen im Mittelmeer ertrinken zu lassen? Oder Rettungsinseln? Diese Frage hat sich festgebrannt. Ganz Deutschland hilft: Über 2.000 Anrufe, um syrische Kinder aus der Apokalypse zu retten und sie in Deutschland in Pflege zu nehmen. Syrien und der Bürgerkrieg finden endlich einen Platz in der Berichterstattung und im Bewusstsein. Wenn die Regierung ruft, ist die Bevölkerung zur Stelle. Einziges Problem: nur das Zentrum hat gerufen.Familienministerin Manuela Schweig gründet auf unseren Druck hin eine Stiftung und sucht Paten für alleinreisende minderjährige Kinder. Das Kontingent für Kriegsflüchtlinge aus Syrien wird nach der Aktion von den Innenministern der Länder verdoppelt. Zehntausende Menschen kommen zum Marsch der Entschlossenen und verwandeln die Reichstagswiese in ein Mahnmal für die toten Einwanderer Europas. Denn: Europa braucht mehr Gräber für die Toten seiner Flüchtlingsabschottungspolitik. Wir zwingen den Deutschen Bundestag, über den tödlichsten Paragraphen im deutschen Recht (§ 63 des Aufenthaltsgesetzes) erneut abzustimmen: Wollen wir die Menschen im Mittelmeer ertrinken lassen? Die regierenden Parteien finden: Ja! Aber damit nicht genug der Bekenntnisse: ein von uns bezahltes Flugzeug mit 100 Kriegsflüchtlingen wird in letzter Minute von der Bundesregierung verhindert."
