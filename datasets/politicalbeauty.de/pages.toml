full_description = "JETZT MITMACHEN Kompliz:in werdenSpenden · ÜberweisenPaypal News InstagramTwitterYouTube Sites StartAktionenEnglischImpressum & Datenschutz Am 09. Februar 2025 hat die Polizei Berlin den Adenauer SRP+ ohne rechtliche Grundlage im Rahmen der genehmigten Proteste der Zivilgesellschaft gegen CDU und AfD beschlagnahmt – ohne erforderlichen Richtervorbehalt und mit Verzögerungstaktik bei notwendigen Dokumenten. Der Schaden für die Zivilgesellschaft ist bereits jetzt riesig: Wir konnten an vielen geplanten Protesten trotz Anmeldung und Genehmigung nicht teilnehmen. Wir fordern die sofortige Herausgabe des Adenauer SRP+ und eine Erklärung der Berliner Polizei! ▶ Klage: Bereits am 10.02. eingereicht – bisher keine Entscheidung.▶ Erpressung: Polizei verlangt Rücknahme der Klage als Bedingung für eine Sachklärung.▶ Sachschaden: Fahrzeug der Witterung auf Polizeiparkplatz überlassen – Schaden über 40.000 €.▶ Boykott: Polizei torpediert Kompromissangebote.Eines ist klar: Die Polizei kann den Adenauer beschlagnahmen, aber nicht den Widerstand! Wozu ist die AfD fähig? Was hat sie mit Deutschland vor? Und wie nah sind wir der Weimarer Republik? Unser künstlerischer Leiter zeigt in seinem neuen Buch, dass unsere Abwehrpolitik gegen die AfD noch schlechter ist als die der Weimarer Republik gegen die NSDAP! Es basiert auf Beweismaterial, das der Öffentlichkeit bislang nur in Teilen zugänglich ist.Jetzt im Buchhandel. Auch als Audiobook! Thüringer Allgemeine »Ich bin mir sicher, dass das Verbotsverfahren kommen wird«Tagesspiegel »Der Schlaf des Kanzlers ist wirklich durch nichts zu stören« (€ paid)SWR1 Philipp Ruch über sein Buch »Es ist 5 vor 1933«Süddeutsche Eine letzte Warnung vor der Katastrophe (€ paid)SWR Plädoyer für ein AfD-VerbotDie Welt Das drastisch-dystopische Szenario im Spreebogen (€ paid)BR Podcast Ist wirklich kurz vor 1933, Philipp Ruch?Frankfurter Rundschau Die Demokratie ist sterblichThüringer Allgemeine Debatte nach abgesagter Lesung in WeimarRadio 3 Der Autor Philipp Ruch im GesprächBremen 2 »Es ist 5 vor 1933«Klartext-Podcast 255 Früher war es auch heiß!"
