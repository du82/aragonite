["https://politicalbeauty.de/Zeitkapsel.html"]
title = "Die Zeitkapsel-Versuche | Zentrum für Politische Schönheit"
description = "Am Rande der Bundesversammlung rezitiert das Zentrum für Politische Schönheit vor dem Bundestag das Gedicht »An die Schönheit« von Ernst Stadler und wird verhaftet. Bei den »Zeitkapsel-Versuchen« erforscht das Zentrum für Politische Schönheit die Antriebe der Menschen."
full_description = "JETZT MITMACHEN Kompliz:in werdenSpenden · ÜberweisenPaypal News InstagramTwitterYouTube Sites StartAktionenEnglischImpressum & Datenschutz 1 Gedicht pro Tag: In Deutschland gelingt uns pünktlich zum 60. Feiertag der Bundesrepublik das Kunststück, für das Rezitieren eines Gedichtes verhaftet zu werden! Am Rande der Bundesversammlung veranstaltet das ZPS eine Aubade auf den Bundespräsidenten mit dem bezeichnenden Nachnamen. Danach heißt es vor laufenden Kameras (Spiegel TV, n-tv, RTL aktuell): Festnahme! Das rezitierte Gedicht An die Schönheit von Ernst Stadler enthielt laut LKA Berlin »meinungsäussernde Inhalte«.Im Bild oben: Nina van Bergen mit einem Geschenk für den damaligen Bundespräsidenten Horst Köhler: »Der Lichtblick« In den Vorstudien zum Zentrum für Politische Schönheit ging es um die Antriebe der Menschen. Wie groß, wie bedeutend ist das, was diese Gesellschaft will? Alle Menschen haben Ziele. Aber sind sie auch groß genug? Sind sie schön? Tragen sie weit genug? Wohin sind wir aufgebrochen? Um zu verstehen, wo Deutschland steht, haben wir 2009 intensiv die Menschen auf den Strassen befragt, wonach sie streben, was sie antreibt und quält. Das Ergebnis haben wir in einer Zeitkapsel auf Youtube verschlossen. Wir hoffen, dass forensische Digitalhistoriker am Ende des Jahrhunderts diese Dokumente wieder ausgraben werden. Denn die genozidalen Super-GAUs des 21. Jahrhunderts werden notwendig die Frage aufwerfen, womit diejenigen, die sie hätten verhindern können, beschäftigt waren. Die Vorstudien sind ein Beweisstück dafür, wie es stand um das politische Wollen der Menschen, die im Aufbruch des 21. Jahrhunderts gelebt haben. Sie wurden gedreht, um einen Schlüssel im Verständnis dieser, unserer Zeit – mitsamt ihrer Willenlosigkeit und Indifferenz – zu liefern. Die Aufnahmen sollten nicht diffamieren. Wo wir Visionen und Streben vorfanden, lagerten wir sie mit ein. Nicht selten waren die Dokumente jedoch von einer schrillen Rat- und Visionslosigkeit. Die Vorstudien konservieren die Temperatur unserer Antriebe als Mahnung für alle kommenden Zeiten."
year_published = 2025
