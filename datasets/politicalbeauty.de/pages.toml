["https://politicalbeauty.de/erster-europaeischer-mauerfall.html"]
title = "Erster Europäischer Mauerfall | Zentrum für Politische Schönheit"
description = "Zum 25. Jahrestag des Mauerfalls machten sich 100 Auserwählte daran, die EU-Außengrenze wieder abzubauen. Die »Weißen Kreuze«  flüchteten aus Berlin zu Menschen, deren Leben durch die EU-Außenmauern akut bedroht ist und erweiterten dadurch das selbstbezogene deutsche Gedenken um einen entscheidenden Gedanken: die Gegenwart."
full_description = "JETZT MITMACHEN Kompliz:in werdenSpenden · ÜberweisenPaypal News InstagramTwitterYouTube Sites StartAktionenEnglischImpressum & Datenschutz Es ist eine Erinnerungsflucht der besonderen Art: Die Installation »Weiße Kreuze« ergreift vor den Gedenkfeiern zum 25. Jahrestag des Mauerfalls die Flucht aus dem Regierungsviertel in Berlin. Die Mauertoten flüchten in einem Akt der Solidarität zu ihren Brüdern und Schwestern an die Außengrenzen der Europäischen Union, genauer: zu den heutigen Mauertoten. Hunderttausende Tote forderten die EU-Außenmauern seit dem Fall des Eisernen Vorhangs. Im Vordergrund der Eiserne Vorhang. Im Hintergrund lässt die Europäische Union den Erdboden für die neuste Generation der Überwachungstechnik ausheben. Am Boden hinter dem Weißen Kreuz liegt ein Kameramast, der Flüchtlinge im Rahmen von Eurosur aufspüren und der örtlichen Polizei melden wird.Die Gedenkkreuze flüchteten vor dem Oktoberfestgedenken zu Menschen, deren Leben durch die EU-Außenmauern akut bedroht ist und erweiterten dadurch das selbstbezogene deutsche Gedenken um einen entscheidenden Gedanken: die Gegenwart. Im Slider folgen u.a. Eindrücke aus den Waldbergen von Gourougou vor Melilla. »Ich finde die Aktion absolut zu verachten! In der wahnsinnigen Aufgabe des Mauerfalls haben wir Deutsche über ein totalitäres System diskutiert, das bei uns stattgefunden hat. Das in einen Zusammenhang zu setzen, finde ich eine schlimme Aktion.« »Kunst ist keine Geschmacksfrage! Zynisch wirkt, dass die EU auch auf deutsches Betreiben den Einsatz zur Rettung von Flüchtlingen im Mittelmeer soeben reduziert hat.« »Das eigentliche Problem sind nicht ein paar skrupellose Künstler, die keinen Hehl daraus machen, dass sie die offene Gesellschaft zerstören wollen. Das Problem ist, dass Politik und Medien sie in ihrem Treiben gewähren lassen.« »Ich kann verstehen, dass jede Möglichkeit genutzt wird, um auf das Leid an den EU-Außengrenzen aufmerksam zu machen.« »Unfassbar, dass mitten im Regierungsviertel eine Gedenkstätte abtransportiert wird und niemand es merkt!«"
