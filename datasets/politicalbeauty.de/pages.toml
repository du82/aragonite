["https://politicalbeauty.de/bekenntnis.html"]
title = "Die Kompliz:innen des Zentrums für Politische Schönheit"
description = "Wir sind mehr als 3000 Aktivist:innen, die sich dem radikalen Umbruch, dem Kampf gegen die Gleichgültigkeit verschrieben haben. Schließ' dich uns an!"
full_description = "JETZT MITMACHEN Kompliz:in werdenSpenden · ÜberweisenPaypal News InstagramTwitterYouTube Sites StartAktionenEnglischImpressum & Datenschutz die Kompliz:innen, das Herz und die Nieren des Zentrums für Politische Schönheit. Mehr als 4.000 Aktivist:innen, die sich dem radikalen Umbruch, dem Kampf gegen die Gleichgültigkeit verschrieben haben.Schließ' Dich uns an!Als Kompliz:innen leisten wir einen unschätzbaren Beitrag zur Erregung öffentlicher Unruhe - für den radikalen Humanismus.Du erhältst nirgendwo so viel Aufruhr und Dissens für jeden gespendeten Euro wie mit uns. Gemeinsam brachten wir der AfD ihre vermissten Flyer zurück, auf ihren Märschen regnete es blau. Auf vor der AfD Büros in Berlin wurde so mancher Politiker mit Konfetti überrascht. Jahr für Jahr sterben Tausende Menschen beim Versuch, die tödlichsten Grenzen der Welt zu überwinden. Entschlossen hoben wir ihnen vor dem deutschen Bundestag, wo Mitschuldige an diesem Verbrechen arbeiten, hunderte Gräber aus. »Auf dem Weg zu einer gerechten Gesellschaft muss es wirksamere Methoden geben, als jeden Freitag am Invalidenpark zu hocken. Deshalb: radikale Mittel für ein radikal gerechtes Deutschland.« »Die Welt ist verkommen. Gleichgültigkeit und Abgestumpftheit prägen den öffentlichen Diskurs. Eine politisch-schöne Zukunft können wir nur mit einer klaren antifaschistischen, antikapitalistischen Haltung erreichen.« »Die letzten Jahre konnten wir zusehen, wie menschenfeindlich die deutsche Politik agiert. Was es nun braucht, sind Akte der Politischen Schönheit, um Politik und Gesellschaft wachzurütteln, es könnte bald zu spät sein.« »Ich stehe für Politische Schönheit, weil es mehr braucht als deutsche Diplomatie, um tatsächlich etwas zu verändern. Was schockiert die Menschen überhaupt noch? Lasst uns kämpfen gegen die allgegenwärtige Gleichgültigkeit!« »Ich lege mein Geld dort an, wo es die meiste Unruhe stiftet. Hier habe ich ein Investment in intellektuellen Widerstand gegen Rechts gefunden.«"
