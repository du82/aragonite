["https://politicalbeauty.de/reformation.html"]
title = "Die Re-Formation der Geschichte | Zentrum für Politische Schönheit"
description = "Der Thesenanschlag des Zentrums für Politische Schönheit auf den Deutschen Bundestag. Zehn Thesen wurden ans Hauptportal des Bundestages angeschlagen. Im Anschluss wird die Warteschlange davor unfreiwillig zu künftigen Heldinnen und Helden Deutschlands vereidigt."
full_description = "JETZT MITMACHEN Kompliz:in werdenSpenden · ÜberweisenPaypal News InstagramTwitterYouTube Sites StartAktionenEnglischImpressum & Datenschutz Deutschland steht vor entscheidenden Umwälzungen. Die künstlerische Befreiung Deutschlands nimmt exakt 64 Jahre nach der militärischen seinen Lauf. Wir haben einen Thesen-Anschlag auf den Deutschen Bundestag verübt: Zehn Thesen wurden ans Hauptportal des Bundestages angeschlagen. Im Anschluss wurde die Warteschlange davor unfreiwillig zu künftigen Heldinnen und Helden Deutschlands vereidigt. Ihre Aufgabe: »Öfter an Schönheit, Glanz und Größe denken als an Partys, Autos und Fussball.« Der postheroische Zustand ist damit hochoffiziell beendet.Die Amtsübernahme begann um 11.30 Uhr mit anschließender Pressegesangskonferenz. Da keiner der namhaften deutschen Autohersteller bereit war, uns eine Limousine für den Amtsantritt zur Verfügung zu stellen, erschienen wir kurzerhand mit Pferden (Epithymia, Thymos und Logos) an der zukünftigen Wirk- und Arbeitsstätte. Agenda des Zentrums für Politische Schönheit: die Visions- und Konzeptlosigkeit der politischen Parteien aufzeigen, die Mächtigkeit des Menschen gegen seine Ohnmacht stellen und die historisch einmalige Chance der visionären »Lücke« nutzen. D.h. ein Bündnis der Künste schmieden, das den Politikern hilft, die höchste Form aller Künste ins Werk zu setzen: gute und schöne Politik. Erster Schreck: das Hauptportal des Bundestages besteht aus Glas und Stahl. Mit dem mitgebrachten Hammer und Nägeln ist wenig auszurichten. Ein moderner Reformator kann seine Thesen am Bundestag gar nicht mehr anschlagen. »Helden sind der Kitt allen sozialen Lebens. Wir wollen ab sofort ein Experiment wagen. Wir möchten Ihnen zu diesem Zweck die Gründung einer Handlungsplattform bekanntgeben, um Deutschland zum Zentrum für Politische Schönheit zu machen. Eine Art Denk-, Gefühls- und Handlungsfabrik für Menschen, die sich nach mehr sehnen, als nach einem Auto, Haus oder bezahlten Urlaub. Für die, die sich sehnen nach Schönheit, Größe und Vollkommenheit.«"
