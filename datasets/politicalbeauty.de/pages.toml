["https://politicalbeauty.de/fluechtlinge-fressen.html"]
title = "Flüchtlinge Fressen | Zentrum für Politische Schönheit"
description = "Die gladiatorische Wirklichkeit Europas: Die Arena ist der Bau einer verdichteten tödlichen Falle. Hier werden vor großem Publikum Schicksale generiert – Niederlagen und Siege. Spektakel machen den ideologischen Kern einer Gesellschaft, etwa Flüchtlinge im Namen der Sicherung der EU-Außengrenzen sterben zu lassen, sichtbar. In den Pausen der Abschreckungspolitik wird die Arena gesäubert und frischer Sand gestreut."
full_description = "JETZT MITMACHEN Kompliz:in werdenSpenden · ÜberweisenPaypal News InstagramTwitterYouTube Sites StartAktionenEnglischImpressum & Datenschutz Die Flüchtlinge in tödlicher Falle: das Beförderungsverbot wird zur grausamen Realität. Zur Feier des großen EU-Türkei-Deals haben wir eine Arena mitten in Berlin errichtet. Mit vier libyschen Tigern. Wir suchen Flüchtlinge, die bereit sind, sich wegen des Beförderungsverbots für Flüchtlinge (§ 63 Abs. 3 AufenthG) fressen zu lassen. Ein hyperreales Rom. Eine tödliche Falle. Und ein Denkmal für unsere Zeit – mitten in der Hauptstadt des Europäischen Reichs. Das Bild eines starken Europas: An den Rändern des Kontinents liegen Menschen – wie von wilden Bestien gerissen. Die Europäer glauben, dass ein böser Meeresgott über das Schicksal dieser Menschen entschieden hat. Dabei sind es ihre eigenen Politiker. Wenn Regierungen offen die »Reduzierung von Flüchtlingsströmen« versprechen, wird die Abwehr Schutzloser noch tödlicher. Früher wurden Abkommen mit Libyen nur von Hardlinern ausgehandelt und es gab keinen Bürgerkrieg. Heute gibt es den libyschen Bürgerkrieg und die EU handelt Abkommen mit vereinten Kräften aus. Die gladiatorische Wirklichkeit Europas: Die Arena ist der Bau einer verdichteten tödlichen Falle. Hier werden vor großem Publikum Schicksale generiert – Niederlagen und Siege. Spektakel machen den ideologischen Kern einer Gesellschaft, etwa Flüchtlinge im Namen der Sicherung der EU-Außengrenzen sterben zu lassen, sichtbar. In den Pausen der Abschreckungspolitik wird die Arena gesäubert und frischer Sand gestreut. Durch die Schleuse der römischen Göttin des Todes gelangen die Plünderer Europas auf allen Vieren in die Arena. Über dem Denkmal flattert der ursprüngliche Schlachtruf der französischen Revolution im Wind. Der Nachsatz wurde erst später gestrichen. Das Beförderungsverbot für Flüchtlinge prangt als der EU-Grundsatzartikel am Denkmal. Wenn sich Tiger nähern, kommt es zur Konstellation Naturrecht vor Naturrecht."
