["https://politicalbeauty.de/ueber-das-ZPS.html"]
title = "Über das Zentrum für Politische Schönheit"
description = "Zeichen und Wunder geschehen nicht – sie werden gemacht: Wir haben die Ertrunkenen unserer Flüchtlingsabwehrpolitik geborgen und in Berlin, vor den Augen der Weltöffentlichkeit, beerdigt. Menschsein ist für uns keine verhandelbare Sache.Zum 25. Jahrestag des Mauerfalls haben wir zwei Busse mit einhundert Revolutionären an die europäische Außengrenze gesteuert, um diese direkt abzubauen. Und wir haben 1.000 Rettungsplattformen gegen das Massensterben im Mittelmeer entwickelt und die erste vor der libyschen Küste ausgebracht."
full_description = "JETZT MITMACHEN Kompliz:in werdenSpenden · ÜberweisenPaypal News InstagramTwitterYouTube Sites StartAktionenEnglischImpressum & Datenschutz Mit voller Phantasie die Wirklichkeit erfasst: Das Zentrum für Politische Schönheit radikalisiert den Kampf für Menschenrechte. Das Zentrum für Politische Schönheit ist der radikale Flügel des Humanismus: eine Sturmtruppe zur Errichtung moralischer Schönheit, politischer Poesie und menschlicher Großgesinntheit. Wir verschmelzen die Macht der Phantasie mit der Macht der Geschichte. Grundüberzeugung ist, dass die Lehren des Holocaust durch die Wiederholung politischer Teilnahmslosigkeit, der Abwehr von Hilfesuchenden und Feigheit annulliert werden und dass Deutschland aus der Geschichte nicht nur lernen, sondern auch handeln muss. Gedenken heißt Kämpfen!Wir bewaffnen die Wirklichkeit mit moralischer Phantasie und treten gegen Amnesty International an, weil wir glauben, dass der Kampf um Menschenrechte radikaler geführt werden muss. Er wird nicht mit Hashtags, Lichterketten und Online-Petitionen, sondern mit Phantasie gewonnen. Das nützlichste Werkzeug ist die Fiktion. Wir sind das »Sturmgeschütz« des Humanismus. Wir lassen Aktionen mit Hochgeschwindigkeit in die deutsche Wirklichkeit krachen. Und erinnern die Öffentlichkeit an die Kraft des Humanismus.Prägen Sie den öffentlichen Diskurs mit illegalem Humanismus, indem Sie Kompliz:in des Zentrums für Politische Schönheit werden. Sorgen Sie dafür, dass Moral ein politischer Faktor bleibt. Wir haben das Denkmal für die 6 Millionen Ermordeten Juden Europas direkt vor Höckes Haus gebaut, mit Tausenden Flugblättern auf den Strassen Istanbuls zum Sturz des Diktators aufgerufen (im Gedenken an die Geschwister Scholl), bundesweit bekannte Nazis in Dortmund mit Kalaschnikows und Äxten gejagt und ein Flugzeug für 100 Kriegsflüchtlinge gechartert, um sie lebend nach Europa zu bringen. Zeichen und Wunder geschehen nicht – sie werden gemacht: Wir haben die Ertrunkenen unserer Flüchtlingsabwehrpolitik geborgen und in Berlin, vor den Augen der Weltöffentlichkeit, beerdigt. Menschsein ist für uns keine verhandelbare Sache.Zum 25. Jahrestag des Mauerfalls haben wir zwei Busse mit einhundert Revolutionären an die europäische Außengrenze gesteuert, um diese direkt abzubauen. Und wir haben 1.000 Rettungsplattformen gegen das Massensterben im Mittelmeer entwickelt und die erste vor der libyschen Küste ausgebracht."
