full_description = "JETZT MITMACHEN Kompliz:in werdenSpenden · ÜberweisenPaypal News InstagramTwitterYouTube Sites StartAktionenEnglischImpressum & Datenschutz Decke Dich als Kompliz:in mit Revolutionarien ein (Büchern, T-Shirts, Taschen, Poster und viel viel mehr). Zeige Deinen Freundinnen, Nachbarn und Verwandten Deine Mittäter- und Komplizenschaft bei einer Terrororganisation!Als Kompliz:in leistest Du einen unschätzbaren Beitrag zur Erregung öffentlicher Unruhe – für den radikalen Humanismus. Kompliz:in wirst Du mit einer jährlichen Unterstützung ab 120 € (10 €/Monat). Du erhältst nirgendwo so viel Aufruhr und Dissens für jeden gespendeten Euro wie bei uns. Haltung als Handlung – mit einer Übersicht über alle großen Aktionen des Zentrums für Politische Schönheit; mit Beiträgen von Mely Kiyak, Raimar Stange, Florian Waldvogel, Georg Diez, Jakob Augstein und Shermin Langhoff. Das Buch ist mittlerweile in der 4. Auflage erschienen (500 Seiten). Für Kompliz:innen gratis. Die letzten Nachrichten und Zeitzeugnisse von Opfern des Nationalsozialismus in einer bislang einzigartigen Sammlung. Gegen das Vergessen. Das »Schollbuch« zum 75. Jubiläum der Weißen Rose. Mit anschaulichen Aufgabestellungen für den etwas anderen Demokratieunterricht – wie etwa dieser: »Wenn ein ausländischer Diktator kommt, sollten wir ihn als gute Demokraten foltern oder nicht?« Die einzige weltweit nur von Björn Höcke anerkannte Terrororganisation. Wir machen für Sie Stress und radikalen Humanismus. Als Kompliz:in leisten Sie einen unschätzbaren Beitrag zur Erregung öffentlicher Unruhe. Sie erhalten nirgends so viel Aufruhr und Dissens für jeden gespendeten Euro wie bei uns."
