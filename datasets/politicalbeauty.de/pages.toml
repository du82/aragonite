["https://politicalbeauty.de/kindertransporthilfe.html"]
title = "Kindertransporthilfe des Bundes | Zentrum für Politische Schönheit"
description = "Eine bis ins Detail durchgedachte Webseite, Werbespots, Broschüren und eine siebenteilige Anzeigenserie bilden das Herzstück der hochoffiziösen Kampagne der Bundesregierung. Es geht darum, interessierte Pflegefamilien zu werben (selbstverständlich auch auf Englisch). Auf der Webseite stehen wiederum Antragsbögen, Formblätter, Gesetzestexte bereit. Kein »Fake«, sondern ein fertiges Konzept zur Rettung von 55.000 syrischen Kindern."
full_description = "JETZT MITMACHEN Kompliz:in werdenSpenden · ÜberweisenPaypal News InstagramTwitterYouTube Sites StartAktionenEnglischImpressum & Datenschutz Menschen retten könnte so einfach sein - wenn man es denn wollen würde. Die Bundesregierung rettet 55.000 syrische Kinder vor dem Krieg. Mit einem Soforthilfeprogramm, dass das Zentrum für Politische Schönheit schlüsselfertig entwickelt hat. Nach Angaben von UNICEF sind 5,5 Millionen syrische Kinder akut hilfsbedürftig. Im Rahmen des Bundeshilfsprogramms könnten 55.000 Kinder (»1 aus 100«) vorübergehend in die Bundesrepublik Deutschland einreisen. Mit der ganzen Autorität von Bundesregierung und Bundesfamilienministerium haben wir uns auf die Suche nach Pflegefamilien gemacht, um die apokalyptische Situation Syriens in die Herzen der deutschen Gesellschaft zurückzuschieben. Die Familienministerin will nicht länger tatenlos zusehen. Mit ihrem entschlossenen Handeln hebt sie international das Ansehen der Bundesrepublik. Selbst Madeleine Albright (deren Cousine durch die Kindertransporte gerettet wurde) sagt plötzlich über sie: »Ministerin Schwesig verdient unser aller Respekt für ihren Mut!« Eine bis ins Detail durchgedachte Webseite, Werbespots, Broschüren und eine siebenteilige Anzeigenserie bilden das Herzstück der hochoffiziösen Kampagne der Bundesregierung. Es geht darum, interessierte Pflegefamilien zu werben (selbstverständlich auch auf Englisch). Auf der Webseite stehen wiederum Antragsbögen, Formblätter, Gesetzestexte bereit. Kein »Fake«, sondern ein fertiges Konzept zur Rettung von 55.000 syrischen Kindern. Beeindruckende Hilfsbereitschaft: Über 1.000 Familien wollen syrische Kinder retten. Die Webseite geht an einem Montag ans Netz. Telefonisch können sich Interessierte rund um die Uhr beraten lassen. Sechs Schauspieler nehmen die Anrufe entgegen. Deutschlandweit überschlagen sich die Medien. Innerhalb der ersten 48 Stunden melden sich weit über 1.000 Familien, um ein syrisches Kind in Pflege zu nehmen. Die Willkommenskultur und Hilfsbereitschaft Deutschlands kennt bereits 2014 keine Grenzen.Und die Bundesregierung steht blamiert da. Sie hat jetzt die Wahl: Kinder aktiv zu retten oder der Öffentlichkeit mitzuteilen, dass die Rettung von Menschenleben nicht zum offiziellen politischen Programm gehört."
