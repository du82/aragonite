["https://politicalbeauty.de/aggressiver-humanismus.html"]
title = "Aggressiver Humanismus | Artikel"
description = "Von der Unfähigkeit der Demokratie, große Menschenrechtler hervorzubringen. Ein Artikel des Zentrums für Poltiische Schönheit über Aggressiven Humanismus."
full_description = "JETZT MITMACHEN Kompliz:in werdenSpenden · ÜberweisenPaypal News InstagramTwitterYouTube Sites StartAktionenEnglischImpressum & Datenschutz Als Diogenes zur Mittagszeit mit einer Laterne über den Marktplatz von Athen stolperte und nach Menschen suchte (Nietzsche 2000: 141) oder als Christoph Schlingensief ganz Wien über die Abschiebung von Ausländern abstimmen ließ (Lilienthal/Philipp 2000), waren sie beseelt von dem Gedanken, die Gesellschaft zu retten. Sie betrachteten Aktionskunst als ein Glas, in das sie allerlei Substanzen einfüllen und das sie ungefährdet schütteln konnten. Wenn das Gemisch explodierte, beriefen sie sich auf den straffreien Raum der Kunst. Nicht zuletzt aus der politischen Bedrohungslage durch künstlerisches Handeln sagte man den Künstlern eine Nähe zum Verbrechen nach (vgl. Bredekamp 2005: 19f.). Aber Kunst brachte gesellschaftliche Konflikte nicht nur zur Detonation, sie experimentierte auch mit ihrer Lösung. Denk- und Handlungsverbote werden aufgelöst, um die höchste Form der Kunst ins Werk zu setzen: Politik. Weil Akte von moralischer Schönheit selten sind, versucht das Zentrum für Politische Schönheit (ZPS), derartige Handlungen aus den Flussläufen der Geschichte zu bergen. Der hier vorliegende Aufsatz wirft einen Blick auf die geistigen Grundlagen, aus deren Erosion das Zentrum für Politische Schönheit entstanden ist und an deren Wiederherstellung es arbeitet. Seit dem Zusammenbruch der Sowjetunion fristen Großtheorien und Ideologien ein Schattendasein. 1989 verabschiedete sich die letzte große Alternative von der Weltbühne. Die erste erfolgreiche demokratische Revolution auf deutschem Boden läutete ein »Ende der Geschichte« ein. Die Attraktivität von Francis Fukuyamas gleichnamigem Buch (Fukuyama 1992, Sloterdijk 2006: 89ff., 171ff.) war die Pointe des verpassten Endes: Fukuyama unterstellte der westlichen Welt, sie sei ans Ende gelangt, ohne das selbst zu bemerken. Politiker, Intellektuelle und Künstler standen in Francis Fukuyamas Erzählung an einer Bushaltestelle, ohne erkannt zu haben, dass es sich um die Endhaltestelle für politische Visionen handelte."
