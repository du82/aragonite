["https://politicalbeauty.de/bergungsarbeiten-lethe.html"]
title = "Bergungsarbeiten auf Lethe | Zentrum für Politische Schönheit"
description = "»Himmel über Srebrenica« zeigt, was die Generäle am Vorabend der Katastrophe im Hauptquartier in Zagreb besprechen und wie der schlimmste Völkermord auf europäischem Boden nach dem Zweiten Weltkrieg hätte aufgehalten werden können."
full_description = "JETZT MITMACHEN Kompliz:in werdenSpenden · ÜberweisenPaypal News InstagramTwitterYouTube Sites StartAktionenEnglischImpressum & Datenschutz Enthüllt: Geheime Protokolle des UN-Führungsstabs im Kampf gegen den Völkermord. Der Film verfolgt die Spur, wie Europa den schrecklichen Völkermord hätte aufhalten können. Und was die Generäle am Vorabend der Katastrophe im Hauptquartier in Zagreb besprechen. Der Film beruht auf geheimen Protokollen des Führungsstabs der Vereinten Nationen. Die Entscheidungsebene wird neben nie gezeigtes Originalmaterial geschnitten. Hätte Srebrenica verhindert werden können? Der Film bringt die Wahrheit ans Licht. Von Hoffnung zum schlimmsten Albtraum: Am 11. Juli 1995 zerstören die schlimmsten Verbrechen nach dem Zweiten Weltkrieg in Europa die bosnische Kleinstadt Srebrenica. Den unvorstellbaren Erschiessungen und Deportationen geht ein gigantischer Verrat an der Menschheit voraus: Während 40.000 Zivilisten gebannt in den Himmel von Srebrenica starren und auf ein Zeichen der Weltgemeinschaft warten, der ihnen ihren Schutz garantiert, entscheidet das Hauptquartier der Vereinten Nationen in Zagreb, die Menschen auszuliefern. Während sämtliche Befehlsketten von UN und NATO die Verteidigung Srebrenicas schon unterschrieben haben, verfolgt ein einziger General andere Pläne. 8.372 Menschen kostet sein Verrat das Leben. Einer der Berater von General Bernard Janvier, Thierry Moné und François Dureau (beide gespielt von Max Woelky). General Bernard Janvier (Force Commander der UN-Truppen in Bosnien und Leiter des UN-Krisenstabes am Vorabend der Katastrophe), gespielt von Daniel Chrétien. NATO-JDAM-Bomben, geborgen aus Lethe, dem Fluss des Vergessens: im Sommer 1995 bei der Verteidigung der sog. »internationalen Schutzzone« von Srebrenica unbenutzt geblieben; dem Deutschen Bundestag vors Hauptportal gelegt. 40.000 Zivilisten warten in Srebrenica verzweifelt auf Hilfe. Der Film schneidet unbarmherzig die Ebene der Entscheider mit den Konsequenzen vor Ort zusammen. 40 NATO-Flugzeuge kreisen am 10. Juli 1995 über der Adria und warten auf ihren Einsatzbefehl – bis ihnen der Treibstoff ausgeht."
