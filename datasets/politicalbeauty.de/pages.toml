["https://politicalbeauty.de/aktionskunst.html"]
title = "Politische Aktionskunst | Artikel"
description = "Politische Aktionskunst des Zentrums für Politische Schönheit: Lautes Nachdenken über den eigenen Stand"
full_description = "JETZT MITMACHEN Kompliz:in werdenSpenden · ÜberweisenPaypal News InstagramTwitterYouTube Sites StartAktionenEnglischImpressum & Datenschutz Da ist zum einen der Ruß im Gesicht und zum anderen die Dramaturgie der Abläufe, die dem Spielplan folgt. Außerdem wäre da noch der Austragungsort des Geschehens: die Bühne und die Ankündigung der Show im Theaterplan. Es gibt also einen klassischen Anfangspunkt, an dem sich gewissermaßen der Vorhang hebt. Wir haben es beim Zentrum für Politische Schönheit demzufolge mit klassischen Elementen einer Inszenierung zu tun. Alles was stattfindet, findet als Auf­führ­ung statt. Thema des Stückes ist die Vorführung der Ver­hält­nisse. Doch ganz gleich, was das ZPS anstellt, um sein Anliegen vorzutragen, sind die ersten, die sich empören, die Kunst­kritiker/­-innen. Die natürlich nie Kunst­kritiker sind, sondern oftmals Kommentator/­-innen aus der dritten Riege irgendeiner Lokalredaktion. Damit fängt es schon an. Man schickt zu einem Kunsthappening einen Lokalreporter, der normalerweise über Straßenumbenennungen berichtet. Und der Lokalreporter tut das, was er gelernt hat. Er sucht Kronzeugen, Gegenstimmen, er versucht herauszufinden, wo die Story ist. Gegenstand der Betrachtung ist am Anfang einer jeden Berichterstattung über die Aktionen des ZPS niemals das Geschehen, sondern die Mittel, mit denen das Geschehen abgebildet wurde. Und genau das gehört zur Kunstaktion. Die Empörung ist Teil des Kunstwerks, das Entsetzen des einfachen Journalisten, dem das Genre »Politische Aktionskunst« skandalös erscheint, weil zu seiner Normalität gehört, dass er jeden Morgen aufschreibt, was er im Fernsehen sah, ist im Kunstwerk bereits einkalkuliert. Dieser Furor, die Schnappatmung gewordene Herummeinerei in Form von überhitzten Überschriften und Nichtexpertise ist genreimmanent. Denn politische Kunst ohne Rezeption, ohne das Zusammenspiel zwischen Staatsanwaltschaften, Parlament und Lokal­redaktion, zwischen Öffentlichkeit und Künstler wäre ja bloß Malerei oder irgendetwas anderes, aber eben nicht politische Aktionskunst."
