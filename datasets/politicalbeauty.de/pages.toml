title = "Sarkophag Oberndorf | Zentrum für Politische Schönheit"
description = "Das sind die exklusiven Baupläne für ein Jahrhundertwerk der Humanität: Deutschlands tödlichste Fabrik der Waffenfirma »Heckler & Koch« in Oberndorf wird zugeschüttet und verriegelt."
full_description = "JETZT MITMACHEN Kompliz:in werdenSpenden · ÜberweisenPaypal News InstagramTwitterYouTube Sites StartAktionenEnglischImpressum & Datenschutz Das sind die exklusiven Baupläne für ein Jahrhundertwerk der Humanität: Deutschlands tödlichste Fabrik wird zugeschüttet und verriegelt. Die Waffenfirma »Heckler & Koch« hat in den letzten 25 Jahren abseits von allen Schlagzeilen 375x so viele Menschenleben gefordert wie die Atomkatastrophe von Tschernobyl. Wir werden denselben Sarkophag, der die Strahlung in Tschernobyl zurückhält, über die Waffenfabrik in Oberndorf bauen, damit ihr keine tödlichen »Produkte« mehr entweichen können. Wir sorgen uns oft um Massenver-nichtungswaffen. Aber das große Töten geschieht mittels Kleinwaffen. Die wahren Massenvernichtungswaffen unserer Zeit heißen »G3« und »G36« – made in Germany. In Sofortmaßnahmen werfen Helikopter Sand über der Fabrik ab, um jegliche Aktivität in der Todeszone zu stoppen. Der Sand wird symbolisch aus den Ländern stammen, die Heckler & Koch zuletzt mit illegalen Waffengeschäften beglückt hat – Libyen, Georgien, Mexiko. Helfen Sie dabei, diese gigantische Havarie der Mitmenschlichkeit zu beseitigen. Die schwäbische Waffenfabrik »Heckler & Koch« in Oberndorf, hier mit angezeichneten Fundamenten für den zukünftigen Sarkophag. Geplanter Baubeginn: 2016. »Sarkophag Oberndorf: Mit Architektur Leben retten!«Halb Amerika packte die Angst: in amerikanischen Waffenforen (guns.com, ncgunowners.com) machten sie ihrem Unmut Luft. Auch die deutsche Waffenbranche reagierte gereizt (siehe z.B. hier: gun-forum.de). Interview Hundert Opfer kommen jeden Tag dazugreenpeace-magazin. Betongrab für deutsche WaffenfabrikFabian Ziehe Sarkophag für Heckler & Koch Das Aktionsposter ist leider vergriffen. Für Kompliz:innen haben wir aber noch Restbestände des A1-Posters."
