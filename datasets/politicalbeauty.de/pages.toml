["https://politicalbeauty.de/zukunft.html"]
title = "Die Chronik des 21. Jahrhunderts | Zentrum für Politische Schönheit"
description = "Das Zentrum für Politische Schönheit geht davon aus, dass das 21. Jahrhundert das genozidalste Jahrhundert in der Weltgeschichte werden wird."
full_description = "JETZT MITMACHEN Kompliz:in werdenSpenden · ÜberweisenPaypal News InstagramTwitterYouTube Sites StartAktionenEnglischImpressum & Datenschutz Das Zentrum für Politische Schönheit geht von einem 21. Jahrhundert aus, in dem sich zwei Völkermorde in Afrika und Asien ereignen, die die Ereignisse des Holocaust in den Schatten stellen und die westliche Zivilisation (wieder einmal) völlig unvorbereitet treffen werden. Das 21. Jahrhundert könnte das genozidalste Jahrhundert in der Weltgeschichte werden. In Afrika und Asien könnte es zu Opferzahlen kommen, die das 20. Jahrhundert weit in den Schatten stellen. Sollte der Holocaust mit nichts vergleichbar sein, fiele er unbegriffen aus der Geschichte heraus und wir könnten uns an seiner Nichtwiederholbarkeit und Nichtwiederkehrbarbarkeit beruhigen.Die Abwendung von Genozid und der militärische Schutz der Zivilbevölkerung sind die Schlüsselfragen des 21. Jahrhunderts. Das ZPS setzt sich mit der mangelnden Bereitschaft, Zivilisten aktiv vor Gewalt, Misshandlung, Vertreibung und Vernichtung zu schützen und der Ungeheuerlichkeit erneuter genozidaler Kriegsführung wenige Jahrzehnte nach dem Holocaust in seinen Frühwerken auseinander (in: Bergungsarbeiten auf Lethe, Säulen der Schande und 2099). Himmel über Srebrenica zeigt, wie der Völkermord in Srebrenica hätte verhindert werden können.Das Schweigen der Politiker, Intellektuellen und Medien zur Frage, was Deutschland gegen Völkermord zu tun gedenkt, führt dazu, dass die Verhinderung von Genozid im Ernstfall erneut nebenher (d.h. neben Steuersenkungsplänen und Telekommunikationsgesetzen) und völlig planlos entschieden wird. Die Frage, ob und was wir als Gesellschaft gegen Genozid zu tun bereit sind, muss in breiter Öffentlichkeit diskutiert werden, bevor es erneut zu spät ist. Die im Fluss des Vergessens von Lethe geborgenen Bomben auf dem 6. Berliner Kunstsalon: zwei alliierte Bomben auf die Krematorien II und III in Birkenau-Auschwitz (nicht auf die Schienen) hätten die Tötungskapazität um 75 % reduziert."
