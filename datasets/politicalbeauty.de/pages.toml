["https://politicalbeauty.de/unsere-waffen.html"]
title = "Wo sind unsere Waffen? | Zentrum für Politische Schönheit"
description = "Die Bilanz ist schockierend: 2019 konnte der MAD ganze 14 (!) Extremisten enttarnen. Warum ist die Bereitschaft zur Verdachtsmeldung so gering? Das liegt nicht am MAD. Es liegt an einer viel zu geringen Bereitschaft zur Verdachtsfallmeldung. Der MAD bittet um Ihre Mithilfe! Er kann alleine nicht erfolgreich sein. Wir brauchen eine neue Wachsamkeit und Aufklärungsbereitschaft – ein Klima des Hinsehens. Erfahren Sie, wie Sie aktiv zum Kampf gegen Extremismus beitragen können! Ihre Beobachtungen könnten entscheidend sein."
full_description = "JETZT MITMACHEN Kompliz:in werdenSpenden · ÜberweisenPaypal News InstagramTwitterYouTube Sites StartAktionenEnglischImpressum & Datenschutz Wir haben den Militärischen Abschirmdienst (MAD) übernommen und suchen jetzt die Waffen, Sprengstoffe und Munitionsdepots, die in allen Truppenteilen der Bundeswehr »verloren« gegangen sind (besser: von Rechtsextremen geklaut wurden). Der Rechtsextremismus rüstet auf! Für jeden Hinweis, der zur Ergreifung der Täter führt, zahlen wir 1.000 Euro! Die verborgene Bedrohung in der Bundeswehr aufdecken: Als besserer MAD haben wir 4.281 Dienststellen der Bundeswehr angeschrieben und über die Suchaktion informiert ﻿(PDF). Der Rücklauf ist überwältigend. Von allen Seiten gibt es Wissen zu demokratiefeindlichen Umtrieben. Das Ergebnis schockiert die Bundeswehrführung. – So sehr, dass sie das Zentrum für Politische Schönheit am Ende sogar mit künstlicher Intelligenz überwacht. Die Bundeswehr räumt auf: Der Militärische Abschirmdienst richtet ein neues Meldeportal ein. Als MAD garantieren wir allen Tippgebern Straffreiheit. Wer bezüglich des Waffen- und Munitions-Diebstahls Beobachtungen macht, Hinweise zu den Tätern und zu organisierten rechtsextremen Strukturen innerhalb des KSK oder der Bundeswehr geben kann, den fordern wir auf, unverzüglich Meldung zu machen. Werden Sie Teil des Wandels! 1. Schweigen ist Komplizenschaft: Deine Beobachtungen können im Kampf gegen den inneren Feind ausschlaggebend sein. Schaue nicht tatenlos zu, wie der Ruf der Bundeswehr beschmutzt wird. Wer schweigt, deckt verbrecherisches Verhalten gegen die Bundesrepublik Deutschland!2. Sieh das Ganze: Was im ersten Moment wie Solidarität gegenüber Deinen Kameraden aussieht, ist in Wirklichkeit ein Treuebruch gegen Dein Vaterland. Du wurdest auf den Schutz der Bevölkerung vereidigt, nicht darauf, kriminelle Extremisten zu decken.3. Dein Mut entscheidet: Es kommt auf Dich an. Niemand kann Dir diese Verantwortung abnehmen. Nur gemeinsam sind wir stark! Du bist nicht alleine. Der Abschirmdienst kann nur abwehren, wenn er über wachsame Ohren innerhalb der Truppe verfügt."
