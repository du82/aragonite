["https://politicalbeauty.de/punishputin.html"]
title = "Putin vor dem ICC | Zentrum für Politische Schönheit"
description = "How should Putin be punished? Support the international criminal court. Decide Putins Fate. Vote Now!"
full_description = "JETZT MITMACHEN Kompliz:in werdenSpenden · ÜberweisenPaypal News InstagramTwitterYouTube Sites StartAktionenEnglischImpressum & Datenschutz Der Internationale Strafgerichtshof (ICC) startet heute weltweit eine großangelegte Kampagne: Unter dem Titel »Decide Putins fate« ruft der ICC dazu auf, über die Frage nach der angemessenen Strafe für die russischen Kriegsverbrechen abzustimmen. Ziel ist es, Putins Gerichtsprozess vorzubereiten. Die Kampagne wird mithilfe einer Webseite, aber auch in der Ukraine, in Den Haag und sogar in Russland durchgeführt.The world is voting now.How should Putin be punished? +++ Update: More than 2 million votes! +++ 17% of votes coming from Russian federation! +++ Non lethal options leading globally.+++ Bei der Kampagne »Decide Putins fate« können Menschen weltweit erstmals in Form einer Abstimmung das Strafmaß festlegen, das die Richter am Internationalen Strafgerichtshof in Den Haag über den Kriegsverbrecher Vladimir Putin verhängen werden. Der Internationale Strafgerichtshof will angesichts des russischen Angriffskriegs erstmals ergebnisoffen explorieren, welche Höchststrafe ein Diktator beim Bruch sämtlicher Konventionen und Statuten des internationalen Rechts vor dem Weltgerichtshof zu erwarten hat. Die Weltbevölkerung wird auf der Kampagnenseite zudem aufgerufen, vergangene oder zukünftige Aufenthaltsorte des lichtscheuen Diktators mitzuteilen. Dafür können Whistleblowerinnen und Whistleblower den Aufenthaltsort Putins direkt und sicher an den ICC übermitteln. Für Hinweise, die zur Ergreifung Vladimir Putins führen, wurden 10 x 1.000.000 Rubel aus Mitteln des deutschen Bundeskriminalamts (BKA) ausgelobt.This is what he might look like: The International Criminal Court (ICC) is launching a large-scale campaign around the world today: under the title »Decide Putin's fate«, the ICC is calling for a vote on the question of appropriate punishment for Russian war crimes. The goal is to prepare Putin's trial. The campaign is being conducted with the help of a website, but also in Ukraine, The Hague, and even Russia.What is the appropriate punishment for war of aggression, systematic rape and most serious persistent crimes against a civilian population?In the campaign »Decide Putin's fate«, people around the world can, for the first time, vote to determine the sentence that judges at the International Criminal Court in The Hague will impose on war criminal Vladimir Putin. In view of Russia's war of aggression, the International Criminal Court wants to explore for the first time in an open-ended manner what maximum punishment a dictator can expect at the World Court for breaking all conventions and statutes of international law."
