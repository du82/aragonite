title = "Der Adenauer SRP+ | Zentrum für Politische Schönheit"
description = "Ein Meisterwerk deutscher Ingenieurskunst und zukünftiger Exportschlager unserer gebeutelten Automobilindustrie!"
full_description = "JETZT MITMACHEN Kompliz:in werdenSpenden · ÜberweisenPaypal News InstagramTwitterYouTube Sites StartAktionenEnglischImpressum & Datenschutz Im Winter 2025 wählt Deutschland einen neuen Bundestag. Und mittendrin: eine verfassungsfeindliche Partei. Der Adenauer SRP+ ist das Wahlkampfgeschenk der Zivilgesellschaft für die Nazis in Deutschland. Innerhalb von zwei Tagen wurde dieser hochdemokratische Gefängnistransporter der Extraklasse ausfinanziert. Die Zentrums-Ingenieur:innen arbeiten rund um die Uhr, um zu liefern, wie von der Gesellschaft bestellt: ein Meisterwerk der deutschen Ingenieurskunst und der zukünftige Exportschlager für die gebeutelte Automobilindustrie. Mit Flakscheinwerfern, Luftschutzsirenen, Störsendern und vielen weiteren Überraschungen. Deutsche Ingenieurskunst im Dienst der Demokratie: der Gefechtsstand für die Spezialkräfte des deutschen Widerstands wird in Berlin der Weltöffentlichkeit präsentiert! Auch die Polizei ist neidisch, gegen den Adenauer SRP+ kann sie einpacken: Wir kümmern uns jetzt selbst um die Faschisten von der AfD. Idealerweise wurde der Adenauer unmittelbar nach der Weltpremiere von den Kollegen der Polizei noch einmal intensiv auf Druckkammerlautsprecher und Funksignalstörer durchgecheckt, damit er auch verkehrssicher ankommt. Fazit: Deutsche, sehr stabile Wertarbeit. Weiter gehts. Auf dem Bundesparteitag der AfD im sächsischen Riesa feiert der Adenauer SRP+ dann seinen allerersten Einsatz. Und schreibt prompt Geschichte: Die technologische Aufrüstung der demokratischen Freiheitsrechte ergibt durchaus Sinn. Die Einsatzleitung der Polizei Sachsen gibt sich beeindruckt. Im Ort des AfD-Bundesparteitags angekommen, wird der Adenauer widerrechtlich ganze neun Stunden von einer Terrororganisation mit Hunden und Wasserwerfern bei Temperaturen unter Null Grad, der sog. »Polizei Sachsen«, festgehalten und daran gehindert, auf seine genehmigte Versammlung auf dem Parteitagsgelände zu gelangen. Und das, obwohl das High-Tech-Gefährt integraler Bestandteil der Anmeldung der Gegendemonstrationen ist. Aber unsere Einsatzleitung weiß Rat:"
