["https://politicalbeauty.de/Vita_Ruch.html"]
title = "Philipp Ruch | Zentrum für Politische Schönheit"
description = 'Philipp Ruch, Philosoph und Aktionskünstler. 1981 in Dresden geboren, Gründer des Zentrums für Politische Schönheit und radikaler Humanist. Ruch gehört zur Generation der Regisseure, die nach Schlingensief das Theater als künstlerische Form, nicht als Anstalt, betrachten. Seine Aktionen handeln vom "aggressiven Humanismus". Ruch studierte politische Ideengeschichte und promovierte in antiker Gewaltgeschichte (»Ehre und Rache. Eine Gefühlsgeschichte des antiken Rechts«). 2024 erschien sein Buch "Es ist 5 vor 1933", ein "Weckruf der Stunde" laut der Süddeutschen Zeitung.2015 erschien Wenn nicht wir, wer dann?, in dem er die Dominanz der naturwissenschaftlichen Interpretationen des Menschen kritisiert und eine Reihe von »toxischen Ideen« behandelt, die jede humane Selbstbetrachtung des Menschen unmöglich machen. Im Herbst 2019 erschien Schluss mit der Geduld über das Verhältnis von Phantasie und Humanität im Spannungsfeld zwischen Journalismus und Politik. Es forderte das Ende der innenpolitischen Appeasement-Politik (»Mit Rechten reden«) gegenüber dem Rechtsextremismus.Seine Arbeiten explorieren an der Grenzlinie zwischen Macht der Fiktion und Macht der Geschichte. Die Verarbeitung der Schockerfahrung westlicher Handlungsunfähigkeit bei Bevölkerungsmorden durchzieht sein gesamtes Werk. Zahlreiche Inszenierungen: GORKI Theater, Münchner Kammerspiele, Theater Neumarkt, Wienwoche, Berlin Biennale, Schauspiel Dortmund, Steirischer Herbst, NGBK.'
