full_description = "German Federal Election 2021 28 July 2021 Our chart has been compiled with reference to speeches, manifestos and, where applicable, voting records. Should significant policy changes be announced during the campaign, the chart will be updated accordingly. We regret that the volume of emails that we’re presently receiving prevents us from replying in most cases. All correspondence, however, is carefully read. After sixteen years as Chancellor of Germany, Angela Merkel is standing down, but her personal popularity ratings are high. She has almost transcended the fray of everyday politics and is widely seen as the proverbial Mother of the Nation. Her authentically emotional response on visiting the flood devastated regions was in sharp contrast to that of her gaffe-prone Party leader and probable successor, Armin Laschet. The viral image of him laughing during President Steinmeier’s speech in flood-hit Erftstadt will probably haunt him for the rest of his political life. The damage that it will do to him in this election is incalculable, since a significant part of the Christian Democratic Party (CDU) voter base is loyal to Merkel rather than the Party itself. The lady is a tough act to follow, even though the Party’s lead in the polls has been diminishing since early this year. Nevertheless the CDU/CSU together account for around 29 percent of the votes. The floods, and the ensuing heightened voter awareness of climate change as a reality rather than an abstract danger, have shifted dominant voter concerns. Even the CDU’s more conservative sister party, the Bavarian-centred Christian Social Union (CSU), has been calling for more ambitions climate targets. These campaign-altering developments might be thought to benefit the Greens, but they remain behind the CDU in the polls. At the same time they’re apparently ahead of Germany’s traditional second party, the Social Democrats (SPD). The Greens are stronger than in any other country, and only Canada’s Greens are more fiscally conservative. This has allowed the German Greens to form relatively easy coalitions with either the CDU or the SPD. Unlike in most previous elections, the Green manifesto for 2021 makes no mention of a preference for joining an SPD-led coalition. The Greens, for the first time, have also put forward a candidate for Chancellor, the tough and competent Party Co-leader Annalena Baerback, recently the target of well-publicised, mostly petty, ‘scandal’ revelations. The SPD leader, Olaf Scholz, serves in the present government as Merkel’s deputy and Finance Minister. Despite his passionate Party youth wing past, he appears today as something of a plodding bureaucrat and killjoy. At the same time Scholtz has emerged as the clear winner against Laschet in all three TV debates. As with Social Democratic leaderships in most countries, Germany’s SPD has drifted to the right, either reluctantly or enthusiastically accepting the neoliberal global orthodoxy. Scholz is considerably more fiscally conservative than the Party’s rank and file members, which will drive some of them to Die Linke (The Left), comprising unhappy West German Social Democrats, old East German Communists and others. The Left has also expressed concern about incidents of over-zealous policing and other perceptions of authoritarianism. All parties are wary of coalition with either The Left or the strident Alternative for Germany (AfD) which somehow wraps anti-immigration and right wing economics in the national flag. As with similar parties elsewhere in Europe, its social base is in the provinces and among the less privileged. Probably the most interesting one to watch this time is the Free Democratic Party (FDP) — the only one significantly gaining strength in the polls. With many younger voters in particular unhappy with the economic consequences of governmental failures on Covid and much else, the steadfastly free market FDP appears fresh and attractive. In tandem with its neoliberal enthusiasm for widespread privatisation, especially in the contentious area of pension schemes for the aging population, the Party also offers strong socially liberal attitudes that will hold wide appeal among young professionals. The FDP might well emerge as the kingmakers in this unusually lively — and uncharacteristically ill-tempered — German federal election. Auf Deutsch Nach sechzehn Jahren als Bundeskanzlerin von Deutschland legt Angela Merkel ihr Amt nieder, aber ihre persönlichen Beliebtheitswerte sind hoch. Sie hat den Kampf der Alltagspolitik fast überwunden und gilt weithin als die sprichwörtliche Mutter der Nation. Ihre authentisch emotionale Reaktion auf den Besuch, der von der Flut verwüsteten Regionen, stand in scharfem Kontrast zu der ihres karneval-anfälligen Parteivorsitzenden und wahrscheinlichen Nachfolgers Armin Laschet. Das Bild in den Medien von ihm, lachend während der Rede von Bundespräsident Steinmeier im überschwemmten Erftstadt, wird ihn wohl noch für den Rest seines politischen Lebens verfolgen. Der Schaden, den es ihm bei dieser Wahl zufügen wird, ist unkalkulierbar, da ein erheblicher Teil der CDU–Wählerschaft eher Merkel als der Partei selbst treu ist. Die Dame ist schwer nachzufolgen. Auch wenn der Vorsprung der Partei in den Umfragen seit Anfang dieses Jahres abnimmt, entfallen dennoch auf die CDU/CSU zusammen rund 29 Prozent der Stimmen. Die Überschwemmungen, und das daraus resultierende erhöhte Bewusstsein der Wähler für den Klimawandel als Realität und nicht als abstrakte Gefahr, haben die vorherrschenden Wählersorgen verschoben. Selbst die konservativere Schwesterpartei der CDU, die bayerische CSU, fordert mehr Ambitionen für klimapolitische Ziele. Man könnte denken, dass diese wahlkampfverändernden Entwicklungen den Grünen zugutekommen, aber sie bleiben in den Umfragen hinter der CDU zurück. Gleichzeitig liegen sie offenbar vor Deutschlands traditionell zweitstärkster Partei, den Sozialdemokraten (SPD). Die Grünen sind stärker als in jedem anderen Land, und nur Kanadas Grüne sind konservativer ausgerichtet. Dies hat es den deutschen Grünen ermöglicht, relativ einfache Koalitionen mit der CDU oder der SPD zu bilden. Anders als bei den meisten vorangegangenen Wahlen, erwähnt das grüne Manifest für 2021 keine Präferenz für den Beitritt zu einer SPD-geführten Koalition. Die Grünen haben zum ersten Mal auch eine Kandidatin für die Kanzlerin aufgestellt, die harte und kompetente Co-Vorsitzende Annalena Baerbock, die kürzlich Ziel von gut publizierten, meist kleinlichen “Skandal”-Enthüllungen war. Der SPD-Chef Olaf Scholz ist in der jetzigen Regierung Merkels Stellvertreter und Finanzminister. Trotz seiner leidenschaftlichen Juso- Vergangenheit erscheint er heute als eine Art plumper Bürokrat und Spassbremse. Wie bei den sozialdemokratischen Führungen in den meisten Ländern ist die deutsche SPD nach rechts gedriftet, und hat die neoliberale globale Orthodoxie entweder widerwillig oder enthusiastisch akzeptiert. Scholz ist fiskalisch deutlich konservativer als die Basismitglieder der Partei, die einige von ihnen zu Die Linke treiben werden, bestehend aus frustrierten westdeutschen Sozialdemokraten, alten ostdeutschen Kommunisten und anderen. Die Linke hat auch ihre Besorgnis über Vorfälle übereifriger Polizeiarbeit und andere Wahrnehmungen von Autoritarismus zum Ausdruck gebracht. Wie bei den sozialdemokratischen Führungen in den meisten Ländern ist die deutsche SPD nach rechts gedriftet und hat die neoliberale globale Orthodoxie entweder widerwillig oder enthusiastisch akzeptiert. Scholz ist fiskalisch deutlich konservativer als die Basismitglieder der Partei, die einige von ihnen zu Die Linke treiben werden, bestehend aus unglücklichen westdeutschen Sozialdemokraten, alten ostdeutschen Kommunisten und anderen. Die Linke hat auch ihre Besorgnis über Vorfälle übereifriger Polizeiarbeit und andere Wahrnehmungen von Autoritarismus zum Ausdruck gebracht. Alle Parteien sind vorsichtig mit einer Koalition mit der Linken oder der schrillen Alternative für Deutschland (AfD), die Anti-einwanderung und rechte Ökonomie irgendwie in die Nationalflagge verpackt. Wie bei ähnlichen Parteien anderswo in Europa liegt ihre soziale Basis in den auf dem Land und unter den weniger Privilegierten. Die wohl interessanteste Partei, die man diesmal beobachten kann, ist die FDP — die einzige, die in den Umfragen deutlich an Stärke gewinnt. Da vor allem viele jüngere Wähler mit den wirtschaftlichen Folgen von Regierungsversagen bei Covid und vielem mehr unzufrieden sind, erscheint die standhaft marktwirtschaftliche FDP frisch und attraktiv. Zusammen mit ihrer neoliberalen Begeisterung für eine weit verbreitete Privatisierung, insbesondere im umstrittenen Bereich der Rentensysteme für die alternde Bevölkerung, bietet die Partei auch starke sozialliberale Einstellungen, die bei jungen Berufstätigen eine breite Anziehungskraft haben werden. Die FDP könnte bei dieser ungewöhnlich lebhaften – und ungewöhnlich schlecht gelaunten — Bundestagswahl als Königsmacher hervorgehen. translation by Martin Kaiser"
