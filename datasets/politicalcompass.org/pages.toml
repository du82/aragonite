["https://politicalcompass.org/france2024"]
title = "The Political Compass"
description = "The Political Compass: a 2-dimensional typology of political opinions"
full_description = "French Legislative Election June/July 2024 16 June 2024 Traduction française ci-dessous Centre and left supporters have every reason to worry about the surge in popularity of Marine LePen’s National Rally (Rassemblement National), the extreme nationalist party that won more than twice President Emmanuel Macron’s share of the vote in the recent EU elections. Macron’s subsequent decision to hold a snap election was motivated partly by the belief that voters tend to punish their governments in EU elections, but afford them stronger support in a national poll. Despite Macron’s confident image on the international stage, he nevertheless remains hugely unpopular at home. A recent opinion poll shows him with a humiliating 65 percent disapproval rating. The charismatic figure of 2017 is now characterised as headstrong and out of touch with the electorate, reflected by the decision of many candidates in his centre-right Renaissance party to downplay his name and image in the present campaign. Some have gone as far as calling it De-Macronisation. The party is making a pitch for economic prudence, condemning the heavy spending programmes of both LePen and the left parties. This time around, National Rally looks less extreme, given the surge of support for populist parties throughout Europe. It has also gone a long way to shrugging off its image as a party for elderly disgruntled provincials — thanks in no small part to the rise of LePen’s protégé, the telegenic night clubber and Tiktoker, Jordan Bardella. The 28-year-old is ready to be Prime Minister if his party wins an outright majority, with LePen hoping to take over the presidency from Macron in 2027. Given LePen’s strong Euroscepticism, the prospect must be causing jitters in Brussels. In Political Compass terms, we argue that left and right are essentially about economics. LePen’s extremism is on the social scale, with her racist anti-immigrant policies, the desire to restore capital punishment and so much more. Conversely her economics are far from extreme. In common with the left, she has opposed Macron’s rise in the pension age and has promised increases in certain welfare provisions, and to slash energy bills. If we insist on labelling a party or person ‘right wing’, because of their nationalism and authoritarianism, it logically follows that the more ‘left wing’ a party is, the more socially liberal it becomes. Yet no government is more economically left wing than, for example, North Korea, but it’s hardly a shining beacon of social liberalism! France’s conservative party, The Republicans (Les Républicains), are in disarray after their ultra-conservative president, Eric Ciotti, outraged most members by unilaterally announcing an alliance with National Rally. He was consequently fired, only to be sort of reinstated after a court ruling that his ousting was illegal. By contrast, the French left have rapidly formed the New Popular Front, a not entirely comfortable grouping of Socialists (Parti Socialiste), Communists (Parti Communiste), Greens (Les Écologistes) and France Unbowed (France Insoumise). Among the left’s policies are a wealth tax, a rise in the minimum wage, an immediate ceasefire in Gaza, recognition of the State of Palestine, continuation of arms sales to Ukraine, and legislation for zero carbon by 2050. It remains unclear who will lead the New Popular Front, and, in the event of a surprise win, who would be Prime Minister. This has to be the most significant election in France for decades, with implications for not only the country, but for the whole of Europe — and beyond. Our chart has been compiled with reference to speeches, manifestos and, where applicable, voting records. Should significant policy changes be announced during the campaign, the chart will be updated accordingly. We regret that the volume of emails that we’re presently receiving prevents us from replying in most cases. All correspondence, however, is carefully read. Législatives 2024 Les partisans du centre et de la gauche ont toutes les raisons de s’inquiéter de la popularité montante du Rassemblement National de Marine LePen, un parti nationaliste extrême, qui a remporté plus du double de voix que le président Emannuel Macron lors des récentes élections européennes. La décision de Macron d’organiser en conséquence des élections anticipées a été motivée en partie par la conviction que les électeurs ont tendance à punir leurs gouvernements lors des élections européennes, mais leur apportent un soutien plus fort lors d’un sondage national. Malgré son image de confiance sur la scène internationale, Macron reste néanmoins extrêmement impopulaire dans son pays. Un récent sondage d’opinion lui donne un taux de désapprobation humiliant de 65 pour cent. La figure charismatique de 2017 est désormais considérée comme têtue et déconnectée de l’électorat, comme en témoigne la décision de nombreux candidats et militants de son parti de centre-droit, Renaissance, de minimiser son nom et son image dans la campagne actuelle. Certains sont même allés jusqu’à parler de dé-macronisation. Le parti prône la prudence économique, condamnant les programmes de dépenses onéreuses de LePen et des partis de gauche. Cette fois-ci, le Rassemblement national semble moins extrêmiste, compte tenu de la montée du soutien aux partis populistes dans toute l’Europe. Il a également fait beaucoup de chemin pour se débarrasser de son image de parti de provinciaux âgés et mécontents — grâce en grande partie à la montée en puissance du protégé de Le Pen, le télégénique visiteur de discothèques et tiktokeur Jordan Bardella. Le jeune homme de 28 ans est prêt à devenir Premier ministre si son parti obtient une majorité absolue, LePen espérant succéder à Macron à la présidence en 2027. Compte tenu du fort euroscepticisme de LePen, cette perspective doit provoquer une certaine nervosité à Bruxelles. Au Political Compass, nous soutenons la thèse que la gauche et la droite se résument essentiellement à une question d’économie. L’extrémisme de LePen s’étend à l’échelle sociale, avec sa politique raciste anti-immigratoir, son désir de rétablir la peine capitale et bien plus encore. À l’inverse, ses aspects économiques sont loin d’être extrêmes. Comme la gauche, elle s’est opposée au relèvement de l’âge de la retraite proposé par Macron et a promis d’augmenter certaines prestations sociales et de réduire les factures d’énergie. Si nous insistons pour qualifier un parti ou une personne «d’extrême droite», en raison de leur nationalisme et de leur autoritarisme, il s’ensuit logiquement que plus un parti est «de gauche», plus il devient socialement libéral. Pourtant, aucun gouvernement n’est plus à gauche économiquement que, par exemple, la Corée du Nord, mais ce n’est pas vraiment un phare du libéralisme social! Le parti conservateur français, Les Républicains, est en plein désarroi après que son président ultra-conservateur, Eric Ciotti, a indigné la plupart de ses membres en annonçant unilatéralement une alliance avec le Rassemblement national. Il a donc été licencié, pour ensuite être en quelque sorte réintégré après une décision de justice déclarant son éviction illégale. En revanche, la gauche française a rapidement formé le Nouveau Front populaire, un regroupement pas tout à fait cohérent du Parti Socialiste (PS), Parti communiste français (PCF), Les Écologistes et de La France Insoumise (LFI). Parmi les politiques de gauche figurent un impôt sur la fortune, une augmentation du salaire minimum, un cessez-le-feu immédiat à Gaza, la reconnaissance de l’État de Palestine, la poursuite des ventes d’armes à l’Ukraine et une législation zéro carbone d’ici 2050. On ne sait toujours pas qui dirigera le Nouveau Front populaire et, en cas de victoire surprise, qui en serait le Premier ministre. Il s’agit sans doute de l’élection la plus importante organisée en France depuis des décennies, avec des implications non seulement pour le pays, mais pour l’ensemble de l’Europe — et au-delà. Our thanks to translator François Sauvageot"
