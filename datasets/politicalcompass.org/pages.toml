["https://politicalcompass.org/germany2025"]
title = "The Political Compass"
description = "The Political Compass: a 2-dimensional typology of political opinions"
full_description = "German Federal Election 2025 12 January 2025 Our chart has been compiled with reference to speeches, manifestos and, where applicable, voting records. Should significant policy changes be announced during the campaign, the chart will be updated accordingly. We regret that the volume of emails that we’re presently receiving prevents us from replying in most cases. All correspondence, however, is carefully read. Germany’s two main parties suffer from an aging voter base and a growing unwillingness among voters to retain old party loyalties. Under Chancellor Olaf Scholz, the Social Democrats (SPD) have continued to depend largely on the trade unions and the densely populated industrial heartlands in the west of the country. Their message remains largely the same. The minimum wage should countinue to rise, and Scholz now proposes a wealth tax for the highest earners. By contrast, the Christian Democrats (CDU) and their Bavarian sister party, the Christian Social Union (CSU) want to decrease the tax burden and take a stronger line on illegal immigration. CDU leader Friedrich Merz has an abrasive manner that is a turn-off for many voters, but he still has a good chance of becoming the country’s next Chancellor, thanks to the relative popularity of his party. The Free Democrats (FDP) offer a libertarian mix of tax breaks, deregulation and civil liberties, with an appeal limited to business and certain professional classes. Their leader, Christian Lindner, was Finance Minister in the last government, but fired by Scholz, precipitating this election. The Left (Die Linke) holds the torch for disenchanted Greens and Social Democrats who believe that their parties have gone too far to embrace neo-liberalism at the expense of welfare investment. Their call for greater regulation of the market and, especially, the strengthening of rent caps, strikes a chord at a time of critical housing shortages. Their rejections of deportations, however, is in striking contrast to the new, breakaway left party Bündnis Sahra Wagenknecht (BSW), extraordinarily named after its ex Die Linke founder. Economically social democratic, the party as more than a mild authoritarian streak, notably on the issue of immigration. Like Die Linke, the BSW is deeply critical of NATO, Israel’s actions in Gaza, and the two main parties for their unswerving loyalty to Tel Aviv. The Greens, more conservative than most of their sister parties in other countries, are nevertheless proposing a billionaires tax. Die Linke is considerably more radical than the Greens, even, paradoxically, on green issues. The Political Compass asserts that ‘Left’ and ‘Right’ are only useful for describing economic issues. Many of the so-called extreme right parties are actually quite moderate in their economic policies. Their extremism is in their social attitudes. The Alternative for Germany (AfD) party, however, is extreme on both scales. It calls for mass deportations and expulsions, and is overtly anti-Islam and Eurosceptic. The party also denies the human role in climate change. Its voter base is among mid and, to a greater extent, low income earners, yet it champions a market-driven economy that runs counter to the economic interest of the majority of its voters. For this reason, the BSW can be expected to attract some of the AfD’s more astute supporters. At the same time, the AfD can no longer be dismissed by its detractors as merely a reactionary protest party for frightened provincials. It has tapped into widespread and multi-faceted national discontent, entering mainstream German political with unexpected rapidity. Its astonishing appeal among many young voters, heightened by the party’s skilful deployment of TikTok, suggests that it may gain further ground on February 23. Auf Deutsch Die beiden großen Parteien Deutschlands leiden unter einer alternden Wählerbasis und einer wachsenden Unwilligkeit der Wähler, alte Parteibindungen aufrechtzuerhalten. Unter Bundeskanzler Olaf Scholz verlassen sich die Sozialdemokraten (SPD) weiterhin stark auf die Gewerkschaften und die dicht besiedelten industriellen Kernregionen im Westen des Landes. Ihre Botschaft bleibt weitgehend dieselbe: Der Mindestlohn sollte weiterhin steigen, und Scholz schlägt nun eine Vermögenssteuer für die Spitzenverdiener vor. Im Gegensatz dazu wollen die Christlichen Demokraten (CDU) und ihre bayerische Schwesterpartei, die Christlich-Soziale Union (CSU), die Steuerlast senken und eine härtere Linie bei illegaler Einwanderung verfolgen. Der CDU-Vorsitzende Friedrich Merz hat eine schroffe Art, die für viele Wähler abschreckend ist, aber er hat dennoch gute Chancen, der nächste Bundeskanzler zu werden, dank der relativen Popularität seiner Partei. Die Freien Demokraten (FDP) bieten eine libertäre Mischung aus Steuererleichterungen, Deregulierung und Bürgerrechten an, mit einer begrenzten Anziehungskraft auf Unternehmen und bestimmte Berufsgruppen. Ihr Vorsitzender Christian Lindner war Finanzminister in der letzten Regierung, wurde jedoch von Scholz entlassen, was diese Wahl auslöste. Die Linke hält die Fahne für enttäuschte Grüne und Sozialdemokraten hoch, die glauben, dass ihre Parteien den Neoliberalismus auf Kosten von Sozialinvestitionen zu sehr umarmt haben. Ihre Forderung nach einer stärkeren Marktregulierung und insbesondere der Stärkung von Mietpreisbremsen trifft in Zeiten akuten Wohnungsmangels einen Nerv. Ihre Ablehnung von Abschiebungen steht jedoch in starkem Kontrast zur neuen, abtrünnigen Linkspartei Bündnis Sahra Wagenknecht (BSW), die außergewöhnlicherweise nach ihrer Gründerin, einer ehemaligen Linken-Politikerin, benannt ist. Wirtschaftlich sozialdemokratisch, zeigt die Partei einen deutlichen autoritären Einschlag, insbesondere in der Frage der Einwanderung. Wie die LINKE ist die BSW stark kritisch gegenüber der NATO, den Aktionen Israels im Gazastreifen und den beiden großen Parteien wegen ihrer unerschütterlichen Loyalität zu Tel Aviv. Die Grünen, konservativer als die meisten ihrer Schwesterparteien in anderen Ländern, schlagen dennoch eine Milliardärssteuer vor. Die LINKE ist in grünen Themen deutlich radikaler als die Grünen selbst. Der Political Compass argumentiert, dass „links“ und „rechts“ nur für die Beschreibung wirtschaftlicher Themen nützlich sind. Viele der sogenannten „extremen rechten“ Parteien sind wirtschaftlich tatsächlich recht moderat. Ihr Extremismus zeigt sich in ihren sozialen Einstellungen. Die Partei Alternative für Deutschland (AfD) hingegen ist auf beiden Ebenen extrem. Sie fordert Massenabschiebungen und Ausweisungen, ist offen islamfeindlich und europaskeptisch. Die Partei bestreitet zudem die menschliche Rolle beim Klimawandel. Ihre Wählerbasis liegt unter mittleren und – in größerem Maße – niedrigen Einkommensschichten, obwohl sie eine marktorientierte Wirtschaft befürwortet, die den wirtschaftlichen Interessen der Mehrheit ihrer Wähler entgegenläuft. Aus diesem Grund könnte die BSW einige der klügeren Anhänger der AfD für sich gewinnen. Gleichzeitig kann die AfD von ihren Kritikern nicht länger einfach als reaktionäre Protestpartei für verängstigte Provinzbewohner abgetan werden. Sie hat ein breites, vielschichtiges nationales Unzufriedenheitspotenzial erschlossen und ist mit unerwarteter Schnelligkeit in das politische Mainstream-Leben Deutschlands eingedrungen. Ihre erstaunliche Attraktivität unter vielen jungen Wählern, verstärkt durch den geschickten Einsatz von TikTok, deutet darauf hin, dass sie am 23. Februar weiter an Boden gewinnen könnte."
