full_description = "Contact Us We have been truly overwhelmed by the response we’ve had to The Political Compass™. So much so that we are no longer able to personally answer all of the correspondence we receive, much as we would like to. Please do not be offended. We have to fit working on The Political Compass™ around our ‘real’ lives, and there just aren’t enough hours in the day. Please check our Frequently Asked Questions page first (FAQ1 in particular). More likely than not, it will address your comment or inquiry. If you wish to contact us, email [email protected]. Sorry, but we can only deal with email in the English Language. Although the volume of email we receive means we cannot promise an answer, we do read all of it."
