full_description = "Welcome! It’s timely to stress that The Political Compass has been on the internet since 2001. The uniqueness of our take on politics is reflected in the gratifyingly enthusiastic reviews we’ve enjoyed in the national media of many countries from our earliest years — as well as from many teachers and academics who continue to use our work. Read more about our work here. Advertisement The Political Compass 24 years Welcome! It’s timely to stress that The Political Compass has been on the internet since 2001. The uniqueness of our take on politics is reflected in the gratifyingly enthusiastic reviews we’ve enjoyed in the national media of many countries from our earliest years — as well as from many teachers and academics who continue to use our work. Read more about our work here. Take the Test Find out where you stand on The Political Compass The Secrets of National Songs All you need to know about the making and meaning of national songs! Erik Levi, Professor of Music at Royal Holloway, University of London, talks about the musical devices that stir emotions in patriotic songs and takes a critical look at some interesting examples. The Death penalty and the Authoritarian Personality Robert Dunham, Executive Director of the Death Penalty Information Center in Washington DC, discusses with Wayne Brittenden the ethical and legal situation of capital punishment globally — but particularly in the US, which is the only western democracy that — at least in 29 states — can still execute its citizens. Iconochasms The chasm between your icons and what you probably don’t know about them Nuclear Risks at all-time High! The Bulletin of Atomic Scientists has set the hands of the nuclear Doomsday Clock closer to midnight than ever before. Here’s the podcast that explains the heightened dangers that we’re too distracted these days to notice. John LaForge is a professional analyst and dedicated activist. He is Co-director of Nukewatch, a peace and environmental justice group in Wisconsin, US. The Laddie is a Trump A mischievous musical tribute to Donald Junior German Federal Election 2025 Germany’s two parties suffer from an aging voter base and a growing unwillingness among voters to retain old party loyalties. Under Chancellor Olaf Scholz, the … US Presidential Election 2024 US elections are never the broad clashes of ideologies that most other western democracies are used to, but this one is different. You would have to go back to 1940 and the fiery exchanges between Roosevelt and Wilkie to find … Podcast Episodes Our growing list of relatively timeless interviews Green Parties — What’s their future? Cognitive Dissonance: The Mind’s Manoeuvre from Uncomfortable Truths Australia Goes Nuclear The Secrets of National Songs The Privatisation of Nature The Spirit Level — 13 Years On Heroes — Do we need them? The Propaganda Trap Anarchism: Thoughts, Values and Actions Was Hitler a Socialist? The Corporatised University The Forgotten Revolutionary Nuclear Risks at an all-time High! Apocalypse Soon? Christmas — The Political History Slavery Today How Fascism Works — The politics of us and them Prof Paul Ehrlich on The Population Bomb … and much else The Death Penalty and the Authoritarian Personality Donate via Paypal small tip £1.00 GBP medium tip £2.00 GBP generous tip £5.00 GBP How Fascism Works — The politics of us and them Philosopher and Professor of Philosophy at Yale University Jason Stanley discusses his book on fascism — a word currently widely used but often misunderstood. Stanley, also the author of How Propaganda Works, offers some unique insights into the fascist mindset and the circumstances that help create it. Trump: Making Hyperboles and Superlatives Great Again It took Joe Biden’s departure to spotlight Trump’s own shortcomings in communication. The unfinished sentences, repetitions and overblown rhetoric are nothing new, but … An Open Letter to Christopher Columbus Since you’ve been in the news, it seems timely to drop you a line. After all, it’s not everyone that gets a US holiday in their honour. You and Martin Luther King. The two of you could hardly be more different … The Political Compass in a nutshell Our amusing video explains so much in less than 5 minutes! Gardens and Politics What your garden reveals … Ideological Music from all Compass quadrants!"
