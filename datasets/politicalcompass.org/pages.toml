title = "The Political Compass"
description = "Political Compass frequently asked questions"
full_description = "Frequently Asked Questions The Test Some of the questions are slanted Respondents are going to feel under pressure to be politically correct Some of the propositions are culturally biased My position on The Political Compass™ is at odds with the politicians I support In some cases none of the four possible responses reflected my attitude You should have a “don’t know” option Why don’t you collect statistics and report on test results? Where would Jesus and/or Mohammed appear? How can you determine where politicians are honestly at without asking them? Gripes About Particular Propositions Your proposition on globalisation suggests that corporations and humanity can’t both benefit. What have attitudes towards things like abstract art and homosexuality to do with politics? Why don’t you include a scale for religion? It’s true that a one party state has a significant advantage; even so I wouldn’t support it. So how can I respond? Does “our race has many superior qualities” refer to the human race or my particular race? The original intention of “An eye for an eye” was that the punishment should not exceed the crime The Political Compass Definitions There have to be other measures for a political compass You can’t be libertarian and left wing Where are the right-wing social libertarians on the international chart? Why is Hitler slightly right? The Nazis were socialists, so they weren’t fascists either. How can I be in the same quadrant as Pol Pot/Hitler/Stalin? I’m no Pol Pot/Hitler/Stalin! You’ve got liberals on the right. Don’t you know they’re left? Politics have moved, but you’re still using the old economic parameters. Most governments and political figures are plotted on the right. Doesn’t that mean that your centre is misplaced? Further Help From The Political Compass Do you have a chart for the political leader of my country? Can you provide your scoring details so that students/colleagues can respond to the propositions with pencil and paper? Can you help me produce my own version of The Political Compass? May I build a Political Compass app on Facebook? How can I display several people’s scores on a single chart? Why did you do this? What’s in it for you? When are you guys gonna learn to spell? The Test Some of the questions are slanted Most of them are slanted! Some right-wingers accuse us of a leftward slant. Some left-wingers accuse us of a rightward slant. But it’s important to realise that this isn’t a survey, and these aren’t questions. They’re propositions — an altogether different proposition. To question the logic of individual ones that irritate you is to miss the point. Some propositions are extreme, and some are more moderate. That’s how we can show you whether you lean towards extremism or moderation on the Compass.The propositions should not be overthought. Some of them are intentionally vague. Their purpose is to trigger reactions in the mind, measuring feelings and prejudices rather than detailed opinions on policy.Incidentally, our test is not another internet personality classification tool. The essence of our site is the model for political analysis. The test is simply a demonstration of it. top Respondents are going to feel under pressure to be politically correct Not really, because we’ve assured them that not only are their identities unknown, but their responses totally unrecorded. So the only actual pressure will come from themselves. We’ve found that a lot of people aren’t comfortable with the first result, so they go through the propositions again, changing some of their earlier responses. It’s a bit like an overweight person stepping back on the scales after removing their shoes. top Some of the propositions are culturally biased Right. That’s why the Compass is being promoted in western democracies. We don’t pretend that, for example, the responses of a citizen of a rural region of China can undergo the same evaluation process. top My position on The Political Compass™ is at odds with the politicians I support Politicians often speak in codes that disguise actual policy, with the aim of appealing to as broad a spectrum of the public as possible.While the individual may identify with particular figures, if their positions and the consequences of those positions are acted upon, they may disagree.The propositions in the test give the respondent an all-too-rare chance to consider many situations. Their reactions are sometimes quite different from the positions of their favourite politicians.For example, a conservative person may be straightforwardly opposed to universal health care, but disagree with a proposition suggesting that the quality of a child’s health care should be governed by the health of the parents’ finances. top In some cases none of the four possible responses reflected my attitude One expert in the field suggested that we restrict the responses to simply ‘agree’ and ‘disagree’. But how many do you need? Ten? Twenty? If you choose the one that most nearly reflects your feeling, you’ll get an accurate reading … even if it niggles. top You should have a “don’t know” option This makes it too easy for people to duck difficult issues. By forcing people to take a positive or negative stance, the propositions make people really evaluate their feelings. Often people find they wanted to select “don’t know” mainly because they’d never really thought about the idea. top Why don’t you collect statistics and report on test results? It is important to us — and most of our respondents — that the test remains anonymous, and purely for personal information. If we were to log anyone’s results, those results would have to be given voluntarily. This would mean that our sample would be self-selected, and therefore not statistically valid.In other words, such data would tell us nothing about the political position of a particular population; it would only tell us about the type of person who volunteered to have their result recorded.Trials have revealed that a wildly disproportionate number of visitors from particular cultures, and of certain age and socio-economic groups, were more willing than others to opt in. top Where would Jesus and/or Mohammed appear? That one would be way too speculative for our purposes … and if we did engage in such speculation, we’d be even more inundated with correspondence. Most aspects of contemporary politics didn’t impact on the times of Jesus and other religious teachers anyway. top How can you determine where politicians are honestly at without asking them? How can you tell where they’re honestly at by asking them? Especially around election time. We rely on reports, parliamentary voting records, manifestos … and actions that speak much louder than words. It takes us a great deal longer than simply having the politician take the test — but it’s also a far more accurate assessment. In our early experience, politicians taking the test often responded in ways that conflicted with their actions but conformed to the prevailing mood of the electorate.We are occasionally asked about publishing the individual responses of politicians. We frown on this. The propositions are too vague to be considered statements of policy, and the individual responses are not significant in themselves. When summed to give an economic and social score, however, they provide an accurate profile of a mental state. top Gripes About Particular Propositions Your proposition on globalisation suggests that corporations and humanity can’t both benefit. This one sometimes ruffles feathers on right wings. What the proposition actually suggests is that humanity should be the priority.Critics argue that there’s no conflict of interest. Transnational corporations naturally and unfailingly serve humanity by serving themselves. In enriching business, the argument goes, globalisation will always subsequently benefit humanity. Prioritising humanity would only limit the ability of the corporations to inevitably do greater good. So advocates of this trickle down approach should simply click “strongly disagree” We don’t see the problem. The record, however, makes clear that there have often been spectacular conflicts of interest between corporate enrichment and humanity. Halliburton, Enron and the tobacco industry’s research cover-ups are perhaps the best known examples. Others are detailed at The 10 Worst Corporations of 2008 and Corpwatch.org.On the other hand, for the comparatively few who tell us that corporations can never serve humanity, Milton Friedman argues the case for unfettered market forces. top What have attitudes towards things like abstract art and homosexuality to do with politics? On the social scale, they’re immensely important. Homophobia has been highly politicised by leaders like Robert Mugabe and betrays a tendency to condemn and punish those who disregard conventional values. Hitler’s pink triangles reflected similar authoritarian hostility.Likewise, authoritarian régimes frequently attack highly imaginative and unconventional art, music and literary works as a threat to the rigid cultural conformity they uphold. top Why don’t you include a scale for religion? Amongst the western democracies for which The Political Compass is a universal tool, it is only in the US that religion plays a significant role in politics. Had the test been some kind of questionnaire or survey profiling a particular personality it might have a place, but for a purpose such as ours it has little relevance.Even in the US religion reflects the whole gamut of political opinion — from Quakers, Unitarians and, to some extent Episcopalians, who support gay marriage, the right to choose etc. and oppose, for example, capital punishment and the invasion of Iraq. At the other end of the religious spectrum, there are fundamentalists who hold opposite beliefs. Our social scale already covers these political/social attitudes, whether or not the individual belongs to a religious organisation that reinforces them.More significant for our purposes is whether or not the individual believes in mystical determinants of fate, hence the astrology proposition. There is a psychological linkage between determinism and authoritarianism. The astrology believer may hold very liberal social views in other areas, but this does not alter this more authoritarian aspect within his or her cluster of attitudes. top It’s true that a one party state has a significant advantage; even so I wouldn’t support it. So how can I respond? From classical Greece onwards, discussion and, inevitably, argument, has been viewed by democrats as essential for considering all viewpoints and consequently reaching the best informed and most representative decision. For such people, the replacement of polemics with speedy dictates would definitely not be seen as any sort of “significant advantage” or “progress”. top Does “our race has many superior qualities” refer to the human race or my particular race? “Race” can only refer to the human race or to one of its subdivisions. The proposition, in comparing one’s race with other races, can therefore only be referring to the latter. top The original intention of “An eye for an eye” was that the punishment should not exceed the crime That’s right, although it’s commonly used to argue for the punishment being as severe as the crime. In any case, it means treating offenders as they have treated their victims; no more harshly, in the case of the original stricture, and just as harshly in the retributive sense. Either way, the proposition remains unambiguous in its call for punishment that approximates the crime. top The Political Compass Definitions There have to be other measures for a political compass Great. Tell us about them so that we can consider adding them. But surely our two axis arrangement is a vast improvement on the single one that you’ve put up with for more than 2 centuries. top You can’t be libertarian and left wing This is almost exclusively an American response, overlooking the undoubtedly libertarian tradition of European anarcho-syndicalism. It was, after all, the important French anarchist thinker Proudhon who declared that property is theft.On the other side of the Atlantic, the likes of Emma Goldman were identified as libertarians long before the term was adopted by some economic rightwingers. And what about the libertarian collectives of the mid-late 1800s and 1960s?Americans like Noam Chomsky can claim the label “libertarian socialist” with the same validity that Milton Friedman can be considered a “libertarian capitalist”.The assumption that economic deregulation inevitably delivers more social freedom is flawed. The welfare states of, for example, the Nordic region, abolished capital punishment decades ago and are at the forefront of progressive legislation for women, gays and ethnic minorities — not to mention anti-censorship. Such established high-tax social democracies consistently score highest in the widely respected Freedom House annual survey on democratic rank. For example, in this highly respected annual index on global democracy https://en.wikipedia.org/wiki/Democracy_Index the Nordic states consistently rate far higher than comparatively free markets such as The United States and Singapore.Despite their higher taxes, the social democracies’ degree of social freedoms would presumably be envied by genuine libertarians in more socially conservative countries.Our point is that a regulated economy and a strong public sector are not necessarily authoritarian, and a deregulated economy with a minimal public sector is not necessarily socially libertarian. Interestingly, many economic libertarians express to us their support for or indifference towards capital punishment; yet the execution of certain citizens is a far stronger assertion of state power than taxation. The death penalty is practised in all seriously authoritarian states. In Eastern Europe it was abolished with the fall of communism and adoption of democracy. The United States is the only western democracy where capital punishment is still practised. top Where are the right-wing social libertarians on the international chart? It’s a good question, and we’d like to include some, but we haven’t found any among the biggest internationally-known players. It’s important to remember, though, that within each quadrant there are still very sizeable variables. Some figures on the right of the chart are only of a modest authoritarian tendency. top Why is Hitler slightly right? The Nazis were socialists, so they weren’t fascists either. Let’s start with the second part first. Some respondents confuse Nazism, a political party platform, with fascism, which is a particular structure of government. Fascism legally sanctions the persecution of a particular group within the country — political, ethnic, religious — whatever. So within Nazism there are elements of fascism, as well as militarism, capitalism, socialism etc. To tar all socialis"
