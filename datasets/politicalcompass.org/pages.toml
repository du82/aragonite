title = "The Political Compass"
description = "some surprising quotes from iconic political figures"
full_description = '''Iconochasms We hope you're happy with the personalities that The Political Compass has placed you closest to, but how well do you really know the famous figures that you love or love to hate? This little wrap-up quiz offers some important facts that were barely, if ever, reported. It may raise your eyebrows and adjust the pedestals on which you placed some of your favourite icons. The chasm may be greater than you'd imagined. 1 ) Who said that a president under indictment and facing criminal trial would create an unprecedented constitutional crisis and cripple the operations of government? Donald Trump Nancy Pelosi Bill Gates Bernie Sanders Donald Trump, speaking on 3 November 2016, at a rally in North Carolina during his first presidential campaign. He was referring to his opponent, Hillary Clinton. 2 ) Who twice donated to Kamala Harris’ re-election campaign to be California’s Attorney-General? Sara Palin George W. Bush Donald Trump Bernie Sanders Donald Trump in 2014 3 ) Many unpunished perpetrators of Japan’s grisly medical experiments without anaesthetic returned to high-ranking civilian occupations, including … Governor of Tokyo Head of the Japan Olympic Committee President of the Japan Medical Association All of them All of them 4 ) Who wrote that a Jewish state would be small and petty, Orthodox and illiberal, and keep out non-Jews and Christians? Nathan Rothschild, former President of the Union of Synagogues in Britain Adolph Zukor, founder of Paramount Pictures Benjamin Disraeli, former Prime Minister of Britain Yehudi Menuhin, conductor and violinist Nathan Rothschild, in a 1903 letter to Theodor Herzl 5 ) Who described Hitler’s Mein Kampf as a wonderful book, with good ideas on education, health, propaganda, organisation etc? Theresa May Edmund Hillary Ernest Hemmingway Robert Baden-Powell Boy scout movement founder Robert Baden-Powell, in a 1939 diary entry. Although prevented by the war from accepting an invitation to visit the Third Reich, he continued to admire the values of both Hitler and Mussolini. 6 ) Who wrote the neoliberal program is not subject to democratic procedure; can’t be voted off anymore? Noam Chomsky Milton Friedman Bernie Sanders Hillary Clinton Milton Friedman 1990, in the Newsletter of the Mont Pelerin Society 7 ) Who said the primary responsibility of government and, therefore, the core of the US Constitution is to protect the minority of the opulent against the majority? James Madison Benedict Arnold Betsy Ross George Washington Founding father James Madison, at the Constitutional Convention June 26, 1787 8 ) Who in 2008 praised the Clintons as friends (and contributed to Hillary’s senatorial campaigns), describing her as a tough woman who would go down in history at a minimum as a great senator? Donald Trump Sarah Palin Ralph Nader Rudy Giuliani Donald Trump, in an interview with NY1 journalist Dominic Carter. 9 ) Which US president planned the $1 trillion modernisation of every nuclear weapon in the stockpile, as well as pursuing a new generation of nuclear armed submarines, new nuclear bomber aircraft and new land-based intercontinental ballistic missiles? Harry Truman Jimmy Carter Barack Obama Gerald Ford Nobel Peace Prize laureate, Barack Obama 10 ) Who wrote of the impeccable economic logic of dumping the West’s health-impairing toxic waste in under polluted Africa because the resultant cancers wouldn’t have time to develop in a population with such a low life expectancy? Lawrence Summers Ralph Nader Robert Redford Hillary Clinton Lawrence Summers, as Chief Econonomist for the World Bank, in a leaked memo, December 12,1991. Brazil’s Environment Minister, Jose Lutzenburger, wrote to Summers that his proposal was "perfectly logical but totally insane". Lutzenburger was fired for writing the letter. Summers went on to greater things, initially as Treasury Secretary in the final 18 months of the Clinton administration, and then as Barack Obama’s Chair of the National Economic Council. 11 ) Who wrote: When the Know-Nothings get control, it [the Declaration of Independence] will read: “All men are created equal except negroes, foreigners and Catholics.” When it comes to this I should prefer emigrating to some country where they make no pretense of loving liberty — to Russia, for instance, where despotism can be taken pure, and without the base alloy of hypocrisy Jerry Fallwell Abraham Lincoln John F. Kennedy Newt Gingrich Abraham Lincoln, letter to Joshua F Speed, August 24, 1855, from Albert J Menendez and Edd Doerr "The Great Quotations on Religious Freedom" 12 ) Who in 1997 championed the privatisation of California's National Oil Reserve, and the subsequent drilling by Occidental that resulted in serious environmental damage, destruction to a sacred Indian burial ground and a windfall for his family trust's Occidental stocks? (Occidental also put a pipeline through the Colombian rain forest.) Robert Redford Al Gore Ralph Nader David Cobb Al Gore, as US Vice President 13 ) Who described the UK’s decision to join the US invasion of Iraq as in the British national economic interest? Eric Hobsbawm David Hare Gordon Brown Glenda Jackson Gordon Brown in "The Scotsman", 4 May 2005 p.4 14 ) Who said I have a horrible feeling that we are sinking into a police state? George Churchill-Coleman, former head of Scotland Yard’s anti-terrorist squad William E.Colby, former Director of the C.I.A. Joe Clark, former Prime Minister of Canada Margaret Thatcher, former Prime Minister of the U.K George Churchill-Coleman on the U.K., reported in "The Guardian" January 28, 2005 15 ) Which US Republican president wrote this?Should any political party attempt to abolish social security, unemployment insurance, and eliminate labor laws and farm programs, you would not hear of that party again in our political history. There is a tiny splinter group, of course, that believes you can do these things. Among them are H. L. Hunt (you possibly know his background), a few other Texas oil millionaires, and an occasional politician or business man from other areas. Their number is negligible and they are stupid. Dwight D.Eisenhower Richard Nixon George Bush Snr Gerald Ford President Dwight D. Eisenhower, in a letter to his brother Edgar on November 8, 1954 16 ) Who, commenting on the deaths of more than half a million children, said I think that this is a very hard choice, but the price — we think the price is worth it? Yasser Arafat Madeleine Albright Pandit Nehru Ayotollah Kohmeini Madeleine Albright, as US Ambassador to the United Nations, on the 60 Minutes TV programme, 12 May, 1996 She was responding to the finding of a United Nations FAO report that 567000 Iraqi children under the age of five had died as a result of sanctions. Eight months later, Bill Clinton appointed her Secretary of State. 17 ) Who said that the introduction of nuclear power will both provide for the growing needs of Iran’s economy and free remaining oil reserves for export or conversion to petrochemicals? Henry Kissinger Dick Cheney Paul Wolfowitz Donald Rumsfeld Henry Kissinger, as Secretary of State in the Ford administration, 1976. Nevertheless the other three all held key national security posts in the same administration, which endorsed Iranian plans for a massive nuclear energy industry. Further, it encouraged a multi-billion dollar deal that would have allowed Iran control of enormous amounts of plutonium and enriched uranium. 18 ) Who signed legislation permitting doctors to remove the life support system of patients in a persistent vegetative state, regardless of the wishes of the family? George W.Bush Ronald Reagan Jesse Helms Jeb Bush George W.Bush, as Governor of Texas in 1999 19 ) Who (1) worked for Senator McCarthy during his red witch hunts and (2) permitted J.Edgar Hoover to wiretap Martin Luther King? J.K. Galbraith Robert Kennedy George McGovern Ted Kennedy Robert Kennedy (1) as McCarthy’s Junior Counsel and (2) as Attorney General 20 ) These so-called ill-treatments and torturing in concentration camps, stories of which were spread everywhere amongst the people, and particularly by detainees who were liberated by the occupying armies, were not, as assumed, inflicted methodically, but by individual leaders, sub-leaders, and men who laid violent hands on them.Who made that statement? John Ashcroft, referring to Abu Graib Donald Rumsfeld, referring to Guantanamo Bay Rudolf Höss, referring to Auschwitz Emperor Hirohito, referring to Manchuria Rudolf Höss, Commandant of Auschwitz until 1943, in his post-war testimony 21 ) Who proposed thatWhosoever shall be guilty of rape, polygamy, or sodomy with a man or woman, shall be punished; if a man, by castration, a woman, by boring through the cartilage of her nose a hole of one half inch in diameter at the least? Oliver Cromwell Thomas Jefferson Mao Zedong Christopher Columbus Thomas Jefferson, in the Virginia Bill number 64, 18 June 1779 22 ) Who held that spiritual characteristics are tied to skin colour and that non-white skin colour is a sign of spiritual defects that would be expunged in a future race war? Rudolf Hess Rudolf Steiner Rudolf Valentino Rudolf Nureyev Rudolf Steiner, in a lecture to an anthroposophist audience in Stuttgart, 1915. The lecture is in Die geistigen Hintergründe des Ersten Weltkrieges, Dornach 1974 pp30-54 23 ) Who saidShort of changing human nature, therefore, the only way to achieve a practical, livable peace in a world of competing nations is to take the profit out of war? Henry Kissinger Lyndon Johnson Richard Nixon Ronald Reagan Richard Nixon "Real Peace" 1983 24 ) Who wrote in 1928 thatIt may be shrewdly forecast that no man will exhibit dimensions of permanent greatness equal to Mussolini? The Vatican Ambassador to Germany The US Ambassador to Italy The Soviet Union Ambassador to the League of Nations The UK Ambassador to Italy US Ambassador to Italy, Richard Washburn Child, in his preface to Mussolini&rsquo;s autobiography 25 ) Immediately following the German invasion of the USSR, which future US President said the following?If we see that Germany is winning, we ought to help Russia, and if Russia is winning we ought to help Germany, and that way we let them kill as many as possible. Harry Truman Richard Nixon Jimmy Carter John Kennedy Harry Truman, New York Times, June 24 1941 26 ) Who said Every gun that is made, every warship launched, every rocket fired signifies, in the final sense, a theft from those who hunger and are not fed; those who are cold and are not clothed? Arnold Schwarzenegger Dwight D.Eisenhower John Major Jimmy Carter President Dwight D.Eisenhower, in "The Chance for Peace", a speech given to the American Society of Newspaper Editors on April 16 1953 27 ) Who said I do not find in our particular superstition of Christianity one redeeming feature … Millions of innocent men, women and children, since the introduction of Christianity, have been burned, tortured, fined and imprisoned. What has been the effect of this coercion?To make half the world fools and half hypocrites; to support roguery and error all over the world.? Hillary Clinton Thomas Edison Charles de Gaulle Thomas Jefferson Thomas Jefferson, in his "Notes on Virginia" 28 ) Who said Japan was already defeated … dropping the bomb was completely unnecessary. I thought that our country should avoid shocking world opinion by the use of a weapon whose employment was no longer necessary to save American lives? General Patton General Eisenhower General MacArthur Charles Lindberg General Dwight D.Eisenhower, in "The White House Years:Mandate for Change 1953-1956: A Personal Account" (1963) p.312-313 29 ) Who accepted the Grand Cross of the German Eagle — the highest medal that Nazi Germany could bestow on foreigners — in July 1938, four months after the German annexation of Austria? J. D. Rockefeller Henry Ford King Haakon VII of Norway Marlene Dietrich Henry Ford. (The following month a senior executive of General Motors, James Mooney, received a similar medal for his "distinguished services to the Reich") 30 ) With reference to Tiger Woods’ first Golf Masters win, who said there’ll be a spectacular increase in the number of black boys (and I do mean boys - teenagers) who begin to infest the public courses in America? O. J. Simpson Alistair Cooke Mel Gibson Naomi Klein Alistair Cooke in his BBC "Letter from America", May 2, 1997 31 ) Who presented Chairman Mao Zedong with a bouquet of poems that lavishly praised the Chinese leader as the timely rain to nourish the land? Nancy Reagan The Dalai Lama Pope John XXIII Robert Frost The Dalai Lama, on his first meeting with Mao in Beijing (then Peking) in 1954 32 ) Who blocked the marriage of his son and disowned him, commenting How can I, who has always advocated renunciation of sex, encourage you to gratify it?(The son subsequently became a homeless alcoholic.) Gautama Buddha Martin Luther King Albert Schweitzer Mahatma Gandhi Mahatma Gandhi, dealing with his son Harilal. 33 ) Which founding father said of the proposed American Constitution This is likely to be administered for a course of years and then end in despotism … when the people shall become so corrupted as to need despotic government, being incapable of any other ? Benjamin Franklin Alexander Hamilton Thomas Paine George Washington Benjamin Franklin in a speech to delegates to the US Constitutional Convention prior to the final vote, on 17 September 1787. 34 ) Who said The use of quantity of money as a target has not been a success. I’m not sure that I would as of today push it as hard as I once did.? Margaret Thatcher Milton Friedman Ludwig von Mises Friedrich Hayek Milton Friedman in Financial Times (UK) June 7, 2003 35 ) Who said of Saddam Hussein He has not developed any significant capability with respect to weapons of mass destruction. He is unable to project conventional power against his neighbours ? Colin Powell Donald Rumsfeld Dick Cheney Bill Clinton Colin Powell in February 2001 36 ) Who said of containment against Saddam Hussein We are able to keep arms from him. His military forces have not been rebuilt? Richard Perle John Bolton Paul Wolfovitz Condoleezza Rice Condoleezza Rice in July 2001 37 ) Who said: I do not consider Hitler to be as bad as he is depicted. He is showing an ability that is amazing and seems to be gaining his victories without much bloodshed? Winston Churchill Albert Einstein Mahatma Gandhi George Orwell Mahatma Gandhi, May 1940 38 ) Who said: I am strongly in favour of using poisonous gas against uncivilised tribes … to spread a lively terror ? Albert Schweizer Winston Churchill Princess Diana Ch&eacute; Guevara Winston Churchill, writing as President of the Air Council, in 1919 39 ) Who granted several audiences to, and received a donation of more than $1 million from Shoko Asahara, leader of the Supreme Truth cult of Japan, and spreader of sarin gas in the Tokyo subway? The Dalai Lama Pope John Paul II George Carey, as '''
