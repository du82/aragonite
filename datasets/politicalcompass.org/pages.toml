full_description = "The Canadian Party Political Compass In response to many requests from Canadian visitors, we’re pleased to produce this chart. Please also see our Canadian charts for 2008 and 2011 Yes, we know that there are smaller parties that some of you would have liked us to include, and individual politicians whose positions would be nice to have up there as well. There may be other additions in due course. We do what we can with our advertising-free and free-to access site. Should we secure a Canadian sponsor, we can, of course, produce further interesting charts. We’d like to thank those Canadians who generously gave their time to assist our research. Bloc Québécois presented us with a real challenge, since it is primarily a single-goal party promoting Québec independence. As such, it attracts members from all quadrants of The Political Compass who often have little else in common."
