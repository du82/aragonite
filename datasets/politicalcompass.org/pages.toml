["https://politicalcompass.org/france2017"]
title = "The Political Compass"
description = "The Political Compass: a 2-dimensional typology of political opinions"
full_description = "French General Election 2017 THE FIRST ROUND AFTERMATH 24 April 2017 Reporting on the election has often been characterised by muddled political terminology. The Political Compass has long pointed out that left and right essentially describe economics. Macron, for example, is regularly reported as being economically ‘liberal’ and socially ‘left wing’. In reality, Macron is a classic libertarian in the US sense, with a socially liberal outlook and, crucially, an extreme right wing (ie neoliberal) economic agenda. This mix appeals to a significant section of younger voters who, being steadfastly pro-business, dislike most forms of state engagement in either the economy or society in general. He‘s certainly the closest of the candidates to Social Darwinism. Le Pen is similarly misrepresented as ‘extreme right wing’. Her extemism is in her social attitudes, not her economics. Indeed France’s National Front has often been economically to the left of the pre-Hamon Socialist Party in its attachment to the public sector and opposition to globalisation and privatisation. The party, with its strong strain of nationalism, might well be described as a form of national socialism. Fillon, unlike Macron, marries conservative social policies with neoliberal economics; but this most establishment of the candidates is dogged with an undignified judicial enquiry that undermines his moral authority. Hamon’s attempts to portray himself as different from the market-friendly Hollande Socialist Party may not convince a sufficient number of its disappointed core supporters. Mélenchon’s unpredicted surge in support reflects his appeal as an anti-establishment candidate of the uncompromising left at a time when the political establishment — and neoliberalism — are widely disliked. However, he cut France’s left-wing voters adrift by refusing an alliance with Hamon which, according to the results, would have meant a Socialist government after the first round. Mélenchon must have noted the pre-election opinion polls indicating this strong possibility, yet he apparently preferred a Macron or Le Pen government to one which saw him in dominant alliance with the Socialist Party. His baffling decision has eliminated the possibility of an anti-neoliberal (ie anti-globalisation) government with liberal social policies. Now French voters face a choice of a pro-globalisation government with liberal social policies (Macron) or an anti-globalisation government with illiberal social policies (Le Pen). Since Le Pen’s economic attitudes are far closer to socialism than Macron’s, a significant number of dismayed, and inevitably angry, former Mélenchon supporters will hold their noses, vote Front National … and perhaps not admit it. L’après premier tour Parler d’une élection implique souvent l’emploi d’une terminologie obscure ou imprécise. The Political Compass considère depuis longtemps que les termes «gauche» et «droite» décrivent principalement des positions relatives à l’économie. Ainsi, Emmanuel Macron est généralement considéré comme libéral économiquement et plus à gauche socialement. En réalité, Macron est plus un libertaire au sens nord-américain du terme, avec un point de vue social libéral, mais surtout un agenda économique d’extrême-droite, de type néo-libéral. Ce mélange plaît à de nombreux jeunes électeurs, favorables au monde de l’entreprise et à un désengagement de l’état dans les domaines de l’économie en particulier et de la société en général. De tous les candidats, il est certainement le plus proche du darwinisme social. Marine Le Pen est également représentée à tort comme «d’extrême-droite»: Son extrémisme réside dans sa vision de la société, pas dans sa vision de l’économie. En effet, le Front National a souvent été plus à gauche que le Parti Socialiste traditionnel, de par son attachement au secteur public et son opposition à la mondialisation et aux privatisations. Le FN, avec sa longue tradition de nationalisme, pourrait être décrit comme une variante du national-socialisme. François Fillon, à la différence de Macron, proposait d’allier politique sociale conservatrice et vision néo-libérale de l’économie. Cependant, le scandale de sa mise en examen a miné la candidature de ce représentant de l’establishment, et a déstabilisé son autorité morale. Il n’a pas passé le premier tour. Les tentatives de Benoît Hamon de se démarquer d’un Parti Socialiste qui a accepté les lois du marché sous François Hollande n’ont pas suffisamment convaincu un électorat de gauche traditionnel déçu. Le nombre surprenamment croissant des soutiens à Jean-Luc Mélenchon a montré l’attrait de son statut de candidat de gauche antisystème et sans compromis, à un moment où l’élite politique et le néo-libéralisme sont largement impopulaires. Toutefois, il a désorienté l’électorat de gauche en refusant l’alliance avec Hamon ce qui, au vu des résultats, aurait donné un gouvernement socialiste après le premier tour. Mélenchon avait probablement remarqué cette forte possibilité grâce aux sondages, mais a pourtant préféré le risque d’un gouvernement Macron out Le Pen plutôt que de créer une coalition avec le PS. Cette décision déroutante a éliminé toute possibilité de gouvernement économiquement anti néo-libéral (c’est à dire anti-mondialisation) avec une politique sociale libérale. A présent, les électeurs français font face à une alternative entre un gouvernement pro-mondialisation avec une politique sociale libéral (Macron) ou anti-mondialisation avec une politique sociale oppressive (Le Pen). Étant donné que la position de Le Pen sur L’économie est bien plus proche du Socialisme que celle de Macron, un nombre conséquent d’électeurs de Mélenchon, consternés et en colère, se boucheront le nez et voteront Front National … en refusant peut-être de le reconnaître. Our grateful thanks for the translation to Antoine Kubler IB French & Drama teacher In the event of apparent policy shifts, the position of candidates on our chart will correspondingly alter."
