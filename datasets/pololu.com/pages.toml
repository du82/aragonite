["https://pololu.com/blog/28"]
title = "Pololu - Ten years in Las Vegas"
description = "Starting with the move from our dorm to an apartment in Watertown, Massachusetts, Pololu has moved or expanded ten times.  The most significant was our move to Las Vegas, which represented a commitment to doing this thing for real.  This past Sunday was the 10-year anniversary of arriving in Las Vegas, so I figured I should commemorate it by putting up some old pictures."
full_description = "Starting with the move from our dorm to an apartment in Watertown, Massachusetts, Pololu has moved or expanded ten times. The most significant was our move to Las Vegas, which represented a commitment to doing this thing for real. This past Sunday was the 10-year anniversary of arriving in Las Vegas, so I figured I should commemorate it by putting up some old pictures. Back then, Pololu was basically Candice and me, with some occasional remote help from Paul, who had not had enough of school yet. None of us had any connection to Las Vegas, but we wanted to avoid the cold, natural disasters, and oppressive government. With the added benefit of cheap housing, Las Vegas seemed like an easy place to at least try out. So, at the end of May 2002, we sold most of our stuff, mailed several boxes of stuff to an apartment we had found online, and crammed the rest of our stuff into a small Honda hatchback for a four-day drive across most of the continent. We actually fit quite a bit of stuff into that car, though having the passenger seat as far forward as possible made the trip rather uncomfortable. Note the soldering iron and power supply in the foreground. We kept track of which states we shipped orders to. (We had a world map for tracking countries, too.) At the end of 2002, we moved to a house; we ran Pololu out of it for all of 2003. We got our first laser cutter in 2003 and had it running out of the kitchen with the exhaust duct blowing into the back yard. Unfortunately, I can’t find a picture of that or much else from 2003. By late 2003, it became clear that we had to move to a commercial space. First, we apparently were not allowed to have employees in our house, and second, we needed a space in which we could better run electronics production equipment. Our first commercial space, which we moved to in early 2004, was a little under 1,500 square feet, split about evenly between one big office space and a warehouse. Soon after we moved there, we started holding LVBots meetings at our office, which we still do today."
year_published = 2012
