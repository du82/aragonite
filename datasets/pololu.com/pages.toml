full_description = 'The Romi chassis is a differential-drive mobile robot platform with a diameter of 6.5″ (165 mm). The plastic components making up the chassis are available in six colors, either individually or in kits including motors and battery contacts. Control electronics and quadrature encoders are also available. This 5" chassis is a round piece of 1/8″ acrylic with cutouts for building a differential-drive robot chassis based on our micro metal gearmotors and 42×19mm wheels. The chassis comes in a variety of colors. The Pololu round robot chassis is a compact 5-inch base, laser-cut out of colored acrylic, designed for use with Tamiya twin-motor gearbox, ball caster, and truck tires. The Pololu RP5/Rover 5 expansion plates are cut from 1/8″ acrylic in a variety of colors and make it easy to mount components on the Rover 5 tracked chassis. They can also be used without a chassis as universal mounting plates for your project electronics. This kit gives you the structural pieces you need to build your own 3pi+ robot. The chassis includes an integrated ball caster and battery holder for four AAA cells, a pair of 32×7 mm wheels with silicone tires, a bumper skirt, and motor clips that can be used to hold in the gear motors for operation without the bumper skirt. The chassis is designed to work with our Micro Metal Gearmotors, and you can add a 3pi+ 2040 Control Board or 3pi+ 32U4 Control Board or your own electronics to complete your robot. Motors and electronics are not included. This kit gives you the structural pieces you need to build your own Balboa chassis with stability conversion. The chassis includes an integrated battery holder that can be configured for 4 or 6 AA cells. Two configurable gearboxes further increase the gear ratio from the required micro metal gearmotors while supporting the weight of the robot with ball bearings rather than the gearmotor shafts themselves. The chassis works with a variety of wheel sizes and micro metal gearmotors, so wheels and motors are not included; choose your own wheels and motors to personalize your robot. Unlike the Balboa 32U4 Balancing Robot Kit, no electronics are included: this chassis is for those who want to supply their own custom electronics.'
