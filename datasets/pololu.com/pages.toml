description = """
Balboa 32U4 Balancing Robot Kit (No Motors or Wheels)


Build your very own programmable balancing robot with the Balboa 32U4 robot kit!  The Balboa control board features an Arduino-compatible ATmega32U4 MCU, motor drivers, quadrature encoders, and a full IMU.  This board also has the ability to interface with a Raspberry Pi, making the foundation for a complete Raspberry Pi-controlled balancing robot.  Motors and wheels are not included: choose your wheels and motors to personalize your robot."""
full_description = "Build your very own programmable balancing robot with the Balboa 32U4 robot kit! The Balboa control board features an Arduino-compatible ATmega32U4 MCU, motor drivers, quadrature encoders, and a full IMU. This board also has the ability to interface with a Raspberry Pi, making the foundation for a complete Raspberry Pi-controlled balancing robot. Motors and wheels are not included: choose your wheels and motors to personalize your robot. With this accessory kit, you can convert your balancing Balboa chassis into a traditional differential-drive platform with a low-friction ball caster providing a stabilizing third point of contact. The included ball caster pieces are held in place by a removable retention clip, and the whole assembly conveniently snaps onto the front/top edge of the Balboa chassis. This kit is also useful in balancing applications, where the ball caster can be left off and the extension piece can be used to make the Balboa taller and give it more mounting points. The parts for this kit are already included in the Balboa Chassis with Stability Conversion Kit. This accessory kit for the Balboa Chassis can be used for a variety of different applications, from a bumper cage for protecting your electronics to skids on which it can drive around to arms that you can mount sensors on. The parts for this kit are already included with the Balboa 32U4 Balancing Robot Kit. This kit gives you the structural pieces you need to build your own Balboa chassis with stability conversion. The chassis includes an integrated battery holder that can be configured for 4 or 6 AA cells. Two configurable gearboxes further increase the gear ratio from the required micro metal gearmotors while supporting the weight of the robot with ball bearings rather than the gearmotor shafts themselves. The chassis works with a variety of wheel sizes and micro metal gearmotors, so wheels and motors are not included; choose your own wheels and motors to personalize your robot. Unlike the Balboa 32U4 Balancing Robot Kit, no electronics are included: this chassis is for those who want to supply their own custom electronics."
