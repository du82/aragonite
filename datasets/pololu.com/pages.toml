full_description = "The Pololu RC switches make it easy to turn devices on and off with a standard hobby radio control (RC) system. Several versions are available, ranging from one with a simple digital output to modules with integrated MOSFETs, relays, or multiplexers. This tiny logic level shifter features four bi-directional channels, allowing for safe and easy communication between devices operating at different logic levels. It can convert signals as low as 1.5 V to as high as 18 V and vice versa, and its four channels are enough to support most common bidirectional and unidirectional digital interfaces, including I²C, SPI, and asynchronous TTL serial. This USB-to-serial adapter lets you easily connect a TTL serial device to a PC by acting as a virtual serial port. The board is a Micro-USB carrier for the Silicon Labs CP2102N USB-to-UART bridge that provides access to all of its control signal pins and GPIO pins. The Pololu USB-to-serial adapter is a tiny unit that makes it easy to connect a microcontroller project to a PC. You can connect the adapter directly to a microcontroller without an RS-232-to-TTL level converter. It is USB 2.0-compatible and will work with your existing programs that interface with a serial port. This deluxe serial port adapter (RS-232 adapter) to convert logic-level signals to the higher voltages required for RS-232 and similar serial ports. Unlike competing units, the Pololu serial adapter operates over a 3-5.5 V supply range and gives you access to all eight of the signal lines available on a DB9 connector, including five transmit lines and three receive lines. This item is the partial kit version of the 23201a serial adapter. All surface-mount components are assembled; the 0.1″ breakaway male header strip and DB9 connector are included but not soldered. This screw terminal breakout adapter for a DB15 (sometimes also called DA-15) connector is designed to work with the MCP233, MCP236, MCP263, and MCP266 Advanced Motor Controllers. It can also be used as a generic breakout board for other hardware that uses the same connector, like old computer joysticks or MIDI devices."
