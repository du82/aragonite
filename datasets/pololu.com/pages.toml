["https://pololu.com/blog/engage-your-brain"]
title = "Pololu - Engage Your Brain"
description = "Pololu is your source for robot kits, robot parts, robot electronics, and custom manufacturing services, including custom laser cutting and mylar solder paste stencils for SMT soldering."
full_description = "This is the fifth post in a series documenting the installation and first year of operation of Pololu’s 305 kW solar array. Here are the previous posts: In this final post in the series, I will go over the costs and benefits of our solar system, some lessons learned, and my thoughts on whether this has all been worth it. Continued… This is the fourth post in a series documenting the installation and first year of operation of Pololu’s 305 kW solar array. Here are the previous posts: In this post, we will look at how our solar installation affected our electricity bills. Because operations were so dramatically altered by the pandemic starting in 2020, we have to go back to 2019 for the best baseline for electricity consumption and cost. To maximize the scientific rigor of our observations, we changed as many variables as possible since then, including: Continued… We just released several small reverse voltage protection and ideal diode boards that can protect your projects from reverse voltage application. We have reverse-voltage protection built into many of our products, and we usually implement it using a P-channel MOSFET, like this: This approach is usually more efficient than just using a diode since the MOSFET has a lower voltage drop across it. However, P-channel MOSFETs have worse on-resistances than N-channel MOSFETs of similar prices and sizes. This has not mattered much for our lower-powered products, but that limitation is becoming more apparent as we are developing more products with maximum operating voltages over 40 V. The next common MOSFET voltage above 40 V is 60 V, and at that voltage and with currents above around 10 A, it starts becoming more size-efficient to use an N-channel MOSFET plus an extra chip to manage the additional complexities of controlling the N-channel MOSFET in this kind of application. This is how that circuit looks: Since we are planning on using this approach on several new products, we decided to make standalone product versions as well. Here are how the first products look, using 3×3 mm MOSFETs:"
