["https://pololu.com/blog"]
title = "Pololu Blog"
description = "Pololu is your source for robot kits, robot parts, robot electronics, and custom manufacturing services, including custom laser cutting and mylar solder paste stencils for SMT soldering."
full_description = "Welcome to the Pololu Blog, where we provide updates about what we and our customers are doing and thinking about. This blog used to be Pololu president Jan Malášek’s Engage Your Brain blog; you can view just those posts here. We are excited to announce the release of two new higher-power reverse voltage protectors that can handle up to around 25 A continuous while protecting your 4V–60V circuit from accidental destruction from reverse voltage: These boards feature larger 5×6mm MOSFETs with lower on-resistances and more than double the current carrying ability of the versions we released a few months ago, which makes the overall module larger (but still compact!): With these new releases, we now have six total reverse protector options (with or without reverse current blocking in three different power levels): Introductory special discount! Use coupon code RVP25INTRO to get these new reverse voltage protectors for just $2.95! I am happy to introduce our first isolated power module, which we expect to kick off a new category of electrical isolation products (note that the many current sensors we carry also feature isolation from the sense side to the control side, but that isolation is part of their more dedicated current-sensing functionality). Many of our products are modules like motor controllers and regulator boards, and connecting several of them together in real-world settings can lead to unexpected problems from connecting all the grounds together. For example, your computer’s USB port can be a convenient source of 5 V, but the negative or ground side of that 5 V will likely be connected to the ground pin of the computer’s power cable and therefore to the ground side of everything else you have plugged into the wall. This can lead to unexpected problems as you build up your system, usually without thinking about your house being part of your circuit. There are more and more solutions for effectively moving power and signals without having an electrical connection, so we will be working on adding those into our more integrated products, and we will be adding to our isolation module portfolio to support our customers with the building blocks to make safer and more reliable systems themselves."
