description = "The A-Star 328PB Micro is a tiny programmable module based on the ATmega328PB AVR microcontroller. It features 24 digital I/O pins (of which 9 can be used as PWM outputs and 8 as analog inputs) on a board measuring only 1.3″ × 0.7″ and ships preloaded with an Arduino-compatible serial bootloader.  5 V and 3.3 V versions are available in several clock speeds."
full_description = "The A-Star 328PB Micro is a tiny programmable module based on the ATmega328PB AVR microcontroller. It features 24 digital I/O pins (of which 9 can be used as PWM outputs and 8 as analog inputs) on a board measuring only 1.3″ × 0.7″ and ships preloaded with an Arduino-compatible serial bootloader. 5 V and 3.3 V versions are available in several clock speeds. These compact 1.9″ × 0.7″ microcontroller boards are based on the ATmega32U4 AVR MCU. They feature efficient switching regulators for operation over a variety of voltage ranges, and all 26 of the MCU’s I/O pins are broken out. A MicroUSB interface and a preloaded Arduino-compatible bootloader make loading programs easier. These microcontroller boards are based on the ATmega32U4 AVR MCU and arranged in the common Arduino form factor. They offer many additional features and improvements over competing products, including superior power management. These Arduino-compatible programmable modules are designed to be the core of a small robot, either as an auxiliary controller atop a Raspberry Pi base or as complete control solutions on their own. On-board hardware includes dual motor drivers, an efficient voltage regulator, and level shifters for communication with a Raspberry Pi. The A-Star 32U4 Micro is a tiny programmable module featuring the ATmega32U4 AVR microcontroller. It packs a Micro-USB interface and 18 digital input/output pins (of which 6 are available to be used as PWM outputs and 8 as analog inputs) onto a board measuring only 1″ × 0.6″ and ships preloaded with an Arduino-compatible bootloader."
