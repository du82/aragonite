title = "Pololu - Voltage Regulators"
description = "Switching buck converters reduce an input voltage to a lower, regulated voltage much more efficiently than linear regulators."
full_description = "Switching buck converters reduce an input voltage to a lower, regulated voltage much more efficiently than linear regulators. Buck-boost and SEPIC converters work with input voltages that are higher than, equal to, or lower than the regulated output voltage, making them especially well-suited for battery-powered applications in which the battery voltage begins above the desired output voltage and drops below the target as the battery discharges. These shunt regulators can protect power supplies from voltage spikes generated by motor controllers they are connected to. This tiny voltage inverter generates a negative output voltage corresponding to the voltage provided on its input, which can be from 1.8 V to 5.3 V. The compact (0.3″ × 0.35″) module has a typical efficiency of over 80% and can deliver up to 60 mA continuously."
