["https://pololu.com/blog/community-projects"]
title = "Pololu - Posts tagged “community projects”"
description = "Pololu is your source for robot kits, robot parts, robot electronics, and custom manufacturing services, including custom laser cutting and mylar solder paste stencils for SMT soldering."
full_description = "You are currently viewing a selection of posts from the Pololu Blog. You can also view all the posts. Electrical engineer and content creator Dave Crabbe recently released a video demonstrating his use of our pushbutton power switch to control power to his ESP32 remote-controlled toy dump truck. He has an open-source, custom-designed PCB for the electronics, and the Gerber files and schematic are linked from the video description. If you like Dave’s content, be sure to subscribe to his YouTube channel so you don’t miss his latest videos. This hypnotic video from customer Alain Haerri shows Kinetic Little Rain, a moving sculpture that was inspired by the sculpture Kinetic Rain in the Changi Airport in Singapore. Alain’s sculpture features 100 blown glass drops that are moved by stepper motors. Each motor is driven by its own Tic T500 Stepper Motor Controller and the whole setup is controlled by an Arduino Mega 2560. 50:1 scale model of the James Web Space Telescope model with laser-cut and etched gold-mirror acrylic and gold-mirror styrene parts. Retired aerospace engineer Robert Maier shared with us this awesome 50:1 scale model of the James Webb Space Telescope (JWST) he made with his brother Mark and a little help from our custom laser cutting service. We cut the JWST’s main mirrors for him out of 1.5 mm gold mirrored styrene sheets from Midwest Products, and the hexagon patterns were laser etched onto the surface. He also had us laser cut various silicone bands to hold the moving pieces of the structure as the model folds/unfolds. We more commonly work with 3 mm mirrored acrylic, but the model’s mirror required something thinner, and the more expensive styrene was perfect for the job. For comparison, the spiral label sitting beneath the figurine’s feet was cut from gold mirror acrylic. Mark uses the model in the Astronomy 101 classes he teaches at San Jacinto College in Southern California. He recently wrote an article about the model, which is published in the April 2023 issue of Sky and Telescope magazine (it’s on page six). Additional photos of the model are included below, and even if you’re not a subscriber to the magazine, you can preview the article online."
