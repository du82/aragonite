["https://pololu.com/category/120/stepper-motor-drivers"]
title = "Pololu - Stepper Motor Drivers"
description = "These carrier boards for TI’s DRV8434x bipolar stepper motor drivers feature adjustable current limiting and 11 microstep resolutions (down to 1/256-step).  They operate from 4.5 V to 48 V and can deliver approximately 1.2 A continuous per phase (2 A peak). Several versions are available with options like integrated stall detection and SPI control."
full_description = "These carrier boards for TI’s DRV8434x bipolar stepper motor drivers feature adjustable current limiting and 11 microstep resolutions (down to 1/256-step). They operate from 4.5 V to 48 V and can deliver approximately 1.2 A continuous per phase (2 A peak). Several versions are available with options like integrated stall detection and SPI control. These carrier boards for Toshiba’s TB67S2x9FTG bipolar stepper motor drivers feature adjustable current limiting, adaptive gain control technology, seven microstep resolutions (down to 1/32-step), and more. They operate from 10 V to 47 V and can deliver approximately 1.2 A or 1.7 A phase without a heat sink (depending on the version). These carrier boards for the MPS MP6500 bipolar stepper motor driver feature adjustable current limiting, over-current and over-temperature protection, and four microstep resolutions (down to 1/8-step). They operate from 4.5 V to 35 V and can deliver approximately 1.5 A per phase without a heat sink (driver is rated for up to 2.5 A per coil). These carrier boards for TI’s DRV8825 bipolar stepper motor driver feature adjustable current limiting, over-current and over-temperature protection, and six microstep resolutions (down to 1/32-step). They operate from 8.2 V to 45 V and can deliver approximately 1.5 A per phase without a heat sink (they are rated for up to 2.2 A per coil). These carrier boards for Allegro’s A5984 stepper motor drivers are great low-cost solutions for controlling bipolar stepper motors. They operate from 8 V to 40 V and can deliver up to 1.2 A continuous per phase (2 A peak). Fixed and adjustable current limit versions are available. These Black Edition drivers are higher-performance drop-in replacements for the original A4988 stepper motor driver carrier. They feature a four-layer PCB for better thermal performance, allowing the A4988 microstepping bipolar stepper motor driver to deliver approximately 20% more current than our two-layer version. These carrier boards for Allegro’s A4988 bipolar stepper motor driver feature adjustable current limiting, over-current and over-temperature protection, and five microstep resolutions (down to 1/16-step). They operate from 8 V to 35 V and can deliver approximately 1 A per phase without a heat sink (they are rated for up to 2 A per coil)."
