DC from input voltages of 100 – 240 VAC. It includes a 1.5 m (5 ft) AC power cord terminated by a three-prong, US-style plug and has a 1.5 m (5 ft) DC power cord that is terminated by a center-positive, 5.5 × 2.1 mm barrel connector."
