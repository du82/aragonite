full_description = "The Pololu A-Star microcontroller boards are general-purpose programmable modules based on Atmel AVR microcontrollers. A USB interface and preloaded Arduino-compatible bootloader on each A* makes it easy to get started programming them. This versatile, high-performance mobile platform has a diameter of just 9.7 cm (3.8″), small enough to fit in the palm of your hand. It is based on the Arduino-compatible ATmega32U4 MCU and its features include dual quadrature encoders, line sensors, front bump sensors, a full IMU, and a graphical OLED display. The highly integrated Zumo 32U4 OLED improves upon the original Zumo 32U4 by adding a 128×64 graphical OLED display. Other key features include a built-in Arduino-compatible ATmega32U4 MCU, encoders for closed-loop motor control, and proximity sensors for obstacle detection. The Zumo robot for Arduino includes the basic mechanical parts and electronics to build an Arduino-controlled robot. An Arduino-compatible controller is not included, and this version does not have as many integrated sensors as the Zumo 32U4/2040 robot. This category includes the Balboa 32U4 Balancing Robot Kit, which includes control electronics, and Balboa Chassis Kit, which lets you supply your own electronics. Here you can also find Balboa accessories and the most recommended motors and wheels to complete the kits. The Romi chassis is a differential-drive mobile robot platform with a diameter of 6.5″ (165 mm). The plastic components making up the chassis are available in six colors, either individually or in kits including motors and battery contacts. Control electronics and quadrature encoders are also available. The Arduino Micro is essentially a shrunk-down (1.9″ × 0.7″) version of the Arduino Leonardo: it is a microcontroller board based on the ATmega32U4 running at 16 MHz with 24 digital input/output pins (of which 7 can be used as PWM outputs and 12 as analog inputs). This board ships with the male header pins soldered in, as shown in the product picture."
