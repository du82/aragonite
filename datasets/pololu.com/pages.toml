description = "These plastic wheels are designed for use with 3 mm D-shafts, and many can be combined with our mounting hubs for use with larger shafts.  They are available in a variety of sizes and colors."
full_description = "These plastic wheels are designed for use with 3 mm D-shafts, and many can be combined with our mounting hubs for use with larger shafts. They are available in a variety of sizes and colors. A selection of plastic wheels in a variety of sizes for use with RC servos. Many can be combined with our mounting hubs for use with larger shafts. These polyurethane scooter/inline skate wheels can be connected to an assortment of motors through our scooter wheel adapters, offering a robust drive solution for medium-sized robots. These versatile black plastic wheels have silicone tires and measure 80 mm (3.15″) in diameter. What makes them special is the included set of interchangeable collets that can be inserted into the wheel to firmly grab four different shaft types: 3mm D, 3mm round, 4mm D, and 4mm round. The collet inserts start with a comfortably loose fit on their intended shafts, and unlike simple press-fit wheels, their grip on the shaft gets progressively tighter as they are compressed into the wheel disc, reducing the chances that the shaft will be able to slip within the wheel. This product is a pair of wheels. These versatile white plastic wheels have silicone tires and measure 80 mm (3.15″) in diameter. What makes them special is the included set of interchangeable collets that can be inserted into the wheel to firmly grab four different shaft types: 3mm D, 3mm round, 4mm D, and 4mm round. The collet inserts start with a comfortably loose fit on their intended shafts, and unlike simple press-fit wheels, their grip on the shaft gets progressively tighter as they are compressed into the wheel disc, reducing the chances that the shaft will be able to slip within the wheel. This product is a pair of wheels. The RW2i rubber wheel features an internal set screw ideal for designs with space constraints. The 1.1-inch diameter wheel by Solarbotics is made for 3 mm diameter output shafts. These wheels are sold individually, NOT in pairs. The Solarbotics RW2 is a 1.1-inch diameter rubber wheel for 3 mm diameter output shafts. These wheels are sold individually, NOT in pairs."
