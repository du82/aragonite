["https://pololu.com/category/150/raspberry-pi"]
title = "Pololu - Raspberry Pi"
description = "Raspberry Pi products include credit card-sized computers with Arm processors that can run Linux, along with the RP2040 Arm microcontroller as featured on the Raspberry Pi Pico. We have a number of products that are designed to work with Raspberry Pi single-board computers or integrate an RP2040 microcontroller."
full_description = "This versatile, high-performance mobile platform has a diameter of just 9.7 cm (3.8″), small enough to fit in the palm of your hand. It is based on the Raspberry Pi RP2040 MCU and its features include dual quadrature encoders, line sensors, front bump sensors, a full IMU, six RBG LEDs, and a graphical OLED display. This high-performance tracked robot measures less than 10×10 cm, small enough to qualify for Mini Sumo. It is based on the Raspberry Pi RP2040 MCU and its features include metal gearmotors w/ quadrature encoders, proximity sensors, line sensors, a full IMU, six RBG LEDs, and a graphical OLED display. This UL-listed 12.9 W, “wall wart”-style switching power adapter supplies up to 2.5 A at a regulated 5.15 VDC. It is intended for use with 5 V USB devices, and it has been specifically designed to supply slightly more than 5 V to help ensure that the device it is powering receives close to 5 V even when the current draw is high. The AC adapter works with input voltages of 100-240 VAC and has a 1.5 m (5 ft) DC power cord that is terminated by a USB micro-B connector. This extra-tall stackable 40-pin female header features two rows of 20 pins spaced with a 0.1″ (2.54 mm) pitch. It includes three 0.1″-thick spacers for additional clearance, and the extended pins allow multiple units to be stacked as popularized on Arduino shields. The 2×20 size is notably used on the Raspberry Pi Models A+ and B+, and the extra 0.3″ of height allows for stacked boards to clear all of the components on the Raspberry Pi B+. These hexagonal male-female aluminum standoffs are intended specifically for use with the Raspberry Pi. They keep parts spaced 18.6 mm apart, which is just the right height for mounting expansion boards with extra-tall female headers, and they have 6mm-long M2.5 threads that are just the right size for the Raspberry Pi’s mounting holes. These standoffs are sold in packs of 4. This stackable 40-pin female header features two rows of 20 pins spaced with a 0.1″ (2.54 mm) pitch. The extended pins allow multiple units to be stacked as popularized on Arduino shields. The 2×20 size is notably used on the Raspberry Pi Models A+ and B+ as well as the Raspberry Pi 2 Model B."
