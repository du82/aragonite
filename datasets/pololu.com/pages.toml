description = "These 0.1″ (2.54 mm) female header strips are commonly used as low-cost connectors for custom-made cables or perforated prototyping PCBs.  The standard spacing is the same as on most solderless breadboards and matches 0.1″ male header strips.  Straight and right-angle versions are available."
full_description = 'These 0.1″ (2.54 mm) female header strips are commonly used as low-cost connectors for custom-made cables or perforated prototyping PCBs. The standard spacing is the same as on most solderless breadboards and matches 0.1″ male header strips. Straight and right-angle versions are available. These 0.1″ (2.54 mm) male header pins are commonly used as low-cost connectors for perforated prototyping PCBs. The standard spacing is the same as on most solderless breadboards and matches standard 0.1″-pitch female connectors. Stranded 26 AWG wires with male or female connectors for use with 0.1″ (2.54 mm) headers and breadboards. Available in a variety of lengths and colors. Premium stranded wires with male or female terminals for use with 0.1″ (2.54 mm) headers and breadboards. Available in a variety of lengths and colors. Works with crimp connector housings to make custom cables. Housings with 0.1″ (2.54 mm) spacings that easily snap onto wires with pre-crimped terminals to make custom cables. Our assortment of terminal blocks makes it easy to form temporary, solder-free connections between your PCB and stripped wires. They are available two styles (screw or spring terminals) and orientations (top- or side-entry), and we carry a variety of lengths and pin spacings. An assortment of single- and double-ended cables with JST SH-style connectors that work with the encoders on Pololu Micro Metal Gearmotors. These male pins can be crimped on 22-28AWG wires and snapped into our crimp connector housings to create custom cables that are compatible with standard 0.1"-pitch headers and solderless breadboards. Our wires with pre-crimped terminals and premium jumper wires use these same pins. One male crimp pin pack consists of 100 pins. These female pins can be crimped on 22-28AWG wires and snapped into our crimp connector housings to create custom cables that are compatible with standard 0.1"-pitch headers and solderless breadboards. Our wires with pre-crimped terminals and premium jumper wires use these same pins. One female crimp pin pack consists of 100 pins.'
