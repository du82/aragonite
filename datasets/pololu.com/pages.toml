["https://pololu.com/category/11/brushed-dc-motor-drivers"]
title = "Pololu - Brushed DC Motor Drivers"
description = "Single and dual motor driver carriers get your brushed DC motor projects up and running quickly using modern H-bridges with high-performance MOSFETs that deliver hundreds of watts in a compact package.   Give these boards a PWM signal and make your motors go!"
full_description = "This family of discrete MOSFET H-bridge motor drivers is suitable for bidirectional control of high-voltage or high-current DC brushed motors. Get your Arduino moving! This shield makes it easy to control two high-power DC motors with your Arduino or Arduino-compatible board. Its dual robust VNH5019 motor drivers operate from 5.5 to 24 V and can deliver a continuous 12 A (30 A peak) per motor, or a continuous 24 A (60 A peak) to a single motor connected to both channels. These great drivers also offer current-sense feedback and accept ultrasonic PWM frequencies for quieter operation. The Arduino pin mappings can all be customized if the defaults are not convenient, and the motor driver control lines are broken out along the left side of the shield for general-purpose use without an Arduino. This carrier board for ST’s VNH5019 motor driver IC operates from 5.5 to 24 V and can deliver a continuous 12 A (30 A peak). It works with 2.5 to 5 V logic levels, supports ultrasonic (up to 20 kHz) PWM, and features current sense feedback (an analog voltage proportional to the motor current). Along with built-in protection against reverse-voltage, over-voltage, under-voltage, over-temperature, and over-current, these features make this product a great general-purpose motor driver. This breakout board makes it easy to use Toshiba’s TB67H420FTG brushed DC motor driver, which can operate in either dual-channel mode for independent bidirectional control of two motors or single-channel mode for driving one motor with increased current. It has a wide operating voltage range of 10 V to 47 V and can deliver a continuous 1.7 A to each motor channel, or 3.4 A in single-channel mode. A configurable current chopping threshold allows the TB67H420 to actively limit the motor current, and it features built-in protection against under-voltage, over-current, and over-temperature conditions; our carrier board also adds reverse-voltage protection (up to 40 V). This shield makes it easy to control two brushed DC motors with your Arduino or Arduino-compatible board. Its dual TB9051FTG motor drivers operate from 4.5 to 28 V and can deliver a continuous 2.6 A per motor (5 A peak). These great drivers also offer current-sense feedback and accept ultrasonic PWM frequencies for quieter operation. A fixed current chopping threshold allows each TB9051 to limit the peak motor current, and they feature built-in protection against under-voltage, over-current, and over-temperature conditions; our shield also adds reverse-voltage protection. The Arduino pin mappings can all be customized if the defaults are not convenient, and the motor driver control lines are broken out along the left side of the shield for general-purpose use without an Arduino."
