title = "Pololu - Zumo Robots and Accessories"
description = "This high-performance tracked robot measures less than 10×10 cm, small enough to qualify for Mini Sumo.  It is based on the Raspberry Pi RP2040 MCU and its features include metal gearmotors w/ quadrature encoders, proximity sensors, line sensors, a full IMU, six RBG LEDs, and a graphical OLED display."
full_description = "This high-performance tracked robot measures less than 10×10 cm, small enough to qualify for Mini Sumo. It is based on the Raspberry Pi RP2040 MCU and its features include metal gearmotors w/ quadrature encoders, proximity sensors, line sensors, a full IMU, six RBG LEDs, and a graphical OLED display. The highly integrated Zumo 32U4 OLED improves upon the original Zumo 32U4 by adding a 128×64 graphical OLED display. Other key features include a built-in Arduino-compatible ATmega32U4 MCU, encoders for closed-loop motor control, and proximity sensors for obstacle detection. The Zumo robot for Arduino includes the basic mechanical parts and electronics to build an Arduino-controlled robot. An Arduino-compatible controller is not included, and this version does not have as many integrated sensors as the Zumo 32U4/2040 robot. This original Zumo 32U4 robot was the predecessor of the newer Zumo 32U4 OLED robot, which offers all the same features and upgrades the 8×2 character LCD to a 128×64 graphical OLED display. The Pololu Zumo chassis is a small, tracked robot platform that is less than 10 cm on each side, allowing it to qualify for Mini Sumo competitions. The chassis is composed of black ABS and features a compartment for four AA batteries and sockets for two micro metal gearmotors. It ships as a kit with two silicone tracks, two drive and two idler sprockets, a 1/16″ acrylic mounting plate, and mounting hardware. (Motors and batteries are not included.) This 0.036″-thick stainless steel plate can be mounted to the front of the Zumo chassis to create a slanted, bulldozer-like blade for pushing around objects, such as other mini-sumo robots. Add a splash of color to your Zumo robot by replacing its standard black sprockets with these red ones. This set includes two drive sprockets and two idler sprockets that work with the tracks and sprocket mounting hardware already included with the Zumo. Personalize your Zumo robot by replacing their standard black sprockets with these white ones. This set includes two drive sprockets and two idler sprockets that work with the tracks and sprocket mounting hardware already included with the Zumo."
