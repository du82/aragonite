["https://pololu.com/blog/869/empty-vessels-a-performance-of-robots-cellos-and-artificial-intelligence"]
title = "Pololu - Empty Vessels: a performance of robots, cellos, and artificial intelligence"
description = "Artist David Gardener contacted us recently to share his work, Empty Vessels (seen in the above video), an immersive audio visual installation that explores the connection between machines, data, and their environment. The piece features three cellos played by custom built robotic structures that perform music composed in real time. It premiered in November 2019 at the Society for Arts and Technology  in Montreal, where it performed for sold out audiences for two weeks! David was kind enough to answer our questions about the piece and allow us to share his answers along with some more footage and pictures with you below:"
full_description = "Artist David Gardener contacted us recently to share his work, Empty Vessels (seen in the above video), an immersive audio visual installation that explores the connection between machines, data, and their environment. The piece features three cellos played by custom built robotic structures that perform music composed in real time. It premiered in November 2019 at the Society for Arts and Technology in Montreal, where it performed for sold out audiences for two weeks! David was kind enough to answer our questions about the piece and allow us to share his answers along with some more footage and pictures with you below: The project started as an idea by myself (David Gardener) and Greg Debicki about a year ago. It remained an idea for most of the year until we were approached by the Society for Arts and Technology in Montreal (SAT) for help funding the project, where we could work on the project as artists in residence. At the end of the residency (in November) we would also premiere the show. This gave the project a very fast timeline taking just two and a half months from concept to presentation for two weeks of shows. I think it is probably the quickest timeline I have ever worked to, having to design, engineer & build the whole project. These were used to drive linear slides that moved the note sliders up and down the fingerboard. The reason for using this method was because I am a cellist myself, and the ability to slide between notes is really important in the sound of the cello. Unlike a guitar, there are no frets on a cello’s fingerboard, so the note sliders have to move to very accurate positions on the fingerboard to make sure that the notes are nicely in tune. On startup the motors would all drive the sliders to a home position using a limit switch. From there they would move to the different notes just by driving the motors to pre-defined positions. I decided to use a slider per string on each cello to maximise the amount of notes that could be played simultaneously, meaning they could play 12 note chords, or fast melody lines by splitting the melody across the 3 cellos."
year_published = 2020
