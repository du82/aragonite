["https://pololu.com/category/10/brushed-dc-motor-controllers"]
title = "Pololu - Brushed DC Motor Controllers"
description = "The Motoron motor controllers make it easy to control DC motors through an I²C or UART serial interface.  Modules are available with different numbers of channels (1, 2, or 3), and multiple controllers can be stacked or chained together for projects that need to control even more motors."
full_description = "The Motoron motor controllers make it easy to control DC motors through an I²C or UART serial interface. Modules are available with different numbers of channels (1, 2, or 3), and multiple controllers can be stacked or chained together for projects that need to control even more motors. The Pololu Simple Motor Controllers (SMCs) make basic control of brushed DC motors easy. Our most versatile and configurable motor controllers yet span a wide range of power levels and offer four interface modes: USB, TTL serial, analog voltage, and hobby radio control (RC). The Jrk motor controllers are highly configurable brushed DC motor controllers that can be used as an open-loop speed control or for closed-loop speed or position control. They support a variety of interface modes, including USB, TTL serial, analog voltage, and hobby radio control (RC). The RoboClaw motor controllers from Basicmicro (formerly Ion Motion Control) can control a one or two brushed DC motors using USB serial, TTL serial, RC, or analog inputs. Integrated dual quadrature decoders make it easy to create a closed-loop speed control system, or analog feedback can be used for position control. The powerful MCP motor controllers from Basicmicro (formerly Ion Motion Control) can control a pair of brushed DC motors using USB serial, TTL serial, RS-232 serial, CAN bus, RC, or analog inputs. They include integrated dual quadrature decoders and advanced features including internal scripting support and user-configurable I/O. These motor controllers allow variable speed and direction control of two brushed DC motors using a simple serial interface, making it easy to add motors to your microcontroller- or computer-based project."
