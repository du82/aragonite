["https://pololu.com/category/202/romi-chassis-and-accessories"]
title = "Pololu - Romi Chassis and Accessories"
description = "The Romi chassis is a differential-drive mobile robot platform with a diameter of 6.5″ (165 mm).  The plastic components making up the chassis are available in six colors, either individually or in kits including motors and battery contacts.  Control electronics and quadrature encoders are also available."
full_description = "Romi chassis kits include motors, wheels, one ball caster, battery contacts, and all other mechanical components required to assemble a chassis. Get individual components as replacement parts for your Romi chassis or to design your own color scheme. Empower your Romi robot to manipulate its surroundings with this robotic arm accessory kit! The kit contains everything you need to build the arm, including a micro gripper and three servos—one for controlling the height of the arm, one for controlling the tilt of the gripper, and one for actuating the gripper paddles themselves. All three servos are specially modified to provide access to their feedback potentiometers, enabling higher-level closed-loop control of all three joints. This Romi Chassis accessory offers a convenient way to expand your Romi robot vertically by adding new tiers. The expansion plate has the same diameter as the base plate, but we made it only a half circle to give you more expansion options. For example, when used as part of the Romi robot arm kit, it supports the arm in the back while leaving the front half of the Romi open. For a full-sized expansion platform, just combine two expansion plates. A mixture of mounting holes and slots give you the flexibility to mount components in a variety of orientations almost anywhere on the plate. This expansion plate for the Romi chassis is made from black ABS. Add quadrature encoders to the mini plastic gearmotors on your Romi chassis with this kit that uses a magnetic disc and Hall effect sensors to provide 12 counts per revolution of the motor shaft. The sensors operate from 3.5 V to 18 V and provide digital outputs that can be connected directly to a microcontroller or other digital circuit. This replacement gearmotor for the Romi/TI-RSLK MAX has an encoder already installed. The assembly is ready to plug into corresponding headers on our various Romi electronics modules, including the Romi 32U4 control board and the Romi Motor Driver and Power Distribution Board. Two of these are included with the Pololu Chassis Kit for TI-RSLK MAX."
