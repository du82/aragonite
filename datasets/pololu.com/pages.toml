full_description = "This versatile, high-performance mobile platform has a diameter of just 9.7 cm (3.8″), small enough to fit in the palm of your hand. It is based on the Raspberry Pi RP2040 MCU and its features include dual quadrature encoders, line sensors, front bump sensors, a full IMU, six RBG LEDs, and a graphical OLED display. This versatile, high-performance mobile platform has a diameter of just 9.7 cm (3.8″), small enough to fit in the palm of your hand. It is based on the Arduino-compatible ATmega32U4 MCU and its features include dual quadrature encoders, line sensors, front bump sensors, a full IMU, and a graphical OLED display. This original 3pi+ 32U4 robot was the predecessor of the newer 3pi+ 32U4 OLED robot, which offers all the same features and upgrades the 8×2 character LCD to a 128×64 graphical OLED display. This kit gives you the structural pieces you need to build your own 3pi+ robot. The chassis includes an integrated ball caster and battery holder for four AAA cells, a pair of 32×7 mm wheels with silicone tires, a bumper skirt, and motor clips that can be used to hold in the gear motors for operation without the bumper skirt. The chassis is designed to work with our Micro Metal Gearmotors, and you can add a 3pi+ 2040 Control Board or 3pi+ 32U4 Control Board or your own electronics to complete your robot. Motors and electronics are not included. These white plastic wheels have silicone tires and measure 32 mm (1.26″) in diameter. They press-fit onto the 3mm D shafts on many of our motors, including our micro metal gearmotors and our mini plastic gearmotors, to make a nice drive solution for small robots. They are sold in pairs. These black plastic wheels have silicone tires and measure 32 mm (1.26″) in diameter, and they press-fit onto the 3mm D shafts on many of our motors, including our micro metal gearmotors and our mini plastic gearmotors. This product is a pair of wheels. These are replacement silicone tires for all of our 32×7mm Pololu wheels. This product is a pair of tires."
