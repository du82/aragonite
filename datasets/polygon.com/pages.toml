full_description = "PuzzmoPlay SpellTowerby Polygon StaffApr 11, 2024, 1:00 PM UTCFacebookLink ✏️ Today’s Crossword🔗🔠 Today’s SpellTower👀 Today’s Typeshift♟️ Today’s Really Bad Chess🎨 Today’s Flipart🧩 Subscribe to Polygon on PuzzmoHow to play SpellTowerYour goal is to find and clear words by selecting tiles in the grid.Words must be made up of contiguous tiles. You can use diagonals and cross your own path.Select words by dragging on the grid, tapping each letter individually, or typing on the keyboard.Submit a word by tapping the last letter again or by hitting return on the keyboard.When you’ve made all the words you can, select I’m done to complete the game.Blank tilesBlanks are cleared by making any word next to them.Bonus clearsIf you make a 5+ letter word, all adjacent tiles will also be cleared.Rare tiles (JQXZ)J, Q, X, and Z tiles are colored. Using any of these tiles in a word will also clear the entire row.Full clearIf you manage to clear the entire tower, the game will end immediately and you’ll get a 1,000 point bonus!Word scoringWord score formula(Sum of word tile values + sum of bonus tile values) x word length x (1+# star tiles)Sum of word tile valuesEach tile in SpellTower is worth points based on how uncommon it is.Sum of bonus tile valuesThese are the values of any tiles cleared in addition to the word itself — tiles cleared by a row clear, or tiles cleared by the 5+ length word bonus.Star tile bonusUsing one star tile in your word with multiply the value by x2, two will give you x3 and three will give you x4.Keyboard controlsType any word to select it on the grid.Tab — toggle the selected word.Return — submit the selected word.Delete — Deselect the last selected cell.Esc — Deselect the entire word.Polygon // PuzzmoCome play with usJoin Puzzmo!See More: PuzzmoMost PopularThe best horror to watch on Netflix this FebruaryCaptain America: Brave New World is a mess — but the ‘5D’ version I saw was even messierWhy is the Red Hulk red?Was Captain America