["https://polygon.com/24012481/make-4-star-sandwich-bbq-group-quest-herba-mystica"]
title = "How to make a 4-star sandwich in Pokémon Scarlet and Violet | Polygon"
description = "You can make four-star sandwiches without Herba Mystica in Pokémon Scarlet and Violet. Our guide lists two recipes that work no matter how many players you have."
full_description = "Polygon ArchivesHow to make a 4-star sandwich in Pokémon Scarlet and VioletDon’t worry, you don’t need to use your Herba Mysticaby Julia LeeDec 22, 2023, 8:39 PM UTCFacebookLinkImage: Game Freak/The Pokémon Company, Nintendo via PolygonPart OfPokémon Scarlet & Violet guidessee all Julia Lee (she/her) is a guides producer, writing guides for games like The Legend of Zelda: Tears of the Kingdom and Pokémon Go. She helped launch the Rift Herald in 2016.In Pokémon Scarlet and Violet’s The Indigo Disk DLC, you may be tasked with creating a four-star sandwich while you’re grinding out group quests. You’ll need some buddies and specific recipes to successfully making this level of sandwich, but don’t worry, we have the answers.Outside of farming Blueberry quests (BBQs) for BP, you’ll also need to complete group quests to nab all the Snacksworth Legendary Pokémon.Using Herba Mystica will amp up your sandwiches to a higher level, but most players won’t want to waste such a rare resource on a group quest (most would rather use that to make shiny sandwiches). Below, we list how to make four-star sandwiches in Pokémon Scarlet and Violet without using Herba Mystica.4-star sandwich ingredients in Pokémon Scarlet and VioletThere are two super easy recipes that don’t use Herba Mystica that you can use, depending on how many players you have in your session. You can buy all of these ingredients from the vending machines around the Terarium, too.If you have a four-player session, everyone in the sandwich-making session needs to use the following:4 hamburger4 cream cheese8 mustardSplit up the ingredients among the players so each person submits one hamburger, one cream cheese, and two mustard.If you only have two players, you can use the following:6 hamburger2 cherry tomatoes4 curry powder4 marmaladeYou can split up the ingredients among the two people so that each person brings three hamburgers, one cherry tomato, two curry powder, and two marmalade.Image: Game Freak/The Pokémon Company, Nintendo via PolygonPlacing this many ingredients can be a challenge, so remember that you don’t have to place the top bun on the sandwich at the end. Since that top bun tends to knock off a lot of ingredients, you can kind of just throw it anywhere (not on the sandwich) and the sandwich will still be made successfully. It’s a bit of an open-faced deconstructed type deal.If you made everything correctly, you should get a four-star sandwich. If not, double check your ingredients and make sure that nothing fell off the bottom bun, since that’ll make it not count.See More: Polygon ArchivesMore in Pokémon Scarlet & Violet guidesSee allHow to get shiny Rayquaza in Pokémon Scarlet and VioletBy Julia LeeCommentsComment Icon BubbleHow to get all starters in Pokémon Scarlet and Violet: The Indigo DiskBy Julia LeeCommentsComment Icon BubbleAll Snackworth Legendary Pokémon locations in Pokémon Scarlet and Violet: The Indigo DiskBy Julia LeeCommentsComment Icon BubbleMost PopularThe best horror to watch on Netflix this FebruaryCaptain America: Brave New World is a mess — but the ‘5D’ version I saw was even messierWhy is the Red Hulk red?Was Captain America: Brave New World’s post-credits scene shot in 2010?5 great co-op games are on deep discount in Steam’s new salePatch NotesThe best of Polygon in your inbox, every Friday.Email (required)Sign UpBy submitting your email, you agree to our Terms and Privacy Notice. This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply.Advertiser Content FromThis is the title for the native ad"
