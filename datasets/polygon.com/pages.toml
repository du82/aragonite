["https://polygon.com/authors/michael-mcwhertor"]
title = "Michael McWhertor Profile and Activity | Polygon"
description = "Michael McWhertor is a New York-based journalist and editor with more than 18 years of experience covering video games, technology, movies, TV, and entertainment. He previously worked at Gawker Media’s Kotaku and Gizmodo, MTV’s GameTrailers, and UBM TechWeb’s GameSetWatch, covering the game industry, its culture, and its people. Michael joined Polygon for the website’s launch in 2012, and has covered major events like E3, Gamescom, Tokyo Game Show, and the Game Developers Conference, and major console launches by Nintendo, PlayStation, and Xbox. He plays entirely too much Overwatch, Pokémon Go, Dark Souls, Elden Ring, and Resident Evil."
