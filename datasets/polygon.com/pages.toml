full_description = "Final Fantasy 14 guides, tips, tricks, and walkthroughsHow to become the best Warrior of LightImage: Square EnixThe world of Final Fantasy 14 is vast. With hundreds of hours of gameplay, getting started can be confusing and intimidating. We’re here to help.To make your journey as the Warrior of Light as easy as possible, we have an in-depth beginner’s guide that will teach you the basics. If you’re worried about sinking a ton of time into the game, then we have a guide explaining how long it takes to beat FFXIV, too.Getting started with FFXIVWorking your way through FFXIV’s expansive free trial can be daunting. While you’re learning the basics, you’ll also want to know which is the best job to choose from the start. If you want to continue past the free trial, you’ll need to know how to buy a subscription.Getting around in the start of FFXIV can be quite slow, so to help you move through the game faster, check out our guides on how to fast travel (or teleport) and how to unlock your first mount.Playing through expansionsWhen you get into the swing of the game, check out our guides for later content, like unlocking savage raids and doing treasure hunting maps. We’ll help you get through all of the different types of content in Shadowbringers, Endwalker, and Dawntrail.For those looking to get into the real endgame, we also have guides on how to glamour your gear into fancy outfits and how to get a house. We also have tons of guides on optional content, like ocean fishing and the Island Sanctuary.Read More Image: Square EnixBeginner’s guidesFinal Fantasy 14 guides, tips, tricks, and walkthroughs14 things to know before starting FFXIVBy Julia LeeFeb 21, 202414 things to know before starting FFXIVWhich Grand Company should you join in FFXIV?How long to beat FFXIV and its expansionsHow to teleport and fast travel in FFXIVHow to get a mount in FFXIVAll FFXIV jobs, explainedWhen are the daily and weekly reset times in FFXIV?What you should spend Tomeston