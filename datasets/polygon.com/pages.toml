title = "Elden Ring: Shadow of the Erdtree DLC guides and walkthroughs | Polygon"
description = "Elden Ring DLC, Shadow of the Erdtree, is basically more Elden Ring. Our guides and walkthroughs can help you with every step of the DLC."
full_description = "Elden Ring: Shadow of the Erdtree guides and walkthroughsPrepare with our shadow of the word-treeImage: FromSoftware/Bandai NamcoElden Ring’s Shadow of the Erdtree DLC poses one big question, the type of earthshaking query that can rattle the philosophical foundation of any gamer’s mindset: “What if Elden Ring, but more?”In truth, you’re the only person who can answer that question for yourself. But if you’ve played a bunch of the base game — and hit all the pre-requisites for accessing the DLC — one look at Shadow of the Erdtree is likely enough impetus to sigh, sit down, and recognize it’s time to do it all again.As with all things Elden Ring, there’s no need to brave this expansion alone. Start with our guide on the recommended level for Shadow of the Erdtree, then see what to do first in the Elden Ring DLC, or get lost in our interactive map. From there, if you find yourself stuck on any of the byzantine legacy dungeons, check out our walkthroughs for Belurat, Castle Ensis, and Shadow Keep.We have guides on where to find DLC map fragments and DLC talismans, plus guides on two collectibles specific to Shadow of the Erdtree: Scadutree Fragments and Revered Spirit Ashes. Those are in addition to lists on weapons and armor introduced in the DLC.And, go figure, there’s no shortage of horrible bosses here. A particular enemy giving you grief? Our guides can help you beat the Blackgaol Knight; Divine Beast Dancing Lion; Rellanna, Twin Moon Knight; and the Golden Hippopotamus.Yes, “more Elden Ring” might sound like a daunting proposition. But Shadow of the Erdtree retains one quality that made the base game such a standout: It’s way easier (and way more fun) when you phone a friend.Read More Image: FromSoftware/Bandai NamcoWalkthroughsElden Ring: Shadow of the Erdtree guides and walkthroughsElden Ring Shadow of the Erdtree walkthrough route for the main storyBy Johnny YuJun 28, 2024CommentsComment Icon BubbleElden Ring Shadow of the Erdtree walkthrou