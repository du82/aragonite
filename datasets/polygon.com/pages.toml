description = "Unicorn Overlord is the latest game from Vanillaware, which previously made 13 Sentinels: Aegis Rim. The new title is already $20 off."
full_description = "Polygon ArchivesUnicorn Overlord is $20 off at multiple retailersVanillaware and Atlus’ latest treasure gets its first major discountby Cameron FaulknerApr 8, 2024, 4:13 PM UTCFacebookLinkIf you buy something from a Polygon link, Vox Media may earn a commission. See our ethics statement.Screenshot: Vanillaware/AtlusCameron Faulkner (he/him) is Polygon’s commerce editor. He’s a product expert who began writing about tech and gaming in 2013, and migrated from The Verge in 2023.Unicorn Overlord is one of many great games that debuted during March. But next to Dragon’s Dogma 2 and Princess Peach: Showtime!, it’s possible that Vanillaware’s latest game flew under your radar, despite the developer’s stellar pedigree for RPGs. You definitely shouldn’t miss out on it now that it’s $20 off, costing $39.99 at Amazon, GameStop, and Best Buy on Nintendo Switch, Xbox Series X, and PlayStation 5.Unicorn Overlords$40$6033% off$40$40 at Amazon$40 at Best Buy$40 at GameStopLike Vanillaware’s previous title, 13 Sentinels: Aegis Rim, Unicorn Overlords is presented in a gorgeous, painterly style that has become a signature look for the studio — oh, and there’s a lot going on. Similarly, it offers tactical, turn-based gameplay, with plenty of great characters you can get to know. However, this game piles on a lot more content that, according to our reviewer, is paced well enough to tempt you to explore all of it.Related13 Sentinels is a masterpiece and it’s even better on SwitchSeveral Polygon staffers are playing the game, and the prevailing wisdom is that Unicorn Overlords is best experienced on a portable, be it a Nintendo Switch, or on PS5 via the PlayStation Portal. The reason is because, well, you’re probably going to want to play it everywhere, all of the time.See More: Polygon ArchivesMost PopularThe best horror to watch on Netflix this FebruaryCaptain America: Brave New World is a mess — but the ‘5D’ version I saw was even messierWhy is the Red Hulk red?Was 