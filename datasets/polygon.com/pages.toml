title = "Chris Plante Profile and Activity | Polygon"
description = "Chris Plante co-founded Polygon in 2012 as its editor-at-large. He previously served as Culture Editor at The Verge. Chris’ writing has appeared in The New York Times, The Guardian, Vulture, and Vox.com. With 15 years of industry experience, he created and occasionally teaches NYU’s Intro to Games Journalism. Outside of the media business, Plante co-authored the original story for Limetown, a podcast that has since been adapted for books and television. He is the editor of Quest, a tabletop role-playing game. He serves on the board of the Frida Cinema in Santa Ana. And each week, Plante co-hosts The Besties, a video game podcast in which the world’s best friends pick the world’s best games."
