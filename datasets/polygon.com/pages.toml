["https://polygon.com/gaming/524005/best-co-op-games-steam-sale-portal-2-tetris-effect"]
title = "5 great co-op games are on deep discount in Steam’s new sale | Polygon"
description = "Steam has marked down several great cooperative games, from Portal 2 to Baldur’s Gate 3. Here are five of my favorite games on the sales list"
full_description = "Gaming5 great co-op games are on deep discount in Steam’s new saleMake this Valentine’s Day weekend a gaming extravaganzaby Maddy MyersFeb 15, 2025, 4:00 PM UTCFacebookLinkIf you buy something from a Polygon link, Vox Media may earn a commission. See our ethics statement.Image: Larian Studios via PolygonMaddy Myers has run Polygon’s games section since 2020 as deputy editor. She has worked in games journalism since 2007, at Kotaku, The Mary Sue, and the Boston Phoenix.Whether you’re celebrating Valentine’s Day with a weekend of gaming togetherness or just somebody with a gaming pal looking for a great deal, Steam’s Couch Co-Op Fest — running through Feb. 18 — has a ton of amazing cooperative games marked down significantly. The list of included games is long, but several of them stuck out to me as they’re personal favorites I wouldn’t want anybody to miss.Plus, this first game I’m going to shout out is a whopping 90% off its original price of $10 — surely you can convince yourself to get Portal 2 when it costs less than three eggs.Portal 2$1$1090% off$1Portal 2 has both a single-player campaign and a separate co-op campaign, and its co-op campaign is designed specifically for two players. You each play as an adorable robot, both with their own a portal gun, which means you’ve got double the portals to use for each puzzle. The puzzles are harder to make up for that, of course. But also? There’s a dedicated “hug” button so you can make those two robots celebrate in the cutest way possible (or just console each other when the puzzle is way too hard).Read More$1 at SteamTetris Effect: Connected$20$4050% off$20Tetris Effect’s base game is named for the real phenomenon of dedicated Tetris players seeing cascading blocks and patterns in their everyday life; the game leans in to the psychedelic with eye-popping colors and gorgeous music. Tetris Effect: Connected is a newer version of the game that adds even more multiplayer modes, allowing you to enter peak Tetris flow state alongside a friend (or even two friends, as the game allows for up to three players).Read More$20 at SteamBaldur’s Gate 3$48$6020% off$48You can enjoy Baldur’s Gate 3 completely solo, as the many companions who make up your fantasy adventuring party in this D&D-inspired game are perhaps the best part. But what’s also wonderful about Baldur’s Gate 3 is that you can play it co-op, with an IRL friend joining your party, or even three other friends, making up an entire D&D party of your own. It’s a whole new and different way to experience an already incredible (and award-winning) story.Read More$48 at SteamGears 5$7$3077% off$7Don’t let the number in the title fool you: Gears 5 is actually a perfect place to start with the Gears of War universe. All-new protagonist Kait Diaz brings a subtler touch to the sci-fi shooter that’s all about fighting the monstrous Locust who began popping out of the ground years ago. The story ends up going some interesting places with the idea of the human colonizers perhaps being the ones in the wrong (it’s the Locust’s home, after all). Gears games are always also co-op games, so find a friend who wants to rev up a chainsaw gun along with you and don’t miss this experience of wondering “Are we the baddies?”Read More$7 at SteamOvercooked 2$6$2576% off$6The cute aesthetic of Overcooked games helps offset the breakneck intensity of actually running a kitchen cooperatively with a friend. That intensity is well worth experiencing when you get it all right, and there’s no greater bond between friends than reenacting scenes from The Bear, right? Levels move fast, to say the least, and you’ll have to fully enter hive mind mode to get each dish out the door successfully.Read More$6 at SteamBut that’s not all — there are tons of other co-op games on sale until Feb. 18, from NBA 2k25 to Black Ops 3 to Stardew Valley. Check out the full list here.See More: GamingPolygon ListsPolygon PicksSales GuideShoppingBaldur’s Gate 3Gears 5Overcooked 2Portal 2Tetris EffectMost PopularThe best horror to watch on Netflix this FebruaryCaptain America: Brave New World is a mess — but the ‘5D’ version I saw was even messierWhy is the Red Hulk red?Was Captain America: Brave New World’s post-credits scene shot in 2010?5 great co-op games are on deep discount in Steam’s new salePatch NotesThe best of Polygon in your inbox, every Friday.Email (required)Sign UpBy submitting your email, you agree to our Terms and Privacy Notice. This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply.Advertiser Content FromThis is the title for the native ad"
