full_description = "PuzzmoPlay Typeshiftby Polygon StaffApr 11, 2024, 1:00 PM UTCFacebookLink ✏️ Today’s Crossword🔗🔠 Today’s SpellTower👀 Today’s Typeshift♟️ Today’s Really Bad Chess🎨 Today’s Flipart🧩 Subscribe to Polygon on PuzzmoHow to play TypeshiftYour goal is to turn every letter solid.(Use every letter in at least one word)How to turn letters solidSlide the columns of words up and down to form valid words in the highlighted row.Valid words will turn their letters solid.Solid letters may be used in new words.Core vs. Additional WordsCore words are the words used to generate the puzzle. It is possible to solve the puzzle with only the core words, and they are always commonly known words.But there are many additional words in Typeshift puzzles, and you can use any words you can find to solve the puzzle (no matter how obscure!).ScoringYou score points for each solid letter.Over time the value for turning letters solid decreases, so you get more points the sooner you enter letters.As always, there are many ways to play Puzzmo! If speed isn’t your thing, consider trying to solve the puzzle in the fewest words.Keyboard controlsPlay Typeshift with your keyboard simply by typing. If a letter isn’t in your selected column but is in the first column, selection will return to the first column.You can also use the arrow keys to navigate between columns and move them up and down.Polygon // PuzzmoCome play with usJoin Puzzmo!See More: PuzzmoMost PopularThe best horror to watch on Netflix this FebruaryCaptain America: Brave New World is a mess — but the ‘5D’ version I saw was even messierWhy is the Red Hulk red?Was Captain America: Brave New World’s post-credits scene shot in 2010?5 great co-op games are on deep discount in Steam’s new salePatch NotesThe best of Polygon in your inbox, every Friday.Email (required)Sign UpBy submitting your email, you agree to our Terms and Privacy Notice. This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply.Advertiser Content FromThis is the title for the native ad"
