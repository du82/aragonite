["https://polygon.com/c/23953760/the-triumph-of-zelda"]
title = "The triumph of Zelda"
description = "In a year of huge games, Tears of the Kingdom still stands out"
full_description = '''poly-lt-wire-logo <div class="background" style="background-image: url(https://cdn3.vox-cdn.com/thumbor/QpSC_F0K3driBgivKmI9raFZelw=/1500x0/filters:no_upscale()/cdn.vox-cdn.com/uploads/chorus_asset/file/25171618/Tears_of_the_Kingdom_Guide_and_Walkthrough_Header.jpg" alt=")"> The triumph of Zelda In a year of huge games, Tears of the Kingdom still stands out <div class="background" style="background-image: url(https://cdn3.vox-cdn.com/thumbor/QpSC_F0K3driBgivKmI9raFZelw=/1500x0/filters:no_upscale()/cdn.vox-cdn.com/uploads/chorus_asset/file/25171618/Tears_of_the_Kingdom_Guide_and_Walkthrough_Header.jpg" alt=")"> There are game releases, there are blockbuster game releases, and there are releases that arrive with the fanfare of Halley’s comet. The Legend of Zelda: Tears of the Kingdom, released by Nintendo on May 12, 2023, was the latter. A sequel to the one of the highest-selling games of all time, the release punctured mainstream culture with Barbenheimer levels of zeitgeist energy, and with the receipts to prove it: Only Barbie and Nintendo’s own billion-dollar big-screen success, The Super Mario Bros. Movie, rival the game’s grosses — and that’s before the holiday season.The numbers come as no surprise to anyone who understands the ferocious cultural appetite for games. Breath of the Wild, the previous Zelda game, was key to the 2017 launch of Nintendo’s Switch console, which sold over 15 million units by the end of its first fiscal year. Now, between Nintendo’s legacy of inclusive gaming and the COVID-19 pandemic upheaval that drove safe-at-home gaming through the roof, the company has sold over 132 million Switch units, priming the playing field for a new blockbuster moment. And after years of hype, Tears of the Kingdom was the inevitable and explosive swan song for the console.Tears of the Kingdom could have been a safe rehash, but to even the most devoted fans, the game was more freeform and daring, invoking games like Fortnite and Minecraft as much as titles within the franchise. In this installment, players were given the ability to manipulate almost every single object in the game, building vehicles, tools, machines, and more in seemingly limitless permutations. Every challenge and puzzle scattered across the game’s three vast landscapes offered multiple solutions, creating fun in the journey as much as in the results — and videos of those attempts made it an instant TikTok favorite.Tears of the Kingdom can’t simply be reviewed and filed away in the annals of history. It’s Polygon’s best game of 2023, but even as the year rounds down, feels alive — and set to endure. If you’ve been wary to jump in, engage, and fully understand the breadth of this wild, you’re in luck: Polygon has gone to the end and back. Here’s everything to know about The Legend of Zelda: Tears of the Kingdom, no matter where you are in the journey. How The Legend of Zelda: Tears of the Kingdom changes the conversation Tears of the Kingdom devs on reinventing Zelda: ‘Cheating can be fun’ Beginning the Journey The epic 20-year timeline of Zelda games, unraveled The TikTok creators keeping Legend of Zelda alive Meet Ganondorf, the eternal baddie of the series How to (legally) play every Zelda game Traversing the open world Every problem can be solved by a bridge Tears of the Kingdom’s blood moon has a secret technological purpose The 'industrial revolution' that never happened for Zelda's open world Can you beat Tears without touching the surface? Tears of the Kingdom devs talk about the game’s tragic conclusions Tears of the Kingdom’s inventiveness is baked into its sound design There’s no wrong way to play Zelda: Tears of the Kingdom Into the cultural depths A Link between hairstyles Why gender is at the center of every Zelda release Tears of the Kingdom continues the series' religious arc A Breath of the Wild sequel was always going to be a meme bonanza Living the Zelda life The 11 best Zelda-like games to play after Tears of the Kingdom Now you can be a Great Fairy, too The Legend of Zelda is everywhere in modern music Everyone’s got a Triforce tattoo'''
