["https://polygon.com/24210459/elden-ring-seamless-co-op-mod-jolly-cooperation"]
title = "The Elden Ring seamless co-op mod makes it easy to play with friends | Polygon"
description = "The seamless co-op mod swaps Elden Ring’s arcane multiplayer for a simple drop-in, drop-out system, and it works really, really well."
full_description = "Polygon ArchivesThe Elden Ring seamless co-op mod makes it easy to play with friendsEverything else is still hardby Patrick GillJul 31, 2024, 5:00 PM UTCFacebookLinkImage: Bandai Namco via PolygonPatrick Gill (he/him) has been making serious and unserious videos for Polygon since 2016. He also co-hosts & produces Polygon’s weekly livestreams on Twitch.Elden Ring’s multiplayer is thoughtfully weird. Like most of the game’s mechanics, it’s got layers of obfuscation. You can play with a friend, but first, you must complete the ritual. You gather reagents, share a secret password, touch a mysterious pylon, and — if you’re trying to link up with a specific friend — wait and pray that their summoning rune appears where you want it to.Once you’re connected, the summoning comes with rules and warnings (like most fairytale magic). You can’t ride your spectral steed as long as your friend is around. You can’t move between regions. If you summon your friend in a cave, you’re locked in by a wall of fog, never to see the outside world. You also become vulnerable to hostile invasions by other players. If you die or kill a boss, the spell is broken, your buddy evaporates into golden mist, and the ritual has to be repeated.On one hand, it’s really cool to see a multiplayer system that reinforces the game’s vibes. In Elden Ring, you should feel lonely. Human contact should be a fleeting, and sometimes dangerous thing, accessed only with arcane dream magic.On the other hand, sometimes you just wanna party. The Elden Ring seamless co-op mod is most definitely here to party.Developed by a single programmer, the mod overhauls Elden Ring’s multiplayer matchmaking to allow for unrestricted cooperation. For the most part, it really is seamless!You link up by sharing a password and using a special re-usable summoning item that delivers your co-op buddies to you, anywhere on the map. Once you’re linked up, it’s pretty much like playing vanilla Elden Ring, but you’ve got your friends with you. Everyone can use their horse, fast travel, level up, or delve into a cave. Loot is instanced and character progress is saved locally. Seamless!It’s an impressive technical achievement, but the icing on the cake is the presentation and balance. While the new multiplayer tools are straightforward and reliable, you still access them by using inventory items with esoteric little names. It feels lore-appropriate. The mod also ramps up the boss HP pool for each additional player who joins, and normal enemies get a bit tougher. If you’re not digging the default settings, you can tweak the percentages until the challenge feels right for you and your buddies. Elden Ring with constant companionship is a different game, but it’s a good game. I’ve had a blast with it. In the company of a friend, visiting the lands between can be a nice walk down memory lane. It can also be an opportunity to try out weird builds that you wouldn’t consider “viable” if you had to drop every boss on your own. You can go ahead and make a frail little archer or a slow-rolling behemoth dual-wielding brick hammers, because you’ve got friends to back you up!The seamless co-op mod is still in development, and it’s not perfect. It seems like game states occasionally de-sync, leading to tweaked-out AI and players seeing different things. But these glitches are rare, and a quick session reload fixes just about anything.So if you’re looking for a less lonely way to revisit the Lands Between, give it a shot!See More: Polygon ArchivesElden RingMost PopularThe best horror to watch on Netflix this FebruaryCaptain America: Brave New World is a mess — but the ‘5D’ version I saw was even messierWhy is the Red Hulk red?Was Captain America: Brave New World’s post-credits scene shot in 2010?5 great co-op games are on deep discount in Steam’s new salePatch NotesThe best of Polygon in your inbox, every Friday.Email (required)Sign UpBy submitting your email, you agree to our Terms and Privacy Notice. This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply.Advertiser Content FromThis is the title for the native ad"
