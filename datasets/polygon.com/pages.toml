["https://polygon.com/pages/about-us"]
title = "About Us | Polygon"
description = "Your source for the latest in video games, sci-fi, fantasy, tabletop games, anime, horror, books, and comics."
full_description = "About UsThe trouble with modern entertainment is choice: There’s more stuff than ever, and nearly all of it is available on your phone. So where does one start? Think of Polygon as your expert tour guide. We help our readers and viewers find their next favorite thing, learn the story behind how it came to be, and appreciate how this little piece of culture fits into the greater whole of our lives.Founded in 2012 by Christopher Grant and Jim Bankoff with a focus on creating an entry point for the world of video games, Polygon became a trusted news source in the gaming space with thorough original reporting, thoughtful reviews, detailed guides, entertaining videos, and a progressive approach to the gaming community. We continue to follow that playbook across all our coverage, which has now grown to include the full breadth of our audience’s interest, from anime and tabletop games to movies and streamer culture. Today, you can find Polygon on platforms like YouTube, TikTok, and Twitch, and in the tangible world through our beautiful books Like a Hurricane: An Unofficial Oral History of Street Fighter II and 500 Years Later: An Oral History of Final Fantasy VII.Our goal is to improve the worlds we cover, whether that’s having fun in fictional worlds, holding studios accountable in the real one, or introducing you to communities online and offline that we think you’ll love. Our work is respected across the entertainment and mainstream press around the globe, with our reporting cited by global news outlets like the New York Times and our team members regularly appearing on TV and radio outlets like MSNBC, Fox Business, NPR, and the CBC. Polygon is the only publication to produce video game coverage nominated for a National Magazine Award by the American Society of Magazine Editors.Polygon was founded as part of Vox Media, the leading modern media company, whose portfolio features nearly 20 wonderful editorial properties, including The Verge, New York Magazine, Vox, Eater, SB Nation, and The Dodo. Get in touchWant to keep up to date on Polygon stories? Subscribe to our weekly newsletter, Patch Notes, for a curated list of what to read, watch, and play, delivered to your inbox every Friday. Follow Polygon on TikTok, YouTube, Instagram, and X.Have a story to tell? Here’s how to pitch us. Need to get in touch for something else? You can contact us here. Want more Polygon in the real world? Our merch store includes T-shirts, mugs, and gear.Get to know Polygon’s staff on our masthead. Read Polygon’s editorial ethics and community guidelines, along with Vox Media’s approach to the use of generative AI, to learn more about how we select and tell our stories."
