title = "Introducing Polygon’s puzzle partner, Puzzmo | Polygon"
description = "Crosswords, SpellTower, Typeshift, it’s all here"
full_description = "PuzzmoIntroducing Polygon’s puzzle partner, PuzzmoCrosswords, SpellTower, Typeshift, it’s all hereby Christopher GrantDec 5, 2023, 12:45 AM UTCFacebookLinkImage: PuzzmoChristopher Grant founded Polygon in 2012 and served as its first editor-in-chief through 2019. Since then, he has served as its Publisher, and Group Publisher for sister publication (and BFF) The Verge. He loves video games.Starting today, you can join Puzzmo, the new puzzle gaming platform created by notable indie puzzle game developer Zach Gage along with Orta Therox, and you can do it right alongside other Polygon readers and staff. In addition to Gage-designed classics you may already be familiar with — from SpellTower to Typeshift and Really Bad Chess — there are new games like Flipart and a pleasantly accessible crossword, hints and all.While you can play for free, a subscription to Puzzmo Plus allows a game’s scores to ladder into daily, weekly, and monthly leaderboards so you can compete against friends, family or, perhaps, fellow readers of this very publication. You can become a subscriber for just $40 a year, which also nets you access to the archives (if you miss a puzzle!), an extra profile to share with a family member, the ability to make your own groups, and those leaderboards. Oh, and it removes ads, too.This is a fun time to reimagine what a newspaper games page is, and we’re really excited to partner with Puzzmo to offer a new, daily gaming routine for you all. Let us know what you’d like to see, share your usernames in the comments (I’m charstring), and we’ll see you on the leaderboards!Polygon // PuzzmoCome play with usGo to Puzzmo!See More: PuzzmoMost PopularThe best horror to watch on Netflix this FebruaryCaptain America: Brave New World is a mess — but the ‘5D’ version I saw was even messierWhy is the Red Hulk red?Was Captain America: Brave New World’s post-credits scene shot in 2010?5 great co-op games are on deep discount in Steam’s new salePatch NotesThe