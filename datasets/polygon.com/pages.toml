["https://polygon.com/24006715/pokemon-scarlet-and-violet-fans-dlc-synchro-machine"]
title = "Scarlet and Violet’s new Synchro Machine lets you play as a Pokémon | Polygon"
description = "Scarlet and Violet’s new “Indigo Disk” DLC allows fans to play as Pokémon. Now, fans keep sharing clips of the best Pokémon to play as."
full_description = "Polygon ArchivesScarlet and Violet fans can’t stop sharing clips playing as PokémonPlease let me just hop around everywhere as a Joltikby Ana DiazDec 18, 2023, 9:12 PM UTCFacebookLinkImage: The Pokémon CompanyAna Diaz (she/her) is a culture writer at Polygon, covering internet culture, fandom, and video games. Her work has previously appeared at NPR, Wired, and The Verge.The Pokémon Company and Game Freak released Scarlet and Violet’s second installment of DLC, The Indigo Disk, last week. The game adds a hefty amount of content — there’s a new region to explore and a new series of battles that includes a new Elite Four challenge. However, my favorite part is that we just get to hop around as our favorite little guys. That’s right: You can finally play a Pokémon game as a Pokémon.There’s a new feature called, Synchro Machine, which allows players to explore and play as a pocket monster. Since its release, game fans are sharing clips of their favorite Pokémon online to adorable results — anything from the humble Joltik to the majestic Kyogre is fair game.The new Synchro Machine in Scarlet and Violet allows players to sync up with a Pokémon and allow people to play as them. The feature doesn’t allow you to do full, turn-based battles, but pretty much allows players to roam wherever they want in the new region. A lot of the posts simply show clips as people play as various Pokémon. Like the base game, the DLC has its fair share of glitches, but that didn’t stop the developers from adding some cute movement animations. The animation for Joltik for example, is just a zippy little hop.Others are just doing goofy little things with super big and strong guys. Here we can see Kyogre, a legendary Pokémon that has the power to flood entire continents, spin like a top.The DLC added some of the starter Pokémon from previous generations as well. Here, we get to see an all-time personal favorite of mine, Oshawott, have a little beach day.When I first saw Toedscool, a Pokémon that looks like a wretched landwalking version of Tentacool, I ran for the hills.. er... ocean. Regardless, if you ever saw Toedscool and thought, “Gee, I’d love to take those grippers for a good run,” well you can also do that now.The Scarlet and Violet DLC is far from the first game to allow fans to play as Pokémon. Spin-off series like the Pokémon Mystery Dungeon and Pokémon Rumble, and games like Pokémon Unite, allow fans to play as their beloved creatures. Still, this addition feels like a special treat since it’s not a common feature to add in a mainline Pokémon game where gameplay focuses on the trainer.See More: Polygon ArchivesMost PopularThe best horror to watch on Netflix this FebruaryCaptain America: Brave New World is a mess — but the ‘5D’ version I saw was even messierWhy is the Red Hulk red?Was Captain America: Brave New World’s post-credits scene shot in 2010?5 great co-op games are on deep discount in Steam’s new salePatch NotesThe best of Polygon in your inbox, every Friday.Email (required)Sign UpBy submitting your email, you agree to our Terms and Privacy Notice. This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply.Advertiser Content FromThis is the title for the native ad"
