full_description = "PuzzmoPlay Flipartby Polygon StaffApr 11, 2024, 1:00 PM UTCFacebookLink ✏️ Today’s Crossword🔗🔠 Today’s SpellTower👀 Today’s Typeshift♟️ Today’s Really Bad Chess🎨 Today’s Flipart🧩 Subscribe to Polygon on PuzzmoHow to play FlipartRotate the pieces to fit them within the frame.No overlaps allowed!To rotate pieces, tap their pivots (the 4 dots).Advanced controlsTapping on a non-pivot tile will show you what pivots affect it.Use two fingers to pinch and zoom on larger puzzles.ScoringAt the end of the puzzle each piece is scored based on when it was last rotated.As time elapses pieces are worth less and less.As always, there are many ways to play Flipart! If speed isn’t your thing, consider trying to solve the puzzle with the fewest rotations.Keyboard controlsYou can use the arrow keys to navigate and spacebar or return to rotate.Polygon // PuzzmoCome play with usJoin Puzzmo!See More: PuzzmoMost PopularThe best horror to watch on Netflix this FebruaryCaptain America: Brave New World is a mess — but the ‘5D’ version I saw was even messierWhy is the Red Hulk red?Was Captain America: Brave New World’s post-credits scene shot in 2010?5 great co-op games are on deep discount in Steam’s new salePatch NotesThe best of Polygon in your inbox, every Friday.Email (required)Sign UpBy submitting your email, you agree to our Terms and Privacy Notice. This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply.Advertiser Content FromThis is the title for the native ad"
