full_description = "PuzzmoPlay Really Bad Chessby Polygon StaffApr 11, 2024, 1:00 PM UTCFacebookLink ✏️ Today’s Crossword🔗🔠 Today’s SpellTower👀 Today’s Typeshift♟️ Today’s Really Bad Chess🎨 Today’s Flipart🧩 Subscribe to Polygon on PuzzmoHow to play ChessYou are playing as white. Your goal is to use your pieces to take your opponent’s black pieces, and eventually checkmate their king.Don’t let them put your king into checkmate.Each piece type has its own movement pattern that can be seen by tapping (or hovering) over it.After making a move, be sure to confirm it by tapping again.CheckIf either the black king or white king is threatened, it will cry for help! It must either move away from the threat or have a piece moved to block the threat.CheckmateIf either king is under threat and cannot escape, or it is the only piece remaining and cannot move into a square that isn’t under threat, the game is over. If you checkmated the black king this way, you’ve won!How to play Really Bad ChessUnlike in normal chess, in Really Bad Chess the piece allocations are randomized and not mirrored. Each day, everyone on Puzzmo plays with the same piece configuration. Try to get a checkmate in the least number of moves!If you make a mistake, you can always undo — but beware, you cannot undo twice in a row.ScoringYou are scored based on the number of moves that it took to checkmate the black king. Try to win in the lowest number of moves.Moves taken before an undo still count toward your score.As always, there are many ways to play Puzzmo! If least moves isn’t your thing, consider trying to checkmate the black king in the fastest time.Keyboard controlsUse the arrow keys and space bar / return to pick up and move pieces.You can also select squares by typing in board coordinates.Polygon // PuzzmoCome play with usJoin Puzzmo!See More: PuzzmoMost PopularThe best horror to watch on Netflix this FebruaryCaptain America: Brave New World is a mess — but the ‘5D’ version I saw was even messierWhy is the Red Hulk red?Was Captain America: Brave New World’s post-credits scene shot in 2010?5 great co-op games are on deep discount in Steam’s new salePatch NotesThe best of Polygon in your inbox, every Friday.Email (required)Sign UpBy submitting your email, you agree to our Terms and Privacy Notice. This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply.Advertiser Content FromThis is the title for the native ad"
