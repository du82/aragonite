it’s defined as “a substance that has a molecular structure consisting chiefly or entirely of a large number of similar units bonded together”.There’s a nice metaphor in there for organizations, where individuals coordinate as teams, aligned around a shared vision and goals. By creating meaningful bonds between those within your organization, a strong, resilient structure can emerge. The strength the collective lies in the individual, and the strength of the individual lies in the collective.Similarly, Polymer is an apt metaphor for how we think about our software and where we are headed. Our plan as a company has always been to build a suite of apps that help people organize and coordinate. Our current hiring app is just the first stop on that journey.As we look ahead, we envision multiple applications that help simplify different facets of building an organization. They will share many similarities and core principles but each will have its own focus. As we build, a system will emerge where combinations'
