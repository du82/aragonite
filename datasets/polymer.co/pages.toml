n-left:0.75rem;margin-right:0.75rem;margin-bottom:0.75rem;padding-top:4rem;padding-bottom:4rem;}}@media (min-width: 56rem){.css-1ou9zyl-Section{margin-left:1rem;margin-right:1rem;margin-bottom:1rem;padding-top:6rem;padding-bottom:6rem;}}.css-1du5l9l-Changelog_Content{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;}.css-u8vwat-Changelog_Post{margin-bottom:2rem;display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;}.css-u8vwat-Changelog_Post:last-of-type{margin-bottom:0px;}@media (min-width: 56rem){.css-u8vwat-Changelog_Post{margin-bottom:4rem;display:grid;grid-template-columns:repeat(9, 1fr);-webkit-column-gap:2rem;column-gap:2rem;-webkit-align-items:start;-webkit-box-align:start;-ms-flex-align:start;align-items:start;}}@media (min-width: 72rem){.css-u8vwat-Changelog_Post{-webkit-column-gap:4rem;column-gap:4rem;}}.css-hdhyhm-Changelog_Date{font-size:0.75rem;color:#555555;margin-top:0px;margin-bottom:0.25rem;line-height:1.6;}@media (min-width: 56rem){.css-hdhyhm-Changelog_Date{font-size:0.875rem;margin-top:0.25rem;grid-column:1/span 2;}}.css-hdhyhm-Changelog_Date a{scroll-margin-top:5rem;}.css-hdhyhm-Changelog_Date a:hover{color:#000000;}September 5, 2024@media (min-width: 56rem){.css-l6vwnx-ChangelogPost_PostContent{grid-column:3/span 7;max-width:40rem;}}.css-l6vwnx-ChangelogPost_PostContent h2{font-weight:600;font-size:1.25rem;margin-top:0.5rem;}@media (min-width: 56rem){.css-l6vwnx-ChangelogPost_PostContent h2{font-size:1.5rem;margin-top:2rem;}.css-l6vwnx-ChangelogPost_PostContent h2:first-of-type{margin-top:0px;}}.css-l6vwnx-ChangelogPost_PostContent p{margin-top:0.75rem;margin-bottom:0.75rem;line-height:1.6;}@media (min-width: 40rem){.css-l6vwnx-ChangelogPost_PostContent p{margin-top:1rem;margin-bottom:1rem;font-size:1rem;}}.css-l6vwnx-ChangelogPost_PostContent p a{font-weight:450;color:#000000!important;-webkit-text-decoration:underline!important;text-decoration:underline!important;}.css-l6vwnx-ChangelogPost_PostContent ul{margin-top:0.75rem;margin-bottom:0.75rem;margin-left:2rem;line-height:1.6;list-style-type:disc;}@media (min-width: 40rem){.css-l6vwnx-ChangelogPost_PostContent ul{margin-top:1rem;margin-bottom:1rem;font-size:1rem;}}.css-l6vwnx-ChangelogPost_PostContent ul li{margin-top:0.5rem;margin-bottom:0.5rem;}Swedish Added as an Option for Job Board Localization Swedish has been added as a language option for job board localization. We are still taking requests for additional languages. Added reCAPTCHA to Login Form reCAPTCHA has been added to the Login and Sign-Up form to improve site security by protecting against spammers.Other improvements & fixesBrowsers now persist login via Magic Link.Salary inputs are now validated correctly across all browsers.A minor issue with existing Polymer users accepting an invitation to a new Organization was fixedAugust 22, 2024Improved Billing UI & UX We have introduced several enhancements to the "Plan & billing" section, including the option to sign up for a monthly or annual plan. User experience improvements include:Your selected plan is now highlighted in the UI. Updating your plan in Polymer now opens the Stripe portal, allowing you to confirm all amounts and change your payment method if desired. You can now add a promo code yourself when checking out. The UI has been updated in "Plan & billing" to more prominently display any applied promo codes. You can now access your billing details and invoices even after canceling your Polymer plan.June 6, 2024Hiring Stage Message Automations You can now configure message automations for each hiring stage, allowing a template-based email message to be triggered when a candidate is moved to that stage. The basic setup involves selecting a message template for the automation and choosing whether to send the message "once" or "every time" a candidate enters a stage. Automations can be easily enabled, disabled, or edited for any hiring stage via the Automations tab in Job Setup. Additionally, the user interface now includes an info box wherever you can move a candidate, informing you if an automation is active.Application Question Answers to Review Kit Application question answers submitted by candidates through the application form are now included in the Review Kit. This provides more information to those with the Reviewer role and ensures that candidate information is readily available during interviews or when writing up interview notes. Disable 3rd Party Distribution for Individual Jobs You can now opt individual jobs out of third-party distributions, such as LinkedIn and X Hiring, directly in Job Setup. This allows for more granular control over which job posts are shared.April 12, 2024LinkedIn Integration A new LinkedIn integration is now available, allowing you to automatically post your Polymer job listings to the Jobs tab on your company's LinkedIn page. Once enabled, any updates or changes you make in Polymer will be reflected on LinkedIn, typically within a few hours, ensuring your job posts stay current. This integration uses LinkedIn’s "Limited Listings," meaning you can post jobs for free, but you will not be able to promote these listings directly through LinkedIn. To enable this feature, head to the Integrations section in your Account Settings. For detailed setup instructions, refer to our documentation.X Hiring Integration We have launched an integration with X Hiring beta, allowing you to post your jobs for free on X's platform and organically reach millions of relevant candidates. For Verified Organizations on X, you can link jobs to your profile and feature roles by reaching out to X Hiring support. For non-Verified Organizations, your published Polymer job posts will automatically appear in X's job search but will not be connected to any specific profile. For more details, see our documentation.January 30, 2024Select candidates for bulk actions We improved bulk actions for candidates by adding ability to select or deselect candidates in a hiring stage before sending a bulk message, or bulk moving candidates to a different stage. Candidate uploadsA new custom question type has been added that allows candidates to upload files to their applications. Supported file types include audio files, image files, excel/csv, word/pdf (document) and txt files.Other improvements & fixesAdded list-unsubscribed header to all emails to improve deliverabilityAn issue where some incoming candidate messages were parsed incorrectly is fixedDecember 20, 2023Review RequestReview Requests allow hiring team members to request candidate reviews from any member of the organization with any user role. This will send an email to the organization email with a link directly to the review page for that candidate! Any hiring team member can request a review via email address from someone who is not yet a member o'''
