s-1g9ykz2-BlogPost_Content h4{font-size:1.125rem;margin-top:2rem;margin-bottom:-0.5rem;}}.css-1g9ykz2-BlogPost_Content p{margin-top:1rem;line-height:1.6;}@media (min-width: 40rem){.css-1g9ykz2-BlogPost_Content p{margin-top:1.5rem;margin-bottom:1.5rem;font-size:1rem;}}.css-1g9ykz2-BlogPost_Content p a{font-weight:450;color:#000000!important;-webkit-text-decoration:underline!important;text-decoration:underline!important;}.css-1g9ykz2-BlogPost_Content pre{margin-top:0.5rem;font-size:1.125rem;padding-left:1rem;padding-right:1rem;padding-top:0.75rem;padding-bottom:0.75rem;background-color:#F4F4F4;white-space:pre;line-height:1.6;}@media (min-width: 40rem){.css-1g9ykz2-BlogPost_Content pre{margin-top:1rem;font-size:1.25rem;}}.css-1g9ykz2-BlogPost_Content ul,.css-1g9ykz2-BlogPost_Content ol{margin-top:0.5rem;margin-bottom:0.5rem;margin-left:2rem;line-height:1.6;}@media (min-width: 40rem){.css-1g9ykz2-BlogPost_Content ul,.css-1g9ykz2-BlogPost_Content ol{margin-top:1.5rem;margin-bottom:1.5rem;font-size:1rem;}}.css-1g9ykz2-BlogPost_Content ul li,.css-1g9ykz2-BlogPost_Content ol li{margin-top:0.75rem;margin-bottom:0.75rem;}.css-1g9ykz2-BlogPost_Content ul a,.css-1g9ykz2-BlogPost_Content ol a{font-weight:450;color:#000000!important;-webkit-text-decoration:underline!important;text-decoration:underline!important;}.css-1g9ykz2-BlogPost_Content ul{list-style-type:disc;}.css-1g9ykz2-BlogPost_Content ol{list-style-type:decimal;}Diversity is ideal for innovation. In fact, diverse companies are almost 3x more likely to innovate successfully. They’re also 1.6 times more likely to satisfy and retain their customers and more likely to outperform their peers financially.To get all the benefits diversity can offer at your company, you’ll need to overcome a threat that we all face: first impression bias.Whether or not you know it, first impression bias can influence your hiring decisions, sometimes even before your first face-to-face.In this article, we’ll show you how to overcome first impression bias in your hiring process so you can find the right candidates for your business and offer a fairer hiring experience.Table of contentsWhat is first impression bias?A few biases to look out for when hiringHow to overcome cognitive biases in the hiring processMitigate your first impression bias with PolymerWhat is first impression bias?First impression bias causes people to form a quick and incomplete impression of someone based on what they see and hear in the first few seconds of meeting.Imagine you’re interviewing a job candidate for a remote position. You spot from their resume that they’re from your hometown across the country, attended the same university as you, and wear glasses.In that initial meeting (albeit on paper), you’ve formed a snap opinion without realizing it. When it comes time for the interview, you may inadvertently set a friendly and familiar tone that wouldn't have been present without this information.Your positive first impression has unfairly influenced the job interview.Fro'''
