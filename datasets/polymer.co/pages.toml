you do not agree with our policies and practices, please do not use our Services. If you still have any questions or concerns, please contact us at support@polymer.co.SUMMARY OF KEY POINTSThis summary provides key points from our privacy notice, but you can find out more details about any of these topics by clicking the link following each key point or by using our table of contents below to find the section you are looking for. You can also click here to go directly to our table of contents.What personal information do we process? When you visit, use, or navigate our Services, we may process personal information depending on how you interact with Polymer and the Services, the choices you make, and the products and features you use. Click here to learn more.Do we process any sensitive personal information? We do not process sensitive personal information.Do you receive any information from third parties? We do not receive any information from third parties.How do you process my information? We process your information to provide, improve, and administer our Services, communicate with you, for security and fraud prevention, and to comply with law. We may also process your information for other purposes with your consent. We process your information only when we have a valid legal reason to do so. Click here to learn more.In what situations and with which types of parties do we share personal information? We may share information in specific situations and with specific categories of third parties. Click here to learn more.How do we keep your information safe? We have organizational and technical processes and procedures in place to protect your personal information. However, no electronic transmission over the internet or information storage technology can be guaranteed to be 100% secure, so we cannot promise or guarantee that hackers, cybercriminals, or other unauthorized third parties will not be able to defeat our security and improperly collect, access, steal, or modify your information. Click here to learn more.What are your rights? Depending on where you are located geographically, the applicable privacy law may mean you have certain rights regarding your personal information. Click here to learn more.How do I exercise my rights? The easiest way to exercise your rights is by filling out our data subject request form available here: https://polymer.co/, or by contacting us. We will consider and act upon any request in accordance with applicable data protection laws.Want to learn more about what Polymer does with any information we collect? Click here to review the notice in full.TABLE OF CONTENTS1. WHAT INFORMATION DO WE COLLECT?2. HOW DO WE PROCESS YOUR INFORMATION?3. WHAT LEGAL BASES DO WE RELY ON TO PROCESS YOUR PERSONAL INFORMATION?4. WHEN AND WITH WHOM DO WE SHARE YOUR PERSONAL INFORMATION?5. DO WE USE COOKIES AND OTHER TRACKING TECHNOLOGIES?6. IS YOUR INFORMATION TRANSFERRED INTERNATIONALLY?7. HOW LONG DO WE KEEP YOUR INFORMATION?8. HOW DO WE KEEP YOUR INFORMATION SAFE?9. DO WE COLLECT INFORMATION FROM MINORS?10. WHAT ARE YOUR PRIVACY RIGHTS?11. CONTROLS FOR DO-NOT-TRACK FEATURES12. DO CALIFORNIA RESIDENTS HAVE SPECIFIC PRIVACY RIGHTS?13. DO WE MAKE UPDATES TO THIS NOTICE?14. HOW CAN YOU CONTACT US ABOUT THIS NOTICE?15. HOW CAN YOU REVIEW, UPDATE, OR DELETE THE DATA WE COLLECT FROM YOU?1. WHAT INFORMATION DO WE COLLECT?Personal information you disclose to usIn Short: We collect personal information that you provide to us.We collect personal information that you voluntarily provide to us when you register on the Services, express an interest in obtaining information about us or our products and Services, when you participate in activities on the Services, or otherwise when you contact us.Personal Information Provided by You. The personal information that we collect depends on the context of your interactions with us and the Services, the choices you make, and the products and features you use. The personal information we collect may include the following:namesemail addressesSensitive Information. We do not process sensitive information.Payment Data. We may collect data necessary to process your payment if you make purchases, such as your payment instrument number (such as a credit card number), and the security code associated with your payment instrument. All payment data is stored by Stripe. You may find their privacy notice link(s) here: https://stripe.com/privacy.All personal information that you provide to us must be true, complete, and accurate, and you must notify us of any changes to such personal information.Information automatically collectedIn Short: Some information — such as your Internet Protocol (IP) address and/or browser and device characteristics — is collected automatically when you visit our Services.We automatically collect certain information when you visit, use, or navigate the Services. This information does not reveal your specific identity (like your name or contact information) but may include'''
