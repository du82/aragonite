Table of contentsWhat is interview feedback?Why is providing interview feedback important?5 do’s and don’ts for delivering interview feedbackHow to record feedbackCreating a standardized feedback system8 Interview feedback examplesBuild your reputation as a great place to workWhat is interview feedback?Interview feedback is the final stage of the hiring process to close the interview process in a respectful manner. Interview feedback is usually given to candidates who weren’t successful in securing the job role.Giving feedback allows hiring managers to explain why they didn’t choose a candidate after the job interview and helps them to improve. Offering feedback shows you have legitimate reasons for not hiring someone without the influence of first impression bias.It’s best practice to follow up with feedback as soon as you’ve made the decision not to hire a candidate, removing any ambiguity or miscommunication. Offering actionable feedback provides closure for applicants, allows them to move on with thei'
