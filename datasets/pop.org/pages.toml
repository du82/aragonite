["https://pop.org/crs"]
title = "Catholic Relief Services: An Investigative Report - Population Research Institute"
description = "The Lepanto Institute and the Population Research Institute recently completed a field investigation of Catholic Relief Service’s projects in Cameroon, Zimbabwe, and Lesotho. We initiated the investigation out of concern that CRS had led the implementation of a PEPFAR program called “Determined, Resilient, Empowered, AIDS-Free, Mentored, and Safe women” (DREAMS) in several African countries, and […]"
full_description = "The Lepanto Institute and the Population Research Institute recently completed a field investigation of Catholic Relief Service’s projects in Cameroon, Zimbabwe, and Lesotho. We initiated the investigation out of concern that CRS had led the implementation of a PEPFAR program called “Determined, Resilient, Empowered, AIDS-Free, Mentored, and Safe women” (DREAMS) in several African countries, and that in this context was promoting condoms and contraception as well as implementing health referral networks that included abortion and contraception promoters and providers.1 Over the course of a year, LI and PRI received from our investigators thousands of pages of documents, recorded conversations, and photographs that, taken together, reveal that CRS has, in multiple countries, referred girls as young as 10 to abortion and contraception providers, been the “prime implementer” of projects that, through a network of partners, is designed to spread and promote contraception and condoms, and has even corrupting the good morals of young girls with its own materials. The Population Research Institute is 501(c)(3)All of our PRI articles, unless otherwise noted, are released under a Creative Commons Attribution-No Derivatives license. You are free to reproduce these articles, as long as you do not change them, and you credit us as follows: “Population Research Institute, https://www.pop.org”. All the rest of the material on this site, such as pages, screens, and images, are under copyright by Population Research Institute. Please contact us for information on reuse. People pictured on this site do not thereby express agreement with our views."
