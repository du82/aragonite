title = "Sex-Selective Abortion in India - Population Research Institute"
description = "Due to a strong, culturally-rooted preference for sons in many parts of the world, millions of girls have been selectively aborted merely because their parents had wanted a boy instead. In some patriarchal cultures, strong son preference leads to the practice of sex selection—methods some parents use to select the sex of their child, including […]"
full_description = "Due to a strong, culturally-rooted preference for sons in many parts of the world, millions of girls have been selectively aborted merely because their parents had wanted a boy instead. In some patriarchal cultures, strong son preference leads to the practice of sex selection—methods some parents use to select the sex of their child, including sex-selective abortion, female infanticide, or post-birth neglect or abandonment. In decades past, the practice of sex selection primarily involved neglect of daughters and female infanticide. Since the introduction of ultrasound technology made it easy and affordable for parents to find out the sex of their child prior to birth, the practice of sex-selective abortion became widespread in many parts of eastern and southern Asia, the Caucasus, and the Balkans. Most of these selective terminations have occurred in either China or India. In India, we have found that approximately 15.8 million girls have gone ‘missing’ at birth due to sex-selective abortion since 1990. Due to varying assumptions on what the expected sex ratio at birth should be in the absence of sex selection, however, the actual number of sex-selective abortions in India could range from as low as 11.1 million to as high as 20.2 million. Sex-selective abortion is the abortion of a preborn child simply because the child’s sex was not what the parents wanted. In countries where culturally-rooted son preference is common, sex-selective abortion is used as a means to attain a couple’s desired number of sons and desired family composition. Sex-selective abortion constitutes violence against women and is a serious violation of the fundamental rights and equal dignity of women. 1. Son Preference – Throughout much of India, sons are often valued to carry on the family name and receive inheritance. According to traditional Hindu custom, important religious rituals such as the lighting the funeral pyre must be performed by a son to assure that parents have a good afterlife. Sons also provide parents with the assurance that they will be cared for—physically, emotionally, and financially—in sickness and old age."
year_published = 2019
year_updated = 2025
