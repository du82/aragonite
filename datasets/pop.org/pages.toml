["https://pop.org/episode-6-urbanization-whos-afraid-of-the-big-bad-city"]
title = "Episode 6: Urbanization: Who’s Afraid of the Big Bad City? - Population Research Institute"
description = "https://www.youtube.com/watch?v=7QWAXWhtSCQCities are overcrowded. The world is not. Table of Contents   Innovation, Collaboration, and Economic Development are possible only in cities. Why is that? When more people are grouped together, they are able to put their minds together and come up with better ideas and ways to improve in their society. Because of this, the […]"
full_description = "In principle, cities offer a more favourable setting for the resolution of social and environmental problems than rural areas. Cities generate jobs and income. With good governance, they can deliver education, health care and other services more efficiently than less densely settled areas simply because of their advantages of scale and proximity. “It is a simple fact that the source of improvements in productivity is the human mind, and a human mind is seldom found apart from a human body. And because improvements — their invention and their adoption — come from people, it seems reasonable to assume that the amount of improvement depends on the number of people available to use their minds.” This document from the UN shows the urban vs. rural birthrates for a lot of countries (See table 11). Another study from the DHS (Demographic and Health Surveys) website. They did an extensive fertility study in Malawi in 2000. This study shows a drastic difference between rural and urban dwelling women. The Total Fertility Rates for rural vs. urban being 6.7 and 4.3 respectively. Since 2008, more than half the world’s population has become urbanized. There is a clear rural to urban draw going on globally. Given the connection between population numbers and human improvement (see question 1 above), it makes sense that the urban population percentage is growing. There are more opportunities in the city than in the countryside. The Population Research Institute is 501(c)(3)All of our PRI articles, unless otherwise noted, are released under a Creative Commons Attribution-No Derivatives license. You are free to reproduce these articles, as long as you do not change them, and you credit us as follows: “Population Research Institute, https://www.pop.org”. All the rest of the material on this site, such as pages, screens, and images, are under copyright by Population Research Institute. Please contact us for information on reuse. People pictured on this site do not thereby express agreement with our views."
