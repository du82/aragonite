["https://www.pop.org/about-home"]
title = "Who We Are - Population Research Institute"
description = "The Population Research Institute is a non-profit research group whose goals are to… expose the myth of overpopulation expose human rights abuses committed in population control programs make the case that people are the world’s greatest resource Our growing global network of pro-life groups spans over 80 countries. Our Mission The Population Research Institute is […]"
full_description = 'The Population Research Institute is a (501c3) non-profit research organization whose core values hold that people are the world’s greatest resource. PRI’s goals are to educate on this premise, to expose the myth of overpopulation, and to expose human rights abuses committed in population control programs. Our growing, global network of pro-life groups spans over 80 countries. Debunk the myth of overpopulation, which cheapens human life and paves the way for abusive population control programs Expose the relentless promotion of abortion, abortifacient contraception, and chemical and surgical sterilization in misleadingly labeled “population stabilization,” “family planning,” and “reproductive health” programs. Emphasize that people are the most valuable resource on the planet, the one resource we cannot do without. Fr. Paul Marx, O.S.B. was a pioneer in the worldwide pro-life movement. He became involved in the movement in the 1960s, writing his first pro-life news article in 1967.Fr. Marx had a Doctorate in Family Sociology from the Catholic University in Washington, DC. He did post-graduate work at Harvard, the University of California at Berkeley, and the American University in Washington, D.C. <img fetchpriority="high" decoding="async" class="alignleft size-full wp-image-53908" src="https://pop.org/wp-content/uploads/2024/02/FrMarx-212x300-1.jpeg" alt="FrMarx 212x300 1" width="212" height="300" title="Who We Are 7">He was ordained to the priesthood on June 15, 1947 by the Order of St. Benedict. After nearly two decades on the faculty of St. Johns University, he was permitted by his order to work on pro-life issues full time. He undertook the task of spreading the pro-life message with his characteristic vision, leadership, and energy. In 1972, he started the Human Life Center at St. John’s University in Collegeville, Minnesota. Moving to Washington, DC, Fr. Marx founded Human Life International in 1981, and the Population Research Institute in 1989.'
