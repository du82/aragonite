title = "Job Opening: Digital Content Creator - Population Research Institute"
description = "Job Title: Digital Content Creator Job Type: Part-Time / 20 hours per week (with the potential to develop into a full-time role) Location: PRI office in Front Royal, VA   Position Overview: As a Digital Content Creator, you will be at the forefront of our digital marketing efforts, responsible for creating visually compelling, educational content […]"
full_description = "As a Digital Content Creator, you will be at the forefront of our digital marketing efforts, responsible for creating visually compelling, educational content across various platforms. Your role will involve editing social media video content, designing graphics, and collaborating with our team to enhance our online visibility and engagement. You will play a critical role in showcasing our organization’s mission and achievements to a global audience. The Population Research Institute is a (501c3) non-profit research organization whose core values hold that people are the world’s greatest resource. PRI’s goals are to educate on this premise, to expose the myth of overpopulation, and to expose human rights abuses committed in population control programs. Interested candidates should submit a resume, cover letter, desired hourly rate, and relevant samples of completed video editing and graphic design work, if available, to thomas@pop.org. The Population Research Institute is 501(c)(3)All of our PRI articles, unless otherwise noted, are released under a Creative Commons Attribution-No Derivatives license. You are free to reproduce these articles, as long as you do not change them, and you credit us as follows: “Population Research Institute, https://www.pop.org”. All the rest of the material on this site, such as pages, screens, and images, are under copyright by Population Research Institute. Please contact us for information on reuse. People pictured on this site do not thereby express agreement with our views."
