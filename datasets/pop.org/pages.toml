description = "Give the gift of life! PRI’s group of monthly donors, the “Circle for Life,” supports our pro-life work throughout the year. Become a monthly donor to receive a cloisonné single decade rosary bracelet  Our cloisonné single decade rosary bracelets are hand made by women and mothers in the PRI safehouse program. Cloisonné is an ancient Chinese […]"
full_description = "We’ll fight to end the $700 million Planned Parenthood receives annually in taxpayer dollars, ensuring no U.S. citizen is forced to fund abortion. PRI will push for the State Department to end its promotion of abortion and gender ideology overseas, advocating instead for pro-life, pro-family policies. PRI will expose violations of state laws banning the abortion drugs, mifepristone and misoprostol, from being mailed and demand stricter enforcement. We will also push for the Department of Justice to enforce the longstanding federal ban on using the U.S. Postal Service to deliver these deadly drugs. PRI will lead efforts to expand the Mexico City Policy, cutting off billions in funding for abortion groups worldwide. We’ll reveal their activities and provide the evidence policymakers need to defund them entirely. We’ll work to defund the UN Population Fund, along with any other UN agencies complicit with population control. PRI will investigate and expose abuses, equipping leaders with the proof to take action. PRI will advocate to enshrine the Hyde Amendment into permanent law and prevent federal agencies, including the Veterans Administration and Defense Department, from funding or facilitating abortions. The Population Research Institute is 501(c)(3)All of our PRI articles, unless otherwise noted, are released under a Creative Commons Attribution-No Derivatives license. You are free to reproduce these articles, as long as you do not change them, and you credit us as follows: “Population Research Institute, https://www.pop.org”. All the rest of the material on this site, such as pages, screens, and images, are under copyright by Population Research Institute. Please contact us for information on reuse. People pictured on this site do not thereby express agreement with our views."
