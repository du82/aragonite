["https://pop.org/episode-1-overpopulation-the-making-of-a-myth"]
title = "Episode 1: Overpopulation: The Making of a Myth - Population Research Institute"
description = "https://www.youtube.com/watch?v=vZVOU5bfHrMWhere did this myth come from? When was humanity supposed to end? Table of Contents   Did Malthus really say to kill off the poor? Yep. In his Essay on the Principle of Population, Malthus calls for increased mortality among the poor: All the children born, beyond what would be required to keep up the […]"
full_description = "All the children born, beyond what would be required to keep up the population to this level, must necessarily perish, unless room be made for them by the deaths of grown persons… To act consistently therefore, we should facilitate, instead of foolishly and vainly endeavoring to impede, the operations of nature in producing this mortality; and if we dread the too frequent visitation of the horrid form of famine, we should sedulously encourage the other forms of destruction, which we compel nature to use. Instead of recommending cleanliness to the poor, we should encourage contrary habits. In our towns we should make the streets narrower, crowd more people into the houses, and court the return of the plague. In the country, we should build our villages near stagnant pools, and particularly encourage settlements in all marshy and unwholesome situations. (Book IV, Chap. V) — Read it online. “But above all, we should reprobate specific remedies for ravaging diseases; and those benevolent, but much mistaken men, who have thought they were doing a service to mankind by projecting schemes for the total extirpation of particular disorders. (Book IV, Chap. V) — Read it online.” “The battle to feed all of humanity is over. In the 1970s the world will undergo famines–hundreds of millions of people will starve to death in spite of any crash programs embarked upon now.” The United Nations Fund for Population Activities (UNFPA) was founded in 1969, the year after Ehrlich published The Population Bomb. They have been involved in programs with governments around the world who deny their women the right to choose the number and spacing of their children. Their complicit work with the infamous “one-child policy” mandated by the government of the People’s Republic of China, uncovered by an investigation of the U.S. State Department in 2001, led the United States to pull its funding. The wealthy of the West, in their terror of poverty, have given copiously to the UNFPA and its population control programs. Visit Population Research Institute for more info."
