full_description = 'Cherishing Childhood Stephen C. Fischer January 24, 2025 We cherish children because of Christmas. Many pre-Christian civilizations practiced ritual child sacrifice. From the Carthage of Hannibal in northern Africa to the empire of the Aztecs, the slaughter of the innocents to placate angry gods went on throughout the year around the world. “Not every individual pagan is guilty of the hatred of children,” writes John Saward in The Way of the Lamb, “But most pagan cultures tolerate the murder of children: if not by cult, then through abortion and infanticide.” Before the coming of Christ, even the wisest among the pagans considered the child an incomplete human, an inferior being, little more than a piece of property. Trump’s Victory Breathes New Life into the Pro-Life Fight Carlos Polo January 16, 2025 Donald Trump is, everyone admits, no typical politician. And it’s not just the Trump dance or his “Fight, fight, fight” courage under fire. What really strikes fear into the hearts of elite politicians, who bend to trends and say only Slaughter of young Americans from deadly fentanyl produced in Chinese labs must end Steven W. Mosher October 20, 2024 In May 2019, China declared a “People’s War” on the United States. This phrase, which comes from the days of Chairman Mao, meant that the Chinese Communist Party had determined to use all the weapons at its disposal – short <img loading="lazy" loading="lazy" width="768" height="512" src="https://www.pop.org/wp-content/uploads/2024/07/Javier-Milei-VIVA22-2-768x512.jpg" class="attachment-medium_large size-medium_large wp-image-55118" alt="Javier Milei VIVA22 2" decoding="async" srcset="https://www.pop.org/wp-content/uploads/2024/07/Javier-Milei-VIVA22-2-768x512.jpg 768w, https://www.pop.org/wp-content/uploads/2024/07/Javier-Milei-VIVA22-2-300x200.jpg 300w, https://www.pop.org/wp-content/uploads/2024/07/Javier-Milei-VIVA22-2-1024x683.jpg 1024w, https://www.pop.org/wp-content/uploads/2024/07/Javier-Milei-V