["https://www.pop.org/simple/pri-faqs-frequently-asked-questions"]
title = "Frequently Asked Questions - Population Research Institute"
description = "Q: What is population control? A: Population control is any top-down policy that controls people’s reproduction as a means to achieving some other policy goal. Some of these policy goals may sound good (“to improve the economy”) and some may be intrinsically wrong (“to reduce a minority population”) but treating people’s reproductive lives as mere […]"
full_description = "A: Population control is any top-down policy that controls people’s reproduction as a means to achieving some other policy goal. Some of these policy goals may sound good (“to improve the economy”) and some may be intrinsically wrong (“to reduce a minority population”) but treating people’s reproductive lives as mere tools to help achieve policy goals is always wrong and misguided. The end never justifies the means. Population control is unscrupulously manipulative, violating a person’s right to informed consent and a couple’s right to freely decide upon their desired family size. A: PRI documents and exposes abusive population control programs through investigative research. PRI also fights to ensure that current laws against coercion and force are followed in international aid organizations. We educate people around the world about the nature of coercive programs and the misconceptions behind these programs. We emphasize the world’s most undervalued resource—humans. A: Many point to Thomas Malthus as the intellectual godfather of the population control movement. In 1798, Malthus wrote An Essay on the Principles of Population, stating: “Must it not then be acknowledged by an attentive examiner of the histories of mankind, that in every age and in every state in which man has existed, or does now exist: And that the superior power of population it repressed, and the actual population kept equal to the means of subsistence, by misery and vice.” Eugenics entered the mainstream worldview of the social elite in the late 1800s with the advent of Francis Galton and genetic sciences. At the time, population controllers defined which populations needed to be controlled by their presumed intelligence and their sexual practices, targeting the “unfit” and “perverse” for sterilization. Compulsory eugenic laws were passed in Europe and the United States throughout the 1900s. With the end of World War II and the horror of the Holocaust, eugenics lost much of its popular credibility, although several American states kept their compulsory sterilization laws on the books."
year_published = 2025
