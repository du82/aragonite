["https://pop.org/subscribe-weekly-briefing"]
title = "Facts on Global Population, Agenda 2030, Depopulation, Overpopulation"
description = "Subscribe to our Weekly Briefing and PRI Insider email series and get pro-life news and perspective directly in your inbox each Tuesday and Friday!"
full_description = "PRI reports on current events as they unfold around the world from our home base in the US, and our offices in Italy, Peru, and Spain, and connections in many more countries, including China. PRI warns people on the looming depopulation crisis, which even includes the slipping birth rate in the U.S. PRI also monitors the progression of ideologically driven agendas pushed by powerful leaders or organizations, such as the United Nations, that involve population control and human rights violations. Whether countering the lies of the CDC or announcing the latest political win for traditional values, the Weekly Briefing keeps you up to date. Mosher has since dedicated himself to ending population control programs, as well as exposing the human rights abuses undertaken by the brutal Chinese Communist Party regime. Mosher is often featured on Fox News’s “Tucker Carlson Tonight” and is the author of Bully of Asia: Why China’s Dream is the New Threat to World Order. Mosher has been a frequent guest on “Tucker Carlson Tonight” and brought the truth to light on both Tucker’s show, and in publications around the world. Learn the truth by subscribing to PRI’s Weekly Briefing. Since its founding, the Population Research Institute has fought the myth that the world is overpopulated, proving time and time again that the world has more than enough room for all. Subscribe to our Weekly Briefing, where we discuss why more people, not less, are the solution to Earth’s problems. “We need to watch out for population collapse. Some people think that the world has too many humans—but that’s just because they live in a city. All humans on earth could fit in the city of New York on one floor. It’s not exactly a secret, low birth rates and population collapse are a big risk. This is not a good way to end.” “A lot of people just think that having kids is somehow bad for the environment. I want to be clear it’s not. It’s essential for maintaining civilization. We don’t necessarily need to grow dramatically, but at least let’s not gradually dwindle away until civilization ends with us all in adult diapers and in a whimper.”"
year_published = 2024
year_updated = 2024
