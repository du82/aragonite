["https://www.pop.org/our-achievements"]
title = "Our Achievements - Population Research Institute"
description = "Church and Lay Leaders Praise PRI Cardinal Arinze “God bless you and the Population Research Institute for your good work of informing people correctly, so that they see that population increase is not a primary cause of underdevelopment … and that no country should impose on another, more so when it is a question of […]"
full_description = "“I have totally supported the crucial pro-life work of the Population Research Institute since it was founded by my dear friend, Father Paul Marx. And now, as president of PRI, Steve Mosher is faithfully and successfully following the pro-life strategies established by Father Marx for PRI. Without hesitation, I urge you to join me in actively supporting the vital pro-life work of the Population Research Institute.” Former Apostolic Nuncio, Permanent Observer of the Holy See to the UN “…the work [of PRI] is timely and important. Such investigative research and its results can assist … this Mission in promoting authentic Christian and human values.” PRI has helped cut $800 million from the budgets of anti-natalists. Over the years, our investigations have helped pro-life Members of Congress strip agencies like USAID and UNFPA of hundreds of millions of dollars in taxpayer funding. Planned Parenthood and other abortion groups were frozen out of a whopping $800 million in taxpayer funding, thanks in part to research that PRI provided to pro-lifers in Congress! “May the Lord bless you and your work abundantly. I’m deeply grateful for the good example you give to all of us in the Church.” —Cardinal Chaput Our YouTube video channel has 5.1 million views and counting. Our smart, funny POP101 Videos, in particular, have exposed the myth of overpopulation with over 2.3 million views. Working closely with the Pontifical Council for the Family, now in our seventh year together, PRI teaches Church and lay leaders around the world how to fight abortionists effectively in their own dioceses. The Vatican’s Pontifical Council, for instance, assigned us the monumental task of setting the agenda for over 100 pro-life organizations around the world. PRI regularly briefs U.S. pro-life legislators, Catholic journalists, and Church lay leaders on key abortion and key pro-family issues. PRI representatives have appeared on major TV and radio news programs, including Fox, CNN and EWTN, 60 Minutes, The Today Show, Raymond Arroyo’s The World Over and many others. You’ll also frequently see PRI experts quoted at length in major print and electronic publications, including the National Catholic Register . . . Our Sunday Visitor . . . Catholic Online . . . LifeSiteNews.com . . . LifeNews and many more."
