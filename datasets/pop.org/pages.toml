["https://pop.org/population-control-myth"]
title = "What is Population Control? - Population Research Institute"
description = "What is Population Control? It is any top-down attempt to control the population size of a group of people through coercive, violent, or deceptive means. Where did it come from? In 1798, an Anglican minister by the name of Thomas Malthus published the first edition of his An Essay on the Principle of Population where […]"
full_description = "Since 1990, approximately 15.8 million girls in India have been eliminated through sex-selective abortion and other forms of prenatal sex selection (full investigation) 1 of out 3 Indian women have been sterilized. One third did not give their consent. China’s rise will lead to massive human rights violations around the world. Sex trafficking ring found selling Pakistani women into prostitution in China. Uganda sanctions Marie Stopes for Faulty Condoms. Abortion giant’s condoms – like its reputation – are in tatters. Kenyans, pro-life advocates resists promotion of abortion & sex education at U.N. Nairobi Conference. Bernie Sanders is a real blast from the past. Not only does the aging pol peddle failed socialist ideas that are better at producing tyranny than prosperity, now he’s recycling the long discredited idea that we are breeding ourselves off the face of the planet. Even that other New York City newspaper long ago abandoned the cherished leftist belief in “overpopulation,” calling it one of the myths of the 20th century. A group of over 11,000 scientists are calling for population control measures to avoid severe human suffering from global climate change, a notion a demographer says is heavily tied to money and not actual science… The leader of the world’s largest democracy has called for population control policies to contain what he claims is a “reckless population explosion” in India. In a high-profile and widely publicized address to the nation… Everyone knows that the world is overpopulated, or soon will be. But what if everyone is wrong? Ask anyone if the world is overpopulated, and you know what they will say. The idea that we humans are breeding ourselves to death—and taking the planet with us–is in the air that we breathe. It was drummed into us in high school biology, where we were told that the world is like a tiny “lifeboat.” We have to lighten the load, our teachers told us, or the “lifeboat” will sink and we will all die…"
