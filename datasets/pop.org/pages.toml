["https://pop.org/episode-4-poverty-where-we-all-started"]
title = "Episode 4: Poverty: Where We All Started - Population Research Institute"
description = "https://www.youtube.com/watch?v=KUY4ztwIVfAWhy poverty isn’t caused by “overpopulation.” Table of Contents   How is poverty defined, for the purposes of this video? For the purposes of this video, we use the World Bank’s definition of poverty. The World Bank defines poverty as: … pronounced deprivation in well-being, and comprises many dimensions. It includes low incomes and the […]"
full_description = "… pronounced deprivation in well-being, and comprises many dimensions. It includes low incomes and the inability to acquire the basic goods and services necessary for survival with dignity. Poverty also encompasses low levels of health and education, poor access to clean water and sanitation, inadequate physical security, lack of voice, and insufficient capacity and opportunity to better one’s life. You can find this definition of poverty online here. At PRI, we like this definition because it recognizes the true nature of poverty — that poverty is not just a state of having less money or posessions than others around you. Although those details are an integral part of poverty, real poverty is the lack of dignity and quality of life that results from that lack of money or possessions. In other words, human beings require more than simple survival to make our lives worth living. This is why talking about poverty in terms of statistics can be tricky sometimes, as we will see below. The thing to remember about poverty is that it isn’t a disease or a “condition,” like the measles or a broken leg. Poverty is the state of not having what we need. It is a terrible state to be in, to be sure, but it is the state we all revert to when our support structures are removed. Poverty is like darkness: it isn’t a thing. It’s the lack of a thing. Essentially, the only way that poverty has ever been defeated, anywhere, is by infrastructures that humans have set up. So, when poverty does exist, it is when these infrastructures either 1) don’t exist, like in underdeveloped nations, or 2) are broken or have holes in them. Essentially, fixing poverty is about fixing bad infrastructure, not about eliminating people. This is made obvious by the fact that the poorest nations in the world are often among the least populated. Take the Congo, for instance, which is one of the poorest countries in the world, with a meager per capita GDP of only $300. The Congo’s population density is only 75 people per square mile, a fairly light population density. Compare this with the Netherlands, one of the wealthiest countries in the world with per capita GDP of $39,200. The Netherlands has a population density of 1,039 people per square mile. (these numbers come from the CIA World Factbook.)"
