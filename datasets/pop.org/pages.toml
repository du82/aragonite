title = "Episode 2: 2.1 Kids: A Stable Population - What is the Replacement Fertility Rate? - Population Research Institute"
description = "https://www.youtube.com/watch?v=zBS6f-JVvTYWhat does it take to replace ourselves? Are we doing it? Table of Contents   Which scientists say it takes 1 person to replace another? Where does the 2.1 come from? Wouldn’t replacement rate fertility be 2.0? Replacement rate fertility requires each woman to replace herself. According to the CIA World Factbook, there are 107 boys […]"
full_description = "Society is made up of old people and young people. Old people didn’t start off old; they were once young: working, having families, and paying taxes. These young people gradually age until they are old and no longer able to work. When this happens, it is important for them to be fully replaced by a new generation of young people. These young people will in turn work, have families, and pay taxes, which go in part to supporting the elderly population which can no longer support itself. However, this setup only works if the young are more or less equal in number to the elderly. If the number of workers becomes too few to support the number of elderly, then the whole system faces the danger of a catastrophic collapse. Witness the debate over Social Security. The list of developed countries is taken from the U.N.’s list of countries with very high human development (page 213). The Total Fertility Rates for these countries are taken from the CIA World Factbook for 2010. Check it online. The Population Research Institute is 501(c)(3)All of our PRI articles, unless otherwise noted, are released under a Creative Commons Attribution-No Derivatives license. You are free to reproduce these articles, as long as you do not change them, and you credit us as follows: “Population Research Institute, https://www.pop.org”. All the rest of the material on this site, such as pages, screens, and images, are under copyright by Population Research Institute. Please contact us for information on reuse. People pictured on this site do not thereby express agreement with our views."
