full_description = 'Population Research Institute is a trusted source for: <img decoding="async" width="244" height="28" src="https://www.pop.org/wp-content/uploads/2024/01/epochtimes.svg" class="attachment-large size-large wp-image-31154" alt="epochtimes" title="Homepage 2024 39"> <img decoding="async" width="241" height="36" src="https://www.pop.org/wp-content/uploads/2024/01/newyorkpost.svg" class="attachment-large size-large wp-image-31155" alt="newyorkpost" title="Homepage 2024 40"> <img decoding="async" width="379" height="32" src="https://www.pop.org/wp-content/uploads/2024/01/wallstreetjournal.svg" class="attachment-large size-large wp-image-31156" alt="wallstreetjournal" title="Homepage 2024 41"> <img loading="lazy" decoding="async" width="155" height="41" src="https://www.pop.org/wp-content/uploads/2024/01/ewtn.svg" class="attachment-large size-large wp-image-31157" alt="ewtn" title="Homepage 2024 42"> <img loading="lazy" decoding="async" width="92" height="48" src="https://www.pop.org/wp-content/uploads/2024/01/lifesite.svg" class="attachment-large size-large wp-image-31158" alt="lifesite" title="Homepage 2024 43"> Our Mission The Population Research Institute is a (501c3) non-profit research organization. Our core values hold that people are the world’s greatest resource. Our goals are to educate on this premise, to expose the myth of overpopulation, and to expose human rights abuses committed in population control programs. Our growing, global network of pro-life groups spans over 80 countries.We pledge to: <img loading="lazy" decoding="async" width="115" height="92" src="https://www.pop.org/wp-content/uploads/2024/01/debunk.svg" class="attachment-large size-large wp-image-31159" alt="debunk" title="Homepage 2024 44"> Debunk The myth of overpopulation, which cheapens human life and paves the way for abusive population control programs <img loading="lazy" decoding="async" width="117" height="73" src="https://www.pop.org/wp-content/uploads/2024/01/expose.svg" class="attachment-large size-large wp-image-31160" alt="" title="Homepage 2024 45"> Expose The relentless promotion of abortion, abortifacient contraception, and chemical and surgical sterilization in misleadingly labeled “population stabilization,” “family planning,” and “reproductive health” programs. <img loading="lazy" decoding="async" width="112" height="90" src="https://www.pop.org/wp-content/uploads/2024/01/defund.svg" class="attachment-large size-large wp-image-31161" alt="defund" title="Homepage 2024 46"> Defund These anti-human programs by exposing the coercion, deception, and racism inherent in them <img loading="lazy" decoding="async" width="97" height="105" src="https://www.pop.org/wp-content/uploads/2024/01/emphasize.svg" class="attachment-large size-large wp-image-31162" alt="emphasize" title="Homepage 2024 47"> Emphasize That people are the most valuable resource on the planet, the one resource we cannot do without. <img loading="lazy" decoding="async" width="112" height="85" src="https://www.pop.org/wp-content/uploads/2024/01/promote.svg" class="attachment-large size-large wp-image-31163" alt="promote" title="Homepage 2024 48"> Promote Pro-natal and pro-family attitudes, laws, and policies worldwide. <img loading="lazy" decoding="async" width="73" height="105" src="https://www.pop.org/wp-content/uploads/2024/01/encourage.svg" class="attachment-large size-large wp-image-31164" alt="encourage" title="Homepage 2024 49"> Encourage Programs to help the poor become agents of their own development. Weekly Briefing Population Control is Now Mind Control <img loading="lazy" decoding="async" width="800" height="534" src="https://www.pop.org/wp-content/uploads/2025/02/072a7dee-750a-49de-81fb-92a5a78e7041-1024x683.jpg" class="attachment-large size-large wp-image-58830" alt="072a7dee 750a 49de 81fb 92a5a78e7041" srcset="https://www.pop.org/wp-content/uploads/2025/02/072a7dee-750a-49de-81fb-92a5a78e7041-1024x683.jpg 1024w, https://www.pop.org/wp-content/uploads/2025/02/072a7dee-750a-49de-81fb-92a5a78e7041-300x200.jpg 300w, https://www.pop.org/wp-content/uploads/2025/02/072a7dee-750a-49de-81fb-92a5a78e7041-768x512.jpg 768w, https://www.pop.org/wp-content/uploads/2025/02/072a7dee-750a-49de-81fb-92a5a78e7041-1536x1024.jpg 1536w, https://www.pop.org/wp-content/uploads/2025/02/072a7dee-750a-49de-81fb-92a5a78e7041-2048x1365.jpg 2048w" sizes="(max-width: 800px) 100vw, 800px" title="Homepage 2024 50"> Carlos Polo and Steven Mosher February 24, 2025 The days of Chinese and Peruvian women being directly coerced into forced abortions and sterilizations is over. These brutal practices still exist, but only in the most heavy-handed dictatorships. Even there they are mostly found in remote regions among persecuted minorities, such as among the Uyghurs in... Read Article <img loading="lazy" decoding="async" width="800" height="534" src="https://www.pop.org/wp-content/uploads/2025/02/072a7dee-750a-49de-81fb-92a5a78e7041-1024x683.jpg" class="attachment-large size-large wp-image-58830" alt="072a7dee 750a 49de 81fb 92a5a78e7041" srcset="https://www.pop.org/wp-content/uploads/2025/02/072a7dee-750a-49de-81fb-92a5a78e7041-1024x683.jpg 1024w, https://www.pop.org/wp-content/uploads/2025/02/072a7dee-750a-49de-81fb-92a5a78e7041-300x200.jpg 300w, https://www.pop.org/wp-content/uploads/2025/02/072a7dee-750a-49de-81fb-92a5a78e7041-768x512.jpg 768w, https://www.pop.org/wp-content/uploads/2025/02/072a7dee-750a-49de-81fb-92a5a78e7041-1536x1024.jpg 1536w, https://www.pop.org/wp-content/uploads/2025/02/072a7dee-750a-49de-81fb-92a5a78e7041-2048x1365.jpg 2048w" sizes="(max-width: 800px) 100vw, 800px" title="Homepage 2024 50"> Global Outreach Projects Our international work spans 80 countries, and includes projects to educate on the dignity of human life, to save as many babies as we can from the horrors of abortion, to assist expectant mothers, and to expose abuses in population control programs. <img loading="lazy" decoding="async" width="365" height="356" src="https://www.pop.org/wp-content/uploads/2024/07/GoodLove-to-the-Rescue.webp" class="attachment-large size-large wp-image-54936" alt="GoodLove to the Rescue" srcset="https://www.pop.org/wp-content/uploads/2024/07/GoodLove-to-the-Rescue.webp 365w, https://www.pop.org/wp-content/uploads/2024/07/GoodLove-to-the-Rescue-300x293.webp 300w" sizes="(max-width: 365px) 100vw, 365px" title="Homepage 2024 52"> GoodLove to the Rescue In recent years, Catholic parents have faced increasing challenges in their efforts to raise their children with a proper understanding of life, love, and family. While they’ve been diligently teaching their children traditional values at home, the schools they have relied… <img loading="lazy" decoding="async" width="365" height="356" src="https://www.pop.org/wp-content/uploads/2024/07/Family-Care-Centers.webp" class="attachment-large size-large wp-image-54935" alt="Family Care Centers" srcset="https://www.pop.org/wp-content/uploads/2024/07/Family-Care-Centers.webp 365w, https://www.pop.org/wp-content/uploads/2024/07/Family-Care-Centers-300x293.webp 300w" sizes="(max-width: 365px) 100vw, 365px" title="Homepage 2024 53"> Family Care Centers … You and I and our fellow PRI supporters have a God-given chance to hand a monumental defeat to Planned Parenthood, while saving hundreds and even thousands of babies in a fairly short amount of time. <img loading="lazy" decoding="async" width="365" height="356" src="https://www.pop.org/wp-content/uploads/2024/07/Keep-U.S.-Taxes-from-Funding-Population-Control-in-China.webp" class="attachment-large size-large wp-image-54937" alt="Keep U.S. Taxes from Funding Population Control in China" srcset="https://www.pop.org/wp-content/uploads/2024/07/Keep-U.S.-Taxes-from-Funding-Population-Control-in-China.webp 365w, https://www.pop.org/wp-content/uploads/2024/07/Keep-U.S.-Taxes-from-Funding-Population-Control-in-China-300x293.webp 300w" sizes="(max-width: 365px) 100vw, 365px" title="Homepage 2024 54"> Keep U.S. Taxes from Funding Population Control in China China’s infamous “planned birth” policy has brought forced abortion and sterilization, fines, persecution, and imprisonment to millions of Chinese women. For decades, the Chinese government brutally… <img loading="lazy" decoding="async" width="365" height="356" src="https://www.pop.org/wp-content/uploads/2024/07/Stop-Forced-Sterilizations-in-India.webp" class="attachment-large size-large wp-image-54938" alt="Stop Forced Sterilizations in India" srcset="https://www.pop.org/wp-content/uploads/2024/07/Stop-Forced-Sterilizations-in-India.webp 365w, https://www.pop.org/wp-content/uploads/2024/07/Stop-Forced-Sterilizations-in-India-300x293.webp 300w" sizes="(max-width: 365px) 100vw, 365px" title="Homepage 2024 55"> Stop Forced Sterilizations in India PRI has been tracking India and the abuses under its population control program for decades. We are currently working on a comprehensive report of Indian sterilization abuses, but for now, see some of our existing… <img loading="lazy" decoding="async" width="800" height="498" src="https://www.pop.org/wp-content/uploads/2024/07/Catholic-Relief-Services.jpg" class="attachment-large size-large wp-image-55138" alt="Catholic Relief Services" srcset="https://www.pop.org/wp-content/uploads/2024/07/Catholic-Relief-Services.jpg 1000w, https://www.pop.org/wp-content/uploads/2024/07/Catholic-Relief-Services-300x187.jpg 300w, https://www.pop.org/wp-content/uploads/2024/07/Catholic-Relief-Services-768x478.jpg 768w" sizes="(max-width: 800px) 100vw, 800px" title="Homepage 2024 56"> Catholic Relief Services: An Investigative Report The Lepanto Institute and the Population Research Institute recently completed a field investigation of Catholic Relief Service’s projects in Cameroon, Zimbabwe, and Lesotho. We initiated the investigation out of concern that CRS had led the implementation of a PEPFAR program called “Determined, Resilient, Empowered, AIDS-Free, Mentored, and Safe women” (DREAMS) in several African countries, and that in this context was promoting condoms and contraception as well as implementing health referral networks that included abortion and contraception promoters and providers. Read Article Meet Our President <img loading="lazy" decoding="async" width="1280" height="720" src="https://www.pop.org/wp-content/uploads/2024/01/Steven-Mosher-Teaches-Global-Pandemics.jpg" class="attachment-full size-full wp-image-31170" alt="Steven Mosher Teaches Global Pandemics" srcset="https://www.pop.org/wp-content/uploads/2024/01/Steven-Mosher-Teaches-Global-Pandemics.jpg 1280w, https://www.pop.org/wp-content/uploads/2024/01/Steven-Mosher-Teaches-Global-Pandemics-300x169.jpg 300w, https://www.pop.org/wp-content/uploads/2024/01/Steven-Mosher-Teaches-Global-Pandemics-1024x576.jpg 1024w, https://www.pop.org/wp-content/uploads/2024/01/Steven-Mosher-Teaches-Global-Pandemics-768x432.jpg 768w" sizes="(max-width: 1280px) 100vw, 1280px" title="Homepage 2024 57"> Play Video Steven W. Mosher is an internationally recognized authority on China and population issues, as well as an acclaimed author, speaker. He has worked tirelessly since 1979 to fight coercive population control programs and has helped hundreds of thousands of women and families worldwide over the years.In 1979, Steven was the first American social scientist to visit mainland China. He was invited there by the Chinese government, where he had access to government documents and actually witnessed women being forced to have abortions under the new “one-child policy.” Some abortions he witnessed were late term. Mr. Mosher was a pro-choice atheist at the time, but witnessing these traumatic abortions led him to reconsider his convictions and to eventually become a practicing, pro-life Roman Catholic.Steven has appeared numerous times before Congress as an expert in world population, China, and human rights abuses. He has also made TV appearances on Good Morning America, 60 Minutes, The Today Show, 20/20, FOX and CNN news, as well as being a regular guest on talk radio shows across the nation.He is also the author of the best-selling A Mother’s Ordeal: One Woman’s Fight Against China’s One-Child Policy. Other books include Hegemon: China’s Plan to Dominate Asia and the World, China Attacks, China Misperceived: American Illusions and Chinese Reality, Journey to the Forbidden China, Broken Earth: The Rural Chinese, and his most recent book Bully of Asia: Why ‘China’s Dream’ is the New Threat to World Order.Articles by Steve have appeared in The Wall Street Journal, Reader’s Digest, The New Republic, The Washington Post, National Review, Reason, The Asian Wall Street Journal, Freedom Review, Linacre Quarterly, Catholic World Report, Human Life Review, First Things, and numerous other publications. More Articles We publish weekly commentaries on pro-life news around the world. Key areas of focus are abortion, population control, human rights abuses, Catholic issues, and China. <img loading="lazy" decoding="async" width="800" height="533" src="https://www.pop.org/wp-content/uploads/2025/02/Javier_Milei_VIVA_24_3.jpg" class="attachment-large size-large wp-image-58749" alt="Javier Milei VIVA 24 3" srcset="https://www.pop.org/wp-content/uploads/2025/02/Javier_Milei_VIVA_24_3.jpg 800w, https://www.pop.org/wp-content/uploads/2025/02/Javier_Milei_VIVA_24_3-300x200.jpg 300w, https://www.pop.org/wp-content/uploads/2025/02/Javier_Milei_VIVA_24_3-768x512.jpg 768w" sizes="(max-width: 800px) 100vw, 800px" title="Homepage 2024 58"> Javier Milei Fights the Woke Agenda in Argentina Carlos Beltramo, Ph.D. | PRI European OfficeFebruary 18, 2025 By Carlos Beltramo, PhD President Javier Milei continues to make history in Argentina, now with even greater international support thanks to the measures his friend, President Donald Trump, is taking. While each president defends their... <img loading="lazy" decoding="async" width="800" height="534" src="https://www.pop.org/wp-content/uploads/2025/02/GettyImages-1418907713-1024x683.jpg" class="attachment-large size-large wp-image-58693" alt="GettyImages 1418907713" srcset="https://www.pop.org/wp-content/uploads/2025/02/GettyImages-1418907713-1024x683.jpg 1024w, https://www.pop.org/wp-content/uploads/2025/02/GettyImages-1418907713-300x200.jpg 300w, https://www.pop.org/wp-content/uploads/2025/02/GettyImages-1418907713-768x512.jpg 768w, https://www.pop.org/wp-content/uploads/2025/02/GettyImages-1418907713-1536x1024.jpg 1536w, https://www.pop.org/wp-content/uploads/2025/02/GettyImages-1418907713-2048x1365.jpg 2048w" sizes="(max-width: 800px) 100vw, 800px" title="Homepage 2024 59"> Pfizer Under Fire for Link Between Depo-Provera and Brain Tumors Chiara McKennaFebruary 11, 2025 For decades, the Depo-Provera contraceptive injection has been questioned for many reasons. For example, its connection to a much higher rate of STDs. But recently, evidence has surfaced about an even more serious adverse event:... <img loading="lazy" decoding="async" width="800" heigh'
