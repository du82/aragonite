["https://pop.org/donate/fcc2024"]
title = "Family Care Centers 2024 - Population Research Institute"
description = "Help Provide Ultrasound Machines to African Countries (Pictured: One of the African communities that has benefited from an ultrasound machine provided by PRI.) A message from PRI president, Steven Mosher I had to write you this letter today to tell you about a grave matter of the utmost urgency. Right now, dedicated Catholic nurses and […]"
full_description = "(Pictured: One of the African communities that has benefited from an ultrasound machine provided by PRI.) Right now, dedicated Catholic nurses and physicians in Cameroon, Nigeria and Somalia are begging PRI to donate ultrasound machines to counter the Bill Gates/Planned Parenthood abortion juggernaut. I can’t leave them in the lurch during this crisis. You see, Bill and his baby killing pals working in Africa are now working in lock- step with Biden’s population control fanatics. These combined forces have more funding and manpower than ever before to wreak destruction on babies in the womb. Bill and the other abortion fanatics are bloodthirsty. They’re dead serious about population control, and they adore abortion. They’ve turned Africa into a slaughter pen. The solution to this carnage is to expand our ultrasound donation project, which will hand the baby killers a defeat every time one of our ultrasound machines saves a baby. Prepare to be shocked. Incredible as it sounds, the Bill & Melinda Gates Foundation is pouring $1.4 billion into Africa — that’s BILLION with a “B.” That’s an astounding amount of money! At least when President Trump was in office he clipped the wings of the federal government’s international abortion outreach. Wasn’t it great to have a president who actually kept all of his pro-life promises? No president in U.S. history has been more pro- life than Trump! But now that Biden sits — dazed and confused — in the Oval Office, his puppeteers are funneling rivers of tax money to kill as many African babies as possible. This is a bloodbath. It’s up to you and me and the other friends of PRI to counter Planned Parenthood’s massive slaughter of the innocents in Africa. Thank God we’re in a position to do so! Last month, thanks to your prayers and gifts, we shipped three more ultrasound machines for delivery to Burkina Faso, Brazzaville-Congo, and Tanzania. But we need to donate many more machines to meet the need! Indeed, the need is vast. We have more requests for ultrasound machine donations than we can fulfill. Funds permitting, our goal is to donate one more ultrasound machine per month. Each machine we donate will immediately start saving babies from abortion — eventually thousands of babies."
