["https://www.pop.org/2025/01"]
title = "January 2025 - Population Research Institute"
full_description = 'PRI Insider (Volume 5, Issue 3) January 31 January 30, 2025 No Comments In This Issue: On January 18th, PRI President Steven Mosher was the keynote speaker at the Ave Maria March for Life. Over 1,300 individuals took part in this Fourth Annual Ave Maria March for Life. The March was a joint effort of the Parish Respect Life Ministry, Ave Maria University, and the Knights of Columbus. Read More » We Have 90 Days to End the War on People January 28, 2025 No Comments On Friday, President Trump signed an executive order cutting off U.S. funding to the international abortion cartel. Called the Mexico City Policy, the policy ensures “that no U.S. taxpayer money supports foreign organizations that perform or actively promote abortion in other nations.” The Mexico City Policy was first Read More » <img loading="lazy" width="2121" height="1414" src="https://www.pop.org/wp-content/uploads/2025/01/GettyImages-1093450008.jpg" class="attachment-full size-full wp-image-58557" alt="" /> Cherishing Childhood January 24, 2025 No Comments We cherish children because of Christmas. Many pre-Christian civilizations practiced ritual child sacrifice. From the Carthage of Hannibal in northern Africa to the empire of the Aztecs, the slaughter of the innocents to placate angry gods went on throughout the year around the world. “Not every individual pagan is guilty of the hatred of children,” writes John Saward in The Way of the Lamb, “But most pagan cultures tolerate the murder of children: if not by cult, then through abortion and infanticide.” Before the coming of Christ, even the wisest among the pagans considered the child an incomplete human, an inferior being, little more than a piece of property. Read More » <img loading="lazy" width="1200" height="326" src="https://www.pop.org/wp-content/uploads/2025/01/PRI-Insider-Banner-12425.png" class="attachment-full size-full wp-image-58552" alt="" /> PRI Insider (Volume 5, Issue 2) January 24 January 23, 2025 No Comments In