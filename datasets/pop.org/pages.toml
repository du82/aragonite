["https://pop.org/goodlove-to-the-rescue"]
title = "GoodLove to the Rescue - Population Research Institute"
description = "Suddenly abortion, lesbianism, sodomy, masturbation, and transgender ideology are being taught in the schools. What can we do about it? In recent years, Catholic parents have faced increasing challenges in their efforts to raise their children with a proper understanding of life, love, and family. While they’ve been diligently teaching their children traditional values at […]"
full_description = "In recent years, Catholic parents have faced increasing challenges in their efforts to raise their children with a proper understanding of life, love, and family. While they’ve been diligently teaching their children traditional values at home, the schools they have relied upon for professional instruction are often teaching the opposite. In recent years many schools, both public and private, have introduced courses in “health and sexuality” that pose a variety of problems both moral and scientific. The problem is especially evident in the so-called “affective” instructional materials. These address the emotional, rather than intellectual, aspects of the material. This new emphasis is part of the overall shift of focus in educational circles from facts and thinking to fads and feeling. It’s the Sixties mantra of “if it feels good, do it,” all over again. These challenges confront families not only in the United States, but in dozens of countries all over the world. That’s because the materials used in these courses, no matter the language and the time zone, share the same content. In the past five years, courses have been rapidly forced on grade school and high school students—even on Kindergarten children—that constitute a kind of crazy quilt of carnality. Suddenly abortion, lesbianism, sodomy, masturbation, and transgender ideology are all being taught as “science.” At the same time, the “affective” component was simple: the children are told that must celebrate this variety of vulgarity so they can “feel good about themselves and their sexuality.” That such courses violated the purity and innocence with which God had endowed children was the whole point. Thanks to the lockdowns, parents have become much more involved in their children’s education. The school closures gave families an unprecedented opportunity to “look over the shoulders” of their children and see for themselves the materials that schools had once preserved solely for the classroom."
year_published = 2023
year_updated = 2024
