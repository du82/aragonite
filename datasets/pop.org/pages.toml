["https://pop.org/episode-3-food-theres-lots-of-it"]
title = "Episode 3: Food: There’s lots of it - Population Research Institute"
description = "https://www.youtube.com/watch?v=OXrN9HhnCcMAre people hungry because there’s not enough food on Planet Earth, or is the answer more complex? Table of Contents   Who says there is enough food for everyone? Both of the world’s leading authorities on food distribution (the United Nations Food and Agriculture Organization [FAO] and the World Food Programme [WFP]) are very clear: […]"
full_description = "Exactly that. Thanks to continuing increases in crop yields, the world’s farmers are harvesting hundreds of millions of tons more grain each year on tens of millions acres less land than they did in the 1970s and ’80s. For instance, according to USDA figures, the world was producing 1.9 million metric tons of grain from 579.1 hectares of land (a hectare is 2.47 acres) in 1976. In 2004, we got 3.1 million metric tons of grain from only 517.9 hectares of land. This is quite a jump. This is not to say that we won’t possibly need to dedicate more land to farming in the future. The point is, a rise in population is not always matched by a rise in the amount of land required to feed that population. According to the Natural Resources Conservation Service’s web site, “the Conservation Reserve Program (CRP) provides technical and financial assistance to eligible farmers and ranchers to address soil, water, and related natural resource concerns on their lands in an environmentally beneficial and cost-effective manner.” What this means is that the government has created a fund to allow farmers to give their land “time off” from growing crops. This is done by “renting” the land from the farmers, so that things like grass and trees can be planted there instead of crops. This helps prevent soil erosion and encourages wildlife habitats, and reduces sedimentation in streams and lakes. The upshot of this is that our nation would never be able to afford to do this if we were anywhere near maxing out our food growing capabilities. Our current food surplus means that we are able to give some of our farmland back to the wild, instead of frantically using it all to feed a supposedly exploding population. Lots of places. Northeast Thailand and parts of Brazil, for example, were once considered inhospitable farming environments. According to the FAO, these places had disadvantages like “unreliable rainfall patterns, poor soils and a high population density in the case of Thailand; and remoteness, soils prone to acidity and toxicity and low population in the case of the Cerrado [Brazil].”"
year_published = 2022
year_updated = 2024
