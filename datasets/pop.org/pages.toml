["https://www.pop.org/simple/privacy-policy"]
title = "Privacy Policy - Population Research Institute"
description = "PRI’s commitment to your privacy and security This web site is owned and operated by the Population Research Institute (PRI). We are committed to protecting your privacy and security through the proper use of the personal information you entrust to us. We use this information to assure that you are served promptly, appropriately and satisfactorily. […]"
full_description = "This web site is owned and operated by the Population Research Institute (PRI). We are committed to protecting your privacy and security through the proper use of the personal information you entrust to us. We use this information to assure that you are served promptly, appropriately and satisfactorily. This Privacy Policy may be changed or updated if needed, and we recommend that you review these terms from time to time. Like other web sites, we also collect technical information in the background while you browse. Our server records your IP address, and which pages you visit. Any site you visit on the Internet will do this. Communication on the Internet is impossible without trading this information. If you are concerned about your online privacy, consider using a proxy server. This is like getting a P.O. Box. Only the proxy knows “where you live,” and the rest of the Internet uses the proxy IP address. Some of our online applications may also use cookies, like most web sites. A cookie is a small text file which our site saves on your hard drive. If you want a site to remember who you are for your whole visit, or “session,” a cookie is one way to do this. You can disable cookies in your browser. If you do, most of the site will continue to work, but you may lose some functionality, especially with the shopping cart. An intermediate solution is to set your browser to erase all cookies every time you close the browser. The work of PRI depends entirely on the generosity of donors like yourself. For your convenience, we offer secure online credit card processing for donations, as well as orders at our online store. We take this data very seriously—in fact, we do not collect any sensitive financial data on our web site. Before you enter your financial data, you are taken to a secure, industry-standard, third-party site. We do not store sensitive financial information in cookies, or in our web databases or server logs. All financial transactions take place through secure, third-party sites."
year_published = 2025
