full_description = "The Population Research Institute is a (501c3) non-profit research organization whose core values hold that people are the world’s greatest resource. PRI’s goals are to educate on this premise, to expose the myth of overpopulation, and to expose human rights abuses committed in population control programs. Our growing, global network of pro-life groups spans over 80 countries. Debunk the myth of overpopulation, which cheapens human life and paves the way for abusive population control programs Expose the relentless promotion of abortion, abortifacient contraception, and chemical and surgical sterilization in misleadingly labeled “population stabilization,” “family planning,” and “reproductive health” programs. Emphasize that people are the most valuable resource on the planet, the one resource we cannot do without. The Population Research Institute is 501(c)(3)All of our PRI articles, unless otherwise noted, are released under a Creative Commons Attribution-No Derivatives license. You are free to reproduce these articles, as long as you do not change them, and you credit us as follows: “Population Research Institute, https://www.pop.org”. All the rest of the material on this site, such as pages, screens, and images, are under copyright by Population Research Institute. Please contact us for information on reuse. People pictured on this site do not thereby express agreement with our views."
