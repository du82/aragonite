["https://www.pop.org/press-releases/3"]
title = "Press Releases - Population Research Institute"
full_description = '''Steven Mosher Warns Naval Sea Systems Command (NAVSEA) of the Growing Threat from China PRI Staff February 25, 2016 Steven W. Mosher, President of the Population Research Institute and expert on China, spoke yesterday at the Naval Sea Systems Command (NAVSEA) Headquarters in Washington, D.C. Mosher, invited as part of NAVSEA’s Distinguished Speaker Series, told the command leadership and staff that Beijing is not only making absurd territorial claims, building artificial islands and creating Steven W. Mosher to Testify before the Congressional-Executive Commission on China PRI Staff December 3, 2015 Steven W. Mosher, President of the Population Research Institute, to testify today before the Congressional-Executive Commission on China (CECC), co-chaired by Rep. Christopher Smith and Sen. Marco Rubio. The hearing is entitled "China's New 'Two-Child Policy' & the Continuation of Massive Crimes Against Women and Children." The hearing will take place on Thursday, December 3rd, from 10:00 a.m. China Announces End of One Child Policy PRI Staff October 29, 2015 The Chinese government is apparently ready loosen to the stranglehold it has had on reproduction in that country since the late seventies—a little bit. Under the new policy, married Chinese couples will be allowed not one, but two children. “The regime is backing away from draconian birth limits,” says Steven Mosher, President of the Population Let’s All Celebrate “Earth is for People Day” PRI Staff April 17, 2015 The Population Research Institute is hosting an “Earth is for People Day” event to celebrate people and humanity’s relationship to the environment. The president of PRI, Steven Mosher, will be answering questions on-line and spreading the message that protecting the environment should mean protecting people as well. The event will be on Earth Day at Catholic Relief Services Caught Using MTV-Produced Video Promoting Condoms in Kenya PRI Staff March 11, 2015 Front Royal, VA, March 11, 2015: Catholic Relief Services implemented Shuga, a three part video series produced by MTV which actively encourages teenagers to use condoms. Over the course of 75 minutes, Shuga features explicit sex scenes, lingerie-clad women, and lewd dancing – all of which contrast with Catholic teaching. Information on Shuga, jointly released'''
