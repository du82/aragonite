["https://popbitch.com/emails/10000-lembit-opiks"]
title = "10,000 Lembit Opiks – Popbitch"
full_description = '10,000 Lembit Opiks ************************************* Spending too much buying your daily coffee out each morning? Why not make your own? PACT will deliver everything you need to make great tasting coffee right to your door. Sign up for your first delivery (GBP 6.95) and they’ll give you next day delivery AND send you a free coffee filter set, with coffee maker, scoop and filters – which is 10GBP worth of free goodies. Just use code POPBITCH2 on sign-up: http://bit.ly/2bAuHbg ************************************* “They will soon be calling me Mr Brexit!” – Donald Trump POPBITCH _ _ _ _ _ __ ___ _ __ | |__ (_) |_ ___| |__ | ‘_ \ / _ \| ‘_ \| ‘_ \| | __/ __| ‘_ \ | |_) | (_) | |_) | |_) | | || (__| | | | | .__/ \___/| .__/|_.__/|_|\__\___|_| |_| |_| |_|18.08.16 ISSUE 798b Free email every week Subscribe http://eepurl.com/XSZoP Email stories hello@popbitch.com * A small Summer special * Maps, moustaches and more * Charts: Lazer v Snake for No 1 >> Summer somethings << Ring rang-a-dong it’s a holiday Hello. We’re off on our summer holidays at the minute, but we didn’t want you going without your weekly Popbitch hit – so we’ve prepared a few stories for you. They’re a little longer, so they should keep you going in our absence. We’ll be back soon, ready for our 800th issue this September. In the meantime, enjoy the (semi-)sunshine! pb x Every time Lady Gaga tweets she gains an average of 8,000 new followers. Which is roughly the equivalent of one Justin Lee Collins. >> All Mapped Out << The secret history of pop Beyonce’s latest single, Hold Up, is ‘impacting’ on radio this week. The song is based around a series of samples – among them Maps by the Yeah Yeah Yeahs. Maps has got a very strange place in pop music history, as it has arguably been the single most influential song of the last 15 years. Almost every last bit of it has been sampled (or stolen) in pop songs that went on to be much, much bigger than the original ever was. It’s an interesting story, but it’s tricky to do it justice in such a short space, so why not take a read of the full thing here? The whole story: http://bit.ly/2blgq0e Ed Balls’ favourite song at karaoke is Take That’s Back For Good. >> Odds and oddities << The fatal flaw in Brexit bets Political polling has taken a bit of a kicking in recent years – having failed to accurately forecast a number of fairly massive outcomes both here and abroad. For a while people turned to bookmakers to see what their odds were showing, the consensus being that betting markets were a more accurate predictor of these sorts of outcomes than polls ever were. Then came Brexit… Now that Donald Trump is falling in the polls, and his odds are lengthening, every sign seems to show that he is fighting a losing battle. But before Democrats start to get too complacent about this, there may be a lesson to learn from the whole Brexit betting debacle. One that would bode well for Trump. Find out more: http://bit.ly/2bB0zMk ************************************* Feeling confident about the outcome of the US Presidential race? William Hill is offering 20GBP in free bets if you sign up for a new account and bet 10GBP. Sign up using the promo code F20 here: http://bit.ly/2b1S9BM ************************************* >> Wardrobe malfunction << Farage and the Brexit Spirit Since Britain voted to leave the EU, there has been something ever so jaunty about Nigel Farage’s wardrobe choices. In fact, we couldn’t help but notice that he’s begun to model himself almost exactly on the fictional hero of PG Wodehouse’s Jeeves and Wooster books, Bertie Wooster. The garish jackets, the bright socks, that gruesome moustache – all he needs now is an Alpine hat to top it all off. Thank heavens Switzerland won’t be on his proposed tour of EU member states. See his horrible transformation: http://bit.ly/2b3OL6p Farage was spotted queuing up at the German Embassy this week, looking extremely shifty. >> 10,000 Lembit Opiks << Popbitch Magazine: Issue 27 If you’ve enjoyed any of these longer stories we’ve linked to in this little issue, then there are plenty more like them in Popbitch Magazine. The latest issue is out now and also includes a review of webcam menace Leslie Grantham’s new kids’ book, a catch-up with the Danczuks, Robert Kilroy-Silk’s sexy nickname, plus a bunch of other silliness and filth. And you’ll get to find out whose tweets are worth 10,000 Lembit Opiks. Download it here for iOS: http://bit.ly/1bexc8Y Download it here for Android: http://bit.ly/1vvdK7H ************************************* Thanks to: RD, LEW, CH, LP ************************************* Old Olympics Jokes Home: An Olympics pundit meets a man with an eight-foot metal stick and asks him, “Are you a pole vaulter?” “Nein,” says the man, “I’m German. But how did you know my name was Walter?” Still Bored? This week’s Media Masters podcast has music mogul Chris Wright – on signing Blondie, Spandau Ballet, Billy Idol and a life of sex, drugs and rock and roll. Listen here: http://bit.ly/2bxIAH9'
