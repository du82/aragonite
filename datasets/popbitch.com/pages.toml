title = "Latest Email – Popbitch"
full_description = '''The Sun Sets on the Next DeNiro Unlock the new WhatsApp Business App in three clicks with YourBusinessNumber. No Contract, Cancel Anytime – Only £5.99pm+VAT. To access WhatsApp Business you need a second number. YourBusinessNumber is the only service that gives you exactly what you want – a new business number, quickly, easily and cost-effectively with none of the hassle of a second phone. One Number. Three clicks. Brilliantly simple. [Sign up here] “There’s only so many times you can be called a gay, egg-headed Scottish cunt in one day” – BrewDog founder James Watt #1219 free newsletter every Thursday subscribe 16.01.25 email stories to hello@popbitch.com * Paul Danan: A tribute * Mad dogs and Labour MPs * PLUS: Robbie’s Healthy Appetite >> No shit, sherlock << All aboard the Bum Bum train Spotted at interactive theatre show You Me Bum Bum Train on Saturday night: Ed Norton and Benedict Cumberbatch, on a night out together. You have to go through each section of the experience one-by-one and at the quiz game part of the show, Benedict was on his own. He was asked to name as many fictional detectives as possible. His first answer? Sherlock Holmes. Danny Masterson, Prince Andrew, and Neil Gaiman all share the same lawyer. Must come in handy. >> Awokening 2.0 << The clock is TikToking Amid the sympathy for the rich, famous and well connected who lost their mansions in the LA fire devastation, there’s a backlash brewing. Celebrities using their fan followings in the wake of this to solicit donations for friends or pet causes might be doing this for good reasons – but young Angelenos have started to complain that the poorer neighbourhoods affected aren’t getting anything like the same sort of attention. Instead, they claim, they only get to see what else is going on via TikTok. And this has fuelled a nice, new conspiracy theory. That the proposed ban on TikTok this week is not just a coincidence of timing – but proof that the rich, powerful and famous don’t want Americans to see beyond their approved narrative. The fact that a host of celebs have used their social media power this week for nothing more than to help Heidi Montag’s terrible old pop album reach no 1 on iTunes, well, it doesn’t really help the argument against. Donald Trump’s anti-terror chief Sebastian Gorka went to St Benedict’s School in Ealing, West London – where other ex-pupils include Julian Clary, Chris Patten and Andy Serkis. >> Big Questions << Who’s asking what this week? Which West End singing star made it her unlikely mission to have sex with her gay musical director? Alas, her question about what she could do “convert” him was met with the following reply, “Love, my greatest turn on is getting leather queens to piss on me. Good luck with that.” p.p1{margin:0;font:14px 'Courier New'} ,—–, It’s chilly out there. / \ Stay toasty with a heat ( @ @ ) pump from Octopus Energy. \ v / Over 200,000 homes enquired (())|(()) last year. Why not join ))|||(( them? Heat pump installs start from £500 including the £7,500 government grant. [That’s hot!] >> Noises Off << Pay some m-f respect The otters are flying at half-mast here at PBHQ today in remembrance of a bona fide Popbitch legend: Paul Danan. His achievements were many and varied, but Danan’s crowning glory surely has to be his fateful performance at the 2007 Xmas lights switch-on in Preston city centre. Losing himself in the moment, the overexcited Danan bounded up onto the stage to greet the crowd of children, parents and pensioners by screaming the immortal words into the mic “MAKE SOME MOTHERFUCKING NOISE, PRESTON!” Whereupon he was immediately hoiked off-stage, slapped with a penalty notice by a waiting copper, given an £80 fine and was fired from the starring role of Jack in the local panto. But, on the plus side, he earned our everlasting love and respect. As well as being an actor and reality star, Paul Danan was also the author of some of the greatest celebrity eulogies ever penned. [His tribute to Dean Sullivan] >> Fired-starter << More of Paul’s potty mouth The Preston Switch-On wasn’t the only time Paul Danan got in trouble for throwing himself into the party spirit too hard. Danan was once hired by teen magazine Bliss to compere a High School Prom night at a school in Durham. Delightfully oblivious to his surroundings, he kicked proceedings off by yelling: “COME ON! LET’S GET THIS FUCKING PARTY STARTED, YOU FUCKERS!” Within seconds, the headteacher had stormed the stage, demanding he apologise for his inappropriate language in front of everyone. Paul Danan once had a date with Melanie Sykes, but his car broke down so he had to get his mum to give him and Mel a lift to the restaurant. >> Danana Banana << The Sun sets on the next DeNiro We hear from Channel 4 that a few years back, in his post Love Island phase, they tried to recruit Paul Danan as an outside broadcast presenter for Richard & Judy. This is the story: “We gave Paul several chances but at the last minute he would always let us down and we’d have to draft in last minute replacements – Alan Carr, Jason Manford etc. One week we decided to cover the Dian Fossey Gorilla run, where several thousand poshos dressed as gorillas run a 10k around London for larks and charity. Paul agreed to do it but as recompense for his past unreliability we dressed him as a banana and placed him at the front of the pack for the start. “To be fair he was on time despite being on a massive bender the night before, but you could see the coke sweat on his top lip in the close up before we crash zoomed out to reveal the baying crowd of gorillas behind him ready to chase him down. “And to his credit he ran the whole race but the next day The Sun ran a double page article about what happened on the course. It turned out some of the ‘gorillas’ weren’t very charitable. Paul was gutted. He felt it had damaged his image as he was “hoping to be the next DeNiro”. “As much as he was daft as a brush he was a sweet guy who meant well and we liked him very much. So his passing is truly tragic.” Paul will, however, always be linked with his idol. Thoughts are with Paul’s son, DeNiro Danan, today. >> Mingetastic << A healthy appetite Robbie Williams might be finally cracking America with his monkey-biopic, but here in the UK memories of his popstar antics go back pretty far indeed. Back when he was doing his first ever promo video, young Robbie was asked by a well-meaning runner if he needed anything. Staff were used to diva demands from the talent (Mick Hucknall once requested four different red sweets so his tongue would be precisely the right colour on camera), so they were braced for the worst. Luckily, Robbie simply replied: “Ooh I’ll have a big plate of minge”. Visit Coochie Creek and meet local gossip Cherry, local handyman Monkey and local sovereign citizen Tom. Tears, laughter and a broken toilet! [There’s No Place Like Home] >> XL Silly Billies << In the doghouse this week Tulip Siddiq might not be the only Labour MP whose family are causing them some grief. It’s been fairly quiet for newly elected MP for Bolsover, Natalie Fleet, so far. But constituents are starting to notice that her mum was recently convicted of animal abuse by her local council. Her mum, Tracy Hovell, made more than £140,000 breeding dogs from her “Briemdoodles” business at her home in Sutton-in-Ashfield. She’s now been disqualified from breeding animals, participating in the keeping of animals, dealing animals and transporting animals. Though she was allowed to keep one doodle as a pet. Read more at BBC Labour MPs have a new nickname for Sefton MP Bill Esterson: “XL Billy”. >> Off-Air << Silent mode next time? Naga Munchetty sat down with writer Alex Renton on Radio 5Live to discuss his new Radio 4 show. It’s called In Dark Corners and it follows a British paedophilic pressure group from the 1970s and 80s. All very serious stuff. So it’s a shame Alex’s phone, not switched off, rang while live on air. The ring-tone? The intro to Air’s one hit wonder, “Sexy Boy”. David Schwimmer says he served divorce papers to Rod Stewart (back when he was 18 and his mum was a divorce lawyer). >> Parental Guidance << A huwge inconvenience Spare a thought for the staff at Broadcasting House. Not only have the BBC banned staff from having newsroom visits from their children (bit of a bummer over the festive hols), but efforts to tighten up child safety regulations have now gone even further. Employees are banned from having their own children sitting in reception to briefly wait while they pick up kit, documentation or forgotten lunch boxes. Can’t think what management is so worried about. Mass-sleb-spot at Soho Theatre last week: Amelia Dimoldenberg, Elis James, Greg Davies, Alex Horne and Ivo Graham. (We think they were all there – separately – to catch Julia Masli, the Estonian clown having a bit of a moment right now). >> Hmmms << Dry January, Juicy Links Headline of the week – “‘Shocked’ Lazio sack their falconer for showing off prosthetic penis in social media posts – ending traditional eagle flight before matches” [Read on Goal] Bats use storm fronts to surf the skies [Read on WaPo] Why do TV title sequences have so much stuff? [Read on NYT] As Burns Night approaches, it’s a good time to reflect on some important work [Haggis Wildlife Foundation] This is a particularly poignant film, documenting the habits of several species of wild haggis [Watch on YouTube] Where does Tbilisi’s nightlife go from here [Read on Huck] Thanks to: AOC, RL, Earl of Essex, PD, MB, J7373, WH, OG, JS, MC, JR, CM, SW, AM, CW Old Jokes Home Q: What’s Irish and sits in the sun? A: Patio furniture. Still Bored? Carlton is one of the biggest Aussie rules football clubs and their president accidentally posted a private dick pic message meant for a lady friend onto X for the whole world to see. And yes, of course, his account was “hacked”. [Read on The Age] *** WhatsApp us some goss on +44 7923 619540. We’re also on Instagram and our DMs are open (@p0pb1tch)***'''
