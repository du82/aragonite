title = "Stories – Popbitch"
full_description = "Secret Agents How do you manage to keep your illicit affair with a unwisely young runner secret in an industry that absolutely runs on gossip? You need expert media handlers – and some of the best in the business are YMU, formerly James Grant. How did they manage to keep Schofield safe all these years? Here’s a part of the puzzle… [ Read more... ] Royal Blush For years, the Royal Family’s motto has been ‘Never Complain, Never Explain’ and Prince Andrew has neatly demonstrated why. It takes real finesse to talk your way out of a suspiciously close friendship with a suspected international child-trafficker – and Andy absolutely spooned it on his first go. So here’s a few notes for His Royal Highness for next time… [ Read more... ] IV/ Art Of The Dyl Despite the millions of dollars that some of its sketchy, secretive investors ploughed into it, Radar Magazine failed to take off. But it’s not as if these guys got nothing for their money. Far from it. Being a member of the Radar Investors’ Circle has ended up having a few pretty nifty perks for those involved… [ Read more... ] III/ The Coalition Shortly before they both invested in Radar Magazine, Harvey Weinstein and Jeffrey Epstein teamed up to make a totally different media acquisition. As part of a larger collective of billionaires, millionaires and other media mavens, the deviant duo tried to buy up New York Magazine. Why? To get its nose out of their business… [ Read more... ] II/ A Social Animal Harvey Weinstein wasn’t the only suspect investor to stump up funds for Radar. Jeffrey Epstein whipped out his chequebook too. But what possible reason could a notoriously secretive billionaire with myriad ties to high society and a rumoured penchant for sex with young girls have for wanting to own a stake in a celebrity gossip magazine? [ Read more... ] I/ Talk Of The Town When a huge wave of allegations against Harvey Weinstein hit the headlines in 2017, reports quickly followed about the secret network of journalists and editors he had working for him in the shadows, helping to suppress negative stories. How did Harvey go about getting his gruff, sticky fingers into the print media pie in the first place? It’s a pretty interesting story… [ Read more... ]"
