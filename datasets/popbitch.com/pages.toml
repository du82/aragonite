full_description = "Club Popbitch Want a little extra Popbitch in your life? Join Club Popbitch and step behind the velvet rope… Club Popbitch (£4/month) You won’t just get the regular Thursday newsletter, you’ll be a true insider with: A subscribers-only extra newsletter with more weekly stories A daily music quiz to test your pop knowledge or share with friends and colleagues A monthly downloadable Play-At-Home Popbitch Popquiz Full, free access to our long reads, issue archive and other bits of extra content we get our hands on VIPbitch (£10/month) Or you can become a Popbitch VIP and take your place in the inner sanctum. VIPbitch status offers you all the benefits of Club Popbitch, with a special limited edition membership gift, plus a chance to secure ringside access to some of the inner workings of Popbitch HQ. Bring a team of friends as our guests of honour to our live Popbitch Popquizzes (2 x tables a year) Enjoy regular access to virtual member-exclusive Happy Hours, where we invite you behind the scenes with our editors and special guests to get the inside track on the interesting stories in the worlds of pop and bitch A special quarterly Popbitch zine"
