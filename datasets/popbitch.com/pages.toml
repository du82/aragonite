full_description = "Privacy Policy Popbitch is committed to protecting your privacy online. There’s a good reason you’re not going to see an “accept cookies” box to tick on our new site. That’s because we can’t at the moment see any reason to place cookies on your devices. We’ve taken the decision to try and avoid intrusive digital advertising. If we find we regret this, we’ll change this policy wording and let you know. The kind of display advertising that follows you around on the internet remunerates all but the biggest scale websites so poorly that we’re going to try and live without. So you don’t need to fire up your ad blockers, there’s nothing to see here. If we ever ask you to register for something then we may ask you to submit personal information such as a name, e-mail address, postal address and telephone number. You are under no obligation to provide such information. We are concerned about safeguarding the confidentiality of your information. This means that it will be fully protected under the GDPR. We provide physical, electronic, and procedural safeguards to protect information we process and maintain. Under GDPR you have the right to be informed about our collection and use of your personal data. You also have the right to access your personal data by means of a subject access request. We do not have access to your financial information as we use a third party such as Paypal to process payments. We may disclose aggregate statistics about our site visitors, clients and sales in order to describe our services to prospective partners, advertisers and other reputable third parties and for other lawful purposes, but these statistics will include no personally identifying information. We may disclose personal information only if required to do so by law or if we believe that such action is necessary to protect and defend the rights, property or personal safety of Popbitch, the site or its visitors. This site contains links to other sites. Popbitch is not responsible for the privacy policies or the content of these sites. You can contact us at any time on support@popbitch.com"
