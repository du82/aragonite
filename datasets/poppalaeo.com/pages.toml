title = "Popularizing Palaeontology"
full_description = '''About the Network View fullsize Gallery of Palaeontology in Paris, from Albert Gaudry, Les ancêtres de nos animaux dans les temps géologiques (1888)Image from the Biodiversity Heritage Library. Digitized by Harvard University, Museum of Comparative Zoology, Ernst Mayr Library. www.biodiversitylibrary.org From the beginnings of research into the earth’s deep history in the late-eighteenth century, extinct animals, lost worlds, narratives of life’s history and accounts of palaeontological discovery have exerted a strong hold over public audiences, and been depicted across a range of media. The ‘spectacular’ side of the field – particularly dinosaurs, adventurous fieldwork and human origins – has long been presented as an important gateway into wider interest in science. The practices of palaeontological research, mixing geology, comparative anatomy and evolutionary biology with artistic and imaginative reconstructions of extinct organisms and lineages, also offer important perspectives on the relations between different sciences, and between science and art. And the diversity of prehistoric life, and the large-scale changes across geological history, have been an important means of shifting understandings of ecology, evolution and biodiversity since the nineteenth century.This network aims to look at these issues and link synergistic trends in the humanities and sciences. In the history and sociology of science, the study of popular science is a dynamic field, moving beyond simplistic ideas of dissemination from ‘high’ scientific to ‘low’ popular contexts to more complex models based on coproduction and circulation between the ‘public’ and the ‘scientific.’ In these works, the history of geology and palaeontology – conceptually revolutionary sciences of great appeal to public audiences – have been crucial case-studies. In the evolutionary and earth sciences themselves, public engagement (often in a highly historically-informed manner) has also been a major preoccupation, and palaeontologists and geologists have pioneered innovative new methods of collaborative public engagement, open access publishing, and online dissemination. However, despite the obvious thematic and practical overlaps between these developments, they have occured quite separately from one another. View fullsize "The Art of Extinct Animals" Pop-up Palaeoart Exhibition at King's College London, December 2017.Photography by Katya Morgunova. Our aim is to bring together an international group of humanities and social sciences scholars, scientists, museum professionals, artists, and participants from the cultural sector to reflect on these trends and build future collaborations. Mixing theoretical and practical discussions on the public circulation of scientific ideas, we are investigating the importance of palaeontological concepts in the modern world, while also developing new understandings and methods for science communication more generally. We also reflect on the role that popular engagement plays within scientific research, whether this be to gain funds and resources, develop theories and conduct debates, or promote particular messages, while evaluating the reasons for the appeal (or lack of appeal) of particular aspects of palaeontology among particular audiences. In addition, we are thinking about how palaeontological outreach can develop in the future, whether through reaching new audiences, developing new techniques of public engagement, and through reconsidering the ways in which palaeontological narratives can contribute to wider public debates. In doing so, we will build collaboration across disciplinary boundaries, develop new perspectives on science communication, and assess the importance of palaeontology for wider debates on nature, evolution and the environment. workshops WORKSHOP 1: EXPLORATIONSKING'S COLLEGE LONDON, SEPTEMBER 2016 Learn More workshop 2: agendasKING'S COLLEGE LONDON, DECEMBER 2017 Learn More WORKSHOP 3: REPRESENTATIONSARTIS library of the University of AMSTERDAM, MAY 2018 Learn More wORKSHOP 4: DEBATESKING'S COLLEGE LONDON, DECember 2018 Learn More wORKSHOP 5: OBJECTSNorth Carolina Museum of Natural Sciences (RALEIGH, NC), SPRING 2019 Learn More wORKSHOP 6: mediaLONDON, SEPTEMBER 2019 Learn More Public Events The Art of Extinct AnimalsPop-up exhibition at King's College London, December 2017 Learn More WHAT IS THE POINT OF PALAEONTOLOGY?Pop-up exhibition & Discussion evening at King’s College London, December 2018. Learn more Palaeontology in popular culturePop-up exhibition & Discussion evening at King’s College London, September 2019. Learn more organizationThe first two workshops were generously funded by King's College London, and the activities between 04/2018 and 09/2019 were funded through an International Research Network Grant from the UK Arts and Humanities Research Council (ref: AH/R007411/1). We are currently carrying on the project through regular series of sessions.The network is run by Dr. Chris Manias (King's College London) . In the funded network, Prof. Joe Cain (University College London) acted as Co-Investigator, Dr. Ilja Nieuwland (Huygens Institute) coordinated the meeting in Amsterdam and Dr. Paul Brinkman (North Carolina Museum of Natural Sciences) coordinated the meeting in Raleigh.The public events are free and open to ticketed members of the public. Due to space constraints, attendance at physical workshops is limited to speakers and a small number of invited additional participants - please get in touch if you would like to take part in any of these. The talks at the workshops will all be uploaded to this website as audio and video, and participants will produce blogposts on the issues raised and discussed. As well as the workshops and public engagement events, we are also aiming to produce an open access collection reflecting on and summarizing the main results of the network and its discussions, and are currently running an online seminar series. Get InvolvedIf you would like to take part in any of the events or would like to be updated on any developments, then please do let us know! Please get in touch via the following form: {"secureUrl":"https://chris-manias-zrbx.squarespace.com","formSubmitButtonText":"Submit","formSubmissionMessage":{"html":"Thank you!"},"submissionVerticalAlignment":"","buttonAlignment":"left","submissionMessageTextStyle":"","formName":"New Form","collectionId":"5ab914c788251b9c24292d8e","submissionAnimation":"","captchaTheme":1,"formId":"5ab914c788251b9c24292d8c","useLightbox":false,"firstFieldHighlightType":"","useFormsJs":true,"submissionTextAlignment":"","formFieldFormats":{"countries":[{"name":"Afghanistan","code":"AF","phoneCode":"+93"},{"name":"Åland Islands","code":"AX","phoneCode":"+358"},{"name":"Albania","code":"AL","phoneCode":"+355"},{"name":"Algeria","code":"DZ","phoneCode":"+213"},{"name":"American Samoa","code":"AS","phoneCode":"+1"},{"name":"Andorra","code":"AD","phoneCode":"+376"},{"name":"Angola","code":"AO","phoneCode":"+244"},{"name":"Anguilla","code":"AI","phoneCode":"+1"},{"name":"Antigua & Barbuda","code":"AG","phoneCode":"+1"},{"name":"Argentina","code":"AR","phoneCode":"+54"},{"name":"Armenia","code":"AM","phoneCode":"+374"},{"name":"Aruba","code":"AW","phoneCode":"+297"},{"name":"Ascension Island","code":"AC","phoneCode":"+247"},{"name":"Australia","code":"AU","phoneCode":"+61"},{"name":"Austria","code":"AT","phoneCode":"+43"},{"name":"Azerbaijan","code":"AZ","phoneCode":"+994"},{"name":"Bahamas","code":"BS","phoneCode":"+1"},{"name":"Bahrain","code":"BH","phoneCode":"+973"},{"name":"Bangladesh","code":"BD","phoneCode":"+880"},{"name":"Barbados","code":"BB","phoneCode":"+1"},{"name":"Belarus","code":"BY","phoneCode":"+375"},{"name":"Belgium","code":"BE","phoneCode":"+32"},{"name":"Belize","code":"BZ","phoneCode":"+501"},{"name":"Benin","code":"BJ","phoneCode":"+229"},{"name":"Bermuda","code":"BM","phoneCode":"+1"},{"name":"Bhutan","code":"BT","phon