title = "Workshop 2: Agendas — Popularizing Palaeontology"
full_description = "Workshop 2: agendasking's college london, december 2017 This workshop focussed on the agendas motivating the popularization of palaeontological research by scientists, and the reasons for interest in palaeontological subjects among the public. It examined the synergies and tensions between these sets of interests, and how particular audiences are either privileged or excluded in these processes. In addition, we discussed the challenges of palaeontological outreach, some of the pressures around it, and the frequent conflict between different goals and interests.Some of the key questions were:Why popularize palaeontology at all? What have been the difference motives and agendas for this, and how have they affected popularization efforts? How has the public position of palaeontological research affected scientific research and scientific careers? What are the potential costs and risks of making palaeontology a ‘popular’ science? What audiences have traditionally been interested in palaeontology, and why? What audiences should we try to reach with palaeontological outreach today, and how? Workshop Programme INTRODUCTION: AGENDAS Chris ManiasIntroductionDownload audio Ilja NieuwlandPaleontology as Science or Entertainment? A Comparative Anatomy through TimeDownload audio Mark CarnallWhat has palaeontology ever done for us?Download audio Liz HideFossils in a landscape of “Arts & Culture”Download audio Art & Palaeontology Paul BrinkmanAdding life, color and interest to the fossil exhibits: the scientific illustrations of John Conrad HansenDownload audio Learn More A Children's Science? Richard Fallon“A New Little Alice in Prehistoric Wonderland:” Popularisers of Palaeontology and the Works of Lewis CarrollDownload audio Learn More Melanie KeeneMary Anning and the History of Palaeontology for ChildrenDownload audio Learn More Palaeontology & The Media Steve BrusatteNew dinosaurs in the news: insight from a journalist-turned-palaeontologistDownload audio Learn More Communicating the Science Paige MadisonMissing Links and Human Ancestors: Communicating the Science of Our OriginDownload audio Learn More Darren NaishReviewing the Reviews. Biased Coverage in Palaeontology: Does it Matter?Download audio Learn More"
