full_description = "Workshop 1: explorationsKing's College London, September 2016 The first workshop brought together historians of science, palaeontologists, artists, museum professionals and science communicators to discuss how the deep history of life have been communicated to publics historically and currently. In doing so, we thought about how interdisciplinary engagement and discussion of this area could work, reflected on how popular conceptions feed into scientific research, and discussed the impact this has had upon changing ideas of animals, the environment and evolution.Over the two days, we discussed questions like: How have issues of media profile and celebrity affected palaeontological research and its public presentation?How have scientific debates, theories and controversies interacted with popularization efforts and public understandings?Why have dinosaurs become so iconic in popular images of palaeontology, when did this happen, and what role have they played in public imaginations?How and why have palaeontologists presented new or unfamiliar organisms to the public, and what factors have affected the level of engagement with them? Workshop Programme Introduction Chris ManiaSIntroductionDownload audio Learn More Mark CarnallThe Other 97%: Making the Most of the Underwhelming Fossils in MuseumsDownload audio Learn More Elizabeth JonesA History of Ancient DNA Research: A History of Celebrity Science. Download audio Learn More Debates & Theories Darren NaishPalaeoart Memes and the Unspoken Status QuoDownload audio Learn More Ilja NieuwlandOtto Jaekel, Gustav Tornier and the use popular science as a means of leverage for the reform of paleontology in early-20th century Germany.Download audio Learn More Thinking with dinosaurs Mareike Vennen'Making Dry Bones Live:' Entanglements between Science and Popular Culture in early Twentieth Century Natural History MuseumsDownload audio Learn More Will Tattersdill Different Things which Work the Same: Analogies 