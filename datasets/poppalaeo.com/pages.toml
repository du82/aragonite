["http://www.poppalaeo.com/workshop-6"]
title = "Workshop 6: Media — Popularizing Palaeontology"
full_description = "Workshop 6: mediaLondon, september 2019 The final workshop examined issues of genre and media, focussing on particular types of media used for the representation of palaeontological themes (such as film, documentaries, exhibition displays, newspaper stories, books, novels, and lectures), and the role that the media has had in conditioning the interaction between scientists and publics. We engaged with questions like:Which media have been most significant in shaping public notions of palaeontology? How has this changed over time?What considerations have palaeontologists and science communicators made when adapting their work to particular forms of media?How have media institutions used palaeontological research, and how have they interacted with palaeontologists?How do ideas and messages move across different genres and media, and what shifts occur in them as they do so? Workshop Programme Chris Manias‘Introduction’ Luis Rey‘Bringing Dinosaurs Back to Life’ Liz Martin-Silverstone‘Experiencing a “Real” Jurassic Forest.’ Richard Fallon‘From the Royal Academy to The Lost World: Popularising Palaeontology with Arthur Conan Doyle and Patrick Lewis Forbes.’ Oliver Hochadel‘Imagining Ambrona and Shanidar: Time-Life’s Vision of Human Origins.’ Vicky Coules‘Between a Rock and a Hard Place: Producing Dinosaur Documentaries.’ Darren Naish‘Dinosaurs in the Wild: A Backstory.’"
