["http://www.poppalaeo.com/blogposts/2016/12/20/the-popularity-of-dinosaurs-for-better-for-worse"]
title = "Mark Witton, The popularity of dinosaurs - for better, for worse — Popularizing Palaeontology"
description = """
Normal 
