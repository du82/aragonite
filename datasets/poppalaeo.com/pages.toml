["https://poppalaeo.com/workshop-4"]
title = "Workshop 4: Debates — Popularizing Palaeontology"
full_description = '''Workshop 4: debates & Issuesking's college London , December 2018 This workshop examined how the public discussion of palaeontological ideas has connected with wider debates and concerns on scientific, social and cultural issues, ranging from evolution, ‘progress,’ nature, biodiversity, and spectacle. It interrogated the wider ideological and cultural traditions around the public discussion of palaeontological research, and how old stereotypes and new narratives have developed.Particularly important questions were:Which cultural and ideological positions have historically used palaeontological research and narratives? How has this changed and shifted over time?How long-standing have particular cultural stereotypes been in the presentation of life’s history, particularly those based on ‘progress’ and ‘improvement’? Why have these been so difficult to overcome?How can palaeontology interact with current issues and concerns over conservation, biodiversity, and environmental change? How effective can this be? Is this even desirable? Workshop Programme Introduction: Research & Methods Chris ManiasIntroduction: Debates & IssuesDownload audio Paul BrinkmanMaking Research from RubbishDownload audio Hannah O’Regan Large carnivore (sub)fossils and conservation: lions, tigers and bears, oh my…Download audio Matt StanfieldMaking Memories: Personal & Public PaleoartDownload audio Narratives & Progress Elsa PanciroliMammals just keep getting better: how we cling to tales of progress in mammal evolutionDownload audio Plants & Hominins Susannah LydonPlant Blindness and the Fossil RecordDownload audio Becky Wragg-SykesFlint-erestingly Mousterious: why we’re still obsessed with NeanderthalsDownload audio Dinosaurs and their Uses Shana van HauwermeirenThe Iguanodons of Bernissart: cultural moderators for popularising paleontology in late 19th- and early 20th-century BelgiumDownload audio Will TattersdillBeyond Brontosaurus: Literature, Science, and the Second Extinction of the DinosaursDownload audio Monstrosity Ilja NieuwlandConstructing Otto’s hedgehog - the enduring lives of a paleontological chimaeraDownload audio Mark WittonMark Witton, ‘Monsterising Prehistory! The "How," "Why" and "So What" of Monstrous Palaeoart!’Download audio'''
