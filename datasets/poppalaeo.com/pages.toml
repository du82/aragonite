 EN-GB 
 X-NONE 
 X-NONE"""
full_description = "Mark Witton, The popularity of dinosaurs - for better, for worse December 20, 2016 The Popularising Palaeontology workshops held in August 2016 presented fascinating insights into the history and current state of palaeontological outreach. Our many talks and roundtable discussions touched varied topics but several central themes emerged, of which one was the prevalence of dinosaurs in virtually all palaeontological PR exercises. Whatever we discussed - the history of museums, the palaeoart industry, public interest in research or palaeontological influences on cinema - dinosaurs were almost always involved. Even if they weren’t a main focus, their influence there - catalysing certain events, influencing decisions, eclipsing other outreach topics. It would be wrong to say popularising palaeontology is totally synonymous with popularising dinosaurs, but for better and worse, these animals have a major role and influence over public outreach of palaeontological science. The success of dinosaurs in outreach Exactly why dinosaurs occupy such an important and influential space in popular culture remains largely mysterious. On paper, dinosaurs are a group of extinct reptiles which are not - superficially at least - so different from other long-dead sauropsids, and yet they have somehow gained global fame and many dedicated followers. My suspicion is that dinosaurs uniquely combine obviously amazing, ‘high impact’ anatomy - large size, fantastic skeletal structures such as horns, huge teeth and so on - with bauplans that are easily understood by the general public, without being so familiar that they’re pedestrian. For instance, everyone can appreciate Allosaurus as an active, large bodied predator even if just looking at its skeleton in a museum, but - as bird-like as it is in detail - the overall form is somewhat alien and intriguing. Other fossil groups, such as ancient carnivorans or whales, are impressive enough but perhaps also too familiar to inspire our imaginations in the same way. At the other end of the spectrum are extinct creatures which are just too unusual for widespread appreciation. Perhaps their anatomy is too strange or their life histories are too obscure and difficult to relate to familiar biology. This applies to many extinct invertebrates, as well as several types of weirder vertebrates. Dinosaur biology is thus near perfect for outreach material: they’re visually impressive, anatomically and biologically accessible, but different enough to warrant interest. Whether this is the actual basis for dinosaurian appeal or not, museum staff, educators and merchandisers have realised for over 150 years that dinosaurs are an excellent way to interest the public and make money, and given them prominent roles in outreach. Aiding any intuitive draw we have to dinosaurs is a lot of social inertia, and part of the enduring appeal of dinosaurs is a long history of ingraining them into popular culture. Figure - Why are dinosaurs so popular?The success of dinosaurs in the public eye almost certainly reflects many varied influences, but their unique anatomical qualities may play an important role. Does any other fossil group combine interesting, ‘high impact’ biology, in a format that the public can easily grasp, in the way that dinosaurs do? For those of us interested in science education, dinosaurs are one of the most important and potent tools at our disposal. We see them as not only fascinating subjects in their own right but as a way to introduce ‘bigger picture’, perhaps fundamentally more important, scientific concepts to lay audiences. Dinosaurs are gateways to discussions of evolution, adaptation, anatomy, biological diversity, extinction, geological time and the changing nature of the planet. They provide, as charismatic and fantastic creatures, perfect characters to maintain interest in discussions of these sometimes complex concepts, and well-known Mesozoic dramas - the breakup of Pangea, formation of the Deccan Trapps, the Chicxulub Impact - offer rich backgrounds to stage our conversations. Dinosaurs are more than just awesome animals: they’re public ambassadors for science, facts and intelligent thinking. We cannot ignore the economic value of dinosaurs, too - and not just to Hollywood movie makers and toy manufacturers. Dinosaurs provide academia and its satellite industries with vital income because of their easy marketability and merchandising potential. Public interest in dinosaur news, books and artwork keeps authors and palaeoartists in work, while the pull of dinosaur exhibitions in natural history museums not only keeps turnstiles spinning but brings essential revenue - in the form of gift shop purchases, entry fees and cafe visits - to these underfunded venues. I don’t know that anyone has ever attempted to work out the net worth of dinosaurs to education, but, globally, their appeal must bring millions of pounds into venues that perform outreach every year. Too much of a good thing? So hurrah for dinosaurs, then, and their role as not only fascinating subjects for research and art, but as bankable, relatable and demanded elements of modern culture. But the popularity of dinosaurs does have an impact on other aspects of palaeontological PR, and in some conversations at our workshop ‘dinosaur’ almost became a bit of dirty word. No-one will deny the positive aspects of dinosaur popularity, but their dominance in popularised palaeontology influences outreach strategies, merchandising and public expectation, and not always in a positive way. Some of the problems caused by dinosaurs were outlined in detail during talks at our workshop. We heard that a large portion of natural history museum visitors are exclusively concerned with seeing dinosaur exhibits, challenging natural history museums to use the rest of their collections in a meaningful, impactful manner. This is despite many museum goers being unable to distinguish dinosaur remains from those of other animals without the aid of helpful signage. It seems that, for some museum visitors, dinosaurs act like a brand label, or justification for interest, rather than an excuse to visit a museum for a rounded educational experience. We also heard that bringing attention to non-dinosaur groups can be extremely difficult, and the less dinosaur-like they are, the harder it is. Groups like pre-Cenozoic synapsids, extinct invertebrates, fossil fish and so on struggle for attention and require highly creative outreach tactics to receive any interest. One of the commonest strategies - used frequently for semi-technical books on fossil animals - is to make sure dinosaurs remain prominently mentioned even in those events or products which are focused on completely unrelated groups of animals. We just don’t trust most non-dinosaur clades to draw crowds or revenue on their own and have to spin them as being relevant to dinosaurs in some way. Tellingly, the only groups to escape frequent dinosaur namechecking are those which are already somewhat ‘dinosaur-like’. Giant fossil mammals, pterosaurs and Mesozoic marine reptiles share aspects of size and gross appearance with Mesozoic dinosaurs and might be seen as ‘honorary dinosaurs’ by the public, and perhaps mistakenly interpreted as the genuine article by many. Both dinosaur-targeted museum visits and our resistance to promote palaeontological topics without a dinosaurian safety net questions whether dinosaurs are a genuine ‘gateway’ to wider scientific education, and perhaps suggests a rather narrower interest in prehistoric life among the public. Our group also raised the association between dinosaur outreach and very young demographics, and the challenge this presented to educators. The problem isn’t that many children are naturally interested in dinosaurs - if anything, this is something to celebrate and encourage - but the impact this association has on older audiences. Many adults assume that anything to do with dinosaurs, and by extension any prehistoric animal, is automatically related to children, and often very young children. This becomes an issue for to those attempting to perform outreach or market palaeontologically-informed products to older audiences, and particularly outside of online venues. Experience shows that ‘real world’ dinosaur events - regardless of venue, event type or advertising theme - will be primarily stocked by children and parents expecting child-friendly media. I’ve experienced this many times in my outreach career, such as bowing to pressure for colouring-in stations at a palaeoart gallery, being asked whether a public lecture (entitled ‘Palaeoart: the Never Ending Quest for Accuracy’) was suitable for toddlers, and being invited to run art stalls and events for older audiences at dinosaur-themed events to find few interested people over 10 years of age. The general expectation that dinosaur-related events or products skew towards children presents a complex set of challenges. Firstly, it can lead to older audiences deciding a priori that they cannot take anything away from dinosaur outreach because the event - whatever it is - is ‘just for kids’. I’m sure many of us have seen how ‘switched off’ parents of young dinosaur fanatics are when visiting outreach events, even though the people their children are speaking to may be expert scientists, experienced fossil hunters or world-renowned palaeoartists. Secondly, mismatched expectations of outreach events can be frustrating for both outreachers and audiences: attendees may wonder why a dinosaur event is pitched above the level of their children, while outreachers may feel over-prepared or over-invested in their activity programme when confronted with only young audiences. Perhaps the most concerning issue is that many outreachers and merchandisers use young demographics as an excuse for low scientific standards and sensationalism, promoting outdated, erroneous and sometimes idiosyncratic views of palaeontology because their audience is too young and insufficiently educated to know otherwise, or ignoring scientific data where it might curb child appeal. I am sure most readers can think of numerous examples of products - many labelled as ‘educational’ - which show evidence of this, and it’s easy to see how this attitude may play a major role in perpetuating outdated and erroneous ideas about the past. One of our final discussion touched on perhaps another issue faced by dinosaur outreach: the schism between public and palaeontological appreciation of what dinosaurs are. For palaeontologists, dinosaurs are a constantly - and sometimes rapidly - evolving set of hypotheses and ideas, and this is what we generally try to present to the world in our outreach. But certain dinosaur concepts outgrew palaeontologist-steered media long ago and now occupy their own place in popular culture, one almost entirely divorced from developments of dinosaur science and instead orbiting their portrayals in film, TV and popular literature. Most of these products - even those produced in the last few years - stick to now long-outdated 20th century interpretations of dinosaur biology and, divorced from guiding hands of scientists, solely emphasise marketable aspects such as their size, perceived ferociousness, and unusual anatomy. The result is a public largely familiar with dinosaurs in a scientifically-distanced, simplified and monstrous form rather than the animals reconstructed through biological and geological sciences, and with little appreciation for their evolutionary context, the scientific techniques used to understand them, or their relationship to wider, ‘core themes’ of scientific outreach. Recent studies partly vindicate this view in showing that the public are generally unaware of even the most basic aspects of dinosaur science, such as the near 50-year old revision from the classic ‘tail-dragging’ posture to an elevated tail and horizontal body attitude (Ross et al. 2013). This is despite museums, artwork, documentaries and some of the most successful blockbuster movies of all time showing the latter since at least the 1990s. This being the case (and with an added caveat that the study in question was relatively small), perhaps our issue with dinosaur education is more severe than we thought: are people really engaging with dinosaur media at all, or are our subjects of research, artwork, and hallowed gateways to other sciences little more than time-fillers and distractions? Figure: Hollywood DinosaursDespite the best efforts of many scientists, the public at large seem to associate dinosaurs with considerably outdated interpretations and monstrous creatures. Reviewing recent successful entries into one of the most widely-accessed sources of popular dinosaur culture - Hollywood movies - is this surprising? Perhaps the most visually progressive rendering in this set are the sparsely feathered dromaeosaurs from Pixar’s The Good Dinosaur (bottom right). However, the state of their integument still recalls dinosaur palaeoart from the mid-1990s, and not the extensive feather body covering shown by fossil evidence and now commonly restored over certain dinosaur species. Image sources, from top row down; King Kong (2005); Godzilla (2014); Transformers: Age of Extinction (2014); Toy Story (1996 - onwards); Jurassic World (2015); The Good Dinosaur (2015).] So, are dinosaurs as useful as we think for outreach purposes? The points raise a simple but significant question: how effective is dinosaur-based outreach, really? As noted above, many decisions about outreach are shaped around dinosaur science and resources are poured into promoting dinosaur science itself. But are we right to regard dinosaur outreach as highly as we do? Trying to balance the positive and negative points raised above, my take is yes, dinosaurs are an effective means to bringing science to people… but probably only certain people. Specifically, they seem to work very well among those who are already tuned into palaeontology, natural history and general science, an audience composed mostly of adult enthusiasts and children. Beyond this, their effect seems to tail off quickly and they may actually be a barrier to effective outreach. Audiences with preconceived expectations of dinosaur-themed content may ignore anything dinosaur related, which is a concern with us giving dinosaurs such privileged consideration in educational material. Are we limiting our promotion of other topics that could engage these uninterested people? And is one of our challenges of popularising palaeontology making dinosaurs and related topics universally attractive, and not just subjects with appeal to specialist audiences or younger people? Of course, your opinion on this matter may differ. But even so, I think most of us would agree that our wider education about dinosaurs and related matters could be more effective, or at least more nuanced and reflective of more topics, than it currently is. I am opt"
