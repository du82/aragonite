title = "The Art of Extinct Animals — Popularizing Palaeontology"
full_description = '''The Art of Extinct Animals: Pop-Up Palaeoart Exhibitionking's college london, december 2017 In this one-evening pop-up exhibition, some of the UK’s leading palaeontological artists showcased their artwork and talked about how they go about reconstructing extinct animals and lost environments. We engaged with questions like: How can artists reconstruct and recreate the life of the past? What challenges, techniques and difficulties are there in this process? How does the history of palaeontological artwork affect current conventions in the field? And what does palaeontological artwork tell us about the relations between science and art?Featuring work by: John Conway Bob Nicholls Beth Windle Mark Witton Event Programme EXHIBITION IMAGES <img src="https://images.squarespace-cdn.com/content/v1/581726c0c534a576aa3b48b4/1522065094244-J78SCM4TKHGNA4BCIY7Y/IMG_20171213_191538.jpg" alt="IMG_20171213_191538.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/581726c0c534a576aa3b48b4/1522065099175-6IR7TA4Y1Y7QGRDDCFE1/IMG_20171213_191344.jpg" alt="IMG_20171213_191344.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/581726c0c534a576aa3b48b4/1522065084523-CHQJKYS7XOI3AW9SGZJ5/IMG_20171213_191320.jpg" alt="IMG_20171213_191320.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/581726c0c534a576aa3b48b4/1522065117016-21VFR8OPUPSFJUML0VGU/IMG_20171213_193734.jpg" alt="IMG_20171213_193734.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/581726c0c534a576aa3b48b4/1522065418831-80RL8BS6RSS2W1TIA3BH/IMG_20171213_191623+-+Copy.jpg" alt="IMG_20171213_191623 - Copy.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/581726c0c534a576aa3b48b4/1522065420570-MUQB22GUR0OCQGFEPY3M/IMG_20171213_191623.jpg" alt="IMG_20171213_191623.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/581726c0c534a576aa3b48b4/1522065111755-XO2PM5KSTJV729WL7INE/IMG_20171213_191745.jpg" alt="IMG_20171213_191745.jpg" /> <i