title = "Drone>Drones: Palestine Action Fundraiser | Various Artists | porch collapse"
description = """
Drone&gt;Drones: Palestine Action Fundraiser by Various Artists, released 05 January 2024

1. Anthony Cardillo &amp; Bilal Nasser - Between the sword and the neck
2. The Furnace - a drone
3. Champagne Slut - WWWAAAVVVEEESSS
4. witchknife - Untitled (For Palestine)
5. Dystopian Control - Focused Violence
6. Garlands - The dispossessed
7. porch collapse - ENZYME 1.3.1.2
8. GHOST CARS - Don&#39;t let the bastards win
9. Crible Fantômes - Serpentine
10. Kristina Warren - a light, a shadow
11. Michael Wayne - set w: defence
12. Hilding Hobby - Svår Vår
13. Hanna Hazzan - Mired in Capitalism pt.5
14. gutsmutt - command&amp;conquer
15. Bouriana - Every Palace Approaches
16. Soft Ions - Slow Carousel
17. massteen - glitch
18. oljudas - Noise Against Drones
19. Poetry in Noise - Are Blast Beats Friends?
20. Instant Messenger - getback
21. buho &amp; Silver Sibylline - The Argument
22. Biographical Error - to the Ukrainian Catholic church whose Divine Liturgy I had the misfortune of attending (morning of Christmas Eve 2023)
23. Gray Hartley - Reversing
24. Violeta Genciana - El mundo en manos de hombres
25. Apan som fick nog - Osmarta bomber
26. TFJR - Licho nie śpi
27. k.burwash - Cloud Stream
28. Shirley &amp; The Pyramids - Guitar Drone 2
29. pulsewidth - beachfront ruins
30. Kaunsel - Melody Intelligence
31. other realm - CTRL ALT DEL

100% of funds supporting this release will go to Palestine Action (https://www.palestineaction.org)

Apartheid and Genocide against Palestinians cannot be voted or protested away. Direct action against the perpetrators and their suppliers is required.

Palestine Action is a direct-action network of groups and individuals formed with the mandate of taking action against the sites of Elbit Systems and other companies complicit in Israeli apartheid, calling for all such sites to be shut down.

Since Palestine Action launched in July 2020, they have cost Israel’s largest arms firm tens of millions in losses. They have shut down two of their ten sites in Britain. Over 250 activists have been arrested. Importantly, people have been joining their direct action movement by the hour in a united and dedicated front to #ShutElbitDown.

Images of receipts for sales and completed donations are posted on Instagram."""
full_description = "Noise Artist.Originating circa 2001 from basement audio experiments in Alberta, Canada, now existing below sea level in Haarlem, Netherlands. Over two hours of quiet drones and ambient soundscapes. A very nice collection that highlights a lesser-known type of music being made on the prairies. William Denton With each song named after a remote city, “Hibernation” is haunting darkambient that surrounds & engulfs. Bandcamp New & Notable Apr 11, 2021 Noise maestro Stromboli creates haunting industrial atmospheres with a visceral feel. Bandcamp New & Notable Sep 26, 2023 You’d expect an album titled “Velociraptor” to be heavy and this doesn’t disappoint, as it’s jam-packed with serrated noise & feedback. Bandcamp New & Notable Apr 22, 2023 This is such a fine collection of pieces- Holy Drone Travelers make us happy- on the daily rotation around the Vache offices......ss/am editions vaché"
