Since Palestine Action launched in July 2020, we have cost Israel’s largest arms firm tens of millions in losses. We have shut down two of their ten sites in Britain. Over 250 activists have been arrested. Importantly, people have been joining our direct action movement by the hour in a united and dedicated front to #ShutElbitDown.

Release date is January 2nd, 2025 at 01:00GMT.

100% of funds supporting this release will go to Palestine Action (UK &amp; NL), images of receipts for sales and forwarded donations will be posted via Instagram each week for the first two months and afterwards monthly.

