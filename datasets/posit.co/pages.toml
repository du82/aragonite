full_description = '''Customer Stories Novo Nordisk Customer Stories <img class="max-w-[190px] rounded-lg" src="https://posit.co/wp-content/uploads/2023/10/novo_nordisk_logo_blk.png" alt="" data-eio="l"> Posit Team Novo Nordisk: Journey to an R-based FDA submission <img class="hero-image w-screen rounded-lg" src="https://posit.co/wp-content/uploads/2023/08/novo-blog-hero2.jpg" alt="Man looking at data visualizations on two monitors" data-eio="l"> Novo Nordisk, a leading pharmaceutical company in diabetes, obesity, and other chronic diseases, detailed their first FDA submission package featuring outputs exclusively written in R in a live presentation. <img decoding="async" style="filter: blur(5px); height: 100%; object-fit: contain; width: 100%;" src="https://fast.wistia.com/embed/medias/50m81bu1p7/swatch" alt="" aria-hidden="true" data-eio="l" /> In their presentation Ari Siggaard Knoph (MSc), Steffen Falgreen Larsen (MSc, PhD), and Anders Ellern Bilgrau (MSc, PhD) share: An in-depth look at Novo Nordisk’s computing platform supporting both R and Python Their process, setup, and journey to achieving their infrastructure Challenges they faced and how they overcame them How the team plans to innovate and what the future holds Using Posit Team in their statistical computing environment shown below, Novo Nordisk is helping pave the way and changing how clinical trial reporting is done. <img class="roudned-lg" src="https://posit.co/wp-content/uploads/2023/10/novo-nordisk-flowchart.jpg" alt="" data-eio="l" /> Subscribe to more inspiring open-source data science content. We love to celebrate and help people do great science. By subscribing, you'll get alerted whenever we publish something new. Subscribe now'''
