full_description = '''Posit Champions When you grow, we grow Ready to champion data science in your organization? Rise to the occasion. Become a thought leader among your peers with a little extra help from your friends at Posit. Show them how analytics can reshape their world. Boost your knowledge by browsing through our resources. <img class="w-screen rounded-lg" src="https://posit.co/wp-content/uploads/2022/10/CHAMPION.svg" alt="illustration of diverse group of 9 people working together to put together abstract parts into a whole using ladder while a dog watches" data-eio="l"> Become a data science champion Explore knowledge we’ve gathered from professionals who are already championing data science in their organizations. This resource is evolving all the time, so let us know what works for you or what else you’d like to see! Build a business case Every organization is different. But each one has lessons we can all learn from. Start applying their knowledge to yours here. Grow your data science community How do you get people in your organization on board with data science? We’ve got a few tips. Working with IT Who will manage the Posit Pro Products in your organization? More ways to connect with Posit <img class="w-[40px] h-[40px] mb-[40px]" src="https://posit.co/wp-content/uploads/2022/10/Community.png" alt="icon with two people and chat bubble" data-eio="l"> Data Science Hangout Watch live as we discuss with data science leaders. <img class="w-[40px] h-[40px] mb-[40px]" src="https://posit.co/wp-content/uploads/2022/10/Support.png" alt="icon of 2 documents" data-eio="l"> Posit community Get answers and learn more from other Posit users <img class="w-[40px] h-[40px] mb-[40px]" src="https://posit.co/wp-content/uploads/2022/10/Sales.png" alt="finance icon with stacks representing money using $ symbol" data-eio="l"> Learn & Support Get info you can use. Talk to our team. Let’s do this. <img class="w-[40px] h-[40px] mb-[40px]" src="https://posit.co/wp-content/uploads/2022/09/LinkedIn-1.png" alt="linkedin logo" data-eio="l"> Join us on LinkedIn Share tips and tricks about using R, Python and Posit's professional products <img class="w-[40px] h-[40px] mb-[40px]" src="https://posit.co/wp-content/uploads/2022/10/Twitter.png" alt="twitter logo" data-eio="l"> Follow us on Twitter Stay current with the latest Posit news and content on our Twitter account.'''
year_published = 2025
year_updated = 2022
