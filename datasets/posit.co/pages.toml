title = "Benefit Corporation Annual Report - Posit"
description = "A Message from our CEO Posit aims to create free and open-source software for data science, scientific research, and technical communication in a sustainable way, because it benefits everyone when the essential tools to produce and consume knowledge are available to all, regardless of economic means. We believe corporations should fulfill a purpose beneficial to […]"
full_description = '''Legal Menu Legal Menu Product Accessibility Statement Form W9 End User License Agreement (EULA) Distributor Agreement Software License Descriptions Software License Descriptions Previous Version Learning Services Agreement TAM Terms of Service Premium Plus Support Terms Privacy Policy Acceptable Use Policy Support Agreement Website Terms of Use Posit Service Terms of Use Trademark Guidelines ECCN Policy DMCA Policy Individual Contributor Agreement Corporate Contributor Agreement Posit and the GDPR Benefit Corporation Annual Report Product Security Posit Team Dedicated Service Offering Open Source Licenses Benefit Corporation Annual Report 2024 Annual Report May 29, 2024 Download PDF A Message from our CEO Posit aims to create free and open-source software for data science, scientific research, and technical communication in a sustainable way, because it benefits everyone when the essential tools to produce and consume knowledge are available to all, regardless of economic means. We believe corporations should fulfill a purpose beneficial to the public and be run for the benefit of all stakeholders including employees, customers, and the community at large. As a Delaware Public Benefit Corporation (PBC) and a Certified B Corporation®, Posit’s open-source mission and commitment to a beneficial public purpose are codified in our charter, requiring our corporate decisions to balance the interests of community, customers, employees, and shareholders. B Corps™ meet the highest verified standards of social and environmental performance, transparency, and accountability. RStudio measures its public benefit by utilizing the non-profit B Lab®’s “Impact Assessment”, a rigorous assessment of a company’s impact on its workers, customers, community, and environment. In 2019, Posit (then RStudio) met the B Corporation certification requirements set by the B Lab. In 2023, our certification was renewed, and we are proud to share that our B Lab Impact Assessment score rose from 86.1 to 92.5 with this renewal. The B Lab certification process uses credible, comprehensive, transparent, and independent standards to measure social and environmental performance. Details of these assessments can be found on our B Lab company page. To fulfill its beneficial purposes, Posit intends to remain an independent company over the long term. With the support of our customers, employees, and the community, we remain excited to contribute useful solutions to the important problems of knowledge they face. J.J. Allaire CEO, Posit, PBC Introduction Posit’s mission is to create free and open source software for data science, scientific research, and technical communication. We do this to enhance the production and consumption of knowledge by everyone, regardless of economic means, and to facilitate collaboration and reproducible research, both of which are critical to the integrity and efficacy of work in science, education, government, and industry. In addition to our open source products, Posit produces a modular platform of commercial software products that enable teams to adopt R, Python, and other open source data science software at scale. Posit also offers online services that make it easier to learn and use data science tools over the web. Together, Posit’s open-source software and commercial software form a virtuous cycle. In most companies, a “customer” is someone who pays you. For us, the definition of a customer must include the open source community, with whom we exchange the currencies of attention, respect, and love. When we deliver value to our open source users, they will likely bring our software into their professional environments, which opens up the possibility of commercial partnerships. To keep this cycle flowing, our open source developers must know and care about the integrations with proprietary solutions that matter to our enterprise customers. It also means that Posit’s commercial teams consistently provide value to individuals who may never directly spend a dollar with us. Posit’s approach is not typical. Traditionally, scientific and technical computing companies create exclusively proprietary software. While it can provide a robust foundation for investing in product development, proprietary software can also create excessive dependency that is not good for data science practitioners and the community. In contrast, Posit provides core productivity tools, packages, protocols, and file formats as open-source software so customers aren’t overly dependent on a single software vendor. Additionally, while our commercial products enhance the development and use of our open-source software, they are not fundamentally required for those without the need or the ability to pay for them. As of May 2024, Posit is spending ~38% of its engineering resources on open-source software development, and is leading contributions to over 350 open-source projects. Posit-led projects targeted a broad range of areas including the RStudio IDE; infrastructure libraries for R and Python; numerous packages and tools to streamline data manipulation, exploration and visualization, modeling, and machine learning; and integration with external data sources. Posit also sponsors or contributes to many open-source and community projects led by others, including NumFOCUS, the R Consortium, the Python Software Foundation, DuckDB, Pandoc, pyodide, and ProseMirror, as well as dozens of smaller projects via the Open Source Collective or directly on Github. Additional information about our products and company contributions for the past two years can be found in our “Year In Review” blog posts. Today, millions of people download and use Posit open-source products in their daily lives. Additionally, more than 10,000 customers that purchase our professional products help us sustain and grow our mission. It is inspiring to help so many people participate in global economies that increasingly reward data literacy, and know that our tools help produce insights essential to navigating our complex world. Posit's Charter and Statement of Public Benefit Posit's Charter We want Posit to serve a meaningful public purpose, and we run the company for the benefit of our customers, employees, and the community at large. That’s why we’re organized as a Public Benefit Corporation (PBC). What makes a PBC different from other types of corporations? “A ‘public benefit corporation’ is a forprofit corporation organized under and subject to the requirements of this chapter that is intended to produce a public benefit or public benefits and to operate in a responsible and sustainable manner.” — Delaware Public Benefit Corporations Law As a PBC and Certified B Corporation, we must meet the highest verified standards of social and environmental performance, transparency, and accountability. Our directors and officers have a fiduciary responsibility to address social, economic, and environmental needs while still overseeing our business goals. Posit's Statement of Public Benefit Creation of free and open source software for data science, scientific research, and technical communication: 1) To enhance the production and consumption of knowledge by everyone, regardless of economic means. 2) To facilitate collaboration and reproducible research, both of which are critical for ensuring the integrity and efficacy of scientific work. Our Primary Obligations as a PBC and Certified B Corporation Public Benefit Corporation How we built our company charter • The board of directors shall manage or direct the business and affairs of the public benefit corporation in a manner that balances the pecuniary interests of the stockholders, the best interests of those materially affected by the corporation’s conduct, and the specific public benefit or public benefits identified in its certificate of incorporation. • A public benefit corporation shall no less than biennially provide its stockholders with a statement as to the corporation’s promotion of the public benefit or public benefits identified in the certificate of incorporation and of the best interests of those materially affected by the corporation’s conduct. Certified B Corp How we hold ourselves accountable to our charter • Demonstrate high social and environmental performance by achieving a B Lab Impact Assessment score of 80 or above and passing the risk review. • Make a legal commitment by changing our corporate governance structure to be accountable to all stakeholders, not just shareholders, and achieve benefit corporation status if available in our jurisdiction. • Exhibit transparency by allowing information about our performance measured against B Lab’s standards to be publicly available on our B Corp profile on B Lab’s website. Posit's Open-Source Development Projects Before the company re-branded in 2022, Posit (then RStudio) was often thought of as an “R company” in the data community because of its dedication to developing and maintaining some of the most used R libraries in the world. However, Posit has always been better described as a scientific software company. Supporting Python (via the reticulate package, RStudio language support), working with relational databases and data platforms such as Apache Spark (a cross-platform data frame compatibility via feather/Apache Arrow), and much more mean that we’ve never been solely an “R company”. Since the 2021 PBC report, Posit has released several new packages in the Python and R ecosystems and continues to maintain and grow the libraries previously developed. The following subsections highlight selected Posit software projects of interest to the broad data science community. Where metrics are published, please note these represent a lower bound on the actual number, as it is difficult-toimpossible to account for every install and usage in the world. <img class="aligncenter wp-image-20913 size-large" src="https://posit.co/wp-content/uploads/2024/05/quarto-header-1024x253-hr-1024x253.png" alt="Quarto hex on light blue background" width="1024" height="253" data-eio="l" /> Quarto In July 2022, Posit announced the Quarto project, an open-source scientific and technical publishing system as a successor to the R Markdown library. While Quarto incorporates the lessons learned from over 10 years of developing R Markdown into an entirely new project, it’s likely still quite familiar to users of R Markdown as they share two core dependencies: Knitr and Pandoc. In fact, despite the fact that Quarto does some things differently, most existing R Markdown documents can be rendered unmodified using Quarto. Quarto allows users to choose from multiple computational engines (Knitr, Jupyter, and Observable), which makes it easy to use Quarto with R, Python, Julia, JavaScript and many other languages. It also allows users to author documents as plain text markdown or Jupyter Notebooks, and publish to numerous outputs such as HTML, PDF, MS Word, ePub and more. Finally, the community has already extended Quarto , as shown by the quartodoc project for developing API documentation. There are 5 full time equivalent (FTE) employees developing open-source Quarto products as of May 2024. <img class="aligncenter wp-image-20914" src="https://posit.co/wp-content/uploads/2024/05/pbc-quarto-graph-1024x448.jpg" alt="Text: Cumulative downloads of Quarto Minor Versions. Line graph starting at 0 downloads of 0.9 Minor Version and increasing to over 3 million downloads of 1.5 Pre-Release" width="601" height="263" data-eio="l" /> <img class="aligncenter wp-image-1387 size-large" src="https://posit.co/wp-content/uploads/2022/09/shiny-header-1024x253.jpeg" alt="Shiny hex sticker on blue background" width="1024" height="253" data-eio="l" /> Shiny® Shiny has been a mainstay in the R community since its launch in 2012, providing a web application framework that makes it easy to tell data stories in interactive point-and-click web applications. In April 2023, Posit released the Python version of Shiny, bringing the same great reactive programming model and modular design to the PyData ecosystem. Shiny applications can be shared with others via an open-source Shiny Server, the hosted shinyapps.io service, or with Posit Connect. Shiny and related packages include shiny (Python, R), bslib, shinytest, shinyloadtest, shinydashboard, leaflet, and crosstalk. There are 5 FTE Posit employees developing the open-source Shiny and Shiny Server products as of May 2024. <img class="aligncenter wp-image-20915" src="https://posit.co/wp-content/uploads/2024/05/pbc-shiny-python-1024x385.jpg" alt="Text: Shiny for Python Cumulative Downloads. Line graph starting at 0 downloads in Nov 2023 ascending to over 150k downloads in May 2024" width="601" height="226" data-eio="l" /> <img class="aligncenter wp-image-20916" src="https://posit.co/wp-content/uploads/2024/05/pbc-shiny-r-1024x402.jpg" alt="Text: Shiny for R Cumulative Downloads. Line graph starting at 0 downloads in 2017 ascending to over 30M downloads in mid-2024" width="599" height="235" data-eio="l" /> <img class="aligncenter wp-image-20917 size-large" src="https://posit.co/wp-content/uploads/2024/05/PBC-report-OSprojects-headers_gt-1024x253.jpg" alt="GT hex on yellow background" width="1024" height="253" data-eio="l" /> GT / Great Tables When presenting an analysis, a table can often convey the results more concisely than the most beautiful and interactive of charts. However, the experience of creating and displaying tables in R and Python has been mixed, especially when you want to display something beyond a plain data frame representation. To that end, the gt and Great Tables packages have defined a “grammar of tables” to solve this problem (in R and Python, respectively), analogous to the “grammar of graphics” for specifying charts. As of May 2024, there is 1 FTE Posit employee developing gt / Great Tables open-source packages. <img class="aligncenter wp-image-20918" src="https://posit.co/wp-content/uploads/2024/05/pbc-great-tables-1024x435.jpg" alt="Text: great_tables Cumulative Downloads. Line graph starting at 0 downloads in Nov 2023 ascending to over 30k downloads in mid-Apr 2024" width="601" height="255" data-eio="l" /> <img class="aligncenter wp-image-20919" src="https://posit.co/wp-content/uploads/2024/05/pbc-gt-1024x477.jpg" alt="Text: gt Cumulative downloads. Line graph starting at 0 downloads in 2017 ascending to 2.5M downloads at the beginning of 2024" width="599" height="279" data-eio="l" /> <img class="aligncenter wp-image-20920 size-large" src="https://posit.co/wp-content/uploads/2024/05/PBC-report-OSprojects-headers_vetiver-1024x253.jpg" alt="Vetiver hex on peach background" width="1024" height="253" data-eio="l" /> Vetiver Vetiver solves the issues around versioning, sharing, deploying and monitoring predictive models served via APIs. Available for both R and Python, vetiver is extensible via generics that support many common types of models. Vetiver also provides the “model car'''
