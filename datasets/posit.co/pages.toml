title = "Privacy Policy - Posit"
description = "Overview Posit Software, PBC (“Posit,” “we,” “us” or “our”) (formerly known as RStudio, PBC) is committed to protecting your privacy. This Privacy Policy applies to the information that we obtain through your use of our products and/or services, our websites, including https://posit.co and our online​ store (collectively our “Websites”), or when you otherwise interact with […]"
full_description = 'Legal Menu Legal Menu Product Accessibility Statement Form W9 End User License Agreement (EULA) Distributor Agreement Software License Descriptions Software License Descriptions Previous Version Learning Services Agreement TAM Terms of Service Premium Plus Support Terms Privacy Policy Acceptable Use Policy Support Agreement Website Terms of Use Posit Service Terms of Use Trademark Guidelines ECCN Policy DMCA Policy Individual Contributor Agreement Corporate Contributor Agreement Posit and the GDPR Benefit Corporation Annual Report Product Security Posit Team Dedicated Service Offering Open Source Licenses Privacy Policy Posit Software, PBC April 29, 2024 Download PDF Overview Posit Software, PBC ("Posit," "we," "us" or "our") (formerly known as RStudio, PBC) is committed to protecting your privacy. This Privacy Policy applies to the information that we obtain through your use of our products and/or services, our websites, including https://posit.co and our online​ store (collectively our "Websites"), or when you otherwise interact with Posit. This policy sets forth our policies and procedures regarding the collection, use and disclosure of Personal Information we receive from you. By using our products, services and/or Websites, you consent to the collection, transfer, processing, storage, disclosure and other uses described in this Privacy Policy. If you do not agree to the terms set forth herein, please do not use our products, services or Websites. Please take the time to read this Privacy Policy. Unless stated otherwise, our current Privacy Policy applies to all personal information ("Personal Information") you have provided to us. Changes to this Privacy Policy We may change this Privacy Policy from time to time. If we make any changes, we will notify you by revising the "Last Updated" date at the top of this Privacy Policy and, in some cases, where appropriate we may provide you with additional notice (such as adding a statement to the login screen or sending you an email notification). We encourage you to review our Privacy Policy whenever you use our products, services and/or Websites to stay informed about our information practices and the ways you can help protect your privacy. Using our products, services and/or Websites or continuing to provide personal information to us after a notice of changes has been sent to you or published on our Websites shall constitute consent to the changed terms and practices. If you disagree with any changes to this Privacy Policy, you will need to stop using our products, services and/or Websites and deactivate your account(s). Children Children under the age of 13 are not eligible to use our Websites. We do not knowingly collect personally identifiable information from children under 13. If a parent or guardian becomes aware that his or her child has provided us with Personal Information without their consent, he or she should contact us at privacy@posit.co. If we become aware that a child under 13 has provided us with Personal Information, we will delete such information from our files. Contact Us If you have any questions about this Privacy Policy or our treatment of the information you provide us, please write to us by email at privacy@posit.co or by mail at: Posit Software, PBC Attn: Privacy 250 Northern Avenue, Suite 410 Boston, Massachusetts 02210 Information We Collect Personal Information. By using our Websites or purchasing products or services from us, you voluntarily and willingly provide us with certain information, including Personal Information, which we collect in order to provide the Websites and/or the products or services you may order. Personal Information refers to information about you that can be used to contact or identify you, and information on your use of and activities at our Websites that may be connected with you. Personal Information that we collect may include, but is not limited to, your name, phone number, credit card or other billing information, email address and home and business postal addresses. Personal Information may also include information you supply to us concerning your preferences and interests expressed in the course of use of our Websites and products or services. For example, we collect Personal Information when you purchase a product, contact us for customer or technical support, or participate in promotions. From time to time in the future, we may offer additional products, features, services and promotional opportunities that would require you to submit Personal Information to us in order to participate. If you are unsure whether you would like to provide information to us and/or having your information used as permitted in this Privacy Policy, you should not use our Websites or otherwise provide this information to us. Account and Profile Information. We collect information about you and your company as you register for an account, create or modify your profile, make purchases through, use, access, or interact with our Websites and/or our products and services (including but not limited to when you upload, download, collaborate on or share Content). If you are providing information (including Personal Information) about someone else, you confirm that you have the authority to act for them and to consent to the collection and use of their Personal Information as described in this Privacy Policy. Content. We collect and store Content that you create, input, submit, post, upload, transmit, store or display in the process of using our products, services or Websites. Such Content includes any Personal Information or other sensitive information that you choose to include ("passively-collected Personal Information"). Navigational Information. We also collect "Navigational Information" such as your IP address as well as browser type, internet service provider, URLs of referring/exit pages, operating system, date/time stamp, information you search for, locale and language preferences, identification numbers associated with your devices, your mobile carrier, and system configuration information. Some Navigational Information may be associated with Personal Information. Analytics Information. We and our analytics provider collect and store analytics information when you use our Websites and/or our products and services to help us improve our Websites, products and services. This analytics information consists of web browsing behavior collected through a combination of HTTP beacons and cookies. Analytics information also consists of data we collect as a result of running queries against Content across our user base for the purposes of generating Usage Data. "Usage Data" is aggregated data about a group or category of services, features or users that does not contain Personal Information. Though we may happen upon sensitive or Personal Information as we compile Usage Data from Content across user instances, this is a byproduct of our efforts to understand broader patterns and trends. It is not a concerted effort by us to examine the Content of any particular customer. Some of our products contain a feature that sends information about the version of the products on your systems ("System Information") to us. System Information includes information about (i) the server environment in which the product is operating: OS type and version, language and locale settings; (ii) user client information, for example: browser type and version, native client type and version, and client device specifications (e.g. screen resolution, OS version, device type, etc.). You can disable our collection of analytics information from products via the administrator settings or by blocking collection at the local network level. As of the date this policy went into effect, we use Google Analytics as an analytics provider. To learn more about the privacy policy of Google Analytics, refer to Google’s Policies and Principles. Use this​ to prevent analytics information from being sent to Google Analytics. We also use Marketo’s tool to help us with our automated marketing efforts; please refer to https://www.marketo.com/trust/legal/privacy ​ to read about Marketo’s privacy policy. How We Collect Information We collect your information in the following ways: Log Files. We may collect anonymous demographic information, which is not unique to you, such as your ZIP code, age, gender, preferences, interests and favorites using log files, when you use our Websites and/or our products and services. There is also information about your computer hardware and software that is automatically collected by our Websites. This information may include, but is not limited to, your computer’s Internet Protocol address, browser type, the web page you were visiting before you came to our site, information you search for, domain names, access times and referring website addresses. We may also collect information about the fact that you use certain features and functionality of our service and your responses to our surveys and research initiatives. This information is used by us for the operation of the Websites, to maintain quality of the Websites, and to provide general statistics regarding use of the Website. For these purposes, we do link this automatically-collected data to Personal Information such as name, email address, address, and phone number. Cookies. Like most websites, we use "cookies" and web log files to collect information to track site usage and trends, to improve our service, and to deliver a customized experience when you use our Websites and/or our products and services. A cookie is a small data file that is placed on your computer, mobile phone or other device by a web server and enables us to recognize you when you return to our site or log into our service. Cookies are uniquely assigned to you, and can only be read by a web server in the domain that issued the cookie to you. One of the primary purposes of cookies is to provide a convenience feature to save you time – for example, when you return to the same website, the information you previously provided can be retrieved, so you can easily use the features that you customized. We may use "persistent cookies" to save your registration ID and login password for future logins to the site. We may also use "session ID cookies," which expire after a short period of time or when you close your browser. Session ID cookies are used to identify a particular visit and are used to enable certain features of the site or service, to better understand how you interact with the site and service, and to monitor aggregate usage and web traffic routing on the site. We set a cookie and use local storage in your browser that contains information that we use to identify you for the functional site features described below with respect to our current third-party vendors listed in this policy. You have the ability to accept or decline cookies. Most Web browsers automatically accept cookies, but you can usually modify your browser setting to decline cookies if you prefer. If you choose to decline cookies, you may not be able to fully experience the interactive features of the Websites. We keep track of the pages you visit on the Websites, in order to determine what parts of our store and the Websites are the most popular. During Installation of Our Products. During installation, our software products and services may ask you to "opt-in" to the collection of diagnostic information regarding your use of our software or hardware in order to help our engineers improve our products or services. If you opt-in, you agree that we may collect, maintain, and use information about the operation of our products and services. While Browsing our Website. We use vendors that may collect Personal Information on our behalf. Please see the list of vendors that we currently use and how they may access and use your data, including links to their respective privacy policies at the end of this Privacy Policy. Service Providers. We monitor the activity on our Website using common software tools and third-party service providers. We collect and track information on use of the Website including referral sources, search terms, network information, IP addresses, computer and browser types, and content viewed. Unless combined with Personal Information, this other data does not personally identify any user of the Website. We may also use third-party service providers to collect and track statistical information regarding the use of the Website, and to prevent our servers from being abused. How We Use Information We Collect We use the information we collect only in compliance with this Privacy Policy. Consent to Use of Your Information. By submitting information, including Personal Information, to us, you are expressly and voluntarily accepting the terms and conditions of this Privacy Policy. You have the right to withdraw your consent to our collection and use of your information, but your withdrawal of consent will not be retroactive. We post customer testimonials and comments on our Websites, which may contain Personal Information. We obtain each customer’s consent via email prior to posting the customer’s name and testimonial. General. We use the information we collect about you (including Personal Information to the extent applicable) for a variety of purposes, including to Provide, operate, maintain, improve, and promote our products and services; Enable you to access and use our products and services; Process and complete transactions, and send you related information, including purchase confirmations and invoices; Communicate with you, including responding to your comments, questions, and requests; providing customer service and support; providing you with information about services, features, surveys, newsletters, offers, promotions, contests, and events; providing other news or information about us and our select partners; and sending you technical notices, updates, security alerts, and support and administrative messages. Generally, you have the ability to opt-out of receiving any promotional communications as described below; Monitor and analyze trends, usage, and activities in connection with our products and services and for marketing or advertising purposes; Investigate and prevent fraudulent transactions, unauthorized access to our products and services, and other illegal activities; For other purposes about which we notify you. Use of Personal Information. We may use your Personal Information and other information you provide us to (i) provide our Websites and our products and services to you and administer your use of our Websites and our products and services, (ii) to provide you with products or services that you purchase from our online store, (iii) to communicate with you and fulfill requests you may make, including requests for technical support, (iv) to provide you with information and announcements with respect to our products or service'
