["https://posit.co/about/customer-stories/turing"]
title = "Turing - Posit"
description = "Emad Khazraee, Senior Director of Data Science at Turing recently shared his experience working with Posit. Their team uses data science to support decision-making across the company and enhance their products through data-driven insights."
full_description = '''Customer Stories Turing Customer Stories <img class="max-w-[190px] rounded-lg" src="https://posit.co/wp-content/uploads/2023/12/Turing-logo.jpeg" alt="" data-eio="l"> Posit Team Streamlining deployment & enabling quick prototyping with Posit Team Emad Khazraee, Senior Director of Data Science at Turing recently shared his experience working with Posit. Their team uses data science to support decision-making across the company and enhance their products through data-driven insights. Streamlining deployment In the past, when developing new prototypes, such as a new machine learning model or ranking model, the team faced challenges deploying them. The process involved multiple stages, which limited collaboration among team members. Posit helped Turing streamline their deployment process to a single click. Utilizing git-backed content on Posit Connect, multiple team members can now collaboratively contribute to the development of new prototypes, APIs, or models. Whenever new code is shipped to Git and the branch is merged, the updated version is automatically deployed. Additionally, Turing previously used various environments, including local devices and cloud workstations. For development, they consolidated within the Posit Workbench environment, ensuring proper authentication and security checks. Quickly prototyping new ideas Turing’s data science team utilizes Python and VS Code within Posit Workbench, deploying their work to the Posit Connect platform. In a highlighted use case, Posit Connect empowers Turing’s data science team to prototype new ideas, such as a semantic search system that is empowered by a large language model (LLM). Instead of investing engineering resources to develop a full-fledged product without certainty of success, they first deploy machine learning models as Streamlit applications to Connect. This approach allows them to quickly share these prototypes with cross-functional partners and stakeholders within the company for feedback and evaluation. Emad Khazraee emphasized, “That’s one of the most successful things. Within a day, you can deploy a new idea and use it.” With Posit Connect, the deployment process was swift and involved contributions from multiple team members in different iterations. The tool continuously received feedback from stakeholders, ultimately leading to its adoption for full product development. About Turing Turing is a data-science-driven deep jobs platform helping companies spin up their engineering teams in the cloud at the push of a button. Their Intelligent Talent Cloud uses AI to source, vet, match, and manage over 3 million developers worldwide. This, in turn, helps organizations save valuable time and resources as they build their dream engineering team in a matter of days. Subscribe to more inspiring open-source data science content. We love to celebrate and help people do great science. By subscribing, you'll get alerted whenever we publish something new. Subscribe now'''
