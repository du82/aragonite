title = "Posit Cloud Products - Posit"
description = "Do, share, teach and learn data science online from the cloud. Posit Cloud, Posit Academy, and Shinyapps.io makes it possible. Also, access and deploy our professional tools like Workbench and Connect on AWS and Azure."
full_description = '''Cloud products Enable your cloud strategy Bring along your favorite data science tools to the cloud, including RStudio, R, and Python. Regardless of which approach you choose, Posit provides multiple options to support your cloud journey. <img class="w-screen rounded-lg" src="https://posit.co/wp-content/uploads/2022/10/03_CLOUD.svg" alt="illustration of two people climbing two ladders up through the clouds" data-eio="l"> Choose your cloud approach based on your needs Posit supports your data science cloud strategy. Depending on the circumstances of your organization and what specific challenges you are trying to address, there are multiple cloud options to consider. Posit Hosted Minimize cost and startup time A fully hosted service can minimize the cost and time required to start up a new project, workshop, or class. <img class="w-[100%]" src="https://posit.co/wp-content/uploads/2024/07/prod-logo-connectcloud-dk.jpg" alt="" data-eio="l"> Connect Cloud Easily share your Python and R data applications and documents in a cloud environment. Learn more <img class="w-[100%]" src="https://posit.co/wp-content/uploads/2022/10/prod-logo-cloud-dk.jpg" alt="Posit Cloud logo on dark gray background" data-eio="l"> Posit Cloud Analyze data, share projects, and teach classes and workshops with Posit Cloud. Learn more <img class="w-[100%]" src="https://posit.co/wp-content/uploads/2022/10/prod-logo-shiny.jpg" alt="Shiny logo on blue background" data-eio="l"> shinyapps.io Share Shiny applications with shinyapps.io Learn more <img class="w-[100%]" src="https://posit.co/wp-content/uploads/2022/10/prod-logo-p-pkg-mgr-dk.jpg" alt="Posit Public Package Manager logo on dark gray background" data-eio="l"> Public Package Manager Manage packages with Posit Public Package Manager, a free service to provide easy installation of package binaries, and access to previous package versions. Learn more Cloud Marketplace Offerings Simplify startup and streamline purchasing Pre-built applications offered on services such as AWS Marketplace and Azure ML make it easier to get started with images built and tested by the vendor. Cloud marketplaces may also provide streamlined purchasing options that bring access to IT infrastructure budgets and make the total cost of ownership easier to track for your organization. <img class="w-[100%]" src="https://posit.co/wp-content/uploads/2022/10/aws-mktplace.jpg" alt="AWS Marketplace logo on dark gray background" data-eio="l"> AWS Marketplace Purchase subscriptions to Posit products on the AWS Marketplace, in monthly or annual increments. Learn more <img class="w-[100%]" src="https://posit.co/wp-content/uploads/2022/10/ms-azure-mktplace.jpg" alt="Microsoft Azure Marketplace logo on white background" data-eio="l"> Azure Marketplace Purchase subscriptions to Posit Workbench and Posit Connect on the Azure Marketplace, in hourly or monthly increments. Learn more <img class="w-[100%]" src="https://posit.co/wp-content/uploads/2022/10/goog-cloud-plat.jpg" alt="Google Cloud logo on offwhite background" data-eio="l"> Google Cloud Platform Purchase subscriptions to Posit Workbench and Posit Connect on GCP in monthly increments. Learn more Managed Cloud Services Offload maintenance and administration These offerings, such as Posit Workbench on Amazon SageMaker or Azure ML, provide the convenience and scalability of the cloud while offloading the maintenance and administration to the cloud provider or a third party. <img class="w-[100%]" src="https://posit.co/wp-content/uploads/2022/10/workb-sagemaker-logo.jpg" alt="Amazon Sagemaker Logo on maroon background" data-eio="l"> Amazon SageMaker Use Posit’s professional products with the power of Amazon SageMaker. Combine Posit's toolchain with on-demand compute resources from AWS. Learn more <img class="w-[100%]" src="https://posit.co/wp-content/uploads/2022/10/workb-msazure-logo.jpg" alt="Microsoft Azure Logo on dark gray background" data-eio="l"> Azure Use Posit Workbench in conjunction with your Azure data sources and other Azure Machine Learning capabilities to access, develop, and analyze results. Learn more <img class="w-[100%] h-[100%] object-cover" src="https://posit.co/wp-content/uploads/2022/10/cust-biobuilder.jpg" alt="BioBuilder" data-eio="l"> BioBuilder The COVID-induced changes in education led BioBuilder to reimagine its curriculum. Learn More <img class="w-[100%] h-[100%] object-cover" src="https://posit.co/wp-content/uploads/2022/10/cust-reykjavik.jpg" alt="City of Reykjavik" data-eio="l"> City of Reykjavik The data science team in the city of Reykjavík, Iceland is using Posit Connect to impact the citizens of their city, one Shiny app at a time. Learn More <img class="w-[100%] h-[100%] object-cover" src="https://posit.co/wp-content/uploads/2022/10/cust-snap.jpg" alt="Snap Finance" data-eio="l"> Snap Finance Building robust, modular dashboards with internal packages, Posit Package Manager, and Posit Connect. Learn More More resources Blog Post Read the blog post, "Where does RStudio [now Posit] fit into your Cloud Journey" Read post Webinar Watch the webinar, "Why Data Science in the Cloud?", co-presented with Posit partner ProCogia. Watch Webinar If you are interested in using Posit Cloud for teaching, watch the webinar, "Teaching R online with RStudio Cloud [now Posit Cloud]" Watch Posit Cloud tools Deploy Posit products in a VPC using cloud formation templates for AWS. Learn more at Posit Cloud Tools. Learn more Docker Deploy Posit products via Docker. Learn more about Docker images for Posit Professional Products. Learn more Helm Resources Posit provides Helm charts to help you manage your Kubernetes configurations. Learn more Ready to take your data science to the Cloud? We'd love to learn more about what you're trying to accomplish with open-source data science and how our Cloud solutions can give you superpowers. Schedule a call'''
