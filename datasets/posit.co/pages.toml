["https://posit.co/data-science-hangout"]
title = "Data Science Hangout - Posit"
full_description = '''Every Thursday at 12 pm ET Data Science Hangout You’re in good company. Join a community of data scientists that share insights about what it means to be a responsible, effective, and inspiring leader. Add series to calendar <img class="w-screen rounded-lg" src="https://posit.co/wp-content/uploads/2022/10/08_DATA-SCIENCE-HANGOUT.svg" alt="illustration of four people two with their pets extending out of meeting windows to interact" data-eio="l"> Upcoming episodes <img class="aspect-video object-cover max-h-[307px] rounded-[8px] mt-[24px]" src="https://posit.co/wp-content/uploads/2025/02/BlakeAbbenante-1.jpg" alt="Blake Abbenante" data-eio="l" /> 27 Feb 2025 Blake Abbenante Join us with Blake, Director of Analytics & Data Science at Suffolk Construction, to chat about analytics in construction, cultivating high-performing teams, and building an optimal data stack. MORE INFO <img class="aspect-video object-cover max-h-[307px] rounded-[8px] mt-[24px]" src="https://posit.co/wp-content/uploads/2025/02/JessicaKlein.jpg" alt="Jessica Klein" data-eio="l" /> 06 Mar 2025 Jessica Klein Join us with Jessica, Data Scientist at the Census Bureau, to chat about their expanding training options and opportunities, the growing R and Python communities, and how the agency is generally moving towards open-source adoption for a move to the Cloud. MORE INFO <img class="aspect-video object-cover max-h-[307px] rounded-[8px] mt-[24px]" src="https://posit.co/wp-content/uploads/2025/02/JeroenJanssens-1.jpg" alt="Jeroen Janssens" data-eio="l" /> 13 Mar 2025 Jeroen Janssens Join us with Jeroen, Senior Developer Relations Engineer at Posit PBC, to chat about his experience writing books like "Data Science at the Command Line" and "Python Polars: The Definitive Guide," the importance of community and teaching in data science, and tips for aspiring data scientists looking to participate in the open source community. MORE INFO Past hangouts View all past hangouts <img class="w-full aspect-video object-cover rounded-lg" src="https://posit.co/wp-content/uploads/2025/02/JohnStanton-Geddes.jpg" alt="John Stanton-Geddes" data-eio="l" /> John Stanton-Geddes Join us with John, Sr. Manager of Advanced Analytics Marketing at HP, to chat about progress in data science and the meaning of marketing analytics. 02/20/2025 Learn More <img class="w-full aspect-video object-cover rounded-lg" src="https://posit.co/wp-content/uploads/2025/02/Mrinal_Raghupathi-1.jpg" alt="Mrinal Raghupathi" data-eio="l" /> Mrinal Raghupathi Join us with Mrinal, Data Scientist at YouTube, to chat about the different "flavors" of data science and data scientists, the differences and similarities in quant and data science roles in finance and technology, and attempts at automation and citizen coding. 02/13/2025 Learn More <img class="w-full aspect-video object-cover rounded-lg" src="https://posit.co/wp-content/uploads/2025/01/JoshVanderLeest.jpg" alt="Josh VanderLeest" data-eio="l" /> Josh VanderLeest Join us with Josh, Manager of Data Analytics in People Analytics at Progressive Insurance, to chat about advancing People Analytics careers, leveraging generative AI, developing code-based reporting, and advocating for open source tools within large organizations. 02/06/2025 Learn More ABOUT DATA SCIENCE HANGOUT Helping data science leaders grow together <img src="https://fast.wistia.com/embed/medias/tktoq99icv/swatch" style="filter:blur(5px);height:100%;object-fit:contain;width:100%;" alt="" aria-hidden="true" onload="this.parentNode.style.opacity=1;" data-eio="l" /> We’ve built a group of data scientists that celebrate what it means to be a leader. We prioritize representation from all different industries, genders, ethnicities, backgrounds, and years of experience. It doesn’t matter how long you’ve been in the data science game — your title, background, or education either. What does matter is that you’re passionate about learning, celebrating diverse perspectives, and raising the bar for what it means to be a data scientist. So join with an open mind, an appetite to learn, and if you’re up to the challenge, something to contribute to your fellow data scientists. When you grow, we grow. Hope to see you there! What happens in a Data Science Hangout? Each week, host Rachael Dempsey invites an accomplished data science leader to talk about their experience and answer questions from the audience. The discussion focuses mainly on the human elements of data science leadership. There’s no sales or marketing fluff, just great insights from inspiring professionals. Featured speakers Interested in leading a Data Science Hangout? Send Rachael Dempsey an email at rachael@posit.co or add her on LinkedIn Customer Stories View all stories Customer story <img class="rounded-[8px] mt-[20px] max-h-[168px] object-cover" src="https://posit.co/wp-content/uploads/2022/10/cust-brownforman.jpg" alt="workers check and move barrels at a distillery under sign with Brown-Forman Handcr...Our Own Barrels texts" data-eio="l" /> Brown-Forman Posit tools allowed our statisticians and data scientists to turn into application developers and data engineers without learning any new languages or computer science skills. Learn more Customer story <img class="rounded-[8px] mt-[20px] max-h-[168px] object-cover" src="https://posit.co/wp-content/uploads/2022/10/cust-biobuilder.jpg" alt="young science student extracts liquid from a beaker" data-eio="l" /> BioBuilder The COVID-induced changes in education led BioBuilder to reimagine its curriculum. Learn more Customer story <img class="rounded-[8px] mt-[20px] max-h-[168px] object-cover" src="https://posit.co/wp-content/uploads/2022/10/cust-reykjavik.jpg" alt="wide shot of people enjoying a geothermic pool in Iceland" data-eio="l" /> City of Reykjavik The data science team in the city of Reykjavík, Iceland is using Posit Connect to impact the citizens of their city, one Shiny app at a time. Learn more Customer story <img class="rounded-[8px] mt-[20px] max-h-[168px] object-cover" src="https://posit.co/wp-content/uploads/2022/06/cust-az-2.jpg" alt="" data-eio="l" /> AstraZeneca Training & empowering more than 1,100 R users at AstraZeneca Learn more Customer story <img class="rounded-[8px] mt-[20px] max-h-[168px] object-cover" src="https://posit.co/wp-content/uploads/2023/06/ping-hero.jpg" alt="" data-eio="l" /> PING At PING, a small team of engineers, technologists, and data scientists harness the power of Posit Connect to democratize golf through data insights with a dynamic new user-facing application. Learn more Customer story <img class="rounded-[8px] mt-[20px] max-h-[168px] object-cover" src="https://posit.co/wp-content/uploads/2022/10/cust-stackoverflow.jpg" alt="Belgium point map data of Europe" data-eio="l" /> Stack Overflow Posit Connect has reduced the frustrations and increased the effectiveness for all of us on the data team at Stack Overflow. It's been a game changer for communicating the results of our analyses and modeling! Learn more Stay in the loop <img class="w-[40px] h-[40px] mb-[40px]" src="https://posit.co/wp-content/uploads/2022/10/ico-li-dkb.svg" alt="linkedin logo" data-eio="l"> LinkedIn Group Connect with others and keep in touch. Join Us <img class="w-[40px] h-[40px] mb-[40px]" src="https://posit.co/wp-content/uploads/2022/10/ico-yt-dkb.svg" alt="youtube logo" data-eio="l"> Youtube Channel View full episodes and hangout highlights. Watch Videos <img class="w-[40px] h-[40px] mb-[40px]" src="https://posit.co/wp-content/uploads/2022/10/ico-tw-dkb.svg" alt="twitter logo" data-eio="l"> Twitter Discover weekly calls, highlights, and tips. Follow Us <img class="w-[40px] h-[40px] mb-[40px]" src="https://posit.co/wp-content/uploads/2022/10/ico-li-dkb.svg" alt="linkedin logo" data-eio="l"> LinkedIn Group Connect with others and keep in touch. Join Us <img class="w-[40px] h-[40px] mb-[40px]" src="https://posit.co/wp-content/uploads/2022/10/ico-yt-dkb.svg" alt="youtube logo" data-eio="l"> Youtube Channel View full episodes and hangout highlights. Watch Videos <img class="w-[40px] h-[40px] mb-[40px]" src="https://posit.co/wp-content/uploads/2022/10/ico-tw-dkb.svg" alt="twitter logo" data-eio="l"> Twitter Discover weekly calls, highlights, and tips. Follow Us Subscribe to more inspiring open-source and data science leadership content. We want to help people go further with open-source data science. Subscribe to receive updates whenever we publish something new. Subscribe'''
year_published = 2025
year_updated = 2024
clearnet = "https://posit.co/data-science-hangout"
