title = "City of Reykjavik - Posit"
description = "The data science team in the city of Reykjavík, Iceland is using Posit Connect to impact the citizens of their city, one Shiny app at a time."
full_description = '''Customer Stories City of Reykjavik Customer Stories <img class="max-w-[190px] rounded-lg" src="https://posit.co/wp-content/uploads/2022/10/reykjavik-logo-blk.png" alt="Reykjavik logo" data-eio="l"> Posit Connect A stroke of innovation Transforming a city through digital transformation <img class="hero-image w-screen rounded-lg" src="https://posit.co/wp-content/uploads/2022/10/cust-reykjavik.jpg" alt="wide shot of people enjoying a geothermic pool in Iceland" data-eio="l"> <img decoding="async" style="filter: blur(5px); height: 100%; object-fit: contain; width: 100%;" src="https://fast.wistia.com/embed/medias/nngw21jqnm/swatch" alt="" aria-hidden="true" data-eio="l" /> 366,425 POPULATION ICELAND 122,853 RESIDENTS OF REYKJAVIK 243,572 REST OF ICELAND “It can be harsh like a lunar landscape, but it can also be vivid and green. I have these moments when I’m biking to work and it’s dark. I can see the stars and I can see the moon. What a moment. I’m experiencing this moment as part of the universe. I can see the universe at its deepest.” Óli Páll Geirsson Chief Data Officer const statsGrid = document.querySelector('.stats-grid'); const statsCards = statsGrid.querySelectorAll('.stats-card'); // Remove any previously added class statsGrid.classList.remove('has-1-card', 'has-2-cards', 'has-3-cards'); // Add the corresponding class based on the number of cards if (statsCards.length === 1) { statsGrid.classList.add('has-1-card'); } else if (statsCards.length === 2) { statsGrid.classList.add('has-2-cards'); } else if (statsCards.length === 3) { statsGrid.classList.add('has-3-cards'); } 1. Transforming Iceland When you think of Iceland you imagine dramatic landscapes, the northern lights, and the Blue Lagoon. The ‘Land of Fire and Ice’ is home to natural beauty, yes, but it also has some of the top thinkers in science, environmental issues, and economics. In the capital city of Reykjavík, scientists are using data to impact the lives of citizens in many ways, including their swimming pool culture. We sat down with Chief Data Officer Óli Páll Geirsson and his team in Reykjavík to learn more about their impact and how they’re using data science to better the lives of the citizens of their city. Reykjavík is transforming. Socially. Politically. Technologically. Important things are happening here. Óli’s contribution to this journey started two years ago. <img fetchpriority="high" decoding="async" class="alignnone wp-image-3853 size-large" src="https://posit.co/wp-content/uploads/2022/10/new_oli-1024x509.jpeg" alt="" width="1024" height="509" srcset="https://posit.co/wp-content/uploads/2022/10/new_oli-1024x509.jpeg 1024w, https://posit.co/wp-content/uploads/2022/10/new_oli-300x149.jpeg 300w, https://posit.co/wp-content/uploads/2022/10/new_oli-768x382.jpeg 768w, https://posit.co/wp-content/uploads/2022/10/new_oli.jpeg 1448w" sizes="(max-width: 1024px) 100vw, 1024px" data-eio="l" /> “I saw in the newspaper, like a physical newspaper, that they were advertising the role of Chief Data Officer at the City of Reykjavík.” He was surprised. “First of all, what is paper, like what’s going on here? And the second thing: is the city really thinking about data on this scale? Are they really creating a position of Chief Data Officer?” Óli is quick to remind you of Iceland’s size. Less than 400,000 people live there, almost a third in Reykjavík. <img decoding="async" class="alignnone wp-image-3859 size-large" src="https://posit.co/wp-content/uploads/2022/10/collage-1024x565.png" alt="" width="1024" height="565" srcset="https://posit.co/wp-content/uploads/2022/10/collage-1024x565.png 1024w, https://posit.co/wp-content/uploads/2022/10/collage-300x165.png 300w, https://posit.co/wp-content/uploads/2022/10/collage-768x424.png 768w, https://posit.co/wp-content/uploads/2022/10/collage-1536x847.png 1536w, https://posit.co/wp-content/uploads/2022/10/collage.png 1920w" sizes="(max-width: 1024px) 100vw, 1024px" data-eio="l" /> "Pools are what people in Iceland do. It’s where they start their days, end their days, catch up with their fellow citizens." Óli Páll Geirsson Chief Data Officer 2. Social Swimming So what does one do on an arctic island where the winters are long and the summers are short? The obvious answer: pools. Not the kind that you’re thinking of – dirty, chlorine-filled tubs of water in uninspiring places. Pools in Iceland are beautiful. Therapeutic, hot bodies of water set against dramatic landscapes. They’re powered by geothermal energy, the result of Iceland’s convenient location on two tectonic plates. Natural water in Iceland doesn’t need to be heated. It’s pumped out of the ground already at 80 degrees Celsius, or 176 degrees Fahrenheit. Pools are what people in Iceland do. It’s where they start their days, end their days, catch up with their fellow citizens. “There’s a certain culture – a deep culture – ingrained with these swimming pools,” Óli says. “I can go into the hot tub and have a discussion with someone with a fancy title but is just there enjoying the moment. The fun thing is that you put aside your differences and your titles and you’re just there, experiencing the moment together. It’s really beautiful.” In the winter months, sunset is only 4 hours after sunrise. 2 hours in some northerly towns. A consequence of this is vitamin D deficiency. Thermal pools offer a solution to this challenge. Icelanders, even on the coldest, darkest days, can go to the pool and strip themselves of their clothes, exposing their skin to what little sunlight is available. The hot water protects them from the freezing wind. <img class="roudned-lg" src="https://posit.co/wp-content/uploads/2022/10/chapter_2_photo_1-1.jpeg" alt="people soaking in a geothermic pool in Iceland" data-eio="l" /> “There’s a certain culture - a deep culture - ingrained with these swimming pools,” Óli says 3. The data-driven idea Before putting a team in place or setting any priorities, Óli had already thought about the impact he wanted to make. He loved the idea of doing something good for citizens, something of value. During his first few weeks, he cracked open the phone book and reached out to departments and citizens, pitching an idea to people that would listen: “We are going to use the power of data to enhance the quality of life for somebody. How amazing is that?” Óli is big on conversations, on listening. He’s decidedly proactive about it. “We are not an institution that you come to. We are a service center that comes to you. It wouldn’t make any sense for a data science team to exist in a corner office alone, training models, and not having conversations with anybody.” And if you ask citizens what they want, they’ll tell you. “I got frequent requests. Even phone calls.” Óli begins and laughs. “Why can’t I see how many guests are in each swimming pool right now?” <img class="roudned-lg" src="https://posit.co/wp-content/uploads/2022/10/chapter_3_photo_1.jpeg" alt="wide shot of indoor swimming pool with swimmers practicing" data-eio="l" /> This is what the citizens of Iceland want to know: How crowded is a specific pool at a specific time? "Why can’t I see how many guests there are in the swimming pool right now?" Óli Páll Geirsson Chief Data Officer This is what the citizens of Iceland want to know: How crowded is a specific pool at a specific time? If you’re not from Iceland, you might not understand just how valuable this information is. It would be like if foodies in New York could know how many available tables there were at popular restaurants, on a Saturday night, minutes before leaving and without any reservations. Or if tourists in Paris knew exactly how many people were visiting the Eiffel Tower at a moment in time. Someone who wants to go to the pool to socialize doesn’t want to find it empty, and someone who wants to go the pool to relax in peace doesn’t want to sift through dozens or hundreds of people for a spot. Like most data science problems, it’s a straightforward question that is fairly complex to answer. For one, how crowded a pool is depends on the pool’s size. It doesn’t do someone any good to tell them that there are twenty people in a pool if they don’t how big the pool is. Adding to the complexity, the number of people at a specific pool at any given time is transient. People go to pools, enjoy their swim and relax…then they leave. A pool that is mostly empty at nine in the morning might be crowded by the time someone arrives thirty minutes later. Pools, like other venues, experience peak hours and down hours, and these hours differ from pool to pool depending on where it’s located. A pool in downtown Reykjavík might be most crowded right after work on the weekdays, while a pool like The Blue Lagoon, outside of the capital city, might be more crowded on a Saturday morning. 4. Building a team Óli’s ambition from the start was to build a team capable of handling challenges like this – data-savvy people with the willingness and grit necessary to find, ingest, transform, and operationalize data. <img decoding="async" class="alignnone wp-image-3868 size-full" src="https://posit.co/wp-content/uploads/2022/10/team-data.png" alt="" width="1008" height="682" srcset="https://posit.co/wp-content/uploads/2022/10/team-data.png 1008w, https://posit.co/wp-content/uploads/2022/10/team-data-300x203.png 300w, https://posit.co/wp-content/uploads/2022/10/team-data-768x520.png 768w" sizes="(max-width: 1008px) 100vw, 1008px" data-eio="l" /> His first priority was to find someone who could establish a foundation. Someone who has a nose for finding data scattered across systems and departments, structured in different ways. To fit the bill: Hlynur Hallgrímsson, Senior Data Scientist on Óli’s team. If Óli is the person building inroads to the data science team at the City of Reykjavík from other departments, it’s Hlynur who fills those roads with data. He finds data sources in systems housed within other departments, then architects ways to ingest, store, and organize it all. From there, he does something with the data, analyzing it to find stories and narratives that would interest stakeholders in other departments. What does the Department of Welfare need to know about? What’s possible with the data that the Department of Leisure collects? These are the stories that Óli and his team want to tell using data. To help them do that: Þorbjörn Þórarinsson, also a data scientist at the City of Reykjavík. Þorbjörn specializes in operationalizing insights, finding beautiful and intuitive ways to articulate Hlynur’s analysis to stakeholders. He takes Hlynur’s models, analyses, and insights and packages them up into data products like Shiny Applications. His goal is to make it easy as humanly possible for people who aren’t familiar with code or navigating data products to access their data in engaging, elegant ways. To keep the trains running on time, Óli and his team have Inga Gunnarsdottir and Sigríður Friðgeirsdóttir. Inga is the team’s project manager. Sigríður is a data scientist, building internal applications for the team to use. Together, Óli’s team has almost complete control over the data science value chain. They can find data, ingest it, analyze it, build beautiful data products, and share it all with stakeholders. The team is uniquely equipped to cover a lot of ground without needing additional support. 5. The workflow and infrastructure The pool project started with a promise by the Department of Sport and Leisure: “We have updated the gates at our swimming pools to modern electronic turnstiles. With these modern gates we can now get information on how many people are at each swimming pool through an API. Can you help us present this data?” This pitch made it seem like the project would be simple. A gate would record when someone enters and leaves the pool. Data indicating the exact number of people in the pool would be readily available with a bit of configuration. All Hlynur would have to do is ingest this data using an API, clean it up, and figure out a way to express it visually with the help of Þorbjörn. Light work. Httr could be used to ingest the data Packages from the Tidyverse could be used to clean it Ggplot2 could be used to visualize it Shiny Application could be built for stakeholders to interact with the visualization Of course, it wasn’t that simple. Hlynur assumed two things that ended up not being true. One, that the data would be readily available. All he would have to do is get it from the gates. And two, that the data actually measured how many people were in the pool at a given time, like the Department of Sports and Leisure promised. “It was a tragic miscalculation on my part”, Hlynur says. There was disagreement over who owned the data. It was the view of the vendor who provided the gates that the data belonged to them, not the Department of Sports and Leisure. Óli and his team first requested the data in February of 2020. They didn’t receive access until February of 2021 after lawyers settled the conflict about ownership. <img decoding="async" class="alignnone wp-image-3882 size-large" src="https://posit.co/wp-content/uploads/2022/10/chapter_5_photo_1-1024x509.jpeg" alt="" width="1024" height="509" srcset="https://posit.co/wp-content/uploads/2022/10/chapter_5_photo_1-1024x509.jpeg 1024w, https://posit.co/wp-content/uploads/2022/10/chapter_5_photo_1-300x149.jpeg 300w, https://posit.co/wp-content/uploads/2022/10/chapter_5_photo_1-768x382.jpeg 768w, https://posit.co/wp-content/uploads/2022/10/chapter_5_photo_1.jpeg 1448w" sizes="(max-width: 1024px) 100vw, 1024px" data-eio="l" /> Regarding the quality of the data, after they received what the gates recorded, the data looked something like this: <img decoding="async" class="alignnone wp-image-3883 size-large" src="https://posit.co/wp-content/uploads/2022/10/Screen-Shot-2022-10-16-at-10.57.18-1024x483.png" alt="" width="1024" height="483" srcset="https://posit.co/wp-content/uploads/2022/10/Screen-Shot-2022-10-16-at-10.57.18-1024x483.png 1024w, https://posit.co/wp-content/uploads/2022/10/Screen-Shot-2022-10-16-at-10.57.18-300x142.png 300w, https://posit.co/wp-content/uploads/2022/10/Screen-Shot-2022-10-16-at-10.57.18-768x362.png 768w, https://posit.co/wp-content/uploads/2022/10/Screen-Shot-2022-10-16-at-10.57.18.png 1240w" sizes="(max-width: 1024px) 100vw, 1024px" data-eio="l" /> What you’re looking at are graphs that should be showing how many people are at each pool at a specific time on November 5th. What you’re actually looking at is the cumulative sum of people who visited the pool throughout the day. “You can see that for 5 of the 6 swimming pools in question, the number of people is strictly increasing.” adds Hlynur. This is obviously not right. In turns out, the gates counted when people entered the pool. But they didn’t count when people left the pool. Only one swimming pool – Laugardaslaug – passed the eyeball test when Hlynur was looking at the data. It was the only pool that cou'''
