["https://posit.co/products"]
title = "Products Overview - Posit"
full_description = '''Discover our products Produce insights that matter Change the world with open source software for data science teams that love R and Python, ready for professional (and personal) use — on premises and in the cloud. <img class="w-screen rounded-lg" src="https://posit.co/wp-content/uploads/2022/10/productsOV-hero.jpg" alt="Cropped shot of 7 people at a table with laptops and tablets." data-eio="l"> Products for everyone Scrappy and just starting out? Thought leader for a Global 500 company? Wherever you are on your data science journey, we have data science tools you can use. <img src="https://posit.co/wp-content/uploads/2022/10/productOV-col-img1.jpg" alt="2 men sitting and smiling with 3 people in the background at tables" class="object-cover rounded-[8px] w-[36%] h-[87px] md:h-[186px] lg:h-[122px] " data-eio="l"> <img src="https://posit.co/wp-content/uploads/2022/10/productOV-col-img2.jpg" alt="A diverse team of women working on a project sketching on paper and working on computer" class="object-cover rounded-[8px] w-[58%] mt-auto" data-eio="l"> Academics & Individuals Doing data science on your own and in the classroom is fun and easy with Posit. Our popular, open-source RStudio IDE is used by millions of people around the world, including students, and professionals. We also build, maintain, and support a network of packages to make your time with source data science easier and more productive. And, if you're adopting Posit for data science education in the classroom, we have cloud solutions (and free or discounted on prem solutions) for you to use. Small & Medium Businesses Yes, you can use all of our open-source tools in professional environments at no cost. This includes the RStudio IDE and Shiny. That said, we also offer affordable commercial options that help small and medium sized businesses reach new heights. Do valuable things like deploy applications securely, collaborate on data products, and share content with your stakeholders without breaking the bank. Enterprise We build world-class tools for large organizations that want to change the world with data. With our enterprise solutions, all of your data scientists can adopt the open-source tools that they know and love at scale. There's no project that's too complex or aspiration that's too large for our professional toolchain to handle. Take a tour Check out our wide range of products that scale to the needs of every individual user, and all organizations. <img class="max-w-[60px] h-[60px] w-full object-contain max-h-min" src="https://posit.co/wp-content/uploads/2022/09/door-open.svg" alt="icon of open door" data-eio="l"> Open Source We believe open-source data science tools should actually be open to everyone. And that includes you. Explore open source RStudio RStudio is an integrated development environment (IDE) for R and Python. It includes a console, syntax-highlighting editor that supports direct code execution, and tools for plotting, history, debugging, and workspace management. Learn more tidymodels The tidymodels framework is a collection of packages for modeling and machine learning using tidyverse principles. Learn more tidyverse The tidyverse is an opinionated collection of R packages designed for data science. All packages share an underlying design philosophy, grammar, and data structures. Learn more Quarto Weave together narrative text and code to produce elegantly formatted output. Quarto documents are fully reproducible. Use markdown with code cells executed via Jupyter or render existing Jupyter notebooks. Learn more ggplot2 A system for declaratively creating graphics. You provide the data, tell ggplot2 how to map variables to aesthetics, what graphical primitives to use, and it takes care of the details. Learn more Shiny Server Posit lets you put Shiny web applications and interactive documents online in the way that works best for you. For Shiny applications, consider Shiny Server. Learn more RStudio Server RStudio Server enables you to provide a browser-based interface to a version of R running on a remote Linux server, bringing the power and productivity of the RStudio IDE to server-based deployments of R. Learn more R Packages We contribute code to many R packages and projects. R users are doing some of the most innovative and important work in science, education, and industry. It’s a daily inspiration and challenge to keep up with the community and all it is accomplishing Learn more <img class="max-w-[60px] h-[60px] w-full object-contain max-h-min" src="https://posit.co/wp-content/uploads/2022/09/cloud.svg" alt="icon of window and two clouds" data-eio="l"> Cloud Tools Do, share, teach and learn data science online from the cloud. Posit Cloud, and Shinyapps.io makes it possible. Also, access and deploy our professional tools like Workbench and Connect on AWS and Azure. Explore cloud tools Connect Cloud Easily share your Python and R data applications and documents in a cloud environment. Learn more Azure Use Posit Workbench in conjunction with your Azure data sources and other Azure Machine Learning capabilities to access, develop, and analyze results. Learn more Amazon SageMaker Use Posit’s professional products with the power of Amazon SageMaker. Combine Posit's toolchain with on-demand compute resources from AWS. Learn more Shinyapps.io Deploying your Shiny applications could not be easier. You don’t need to own a server or know how to configure a firewall to deploy and manage your applications in the cloud. Learn more Posit Cloud Analyze data, share projects, and teach classes and workshops with Posit Cloud. Learn more Public Package Manager Manage packages with Posit Public Package Manager, a free service to provide easy installation of package binaries, and access to previous package versions. Learn more <img class="max-w-[60px] h-[60px] w-full object-contain max-h-min" src="https://posit.co/wp-content/uploads/2022/09/enterprise.svg" alt="icon of 3 different sized devices" data-eio="l"> For the enterprise With our enterprise solutions, all of your data scientists can adopt the open-source tools that they know and love at scale. Data science teams can push the boundaries of what's possible with code while continuing to meet enterprise requirements. Nothing’s too complex or too large for our professional toolchain to handle. Contact Sales Posit Team All we know about enterprise data science. All in one place. Posit Team is a collection of tools designed to help your organization make the most of your investments in R and Python. Learn more Posit Workbench Enable collaboration and enhance productivity across your multilingual data science team with a centralized infrastructure while allowing your team members to use their development environment of choice. Learn more Posit Connect Share data science content across your organization. One button deployment of Shiny applications, R & Python APIs, Quarto and R Markdown reports, Jupyter Notebooks, and more. Learn more Posit Package Manager Control, organize, and govern your use of packages to increase reproducibility and decrease the time you spend installing and troubleshooting. Learn more Posit Academy A hybrid learning platform providing better data science training through skill development and apprenticeship. Deploy Academy as a turn-key solution within your organization today and begin cultivating tomorrow’s talent. Learn more We make data science available to everyone, regardless of your economic means. Contact Sales <img class="w-[40px] h-[40px] mb-[40px]" src="https://posit.co/wp-content/uploads/2022/10/products-overview__graduation-cap-illustration.png" alt="icon of graduation cap" data-eio="l"> Academics & Individuals For individuals, we build the best open-source and free tools for data scientists who want to use R and Python. Most of these products are free and always will be. For Academic institutions that want to use our professional toolchain in a teaching environment, we offer our entire professional toolchain at no cost. Learn More <img class="w-[40px] h-[40px] mb-[40px]" src="https://posit.co/wp-content/uploads/2022/10/products-overview__bar-chart-illustration.png" alt="icon of dot-and-line graph above bar chart" data-eio="l"> Small & Medium Businesses Great data science isn’t just for big companies. We make our entire professional toolchain affordable for SMBs with annual revenues less than $10M and operating budgets less than $5M. Learn More <img class="w-[40px] h-[40px] mb-[40px]" src="https://posit.co/wp-content/uploads/2022/10/products-overview__data-scheme-illustration.png" alt="icon of data silo" data-eio="l"> Enterprise Our pricing for enterprises is flexible and transparent. Tell us about your team and we’ll work with you to find the best pricing structure for your organization. Talk to an Expert Not sure which products are right for you? We'd love to learn more about what you're trying to accomplish with data science and point you in the right direction. Schedule a Call'''
