["https://posit.co/about/customer-stories/dow"]
title = "Dow - Posit"
description = "Dow is one of the world’s largest materials sciences companies, and it faces immense challenges — to repeatedly innovate, to deliver practical solutions, and to do it all in a sustainable way."
full_description = '''Customer Stories Dow Customer Stories <img class="max-w-[190px] rounded-lg" src="https://posit.co/wp-content/uploads/2024/08/Dow-red.png" alt="" data-eio="l"> Posit Team Posit Academy At Dow, the power of data science is confronting sustainability <img src="https://fast.wistia.com/embed/medias/5y73q5x2mv/swatch" style="filter:blur(5px);height:100%;object-fit:contain;width:100%;" alt="" aria-hidden="true" onload="this.parentNode.style.opacity=1;" data-eio="l" /> At Dow, one of the world’s largest materials sciences companies, mission matters. Dow is one of the world’s largest materials sciences companies, and it faces immense challenges — to repeatedly innovate, to deliver practical solutions, and to do it all in a sustainable way. The company has an ambitious and public goal to reach net-zero carbon emissions by 2050, and it has projects and plans in place to account for 95% of its CO2 mitigation. That remaining 5% — it impassions the team at Dow. 15% CO2 volume reduction from 2005-2020 95% projection oF CO2 mitigation by 2050 “Having innovative projects, pushing the boundaries of material science is part of what we do every day within R&D. And that 5% really motivates me to think about what we could do to push that even further to zero.” James Wade Research Scientist, Dow const statsGrid = document.querySelector('.stats-grid'); const statsCards = statsGrid.querySelectorAll('.stats-card'); // Remove any previously added class statsGrid.classList.remove('has-1-card', 'has-2-cards', 'has-3-cards'); // Add the corresponding class based on the number of cards if (statsCards.length === 1) { statsGrid.classList.add('has-1-card'); } else if (statsCards.length === 2) { statsGrid.classList.add('has-2-cards'); } else if (statsCards.length === 3) { statsGrid.classList.add('has-3-cards'); } “We're very serious about reaching carbon neutrality,” James Wade, research scientist says. “Having innovative projects, pushing the boundaries of material science is part of what we do every day within R&D. And that 5% really motivates me to think about what we could do to push that even further to zero? “It’s something you hear us talking about all the time, because it really is part of our identity, not only as a research organization, but also as a company.” To confront the challenge, Dow has made data science a priority throughout the organization, and it’s using Posit to empower “citizen data scientists” to find answers, share ideas, and collaborate on game-changing solutions. Today, more than 300 Dow researchers utilize Posit, with even more benefiting indirectly through applications deployed on Posit Connect. “Before we were regularly using the Posit suite of tools, a lot of the data science work we were doing was scattered,” Wade says. “We have a very capable and innovative bunch of researchers that are able to get a lot done with just about any set of tooling that you throw at them. However, the Posit tools have enabled an extremely low barrier to entry. That's allowed people who have an idea to go test that idea in a matter of minutes and to be able to share that with some of their colleagues with relative ease.” <img src="https://fast.wistia.com/embed/medias/3zu6uvw790/swatch" style="filter:blur(5px);height:100%;object-fit:contain;width:100%;" alt="" aria-hidden="true" onload="this.parentNode.style.opacity=1;" data-eio="l" /> Posit: Dow’s go-to for all data science Tony Sokolov, a research scientist at Dow, works across R&D teams teams to to better contextualize data and drive better decisions. <img src="https://fast.wistia.com/embed/medias/x8wa8c2cnn/swatch" style="filter:blur(5px);height:100%;object-fit:contain;width:100%;" alt="" aria-hidden="true" onload="this.parentNode.style.opacity=1;" data-eio="l" /> Telling stories with data Camila Saez Cabezas is a self-taught data scientist with a passion for making people’s lives better. "Since 2019, we’ve grown from this handful of researchers to over 300 people now having access to Posit Workbench internally and even more using apps that are deployed on Posit Connect. This growth has been in part through our investment in Posit Academy, where we’re teaching people how to code using an example and a project that’s tailored to [their] work." James Wade Research Scientist, Dow Ready to help your data scientists learn R & Python? Posit Academy is the premier solution for upskilling your organization in essential open-source data science skills. Ready to take your team to the next level? Let's talk. Schedule a call with us'''
year_published = 2025
year_updated = 2024
