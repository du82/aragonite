["https://posit.co/about"]
title = "About - Posit"
full_description = '''About us Open source for a better world Our mission is to create open-source software for data science, scientific research, and technical communication. We do this to enhance the production and consumption of knowledge by everyone, regardless of economic means. <img class="w-screen rounded-lg" src="https://posit.co/wp-content/uploads/2022/10/ABOUT.svg" alt="illustration of 12 people using each other to lift one another up around abstract shapes" data-eio="l"> Open since day one RStudio (now Posit) was founded in 2009 with the vision of creating high quality open-source software for data scientists. We’ve grown exponentially over time but our culture remains unchanged. We invest heavily in open-source development, education, and the community with the goal of serving knowledge creators 100 years from now. Posit Open Source Our Charter We want Posit to serve a meaningful public purpose and we run the company for the benefit of our customers, employees, and the community at large. That’s why we’re designated as a Public Benefit Corporation. As a Certified B Corp, we must meet the highest verified standards of social and environmental performance, transparency, and accountability. Our directors and officers have a fiduciary responsibility to address social, economic, and environmental needs while still overseeing our business goals. Public Benefit Annual Report Our evolving story We are proud of the story of our company. And we're only just beginning. 2009 RStudio is founded. Free and open source products are released. 2011 RStudio IDE 2012 Shiny 2014 RStudio Server Pro Shiny Server Pro 2016 Spark tidyverse 2017 RStudio Connect 2018 Databases TensorFlow Ursa Labs RStudio Package Manager 2019 Python & Jupyter Notebook support 2020 RStudio::conf has over 2000 attendees. Public Benefit Corp announced. 2022 RStudio becomes Posit. Shiny for Python 2009 RStudio is founded. Free and open source products are released. 2011 RStudio IDE 2012 Shiny 2014 RStudio Server Pro Shiny Server Pro 2016 Spark tidyverse 2017 RStudio Connect 2018 Databases TensorFlow Ursa Labs RStudio Package Manager 2019 Python & Jupyter Notebook support 2020 RStudio::conf has over 2000 attendees. Public Benefit Corp announced. 2022 RStudio becomes Posit. Shiny for Python Our People The code we live by People who work with data deserve an inclusive and supportive community that’s sincerely interested in empowering them to do more. So do our employees. Here are some of the things that make Posit, Posit. Open We aim for transparency in the way we make and share tools—and the way we manage our company. We believe that great ideas come from anywhere—and that we’re better together. Resourceful Intelligence is more than ‘book smart’ or ‘tech smart.’ It’s a mindset. To better serve everyone in our community we value continuous learning, curiosity, and emotional intelligence. Generous We collaborate with our customers, the community, and each other with open hearts and minds. And we believe the effort, capital, and care we put out into the world benefits everyone in the end. Lasting We want to remain an independent company for the long term. We make investments with this goal in mind, starting with our people. Our benefits programs are designed to ensure the long-term wellbeing of our teams. Join us If you share our values, our commitment to data science, and our healthy obsession for open-source code, we’d love to meet you. Explore a career at Posit <img class="h-[117px] md:h-[117px] lg:h-[163px] rounded-[8px] object-cover" src="https://posit.co/wp-content/uploads/2022/10/about-col-img1.jpg" alt="People at an aquarium looking up at an animal swimming overhead" data-eio="l"> <img class="h-[282px] md:h-[224px] lg:h-[324px] rounded-[8px] object-cover mt-[16px]" src="https://posit.co/wp-content/uploads/2022/10/about-col-img3.jpg" alt="row of people sitting at a conference looking ahead" data-eio="l"> <img class="h-[199.5px] md:h-[170.5px] lg:h-[244px] rounded-[8px] object-cover" src="https://posit.co/wp-content/uploads/2022/10/about-col-img2.jpg" alt="Man sitting in seat smiling with other people sitting in an audience" data-eio="l"> <img class="h-[199.5px] md:h-[170.5px] lg:h-[244px] rounded-[8px] object-cover mt-[16px]" src="https://posit.co/wp-content/uploads/2022/10/about-col-img4.jpg" alt="2 people talk in the foreground with a large amount of people in the background" data-eio="l">'''
year_published = 2009
year_updated = 2023
