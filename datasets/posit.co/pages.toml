$inputs = document.querySelectorAll('input, select') const $fields = Array.from($inputs).filter(($input) => $input.classList.contains('mktoField')) if($fields.length) { $fields.forEach(($input) => { $input.addEventListener('keydown', (event) => { if(!$input.classList.contains('mktoFieldDescriptor') && event.keyCode === 13) { event.preventDefault() } }) }) } } initialStateOfTheForm() preventLostFocusOnEnter() addCheckboxWrapperClass() });'''
