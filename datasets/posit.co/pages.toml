["https://posit.co/about/careers"]
title = "Careers - Posit"
full_description = '''WORK WITH US Careers at Posit Join a team working to make great software that helps people understand data and make better decisions. If you're kind, humble, and curious — you belong here. <img src="https://fast.wistia.com/embed/medias/le2j1ezwr6/swatch" style="filter:blur(5px);height:100%;object-fit:contain;width:100%;" alt="" aria-hidden="true" onload="this.parentNode.style.opacity=1;" data-eio="l" /> <img class="w-full" src="https://posit.co/wp-content/uploads/2022/10/careers-life-at.jpg" alt="Woman sitting on couch at home working at laptop with face framed by rectangle computer terminal" data-eio="l"> Life at Posit Looking to work with a fully remote, people-first team? Joining Posit could be the next step on your path to a balanced, fulfilling career. Open We’re committed to building open-source tools and a working environment that works for everyone. We're welcoming and inclusive, inquisitive and curious — and quick to adapt. Resourceful We're creative problem-solvers: experienced practitioners with applied expertise. We continuously examine our assumptions and make space to learn from both our wins and mistakes. Generous We communicate kindly, share freely, and support each other. We believe business and community can work together to build a more inclusive and sustainable economy. Lasting We're committed, authentic, and act with integrity. We take the long-term perspective. We want our work to continue to positively impact the world 100+ years from now. Our Culture 100% remote from the start, we trust our people to manage their calendars, energy, and collaborations with others to get important work done together. Taking time to recharge is expected and encouraged. We want you to feel safe bringing your whole self to work. Our mission is to create products for anyone, anywhere – and it is essential that our team reflects the diversity of our users. <img class="h-[117px] md:h-[117px] lg:h-[163px] rounded-[8px] object-cover" src="https://posit.co/wp-content/uploads/2022/10/careers-col-img1.jpg" alt="Hadley Wickham on stage speaking at a past conf event" data-eio="l"> <img class="h-[282px] md:h-[224px] lg:h-[324px] rounded-[8px] object-cover mt-[16px]" src="https://posit.co/wp-content/uploads/2022/10/careers-col-img3.jpg" alt="Two men with event badges smiling and playing foosball at a conf event" data-eio="l"> <img class="h-[199.5px] md:h-[170.5px] lg:h-[244px] rounded-[8px] object-cover" src="https://posit.co/wp-content/uploads/2022/10/careers-col-img2.jpg" alt="Posit employees working the registration booth at the annual company conference" data-eio="l"> <img class="h-[199.5px] md:h-[170.5px] lg:h-[244px] rounded-[8px] object-cover mt-[16px]" src="https://posit.co/wp-content/uploads/2022/10/careers-col-img4.jpg" alt="Two women with microphones speaking on a panel on stage at an event" data-eio="l"> The Posit DNA Open to anyone, supported by everyone The best work happens when employees are well-supported. We offer extensive, inclusive, people-centered benefits for your personal and financial well-being. <img class="w-[40px] h-[40px]" src="https://posit.co/wp-content/uploads/2022/10/Open.png" alt="icon of open door" data-eio="l"> Inclusive Wellness Our plans cover 100% of medical, dental, and vision insurance premiums for employees and their families! Our plans also include fertility, mental health, and gender-affirming care. <img class="w-[40px] h-[40px]" src="https://posit.co/wp-content/uploads/2022/10/Finance.png" alt="icon of wallet and $ symbol" data-eio="l"> Financial Well-Being Competitive compensation, a robust 401(k) matching program (after only six months of employment!), and an annual bonus for employees. When you succeed, we succeed. <img class="w-[40px] h-[40px]" src="https://posit.co/wp-content/uploads/2022/10/Card.png" alt="icon of computer window and chat bubble" data-eio="l"> Work Comfortably You don't have to be in an office to do great things. Wherever you work, we've got you covered with home office stipends and co-working rental reimbursements. <img class="w-[40px] h-[40px]" src="https://posit.co/wp-content/uploads/2022/10/People.png" alt="icon of 2 people" data-eio="l"> Togetherness Our once-a-year, all-company gathering provides connection in person or virtually, depending on your ability to travel. We value accessibility and togetherness in all its forms. <img class="w-[40px] h-[40px]" src="https://posit.co/wp-content/uploads/2022/10/Family.png" alt="icon of 2 people" data-eio="l"> Family Matters Families come in all different shapes and sizes. We provide gender-neutral paid parental leave for adoptive, foster, and birth parents. <img class="w-[40px] h-[40px]" src="https://posit.co/wp-content/uploads/2022/10/Insights.png" alt="icon of dot line graph" data-eio="l"> Balance Our culture and flexible time off policy encourage you to take time for yourself. We fully support unplugging, unwinding, and having a good time. <img class="w-[40px] h-[40px]" src="https://posit.co/wp-content/uploads/2022/10/Open.png" alt="icon of open door" data-eio="l"> Inclusive Wellness Our plans cover 100% of medical, dental, and vision insurance premiums for employees and their families! Our plans also include fertility, mental health, and gender-affirming care. <img class="w-[40px] h-[40px]" src="https://posit.co/wp-content/uploads/2022/10/Finance.png" alt="icon of wallet and $ symbol" data-eio="l"> Financial Well-Being Competitive compensation, a robust 401(k) matching program (after only six months of employment!), and an annual bonus for employees. When you succeed, we succeed. <img class="w-[40px] h-[40px]" src="https://posit.co/wp-content/uploads/2022/10/Card.png" alt="icon of computer window and chat bubble" data-eio="l"> Work Comfortably You don't have to be in an office to do great things. Wherever you work, we've got you covered with home office stipends and co-working rental reimbursements. <img class="w-[40px] h-[40px]" src="https://posit.co/wp-content/uploads/2022/10/People.png" alt="icon of 2 people" data-eio="l"> Togetherness Our once-a-year, all-company gathering provides connection in person or virtually, depending on your ability to travel. We value accessibility and togetherness in all its forms. <img class="w-[40px] h-[40px]" src="https://posit.co/wp-content/uploads/2022/10/Family.png" alt="icon of 2 people" data-eio="l"> Family Matters Families come in all different shapes and sizes. We provide gender-neutral paid parental leave for adoptive, foster, and birth parents. <img class="w-[40px] h-[40px]" src="https://posit.co/wp-content/uploads/2022/10/Insights.png" alt="icon of dot line graph" data-eio="l"> Balance Our culture and flexible time off policy encourage you to take time for yourself. We fully support unplugging, unwinding, and having a good time. Join Us Open Positions Don’t see what you’re looking for? Interested in working for Posit but don’t see the right role for you? That’s okay. We’d still love to meet you! We know multiple perspectives are essential for a thriving organization and encourage people from all backgrounds and experiences to apply. APPLY HERE'''
