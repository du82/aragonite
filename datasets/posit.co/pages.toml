description = "Learn, grow, and connect with a global community of data scientists at our annual R & Python data science conference."
full_description = '''posit::conf - R & Python Data science Conference <img class="hero-foreground" src="/wp-content/uploads/2024/12/hero-conf2025.png" alt="Posit Conference Abstract" data-eio="l"> Atlanta POSIT::CONF(2025) A polyglot community of innovators and transformers Learn, grow, and connect with a global community of data scientists at our annual data science conference. Get tickets Share Via Copy Link Copy SUPER EARLY BIRD Best event pricing ending in: weeks days hours minutes Registered attendees, view on-demand sessions Download the app or visit the event portal <img width="204" height="69" src="https://posit.co/wp-content/uploads/2024/08/app-store-button.png" class="h-full w-auto" alt="" decoding="async" data-eio="l" /> <img width="239" height="71" src="https://posit.co/wp-content/uploads/2024/08/google-play-badge.png" class="h-full w-auto" alt="" decoding="async" data-eio="l" /> 15+ Workshops 110+ Talks 1.5k+ Attendees The Fundamentals All things R & Python In fact, all things open source data science, because our mission matters. Whether you’re just starting your data science journey, a skilled professional, or a data science leader, posit::conf(2024) had it all, with four talk tracks, community events, updates on product enhancements, all-day workshops, and keynotes from your favorite data scientists. Get Tickets View Sessions Day One WORKSHOPS 9a - 5p Workshops 5:30p Welcome Reception Day Two CONFERENCE 9a Keynote 10:20a Talks 11:40a Lunch and networking 1p Talks 2:40p Talks 4:15p Keynote 7p Evening Event Day Three CONFERENCE 9a Keynote 10:20a Talks 11:40a Lunch and networking 1p Talks 2:40p Talks 4:15p Keynote Sep 16-18, 2025What to expect Experience autumn in Atlanta with Posit A 3-day deep dive into the latest innovations in data science Join us for an unforgettable three days of learning and networking in the vibrant city of Atlanta. From immersive workshops to inspiring keynotes and lively networking events, there’s something for everyone. Pricing Workshops conf::funstats Who attended posit::conf(2024)? We thought it would be fun to take a snapshot of the global attendees of this year’s conference, using Posit tools to visualize the data real-time. Attendees filled out our Shiny app form and their information was added real-time to the Quarto slide presentation of data visualizations below. The Fundamentals The future of data science is here Join our polyglot data science community Discover the latest advancements in data science at posit::conf(2025). Explore cutting-edge tools, techniques, and best practices from industry leaders. With four tracks, workshops, and community events, there's something for everyone. Whether you're a seasoned data scientist or just starting out, join us to shape the future of data science. Get Tickets View Sessions Day One WORKSHOPS Tues., Sept. 16th 9a - 5p Workshops 5:30p Welcome Reception Day Two CONFERENCE Weds., Sept. 17th 9a Keynote 10:20a Talks 11:40a Lunch & networking 1p Talks 4:15p Keynote 7p Evening Event Day Three CONFERENCE Thurs., Sept. 18th 9a Keynote 10:20a Talks 11:40a Lunch and networking 1p Talks 4:15p Keynote 2024 Highlights Relive the magic of Seattle 2024 A year of groundbreaking advancements in open-source data science tools. Revisit the best moments from posit::conf(2024) in Seattle. From Allen Downey's thought-provoking keynote to the latest advancements in R and Python, our conference brought together the data science community to learn and share the latest advancements in data science. Explore session recordings, workshop materials, and more in the 2024 highlights blog. wistia-player[media-id='jyltfd828f']:not(:defined) { background: center / contain no-repeat url('https://fast.wistia.com/embed/medias/jyltfd828f/swatch'); display: block; filter: blur(5px);} <img width="459" height="342" src="https://posit.co/wp-content/uploads/2024/12/posit-hadley-key-img.jpg" class="w-[100%] h-[100%] object-cover" alt="" decoding="async" fetchpriority="high" srcset