full_description = '''Talk to us Book a call today! You're in the right place. For pricing, professional product inquiries, or any other questions you have for our sales team, fill out the form on this page, select the date and time you’re available on the calendar, and you’re all set! If you need to speak with us sooner about purchasing our commercial products, please email us at sales@posit.co. Looking for other resources?<img src="https://posit.co/wp-content/uploads/2024/10/icon-community.svg" alt="" data-eio="l">Check out our Community Forum for help from the Posit community.<img src="https://posit.co/wp-content/uploads/2024/10/icon-support.svg" alt="" data-eio="l">Search within Posit Support for documentation, knowledge base, or platform support questions.<img src="https://posit.co/wp-content/uploads/2024/10/icon-download.svg" alt="" data-eio="l">Don’t need support and looking for where to Download RStudio? MktoForms2.loadForm("//pages.rstudio.net", "709-NXN-706", 3658, (form) => { const $privacyRow = document.querySelector('#LblprivacyPolicyRead') const $privacyCheckbox = document.querySelector('.mktoCheckboxList #LblprivacyPolicyRead') if($privacyRow) { const $privacyWrapper = $privacyRow.parentNode; $privacyWrapper.classList.add('privacy-wrapper'); $privacyRow.removeAttribute('for') $privacyRow.style.cursor='pointer'; $privacyRow.id = 'lblPrivacyPolicyLink' $privacyRow.setAttribute('aria-label', 'Please check this box if you agree to Posit Privacy Policy'); $privacyRow.addEventListener('click',()=>{ const $privacyInput = document.querySelector('#privacyPolicyRead') $privacyInput.checked = !$privacyInput.checked }) } if($privacyCheckbox) { $privacyCheckbox.innerHTML = `<div class="opacity-0">Checkbox</div>` } const initialStateOfTheForm = () => { const formElem = form.getFormElem(); formElem[0].classList.add('initial'); form.onValidate(isValid => { this.input = document.querySelector('.mktoEmailField') this.cbPrivacy = document.querySelector('#privacyPolicyRead') this.mailFormat = /^\w+([\.-]?\w+)*@\w+([\.-]?\w+)*(\.\w{2,3})+$/; if (isValid && this.input.value.trim().match(this.mailFormat) && this.cbPrivacy.checked) { form.submittable(true) } else { form.submittable(false) formElem[0].classList.remove('initial'); } }) } const addCheckboxWrapperClass = () => { const $checkboxInputs = document.querySelectorAll('.mktoLogicalField'); if($checkboxInputs.length) { $checkboxInputs.forEach(($checkboxInput) => { const $checkboxWrapper = $checkboxInput.parentNode; $checkboxWrapper.className += ' checkbox-wrapper'; }) } } const preventLostFocusOnEnter = () => { const $inputs = document.querySelectorAll('input, select') const $fields = Array.from($inputs).filter(($input) => $input.classList.contains('mktoField')) if($fields.length) { $fields.forEach(($input) => { $input.addEventListener('keydown', (event) => { if(!$input.classList.contains('mktoFieldDescriptor') && event.keyCode === 13) { event.preventDefault() } }) }) } } initialStateOfTheForm() preventLostFocusOnEnter() addCheckboxWrapperClass() }); var _ld_scriptEl = document.createElement('script'); _ld_scriptEl.src = 'https://cdn.leandata.com/js-snippet/ld-book-v2.js'; _ld_scriptEl.addEventListener('load', function () { const urlParams = new URLSearchParams(window.location.search); if (urlParams.has("aliId")) { LDBookItV2.initialize('00DE0000000e8xzMAA', 'Meeting Request', 'LD_BookIt_Log_ID__c'); LDBookItV2.submit(); } else { LDBookItV2.initialize('00DE0000000e8xzMAA', 'Meeting Request', 'LD_BookIt_Log_ID__c'); LDBookItV2.setFormProvider('marketo'); } }); document.body.appendChild(_ld_scriptEl);'''
