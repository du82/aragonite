["https://postd.cc/how-to-stop-analysis-paralysis-and-make-more-confident-decisions"]
title = "分析による思考の麻痺を脱し、自信を持って決断を下す方法 | POSTD"
description = "「決断の時における最善の選択は、正しいことをすること。最悪の選択は、何もしないことだ。」セオドア・ルーズベルトの言葉です。 人生を左右する可能性のある重要な決断を下すとき、結果が不確実であることや、…"
full_description = "2024年4月26日分析による思考の麻痺を脱し、自信を持って決断を下す方法起業家精神意思決定クリティカルシンキングHow to Stop Analysis Paralysis and Make More Confident Decisions(2024-2-17)by Vinita Bansal本記事は、原著者の許諾のもとに翻訳・掲載しております。「決断の時における最善の選択は、正しいことをすること。最悪の選択は、何もしないことだ。」セオドア・ルーズベルトの言葉です。 人生を左右する可能性のある重要な決断を下すとき、結果が不確実であることや、未知の領域に踏み込むことへの不安から、ひたすらデータを集めては分析を繰り返し、必要以上に考え過ぎてしまう非生産的な悪循環に陥ってしまうことがあります。 想像が膨らんでしまい、最悪のシナリオを想定してそれが最善だと思い込んでしまうこともあれば、頭の中にストーリーを描き、良い選択肢があるにもかかわらず、より良い選択肢があるのではと考えて全て却下してしまうこともあります。 こうした決断の例としては、引越し、退職と起業、転職、企業戦略の大転換などがあります。 恐怖心、完璧主義、怠惰、集中すべき目標の欠如など、理由はさまざまですが、分析ばかりに時間を費やして一向に行動を起こさないでいると、「analysis paralysis（分析による思考の麻痺）」と呼ばれる一種の思考停止状態に陥ってしまいます。完璧な決断を下そうと思うあまり、決断できなくなってしまうのです。ありもしない確実性を追求し続けるため、結論が出ずもがき苦しみます。何が最善の決断で、どうすれば望む結果が得られるのかなど、誰にも分からないのです。 none考え過ぎると、分析が逆に思考を麻痺させてしまいます。考え抜くことは大事ですが、考えることを行動を起こさないことの言い訳にしている人が多いように思います。 — ロバート・ハージャベック 完璧な決断を下すことはできませんが、より自信を持って決断を下すことは可能です。そのために実践できる4つの方法をご紹介します。 実現したい結果を明確に定義する 問題の定義が曖昧だったり、実現したい結果が不明確だったりする中で決断を下そうとすると、何時間もデータと睨めっこするだけで、いつまで経っても結論が出ないということになりかねません。 決断を下せない原因について、問題が複雑であることや、インプットが足りないこと、データポイントが少ないことなどを挙げるかもしれませんが、これらは全て真実から目を逸らすための言い訳に過ぎません。真実とはすなわち、自分が何を望んでいるのかが分からないということです。 問題を明確にし、成功の基準を定義することが、決断を下すために行うべき作業の半分です。これが、決断を下して望む結果を手にするための足がかりとなります。この作業を怠ると、残り半分の作業にいくら労力を割いても徒労に終わります。 前半の作業を行うにあたり、以下の問いについて考えてみるとよいでしょう。 解決したい問題は何か？ 解決するべき問題は本当にこれでいいのか？ どのような結果を実現したいのか？自分にとって最も重要なことは何か？ 結果を実現できたかどうかはどう確認するのか？成功基準は何か？ 思考の麻痺は、成功基準が達成不可能な場合にも起こります。挙げた目標を全て100%確実に実現することを期待し、一切の妥協を認めない場合などです。 望む結果を単に羅列しただけでは優れた成功基準とは言えません。自分にとって最も重要なことを一つ特定する必要があります。それがあなたの北極星（道しるべ）になります。道しるべが分かっていると、決断を下すのも容易になります。道しるべにたどり着けそうな、有望な選択肢を見つけるだけでいいのです。 問題と実現したい結果を明確に定義することで、常に目標をしっかりと見据え、意思決定プロセスを容易にすることができます。 必要十分で満足する 何かを決断するとき、さまざまな選択肢や異なる視点、複数の情報源を考慮するのは良いことです。そうすることで、バイアスや思い込み、その他の状況的制約によって、決断と実現する結果が制限されるのを防ぐことができます。 選択肢があるのは良い一方で、選択肢が多過ぎるとかえって圧倒されてしまいます。選択肢が多ければ多いほど、決断を下すのは難しくなります。情報過多と多過ぎる選択肢は決断力の低下を招くのです。 解決策の調査に多くの時間を費やし、それぞれの欠点にばかり注目し、最善の選択肢を見つけようとひたすら時間と労力を注ぎ込むことになりかねません。しかし、決断を下して前に進むどころか、選択肢が多過ぎると不安が膨らむばかりです。 選択肢が多過ぎると思考能力が奪われ、決断を先送りにしがちです。 選択肢が増えると満足度が下り、自分の選択に自信が持てなくなって、後で決断を後悔する可能性が高まることを示す研究結果もあります。 心理学者のバリー・シュワルツは、人間は「マキシマイザー（利益最大化人間）」と「サティスファイサー（満足化人間）」の2種類に分けることができると言います。マキシマイザーは、最大の利益をもたらす選択をしようと努力し、最高の結果のみを求め、受け入れます。全ての選択肢をよく吟味しなければ選択できないため、絶えず情報を求めては他者と比較します。一方、サティスファイサーはより控えめな基準を用いて、受け入れ可能なレベルを超える選択肢を選びます。 none「サティスファイス（満足化）」するということは、十分なレベルで満足し、より良い選択肢があるかもしれない可能性については考えないということです。」 — バリー・シュワルツ 思考の麻痺に陥らないために、サティスファイサーになりましょう。それには以下のことを行う必要があります。 調査範囲に境界を設けましょう。無制限に調査を行うことは避けてください。収集する情報量や考慮するインプットを制限し、期限を設けましょう。 決断にも期限を設けましょう。危機感を持つためにも、問題の規模や複雑さを踏まえた期限を設定してください。 それぞれの選択肢について良い点と悪い点を挙げ、その時点で際立って優れて見えるものを選びましょう。 決断を下したら、より良い選択肢の可能性については考えないようにします。自分の決断について後からあれこれ悩むことはせず、決断を実行に移していきましょう。 必要十分で満足するということは、平凡な選択肢を受け入れるのとは違います。十分な検討と思慮に基づいて選択を行う必要はありますが、一定の制限を設けた上で行うのであり、より良い選択肢の可能性についてくよくよ悩むのではなく、決断を行動に移すことに時間と労力を費やすということです。 直感でデータを組み合わせる 思考が麻痺すると、決断を前に尻込みしてしまいます。合理的な選択をしたいがために行き詰まりを感じます。それ自体は自然なことですが、問題は、知らず知らずのうちに合理性の追求から過度な分析を行うようになり、その結果、意思決定を先送りしてしまうことです。 合理的アプローチには、慎重な思考が求められます。脳の前頭葉を働かせ、さまざまな選択肢を考慮し、妥協点を比較した上で選択を行います。直感的思考は、感情や経験、知識を動員して行います。このような思考は非論理的でも非合理的でもなく、生涯を通じて養ってきた知性です。 脳はパターンを認識するようにできており、直感的思考ではあなたが現在置かれている状況を過去のパターンに照らし合わせ、それをもとに決断を下します。直感が時に正しく、時に間違っているのはそのためです。 判断と意思決定にまつわる心理学や行動経済学の研究で知られる心理学者および経済学者のダニエル・カーネマンは、直感の働きは次の3つの条件に基づくと言います。 傾向やパターンを認識するためには、一定の規則性が求められます。直感は、目まぐるしく変化する複雑な状況下では養うことも、適用することもできません。 直感を信じるためには、その分野について豊富な経験と練習が必要です。それがなければ、直感を働かせて万事うまくいったとしても、それは単に運が良かっただけであり、直感がもたらした結果ではありません。 直感が正しかったかどうかについて、即座に具体的なフィードバックが得られます。 これらのうち該当しないものがある場合、問題についてもっと合理的に考え抜いた方がいいでしょう。 ほとんどの人は、意思決定を行う際に分析的思考と直感的思考のいずれかを使用します。これは、両者が共存できない相反する戦略だと考えているからです。しかし、研究ではそれとは異なる事実が明らかになっています。私たちの最良の決断は、分析的思考と直感的思考のいずれかを使用するのではなく、両方を組み合わせて使用したときに生まれるのです。 noneパターン照合のみに頼った純粋に直感的な戦略は、パターン照合がもたらす選択肢が間違っていることがあるため、リスクが大き過ぎます。逆に、思索のみに頼った分析的な戦略だと時間がかかり過ぎます。 — ゲーリー・クライン 思考の麻痺に陥ったときは、データのみに頼るのではなく、過去の知識や経験も加味して決断を下すとよいでしょう。脳の理性をつかさどる部分を使ってさまざまな選択肢を考慮し、直感も交えて最終的な決断を下しましょう。 決断を下すのに適切な時間帯を選ぶ 1日を通して小さな決断を何度も下すことは、それ自体さほど精神的負担を強いるものではないため、一見無害に思えるかもしれません。しかし、エネルギーを消費し続けて1日の終わりを迎える頃には、決断を下す余力が失われてきます。 実際に感じることができてすぐに現れる身体的疲労とは異なり、繰り返し意思決定を行ってきたことによる精神的疲労は目に見えません。 心理学者が意思決定疲労と呼ぶこの状態は、意思決定の質の低下を招きます。いくつもの意思決定を行った後は、折り合いをつけることを渋り、簡単な選択肢に落ち着こうとし、自制心を働かせることさえ難しく感じられるかもしれません。 none一日中難しい決断を迫られるような仕事だと、気力もいつかは底をつき、エネルギーを節約する方法を探し始めます。例えば、決断を避けたり、先送りしたりする言い訳を探すようになるでしょう。また、最も楽で安全な選択肢を探すようになるでしょう。そしてその選択肢とは、多くの場合、現状を維持することです。 — ロイ・バウマイスター 良い決断を下すためには、さまざまな領域の知識を動員し、異なるアイデアをつなぎ合わせ、アイデアの深さと幅広さの適切なバランスを保ち、新たなつながりを生み出し、いくつかの有望な候補に焦点を定める必要があります。 疲労により頭の働きが鈍ってくると、雑音と信号を聞き分けることも難しくなります。その結果、考え過ぎてしまうようになり、具体的な方向性を示すこともできないまま、いくつものアイデアを行ったり来たりするようになります。 意思決定疲労は、存在すらしない問題について延々と考えたり、偏った結論を導いたり、より良い選択肢の可能性にとらわれ分析による思考の麻痺状態に陥ったりする原因になり得ます。その時の状況で最良の決断を下すのではなく、完璧な解決策を追求しようとしてしまうかもしれません。 重要な決断について思考の麻痺に陥らないようにするため、そうした決断は、頭の情報処理能力がピークの時間帯に下すようにしましょう。気力が充実しているタイミングに合わせて精神的負担が強いられる決断を下すことで、考え過ぎてしまう悪循環に落ちる可能性を減らせるでしょう。 決断を下す前に、以下の問いを自問してみてください。 今がこの決断を下すのにベストな時間帯か？ この決断を下すにあたって、ベストコンディションにあると言えるか？ 普段に比べて周りが慌ただしく感じられるか？ その決断を下すのに自分がベストの状態にある時間帯を確保し、カレンダーに書き込みましょう。そしてその時間になったら、それ以上決断を遅らせないよう自分に言い聞かせ、目標に集中しましょう。 初めはばからしく感じられるかもしれませんが、実際に繰り返し行うことで、考え過ぎることなく決断を下せるようになってくるはずです。 最後はテリー・グッドカインドの以下の言葉で終わりたいと思います。筆者が思考の麻痺に陥ったときに、いつも助けてくれる言葉です。 none「何も選択しないより、間違った選択をした方がいい場合もあります。あなたに前に進む勇気があるのであれば、それは稀有なことです。岐路に立ち、進むべき方向を選べない人は、どこにもたどり着けません。」 考えることをやめ、今すぐ行動しましょう。 まとめ 重要な決断は先送りするべきではありませんが、そうしてしまいがちです。完璧な決断を下そうとすると、思考が麻痺してかえって決断を下せなくなってしまい、行動を起こして前に進むことができなくなります。 問題や実現したい結果を明確に定義しないことが、思考の麻痺に陥る最大の原因の一つです。なかなか決断を下せず苦しんでいる場合、問題と成功基準を明確に定義しましょう。 最良の選択肢のみを追求するマキシマイザーになるのではなく、サティスファイサーになり、十分満足できる選択肢を特定して心配することをやめましょう。 直感を無視して合理的思考に重点を置き過ぎると、思考が麻痺します。考え過ぎによる悪循環を断ち切り、積極的に行動を起こすには、直感と合理的思考を組み合わせる戦略が効果的です。 意思決定疲労により疲れた頭は、決断を下すことを拒むようになります。この現象に対処する方法として、気力が充実している時間帯に決断を下すようにするとよいでしょう。 この記事は以前こちらで公開されたものです。他の記事にも興味のある方は、LinkedInまたはこちらをぜひフォローしてください。監修者古川陽介株式会社リクルート プロダクト統括本部 プロダクト開発統括室 グループマネジャー 株式会社ニジボックス デベロップメント室 室長 Node.js 日本ユーザーグループ代表複合機メーカー、ゲーム会社を経て、2016年に株式会社リクルートテクノロジーズ(現リクルート)入社。 現在はAPソリューショングループのマネジャーとしてアプリ基盤の改善や運用、各種開発支援ツールの開発、またテックリードとしてエンジニアチームの支援や育成までを担う。 2019年より株式会社ニジボックスを兼務し、室長としてエンジニア育成基盤の設計、技術指南も遂行。 Node.js 日本ユーザーグループの代表を務め、Node学園祭などを主宰。Twitter: @yosuke_furukawaGithub: yosuke-furukawaTweetpocket最新記事2025年2月21日Interopと難解な問題2025年1月24日CORSガイドの決定版2024年12月12日進化した正規表現：JavaScriptの正規表現の歴史と未来2024年11月28日アルゴリズムのパフォーマンスを段階的に改善する2024年10月19日ReactコードをCSSの:hasセレクタで置き換えるPICK UP タグJavaScriptReactGoogleUIデザインソフトウェアアーキテクチャNodeJS生産性パフォーマンスデータサイエンスアジャイルまとめエンジニア採用タグ一覧を見るNIJIBOX Information"
