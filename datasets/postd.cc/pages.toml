full_description = "利用規約「POSTD利用規約」 「POSTD利用規約」（以下「本利用規約」といいます。）は、株式会社ニジボックス（以下「当社」といいます。）が提供するサービス「POSTD」（以下「本サービス」といいます。）の利用に関する条件について定めるものです。当社は、お客様（以下「ユーザー」といいます。）による本サービスの利用をもって、ユーザーが本利用規約に同意したものとみなし、本利用規約は、ユーザーに適用されます。 なお、本利用規約の日本語版と日本語以外の言語の翻訳版に矛盾または相違がある場合には、日本語版の内容が優先されるものとします。 また、本サービスは実験的なサービスを含んでおり、当社は、ユーザーに対し、何らの予告を行うことなく、本サービスの全部または一部につき、変更または廃止することがございますので、予めご了承ください。 第1条（本サービスの利用） ユーザーは、本利用規約に定める条件に従って、本サービスを利用するものとします。本サービスの内容および機能に関する詳細については、本サービスが提供される端末の画面上で、別途表示されるものとします。 ユーザーは、本利用規約の他、本サービスが提供される端末の画面上に掲示される注意事項等も遵守するものとします。 ユーザーは、通信環境その他の事情により、本サービスの全部または一部の機能が利用できない場合があることを予め了承し、これに起因して発生したユーザーの損害について、当社を免責します。 当社は、本サービスの全部又は一部を第三者に委託できるものとし、ユーザーは、かかる委託を承諾するものとします。 第2条（第三者提供サービスからの情報の取得） ユーザーが本サービス上で第三者の提供するサービス（以下「第三者提供サービス」といいます。）で使用可能なID等の情報を入力した場合には、当社は、第三者提供サービスからユーザーの情報を取得することができるものとし、ユーザーは予めこれを承諾するものとします。 第3条（知的財産権等） 本サービスにおいて当社が提供する文章、画像、プログラムその他のデータ等のコンテンツ（以下「本コンテンツ」といいます。）についての一切の権利（所有権、知的財産権、肖像権、パブリシティー権等）は、ユーザー投稿を除き、当社または当該権利を有する第三者に帰属するものとし、当社は、第三者の有する一切の権利を侵害することのないよう努力するものとします。 ユーザーは、方法または形態の如何を問わず、本コンテンツを当社に無断で複製、複写、転載、転送、蓄積、販売、出版その他ユーザー個人の私的利用の範囲を超えて使用してはならないものとします。 第4条（ユーザー投稿） ユーザーが、本サービスを利用して、当社が指定するWEBサイト（以下、「本サイト」といいます。）上に、文章、URL等を投稿した場合（以下、当該投稿された文章、URL等を「ユーザー投稿」といいます。）、ユーザーは、ユーザー投稿に関して、当社が、以下の各号に定める行為を行なうこと、ならびに、ユーザー投稿の複製、公衆送信、頒布、貸与、改編、編集、映画化、および翻案その他の使用を行なうことを、無償で、当社に許諾したものとします。この許諾は、非独占的で再許諾および譲渡の可能なものとし、ユーザーは、当該ユーザー投稿に関する著作者人格権（氏名表示権、同一性保持権）を行使しないものとします。 （１） 内容について審査すること （２） 本サイト上で掲載すること、または、掲載しないこと （３） 修正して、本サイト上で掲載すること（当該掲載期間を決定することを含みます。） （４） 本サイト上への掲載後に、修正すること、または掲載を停止すること （５） ユーザーへの事前の通知なく、本サイト上のデータを削除すること ユーザーは、ユーザー投稿の著作権その他ユーザー投稿に関する権利は、本利用規約に別段の定めがある場合を除き、ユーザーに帰属し、第三者の権利を侵害するものではないことを表明し、保証します 前項の規定にもかかわらず、ユーザーが、著作権その他の権利の全部または一部が第三者に帰属する画像、文章等（例：第三者の発言したコメント等）（以下「第三者情報等」といいます。）の本サイト上への投稿を希望する場合、ユーザーは、当該第三者が本利用規約においてユーザーが負担する義務と同様の義務を負担すること、および、ユーザーが当該第三者情報等を本サイト上に投稿することについて、当該第三者から同意を得た上で、当該第三者情報等を本サイト上に投稿するものとします。 ユーザーが前項の規定に違反し、当社または他のユーザーと、第三者情報等の権利者との間にトラブルが発生した場合、ユーザーは、自己の責任と費用において当該トラブルの解決を図るものとし、当社に一切の迷惑をかけないものとします。 ユーザーは、ユーザー投稿の内容に起因して発生した一切の損害について賠償責任を負うと共に、以下の各号に掲げる投稿またはその恐れのある投稿を、本サイト上で行わないものとします。 （１） 当社または第三者の著作権、商標権その他の知的財産権、プライバシー権、名誉等、第三者の権利を侵害する内容の投稿 （２） 他人になりすました投稿 （３） 当社の信頼を毀損する内容の投稿 （４） 本サービスの内容および機能や本サービスにおいて提供される情報の正確性に関するお問合せやクレームの投稿 （５） 有害なコンピュータプログラム、スパムメール、チェーンレター、ジャンクメール等の送信を伴う投稿 （６） 当社または特定の企業、法人、団体、地域、個人を誹謗、中傷し、名誉、プライバシーを傷つける、または差別発言するなどの不適切な表現（伏字での発言も含める。）を含む内容の投稿 （７） 公職選挙運動、特定の思想・宗教への勧誘、またはそれらに類する内容の投稿 （８） ポルノ小説・写真、性的交渉の勧誘、その他猥褻な内容の投稿 （９） 児童や青少年に対し、粗暴性、残虐性または犯罪を誘発助長し、その健全な育成を阻害する内容の投稿 （１０） 差別的表現、ナンセンス、グロテスクな内容の投稿 （１１） 法令、公序良俗に反する内容の投稿 （１２） その他、本サービスに不適切な内容、表現であると当社が判断する内容の投稿 第5条（ユーザーの責任） ユーザーは、本サービスを利用してなされたユーザーの一切の行為およびその結果（ユーザー間のコミュニケーションに基づくトラブルを含みます。）に起因して、当社に何らの不利益、負担または損害を与えないものとします。仮に当社がユーザーの行為およびその結果に起因して、何らかの不利益、負担または損害を受けたときには、ユーザーは、当社に対し、かかる不利益、負担または損害を賠償するものとします。 当社は、ユーザーの端末が第三者に使用されたことによってユーザーが被った損害について、一切の責任を負わないものとします。当社は、当該端末を用いてなされた本サービスの利用は当該端末を保有するユーザーによりなされたものとみなし、ユーザーは、かかる利用に起因して発生した一切の損害について、賠償責任を負うものとします。 当社は、第三者がユーザーになりすまして、本サービスを利用し、これに起因して発生した一切の損害について、賠償責任を負わないものとし、当該損害がユーザーの故意または過失に基づく場合、ユーザーは、賠償責任を負うものとします。 第6条（禁止事項） ユーザーは、本サービスを利用するにあたり、以下の各行為またはその恐れのある行為をしてはならないものとします。 （１） 犯罪行為若しくは犯罪行為に結びつく行為 （２） 当社または第三者の著作権、商標権その他の知的財産権、プライバシー権、名誉等の権利を侵害する行為 （３） 当社または第三者を差別または誹謗中傷する行為 （４） 本サービスを営利または商業目的で利用する行為（但し、当社が認める場合を除きます。） （５） 本サービスの提供のためのシステムへの不正アクセス等、本サービスの運営を妨げる行為 （６） 本コンテンツの全部または一部を、当社に無断で、複製、複写、転載、転送、蓄積、販売、出版、その他ユーザー個人の私的利用の範囲を超えて利用する行為 （７） 当社または第三者の信用を損なう行為 （８） 他人になりすまして、本サービスを利用する行為 （９） 法令、公序良俗若しくは本利用規約に違反する行為 （１０） 当社の承認した以外の方法により、本サービスを利用する行為 （１１） 当社または第三者に対する迷惑行為 （１２） その他当社が不適切と判断する行為 第7条（当社の免責等） 当社は、本サービスならびにこれらによって提供される情報について、正確性、最新性、完全性、有用性等いかなる事項についても保証いたしません。 当社は、ユーザーの端末が、本サービスの利用に適さない場合であっても、本サービスの変更、改変等、当該利用に適するように対応する義務を負わないものとします。 当社は、ユーザーの通信や活動に一切関与せず、ユーザーの通信や活動に起因して発生する損害について、賠償責任を負いません。万一、ユーザーと第三者間に紛争が発生した場合でも、当社は、当該紛争に対応する義務を負いません。 当社は、アクセス過多、その他予期せぬ要因に基づく本サービスの表示速度の低下や障害等に起因して発生したいかなる損害についても、賠償責任を負いません。 当社は、ユーザーが本利用規約に違反した場合、その他当社が本サービスの運営上不適当と判断する行為をユーザーが行った場合には、当該ユーザーに対して、何らの通知、催告または理由の開示なしに、本サービスの利用停止、損害賠償請求等、当該ユーザーの行為の防止に必要な措置（法的措置を含みます。）を採ることができるものとし、それに起因してユーザーに発生したいかなる損害についても、賠償責任を負いません。 第8条（本サービスの変更、停止または廃止） 当社は、以下の各号に掲げる場合、本サービスの全部または一部を、ユーザーへの予告なく停止することができ、これに起因してユーザーまたは第三者に損害が発生した場合、当社は、賠償責任を負わないものとします。 （１） 定期的または緊急に、本サービスの提供のためのシステムの保守または点検を行う場合（第三者提供サービスの仕様変更に伴う場合を含みます。） （２） 火災、停電、天災地変等の非常事態により、本サービスの提供が困難または不能となった場合 （３） 戦争、内乱、暴動、騒擾、労働争議等により、本サービスの提供が困難または不能となった場合 （４） 本サービスの提供のためのシステムの不良および第三者からの不正アクセス、コンピューターウイルスの感染等により本サービスの提供が困難または不能となった場合 （５） 法令等に基づく措置により、本サービスの提供が困難または不能となった場合 （６） 第三者提供サービスの停止または終了（保守、仕様の変更、瑕疵の修補による停止を含みますが、これらに限りません。）により、本サービスの提供が困難または不能となった場合 （７） その他当社が止むを得ないと判断した場合 当社は、本サービスの全部または一部を、ユーザーへの予告なく改訂、追加、変更または廃止することができ、これに起因してユーザーまたは第三者に損害が発生した場合であっても、当社は、賠償責任を負わないものとします。 第9条（反社会的勢力） ユーザーは、現在、暴力団、暴力団員、暴力団員でなくなった時から５年を経過しない者、暴力団準構成員、暴力団関係企業、総会屋等、社会運動等標ぼうゴロまたは特殊知能暴力集団等、その他これらに準ずる者（以下これらを「暴力団員等」といいます。）に該当しないこと、および次の各号のいずれにも該当しないことを表明し、かつ将来にわたっても該当しないことを確約するものとします。 （１） 暴力団員等が経営を支配または実質的に関与していると認められる団体その他これらに準ずる者と関係を有すること （２） 自己もしくは第三者の不正の利益を図る目的または第三者に損害を加える目的をもってするなど、不当に暴力団員等を利用していると認められる関係を有すること （３） 暴力団員等に対して資金等を提供し、または便宜を供与するなどの関与をしていると認められる関係を有すること ユーザーは、自らまたは第三者を利用して次の各号の一にでも該当する行為を行わないことを確約するものとします。 （１） 暴力的な要求行為 （２） 法的な責任を超えた不当な要求行為 （３） 取引に関して、脅迫的な言動をし、または暴力を用いる行為 （４） 風説を流布し、偽計を用いまたは威力を用いて相手方の信用を毀損し、または相手方の業務を妨害する行為 （５） その他前各号に準ずる行為 第10条（本利用規約の変更） 当社は、当社の判断により、本利用規約をいつでも任意の理由で変更することができるものとします。 変更後の本利用規約は、当社が別途定める場合を除いて、本サービスが提供される端末の画面上で表示された時点より効力を生じるものとします。 ユーザーは、変更後の本利用規約に同意できない場合、本サービスの利用を終了するものとし、変更後の本利用規約の効力が生じた後に、ユーザーが、本サービスを継続して利用した場合には、変更後の本利用規約の内容に同意したものとみなされます。 第11条（本利用規約およびその他の利用規約等の有効性） 本利用規約の一部の規定が法令に基づいて無効と判断されても、本利用規約のその他の規定は有効とします。 本利用規約の全部または一部の規定が、あるユーザーとの関係で無効とされ、または取り消された場合でも、本利用規約はその他のユーザーとの関係では有効とします。 第12条（権利義務の譲渡禁止） ユーザーは、本利用規約に別段の定めがある場合を除いて、当社の事前の書面による承諾なしに、本利用規約により生じた権利義務を、第三者に譲渡し、貸与し、または担保に供することはできないものとします。 当社は、本サービスにかかる事業を他社に譲渡した場合には、当該事業譲渡に伴い本利用契約上の地位、本利用規約に基づく権利義務並びにユーザーの情報を当該事業譲渡の譲受人に譲渡することができるものとし、ユーザーは、かかる譲渡につきあらかじめ同意したものとします。なお、本項に定める事業譲渡には、通常の事業譲渡のみならず、会社分割その他事業が移転するあらゆる場合を含むものとします。 第13条（準拠法および管轄裁判所） 本利用規約の準拠法は、日本法とします。 ユーザーと当社の間で訴訟の必要が生じた場合、東京地方裁判所を第一審の専属的合意管轄裁判所とします。 以上 附則 2014年6月27日 作成・施行 2014年11月28日 改訂 2020年10月7日 改訂最新記事2025年2月21日Interopと難解な問題2025年1月24日CORSガイドの決定版2024年12月12日進化した正規表現：JavaScriptの正規表現の歴史と未来2024年11月28日アルゴリズムのパフォーマンスを段階的に改善する2024年10月19日ReactコードをCSSの:hasセレクタで置き換えるPICK UP タグJavaScriptReactGoogleUIデザインソフトウェアアーキテクチャNodeJS生産性パフォーマンスデータサイエンスアジャイルまとめエンジニア採用タグ一覧を見るNIJIBOX Information"
