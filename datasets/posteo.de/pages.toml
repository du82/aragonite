full_description = "Redakteure Hannes A. Czerulla Hannes Czerulla ist News-Redakteur bei Posteo und schreibt unter anderem über die Themen Datenschutz, IT-Sicherheit und Verbraucherschutz. Vormals war er Redakteur und Tester bei IT-Medien wie Heise Online, c’t und Chip Online und Moderator des Podcasts c’t uplink. Außerhalb der Redaktion bastelt er an E-Mountainbikes und Drohnen und diskutiert darüber, wie sich die Berliner in Zukunft in ihrer Stadt fortbewegen. Kontakt zu Hannes Czerulla: newsroom@posteo.de Julius Stiebert Julius Stiebert ist Redakteur für den News-Bereich bei Posteo und beschäftigt sich mit Datenschutz, Netzpolitik und Sicherheitsthemen. Zuvor war er unter anderem Redakteur beim Online-Magazin Golem.de und hat mehrere Jahre im Ausland gearbeitet. Außerhalb der Redaktion beschäftigt er sich unter anderem mit Fotografie. Kontakt zu Julius Stiebert: newsroom@posteo.de"
