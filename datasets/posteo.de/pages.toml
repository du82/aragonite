full_description = "New security certificate Created at 17.February 2025, 20:00 | Category: Info Dear Posteo customers, We are updating our main security certificate. Security certificates are only valid for a specified time period and need to be renewed from time to time. In most cases, you will not notice any change. All current clients like Thunderbird or Outlook will automatically find the new certificate. You do not need to do anything. However, should your client display a certificate error during this changeover process, please restart your client. This should fix the error. If you manage the trustworthiness of certificates manually, you can find the fingerprint for the new main certificate below. You can also find complete fingerprints for all certificates in our legal notice. New fingerprint for the TLS security certificate for posteo.de: Geotrust: SHA256: 64:59:9B:20:CD:28:CE:58:6A:C4:3C:F5:E8:84:AD:9D:28:8A:29:CB:44:AF:D4:79:EB:C2:47:8B:D6:86:C6:05 SHA1: 72:7C:16:4D:38:1E:44:C2:BB:A7:56:98:E3:27:9B:B4:3E:CE:65:B9 Best regards, The Posteo Team"
