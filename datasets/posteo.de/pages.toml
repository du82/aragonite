["https://posteo.de/fr/site/chiffrement"]
title = "E-mail vert, sûr, simple et sans pub - posteo.de - Chiffrement"
description = "Posteo est un fournisseur de messagerie innovant misant sur la durabilité et la protection de la vie privée. Il fonctionne entièrement sans publicité. Nos boîtes mail, calendriers et carnets d'adresse peuvent être syncrhonisés: nous utilisons un concept de chiffrement global."
full_description = "Chiffrement Vous n'êtes pas exposés à l'espionnage généralisé sur Internet sans protection : un chiffrement plus complet est justement la meilleure des protections. Posteo dispose d'un concept de chiffrement global et innovant que nous vous présentons sur cette page. Nous vous proposons différents types de chiffrement à différents niveaux. Posteo utilise toujours les technologies les plus récentes et développe en permanence son concept de chiffrement. Nous faisons tout ce qui est en notre pouvoir en tant que fournisseur de messagerie afin de contribuer à la sécurité de vos communications. Cette dernière dépend aussi de facteurs sur lesquels nous n'avons aucune influence. Vous pouvez vous-mêmes agir afin de pouvoir communiquer de façon plus sûre. Nous vous expliquons comment faire sur cette page. Informez-vous : le concept de chiffrement de Posteo obtient les meilleures notes sur différents sites de test indépendants comme Qualys SSL Labs et Hardenize. Aperçu Les couches de chiffrement Posteo Survolez l'image avec votre souris ou cliquez sur une couche de chiffrement pour en savoir plus sur la structure du chiffrement chez Posteo. Pour en savoir plus sur notre concept de chiffrement, rendez-vous directement aux paragraphes : Chiffrement lors de l'acheminement Chiffrement à l'accès Mots de passe & numéros de téléphone portable Authentification à deux facteurs Chiffrement des serveurs et des disques durs Stockage mail crypté Posteo Chiffrement de bout en bout Chiffrement du calendrier et du carnet d'adresses Internet : connexions chiffrées avec les autres serveurs de messagerie (autant que possible) Acheminement d'e-mails : Posteo envoie chaque e-mail à destination d'autres fournisseurs de messagerie ou serveurs de messagerie via une route chiffrée, si tant est que l'autre serveur le permette. Pour cela, nous utilisons toujours les technologies les plus récentes. TLS (1.0-1.3) avec PFS DANE/TLSA Le chiffrement automatique lors de l'acheminement a lieu en arrière-plan, sans que vous ayez à intervenir. Il protège : le contenu de vos e-mails les métadonnées (comme l'objet, le destinataire, l'heure) Pour en savoir plus sur le chiffrement lors de l'acheminement de Posteo, lisez le paragraphe Chiffrement lors de l'acheminement. Remarque concernant la transparence : La qualité du chiffrement Posteo peut être testée et constatée sur le site de test indépendant Qualys (anglais). Accès chiffré à Posteo, obligatoire (site web, appareils et programmes) Chiffrement à l'accès : Chez Posteo, tout accès se déroule de façon chiffrée. messagerie en ligne clients de messagerie locaux appareils mobiles Nous ne permettons pas l'accès non chiffré. Nous utilisons toujours les technologies les plus récentes pour le chiffrement à l'accès. TLS (1.0-1.3) avec PFS Strict Transport Security (HSTS) DANE/TLSA De plus, nous utilisons ce qu'on appelle un certificat de sécurité élargi qui vous permet de reconnaître en un clin d'œil que vous êtes bien sur notre site internet. Pour en savoir plus sur le chiffrement à l'accès de Posteo et sur le certificat de sécurité, lisez le paragraphe Chiffrement à l'accès Connexions chiffrées au sein de Posteo Connexions internes : Nous chiffrons aussi toutes les connexions au sein même de Posteo. chiffrement avec entre autres SSH et TLS Ainsi, vous êtes assuré qu'il est impossible de vous espionner au sein même du système, dans le centre de calcul ou en chemin vers les serveurs de sauvegarde. Pour en savoir plus sur le chiffrement au sein-même de Posteo, lisez l'article Chiffrement du serveur. Protection de l'accès : mot de passe (hachage salé) Enregistrement des mots de passe : Posteo n'enregistre pas votre mot de passe en clair. Cependant, nous vérifions bien sa validité à chacune de vos connexions, ceci grâce à la fonction de hachage. les mots de passe ne sont pas enregistrés en clair enregistrement sous forme de hachage salé Nous ne connaissons pas votre mot de passe et ne pouvons par conséquent le communiquer à personne : ni à vous, ni à des tiers. Pour en savoir plus sur le chiffrement des mots de passe et des numéros de téléphone portable chez Posteo, lisez l'article Mots de passe et numéros de téléphone portable. Protection de l'accès n°2 (optionnelle) : mots de passe à usage unique Protection à deux facteurs : Chez Posteo, vous pouvez activer l'authentification à deux facteurs. Grâce à elle, vous pouvez renforcer encore davantage la sécurité de l'accès à votre boîte mail Posteo (dans le navigateur). La connexion se fait via : votre mot de passe personnel un mot de passe à usage unique (change toutes les 30 secondes) le protocole TOTP Le mot de passe à usage unique est généré sur vos appareils (ordinateur, tablette ou smartphone). Pour en savoir plus sur notre authentification à deux facteurs, rendez-vous dans notre rubrique Aide. Protection du compte : chiffrement des disques durs Chiffrement des serveurs : Les disques durs de tous les serveurs Posteo sont entièrement chiffrés. serveurs Linux : chiffrement dm-crypt/LUKS chiffrement des connexions internes (SSH et TLS) Nos disques durs chiffrés vous protègent : en cas de vol de matériel en cas d'accès physique par des personnes non autorisées en cas de décisions arbitraires (enquête des autorités) Pour en savoir plus sur le chiffrement des disques durs chez Posteo, lisez le paragraphe Chiffrement des serveurs. Chiffrement de tous les e-mails enregistrés (optionnel) :le stockage mail crypté de Posteo Stockage mail crypté de Posteo : Si vous activez votre stockage mail crypté Posteo, tous vos e-mails enregistrés sur nos serveurs seront alors chiffrés. chiffre toutes les données d'e-mail (contenus, pièces jointes, métadonnées) en un clic la clé est protégée par votre mot de passe chiffre tous les e-mails enregistrés ainsi que tous les e-mails entrants chiffrement asymétrique via RSA chiffrement symétrique et authentification avec AES et HMAC, hachage avec bcrypt chiffrement open source audit externe de sécurité (novembre 2014) via Cure53 Posteo ne peut pas désactiver le chiffrement de vos e-mails. Pour en savoir plus sur le stockage mail crypté de Posteo, lisez l'article Stockage mail crypté. Le chiffrement à l'entrée Posteo (optionnel) :chiffrement de tous les e-mails entrants (avec S/MIME ou OpenPGP) Chiffrement à l'entrée Posteo : Si vous utilisez S/MIME ou OpenPGP, vous pouvez activer le chiffrement à l'entrée Posteo dans les paramètres de votre boîte mail. Il permet de chiffrer tous les e-mails entrants avec S/MIME ou OpenPGP. chiffre tous les e-mails entrants avec S/MIME ou OpenPGP si l'expéditeur n'avait pas chiffré son e-mail à l'origine. protection supplémentaire pour vos e-mails enregistrés Pour en savoir plus sur le chiffrement à l'entrée, lisez l'article Chiffrement à l'entrée. Chiffrement de bout en bout de certains e-mails (par le client) Chiffrement de bout en bout : Vous pouvez chiffrer de bout en bout le contenu de certains e-mails, en plus de toutes les possibilités que nous vous offrons. Pour cela, deux standards sont disponibles : S/MIME et OpenPGP (PGP). les contenus de certains e-mails sont chiffrés les métadonnées des e-mails (par exemple l'objet, le destinataire, l'expéditeur, la date et l'heure) ne sont pas chiffrées l'expéditeur et l'intégrité de votre e-mail peuvent être vérifiés (signature) les deux parties doivent utiliser le chiffrement afin de pouvoir communiquer de façon chiffrée. Pour en savoir plus sur le chiffrement de bout en bout, lisez l'article Chiffrement de bout en bout Chiffrement du carnet d'adresses et du calendrier (optionnel) : chiffrement individuel de vos contacts et de vos rendez-vous Chiffrement du carnet d'adresses et du calendrier : Les clients Posteo ont la possibilité de chiffrer individuellement les données de leur calendrier et de leur carnet d'adresses en un clic (AES). chiffrement AES directement dans la banque de données la clé est protégée avec votre mot de passe le chiffrement du calendrier et du carnet d'adresses protège vos contacts et vos rendez-vous de potentielles tentatives d'accès par des tiers. Pour en savoir plus sur le chiffrement du carnet d'adresses et du calendrier, lisez l'article Chiffrement du carnet d'adresses et du calendrier. Remarque : toutes les fonctions de chiffrement de Posteo peuvent être combinées les unes avec les autres. Accès Le chiffrement à l'accès est repérable dans le navigateur grâce au https:// de notre adresse internet L'accès à nos serveurs s'effectue toujours via des connexions TLS. De plus, nous renforçons celles-ci grâce aux technologies « Perfect Forward Secrecy »(PFS) et DANE/TLSA. PFS empêche que des données de connexion enregistrées soient déchiffrées en masse par des tiers. DANE vérifie l'authenticité de notre serveur. Ainsi, vous pouvez être assuré, peu importe où vous vous connectez, que personne n'espionne votre trafic réseau avec Posteo, ne lit vos e-mails ou ne s'empare de vos données d'accès. Pourquoi chiffrons-nous l'accès ? Aujourd'hui, les utilisateurs se connectent à leurs e-mails par différents moyens, par exemple via des réseaux Wi-Fi ouverts ou dans des cafés internet. Si la connexion se déroule de façon non chiffrée, des tiers peuvent facilement subtiliser vos données d'accès. Ils ont alors non seulement accès à vos e-mails, mais aussi à vos données de connexion auprès d'autres services en ligne. Comme de nombreux utilisateurs utilisent des mots de passe et noms d'utilisateurs similaires pour différents services, il arrive souvent qu'une porte soit grande ouverte dès que l'accès à un seul compte e-mail a été forcé. Nous n'attendons pas que vous nous fassiez confiance aveuglément : vous pouvez tester et évaluer de façon transparente notre chiffrement (et celui des autres fournisseurs), par exemple sur la page indépendante de test de Qualys (anglais). Nous actualisons sans cesse notre chiffrement. C'est pour cela que nous obtenons la meilleure note A+ à ce test (date : 01/2024). Source : SSLlabs.com Tout accès à Posteo se déroule de façon chiffrée. Nous n'offrons pas la possibilité d'un accès non chiffré. messagerie en ligne clients de messagerie locaux appareils mobiles TLS (1.2-1.3) avec PFS Strict Transport Security (HSTS) DANE/TLSA Astuce de sécurité : Actualisez régulièrement votre navigateur et vos clients de messagerie. Nous utilisons toujours les technologies de chiffrement les plus avancées. Il arrive par conséquent que certaines versions anciennes de navigateurs ne soient pas compatibles. Par exemple, Internet Explorer 8 ne prend pas en charge la garantie de la connexion chiffrée avec PFS. Quand le service client pour Windows XP a pris fin, nous avons cessé de prendre en charge Internet Explorer 8. Certificat Certificat de sécurité élargi Pour que vous soyez toujours certain qu'une connexion chiffrée s'établit systématiquement avec le serveur Posteo, nous utilisons un certificat de sécurité élargi (et vert) grâce auquel vous pouvez reconnaître le partenaire de chiffrement en un coup d'œil (voir graphique). De tels certificats sont principalement utilisés par des entreprises qui traitent des données sensibles, notamment les banques. De plus, vous trouverez les empreintes digitales pour une vérification manuelle dans nos mentions légales. Pourquoi utilisons-nous un certificat élargi ? Les pages de phishing tentent d'accéder aux données d'utilisateurs en imitant les pages de banques ou de services en ligne. Quand vous vous connectez sur ces pages falsifiées, vos données sont alors dérobées. Grâce à ce certificat élargi, vous pouvez voir en un clin d'œil si vous vous trouvez effectivement sur notre page. Vous pouvez consulter le certificat en cliquant sur le symbole (qui diffère en fonction des navigateurs) placé avant notre adresse. Acheminement Acheminement chiffré des e-mails On dit souvent que les e-mails sont semblables à des cartes postales qui peuvent être lues au cours de leur acheminement. Ce n'est pourtant pas toujours le cas. Nos serveurs tentent toujours d'établir une connexion chiffrée (connexion TLS protégée par PFS) au cours de l'envoi et de la réception avec l'autre serveur. Si le serveur propose ce type de chiffrement, l'e-mail sera acheminé de façon chiffrée. Le chiffrement se déroule automatiquement en arrière-plan et ni vous, ni votre interlocuteur ne devez effectuer de manipulation. Si vous le souhaitez, vous pouvez en plus activer notre garantie de l'envoi par TLS : cela garantit que nous n'enverrons pas votre e-mail si un serveur ne peut pas établir une connexion chiffrée. Nous vous informerons de l’interruption de l’envoi par e-mail. Si l'acheminement est chiffré via TLS, personne ne peut lire l'e-mail (non chiffré). La technologie PFS empêche vos e-mails d'être déchiffrés en masse, après coup, par des personnes non autorisées. De plus, depuis mai 2014, Posteo prend en charge le technologie innovante DANE/TLSA, qui corrige les failles courantes du chiffrement au cours de l'acheminement. DANE renforce la sécurité de l'acheminement d'e-mails et de l'accès aux sites internet. De nombreux fournisseurs de messagerie se sont améliorés suite au scandale de la NSA et prennent dorénavant en charge le chiffrement au cours de l'acheminement, bien qu'il subsiste de grandes différences de qualité dans la mise en place de ce chiffrement. Nous espérons que ces fournisseurs continueront à améliorer ce type de chiffrement. En effet, la qualité du chiffrement établi entre des serveurs s'aligne toujours sur celle du serveur de la partie la plus « faible ». Nous espérons en particulier que la technologie DANE que nous utilisons sera bientôt plus utilisée. Nous sommes en effet persuadés que DANE peut contribuer de façon cruciale à rendre la communication sur Internet plus sûre. Vous pouvez vous référer à notre liste de fournisseurs (à droite) que nous actualisons régulièrement. Le chiffrement au cours de l'acheminement protège toutes les données des tentatives d'intrusion de lecteurs non autorisés lors de l'envoi d'un e-mail. Cela concerne aussi bien les contenus de l'e-mail que les métadonnées. Si des utilisateurs de Posteo s'écrivent l'un à l'autre, la communication ne quitte à aucun moment nos serveurs chiffrés. Chiffrement lors de l'acheminement : TLS (1.0-1.3) avec PFS DANE/TLSA protège les e-mails et les métadonnées se déroule automatiquement TLS : aperçu des fournisseurs de messagerie Acheminement chiffré de Posteo à : TLSDANE Arcorouinon AOLouinon Bund.deouioui Comcast/Xfinityouioui Freenetouioui Gmailouinon GMXouioui Microsoft 365ouinon* O2ouinon Outlook.comouinon Riseupouioui T-Onlineouinon Vodafoneouinon web.deouioui Yahooouinon *Pour l’envoi d’emails de Microsoft 365 à Posteo, DANE est déjà pris en charge. Une prise en charge de DANE pour la réception d’e-mails est prévue à partir de mars 2024 d’après Microsoft. Dernière actualisation : 6/2023 Recommandations de lecture (allemand) heise.de : Posteo teste le Certificate Pinning heise.de : Posteo est le premier fournisseur de messagerie à utiliser DANE Test du chiffrement"
