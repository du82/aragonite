["https://posteo.de/fr/site/lab"]
title = "E-mail vert, sûr, simple et sans pub - posteo.de - Posteo à Berlin"
description = "Jeudi 03/04, un évènement aura lieu au Lab Posteo à Berlin Kreuzberg à l'occasion du Girls’Day 2025. Nous donnons la possibilité à 10 écolières de faire une excursion dans le monde du code et d'échanger avec des informaticiennes. Les élèves apprendront également à mieux connaître le monde de l'e-mail : nous vous montrons comment cela fonctionne lorsque tant d'ordinateurs communiquent entre eux dans le monde entier et échangent des informations via des protocoles. Ces jeunes filles pourrons essayer par elles-mêmes, en chattant avec un serveur d’e-mails. Peuvent s'inscrire les écolières de 12 ans ou plus qui pensent vouloir devenir développeuses de logiciel. Aucune connaissance particulière n'est demandée pour pouvoir participer. L'évènement comment à 9h30. Plus d'informations (page en allemand) >>"
full_description = "Posteo Lab Le Lab Posteo est un lieu de rencontres et d'évènements situé sur la colline de Kreuzberg. Nous avons équipé le Lab de manière équitable. Nous ouvrons régulièrement le Lab pour des conférences, des réunions d'information, des formations et des évènements culturels. Vous trouverez des informations sur les évènements actuels dans notre calendrier d'évènements. Évènements Nous ouvrons régulièrement le Lab pour des conférences, des réunions d'information et des formations. Des évènements culturels y ont également lieu. Nous mettons volontiers le Lab gratuitement à disposition de personnes extérieures, sur demande. Les évènements doivent correspondre à Posteo et nos thèmes de prédilection. Veuillez adresser les propositions d'évènement à : veranstaltungen@posteo.de Évènements actuels 03.04., 2025 9h30 Girls'Day 2025 : « Comment des développeuses amènent dans le monde entier des serveurs à échanger des e-mails » Entrée : libre (réservation obligatoire) Organisateur : Posteo Jeudi 03/04, un évènement aura lieu au Lab Posteo à Berlin Kreuzberg à l'occasion du Girls’Day 2025. Nous donnons la possibilité à 10 écolières de faire une excursion dans le monde du code et d'échanger avec des informaticiennes. Les élèves apprendront également à mieux connaître le monde de l'e-mail : nous vous montrons comment cela fonctionne lorsque tant d'ordinateurs communiquent entre eux dans le monde entier et échangent des informations via des protocoles. Ces jeunes filles pourrons essayer par elles-mêmes, en chattant avec un serveur d’e-mails. Peuvent s'inscrire les écolières de 12 ans ou plus qui pensent vouloir devenir développeuses de logiciel. Aucune connaissance particulière n'est demandée pour pouvoir participer. L'évènement comment à 9h30. Plus d'informations (page en allemand) >> Accès Voilà où nous trouver : Posteo Lab Methfesselstraße 36 10965 Berlin-Kreuzberg (locaux de l'ancienne brasserie Schultheiss) Trajet avec la BVG : U6/Platz der Luftbrücke Openstreetmap: https://www.openstreetmap.org/node/4441281573"
