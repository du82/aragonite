["https://posteo.de/site/faq"]
title = "E-Mail grün, sicher, einfach und werbefrei - posteo.de - Häufige Fragen"
description = "Posteo ist ein innvovativer E-Mail-Anbieter, der auf Nachhaltigkeit und Datenschutz setzt und komplett Werbefrei ist. Unsere E-Mail-Postfächer, Kalender und Adressbücher sind synchronisierbar - wir setzen auf umfassende Verschlüsselung."
full_description = 'Kann ich Posteo mit eigenen Domains verwenden? Nein. Wir sind ein E-Mail-Anbieter mit einem besonders datenschutzorientierten Konzept. Mit dem Einbinden eigener Domains ist das nicht vereinbar. Wir erheben aus Datenschutz- und Sicherheitsgründen grundsätzlich keine Bestandsdaten (Namen, Adressen etc.) unserer Kundinnen und Kunden. Eigene Domains müssen aber mit Namen und Anschrift auf eine Person registriert werden. Könnten Sie eigene Domains bei uns nutzen, müssten wir entgegen unserer Datenschutz- und Sicherheitsbedenken Bestandsdaten zu Ihrem Postfach speichern. Diese müssten wir auch der Bundesnetzagentur zur automatisierten Abfrage durch Behörden zur Verfügung stellen. Auch dann, wenn nur der MX-Record auf uns verweisen würde. Deshalb haben wir uns dafür entschieden, diese Möglichkeit nicht anzubieten und stattdessen konsequent auf "Privacy by design" zu setzen. Wir raten auch unabhängig von Posteo vom Verwenden eigener Domains ab: Denn die Inhaber müssen sich selbst um bestimmte Aspekte der Kommunikationssicherheit kümmern. Zum Beispiel um das Unterstützen moderner Sicherheitstechnologien wie DNSSEC, DANE und SPF. Damit sind nicht nur normale Anwender, sondern auch Technikinteressierte in aller Regel überfordert. Benötige ich eine Auftragsverarbeitungsvereinbarung mit Posteo? Nein. Als öffentlich zugänglicher E-Mailanbieter, der sich an Einzelpersonen richtet, sind wir kein Auftragsverarbeiter im Sinne der Datenschutzgrundverordnung (DSGVO). Das haben wir anwaltlich prüfen lassen. Das bedeutet: Auch bei einer beruflichen Nutzung von Posteo muss keine Auftragsverarbeitungsvereinbarung abgeschlossen werden. Einer der Gründe dafür: Telekommunikations(TK)-Dienste wie Posteo unterliegen nicht nur den allgemeinen Datenschutzgesetzen, sondern auch weiteren gesetzlichen Verpflichtungen und damit einhergehenden strengen Sicherheitsvorschriften, die unter anderem im Telekommunikationsgesetz (TKG) und dem Telekommunikation-Telemedien-Datenschutz-Gesetz (TTDSG) geregelt sind. So müssen wir über ein Sicherheitskonzept verfügen, das von der Bundesnetzagentur kontrolliert wird. Dazu steht in der DSGVO in Art 95: "Diese Verordnung erlegt natürlichen oder juristischen Personen in Bezug auf die Verarbeitung in Verbindung mit der Bereitstellung öffentlich zugänglicher elektronischer Kommunikationsdienste in öffentlichen Kommunikationsnetzen in der Union keine zusätzlichen Pflichten auf, soweit sie besonderen in der Richtlinie 2002/58/EG festgelegten Pflichten unterliegen, die dasselbe Ziel verfolgen." Posteo unterliegt den in der E-Privacy-Richtlinie (2002/58/EG) festgelegten Pflichten (diese entsprechen auch den Vorgaben der §§ 3-18 TTDSG). Sie benötigen keine Auftragsverarbeitungsvereinbarung mit uns, um den Vorgaben der DSGVO zu entsprechen - und wir bieten solche auch nicht an. Weitere Informationen und unabhängige Lesetipps finden Sie in unserer Datenschutzerklärung. Ist Posteo von der Wiedereinführung der Vorratsdatenspeicherung betroffen? Nein, Posteo ist nicht von der Vorratsdatenspeicherung betroffen. Das Gesetz zur Wiedereinführung der Vorratsdatenspeicherung ("Gesetz zur Einführung einer Speicherpflicht und einer Höchstspeicherfrist für Verkehrsdaten") nimmt E-Mailanbieter vollständig von der Regelung aus. Der gesamte E-Mail-Bereich ist daher von der Speicherung ausgenommen. Das bedeutet: Posteo gehört nicht zum Kreis der Verpflichteten. Bei Posteo werden deshalb auch weiterhin keine Daten auf Vorrat gespeichert. Kann ich E-Mails von meinem bisherigen Anbieter zu Posteo umziehen? Ja, das ist möglich. Für den Umzug Ihrer Daten steht Ihnen der Posteo-Umzugsservice zur Verfügung: Mit dem Posteo-Umzugsservice können Sie bis zu drei externe E-Mailpostfächer inkl. Ordnerstrukturen sicher zu Posteo umziehen. Sie entscheiden, ob Sie den gesamten Inhalt Ihres bisherigen E-Mail-Postfachs oder ausgewählte Ordner kopieren. Ob Sie die E-Mails bei Ihrem bisherigen Anbieter nach dem Umzug endgültig löschen möchten, entscheiden Sie ebenfalls selbst. Der Posteo-Umzugsservice ist für Sie kostenfrei – und Sie behalten die Kontrolle über Ihre Daten: Ihre E-Mails werden zu keinem Zeitpunkt über Drittdienstleister geleitet. Die ausgewählten Ordner werden durch Posteo bei Ihrem bisherigen Anbieter abgerufen und über verschlüsselte Verbindungen direkt in Ihr Posteo-Postfach übertragen. Nach dem Umzug haben Sie die Möglichkeit, einen "Nachsendeauftrag" einzurichten: Unser E-Mail-Sammeldienst holt alle 10 Minuten neu eingehende E-Mails aus Ihren bisherigen Postfächern ab. Bietet Posteo auch Webspace an? Nein, wir bieten keinen Webspace an und können leider auch keinen datenschutzorientierten bzw. nachhaltigen Anbieter empfehlen. Gibt es einen Testzugang? Nein. Aber Sie haben jederzeit die Möglichkeit, den Vertrag zu kündigen. Wenn Sie innerhalb des ersten Monats nach der Eröffnung ein Postfach kündigen, wird das bereits eingezahlte Guthaben vollständig erstattet. Bietet Posteo auch einen Datenspeicher an? Nein, wir bieten keinen Datenspeicher an. Bietet Posteo auch andere Posteo-Domains als posteo.de an? Ja. Postfächer können auch mit anderen E-Mail-Domains wie z.B. @posteo.com registriert werden. Darüber hinaus bieten wir die Domains @posteo.net, @posteo.us, @posteo.ca, @posteo.uk, @posteo.ie, @posteo.es, @posteo.at, @posteo.ch, @posteo.nl, @posteo.be und @posteo.lu für Ihre Posteo E-Mail-Adresse an. Falls Sie nachträglich die Domain Ihrer Posteo E-Mail-Adresse ändern möchten, können Sie dies in den Einstellungen im Menüpunkt "E-Mail-Aliase" unter “Posteo E-Mail Adresse” tun. Weitere Informationen dazu finden Sie in unserer Hilfe. Bei Ihren Alias-Adressen (2 zusätzliche E-Mail-Adressen sind bei jedem Postfach inklusive) können Sie aus vielen weiteren Posteo-Domains wählen. Eine Übersicht aller verfügbaren Posteo-Domains finden Sie in unserer Hilfe. Sollten Sie eine Länderkennung vermissen, können Sie sich unter support@posteo.de an uns wenden. Was mache ich, wenn ich mehr Speicherplatz benötige? Sie können Ihren Speicherplatz jederzeit in den Einstellungen Ihres Postfachs flexibel anpassen. Jedes zusätzliche Gigabyte kostet einen Aufpreis von 0,25 EUR pro Monat. Benötigen Sie den zusätzlichen Speicherplatz nicht mehr, lässt er sich jederzeit in den Einstellungen wieder reduzieren. Was passiert, wenn ich mein Guthaben nicht rechtzeitig wieder auflade? Geht Ihr Guthaben zur Neige, sendet unser System Ihnen in regelmäßigen Abständen Erinnerungsmails. Ca. 10 Wochen, nachdem das Guthaben eines Postfachs aufgebraucht wurde, sperrt unser System die Sendefunktion des Postfachs. Sobald das Guthaben wieder aufgeladen ist, ist auch die Sendefunktion wieder entsperrt. Wir löschen Daten grundsätzlich nicht, wenn ein Postfach (durch den Kunden oder durch Posteo) nicht ordentlich gekündigt wurde. Woher bekomme ich ein S/MIME-Zertifikat für meine Posteo-E-Mail-Adresse? S/MIME-Zertifikate werden von verschiedenen Anbietern verkauft. Auch Posteo bietet Zertifikate an, die von einer offiziellen Zertifizierungsstelle (Certum) signiert sind und in E-Mailprogrammen als vertrauenswürdig angezeigt werden. In den Posteo-Einstellungen können die Zertifikate komfortabel erstellt werden. Sie finden diese Option in dem Bereich „Meine S/MIME-Zertifikate“. Sie haben eine Laufzeit von einem Jahr und kosten 365 Cent. Kann ich mit Posteo passwortgeschützte bzw. mit einem Passwort verschlüsselte Nachrichten per E-Mail verschicken? Wir werden häufig gefragt, ob es bei Posteo möglich ist, passwortgeschützte E-Mails zu versenden, wie bei manchen proprietären Anbietern. Die Antwort lautet "Ja, natürlich". Was viele nicht wissen: Eine solche Funktion ist kein Alleinstellungsmerkmal solcher Anbieter, sondern anbieterunabhängig möglich. Sie können eine Nachricht mit einem Passwort verschlüsseln und mit jedem beliebigen Anbieter an eine Person schicken, die noch keine Ende-zu-Ende-Verschlüsselung mit S/MIME oder PGP einsetzt. Hierfür erstellen Sie z.B. eine passwortgeschützte PDF-Datei und verschicken diese als E-Mail-Anhang. Wie das funktioniert, erfahren Sie in diesem Hilfeartikel. Für einen optimalen Schutz Ihrer E-Mails empfehlen wir echte Ende-zu-Ende-Verschlüsselung mit S/MIME (oder auch PGP) - welche einfach einzurichten ist und unabhängig vom E-Mail-Anbieter funktioniert: https://posteo.de/hilfe/categories/ende-zu-ende. Es gibt nur vermeintlich passwortgeschützte E-Mails. Die meisten proprietären Lösungen basieren schlichtweg auf dem Verschicken eines Links per E-Mail, bei dem nach einem Klick auf einer Webseite des Anbieters ein vereinbartes Passwort eingegeben werden muss, um eine Nachricht (keine E-Mail) im Browser sichtbar zu machen. Solche Verfahren fördern aus unserer Sicht zum einen Phishing, da auf einen Link geklickt und im Anschluss ein Passwort eingegeben werden soll. Außerdem kann der Anbieter des Senders den Empfänger beim Abrufen der Nachricht tracken - anders als sonst bei E-Mail. Beim Versand eines passwortgeschützten PDFs gibt es diese Nachteile nicht. Bietet Posteo auch einen Fax- oder SMS-Service? Nein. Fax- oder SMS-Funktionen können wir nicht anbieten. Für uns als Telekommunikationsanbieter würden sich andere rechtliche Verpflichtungen ergeben, wenn wir dies tun würden: Wir müssten beginnen, Bestandsdaten unserer Kunden zu speichern - und das möchten wir aus Datenschutzgründen nicht. Deshalb werden wir diese Funktionen ganz sicher auch in Zukunft nicht anbieten. Wir konzentrieren uns darauf, unseren Kunden eine möglichst sichere und nachhaltige E-Mail-Kommunikation zu ermöglichen, die maximalen Ansprüchen an Datenschutz genügt und dem Grundsatz der Datensparsamkeit folgt. Seit wann gibt es Posteo? Posteo gibt es seit 2009. Gibt es eine Konversationsansicht, wie bei gmail? Ja, bei uns gibt es auch eine Konversationsansicht im Webmailer. Sie können zwischen Konversations- oder Listenansicht wählen. In unserer Hilfe erhalten Sie hierzu mehr Informationen. Können wir für unsere Initiative/unseren Verein ein kostenloses Postfach haben? Wir erhalten viele Anfragen von Projekten, Vereinen oder Initiativen, die nach kostenlosen Postfächern fragen. Kostenlose Mailpostfächer können wir aber nicht anbieten. Viele gemeinnützige Vereine, Initiativen und Projekte haben Postfächer und Mailinglisten bei uns - und alle zahlen für unsere Dienstleistungen. Wir glauben, es ist wichtig, dass für gute, nachhaltige Produkte bezahlt wird (“If something is valuable, let’s pay for it”) um qualitativ hochwertige Inhalte im Netz von der Werbeabhängigkeit zu lösen. Unser nachhaltiges Angebot ist zwar bedarfsgerecht, aber recht knapp kalkuliert. Spielräume für Rabatte und Werbeaktionen haben wir deshalb nicht. Wir erbringen E-Mail-Dienstleistungen mit einem hohen Anspruch an Nachhaltigkeit, Sicherheit und Datenschutz und sind komplett werbefrei. Die Kosten für einen solchen Dienst sind enorm und da wir keinerlei Werbung schalten möchten, ist der Betrieb unseres Dienstes nur über Nutzerbeiträge möglich. Auch kostenfreie Postfächer benötigen Speicherplatz, Administration und Support. Wir bitten um Verständnis. Warum ist Posteo nicht kostenlos - Posteo könnte doch Öko-Werbung schalten? Wir wollen unabhängig arbeiten und ein gutes Produkt anbieten, das ohne den Einsatz von Tracking auskommt. Der Schutz Ihrer E-Mail-Daten soll nicht von den Interessen der Werbewirtschaft beeinträchtigt werden. Eine vom Wohlwollen der Werbekunden abhängige, kostenlose Dienstleistung anzubieten, hat für uns nichts mit nachhaltigem Wirtschaften zu tun. Die werbefinanzierte Kostenlos-Kultur im Internet halten wir grundsätzlich für überdenkenswert, auch aus Gründen des Datenschutzes und der informationellen Selbstbestimmung. Wir glauben, es ist wichtig, dass für gute, nachhaltige Produkte bezahlt wird (“If something is valuable, let’s pay for it”) um qualitativ hochwertige Inhalte im Netz von der Werbeabhängigkeit zu lösen. Bietet Posteo auch telefonischen Support an? Wir haben uns dafür entschieden, unseren Kunden einen kostenfreien Support per E-Mail anzubieten, der sie bei Fragen und Problemen zeitnah unterstützt. Telefonischen Support bieten wir nicht an. Kann ich bei Posteo per Lastschrift bezahlen? Nein. Denn bei der Bezahlung per Lastschrift müssten wir Ihre Kontodaten (IBAN, Name) in Verbindung mit dem zugehörigen Postfach speichern. Solche Datensätze sind bei Kriminellen begehrt. Bei Posteo anonymisieren wir deshalb sämtliche Bezahlvorgänge: Wir verknüpfen Daten, die wir bei Zahlungen erhalten, grundsätzlich nicht mit den E-Mail-Postfächern. Damit beugen wir wirksam Datendiebstählen vor, schützen Sie vor Missbrauch - und können Ihnen stets eine Nutzung unseres E-Maildienstes ohne das Erheben sensibler personenbezogener Daten gewährleisten. Sie können bequem per Überweisung, in bar, per Paypal oder mit Kreditkarte bezahlen. Maximal können Sie 60 EUR Guthaben aufladen. Bei einer Kündigung erhalten Sie verbliebenes Restguthaben vollständig zurück. Mehr über die Bezahlarten bei Posteo erfahren Sie auf unserer Infoseite Bezahlung. Wie kann Posteo anonym sein, wenn ich per Überweisung oder Paypal zahle? Das Guthaben Ihres Posteo-Postfachs wird stets anonym aufgeladen - egal ob Sie per Überweisung, per Paypal, per Kreditkarte oder in bar zahlen. Wir verknüpfen Daten, die wir bei Zahlungen erhalten, grundsätzlich nicht mit den E-Mail-Postfächern. Hierfür haben wir 2009 ein eigenes System entwickelt, mit dem wir alle Zahlungsvorgänge anonymisieren. Das Bezahlsystem ist das Herzstück unseres Datensparsamkeitskonzeptes: Vor allem, weil wir Bezahldaten und E-Mail-Postfächer unserer Kunden streng voneinander trennen, führen wir keine Bestandsdaten zu den Postfächern - und können so eine grundsätzlich anonyme Nutzung unseres E-Maildienstes gewährleisten. Wie die Anonymisierung der Bezahlvorgänge bei Posteo konkret erfolgt, erfahren Sie auf unserer Infoseite Bezahlung. Kann ich bei Posteo Absender von der Spamfilterung ausnehmen oder aktiv sperren? Ja. Sie können sich im Webmailer Filter erstellen, die unerwünschte Post wahlweise löschen oder in Ordner Ihrer Wahl sortieren. Es ist auch möglich, eine Ausnahmeliste zu pflegen. Dies ist jedoch in der Regel nicht notwendig, da unser Spamfilter sehr zuverlässig zwischen Spam und gewollten Nachrichten unterscheiden kann. Bekomme ich eine Nachricht, wenn mein Guthaben aufgebraucht ist? Ja. Unser System versendet automatisiert und regelmäßig Erinnerungsmails, wenn das Guthaben Ihres Postfachs zur Neige geht oder aufgebraucht ist. Wer garantiert mir, dass es Posteo in zehn Jahren noch gibt? Sie müssen nicht befürchten, dass es Posteo bald nicht mehr geben wird. Posteo ist kein Startup-Unternehmen und wir wirtschaften nachhaltig. Posteo ist komplett eigenfinanziert, schuldenfrei und finanziert sich ausschließlich über die Monatsbeiträge seiner Kunden. Wir sind deshalb unabhängig von Werbetreibenden und Investoren. Posteo existiert seit 2009 und ist eine eigenständige Firma. Wir haben Posteo gegründet, um einen Impuls für mehr Nachhaltigkeit und Datenschutz im Internet zu g'
