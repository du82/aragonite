["https://posteo.de/site/andere_ueber_uns"]
title = "E-Mail grün, sicher, einfach und werbefrei - posteo.de - Andere über Posteo"
description = "Posteo ist ein innvovativer E-Mail-Anbieter, der auf Nachhaltigkeit und Datenschutz setzt und komplett Werbefrei ist. Unsere E-Mail-Postfächer, Kalender und Adressbücher sind synchronisierbar - wir setzen auf umfassende Verschlüsselung."
full_description = "E-Mails signieren und verschlüsseln – so geht’s, das bringt’s 25.Januar 2025 | Kategorie: Online Artikel auf macwelt.de, von Thomas Armbrüster Haben Sie ein E-Mail-Konto bei Posteo, ist die Installation eines Zertifikats, das ebenfalls von Certum stammt, wesentlich einfacher. Sie melden Sich bei Ihrem Posteo-Konto an, klicken auf „Einstellungen“ und dann in der Seitenleiste auf „Meine S/MIME-Zertifikate“. Danach wählen Sie die E-Mail-Adresse aus, für die das Zertifikat erstellt werden soll. Nun müssen Sie noch anklicken, dass die Bestellung nicht storniert werden kann, und bestellen das Zertifikat, das Sie 3,65 € im Jahr kostet. zum Artikel Extra Urlaubstage: Deutsche Unternehmen „verpassen wichtige Chance“ – Deutsche Bahn reagiert 20.September 2024 | Kategorie: Online Artikel auf FR.de, von Jana Stäbener Über die Hälfte aller Deutschen will gerne klimafreundlicher reisen. Das Problem: Die meisten tun es nicht. Laut aktuellen Zahlen des Umweltbundesministeriums reisen nur zehn bis 30 Prozent wirklich nachhaltig, je nachdem, wie streng man Nachhaltigkeit definiert. Urlaube mit Bus und Bahn werden seltener, Flugreisen nehmen zu – besonders für längere Distanzen. Ein Grund dafür: Fliegen kostet weniger Zeit als das umweltfreundlichere Bahnfahren. Unternehmen wie der E-Mail-Anbieter Posteo […] schenken ihren Mitarbeitenden aus diesem Grund zwei bis drei Urlaubstage mehr – vorausgesetzt, sie verzichten auf Flugreisen. zum Artikel E-Mail: Posteo stellt Löschhinweis vor 17.März 2023 | Kategorie: Online Artikel auf linuxnews.de, von Ferdinand Thommes Wenn Kunden versehentlich E-Mail gelöscht haben und dies innerhalb dieses Zeitraums bemerken, stellt Posteo die Mails kostenfrei wieder her. Da es aber immer wieder vorkam, dass Kunden den Verlust erst nach Ablauf der 7-Tagesfrist bemerkten und Posteo somit nicht mehr helfen konnte, führte der Anbieter jetzt einen Löschhinweis ein. Werden aus einem Konto innerhalb von 24 Stunden mehr als 50 Mails gelöscht, erhält der Kunde eine Mail mit dem Hinweis auf den Löschvorgang. War das Löschen nicht gewollt, kann der Vorgang so innerhalb der Frist rückgängig gemacht werden. zum Artikel"
