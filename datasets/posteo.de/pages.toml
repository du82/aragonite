full_description = 'Widerrufsbelehrung Widerrufsrecht Sie können Ihre Vertragserklärung innerhalb von 14 Tagen ohne Angabe von Gründen widerrufen. Der Widerruf erfolgt über das Kündigungsformular, dass Sie in Ihrem Posteo-Postfach im Bereich "Einstellungen"->"Kündigung" finden. Die Frist von 14 Tagen beginnt nach Erhalt dieser Belehrung in Textform, jedoch nicht vor Vertragsschluss und auch nicht vor Erfüllung unserer Informationspflichten gemäß Artikel 246 § 2 in Verbindung mit § 1 Absatz 1 und 2 EGBGB sowie unserer Pflichten gemäß § 312g Absatz 1 Satz 1 BGB in Verbindung mit Artikel 246 § 3 EGBGB. Zur Wahrung der Widerrufsfrist genügt die rechtzeitige Absendung des Widerrufs. Widerrufsfolgen Im Falle eines wirksamen Widerrufs sind die beiderseits empfangenen Leistungen zurückzugewähren. Ihr Posteo-Postfach wird 14 Tage nach Eingang des wirksamen Widerrufs restlos gelöscht und Ihre ggf. bereits bezahlten Beträge werden Ihnen vollständig zurückerstattet. Die Rückerstattung erfolgt ebenfalls innerhalb von 14 Tagen. Die Frist beginnt für Sie mit der Absendung Ihrer Widerrufserklärung, für uns mit deren Empfang. Ende der Widerrufsbelehrung Hinweis Wir weisen darauf hin, dass die Bestellung von E-Mail-Postfächern bei Posteo so gestaltet ist, dass Ihr Widerrufsrecht nicht entfällt, auch wenn Sie das bestellte Postfach nutzen. Sie können also Posteo umfassend testen. Wenn Sie Posteo nicht weiter nutzen wollen, nutzen Sie bitte einfach innerhalb der Widerrufsfrist unser Kündigungsformular ("Einstellungen"->"Kündigung"), und Sie bekommen alle ggf. bereits bezahlten Beträge voll erstattet. Bitte beachten Sie, dass wir aus Datenschutz-Gründen ein Zahlungssystem verwenden, das keine Verbindung zwischen Postfach und Zahlung ermöglicht. Nach Löschung des Postfachs haben wir keine Möglichkeit mehr, die Berechtigung eines Wunsches nach Auszahlung eines eventuellen Restguthabens zu prüfen. Bitte teilen Sie uns daher über das Kündigunsformular im dafür vorgesehenen Bereich zusammen mit Ihrer Widerrufserklärung mit, wie wir ein eventuelles Guthaben erstatten sollen. Alternativ können Sie Ihr Guthaben auch spenden oder einen Posteo-Gutschein erhalten, den Sie z.B. verschenken können.'
year_published = 2025
