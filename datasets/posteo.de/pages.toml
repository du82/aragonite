title = "E-Mail grün, sicher, einfach und werbefrei - posteo.de - AGB"
description = "Posteo ist ein innvovativer E-Mail-Anbieter, der auf Nachhaltigkeit und Datenschutz setzt und komplett Werbefrei ist. Unsere E-Mail-Postfächer, Kalender und Adressbücher sind synchronisierbar - wir setzen auf umfassende Verschlüsselung."
full_description = "Allgemeine Geschäftsbedingungen 1. Geltungsbereich und Änderungen dieser Nutzungsbedingungen 1.1. Die vorliegenden Nutzungsbedingungen regeln das zwischen dem Kunden und Posteo e.K., Methfesselstr. 38, 10965 Berlin (nachfolgend “Posteo” genannt) begründete Nutzungsverhältnis des E-Mail-Services Posteo. 1.2. Posteo behält sich vor, diese Nutzungsbedingungen sowie die Leistungsbeschreibung und Preise zu ändern. Änderungen teilt Posteo dem Kunden mit. Erfolgen Änderungen zu Ungunsten des Kunden, kann er das Nutzungsverhältnis fristlos kündigen. Auf dieses Kündigungsrecht weist Posteo den Kunden in der Änderungsmitteilung hin. 2. Nutzungsverhältnis 2.1. Der Vertrag über die Nutzung von Posteo kommt durch einen Auftrag des Kunden in Form der Online-Registrierung zustande. 3. Leistungen 3.1. Nach der Registrierung steht dem Kunden der Zugang zu seinem Postfach zur Verfügung. Bis zur Bezahlung des ersten Entgelts können durch den Kunden maximal 10 E-Mails innerhalb von zwei Stunden versendet werden. Nach der Einrichtung des Postfachs stehen dem Kunden die nachfolgenden Leistungen zur Verfügung: Eine eigene E-Mail Adresse nach dem Format “Wunschname@posteo.de” Zwei weitere durch den Kunden konfgurierbare E-Mail Aliasnamen Ein E-Mail Postfach mit 2GB Speicherkapazität Senden und Empfangen von E-Mails es werden E-Mail Anhänge bis 50MB unterstützt Spamfilter, spamverdächtige E-Mails werden von unserem System nicht angenommen (reject). Der Kunde hat die Möglichkeit, eine Liste zu pflegen, um Mails von bestimmten Absendern immer zugestellt zu bekommen. Virenfilter, eingehende E-Mails, die einen Virus enthalten, werden gelöscht und dem Kunden nicht zugestellt Webmailer mit synchronisierbarem Adressbuch und Kalender E-Mail Weiterleitungen automatische E-Mail Beantwortungsmöglichkeit (z.B. für Abwesenheitsnachrichten) POP-Sammeldienst, um E-Mails von andere E-Mailanbietern bei Posteo zu sammeln Betrieb der Server mit 100% Ökostrom von Greenpeace Energy Wenn der Speicherplatz voll belegt ist, können keine weiteren Nachrichten mehr empfangen werden. Auf den Internetseiten von Posteo kann der Kunde die Belegung des Speicherplatzes kontrollieren. Es ist dem Kunden möglich, den Speicherplatz zu erweitern. Jedes zusätzliche Gigabyte Speicher kostet einen Aufpreis von 0,25 EUR pro Monat. Über die zwei kostenfreien Aliase hinaus lassen sich bis zu 20 Mailaliase für je 0,10 EUR pro Monat und Alias einrichten. 3.2 Posteo steht in der Regel 24 Stunden täglich zur Verfügung. Posteo kann jedoch keine Gewähr für die ununterbrochene Erreichbarkeit und Verfügbarkeit sämtlicher Leistung übernehmen. Ausfälle durch eventuelle Wartungsarbeiten werden vorher angekündigt. 4. Nutzungsentgelte und Zahlungsmöglichkeiten 4.1 Voraussetzung für die Nutzung von Posteo ist die Entrichtung des zu zahlenden monatlichen Entgelts nach der Registrierung. Die Zahlung erfolgt bei Überweisung und Paypal jeweils für 12 Monate im Voraus. Bei Barzahlung per Brief akzeptieren wir nur Scheine, deshalb müssen dort 15 Monate im Voraus bezahlt werden. Bei vorzeitiger Kündigung des Vertragsverhältnisses durch einen der Vertragspartner kann zuviel bezahltes Entgelt zurückerstattet werden. Der Kunde kann maximal 120 EUR Guthaben aufladen. 4.2 Als Zahlungsmöglichkeiten stehen die Überweisung, die Zahlung per Paypal und die Barzahlung per Brief zur Verfügung. 4.3 Alle Preise auf der Webseite von Posteo sind in EUR und enthalten 19% gesetzliche Mehrwertsteuer. 4.4 Der Kunde ist verpflichtet, auch Entgelte zu zahlen, die durch befugte oder unbefugte Nutzung seines Accounts durch Dritte entstanden sind, es sei denn, der Kunde hat die Nutzung nicht zu vertreten. Der Nachweis für die Nichtvertretbarkeit liegt beim Kunden. 4.5 Gerät der Kunde mit seinen Zahlungen trotz Hinweismails und Mahnungen 2 Monate in Rückstand, wird die Sendemöglichkeit des Postfachs gesperrt. Danach wird das Vertragsverhältnis durch Posteo gekündigt. 5. Pflichten des Kunden 5.1 Der Kunde wird das Zugangspasswort zu seinem Account geheim halten und es unverzüglich ändern oder von Posteo ändern lassen, wenn unbefugte Dritte davon Kenntnis erlangt haben könnten. 5.2 Der Kunde haftet auch für Dritte, die befugt oder unbefugt Leistungen über seinen Account nutzen oder genutzt haben. Dies gilt nicht, wenn der Kunde eine unbefugte Nutzung nicht zu vertreten hat. Der Kunde hat den Nachweis zu erbringen, dass er eine solche Nutzung nicht zu vertreten hat. 5.3 Der Kunde wird über den Mail Service keine Werbung per E-Mail für kommerzielle Zwecke versenden und den Mail Service nicht zum Versand standardisierter E-Mails an eine Vielzahl von Empfängern nutzen. 6. Missbrauch und Jugendschutz 6.1 Der Kunde verpflichtet sich, Posteo nicht missbräuchlich zu nutzen: keinen Spam zu verschicken (nicht mehr als 500 E-Mails pro Stunde und nicht mehr als 1000 E-Mails pro Tag versenden) nicht gegen Gesetze zu verstossen nicht gegen Vorschriften zum Schutze der Jugend zu verstoßen 6.2 Der Kunde haftet Posteo gegenüber für Schäden, die durch Verstöße gegen seine Pflichten aus 6.1 entstehen und stellt Posteo von diesbezüglichen Ansprüchen Dritter frei. Dies gilt nicht, wenn er den Verstoß nicht zu vertreten hat. Der Kunde hat den Nachweis zu erbringen, dass er den Verstoß nicht zu vertreten hat. 6.3 Nutzt der Kunde Posteo entgegen den Bestimmungen aus 6.1 und 5.3 kann das Postfach ohne vorherige Ankündigung durch Posteo gesperrt werden. Das Recht zur fristlosen Kündigung bleibt davon unberührt. 7. Datenschutz 7.1 Posteo und der Kunde werden die gesetzlichen datenschutzrechtlichen Vorgaben, insbesondere nach dem Telemediengesetz (TMG) und dem Bundesdatenschutzgesetz (BDSG) einhalten. Bestands- und Nutzungsdaten des Kunden werden nur erhoben, verarbeitet oder genutzt, soweit dies für die Abwicklung des Vertragsverhältnisses erforderlich ist. 7.2 Weitere Informationen über Art, Umfang und Zwecke der Erhebung, Verarbeitung und Nutzung personenbezogener und anderer Daten finden Sie in der Datenschutzerklärung zu Posteo. 8. Gewährleistung und Haftung 8.1 Posteo gewährleistet nicht, dass alle unter Ziffer 3 genannten Leistungen jederzeit erreichbar und fehlerfrei sind. Dies gilt insbesondere, soweit der Zugriff auf diese Leistungen durch Störungen verursacht wird, die nicht im Einflussbereich von Posteo liegen. Posteo wird Störungen der unter Ziffer 3 genannten Leistungen unverzüglich im Rahmen der bestehenden technischen und betrieblichen Möglichkeiten beseitigen. 8.2 Es gilt die Haftung nach dem Produkthaftungsgesetz. 9. Kündigung, Löschung des Accounts 9.1 Das Nutzungsverhältnis läuft für unbestimmte Zeit. Es kann vom Kunden oder von Posteo monatlich mit einer Frist von 14 Kalendertagen gekündigt werden. Das Recht zur fristlosen Kündigung nach Ziffer 1.2 oder aus wichtigem Grund (Ziffern 5 und 6) bleibt davon unberührt. 9.2 Eine Kündigung des Nutzungsverhältnisses durch den Kunden kann nur über das Kundenmenü von Posteo erfolgen. Posteo kann das Nutzungsverhältnis per E-Mail kündigen. 9.3 Bei einer Kündigung durch Posteo werden die vom Kunden gespeicherten Daten 90 Kalendertage nach Versenden der Kündigung gelöscht. 10. Geltendes Recht Für sämtliche Rechtsbeziehungen zwischen Posteo und dem Kunden gilt ausschließlich das Recht der Bundesrepublik Deutschland. Die Anwendung des UN-Kaufrechts ist ausgeschlossen. Stand: Januar 2013 Änderungen 01.01.2013: Namensänderung in Posteo e.K."
