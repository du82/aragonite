title = "Hilfe - Wie kann ich einen Posteo-Gutscheincode einlösen? - posteo.de"
full_description = "Wenn Sie einen Posteo-Gutscheincode geschenkt bekommen haben, können Sie damit entweder ein neues Postfach eröffnen oder Ihr bestehendes Postfach aufladen. Bei der Eröffnung eines Postfachs können Sie im zweiten Schritt bei der Wahl der Zahlungsmethode “Gutschein” auswählen und den Gutschein-Code eintragen. Wenn Sie Ihr bestehendes Postfach mit einem Posteo-Gutscheincode aufladen möchten, klicken Sie bitte auf “Einstellungen”, dann auf “Gutscheine” und dort auf “Gutschein mit Gutschein-Code einlösen”. Das Guthaben wird jeweils sofort Ihrem Postfach gutgeschrieben."
