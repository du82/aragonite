["https://posteo.de/fr/news/inde-des-coupures-dinternet-limitent-les-droits-fondamentaux"]
title = "E-mail vert, sûr, simple et sans pub - posteo.de - Inde : des coupures d'Internet limitent les droits fondamentaux"
description = "Posteo est un fournisseur de messagerie innovant misant sur la durabilité et la protection de la vie privée. Il fonctionne entièrement sans publicité. Nos boîtes mail, calendriers et carnets d'adresse peuvent être syncrhonisés: nous utilisons un concept de chiffrement global."
full_description = "Julius Stiebert 21.02.2025 Inde : des coupures d'Internet limitent les droits fondamentaux En Inde, les autorités ont coupé plus de 150 réseaux internet au cours des deux dernières années. Cela nuirait aux droits fondamentaux de millions de personnes, d’après un nouveau rapport. Depuis des années, des ONG observent que l’Inde effectue plus de coupures de réseaux qu’aucun autre pays du monde. (Source : IMAGO / ZUMA Press Wire) En 2024, 60 réseaux internet ont été coupés en Inde. C’est ce qui ressort du nouveau rapport de l’organisation indienne Software Freedom Law Center (SFLC). Certes, ce nombre aurait diminué par rapport à l’année précédente. Le SFLC dénonce cependant le fait que ces restrictions iraient contre les droits fondamentaux, et que les autorités agiraient de manière peu transparente. Depuis des années, les observateurs constatent que le plus grand nombre de coupures de réseaux au niveau global ont lieu dans cet État d’Asie du Sud. Le SFLC documente ce genre de blocages (en anglais) également. Dans son rapport « Let The Net Work 2.0 » (en anglais), l’organisation étudie la période se situant entre début 2023 et fin 2024. Au cours de ces deux années, l’organisation a compté au total 156 coupures de réseaux — 60 en 2024 et 96 en 2023. En 2023, il y a eu au total des coupures dans 13 États fédéraux et en 2024, 16 État fédéraux ont fait usage de cette mesure controversée. Seuls les blocages complets ont été pris en compte, et pas le blocage de certains fournisseurs seulement. D’après le rapport, 95 % environ des utilisatrices et utilisateurs en Inde accèdent à Internet via des téléphones mobile et des smartphones — c’est pourquoi l’Internet mobile serait le plus souvent désactivé. Le motif fréquemment invoqué pour imposer ces dispositions serait la sécurité publique nationale. Dans d’autres cas, il s’agirait d’endiguer la diffusion de fausses informations. Les autorités imposeraient des blocages aussi bien à titre préventif, avant certains évènements, qu’en réaction, par exemple après des manifestations. Elles recourraient cependant également aux blocages afin d’éviter les fraudes à l’examen ou dans le cas de tensions attendues lors d’évènements sportifs, rapporte l’organisation. Aussi bien en 2023 qu’en 2024, la plupart des coupures de réseaux auraient été décidés de manière préventive, poursuit le rapport. Droits fondamentaux limités Le SFLC dénonce le fait que ces restrictions auraient toujours des effets sur la vie des résidents des territoires concernés et sur l’approvisionnement des populations. Les droits fondamentaux seraient limités ou atteints, dont la liberté d’expression et le droit à l’information. Mais même le droit à la vie peut également être affecté lorsque les soins d’urgence ne peuvent plus être garantis en raison d’un blocage d’Internet. Les personnes tributaires de services de télémédecine pourraient également être confrontées à des retards de traitement qui peuvent mettre leur vie en danger. Les blocages pourraient également avoir des effets négatifs sur la sécurité publique lorsque des personnes ne peuvent plus être informées de dangers. De plus, les personnes plus modestes seraient impactées plus fortement que les personnes plus aisées qui ont accès à des réseaux fixes. Les élèves ainsi que les étudiants seraient en partie privés de certains cours en raison de blocages d’Internet, si bien que le droit à l’èducation serait également atteint. Il y a deux ans déjà, Human Rights Watch (HRW) et la Internet Freedom Foundation indienne avaient démontré dans un rapport quels effets ces blocages ont sur les populations les plus modestes (en allemand) en Inde. Ainsi, par exemple, la population ne peut pas obtenir de rations alimentaires ou encore recevoir de salaire. Quotidien digital En Inde, de grandes parties de la vie quotidienne sont désormais digitalisées — du paiement aux soins de santé, en passant par les prestations sociales. Les coupures d’Internet nuiraient par conséquent à de nombreux aspects de la vie quotidienne. Pour les entreprises et les indépendants, ces coupures peuvent entraîner des pertes financières. L’État fédéral du Manipur, avec ses 2,7 millions d’habitants, en est un exemple. Le gouvernement local a appliqué, aussi bien en 2023 qu’en 2024, de longues coupures d’Internet (en allemand). Le déclencheur aurait été des manifestations ainsi que des émeutes avec violences. Un étudiant du Manipur a rapporté à la SFLC qu’il n’avait pas pu recevoir de soutien financier de ses parents, car l’Internet mobile avait été désactivé, et qu’il n’avait par conséquent pas pu s’acheter des fournitures pour ses études. Un autre étudiant a déclaré qu’Il n’avait pas pu trouver de travail pour cette même raison. Un journaliste du Manipur a rapporté que les coupures d’Internet avaient rendu la couverture médiatique plus difficile. Le SFLC dénonce le fait que non seulement la liberté de la presse soit restreinte, mais aussi que l’accès de la population aux informations importantes soit également empêché. Cela a également été observé dans la ville de Jainoor, où Internet a été désactivé après des violences. Ainsi, un mur a été érigé entre les habitants de cette ville et le reste de l’Inde. De plus en plus, on recourrait en Inde aux coupures d’Internet afin d’empêcher les fraudes à l’examen. Le SFLC a dénoncé le fait que toutes les autres personnes des régions concernées souffriraient de ces restrictions. Une plainte contre ces pratiques devant la Cour suprême indienne est en cours. Une démarche dénuée de transparence Toutes les coupures de réseaux en Inde manquent de transparence, d’après le rapport. La Cour suprême indienne avait déjà déclaré début 2020 dans un arrêt (en allemand) qu’il s’agissait d’une « mesure drastique » qui pouvait être prise par l’État uniquement lorsqu’elle serait « nécessaire » et « inévitable ». Avant cela, des alternatives devraient être étudiées. Les juges avaient également déterminé que les autorités devaient toujours publier les ordonnances de coupure d’Internet. De plus, les restrictions ne devraient pas être imposées pour une durée indéterminée. Cependant, les autorités ne publieraient leurs ordonnances que rarement, dénonce la SFLC, par exemple à Jainoor. Selon le rapport, la base juridique pour les coupures d’Internet en Inde a été révisée l’année dernière et exige désormais qu’une justification accompagne la publication des ordonnances. Le SFLC dénonce également le fait que dans la loi, la notion d’« ordre public » soit très large et puisse être interprétée de diverses manières. Comme il n’y a pas d’instance indépendante, il y aurait un risque d’abus — les blocages de réseaux pourraient également être imposées pour des raisons qui dépasseraient les « préoccupations légitimes liées à la sécurité ». Devant la Cour suprême, d’autres plaintes en cours exigent également un contrôle judiciaire. De plus, la loi n’exige, d’après la SLFC, aucune proportionnalité. La Cour suprême avait souligné cet aspect. L’organisation exige qu’un cadre légal, qui mette au premier plan la transparence, le principe de responsabilité et la protection des droits fondamentaux soit mis en place. Des experts des Nations Unies avaient également dénoncé les coupures de réseaux dans un rapport datant de 2022. De telles mesures auraient des « conséquences dramatiques » sur la vie et les droits humains de millions de personnes. Les experts avaient demandé que les États n’imposent fondamentalement aucun blocage d’Internet. Et s’ils recouraient à ce moyen, cette mesure devrait être justifiée par des lois accessibles au public. La population devrait également être informée en amont, et une autorisation préalable d’un tribunal ou d’une autre instance indépendante serait nécessaire.(js)"
