["https://posteo.de/fr/site/declaration_protection_donnees"]
title = "E-mail vert, sûr, simple et sans pub - posteo.de - Déclaration relative à la protection des données"
description = "Posteo est un fournisseur de messagerie innovant misant sur la durabilité et la protection de la vie privée. Il fonctionne entièrement sans publicité. Nos boîtes mail, calendriers et carnets d'adresse peuvent être syncrhonisés: nous utilisons un concept de chiffrement global."
full_description = "Déclaration relative à la protection des données Posteo signifie une protection des données maximale, la minimisation des données et la protection de la vie privée dès la conception : nous montrons comment un service internet peut être géré de façon conséquente sans collecte des données, traceurs et financement par la publicité. Ainsi, nous ne prélevons fondamentalement aucunes données d'encours comme vos noms ou adresses. Notre site internet et la messagerie en ligne sont sans publicités et traceurs. De plus, nous renonçons à l'intégration de modules d'extension de réseaux sociaux, n'utilisons aucuns produits Google. Dans cette déclaration relative à la protection des données, nous vous donnons un aperçu de la protection des données chez Posteo. Fondement juridique La prestation de nos services de messagerie requiert le traitement de données et se déroule conformément à la législation. Pour la protection des données, ce sont surtout le Règlement général sur la protection des données (RGPD), la loi fédérale relative à la protection des données (BDSG), la loi sur les télémédias (TMG) ainsi que le secret des télécommunications qui sont décisifs. Les services de Posteo sont hébergés exclusivement sur nos serveurs en Allemagne. Responsable : Cette information relative à la protection des données est valable pour le traitement réalisé par Posteo e.K. Methfesselstrasse 38 10965 Berlin Allemagne E-Mail: support@posteo.de Délégué interne à la protection des données : Niels Herrmann E-mail : datenschutz@posteo.de Le délégué interne à la protection des données de Posteo e.K. est également joignable à l'adresse postale ci-dessus (complément d'adresse : « Délégué à la protection des données Niels Herrmann ») En novembre 2016, la Commissaire fédérale à la protection des données (BfDI) a effectué une visite d'inspection non motivée portant sur la protection des données chez Posteo. Il n'y a eu aucune réclamation et la BfDi a explicitement loué notre concept de protection des données. Vous trouverez le rapport d'inspection complet ici. Pas de données d'encours Fondamentalement, nous ne collectons ni n'enregistrons aucune de vos données d'encours (comme les noms, les adresses, etc.). Lors de l'inscription, vous n'indiquez ni données d'encours, ni données à caractère personnel. Grâce à cette minimisation des données dans notre conception, nous prévenons efficacement les vols de données : seuls les ensembles de données dont ne dispose pas l'entreprise ne peuvent être subtilisés, avec une fiabilité de 100 %. De plus, les données de paiement ne sont pas reliées avec votre boîte mail chez Posteo. C'est pourquoi, chez nous, nous ne disposons d'absolument aucune donnée d'encours sur votre boîte mail Posteo. Pour le dire autrement : Posteo ne monte aucun dossier contenant les données des clients ou des données à caractère personnel sur votre boîte mail. Cela a été confirmé en 2017, de manière indépendante et après un contrôle sur place, dans un rapport d'inspection de la Commissaire fédérale à la protection des données (BfDI). Données d'utilisation : Pas d'adresses IP Les données d'utilisation sont toutes les données qui sont générées lors de l'utilisation de Posteo. Conformément à la législation, nous ne collectons ni n'enregistrons fondamentalement aucune adresse IP pouvant renvoyer à des clients. Ceci est confirmé en toute indépendance par le rapport d'inspection sur Posteo de la Commissaire fédérale à la protection des données. Nous ne collectons pas non plus votre adresse IP quand vous visitez notre site internet ou utilisez notre formulaire de contact ou la messagerie en ligne. Nous ne collectons ni n'enregistrons votre adresse IP quand vous consultez vos e-mails via IMAP ou POP3, ou lorsque vous livrez un e-mail pour un envoi avec un client de messagerie externe via SMTP. Lors de la communication entre serveurs de messagerie via SMTP, les adresses IP d'autres serveurs de messagerie nous sont indiquées, par exemples les adresses IP des serveurs GMX ou Gmail. Les adresses IP des serveurs des fournisseurs figurent, en cas d'erreur seulement, dans les protocoles de fichiers journaux puis sont effacées au bout de sept jours. Nous consignons uniquement les erreurs lors de l'envoi et la réception d'e-mails afin de comprendre et résoudre rapidement les dysfonctionnements techniques et les erreurs. Nous effaçons automatiquement ces données qui ne peuvent pas être reliées aux personnes au bout de 7 jours. De plus, nous produisons des statistiques anonymes d'utilisation ou d'utilisation du système. Ces statistiques ne contiennent pas non plus de données pouvant renvoyer à des personnes ou des adresses IP. Données de contenu Le concept de données de contenu n'est pas défini juridiquement. Dans ce contexte, nous parlons des contenus enregistrés d'une boîte mail. Les contenus d'une communication et des objets liés à celle-ci (les e-mails et leurs métadonnées) sont soumis au secret des télécommunications et sont protégés par les droits fondamentaux. Cela signifie que personne n'a le droit de lire vos e-mails – et nous n'avons pas non plus le droit de les transmettre à des tiers. Cela constituerait une violation de vos droits fondamentaux et serait répréhensible. Le secret des télécommunications ne peut être restreint que dans des cas précis et seulement par un juge, en cas de soupçon de certaines infractions. D'un point de vue technique, nous protégeons en permanence vos données de contenu à l'aide des dernières technologies de sécurité, voir la page d'information sur le chiffrement. Les données de contenu sont de plus toujours enregistrées sur des disques durs chiffrés afin de les protéger contre des atteintes physiques. Nous gérons et entretenons notre propre infrastructure de serveurs, la localisation des serveurs et celle de l'enregistrement sont en Allemagne. Quotidiennement, nous enregistrons les données de contenu au sein de sauvegardes de sécurité et conservons celles-ci pour une durée de 7 jours. Nous vous prions cependant d'effectuer en plus, pour être sûrs, des copies régulières de vos données de contenu, au cas où vous les effaceriez par accident. De plus, nous offrons la possibilité d'enregistrer de façon chiffrée les données d'e-mails, des notes, carnets d'adresses et des calendriers sur nos serveurs, individuellement, avec le mot de passe de la boîte mail (chiffrement AES). Vous pouvez le faire en un clic dans les paramètres de votre boîte mail. Les utilisateurs d'un chiffrement de bout en bout peuvent ajouter à tous les e-mails entrants une couche de chiffrement supplémentaire avec le chiffrement à l'entrée. Si vous effacez les données de contenu, elles seront immédiatement effacées. Si celles-ci ont été enregistrées auparavant dans l'une de nos sauvegardes de sécurité quotidiennes, elles y resteront 7 jours supplémentaires jusqu'à ce qu'elles y soient aussi effacées définitivement. Posteo n'efface fondamentalement aucune donnée de contenu d'une boîte mail tant que la relation contractuelle est effective et que la boîte mail n'a pas été effectivement résiliée d'après les termes de nos CGV, par vous ou Posteo. La reconnaissance automatiques des spams et des virus a lieu chez Posteo, sans rapport avec les personnes ; de plus, aucun profil n'est créé. Nous effectuons la reconnaissance des spams nous-mêmes. Pour cela, nous utilisons notamment des listes noires de fournisseurs tiers, mais uniquement sur nos serveurs, localement. Les contenus de nos utilisatrices et utilisateurs ne sont pas analysés par des tiers ou par leur biais et ne sont fondamentalement pas traités par des logiciels de reconnaissance de courrier indésirable chez des tiers. Les autres fournisseurs n'obtiennent aucune information sur les résultats de la reconnaissance des spams par Posteo. Données de paiement : non liées aux boîtes mail Lors de virements ou de paiements par Paypal, votre nom ou le nom de la personne qui paie, ainsi que l'IBAN dans le cas d'un virement, nous sont transmis. Nous n'obtenons aucun donnée sur le payeur de l'entreprise émettrice de la carte de crédit. Fondamentalement, les données de paiement chez Posteo ne sont pas reliées aux boîtes mail, si bien que les données du payeur transmises ne sont pas disponibles pour une boîte mail donnée. Nous utilisons depuis notre création en 2009 notre propre procédé d'anonymisation pour tous les procédés de paiement qui sépare totalement ces derniers des boîtes mail. Sur notre page d'information sur les paiements, vous trouverez des informations détaillées sur ce sujet. Ce procédé protège vos données de paiement sensibles d'éventuels vols de donnés et des abus de façon optimale. Comme aucune donnée de paiement n'est enregistrée dans votre boîte mail Posteo, vous ne pouvez pas mettre en place de virement automatique chez nous : vous payez toujours votre boîte mail en avance. Pour votre paiement en avance, vous obtenez un reçu sans nom, adresses et indication de la TVA. Ce reçu est une preuve de paiement imposable. Pour des raisons fiscales, nous sommes légalement contrains de conserver les reçus de tous les paiements pendant 10 ans ; ces reçus ne sont conservés qu'à cette fin. Notre démarche d'anonymisation des procédés de paiement est également évoquée dans le rapport d'inspection de la Commissaire fédérale à la protection des données sur Posteo et il y est confirmé que les données de paiement ne sont pas reliées aux boîtes mail. Dès 2014, le gouvernement fédéral avait confirmé dans sa réponse à une demande de l'ancien député du Bundestag Hans-Christian Ströbele qu'il n'y avait pas d'obligation pour les fournisseurs de messagerie à relier les données de paiement aux boîtes mail. Pas d'utilisation d'informations sur votre solvabilité/pas de recouvrement de dettes Nous ne faisons aucune demande d'information à des agences de renseignement sur les crédits de type Schufa (Agence de crédit en Allemagne) ou de renseignements autres relatifs à votre solvabilité. En cas de délai de paiement, nous n'avons pas non plus recours à des sociétés de recouvrement. Chez Posteo, vous payez en avance. Pas de publicité, pas de traceurs, pas d'insertion de réseaux sociaux et de produits Google Chez Posteo, il n'y a pas de traceurs ni de publicités à l'écran. Nous ne vous envoyons pas non plus d'e-mails publicitaires. Nous travaillons indépendamment et n'avons aucun partenaire annonceur. C'est seulement ainsi qu'un service sur Internet peut vraiment avoir un fonctionnement respectueux de la protection des données. Notre site internet est, de plus, dépourvu de modules d'extension de réseaux sociaux comme Facebook, Twitter et Cie. Si nous insérions ce genre de modules sur notre site internet, les données d'utilisation et à caractère personnel comme les adresses IP seraient transmises à ces services. Nous ne le souhaitons pas. De plus, nous n'utilisons aucun produit Google comme Google Analytics ou encore ce qu'on appelle les captchas d'autres fournisseurs : le captcha, qui pose des questions de sécurité lors de l'inscription, a été programmé par Posteo et ne collecte aucune de vos données, comme par exemple votre adresse IP. Si vous le souhaitez, vous pouvez vous abonner vous-mêmes en « Opt in » à la newsletter Posteo dans les paramètres de votre boîte mail. À tout moment, vous avez la possibilité de vous désabonner de cette newsletter. Réinitialisation de mot de passe favorable à la protection des données Dans les paramètres de votre boîte mail, vous pouvez activer notre fonction « Mot de passe oublié » pour votre numéro de téléphone. Dans le cas d'une perte de votre mot de passe, vous pouvez vous envoyer un nouveau mot de passe par SMS. Votre numéro de téléphone, cette donnée sensible, ne nous est pas transmis quand vous activez la fonction. Nous obtenons seulement le résultat d'un calcul mathématique (un hachage salé) que nous sécurisons encore par une étape supplémentaire. Ces données ne sont plus que des suites de signes – et, d'après la décision de l'Agence fédérale des réseaux en 2017, ne sont pas des données d'encours. C'est pourquoi elles ne relèvent pas d'une obligation d'information vis-à-vis des autorités publiques. Vous pouvez désactiver cette fonction dans les paramètres de votre boîte mail à tout moment. La suite de chiffres sera également effacée. Service de migration Posteo : Transfert de données sécurisé sans recours à des fournisseurs tiers Chez Posteo, nous mettons en œuvre un service de migration que nous avons développé nous-mêmes puisque, pour des raisons de protection des données, nous ne souhaitons ni utiliser, ni recommander les solutions de fournisseurs tiers pour le transfert de vos données sensibles. Grâce à notre service de migration, vous pouvez importer de façon sûre des boîtes mail d'autres fournisseurs (par exemple GMX, web.de, iCloud, etc.) vers Posteo, y compris toutes les arborescences de dossiers (nombre de niveaux illimité). Vous décidez de copier la totalité du contenu de votre ancienne boîte mail ou seulement certains dossiers. Les dossiers sélectionnés sont récupérés par Posteo chez votre fournisseur précédent directement puis importés directement dans votre boîte mail Posteo via des connexions chiffrées. À aucun moment vos données ne sont transmises par le biais de fournisseurs intermédiaires. Il est désormais possible d'importer également des données de carnet d'adresses ou de calendriers vers Posteo de cette manière, ceci depuis de nombreux fournisseurs (par exemple GMX, web.de, iCloud, etc.). Nous avons conçu le service de migration Posteo conformément à notre principe de minimisation maximale des données. Une fois la migration terminée, vous pouvez faire collecter régulièrement les nouveaux e-mails entrants dans votre ancienne boîte mail. Dans un premier temps, cette option ne sera active que pendant trois mois. Vous pouvez prolonger la collecte à tout moment et de façon illimitée. Les données entrées pour activer le service de collecte sont enregistrées de façon chiffrée jusqu'à ce que vous effaciez le service de collecte. Dans le cas du service de migration, les données saisies sont conservées de façon chiffrée dans la mémoire de travail et seulement pour la durée de la migration. Importation/exportation des données Vos données vous appartiennent. Vous pouvez exporter toutes vos données enregistrées chez nous (données d'e-mail, de carnet d'adresses, de calendriers, notes) à tout moment, à l'aide de formats ouverts prévus à cet effet et de programmes d'application libres d'accès. Vous pouvez également les sauvegarder localement. Inversement, vous avez également la possibilité d'importer des données, de la même façon. Les formats utilisés sont IMAP, POP3, SMTP, CardDAV et CalDAV. Dans notre rubrique d'aide, nous proposons des instructions au sujet de l'importation et de l'exportation des données. Sinon, dans de nombreux cas, vous pouvez également utiliser notre service de migration pour importer des données. Pas de cookies traceurs Nous n'utilisons aucun cookie traceur ou d'anal"
