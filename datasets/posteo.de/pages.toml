["https://posteo.de/fr/site/protection_des_donnees"]
title = "E-mail vert, sûr, simple et sans pub - posteo.de - Protection des données"
description = "Posteo est un fournisseur de messagerie innovant misant sur la durabilité et la protection de la vie privée. Il fonctionne entièrement sans publicité. Nos boîtes mail, calendriers et carnets d'adresse peuvent être syncrhonisés: nous utilisons un concept de chiffrement global."
full_description = "Nos motivations Pour plus de protection des données dans le monde numérique Vos données sont précieuses : les services en ligne, les réseaux sociaux ou les fournisseurs de messagerie enregistrent des données à caractère personnel, génèrent des profils concernant les habitudes de navigation, les lieux de résidence, les préférences et les habitudes de consommation de leurs utilisateurs, et s'enrichissent par ce biais. Les données des utilisateurs sont revendues à des entreprises spécialisées dans le commerce de données ou des annonceurs et utilisées pour placer des publicités adaptées au groupe cible. C'est pour cette raison que les sites internet collectent souvent plus de données qu'ils n'en ont besoin. C'est ainsi que se mettent en place de véritables « stocks de données ». « Big brother » est devenu réalité à l'ère d'internet. L'inquiétude au sujet de cette évolution ne nous concerne pourtant pas tous. Mais cette fuite en avant que constitue la collecte des données a de plus en plus de conséquences : de nombreux services en lignes ne sécurisent pas suffisamment les données sensibles comme les données bancaires ou les informations de carte bancaire. Elles peuvent être facilement volées par des tiers ou utilisées de façon frauduleuse. De nombreux exemples illustrent ce problème. En général, la sécurité de ces données sensibles n'est pas garantie : de nombreux services sécurisent insuffisamment l'accès aux données des utilisateurs, ne les chiffrent pas et ne préviennent pas la perte de ces données. Tous ceux qui souhaitent que leurs données soit gérées de manière responsable ont souvent la seule option de devoir renoncer à l'utilisation de nombreux services et portails en ligne. Quand nous cherchions en vain en 2009 un fournisseur de messagerie électronique capable de gérer nos données de manière responsable, nous avons décidé de ne pas renoncer en créant notre propre service : Posteo. Minimisation des données Une inscription qui ne nécessite pas de divulguer ses données personnelles Pour vous inscrire chez Posteo, vous ne devez indiquer aucune donnée personnelle. Nous avons renoncé, dans la totalité des cas, à l'enregistrement de vos données personnelles. C'est ainsi que nous empêchons le stockage des données et que nous agissons selon le principe de la minimisation des données. Nous vous rendons le pouvoir de décider de l'utilisation de vos données et renforçons votre droit d'auto-détermination en matière d'information. Aucun commerce, aucune divulgation des données Nous ne collectons aucune donnée à caractère personnel. Par conséquent, nous ne pouvons divulguer ou faire commerce d'aucune de vos données. Suppression de l'agent utilisateur Dans l'en-tête d'un e-mail, le client de messagerie utilisé pour l'envoi peut parfois être visible dans ce qu'on appelle l'en-tête d'agent utilisateur. De nombreux clients de messagerie ajoutent cette information automatiquement. À cette occasion, des informations sur le système d'exploitation et l'appareil utilisés peuvent être incluses. Les e-mails que vous envoyez via notre messagerie en ligne ou des clients de messagerie externes ne contiennent pas ce genre d'information. Si vous utilisez Posteo avec un client de messagerie externe, nous effaçons ce genre d'informations lors de l'envoi de l'e-mail. Ainsi, nous protégeons votre vie privée et améliorons la sécurité. Suppression de l'adresse IP - pas d'adresses IP reliées aux boîtes mail Parfois, des adresses IP sont détaillées dans le code source d'un e-mail : dans ce qu'on appelle l'en-tête. Nous n'avons pas d'adresses IP liées aux boîtes mail, car nous n'en avons pas besoin pour notre fonctionnement. C'est pourquoi les e-mails envoyés via Posteo ne contiennent pas d'adresses IP de nos utilisateurs. Afin de protéger votre vie privée et pour des raisons de sécurité, nous effaçons en plus de cela dans les en-têtes d'éventuelles entrées d'adresses IP effectuées par des clients de messagerie locaux. C'est pourquoi les e-mails que vous envoyez via notre messagerie en ligne ou des clients de messagerie ne contiennent ni vos adresses IP locales, ni vos adresses IP publiques. Site internet sans enregistrement de votre adresse IP Lorsque vous visitez ou utilisez notre site, nous n'enregistrons pas votre adresse IP. Pas de suivi Nous renonçons par principe à l'utilisation d'outils de suivi afin de protéger votre sphère privée. C'est pourquoi vous ne trouverez sur notre page aucun lien vers les réseaux sociaux comme Facebook, X, Instagram ou d'autres. Adresses alias Nos adresses alias vous aident à restreindre la diffusion de votre adresse principale. Vous pouvez par exemple les utiliser pour vous inscrire sur des portails en ligne ou des forums. Minimisation des données : Nous ne collectons aucune donnée personnelle ni ne conservons de données relatives au trafic (comme les adresses IP) liées aux boîtes mail de nos utilisateurs. Nos procédés et fonctions sont toujours conçus selon le principe de la minimisation des données. L'absence de publicité Pas de financement par la publicité : notre service est calculé selon le principe de la durabilité et nos coûts sont supportés par les contributions de nos utilisateurs. Une minimisation des données rendue possible par la renonciation à la publicité. Nous ne souhaitons pas vendre les données de nos utilisateurs aux annonceurs. Pas de dépendance vis-à-vis des annonceurs : l'existence de nombreux services en ligne repose sur le bon vouloir et l'argent des annonceurs. Nous fonctionnons sans publicité et, par conséquent, sommes indépendants. Paiement anonymisé Le crédit de votre boîte mail Posteo est toujours rechargé de façon anonyme, que vous payiez par virement, Paypal, carte de crédit ou en espèces. Par principe, nous ne relions jamais les données de paiement que nous recevons aux boîtes mail correspondantes. Pour cela, nous avons développé en 2009 un système de paiement Posteo unique nous permettant d'anonymiser toutes nos procédures de paiement. En 2015, le système de paiement a été élargi afin de répondre à de nouvelles réglementations. Lorsque vous nous virez de l'argent, vous nous indiquez un code à usage unique dans la référence de paiement que nous vous avons envoyé préalablement par e-mail. Quand votre paiement nous parvient, notre système lit le code de la référence de paiement et attribue le paiement à votre boîte mail. Votre crédit est alors rechargé et le code à usage unique est effacé de notre système. Comme le code est effacé, il est impossible de savoir pour quelle boîte mail Posteo vous avez viré de l'argent. Dans le cas de paiement en espèces, l'attribution se déroule également grâce au code à usage unique : vous notez le code à usage unique sur un bout de papier que vous joignez à votre paiement. Si vous payez avec Paypal, le crédit est rechargé dans votre compte au moment du paiement. Cependant, nous ne relions toujours pas les données que nous recevons de Paypal à votre boîte mail. Les fournisseurs de messagerie allemands ne sont pas obligés de relier les données de paiement aux boîtes mail correspondantes. Le ministère fédéral de la Justice nous a confirmé cela dans une réponse à une question du député Christian Ströbele (allemand). Sécurité des données Un concept de chiffrement global Rendez-vous sur notre page d'information sur le chiffrement pour en savoir plus sur la façon dont nous protégeons vos données, toutes les voies de transmission et les accès grâce à notre concept global de chiffrement. Un filtre anti-virus extrêmement efficace Notre filtre anti-virus actualisé toutes les heures capte les e-mails entrants contenant des virus (connus) et vous protège ainsi efficacement des attaques. Un filtre anti-spam extrêmement efficace Notre filtre anti-spam à plusieurs niveaux vous protège efficacement et de façon fiable des spams indésirables. Pour en savoir plus sur notre filtre anti-spam, rendez-vous dans notre rubrique d'aide. Des sauvegardes quotidiennes Chaque jour, nous effectuons des sauvegardes de sécurité de toutes nos données, réparties dans la journée. Nous enregistrons ces sauvegardes pour une durée de sept jours afin de pouvoir, si besoin, restaurer des données. Dans les cas urgents, nous tentons de restaurer ces données également en dehors de nos horaires d'ouverture. Avis automatique de suppression Il arrive souvent que les utilisateurs suppriment des e-mails par erreur. Afin de vous protéger de la perte de données, Posteo vous informe par e-mail lorsqu'un nombre important d'e-mails ont été supprimés de votre boîte mail. Vous pouvez alors, si besoin, demander à temps de restaurer les e-mails. Importation et exportation de toutes les données Chez Posteo, vous avez le contrôle sur vos données : vous avez tout d'abord la possibilité d'importer vos données vers Posteo grâce à notre système de migration. Vous pouvez également exporter à nouveau toutes vos données via des interfaces standard. Vous pouvez ainsi les sauvegarder localement et effacer vos données qui se trouvent chez nous. Pour en savoir plus, rendez-vous sur la page : Déclaration relative à la protection des données Nos employés sont tenus contractuellement à la confidentialité Nos employés sont tenus de respecter le principe de confidentialité et nos ordinateurs sont entièrement chiffrés. Tous nos papiers usagés (par exemple les lettres contenant les paiements en espèces) sont broyés. Stockage des données en Allemagne, redondance des données Toutes les données sont stockées exclusivement en Allemagne et sont conservées de manière redondante sur deux sites principaux. Des serveurs dans des centres de calcul hautement sécurisés Nos serveurs se trouvent dans des centres de calcul à Francfort-sur-le-Main, Bielefeld et Berlin. Nous les surveillons 24 heures sur 24. Les deux sites principaux à Francfort-sur-le-Main sont reliés à Internet via six câbles de fibres optique indépendants les uns des autres. Même l'alimentation électrique passe par deux câbles indépendants l'un de l'autre. De plus, les nombreuses installations d'alimentation sans interruption garantissent le maintien du service, même en cas de panne électrique importante. Des mesures particulières comme les systèmes de sécurité incendie, les compartiments coupe-feu, la séparation physique de l'alimentation électrique des serveurs ou encore un système électronique de contrôle d'accès, et plus encore, se chargent de renforcer encore plus la sécurité de ces espaces. S'inscrire maintenant. Ici, vous pouvez ouvrir un compte pour 1 €/mois et l'utiliser tout de suite. L'inscription ne nécessite de divulguer aucune donnée à caractère personnel. S'inscrire >>"
year_published = 2025
clearnet = "https://posteo.de/fr/site/protection_des_donnees"
