["https://posteo.de/de"]
title = "E-Mail grün, sicher, einfach und werbefrei - posteo.de -"
description = "Posteo ist ein innvovativer E-Mail-Anbieter, der auf Nachhaltigkeit und Datenschutz setzt und komplett Werbefrei ist. Unsere E-Mail-Postfächer, Kalender und Adressbücher sind synchronisierbar - wir setzen auf umfassende Verschlüsselung."
full_description = '''Pressestimmen Indeed, the company has been a global leader in rolling out secure technologies. The Guardian Legen Sie sich ein Postfach beim deutschen Dienst Posteo an statt bei Googlemail. Planet Wissen Bei Posteo richtet der Kunde das Konto anonym ein und kann anonym bezahlen. Selbst die Sicherheitsfunktion Zwei-Faktor-Authentifizierung (2FA) realisiert Posteo anonym. Stiftung Warentest Das Berliner Unternehmen Posteo setzt seit dem heutigen Montag als vermutlich weltweit erster Mail-Dienstleister die moderne DANE-Technik ein, um den verschlüsselten Mail-Transport abzusichern. Heise Posteo ist also nicht nur ein kommerzielles Projekt. Der unbedingte Einsatz für den Datenschutz zeigt vielmehr: Auch Telekommunikationsanbieter können politisch denken und handeln. Deutschlandfunk Posteo arbeitet per Standard mit allen gängigen Verschlüsselungsmethoden. Vor allem aber erhebt es von seinen Kunden so wenige Daten wie möglich. FAZ E-Mail-Anbieter gibt es viele, doch der Provider Posteo sticht aus der Masse heraus. Das kleine Unternehmen aus Berlin setzt nicht nur auf optimale Sicherheit und Datenschutz, sondern verfolgt auch eine besonders nachhaltige Philosophie. Ökotest Verlag (Markt und Medien) Certificate Pinning ist ein vergleichsweise junger Standard, der antritt, das Vertrauen in die Verschlüsselung im Web wieder herzustellen. (...) Mit Posteo testet der erste größere deutsche Dienst dieses Konzept nun im Praxis-Einsatz. Heise Als Alternative zu den gängigen Mail-Anbietern empfiehlt WDR-Internetexperte Jörg Schieb ein Postfach beim deutschen Dienst "Posteo", der komplett werbefrei ist und großen Wert auf Datenschutz und Privatsphäre legt. ard.de Um das Vertrauen in die Integrität des Unternehmens zu festigen, veröffentlichte Posteo als erster deutscher E-Mail-Dienstleister Anfang Mai 2014 sogar einen Transparenzbericht zu Behördenanfragen. Technology Review Die ehemaligen Greenpeace-Aktivisten von Posteo erfüllen die geltenden Gesetze disziplinierter, als es den Ermittlungsbehörden lieb ist. Technology Review Posteo ist eines der ungewöhnlichsten deutschen Start-ups: Der Mail-Anbieter verzichtet auf Werbung und will von seinen Nutzern so wenige Daten sammeln wie möglich. c't magazin Überzeugt hat hingegen Posteo. Der kleine E-Mail-Provider bot als einziger deutscher E-Mail-Dienst Verschlüsselung mit Forward Secrecy für alle Mail-Protokolle. c't magazin Der Berliner Anbieter Posteo offeriert für schmales Geld viel Komfort, tolle Funktionen und einen hohen Sicherheitsstandard. Computerbild Posteo arbeitet mit Ökostrom, Eigenkapital und Festanstellungen und bietet sichere E-Mail-Accounts an. Die Berliner Firma ist ganz auf der Höhe der Zeit. Tagesspiegel Der Krypto-Mailspeicher ermöglicht es Posteo-Kunden, sämtliche E-Mail-Daten auf Knopfdruck individuell zu verschlüsseln. Linux-Magazin Schon lange vor der "NSA-Affäre" hat sich ein kleines Team in Berlin Gedanken um den sicheren und vor allem wirklich privaten E-Mail-Verkehr gemacht und im Jahr 2009 den E-Mail-Service Posteo gegründet. Chip Die meisten Berichte und Artikel konzentrieren sich fast ausschließlich auf Posteos Haltung zu Privatsphäre und Datensicherheit. Dabei entsprang der Plan, einen alternativen Emailanbieter aufzubauen, ursprünglich einer ökologischen Motivation. Stiftung Futur Zwei Der heute vorgestellte Transparenzbericht des E-Mailproviders Posteo übt heftige Kritik an der Praxis von Behördenanfragen. netzpolitik.org Eine Besonderheit ist, dass sich bei Posteo online angelegte Adressbücher und Kalender vom Nutzer verschlüsseln lassen. Spiegel Online Ein Postfach mit 2 Gigabyte Speicher kostet einen Euro im Monat - dafür ist es werbefrei, die Server werden mit Ökostrom von Greenpeace Energy betrieben und es gibt kostenlosen E-Mail-Support. SZ Als Besonderheit ermöglicht Posteo seinen Kunden, ihre kompletten Mail-, Adress- und Kalenderdaten in verschlüsselte Stores zu packen. c't magazin Those who wish to open an entirely anonymous email account can do so knowing that the payment information isn’t associated with the account. Irish Times Einen Euro im Monat kostet das Postfach, dafür bekommt man zwei Gigabyte Speicherplatz und die Gewissheit, dass man Kunde bei einem Unternehmen ist, das Ökostrom und ein Konto bei der GLS-Bank nutzt. Berliner Zeitung Der Zugriff auf E-Mails, Termine und Adressen ist zudem von allen Plattformen wie OS X, iOS, Android und Windows möglich. Macwelt In Germania va forte Posteo, un servizio di email ultra sicuro che promette di non conservare alcune informazione identificativa relativa ai messaggi scambiati La Stampa La start-up berlinoise, spécialisée dans les boîtes mails sécurisées et payantes est devenue en quelques années le leader mondial du secteur. ParisBerlin Magazine Der datenschutzorientierte E-Mail-Anbieter Posteo führt die passwortbasierte Verschlüsselung ganzer Postfächer auf seinen Servern ein. Sie muss vom Nutzer nur in den Einstellungen aktiviert werden und funktioniert dann automatisch mit dem Kundenpasswort. N24 Privacy is ensured by encryption and IP stripping, whereby Posteo’s server replaces your IP with theirs anytime you send an email. Also, no ads are served nor is user data tracked. Irish Times Auch das Umweltgewissen lässt sich mit einem Konto bei Posteo verbessern, da der Anbieter besonderen Wert auf Energieeffizienz und Umweltschonung legt. Macwelt'''
