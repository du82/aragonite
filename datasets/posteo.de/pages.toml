title = "E-Mail grün, sicher, einfach und werbefrei - posteo.de - Wir suchen Verstärkung!"
description = "Posteo ist ein innvovativer E-Mail-Anbieter, der auf Nachhaltigkeit und Datenschutz setzt und komplett Werbefrei ist. Unsere E-Mail-Postfächer, Kalender und Adressbücher sind synchronisierbar - wir setzen auf umfassende Verschlüsselung."
full_description = "Wir suchen Verstärkung! Erstellt am 01.Oktober 2024, 16:00 Uhr | Kategorie: Blog Liebe Kundinnen und Kunden, liebe Interessierte, heute haben wir eine Mitteilung in eigener Sache. Wir suchen zur Verstärkung unseres Teams aktuell: - eine(n) Web-Softwareentwickler(in) (m/w/d) - eine(n) Systemadministrator(in) (m/w/d) - eine(n) Software-Tester(in) (m/w/d) - eine(n) Mitarbeiter(in) für den englischsprachigen Kunden-Support (m/w/d) Falls Sie sich für eine der ausgeschriebenen Stellen interessieren, freuen wir uns auf Ihre Bewerbung per E-Mail an jobs@posteo.de. Vielleicht kennen Sie auch Menschen, für die eine der ausgeschriebenen Stellen infrage kommen könnte. In diesem Fall freuen wir uns darüber, wenn Sie unsere Anzeige weiterleiten. Arbeiten bei Posteo Posteo ist ein unabhängiger und innovativer E-Mailanbieter. Wir setzen auf Nachhaltigkeit, Sicherheit, maximalen Datenschutz, einfache Bedienbarkeit und Werbefreiheit. Wir legen Wert auf langfristige Arbeitsverhältnisse. Bei uns gibt es ausschließlich unbefristete Festanstellungen. Viele Tätigkeiten sind vollständig remote möglich. Bewerben Sie sich auf solche Stellen gerne auch, wenn Sie nicht in Berlin wohnen und von einem anderen Ort innerhalb von Deutschland aus arbeiten möchten. Wer zeitweise oder dauerhaft lieber in einem Büro arbeitet, kann das auf dem verkehrsgünstig gelegenen Posteo-Campus in Berlin tun – kostenfreies Mittagessen inklusive. Egal, ob Sie lieber mobil arbeiten oder im Büro: Eine gute Work-Life-Balance muss gesichert sein. Die Wochenarbeitszeit kann auf Wunsch flexibel in einem Gleitzeit-Modell geleistet und auf Wunsch an veränderte Lebenssituationen angepasst werden. Wer bei Urlaub im Ausland mit dem Zug reist, bekommt bis zu 2 zusätzliche Urlaubstage pro Jahr und einen Zuschuss für das Bahnticket. Unsere Mitarbeiterinnen und Mitarbeiter erhalten außerdem ein kostenfreies ÖPNV-Ticket. Fahrräder, die auch für den Weg zur Arbeit benutzt werden, lassen wir kostenfrei warten und reparieren. Mehr Informationen über die Arbeit bei Posteo und die aktuellen Stellenanzeigen finden Sie unter: https://posteo.de/site/jobs Viele freundliche Grüße sendet das Posteo-Team"
