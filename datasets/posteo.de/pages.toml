title = "E-mail vert, sûr, simple et sans pub - posteo.de - Blog"
description = "Posteo est un fournisseur de messagerie innovant misant sur la durabilité et la protection de la vie privée. Il fonctionne entièrement sans publicité. Nos boîtes mail, calendriers et carnets d'adresse peuvent être syncrhonisés: nous utilisons un concept de chiffrement global."
full_description = "Nouveau certificat de sécurité Créé le 17. February 2025, 20:00 | Catégorie: Info Chères clientes Posteo, chers clients Posteo, nous actualisons notre certificat de sécurité principal. Les certificats de sécurité ont une validité limitée dans le temps et doivent être renouvelés de temps à autre. Dans la plupart des cas, vous n’allez même pas le remarquer. Tous les programmes actuels tels que Thunderbird ou Outlook trouvent le nouveau certificat automatiquement. Vous n’avez rien à faire. Si votre programme vous signale cependant une erreur de certificat au cours de l’échange, veuillez redémarrer votre programme – cela devrait corriger l’erreur. #more# Si vous souhaitez régler la confiance accordée au certificat manuellement, vous trouverez ci-dessous l’empreinte du nouveau certificat principal. Vous trouverez également les empreintes complètes de tous les certificats sur notre page Mentions légales. Nouvelles empreintes du certificat de sécrité TLS pour posteo.de : Geotrust: SHA256: 64:59:9B:20:CD:28:CE:58:6A:C4:3C:F5:E8:84:AD:9D:28:8A:29:CB:44:AF:D4:79:EB:C2:47:8B:D6:86:C6:05 SHA1: 72:7C:16:4D:38:1E:44:C2:BB:A7:56:98:E3:27:9B:B4:3E:CE:65:B9 Bien cordialement, l’équipe Posteo Des bons d'achats Posteo à offrir Créé le 06. December 2024, 12:40 | Catégorie: Blog Chers clientes et clients Posteo, cherchez-vous encore un petit cadeau pour une personne qui a une adresse chez Posteo ? Avec nos bons d’achats, vous pouvez faire plaisir à vos proches. #more# Des bons d’achats en guise de cadeau Vous pouvez créer un bon d’achat en quelques clics dans les paramètres de votre boîte mail. Il peut être envoyé à d’autres boîtes mail Posteo par e-mail. Si vous le souhaitez, vous pouvez ajouter un message personnel à cet e-mail. Ou alors, vous inscrivez le code du bon d’achat sur une carte cadeau que vous pouvez personnaliser. Si vous souhaitez une carte cadeau avec le design Posteo, vous pouvez également utiliser nos modèles que vous trouverez sous ce billet de blog : ils peuvent être imprimés à l’aide d’une imprimante photo ou dans les stations photo des commerces de proximité puis collés sur une carte de vœux. Pour l’impression à une station photo, enregistrez les images sur une clé USB. Avec la clé, vous pourrez alors imprimer les modèles souhaités. Nous vous recommandons les dimensions 10 × 15 cm. Ainsi, les impressions seront adaptées à la plupart des carte de vœux du commerce. Ensuite, collez le modèle imprimé dans ou sur la carte dans laquelle vous inscrirez le code du bon d’achat et un texte personnel. Vous trouverez nos modèles ci-dessous. Téléchargez simplement les images sur votre disque dur ou votre clé USB. Petit guide des cadeaux Nous recommandons d’offrir nos bons d’achat aux personnes qui possèdent déjà une adresse e-mail chez Posteo : celles-ci se réjouiront à coup sûr de votre bon d’achat, et le considèreront comme un cadeau utile. Si vous souhaitez en offrir un à une personne qui n’a pas encore de boîte mail chez nous, veuillez tout d’abord vous enquérir si un bon d’achat Posteo est un cadeau souhaité par cette personne. Avec un bon d’achat, une nouvelle boîte mail peut également être créée : cependant, cela coûtera alors 1 € par mois à partir du moment où le crédit offert sera épuisé. Par conséquent, il faut offrir ce cadeau avec un tout petit peu de prudence. Utiliser des bons d’achat pour créditer des boîtes mail D’ailleurs, les bons d’achats ne sont pas réservés aux cadeaux à l’occasion d’anniversaires ou de fêtes. Grâce à eux, vous pouvez également recharger le crédit de membres de votre famille, par exemple de vos enfants ou de votre partenaire. Vous trouverez dans notre rubrique d’aide des instructions pour générer et faire valoir vos bons d’achat : https://posteo.de/fr/aide/comment-generer-un-bon-d-achat https://posteo.de/fr/aide/comment-faire-valoir-un-bon-d-achat Bien cordialement et bonnes fêtes à vous, votre équipe Posteo Bon d’achat à télécharger Bon d’achat à télécharger Bon d’achat à télécharger Bon d’achat à télécharger Bon d’achat à télécharger Bon d’achat à télécharger Bon d’achat à télécharger Bon d’achat à télécharger Bon d’achat à télécharger Bon d’achat à télécharger Bon d’achat à télécharger Bon d’achat à télécharger"
