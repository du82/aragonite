title = "E-Mail grün, sicher, einfach und werbefrei - posteo.de - Neues Sicherheitszertifikat"
description = "Posteo ist ein innvovativer E-Mail-Anbieter, der auf Nachhaltigkeit und Datenschutz setzt und komplett Werbefrei ist. Unsere E-Mail-Postfächer, Kalender und Adressbücher sind synchronisierbar - wir setzen auf umfassende Verschlüsselung."
full_description = "Neues Sicherheitszertifikat Erstellt am 17.Februar 2025, 20:00 Uhr | Kategorie: Info Liebe Posteo-Kundinnen, Liebe Posteo-Kunden, wir aktualisieren unser Haupt-Sicherheitszertifikat. Sicherheitszertifikate haben eine zeitlich begrenzte Gültigkeit und müssen hin und wieder erneuert werden. In den meisten Fällen werden Sie davon nichts mitbekommen. Alle aktuellen Programme wie Thunderbird oder Outlook finden das neue Zertifikat automatisch. Sie müssen nichts tun. Sollte Ihr Programm während des Umstellungsprozesses dennoch einen Zertifikatefehler melden, starten Sie Ihr Programm bitte einmal neu – dies sollte den Fehler beheben. Wenn Sie das Vertrauen des Zertifikats durch einen manuellen Abgleich regeln, finden Sie unten den Fingerprint des neuen Haupt-Zertifikats. Die vollständigen Fingerprints aller Zertifikate finden Sie auch in unserem Impressum. Neue Fingerprints des TLS-Sicherheitszertifikats für posteo.de: Geotrust: SHA256: 64:59:9B:20:CD:28:CE:58:6A:C4:3C:F5:E8:84:AD:9D:28:8A:29:CB:44:AF:D4:79:EB:C2:47:8B:D6:86:C6:05 SHA1: 72:7C:16:4D:38:1E:44:C2:BB:A7:56:98:E3:27:9B:B4:3E:CE:65:B9 Viele Grüße Ihr Posteo-Team"
