["https://posteo.de/fr/site/qui_soutenons_nous"]
title = "E-mail vert, sûr, simple et sans pub - posteo.de - Qui soutenons-nous ?"
description = "Posteo est un fournisseur de messagerie innovant misant sur la durabilité et la protection de la vie privée. Il fonctionne entièrement sans publicité. Nos boîtes mail, calendriers et carnets d'adresse peuvent être syncrhonisés: nous utilisons un concept de chiffrement global."
full_description = "Notre engagement par le don Les dons effectués par Posteo en 2023 Les dons effectués par Posteo, au total : 70 500,00 EUR dont des dons volontaires par l'entreprise Posteo : 70 065,20 EUR dont des dons résultant de résiliations (crédit restant) : 434,80 EUR Pour nous, il est très important de soutenir l'engagement dans la société et de prendre nos responsabilités en tant qu'entreprise. C'est pourquoi nous faisons des dons à des organisations sélectionnées dans les domaines de la protection de l'environnement et du climat, de la politique des réseaux et de la liberté d'expression, du renforcement de la démocratie, ainsi que de l'aide aux réfugiés et de l'aide humanitaire d'urgence. Sur cette page, nous vous présentons les organisations auxquelles nous avons donné l'année dernière (actuellement 2023). Au total, en 2023, nos dons se sont élevés à 70 500 EUR. L'année précédente, ils s'élevaient à 69 500 EUR, en 2021 à 59 500 EUR, en 2020 à 58 600 EUR, en 2019 à 44 500 EUR et en 2018 à 40 600 EUR. Ces dons se composent d'une part de dons volontairement effectués par Posteo, d'autre part du crédit restant de boîtes mail résiliées que les propriétaires souhaitaient donner à Posteo. Les organisations que nous soutenons Posteo a donné aux organisations suivantes en 2023 : Médecins Sans Frontières a été fondée en France en 1971. En 1993, la section allemande a rejoint l'organisation. MSF (Médecins Sans Frontières) est aujourd'hui un réseau international qui fournit une aide médicale d'urgence dans plus de 70 pays. En tant qu'organisation médicale humanitaire, Médecins Sans Frontières s'engage à fournir des soins de santé de qualité et efficaces dans les pays où la survie des populations est menacée par les maladies, les guerres et les catastrophes. UNO-Flüchtlingshilfe est la branche allemande de l'Agence des Nations Unies pour les réfugiés (UNHCR). Elle garantit la survie des personnes en fuite en situation de crise aiguë par le biais d'une aide humanitaire d'urgence. Ainsi, l'UNO-Flüchtlingshilfe se charge par exemple de fournir suffisamment d'eau, de nourriture et de médicaments dans les camps de réfugiés ou dans les régions difficiles d'accès. Reporters sans frontières s'engage mondialement pour la liberté de la presse et de l'information. Cette organisation documente les atteintes à la liberté de la presse et soutient les journalistes en danger. Reporters Sans Frontières se bat contre la censure et les lois restreignant le liberté des médias. L'UNICEF est l'agence des Nations unies pour la protection des droits des enfants. L'organisation s'engage depuis 1946 dans 190 pays pour la santé, l'éducation et les droits des enfants et des mères. L'UNICEF s'engage politiquement contre l'utilisation d'enfants soldats et pour la protection des réfugiés et l'application des conventions pour les droits des enfants. Posteo soutient le projet Living Schools au Malawi : là-bas, des écoles s'appuyant sur les principes de la conscience environnementale, de l'enseignement numérique et de la cogestion sont construites. Les écoles possèdent leur propre système d'alimentation en eau pour l'eau potable et l'hygiène, utilisent le soleil pour leur production d'énergie et enseignent la protection de l'environnement dans leur jardin. De plus, Posteo soutient l'aide hivernale pour les enfants en zone de crise. Lors des crises humanitaires, les enfants sont souvent livrés sans protection aux conditions climatiques. L'UNICEF apporte son soutien dans le monde entier dans ce genre de situation d'urgence. L'objectif de la fondation Amadeu Antonio, fondée en 1988, est de renforcer une société civile démocratique qui s'oppose systèmatiquement à l'extrême-droite, au racisme et à l'antisémitisme. Pour cela, la fondation soutient des initiatives et des projets qui s'engagent sans cesse pour une culture démocratique et la protection des minorités. Depuis 2003, la fondation Amadeu Antonio mène chaque année des semaines d'action contre l'antisémitisme et conseille des professionnels de l'enfance et de la jeunesse. De plus, la fondation informe sur les mythes complotistes et leur lien avec des modèles d'explication du monde antisémites. Le don de Posteo est utilisé pour des projets qui s'engagent contre l'antisémitisme et les idéologies complotistes. netzpolitik.org est une plate-forme journalistique pour les libertés numériques et définit les débats et évolutions politiques importants autour d'Internet. Cette plate-forme documente la façon dont la politique influe sur Internet et la société par le biais de la régulation et de l'introduction continuelle de lois relatives à la surveillance. Netzpolitik.org souhaite inciter les citoyens à s'engager pour leurs libertés numériques et pour une société ouverte. Le Centre Européen pour les Droits Constitutionnels et de l'Homme (ECCHR) s'engage pour les droits de l'Homme par le biais juridique. L'objectif des avocats du ECCHR est d'engager des procédures judiciaires contre des acteurs étatiques et non-étatiques pour des atteintes graves aux droits de l'homme. (Soutenu jusqu'au printemps 2024) Au cours des années précédentes, Posteo a également fait des dons aux organisations suivantes: BUND - Friends of the Earth Germany Croix-Rouge allemande (DRK) - Projet climat au Pérou Gesellschaft für Freiheitsrechte En plus de ces dons, Posteo a sponsorisé : L'académie taz invite chaque année 20 journalistes en herbe et activistes à Berlin pour produire avec eux un supplément pour le journal berlinois Tageszeitung. En 2019, le thème choisi était : « Sauver le climat ? Bien sûr, mais comment ? ». Posteo a parrainé l'atelier sur le climat. Reporter sans frontières – Prix pour la liberté de la presse Le Prix Reporters sans frontières (RSF) pour la liberté de la presse rend hommage à des journalistes femmes et hommes exceptionnellement courageux et indépendants qui ne veulent pas se taire, malgré des conditions particulièrement défavorables et les menaces dirigées contre leur intégrité physique ou leur vie. Posteo offrait cette année la dotation de la catégorie « Courage »."
