full_description = 'Kostenfreier Support Liebe Posteo-Kunden, wenn Sie Hilfe benötigen oder Fragen haben, können Sie uns gerne eine E-Mail an support@posteo.de schreiben oder unser Kontaktformular benutzen. Telefonischen Support bieten wir nicht an. Wir versuchen, alle eingehenden Fragen innerhalb eines Werktages zu beantworten. Wir bieten Support in deutscher, englischer und französischer Sprache. Unsere Bürozeiten sind werktags von 08 bis 20 Uhr. Werfen Sie doch auch einen Blick in unsere Hilfe: Dort erklären wir die wichtigsten Funktionen unseres E-Maildienstes. Wir bieten auch Antworten auf häufig gestellte Fragen von Interessenten an. Sie haben Ihr Passwort vergessen? Sie können es selbst zurücksetzen, wenn Sie die "Passwort vergessen"-Funktion aktiviert haben. Wir bieten auch Hilfestellung, wie Sie ein vergessenes Passwort eventuell aus Ihrem Computer auslesen können. Für Interessenten: Wenn Sie uns vorab Fragen verschlüsselt mailen möchten, können Sie hierfür unseren öffentlichen S/MIME oder PGP Schlüssel benutzen. Presse Bitte kontaktieren Sie uns unter presse@posteo.de. Ihre Ansprechpartnerin: Frau Sabrina Löhr Logos: Weblogo, Logo für Print, Logo für Print ohne Claim Weitere Materialien stellen wir auf Anfrage gerne zur Verfügung. Posteo Abuse-Team Sie möchten uns über missbräuchliche Nutzung (z.B. Phishing, Spam oder Hassrede) informieren, die von einem Posteo-Postfach ausgeht? Wenden Sie sich bitte an abuse@posteo.de. Leiten Sie die betreffende E-Mail bitte im Original an uns weiter, wenn Sie das für angebracht halten. (Public S/MIME und PGP Key) Wenn Sie eine missbräuchliche Nutzung melden möchten, die von E-Mail-Adressen anderer Anbieter ausgeht, finden Sie unter Abuse.net die jeweiligen Kontakt-Adressen. Kontaktformular Hier können Sie uns eine Nachricht schicken. E-Mail Betreff Nachricht Hinweis: Bei Passwortverlust geben Sie bitte auch eine alternative E-Mail-Adresse an. Gut zu wissen Daten, die Sie uns in Ihrer Anfrage freiwillig per E-Mail zusenden, werden nicht als Information zu Ihrem Posteo-Postfach gespeichert. Wir erheben keine IP-Adressen, wenn Sie unser Kontaktformular nutzen. Unser Kundendienst arbeitet aus Datenschutzgründen ohne Kundendatenbank und Ticketsystem. Es wird keine Dokumentation zu Ihren Anfragen an unseren Kundendienst erstellt. Unser Team beantwortet Ihre Anfrage per E-Mail. Hierfür setzen wir ausschliesslich Open Source-E-Mail-Programme auf verschlüsselten Geräten ein. Jegliche E-Mail-Kommunikation mit Ihnen wird 14 Tage nach Erledigung des Falles automatisiert und vollständig bei uns gelöscht. Anzeige von Lösungsvorschlägen: Geben Sie Text in unser Kontaktformular ein, bleibt er bis zum Absenden lokal auf Ihrem Gerät. Posteo steht für echtes "Privacy by Design": Ggf. angezeigte Lösungsvorschläge werden lokal in Ihrem Browser vorgehalten und beim Eintippen von Schlagworten angezeigt. Während Sie tippen, werden keine Daten durch das Internet an Posteo übertragen, um sie dort mit einer Schlagwort-Datenbank abzugleichen. Mehr hierzu finden Sie in unserer Datenschutzerklärung.'
year_published = 2025
