title = "Email green, secure, simple and ad-free - posteo.de - Blog"
description = "Posteo is an innovative email provider that is concerned with sustainability and privacy and is completely ad-free. Our email accounts, calendars and address books can be synchronised - we use comprehensive encryption."
full_description = "New security certificate Created on 17. February 2025, 20:00 | Category: Info Dear Posteo customers, We are updating our main security certificate. Security certificates are only valid for a specified time period and need to be renewed from time to time. In most cases, you will not notice any change. All current clients like Thunderbird or Outlook will automatically find the new certificate. You do not need to do anything. However, should your client display a certificate error during this changeover process, please restart your client. This should fix the error. #more# If you manage the trustworthiness of certificates manually, you can find the fingerprint for the new main certificate below. You can also find complete fingerprints for all certificates in our legal notice. New fingerprint for the TLS security certificate for posteo.de: Geotrust: SHA256: 64:59:9B:20:CD:28:CE:58:6A:C4:3C:F5:E8:84:AD:9D:28:8A:29:CB:44:AF:D4:79:EB:C2:47:8B:D6:86:C6:05 SHA1: 72:7C:16:4D:38:1E:44:C2:BB:A7:56:98:E3:27:9B:B4:3E:CE:65:B9 Best regards, The Posteo Team Gifting Posteo vouchers Created on 06. December 2024, 12:40 | Category: Blog Dear Posteo customers, Are you looking to gift a small present to a person who has an email address at Posteo? You can make others happy with our vouchers. #more# Vouchers as a present In just a few clicks, you can generate a voucher in your email account settings. It can then be sent via email to other Posteo accounts. If you’d like, you can add a personal message to the email. You can also write down the voucher code in a gift card that you can personalise. If you would like a gift card with a Posteo design, you can also use our templates which can be found at the bottom of this blog post. These templates can be printed using a photo printer or a photo station at a retail store and then glued into a greeting card. If you would like to print at such photo stations, save the images on a USB stick. You can then print out the desired template using the stick. We recommend using the size 10 × 15 cm (4 × 6 inches). This allows your printout to fit in most standard greeting cards. Paste your printed template inside or on the front of the card where you will write the voucher code and a personalised text. You can find our templates below. Simply download the desired images on your hard drive or your USB stick. Some tips for gifting vouchers We recommend gifting our vouchers to people who already have an email address at Posteo. They will surely be happy to receive a voucher – and will also see it as a practical gift. If you want to gift a voucher to a person who does not yet have an account with Posteo, first ask them if a Posteo voucher is a desired gift. A new email account can also be opened using a gift voucher. However, once the gifted credit has run out, it will then cost 1 EUR per month. Therefore, you should consider this aspect with a bit of sensitivity. Using vouchers for adding credit to email accounts By the way, vouchers are not only suitable as birthday and holiday gifts. You can also use vouchers to add more credit for family members like children or your partner. You can find instructions for generating and redeeming vouchers in our help section: https://posteo.de/en/help/how-do-i-purchase-a-posteo-gift-voucher https://posteo.de/en/help/how-do-i-use-a-posteo-voucher-code Best regards and happy holidays! Your Posteo Team Download a voucher Download a voucher Download a voucher Download a voucher Download a voucher Download a voucher Download a voucher Download a voucher Download a voucher Download a voucher Download a voucher Download a voucher"
