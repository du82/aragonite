["https://posteo.de/en/news/lax-response-from-dating-apps-to-reports-of-violence"]
title = "Email green, secure, simple and ad-free - posteo.de - Lax response from dating apps to reports of violence"
description = "Posteo is an innovative email provider that is concerned with sustainability and privacy and is completely ad-free. Our email accounts, calendars and address books can be synchronised - we use comprehensive encryption."
full_description = "Julius Stiebert 19.02.2025 Lax response from dating apps to reports of violence The dating-app conglomerate Match Group fails to respond effectively to reports of assault, according to a recent investigation. The company has reportedly known about instances of abuse for years. Match Group owns some of the largest dating platforms, including Tinder. (Source: Imago / imagebroker) The dating-app conglomerate Match Group does not do enough to guarantee the safety of its users. A joint investigation conducted by several media outlets shows the extent of the problem. Even if users are flagged for assaulting others on dates, they are often able to keep their accounts. Even users whose accounts are blocked are usually able to sign up for a new account using their same profile information. The US-based Match Group corporation owns some of the most prominent dating apps, including Tinder, OKCupid, Hinge and Plenty of Fish. The Dating Apps Reporting Project, a collaboration between the Markup, the Guardian, and other outlets, spent eighteen months investigating how the platforms handle cases of abuse. Over the course of their reporting, journalists for the project reviewed internal documents and spoke with current and former employees as well as victims of sexual violence – they also carried out their own tests. Match Group promises to block the accounts of users who are reported to have committed abuse or assault; the ban is supposed to extend across the company’s platforms. But this latest investigation shows that in practice the company does little to curtail problematic users’ access – even though, based on internal documents, Match Group has had knowledge of cases of abuse since at least 2016. Since 2019 the company has maintained a central database that collects reports of this kind. The database saves data affiliated with the flagged accounts, including phone numbers, email addresses and profile photos. Nevertheless, users whose accounts are blocked seem to have little difficulty in getting back on the platforms. In separate trials in 2024 and again in 2025, reporters created more than 50 accounts across Match Group’s platforms. They then reported these accounts for sexual assault on dates – and found that within two days, the accounts were blocked. After being banned, however, the investigators were able to sign up again using the same names, phone numbers, dates of birth, and even the same profile photos affiliated with the original accounts. Continued access for those accused of assault In the past, reports of abuse from female users have not always led to the accused individual having their account blocked. This is evident from a particularly egregious case chronicled by the Dating Apps Reporting Project. Several women had reported a doctor in Denver, Colorado to the app Hinge, accusing him of rape. The first report was received in September 2020 – and yet in January 2023 he was still active on Hinge. That month he attempted to rape yet another woman whom he had met on the app. At one point, in 2022, his profile had even been highlighted on the platform. His account was only blocked after he was arrested. In October 2024, the man was sentenced to more than a hundred years in prison. He had been convicted of sexually assaulting, drugging or assaulting a total of eleven women. According to the Dating Apps Reporting Project, at least 15 women would eventually accuse the man of raping or drugging them. Nearly all had met him on a dating app. Attorneys for the women argued that most of the assaults could have been prevented. One lawyer told reporters, “It is shocking that for years after receiving reports of sexual assault, Hinge continued to allow” the perpetrator to use the platform. She accuses the platform of having “actively facilitated his abuse.” Reporters for the Dating Apps Reporting Project write that the case shows how Match Group’s apps enable perpetrators to find new victims. They point to a study conducted by Brigham Young University that analyzed hundreds of sexual assaults in the state of Utah. The study found that “attacks facilitated by dating apps happened faster and were more violent than when the perpetrator met the victim through other means.” No transparency According to the Dating Apps Reporting Project’s investigation, in 2020 Match Group promised to publish a transparency report – “a public document that would reveal data on harm occurring on and off its platforms.” To date no such report has been released. As the reporters argue, “Match Group has long possessed the tools, financial resources and investigative procedures” necessary to ratchet up its security measures. But instead, the company has failed to use its own tools consistently across its apps – “in part because safety protocols could stall corporate growth.” In a statement released in response to the investigation, the company pointed to various measures it was undertaking, including the use of “harassment-preventing AI tools” – no further indication was given as to how these tools might function – and efforts to cooperate with law enforcement. The investigation points out however that while Match Group has promised publicly for years to improve security on its platforms, insiders claim that no such measures have been instituted. The company has even fired members of its own security team. These employees’ tasks have reportedly been outsourced to contractors who receive little training and are subject to “severe quotas.” The case of the doctor in Colorado has since had political consequences: last summer, a law was passed in the state. The Online Dating Safety Act requires dating-app companies “to tell the state attorney general which safety measures they are taking to protect users.” Nevertheless, the law does not require any company to disclose “how many people are raped or assaulted after using its platform.” (js)"
