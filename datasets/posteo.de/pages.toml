["https://posteo.de/blog/11"]
title = "E-Mail grün, sicher, einfach und werbefrei - posteo.de - Blog"
description = "Posteo ist ein innvovativer E-Mail-Anbieter, der auf Nachhaltigkeit und Datenschutz setzt und komplett Werbefrei ist. Unsere E-Mail-Postfächer, Kalender und Adressbücher sind synchronisierbar - wir setzen auf umfassende Verschlüsselung."
full_description = "Jetzt anmelden zum Girls'Day am 3. April Erstellt am 07. Januar 2025, 17:30 Uhr | Kategorie: Blog Am 3. April 2025 ist wieder Girls’Day: Auch wir sind in diesem Jahr mit dabei – und interessierte Schülerinnen können sich ab sofort anmelden. #more# Der Girls’Day ist ein bundesweiter Aktionstag zur Berufsorientierung, an dem Mädchen ab der 5. Klasse Einblick in Berufe nehmen können, die immer noch vorwiegend von Männern gewählt werden. So auch der vielseitige und spannende Beruf der Software-Entwicklerin: Der Frauenanteil im Studiengang Informatik liegt in Deutschland seit Jahren bei nur etwa einem Viertel. Wir geben 10 Schülerinnen die Möglichkeit, einen Ausflug in die Welt des Codens zu machen und sich mit Posteo-Mitarbeiterinnen auszutauschen. Bei uns ist das Verhältnis zwischen Männern und Frauen in der Entwicklung ausgewogen. Viele Posteo-Funktionen wurden von Frauen programmiert; wie etwa der Posteo-Umzugsservice, unsere mobile Benutzeroberfläche, der Anhangs-Browser mit Foto-Stream oder der Dark Mode im Posteo-Webmailer. Am Girls’Day werden zwei unserer Mitarbeiterinnen aus der Software-Entwicklung erzählen, warum sie sich für ihren Studiengang entschieden haben, welche Inhalte im Informatikstudium zu erwarten sind, wie das Studieren mit so vielen männlichen Kommilitonen und Professoren war – und wie es danach beruflich für sie weiterging. Sie beantworten Fragen der Mädchen rund um die Berufswahl, und sprechen mit ihnen über die vielen Vorteile, die der Beruf aus ihrer Sicht mit sich bringt. Die Schülerinnen lernen auch die E-Mail-Welt näher kennen: Wir zeigen ihnen, wie es funktioniert, dass so viele Rechner weltweit miteinander kommunizieren und über Protokolle Informationen austauschen. Das werden die Mädchen auch selbst ausprobieren können – und mit einem E-Mail-Server chatten. Unsere Mitarbeiterinnen werden ihnen außerdem zeigen, woran sie bei Posteo gerade arbeiten. Die Veranstaltung findet in unserem Posteo-Lab in Berlin statt. Anmelden können sich Schülerinnen, die 12 Jahre oder älter sind und wissen wollen, wie es ist als Software-Entwicklerin zu arbeiten. Vorkenntnisse sind nicht notwendig. Die Verpflegung ist inklusive: Es gibt Getränke und Obst und wir werden mittags vegetarische und vegane Snacks anbieten. Mehr Informationen und die Möglichkeit zur Anmeldung zu unserem Angebot finden Interessierte auf der Website des Girls’Day. In unserem Blog haben wir über den Girls’Day 2024 bei Posteo berichtet."
year_published = 2025
