title = "E-mail vert, sûr, simple et sans pub - posteo.de -"
description = "Posteo est un fournisseur de messagerie innovant misant sur la durabilité et la protection de la vie privée. Il fonctionne entièrement sans publicité. Nos boîtes mail, calendriers et carnets d'adresse peuvent être syncrhonisés: nous utilisons un concept de chiffrement global."
full_description = "Service client gratuit Chers clients Posteo, si vous avez besoin d'aide ou si vous avez des questions, n'hésitez pas à nous écrire un e-mail à support@posteo.de ou à utiliser notre formulaire de contact. Nous ne proposons pas de service client par téléphone. Nous tentons de répondre à toutes les questions que nous recevons en l'espace d'un jour ouvré. Nous proposons une assistance en français, anglais et allemand. Nous sommes ouverts du lundi au vendredi de 08h à 20h. En cas d'urgence (par exemple si vous oubliez votre mot de passe), nous nous efforçons de vous répondre en-dehors de ces horaires. Vous pouvez également jeter un coup d'œil dans notre rubrique aide: Nous y présentons les fonctions essentielles de notre service de messagerie. Nous répondons également aux questions fréquentes des personnes intéressées. Vous avez oublié votre mot de passe ? Vous pouvez le réinitialiser vous-mêmes si vous avez activé la fonction « Mot de passe oublié ». Nous vous proposons aussi un article d'aide vous expliquant comment retrouver un mot de passe oublié dans votre ordinateur. Pour les personnes pas inscrites sur Posteo qui souhaitent tout de même nous envoyer une question de façon cryptée : vous pouvez utiliser notre clé publique S/MIME ou PGP. Presse Merci de nous contacter à l'adresse presse@posteo.de. Contact : Sabrina Löhr Logos : Logo en version web, logo en version print, logo en version print sans slogan Nous pouvons vous mettre à disposition d'autres supports de communication sur demande. Équipe « anti-abuse » Posteo Vous souhaitez nous signaler une utilisation frauduleuse de votre compte (par exemple und cas de phishing, un spam ou un discours de haine) provenant d'une boîte mail Posteo ? Dans ce cas, contactez-nous à l'adresse abuse@posteo.de. Transférez-nous l'original de l'e-mail concerné si vous pensez que c'est indiqué. (Clé publique S/MIME et PGP) Si vous voulez signaler une fraude provenant d'autres fournisseurs de messagerie, vous trouverez sur Abuse.net (anglais) les adresses des interlocuteurs à contacter. Formulaire de contact Vous pouvez nous envoyer un message ici. E-mail Objet Message Remarque : en cas de perte de votre mot de passe, veuillez nous indiquer également un adresse e-mail alternative."
