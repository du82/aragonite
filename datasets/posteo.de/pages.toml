["https://posteo.de/en/news/utah-bill-would-require-police-to-disclose-use-of-ai-in-police-reports"]
title = "Email green, secure, simple and ad-free - posteo.de - Utah: Bill would require police to disclose use of AI in police reports"
description = "Posteo is an innovative email provider that is concerned with sustainability and privacy and is completely ad-free. Our email accounts, calendars and address books can be synchronised - we use comprehensive encryption."
full_description = "Julius Stiebert 26.02.2025 Utah: Bill would require police to disclose use of AI in police reports Draft legislation in Utah would require police to review reports that were written by so-called AI. Several police departments in the US already use software that purports to generate reports based on bodycam footage. (Source: IMAGO / Imagn Images) Police officers in the US state of Utah could be required in the future to disclose the use of so-called artificial intelligence (AI) in the writing of their incident reports. A bill mandating transparency is currently up for debate in the state legislature. Experts hope that other states follow suit. The bill, S.B. 180, would require that any police report produced by so-called AI be reviewed by a person. Such reports would also have to include a disclaimer saying that they were created, in part or in whole, using AI tools. The law would also require law enforcement agencies to develop guidelines that would, for example, list which AI programs officers were permitted to use. The bill was proposed by Democratic State Senator Stephanie Pitcher. A lawyer and former prosecutor, Senator Pitcher told local media that “We’re seeing more of a reliance on artificial intelligence” by law enforcement agencies. The bill she proposes would create minimum standards for use of the technology. Said Pitcher, “Using AI to generate police reports – or just in the investigation process – presents a number of really interesting issues, I think, where some guardrails are appropriate.” The bill calls for potential disciplinary action to be taken against officers who violate the new guidelines – but doesn’t detail specific punitive measures. “A necessary step” The Electronic Frontier Foundation (EFF), a civil liberties group, said of the bill that it is “unfortunately a necessary step.” The group hopes the bill “will be part of a larger conversation about more robust regulations,” but warns that “it’s going to take more than a disclaimer to curb the potential harms of AI-generated police reports.” The software Draft One in particular has come in for criticism in the past year. It is developed by Axon, a prominent supplier of police equipment, including Tasers and bodycams. Draft One uses the audio from footage taken by an officer’s body-worn camera to generate a police report. The company markets the technology as a time-saving tool that helps reduces the amount of time officers spend typing up reports. Police departments in several states are reportedly testing the software, or are already using it – including in Utah. Similar products made by other companies are also on the market. Last year, shortly after Draft One was first introduced, the EFF warned that algorithms often have trouble reliably deciphering speech, given “the wide range of languages, dialects, vernacular, idioms and slang people use.” As a result, the technology could make mistakes in transcribing what people said. Accounts produced by the software could also vary, depending on how it interpreted what was said: if for example an officer in a video is recorded saying “the suspect has a gun,” that doesn’t necessarily mean that the suspect was in fact armed. But in a report that is automatically produced by software, the officer’s claim could be presented as fact – which could have severe consequences for defendants at trial. The EFF also warned that if officers were caught lying in their reports, they could deflect blame by claiming that the software had made a mistake. Central role in prosecutions The American Civil Liberties Union (ACLU) in December published a white paper registering concerns about the use of AI. Police reports, the organization notes, play a “crucial role” in the justice system. “They are central to the criminal proceedings that determine people’s innocence, guilt, and punishment, and are often the only official account of what took place during a particular incident.” Given their importance, law enforcement officers shouldn’t let algorithms write their reports for them. The ACLU criticizes for example the fact that bodycam footage forms the basis for the reports. Video evidence, the organization notes, isn’t objective – factors like camera angle and the point in time when the camera begins recording influence how a situation is depicted. How police officers remember an incident is another important basis for police reports – but a person’s recollections can easily change. For that reason it’s important, the ACLU argues, for officers to write down what they remember before they look at video footage or view a report that was generated from that footage. Furthermore the ACLU criticizes the lack of transparency surrounding how Draft One actually functions. This “threatens to become a significant legal issue when people are charged with crimes.” Still going through the legislative process The Utah State Senate passed the bill last week. Currently it is being debated in the state House of Representatives. If passed by the House, Republican Governor Spencer Cox will have to sign the bill before it becomes law. The EFF reports that in King County in Washington state, which includes Seattle, police have been instructed not to use these new technologies to write their reports – for now. (js)"
