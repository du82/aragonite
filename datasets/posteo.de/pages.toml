["https://posteo.de/site/wirunterstuetzen"]
title = "E-Mail grün, sicher, einfach und werbefrei - posteo.de - Wen wir unterstützen"
description = "Posteo ist ein innvovativer E-Mail-Anbieter, der auf Nachhaltigkeit und Datenschutz setzt und komplett Werbefrei ist. Unsere E-Mail-Postfächer, Kalender und Adressbücher sind synchronisierbar - wir setzen auf umfassende Verschlüsselung."
full_description = "Spenden-Engagement Spenden durch Posteo 2023 Spenden durch Posteo, insgesamt: 70.500,00 EUR davon freiwillige Spenden durch das Unternehmen Posteo: 70.065,20 EUR davon Spenden aus Kündigungen (Restguthaben): 434,80 EUR Uns ist es wichtig, gesellschaftliches Engagement zu fördern und als Unternehmen Verantwortung zu übernehmen. Deshalb unterstützen wir ausgewählte Organisationen aus den Bereichen des Klima- und Umweltschutzes, der Netzpolitik, Meinungsfreiheit, Demokratiestärkung und Menschenrechte sowie aus der Flüchtlingshilfe. Auf dieser Seite legen wir offen, an welche Organisationen wir im jeweils vergangenen Jahr (aktuell 2023) gespendet haben. Insgesamt beliefen sich unsere Spenden im Jahr 2023 auf: 70.500 EUR. Im Vorjahr waren es noch 69.500 EUR, 2021 waren es 59.500 EUR, 2020 waren es 58.600 EUR, 2019 waren es 44.500 EUR und 2018 waren es 40.600 EUR. Die Spenden setzen sich zusammen aus freiwilligen Spenden durch Posteo sowie aus dem Restguthaben gekündigter Posteo-Postfächer, deren Besitzerinnen und Besitzer ihr verbliebenes Guthaben spenden wollten. Unterstützte Organisationen Posteo hat im Jahr 2023 an folgende Organisationen gespendet: Ärzte ohne Grenzen wurde 1971 in Frankreich gegründet. 1993 kam die deutsche Sektion hinzu. MSF (Médicins Sans Frontières) ist heute ein internationales Netzwerk, das in über 70 Ländern medizinische Nothilfe leistet. Als humanitäre medizinische Organisation setzt sich Ärzte ohne Grenzen für eine qualitativ hochwertige und effiziente Gesundheitsversorgung in Ländern ein, in denen das Überleben von Menschen durch Krankheiten, Kriege und Katastrophen in Gefahr ist. Die UNO-Flüchtlingshilfe ist der deutsche Ableger des Flüchtlingshilfswerks der Vereinten Nationen (UNHCR). Sie sichert das Überleben geflüchteter Menschen in akuten Krisensituationen mit lebensrettenden Nothilfemaßnahmen. So sorgt die UNO-Flüchtlingshilfe beispielsweise für eine ausreichende Versorgung mit Wasser, Lebensmitteln und Medikamenten in Flüchtlingscamps oder in schwer zugänglichen Regionen. Reporter ohne Grenzen setzt sich weltweit für die Presse- und Informationsfreiheit ein. Die Organisation dokumentiert Verstöße gegen die Pressefreiheit und unterstützt Journalisten, die in Gefahr sind. Reporter ohne Grenzen kämpft gegen Zensur und restriktive Mediengesetze. UNICEF ist das Kinderhilfswerk der Vereinten Nationen. Die Organisation setzt sich seit 1946 in 190 Staaten für die Gesundheit, Bildung und Rechte von Kindern und Müttern ein. Politisch engagiert sich UNICEF gegen den Einsatz von Kindersoldaten und für den Schutz von Flüchtlingen und die Umsetzung der Kinderrechtskonventionen. Posteo unterstützt das Projekt Living Schools in Malawi: Dort werden Schulen gebaut, die auf den Prinzipien Umweltbewusstsein, E-Learning und Mitbestimmung basieren. Die Schulen haben ein eigenes Wassersystem für sauberes Trinkwasser und Hygiene, nutzen die Sonne zur Energiegewinnung und lehren in einem Schulgarten den Umweltschutz. Außerdem unterstützt Posteo die Winterhilfe für Kinder in Krisengebieten. Während humanitären Krisen sind Kinder den Wetterbedingungen oft schutzlos ausgeliefert. Die UNICEF leistet weltweit Hilfe in solchen Notsituationen. Das Ziel der 1998 gegründeten Amadeu Antonio Stiftung ist es, eine demokratische Zivilgesellschaft zu stärken, die sich konsequent gegen Rechtsextremismus, Rassismus und Antisemitismus wendet. Dafür unterstützt die Stiftung Initiativen und Projekte, die kontinuierlich für eine demokratische Kultur und für den Schutz von Minderheiten eintreten. Seit 2003 führt die Amadeu Antonio Stiftung jedes Jahr Aktionswochen gegen Antisemitismus durch und berät Fachkräfte in der Kinder- und Jugendarbeit. Zudem klärt die Stiftung über Verschwörungsmythen und ihren Zusammenhang mit antisemitischen Welterklärungsmodellen auf. Die Spende von Posteo wird für Projekte verwendet, die sich gegen Antisemitismus und Verschwörungsideologien engagieren. netzpolitik.org ist eine journalistische Plattform für digitale Freiheitsrechte und bildet die wichtigen politischen Debatten und Entwicklungen rund um das Internet ab. Auf der Plattform wird dokumentiert, wie die Politik das Internet und die Gesellschaft durch Regulierung und den kontinuierlichen Ausbau von Überwachungsgesetzen verändert. Netzpolitik.org will mit seiner Arbeit Menschen zum Engagement für ihre digitalen Freiheitsrechte und für eine offene Gesellschaft anregen. Das Europäisches Zentrum für Verfassungs- und Menschenrechte (ECCHR) setzt sich mit juristischen Mitteln für die Menschenrechte ein. Ziel der Anwälte des ECCHR ist es, staatliche und nichtstaatliche Akteure für schwerwiegende Menschenrechtsverletzungen gerichtlich zur Verantwortung zu ziehen. (Unterstützt bis Frühjahr 2024) Posteo hat in Vorjahren auch an folgende Organisationen gespendet: BUND - Friends of the Earth Germany Deutsches Rote Kreuz - Klimaprojekt in Peru Gesellschaft für Freiheitsrechte Posteo war über die Spenden hinaus Sponsor von: Die taz Akademie lädt zweimal im Jahr 20 NachwuchsjournalistInnen und -journalisten und Aktivistinnen und Aktivisten nach Berlin ein, um zusammen einen Beileger für die Tageszeitung zu produzieren. Im Jahr 2019 hieß das Thema „Klima retten? Klar, aber wie?“. Posteo hat den Klima-Workshop als Sponsor unterstützt. Reporter ohne Grenzen - Press Freedom Awards Die Press Freedom Awards von Reporter ohne Grenzen ehren außergewöhnlich mutige und unabhängige Journalistinnen und Journalisten, die trotz widrigster Umstände und Gefahren von Leib und Leben nicht schweigen wollen. Posteo stiftete im Jahr 2019 das Preisgeld in der Kategorie „Courage“."
year_published = 2025
