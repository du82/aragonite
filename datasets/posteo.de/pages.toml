full_description = "Julius Stiebert 12.02.2025 Saudi Arabia: Woman imprisoned for online activity freed A Saudi Arabian woman has been released after spending several years in prison for statements she made online. She had been serving a decades-long sentence. Salma al-Shehab’s sentence was first increased, then reduced several times. (Source: IMAGO / ZUMA Press Wire) Salma al-Shehab has been released from prison in Saudi Arabia. She had been sentenced to 34 years in prison for sharing posts by women’s rights activists on Twitter (now X). In recent years, several cases have come to light of people in Saudi Arabia receiving harsh sentences for expressing opinions online. The human rights organizations ALQST and Amnesty International announced on Monday that the 36-year-old had been released – ending four years of “arbitrary imprisonment,” ALQST wrote. Dana Ahmed of Amnesty International said in a statement that al-Shehab had had to spend nearly 300 days in solitary confinement and was denied legal representation. “All just because she tweeted in support of women’s rights and retweeted Saudi women’s rights activists,” Ahmed said. Prior to her imprisonment, Al-Shehab lived in the UK, where she was a PhD student at the University of Leeds. In January 2021, while on vacation in Saudi Arabia, she was arrested, interrogated, and finally indicted. The reason was her Twitter activity. Advocating for women’s rights Al-Shehab had shared posts by activists on the platform and published posts of her own. Among other things she had supported the call to end the Saudi system of male guardianship over women. In a tweet from 2020 she had called for “Freedom for the inmates of patriarchy.” She had also retweeted posts in support of prominent women’s rights activist Loujain Al-Hathloul, who in 2018 was abducted from the United Arab Emirates, deported to Saudi Arabia and sentenced there in 2020 to nearly six years in prison. Al-Hathloul had advocated for several causes including an end to the ban on women driving in Saudi Arabia. In February 2021 she was released on parole – but is barred from leaving the country. Salma al-Shehab was convicted on the basis of her Twitter activity, but after conviction her sentence was changed several times. First a Saudi court sentenced her to six years in prison. On appeal, however, the prosecution demanded a harsher penalty and her prison term was increased to 34 years. The court also imposed an additional 34-year travel ban. Among other charges, the prosecution accused al-Shehab of “destabiliz[ing] the security of society and the stability of the state.” She was also convicted of “spreading false and malicious rumors on Twitter.” According to the Gulf Centre for Human Rights, she was sentenced under a Saudi anti-terrorism law and a law meant to combat cybercrime. Al-Shehab’s sentence was reportedly one of the longest prison sentences ever imposed in Saudi Arabia for the exercise of the right to free speech. In 2023 a UN working group classified her imprisonment as arbitrary and demanded her release. Another sentence reduction in 2025 In a separate appeal in January 2023, al-Shehab’s sentence was reduced to 27 years. Then, last month, ALQST and other human rights organizations reported that her sentence had been reduced yet again, to four years, with an additional four years suspended. In announcing the reduction, the organizations stated that they expected al-Shehab’s release in the coming days. ALQST now demands that al-Shehab’s freedom to travel be restored so that she can finish her studies in the UK. Dana Ahmed from Amnesty International makes the same demand: “Saudi Arabia’s authorities must now ensure she is not subjected to a travel ban or any further punitive measures.” Saudi Arabia acting to suppress freedom of expression Ahmed added that al-Shehab’s release was “also an opportunity to reflect on the many others serving similarly lengthy sentences in Saudi Arabia for their activities online.” Nourah al-Qahtani, for example, was sentenced to 45 years in prison in 2022 for her activity on Twitter. Al-Qahtani is alleged to have published posts critical of the government using an anonymous account – though how this account was linked to al-Qahtani is unknown. In 2023, in an even more egregious case, Mohammed al-Ghamdi was sentenced to death. In his trial before the Specialized Criminal Court, tweets in which al-Ghamdi voiced criticism of the Saudi royal family and Saudi foreign policy were presented as evidence. Last year the death sentence was commuted to a 30-year prison sentence. Al-Ghamdi’s brother Asaad al-Ghamdi was sentenced last year to 20 years in prison, also for tweets critical of the government. Last year the conviction of Manahel al-Otaibi also came to light. Al-Otaibi had expressed support for women’s rights on social media – and was sentenced to eleven years in prison for alleged “terrorist offenses.” While in prison, she has been subjected to physical and psychological abuse, according to Amnesty International. Human rights organizations have long raised concerns about the Saudi authorities’ efforts to suppress freedom of expression, as well as the country’s practice of convicting defendants in unfair trials. The Specialized Criminal Court, for instance, was ostensibly established for trying terrorism cases – but has condemned several individuals merely for voicing opinions. In recent years, some limits on women’s freedom have been lifted in Saudi Arabia – but according to human rights groups, discrimination against women continues in the country. (js)"
