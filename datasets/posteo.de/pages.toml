["https://posteo.de/en/news/white-house-tightens-control-of-media"]
title = "Email green, secure, simple and ad-free - posteo.de - White House tightens control of media"
description = "Posteo is an innovative email provider that is concerned with sustainability and privacy and is completely ad-free. Our email accounts, calendars and address books can be synchronised - we use comprehensive encryption."
full_description = "Julius Stiebert 27.02.2025 White House tightens control of media The White House wants to reserve for itself the right to decide which journalists cover the president in the Oval Office. It’s the latest action by the new administration against the media. Groups representing journalists expressed sharp criticism of the administration. (Source: IMAGO / NurPhoto) The White House announced on Tuesday that it would decide which media organizations would be represented in the press pool, the group of journalists that covers the president’s daily activities. The move breaks with decades-old precedent – and gives the government more control over media coverage. This is not the first action directed against the media since the new administration took power in January. Before now, the White House Correspondents’ Association (WHCA), an organization with a 111-year history, has decided who is represented in the press pool, selecting journalists on a rotating basis. The members of the pool accompany the president during daily activities and events where space is limited, for example in the Oval Office. They then distribute their reporting to all credentialed media in accordance with a standard procedure. The White House press secretary Karoline Leavitt said the move was intended to modernize the press pool. Alongside legacy media outlets, “new media” would now also be able to participate. These would also include local broadcasters – though many of these are owned by Sinclair Broadcast Group, which is considered to have a rightward slant. In 2018, Sinclair required its affiliate stations to read a promotional message criticizing “fake” news stories in the media – echoing the administration’s rhetoric. The New York Times wrote that the move made it possible for the White House to exert tighter controls on which journalists could observe the activities of President Donald Trump up close and ask him questions. Press groups and individual journalists express criticisms The WHCA criticized the move in strong terms. WHCA president Eugene Daniels wrote in a statement that the White House’s actions “tears at the independence of a free press in the United States. It suggests that the government will choose the journalists who cover the president.” Daniels continued: “In a free country, leaders must not be able to choose their own press corps.” The WHCA was not given advance notice of the change by the White House. A spokesperson for the New York Times said in a statement: “The White House’s move to handpick favored reporters to observe the president – and exclude anyone whose coverage the administration may not like – is an effort to undermine the public’s access to independent, trustworthy information about the most powerful person in America.” Jacqui Heinrich of the Trump-friendly broadcaster Fox News wrote on social media: “This move does not give the power back to the people – it gives power to the White House.” And Peter Baker, chief White House correspondent for the New York Times, wrote, also on social media: “Having served as a Moscow correspondent in the early days of Putin’s reign, this reminds me of how the Kremlin took over its own press pool and made sure that only compliant journalists were given access.” News agency excluded This latest announcement comes after the White House’s move to bar reporters from the Associated Press (AP) from covering the president. The ban is a response to the news agency’s decision not to refer to the body of water known internationally as the Gulf of Mexico by President Trump’s preferred name, the “Gulf of America.” AP reporters were at first denied access to certain events. Starting in mid-February, the agency was permanently barred from the Oval Office and the president’s airplane. The AP is one of the world’s leading news agencies. The dispute has now wound up in court. On Monday a US judge denied the AP’s request that the court immediately reverse the White House’s ban – but also urged the government to reconsider its decision. Another hearing is scheduled for March 20. The AP argues that the ban violates the First Amendment of the US Constitution, which guarantees freedom of speech and of the press. This view is shared by several organizations that advocate for freedom of the press, who demand that the news agency’s access be restored. Groups including the Committee to Protect Journalists (CPJ), Reporters without Borders (RSF), the Freedom of the Press Foundation, PEN America and several chapters of the Society of Professional Journalists (SPJ) published a statement to that effect on Tuesday. “Attacks on press freedom” Last Friday, the SPJ and more than 40 groups representing journalists released a statement in response to the “recent government press attacks.” The statement also called on the administration to restore the AP’s access to White House events – and to “cease punishing news organizations based on their reporting.” In the statement the groups write: “When leaders try to silence reporters through intimidation, legal threats and denial of access, they are not protecting the country; they are protecting themselves from scrutiny. This is how authoritarian regimes operate.” The changes to the press pool and the dispute with the AP are only the most recent examples of the Trump administration’s policy toward the press. Earlier this month for example the administration introduced a “media rotation program” at the Pentagon – under which the rightwing news site Breitbart will take over workspace once used by National Public Radio (NPR). The change also impacts NBC, CNN, the New York Times and the Washington Post. Despite the move the organizations’ journalists will keep their press credentials and will still have access to press briefings. Trump has also directed verbal abuse against the media on several occasions – and not just since his return to office in January. Recently he has called the Pulitzer Prize-winning journalist Eugene Robinson “incompetent” and called for his firing by the Washington Post. When CNN’s long-serving White House correspondent Jim Acosta announced in January that he was leaving the station, Trump called him a “loser.” During his first term in office and during his campaigns, he repeatedly insulted journalists, referring to them as the “enemy of the people” and denouncing critical reporting as a “witch hunt.” The US president has also taken legal action against the media. He has sued the broadcaster CBS as well as the Des Moines Register, a newspaper in Iowa. The paper published a poll during the campaign last year with results that were unfavorable to Trump – it has sought to have the case dismissed. Trump accuses CBS of having manipulated an interview with presidential candidate and former Vice President Kamala Harris in a way that showed her in a better light. Trump is seeking $20 billion in damages. A transcript of the interview published by the broadcaster shows that Trump’s accusation is false. In the past, Trump accused CNN of defamation – the case was dismissed. New leadership at media regulator After assuming office, Trump installed Republican Brendan Carr as head of the Federal Communications Commission (FCC), which regulates broadcast media. Carr reinstated complaints against ABC, CBS and NBC in connection with their election coverage – under the agency’s previous leadership, the complaints had been rejected. Carr also announced investigations into the public media outlets NPR and PBS. On Wednesday Trump also threatened to sue journalists who use anonymous sources. In the 2024 World Press Freedom Index published by RSF, the US is ranked 55th out of 180 countries. The organization recently wrote that the actions of the new president, his administration and his political allies “amount to a monumental assault on freedom of information.” (js)"
year_published = 2025
