["https://posteo.de/en/news/bbc-investigation-ai-chatbots-produce-false-news-summaries"]
title = "Email green, secure, simple and ad-free - posteo.de - BBC investigation: AI chatbots produce false news summaries"
description = "Posteo is an innovative email provider that is concerned with sustainability and privacy and is completely ad-free. Our email accounts, calendars and address books can be synchronised - we use comprehensive encryption."
full_description = "Julius Stiebert 13.02.2025 BBC investigation: AI chatbots produce false news summaries Chatbots frequently provide false information when asked about the news – claiming for example that former prime ministers are still in office. A new investigation by the BBC shows how inaccurate chatbots’ responses can be. Last year the BBC raised concerns with Apple after the company’s software generated an erroneous notification and attributed it to BBC news. (Source: IMAGO / ZUMA Press Wire) The BBC has tested how good so-called chatbots are at answering questions about the news. The result: more than half the time, chatbots’ answers had “significant issues.” The programs had problems distinguishing between facts and opinions, among other concerns. The BBC tested four programs: OpenAI’s ChatGPT, Microsoft’s Copilot, Google’s Gemini, and Perplexity, made by the company of that same name. Each of the four chatbots is powered by so-called artificial intelligence (AI). Users can ask the tools questions in normal conversational language. For its investigation, the BBC’s researchers asked each chatbot 100 questions about the news, instructing them to use the BBC as a source where possible. The broadcaster normally blocks chatbots from accessing its articles – but for the purpose of the investigation these restrictions were temporarily lifted. The chatbots’ answers were analyzed by BBC journalists and rated according to seven criteria – including accuracy, attribution of sources, and the ability to distinguish fact from opinion. The journalists determined that 91 percent of answers contained at least “some issues,” while 51 percent had “significant issues.” The answers gave inaccurate dates or misstated facts. All the responses were included in the analysis, even if the chatbots didn’t use the BBC as a source. Gemini, for example, claimed that Britain’s National Health Service (NHS) advised against vaping or using e-cigarettes for those who want to quit smoking. “In fact,” the BBC wrote in its analysis, “the NHS does recommend vaping as a method to quit smoking.” The BBC article cited by Gemini even stated that the NHS offers free vape kits for adults. Microsoft’s Copilot, meanwhile, gave erroneous information in response to the question of how Gisèle Pelicot found out about the crimes committed against her – even though the BBC article cited by the chatbot as a source contained the correct information. Chatbots take information from old articles All four chatbots were prompted to use the BBC as a source. Nevertheless, the investigation found that the choice of sources used frequently led to mistakes. For example, the programs took information from live pages used during breaking news events that had since gone out of date. This led for example to claims that former British prime minister Rishi Sunak and former Scottish first minister Nicola Sturgeon were still in office. Copilot referred to a BBC live page from 2022 and claimed that Sturgeon had recently launched “a fresh campaign” for a Scottish independence referendum. With the exception of ChatGPT, all the chatbots had problems with quotes, either altering original quotes from BBC articles or using quotes not present in the article they cited. Perplexity gave the wrong date for the death of BBC broadcaster Michael Mosley. The program also claimed that boy band singer Liam Payne died in 2023 – in fact he died in 2024. Confusing fact and opinion The chatbots also had trouble distinguishing between fact and opinion and struggled to handle context, the BBC’s investigation found. In 23 instances, BBC commentators’ opinions were presented as fact. More than half of these instances came in answers from Perplexity. Another answer presented an interest group’s criticism as part of a parliamentary inquiry report, rather than commentary related to the inquiry. In other instances, sources covering hearings in official inquiries were falsely presented as findings. In the BBC’s assessment, chatbots “have significant issues with basic factual accuracy.” The investigation concludes with a consideration of the consequences. “The BBC reports on conflicts and natural disasters, elections, and health and medical stories.” On these topics in particular, “Errors, like those shown in this report, could cause immediate harm.” Playing with fire “We live in troubled times,” Deborah Turness, CEO of BBC News and Current Affairs, said in a statement. “[H]ow long will it be before an AI-distorted headline causes significant real world harm?” The companies behind generative AI, she said, “are playing with fire.” The BBC was itself using AI tools, Turness said, though she declined to specify what those tools might be. Regardless, the benefits of AI, she said, must not come at the expense of accuracy. People must not be “served distorted, defective content that presents itself as fact.” This “could undermine people’s already fragile faith in facts and verified information.” This isn’t the first time that the BBC has criticized AI-powered news summaries: in December of last year, the broadcaster complained to Apple after the company’s Apple Intelligence feature generated a headline for a BBC article stating incorrectly that the suspect in a murder case in the US had shot himself – he had not. A spokesperson for the BBC said at the time: “It is essential to us that our audiences can trust any information or journalism published in our name.” Apple suspended its news summary feature last month. In her statement earlier this week, BBC CEO Turness praised Apple for taking the problem seriously – and invited other tech firms to do the same, offering to lead a conversation between tech companies and the BBC and other news outlets to find solutions. Until then, however, she suggested that developers of AI chatbots should follow Apple’s lead and stop offering news summaries. (js)"
