title = "E-Mail grün, sicher, einfach und werbefrei - posteo.de - Weißes Haus setzt Medien weiter unter Druck"
description = "Posteo ist ein innvovativer E-Mail-Anbieter, der auf Nachhaltigkeit und Datenschutz setzt und komplett Werbefrei ist. Unsere E-Mail-Postfächer, Kalender und Adressbücher sind synchronisierbar - wir setzen auf umfassende Verschlüsselung."
full_description = "Julius Stiebert 26.02.2025 Weißes Haus setzt Medien weiter unter Druck Das Weiße Haus will selbst entscheiden, welche Journalisten den Präsidenten im Oval Office begleiten. Es ist der nächste Schritt im Vorgehen der neuen US-Regierung gegen Medien. Journalistenverbände üben scharfe Kritik an der neuen US-Regierung. (Quelle: IMAGO / NurPhoto) Das Weiße Haus hat am Dienstag angekündigt, die im sogenannten Pressepool vertretenen Medien selbst auswählen zu wollen. Damit wird ein jahrzehntelanges Verfahren geändert – und der Regierung mehr Kontrolle über die Berichterstattung gegeben. Es ist nicht das erste Vorgehen gegen Medien, seit dem Regierungswechsel Ende Januar. Bisher hatte die White House Correspondents’ Association (WHCA), eine Organisation mit über einhundertjähriger Geschichte, die Besetzung des sogenannten Pools in einem Umlaufverfahren geregelt. Die Mitglieder begleiten den US-Präsidenten bei täglichen Aktivitäten und Veranstaltungen mit begrenztem Platzangebot, etwa im Oval Office. Sie geben die Informationen anschließend im Rahmen eines standardisierten Verfahrens an alle akkreditierten Medien weiter. Die Pressesprecherin des Weißen Hauses, Karoline Leavitt, sprach von einer Modernisierung des Pressepools. Neben traditionellen Medien sollten auch “neue Medien” nun daran teilnehmen können. Dazu sollen auch lokale Sender zählen – viele von ihnen gehören jedoch zur Sinclair-Mediengruppe, die als rechtspopulistisch gilt. Berichten zufolge macht sie ihren Mitarbeitenden auch Vorgaben zur Berichterstattung. Die New York Times erklärte, der Schritt ermögliche dem Weißen Haus, stärker zu kontrollieren, welche Journalistinnen und Journalisten die Aktivitäten von US-Präsident Donald Trump aus nächster Nähe beobachten und ihm Fragen stellen können. Verbände und Journalisten äußern Kritik Scharfe Kritik an dem neuen Verfahren kommt von der WHCA. Deren Präsident Eugene Daniels teilte mit, die Unabhängigkeit der freien Presse in den USA werde in Frage gestellt. Die Ankündigung lege nahe, dass die Regierung die Journalisten auswählen wird, die über den Präsidenten berichten. Er konstatierte: “In einem freien Land darf die politische Führung nicht in der Lage sein, ihr eigenes Pressekorps auszuwählen.” Die WHCA sei im Vorfeld nicht vom Weißen Haus informiert worden. Ein Sprecher der New York Times sagte: “Der Schritt des Weißen Hauses, bevorzugte Reporter zur Beobachtung des Präsidenten auszuwählen – und jeden auszuschließen, dessen Berichterstattung der Regierung nicht gefällt – ist ein Versuch, den Zugang der Öffentlichkeit zu unabhängigen, vertrauenswürdigen Informationen über die mächtigste Person Amerikas zu untergraben.” Auch Jacqui Heinrich vom Trump-freundlichen Sender Fox News teilte mit: “Dieser Schritt gibt nicht dem Volk die Macht zurück – er gibt dem Weißen Haus mehr Macht.” Und Peter Baker, Chefkorrespondent der New York Times für das Weiße Haus, schrieb in den sozialen Medien: “Als jemand der in den frühen Tagen von Putins Herrschaft Moskau-Korrespondent war, erinnert mich das daran, wie der Kreml seinen eigenen Pressepool übernahm und dafür sorgte, dass nur willfährige Journalisten Zugang bekamen.” Nachrichtenagentur ausgeschlossen Vorausgegangen ist der Ankündigung bereits der Ausschluss der Nachrichtenagentur Associated Press (AP) durch das Weiße Haus. Hintergrund ist, dass sich die Nachrichtenagentur weigert, das international als “Golf von Mexiko” bekannte Gewässer wie von Präsident Donald Trump vorgegeben als “Golf von Amerika” zu bezeichnen. Daraufhin war AP zunächst der Zugang zu einigen Terminen verweigert worden. Mitte Februar wurde die Agentur dauerhaft vom Zugang zum Oval Office und der Präsidentenmaschine ausgeschlossen. AP zählt international zu den bedeutendsten Nachrichtenagenturen. Der Fall ist inzwischen sogar vor Gericht gelandet. Doch ein US-Bundesrichter lehnte am Montag den Antrag der Nachrichtenagentur vorerst ab, den Ausschluss rückgängig zu machen. Er forderte die US-Regierung jedoch auf, ihre Entscheidung zu überdenken. Für den 20. März ist eine weitere Anhörung angesetzt. AP argumentiert, der Ausschluss verstoße gegen den ersten Zusatz der US-Verfassung, der die Meinungs- und Pressefreiheit garantiert. Diese Einschätzung teilen auch mehrere Pressefreiheitsorganisationen und fordern, der Nachrichtenagentur wieder Zugang zu gewähren. Organisationen wie das Komitee zum Schutz von Journalisten (CPJ), Reporter ohne Grenzen (RSF), die Freedom of the Press Foundation, PEN America sowie mehrere Sektionen der Society of Professional Journalists (SPJ) haben am Dienstag eine entsprechende Erklärung veröffentlicht. “Angriffe auf die Presse” Bereits am Freitag hatte die SPJ gemeinsam mit mehr als 40 Journalistenverbänden eine Erklärung zu den “jüngsten Angriffen der Regierung auf die Presse” veröffentlicht. Sie fordern ebenfalls, der AP wieder Zutritt zu Terminen zu gewähren – und Medien nicht für ihre Berichterstattung zu “bestrafen”. In der Erklärung heißt es: “Wenn Staatsoberhäupter versuchen, Reporter durch Einschüchterung, rechtliche Drohungen und Verweigerung des Zugangs zum Schweigen zu bringen, schützen sie nicht das Land, sondern sich selbst vor einer Kontrolle.” So würden autoritäre Regime agieren. Die Änderungen des Pressepools und der Streit mit AP sind nur die jüngsten Beispiele für das Vorgehen der Trump-Regierung. Sie hatte beispielsweise bereits für Pressearbeitsplätze im Pentagon ein sogenanntes Rotationsprinzip eingeführt – demnach übernimmt beispielsweise die rechte Nachrichtenseite Breitbart den Platz des National Public Radio (NPR). Auch NBC, CNN, die New York Times und die Washington Post sind betroffen. Ihre Journalisten behalten allerdings ihre Akkreditierungen, können also weiter an Pressekonferenzen teilnehmen. Beleidigungen und Klagen Trump hat zudem – nicht erst seit seinem erneuten Amtsantritt – mehrfach verbal gegen Medienschaffende ausgeteilt. So nannte er den Pulitzer-Preisträger Eugene Robinson “inkompetent” und forderte die Washington Post auf, ihn zu entlassen. Als der langjährige CNN-Korrespondent für das Weiße Haus, Jim Acosta, den Sender im Januar verlassen hatte, beschimpfte Trump ihn als “Verlierer”. Bereits in seiner ersten Amtszeit sowie im Wahlkampf hatte er Medien und Journalisten regelmäßig beschimpft, als “Feinde des Volkes” bezeichnet und kritische Berichterstattung als “Hexenjagd” denunziert. Selbst juristisch geht der US-Präsident gegen Medien vor. Er hat beispielsweise den Sender CBS und die Tageszeitung Des Moines Register verklagt. Die Zeitung hatte vor der Wahl im vergangenen Jahr eine für ihn schlechte Umfrage aus dem US-Bundesstaat Iowa veröffentlicht. Die Zeitung verlangt die Einstellung des Verfahrens. Dem Sender CBS wirft Trump vor, ein Interview mit der Präsidentschaftskandidatin Kamala Harris angeblich zu ihren Gunsten bearbeitet zu haben – und fordert 20 Milliarden US-Dollar Schadensersatz. Das vom Sender veröffentlichte Material zeigt, dass der von Trump erhobene Vorwurf falsch ist. Schon in der Vergangenheit hatte Trump CNN wegen Verleumdung verklagt – die Klage wurde abgewiesen. Behördenleitung neu besetzt Trump hat zudem die US-Medienaufsichtsbehörde FCC bereits nach den Wahlen im vergangenen November mit dem Republikaner Brendan Carr besetzt. Carr hat Beschwerdeverfahren gegen ABC, CBS und NBC im Zusammenhang mit deren Wahlberichterstattung wieder aufgenommen – die unter der vorherigen Behördenleitung noch abgewiesen worden waren. Der Behördenchef hat zudem Untersuchungen des öffentlichen Rundfunks NPR und PBS angekündigt. Am Mittwoch drohte Trump dann noch damit, Journalisten zu verklagen, wenn sie anonyme Quellen verwenden. Auf der 2024 veröffentlichten Rangliste der Pressefreiheit von RSF belegen die USA noch Platz 55 von 180 Staaten. Die Organisation teilte kürzlich mit, das Vorgehen des neuen Präsidenten, seiner Regierung und seiner politischen Partner käme einem “monumentalen Angriff auf die Informationsfreiheit” gleich. (js)"
