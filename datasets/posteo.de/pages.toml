["https://posteo.de/hilfe/ich-habe-mein-passwort-vergessen-was-nun"]
title = "Hilfe - Ich habe mein Passwort vergessen. Was nun? - posteo.de"
full_description = "Wenn Sie Ihre E-Mails mit einem E-Mail-Programm abrufen, ist Ihr Passwort dort eventuell gespeichert. Wo Sie Ihr Passwort dort ggf. finden können, erfahren Sie in den folgenden Hilfe-Beiträgen: Anleitung für Thunderbird Anleitung für Outlook Anleitung für Apple Mail auf macOS Anleitung für K-9 Mail auf Android Anleitung für FairEmail auf Android Als Posteo-Webmail-Nutzer können Sie Ihr Passwort in den Einstellungen Ihres Browsers nachschlagen, wenn Sie Nutzername und Passwort in Ihrem Browser gespeichert haben. Wenn Sie Ihr Passwort nicht gespeichert haben und kein E-Mail-Programm nutzen, aber die “Passwort vergessen”-Funktion in den Einstellungen aktiviert haben, können Sie hier ein neues Passwort per SMS oder per E-Mail an eine alternative E-Mail-Adresse anfordern. Bitte beachten Sie in diesem Zusammenhang die Warnhinweise weiter unten. Sie haben die “Passwort vergessen”-Funktion nicht aktiviert und gelangen auch auf anderem Wege nicht wieder an Ihr Passwort? Dann wenden Sie sich bitte an unseren Kunden-Support. Wir versuchen dann, Ihnen weiterhelfen. Bitte denken Sie daran, eine alternative Kontaktmöglichkeit anzugeben. Sonderfälle und Warnhinweise Haben Sie Ihren Posteo-Krypto-Mailspeicher aktiviert, können Sie die “Passwort vergessen”-Funktion nicht verwenden. Bitte wenden Sie sich an den Kunden-Support. Ihre E-Mail-Aliase bleiben nach einem Passwort-Reset bestehen und funktionieren weiterhin. Sie werden Ihnen in den Einstellungen jedoch ggf. verschlüsselt angezeigt. Ist Ihre Adressbuch- und Kalenderverschlüsselung aktiviert, führt ein Passwort-Reset zu einem Verlust Ihrer Kontakte und Termine. Sie haben die Möglichkeit, diese Daten in den Einstellungen Ihres Postfachs wiederherzustellen, wenn Ihnen Ihr altes Passwort wieder einfallen sollte."
