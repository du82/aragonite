["https://posteo.de/hilfe/wie-erstelle-ich-ein-smime-zertifikat"]
title = "Hilfe - Wie erhalte ich unkompliziert ein S/MIME-Zertifikat für meine Posteo-E-Mail-Adresse? - posteo.de"
full_description = "S/MIME ist ein weltweit verbreiteter Standard zur Ende-zu-Ende-Verschlüsselung von E-Mails. Ein S/MIME-Zertifikat bescheinigt auch die Echtheit einer E-Mail-Adresse und der E-Mail-Inhalte. S/MIME-Zertifikate für Privatnutzer sind seit Jahren schwer erhältlich. Wir wollen S/MIME fördern und bieten daher ab sofort (März 2024) preiswerte S/MIME-Zertfikate für Ihre Posteo-Adresse(n) an - diese lassen sich unkompliziert erwerben. Die S/MIME-Zertifikate werden von einer offiziellen Zertifizierungsstelle (Certum) signiert und in E-Mail-Programmen als vertrauenswürdig angezeigt. Sie haben eine Laufzeit von einem Jahr und kosten 3,65 Euro. In diesem Hilfe-Beitrag erfahren Sie, wie Sie ein S/MIME-Zertifikat über die Einstellungen in Ihrem Postfach erstellen. So erstellen Sie ein S/MIME-Zertifikat Öffnen Sie die Einstellungen Ihres Posteo-Postfachs. Klicken Sie auf den Menü-Punkt Meine S/MIME-Zertifikate. Klicken Sie in das Auswahlmenü-Feld E-Mail Adresse wählen. Wählen Sie die E-Mail-Adresse aus, für die Sie ein S/MIME-Zertifikat erstellen möchten. Klicken Sie auf Weiter. Setzen Sie ein Häkchen bei: Erstellte Zertifikate können nicht storniert werden. Ich erhalte und nutze mein Zertifikat sofort und mir ist bewusst, dass mein Widerrufsrecht damit erlischt. Klicken Sie auf den Button S/MIME-Zertifikat kostenpflichtig bestellen. Das Zertifikat wird jetzt lokal in Ihrem Browser generiert. Ihr Browser lädt anschließend automatisch zwei Dateien herunter: das in Ihrem Browser erstellte Zertifikat und eine Text-Datei mit dem Installationspasswort für das Zertifikat. Bewahren Sie beides gut auf. Fertig. Sie haben ein S/MIME-Zertifikat für Ihre E-Mail-Adresse erstellt. Sie können das Zertifikat jetzt mit Hilfe des Installationspasswortes in einem E-Mail-Programm hinzufügen. Voraussetzungen für die Nutzung von S/MIME zur Signierung und Verschlüsselung von E-Mails Sie verwenden Posteo in einem lokalen E-Mail Programm (z.B. Thunderbird, Apple Mail, Outlook). Für das Signieren benötigen nur Sie ein eigenes S/MIME-Zertifikat, für die Verschlüsselung müssen auch die Kommunikationspartner S/MIME nutzen. Anleitungen für die Nutzung von S/MIME in E-Mail-Programmen finden Sie in unserer Hilfe und in den weiterführenden Hilfeartikeln weiter unten. Häufig gestellte Fragen Kann ich weitere Zertifikate erwerben? Ja, weitere Zertifikate können z.B. auch für Aliase erworben werden. Speichert Posteo meinen privaten Schlüssel? Nein. Posteo generiert die Zertifikate nicht serverseitig. Private Schlüssel liegen Posteo zu keinem Zeitpunkt vor und werden nicht von Posteo gespeichert. Bei einer echten Ende-zu-Ende-Verschlüsselung haben niemals die Anbieter die privaten Schlüssel der Endnutzer. Wie erhalte ich das S/MIME-Zertifikat eines Kommunikationspartners, um E-Mails zu verschlüsseln? Sobald Sie eine E-Mail empfangen haben, die mit S/MIME signiert wurde, importiert ihr E-Mail-Programm das darin enthaltene S/MIME-Zertifikat des Kommunikationspartners automatisch. Sie können daraufhin verschlüsselt antworten, wenn Sie in Ihrem E-Mail-Programm S/MIME konfiguriert haben. Kann ich S/MIME im Posteo-Webmailer und in der Posteo Web-App nutzen? Ein Browser-Plugin für den Posteo-Webmailer und die Posteo Web-App ist in Arbeit. Weiterführende Artikel Wie nutze ich eine Ende-zu-Ende-Verschlüsselung mit S/MIME in Thunderbird? Wie veröffentliche ich den öffentlichen S/MIME-Schlüssel meiner Posteo-E-Mail-Adresse im Posteo-Schlüsselverzeichnis? Weitere Anleitungen zum Thema S/MIME"
year_published = 2025
