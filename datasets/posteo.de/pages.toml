description = "Posteo is an innovative email provider that is concerned with sustainability and privacy and is completely ad-free. Our email accounts, calendars and address books can be synchronised - we use comprehensive encryption."
full_description = "Julius Stiebert 13.02.2025 US: Immigration agencies use vast array of surveillance technologies Technology could play a decisive role in the new US presidential administration’s deportation plans. US agencies have been expanding their surveillance capabilities for years. Immigration and Customs Enforcement, the main agency in charge of executing deportation plans, has long been the focus of criticism – including for its surveillance of migrants. (Source: IMAGO / ZUMA Press) The new US presidential administration intends to deport migrants on a massive scale and shut down the southern border with Mexico. The government could deploy a vast arsenal of surveillance tools to help carry out its plans. Some agencies even hope to further expand their capabilities. During the election, President Donald Trump announced he would carry out “mass deportations” of undocumented immigrants. According to reports, authorities have increased the number of arrests in recent weeks. Some people, fearing arrest, are choosing to stay home rather than go to work, media report. Citlaly Mora from the US nonprofit Just Futures Law confirmed in an interview with Posteo that in the three weeks since Trump assumed office, the government has already stepped up its actions. The nonprofit has observed the targeting of immigrant communities throughout the country. Just Futures Law uses legal strategies to advocate for immigrant rights and oppose mass surveillance. Immigration and Customs Enforcement, or ICE, is the primary agency in charge of deportations. According to media reports, ICE agents are already present in large cities like Chicago, New York, and Los Angeles. But the current pace of arrests is apparently not enough for the new administration: according to a report by the Washington Post, ICE field offices have received orders to increase the number of arrests they make – from a few hundred people per day to between 1,200 and 1,500. The Post writes that agents could resort to “indiscriminate enforcement tactics” to meet the quota. The White House has denied the report. ICE has repeatedly come under criticism in the past – not only for its surveillance of immigrants, but also for its harassment of activists and journalists. Technologies to assist in deportations ICE has a large arsenal of surveillance tools to draw on. Critics fear that these tools could be used to carry out the administration’s plans and help track down individuals. Citlaly Mora of Just Futures Law told Posteo: “We know that they have an ample inventory and throughout the years they’ve been building up their surveillance mechanisms and tools.” Reporters from the New York Times recently reviewed nearly 15,000 public contracts that give a sense of this inventory. According to the Times’ reporting, since 2020, ICE and another enforcement agency, Citizen and Immigration Services, have spent a total of $7.8 billion to purchase immigration enforcement technology from 263 different companies. As the paper reports, this technology includes DNA tests meant to establish whether individuals crossing together at the border are related. Other technologies allow officers to access and analyze data from smartphones and computers. The agencies have license plate readers; they use systems that compare biometric data against criminal records or automatically alert agents when individuals change their address. According to the Times, most of the contracts were initiated under former president Joe Biden. In addition to enforcing immigration laws, the tools have been used in investigations into criminal activity like drug trafficking and human smuggling. How these technologies will be used by the new administration is unknown. But, the paper writes, “Tech products are almost certain to feature” in Donald Trump’s deportation plans. John Torres, a former ICE official, told the Times that the agency will “certainly use all tools at their disposal, including new tech available to them.” Lucrative business for tech companies Those profiting from this technological arms buildup, which began after the terrorist attacks of September 11, 2001, include a number of highly controversial companies. ICE, for example, has signed contracts with Palantir, a company that sells software designed for analyzing large quantities of data. The company has come under criticism for years, not least because of its collaboration with ICE – human rights organizations accuse Palantir of selling products that assist in deportations. The controversial company Palantir partners with US immigration authorities. (Source: IMAGO / Dreamstime) ICE also has a contract worth $9 million with the controversial facial recognition company Clearview AI. According to reports, the contract expired last year; it’s not yet known if the agency continues to partner with Clearview. The agency has however purchased roughly $54 million in technology from the Israeli company Cellebrite. The company sells hardware and software for unlocking and scanning data from smartphones. Cellebrite gained renown after its tools made it possible for the FBI to unlock an iPhone belonging to a man who killed 14 people in a shooting in San Bernadino, California in 2015. The company has repeatedly been criticized for selling its products to repressive governments. Critics fear surveillance of immigrants Citlaly Mora of Just Futures Law told Posteo: “There’s an extensive surveillance dragnet that was deployed before and will continue to be weaponized by the Trump administration to track, surveil and detain immigrant residents in the United States.” In recent years the organization has researched many of the tools that ICE uses to conduct digital surveillance. “While we feel that any technology can turn into a surveillance tool for the government,” Mora says, tracking tools like ankle shackles and the SmartLink app are especially concerning. These technologies are used by ICE as part of its Alternatives to Detention program. Individuals whose asylum cases are pending, for example, can wait for their hearings at home instead of being held in custody. In exchange, however, they must endure ongoing surveillance. Some are required to wear ankle monitors, while others must regularly send photos of themselves through the app. Surveillance via app SmartLink has been criticized in the past for cconstantly tracking the location of those enrolled in the program. ICE has denied that constant surveillance is taking place, despite evidence to the contrary. SmartLink has also been criticized for reportedly gathering and storing additional data, including photos that users are required to upload. According to Mora, hundreds of thousands of people in the US are monitored by means of the app, ankle shackles or other devices. Location data gathered in this way has in fact been used in the past to help plan a major ICE raid. A court document reviewed by the New York Times shows that in August 2019, during the first Trump administration, ICE officers tracked the location of a woman in the agency’s monitoring program. Based on this information, officers were able to obtain a search warrant for a chicken processing plant in Mississippi – which was raided, along with several other worksites throughout the state, as part of a coordinated effort that led to the arrest of roughly 680 undocumented workers. As the Times reported at the time, this was the largest enforcement action carried out by the agency since 2006. Protests against the government’s deportation efforts, like this one in Santa Barbara in January, have been held in the past weeks in the US. (Source: IMAGO / ZUMA Press Wire) Mora told Posteo that facial recognition and tools for monitoring social media were among the most worrying technologies used by authorities. According to the New York Times, ICE officers also have access to data sets sold by private data brokers. These could also be used to track down individuals. Search for additional surveillance technologies Nor do the authorities’ attempts to arm themselves with technology seem to end here: last year, for example, a contract between ICE and the Israeli software developer Paragon drew criticism. Though the Biden administration later decided to place the contract under review, its current status is unclear. Wired Magazine also reported last November that just hours after Donald Trump’s election victory, ICE put out a call for contracts for new surveillance technologies. Citlaly Mora told Posteo that Just Futures Law would continue to use legal strategies to counter new forms of surveillance. “Community members should have a tailored plan based on the risks they face and what data is most sensitive to them,” Mora said. “In this day and age, digital security is important to keep yourself as secure as possible.” As part of its hardline immigration policy, the Trump administration also plans to keep people from entering the country. The administration shut down an app which asylum seekers were required to use to book appointments at the border. Though the app was highly controversial, suspending its use put thousands of asylum seekers in limbo. Several executive orders have also made it more difficult for people to claim asylum – civil liberties advocates are already challenging the directives. The use of technologies at the US-Mexican border in particular could be expanded. In one of many executive orders, the new US president promises “to marshal all available resources and authorities” to prevent the entry of “illegal aliens” into the United States. The order explicitly calls for the use of technology to monitor the border. (js)"
