title = "E-Mail grün, sicher, einfach und werbefrei - posteo.de - Verschlüsselung"
description = "Posteo ist ein innvovativer E-Mail-Anbieter, der auf Nachhaltigkeit und Datenschutz setzt und komplett Werbefrei ist. Unsere E-Mail-Postfächer, Kalender und Adressbücher sind synchronisierbar - wir setzen auf umfassende Verschlüsselung."
full_description = 'Verschlüsselung Sie sind dem Großen Lauschangriff im Netz nicht hilflos ausgeliefert: Umfangreiche Verschlüsselung bietet einen zuverlässigen Schutz. Posteo verfügt über ein umfassendes und innovatives Verschlüsselungskonzept, das wir Ihnen auf dieser Seite gerne vorstellen möchten. Wir setzen verschiedene Verschlüsselungsarten an unterschiedlichen Stellen ein. Posteo verwendet stets die modernsten Verschlüsselungstechnologien und entwickelt sein Verschlüsselungskonzept beständig weiter. Wir tun alles, was wir auf Anbieterseite zur Sicherheit Ihrer Kommunikation beitragen können. Diese hängt aber auch von Faktoren ab, auf die wir keinen Einfluss haben. Sie selbst können auch etwas tun, um sicherer zu kommunizieren - auch darauf gehen wir auf dieser Seite näher ein. Informieren Sie sich: Das Verschlüsselungskonzept von Posteo erreicht auf verschiedenen, unabhängigen Testseiten wie Qualys SSL Labs und Hardenize Bestnoten. Überblick Posteo-Verschlüsselungs-Schichten Fahren Sie mit der Maus über das Schaubild oder klicken Sie eine Verschlüsselungs-Schicht an, um Informationen über die Posteo-Sicherheitsarchitektur zu erhalten. Mehr Informationen zu unserer Verschlüsselung finden Sie in den Abschnitten: Transportwegverschlüsselung Zugriffsverschlüsselung Passwörter und Mobilfunknummern Zweifaktorauthenrifizierung Serververschlüsselung Krypto-Mailspeicher Ende-zu-Ende-Verschlüsselung Adressbuch- und Kalenderverschlüsselung Internet: Verschlüsselte Verbindungen zu anderen E-Mail-Servern (wenn möglich) E-Mail-Transport: Posteo überträgt jede E-Mail, die Sie an andere E-Mailanbieter bzw. -server versenden über einen verschlüsselten Transportweg, wenn der andere Server dies unterstützt. Hierfür verwenden wir stets die neuesten Technologien. TLS (1.0-1.3) mit PFS DANE/TLSA Die automatische Transportwegverschlüsselung erfolgt ohne Ihr Zutun im Hintergrund. Sie schützt: die Inhalte Ihrer E-Mails die Metadaten (wie Betreff, Empfänger, Uhrzeit) Mehr Informationen zur Transportwegverschlüsselung von Posteo finden Sie im Abschnitt Transportwegverschlüsselung. Transparenzhinweis: Die Qualität der Posteo-Verschlüsselung kann auf der unabhängigen Testseite von Qualys getestet und eingesehen werden. Verschlüsselter Zugriff auf Posteo, zwingend (Website, Geräte und Programme) Zugriffsverschlüsselung: Bei Posteo erfolgt jeder Zugriff verschlüsselt. Webmailer lokale Mailprogramme mobile Geräte Unverschlüsselten Zugriff bieten wir nicht an. Wir verwenden für die Zugriffsverschlüsselung stets die neuesten Technologien. TLS (1.0-1.3) mit PFS Strict Transport Security (HSTS) DANE/TLSA Außerdem verwenden wir ein so genanntes erweitertes Sicherheitszertifikat, das Ihnen ermöglicht, auf einen Blick zu erkennen, dass Sie tatsächlich auf unserer Website sind. Mehr Informationen zur Zugriffsverschlüsselung von Posteo und zum erweiterten Sicherheitszertifikat finden Sie im Abschnitt Zugriffsverschlüsselung Verschlüsselte Verbindungen innerhalb von Posteo Interne Verbindungen: Wir verschlüsseln auch alle Verbindungen innerhalb von Posteo. Verschlüsselung u.a. mit SSH und TLS So ist sichergestellt, dass weder innerhalb des Systems, im Rechenzentrum noch auf dem Weg zum Backupstandort mitgelauscht werden kann. Mehr Informationen zur Verschlüsselung innerhalb von Posteo finden Sie im Abschnitt Serververschlüsselung. Zugangs-Schutz: Passwort (gesalteter Hash) Speicherung von Passwörtern: Posteo speichert Ihr Passwort nicht im Klartext ab. Trotzdem wird es bei jedem Login überprüft - mit einer Hashfunktion. Passwörter liegen nicht im Klartext vor Speicherung als gesalteter Hash Wir kennen Ihr Passwort nicht und können es weder an Sie noch an Dritte herausgeben. Mehr Informationen zur Verschlüsselung von Passwörtern und Mobilfunknummern bei Posteo finden Sie im Abschnitt Passwörter und Mobilfunknummern. Zugangs-Schutz 2 (optional): Einmal-Passwort Zwei-Faktor-Schutz: Bei Posteo können Sie eine Zwei-Faktor-Authentifizierung aktivieren. Mit ihr können Sie die Sicherheit beim Zugriff auf Ihr Posteo-Postfach (im Browser) weiter erhöhen. Login erfolgt mit: Ihrem persönlichen Passwort einem Einmal-Passwort (wechselt alle 30 Sekunden) TOTP-Verfahren Das Einmal-Passwort wird auf Ihren Geräten generiert (Computer, Tablet oder Smartphone). Mehr Informationen zu unserer Zwei-Faktor-Authentifizierung finden Sie in unserer Hilfe. Konto-Schutz: Festplattenverschlüsselung Server-Verschlüsselung: Die Festplatten aller Posteo-Server sind vollständig verschlüsselt. Linux-Server mit dm-crypt/LUKS-Verschlüsselung Verschlüsselung interner Verbindungen (SSH und TLS) Unsere verschlüsselten Festplatten schützen vor: Diebstahl von Hardware physischem Zugriff durch Unbefugte Willkür (Ermittlungsbehörden) Mehr Informationen zur Festplattenverschlüsselung von Posteo finden Sie im Abschnitt Serververschlüsselung. Verschlüsselung aller gespeicherten E-Mails (optional):der individuelle Posteo-Krypto-Mailspeicher Posteo-Krypto-Mailspeicher: Aktivieren Sie Ihren Posteo-Krypto-Mailspeicher, verschlüsselt Posteo alle E-Mails, die Sie auf unseren Servern gespeichert haben. Verschlüsselt alle E-Mail-Daten (Inhalte, Anhänge und Metadaten) auf Knopfdruck Schlüssel ist mit Ihrem Passwort geschützt Verschlüsselt alle bisher gespeicherten sowie alle neu hinzukommenden E-Mails Asymmetrische Verschlüsselung mit RSA Symmetrische Verschlüsselung und Authentifizierung mit AES und HMAC,Hashing mit bcrypt Open-Source-Verschlüsselung Externes Sicherheits-Audit (November 2014) durch Cure53 Posteo kann die Verschlüsselung Ihrer E-Mails nicht deaktivieren. Mehr Informationen zum Posteo-Krypto-Mailspeicher finden Sie im Abschnitt Krypto-Mailspeicher. Posteo-Eingangs-Verschlüsselung (optional):Verschlüsselung aller neu eingehenden E-Mails(mit S/MIME o. OpenPGP) Posteo-Eingangs-Verschlüsselung: Wenn Sie S/MIME oder OpenPGP verwenden, können Sie in den Einstellungen Ihres Postfachs die Posteo-Eingangsverschlüsselung aktivieren. Sie verschlüsselt alle neu eingehenden E-Mails mit S/MIME oder OpenPGP. Verschlüsselt alle neu eingehenden E-Mails mit S/MIME oder OpenPGP, wenn der Absender einer E-Mail diese ursprünglich nicht verschlüsselt hatte. Zusätzlicher Schutz für Ihre gespeicherten E-Mails Mehr Informationen zur Eingangsverschlüsselung finden Sie im Abschnitt Ende-zu-Ende-Verschlüsselung. Ende-zu-Ende-Verschlüsselung einzelner E-Mails (durch den Kunden) Ende-zu-Ende-Verschlüsselung: Sie können die Inhalte einzelner E-Mails -zusätzlich zu unseren Maßnahmen- mit einer Ende-zu-Ende-Verschlüsselung versehen. Hierfür gibt es zwei Standards: S/MIME und OpenPGP (PGP). Inhalte von E-Mails werden verschlüsselt Metadaten der E-Mails (z.B. Betreff, Empfänger, Absender und Zeitstempel) bleiben unverschlüsselt Absender und Unversehrtheit der E-Mail lassen sich verifizieren (Signatur) Beide Kommunikationspartner müssen die Verschlüsselung verwenden, um verschlüsselt zu kommunizieren. Mehr Informationen zur Ende-zu-Ende-Verschlüsselung finden Sie im Abschnitt Ende-zu-Ende-Verschlüsselung Adressbuch- und Kalenderverschlüsselung (optional): Individuelle Verschlüsselung von Kontakten und Terminen Adressbuch- und Kalenderverschlüsselung: Posteo-Kunden haben die Möglichkeit, ihre Kalender- und Adressbuchdaten individuell auf Knopfdruck zu verschlüsseln (AES). AES-Verschlüsselung direkt in der Datenbank Schlüssel ist mit Ihrem Passwort geschützt Die Kalender- und Adressbuchverschlüsselung schützt Ihre Kontakte und Termine vor dem Zugriff durch Dritte Mehr Informationen zur Adressbuch- und Kalenderverschlüsselung finden Sie im Abschnitt Adressbuch- und Kalenderverschlüsselung. Hinweis: Alle Verschlüsselungsfunktionen von Posteo lassen sich problemlos miteinander kombinieren. Zugriff Die Zugriffs-Verschlüsselung erkennen Sie im Browser an dem https:// in unserer Internetadresse Der Zugriff auf unsere Server erfolgt grundsätzlich über verschlüsselte TLS-Verbindungen. Diese sichern wir zusätzlich mit der Technologie "Perfect Forward Secrecy" (PFS) und DANE/TLSA ab. PFS verhindert wirksam, dass möglicherweise aufgezeichnete Verbindungsdaten von Dritten nachträglich massenhaft entschlüsselt werden können. DANE verifiziert die Echtheit unseres Servers. Sie können so in jeder Umgebung sicher sein, dass niemand Ihren Netzwerkverkehr mit Posteo belauschen, Ihre Mails mitlesen oder Ihre Zugangsdaten entwenden kann. Warum wir den Zugriff verschlüsseln: Heute greifen Nutzer auf unterschiedlichen Wegen auf Ihre Mails zu - z.B. über offene WLAN-Netze oder Internetcafes. Erfolgt die Anmeldung unverschlüsselt, können sich Dritte leicht Ihre Zugangsdaten erschleichen. So gelangen sie unter Umständen nicht nur an Ihre Mails, sondern auch an Ihre Anmeldedaten bei anderen Internetdiensten. Da viele Nutzer ähnliche Passwörter und Benutzernamen bei verschiedenen Diensten angeben, ist häufig ein „Scheunentor“ geöffnet, sobald der Zugang zu einem Mailkonto erbeutet wurde. Sie müssen uns nicht blind vertrauen: Sie können unsere Verschlüsselung (und die der anderen Anbieter) z.B. auf der unabhängigen Testseite von Qualys transparent einsehen und testen. Wir halten unsere Verschlüsselung stets auf dem neuesten Stand. Deshalb erreichen wir in den Qualys-Tests die Bestnote A+ (Stand: 01/2024). Quelle: SSLlabs.com Bei Posteo erfolgt jeder Zugriff verschlüsselt. Unverschlüsselten Zugriff bieten wir nicht an. Webmailer lokale Mailprogramme mobile Geräte TLS (1.2-1.3) mit PFS Strict Transport Security (HSTS) DANE/TLSA Sicherheits-Tipp: Aktualisieren Sie Ihren Browser und Ihre E-Mailprogramme in regelmäßigen Abständen. Wir setzen stets die modernsten Verschlüsselungstechnologien ein - sehr alte Browserversionen können mit diesen in Einzelfällen nicht umgehen. Der Internet Explorer 8 unterstützt die Absicherung der verschlüsselten Verbindung mit PFS z.B. nicht. Mit dem Supportende von Windows XP haben wir die Unterstützung für den Internet Explorer 8 beendet. Zertifikat Erweitertes Sicherheitszertifikat Damit Sie bei uns immer sicher sein können, dass die verschlüsselte Verbindung wirklich mit dem Posteo-Server stattfindet, setzen wir ein so genanntes erweitertes (grünes) Sicherheitszertifikat ein, mit dem Sie auf einen Blick den Verschlüsselungspartner erkennen können. (siehe Grafik). Solche Zertifikate werden vor allem von Unternehmen eingesetzt, die mit sensiblen Daten umgehen, z.B. von Banken. Zusätzlich finden Sie die Fingerprints unseres Sicherheitszertifikates für einen manuellen Abgleich auch in unserem Impressum. Warum wir ein erweitertes Zertifikat verwenden: Phishing-Seiten versuchen an Nutzerdaten zu gelangen, indem sie Seiten von Banken und Internetdiensten nachbauen, um so an Ihre Logindaten zu gelangen, wenn Sie sich auf den gefälschten Seiten anmelden. Mit dem erweiterten Zertifikat können Sie auf einen Blick erkennen, dass Sie sich auf unserer Seite befinden. Das Sicherheitszertifikat können Sie einsehen, indem Sie auf das Symbol (je nach Browser verschieden) vor unserer Adresse klicken. Transportweg Verschlüsselter Mailverkehr Oft wird gesagt, dass E-Mails wie Postkarten sind und jeder sie auf dem Transportweg mitlesen kann. Das ist nicht immer richtig. Unsere Server versuchen beim Versand und Empfang von E-Mails stets, eine verschlüsselte Verbindung (mit PFS gesicherte TLS-Verbindung) mit dem anderen Mailserver aufzubauen. Unterstützt der Server dies, wird die E-Mail über einen verschlüsselten Transportweg übertragen. Die Verschlüsselung erfolgt automatisch im Hintergrund, Sie und Ihr Kommunikationspartner müssen nichts dafür tun. Wenn Sie möchten, können Sie zusätzlich unsere TLS-Versand-Garantie aktivieren: Kann ein E-Mailserver keine verschlüsselte Verbindung aufbauen, versenden wir Ihre E-Mail dann garantiert nicht - und benachrichtigen Sie per E-Mail. Wird der Transportweg mit TLS verschlüsselt, kann niemand ohne Weiteres die (unverschlüsselte) E-Mail mitlesen. Durch den Einsatz zusätzlicher Technologien wird die Verschlüsselung zusätzlich abgesichert: Die Technologie PFS verhindert das nachträgliche massenhafte Entschlüsseln durch unbefugte Dritte. Seit Mai 2014 unterstützt Posteo ausserdem die innovative Technologie DANE/TLSA, die verschiedene Schwachstellen der gängigen Transportwegverschlüsselung eliminiert. DANE erhöht die Sicherheit beim verschlüsselten Transport von E-Mails und beim Zugriff auf Webseiten. Viele E-Mailanbieter haben nach dem NSA-Skandal nachgebessert und unterstützen die Verschlüsselung der Transportwege nun, wenn es auch noch große Qualitätsunterschiede in der Umsetzung gibt. Wir hoffen, dass hier weiter nachgebessert wird, denn die zwischen den Servern ausgehandelte Verschlüsselungsqualität hängt stets vom „schwächeren“ Kommunikationspartner ab. Insbesondere hoffen wir, dass die von uns eingesetzte Technologie DANE bald weite Verbreitung findet, da wir davon überzeugt sind, dass DANE maßgeblich dazu beitragen kann, digitale Kommunikation sicherer zu machen. Bitte beachten Sie die Anbieterliste (rechts), die wir regelmäßig aktualisieren. Die Transportweg-Verschlüsselung schützt alle Daten während der Übertragung vor unbefugten Mitlesern: Die Inhalte einer E-Mail ebenso wie die Metadaten. Schreiben sich Posteo-Nutzer untereinander, verlässt die E-Mail-Kommunikation zu keinem Zeitpunkt unsere verschlüsselten Server. Transportweg-Verschlüsselung: TLS (1.0-1.3) mit PFS DANE/TLSA schützt E-Mails und Metadaten erfolgt automatisch TLS: Anbieter im Überblick Verschlüsselte Transportwege von Posteo zu: TLS DANE Arcor ja nein AOL ja nein Bund.de ja ja Comcast/Xfinity ja ja Freenet ja ja Gmail ja nein GMX.de ja ja Microsoft 365 ja nein* O2 ja nein Outlook.com ja nein Riseup ja ja T-Online ja nein Vodafone ja nein web.de ja ja Yahoo ja nein *Für den Versand von E-Mails von Microsoft 365 an Posteo wird DANE bereits unterstützt. Eine Unterstützung von DANE für den Empfang von E-Mails ist laut Microsoft ab März 2024 geplant. Stand: 6/2023 Lesetipps heise.de: Posteo testet Certificate Pinning heise.de: Posteo setzt als erster Provider DANE ein Posteo-Verschlüsselung im Test bei heise.de Posteo-Verschlüsselung im Test auf zeit.de Server Verschlüsselte Server Unsere Server (Linux) stehen in einem Rechenzentrum in Frankfurt am Main. Die Mitarbeiter des Rechenzentrums haben keinen Zugriff auf unsere Systeme. Die Festplatten aller Posteo-Server sind vollständig verschlüsselt. Für die Verschlüsselung der Festplatten verwenden wir dm-crypt/LUKS. Die Ver- und Entschlüsselung wird von den CPUs unterstützt und erfolgt deshalb Ressourcenschonend (AES-NI). Sollten Festplatten aus unseren Servern entfernt werden (zur Wartung oder willkürlich), sind die darauf gespeicherten Daten für Dritte nicht lesbar. Auch der Verlust ganzer Systeme wäre unproblematisch - nur wir können die Daten aufschliessen. Wir verschlüsseln alle Verbindungen - auch innerhalb von Posteo: Alle verwendeten Dienste verschlüsseln ebenfalls intern (u.a. SSH und TLS), so dass auch weder im Rechenzentrum noch auf dem Weg zum Backupstandort mitgelauscht werden kann. Ihre E-Mails '
