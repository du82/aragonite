title = "E-Mail grün, sicher, einfach und werbefrei - posteo.de - Security Transparency"
description = "Posteo ist ein innvovativer E-Mail-Anbieter, der auf Nachhaltigkeit und Datenschutz setzt und komplett Werbefrei ist. Unsere E-Mail-Postfächer, Kalender und Adressbücher sind synchronisierbar - wir setzen auf umfassende Verschlüsselung."
full_description = "Posteo Security Transparency Security contact information You believe that you found a bug or a vulnerability? Please send your finding well documented (including a proof of concept) to securityteam@posteo.de. We will have a look at it and investigate the impact and relevance. Encrypt your email with one of our public keys (S/MIME, PGP) and provide us with your public key for email encryption. Please report your findings compliant with the common responsible disclosure rules to protect user data and security, reports always start out as non-public submissions to our security team. Disclosure Process We handle reported bugs and vulnerabilities with a coordinated disclosure policy. We usually publish findings after the vulnerability has been fixed and further testing has been performed, though we reserve the right to define the extent of information which will be published. You may not publicly disclose the vulnerability. Bug Bounty Currently our program consists of paid regular security audits and pen-tests performed by top researchers. If you find a bug or a security vulnerability, you might be eligible for a reward. Our rewards are relevance-based according to the impact the finding could cause. After having investigated the reported vulnerability we will decide about a reward and, if applicable, offer it to you. Findings ID Date of disclosure Interface/Target Title Estimated potential Status Thanks to 20231024-001 24.10.2023 Mailing Lists Unintended local-part disclosure Low Fixed Oskar Hieronymus Hinz 20221213-001 13.12.2022 Web Calendar: Self-XSS via ICS Import Info Fixed Jan Preßler 20191206-001 06.12.2019 SMTP Problem in conjunction with mismatching TLSA record of recipient server in rare circumstances Low Fixed Daniel Stirnimann 20180914-001 14.09.2018 Web Two bypasses of remote content blocking Low Fixed Jens Müller 20171023-001 23.10.2017 Web Unintended behaviour of public key directory settings page High Fixed Jan Preßler 20170817-001 1