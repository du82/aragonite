title = "Email green, secure, simple and ad-free - posteo.de - More countries imposed internet shutdowns in 2024 than ever before"
description = "Posteo is an innovative email provider that is concerned with sustainability and privacy and is completely ad-free. Our email accounts, calendars and address books can be synchronised - we use comprehensive encryption."
full_description = "Julius Stiebert 26.02.2025 More countries imposed internet shutdowns in 2024 than ever before There were at least 296 internet shutdowns worldwide last year, according to Access Now. Many were imposed in connection with conflicts and wars. Myanmar saw the largest number of internet shutdowns. Seven countries resorted to the measure for the first time in 2024. (Archival photo) (Source: IMAGO / ZUMA Press Wire) Last year governments in 54 countries imposed at least 296 internet shutdowns, according to an annual report published on Monday by Access Now. This is the highest number of shutdowns since the organization began keeping track in 2016 – though as Access Now and its partner organizations stress, internet shutdowns are never justified. At 296, the total number of documented shutdowns rose last year compared to the year before, when 283 were recorded. The number of countries that made use of the controversial measure also rose by 15. Millions of people were impacted. Forty-seven of the shutdowns begun last year continued into 2025. The highest number of internet shutdowns were observed in Myanmar: there the internet was cut off 85 times – a sharp rise from the 37 times Access Now recorded in 2023. The military junta that has ruled the country since 2021 was responsible for most of the shutdowns. With 84 shutdowns, India follows close behind the Southeast Asian country. It’s the first time since 2018 that India has not led the list. Nevertheless, Access Now writes in its report, 84 is still “an unacceptably high number” for “the world’s largest democracy.” According to the India-based Software Freedom Law Center, in most cases where the authorities cut off access last year, they did so as a preventive measure in anticipation of protests or similar unrest. In Pakistan, 21 shutdowns were documented, more than ever before in the country. Russia imposed 19 shutdowns, including seven in Ukraine. Wars and conflicts As was the case in 2023, conflicts and wars were the most common triggers for internet shutdowns: warring parties in eleven countries cut off communications 103 times. Ethiopia, Myanmar, Israel, Russia and Sudan were among the countries imposing shutdowns. This too was an all-time high, Access Now reports. Numerous tactics were used to block access to the internet during active conflicts. These included destroying power and telecommunications infrastructure, cutting cables, using jamming devices and occupying the offices of internet service providers. Protest movements and elections The organization also documented a new high in connection with protests: in 2024, governments in 24 countries imposed 74 shutdowns. Bangladesh, India, Kenya, Rwanda and Senegal were among the offenders. One motive for the shutdowns was to limit and suppress demonstrations against government policies or the economic situation. Authorities also frequently block access to communications when violence erupts during conflicts or protests. As Access Now argues, this stokes “fear and uncertainty” in the population – and cuts people off from life-saving information. The organization linked 72 internet shutdowns in 2024 to human rights abuses or war crimes. Elections were held in at least 64 countries in 2024. Twelve election-related shutdowns were documented in eight countries – the highest number since 2019. Azerbaijan, India and Uganda were among the eight offenders. Exams prompt internet shutdowns Some governments also resorted to internet shutdowns to prevent cheating during school or university exams – including in Algeria, Jordan, Kenya, and Iraq. This number too is the highest since Access Now’s record-keeping began. Iran and Sudan did not impose any shutdowns during exam periods, despite having resorted to the measure in the past. Access Now notes however that in Sudan the majority of students couldn’t participate in exams at all on account of the ongoing civil war – while Iran blocked access to the internet several times last year in connection with demonstrations. Access Now includes platform blocks in its tally. According to this year’s report, the number of blocks rose substantially: last year 71 instances were recorded in 35 countries – compared to 53 blocks in 25 countries in 2023. Last year’s total even surpassed the previous high from 2019. “Authorities imposed this type of shutdown to control the flow of information on popular platforms and target specific populations,” Access Now writes. “There is a misconception that such shutdowns minimize impacts or represent a more acceptable form of censorship than cutting off the internet entirely.” X (formerly Twitter) was blocked most often (24 times in 14 countries), followed by Facebook (22 times in 12 countries). But authorities also blocked YouTube and Instagram, as well as chat services like WhatsApp and Signal. The dating app Grindr was blocked in 13 countries. Seven countries block access for the first time In 2024, seven countries shut down the internet or blocked platforms for the first time. Among them was Malaysia, which blocked access to Grindr – the restriction is reportedly still in effect on some networks in the country. Thailand also turned up on the list for the first time. The country imposed a cross-border shutdown, blocking access to internet and telephone connections in a region of Myanmar that borders Thailand. The purported goal of the measure was to curb cybercrime operations based in Myanmar – but as the report notes, people in Thailand were also affected. Zach Rosson of Access Now said in a statement: “The data doesn’t lie: 2024 was a record-breaking year for internet shutdowns. As perpetrators become more sophisticated in their tactics to silence dissent, so must our response as civil society and human rights defenders. Now more than ever, we need a collective and concerted effort to fight the unyielding use of internet shutdowns around the world – fundamental rights depend on it.” The organization stresses that parties to conflicts must ensure that the civilian population has access to telecommunications infrastructure and essential platforms. In addition, the international community must hold accountable those who commit “gross human rights abuses and crimes against humanity under the cover of internet shutdowns.” All governments must protect the right to freedom of expression and to access information, Access Now urges. But the organization reserves criticism for tech companies as well, noting that “many of the largest social media platforms have decisively stepped back form their past commitments to limit the spread of harmful content on their platforms” – like hate speech and misinformation. Access Now calls on tech companies to protect human rights – and on governments to go after the causes of misinformation, rather than block access to platforms. (js)"
