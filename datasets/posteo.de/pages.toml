["https://posteo.de/en/site/support_us"]
title = "Email green, secure, simple and ad-free - posteo.de - Support Us"
description = "Posteo is an innovative email provider that is concerned with sustainability and privacy and is completely ad-free. Our email accounts, calendars and address books can be synchronised - we use comprehensive encryption."
full_description = "The Signature. Recommend Posteo via email Signatures are small text blocks that you can add to the end of your emails. If you do so, a reference to us will be added at the bottom of every email you send. We have created sample signatures that you can use to draw your contacts’ attention to Posteo. Create signature now Instructions on how to create a signature can also be found in our Posteo help section. I communicate sustainably. With my account at https://posteo.de/en Email: Green, secure, ad-free. https://posteo.de/en My emails are powered by 100% green energy from Green Planet Energy. Email: Green, secure, ad-free. https://posteo.de/en I rely on maximum data protection and security for my emails. With my account at https://posteo.de/en The Credit. Add credit in advance We do not offer a donation option, but if you would like to support us financially, you are welcome to top up your account with additional credit. This strengthens our financial foundation, which we can use to further develop Posteo. Top up your account now The Voucher. Give away Posteo voucher codes With a Posteo voucher, you can support us and make others happy. You can find out how to create and redeem vouchers. Log in now and create a voucher The Post? We are not on social media We refrain from incorporating social media on our website: these services are based on tracking and advertising, and collecting data from their users. For security reasons, we advise you not to spread the word on social media about which services you use and enjoy - even if you would like to advertise for us on these platforms."
