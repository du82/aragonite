["https://posteo.de/site/ueber_posteo"]
title = "E-Mail grün, sicher, einfach und werbefrei - posteo.de - Wir über uns"
description = "Posteo ist ein innvovativer E-Mail-Anbieter, der auf Nachhaltigkeit und Datenschutz setzt und komplett Werbefrei ist. Unsere E-Mail-Postfächer, Kalender und Adressbücher sind synchronisierbar - wir setzen auf umfassende Verschlüsselung."
full_description = '''Überblick Posteo ist ein unabhängiger deutscher E-Mailanbieter mit Sitz in Berlin. Wir bieten anonyme und nachhaltige E-Mail-Postfächer, Adressbücher und Kalender an und verfügen über ein umfassendes Verschlüsselungskonzept. Unser Angebot ist komplett werbefrei und eigenfinanziert. Gegründet wurde Posteo 2009. Wir wollen einen Impuls für mehr Sicherheit, Datenschutz und Nachhaltigkeit im Internet geben. Und Alternativen anbieten. Für alle, die genug von Daten sammelnden Konzernen, werbeverseuchten Posteingängen und der allgegenwärtigen Überwachung im Internet haben. Und für alle, denen es wichtig ist, ökonomisch wie ökologisch nachhaltig zu handeln. Unser Anliegen ist es, die Daten unserer Nutzer zu schützen und sie nicht meistbietend an die Werbewirtschaft zu verkaufen. Deshalb erheben wir keine personenbezogenen Daten, verzichten auf Tracking-Tools und fertigen täglich Sicherheits-Backups an. Posteo verfügt über ein innovatives Verschlüsselungskonzept. Wir verschlüsseln Ihre Daten stets mit den neuesten Technologien - und fördern die Verbreitung offener Standards. Wir setzen uns aktiv für die digitalen Bürgerrechte ein: Im Mai 2014 hat Posteo als erster deutscher Telekommunikations-Anbieter einen Transparenzbericht veröffentlicht. Datenschutz-Seite >> | Infoseite-Verschlüsselung >> Posteo verfügt über ein umfassendes Nachhaltigkeitskonzept. Wir arbeiten mit echtem Ökostrom von Green Planet Energy, nicht mit Zertifikate-Strom, der oft als Ökostrom beworben wird. Der Einsatz effizienter Hardware sowie das Verwenden von Recyclingpapier ist für uns genauso selbstverständlich wie unser Firmenkonto bei der GLS-Bank. Nachhaltigkeits-Seite >> Nach Bekanntwerden des NSA-Skandals wurde unser Angebot vielfach in den Medien empfohlen und von Computerzeitschriften getestet. Medienbeiträge >> Externe Informationen Posteo-Wikipedia-Eintrag Posteo im Test Testsieger Stiftung Warentest 10/2016 Testsieger Stiftung Warentest 02/2015 c't Magazin 08/2013 c't Magazin 01/2014 zeit.de 07/2013 Ausgewählte Presseartikel Posteo – Das grüne Postfach Posteo-Portrait im c't Magazin Posteo-Portrait im Tagesspiegel Posteo-Portrait (Berliner Zeitung) Posteo-Portrait (Ökotest-Verlag) The Guardian über Posteo Deutsche Welle zu Posteo-Kritik zeit.de zum Transparenzbericht Heise über unsere DANE-Einführung Mehr Presseberichte >> Team Wir wollen gute Arbeitgeber sein: Posteo setzt ausschließlich auf unbefristete Festanstellungen. Wir zahlen angemessene Gehälter und fordern keine Überstunden ein. Unsere Mitarbeiter können ihre Arbeitszeiten flexibel gestalten. Bei Posteo gibt es außerdem täglich einen kostenfreien bio-vegetarischen Mittagstisch. Aktuelle Stellenausschreibungen finden Sie auf unserer Job-Seite >> Unser Support-Team hilft bei allen Fragen und Problemen per E-Mail weiter (kostenfrei). Wir versuchen, alle Anfragen innerhalb eines Werktages zu beantworten. Kontaktformular >> Unsere Entwickler arbeiten kontinuierlich an technischen Innovationen, z.B. an neuen Verschlüsselungsoptionen. Posteo setzt ausschließlich auf offene Standards und offene Software. Wichtige Eigenentwicklungen veröffentlichen wir, um die Open Source Community zu stärken. Github >> Patrik Löhr ist Gründer und Geschäftsführer von Posteo. Er leitet die Administration und das Entwicklerteam. Sabrina Löhr ist Gründerin von Posteo. Sie leitet unsere Pressearbeit, die Redaktion und das Design. Dean Ceulic leitet die Öffentlichkeitsarbeit und das Marketing. Er vertritt uns gegenüber Politik und Verbänden. Posteo Campus Posteo sitzt auf dem Gelände der ehemaligen Schultheiss-Brauerei auf dem Berliner Kreuzberg. Hier befinden sich unsere Büros, das Posteo Lab und unsere Kantine. Alle Räume sind nachhaltig eingerichtet und werden mit Ökostrom von Green Planet Energy versorgt. Mehr Informationen hierzu finden Sie auf unserer Nachhaltigkeits-Seite >>. Die Büros Unsere Büroräume sind hell und funktional eingerichtet. Alle Schreibtische sind Maßanfertigungen aus geöltem FSC-Holz. Regale und Rollcontainer stammen von Werkhaus. Jede Anschaffung wird auf ihre Umweltverträglichkeit geprüft. Die Kantine Wir bieten unseren Mitarbeitern täglich einen kostenfreien bio-vegetarischen Mittagstisch an. Posteo beschäftigt hierfür einen eigenen Koch. Auch Getränke, Obst und Nervennahrung stellt Posteo seinem Team kostenfrei zur Verfügung. Das Posteo-Lab Das Posteo Lab ist ein Begegnungs- und Veranstaltungsort auf dem Berliner Kreuzberg. In unserem Lab können Sie Posteo vor Ort ausprobieren, Guthaben aufladen und an einem individuellen Verschlüsselungs-Training teilnehmen. Außerdem stellen wir nach Nachhaltigkeitskriterien produzierte Hardware wie das Fairphone oder die faire Computermaus aus. Auch das Lab selbst haben wir nachhaltig eingerichtet. Wir öffnen das Lab regelmäßig für Vorträge, Infoveranstaltungen, Schulungen und Kulturevents. Informationen zu aktuellen Veranstaltungen finden Sie in unserem Veranstaltungskalender. Externen Veranstaltern stellen wir das Lab sehr gerne kostenfrei zur Verfügung. Die Veranstaltungen sollten zu Posteo und unseren Themen passen. Interessenten können uns per E-Mail kontaktieren: veranstaltungen(ät)posteo(punkt)de. So finden Sie uns: Posteo Lab Methfesselstraße 36 10965 Berlin-Kreuzberg (Gelände der ehem. Schultheiss-Brauerei) Anfahrt BVG: U6/Platz der Luftbrücke Openstreetmap: http://www.openstreetmap.org/node/1145589771 Die Umgebung Die ehemalige Schultheiss-Brauerei befindet sich auf dem höchsten natürlichen Punkt der Berliner Innenstadt: Dem Berliner Kreuzberg. An die Brauerei schließt der Viktoriapark an, von dem aus man über die Stadt blicken kann. Wenige Meter die Methfesselstraße hinunter erinnert eine Gedenktafel an den Ort, an dem Konrad Zuse den "Zuse Z3" baute und als ersten Digitalcomputer der Welt in Betrieb nahm. Infrastruktur Unsere Server stehen in Rechenzentren in Frankfurt am Main, Bielefeld und Berlin. Sie werden zu 100% mit Strom von Green Planet Energy versorgt. Auf allen Posteo-Servern kommt aus Sicherheitsgründen ausschließlich Open Source Software zum Einsatz. Die Festplatten sind mit LUKS voll verschlüsselt - und auch alle Verbindungen zwischen unseren Servern sind verschlüsselt. Weitere Informationen finden Sie auf unserer Nachhaltigkeits-Seite und auf unserer Infoseite-Verschlüsselung. Posteo-Algebra Posteo gibt es seit 15 Jahren + 180 Tagen Schulden & Kredite 0 EUR Einnahmen durch Werbung 0 EUR Betriebliche Flugkilometer seit Gründung 0 km Tracking und Social-Media-Einbindung 0 Stk. Atommüll pro Postfach 0 gr. Vergessene Passwörter 166417 + (X) (Dunkelziffer unbekannt) Jetzt anmelden. Hier können Sie Ihr Posteo-Postfach für 1 EUR/Monat eröffnen und sofort nutzen. Sie müssen bei der Anmeldung keine persönlichen Daten angeben. Weiter zur Anmeldung >>'''
year_published = 2025
