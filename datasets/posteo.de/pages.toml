description = "Posteo est un fournisseur de messagerie innovant misant sur la durabilité et la protection de la vie privée. Il fonctionne entièrement sans publicité. Nos boîtes mail, calendriers et carnets d'adresse peuvent être syncrhonisés: nous utilisons un concept de chiffrement global."
full_description = "Énergie Source: https://green-planet-energy.de/geschaeftskunden/gewerbestrom Nos serveurs et nos locaux sont alimentés à 100 % avec de l'électricité verte de Green Planet Energy. Ce fournisseur fait produire son énergie par des centrales hydrauliques et des éoliennes installées en Autriche et en Allemagne. Green Planet Energy ne fait pas de compromis quant à sa conception de la fourniture en énergie ou de la promotion de nouvelles installations : Pas de « greenwashing » : Green Planet Energy ne classe pas l'énergie provenant des centrales à charbon ou nucléaires comme verte. Green Planet Energy est le seul fournisseur d'énergie en Allemagne à respecter les critères d'électricité de l'organisation environnementale Greenpeace. Transparence : Green Planet Energy publie toutes les centrales électriques de ses fournisseurs pour ses clients. Promotion des installations neuves : Green Planet Energy soutient le développement des énergies renouvelables : par exemple, via la construction de centrales neuves et propres, ou les investissements dans les modèles d'approvisionnement en énergie écologiques et décentralisés. Engagement politique : Green Planet Energy s'implique dans les débats politiques et les processus législatifs afin de faire avancer activement la transition énergétique. 2018 : Posteo sponsorise l'approvisionnement en électricité verte de son nouveau centre de données. Grâce à un sponsoring de 25 000 euros pour le raccordement à l'électricité verte, nous avons pu contribuer en 2018 à ce qu'un nouveau centre de données de notre opérateur à Francfort-sur-le-Main soit également alimenté en véritable électricité verte par Green Planet Energy (qui s'appelait encore à l'époque Greenpeace Energy). Au printemps 2020, nous avons mis en service le nouveau site supplémentaire à Francfort-sur-le-Main. Depuis septembre 2023 : un complément pour l'électricité verte Nous voulons soutenir la véritable électricité verte, même en dehors de nos bureaux. C'est pourquoi nous soutenons les membres de notre équipe en leur accordant un complément mensuel forfaitaire de 50 € s'ils font usage de véritable électricité verte (provenant de fournisseurs sélectionnés) pour leur approvisionnement privé en électricité. Bureau et entreprise Pas d'avion : Posteo renonce complètement, pour la protection du climat, aux voyages d'affaires en avion dès sa création en 2009. Jours de vacances supplémentaires pour les voyages en train : Posteo subventionne des jours de vacances supplémentaires pour les voyages en train, qui sont respectueux du climat, lorsque les employés renoncent à prendre l'avion pour un voyage privé dans le cadre de leurs vacances. Tickets de transports en commun gratuits : nos employés obtiennent une carte annuelle gratuite pour les transports en commun locaux. Cantine bio et végétarienne gratuite : Posteo offre quotidiennement à ses employées et employés un repas de midi végétarien. Les coûts de cette offre (notamment d'un cuisinier attitré) sont pris en charge entièrement par l'entreprise. Boissons bio et snacks bio : au sein du bureau Posteo, du café, du thé, des boissons froides, des fruits, légumes et snacks de qualité bio sont mis à disposition. Responsabilité sociale en tant qu'employeur : Posteo emploie toutes ses employées et tous ses employés en contrat à durée indéterminée. Afin de faciliter la conciliation de la vie professionnelle et de la vie familiale, nous utilisons la flexibilité des horaires et diverses possibilités de temps partiel dans l'entreprise. Il y a également un bureau parent-enfant. Réparation gratuite des vélos : les employés Posteo peuvent faire réparer leur vélo gratuitement au sein de l'entreprise par un mécanicien vélo. Papier recyclé : utilisation de 100% de papier recyclé à tous les niveaux de l'entreprise. Régulation du chauffage informatisée : elle permet d'optimiser la consommation d'énergie en adaptant la température des pièces en fonction des besoins (nuits, week-end, fenêtre ouverte). Matériel efficace du point de vue énergétique : nous misons sur du matériel à l'efficacité énergétique prouvée et peu polluant. Nouvelles acquisitions faites selon le principe de durabilité : lorsque nous acquérons de nouveaux objets, nous ne faisons pas notre choix en fonction du prix mais de la durabilité de chaque produit. Meubles : nos locaux, le Lab Posteo inclus, sont équipés de tables en bois certifié FSC ainsi que de meubles de bureau constitués de matériaux recyclés. Finances Financement : Posteo fonctionne de manière durable. L'entreprise n'a ni dettes, ni crédit. Il n'y a pas non plus d'investisseurs. Posteo n'a qu'une seule source de revenus : les contributions de ses utilisatrices et utilisateurs. Elles nous permettent un travail indépendant et orienté vers la protection des données. Par exemple, nous pouvons renoncer complètement au traçage car nous n'avons pas besoin de revenus provenant de la publicité, ceci grâce au financement par les utilisateurs. Compte de l'entreprise : nous nous engageons à la durabilité, même quand il s'agit d'argent. Le crédit des clients de Posteo est géré par la banque sociale et écologique GLS Bank, chez qui nous avons ouvert un compte. La GLS Bank utilise l'argent exclusivement pour financer des projets écologiques et sociaux. Économies : nous avons placé nos économies auprès de la banque écologique Umweltbank. Avec cet argent, cette banque soutient des projets écologiques, avant tout dans le domaine des énergies renouvelables, des constructions à basse consommation énergétique, de la production écologique, de l'économie circulaire, de l'agriculture écologique et du recyclage. Dons : nous donnons régulièrement à des ONG qui travaillent dans le domaine de la protection de l'environnement. Quand des clients de Posteo résilient leur compte, ils peuvent faire don de leur crédit restant par notre biais. Auditeurs : chaque année, nous nous faisons volontairement contrôler par une grande société d'audit indépendante. Technique Une minimisation des données pour la protection du climat : en renonçant à des enregistrements et suivis inutiles, nous économisons de l'énergie et du matériel. Matériel efficace du point de vue énergetique : dans notre bureau et dans nos serveurs, nous misons sur du matériel efficace du point de vue énergétique. Rejet des spams : Par défaut, le dossier spam est désactivé chez Posteo. Ainsi, les e-mails identifiés comme spam ne sont pas acceptés par notre serveur. En rejetant les spams, nous préservons l’espace de stockage de nos utilisateurs et économisons des ressources. Si vous activez le journal de spam, vous serez toujours informé de tous les e-mails rejetés. Mais vous pouvez tout de même activer également le dossier spam chez Posteo. Greylisting : ce qu'on appelle le greylisting (inscription sur liste grise) écarte la plupart des spams de nos serveurs et réduit ainsi le besoin en électricité de façon très importante. Service de migration : le service de migration facilite le déménagement vers Posteo et permet ainsi de résilier vos anciennes boîtes mail. Programmation efficace : nous évitons le gaspillage en énergie en gérant de façon optimisée nos procédés coûteux en énergie. Des serveurs dimensionnés de façon adaptée : nos systèmes sont dimensionnés conformément aux besoins de nos utilisateurs et peuvent évoluer en fonction des besoins. Cela permet d'économiser des ressources : les environnements de serveurs surdimensionnés sont très souvent d'énormes gaspilleurs d'électricité. Absence de publicité Pas de financement par la publicité : l'existence de nombreux services en ligne dépend de l'argent et de la bonne volonté des annonceurs. Posteo est un fournisseur indépendant géré de façon durable et financé uniquement par les contributions de ses clients. Minimisation des données grâce à l'absence de publicité : nous n'avons aucun intérêt à vendre les données de nos clients au secteur publicitaire. C'est pour cela que nous renonçons complètement aux annonceurs et que notre site ne comporte aucun outil de suivi (tracking). Par principe, nous ne collectons aucunes données à caractère personnel de nos clients. Les données de paiement sont séparées par principe des boîtes mail."
year_published = 2025
clearnet = "https://posteo.de/fr/site/durabilite"
