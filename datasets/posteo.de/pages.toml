["https://posteo.de/site/datenschutzerklaerung"]
title = "E-Mail grün, sicher, einfach und werbefrei - posteo.de - Datenschutzerklärung"
description = "Posteo ist ein innvovativer E-Mail-Anbieter, der auf Nachhaltigkeit und Datenschutz setzt und komplett Werbefrei ist. Unsere E-Mail-Postfächer, Kalender und Adressbücher sind synchronisierbar - wir setzen auf umfassende Verschlüsselung."
full_description = 'Datenschutzerklärung Posteo steht für maximalen Datenschutz, Datensparsamkeit und Privacy by Design: Wir zeigen, wie ein Internetdienst konsequent ohne Datensammeln, Tracking und Werbefinanzierung betrieben werden kann. So erheben wir grundsätzlich keine Bestandsdaten wie Namen oder Adressen. Unsere Website und der Webmailer sind werbe- und trackingfrei. Wir verzichten außerdem auf das Einbinden von Social-Media-Plugins, verwenden keine Google-Produkte. In dieser Datenschutzerklärung geben wir Ihnen einen Überblick über den Datenschutz bei Posteo. Rechtsgrundlage Die Erbringung unserer E-Mail-Dienstleistungen erfordert die Verarbeitung von Daten und erfolgt entsprechend den gesetzlichen Vorschriften. Für den Datenschutz sind insbesondere die Datenschutzgrundverordnung (DSGVO), das geltende Bundesdatenschutzgesetz (BDSG), das Telemediengesetz (TMG) sowie das Fernmeldegeheimnis maßgeblich. Die Dienste von Posteo werden ausschliesslich auf unseren Servern in Deutschland gehostet. Verantwortlich: Diese Datenschutzinformation gilt für die Verarbeitung durch Posteo e.K. Methfesselstrasse 38 10965 Berlin E-Mail: support@posteo.de Betrieblicher Datenschutzbeauftragter: Niels Herrmann E-Mail: datenschutz@posteo.de Der betriebliche Datenschutzbeauftragte von Posteo e.K. ist auch unter der oben stehenden Postanschrift erreichbar (Adresszusatz: "Datenschutzbeauftragter Niels Herrmann"). Im November 2016 hat die Bundesdatenschutzbeauftragte(BfDI) einen anlasslosen Kontrollbesuch zum Datenschutz bei Posteo durchgeführt. Es gab keine Beanstandungen und die BfDI lobte ausdrücklich unser Datenschutzkonzept. Den vollständigen Prüfbericht finden Sie hier. Keine Bestandsdaten Wir erheben und speichern grundsätzlich keine Bestandsdaten (wie Namen, Adressen, etc.) von Ihnen. Sie geben bei der Registrierung weder Bestandsdaten an, noch werden sonstige personenbezogene Daten erhoben. Wir beugen mit dieser konzeptionellen Datensparsamkeit effektiv Datendiebstählen vor: Nur Datensätze, die bei einem Unternehmen nicht vorliegen, können mit 100-prozentiger Sicherheit nicht entwendet werden. Darüber hinaus werden Bezahldaten bei Posteo nicht mit Ihrem Postfach verknüpft. Deshalb liegen bei uns insgesamt tatsächlich keine Bestandsdaten zu Ihrem Posteo-Postfach vor. In anderen Worten: Posteo führt keinen Datensatz mit Kundendaten bzw. personenbezogenen Daten zu Ihrem Postfach. Dies wurde 2017 nach einer Vor-Ort-Prüfung in einem Prüfbericht der Bundesdatenschutzbeauftragten unabhängig bestätigt. Nutzungsdaten: Keine IP-Adressen Die Nutzungsdaten sind alle Daten, die durch die Nutzung von Posteo anfallen. Wir erheben und speichern rechtskonform grundsätzlich keine auf Kunden beziehbaren IP-Adressen. Dies wird im Prüfbericht der Bundesdatenschutzbeauftragten zu Posteo unabhängig bestätigt. Wir erheben Ihre IP-Adresse auch nicht, wenn Sie unsere Website besuchen, unser Kontaktformular oder den Webmailer nutzen. Wir erheben oder speichern Ihre IP-Adresse auch nicht, wenn Sie E-Mails über IMAP oder POP3 abrufen oder mit einem externen Client über SMTP bei uns zum Versand einliefern. Bei der Kommunikation zwischen E-Mailservern über SMTP werden uns IP-Adressen anderer E-Mail-Server bekannt, also z.B. IP-Adressen von GMX- oder Gmail-Servern. Die IP-Adressen der Anbieter-Server werden nur in Fehlerfällen in den Logfile-Protokollen aufgeführt und nach 7 Tagen gelöscht. Wir protokollieren lediglich Fehler beim Senden und Empfangen von E-Mails, um technische Störungen und Fehler rasch nachvollziehen und beseitigen zu können. Diese nicht personenbeziehbaren Daten löschen wir automatisiert nach 7 Tagen. Außerdem erstellen wir allgemeine, anonyme System-Nutzungs- bzw. Auslastungsstatistiken. Auch diese Statistiken enthalten keine personenbeziehbaren Daten oder IP-Adressen. Inhaltsdaten Inhaltsdaten sind als Begriff rechtlich nicht definiert. Wir sprechen in diesem Zusammenhang von den gespeicherten Inhalten eines Postfaches. Die Inhalte einer Kommunikation und ihre näheren Umstände (E-Mails und deren Metadaten) unterliegen dem Fernmeldegeheimnis (auch Telekommunikationsgeheimnis) und sind grundrechtlich geschützt. Das bedeutet: Niemand darf Ihre E-Mails lesen - und wir dürfen sie auch nicht an Dritte weitergeben. Das wäre eine Verletzung Ihrer Grundrechte und strafbar. Eingeschränkt werden kann das Fernmeldegeheimnis nur im Einzelfall und nur durch einen Richter, beim Verdacht auf bestimmte Straftaten. Technisch schützen wir Ihre Inhaltsdaten stets mit neuesten Sicherheitstechnologien, siehe Infoseite Verschlüsselung. Die Inhaltsdaten werden außerdem stets auf verschlüsselten Festplatten gespeichert, um sie vor physischen Zugriffen zu schützen. Wir betreiben und pflegen eine eigene Server-Infrastruktur, Serverstandort und Speicherort aller Daten ist Deutschland. Wir sichern Inhaltsdaten täglich in Sicherheits-Backups, und heben diese für die Dauer von 7 Tagen auf. Bitte erstellen Sie zur Sicherheit jedoch zusätzlich selbst regelmäßig Kopien Ihrer Inhaltsdaten, falls Sie solche einmal versehentlich löschen. Wir bieten zusätzlich die Möglichkeit, die bei Posteo gespeicherten E-Mail-, Notiz-, Adressbuch- und Kalenderdaten auf unseren Servern individuell mit dem Postfach-Passwort verschlüsselt abzuspeichern (AES-Verschlüsselung). Das können Sie in den Einstellungen Ihres Postfachs auf Knopfdruck tun. Nutzer einer Ende-zu-Ende-Verschlüsselung können allen neu eingehenden E-Mails mit der Eingangsverschlüsselung eine weitere Verschlüsselungsschicht hinzufügen. Löschen Sie Inhaltsdaten, sind diese sofort gelöscht. Wurden die Daten zuvor in einem unserer täglichen Sicherheits-Backups gespeichert, verbleiben sie dort weitere 7 Tage, bis sie auch dort restlos gelöscht sind. Posteo löscht Inhaltsdaten grundsätzlich nicht aus einem Postfach, so lange das Vertragsverhältnis besteht und das Postfach nicht ordentlich durch Sie oder durch Posteo gemäß unserer AGB gekündigt wurde. Die automatisierte Spam- und Virenerkennung erfolgt bei Posteo ohne Personenbezug und es werden keine Profile erstellt. Wir führen die Spamerkennung selbst durch. Dazu nutzen wir auch Blacklists von Drittanbietern, aber rein lokal auf unseren Servern. Die Inhalte unserer Nutzerinnen und Nutzer werden nicht durch bzw. über Dritte analysiert, und auch grundsätzlich nicht auf Spamerkennungs-Softwares bei Dritten verarbeitet. Drittanbieter erhalten auch keine Informationen über Ergebnisse der Spamerkennung bei Posteo. Bezahldaten: Nicht mit den Postfächern verknüpft Bei Überweisungen oder Paypal-Zahlungen wird Ihr Name oder der Name der bezahlenden Person sowie bei Überweisungen eine IBAN an uns übermittelt. Vom Kreditkartenunternehmen erhalten wir keine Daten über den Einzahlenden. Bezahldaten werden bei Posteo grundsätzlich nicht mit den E-Mail-Postfächern verknüpft, sodass übermittelte Einzahlerdaten nicht zum Postfach vorliegen. Wir verwenden bereits seit unserer Gründung 2009 ein eigenes Anonymisierungsverfahren für alle Bezahlvorgänge, das diese vollständig von den Postfächern trennt. Auf unserer Infoseite Bezahlung finden Sie ausführliche Informationen zu diesem Thema. Das Verfahren schützt Ihre sensiblen Bezahldaten bestmöglich vor etwaigen Datendiebstählen und vor Missbrauch. Da in Ihrem Posteo-Postfach keine Bezahlinformationen hinterlegt werden, können Sie bei uns keinen Dauerauftrag einrichten: Sie bezahlen Ihr Postfach stets im Voraus (Prepaid). Sie bekommen für Ihre Vorabzahlung einen Beleg ohne Namen, Anschrift und Mehrwertsteuerausweis. Dieser Beleg ist ein steuerrelevanter Zahlungsnachweis. Wir sind gesetzlich verpflichtet, die Belege über alle Zahlungen aus steuerlichen Gründen 10 Jahre aufzubewahren, die Belege werden nur zu diesem Zweck vorgehalten. Unser Verfahren zum Anonymisieren der Bezahlvorgänge wird auch im Prüfbericht der Bundesdatenschutzbeauftragten zu Posteo erwähnt und es wird bestätigt, dass die Bezahldaten nicht mit den Postfächern verknüpft werden. Bereits 2014 hatte die Bundesregierung in ihrer Antwort auf eine Anfrage des ehemaligen Bundestagsabgeordneten Hans-Christian Ströbele bestätigt, dass es für E-Mail-Anbieter keine Pflicht zum Verknüpfen von Bezahldaten und E-Mailpostfächern gibt. Keine Schufa-Nutzung/Inkasso Wir fordern keine Schufa-Auskünfte oder sonstige Bonitätsauskünfte über Sie ein. Bei Zahlungsverzug nehmen wir auch keine Dienste von Inkassounternehmen in Anspruch. Bei Posteo zahlen Sie Prepaid, im Voraus. Keine Werbung, kein Tracking, kein Einbinden von Social Media und Google-Produkten Posteo ist frei von Tracking-Tools und Werbeeinblendungen. Wir versenden auch keine Werbe-Mails an Sie. Wir arbeiten unabhängig und haben keine Werbepartner: Nur so kann ein Internetdienst tatsächlich datenschutzfreundlich betrieben werden. Unsere Website ist darüber hinaus frei von Social-Media-Plugins wie Facebook, Twitter und Co. Würden wir solche Plugins auf unserer Website einbinden, würden Nutzungs- und personenbezogene Daten wie IP-Adressen an diese Dienste übermittelt. Das möchten wir nicht. Wir verwenden auch keine Google-Produkte wie etwa Google Analytics oder so genannte Captchas von Drittanbietern: Das Captcha, mit dem bei der Registrierung Sicherheitsfragen gestellt werden, wurde von Posteo selbst programmiert und erhebt keine Daten von Ihnen, wie etwa Ihre IP-Adresse. Den Posteo-Newsletter können Sie auf Wunsch selbst per "Opt-in" in den Einstellungen Ihres Postfachs abonnieren. Sie haben jederzeit die Möglichkeit, den Newsletter wieder abzubestellen. Datenschutzfreundlicher Passwort-Reset Sie können in den Einstellungen Ihres Postfachs unsere "Passwort Vergessen"-Funktion für Ihre Mobilfunknummer aktivieren. Im Falle eines Passwortverlustes können Sie sich ein neues Passwort per SMS zusenden. Ihre sensible Mobilfunknummer wird uns nicht übermittelt, wenn Sie die Funktion aktivieren. Wir erhalten nur ein mathematisches Berechnungsergebnis (einen gesalteten Hash), das wir noch einmal zusätzlich absichern. Diese Daten sind nur noch Zeichenfolgen - und nach einer Entscheidung der Bundesnetzagentur zu Posteo aus dem Jahr 2017 keine Bestandsdaten. Staatlichen Stellen gegenüber sind sie deshalb nicht auskunftspflichtig. Sie können die Funktion jederzeit in den Einstellungen Ihres Postfachs wieder deaktivieren, dabei wird auch die Zeichenfolge gelöscht. Posteo-Umzugsservice: Sicherer Datentransfer ohne Drittanbieter Wir setzen bei Posteo einen Umzugsservice aus eigener Entwicklung ein, da wir für den Transfer Ihrer sensiblen E-Mail-Daten aus Datenschutzgründen keine Lösungen von Drittanbietern nutzen oder empfehlen wollen. Mit dem Posteo-Umzugsservice können Sie externe E-Mailpostfächer anderer Anbieter (z.B. GMX, web.de, iCloud u.v.a.) inkl. aller Ordnerstrukturen (unbegrenzte Ordnertiefe) sicher zu Posteo umziehen. Sie entscheiden, ob Sie den gesamten Inhalt Ihres bisherigen E-Mail-Postfachs oder nur ausgewählte Ordner kopieren. Die ausgewählten Ordner werden durch Posteo direkt bei Ihrem bisherigen Anbieter abgerufen und über verschlüsselte Verbindungen direkt in Ihr Posteo-Postfach übertragen. Ihre Daten werden zu keinem Zeitpunkt über Drittanbieter geleitet. Von vielen Anbietern (z.B. GMX, web.de, iCloud u.v.a.) können inzwischen auch Adressbuch- und Kalenderdaten auf diese Weise zu Posteo transferiert werden. Den Posteo-Umzugsservice haben wir nach unserem Grundsatz der maximalen Datensparsamkeit konzipiert. Nach dem Umzug können Sie regelmäßig neu eingehende E-Mails von Ihrem alten Postfach abholen lassen. Zunächst nur für drei Monate, Sie können das Abholen jederzeit und unbegrenzt verlängern. Für einen Sammeldienst eingegebene Daten werden verschlüsselt gespeichert, bis der Sammeldienst von Ihnen gelöscht wird. Beim Umzugsservice werden eingegebene Daten nur für die Dauer des Umzugs verschlüsselt im Arbeitsspeicher vorgehalten. Datenimport/-export Ihre Daten gehören Ihnen: Sie können alle bei uns gespeicherten Daten (E-Mail-, Adressbuch-, Kalenderdaten, Notizen) auch jederzeit mit Hilfe dafür vorgesehener offener Standards und frei verfügbarer Anwendungsprogramme exportieren - und lokal sichern. Genauso besteht umgekehrt die Möglichkeit, Daten auf diesselbe Weise zu importieren. Diese Standards sind: IMAP, POP3, SMTP, CardDAV und CalDAV. In unserer Hilfe bieten wir Anleitungen rund um den Datenimport bzw. -export an. Alternativ können Sie in vielen Fällen für den Import auch unseren Umzugsservice benutzen. Keine Tracking-Cookies Wir verwenden keine Tracking- oder Analyse-Cookies. Für die Anmeldung nutzen wir im Kundenmenü und im Webmailer lediglich so genannte Session-Cookies. Die Daten, die dabei auf Ihrem Computer gespeichert werden, dienen ausschliesslich der Anmeldung und werden insbesondere nicht dazu verwendet, Nutzerprofile oder dergleichen zu erstellen. Die Session-Cookies werden nach dem Ende der jeweiligen Sitzung wieder gelöscht. Wenn Sie die einfache Version unserer Startseite nutzen (ECO-Switch), wird außerdem ein Cookie benutzt, das nur eine Information speichert: Die Information, dass der Browser beim Aufruf unserer Seite die einfache Version der Startseite anzeigen soll. Wechseln Sie zur regulären Startseite, wird das Cookie gelöscht. Auch dieses Cookie wird nicht dazu verwendet, Sie zu tracken bzw. Nutzerprofile von Ihnen zu erstellen. Kundendienst ohne Speicherung persönlicher Daten Sie können sich mit Fragen und Problemen zu Ihrem Posteo-Postfach jederzeit kostenfrei per E-Mail unter support@posteo.de an unseren Kundendienst wenden oder das Kontaktformular auf unserer Website verwenden. Unser Team steht Ihnen auf Deutsch, Englisch und Französisch zur Verfügung. Daten, die Sie uns in Ihrer Anfrage freiwillig per E-Mail zusenden, wie etwa eine alternative E-Mail-Adresse für die Kontaktaufnahme oder Ihr Anliegen, werden nicht als Information zu Ihrem Posteo-Postfach gespeichert. Wir erheben keine IP-Adressen, wenn Sie unser Kontaktformular nutzen. Unser Kundendienst arbeitet aus Datenschutzgründen auch vollständig ohne Kundendatenbank und Ticketsystem: es wird keine Dokumentation zu Ihrer Kontaktaufnahme oder zu Ihren Anfragen an unseren Kundendienst erstellt. Ihre Anfrage wird lediglich per E-Mail durch unser Team beantwortet. Hierfür werden ausschliesslich Open Source-E-Mail-Programme auf verschlüsselten Rechnern eingesetzt. Die E-Mail-Kommunikation wird 14 Tage nach Erledigung eines Falles automatisiert vollständig bei uns gelöscht. Geben Sie Text in unser Kontaktformular ein, bleibt er bis zum Absenden lokal auf Ihrem Gerät. Posteo steht für echtes "Privacy by Design": Ggf. angezeigte Lösungsvorschläge werden lokal in Ihrem Browser vorgehalten und beim Eintippen von Schlagworten angezeigt. Während Sie tippen, werden keine Daten durch das Internet an Posteo übertragen, um sie dort mit einer Schlagwort-Datenbank abzugleichen. Keine Daten-Weitergabe an Dritt-Unternehmen Wir geben zu keinem Zeitpunkt personenbezogene Daten an Dritt-Unternehmen oder Dienstleister weiter. Alle Daten werden ausschliesslich in Deutschland auf unseren Serve'
