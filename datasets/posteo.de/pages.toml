["https://posteo.de/site/bewerberdatenschutz"]
title = "E-Mail grün, sicher, einfach und werbefrei - posteo.de - Datenschutzerklärung im Bewerberverfahren"
description = "Posteo ist ein innvovativer E-Mail-Anbieter, der auf Nachhaltigkeit und Datenschutz setzt und komplett Werbefrei ist. Unsere E-Mail-Postfächer, Kalender und Adressbücher sind synchronisierbar - wir setzen auf umfassende Verschlüsselung."
full_description = 'Datenschutzerklärung im Bewerberverfahren Die folgenden Datenschutzhinweise gemäß Art. 13, 14 DS-GVO gelten im Zusammenhang mit einer Bewerbung um einen Arbeitsplatz bei Posteo Verantwortlich: Diese Datenschutzinformation gilt für die Verarbeitung durch Posteo e.K. Methfesselstrasse 38 10965 Berlin E-Mail: jobs@posteo.de Betrieblicher Datenschutzbeauftragter: Niels Herrmann E-Mail: datenschutz@posteo.de Der betriebliche Datenschutzbeauftragte von Posteo e.K. ist auch unter der oben stehenden Postanschrift erreichbar (Adresszusatz: "Datenschutzbeauftragter Niels Herrmann"). Im November 2016 hat die Bundesdatenschutzbeauftragte(BfDI) einen anlasslosen Kontrollbesuch zum Datenschutz bei Posteo durchgeführt. Es gab keine Beanstandungen und die BfDI lobte ausdrücklich unser Datenschutzkonzept. Den vollständigen Prüfbericht finden Sie hier. Verarbeitungszweck und Rechtsgrundlage für die Verarbeitung Ihre Daten werden zum Zweck der Durchführung des Bewerbungsverfahrens verarbeitet. Rechtsgrundlage für die Verarbeitung der personenbezogenen Daten ist Art. 6 Abs. 1 b) DSGVO in Verbindung mit § 26 BDSG. Die Bereitstellung der Daten ist zur Durchführung vorvertraglicher Maßnahmen erforderlich. Eine Pflicht bestimmte Daten uns gegenüber bereitzustellen besteht nicht. Dauer, für die die personenbezogenen Daten gespeichert werden Ihre Bewerbungsunterlagen werden für die Dauer des Bewerbungsverfahrens aufbewahrt. Die Unterlagen werden im Fall einer Absage für die Dauer bis zum Ablauf möglicher Rechtsbehelfsfristen in der Regel 70 Tagen nach Zugang unserer Entscheidung gelöscht (längstens aber nach 6 Monaten). Auf Wunsch senden wir Bewerbungsunterlagen welche wir in Papierform erhalten haben zurück. Ihre Rechte Sie haben gemäß Art. 15 DSGVO das Recht, von Posteo e.K. eine Bestätigung darüber zu verlangen, ob bei uns Sie betreffende personenbezogene Daten verarbeitet werden. Sie haben gemäß Art. 16 DSGVO das Recht, unverzüglich das Berichtigen oder Vervollständigen von personenbezogenen Daten zu verlangen, die bei einem Unternehmen zu Ihnen gespeichert sind. Sie haben gemäß Art. 17 DSGVO das Recht, das unverzügliche Löschen von personenbezogenen Daten zu verlangen, die bei einem Unternehmen zu Ihnen gespeichert sind. Ist im Bewerbungsprozess von Posteo eine Absage ausgesprochen worden, heben wir die Daten bis zum Ablauf einer möglichen Anspruchs- bzw. Klagefrist auf. Sie haben gemäß Art. 18 DSGVO das Recht, eine Einschränkung der Verarbeitung von personenbezogenen Daten zu verlangen, die bei einem Unternehmen zu Ihnen gespeichert sind. Dazu müssten Sie Ihre Bewerbung zurückziehen. Geben Unternehmen personenbezogene Daten an Dritte weiter, so muss das Unternehmen gemäß Art. 19 DSGVO diesen Empfängern mitteilen, wenn personenbezogene Daten berichtigt oder gelöscht wurden. Sie haben das Recht, bei Unternehmen zu erfragen, an welche Empfänger diese Informationen gingen. Posteo e.K. gibt keine Bewerbungsdaten an Dritte weiter. Haben Sie einem Unternehmen in einem automatisierten Verfahren personenbezogene Daten bereitgestellt, haben Sie gemäß Art. 20 DSGVO das Recht, die dort über Sie gespeicherten personenbezogenen Daten in einem strukturierten, gängigen und maschinenlesbaren Format zu erhalten oder die Übermittlung an einen anderen Verantwortlichen zu verlangen. Zumindest, so weit dies technisch machbar ist. Posteo setzt kein automatisiertes Verfahren zur Erhebung personenbezogener Daten im Bewerbungsprozess ein. Sie haben gemäß Art. 21 DSGVO das Recht, dem Verarbeiten von personenbezogenen Daten bei einem Unternehmen zu widersprechen. Dazu müssten Sie Ihre Bewerbung zurückziehen. Sie haben gemäß Art. 22 DSGVO das Recht, nicht einer auf einer automatisierten Verarbeitung – einschließlich Profiling – beruhenden Entscheidung unterworfen zu werden. Bei Posteo werden wir Sie zu keinem Zeitpunkt einer auf einer automatisierten Verarbeitung (einschließlich Profiling) beruhenden Entscheidung unterwerfen. Speichert ein Unternehmen personenbezogene Daten von Ihnen, muss es Sie gemäß Art. 34 DSGVO unverzüglich darüber informieren, wenn der Schutz dieser Daten verletzt wurde. Beschwerderecht bei einer Aufsichtsbehörde Gemäß Art. 77 DSGVO haben Sie das Recht, sich bei einer Aufsichtsbehörde zu beschweren. Die zuständige Aufsichtsbehörde ist: Der Bundesbeauftragte für den Datenschutz und die Informationsfreiheit (BfDI) Husarenstr. 30 53117 Bonn'
