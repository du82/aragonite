["https://posteo.de/en/help/change-posteo-domain-to-posteo.com"]
title = "Help - How can I change my Posteo account to posteo.com? - posteo.de"
full_description = 'You can change your login address to another email domain like posteo.com, posteo.us, or posteo.uk. How to change the domain of your Posteo account Open Settings. Open My Account. Choose Email aliases. Open the link Change email domain. Required: Activate the "forgotten password" feature. With the "forgotten password" feature you can quickly and easily authenticate, in case you forget the new login. Choose the desired email domain from the drop-down menu next to your name. In this example, we are using posteo.com. Confirm the change with Select domain. Please note: When you change your domain, your username for logging in with all email clients and webmail will be converted into an email alias, so that you can continue to receive emails at that address. You can delete this alias at any time. Tick the box next to I understand that my username for logging in will change. Type your Posteo password into the respective field. Confirm the domain change with Change email domain and logout. You will now be logged out of the account. Your new email address and your new login will be active immediately. Notice: Changing the domain is possible once per year. If you have accidentally chosen the wrong domain, please contact our customer support at support@posteo.de. Related help articles Which domains are available for Posteo alias addresses? How do I add or remove an email alias?'
