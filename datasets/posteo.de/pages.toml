title = "Email green, secure, simple and ad-free - posteo.de -"
description = "Posteo is an innovative email provider that is concerned with sustainability and privacy and is completely ad-free. Our email accounts, calendars and address books can be synchronised - we use comprehensive encryption."
full_description = '''Press reviews Indeed, the company has been a global leader in rolling out secure technologies. The Guardian Make an account with German service Posteo instead of with Googlemail. Planet Wissen With Posteo, the user sets up their account anonymously and also pays anonymously. Posteo even implements two-factor authentication (2FA, a security feature) anonymously. Stiftung Warentest Berlin company Posteo has this Monday presumably become the first email provider in the world to implement modern DANE technology, which ensures encrypted transport of emails. Heise Posteo is not merely a commercial project. Its absolute commitment to privacy shows that communications providers can also think and act politically. Deutschlandfunk Posteo works with all current encryption methods. Above all else, it collects as little data as possible from its customers. FAZ There are many email providers, but Posteo stands out from the crowd. The small Berlin company not only operates with optimum security and privacy, but also has an especially sustainable philosophy. Ökotest Verlag (Markt und Medien) Certificate pinning is a relatively new standard, which works towards restoring trust in encryption on the web. (...) Posteo is now the first larger German provider to test this concept in practice. Heise As an alternative to the main email providers, WDR internet expert Jörg Schieb recommends an account with the German service "Posteo", which is completely ad-free and highly values the privacy of data and personal information. ard.de To establish trust in the company's integrity, Posteo in May 2014 became the first German email provider to publish a transparency report on requests from authorities. Technology Review The former Greenpeace activists at Posteo comply with applicable laws with more discipline than the investigative authorities prefer to. Technology Review Posteo is one of the most unusual German start-ups: The email provider declines to use advertising and wants to collect as little data from its users as possible. c't magazin Posteo, on the other hand, impressed. The small email provider was the only German email service to offer encryption with Forward Secrecy for all email protocols. c't magazin Berlin-based provider Posteo offers a lot of comfort, great features and a high security standard, for little money. Computerbild Posteo operates with green energy, its own capital and permanent employee contracts in order to offer secure email accounts. The Berlin company is up with the times. Tagesspiegel Crypto mail storage provides Posteo customers with personalised encryption of their entire email data at the click of a button. Linux-Magazin Well before the NSA scandal, a small team in Berlin had already thought about secure – and above all else, truly private – email communication, founding the email service Posteo in 2009. Chip Most reports and articles concentrate almost exclusively on Posteo's stance on privacy and data security. The plan to establish an alternative email provider originally arose out of an ecological motivation. Stiftung Futur Zwei The transparency report presented today by Posteo levels fierce criticism at the practice of requests from authorities. netzpolitik.org One distinctive feature is that with Posteo, address books and calendars added online can be encrypted by the user. Spiegel Online An account with 2 GB storage space costs 1 EUR per month – for that fee it is ad-free, the servers are run using green energy from Greenpeace Energy, and support by email is free of charge. SZ One special feature is that Posteo allows its users to save their complete email, address book and calendar data in encrypted stores. c't magazin Those who wish to open an entirely anonymous email account can do so knowing that the payment information isn’t associated with the account. Irish Times The account costs 1 EUR per month, for which the customer receives 2 GB storage space and the assurance of being with a company that uses green energy and an account with the GLS Bank. Berliner Zeitung Accessing emails, appointments and contact information is possible on all platforms such as OS X, iOS, Android and Windows. Macwelt In Germania va forte Posteo, un servizio di email ultra sicuro che promette di non conservare alcune informazione identificativa relativa ai messaggi scambiati La Stampa La start-up berlinoise, spécialisée dans les boîtes mails sécurisées et payantes est devenue en quelques années le leader mondial du secteur. ParisBerlin Magazine Privacy-oriented email provider Posteo has introduced password-based encryption of entire accounts on its servers. This is activated by the user in the settings and then occurs automatically with the user's password. N24 Privacy is ensured by encryption and IP stripping, whereby Posteo’s server replaces your IP with theirs anytime you send an email. Also, no ads are served nor is user data tracked. Irish Times Your environmental conscience can also be improved with a Posteo account, as the company places particular value in energy efficiency and protecting the environment. Macwelt'''
