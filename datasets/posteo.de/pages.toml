full_description = "KiKA-Sendung: Hacker - digitale Diebe? Erstellt am 10. Februar 2019, 08:20 Uhr | Kategorie: Medien Der KiKA ist in der aktuellen Folge der Sendung “Timster” unter anderem der Frage nachgegangen, wie man sich vor Hackern schützen kann. Die Tipps sind auch für Erwachsene sehenswert. Hinweis: Der Beitrag ist derzeit nicht verfügbar, die Verweildauer von Inhalten in der Mediathek wird durch rechtliche und redaktionelle Vorgaben bestimmt. zum Artikel Posteo – Das grüne Postfach Erstellt am 20. Juni 2018, 17:00 Uhr | Kategorie: Medien Überwachungseklats, Datenschutzskandal, Phishing – In Deutschland gilt das Postgeheimnis. Kann man das nicht ebenso im digitalen Postfach halten? Kann man! Sogar grün und das seit zehn Jahren mit Posteo. Damals gründete das Ehepaar Sabrina und Patrik Löhr den Maildienst Posteo. Die beiden Unternehmer lernten sich durch ihr ehrenamtliches Engagement bei Greenpeace kennen. Sie war vorher im Bereich Öffentlichkeitsarbeit tätig, er arbeitete in der System- und Mailadministration. Schon früh war Patrik Löhr klar, dass man eine Möglichkeit für umweltschonenden und sicheren Mailverkehr entwickeln kann. 2009 hatten beide dann die Idee für das grüne Postfach. zum Artikel Wie anonym darf ein E-Mail-Dienst sein? Erstellt am 15. März 2018, 13:25 Uhr | Kategorie: Medien Posteo hat gegenüber der Bundesnetzagentur durchgesetzt, gehashte Mobilfunknummern der Kunden nicht herausgeben zu müssen. Der Mailprovider Posteo muss die gespeicherten Hashwerte von Kunden-Rufnummern nicht an Behörden herausgeben. Das hat eine rechtliche Klärung zwischen Posteo und der Bundesnetzagentur (BNetzA) ergeben. zum Artikel Posteo fordert Transparenzpflicht Erstellt am 20. Januar 2018, 13:05 Uhr | Kategorie: Medien Der E-Mail-Dienst Posteo hat einen Transparenzbericht für das Jahr 2017 veröffentlicht. Daraus geht hervor, wie häufig Behörden – Strafverfolgung oder Nachrichtendienste etwa – Kundendaten anfragen. Der Anteil der rechtswidrigen Ersuchen lag bei rund 42 Prozent. Posteo fordert, dass Transparenzberichte für alle Telekommunikations-Anbieter verpflichtend werden sollen. zum Artikel"
