["https://posteo.de/site/leistungen"]
title = "E-Mail grün, sicher, einfach und werbefrei - posteo.de - Leistungen"
description = "Posteo ist ein innvovativer E-Mail-Anbieter, der auf Nachhaltigkeit und Datenschutz setzt und komplett Werbefrei ist. Unsere E-Mail-Postfächer, Kalender und Adressbücher sind synchronisierbar - wir setzen auf umfassende Verschlüsselung."
full_description = 'E-Mail komfortabler Webmailer Wählen Sie aus 12 verschiedenen Farben aus. Per Drag & Drop lassen sich Mails bei gedrückter Maustaste in verschiedene Ordner ziehen. Benutzen Sie die Konversationsansicht für Übersicht in Maildialogen. Gestalten Sie Ihre E-Mails individuell. Im HTML-Modus stehen Ihnen u.a. verschiedene Schriftarten, Farben und Smileys zur Verfügung. Sie können viele Informationen und auch Notizen und Fotos zu Ihren Kontakten speichern. Ihre Kontakte können Sie in Gruppen sortieren und an diese Gruppen Rundmails schreiben. Mit dem Kalender können Sie Termine auf verschiedenen Geräten verwalten, mit anderen teilen oder verschlüsseln. Versenden Sie Anhänge bis zur Größe von 50 MB. Beim Empfang werden bis zu 100 MB unterstützt. Erstellen Sie beliebig viele Ordner und Unterordner für Ihre E-Mails. Mit den Filtern können Sie E-Mails automatisch in Ordner verschieben oder löschen. Konfigurieren Sie Ihren Posteingang individuell nach Ihren Vorlieben. Filtern Sie die Mailansicht und benutzen Sie die Suchfunktion, um effizient Mails zu finden. Legen Sie verschiedene Absende-Identitäten an. Sie können Empfangs- und Übermittlungsbestätigungen für Ihre E-Mails anfordern. Mit unserem Sammeldienst können Sie Ihre E-Mails zu Posteo umziehen. Richten Sie bei Bedarf Weiterleitungen für eingehende Mails an. Ihren Speicherplatz können Sie in den Einstellungen jederzeit selbst flexibel anpassen. Mit unseren Gutscheinen können Sie Guthaben an Angehörige, Freunde oder Kollegen verschenken. zwölf Farben in je zwei Kontraststufen Dark Mode für alle Farben Signaturen Multi-Datei-Upload Absende-Identitäten Listen- oder Konversationsansicht Drag & Drop schnelle Suche HTML-Mails viele Einstell-Möglichkeiten NEU: Webmailer mit 12 Farben und Dark Mode Jede Farbe in zwei Kontraststufen; Dark Mode per Gerät steuerbar; Alle Farben und Dark Mode auch in der Web-App. Web-App Mit unserer Web-App nutzen Sie Posteo komfortabel auf Ihrem Smartphone, Tablet oder PC. Umfassendes Verschlüsselungs- und Datenschutzkonzept mit zahlreichen Funktionen (z.B. alle gespeicherten Daten auf Knopfdruck verschlüsselbar, Zwei-Faktor-Authentifizierung (TOTP), Eingangsverschlüsselung mit S/MIME oder OpenPGP). kostenfreier, persönlicher Support Unser Team unterstützt Sie per E-Mail bei Problemen und beantwortet Ihre Fragen. 100% Open-Source Unser Angebot setzt aus Sicherheitsgründen ausschließlich auf Open-Source-Software und freie Protokolle. Auch verwenden wir ausschließlich Javascript, dessen Code Open-Source ist. 2 GB Speicherplatz (erweiterbar) Ihr Postfach hat 2 GB Speicherplatz. Der Speicher lässt sich auf 20 GB erweitern. Jedes weitere GB kostet 0,25 EUR pro Monat. Anhänge bis 50 MB/100 MB (senden/empfangen) E-Mail auf allen Geräten (IMAP/POP3) Mit Posteo können Sie Ihre Mails auf allen Smartphones, Tablets und PC synchron verwalten (IMAP). Viele Programme finden die nötigen Einstellungen per Auto-Konfiguration (z.B.: iOS, Thunderbird, Outlook) Hocheffizienter Spam- und Virenfilter NEU: Anhangs-Browser mit Fotostream Mit dem Anhangs-Browser können Sie Anhänge unabhängig von den E-Mails ansehen, filtern, herunterladen oder löschen. Für Bilder steht ein moderner Fotostream zur Verfügung. Notizen Bei Posteo verwalten Sie Ihre Notizen komfortabel und können sie bei Bedarf per E-Mail versenden. Individuelle Filter Sie können nach Inhalten oder Absendern filtern und Ihre Mails vorsortieren lassen. 2 Alias-Adressen inklusive (bis zu 20 gegen Aufpreis - 10Cent pro Alias und Monat). Unbegrenzte Filter-Adressen Verwenden Sie beliebig viele Filter-Adressen (beispiel+amazon@posteo.de, beispiel+twitter@posteo.de etc.), um Ihr Postfach übersichtlich zu halten und E-Mails zu sortieren. Unbegrenzte Ordneranzahl Sie können so viele Ordner und Unterordner anlegen, wie Sie möchten. Auch die Tiefe der Ordnerstruktur ist nicht begrenzt. Posteo-Umzugsservice Mit dem Posteo-Umzugsservice können Sie bis zu 3 externe E-Mailpostfächer inkl. Ordnerstrukturen sicher zu Posteo umziehen. Sie entscheiden, ob Sie den gesamten Inhalt Ihres bisherigen E-Mail-Postfachs oder ausgewählte Ordner kopieren. "Nachsendeauftrag" Unser Sammeldienst holt alle 10 Minuten neu eingehende E-Mails aus Ihren bisherigen Postfächern ab. Weiterleitungen und Abwesenheitsnotizen verschiedene Länderkennungen Ihre E-Mail-Adresse endet stets auf "posteo.de". Für die Alias-Adressen stehen Ihnen viele weitere Endungen zur Verfügung, u.a. posteo.at, .ch, .net, .org und viele weitere. Adressbuch "Verwalten Sie Ihre Mails mühelos mit unserem Webmail-Adressbuch. Sie können das Adressbuch auf allen Geräten nutzen und mit Ihrem Passwort verschlüsseln" Kontakte Speichern Sie im Adressbuch Mailadressen, Telefonnummern, Postanschriften, Geburtstage und viele weitere Daten Ihrer Kontakte. Verschlüsselung Sie können das Posteo-Adressbuch zentral verschlüsseln (AES) und so sicher auf allen Ihren Geräten nutzen. Der Schlüssel ist Ihr Passwort - selbst wir haben dann keinen Zugriff auf Ihre Daten. Adressbuch auf vielen Geräten Per CardDAV-Standard lassen sich Kontakte mit den meisten Smartphones, Tablets und PC abgleichen. Umzugshilfe Von ausgewählten E-Mail-Diensten (AOL, GMX, Hotmail, iCloud, Office 365, Outlook.com, WEB.DE und Yahoo!) können Sie Ihr Adressbuch zu Posteo auf Knopfdruck umziehen. Von anderen Anbietern lassen sich Adressbücher als vcard- oder csv-Datei importieren. Verteiler Sie können Kontakte in Gruppen zusammenfassen. Fotos Jeder Kontakt kann mit einem Foto versehen werden. Kalender "Verwalten Sie Ihre Termine komfortabel mit unserem Webmail-Kalender. Sie können Ihre Termine mit vielen Geräten und Programmen per CalDAV abgleichen und mit Ihrem Passwort verschlüsseln" Kalender auf vielen Geräten Per CalDAV-Standard lassen sich Termine mit den meisten Smartphones, Tablets und PC synchronisieren. Umzugshilfe Ihr bisheriger Kalender lässt sich als ics-Datei importieren. Geburtstage Der Posteo-Kalender zeigt auf Wunsch die Geburtstage Ihrer Adressbuch-Kontakte an. Kalender teilen Teilen Sie Ihren Kalender mit anderen oder lassen sich deren Kalender anzeigen. Dies funktioniert nicht bei eingeschalteter Verschlüsselung. Verschlüsselung Sie können den Posteo-Kalender zentral verschlüsseln (AES) und so sicher auf all Ihren Geräten nutzen. Der Schlüssel ist Ihr Passwort - selbst wir haben dann keinen Zugriff auf Ihre Daten. Externe Kalender einblenden In unserem Webmail-Kalender können Sie sich bis zu fünf externe Kalenderfeeds einblenden. Erinnerung Sie können sich an Ihre Termine erinnern lassen. Nachhaltigkeit und Soziales "Posteo setzt auf konsequente Nachhaltigkeit: Wir arbeiten mit 100% Ökostrom von Green Planet Energy. Der Einsatz effizienter Hardware ist für uns genauso selbstverständlich wie unser Firmenkonto bei der GLS Bank." 100% Ökostrom von Green Planet Energy Posteo wird zu 100% mit Strom von Green Planet Energy betrieben. Das gilt nicht nur für unsere Server, sondern auch für alle Geschäftsräume. Finanzierung: Posteo wirtschaftet nachhaltig. Wir sind schulden- und kreditfrei. Auch Investoren gibt es nicht. Posteo hat eine einzige Einnahmequelle: Die Beiträge seiner Nutzerinnen und Nutzer. Sie ermöglichen uns eine unabhängige, datenschutzorientierte Arbeit. Soziale Verantwortung als Arbeitgeber: Posteo beschäftigt alle Mitarbeiterinnen und Mitarbeiter in unbefristeter Festanstellung. Um die Vereinbarkeit von Arbeit und Familie zu erleichtern, setzen wir im Betrieb auf Gleitzeit und verschiedene Teilzeitmöglichkeiten. Kostenfreier bio-vegetarischer Mittagstisch: Posteo bietet seinen Mitarbeiterinnen und Mitarbeitern einen täglichen, bio-vegetarischen Mittagstisch an. Die Kosten für dieses Angebot (u.a. eigener Koch) werden vollständig vom Unternehmen getragen. Keine Flüge: Posteo verzichtet aus Gründen des Klimaschutzes vollständig auf geschäftliche Flugreisen. Zusätzliche Urlaubstage bei Bahnreisen: Posteo bietet allen Mitarbeitern zusätzliche Urlaubstage für klimafreundliche Bahnreisen, wenn sie bei einer privaten Urlaubsreise auf das Flugzeug verzichten. Firmenkonten bei sozialökologischer GLS Bank Die GLS Bank setzt das Geld ausschliesslich zur Finanzierung von ökologisch und sozial sinnvollen Projekten ein. Rücklagen bei Umweltbank Unsere Rücklagen haben wir bei der Umweltbank angelegt. Die Bank fördert mit dem Geld Umweltprojekte. Energieeffiziente Hardware: Wir setzen im Büro und bei den Servern auf energieffiziente Hardware. passend dimensionierte Server: Unsere Systeme sind bedarfsgerecht dimensioniert und wachsen flexibel mit. Büro und Posteo-Lab: Unser Büro und das Lab sind nach Nachhaltigkeitskriterien ausgestattet (FSC-Holz, Recyclingpapier und -möbel) Kostenfreie Fahrradreparatur: Posteo-Mitarbeiter können ihr Fahrrad kostenfrei im Betrieb von einem Fahrradmechaniker reparieren lassen. Spenden: Wir spenden regelmäßig an NGO`s, die u.a. in den Bereichen Umwelt- und Datenschutz tätig sind. Unsere Spenden legen wir offen auf der Seite "Wen wir unterstützen". effiziente Programmierung: Ressourcenschonung durch optimierte Gestaltung der lastrelevanten Prozesse. Mehr zum Thema finden Sie auf unserer: Infoseite Nachhaltigkeit Datenschutz und Verschlüsselung "Unser Anliegen ist es, Ihre Daten zu schützen und nicht meistbietend an die Werbewirtschaft zu verkaufen. Deshalb bieten wir anonyme Postfächer an und erheben keine Bestandsdaten von Ihnen." anonyme Anmeldung: Die Anmeldung erfolgt ohne Angabe personenbezogener Daten (wie Name oder Adresse). Datensparsamkeit: Wir erheben weder Bestandsdaten, noch verfügen wir über Verkehrsdaten (wie IP-Adressen) mit Postfachbezug. Prozesse und Funktionen werden stets nach dem Grundsatz der Datensparsamkeit konzipiert. anonyme Bezahlung: Bezahlvorgänge werden mit Hilfe eines von Posteo entwickelten Bezahlsystems anonymisiert. Wir verknüpfen Zahlungsdaten grundsätzlich nicht mit den E-Mail-Postfächern. zertifizierte Versandsicherheit: Posteo hat im Dezember 2016 als erster E-Mail-Anbieter ein Zertifikat nach der neuen Technischen Richtlinie "Sicherer E-Mail-Transport" des BSI erhalten. TLS-verschlüsselter Zugriff: Der Zugriff auf Ihre Daten erfolgt grundsätzlich verschlüsselt. (TLS mit PFS bei IMAP, POP3, Webmailer,CardDAV und CalDAV). TLS-verschlüsselter Transportweg: Schützt E-Mails und Metadaten auf dem Transportweg, wenn der andere Mailserver dies auch unterstützt (TLS mit PFS). TLS-Versand- und Empfangsgarantien Diese Sicherheitsfunktionen schützen Sie vor unsicheren E-Mail-Servern ohne zeitgemäße TLS-Verschlüsselung (TLS 1.2/1.3): Aktivieren Sie die TLS-Garantien, wird eine E-Mail nur dann versendet oder empfangen, wenn sie über eine sicher verschlüsselte Verbindung zugestellt werden kann. Sonst wird die Übertragung der E-Mail gestoppt - und Sie erhalten eine Benachrichtigung von uns. Verschlüsselte Festplatten: Die Festplatten unserer Server sind AES-verschlüsselt, um Daten-Diebstahl und unbefugten Zugriff zu verhindern. Krypto-Mailspeicher: Verschlüsselt alle gespeicherten E-Mail-Daten (Inhalte, Anhänge und Metadaten) sowie die Notizen und den Anhangs-Browser mit Fotostream auf Knopfdruck. Kalender und Adressbuch verschlüsselbar: Der Kalender und das Adressbuch sind auf Wunsch mit dem eigenen Passwort verschlüsselbar. So haben nur Sie Zugriff auf Ihre Daten. Eingangsverschlüsselung mit S/MIME oder OpenPGP Mit unserer Eingangsverschlüsselung können Sie alle neu eingehenden E-Mails mit Ihrem öffentlichen S/MIME- oder OpenPGP-Schlüssel verschlüsseln lassen. Ende-zu-Ende-Verschlüsselung auch im Webmailer Bei Posteo können Sie auch im Webmailer eine echte Ende-zu-Ende-Verschlüsselung nutzen: mit dem OpenSource-Plugin Mailvelope. Einrichten von Alias-Adressen Sie können Aliase, also weitere E-Mail-Adressen für Ihr Postfach anlegen. Das bedeutet: Sie können verschiedene Adressen für verschiedene Zwecke nutzen. Die Alias-Adressen sind bei Posteo individuell mit Ihrem Passwort verschlüsselt, um Ihre Privatsphäre zu schützen. Mehr zum Thema finden Sie auf unserer: Infoseite Datenschutz Infoseite Verschlüsselung Infoseite Bezahlung kein Datenhandel, keine Datenweitergabe: Kein Datenhandel und keine Datenweitergabe (ausser auf richterlichen Beschluss) tägliche Backups: Wir fertigen täglich Sicherheits-Backups aller Postfächer an und bewahren diese für die Dauer von 7 Tagen auf. automatisierter Löschhinweis: Nutzer löschen oft versehentlich E-Mails. Um Sie vor Datenverlusten zu schützen, benachrichtigt Posteo Sie per E-Mail, wenn eine größere Anzahl E-Mails aus Ihrem Postfach gelöscht wurde. So können Sie bei Bedarf rechtzeitig ein Backup anfordern. IP-Stripping: E-Mails, die Sie über unseren Webmailer oder über E-Mailprogramme versenden, enthalten weder Ihre lokalen noch Ihre öffentlichen IP-Adressen. hocheffiziente Spam- und Virenfilter Datenspeicherung in Deutschland, redundante Datenhaltung Server stehen in hochsicheren Rechenzentren kein Einsatz von Trackingtools Webseite ohne IP-Speicherung Zwei-Faktor-Authentifizierung (TOTP) Sichern Sie Ihr Posteo-Postfach zusätzlich mit unserer Zwei-Faktor-Authentifizierung ab. Die Funktion kann mit Hilfe kostenloser Apps auf allen Geräten eingerichtet werden (z.B. auf Mobiltelefonen, Tablets, Desktops und auf spezieller Hardware wie einem Yubikey). S/MIME-Zertifikate bei Posteo S/MIME ist ein weltweit verbreiteter Standard zur Ende-zu-Ende-Verschlüsselung von E-Mails. Ein S/MIME-Zertifikat bescheinigt auch die Echtheit einer E-Mail-Adresse und der E-Mail-Inhalte. In den Posteo-Einstellungen können Sie unkompliziert S/MIME-Zertifikate erstellen. Die S/MIME-Zertifikate werden von einer offiziellen Zertifizierungsstelle (Certum) signiert und in E-Mailprogrammen als vertrauenswürdig angezeigt. Sie haben eine Laufzeit von einem Jahr und kosten 365 Cent. Werbefreiheit "Wir sind nicht werbefinanziert und zu 100% werbefrei: Sie erhalten keine Werbung von uns und wir sind auch nicht daran interessiert, Daten von Ihnen zu erheben und/oder zu verkaufen" werbefreier Webmailer Unser Webmailer ist werbefrei. Wir versenden keinerlei Werbemails oder Werbe-Newsletter an Sie. Werbefreie Website: Unser Internetauftritt ist ebenfalls komplett werbefrei. Wir verwenden keine Trackingtools. keine Werbepartner: Unser Dienst ist nicht werbefinanziert. Das bedeutet: Wir sind nicht abhängig von Werbekunden und können nachhaltig und selbstbestimmt wirtschaften. hocheffiziente Spam- und Virenfilter: Unser Spamfilter hält Ihr Postfach frei von Werbemails. Kostenfreier Support "E-Mail ist Vertrauenssache: Wenn Sie Fragen und Probleme haben, helfen wir Ihnen gerne persönlich weiter." Kostenfreier, persönlicher SupportWir helfen Ihnen gerne persönlich weiter, wenn Sie einmal Fragen oder Probleme haben sollten. Unser Support-Team steht Ihnen per E-Mail werktags von 8 bis 20 Uhr zur Verfügung. Wir versuchen, alle eingehenden Fragen innerhalb eines Werktages zu beantworten. Von Mensch zu Mensch: Technische Fragen verständlich erklärtBei uns beantworten Menschen Ihre Anfragen, keine Text-Bots. Alle Support-Mitarbeiterinnen und -Mitarbeiter arbeiten in u'
year_published = 2025
