["https://posteo.de/fr/news/hausse-du-nombre-de-pays-ayant-impos%C3%A9-des-blocages-d%E2%80%99internet-en-2024"]
title = "E-mail vert, sûr, simple et sans pub - posteo.de - Hausse du nombre de pays ayant imposé des blocages d’Internet en 2024"
description = "Posteo est un fournisseur de messagerie innovant misant sur la durabilité et la protection de la vie privée. Il fonctionne entièrement sans publicité. Nos boîtes mail, calendriers et carnets d'adresse peuvent être syncrhonisés: nous utilisons un concept de chiffrement global."
full_description = "Julius Stiebert 26.02.2025 Hausse du nombre de pays ayant imposé des blocages d’Internet en 2024 Selon le recensement d’Access Now, au moins 296 blocages de réseau ont eu lieu dans le monde entier, l’année dernière. Beaucoup étaient liés à des conflits et des guerres. C’est le Myanmar qui a imposé le plus grand nombre de coupures d’Internet. Sept États ont bloqué Internet pour la première fois en 2024 (image d’archive). (Source : IMAGO / ZUMA Press Wire) En 2024, les gouvernements de 54 pays ont imposé au moins 296 blocages d’Internet. C’est ce que révèle le rapport annuel sur les coupures de réseau, publié par l’organisation Access Now ce lundi. Selon ce rapport, il n’y a jamais eu autant de cas depuis le début des enregistrements en 2016. Access Now et ses organisations partenaires critiquent le fait que les coupures de réseau ne sont jamais justifiées. Avec 296 blocages, le nombre total a augmenté par rapport à l’année précédente (s’élevant alors à 283). En outre, le nombre de pays ayant fait usage de cette mesure contestée a augmenté de 15. Des millions de personnes auraient été concernées. 47 des blocages commencés l’année dernière se poursuivent en 2025. La majorité des coupures de réseau ont été observées au Myanmar : Internet y a été coupé 85 fois – en 2023, Access Now avait déjà documenté 37 cas. La junte militaire au pouvoir depuis le coup d’État de 2021 était la principale responsable des nombreux blocages. Avec 84 coupures, l’Inde suit de près l’État d’Asie du Sud-est. C’est la première fois depuis 2018 que l’Inde ne figure pas en tête de liste. Cependant, il s’agit encore d’un « nombre inacceptable » pour la « plus grande démocratie du monde ». Selon le Software Freedom Law Center implanté en Inde, les autorités avaient principalement restreint la communication de manière préventive en 2024, par exemple, lorsqu’elles s’attendaient à des manifestations. Au Pakistan, 21 blocages de réseau ont été documentés, un chiffre encore jamais atteint dans le pays. La Russie a réalisé par 19 fois des coupures, dont sept ont touché l’Ukraine. Guerres et conflits Déjà l’année précédente, les conflits et les guerres étaient les raisons les plus fréquentes des blocages : dans onze pays, les parties au conflit ont restreint les canaux de communication 103 fois. Il s’agissait notamment de l’Éthiopie, du Myanmar, de l’Israël, de la Russie et du Soudan. On peut parler ici aussi de triste record, rapporte Access Now. Une variété de tactiques seraient utilisées pour bloquer Internet pendant les conflits actifs. Par exemple, l’infrastructure électrique et les télécommunications seraient détruites, les lignes coupées, des brouilleurs seraient utilisés et les bureaux des fournisseurs d’accès Internet seraient occupés. Mouvements contestataires et élections L’organisation a également documenté un nouveau pic dans le contexte de manifestations : en 2024, les gouvernements de 24 pays ont procédé à 74 coupures de réseau, notamment au Bangladesh, en Inde, au Kenya, au Rwanda et au Sénégal. Le but était, par exemple, de contenir et réprimer des manifestations contre la politique gouvernementale ou la situation économique. Les autorités ont aussi souvent bloqué les connexions lors de montées de violence pendant des conflits ou des manifestations. Access Now critique le fait que cette pratique participe à exacerber la peur et l’insécurité parmi la population – et empêche les personnes d’accéder à des informations vitales. L’organisation associe 72 coupures de réseau en 2024 à des violations des droits humains ou des crimes de guerre. En 2024, les citoyennes et citoyens d’au moins 64 États ont été appelés à voter. Dans ce contexte, douze coupures de réseau ont été imposées dans huit pays – le chiffre le plus élevé depuis 2019. Il s’agissait notamment de l’Azerbaïdjan, de l’Inde et de l’Ouganda. Blocages d’Internet en période d’examens Certains gouvernements ont également eu recours à des blocages du Web pour prévenir la fraude lors des examens scolaires ou universitaires, notamment en Algérie, en Jordanie, au Kenya et en Irak. Ce nombre n’a jamais été aussi élevé depuis le début des enregistrements par Access Now. L’Iran et le Soudan, en revanche, n’ont imposé aucune coupure de réseau pendant les périodes d’examen en 2024, alors qu’ils avaient usé de cette méthode dans le passé. Access Now note toutefois que la majorité des étudiantes et étudiants au Soudan n’ont pas pu passer d’examens en raison de la guerre civile qui y sévit. Et l’Iran a bloqué à nouveau les canaux de communication en 2024 dans le cadre de manifestations. Access Now compte également les blocages de plateforme parmi les coupures de réseau. Selon son rapport, ces chiffres ont également fortement augmenté : l’année dernière, 71 blocages ont été enregistrés dans 35 pays – en 2023, il y avait eu 53 blocages dans 25 pays. Le record précédent remontant à 2019 a même été dépassé. Access Now accuse les autorités de tenter de contrôler le flux d’informations sur les plateformes populaires. Persiste également l’opinion biaisée affirmant que le blocage de certains services serait moins préjudiciable que des coupures complètes. X (anciennement Twitter) est la plateforme la plus fréquemment bloquée (24 fois dans 14 pays), suivie de Facebook (22 fois dans 12 pays). Les autorités ont également bloqué YouTube, Instagram et les services de messagerie, tels que WhatsApp et Signal. L’application de rencontre Grindr a également été bloquée dans 13 États. Sept États usent des coupures pour la première fois En 2024, sept États ont coupé Internet ou bloqué des services pour la première fois. En fait partie la Malaisie avec un blocage de Grindr, qui devrait continuer à être actif chez certains fournisseurs dans le pays. La Thaïlande s’est également faite remarquer pour la première fois par une mesure transfrontalière. Les autorités ont coupé les connexions Internet et téléphoniques sur un territoire du Myanmar frontalier de la Thaïlande. Cette mesure devait servir à lutter contre la fraude en ligne en provenance du Myanmar. Cependant, l’organisation critique le fait que la population en a également fait les frais. Zach Rosson d’Access Now a fait le commentaire suivant : « Les données ne mentent pas : en 2024, il y a eu un nombre record de blocages d’Internet. Alors que les responsables utilisent des tactiques de plus en plus sophistiquées pour réduire au silence les opinions divergentes, nous devons réagir en tant que société civile et défenseurs des droits humains. Plus que jamais, nous avons besoin d’un effort collectif et concerté pour lutter contre les blocages d’Internet dans le monde entier – les droits fondamentaux en dépendent. » Access Now souligne que les parties au conflit doivent veiller à ce que la population civile ait accès aux réseaux et plateformes de télécommunication. La communauté internationale doit également tenir responsables les auteurs qui, en coupant le réseau, violent les droits humains. Tous les gouvernements du monde doivent également protéger les droits à la liberté d’expression et à l’accès à l’information. Mais l’ONG a également critiqué les entreprises technologiques : bon nombre des principales plateformes se sont distancées de leurs engagements à lutter contre les discours haineux et la désinformation. Access Now leur demande de protéger les droits humains– et les gouvernements devraient également lutter contre les causes de désinformation plutôt que de bloquer les plateformes. (js)"
