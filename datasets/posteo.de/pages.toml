["https://posteo.de/site/nachhaltigkeit"]
title = "E-Mail grün, sicher, einfach und werbefrei - posteo.de - Nachhaltigkeit"
description = "Posteo ist ein innvovativer E-Mail-Anbieter, der auf Nachhaltigkeit und Datenschutz setzt und komplett Werbefrei ist. Unsere E-Mail-Postfächer, Kalender und Adressbücher sind synchronisierbar - wir setzen auf umfassende Verschlüsselung."
full_description = "Energie Quelle: https://green-planet-energy.de/geschaeftskunden/gewerbestrom Unsere Server und Geschäftsräume werden zu 100% mit Ökostrom von Green Planet Energy versorgt, der aus Wasserkraftwerken und Windenergieanlagen in Österreich und Deutschland stammt. Green Planet Energy geht bei Themen wie dem Versorgungskonzept sowie der Förderung von Neuanlagen keine Kompromisse ein: Kein Greenwashing: Green Planet Energy etikettiert Strom aus Kohle- oder Atomkraft nicht zu Ökostrom um. Green Planet Energy ist der einzige Energieversorger in Deutschland, der die Stromkriterien der Umweltorganisation Greenpeace einhält. Transparenz: Green Planet Energy legt alle Lieferantenkraftwerke für seine Kunden offen. Neuanlagenförderung: Green Planet Energy fördert den Ausbau der erneuerbaren Energien: z. B. durch den Bau neuer, sauberer Kraftwerke oder durch Investitionen in ökologisch ausgerichtete und dezentrale Versorgungskonzepte. Politisches Engagement: Green Planet Energy bringt sich in politische Debatten und Gesetzgebungsverfahren ein, um die Energiewende aktiv voranzubringen. 2018: Posteo sponsort Ökostrom-Versorgung für neues Rechenzentrum Mit einem Sponsoring über 25.000 EUR für die Ökostrom-Anbindung konnten wir im Jahr 2018 dazu beitragen, dass ein neues Rechenzentrum unseres Carriers in Frankfurt am Main auch mit echtem Ökostrom von Green Planet Energy (zu diesem Zeitpunkt noch unter dem Namen Greenpeace Energy) versorgt werden wird. Im Frühjahr 2020 haben wir den neuen, weiteren Standort in Frankfurt am Main in Betrieb genommen. Seit September 2023: Ökostrom-Zuschuss Wir wollen echten Ökostrom auch außerhalb unseres Büros fördern. Darum unterstützen wir unsere Teammitglieder mit einem pauschalen monatlichen Zuschuss von 50 EUR, wenn Sie mit dem privaten Stromanschluss echten Ökostrom (von ausgewählten Anbietern) beziehen. Büro & Unternehmen Keine Flüge: Posteo verzichtet aus Klimaschutzgründen bereits seit der Gründung 2009 vollständig auf geschäftliche Flugreisen. Zusätzliche Urlaubstage bei Bahnreisen: Posteo gewährt zusätzliche Urlaubstage für klimafreundliche Bahnreisen, wenn Angestellte bei einer privaten Urlaubsreise auf das Flugzeug verzichten. Kostenfreies ÖPNV-Ticket: Unsere Angestellten erhalten kostenfreie Jahrestickets für den öffentlichen Nahverkehr. Kostenfreie bio-vegetarische Kantine: Posteo bietet seinen Mitarbeiterinnen und Mitarbeitern täglich einen bio-vegetarischen Mittagstisch an. Die Kosten für dieses Angebot (u.a. eigener Koch) werden vollständig vom Unternehmen getragen. Bio-Getränke und Bio-Snacks: Im Posteo-Büro gibt es kostenfrei Kaffee, Tee, Kaltgetränke, Obst und Snacks in Bio-Qualität. Soziale Verantwortung als Arbeitgeber: Posteo beschäftigt alle Mitarbeiterinnen und Mitarbeiter in unbefristeter Festanstellung. Um die Vereinbarkeit von Arbeit und Familie zu erleichtern, setzen wir im Betrieb auf Gleitzeit und verschiedene Teilzeitmöglichkeiten. Es gibt ein Eltern-Kind-Büro. Kostenfreie Fahrradreparatur: Posteo-Mitarbeiter können ihr Fahrrad kostenfrei im Betrieb von einem Fahrradmechaniker reparieren lassen. Recyclingpapier: Einsatz von 100% Recyclingpapier in allen Geschäftsbereichen Computergesteuerte Heizungsregelung: Diese optimiert den Energieverbrauch durch Anpassung der Raumtemperatur je nach Bedarf (Nacht, Wochenende, geöffnetes Fenster). Energieeffiziente Hardware: Wir setzen auf energieeffiziente und schadstoffarme Hardware. Neuanschaffungen nach Nachhaltigkeitskriterien: Bei Neuanschaffungen achten wir nicht auf niedrige Preise, sondern auf die Nachhaltigkeit des jeweiligen Produktes. Möbel: Sowohl unsere Büroräume als auch das Posteo Lab sind mit Tischen aus FSC-zertifiziertem Holz, sowie mit Büromöbeln aus Recyclingmaterialien ausgestattet. Finanzen Finanzierung: Posteo wirtschaftet nachhaltig. Das Unternehmen ist schulden- und kreditfrei. Auch Investoren gibt es nicht. Posteo hat nur eine einzige Einnahmequelle: Die Beiträge seiner Nutzerinnen und Nutzer. Sie ermöglichen uns eine unabhängige, datenschutzorientierte Arbeit. Zum Beispiel können wir vollständig auf Tracking verzichten, da wir durch die Nutzerfinanzierung keine Werbeeinahmen benötigen. Firmenkonto: Wir setzen auf Nachhaltigkeit - auch, wenn es um Geld geht. Das Guthaben der Posteo-Kunden wird auf unserem Konto bei der sozial-ökologischen GLS Bank verwaltet. Die GLS Bank setzt das Geld ausschliesslich zur Finanzierung von ökologischen und sozialen Projekten ein. Rücklagen: Unsere Rücklagen haben wir bei der Umweltbank angelegt. Die Bank fördert mit dem Geld Umweltprojekte, vor allem in den Bereichen Erneuerbare Energien, Niedrigenergie-Bauweise, Umweltfreundliche Produktion, Kreislaufwirtschaft, ökologische Landwirtschaft und Recycling. Spenden: Wir spenden regelmäßig an NGO`s, die im Umwelt- und Klimaschutz tätig sind. Kündigen Posteo-Kunden ihr Konto, können sie Restguthaben durch uns spenden lassen. Wirtschaftsprüfer: Wir lassen uns jährlich freiwillig durch eine große, unabhängige Wirtschaftsprüfungs- gesellschaft prüfen. Technisches Datensparsamkeit für Klimaschutz: Durch Verzicht auf unnötiges Loggen und Tracken sparen wir Energie und Hardware. Energieeffiziente Hardware: Wir setzen im Büro und bei den Servern auf energieffiziente Hardware. Spamreject: Standardmäßig ist der Spam-Ordner bei Posteo deaktiviert. Als Spam identifizierte Mails werden so von unserem Server gar nicht erst angenommen. Durch das Abweisen von Spam-Nachrichten schonen wir den Speicherplatz unserer Nutzer und sparen Ressourcen. Mit aktiviertem Spam-Log bleiben Sie stets über alle abgelehnten E-Mails informiert. Trotzdem können Sie auch bei Posteo den Spam-Ordner aktivieren. Greylisting: Das so genannte Greylisting hält die meisten Spam-Nachrichten von unseren Servern fern und reduziert so massiv den Strombedarf. Umzugsservice: Der Umzugsservice erleichtert den kompletten Umzug zu Posteo und ermöglicht die Kündigung bisheriger Postfächer. effiziente Programmierung: Vermeidung von Energieverschwendung durch optimierte Gestaltung der lastrelevanten Prozesse. passend dimensionierte Server: Unsere Systeme sind bedarfsgerecht dimensioniert und wachsen flexibel mit. Das spart Ressourcen: Überdimensionierte Serverlandschaften sind häufig enorme Stromfresser. Werbefreiheit Keine Finanzierung über Werbung: Die Existenz vieler Internetdienste ist vom Geld und Wohlwollen ihrer Werbekunden abhängig. Posteo ist ein unabhängiger Anbieter, der nachhaltig wirtschaftet und sich ausschliesslich über die Beiträge seiner Kunden finanziert. Datensparsamkeit durch Verzicht auf Werbung Wir haben kein Interesse daran, die Daten unserer Kunden an die Werbewirtschaft zu verkaufen. Wir verzichten deshalb vollständig auf Werbekunden und unsere Website ist frei von Trackingstools. Wir erheben grundsätzlich keine personenbezogenen Daten unserer Kunden. Bezahldaten werden grundsätzlich von E-Mail-Postfächern getrennt."
year_published = 2025
