["https://posteo.de/fr/site/rapport_de_transparence"]
title = "E-mail vert, sûr, simple et sans pub - posteo.de - Rapport de transparence"
description = "Posteo est un fournisseur de messagerie innovant misant sur la durabilité et la protection de la vie privée. Il fonctionne entièrement sans publicité. Nos boîtes mail, calendriers et carnets d'adresse peuvent être syncrhonisés: nous utilisons un concept de chiffrement global."
full_description = '''Rapport de transparence Posteo Remarque Suite à un arrêt de la Cour de justice de l'Union Européenne (CJUE) datant du 13 juin 2019, les services de courrier électronique comme Posteo n'étaient plus soumis aux obligations de la TKG (loi allemande sur les télécommunications) entre juin 2019 et novembre 2021. Par conséquent, la base juridique pour d'éventuels ordres de surveillance des télécommunications (TKÜ) n'existait plus. Posteo n'a pas effectué de TKÜ durant cette période. Suite à l'arrêt de la CJUE, l'Agence fédérale des réseaux avait retiré Posteo de son annuaire des opérateurs de télécommunications. Le 01.12.2021, une nouvelle TKG est entrée en vigueur, sous laquelle les services de courrier électronique sont désormais également couverts. Bienvenue dans le rapport de transparence Posteo Nous souhaitons que vous sachiez à quelle fréquence les autorités effectuent des requêtes concernant les données de nos utilisateurs. Dans ce rapport, nous exposons combien de fois les autorités chargées d'enquêter et les services secrets se sont adressés à nous et à quelle fréquence nous avons dû effectivement divulguer des données de contenu. De plus, vous apprendrez combien de fois ces requêtes ont été déposées correctement et combien de fois elles étaient illégales. Ce rapport comprend toutes les demandes des autorités que Posteo a reçues jusqu'à fin décembre 2019. Nous avons séparé en deux l’affichage des chiffres pour les années 2019 et 2021 car les fournisseurs des messagerie électronique n’étaient plus soumis aux obligations de la TKG (loi allemande sur les télécommunications) depuis un arrêt de la CJUE en juin 2019, et ce jusqu’à novembre 2021. Nous publions les requêtes des autorités Étant donné que de nombreuses demandes des autorités reçues par Posteo ne respectent pas les dispositions légales, nous consacrons un paragraphe spécial aux manquements survenant dans les procédures de demandes de renseignement. Dans ce paragraphe, nous dénonçons particulièrement le chaos qui règne dans la façon de faire la demande de données personnelles d'après le TKG §113 (loi allemande sur la surveillance des télécommunications). Nous démontrons que de graves problèmes de sécurité existent, que des violations régulières du droit surviennent et que le déficit de contrôle ne fait qu'aggraver la situation. Nous appuyons notre critique sur notre propre documentation et publions des exemples de requêtes illégales des autorités. De plus, nous publions notre échange de courriers avec la commissaire fédérale à la protection des données, les commissaires à la protection des données des länder et les ministères de la justice de chaque land. Ainsi, vous avez un aperçu des efforts fournis quotidienement par Posteo pour protéger vos données. De plus, nous nous intéressons à l'instrument de contrôle de la réserve de compétence du juge qui, d'après nous, ne correspond pas aux compétences qui lui ont été assignées. Toutes les demandes de surveillances semblent être acceptées. Cependant, pour garantir l'efficacité de la réserve de compétence du juge, aucune statistique n'est relevée pour le confirmer. Nos objectifs En mai 2014, Posteo était le premier opérateur de télécommunications allemand à publier un rapport de transparence. Avant cela, nous avons demandé de vérifier par le biais d'un avis juridique la légalité d'une publication de rapports de transparence par des opérateurs allemands. Grâce à cette initiative, nous avons poussé d'autres fournisseurs allemands à publier des rapports de transparence, notamment la Deutsche Telekom. Avec notre rapport de transparence, nous souhaitons que les abus et procédures illégales apparaissent en plein jour et qu'un débat puisse s'ouvrir sur ce sujet. Nous souhaitons également que quelque chose change : bien que le gouvernement fédéral ait été informé de ces abus il y a plusieurs années déjà, la sitation ne s'est apparemment pas améliorée. Le contrôle démocratique sur les demandes de renseignement étatiques et les mesures de surveillance en Allemagne doit par conséquent être renforcé. Nous donnons des impulsions dans ce sens dans notre rapport de transparence. Par exemple, nous appelons de nos voeux plus de fonds pour les organes de contrôle. Vous trouverez des réponses aux questions fréquentes sur les procédures et principes légaux ainsi que la réaction de Posteo aux requêtes des autorités dans notre rubrique"Informations générales & questions fréquentes". Demandes d'information : Remarque : nous sommes un fournisseur de messagerie spécialisé dans la protection des données et doté d'un concept global de minimisation des données. C'est pourquoi nous ne disposons ni de données à caractère personnel (comme le nom et l'adresse de nos clients), ni des adresses IP dynamiques de nos clients. Si Posteo est contraint par une décision de justice de divulguer les données d'un client, seules les données de contenu (par exemple les e-mails) peuvent être transmises aux autorités. En cas de demandes de données à caractère personnel ou d'adresses IP, nous répondons toujours aux autorités que les données demandées n'existent tout simplement pas chez nous. Nombre de requêtes en 2024 au total : 78 par les autorités allemandes : 72 par les autorités étrangères : 6 Type d'autorité autorités judiciaires : 77 services de renseignement : 1 Type de requête demandes de données à caractère personnel : 61 saisies de boîtes mail : 9 demandes de données de trafic : 0 TKÜ (surveillance d'un compte pour une période donnée) : 7 demande non définie : 1 Dans la période couverte par le rapport en 2024, Posteo a géré plus d'un demi-million de boîtes mail. Conformité Légalité/conformité formelle des demandes (vérification par nos avocats) demandes de données à caractère personnel formellement correctes : 22 demandes de données à caractère personnel formellement incorrectes : 39 saisies formellement correctes : 9 TKÜ formellement correctes : 7 TKÜ formellement incorrectes : 0 demandes de données de