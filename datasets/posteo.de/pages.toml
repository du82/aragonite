["https://posteo.de/fr/news/utah-la-police-doit-mentionner-lutilisation-de-lia-dans-ses-rapports"]
title = "E-mail vert, sûr, simple et sans pub - posteo.de - Utah : la police doit mentionner l'utilisation de l'IA dans ses rapports"
description = "Posteo est un fournisseur de messagerie innovant misant sur la durabilité et la protection de la vie privée. Il fonctionne entièrement sans publicité. Nos boîtes mail, calendriers et carnets d'adresse peuvent être syncrhonisés: nous utilisons un concept de chiffrement global."
full_description = "Julius Stiebert 28.02.2025 Utah : la police doit mentionner l'utilisation de l'IA dans ses rapports Un projet de loi dans l’Utah prévoit que les rapports de police doivent être relus lorsqu’ils ont été créés par intelligence artificielle (IA). Plusieurs services de police aux États-Unis utilisent déjà un logiciel qui doit créer des rapports à partir d’enregistrements par des caméras embarquées. (Source : IMAGO / Imagn Images) Dans l’État fédéral de l’Utah, les agents de police pourraient à l’avenir être tenus de divulguer l’utilisation de l’intelligence artificielle (IA) lors de la rédaction de rapports. Un projet de loi allant dans ce sens est actuellement en discussion. Les experts espèrent que d’autres États fédéraux suivront. Le projet de loi intitulé SB180 (en anglais) prévoit que les rapports de police créés par intelligence artificielle doivent être vérifiés par un humain. De plus, les rapports doivent mentionner le fait que des outils d’intelligence artificielle ont été utilisés lors de la création — ou que cette dernière a même entièrement rédigé le rapport. De plus, les autorités de police doivent développer des directives qui définissent les programmes d’intelligence artificielle autorisés. Ce projet de loi très succinct a été proposé par la sénatrice démocrate Stephanie Pitcher. L’avocate et ancienne procureure générale a déclaré aux médias locaux que les autorités chargées de l’application des lois s’appuierait de plus en plus sur l’intelligence artificielle. La loi créerait des normes minimales en la matière. Elle a ajouté que l’utilisation de l’intelligence artificielle pour créer des rapports de police ou pour le travail d’investigation posait de nombreuses questions — ce qui justifierait ces directives. Le projet de loi prévoit qu’en cas d’infraction à ces règles, des mesures disciplinaires puissent être prises. Ces dernières ne sont cependant pas mentionnées concrètement. « Une étape nécessaire » L’organisation de protection des droits civiques Electronic Frontier Foundation (EFF) a déclaré (en anglais) que ce projet de loi serait « malheureusement une étape nécessaire ». L’organisation espère qu’un débat public large portant sur ces règles en résulterait. Elle donne cependant l’avertissement suivant : il faut plus qu’une mention pour réduire les effets négatifs potentiels de rapports de police générés par intelligence artificielle. Le logiciel Draft One en particulier a attisé les critiques au cours de l’année dernière. Il a été créé par Axon, un fournisseur connu de pistolets à électrochocs — sous le nom de marque Taser — et de ce qu’on appelle des caméras embarquées. Draft One génère des rapports de police à partir d’enregistrements audio de caméras portées sur le corps. L’entreprise promet avant tout un gain de temps pour les officiers, par rapport à leur travail de rédaction. D’après les médias, les services de police testent ce logiciel dans plusieurs États fédéraux des États-Unis ou l’utilisent déjà — comme c’est le cas dans l’Utah. De plus, des produits similaires de concurrents existent déjà. La EFF avait déjà averti (en anglais) juste après la présentation de Draft One, l’année dernière, que les algorithmes ne savaient souvent pas distinguer de manière fiable les nuances des dialectes ou du langage courant. La technologie pourrait par conséquent retranscrire le langage parlé de manière erronée. La représentation des situations peut également être transformée, en fonction de ce qu’interprète le logiciel du langage parlé : lorsque, par exemple, un agent crie dans une vidéo « le suspect est armé », cela ne veut pas forcément dire qu’il y a une arme en jeu. Dans un rapport créé par la technologie, cela peut cependant devenir un fait — ce qui peut avoir des conséquences graves pour l’accusé devant un tribunal. De plus, l’organisation avait également averti du fait que, lorsqu’un agent serait surpris en train de mentir dans un rapport, il pourrait essayer de s’en sortir en invoquant une erreur du logiciel. Un rôle central dans les procédures pénales En décembre, l’American Civil Liberties Union (ACLU) avait également déclaré (en anglais) que les rapports de police jouent un rôle décisif dans le système judiciaire. D’après l’organisation, ils constituent la seule représentation officielle d’un incident et jouent un rôle central dans les procédures pénales où il s’agit de décider de la culpabilité et de la peine d’une personne accusée. Les agents de police devraient par conséquent ne pas laisser écrire leurs rapports par des algorithmes. Cette organisation critique par exemple le fait que les enregistrements des bodycams constituent la base de ces rapports. Des preuves vidéos ne sont cependant pas objectives, l’angle de la caméra, mais aussi le moment de démarrage de la vidéo influençant notamment la représentation d’une situation. Une autre source importante des rapports de police serait la mémoire des agents, qui peut cependant évoluer légèrement au cours du temps. C’est pourquoi il est important qu’ils écrivent leurs souvenirs avant de revoir les vidéos ou fassent générer un rapport. De plus, l’ACLU critique le manque de transparence concernant le fonctionnement exact de Draft One. Cela pourrait représenter un problème important dans le cadre d’une mise en accusation. En cours de législation Le Sénat de l’Utah a déjà voté le projet de loi la semaine dernière, et il est actuellement examiné par la Chambre des représentants. Enfin, il devra encore être signé par le Gouverneur républicain Spencer Cox pour pouvoir entrer en vigueur. D’après l’EFF, dans le King County, près de Seattle (État fédéral de Washington), il a été interdit à la police dès la fin de l’année dernière de faire rédiger ses rapports par ces nouvelles technologies. (js)"
