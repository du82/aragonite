title = "E-Mail grün, sicher, einfach und werbefrei - posteo.de - Kündigungsformular"
description = "Posteo ist ein innvovativer E-Mail-Anbieter, der auf Nachhaltigkeit und Datenschutz setzt und komplett Werbefrei ist. Unsere E-Mail-Postfächer, Kalender und Adressbücher sind synchronisierbar - wir setzen auf umfassende Verschlüsselung."
full_description = "Ohne Eingabe des zugehörigen Passworts können Sie sich nicht als Postfachinhaberin autorisieren. Personenbezogene Daten speichert Posteo aus Sicherheitsgründen nicht. Solche Daten können daher nicht zur Überprüfung der Kündigungsberechtigung herangezogen werden. Für keine der Kündigungsoptionen ist eine Begründung erforderlich, auch nicht bei einer ausserordentlichen Kündigung in Verbindung mit sofortiger Wirkung. Bitte sichern Sie bis zum alle Daten, (E-Mails, Adressen, Termine) die Sie noch benötigen. Bei uns verbliebene Daten werden zum genannten Termin restlos von unseren Servern gelöscht. Ihr Postfach wird 14 Tage nach dem gewünschten Kündigungstermin () zum restlos gelöscht. Bis zu diesem Termin können Sie sich weiter einloggen und Ihr Postfach wie gewohnt nutzen. Dafür entstehen Ihnen keine Kosten. Warum Sie uns Ihre Kontodaten mitteilen müssen: Wir verknüpfen Zahlungsdaten nicht mit den Postfächern - auch wenn Sie erst kürzlich gezahlt haben, wissen wir nicht, welcher Zahlungsvorgang zu Ihrem Postfach gehört. Alle Zahlungsvorgänge haben wir anonymisiert. Datenschutzhinweis: Die Daten, die Sie in diesem Kündigungsformular angeben (Name und Bankverbindung oder Paypal-Adresse), werden bei der Löschung des Postfachs aus unserem System gelöscht. Zahlungsvorgänge bleiben aus handels- und steuerrechtlichen Gründen in der Buchhaltung gespeichert, jedoch ohne Verknüpfung zu einem Postfach. Es liegt bereits eine wirksame Kündigung vor. Sie können erneut kündigen und es gelten dann die jetzt von Ihnen ausgewählten Angaben. Mit dieser Kündigung erhalten Sie eine Bestätigungs-E-Mail, in der Sie noch einmal darüber informiert werden, dass Sie zum gekündigt haben und am alle bei uns verbliebenen Daten gelöscht werden. Verbliebenes Restguthaben wird nach Kündigungseingang zurück erstattet, wenn Sie dies weiter oben so entschieden hatten."
