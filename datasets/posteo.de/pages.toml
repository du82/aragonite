title = "E-Mail grün, sicher, einfach und werbefrei - posteo.de - Italien: Priester mit Spähsoftware angegriffen"
description = "Posteo ist ein innvovativer E-Mail-Anbieter, der auf Nachhaltigkeit und Datenschutz setzt und komplett Werbefrei ist. Unsere E-Mail-Postfächer, Kalender und Adressbücher sind synchronisierbar - wir setzen auf umfassende Verschlüsselung."
full_description = "Julius Stiebert 27.02.2025 Italien: Priester mit Spähsoftware angegriffen Ein italienischer Priester soll mit Spionagesoftware angegriffen worden sein. Er ist für eine NGO tätig, deren Gründer ebenfalls kürzlich über einen solchen Angriff informiert wurde. Mehrere der bisher bekannten Spionageopfer aus Italien beschäftigen sich mit dem Thema Migration. (Quelle: Mediterranea Saving Humans) Ein italienischer Priester wurde von Meta informiert, dass er mit Überwachungssoftware angegriffen wurde. Mattia Ferrari engagiert sich bei der NGO Mediterranea Saving Humans. Deren Gründer Luca Casarini wurde ebenfalls mit Spähsoftware angegriffen. Mediterranea Saving Humans rettet im Mittelmeer in Seenot geratene Geflüchtete. Die NGO hat nun öffentlich gemacht, dass der Priester Mattia Ferrari vom Meta-Konzern über einen “ausgeklügelten” und von einer Regierung unterstützten Angriff informiert wurde. Weitere Details zu diesem Angriff hat die NGO nicht veröffentlicht. Sie verweist aber auf einen Bericht von Meta aus dem Jahr 2024, wonach der Konzern Aktivitäten von Spähsoftware-Anbietern aus Italien, Spanien und den Vereinigten Arabischen Emiraten entdeckt hatte. Deren Spionageprogramme sollen in der Lage sein, auf Geräten gespeicherte Daten auszulesen und den Standort zu überwachen. Solche Spionageoperationen hatte Meta bereits in der Vergangenheit entdeckt. NGO im Visier Bereits Anfang Februar hatte der Aktivist und NGO-Gründer Luca Casarini öffentlich gemacht, dass er von WhatsApp über einen Spähsoftware-Angriff auf sein Smartphone informiert wurde. WhatsApp gehört zum Meta-Konzern und hatte kurz zuvor berichtet, 90 Nutzerinnen und Nutzer seien mit Spähsoftware von Paragon Solutions ins Visier genommen worden. Die Angriffe auf Ferrari und Casarini sollen sich beide im Februar 2024 ereignet haben. Ferrari ist Kaplan an Bord des Rettungsschiffs der Organisation. Medienberichten zufolge hat er außerdem ein enges Verhältnis zu Papst Franziskus. Dieser hat etwa das Vorwort für Ferraris Buch “Von Migranten gerettet” geschrieben. Die beiden sollen zudem in engem Telefonkontakt gestanden und sich mehrfach getroffen haben, berichtet der Guardian. Vor einigen Monaten haben Ferrari, Casarini sowie der Aktivist David Yambio den Papst demnach im Vatikan getroffen. Yambio wurde Berichten zufolge von Apple ebenfalls über einen Spähsoftware-Angriff informiert. Bei dem Treffen mit dem Papst ging es um einen Mann, dessen Frau und Kind im Juli 2023 in der Wüste zwischen Tunesien und Libyen gestorben waren, nachdem die Familie von tunesischen Behörden dorthin zurückgebracht worden war. Von den Angriffen auf WhatsApp-Nutzer sollen sieben Personen in Italien betroffen sein – darunter auch der Investigativjournalist Francesco Cancellato. Italienische Journalistenverbände haben deshalb in der vergangenen Woche Strafanzeige gegen Unbekannt erstattet. Regierung dementiert Die bisher bekannten italienischen Spionageziele stehen der rechten Regierung von Ministerpräsidentin Giorgia Meloni kritisch gegenüber. Casarini und Yambio haben in der Vergangenheit öffentlich die Migrationspolitik der italienischen Regierung kritisiert – auch in Hinblick auf Libyen. Menschenrechtler werfen Italien vor, wegen Vereinbarungen mit der Regierung in Tripolis mitverantwortlich für Misshandlungen an Migranten zu sein, die dort in Gefängnissen festgehalten werden. Yambio hatte auch die Freilassung des Libyers Osama Almasri Najeem kritisiert, der vom Internationalen Strafgerichtshof wegen mutmaßlicher Kriegsverbrechen gesucht wird. Bisher ist jedoch unklar, wer hinter den Angriffen steckt. Die italienische Regierung hat dementiert, dafür verantwortlich zu sein – vor dem Parlament aber bestätigt, einen Vertrag mit Paragon zu haben. Auch der Chef des Auslandsgeheimdienstes AISE hat dies Berichten zufolge eingeräumt. Die Regierung bestreitet jedoch, dass Journalisten oder Aktivisten überwacht wurden. Laut dem Guardian hat Paragon den Vertrag mit Italien aufgrund der Vorfälle gekündigt, offiziell bestätigt ist das nicht. Ferrari sagte gegenüber dem Guardian: “Es war keine erfreuliche Nachricht, als ich erfuhr, dass mein Telefon angegriffen wurde. Als ich hörte, dass Luca [Casarini] ausspioniert wurde, wusste ich, dass ich auch ein Ziel sein könnte. Ich glaube, es ist ziemlich klar, dass staatliche Stellen dahinterstecken. Leider ist Solidarität seit vielen Jahren fast zu einem Verbrechen geworden.” In der vergangenen Woche hatte der Präsident des italienischen Parlaments eine Anordnung unterschrieben, die der Regierung erlaubt, Fragen der Opposition zu dem Spionageskandal abzulehnen. Doch die Opposition fordert weiter Antworten, berichtet der Guardian. Die Chefin der sozialdemokratischen Partito Democratico, Elly Schlein, sagte dem Guardian: “Die Geschichte von ausspionierten Aktivisten und Journalisten nimmt immer beunruhigendere Züge an.” Sie forderte, Ministerpräsidentin Giorgia Meloni und ihre Regierung müssten aufhören “davonzulaufen” und dringend aufklären, wer verantwortlich ist. Das Citizen Lab an der Universität Toronto hat bereits in der Vergangenheit mehrfach den Missbrauch von Spähsoftware aufgedeckt. Aktuell untersuchen die dortigen Experten einige der betroffenen Geräte aus Italien. Sicherheitsforscher John Scott-Railton sagte dem Guardian, die Benachrichtigung von Ferrari sei besorgniserregend, weil sie sich an dieselbe Personengruppe richte, aber auf den Einsatz einer anderen Überwachungssoftware durch eine Regierung hindeute. Bereits eine Warnung über einen solchen Angriff sei ein Alarmsignal – eine Handvoll davon zeige eindeutig, dass “etwas Ernstes im Gange” sei. (js)"
