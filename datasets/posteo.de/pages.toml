["https://posteo.de/site/datenschutz"]
title = "E-Mail grün, sicher, einfach und werbefrei - posteo.de - Datenschutz"
description = "Posteo ist ein innvovativer E-Mail-Anbieter, der auf Nachhaltigkeit und Datenschutz setzt und komplett Werbefrei ist. Unsere E-Mail-Postfächer, Kalender und Adressbücher sind synchronisierbar - wir setzen auf umfassende Verschlüsselung."
full_description = 'Unsere Motivation Für mehr Datenschutz in der digitalen Welt Daten sind eine wertvolle Ware: Internetdienste, soziale Netzwerke und E-Mailanbieter speichern personenbezogene Daten, erstellen Profile über Surfverhalten, Aufenthaltsorte, Vorlieben und Konsumgewohnheiten Ihrer Nutzer - und verdienen viel Geld damit. Nutzerdaten werden an Datenhändler oder Werbepartner verkauft und dazu genutzt, Anzeigen möglichst zielgruppengenau zu platzieren. Deshalb erheben Dienste oft mehr Daten, als notwendig. So entstehen zunehmend wahre "Datenhalden" - und "der gläserne Mensch" ist im Internet längst zur Realität geworden. Diesen Umstand muss nicht jeder beunruhigend finden. Aber die Datensammelwut hat immer öfter Folgen: Bei vielen Diensten werden selbst sensible Daten wie Bank- und Kreditkarteninformationen nur unzureichend gesichert, und können so von Dritten leicht gestohlen und missbräuchlich verwendet werden. Beispiele hierfür gibt es inzwischen genügend. Auch sonst sieht es in Sachen Sicherheit oft nicht besonders gut aus: Viele Dienste sichern den Zugriff auf Nutzerdaten nur unzureichend, verschlüsseln nicht und versäumen es, Datenverlusten vorzubeugen. Menschen, die Wert auf einen veranwortungsbewussten Umgang mit ihren Daten legen, bleibt oft nur, auf die Nutzung vieler Dienste und Portale zu verzichten. Als wir 2009 vergeblich nach einem E-Mailanbieter suchten, der verantwortungsbewusst mit unseren Daten umgeht, haben wir uns gegen den Verzicht entschieden, und einen eigenen E-Mailanbieter gegründet. Posteo. Datensparsamkeit Anmeldung ohne Angabe persönlicher Daten Bei Posteo melden Sie sich an, ohne persönliche Daten anzugeben. Wir verzichten generell auf das Speichern personenbezogener Daten. So beugen wir Datenhalden vor und handeln nach dem Grundsatz der Datensparsamkeit. Wir geben Ihnen die Hoheit über Ihre Daten zurück und stärken Ihr Recht auf informationelle Selbstbestimmung. kein Handel mit Daten/keine Datenweitergabe Wir erheben keine Bestandsdaten - folglich geben wir auch keinerlei Daten weiter und handeln auch nicht mit ihnen. User Agent-Stripping Im Mailheader einer E-Mail kann das für den Versand verwendete E-Mail-Programm im sogenannten User Agent-Header mitunter ersichtlich sein. Viele E-Mail-Programme fügen diese Information automatisch hinzu. Dabei können auch Informationen über das verwendete Betriebssystem und Gerät enthalten sein. E-Mails, die Sie über unseren Webmailer oder über externe E-Mail-Programme versenden, enthalten solche Informationen nicht. Wenn Sie Posteo mit einem externen E-Mail-Programm nutzen, löschen wir solche Informationen beim Versand der E-Mail. Damit schützen wir Ihre Privatsphäre und erhöhen die Sicherheit. IP-Stripping - keine IP-Adressen mit Postfachbezug Im Quelltext einer E-Mail sind mitunter IP-Adressen des Absenders aufgeführt: im so genannten Mailheader. Wir haben keine IP-Adressen mit Postfachbezug, da wir diese betrieblich nicht benötigen. Deshalb enthalten E-Mails, die über Posteo versendet werden, keine IP-Adressen unserer Nutzer. Zum Schutz Ihrer Privatsphäre und aus Sicherheitsgründen löschen wir außerdem eventuelle IP-Adress-Einträge von lokalen E-Mailprogrammen aus den Mailheadern. E-Mails, die Sie über unseren Webmailer oder über E-Mailprogramme versenden, enthalten deshalb weder Ihre lokalen noch Ihre öffentlichen IP-Adressen. Website ohne IP-Speicherung Wir erheben Ihre IP-Adresse nicht, wenn Sie unsere Website besuchen/nutzen. kein Tracking Wir verzichten grundsätzlich auf den Einsatz von Trackingtools, um Ihre Privatsphäre zu schützen. Aus diesem Grund sind auf unserer Website auch keine Social Media-Verknüpfungen für Facebook, X, Instagram o.ä. eingebunden. Alias-Adressen Unsere Alias-Adressen helfen Ihnen dabei, die Verbreitung Ihrer Haupt-Adresse gering zu halten. Nutzen Sie Aliase z.B., für Anmeldungen bei Online-Portalen und Foren. Datensparsamkeit: Wir erheben weder Bestandsdaten, noch verfügen wir über Verkehrsdaten (wie IP-Adressen) mit Postfachbezug. Prozesse und Funktionen werden stets nach dem Grundsatz der Datensparsamkeit konzipiert. Werbefreiheit Keine Finanzierung über Werbung: die Dienstleistung ist nachhaltig kalkuliert und trägt sich über die Beiträge unserer Nutzer. Datensparsamkeit durch Verzicht auf Werbung möglich. Wir haben kein Interesse daran, Daten unserer Kunden an die Werbewirtschaft zu verkaufen. Keine Abhängigkeit von Werbekunden: Die Existenz vieler Internetdienste ist vom Geld und Wohlwollen ihrer Werbekunden abhängig. Wir sind werbefrei und deshalb unabhängig. Anonymisierte Zahlung Das Guthaben Ihres Posteo-Postfachs wird stets anonym aufgeladen - egal ob Sie per Überweisung, per Paypal, per Kreditkarte oder in Bar zahlen. Wir verknüpfen Daten, die wir bei Zahlungen erhalten, grundsätzlich nicht mit den E-Mail-Postfächern. Hierfür haben wir 2009 ein eigenes Posteo-Bezahlsystem entwickelt, mit dem wir alle Zahlungsvorgänge anonymisieren. 2015 wurde das Bezahlsystem um neue gesetzliche Anforderungen erweitert. Bei Überweisungen geben Sie einen Einmal-Code im Verwendungszweck an, den Sie zuvor von uns per E-Mail erhalten. Trifft Ihre Zahlung bei uns ein, liest unser System den Code im Verwendungszweck aus und ordnet das Guthaben Ihrem Postfach zu. In diesem Moment wird Ihr Guthaben aufgeladen - und der Einmal-Code aus unserem System gelöscht. Ist der Code gelöscht, ist nicht mehr feststellbar, für welches Posteo-Postfach Sie Guthaben überwiesen haben. Bei Barzahlungen erfolgt die Zuordnung ebenfalls mit Hilfe des Einmal-Code-Prinzips: Sie notieren den Einmal-Code auf einem Zettel, den Sie Ihrer Zahlung beilegen. Zahlen Sie mit Paypal, wird das Guthaben im Moment der Zahlung auf Ihr Postfach übertragen – wir verknüpfen die Daten, die wir von Paypal erhalten, aber ebenfalls nicht mit Ihrem Postfach. Deutsche E-Mail-Anbieter sind nicht dazu verpflichtet, Bezahldaten und E-Mailpostfächer miteinander zu verknüpfen. Dies hat uns auch das Bundesministerium der Justiz in einer Antwort auf eine kleine Anfrage von Christian Ströbele bestätigt. Datensicherheit Umfassendes Verschlüsselungskonzept Wie wir Ihre Daten, sowie alle Übertragungswege und Zugänge durch unser umfassendes Verschlüsselungskonzept schützen, erfahren Sie auf unserer Infoseite Verschlüsselung. hocheffizienter Virenfilter Unser stündlich aktualisierter Virenfilter fängt eingehende E-Mails ab, die einen (bekannten) Virus enthalten und schützt Sie so wirksam vor Infektionen. hocheffizienter Spamfilter Der mehrstufige Spamfilter schützt Sie wirksam und zuverlässig vor unerwünschtem Spam. Mehr Informationen zu unserem Spamfilter finden Sie in unserer Hilfe. tägliche Backups Wir fertigen täglich verteilte Sicherheits-Backups aller Daten an. Diese speichern wir für die Dauer von sieben Tagen, um Ihnen im Notfall Daten wiederherstellen zu können, wenn Sie diese einmal versehentlich gelöscht haben sollten. In dringenden Notfällen bemühen wir uns, auch ausserhalb unserer Bürozeiten Daten für Sie wiederherzustellen. automatisierter Löschhinweis Nutzer löschen oft versehentlich E-Mails. Um Sie vor Datenverlusten zu schützen, benachrichtigt Posteo Sie per E-Mail, wenn eine größere Anzahl E-Mails aus Ihrem Postfach gelöscht wurde. So können Sie bei Bedarf rechtzeitig ein Backup anfordern. Ex- und Import aller Daten Sie haben bei Posteo die Hoheit über Ihre Daten: Sie haben nicht nur die Möglichkeit, beim Umzug Ihre Daten bei Posteo zu importieren. Sie können auch jederzeit all Ihre Daten über standardisierte Schnittstellen wieder exportieren. Sie können sie also lokal sichern - und die Daten bei uns löschen. Mehr zum Thema erfahren Sie in unserer: Datenschutzerklärung Mitarbeiter vertraglich zur Geheimhaltung verpflichtet Unsere Mitarbeiter sind zur Geheimhaltung verpflichtet, unsere Computer sind vollverschlüsselt. Jeglicher Papiermüll (z.B. Briefe von Barzahlern) wird geschreddert. Datenspeicherung in Deutschland, redundante Datenhaltung Alle Daten werden ausschliesslich in Deutschland gespeichert und redundant jeweils an zwei Hauptstandorten vorgehalten. Server in hochsicheren Rechenzentren Unsere Server stehen in Rechenzentren in Frankfurt am Main, Bielefeld und Berlin. Sie werden von uns rund um die Uhr überwacht. Die beiden Hauptstandorte in Frankfurt am Main sind mit sechs voneinander unabhängigen Glasfaserleitungen an das Internet angebunden. Auch die Stromeinführung erfolgt über zwei voneinander unabhängige Leitungen. Zusätzlich sorgen redundante USV-Anlagen auch bei großflächigem Stromausfall für die Aufrechterhaltung des Betriebs. Maßnahmen wie Brandschutzanlagen, verschiedene Brandabschnitte, räumliche Trennung der Stromversorgung von den Servern, ein elektronisches Zutrittssystem uvm. sorgen für zusätzliche Sicherheit. Jetzt anmelden. Hier können Sie Ihr Posteo-Postfach für 1 EUR/Monat eröffnen und sofort nutzen. Sie müssen bei der Anmeldung keine persönlichen Daten angeben. Weiter zur Anmeldung >>'
