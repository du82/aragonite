title = "E-mail vert, sûr, simple et sans pub - posteo.de - Nouveau certificat de sécurité"
description = "Posteo est un fournisseur de messagerie innovant misant sur la durabilité et la protection de la vie privée. Il fonctionne entièrement sans publicité. Nos boîtes mail, calendriers et carnets d'adresse peuvent être syncrhonisés: nous utilisons un concept de chiffrement global."
full_description = "Nouveau certificat de sécurité Créé le 17.February 2025, 20:00 | Catégorie : Info Chères clientes Posteo, chers clients Posteo, nous actualisons notre certificat de sécurité principal. Les certificats de sécurité ont une validité limitée dans le temps et doivent être renouvelés de temps à autre. Dans la plupart des cas, vous n’allez même pas le remarquer. Tous les programmes actuels tels que Thunderbird ou Outlook trouvent le nouveau certificat automatiquement. Vous n’avez rien à faire. Si votre programme vous signale cependant une erreur de certificat au cours de l’échange, veuillez redémarrer votre programme – cela devrait corriger l’erreur. Si vous souhaitez régler la confiance accordée au certificat manuellement, vous trouverez ci-dessous l’empreinte du nouveau certificat principal. Vous trouverez également les empreintes complètes de tous les certificats sur notre page Mentions légales. Nouvelles empreintes du certificat de sécrité TLS pour posteo.de : Geotrust: SHA256: 64:59:9B:20:CD:28:CE:58:6A:C4:3C:F5:E8:84:AD:9D:28:8A:29:CB:44:AF:D4:79:EB:C2:47:8B:D6:86:C6:05 SHA1: 72:7C:16:4D:38:1E:44:C2:BB:A7:56:98:E3:27:9B:B4:3E:CE:65:B9 Bien cordialement, l’équipe Posteo"
