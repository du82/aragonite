["https://posteo.de/en/lab"]
title = "Email green, secure, simple and ad-free - posteo.de - Posteo in Berlin"
description = '''
On Thursday, 03 April, an event for Girls'Day 2025 is taking place at Posteo Lab, located on top of the "Kreuzberg" in Berlin. We are giving 10 students the opportunity to take an excursion into the world of coding and to communicate with female computer scientists. The students will also become more familiar with the world of email: We will show them how it's possible for so many computers to communicate with each other all across the globe and exchange information using protocols. The girls will be able to try this out themselves by chatting with an email server. Registration is open to female students who are 12 years or older and can imagine becoming software developers later. No prior knowledge is required to participate. The event begins at 9:30.            More information (page in German)>>'''
full_description = '''Posteo Lab The Posteo Lab is a place for meetings and events in Berlin’s Kreuzberg. The lab is sustainably set up. We regularly open the lab for presentations, information sessions, training and cultural events. Information on current events can be found in our events calendar. Events We regularly open the Posteo Lab for presentations, information sessions, and training. We also host cultural events. We are happy to make the Posteo Lab available to external parties free of charge. Events should relate to Posteo and topics relevant to us. Please send suggestions for events to: veranstaltungen@posteo.de Current Events 03 April, 2025 09:30am Girls’Day 2025: "How female developers make servers exchange emails all across the globe" Entry: Free (registration required) Host: Posteo On Thursday, 03 April, an event for Girls'Day 2025 is taking place at Posteo Lab, located on top of the "Kreuzberg" in Berlin. We are giving 10 students the opportunity to take an excursion into the world of coding and to communicate with female computer scientists. The students will also become more familiar with the world of email: We will show them how it's possible for so many computers to communicate with each other all across the globe and exchange information using protocols. The girls will be able to try this out themselves by chatting with an email server. Registration is open to female students who are 12 years or older and can imagine becoming software developers later. No prior knowledge is required to participate. The event begins at 9:30. More information (page in German)>> Directions How to find us: Posteo Lab Methfesselstraße 36 10965 Berlin-Kreuzberg (site of the former Schultheiss brewery) Public transport: U6 – Platz der Luftbrücke Openstreetmap: www.openstreetmap.org/node/4441281573'''
