full_description = "Support at no additional charge Dear Posteo customers, If you need help or have questions, you can send an email to support@posteo.de or use our contact form. We do not offer support by telephone. We do our best to answer all incoming inquiries within one work day. We offer support in English, German and French. Our office hours are weekdays from 7 a.m. to 7 p.m. (GMT). Have a look at our help section, where we explain the important features of our email service. We also offer answers to frequently asked questions from interested parties. Have you forgotten your password? You can reset it yourself, if you previously added your mobile phone number. We also offer assistance, to recover a forgotten password from your computer. Interested parties: If you would prefer to send us questions in an encrypted manner, you can use our public S/MIME or PGP key. Press Please contact us via presse@posteo.de. Your contact person is: Sabrina Loehr Logos: Web logo, Logo for print, Logo for print without claim Further material is available upon request. Posteo abuse team If you would like to inform us of abusive use (e.g. phishing, spam or hate speech) originating from a Posteo account, please send an email to abuse@posteo.de. Please forward us the original email itself, if appropriate. (Public S/MIME and PGP key) If you would like to report abusive use originating from another provider's email address, you can find the relevant contact addresses at abuse.net. Contact form You can send us a message here. Email Subject Message Tip: For forgotten passwords, please provide an alternative email address."
