["https://posteo.de/en/site/encryption"]
title = "Email green, secure, simple and ad-free - posteo.de - Encryption"
description = "Posteo is an innovative email provider that is concerned with sustainability and privacy and is completely ad-free. Our email accounts, calendars and address books can be synchronised - we use comprehensive encryption."
full_description = '''Encryption You need not be at the mercy of large-scale eavesdropping on the internet. Extensive encryption offers reliable protection. Posteo offers a comprehensive and innovative encryption system, that we would like to introduce you to on this page. We apply different methods of encryption at different points. Posteo always uses the most modern encryption technologies and continually further develops its encryption system. We do everything we can, from our side as a provider, to enhance to the security of your communication. This also depends on some factors over which we have no control. You can also do some things yourself to communicate more securely – we also provide more information on this page. Stay informed: Posteo's encryption concept achieves top marks on various independent test sites such as Qualys SSL Labs and Hardenize. Overview Posteo’s encryption layers Move the mouse over the image or click an encryption layer to learn more about Posteo’s security architecture. You can find more information on encryption in the following sections: Encryption of the delivery route Access encryption Passwords & mobile numbers Two-factor authentication Encrypted servers Crypto mail storage End-to-end encryption Calendar & address book encryption Internet: Encrypted connections to other email servers (when possible) Email transport: Every email that you send to another email provider or server is transmitted by Posteo via an encrypted connection, if the other server supports this. We always use the newest technologies for this. TLS (1.0-1.3) with PFS DANE/TLSA Automatic encryption of the transport route occurs in the background, without you doing anything. It protects: The content of your emails Their metadata (such as subject, recipient, time) Further information on transport route encryption at Posteo can be found in the transport route encryption section. Transparency advice: The quality of Posteo’s encryption can be tested and viewed on the independent Qualys test site. Encrypted access to Posteo is mandatory (website, devices and programs) Access encryption: At Posteo, all access occurs encrypted. Webmail Local email programs Mobile devices We do not offer unencrypted access. We always use the newest technologies for access encryption. TLS (1.0-1.3) with PFS Strict Transport Security (HSTS) DANE/TLSA In addition, we use a so-called extended certificate that enables you to quickly determine that you really are visiting our website. Further information on Posteo’s access encryption and the extended certificate can be found in the access encryption section. Encrypted connections within Posteo Internal connections: We encrypt all connections within Posteo. Encryption using SSH and TLS (among others) This ensures that eavesdropping occurs neither within the system, nor in the data centre, nor on the way to the backup location. Further information on encryption within Posteo can be found in the server encryption section. Access protection: Password (salted hash) Storage of passwords: Posteo does not store your password in plain text. Despite this, it is checked with each login using a hash function. Passwords do not exist as plain text Saved as a salted hash We do not know your password and can not provide it either to you or to third parties. Further information on Posteo’s encryption of passwords and mobile phone numbers can be found in the passwords and mobile numbers section. Access protection 2 (optional): One-time password Two-factor protection: With Posteo, you can activate two-factor authentication. This further increases security for access to your Posteo account (in the browser). Login occurs with: Your personal password A one-time password (which changes every 30 seconds) TOTP process The one-time password is generated on your device (computer, tablet or smartphone). Further information on our two-factor authentication can be found in our help section. Account protection: Hard disk encryption Server encryption: All Posteo server hard disks are fully encrypted. Linux servers with dm-crypt/LUKS encryption Encryption of internal connections (SSH and TLS) Our encrypted hard disks protect against: Hardware theft Physical access by unauthorised parties Caprice (investigative authorities) Further information on Posteo’s hard disk encryption can be found in the server encryption section. Encryption of all saved emails (optional):Personalised Posteo crypto mail storage Posteo crypto mail storage: When you activate Posteo crypto mail storage for your account, Posteo encrypts all emails you have saved on our servers. Encrypts all email data (content, attachments and metadata) at the click of a button The key is protected with your password Encrypts all previously saved emails as well as newly-arriving ones Asymmetrical encryption with RSA Symmetrical encryption and authentication with AES and HMAC, hashing with bcrypt Open-source encryption External security audit by Cure53 Posteo can not deactivate encryption of your emails. Further information on Posteo crypto mail storage can be found in the crypto mail storage section. Posteo inbound encryption (optional):Encryption of all newly-arriving emails(with S/MIME or OpenPGP) Posteo inbound encryption: If you use S/MIME or OpenPGP, you can activate Posteo inbound encryption in the settings of your account. This encrypts all newly-arriving emails using S/MIME or OpenPGP. Encrypts all newly-arriving emails using S/MIME or OpenPGP, if the sender has not initially encrypted the email. Additional protection for your saved emails Further information on inbound encryption can be found in the end-to-end encryption section. End-to-end encryption of individual emails (by the user) End-to-end encryption: In addition to our measures, you can furnish the content of individual emails with end-to-end encryption. There are two standards for this: S/MIME and OpenPGP (PGP). Content of emails is encrypted Emails’ metadata (e.g. subject, recipient, sender and time stamp) remain unencrypted Sender and integrity of the email can be verified (signature) Both communication partners need to use the encryption in order to communicate in an encrypted manner Further information on end-to-end encryption can be found in the end-to-end encryption section. Address book and calendar encryption (optional): Personalised encryption of contacts and calendar entries Address book and calendar encryption: Posteo users have the ability to encrypt (AES) their calendar and address book data at the click of a button. AES encryption directly in the database Key protected with your password Calendar and address book encryption protects your address book and calendar data from access by third parties Further information on address book and calendar encryption can be found in the address book and calendar encryption section. Tip: All of Posteo’s encryption features can be combined with one another without issue. Access Access encryption can be recognised in your browser via the https:// in our internet address. Access to our server occurs fundamentally over encrypted TLS connections. We secure this additionally with "Perfect Forward Secrecy" technology (PFS) and DANE/TLSA. PFS effectively prevents the possibility that logged connection information could be mass-decrypted by a third party. DANE verifies the authenticity of our server. Thus you can always be certain that nobody is eavesdropping on your network traffic, reading your emails or stealing your access data. Why we encrypt access: These days, users access their email through a variety of means – for example, over open Wi-Fi networks or internet cafés. In such circumstances, people don’t only check their email but also log in to other internet sites and services. Because many users have set up similar passwords and usernames with various sites, a door is opened as soon as access to an email account is established. You don’t have to blindly trust us: You can see and test our encryption (as well as that provided by other services) on the independent Qualys test site. We always keep our encryption up to date. We therefore receive the best possible mark of A+ for the Qualys test (as of 01/2024). Source: SSLlabs.com Access to Posteo is always encrypted. We do not offer unencrypted connection. Webmail Local email programs Mobile devices TLS (1.2-1.3) with PFS Strict Transport Security (HSTS) DANE/TLSA Security tip: Security tip: Update your browser and email programs at regular intervals. We always use the latest encryption technologies – in some cases, older browsers can not handle this. Internet Explorer 8 does not support the safeguard of encryption with PFS, for example. Like Windows XP support, we no longer provide support for Internet Explorer 8. Certificate Extended security certificate So that you can always be sure that the encrypted connection really is with the Posteo server, we have introduced a so-called extended (green) security certificate, with which you can quickly identify the encryption partner (see image). Such certificates are used first and foremost by companies that have anything to do with sensitive information, for example, banks. In addition, you can also find the fingerprint of our security certificate on our legal notice page, in order to perform a manual check. Why we use an extended certificate: Phishing sites attempt to obtain user data by building identical copies of bank websites and those of other internet services in order to obtain your login information when you log in to a falsified website. With the advanced certificate, you can quickly identify that you are really on our website. The security certificate can be seen by clicking on the symbol (which varies between browsers) to the left of our address. Transport route Encrypted email traffic It’s often said that emails are like postcards in that anyone can read them along the way. This is not always correct. When sending and receiving emails, our servers attempt to establish an encrypted connection (a PFS-backed TLS connection) with the other server. If the other server supports it, the email will be sent via an encrypted connection. This encryption happens automatically in the background; You and your correspondence partner don’t need to do anything more. If the route is encrypted with TLS, nobody can read the (unencrypted) email on its journey. PFS technology prevents subsequent large-scale decryption by unauthorised third parties. Since May 2014, Posteo also supports the innovative DANE/TLSA technology, which eliminates various weaknesses in the prevalent encryption of email traffic. DANE increases the security when sending emails via an encrypted connection as well as when accessing websites. Following the NSA scandal, many email services have improved and now support encryption of the transport route, though there are large discrepancies in the quality of the implementation. We hope this will be further improved, as the quality of encryption between two servers depends upon the weaker of the pair. In particular, we hope that the DANE technology that we have taken up will soon become widely used, because we are convinced that DANE significantly contributes to making digital communication more secure. Please take note of the list (on the right), which we regularly update. Encryption of the transport route protects all data during delivery from unauthorised eavesdroppers – the content of an email as well as the metadata. When Posteo users write to each other, the email exchange does not leave our encrypted servers at any point. Transport route encryption: TLS (1.0-1.3) with PFS DANE/TLSA Protects emails and metadata Happens automatically TLS: An overview of providers Encrypted transport route from Posteo to: TLS DANE Arcor yes no AOL yes no Bund.de yes yes Comcast/Xfinity yes yes Freenet yes yes Gmail yes no GMX yes yes Microsoft 365 yes no* O2 yes no Outlook.com yes no Riseup yes yes T-Online yes no Vodafone yes no web.de yes yes Yahoo yes no *DANE is already supported when sending emails from Microsoft 365 to Posteo. According to Microsoft, inbound DANE support is planned for March 2024. As of 6/2023 Servers Encrypted servers Our servers (Linux) are located in a data centre in Frankfurt, Germany. Employees at the data centre have no access to our systems. The hard disks of all Posteo servers are fully encrypted. We use dm-crypt/LUKS to encrypt the hard disks. Encryption and decryption is supported by the CPUs and therefore functions more efficiently (AES-NI). If the hard disks are disconnected from our servers (due to maintenance or arbitrarily) then the information saved there is not readable by third parties. Even a loss of complete systems would not be a problem in this regard – only we can unlock the information. We encrypt all connections – including within Posteo: All services used are internally encrypted (with SSH and TLS, among others) so that eavesdropping is not possible either in the data centre or on the way to the backup location. Your emails are stored on our encrypted hard disks. You can fully encrypt the emails themselves by activating Posteo crypto mail storage. Server encryption: Linux servers with dm-crypt/LUKS encryption Encryption of internal connections with SSH and TLS Features: Encrypted hard disks protect against theft and caprice Encrypted connections within Posteo’s systems constitute additional protection against unauthorised parties Crypto mail storage Posteo crypto mail storage With Posteo, you have the possibility to encrypt all the email data in your account at the click of a button. The encryption encompasses not only the content and attachments for all emails, but also the corresponding metadata (email header, sender, recipient, time, subject, etc.). The encryption is comprehensive: it encompasses your email archive saved with Posteo as well as all newly-arriving emails. The data encrypted within crypto mail storage is also no longer readable by us as the provider. The encryption works without you needing to do anything special. Whenever you access an email, it is made readable (only for you) in the background using your password at the moment of access. The encryption is activated with the click of a button. Here’s how: You can activate crypto mail storage in the settings at the click of a button. You do not need any special technical knowledge. Posteo subsequently generates an individualised key pair for you and encrypts all your email data (content and metadata) in the background. This occurs with the part of your key pair that is responsible for encrypting. The key that makes your emails readable is stored in our database, protected by your personal password. In this way, only you can access your encrypted email storage. With crypto mail storage enabled, your emails will only be decrypted for you the moment they are accessed. Important: When you use crypto mail storage, you need to take special care with your password. It is the key t'''
