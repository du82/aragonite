full_description = "An unpaid email account can not yet be used for sending and receiving emails - in order to protect you and other internet users from senders of spam and misuse. You can already become familiar with the webmail interface and also set up the email account in an email client, for example, or install the Posteo web app. After payment has been received, you can configure all settings as well as send and receive emails. An unpaid email account can not yet be used for sending and receiving emails - in order to protect you and other internet users from senders of spam and misuse. You can already become familiar with the webmail interface and also set up the email account in an email client, for example, or install the Posteo web app."
