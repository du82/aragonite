["https://posteo.de/fr/site/qui_sommes_nous"]
title = "E-mail vert, sûr, simple et sans pub - posteo.de - Posteo"
description = "Posteo est un fournisseur de messagerie innovant misant sur la durabilité et la protection de la vie privée. Il fonctionne entièrement sans publicité. Nos boîtes mail, calendriers et carnets d'adresse peuvent être syncrhonisés: nous utilisons un concept de chiffrement global."
full_description = "Aperçu Posteo est un fournisseur de messagerie allemand indépendant dont les locaux se situent à Berlin. Nous vous proposons des boîtes mail anonymes et durables, des carnets d'adresse et des calendriers ainsi qu'un concept de chiffrement uniques. Notre offre est totalement exempte de publicité et auto-financée. Posteo a été créé en 2009. Nous souhaitons inciter à plus de sécurité, de protection des données et de durabilité sur Internet, et surtout vous proposer des alternatives. Pour tous ceux qui en ont assez des entreprises collectant les données personnelles, des boîtes mail infestées de publicité et de la surveillance généralisée sur Internet, pour tous ceux qui tiennent à agir de façon économique et écologique : nous nous engageons à protéger les données de nos utilisateurs et à ne jamais les vendre à l'annonceur le plus offrant. C'est pour cela que nous ne collectons aucune donnée à caractère personnel, que nous avons renoncé aux outils de suivi (tracking) et que nous effectuons des sauvegardes de sécurité quotidiennes. Posteo vous offre un concept de chiffrement innovant. Nous chiffrons toujours vos données à l'aide des technologies les plus avancées et soutenons une diffusion large des standards ouverts. Nous nous engageons pour les droits numériques du citoyen : en mai 2014, Posteo a été le premier opérateur de télécommunication à publier un rapport de transparence. Page de protection des données >> | Page d'information sur le chiffrement >> Posteo est doté d'un concept global de durabilité. Nous travaillons avec de la « vraie » électricité verte fournie par le fournisseur d'électricité écologique allemand Green Planet Energy, et non pas avec de l'électricité certifiée qui est souvent présentée à tort comme de l'électricité verte. L'utilisation de matériel efficace et de papier recyclé est pour nous tout aussi évidente que l'ouverture de notre compte bancaire à la banque écologique et durable GLS. Page d'information sur la durabilité >> Après la révélation du scandale de la NSA, notre offre a été fréquemment recommandée par les médias et testée par des magazines d'informatique. Posteo dans les médias >> Informations externes Article Wikipedia sur Posteo (anglais) Posteo Gagnant de la Stiftung Warentest (association de protection des consommateurs) 02/2015 c't Magazin 08/2013 c't Magazin 01/2014 zeit.de 07/2013 Sélection d'articles de presse Portrait de Posteo dans le quotidien Tagesspiegel (allemand) Portrait de Posteo dans le quotidien Berliner Zeitung (allemand) Portrait de Posteo par l'Ökotest-Verlag (allemand) The Guardian sur Posteo (anglais) Deutsche Welle sur la critique de Posteo (allemand) zeit.de sur le rapport de transparence (allemand) Heise sur notre utilisation de DANE (allemand) Plus d'articles >> L'équipe Nous nous engageons à être de bons employeurs. Posteo embauche pour cela uniquement en contrat à durée indéterminée. Nous payons des salaires adaptés et n'exigeons aucune heure supplémentaire. Nos employés peuvent gérer leurs horaires de travail de façon flexible. De plus, nous offrons un déjeuner quotidien bio et végétarien à tous nos employés. Vous trouverez nos offres d'emploi actuelles sur notre page Nous rejoindre >> Notre équipe de service client vous aide par e-mail en répondant à toutes vos questions (service gratuit). Nous nous efforçons de répondre en l'espace d'un jour ouvré. Formulaire de contact >> Nos développeurs s'attèlent tous les jours à la recherche d'innovations techniques, notamment d'options de chiffrement. Posteo mise uniquement sur les standards ouverts et les logiciels libres. Nous publions nos avancées en matière de développement afin de renforcer la communauté open source. Github >> Patrik Löhr est fondateur et directeur de Posteo. Il est en charge de l'administration et de l'équipe de développeurs. Sabrina Löhr est fondatrice de Posteo. Elle dirige les relations presse, le contenu et le design de Posteo. Dean Ceulic dirige les relations publiques et le marketing. Il nous représente auprès des milieux politique et associatif. Le site de Posteo Posteo est installé dans les locaux de l'ancienne brasserie Schultheiss dans le quartier de Kreuzberg à Berlin. Nos bureaux, le Lab Posteo et notre cantine s'y trouvent. Tous nos espaces sont équipés de façon durable et sont alimentés avec de l'électricité verte fournie par le fournisseur écologique Green Planet Energy. Pour en savoir plus, rendez-vous sur notre page d'information sur la durabilité >>. Les bureaux Nos espaces sont lumineux et fonctionnels. Tous les bureaux sont faits sur mesure, en bois FSC huilé. Les étagères et meubles à roulettes proviennent de la marque durable et écologique Werkhaus. Nous tenons à ce que chaque acquisition soit respectueuse de l'environnement. La cantine Chaque midi, nous offrons à nos employés un déjeuner bio et végétarien. Pour cela, Posteo emploie un cuisinier. Posteo met également en permanence à disposition des boissons, des fruits ainsi que des snacks, tout ceci gratuitement. Le Lab Posteo Le Lab Posteo est un lieu de rencontres et de manifestations situé dans le quartier de Kreuzberg à Berlin. Dans notre Lab, vous pouvez tester Posteo sur place, recharger votre crédit ou participer à une formation au chiffrement individuelle. De plus, nous exposons du matériel produit d'après les principes de la durabilité, comme le Fairphone ou la souris équitable. Le Lab est lui aussi meublé selon les critères de la durabilité. Nous organisons régulièrement dans le Lab des conférences, des séances d'information, des formations ou des évènements culturels. Vous trouverez toutes les informations relatives à nos évènements à venir dans notre calendrier des évènements. Nous mettons le Lab à disposition d'organisateurs externes, et ceci gratuitement. Les évènements qu'ils organisent doivent correspondre à l'esprit de Posteo et à nos centres d'intérêt. Si cela vous intéresse, vous pouvez nous envoyer une demande par e-mail : veranstaltungen(arobase)posteo(point)de. Vous nous trouverez à l'adresse suivante : Posteo Lab Methfesselstraße 36 10965 Berlin-Kreuzberg (anciens bâtiments de la brasserie Schultheiss) Accès en transports en commun : U6/Platz der Luftbrücke Openstreetmap: http://www.openstreetmap.org/node/1145589771 Le quartier L'ancienne brasserie Schultheiss est située au sommet du point culminant naturel de Berlin intra-muros : le quartier de Kreuzberg à Berlin. À côté de la brasserie se trouve le Viktoriapark, un parc offrant un panorama sur toute la ville. Quelques mètres en-dessous de nos locaux dans la Methfesselstraße, une plaque commémorative nous rappelle que Konrad Zuse a construit et mis en service à cet endroit le « Zuse Z3 », premier ordinateur numérique du monde. Infrastructure Nos serveurs se situent dans des centres de données à Francfort-sur-le-Main, Bielefeld et Berlin. Ils fonctionnent à 100% avec de l'électricité produite par Green Planet Energy. Pour tous les serveurs Posteo, nous utilisons uniquement des logiciels open source, ceci pour des raisons de sécurité. Les disques durs sont entièrement chiffrés avec LUKS - tous les échanges entre nos serveurs sont également chiffrés. Pour en savoir plus, rendez-vous sur notre page d'information sur la durabilité et notre page d'information sur le chiffrement. Les statistiques Posteo Posteo existe depuis 15 ans + 180 jours Dettes & crédits 0 € Revenus provenant de la publicité 0 € Km de vol pour voyages d’affaires depuis la création 0 km Traçage et intégration des réseaux sociaux 0 pce Déchets atomiques produits par boîte mail 0 gr. Mots de passe oubliés 166425 + (X) (x : variable inconnue) S'inscrire maintenant. Vous pouvez ouvrir votre boîte mail Posteo pour 1 €/mois et l'utiliser immédiatement. L'inscription ne nécessite de divulguer aucune donnée personnelle. S'inscrire >>"
