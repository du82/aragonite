["https://posteo.de/news/utah-polizei-soll-ki-einsatz-bei-polizeiberichten-offenlegen-m%C3%BCssen"]
title = "E-Mail grün, sicher, einfach und werbefrei - posteo.de - Utah: Polizei soll KI-Einsatz bei Polizeiberichten offenlegen müssen"
description = "Posteo ist ein innvovativer E-Mail-Anbieter, der auf Nachhaltigkeit und Datenschutz setzt und komplett Werbefrei ist. Unsere E-Mail-Postfächer, Kalender und Adressbücher sind synchronisierbar - wir setzen auf umfassende Verschlüsselung."
full_description = "Julius Stiebert 25.02.2025 Utah: Polizei soll KI-Einsatz bei Polizeiberichten offenlegen müssen Ein Gesetzentwurf in Utah sieht vor, dass Polizeiberichte gegengelesen werden müssen, wenn sie mit sogenannter KI erstellt wurden. Mehrere Polizeibehörden in den USA verwenden bereits Software, die aus Bodycam-Aufnahmen Berichte erstellen soll. (Quelle: IMAGO / Imagn Images) Im US-Bundesstaat Utah könnten Polizeibeamte künftig verpflichtet sein, den Einsatz sogenannter künstlicher Intelligenz (KI) beim Verfassen von Berichten offenzulegen. Ein entsprechender Gesetzentwurf wird derzeit beraten. Experten hoffen, dass andere Bundesstaaten folgen. Der SB180 genannte Gesetzentwurf sieht vor, dass von sogenannter KI erstellte Polizeiberichte von einem Menschen überprüft werden müssen. Außerdem müssen die Berichte einen Hinweis enthalten, dass beim Erstellen KI-Werkzeuge verwendet wurden – oder diese den Bericht sogar komplett geschrieben haben. Außerdem sollen die Behörden Richtlinien entwickeln, in denen beispielsweise die zugelassenen KI-Programme aufgeführt sind. Der knapp gehaltene Entwurf wurde von der demokratischen Senatorin Stephanie Pitcher eingebracht. Die Anwältin und ehemalige Staatsanwältin sagte gegenüber lokalen Medien, Strafverfolgungsbehörden würden sich zunehmend auf sogenannte KI verlassen. Das Gesetz würde Mindeststandards für den Umgang damit schaffen. Sie erklärte, der Einsatz von KI zum Erstellen von Polizeiberichten oder in der Ermittlungsarbeit werfe eine Reihe von Fragen auf – daher brauche es Richtlinien. Der Gesetzentwurf sieht vor, dass bei Verstoß gegen die Regeln Disziplinarmaßnahmen eingeleitet werden können. Konkret benannt werden diese jedoch nicht. “Notwendiger Schritt” Die Bürgerrechtsorganisation Electronic Frontier Foundation (EFF) erklärte, der Gesetzentwurf sei “leider ein notwendiger Schritt”. Die Organisation hofft, dass daraus eine größere Diskussion über entsprechende Regeln entsteht. Sie mahnt aber auch: Es brauche mehr als einen Hinweis, um mögliche negative Auswirkungen von KI-generierten Polizeiberichten einzudämmen. Insbesondere die Software Draft One hat im vergangenen Jahr für Kritik gesorgt. Sie stammt von Axon, einem bekannten Anbieter von Elektroschockpistolen – unter dem Markennamen Taser – sowie sogenannten Bodycams. Draft One generiert aus den Audioaufnahmen von am Körper getragenen Kameras einen Polizeibericht. Das Unternehmen verspricht vor allem, Beamte könnten Zeit bei der Schreibarbeit einsparen. Berichten zufolge testen Polizeibehörden in mehreren US-Bundesstaaten die Software oder setzen sie bereits ein – auch in Utah. Außerdem gibt es ähnliche Produkte von Mitbewerbern. Die EFF hatte bereits kurz nach der Vorstellung von Draft One im vergangenen Jahr gewarnt, Algorithmen könnten häufig Unterschiede in Dialekten oder Umgangssprache nicht zuverlässig unterscheiden. Die Technologie könnte daher Gesagtes falsch wiedergeben. Die Darstellung könnte auch verändert werden, abhängig davon wie die Software Gesagtes interpretiert: Wenn im Video ein Beamter beispielsweise rufe “der Verdächtige ist bewaffnet”, bedeute das noch nicht, dass tatsächlich eine Waffe im Spiel war. In einem mit Technologie automatisch erstellten Bericht könnte aber eine Tatsache daraus werden – die für Beschuldigte vor Gericht schwere Folgen haben könnte. Die Organisation hatte außerdem gewarnt, wenn Beamte bei einer Lüge im Bericht erwischt würden, könnten sie versuchen, sich mit einem von der Software gemachten Fehler herauszureden. Zentrale Rolle in Strafverfahren Die American Civil Liberties Union (ACLU) hatte im Dezember ebenfalls erklärt, Polizeiberichte würden im Rechtssystem eine entscheidende Rolle spielen. Sie seien häufig die einzige offizielle Darstellung eines Vorfalls und würden in Strafverfahren, in denen über die Schuld und Strafe einer Person entschieden wird, eine zentrale Rolle einnehmen. Strafverfolger sollten ihre Berichte daher nicht von Algorithmen schreiben lassen. Die Organisation kritisiert beispielsweise, dass die Aufzeichnungen von Bodycams die Grundlage für die Berichte bilden. Videobeweise seien aber nicht objektiv – weil beispielsweise der Kamerawinkel, aber auch der Zeitpunkt, wann die Aufnahme gestartet wurde, die Darstellung einer Situation beeinflusse. Eine weitere wichtige Quelle für Polizeiberichte sei die Erinnerung der Beamten, die sich allerdings leicht verändern könne. Deshalb sei es wichtig, dass sie ihre Erinnerungen aufschreiben, bevor sie die Videoaufnahmen ansehen oder daraus einen Bericht erstellen lassen. Zudem kritisiert die ACLU mangelnde Transparenz bezüglich der genauen Funktionsweise von Draft One. Daraus könnte bei einer Anklage ein signifikantes Problem werden. Noch im Gesetzgebungsverfahren Der Senat in Utah hat den Gesetzentwurf in der vergangenen Woche bereits verabschiedet, aktuell befindet er sich im Repräsentantenhaus zur Beratung. Schließlich müsste noch der republikanische Gouverneur Spencer Cox das Gesetz unterschreiben, bevor es in Kraft treten kann. In King County in der Nähe von Seattle im Bundesstaat Washington wurde der Polizei laut EFF bereits Ende vergangenen Jahres vorerst untersagt, ihre Berichte von diesen neuen Technologien verfassen zu lassen. (js)"
year_published = 2025
