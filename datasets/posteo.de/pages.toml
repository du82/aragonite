["https://posteo.de/en/site/transparency_report"]
title = "Email green, secure, simple and ad-free - posteo.de - Transparency report"
description = "Posteo is an innovative email provider that is concerned with sustainability and privacy and is completely ad-free. Our email accounts, calendars and address books can be synchronised - we use comprehensive encryption."
full_description = '''Topic Transparency reports should become obligatory for telecommunications providers In 2014, Posteo was the first German telecommunications provider to publish a transparency report about requests made by law enforcement agencies. Back then, we had first asked for a legal opinion to clarify the legal possibility of reports of that kind in Germany. Hans-Christian Ströbele, member of the German Parliament, additionally submitted a parliamentary question to the federal government about this topic. Read more about our proposal here. In 2014, Posteo was the first German telecommunications provider to publish a transparency report about requests made by law enforcement agencies. Back then, we had first asked for a legal opinion to clarify the legal possibility of reports of that kind in Germany. Hans-Christian Ströbele, member of the German Parliament, additionally submitted a parliamentary question to the federal government about this topic. Read more about our proposal here. Our goal: To establish transparency reports in Germany. Almost four years later we are now taking stock: Since then, some providers have started to publish their own reports. Many German companies, however, still do not publish numbers of requests by authorities. Several telecommunication services did not continue to publish their numbers after the year 2015. Furthermore, the information provided in the available reports often does not create transparency: Transparency is achieved when providers state the number of requests regarding different types of data. And: How often data was subsequently released to authorities. Unfortunately, only one number is mentioned in most reports: Either the number of requests or the number of releases. This is not transparent. In this way, users do not get to know how a company handles these requests. Nor how many requests were illegal. If the number of releases is missing, users cannot identify which information about them actually exists at the provider. We therefore think that transparency needs an obligatory agreement: We wish for transparency reports and their specific form to become mandatory by law for German telecommunications providers. Transparency is only achieved if the reports supply informative statements. Support by former Minister for Consumer Protection Renate Künast Also Renate Künast (MdB), former Minister for Consumer Protection and up to now chairwoman of the Parliamentary Committee on Legal Affairs and Consumer Protection, regards informative transparency reports as an undeniable right of every consumer: "Transparency reports are a manifestation of the consumers' informational self-determination. We are entitled to meaningful transparency reports!" (transl.) Our claims for such a regulation, from our experience, are: For each type of data (e.g. for traffic data, user information, content data), at least two values should have to be provided: How often and in which context (for example requests for traffic data, manual and automatic requests for user data, seizures or TKÜ) authorities have requested data. How often the respective data types have actually been released subsequently. (e.g. traffic data, user information, content data in the context of seizures or TKÜ) Further proposals by Posteo for obligatory transparency regulations: Telecommunications providers should also be obliged to transparently document all requests from intelligence services in their reports. The rate of requests that were formally incorrect should be listed as well. This statistical feedback would be valuable for the legislators, the privacy officers and other protagonists in society. At Posteo, the rate of illegal requests is at around 50 per cent, which is why we see an urgent need for action in this matter. To ensure ideal comparability, the companies' reports should also be published in an open data format so that they can be statistically processed. In the previous years, surveillance laws in Germany have been gradually extended. In our view, instruments are missing that would in return strengthen the democratic control of these laws. Mandatory transparency reports can contribute to that. After having observed the development for four years, we now put forward this proposal.'''
year_published = 2025
