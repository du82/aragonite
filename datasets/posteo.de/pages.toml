["https://posteo.de/en/news/whatsapp-users-targeted-by-spyware"]
title = "Email green, secure, simple and ad-free - posteo.de - WhatsApp users targeted by spyware"
description = "Posteo is an innovative email provider that is concerned with sustainability and privacy and is completely ad-free. Our email accounts, calendars and address books can be synchronised - we use comprehensive encryption."
full_description = "Julius Stiebert 06.02.2025 WhatsApp users targeted by spyware WhatsApp users, including journalists, were targeted by spyware made by Paragon Solutions. WhatsApp is weighing legal action against the company. An Italian investigative journalist has come forward and identified himself as one of the victims. (Source: IMAGO / NurPhoto) 90 WhatsApp users were victims of a hack using spyware developed by Paragon Solutions. Those targeted include journalists and members of civil society, WhatsApp announced last week. The company has not disclosed further details on the identities of those targeted. A spokesperson for WhatsApp told Reuters that the attacks were directed at individuals in more than two dozen countries. Victims’ devices were potentially compromised, meaning the attackers may have gained access to chats and other data – WhatsApp directs victims to the Canadian internet watchdog Citizen Lab, which has searched devices for evidence of spyware infiltration in the past. Soon after the attacks became public, the Guardian reported that the Italian investigative journalist Francesco Cancellato was among the WhatsApp users targeted. Cancellato is editor-in-chief of the news site Fanpage, which last year published an investigation showing members of the youth organization of the ruling party, Fratelli d’Italia, using fascist chants and slogans. The individuals targeted were sent a malicious PDF that gave the attackers access to their smartphones without any action on the victims’ part – a so-called “no-click attack.” As the Guardian reports, WhatsApp is currently alerting those impacted by the hack. The attacks were discovered in December and subsequently disrupted. Paragon spyware The spyware allegedly used in the attacks is a product of the Israeli company Paragon Solutions. According to the Guardian, the company sells its products exclusively to government clients – WhatsApp has not been able to determine who used the spyware against the 90 targeted individuals. The Guardian cites a person close to Paragon who told the paper that the company “had 35 government customers, that all of them could be considered democratic, and that Paragon did not do business with countries, including some democracies, that have previously been accused of abusing spyware.” These countries, according to the source, include Greece, Poland, Hungary, Mexico and India. Paragon’s spyware is known under the name Graphite. It has capabilities similar to the controversial Pegasus spyware developed by NSO Group, another Israeli company: for example, attackers using the tool can gain full access to a device and read an individuals chat histories and other data. In December 2022, the New York Times reported that the US Drug Enforcement Agency used Graphite. Wired Magazine also reported in October 2024 on a contract between the US Immigration and Customs Enforcement agency and Paragon. This prompted criticism from Human Rights Watch (HRW) – not least because, as HRW alleges, the agency has been “linked to human rights abuses.” Soon after Wired’s report appeared, the Biden administration placed the contract under review in order to determine whether it complies with guidelines governing the use of spyware by US agencies. Paragon has a US office in the state of Virginia. Last year there were reports that the company, which was founded by former Israeli prime minister Ehud Barak, had been sold to a US-based private equity firm. According to the Guardian, it is not clear whether the purchase has been finalized. Criticism of the spyware industry Natalia Krapiva of Access Now told the Guardian: “For some time Paragon has had the reputation of a ‘better’ spyware company not implicated in obvious abuses, but WhatsApp’s recent revelations suggest otherwise. This is not just a question of some bad apples – these types of abuses are a feature of the commercial spyware industry.” John Scott-Railton of Citizen Lab, which has exposed several past instances of spyware abuse, told Reuters that this latest incident “is a reminder that mercenary spyware continues to proliferate.” Paragon did not respond to inquiries from multiple media outlets. A legal victory for WhatsApp WhatsApp sent the company a cease-and-desist order – and is now exploring further legal options. Last December, WhatsApp won a legal victory against Pegasus developer NSO group: a California court ruled that NSO was responsible for attacks on 1,400 WhatsApp users in 2019. The victims in the attacks included members of the press, lawyers, dissidents, human rights activists, diplomats, and government officials. Who was behind the 2019 attacks is unclear. What is known is that the attackers exploited a vulnerability in WhatsApp’s security infrastructure to infect smartphones with Pegasus. This prompted WhatsApp to file suit against NSO Group. The spyware developer tried several times to have the case dismissed. Under the administration of President Joe Biden, the US government imposed sanctions on NSO Group, whose spyware has been linked repeatedly to human rights abuses. So far these sanctions are still in effect under the new presidential administration. The Biden administration imposed sanctions on other spyware developers as well – but Paragon Solutions was not one of them. (js)"
