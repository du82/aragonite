["https://posteo.de/site/jobs"]
title = "E-Mail grün, sicher, einfach und werbefrei - posteo.de - Jobs"
description = """
eine(n) Web-Softwareentwickler(in) (m/w/d)                                            Die Aufgaben:                                                                                                Weiterentwicklung der Posteo Web-Anwendungen                                                    Pflege und Weiterentwicklung vorhandener Software-Projekte                                                    Ausbau des Testings und der Qualitätskontrolle/Dokumentation                                                                                        Die Anforderungen:                                                                                                sehr gute Kenntnisse in PHP, Javascript, HTML sowie Ruby/Rails                                                    Erfahrungen mit einschlägigen Tools und Frameworks                                                    Erfahrungen mit E-Mail, HTTP, DAV, REST, Microservices, SQL-Datenbanken, Git und Test-Driven-Development                                                    ausgeprägtes Interesse für Sicherheit                                                    sicherer Umgang mit Linuxsystemen                                                    gute Englischkenntnisse (Wort und Schrift)                                                    hohe Lösungsorientierung und Spaß an Herausforderungen                                                    Lernbereitschaft, Eigeninitiative und Zuverlässigkeit                                                    Ein abgeschlossenes Studium im Bereich Informatik oder eine Ausbildung im Bereich der Softwareentwicklung ist erwünscht, kann aber auch durch Berufserfahrung ausgeglichen werden.                                                                                        Wir bieten:                                                                                                eine Voll- oder Teilzeitstelle (28-40 Stunden) mit Gleitzeit                                                    eine unbefristete Festanstellung                                                    Mobiles Arbeiten ausserhalb des Büros ist vollständig möglich.                                                    ein faire Bezahlung und ein respektvolles Arbeitsumfeld                                                    eine interessante, vielseitige Tätigkeit in einem professionellen Entwickler-Team                                                    Unser(e) neue(r) Softwareentwickler(in) wird von uns betreut und eingearbeitet."""
full_description = 'Wir suchen Verstärkung! Posteo ist ein unabhängiger und innovativer E-Mail-Anbieter mit Sitz in Berlin. Wir setzen auf Nachhaltigkeit, Sicherheit, maximalen Datenschutz, einfache Bedienbarkeit und Werbefreiheit. Gegründet wurde Posteo 2009. Inzwischen besteht unser Team aus über 40 Mitarbeiterinnen und Mitarbeitern, verteilt über ganz Deutschland. Unbefristete Festanstellung Bei Posteo erhalten alle Arbeitnehmerinnen und Arbeitnehmer eine unbefristete Festanstellung. Wir sind grundsätzlich an einer langjährigen Zusammenarbeit interessiert. Unsere Philosophie: Bei unbefristeten Arbeitsverträgen gibt es nur Gewinner. Die Mitarbeiterinnen und Mitarbeiter erhalten Planungssicherheit für die eigene Lebensgestaltung. Und Posteo profitiert von einem motivierten und erfahrenen Team. Full-Remote-Stellen möglich Wir arbeiten im Alltag online miteinander. Viele Tätigkeiten bei uns sind rein remote möglich: Daher leben manche aus dem Team in verschiedenen Teilen Deutschlands und arbeiten full remote für Posteo. Bewerben Sie sich gerne, auch wenn Sie zum Beispiel nicht in Berlin wohnen, wenn das die Stellenbeschreibung ermöglicht. Auch zeitweises Arbeiten innerhalb des Festlands der Europäischen Union ist möglich. Posteo-Campus Der Posteo-Campus ist der Arbeitsort für Mitarbeitende, die zeitweise oder dauerhaft an einem Büroarbeitsplatz in Berlin arbeiten möchten. Er befindet sich verkehrsgünstig auf dem Berliner Kreuzberg auf mehr als 1000 m² im historischen Ambiente einer ehemaligen Brauerei. Wenige Meter von dem Ort entfernt, an dem Konrad Zuse den ersten Computer der Welt baute. Das autofreie Gelände liegt direkt am Viktoriapark. Dieser eignet sich hervorragend zur Erholung und bietet einen spektakulären Blick über die Berliner Innenstadt. Auch der beliebte Bergmannkiez ist zu Fuß erreichbar. Die Büros sind geräumig, hell und ruhig gelegen. Alle verfügbaren Arbeitsplätze sind mit moderner Technik und Schreibtischen aus 100% FSC-zertifiziertem Holz ausgestattet. Für die Arbeit im Freien stehen mehrere Terrassen zur Verfügung. Work-Life-Balance Eine gute Work-Life-Balance versprechen heute viele Unternehmen. Doch was bedeutet das bei uns ganz konkret? Wir arbeiten mit einem Gleitzeit-Modell: Etwas früher oder später beginnen? Das ist bei uns Alltag. Die Arbeitszeiten lassen sich optimal an die eigenen Bedürfnisse anpassen. Für uns ist wichtig, dass die vereinbarte Wochenarbeitszeit eingehalten wird. Und dass eine gewisse Regelmäßigkeit bei den Arbeitszeiten besteht. Die Wochenarbeitszeit kann auf Wunsch an veränderte Lebenssituationen angepasst werden. Eine Rückkehr von Teil- auf Vollzeit ist für uns selbstverständlich. Bei Posteo haben wir einen wichtigen Grundsatz: Wir respektieren das Privatleben unserer Mitarbeiterinnen und Mitarbeiter. Feierabende und Urlaube werden von uns nicht gestört. Notfall- und Rufbereitschaften in der Systemadministration sind bei Posteo klar in den Arbeitsverträgen geregelt. Gleitende Arbeitszeiten sind in der Zeit zwischen 8:00 Uhr bis 20:00 Uhr möglich. Auch, um Überstunden zu vermeiden. Bei Posteo gilt die vertraglich vereinbarte Wochenarbeitszeit. Als wachsendes, aber nachhaltig und sozial wirtschaftendes Unternehmen stellen wir zusätzliche Arbeitskräfte an, wenn sie benötigt werden. Machen Arbeitnehmerinnen und Arbeitnehmer Überstunden, achten wir darauf, dass sie möglichst in der gleichen Kalenderwoche wieder ausgeglichen werden. Die Möglichkeit zur Remote-Arbeit bei vielen Stellen erhöht die Flexibilität im Alltag. Zeitweises Arbeiten innerhalb des Festlands der Europäischen Union ermöglicht mehr örtliche Abwechslung. Kostenfreies Mittagessen & Verpflegung In der Posteo-Kantine wird frisch für den Posteo-Campus gekocht: Unser kostenfreier, bio-vegetarischer Mittagstisch ist beim Team sehr beliebt. In den Teeküchen stellen wir außerdem Obst, Süßigkeiten, Kaffee, Mineralwasser und Saftschorle zur Verfügung. Unsere Köchinnen setzen auf eine gesunde, leckere und bodenständige Küche, die auch Fleischessern schmeckt. Bei uns kommen auch Burger, Pizza und Pasta auf den Tisch. Der kostenfreie bio-vegetarische Mittagstisch ist ein Angebot, mit dem wir unsere Umwelt- und Klimabilanz verbessern. Es gibt aber keinen „Veggie“-Zwang: Die Teilnahme ist freiwillig. Wer lieber etwas anderes essen möchte, findet u.a. in der nahe gelegenen Bergmannstrasse zahlreiche Lokalitäten. Kostenfreies ÖPNV-Ticket Wir übernehmen für alle Teammitglieder ein kostenfreies ÖPNV-Ticket, auch wenn sie ausschließlich remote arbeiten. Kostenfreie Fahrradwartung und Reparatur Posteo trägt die Wartungs- und Reparaturkosten für Fahrräder, die auch für den Arbeitsweg genutzt werden. Zusätzliche Urlaubstage bei Zugreisen ins Ausland Wird bei privaten Auslandsreisen auf das Flugzeug verzichtet, gewährt Posteo bis zu 2 zusätzliche Urlaubstage pro Jahr und einen Zuschuss für das Bahnticket: Bei diesem freiwilligen Angebot geht es darum, einen Anreiz für umweltfreundliche Zugreisen zu geben. Geschäftlich verzichtet Posteo aus Klimaschutzgründen vollständig auf Flugreisen: Wir haben eine "No Flights"-Policy. Ökostrom-Zuschuss Teammitglieder, die mit dem privaten Stromanschluss echten Ökostrom (von ausgewählten Stromanbietern) beziehen, erhalten einen pauschalen monatlichen Zuschuss von 50 EUR brutto zum Lohn. Mit diesem freiwilligen Angebot fördern wir Ökostrom auch bei Remote-Arbeit. Technikteam: Wer zu uns passt Neueste Sicherheitstechnologien und einfach bedienbare Verschlüsselungslösungen. Kein Tracking, kein Datensammeln: Bei Posteo trifft innovative Technologie auf ein echtes Verständnis von Datenschutz und Nachhaltigkeit. In unserem Team arbeiten Security-, Code- und Open-Source-Experten in einem agilen Umfeld zusammen. Zu unserem Technik-Team passen Menschen, die Fachkenntnisse, eine verantwortungsbewusste Persönlichkeit, Teamfähigkeit und eine schnelle Auffassungsgabe besitzen. Und: Die Open-Source leben. Proprietäre Software kommt auf den Posteo-Server-Systemen nicht zum Einsatz. Egal, ob Posteo-Umzugsservice, Krypto-Mailspeicher, unsere anonymisierte Bezahlung, die Verschlüsselung von Adressbüchern, Kalendern und Notizen oder die TLS-Versand-Garantie: Wir entwickeln konsequent selbst. Wir suchen zur Verstärkung unseres Teams aktuell: eine(n) Web-Softwareentwickler(in) (m/w/d) Die Aufgaben: Weiterentwicklung der Posteo Web-Anwendungen Pflege und Weiterentwicklung vorhandener Software-Projekte Ausbau des Testings und der Qualitätskontrolle/Dokumentation Die Anforderungen: sehr gute Kenntnisse in PHP, Javascript, HTML sowie Ruby/Rails Erfahrungen mit einschlägigen Tools und Frameworks Erfahrungen mit E-Mail, HTTP, DAV, REST, Microservices, SQL-Datenbanken, Git und Test-Driven-Development ausgeprägtes Interesse für Sicherheit sicherer Umgang mit Linuxsystemen gute Englischkenntnisse (Wort und Schrift) hohe Lösungsorientierung und Spaß an Herausforderungen Lernbereitschaft, Eigeninitiative und Zuverlässigkeit Ein abgeschlossenes Studium im Bereich Informatik oder eine Ausbildung im Bereich der Softwareentwicklung ist erwünscht, kann aber auch durch Berufserfahrung ausgeglichen werden. Wir bieten: eine Voll- oder Teilzeitstelle (28-40 Stunden) mit Gleitzeit eine unbefristete Festanstellung Mobiles Arbeiten ausserhalb des Büros ist vollständig möglich. ein faire Bezahlung und ein respektvolles Arbeitsumfeld eine interessante, vielseitige Tätigkeit in einem professionellen Entwickler-Team Unser(e) neue(r) Softwareentwickler(in) wird von uns betreut und eingearbeitet. Das hört sich interessant an? Dann freuen wir uns auf Ihre Bewerbung per E-Mail an: jobs@posteo.de. Wir suchen zur Verstärkung unseres Teams aktuell: eine(n) Systemadministrator(in) (m/w/d) Die Aufgaben: Mitarbeit bei der Administration der Posteo IT-Systeme Mitarbeit bei der Umsetzung von Projekten im IT-Bereich Mitverantwortung für die Verfügbartkeit der Systeme und Netzwerkdienste Installation, Konfiguration, Inbetriebnahme und Wartung der IT-Infrastruktur Dokumentation der IT-Inf