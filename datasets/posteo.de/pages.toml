full_description = "NEWS 28.02.2025 Utah : la police doit mentionner l'utilisation de l'IA dans ses rapports Un projet de loi dans l'Utah prévoit que les rapports de police doivent être relus lorsqu'ils ont été créés par intelligence artificielle (IA). NEWS 26.02.2025 Hausse du nombre de pays ayant imposé des blocages d’Internet en 2024 Selon le recensement d’Access Now, au moins 296 blocages de réseau ont eu lieu dans le monde entier, l’année dernière. Beaucoup étaient liés à des conflits et des guerres. NEWS 21.02.2025 Inde : des coupures d'Internet limitent les droits fondamentaux En Inde, les autorités ont coupé plus de 150 réseaux internet au cours des deux dernières années. Cela nuirait aux droits fondamentaux de millions de personnes, d'après un nouveau rapport. NEWS 20.02.2025 Les applications de rencontre réagissent négligemment aux signalements de violence D’après un rapport, le fournisseur d’applications de rencontre Match Group répond de manière insuffisante aux messages rapportant des abus. Pourtant, l’entreprise serait au courant de ces pratiques depuis des années. NEWS 13.02.2025 Enquête de la BBC : les chatbots d'IA font des erreurs dans les résumés d'actualité Les chatbots résument fréquemment des sujets d'actualité de manière erronée -- et affirment par exemple que d'anciens Premiers ministres sont encore en fonction. C'est ce que montre actuellement une enquête de la BBC. NEWS 12.02.2025 Arabie saoudite : libération d’une femme condamnée pour activités en ligne En Arabie saoudite, une femme a été libérée après avoir passé plusieurs années en prison pour avoir exprimé ses opinions en ligne. Elle avait été condamnée à plusieurs décennies d’emprisonnement. NEWS 05.02.2025 Des utilisateurs de WhatsApp ont été attaqués par un logiciel espion Des utilisateurs de WhatsApp, dont des professionnels des médias, ont été attaqués par un logiciel espion de Paragon Solutions. WhatsApp envisage une action en justice contre l'entreprise."
