["https://posteo.de/fr/news/les-applications-de-rencontre-r%C3%A9agissent-n%C3%A9gligemment-aux-signalements-de-violence"]
title = "E-mail vert, sûr, simple et sans pub - posteo.de - Les applications de rencontre réagissent négligemment aux signalements de violence"
description = "Posteo est un fournisseur de messagerie innovant misant sur la durabilité et la protection de la vie privée. Il fonctionne entièrement sans publicité. Nos boîtes mail, calendriers et carnets d'adresse peuvent être syncrhonisés: nous utilisons un concept de chiffrement global."
full_description = "Julius Stiebert 20.02.2025 Les applications de rencontre réagissent négligemment aux signalements de violence D’après un rapport, le fournisseur d’applications de rencontre Match Group répond de manière insuffisante aux messages rapportant des abus. Pourtant, l’entreprise serait au courant de ces pratiques depuis des années. Match Group comprend détient quelques-unes des plus grandes plateformes de rencontre, dont Tinder. (Source : IMAGO / imagebroker) Le fournisseur d’applications de rencontre Match Group n’entreprend pas assez pour garantir la sécurité de ses utilisatrices et utilisateurs. Telle est la critique formulée par plusieurs médias dans une recherche menée conjointement. Même après avoir été signalés pour harcèlement lors de rencontres, les utilisateurs fautifs peuvent souvent conserver leur compte. Et si leur compte est verrouillé, ils peuvent généralement se réinscrire avec les mêmes données. Quelques-unes des plateformes de rencontre les plus connues, telles que Meetic, Tinder, OKCupid et Hinge, font partie de l’entreprise américaine Match Group. Des plateformes moins connues, comme Plenty of Fish, font également partie du groupe. L’alliance de recherche « Dating Apps Reporting Project », dont font entre autres partie The Markup et The Gardian, a passé 18 mois à étudier comment les plateformes traitent les cas d’abus. À cette fin, les journalistes ont analysé des documents internes, parlé à d’anciens employés et à des personnes victimes de violence sexuelle – et même effectué leurs propres tests. Match Group promet certes de bloquer les internautes sur toutes les plateformes lorsqu’ils sont signalés pour des abus. Pourtant, les recherches révèlent que le groupe agit peu – bien que la société ait été manifestement informée de cas d’abus depuis au moins 2016, selon des documents internes. Dès 2019 a été créée une base de données centrale dans laquelle sont rassemblés les signalements correspondants. Les informations sur les comptes signalés, y compris le numéro de téléphone et l’adresse électronique, ainsi que les photos de profil utilisées, y seraient également stockées. Malgré cela, les utilisateurs bloqués semblent être toujours en mesure de revenir sur les plateformes sans obstacles majeurs : au début des années 2024 et 2025, les journalistes ont créé plus de 50 comptes sur Tinder et les ont ensuite signalés pour harcèlements sexuels lors de rencontres – les comptes ont été bloqués dans les deux jours. Cependant, ils ont ensuite pu se réinscrire avec les mêmes nom, numéro de téléphone et date de naissance et même la même photo de profil. Dans d’autres applications de Match Group, il a été possible de recréer des comptes avec des données de comptes verrouillés. Aucun verrouillage Par le passé, les signalements d’utilisatrices n’ont pas toujours abouti à un verrouillage de compte. Les journalistes rapportent ainsi un cas particulièrement frappant. Un médecin de Denver dans l’État fédéral américain du Colorado a été signalé à plusieurs reprises pour avoir drogué et violé des femmes lors de rencontres. Le premier signalement est parvenu à Match Group dès septembre 2020, mais le médecin était encore actif sur Hinge en 2023, année où il avait tenté de violer une femme qui avait fait sa connaissance via l’application. Entre-temps, son profil aurait même été mis en avant sur la plateforme. Son compte n’a pas été bloqué jusqu’à ce qu’il soit arrêté. En octobre 2024, un tribunal l’a condamné à plusieurs années de prison. Il a été reconnu coupable de violences sexuelles contre onze femmes au total. Selon les recherches, il existerait encore d’autres femmes l’accusant de les avoir violées mais n’ayant pas porté plainte. Elles aussi avaient rencontré l’agresseur via la plateforme de rencontre. Les avocats des femmes concernées critiquent le fait que la plupart des agressions auraient pu être évitées. Un avocat a déclaré aux médias qu’il était « choquant » que l’auteur ait pu continuer à utiliser l’application Hinge pendant des années. Il accuse la plateforme de soutenir activement les abus. Les journalistes écrivent que l’affaire montre comment les applications de Match Group permettent aux agresseurs de trouver de nouvelles victimes. Ils se réfèrent également à une étude de l’Université Brigham Young qui a enquêté sur des centaines de harcèlements sexuels dans l’État fédéral américain de l’Utah en 2022. Selon cette étude, les agressions sexuelles se produisaient plus rapidement suite à des rencontres sur des applications que lorsque les auteurs avaient rencontré leurs victimes d’une autre manière – et les actes étaient plus brutaux. Aucune transparence Selon le rapport, le groupe avait déjà annoncé en 2020 qu’il publierait un rapport sur les mesures de transparence. Celui-ci devait inclure des informations sur les harcèlements sur et hors plateformes. Mais à ce jour, ce rapport n’a toujours pas été publié. Selon les investigations, il y aurait eu une discussion en interne concernant les informations à publier. Le groupe dispose depuis longtemps des outils et des ressources financières nécessaires pour renforcer les mesures de sécurité. Au lieu de cela, les outils existants n’auraient pas été utilisés sur toutes les plateformes, en partie par crainte de ralentir la croissance de l’entreprise. Dans une déclaration aux médias, le groupe a souligné, entre autres, qu’il utilisait des outils d’IA non spécifiés pour prévenir le harcèlement et coopérer avec les procureurs. Cependant, le rapport indique que bien que Match Group promet publiquement depuis des années d’améliorer la sécurité sur les plateformes, des initiés affirment que cela ne s’est pas produit. En fait, des membres de l’équipe de sécurité ont même été licenciés. Leurs tâches seraient maintenant effectuées par des prestataires de services externes qui recevraient peu de formation. Ils devraient également respecter des quotas stricts pour le traitement des cas. Cependant, le cas du médecin maintenant condamné a eu des conséquences politiques : l’été dernier, une loi a été adoptée au Colorado. Le « Online Dating Safety Act » oblige les fournisseurs à divulguer au Procureur général de l’État les mesures de protection prises. Cependant, il n’est toujours pas obligatoire de rapporter le nombre d’agressions sexuelles à l’encontre des utilisatrices de l’application. (js)"
