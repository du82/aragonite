["https://posteo.de/fr/site/services"]
title = "E-mail vert, sûr, simple et sans pub - posteo.de - Services"
description = "Posteo est un fournisseur de messagerie innovant misant sur la durabilité et la protection de la vie privée. Il fonctionne entièrement sans publicité. Nos boîtes mail, calendriers et carnets d'adresse peuvent être syncrhonisés: nous utilisons un concept de chiffrement global."
full_description = '''E-Mail Une messagerie en ligne facile d'utilisation Faites votre choix parmi 12 couleurs différentes. Les e-mails peuvent être déplacés dans différents dossiers par glisser-déposer en maintenant votre touche de souris enfoncée. Vous pouvez utiliser le mode conversation pour un aperçu efficace de vos dialogues e-mail. Gérez vos e-mails de façon individuelle. En mode HTML, vous disposez entre autres de différentes polices, couleurs et smileys. Vous pouvez enregistrer de nombreuses informations, notes et photos dans vos contacts. Vous pouvez trier vos contacts par groupes puis écrire des e-mails collectifs à ces groupes. Grâce au calendrier, vous pouvez gérer vos rendez-vous sur différents appareils, les partager avec d'autres ou encore les chiffrer. Envoyez des pièces jointes dont la taille peut atteindre 50 Mo. Pour la réception, 100 Mo maximum sont pris en charge. Créez autant de dossiers et de sous-dossiers que vous le souhaitez pour vos e-mails. Avec les filtres, vous pouvez déplacer vos e-mails automatiquement dans des dossiers ou les effacer. Configurez votre boîte de réception individuellement, comme vous le souhaitez. Filtrez l'affichage des e-mails et utilisez la fonction de recherche pour trouver vos e-mails efficacement. Créez différentes identités d'expéditeur. Vous pouvez demander à recevoir des accusés de réception ou de transmission pour vos e-mails. Grâce à notre service de collecte, vous pouvez déménager vos e-mails vers Posteo. Si besoin, mettez en place des transferts pour vos e-mails entrants. Vous pouvez adapter avec une grande souplesse, à tout moment, votre espace de stockage dans les paramètres. Grâce à nos bons d'achat, vous pouvez offrir du crédit à vos proches, amis ou collègues. Douze couleurs avec pour chacune deux niveaux de contraste Mode sombre pour toutes les couleurs Signatures Identités d'expéditeur Mode liste ou conversation Téléchargement de plusieurs fichiers en même temps Glisser-déposer Recherche rapide E-Mails HTML Diverses possibilités de paramétrage NOUVEAU : messagerie en ligne avec 12 couleurs et un mode sombre Mode sombre contrôlable via vos appareils ; toutes les couleurs et le mode sombre aussi disponibles dans l'appli web. Appli web Avec notre application web, utilisez Posteo facilement sur votre smartphone, votre tablette ou votre ordinateur. Concept de chiffrement et de protection des données global grâce à de nombreuses fonctions (par exemple, possibilité d'enregistrer toutes les données en un clic, authentification à deux facteurs (TOTP), chiffrement à l'entrée des e-mails avec S/MIME ou OpenPGP). Service client gratuit et personnalisé Notre équipe vous soutient par e-mail en cas de problème et répond à vos questions. 100% open source Notre offre mise, pour des raisons de sécurité, uniquement sur des logiciels en open source et des protocoles ouverts. De plus, nous utilisons uniquement Javascript, dont le code est disponible en open source. 2 Go d'espace de stockage (extensible) Votre boîte mail possède 2 Go d'espace de stockage. Vous pouvez élargir votre espace de stockage jusqu'à 20 Go. Chaque Go supplémentaire coûte 0,25 € par mois. Pièces jointes jusqu’à 50 Mo/100 Mo (envoyer/recevoir) Vos e-mails sur tous vos appareils (IMAP/POP3) Avec Posteo, vous pouvez gérer vos e-mails de façon synchrone sur tous les smartphones, tablettes ou ordinateurs (IMAP). De nombreux programmes trouvent les paramètres nécessaires par auto-configuration (par exemple : iOS, Thunderbird, Outlook) Un filtre anti-spam et anti-virus très efficace NOUVEAU : navigateur de pièces jointes et flux de photo Avec le navigateur de pièces jointes, vous pouvez visualiser les pièces jointes indépendamment des e-mails, les filtrer, les télécharger ou les supprimer. Pour les photos, un flux de photos moderne est à disposition. Notes Chez Posteo, vous pouvez gérer facilement vos notes et les envoyer par e-mail si besoin. Filtres individuels Vous pouvez filtrer vos e-mails en fonction des contenus ou des expéditeurs et ainsi trier vos e-mails en amont. 2 adresses alias incluses (jusqu'à 20 en option payante - 10 cent par alias par mois). Adresses filtres illimitées Utilisez autant d'adresses de filtre que vous le souhaitez (exemple+amazon@posteo.de, exemple+twitter@posteo.de, etc.) afin de garder votre boîte mail rangée et de trier vos e-mails. Nombre de dossiers illimités Vous pouvez créer autant de dossiers et de sous-dossiers que vous le souhaitez. L'arborescence des dossiers n'est elle non plus pas limitée. Service de migration Posteo Grâce au service de migration Posteo, vous pouvez transférer vos e-mails en toute sécurité depuis 3 boîtes mail externes, arborescence de dossiers incluse. Vous décidez si vous souhaitez copier le contenu complet de votre ancienne boîte mail ou seulement certains dossiers. "Faire suivre" ses e-mails Notre service de collecte capte toutes les 10 minutes les e-mails entrants de votre ancienne boîte mail. Transferts et messages d'absence Plusieurs codes de pays Votre adresse e-mail peut avoir deux terminaisons : "posteo.de" ou "posteo.net". Pour vos adresses alias, vous disposez de beaucoup plus de domaines, entre autres posteo.be, .ch, .net, .org et plus encore. Carnet d'adresses "Gérez vos e-mails facilement avec le carnet d'adresses de notre messagerie en ligne. Vous pouvez utiliser le carnet d'adresses sur tous les appareils et le chiffrer avec votre mot de passe" Contacts Enregistrez des adresses e-mail, des numéros de téléphone, des adresses postales, des anniversaires et de nombreuses autres données relatives à vos contacts dans votre carnet d'adresses. Chiffrement Vous pouvez chiffrer le carnet d'adresses Posteo de façon centrale (AES) et l'utiliser ainsi sur tous vos appareils. La clé est votre mot de passe - nous-mêmes n'avons pas accès à vos données. Le carnet d'adresses sur de nombreux appareils Grâce au standard CardDAV, vos contacts peuvent être synchronisés avec la plupart des smartphones, tablettes et ordinateurs. Service de migration Depuis certains fournisseurs de messagerie (AOL, GMX, Hotmail, iCloud, Office 365, Outlook.com, WEB.DE et Yahoo!), vous pouvez déménager votre carnet d'adresses vers Posteo en un clic. Depuis d'autres fournisseurs de messagerie, les carnets d'adresse peuvent être importés en format vcard ou csv. Liste de diffusion Vous pouvez former des groupes de contacts. Photos Chaque contact peut être accompagné de sa photo. Calendrier "Gérez vos rendez-vous facilement avec le calendrier de notre messagerie en ligne. Vous pouvez synchroniser vos rendez-vous avec de nombreux appareils ou programmes via CalDAV ou les chiffrer avec votre mot de passe." Votre calendrier sur de nombreux appareils Le standard CalDAV permet de synchroniser vos rendez-vous avec la plupart des smartphones, des tablettes ou ds ordinateurs. Service de migration Votre ancien calendrier peut être importé en format ics. Anniversaires Le calendrier Posteo vous affiche, si vous le souhaitez, les anniversaires des contacts de votre carnet d'adresses. Partager le calendrier Partagez votre calendrier avec d'autres ou accédez au leur. Cela ne fonctionne pas si vous avez activé le chiffrement du calendrier. Chiffrement Vous pouvez chiffrer votre calendrier Posteo de façon centrale (AES) et l'utiliser ainsi en toute sécurité sur tous vos appareils. La clé est votre mot de passe - nous-mêmes n'avons pas accès à vos données. Afficher des calendriers externes Dans le calendrier de notre messagerie en ligne, vous pouvez afficher jusqu'à cinq flux de calendriers externes. Rappel Vous pouvez mettre en place des rappels pour vous souvenir de vos rendez-vous. Durabilité "Travailler à 100 % avec de l'électricité verte de Green Planet est pour nous évident, tout comme ouvrir le compte de notre entreprise auprès de la banque GLS." Bureau et Lab Posteo : Notre bureau et le Lab sont équipés selon des critères de durabilité (bois FSC, papier et meubles recyclés) Déjeuner : tous les jours un déjeuner bio et végétarien. Mobilité : tous nos employés utilisent les transports en commun ou le vélo. Nous offrons à nos employés un service gratuit d'entretien de leur vélo ainsi que des jours supplémentaires de vacances s'ils prennent le train. Dons : Nous faisons régulièrement des dons à des ONG qui travaillent entre autres dans les domaines de la protection de l'environnement et de la protection des données. Nous communiquons sur ces dons sur notre site "Qui soutenons-nous ?". Programmation efficace : Ménagement des ressources grâce à une organisation optimisée des processus coûteux en énergie. 100% d'électricité verte de Green Planet Energy Posteo fonctionne à 100% avec de l'électricité produite par Green Planet Energy. C'est non seulement le cas pour nos serveurs, mais également pour tous nos locaux. Les comptes bancaires de l'entreprise auprès de la banque sociale et écologique GLS La banque GLS investit son argent uniquement dans le financement de projets écologiques et utiles à la société. Économies à la Umweltbank Nos économies sont placées à la Umweltbank. Cette banque soutient avec cet argent des projets liés à l'environnement Matériel peu coûteux en énergie : Dans nos bureaux et pour nos serveurs, nous utilisons un matériel peu coûteux en énergie. Serveurs dimensionnés de façon adaptée : Nos serveurs sont dimensionnés en fonction de vos besoins et peuvent évoluer en fonction de vos envies. Pour en savoir plus, rendez-vous sur la Page d'information durabilité Protection des données "Notre mission est de protéger vos données et non pas de les vendre aux annonceurs les plus offrants. C'est pour cela que nous proposons des boîtes mail anonymes et que nous ne relevons aucune de vos données personnelles." Inscription anonyme : L'inscription ne nécessite pas d'indiquer ses données personnelles (comme votre nom ou votre adresse). Minimisation des données : Nous ne collectons pas vos données personnelles et ne disposons pas de données de trafic (comme les adresses IP) reliées à vos boîtes mail. Nos procédés et nos fonctions sont toujours conçus selon le principe de la minimisation des données. Paiement anonyme : Les procédures de paiement sont anonymisées à l'aide d'un système de paiement élaboré par Posteo. En bref, nous ne relions pas les données de paiement avec la boîte mail concernée. Accès chiffré par TLS : L'accès à votre compte se déroule toujours de façon chiffrée (TLS avec confidentialité persistante pour IMAP, POP3, Webmailer, CardDAV et CalDAV). Acheminement chiffré par TLS : Il protège vos e-mails et vos métadonnées quand l'autre serveur le permet aussi (TLS avec confidentialité persistante). Garantie de l'envoi par TLS Cette fonction de sécurité vous protège contre l'envoi d'e-mails à des systèmes peu sûrs. Si vous activez la garantie de l'envoi par TLS, nous n'envoyons vos e-mails que s'ils peuvent être envoyés au destinataire via une connexion chiffrée. Sinon, le transfert de l'e-mail est interrompu et vous recevez un message de notre part. Disques durs chiffrés : Les disques durs de nos serveurs sont chiffrés via AES (standard de chiffrement avancé) afin d'empêcher le vol des données et les accès non autorisés à votre compte. Stockage mail crypté : Chiffre toutes les données de messagerie enregistrées (contenus, pièces jointes et métadonnées) ainsi que les notes et le navigateur de pièces jointes en un clic. Le calendrier et le carnet d'adresses sont chiffrables : Si vous le souhaitez, vous pouvez chiffrer votre calendrier et votre carnet d'adresses avec votre mot de passe personnel. Ainsi, seul vous avez accès à vos données. Chiffrement à l'entrée avec S/MIME ou OpenPGP Grâce à notre chiffrement à réception des e-mails, vous pouvez chiffrer tous vos e-mails entrants avec votre clé publique S/MIME ou OpenPGP. Chiffrement de bout en bout, dans votre messagerie en ligne aussi Chez Posteo, vous pouvez aussi mettre en place un vrai chiffrement de bout en bout avec le plugin open source Mailvelope. Création d'adresses alias Vous pouvez créer des alias, c'est-à-dire des adresses e-mail supplémentaires dans votre boîte mail. En clair, vous pouvez utiliser différentes adresses pour différents usages. Les adresses alias sont chiffrées individuellement avec votre mot de passe afin de protéger votre sphère privée. Pour en savoir plus, rendez-vous sur : la page d'information Protection des données la page d'information Chiffrement Page d'information Paiement Pas de commerce des données personnelles et pas de divulgation des données : Pas de commerce des données personnelles et pas de divulgation des données (sauf en cas de décision judiciaire) Sauvegardes quotidiennes : Tous les jours, nous effectuons des sauvegardes de sécurité de toutes les boîtes mail et nous conservons ces dernières pour une durée de 7 jours. Avis automatique de suppression : Il arrive souvent que les utilisateurs suppriment des e-mails par erreur. Afin de vous protéger de la perte de données, Posteo vous informe par e-mail lorsqu'un nombre important d'e-mails ont été supprimés de votre boîte mail. Vous pouvez alors, si besoin, demander à temps de restaurer les e-mails. Suppression de l'adresse IP: Les e-mails que vous envoyez via notre messagerie en ligne ou des clients de messagerie ne contiennent ni vos adresses IP locales, ni vos adresses IP publiques. Filtres anti-spam et anti-virus très efficaces Nos serveurs se trouvent dans des centres de données extrêmement sécurisés. Pas d'utilisation d'outils de suivi (tracking) Sites web sans enregistrement de l'adresse IP Authentification à deux facteurs (TOTP) Sécurisez encore plus votre boîte mail avec notre authentification à deux facteurs. Cette fonction peut être installée sur tous vos appareils grâce à des applications gratuites (par exemple sur votre télephone, votre tablette, votre bureau ou sur du matériel particulier comme Yubikey). Certificats S/MIME chez Posteo S/MIME est un standard répandu dans le monde entier pour le chiffrement de bout en bout des e-mails. Un certificat S/MIME atteste également de l'authenticité d'une adresse e-mail et du contenu de l'e-mail. Dans les paramètres Posteo, vous pouvez facilement créer des certificats S/MIME. Les certificats S/MIME sont signés par une autorité de certification officielle (Certum) et apparaissent comme fiables dans les clients de messagerie. Ils ont une durée de validité d'un an et coûtent 365 centimes. Absence de publicité "Nous ne sommes pas financés par la publicité et fonctionnons à 100% sans elle :Vvous ne recevrez pas de publicité de notre part et nous ne souhaitons pas collecter vos données et/ou les vendre" Messagerie en ligne sans publicité Notre messagerie en ligne fonctionne sans publicité. Nous ne vous envoyons aucun mail de pub ou aucune newsletter vous informant de notre actualité commerciale. Site sans pub : Notre site internet est également complètement dépourvu de pub. Nous n'utilisons pas d'outils de suivi. Pas de partenaires commerciaux : Notre service n'est pas financé par la pub. Cela signif'''
