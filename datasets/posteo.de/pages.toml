description = """
Am Donnerstag, den 03.04., findet im Posteo Lab auf dem Berliner Kreuzberg eine Veranstaltung zum Girls’Day 2025 statt. Wir geben 10 Schülerinnen die Möglichkeit, einen Ausflug in die Welt des Codens zu machen und sich mit Informatikerinnen auszutauschen. Die Schülerinnen lernen auch die E-Mail-Welt näher kennen: Wir zeigen ihnen, wie es funktioniert, dass so viele Rechner weltweit miteinander kommunizieren und über Protokolle Informationen austauschen. Das werden die Mädchen auch selbst ausprobieren können – indem Sie mit einem E-Mail-Server chatten. Anmelden können sich Schülerinnen, die 12 Jahre oder älter sind und sich vorstellen können, später Software-Entwicklerin zu werden. Für die Teilnahme sind keine Vorkenntnisse notwendig. Der Veranstaltung beginnt um 9:30 Uhr.            Mehr Infos >>"""
full_description = 'Posteo Lab Das Posteo Lab ist ein Begegnungs- und Veranstaltungsort auf dem Berliner Kreuzberg. Das Lab wurde nachhaltig eingerichtet. Wir öffnen das Lab regelmäßig für Vorträge, Infoveranstaltungen, Schulungen und Kulturevents. Informationen zu aktuellen Veranstaltungen finden Sie in unserem Veranstaltungskalender. Veranstaltungen Wir öffnen das Posteo Lab regelmäßig für Vorträge, Infoveranstaltungen, und Schulungen. Auch Kulturevents finden bei uns statt. Wir stellen das Posteo Lab Externen auf Anfrage gerne kostenfrei zur Verfügung. Die Veranstaltungen sollten zu Posteo und unseren Themen passen. Veranstaltungsvorschläge bitte per E-Mail an: veranstaltungen@posteo.de Aktuelle Veranstaltungen 03.04.2025 09:30Uhr Girls’Day 2025: „Wie Entwicklerinnen Server auf der ganzen Welt dazu bringen, E-Mails auszutauschen" Eintritt: Frei (Anmeldung erforderlich) Veranstalter: Posteo Am Donnerstag, den 03.04., findet im Posteo Lab auf dem Berliner Kreuzberg eine Veranstaltung zum Girls’Day 2025 statt. Wir geben 10 Schülerinnen die Möglichkeit, einen Ausflug in die Welt des Codens zu machen und sich mit Informatikerinnen auszutauschen. Die Schülerinnen lernen auch die E-Mail-Welt näher kennen: Wir zeigen ihnen, wie es funktioniert, dass so viele Rechner weltweit miteinander kommunizieren und über Protokolle Informationen austauschen. Das werden die Mädchen auch selbst ausprobieren können – indem Sie mit einem E-Mail-Server chatten. Anmelden können sich Schülerinnen, die 12 Jahre oder älter sind und sich vorstellen können, später Software-Entwicklerin zu werden. Für die Teilnahme sind keine Vorkenntnisse notwendig. Der Veranstaltung beginnt um 9:30 Uhr. Mehr Infos >> Anfahrt So finden Sie uns: Posteo Lab Methfesselstraße 36 10965 Berlin-Kreuzberg (Gelände der ehem. Schultheiss-Brauerei) Anfahrt BVG: U6/Platz der Luftbrücke Openstreetmap: www.openstreetmap.org/node/4441281573'
