["https://posteo.de/fr/site/faq"]
title = "E-mail vert, sûr, simple et sans pub - posteo.de - Questions fréquentes (FAQ)"
description = "Posteo est un fournisseur de messagerie innovant misant sur la durabilité et la protection de la vie privée. Il fonctionne entièrement sans publicité. Nos boîtes mail, calendriers et carnets d'adresse peuvent être syncrhonisés: nous utilisons un concept de chiffrement global."
full_description = '''Puis-je utiliser Posteo avec mes propres domaines ? Non. Nous sommes un fournisseur de messagerie doté d'un concept unique de protection des données, et celui-ci n'est pas compatible avec l'intégration de domaines personnels. L'un de nos axes principaux est la minimisation des données : nous ne collectons aucune donnée personnelle (noms, adresses, etc.) appartenant à nos clients. Nous répondons toujours par la négative à la demande d'accès aux données personnelles provenant des autorités. Certains domaines doivent cependant être enregistrés sous le nom et l'adresse d'une personne. Si nous vous autorisions à utiliser vos domaines propres chez nous, cela aurait des conséquences sur le concept global de Posteo : nous devrions alors commencer à enregistrer les données à caractère personnel de tous nos clients qui utilisent chez nous leurs propres domaines et les mettre à disposition de la Bundesnetzagentur (autorité allemande de régulation des communications électroniques) pour les demandes automatisées émanant des autorités. Même si l'enregistrement MX seulement faisait référence à nous, nous devrions tout de même enregistrer l'affectation du domaine dans votre boîte mail Posteo en tant que donnée personnelle. Nous aurions ainsi une donnée personnelle vous concernant que nous devrions transmettre, le cas échéant. C'est pour cela que nous avons décidé de ne pas proposer cette fonction afin de pouvoir nous concentrer sur la minimisation des données de façon conséquente. Ai-je besoin d'un accord sur le traitement des données pour le compte du responsable du traitement avec Posteo? Non. En tant que fournisseur de messagerie accessible au public et s'adressant aux particuliers, nous ne sommes pas sous-traitant au sens du Règlement général sur la protection des données (RGPD). Nous avons fait vérifier cela par nos avocats. Cela signifie que, même en cas d'utilisation professionnelle de Posteo, aucun accord sur le traitement des données pour le compte du responsable du traitement ne doit être convenu. L’une des raisons pour cela est la suivante : les services de télécommunication comme Posteo ne sont pas seulement soumis aux lois générales sur la protection des données ; ils doivent aussi se conformer à d’autres obligations légales, qui sont notamment fixées par la loi sur les télécommunications (TKG) et la loi sur la protection des données dans le domaine des télécommunications et des télémédias (TTDSG). Nous devons donc disposer d’un concept de sécurité qui est contrôlé par l’Agence fédérale des réseaux. À ce sujet, l'article 95 du RGPD dit : « Ce règlement n'impose aux personnes naturelles ou juridiques, concernant le traitement lié à la mise à disposition de services de communication électronique accessibles au public dans les réseaux de communication publics au sein de l'UE, aucune obligation supplémentaire s'ils sont soumis à des obligations fixées par la directive 2002/58/EG qui poursuivent le même objectif. » Posteo est soumis aux obligations fixées par la directive sur la protection de la vie privée dans le secteur des communications électroniques (2002/58/EG) - elles sont également conformes aux dispositions des §§ 3-18 de la TTDSG. Avec nous, pas besoin de traitement des données pour le compte du responsable du traitement pour respecter les prescriptions du RGPD - et nous n'en proposons pas. Vous trouverez des informations complémentaires ainsi que des conseils de lecture dans notre déclaration relative à la protection des données. Est-ce que Posteo est concerné par la réintroduction de la conservation des données en Allemagne ? Non, Posteo n'est pas concerné par le conservation des données. Vous ne devez pas vous inquiéter du caractère privé de vos e-mails Posteo. La loi allemande réintroduisant la conservation des données (« Loi introduisant une obligation de conservation et un délai maximal de conservation des données de trafic ») exclut complétement les fournisseurs de messagerie de cette réglementation. Tout le secteur des e-mails est ainsi exclu de l'obligation de conservation. En clair : Posteo ne fait pas partie des entités obligées de respecter cette loi. Posteo continuera par conséquent à ne stocker aucune donnée. Est-il possible de transférer mes données de mon ancien fournisseur de messagerie vers Posteo ? Oui, c'est possible. Comme nous ne souhaitons pas utiliser ou recommander des prestataires extérieurs pour le transfert de vos données de messagerie sensibles, nous avons développé pour cela une solution propre. Grâce au service de migration Posteo, vous pouvez déplacer en toute sécurité jusqu'à trois boîtes mail externes, arborescence de dossiers incluse, vers Posteo. Vous décidez si vous souhaitez déplacer la totalité du contenu de votre ancienne boîte mail ou simplement certains dossiers. Vous pouvez également choisir d'effacer les e-mails chez votre ancien fournisseur après la migration. Le service de migration Posteo est gratuit. Vous conservez le contrôle sur vos données : vos e-mails ne passent à aucun moment par un prestataire externe. Les dossiers sélectionnés sont copiés par Posteo auprès de votre ancien fournisseur de messagerie et transmis directement à votre boîte mail Posteo via une série de connexions sécurisées. De plus, vous pouvez mettre en place à la suite de la migration une « demande de réexpédition » : notre service de collecte récupère toutes les 10 minutes les e-mails entrants auprès de vos anciennes boîtes mail. Est-ce que Posteo propose un service d'hébgergement web ? Non, nous ne proposons pas l'hébergement de pages web et ne pouvons malheureusement conseiller aucun fournisseur satisfaisant en matière de protection des données et de durabilité. Un accès à titre de testest-il possible ? Non. Mais vous avez à tout moment la possibilité de résilier le contrat. Si vous résiliez une boîte mail dans le premier mois suivant l'ouverture, le crédit déjà versé vous sera entièrement remboursé. Est-ce que Posteo propose un service de stockage de données ? Non, nous ne proposons pas de service de stockage de données. Est-ce que Posteo propose d'autres domaines Posteo que posteo.com ? Oui. Les boîtes mail peuvent aussi être créées avec d'autres domaines d'e-mail Posteo que @posteo.com. En plus de @posteo.com, nous proposons @posteo.net, @posteo.us, @posteo.ca, @posteo.uk, @posteo.ie, @posteo.es, @posteo.de, @posteo.at, @posteo.ch, @posteo.nl, @posteo.be und @posteo.lu pour votre adresse e-mail Posteo. Si vous souhaitez changer le domaine de votre adresse e-mail Posteo a posteriori, vous pouvez le faire dans les paramètres, à la rubrique « Alias d'e-mail », au paragraphe « Adresse e-mail Posteo ». Vous trouverez plus d'informations à ce sujet dans notre rubrique d'aide. Pour vos adresses alias (2 adresses e-mails supplémentaires sont incluses à chaque boîte mail), vous pouvez choisir entre de nombreux autres domaines Posteo. Vous trouverez un aperçu de tous les domaines Posteo disponibles dans notre rubrique d'aide. Si une terminaison est manquante, vous pouvez vous adresser à nous à l'adresse support@posteo.de. Que faire si j'ai besoin de plus d'espace de stockage ? Vous pouvez à tout moment adapter vous-même votre espace de stockage dans les paramètres de votre boîte mail. Chaque gigaoctet supplémentaire vous coûtera 0,25 € par mois en plus. Si vous souhaitez par exemple que la taille de votre espace de stockage atteigne 4 Go, cela vous coûtera en tout 1,50 € par mois. À tout moment, vous pouvez aussi réduire votre espace de stockage vous-mêmes si vos besoins ont changé. Que se passe-t-il si je ne recharge pas mon compte à temps ? Vous n'avez rien à craindre : nous n'effacerons ni vos e-mails, ni votre boîte mail si votre crédit est épuisé pendant un court laps de temps. Par principe, nous n'effaçons pas de données tant qu'un compte n'a pas été résilié dans les règles de l'art (par le client ou par Posteo). Si votre crédit tend vers 0, notre système vous envoie régulièrement des e-mails de rappel. Environ 10 semaines après que le crédit d'une boîte mail est épuisé, notre système bloque la fonction d'envoi dans votre boîte mail. Dès que vous aurez rechargé votre crédit, la fonction d'envoi sera réactivée. Où puis-je obtenir un certificat S/MIME pour mon adresse e-mail Posteo ? Les certificats S/MIME sont vendus par différents fournisseurs. Posteo propose également des certificats signés par une autorité de certification officielle (Certum) et affichés comme fiables dans les clients de messagerie. Les certificats peuvent être créés facilement dans les paramètres Posteo. Vous trouverez cette option dans la section "Mes certificats S/MIME". Ils ont une durée de validité d'un an et coûtent 365 centimes. Est-ce que Posteo propose un service d'envoi de fax ou de SMS ? Non. Nous ne pouvons pas vous proposer de fonction d'envoi de fax ou de SMS. Cela entraînerait pour nous des obligations légales supplémentaires : nous devrions commencer à enregistrer les données à caractère personnel de nos clients et ne souhaitons pas le faire afin de protéger vos données. C'est pour cela que nous ne proposerons très probablement pas ce genre de fonctions à l'avenir. Nous nous concentrons en priorité sur le fait d'offrir à nos clients une communication par e-mail sûre et durable qui correspond à des attentes maximales en matière de protection des données et respecte les principes de la minimisation des données. Depuis quand Posteo existe-t-il ? Posteo existe depuis 2009. Proposez-vous un affichage conversation, comme Gmail? Oui, nous proposons un affichage par conversation dans notre messagerie en ligne. Vous avez le choix entre un affichage par conversation ou par liste. Rendez-vous dans notre rubrique d'aide pour en savoir plus sur ce sujet. Pouvez-vous mettre à disposition un compte gratuit pour notre projet/notre association ? Toutes les semaines, nous recevons des demandes de la part de projets, associations ou initiatives nous demandant de leur mettre à disposition gracieusement une boîte mail. Mais nous ne pouvons pas vous mettre à disposition des boîtes mail gratuitement. De nombreuses associations, initiatives et projets à but non lucratif possèdent des boîtes mail et des listes de diffusion chez nous. Ils payent tous pour nos services, bien que l'utilisation d'une adresse Posteo contribue bien entendu à faire connaître Posteo et que nombre de ces acteurs fassent partie de nos groupes cibles. Nous pensons qu'il est important de payer pour les projets durables et de qualité (“If something is valuable, let’s pay for it”) afin de contribuer à l'indépendance des contenus de qualité sur Internet vis-à-vis de la publicité. Notre offre durable nous permet certes de fonctionner, mais n'est pas calculée largement. C'est pour cela que nous n'avons pas de marge pour des réductions ou des offres promotionnelles. Nous proposons un service de messagerie très exigeant en matière de durabilité, de sécurité et de protection des données et fonctionnons à 100 % sans publicité. Les coûts d'un tel service sont tout simplement très élevés et comme nous ne souhaitons avoir recours à aucune publicité, notre service fonctionne exclusivement sur la base de la contribution de nos utilisateurs. Les boîtes mail gratuites engendreraient cependant des coûts en matière d'espace de stockage, d'administration ou de service client. Nous vous remercions de votre compréhension. Pourquoi Posteo n'est-il pas gratuit - vous pourriez utiliser de la publicité pour des entreprises écologiques ? Nous souhaitons travaillons de manière indépendante et vous proposer un produit de qualité sans avoir pour autant recours aux outils de suivi (tracking). La protection de vos données de messagerie ne doit pas être soumise aux intérêts du secteur publicitaire. Un service gratuit reposant sur la bonne volonté des annonceurs ne relève pas, d'après nous, de l'économie durable. Le système de gratuité que la publicité rend possible sur internet est d'après nous sujet à caution, en partie pour des raisons de protection des données et de droit à l'autodétermination en matière d'information. Nous pensons qu'il est important de payer pour des services durables et de qualité (“If something is valuable, let’s pay for it”) afin de contribuer à l'indépendance des contenus de qualité sur Internet vis-à-vis de la publicité. Posteo propose-t-il un service client par téléphone ? Nous avons décidé de proposer un service client gratuit par e-mail à nos clients. Notre équipe vous aide rapidement en cas de problèmes ou de questions. Nous ne proposons pas de service client par téléphone. Puis-je payer par prélèvement automatique chez Posteo ? Non. En effet, lors d'un paiement par prélèvement automatique, nous devrions enregistrer les données de votre compte (IBAN, nom) en relation avec la boîte mail correspondante. De tels ensembles de données sont convoités par les criminels. C'est pourquoi, chez Posteo, nous rendons anonymes toutes les opérations de paiement : par principe, nous ne relions pas les données que nous recevons lors des paiements aux boîtes mail. Nous prévenons ainsi efficacement les vols de données, vous protégeons contre les abus et pouvons toujours vous garantir l'utilisation de notre service de messagerie sans collecte de données personnelles sensibles. Vous pouvez payer facilement par virement, en espèces, par Paypal ou par carte de crédit. Vous pouvez ajouter un maximum de 60 EUR de crédit. En cas de résiliation, tout crédit restant vous sera intégralement remboursé. Vous trouverez plus d'informations sur les modes de paiement chez Posteo sur notre page d'information sur le paiement. Comment Posteo peut-il être anonyme si je paye par virement ou Paypal? Le crédit de votre boîte mail Posteo est rechargé systématiquement de façon anonyme - peu importe si vous payez par Paypal, carte de crédit ou en espèces. Par principe, nous ne relions pas les données que nous recevons quand vous payez aux boîtes mail correspondantes. Pour cela, nous avons développé en 2009 un système propre grâce auquel nous anonymisons toutes les procédures de paiement. Le système de paiement est la pierre angulaire de notre concept de minimisation des données : parce que nous séparons strictement les données de paiement et les boîtes mail de nos clients, nous n'attribuons aucune donnée personnelle à ces boîtes mail - et pouvons pour cela garantir une utilisation fondamentalement anonyme de notre service de messagerie. Rendez-vous sur notre page d'information sur le paiement pour savoir comment fonctionne concrètement l'anonymisation des procédures de paiement. Est-ce que je peux exclure certains expéditeurs du filtrage des spams ou les bloquer activement chez Posteo ? Oui. Vous pouvez créer des filtres dans la messagerie en ligne qui au choix suppriment des messages indésirables ou les classent dans le dossier de votre choix. Il est également possible de gérer une liste d'exceptions. Ce n'est cependant généralement pas nécessaire, car notre filtre anti-spam est capable de faire la di'''
