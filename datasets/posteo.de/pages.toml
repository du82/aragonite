title = "E-Mail grün, sicher, einfach und werbefrei - posteo.de - Sieben WhatsApp-Nutzer in Italien mit Spähsoftware angegriffen"
description = "Posteo ist ein innvovativer E-Mail-Anbieter, der auf Nachhaltigkeit und Datenschutz setzt und komplett Werbefrei ist. Unsere E-Mail-Postfächer, Kalender und Adressbücher sind synchronisierbar - wir setzen auf umfassende Verschlüsselung."
full_description = "Julius Stiebert 06.02.2025 Sieben WhatsApp-Nutzer in Italien mit Spähsoftware angegriffen WhatsApp-Nutzer wurden mit Spähsoftware von Paragon Solutions angegriffen – sieben Fälle soll es in Italien geben. Die dortige Regierung bestreitet eine Beteiligung. Auch in anderen EU-Ländern gibt es Fälle. Einem Bericht zufolge soll Paragon einen Vertrag mit der italienischen Regierung gekündigt haben. (Symbolbild) (Quelle: IMAGO / Silas Stein) Mindestens sieben WhatsApp-Nutzer in Italien sollen mit Spionagesoftware von Paragon Solutions angegriffen worden sein. Das hat die italienische Regierung am Mittwoch mitgeteilt, nachdem bekannt geworden war, dass ein Journalist und ein Aktivist in Italien betroffen sind. Die italienische Regierung bestreitet, verantwortlich zu sein. In einer Pressemitteilung der Regierung heißt es, in Italien seien sieben Personen von den kürzlich bekannt gewordenen Spähsoftware-Angriffen betroffen. Diese Information habe die italienische IT-Sicherheitsbehörde ACN von den Anwälten von WhatsApp erhalten. WhatsApp hatte in der vergangenen Woche öffentlich gemacht, dass 90 Nutzerinnern und Nutzer in zwei Dutzend Ländern mit Spähsoftware von Paragon angegriffen wurden. Es soll sich um sogenannte “Zero-Click-Attacken” gehandelt haben, bei denen eine Infektion mit der Schadsoftware ausgelöst wird, ohne dass die Betroffenen aktiv werden müssen, indem sie beispielsweise einen Link anklicken. Aktivisten und Journalist Die italienische Regierung teilte mit, Angaben zur Identität der Betroffenen habe WhatsApp ihr gegenüber nicht gemacht. Inzwischen sind einige Betroffene aber bekannt: So wurde der Gründer der italienischen NGO Mediterranea Saving Humans, Luca Casarini, von WhatsApp über den Angriff auf sein Smartphone informiert. Seine NGO rettet im Mittelmeer in Seenot geratene Geflüchtete und Casarini kritisiert Italiens Migrationspolitik öffentlich – auch in Hinblick auf die Zusammenarbeit mit Libyen. Menschenrechtler werfen Italien vor, wegen Vereinbarungen mit der Regierung in Tripolis mitverantwortlich für Misshandlungen an Migranten zu sein, die dort in Gefängnissen festgehalten werden. Gegenüber Reuters nannte Casarini den Einsatz der Spähsoftware einen “Angriff auf die Demokratie”. Der italienische Aktivist Luca Casarini (rechts) zählt zu den Opfern der Spähsoftware-Angriffe. (Quelle: IMAGO / NurPhoto) Auch der in Schweden lebende libysche Aktivist Husam El Gomati zählt zu den Betroffenen. Wie der Guardian berichtet, hat auch er Italiens Migrationspakt mit Libyen kritisiert. Gegenüber der Zeitung äußerte El Gomati nun Sorge um seine Quellen, von denen er Dokumente über die mutmaßliche Zusammenarbeit zwischen Milizen in Libyen und dem italienischen Geheimdienst erhalten hatte. Er sagte, als Aktivist gegen Korruption in Libyen sei der Schutz seiner Quellen besonders wichtig. Es gebe Menschen, die ihr Leben riskieren, um Missstände aufzudecken. Er fügte hinzu: “Der Gedanke, dass jemand dich den ganzen Tag belauscht, deine Nachrichten liest und Zugang zu den Bildern deiner Kinder hat, ist erschreckend.” Bereits zuvor war bekannt geworden, dass der italienische Investigativjournalist Francesco Cancellato von WhatsApp über den Angriff auf sein Smartphone informiert wurde. Er ist Chefredakteur der Nachrichtenseite Fanpage, die im vergangenen Jahr rechtsextreme Vorkommnisse bei der Jugendorganisation der Regierungspartei Fratelli d’Italia aufgedeckt hatte. Der Guardian merkte an, alle drei bisher bekannten Spionageopfer hätten gemeinsam, dass sie der rechten Regierung von Ministerpräsidentin Giorgia Meloni kritisch gegenüberstehen. Vertrag mit Italien? Berichten zufolge verkauft der israelische Anbieter Paragon seine Graphite genannte Spähsoftware nur an staatliche Stellen – WhatsApp konnte aber nicht feststellen, wer hinter den Angriffen steckt. Die italienische Regierung bestreitet, verantwortlich zu sein. Offenbar gehörte sie aber bis vor kurzem zu den Kunden von Paragon. Der Guardian berichtet unter Berufung auf eine anonyme Quelle, die dem Unternehmen nahestehen soll, Paragon habe den Vertrag mit der italienischen Regierung aufgrund der aktuellen Fälle am Mittwoch gekündigt. Überprüfen lassen sich diese Angaben nicht. Spähsoftware-Anbieter hüllen sich üblicherweise in Schweigen, was ihre Kunden angeht. Auch gegenüber dem Guardian wollte ein Paragon-Sprecher die Vorgänge weder bestätigen noch dementieren. Das israelische Unternehmen hatte am Dienstag jedoch gegenüber der Nachrichtenseite TechCrunch bestätigt, seine Produkte an die US-Regierung zu verkaufen – sowie an nicht näher genannte Verbündete der USA. Die Paragon-Spähsoftware ist unter dem Namen Graphite bekannt. Sie soll über ähnliche Funktionen verfügen, wie die umstrittene Pegasus-Spionagesoftware der israelischen NSO Group: So können Angreifer den vollständigen Zugriff auf ein Gerät erlangen und beispielsweise Chat-Nachrichten mitlesen. Experten untersuchen Geräte WhatsApp hält es für möglich, dass die angegriffenen Geräte auch tatsächlich kompromittiert und die Nutzer ausgespäht wurden. Die NGO Mediterranea Saving Humans teilte am Mittwoch mit, in der Benachrichtigung habe WhatsApp ihrem Chef Luca Casarini empfohlen, sein Telefon unverzüglich zu wechseln und das Citizen Lab an der Universität Toronto zu kontaktieren, das mehrfach den Missbrauch von Spähsoftware aufgedeckt hat. Aktuell würden die IT-Experten dort sein Smartphone untersuchen. Zunächst hatte WhatsApp auch keine näheren Angaben zu den Ländern gemacht, in denen die Spionageopfer leben. Gegenüber der italienischen Regierung verriet das Unternehmen nun aber, es seien Personen in Belgien, Dänemark, Deutschland, Griechenland, Lettland, Litauen, den Niederlanden, Österreich, Portugal, Schweden, Spanien, in der Tschechischen Republik sowie in Zypern angegriffen worden. Weil diese Informationen von der europäischen WhatsApp-Niederlassung stammen, würden sie sich nur auf EU-Staaten beziehen. Nachdem WhatsApp die Angriffe entdeckt hatte, hatte das Unternehmen Paragon eine Unterlassungserklärung geschickt. Zudem würden weitere Rechtsschritte geprüft. WhatsApp hatte erst kürzlich vor Gericht gegen den Pegasus-Anbieter NSO gewonnen, nachdem im Jahr 2019 rund 1400 WhatsApp-Nutzer mit Pegasus angegriffen worden waren – darunter auch Medienschaffende, Anwälte, Dissidenten, Menschenrechtsaktivisten, Diplomaten und Regierungsbeamte. (js)"
