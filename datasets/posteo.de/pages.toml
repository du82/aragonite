["https://posteo.de/blog/der-girls%E2%80%99day-2024-bei-posteo"]
title = "E-Mail grün, sicher, einfach und werbefrei - posteo.de - Der Girls’Day 2024 bei Posteo"
description = "Posteo ist ein innvovativer E-Mail-Anbieter, der auf Nachhaltigkeit und Datenschutz setzt und komplett Werbefrei ist. Unsere E-Mail-Postfächer, Kalender und Adressbücher sind synchronisierbar - wir setzen auf umfassende Verschlüsselung."
full_description = "Der Girls’Day 2024 bei Posteo Erstellt am 26.April 2024, 15:45 Uhr | Kategorie: Blog Mädchen für das Coden begeistern: Das hatte sich unser Team auch 2024 wieder für den Girls’Day vorgenommen. Für uns war es erneut eine tolle Erfahrung, informatikinteressierte Schülerinnen im Posteo-Lab auf dem Berliner Kreuzberg begrüßen zu dürfen – und ihnen Einblicke in den Beruf der Software-Entwicklerin zu geben. E-Mail-Workshop am Girls’Day 2024 Der Weg in die Informatik Nach einer kurzen Kennenlernrunde berichtete unsere Entwicklerin Monika von ihrem Ausbildungsweg. Sie erklärte den Mädchen, welche Inhalte in einem Informatikstudium zu erwarten sind, wie es danach beruflich weitergehen kann und beantwortete Fragen rund um die Berufswahl und den Berufsalltag. Workshop: So funktionieren E-Mail-Protokolle Im Anschluss gab es dann konkrete Einblicke in die Arbeit als Informatikerin. Unser Team zeigte den Schülerinnen, was Protokolle sind, welche Bedeutung sie für den weltweiten Austausch von Informationen haben – und wie das Protokoll SMTP (Simple Mail Transfer Protocol) für das Übertragen von E-Mails verwendet wird. Anschließend waren die Mädchen am Zug: Mit der Unterstützung von Anne aus der Teamleitung unseres technischen Supports konnten sie über das SMTP-Protokoll mit einem E-Mail-Server sprechen, ihm Befehle übermitteln und auf der Kommandozeile E-Mails zustellen. Studien- und Berufswahl ohne Geschlechterklischees Unserem Girls’Day-Team hat der Tag viel Spaß gemacht. “Die Mädchen waren super und es war schön zu sehen, wie motiviert sie sind”, so Posteo-Entwicklerin Monika. “Für uns war es nicht nur wichtig, ihnen Eindrücke aus der Software-Entwicklung zu geben. Als Frauen in der IT wollten wir auch zeigen, dass sie nicht an veraltete Rollenbilder gebunden sind. Wir hoffen, dass sie genau so viel Spaß hatten, wie wir und noch selbstbewusster hinsichtlich ihrer möglichen Berufswahl geworden sind.” Der Girls’Day ist ein bundesweiter Aktionstag zur Berufsorientierung, an dem Mädchen ab der 5. Klasse Einblick in Berufe nehmen können, die vorwiegend von Männern gewählt werden. Darunter fällt auch die Software-Entwicklung. Im Entwicklungsteam von Posteo ist das Verhältnis zwischen Männern und Frauen ausgewogen. Viele unserer Funktionen wurden von Frauen programmiert, beispielsweise der Posteo-Umzugsservice, unsere mobile Benutzeroberfläche, der Anhangsbrowser mit Foto-Stream – oder unser Dark Mode. Aber das ist nicht überall so: Im Studiengang Informatik und in der Technologie-Branche sind Frauen nach wie vor stark unterrepräsentiert."
year_published = 2025
