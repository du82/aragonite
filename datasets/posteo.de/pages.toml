["https://posteo.de/en/news/india-internet-shutdowns-violate-fundamental-rights"]
title = "Email green, secure, simple and ad-free - posteo.de - India: Internet shutdowns violate fundamental rights"
description = "Posteo is an innovative email provider that is concerned with sustainability and privacy and is completely ad-free. Our email accounts, calendars and address books can be synchronised - we use comprehensive encryption."
full_description = "Julius Stiebert 20.02.2025 India: Internet shutdowns violate fundamental rights Authorities in India imposed more than 150 internet shutdowns in the previous two years. This limits millions of people’s ability to exercise their fundamental rights, a new report argues. For years, NGOs monitoring the practice have observed that India imposes more internet shutdowns than any other country in the world. (Source: IMAGO / ZUMA Press Wire) In 2024, 60 internet shutdowns were imposed in India, according to a new report from the India-based Software Freedom Law Center (SFLC). That number did drop somewhat compared to the previous year, but the SFLC nevertheless warns that curtailing internet access violates fundamental rights – and criticizes authorities for acting with little transparency. For years, observers have noted that India imposes the most internet shutdowns of any country worldwide. The SFLC is among the groups documenting these shutdowns. In a new report, “Let The Net Work 2.0,” the organization looks at state-imposed restrictions on internet access in the years 2023 and 2024. In these two years, the organization counted 156 internet shutdowns – 60 in 2024 and 96 in 2023. In 2023 there were shutdowns in a total of 13 states; in 2024 16 states made use of the controversial measure. Only complete shutdowns were included in the tally, not instances where only individual websites were blocked. According to the report, roughly 96 percent of internet users in India access the web through mobile devices – this being the case, the mobile internet is “the primary target for suspensions.” Shutdown orders were frequently justified on public safety and national security grounds. In other cases, states cited the need to stop the spread of misinformation. The authorities imposed shutdowns both as a preventive measure in anticipation of “potential disturbances” and as a reactive measure in response to events like protests. Indian authorities also resorted to the measure to prevent cheating during exams and amidst expected tensions surrounding sporting events, the SFLC reports. Both in 2023 and 2024, most internet shutdowns were imposed as preventive measures. Violating fundamental rights The SFLC stresses that limits on internet access always have profound consequences for people in the regions affected. People’s daily lives are impacted, including their ability to access medical care. Shutdowns violate fundamental rights, including freedom of expression and the right to information. But the impact can even extend to the right to life and personal liberty, as defined in India’s constitution, for instance when emergency medical care can no longer be provided as a result of an internet shutdown. Patients who rely on telemedicine must also contend with “life-threatening delays.” Curtailed internet access can have negative consequences for public safety as well, as “people are unable to report crimes, receive disaster alerts, or access navigation services.” Poor people are often hit harder than those who are well-off and have access to fixed-line internet connections. Students, “especially in rural areas,” are cut off from online learning when the internet is shut down, limiting their ability to exercise their right to education. Two years ago Human Rights Watch (HRW) and the India-based Internet Freedom Foundation published a report demonstrating the consequences the shutdowns had particularly for poorer segments of the population in India. The report cited instances of people being unable to receive food rations and wages. Digitized daily life In India, many aspects of daily life have been digitized – from payments to access to healthcare and social services. As a result, internet shutdowns impact people’s lives in multiple respects. For companies and freelancers, the shutdowns can cause financial losses. The state of Manipur, with a population of 2.7 million, provides several examples of the impact such measures can have. The state government imposed long shutdowns in both 2023 and 2024. The causes were protests and, in some cases, violent unrest. One student in Manipur told the SFLC that because the mobile internet was shut off, he wasn’t able to receive financial assistance from his parents and as a result couldn’t buy any study materials. Another student said he had difficulty finding work. A journalist in Manipur stated that the shutdowns made reporting difficult. As the SFLC argues in its report, this situation “not only results in the suppression of freedom of [the] press,” it also prevents the public from accessing important information. This was also evident in the city of Jainoor, where the internet was shut off after an outbreak of violence. “Without internet access,” the SPLC writes, “an opaque barrier was created between the people of Jainoor and the rest of the Indian citizenry.” Internet shutdowns are also increasingly used as a tool to prevent cheating on exams in India. The SFLC points out that the entire population of a given region suffers under the restrictions – a case filed by the SFLC challenging the legality of this measure is currently pending before India’s Supreme Court. Lack of transparency Many internet shutdowns in India are accompanied by a lack of transparency, according to the report. The country’s Supreme Court stated in a 2020 ruling that curtailing access to the internet was a “drastic measure” that could be considered by the state only if “necessary” and “unavoidable.” The court ruled that “the State must assess the existence of an alternate less intrusive remedy.” The judges also ruled that internet shutdown orders must always be made public, and that shutdowns could not be of unlimited duration. Nevertheless, the SFLC reports that the authorities frequently fail to publish their orders – as was the case in Jainoor. This lack of transparency persists despite the fact that the legal framework governing internet shutdowns in India was revised last year and now makes the publication of suspension orders mandatory. The orders must also include “detailed justifications.” The SFLC calls the new rules a “step forward,” but voices some criticism, writing that “the definition of ‘public order’ remains broad and open to interpretation.” The report also notes of the current legal framework: “The absence of a structured oversight mechanism increases the risk of misuse, with shutdowns potentially being employed for purposes beyond legitimate security concerns. The persistence of legal challenges before the Supreme Court highlights the ongoing demand for judicial scrutiny.” The law also lacks a proportionality requirement, according to the SFLC. The Supreme Court had highlighted the importance of proportionality in its 2020 decision. The organization calls for the creation of a legal framework that “prioritizes transparency, accountability, and the protection of fundamental rights.” Experts at the UN have criticized internet shutdowns in the past, including in a 2022 report. Such measures, the report argued, have “dramatic real-life effects,” impacting the lives and human rights of millions of people. The report recommended that, as a fundamental principle, states should refrain from imposing internet shutdowns. Should states nevertheless resort to these means, the measures must be “clearly grounded in unambiguous, publicly available law.” The public must also be informed in advance, and the measure must be “subject to prior authorization by a court or another independent adjudicatory body.” (js)"
