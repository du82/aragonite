["https://posteo.de/fr/resiliation"]
title = "E-mail vert, sûr, simple et sans pub - posteo.de - Formulaire de résiliation"
description = "Posteo est un fournisseur de messagerie innovant misant sur la durabilité et la protection de la vie privée. Il fonctionne entièrement sans publicité. Nos boîtes mail, calendriers et carnets d'adresse peuvent être syncrhonisés: nous utilisons un concept de chiffrement global."
full_description = "Sans saisir le mot de passe correspondant, vous ne pouvez pas vous autoriser comme titulaire de la boîte mail. Pour des raisons de sécurité, Posteo n'enregistre pas de données personnelles. De telles données ne peuvent donc pas être utilisées pour vérifier l'autorisation de résiliation. Aucune des options de résiliation ne nécessite de justification, même en cas de résiliation extraordinaire associée à un effet immédiat. Veuillez sauvegarder toutes les données (e-mails, adresses, rendez-vous) dont vous avez encore besoin jusqu'au . Les données demeurant dans notre système seront entièrement effacées de nos serveurs à la date indiquée. Votre boîte mail sera entièrement supprimée 14 jours après la date de résiliation souhaitée, () à savoir le . Jusqu'à cette date, vous pouvez continuer à vous connecter et utiliser votre boîte mail comme d'habitude. Cela ne vous coûte rien. La raison pour laquelle il vous faut nous communiquer vos coordonnées de paiement : nous n'associons pas les données de paiement aux boîtes mail. Même si vous avez payé récemment, nous ne savons pas quelle opération de paiement correspond à votre boîte mail. Nous avons anonymisés toutes les opérations de paiement. Avis de confidentialité : les données que vous indiquez dans ce formulaire de résiliation (nom et coordonnées bancaires ou adresse PayPal) seront supprimées de notre système lorsque la boîte mail sera supprimée. Pour des raisons de droit commercial et fiscal, les opérations de paiement restent enregistrées dans notre comptabilité, mais sans lien avec une boîte mail. Il y a déjà eu une résiliation effective. Vous pouvez résilier à nouveau et les dernières données que vous avez sélectionnées s'appliqueront. Avec cette résiliation, vous recevrez un e-mail de confirmation vous informant que vous avez résilié pour le et que toutes les données restantes chez nous seront effacées le . Le crédit restant sera remboursé après que nous ayons reçu la résiliation si vous en avez décidé ainsi plus haut."
year_published = 2025
clearnet = "https://posteo.de/fr/resiliation"
