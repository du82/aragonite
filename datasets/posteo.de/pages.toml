title = "Email green, secure, simple and ad-free - posteo.de - European Court of Human Rights condemns Italy for illegal landfills"
description = "Posteo is an innovative email provider that is concerned with sustainability and privacy and is completely ad-free. Our email accounts, calendars and address books can be synchronised - we use comprehensive encryption."
full_description = "Julius Stiebert 20.02.2025 European Court of Human Rights condemns Italy for illegal landfills The mafia is disposing of illegal waste in the region of Campania. Therefore, the European Court of Human Rights has now condemned Italy. According to the court, the Italian government has not done enough despite having been aware of the illegal waste disposal since 1988. (Source: IMAGO / Antonio Balasco) The Italian government has not done enough against illegal landfills in the region of Campania – and has violated the European Convention on Human Rights. This was decided by the European Court of Human Rights (ECHR). “Terra dei Fuochi” – the land of fires. This phrase is used to describe an area consisting of 90 parishes with approximately 2.9 million residents in which there are many illegal landfills. Groups of organized crime there have buried and burned waste for decades – some of which also includes toxic hazardous waste. This has dramatic consequences for its residents: ground water is polluted and an increased incidence of cancer has been detected. Residents of the region accuse the Italian authorities of not doing enough against these illegal landfills – and were therefore brought before the ECHR. Right to Life The judges of the court have now vindicated them. The court determined that the Italian authorities had already known about the problem since 1988 and nevertheless took too little action to protect the lives of the plaintiffs. In doing so, the government violated the right to life from article 2 of the European Convention on Human Rights . The court declared that there was a “sufficiently serious, genuine and ascertainable” risk to life, which could be qualified as “imminent”. However, the government could not prove that there was a coordinated and comprehensive reaction of the authorities for the situation. The authorities only made sluggish progress in their evaluation of the effects of environmental pollution. It is still not possible to have an overview of where land still needs to be decontaminated. The European Court of Human Rights, with its headquarters in Strasbourg, France, is an institution of the Council of Europe and not an institution of the European Union. The court ensures compliance with the European Convention on Human Rights. The court’s rulings are legally binding for the contracting states. The government had stated that numerous measures were taken, such as the implementation of improved cancer screenings. The Court of Justice determined that most of these measures were first taken after 2013. In consideration of this delayed action, the authorities did not act with necessary care. The government could also only name seven cases in which people were charged with environmental crimes that were connected with the situation in the region. Therefore, the ECHR was not convinced that the government took the required measures under criminal law to combat the illegal waste disposal. Secrecy instead of communication Furthermore, according to the court, there were deficits in communication between the authorities. Because the general population should have been comprehensively informed about the health risks and the measures taken. This, however, did not occur. In fact, at times some of the information was even subject to state secrecy. Italy must now develop a comprehensive strategy to eradicate the problems in the region. Additionally, an independent monitoring system must be set up and a public information platform must be created. The court has given Italy two years time to do so. During this time, further applications pending before the ECHR in the case of around 4,700 people will be suspended. Only after the end of the two-year period does the court want to decide about any potential non-material compensation for damages. Waste disposal worth billions The well-known Italian environmental organization Legambiente welcomed the ruling – and called for its immediate implementation. In order to do so, waste management in the region would also need to be reorganized. The NGO stated that they had already published a report in 2003 that coined the term “ecomafia.” Since then, there have been several new governments at a national and regional level, without finding a solution for the waste problem in the region. According to EMCR, there have been seven parliamentary commissions of inquiry in Italy that have focused on the illegal waste disposal. The EMCR states that waste was disposed of in illegal landfills in the provinces of Caserta and Naples. In part, waste was buried in fields that were later used for agriculture. Waste was also mixed with other materials to be used as building material or compost, for example. Waste was also burned – in Marcianise and Castel Volturno entire “mountains of car tyres” went up in smoke. According to a parliamentary report, Campania was treated as “Italy’s waste bin.” Another report described it as an environmental catastrophe comparable only to the spread of the plague in the 17th century. The reports state that mafia organizations in Italy earn billions with waste disposal – also in other parts of the country. Criminal organizations undercut standard market prices for waste disposal to obtain contracts. However, the waste – some of which also includes dangerous industrial waste – is not disposed of properly. The mafia has even sunken ships containing toxic hazardous waste . (js)"
