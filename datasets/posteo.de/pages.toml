["https://posteo.de/news/mehr-l%C3%A4nder-haben-2024-internetsperren-verh%C3%A4ngt"]
title = "E-Mail grün, sicher, einfach und werbefrei - posteo.de - Mehr Länder haben 2024 Internetsperren verhängt"
description = "Posteo ist ein innvovativer E-Mail-Anbieter, der auf Nachhaltigkeit und Datenschutz setzt und komplett Werbefrei ist. Unsere E-Mail-Postfächer, Kalender und Adressbücher sind synchronisierbar - wir setzen auf umfassende Verschlüsselung."
full_description = "Julius Stiebert 25.02.2025 Mehr Länder haben 2024 Internetsperren verhängt Weltweit gab es nach Zählung von Access Now im vergangenen Jahr mindestens 296 Netzsperren. Viele standen im Zusammenhang mit Konflikten und Kriegen. Myanmar verhängte die meisten Netzsperren. Sieben Staaten griffen 2024 erstmals zu Internetblockaden. (Archivbild) (Quelle: IMAGO / ZUMA Press Wire) Im Jahr 2024 haben Regierungen in 54 Ländern mindestens 296 Internetsperren verhängt. Das geht aus dem am Montag veröffentlichten Jahresbericht zu Netzsperren der Organisation Access Now hervor. Seit Beginn der Aufzeichnungen im Jahr 2016 gab es demnach noch nie so viele Fälle. Dabei seien Netzsperren niemals gerechtfertigt, kritisieren Access Now und ihre Partnerorganisationen. Mit 296 Blockaden stieg die Gesamtzahl gegenüber dem Vorjahr (damals 283) an. Außerdem ist die Zahl der Länder, die von der umstrittenen Maßnahme Gebrauch gemacht haben, um 15 gestiegen. Millionen Menschen seien davon beeinträchtigt gewesen. 47 der im vergangenen Jahr begonnen Blockaden hätten auch 2025 weiter Bestand. Die meisten Netzsperren wurden in Myanmar beobachtet: Dort wurde das Internet 85-mal abgeschaltet – im Jahr 2023 hatte Access Now noch 37 Fälle dokumentiert. Verantwortlich für die vielen Blockaden war in erster Linie die seit dem Putsch 2021 herrschende Militärjunta. Mit 84 Blockaden folgt Indien dicht hinter dem südostasiatischen Staat. Es ist das erste Mal seit dem Jahr 2018, dass Indien die Liste nicht anführt. Es handle sich aber weiterhin um eine “inakzeptabel hohe Anzahl” für die “größte Demokratie der Welt”. Angaben des indischen Software Freedom Law Center zufolge hatten die Behörden die Kommunikation im Jahr 2024 meist präventiv eingeschränkt, beispielsweise wenn sie Proteste erwarteten. In Pakistan wurden mit 21 Netzsperren so viele dokumentiert, wie nie zuvor in dem Land. Russland setzte 19-mal Blockaden ein, wovon sieben die Ukraine betrafen. Kriege und Konflikte Wie bereits im Vorjahr waren Konflikte und Kriege der häufigste Hintergrund von Internetsperren: 103-mal schränkten Konfliktparteien in elf Ländern die Kommunikationswege ein. Darunter waren Äthiopien, Myanmar, Israel, Russland und der Sudan. Auch dies sei ein Negativrekord, berichtet Access Now. Um das Internet während aktiver Konflikte zu blockieren, kämen vielfältige Taktiken zum Einsatz. So würden beispielsweise Strom- und Telekommunikationsinfrastruktur zerstört, Leitungen durchtrennt, Störsender eingesetzt oder auch die Büros von Internetprovidern besetzt. Protestbewegungen und Wahlen Im Zusammenhang mit Protesten dokumentierte die Organisation ebenfalls einen neuen Höchststand: Im Jahr 2024 haben Regierungen in 24 Ländern 74-mal Netzsperren eingesetzt, etwa in Bangladesch, Indien, Kenia, Ruanda und im Senegal. Damit sollten beispielsweise Demonstrationen gegen die Regierungspolitik oder die wirtschaftliche Situation eingedämmt und unterdrückt werden. Häufig lassen Behörden Verbindungen auch blockieren, wenn es während Konflikten oder Protesten zu Gewalt kommt. Access Now kritisiert, das schüre zusätzlich Angst und Unsicherheit in der Bevölkerung – und schneide Menschen von lebensrettenden Informationen ab. 72 Netzsperren im Jahr 2024 bringt die Organisation mit Menschenrechtsverletzungen oder Kriegsverbrechen in Verbindung. Im Jahr 2024 waren Bürgerinnen und Bürger in mindestens 64 Staaten zu Wahlen aufgerufen. In diesem Zusammenhang wurden zwölf Netzsperren in acht Ländern verhängt – die höchste Zahl seit dem Jahr 2019. Darunter waren Aserbaidschan, Indien und Uganda. Prüfungen als Grund für Internetsperren Einige Regierungen haben auch zu Netzsperren gegriffen, um Betrug während Schul- oder Universitätsprüfungen zu verhindern – unter anderem in Algerien, Jordanien, Kenia und im Irak. Auch diese Zahl war seit Beginn der Aufzeichnungen durch Access Now noch nie so hoch. Der Iran und Sudan haben 2024 hingegen keine Netzsperren während der Prüfungsphasen verhängt, nachdem sie in der Vergangenheit zu diesem Mittel gegriffen hatten. Access Now merkt aber an, dass im Sudan die Mehrheit der Schülerinnen und Schüler aufgrund des dort herrschenden Bürgerkriegs gar nicht an Prüfungen teilnehmen konnte. Und der Iran ließ Kommunikationswege 2024 abermals im Zusammenhang mit Demonstrationen blockieren. Access Now zählt auch Plattformblockaden zu den Netzsperren. Dem Bericht zufolge haben auch diese sprunghaft zugenommen: Im vergangenen Jahr wurden 71 Sperren in 35 Ländern registriert – 2023 waren es noch 53 Blockaden in 25 Ländern. Auch der bisherige Höchststand aus dem Jahr 2019 wurde übertroffen. Access Now kritisiert, Behörden würden versuchen, den Informationsfluss auf beliebten Plattformen zu kontrollieren. Es bestehe außerdem der Irrglaube, dass die Blockade einzelner Dienste weniger schädlich sei als Komplettabschaltungen. Am häufigsten wurde X (ehemals Twitter) blockiert (24-mal in 14 Ländern), gefolgt von Facebook (22-mal in 12 Ländern). Behörden ließen aber auch YouTube, Instagram sowie Chat-Dienste wie WhatsApp und Signal sperren. Auch die Dating-App Grindr wurde in 13 Staaten blockiert. Sieben Staaten blockieren erstmals Im Jahr 2024 haben sieben Staaten erstmals das Internet abgeschaltet oder Dienste blockiert. Dazu zählt Malaysia mit einer Grindr-Blockade, die bei einigen Providern im Land auch weiterhin aktiv sein soll. Auch Thailand wurde erstmals auffällig. Dabei handelte es sich um eine grenzüberschreitende Maßnahme, weil die Behörden Internet- und Telefonverbindungen in ein an Thailand grenzendes Gebiet in Myanmar kappen ließen. Damit sollte gegen aus Myanmar gesteuerten Online-Betrug vorgegangen werden. Die Organisation kritisiert jedoch, auch die Bevölkerung habe darunter gelitten. Zach Rosson von Access Now kommentierte: “Die Daten lügen nicht: 2024 gab es eine Rekordzahl an Internetsperren. Da die Verantwortlichen immer raffiniertere Taktiken anwenden, um abweichende Meinungen zum Schweigen zu bringen, müssen wir als Zivilgesellschaft und Menschenrechtsverteidiger reagieren. Mehr denn je brauchen wir eine kollektive und konzertierte Anstrengung, um Internetsperren weltweit zu bekämpfen – die Grundrechte hängen davon ab.” Access Now betont, Konfliktparteien müssten sicherstellen, dass die Zivilbevölkerung Zugang zu Telekommunikationsnetzen und Plattformen hat. Die internationale Gemeinschaft müsse außerdem Täter zur Verantwortung ziehen, die unter dem Deckmantel von Internetsperren Menschenrechtsverletzungen begehen. Alle Regierungen der Welt müssten zudem die Rechte auf Meinungsfreiheit und den Zugang zu Informationen schützen. Die NGO kritisierte aber auch Tech-Firmen: Viele der großen Plattformen seien von früheren Verpflichtungen abgerückt, gegen Hassrede und Falschinformationen vorzugehen. Access Now fordert, sie müssten die Menschenrechte schützen – Regierungen müssten zudem die Ursachen von Desinformationen bekämpfen, anstatt Plattformen zu sperren. (js)"
year_published = 2025
