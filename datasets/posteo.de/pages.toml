["https://posteo.de/en/news/italy-journalist-groups-take-legal-action-in-response-to-spyware-attack"]
title = "Email green, secure, simple and ad-free - posteo.de - Italy: Journalist groups take legal action in response to spyware attack"
description = "Posteo is an innovative email provider that is concerned with sustainability and privacy and is completely ad-free. Our email accounts, calendars and address books can be synchronised - we use comprehensive encryption."
full_description = "Julius Stiebert 24.02.2025 Italy: Journalist groups take legal action in response to spyware attack Two organizations representing Italian journalists have submitted a legal complaint after revelations of a spyware attack against at least one member of the press. The groups look to the courts to find answers while the government remains silent. Cybersecurity experts are certain that a state actor was responsible for the attacks. (Source: IMAGO / Silas Stein) The Italian national journalist union FNSI and the professional organization OdG have filed a criminal complaint with prosecutors in Rome in response to a spyware attack targeting at least one journalist in the country. A total of seven people in Italy were reportedly hacked using the Graphite spyware marketed by Paragon Solutions – FSNI and OdG suspect that more than one journalist was targeted. As FNSI announced on Wednesday, the charges were filed “against unknown individuals.” It is now up to prosecutors to investigate the case and find those responsible. Earlier this month, WhatsApp revealed that it had detected spyware attacks against 90 users – including members of the press and activists. The users were hacked using Graphite spyware, a product sold by Paragon Solutions. Because the method of infiltration was a so-called “zero-click attack,” the individuals affected had no way of knowing they were targeted. It is unclear whether the users’ smartphones were in fact compromised and whether the attackers were able to spy on their targets – but WhatsApp considers it possible. Soon after WhatsApp’s disclosure the Italian investigative journalist Francesco Cancellato came forward to say that he was among those informed by WhatsApp of an attack on their smartphone. Cancellato is editor-in-chief of the news site Fanpage, which last year published an investigation showing members of the youth organization of the ruling party, Fratelli d’Italia, using fascist chants and slogans. Government denies responsibility The Italian government, citing information it had received from WhatsApp, has said that seven people were targeted. The government denies responsibility. The founder of the Italian NGO Mediterranea Saving Humans, Luca Casarini, was also among those targeted. His organization rescues refugees who become stranded while attempting to cross the Mediterranean Sea. As the Guardian reports, no answers have come from parliament. On Tuesday the president of parliament invoked a rule that allows the government to refuse to answer questions from the opposition related to the matter. In justifying this step, the government claimed that “all unclassified information has already been shared” – and that any other details were subject to state secrecy rules. The journalist groups criticize the government’s failure to clarify matters. If no answers were forthcoming from parliament, the groups said, then the courts would have to take over the investigation. Alessandra Costante, secretary general of FNSI, the journalist union, said: “We believe that [the surveillance of Francesco] Cancellato was not an isolated case.” It is necessary, she said, to determine which other members of the press were spied on, and by whom. “We hope that the courts will be able to bring the clarity that politics does not want to provide.” State actor responsible Paragon’s Graphite spyware reportedly possesses capabilities similar to those of the controversial Pegasus spyware marketed by the Israel-based NSO Group: Attackers can take complete control of a device and, for example, read a user’s chat histories. Graphite, like Pegasus, is only sold to government clients. It is as yet unclear who is behind these latest attacks detected by WhatsApp. Mediterranea Saving Humans on Wednesday published information from the Citizen Lab at the University of Toronto, which is currently investigating founder Casarini’s smartphone. Citizen Lab’s cybersecurity experts were able to determine that attempts to compromise Casarini’s phone began as early as February 2024. The investigation is ongoing, and could potentially reveal who is responsible for the attack. Citizen Lab’s investigators are already certain of one thing, however: the presence of Graphite “leaves no doubt that only government agencies are involved.” Two weeks ago the Guardian reported, citing an anonymous source, that Paragon had terminated its contract with Italy in response to the recently revealed incidents. The Italian government at first denied the report. Minister Luca Ciriani, speaking to parliament, confirmed that the government has had a contract with Paragon for years – but insisted that the law was “rigorously respected.” He denied that the spyware was used to illegally spy on journalists and, as the AP reports, “threatened legal action against any claims to the contrary.” According to the Ansa news agency, the head of Italy’s foreign intelligence agency AISE has since admitted to a parliamentary committee that his agency uses the spyware – but likewise denied using it to spy on journalists or activists. The matter is now being investigated internally. Until the investigation is concluded, use of Graphite has been suspended. The Israeli newspaper Haaretz reported earlier this month that an Italian law enforcement agency also has a contract with Paragon. The Israeli company, which has reportedly been sold to a US firm, counts US agencies and other governments in Europe among its clients. The Italian government, citing information it received from WhatsApp, has reported that people in 13 other EU countries have also been targeted with the spyware. Other activists targeted Another of the individuals targeted is the Libyan activist Husam El Gomati, who lives in Sweden. The Guardian noted that, like the journalist Cancellato and the activist Casarini, El Gomati’s work has led him to be critical of the government of prime minister Giorgia Meloni. The activist David Yambio, who lives in Italy, has also reported being informed of a spyware attack against him. In Yambio’s case, however, the warning came from Apple – whether Graphite was used is unclear. Yambio has criticized the Italian government for its migration agreement with Libya – and for its decision to release Osama Najim, a Libyan police chief wanted by the International Criminal Court for suspected war crimes. Prosecutors in Italy are investigating Meloni in response to the decision. Yambio himself was allegedly abused in a prison led by Najim and is working to gather evidence of other cases of abuse. Human rights organizations accuse Italy of complicity in abuses against migrants detained in Libyan prisons, given Rome’s agreements with the government in Tripoli. (js)"
