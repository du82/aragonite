["https://postfix.org/FORWARD_SECRECY_README.html"]
title = "TLS Forward Secrecy in Postfix"
full_description = '''Forward secrecy does not protect against active attacks such as forged DNS replies or forged TLS server certificates. If such attacks are a concern, then the SMTP client will need to authenticate the remote SMTP server in a sufficiently-secure manner. For example, by the fingerprint of a (CA or leaf) public key or certificate. Conventional PKI relies on many trusted parties and is easily subverted by a state-funded adversary. Postfix supports forward secrecy of TLS network communication since version 2.2. This support was adopted from Lutz Jänicke's "Postfix TLS patch" for earlier Postfix versions. This document will focus on TLS Forward Secrecy in the Postfix SMTP client and server. See TLS_README for a general description of Postfix TLS support. The term "Forward Secrecy" (or sometimes "Perfect Forward Secrecy") is used to describe security protocols in which the confidentiality of past traffic is not compromised when long-term keys used by either or both sides are later disclosed. Forward secrecy is accomplished by negotiating session keys using per-session cryptographically-strong random numbers that are not saved, and signing the exchange with long-term authentication keys. Later disclosure of the long-term keys allows impersonation of the key holder from that point on, but not recovery of prior traffic, since with forward secrecy, the discarded random key agreement inputs are not available to the attacker. Forward secrecy is only "perfect" when brute-force attacks on the key agreement algorithm are impractical even for the best-funded adversary and the random-number generators used by both parties are sufficiently strong. Otherwise, forward secrecy leaves the attacker with the challenge of cracking the key-agreement protocol, which is likely quite computationally intensive, but may be feasible for sessions of sufficiently high value. Thus forward secrecy places cost constraints on the efficacy of bulk surveillance, recovering all past traffic is generally infeasible, and even recovery of individual sessions may be infeasible given a sufficiently-strong key agreement method.'''
year_published = 2025
