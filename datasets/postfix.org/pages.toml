["https://postfix.org/postconf.5.html"]
title = "Postfix Configuration Parameters"
full_description = '''The Postfix main.cf configuration file specifies a very small subset of all the parameters that control the operation of the Postfix mail system. Parameters not explicitly specified are left at their default values. Each logical line is in the form "parameter = value". Whitespace around the "=" is ignored, as is whitespace at the end of a logical line. Empty lines and whitespace-only lines are ignored, as are lines whose first non-whitespace character is a `#'. A logical line starts with non-whitespace text. A line that starts with whitespace continues a logical line. The expressions "$name" and "${name}" are recursively replaced with the value of the named parameter. The parameter name must contain only characters from the set [a-zA-Z0-9_]. An undefined parameter value is replaced with the empty value. The expressions "${name?value}" and "${name?{value}}" are replaced with "value" when "$name" is non-empty. The parameter name must contain only characters from the set [a-zA-Z0-9_]. These forms are supported with Postfix versions ≥ 2.2 and ≥ 3.0, respectively. The expressions "${name:value}" and "${name:{value}}" are replaced with "value" when "$name" is empty. The parameter name must contain only characters from the set [a-zA-Z0-9_]. These forms are supported with Postfix versions ≥ 2.2 and ≥ 3.0, respectively. The expression "${name?{value1}:{value2}}" is replaced with "value1" when "$name" is non-empty, and with "value2" when "$name" is empty. The "{}" is required for "value1", optional for "value2". The parameter name must contain only characters from the set [a-zA-Z0-9_]. This form is supported with Postfix versions ≥ 3.0. The first item inside "${...}" may be a relational expression of the form: "{value3} == {value4}". Besides the "==" (equality) operator Postfix supports "!=" (inequality), "<", "≤", "≥", and ">". The comparison is numerical when both operands are all digits, otherwise the comparison is lexicographical. These forms are supported with Postfix versions ≥ 3.0.'''
