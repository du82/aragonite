["https://postfix.org/announcements/postfix-2.11.4.html"]
title = "Postfix legacy releases 2.11.4, 2.10.6, 2.9.12, and 2.8.20"
full_description = '[An on-line version of this announcement will be available at http://www.postfix.org/announcements/postfix-2.11.4.html] Postfix legacy releases 2.11.4, 2.10.6, 2.9.12, and 2.8.20 are available. They contain fixes and workarounds that are also part of Postfix 3.0. This is the final update for Postfix 2.8. Fix a missing " in \%s\", in postconf(1) fatal error messages, which violated the C language spec. Reported by Iain Hibbert. Stop excessive recursion in the cleanup server while recovering from a virtual alias expansion loop. Problem found at Two Sigma. Stop exponential memory allocation with virtual alias expansion loops. This came to light after fixing the previous problem.'
