["https://postfix.org/announcements/postfix-3.0.1.html"]
title = """
Postfix stable release 3.0.1 and legacy releases 2.11.5, 2.10.7,
and 2.9.13"""
full_description = '''[An on-line version of this announcement will be available at http://www.postfix.org/announcements/postfix-3.0.1.html] The DNS "resource record to text" converter, used for xxx_dns_reply_filter pattern matching, appended a '.' to TXT record resource values. The postscreen(8) manpage specified an incorrect Postfix version number for the postscreen_dnsbl_timeout parameter. The postfix-install script expanded macros in parameter values when trying to detect parameter overrides, causing unnecessary main.cf updates during "postfix start" etc. Some low-level cleanup of UTF-8 string handling with no visible change in behavior (besides better performance). The sender_dependent_relayhost_maps feature ignored the relayhost setting in the case of a DUNNO lookup result. It would use the recipient domain instead.'''
