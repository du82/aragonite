["https://postfix.org/LINUX_README.html"]
title = "Postfix and Linux"
full_description = '''By default Linux /etc/hosts lookups do not support multiple IP addresses per hostname. This causes warnings from the Postfix SMTP server that "hostname XXX does not resolve to address YYY", and is especially a problem with hosts that have both IPv4 and IPv6 addresses. To fix this, turn on support for multiple IP addresses: If you can't compile Postfix because the file "db.h" isn't found, then you MUST install the Berkeley DB development package (name: db???-devel-???) that matches your system library. You can find out what is installed with the rpm command. For example: This means that you need to install db4-devel-4.3.29-2 (on some systems, specify "rpm -qf /lib/libdb.so" instead). DO NOT download some Berkeley DB version from the network. Every Postfix program will dump core when it is built with a different Berkeley DB version than the version that is used by the system library routines. See the DB_README file for further information. On RedHat Linux 7.1 and later procmail no longer has permission to write to the mail spool directory. Workaround: When running Postfix inside a container, you can use stdout logging as described in MAILLOG_README. Alternatives: run syslogd inside the container, or mount the host's syslog socket inside the container. LINUX syslogd uses synchronous writes by default. Because of this, syslogd can actually use more system resources than Postfix. To avoid such badness, disable synchronous mail logfile writes by editing /etc/syslog.conf and by prepending a - to the logfile name: LINUX systemd intercepts all logging and enforces its own rate limits before handing off requests to a backend such as rsyslogd or syslog-ng. On a busy mail server this can result in information loss. As a workaround, you can use Postfix's built-in logging as described in MAILLOG_README.'''
year_published = 2025
clearnet = "https://postfix.org/LINUX_README.html"
