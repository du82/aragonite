["https://postfix.org/CONNECTION_CACHE_README.html"]
title = "Postfix Connection Cache"
full_description = "This document describes the Postfix connection cache implementation, which is available with Postfix version 2.2 and later. With SMTP connection caching, Postfix can deliver multiple messages over the same SMTP connection. By default, Postfix 2.2 reuses a plaintext SMTP connection automatically when a destination has high volume of mail in the active queue. SMTP Connection caching is a performance feature. Whether or not it actually improves performance depends on the conditions: SMTP Connection caching can greatly improve performance when delivering mail to a destination with multiple mail servers, because it can help Postfix to skip over a non-responding server. Otherwise, the benefits of SMTP connection caching are minor: it eliminates the latency of the TCP handshake (SYN, SYN+ACK, ACK), plus the latency of the SMTP initial handshake (220 greeting, EHLO command, EHLO response). With TLS-encrypted connections, this can save an additional two roundtrips that would otherwise be needed to send STARTTLS and to resume a TLS session. SMTP Connection caching gives no gains with respect to SMTP session tear-down. The Postfix smtp(8) client normally does not wait for the server's reply to the QUIT command, and it never waits for the TCP final handshake to complete. SMTP Connection caching introduces some overhead: the client needs to send an RSET command to find out if a connection is still usable, before it can send the next MAIL FROM command. This introduces one additional round-trip delay. For other potential issues with SMTP connection caching, see the discussion of limitations at the end of this document. The Postfix connection cache is shared among Postfix mail delivering processes. This maximizes the opportunity to reuse an open connection. Some MTAs such as Sendmail have a non-shared connection cache. Here, a connection can be reused only by the mail delivering process that creates the connection. To get the same performance improvement as with a shared connection cache, non-shared connections need to be kept open for a longer time."
year_published = 2025
clearnet = "https://postfix.org/CONNECTION_CACHE_README.html"
