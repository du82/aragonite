["https://postfix.org/sendmail.200004/interviewvenema.html"]
title = "sendmail.net:"
full_description = '''When you name a program SATAN, you can expect your intentions to be misread. Wietse Venema discovered this firsthand when he and colleague Dan Farmer released the Security Administrator Tool for Analyzing Networks, reporting software designed to let administrators test their own networks for vulnerabilities, but immediately misconstrued as a toy for budding crackers. There's little chance that mistake will be repeated. Venema's name has become synonymous with security in the minds of sysadmins worldwide, thanks to his work on SATAN, TCP Wrappers, and a host of other tools to keep the scriptkiddies at bay. This work hasn't gone unnoticed: at the LISA '99 conference last November, Venema received the SAGE Outstanding Achievement Award, an honor previously bestowed upon the likes of Paul Vixie and Larry Wall. The other thing Venema's famous for, of course, is Postfix, the mail transfer agent he wrote after coming to IBM's Thomas J. Watson Research Center from the Netherlands. Known briefly by the name "VMailer," Postfix aims to be "fast, easy to configure, and hopefully secure." We spoke with Venema by phone about Postfix, security, and the superiority of asynchronous communication - i.e., email. Let's start with a question about Postfix. What are your plans for incorporating encryption? I'm thinking specifically of Transport Layer Security (TLS) and SMTP authentication. Hopefully those will be in the next official release. I've received several donated pieces of software from people who use my Postfix program, and who have added things like authentication and encryption. I'm in the process of merging that donated code into my software. There's no longer an issue in doing this from the United States, because as of January 15, it's legal to export open source code with encryption functions. You only have to send a notice to the Bureau of Export Administration. [laughs] Well, it expires several times, doesn't it? I think the US and Canadian expiration dates are different.'''
year_published = 2025
