["https://postfix.org/14blue.html"]
title = "Sharing Software, IBM to Release Mail Program Blueprint"
full_description = '''dding momentum to the open-source movement for the free sharing of software, IBM plans Monday to make available the original programmer's instructions for a new mail program that can be used to store and forward e-mail messages with a high level of security. The program, Secure Mailer, serves as an electronic post office for server computers connected to the Internet. It was developed by Wietse Venema, an IBM researcher and computer security specialist. Executives said they were using the free, open-source model of software distribution to insure that the program would be widely available on the dozens of kinds of computers that are used to route Internet mail traffic. Related Articles Netscape to Release New Browser Engine to Developers(Dec. 7, 1998) Sentiment Growing for Freeware(April 13, 1998) The open source model of software development, pioneered by a loosely affiliated group of expert programmers, is built on universal sharing of the programmer's original written instructions to the computer. In traditional, proprietary development models, those instructions are hidden because they have been compiled into the binary 1s and 0s that computers understand. The open-source model has been gaining popularity in the last year based on the success of the free Linux operating system, and in recent months several major technology corporations have endorsed part or all of the idea. "This is IBM's Christmas present to the Internet," said Abner Germanow, a computer security analyst at the International Data Corp., a market research firm. "For these are core pieces of software, and we're going beyond trying to make money off of them, to the idea that by freely sharing them it will make the world a better place." Like many big companies, the International Business Machines Corp. seems to be cautiously feeling its way toward an open-source strategy. Secure Mailer follows by just a week the company's release of the source code for a compiler, the tool used by software developers to transform instructions written in a programming language into the computer's binary machine code.'''
year_published = 1998
