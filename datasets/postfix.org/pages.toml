["https://postfix.org/ADDRESS_CLASS_README.html"]
title = "Postfix Address Classes"
full_description = 'Postfix version 2.0 introduces the concept of address classes. This is a way of grouping recipient addresses by their delivery method. The idea comes from discussions with Victor Duchovni. Although address classes introduced a few incompatibilities they also made it possible to improve the handling of hosted domains and of unknown recipients. Why should you care about address classes? This is how Postfix decides what mail to accept, and how to deliver it. In other words, address classes are very important for the operation of Postfix. Benefit: the Postfix SMTP server rejects an invalid recipient with "User unknown in <name of address class> table", and avoids sending a MAILER-DAEMON message with backscatter spam. Initially the list of address classes is hard coded, but this is meant to become extensible. The summary below describes the main purpose of each class, and what the relevant configuration parameters are. Purpose: final delivery for traditional UNIX system accounts and traditional Sendmail-style aliases. This is typically used for the canonical domains of the machine (for example, $myhostname, $mydomain). For a discussion of the difference between canonical domains, hosted domains and other domains, see the VIRTUAL_README file. Domain names are listed with the mydestination parameter. This domain class also includes mail for user@[ipaddress] when the IP address is listed with the inet_interfaces or proxy_interfaces parameters. Valid recipient addresses for those domains are listed with the local_recipient_maps parameter, as described in LOCAL_RECIPIENT_README. The Postfix SMTP server rejects invalid recipients with "User unknown in local recipient table". If the local_recipient_maps parameter value is empty, then the Postfix SMTP server accepts any address in the local domain class. The mail delivery transport is specified with the local_transport parameter. The default value is local:$myhostname for delivery with the local(8) delivery agent. Purpose: hosted domains where each recipient address is aliased to an address in a different domain class, for example, a local UNIX system account or a remote address. A virtual alias example is given in the VIRTUAL_README file.'
year_published = 2025
clearnet = "https://postfix.org/ADDRESS_CLASS_README.html"
tags = ["address", "classes", "compared", "for?", "implement?", "improvements", "incompatibilities", "introduction", "local:$myhostname", "postfix"]
