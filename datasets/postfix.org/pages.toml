["https://postfix.org/MONGODB_README.html"]
title = "Postfix MongoDB Howto"
full_description = '''Postfix can use MongoDB as a source for any of its lookups: aliases(5), virtual(5), canonical(5), etc. This allows you to keep information for your mail service in a replicated noSQL database with fine-grained access controls. By not storing it locally on the mail server, the administrators can maintain it from anywhere, and the users can control whatever bits of it you think appropriate. You can have multiple mail servers using the same information, without the hassle and delay of having to copy it to each. These instructions assume that you build Postfix from source code as described in the INSTALL document. Some modification may be required if you build Postfix from a vendor-specific source package. The Postfix MongoDB client requires the mongo-c-driver library. This can be built from source code from the mongod-c project, or this can be installed as a binary package from your OS distribution, typically named mongo-c-driver, mongo-c-driver-devel or libmongoc-dev. Installing the mongo-c-driver library may also install libbson as a dependency. To build Postfix with mongodb map support, add to the CCARGS environment variable the options -DHAS_MONGODB and -I for the directory containing the mongodb headers, and specify the AUXLIBS_MONGODB with the libmongoc and libbson libraries, for example: If your MongoDB shared library is in a directory that the RUN-TIME linker does not know about, add a "-Wl,-R,/path/to/directory" option after "-lbson-1.0". Then, just run 'make'. The file /etc/postfix/mongo-aliases.cf can specify a number of parameters. For a complete description, see the mongodb_table(5) manual page. Here's a basic example for using MongoDB to look up virtual(5) aliases. Assume that in main.cf, you have: Upon receiving mail for "admin@example.com" that isn't found in the /etc/postfix/virtual_aliases database, Postfix will search the MongoDB server/cluster listening at port 27017 on some_server. It will connect using the provided credentials, and search for any entries whose username is, or alias field has "admin@example.com". It will return the username attribute of those found, and build a list of their email addresses.'''
year_published = 2025
clearnet = "https://postfix.org/MONGODB_README.html"
