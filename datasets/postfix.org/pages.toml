["http://www.postfix.org/SMTPD_PROXY_README.html"]
title = "Postfix Before-Queue Content Filter"
full_description = 'The before-queue content filtering feature described in this document limits the amount of mail that a site can handle. See the "Pros and Cons" section below for details. As of version 2.1, the Postfix SMTP server can forward all incoming mail to a content filtering proxy server that inspects all mail BEFORE it is stored in the Postfix mail queue. It is roughly equivalent in capabilities to the approach described in MILTER_README, except that the latter uses a dedicated protocol instead of SMTP. The before-queue content filter is not to be confused with the approach described in the FILTER_README document, where mail is filtered AFTER it is stored in the Postfix mail queue. As shown in the diagram above, the before-queue filter sits between two Postfix SMTP server processes. The before-filter Postfix SMTP server accepts connections from the Internet and does the usual relay access control, SASL authentication, TLS negotiation, RBL lookups, rejecting non-existent sender or recipient addresses, etc. Re-inject the mail back into Postfix via SMTP, perhaps after changing its content and/or destination. Reject the mail by sending a suitable SMTP status code back to Postfix. Postfix passes the status back to the remote SMTP client. This way, Postfix does not have to send a bounce message. The after-filter Postfix SMTP server receives mail from the content filter. From then on Postfix processes the mail as usual. The before-queue content filter described here works just like the after-queue content filter described in the FILTER_README document. In many cases you can use the same software, within the limitations as discussed in the "Pros and Cons" section below. Pro: Postfix can reject mail before the incoming SMTP mail transfer completes, so that Postfix does not have to send rejected mail back to the sender (which is usually forged anyway). Mail that is not accepted remains the responsibility of the remote SMTP client. Con: The smtpd(8) service before the smtpd_proxy_filter cannot support features that involve header or body access, or that involve queue file manipulation (i.e., anything that involves processing by the cleanup(8) service).'
year_published = 2025
clearnet = "http://www.postfix.org/SMTPD_PROXY_README.html"
