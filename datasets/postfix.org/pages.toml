["http://www.postfix.org/QSHAPE_README.html"]
title = "Postfix Bottleneck Analysis"
full_description = 'This document is an introduction to Postfix queue congestion analysis. It explains how the qshape(1) program can help to track down the reason for queue congestion. qshape(1) is bundled with Postfix 2.1 and later source code, under the "auxiliary" directory. This document describes qshape(1) as bundled with Postfix 2.4. When mail is draining slowly or the queue is unexpectedly large, run qshape(1) as the super-user (root) to help zero in on the problem. The qshape(1) program displays a tabular view of the Postfix queue contents. On the horizontal axis, it displays the queue age with fine granularity for recent messages and (geometrically) less fine granularity for older messages. The vertical axis displays the destination (or with the "-s" switch the sender) domain. Domains with the most messages are listed first. For example, in the output below we see the top 10 lines of the (mostly forged) sender domain distribution for captured spam in the "hold" queue: The "T" column shows the total (in this case sender) count for each domain. The columns with numbers above them, show counts for messages aged fewer than that many minutes, but not younger than the age limit for the previous column. The row labeled "TOTAL" shows the total count for all domains. In this example, there are 14 messages allegedly from yahoo.com, 1 between 10 and 20 minutes old, 1 between 320 and 640 minutes old and 12 older than 1280 minutes (1440 minutes in a day). When the output is a terminal intermediate results showing the top 20 domains (-n option) are displayed after every 1000 messages (-N option) and the final output also shows only the top 20 domains. This makes qshape useful even when the "deferred" queue is very large and it may otherwise take prohibitively long to read the entire "deferred" queue. By default, qshape shows statistics for the union of both the "incoming" and "active" queues which are the most relevant queues to look at when analyzing performance. this will show the age distribution of the "deferred" queue or the union of the "incoming", "active" and "deferred" queues.'
year_published = 2025
clearnet = "http://www.postfix.org/QSHAPE_README.html"
