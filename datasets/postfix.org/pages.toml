["https://postfix.org/PGSQL_README.html"]
title = "Postfix PostgreSQL Howto"
full_description = '''The Postfix pgsql map type allows you to hook up Postfix to a PostgreSQL database. This implementation allows for multiple pgsql databases: you can use one for a virtual(5) table, one for an access(5) table, and one for an aliases(5) table if you want. You can specify multiple servers for the same database, so that Postfix can switch to a good database server if one goes bad. Busy mail servers using pgsql maps will generate lots of concurrent pgsql clients, so the pgsql server(s) should be run with this fact in mind. You can reduce the number of concurrent pgsql clients by using the Postfix proxymap(8) service. These instructions assume that you build Postfix from source code as described in the INSTALL document. Some modification may be required if you build Postfix from a vendor-specific source package. Note: to use pgsql with Debian GNU/Linux's Postfix, all you need to do is to install the postfix-pgsql package and you're done. There is no need to recompile Postfix. In order to build Postfix with pgsql map support, you specify -DHAS_PGSQL, the directory with the PostgreSQL header files, and the location of the libpq library file. If your PostgreSQL shared library is in a directory that the RUN-TIME linker does not know about, add a "-Wl,-R,/path/to/directory" option after "-lpq". Postfix versions before 3.0 use AUXLIBS instead of AUXLIBS_PGSQL. With Postfix 3.0 and later, the old AUXLIBS variable still supports building a statically-loaded PostgreSQL database client, but only the new AUXLIBS_PGSQL variable supports building a dynamically-loaded or statically-loaded PostgreSQL database client. Failure to use the AUXLIBS_PGSQL variable will defeat the purpose of dynamic database client loading. Every Postfix executable file will have PGSQL database library dependencies. And that was exactly what dynamic database client loading was meant to avoid. The file /etc/postfix/pgsql-aliases.cf specifies lots of information telling postfix how to reference the pgsql database. For a complete description, see the pgsql_table(5) manual page.'''
year_published = 2025
clearnet = "https://postfix.org/PGSQL_README.html"
