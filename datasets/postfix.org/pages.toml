["https://postfix.org/securityportal.200011/closet20001122.html"]
title = "SecurityPortal - Postfix - The Sendmail replacement part II"
full_description = '''November 22, 2000 - I've written about Postfix before, over a year ago, and since then it has gotten even better. I must confess that I've been using the 31 Dec. 1999 release on my servers until last week, which, while extremely stable, lacks a lot of the features now available in current snapshots of Postfix. Postfix is now more useful than ever as a gateway mail server. I'll cover some of the more interesting available features and how you can use them to secure and protect your email infrastructure. Most of these features are actually quite old, but are probably news to most users. This article was written using Postfix snapshot 20001030. Since then several things (like virtual) have changed, making some points in this article incorrect. This is probably the best way of restricting incoming email to valid email accounts only. Let's assume you have a decent-sized corporate LAN based on Windows and are using Exchange server for email. Exchange can only validate incoming email based on the domain, not the user, and since it will attempt to deliver the email for 48 hours, your system can get quickly clogged up - with no easy way to clean it out. Place your Exchange server behind a firewall so no one on the Internet can connect to it directly, and then place a Postfix server on the public side. Add this to your main.cf: You could also use the generic access file, but splitting it up allows for extremely selective access controls. You can then have the mail delivered locally or forwarded to another (internal) system. If an email is sent to an email address not listed specifically, and the domain is covered by a reject rule, the sender will receive an email with an error like, You can also specify a custom error such as "useraccount does not exist." However, a spammer could theoretically use this to build an address list by simply testing all the email addresses - those that generate an error message do not exist, and those that do not generate one do exist. This feature can be used as intended, for having virtual users (i.e., if you handle multiple domains and more than one wants a webmaster@ email address) as well as for protecting internal servers.'''
