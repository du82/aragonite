["https://postfix.org/announcements/postfix-2.11.1.html"]
title = "Postfix stable release 2.11.1"
full_description = '[An on-line version of this announcement will be available at http://www.postfix.org/announcements/postfix-2.11.1.html] Postfix stable release 2.11.1 is available. This release provides two bugfixes that affect Postfix 2.11 and later, and some code/documentation cleanup. With connection caching enabled (the default), recipients could be given to the wrong mail server. The root cause was an incorrect predicate. Due to this, the Postfix SMTP client could save and restore plaintext connections that should not be cached, under nonsensical lookup keys that did not distinguish by destination. Problem reported by Sahil Tandon. Prepend "-I. -I../../include" to the compiler command-line options, to avoid name clashes with non-Postfix header files. The documentation for Postfix > 2.8 TLS activity logging was incorrect. Loglevel 0 produces no logging. Instead, information is logged only with loglevel 1 or higher.'
