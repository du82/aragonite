["https://postfix.org/CDB_README.html"]
title = "Postfix CDB Howto"
full_description = 'CDB (Constant DataBase) is an indexed file format designed by Daniel Bernstein. CDB is optimized exclusively for read access and guarantees that each record will be read in at most two disk accesses. This is achieved by forgoing support for incremental updates: no single-record inserts or deletes are supported. CDB databases can be modified only by rebuilding them completely from scratch, hence the "constant" qualifier in the name. Postfix CDB databases are specified as "cdb:name", where name specifies the CDB file name without the ".cdb" suffix (another suffix, ".tmp", is used temporarily while a CDB file is under construction). CDB databases are maintained with the postmap(1) or postalias(1) command. The DATABASE_README document has general information about Postfix databases. You can use "cdb:" tables wherever you can use read-only "hash", "btree" or "lmdb" tables with the following limitations: CDB databases cannot be larger than 4GB on LP64 and ILP32 systems, because the CDB library API uses unsigned integers for file offsets. The "postmap -i" (incremental record insertion) and "postmap -d" (incremental record deletion) command-line options are not available. For the same reason the "cdb:" map type cannot be used to for persistent caches, such as the address verification cache for the verify(8) service, the TLS session cache for the tlsmgr(8) service, or the dynamic allowlist for postscreen(8). The "sequence" operation ("postmap -s" or "postalias -s") is available only wen Postfix is built with tinycdb by Michael Tokarev, not with the original cdb library by Daniel Bernstein. CDB support is available with Postfix 2.2 and later releases. The remainder of this document describes how to build Postfix with CDB support. These instructions assume that you build Postfix from source code as described in the INSTALL document. Some modification may be required if you build Postfix from a vendor-specific source package. tinycdb (version 0.5 and later) from Michael Tokarev, available from https://www.corpit.ru/mjt/tinycdb.html.'
year_published = 2025
clearnet = "https://postfix.org/CDB_README.html"
