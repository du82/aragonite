["http://www.postfix.org/announcements/postfix-2.11.3.html"]
title = """
Postfix stable release 2.11.3 and legacy releases 2.10.5,
2.9.11, and 2.8.19"""
full_description = "[An on-line version of this announcement will be available at http://www.postfix.org/announcements/postfix-2.11.3.html] THIS IS NOT A DUPLICATE OF PATCHES THAT WERE RELEASED ON OCTOBER 13, 2014. THE HEADER PREPEND PATCH IN THAT SET IS REVERTED AND REPLACED WITH A COMPLETE SOLUTION. Fix for configurations that prepend message headers with Postfix access maps, policy servers or Milter applications. Postfix now hides its own Received: header from Milters and exposes prepended headers to Milters, regardless of the mechanism used to prepend a header. This fix reverts a partial solution that was released on October 13, 2014, and replaces it with a complete solution."
