["http://www.postfix.org/announcements/postfix-2.7.5.html"]
title = "Postfix legacy releases 2.7.5, 2.6.11 and 2.5.14"
full_description = '[An on-line version of this announcement will be available at http://www.postfix.org/announcements/postfix-2.7.5.html] Postfix legacy releases 2.7.5, 2.6.11 and 2.5.14 are available. These contain fixes and workarounds that were already included with Postfix stable release 2.8.4. Performance: a high load of DSN success notification requests could slow down the queue manager. Solution: make the trace client asynchronous, just like the bounce and defer clients. The local(8) delivery agent ignored table lookup errors in mailbox_command_maps, mailbox_transport_maps, fallback_transport_maps and (while bouncing mail to alias) alias owner lookup. Workaround: dbl.spamhaus.org rejects lookups with "No IP queries" even if the name has an alphanumerical prefix. We play safe, and skip both RHSBL and RHSWL queries for names ending in a numerical suffix. Linux kernel version 3 support. Linus Torvalds has reset the counters for reasons not related to changes in code. The "sendmail -t" command reported "protocol error" instead of "file too large", "no space left on device" etc.'
