["http://www.postfix.org/announcements/postfix-2.7.1.html"]
title = "Postfix stable release 2.7.1"
full_description = 'An on-line version of this announcement is available at http://www.postfix.org/announcements/postfix-2.7.1.html Postfix stable release 2.7.1 fixes one defect in the XFORWARD implementation (for SMTP-based content filters), improves robustness, and has updates for changes in system or library interfaces. Bugfix (introduced Postfix 2.6) in the XFORWARD implementation, which sends remote SMTP client attributes through SMTP-based content filters. The Postfix SMTP client did not skip "unknown" SMTP client attributes, causing a syntax error when sending an "unknown" client PORT attribute. Robustness: skip LDAP queries with non-ASCII search strings, instead of failing with a database lookup error. Safety: Postfix processes now log a warning when a matchlist has a #comment at the end of a line (for example mynetworks or relay_domains). The source code is available from ftp://ftp.porcupine.org/mirrors/postfix-release/index.html and from the mirrors listed at http://www.postfix.org/download.html.'
