["https://postfix.org/sunworld-199903.html"]
title = "Postfix and Mailman deliver enhanced e-mail security and performance"
description = "Postfix and Mailman deliver enhanced e-mail security and performance"
full_description = '''hile e-mail is the most mature and most widely diffused Internet application, it hasn't stopped growing. The last year alone has seen several exciting developments and announcements, even in the oldest and least "sexy" domains: mail transfer agents and mailing list managers. Keep in mind the fundamental architecture of e-mail processing: At your desktop, you compose a message. You use a mail user agent (MUA) as the user interface to pass your message, along with such other information as the address for which it's intended, to an e-mail server. A mail transfer agent (MTA) on the server takes responsibility for figuring out how best to deliver your message (Is it local -- should it go through my LAN? Is it external? What server on the other end will receive it?). Generally, it communicates with another MTA on the server used by your intended recipient. Once the message has been received by that second MTA, it's available for your recipient's MUA to access it. The MTA market Sendmail dominates the MTA market, as it has for the last 20 years. About two-thirds of all e-mail servers rely on this open source product. Sendmail is far more reliable, flexible, and portable than most of the commercial products that attempt to compete with it, and the recent launch of the for-profit Sendmail Inc. seems to have only enhanced the vigor of this venerable no-cost creation. Sendmail isn't perfect, though. It's bulky, difficult, and has a history of security problems. More precisely, it's in just the shape you'd expect of a product originally built for a much different computing environment, and it's been patched and rewritten during several computing generations. Still, the Sendmail development team has achieved quite a feat in bringing it forward from the far more relaxed security traditions of two decades ago. Wietse Venema has an alternative, though. Venema, a security expert on the IBM Research staff, started fresh, and has produced Postfix, a drop-in replacement for Sendmail which promises to deliver e-mail more quickly, conveniently, and safely.'''
author = "Cameron Laird and Kathryn Soraiz"
year_published = 1999
year_updated = 1999
clearnet = "https://postfix.org/sunworld-199903.html"
