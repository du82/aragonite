["https://postfix.org/press.html"]
title = "Postfix in the Press"
full_description = '''John Markoff: "Sharing Software, IBM to Release Mail Program Blueprint". New York Times, December 1998. http://www.nytimes.com/library/tech/98/12/biztech/articles/14blue.html (backup copy) This is the New York Times article that put Open Source on the radar of IBM CEO Lou Gerstner. He called around, found that IBM had no open source strategy, and tasked people to come up with one. And the rest is history. Elinor Abreu: "Behind the Big Blue Wall". The Industry Standard, January 22-29, 2001, page 62. http://www.thestandard.com/article/display/0,1151,21395-0,00.html (backup copy) Andrew Leonard: "How Big Blue fell for Linux". Salon Technology, September 2000. http://salon.com/tech/fsp/2000/09/12/chapter_7_part_one/index.html (backup copy) This is the first article that recognizes Postfix (Secure Mailer) as the project that accelerated IBM's Open Source strategy. Unfortunately, the text contains factual errors. In particular, Postfix development started after I came to IBM, not before. P.G. Capek, S.P. Frank, S. Gerdt, D. Shields: "A history of IBM's open-source involvement and strategy", IBM Systems Journal, Vol 44, No 2, 2005. http://www.research.ibm.com/journal/sj/442/capek.pdf (backup copy) A report from inside IBM. Quote: "In December of 1998, an effort was first made to understand the broad strategic implications for IBM of open-source software.". The article makes no direct reference to the Secure Mailer project, though. Duane Dunston: "Catching up with Wietse Venema, creator of Postfix and TCP Wrapper". Linuxsecurity.com, July 2004. http://www.linuxsecurity.com/content/view/117302/49/ (backup copy ) Ludovic Marcotte, "HEC Montréal: Deployment of a Large-Scale Mail In stallation". Linux Journal, May 2004. http://www.linuxjournal.com/article.php?sid=7323 ( backup copy ), and a follow-up article with statistics of blocked mail: http://www.linuxjournal.com/article.php?sid=7524 (backup copy ) Cameron Laird and Kathryn Soraiz: "Postfix and Mailman deliver enhanced e-mail security and performance". SunWorld, March 1999. http://www.sunworld.com/swol-03-1999/swol-03-mailtools.html (backup copy)'''
