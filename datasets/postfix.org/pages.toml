["https://postfix.org/MAILLOG_README.html"]
title = "Postfix logging to file or stdout"
full_description = '''Postfix supports its own logging system as an alternative to syslog (which remains the default). This is available with Postfix version 3.4 or later. Logging to file solves a usability problem for MacOS, and eliminates multiple problems for systemd-based systems. Add the following line to master.cf if not already present (note: there must be no whitespace at the start of the line): Note: the service type "unix-dgram" was introduced with Postfix 3.4. Remove the above line before backing out to an older Postfix version. Configure Postfix to write logging, to, for example, /var/log/postfix.log. See also the "Logfile rotation" section below for logfile management. In the example below, specifying maillog_file_permissions is optional (Postfix 3.9 and later). The default value is 0600, i.e., only the super-user can access the file; the value 0644 also adds 'group' and 'other' read access. By default, the logfile name must start with "/var" or "/dev/stdout" (the list of allowed prefixes is configured with the maillog_file_prefixes parameter). This safety mechanism limits the damage from a single configuration mistake. Add the following line to master.cf if not already present (note: there must be no whitespace at the start of the line): Note: the service type "unix-dgram" was introduced with Postfix 3.4. Remove the above line before backing out to an older Postfix version. The command "postfix logrotate" may be run by hand or by a cronjob. It logs all errors, and reports errors to stderr if run from a terminal. This command implements the following steps: Rename the current logfile by appending a suffix that contains the date and time. This suffix is configured with the maillog_file_rotate_suffix parameter (default: %Y%m%d-%H%M%S). After a brief pause, compress the old logfile. The compression program is configured with the maillog_file_compressor parameter (default: gzip). The next time it logs an event, postlogd(8) will create a new logfile, with permissions specified with the maillog_file_permissions parameter (default: 0600).'''
year_published = 2025
