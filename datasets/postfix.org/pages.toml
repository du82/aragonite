["http://www.postfix.org/announcements/postfix-2.8.1.html"]
title = "Postfix stable release 2.8.1"
full_description = '[An on-line version of this announcement will be available at http://www.postfix.org/announcements/postfix-2.8.1.html] Postfix stable release 2.8.1 is available. This release fixes one "signal 11" bug with SMTP server debug logging, and cleans up some code and documentation. The Postfix SMTP and QMQP servers no longer look up IPv6 address information while looking up the FCRDNS (forward-confirmed reverse DNS) hostname for an IPv4 remote client (and vice versa). The postscreen(8) daemon no longer logs a "connection reset by peer" warning when a remote SMTP client hangs up prematurely. Removed spurious configuration parameters from "postconf" output, by deleting the #ifdef MIGRATION_WARNING transitional code from postscreen(8).'
