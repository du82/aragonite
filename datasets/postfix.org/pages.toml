["https://postfix.org/TUNING_README.html"]
title = "Postfix Performance Tuning"
full_description = 'The hints and tips in this document help you improve the performance of Postfix systems that already work. If your Postfix system is unable to receive or deliver mail, then you need to solve those problems first, using the DEBUG_README document as guidance. For tuning external content filter performance, first read the respective information in the FILTER_README and SMTPD_PROXY_README documents. Then make sure to avoid latency in the content filter code. As much as possible avoid performing queries against external data sources with a high or highly variable delay. Your content filter will run with a small concurrency to avoid CPU/memory starvation, and if any latency creeps in, content filter throughput will suffer. High volume environments should avoid RBL lookups, complex database queries and so on. The following tools can be used to measure mail system performance under artificial loads. They are normally not installed with Postfix. Read and understand the maildrop queue, incoming queue, and active queue discussions in the QSHAPE_README document. Run a local name server to reduce slow-down due to DNS lookups. If you run multiple Postfix systems, point each local name server to a shared forwarding server to reduce the number of lookups across the upstream network link. Eliminate unnecessary LDAP lookups, by specifying a domain filter. This eliminates lookups for addresses in remote domains, and eliminates lookups of partial addresses. See ldap_table(5) for details. Look for obvious signs of trouble as described in the DEBUG_README document, and eliminate those problems first. Turn off chroot operation as described in the DEBUG_README document and see if the problem goes away. If Postfix logs the SMTP client as "unknown" then you have a name service problem: the name server is bad, or the resolv.conf file contains bad information, or some packet filter is blocking the DNS requests or replies. If the number of smtpd(8) processes has reached the process limit as specified in master.cf, new SMTP clients must wait until a process becomes available. See the STRESS_README and POSTSCREEN_README documents for measures that help to prevent SMTP server overload.'
year_published = 2025
clearnet = "https://postfix.org/TUNING_README.html"
