["https://postfix.org/salon.200009/index.html"]
title = "Salon.com Technology | How Big Blue fell for Linux"
full_description = '''Hot Topics Napster Andrew Leonard Censorship Linux Scott Rosenberg Java Technology Log Dottie Downturn View From the Top J.R.R. Tolkien How Big Blue fell for Linux When open-source developers and IBM took gambles on each other, free software showed it can flourish in the heartland of corporate computing. Sept. 12, 2000 | The kitchen is the receptionist at Collab.net, a software start-up in the South of Market neighborhood of San Francisco. No one is present to greet an inquisitive visitor walking through the open door on the fourth floor of a nondescript building -- just stacked cases of Snapple fruit juice and giant bags of pretzels; a refrigerator and a sink; a coffee machine and a water dispenser. The ambience screams of youthful coder necessities. On top of the refrigerator, huge boxes of Trix and Cap'n Crunch line up like crates of ammunition. Next to the sink sits a large jar of Twizzlers. From the large, open room stretching beyond the kitchen, a seductive slither of spooky trance music pulses -- inviting, and yet at the same time a little intimidating. People who work in this kind of environment are almost too cool. A few concessions are made to the sensitivities of the less hip -- the potential investors or clients from the old world of computing who might drop by, looking to dump a million bucks here or there. Along one wall stands a free-standing rack packed with hundreds of issues of business/high tech magazines -- The Industry Standard, Business 2.0, Red Herring, Fortune. The magazines may not make good marketing material right now. Collab.net, the brainchild of open-source star Brian Behlendorf,* aims to make a business out of, he says, "distilling the principles of open source." But at least half of the covers of these new-economy bibles are screaming dire, boldface warnings about the current dot-com meltdown, including Wall Street's sharp turn away from Linux-related stocks in the spring and summer. It's a good thing the office tunes are soothing, because jangled nerves are suddenly everywhere in that strange land where free software and dot-com start-ups mix. In the summer of 1999, Red Hat's IPO, occurring right in the middle of a packed LinuxWorld convention, sent attendees into a dither of delight. But in mid-August, no less an authority than the New York Times takes advantage of another LinuxWorld convention to declaim about how Wall Street is souring on Linux.'''
