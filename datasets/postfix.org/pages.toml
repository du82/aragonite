["https://postfix.org/STANDARD_CONFIGURATION_README.html"]
title = "Postfix Standard Configuration Examples"
full_description = '''This document presents a number of typical Postfix configurations. This document should be reviewed after you have followed the basic configuration steps as described in the BASIC_CONFIGURATION_README document. In particular, do not proceed here if you don't already have Postfix working for local mail submission and for local mail delivery. The first part of this document presents standard configurations that each solve one specific problem. The second part of this document presents additional configurations for hosts in specific environments. Postfix should work out of the box without change on a stand-alone machine that has direct Internet access. At least, that is how Postfix installs when you download the Postfix source code via http://www.postfix.org/. You can use the command "postconf -n" to find out what settings are overruled by your main.cf. Besides a few pathname settings, few parameters should be set on a stand-alone box, beyond what is covered in the BASIC_CONFIGURATION_README document: See also the section "Postfix on hosts without a real Internet hostname" if this is applicable to your configuration. A null client is a machine that can only send mail. It receives no mail from the network, and it does not deliver any mail locally. A null client typically uses POP, IMAP or NFS for mailbox access. In this example we assume that the Internet domain name is "example.com" and that the machine is named "hostname.example.com". As usual, the examples show only parameters that are not left at their default settings. Line 2: Set myhostname to hostname.example.com, in case the machine name isn't set to a fully-qualified domain name (use the command "postconf -d myhostname" to find out what the machine name is). Line 2: The myhostname value also provides the default value for the mydomain parameter (here, "mydomain = example.com"). Line 3: Send mail as "user@example.com" (instead of "user@hostname.example.com"), so that nothing ever has a reason to send mail to "user@hostname.example.com".'''
year_published = 2025
clearnet = "https://postfix.org/STANDARD_CONFIGURATION_README.html"
