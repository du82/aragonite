["https://postfix.org/COMPATIBILITY_README.html"]
title = "Postfix Backwards-Compatibility Safety Net"
full_description = 'Postfix 3.0 introduces a safety net that runs Postfix programs with backwards-compatible default settings after an upgrade. The safety net will log a warning whenever a "new" default setting could have an negative effect on your mail flow. With backwards compatibility turned on, Postfix logs a message whenever a backwards-compatible default setting may be required for continuity of service. Based on this logging the system administrator can decide if any backwards-compatible settings need to be made permanent in main.cf or master.cf, before turning off the backwards-compatibility safety net as described at the end of this document. If such a message is logged in the context of a legitimate request, the system administrator should make the backwards-compatible setting permanent in main.cf or master.cf, as detailed in the sections that follow. When no more backwards-compatible settings need to be made permanent, the system administrator should turn off the backwards-compatibility safety net as described at the end of this document. The append_dot_mydomain default value has changed from "yes" to "no". This could result in unexpected non-delivery of email after Postfix is updated from an older version. The backwards-compatibility safety net is designed to prevent such surprises. As long as the append_dot_mydomain parameter is left at its implicit default value, and the compatibility_level setting is less than 1, Postfix may log one of the following messages: If Postfix logs the above message, add "localhost" to mydestination (or virtual_alias_domains, virtual_mailbox_domains, or relay_domains) and execute the command "postfix reload". If Postfix logs the above message for domains different from "localhost", and the sender cannot be changed to use complete domain names in email addresses, then the system administrator should make the backwards-compatible setting "append_dot_mydomain = yes" permanent in main.cf: The master.cf chroot default value has changed from "y" (yes) to "n" (no). The new default avoids the need for copies of system files under the Postfix queue directory. However, sites with strict security requirements may want to keep the chroot feature enabled after updating Postfix from an older version. The backwards-compatibility safety net is designed allow the administrator to choose if they want to keep the old behavior.'
year_published = 2025
