["https://postfix.org/developer.199810.html"]
title = "Venema aims to make network software safe"
description = "tech focus programming journal for programmers, software developers, web site builders and it professionals that features the latest news on java, java script, cgi, html, perl, c/c++, xml and other major programming languages published online from the world's largest programmers' resource site – developer.com"
full_description = '''E-mail is so mature an Internet application that it now almost doesn't seem like "technology"; it's just an expectation of late Twentieth Century life, like clean water or falling gasoline prices. It hasn't become easy yet, though, for people like IBM research staff member Wietse Venema, who's in the middle of a project "to build a mail system that does not screw up your machine," called VMailer. Venema's a good man for the job. He's worked for over a decade on a broad range of "software whose existence you don't notice because it works well": network security, inter-company financial transactions, terminal emulation, and so on. "My software rarely fails ... My claim to fame is largely based on the low incidence of error" in the infrastructural applications he's written. Now he's moved permanently to the "beautiful landscape" of central New York state from his native Netherlands to dedicate a year to VMailer. When things work right, you aren't aware of all these complexities. You see only the so-called "user agent" on your own machine, that manages communications with all the other pieces. You might have heard, though, of one of the most widely used of these other pieces: sendmail. It is an open-source application originally written by Eric Allman in 1980 while a student. sendmail is the "transfer agent" in use on the overwhelming majority of Internet servers; its job is to pass letters along from one machine to another, until they arrive at their final destination. sendmail is a resounding success; it has delivered trillions of messages in the last two decades, and the Sendmail Consortium and Sendmail, Inc. co-operate well to maintain and enhance it. It's also notoriously complex and subject to cracking. That's where Venema comes in. It'll be a big change for system administrators, though. Sendmail is written as a monolithic program, with an exceedingly terse configuration language ("R$* <@$+.uucp> $* $: $1 <@ $(U $2.uucp $) >$3" is typical). VMailer is a collection of small, relatively simple, secure, swift programs, which work together to do the job sendmail now does. "The reason for making VMailer distributed was to get better insulation between different parts of the system. ... Monolithic programs have poor damage control. ... As with Titanic, a compartmentalized architecture does not make the system immune against disaster, but it won't fail as easily as a system that isn't compartmentalized."'''
