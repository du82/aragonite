["https://postfix.org/POSTSCREEN_README.html"]
title = "Postfix Postscreen Howto"
full_description = 'This document describes features that are available in Postfix 3.6 and later. See POSTSCREEN_3_5_README.html for Postfix versions 2.8 - 3.5. The Postfix postscreen(8) daemon provides additional protection against mail server overload. One postscreen(8) process handles multiple inbound SMTP connections, and decides which clients may talk to a Postfix SMTP server process. By keeping spambots away, postscreen(8) leaves more SMTP server processes available for legitimate clients, and delays the onset of server overload conditions. postscreen(8) should not be used on SMTP ports that receive mail from end-user clients (MUAs). In a typical deployment, postscreen(8) handles the MX service on TCP port 25, while MUA clients submit mail via the submission service on TCP port 587 which requires client authentication. Alternatively, a site could set up a dedicated, non-postscreen, "port 25" server that provides submission service and client authentication, but no MX service. postscreen(8) maintains a temporary allowlist for clients that pass its tests; by allowing allowlisted clients to skip tests, postscreen(8) minimizes its impact on legitimate email traffic. As the first layer, postscreen(8) blocks connections from zombies and other spambots that are responsible for about 90% of all spam. It is implemented as a single process to make this defense as inexpensive as possible. The second layer implements more complex SMTP-level access checks with Postfix SMTP servers, policy daemons, and Milter applications. The third layer performs light-weight content inspection with the Postfix built-in header_checks and body_checks. This can block unacceptable attachments such as executable programs, and worms or viruses with easy-to-recognize signatures. The fourth layer provides heavy-weight content inspection with external content filters. Typical examples are Amavisd-new, SpamAssassin, and Milter applications. Each layer reduces the spam volume. The general strategy is to use the less expensive defenses first, and to use the more expensive defenses only for the spam that remains.'
year_published = 2025
clearnet = "https://postfix.org/POSTSCREEN_README.html"
