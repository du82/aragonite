full_description = 'An on-line version of this announcement is available at http://www.postfix.org/announcements/postfix-2.6.7.html Postfix legacy release 2.6.7 contains fixes that are also included with Postfix 2.7 (stable release) and Postfix 2.8 (experimental release). Bugfix (introduced Postfix 2.6) in the XFORWARD implementation, which sends remote SMTP client attributes through SMTP-based content filters. The Postfix SMTP client did not skip "unknown" SMTP client attributes, causing a syntax error when sending an "unknown" client PORT attribute. Robustness: skip LDAP queries with non-ASCII search strings, instead of failing with a database lookup error. The source code is available from ftp://ftp.porcupine.org/mirrors/postfix-release/index.html and from the mirrors listed at http://www.postfix.org/download.html.'
