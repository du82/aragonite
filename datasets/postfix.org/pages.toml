title = "Postfix legacy release 2.8.9"
full_description = '[An on-line version of this announcement will be available at http://www.postfix.org/announcements/postfix-2.8.9.html] Postfix stable release 2.8.9 is available. This contains fixes that are already part of Postfix 2.9 and 2.10. The "change header" milter request could replace the wrong header. A long header name could match a shorter one, because a length check was done on the wrong string. Reported by Vladimir Vassiliev. Core dump when postlog emitted the "usage" message, caused by an extraneous null assignment. Reported by Kant (fnord.hammer).'
