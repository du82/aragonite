["https://www.postfix.org/wip.html"]
title = "Postfix work-in-progress"
full_description = "ALPACA attack defense | Trickle attack defense | Advanced master.cf query/update support | Postscreen zombie defense | TLS (SSL) renegotiation attacks ALPACA is a confusion attack where a web client wants to talk to https://example.com but is tricked into talking to an SMTP, FTP, IMAP, or other non-web server that also has a TLS certificate for example.com. The client could then give sensitive information to the wrong service. Postfix cannot be used in such attacks, because by default the Postfix SMTP server drops a connection when a client sends CONNECT, GET, POST, or anything that looks like a header. The list of bad commands is configurable with smtpd_forbidden_commands. That feature was added in 2004 after someone's SMTP server was flooded with requests from open proxies. Previously, the Postfix command parser blocked only CONNECT and a hard-coded list of headers that appear in email messages. SOPHOS did a nice writeup that illustrates how Postfix blocks ALPACA attacks: https://nakedsecurity.sophos.com/2021/06/11/alpaca-the-wacky-tls-security-vulnerability-with-a-funky-name/ Trickle attacks are old, but have received attention in the context of web servers. The idea is that an attacker sends a request slowly, for example, one byte at a time. Since many servers implement per-read time limits, instead of per-transaction time limits, an attacker can keep a connection busy for a very long time. Namely, the maximum number of seconds before a read operation times out, multiplied by the maximum number of bytes per transaction, multiplied by the number of transactions per session. The postscreen daemon, available with Postfix 2.8 and later, implements time limits to receive one complete SMTP command line. Postscreen uses a default time limit of 300s for RFC compliance, but it will switch to a 10s limit under overload conditions. Postscreen limits the number of commands per session and never receives mail, so this is a complete solution. Support for per-request time limits in the Postfix SMTP server and client is now part of the Postfix 3.7 release. This limits the combined time to send or receive one complete SMTP command or reply. To make this solution complete, the Postfix SMTP server and client can also enforce a minimum (plaintext) data transfer rate, so that a large email message will not run into a per-request time limit."
year_published = 2025
clearnet = "https://www.postfix.org/wip.html"
