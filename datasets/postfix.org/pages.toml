["https://postfix.org/INSTALL.html"]
title = "Postfix Installation From Source Code"
full_description = 'If you are using a pre-compiled version of Postfix, you should start with BASIC_CONFIGURATION_README and the general documentation referenced by it. INSTALL is only a bootstrap document to get Postfix up and running from scratch with the minimal number of steps; it should not be considered part of the general documentation. This document describes how to build, install and configure a Postfix system so that it can do one of the following: Documentation is available as README files (start with the file README_FILES/AAAREADME), as HTML web pages (point your browser to "html/index.html") and as UNIX-style manual pages. You should view the README files with a pager such as more(1) or less(1), because the files use backspace characters in order to produce bold font. To print a README file without backspace characters, use the col(1) command. For example: In order to view the manual pages before installing Postfix, point your MANPATH environment variable to the "man" subdirectory; be sure to use an absolute path. Of particular interest is the postconf(5) manual page that lists all the 500+ configuration parameters. The HTML version of this text makes it easy to navigate around. All Postfix source files have their own built-in manual page. Tools to extract those embedded manual pages are available in the mantools directory. Postfix development happens on FreeBSD and MacOS X, with regular tests on Linux (Fedora, Ubuntu) and Solaris. Support for other systems relies on feedback from their users, and may not always be up-to-date. OpenBSD is partially supported. The libc resolver does not implement the documented "internal resolver options which are [...] set by changing fields in the _res structure" (documented in the OpenBSD 5.6 resolver(3) manpage). This results in too many DNS queries, and false positives for queries that should fail. On Solaris, the "make" command and other development utilities are in /usr/ccs/bin, so you MUST have /usr/ccs/bin in your command search path. If these files do not exist, you need to install the development packages first.'
year_published = 2025
clearnet = "https://postfix.org/INSTALL.html"
