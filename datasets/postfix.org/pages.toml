["https://postfix.org/announcements/postfix-3.0.3.html"]
title = """
Postfix stable release 3.0.3 and legacy releases 2.11.7, 2.10.9,
and 2.9.15"""
full_description = '[An on-line version of this announcement will be available at http://www.postfix.org/announcements/postfix-3.0.3.html] The Postfix Milter client aborted with a panic while adding a message header, after adding a short message header with the header_checks PREPEND action. Fixed by invoking the header output function while PREPENDing a message header. False alarms while scanning the Postfix queue. Fixed by resetting errno before calling readdir(). This defect was introduced 19970309. The postmulti command now refuses to create a new MTA instance when the template main.cf or master.cf file are missing. This is a common problem on Debian-like systems. Turning on Postfix SMTP server HAProxy support broke TLS wrappermode. Fixed by temporarily using a 1-byte VSTREAM buffer to read the HAProxy connection hand-off information. The xtext_unquote() function did not propagate error reports from xtext_unquote_append(), causing the decoder to return partial output, instead of rejecting malformed input. The Postfix SMTP server uses this function to parse input for the ENVID and ORCPT parameters, and for XFORWARD and XCLIENT command parameters. Compile error with AIX. The AIX 6/7 resolver(5) API defines RES_USE_DNSSEC without defining the "ad" bit. Fixed by disabling DNSSEC support for AIX 7x and earlier. The uxtext_unquote() function had the same problem as xtext_unquote(), because one was created by copying the other. The Postfix SMTP server uses this function to parse input for the ORCPT parameter when the remote SMTP client sends SMTPUTF8 mail. Unreported bug: Postfix smtpd_mumble_restrictions could report an incorrect reason for failed DNS lookups. Fixed by saving and restoring h_errno while evaluating the result from multi-query DNS lookups.'
