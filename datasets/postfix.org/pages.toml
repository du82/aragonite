["https://postfix.org/VERP_README.html"]
title = "Postfix VERP Howto"
full_description = 'Postfix versions 1.1 and later support variable envelope return path addresses on request. When VERP style delivery is requested, each recipient of a message receives a customized copy of the message, with his/her own recipient address encoded in the envelope sender address. For example, when VERP style delivery is requested, Postfix delivers mail from "owner-listname@origin" for a recipient "user@domain", with a sender address that encodes the recipient as follows: Thus, undeliverable mail can reveal the undeliverable recipient address without requiring the list owner to parse bounce messages. The VERP concept was popularized by the qmail MTA and by the ezmlm mailing list manager. See http://cr.yp.to/proto/verp.txt for the ideas behind this concept. What VERP delimiter characters Postfix uses when VERP style delivery is requested but no explicit delimiters are specified. What characters Postfix accepts as VERP delimiter characters on the sendmail command line and in SMTP commands. Many characters must not be used as VERP delimiter characters, either because they already have a special meaning in email addresses (such as the @ or the %), because they are used as part of a username or domain name (such as alphanumerics), or because they are non-ASCII or control characters. And who knows, some characters may tickle bugs in vulnerable software, and we would not want that to happen. What SMTP clients are allowed to request VERP style delivery. The Postfix QMQP server uses its own access control mechanism, and local submission (via /usr/sbin/sendmail etc.) is always authorized. To authorize a host, list its name, IP address, subnet (net/mask) or parent .domain. With Postfix versions 1.1 and 2.0, this parameter is called authorized_verp_clients (default: $mynetworks). Send one bounce report for multi-recipient VERP mail, instead of one bounce report per recipient. The default, one per recipient, is what ezmlm needs. In order to make VERP useful with majordomo etc. mailing lists, you would configure the list manager to submit mail according to one of the following two forms:'
