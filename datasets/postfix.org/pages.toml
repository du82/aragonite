["https://postfix.org/DEPRECATION_README.html"]
title = "Postfix Replacements for Deprecated Features"
full_description = 'This document describes Postfix features that are deprecated (will be removed) or that have already been removed. It also has tips for making an existing Postfix configuration more future-proof. The initial Postfix TLS implementation used multiple boolean parameters: one parameter to enable opportunistic TLS (for example, "smtp_enforce_tls = yes") and one parameter to enable mandatory TLS (for example, "smtp_require_tls = yes"). As we added support more features such as fingerprint, dane, and so on, we decided not to add more boolean parameters. Instead we introduced one configuration parameter to select from multiple deployment models (for example, smtp_tls_security_level = may | encrypt | dane, etc...). Having both the "old" and "new" way to configure Postfix is convenient for existing Postfix installations, because their configuration does not break after an upgrade to a new version. Unfortunately, there are also disadvantages. Having multiple ways to do similar things is not only confusing for newcomers, it also makes Postfix harder to change. Inform humans that a feature will be removed, and suggest replacements, in logging and documentation. Disclaimer: it has taken 20 years for some features to be removed. This past is not a guarantee for the future. The table summarizes removed or deprecated features and replacements. Click on the "obsolete feature" name for a more detailed description. There are similarly-named parameters and warnings for postscreen(8) and tlsproxy(8), but those parameters should rarely be specified by hand. There are similarly-named parameters and warnings for postscreen(8) and tlsproxy(8), but those parameters should rarely be specified by hand. There is similarly-named parameter and warning for tlsproxy(8), but that parameter should rarely be specified by hand. Unfortunately, this is more than a name change: the table format has changed too, as has the table search process. There is no simple conversion of the obsolete form to its replacement.'
year_published = 2025
clearnet = "https://postfix.org/DEPRECATION_README.html"
