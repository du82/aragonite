full_description = "postfix-announce@postfix.org: READ-ONLY list for announcements of Postfix releases and updates. Other postings are silently discarded. To subscribe, send email to postfix-announce-join@postfix.org from the addresss that you want to subscribe. This will ignore the subject and body of your message. To unsubscribe, send email to postfix-announce-leave@postfix.org from the addresss that you want to unsubscribe. This will ignore the subject and body of your message. postfix-users@postfix.org: for discussions about using Postfix: questions, problem reports, or feature requests. Postings from non-members are silently discarded. To subscribe, send email to postfix-users-join@postfix.org from the addresss that you want to subscribe. This will ignore the subject and body of your message. To unsubscribe, send email to postfix-users-leave@postfix.org from the addresss that you want to unsubscribe. This will ignore the subject and body of your message. postfix-devel@postfix.org: for people who design, implement or maintain Postfix source code. NOT for questions, problem reports and feature requests. Postings from non-members are silently discarded. To subscribe, send email to postfix-devel-join@postfix.org from the addresss that you want to subscribe. This will ignore the subject and body of your message. To unsubscribe, send email to postfix-devel-leave@postfix.org from the addresss that you want to unsubscribe. This will ignore the subject and body of your message."
