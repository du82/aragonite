2.9.10, and 2.8.18"""
full_description = '''[An on-line version of this announcement will be available at http://www.postfix.org/announcements/postfix-2.11.2.html] Fix for DMARC implementations based on SPF policy plus DKIM Milter. The PREPEND access/policy action added headers ABOVE Postfix's own Received: header, exposing Postfix's own Received: header to Milters (protocol violation) and hiding the PREPENDed header from Milters. PREPENDed headers are now added BELOW Postfix's own Received: header and remain visible to Milters. The Postfix SMTP server logged an incorrect client name in reject messages for check_reverse_client_hostname_access and check_reverse_client_hostname_{mx,ns}_access. They replied with the verified client name, instead of the name that was rejected. The qmqpd daemon crashed with null pointer bug when logging a lost connection while not in a mail transaction. The makedefs script now prepends "-I. -I../../include" to the compiler command-line options, to avoid name clashes with non-Postfix header files.'''
