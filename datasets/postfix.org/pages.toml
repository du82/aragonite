["https://postfix.org/linuxmag.200006/postfix.html"]
title = ""
full_description = '''N ahezu un�berschaubar ist die Flut von Diensten, die das Internet mittlerweile bietet. Einer der wichtigsten Dienste bleibt jedoch das Versenden und Empfangen von Mails. Ohne Open-Source-Tools w�re das undenkbar - gerade Sendmail geh�rt zu den am weitesten verbreiteten Mail Transfer Agents (MTA). Leider ist der monolithische Sendmail alles andere als leicht zu pflegen. In solch ein "Multifunktions-Tool" schleichen sich zwangsl�ufig Fehler ein - eine neue Sicherheitsl�cke in Sendmail geh�rte in der Vergangenheit zu den Treppenwitzen der Internet-Geschichte schlechthin. Aber auch wenn die aktuelle Version - soweit bekannt - keine gro�en Sicherheitsm�ngel aufweist: alleine die Konfiguration von Sendmail schreit geradezu nach einer Alternativl�sung. Das Standardwerk zu Sendmail, das so genannte "bat book" von Bryan Costales und Eric Allman [3] umfa�t 1021 Seiten. Die beiden am h�ufigsten eingesetzten (freien) Alternativen zu Sendmail sind Dan Bernsteins Qmail und Postfix von Wietse Venema. Beide sind wie Sendmail im Quelltext frei verf�gbar - Qmail unter der GPL, Postfix unter einer von der Mozilla Public License abgeleiteten Lizenz von IBM - und beide sind einfacher zu handhaben als das altehrw�rdige Sendmail. Wieste's Ziel bei der Entwicklung von Postfix war, ein schnelles, einfach zu administrierendes und sicheres Programm(paket) zu entwickeln, das so weit wie m�glich zu Sendmail kompatibel sein soll. Das Interessanteste an Postfix ist sein innerer Aufbau (siehe Grafik): es besteht aus mehreren kleinen Programmen, die �ber UNIX-Domain-Sockets kommunizieren. Auf diese Weise ist es viel einfacher, Probleme, Fehler oder Sicherheitsm�ngel in den Griff zu bekommen. Beispielsweise kommt Postfix ganz ohne setuid-M�chanismen aus. Deshalb ist es f�r einen potenziellen Angreifer unm�glich, Superuser-Rechte zu bekommen - selbst wenn er ein Sicherheitsloch von Postfix gefunden h�tte. Sendmail hingegen mu� unter UID 0 (root) laufen, zumindest in einer Standardinstallation und ohne gr��ere Klimmz�ge.'''
