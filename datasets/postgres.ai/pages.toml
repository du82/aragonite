title = "Database Lab Client CLI reference (dblab) | Postgres.AI"
description = "Description"
full_description = '''Reference guidesClient CLI (dblab)On this pageDatabase Lab Client CLI reference (dblab)Description​The Database Lab Command Line Interface (dblab) is a tool that allows working with Database Lab instances in the console. This tool is also used to enable working with thin clones in CI/CD pipelines, to run automated tests on full-size database copies.Getting started​Before you run any commands, install Database Lab CLI and initialize configuration. For more information, see Install and initialize Database Lab CLI.Synopsis​dblab [global options] command [command options] [arguments...]Use Database Lab CLI command help for information on a specific command. The synopsis for each command shows its parameters and their usage. Optional parameters are shown in square brackets.To list available commands, either run dblab with no parameters or with flag dblab --helpGlobal options​--url (string) - URL (with protocol and port, if needed) of Database Lab instance's API. The environment variable DBLAB_INSTANCE_URL can be used as well. The flag --url overrides config/env settings.--token (string) - verification token of Database Lab instance. The environment variable DBLAB_VERIFICATION_TOKEN can be used as well. The flag --token overrides config/env settings.--insecure, -k (boolean, default: false) - skip validation of SSL/TLS certificates; this option is needed to communicate with DLE using either HTTP or HTTPS with self-signed certificates. The environment variable DBLAB_INSECURE_SKIP_VERIFY can be used as well. The flags --insecure and -k override config/env settings.--request-timeout (string, default: "") - allow changing requests timeout.The environment variable DBLAB_REQUEST_TIMEOUT can be used as well. The flag --request-timeout overrides config/env settings.--forwarding-server-url (string, default: "") - forwarding server URL of Database Lab instance. The environment variable DBLAB_CLI_FORWARDING_SERVER_URL can be used as well. The flag --forwarding-server-url overrides config/env settings.--forwarding-local-port (string, default: "") - local port for forwarding to the Database Lab instance. The environment variable DBLAB_CLI_FORWARDING_LOCAL_PORT can be used as well. The flag --forwarding-local-port overrides config/env settings.--identity-file (string, default: "") - select a file from which the identity (private key) for public key authentication is read". The environment variable DBLAB_CLI_IDENTITY_FILE can be used as well. The flag --identity-file overrides config/env settings.--debug (boolean, default: false) - run CLI in the debug mode. The environment variable DBLAB_CLI_DEBUG can be used as well.--help, -h (boolean, default: false) - show help.--version, -v (boolean, default: false) - print the version.Examplesdblab --url "127.0.0.1:2345" --token "SECRET_TOKEN" --insecure clone listDBLAB_INSTANCE_URL="example.com" DBLAB_VERIFICATION_TOKEN="SECRET_TOKEN" dblab clone listtipIf you register a Database Lab instance on the Postgres.ai Platform through the Platform server tunnel, it means that to use Database Lab API and CLI, your users need to be able to reach your infrastructure somehow. Consider use of VPN or custom SSH port forwarding.Command Overview​COMMANDS: init initialize Database Lab CLI. port-forward start port forwarding to the Database Lab instance. clone manages clones. instance displays instance info. snapshot manage snapshots. config configure CLI environments. help, h shows a list of commands or help for one command.Command: init​Initialize a working directory containing Database Lab configuration files. This is the first command that should be run before managing clones or changing the Database Lab configuration.It is safe to run this command multiple times.Usagedblab init [command options] [arguments...]Options--environment-id (string, required) - an arbitrary environment ID of Database Lab instance's API--url (string, required) - URL of Database Lab instance's API--token (string, required) - verification token of Database Lab instance--insecure (boolean, optional, default: false) - allow insecure server connections when using SSL--request-timeout (string, optional, default: "") - change requests timeout--forwarding-server-url (string, optional) - forwarding server URL of Database Lab instance. For example: ssh://[email protected]:22--forwarding-local-port (string, optional) - local port for forwarding to the Database Lab instance--identity-file (string, optional) - select a file from which the identity (private key) for public key authentication is read"Exampledblab init --environment-id dev --url "http://127.0.0.1:2345" --token "SECRET_TOKEN" --insecureCommand: port-forward​Start port forwarding to the Database Lab instance.Usagedblab [global options] port-forwardGlobal options--forwarding-server-url (string, optional) - forwarding server URL of Database Lab instance. For example: ssh://[email protected]:22--forwarding-local-port (string, optional) - local port for forwarding to the Database Lab instance--identity-file (string, optional) - a path to a file from which the identity (private key) for public key authentication is readExampledblab --forwarding-server-url "ssh://[email protected]:22" --forwarding-local-port 8888 port-forwardCommand: clone​Manage Database Lab clones. Usagedblab clone command [command options] [arguments...]Subcommandslist - list all existing clonesstatus - display clone's informationcreate - create new cloneupdate - update existing clonereset - reset clone's statedestroy - destroy cloneport-forward - start port forwardinghelp , h - shows a list of commands or help for one commandSubcommand list​List all existing clones.Usagedblab clone listSubcommand status​Display the clone's information.Usagedblab clone status CLONE_IDArgumentsCLONE_ID (string, required) - an ID of the Database Lab clone to display informationSubcommand create​Create a new clone. Usagedblab clone create [command options]Options--username (string, required) - database username--password (string, required) - database password--id (string, optional) - clone ID--snapshot-id (string, optional) - snapshot ID--protected , -p (boolean, default: false) - mark instance as protected from deletion--restricted (boolean, default: false) - use database user with restricted permissions (not a superuser, DML and DDL allowed, CREATE EXTENSION is not allowed)--async , -a (boolean, default: false) - run the command asynchronously--extra-config (string, optional) set an extra database configuration for the clone. An example: statement_timeout='1s'--help , -h (boolean, default: false) - show helpExampledblab clone create --username someuser --password somepasswordSubcommand update​Update the specified clone.Usagedblab clone update [command options] CLONE_IDArgumentsCLONE_ID (string, required) - an ID of the Database Lab clone to update parametersOptions--protected , -p (boolean, optional) - mark instance as protected from deletion--help , -h (boolean, default: false) - show helpExampledblab clone update --protected TestCloneIDSubcommand reset​Reset the clone's state.Usagedblab clone reset [command options] CLONE_IDArgumentsCLONE_ID (string, required) - an ID of the Database Lab clone to reset stateOptions--async , -a (boolean, default: false) - run the command asynchronously--help , -h (boolean, default: false) - show help--latest, (boolean, default: false; DLE 2.5+) - reset clone using the latest available snapshot--snapshot-id , (string, default: ""; DLE 2.5+) - reset clone using the specified snapshotnoteThe parameters --latest and --snapshot-id cannot be specified at the same time.Exampledblab clone reset TestCloneIDSubcommand destroy​Destroy the specified clone.Usagedblab clone destroy [command options] CLONE_IDArgumentsCLONE_ID (string, required) - an ID of the Database Lab clone to destroy.Options--async , -a (boolean, default: false) - run the command asynchronously.--help , -h (boolean, default: false) - show help.Exampledblab clone destroy TestCloneIDSubcommand start-observation​🚧 ExperimentalThis is an experimental feature (its working title: "CI Observer"). If you have questions, suggestions, or bug reports, please open an issue in the Database Lab Engine issue tracker and/or raise a discussion in one of the Database Lab Community channels.Start clone state monitoring. The command runs the clone observation session and estimates results by defined criteria such as lock duration and whole session duration. To get results, it is necessary to stop the observation session using the stop-observation command.Usagedblab clone start-observation [command options] CLONE_IDArgumentsCLONE_ID (string, required) - an ID of the Database Lab clone to destroy.Options--observation-interval (integer, default: 0) - interval of metric gathering and output (in seconds). The environment variable DBLAB_OBSERVATION_INTERVAL.--max-lock-duration (integer, default: 0) - maximum allowed duration for locks (in seconds). The environment variable DBLAB_MAX_LOCK_DURATION.--max-duration (integer, default: 0) - maximum allowed duration for observation (in seconds). The environment variable DBLAB_MAX_DURATION.--tags (string, optional) - set tags for the observation session. An example: branch=patch-1.--help , -h (boolean, default: false) - show help.Exampledblab clone start-observation \ --observation-interval 60 \ --max-lock-duration 600 \ --max-duration 10000 \ --tags branch=patch1 \ --tags revision=commit-hash \ TestCloneIDSubcommand stop-observation​🚧 Experimental Summarize clone monitoring session and check results.Usagedblab clone stop-observation [command options] CLONE_IDArgumentsCLONE_ID (string, required) - an ID of the Database Lab clone to destroy.Options--help , -h (boolean, default: false) - show help.Exampledblab clone stop-observation TestCloneIDSubcommand port-forward​Start port forwarding to clone.Usagedblab [global options] clone port-forward CLONE_IDArgumentsCLONE_ID (string, required) - an ID of the Database Lab clone for port forwarding.Global options--forwarding-server-url (string, optional) - forwarding server URL of Database Lab instance. For example: ssh://[email protected]:22--forwarding-local-port (string, optional) - local port for forwarding to the Database Lab instance--identity-file (string, optional) - a path to a file from which the identity (private key) for public key authentication is readExampledblab \ --forwarding-server-url "ssh://[email protected]:22" \ --forwarding-local-port 8888 \ clone port-forward TestCloneIDSubcommand help , h​Show help for the specified command.Usagedblab clone helpCommand: instance​Display the instance information.Usagedblab instance command [command options] [arguments...]Subcommandsstatus - display instance's statusversion - display instance's versionhelp , h - shows a list of commands or help for one commandSubcommand status​Get the status of the instance we are working with.Usagedblab instance statusSubcommand version​Get the version of the instance we are working with.Usagedblab instance versionSubcommand help , h​Show help for the command.Usagedblab instance helpCommand: snapshot​Manage snapshots.Usagedblab snapshot command [command options] [arguments...]Subcommandslist - list all existing snapshots.help , h - shows a list of commands or help for one command.Subcommand list​Get the list of snapshots.Usagedblab snapshot listSubcommand help , h​Show help for the command.Usagedblab snapshot helpCommand: config​Configure CLI environments.Usagedblab config command [command options] [arguments...]Subcommandscreate - create new CLI environmentupdate - update an existing CLI environmentview - view status of CLI environmentlist - display list of all available CLI environmentsswitch - switch to another CLI environmentremove - remove CLI environmentshow-global - show global CLI settings (DLE 3.1+)set-global - update global CLI settings (DLE 3.1+)help , h - shows a list of commands or help for one commandSubcommand create​Create a new CLI environment.Usagedblab config create [command options] ENVIRONMENT_IDArgumentsENVIRONMENT_ID (string, required) - an ID of the Database Lab CLI environment to create.Options--url (string, required) - URL of Database Lab instance's API--token (string, required) - verification token of Database Lab instance--insecure (boolean, optional) - allow insecure server connections when using SSL--request-timeout (string, optional) - change requests timeout--forwarding-server-url (string, optional) - forwarding server URL of Database Lab instance. For example, ssh://[email protected]:22--forwarding-local-port (string, optional) - local port for forwarding to the Database Lab instance--identity-file (string, optional) - a path to a file from which the identity (private key) for public key authentication is readExampledblab config create --url "http://127.0.0.1:2345" --token SECRET_TOKEN --insecure=true devSubcommand update​Update an existing CLI environment.Usagedblab config update [command options] ENVIRONMENT_IDArgumentsENVIRONMENT_ID (string, required) - an ID of the Database Lab CLI environment to updateOptions--url (string) - URL of Database Lab instance's API--token (string) - verification token of Database Lab instance--insecure (boolean, optional) - allow insecure server connections when using SSL--request-timeout (string, optional) - change requests timeout--forwarding-server-url (string, optional) - forwarding server URL of Database Lab instance. For example, ssh://[email protected]:22--forwarding-local-port (string, optional) - local port for forwarding to the Database Lab instance--identity-file (string, optional) - a path to a file from which the identity (private key) for public key authentication is readExampledblab config update --url "http://127.0.0.1:2345" --token SECRET_TOKEN --insecure=true devSubcommand view​Display status of CLI environment.Usagedblab config view [ENVIRONMENT_ID]ArgumentsENVIRONMENT_ID (string) - an ID of the Database Lab CLI environment to view. By default, the current environment will be shownSubcommand list​Display list of all available CLI environments.Usagedblab config listSubcommand switch​Switch to another CLI environment.Usagedblab config switch ENVIRONMENT_IDArgumentsENVIRONMENT_ID (string, required) - an ID of the Database Lab CLI environment to switchSubcommand remove​Remove CLI environment.Usagedblab config remove ENVIRONMENT_IDArgumentsENVIRONMENT_ID (string, required) - an ID of the Database Lab CLI environment to removeSubcommand show-global​Show global CLI settings. DLE 3.1+ only.Usagedblab config show-globalSubcommand set-global​Update global CLI settings. DLE 3.1+ only.Usagedblab config set-global [command options]Options--tz (string, optional) - timezone to display time in DLE responses. See the complete list of timezones. An empty string means UTC. The environment variable TZ can be used as well. Note that the environment variables have a higher priority.Exampledblab config set-global --tz "America/Los_Ang'''
