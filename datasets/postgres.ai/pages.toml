["https://postgres.ai/docs/reference-guides/database-lab-engine-configuration-reference"]
title = "Database Lab Engine configuration reference | Postgres.AI"
full_description = '''Reference guidesDatabase Lab Engine configurationOn this pageDatabase Lab Engine configuration referenceOverview​Database Lab Engine behavior can be controlled using the main configuration file that has YAML format. This reference describes available configuration options.tipDatabase Lab Engine supports YAML 1.2 including anchors, aliases, tags, map merging.Example config files can be found here: https://gitlab.com/postgres-ai/database-lab/-/tree/v3.0.0/configs.You may store configuration files in any suitable location. The recommended location of configuration files for Database Lab Engine is ~/.dblab/engine/configs.In addition, Database Lab Engine provides functionality for storing information about current sessions and the state of the instance. The recommended location of metadata files is ~/.dblab/engine/meta. Note the metadata folder must be writable.infoMake sure that the file name is server.yml and its directory is mounted to /home/dblab/configs inside the DLE container. Useful guides that help manage Database Lab Engine:How to configure and start Database Lab EngineReconfigure Database Lab Engine without downtimetipThe configuration of Database Lab Engine can be reloaded without downtime:docker exec -it dblab_server kill -SIGHUP 1docker logs --since 1m dblab_serverThe list of configuration sections​Here is how the configuration file is structured:SectionDescriptionglobalContains global parameters, such as data directory path or enabling debugging.serverPertains to the DLE API server.embeddedUIRefers to the DLE UI.poolManagerManages filesystem pools or volume groups.provisionDescribes how thin cloning and database branching are organized.retrievalDefines the data flow: a series of "jobs" for initial retrieval of the data, and, optionally, continuous data synchronization with the source, snapshot creation and retention policies. The initial retrieval may be either "logical" (dump/restore) or "physical" (based on replication or restoration from a archive).cloningThin cloning policies.platformPostgres.ai Platform integration (provides GUI, advanced features such as user management, logs).observerCI Observer configuration. CI Observer helps verify database schema changes (database migrations) automatically, in CI/CD pipelines. Available on the Postgres.ai Platform.diagnosticConfiguration to collect diagnostics logs - containers output, Postgres logs.estimator(removed in DLE 3.4.0) Estimator configuration. Estimator estimates a timing of queries on the production database.Section global: global parameters​engine - defines the Database Lab Engine. Supported engines: postgresdebug - allows seeing more in the Database Lab Engine logs; WARNING: in this mode, sensitive data (such as passwords) can be printed to logsdatabase (key-value, optional) - contains default configuration options of the restored databaseusername (string, optional, default: "postgres") - a default username for logical/physical restore jobsdbname (string, optional, default: "postgres") - a default database name for logical/physical restore jobsSection server: Database Lab Engine API server​verificationToken (string, required) - the token that is used to work with Database Lab APIport (string, required, default: 2345) - HTTP server portSection embeddedUI: Database Lab Engine user interface​enabled (boolean, optional, default: true) - manages the state of the UI containerdockerImage (string, required) - a Docker image of the UI applicationhost (string, required, default: "127.0.0.1") - the host which the embedded UI container accepts HTTP connections fromport (integer, required, default: 2346) - an HTTP port of the UI applicationSection poolManager: filesystem pools or volume groups management​mountDir (string, required) - specifies the location of the pools mount directory (can contain multiple pool directories)dataSubDir (string, optional, default: "") - specifies the location of restored data by Database Lab Engine relative to the pool which is placed inside the mount directory (mountDir)clonesMountSubDir (string, required) - the directory that will be used to mount clonessocketSubDir (string, required) - the UNIX socket directory that will be used to establish local connections to cloned databasespreSnapshotSuffix (string, required) - the suffix to denote preliminary snapshotsselectedPool (string, optional, default: "") - enforce selection of the working pool (or dataset) inside the mountDir directory. If this option is specified, it disables the automatic rotation of multiple pools, which may be useful when multiple DLEs are running on the same machine, sharing the same set of pools. An empty string turns off this feature, enabling the standard pool selection and rotation mechanism (default behavior).Section provision: thin cloning environment settings​portPool (key-value, required) - defines a pool of ports for Postgres clonesfrom (integer, required) - the lowest port value in the poolto (integer, required) - the highest port value in the pooldockerImage (string, required) - Postgres Docker image to be used for cloning. IMPORTANT: Postgres version of this image should match the source's Postgres version. For logical mode, it is a recommendation. For physical mode, it is a requirement.useSudo (boolean, optional, default: false) - use sudo for ZFS/LVM and Docker commands if Database Lab server running outside a containerkeepUserPasswords (bool, optional, default: "false") - By default, in addition to creating a new user with administrative privileges, Database Lab Engine resets passwords for all existing users. This is done for security reasons. If this behavior is undesirable and you want to keep the ability authenticate for the existing users with their unchanged passwords, then set the value of the variable to true.containerConfig (key-value, optional) - options to pass custom parameters to clone containerscloneAccessAddresses (string, optional, default: "127.0.0.1") - IP addresses that can be used to access clones. By default, use a loop-back to accept only local connections. The empty string means "all available addresses". The option supports multiple IPs (using comma-separated format) and IPv6 addresses (for example, [::1])Section retrieval: data retrieval​refresh (key-value, optional) - describes configuration for a full refresh.timetable (string, optional, default: "") - defines a timetable in crontab format: https://en.wikipedia.org/wiki/Cron#OverviewskipStartRefresh (boolean, optional, default: false) - skips running retrieval jobs while the DLE instance starts; supported since DLE 3.4jobs (list, optional) - declares the set of running jobs. Stages must be defined in the spec sectionspec (key-value, optional) - contains a configuration spec for each jobData retrieval jobs​Available job names:logicalDumplogicalRestorelogicalSnapshotphysicalRestorephysicalSnapshotinfoYou need to choose either "logical" or "physical" set of jobs. Mixing is not allowedNote, that all jobs are optional. For example, all the following approaches defining the initial data retrieval process are allowed:You may consider using both logicalDump and logicalRestore to make a dump to a file and then restore from itYou may use only logicalRestore and restore from an already prepared dump fileYou may use only logicalDump, without logicalRestore (however, this approach makes sense only if you define immediateRestore option in the logicalDump job, to perform dump & restore on-the-fly, without saving the dump to a file)Job logicalDump​Dumps a PostgreSQL database from a provided source to an archive or to the Database Lab Engine instance.Options:dumpLocation (string, required) - specifies the location to store dump files (or directories, for directory-format archives), it will be automatically created on the host machine. DLE deletes all files and directories in this directory before creating new dumps.dockerImage (string, required) - specifies the Docker image containing the dump-required toolcontainerConfig (key-value, optional) - options to pass custom parameters to logicalDump containersource (key-value, required) - describes source of data:type (string, required) - defines location type of a dumped database. Available values: local, remote, rdsIamconnection (key-value, required) - defines connection parameters of source:dbname (string, required) - database name used for connection purposes; also see logicalDump.databaseshost (string, required) - defines hostname of the databaseport (integer, optional, default: 5432) - defines port of the databaseusername (string, optional, default: postgres) - defines database username to connect to the databasepassword (string, optional, default: "") - defines username password to connect to the database; the environment variable PGPASSWORD can be used instead of this option; the environment variable has a higher priorityrdsIam (key-value, optional) - contains options specific for RDS IAM source typeawsRegion (string, required) - AWS Region where RDS is locateddbInstanceIdentifier (string, required) - RDS instance IdentifiersslRootCert (string, required) - path on the host machine to the SSL root certificate. You can download it from https://s3.amazonaws.com/rds-downloads/rds-combined-ca-bundle.pem parallelJobs (integer, optional, default: 1) - defines the number of concurrent jobs using the pg_dump option jobs. This option can dramatically reduce the time to dump a large databasedatabases (key-value, optional) - defines options for specifying the database list that must be copied. By default, DLE dumps and restores all available databases. Do not specify the databases section to take all databases. Available options for each database: tablestables (list of strings, optional) - dumps definition and/or data of only the listed tables. Do not specify the tables section to dump all available tablesexcludeTables (list of strings, optional) - excludes all tables matching any of the patterns from the dump. Accept specific schemas and tables or will allow for wildcards (*) for more flexibility.customOptions (list of strings, optional) - defines one or multiple pg_dump options. See available options in the official PostgreSQL documentation.immediateRestore (key-value, optional) - provides options for direct restore to a Database Lab Engine instance.enabled (boolean, optional, default: false) - enable immediate restore.forceInit (deprecated, boolean, optional, default: false) - init data even if the Postgres directory (see the configuration options global.mountDir and global.dataSubDir) is not empty; note the existing data might be overwritten; deprecated since DLE 3.4.0customOptions (list of strings, optional) - defines one or multiple pg_restore options. See available options in the official PostgreSQL documentationignoreErrors (boolean, optional, default: false) - ignore errors that occurred during logical data dump; supported since DLE 3.4Job logicalRestore​Restores a PostgreSQL database from an archive created by pg_dump in one of the non-plain-text formats.Options:dumpLocation (string, required) - specifies the location of the archive files (or directories, for directory-format archives) on the host machine to be restoreddockerImage (string, required) - specifies the Docker image containing the restore-required toolcontainerConfig (key-value, optional) - options to pass custom parameters to logicalRestore containerforceInit (deprecated, boolean, optional, default: false) - init data even if the Postgres directory (see the configuration options global.mountDir and global.dataSubDir) is not empty; note the existing data might be overwritten; deprecated since DLE 3.4.0parallelJobs (integer, optional, default: 1) - defines the number of concurrent jobs using the pg_restore option jobs. This option can dramatically reduce the time to restore a large database to a server running on a multiprocessor machinedatabases (key-value, optional) - defines options for specifying the database list that must be restored. By default, DLE restores all available databases. Do not specify the databases section to restore all databases. Available options for each database: tables, formatformat (string, optional, default: "") - defines a dump format. Available formats: directory, custom, plain. Default format: directory. See the description of each format in the official PostgreSQL documentation.compression (string, optional, default: "no") - defines a compression type for plain-text dumps. Available compression types: gzip, bzip2, no.tables (list of strings, optional) - restores definition and/or data of only the listed tables. Do not specify the tables section to restore all available tablescustomOptions (list of strings, optional)- defines one or multiple pg_restore options. See available options in the official PostgreSQL documentationqueryPreprocessing (key-value, optional) - defines pre-processing parameters; supported since DLE 3.2queryPath (string, optional, default: "") - specifies the path to SQL pre-processing queries; an empty string means that no pre-processing definedmaxParallelWorkers (integer, optional, default: 2) - defines the worker limit for parallel queriesinline (string, optional, default: "") - inline SQL queries to execute; if specified, queries from queryPath are executed before inlineignoreErrors (boolean, optional, default: false) - ignore errors that occurred during logical data restore; supported since DLE 3.4skipPolicies (boolean, optional, default: true) - do not restore row-level security policies (CREATE POLICY); supported since DLE 3.4Job logicalSnapshot​Prepares a snapshot for logical restored PostgreSQL database.Options:dataPatching (key-value, optional) - defines SQL queries for data patchingdockerImage (string, optional) - specifies the Docker image to run a data patching containercontainerConfig (key-value, optional) - options to pass custom parameters to data patching containerqueryPreprocessing (key-value, optional) - defines pre-processing parametersqueryPath (string, optional, default: "") - specifies the path to SQL pre-processing queries; an empty string means that no pre-processing definedmaxParallelWorkers (integer, optional, default: 2) - defines the worker limit for parallel queriesinline (string, optional, default: "") - inline SQL queries to execute; if specified, queries from queryPath are executed before inlinepreprocessingScript (string, optional) - path on the host machine to a pre-processing scriptconfigs (key-value, optional) - applies PostgreSQL configuration parameters when preparing a working snapshot. These parameters are inherited by all clones. See also: How to configure PostgreSQL used by Database Lab EngineJob physicalRestore​Restores data from a physical backup.Supported restore tools:WAL-G (walg) - an archival restoration tool for PostgreSQL, it uses LZ4, LZMA, or Brotli compression, multiple processors, and non-exclusive base backups for Postgres (GitHub)pgBackRest (pgbackrest) - a reliab'''
