full_description = 'Flexible pricing to meet your needsStandard (DBLab SE)Unlimited DB branching and cloningAutomated data refresh on scheduleFast and easy setup, it takes just a few minutesWell-tested and maintained package with vendor supportVarious sources supported, including databases with PostGIS and managed services such as AWS RDS and Aurora, GCP CloudSQL, Supabase, Timescale, and HerokuMonitoring includedSingle user / API keyMaximum database size 2000 GiBUpon request, help with Postgres customization (extensions, locales, etc.)Full vendor support; max. response time: 3 business daysStarting at $62 per monthExplore pricingSet up in 3 minutes"Booster" add-onOne-time package delivering Enterprise-level supportUnlimited Slack communications1 hour live training (Zoom)Custom-built docker images upon requestMax. response time: 1 business day$4,500 for 3 months Contact usEnterprise (DBLab EE)Multi-user SSOUnlimited database sizeAdvanced access controlAutomated database testing in CI/CD pipelinesSQL optimization tooling and workflowUnlimited Slack or Zoom supportQuarterly training & best practice reviewLive debugging & troubleshootingMax. response time: 1 business dayCustom Pricing Available as an annual contract (starts from $0.2662 / 100 GiB / h)Contact UsDBLab SE pricingDBLab SE can be installed on any cloud or on-premises environment.Set up in minutesHow it works:DBLab SE is built using open-source components. You install it toyour infrastructure. You pay Postgres.ai for support, guaranteed packaging quality, keeping the product up-to-date (think Postgres versions, extensions, tools) and feature-rich. You can switch from DBLab SE to a free offering (DBLab CE, Community Edition) any time, but in this case, you would lose the ability to use the DBLab SE bundle and the guaranteed vendor support.Postgres.ai teamed up with Stripe to ensure your billing is both easy and secure.You can use your own hardware (hello, cloud repatriates). Select the "BYOM" ("Bring Your Own Machine") option when setting up DBLab SE. This also lets you install DBLab SE on a VM in any cloud.For certain clouds like AWS, GCP, DigitalOcean, and Hetzner.Cloud, there is a simpler setup available in the Postgres.ai Console. Costs for cloud resources like VM, storage, network, dedicated IP addresses are not part of DBLab SE pricing. You will pay them directly to your cloud provider.The price of DBLab SE is based on the "compute" capacity of your machine. If the CPU count and RAM size are not an exact match, the closest available option is automatically used.DBLab SE pricing is not based on the database size. However, there is a current size limit of 2000 GiB for database size of a single DBLab SE instance. If you need more, please reach out to us.DBLab SE billing is calculated on an hourly basis.You will not be billed for hours when your DBLab SE instance is off. However, if you use it for only a portion of an hour, you will still be charged for the full hour.To stop charges, just de-provision your DBLab SE instance. The hour you shut it down will be considered the final hour for billing.You can manage payment methods, access invoices, and view billed hours in the "Billing" section of your organization account.AWS Marketplace users: check out our prices directly on the AWS Marketplace page.If you have any questions, please contact us.'
