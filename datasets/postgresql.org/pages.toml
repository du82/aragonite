["https://postgresql.org/about/policies/coc"]
title = "PostgreSQL: Code of Conduct"
full_description = "The PostgreSQL Project prides itself on the quality of our code and our work, and the technical and professional accomplishments of our community. We expect everyone who participates to conduct themselves in a professional manner, acting with common courtesy and in the common interest, with respect for all users and developers. To that end, we have established this Code of Conduct for community interaction and participation in the project’s work and the community at large. This Code is meant to cover all interaction between community members, whether or not it takes place within postgresql.org infrastructure, so long as there is not another Code of Conduct that takes precedence (such as a conference's Code of Conduct). The PostgreSQL Project is open to participation by anyone with an interest in working with PostgreSQL, regardless of their level of experience with the software, or with technology in general. We encourage development and contributions from all users, whatever their background may be. We encourage thoughtful, constructive discussion of the software and this community, their current state, and possible directions for development. The focus of our discussions should be the code and related technology, community projects, and infrastructure. Personal attacks and negative comments on personal characteristics are unacceptable, and will not be permitted. Examples of personal characteristics include, but are not limited to age, race, national origin or ancestry, religion, gender, or sexual orientation. Additional behaviors which are also violations of this code of conduct include, but are not limited to, threats of violence against an individual or group, threats of professional, community, and/or project sabotage, unwelcome sexual attentions in any form, engaging in behavior that may bring the PostgreSQL project into disrepute, and refusing to cease inappropriate conduct when requested to do so. It is also expressly forbidden for anyone to retaliate against a person who brings a complaint under this Code of Conduct, or who assists in investigating such a complaint. Retaliation may take the form of, among other actions:"
