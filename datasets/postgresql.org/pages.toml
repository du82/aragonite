full_description = "pgSCV is a Prometheus-compatible monitoring agent and metrics exporter for PostgreSQL environment. The goal of the project is to provide a single tool (exporter) for collecting metrics from PostgreSQL and related services. Since the last post between the pgSCV v0.9.6 and v0.13.0 releases, a lot of new functionality has been implemented and many issues have been fixed, here is a short list of the main new features: For the complete list of changes, please checkout the release note on https://github.com/CHERTS/pgscv/releases"
