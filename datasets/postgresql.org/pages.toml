["https://postgresql.org/about/news/cloudnativepg-1251-and-1243-released-3030"]
title = "PostgreSQL: CloudNativePG 1.25.1 and 1.24.3 Released!"
description = "The **CloudNativePG Community** is pleased to announce the release of the **CloudNativePG Operator** versions 1.25.1 and 1.24.3. Notably, this is …"
full_description = "The CloudNativePG Community is pleased to announce the release of the CloudNativePG Operator versions 1.25.1 and 1.24.3. Notably, this is our first release since joining the CNCF Sandbox. Operator Startup Probe: Enhanced reliability during initialization by introducing a startup probe to prevent premature liveness probe failures. Security Enhancements: Strengthened the operator image build process by signing images with cosign, generating OCI attestations that include Software Bill of Materials (SBOM) and provenance data, and adding OCI annotations for improved traceability and integrity. Backup Reliability Fixes: Resolved several race conditions affecting volume snapshot backups, improving backup stability and consistency. Thank you for your continued support. Upgrade today to fully harness the capabilities of your PostgreSQL clusters! Version 1.25.1: We strongly recommend upgrading to this version promptly to benefit from the latest improvements. Version 1.24.3: For users on version 1.24, updating to 1.24.3 is essential for continued stability and support. Please note that support for version 1.24 will conclude on March 23, 2025. We invite you to become an active member of our open-source, vendor-neutral community. Connect with us through our Slack channel and stay informed about the latest developments by following us on Twitter. If you're using CloudNativePG in production, consider adding your organization as an adopter to support the project's growth and evolution. CloudNativePG is an open-source Kubernetes Operator specifically designed for PostgreSQL workloads. It manages the entire lifecycle of a PostgreSQL cluster, including bootstrapping, configuration, high availability, connection routing, and comprehensive backup and disaster recovery mechanisms. By leveraging PostgreSQL's native streaming replication, CloudNativePG efficiently distributes data across pods, nodes, and zones using standard Kubernetes patterns, enabling seamless scaling of replicas in a Kubernetes-native manner. Originally developed and supported by EDB, CloudNativePG is a CNCF Sandbox project and the sole PostgreSQL operator in this category."
author = "The CloudNativePG Contributors"
year_published = 2025
clearnet = "https://postgresql.org/about/news/cloudnativepg-1251-and-1243-released-3030"
