["https://postgresql.org/download"]
title = "PostgreSQL: Downloads"
full_description = "PostgreSQL is available for download as ready-to-use packages or installers for various platforms, as well as a source code archive if you want to build it yourself. The source code can be found in the main file browser or you can access the source control repository directly at git.postgresql.org. Instructions for building from source can be found in the documentation. There are source code and binary packages of beta and release candidates, and of the current development code available for testing and evaluation of new features. Note that these builds should be used for testing purposes only, and not for production systems. 'LAPP', 'MAPP' and 'WAPP' (Linux/Mac/Windows + Apache + PHP + PostgreSQL) stacks are available from BitNami. There is much software available that is not bundled with PostgreSQL. The Software Catalogue offers a listing of many commercial and Open Source applications, interfaces and extensions to PostgreSQL that you may find useful."
