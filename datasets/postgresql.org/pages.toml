["https://www.postgresql.org/list"]
title = "PostgreSQL: PostgreSQL Mailing List Archives"
full_description = "To help ensure you have a productive experience on the PostgreSQL experience, we have a few tips to get you started on your journey: The PostgreSQL mailing lists are available in a public archive and are independently syndicated across the web. We want you to feel comfortable posting to our public mailing lists, so please ensure you read our Archive Policy prior to your initial post. If your email address is protected by a mail-back anti-spam system, this could cause some issues with our mailing list system. If it is discovered that your email address has implemented one of these systems, we may have to automatically unsubscribe your account. Choose the most appropriate individual list for your question. Please do not cross-post (have multiple mailing lists in one email) unless there is a specific reason (such as a confirmed bug report being cross-posted to the hackers mailing list). Instead, choose the most appropriate list for your email and send it there. Cross-posted emails will be moderated and therefore will also take longer to reach the subscribers if approved. Ready to join the PostgreSQL community? You can subscribe to one of our mailing lists at lists.postgresql.org. The PostgreSQL Mailing list public archives provide a rich history of the PostgreSQL project, all the way back to 1997! We keep a public record of the mailing list to help provide a searchable resource to help answer your questions, as well as in the spirit of building an open community. Need a question answered? The archive are fully searchable. Can't find the answer you are looking for? If it is a general usage question, we recommend subscribing to the pgsql-general@lists.postgresql.org mailing list. If it is a more technical question about how PostgreSQL internals work, we recommend subscribing to the pgsql-hackers@lists.postgresql.org mailing list."
