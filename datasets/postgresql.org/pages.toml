full_description = "PostgreSQL has a wide variety of community and commercial support options available for users, including: Commercial support is also available from one of the many companies providing professional services to the PostgreSQL community. A list of companies that provide PostgreSQL-specific hosting is also available. There are websites and other resources that may also be extremely useful, some of which are listed below. Note that the following resources are not run by the PostgreSQL Project, and the PostgreSQL Code of Conduct may not apply. Found a bug in PostgreSQL? Please read over our bug reporting guidelines and then report it using our bug reporting form. You can see previous bug reports, and track your own on the pgsql-bugs@lists.postgresql.org mailing list. If you believe you have found a security issue, please refer to the security page for information on how to report it."
