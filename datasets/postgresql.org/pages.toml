["https://postgresql.org/about/event/fossasia-pgday-2025-2525"]
title = "PostgreSQL: FOSSASIA PGDay 2025"
full_description = "FOSSASIA PGDay 2025 is an event focused on the PostgreSQL database, held in conjunction with the FOSSASIA Summit in Bangkok, Thailand. This event brings together leading companies offering PostgreSQL solutions, organizations leveraging PostgreSQL in-house, and ASEAN-based businesses and government agencies exploring PostgreSQL as a scalable, reliable, and advanced database option. Building on the success of past PGDays in Jakarta, Hanoi, and Singapore, the 2025 edition is set to bring together 300 database administrators, developers, IT managers, and PostgreSQL enthusiasts to engage with the latest advancements in PostgreSQL technology and practices. This will be an excellent opportunity to learn more about PostgreSQL – the world’s most advanced open-source database. Get connected with like-minded people with an interest in PostgreSQL and open source software in the region. Showcase your work around PostgreSQL, inspire others, and help drive the future of PostgreSQL in Asia. Submit your talk proposals today to be part of this exciting event - https://eventyay.com/e/2831032f/cfs . Last date for submission is 12th Jan 2025. FOSSASIA PGDay wouldn't be possible without the generous support of our sponsors. Previous PGDays were held in Jakarta, Hanoi, and Singapore with the support of industry leaders such as Amazon Web Services, EnterpriseDB, Equnix, Fujitsu, Nutanix, and Postgres Professional. The 2025 edition is set to bring together 300 database administrators, developers, IT managers, and PostgreSQL enthusiasts eager to engage with the latest advancements in PostgreSQL technology and practices. To find out about sponsorship opportunities, please see our prospectus on - https://summit.fossasia.org/pgday-sponsorship. Note: The PostgreSQL Global Development Group does not endorse any events run by third parties. No guarantee of the quality of events is offered whatsoever."
