["https://postgresql.org/about/news/pg_builder-and-pg_wrapper-30-released-with-support-for-postgres-17-syntax-3027"]
title = "PostgreSQL: pg_builder and pg_wrapper 3.0 released with support for Postgres 17 syntax"
description = "I am pleased to announce the release of [pg_builder](https://github.com/sad-spirit/pg-builder) and [pg_wrapper](https://github.com/sad-spirit/pg-wrapper) packages for PHP updated for Postgres 17 syntax. ## …"
full_description = "I am pleased to announce the release of pg_builder and pg_wrapper packages for PHP updated for Postgres 17 syntax. pg_builder is a query builder for Postgres backed by a partial PHP reimplementation of PostgreSQL's own SQL parser. It supports almost all syntax available in Postgres 17 for SELECT (and VALUES), INSERT, UPDATE, DELETE, and MERGE queries. With pg_builder it is possible to start with a manually written query, parse it into an Abstract Syntax Tree, add query parts (either as Node objects or as strings) to this tree or remove them, and finally convert the tree back to an SQL string. pg_wrapper provides converters for PostgreSQL data types and an object-oriented wrapper for PHP's native pgsql extension that uses these converters. Conversion of query result fields is done automatically using database metadata, query parameters may require specifying type. For those types where a corresponding native PHP type or class is available it is used (text -> string, timestamp -> DateTimeImmutable, hstore -> associative array, etc.). For other types (geometric types, ranges) the package provides custom classes. If base types can be converted, then composite types, arrays, ranges using those can be handled as well."
author = "Alexey Borzov"
year_published = 2025
year_updated = 2025
clearnet = "https://postgresql.org/about/news/pg_builder-and-pg_wrapper-30-released-with-support-for-postgres-17-syntax-3027"
