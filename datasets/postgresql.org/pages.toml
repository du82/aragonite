["https://postgresql.org/docs/current/xplang.html"]
title = "PostgreSQL: Documentation: 17: Chapter 40. Procedural Languages"
description = "Chapter&nbsp;40.&nbsp;Procedural Languages Table of Contents 40.1. Installing Procedural Languages PostgreSQL allows user-defined functions to be written in other languages besides …"
full_description = "PostgreSQL allows user-defined functions to be written in other languages besides SQL and C. These other languages are generically called procedural languages (PLs). For a function written in a procedural language, the database server has no built-in knowledge about how to interpret the function's source text. Instead, the task is passed to a special handler that knows the details of the language. The handler could either do all the work of parsing, syntax analysis, execution, etc. itself, or it could serve as “glue” between PostgreSQL and an existing implementation of a programming language. The handler itself is a C language function compiled into a shared object and loaded on demand, just like any other C function. There are currently four procedural languages available in the standard PostgreSQL distribution: PL/pgSQL (Chapter 41), PL/Tcl (Chapter 42), PL/Perl (Chapter 43), and PL/Python (Chapter 44). There are additional procedural languages available that are not included in the core distribution. Appendix H has information about finding them. In addition other languages can be defined by users; the basics of developing a new procedural language are covered in Chapter 56. If you see anything in the documentation that is not correct, does not match your experience with the particular feature or requires further clarification, please use this form to report a documentation issue."
year_published = 2025
clearnet = "https://postgresql.org/docs/current/xplang.html"
