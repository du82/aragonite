["https://postgresql.org/about/policies/funds-group"]
title = "PostgreSQL: Funds Group"
full_description = "Governance Charter of the Relationship between the PostgreSQL project and Software in the Public Interest, Inc. The Core Team of the PostgreSQL project consists of the people currently listed on the contributors page. The Fundraising Group (a.k.a. Funds Group) of the PostgreSQL project initially consisted of the members of The PostgreSQL Foundation Inc. that were active at the time of its termination. Thereafter, the Fundraising Group appoints its own members using the normal procedures for proposals and votes, as described below. The current membership is shown here. The Fundraising Group elects an SPI Liaison and an Deputy SPI Liaison. The appointments are subject to the veto of the Core Team. The appointments do not have an explicit duration, but either may be replaced at any time using the normal procedures for proposals and votes, as described below. The duty of the SPI Liaison is primarily to represent the interests and decisions of the Fundraising Group to SPI. Additionally the SPI Liaison will submit to SPI on an ongoing basis a list of persons eligible for automatic SPI contributing membership in recognition of their contributions to the PostgreSQL project. The duty of the Deputy SPI Liaison is to perform the duties of the SPI Liaison in the case that the SPI Liaison is unavailable for a non-trivial amount of time, or upon explicit request of the SPI Liaison or the Fundraising Group. Proposals must be made explicitly via email on the funds group mailing list, and be seconded prior to discussion and voting. Decisions require discussion and voting in accordance with how the fundraising group votes in order to be valid. If the vote is determined to be done with the Open Voting method, all votes will be sent directly to the mailing list. Voting results should be summarized by the member making the motion once the voting period is closed. Any member can review the openly available votes for verification of the results. If the vote is determined to be done with the Confidential Voting method, the member who makes the motion may propose the Vote Collectors. The Vote Collectors must agree to this responsibility. If they reject the request, other members must be selected until 2 are found which agree. If no members are specifically selected, the default Vote Collectors are the SPI Liaison and the Alternate SPI Liaison."
year_published = 2025
clearnet = "https://postgresql.org/about/policies/funds-group"
