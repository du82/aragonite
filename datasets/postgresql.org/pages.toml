title = "PostgreSQL: Recognised NPOs"
full_description = '''Recognised NPOs (Non Profit Organisations) are legal entities that support the PostgreSQL project as their primary objective, and are managed in accordance with the Recognised PostgreSQL Nonprofit Organisations policy. PostgreSQL Europe is the "umbrella group" for PostgreSQL User Groups in Europe and for users in regions that don't have a local user group. It's goal is to promote the use of PostgreSQL in Europe, primarily by assisting local user groups to promote the product locally through conferences and other advocacy, as well as running European-wide conferences and other activities. PostgreSQLFr has as its objectives the promotion, the support for deployment and the development of the Open Source software PostgreSQL and its derivatives and related projects in France and in French speaking countries. The United States PostgreSQL Association, affectionately known as PgUS, is a IRS 501(c)(3) public charity. It's purpose is to support the growth and education of PostgreSQL, The World's Most Advanced Open Source Database.'''
