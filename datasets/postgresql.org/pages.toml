["https://postgresql.org/about/donate"]
title = "PostgreSQL: Donate"
full_description = "This pages lists Recognised NPOs and additional non-profit organisations that are critical to the PostgreSQL project. Donations to these organizations are helpful in supporting our work. There are different ways to support Recognised NPOs, including becoming a Financial Sponsor. You can find out more information about financial sponsorship on the financial sponsorship page, or through a Recognised NPOs website. The PostgreSQL Community Association (PGCA) is a special-purpose NPO setup at the request of the PostgreSQL Core Team to manage and protect key project assets such as domain names and trademarks. Donating to PGCA supports general project administrative efforts that come with maintaining an open source project. PostgreSQL Europe is a European region non profit focusing on the support of other PostgreSQL groups in Europe. PostgreSQL United States is a non profit for PostgreSQL in the United States. It focuses on Education, User Groups, and Advocacy. PostgreSQL is an affiliated project of Software in the Public Interest. Funds donated to PostgreSQL are used to sponsor general PostgreSQL efforts around the world. These funds are managed by the Funds Group. Please be aware that PostgreSQL contributions may or may not be tax exempt. For more information please refer to the party you are donating to and your tax professional. For information about how Recognised PostgreSQL Nonprofit Organisations (NPOs) become recognised, please review the guidelines here. If you have any questions about donations please contact either the PostgreSQL Funds Group or the respective organisation you are donating to."
