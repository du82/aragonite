["https://posthaven.com/help/post_by_email"]
title = "Posthaven is the safe place for all your posts forever"
description = "We'll never get acquired. We'll never shut down. You pay, we keep the lights on."
full_description = '''Just email post@posthaven.com. The subject of your email will be your new post's title and the email body will be the body of the post. By default, it'll be a public post on your primary site that also gets autoposted. You can edit which site is your primary here. Make sure to use the domain ending in ".posthaven.com" even if you have a custom domain mapped to your site. By default, post@posthaven.com will autopost and post it publicly. But there are special flags that you can use to change what is done. You can mix and match these options, e.g. to post to a draft on your blog foo.posthaven.com, you can email: draft@foo.posthaven.com. Yes, you can post images, video, audio, documents, and files of any kind. Upload limits are generally determined by your email provider and often around 10-25MB. By default images will be grouped into galleries except when they are inline in the body of the email and have text in-between them, but you can use a special address to disable galleries completely: To ensure none of your images (inline or otherwise) are grouped into galleries, send email to nogallery@posthaven.com We look for a few common signature delimeters but the best one to add is the most common: two dashes followed by a space on their own line. Like this: Yes, include #hashtags at the end of the subject of your post. For multi-word tags you can surround the tag in quotes preceded by a hash, e.g. #"Best Tag Ever". Separate hashtags with spaces to add more than one. The hashtags will be removed when we set the title of your post. So, for example, if your subject is: We use various techniques to ensure that other people are not able to post to your site. Unfortunately sometimes this means we are unable to verify an incoming email and have to ask you to verify manually. Most major email providers (e.g. Gmail, Yahoo, Outlook.com...) digitally sign their outgoing email for easy verification. If you are using a different service or otherwise having Posthaven prompt you to verify your email too often there are a couple options:'''
year_published = 2025
