title = "Posthaven is the safe place for all your posts forever"
description = "We'll never get acquired. We'll never shut down. You pay, we keep the lights on."
full_description = "A custom domain lets you use your own address, like yournamehere.com, or blog.yournamehere.com, with your Posthaven blog. They're available online at registrars like namecheap.com or iwantmyname and they cost about $10/year. If you're looking for custom domains to register and don't know what one to choose, there are lots of tools available for finding them: If your domain name is not a top level domain (e.g. not foobar.com) and does have a hostname (e.g. blog.foobar.com) then you can set up a CNAME to: posthaven.com Keep in mind that DNS is heavily cached so changes can take hours (or in some cases up to a day) to show up in your browser."
