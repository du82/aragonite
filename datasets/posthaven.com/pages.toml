["https://posthaven.com/help"]
title = "Posthaven is the safe place for all your posts forever"
description = "We'll never get acquired. We'll never shut down. You pay, we keep the lights on."
full_description = '''Maybe not soon. Not because we don't ever want to, but because we're focused on the main goal: to stick around as long as possible. There are lots of places to host that allow you total customization, but there are very few that you can count on to stick around. We want to be the clear well-lit place for your posts, and that means a lot of behind-the-scenes gardening that doesn't mean new shiny things every other day. No, we do not offer a free trial at this time, but we do have a money back guarantee. If you're not happy with Posthaven within the first month cancel your account (easily done on our dashboard) and let us know at help@posthaven.com and we'll issue a full refund for your original payment. It's easy, you can update your credit card, see payment receipts, or cancel your account on the Dashboard go to the Payments tab under "Edit your account". You can manage the email address(es) on your account on the "Emails" tab under "Edit your account" on the dashboard. Unfortunately we do not have a lot of insight into why credit card providers sometimes deny valid payment requests. The best option is to contact your provider and tell them charges from Posthaven.com are valid. You can do this now! Click on Settings for your blog, and then click the Theme tab. You can select from built-in themes, and for those of you who know HTML/CSS, you can customize your blog and write entire themes from scratch if you'd like. On the Posthaven dashboard navigate to the blog you want to change and click on the "Settings" button. Private blogs are password protected using a shared password. Only viewers who know the password can see the content of the blog, but once they have access they can see all the posts. You can set a blog to private on the dashboard by navigating to the blog and using the “Settings” button. Private posts can be posted on public sites and do not require a password but are posted at an obscure, very hard to guess URL and by default are not linked to anywhere else on the blog. So in practice a viewer needs to have a direct link to the post to see it. You can set a post to private by editing it in the web based post editor and checking the box under “Post Settings”. (New posts by email sent to private@posthaven.com will be created private.)'''
year_published = 2025
