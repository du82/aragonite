["https://postmarketos.org/blog/2023/02/26/v22.12.1-release"]
title = "postmarketOS // v22.12 SP1: The One With A Photo Of A Librem 5 Taking A Photo Of A Librem 5 Taking A Photo"
description = "Aiming for a 10 year life-cycle for smartphones"
full_description = "With the first service pack for v22.12 you can now reliably take photos of that melting snow chicken/monster in your garden with a Librem 5! Thanks to new Phosh related upgrades, it's also possible to use a bunch of cool widgets on the lockscreen. Enable them in Phosh Mobile Settings, lock your phone and swipe to the left. And there it is, your calendar or emergency contact information or whatever you have configured! And there's more, find the detailed changelog below.ContentsNew device:Samsung Galaxy Grand MaxPhosh:Upgrade Phosh from 0.22.0 to 0.24.0Upgrade Phoc from 0.21.1 to 0.24.0Upgrade phosh-mobile-settings 0.21.1 to 0.24.1Upgrade feedbackd 0.0.1 to 0.0.3Upgrade feedbackd-device-themes 0_git20220202 to 0.0.3OnePlus 6: fix no ringtone on incoming call, no sound on SMS (#1928)Plasma Mobile:Upgrade Plasma from 5.26.4 to 5.26.5Purism Librem5:Upgrade kernel from 6.1.1 to 6.2.0 (!3896)Fix unreliable back camera with millipixels (#1947)Enable MGLRU (!3850)Disable modem power management to make it more reliable (!3902)PINE64 PinePhone & PineTab:Upgrade kernel from 6.1.3 to 6.1.9 (!3858)Fix high CPU consumption (#1901)Upgrade U-Boot from 2022.07 to 2023.01 (!3806)Upgrade arm-trusted-firmware from 2.7.0 to 2.8.0 (!3806)Apply this fix by manually upgrading u-boot or installing from a new image that has SP1 includedEnable DRAM frequency stats drivers and governors (!3864)PINE64 PinePhonePro:Upgrade kernel from 6.1.0 to 6.1.10 (!3817)Changed default CPU frequency governor to schedutil (!3719)Replace postmarketos-base dependency on sudo with cmd:sudo (!3721)How to get itFind the most recent images at our download page. Existing users of the v22.12 release will receive this service pack automatically on their next system update. If you read this blog post right after it was published, it may take a bit until binary packages and new images are available.Thanks to everybody who made this possible, especially our amazing community members and upstream projects."
