["https://postmarketos.org/blog/2022/03/13/v21.12.3-release"]
title = "postmarketOS // v21.12 Service Pack 3"
description = "Aiming for a 10 year life-cycle for smartphones"
full_description = "Spring is almost here, in the northern hemisphere, and that means it is time for another monthly service pack update for postmarketOS v21.12! This update brings a few bug fixes and package upgrades from edge to the stable release.ContentsDino ~0.3 upgraded to the latest version in @mimi89999's feature/handy branch, with support for an adaptive UI.Squeekboard 1.16.0, with many new language translations. (Update 2022-03-14: reverted due to build problems, pmb#2110)Portfolio upgraded to 0.9.3, bringing support for mounting/managing external drives. Useful for using usb drives with a docked device, or SD cards on devices that support those.Fixed alarms not waking devices from suspend (pma#1189), the daemon (waked) responsible for scheduling the wake event was not set to start by default.SDM845 Linux kernel upgraded to 5.16.12MSM8996 Linux kernel upgraded to 5.16.12N900 Linux kernel upgraded to 5.15.25PinePhone keyboard kernel driver is now built as module (pma#1444)How to get itFind the most recent images at our download page. Existing users of the v21.12 release will receive this service pack automatically on their next system update. If you read this blog post right after it was published, it may take a bit until binary packages are available.Thanks to everybody who made this possible, especially our amazing community members and upstream projects.CommentsMastodonLemmy"
