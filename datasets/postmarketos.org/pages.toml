["https://postmarketos.org/blog/2021/03/31/v21.03-release"]
title = "postmarketOS // Second Beta Release: v21.03"
description = "Aiming for a 10 year life-cycle for smartphones"
full_description = '''After months of hard work from our amazing community, we are proud to announce the second beta release of postmarketOS, based on Alpine Linux 3.13. The amount of supported devices has been increased from one (just the PinePhone in v20.05) to no less than eleven - and all of them run a (close to) mainline kernel!Each device is able to run modern phone shells Phosh, Plasma Mobile and Sxmo. The Nokia N900 is an exception of course, for that one we recommend running i3.As mentioned in the header of the blog post, in its current state, postmarketOS is for Linux enthusiasts. Expect bugs and help out with fixing them. It's a long hard road to an alternative smartphone OS that doesn't track its users, gives back control and makes a long lifetime feasible. But we are making steady progress, and when compared to when we started out, a huge community has been established - not only within postmarketOS, but also a whole ecosystem of other projects that share the same goal and work together. Release versions of postmarketOS are best for stability. For the over 250 (!) booting devices in the testing category and rolling release thrills, use postmarketOS edge.Supported devicesASUS MeMo Pad 7BQ Aquaris X5Motorola Moto G4 PlayNokia N900PINE64 PinePhonePINE64 PineTabPurism Librem 5Samsung Galaxy A3 (2015)Samsung Galaxy A5 (2015)Samsung Galaxy S4 Mini Value EditionWileyfox SwiftHighlightsAll user interfaces have been upgraded to their latest versions. Sxmo developers even made sure to create their Sxmo 1.4.0 version right in time to be integrated into v21.03!For all devices, pre-built images are provided from our shiny new download page. There are two types of images, the regular images and the graphical installer ones. Regular images are provided for all devices, the graphical installer only for the PinePhone, PineTab and Librem 5 so far.The installer images allow to encrypt the device, configure SSH and a user password. For the PinePhone and PineTab, which are able to boot from SD card, it even allows to install from the SD card to the eMMC. Upgrading the PinePhone from v20.05If you have the first beta, postmarketOS v20.05, installed on your PinePhone's internal storage (e.g. because you bought the postmarketOS community edition), make a backup of your home directory with rsync over SSH. Download a postmarketOS v21.03 installer image and flash it to an SD card as explained in the wiki. When it asks for the installation target, select "Internal (eMMC)" to overwrite your previous installation. When the installation is done, remove the SD card and then postmarketOS v21.03 will boot up. Use rsync again to restore your settings.More development newsThe new release includes all but the most recent improvements that were made to postmarketOS edge. Check out the postmarketOS podcast where we discuss these in detail and also have fun with less technical topics like the story of how the new header image of this website was created from actual stone and not a 3D rendering :DCommentsMastodonLemmyHacker News'''
