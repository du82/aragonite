["https://postmarketos.org/blog/2022/07/17/v22.06.1-release"]
title = "postmarketOS // v22.06 SP1: The One Where We Added The Pro & E7"
description = "Aiming for a 10 year life-cycle for smartphones"
full_description = '''The first service pack for the v22.06 release is here! It adds two new devices to the stable release that did not make it into the original release of v22.06. It also has a few nice stability improvements and adds the new Megapixels and postprocessd changes for improved picture quality on the PinePhone. A photo of the PPP running postmarketOS v22.06. Shot with Megapixels and postprocessd. ContentsPINE64 PinePhone Pro has been added, with support for the postmarketOS installer. Just like with the OG PinePhone, the installer allows using encryption and installing from SD to eMMC. Find installation instructions in the updated wiki page as always.Samsung Galaxy E7 has been backported to the stable release too. Again, reading the device's wiki page is a good idea.Modem udev rules have been added to improve the stability when using the Biktorgj firmware on the PinePhone modemMegapixels 1.5.2 is now available together with the updated version of postprocessd for improved picture quality and faster postprocessing on the supported Megapixels devices. To make use of it, run "apk add postprocessd" in existing installations. New installation images will have it installed by default. See the video Megapixels and postprocessd improvements (PeerTube, YouTube) for details.osk-sdl 0.67 powers the device off when pressing the power button (in case you don't feel like unlocking your phone on boot right now), and fixes the issues with slow input when using an external keyboard. UPDATE 2022-07-20: We've gotten two reports that input is broken with this osk-sdl version on the PinePhone; although we can't reproduce it yet, the osk-sdl update has been reverted. Details and recovery instructions in pma#1618.How to get itFind the most recent images at our download page. Existing users of the v22.06 release will receive this service pack automatically on their next system update. If you read this blog post right after it was published, it may take a bit until binary packages and new images are available.Thanks to everybody who made this possible, especially our amazing community members and upstream projects.'''
