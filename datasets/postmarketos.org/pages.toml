["https://postmarketos.org/events"]
title = "postmarketOS // Events"
description = "Aiming for a 10 year life-cycle for smartphones"
full_description = "This page lists various conferences where we have a stand, give talks or just hang out. Meet us there if you want to talk to postmarketOS developers or try it out on demo devices!Join the #events:postmarketos.org matrix chat for discussing events.List of events20252025-02-21 to 22: Open Source Conference 2025 Tokyo/Spring (Tokyo, JP)2025-02-01 to 02: FOSDEM 2025 (Brussels, BE)20242024-12-27 to 30: 38C3 (Hamburg, DE)2024-11-08 to 09: SeaGL 2024 (Seattle, US)2024-10-26: Open Source Conference 2024 Tokyo/Fall (Tokyo, JP)2024-09-25 to 26: All Systems Go! 2024 (Berlin, DE)2024-09-07 to 12: Akademy 2024 (Würzburg, DE)2024-08-17 to 18: FrOSCon 2024 (St. Augustin, DE)2024-08-01 to 04: FOSSY 2024 (Portland, US)2024-07-19 to 24: GUADEC 2024 (Denver, US / Berlin, DE)2024-02-03 to 04: FOSDEM 2024 (Brussels, BE)FAQWhere can I learn more about what is happening at the events?As events are happening, we usually post about it on Mastodon. Sometimes we also record a podcast at or after events, e.g. #38 FOSDEM 2024 Special.Can I represent postmarketOS at an event?Yes if you are a Trusted Contributor or Core Contributor (see team). Otherwise please get in contact with the team, we want to make sure that there is a common understanding of our culture, valuing collaboration over competition, praising and not bashing other mobile linux distros, recognizing value in upstreaming fixes, etc.When representing postmarketOS at an event, please submit a patch to the postmarketos.org repository to add the event to this page."
