["https://postmarketos.org/blog/2021/10/10/v21.06.3-release"]
title = "postmarketOS // Release: v21.06 Service Pack 3"
description = "Aiming for a 10 year life-cycle for smartphones"
full_description = "New month, new service pack! As always, new features and fixes have been backported from postmarketOS edge to the stable version after tough testing by our tough community members on edge.OverviewSxmo 1.5.2: as usually we've coordinated with the Sxmo team on what should be in the service pack, and thanks to them, got Sxmo 1.5.2 in. This is the tried and tested 1.5.1 version from edge, with just minor extra fixes on top.Tweaks 0.8.1 has a new sound panel, better notch support, some bugfixes for the background daemon and fixed touch navigation on the mobile layout.linux-postmarketos-qcom-sdm845 5.14 improves the OnePlus 6 and 6T ports: among other improvements it ships initial modem support and more GPU performance.ModemManager 1.18.2 was required for modem support in the SDM845 kernel. As nice benefit it should improve call and SMS handling.NetworkManager 1.32.10 was backported to fix hotspot functionality while having the firewall enabled.postmarketos-theme can now be installed to get GTK 3 and GTK 4 postmarketOS themes (see photo).DetailsModemManagerThis release backports the calling stack from edge. The new release of ModemManager brings a lot of improvements for the devices supported in community and will help a lot with the stability of the modem when the PinePhone awakes from deep sleep. This release also adds support for the modem in Qualcomm Snapdragon 845 devices. The full calling functionality on those devices is not working yet but it means that at least mobile data and SMS is usable.postmarketos-themeThis release also includes the new postmarketOS theme as an optional package. This currently contains a GTK 3 and GTK 4 theme which is based on Adwaita but replaces the standard blue highlights in the theme with postmarketOS green. There's also the oled and paper variant of the theme that are completely black and completely white. This will mainly look great on oled displays, as the name suggests. It's possible to try this on your own device now by installing the postmarketos-theme package and selecting one of the four themes in postmarketOS tweaks.TweakspostmarketOS tweaks also has a new release in stable now that contains a series of fixes from community members. One of the most visible changes is the new sound panel that allows changing the GTK sound theme but also allows making a custom theme by manually specifying the audio files for every event. Another change is the notch tweaks for Phosh that build on top of the CSS improvements of the last update. This allows moving Phosh UI elements over to make them not appear under the notch of modern smartphones.How to get itFind the most recent images at our download page. Existing users of the v21.06 release will receive this service pack automatically on their next system update.Thanks to everybody who made this possible, especially our amazing community members and upstream projects.Known issuesSamsung Galaxy S4 Mini Value Edition (samsung-serranove) users have experienced a regression with the new Modemmanager version. Details and workaround in pma#1274.CommentsMastodonLemmyHN"
year_published = 2021
clearnet = "https://postmarketos.org/blog/2021/10/10/v21.06.3-release"
