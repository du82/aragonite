["https://postmarketos.org/blog/2023/04/10/v22.12.2-release"]
title = "postmarketOS // v22.12 SP2: The One With The Nice Pull-Down Menu"
description = "Aiming for a 10 year life-cycle for smartphones"
full_description = "Phosh upstream did this really nice Quick Settings menu style refresh that we are happy to ship with this service pack, among other improvements. Without a long introduction, enjoy the full list of changes:ContentsPhosh:Upgrade Phosh from 0.24.0 to 0.26.0Upgrade Phoc from 0.24.0 to 0.26.0Upgrade phosh-mobile-settings 0.24.1 to 0.26.0Fix Waydroid: it was broken for several devices since the upstream image had been updated to LineageOS 18 (Android 11) and required new kernel options (!3901, !3975)Tuba:Tuba is a GTK4 Fediverse client, forked from the unmaintained tootle.Add version 0.2.0mobile-config-firefox: upgrade from 3.2.0 to 4.0.0Millipixels:Millipixels is a fork of the Megapixels camera application that works with the Librem 5.Add version 0.21.0Upgrade dependency libcamera from 0.0.1 to 0.0.4Purism Librem 5Upgrade kernel from 6.2.0 to 6.2.8 (!3986)Upgrade librem5-base from 54 to 58 (!3989)PINE64 PinePhone Pro:Upgrade kernel from 6.1.10 to 6.2.7 (!3967)Enable Lazy RCU scheduler (!3928)Fix SD->eMMC installer prompt (!3978, related wiki notes)Samsung Galaxy S III:Upgrade exynos4 kernel from 6.0.2 to 6.1.0 (!3717)Samsung Galaxy Tab 2 (7 inch, 10.1 inch):Upgrade omap kernel from 6.1.0 to 6.2.1 (!3911)Xiaomi Mi Note 2:Upgrade qcom-msm8996 kernel from 6.0.2 to 6.1.14 (!3910)PINE64 Pinebook Pro, RockPro 64:Enable kexec (!3999)PINE64 PinePhone, PineTab:Enable FSCACHE and NFS caching (!3979)Notes on SP1As we found out later, the fix for high CPU consumption on the PinePhone (original, not Pro) and PineTab mentioned in SP1 only works if postmarketOS is installed to the SD card, not it if is installed to the eMMC. This is being investigated in #1946. If you are affected, consider installing to SD card in the meantime or consider contributing towards getting it fixed.Careful readers will notice that it would have more sense to include Millipixels in SP1 already, as we had backported related improvements in the Librem 5 packaging. We missed it, but it is included here instead.How to get itFind the most recent images at our download page. Existing users of the v22.12 release will receive this service pack automatically on their next system update. If you read this blog post right after it was published, it may take a bit until binary packages and new images are available.Thanks to everybody who made this possible, especially our amazing community members and upstream projects."
