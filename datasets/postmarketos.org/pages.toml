["https://postmarketos.org/blog/2023/09/10/v23.06-sp1"]
title = "postmarketOS // v23.06 SP1: Through Staging"
description = "Aiming for a 10 year life-cycle for smartphones"
full_description = '''Yes, it is still possible to receive up-to-date software for the Nokia N900 in 2023. You can install postmarketOS v23.06 SP1 on it and upcycle it, possibly as SSH client on-the-go with its glorious hardware keyboard. Or use it as small webserver for a home project with built-in uninterruptible power supply, as mentioned in the c't magazine article in the picture. This service pack brings quite a few improvements for the N900, such as a power button action prompt that shows up when you press the power button and an improved terminal with a scrollbar."Through Staging" is the title of the service pack, because for the first time, it was available in a staging repository before the release. This allowed testing it without building packages locally beforehand. If you would like to get early access to future service packs, consider joining the testing team.ContentsAll devices:Phosh upgrade from 0.27.0 to 0.30.0 (phosh, phoc, squeekboard, phosh-mobile-settings)temp/gtk+3.0: fix Phosh boot splash (!4332)temp/gtk+3.0: upgrade to 3.24.37-2pureos3 (!4261)main/postmarketos-base-ui: depend on tzdata (!4175)main/postmarketos-base: migrate wrong timezone configurations (!4308) (*)cross/crossdirect: improve rust handling (!4234)linux-postmarketos-omap: upgrade to 6.4.3 (!4253) (*)linux-postmarketos-exynos4: upgrade to 6.4.2 (!4241) (*)linux-postmarketos-qcom-sm6350: upgrade to 6.4.2 (!4236) (*)main/mobile-config-firefox: upgrade to 4.0.3 (!4232) (*)temp/gnome-shell-mobile: add desktop-file-utils dependency (!4210) (*)main/postmarketos-mkinitfs-hook-*: show Loading splash once done (!4212) (*)Nokia N900:Restore modem (!4320, !4282)Let user choose power button action (!4312)Switch to urxvt terminal (!4312)Increase terminal and i3 font sizes (!4363)Fix hwkbd on unl0kr (!4320)Fix volume keys on N900 (!4228)Use elogind for suspend (!4312)Drop broken conky default config (!4309)Do not open terminal for nagbar actions (!4320)Re-add twl for basic soc reset (!4321) (*)Disable twl off idle features (!4317) (*)Block non-critical modules (!4227) (*)PINE64 PineBook Pro:Enable s2idle in elogind (!4194)Purism Librem 5:Kernel upgrade to 6.4.5pureos1 (!4355) (*)(*): These fixes were already backported to v23.06 before releasing SP1.NotesFor users upgrading from before v23.06 SP1: some of the N900 improvements require manually copying the defaults from /etc/skel to your home dir.Running out of space after installing v23.06 on Android devices is a known bug (#2235). Read the issue for workarounds, a fix is being developed.How to get itFind the most recent images at our download page. Existing users of the v23.06 release will receive this service pack automatically on their next system update. If you read this blog post right after it was published, it may take a bit until binary packages and new images are available.Thanks to everybody who made this possible, especially our amazing community members and upstream projects.'''
