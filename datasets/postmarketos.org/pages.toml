title = "postmarketOS // Core Contributors"
description = "Aiming for a 10 year life-cycle for smartphones"
full_description = "Bart Ribbers (PureTryOut)🏢 What am I doing?General package maintenanceMaintaining KDE Plasma and everything related to it in pmOS/Alpine, including general desktop stuff like PipeWire🤔 What am I thinking about?Building a private and trustworthy operating system for everyone to use no matter their preferences😍 What do I enjoy?Seeing how the Linux desktop modernizes and improves and applying such improvements to my own installations and systemsGoing to open-source related conferences like FOSDEM and KDE Akademy to meet like-minded people💬 Where can you find me? @PureTryOut @PureTryOut:matrix.org🌐 https://fam-ribbers.comCaleb Connolly (calebccff)🏢 What am I doing?Maintaining Snapdragon 845 devicesU-Boot development for Qualcomm platformsDevice bringup and kernel developmentImproving tooling and debugging featuresBuilding CI 😵‍💫Occasionally funnyposting on the @postmarketOS fediverse account🤔 What am I thinking about?Developer experience and toolingCommunity buildingDoing immutability without making development and tinkering harderWhatever this week's annoying driver bug is😍 What do I enjoy?Hacking on hardware bringupGetting new features working and having people actually be able to use themBeing part of such a fun community of folks building all kinds of things💬 Where can you find me? @calebccff @cas@social.treehouse.systems @caleb:postmarketos.orgClayton Craft (craftyguy)🏢 What am I doing?Working full time on postmarketOSFostering the amazing communityHelping to maintain a few things around hereTrying to be a zero🤔 What am I thinking about?Can we make something I can give to my favorite humans, without feeling gross about it?Let's put postmarketOS on everything! Laptops, phones, desktops, tablets, smart watches, TVs, …Does anyone on chat have an interesting problem?😍 What do I enjoy?Helping othersFixing stuffFinishing stuffLearning new thingsFree software, of course💬 Where can you find me? @craftyguy @craftyguy:postmarketos.org @craftyguy@freeradical.zoneLuca Weiss (z3ntu)🏢 What am I doing?Maintaining infrastructure, like the postmarketOS server and everything that entailsMainline kernel development and maintenance for many SoCs (msm8226, msm8974, sm6350, sc7280, and sometimes msm8953)Adding eSIM support via lpac and building a mobile-friendly UI to manage them.Maintaining 100+ packages in Alpine Linux🤔 What am I thinking about?Expanding my knowledge sharing with longer-form blog posts and videos like the mainlining.dev blogImproving the user experience around installing postmarketOS from clarifying installation instructions to improving the installer and webflasher😍 What do I enjoy?Improving device functionality in upstream: upstreaming existing code and adding new functionality💬 Where can you find me? @z3ntu @z3ntu@fosstodon.org @luca:z3ntu.xyz🌐 https://lucaweiss.eu/Oliver Smith (ollieparanoid)🏢 What am I doing?Started postmarketOS in 2016, published it in 2017Hacking, mostly on pmbootstrap, build.postmarketos.org, and pmaportsMaking postmarketOS releasesReviewing code and helping with issues as I find time :)Co-maintaining the infrastructureCreative things:(Co-)writing blog postsRunning the postmarketOS podcastMaking shirts and stickersVarious organizational tasks🤔 What am I thinking about?Getting postmarketOS ready for non-experts (while still keeping it fun for hackers!)Building a friendly and respectful communityContributing towards a healthy, wider Linux (Mobile) ecosystemHow to not be a part of the attention economy and helping towards fixing the climate crisis😍 What do I enjoy?Running postmarketOS with mainline Linux on my phone and laptopGetting into a flow state while coding or doing a creative taskMeeting people through conferences, Jitsi calls, or the podcast and talking about free softwareSeeing what amazing things people are doing with postmarketOS (it is incredibly inspiring!)💬 Where can you find me? @ollieparanoid @ollieparanoid@fosstodon.org @ollieparanoid:postmarketos.orgPablo Correa Gómez (pabloyoyoista)🏢 What am I doing?Coordinating and planning around the project prioritiesSearching and applying for grants, including helping others with itMeeting different people in the ecosystem, networking and looking for opportunities for postmarketOSMaintaining GNOME in alpine and in postmarketOS, including the social aspect of collaborating with their community, and improving on integration🤔 What am I thinking about?How to organically grow and finance postmarketOS as a pioneer of Linux on Mobile, including governance, legal, economical, and community affairsHow to build sustaining, effective, and long-term relationships with related FOSS projects😍 What do I enjoy?Talking with people about social issues around FOSS and interactions with communitiesThe usually-abandoned business side of FOSSDebugging issues and fixing compatibility problems between upstreams and us💬 Where can you find me?📧 pabloyoyoista@postmarketos.org @pabloyoyoista @pabloyoyoista@social.treehouse.systems @pabloyoyoista:matrix.orgStefan Hansson (Newbyte)🏢 What am I doing?Maintaining Phosh and GNOME in AlpineTriaging and resolving reported issues — as much as I can at least! 😅Other improvements as I get inspired🤔 What am I thinking about?How to turn postmarketOS into a reliable production system😍 What do I enjoy?Writing code!Fixing usability problems that bug me in pmbootstrapLow-level kernel development — Just starting out with this!Fixing bugs I encounter in other software projects💬 Where can you find me? @Newbyte @newbyte@mastodon.nu @newbyte:matrix.org"
