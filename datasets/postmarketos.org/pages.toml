["https://postmarketos.org/edge/2021/06/26/aport-util-linux"]
title = "postmarketOS // util-linux from Alpine Linux aports installs binaries in wrong location"
description = "Aiming for a 10 year life-cycle for smartphones"
full_description = "The util-linux-misc-2.37-1 in Alpine Linux aports installs binaries this package provides (e.g. losetup, agetty) into the wrong location on the rootfs.This breaks many pmbootstrap commands that need the non-busybox version of these tools:$ pmbootstrap -y zap && yes 1|pmbootstrap -y install --fde (3714044) [19:39:39] (native) % losetup --json --list losetup: unrecognized option: json BusyBox v1.33.1 () multi-call binary. Usage: losetup [-rP] [-o OFS] {-f|LOOPDEV} FILE: associate loop devices ... The util-linux-misc-2.37-2 update fixes this problem.If this broken package was installed on an existing pmOS installation, there may be unintended consequences. Please stop by the pmOS chat or file an issue on our gitlab if you experience problems from this and need help.The local chroots from pmbootstrap will also be broken if this package was installed. This means that zap will not work. You can either remove the pmbootstrap working directory, or upgrade util-linux and then run zap with:$ pmbootstrap chroot -- apk update $ pmbootstrap chroot -- apk upgrade -a $ pmbootstrap zap Also see:aports!22630"
year_published = 2021
clearnet = "https://postmarketos.org/edge/2021/06/26/aport-util-linux"
