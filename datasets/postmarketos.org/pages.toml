["https://postmarketos.org/edge/2021/09/03/new-mkinitfs"]
title = "postmarketOS // Important updates to initramfs creation and boot files"
description = "Aiming for a 10 year life-cycle for smartphones"
full_description = '''pmbootstrap 1.37.0 and postmarketos-mkinitfs >= 1.0.0 will include significant changes to the way that boot files (kernel, initramfs, boot.img) are created and installed on postmarketOS:Boot files no longer have the "flavor" appended to the file namesThe "flavor" is a string that denotes which kernel variant/package the file is from, and was originally included because there was some idea of supporting multiple installed kernel variants at once. This feature was never really fully implemented/supported in pmOS, so it was decided to simplify file naming by removing it from the file names. As an example, /boot/vmlinuz-postmarketos-allwinner is now named /boot/vmlinuz.New tool for generating the initramfs/-extra, and auxiliary (boot.img, etc) filesThe shell script for finalizing boot files (e.g. creating boot.img, appending dtb to the kernel image, etc) as been split off into a separate repository/project, to allow other Linux distributions to easily package and utilize it. The new project is boot-deploy.The existing mkinitfs tool as been rewritten to support, and together with boot-deploy it supports:Verifying the creation of boot files, and installing them atomically to /bootFaster initramfs/-extras creationUsers on Edge will receive an upgrade starting today for postmarketos-mkinitfs that bring these changes.While we don't anticipate any issues, and have spent a lot of time testing these changes, there is a possibility that things may break. If you experience any problems, please file an issue on gitlab, or reach out to us on chatRelated:pmb!2093pma!2426postmarketos-mkinitfsboot-deploy'''
year_published = 2021
clearnet = "https://postmarketos.org/edge/2021/09/03/new-mkinitfs"
tags = ['"flavor"', "appended", "auxiliary", "boot", "creation", "file", "files", "filesseptember", "generating", "important"]
