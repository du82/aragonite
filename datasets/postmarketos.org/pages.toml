hrineMaidenOfParadise @wonderfulShrineMaidenOfParadise in #msm8916-mainline:postmarketos.orgRobert Eckelmann (longnoserob)🏢 What am I doing?Supporting users in chat and GitLab issuesReviewing merge requestsTesting changes (mostly on nvidia-tegra-armv7 and qcom-sdm845 devices)🤔 What am I thinking about?Improving the getting started phase for new usersImproving the feedback from the users to the developers (mostly by triaging issues)😍 What do I enjoy?Happy users after successfully troubleshooting an issueGetting new features working and shared with othersUsing older hardware with the latest software💬 Where can you find me? @longnoserob @longnoserob@famichiki.jp @longnoserob:matrix.org"
