["https://postmarketos.org/blog/2021/11/08/v21.06.4-release"]
title = "postmarketOS // Release: v21.06 Service Pack 4"
description = "Aiming for a 10 year life-cycle for smartphones"
full_description = "A fresh new service pack bringing some nice features from edge to stable. This is the last service pack in the v21.06 release cycle, we plan to publish a new postmarketOS v21.12 release in December, based on the upcoming Alpine 3.15 and a soon-to-be-created new branch from postmarketOS edge.ContentsPhosh 0.14.0 brings various improvements, most noteworthy launch splash support and seek buttons for the media player widget.Numberstation 1.0.0 is the 2FA token app shown in the photo. With a newly added import/export feature to quickly backup and restore keys and move them across devices, as well as the newly added HOTP support, it is now considered feature complete. Backup files are accepted in the format of one otpauth:// URL per line. For HOTP support, keys are based on counters instead of time. UI changes were made to not increment this counter by accident.eg25-manager 0.4.1, the helper daemon for the EG25 modem in the PinePhone, has gotten GNSS assistance support and lots of small general improvements compared to the version we had previously packaged on the stable branch.Pixman is still at the latest official 0.40.0 version from April 2020 (apparently upstream doesn't release that often). However we cherry picked the recently merged patch to use NEON instructions on ARM64 devices after having it in Alpine edge for a while. Pixman is a low level CPU compositing and drawing library that is used in lots of applications, therefore this makes all aarch64 phones a bit more responsive.How to get itFind the most recent images at our download page. Existing users of the v21.06 release will receive this service pack automatically on their next system update. If you read this blog post right after it was published, it may take a bit until binary packages are available.Thanks to everybody who made this possible, especially our amazing community members and upstream projects.CommentsMastodonLemmyHN"
