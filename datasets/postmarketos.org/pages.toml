["https://postmarketos.org/blog/2023/06/07/v23.06-release"]
title = "postmarketOS // v23.06: From the GNOME Mobile 2023 Hackfest"
description = "Aiming for a 10 year life-cycle for smartphones"
full_description = '''After FOSDEM 2023 a few people found themselves hacking collaboratively on postmarketOS in a local cafe in Brussels. It was so productive and fun that we figured doing a proper hackathon this year would be great. While we were planning, we realized that also a GNOME Mobile Hackfest would take place soon — so we just did a postmarketOS hackathon right before GNOME Mobile's event. In fact, this post and the release are brought to you right from the Hackfest!v23.06, like previous releases, is geared mainly towards Linux enthusiasts as explained in our article state of postmarketOS.Supported devicesThis stable release is available for the following 31 devices:ASUS MeMo Pad 7Arrow DragonBoard 410cBQ Aquaris X5Fairphone 4Lenovo A6000Lenovo A6010Motorola Moto G4 PlayNokia N900ODROID HC2OnePlus 6OnePlus 6TPINE64 PineBook ProPINE64 PinePhonePINE64 PinePhone ProPINE64 RockPro64Purism Librem 5SHIFT6mqSamsung Galaxy A3 (2015)Samsung Galaxy A5 (2015)Samsung Galaxy E7Samsung Galaxy Grand MaxSamsung Galaxy S III (GT-I9300 and SHW-M440S)Samsung Galaxy S4 Mini Value EditionSamsung Galaxy Tab 2 7.0"Samsung Galaxy Tab 2 10.1"Samsung Galaxy Tab A 8.0Samsung Galaxy Tab A 9.7Wileyfox SwiftXiaomi Mi Note 2Xiaomi Pocophone F1Xiaomi Redmi 2The list is the same as in the previous v22.12 release (+ SP1), except that the PineTab has been removed. The PineTab can still be used with postmarketOS edge. If you are interested in getting it back to the stable release, the first step would be you stepping up to maintain the port - let us know in the issues or chat.HighlightsFor the first time, this stable release includes GNOME Mobile! If you haven't followed the amazing progress that was made to bring GNOME to phones and tablets, see Towards GNOME Shell on Mobile, GNOME Shell on mobile: An update and GNOME Mobile Show & Tell (video).Lots of improvements to GNOME SoftwareTranslations (lang) is installed by default now, and the default locale is en_US.UTF-8 instead of C.UTF-8USB tethering is now functional (pma!3816)Minimum password length in installer images has been changed from 8 to 6PineBook Pro: backlight control and audio works by defaultUser InterfacesGNOME Shell on Mobile 44_git20230405 newPhosh 0.27 replaces version 0.26 from v22.12 SP2. The document viewer Evince has been added to the apps that get installed by default.Plasma 5.27.5 replaces version 5.26.5 from v22.12.Sxmo 1.14.0 replaces version 1.12.0 from v22.12.Testing and known issuesA huge thanks to everyone at the newly formed Testing Team, who helped greatly in finding and getting a number of regressions and bugs fixed right before finalizing the release!Notable regressions:Sxmo on Pocophone F1: screen keeps waking up (#2160)A3/A5/A7/E5/E7/Grand Max: audio regressions, e.g. speaker is not set to mono (#1788)Nokia N900: does not boot from pre-built image (workaround: install with pmbootstrap) (#2161)How To Get ItNew installationFor new installs, see download and make sure to read the wiki page for your device.UpgradeFor existing installations, see the upgrade to a newer postmarketOS release wiki article. Note that you still need to make sure to have a stable network connection when performing the release upgrade (there were plans to make it more resilient, but it wasn't possible to do it in time for the release).Manual steps after upgrading to this release:If you have gnome-software installed, make sure to also install gnome-software-plugin-apkLibrem 5: to make the camera work, remove megapixels and install millipixelsConsider installing lang for translationsConsider removing postmarketos-hidden-desktop-entries (more information)A community effortA big thanks to everybody who contributed to postmarketOS, to Alpine or to any of the numerous upstream components we use — without you this would not be possible!'''
year_published = 2023
