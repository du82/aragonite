["https://postmarketos.org/source-code"]
title = "postmarketOS // Source Code"
description = "Aiming for a 10 year life-cycle for smartphones"
full_description = "git repositoriesFind postmarketOS related git repositories at https://gitlab.postmarketos.org. Here are the most important ones:pmaports holds all package build recipes. It is similar to Alpine's aports. The various APKBUILDs point to upstream source code for all packages.pmbootstrap is the sophisticated chroot/build/flash tool to develop and install postmarketOS. Targeted at power users and developers, for the easy way to install postmarketOS, see /install.Linux kernelThe SoC Communities page lists where SoC specific kernel patches are developed. Find which kernel (with source) is exactly used by which device by looking at the dependencies of the device- packages in pmaports.IssuesReport postmarketOS specific bugs in the pmaports repository, unless they clearly belong into another project (e.g. pmbootstrap). Upstream bugs (Alpine, Phosh, Plasma Mobile, ...) should be reported in upstream projects. Read how to report issues for details.Binary packagesIf you are looking for the source code, you might also be interested in how the packages from pmaports get transformed into the official binary packages. This happens transparently on build.postmarketos.org (bpo). Whenever a git commit gets pushed/merged to pmaports, bpo calculates which packages need to be rebuilt, and then builds the missing packages with pmbootstrap on builds.sr.ht. All build logs are publicly visible (and can even be followed while the packages are building).Built packages can be accessed from the official mirrors, and one can search through them on pkgs.postmarketos.org (just like pkgs.alpinelinux.org)."
