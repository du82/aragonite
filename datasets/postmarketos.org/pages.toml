["https://postmarketos.org/edge/2021/04/15/pipewire-pulse"]
title = "postmarketOS // pipewire-pulse used instead of pulseaudio in new pmbootstrap installs"
description = "Aiming for a 10 year life-cycle for smartphones"
full_description = '''When building postmarketOS images with the Phosh UI, pipewire-pulse gets installed instead of pulseaudio. This results in broken audio.Existing installs and pre-built images are not affected.More information: #1067UPDATE 2021-04-16: still working on a fix, and current images from edge are affected. Run this as workaround, followed by reboot:$ sudo apk update $ sudo apk add !pipewire-pulse (1/7) Purging pipewire-pulse (0.3.25-r0) (2/7) Installing pulseaudio-alsa (14.2-r5) (3/7) Installing webrtc-audio-processing (0.3.1-r0) (4/7) Installing pulseaudio (14.2-r5) Executing pulseaudio-14.2-r5.post-install (5/7) Installing pulseaudio-bluez (14.2-r5) (6/7) Installing alsa-utils-openrc (1.2.4-r0) (7/7) Installing pulseaudio-openrc (14.2-r5) Executing busybox-1.33.0-r6.trigger Executing dbus-1.12.20-r2.trigger Executing glib-2.68.1-r0.trigger OK: 663 MiB in 378 packages EDIT 2022-01-16: fixed the title, it's "instead of pulseaudio", not "instead of pipewire". This seems to happen again, created new issue #1386.'''
