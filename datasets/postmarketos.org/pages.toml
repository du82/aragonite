["https://postmarketos.org/blog/2024/01/28/how-to-become-tc2"]
title = "postmarketOS // How to become a Trusted Contributor, part 2"
description = "Aiming for a 10 year life-cycle for smartphones"
full_description = '''After our How to become a Trusted Contributor blog post was received with great enthusiasm by the community (and already have two new TCs since, shout out to @travmurav and @f_), we thought that it would be a great idea to expand its scope. We know that people have been contributing to postmarketOS in many ways, not just via code reviews and submitting patches. So if you have been contributing to postmarketOS for the past six months or longer and don't fancy yourself a developer, there is now a path for you to become a Trusted Contributor too!Some examples of what types of contributions can qualify you as a Trusted Contributor include:making accessibility improvementssupporting others in our chat roomssupporting others in our issue trackerscreating artwork or other promotional materialswriting blog posts for postmarketOS.org (the main and/or "edge" blogs)podcast / audio editingIf you're curious how to get started with any of those things today, in hopes of applying to be a TC later, please do not hesitate to reach out to us in chat! If you find other tasks that we didn't think of, which would also have a good impact on the project or our community, feel free to reach out as well.Trusted Contributors enjoy street cred (public contributions to a large FOSS project can look good on a resume!) and their own @postmarketos.org email address.The process to apply is largely the same as what we detailed previously: file a new confidential issue in our application repo, find existing team members to endorse you, and list out your contributions and achievements to support your application.We also got a bit of behind-the-scenes audio for you in the podcast. That's it, thanks for reading this blog post!'''
