["https://postmarketos.org/blog/2022/04/18/v21.12.4-release"]
title = "postmarketOS // v21.12 Service Pack 4"
description = "Aiming for a 10 year life-cycle for smartphones"
full_description = '''Look what the easter bunny dragged in, the fourth service pack for the v21.12 stable release. This time we got:ContentsSamsung Galaxy Tab 2 7.0" has been backported. This device already was in the community category when v21.12 was branched from edge (!2561). However it wasn't included in the release yet as it didn't work without proprietary PowerVR GPU drivers (and would have needed hacks like a forked wlroots...). But now it's all figured out, the hackish GPU acceleration was dropped in favor of using proper mainline.ODROID HC2 kernel upgrade to 5.16.14. Now running on mainline with zero patches.Nokia N900 Linux kernel upgrade to 5.15.31.SDM845 Linux kernel upgrade to 5.17.0, bringing call audio support to the Xiaomi PocoPhone F1 (!2982).PINE64 PinePhone: set lima.sched_timeout_ms=2000 to work around UI freezing under heavy load, with endless flickering of the last two frames (#805). While this is a great usability improvement (who likes to have their screen lock up, right?), it's masking whatever problems cause the rendering to take up to two full seconds to draw a frame. Therefore we only applied it on stable and not on edge, where we would rather find a proper fix. Help with figuring this out is appreciated, more information can be found in the issue.postmarketOS Tweaks 0.11 fixes the custom audio profile settings and makes the app look a bit more modern.Powersupply 0.6 shows battery information from the PinePhone keyboard case.How to get itFind the most recent images at our download page. Existing users of the v21.12 release will receive this service pack automatically on their next system update. If you read this blog post right after it was published, it may take a bit until binary packages are available.Thanks to everybody who made this possible, especially our amazing community members and upstream projects.'''
