full_description = '''⚠️⚠️⚠️ Make sure you read state of postmarketOS before installing postmarketOS. ⚠️⚠️⚠️ Release imagesThe latest stable release is postmarketOS v24.12.Development is done in postmarketOS edge (keep an eye on the breakage reports). Note that we just merged systemd into edge!The community category is for devices that are well maintained but may lack some important features. Refer to the devices page for details.The testing category is for devices that may have limited functionality and may not be well maintained.All images below use (close to) mainline kernels.How to installSee the Installation guide.Join #postmarketOS on Matrix/IRC if you have questions!After you installDefault username: userDefault password: 147147Switch to a TTY at any point by holding Volume Down and pressing the Power button 3 times.See the UI guides for GNOME, Phosh, Plasma Mobile, Sxmo.SSH can be enabled.All vendorsASUSAcerArrowBQFairphoneGenericGoogleHPLenovoMicrosoftMotorolaNokiaNvidiaODROIDOnePlusPINE64PostmarketOSPurismSHIFTSamsungWileyfoxXiaomiCommunityStableEdgeArrow DragonBoard 410cv24.12 edge 🚧ASUS MeMO Pad 7v24.12 edge 🚧BQ Aquaris X5v24.12 edge 🚧Fairphone 4v24.12 edge 🚧Generic MSM8953v24.12 edge 🚧Generic x86_64 EFI Systemv24.12 edge 🚧Google Gru Chromebooksv24.12 edge 🚧Google Kukui Chromebooksv24.12 edge 🚧Google Oak Chromebooksv24.12 edge 🚧Samsung Chromebook 2 11.6"v24.12 edge 🚧Google Pixel 3av24.12 edge 🚧Samsung Chromebookv24.12 edge 🚧Google Trogdor Chromebooksv24.12 edge 🚧Google Veyron Chromebooksv24.12 edge 🚧Google Chromebooks with x64 CPUv24.12 edge 🚧Lenovo A6000v24.12 edge 🚧Lenovo A6010v24.12 edge 🚧Lenovo X13sv24.12 edge 🚧Microsoft Surface RTv24.12 edge 🚧Motorola Moto G4 Playv24.12 edge 🚧Nokia N900v24.12 edge 🚧Nvidia Tegra armv7v24.12 edge 🚧ODROID XU4v24.12 edge 🚧OnePlus 6v24.12 edge 🚧OnePlus 6Tv24.12 edge 🚧PINE64 PineBook Prov24.12 edge 🚧PINE64 PinePhonev24.12 edge 🚧PINE64 PinePhone Prov24.12 edge 🚧PINE64 RockPro 64v24.12 edge 🚧Purism Librem 5v24.12 edge 🚧Samsung Galaxy A3 (2015)v24.12 edge 🚧Samsung Galaxy A5 (2015)v24.12 edge 🚧Samsung Galaxy E7v24.12 edge 🚧Samsung Galaxy Tab 2 10.1"v24.12 edge 🚧Samsung Galaxy Tab 2 7.0v24.12 edge 🚧Samsung Galaxy S4 Mini Value Editionv24.12 edge 🚧Samsung Galaxy Grand Maxv24.12 edge 🚧Samsung Galaxy Tab A 9.7 (2015)v24.12 edge 🚧Samsung Galaxy Tab A 8.0 (2015)v24.12 edge 🚧Samsung Galaxy S III (GT-I9300/SHW-M440S)v24.12 edge 🚧Google Nexus 10v24.12 edge 🚧SHIFT6mqv24.12 edge 🚧Wileyfox Swiftv24.12 edge 🚧Xiaomi Pocophone F1v24.12 edge 🚧Xiaomi Mi 9T / Redmi K20 edge 🚧Xiaomi Mi Note 2v24.12 edge 🚧Xiaomi POCO X3 NFC edge 🚧Xiaomi Redmi 2v24.12 edge 🚧TestingFairphone 5v24.12 edge 🚧Google Asurada Chromebooksv24.12 edge 🚧Google Cherry Chromebooksv24.12 edge 🚧Google Corsola Chromebooksv24.12 edge 🚧Acer Chromebook 13 CB5-311v24.12 edge 🚧HP Chromebook 14 G3v24.12 edge 🚧postmarketOS Trailblazer edge 🚧Samsung Galaxy Core Prime Value Edition LTEv24.12 edge 🚧document.addEventListener('DOMContentLoaded',function(){const vendorFilter=document.getElementById('vendor-filter');const searchFilter=document.getElementById('search-filter');const table=document.getElementById('devices-table');const rows=table.querySelectorAll('tbody tr');function filterTable(){const vendorValue=vendorFilter.value.toLowerCase();const searchValue=searchFilter.value.toLowerCase();main=document.getElementById('th-community');if(vendorValue||searchValue){main.innerHTML="Search result";}else{main.innerHTML="Community";} rows.forEach(row=>{const vendor=(row.getAttribute('data-vendor')||'').toLowerCase();const name=(row.getAttribute('data-name')||'').toLowerCase();const vendorMatch=vendorValue===''||vendor===vendorValue;const searchMatch=searchValue===''||name.includes(searchValue);row.style.display=vendorMatch&&searchMatch?'':'none';});} vendorFilter.addEventListener('change',filterTable);searchFilter.addEventListener('input',filterTable);});Don't see your device in the list? Search for it on the devices page and consider contributing to help