["https://postmarketos.org/edge/2021/04/08/python-protobuf-qt5"]
title = "postmarketOS // Python 3.9 / protobuf / qt5-qtsvg / q6voiced"
description = "Aiming for a 10 year life-cycle for smartphones"
full_description = '''Python 3.9Python has been upgraded from 3.8 to 3.9 in Alpine. All packages currently depending on libpython3.8.so or installing files to /usr/lib/python3.8/ need to be rebuilt. The former causes errors while trying to install python packages and the latter causes errors like the following at runtime:ModuleNotFoundError: No module named 'gpodder'Relevant links:postmarketOS fixes: pmaports!2104Alpine fixes: see open and closed MRs mentioning python.Alpine package search with packages that still need to be adjusted (note that this has a delay, the search results aren't directly updated after a merge)Consider helping out with fixing the remaining packages in Alpine, if there isn't a merge request already (open or merged)protobufProtobuf was briefly disabled in Alpine for 32-bit arches. Plasma Mobile and Phosh both depend on this package through libphonenumber. It is enabled again.qt5-qtsvgA broken patch in qt5-qtsvg caused build errors like the following. The patch has been reverted in Alpine (the fixed package was also forked to postmarketOS, so we could get the upstream compatibility issues fixed all at once without waiting until it was built and published in Alpine).CMake Error at /usr/lib/cmake/Qt5Svg/Qt5SvgConfig.cmake:111 (find_package): Could not find a configuration file for package "Qt5Widgets" that is compatible with requested version "5.15.3". The following configuration files were considered but not accepted: /usr/lib/cmake/Qt5Widgets/Qt5WidgetsConfig.cmake, version: 5.15.2 q6voicedMost android devices in the "community" category of postmarketOS devices are affected by a q6voiced bug causing audio stream breakage. This was just fixed in pmaports!2103.'''
year_published = 2021
year_updated = 2021
