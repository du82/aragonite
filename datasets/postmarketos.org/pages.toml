["https://postmarketos.org/edge/2021/03/21/postmarketos-mkinitfs"]
title = "postmarketOS // No space left on boot partition"
description = "Aiming for a 10 year life-cycle for smartphones"
full_description = "In Alpine edge, LLVM was recently upgraded from 10 to 11. The new libLLVM-11.so is bigger than libLLVM-10.so, which triggered a bug on the PinePhone and possibly other devices where hardware acceleration for osk-sdl is enabled. During upgrades, if a new initramfs was generated, it would run out of space on /boot:==> initramfs: creating /boot/initramfs-postmarketos-allwinner-extra gzip: write error: No space left on device cpio: write error: Broken pipe Make sure you have at postmarketos-mkinitfs version 0.22-r1 or higher installed, where we resolved this issue (pmaports!2051). If you ran into this issue and your device does not boot anymore, restore the boot partition. For the PinePhone, see this guide.Details in pmaports#1018."
year_published = 2021
clearnet = "https://postmarketos.org/edge/2021/03/21/postmarketos-mkinitfs"
