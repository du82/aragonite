["https://postmarketos.org/blog/2022/09/04/v22.06.2-release"]
title = "postmarketOS // v22.06 SP2: The One That Swipes"
description = "Aiming for a 10 year life-cycle for smartphones"
full_description = "Here it is, after a bit of delay to figure out why the new Phosh version didn't boot on the Samsung Galaxy S III. Now that the reason is known and a workaround is in place, we also happened to hit the timeframe where fixup versions of these huge Phosh and Phoc releases were made. Enjoy the following changes on stable!ContentsPhosh 0.21.0 and Phoc 0.21.1 are huge upgrades from the previous versions 0.17.0 and 0.13.1. Both skipped a lot of version numbers to 0.20.0 in case you are wondering. Most excitingly it is now possible to swipe up and down to make menus show up. Also the lockscreen has been reworked, it's now possible to use the top menu there and for everyone who configured Phosh with pmOS tweaks to show the battery percentage, you will be able to see that right on the lockscreen too. See the changelogs of (Phosh) 0.20.0 (and the 3 betas linked there), 0.21.0 and (Phoc) 0.20.0, 0.21.0, 0.21.1 for a detailed list of changes.postmarketOS-welcome 0.6.0 informs about how menus are now opened in Phosh (so users who did not read this blog post are not confused). Also the logic was changed to make it show up once when booting into this new Phosh version.linux-postmarketos-qcom-sdm845 5.19.0 is a well-tested upgrade from edge for the SDM845 based SHIFT6mq, OnePlus 6/6T and Xiaomi Pocophone F1.powersupply 0.8.0 (previously 0.6.0) is relevant for the SDM845 SoC as well, as it brings the necessary quirks to show the charging/discharging rate, temperature and USB current limits for SDM845 too.PinePhone Pro now has a workaround to fix audio if not having proper SMBIOS information coming from the bootloader (pma#1601). This was properly fixed in Tow-Boot 2021.10-005.PinePhone: kernel upgrade to 5.19.2 and the AF8133J magnetometer driver is now enabledPinePhone (Pro): add the upower fwupd plugin to prevent (modem firmware) upgrades if the phone is not connected to AC (pma!3320)Samsung Galaxy S III: HDMI out had to be disabled as the kernel driver reports the wrong state when it is unplugged and that leads to the newer Phosh stack not starting up. This seems to be a rarely used feature as it requires an original dock/adapter from the time period. If you have one however and would like to fix this in the kernel, please reach out.How to get itFind the most recent images at our download page. Existing users of the v22.06 release will receive this service pack automatically on their next system update. If you read this blog post right after it was published, it may take a bit until binary packages and new images are available.Thanks to everybody who made this possible, especially our amazing community members and upstream projects."
