["https://postmarketos.org/edge/2021/06/22/l5-no-sound"]
title = "postmarketOS // Librem 5: No audio after upgrading to alsa-ucm-conf 1.2.5"
description = "Aiming for a 10 year life-cycle for smartphones"
full_description = "A recent upgrade to alsa-ucm-conf 1.2.5 has broken audio on the Librem 5. At this time there is no fix, however there is a workaround that can be achieved by commenting out a single line in /usr/share/alsa/ucm2/ucm.conf:$ sudo sed -i 's|Include.libgen.File|# Include.libgen.File|' /usr/share/alsa/ucm2/ucm.conf If a new upgrade for alsa-ucm-conf is available before a proper fix is in place, the workaround will need to be re-applied.Related Issues:pmaports#1124librem5-base #48 Librem 5: No audio after upgrading to alsa-ucm-conf 1.2.5June 22, 20211 min. readA recent upgrade to alsa-ucm-conf 1.2.5 has broken audio on the Librem 5. At this time there is no fix, however there is a workaround that can be achieved by commenting out a single line in /usr/share/alsa/ucm2/ucm.conf:$ sudo sed -i 's|Include.libgen.File|# Include.libgen.File|' /usr/share/alsa/ucm2/ucm.conf If a new upgrade for alsa-ucm-conf is available before a proper fix is in place, the workaround will need to be re-applied.Related Issues:pmaports#1124librem5-base #48"
