["https://postmarketos.org/edge/2021/11/17/sxmo-1.6.0-upgrade"]
title = "postmarketOS // Sxmo 1.6.0 upgrade: manual steps required"
description = "Aiming for a 10 year life-cycle for smartphones"
full_description = "Upgrade instructions for successfully installing the as of writing most recent versions 1.6.0-r0 of postmarketos-ui-sxmo-de-sway or postmarketos-ui-sxmo-de-dwm (!2684).New Global UI ControlsNote that also the global UI controls have changed 1.5.x, most importantly for upgrading:Sxmo Version Launch Terminal Toggle virtual keyboard1.5.x2x power key1x power key1.6.03x power key1x volume lower keyFull Global UI Controls reference:1.5.x1.6.0PreparationBefore upgrading, make sure your SSH login works. Enable the daemon to start on boot, start it once, verify that it works. Replace password auth with SSH key if you are not planning to disable SSH after these upgrading instructions, and again, verify that you can login successfully.Figure out which version you are currently running$ apk info -vv | grep postmarketos-ui-sxmo postmarketos-ui-sxmo-1.5.1-r2 - (X11) Simple X Mobile: Mobile environment ... UpgradeAs always, upgrade with the -a flag:$ sudo apk upgrade -a Add your user to the seatd group$ sudo usermod -G seat -a $USER Recommended packagesUIs in postmarketOS have recommended packages (_pmb_recommends), which get installed by default in new installations. The difference to regular dependencies (depends) is, that these can be uninstalled by the user. However, apk does not know about these recommended packages.Installations of Sxmo 1.5.x have recommended packages for the DWM version of Sxmo installed, and these do not automatically get uninstalled when installing the Sway version. So if you want to have only the Sway version installed, consider removing them manually:$ sudo apk del feh megapixels-gtk3 xcalc Similarly, the recommended packages for the Sway version are not installed automatically on upgrade. Install them manually:$ sudo apk add imv megapixels The current list of recommended packages can be found in pmaports.git, main/postmarketos-ui-sxmo-de-sway/APKBUILD and main/postmarketos-ui-sxmo-de-dwm/APKBUILD.Finish upReboot your device, it should boot successfully into Sxmo 1.6.0.Related: sxmo-announce thread"
