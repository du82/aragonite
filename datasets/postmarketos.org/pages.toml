["https://postmarketos.org/team"]
title = "postmarketOS // Who makes postmarketOS?"
description = "Aiming for a 10 year life-cycle for smartphones"
full_description = "ContributorsAs a free and open-source software (FOSS) project, anyone can contribute to postmarketOS by submitting patches and taking part in discussions. There are a wide range of contributions that come from all corners of our amazing community! You too can contribute!All creatures welcome. Make sure to follow the Code of Conduct.Contributor GroupsMembers who have special responsibilities are organized into the following groups, with a specific set of responsibilities.Core ContributorsThe Core Contributors are the most involved with the project. They set the overall project direction, design and maintain the infrastructure, make releases, and everything else. The group is currently limited to a maximum of 8 people to keep it effective. We currently don't have a formal process for becoming a Core Contributor. However if you are already a Trusted Contributor and have a very good reason, then talk to us and we can consider it.Who are the Core Contributors?Meeting minutesTrusted ContributorsTrusted Contributors work on day-to-day things across the project including development, code reviews, merging changes, triaging issues, community support, outreach by going to conferences and doing talks, improving documentation and/or creating artwork. Community members that have been contributing to postmarketOS in a meaningful way for six months or longer and intend to do so in the future can apply to become a Trusted Contributor!Who are the Trusted Contributors?How to become a Trusted Contributor? (Part 2)Active ContributorsActive Contributors can't merge changes themselves, but otherwise do much of what Trusted Contributors do. They usually focus on the specific devices they're interested in.Who are the Active Contributors?How to become an Active Contributor?TeamspostmarketOS is also organized into Teams, which are built around a singular topic or purpose.Testing TeamGiven the breadth of hardware postmarketOS supports, extensive testing is important to prevent regressions: the Testing Team tests changes before they're released ensuring they're as reliable as possible.Who is in the Testing Team / How to join?Code of Conduct TeamBy following our Code of Conduct, we establish a baseline of civil and professional collaboration. In case people behave unacceptably (join our channels and insult others, post spam, etc.) we enforce the CoC with the Chat Moderators and CoC (mail) team.Who are the chat moderators / how to make a chat moderation request?Who is in the CoC (mail) team / how to contact them?The BoardThe board is responsible for approving expenses in our Open Collective as well as budgets when executing projects.Who are the Board Members?What are the related finance processes?Social Media TeamThe Social Media Team administrates the postmarketOS account for the social media sites mentioned in discussion platforms.Who is in the Social Media Team / what are the guidelines?"
