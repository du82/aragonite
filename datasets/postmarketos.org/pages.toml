["https://postmarketos.org/contribute"]
title = "postmarketOS // Where to Contribute ❤️"
description = "Aiming for a 10 year life-cycle for smartphones"
full_description = "Hello there, glad you are reading this page! We have a broad spectrum of topics to contribute, and some of them do not even require programming or scripting knowledge. With each contribution, you don't just get to help out your fellow postmarketOS friends, but there's always a chance to learn something new and sharpening your skills along the way. And of course fun, fame and epic stories to tell to your grandchildren about what a badass contributor you have been. Now pick what interests you most.Reporting issuesReporting issues you found can be of high value for developers and other users. With that being said, processing issue reports can also take a lot of time. The amount of time can be minimized by the following:Search the issue tracker to find if your issue was already reported.Try to figure out which exact circumstances trigger the problem.When reporting a new issue, please include all potentially relevant information.➡️ Report a new issueDocumentationMost of our documentation is in the wiki. We have pages on devices, tooling, UIs and more. You can help improve these pages from simple spelling and grammar fixes to making more complex changes.➡️ Read the wiki editor's guideTestingIf you have already familiarized yourself with postmarketOS a bit, consider joining the Testing Team to get cool new stuff first and help with making the project more stable for your particular device:New changes to postmarketOS edgeNew postmarketOS releasesYou can do this no matter which device you run postmarketOS on — QEMU, phones, tablets, chromebooks or other laptops, SBCs, smartwatches, etc.➡️ Join the Testing TeamDevelopmentSuitable tasks to get a start in postmarketOS development:Port and mainline devices you own.Fix a small bug that you encounter while using postmarketOS.➡️ Take me to the source codeContributing upstreampostmarketOS builds upon a lot of other free software projects. Consider getting involved upstream: Alpine Linux • Phosh • Plasma Mobile • GNOME • SXMOHelping other people Get active in the chatrooms (Matrix, IRC), the issue tracker or other discussion platforms and help others along the way, with motivation or practical tips on whatever they are doing.➡️ Discussion platformsContributing financiallyIf you like postmarketOS and would like to help us with keeping our infrastructure running, accelerating the development and more then you can also make a donation. We list our finances transparently on our OpenCollective page.➡️ Go to our OpenCollective pageSee alsoContributing for (advanced?) DummiesHow you can help the Linux Mobile ecosystem"
year_published = 2025
clearnet = "https://postmarketos.org/contribute"
