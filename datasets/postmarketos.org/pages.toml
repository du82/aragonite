["https://postmarketos.org/blog/2019/02/10/postmarketos-at-fosdem-2019"]
title = "postmarketOS // at FOSDEM 2019"
description = "Aiming for a 10 year life-cycle for smartphones"
full_description = "Last weekend was FOSDEM 2019, Europe's biggest event for open-source and free software developers to meet, share ideas and collaborate. A few postmarketOS developers and community members attended, as well as several other Linux phone project members. Of course, besides just walking around and attending several interesting talks, we also took this opportunity to do some work!The PINE64 company was present with their own stand, and a PINE64 community meeting in the evening. They showed off their almost ready PinePhone development kits, and some other neat hardware like a fully open-source IP camera, their new Pinebook Pro and PineTablet. Since @z3ntu, @MartijnBraam and @PureTryOut took their Pine A64-LTS kits with them (which uses basically the same hardware as will be in the PinePhone), we decided to do some work improving our port, and we got the screen working for the first time!There is still work to do as the touchscreen doesn't respond yet, and the patches to make the display work still have to be combined with our current kernel sources. However, with the progress we're currently making, it means we should have a working port once the actual phone releases!We've also met the people behind Necunos and their first mobile device, the NC_1. Originally the plan was for us to receive a devkit at FOSDEM, but due to an issue with the screen they had chosen originally, this is delayed till later this month. They did however have a prototype with them, and it was awesome to see it in person. We're waiting for the devkit in excitement, and hopefully next year they'll have a stand as well.An event like FOSDEM is also a good opportunity to meet with related and collaborating projects. We've met @MerlijnWajer from Maemo Leste, @UniversalSuperBox from UBPorts, @SirCmpwn from sourcehut (which will soon be building our packages and automatically push them to our repo), and @bshah from Plasma Mobile.From left to right: @bshah, @MayeulC, @unrznbl, @z3ntu, @MerlijnWajer, @UniversalSuperBox, @PureTryOut, @NotKit, @MartijnBraamThe future of Linux on phones is definitely bright, which was just reconfirmed by the awesome people and companies we've met this year. We'll probably hold a talk ourselves next year, and hopefully we'll meet even more people. 🎉CommentsHacker News"
