full_description = "The second service pack for postmarketOS v21.06 has been released. As usually, it brings improvements from edge to the stable release of postmarketOS, after careful testing by developers and brave community members on living on the edge.The v21.06.2 service pack contains:Megapixels 1.3.0, with performance improvements and new image post-processing. As you've guessed, the image above was shot with this Megapixels release on a PinePhone. If you have a similar setup of butterflies and flowers in your garden, or something else that is nice to look at, give it a try!Phosh 0.12.1megi's 5.13-20210819-1611 kernel for the PinePhone and PineTabLight daemon is now available for usage in Sxmogpodder-adaptive 3.10.21, with major performance and UI fixesu-boot-pinephone 2021.07 with a new crust release that improves battery life significantly in standbyFind the most recent images at our download page. Existing users of the v21.06 release will receive this service pack automatically on their next system update.Thanks to everybody who made this possible, especially our amazing community members and upstream projects.CommentsMastodonLemmyRedditHN"
