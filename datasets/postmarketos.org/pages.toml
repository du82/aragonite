full_description = "If you are looking for a sustainable, stylish piece of clothing with a postmarketOS logo to either keep your phone, yourself or even your cat comfy, you came to the right place. Below you will find the official postmarketOS merch sites. When buying a piece of merch from either of these, you are at the same time making a small donation towards postmarketOS.Original T-Shirts DesignsFrom the logo in 3D to the super minimalist variant that features the logo without text, here are the Tees that you might have seen people wear at FOSDEM and other cool events. If this is too casual for your rebel soul and you would rather wear a fist on your chest with some text that makes the reader seriously question their choice of operating system, we got that as well now. And if that sounds too scary and you prefer a cute cat chewing on an N900... you guessed it, it's in there as well.=> postmarketos.teemill.comHELLOTUXIf you would rather have a really nice embroidered version of the logo or don't want to limit yourself to shirts, then HELLOTUX is the place to go. This is a little family owned shop from people who are truly into the spirit of free software and running our favorite kernel, to the point that they run their whole operation on Linux (more about that on their about page).=> hellotux.comDevices with postmarketOS Pre-InstalledIf you are reading these lines, you probably know what the PinePhone and PinePhone Pro are. When buying one from the PINE64 EU store, you will get the stable version of postmarketOS flashed right to the eMMC. Just make sure you have the right expectations: this is for developers. As of writing especially the PinePhone Pro has a long way to go so you probably shouldn't get one unless you intend to contribute to development.=> pine64eu.com"
