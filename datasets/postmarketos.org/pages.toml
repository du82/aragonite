["https://postmarketos.org/blog/2022/01/17/v21.12.1-release"]
title = "postmarketOS // v21.12 Service Pack 1"
description = "Aiming for a 10 year life-cycle for smartphones"
full_description = "Welcome to 2022! This is the first service pack of the year bringing some of the improvements from edge to stable. This also brings a few nice new features to the v21.12 release that were not ready for inclusion yet when the last stable release was made.ContentsNokia N900 is back! It cheated death once again with the help of @sicelo and @danct12, who have picked up maintainership of the device, upgraded the kernel and done various fixes.Allwinner Linux 5.15.3 is now the latest kernel used for the PinePhone, this also brings support for the PINE64 hardware keyboard to stable, just in time since people have been receiving the units.Sxmo 1.7.1 is the latest and greatest Sxmo version, bringing visual voicemails among a lot of other things, see the neatly detailed release notes.GNSS Share 0.4 is now the GPS implementation for the Librem 5. This is a major component needed for getting assisted GPS working on this hardware improving the speed a GPS lock can be acquired.Gnome Control Center has a small bugfix that stops a crash when opening the printing panel so the printing system is now activated in Gnome. (Note that using the printing panel currently requires manually starting cups.)How to get itFind the most recent images at our download page. Existing users of the v21.12 release will receive this service pack automatically on their next system update. If you read this blog post right after it was published, it may take a bit until binary packages are available. Also for the N900 images, they will take a bit.Thanks to everybody who made this possible, especially our amazing community members and upstream projects. CommentsMastodonLemmyHN"
