["https://postmarketos.org/edge/2022/05/03/wifi-and-wwan-disappeared"]
title = "postmarketOS // WiFi and WWAN disappeared"
description = "Aiming for a 10 year life-cycle for smartphones"
full_description = "Due to a recent change in Alpine (networkmanager package refactored, pmOS packaging had to be adjusted), WiFi and WWAN disappeared leaving devices without a network connection. This has been fixed, but users who found themselves upgrading to this broken upgrade might have trouble getting their connection back. Here are three possible remedies that don't require reinstalling postmarketOS:Try to look for an older version of the networkmanager package in /var/cache/apk and downgrade to that temporarily. Version 1.34.0-r2 or older.Use USB network sharing to share your PC's Internet connection with your phone/tablet (this can be a bit tricky to set up though) and then upgrade like normal to the fixed packages. See the USB Internet article on our wiki.Download the new packages and install them manually from an Alpine mirror. The relevant ones are networkmanager-wifi and networkmanager-wwan, both in the community category. See mirrors.alpinelinux.org for a list of mirrors.More information in pma#1519."
year_published = 2022
clearnet = "https://postmarketos.org/edge/2022/05/03/wifi-and-wwan-disappeared"
