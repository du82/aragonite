full_description = "You'll need a Switch enabled for homebrew to run this (and a 7z unpacker). You won't find an explanation about that here! The Legacy Edition for Android lets you use old permission rules on new devices, which can help Android TV devices without folder browsers. This is a Pandora port of PPSSPP. You will have to figure out how to install it :) Thanks to ptitSeb. A simple PSP program that draws a spinning cube. For testing that the emu works on your device before you dump your UMDs. PPSSPP 1.8 from March, 2019 is the last release that works on Windows XP. Newer versions simply do not launch. This is a BlackBerry 10 port of PPSSPP. Sideload the .bar from your computer using Sachesi or Chrome extension. Thanks to xsacha for doing the build. Once upon a time, long long ago, I ported PPSSPP to Windows Phone. Unfortunately I never got it to run well enough to be worth releasing, since JIT is fundamentally broken on Windows Phone (due to the lack of an API to invalidate the instruction cache), and the graphics driver was barely functional, causing many glitches."
