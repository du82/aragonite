full_description = "Here's a summary of the situation, along with the rejection letters, my replies and App Store Review's responses. I recommend all iOS users to use the free version of PPSSPP until this can be resolved, even if you paid for Gold to support the project! NOTE! As usual, the Android version on Google Play will as usual roll out slowly over multiple days in order to catch any bad crashes early, so you may have to wait a few days before you receive the update. This special Android APK targets an older SDK version than the official builds, and is thus unaffected by the Scoped Storage API requirement. This can help various Android TV devices where you are currently unable to pick a folder to load an ISO from. Note that this can not be uploaded onto Google Play since it doesn't meet current requirements. The only way to install it is to sideload it via ADB or similar. If you know how to use APK files, you know what you need to do. PPSSPP for iOS 1.17.4 is out, however the Gold version is unfortuntately stuck in App Store review. If you have the free version installed, it will update automatically. PPSSPP for iOS 1.17.3 has now been released, both Gold and regular, and if you have one of them installed, you should be receiving the update shortly. The version that's online now is the same as the current Gold version, it includes these new features and fixes: PPSSPP for iOS 1.17.2, both regular and Gold, have been sent for review. The Gold version has passed and will roll out today. For the free version status, see below. This is the status of my apps in the App Store as I'm writing this, just before triggering the rollout of 1.17.2: Below you can find Apple's complaint (which, if accurate, would also apply to the Gold version, since it had the same contents in the homebrew store). Note that despite the complaint giving a 14-day deadline, the app was taken down immediately, which is odd. Additionally, in my opinion the complaint is incorrect because I don't believe anything previously on the homebrew store actually did infringe upon copyright."
