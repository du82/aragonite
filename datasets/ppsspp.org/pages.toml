["https://ppsspp.org/docs/reference/ios-support"]
title = "PPSSPP for iOS - PPSSPP"
full_description = '''Sometime in April-May 2024, Apple changed their App Store policy to allow emulator apps in the App Store. This finally made it possible to release an official iOS version of PPSSPP! This also means that going forward, the iOS version will be prioritized about as highly as the Android and PC versions for features and performance work. However - updates may be delayed, sometimes severely, due to Apple's rather unpredicatable review process. The one serious limitation of functionality that PPSSPP (and other emulators) are still subject to on iOS is the inability to "JIT", that is, to generate machine code at runtime and run it. This is very useful when emulating foreign CPU architectures such as the PSP's CPU (known as Allegrex). Fortunately, the PSP does not require a JIT compiler to be emulated at full speed on modern iOS devices, although it would reduce battery consumption to be able to do it. Before the policy change, you had to "sideload" PPSSPP onto an iPhone, which there are many ways to do. You still have to do this if you want JIT functionality, but since as mentioend it's not that critical for PSP emulation performance, I expect fewer people will pick this option. IMPORTANT: This guide is unofficial - the project is not responsible for any negative results, and will not answer questions about it. You're on your own!'''
year_published = 2025
