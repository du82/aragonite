["https://ppsspp.org/docs/reference/retro-achievements"]
title = "RetroAchievements - setup and use - PPSSPP"
full_description = '''RetroAchievements are similar to Xbox achievements or PlayStation trophies, except that they're created and defined by a volunteer community. Just like other retro consoles, the PSP itself has no native concept of achievement/trophies. However, this can be added with emulation! Not only achievements are supported, but also global leaderboards in games that have scores or times. RetroAchievements are supported from PPSSPP version 1.16. The feature is not supported in 1.15.4 and older. First, create an account on the RetroAchievements website. Then, in PPSSPP's RetroAchievements settings, enter the same username and password. After that, simply run games, and if they have achievement sets made for them, they'll be activated. Also, you might want to enable Hardcore Mode, see below. In Hardcore Mode, a number of the emulator's features that are particularly prone to cheating are disabled, such as save states and slowing down time. Speeding up time is still allowed. We previously called it Challenge Mode, but we have now switched to the RetroAchievements standard, which is Hardcore mode. Loading states is strictly disallowed, but it can sometimes be useful to save state, especially for development or confirming missed achievements. For this case, we have an option in the RetroAchievements developer settings, "Allow Save State in Hardcore Mode (but not Load State)". Lets you unlock achievements again. Note that this does not affect the real unlock status - you'll just get the notification again if you fulfill the conditions, such as completing a level or whatever it was. This is mainly useful for development - for regular gameplay, it gets confusing. These are achievements that have been removed, or are in development, or have simply been considered not really worth having. Unfortunately, it's often the case that only one or two regions of a game are supported. Click the link "Supported game files" on the game's page on that site to find out. All existing achievements were created for the PPSSPP core in RALibRetro, which has the same timing and plugins as RetroArch. Unfortunately, due to deficiencies in libretro's design, achievement checks don't run at the correct time in RALibRetro or RetroArch - so if your achievement works correctly in RetroArch and not in PPSSPP standalone, the achievement is broken.'''
