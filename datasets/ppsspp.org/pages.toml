["https://ppsspp.org/docs/faq"]
title = "FAQ - Frequently Asked Questions - PPSSPP"
full_description = '''You need to have your PSP games as .ISO or .CSO files. I do not have the right to distribute those with the app, so you'll have to provide them on your own. Buy PPSSPP Gold! Available for Android and PC. It's the same as the regular version functionally (see Why Gold?), but by buying it you support the development of PPSSPP. Note that PPSSPP Gold is only available for Android, Windows, macOS, but you can of course buy it even if it doesn't support your favorite platform as a way to support the project. Why not? The domain name ppsspp.org was available, unlike the corresponding domains for many other alternatives I considered. Today I probably would have named it something different and more pronounceable. At least it's kinda fun watching various YouTube personalities try to pronounce it - sorry! PPSSPP can run on most modern iOS versions, and is now available on the App Store, in addition to sideloading. On sideloaded versions, the JIT works, but the App Store versions are generally fine too. See the Downloads page for links and more info. No. PS Vita has a completely different machine architecture, much more powerful than the PSP and with different security technologies. I don't have either the information needed nor the time. Do look into the Vita3K project though! They are making good progress, although game compatibility is still quite low. Install it exactly the same way as you would on a PSP, that is, copy the files to PSP/GAME or PSP/SAVEDATA (depending on the DLC) on the memory stick. In the Android version of PPSSPP, the memory stick is simply the SD card or USB storage of your phone, PPSSPP will create a PSP folder in the root of that. On Windows without installer, the memory stick is the "memstick" subdirectory in the PPSSPP folder. On iOS, it's in /User/Documents/PSP/. On Mac and Linux, it's in ~/.config/PPSSPP. No. PPSSPP simulates the BIOS and the entire internal operating system. It does not currently emulate enough of the hardware for the actual PSP operating system to run inside of PPSSPP, so even if you have a copy of it, PPSSPP can't run it.'''
