["https://ppsspp.org/docs/getting-started/installing-games-android"]
title = "How to move PSP games to your mobile device - PPSSPP"
full_description = '''Connect your Android device (phone, tablet, etc) to your PC using a USB cable. Likely, the one you charge the device with will work just fine. You can now create a new folder to store your ISOs in, if you haven't already (it's recommended that it's separate from the "PSP" folder where system files and save games go, but it does work to use the same folder). A quick way is by pressing Ctrl+Shift+N and typing the name of your new folder. Finally, after starting PPSSPP on your device, you'll be able to either directly browse to it (Android 10 or older, or old installs), or you'll be able to click Browse... and select it. Open the device in Finder. Click the Files tab, then you should see PPSSPP and/or PPSSPP Gold listed. After this, the ISO files will be located on the virtual "memory stick". Just pick them from the Games tab (click Home if you can't find the files).'''
