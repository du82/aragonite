["https://ppsspp.org/docs/development/translation"]
title = "Translation - PPSSPP"
full_description = "PPSSPP is translated into a multitude of languages, but as you may have noticed, many of the translations are far from complete, and there are many still missing. Unfortunately it's not possible to have an on-duty team adding translations of every new string as they appear, so translations are dependent on volunteer efforts. If you'd like to contribute to translation, the easiest way to get started and to be able to test directly in the app is to use the Windows or another desktop version, and go into assets/lang under the main PPSSPP directory, and open the .ini file for the language you want to help with, and make or copy your changes there. To add a new language, just add a new language .ini file, and also add an entry in assets/langregion.ini. The language ini file should be named according to this table, or similar. When you make changes here, you may have to restart PPSSPP for them to take effect. Alternatively, you can directly to go to the assets/lang folder on GitHub and start editing the .ini file for the language you know. Once happy with your changes, you can submit a pull request on GitHub, or just email the finished .ini file to the maintainer."
