["https://ppsspp.org/docs/development/known-differences"]
title = "Known differences from the real PSP - PPSSPP"
full_description = "PPSSPP tries to replicate the behavior of a real PSP, with regards to running games, as closely as possible, but there are known differences. Some of them are described below. Our audio reverb implementation is modeled on the PSX reverb function - we know that the PSP's reverb effect is different in some way, as the result is sometimes too loud, sometimes too weak, but it's very hard to know exactly how. The PSP firmware includes a set of fonts, that a small percentage of games use for some of their user interface. Unfortunately, these are of course copyrighted, so cannot be supplied with PPSSPP. It's possible to dump fonts on your own and have PPSSPP use them, but PPSSPP also has a set of built-in fonts that are very close in metric and work well for most games, so it's not really something to worry about, though some text may just look a little off compared to the real thing. The MIPS CPU in the PSP has separate data and instruction caches. The data cache can be easily bypassed by game code by doing | 0x40000000 to any pointer. This is mainly useful for writing data all the way out to RAM immediately so that the GPU can read it immediately, without any need for cache flushing. There's also a full set of cache invalidation instructions and other cache control functions. PPSSPP just pretends the caches are invisible, which they should be if games use them correctly. Which they don't always do - it's believed that a graphical glitch with fires in the Prince of Persia games is caused by some kind of cache misuse. The VFPU is a vector co-processor that is controlled with the same instruction stream as the main CPU. It has a lot of very complex instructions like cosines, square roots and so forth, and we haven't figured out the exact formulas behind these so instead we use approximations that are quick to compute. Additionally, dot products use a cool mantissa-aligning optimization, causing quite different results from a naive series of multiplications and adds. This means however there are sometimes some accuracy issues, especially in replays (such as the Ridge Racer built-in replays) that can go out of sync, and various physical and graphical problems such as shaking feet in Tekken 6 (since fixed)."
year_published = 2025
clearnet = "https://ppsspp.org/docs/development/known-differences"
