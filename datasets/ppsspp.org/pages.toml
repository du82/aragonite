["https://ppsspp.org/docs/development/beta-testing"]
title = "Beta Testing on Android - PPSSPP"
full_description = '''A few weeks before each new official release, a beta release will be rolled out to participating people, containing most of the new features that will be in the next release. Additionally, there'll be a build every couple of months between major releases. We only have a beta testing program for Android since Google Play provides convenient tools to automatically roll out new builds to participants. We don't have anything like that yet on the other platforms. On PC, if you want to help testing stuff before release, download the latest development build from the buildbot and report results. Beta builds can have bugs and instabilities, but will usually be usable. If you see unexpected behavior or odd crashes, please report them, as explained below. If you make a save state in a beta build, it will not load if you go back to the previous "normal" build, but it will load in future versions. Regular in-game save games are portable back and forth, assuming you keep the files around. On Android 11 or higher, make sure you are using a manually-selected folder for memstick data. More information. If you have installed PPSSPP through an APK previously, for example from the buildbot, you will have to uninstall, and install again from Google Play, in order to get your automatic beta updates. Either report bugs using our GitHub issue tracker, or join the discord (instructions here) and report your issues in the #general channel. But before reporting, please do a search of the GitHub issue tracker to see if your problem is already known!'''
