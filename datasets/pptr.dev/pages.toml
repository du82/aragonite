full_description = "PuppeteerNodePuppeteerNode.launchVersion: NextOn this pagePuppeteerNode.launch() method Launches a browser instance with given arguments and options when specified. When using with puppeteer-core, options.executablePath or options.channel must be provided. Signature​ class PuppeteerNode { launch(options?: LaunchOptions): Promise<Browser>;} Parameters​ ParameterTypeDescriptionoptionsLaunchOptions(Optional) Options to configure launching behavior. Returns: Promise<Browser> Remarks​ Puppeteer can also be used to control the Chrome browser, but it works best with the version of Chrome for Testing downloaded by default. There is no guarantee it will work with any other version. If Google Chrome (rather than Chrome for Testing) is preferred, a Chrome Canary or Dev Channel build is suggested. See this article for a description of the differences between Chromium and Chrome. This article describes some differences for Linux users. See this doc for the description of Chrome for Testing. Example​ You can use options.ignoreDefaultArgs to filter out --mute-audio from default arguments: const browser = await puppeteer.launch({ ignoreDefaultArgs: ['--mute-audio'],});"
