["https://pptr.dev/troubleshooting"]
title = "Troubleshooting | Puppeteer"
description = "To keep this page up-to-date we largely rely on community contributions."
full_description = '''CommunityTroubleshootingVersion: 24.3.0On this pageTroubleshooting noteTo keep this page up-to-date we largely rely on community contributions. Please send a PR if you notice something is no longer up-to-date. Cannot find module 'puppeteer-core/internal/...'​ This can occur if your Node.js version is lower than 14 or if you are using a custom resolver (such as jest-resolve). For the former, we do not support deprecated versions of Node.js. For the latter, usually upgrading the resolver (or its parent module such as jest) will work (e.g. https://github.com/puppeteer/puppeteer/issues/9121) Could not find expected browser locally​ Starting from v19.0.0, Puppeteer will download browsers into ~/.cache/puppeteer using os.homedir for better caching between Puppeteer upgrades. Generally the home directory is well-defined (even on Windows), but occasionally the home directory may not be available. In this case, we provide the PUPPETEER_CACHE_DIR variable which allows you to change the installation directory. For example, npmYarnpnpmPUPPETEER_CACHE_DIR=$(pwd) npm install puppeteerPUPPETEER_CACHE_DIR=$(pwd) node <script-path>PUPPETEER_CACHE_DIR=$(pwd) yarn add puppeteerPUPPETEER_CACHE_DIR=$(pwd) node <script-path>PUPPETEER_CACHE_DIR=$(pwd) pnpm add puppeteerPUPPETEER_CACHE_DIR=$(pwd) node <script-path> You can also create a configuration file named .puppeteerrc.cjs (or puppeteer.config.cjs) at the root of your application with the contents const {join} = require('path');/** * @type {import("puppeteer").Configuration} */module.exports = { cacheDirectory: join(__dirname, '.cache', 'puppeteer'),}; You will need to reinstall puppeteer in order for the configuration to take effect. See Configuring Puppeteer for more information. net::ERR_BLOCKED_BY_CLIENT when navigating to an HTTP URL in Chrome​ Chrome is rolling out a feature called HttpsFirstBalancedModeAutoEnable that displays a warning to the user if the user navigates to an HTTP site. The feature is enabled by default in Chrome for Testing builds that Puppeteer uses by default. The feature makes a navigation request to an HTTP URL result in the error net::ERR_BLOCKED_BY_CLIENT which can be caught and recovered from. When the error occurs, a warning page is shown to the user with a button to continue navigation. The button is clickable via Puppeteer. Local HTTP hosts do not trigger a warning but remote hosts might. For more details see https://crbug.com/378022921 It is possible to disable this Chrome feature by passing the --disable-features=HttpsFirstBalancedModeAutoEnable argument when launching Chrome: const browser = await puppeteer.launch({ args: ['--disable-features=HttpsFirstBalancedModeAutoEnable'],}); Chrome doesn't launch on Windows​ Some chrome policies might enforce running Chrome/Chromium with certain extensions. Puppeteer passes --disable-extensions flag by default and will fail to launch when such policies are active. To work around this, try running without the flag: const browser = await puppeteer.launch({ ignoreDefaultArgs: ['--disable-extensions'],}); Context: issue 3681. Chrome reports sandbox errors on Windows​ Chrome uses sandboxes on Windows which require additional permissions on the downloaded Chrome files. Starting from Puppeteer v22.14.0, Puppeteer will attempt to configure those permissions by running the setup.exe tool provided by Chrome during the installation of the browser. If you are using an older Puppeteer version or still seeing the following errors in the browser output: [24452:59820:0508/113713.058:ERROR:sandbox_win.cc(913)] Sandbox cannot access executable. Check filesystem permissions are valid. See https://bit.ly/31yqMJR.: Access is denied. (0x5) You can use icacls to set permissions manually: icacls "%USERPROFILE%/.cache/puppeteer/chrome" /grant *S-1-15-2-1:(OI)(CI)(RX) noteIn high security environments a more restrictive SID should be used such as one from the installer. See https://bit.ly/31yqMJR for more details. Chrome doesn't launch on Linux​ Make sure all the necessary dependencies are installed. You can run ldd chrome | grep not on a Linux machine to check which dependencies are missing. The common ones are provided below. Also, see https://source.chromium.org/chromium/chromium/src/+/main:chrome/installer/linux/debian/dist_package_versions.json for the up-to-date list of dependencies declared by the Chrome installer. cautionChrome currently does not provide arm64 binaries for Linux. There are only arm64 binaries for Mac ARM. That means that Linux binaries downloaded by default will not work on Linux arm64. Debian (e.g. Ubuntu) Dependenciesca-certificatesfonts-liberationlibasound2libatk-bridge2.0-0libatk1.0-0libc6libcairo2libcups2libdbus-1-3libexpat1libfontconfig1libgbm1libgcc1libglib2.0-0libgtk-3-0libnspr4libnss3libpango-1.0-0libpangocairo-1.0-0libstdc++6libx11-6libx11-xcb1libxcb1libxcomposite1libxcursor1libxdamage1libxext6libxfixes3libxi6libxrandr2libxrender1libxss1libxtst6lsb-releasewgetxdg-utils CentOS Dependenciesalsa-lib.x86_64atk.x86_64cups-libs.x86_64gtk3.x86_64ipa-gothic-fontslibXcomposite.x86_64libXcursor.x86_64libXdamage.x86_64libXext.x86_64libXi.x86_64libXrandr.x86_64libXScrnSaver.x86_64libXtst.x86_64pango.x86_64xorg-x11-fonts-100dpixorg-x11-fonts-75dpixorg-x11-fonts-cyrillicxorg-x11-fonts-miscxorg-x11-fonts-Type1xorg-x11-utilsAfter installing dependencies you need to update nss library using this commandyum update nss -y Check out discussions #290 - Debian troubleshooting #391 - CentOS troubleshooting #379 - Alpine troubleshooting chrome-headless-shell disables GPU compositing​ chrome-headless-shell requires --enable-gpu to enable GPU acceleration in headless mode. const browser = await puppeteer.launch({ headless: 'shell', args: ['--enable-gpu'],}); Setting up GPU with Chrome​ Generally, Chrome should be able to detect and enable GPU if the system has appropriate drivers. For additional tips, see the following blog post https://developer.chrome.com/blog/supercharge-web-ai-testing. Setting Up Chrome Linux Sandbox​ In order to protect the host environment from untrusted web content, Chrome uses multiple layers of sandboxing. For this to work properly, the host should be configured first. If there's no good sandbox for Chrome to use, it will crash with the error No usable sandbox!. If you absolutely trust the content you open in Chrome, you can launch Chrome with the --no-sandbox argument: const browser = await puppeteer.launch({ args: ['--no-sandbox', '--disable-setuid-sandbox'],}); cautionRunning without a sandbox is strongly discouraged. Consider configuring a sandbox instead. The recommended way to run Chrome is using sandboxes Issues with AppArmor on Ubuntu​ Ubuntu 23.10+ (or possibly other Linux distros in the future) ship an AppArmor profile that applies to Chrome stable binaries installed at /opt/google/chrome/chrome (the default installation path). This policy is stored at /etc/apparmor.d/chrome. This AppArmor policy prevents Chrome for Testing binaries downloaded by Puppeteer from using user namespaces resulting in the No usable sandbox! error when trying to launch the browser. For workarounds, see https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md. Using setuid sandbox​ cautionIMPORTANT NOTE: The Linux SUID sandbox is almost but not completely removed. See https://bugs.chromium.org/p/chromium/issues/detail?id=598454 This section is mostly out-of-date. The setuid sandbox comes as a standalone executable and is located next to the Chrome that Puppeteer downloads. It is fine to re-use the same sandbox executable for different Chrome versions, so the following could be done only once per host environment: # cd to Puppeteer cache directory (adjust the path if using a different cache directory).cd ~/.cache/puppeteer/chrome/linux-<version>/chrome-linux64/sudo chown root:root chrome_sandboxsudo chmod 4755 chrome_sandbox# copy sandbox executable to a shared locationsudo cp -p chrome_sandbox /usr/local/sbin/chrome-devel-sandbox# export CHROME_DEVEL_SANDBOX env variableexport CHROME_DEVEL_SANDBOX=/usr/local/sbin/chrome-devel-sandbox You might want to export the CHROME_DEVEL_SANDBOX env variable by default. In this case, add the following to the ~/.bashrc or .zshenv: export CHROME_DEVEL_SANDBOX=/usr/local/sbin/chrome-devel-sandbox or to your Dockerfile: ENV CHROME_DEVEL_SANDBOX /usr/local/sbin/chrome-devel-sandbox Running Puppeteer on Travis CI​ 👋 We ran our tests for Puppeteer on Travis CI until v6.0.0 (when we've migrated to GitHub Actions) - see our historical .travis.yml (v5.5.0) for reference. Tips-n-tricks: xvfb service should be launched in order to run Chrome for Testing in non-headless mode Runs on Xenial Linux on Travis by default Runs npm install by default node_modules is cached by default .travis.yml might look like this: language: node_jsnode_js: nodeservices: xvfbscript: - npm test Running Puppeteer on WSL (Windows subsystem for Linux)​ See this thread with some tips specific to WSL. In a nutshell, you need to install missing dependencies by either: Installing Chrome on WSL to install all dependencies Installing required dependencies manually: sudo apt install libgtk-3-dev libnotify-dev libgconf-2-4 libnss3 libxss1 libasound2. cautionThe list of required dependencies might get outdated and depend on what you already have installed. Running Puppeteer on CircleCI​ Running Puppeteer smoothly on CircleCI requires the following steps: Start with a NodeJS image in your config like so: docker: - image: circleci/node:14 # Use your desired version environment: NODE_ENV: development # Only needed if puppeteer is in `devDependencies` Dependencies like libXtst6 probably need to be installed via apt-get, so use the threetreeslight/puppeteer orb (instructions), or paste parts of its source into your own config. Lastly, if you’re using Puppeteer through Jest, then you may encounter an error spawning child processes: [00:00.0] jest args: --e2e --spec --max-workers=36Error: spawn ENOMEM at ChildProcess.spawn (internal/child_process.js:394:11) This is likely caused by Jest autodetecting the number of processes on the entire machine (36) rather than the number allowed to your container (2). To fix this, set jest --maxWorkers=2 in your test command. Running Puppeteer in Docker​ 👋 We used Cirrus Ci to run our tests for Puppeteer in a Docker container until v3.0.x - see our historical Dockerfile.linux (v3.0.1) for reference. Starting from v16.0.0 we are shipping a Docker image via the GitHub registry. The Dockerfile is located here and the usage instructions are in the Integrations > Docker. The instructions below might be still helpful if you are building your own image. Getting headless Chrome up and running in Docker can be tricky. The bundled Chrome for Testing that Puppeteer installs is missing the necessary shared library dependencies. To fix, you'll need to install the missing dependencies and the latest Chrome for Testing package in your Dockerfile: FROM node:14-slim# Install latest chrome dev package and fonts to support major charsets (Chinese, Japanese, Arabic, Hebrew, Thai and a few others)# Note: this installs the necessary libs to make the bundled version of Chrome for Testing that Puppeteer# installs, work.RUN apt-get update \ && apt-get install -y wget gnupg \ && wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | apt-key add - \ && sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list' \ && apt-get update \ && apt-get install -y google-chrome-stable fonts-ipafont-gothic fonts-wqy-zenhei fonts-thai-tlwg fonts-kacst fonts-freefont-ttf libxss1 \ --no-install-recommends \ && rm -rf /var/lib/apt/lists/*# If running Docker >= 1.13.0 use docker run's --init arg to reap zombie processes, otherwise# uncomment the following lines to have `dumb-init` as PID 1# ADD https://github.com/Yelp/dumb-init/releases/download/v1.2.2/dumb-init_1.2.2_x86_64 /usr/local/bin/dumb-init# RUN chmod +x /usr/local/bin/dumb-init# ENTRYPOINT ["dumb-init", "--"]# Uncomment to skip the Chrome for Testing download when installing puppeteer. If you do,# you'll need to launch puppeteer with:# browser.launch({executablePath: 'google-chrome-stable'})# ENV PUPPETEER_SKIP_DOWNLOAD true# Install puppeteer so it's available in the container.RUN npm init -y && \ npm i puppeteer \ # Add user so we don't need --no-sandbox. # same layer as npm install to keep re-chowned files from using up several hundred MBs more space && groupadd -r pptruser && useradd -r -g pptruser -G audio,video pptruser \ && mkdir -p /home/pptruser/Downloads \ && chown -R pptruser:pptruser /home/pptruser \ && chown -R pptruser:pptruser /node_modules \ && chown -R pptruser:pptruser /package.json \ && chown -R pptruser:pptruser /package-lock.json# Run everything after as non-privileged user.USER pptruserCMD ["google-chrome-stable"] Build the container: docker build -t puppeteer-chrome-linux . Run the container by passing node -e "<yourscript.js content as a string>" as the command: docker run -i --init --rm --cap-add=SYS_ADMIN \ --name puppeteer-chrome puppeteer-chrome-linux \ node -e "`cat yourscript.js`" There's a full example at https://github.com/ebidel/try-puppeteer that shows how to run this Dockerfile from a webserver running on App Engine Flex (Node). Running on Alpine​ Note that Chrome does not support Alpine out of the box so make sure you have compatible system dependencies installed on Alpine and test the image before using it. See https://source.chromium.org/chromium/chromium/src/+/main:chrome/installer/linux/rpm/dist_package_provides.json and https://source.chromium.org/chromium/chromium/src/+/main:chrome/installer/linux/debian/dist_package_versions.json for the list of system packages required on supported distros. CAUTION The current Chromium version in Alpine 3.20 is causing timeout issues with Puppeteer. Downgrading to Alpine 3.19 fixes the issue. See #11640, #12637, #12189 You need to find the newest Chromium package, then look up the supported browser version for Puppeteer and use the coresponding version. Example: Alpine Chromium version: 100 Puppeteer: Puppeteer v13.5.0 Dockerfile: FROM alpine# Installs Chromium (100) package.RUN apk add --no-cache \ chromium \ nss \ freetype \ harfbuzz \ ca-certificates \ ttf-freefont \ nodejs \ yarn...# Tell Puppeteer to skip installing Chrome. We'll be using the installed package.ENV PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser# Puppeteer v13.5.0 works with Chromium 100.RUN yarn add puppeteer@13.5.0# Add user so we don't need --no-sandbox.RUN addgroup -S pptruser && adduser -S -G pptruser pptruser \ && mkdir -p /home/pptruser/Downloads /app \ && chown -R pptruser:pptruser /home/pptruser \ && chown -R pptruser:pptruser /app# Run everything after as non-privileged user.USER pptruser... Running Puppeteer on GitlabCI​ This is very similar to some of the instructions above, but require a bit '''
