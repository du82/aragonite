["https://pptr.dev/api/puppeteer.frame.goto"]
title = "Frame.goto() method | Puppeteer"
description = "Navigates the frame or page to the given url."
full_description = '''FrameFrame.gotoVersion: 24.3.0On this pageFrame.goto() method Navigates the frame or page to the given url. Signature​ class Frame { abstract goto( url: string, options?: GoToOptions, ): Promise<HTTPResponse | null>;} Parameters​ ParameterTypeDescriptionurlstringURL to navigate the frame to. The URL should include scheme, e.g. https://optionsGoToOptions(Optional) Options to configure waiting behavior. Returns: Promise<HTTPResponse | null> A promise which resolves to the main resource response. In case of multiple redirects, the navigation will resolve with the response of the last redirect. Exceptions​ If: there's an SSL error (e.g. in case of self-signed certificates). target URL is invalid. the timeout is exceeded during navigation. the remote server does not respond or is unreachable. the main resource failed to load. Remarks​ Navigation to about:blank or navigation to the same URL with a different hash will succeed and return null. warningHeadless shell mode doesn't support navigation to a PDF document. See the upstream issue. In headless shell, this method will not throw an error when any valid HTTP status code is returned by the remote server, including 404 "Not Found" and 500 "Internal Server Error". The status code for such responses can be retrieved by calling HTTPResponse.status().'''
