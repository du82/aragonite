["https://pptr.dev/api/puppeteer.page.waitforfilechooser"]
title = "Page.waitForFileChooser() method | Puppeteer"
description = "This method is typically coupled with an action that triggers file choosing."
full_description = '''PagePage.waitForFileChooserVersion: 24.3.0On this pagePage.waitForFileChooser() method This method is typically coupled with an action that triggers file choosing. cautionThis must be called before the file chooser is launched. It will not return a currently active file chooser. cautionInterception of file dialogs triggered via DOM APIs such as window.showOpenFilePicker is currently not supported. Signature​ class Page { abstract waitForFileChooser( options?: WaitTimeoutOptions, ): Promise<FileChooser>;} Parameters​ ParameterTypeDescriptionoptionsWaitTimeoutOptions(Optional) Returns: Promise<FileChooser> Remarks​ In the "headful" browser, this method results in the native file picker dialog not showing up for the user. Example​ The following example clicks a button that issues a file chooser and then responds with /tmp/myfile.pdf as if a user has selected this file. const [fileChooser] = await Promise.all([ page.waitForFileChooser(), page.click('#upload-file-button'), // some button that triggers file selection]);await fileChooser.accept(['/tmp/myfile.pdf']);'''
year_published = 2025
clearnet = "https://pptr.dev/api/puppeteer.page.waitforfilechooser"
