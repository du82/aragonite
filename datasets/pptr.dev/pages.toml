["https://pptr.dev/api/puppeteer.elementhandle.__eval"]
title = "ElementHandle.$$eval() method | Puppeteer"
description = "Runs the given function on an array of elements matching the given selector in the current element."
full_description = '''ElementHandleElementHandle.$$evalVersion: 24.3.0On this pageElementHandle.$$eval() method Runs the given function on an array of elements matching the given selector in the current element. If the given function returns a promise, then this method will wait till the promise resolves. Signature​ class ElementHandle { $$eval< Selector extends string, Params extends unknown[], Func extends EvaluateFuncWith< Array<NodeFor<Selector>>, Params > = EvaluateFuncWith<Array<NodeFor<Selector>>, Params>, >( selector: Selector, pageFunction: Func | string, ...args: Params ): Promise<Awaited<ReturnType<Func>>>;} Parameters​ ParameterTypeDescriptionselectorSelectorselector to query the page for. CSS selectors can be passed as-is and a Puppeteer-specific selector syntax allows querying by text, a11y role and name, and xpath and combining these queries across shadow roots. Alternatively, you can specify the selector type using a prefix.pageFunctionFunc | stringThe function to be evaluated in the element's page's context. An array of elements matching the given selector will be passed to the function as its first argument.argsParamsAdditional arguments to pass to pageFunction. Returns: Promise<Awaited<ReturnType<Func>>> A promise to the result of the function. Example​ HTML: <div class="feed"> <div class="tweet">Hello!</div> <div class="tweet">Hi!</div></div> JavaScript: const feedHandle = await page.$('.feed');expect( await feedHandle.$$eval('.tweet', nodes => nodes.map(n => n.innerText)),).toEqual(['Hello!', 'Hi!']);'''
