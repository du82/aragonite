["https://pptr.dev/guides/configuration"]
title = "Configuration | Puppeteer"
description = "By default, Puppeteer downloads and uses a specific version of Chrome so its"
full_description = '''GuidesConfigurationVersion: 24.3.0On this pageConfiguration By default, Puppeteer downloads and uses a specific version of Chrome so its API is guaranteed to work out of the box. To use Puppeteer with a different version of Chrome or Chromium, pass in the executable's path when creating a Browser instance: const browser = await puppeteer.launch({executablePath: '/path/to/Chrome'}); You can also use Puppeteer with Firefox. See status of cross-browser support for more information. All defaults in Puppeteer can be customized in two ways: Configuration files (recommended) Environment variables cautionNote that some options are only customizable through environment variables (such as HTTPS_PROXY). cautionPuppeteer's configuration files and environment variables are ignored by puppeteer-core. Configuration files​ Configuration files are the recommended choice for configuring Puppeteer. Puppeteer will look up the file tree for any of the following formats: .puppeteerrc.cjs, .puppeteerrc.js, .puppeteerrc (YAML/JSON), .puppeteerrc.json, .puppeteerrc.yaml, puppeteer.config.js, and puppeteer.config.cjs See the Configuration interface for possible options. Changing download options​ When the changes to the configuration include changes to download option, you will need to re-run postinstall scripts for them to take effect. This can most easily be done with running: npmYarnpnpmnpx puppeteer browsers installyarn dlx puppeteer browsers installpnpm dlx puppeteer browsers install Examples​ Downloading multiple browsers​ Starting with v23.0.0, Puppeteer allows downloading multiple browser without the need to run multiple commands. Update the Puppeteer configuration file: project-directory/.puppeteerrc.cjs/** * @type {import("puppeteer").Configuration} */module.exports = { // Download Chrome (default `skipDownload: false`). chrome: { skipDownload: false, }, // Download Firefox (default `skipDownload: true`). firefox: { skipDownload: false, },}; Run CLI to download the new configuration: npmYarnpnpmnpx puppeteer browsers installyarn dlx puppeteer browsers installpnpm dlx puppeteer browsers install Changing the default cache directory​ Starting in v19.0.0, Puppeteer stores browsers in ~/.cache/puppeteer to globally cache browsers between installation. This can cause problems if puppeteer is packed during some build step and moved to a fresh location. The following configuration can solve this issue (reinstall puppeteer to take effect): project-directory/.puppeteerrc.cjsconst {join} = require('path');/** * @type {import("puppeteer").Configuration} */module.exports = { // Changes the cache location for Puppeteer. cacheDirectory: join(__dirname, '.cache', 'puppeteer'),}; noteNotice this is only possible with CommonJS configuration files as information about the ambient environment is needed (in this case, __dirname). Environment variables​ Along with configuration files, Puppeteer looks for certain environment variables for customizing behavior. Environment variables will always override configuration file options when applicable. The following options are environment-only options HTTP_PROXY, HTTPS_PROXY, NO_PROXY - defines HTTP proxy settings that are used to download and run the browser. All other options can be found in the documentation for the Configuration interface.'''
