["https://pptr.dev/next/api/puppeteer.httpresponse"]
title = "HTTPResponse class | Puppeteer"
description = "The HTTPResponse class represents responses which are received by the Page class."
full_description = '''HTTPResponseVersion: NextOn this pageHTTPResponse class The HTTPResponse class represents responses which are received by the Page class. Signature​ export declare abstract class HTTPResponse Remarks​ The constructor for this class is marked as internal. Third-party code should not call the constructor directly or create subclasses that extend the HTTPResponse class. Methods​ MethodModifiersDescriptionbuffer()Promise which resolves to a buffer with response body.Remarks:The buffer might be re-encoded by the browser based on HTTP-headers or other heuristics. If the browser failed to detect the correct encoding, the buffer might be encoded incorrectly. See https://github.com/puppeteer/puppeteer/issues/6478.content()Promise which resolves to a buffer with response body.Remarks:The buffer might be re-encoded by the browser based on HTTP-headers or other heuristics. If the browser failed to detect the correct encoding, the buffer might be encoded incorrectly. See https://github.com/puppeteer/puppeteer/issues/6478.frame()A Frame that initiated this response, or null if navigating to error pages.fromCache()True if the response was served from either the browser's disk cache or memory cache.fromServiceWorker()True if the response was served by a service worker.headers()An object with HTTP headers associated with the response. All header names are lower-case.json()Promise which resolves to a JSON representation of response body.Remarks:This method will throw if the response body is not parsable via JSON.parse.ok()True if the response was successful (status in the range 200-299).remoteAddress()The IP address and port number used to connect to the remote server.request()A matching HTTPRequest object.securityDetails()SecurityDetails if the response was received over the secure connection, or null otherwise.status()The status code of the response (e.g., 200 for a success).statusText()The status text of the response (e.g. usually an "OK" for a success).text()Promise which resolves to a text (utf8) representation of response body.timing()Timing information related to the response.url()The URL of the response.'''
