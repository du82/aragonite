["https://pptr.dev/api/puppeteer.httprequest.redirectchain"]
title = "HTTPRequest.redirectChain() method | Puppeteer"
description = "A redirectChain is a chain of requests initiated to fetch a resource."
full_description = "HTTPRequestHTTPRequest.redirectChainVersion: 24.3.0On this pageHTTPRequest.redirectChain() method A redirectChain is a chain of requests initiated to fetch a resource. Signature​ class HTTPRequest { abstract redirectChain(): HTTPRequest[];} Returns: HTTPRequest[] the chain of requests - if a server responds with at least a single redirect, this chain will contain all requests that were redirected. Remarks​ redirectChain is shared between all the requests of the same chain. For example, if the website http://example.com has a single redirect to https://example.com, then the chain will contain one request: const response = await page.goto('http://example.com');const chain = response.request().redirectChain();console.log(chain.length); // 1console.log(chain[0].url()); // 'http://example.com' If the website https://google.com has no redirects, then the chain will be empty: const response = await page.goto('https://google.com');const chain = response.request().redirectChain();console.log(chain.length); // 0"
year_published = 2025
