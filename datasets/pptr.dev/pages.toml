full_description = "OtherLaunchOptionsVersion: 24.3.0On this pageLaunchOptions interface Generic launch options that can be passed when launching any browser. Signature​ export interface LaunchOptions extends ConnectOptions Extends: ConnectOptions Properties​ PropertyModifiersTypeDescriptionDefaultargsoptionalstring[]Additional command line arguments to pass to the browser instance.browseroptionalSupportedBrowserWhich browser to launch.chromechanneloptionalChromeReleaseChannelIf specified for Chrome, looks for a regular Chrome installation at a known system location instead of using the bundled Chrome binary.debuggingPortoptionalnumberSpecify the debugging port number to usedevtoolsoptionalbooleanWhether to auto-open a DevTools panel for each tab. If this is set to true, then headless will be forced to false.falsedumpiooptionalbooleanIf true, pipes the browser process stdout and stderr to process.stdout and process.stderr.falseenvoptionalRecord<string, string | undefined>Specify environment variables that will be visible to the browser.The contents of process.env.executablePathoptionalstringPath to a browser executable to use instead of the bundled browser. Note that Puppeteer is only guaranteed to work with the bundled browser, so use this setting at your own risk.Remarks:When using this is recommended to set the browser property as well as Puppeteer will default to chrome by default.extraPrefsFirefoxoptionalRecord<string, unknown>Additional preferences that can be passed when launching with Firefox.handleSIGHUPoptionalbooleanClose the browser process on SIGHUP.truehandleSIGINToptionalbooleanClose the browser process on Ctrl+C.truehandleSIGTERMoptionalbooleanClose the browser process on SIGTERM.trueheadlessoptionalboolean | 'shell'Whether to run the browser in headless mode.Remarks: true launches the browser in the new headless mode. 'shell' launches shell known as the old headless mode. trueignoreDefaultArgsoptionalboolean | string[]If true, do not use puppeteer.defaultArgs() when creating a browser. If an array is provided, these args will be filtered out. Use this with care - you probably want the default arguments Puppeteer uses.falsepipeoptionalbooleanConnect to a browser over a pipe instead of a WebSocket. Only supported with Chrome.falsetimeoutoptionalnumberMaximum time in milliseconds to wait for the browser to start. Pass 0 to disable the timeout.30_000 (30 seconds).userDataDiroptionalstringPath to a user data directory. see the Chromium docs for more info.waitForInitialPageoptionalbooleanWhether to wait for the initial page to be ready. Useful when a user explicitly disables that (e.g. --no-startup-window for Chrome).true"
