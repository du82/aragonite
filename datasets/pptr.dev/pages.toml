["https://pptr.dev/api/puppeteer.page.waitforselector"]
title = "Page.waitForSelector() method | Puppeteer"
description = "Wait for the selector to appear in page. If at the moment of calling the method the selector already exists, the method will return immediately. If the selector doesn't appear after the timeout milliseconds of waiting, the function will throw."
full_description = "PagePage.waitForSelectorVersion: 24.3.0On this pagePage.waitForSelector() method Wait for the selector to appear in page. If at the moment of calling the method the selector already exists, the method will return immediately. If the selector doesn't appear after the timeout milliseconds of waiting, the function will throw. Signature​ class Page { waitForSelector<Selector extends string>( selector: Selector, options?: WaitForSelectorOptions, ): Promise<ElementHandle<NodeFor<Selector>> | null>;} Parameters​ ParameterTypeDescriptionselectorSelectorselector to query the page for. CSS selectors can be passed as-is and a Puppeteer-specific selector syntax allows querying by text, a11y role and name, and xpath and combining these queries across shadow roots. Alternatively, you can specify the selector type using a prefix.optionsWaitForSelectorOptions(Optional) Optional waiting parameters Returns: Promise<ElementHandle<NodeFor<Selector>> | null> Promise which resolves when element specified by selector string is added to DOM. Resolves to null if waiting for hidden: true and selector is not found in DOM. Remarks​ The optional Parameter in Arguments options are: visible: A boolean wait for element to be present in DOM and to be visible, i.e. to not have display: none or visibility: hidden CSS properties. Defaults to false. hidden: Wait for element to not be found in the DOM or to be hidden, i.e. have display: none or visibility: hidden CSS properties. Defaults to false. timeout: maximum time to wait for in milliseconds. Defaults to 30000 (30 seconds). Pass 0 to disable timeout. The default value can be changed by using the Page.setDefaultTimeout() method. Example​ This method works across navigations: import puppeteer from 'puppeteer';(async () => { const browser = await puppeteer.launch(); const page = await browser.newPage(); let currentURL; page .waitForSelector('img') .then(() => console.log('First URL with image: ' + currentURL)); for (currentURL of [ 'https://example.com', 'https://google.com', 'https://bbc.com', ]) { await page.goto(currentURL); } await browser.close();})();"
year_published = 2025
