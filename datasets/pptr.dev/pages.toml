description = "Target represents a CDP target. In CDP a target is something that can be debugged such a frame, a page or a worker."
full_description = 'TargetVersion: NextOn this pageTarget class Target represents a CDP target. In CDP a target is something that can be debugged such a frame, a page or a worker. Signature​ export declare abstract class Target Remarks​ The constructor for this class is marked as internal. Third-party code should not call the constructor directly or create subclasses that extend the Target class. Methods​ MethodModifiersDescriptionasPage()Forcefully creates a page for a target of any type. It is useful if you want to handle a CDP target of type other as a page. If you deal with a regular page target, use Target.page().browser()Get the browser the target belongs to.browserContext()Get the browser context the target belongs to.createCDPSession()Creates a Chrome Devtools Protocol session attached to the target.opener()Get the target that opened this target. Top-level targets return null.page()If the target is not of type "page", "webview" or "background_page", returns null.type()Identifies what kind of target this is.Remarks:See docs for more info about background pages.url()worker()If the target is not of type "service_worker" or "shared_worker", returns null.'
