["https://pptr.dev/api/puppeteer.page.setrequestinterception"]
title = "Page.setRequestInterception() method | Puppeteer"
description = "Activating request interception enables HTTPRequest.abort(), HTTPRequest.continue() and HTTPRequest.respond() methods. This provides the capability to modify network requests that are made by a page."
full_description = "PagePage.setRequestInterceptionVersion: 24.3.0On this pagePage.setRequestInterception() method Activating request interception enables HTTPRequest.abort(), HTTPRequest.continue() and HTTPRequest.respond() methods. This provides the capability to modify network requests that are made by a page. Once request interception is enabled, every request will stall unless it's continued, responded or aborted; or completed using the browser cache. See the Request interception guide for more details. Signature​ class Page { abstract setRequestInterception(value: boolean): Promise<void>;} Parameters​ ParameterTypeDescriptionvaluebooleanWhether to enable request interception. Returns: Promise<void> Example​ An example of a naïve request interceptor that aborts all image requests: import puppeteer from 'puppeteer';(async () => { const browser = await puppeteer.launch(); const page = await browser.newPage(); await page.setRequestInterception(true); page.on('request', interceptedRequest => { if ( interceptedRequest.url().endsWith('.png') || interceptedRequest.url().endsWith('.jpg') ) interceptedRequest.abort(); else interceptedRequest.continue(); }); await page.goto('https://example.com'); await browser.close();})();"
year_published = 2025
clearnet = "https://pptr.dev/api/puppeteer.page.setrequestinterception"
