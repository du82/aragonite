["https://pptr.dev/api/puppeteer.keyboard.down"]
title = "Keyboard.down() method | Puppeteer"
description = "Dispatches a keydown event."
full_description = "KeyboardKeyboard.downVersion: 24.3.0On this pageKeyboard.down() method Dispatches a keydown event. Signature​ class Keyboard { abstract down( key: KeyInput, options?: Readonly<KeyDownOptions>, ): Promise<void>;} Parameters​ ParameterTypeDescriptionkeyKeyInputName of key to press, such as ArrowLeft. See KeyInput for a list of all key names.optionsReadonly<KeyDownOptions>(Optional) An object of options. Accepts text which, if specified, generates an input event with this text. Accepts commands which, if specified, is the commands of keyboard shortcuts, see Chromium Source Code for valid command names. Returns: Promise<void> Remarks​ If key is a single character and no modifier keys besides Shift are being held down, a keypress/input event will also generated. The text option can be specified to force an input event to be generated. If key is a modifier key, Shift, Meta, Control, or Alt, subsequent key presses will be sent with that modifier active. To release the modifier key, use Keyboard.up(). After the key is pressed once, subsequent calls to Keyboard.down() will have repeat set to true. To release the key, use Keyboard.up(). Modifier keys DO influence Keyboard.down(). Holding down Shift will type the text in upper case."
