full_description = "FrameFrame.$$evalVersion: 24.3.0On this pageFrame.$$eval() method Runs the given function on an array of elements matching the given selector in the frame. If the given function returns a promise, then this method will wait till the promise resolves. Signature​ class Frame { $$eval< Selector extends string, Params extends unknown[], Func extends EvaluateFuncWith< Array<NodeFor<Selector>>, Params > = EvaluateFuncWith<Array<NodeFor<Selector>>, Params>, >( selector: Selector, pageFunction: string | Func, ...args: Params ): Promise<Awaited<ReturnType<Func>>>;} Parameters​ ParameterTypeDescriptionselectorSelectorselector to query the page for. CSS selectors can be passed as-is and a Puppeteer-specific selector syntax allows querying by text, a11y role and name, and xpath and combining these queries across shadow roots. Alternatively, you can specify the selector type using a prefix.pageFunctionstring | FuncThe function to be evaluated in the frame's context. An array of elements matching the given selector will be passed to the function as its first argument.argsParamsAdditional arguments to pass to pageFunction. Returns: Promise<Awaited<ReturnType<Func>>> A promise to the result of the function. Example​ const divsCounts = await frame.$$eval('div', divs => divs.length);"
