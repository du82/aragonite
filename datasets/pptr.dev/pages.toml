full_description = '''ChangelogVersion: 24.3.0On this pageChangelog Combined changelog for puppeteer and puppeteer-core. 24.3.0 (2025-02-24)​ Miscellaneous Chores​ puppeteer: Synchronize puppeteer versions Dependencies​ The following workspace dependencies were updated dependencies puppeteer-core bumped from 24.2.1 to 24.3.0 Features​ expose CDPSession.detached (#13615) (33e3e83) Bug Fixes​ do not throw an error when a navigation is aborted (#13621) (89d71a2) roll to Chrome 133.0.6943.126 (#13623) (09e4404) roll to Firefox 135.0.1 (#13622) (ce10410) 24.2.1 (2025-02-13)​ Bug Fixes​ change Browser.setCookie type to be CookieData (#13593) (8971cc2) don't wait for activation if the connection is disconnected (#13591) (6b20ac1) network: propagate CDP error in interception (#13607) (2f470cd) roll to Chrome 133.0.6943.98 (#13611) (ea11a46) Dependencies​ The following workspace dependencies were updated dependencies puppeteer-core bumped from 24.2.0 to 24.2.1 24.2.0 (2025-02-05)​ Features​ add keyboard-lock and pointer-lock permissions (#13586) (108cd53) roll to Chrome 133.0.6943.53 (#13584) (a63d568) roll to Firefox 135.0 (#13587) (b42c046) Dependencies​ The following workspace dependencies were updated dependencies @puppeteer/browsers bumped from 2.7.0 to 2.7.1 Bug Fixes​ roll to Chrome 132.0.6834.159 (#13566) (416534b) webdriver: make sure user agent can be set twice (#13585) (411ff95) 24.1.1 (2025-01-23)​ Miscellaneous Chores​ puppeteer: Synchronize puppeteer versions Dependencies​ The following workspace dependencies were updated dependencies puppeteer-core bumped from 24.1.0 to 24.1.1 Bug Fixes​ dispose the isolated handle (#13542) (f9ed75e) roll to Chrome 132.0.6834.110 (#13543) (2d2d214) roll to Firefox 134.0.2 (#13538) (82ec05d) webdriver: use correct units for format pdf option (#13516) (c764f82) 24.1.0 (2025-01-15)​ Features​ roll to Chrome 132.0.6834.83 (#13507) (e282992) Dependencies​ The following workspace dependencies were updated dependencies puppeteer-core