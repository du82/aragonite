["https://pptr.dev/api/puppeteer.accessibility"]
title = "Accessibility class | Puppeteer"
description = "The Accessibility class provides methods for inspecting the browser's accessibility tree. The accessibility tree is used by assistive technology such as screen readers or switches."
full_description = '''AccessibilityVersion: 24.3.0On this pageAccessibility class The Accessibility class provides methods for inspecting the browser's accessibility tree. The accessibility tree is used by assistive technology such as screen readers or switches. Signature​ export declare class Accessibility Remarks​ Accessibility is a very platform-specific thing. On different platforms, there are different screen readers that might have wildly different output. Blink - Chrome's rendering engine - has a concept of "accessibility tree", which is then translated into different platform-specific APIs. Accessibility namespace gives users access to the Blink Accessibility Tree. Most of the accessibility tree gets filtered out when converting from Blink AX Tree to Platform-specific AX-Tree or by assistive technologies themselves. By default, Puppeteer tries to approximate this filtering, exposing only the "interesting" nodes of the tree. The constructor for this class is marked as internal. Third-party code should not call the constructor directly or create subclasses that extend the Accessibility class. Methods​ MethodModifiersDescriptionsnapshot(options)Captures the current state of the accessibility tree. The returned object represents the root accessible node of the page.Remarks:NOTE The Chrome accessibility tree contains nodes that go unused on most platforms and by most screen readers. Puppeteer will discard them as well for an easier to process tree, unless interestingOnly is set to false.'''
year_published = 2025
