["https://practicaltypography.com/what-is-good-typography.html"]
title = "What is good typography? | Butterick’s Practical Typography"
description = "Butterick’s Practical Typography"
full_description = "what is good typography?Reinforces the meaning of the textGood ty­pog­ra­phy re­in­forces the mean­ing of the text.Al­most all texts com­mu­ni­cate a set of points (The pe­ti­tion should be de­nied for three rea­sons). Some­times a text also needs to in­struct the reader (Add lines 7 through 21 and en­ter the to­tal here). Other texts of­fer warn­ings or ad­mo­ni­tions (You must be 48 inches tall to ride; Speed limit 75). In every case, good ty­pog­ra­phy sup­ports and re­in­forces the mes­sage. Good ty­pog­ra­phy makes the text more effective.Three sub­sidiary propo­si­tions flow from this:Good ty­pog­ra­phy is mea­sured by how well it re­in­forces the mean­ing of the text, not by some ab­stract scale of merit. Ty­po­graphic choices that work for one text won’t nec­es­sar­ily work for an­other. Corol­lary: good ty­pog­ra­phers don’t rely on rote so­lu­tions. One size never fits all.For a given text, many ty­po­graphic so­lu­tions would work equally well. Ty­pog­ra­phy is not an al­ge­bra prob­lem with one cor­rect answer.Your abil­ity to pro­duce good ty­pog­ra­phy de­pends on how well you un­der­stand the goals of your text, not on taste or vi­sual train­ing. Corol­lary: if you mis­un­der­stand the goals of your text, good ty­pog­ra­phy be­comes purely a mat­ter of luck.Pause to con­sider propo­si­tion #3. Ty­pog­ra­phy is vi­sual, so it’s easy to con­clude that it’s pri­mar­ily an artis­tic or aes­thetic pur­suit. Not so. Ty­pog­ra­phy is pri­mar­ily utilitarian.There­fore, good ty­pog­ra­phy is mea­sured on a util­i­tar­ian yard­stick. Ty­pog­ra­phy that is aes­thet­i­cally pleas­ant, but that doesn’t re­in­force the mean­ing of the text, is a fail­ure. Ty­pog­ra­phy that re­in­forces the mean­ing of the text, even if aes­thet­i­cally un­pleas­ant, is a success.Does that mean that ef­fec­tive ty­pog­ra­phy can be ugly? Sure. Some­times ugly is bet­ter than pretty.Look at the high­way signs again.For these rea­sons, high­way-sig­nage fonts have been the sub­ject of rig­or­ous leg­i­bil­ity testing.The script font used on the sec­ond sign could be called “pret­tier” than the stan­dard high­way-sig­nage font. But a high­way sign has a spe­cial pur­pose: it’s meant to be read quickly, from long dis­tances, at odd an­gles, and un­der vari­able light­ing and weather. The high­way-sig­nage font stays leg­i­ble un­der all these con­di­tions. It’s good ty­pog­ra­phy be­cause it sup­ports the sign’s message.The script font may be pret­tier, but in this con­text, it’s bad ty­pog­ra­phy be­cause it’s not suited to the task. Con­versely, the high­way-sig­nage font would look ter­ri­ble on a wed­ding in­vi­ta­tion, where the script font would be appropriate.A re­lated example:Here, the same font is used in all three ver­sions of this sign. But the first two signs fail to de­liver the mes­sage—the speed limit is 75—be­cause the ty­pog­ra­phy un­der­mines the text. The most im­por­tant el­e­ment is the num­ber 75. Also im­por­tant is the cap­tion speed limit. Only the third ver­sion gets the bal­ance right. It’s the only ex­am­ple of good ty­pog­ra­phy among the three.Use this prin­ci­ple to test the qual­ity of your own ty­po­graphic work. The ad­van­tage of a util­i­tar­ian bench­mark over an aes­thetic one is that it doesn’t re­quire aes­thetic judg­ment. Trust me—if you’re just start­ing out in ty­pog­ra­phy, you’ll pro­duce some ugly work. Don’t worry. If it’s ugly and ef­fec­tive, you’re mak­ing progress.by the wayA pop­u­lar but flawed line of rea­son­ing holds that the best ty­pog­ra­phy is “in­vis­i­ble”. This idea dates back at least to Beat­rice Warde’s 1932 es­say “The Crys­tal Gob­let”, and has en­joyed a re­cent vogue among de­sign­ers ea­ger to sound trendy. I dis­sent—see Drown­ing the Crys­tal Gob­let.“Can’t leg­i­bil­ity be re­solved by re­search?” Re­search can help if the de­sign con­text is spe­cific enough to per­mit testable propo­si­tions. But in gen­eral, leg­i­bil­ity is largely a mat­ter of ac­cli­ma­tion, not em­pir­ics—as proof, con­sider the huge range of writ­ing sys­tems that hu­man civ­i­liza­tions have suc­cess­fully used. (For more on the role of leg­i­bil­ity re­search, see are two spaces bet­ter than one.)"
year_published = 2025
