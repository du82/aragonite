full_description = "Calibri alternativesDon’t settle for a default Microsoft fontcal­ibricon­courseguardian sansser­avekfortLike Cam­bria, Cal­ibri works well on screen. But in print, its rounded cor­ners make body text look soft. If you need a clean sans serif font, you have bet­ter op­tions. My font Con­course, for in­stance. Guardian Sans is the com­pan­ion to Guardian Egypt­ian (see Cam­bria al­ter­na­tives). They’re named af­ter the news­pa­per that orig­i­nally had them de­signed. Ser­avek and Fort are both sharper than Cal­ibri—Ser­avek is sim­i­larly nar­row, while Fort is wider and more open."
