full_description = "Georgia alternativesDon’t use a screen font for printgeor­giamillercen­tury suprahar­rietchron­i­cleOne of the most pop­u­lar foun­da­tions for re­cent text fam­i­lies has been the his­tor­i­cal model known as Scotch, from the mid-19th cen­tury. One ex­am­ple is Geor­gia, which was de­signed pri­mar­ily to work well on com­puter screens of the 1990s. But 20 years on, its de­sign com­pro­mises are be­com­ing ob­so­lete. Miller, by con­trast, shares Geor­gia’s Scotch in­flu­ence but with more sub­tlety and de­tail. (See sys­tem fonts for a closer com­par­i­son.) Har­riet, Chron­i­cle, and Cen­tury Supra—the last is my de­sign—are also based on the Scotch model but add con­tem­po­rary de­tails and flavor."
