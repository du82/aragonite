title = "Body text | Butterick’s Practical Typography"
description = "Butterick’s Practical Typography"
full_description = "body textFour important considerationsPlease note:BODY TEXT*is the most com­monel­e­ment of a doc­u­ment.There­fore, how the bodytext looks will have themost no­tice­able ef­fecton the ap­pear­anceof the doc­u­ment.Con­se­quently,you shouldset up thebody textFIRST.* Mean­ing, the text that forms the main con­tent of your document.Start withfont, point size,line spac­ing, andline length, be­causethose four de­ci­sions willlargely de­ter­mine howthe body text willlook. OK?by the wayThough I’ll stop short of call­ing it a rule, I strongly rec­om­mend us­ing a serif font—not a sans serif font—for body text in print. Most books, news­pa­pers, and mag­a­zines use serif fonts for body text. It’s the tra­di­tional choice and still the best choice.On the web, body text can be in a sans serif or serif font. Sans ser­ifs were once pre­ferred for screen text be­cause they ren­dered bet­ter on the lower-res­o­lu­tion screens of the past. (That’s why most graph­i­cal user in­ter­faces are built around sans serif fonts). But on to­day’s screens, serif fonts look equally good."
