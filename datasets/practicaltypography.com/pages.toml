["https://practicaltypography.com/centered-text.html"]
title = "Centered text | Butterick’s Practical Typography"
description = "Butterick’s Practical Typography"
full_description = "centered textIt’s boring—use sparinglyCen­tered text is overused. It’s the ty­po­graphic equiv­a­lent of vanilla ice cream—safe but bor­ing. It’s rare to see text cen­tered in a book, news­pa­per, or mag­a­zine, ex­cept for the oc­ca­sional head­line or ti­tle. Asym­me­try is noth­ing to fear.Yet it is feared. So for all the fans of cen­tered text, a poem:An Ode to Cen­tered TextCen­tered text is ac­cept­able when used for short phrases or ti­tles,like the name on your busi­ness cards or let­ter­head.Or in doc­u­ments, you can cen­ter ma­jor sec­tion head­ingslike “In­tro­duc­tion” and “Table of Con­tents”.But if you en­joy cen­ter­ing text, thenyou should learn to use thehard line breakso your lines startin sen­si­bleplaces.OK?Whole text blocks should not be cen­tered. Cen­ter­ing makes text blocks dif­fi­cult to read be­cause both edges of the text block are un­even. Cen­tered text blocks are also dif­fi­cult to align with other page el­e­ments. See head­ings for bet­ter options."
