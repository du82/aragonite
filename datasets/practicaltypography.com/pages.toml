["https://practicaltypography.com/courier-alternatives.html"]
title = "Courier alternatives | Butterick’s Practical Typography"
description = "Butterick’s Practical Typography"
full_description = "Courier alternativesWhen you must use a monospaced fontcourier newtrip­li­catepitchin­putfira monoI’m in an awk­ward po­si­tion. As your ty­pog­ra­phy ad­vi­sor, I’ve coun­seled you not to use mono­spaced fonts.But the truth is—I really like them. The golden age of mono­spaced fonts was prob­a­bly the 1950s, when IBM led the type­writer in­dus­try and re­leased a se­ries of great mono­spaced de­signs. One of these was Courier. But the sys­tem font Courier New is a beastly im­i­ta­tion of the orig­i­nal: spindly, lumpy, and just plain ugly.As an an­ti­dote, I’ve cre­ated Trip­li­cate, a mono­spaced font fam­ily in­flu­enced by sev­eral type­writer fonts of the ’50s, and op­ti­mized for body text. Trip­li­cate has gen­uine italic styles (in­stead of a sloped ro­man like Courier) and small caps too.Pitch and In­put show there’s still room for de­sign ex­plo­ration in mono­spaced fonts. Fira Mono is also very nice, and one of the few free fonts I rec­om­mend with­out reservation."
