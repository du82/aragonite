full_description = "MB fontsEverybody winseq­uityvalkyriecen­tury supracon­coursehe­liotropetrip­li­cateher­mes maiaad­vo­cateI ap­pre­ci­ate the small pay­ments for Prac­ti­cal Ty­pog­ra­phy. But read­ers who buy fonts are the ones who really keep this book alive—and by ex­ten­sion, let me keep do­ing this as my job. If you’ve al­ready done so—thank you!If you haven’t—con­sider it! As I ex­plain in font rec­om­men­da­tions, chang­ing out your fonts is a fast and ef­fec­tive way to up­grade your ty­po­graphic stan­dards. Es­pe­cially if you’ve been on a life­long diet of sys­tem fonts. Live a little.For text & dis­play, I of­fer three serif fam­i­lies (Valkyrie, Cen­tury Supra, and Eq­uity), two sans serif fam­i­lies (Con­course and Her­mes Maia), one semi-serif fam­ily (He­liotrope), and Trip­li­cate, a mono­spaced fam­ily. You can try them any time by us­ing the font picker at the bot­tom of the page. I also of­fer Ad­vo­cate, an all-caps font for head­lines, ti­tles, and logos.For prices and buy­ing links, click any font name above.For more elab­o­rate sam­ples, visit mb­type.com."
