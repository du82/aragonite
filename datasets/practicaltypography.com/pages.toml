["https://practicaltypography.com/concourse-index.html"]
title = "Concourse Index | Butterick’s Practical Typography"
description = "Butterick’s Practical Typography"
full_description = "Concourse IndexHere at Prac­ti­cal Ty­pog­ra­phy you may have no­ticed the snazzy num­bered list bullets:LikeTheseHere div.no-reset ol {counter-reset: none;} div.ten ol {counter-reset: foobar 10;} div.fortyone ol {counter-reset: foobar 41;} div.fiftyfive ol {counter-reset: foobar 55;} div.ninetyeight ol {counter-reset: foobar 98;} Yes I didThese are pro­vided by a spe­cial font called Con­course In­dex that I de­rived from my Con­course fam­ily. With Open­Type lig­a­tures ac­ti­vated, you get dou­ble digits:From elevenTo forty-twoAnd fifty-sixThrough ninety-nineAmazing—Tell me moreThe de­fault fig­ures are in­side white cir­cles. Other styles are in­cluded as Open­Type fea­tures:With styl­is­tic set 1, you get white squares.With styl­is­tic set 2, black circles.And with styl­is­tic set 3, black squares.Fantastic—How much?This font is too triv­ial to charge for. So you can down­load it for free.You can’t be seriousYes I am. However—By down­load­ing, you agree to abide by the terms of my stan­dard font license.This is not an open-source font. Mean­ing: you can’t re­dis­trib­ute copies (be­yond what’s per­mit­ted in my li­cense) or use it as the ba­sis of de­riv­a­tive works.I can’t of­fer sup­port for Con­course In­dex un­less you’re a paid cus­tomer of one of my other fonts.Down­load Con­course In­dex (<200k zip file)"
