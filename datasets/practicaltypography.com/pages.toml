["https://practicaltypography.com/all-caps.html"]
title = "All caps | Butterick’s Practical Typography"
description = "Butterick’s Practical Typography"
full_description = "all capsFine for less than one lineAll-caps text—mean­ing text with all the let­ters cap­i­tal­ized—is best used sparingly.At stan­dard body text sizes, cap­i­tal let­ters—or sim­ply caps—are harder to read than nor­mal low­er­case text. Why? We read more low­er­case text, so as a mat­ter of habit, low­er­case is more fa­mil­iar and thus more leg­i­ble. Fur­ther­more, cog­ni­tive re­search has sug­gested that the shapes of low­er­case let­ters—some tall (d h k l), some short (a e n s), some de­scend­ing (g y p q)—cre­ate a var­ied vi­sual con­tour that helps our brain rec­og­nize words. Cap­i­tal­iza­tion ho­mog­e­nizes these shapes, leav­ing a rec­tan­gu­lar contour.Legible ShapesvariedLEGIBLE SHAPESrectangularThat doesn’t mean you shouldn’t use caps. But use them ju­di­ciously. Caps are suit­able for head­ings shorter than one line (e.g., “Table of Con­tents”), head­ers, foot­ers, cap­tions, or other la­bels. Caps work at small point sizes. Caps work well on let­ter­head and busi­ness cards. Al­ways add let­terspac­ing to caps to make them eas­ier to read, and make sure kern­ing is turned on.DON’T CAP­I­TAL­IZE WHOLE PARA­GRAPHS. THIS HABIT ORIG­I­NATED WITH LAWYERS AND HAS IN­FECTED SO­CI­ETY AT LARGE. MANY WRIT­ERS SEEM TO THINK THAT CAP­I­TAL­IZA­TION COM­MU­NI­CATES AU­THOR­ITY AND IM­POR­TANCE. “HEY, LOOK HERE, I’VE GOT SOME­THING IM­POR­TANT TO SAY! I DE­MAND THAT YOU PAY AT­TEN­TION TO THIS!” BUT A PARA­GRAPH SET IN ALL CAPS IS VERY HARD TO READ. IT’S EVEN WORSE IN BOLD. AS THE PARA­GRAPH WEARS ON, READ­ERS FA­TIGUE. IN­TER­EST WANES. HOW ABOUT YOU? DO YOU EN­JOY READ­ING THIS? I DOUBT IT. BUT I REG­U­LARLY SEE CAP­I­TAL­IZED PARA­GRAPHS THAT ARE MUCH LONGER THAN THIS. DO YOUR READ­ERS A FA­VOR. STOP CAP­I­TAL­IZ­ING WHOLE PARAGRAPHS.The terms up­per­case and low­er­case come from tra­di­tional print shops. Cap­i­tal let­ters, used less fre­quently, were stored in a case on a shelf above the other let­ters (then called mi­nus­cule letters).All-caps para­graphs are an ex­am­ple of self-de­feat­ing ty­pog­ra­phy. If you need read­ers to pay at­ten­tion to an im­por­tant part of your doc­u­ment, the last thing you want is for them to skim over it. But that’s what in­evitably hap­pens with all-caps para­graphs be­cause they’re so hard to read.To em­pha­size a para­graph, you have bet­ter op­tions. Use rules and bor­ders. Add a head­ing that la­bels it Im­por­tant. Run it in a larger point size. But don’t cap­i­tal­ize it.There are two ways to put caps in a doc­u­ment. The pop­u­lar method is to en­gage the caps-lock key at the left edge of the key­board and type away. That works, but it makes cap­i­tal­iza­tion a per­ma­nent fea­ture of your text.The pre­ferred method is to ap­ply all-caps for­mat­ting to nor­mally typed text. That way, you can tog­gle cap­i­tal­iza­tion on and off with­out re­typ­ing the text itself.How to apply all-caps formattingWordcon­trol + shift + aMac OS Word⌘ + shift + aPagesFormat → Font → Capitalization → All CapsCSStext-trans­form: uppercaseby the wayNicer pro­fes­sional fonts in­clude al­ter­nate fig­ures and punc­tu­a­tion that are de­signed to align cor­rectly with caps. These al­ter­nates are avail­able as Open­Type fea­tures.Caps are of­ten found in le­gal con­tracts, like war­ranties and EU­LAs, be­cause many law­yers be­lieve that caps are re­quired by con­tract laws that call for “con­spic­u­ous” text. Oh really? The Uni­form Com­mer­cial Code de­fines “con­spic­u­ous” as “writ­ten, dis­played, or pre­sented [so] that a rea­son­able per­son against which it is to op­er­ate ought to have no­ticed it,” but notes that “[w]het­her a term is ‘con­spic­u­ous’ or not is a de­ci­sion for the court.” (UCC § 1-201(b)(10).) Fur­ther­more, the US Ninth Cir­cuit Court of Ap­peals has writ­ten that “[l]awyers who think their caps lock keys are in­stant ‘make con­spic­u­ous’ but­tons are de­luded. In de­ter­min­ing whether a term is con­spic­u­ous, we look at more than for­mat­ting.” (In re Bas­sett, 285 F.3d 882, 886 (9th Cir. 2002).) My com­pli­ments to those who take this sug­ges­tion seriously.“Why re­ject un­der­lin­ing but not caps? Aren’t they both type­writer habits?” No. Caps are the orig­i­nal al­pha­betic char­ac­ters. They are part of the old­est tra­di­tions of our writ­ten lan­guage. Un­der­lin­ing can­not claim a sim­i­lar pedi­gree. Caps in Eng­lish de­scend di­rectly from the Latin al­pha­bet. (That’s why ba­sic, un­styled fonts are called ro­man.) Through the early Mid­dle Ages, scribes in Eu­rope adapted the Latin al­pha­bet into smaller, more ca­sual forms, called mi­nus­cules. In the 700s, Charle­magne started a project to cre­ate a stan­dard­ized script across his em­pire. That script, Car­olin­gian mi­nus­cule, spread through Eu­rope and pop­u­lar­ized the com­bi­na­tion of up­per­case and low­er­case let­ters that’s been a fea­ture of printed Eu­ro­pean lan­guages since then.To those hold­outs who type emails in all caps: enough al­ready. You don’t have to shout. We can hear you just fine."
