["https://practicaltypography.com/business-cards.html"]
title = "Business cards | Butterick’s Practical Typography"
description = "Butterick’s Practical Typography"
full_description = "business cardsShrink and simplifyBusi­ness cards have to fit a lot of in­for­ma­tion in a small area. But they of­ten try to do too much.For in­stance, the card lay­out be­low is fairly com­mon. I call it the base­ball-di­a­mond lay­out: in­for­ma­tion is pushed out to the cor­ners in the mis­guided be­lief that the shape of the card should dic­tate the shape of the ty­pog­ra­phy. As I men­tioned in max­ims of page lay­out, this tech­nique tends to pro­duce mediocre results.BeforeGoofy fonts used for all text.bad font (Cop­per­plate) used for other text.Point size of name too large.No let­terspac­ing in caps.Too much in­for­ma­tion, pushed out to corners.The guid­ing prin­ci­ples with busi­ness cards are the same as with let­ter­head. Re­move any­thing nonessen­tial. Don’t worry about the text be­ing small—there’s not very much of it. Build the lay­out from the text out­ward. The white space will take care of it­self. If you work from the edges of the card in­ward, you’re more likely to end up with a base­ball diamond.AfterEq­uity used for all text, rather than Goofy Sans and Ugly Script.Point size more rea­son­able and consistent.Let­terspac­ing added to small caps.Text lay­out simplified.Pom­pos­ity eliminated.Production tips for business cardsSee the notes un­der let­ter­head for gen­eral tips about get­ting sta­tionery items de­signed and printed.In ad­di­tion, care­fully con­sider the pa­per stock for your busi­ness cards. More than other printed items, busi­ness cards pro­vide a tac­tile ex­pe­ri­ence, much like shak­ing some­one’s hand. A busi­ness card should feel great be­tween your fin­gers. I’ve got­ten too many that felt like valet-park­ing receipts.Pro­fes­sional print­ing also lets you use smaller point sizes that won’t cause tem­po­rary blindness.For that rea­son, I can’t en­dorse laser-printed busi­ness cards. Those sheets of per­fo­rated cards de­signed for laser print­ing are mis­er­ably thin, and the re­sult­ing busi­ness cards are flimsy and sad. For­get it. Get them pro­fes­sion­ally printed, ei­ther lo­cally or through an in­ter­net printer.by the wayColor can be a nice touch on busi­ness cards, but it has to be un­der­stated. The louder the color, the less of it you can use, and vice versa.Cre­ative types, I don’t want to dampen your en­thu­si­asm for sub­vert­ing par­a­digms. But I can’t en­dorse stunt cards ei­ther—for in­stance, those that are printed on sheet metal, or that are over­sized, or that list you as “evil su­per­ge­nius”. (Three of many I’ve re­ceived.) Keep it simple."
