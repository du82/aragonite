full_description = "ConcoursePDF specimenWeb demoTHE CONGRESS SHALL HAVE POWERto lay and collect Taxes, Duties, Imposts andExcises, to pay the Debts and provide for thecommon Defense and general Welfare of theUnited States; but all Duties, Imposts andExcises shall be uniform throughout.If you like, you can edit this paragraph.1–2 people3–5 people6–10 peopleConcourse$119$239$359save 47% on full library (eight families)MB Type Library$499$999$1499Be­cause of se­cu­rity con­sid­er­a­tions, my pay­ment links do not sup­port In­ter­net Ex­plorer 11 or ear­lier. Please use a dif­fer­ent browser.Con­course in­cludes 144 font files:= 6 weights (light, book, medium, semi­bold, bold, black)× 3 se­ries (ro­man, italic, and caps)× 2 vari­ants (reg­u­lar and Tab, with tab­u­lar fig­ures as the de­faults)+ 12 OT vari­ants (for pro­fes­sional page lay­out & web de­sign)× 3 file for­mats (OTF for Mac OS, TTF for Win­dows, WOFF2 for websites)Read the font li­cense (it’s short) or the FAQLi­censes can only be shared within a sin­gle or­ga­ni­za­tion or fam­ily (de­tails)For de­tails on char­ac­ter set and Open­Type fea­tures, visit MB TypeFor more than ten peo­ple, visit MB TypeCon­course is one of the fonts avail­able for body text in this book. (Click on the font-se­lec­tion tool­bar at the bot­tom of the page to try it.) It’s also used in this book for side­bars, tech­ni­cal in­struc­tions, and labels.Con­course takes in­spi­ra­tion from the geo­met­ric sans ser­ifs of the 1930s, but doesn’t skimp on ver­sa­til­ity, warmth, or personality.Con­course comes in six weights, with real ital­ics and small caps for every weight. It in­cludes old­style and tab­u­lar al­ter­nate fig­ures.Con­course comes with a sep­a­rate set of caps fonts, which con­tain real small caps and al­ready in­clude my rec­om­mended let­terspac­ing.Build your own font bun­dle: your Con­course or­der will in­clude a dis­count code to get ad­di­tional fam­i­lies for $79 in­stead of $119 (1–2 per­son li­cense only).