["https://practicaltypography.com/color.html"]
title = "Color | Butterick’s Practical Typography"
description = "Butterick’s Practical Typography"
full_description = "colorBlack is bestIn ty­pog­ra­phy, color is a term with two meanings.First, ty­pog­ra­phers will some­times speak of a font as cre­at­ing a cer­tain color on the page—even when it’s black. Used this way, the word en­cap­su­lates a set of hard-to-quan­tify char­ac­ter­is­tics like dark­ness, con­trast, rhythm, and texture.The sec­ond mean­ing is the usual one—color as the op­po­site of black & white. This was once an ir­rel­e­vant topic, as most of us had to be sat­is­fied with mono­chrome laser print­ers. These days, color print­ers are ubiq­ui­tous and more writ­ing is de­liv­ered on screen. So color has be­come a prac­ti­cal consideration.On a page of text, noth­ing draws the eye more pow­er­fully than a con­trast be­tween light and dark col­ors. This is why a bold font cre­ates more em­pha­sis than an italic font. (See also bold or italic.)The per­ceived in­ten­sity of col­ored type de­pends not just on the color, but also the size and weight of the font. So a thin or small font can carry a more in­tense color than a heavy or large font.I’m not say­ing it can never be done well, but when some­one puts col­ored type on a col­ored back­ground, I usu­ally wish they hadn’t.in printbody text in printed doc­u­ments (e.g., ré­sumés, re­search pa­pers, let­ters) must al­ways be set in black type. No exceptions.At a typ­i­cal body-text point size, color isn’t ef­fec­tive as a form of em­pha­sis. Small let­ter­forms don’t cover much sur­face area on the page, so col­ored text isn’t no­ticed un­less it’s loud.In laser-printed doc­u­ments, avoid white text on a dark back­ground, known as knock­out type. Knock­out type uses about 20 times more toner than nor­mal, mak­ing it an ex­pen­sive ty­po­graphic effect.Pro­fes­sion­ally printed doc­u­ments (e.g., let­ter­head, busi­ness cards) can in­clude text set in color, but use it ju­di­ciously. Mul­ti­ple shades of one color are usu­ally bet­ter than mul­ti­ple con­trast­ing colors.on websitesThe horse may be long out of the barn on this one, but on the web, the same rule of re­straint ap­plies: less color is more ef­fec­tive. When every­thing is em­pha­sized, noth­ing is emphasized.Con­sider mak­ing your text dark gray rather than black. Un­like a piece of pa­per—which re­flects am­bi­ent light—a com­puter screen projects its own light and tends to have more se­vere con­trast. There­fore, on screen, dark-gray text can be more com­fort­able to read than black text. That’s why many dig­i­tal-book read­ers let you re­duce the screen bright­ness or change the text color.Color re­mains the id­iomatic way to de­note click­a­bil­ity on the web. So feel free to use color (with or with­out un­der­lin­ing) for hy­per­links. But be care­ful us­ing it on non-click­able text, as it may con­fuse readers.in PDFsPDFs are read on both screen and pa­per, so which set of rules you fol­low de­pends on how you ex­pect the PDF to be used. If there’s a rea­son­able chance the PDF will be printed, don’t bother with dark-gray body text—it’ll look gritty and strange when printed.by the wayColor in pre­sen­ta­tions is cov­ered in that section.The hu­man eye can more eas­ily dis­tin­guish light col­ors than dark. This is why a paint store will have 50 shades of white and only two shades of black. So if you’re us­ing light col­ors, make gen­tle ad­just­ments; dark col­ors need big­ger adjustments.Litur­gi­cal rubrics are so named be­cause they were orig­i­nally printed in red. Red has been the fa­vored sec­ond color in ty­pog­ra­phy for hun­dreds of years. To get the most vi­brant-look­ing red, use an old printer’s trick—make it slightly orange.Color on a printed page is made by two tech­niques. With spot color, one ink is used to make the color. With process color, four inks are com­bined (cyan, ma­genta, yel­low, and black).Spot color is tra­di­tion­ally pre­ferred for projects that in­volve one or two col­ors, like let­ter­head and busi­ness cards. Spot color pro­duces the most pure and sat­u­rated col­ors. It also per­mits spe­cial ink ef­fects (e.g., flu­o­res­cents, metallics, varnishes).Color laser print­ers also use a process-color tech­nique, but they com­bine col­ored ton­ers rather than inks.Process color is used for print­ing color pho­tographs and other con­tin­u­ous-tone im­ages (jobs for which spot color is in­ef­fec­tive). Process color used to be an ex­pen­sive tech­nique, mostly re­stricted to com­mer­cial mag­a­zines and cat­a­logs. But in­ter­net print­ing ser­vices like MOO and 4by6.com have made process color avail­able to anyone.So why not print every­thing in process color? The prob­lem is that process color works by lay­er­ing mul­ti­ple col­ors, and chang­ing the bal­ance of those col­ors by ap­ply­ing a halftone pat­tern to each. The halftone pat­tern isn’t vis­i­ble in color pho­tographs. But it’s vis­i­ble in type, be­cause it’s a solid color. Halftone pat­terns also cre­ate a gritty edge on small text, which af­fects leg­i­bil­ity. There­fore, process color isn’t ideal for let­ter­head or busi­ness cards.Pro de­sign­ers some­times ma­lign gra­di­ent fills as a sig­ni­fier of am­a­teur de­sign. Like any de­sign tool, they can be used well—or poorly. In the phys­i­cal world, most of the color we see is es­sen­tially a gra­di­ent, be­cause nat­ural light falls un­evenly. With type, a back­ground gra­di­ent that gen­tly changes bright­ness can give a nat­ural sense of dimensionality."
