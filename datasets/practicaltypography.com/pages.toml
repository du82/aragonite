title = "Bold or italic | Butterick’s Practical Typography"
description = "Butterick’s Practical Typography"
full_description = "bold or italicOne or the other, as little as possibleBold or italic—think of them as mu­tu­ally ex­clu­sive. That is the rule #1.Rule #2: use bold and italic as lit­tle as pos­si­ble. They are tools for em­pha­sis. But if every­thing is em­pha­sized, then noth­ing is em­pha­sized. Also, be­cause bold and italic styles are de­signed to con­trast with reg­u­lar ro­man text, they’re some­what harder to read. Like all caps, bold and italic are fine for short bits of text, but not for long stretches.Text that is nei­ther bold nor italic is called ro­man.Nev­er­the­less, some writ­ers —let’s call them over­em­pha­siz­ers—just can’t get enough bold and italic. If they feel strongly about a point, they won’t hes­i­tate to run the whole para­graph in bold type. Don’t be one of these peo­ple. This habit wears down your read­ers’ reti­nas and their pa­tience. It also gives you nowhere to go when you need to em­pha­size a word. That’s no prob­lem for overem­pha­siz­ers, who re­sort to un­der­lin­ing bold text or us­ing a lot of bold italic. These are both ter­ri­ble ideas.Serif fonts like Geor­gia and Palatino have “feet” pro­trud­ing from the ends of ver­ti­cal strokes. These feet are the ser­ifs. Serif rhymes with sher­iff, not sir reef.Sans serif fonts like Hel­vet­ica and Ver­dana do not have these feet. Though they are as­so­ci­ated with con­tem­po­rary ty­pog­ra­phy, they orig­i­nated in the 1810s. Sans rhymes with hands, not cons. Avoid the com­mon mis­spelling san serif.With a serif font, use italic for gen­tle em­pha­sis, or bold for heav­ier emphasis.If you’re us­ing a sans serif font, skip italic and use bold for em­pha­sis. It’s not usu­ally worth ital­i­ciz­ing sans serif fonts—un­like serif fonts, which look quite dif­fer­ent when ital­i­cized, most sans serif italic fonts just have a gen­tle slant that doesn’t stand out on the page.by the wayFor­eign words used in Eng­lish are some­times ital­i­cized, some­times not, de­pend­ing on how com­mon they are. For in­stance, you would ital­i­cize your bête noire and your Weltan­schau­ung, but nei­ther your crois­sant nor your ré­sumé. When in doubt, con­sult a dic­tio­nary or us­age guide. Don’t for­get to type the ac­cented char­ac­ters correctly.Char­ac­ters ad­ja­cent to the out­side edges of the em­pha­sized text—like punc­tu­a­tion, paren­the­ses, brack­ets, and braces—typ­i­cally do not get the em­phatic for­mat­ting. Ex­cep­tions can be made where this prac­tice would cause a col­li­sion be­tween ital­i­cized text and the ad­ja­cent ro­man punctuation.See head­ings for tips on how to avoid the arms race of overem­pha­sis when work­ing with mul­ti­ple head­ing levels.If you need an­other op­tion for em­pha­sis, con­sider all caps or small caps.Some fonts have both a bold style and a semi­bold style. You can use ei­ther for em­pha­sis. I usu­ally pre­fer bold to semi­bold be­cause I like the greater con­trast with the ro­man. But semi­bold is a lit­tle eas­ier to read.Some fonts have styles that are heav­ier than bold, like black or ul­tra. These weights are usu­ally in­tended for large sizes (for in­stance, head­lines) and don’t work well at body text sizes."
