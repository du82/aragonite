title = "Century Supra | Butterick’s Practical Typography"
description = "Butterick’s Practical Typography"
full_description = "Century SupraPDF specimenWeb demoWE THE PEOPLE OF THE UNITEDStates, in Order to form a more perfect Union,establish Justice, insure domestic Tranquility,provide for the common Defense, promote thegeneral Welfare, and secure the Blessings ofLiberty to ourselves and our Posterity.If you like, you can edit this paragraph.1–2 people3–5 people6–10 peopleCentury Supra$119$239$359save 47% on full library (eight families)MB Type Library$499$999$1499Be­cause of se­cu­rity con­sid­er­a­tions, my pay­ment links do not sup­port In­ter­net Ex­plorer 11 or ear­lier. Please use a dif­fer­ent browser.Cen­tury Supra in­cludes 96 font files:= 6 styles (reg­u­lar, italic, bold, bold italic, reg­u­lar caps, bold caps)× 2 weight grades (A and B)× 2 vari­ants (stan­dard and Tab, with tab­u­lar fig­ures as the de­faults)+ 8 OT vari­ants (for pro­fes­sional page lay­out & web de­sign)× 3 file for­mats (OTF for Mac OS, TTF for Win­dows, WOFF2 for websites)Read the font li­cense (it’s short) or the FAQLi­censes can only be shared within a sin­gle or­ga­ni­za­tion or fam­ily (de­tails)For de­tails on char­ac­ter set and Open­Type fea­tures, visit MB TypeFor more than ten peo­ple, visit MB TypeCen­tury Supra is one of the fonts avail­able for body text in this book. (Click on the font-se­lec­tion tool­bar at the bot­tom of the page to try it.) Cen­tury Supra is a tra­di­tional serif in the style of Cen­tury School­book, though darker and nar­rower—it fits more text on the page.Cen­tury Supra has been de­signed to per­form well on both high-end out­put de­vices and of­fice print­ers. Each style in the fam­ily comes in two weight grades so you can pick the grade that looks just right on your printer—a fea­ture found in very few fonts.Cen­tury Supra comes with a sep­a­rate set of caps fonts, which con­tain real small caps and al­ready in­clude my rec­om­mended let­terspac­ing.Build your own font bun­dle: your Cen­tury Supra or­der will in­clude a dis­count code to get ad­di­tional fam­i­lies for $79 in­stead of $119 (1–2 per­son li­cense only). You can also up­grade any­time to the full MB Type Li­brary for the dif­fer­ence in price.Cen­tury Supra has a short, plain-Eng­lish font li­cense that in­cludes per­mis­sion to use it in PDFs, web­sites, apps, and elec­tronic books. It is a one-time pay­ment, not a sub­scrip­tion.Each li­cense cov­ers mul­ti­ple peo­ple, but only within a sin­gle or­ga­ni­za­tion or fam­ily. A li­cense can­not be split among friends or ran­dom strangers. De­tails here.Cen­tury Supra has no demo ver­sion, but I of­fer a 30-day re­turn op­tion: if the fonts aren’t your style, you can can­cel your li­cense for a refund."
