title = "The billionaire’s typewriter | Butterick’s Practical Typography"
description = "Butterick’s Practical Typography"
full_description = "The billionaire’s typewriterA friend pointed me to a story on Medium called “Death to Type­writ­ers,” by Medium de­signer Marcin Wichary. The story is about the in­flu­ence of the type­writer on dig­i­tal type­set­ting. It ref­er­ences my “ex­cel­lent list” of type­writer habits.Thank you for the com­pli­ment, Mr. Wichary. I can’t quib­ble with the de­tails of your piece. It’s true that Medium and I are op­posed to cer­tain ty­po­graphic short­cuts im­ported from the typewriter.But by the end, I re­al­ized I dis­agree deeply with Medium about the ethics of de­sign. And by ethics, I mean some­thing sim­ple: though Medium and I are both mak­ing tools for writ­ers, what I want for writ­ers and what Medium wants couldn’t be more dif­fer­ent. Medium may be avoid­ing what made the type­writer bad, but it’s also avoid­ing what made it good. Writ­ers who are tempted to use Medium—or sim­i­lar pub­lish­ing tools—should be con­scious of these tradeoffs.So, a few words about that.For those who don’t in­ces­santly fol­low in­ter­net star­tups, Medium is a blog­ging ser­vice run by one of the founders of Twit­ter, multi­bil­lion­aire Evan Williams. Though it owes much to blog­ging ser­vices of the past (in­clud­ing Blog­ger, also founded by Mr. Williams), Medium is ori­ented to­ward longer, less di­aris­tic stories.Medium also dif­fers from ear­lier blog­ging ser­vices in a sig­nif­i­cant, con­trar­ian way: it of­fers you, the writer, nearly zero op­tions for the pre­sen­ta­tion of your sto­ries. No mat­ter what kind of story you write, or who your read­ers are, it gets pack­aged into a sin­gle, non-ne­go­tiable template.Medium isn’t the only blog­ging ser­vice rid­ing this wave, though so far it seems to have the biggest surf­board. Oth­ers in­clude Svb­tle, Posta­gon, and Sil­vr­back. They all pro­mote a sim­i­larly con­strained ap­proach to de­sign, which is some­times called min­i­mal­ist.Minimalist vs. homogeneous designAs a fan of min­i­mal­ism, how­ever, I think that term is mis­ap­plied here. Min­i­mal­ism doesn’t fore­close ei­ther ex­pres­sive breadth or con­cep­tual depth. On the con­trary, the min­i­mal­ist pro­gram—as it ini­tially emerged in fine art of the 20th cen­tury—has been about di­vert­ing the viewer’s at­ten­tion from overt signs of au­thor­ship to the deeper pu­rity of the ingredients.Ad Rein­hardt with some of his amaz­ing black paint­ings. (Spoiler alert: they’re not en­tirely monochromatic.)Bryan Gar­ner notes that ho­mo­ge­neous is fre­quently mis­spelled ho­moge­nous, and has five syl­la­bles that are fre­quently mis­pro­nounced as four. (GMEU 4th ed. at 468.)If that’s the case, we can’t say that Medium et al. are of­fer­ing min­i­mal­ist de­sign. Only the ve­neer is min­i­mal­ist. What they’re really of­fer­ing is a shift from de­sign as a choice to de­sign as a con­stant. In­stead of min­i­mal­ist de­sign, a bet­ter term might be ho­mo­ge­neous design.On the one hand, Medium’s ho­mo­ge­neous de­sign works and reads well. Mem­bers of Medium’s de­sign team have cat­a­logued the many ty­po­graphic de­tails they’ve im­ple­mented. Good for them. If they some­times act as if they dis­cov­ered ty­pog­ra­phy like it was the Higgs bo­son, we can for­give their ov­er­en­thu­si­asm. Bring­ing these de­tails to a wider au­di­ence, and rais­ing stan­dards for ty­pog­ra­phy on the web gen­er­ally, is a wor­thy project.On the other hand, a nec­es­sary side ef­fect of Medium’s ho­mo­ge­neous de­sign is that every story looks the same. If you agree that the role of ty­pog­ra­phy is to en­hance the text for the ben­e­fit of the reader (as I con­tend in who is ty­pog­ra­phy for?), then it stands to rea­son that dif­fer­ent texts de­mand dis­tinct ty­pog­ra­phy. As I say in What is Good Ty­pog­ra­phy?, one size never fits all. Ty­pog­ra­phy wants to be heterogeneous.Delicious but not nutritiousStill, I wouldn’t say that Medium’s ho­mo­ge­neous de­sign is bad ex ante. Among web-pub­lish­ing tools, I see Medium as the equiv­a­lent of a frozen pizza: not as whole­some as a meal you could make your­self, but for those with­out the time or mo­ti­va­tion to cook, a po­ten­tially bet­ter op­tion than just eat­ing peanut but­ter straight from the jar.“You don’t need to see our for­mat­ting options.”The prob­lem, how­ever, is that Medium holds out its ho­mo­ge­neous de­sign as more than a frozen pizza. It has be­come, by the Jedi mind trick­ery fa­vored by to­day’s tech com­pa­nies, a Bel­la­gio buf­fet of de­li­cious nonsense:Evan Williams frames Medium as a “place for ideas” with an “ethos” of “open­ness and democ­racy—like the in­ter­net it­self”. Fine, but ide­al­is­tic plat­i­tudes ex­plain noth­ing. How, specif­i­cally, does Medium im­prove the internet?Mr. Williams claims that Medium is “the best writ­ing tool on the web”. Okay, that’s at least con­crete. But we’ve got a lot of good web-based writ­ing tools al­ready. Medium does more than those?Ac­tu­ally, no—Mr. Williams con­cedes that Medium has “stripped out a lot of the power that other ed­i­tors give you”. So how is it pos­si­ble to be “the best” while of­fer­ing less?Here, Mr. Williams par­ries—he claims that think­ing about the pre­sen­ta­tion of your work is “a ter­ri­ble dis­trac­tion and a waste of time”. Why?Ap­par­ently be­cause he’s “one of those peo­ple who will open up Word and spend half [his] time defin­ing styles and ad­just­ing the spac­ing be­tween para­graphs”. Hmm, not every­one has that prob­lem with Word.Now comes the hand-wav­ing, as Mr. Williams as­sures us that Medium’s ho­mo­ge­neous de­sign isn’t a lim­i­ta­tion—it’s in fact es­sen­tial to let your “bril­liance and cre­ativ­ity flow smoothly onto the screen”.More­over, any­one who dis­agrees is a Lud­dite—be­cause “every­thing [other than Medium] feels like step­ping back in time”.Like all non­sense, it’s in­tended to be easy to swal­low. But Mr. Williams’s ar­gu­ment is flawed in at least three ways:It makes no sense in the con­text of to­day’s web. If Medium had launched in 2005, it would’ve been as­ton­ish­ing. But it didn’t. To­day, the costs of web pub­lish­ing—in­clud­ing de­sign—have de­clined to al­most zero. Rel­a­tive to to­day’s web, Medium is not cre­at­ing new pos­si­bil­i­ties, but in­stead clos­ing them off. To pre­vail, Medium needs to per­suade you that you don’t care about the broader ex­pres­sive pos­si­bil­i­ties of web publishing.It sets up a false di­chotomy about writ­ing tools. Mr. Williams de­picts the writer’s choice as Medium vs. com­pli­cated tools like Word. Not ac­cu­rate. First, dif­fer­ent tools ex­ist for dif­fer­ent needs. It would be silly to use Word to make a web page, but equally silly to use Medium to pre­pare a print-on-de­mand pa­per­back. Sec­ond, any­one who’s used cur­rent blog­ging tools ap­pre­ci­ates that web pub­lish­ing has be­come heav­ily au­to­mated. Much of the for­mat­ting can be han­dled au­to­mat­i­cally (e.g., via Word­Press themes) or man­u­ally, as you prefer.You’re giv­ing up far more than de­sign choice. Mr. Williams de­scribes Medium’s key ben­e­fit as res­cu­ing writ­ers from the “ter­ri­ble dis­trac­tion” of for­mat­ting chores. But con­sider the cost. Though he’s bait­ing the hook with de­sign, he’s also ask­ing you, the writer, to let him con­trol how you of­fer your work to read­ers. Mean­ing, to get the full ben­e­fit of Medium’s de­sign, you have to let your story live on Medium, send all your read­ers to Medium, have your work per­ma­nently en­tan­gled with other sto­ries on Medium, and so on—a sig­nif­i­cant concession.As for that en­tan­gle­ment among sto­ries, Mr. Williams has con­ceded that it’s “con­fus­ing”. But this am­bi­gu­ity isn’t a bug. It’s an es­sen­tial fea­ture of the busi­ness plan. The goal is to cre­ate the il­lu­sion that every­thing on Medium be­longs to one ed­i­to­r­ial ecosys­tem, as if it were the New York Times.No word yet on how Medium’s sur­veil­lance poli­cies square with all that open­ness and democracy.But un­like the Times, Medium pays for only a small frac­tion of its sto­ries. The rest are sub­mit­ted—for free—by writ­ers like you. Af­ter a long time be­ing elu­sive about its busi­ness model, Medium re­vealed that it plans to make money by—sur­prise!—sell­ing ad­ver­tis­ing. This means dis­play­ing ads, but also col­lect­ing and sell­ing data about read­ers and writ­ers. So Medium will ex­tract rev­enue from every story, whether it paid for that story or not. (By the way, will that rev­enue be shared with writ­ers? Um, no.)And com­ing full cir­cle—what’s the in­dis­pens­able tool for cre­at­ing this il­lu­sion of an ed­i­to­r­ial ecosys­tem? The ho­mo­ge­neous de­sign. The but­ter­fly bal­lot of 2000 (de­picted in Why ty­pog­ra­phy mat­ters) proved that er­rors of ty­pog­ra­phy can have his­toric con­se­quences. Medium proves that ty­pog­ra­phy can be used as a tool of eco­nomic lever­age and control.In truth, Medium’s main prod­uct is not a pub­lish­ing plat­form, but the pro­mo­tion of a pub­lish­ing plat­form. This pro­mo­tion brings read­ers and writ­ers onto the site. This, in turn, gen­er­ates the us­age data that’s valu­able to ad­ver­tis­ers. Boiled down, Medium is sim­ply mar­ket­ing in the ser­vice of more mar­ket­ing. It is not a “place for ideas”. It is a place for ad­ver­tis­ers. It is, there­fore, ut­terly superfluous.“But what about all the writ­ing on Medium?” The mea­sure of su­per­fluity is not the writ­ing on Medium. Rather, it’s what Medium adds to the writ­ing. Re­call the ques­tion from above: how does Medium im­prove the in­ter­net? I haven’t seen a sin­gle story on Medium that couldn’t ex­ist equally well else­where. Nor ev­i­dence that Medium’s edit­ing and pub­lish­ing tools are a man­i­fest im­prove­ment over what you can do with other tools.In sum—still superfluous.What we can learn from typewriters Olivetti was fa­mous for its graphic and ad­ver­tis­ing de­sign as well as its typewriters.IBM in­vented the “type ball” tech­nol­ogy that made it pos­si­ble to use dif­fer­ent fonts in a type­writer. I stud­ied this one as part of my re­search for Trip­li­cate.Let’s re­mem­ber two points that get lost among the torches and pitch­forks car­ried by “Death to Typewriters.”First, al­though the type­writer did im­pose ho­mo­ge­neous (and ugly) ty­pog­ra­phy, it had ex­cel­lent ethics. The type­writer made it pos­si­ble to write more quickly, leg­i­bly, and ac­cu­rately than ever be­fore, with low cost and high porta­bil­ity. In short, it of­fered free­dom. For that, ho­mo­ge­neous de­sign was a small price to pay.Sec­ond, though type­writer ty­pog­ra­phy was ter­ri­ble, it wasn’t a choice made by type­writer man­u­fac­tur­ers out of lazi­ness or ig­no­rance. These com­pro­mises were ne­ces­si­tated by the me­chan­i­cal lim­i­ta­tions of the type­writer. Type­writ­ers were never ideal, but as cer­tain lim­i­ta­tions were over­come, they got better.With to­day’s net­worked com­put­ers, we’re get­ting closer to the ideal. We en­joy the ben­e­fits of the type­writer with­out any of its lim­i­ta­tions. We get more ef­fi­ciency, speed, stor­age, de­sign op­tions, and free­dom. The com­puter is the most re­mark­able de­vice in the 500-year his­tory of print­ing (which al­ready in­cludes a lot of re­mark­able devices).This leads back to why those type­writer habits are so aw­ful in the dig­i­tal age. Com­put­ers have none of the me­chan­i­cal lim­i­ta­tions of type­writ­ers. So the ty­po­graphic short­cuts that were a nec­es­sary evil with type­writ­ers are like­wise ob­so­lete. Why per­pet­u­ate them?For more on this, see “Re­vers­ing the Tide of De­clin­ing Expectations.”I rely on a broader ver­sion of this prin­ci­ple in my own work. Tech­nol­ogy keeps im­prov­ing, thereby ex­pand­ing pos­si­bil­i­ties for us. So we have a choice. We can ei­ther ig­nore those pos­si­bil­i­ties, and merely ac­cept what tech­nol­ogy of­fers, which will ul­ti­mately make us lazy. Or we can ex­plore those new pos­si­bil­i­ties. But to do that, we need to ex­pect more of ourselves.We also need bet­ter tools. I’d char­ac­ter­ize most of my work as tool­smithing—whether the project is de­sign­ing a font, writ­ing a book, or cre­at­ing pub­lish­ing soft­ware. I don’t con­trol how oth­ers use these tools. I don’t want to, ei­ther. For me, it’s far more in­ter­est­ing to share these tools and then be sur­prised by how oth­ers use them.To that end, I de­lib­er­ately avoid cre­at­ing tools that do too much. Some as­sem­bly is al­ways re­quired. For in­stance, I’ll tell you the qual­i­ties of good web­site ty­pog­ra­phy, but I’m not go­ing to sell you a tem­plate. I want the cus­tomers for my tools to be re­spon­si­ble for some of the heavy lift­ing. That way, they dis­cover that what they get out of the tool has a con­nec­tion to what they put in.So even though I op­pose the type­writer habits, I still ap­pre­ci­ate that core ethic of the type­writer—re­mov­ing lim­i­ta­tions when you can, do­ing your best with them when you can’t. That’s a great idea. Yes, let’s ex­plore all the pos­si­bil­i­ties of the tech­nol­ogy avail­able to us. Let’s hack the hell out of every­thing and see what hap­pens. In the type­writer era, the tech­no­log­i­cal lim­i­ta­tions were mostly hard­ware. To­day, mostly soft­ware. But if we treat these lim­i­ta­tions as some­thing to obey—not over­come—we’ll just be­come in­den­tured to who­ever con­trols that technology.What we can learn from MediumIn “Death to Type­writ­ers,” Medium in­sists that the type­writer is its “sworn en­emy”. In cer­tain ty­po­graphic de­tails, maybe so. But as a de­vice that im­poses ho­mo­ge­neous de­sign, Medium still has a lot in com­mon with the typewriter.In fact, its ethics are ac­tu­ally worse than the tra­di­tional type­writer. Why? Be­cause Medium’s ho­mo­ge­neous de­sign has noth­ing to do with lim­i­ta­tions of the un­der­ly­ing tech­nol­ogy (in this case, the web). As dis­cussed above, it’s a de­lib­er­ate choice that lets Medium ex­tract value from the tal­ent and la­bor of others.Medium is a new kind of type­writer—the bil­lion­aire’s type­writer. It’s not the only bil­lion­aire’s type­writer. So is the Kin­dle. So is iBooks. So is Twit­ter. What dis­tin­guishes these new type­writ­ers is not the pos­si­bil­i­ties they make avail­able to writ­ers, but what they take away.Whereas the tra­di­tional type­writer of­fered free­dom at the cost of de­sign, the bil­lion­aire’s type­writer of­fers con­ve­nience at the cost of freedom.As a writer and tool­smith, I’ve found the rush to em­brace these sys­tems per­plex­ing. Not be­cause I’m cur­mud­geonly. Not be­cause I fail to un­der­stand that peo­ple, in­clud­ing writ­ers, en­joy things that are free and convenient.Rather, be­cause gen­tle scrutiny re­veals that these sys­tems are pow­ered by a form of hu­man frack­ing. To get his frack­ing per­mit on your ter­ri­tory, Mr. Williams (the multi­bil­lion­aire) needs to per­suade you (the writer) that a key con­sid­er­a­tion in your work (namely,"
