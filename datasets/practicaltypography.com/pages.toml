["https://practicaltypography.com/typewriter-habits.html"]
title = "Typewriter habits | Butterick’s Practical Typography"
description = "Butterick’s Practical Typography"
full_description = "Typewriter habitsI’ve claimed through­out this book that many bad ty­pog­ra­phy habits have been left over from the type­writer era. Here, I’ve col­lected them in one list. (Re­minder—these are things you should not do.)Straight quotes rather than curly quotes (see straight and curly quotes).Two spaces rather than one space be­tween sen­tences.Mul­ti­ple hy­phens in­stead of dashes (see hy­phens and dashes).Al­pha­betic ap­prox­i­ma­tions of trade­mark and copy­right sym­bols.el­lipses made with three pe­ri­ods rather than an el­lip­sis character.Non-curly apos­tro­phes.Pre­tend­ing that ac­cented char­ac­ters don’t exist.Us­ing more than one word space at a time.Us­ing tabs and tab stops in­stead of ta­bles.Us­ing car­riage re­turns to in­sert ver­ti­cal space.Us­ing al­pha­betic char­ac­ters as sub­sti­tutes for real math sym­bols.Mak­ing rules and bor­ders out of re­peated al­pha­betic characters.Ig­nor­ing lig­a­tures.Un­der­lin­ing anything.Us­ing mono­spaced fonts rather than pro­por­tional fonts.Abus­ing all caps.Think­ing that the best point size for body text is 12.Ig­nor­ing kern­ing.Ig­nor­ing let­terspac­ing.Too much cen­tered text.Only us­ing sin­gle or dou­ble line spac­ing.Only us­ing the line length per­mit­ted by one-inch page mar­gins.by the wayI’m far from the first per­son to ob­serve that many bad ty­po­graphic habits have been passed down from type­writ­ers. A best­selling ti­tle of the early Mac era was Robin Williams’s book The Mac is Not a Type­writer, which spawned a se­quel, The PC is Not a Type­writer. Still true."
