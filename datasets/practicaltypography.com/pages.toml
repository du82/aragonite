["https://practicaltypography.com/underlining.html"]
title = "Underlining | Butterick’s Practical Typography"
description = "Butterick’s Practical Typography"
full_description = "underliningAbsolutely notIn a printed doc­u­ment, don’t un­der­line. Ever. It’s ugly and it makes text harder to read. See for yourself—Un­der­lin­ing is an­other dreary type­writer habit. Type­writ­ers had no bold or italic styling. So the only way to em­pha­size text was to back up the car­riage and type un­der­scores be­neath the text. It was a workaround for short­com­ings in type­writer technology.Un­der­lin­ing is an­other dreary type­writer habit. Type­writ­ers had no bold or italic styling. So the only way to em­pha­size text was to back up the car­riage and type un­der­scores be­neath the text. It was a workaround for short­com­ings in type­writer technology.Nei­ther your word proces­sor nor your web browser suf­fers from these short­com­ings. If you feel the urge to un­der­line, use bold or italic in­stead. In spe­cial sit­u­a­tions, like head­ings, you can also con­sider all caps, small caps, or chang­ing the point size.Not con­vinced? I in­vite you to find a book, news­pa­per, or mag­a­zine that un­der­lines text. Aside from su­per­mar­ket tabloids—was that the look you were go­ing for?—you won’t find any.by the wayAn­other rea­son un­der­lin­ing looks worse than bold or italic: un­der­lin­ing is me­chan­i­cally ap­plied by the word proces­sor. Bold and italic styles are spe­cially de­signed to match the reg­u­lar style of the font.The “track changes” fea­ture of your word proces­sor will un­der­line text added to the doc­u­ment. This is fine. In fact, it’s one more rea­son not to use un­der­lin­ing for em­pha­sis—so read­ers don’t con­fuse text that’s marked as a re­vi­sion with text that hap­pens to be underlined.On the web, hy­per­links have tra­di­tion­ally been un­der­lined. But email lost its hy­phen, and the in­ter­net lost its cap­i­tal­iza­tion. Con­sis­tent with those signs of ma­tu­rity, I think it’s time to move be­yond un­der­lined hy­per­links too.“Oh come on! Every­one un­der­lines links!” Some who use un­der­lin­ing spar­in­gly, and of­ten not at all: the New York Times, New York mag­a­zine, the Wash­ing­ton Post, the Guardian, the Wall Street Jour­nal, the At­lan­tic, the New Yorker, the Hol­ly­wood Re­porter, Bloomberg, Google, Politico, Ama­zon, Ap­ple, Mi­crosoft, GitHub, Ya­hoo News, and Wikipedia. Even eBay, paragon of ’90s web­site de­sign, has re­lented. Are un­der­lined links dead? Maybe not quite. Dy­ing? For sure.A vo­cal mi­nor­ity con­tin­ues to in­sist—against logic and years of ev­i­dence—that these are merely fringe ex­cep­tions, and that I be­long to a cult de­voted to ru­in­ing the web by cam­ou­flag­ing all those pre­cious links. Please take this tin­foil hat, with my compliments."
year_published = 2025
