full_description = "system fontsAvoid if you can, choose wisely if you can’tSys­tem fonts are the fonts al­ready in­stalled on your com­puter. Some are bet­ter than oth­ers. In printed doc­u­ments they present three problems.Many sys­tem fonts aren’t good. The Win­dows and Mac OS li­braries have im­proved, but they’re still mine­fields of aw­ful fonts. I won’t name names, but my least fa­vorite rhymes with Barial.In one square inch, an LCD screen that dis­plays 100 dots per inch has less than 3% of the res­o­lu­tion of a laser printer with 600 dots per inch, so ren­der­ing a font ac­cu­rately is much more dif­fi­cult. See screen-read­ing con­sid­er­a­tions.Many sys­tem fonts have been op­ti­mized for the screen, not print. This comes at the cost of de­sign de­tails, which have been sanded off be­cause they don’t re­pro­duce well on screen (e.g., Geor­gia, Ver­dana, Cam­bria, and Cal­ibri). Screen-op­ti­mized fonts look clunky on the printed page.Com­pare the two fonts above. In ba­sic ap­pear­ance, they’re sim­i­lar. But Geor­gia was op­ti­mized for the screen; Miller was op­ti­mized for print. See the difference?All sys­tem fonts are over­ex­posed. Be­cause these fonts are in­cluded with bil­lions of com­put­ers, they’re used all the time. Not every ty­pog­ra­phy project de­mands nov­elty. But if yours does, look else­where. For in­stance, please don’t adopt the slo­gan “A De­sign Firm Un­like Any Other” and then set it in Helvetica.WARN­INGThis chart is of­fered only as a harm-re­duc­tion de­vice. In the long term, a diet of sys­tem fonts can be harm­ful to your health. My of­fi­cial ad­vice re­mains the same: pro­fes­sional writ­ers should use pro­fes­sional fonts. In the pages fol­low­ing, I sug­gest pro­fes­sional al­ter­na­tives to the most com­mon sys­tem fonts.If you’re lim­ited to sys­tem fonts, con­sult this chart and choose wisely. For print, the A list is best. For screen dis­play, like pre­sen­ta­tions and web­sites, the A and B lists are fine. They’re also suit­able for shar­ing draft doc­u­ments. Avoid the C list if you can. F list, kapu.Fonts plau­si­ble for body text are marked with ★. Oth­ers are us­able for spe­cial pur­poses (for in­stance, let­ter­head).This chart in­cludes all the com­mon Win­dows and Mac sys­tem fonts, plus the Mi­crosoft Of­fice fonts. Sys­tem con­fig­u­ra­tions dif­fer, so not every font will be on your computer.These rank­ings rep­re­sent a blend of prac­ti­cal and aes­thetic con­sid­er­a­tions, not ab­solute merit. Some fonts on the F list aren’t bad. They’re just in­apt for pro­fes­sional writ­ing. Sim­i­larly, some fonts on the A list are not my fa­vorites, but they’re rea­son­ably useful.The A list: Gen­er­ally tol­er­a­bleAthe­las ★Avenir ★Bell MT ★Book An­ti­qua ★Cal­i­forn­ian FB ★Cal­isto MT ★Cen­tury School­book ★Char­ter ★Franklin Gothic ★Gara­mond ★Gill Sans ★Gill Sans MT ★Goudy Old Style ★Hel­vetica ★Hel­vetica Neue ★Hoe­fler Text ★Iowan Old Style ★Op­tima ★Palatino ★Ser­avek ★Sitka ★The B list: OK in lim­ited dosesAgency FBBig CaslonBodoni MTITC Bodoni 72Cal­ibri ★Can­daraCen­taurCon­stan­tiaCor­belFu­tura ★GenevaGlouces­ter MT Ex­tra Cond.High Tower Text ★Mod­ern No. 20Per­petua ★Rock­wellSe­goe UI ★Tw Cen MT ★Help­ing de­sign Berlin Sans was my first pro­fes­sional gig as a type de­signer, way back in 1991.The C list: Ques­tion­ableAn­dale MonoBaskerville ★Berlin Sans FBBernard MT Con­densedCam­bria ★Castel­larCen­tury GothicCochinCon­so­lasCooper BlackCourierCourier NewDi­dotEle­phantEn­gravers MTEras ITCFe­lix Ti­tlingGeor­giaHaet­ten­schweilerIm­pactLu­cida (all styles)Ma­ian­dra GDMenloNi­a­gara Solid & En­gravedOnyxPlan­ta­genet Chero­keeSkiaTimes New Roman ★The F list: Fa­tal to your cred­i­bil­ityAl­ger­ianAmer­i­can Type­writerAp­ple Ca­sualAp­ple ChanceryAr­ial (all styles)Bauhaus 93Black­ad­derITC Bradley HandITC Bri­tan­nic BoldBroad­wayBrush Script MTBook­man Old StyleCen­turyChalk­boardChalk­dusterChillerColonna MTComic Sans MSCop­per­plateCurlz MTEd­war­dian Script ITCFoot­light MT LightForteFreestyle ScriptFrench Script MTGabri­olaGigiGoudy StoutHar­low Solid ItalicHar­ring­tonHer­cu­lanumIm­print MT ShadowIn­for­mal Ro­manJok­er­manJuice ITCKris­ten ITCKun­stler ScriptLu­mi­nariMag­netoMarker FeltMatura MT Script Cap­i­talsMis­tralMonacoMono­type Cor­sivaNote­wor­thyOCR A Ex­tendedOld Eng­lish Text MTPalace Script MTPa­pyrusParch­mentPlay­billPhos­phatePoor RichardPristinaRage ItalicRavieSavoyeScript MT BoldSe­goe PrintSe­goe ScriptSign­PainterSnap ITCSnell RoundSten­cilShow­card GothicTahomaTem­pus Sans ITCTrat­tatelloTre­buchet MSVer­danaViner Hand ITCVi­valdiVladimir ScriptWide LatinZapfino… and all othersby the wayAdobe uses its own text-ren­der­ing tech­nol­ogy in Ac­ro­bat so that PDF doc­u­ments dis­play the same way on screen re­gard­less of the un­der­ly­ing op­er­at­ing system.“My PDF will prob­a­bly be read on screen. Shouldn’t I use a screen-op­ti­mized sys­tem font?” No. In Win­dows, cer­tain sys­tem fonts (e.g., Geor­gia, Cal­ibri) have been op­ti­mized by Mi­crosoft for user-in­ter­face pur­poses. This is ac­com­plished with hint­ing, which is ex­tra soft­ware code stored in the font it­self. Win­dows re­lies on this hint­ing when it draws text on screen (e.g., in Mi­crosoft Word, or in a web browser).Due to ad­vances in dis­play tech­nol­ogy, the screen-leg­i­bil­ity ad­van­tage of these par­tic­u­lar sys­tem fonts is rapidly evap­o­rat­ing—see screen-read­ing con­sid­er­a­tions for why. Fur­ther­more, any PDF could also end up be­ing printed. There­fore, as a rule, you’re bet­ter off us­ing print-op­ti­mized fonts for PDFs.“But if I use a print-op­ti­mized pro­fes­sional font in my PDF in­stead of a sys­tem font, my read­ers prob­a­bly won’t have the same font in­stalled.” Right. But it doesn’t mat­ter. When you gen­er­ate a PDF, your fonts are em­bed­ded in the PDF to pre­serve the formatting.This is not true, how­ever, on the web. Web browsers use the text ren­der­ing of the op­er­at­ing sys­tem. Thus, in Win­dows browsers, screen-op­ti­mized sys­tem fonts have tra­di­tion­ally held an ad­van­tage, be­cause they look good and they’re al­ready in­stalled. (In­deed, the Mi­crosoft fonts Geor­gia and Ver­dana were specif­i­cally cre­ated for web use.) But this ad­van­tage is rapidly fad­ing with the ad­vent of screen-op­ti­mized web­fonts and the gen­eral shift to­ward higher-res­o­lu­tion screens. Still, for now, us­ing pro­fes­sional fonts on a web­site re­quires a lit­tle more leg­work than it does in PDF.Yes, I dis­like Ar­ial more than Comic Sans. Though it’s the undis­puted king of the goofy fonts, Comic Sans is at least hon­est about what it is. But Ar­ial is merely a bland, zero-calo­rie Hel­vetica substitute.For many, the two are in­dis­tin­guish­able. But for ty­pog­ra­phers, Ar­ial con­tains none of the con­sis­tency and bal­ance that makes Hel­vetica successful.Still, the main is­sue is overuse. Af­ter decades as a sys­tem font, Ar­ial has achieved a ubiq­uity that ri­vals Times New Ro­man. And like Times New Ro­man, Ar­ial is per­ma­nently as­so­ci­ated with the work of peo­ple who will never care about typography.You’re not one of those peo­ple. So use Avenir. Use Franklin Gothic. Use Gill Sans. Use one of the fonts listed in Hel­vetica and Ar­ial al­ter­na­tives. Or use some­thing com­pletely dif­fer­ent. But don’t use Ar­ial. It’s the sans serif of last resort."
