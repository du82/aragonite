full_description = "Baskerville alternativesNeutral need not mean dullbaskervillebaskerville 10in­ge­borgking­fisherThe Baskerville sys­tem font is mediocre: brit­tle and ex­ces­sively quaint. It’s a poor rep­re­sen­ta­tion of the work of John Baskerville, an 18th-cen­tury Eng­lish printer who im­proved type­found­ing with his in­no­va­tions in pa­per, ink, and print­ing. The best recre­ation of Baskerville’s own fonts is Baskerville 10. Though In­ge­borg and King­fisher don’t di­rectly re­sem­ble Baskerville’s type de­signs, they do share the crisp and bright look that Baskerville helped popularize."
