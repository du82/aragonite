["https://practicaltypography.com/apostrophes.html"]
title = "Apostrophes | Butterick’s Practical Typography"
description = "Butterick’s Practical Typography"
full_description = "apostrophesMake sure they’re curly and point downwardThe apos­tro­phe has two func­tions we all re­mem­ber from sixth-grade Eng­lish class.An apos­tro­phe in­di­cates the pos­ses­sive case (Jes­sica’s bagel).In con­trac­tions, an apos­tro­phe takes the place of let­ters or num­bers that have been re­moved (is not be­comes isn’t, Patent No. 5,269,211 be­comes ’211).Apos­tro­phes al­ways point down­ward. If the smart-quote fea­ture of your writ­ing sys­tem is ac­ti­vated (see straight and curly quotes), you type an apos­tro­phe with the same key you use to type a straight sin­gle quote ('). Your word proces­sor will con­vert this char­ac­ter to a curly apos­tro­phe (’). Or you can type an apos­tro­phe di­rectly, us­ing the same key as a clos­ing sin­gle quote.WindowsMac OSHTML'straight single quote'''’apostrophe (same as closing single quote)alt 0146option + shift + ]&rsquo;Text im­ported from a plain-text source (e.g., a web page or email ) may not have its apos­tro­phes con­verted to curly apos­tro­phes. To fix this, use the search-and-re­place tech­nique in straight and curly quotes. example-text { font-family: century-supra-text; } span-concourse { font-family: concourse-t3; } table.example tr > td:first-child { width: 16rem; } Wrin­kles arise when an apos­tro­phe is used at the be­gin­ning of a word (again, as­sum­ing your smart-quote con­ver­sion is on). If you type the phrase:In the '70s, rock 'n' rollThis will be dis­played as:In the ‘70s, rock ‘n’ rollwrongNo, you don’t need an apos­tro­phe be­fore the s in ’70s.The prob­lem here is that the char­ac­ters in front of 70s and n’ aren’t apos­tro­phes—they’re open­ing sin­gle quotes. They point up­ward. What you need is an apos­tro­phe in place of each se­quence of omit­ted let­ters, so the re­sult looks like this:In the ’70s, rock ’n’ rollrightMi­crosoft Word has its own apos­tro­phe short­cut—hold down the con­trol key and type the straight sin­gle quote twice.To get this re­sult, you have two choices. You can man­u­ally delete the in­cor­rect marks and type apos­tro­phes di­rectly (us­ing the key com­bi­na­tions above). Or you can type two sin­gle quotes:In the ''70s, rock ''n' rollThese will be dis­played as:In the ‘’70s, rock ‘’n’ rollThen you can delete the un­needed open­ing sin­gle quotes:In the ’70s, rock ’n’ rollrightby the wayIf you’re us­ing Hawai­ian spellings of Hawai­ian words, look out. Those apos­tro­phe-like char­ac­ters aren’t apos­tro­phes—they’re oki­nas. The okina is a let­ter in the Hawai­ian al­pha­bet that doesn’t ex­ist in Eng­lish. Ok­i­nas point up­ward, so use an open­ing sin­gle quote as your okina, not an apos­tro­phe. If the okina ap­pears in the mid­dle of a word, your word proces­sor will in­cor­rectly in­sert an apostrophe.Hawai’i O’ahu’swrongHawai‘i O‘ahu’srightAl­ter­na­tively, you can omit the oki­nas. An­gli­cized spellings of Hawai­ian words are al­most al­ways acceptable.Hawaii Oahu’srightThe okina is a glot­tal stop. In Eng­lish, the glot­tal stop is heard be­fore some vow­els, like in the mid­dle of the word uh-oh."
