title = "First-line indents | Butterick’s Practical Typography"
description = "Butterick’s Practical Typography"
full_description = "first-line indentsBetween one and four times the point sizeA first-line in­dent is the most com­mon way to sig­nal the start of a new para­graph. The other com­mon way is with space be­tween para­graphs.First-line in­dents and space be­tween para­graphs have the same re­la­tion­ship as belts and sus­penders. You only need one to get the job done. Us­ing both is a mis­take. If you use a first-line in­dent on a para­graph, don’t use space be­tween. And vice versa.A first-line in­dent on the first para­graph of any text is op­tional, be­cause it’s ob­vi­ous where the para­graph starts.Typ­i­cally, a first-line in­dent should be no smaller than the cur­rent point size, or else it’ll be hard to no­tice. It should be no big­ger than four times the point size, or else the first line will seem dis­con­nected from the left edge. So a para­graph set in 12 point should have a first-line in­dent of 12–48 points. (Re­call that there are 72 points to an inch, so this works out to 0.17–0.67″.)But use your judg­ment—con­sider the width of the text block when set­ting the first-line in­dent. For in­stance, nar­row text blocks (3″ or less) should have first-line in­dents to­ward the low end of this range. Wider text blocks should have big­ger indents.The skateboarder was denied entryto the applicant's home in the gatedcommunity known as Luxuria.wrongThe skateboarder was deniedentry to the applicant's home in thegated community known as Luxuria.wrongThe skateboarder was denied entryto the applicant's home in the gatedcommunity known as Luxuria.rightDon’t use word spaces or tabs to in­dent the first line—as you re­call from white-space char­ac­ters, that’s not what they’re for. Para­graphs in­dented with word spaces or tabs are hard to keep con­sis­tent and waste far more time than they save. Use the right tool for the job.How to set a first-line indentWordRight-click in the text and se­lect Paragraph → Indents and Spacing. Un­der Indentation, from the popup menu la­beled Special, se­lect First line and en­ter the mea­sure­ment in the ad­ja­cent box.PagesView → Show Toolbar (or op­tion + ⌘ + t) → Format but­ton → Layout pane → un­der Indents, in the box la­beled First, en­ter the measurement.CSSUse the text-in­dent propertyby the wayIt’s pos­si­ble to set a neg­a­tive first-line in­dent, or hang­ing in­dent. Hang­ing in­dents are used in lists to cre­ate a rec­tan­gu­lar text block with a list bul­let that dan­gles off to the left. (Like this one.) Avoid us­ing a hang­ing in­dent with­out a bul­let—your text block should not re­sem­ble Ok­la­homa. Text should only be in­dented inward.rop caps are, in the­ory, an­other op­tion for the first para­graph—the first let­ter of the para­graph is en­larged so it de­scends three or four lines. In cer­tain dec­o­ra­tive con­texts, they’re tol­er­a­ble. But if you’re just us­ing the drop-cap func­tion in your word proces­sor, for­get it. It looks bad."
