full_description = "Cambria alternativesMonotony can be fatalcam­briaguardian egyptianelenasko­larchar­tersource serifIt’s coun­ter­in­tu­itive, but a well-de­signed font can have a lot of sub­tle vari­a­tion be­tween let­ters and still look con­sis­tent on the page. The con­verse of this prin­ci­ple is that a font with too much con­sis­tency can be numb­ing to read. Cam­bria is an ex­am­ple of this prob­lem. It works well on screen, but on the printed page, it’s a skull-clutcher. Guardian Egypt­ian, Elena, and Sko­lar are sim­i­lar to Cam­bria but avoid mo­not­ony. So are Char­ter and Source Serif, which are avail­able for free."
