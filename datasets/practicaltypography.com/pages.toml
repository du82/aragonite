full_description = "How to pay for this bookBe­cause of se­cu­rity con­sid­er­a­tions, my pay­ment links do not sup­port In­ter­net Ex­plorer 11 or ear­lier. Please use a dif­fer­ent browser. payment-heading { font-size:120%; } Thank you for be­ing here! I hope you’ve en­joyed Prac­ti­cal Ty­pog­ra­phy so far. This book has no ads. It’s sup­ported by read­ers like you.Skep­ti­cal? Please see why you should pay.Not skep­ti­cal? Keep reading.Buy my fonts. ($119+)I’ve been de­sign­ing fonts for over 25 years, in­clud­ing all the fonts used in this book. Yes, you can buy them and use them in your own projects. They’re only avail­able from me.Fonts de­signed by MB $119+Send money. ($19-49)Use your credit card to quickly send the pay­ment that best re­flects your ap­pre­ci­a­tion. (To be clear, this is a pay­ment for the on­line book you see here. You won’t get a link for a PDF or e-book, be­cause they don’t ex­ist.) Get your track­pad fin­ger ready—kind pay­ment $19gen­er­ous pay­ment $29su­per fan­tas­tic pay­ment $39amaz­ing and won­der­ful pay­ment $49Buy the Ty­pog­ra­phy for Lawyers pa­per­back. ($40)You can or­der it from my pub­lisher, O’Con­nor’s (an im­print of Thom­son Reuters) or Ama­zon. Much of the ma­te­r­ial here was adapted from TFL. So if you’re a law­yer, you’ll love this book. If you’re not a law­yer, give it to your fa­vorite law­yer, who will love the book, and by ex­ten­sion, you.TFL at Thom­son ReutersTFL at AmazonTell peo­ple about it. (free)Ex­po­sure isn’t a sub­sti­tute for money. But money plus ex­po­sure is bet­ter than money alone. So in ad­di­tion to the op­tions above, tell your friends. Your col­leagues. Fren­e­mies. Strangers. All are welcome."
