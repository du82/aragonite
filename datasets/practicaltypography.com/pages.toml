full_description = "Effluents influence affluence:The economics of a web-based book, year twoThis book has now com­pleted its sec­ond year on­line. Last year, in my in­au­gural re­port, I de­scribed the rev­enue sources for the book. One of my find­ings was that only a small frac­tion of read­ers—about one in 650—sup­ported the book with any kind of payment.For year two, I set a goal of “get­ting more read­ers to pay small amounts—not be­cause it makes a big fi­nan­cial dif­fer­ence, but be­cause it in­stills a vir­tu­ous habit”.Did it work? Sort of. Though rev­enue met my ex­pec­ta­tions, I had to re­vise my view of how traf­fic re­lates to revenue.Go­ing into year two, I ex­pected rev­enue to drop. Why? Be­cause I ex­pected traf­fic to drop too. In year one, the book got a lot of good word-of-mouth be­cause it was new. For which I’m grate­ful. But you only get to be new once. The greater chal­lenge—as it is for au­thors of printed books—would be turn­ing the book into source of sus­tain­able, re­cur­ring rev­enue. (And not be­cause this is how you get rich in pub­lish­ing—rather, it’s how you have any chance of break­ing even.)How did I change the book to en­cour­age more di­rect pay­ments? Not as much as I could have, I con­cede. In how to pay for this book, I re­duced the num­ber of sug­gested op­tions. I made it eas­ier to make a di­rect pay­ment with a credit card.But I didn’t do the thing I knew would be most ef­fec­tive: namely, load­ing up the rest of the book with links to the pay­ment page, along with in­ces­sant nag­ging and wheedling. Have you paid yet? No you haven’t. Here’s how you pay. Click here. Hey, you’re not click­ing. Please click. Please please please. PLEEEEEEEEAAAAA—Why not? Be­cause it would have been eff­ing aw­ful. Like so much of the web in 2015. Haven’t you no­ticed? A cou­ple years ago, we saw the omi­nous cel­lu­lar mu­ta­tions—web­sites on tablets and phones were be­com­ing ads for apps.Now, the can­cer has metas­ta­sized onto the desk­top. I’m not talk­ing about ban­ner ads—we clev­erly blocked those, of course. But the re­ward for our clev­er­ness has been a web that in­creas­ingly re­lies on wheedling, whin­ing, and nag­ging. The pariah popup win­dow of yore has been rein­vented as the home­page-hog­ging in­put form. Most com­monly, this nag­ging is a de­mand that we sign up for an email list (aka more nag­ging, di­rect to your in­box) or that we com­plete an ob­vi­ously un­nec­es­sary reg­is­tra­tion—which usu­ally im­plies join­ing an email list, which in turn means … right.The work & the termsI say this not to gripe. I say this be­cause though I un­der­stand why this shift is ac­cel­er­at­ing—in short, be­cause the web is ter­ri­ble at mak­ing in­for­ma­tion ex­pen­sive—it’s not a shift I want to be part of.“Be­cause you’re a sen­si­tive artiste who con­sid­ers him­self above the com­mer­cial fray?” No. I do this for work. Mean­ing, it is in­her­ently a com­mer­cial activity.An idea that plays a lead­ing role in The bil­lion­aire’s type­writer.Rather, be­cause every com­mer­cial artist—sen­si­tive or not—con­trols only two things: their work, and the terms un­der which their work is of­fered. By terms, I mean con­sid­er­a­tions of pric­ing, con­text, tim­ing, au­di­ence, and so forth. Granted, it’s more fun to think about the work it­self. But the terms en­com­pass the harder, more con­se­quen­tial choices. Harder be­cause they of­ten re­quire say­ing “no” to things that are clearly in one’s short-term in­ter­est. More con­se­quen­tial be­cause they shape one’s long-term interest.Part of why this book works is that it’s not pol­luted with nag­ging and wheedling. I specif­i­cally wanted it to be a calm oa­sis on the noisy web—a chance to re­dis­cover some­thing we like about printed books, which is the im­mer­sion and fo­cus that can be cre­ated by noth­ing but text and ty­pog­ra­phy. That part is not in­ci­den­tal; it’s intrinsic.In fact, be­fore I set to work pub­lish­ing this book on­line, a book agent got me a very nice of­fer to turn this ma­te­r­ial into a pa­per­back for a name-brand pub­lisher. Tempted, I was. But when I asked whether I’d be al­lowed to de­sign it, her an­swer was swift. “Of course not,” she said. “Why would you think they’d let you do that?”Oh, I don’t know.I walked away. The agent was flab­ber­gasted. To her, my job as an au­thor was to pro­duce a se­quence of words that other peo­ple would shep­herd to mar­ket. Per­haps if my topic were dif­fer­ent, that would be true. But a book about ty­pog­ra­phy nec­es­sar­ily in­volves show­ing, not just telling.So here we are.Direct paymentsIn year one, I col­lected 321 pay­ments to­tal­ing $3676. In year two, con­sis­tent with my re­duced ex­pec­ta­tions, I col­lected 244 pay­ments to­tal­ing $3030. Not bad. The 25% drop in trans­ac­tions was off­set by a higher pay­ment amount, so the gross rev­enue was only 18% less.Re­call from last year’s re­port that the av­er­age pa­per­back sells a to­tal of about 1000–3000 copies, with the au­thor get­ting about $2–3 per book. On that ba­sis, I can’t say I’m do­ing worse than I would’ve had I taken that pa­per­back offer.True—de­spite my ob­jec­tions to the nag­ging econ­omy, I’m sure I could’ve dis­cov­ered some sub­tle ways to in­duce more di­rect pay­ments, had I spent more time on the prob­lem. And some might say that my re­fusal to do so makes my web-pub­lish­ing ex­per­i­ment un­re­li­able. Perhaps.The rub, how­ever, is that de­vel­op­ing and test­ing these tech­niques is it­self ex­pen­sive. If I spent a month on this prob­lem and raised the an­nu­al­ized rate of pay­ment by 25%, that would be a solid im­prove­ment. It would also im­ply that I got paid $750 for a month of la­bor. Not so good. Whereas if I could raise the pay­ment rate by 300–500%, then the re­turn on a month of la­bor would be worth­while. But that kind of im­prove­ment would be lu­di­crously unrealistic.More­over, it would prove noth­ing gen­er­al­iz­able. I’m some­one who’s pretty de­cent at this web stuff. For a non-tech­ni­cally-minded au­thor, these chal­lenges would sim­ply be insurmountable.Font salesAs was the case last year, what really pro­pelled this book fi­nan­cially were font sales. In year one, I es­ti­mated that 450 read­ers be­came font cus­tomers, and I as­signed a “re­fer­ral fee” of $25 to each of those trans­ac­tions, for im­puted rev­enue of $11,250.For year two, I es­ti­mate that there were 325 font sales at­trib­ut­able to Prac­ti­cal Ty­pog­ra­phy, and by the same met­ric, im­puted rev­enue of $8,125. That rep­re­sents an 18% drop—the same as the per­cent­age drop in di­rect-pay­ment revenue.This, in turn, sug­gests that a con­sis­tent ra­tio might emerge be­tween the num­ber of read­ers in­ter­ested in pay­ing for the book vs. how much they want to spend. For two years run­ning, about 35% more read­ers were in­ter­ested in pay­ing $59–299 for a pack­age of fonts than $5–20 for a di­rect pay­ment for the book. (For that rea­son, if I were to spend a hy­po­thet­i­cal month im­prov­ing sales rates, it would make more sense to fo­cus on in­creas­ing sales of fonts, not di­rect payments.)TrafficMy mar­ket­ing & PR bud­get re­mained un­changed from year one—still $0.The sur­prises arose with traf­fic. Re­call that I ex­pected sales to drop be­cause I ex­pected traf­fic to drop. And sales did drop. But traf­fic ac­tu­ally went up—from about 650,000 read­ers in year one to about 700,000 in year two.This was both good news and bad news. Good news in the sense that traf­fic ex­ceeded ex­pec­ta­tions. Bad news in the sense that the frac­tion of read­ers fi­nan­cially sup­port­ing the book de­creased—from the year-one ra­tio of 649 : 1 to an even weaker 1000 : 1 or so.La­trines at Hadrian’s wall, built—to last—in the year 124.In the broad­est sense, we can say that more traf­fic is al­ways bet­ter than less. But be­yond that, we can sketch out two ba­sic theories.The first the­ory is that web traf­fic is like pan­ning for gold in a river. The river con­tains a cer­tain per­cent­age of gold by vol­ume. The longer you stay in the river, the more gold you’ll find.The sec­ond the­ory also holds that web traf­fic is like pan­ning for gold in a river. Oc­ca­sion­ally, a mas­sive sewer line bursts near the river, drench­ing you in a lot more liq­uid, but the same amount of gold. Now you have to stay longer in the river whether you want to or not.I’m com­ing around to the sec­ond theory.There have oc­ca­sion­ally been traf­fic flows that had a high ra­tio of pay­ing read­ers—Cool Tools comes to mind, as does Dar­ing Fire­ball (John Gru­ber, your next din­ner at Musso & Frank will be my treat). But these are very much the exception.As a rule, quan­tity and qual­ity have a neg­a­tive cor­re­la­tion. Let’s go to the countdown:Top sources of visitors in year twoHacker News. I can’t say I un­der­stand the pur­pose of this site, founded by ven­ture cap­i­tal­ist Paul Gra­ham. I have two guesses. One is that it’s like Red­dit for pro­gram­mers, but they can claim that us­ing it is work, not goof­ing off. My other guess, since it has no ads, is that it acts as Mr. Graham’s panop­ti­con into his com­mu­nity of in­ter­est, as Cere­bro does for Prof. Xavier. Any­how, what­ever bored pro­gram­mers are spend­ing their money on, it’s def­i­nitely not me.Cre­ative Bloq. Like a lot of de­sign-ori­ented sites of­fer­ing “tips and in­spi­ra­tion”, this one holds out the promise that if you just browse the web hard enough, you can be­come a bet­ter de­signer. No sur­prise that a site with a some­thing-for-noth­ing phi­los­o­phy mostly sends read­ers who don’t pay. (To be fair, its name plainly fore­tells the likely re­sult of this approach.)Twit­ter. I’ve oc­ca­sion­ally been crit­i­cized for my “write-only” pol­icy on Twit­ter. What can I say? Its 140-char­ac­ter limit per­ma­nently rel­e­gates it to the low­est tier of con­ver­sa­tion, and thus also at­ten­tion. Read­ers from Twit­ter flit in, flit out, leav­ing no trace.Buz­zFeed. Grudg­ingly, I re­spect BuzzFeed. They’re at least hon­est about what they’re do­ing—per­fect­ing click­bait—and dis­ci­plined about their ap­proach. My vis­i­tors ar­rive from this quin­tes­sen­tially Buz­zFeedy lis­ti­cle that has amassed 5.5 mil­lion views. But do these read­ers pay? Heav­ens no. It would prac­ti­cally be un-American.Red­dit. Ugh. Red­dit’s busi­ness plan is ap­par­ently to mon­e­tize as much vile toxic waste—racism, sex­ism, anti-Semi­tism, stolen celebrity nudes—as it can get away with. True, that ma­te­r­ial has al­ways been avail­able on the in­ter­net. But it wasn’t un­til re­cently that it was fu­eled by mil­lions in ven­ture cap­i­tal. What an ac­com­plish­ment. Fit­tingly, many of my Red­dit vis­i­tors ar­rive from a page ti­tled “Where do you go once Red­dit has bored you?” Glad to help.The top five articles visited in year twoOb­vi­ously, a big rea­son much of this read­er­ship is un­paid is be­cause these web­sites spe­cial­ize in pass­ing along sin­gle links, of which these were the most popular—The Bil­lion­aire’s Type­writer. De­spite its huge traf­fic, it did not even make me a hundredaire.Ty­pog­ra­phy in Ten Min­utes. Al­ways a favorite.Prac­ti­cal Ty­pog­ra­phy was made with Pollen, a book-pub­lish­ing sys­tem I wrote in Racket. Pollen is also open source.Why Racket? Why Lisp? OK, this was a case where raw quan­tity was use­ful. This ar­ti­cle was ba­si­cally a sales pitch for the open-source Racket pro­gram­ming lan­guage. If I got a few peo­ple in­ter­ested, then it was worth­while. (If you’re vis­it­ing from Hacker News, you might en­joy it more than this one.)The eco­nom­ics of a web-based book: year one. How meta.The In­fi­nite-Pixel Screen. Though judg­ing from the time spent on the page, many fewer fin­ished it.I’m not com­plain­ing about hav­ing a large un­paid read­er­ship. That de­scribes most—nearly all?—web­sites. It’s more that as an au­thor, I won­der what my re­la­tion­ship with these high-quan­tity / low-qual­ity traf­fic gen­er­a­tors ought to be.Sure, it’s my re­spon­si­bil­ity to con­vince vis­i­tors to click from their land­ing page to some­thing else. But the most com­mon way to ac­com­plish this is through more wheedling and nag­ging. I don’t dis­pute it would work. I just don’t feel that spend­ing my time hip-deep in sewage will pro­duce a worth­while re­turn. It would also make the site mis­er­able for the nice peo­ple who do pay for it.The virtue of exclusivityIn­stead, what if I to­tally blocked vis­i­tors from those five sites, and other traf­fic farms? Would it af­fect the rev­enue for this book? I doubt it. I wouldn’t mind find­ing out.Don’t panic—I’m not really go­ing to do that. Open­ness has ben­e­fits. It also has costs. I ac­cept the costs be­cause I be­lieve in the ben­e­fits. But it’s a wor­thy thought ex­per­i­ment: can some­thing be open to every­one, yet not really be for everyone?This leads back to the ear­lier is­sue of terms. Ex­clu­siv­ity—mean­ing, se­lect­ing a cus­tomer base for qual­ity, not just quan­tity—is of­ten an im­por­tant con­sid­er­a­tion in mak­ing a work suc­cess­ful. Af­ter year two, I sus­pect it’s also true for book au­thors. For year three, I’d like to re­duce the ra­tio of un­paid to paid read­er­ship, even if it means re­duc­ing traf­fic. But I’m still work­ing out how I can bal­ance open­ness with ex­clu­siv­ity—with­out us­ing blunt instruments.For in­stance, Ap­ple is of­ten cred­ited with prov­ing that de­sign ex­cel­lence leads to mar­ket suc­cess. Not really. Ap­ple’s resur­gence is only in­ci­den­tally about de­sign. Mostly, it’s about care­fully se­lect­ing a ter­ri­tory of valu­able cus­tomers—in Ap­ple’s case, sta­tus-con­scious peo­ple with co­pi­ous dis­pos­able in­come—and de­fend­ing that ter­ri­tory tooth and nail. Ap­ple does not sell great de­sign. It sells de­sign that flat­ters its owner. (And Ap­ple’s tim­ing has been per­fect to ex­ploit the ris­ing tide of wealth inequality.)The effluent economyIt’s per­haps fit­ting that down the road from Ap­ple, we have bot­tom-feed­ing be­he­moths like Face­book and Google. These com­pa­nies are the sewage-treat­ment plants of the in­for­ma­tion age: shov­el­ing the worst qual­ity of hu­man at­ten­tion into piles, sea­son­ing it with sur­veil­lance data, and pack­ag­ing it into re­sal­able chunks. But it’s an open ques­tion whether their skill is ex­tract­ing hid­den value from the web, or merely or­ga­niz­ing its disappointments.In that way, these web-ad­ver­tis­ing com­pa­nies re­mind me mostly of the in­vest­ment banks of 10 years ago that learned to per­form sim­i­lar alchemy on sim­i­lar dis­ap­point­ments—namely, our na­tion’s sub­prime mort­gages. If you just kept slic­ing and dic­ing and shift­ing, the think­ing went, you could per­suade oth­ers that the value would ul­ti­mately emerge.Well, we know how that turned out.As an au­thor, part of me would like to opt out of the web that the Red­dits and Cre­ative Bloqs and Twit­ter"
