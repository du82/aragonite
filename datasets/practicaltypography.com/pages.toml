["https://practicaltypography.com/the-scorpion-express.html"]
title = "The scorpion express | Butterick’s Practical Typography"
description = "Butterick’s Practical Typography"
full_description = "The scorpion express:Thoughts on variable fontsHave you heard the story of the scor­pion and the frog? It goes like this: a scor­pion wants to cross a river. But he can’t swim. So he asks a nearby frog to carry him across. The frog says, “how do I know you won’t sting me?” The scor­pion replies, “Don’t be silly. We’d both drown.”Mol­li­fied, the frog in­vites the scor­pion onto his back. Halfway across the river, the scor­pion stings him. As the venom par­a­lyzes the frog, he says, “Why did you do that? Now we’ll both drown.”With that, the scor­pion un­furls a set of high-tech mo­tor­ized wings and flies to the other side of the river. With his dy­ing breath, the frog says, “So you’re a rich scor­pion? Why did you need me at all?” The scor­pion says, “I may be a rich scor­pion—but I’m still a scorpion.”If the end­ing sur­prises you, maybe you should spend more time on the com­mit­tees that make tech­nol­ogy standards.Last week, an up­date to the 20-year-old Open­Type font stan­dard was an­nounced, of­fi­cially called Open­Type Font Vari­a­tions but more com­monly known as vari­able fonts. It’s be­ing dri­ven by the usual sus­pects—Google, Ap­ple, Mi­crosoft, and Adobe. Also par­tic­i­pat­ing are an as­sort­ment of in­de­pen­dent tool de­vel­op­ers, and—al­ways val­ued for their swim­ming skills—in­di­vid­ual type designers.With­out di­min­ish­ing the ef­fort that’s been put into this new stan­dard, I’m not con­vinced there’s a plau­si­ble ra­tio­nale for it. It would im­pose sig­nif­i­cant costs on type de­sign­ers, pro­vide no ob­vi­ous ad­van­tage to our cus­tomers, and mostly ben­e­fit a small set of wealthy cor­po­rate sponsors.Be­low, I’ll ex­plain my rea­son­ing. But agree or dis­agree, I hope other type de­sign­ers will give this pro­posed stan­dard the crit­i­cal scrutiny and re­flec­tion it de­serves. Be­cause if we end up at the bot­tom of the river, we won’t be able to say we didn’t know who was rid­ing on our back.Font interpolation: Back to the futureOT Font Vari­a­tions is an up­date to the Open­Type font for­mat that will al­low font files to con­tain mul­ti­ple sets of out­lines. To­day, a sin­gle font file can only con­tain one set of out­lines. So a font fam­ily with, say, weight and width vari­ants has to be ren­dered into a ma­trix of in­di­vid­ual fonts:Di­a­gram of the Greta font fam­ily by Pe­ter BiľakBut un­der the new stan­dard, the width and weight vari­a­tions can be pack­aged into a sin­gle font file.Fur­ther­more, cus­tomers will be able to in­ter­po­late be­tween styles. So rather than, say, a set of dis­crete weight options:Weight be­comes con­tin­u­ously vari­able, and a cus­tomer can choose any­thing in between:This idea is not new. In the early ’90s, Ap­ple and Adobe launched com­pet­ing font-in­ter­po­la­tion sys­tems. Ap­ple’s was called True­Type GX; Adobe’s was called Mul­ti­ple Mas­ter fonts. Ap­ple’s had the ad­van­tage of be­ing built into the Mac OS. Adobe’s had the ad­van­tage of be­ing sup­ported by Post­Script and PDF.In fact, dur­ing 1993, I was one of sev­eral type de­sign­ers who worked with Matthew Carter on Skia, a font with weight and width vari­ants that Ap­ple com­mis­sioned to show off True­Type GX. In true time-is-a-flat-cir­cle fash­ion, Skia has a star­ring role in Mi­crosoft’s new OT Font Vari­a­tions white pa­per. (Pearl Jam, un­for­tu­nately, was not avail­able as an open­ing act.)“So why haven’t we been us­ing this amaz­ing tech­nol­ogy for the last 20 years?” Be­cause it was a New­ton-es­que flop. Be­yond the Ap­ple–Adobe taffy pull, pro­fes­sional print­ers didn’t want to deal with more font headaches (in the ’90s, they al­ready had plenty). And cus­tomers were de­lighted to have any kind of se­lec­tion of dig­i­tal fonts—the in­cre­men­tal value of in­ter­po­lated styles was small. Thus, com­pa­nies that made page-lay­out pro­grams didn’t want to sup­port GX or MM ei­ther. Ul­ti­mately, too much cost and not enough benefit.The les­son: if the cus­tomer doesn’t ben­e­fit, no one can.The case for (and against) obsolescenceThe stag­na­tion of dig­i­tal-font for­mats is one of the most net­tle­some as­pects of type de­sign. Open­Type has now been with us for nearly 20 years (its par­ent, True­Type, has been around for 25). One of the dis­tin­guish­ing fea­tures of OT Font Vari­a­tions is that it’s not mean­ing­fully back­ward com­pat­i­ble with Open­Type. Es­sen­tially, it’s a new for­mat that pro­poses to even­tu­ally sup­plant to­day’s Open­Type font families.(By the way, when I say the new fonts are not “back­ward com­pat­i­ble”, I mean that they won’t work with op­er­at­ing sys­tems and pro­grams that cur­rently sup­port Open­Type. I don’t mean that the new stan­dard will break ex­ist­ing Open­Type fonts.)In one sense, it’s in­ter­est­ing to think that the fonts I ship to cus­tomers to­day could be in­stalled and used equally well on a Win­dows 95 ma­chine. But in most senses, it’s point­less. Be­cause in prac­tice, my fonts will never be used on com­put­ers from that era.The con­verse is not true, how­ever. Fonts made 20 or more years ago are still us­able on to­day’s ma­chines. In fact, they make up the bulk of the Mono­type and Adobe font li­braries. Many re­main on to­day’s best­seller lists. So in fonts, un­like other cat­e­gories of soft­ware, type de­sign­ers have a pe­cu­liar prob­lem: our new work has to com­pete against decades of ac­cu­mu­lated competitors.Is that a good thing? In terms of turn­ing over in­ven­tory, no. All tech­nol­ogy com­pa­nies de­pend on a cer­tain level of ob­so­les­cence. It cre­ates re­cur­ring rev­enue, of course. But it also helps avoid the es­ca­lat­ing costs and con­straints of back­ward compatibility.More­over, this is a new sit­u­a­tion for type. Long ago, when type was made of wood and metal, it would nat­u­rally wear out with use, and need to be re­placed. In the 20th cen­tury, ad­vance­ments in type­set­ting tech­nol­ogy meant that font li­braries would have to be tossed out and re­placed with new for­mats. So ob­so­les­cence was al­ways in the mix. These days, dig­i­tal fonts seem end­lessly durable.Still, these his­tor­i­cal com­par­isons are strained. Now 30 years old, dig­i­tal type­found­ing seems ma­ture rel­a­tive to other dig­i­tal tech­nol­ogy. But rel­a­tive to other type­found­ing tech­nol­ogy, it’s just a blip. For most of type­set­ting his­tory, be­ing a type­founder meant spend­ing your ca­reer near molten metal and car­cino­gens, not an Aeron chair and Keurig cof­fee pods.Fur­ther­more, though in the past I’ve com­plained about the per­sis­tence of dig­i­tal fonts, it veers to­ward one of my least fa­vorite ar­gu­ments: the idea that a cre­ative per­son has a right to make a liv­ing from their work. Sorry, but no one does. The mar­ket—though ar­ti­fi­cial and im­per­fect—sets the rules. Other fonts ex­ist. Hun­dreds of thou­sands, in fact. As type de­sign­ers, we can ei­ther deal with that fact, or find some­thing else to do with our time.To be fair, for­mat stag­na­tion isn’t all bad. As a re­sult of run­ning my own type foundry since 2011, I’ve learned first­hand that no mat­ter how much cus­tomers love fonts, they’re look­ing for a low-main­te­nance re­la­tion­ship. Pos­si­bly com­pli­cat­ing this re­la­tion­ship is the fact that fonts are called upon to per­form in a count­less com­bi­na­tions of op­er­at­ing sys­tems, type­set­ting pro­grams, and out­put de­vices. But in prac­tice, fonts just work. This is mirac­u­lous. As an in­de­pen­dent type de­signer, if I had to trou­bleshoot every setup sep­a­rately, I couldn’t stay in busi­ness. As it stands, I get al­most zero sup­port requests.Why is this pos­si­ble? Be­cause font for­mats have been so sta­ble for so long. I have to imag­ine the cal­cu­lus is sim­i­lar for other in­de­pen­dent type de­sign­ers. So yes, for­mat stag­na­tion is bad for busi­ness in the sense of putting a ceil­ing on what we can ac­com­plish. But it’s ar­guably a nec­es­sary in­gre­di­ent for independence.Com­ing full cir­cle, though it’s tempt­ing to fid­dle with the mile-high Jenga tower that com­prises to­day’s font-tech­nol­ogy stack, there are risks as well. Not of the “who moved my cheese” va­ri­ety, but rather of cus­tomers get­ting an­noyed with new­fan­gled fonts that over­promise and un­der­de­liver. As we’ve dis­cov­ered, when cus­tomers get frus­trated with fonts, they blame type de­sign­ers. Or they blame cor­po­ra­tions, who in turn blame type de­sign­ers. See the pat­tern? (The most com­mon re­sponse to my few re­quests for tech­ni­cal sup­port is “That prob­lem isn’t be­ing caused by my fonts, but I wish it were, be­cause then I could fix it for you.”)The les­son: Be care­ful what you wish for.Learning from OpenTypeThough nei­ther True­Type GX nor Mul­ti­ple Mas­ter fonts caught on, Adobe and Mi­crosoft col­lab­o­rated on the Open­Type spec­i­fi­ca­tion in the mid-’90s. (Ap­ple joined in later.) The im­pe­tus for this change was not aes­thetic, but prac­ti­cal: in or­der to sup­port the more com­plex writ­ten lan­guages that are com­mon out­side the US and Eu­rope, fonts and lay­out sys­tems needed to be more so­phis­ti­cated. And with­out sup­port for those lan­guages, no­body could sell their prod­ucts in those parts of the world.Need­less to say, with huge eco­nomic in­cen­tives on the ta­ble, the new for­mat took off. Well, sort of: the parts of Open­Type that sup­ported new lan­guage sys­tems took off quickly. What didn’t were the parts, like Open­Type fea­tures, that im­proved ty­pog­ra­phy in cur­rent lan­guage systems.For in­stance, though the Open­Type spec­i­fi­ca­tion was re­leased in 1996, Mi­crosoft Word didn’t sup­port Open­Type fea­tures un­til 2010. Ex­cel and Power­Point still don’t. Ap­ple stopped sup­port­ing Open­Type fea­tures in Pages for sev­eral years, in def­er­ence to its iOS ver­sion. And to­day’s crop of web browsers sup­port these fea­tures with dif­fer­ent lev­els of competence.The les­son: when cus­tomers and cor­po­ra­tions def­i­nitely ben­e­fit (e.g., Open­Type lan­guage sup­port), de­sign­ers can too. When cus­tomers and de­sign­ers might ben­e­fit (e.g., Open­Type ty­pog­ra­phy fea­tures), cor­po­ra­tions are unreliable.Learning from WOFFThe last col­lab­o­ra­tion be­tween the scor­pi­ons and the frogs was WOFF (= Web-Only File For­mat). In 2009, the near-to­tal ab­sence of fonts on the web had be­come a source of frus­tra­tion for web de­sign­ers, who blamed type de­sign­ers for em­bar­go­ing the global font sup­ply, like some schem­ing Bond vil­lain (Dr. No Kern­ing? Glyphfinger?)Some type de­sign­ers, wisely sens­ing an op­por­tu­nity for a diplo­matic res­o­lu­tion, pro­posed what be­came WOFF—a for­mat de­rived from Open­Type that would put fonts into browsers quickly while pro­tect­ing type-de­signer in­ter­ests (mostly, by mak­ing it harder to copy and use web­fonts on the desk­top). Browser mak­ers got in­volved. The W3C got in­volved. Soon, WOFF was off to the races. That was the good news.The bad news? Once the dust set­tled, a type de­signer who was in­volved in the ef­fort wrote me that “the foundries who or­ga­nized be­hind this ef­fort didn’t get A SIN­GLE THING that they wanted”. (Em­pha­sis in orig­i­nal.) In other words, in terms of is­sues that mat­tered to de­sign­ers, WOFF was a waste of time—even though it was a de­signer-ger­mi­nated proposal.I wasn’t in­volved in WOFF. But it’s no crit­i­cism of those who were to ob­serve that this kind of out­come has never been un­usual at the W3C, or within any stan­dards process. Those who can pay to pro­tect their in­ter­ests of­ten do. Those who can’t, don’t.More­over, one of the by-de­sign side ef­fects of a stan­dards process is to achieve po­lit­i­cal peace with pos­si­ble fu­ture op­po­nents. When you pro­vide op­po­nents an op­por­tu­nity to be heard, they’re per­ma­nently dis­armed. How can any­one com­plain about the re­sult of a process that they par­tic­i­pated in?The les­son: when cus­tomers and cor­po­ra­tions ben­e­fit, de­sign­ers should think twice about stand­ing in the way, be­cause our ne­go­ti­at­ing lever­age is limited.Learning from WOFF2WOFF2 is an up­date to WOFF that was first pro­posed in May 2014. Un­like WOFF Clas­sic, WOFF2 was not a col­lab­o­ra­tion be­tween type de­sign­ers and browser mak­ers. It was just some­thing Mono­type and Google wanted. And, since they’re both pay­ing mem­bers of the W3C, they got it.Why did they want it? The only sig­nif­i­cant change in WOFF2 was that it added a new com­pres­sion scheme that can make font files smaller. Why did Google and Mono­type want smaller files? Be­cause they’re two of the three biggest providers of hosted web­fonts. (The other is Adobe, who sup­ported it quickly.) Cut your file sizes = cut your host­ing bills. Sim­ple. For cus­tomers and de­sign­ers, it was met with a shrug, since WOFF2 didn’t change any­thing in­side the font.The les­son: when cor­po­ra­tions ben­e­fit, and cus­tomers and de­sign­ers are un­af­fected, they get what they want.The file-size myth“But cus­tomers ben­e­fit from smaller file sizes too, be­cause that makes web pages faster.” Cer­tainly, that was true in 1996. And some web de­vel­op­ers per­sist with po­lit­i­cal ob­jec­tions. But with to­day’s faster con­nec­tions—even on mo­bile—op­ti­miz­ing for file size is less use­ful than ever.Net­work la­tency—that is, the num­ber of re­quests a web page makes to var­i­ous servers mul­ti­plied by how long each takes to es­tab­lish—is the real buga­boo. In 1996, a web page might have made a few re­quests to down­load im­ages. These days, thanks to the noth­ing-but-ad­ver­tis­ing econ­omy of the web, a page might make “hun­dreds or even thou­sands of re­quests to fully load all of the ad­ver­tise­ments and an­a­lyt­ics”, ac­cord­ing to one study by Forbes.To­gether, stream­ing-video ser­vices con­sume 75% of the in­ter­net’s band­width. Their sup­port for net neu­tral­ity is mostly about not want­ing to pay for what they use.For Google in par­tic­u­lar, we should shed a gi­ant croc­o­dile tear when­ever it con­cern-trolls us about file sizes on the web. YouTube (owned by Google) con­sumes an as­ton­ish­ing 18% of all in­ter­net band­width, sec­ond only to Net­flix (an eye-wa­ter­ing 37%). The file sizes of fonts—geez, that seems low on the list of the in­ter­net’s band­width problems.FWIW, since 2013, Prac­ti­cal Ty­pog­ra­phy has been an on­go­ing ex­per­i­ment in ex­treme web­fonting. I’ve pushed about a megabyte of fonts to mil­lions of read­ers, who are us­ing all kinds of web browsers and plat­forms (in­clud­ing mo­bile). To­tal com­plaints I’ve re­ceived about page per­for­mance: zero. Of course, I don’t have ads or track­ers ei­ther. So it’s a ques­tion of priorities.For rea­sons un­clear, this claim about net­work la­tency has al­ways pro­voked howls of out­rage among the web-dev Twit­terati. Folks, let’s work from ev­i­dence, not su­per­sti­tion. For ex­am­ple, here’s a quick test I did in Sep"
year_published = 2025
