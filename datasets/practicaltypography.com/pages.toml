title = "Kerning | Butterick’s Practical Typography"
description = "Butterick’s Practical Typography"
full_description = "kerningTurn it onKern­ing is the ad­just­ment of spe­cific pairs of let­ters to im­prove spac­ing and fit. (It’s dis­tinct from let­terspac­ing, which af­fects all pairs.) Most fonts come with hun­dreds and some­times thou­sands of kern­ing pairs in­serted by the font designer.It’s also pos­si­ble to man­u­ally kern let­ter pairs. For pro­fes­sional ty­pog­ra­phers, this is a manda­tory skill, but for every­one else, the built-in kern­ing is just fine.Be­low, no­tice how kern­ing re­duces the large gaps be­tween cer­tain let­ter pairs, mak­ing them con­sis­tent with the rest of the font.Al­ways use kern­ing. If you use para­graph and char­ac­ter styles, turn on kern­ing as part of your style definitions.How to turn on kerningWordRight-click in the text and se­lect Font from the menu. Click the Advanced tab. Check the box that says Kerning for fonts ____ Points and above. Put the num­ber 8 in the point-size box.PagesKern­ing is on by de­fault and can­not be turned off.CSStext-ren­der­ing: op­ti­mize­Leg­i­bil­ity, and en­able the Open­Type fea­ture kernby the wayPro­fes­sional page-lay­out pro­grams make it pos­si­ble to man­u­ally kern let­ter pairs. For pro­fes­sional ty­pog­ra­phers, this is a manda­tory skill, but for every­one else, the built-in kern­ing is adequate.See met­rics vs. op­ti­cal spac­ing for a spe­cial note about how Adobe In­De­sign han­dles kerning."
