["https://practicaltypography.com/page-layout.html"]
title = "Page layout | Butterick’s Practical Typography"
description = "Butterick’s Practical Typography"
full_description = "Page layout Page from the Kelm­scott Chaucer, printed by William Mor­ris, 1896.Type com­po­si­tion was about pick­ing the right char­ac­ters. Text for­mat­ting was about the vi­sual ap­pear­ance of those char­ac­ters. Page lay­out is about the po­si­tion­ing and re­la­tion­ship of text and other el­e­ments on the page.In fine print­ing, ty­pog­ra­phers usu­ally get to choose the page size of their doc­u­ments. But you don’t—most of the doc­u­ments a writer prints will be on stan­dard printer pa­per. And on the web, your reader es­sen­tially chooses the size.That’s no rea­son to tol­er­ate medi­oc­rity. Eng­lish artist and printer William Mor­ris fa­mously re­belled against mech­a­nized, mass-pro­duced ty­pog­ra­phy—in the 1890s. He went on to pro­duce a se­ries of beau­ti­ful books in­tended to re­mind read­ers and writ­ers what was pos­si­ble on the printed page, in con­trast to the coarse rit­ual of in­dus­tri­al­ized printing.To­day, the strug­gle con­tin­ues. Word proces­sors and web browsers beckon us with de­fault set­tings and tem­plates that promise great re­sults with no effort.But you only get out what you put in. Don’t ac­cept the de­faults. You can do better.centered textjustified textfirst-line indentsspace between paragraphsline spacingline lengthpage marginsbody texthyphenationblock quotationsbulleted and numbered liststablesrules & bordersspace above & belowwidow and orphan controlkeep lines togetherkeep with next paragraphpage break beforecolumnsgridsparagraph and character stylesmaxims of page layout"
year_published = 2025
