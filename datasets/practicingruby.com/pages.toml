full_description = "Code reuse in Ruby: It's complicated! Feb 12, 2013 • Gregory Brown NOTE: This article was one of many content experiments published in Volume 6, which aimed to try out different formats and styles to see what readers thought of them. In many of our articles, I have attempted to discuss the question of code reuse in Ruby (particularly composition vs. inheritance), but have found it difficult to express these ideas in our traditional format. Ruby’s code sharing semantics cannot be easily expressed in a simple linear story arc, so a more formal style might help reveal the deeply interconnected concepts that make up this topic. Because it fits the structure a bit better, I’ve rendered this article in PDF format. Please download the document and let me know what you think! Practicing Ruby is a Practicing Developer project.All articles on this website are independently published, open source, and advertising-free. Want to keep reading? Check out the archives for more.(Or see more from Gregory at practicingdeveloper.com)"
