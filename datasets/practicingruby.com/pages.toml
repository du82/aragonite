title = "An adventure in prototypes"
description = "This article was written by Avdi Grimm. Avdi is a Ruby Rogue, aconsulting pair programmer, and the head chef at RubyTapas. He writesabout software developmen..."
full_description = '''An adventure in prototypes Dec 11, 2012 • Avdi Grimm This article was written by Avdi Grimm. Avdi is a Ruby Rogue, a consulting pair programmer, and the head chef at RubyTapas. He writes about software development at Virtuous Code. When you think of the term object-oriented programming, one of the first associated words that springs to mind is probably classes. For most of its history, the OOP paradigm has been almost inextricably linked with the idea of classes. Classes serve as object factories: they hold the blueprint for new objects, and can be called upon to manufacture as many as needed. Each object, or instance, has its state, but each derives its behavior from the class. Classes, in turn, share behavior through inheritance. In most OO programs, the class structure is the primary organizing principle. Even though classes have gone hand-in-hand with OOP for decades, they aren’t the only way to build families of objects with shared behavior. The most common alternative to class-based programming is prototype-based programming. Languages that use prototypes rather than classes include Self, Io, and (most well known of all) JavaScript. Ruby comes from the class-based school of OO language design. But it’s flexible enough that with a little cleverness, we can experiment with prototype-style coding. In this article that’s just what we’ll do. Getting started So how do we write OO programs without classes? Let’s explore this question in Ruby. We’ll use the example of a text-adventure game in the style of “Colossal Cave Adventure”. This is one of my favorite programming examples for object-oriented systems, since it involves modeling a virtual world of interacting objects, including characters, items, and interconnected rooms. We open up an interactive Ruby session, and start typing. We begin with an adventurer object. This object will serve as our avatar in the game’s world, translating our commands into interactions between objects: adventurer = Object.new The first ability we give to our adventurer is the ability to look at its surroundings. The look command will cause the adventurer to output a description of its current location: class << adventurer attr_accessor :location def look puts location.description end end Then we add a starting location, called end_of_road, and put the adventurer in that location: end_of_road = Object.new def end_of_road.description <<END You are standing at the end of a road before a small brick building. Around you is a forest. A small stream flows out of the building and down a gully. END end adventurer.location = end_of_road Now we can tell our adventurer to take a look around: > adventurer.look You are standing at the end of a road before a small brick building. Around you is a forest. A small stream flows out of the building and down a gully. Adding some conveniences So far we’ve created an adventurer and a starting room without any kind of Adventurer or Room classes. This adventure is getting off to a good start! Although, if we’re going to be creating a lot of these objects we’d like for the process to be a little less verbose. We decide to take a step back and build some syntax sugar before moving onward. We start with an ObjectBuilder helper class. Yes, this is a class, when we are supposed to be using only prototypes. However, Ruby doesn’t offer a lot of support for prototype-based programming out of the box. So we have to build our tools with the class-oriented materials at hand. This is intended to be behind-the-scenes support code. In other words, pay no attention to the man behind the green curtain! class ObjectBuilder def initialize(object) @object = object end def respond_to_missing?(missing_method, include_private=false) missing_method =~ /=\z/ end def method_missing(missing_method, *args, &block) if respond_to_missing?(missing_method) method_name = missing_method.to_s.sub(/=\z/, '') value = args.first ivar_name = "@#{method_name}" if value.is_a?(Proc) define_code_method(method_name, ivar_name, value) else define_value_method(method_name, ivar_name, value) end else super end end def define_value_method(method_name, ivar_name, value) @object.instance_variable_set(ivar_name, value) @object.define_singleton_method(method_name) do instance_variable_get(ivar_name) end end def define_code_method(method_name, ivar_name, implementation) @object.instance_variable_set(ivar_name, implementation) @object.define_singleton_method(method_name) do |*args| instance_exec(*args, &instance_variable_get(ivar_name)) end end end There’s a lot going on in this class. Going over it line-by-line might be interesting in its own right, but it wouldn’t advance our understanding of prototype-based programming all that much. Suffice to say for now that this class can help us add new attributes and methods to a singleton object using a concise assignment-style syntax. This will make more sense when we start to make use of it. We add another bit of syntax sugar: a global method named Object (not to be confused with the class of the same name): def Object(&definition) obj = Object.new obj.singleton_class.instance_exec(ObjectBuilder.new(obj), &definition) obj end This method takes a block, instantiates a new object, and evaluates the block in the context of the object’s singleton class, passing an ObjectBuilder as a block argument. Then it returns the new object. Now we recreate our adventurer using this new helper: adventurer = Object { |o| o.location = end_of_road attr_writer :location o.look = ->(*args) { puts location.description } } The combination of the Object factory method and the ObjectBuilder gives us a convenient, powerful notation for creating new ad-hoc objects. We can create attribute reader methods and assign the value of the attribute all at once: o.location = end_of_road We can use standard Ruby class-level code: attr_writer :location And finally we can define new methods by assigning a lambda to an attribute: o.look = ->(*args) { puts location.description } We’ve deliberately avoided defining methods using def or define_method. We’ll get into the reasons for that later on. Before we move on, let’s take a moment to make sure our shiny new adventurer still works the same as before: > adventurer.look You are standing at the end of a road before a small brick building. Around you is a forest. A small stream flows out of the building and down a gully. Moving around It’s time to let our adventurer object stretch its legs a bit. We want to give it the ability to move from location to location. First, we make a small modification to our Object() method: def Object(object=nil, &definition) obj = object || Object.new obj.singleton_class.instance_exec(ObjectBuilder.new(obj), &definition) obj end Now along with creating new objects, Object() can also augment an existing object which is passed in as an argument. We pass the adventurer to Object(), and add a new #go method. This method will take a direction (like :east), and attempt to move to the new location using the exits association on its current location: Object(adventurer) { |o| o.go = ->(direction){ if(destination = location.exits[direction]) self.location = destination puts location.description else puts "You can't go that way" end } } We add a destination room to the system: wellhouse = Object { |o| o.description = <<END You are inside a small building, a wellhouse for a large spring. END } Then we add an exits Hash to end_of_road, with an entry saying that the wellhouse is to the :north of it: Object(end_of_road) { |o| o.exits = {north: wellhouse} } With that done, we are now ready to set off on our journey! > adventurer.go(:north) You are inside a small building, a wellhouse for a large spring. Cloning prototypes We try to go north again, expecting to see the admonition “You can’t go that way” as we bump into the wall: > adventurer.go(:north) Instead, we get an exception: -:82:in `block (2 levels) in <main>': undefined method `exits' for #<Object:0x0000000434d768> (NoMethodError) from -:56:in `instance_exec' from -:56:in `block (2 levels) in define_code_method' from -:100:in `<main>' This is because we never got around to adding an exits Hash to wellhouse. We could go ahead and do that now. But as we think about it, we realize that now that our adventurer is capable of travel, it would make sense if all rooms started out with an empty exits Hash, instead of us having to add it manually every time. Toward that end, we create a prototypical room: room = Object { |o| o.exits = {} } We then experiment with creating a new wellhouse, this one based on the room prototype. We do this by simply cloning the room object. We use #clone rather than #dup because #clone copies singleton class methods: new_wellhouse = room.clone new_wellhouse.exits[:south] = end_of_road We quickly uncover a problem with this naive cloning technique. Because Ruby’s #clone (as well as #dup) are shallow copies, room and new_wellhouse now share the same exits: require 'pp' puts "new_wellhouse exits:" pp new_wellhouse.exits puts "room exits:" pp room.exits new_wellhouse exits: {:south=> #<Object:0x0000000482c8d8 @exits= {:north=> #<Object:0x0000000482bcd0 @description= "You are inside a small building, a wellhouse for a large spring.\n">}>} room exits: {:south=> #<Object:0x0000000482c8d8 @exits= {:north=> #<Object:0x0000000482bcd0 @description= "You are inside a small building, a wellhouse for a large spring.\n">}>} To fix this, we could possibly customize the way Ruby does cloning by overriding the Object#initialize_clone method, but that would be an invasive change with broad reaching effects. Because extending core objects is a bit safer than modifying them, we opt to define our own Object#copy method which does a one-level-deep copying of instance variables: class Object def copy prototype = clone instance_variables.each do |ivar_name| prototype.instance_variable_set( ivar_name, instance_variable_get(ivar_name).clone) end prototype end end Then we recreate room and new_wellhouse, and confirm that they no longer share exits: room = Object { |o| o.exits = {} } # Use the newly defined Object#copy here instead of Object#clone new_wellhouse = room.copy new_wellhouse.exits[:south] = end_of_road puts "new_wellhouse exits:" pp new_wellhouse.exits puts "room exits:" pp room.exits new_wellhouse exits: {:south=> #<Object:0x00000002ea85d8 @exits= {:north=> #<Object:0x00000002ea79d0 @description= "You are inside a small building, a wellhouse for a large spring.\n">}>} room exits: {} Cloning a prototypical object in order to create new objects is the most basic form of prototype-based programming. In fact, the “Kevo” research language (I’d link to it, but all the information about it seems to have fallen off the Internet) used copying as the sole way to share behavior between objects. Building dynamic prototypes There are drawbacks to copying, however. It’s a very static way to share behavior between objects. Clones of room only share the behavior which was defined at the time of the copy. If we were to modify room, we’d have to recreate the new_wellhouse object once again in order to take advantage of any new methods added to it. Cloning also implies single inheritance. An object can only be a clone of one “parent” object. Finally, we also can’t add any new behavior to our existing wellhouse object this way. We’d have to throw away our program’s state and rebuild it, this time cloning our end_of_road and wellhouse objects from room. In Ruby, we’re used to being able to make changes to a live session and see how they play out. Thus far, we’ve done this all in a live interpreter session. It seems a shame to have to lose our state and start again. So we decide to find out if we can come up with a more dynamic form of prototypical inheritance than plain copying. We start by adding a helper method called #implementation_of to Object. Given a method name that the object supports, it will return a Proc object containing the code of that method. We make it aware of the style of method definition used in ObjectBuilder, where the implementation Procs of new methods were stored in instance variables named for the methods: class Object def implementation_of(method_name) if respond_to?(method_name) implementation = instance_variable_get("@#{method_name}") if implementation.is_a?(Proc) implementation elsif instance_variable_defined?("@#{method_name}") # Assume the method is a reader ->{ instance_variable_get("@#{method_name}") } else method(method_name).to_proc end end end end We then define a new kind of Module, called Prototype: class Prototype < Module def initialize(target) @target = target super() do define_method(:respond_to_missing?) do |missing_method, include_private| target.respond_to?(missing_method) end define_method(:method_missing) do |missing_method, *args, &block| if target.respond_to?(missing_method) implementation = target.implementation_of(missing_method) instance_exec(*args, &implementation) else super(missing_method, *args, &block) end end end end end A Prototype is instantiated with a prototypical object. When a Prototype instance is added to an object using #extend, it makes the methods of the prototype available to the extended object. It does this by implementing #method_missing? (and the associated #respond_to_missing?). When a message is sent to the extended object that matches a method on the prototype object, the Prototype grabs the implementation Proc from the prototype. Then it uses #instance_exec to evaluate the prototype’s method in the context of the extended object. In effect, the extended object “borrows” a method from the prototype object for just long enough to execute it. Note that this is different from delegation. In delegation, one object hands off a message to be handled by another object. If object a delegates a #foo message to object b, using, for instance, Ruby’s forwardable library, self in that method will be object b. This is easily demonstrated: require 'forwardable' class A extend Forwardable attr_accessor :b def_delegator :b, :foo end class B def foo puts "executing #foo in #{self}" end end a = A.new a.b = B.new a.foo # >> executing #foo in #<B:0x00000003295e20> But delegation is not what we want. We want to execute the methods from prototypes as if they had been defined on the inheriting object. We want this because we want them to work with the instance variables of the inheriting object. If we send wellhouse.exits, we want the reader method to show us the content of wellhouse’s @exits instance variable, not room’s instance variable. Remember how, in ObjectBuilder, we stored the implementations of methods as Procs in instance variables rather than defining them directly as methods? This need to call prototype methods on the inheriting object is the reason for that. In Ruby, it is not possible to execute a method from class A on an instance of unrelated class B. Since in this program we are using the singleton classes of objects to define'''
