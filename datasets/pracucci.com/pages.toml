["https://pracucci.com/display-the-current-kubelet-context-in-the-bash-prompt.html"]
title = "Display the current kubectl context in the Bash prompt"
description = "A simple yet effective way to display the current Kubernetes context in the Bash shell prompt."
full_description = '''Display the current kubectl context in the Bash prompt 18 Aug 2016 by Marco Pracucci Comments It’s an hot day at Spreaker: we’re finally rolling out to production the very first piece of our next-generation infrastructure, based upon Docker and Kubernetes. Now that we’ve two environments running Kubernetes (staging and prod) it’s vital we don’t mess up with kubectl, manually running on production commands that were supposed to run in our staging environment. The easy way to reduce such risk that came out to my mind is to display the current kubectl context in the shell prompt. Basically, something like this: After a quick Google search, I didn’t find anything similar (please correct me if I’m wrong), so here is how I did it. 1. Create ~/kube-prompt.sh Create a script kube-prompt.sh in your home with the following content. It just defines a function __kube_ps1() that prints the current kubectl context (if any): #!/bin/bash __kube_ps1() { # Get current context CONTEXT=$(cat ~/.kube/config | grep "current-context:" | sed "s/current-context: //") if [ -n "$CONTEXT" ]; then echo "(k8s: ${CONTEXT})" fi } ## 2. Edit your Bash prompt in ~/.bash_profile Edit the file .bash_profile in your home, loading ~/kube-prompt.sh and injecting __kube_ps1() in your prompt. For example, my prompt is: NORMAL="\[\033[00m\]" BLUE="\[\033[01;34m\]" YELLOW="\[\e[1;33m\]" GREEN="\[\e[1;32m\]" source ~/kube-prompt.sh export PS1="${BLUE}\W ${GREEN}\u${YELLOW}\$(__kube_ps1)${NORMAL} \$ " You may also be interested in ... Kubernetes Security: book review My take on the future of applications development and operability PHP realpath cache and Kubernetes secrets / configmap updates Kubernetes pods /etc/resolv.conf ndots:5 option and why it may negatively affect your application performances AWS re:invent 2017 annoucements Kubernetes RBAC with kops Stepping back from CTO and jumping into operations KubeCon 2017 - Kubernetes Takeaways Prometheus: understanding the delays on alerting Graceful shutdown of pods with Kubernetes Distributed Matters Conf: Takeaways Upcoming conferences I will join the following conferences. Reach me out on Twitter if you wanna meet: Incontro DevOps 2020 Virtual 22 October 2020 Comments var disqus_shortname = 'pracucci'; (function () { var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true; dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq); })(); (function () { var s = document.createElement('script'); s.async = true; s.type = 'text/javascript'; s.src = '//' + disqus_shortname + '.disqus.com/count.js'; (document.getElementsByTagName('HEAD')[0] || document.getElementsByTagName('BODY')[0]).appendChild(s); }());'''
