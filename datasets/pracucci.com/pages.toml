title = "Electron - Enable copy and paste"
description = "To enable copy and paste (clipboard) you should configure you app's menu, using Menu.setApplicationMenu() - See an example"
full_description = '''Electron - Enable copy and paste 13 Jun 2015 by Marco Pracucci Comments If you’re new to Electron (formerly known as Atom Shell) you will notice that copy and paste (CMD+C / CMD+V on Mac) will not work, both in your app and DevTools. This is due to the lack of the application’s menu with keybindings to the native clipboard. To enable the clipboard features and copy/paste shortcuts you should configure your app’s menu, using Menu.setApplicationMenu() from Electron’s menu module. var Menu = require("menu"); var template = [{ label: "Application", submenu: [ { label: "About Application", selector: "orderFrontStandardAboutPanel:" }, { type: "separator" }, { label: "Quit", accelerator: "Command+Q", click: function() { app.quit(); }} ]}, { label: "Edit", submenu: [ { label: "Undo", accelerator: "CmdOrCtrl+Z", selector: "undo:" }, { label: "Redo", accelerator: "Shift+CmdOrCtrl+Z", selector: "redo:" }, { type: "separator" }, { label: "Cut", accelerator: "CmdOrCtrl+X", selector: "cut:" }, { label: "Copy", accelerator: "CmdOrCtrl+C", selector: "copy:" }, { label: "Paste", accelerator: "CmdOrCtrl+V", selector: "paste:" }, { label: "Select All", accelerator: "CmdOrCtrl+A", selector: "selectAll:" } ]} ]; Menu.setApplicationMenu(Menu.buildFromTemplate(template)); Cross-platform support UPDATE: as currectly suggested by Raghu in the comments below, you can use the special accelerator modifier CmdOrCtrl to get a cross-platform behavior. CmdOrCtrl will use Command on OSX and Ctrl on Windows and Linux. Working example To get the big picture, please see the following fully working example. main-electron.js var app = require("app"); var BrowserWindow = require("browser-window"); var Menu = require("menu"); var mainWindow = null; app.on("window-all-closed", function(){ app.quit(); }); app.on("ready", function () { mainWindow = new BrowserWindow({ width: 980, height: 650, "min-width": 980, "min-height": 650 }); mainWindow.openDevTools(); mainWindow.loadUrl("file://" + __dirname + "/index.html"); mainWindow.on("closed", function () { mainWindow = null; }); // Create the Application's main menu var template = [{ label: "Application", submenu: [ { label: "About Application", selector: "orderFrontStandardAboutPanel:" }, { type: "separator" }, { label: "Quit", accelerator: "Command+Q", click: function() { app.quit(); }} ]}, { label: "Edit", submenu: [ { label: "Undo", accelerator: "CmdOrCtrl+Z", selector: "undo:" }, { label: "Redo", accelerator: "Shift+CmdOrCtrl+Z", selector: "redo:" }, { type: "separator" }, { label: "Cut", accelerator: "CmdOrCtrl+X", selector: "cut:" }, { label: "Copy", accelerator: "CmdOrCtrl+C", selector: "copy:" }, { label: "Paste", accelerator: "CmdOrCtrl+V", selector: "paste:" }, { label: "Select All", accelerator: "CmdOrCtrl+A", selector: "selectAll:" } ]} ]; Menu.setApplicationMenu(Menu.buildFromTemplate(template)); }); You may also be interested in ... Electron? It works for us, and makes desktop fun and fast Electron - Slow performances in background Electron - Open DevTools in a popup Electron - Signing a Mac Application Upcoming conferences I will join the following conferences. Reach me out on Twitter if you wanna meet: Incontro DevOps 2020 Virtual 22 October 2020 Comments var disqus_shortname = 'pracucci'; (function () { var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true; dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq); })(); (function () { var s = document.createElement('script'); s.async = true; s.type = 'text/javascript'; s.src = '//' + disqus_shortname + '.disqus.com/count.js'; (document.getElementsByTagName('HEAD')[0] || document.getElementsByTagName('BODY')[0]).appendChild(s); }());'''
