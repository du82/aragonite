["https://pracucci.com/kubecon-europe-2018-memo-and-takeaways.html"]
title = "KubeCon Europe 2018 - Memo and Takeaways"
full_description = '''KubeCon Europe 2018 - Memo and Takeaways 05 May 2018 by Marco Pracucci Comments The KubeCon and CloudNativeConf Europe 2018 is just over and it was really a blast! I had the opportunity to meet and talk with a lot of talented and smart people, share ideas and learn, learn a lot. Despite the conference and the city are quite expensive for people - like me - coming from the south of Europe, it was really worth the money and my feeling at the end of the conference was more or less this: A deep sense of sadness hit me tonight. I enjoyed this #KubeCon more than any other conf. Really, it was a blast! I will miss the amazing talented people I've met. From the deep of my hearth, I would like to work with all of you. Kudos, great community.— Marco 🇪🇺 (@pracucci) May 4, 2018 I’m used to take notes at each conference I attend and KubeCon was not an exception. In this post I will share random notes and takeaways from the conf, in the form of a publicly-shared personal memo. It just covers talks I’ve attended, that means it just covers my personal interests within the wide CNCF landscape. It’s an opinionated list of notes with inputs from talks and people I’ve met. It doesn’t pretend to be neither discursive, complete or fully accurate. They’re just my notes, as a starting point from which I will deep dive into the next weeks and months. In this memo: Notes on the conference organization Notes on autoscaling Notes on networking Notes on AWS EKS Notes on resource management Notes on monitoring Notes on security Notes on tools Keynotes really worth to watch Notes on the conference organization First of all, a big shout out to CNCF and all people involved in running the conference. Everything was perfect, from the beautiful location to the food catering being able to feed 4300 people without queues, from the evening party at Tivoli Gardens to the high quality keynotes and talks. Well done! Notes on autoscaling Kubernetes support three types of autoscaling: Horizontal Pod Autoscaler (HPA) Vertical Pod Autoscaler (VPA) Cluster Autoscaler (CA) Horizontal Pod Autoscaler (HPA) Scales up/down the number of replicas of a pod. Requires gauge metrics. Built-in support for CPU and memory pod metrics. Works best with stateless applications. Vertical Pod Autoscaler (VPA) Adjust resource requests (CPU and Mem requests) for the containers in a pod, based on usage. Since currently it’s not possible to change container resources without restarting the pod, Kubernetes will restart the pod each time the resources change. Can operate in three modes: Auto: VPA assigns resource requests on pod creation as well as updates them on running pods (default). Initial: VPA only assigns resource requests on pod creation and never changes them later. Off: VPA just calculate the recommended resources - not applying them to the pod - and allow the human operator to inspect them via the VPA object and eventually manually apply them on the pod. Controlled by a Custom Resource Definition object called VerticalPodAutoscaler which allow to select the pod to autoscale by labels, set the operating mode and min/max allowed resources. VPA should be used when HPA is not an option or not appropriate (ie. StatefulSets). It’s strongly suggested to not mix VPA and HPA. They both try to solve the same exact problem in a different way, and they conflict if run together on the same pod - unless very special care is taken. Cluster Autoscaler (CA) Adjust the number of nodes in the cluster. It’s quite complex since it runs a “simulation” of the pods scheduler in order to determine which nodes pool should be scaled up/down and allows you to set some “extra buffer” to always have some spare resources on the cluster. An alternative (simpler) cluster autoscaler for AWS (kube-aws-autoscaler) has been built at Zalando and run it in production for quite a long time, while they now moved to the Kubernetes CA. What’s about the future? In Kubernetes 1.11 the HPA will be able to autoscale based on CRDs, so that it can be used to scale not just pods but custom resources too Prediction by Frederic Branczyk: cluster autoscaler will not to be a special case at some point in the future Horizontal Pod Autoscaling with custom metrics (Prometheus) Kubernetes 1.8 introduced Resource and Custom Metrics API, as an attempt to decouple the HPA from Heapstep/cAdvisor metrics and allow to autoscale based on custom metrics (ie. Prometheus) or external metrics (outside the cluster). Resource and Custom Metrics API is not an implementation, but an API specification implemented and maintaned by vendors. The contract of such APIs is that each metric should return a single value upon which the HPA will scale the workload. Resource Metrics API Collects resource metrics (currently CPU and memory). metrics-server is the canonical implementation, which collects metrics from the kubelet stats API every minute and holds the state - all values on Pods and Nodes - in memory. Custom Metrics API Allows requesting arbitrary metrics. It’s a specification and no canonical implementation is provided. Implementations are specific to the respective backing monitoring system. The first monitoring system supported was Prometheus by k8s-prometheus-adapter (an “adapter” is the implementation of the custom metrics API for a specific backing monitoring system). Supported Kubernetes objects are Pod, Service or Deployment. External Metrics API Introduced in Kubernetes 1.10 (alpha). Allow to autoscale based on metrics not related to any Kubernetes object and coming from outside the Kubernetes cluster (ie. number of jobs in a queue). The design is similar to Custom Metrics API and external metrics are ingested via an adapter as well. Notes on networking Networking is hard and Kubernetes networking is harder. However, the overall outcome of this KubeCon is that we should stop getting scared about Kubernetes networking and better understand how it works. It’s complicated, but there’s no magic behind it and - with some study and practice - it’s approachable. Debugging networking issues In case of a networking issue, the first thing to do is to collect information. Two suggested starting points (in case no overlay network is used): Dump the iptables rules with iptables-save, in order to get a snapshot of the current rules for later analysis (before they change and maybe the issue vanish). Use conntrack -L to list all connections tracked by the Connection Tracking System, which is the module that provides stateful packet inspection for iptables and has a primary role in packets routing. Slides: Blackholes & Wormholes: Understand and Troubleshoot the “Magic” of k8s Networking CNI The CNI (Container Network Interface) is a both a specification document and a set of “base” (common) plugins aiming to abstract the way applications (ie. Kubernetes) add and remove network interfaces on the host. CNI specification is not Kubernetes-specific, while being supported by Kubernetes. The goal is to provide an interface layer between the application and the host, and a set of interchangeable community/vendor driven plugins that do the real work to attach/detach/configure network interfaces. The specification is very simple and currently support ADD and REMOVE operations, while a GET is going to be introduced soon. The specification is still a draft, but close to be finalized in the 1.0 version (should be released by the end of 2018) after which the specification will be considered feature freeze, and the whole effort will be put in adding and/or improving plugins. AWS has developed two CNI plugins: CNI plugin for AWS ECS CNI plugin for Kubernetes Pods using ENIs Pods networking in Kubernetes using AWS Elastic Network Interfaces The amazon-vpc-cni-k8s plugin allows to setup a Kubernetes cluster where pods networking is based on the VPC native networking using multiple ENIs attached to the EC2 instance. Using this plugin, all pods and all nodes will be addressable in the same VPC network space. Since the number of ENIs that can be attached to an EC2 instance is limited, the plugin leverage on the ability to add multiple secondary IPs to each ENI in order to increase the number of Pods addressable on each node (the number depends on the instance type). The plugin reserves 1 IP per ENI for its own purposes, while the remaining ones can be used for Pods networking. For example, a c4.large instance can attach up to 3 interfaces, each can have up to 10 addresses and so the total number of pods schedulable on a c4.large instance using ENI networking is 3 * (10 - 1) = 27 that sounds quite reasonable unless you’ve a bunch of micro pods. The amazon-vpc-cni-k8s plugin is used in EKS as well. According to Anirudh Aithal (AWS Engineer) it can already be used for production workload despite the official status is still alpha (will be switched to stable once EKS enters GA). I’ve also talked to few people at the conference already using it in production (with no issues). Slides: Cloud native container networking in AWS using CNI plugins Introducing Amazon EKS (.pptx) Notes on AWS EKS I didn’t met anyone having access to EKS (I haven’t been much lucky), despite most of the people I’ve met run Kubernetes on AWS. People running multi cloud says GKE is a step above and works really well: there’s consensus on this. Key Points: EKS is a certified distribution of Kubernetes and will run Kubernetes upstream (no forked / limited version). EKS manage Kubernetes masters (HA) and etcd (HA, 3 AZs, encrypted, does backups), while workers must be provisioned and managed by customers. Allow to specify the major version (ie. 1.9) while EKS will keep all masters automatically updated to the latest minor (ie. to patch security issues). Allow to setup manual or automatic major version upgrades. Masters and etcd are not directly accessible. Masters are automatically vertically scaled (EC2 instance type) based on the number of pods running on the cluster (very cool). No customer-provided pods can be scheduled on masters. EKS pods scheduling is aware of the maximum number of pods schedulable on each worker node (due to ENI limitation). Networking: EKS setup a public load balancer in front of the API servers (ie. mycluster.eks.amazonaws.com). Support for internal load balancer is on the roadmap, but will likely be introduced after GA. Pods networking uses the VPC native networking. Authentication: EKS takes care of certificates management, supporting certificates rotation. There’s no AWS-maintained plugin to assign IAM roles to pods. The community driven kube2iam is the best option available so far, even if not much recommended by AWS (at some point they might work on a solution based on spiffe). kubectl authentication is based on IAM, using heptio-authenticator-aws. The AWS Identity is only used for the kubect authentication and - once authenticated - Kubernetes native RBAC is used for the authorization. It requires kubectl 1.10+ since support for pluggable authentication providers has been added in this version. IAM authentication works like this: kubectl passes the AWS Identity to K8S API server The K8S API Server verifies the AWS Identity with the AWS Auth API On success, it authorize the AWS Identity with RBAC - starting from this point, IAM not used anymore Source: Introducing Amazon EKS Preview vs GA: EKS preview is not production ready, do not run production workload. EKS preview requires a custom version of kubectl for the cluster authentication, while EKS GA will support the streamline kubectl. EKS preview requires a pre-configured AMI provided by AWS and created with a Packer script. AWS will opensource the Packer script once EKS will reach GA, so that customers can build their own workers AMI based on the AWS Packer script. EKS GA will “destroy” all clusters created in preview, so another good reason to not run production workload. EKS GA will be ready by the end of the year (hopefully before). Pricing will be announced once GA What’s about the future? Fargate for EKS might be introduced (similar to the currently available Fargate for ECS). Slides: Introducing Amazon EKS (.pptx) Notes on resource management A quick recap on container resources Each container in a pod can specify resource requests and limits (ie. CPU and memory). When a pod has no resource requests / limits, it will run with the Best Effort QoS class which is the most likely to get throttled and evicted. The scheduler keeps track of “allocatable” resources on each node that are tipically lower than its capacity, since some resources are reserved for the system, the kubelet and a buffer for the hard eviction threshold. You can get a summary of both "Node capacity" and "Node allocatable" resources via `kubectl describe node <name>`, ie. Capacity: cpu: 2 memory: 15657244Ki pods: 110 Allocatable: cpu: 2 memory: 15554844Ki pods: 110 When the scheduler algorithm places a pod an a node it doesn’t allow for overcommit of requested resources, so the total sum of requested resources must be <= the allocatable resources. Resource limits are currently not taken into account by the scheduler, despite some initial work has been done (alpha and behind feature gate). Each pod has a QoS class implicitely assigned based upon its containers CPU and memory resources and limits: Best Effort: no CPU and memory requests / limits Burstable: at least one container has CPU and memory requests / limits Guaranteed: all containers have CPU and memory requests / limits Each container resource is either compressable (CPU) or uncompressable (memory and storage): Compressable: subject to throttling Uncompressable: subject to kubelet eviction or kernel’s OOM_kill Kubelet eviction policy allows to specify hard and soft thresholds: when a soft threshold is reached a SIGTERM is sent to the container to allow a graceful termination, while in case of hard threshold the container is immediately killed. If the kubelet is not fast enough to react, the kernel’s OOM killer will kill the container. Known issues Some language runtimes (ie. Java, .NET, Go, …) have no or limited cgroups awareness Java: heap size (a first attempt to solve it has been introduced with -XX:+UnlockExperimentalVMOptions -XX:+UseCGroupMemoryLimitForHeap at some point in Java 8, while Java 10 made big improvements) Go: thread pool size .NET: GC Tuning Best practices on container resources If in doubt, start with Guaranteed QoS class Protect critical Pods (ie. DaemonSets, controller, master components, monitoring) Apply Burstable or Guaranteed QoS class with sufficient memory requests Reserve node resources with labels / selectors, or apply PriorityClasses (still alpha - hopefully beta in 1.11) if scheduler priority is enabled Test and/or enforce resources in your CI/CD pipeline Monitor container resources usage Fine tune the kubelet --eviction-hard and --eviction-soft (and related Values like Grace Periods) --fail-swap-on (default in recent Versions) --kube-reserved and --system-reserved '''
