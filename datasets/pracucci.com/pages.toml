["https://pracucci.com/atom-electron-signing-mac-app.html"]
title = "Electron - Signing a Mac Application"
description = "Sign your application bundle with codesign --deep --force --verbose --sign identity Application.app"
full_description = '''Electron - Signing a Mac Application 07 Jun 2015 by Marco Pracucci Comments If you’re building a Mac app with Electron (formerly known as Atom Shell), you will have to sign it before releasing. Code signature is actually a straightforward process, but it’s very hard to debug in case you run into any error, due to the lack of detailed error messages. In this post I will share my experience. TL;DR Get a Developer ID certificate from Apple and install it into your Mac’s Keychain Sign your application bundle codesign --deep --force --verbose --sign "<identity>" Application.app Verify the signature codesign --verify -vvvv Application.app and spctl -a -vvvv Application.app The code signature workflow At the time of writing it’s not allowed to publish an Electron application to the Mac App Store, so you have to sign it with a Developer ID certificate and ask your users to download and install it manually. This is actually a strong limitation and I hope things will change in the next future. UPDATE on Dec 2nd, 2015: since Electron 0.34.0, apps can be submitted to Mac App Store. You can get all information in the Mac App Store Submission Guide. 1. Get and install a Developer ID Certificate Once you got your Developer ID certificate, you should install it into your Mac’s Keychain: a double click on the certificate file should be enough. The image below shows your what you should see once the certification has been successfully installed into your Keychain. The text between parenthesis is the identity and will be used in the next step. 2. Code signature Now it’s time to sign the app. Create your application bundle (.app directory with the well-known Mac apps structure) and run the following command: $ codesign --deep --force --verbose --sign "<identity>" Application.app You should get an output similar to the following. Make sure the detected architecture is not generic, otherwise Squiller auto-update will give you an error while verifying the update package. Application.app: signed bundle with Mach-O thin (x86_64) [com.application] 3. Verify signature There are a couple of commands that you should run to verify the signature: codesign and spctl. The first checks if the signature is valid but doesn’t run any certificate assessment, while the latter checks if the certificate used for signing is approved. $ codesign --verify -vvvv Application.app Application.app: valid on disk Application.app: satisfies its Designated Requirement $ spctl -a -vvvv Application.app Application.app: accepted source=Developer ID origin=Developer ID Application: Spreaker Inc (xxx) You may also be interested in ... Electron? It works for us, and makes desktop fun and fast Electron - Slow performances in background Electron - Open DevTools in a popup Electron - Enable copy and paste Upcoming conferences I will join the following conferences. Reach me out on Twitter if you wanna meet: Incontro DevOps 2020 Virtual 22 October 2020 Comments var disqus_shortname = 'pracucci'; (function () { var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true; dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq); })(); (function () { var s = document.createElement('script'); s.async = true; s.type = 'text/javascript'; s.src = '//' + disqus_shortname + '.disqus.com/count.js'; (document.getElementsByTagName('HEAD')[0] || document.getElementsByTagName('BODY')[0]).appendChild(s); }());'''
