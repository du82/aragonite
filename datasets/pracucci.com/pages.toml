title = "New Chrome security policy: powerful features will be removed on insecure origins"
full_description = '''New Chrome security policy: powerful features will be removed on insecure origins 15 Sep 2015 by Marco Pracucci Comments Google recently announced a security policy change that will impact future versions of the Chrome browser. Chrome is already warning that support to powerful features on insecure origins (HTTP) is deprecated, and according to recent announcements the removal will take place soon. The initial features that will be removed on insecure origins will be: Geolocation (getCurrentPosition() and watchPosition()) Fullscreen Device motion / orientation Encrypted Media Extensions (EME) getUserMedia() If your web site or app is currently using any powerful feature above, please immediately consider switching all your traffic to HTTPS only. Links Proposal: Deprecating Powerful Features on Insecure Origins Issue: Deprecation and removal of powerful features on insecure origins The impact of Google’s new Chrome security policy on WebRTC You may also be interested in ... Chrome 54 introduces BroadcastChannel API and Spreaker is already using it Chrome changes "HTTPS with mixed content" icon and add Security tab to DevTools Who are we developing for? Copy the text selection to Clipboard, using Javascript Chrome Android 44+ introduces a new "related apps" banner Upcoming conferences I will join the following conferences. Reach me out on Twitter if you wanna meet: Incontro DevOps 2020 Virtual 22 October 2020 Comments var disqus_shortname = 'pracucci'; (function () { var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true; dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq); })(); (function () { var s = document.createElement('script'); s.async = true; s.type = 'text/javascript'; s.src = '//' + disqus_shortname + '.disqus.com/count.js'; (document.getElementsByTagName('HEAD')[0] || document.getElementsByTagName('BODY')[0]).appendChild(s); }());'''
