["https://pracucci.com/samsung-smarttv-error-1145401-terms-and-conditions.html"]
title = "Samsung SmartTV error 1145401: Terms and Conditions"
full_description = "Samsung SmartTV error 1145401: Terms and Conditions 23 Feb 2016 by Marco Pracucci Comments If you landed here, you probably just purchased a Samsung SmartTV and after few minutes realized that you can’t run the SmartTV because unable to download the terms and conditions (error: 1145401). I struggled on this for few hours as well, tried many tricks found on internet (and none was working), and finally realized that it requires a firmware upgrade to fix it. The firmware upgrade automatically downloaded by the TV is actually few versions behind the latest version available on the website, thus you need to download the latest firmware upgrade version from the Samsung website to fix it. You can find some “quick” instructions below. Upgrading the firmware from version 1400 to 1443 (latest version available at the time of writing) fixed the issue to me. Look for the latest firmware upgrade Open http://www.samsung.com Look for your TV model in the top right search bar Open your TV model product page and scroll down to “Support” You should find a download called “Upgrade File (USB type)” and the version number Check the latest firmware upgrade version You should now check if the latest firmware upgrade file version is newer than your TV software version. To get the software version running on your TV you should turn on the TV > Menu > Support > Software upgrade > and check the number close to “current version”. In my case, for example, the TV software version was 1400, the TV wasn’t displaying any software upgrade available, but on the website the latest software upgrade version was 1443 (and this version fixed the issue). Download and install the software upgrade If the software upgrade on the Samsung website is newer than the one running on your TV, follow these steps to upgrade it: Download the software upgrade file from the Samsung website Copy the .exe file to a USB memory key Run the .exe file from the USB memory key (unfortunately this step requires Windows) Ensure that the USB memory now contains a directory called T-HKMDEUC, containing another directory called image Safe remove the USB memory from your computer Attach the USB memory to your TV Menu > Software Upgrade > Search for upgrades > Select to search in the attached USB memory Follow the instructions and your TV firmware will be upgraded Did it solve your issue? If it solved your issue, please leave a comment below. Upcoming conferences I will join the following conferences. Reach me out on Twitter if you wanna meet: Incontro DevOps 2020 Virtual 22 October 2020 Comments var disqus_shortname = 'pracucci'; (function () { var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true; dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq); })(); (function () { var s = document.createElement('script'); s.async = true; s.type = 'text/javascript'; s.src = '//' + disqus_shortname + '.disqus.com/count.js'; (document.getElementsByTagName('HEAD')[0] || document.getElementsByTagName('BODY')[0]).appendChild(s); }());"
