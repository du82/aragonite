full_description = '''Electron - Open DevTools in a popup 02 Jul 2015 by Marco Pracucci Comments When you open a new window with window.open() in Electron, DevTools are closed by default and there’s no key binding to open it. However, you can run the following code in the main window to get the reference to the popup’s BrowserWindow and openDevTools(). var remote = require("remote"); var BrowserWindow = remote.require("browser-window"); var windows = BrowserWindow.getAllWindows(); // Look for the popup window and then... windows[1].openDevTools(); <img src=”/assets/2015-07-02-electron-popup-devtools-ee6f438ff9b89e8a215d6247ee82b59cbe9237c7c49230be3daef07f47cabb0a.gif” width=681 height=583 width=”682” height=”563” alt=”2015-07-02-electron-popup-devtools.gif”> You may also be interested in ... Electron? It works for us, and makes desktop fun and fast Electron - Slow performances in background Electron - Enable copy and paste Electron - Signing a Mac Application Upcoming conferences I will join the following conferences. Reach me out on Twitter if you wanna meet: Incontro DevOps 2020 Virtual 22 October 2020 Comments var disqus_shortname = 'pracucci'; (function () { var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true; dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq); })(); (function () { var s = document.createElement('script'); s.async = true; s.type = 'text/javascript'; s.src = '//' + disqus_shortname + '.disqus.com/count.js'; (document.getElementsByTagName('HEAD')[0] || document.getElementsByTagName('BODY')[0]).appendChild(s); }());'''
