["https://pracucci.com/best-gzip-compression-with-grunt-contrib-compress.html"]
title = "Best gzip compression with grunt-contrib-compress"
full_description = '''Best gzip compression with grunt-contrib-compress 10 Feb 2017 by Marco Pracucci Comments Today I just noticed that grunt-contrib-compress gzip’s default compression level has not been set to BEST_COMPRESSION, causing some assets not getting compressed to their optimal size. Changing this setting we’ve gained a 20% increased compression ratio on SVG icons. I highly recommend you to import zlib in your Gruntfile.js: var zlib = require("zlib"); and then add the level option to your grunt-contrib-compress task: options: { mode: 'gzip', level: zlib.Z_BEST_COMPRESSION } Please note that the zlib constant has changed with Node 7.x. It’s zlib.Z_BEST_COMPRESSION on Node 6.x, while zlib.constants.Z_BEST_COMPRESSION on Node 7.x. Upcoming conferences I will join the following conferences. Reach me out on Twitter if you wanna meet: Incontro DevOps 2020 Virtual 22 October 2020 Comments var disqus_shortname = 'pracucci'; (function () { var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true; dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq); })(); (function () { var s = document.createElement('script'); s.async = true; s.type = 'text/javascript'; s.src = '//' + disqus_shortname + '.disqus.com/count.js'; (document.getElementsByTagName('HEAD')[0] || document.getElementsByTagName('BODY')[0]).appendChild(s); }());'''
