title = 'Chrome Android 44+ introduces a new "related apps" banner'
description = "Native App install banners in Chrome for Android. Quickly learn how it works."
full_description = '''Chrome Android 44+ introduces a new "related apps" banner 18 Jun 2015 by Marco Pracucci Comments Native App install banners landed in Chrome 44 Beta for Android and will be soon available in the stable version. Native App banners are a new powerful feature that let users to install and switch to your native app, without leaving the browser. Criteria for activation The criteria for Native App banner activation are: You have a web app manifest file Your site is served over HTTPS The user has visited your site twice over two separate days during the course of two weeks The app has not been installed yet To test the banner, without waiting the next day (due to the criteria #3), you can enable chrome://flags/#bypass-app-banner-engagement-checks . Manifest The manifest should defines at least a short_name, a 144x144 png icon, prefer_related_applications and related_applications. Check out the manifest we use at Spreaker or the following example: { "display": "browser", "name": "Spreaker", "short_name": "Spreaker", "icons": [ ... ], "prefer_related_applications": true, "related_applications": [{ "platform": "play", "id": "com.spreaker.android" }] } The manifest file must be linked in your web pages using the <link> tag. Ie: <link rel="manifest" href="/manifest.webmanifest" /> You may also be interested in ... Chrome 54 introduces BroadcastChannel API and Spreaker is already using it Chrome changes "HTTPS with mixed content" icon and add Security tab to DevTools Who are we developing for? New Chrome security policy: powerful features will be removed on insecure origins Copy the text selection to Clipboard, using Javascript Upcoming conferences I will join the following conferences. Reach me out on Twitter if you wanna meet: Incontro DevOps 2020 Virtual 22 October 2020 Comments var disqus_shortname = 'pracucci'; (function () { var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true; dsq.src = '//' + disqus_shortname + 