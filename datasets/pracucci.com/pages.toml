["https://pracucci.com/gmail-ignores-media-queries-if-css-size-greater-than-16kb.html"]
title = "Gmail ignores media queries if the CSS size is greater than 16KB"
full_description = "Gmail ignores media queries if the CSS size is greater than 16KB 20 Jan 2017 by Marco Pracucci Comments Gmail is rolling out support for media queries in its apps, including the iOS and Android app (you can find updates here). However, today I was investigating on why Gmail was ignoring the media queries on our newsletter, and I’ve apparently found a limitation. When the size of <style></style> exceed 16KB (including whitespaces, comments and newlines), it looks that media queries are ignored on Gmail. If you split the CSS in multiple <style> blocks, it counts the total size of the CSS (so it’s not a workaround). On the contrary, minifying the CSS to keep it smaller can be a solution, if the minified version of the CSS is less than 16KB. This is just my preliminary conclusion, without spending more time on that. Please advise if you find any other limitation, or your tests don’t match my finding. Thanks! Upcoming conferences I will join the following conferences. Reach me out on Twitter if you wanna meet: Incontro DevOps 2020 Virtual 22 October 2020 Comments var disqus_shortname = 'pracucci'; (function () { var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true; dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq); })(); (function () { var s = document.createElement('script'); s.async = true; s.type = 'text/javascript'; s.src = '//' + disqus_shortname + '.disqus.com/count.js'; (document.getElementsByTagName('HEAD')[0] || document.getElementsByTagName('BODY')[0]).appendChild(s); }());"
