["https://pracucci.com/rounding-values-in-prometheus-alerts-annotations.html"]
title = "Rounding values in Prometheus alerts annotations"
full_description = '''Rounding values in Prometheus alerts annotations 09 Oct 2017 by Marco Pracucci Comments If you’re a Prometheus experienced user you already know you can pipe GO default templating functions in ANNOTATIONS. We’re used to write human readable alerting messages as annotations, that frequently contain the current $value of the monitored metric. Today I started rounding $value using printf to avoid displaying floating point numbers with a long tail of decimals. For example, the expression $value | printf "%.2f" will round it to two decimals. Feel free to adjust it with any number of desired decimals (ie. "%.1f" for a single decimal). The following alert configuration snippet shows a nearly real use case. ALERT WORKER_AUDIO_ENCODING_TIME_AVG_PERC IF a_metric_to_alert_on > 12345 LABELS { severity="error", team="frontend" } ANNOTATIONS { firing = 'The current value of metric is {{ $value | printf "%.2f" }}.' } You may also be interested in ... Leveraging Open Source to Improve Cortex and Thanos Grafana Loki: like Prometheus, but for Logs KubeCon Europe 2018 - Memo and Takeaways Migrating to Prometheus: what we learned running it in production (the video) Migrating to Prometheus: what we learned running it in production KubeCon 2017 - Prometheus Takeaways Prometheus: understanding the delays on alerting Upcoming conferences I will join the following conferences. Reach me out on Twitter if you wanna meet: Incontro DevOps 2020 Virtual 22 October 2020 Comments var disqus_shortname = 'pracucci'; (function () { var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true; dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq); })(); (function () { var s = document.createElement('script'); s.async = true; s.type = 'text/javascript'; s.src = '//' + disqus_shortname + '.disqus.com/count.js'; (document.getElementsByTagName('H