title = "Leveraging Open Source to Improve Cortex and Thanos"
full_description = "Leveraging Open Source to Improve Cortex and Thanos 15 Jul 2020 by Marco Pracucci Comments Cortex and Thanos are two brilliant solutions to scale out Prometheus, and many companies are now running them in production at scale. These two projects initially started with different technical approaches and philosophies but, over time, the two projects started to learn from and even influence each other and these differences have been reduced. Today Bartek Plotka and I gave a talk at PromCon Online about a stronger collaboration we’re building between the Cortex and Thanos community, accelerated by the new blocks storage engine we’re building in Cortex which is based on some Thanos core components. Curious to learn more? Check out the recording and slides! You may also be interested in ... Grafana Loki: like Prometheus, but for Logs KubeCon Europe 2018 - Memo and Takeaways Migrating to Prometheus: what we learned running it in production (the video) Migrating to Prometheus: what we learned running it in production Rounding values in Prometheus alerts annotations KubeCon 2017 - Prometheus Takeaways Prometheus: understanding the delays on alerting Upcoming conferences I will join the following conferences. Reach me out on Twitter if you wanna meet: Incontro DevOps 2020 Virtual 22 October 2020 Comments var disqus_shortname = 'pracucci'; (function () { var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true; dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq); })(); (function () { var s = document.createElement('script'); s.async = true; s.type = 'text/javascript'; s.src = '//' + disqus_shortname + '.disqus.com/count.js'; (document.getElementsByTagName('HEAD')[0] || document.getElementsByTagName('BODY')[0]).appendChild(s); }());"
