title = "Copy the text selection to Clipboard, using Javascript"
full_description = '''Copy the text selection to Clipboard, using Javascript 15 Sep 2015 by Marco Pracucci Comments Few days ago, Firefox announced the support to document.execCommand("copy") in the upcoming version 41.0 (currently in Beta). This change makes a step forward towards a Flash-free world (fallbacks are Flash based). Copying text selection to Clipboard is now available on all modern browsers, except Safari. How it works The execCommand("copy") API is only available during a user-triggered callback (ie. a click). When triggered, it copies the current selection to the clipboard. Using is is very straightforward and just requires a couple of lines of code. <textarea id="input">Some text to copy.</textarea> <button id="copy-button">Copy</button> <script> var input = document.getElementById("input"); var button = document.getElementById("copy-button"); button.addEventListener("click", function (event) { event.preventDefault(); input.select(); document.execCommand("copy"); }); </script> Browsers support To keep it simple, most modern browers are supported, except Safari. It’s actually an huge lack, we hope will get fixed soon. Chrome > 43.0.2356 Firefox >= 41.0 Opera >= 30 (release notes) IE >= 9 (allows it to be called at any time, but prompts a confirmation dialog) Safari Not supported For more details, please check out caniuse.com. You may also be interested in ... Chrome 54 introduces BroadcastChannel API and Spreaker is already using it Chrome changes "HTTPS with mixed content" icon and add Security tab to DevTools Who are we developing for? New Chrome security policy: powerful features will be removed on insecure origins Chrome Android 44+ introduces a new "related apps" banner Upcoming conferences I will join the following conferences. Reach me out on Twitter if you wanna meet: Incontro DevOps 2020 Virtual 22 October 2020 Comments var disqus_shortname = 'pracucci'; (function () { var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true; dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq); })(); (function () { var s = document.createElement('script'); s.async = true; s.type = 'text/javascript'; s.src = '//' + disqus_shortname + '.disqus.com/count.js'; (document.getElementsByTagName('HEAD')[0] || document.getElementsByTagName('BODY')[0]).appendChild(s); }());'''
