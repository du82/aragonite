title = "Facebook Open Graph - Query image by username no longer available"
description = "Get a Facebook user's image by username is no longer available. Switch to query by id to fix it."
full_description = '''Facebook Open Graph - Query image by username no longer available 13 Jun 2015 by Marco Pracucci Comments Until yesterday you were able to query Facebook Open Graph to get an user’s image by username. Starting today it’s no longer available, but you can still query it by ID. Doesn’t work anymore https://graph.facebook.com/marco.pracucci/picture { "error": { "message": "(#803) Cannot query users by their username (marco.pracucci)", "type": "OAuthException", "code": 803 } } Does work https://graph.facebook.com/1376887081/picture Tip: how to get the biggest image available Bonus: if you’re wondering how to fetch to biggest image available, you can simply add width and height parameters. Facebook will return the biggest image available, honoring input max width and height. https://graph.facebook.com/1376887081/picture?width=2000&height=2000 You may also be interested in ... Upcoming conferences I will join the following conferences. Reach me out on Twitter if you wanna meet: Incontro DevOps 2020 Virtual 22 October 2020 Comments var disqus_shortname = 'pracucci'; (function () { var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true; dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq); })(); (function () { var s = document.createElement('script'); s.async = true; s.type = 'text/javascript'; s.src = '//' + disqus_shortname + '.disqus.com/count.js'; (document.getElementsByTagName('HEAD')[0] || document.getElementsByTagName('BODY')[0]).appendChild(s); }());'''
