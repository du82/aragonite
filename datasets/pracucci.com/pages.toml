orecasting as a service Security AWS Control Tower setup a landing zone in a multi-account AWS environment AWS Security Hub centrally view and manage security alerts and automate compliance checks Blockchain Amazon Quantum Ledger Database (preview) managed ledger database providing a transparent, immutable, and cryptographically verifiable transaction log - internally used by AWS since few years Amazon Managed Blockchain (preview) Hybrid AWS Outposts (2019) run AWS infrastructure on premise You may also be interested in ... Lessons learned running AWS Cloud Map service discovery for EC2 instances Growing an AWS EBS RAID 0 array, increasing volumes size Install Spark JobServer on AWS EMR AWS re:invent 2017 annoucements Upcoming conferences I will join the following conferences. Reach me out on Twitter if you wanna meet: Incontro DevOps 2020 Virtual 22 October 2020 Comments var disqus_shortname = 'pracucci'; (function () { var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true; dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq); })(); (function () { var s = document.createElement('script'); s.async = true; s.type = 'text/javascript'; s.src = '//' + disqus_shortname + '.disqus.com/count.js'; (document.getElementsByTagName('HEAD')[0] || document.getElementsByTagName('BODY')[0]).appendChild(s); }());"
