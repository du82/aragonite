["https://praegnanz.de/weblog/Dell-vs-Apple"]
title = "Dell vs. Apple | praegnanz.de"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "Dell vs. Apple 1. Juli 2004 So langsam muss man sich mal überlegen, ob Spiegel Online nicht in den letzten Wochen und Monaten ziemlich an Kompetenz eingebüßt hat! Trotzdem beherrscht Apple den Markt bisher unangefochten. Mehr als 50 Prozent aller verkauften MP-3-Player sind iPods. Doch der Verkauf der Musikboxen ist nur die halbe Miete. Wer hier den Markt beherrscht, der hält damit auch den Schlüssel zu einem sehr viel lukrativeren Geschäftsfeld in der Hand – dem Verkauf von Musikdownloads. So ein Quatsch: Dass der Verkauf von Musikdownloads nicht profitabel ist, weiß man seit Monaten. Und daran wird sich auch so schnell nichts ändern. Klar, Dell kann einen Fuß in die Tür setzen, aber eine Werbeaktion wie die hier beschriebene ist nicht etwa lukrativ, sondern hochgradig subventioniert."
