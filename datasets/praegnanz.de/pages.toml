["https://praegnanz.de/weblog/2002"]
title = "praegnanz.de/weblog/2002"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "Tragisches Ende ... 12. Dezember 2002 ... it wasn’t me! _(Not me alone, to be exactly.)_ Zum Artikel Typografie zum Naschen 2. November 2002 Jetzt bin ich doch noch zum Plätzchenbäcker geworden. Doch ein echter Typografie-Fan lässt sich nicht so einfach unterkriegen und fröhnt seinem Hobby auch in ungewöhnlichen Situationen. Buchstaben zum Beißen, das ist Weihnachten 2002 bei base-box.de! Zum Artikel Edles Essen 21. Oktober 2002 Im Vergleich zum Dezember letzten Jahres hat sich meine kulinarische Finesse ganz schön verbessert. Zusammen mit Isa bereite ich jetzt Aufläufe, deftige Pfannengerichte und Tortilla-Wraps im Handumdrehen. Schmecken tut das Ganze übrigens auch! Zum Artikel Natural in Kiel 6. Oktober 2002 Wetten, dass..? aus Kiel: Man muss zugeben, auch uns war das Gekreische der Teenies zuwider. Aber wie können die Jungs von Natural nur so herzlos sein, und dieses großartige Plakat halb zusammengekrümpfelt in ihrer Garderobe liegen lassen? Ich habe mich erbarmt, und halte es in Ehren! Zum Artikel Der Liebe Gott, das Internet und Ich 3. Oktober 2002 Screenshot Kapitel 6:Jesus – seit 2000 Jahren fett und krass am Start! Screenshot Kapitel 7:Meinung BILDen & Weisheit schöpfen. Screenshot Kapitel 5:Heiligen-eCards versenden. Im dritten Semester befasste sich der Kurs »Design« unter der Leitung von Prof. Charlotte Schröner mit dem Leben an sich. Mittels eines komplizierten Brainstorming-Verfahrens wurden sämtli... Zum Artikel"
