["https://praegnanz.de/weblog/11-bietet-dsl-anschluesse-an"]
title = "1&#38;1 bietet DSL-Anschlüsse an | praegnanz.de"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "1&#38;1 bietet DSL-Anschlüsse an 2. April 2005 1&1, der DSL-Provider meines Vertrauens, hat neue Tarife im Angebot, die mich haben sabbern lassen. Denn wer auch den DSL-Anschluss über 1&1 abwickelt (was wohl niemanden in ernsthafte Gewissenskonflikte bringen wird, zumal der Preis für 1.024kbps der gleiche ist wie bei der T-Com), zahlt für eine echte Flatrate nur noch schlappe € 9,99. In einigen Großstädten sogar nur € 6,99. Das ist großartig. Doch was bedeutet das für mich als eigentlich zufriedenen 5GB-Volumenkunden? Kann ich auch mitmachen? Immerhin läuft mein Vertrag prinzipiell noch bis Ende August! Wichtiger Hinweis für 1&1-Kunden: Aus technischen Gründen können wir für Ihren Tarif zum jetzigen Zeitpunkt keinen Wechsel in die Tarife 1&1 City-FLAT oder 1&1 Deutschland-FLAT anbieten. Wir werden Sie zeitnah informieren, sobald die Möglichkeit für einen Tarifwechsel in die oben genannten Tarife gegeben ist. Naja, immerhin. Ey, aber ich frage mich immer wieder, wozu ich noch diese lästigen Telefongrundgebühren zahlen muss! Ich telefoniere im Monat für ca. 70 Cent über die Telekom-Leitung. Der Rest geht über 1&1 IP-Telefonie oder über Handy bzw. Homezone. Kann hoffentlich nicht mehr lange dauern, bis DSL-Anschlüsse unabhängig von Telefonanschlüssen angeboten werden."
