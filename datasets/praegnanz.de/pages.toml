["https://praegnanz.de/weblog/1-mainzer-bloglesung-so-wars"]
title = "1. Mainzer Bloglesung – So war’s! | praegnanz.de"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "1. Mainzer Bloglesung – So war’s! 29. April 2006 Was macht den Reiz einer Bloglesung aus? Wahrscheinlich gibt es darauf genauso viele Antworten wie Anwesende gestern abend. Also auch wieder nicht so viele ;-) Es war leider nur eine Handvoll Leute da, die nicht in irgendeiner Form direkt in die Lesung involviert waren. Klingt nach einer eher einsamen Veranstaltung, so war es aber eigentlich gar nicht. Den Großteil der Zeit nahmen natürlich die Lesungen in Anspruch: Zwei Blöcke, in denen jeder Autor jeweils einmal zu Wort kam und zwischen einem und acht Texte zum Besten gab. Durch diese Mischung wurde es zu einem abwechslungsreichen Abend – von der Reflexion über die erste große Liebe über Anekdoten beim Essen gehen, Schwulenpornokinos und Leichen, die wie Schlümpfe aussehen, war ein nettes Spektrum an Schreib- und Vortragestilen vertreten. Ich selber habe noch ein wenig über die WM-Logos der 11 Designer gelästert und meinen Text über Neue Musik vorgetragen – und fiel damit ein wenig aus der Rolle als einziges Fachblog ohne Anekdotencharakter. Natürlich kann solch eine Bloglesung eigentlich immer nur den “Tagebuch“Teil der Blogosphäre abdecken (der ja auch den größten Anteil hat). Dennoch sehe ich ein wenig die Gefahr, dass von den Außenstehenden genau dies zum Anlass genommen wird, Blogs als etwas rein Privates und Niedliches abzutun. Aber was will man in loungiger Atmosphäre schon über die großen Blogthemen wie Jamba oder Journalismus reden? Eben! Und somit verbuche ich den gestrigen Abend als beachtlichen Erfolg und empfehle allen Daheimgebliebenen, es beim nächsten Mal nicht zu verpassen. Die Organisation lief reibungslos, hier gebührt dem Doppelklicker-Team die gesamte Ehre. Im Doppelklicker -wird es in den nächsten Tagen auch Berichterstattung geben gibt es nun eine ausführliche Berichterstattung in Form von Artikel und Podcasting. Zwei Dinge, die ich am Schluss noch festhalten möchte: Eine Bloglesung braucht keine DJ-Musik im Anschluss, ein paar leise chillige Grooves von CD hätten es auch getan. Wenn ich den Kerl erwische, der uns ein Himbeer-Eis am Stiel in unseren Briefkasten gelegt hat, dann …"
year_published = 2006
