full_description = "2015er Vortrag über Responsive Layout 11. Dezember 2015 Den folgenden Vortrag habe ich in ähnlicher Form bereits zu einer Handvoll Gelegenheiten gehalten – mit wechselnder Zielgruppe und Länge. Da ich jedes einzelne Mal die Aufnahme versemmelt habe, hier ein nachproduziertes Stück Video mit astreiner Tonqualität: Zum Artikel Endlich da: Die Brille 10. Dezember 2015 Was lange währt, wird endlich released: Unsere freundlichen Mitbewohner in der P8 Bürogemeinschaft bringen heute ihr erstes gecrowdfundetes Spiel namens Die Brille heraus, wobei „Interaktives Wimmelbuch“ die Sache wohl besser trifft. Gemeinsam mit dem Würzburger Illustrator Martin Armbruster (der einen sehr eigenwilligen und unmainstreamigen Stil besitzt) haben d... Zum Artikel Tablet First – der kesse Kniff für Leute von heute! 30. November 2015 Wie wohl die meisten Webdesigner haben wir irgendwann 2013 gemerkt, dass der Spaß, den man beim nachträglichen Responsivieren von komplexen Website-Layouts hat, begrenzt ist. Das sogenannte „Responsive Retrofitting“ wird natürlich bis heute häufig praktiziert, wenn das Kundenbudget nicht für einen echten Relaunch ausreicht, oder die Zeit schlichtw... Zum Artikel Die Komfortzone der Skeptiker 25. November 2015 Es gibt zwei Arten von Nachrichten, die sich gut verkaufen: Schlechte Nachrichten und solche, die das schlechte Gewissen des Lesers beruhigen! Zum Artikel Die Blasenwelten von Print und Web 5. November 2015 Filterblasen nennt man abgeschlossene soziale Räume, in denen Gleichgesinnte über ihnen wohlbekannte Themen reden und dabei eigene Werte und Sichtweisen immer weiter kultivieren und sich gegenseitig bestätigen. Der Blick über den Tellerrand wird dabei oftmals aus Bequemlichkeit vermieden. Heute war ich in meiner alten Hochschule in Main... Zum Artikel"
