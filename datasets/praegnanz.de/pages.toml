description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "1 Jahr prägnantes Geblogge 3. September 2004 Mit folgenden Worten eröffnete ich am 3. September, ziemlich spät am Abend, mittels Blogger.com mein erstes Weblog: Freunde, ich werde es mir in Zukunft erleichtern, meine Website zu pflegen und habe diesen Blog aus der Taufe gehoben, damit ich kleine News und Anekdoten sofort un dohne Aufwand von überall her posten kann. Cool, nicht? Wenn Ihr auch Bock habt, hier in diesem Blog »Gast-Poster« zu werden, dann meldet Euch, ich bin da sehr offen! Irgendwann im April 2004 bin ich auf Textpattern umgestiegen und die Dichte der Einträge hat sich stark erhöht. Das erste heiß diskutierte Thema war mein kontroverser Beitrag zur Diskussion um das neue Logo des Bundeslandes Hessen: Hessen, Wappen und Moneten Wer in meiner kreativen Blogpause dennoch was zu Lesen braucht, soll doch einfach im Archiv stöbern!"
