["https://praegnanz.de/weblog/apple-und-sein-skeuomorphismus"]
title = "Apple und sein Skeuomorphismus | praegnanz.de"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "Apple und sein Skeuomorphismus 8. November 2011 Ja, es hört sich ein wenig so an, als sei Apple krank. Also, die Überschrift. Und nach Meinung vieler UI-Experten hat Apple wohl in der Tat zumindest psychisch ein Gesundheitsproblem – wie sollte man sonst die Sache mit der Lederumschlag- und Notizpapieroptik erklären, die derzeit in immer mehr Apple-Software den UI-Look definiert? Ich will anhand eine Assoziationskette erläutern, was ich dazu denke. Gehen wir ein paar Schritte zurück. Gestern sah ich eine Folge von »How I met your mother« aus dem Jahre 2005 und habe mich ein wenig geärgert; Ted wird in dieser Epsiode Kunde einer Paarvermittlung, die »Love Solution« heißt. Und weil diese computerbasiert ist, musste wohl auch ein »computermäßiges« Logo her. Dem Ausstattungsdesigner (= Volltrottel) ist leider nichts besseres eingefallen als die uralte Computer-Schrift auszuwählen, die tatsächlich so heißt und schon in den frühen Neunzigern als abgegriffen und klischeehaft galt. Sie wurde 1970 veröffentlicht. Und damit beginnt das Dilemma: Bis in die späten 80er Jahre hatte man meist eine klare Vorstellung davon, wie die Zukunft aussehen muss: irgendwie technisch, digital und computerig. Das wirkte sich dann auch auf die verwendeten Schriften aus: Alles muss clean, konstruiert, spacig und kühl sein. Eine warme, kuschelige, menschliche und verspielte Zukunft war undenkbar, denn digitale Technik ist nunmal erbarmungslos, was ihre Kühle und Berechenbarkeit angeht – schließlich hat man es mit Einsen und Nullen zu tun, sowie mit viel Mathematik und Logik. Nun sind wir aber inzwischen an einem Punkt angekommen, wo unsere Wirklichkeit die Science-Fiction von damals eingeholt und in vielen Fällen sogar längst überholt hat. Man vergleiche mal die Steuerterminals der TNG-Enterprise mit unseren heutigen Touchscreens, und sehe sich an, was ein Tricorder ist – nichts weiter als ein Smartphone mit ein paar zusätzlichen Sensoren. Und der Bordcomputer besitzt ja wohl nichts Geringeres als ein Siri-Interface. Wenn die Zukunft von damals nun im Heute angekommen ist, brauchen wir eigentlich auch eine neue visuelle Vorstellung von der jetzt aktuellen Zukunft, oder nicht? Es gibt nun zwei Möglichkeiten, diese weiterführende Zukunft zu skizzieren. Entweder man führt die gleiche Richtung fort wie bisher: Man extrapoliert die Entwicklung des UI-Looks der vergangenen Jahre und mischt sie mit den etwas aktuelleren Science-Fiction-Konzepten der vergangenen 10 Jahre (Stichwort Minority Report). Heraus kommt prinzipiell die [Metro-Oberfläche)]. Und – ein klein wenig weiter gedacht – das Microsoft-Zukunftsfilmchen von neulich. Im Grunde ist das nur logisch. Alles wird noch cleaner, noch kühler, noch technischer und noch virtueller. Hardware verschwindet zusehends und Software wird minimalistischer. Bis nichts mehr übrig ist. Die Frage ist: Ist ein solch technischer Look notwendig? Muss das wirklich so aussehen? Nein, natürlich nicht. Früher, als die Computer noch langsam und der Speicher knapp war, konnte man nicht anders: Man musste schlicht und reduziert sein, weil jedwede Opulenz die Leistung des Systems beeinträchtigt hätte. Früher. Doch irgendwie scheinen viele Designer – selbst wenn es um tollkühne Zukunftsvisionen geht – auch heute immer noch der Meinung zu sein, alles muss speicherschonend, mit möglichst wenig Vektorpfaden und möglichst wenig Ornament gestaltet sein, damit es auf jeden Fall futuristisch genug aussieht. Apple hingegen ist dabei, dieses Stadium zu verlassen – wenn auch mit viel hin und her. (Seit dem bonbonbunten Aqua-Look von 2001 ist das »Profi-System« MacOS X wieder deutlich cleaner geworden, seit Lion und iOS 5 wird aber wieder auf die Komplexitätstube gedrückt.) Man denkt dort inzwischen anders über die Anmutung von UIs nach, insbesondere bei Touchgeräten. Ausgangssituation sind mehrere Annahmen: Hardware und die Software sind unterschiedliche Dinge und haben unterschiedliche Funktionen. Es gibt keine ernstzunehmenden technischen Grenzen für die Gestaltung von UI. Man kann mit Software prinzipiell alles machen, was möglich ist. Die Geräte der Post-PC-Ära sind weitaus persönlicher und intimer als es PCs jemals waren. Aus Punkt 1 wurde folgendes Konzept: Das iPad ist ein leerer Rahmen, der im ausgeschalteten Zustand keinerlei erkennbare Funktion besitzt. Es ist eine Blackbox, eine Magicbox, die alles oder nichts kann. Man weiß es nicht, und deshalb ist es so wichtig, dass das iPad so aussieht wie vom Himmel gefallen: keine Schrauben, kein wechselbarer Akku, keine Aufkleber, möglichst wenig Beschriftung. Ein mysteriöses Aliendevice. Darin deckt sich die Zukunftsvision von Microsoft und Apple – eine Extrapolation des üblichen Science-Fiction-Minimalismus. In Punkt 2 und 3 jedoch weichen die Konzepte ab. Apple benutzt die Neutralität der Hardware, um die Software umso persönlicher und vertrauter zu gestalten, bekannte Konzepte aus der analogen Welt aufzugreifen, viel Materialien und Texturen zu verwenden. Dadurch wird das kühle, minimalistische Aliendevice zu einem magischen Gerät, was sich mit einem Fingerstreich in ein Filofax, eine Gitarre oder eine Wasserwaage verwandelt. Für den Nutzer läuft dann keine App zum Musikerstellen, sondern das iPad verwandelt sich in eine Gitarre. Diese Magie funktioniert nur dann, wenn die Hardware ausreichend mysteriös und clean daherkommt, die Software dafür aber umso opulenter und detailverliebter ausgestaltet ist. So kann das Gerät zu einem wahrhaft persönlichen Gerät werden, das man gerne und oft herausholt, um sich damit zu beschäftigen. Es fügt sich einfach besser ins echte Leben eines Nicht-Nerds ein, wenn alles auch ein wenig nach echtem Leben aussieht. Es geht aber eben auch nicht nur darum, reale Gegenstände nachzubilden. Sondern auch darum, nichtexistente Gegenstände digital so zu kreieren, dass der Nutzer sie als freundlich und natürlich erlebt. Wie die vielbesprochene »Finde meine Freunde«-App, welche in Leder gebunden zu sein scheint, obwohl es natürlich im echten Leben keinen Freundefinder aus Leder gibt. Apple geht damit über die Star-Trek-UI-Vision von 1988 hinaus. Zugegeben, der UI-Look, der bei TNG gezeigt wurde, war zu damaliger Zeit absolut revolutionär, wie sowieso fast alles an dieser Serie. Aber während Microsofts Metro sich anschickt, eine 1:1-Kopie von Wesley Crushers Pult zu bauen, geht Apple auf die Menschen zu und lässt seine Anwendungen entsprechend menschlich aussehen. Manchmal leider auf Kosten der Effizienz, was die Nutzerführung angeht. Aber mit dem größeren Ziel vor Augen, auch noch den restlichen Leuten die Angst vor dem Computer zu nehmen. Das ist Apple wichtiger als ein paar jammernde Nerds, die lieber nackte Listen sehen, ohne Omas Küchenbrettchen im Hintergrund. update 14. Dezember: Ich rede mit Markus Schlegel im poly:logo Podcast über das Thema"
