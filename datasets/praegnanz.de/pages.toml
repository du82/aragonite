["https://praegnanz.de/weblog/10-gruende-zu-mcdonalds-zu-gehen"]
title = "10 Gründe, zu McDonald&rsquo;s zu gehen | praegnanz.de"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "10 Gründe, zu McDonald&rsquo;s zu gehen 18. Januar 2005 Enge Freunde wissen, dass ich früher neben der Schule bei McDonald’s gejobbt habe, und voll dahinter stand, weil ich das Essen dort sehr mag und es ziemlich gut fand, als Mitarbeiter in der Mittagspause richtig zuschlagen zu können. Außerdem sahen unsere Mädels vom McDrive-Schalter immer ziemlich sexy aus mit den Headsets. (Erste Regel für Restaurantleiter: Hübsche Mädels an den Drive-Schalter, damit die Prolls in den tiefergelegten 3er BMWs was zu sabbern haben.) Über ix habe ich nun eine Seite entdeckt, auf der weitere 10 Gründe aufgelistet sind – mal pragmatisch, mal ideologisch – warum man zu McDonald’s gehen sollte. Am besten fand ich diese Passage: This means that, whenever one buys one of those cardboard boxes full of fries, a burger and a piece of plastic, the company loses money – the fast food firm banks on making a profit out of the adult accompanying the kid, who will hopefully buy a full price meal. Wusste ich gar nicht: Die Happy Meals werden durch die richtigen Menüs subventioniert. Allerdings wundere ich mich schon auch über die immer aufwändigeren Spielzeuge, die da quasi verschenkt werden. Für die Mitarbeiter gibt es aus anderen Gründen nichts schlimmeres als eine Horde einfallender Kids an der Kasse: Bis die sich geeinigt haben, welches Spielzeug sie haben möchten, ist man manchmal schon kurz vor dem Nervenzusammenbruch. Von wegen »Überraschung«! Besonders interessant ist die etwas eigene Logik von Kindern, was die Spielzeuge angeht. Mutter mit drei Kindern kommt an die Kasse. »Ich hädd gern drrrei Junior-Düden.« _(Wir sind in Franken)_ »Alles klar, mit Hamburger, Cheeseburger oder Chicken McNuggets?« »Ähhm, mit Hamburcher. Und alle mit Fanda.« »Und welche Spielzeuge möchten die Kinder gerne?« »Psst, tun Sie einfach in alle drrrei das Gleiche ’nei!« »???« »Es gibt leider immer Grrrieg hier, wenn einer auf den anderen neidisch wird.« »Aber wenn sie drei verschiedene Spielzeuge haben, dann kann man viel besser damit spielen. Die ergänzen sich ja alle. Da kann man den ganzen König der Löwen nachspielen« »Nee, des hadden wir letzten Monat. Zwei der Ginder sind dann in Drrränen ausgebrochen, weil sie neidisch auf meinen ältesten waren, der sich das schönnste Deil nausgesucht had.« »Okay, also dreimal das gleiche.« »Genau, dange!«"
