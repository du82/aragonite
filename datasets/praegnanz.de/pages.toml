title = "10 kleine Gerritlein ... | praegnanz.de"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "10 kleine Gerritlein ... 12. Mai 2004 Früher habe ich mal Stafette gelesen, ein pädagogisch wertvolles Jugendmagazin. Wie Bravo für die Langweiler-Kinder. Doch es gab ab und an ein Poster. Und auf den Rückseiten dieser Poster konnte man sich Kleinanzeigenplatz sichern. Viele Kinder mit blöden Namen haben dort nach Leidensgenossen gesucht und einen »Klementine-Klub« gegründet, einen »Vicktor-Verein« oder eine »Carmiana-Clique«. Mit dem Internet geht sowas heutzutage in wenigen Minuten. Und ich (Gerrit) habe das mal ausprobiert und dabei Erstaunliches festgestellt. Zunächst einmal die Gerrits, von denen ich schon vorher gewusst habe, dass sie existieren: Gerrit Rietveld, sehr berühmter Architekt und Möbeldesigner Gerrit Noordzij, berühmter Typograf aus Holland Gerrit Zitterbart, bekannter Pianist Gerrit Neuhaus, weniger bekannter TV-Regisseur Doch auch die im Internet schlummernden Gerrits sind nicht minder interessant: Gerrit Anders, Rockmusikfan, selbsternannter Hacker und iPod-Besitzer Gerrit Neuhaus, Mac-User und Coder, hat noch eine Website Gerrit Nohr, Schlagersänger der schmalzigen Art Gerrit Haller, Sprachwissenschaftsstudent aus Wuppertal, laaangweilig Gerrit Glomser, Radrennprofi Gerrit Reubold, Schachspieler und Coder Na? Fällt Euch was auf? Richtig! Bis auf den Sprachwissenschaftler und den Radfahrer sind sie mir alle ähnlich! Kreative, Musiker, Mac-User, Coder … In uns schlägt das gleiche Blut! Ist das nicht großartig?"
year_published = 2004
