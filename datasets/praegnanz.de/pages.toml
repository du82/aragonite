["https://praegnanz.de/weblog/shopsysteme"]
title = "Die immer noch unerträgliche Shopsystemsituation | praegnanz.de"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "Die immer noch unerträgliche Shopsystemsituation 14. Mai 2013 Beobachter unserer kleinen Agentur werden es mitbekommen haben: Besonders viele Shops haben wir in letzter Zeit nicht gerade umgesetzt. Das liegt an einer internen Verordnung innerhalb der GbR, dass wir nur noch in Ausnahmefällen über das Einrichten von Shops für unsere Kunden nachdenken. Grund ist das katastrophale Angebot an brauchbaren Open-Source-Lösungen für kleine bis mittelgroße Projekte. Das immer noch meistgenutzte System, vor allem für die schnelle Billiglösung zwischendurch, ist xt:commerce 3. Da die Weiterentwicklung dieser Software bereits vor sehr vielen Jahren offiziell eingestellt wurde, tummeln sich mehrere offizielle und inoffizielle Nachfolger und Forks auf dem Markt, allen voran xtcModified modified eCommerce Shopsoftware, welches sich rühmt, eine vollkompatible, fehlerbereinigte und leicht erweiterte Version des Originals zu sein. Nun. Alles, was aus Richtung xt:c kommt, hat mit dem fast kompletten Fehlen eines Plugin-/Hook-/Modulsystems zu kämpfen. Sprich: Fast alle Erweiterungen sind Core-Hacks. Wer also nicht gerade peinlich genau Buch über alle Anpassungen führt, kann niemals ein Update machen, ohne alles kaputt zu machen. Wer konzeptionell auch nur einen Zentimeter vom Standard-Shop abweichen will, muss das System aktiv bekämpfen und sich dabei richtig die Finger schmutzig machen. Wir hätten es gerne professioneller? Okay. Magento wird allerorts empfohlen, wenn es um große Lösungen geht. Mag sein, dass das großartig ist. Für die Belange der allermeisten kleinen Agenturen und für Kunden mit lediglich vierstelligen Budgets lohnt sich das jedoch höchstwahrscheinlich nicht. Es ist das TYPO3 der Shopsysteme, wenn auch mit nicht ganz so veralteter Technik. Aber mindestens genauso eklig zu hosten. In der Mittelklasse spielen OXID und Shopware. Grundsätzlich kann man damit auch schon etwas anfangen, aber auch hier treffen wir auf Schwierigkeiten, wenn es um das Anlegen von individuellen Abläufen und Layouts geht. Mit OXID ist es de facto unmöglich, ein eigenes Template from scratch anzulegen, weil dafür der Recherche- und Testaufwand immens wäre. Man ist also auf das prosaische »basic« oder das hyperkomplexe »azure« angewiesen, und muss dies vorsichtig anpassen, wobei man ständig Dinge kaputt macht. Shopware hingegen schreckt allein durch das komplexe und langsame extJS-Backend ab. Letzte Hoffnung PrestoShop? Aber nicht doch: Die deutsche Rechtsprechung in Sachen E-Commerce muss hier erst noch umständlich reingefummelt werden mit gekauften Modulen, die dann hoffentlich nicht das Theme kaputt machen – denn den Core hacken diese dann auch mal eben fröhlich. Und und und. Alle Systeme, die wir bis jetzt untersucht haben, kranken an einem oder mehreren der folgenden Probleme: keine Rechtssicherheit für Shops aus Deutschland kein sauberes Plugin/Modul-System zu kompliziertes Template-System schlechte Kontrolle über den HTML-Output zu komplexes Backend für simpelste Funktionen müssen teure Kaufmodule erworben werden sind als Module für CMSe erhältlich, die es aber zusätzlich auch noch zu lernen gilt. Und es ist ja auch nicht einfach! Denn im Gegensatz zu normalen CMSen gibt es bei Shops ein paar wünschenswerte Eigenschaften, die sich leider ein wenig widersprechen: Ich kann nicht gleichzeitig automatische Rechtssicherheit verlangen und trotzdem ein hochflexibles Templating fordern, bei dem ich alles (auch den Checkout) selber gestalte. Damit mache ich jegliche Rechtssicherheit ja potenziell zunichte! Jeder Shop hat sehr unterschiedliche Anforderungen, die die Komplexität in eine bestimmte Richtung erweitern. Größenvariationen, Farbvariationen, Rabattstaffelungen, Zahlmethoden abhängig vom Nutzertyp, und das sind nur ein paar Beispiele. Ein guter Allround-Shop muss also in viele Richtungen flexibel und damit komplex sein. Jeder Shop nutzt eine ganz andere Kombination von Funktionen. Und das Templating darf aber trotzdem nicht komplex sein? Und muss mit eigenem HTML komplett gestaltbar sein? Herzlichen Glückwunsch! SEO-gerechte Performance bei vielen Artikeln ohne fehleranfälliges Caching? Speed ist für viele Shops überlebensnotwendig, das Ranking in den Suchergebnissen hängt davon ab. Auf der einen Seite schreien diese ganzen Schwierigkeiten nach einem beherzten »für jeden Zweck das passende Shopsystem!«. Doch wie soll man sich das als Webdesigner vorstellen? Intime Kenntnisse in drei oder gar vier unterschiedlichen Shopsystemen? Jedes mit seinen eigenen Tücken? Oder doch lieber alles auf eine Karte setzen, und dann das Beste aus dem gewählten System rausholen, oder gar selber mitentwickeln? Gehostete Lösungen sind auf dem deutschen Markt rar. Ein Kaliber wie Shopify sucht man vergeblich. Das auf WordPress basierende Supr ist nur für sehr begrenzte Anwendungsfälle die richtige Wahl. Für uns heißt das derzeit leider, dass unter 5.000 Euro fast keine Möglichkeit besteht, einen Shop aufzubauen, der unseren Qualitätsansprüchen im Jahr 2013 entspricht. Und wenn es gar um ein individuelles Design mit nicht-standardisierter Nutzerführung geht, kann das recht schnell fünfstellig werden. Und das ist für fast alle unsere Projektanfragen zu viel Geld. Der schnell aufgesetzte 1000-Euro-Shop mit xt:commerce, bei dem man nur ein paar Farben und Schriften austauscht, entspricht einfach nicht unserem Verständnis von Individualität und Qualität."
