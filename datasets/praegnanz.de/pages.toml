["https://praegnanz.de/weblog/webdesign-teuer"]
title = "Websites sind teurer geworden | praegnanz.de"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "Websites sind teurer geworden 16. März 2015 In den letzten Monaten kam es einige Male zu einer Situation, die ich vorher kaum erlebt hatte: Festpreisangebote für Websites, die wir sorgfältig kalkuliert hatten, wurden als zu teuer abgelehnt, und wir kamen mit den potenziellen Neukundinnen nicht ins Geschäft. Keine tragische Sache, aber für mich durchaus etwas Neues. Bisher war es so, dass die Firmen, welche sich an uns wandten, eine recht realistische Vorstellung von unserem Aufwand hatten. Doch in den letzten Jahren hat sich tatsächlich einiges verändert, und auch wir haben einige Zeit gebraucht, um unsere eigene Arbeitsweise neu zu bewerten und zu kalkulieren. Legendäres Symboldbild, © by Zing Design, Neuseeland Was war passiert? Vor ca. zwei Jahren haben wir beschlossen, dass wir in Zukunft keine neuen Websites mehr ohne responsiven Ansatz anbieten würden. Zum einen hielten wir es für eine Selbstverständlichkeit, über die man in aufgeklärten Kreisen gar nicht mehr diskutieren müsste. Zum anderen wollten wir unsere weniger aufgeklärten Kunden schützen vor einer Website, die bereits zum Launchzeitpunkt veraltet sein würde und kurze Zeit später sowieso nachgerüstet werden müsste. Dieses sogenannte Responsive Retrofitting ist zwar möglich, aber meist entwürdigend, qualitativ minderwertig und kostet immer 50–100% mehr, als man vorher geschätzt hatte. Darüber hinaus gehört zu einer echten Responsivität inzwischen auch die Benutzung von »Retina«-Elementen, wo immer es möglich ist – also hochaufgelöste fotografische Motive, sowie vektorbasierte grafische Elemente. Gerade letztere verlangen in vielen Fällen einen gewissen technischen Aufwand, wenn sie klug und ressourcenschonend eingebunden und angezeigt werden sollen. Doch eine Website muss heute nicht nur responsive sein, sondern sie sollte auch den aktuellen Designparadigmen entsprechen und sich idealerweise positiv vom Feld der Mitbewerberinnen abheben; Die Menschen sind ja nicht blind und erkennen die emotionale Kraft von hochwertigen, großformatigen Einstiegsbildern oder gar Videos (siehe airbnb). Sie sind fasziniert von subtilen Animationen, die per Scrollevent getriggert werden (siehe iPhone-6-Produktseite). Aber in erster Linie wollen die meisten Kunden keine Abstriche machen, was die Reichhaltigkeit der inhaltlichen Struktur angeht. Die Sitemap-Entwürfe, die wir bekommen, strotzen häufig vor Navigationspunkten und Ebenen, so dass man mit den responsiven Blick bereits innerlich zu Schwitzen beginnt. Denn es gibt leider kaum gut erprobte Designpatterns für Websites, die in traditioneller Desktop-Denke geplant sind, aber dann mit Mobile-First-Paradigma umgesetzt werden sollen. Und man macht sich keine Vorstellung davon, wie hartnäckig und beratungsresistent bisweilen die Kundinnen sein können, und wie wenig sie sich immer noch für die mobile Benutzung interessieren. Hohe Komplexität der Inhaltsstruktur auf der einen Seite, ein offenes, modernes, leichtgewichtiges und superflexibel adaptives Layout auf der anderen Seite, das klingt entweder nach viel Aufwand oder nach halbgaren Kompromissen. Unser Ziel ist es, letztere zu vermeiden und lieber den harten, ehrlichen Weg einzuschlagen. Von daher trauen wir uns zunehmend, mit höheren Aufwandsschätzungen zu jonglieren. Das ist absolut keine Profitgier und auch keine Unverschämtheit, sondern schlicht die Folge unserer Erfahrungswerte, was individuelles Webdesign heute für den Dienstleister bedeutet. Insbesondere, wenn ein Kunde sich bereits im Vorfeld als sehr gestaltungsfreudig, meinungsstark und detailverliebt erweist. Wer mit uns eine Website plant, bei der individuelle Ideen und spezielle Wünsche – seien sie funktional oder visuell – eine große Rolle spielen, der muss sich darauf gefasst machen, dass wir diese Wünsche ernst nehmen, aufgreifen und eine mediengerechte Umsetzung für die Realität des Jahres 2015+ anpeilen, statt sie einfach 1:1 für einen 1.280px-Non-Retina-Screen hinzupfuschen. In vielen Fällen bedeutet dies eine Erhöhung im Vergleich zu einem 2010er-Budget. Die Webwelt ist komplexer geworden, und unsere Dienstleitung mit ihr. Die Inflation kommt natürlich auch noch dazu. Die preiswerte Alternative ist im Übrigen richtig gut geworden – darüber berichtet der Schwesterartikel zu diesem Beitrag. Damit können wir freilich nicht konkurrieren, denn wir stehen nun einmal für die traditionell-handwerkliche Herangehensweise, bei der das Design den vorhandenen Inhalt aufgreift und hochwertig in Szene setzt, und bei der Sonderwünsche und clevere Ideen mit Sorgfalt erfüllt werden können – insbesondere, wenn sie frisch und unkonventionell quergedacht sind. Um ein technisches Problem zu lösen, müssen wir nicht erst auf ein Theme-Update warten oder eine Supportmail an Jimdo schreiben. Wir kennen unseren Code und können schnell auf Probleme und Wünsche reagieren – langjährige praegnanz.de-Kunden heben das immer wieder lobend hervor. Die schnelle Baukastenlösung ist verlockend, weil sie absolut real und auch legitim ist. Doch sehr häufig stellt sich erst mitten im laufenden Projekt heraus, dass es eben doch die individuellen Wünsche gibt – von kleinen visuellen Anpassungen bis hin zu komplizierten Interaktionswelten. Entweder geht ein Auftraggeber davon aus, dass »das doch sicher mit abgedeckt« sei, oder er wusste zum Zeitpunkt der Beauftragung selber noch nichts von diesem Wunsch. Und genau an diesem Punkt fällt das Baukastensystem oftmals in sich zusammen, denn Sonderwünsche sind eine komplizierte Angelegenheit, wenn die Projektinfrastruktur grundsätzlich auf dem Zusammenstecken fertiger Teile basiert. Manche Kundinnen sind bereit, diese Einschränkung hinzunehmen und mit dem zu leben, was irgendwie alle haben. Glücklich schätzen kann sich jedoch die Kundin, die am Anfang etwas mehr Geld in die Hand genommen hat, um gleich eine maßgeschneiderte, aber zugleich skalierbare und flexible Basis zu beauftragen. Man mag argumentieren, dass wir uns mit den vorangegangenen Ausführungen als hochnäsige Edelschmiede aufstellen, die den Kontakt zum Jedermann-Web verloren hat, doch wir sehen es anders: Jeder kann heute eine professionell wirkende Website haben und muss dafür nur noch wenig Geld ausgeben, und diesen Umstand wollen wir gar nicht negativ bewerten! Doch sobald die Wünsche an die Gestaltung des Auftritts individueller werden, steigt der Aufwand und damit der Preis an. Leider tut er dies jedoch nicht linear, sondern eher nach dem 80/20-Prinzip, wenn nicht sogar exponentiell. Wir helfen gerne dabei, die tatsächlichen Kosten zu kalkulieren und runde Pakete zu schnüren, die den Ansprüchen unserer Kundinnen gerecht werden, und die vor allem ausbaufähig und flexibel sind für zukünftige Entwicklungen. Wenn Ihnen das gefällt, freuen wir uns selbstredend auf Ihren Anruf oder Ihre Mail :-) Disclaimer: Wenn wir von »indviduellen Lösungen« sprechen, meinen wir damit nicht etwa hauseigene Content-Management-Systeme oder gar Website-Entwicklung auf App-Framework-Basis. Wie jeder weiß, lieben wir unsere Open-Source-CMSe! Nur dass uns die Arbeit mit eher minimalistischen Systemen wie Kirby und ProcessWire, sowie eigenen Themes für Drupal und WordPress deutlich weniger Bauchschmerzen bereitet als das Herumdoktern an fertigen Theme-Systemen oder gar SaaS-Lösungen."
year_published = 2015
