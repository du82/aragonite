["https://praegnanz.de/weblog/3-webdesign-zutaten"]
title = "3 Webdesign-Zutaten | praegnanz.de"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "3 Webdesign-Zutaten 15. April 2005 Was ich schon lange mit mir herumschleppe (im Kopf), ist die Vorstellung, dass ein Webdesigner eigentlich drei Fähigkeiten in sich vereinen muss, um sich wirklich als »Webdesigner« bezeichnen zu können. Zwar kann man auch mit nur einer oder zwei der Fähigkeiten Websites bauen, diese online stellen und auch durchaus erfolgreich sein – wenn man sich und seine Arbeit entsprechend verkaufen kann ;-) Der optimale Zustand ist jedoch, wenn in einem Web-Projekt alle drei Gebiete kompetent einfließen. Ein reiner Designer macht zwar großartige Augenschmeichler-Layouts, doch die sind oft umständlich zu bedienen, nicht zugänglich und zu vielen Konfigurationen nicht kompatibel. Von Ladezeiten will ich gar nicht anfangen. Der reine Usability-Experte kriegt eine sinnvolle und einfache Struktur hin. Auf seinen Seiten findet sich jede Information sofort, auch mit Braille-Zeile und Screenreader. Doch leider sind sie oftmals sehr einheitlich und zu grobschlächtig gestaltet. Der Programmierer baut gerne mächtige Funktionen in seine Seite ein und verwendet pfeilschnelle Servertechnologien, die bis ins Unendliche skalierbar sind. Was jedoch meist gar nicht nötig ist, zeugen seine Seiten doch von einer ausgeprägten Gestaltungsverweigerungshaltung. Und kein Laie besucht gerne Seiten, die zwar theoretisch toll sind, aber es nicht nach außen zeigen. Das sind die Extremfälle, die in der Praxis zwar nur selten in reiner Form auftauchen, aber die Richtung wird klar. So erscheint es sinnvoll, für größere Projekte Leute dazuzuholen, die sich in den jeweils anderen Gebieten gut auskennen. Fehlt eines der drei Gebiete, kann aus dem Projekt nichts wirklich Herausragendes werden. Wer kleinere Brötchen backen will und alleine arbeitet, sollte zusehen, auf allen Gebieten dazu zu lernen. Das Netz bietet genügend Ressourcen. So habe ich mir für Loudblog recht flott PHP-Kenntnisse aneignen können, ohne ein einziges Buch erwerben zu müssen. Und auch zu den Themen Usability und Design gibt zahlreiche Blogs und Sites, die man konsultieren kann. <pathos> Packen wir es an! Lasst uns keine Fachidioten bleiben, sondern auf allen Gebieten dazu lernen, um unseren Kunden qualitativ hochwertige Internetseiten bieten zu können! Und um das Netz zu einem noch besseren Ort zu machen. </pathos>"
