["https://praegnanz.de/weblog/11designer"]
title = "Alternativ oder genauso albern? | praegnanz.de"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "Alternativ oder genauso albern? 17. März 2004 Wer es noch nicht gesehen hat, tut es hiermit: Dieses Gebilde ist das offizielle Logo zur Fußball-WM 2006 in Deutschland. Puh, das tut schon weh! Franz Beckenbauer ist ja mächtig stolz drauf (»Es sollte fröhlich wirken« – auch grenzdebil?) und bei der Vergabe des Design-Auftrages ist wahrscheinlich mehr geklüngelt als gepitcht worden. Dass dieser Entwurf – obschon mehrfach abgesegnet und offiziell bestätigt – eigentlich aufgrund seiner Schlechtheit nicht der Diskussion Wert ist, sieht jedermann sofort ein. Deshalb: Schwamm drüber! Nun der interessantere Part: Auf Initiative von Klaus Hesse und Fons Hickmann, beides sehr aufstrebende Designgrößen in Deutschland, haben sich elf mindestens ebenso aufstrebende Designer gedacht: »Das können wir aber besser!« Und das ist ja nun wirklich spannend: Was kommt dabei heraus, wenn junge Kreative gegen ein gemeinsames Feindbild ziehen und Gegenentwürfe basteln? Nicht das, was man erwartet hätte, leider. Denn statt innovativ, prägnant und zeitlos (Alles Eigenschaften, die dem Original abgehen), gingen elf Logo-Entwürfe an den Start, die irgendwie alle einen unbefriedigenden Eindruck hinterlassen – von einigen interessanten Aspekten abgesehen, die man weiter verfolgen müsste. Im Folgenden also nun meine ganz persönlichen polemisch gefärbten Gedanken zu jedem einzelnen der neuen Logos. Man muss dabei fairerweise hinzufügen, dass ich dabei von einer einzelnen, statischen Darstellung der Embleme ausgegangen bin. Die habe ich nämlich in Horizont entdeckt und gleich danach diese Zeilen verfasst. Einige Entwürfe sind ausgeklügelte Logo-Systeme, die nur animiert oder in der Variation funktionieren. Vielleicht also eine unfaire Darstellung, dafür aber subjektiv und direkt aus dem Herzen – wie bei einem echten Fußballfan! Mehr Informationen und Image-Trailer über alle Logo-Entwürfe gibt’s auf 11designer.de. div(trenner). txp:dca_pop id=»121«> Ruedi Baur Der Versuch einer Synthese aus »La Linea« und Red Bull-Werbung im markanten Edding-Kritzel-Look. Irgendwie billig und ungelenk, wie in einem selbst gebastelten Daumenkino (Auch wenn das tausendmal gewollt ist!). Ich vermisse hier nur noch die Anmutung von Tesa-Streifen und bin gespannt auf die Handy-Display-Fähigkeit dieses Entwurfes. div(trenner). txp:dca_pop id=»180«> cyan Hier wird mit der Ästhetik von Vierfarb-Fehldrucken gespielt. Nett, da die Agentur auch noch Cyan heißt: Machen die immer dieses Spielchen? Dumm, dass cyan nicht in schwarz-rot-gold vorkommt. Ebenso dumm, dass dieses Logo in schwarz-weiß keinerlei Reize mehr besitzt. Schön ist natürlich die formale Klarheit und die Kleinschreibung. Auf jeden Fall einer der besseren Entwürfe. Jedoch für die Masse immer noch zu experimentell und kopflastig. div(trenner). txp:dca_pop id=»123«> Factor Design Mit Sicherheit eines der stärksten Alternativ-Vorschläge. Sowohl technisch-klar, als auch dezent dynamisch. Geschickte Unterbringung der Nationalfarben und kompakte, überall reproduzierfähige Formgebung. Einziger Nachteil: Die fehlende Prägnanz. Es macht nicht auf sich aufmerksam, ist einfach ein bisschen langweilig. Dennoch: Die reduzierten zeitlosen Formen gefallen mir sehr gut und hätten sich angenehm von den Logos der letzten WMs abgehoben. div(trenner). txp:dca_pop id=»124«> Die Gestalten Die Gestalten gelten als coole Design-Agentur. Doch was soll das denn? Der Kicker wurde offensichtlich einer CorelDRAW!-ClipArt-CD entnommen und passt stilistisch so gar nicht zum Rest. Die Farben sind reine Willkür. Wir haben drei konkurrierende Elemente. Wir haben eine Pseudo-Perspektive. Wir haben soviel schreckliche Sachen, die so gar nicht logo-artig sind, dass man das kalte Grausen kriegt. Dies ist das Signet vom FC Kleinrinderfeld, nicht das der Fussball-WM 2006. div(trenner). txp:dca_pop id=»125«> Hesse Design Der Initiator der ganzen Veranstaltung, Klaus Hesse, meldet sich höchstpersönlich zu Wort. Im Gepäck hat er ein Logosystem, das – zugegebenermaßen – ein echter Hingucker ist. Ein bisschen Farbbeutel-Wurfgemälde, ein bisschen EXPO2000. Eine Herausforderung an Drucktechniker und Pixelschubser, jedoch frisch und neuartig. Wenn auch wenig logo-esk. Und das ist das schwierige: Das Format. Nicht ganz eindeutig, ob nun längs oder quer. Wo ist die Typo, wie setze ich das Ganze ins Layout? Ein sehr egoistisches Logo, das die Blicke auf sich zieht, aber auch ablenkt von allem anderen. Zwiespältig, aber irgendwie reizvoll. div(trenner). txp:dca_pop id=»126«> Fons Hickmann m23 Das kann ja wohl nicht wahr sein: Volkshochschulkurs in Macromedia Freehand, 3. Lektion: Verformungseffekte. Oder wollte hier jemand die Bauchregion des typischen Fussballfans karrikieren? Egal, der Untergang des Abendlandes muss nahe sein, wenn derartig Gestaltetes sich aus den provinziellen Schülerzeitungen hinaus traut, um auf internationaler Ebene zu kommunizieren gedenkt. Effekthascherei und Einfallslosigkeit sind kein empfehlenswertes Designkonzept. div(trenner). txp:dca_pop id=»129«> nowakteufelknyrim Ein Tattoo als Logo? Warum nicht! Professionell illustriert ist dieser Entwurf in jedem Falle. Nur gibt es da ein klitzekleines Größenordnungsproblem: Nicht (nur?) die starken Oberarme der Fussballfans soll das Logo schmücken, sondern vielmehr Medien und auch Leitsysteme aller Art. Und da wäre es doch schon ein wenig seltsam, ein kitschiges Comic-Herzchen neben der Aufschrift »zur Doping-Kontrolle« zu erblicken. div(trenner). txp:dca_pop id=»179«> ade hauser lacour Ahhh, welche Klarheit! Des Designers Herz ist erfreut angesichts der perfekten Form eines simplen Kreises. Von der Reduziertheit an Olympia ’72-Stringenz von Otl Aicher erinnert, wird jeder Designer dieses Logo sofort in sein Herz schließen. Doch halt mal. Welches Logo eigentlich? Ist das da oben eigentlich ein Logo? Kann man überhaupt von Gestaltung sprechen, wenn jemand einen Kreis zwischen zwei Trennlinien setzt? Der Wiedererkennungswert tendiert gegen null, besonders kompakt ist das Ganze auch nicht. Und der Laie wird sich leicht verarscht vorkommen. Ich sage: Mutig wär’s! Aber auch ein bisschen unangebracht für ein weltweites, gigantisches Sportevent – Begeisterung für die Ulmer Schule hin oder her. div(trenner). txp:dca_pop id=»127«> Uwe Loesch Mein persönlicher Tiefpunkt dieser elf Entwürfe. Seit wann besteht ein Logo aus freigestellten fotorealistischen Elementen, die miteinander konkurrieren und sowohl auf den ersten Blick als auch bei längerer Betrachtung einfach hässlich arrangiert sind? Was soll die Kristallkugel, was soll dieser gelbe Ring? Mir fällt gar nicht mehr ein! Dieser Entwurf wäre schon im ersten Semester eines Design-Studiums mit Pauken und Trompeten durchgefallen – eine ganz traurige Laien-Arbeit. div(trenner). txp:dca_pop id=»128«> moniteurs Sieht ja ganz lecker aus auf den ersten Blick. Nette Typo, dynamisch geschwungener Bogen, sportlicher Gesamteindruck. Nur bitte: Wer hat diesen Leuten erlaubt, ein fotorealistisches Vierfarb-Motiv zu verwenden, das mit Logo-artiger Abstraktion und Reduktion nun so gar nichts zu tun hat? Logos sind doch keine Fotocollagen. Hübsch ist es ja, aber druckfähig? Ich wünsche demjenigen viel Vergnügen, der das Gras-Motiv freistellen muss, um es auf einen farbigen Hintergrund zu setzen. Es wird nicht überzeugend sein. So wie es jetzt hier aussieht, denkt man spontan: »klasse!«, doch denkt man zwei oder drei Schritte in Richtung Realisierung, kehrt man schnell wieder zurück zu den klassischen Tugenden des Grafik-Design, die solche Foto-Mätzchen einfach verbieten. div(trenner). txp:dca_pop id=»178«> Andreas Uebele Auf dem Thumbnail rechts sieht man bereits, dass es so nicht geht. Kleiner als 3 cm im Druck bzw. 150 Pixeln auf dem Screen kann man dieses Motiv nicht verwenden, da die Schrift einfach zuläuft und noch unlesbarer wird, als sie sowieso schon ist. Die Grundannahme, dass Logos zur direkten und schnellen Erfassung einer Firma bzw. einer Veranstaltung dienen, wird hier mit Füssen getreten. Nur die Farbe Orange als key visual ist einfach zu wenig, außerdem mit der Telekommunikationsfirma orange, dem ZDF, der Agentur orangepop, und dem PetShopBoys-Album »very« schon häufig belegt. Prinzipiell plädiere ich ja auch für rein typografische Lösungen, doch das hier ist echter Murks, bei dem keiner einen Gedanken an die spätere Realisierung verschwendet hat."
year_published = 2004
clearnet = "https://praegnanz.de/weblog/11designer"
