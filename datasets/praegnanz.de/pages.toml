["https://praegnanz.de/weblog/10-weitere-freie-schriften"]
title = "10 weitere freie Schriften | praegnanz.de"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "10 weitere freie Schriften 25. Oktober 2006 Ich gebe es ja zu – es ist Taktik! Aber seitdem ich am Sonntag auf einigen hochkarätigen amerikanischen Websites mit meinen Schrift-Essays verlinkt bin, haben sich meine Zugriffszahlen mehr als verdoppelt. Da liegt es natürlich nahe, ein paar Schriften nachzuschießen. Und da ich keine Zeit mehr habe für die ausführlichen Beschreibungen, muss eine Kurzversion reichen. Dafür aber gleich zehn Schriften auf einmal. Damit bin ich zwar nur ungefähr auf dem gleichen Stand wie Dr. Web und Alvit, aber dafür habe ich selber gebastelte Sample-Grafiken zum schnellen Vergleich – und natürlich die legendären Schriftmusterblätter zum Sammeln. Außerdem habe ich ja mit dem Scheiß angefangen und darf nun wieder aufholen! Alles in allem habe ich heute abend knapp vier Stunden (gääähn!)an dem Artikel gesessen. Ich hoffe, es lohnt sich für Euch! Gute Nacht."
year_published = 2006
