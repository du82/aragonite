["https://praegnanz.de/weblog/16-fragen-zur-kulturflatrate"]
title = "16 Fragen zur Kulturflatrate | praegnanz.de"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "16 Fragen zur Kulturflatrate 24. Juli 2009 Ich bin schockiert, dass diese Frage bisher gar nicht geklärt (oder zumindest nicht ausreichend deutlich kommuniziert) wurde: Wie soll verhindert werden, dass es zu Verteilungsungerechtigkeiten kommt, z.B. solche Urheber und Verwerter benachteiligt werden, die mit hohem Zeit- und Kostenaufwand qualitativ besonders hochwertige Werke schaffen? Sollen diese – so, wie sie in der physischen Welt einen höheren Verkaufspreis verlangen können – mehr Geld aus den Einnahmen erhalten als Urheber von Werken, die mit geringerem Aufwand / mit geringerem Anspruch erstellt werden? Wenn ja: Wer definiert, was qualitativ hochwertig und was „Mainstream“ ist? Wenn nein: Welche alternativen Anreize soll es für die Schaffung hochwertiger Werke geben und wer soll deren Finanzierung sicherstellen? Mehr in den Wunden liegende Finger gibt es beim Börsenblatt"
year_published = 2009
clearnet = "https://praegnanz.de/weblog/16-fragen-zur-kulturflatrate"
