["https://praegnanz.de/weblog/11-vs-gmx"]
title = "1&#38;1 vs. GMX | praegnanz.de"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "1&#38;1 vs. GMX 14. Juli 2004 Es ist absolut faszinierend, wie sich die Unternehmen, die DSL anbieten, gegenseitig unterbieten. Kaum habe ich von 1&1 zu GMX gewechselt (die mir 4GB statt 1GB für den gleichen Preis geboten haben), schlägt 1&1 zurück. Bietet ähnliche Volumenpreise an und außerdem IP-Telefonie. Wow, das wird cool! Und für DSL-Wechsler gibt es 100 Euro Startguthaben. Und natürlich den obligatorischen Router. (Mit WLAN-Routern wird man ja generell bombadiert, wenn man einen DSL-Vertrag abschließt, egal, bei welchem Anbieter.) GMX wiederum hat seit heute ein schickes neues Layout. Wurde auch Zeit. Zwar ist es immer noch viel zu vollgestopft, jedoch auf ziemlich hübsche Art und Weise. update: Wie ich eben über ich|WELT erfahre, ist das neue GMX-Layout komplett CSS-basiert. Stimmt! Schaltet das Style-Sheet aus und entdeckt das semantisch geordnete MarkUp! Großes Lob!"
year_published = 2004
