["https://praegnanz.de/weblog/1live-und-die-definition-von-club"]
title = "1LIVE und die Definition von Club | praegnanz.de"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "1LIVE und die Definition von Club 6. Mai 2007 Wer gebildet ist, liest Briefwechsel zwischen berühmten Dichtern. Wer Spaß haben will, der lese sich den Mailwechsel zwischen Frank Scheller und dem total hippen Radiosender 1LIVE durch und grinse sich eins. Zur Vorgeschichte: Frank gewinnt bei EinsLIVE einen Monat lang freien Eintritt in einen Club seiner Wahl. Er entscheidet sich spontan für die »Ranch«, einen Swingerclub, bei dem der Entritt ein Vielfaches von dem kostet, was sich 1LIVE unter einem typischen Club vorstellt. Das führt zu gewissen – Konflikten: Hier, hier, hier, hier, hier und hier Sie haben bei uns in der Sendung 1LIVE Moving gewonnen, was uns sehr freut. Gerne bezahlen wir Ihnen einen Monat lang den Eintritt in Ihren Lieblingsclub. Natürlich ist auch in diesem Zusammenhang eine Diskothek und zum Beispiel kein Tennis- oder der Rotaryclub gemeint. Bitte haben Sie Verständnis dafür, dass wir Ihnen nicht den Eintritt in einen Swinger-Club bezahlen können. Bitte teilen Sie Ihre Entscheidung meiner Kollegin Sabine XXX mit. Ich bin gespannt, welche Diskothek Sie sich aussuchen werden. Woran erinnert mich diese Geschichte nur?"
year_published = 2007
