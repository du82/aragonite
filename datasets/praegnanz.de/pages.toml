["https://praegnanz.de/weblog/2005-noch-nicht-reif-fuer-sifr"]
title = "2005 noch nicht reif für sIFR? | praegnanz.de"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "2005 noch nicht reif für sIFR? 18. Dezember 2005 Groß war die Begeisterung über sIFR (sprich »Siffer«), als diese automatische HTML-Text-zu-Flash-Filmchen-Technik im Herbst letzten Jahres in der Version 2 debutierte. Vor allem ich war begeistert, öffnete sich doch hier eine ganz neue Welt der typografischen Gestaltung auf Websites. Folgerichtig wurde das Jahr 2005 schnell zum Year of sIFR ausgerufen. Es sollte einer der großen Webdesign-Trends werden, die dieses nun fast vergangene Jahr prägen sollten. Was ist daraus geworden? Nun, nicht viel. Es gibt zwar einige Beispiele über den gelungenen sIFR-Einsatz, aber die Begeisterung der Massen im großen Stile sehe ich nicht. Angesehene Start-Ups arbeiten sogar lieber mit einer per CSS eingebundenen Myriad Pro, wovon kaum ein Surfer etwas hat. Und Bloghosting-Anbieter schwenken nach einigen Monaten sIFR wieder um zu GIFs und JPGs. Woran liegt’s? Ich kann mir folgende Gründe vorstellen: Das Einbinden in eine Website ist zwar kein Hexenwerk, aber auch nicht ganz so reibungslos, wie man das sonst von der CSS-Schriftdefinition gewohnt ist: Ein bisschen Rumgefiddel ist stets vonnöten, sonst zerhaut es einem den Umbruch oder den Schriftgrad. Die Rechtefrage ist nicht geklärt. Fonthersteller sehen sIFR zurecht als äußerst kritisch an, denn prinzipiell kann man eine mit sIFR erstellte .swf-Datei als ein neues Font-Format ansehen, wobei die Dateien – von außen sichtbar – auf einem Server herumliegen und daher natürlich sehr einfach geklaut werden können. Auch wenn man die Schrift gekauft hat – die Weiterverbreitung über das Netz ist natürlich nicht erlaubt. Somit fallen eigentlich sämtliche professionellen Schriften flach, wenn man sich lizenztechnisch nicht in die Grauzone begeben möchte. Man fürchtet sich vor der wachsenden Anzahl von Firefox-Usern, die ihren Adblocker zu streng eingestellt haben. sIFR-Headlines werden nämlich hier mit einem kleinen Button versehen, der sie als vermeintliche Werbebanner anprangert. Unschön und nicht im Sinne des Erfinders. Das Handling von Hyperlinks. Vielleicht der einleuchtendste Grund: Die Links funktionieren zwar, aber mit dem rechten Mausklick gibt es Probleme. Und weil es eine weit verbreitete Taktik ist, sich über das Kontext-Menü einen Link in die Zwischenablage zu kopieren, weist sIFR hier echte Defizite auf. Was auch immer: Ich bin weiterhin ein Fan von sIFR, werde auch bei zukünftigen Projekten immer in Betracht ziehen, damit zu arbeiten, um die typografische Kultur im Webdesign zu fördern. Sollte es ein Facelift von praegnanz.de geben, wisst Ihr also schon jetzt, womit ihr zu rechnen habt!"
