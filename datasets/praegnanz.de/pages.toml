["https://praegnanz.de/weblog/webdesign-billig"]
title = "Websites sind billiger geworden | praegnanz.de"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "Websites sind billiger geworden 16. März 2015 Standards haben im Web einen guten Ruf, und das absolut zu Recht. Da muss man nicht einmal an den Siegenszug der Web-Standards-Bewegung erinnern. Best Practices, gelernte Bedienungskonzepte und narrensichere Architektur begleiten schon immer den Arbeitsalltag von Webdesignerinnen und können von daher kaum genug gelobt werden! Es gibt im modernen Webdesign ein buntes und abwechslungsreiches Set an bewährten und millionenfach erprobten Designpatterns, mit denen man vorzüglich bedienbare, emotionale und technisch blitzsaubere Websites bauen kann. Schaut man sich erfolgreiche Netzauftritte an, lernt man schnell, dass übermäßige Innovation und Wow-Faktor letztlich nur störend sind. Niemand will im Jahr 2015 noch Killer-Websites oder individuell ausgedachte Usability-Höllen. Vielmehr setzt man allerortens auf das, was der User kennt. Und diese Taktik ist absolut nichts Schlechtes. Denn nur, indem man das Webdesign in den Hintergrund treten lässt, kann sich die Nutzerin auf die Inhalte konzentrieren, und auf die kommt es schließlich an. Was wir also heute benötigen, ist ein modulares Baukasten-System, mit dem man erfolgreiche Designpatterns aneinanderreihen kann, um diese mit seinen Inhalten – seien es Texte, Fotos oder Videos – zu befüllen. Ob hierbei Inhalt oder Designbausteine zuerst da sind, spielt kaum eine Rolle. Im Zuge eines agilen Workflows kann man von allen Seiten eines Projektes beginnen und aufeinander zuarbeiten, bis sich am Ende alles zu einem runden Nichts stimmigen Ganzen vereinigt hat. Der Igel ist klug und gewinnt mit Bewährtem: seinem Aufenthaltsort! Glücklicherweise sind die Tools für unsere modularen Baukästen bereits da. Sie sind beinahe kostenfrei, und sie benötigen kaum noch Einmischung durch einen individuell arbeitenden Designer. Die allgegenwärtigen Werkzeuge heißen Bootstrap, Divi, Jimdo und The Grid, und sie stehen stellvertretend für verschiedene Stufen der Designstandardisierung im Web. Das Bootstrap-Framework wurde als Tool zum schnellen Prototyping gestartet, wird aber heute von vielen Backend-Programmiererinnen verwendet, um ohne Hilfe eines Frontendlers oder gar Designers zu raschen und gut aussehenden Nutzeroberflächen zu gelangen. Es versteht sich von selbst, dass sich tonnenweise Bootstraps in produktiver Umgebung befinden. Der prototypische Charakter verschwindet nämlich schnell, wenn das Projektbudget langsam zu Neige geht. Divi ist das ausgefeilteste WordPress-Theme, das es für Geld zu kaufen gibt. Es enthält nahezu sämtliche Webdesign-Patterns der letzten fünf Jahre, klärt uns über die Bedeutung des Wortes Blurb auf, ist ultra-modular und anpassbar, selbstverständlich responsiv und sieht einfach immer gut aus. Divi nutzt WordPress primär als Basis-Framework und installiert quasi ein zusätzliches CMS im CMS, welches nach eigenen Regeln funktioniert und besser und sauberer wirkt als das, was WordPress im nackten Zustand zu bieten hat, und der eingebaute Page Builder macht das alles sogar per Drag & Drop verfügbar. Auch mit Jimdo wird der zukünftigen Website-Betreiberin 90% des Aufwandes abgenommen, den sie mit manueller Erstellung gehabt hätte. Es ist die alte Idee des 1&1-Homepage-Builders, aber auf Steroiden, und in gut. In 5 Minuten kommt man vom Entschluss zur fertigen Website. Okay, ein paar Inhalte sollte man noch eintippen, aber im Grunde ist es das. Professionelle Seitenlayouts und – natürlich – Patterns sind dabei, alles responsiv. Eine App zur nativen iOS-Webbefüllung sowieso, es ist wie ein Divi-Theme, nur dass ich noch nicht einmal WordPress selber aufsetzen muss. Der endgültige Nirwana-Zustand ist aber erst mit The Grid erreicht. Ein System, das per Künstlicher Intelligenz die Website von ganz automatisch erstellen wird. Ich stelle mir das so vor, dass man einen Ordner mit ungeordneten Bildern und Texten rauflädt, und eine fertige, perfekt gestaltete und auf allen Geräten stimmige Website zurück erhält. Was genau es wirklich kann, muss noch getestet werden, aber die Erwartungen sind hoch. Bonustrack: Google Fonts ist eine der wichtigsten Ressourcen, wenn es um Webtypografie in der realen Welt geht. Die 600 freien Schriften aus dem allgegenwärtigen Google-Katalog sind eine Art Grundversorgung, vergleichbar mit Strom aus der Steckdose oder Trinkwasser aus dem Hahn. Kaum ein moderner Homepage-Baukasten, der ohne die extern gehostete Unterstützung von Open Sans und Co. auskommt. Fassen wir zusammen: Wenn ich mit all diesen modernen Tools und den millionenfach bewährten Designpatterns großartige, moderne Websites bauen kann, warum benötige ich noch die Hilfe eines Webdesign-Unternehmens, welches darauf besteht, jedes Projekt von vorne bis hinten neu zu programmieren? Ist das nicht eine Einstellung von gestern bis vorgestern? Für alles gibt es heute Frameworks und Module. Warum soll ausgerechnet im Frontend das Rad jedesmal neu erfunden werden, und das für teures Geld? Websites im Jahr 2015 müssen nur noch in Sachen Inhalt und Informationsarchitektur individuell geplant werden. Design und Technik kommen von der Stange, und sind mit den oben genannten Tools sicherlich besser als alles, was das Jahr 2010 jemals hervorgebracht hat. Wenn Sie beim Lesen dieser Zeilen heftig mit dem Kopf genickt haben, dann sind wir möglicherweise nicht die richtige Agentur für Sie. Sollten Sie aber leise Zweifel an der Argumentation haben, dann lesen Sie gerne hier weiter. Dieser Beitrag wurde zum Teil inspiriert durch diesen Blogkommentar von praegnanz.de-Leser Jürgen."
year_published = 2015
