["https://praegnanz.de/weblog/2nd-life-ein-film-aus-mainz"]
title = "2nd Life - ein Film aus Mainz | praegnanz.de"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "2nd Life - ein Film aus Mainz 22. Juli 2007 Es gibt manchmal wirklich Zufälle. Vor über zwei Jahren hat ein mir nicht unbekannter Kommilitone an der FH Mainz, Alexander Metzler, einen kleinen, aber sehr spannenden Mini-Thriller gedreht. Es war seine Diplomarbeit in Medien-Design. Dieser Film … beschäftigt sich mit der Second Life-Thematik. trägt den Titel »2nd Life«. wurde aber konzipiert und umgesetzt, ohne dass einer der Beteiligten das konkrete Produkt Second Life von Linden Labs gekannt hatte. Dass ihm das heute kaum jemand glauben wird, dürfte klar sein. Es ist aber tatsächlich wahr – Ich hatte mich damals mit Alex darüber unterhalten, und zu der Zeit kannte man in Deutschland zwar einige andere Online-Rollenspiele, aber niemand kannte Second Life! Wie dem auch sei, der Film wird am 29. Juli auf 3sat ausgestrahlt, und ich möchte ihn euch mal unverbindlich ans Herz legen: Er ist kurzweilig und spannend, kann aber freilich nicht mit professionellen Produktionen mithalten, was ihm aber auch einen gewissen Charme verleiht. Und, Alex, wie sieht’s aus mit dem kompletten Werk bei YouTube/Sevenload? Oder hast Du Schiss wegen der Musikrechte? Ich würd’s machen :-) update: Film komplett runterladen und angucken hier. habe ihn mir nochmal angeschaut: Super! Einziger Wermutstropfen: Marco Schreyl hat eine Nebenrolle!"
