full_description = "Das Web würde in seiner jetzigen Form nicht existieren, wenn es nicht so viele kluge Menschen gäbe, die bereit sind, ihr Wissen öffentlich mit anderen zu teilen. Deshalb habe auch ich schon sehr früh damit angefangen, meine eigenen Erkenntnisse und Erfahrungen mit meinen Fachkollegen zu teilen. Zum Glück gibt es in unserer Szene nur wenig Konkurrenzkampf – uns vereint das Ziel, mit frei verfügbarem Wissen das Web immer besser zu machen! 2018 Strukturierte CMS-Textproduktion – eine Typologie 2017 Wahlprogramm-Design-CheckUp 2017 2016 BEM für Späteinsteiger 2015 Tablet First – der kesse Kniff für Leute von heute! 2015 Websites sind teurer geworden 2015 Websites sind billiger geworden 2015 Mein kleiner 2015er WordPress-Rant 2014 Die CMS-Landschaft im Jahr 2014 2013 Zur Hölle mit Parallax! 2013 Die immer noch unerträgliche Shopsystemsituation 2012 #webtypobuch [extern] 2011 Apple und sein Skeomorphismus 2009 Interview mit einem CMS-Polygamisten 2009 Killt die Killer-Websites! 2005 Ich bin der Sender – Diplomarbeit zu Podcasting [PDF] 2004 Ein (Sonder-)Zeichen setzen 2004 Bitte Abstand halten 2004 HTML-Schriften unter der Lupe 2004 Der 72-dpi-Mythos"
