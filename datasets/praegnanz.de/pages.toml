full_description = "verbeamter Raum 18. Dezember 2003 Dieses Bild ist einfach zu toll: Gerrit leiht sich einen Beamer von der FH, um ein funky Referat zu halten. Und weil er selbigen natürlich zu Hause ausprobieren muss, kann er ganz entspannt vorgehen und mal eben lässig an der Arbeitszimmerwand im Internet surfen. Cool. Zum Artikel Schwarze Kästen mit klarer Aussage. 8. Dezember 2003 Hier mal eine vollständige Liste der launigen Raucher-Sprüche, die inzwischen 1/3 der Fläche auf Zigarettenpackungen bedecken … Ihr Arzt oder Apotheker kann Ihnen dabei helfen, das Rauchen aufzugeben Rauch enthält Benzol, Nitrosamine, Formaldehyd und Blausäure Rauchen fügt Ihnen und den Menschen in Ihrer Umgebung erheblichen Schaden ... Zum Artikel Nur mal so ... 5. Dezember 2003 Ich sitze gerade auf dem Klo im Victoria Hotel in Freiburg und schreibe diese Nachricht in mein Powerbook. Da ich vollen Empfang im Funknetzwerk des Hotels habe, werde ich diese Nachricht gleich abschicken. dann sehe ich mir noch ein oder zwei Filmtrailer an und checke meine Mail. Zum Artikel Gerrit wieder mit breitem Band im Internet 4. Dezember 2003 Endlich lebe ich wieder online™! Nach über einem Jahr Enthaltsamkeit powered by Analog-Modem nun endlich die »Digitale Unterschriften-Linie« bei Isa und Gerrit. Zwar hat das mit dem Funknetzwerk nicht so richtig geklappt, aber immerhin hängen jetzt PC und Powerbook einträchtig nebeneinander im Router und genießen die 768k... Zum Artikel Wusstet Ihr schon, ... 1. Dezember 2003 ... dass AOL und T-Online die exakt gleiche Warteschleifenmusik verwenden?? Nachdem ich jetzt beiden Providern gekündigt habe (nachdem ich sie einige Wochen kostenlos gemolken habe (Promo-Angebote sei Dank), stellte ich diese erstaunliche Tatsache fest! Zum Artikel"
