["https://praegnanz.de/weblog/2x2-mausbeobachtungen"]
title = "2x2 Mausbeobachtungen | praegnanz.de"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "2x2 Mausbeobachtungen 10. Januar 2009 Neulich ging mal wieder meine Maus kaputt. Und da fielen mir wieder einmal die 2×2 Mausbeobachtungen ein, die ich mündlich stets gerne verkünde. Jetzt auch mal in schriftlicher Form, in garantiert mehr als 140 Zeichen. Die erste Beobachtung: Es gibt zwei Arten von Mausnutzern. Die einen legen die flache Hand komplett auf ihren Digi-Nager und bewegen selbigen durch Bewegen des Handgelenks und des Unterarms. Die anderen Nutzer hingegen klemmen den Mauskörper zwischen Daumen und Ringfinger (bzw. kleinen Finger) und führen kleinere Mausbewegungen lediglich durch Anwinkeln dieser Finger durch. Erst bei weiteren Schiebestrecken wird Handgelenk und Unterarm bemüht. Von der mauserzeugenden Industrie wird zumeist der erste Mausnutzertypus unterstützt – diese ganzen ergonomisch geformten Mäuse, die irgendwie aussehen wie zu lange in der Sonne gelegen, zeigen das deutlich. Und offenbar zurecht: Als Apple es im Jahr 1998 wagte, eine schnuckelige, puckförmige Maus auf den Markt zu bringen, war das Geschrei der Handdinnenflächenaufleger groß! Ich selber hingegen komme damit ja gar nicht klar. Ich liebte die originale iMac-Maus und achte bis heute stets darauf, dass meine Handinnenfläche sich freischwebend über dem Mauskörper befindet. Die zweite Beobachtung: Es gibt zwei Arten von Mauskäufern. Die einen nehmen alle paar Jahre richtig viel Geld in die Hand, so 80 bis 150 Euro, und kaufen sich ein richtiges Mauseschlachtross. Gerne kabellos per Bluetooth oder proprietär, gerne mit geschätzen 37 frei programmierbaren Tasten, natürlich über einen proprietären Schrotttreiber, und gerne von namhaften Firmen wie Logitech oder Microsoft. Falls so eine Maus kaputt geht (und das tun sie natürlich auch), ärgert man sich natürlich sehr, scheut aber nicht davor zurück, Garantie oder Gewährleistung in Anspruch zu nehmen. Immerhin hat man eine Menge Geld hingelegt. Der andere Mauskäufertypus hingegen weigert sich, für seine Maus mehr als 10 Euro auszugeben. Kaputt geht sie ohnehin nach einigen Wochen oder Monaten, und dann kann man schnell zum Conrad oder Saturn wetzen und für Nachschub sorgen. Ein Wegwerfgegenstand – Garantieansprüche auszunutzen lohnt hier erst gar nicht! Tja, was soll ich sagen: Nachdem ich zunächst dachte, ich wäre einer der scheinbar vernünftigeren Premium-Mauskäufer (immerhin hat meine Intellimouse-Explorer über 6 Jahre lang sehr gut funktioniert), bin ich inwzischen ins Billiglager gewechselt. Ich habe gemerkt, dass ich die ganzen Vorteile einer teuren Maus nicht nutzen kann und will. Und nur wegen einer besseren Verarbeitung oder eines hübscheren Designs sehe ich das nicht ein. Als Mauspragmatiker komme ich gut mit meinen 10-Euro-Modellen klar – egal, wie peinlich das manchmal wirken mag. Ach ja, Thema »Zulange in der Sonne« (ab Minute 1:25)"
year_published = 2009
clearnet = "https://praegnanz.de/weblog/2x2-mausbeobachtungen"
tags = ["artikel-fundgrube", "artikel-klassiker", "freefonts", "gerne", "jahrgänge", "maus", "mausbeobachtungen", "nicht", "oder"]
language = "en"
