full_description = "Ab sofort mit prägnanter Startseite 1. Februar 2005 Die meisten werden es schon bemerkt haben: praegnanz.de goes Webportal. Naja, nicht so ganz. Aber es war an der Zeit, auch die anderen wichtigen Bereiche von praegnanz.de, nämlich das Portfolio (welches in Kürze weiter anwachsen wird), und natürlich die Essays noch stärker zu featuren. Und damit fachfremde Besucher nicht gleich von Internet Explorer-Hasspostings oder halbnackten Frauen erschreckt werden, wenn Sie nur ganz harmlos wissen wollten, was dieser van Aaken so für Sachen macht. Das Design der Startseite kann sich selbstverständlich noch ändern, deshalb wäre ein kurzes Feedback von Eurer Seite sehr nett. Ihr kennt das ja: Am Ende findet man seine Entwürfe immer schrottig und super zugleich."
