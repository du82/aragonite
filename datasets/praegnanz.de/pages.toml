full_description = "5 Thesen 6. Juni 2006 Thesen aufzustellen ist in, deswegen hier meine 5 Kernthesen zum Thema Weblogs und Podcasting: Früher: Wenige große Sender mit jeweils vielen Empfängern. Bald: Viele kleine Sender mit jeweils wenigen Empfängern. Folge: Die Publikumszahlen sinken bei den Großen, sie steigen bei den Kleinen. Fazit: Die Kleinen können niemals so viel Publikum haben wie die Großen früher gehabt haben. Aber: Ist überhaupt nicht schlimm, weil zum Ausgleich die Zielgruppe thematisch viel schärfer definiert ist. Eigentlich bestehen meine Vorträge über Podcasting nur daraus, diese 5 Punkte auf 45 Minuten auszudehnen. Naja, so ähnlich."
