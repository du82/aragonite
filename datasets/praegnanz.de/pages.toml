full_description = "BEM für Späteinsteiger 11. November 2016 Es gibt bei uns eine gewisse Tradition, sich erst recht spät mit dem ganzen heißen Scheiß aus der WebDev-Hipster-Toolchain zu beschäftigen. Nachdem ich 2013 den staunenden Kollegen im Working-Draft-Podcast noch berichtete, dass wir außer jQuery quasi keine nennenswerten Frontend-Tools oder -Techniken verwenden, gab es in den letzten drei ... Zum Artikel Kundenmissverständnisse ausräumen leicht gemacht! 2. Oktober 2016 „Haben Sie es schon mal mit F5 probiert?“ ist das “Have you tried turning in off and on again?” für Webdesigner – ich weiß nicht mehr, wie oft ich diesen Satz in den letzten 15 Jahren gesagt habe. Jetzt ist damit Schluss, und ich hätte viel frühe... Zum Artikel Doppelkompression mit Bluetooth-Audio 2. Oktober 2016 Viel ist geschrieben und gesprochen worden über die fehlende Klinkenbuchse des iPhone 7, die Qualität des 9-Euro-Adapters von Apple (der tatsächlich einen eigenen DAC mitbringt), und über die Bereitschaft von Kopfhörer-Herstellern, Lightning-Modelle auf den Markt zu bringen. Alles im Grunde egal, denn die Zukunft scheint freilich Bluet... Zum Artikel Die magische 500 – was steckt dahinter? 29. August 2016 In meinen Gesprächen mit traditionellen Automobilisten höre ich immer und immer wieder die Aussagen, dass man „ab 500 Kilometer Reichweite“ drüber nachdenken würde, sich auch ein Elektroauto zuzulegen. Zum Artikel Mein neuer Bluetooth-Kopfhörer 29. Juli 2016 Und schon wieder ein Hi-Fi-Artikel hier im Webdesign-Blog, aber was soll’s – ich hab früher sogar über Bundeswehr-Essen geschrieben. Und wir sind ja unter uns! Relativ zeitgleich mit Kollege Schlingel-Wölfle habe ich mich die letzten Wochen auf dem Markt für hochwertige Bluetooth-Kopfhörer herumgetrieben, und zwar spez... Zum Artikel"
