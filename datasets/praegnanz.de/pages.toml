["https://praegnanz.de/weblog/killt-die-killer-websites"]
title = "Killt die Killer-Websites! | praegnanz.de"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "Killt die Killer-Websites! 15. Juni 2009 Just als wir dachten, die Profilierungssucht der »kreativen« Zunft wäre endlich teilweise durch Vernunft ersetzt worden, kommt der Deutsche Multimedia Award 2009 daher und prämiert ohne Scham eine Reihe von Websites, die sowas von »kreativ« sind, dass man dabei völlig vergisst, was das eigentlich soll. (Jens Grochtdreis hat sich übrigens just mal die Codequalität angesehen und passende Worte gefunden.) Ebenfalls vor einigen Tagen aufgeschnappt: Die Website der Erfolgsautorin J. K. Rowling (deren Bücher ich übrigens heiß und innig liebe). Hier sieht man einen unaufgeräumten Schreibtisch von oben, dessen Gegenstände jeweils einen Menüpunkt repräsentieren. Wem das alles bekannt vorkommt, der erinnert sich richtig: Vor 15 Jahren waren solche Dinge schon einmal en vogue. Damals gab es die ersten »Multimedia-CD-ROMs«, auf denen man exakt das Gleiche machen konnte – nur dass man sie mit Macromedia Director in 256 Farben umgesetzt hat. Nicht zu vergessen: eingebettete, 200×150-Pixel große QuickTime-3-Movies mit 12 fps. (Screenshot von James Khazar) Seit einigen Jahren lässt sich diese Art von Auftritten problemlos mit Flash umsetzen und dank dicker DSL-Verbindungen über das Netz verbreiten. Als Bibel für diese »kreative« (wie ich das Wort hasse!) Gestaltung gilt das Buch Creating Killer Websites von David Siegel. Aus dem Jahr 1996. Doch bis heute gibt es jede Menge Agenturen, die das Konzept einer komplett aus dem Rahmen fallenden Website sehr engagiert unterstützen. Und insbesondere Filmstudios, Architekten, Fotografen und Games-Entwickler sind sehr anfällig dafür, aus dem grauen, kastigen Schema der biederen, normalen Netzauftritte ausbrechen zu wollen. Und natürlich kann man es verstehen: Wer beruflich kreativ ist, will auch eine kreative Website haben. Schließlich kleidet man sich ja auch kreativ und guckt abgefahrene Filme. Das Problem dabei: Die Website ist nicht für den Betreiber des Angebotes gemacht. Und auch nicht für die ausführende Agentur. Der User muss letztlich die Website bedienen. Und ich schreibe ganz bewusst »bedienen«, nicht »erkunden«, »spielen« oder »erleben«. Und damit nähern wir uns dem Kern des großen Missverständnisses, das streng genommen schon seit Erfindung der Multimedia-CD-ROM existiert: Der Anbieter will den User emotional beeindrucken. Der User aber scheißt auf emotionale Beeindruckung – er will schnell und einfach informiert werden. Die Zeiten, in denen man nächtelang im Netz surfte, um sich von cool gemachten Websites beeindrucken zu lassen, sind vorbei. Die flashlastigen Technik-Demonstrationen, die absichtlich explorativ abwegig gestalteten Navigationslogiken und nicht zuletzt die aufwändigst erstellten Schmuckgrafiken der späten 90er Jahre (=Techno-Barock) locken den modernen Infonauten nicht hinter dem Ofen hervor, weil dieser in erster Linie effizient durchs Netz streift. Effizienz ist unbedingt geboten, denn in der heutigen Fülle von Publikation und Kommunikation, die im Netz stattfindet, ist keine Zeit für Elemente, die Informationen schwerer zugänglich machen. So sehr die abgefahrene Navigationsidee und die berauschende Zwischenanimation das Selbstwertgefühl von Agentur und Kunde auch zu befriedigen vermag – die übliche Lean-Forward-Situation bei der Web-Benutzung lässt Wartezeiten und spielerische Elemente dennoch nicht zu. Warum soll ich 20 Sekunden darauf warten, bis meine Flash-Anwendung geladen ist, wenn eine HTML-Website in 2 Sekunden bereit zum Interagieren ist? Was nützt mir eine Newsrubrik auf einem fotorealistisch anmutenden Notizblock, wenn es keinen Permalink zum Weiterverbreiten der Neuigkeit gibt? Vom Markieren und Kopieren des Textes zwecks Zitat ganz zu schweigen? Doch halt – Gegenfrage: Macht ein vollständig auf Effizienz und Bedienbarkeit getrimmtes Netz nicht alles total kalt und gleich und langweilig? Gibt es nicht schon genug Standard-Websites im Standard-Layout? Gegenantwort – sehr gerne: Natürlich ist im Netz Zeit und Platz für Unterhaltung und Kreativität – sogar mehr denn je! Gucken wir uns einige erfolgreiche Unterhaltungsangebote im modernen Netz an: YouTube, Flickr, Twitter. Ganz abgesehen davon, dass es sich hier um Mitmach-Angebote handelt, ist allen drei Angeboten gemeinsam, dass sie die Kreativität und den spielerischen Faktor nicht etwa durch eine aufwändige äußere Erscheinung erreichen, sondern – großer Trommelwirbel – durch die Inhalte! Ist das nicht ein irres Konzept? So dogmatisch es klingen mag: Eine aufwändige äußere Form ist wertlos, wenn die dahinter liegenden Inhalte belanglos sind. Wenn die Inhalte hingegen hochinteressant sind, lenkt die äußere Form nur unnötig ab. Gute Inhalte brauchen keinen Affenzirkus zur Untermalung, sondern sind ihrer selbst Willen begehrt. Und wollen dann weiterverbreitet werden! Moderne Webplattformen haben das verstanden und nehmen ihren Gestaltungs- und Branding-Willen zurück. Der Fokus geht auf die Substanz. Erfahrende Webanwender (es werden täglich mehr) lassen sich nicht mehr von bunten Glasperlen beeindrucken. Das ist was für Netz-Neulinge und Gelegenheits-Surfer. Und die wiederum werden immer weniger. So verwundert es nicht, dass es keine mir bekannten Webangebote gibt, die über längere Zeit hinweg eine große Menge an Menschen begeistern konnten, welche auf anderen Basis-Techniken basieren als HTML, textbasierten Menüs, übersichtlicher Benutzerführung – und großartigen Inhalten! Ab und zu kommt es ja durchaus vor, dass man von einem Bekannten begeistert auf ungewöhnliche Netzauftritte wie den von J. K. Rowling angesprochen wird. Und was man als Webdesigner denn davon hielte. Supertoll sei das doch, oder nicht? Meine Gegenfrage an den Bekannten ist stets, wie regelmäßig er persönlich denn diese Website besucht und daraus echten Nutzen zieht. Die Antwort – »Bisher nur einmal …« – kann ich mir dann immer schon denken."
