title = "praegnanz.de/weblog/2006"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "Frohes Fest 2006 21. Dezember 2006 Auf einmal kommen sie alle angelaufen und wollen ihre Projekte fertig bekommen. Hätten sie mal vor 5 Wochen kommen sollen, da habe ich mich in der Agentur richtiggehend gelangweilt. Aber kaum naht das Jahresende, da wird noch schnell der Turbo eingelegt und der olle Gerrit darf dann die Daten markuppen u... Zum Artikel (K)ein Schreibtisch 18. Dezember 2006 Stöckchen aufgefangen! Und zur Erläuterung: Zu Hause habe ich derzeit keinen eigenen Schreibtisch, sondern nehme wahlweise am Küchentisch, Wohnzimmer-/Ess-Tisch oder am Schreibtisch meiner Liebsten Platz. Mehr als mein MacBook brauche ich sowieso nicht, und zum Bloggen braucht man keinen Platz. Stöckchen geht weiter an die erst... Zum Artikel Germania omnia divisa est in partes tres 18. Dezember 2006 In unserem schönen Land ist die digitale Spaltung sehr deutlich an den drei verschiedenen DSL-Zonen erkennbar: Das Tal der digitalen Ahnungslosen: Kein DSL verfügbar. Tragisch, aber wahr: Es gibt sowas noch. Das Tal der Telefongefesselten: DSL zwar verfügbar (wenn auch manchmal mit nur halber Geschwindigkeit), aber Telefon-Festnetz-Zwang, um ... Zum Artikel Was ist DOM-Scripting? 17. Dezember 2006 Erstmals veröffentlicht im Webkrauts-Adventskalender 2006. DOM-Scripting ist derzeit wohl eines der heißesten Themen in der Webdesign-Welt. Der Begriff wurde erst in den letzten Monaten durch zahlreiche Blogartikel und mehrere Fachbücher populär. Fast ist man versucht zu glauben, hier wäre eine neue revolutionäre Programmiersprache geboren worden, doch d... Zum Artikel YAML-Buch ist angekommen 14. Dezember 2006 Unglaublich, aber wahr – die Volltextsuche bringt es an den Tag: Ich habe noch niemals über YAML (Yet Another Multicolumn Layout) geschrieben. Jetzt wird es aber Zeit, dass ich mich mit dem CSS-Framework von Dirk Jesse mal ausgiebig beschäftige, denn wenn man schon mal das Galileo-Buch zum Thema als ... Zum Artikel"
