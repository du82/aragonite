["https://praegnanz.de/datenschutz"]
title = "praegnanz.de/datenschutz"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "Datenschutz Verantwortliche Person im Sinne der Datenschutzgesetze ist: Gerrit van Aaken Eichhornstraße 5 97070 Würzburg Grundsätzliches Als Betreiber von praegnanz.de ist es mir wichtig, dass Sie genau erfahren, welche personenbezogenen Daten auf dieser Website erfasst werden, wie diese verarbeitet werden, und wie Sie darauf Einfluss nehmen können. Insbesondere möchte ich betonen, dass ich keinerlei Interesse an Ihren Daten habe. Diese werden nur aus technischen Notwendigkeiten heraus erfasst und gespeichert. Ich halte mich dabei an den Grundsatz der Datensparsamkeit. Hosting und Access-Log praegnanz.de wird derzeit von einem Server des deutschen Hosting-Unternehmens ALL-INKL.COM - Neue Medien Münnich ausgeliefert. Ich habe mit ALL-INKL einen DSGVO-konformen Vertrag über die Datenverarbeitung geschlossen. Jeder Zugriff auf den Server erzeugt bei ALL-INKL einen Eintrag im sogenannten Access-Log. Ich habe jedoch dafür gesorgt, dass die IP-Adresse in diesen Logdateien nicht gespeichert wird, so dass Ihre Zugriffe auf den Server nicht einer bestimmten Person zugeordnet werden können. SSL-Verschlüsselung Selbstverständlich werden die Datenübertragungen zwischen dem Webserver und Ihrem Browser per SSL verschlüsselt. Cookies Auf dieser Website verwende ich das Content-Management-System Kirby. Dieses setzt standardmäßig für jeden Besucher ein sogenanntes Session-Cookie. Es handelt sich dabei um eine kleine Information im Speicher Ihres Browsers, anhand derer der Server in der Lage ist, mehrere aufeinanderfolgende Seitenaufrufe dem gleichen Besucher zuzuordnen. Dieses Cookie wird vom Browser selber wieder gelöscht, sobald Sie ihn schließen. Es handelt sich um lokale Cookies, die auf die Domain praegnanz.de beschränkt sind. Andere Dienste oder Websites haben auf diese Cookies keinen Zugriff. Ich selber werte die Session-Cookies von Kirby nicht aus. Wenn Sie trotzdem keine Cookies gesetzt haben möchten, empfehle ich, in Ihrem Browser die Cookie-Funktion zu deaktivieren. Externe Dienstleister, die beispielsweise über iFrames mit dieser Website verknüpft sind (siehe auch Embeds bzw. Widgets), setzen meist ihre eigenen Cookies, um besser zu funktionieren. Auch dagegen hilft eine entsprechende Einstellung im Browser. Embeds bzw. Widgets Einige meiner Artikel enthalten Inhalte von anderen Webservern, da ich insbesondere für Medieninhalte wie Videos oder Audio-Dateien gerne spezialisierte Anbieter nutze. Die externen Inhalte werden in der Regel über sogenannte iFrames eingebunden, öffnen also eine Verbindung zu den Servern anderer Firmen, die genau diese Dienstleistung bereit stellen. Derzeit gibt es auf praegnanz.de eingebettete Inhalte von: YouTube, LLC, 901 Cherry Ave., San Bruno, CA 94066, USA (siehe deren Datenschutzerklärung) Vimeo, Inc., 555 West 18th Street, New York, New York 10011, USA (siehe deren Datenschutzerklärung) SoundCloud Limited, Rheinsberger Str. 76/77, 10115 Berlin (siehe deren Datenschutzerklärung) Bandcamp, 178 Castro St., San Francisco, CA 94114, USA (siehe deren Datenschutzerklärung) Möglicherweise finden Sie noch einen älteren Blogbeitrag, auf dem ein Widget einer weiteren Firma eingebunden ist. Falls dies der Fall ist, freue ich mich über eine entsprechende Mitteilung und werde die Liste ergänzen. Wenn Sie komplett verhindern möchten, dass Ihre Zugriffsdaten über iFrames auf den Servern anderer Firmen erfasst werden, empfehle ich einen Tracking-Blocker wie uBlock Origin, der sich entsprechend konfigurieren lässt. Statistik und Tracking Ich selber verzichte auf jegliche Form von Webstatistik, Tracking oder Fingerprinting. Es interessiert mich schlichtweg nicht, wer Sie sind, woher Sie kommen, wohin Sie gehen oder wieviele Sie sind. Auskunft, Berichtigung und Löschung Sie haben das Recht, jederzeit Auskunft über Ihre bei mir gespeicherten personenbezogenen Daten zu erhalten. Ebenso haben Sie das Recht auf Berichtigung oder Löschung Ihrer personenbezogenen Daten bzw. Teile davon. Schreiben Sie mir diesbezüglich einfach eine E-Mail an gerrit@praegnanz.de. Beachten Sie, dass beim Empfang dieser Mail personenbezogene Daten in meinem Mailkonto gespeichert werden (siehe nächster Abschnitt). E-Mail und Kommentarfunktion Sollten Sie mit mir Kontakt aufnahmen, insesondere per E-Mail an gerrit@praegnanz.de, werde ich alle Informationen speichern, die Sie mir übersenden. Ich tue dies, um auf Ihre Kontaktaufnahme angemessen reagieren zu können. Direkte E-Mails an mich bewahre ich dauerhaft in meinem Mailkonto. Das Mailkonto zur Adresse gerrit@praegnanz.de liegt auf einem Server der deutschen Firma ALL-INKL.COM - Neue Medien Münnich. Ich habe mit ALL-INKL einen DSGVO-konformen Vertrag über die Datenverarbeitung geschlossen. Änderung der Datenschutzerklärung Ich behalte mir vor, diese Datenschutzerklärung gelegentlich anzupassen, damit sie stets den aktuellen rechtlichen Anforderungen entspricht oder um Änderungen meiner Infrastruktur zu erläutern. Für Ihren erneuten Besuch gilt dann die neue Datenschutzerklärung. Fragen zum Datenschutz Wenn Sie Fragen zum Datenschutz haben, schreiben Sie bitte eine E-Mail an gerrit@praegnanz.de"
