["https://praegnanz.de/weblog/BigiPhone-aktion-wer-gewinnt"]
title = "BigiPhone Aktion: Wer gewinnt? Ich leider nicht ;-) | praegnanz.de"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "BigiPhone Aktion: Wer gewinnt? Ich leider nicht ;-) 19. September 2008 Das BigiPhone ist eine Telefon, welches ich zu gewinnen gedenke. Die Methode der Gewinnung ist zwar moralisch fragwürdig, aber ich war ja nie für meine Verbissenheit bekannt, wenn es um pragmatische Gründe geht. Bei einem kostenlosen iPhone 3G bin ich mit dabei! Hier siegt Gier über Dogmatik. Von daher wundert euch nicht über die Sinnhaftigkeit des nächsten Abschnittes. Definition BigiPhone Es gibt keine. Ebenso fehlt eine Übersetzung, und auch ein heißes Treffen mit dem BigiPhone ist billig. Man kann das Gerät kaufen, sich aber auch schenken lassen. Und wenn man der Meinung ist, genug blöde Stichworte untergebracht zu haben, kann man den Text auf enden lassen. Ich will ja schon immer ein iPhone haben. Aber natürlich will ich keinen Vertrag und schon gar keinen T-Mobile-Vertrag. Von daher ist so ein gewinn für mich eine feine Sache. 13.9.2008 – BigiPhone News: Eigentlich gibt es nix Neues. Aber ich habe mir bei einem Konkurrenten abgeguckt, dass ein paar neuigkeiten hier und da die Seite interessanter machen könnten. An dieser Stelle natürlich in Kürze auch das Ergebnis der ganzen Aktion. Update 16.9.2008 Nachdem Supertopic aus nicht nachvollziehbaren Gründen vom Thron gestoßen wurde, liegt nur noch ein einziger Konkurrent vor mir. Wer sich das als Anlass nehmen möchte, mich in irgendeiner Form zu unterstützen, soll sich keinen Zwang antun. Ewige Dankbarkeit sei euch gewiss. Update 19.9.1008 Aus und vorbei: Das BigiPhone geht an die dunkle Seite der Webworker-Macht, auch wenn praegnanz.de auf der OMD zunächst als Sieger ausgerufen wurde – ein wirklich spannendes Kopf-an-Kopf-Rennen! Ich bedanke mich an dieser Stelle ganz herzlich bei allen Unterstützer. wer mag, kann die Links auf meine Website nun wieder entfernen. Ich muss sagen, dass ich wieder einmal sehr stolz bin, so großartige Leser zu haben!"
year_published = 2008
