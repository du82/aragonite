full_description = "Guten Tag! Ich heiße Gerrit van Aaken und baue seit über 25 Jahren Websites und Webapplikationen. Sie können mich als Freelancer für interessante Aufträge anfragen. Meine Kernkompetenzen sind: Screendesign und Typografie Frontend-Entwicklung mit HTML & CSS (auch Tailwind) Content-Management-Systeme (Kirby und ProcessWire) Web-Apps und Mobile Apps mit Vue, Nuxt und Capacitor Die Bereiche Strategie, Marketing und SEO überlasse ich gerne den Kollegen – ich bin primär Gestalter und Techniker und arbeite in meinem Home-Office in Würzburg. Nach der Arbeit kümmere ich mich leidenschaftlich um meine beiden kleinen Kinder. Aktuelle Beobachtungen und Impulse veröffentliche ich auf Mastodon, wo ich unter @gerritvanaaken@typo.social meinen Followern auf die Nerven gehe. Ein GitHub-Konto habe ich natürlich auch, nutze es aber leider zu selten. Meilensteine 1996 Website für Musikprojekt Skydancer 2000–05 ZDF – Online-Redaktion Wetten, dass..? 2000–05 Hochschule Mainz – Diplom-Designer (FH) 2005 Loudblog – weltweit erstes Podcasting-CMS und meine Diplomarbeit 2005–07 3st kommunikation, – Projektleiter Webdesign 2007–12 soloselbstständiger Webdesigner 2007–10 Hochschule Darmstadt – Gastdozent 2007–18 Zürcher Hochschule der Künste – Gastdozent Typografische Gesellschaft München – Kursleitung 2009–12 Undsoversity – Videoworkshops zu diversen Webdesign-Themen 2012 #webtypobuch – Fachbuch zur Webtypografie im Eigenverlag 2012–16 van Aaken & Bräunlich GbR – Gesellschafter, Frontend-Entwickler 2016–21 whitespace GmbH – Geschäftsführer, Frontend-Entwickler seit 2022 soloselbstständiger Web- und Appentwickler Referenzen"
