title = "Wahlprogramm-Design-CheckUp 2017 | praegnanz.de"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "Wahlprogramm-Design-CheckUp 2017 19. August 2017 Es ist wieder soweit – die Wahlprogramme der Parteien zur Bundestagswahl müssen analysiert und verglichen werden. Allerdings selbstverständlich nicht inhaltlich, sondern nach typografischen Gesichtspunkten. Starten Sie Ihren PDF-Viewer und los geht’s! Zunächst jedoch ein paar Aspekte, die ich im Vergleich zur 2004er-, 2005er- und 2009er-Edition dieses Artikels für erwähnenswert halte. Auch wenn alle Parteien nach wie vor ein Hauptdokument im PDF-Format anbieten, so existiert inzwischen eine Vielzahl von Darreichnungsformen, die dem realen Konsum der Inhalte sehr viel mehr entgegen komme als das sperrige 150-Seiten-Büchlein, das sich nur echte Idealisten und ungewöhnlich engagierte Sozialkundelehrer durchlesen werden. Es gibt Zusammenfassungen von 1 bis 10 Minuten Leselänge, Versionen in einfacher Sprache, EPUBs für E-Book-Reader, vorgelesene Audiodateien und natürlich hunderte von Sharepics mit den Kernthesen. Miniwebsites zum bequemen Navigieren machen den Einstieg in die Lieblings-Themen einfach. Endlich ist den Wahlkämpfern klar geworden, dass die Menschen heutzutage an Bildschirmen jeder Größe Inhalte lesen und bieten passende Formate an. Großes Lob für diese mediendiverse und Barrieren abbauenden Entscheidungen! Dennoch wollte ich aus Gründen der Tradition und der Vergleichbarkeit nur das ungekürzte, vom Parteitag abgesegnete Dokument betrachten, und zwar von allen sechs Fraktionen, die eine realistische Chance auf 5% bei der Bundestagswahl im Herbst haben. Und ich sage es gleich dazu: Ja, ich halte die AfD aus inhaltlichen Gründen für einen echten Schandfleck in dieser Reihe! Ich werde dennoch ihren demokratisch erarbeiteten Erfolg respektieren, während ich gleichzeitig auf anderen Kanälen ihre Inhalte und Protagonisten mit voller Verve rhetorisch bekämpfe! CDU/CSU Download als PDF Merkel strengt sich nicht einmal mehr an, so geht das Mantra der vergangenen Tage. Und das „Regierungsprogramm“ bzw. #fedidwgugl getaufte Wahlprogramm der CDU/CSU ist eine direkte Entsprechung dieser Geisteshaltung. Es hat noch nicht einmal für Doppelseiten gereicht. Das 76-seitige PDF kommt als DIN-A4-Einzelseiten-Textwüste daher, enthält nicht eine einzige Abbildung, dafür gelangweilte Standard-Formatvorlagen in der CDU-Hausschrift Kievit (immerhin nicht Arial). Das PDF wurde mit Word 2000 erstellt, wahrscheinlich auf dem virenbefallenen Windows-XP-Rechner des GF-Sekretärs. (Der letzte Halbsatz ist allerdings spekulativ.) In seiner formatvorlagigen Schlichtheit sind keine allzu groben Fehler erkennbar: Abstände, Größenverhältnisse und Lesbarkeit passen soweit. Einzig der linke Einzug der zahlreichen Bullet-Points ist zu groß, und der vertikale Abstand zur Seitenzahl zu klein. Das Titelbild ist blau hinterlegt, im angedeuteten neuen Corporate Design der CDU, aber sehr gemäßigt – immerhin ist die bayerische CSU ja irgendwie zu einem Sechzehntel an diesem Dokument beteiligt. Note 4– SPD Download als PDF Die SPD hält auch nichts von Abbildungen im Innenteil Ihres optimistisch „Regierungsprogramm“ getauften Dokumentes, aber es ist etwas mehr Gestaltungswille vorhanden als bei der CDU. Die Sozen-Agentur nutzte InDesign CC 2017, wir erblicken Doppelseiten, und wir haben das rote Quadrat an verschiedenen Stellen: zum einen als Bullet-Points, zum anderen als neckisches Daumenkino rechts oben, wo es einen animierten Ladebalken oder Fortschrittsanzeiger mimt. Verstehste? Fortschritt! SPD! Da war mal was! Warum die SPD nach Futura in den Neunzigern, TheSans in den Nuller- und Zehnerjahren nun auf die Neutralität der Neuen Helvetica setzt (und zwar konsequent), ist nicht ganz klar ersichtlich. Eine ironische Hipsternutzung dieser Schrift kann es irgendwie nicht sein. Ich verstehe es nicht: Die Helvetica hat nichts Kämpferisches oder Progressives, sie ist einfach nur Standard. Eine schwache Botschaft des Herausforderers! Immerhin wird im Fließtext der Blick auf fettgedruckte Schlagwörter gelenkt, die das Lesen auflockern. Note 3 FDP Download als PDF Die FDP sieht sich gemäß ihres Wahlkampf-Designs als progressive „Kursiv“-Partei. Da Ungeduld die Tugend der Stunde ist, haben sie scheinbar keine Zeit für eine mega-sorgfältige und ausgewogene Gestaltung investiert, sondern rotzen ihre Kernaussagen und Claims dahin, von der Ungeduld getrieben, in den Basis-Druckfarben Magenta, Cyan und Gelb. So soll es vielleicht ein bisschen wirken. Das Programm der Lindner-Partei ist in dieser modernen Rumpeligkeit gesetzt, die man nur mit viel Coolness hinbekommt. Der Fließtext mit zu engem Zeilenabstand in der Scheißdrauf-Calibri, die Einschübe in einer zu fetten DIN-Schrift in kursiv, nicht mal für die Lizenz einer feingeschliffenen DIN Next hat es gereicht. Das Dokument ist mit 158 DIN-A5-Seiten alles andere als kurz, wird aber durch einige Diagramme aufgelockert. Aber: Es sieht halt leider geil aus! Lässig und kraftvoll, ein kleiner Affront gegen das Beständige und – in diesem Falle – die reine typografische Lehre. Zu verlieren hat die FDP bekanntlich nichts. Mit ihrer Kampagne und diesem Wahlprogramm kann sie punkten! Note 1 Die Linke Download als PDF Müssen Sozialisten immer soviel schreiben? Die Linke gewinnt mit 480.000 Zeichen das Rennen um das ausführlichste bzw. geschwätzigste Wahlprogramm. Das Layout ist seit 2009 übrigens unverändert: eine schmale Corporate S – ach, diese Ironie! – in zwei engen Spalten, alles etwas zu gedrungen gesetzt. Dennoch insgesamt gut lesbar dank DIN-A5-Doppelseiten mit Flattersatz und guter Struktur. Die Bullet Points sind nicht mit einem Einzug versehen, was sie besser in den Text integriert. Ungewöhnlich, aber für diese Art von Texten wohl sinnvoll. Bei der CDU sieht man, dass es andersrum doof aussieht. Auch die Linke verzichtet auf Abbildungen jeglicher Art. Die Titelseite könnte auch ein Plakat sein. Keine Überraschungen von links, die Konzentration auf den Inhalt sei ihnen gegönnt. Und der Kontrast zur FDP ist dieses Jahr mehr als deutlich. Eine Besonderheit: Nach dem Index finden sich jede Menge Call-To-Actions: Spendenaufrufe, Beitrittsformulare, SEPA-Antrag usw. Note 2– Die Grünen Download als PDF Die Grünen haben das Layout ihres Parteiprogramms seit 2005 nicht mehr geändert. Das sind inzwischen zwölf Jahre! Lediglich die Schrift wird anscheinend immer wieder der aktuellen Kampagne angeglichen, so haben wir es mit der Mac-Systemschrift PT Sans im Fließtext und dem Freefont Arvo in den Headlines zu tun. Das Doppelseitenlayout wird von allen Seiten eingerahmt: Themenheadlines, Striche, graue Kästchen, insgesamt wirkt das leider etwas unruhig und der eigentliche Text kann sich nicht souverän ausbreiten. Der Blocksatz und der Verzicht auf Bullet-Points führt zu bemerkenswert gleichartigen Seitenansichten, über sage und schreibe 248 abbildungslose DIN-A5-Seiten. Einzig die grau hinterlegten Zusammenfassungen lenken den Blick, sind aber mit zu geringem Innenabstand keine Augenweide. Die angeblich so progressive Partei bleibt vom Layout her in den späten Neunzigern stecken. Hier wäre mit der richtigen Agentur wesentlich mehr drin gewesen! Note 3– Die AfD Download als PDF Die Wahl der fetten Futura als rumpeliger Hingucker für die AfD funktioniert stilistisch sehr gut, ist aber auch schrifthistorisch interessant. Einerseits klar: Futura = Zukunft, passt immer – war ja auch lange Zeit SPD-Hausschrift. Andererseits stammt die Futura aus dem Jahr 1927, und das finden die völkischen Spinner in den AfD-Reihen bestimmt ausgesprochen schicklich. Die AfD hat sich für das ungewöhnliche Querformat entschieden, was das Durchblättern der gedruckten Fassung sperrig macht, aber auch einen selbstbewussten und hochglanzkatalogigen Touch hat. Die Powerpoint-Anmutung wird unter anderem auch durch die vollformatigen Thementrennerseiten verstärkt, die ich aber als Atempause ganz angenehm finde. Die Doppelspalten im Fließtextbereich sind dann wieder relativ standardisiert gestaltet: Georgia als blutleere Brotschrift, etwas unsouveräner Umgang mit den vertikalen Abständen, aber im Großen und Ganzen okay. Ein typografischer Kardinalfehler hingegen: Die AfD benutzt sowohl eine Leerzeile zwischen den Absätzen, als auch einen Einzug am Anfang jedes Absatzes. Es ist aber nur eine der beiden Maßnahmen sinnvoll, nie beide zusammen! Die großzügigen Weißflächen um die Textblöcke herum erfüllen ihren Zweck, wären auf der Doppelseite spiegelbildlich angeordnet noch schöner, täuschen aber auch nur unzureichend darüber hinweg, dass das Programm mit 140.000 Zeichen nur ein Viertel des Umfangs einnimmt, den die Linke oder die Grünen zu bieten haben. Note 2– Bemerkung Auch wenn man die eine oder andere Tendenz zu erkennen glaubt – die Gestaltung der Wahlprogramme hat nichts mit der täglichen Arbeit der Parteien zu tun. Bitte wählt um Gottes Willen nicht auf Basis dieser kleinen scherzhaften Beurteilung! Hinweis: ich bin seit fast zehn Jahren Mitglied der Grünen und habe 2009 aus Lust und Laune das Wahlprogramm der Piraten gestaltet."
