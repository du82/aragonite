["https://praegnanz.de/weblog/3-zusammenhangslose-gedanken-zum-webdesign"]
title = "3 zusammenhangslose Gedanken zum Webdesign | praegnanz.de"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "3 zusammenhangslose Gedanken zum Webdesign 13. November 2009 1) Bei den Flash-Killerwebsites hat der Designer die volle Kontrolle über die Präsentation der Inhalte. Bei gut gemachten HTML-Websites hat sie der User. 2) Wenn ich eine grottenschlecht gestaltete Website verschönern sollte und dafür nur eine Viertelstunde Zeit hätte, würde ich immer damit beginnen, alle Außen-, Innen- und Zeilenabstände zu verdoppeln. Ein billiger Trick, der fast immer erstaunlichen Erfolg hat. 3) Zwei der wichtigsten Fähigkeiten eines Webdesigners, speziell in der Screendesignphase, sind Menschenkenntnis und ein gutes Gespür für Milieus. Nur wer seine Kunden und deren Branchen schnell und realistisch einschätzen kann, wird treffende Entwürfe abliefern können, die bei allen Parteien Gefallen finden."
