full_description = "14 Mal werden wir noch wach! 14. August 2007 Ende August ist endlich, endlich Bescherung: Cameron Moll wird am 28.8. sein lange in Arbeit befindliches Buch über Mobile Webdesign als PDF auf dem Markt erscheinen. Ich freue mich schon seit Monaten auf das Werk, weil ich mich ganz gezielt in dieser Richtung weiterbilden möchte. Mobiles Webdesign ist meines Erachtens langsam überreif, um endlich wirklich tatsächlich und in echt Mainstream zu werden. Und da simma dabei, wenn’s ums kompatible Umsetzen geht, gelle? Also: Sogar ohne eine einzige Zeile davon gelesen zu haben: Kaufbefehl, denn dem guten Cameron kann man vertrauen, vertraut mir!"
