["https://praegnanz.de/weblog/70-jahre-fernsehen-in-deutschland"]
title = "70 Jahre Fernsehen in Deutschland | praegnanz.de"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "70 Jahre Fernsehen in Deutschland 3. Februar 2005 Und wieder ein Kulturtipp! Ab dem 12. Februar gibt es in Wiesbaden fünf Wochen lang die Ausstellung »20:15 – 70 Jahre Fernsehen in Deutschland«. Konzipiert und veranstaltet wird dieses kostenlose Kulturereignis von Studierenden der FH Mainz und FH Wiesbaden. Die Themen der Ausstellung reichen von der Entstehung der Fernsehtechnik und der Olympiade 1936 als dem ersten medialen Großereignis über TV im Krieg und Fernsehen als Massenmedium bis hin zu Unterhaltungsshows und Werbefernsehen sowie der Entwicklung zum Spartenfernsehen in den 90er Jahren. Ausnahmsweise war ich selber nicht an diesem Großprojekt beteiligt, da ich mit dem Schreiben von Blogeinträgen genug zu tun hatte. Dennoch empfehle ich Euch aufs Allerschärfste, mal in Wiesbaden Unter den Eichen vorbeizugucken – es lohnt sich! Und für einen kleinen Vorgeschmack zieht Euch den Kinotrailer rein: Hochprofessionell produziert von meinen Kommilitonen von dropout films, die mit diesen 50 Sekunden einen echten Knaller abgeliefert haben, den ich gerne auf meinem Server spiegele, da die offizielle Website zur Ausstellung leider ein ziemlicher Fehlschuss geworden ist. Link: sevenload.com"
