["https://praegnanz.de/weblog/10-euro-fuer-die-opfer-der-flutkatastrophe"]
title = "10 Euro für die Opfer der Flutkatastrophe | praegnanz.de"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "10 Euro für die Opfer der Flutkatastrophe 30. Dezember 2004 Wahrscheinlich wird jeder von uns 10 Euro übrig haben. 10 Euro sind für uns fast nichts, ein paar Bier oder ein Kinobesuch. Doch für die, von einer potentiellen Seuche und Hunger betroffenen Kinder in den Flutgebieten Sri Lankas sind sie lebensrettend. Deshalb spendet diesen kleinen Betrag an die Kindernothilfe. Die Kindernothilfe ist seit 1976 in Sri Lanka, und dort vor allem an der Ostküste stark vertreten. Der Verein trägt das Spendensiegel des Deutschen Zentralinstituts für soziale Fragen (DZI) in Berlin für einen seriösen Umgang mit Spendengeldern. Spenden können auf der Internetseite der Kindernothilfe auch online getätigt werden. Dieser Aufruf wird von Alexandra Labudda, kbbu.de Manuela Hoffmann, pixelgraphix.de Vladimir Simovic, perun.net Kai Horlbeck, horlbeck.info Max, unblogbar.com Nick Blume, nickblume.de mitgetragen. Übrigens: Der Finanzdienstleister AWD verdoppelt jede Spende, die unter dem Stichwort Seebeben auf dem Konto der AWD Stiftung Kinderhilfe eingeht. Das Geld wird vollständig dem Verein Kindernothilfe e.V. zur Verfügung gestellt. Diesem Aufruf schließen sich andere Mac-Seiten ebenfalls an. Bitte unterstützen Sie die Bemühungen der Hilfskräfte, auch mit Kleinbeträgen ist geholfen."
year_published = 2004
