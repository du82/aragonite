["https://praegnanz.de/weblog/1-juli-ist-11-tag"]
title = "1. Juli ist 1&#38;1-Tag | praegnanz.de"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "1. Juli ist 1&#38;1-Tag 23. Juni 2005 Nun habe ich schon angefangen, darüber zu bloggen, dann ziehe ich’s auch durch. Das nächste 1&1-Werbeposting steht an! Nee, ich kriege kein Geld dafür, wie beispielsweise Herr Preidel ;-) Aber das Problem war ja für mich, dass Bestandskunden bisher nicht von dem tollen City-Flat- oder Deutschland-Flat-Angebot profitieren konnten. Mischkalkulation eben. 1&1 musste nur erst erstmal die Supersauger loswerden, die ihnen die Bilanz versauen, doch jetzt kann’s losgehen. Als ich neulich im Conrad Batterien gekauft habe, waren zwei verzweifelte Herren von 1&1 neben der Kasse abgestellt, um Kundenakquise zu betreiben. Da ich schon Kunde bin, nutzte ich die Gelegenheit für einen kleinen Plausch. Dabei erfuhr ich, dass definitiv am 1. Juli alle Bestandskunden von 1&1 DSL die Möglichkeit erhalten, zur City-Flat bzw. Deutschland-Flat zu wechseln. Einfach ins Control Center einloggen und den Wechsel in Auftrag geben. Na, das sind doch mal gute Neuigkeiten :-) Nachtrag: Offensichtlich kann man wirklich schon ab sofort wechseln. Der Wermutstropfen: Für die 1.024er Verbindung fällt ein Bereitstellungspreis von 99 Euro an. Die 2.048er ist davon nicht betroffen. Bei 4 Euro mehr Grundgebühr und einer Laufzeit von 12 Monaten rechnet sich das aber prinzipiell …"
year_published = 2005
