["https://praegnanz.de/weblog/ab-morgen-digital-glotzen"]
title = "Ab morgen digital glotzen | praegnanz.de"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "Ab morgen digital glotzen 3. Oktober 2004 Morgen ist es soweit und wir Mainzer, Wiesbadener und Frankfurter können sich am digitalen TV-Genuss über DVB-T laben. Los geht’s mit ARD, ZDF, zwei Dritten und einigen obskuren öffentlich-rechtlichen Bonuskanälen. Ab 6. Dezember dann die volle Kanone an privater Fernsehunterhaltung über DVB-T, die analogen Sender werden abgeschaltet. Kann ich zwar fast nicht glauben, dass alle Schlafmützen, die es bis dahin nicht gebacken bekommen haben, sich eine Decoderbox zu kaufen, auf ihre Lindenstraße verzichten müssen, aber nun ja. Wie ist das eigentlich mit den Sozialhilfe-Empfängern? Werden die nun genötigt, sich auch einen Decoder zuzulegen? Oder bekommen sie einfach einen Einkaufsgutschein? TV-Empfang gehört ja irgendwie zu den Menschenrechten in Deutschland. Weiß da jemand was?"
year_published = 2004
