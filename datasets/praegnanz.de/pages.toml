["https://praegnanz.de/weblog/interview-mit-einem-cms-polygamisten"]
title = "Interview mit einem CMS-Polygamisten | praegnanz.de"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "Interview mit einem CMS-Polygamisten 7. Dezember 2009 Im Folgenden veröffentliche ich weltexklusiv das neueste Interview, welches ich vor einigen Minuten in meiner Wohnung mit mir geführt habe. Ich sitze ganz entspannt auf meinem Kramfors-Sofa, während ich diese Zeilen schreibe – von Star-Allüren keine Spur. So lässig und geerdet habe ich mir den berühmten Webdesigner nicht vorgestellt, aber ich bin positiv überrascht. Und schon geht es los: praegnanz.de: Warum gibt es eigentlich so viele Content-Management-Systeme? Ist das wirklich notwendig? Man verliert so leicht die Übersicht! Gerrit van Aaken: Warum gibt es so viele Weine? Den Spruch habe ich von Adrian Frutiger geklaut, aber er passt eben nicht nur auf Schriftarten. Aber es ist wahr: Manchmal ist Vielfalt gut, und bis zum dem Zeitpunkt, an dem es das perfekte, kostenlose, sichere und schnelle CMS gibt, kann ich gut mit verschiedenen Systemen leben. Ich verrate Ihnen aber gleich, dass dieser Zeitpunkt nie kommen wird. Wie entscheiden Sie sich bei einem Projekt für das richtige CMS? (grinst amüsiert) Nun ja, nicht in allen Fällen hat man die Wahl: Oftmals bringt der Kunde bereits eine Begeisterung für WordPress mit, die ich ihm nicht ausreden möchte, denn wenn jemand bereits mit einem CMS vertraut ist, sollte man diese Situation ausnutzen. Das erspart die Schulung und die eine oder andere Erklärungsnot, wenn beispielsweise das eigene Lieblings-CMS eine schlechtere Bildergalerie-Funktion besitzt als WordPress. Falls ich jedoch die Wahl habe, müssen im Vorfeld einige Faktoren abgeklärt werden. Man sollte wissen, was der Kunde mit seiner Website eigentlich genau vorhat. Am wichtigsten ist dabei immer die Einschätzung darüber, wie sehr der Kunde lügt, wenn er behauptet, dass er die Inhalte selber pflegen möchte. (grinst breiter) Die meisten Kunden belügen sich da in erster Linie selber und fassen die Website nach dem Launch de facto nicht mehr an. Das ist zwar schade, aber bei der Wahl des CMS wichtig zu wissen. Denn dann nimmt man lieber eines, das entwicklerfreundlich ist wie MODx oder Drupal. Kann man glaubhaft davon ausgehen, dass viel gepflegt wird, und dass man es auch von Laien bedient werden können muss, kann beispielsweise TypoLight nicht schaden… Na, jetzt lehnen Sie sich aber weit aus dem Fenster! Sie haben doch noch kein einziges Projekt mit TypoLight durchgeführt … Gerrit van Aaken: Das mag sein, aber dank der hervorragend gemachten Website und den schicken Demovideos kann ich mir ein gutes Bild von dem System machen. Mir gefällt das aufgeräumte Backend und die laienfreundliche Bedienung. Und je länger ich drüber nachdenke, desto besser gefällt mir das Paradigma mit den Artikeln und Seiten. Das müssen Sie mal näher erläutern! Gerne. Viele CMSe arbeiten nach dem Prinzip: 1 Editiermaske für 1 statische Seite. Doch TypoLight teilt eine Seite noch zusätzlich in unterschiedliche Abschnitte auf, die »Artikel« genannt werden, was ein selten bescheuerter Name ist. Artikel können unterschiedlichen Typs sein: Neben »Textabschnitt« beispielsweise auch »Bildergalerie« oder »Bild- und Textkonstrukt«. Ich fand das lange Zeit zu umständlich zu pflegen. Aber wenn man Netzauftritte mit komplizierteren Inhalten zu bauen hat, kann es hilfreich sein. Denn nicht jeder Kunde findet es super, wenn er beim Bearbeiten einer Seite eine einzige ellenlange Textarea vorfindet, in der alle unterschiedlichen Abschnitte eingefügt werden müssen. Witzigerweise gibt es auch bei Drupal ein pfiffiges Modul namens »Panels«, das dieses »Eine-Seite-besteht-aus-mehreren-Abschnitten«-Paradigma aufgreift und recht elegant umsetzt. Aber hier reden wir eher von sorgfältig komponierten Einzelseiten, die in einer durchdachten Hierarchie angeordnet sind, oder? Ja sicher, dafür ist TypoLight super. Aber je mehr es sich um iterative, datenstromartige Inhalte dreht, desto mehr bietet sich Drupal an. Immer, wenn die hierarchische Darstellung im Hintergrund steht und man flexible Auflistungen von großen Datensammlungen stemmen muss, kommen CCK und Views als die wichtigsten Drupal-Module ins Spiel. Mittels CCK (Content Construction Kit, d. Red.) kann man sich beliebige Inhaltstypen zusammenschrauben, die dann flach in der Drupal-Datenbank liegen. Mittels Views lassen sich dann die abgefahrensten Abfragen zusammenklicken, um jede Art von Datenlisten zu erstellen, die man benötigt. Katalogartige Strukturen, Blogs, Mitgliederverzeichnisse – das alles ist Drupal-Heimspiel! Klingt ganz schön datenbanklastig … Ist es auch. Drupal ist vielleicht das CMS mit dem stringentesten Konzept, weil die Basis der Datenspeicherung so unglaublich flach und simpel ist. Daraus erwächst eine irrsinnige Flexibilität, die man aber nur nutzen kann, wenn man große Mengen von Modulen installiert. (spricht schneller und wird leicht rot) Und da wird es leicht unübersichtlich, denn die Wahl des falschen Moduls kann ein ganzes Projekt in die falsche Richtung laufen lassen. Und so richtig, richtig einfach ist Drupal nicht zu bedienen. Es sind keine Standard-Workflows vorgegeben, es gibt keine »richtige« Methode, Dinge zu tun, sondern immer ein Dutzend Möglichkeiten. Konventionen muss jeder für sich selber finden. (holt tief Luft) Aber eins ist beruhigend: Drupal dürfte eines der zukunftssichersten CMSe sein, durch die Unterstützung von Google, dem Weißen Haus und diversen anderen fetten Projekten mache ich mir keine Sorgen. Und ich mag es, dass jedes Major-Release die Brücken konsequent abbricht und Altlasten hinter sich lässt. Drupal 7 wird nicht kompatibel mit Drupal 6 sein, na und? Dafür wird es halt auch viel geiler! Das sollte WordPress auch mal durchziehen! Sie landen immer wieder bei Ihrer Hassliebe WordPress, hab ich Recht? (rollt mit den Augen) Ach, da sagen Sie was! Schrecklich ist dieser ambivalente Zustand. Ich liebe es, dass ich einen HTML-Dummy in zwei Stunden komplett in ein dynamisches WP-Theme verwandeln kann. Und die Kunden verstehen das Backend auch nach sehr kurzer Schulungszeit. Aus pragmatischer Sicht ist WordPress demnach sehr effizient. Aber mich kotzt dieser Featurewahn an, und dass die Software immer fetter wird, wie eine gemästete Weihnachtsgans: Viel Fett sorgt für viel Geschmack, aber irgendwann schlägt es um und es wird einem speiübel. WordPress ist zu träge, zu unsicher und zu chaotisch. Die Plugins sind teilweise von grauenhafter Qualität, ständig muss man Updates einspielen, die dann oftmals nichtmal korrekt ausgerollt werden, oder schlicht nicht funktionieren. Die Freude über die schnell und unkompliziert zusammengeschusterte Website weicht sehr schnell der Ernüchterung über einen trägen und halb-kaputten Live-Betrieb. Wenn Sie seriös arbeiten – und davon gehe ich aus – dann dürften Sie also keinerlei WordPress-Dienstleistungen anbieten. (wird nervös) Sagen wir mal so: Ich versuche, es zu vermeiden, wo es geht. Aber wie oben schon angedeutet: Wenn WordPress als CMS schon gesetzt ist, aus welchen Gründen auch immer, wehre ich mich nicht dagegen, Themes zu bauen und Plugins zu reparieren. Man kann ja auch Schadenbegrenzung betreiben und zumindest auf ein Mindestmaß an professioneller Umsetzung achten, im Rahmen der Möglichkeiten. Sie winden sich! Okay, ich geb’s zu: Klar biete ich WordPress an. Wäre blöd, wenn ich’s nicht täte: Ich bin ganz gut darin, und es gibt einen großen Markt dafür. So einfach ist das! Aber warum reden wir nicht über MODx? Das ist ein besseres Thema! Ich tue mal so, als ob ich dieses dreiste Ablenkungsmanöver nicht bemerken würde und frage Sie, warum sie das nicht gerade besonders bekannte CMS namens MODx so sehr bewerben! (mit ironisch-gespielter Begeisterung) Gut, dass Sie fragen, denn das ist ein interessantes Thema! Nein, im Ernst: Ich habe MODx in mein Herz geschlossen, weil es in meinem Verständnis eine Art »Textpattern mit Typo3-Seitenbaum und Drupal-Inhaltstypen« ist, also das beste aus mehreren CMS-Welten vereint: Die Schnelligkeit und das Template-System liebe ich in ähnlicher Form seit Jahren an Textpattern. Der globale Seitenbaum als fundamentaler Speicherort für alle Inhalte ist zwar bisweilen auch unpraktisch, aber für 80 Prozent der Websites ein enorm naheliegendes und einfach zu begreifendes Konzept. Und nicht zuletzt die Möglichkeit, dem Redakteur beliebige Kombinationen benutzerdefinierter Felder zur Verfügung zu stellen, die sogar dynamisch an Datenquellen angebunden werden können, macht Spaß. Welche Arten von Websites sind für Sie typische MODx-Angebote? Das ist ein weites Feld, da würde ich gerne eher nach dem Ausschlussprinzip arbeiten: Wer mit MODx liebäugelt, sollte keinen hochfrequenten Blog planen, auf ein ausgefeiltes Bildermanagement mit Metadaten verzichten können, und er sollte ein bisschen Spaß am Schrauben haben, denn damit macht MODx dreimal soviel Spaß. Wer nur die Basisfunktionen nutzt, kann zwar auch schicke Websites bauen, aber es ist Potenzial da für viel mehr schicke Spielereien. Das behaupten alle Systeme von sich! Das trifft auch auf alle zu! Aber bei MODx sind die meisten Anforderungen stets einfach und schnell gelöst, während Drupal immer anstrengend ist nichts mal von alleine flutscht. MODx macht mehr Spaß. Aber so richtig vergleichen kann man die beiden Systeme auch wieder nicht. Womit betreiben Sie eigentlich Ihre eigene Website? Ich habe mich umgesehen: Sie bieten ja Ihre alten praegnanz.de-Designs als WordPress-Themes an … Ja, viele Leser denken deshalb, praegnanz.de wäre auf Basis von WordPress gebaut, ist es aber nicht. Ich nutze seit 2004 Textpattern und bin hochgradig zufrieden, weil es mich mit nervigen Sicherheits-Updates und kaputten Plugins in Ruhe lässt, und ich mich voll auf den Inhalt konzentrieren kann. Dafür fehlen doch die elementarsten Funktionen eines Blogs: kein Trackback, kein Spamfilter … (lacht) Sie kennen sich wirklich nicht so gut in der Blogosphäre aus! Seit wann ist denn Trackback bitteschön ein sinnvolles Feature? Von mir aus kann das sofort sterben anstatt permanent die Ästhetik des Layouts und den dialektischen Fluss der Kommentare zu stören. Und was den Spamfilter angeht: Dank des obligatorischen Preview-Zwangs sind Textpattern-Weblogs fast gar nicht von automatischen Spam-Attacken betroffen. Ich bin ganz froh, dass ich nicht meinen gesamten Kommentardatenverkehr über den Akismet-Service der Firma Automattic leiten muss. Wenn es etwas über Textpattern zu meckern gibt, dann ist es das ausschließlich globale Bilder- und Dateimanagement, sowie das etwas altbackene Standard-Backend-Design. Na, das sind doch mal klare Anweisungen! Würden Sie also für Weblogs immer Textpattern empfehlen? Für Weblogs und für sehr kleine Websites mit weniger als 15 Einzelseiten, ja. Wenn man allerdings merkt, dass der Kunde ein sehr engagierter Blogger werden möchte, der sich für technische und kommunikative Spielereien begeistern kann und jeden Bloggertrend mitmachen möchte, sollte man vielleicht doch zu WordPress übergehen, denn da kann man sich mehr austoben, was Features angeht. Wer vor allem seine Inhalte in den Vordergrund stellen will, weiß genau, was er an Textpattern hat. Movable Type ist tot, oder? Ja. Aber man sollte als drittes wichtiges Blogsystem Serendipity nicht vergessen, das einen guten Ruf hat und ebenfalls zu Unrecht im Schatten von WordPress steht. Bisher haben Sie es auch geschickt vermieden, über Expression Engine, TYPO3 und SilverStripe zu reden… Und Sie wollen ein echter CMS-Polygamist sein? (leicht erregt) Oh, der feine Herr Interviewer erhebt Anspruch auf Vollständigkeit! Vergessen Sie’s! Niemand kann sich zu allen verfügbaren Systemen qualifiziert äußern! Ist ja gut. Vielleicht ein kurzes Statement? Ich habe auch noch Redaxo, Joomla und CMS Made Simple auf meiner Liste. (resigniert brummend) Gut, aber ich kann hier nicht aus erster Hand berichten, sondern geben nur die Klischees wieder, die so im Netz schwirren! Joomla gilt als CMS für Minigolfvereine, CMS Made Simple ist für die ganz blutigen Laienkunden gedacht, aber in dieser Hinsicht gar nicht mal übel. Redaxo besitzt wohl einen recht fundamentalistischen Ansatz, der sehr flexibel ist und vor allem bei Programmierern gut ankommt. TYPO3 ist für 99 Prozent der vorstellbaren Projekte zuviel des Guten, kann aber bei sehr, sehr großen Projekten hilfreich sein, trotz antiker Paradigmen im Code und im Templating. Von Expression Engine höre ich hingegen ausschließlich Positives. Da müsste ich jetzt auch mal einen näheren Blick wagen, wo doch nun Version 2 endlich raus ist, nach jahrelanger Wartezeit! Und zuletzt Silverstripe, dass ich gar nicht als CMS bezeichnen würde, sondern eher als Application-Framework, weil man beispielsweise ohne das manuelle Tippen von Datenbank-Beziehungen fast gar nichts erreichen kann. Außerdem schluckt es viel zu viel Speicher für den üblichen 6-Euro-Webspace, wo andere Systeme locker mit klarkommen. Und sicher habe ich noch viele andere tolle Systeme vergessen, meine Güte! Warum so schlecht gelaunt? Tut mir leid, ist gar nicht böse gemeint. Aber CMS-Diskussionen sind auch immer ein Tummelplatz für Trolle, denn jeder hat natürlich seinen Liebling, den er gegen Anfeindungen verteidigen will. Ist ja auch logisch! Im Endeffekt zählt aber nicht nur die reine Qualität, sondern eben auch die Verbreitung eines Systems, denn je mehr Entwickler sich auf eine Plattform einschießen, desto besser für den Kunden, weil er leichter gute Entwickler für sein laufendes Projekt findet. Und auch gut für die Entwickler, weil eine große Community auch mehr Hilfe in Foren und besser kommentierte API-Dokumentationen bedeutet. Insofern ist eine zu starke Zersplitterung des Marktes nicht gut, da relativiere ich meine Aussage vom Anfang ein wenig. Aha! Naja, es ist schon Platz für zehn bis zwölf PHP-basierte Open-Source-CMSe. Viel weniger sollten es nicht sein, aber auch nicht deutlich mehr. Dann herrscht eine gesunde Konkurrenz, und die Community-Power sorgt für volle Foren und Help-Sektionen! Ein schönes Schlusswort, vielen Dank für Ihre Zeit. Gerne wieder!"
