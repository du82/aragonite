["https://praegnanz.de/weblog/2017"]
title = "praegnanz.de/weblog/2017"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "Richard Rutters „Web Typography“ 27. Oktober 2017 Bücher über Typografie gibt es wie Sand am Meer! Bei der Webtypografie sieht das anders aus, und das schon seit Jahren. Doch mein britischer Bloggerkollege Richard Rutter hat es nun endlich auch getan: ein aktuelles Werk zu dem Thema geschrieben, welches mir selber besonders am Herzen liegt. Zum Artikel Probefahrt mit dem Hyundai Ioniq Elektro 3. September 2017 Ich bin den aktuellen Liebling der Elektroautoszene für zwei Stunden zur Probe gefahren und schreibe euch natürlich gerne mein Fazit hier ins Blog. Zum Artikel Trends im Content Management 20. August 2017 Ein 108-minütiger Videovortrag über fast alles, was ich über Content-Management-Systeme weiß. Oder zumindest, was wir als Agentur in den letzten Jahren ganz praxisnah darüber gelernt haben. Zum Artikel Wahlprogramm-Design-CheckUp 2017 19. August 2017 Es ist wieder soweit – die Wahlprogramme der Parteien zur Bundestagswahl müssen analysiert und verglichen werden. Allerdings selbstverständlich nicht inhaltlich, sondern nach typografischen Gesichtspunkten. Starten Sie Ihren PDF-Viewer und los geht’s! Zum Artikel Nur noch E-Zulassungen ab 2030? 26. Juni 2017 Wenn es nach der Grünen Bundestagsfraktion und dem Bundesrat geht, wird es in Deutschland ab 2030 keine neuen Zulassungen für Verbrenner-Autos mehr geben. Ist das überhaupt machbar oder bricht dann alles zusammen? Wie realistisch ist der Zeitplan? Ich gebe sachliche Antworten zu berechtigter Skepsis. Zum Artikel"
year_published = 2017
