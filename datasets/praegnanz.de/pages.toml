full_description = "Typo-Vortragsreihe in Dortmund – gratis! 22. Dezember 2005 Die FH Dortmund und die Cape Arcona Typefoundry veranstalten am 19./20. Januar ein Typografie-Event, bei dem man eigentlich wirklich dabei sein muss. Der Eintritt ist frei und es kommen, neben einigen Newcomern, auch einige bekannt-illustre Redner: Peter Bilak beispielsweise. Oder auch Underware. Nicht übel. Das Event trägt den kryptischen Na... Zum Artikel Heute ist Business-Blogger Stichtag 22. Dezember 2005 Nur für den Fall, dass Ihr es vergessen habt: heute um kurz nach halb drei endet die legendäre Auktion einer umso legendäreren Domain: business-blogger.de kommt unter den Hammer. Bei eBay. Heute um 14:38 Uhr. Noch könnt Ihr mitsteigern! Bieten macht Spaß – vor allem dreistellige Beträge ... Zum Artikel Arial geht, Segoe kommt (update) 21. Dezember 2005 Die Süddeutsche schreibt’s, Prof Voelker verbreitet es in seinem Typo-Kurs, Nick erzählt es mir soeben: Die Tage der Arial sind gezählt. Das erfolgreichste Helvetica-Plagiat der Welt, Superstar von WordArt- und CorelDRAW-Layouts, Lauftextschrift in Milliarden von Geschäfts- und Privatbriefen. Doch leider hässlich wie die Nacht. Und ebe... Zum Artikel Mini-Facelift zu Weihnachten 20. Dezember 2005 Das wurde Zeit: praegnanz.de wird ein bisschen retuschiert und fit gemacht für 2006. Den Anfang machte gestern abend die Hauptnavigation und die Rahmen. Die abgerundeten Ecken sind nicht mehr gar so rund, geglättet und mit einem Hauch (wirklich nur einem Hauch) Innenschatten versehen. Außerdem kam ich endlich daz... Zum Artikel Webdesign anno 1956 18. Dezember 2005 Der WDR feiert 50-jähriges und hat sich was nettes einfallen lassen, das mit viel Liebe zum Detail (aber leider auch mit hässlichen Layouttabellen) umgesetzt wurde: Eine komplette Retro-Microsite mit Inhalten, Fotos und Grafiken von original 1956. Ziemlich innovativ und auf jeden Fall einen Blick wert. Zum Textrundfunk des WDR. Zum Artikel"
