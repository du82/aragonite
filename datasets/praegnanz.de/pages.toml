["https://praegnanz.de/weblog/-ne-lanze-fuer-e-mail-in-der-projektkommunikation"]
title = "’ne Lanze für E-Mail in der Projektkommunikation | praegnanz.de"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "’ne Lanze für E-Mail in der Projektkommunikation 23. Juli 2010 Gerade eben las ich auf Twitter folgende Aussage: Projektkoordination über E-Mail ist ganz großer Dreck, aber keiner lässt sich irgendwas anderes als Tool unterjubeln. (Christian Vogt in seinem geschützten Twitter-Account) Zunächst spontane Zustimmung von meiner Seite – doch halt! So einfach will ich es mir nicht machen. Ich will Gründe für das Dilemma. Und eigentlich liegt es auf der Hand. Es gibt ja den schönen Spruch: »Die beste Kamera ist immer die, welche du gerade dabei hast.« Übersetzt: Logisch, dass deine großartige Spiegelreflex bessere Bilder macht als die schäbige Handyknipse. Aber wenn dann doch mal zufällig Kisten Dunst nackt vorbeilaufen sollte, nützt es dir nichts, wenn die Spiegelreflex hübsch verstaut zuhause im Schrank liegt. E-Mail ist die Handyknipse in der Projektkommunikation – irgendwie uncool, ineffizient und unpraktisch, aber: E-Mail ist kostenlos Jeder (jeder!) hat einen E-Mail-Account Alle E-Mails-Accounts dieser Erde sind untereinander kompatibel E-Mail muss nicht neu gelernt werden Jeder nutzt E-Mail in der für ihn vertrauten Umgebung Man macht sich nicht abhängig von einem zentralen Anbieter Zusätzlich: Der Einsatz von E-Mail muss nicht rechtfertigt werden – aber bei auftretenden Problemen mit neuartigen Projekt-Tools ist immer derjenige Schuld, der sie vorgeschlagen hat. Natürlich sind Services wie Basecamp, Synfoni oder auch Google Wave irgendwie »besser«, aber nur wenn man davon ausgehen kann, dass die beteiligten Personen sich auch voll darauf einlassen, die Dinge sofort kapieren und kein Problem mit zentralem Hosting haben. E-Mail ist so allgegenwärtig, dass es noch lange (sehr lange) das Mittel der Wahl sein wird, um Projekte zu organisieren. Große Marktchancen sehe ich vor allem darin, E-Mail-Clients so zu verbessern, dass sie die ganze Hässlichkeit von E-Mail-Kommunikation wegabstrahieren. Die Leute dabei zu unterstützen, E-Mail vernünftig zu nutzen, unwichtige Teile (Fullquotes) auszublenden usw. Einfach das beste aus dem machen, was der Kanal technisch hergibt. Google Mail hat hier schon eine Menge Pionierarbeit geleistet, aber das geht noch besser. Sehen wir’s ein: E-Mail is here to stay. Machen wir das drumherum so angenehm wie möglich!"
