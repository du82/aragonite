["https://praegnanz.de/weblog/2018"]
title = "praegnanz.de/weblog/2018"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "Webfonts outside the lab 16. Dezember 2018 Auf dem Dynamic Font Day 2018 in München gab es acht englischsprachige Talks. Einen davon habe ich gehalten. Es war seit langer Zeit das erste Mal, dass ich mich öffentlich zum Thema Webfonts geäußert habe. Und mein erster englischsprachiger Vortrag überhaupt. Das hört man auch :-) Zum Artikel Welches E-Auto kann man 2018/2019 sinnvoll kaufen? – Update 30. November 2018 Ich habe mir ein paar Gedanken gemacht zum aktuellen Markt von rein elektrischen Autos in Deutschland. Was kann man eigentlich kaufen? Für welchen Zweck, und zu welchem Preis? Zum Artikel Adobe und das Web 29. November 2018 Bereits seit den Anfangstagen meiner Webdesign-Karriere war Adobe immer bestrebt, uns Webworkern ein maßgeschneidertes Angebot zu unterbreiten, auf dass das Zukunftsfeld Internet mit der gleichen digitalen Kreativität beglückt werden könne wie die Printwelt, wo Adobe seit jeher der unangefochtene Platzhirsch ist. Zum Artikel PV-Autarkie und die Wette auf steigende Strompreise (update) 28. Juli 2018 Mit einer Wärmepumpen-Heizung und einem Elektroauto steigt der Strombedarf im Haushalt auf nie gekannte Höhen. Nur konsequent, wenn man dann einfach selber in die Stromproduktion einsteigt. Das haben wir gemacht – hier ein paar Einblicke. Zum Artikel Die Musik von Turrican 2. April 2018 Man kann Chris Hülsbeck wahrlich nicht vorwerfen, er kümmere sich nicht engagiert genug darum, sein musikalisches Vermächtnis für die Nachwelt zu erhalten. Zum Artikel"
year_published = 2018
clearnet = "https://praegnanz.de/weblog/2018"
