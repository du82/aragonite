["https://praegnanz.de/weblog/zur-hoelle-mit-parallax"]
title = "Zur Hölle mit Parallax! | praegnanz.de"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "Zur Hölle mit Parallax! 14. September 2013 Um es gleich vorweg zu nehmen: Natürlich haben sie ein neues Spielzeug gefunden, um ihr Ego strahlen zu lassen und die Benutzer zu quälen. Die Rede ist von den »Kreativen« im Webdesign. Ihr altes Spielzeug waren komplett auf Flash basierende Websites. Darüber ist viel geschrieben worden – warum man das nicht machen sollte, und dass es nicht sinnvoll ist, abstruse neue Bedienkonzepte zu erfinden. Dass Websites keine interaktiven Tüftel- und Knobelspielchen sind, sondern Informationsangebote. Das war alles auch vor dem Jahr 2007 bekannt. Doch erst mit der Einführung des iPhones (und dann ganz bestimmt seit dem iPad), als also klar war, dass Flash und ARM-Prozessoren sich nicht gut vertragen, waren die Kreativen gezwungen, ihren Erlebnisspielplatz umzuziehen. Dass es dabei tatsächlich nur um einen Umzug ging, nicht etwa um eine konzeptionelle Neuausrichtung der ehemals Killer-Websites getauften Usability-Höllen, wird in diesem Jahr besonders deutlich. Denn eine Zutat darf bei heutigen fancy »Designerwebsites« nicht fehlen: Eine verwirrende und langsame One-Pager-Navigation mit Parallax-Scrolling, sowie viel zu viele und zu hoch aufgelöste Stimmungsbilder auf einem einzigen Webdokument. Ihr kennt diese Art von Websites. Hier sind ein paar Beispiele: livingword.co.uk cyclemon.com westwardseattle.com www.ianlunn.co.uk/demos/recreate-nikebetterworld-parallax www.vondutch.com www.arnoldclark.com/challenge Dezent eingesetzt ist gegen den Parallax-Effekt im Grunde nichts einzuwenden. Doch wie bei so vielen Dingen macht die Dosis das Gift. Es ist ja schön, dass viele der Parallax-Websites responsiv daherkommen und den Browser-Viewport ausnutzen und mit Touch-Geräten gut zurechtkommen. Es ist jedoch nicht okay, die gesamte Aufmerksamkeit des Nutzers mit Gewalt vom Inhalt fernzuhalten und komplett auf die Effekthascherei zu lenken. Und das ist im Kern der Denkfehler unserer »kreativen« Kollegen. Sie wollen eine Website mit Wow!-Effekt, die geil aussieht und Eindruck schindet. Nebenbei sind sie von den Inhalten, die der Kunde zu bieten hat, nicht sonderlich beeindruckt. Das wiederum geht uns allen meistens so. Eine gute Designerin versucht jetzt, die Inhalte der Website zu verbessern, engagiert eine Texterin, lässt bessere Fotos machen, um so die Situation auf der Content-Front zu verbessern, um dann eine angemessene Gestaltung zu finden. Eine »kreative« Designerin schert sich nicht um Inhaltsarbeit. Sie entwirft eine bombastische Grafikflut, die von den kümmerlichen Inhalten ablenkt. Damit steht sie super da beim Kunden, denn dieser musste sich nicht mit seinem Unternehmen beschäftigen und kriegt ohne eigenen Aufwand eine schicke Website. Die klassische Zwickmühle: Sowohl Kunde als auch Designer haben nicht die Endnutzerbrille auf. Sie kennen das Unternehmen bereits, sie kennen die Website ebenfalls. Doch der unbedarfte Nutzer hat keine Lust, langwierig die Struktur und Bedienung einer Website zu erlernen, bevor er an die spärlichen Informationen über das Unternehmen herankommt. Er mag es übersichtlich, schnell und erst an dritter Stelle beeindruckend. Wenn überhaupt. Unabhängig von der Technik gilt auch im Jahr 2013: Webdesign bedeutet zum großen Teil: Übersicht schaffen, Dinge aufräumen, klare Strukturen herausbilden, Informationen zugänglich gestalten. Der Wow!-Faktor ist zu vernachlässigen. Uns ist eine tiefe und nachhaltige Befriedigung beim Nutzer wichtiger, wenn er sich umfassend und unkompliziert informieren konnte. Die schnelle Nummer mag aufregend sein, liegt aber letztlich schwer im Magen. Inspiriert durch den hier:"
