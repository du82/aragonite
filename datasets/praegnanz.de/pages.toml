title = "1&#38;1 1und1 1-und-1 Puretec (update) | praegnanz.de"
description = "Gerrit van Aaken. Webdesign und App aus Würzburg – seit 1996."
full_description = "1&#38;1 1und1 1-und-1 Puretec (update) 23. November 2005 Am 25.10.2005 stand an dieser Stelle von 9:17 Uhr bis 13:05 Uhr eine bittere Beschwerde über 1&1, die ich jetzt ausnahmsweise zurücknehme, da ein aufmerksamer Mitarbeiter von 1&1 innerhalb von 3 1/2 Stunden den Eintrag bemerkt hatte und meine gewünschte Kündigung veranlasste. Ich bin hocherfreut, dass 1&1 die Macht von Weblogs erkannt hat und ziehe den Hut. Danke für die prompte Reaktion! P.S.: Ich glaube, Jamba und Spreeblick haben tatsächlich etwas bewirkt. update 23.11.2005: So richtig loben will ich 1&1 nun doch wieder nicht. Zwei der wichtigsten deutschen Weblogs, IT&W sowie die Mac Essentials, haben seit Tagen mit technischen Problemen bei 1&1 zu kämpfen und sind nicht zu erreichen. Auch in den Kommentaren hier sammeln sich die Beschwerden. Ich werde jedenfalls niemandem mehr dazu raten, 1&1-Kunde zu werden. Sowohl im DSL- als auch im Hostingmarkt gibt es deutlich kundenfreundlichere und auch preisgünstigere Anbieter. update 29.11.2005: Da diese Website nicht vollends zum Geschädigten-Sitzkreis werden soll, schließe ich die Kommentarfunktion für diesen Artikel."
