ocal sound field Aug 6, 2015 Proud to be an American After 25 years, I’m a US citizen Nov 25, 2014 Thinking in Transforms—Handling Options Implementing options as functions, and not flags, simplifies a bunch of code Oct 5, 2014 Tony Benn’s Five Questions for the Powerful No one has power: they are given it Mar 14, 2014 Agile is Dead (Long Live Agility) In which I stick my neck out and initiate my Agile-is-Dead phase Mar 4, 2014 Pattern Matching and Parsing It turns out that pattern matching and data structure decomposition are a wonderful tool for doing parsing of nonregular grammars (such as Markdown). Feb 12, 2014 Telling, Asking, and the Power of Jargon Vocabulary becomes jargon becomes shortcuts in communicating. Accuracy matters. Feb 11, 2014 Reactive systems have no top In which a dog points out I was writing megalomanic classes Jan 4, 2014 Oft repeated, rarely heeded… Dec 24, 2013 Followup to my EMail experiment I discarded all email I received while on vacation. How did the experiment work? Nov 12, 2011 So I’m trying an email experiment How to reduce the burden of email build-up when you’re away Apr 14, 2011 Some Compositions A while back, I was asked during an interview what I’d do if I had three months off. I said I’d take piano lessons. Jun 11, 2009 The ‘Language’ in Domain-Specific Language Doesn’t Mean English (or French, or Japanese, or …) Target DSLs at the jargon of its users Mar 10, 2008 Pipelines Using Fibers in Ruby 1.9—Part II In the previous post, I developed a class called PipelineElement. This made it relatively easy to create… Jan 1, 2008 Pipelines Using Fibers in Ruby 1.9 Users of the command line are familiar with the idea of building pipelines: a chain of simple commands strung together to the output of one becomes the input of the next.… Dec 30, 2007 Paying Back That’s how much was raised in charitable donations during the course of this weekend’s RailsConf. May 21, 2007 Grapher: The Coolest App You Never Knew You Had If you use OS X, the