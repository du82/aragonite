description = "Why sufferable wins"
full_description = "Truths from the Declaration of Independence agility process Why sufferable wins Published July 4, 2003 On the Fourth of July, I went over to the archives to read a transcription of the Declaration of Independence. In a way it seems cheap to draw project-team lessons from such a document, but there is a wonderful quote in the middle that I hadn’t noticed before: Experience hath shewn, that mankind are more disposed to suffer, while evils are sufferable, than to right themselves by abolishing the forms to which they are accustomed. Are we currently putting up with things “to which we have become accustomed” rather than fighting to right them?"
