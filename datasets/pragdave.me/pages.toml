ming is like gardening, then weeding has much to teach us about debugging. Aug 11, 2004 Nice Interface in a Storm This UI also teaches you what’s happening behind the scenes Mar 11, 2004 Mechanism and Policy There is no one-best-way to design interfaces. Instead there is mechanism and there is policy Nov 25, 2003 My Kind of Warranty why the luck stiff’s warranty Oct 14, 2003 Prowling the ruins of ancient software Famous programs from just a generation or two ago are in danger of disappearing from human ken, forever. Jul 29, 2003 Truths from the Declaration of Independence Why sufferable wins Jul 4, 2003 Debating with Knives A fun technique to encourage groups to investigate all sides of an issue Jun 17, 2003 Construction Methods Don’t override your constructors. Use construction methods. Jun 11, 2003 The Joy of Lego Can we build systems with emergent behavior, and which are safe, by adding invariants and contracts? Jun 1, 2003 First Kill the Architects Why do we think about architecture, and should we bother? May 6, 2003 On Getting Involved Some wisdom from Francis Ford Coppola Apr 16, 2003 If you haven’t heard Tom Lehrer’s Elements, click now Apr 16, 2003 Artifacting Let’s value the process, not the product Mar 23, 2003 The Absence of Grace That which is overdesigned, too highly specific, anticipates outcome; the anticipation guarantees, if not failure, the absence of grace. Feb 22, 2003 Passing Information to Our Children’s Children’s … Children There’s a great article in the January 2003 CACM which describes some very long-term data storage technology (Organic Data Memory using the DNA Approach). Feb 6, 2003 Learning from Mistakes Aviation places great emphasis on reporting and analyzing mistakes. Can we developers learn something from them?</div> <div class="card-attribution card-text-small end"> <div class="listing-date">Feb 2, 2003`{=html}'
