title = "לא רציונלי ולא במקרה"
description = "האם אנחנו באמת שולטים בקבלת החלטות? בספרו, דן אריאלי חושף את התחבולות העדינות אך העוצמתיות שמוחנו משחק בנו."
full_description = 'English לא רציונלי ולא במקרה הכוחות הסמויים שמעצבים את ההחלטות שלנו כשמדובר בקבלת החלטות בחיינו, אנחנו חושבים שהבחירות שאנו מבצעים הן חכמות ורציונליות. האומנם? ברב המכר פורץ הדרך הזה של הניו יורק טיימס, דן אריאלי מאתגר את הנחת הקוראים שהליך קבלת ההחלטות שלהם מבוסס על מחשבה רציונלית. בצורה משעשעת ומפתיעה, הספר חושף את הטריקים העדינים אבל העוצמתיים שהמוח שלנו מפעיל עלינו, ומאתגר את הנחת המוצא הנפוצה שהאדם ביסודו פועל בצורה רציונלית. לרכישה דן אריאלי אני עורך מחקרים בתחום של כלכלה התנהגותית ומנסה להנגיש אותם בשפה פשוטה. הדברים שגיליתי באמצעות המחקרים העשירו את חיי, ואני מקווה שהם יעשירו גם את החיים שלכם. ההיכרות שלי עם חוסר ההיגיון התרחשה לפני שנים רבות בזמן תהליך ההחלמה שלי מכוויות, שנגרמו לי כתוצאה מפיצוץ. מגוון הטיפולים במחלקת הכוויות, ובמיוחד ה"אמבטיה" היומיומית אילצו אותי להתמודד עם מגוון התנהגויות לא רציונליות שהיו כואבות וממושכות מאוד. עם עזיבתי את בית החולים, רציתי לבחון איך ניתן להעניק לפצוע כוויות טיפול - אומנם כואב ובלתי נמנע - אבל בצורה טובה יותר ועם כמה שפחות כאב, ולכן התחלתי לערוך מחקר בתחום זה. הרעיון, שבאופן צפוי בהיבטים רבים של חיינו אנו מקבלים שוב ושוב החלטות שגויות, ריתק אותי, וכן העובדה שמחקר יכול לעזור לשנות חלק מהדפוסים הללו. ברגע שקלטתי שהבנה של הליך קבלת ההחלטות יכולה לעזור לי לחיות את חיי בצורה טובה יותר, התחלתי להפיץ את אותו ידע בסיסי, כדי שכולנו נוכל לשפר את חיי היומיום שלנו. דן אריאלי הוא פרופסור לפסיכולוגיה ולכלכלה התנהגותית באוניברסיטת דיוק ובין המייסדים של המרכז לחוכמה בדיעבד מתקדמת. הוא מחברם של רבי המכר: שלך באי-רציונליות, לא רציונלי אבל לא נורא, האמת על באמת, שווה לך, החלטות מופלאות ואיך הכסף עובד עלינו. כמו כן, הוא שותף ליצירה של הסרט Dishonesty ומשחק הקלפים Irrational Game. שמור על קשר עם דן תרגומים לשפות נוספות לחצו פה, כדי לראות את הרשימה המלאה של התרגומים לשפות השונות לחצו פה, כדי להסתיר את הרשימה המלאה של התרגומים לשפות השונות שם ההוצאה תאריך שפה Matar Publishing House, Ltd 06-Nov-06 Hebrew Editorial Ariel, S.A 24-Nov-06 Spanish Rizzoli (Italy) 30-Jan-07 Italian Flammarion SAS 30-Jan-07 French Pokolenie Publis