ountry whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Contents 1 Basics 1.1 EU roaming 2 Andorra Telecom 2.1 Availability 2.2 Base Plans 2.3 International roaming 2.4 More information 3 Roaming options from foreign providers 3.1 Roaming with Spanish providers 3.2 Roaming with French providers 3.3 Roaming with other foreign providers Basics[] The Principality of Andorra is a landlocked microstate in Southwestern Europe, located in the eastern Pyrenees and bordered by Spain and France. While prices are slowly dropping, Andorra remains one of the most expensive places in Europe to use a mobile phone, both for buying a local SIM card and for roaming with a SIM card from outside Andorra. You should limit your data usage until you reach a different area in France or Spain at much better rates. Andorra has the international prefix of +376. Mobile phone numbers consist of 6 digits starting with a 3 or a 6. EU roaming[] Be aware that Andorra is not part of the EU, nor the EEA, where from June 2017 new international roaming rules are enforced. So roaming rates are not capped or regulated in Andorra and can be much higher. European providers treat Andorra very differently: only few charge the same as within the EU zone, but most will add a substantial surcharge for usage while roaming in Andorra. Better check your EU/EEA provider first before use, connect to a French/Spanish provider where possible, or buy a local SIM card instead. Fortunately these high costs can often be avoided because Spanish or French antennas cover a major part of the country. Therefore, like always in border areas covered by multiple networks, be sure to prevent roaming by making a manual network selection. Down in the valley, 3G/4G reception from Spain or France is so not good. If you stay for longer, you might consider buying a local SIM card in spite of the high costs or look for one of the few cheap roaming options before. Andorra Telecom[] Andorra Telecom is the only network provider in this small country. The state owned company was formerly called Servei de Telecomunicacions d'Andorra (STA) a.k.a. Som. It has 2G on 900 and 1800 MHz and 3G/UMTS on 2100 MHz like in most of Europe. 4G/LTE is on 1800 MHz and 800 MHz (bands 3 and 20). Since December 2021 a 5G network is being rolled out and can be used by prepaid plan as well. Availability[] Their prepaid product used to be called Mobiland Clic! Now, it's only called Prepagament for prepaid. You can purchase a SIM card from the Andorra Telecom head office at Av. Merixell 112 in Andorra la Vella or its distributors. The sim card comes as a triple cut card, allowing to select the mini, micro or nano size. Andorra Telecom will ask for your ID, so be prepared to bring one (Passport or national ID card) You will have to activate the SIM with one of the two base plans, and there is no separate cost of the SIM card. eSIM activations can be done online as well, and will cost only the price of a month of service (you must choose either Tarifa S or Tarifa M). You will need to create an online account on the Andorra Telecom website here upload a photo of your passport as well as a selfie, and wait for a confirmation e-mail indicating that your registration has been accepted. Once it has, follow the link to finish creating your online account and select your desired starting tariff. Top-ups can be done with vouchers for €15, €30 or €60 available in stores, in the app or online with a debit or credit card, with any value between €5 and €60. Any top-up increases validity for one year. Check credit by *101#. When you run out of credit, you have 2 months to top up your card. During this time, you’ll be able to receive national calls and SMS. If you don’t top up within this time, the number will be automatically unsubscribed and you won’t be able to recover it. The pay-per-use plan with no base fee is no longer offered, but it is possible to pause the base plan and keep the balance, the phone-number and sim card for up to 14 months for €3. The pausing and un-pausing of the base plan can be done in the app. Base Plans[] There are now two base plans lasting 30 days, which provide both a data, texting, and a voice allowance: Tarifa S: 40 domestic mins, 10 text messages, and 3 GB for €10 Tarifa M: 100 domestic mins, 10 text messages, and 12 GB for €20 The plans auto-renew when there is sufficient credit available. Once the data allowance has been consumed, the data will be switched off. Calls and text messages beyond the plan's allowance are charged per use. Additional data of 2GB for 7 days can be add for €5. International roaming[] As Andorra doesn't belong to the EU or EEA, their rules don't apply. For roaming in European countries including Turkey and in Canada and USA, they sell a daily roaming package at €3 with 1 GB valid until midnight of the day. Upon reaching the 1GB the package will be renewed. More information[] APN: internet Andorra Telecom has an app allowing you to manage the tariff, and recharge the SIM (worked with german visa card as well as with a revolut card). Website (partly in English, change at top right): http://www.andorratelecom.ad/ Roaming options from foreign providers[] As Andorra is not a member state of the EU/EEA, it's excluded from the common "roam like at home" roaming zone of almost all European providers. This means that roaming data on the only network Andorra Telecom is mostly charged at excessive rates. You should try to avoid any connection with Andorra Telecom by choosing a Spanish provider instead. But coverage down in the valley may be quite weak and unstable on Spanish 3G and 4G/LTE networks. Roaming with Spanish providers[] According to this article of Xatakamóvil Spanish providers charge excessive rates between €3.63 per MB up to €18.15 per MB. The only exception is Movistar that charges generous €9 for 3 GB on a daily basis for contract customers only, not for prepaid. For all Spanish Orange SIMs like the Mundo SIM you can activate their "Everywhere" option in your clients area, by app or texting "EW" to 22095. This gives you 100 MB per calendar day at €7 in Andorra. Roaming with French providers[] The situation is slightly better with French providers thanks to Orange again: Andorra is included within the EU zone of French Orange SIM cards and charged at the domestic French rate. This applies to prepaid SIM cards like Orange Holiday or Mobicarte as well as contracts like these of Sosh. Roaming with other foreign providers[] Most other EU providers now exclude Andorra from their discounted roaming zone as they need to pay for their customers' usage on the Andorra Telecom monopoly network at much higher wholesale rates. If you stay for a short time, disable data roaming or try to connect to a Spanish provider; if you stay for longer, buy a local SIM. These few EU providers offer Andorra roaming under Roam like at home conditions at domestic prices: Orange France, see France Vodafone Netherlands, see Netherlands Ay Yildiz Germany see Germany Categories Categories: Europe Country 7/20 Community content is available under CC-BY-SA unless otherwise noted.'''
