false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> 0x0px https://prepaid-data-sim-card.fandom.com/wiki/File:U.S._Navy_Band,_Advance_Australia_Fair_(instrumental).mp3 National Anthem Contents 1 Basics 1.1 Frequencies and coverage 1.1.1 WARNING for overseas devices (especially tourists) 1.2 Price comparison with the rest of the world and average data usage 1.3 Regulations 2 Telstra 2.1 Frequencies 2.2 Availability 2.3 Prepaid SIM card 2.4 Data-only SIM 2.5 More info 3 Optus (yes) 3.1 Frequencies 3.2 Availability 3.3 Prepaid SIM card 3.4 Data-only SIM 3.5 Roaming 3.6 More info 4 Vodafone Australia 4.1 Frequencies 4.2 Availability 4.3 Data feature packs 4.4 MyMix 4.5 Data-only SIM 4.6 More info 5 ALDI mobile 5.1 Availability 5.2 Prepaid SIM card 5.3 Data and Value Packs 5.4 More info 6 Amaysim 6.1 Voice and data SIM 6.2 Data-only SIM 6.3 More info 7 boost Mobile 7.1 Availability 7.2 Prepaid SIM card 7.3 More info 8 Coles Prepaid (Coles Mobile) 8.1 Availability 8.2 Prepaid SIM card 8.3 More info 9 dodo 9.1 Availability 9.2 Prepaid SIM card 9.3 Data-only SIM 9.4 More info 10 E.Tel Mobile 10.1 Availability 10.2 Prepaid SIM card 10.3 More info 11 gotalk 11.1 Availability 11.2 Data-only SIM 11.3 More info 12 Hello Mobile 12.1 Availability 12.2 Data-only SIM 12.3 More info 13 Lebara mobile 13.1 Availabilty 13.2 Prepaid SIM card 13.3 Data feature packs 13.4 Data-only SIM 13.5 More info 14 Lycamobile 14.1 Availability 14.2 Prepaid SIM card 14.3 Data feature packages 14.4 Combo packages 14.5 More info 15 Everyday Mobile from Woolworths (formerly Woolworths Mobile) 15.1 Availability 15.2 Prepaid SIM card 15.3 More info 16 Kogan Mobile 16.1 Availability 16.2 Data feature packages 16.3 Data-only SIM 16.4 More info 17 Yomojo Mobile (previously Yatango) 18 Superloop 18.1 Availability 18.2 Plans 19 Australian External Territories 19.1 Christmas Island 19.2 Cocos (Keeling) Islands 19.3 Norfolk Island 19.4 Lord Howe Island Basics[] There are three national network operators in Australia: Telstra Optus (Singtel Optus) Vodafone Australia (TPG Telecom Australia) This is added by a very competitive MVNO market on all three operators. They are sometimes cheaper, but some of them still don't offer 4G/LTE or good data rate SIM cards. They are: ALDI mobile, amaysim, Belong Mobile, Boost mobile, Dodo, E.Tel Mobile, Exetel, Gotalk, Hello Mobile, Kogan Mobile, Lebara AU, Lycamobile AU, Telsim, TPG, Vaya, yomojo, amongst others. Some MVNO companies left the market recently: Global Gossip, Savvytel, Virgin Mobile and yatango (rebranded as yomojo) amongst others are not listed anymore. The Australian mobile market has in recent years shifted from rather expensive data prices to some of the lowest per-GB prices in the developed world, since many people increasingly use mobile data in lieu of often slow and/or capped public WiFi and as either a complete replacement for fixed-line/satellite NBN or as a backup during NBN disruptions. However, monthly expenses per customer have increased across the industry. In 2017 local cable provider TPG Corporation acquired spectrum for a 4th nationwide 4G network. They began rollout in 2018 and it came to an halt in January 2019 citing the rollout becoming unviable after the Australian Government decided to ban Huawei equipment due to security concerns. TPG Corporation merged with Vodafone Hutchinson Australia in 2020 to form TPG Telecom Australia. TPG Telecom Australia operates its mobile network under the Vodafone brand and also has its own-brand MVNO using the Vodafone network. The Australian external territories have a special article as they are not served by the providers mentioned here. This refers to Christmas Island, Cocos (Keeling) Islands, Norfolk Island and Lord Howe Island. They are listed in a special article instead. For starters, look for bargains in the supermarket catalogues of Coles (www.coles.com.au) or Woolworths (www.woolworths.com.au) which often have prepaid SIMs from various providers at up to half price. These vary week by week with each new catalogue out on Wednesdays. Alternatively some prepaid providers like Telstra, Boost Mobile and Coles Prepaid offer bonus data to new customers for the first or first three prepaid recharges. Frequencies and coverage[] 2G: All three operators have closed their 2G (GSM and CDMA, except for Telstra in a limited part of Christmas Island) and 3G (UMTS) networks. You need a 4G/LTE or 5G/NR enabled devices in mainland Australia (including Tasmania) Telstra has the most extensive coverage in Australia on its "Next G" network on 850 MHz (B5). It covers 99% of the population. This was complemented by 3G on 2100 MHz (B1) until March 2019. Its 2100 MHz (B1) spectrum has since been re-farmed for 4G. Telstra has switched off its 3G network on 28/OCT/2024. Optus is in 2nd spot on 900 MHz (B8) covering 98.5% of the population. 3G on 2100MHz has been switched off at the end of 2021. Optus has switched off its 3G network on 28/OCT/2024. Vodafone covers about 96% of the population using 900 MHz (B8). Vodafone also operated on 850 MHz (B5) and 2100 MHz (B1) but has since re-farmed this spectrum for use with its 4G and 5G networks. Vodafone's 3G network has been shut down in January 2024. 4G/LTE: 700 MHz (band 28), 850 MHz (band 5), 900 MHz (band 8), 1800 MHz (band 3), 2100 MHz (band 1), 2300 MHz (band 40 in TDD), 2600 MHz (band 7): Telstra: already covers 90% of the population with 4G (branded as 4GX) in 2015. Its main frequencies are 700 MHz (B28) for coverage nationwide with 1800 MHz (B3) in most population centres. 2600 MHz (B7), 2100 MHz (B1) and 900 MHz (B8) provide additional capacity in populated areas. Optus: covers 90% of the population using 700 MHz (B28) and 2600 MHz (B7) frequencies. This is aided by 1800 MHz (B3), 2100 MHz (B1) and 2300 MHz (B40) in metro areas. Vodafone: uses the 850 MHz (B5) band for coverage with 700 MHZ (B28), 1800 MHz (B3) and 2100 MHz (B1) providing additional capacity. The crowd sourced state of mobile networks report by OpenSignal from Nov. 2017 showed all 3 networks tied for the best 4G/LTE coverage slightly above 85%. Average 4G/LTE download speed was fairly high too and ranged between 30 and 38 Mbps on all three providers. 5G: As of late 2020, all three operators have NSA 5G/NR networks open to the public on some prepaid packages. Coverage is increasing, but is largely limited to major cities and regional towns. The three operators have opened 5G NR for most sub-brands and MVNOs. All three networks operate non-standalone (NSA) 5G NR networks on 3500 MHz (n78). Telstra and Optus also offer 5G Standalone. All operators intend to re-farm the existing 3G/4G spectrum and have started to do so on Bands n40 (Optus), n28 (Vodafone), n26 (Telstra and Vodafone), n5 (Telstra) as well as band n7. WARNING for overseas devices (especially tourists)[] As part of Australia's 3G shutdown, the Australian Government and local regulator ACMA has decreed that all operators had to refuse service to all phones that relied on 3G instead of VoLTE and/or VoWiFi for making emergency calls such as the national emergency number 000 (Triple-Zero or Triple-0) for safety reasons (link1, link2). However, the operators have interpreted this law to mean that all phones not sold by them (including overseas and internationally resold/grey market/parallel-imported devices not officially sold in Australia) will be blocked from connecting to their networks, even affecting some iPhones officially sold in Australia but with firmware differing from the telco-provided ones. This is also complicated by Telstra using a non-standard implementation of VoLTE unlike Optus and Vodafone. For these reasons, tourists with devices purchased outside Australia are advised to exercise extra caution when purchasing local SIM cards. Otherwise, for the time being, either roam with your home provider or purchase an international eSIM if your device supports it, and have some VoIP apps installed on your phone if you need to make some calls. More info: https://www.abc.net.au/news/2024-11-03/brand-new-phones-unable-to-make-calls-3g-shutdown/104541440 https://www.abc.net.au/news/2024-11-04/australian-4g-5g-users-cut-off-after-3g-network-shutdown/104559096 https://medium.com/@jamesdwho/australias-3g-switch-off-failures-of-government-industry-to-prepare-b621f90f7950 Price comparison with the rest of the world and average data usage[] UK internet comparison site cable.co.uk has ranked Australia as 39th out of 237 countries/territories and 6th in the OECD (36 countries) in terms of mobile data affordability with data costing on average A$0.69 (approximately US$0.44) per GB or US$0.94 cheaper than the global median (July 2023), data in Australia is thus cheaper than Singapore, Hong Kong, Brunei, Germany, UK, New Zealand, the US, and Switzerland; relatively on par with Nepal, Turkey, Finland, Austria and Peru; but more expensive than in Indonesia, Thailand, Mainland China, France, Cambodia and Vietnam.[Cable 1] In the ACCC Communications Market Report of 2023 (PDF), the reported average mobile data usage of Australian SIM cards was 12.8 GB per capita and month, while the median advertised data allowance across all service providers was reported to be within 32 to 40 GB across all Australian postpaid and prepaid plans and providers for 2022-23. Regulations[] For all Australian prepaid SIM cards, you used to show some photo ID (drivers licence or passport) in an outlet of the operator. Nowadays activation is mostly done online through the website of the operator. There you have to fill in your personal data before the SIM card will activate. Usually a passport and any Australian address (like your accommodation) is sufficient. The major brands like Telstra, Optus, Vodafone or resellers like amaysim or Lycamobile are sold in kiosks, newspaper stands, fuel stations, major supermarkets and other stores all over the country. Only smaller brands or brands linked to a distribution chain must be bought in their special outlets. Be aware that some supermarket brands like those of Aldi, Coles or others can only be activated online. For this you need a WiFi connection or a secondary SIM. Most foreigners can only be verified by a small debit on your credit card. For this you need a Master- or VISA-card (not common in China) and the possibility to check your debits in real time. If you don't have such a credit or debit card, stick to the brands of the operators and activate them in their branded stores like at the international airports. First the three network operators are shown in order of their market position in the country (what coverage or customers are concerned), followed by some of their MVNOs in alphabetical order. All prices quoted in $ are in AUD$ (Australian dollars). Telstra[] Telstra This is the former public telco of the country, but has for long been privatised now. As such it has the most extensive coverage at the highest prices. Its 4G and 5G networks are the best in the country and has the best coverage, especially in rural areas although there isn't much difference in most major towns and cities. While historically the cost is higher than average, if you are looking to connect from remote areas, this is oftentimes the only network available and/or reliable: coverage map. Frequencies[] Telstra closed down its 2G network on 01/DEC/2016. 2100 MHz (back-up in centres). 4G: 700 MHz (Band 28), 1800 MHz = main frequency (B3), 2600 MHz (B7 in CBDs). In 2017 Telstra announced that it covered 99% of population by 4G. This gives the best 4G coverage in the country, but leaves many (mainly) unpopulated areas in the outback still uncovered. Their low-band 85'''
year_published = 2025
