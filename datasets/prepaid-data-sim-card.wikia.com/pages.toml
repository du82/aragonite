["https://prepaid-data-sim-card.wikia.com"]
title = "Prepaid Data SIM Card Wiki | Fandom"
description = "This wiki collects information about prepaid mobile phone plans from all over the world. Not just any plans though, they must include decent data rates, perfect for iPhone, iPad and Android smart phone travellers, as well as mifi users."
full_description = '''Home View source History Purge Talk (20) <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> The purpose of this wiki is: <a href="/wiki/What_is_this_WIKI_all_about" title="What is this WIKI all about"><img alt="Intro header-1" src="https://static.wikia.nocookie.net/paygsimwithdata/images/e/e8/Intro_header-1.jpg/revision/latest/scale-to-width-down/381?cb=20150110171422" decoding="async" loading="lazy" width="381" height="124" class="thumbimage" data-image-name="Intro header-1.jpg" data-image-key="Intro_header-1.jpg" data-relevant="1" data-src="https://static.wikia.nocookie.net/paygsimwithdata/images/e/e8/Intro_header-1.jpg/revision/latest/scale-to-width-down/381?cb=20150110171422" /></a> To inform and educate travellers about prepaid mobile phone tariffs from around the world, particularly relating to mobile data connectivity for smartphones, tablets and mobile modems; and To allow travellers, for the benefit of other travellers, to add further information acquired during their own experiences of buying and using such mobile data services. Contents 1 Prepaid providers with data by continent: 2 Prepaid data providers by country, territory and region (A-Z): 3 International Roaming 4 Can I buy a local prepaid SIM card in every country? 5 Which requirements must my device(s) meet? 6 Data on SIM cards 7 How to find a good data rate? 8 Manuals 9 Contributing to the Wiki Prepaid providers with data by continent: <img style="" src="https://static.wikia.nocookie.net/paygsimwithdata/images/4/46/America.png/revision/latest/scale-to-width-down/160?cb=20161128220418" title="Category:Americas (61 KB)" class="thumbimage" alt="AMERICAS" height="160" width="160" data-image-name="America.png" data-image-key="America.png" data-relevant="1" data-caption="&lt;b&gt;AMERICAS&lt;/b&gt;">AMERICAS<img style="" src="https://static.wikia.nocookie.net/paygsimwithdata/images/c/cb/Europe-0.png/revision/latest/scale-to-width-down/160?cb=20161128221104" title="Category:Europe (85 KB)" class="thumbimage" alt="EUROPE" height="160" width="160" data-image-name="Europe-0.png" data-image-key="Europe-0.png" data-relevant="1" data-caption="&lt;b&gt;EUROPE&lt;/b&gt;">EUROPE<img style="" src="https://static.wikia.nocookie.net/paygsimwithdata/images/9/99/Africa.png/revision/latest/scale-to-width-down/160?cb=20161128221313" title="Category:Africa (64 KB)" class="thumbimage" alt="AFRICA" height="160" width="160" data-image-name="Africa.png" data-image-key="Africa.png" data-relevant="1" data-caption="&lt;b&gt;AFRICA&lt;/b&gt;">AFRICA<img style="" src="https://static.wikia.nocookie.net/paygsimwithdata/images/1/1c/Asien.png/revision/latest/scale-to-width-down/160?cb=20161128221519" title="Category:Asia (79 KB)" class="thumbimage" alt="ASIA" height="160" width="160" data-image-name="Asien.png" data-image-key="Asien.png" data-relevant="1" data-caption="&lt;b&gt;ASIA&lt;/b&gt;">ASIA<img style="" src="https://static.wikia.nocookie.net/paygsimwithdata/images/c/c5/Oceania.jpg/revision/latest?cb=20161224150038" title="Category:Oceania (18 KB)" class="thumbimage" alt="OCEANIA" height="160" width="160" data-image-name="Oceania.jpg" data-image-key="Oceania.jpg" data-relevant="1" data-caption="&lt;b&gt;OCEANIA&lt;/b&gt;">OCEANIAclick on the globe icon to select continent and country or territory Prepaid data providers by country, territory and region (A-Z): Alaska Albania Algeria All Countries data SIM cards data on eSIM WiFi hotspots American Samoa Andorra Angola Anguilla Antigua and Barbuda Argentina Armenia Aruba Ascension Island Australia Australian external territories Austria Azerbaijan Bahamas Bahrain Bangladesh Barbados Belarus Belgium Belize Benin Bermuda Bhutan Bolivia Bosnia and Herzegovina Botswana Brazil British Indian Ocean Territory British Virgin Islands Brunei Bulgaria Burkina Faso Burundi Cambodia Cameroon Canada Cape Verde Cayman Islands Chad Channel Islands Chile China Colombia Comoros Cook Islands Costa Rica Côte d'Ivoire Crimea Croatia Cuba Curaçao Cyprus Czech Republic Denmark Djibouti Dominica Dominican Republic Ecuador Egypt El Salvador Equatorial Guinea Estonia Eswatini Ethiopia European Roaming Unions Falkland Islands Faroe Islands Fiji Finland France French Polynesia French West Indies Gabon Gambia Georgia Germany Ghana Gibraltar Greece Greenland Grenada Guam Guatemala Guinea Guinea-Bissau Guyana Haiti Honduras Hong Kong Hungary Iceland India Indonesia Iran Ireland Isle of Man Israel Italy Jamaica Japan Jordan Kazakhstan Kenya Kiribati Korea (North) Korea (South) Kosovo Kuwait Kyrgyzstan Laos Latvia Lebanon Lesotho Liberia Liechtenstein Lithuania Luxembourg Macau Madagascar Malawi Malaysia Maldives Mali Malta Mauritania Mauritius Mayotte Mexico Micronesia Moldova Monaco Mongolia Montenegro Montserrat Morocco Mozambique Myanmar Namibia Nauru Nepal Netherlands New Caledonia New Zealand Nicaragua Niger Nigeria Niue North Macedonia Norway Oman Pakistan Palau Palestine Panama Papua New Guinea Paraguay Peru Philippines Poland Portugal Puerto Rico Qatar Réunion Romania Russia Rwanda St Helena St Kitts and Nevis St Lucia St Martin St Pierre & Miquelon St Vincent Samoa San Marino São Tomé and Principe Saudi Arabia Senegal Serbia Seychelles Sierra Leone Singapore Slovakia Slovenia Solomon Islands Somalia South Africa Spain Sri Lanka Sudan Suriname Sweden Switzerland Syria Taiwan Tajikistan Tanzania Thailand Timor-Leste Tonga Togo Trinidad and Tobago Tunisia Turkey Turkmenistan Turks and Caicos Tuvalu Uganda Ukraine United Arab Emirates United Kingdom United States Uruguay Uzbekistan Vanuatu Vietnam Wallis and Futuna Zambia Zimbabwe International Roaming International roaming is when you use a SIM card from one country in another country. This can often be unexpectedly expensive, especially for passive usage such as mobile data (internet). Many cases have been reported where users arrive back home facing bill shock with unreasonably high costs, often thousands of euro, dollars or pounds per gigabyte. Some users switch off their phones abroad because they are afraid of this. A better solution is often to use a local prepaid SIM card instead. That’s the raison d'être of this wiki and why it was created some years ago. Recently surcharge-free roaming zones, such as the European Economic Area and North America were established. This wiki shows where and when you can use them. Can I buy a local prepaid SIM card in every country? As an international tourist or visitor, you can buy a local prepaid SIM card in most countries with very few exceptions. The known restrictions, where you can't get a prepaid SIM card or where mobile data is unavailable, are mentioned in the articles and summarised in the Blacklist. In the Greylist, some problematic countries are shown, where for various reasons you should think twice before buying a local SIM. For Warzones we can't give verified information. But in most of the more of 200 countries and territories featured below, you can buy a local prepaid SIM card with data, although in many of them you now have to show a travel document (like a national ID card, passport or visa) at the point of purchase or later: Which requirements must my device(s) meet? <a href="/wiki/Requirements" title="Requirements"><img alt="Intro new" src="https://static.wikia.nocookie.net/paygsimwithdata/images/9/99/Intro_new.png/revision/latest/scale-to-width-down/546?cb=20190419085556" decoding="async" loading="lazy" width="546" height="148" class="thumbimage" data-image-name="Intro new.png" data-image-key="Intro_new.png" data-relevant="1" data-src="https://static.wikia.nocookie.net/paygsimwithdata/images/9/99/Intro_new.png/revision/latest/scale-to-width-down/546?cb=20190419085556" /></a> it needs to be a GSM-enabled device it needs to be an unlocked device it needs to support the frequencies used by networks in your destination country Data on SIM cards When you have purchased a SIM card, and topped it up with credit (if it does not include credit at the time of purchase), you may or may not have data right away. If you have, you will be on the standard or default data rate of the operator. This can also be quite expensive. In many cases, data is charged at high per-megabyte rates unless you purchase a data bundle. Click on the pic with the packages to learn more about default data rates and how to buy data packages. <a href="/wiki/Data_on_SIM_cards" title="Data on SIM cards"><img alt="Pakete" src="https://static.wikia.nocookie.net/paygsimwithdata/images/2/2f/Pakete.jpg/revision/latest/scale-to-width-down/196?cb=20150111114706" decoding="async" loading="lazy" width="196" height="257" class="thumbimage" data-image-name="Pakete.jpg" data-image-key="Pakete.jpg" data-relevant="1" data-src="https://static.wikia.nocookie.net/paygsimwithdata/images/2/2f/Pakete.jpg/revision/latest/scale-to-width-down/196?cb=20150111114706" /></a> How to find a good data rate? First, you should check with your home mobile provider whether it offers international roaming at your destination and at what price. This is mostly as a comparison to see how much you will end up paying when you use international roaming. Then you can research further in your home country whether your provider or others offer reasonable prices for your destination. International SIM cards in the all countries section can be an option if you travel to multiple countries within a short period of time, or for day trips outside the EEA (e.g. Spain to Morocco or Cyprus to Northern Cyprus). However, their prices are not as favourable as buying a local SIM card in every country you visit, especially if you want stay for a while or use a lot of data. The only exceptions to this rule are some surcharge-free zones like the European Economic Area. This might sound onerous, but is easy to do if you are aware of a few catches. In some countries it's possible to keep a SIM card active for a while or even indefinitely after having left. If you expect to return, you should check the validity of your SIM card. Pick your destination in the list above and compare it with the international roaming rates you are offered by your home network. Manuals In the manuals below frequently used terms and procedures mentioned in the national chapters are featured in more detail. They are made for users who are not so familiar with the matter to get a better understanding. Select a topic you want to know more about and click on the pic below: <img style="" src="https://static.wikia.nocookie.net/paygsimwithdata/images/6/6b/Gloss1.jpg/revision/latest/scale-to-width-down/151?cb=20150111154145" title="SIM Card sizes (146 KB)" class="thumbimage" alt="" height="113" width="151" data-image-name="Gloss1.jpg" data-image-key="Gloss1.jpg" data-relevant="1"><img style="" src="https://static.wikia.nocookie.net/paygsimwithdata/images/7/72/Gloss5.jpg/revision/latest/scale-to-width-down/151?cb=20150111154146" title="Recharging (171 KB)" class="thumbimage" alt="" height="113" width="151" data-image-name="Gloss5.jpg" data-image-key="Gloss5.jpg" data-relevant="1"><img style="" src="https://static.wikia.nocookie.net/paygsimwithdata/images/0/03/Gloss2.jpg/revision/latest/scale-to-width-down/151?cb=20150111154146" title="APN Configuration (93 KB)" class="thumbimage" alt="" height="113" width="151" data-image-name="Gloss2.jpg" data-image-key="Gloss2.jpg" data-relevant="1"><img style="" src="https://static.wikia.nocookie.net/paygsimwithdata/images/d/d2/Gloss6.jpg/revision/latest/scale-to-width-down/151?cb=20150111154146" title="WIFI (159 KB)" class="thumbimage" alt="" height="113" width="151" data-image-name="Gloss6.jpg" data-image-key="Gloss6.jpg" data-relevant="1"><img style="" src="https://static.wikia.nocookie.net/paygsimwithdata/images/a/a2/Gloss4.jpg/revision/latest/scale-to-width-down/151?cb=20150111154146" title="Voice over IP (93 KB)" class="thumbimage" alt="" height="113" width="151" data-image-name="Gloss4.jpg" data-image-key="Gloss4.jpg" data-relevant="1"><img style="" src="https://static.wikia.nocookie.net/paygsimwithdata/images/c/cb/Gloss9.jpg/revision/latest/scale-to-width-down/151?cb=20150111154147" title="Validity of SIM cards (167 KB)" class="thumbimage" alt="" height="113" width="151" data-image-name="Gloss9.jpg" data-image-key="Gloss9.jpg" data-relevant="1"><img style="" src="https://static.wikia.nocookie.net/paygsimwithdata/images/a/a7/Gloss27.jpg/revision/latest/scale-to-width-down/151?cb=20220131164424" title="ESIM (105 KB)" class="thumbimage" alt="" height="113" width="151" data-image-name="Gloss27.jpg" data-image-key="Gloss27.jpg" data-relevant="1"><img style="" src="https://static.wikia.nocookie.net/paygsimwithdata/images/6/64/Gloss12.jpg/revision/latest/scale-to-width-down/151?cb=20150319185737" title="Networks (168 KB)" class="thumbimage" alt="" height="113" width="151" data-image-name="Gloss12.jpg" data-image-key="Gloss12.jpg" data-relevant="1"><img style="" src="https://static.wikia.nocookie.net/paygsimwithdata/images/1/1d/Gloss10.jpg/revision/latest/scale-to-width-down/151?cb=20150319185842" title="MIFIs (93 KB)" class="thumbimage" alt="" height="113" width="151" data-image-name="Gloss10.jpg" data-image-key="Gloss10.jpg" data-relevant="1"><img style="" src="https://static.wikia.nocookie.net/paygsimwithdata/images/5/5d/Gloss18.jpg/revision/latest/scale-to-width-down/151?cb=20161224154327" title="Provider Apps (149 KB)" class="thumbimage" alt="" height="113" width="151" data-image-name="Gloss18.jpg" data-image-key="Gloss18.jpg" data-relevant="1"><img style="" src="https://static.wikia.nocookie.net/paygsimwithdata/images/6/66/Gloss3.jpg/revision/latest/scale-to-width-down/151?cb=20161224160354" title="Tethering (140 KB)" class="thumbimage" alt="" height="113" width="151" data-image-name="Gloss3.jpg" data-image-key="Gloss3.jpg" data-relevant="1"><img style="" src="https://static.wikia.nocookie.net/paygsimwithdata/images/3/39/Gloss21.jpg/revision/latest/scale-to-width-down/151?cb=20161224160504" title="Network compatibility of devices (148 KB)" class="thumbimage" alt="" height="113" width="151" data-image-name="Gloss21.jpg" data-image-key="Gloss21.jpg" data-relevant="1"> Contributing to the Wiki This wiki needs your help! Existing editors of this wiki can't follow all developments and updates in every country. Therefore your contribution is very much appreciated here. For editing articles, some guidelines have been established that you should try your best to follow. If you are still unsure, simply add a comment below the article. Don't worry; it will be read and your information added. Community content is available under CC-BY-SA unless otherwise noted.'''
