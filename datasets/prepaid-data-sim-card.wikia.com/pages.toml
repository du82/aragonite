full_description = '''in: Asia, Country, Europe Azerbaijan Sign in to edit History Purge Talk (0) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Contents 1 Basics 1.1 Regulations 1.2 IMEI registration 2 Azercell 2.1 Availability 2.2 Plans 2.3 Data feature packages 2.4 More info 3 Bakcell 3.1 Availability 3.2 Plans 3.3 Data feature packages 3.4 Bakcell WiFi 3.5 Data-only SIM 3.6 More info 4 Nar (by Azerfon) 4.1 Availability 4.2 Plans 4.3 Data feature packages 4.4 More info 5 Artsakh: Karabakh Telecom 5.1 Karabakh Telecom (KT) 5.1.1 Availability 5.1.2 Plans 5.1.3 Roaming 5.1.4 More info Basics[] Azerbaijan has three major national GSM operators: Azercell Bakcell nar mobile (by Azerfon) Two further operators only have very limited 4G/LTE network: Sazz Baktelecom Sazz is on 3500 and 3700 MHz (B42 and 43) and Baktelecom is on 2300 (B40). They only offer wireless stationary internet in the Baku area and a few provices for homes. That's why there are not mentioned any further. The CDMA-based networks of Aztrank and Nakhtel in the Nakhchivan Autonomous Republic are not presented as CDMA is not compatible to GSM mobile phones. 2G/GSM is on 900 MHz with Azercell and Bakcell and 1800 MHz with Nar, 3G is on 2100 MHz with all operators up to DC-HSPA and 4G/LTE has started on all three providers on 1800 MHZ (B3). 5G is still in test phase. Coverage and speeds are quite good throughout the country. 4G/LTE has only started and is mostly limited to the capital so far, but is beginning to be expanded into the countryside. Regulations[] Up to 2016 it was difficult to get a SIM card for foreigners the legal way as you couldn't be properly registered as a short-time visitor. Most SIM cards were sold on the grey market without any registration risking that they'll shut you off. But things changed in 2016 when a new SIM registration system was implemented that allowed for the first time that foreigners staying less than 10 days in the country are registered on a centralized database with their ID data. Now any visitor can easily get a SIM card by showing your ID (passport, visa) at one of the sales points of the operators. In 2018 Azerbaijan has introduced a limit for the number of SIM cards registered on behalf of one person. The maximum number totals 5 SIMs from all Azerbaijan mobile operators. IMEI registration[] There is another hurdle. Like in Turkey, the authorities in Azerbaijan maintain a register of all IMEI numbers. These numbers are unique to your device and go to a whitelist system. This is done officially to prevent theft, but constitutes a surveillance tool as well. All devices that use a local SIM card for more than 30 days need to be registered on the Azerbajan IMEI data base. To enlist, you need to have the device declared on entering the country, which can be done in advance online, then you can either go online here with a local friend for help or go to any post office in the country, to register the IMEI to the whitelist. Online registration costs between AZN 15 and AZN 100 depending on the market price of the device. The exact tax that will be charged can be found here, Otherwise, your device will be shut off after 30 days based on its IMEI number. To know your IMEI number, you need to press *#06# on most devices, but remember that each SIM slot or eSIM has its own IMEI number. If you stay for less than 30 days or use a roaming SIM in the country, you don't need to care. Azercell[] new logo Azercell is Azerbaijan’s largest mobile operator by subscribers with about 50% of all users and used to be owned by Swedish Telia group and Turkish Turkcell. In 2018 both agreed to sell their holding in Azercell to Azintelecom, a company wholly-owned by the Republic of Azerbaijan. It covers 80% of Azerbaijan's territory and 99% of the populated areas. But some of them are on 2G. 3G has started in 2011, to be followed by 4G/LTE in Baku and the Absheron Peninsula with 79% coverage of the capital and Absheron in 2017 and new in Ganja, Barda, Shamkir and Lankaran: 4G coverage map. Availability[] old logo Their SIM card is sold for AZN 5 in their shops and outlets (locator) showing your ID, their prepaid SIMs are called SimSim. They come in different tariff lines. Default tariff is Acercellim. If you are on a different line, you can change by texting letter A to 7575. New subscribers who top-up their balance with AZN 1 or more during 10 days after activation will get AZN 3 as a bonus. Payment cards for top-ups are sold all over from AZN 1 to 100. Validity is 7 to 360 days depending on amount. To top-up, enter *131*<voucher code>#. To check balance send an empty SMS to 2112 (for AZN 0.02) or enter USSD code *111*1*7# for data consumption and phone call credit. Or *100# to check data consumption only or use their mobile app called Kabinetim. Plans[] They offer a variety of different prepaid plans: Acercellim: default rate with calls, texts and data for extra pay. Internet is at AZN 0.20 per MB in 51 KB increments Sərbəst: combo packs with data volume, domestic minutes and free WhatsApp and FB Messenger texting for 30 days: 2 GB, 350 mins: AZN 10 - activation: S10 5 GB, 500 mins: AZN 15 - activation: S15 15 GB, 850 mins: AZN 25 - activation: S25 25 GB, 2500 mins: AZN 50 - activation: S50 60 GB, 4000 mins: AZN 75 -activation: S75 GəncOL: combo packs with data, calls and specified data volume for Azercell apps SberZvuk, ivi, Busuu and Bookmate and free WhatsApp texing 750 MB, 75 mins, 750 MB for apps: AZN 2 - activation: G2 3 GB, 300 mins, 3 GB for apps: AZN 6 - activation: G6 6 GB, 600 mins, 6 GB for apps: AZN 9 - activation: G9 Sadə and GəncSim: voice plans without data allowances, data packages can be added Data: data-only plan without voice, data packs (see below) can be added You can change between all tariff lines by sending a SMS with the name to 7575 (for AZN 1 fee) or use Kabinetim app. Data feature packages[] Default rates on almost all tariffs including Acercellim is AZN 0.20 per MB. Max speed is on 3G 21.6 Mbps on 4G/LTE 100 Mbps. They sell these data packs for extra data to all plans mentioned above: Data Validity Price Activation unlimited 1 hour AZN 0.59 S 3 hours AZN 1.49 3S 6 hours AZN 2.39 6S weekend AZN 0.99 night 100 MB 24 hours AZN 0.50 100 500 MB AZN 1.20 gun 500 MB 30 days AZN 3 500 1 GB AZN 5 1000 5 GB AZN 10 5000 10 GB AZN 15 10 30 GB AZN 25 30 50 GB AZN 30 L For activation, text code to 2525 free of charge. All packages auto-renew. To stop text 'stop <activation code> to 2525. Overage rate is AZN 0.05 during the running time of the package. Check balance by an empty SMS to 2525 or by *100#. Hourly and unlimited packs are capped at 2 Mbit/s. The weekend pack is capped at 512 kbit/s only and weekend means all day on Saturday and Sunday. More info[] APN: internet Website in English: http://www.azercell.com/en Bakcell[] <a href="https://static.wikia.nocookie.net/paygsimwithdata/images/6/60/Bakcell.png/revision/latest?cb=20170104192616" class="mw-file-description image"><img alt="Bakcell" src="https://static.wikia.nocookie.net/paygsimwithdata/images/6/60/Bakcell.png/revision/latest/scale-to-width-down/245?cb=20170104192616" decoding="async" loading="lazy" width="245" height="50" class="thumbimage" data-image-name="Bakcell.png" data-image-key="Bakcell.png" data-relevant="0" data-src="https://static.wikia.nocookie.net/paygsimwithdata/images/6/60/Bakcell.png/revision/latest/scale-to-width-down/245?cb=20170104192616" /></a> Bakcell was the first provider in the country established in 2002. It's partly state-owned and today #2 in the market with a 30% user share. It has a good coverage in 2G and 3G throughout the country and started with 4G in the Baku and Ganja areas with a slightly lower coverage than Azercell at lower prices. Availability[] Bakcell's prepaid SIM cards are called CIN. They have different tariff lines and starter packs are for AZN 5 in their stores. You will need to show your passport. To top-up money cards are sold everywhere from 1 to 50 AZD giving 5 to 150 days of validity. To enter the code, type *101#<voucher code>#. To check balance, type *100#. To begin using internet you should have at least AZN 0.29 in your account. Plans[] Like Azercell Bakcell offers a variety of different base and combo plans for 30 days: CIN: is their default base plan with data and calls for extra. Mobile data is at AZD 0.15 per MB, activation: *300# ƏlaAY: has a 500 MB bonus and data at AZD 0.02 per MB and unlimited on-net calls: AZD 17, activation: *317# ƏlaSAAT, ƏlaGÜN and YeniDoğma only feature cheap calls and data is at AZD 0.15 per MB DaimOnline is a combo pack with data, with data default rate is at AZD 0.02 per MB and on-net calls : DaimOnline 6: 3 GB, 50 on-net mins: AZN 6 - activation: *306# DaimOnline 10: 5 GB, 100 on-net mins, free WhatsUp, Instagram, Facebook: AZN 10 - activation: *310# Klass is their combo pack with domestic mins, data and free WhatsUp texting, data overuse is at AZD 0.02 per MB; Klass 5: 500 MB, 100 mins,: AZN 5 - activation: *205# Klass 10: 2 GB, 350 mins: AZN 10 - activation: *210# Klass 15: 5 GB, 500 mins: AZN 15 - activation: *215# Klass 25: 15 GB, 1050 mins: AZN 25 - activation: *225# Klass 50: 20 GB, 3000 mins: AZN 50 - activation: *250# To all plans above you can add data packages. You can change plans anytime for AZN 1-2 depending on plan. Check included balances by *100# for free. Data feature packages[] They have a variety of internet packages to be added to the plans above for extra data: Data Time Price Activation unlimited 1 hour (#) AZN 0.50 *570*50# 100 MB 1 day AZN 0.50 *444*100# 250 MB AZN 0.75 *444*250# 500 MB AZN 1 *444*500# 300 MB 7 days AZN 2 *444*300# 600 MB AZN 3 *444*600# 60 MB 15 days AZN 1 *444*60# 500 MB 30 days AZN 3 *444*05# 1 GB AZN 5 *444*1# 2.5 GB AZN 8 *444*025# 5 GB AZN 10 *444*5# 10 GB AZN 15 *444*10# 20 GB (§) AZN 25 *444*20# 50 GB AZN 30 *444*050# (#) = hourly package can only activated once per day 1am-7pm. Check status by *570#, tethering is banned, speed is capped at 4 Mbit/s. (§) = 20 GB pack is only valid 1am until 10am, internet speed is up to 2 Mbit/s. To check the balance of the package dial *444#. To renew current package ahead of time, dial *444#555#. All daily, weekly and monthly packages auto-renew. To deactivate auto-renewal of the package, dial *444#0#. Having booked a package you can get access to Bakcell's WiFi in Baku and surf for free (see below). They also sell dedicated packages for Instagram and YouTube use. Bakcell WiFi[] Bakcell's free WiFi service is available to all Bakcell subscribers and visitors with foreign numbers who are using the Bakcell network. There are no other requirements for using the WiFi service. It's available in more than 200 different locations: restaurants, hotels, cafes, parks (locator) in Baku, Sumgait and Shusha. You will need to connect to Bakcell_Free_WiFi access point. Submit your telephone number in 994XXXXXXXXX format on the landing page, click “Get password”, and wait for the text message. Use the password from SMS and enter in in the “Your Password” box and press, “Log in”. You will have free access to the internet for 1 hour. After 1 hour, you will be disconnected from the WiFi network. To re-establish your connection, you need to log-in again on landing page. Passwords are reusable during the day. Your internet connection speed is limited to 2 Mbit/s. Data-only SIM[] For tables and modems they offer a free data-only and SMS card and these packages for 30 days: 11 GB: AZN 15 , activation: *134*111# 50 GB: AZN 30 , activation: *134*512# All packages are for one month, they will auto-renew if you have enough balance. To stop: *134#0#, to check data balance: *134#559#. Default and overuse rate is AZN 0.01 per MB. Speeds are up to 225 Mbit/s on 4G/LTE+ networks. To know your number, dial *666#. More inf'''
