then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Contents 1 Basics 2 Christmas Island 2.1 Speedcast 2.2 Telstra 2G 3 Cocos (Keeling) Islands 3.1 CRC 4 Norfolk Island 4.1 Norfolk Telecom (NT, 3G/4G Voice/Data service) 4.1.1 WiFi hotspots 4.1.2 More info 4.2 Glonet (4G-only data service) 4.2.1 Data-only SIM 4.2.2 More info 5 Further external territories 5.1 Lord Howe Island 5.2 Macquarie Island Basics[] The Australian external territories are small island territories in the Indian and Pacific Oceans attached to Australia, but not served by Australian operators: Christmas Island Cocos (Keeling) Islands Norfolk Island This is added with information about: Macquarie Island in Antarctica Lord Howe Island in the Tasman Sea These islands used to be without major internet connections. This has changed since the Australian Government installed nbn Sky Muster satellite services to cover remote areas in 2015-8. Sky Muster has improved connectivity to these islands a lot as 4G/LTE networks are being deployed. The availability of SIM cards to travellers is still quite new on some islands and 4G coverage typically only cover certain parts of the Islands. That's why these territories were moved from our Blacklist to our Greylist. You still might think of using a satellite phone to be sure of connection. Christmas Island[] Christmas Island is located in the Indian Ocean, around 350 km south of Java and Sumatra and around 1,550 km north-west of the closest point on the Australian mainland. It has an area of 135 sq km and a population of 1,800 residents. CiFi CiFi is a locally based & supported telecommunications company and is the primary provider of internet & mobile services in Christmas Island since 2020. CiFi is also the only provider to exclusively use the Vocus ASC subsea cable for backhaul, providing to the community & tourists high speed, low latency internet services which are available in many locations throughout the island. CiFi's 4G/5G mobile network is the only one in operation on the island, and is also the largest, servicing areas both in the township & well out into the jungle areas. Read more: https://cifi.com.au/ Speedcast[] Speedcast withdrew all services from the Christmas Island market in 2021. Telstra 2G[] Telstra also provides limited cellular coverage on Christmas Island, restricted only to the developed (small town/residential/airport) areas of the island. There is zero coverage within the national park itself, on the hiking trails and at the beaches. This is a 2G 900 MHz mobile network operated by Telstra that can only be used for voice and SMS with no mobile data coverage. Free wifi on the island is limited to the airport (only on flight days) although most hotels have included WiFi that runs over NBN satellite connections. This situation was expected to improve in 2019 when the branch off to the INDIGO-West submarine cable was completed linking the Christmas Islands to Perth however due to the high transfer rates only a handful of government connections use the new link with no residential services offered. <a href="https://static.wikia.nocookie.net/paygsimwithdata/images/a/a1/Flag_of_the_Cocos_%28Keeling%29_Islands.svg.png/revision/latest?cb=20170413235431" class="mw-file-description image"><img alt="Flag of the Cocos (Keeling) Islands.svg" src="https://static.wikia.nocookie.net/paygsimwithdata/images/a/a1/Flag_of_the_Cocos_%28Keeling%29_Islands.svg.png/revision/latest/scale-to-width-down/220?cb=20170413235431" decoding="async" loading="lazy" width="220" height="110" class="thumbimage" data-image-name="Flag of the Cocos (Keeling) Islands.svg.png" data-image-key="Flag_of_the_Cocos_%28Keeling%29_Islands.svg.png" data-relevant="1" data-src="https://static.wikia.nocookie.net/paygsimwithdata/images/a/a1/Flag_of_the_Cocos_%28Keeling%29_Islands.svg.png/revision/latest/scale-to-width-down/220?cb=20170413235431" /></a> Cocos (Keeling) Islands[] The Cocos (Keeling) Islands are a small archipelago approximately midway between Australia and Sri Lanka and closer to the Indonesian island of Sumatra. The territory consists of two atolls made up of 27 coral islands, of which only two West Island and Home Island are inhabited by around 600 inhabitants. IOTT 4G IOTT withdrew all services from the Cocos Keeling market in June 2024. CRC[] <a href="https://static.wikia.nocookie.net/paygsimwithdata/images/8/8c/1449548410.png/revision/latest?cb=20170414073026" class="mw-file-description image"><img alt="1449548410" src="https://static.wikia.nocookie.net/paygsimwithdata/images/8/8c/1449548410.png/revision/latest/scale-to-width-down/328?cb=20170414073026" decoding="async" loading="lazy" width="328" height="57" class="thumbimage" data-image-name="1449548410.png" data-image-key="1449548410.png" data-relevant="0" data-src="https://static.wikia.nocookie.net/paygsimwithdata/images/8/8c/1449548410.png/revision/latest/scale-to-width-down/328?cb=20170414073026" /></a> The Community Resource Centre (CRC) sells WiFi vouchers for hotspots around the islands. All vouchers are for a single device only and are per time and volume (which ever expires first). The vouchers are in following denominations: 1 hour (200 MB) for AU$ 4.95 3 hours (350 MB) for AU$: 9.95 1 day (750 MB) for AU$ 19.95 1 week (5 GB) for AU$ 64.95 Vouchers are sold at CRC on West Island, colocated with tourism info, open Mon-Fri 8am-3pm, Sat 10am-3pm. Pre-booking is recommended. They can also arrange your vouchers to be delivered at your accommodation before you arrive. For more info see their info sheet. WiFi hotspots are available at the Cocos (Keeling) Islands Community Resource Centre, Maxie’s By The Sea, Cocos Club, Cocos Cottages, Cocos Beach Motel, Cocos Village Bungalows, Cocos Castaway, My Island Home, The Donga and the main shelter on Direction Island. <a href="https://static.wikia.nocookie.net/paygsimwithdata/images/6/67/Flag_of_Norfolk_Island.svg.png/revision/latest?cb=20170317143117" class="mw-file-description image"><img alt="Flag of Norfolk Island.svg" src="https://static.wikia.nocookie.net/paygsimwithdata/images/6/67/Flag_of_Norfolk_Island.svg.png/revision/latest/scale-to-width-down/220?cb=20170317143117" decoding="async" loading="lazy" width="220" height="110" class="thumbimage" data-image-name="Flag of Norfolk Island.svg.png" data-image-key="Flag_of_Norfolk_Island.svg.png" data-relevant="1" data-src="https://static.wikia.nocookie.net/paygsimwithdata/images/6/67/Flag_of_Norfolk_Island.svg.png/revision/latest/scale-to-width-down/220?cb=20170317143117" /></a> Norfolk Island[] Norfolk Island is a small island in the Pacific Ocean located between Australia, New Zealand and New Caledonia. It has around 1,800 inhabitants living on a total area of about 35 km2. Currently there is a main 3G/4G operator for voice/data and a 4G/LTE operator for data on the island: Norfolk Telecom (NT) 3G/4G (LTE) Glonet 4G/LTE only A new more powerful satellite access was launched recently and most of the homes are still connected by landlines. In 2017 the Australian nbn SkyMuster satellite service started on the Norfolk Island. It delivers broadband access to homes and businesses in regional and remote Australia via two state-of-the-art satellites. This usually involves the installation of a satellite dish, a modem and a power supply in a private home or business free of charge. Typically speeds of 8-20 Mbps are reached and prices start at about AU$ 35 per month for 15 GB. Norfolk Telecom (NT, 3G/4G Voice/Data service)[] <a href="https://static.wikia.nocookie.net/paygsimwithdata/images/b/b2/Telecom.gif/revision/latest?cb=20170317135243" class="mw-file-description image"><img alt="Telecom" src="https://static.wikia.nocookie.net/paygsimwithdata/images/b/b2/Telecom.gif/revision/latest/scale-to-width-down/263?cb=20170317135243" decoding="async" loading="lazy" width="263" height="48" class="thumbimage" data-image-name="Telecom.gif" data-image-key="Telecom.gif" data-relevant="0" data-src="https://static.wikia.nocookie.net/paygsimwithdata/images/b/b2/Telecom.gif/revision/latest/scale-to-width-down/263?cb=20170317135243" /></a> Norfolk Telecom is the government-owned telco which operates a 3G network on 850 MHz and 4G network on 700 Mhz (Band 28). It has recently started offering a "Tourist Mobile Plan" initially valid for 21 days that includes: 2 GB data 25 minutes to local landlines 25 minutes to local mobiles 5 minutes to Australia or New Zealand 100 local SMS It costs AU$ 30 and is available from following stores: Norfolk Telecom The Trading Post Ina'ai Entertainment Paw Paw’s Pump Shed Norfolk Post Pete’s Place Recharge vouchers are available from Norfolk Telecom, all service stations and supermarkets in differing denominations. An additional 2 GB data costs $20. WiFi hotspots[] Alternatively, Norfolk Telecom also operates a network of WiFi hotspots throughout the island for internet connections. To logon you need to buy a voucher. They are available from Norfolk Telecom and many independent shops, supermarkets, visitor centre, petrol stations and cafes. Speeds are limited to around 5 mbps, Available sizes are: for 1 hour: AU$ 5 for 5 hours: AU$ 20 for 10 hours: AU$ 35 1 GB valid for 6 months: AU$ 25 2 GB valid for 6 months: AU$ 40 4 GB valid for 6 months: AU$ 70 More info[] Official website: https://www.ni.net.nf/ Glonet (4G-only data service)[] <a href="https://static.wikia.nocookie.net/paygsimwithdata/images/2/2d/46507720_260376254598662_2168573582395834368_n.jpg/revision/latest?cb=20191101104423" class="mw-file-description image"><img alt="46507720 260376254598662 2168573582395834368 n" src="https://static.wikia.nocookie.net/paygsimwithdata/images/2/2d/46507720_260376254598662_2168573582395834368_n.jpg/revision/latest/scale-to-width-down/220?cb=20191101104423" decoding="async" loading="lazy" width="220" height="220" class="thumbimage" data-image-name="46507720 260376254598662 2168573582395834368 n.jpg" data-image-key="46507720_260376254598662_2168573582395834368_n.jpg" data-relevant="0" data-src="https://static.wikia.nocookie.net/paygsimwithdata/images/2/2d/46507720_260376254598662_2168573582395834368_n.jpg/revision/latest/scale-to-width-down/220?cb=20191101104423" /></a> GloNet Pty Ltd. launched Norfolk Island’s first 4G/LTE mobile data service in November 2018. GloNet Pty Ltd is a local initiative, owned locally and employing locals. The 4G/LTE network operates on Band 3 (1800 MHz). This service is now available for residents and visitors on the island. Initially 4G/LTE data is operational in the Burnt Pine and Kingston areas, however ACMA data shows approximately 8 towers including coverage in Cascade Bay, Ball Bay, Norfolk I Airport and from Mount Pitt. Data-only SIM[] Customers with 4G/LTE compatible phones or tablets, can purchase a SIM card or alternatively a dongle to get access to the service. It costs AU$ 50 for the SIM-only option with 3 GB of data including the SIM and is available for both visitors and residents. Currently only available from the official launch reseller by visiting their store: Norfolk Island Data Services (3B Taylors Rd, Burnt Pine 2899, Norfolk Island) More info[] Official website for NIDS: https://www.norfolkislanddataservices.com/4g-mobile-data Facebook page for GloNet. Pricing can be requested by contacting GloNet through this platform. Currently GloNet do not have their own website. However both the NIDS website and Facebook page provide adequate information. Further external territories[] Lord Howe Island[] On Lord Howe there is no mobile coverage. Telstra from Mainland Australia currently has a submission to install one 4G 700MHz tower on the island, this has been approved by the island Council however is still in the wider consul'''
