full_description = '''in: Asia, Country, 8/18, and 2 more Zain VIVA Bahrain Sign in to edit History Purge Talk (0) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> https://prepaid-data-sim-card.fandom.com/wiki/File:Bahrainona_(vocal).mp3 National Anthem Contents 1 Basics 1.1 Legalities and restrictions 1.2 Censorship 2 Batelco (Bahrain Telecom) 2.1 Availability 2.2 Data feature packs 2.3 Data-only SIM 2.4 Bahrain WiFi 2.5 More information 3 Zain 3.1 Availability 3.2 Data feature packs 3.3 Data-only SIM 3.4 More information 4 STC (formerly Viva) 4.1 Availability 4.2 Data feature packs 4.3 Data-only SIM 4.4 More information Basics[] Bahrain has three mobile network providers: Batelco Zain STC (formerly Viva) 2G/GSM is on 900 and 1800 MHz, 3G/UMTS on 2100 MHz and 4G/LTE on 1800 MHz (band 3) has started on all three operators. 4G/LTE is available on prepaid. All providers cover already 99% of the country by 4G/LTE in 2016 and give average download rates of more than 20 Mbps. The three competitors are very much neck on neck. Batelco has informed customers that its 2G network will be phased out by 31 December 2019. Legalities and restrictions[] Visitors can buy SIM cards in the agencies of the operators and authorized dealers, including at the airport. Since 2010 you must register your personal details showing a passport with the service provider. If you don't, your mobile phone will be cut off. Further restrictions on the sale of SIM cards were introduced in 2015. A regulation was issued that limits individuals from purchasing no more than 10 prepaid SIM cards from a single service provider. You must be present in person when registering SIM cards and providers must re-check the identity of all subscribers on annual basis. From 2017 this registration is strictly enforced. Biometric data like fingerprints are used for subscriber identification. SIM cards are available for sale directly from service providers, nowhere else. All existing anonymous SIM cards prior to July 2017 must be registered by March 2019. From 2017, all customers must register their fingerprint at the branded telco shop or authorized point of sale. Censorship[] Always have in mind that Bahrain is a country, where the internet is severely filtered or censored. It's labeled as "Enemy of the Internet" by Wikipedia. You don't have access to many usual sites, unless you install a VPN program/app before using. Batelco (Bahrain Telecom)[] Batelco is the national provider and the only landline/ADSL provider in the country. As in most cases, it has 2nd best coverage and is the most expensive at the same time. Batelco has informed customers that its 2G network will be phased out by 31 December 2019. Availability[] Their prepaid SIM card is called 'SimSim' and sold for BHD 3 or 6 in their shops: (Locator.) as weekly or monthly option (see below) Vouchers for refills are available for BHD 1, (2), 3, (4), 5, 10, 20 and (30) giving 2-100 days of validity. Refills in () are by electronic top-up only. To add value, type *125*<voucher PIN>#. To check balance, enter *122#. They sell different SimSim lines. You can choose between a weekly or monthly plan: weekly: starter: BHD 3 - renewal: BHD 1.5 - 100 dom. mins, 1 GB data for 7 days, activation: *200# monthly: BHD 6 - 500 dom. mins, 6 GB data for 30 days, activation: *660# Data feature packs[] Default and overuse rate is 0.70 BHD per MB. So you better buy these add-on data packages below for adding more data to the weekly or monthly plan: Data Price Activation 1 GB BHD 1 *911# 3 GB BHD 3 *922# 8 GB BHD 5 *933# 20 GB BHD 10 *944# To check data volume, type *888*1*1#. Data-only SIM[] Furthermore, they sell data-only SIM cards called "Prepaid Mobile Broadband". A mobile broadband starter is sold in two variations: 3 GB for 7 days: BHD 4 10 GB for 30 days: BHD 7 It can be refilled by these vouchers in 4G/LTE: Refill Data Period BHD 1 1 GB 3 days BHD 2 2 GB 7 days BHD 3 3 GB BHD 4 4 GB BHD 5 8 GB 14 days BHD 6 10 GB 30 days BHD 10 20 GB BHD 12 24 GB BHD 20 40 GB BHD 30 60 GB You have to activate the packages in your client's area. Speed will be throttled beyond the limit. Bahrain WiFi[] Batelco builds up a WiFi hotspot network in the kingdom. So far 20 hotspot locations have been established (for list scroll down). Everybody can enjoy 2 GB free every month by texting “BWIFI” to 88188. To connect as an Android user assign network SSID as Batelco Wi-Fi (Note: SSID is case sensitive), select security as 802.1x EAP from the drop down menu and select EAP Method as SIM from the drop down menu and Connect. iOS users are connected seamlessly. Additional usage will be deducted from your main threshold as a Batelco prepaid customer. Non-customers can buy vouchers on the Batelco WiFi portal: 1 hour: BHD 1 3 hours: BHD 2 24 hours: BHD 7 48 hours: BHD 12 More information[] APN: batelco.com Website in English: http://batelco.com/ Zain[] Zain based in Kuwait is the second carrier in Bahrain with a good coverage and similar prices. All prepaid data are on 4G/LTE too. Availability[] Their prepaid voice and data SIM card is called "eeZee" and sold for 1 BHD with a credit of BHD 1 in their shops, including at the airport. Locator Recharge vouchers are sold all over from BHD 0.500 to 30 giving a bonus of 10 - 25% from BHD 10 and 1-100 days of service validity. Like Batelco Zain's eeZee has a weekly or monthly base rate: weekly: BHD 1.5 - 100 dom. mins, 1.25 GB for 7 days, activation: *123*2# monthly: BHD 6 - 500 dom. mins, 7 GB for 30 days, activation: *123*1# Data feature packs[] Overuse rate is 20 fils per 100 KB. They offer these add-on packages for more data: 1 GB: BHD 1 2 GB: BHD 2 8 GB: BHD 5 20 GB: BHD 10 To subscribe type *123#. Data-only SIM[] Furthermore, they sell data-only SIM cards for 4G/LTE called e-GO with these starter packs: 3 GB for 7 days: BHD 4 10 GB for 30 days: BHD 7 20 GB for 30 days: BHD 10 To activate 4G/LTE dial *943#. The following 'unlimited' packages on 4G/LTE too can be activated on te-GO SIM cards. Note that every top-up voucher corresponds to a package and 'unlimited' is governed by a Fair Use Policy: Price FUP data Time BHD 1 1 GB 3 days BHD 2 2 GB 7 days BHD 4 4 GB 7 days BHD 5 8 GB 14 days BHD 6 10 GB 30 days BHD 10 20 GB 30 days BHD 20 40 GB 30 days BHD 25 50 GB 30 days BHD 30 60 GB 30 days When reached data quota, speed will be throttled to 256 kbps. More information[] APN, username and password: Internet Website in English: http://www.bh.zain.com STC (formerly Viva)[] <a href="https://static.wikia.nocookie.net/paygsimwithdata/images/e/ed/Stc_new.jpg/revision/latest?cb=20191221005119" class="mw-file-description image"><img alt="Stc new" src="https://static.wikia.nocookie.net/paygsimwithdata/images/e/ed/Stc_new.jpg/revision/latest/scale-to-width-down/160?cb=20191221005119" decoding="async" loading="lazy" width="160" height="160" class="thumbimage" data-image-name="Stc new.jpg" data-image-key="Stc_new.jpg" data-relevant="0" data-src="https://static.wikia.nocookie.net/paygsimwithdata/images/e/ed/Stc_new.jpg/revision/latest/scale-to-width-down/160?cb=20191221005119" /></a> new brand STC formerly called Viva is the 3rd and newest carrier coming from Saudi Arabia. It has the reputation of having the best network (LTE-Advanced/4G+) and lowest rates in the Kingdom. In December 2019 it was rebranded to STC for Saudi Telecom Company with a new logo. Availability[] The SIM card is available for BHD 1 and comes without credit preloaded, sold in their stores (locator), including the airport and at authorized dealers. 4G/LTE is enabled on all prepaid plans. You can check your balance by dialing *124#. Recharge cards are available for 500 fils, BHD 1, 3, 5, 10, 15, 25 and 30 valid for 1-100 days. Bonus is given for recharges of BHD 10 or more. Recharge by entering *100*<voucher PIN>#. To check balance, type *101#. You have a choice of a weekly or monthly plan starter pack sold at BHD 4 or 7: weekly: BHD 4 - renewal BHD 2, 125 dom. mins, 1.25 GB for 7 days, activation: *222*71# monthly: BHD 7 - 500 dom. mins, 8 GB for 30 days, activation: *222*45# Data feature packs[] <a href="https://static.wikia.nocookie.net/paygsimwithdata/images/1/1c/Viva.jpg/revision/latest?cb=20141017204347" class="mw-file-description image"><img alt="Viva" src="https://static.wikia.nocookie.net/paygsimwithdata/images/1/1c/Viva.jpg/revision/latest/scale-to-width-down/204?cb=20141017204347" decoding="async" loading="lazy" width="204" height="136" class="thumbimage" data-image-name="Viva.jpg" data-image-key="Viva.jpg" data-relevant="0" data-src="https://static.wikia.nocookie.net/paygsimwithdata/images/1/1c/Viva.jpg/revision/latest/scale-to-width-down/204?cb=20141017204347" /></a> old brand Default and overuse rate is 10 fils per 100 KB. They sell these monthly data packages to top-up: Data Price Activation 1 GB BHD 1.05 *81172*1# 3 GB BHD 3.150 *81172*3# 8 GB BHD 5.250 *81172*5# 20 GB BHD 10.500 *81172*10# Data-only SIM[] They sell data-only SIM cards on 4G/LTE called 'Prepaid Broadband' with this starter pack: 10 GB for 30 days: BHD 10.5 The following packages on 4G/LTE can be booked on these data-only SIM cards corresponding to the value of a top-up voucher: Price FUP data Time BHD 1 1 GB 3 days BHD 2 2 GB 7 days BHD 3 3 GB 7 days BHD 5 8 GB 14 days BHD 6 10 GB 30 days BHD 7 13 GB 30 days BHD 10 20 GB 30 days BHD 15 30 GB 30 days BHD 20 40 GB 30 days BHD 25 50 GB 30 days BHD 30 60 GB 30 days After reaching data quota, speed will be reduced. More information[] APN: viva.bh Website in English: https://www.stc.com.bh/ Categories Categories: Asia Country 8/18 Zain VIVA Community content is available under CC-BY-SA unless otherwise noted.'''
