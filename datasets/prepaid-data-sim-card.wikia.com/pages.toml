full_description = '''in: Country, 4/19, Movistar, and 2 more Claro Americas Argentina Sign in to edit History Purge Talk (0) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> https://prepaid-data-sim-card.fandom.com/wiki/File:Himno_Nacional_Argentino.mp3 National Anthem Contents 1 Basics 1.1 Regulations 1.2 Availability and recharges 1.3 Dialing rules 1.4 Mercosur roaming 2 Claro 2.1 Availability 2.2 Activation 2.3 Data rates 2.4 Data feature packs 2.5 Roaming 2.6 More info 3 Movistar 3.1 Availability 3.2 Default data rates 3.3 Data feature packs 3.4 Tourist SIM 3.5 Roaming 3.6 More info 4 Personal 4.1 Availability 4.2 Default data rates 4.3 Data feature packs 4.4 More info 5 Fiber Corp. (formerly Nextel) 6 Nuestro 7 Tuenti móvil (formerly Quam) Basics[] Argentina has 3 national operators: Claro (by América Móvil) Movistar (by Telefónica Spain) Personal (by Telecom Argentina) They three all have about the same market share. For being former state-owned company, Personal tends to have a better coverage in rural area but has very llimited prepaid plans compared to Movistar and Claro. In Buenos Aires area, Movistar has best coverage in Subte (subway) networks even in between stations (as of Jan. 2021). Although reliable free WiFi is available inside of each subway station, 2G and 3G is on 850 and 1900 MHz, so users from Europe and Asia need a "US-band" device. 4G/LTE is on AWS (1700/2100) MHz and B28 (700 APT). Data speed is much improved in recent years especially in areas with 4G availability, although in rural area you still find coverage of 2G only, and spotty coverage indoor even in Buenos Aires. According to OpenSignal's country report, Personal has the best overall perfomance in the country, while Movistar has the best 4G coverage at somewhat lower speeds in 2016. The first MVNOs started with Nuestro and Quam, now renamed in Tuenti móvil, but don't offer good data choices for visitors so far. Regulations[] Prepaid SIM cards were not registered until 2017. This has changed as operators need to verify and identify all mobile phone users via a central register with a view to reducing the trafficking of stolen handsets. The new rules require that the operators themselves must pay to 'develop, operate and manage' the register, which is being set after regulator Enacom ordered all mobile service providers to block equipment reported as lost or stolen. Enacom has informed prepaid mobile phone users that they have until 18 October 2018 to register their SIM cards or face disconnection. Since May 2017 all prepaid users have been obliged to provide ID (such as passport) and register their details when buying a new SIM card. Availability and recharges[] All three operators offer prepaid SIM cards (called chips in Argentina) and given out free at their branded store or sold in hundreds of shops around the city for around $50. Keep in mind that the SIM card needs to be registered wity your ID before use. Therefore, it is recommended to go to the respected branded store/office with your passport as you can get free SIM card anyways. Claro and Movistar allow you to register online by uploading passport image (Movistar tourists). You can recharge your SIM at many kiosk, supermarket, drugstores in towns. Supermarket and drugstore chains recharge without comission, but small independent stores may charge you additional $5-10. You need to look for a sign saying 'cargo virtual' or orange/blue vending machines in kiosks. At these machines you need to enter your phone number and feed it with the bills of the amount you want to top-up. A small receipt slip is printed out and your balance is added instantly. All recharge is confirmed by a SMS. To top-up by credit card use the website of the provider. It may happen that the credit is not added immediatetly. In these cases keep the confirmation receipt and turn to a customer service hotline or store. Note that all prices quoted in $ are in Argentine Peso (AR$), not US$. All prices now include all taxes. Due to expected hyperinflation in 2021, you can expect prices in AR$ to rise continuously without prior notice. Dialing rules[] For calls and SMS Argentina has somewhat unusual dialing rules: Mobile phone numbers in Argentina are preceded by a two digit number, '15.' If you’re calling a mobile number from a landline, you’ll have to dial '15' first (add the area code before the '15' as necessary). However, if you’re calling a cell phone from another cell phone, you don’t need to dial '15'. Not to be confused with area code of Grand Buenos Aires '11.' When dialing an Argentine cell phone from another country, dial your international exit code, then 54, then 9, then the area code without the 0, then the number – leaving out the 15. It's confusing. Mercosur roaming [] The countries of the Mercosur Argentina, Brazil, Paraguay and Uruguay have agreed in 2019 to implement a "roam like at home" scheme similar to the EU. After this deal is approved by all local parliaments operators must not charge additional fees for roaming between the bloc’s member states, and must apply the same tariff conditions that apply in the user’s home state for local outgoing calls, SMS and data. As of January 2021 this agreement is not yet implemented. Claro[] Claro (formerly called CTI Movil) owned by Mexican América Móvil is still market leader by a small margin amd has good coverage: 2G 3G and 4G coverage maps. For 4G/LTE mainly band 4 on 1700 MHz is used. Availability[] You can buy prepaid SIMs (called chips) at Claro Customer Care Centers (shop locator), kiosks, pharmacies, service stations, supermarkets, any outlets or shops where you can see the logo of Claro. Top-up with vouchers calles Tarjetas Prepagas sold everywhere by texting the voucher code to 444. Or do a virtual recharge available in many kiosks and supermarkets starting at $5. Check balance by *611#. As a bonus for a top-up of $50 100 MB for 5 days, of $100 250 MB for 7 days or of $300 400 MB for 7 days are given out. Activation[] (The following procedure assumes the purchase of an unactivated Claro SIM card at a convenience store, and the customer is required to activate the line on his own.) To activate the line, put the SIM card into the phone and turn it on. Note that the phone number that is printed on the package of the SIM card; it will be required during activation process.. The phone will start receiving a number of SMS messages. One of them will read as follows: "Si no tenes DNI argentino, te invitamos a completar el formulario que esta en claro.com.ar/simcheckin para activar tu linea con pasaporte." Which means that for users that do not have Argentine ID (ie. visitors), fill out the form on claro.com.ar/simcheckin to activate using passport information. Go to the site http://claro.com.ar/simcheckin (the site is partially in English) and fill out the following information: Phone number listed on the SIM card package Passport number Email address Departure date (which date you are leaving Argentina) Address while staying in Argentina Photo of your passport information page Photo of yourself (selfie) while holding the passport information page Answer the CAPTCHA, which consists of a Spanish word and 8 icons; you need to select the icon that corresponds to the Spanish word. (Use Google Translate or ask a hotel staff for help.) Once everything is entered and submitted, the site will display "Su mensaje ha sido recibido con el numero de caso / You message has been received with case number xxxxxx". If any of the information is incorrect, you will get a SMS in Spanish indicating what is missing, in which you will need to resubmit the form above. Data rates[] Default data is (0-24h per calendar day) flat of 50 MB for $20, beyond $0.18 per MB and free WhatsApp (no VoIP) in Plan prepago. Data feature packs[] The following data packages can be added: Data Time Price Activation 1 GB 3 days $120 1GB3D 1 GB 7 days $170 1GB7D 1 GB 30 days $300 1GB30D 2 GB 7 days $250 2GB7D 2 GB 15 days $320 2GB15D 3 GB 20 days $390 3GB20D 4 GB 7 days $410 4GB7D 4 GB 30 days $550 4GB30D 6 GB 30 days $700 6GB30D To activate text the code to 454 or select by *989#. Or login at simpe.claro.com.ar [1] Roaming[] To use in the USA, Uruguay, Paraguay, Brazil and Chile Claro has issued these two roaming packs with free WhatsApp included: 300 MB for 7 days: $200; for activation text '300MB' to 252 1 GB for 30 days: $500; for activation text '1GB' to 252 More info[] APN: igprs.claro.com.ar Username: clarogprs Password: clarogprs999 Website in Spanish: http://www.claro.com.ar/ Help website: https://imprimirfactura.online/imprimir-factura-claro-argentina/ Movistar[] Movistar is owned by Spanish Telefónica and still the No.2 in the country what customers are concerned. It has the widest 4G/LTE coverage in the country covering 68% of population in 2016 on bands 4 and 28. 4G service is available in more than 380 locations, including all 23 provincial capitals and the national capital. Availability[] Its prepaid SIM card called Chip is given out free in their shops and outlets.They are also often available from kiosks for around $50, but you still need to visit their shops to activate with a passport. For recharges you will be awarded bonuses: For a $50 reload you get 50 MB, for $100 100 MB and for $200+ 500 MB all valid only for 1 day, plus 7 to 30 days unlimited call to Movistar, and free WhatsApp. Note these bonus are ´promotion´ and constantly changing. To check balance, send any SMS to 444 or dia *444# Default data rates[] Plan Prepago: daily data pack at $20 Movistar has daily (0-24h per calendar day) 'flat' rates for prepaid called Internet Día including a 50 MB block that lasts until midnight. When you start using internet, you will be billed automatically for the first block and will receive a SMS saying “Ya estas navegando con INTERNET x DÍA PLUS! Tenes 50MB para navegar hasta las 0 hs por $20. After you used up second 50 MB block, will get another SMS from 772 Alcanzaste los MB disponibles. Responde SI y recuperala x $20 cada 50 MB con Internet por dia Plus y segui navegando hasta las 0hs. Just reply SI to buy an additional block of 50 MB. Data feature packs[] Following data packages are offered: Data Time Voice Social Media Price Activation 200 MB 1 day $45 D1MB 2 GB 2 days $100 D2GB 2 GB 3 days $140 D3GB 2 GB 5 days $180 D5GB 1 GB 7 days $140 INTERNET 2 GB 7 days 1 GB $200 D7GB 3 GB 10 days 1 GB $300 3GBD10 3 GB 30 days 1 GB $520 3GBD30 5 GB 30 days 5 GB $660 5GBD30 1.5 GB 7 days 60 mins $240 SUPER 2 GB 80 mins $265 ULTRA 2 GB 30 days 100 mins $600 MES All packages come with free WhatsApp (no Voip). Social media includes Facebook, Instagram, Twitter and TikTok. For activation text code to 2345 or subscribe at https://web.movistar.com.ar Armá tu Pack Movistar offers more flexible prepaid plan that you can choose any combination of the data amount of 350MB, 1, 2, 3 or 5GB, voice call to any carrier at 10, 100 or 200 minutes, and duration of 1, 3, 7, 10, 15 or 30 days. You can subscribe it at movistar website at https://web.movistar.com.ar As there are so many choices, it is not possible list all plan here, but generally are better deals than data packages above. Remind you although this Arma tu Pack is advertised as only available at ¨Movistar app¨, which is not available from non-Argentine app store, you can still access it from its website above. Tourist SIM[] Movistar has two special packs that can be chosen by tourists (automatic renewal): Week (for 7 days): $230, 2 GB (WhatsApp unlimited) + 1 GB free for social networks and Spotify. To activate, text 'D7GB' to 1234 or dial *611#. Month (for 30 days): $550, 3 GB (WhatsApp unlimited) + 1 GB free for social networks and Spotify. To activate, text '3GBD30' to 1234 or dial *611#. You can buy a SIM card at any kiosk or sto'''
