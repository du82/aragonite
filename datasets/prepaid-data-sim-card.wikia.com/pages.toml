full_description = '''in: Asia, 8/18, Airtel, and 2 more Telenor Axiata Bangladesh Sign in to edit History Purge Talk (0) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> https://prepaid-data-sim-card.fandom.com/wiki/File:Amar_Shonar_Bangla_(Vocal).mp3 National Anthem Contents 1 Basics 1.1 Operators 1.2 Frequencies 1.3 Registration 1.4 Top-ups 1.5 Censorship 1.6 Taxes 1.7 No short-time packages 2 TeleTalk (Amader Phone) - Teletalk Bangladesh Ltd 2.1 Availability 2.2 Data feature packages 2.3 New Exclusive Regular Data Packs 2.4 Regular Data Packs 2.4.1 The Price Is Including All Taxes. 2.4.1.1 You Can Avail Your Desired Data Pack Through Any Of The Following Methods 2.5 Combo Offers ( Includes Voice Call, SMS & Internet ) 2.5.1 Modality: 2.5.2 More info 3 GP - Grameenphone Ltd 3.1 Availability 3.2 Data feature packages 3.3 More information 4 Banglalink - Banglalink Digital Communication Company Ltd 4.1 Availability 4.2 Data featured packages 4.3 More Information 5 Robi - Robi Axiata Ltd 5.1 Availability 5.2 Robi Data feature packages 5.3 More information Basics[] Operators[] There remain 4 mobile network operators in Bangladesh according to BTRC ( btrc.gov.bd ) Logo of Mobile Network in Bangladesh TeleTalk (state-owned - Under Ministry of Post & Telecommunication) Grameenphone (joint venture with Telenor) Banglalink (by VEON - a subsidiary of Telenor) Robi Axiata (by Malaysian Axiata Group and Indian Bharti Airtel Ltd) The 3 biggest private operators GrameenPhone, Banglalink and Robi have more than 95% of all customers. State owned TeleTalk is now growing. Another provider called Citycell based on GSM-incompatible CDMA was shut down in 2016/7 for not paying its dues. Airtel Bangladesh merged into Robi. Frequencies[] With all operators 2G is on 900 and 1800 MHz. 3G up to HSPA+ on 2100 MHz is still in the population centers mostly. In 2017 the regulator has made all licenses technology-neutral and will give out new spectrum in 2018. The three operators Grameenphone, Robi-Airtel and Banglalink have started 4G/LTE in February 2018. Registration[] To purchase a SIM card, the official legal requirements are a registration with: one or two passport size color photographs photo copy of the passport and visa of Bangladesh There are some shops or street vendors who will not ask for it. But by law it's required and you should be ready to show and provide it. The price for a SIM card is usually between 100 and 500 BDT. After getting out from the airport exit door, SIM cards may be bought from snack shops located outside the airport. Alternatively, you may visit any top-up or service center of the mobile operators. Wherever you go, you will find within 100 meters some mobile SIM card and top-up vendors. In 2015 a SIM registration system has been established. Bangladeshis can send their national ID number by SMS. Foreigners should go to the shops for registration showing their passport/visa. All unregistered SIM cards are to be blocked and discontinued after an April 30th, 2016 deadline. Top-ups[] You can go to almost any phone shop to top-up prepaid credit. You don’t have to go to the provider whose network you’re using. Some corner shops also do top-ups. The usual phrase used for topping-up your phone in Bangladesh is ‘flexi-load' for GP, 'TeleCharge' for Teletalk, 'i Top UP' for Banglalink & 'EasyLoad' for Robi. Censorship[] In November 2015 the government blocked social media and messenging apps like Facebook, Viber, Whatsapp, Line and some more on all providers for a few days because of security concerns. Taxes[] Unfortunately the providers display rates with or without taxes. From 2017 add at total of 21% taxes (15% VAT sales tax and 5% telecom tax plus 1% supplementary duty) to all given prices of Airtel and Teletalk, while in Grameenphone's, Robi's and Banglalink's rates taxes are already included. No short-time packages[] The Bangladesh Telecommunication Regulatory Commission has scrapped all voice and data packages with up to six days validity. All mobile operators were asked to implement the BTRC directive, which states that all voice/data packages must have validity of between seven and 30 days, from 9 December 2018. Tourist SIM Card in Bangladesh: Bangladeshi operators also offer tourist SIM cards at airport. SIM Card Sales Location on Dhaka Airport is given below: GP Sales Point Airport: Map: https://goo.gl/maps/2Dstctx65zQhYwNy5 Robi Sales Point Airport: Address: robi.com.bd/en/personal/customer-service Teletalk Sales Point Airport: Phone: +8801550157707 Map: https://goo.gl/maps/zSC4nHBRQSvAjZ6BA Banglalink Sales Point Airport: Map: https://goo.gl/maps/nUJeaQLSqYx8iuTE7 TeleTalk (Amader Phone) - Teletalk Bangladesh Ltd[] Teletalk Bangladesh Ltd., brand name Teletalk (Bengali: টেলিটক) is a state-owned mobile phone company. It's the smallest operator of all mobile phone services in Bangladesh with a 2% market share caring for only 6.78 million out of 180 million mobile users. Teletalk is the first operator to provide unlimited validity on internet plan. Teletalk is the 1st operator to provide 5G (test transmission) in bangladesh since 2021. Teletalk provides internet & voice sevice at cheapest rate. It's service is not as good as others but trying to improve regularly. But those traveller's who want to visit Sundarban, Dublar Char Island, Katka Sea Beach, Jamtola Beach or Remote HillTrack area must carry a Teletalk SIM Card because in some areas there are no other networks present except Teletalk.<img style="" src="https://static.wikia.nocookie.net/paygsimwithdata/images/b/bd/Logo_TBL.jpg/revision/latest/scale-to-width-down/185?cb=20230711084513" title="Logo TBL.jpg (58 KB)" class="thumbimage" alt="" height="81" width="185" data-image-name="Logo TBL.jpg" data-image-key="Logo_TBL.jpg" data-relevant="1">Also in most tourist spots of Rangamati, Bandarban, Khagrachhari Hill area, Only Teletalk and Robi (another operator) has good coverage, Even country's #1 operator GrameenPhone has no coverage there. So you can carry a TeleTalk sim card as a secondery SIM. <a href="https://static.wikia.nocookie.net/paygsimwithdata/images/d/d9/Advertisement_Banner_of_Bangladeshi_Mobile_Phone_-_SIM_Card_operator_Teletalk_%28AmaderPhone%29.jpg/revision/latest?cb=20220707134006" class="mw-file-description image"><img alt="Advertisement Banner of Bangladeshi Mobile Phone - SIM Card operator Teletalk (AmaderPhone)" src="https://static.wikia.nocookie.net/paygsimwithdata/images/d/d9/Advertisement_Banner_of_Bangladeshi_Mobile_Phone_-_SIM_Card_operator_Teletalk_%28AmaderPhone%29.jpg/revision/latest/scale-to-width-down/180?cb=20220707134006" decoding="async" loading="lazy" width="180" height="277" class="thumbimage" data-image-name="Advertisement Banner of Bangladeshi Mobile Phone - SIM Card operator Teletalk (AmaderPhone).jpg" data-image-key="Advertisement_Banner_of_Bangladeshi_Mobile_Phone_-_SIM_Card_operator_Teletalk_%28AmaderPhone%29.jpg" data-relevant="1" data-src="https://static.wikia.nocookie.net/paygsimwithdata/images/d/d9/Advertisement_Banner_of_Bangladeshi_Mobile_Phone_-_SIM_Card_operator_Teletalk_%28AmaderPhone%29.jpg/revision/latest/scale-to-width-down/180?cb=20220707134006" /></a> Teletalk Bangladesh Limited is a public limited company, registered under the Registrar of the Joint stock companies of Bangladesh. Total shares owned by the Government of the Peoples Republic of Bangladesh. They continue to grow and engage our customers through our clear commitment to offering high quality products and services as well as leading customer retention and loyalty programmers. Teletalk continues to be a part of the revolution that’s connecting millions of Bangladeshi people and around the world. Teletalk Bangladesh limited was established keeping a specific role in mind. Teletalk has forged ahead and strengthened its path over the years and achieved some feats truly to be proud of, as the only Bangladeshi mobile operator and the only operator with 100% native technical and engineering human resource base, Teletalk thrives to become the true people’s phone – “Amader Phone”. 61% of Its BTS is 4G. <a href="https://static.wikia.nocookie.net/paygsimwithdata/images/0/05/Logo_light.png/revision/latest?cb=20230711084717" class="mw-file-description image"><img alt="Logo light" src="https://static.wikia.nocookie.net/paygsimwithdata/images/0/05/Logo_light.png/revision/latest/scale-to-width-down/388?cb=20230711084717" decoding="async" loading="lazy" width="388" height="194" class="thumbimage" data-image-name="Logo light.png" data-image-key="Logo_light.png" data-relevant="1" data-src="https://static.wikia.nocookie.net/paygsimwithdata/images/0/05/Logo_light.png/revision/latest/scale-to-width-down/388?cb=20230711084717" /></a> Availability[] Their SIM cards can be bought at their Customer Care Centers (list) for 150 BDT plus tax. Default pack is called Sagotom (Welcome in English), but many other packs are available too. They differ slightly for the default rate, but the same packages can be added to all lines. You can top-up by voucher of Tk. 20-1000 giving 60-365 days of validty or recharge from myteletalk app or online using a debit / credit card. Check balance by *152# or on MyTeletalk App Data feature packages[] Default rate for Projonmo is Tk. 0.01 per 30 KB. They have a multidude of data plans available, that are on 3G/4G too where available: Unlimited Validity Data Packs Recharge 127 tk to get 6GB for lifetime validity. Recharge 309 tk to get 26GB for lifetime validity. New Exclusive Regular Data Packs[] Volume & Price Validity USSD Activation Short Code Recharge to Activate Comments Prepaid Postpaid 1GB @Tk.21 3 Days *111*534# E21 E21 Tk. 21 1GB @Tk.27 7 Days *111*27# E27 F01 Tk.27 1GB @Tk.49 30 Days *111*49# DPSS1 F02 Tk.49 2GB @Tk.93 30 Days *111*93# E93 F03 Tk.93 3GB @Tk.44 5 Days *111*44# P44 F44 Tk.44 Data not Carry Forward 3GB @Tk.66 10 Days *111*66# E66 F04 Tk.66 10GB @Tk.97 10 Days *111*97# E97 F05 Tk.97 Data not Carry Forward 25GB @Tk.198 10 Days *111*198# E198 F06 Tk.198 Data not Carry Forward 30GB @Tk.344 30 Days *111*344# SP30 FP30 Tk.344 Data not Carry Forward Regular Data Packs[] Volume & Price Validity USSD Activation Short Code Recharge to Activate Comments Prepaid Postpaid 100 MB @ Tk.9 5 Days *111*501# D51 F51 Tk.9 500 MB @ Tk.26 30 Days *111*503# D82 F82 Tk.26 3.5 GB @ Tk.78 10 Days *111*511# D58 F58 Tk.78 3 GB @ Tk.139 30 Days *111*531# D31 F21 Tk.139 5 GB @ Tk.201 30 Days *111*532# D20 F20 Tk.201 10 GB @ Tk.239 30 Days *111*550# D21 F22 Tk.239 15 GB @ Tk.129 7 Days *111*551# D22 F9 Tk.129 20 GB @ Tk.301 30 Days *111*552# D26 F28 Tk.301 45 GB @ Tk.445 30 Days *111*445# P445 F445 Tk.445 The Price Is Including All Taxes.[] You Can Avail Your Desired Data Pack Through Any Of The Following Methods[] Recharge exactly the given amount. Dial the USSD activation code Write the short code in SMS option and send to 111 Combo Offers ( Includes Voice Call, SMS & Internet )[] SL Minute SMS Data Offer Price Validity USSD Code SMS Code 1 25 10 1 GB Tk. 33 4 Days *111*106# C6 2 55 50 1 GB Tk. 50 7 Days *111*102# C2 3 150 120 1.2 GB Tk. 101 30 Days *111*103# C3 4 250 300 5 GB Tk. 199 30 Days *111*104# C4 5 100 50 10 GB Tk. 209 30 Days *111*107# C7 6 370 20 2 GB Tk. 224 30 Days *111*108# C8 7 350 100 10 GB Tk. 299 30 Days *111*105# C5 8 490 50 5 GB Tk. 297 30 Days *111*109# C9 9 500 500 12 GB Tk. 399 30 Days *111*110# C10 10 800 150 35 GB Tk. 548 30 Days *111*111# C11 11 900 100 40 GB Tk. 598 30 Days *111*112# C12 12 1000 250 50 GB Tk. 648 30 Days *111*113# C13 Modality:[] All Prepaid & Postpaid subscribers are eligible to avail these offers. Subscriber can activate these data packs by typing the respective shortcode and send SMS to 111 (Free of charge) or by dialing the USSD code. Prepaid customers can also activate the desired data pack throu'''
