 3.6 Data and speed add-ons 3.7 Other data related add-ons (speed/technology) 3.8 EU roaming (roam like at home not available to tourists) 3.9 Inactivity fee 3.10 More information 4 Drei Austria ("3") 4.1 Availability 4.2 Registration 4.3 Default rate 4.4 Mobile plans (Wertkarte zum Telefonieren) 4.5 Data-only plans (Drei Wertkarte zum Surfen) 4.6 Data add-ons 4.7 up³ - app based hybrid prepaid subscription 4.8 up³ data add-ons 4.9 up³ other data related add-ons (speed/technology) 4.10 EU roaming 4.11 More information 5 Yesss! (by A1) 5.1 Availability 5.2 Wertkarte vs Vertrag 5.3 Registration 5.4 Default rate 5.5 Mobile plans 5.6 Special mobile plans 5.7 Data-only plans 5.8 Data add-ons (30 days) 5.9 Other Data add-ons 5.10 Other data related add-ons (speed/technology) 5.11 International roaming (data roaming must be enabled first before usage) 5.12 More info 6 HoT - Hofer Telekom (on Magenta) 6.1 Availability 6.2 Registration 6.3 Default rate 6.4 Mobile plans 6.5 Data-plans 6.6 Data add-ons 6.7 EU roaming 6.8 More information 7 eety (by 3 "Drei") 7.1 Availability 7.2 Default rate 7.3 Mobile plans 7.4 Data-only plan 7.5 Data add-ons 7.6 EU roaming 7.7 More info 8 S-Budget Mobile (by Magenta) 8.1 Availability 8.2 Registration 8.3 Default rate 8.4 Mobile plans 8.5 Data-only plan 8.6 Data add-ons 8.7 Other data related add-ons (speed/technology) 8.8 EU roaming (roam like at home not available to tourists) 8.9 Inactivity fee 8.10 More info 9 spusu (on 3 "Drei") 9.1 Availability 9.2 Default rate 9.3 EU roaming 9.4 Inactivity fee 9.5 More info 10 Georg (by A1) 10.1 Availability 10.2 Wertkarte vs Vertrag 10.3 Default rate 10.4 Mobile plans 10.5 Data-only plans 10.6 Data add-ons (30 days) 10.7 Other Data add-ons 10.8 Other data related add-ons (speed/technology) 10.9 EU roaming 10.10 More info 11 yooopi! (by A1) 11.1 Availability 11.2 Default rate 11.3 Mobile plans: 11.4 Data-only plan 11.5 EU roaming 11.6 More info 12 wowww! (by A1) 12.1 Availability 12.2 Default rate 12.3 Mobile plans 12.4 Data-only plans 12.5 EU roaming 12.6 More info 13 Lyca Mobile (on A1) 13.1 Availability 13.2 Default rate 13.3 Mobile bundles 13.4 Data-only bundle 13.5 EU roaming 13.6 More information 14 MTEL Austria (on A1) 14.1 Availability 14.2 Default rate 14.3 Mobile plans 14.4 EU and Telekom Serbia Group roaming 14.5 More information 15 Lidl Connect (by 3 "Drei") 15.1 Availability 15.2 Default rate 15.3 Mobile plans 15.4 Data-only plan 15.5 Data Add-Ons 15.6 EU roaming 15.7 More information 16 bob (no longer issuing new prepaid SIM cards) 16.1 More information 17 Vectone Mobile and Delight Mobile (discontinued) 18 tele.ring (discontinued) Basics[] There are now three mobile operators in Austria: A1 Telekom Austria Magenta Telekom (formerly T-Mobile) 3 (= "Drei") Orange and "3" merged in 2013 into one network and the Orange brand name was dropped, but still two different "3" networks are shown when you make a scan. In May 2019 T-Mobile was rebranded to Magenta Telekom as a result of the merger with the cable-company UPC. In addition, there are many Sub-Brands and MVNOs on all networks. Mobile coverage is excellent for a country with difficult topography and similar to Switzerland on a very high level. In 4G/LTE all three networks cover >=98% of the population. 5G/NR non-standalone was launched on all three networks in 2019/2020. Prepaid customers can only get access to 5G through select plans on all three networks. Since September 2022 Drei "3" has been the only carrier with 5G standalone for individuals in the country. 5G standalone was made available to prepaid customers only in late 2024. This article follows the historical order used in the country and is no ranking. Data rates in Austria are among the lowest in Central Europe, largely due to the proliferation of unlimited data-only packages intended for mobile broadband due to a relative lack of fast or inexpensive fixed-line broadband connections especially in rural areas. A prepaid SIM card is locally called "Wertkarte". This is a specific Austrian expression, not used in other German-speaking countries. Even though there are plans specifically meant for phones or routers you can use any plan in any device without restrictions. This means that you can use a combo plan with talk, text and data with a router or an internet only plan with a phone. Note that the small counters at the Vienna International Airport with Wowww!-branding charge excessive registration fees on Wowww! SIM cards up to €40. At Vienna International Airport you can visit the Billa supermarkets at Terminal 1 (between 5:30 and 20:00) and Terminal 3 (between 6:00 and 22:00), the Bipa store at Terminal 3 or the SIM Local store at Terminal 3 where they sell Drei, Eety and Lycamobile SIM cards. Alternatively, you can go to a store in the city. If you're taking the City Airport Train, Vienna S-Bahn Line S7 or the regional express train REX 7 from Vienna International Airport to Wien Mitte, there are A1, Magenta and Drei stores, as well as an Interspar, a MediaMarkt and a Libro at Wien Mitte The Mall. If you're taking the S-Bahn Line S7 or the regional express train REX 7 from Vienna International Airport to Wien Rennweg there is a Lidl in the small shopping center above the station and a Drei store as well as a Bipa a short walk away at the intersection Rennweg and Ungargasse. If you're taking the ÖBB Railjet to Wien Hauptbahnhof, there is an Interspar, a Libro, a Billa and a Bipa at the train station and a MediaMarkt a short 5-minutes walk away at 1100 Columbus shopping center. The country code for Austria is +43. Mobile phone numbers start with a three digit area code starting with a 6 followed by a subscriber number between 7 and 9 digits. Cellular frequencies in Austria per carrier:[] A1 Magenta 3 (Drei) 2GGSM Band 8 (900 MHz) Band 8 (900 MHz) Band 8 (900 MHz) Band 3 (1800 MHz) - Band 3 (1800 MHz) 3GUMTS Band 8 (900 MHz) 6 - - - - Band 1 (2100 MHz) 6 4GLTE Band 20 (800 MHz)*with 20 MHz Band 20 (800 MHz)*with 10 MHz‏‏‎ - - Band 8 (900 MHz)*with 10 MHz Band 8 (900 MHz) ³ with 3 MHz Band 3 (1800 MHz) ¹ with 20 + 15 MHz Band 3 (1800 MHz) ¹ with 20 MHz Band 3 (1800 MHz)*with 15 MHz - Band 1 (2100 MHz) ¹ with 15 MHz Band 1 (2100 MHz)*with 15 MHz Band 7 (2600 MHz) ² with 20 MHz Band 7 (2600 MHz) ² with 20 MHz Band 7 (2600 MHz) ² with 20 + 5 MHz - - Band 38/41 (2600 MHzTDD) ³ with 20 MHz 5GNR - Band n28 (700 MHz)with 20 MHz Band n28 (700 MHz) 5with 10 MHz - Band n75 (1500 MHz)with 20 MHz Band n75 (1500 MHz) 5with 30 MHz Band n1 (2100 MHz)with 20 MHz Band n1 (2100 MHz) 4with 15 MHz - Band n77/n78(3410-3800 MHz)with 100 + up to 80 MHz(region dependent) Band n77/n78(3410-3800 MHz)with 100 MHz Band n77/n78(3410-3800 MHz)with 100 MHz *Used for nationwide 4G/LTE coverage. ¹Used in smaller and bigger cities. ²Used in bigger cities. ³Limited availability and no carrier aggregation with other bands. ⁴Shared with 4G/LTE using DSS (Dynamic Spectrum Sharing) technology. 55G standalone only. 63G shutdown in progress, availability not guaranteed Power Saving[] All operators employ power saving between the hours of 12-1 am and 6 am, this means that bands 3 and 7 might not be available in all areas during these hours. If you want to use the A1 or Magenta network during the wee hours a device with band 20 (+ band 8 for Magenta) would be highly recommended, while for Drei network a device with bands 1 and 8 would be similarly recommended. Expect degraded speeds during these hours even with a device which supports bands 1, 8 and 20. SIM card registration [] In Austria SIM cards need to be registered since July 2019 in order to be activated. In the country, the branded shops of major providers will do the registration for free or a minimal charge. Often partner shops or post offices also offer to do the registration but may charge up to €10. Most brands can be registered through an online verification process too, which is similar to Germany. Be aware that not all brands accept all foreign ID documents from overseas for their online registration. These visitors should better go to a branded store instead. Citizens from EU countries can try the Foto-Identifikation which is now available online for most brands, for this process, you need to have a reliable internet connection and a cam as you need to upload a pic of your ID document and a selfie to get registered. In both cases, these registration methods can be done on WiFi hotspots (like in Germany, locally referred to as WLAN rather than WiFi) which are available in many public places. Be aware that SIM cards sold in supermarkets, service stations and tobacconists can't always be registered there, and may only have the online verification available. Be prepared to go to a provider store, post office or online for registration. Recharging[] Online top-up vouchers are available for most networks at onlineaufladen.at without surcharges. Note that if you would like to use your credit or debit card on this website, payments are possible with Mastercard Securecode, Verified by Visa, Diners Club and Maestro Cards that have Mastercard Securecode enabled. Visitors from some EU countries may also use their online banking account to buy top-ups. Since this is restricted to certain countries and banks, check beforehand if your country is in the drop-down menu. Further, you need to be able to receive text messages to your home SIM, so if you don't want to connect it to a network in Austria, this method won't work. With the rise of App-based Multi Factor Verification for Bank Transfers, this issue has become obsolete in recent years. If you verify transactions via your Banks App rather than via SMS, this method will still work for you, even without connecting to an Austrian Network. The minimum top-up value is mostly €10. For top-ups, most Austrian retailers don't sell scratch cards but hand out a paper slip with a PIN code. This usually involves either picking up a tag like seen here or asking the cashier for a Ladebon (= recharge voucher) for your carriers, you will be issued a paper slip containing the voucher PIN to be entered into your phone or online. Some Austrian providers have introduced a non-activity fee, if you don't use your plan. This makes it hard to keep your SIM card when you pause it, because loaded credit will be eaten up without any benefit. Generally, most Austrian SIM cards stay alive for a year, without using them or topping up. Because of this inactivity fee, it is better to run down your balance, before you pause for longer. Price comparison with the rest of the world[] UK internet comparison site cable.co.uk has ranked Austria as 46th out of 237 countries/territories and 8th in the OECD (36 countries) in terms of mobile data affordability with data costing on average €0.47 (approximately US$0.51) per GB (July 2023). This means Austria's prices are approximately US$2.10 per GB cheaper than the global median. (source) EU roaming[] Austria is part of the EU, where since 2017 new internat'''
