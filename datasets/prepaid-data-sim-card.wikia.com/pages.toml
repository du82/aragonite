full_description = '''in: Manual APN Configuration Sign in to edit History Purge Talk (0) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Contents 1 APN 2 APN configuration on iOS ios devices 3 APN configuration on Android devices 4 APN configuration on Windows Phone devices 5 APN configuration on other devices APN[] These three letters and the right APN are all you need to know to configure data for your SIM card in your device. All operators use a specific APN (= Access Point Name). This is often pre-configured for your SIM card, but must be adjusted sometimes manually for your device. For this you should know how to access the configuration menu on your device. If you don’t know, you should look at your manual or on the internet for a description. The appropriate APN of all shown providers is given at the end of every provider's section in this Wiki. In some cases username and password need to be adjusted too, all other fields can be left blank. APN configuration on iOS ios devices[] iOS apn On all iOS devices of Apple like the iPhone you need to choose Network on your General menu first. Then click on "Cellular Data Network" and the advanced adjustments. The APN must be filled in the Cellular Data APN field. Be careful, because it needs to be 100% accurate. On some networks also Username and Password need to be added too. To edit the settings, tap each field and enter the details provided. The settings should save automatically. Depending on your carrier, you may not be able to edit the cellular data settings. If your carrier needs a different APN setting, you may be able to use a configuration profile with the correct setting. This is explained here. Unless you're using a configuration profile, an update of iOS resets any modifications made to the your APN settings. If you edited your APN settings before updating iOS, these settings will reset to the default values. So you may need to re-apply your settings after an iOS update. To revert to your carrier's default APN information, tap Reset Settings on your iPhone. If you installed a configuration profile, the profile's default information will be used instead. APN configuration on Android devices[] Android 2-4 As there are a few different versions of Android on the market, it's not so easy to generalize the basic steps required to get you up and running with the internet. Once you have inserted the SIM into your device simply follow this procedure: On Android 2 and 3: Menu or Applications > Settings > Wireless and Networks > Mobile Networks > Access Point Names On Android 4: Menu > Settings > Mobile Networks (this is often hidden behind "more" in the Wireless and Networks folder) > Access Point Names. On some devices like Samsung you have to click: .... Mobile Networks > Mobile Data > Access Point Names. <a href="https://static.wikia.nocookie.net/paygsimwithdata/images/9/9e/Android_new.jpg/revision/latest?cb=20160809212756" class="mw-file-description image"><img alt="Android new" src="https://static.wikia.nocookie.net/paygsimwithdata/images/9/9e/Android_new.jpg/revision/latest/scale-to-width-down/204?cb=20160809212756" decoding="async" loading="lazy" width="204" height="321" class="thumbimage" data-image-name="Android new.jpg" data-image-key="Android_new.jpg" data-relevant="1" data-src="https://static.wikia.nocookie.net/paygsimwithdata/images/9/9e/Android_new.jpg/revision/latest/scale-to-width-down/204?cb=20160809212756" /></a> Android 5-7 On Android 5, 6 and 7: It's essentially the same path like for Android 4, but the colour scheme has been inversed and looks much more like on iOS devices now. You should end up with one screen like on the pic left or above. Then click Menu, tap "New APN" or on the (+) icon and tap "Name". For name you can give any name you can think of, but it will be most useful a name associated with this SIM card. Then tap "APN" and enter the APN 100% correct. Ensure that Proxy, Port and Server is not set. If you need to enter a Username and Password, tap the words and enter. APN Type should be default or internet, Authentification Type PNP, the APN protocol IPv4 and the Enable box should be ticked. Then press the Menu button, tap SAVE and press the Back button. Then you see the given name of your APN which should be tapped to enable. Finally, press Home and turn on mobile network and data (if it hasn't started automatically). APN configuration on Windows Phone devices[] <a href="https://static.wikia.nocookie.net/paygsimwithdata/images/8/83/Windows_apn.png/revision/latest?cb=20160809213043" class="mw-file-description image"><img alt="Windows apn" src="https://static.wikia.nocookie.net/paygsimwithdata/images/8/83/Windows_apn.png/revision/latest/scale-to-width-down/178?cb=20160809213043" decoding="async" loading="lazy" width="178" height="281" class="thumbimage" data-image-name="Windows apn.png" data-image-key="Windows_apn.png" data-relevant="1" data-src="https://static.wikia.nocookie.net/paygsimwithdata/images/8/83/Windows_apn.png/revision/latest/scale-to-width-down/178?cb=20160809213043" /></a> Tap Settings > Cellular & SIM > SIM settings > Add Internet APN. Tap APN and fill in the name, if required Username and Password too. Finally tap SAVE to store. APN configuration on other devices[] Check the manual for more information. Often the settings are hidden in the software menu of modems. Back to main page Categories Categories: Manual Community content is available under CC-BY-SA unless otherwise noted.'''
