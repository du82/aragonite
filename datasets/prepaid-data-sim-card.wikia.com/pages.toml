whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Flag of American Samoa American Samoa is an unincorporated territory of the United States and uses the North American country and area code +1 684. Its currency is USD (US Dollar). Only one GSM provider operates in American Samoa. BlueSky is mostly owned by BlueSky Communications and other investors from Samoa and American Samoa. As often in small island nations, the prices for data are pretty high, certainly higher than in the US. As a US territory, American Samoa uses North American frequencies. 2G/GSM is on 850 MHz and 1900 MHz and 3G on 850 MHz. 4G/LTE was launched in March 2017 on 700 MHz (B12) and 1900 MHz (B2). The other provider in American Samoa ASTCA (American Samoa Telecommunications Authority) uses CDMA instead, which is not compatible with GSM. Contents 1 BlueSky 1.1 Availabilty 1.2 Data feature packages 1.3 Roaming 1.4 More info BlueSky [] Note that it uses different frequencies from Samoa: 2G is on 850 MHz and 1900 MHz, 3G is on 850 MHz. Like in the west, their 3G/HSPA+ network is called "4G". Real 4G/LTE started in March 2017 and is branded as "4G+" on 700 MHz (B12) and 1900 MHz (B2). Coverage is available in these townships: Onenoa, Tula, Alao, Utumea, Auasi, Aoa, Amouli, Aunuu, Alofau, Pagai, Fagaitua, Sailele, Masefau, Utusia, Amoa, Auto, Alega, Aumi, Laulii, Onesopo, Aua, Afono, Vaitia, Lepua, Loaloa, Atuu, Satala, Pago Pago, Fagasa, Fagatogo, Utulei, Fagaalu, Fatumafuti, Matuu, Faganenea, Avau, Nuuuli, Malaeimi, Faleniu, Pavaiai, Ili’ili, Tafuna, Vaitogi, Tafeta, Aloau, Asu, Futiga, PuaPua, Taputimu, Vailoa, Leone, Amaluia, Asili, Afao, Nua Seetaga and Amanave: coverage map Availabilty[] Prepaid SIM cards are available from their store in Laufou Center in Nu'uuli for free. When you recharge at least $5, you will get 3 GB, 500 local mins and 1000 local SMS. Top-ups can be made at many top-up points from $1 by e-charge can be found on the islands. You can also topup online on their website using PayPal. Simple registration with name and email is required. Name doesn't need to be real, but email is verified. Data feature packages[] Out-of-bundle use and use in Samoa is charged at $0.16 per MB. These data packages are available: Package Price Data Time $2 Plan $2 800 MB 24 hours $4 Plan $4 1.54 GB 24 hours $6 Plan $6 3 GB 5 days $10 Plan $10 5 GB 5 days $25 Plan $25 10 GB 15 days $35 Plan $35 12 GB 15 days $6 plan comes with free 3 GB of Instagram usage for 24 hours from activation. To buy a prepaid data bundle, dial *888# option 3 “Buy Data Bundles”. To check your data balance, dial *888# option 1 “View Balance” and you will receive two SMS: one with your prepaid balance remaining and another with your MB remaining on your bundle. Roaming[] BlueSky American Samoa now offers roaming data bundles for use in Samoa, priced the same as local data bundles (see above), also purchased through *888#. Once purchased, wait for a confirmation SMS before starting to use data in Samoa, or else you will be charged $0.16 per MB. No offers are available for voice or SMS; those are all charged per use. More info[] APN: internet Website: http://www.bluesky.as/blueskyweb/ Categories Categories: Oceania Community content is available under CC-BY-SA unless otherwise noted.'''
