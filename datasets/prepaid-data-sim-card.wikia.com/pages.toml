full_description = '''in: Country, 8/18, Americas Anguilla Sign in to edit History Purge Talk (0) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Contents 1 Basics 2 Flow 2.1 Availability 2.2 Data feature packages 2.3 International roaming 2.4 More info 3 Digicel 3.1 Availability 3.2 Data feature packages 3.3 International roaming 3.4 More info Basics[] Anguilla is a British overseas territory in the Caribbean, lying east of Puerto Rico and the Virgin Islands and directly north of Saint Martin. The total land area of the territory is 90 km2 with a population of about 16,000 inhabitants. It's not considered part of the EU and EU roaming regulations are not enforced here. Like on many small Caribbean islands there are these two usual providers: Flow (by Cable & Wireless) Digicel Anguilla Flow is the incumbent provider and Digicel came to the Caribbean 2001-6 to end this monopoly. In Anguilla they are now on par each sharing about 50% of the market. Many locals have two SIM cards. Hence the high penetration rate of more than 180%. Flow is on US frequencies of 850 MHz for 2G and 3G, while Digicel uses mixed bands of 900 MHz for 2G, 850 MHz and 1900 MHz for 3G. Flow and Digicel have now both started 4G/LTE on 700 MHz (band 17). Coverage is on the main island only. Prices are given in East Caribbean dollar EC$ that is fixed to the US$: US$1 = EC$2.70. Taxes are included. Flow[] Flow, up to 2015 called Lime and rebranded, is the incumbent provider in Anguilla. It's operated by Cable & Wireless that has been sold to Liberty Global. FLOW at present is the sole provider with LTE Advanced with maximum speeds of up to 200 Mbit/s on the downlink in some areas. Availability[] Their SIM card is sold in their stores (locator) and some other places like the post office for EC$ 25. Be prepared to show your passport at the point of purchase. Top-ups between EC$ 5 and EC$ 200 can be made online or in top-up kiosks, supermarkets and gas stations all over the island. Any top-up stays valid for 90 days irrespective of the amount. Check your balance by *120#. Data feature packages[] Default rate outside packages is EC$ 0.41 per MB. These data packs are offered: Data Time Price Activation 75 MB 1 day EC$ 4 *146*75# 300 MB 3 days EC$ 12.65 *146*300# 500 MB 3 days EC$ 23 *146*500# 1 GB 7 days EC$ 31.05 *146*1007# 500 MB 14 days EC$ 27.60 *146*500# 1 GB 14 days EC$ 37.95 *146*1014# 1 GB 30 days EC$ 46 *146*1000# 3 GB 30 days EC$ 103.50 *146*3000# 5 GB 30 days EC$ 138 *146*5000# International roaming[] For roaming in the US (on AT&T), Canada, Suriname, Bermuda, Guyana, Trinidad & Tobago, Panama, Bahamas and all Flow markets in the Carribbean they sell this option. Data bolt-ons: 100 MB for 7 days: EC$ 26.99 250 MB for 30 days: EC$ 64.99 500 MB for 30 days: EC$ 129.99 Activation is by *190#. More info[] APN: ppinternet Website: http://discoverflow.co/anguilla/ Digicel[] Digicel started in 2005 to challenge the monopoly of Lime that is called now Flow. Their network is generally on par with Flow, but they still market HSPA+ as "4G". Real 4G/LTE is not yet available: coverage map. Availability[] SIM card is around EC$ 25 in their store (locator). Be prepared to show a passport for purchase. Top-ups can be made online by credit card without surcharges or by vouchers sold all over the island. Digitel offers CreditU where you can top-up one number by another: dial *128*<receiving mobile no.>*<top-up amount>#. Wait for confirmation and then dial *128*1# to confirm. EC$ 0.25 is charged for this service. Dial *120# to check your account balance. Data feature packages[] Default rate is EC$ 0.39 per MB. They offer these "LTE Freedom" bundles with data: Unlimited Facebook and Whatsapp for 1 hour: EC$ 1.50 300 MB for 1 day: EC$ 4.00 300 MB, 25 local mins, for 1 day: EC$ 4.99 1 GB for 3 days: EC$ 13.00 1 GB, 200 local mins for 3 days: EC$ 15.99 2 GB for 7 days: EC$ 25.99 2.5 GB, 300 local mins for 7 days: EC$ 34.99 6 GB for 30 days: EC$ 79.99 8 GB data, 1000 local mins for 30 days: EC$ 119.99 As well as another set of bundles called Quick Picks, possibly without LTE access: 100 MB, 25 on-net mins, free on-net SMS and WhatsApp for 1 day: EC$ 6 700 MB, 175 on-net mins, free on-net SMS and WhatsApp for 7 days: EC$ 28 3 GB, 750 on-net mins, free on-net SMS and WhatsApp for 30 days: EC$ 105 They often give out double data in promotions. To check your data balance on a data plan, dial *120*131# International roaming[] Digicel sells their Roam Like You're Home plan at EC$ 30 valid for 7 days. This service allows Digicel customers travelling to the USA, Canada and all other Digicel Caribbean territories to call, text and use data at domestic Anguillan rates. You will need to connect to AT&T or T-Mobile in the US, Rogers in Canada or Caribbean Digicel networks. To activate Roam like you are home dial *153# and send. Note that data bundles don't apply while on the Roam Like You're Home plan. You will be charged the default rate of around EC$ 0.30 per MB while roaming. More info[] APN: web.digicelanguilla.com Website: http://www.digicelgroup.com/ai/en/mobile.html Categories Categories: Country 8/18 Americas Community content is available under CC-BY-SA unless otherwise noted.'''
