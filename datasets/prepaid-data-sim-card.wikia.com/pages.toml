full_description = '''in: Country, 8/18, Digicel, Americas Aruba Sign in to edit History Purge Talk (0) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Contents 1 Basics 2 Digicel 2.1 Availability 2.2 Data feature packages 2.3 Caribbean roaming option 2.4 More info 3 Setar 3.1 Availability 3.2 Data feature packages 3.3 Data-only SIM 3.4 WiFi plans 3.5 More info 4 MIO Wireless Basics[] Aruba is a Caribbean island that is part of the Dutch Antilles. Its sister islands are called Bonaire and Curaçao (see this article). They are partly Dutch, but not considered a part of the EU and thus no EU roaming rules apply (unlike in the French Caribbean). Aruba has now only 2 mobile network operators: Digicel Setar Digicel has 2G GSM on 900 MHz, 3G up to HSPA speed (advertised as "4G") on 900 MHz (Band 8) and 4G LTE on 2100 (Band 1) and 1800 MHz (Band 3). Setar gives 2G/GSM on 900 MHz, 3G up to HSPA on 850 and 2100 MHz and started real 4G/LTE on 1800 MHz (B3) in 2014. A third provider called Mio Wireless was shut down by the government in summer 2017. Most prices are given in Aruba Florin (Afl. or AWG) that is fixed at 1.79 to the US$, some tourist rates are directly quoted in US$ as the dollar is accepted all over the island too. All prices displayed in this article are exclusive of local taxes (BBO - a sales tax of 1.5% and BAZV - a "health tax" of 2%). So add 3.5% for the final sales price. Use Digicel if you go to the sister islands of Bonaire or Curacao too, as it's considered one network and no roaming fees apply there. Use Setar for better and real 4G/LTE speeds on the island of Aruba. Digicel[] Digicel operates 2G, 3G and 4G networks all over the ABC islands including Aruba, Bonaire and Curacao. Coverage is good, but not that fast: coverage map. Digicel offers roaming at no extra cost in the two other islands of the ABC group Bonaire and Curacao on their network there, but only for a steep surcharge on other Caribbean Digicel networks. So Digicel should be your better choice, if you going to visit one of the sister islands too. Availability[] SIM card and data packages can be obtained at the Queen Beatrix Airport and in their stores (locator) for a Afl. 36. It includes Afl. 15 balance. If you choose their standard prepaid line, you may need to make a call to 146 to activate your account. Top-up cards are available in Afl. 5, 10, 15, 25 and 50, valid for 30 to 90 days. Or use their international top-up site online by credit card. To check the balance of your account, type *142#. To top-up by voucher, enter *141*<voucher PIN>#. If you don't use the full value of your SIM within this period, you have an additional 60 days in which you can top-up your account. Any remaining credit on the phone will be added to your new top-up amount. However, if you exceed the 60 days, your SIM will be cancelled. Data feature packages[] Default rate without packages is Afl. 1.10 per MB. Overuse rate, after the data quota of a package has been used up is at Afl. 0.45 per MB. Digicel has discontinued all data-only packages and only sells combo bundles as Quick Pick Plans or All-in-One Plans. The Quick Pick Packs come with unlimited WhatsApp (no VoIP included) and unlimited on-net calls and texts: for 1 day with 300 MB: Afl. 7 for 7 days with 1.3 GB: Afl. 29 for 30 days with 4 GB: Afl. 65 Activation is online or through their app. Unused data allowances roll over to the next period if plan is renewed. Digicel also introduced All-in-One Plans with set voice, text and data allowances: for 1 day: unlimited on-net calls, 5 on-net SMS, 250 MB: Afl. 7.99 for 7 days: unlimited on-net calls, 25 on-net SMS, 750 MB: Afl. 29.99 for 30 days: unlimited on-net calls, 100 on-net SMS, 2 GB: Afl. 79.99 To activate an All-in-One Plan, type *135#. Digicel also introduced "Unlimited" plans(only in Aruba): for 1 day: 'unlimited' data, 10 mins calls: Afl. 10.0 for weekend: 'unlimited' data, 20 mins calls: Afl. 15.0 for 7 days: 'unlimited' data, 50 mins calls: Afl. 40.0 'unlimited' data is limited by 15 GB per day Caribbean roaming option[] While no roaming fees apply in Curacao and Bonaire on the Digicel network, all other Digicel networks in the Caribbean are sold very expensive. For Afl. 10 by pressing *153# you get a "Roam like you're home" plan for 10 days. Data rates will then be discounted to US$ 0.50 per MB in all Digicel roaming networks. More info[] APN: digicelaruba.com Website: http://www.digicelgroup.com/aw/en/mobile.html Setar[] Setar operates the islands fastest network running on 2G, so-called "4G" (= 3G/HSPA) and now real 4G/LTE on 1800 MHz (Band 3) with speeds up to 30 Mbps. Additionally, it has own WiFi hotspots too, called WiFi Aruba. But unlike Digicel, there is no free roaming on the neighbouring islands. Availability[] Prepaid SIM cards can be obtained at the Queen Beatrix Airport arrivals hall in a shop that is open every day, but closes already at 6pm. Or at some 5 different stores/outlets on the island, that are all closed on Sundays (shops list). Their SIM cards are pre-cut to all 3 different sizes (triple SIM card). New SIM cards are SIM-locked with PIN code 0000. SIM card with basic services (call + SMS) is a ghastly Afl. 35. A SIM card needs to be activated by *123#. Top-up cards are called prepaid cards and are available at Afl. 5, 10, 15, 25, 35, 50, valid for 15 to 90 days. You can buy these cards at most supermarkets, bars and restaurants and at all of Setar's shops, at retail stores and gasoline stations. Or you can top-up online using a credit card. Data feature packages[] Data by default is charged at Afl. 2 per MB. Data packages can be bought in different sizes with 4G/LTE speeds up to 30 Mbit/s: Data Price Time 250 MB Afl. 5 1 day 600 MB Afl. 10 2 days 750 MB Afl. 12 3 days 1 GB Afl. 19 7 days 2 GB Afl. 32 14 days 3 GB Afl. 49 30 days 5 GB Afl. 79 30 days To activate, type *123#, choose 1 for data bundles, then choose one of their bundles and press 1 again to confirm your purchase for which you will receive a SMS. When your purchased bundle is depleted (and only then), you can purchase a new bundle or, if you allowed internet usage on your phone, you can continue using the default rate of Afl. 2 per MB; which is much more expensive. You can block this default rate and data will be shut off, when used up by *123#, choose 6 for allow/block data charges, choose 2 for blocking and 1 to confirm. They also offer combo plans with included on-net call minutes, on-net texts and internet data: 1 day: 300 mins Setar calls, 25 Setar SMS, 250 MB: Afl. 8 7 days: 1200 mins Setar calls, 50 Setar SMS, 750 MB: Afl. 30 14 days: 2000 mins Setar calls, 100 Setar SMS, 1 GB: Afl. 45 30 days: 3000 mins Setar calls, 200 Setar SMS, 2 GB: Afl. 75 To activate a combo bundle, type *123#, enter 2 for combo bundles, choose a bundle and press 1 to confirm. Data-only SIM[] For tablets and routers Setar offers data-only plans: US$ 30: SIM card comes with US$ 5.70 credit, 1 GB data for 1 day US$ 55: SIM card comes with US$ 5.70 credit, 4 GB data for 7 days Prices are for regular SIM cards, micro SIMs are Afl. 3 more. These packages can be added in up to 30 Mbit/s on their 4G/LTE network: Afl. 10: 1 GB for 24 hours Afl. 35: 3 GB for 7 days Afl. 45: 5 GB for 14 days Afl. 99: 15 GB for 30 days WiFi plans[] <a href="https://static.wikia.nocookie.net/paygsimwithdata/images/6/61/Wifi_aruba.png/revision/latest?cb=20151227232807" class="mw-file-description image"><img alt="Wifi aruba" src="https://static.wikia.nocookie.net/paygsimwithdata/images/6/61/Wifi_aruba.png/revision/latest?cb=20151227232807" decoding="async" loading="lazy" width="139" height="86" class="thumbimage" data-image-name="Wifi aruba.png" data-image-key="Wifi_aruba.png" data-relevant="0" data-src="https://static.wikia.nocookie.net/paygsimwithdata/images/6/61/Wifi_aruba.png/revision/latest?cb=20151227232807" /></a> Setar runs a number of about 30 WiFi hotspots (list of locations) called "Wi-Fi Aruba", that can be accessed using special WiFi prepaid cards, sold at Setar shops or at the hotspot locations. Data is unlimited and only time-restriced: 60 minutes: US$ 5 24 hours: US$ 10 7 days: US$ 35 30 days: US$ 70 Time is measured continuosly from the first login. More info about connectivity and how to set up your WiFi connection, you can find at: http://www.setar.aw/visitors/wi-fi/ More info[] APN: internet.setar.aw. Website: http://setar.aw/ MIO Wireless[] MIO Wireless started in 2011 and was the smallest provider in Aruba. It operated on CDMA standard and used EVDO for data, which is not compatible to GSM phones that are used in most other parts of the world. MIO had its business taken over and then shut down by the Aruban government in July 2017 for non-payment of fees. Categories Categories: Country 8/18 Digicel Americas Community content is available under CC-BY-SA unless otherwise noted.'''
