full_description = '''in: Africa, 8/18, Country, Ooredoo Algeria Sign in to edit History Purge Talk (0) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Contents 1 Basics 1.1 SIM registration 1.2 Airport shops 1.3 SIM validity 2 Djezzy 2.1 Availability 2.2 Djezzy HAYLA MAXI 2.3 Djezzy Speed 2.4 More info 3 Mobilis 3.1 Availability 3.2 Pixx 3.3 Data-only SIM 3.4 More info 4 Ooredoo 4.1 Availability and plans 4.2 ​Data packages Basics[] There are three mobile network operators active in Algeria ranked in number of subscribers: Djezzy Mobilis, by Algérie Télécom Ooredoo Algerian law has two specific rules on prepaid SIM cards; one on mandatory user registration and one on its validity. SIM registration [] Every user of any SIM card, whether prepaid or postpaid, and regardless whether the user is a local resident or a visitor, has to be registered and as such has to provide offical ID (ID card, passport, visa) and a copy of the same ID and an Algerian address, which can be that of a hotel. Airport shops[] It is also possible to buy a SIM at the airport. There your passport seems to be sufficient for registration and activation, as they make a copy on the spot. One user reported that it's now to easy to purchase a SIM from the Djezzy boutique shop in the international terminal (located towards the middle of the terminal between halls 1 and 2). It is presumed that this is possible for the other operators too. The same discounts as in local stores are offered and so it's highly recommended if you want to get online before your onward travel. A reader in 2018 confirmed again that at least a Djezzy SIM can be purchased for free in the airport and a passport copy was enough for registration. They will provide SIM card and activate it there. SIM validity[] The other rule is that, by law, providers have to switch off prepaid SIM cards that have shown no activity for 3 months. This means that if you want to keep your SIM card alive, you have to be sure to recharge it and to make at least one call or send one text message every 3 months. Fortunately roaming is activated by default on Algerian cards, and some external providers do recharge Algerian phone numbers as well, making it not that difficult to keep the SIM alive. Djezzy[] Djezzy is the brand under which Optimum Télécom is marketing its mobile offer. It's the market leader in Algeria with 45% of all customers. Djezzy broadcasts 2G on 900 MHz and 3G up to HSPA+ on 2100 MHz in 48 Wilayas. 4G/LTE was launched in 2016 on 1800 MHz (band 3) and is available in most Wilayahs. Djezzy is the most popular brand amongst young people with the most agressive marketing and generally on par with Mobilis. Coverage in cities is good, while outdoors on 4G/LTE, but often falls back to 3G indoors. Rural coverarge ranges from 3G to sometimes EDGE or no service. Speeds on 4G/LTE ranges between 10 and 20 Mbps to occasionally poor or trouble connecting to some websites. Overall, connectivity is fairly reliable, though. Availability[] The prepaid offer is called Djezzy Carte. A SIM starter pack, available in their shops. It costs 300 DA and includes 50 DA of credit and 50 MB of data for 7 days. The flat rate is 4.99 DA per 30 seconds for call, per text message and per 1 MB of data. Via *777# you can check your balance. The default rate is 4.99 DA per MB. The following options can be activated via USSD *720#: Djezzy HAYLA MAXI[] These new plans are valid for one day, week or month and contain data and unlimited calls and texts to Djezzy numbers and calls to other subscribers: Data Time Price Credit 2 GB 24 hours 100 DA 200 DA 10 GB 7 days 500 DA 1000 DA 20 GB 30 days 1000 DA 2000 DA 40 GB 30 days 1500 DA 3000 DA 60 GB 30 days 2000 DA 4000 DA To activate, type *720#. Overuse is at default rate or from credit 2 GB for 100 DA. Djezzy Speed[] These options are for data users. Speed are data packages for a day, week or month: Data Time Price Unlimited 1 hour (0-7am) 50 DA 100 MB 24 hours 30 DA 250 MB 50 DA 1 GB 100 DA 3 GB 7 days 300 DA 6 GB 30 days 500 DA 15 GB 1000 DA More info[] APN:Djezzy.internet Website in French: http://www.djezzy.dz/ Mobilis[] Mobilis is the brand under which the mobile subsidiary of state-owned Algérie Télécom is marketing its mobile offers. Based on the number of subscribers it's currently the second operator in the country and was launched in 2003. Mobilis has been offering 3G connection in basically 80% of all the cities and towns since 2012. 4G/LTE was launched in October 2016 on 1800 MHz (band 3). 4G/LTE is available in the Wilayas of Tlemcen, Constantine, Batna, Bordj Bou Arreridj, El Oued, Biskra, Boumerdès, Tipaza, Blida, Tizi-Ouzou et Sidi Bel-Abbès. Current coverage for 4G can be checked online by selecting the Wilayah, the city and the part of the city. Availability[] A 4G Mobtasim SIM card costs 100 DA and includes 200 DA of credit. This specific SIM is only available in the Wilayahs currently covered by 4G. In other areas you will get a 3G Mobtasim card, but they, as well as existing prepaid subscribers, can have 4G activated on the same card and will get 2 GB of data as bonus. The SIM cards are available in the Mobilis Stores and agreed resellers, don't forget however to bring your passport and a notarized copy of it. Pixx[] These are their new all-in combo packages with unlimited on-net calls: Data Time Price Credit 5 GB 15 days 500 DA 500 DA 13 GB 30 days 1000 DA 1000 DA 30 GB 30 days 2000 DA 2000 DA In contrast to Djezzy Mobilis credit can be used for all domestic networks. For additional data these add-on packages called Pass Connect+ can be added: 1 GB: 100 DA 3 GB: 200 DA Data-only SIM[] As a offer for data only they have introduced Navigui 4G. For 2400 DA you get 3 GB and free WhatsApp and Facebook for 30 days and another 2 GB for another 6 months. Regular data packages can be added fro more data. More info[] APN: internet Username and Password: internet Website in French and Arab: http://mobilis.dz Ooredoo[] <a href="https://static.wikia.nocookie.net/paygsimwithdata/images/9/91/Ooredoo-logo.jpg/revision/latest?cb=20140729145653" class="mw-file-description image"><img alt="Ooredoo-logo" src="https://static.wikia.nocookie.net/paygsimwithdata/images/9/91/Ooredoo-logo.jpg/revision/latest/scale-to-width-down/245?cb=20140729145653" decoding="async" loading="lazy" width="245" height="38" class="thumbimage" data-image-name="Ooredoo-logo.jpg" data-image-key="Ooredoo-logo.jpg" data-relevant="1" data-src="https://static.wikia.nocookie.net/paygsimwithdata/images/9/91/Ooredoo-logo.jpg/revision/latest/scale-to-width-down/245?cb=20140729145653" /></a> The third operator in number of users in Algeria is Ooredoo and used to be called Nedjma before. It's now owned by an international telco based in Doha, Qatar. Just like the other Algerian operators they operate 2G on 900 and 1800 MHz, 3G on 2100 MHz and since end of 2016 on 4G/LTE on 1800 MHz (band 3) as well. Ooredoo covers with 3G most populated areas in Algeria and 28 out of 48 Wilayahs are covered with 4G so far. Availability and plans[] Sim cards are available from Ooredoo shop's and authorized resellers. The following starter packs are available with either a bonus scheme for topping up or included calls and data. LA Switch with combo packages for 30 days in following sizes including unlimited calls to ooredoo : 1500 DA: 50 GB + 1500 DA credit + 10 minutes international calls 2500 DA: 120 GB + 2500 DA credit + 30 minutes international calls 4000 DA: unlimited internet + 3000 DA credit + 50 minutes international calls Hashta with data and calls with only 500da : 4 GB + unlimited Facebook + 2000 DA credit: 1000 DA 10 GB + unlimited Facebook + 5000 DA credit: 2000 DA ​Data packages[] For all plans you can book the following data packages via *113# and via the portal : Data Price 1.5 GB 150 DA 3 GB 200 DA 5 GB 300 DA 20 GB 1000 DA 40 GB 2000 DA 60 GB 3000 DA More info APN: Ooredoo /or/ internet Website in French and Arab: http://www.ooredoo.dz Categories Categories: Africa 8/18 Country Ooredoo Community content is available under CC-BY-SA unless otherwise noted.'''
