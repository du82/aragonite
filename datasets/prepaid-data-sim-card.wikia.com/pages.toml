full_description = '''in: 4/19 All countries2 Sign in to edit History Purge Talk (0) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> There are international SIM plans together with so-called mobile hotspot routers (also called MiFis) on the market offering "worldwide" data roaming or at least coverage in major regions. Their offers are shown here on this separate site. For stand-alone international SIM cards for data without any WiFi hotspot included check this article here. For eSIM profiles sent to eSIM-compatible devices, check this special article. The bundle offers of a hardware router and an integrated SIM or eSIM shown on this site have both pros and cons. First you need to purchase the mobile hotspot router. This device is often limited to options of the same provider only and cost a hefty start-up price. The advantage is the pretty closed system in which compatibility issues are rare. When it comes to roaming data profiles, a wide variety of packages are offered. But be aware, prices for data are still much more expensive than local offers and tend to be slightly more expensive than international roaming SIM cards or eSIM profiles. So always compare them with local SIM cards, international offers and roaming offers in your country. You might as well buy a WiFi hotspot on your own and feed it with local SIM cards. The hotspot bundle option is still popular with frequent travellers and business travellers who are more interested in a reliable one-for-all option than cheaper local offers that require some effort in the destination country. The WiFi-hotspot scene is dominated by two companies: China-based GlocalMe and an US-based company formely called Skyroam, now re-branded in Solis. Some smaller providers also compete for customers. We used to list a few WiFi rental companies as well, but this has been discontinued as their business model hasn't proven to be sustainable. If you don't purchase the router, but rather rent it, there are many liability issues and further expenses involved for receiving and sending the device by mail. That's why this way can only be an option on a local, not worldwide base and all rental offers have been taken off this list. The combo approach of a mobile hotspot together with a data SIM option has the main advantage, that it offers a coherent solution. You don't need to care about frequencies, compatibility, and how to connect your device. You simply link all your devices by WiFi to your hotspot. This is much easier if you travel in a group, stay together and want to have a common solution. But you must be aware that similar to most eSIM offers, there is no voice calling (except of VoIP) and SMS service possible through these data-only plans. Contents 1 GlocalMe 1.1 WiFi Hotspot 1.2 Supported phones 1.3 Availability 1.4 Data rates 1.5 More info 1.6 We.stream 2 Solis (formely: skyroam) 2.1 Skyroam Solis 2.2 Skyroam Solis X and Solis Lite 2.3 Data options 2.4 Fair Use Policy 2.5 More information 3 Pokefi by Smartgo 3.1 WiFi Hotspot 3.2 Data packages 3.3 More information 4 Goodspeed 4.1 WiFi hotspot 4.2 Data rates 4.3 More info GlocalMe[] GlocalMe is a Chinese enterprise based in Hong Kong by Shenzhen uCloudlink Network Limited, a fully owned subordinate of Hong Kong uCloudlink Technology Network Ltd. It has been around from 2014 and is the first to offer a 4G/LTE roaming solution with a WiFi hotspot for purchase. Coverage is in around 108 countries so far and some of them already in 4G/LTE. It comprises North America, Latin America, Europe, major parts of Asia and Oceania and some African countries (see this map). WiFi Hotspot[] In 2017 they introduced their WiFi hotspot called U2. It uses a "cloud SIM" for their own service and you can add two micro SIMs additionally. In 2018 the G3 hotspot device was added and sold along with the previous U2. In 2020 the G3 and U2 were replaced by the G4 and G4 Pro. Their new G4 supports LTE Bands 1, 2, 3, 4, 5, 7, 8, 9, 12, 13, 17, 18, 19, 20, 26, 28, 34, 38, 39, 40 and 41 as well all 3G and 2G frequencies, weights 180 gr. and measures 136.5 x 71 x 12 mm in size. WiFi is on IEEE802.11b/g/n up to 150 Mbit/s. Here too, two nano SIM cards can be added and up to 5 devices can be connected.. Supported phones[] Also GlocalMe offers their World Phone S1 with its cloud SIM included produced by Elitek and support full range frequency band management. GlocalMe S1 World Phone can be found at Amazon.com for US$ 339.99 with 20 GB global data package included (data valid for 365 days), but may not be available in all markets. Availability[] The U2 and G4 can be found at major dealers, but is mostly marketed through Amazon.com for around US$ 150, Amazon.de for €160 or Amazon.co.jp for ￥18,990. Both models generally get pretty good reviews on Amazon and other high tech feedback sites. After purchase you need to connect to GlocalMe Wi-Fi: Wi-Fi Hotspot:GlocalMe_XXXXX, Password:XXXXX. Then create your GlocalMe Account through their app available for iOS and Android, then login to your account on the G2 device and top-up online your account by PayPal, VISA, MasterCard, Alipay and others. Data rates[] They offer country-specific packages for 100+ countries and some regions too: Country (each country of its own) 300 MB 1 day 1 GB 7 days 3 GB 30 days China, S. Korea, Indonesia, Hong Kong, Japan $ 1.50 $ 4 $ 10 Thailand $ 2 $ 5 $ 12.50 EU/EEA countries, Russia, Canada Ukraine, Australia, USA, Mexico $ 3.50 $ 9 $ 22.50 Brazil, Argentina, South Africa, India $ 4 $ 10.50 $ 26.50 UAE, Algeria $ 4.50 $ 11 $ 27.50 Region (all countries combined) 1 GB 30 days 3 GB 30 days 12 GB 1 year Global $ 29 $ 72.50 $ 217.50 Europe $ 12 $ 30 $ 90 North America $ 11 $ 27.50 $ 69 Oceania $ 11 $ 27.50 $ 82.50 And many other countries are offered, see here. Furthermore they offer a year pack with 1 GB valid in 58 countries for one year at $ 36. More info[] Website: http://www.glocalme.com We.stream[] We.Stream is the brand of a Dutch-based company called Mondicon offering a mobile 4G/WiFi hotspot that can be used in 100 countries for data. The new offer was launched at the Passenger Experience Week in Hamburg in 2018. They use Glocal Me's G3 mobile hotspot for data for €179, For more specifications check GlocalMe above. Data roaming is in 100 countries (list) so far with all usual countries covered. They offer yearly, monthly, weekly and daily plans for all countries: "Unlimited" for a year (in high speed, beyond throttled to 52 kbps): 2 GB per month for €20.75 per month 5 GB per month for €41.50 per month 20 GB per month for €149 per month for 30 days: 5 GB at €99 or 10 GB at €149 for 7 days: 500 MB per day at €49 per week for a day: 500 MB at €8 When high-speed allowances is reached, speed will be throttled to 128 kbit/s. All plans auto-renew, if not discontinued. Top-ups are through their website. To all prices the local VAT (sales tax) must be added. Website: https://www.we.stream Solis (formely: skyroam)[] Skyroam is a San Francisco based company founded in 2008. In 2015 it received funding from Lenovo and many other sources for their new vSIM (virtual SIM) technology. You need to purchase or rent their WiFi hotspot together with data passes. Skyroam roams in about 130 countries. This includes all of Europe, North America, major countries in South America, few countries in Africa and major countries in Asia and the Middle East plus Australia (see list). Skyroam Solis [] In 2017 they introduced their new WiFi hotspot called Solis that seems to have become their standard now. For the first time 4G/LTE has been offered in about 100 countries. This orange-coloured hardware doubles as powerbank, has 6000 mAh capacity for 16 hours of operation or up to 123 hours on standby. Charging is by USB-C cable and the hotspot can connect up to 5 devices. There's no SIM card here: Using an embedded SIM with a global roaming partner, the hotspot checks its GPS, phones home for a few bytes, and then gets assigned a virtual SIM card with a real account linked to it. Coverage is on 2G 850, 900.1800, 1900 MHz; 3G/WCDMA 850, 900, 1700, 1900, 2100 MHz and 4G/LTE 700, 800, 850, 900, 1700, 1800, 1900, 2100, 2300, 2500, 2600 MHz that translates into bands 1, 2, 3, 4, 5, 7, 8, 17, 20, 38, 40, 41 making as more compatible as the GlocalMe device. You can now also add an own physical SIM card. It's heavier at 190 g (6.6 oz.), but smaller with 93 mm x 93 mm x 26 mm (3.6 in x 3.6 in x 1.0 in). This device is now on sale as it's considered outdated for around US$ 99-120. Alternatively at many airports, you can instead choose to pick up your order at kiosks in in certain key locations like London Heathrow Airport (all terminals except T1) or railway stations. Skyroam Solis X and Solis Lite [] In summer 2019 the new Solis X was introduced. It has the same good compatibility of its predecessor and goes at the same price. It's biggest novelty is a camera which can't compete with other digital cameras, but can make simple pics. On the back side, the capacity of the battery has been shrunk form 6000 to 4700 mAh. Skyroam claims a 15 hours lifespan which turned out in first tests as much shorter instead and it support now up to 10 devices. It's sold through the usual stores at around US$ 179 or €199,. The Solis Lite was released at the end of 2019 as a lighter version of the Solis X. It lacks the camera and is solely a WiFi hotspot with the same capabilities as the Solis X. The sales price is remarkably low at around US$ 120 or €140,. Data options[] Skyroam offers three different price models, that can't be combined at the same time: Skyroam used to sell only day passes valid for 24 hours valid in all of the mentioned countries. When you have purchased their device, you only need to register once, get a 24-hour day pass, connect, and start using data. More day passes can be bought through your account using international credit cards or PayPal: 24-hrs day pass with 4G/LTE in all countries: €8, US$ 9 or £ 7. A rather unspecified FUP applies (see below). In 2018 they introduced new Go Data passes for all destinations valid on a per GB basis: 1 GB for 30 days: €8, US$ 9 or £ 7. More data can be added for the same price. Note that bundles auto-renew and need to be stopped at least 2 days prior to renewal. There are still "unlimited" subscriptions valid for a month at €80 or US$ 90. Here again their FUP applies (see below) and passes auto-renew. Fair Use Policy[] Data on the day passes and "unlimited" month passes are unlimited, but governed by a rather vague and unspecified FUP called "industry standard Fair Use Policy, consistent with most mobile carrier and broadband company policies for mobile data usage. Customers who take a disproportionately high amount of data may experience reduced network speeds, based on location and service. To ensure you have uninterrupted high speed data, we strongly recommend disabling apps and features that consume data in the background, including cloud syncing, large system updates, auto-backups, auto-app updates, and avoid extended use of video streaming, gaming and other online activities that consume large amounts of data." Skyroam wont say what exact limits not to exceed. More information[] http://www.skyroam.com Pokefi by Smartgo[] Pokefi made from pocket and WiFi is a new contender on the scene starting in 2018 in Hong Kong. This device and its data passes are distributed worldwide through their website and at some places in Asia on location. It offers 4G/LTE roaming in 70 countries: all EU/EEA countries, Turkey, Russia, all of North America, China, India, major SE Asian countries and Israel. This is much smaller than its competitors GLocalMe and Skyroam. WiFi Hotspot[] The device measures 110 x 68 x 10 mm in size and weights 144 g. Its battery has 3850 mAh and can last up to 12 hours.'''
