title = "Discuss Everything About Prepaid Data SIM Card Wiki | Fandom"
description = """
Here's what this wiki is about:
This wiki collects information about prepaid mobile phone plans from all over the world. Not just any plans though, they must include decent data rates, perfect for iPhone, iPad and Android smart phone travellers, as well as mifi users. We provide a comprehensive list of prepaid providers with data by country."""
full_description = '''Mintymattheson·9/24/2024in GeneralRemoving or updating Rogers (Canada) and Freedom Mobile (Canada)Recently Rogers has stopped offering prepaid plans and now they sell contract only, existing prepaid sims are still usableAnd also, Freedom Mobile updated their plans, all new plans now have 5G and US-MX free roaming includedCanada00 Insanewolf27·8/16/2024in GeneralBulgaria Page UpdateTcom and Bulsatcom no longer offer SIM cards. First operator is defunct, Bulsatcom is bought by Vivacom. Maybe you should check and update the page?01 Mintymattheson·4/19/2024in GeneralCanada: Rogers prepaidRogers has recently stopped selling Prepaid to new customers, and are going to sell prepaid exclusively through their MVNO ChatrI was wondering if anyone could add this info to the Canada page.00 AfricaTraveler·1/21/2024in GeneralAfrica updatesI've recently created a page for South Sudan. Unfortunately it's a bit incomplete as I was not able to get a "Zain" SIM card. I nevertheless hope that adding info about 1 carrier (which is the main one and used by most people anyways) is helpful.I'm not 100% sure how to use this Wiki but would it be possible to add this page to the Africa group? And maybe add the "Warzone" tag?Cheers !P.S.: I will be traveling extensively in other African countries this year and plan to update some of the other pages along the way :) South SudanPrepaid Data SIM Card WikiSouth Sudan00 Stasfree155·8/16/2023in GeneralTop up Estonia SIM card from abroadHi adminI found an option how user can top up Estonia SIM card from abroadDownload ZEN application from App Store/Google PlayRegister and verify your account(passport and selfie)You will get ZEN virtual card and IBANTop up your ZEN accountMake bank transfer inside EU - 0.05 EUR fee will be applied. Bank details should be present on carrier website(Elisa in my case)The SIM card will be topped up next dayI topped up my Elisa SIM using ZEN account without any issuesPlease share it in the article about Estonia simThanksStanislavEstonia01'''
