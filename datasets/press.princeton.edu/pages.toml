title = "Cassuto, Leonard | Princeton University Press"
full_description = "Overview Offices People Authors Speakers History Rights & Intellectual Property News Awards Events Careers Contact Leonard Cassuto Scroll to Article Content Speaker Profile Leonard Cassuto is Professor of English at Fordham University and an award-winning journalist. He has written on topics ranging from science to sports for The New York Times, The Wall Street Journal, The Washington Post, and more. He is the author or editor of ten books, including The New PhD: How to Build a Better Graduate Education, The Graduate School Mess: What Caused It and How We Can Fix It, and Academic Writing as if Readers Matter.Cassuto offers lectures and workshops on academic writing, higher education topics (including graduate education and the liberal arts), and American literature and culture (including the cultural history of toughness, and crime stories, and baseball). His website can be found here.For more information about engaging our speakers, please email our PUP Speaks team at pupspeaks@press.princeton.edu Books1 Academic Writing as if Readers Matter Leonard Cassuto A guide to writing with the reader in mind Read More View Book Add to Cart Stay connected for the latest books, Ideas, and special offers. Stay connected for the latest book news."
