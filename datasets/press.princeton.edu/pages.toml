title = "Flash Sale FAQ | Princeton University Press"
full_description = "Flash Sale FAQ Flash Sale Help, I thought this book was for sale, why is the sale price not showing in the shopping cart?Both print editions of the same book are not always included in the sale. For example, the hardcover may be on sale while the paperback is not. When you land on a book page, the edition on sale is the default selection, and will show a slash through the original price. In order to receive the sale price, you may need to specifically choose the hardcover edition to add to your cart if the paperback version is not on sale. You will need to enter the FLASH discount code in the shopping cart.May I combine the 60% off discount with other offers?No, the 60% discount is not combinable with other offers.Can my order include books that are not included in the sale?Yes, you can add non-sale books to your cart and check out with those books in the same order. Please note that books outside of the featured collection will be billed at the full retail price. If you wish to apply a discount code for the other books in your cart, please check out separately.I ordered during the sale, but my books have not yet arrived, who should I contact?• Email: PUPHelp@glassboxx.com.Is shipping included?Shipping is not included in this offer.Is there a limit to the number of books I can order?There is no order limit on this offer. Note that the offer applies while supplies last.I tried to order a book and the discount is no longer available.The discount is applicable while supplies last. It’s possible there are no copies left at this time.I have placed my order and entered the discount code, but the order total is incorrect.We are sorry for the inconvenience. We suggest deleting the order and trying again. Be sure the discount code you are using is correct and remember that the discount only applies to the flash sale collection and often specific print formats such as hardcover or paperback. If you wish to apply a discount code for the other items in your cart, please checkout separately and enter that discount code.If you are still having an issue placing your order, please contact PUPHelp@glassboxx.com.Can my order include books that are not yet in print?You can pre-order books on our website, but the sale discount applies only to the published flash sale collection.Does the discount apply to ebooks and audiobooks?The flash sale collection does not include Princeton Audio or ebooks.Are you planning to host another sitewide 50% off sale? If so, when?Yes! We will host another sitewide 50% Off Sale in the Spring where nearly all print, ebooks and audiobooks are discounted by 50%.The sale ended before I had a chance to make a purchase. Is there a way I can take advantage of the sale still?Unfortunately, this is a limited time offer. Please consider staying connected and subscribing to our newsletter below for special offers and news of our summer sale.Do you have any other questions?We are here to help! Please contact our customer service team at PUPHelp@glassboxx.com."
