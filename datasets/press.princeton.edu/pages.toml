title = "Emma Jung’s years of self-liberation | Princeton University Press"
description = "Emma Jung’s creative life is recorded in numerous handwritten notebooks and art portfolios, all of which lay undisturbed after her death in 1955. Until her documents in the family archive were systematically studied, she had not been thought of as a real contributor to the movement of analytical psychology, or as a full partner in her husband’s ground-breaking work."
full_description = "Night sea journey. Painting by Emma Jung, undated. © Foundation of the Works of C.G. Jung. Essay Emma Jung’s years of self-liberation By Ann Conrad Lammers February 11, 2025 Scroll to Article Content Share Dedicated to the Soul Available in 2 editions Buy This Two days before Christmas in 1916, a young mother of five wrote a poem about the warlike behavior of the archetypes. Using the psychological symbology that she shared with her already-famous husband, Emma Jung wrote of the merciless aggression of the warring gods, ripping open the ground of the human soul. Her metaphors were taken from European battlefields, then in the daily news. Closer to home at the time, her marriage had put her into a state of painful internal conflict. Her poem, “Streite” (“Conflicts”), commented on a universal psychic dynamic and also bore witness to her belief that, in time, the battlefield would yield a divine harvest. Her poem’s conclusion might be mistaken for sentimentality, if it were not borne out in life by the poet’s staying power. Emma Jung’s creative life is recorded in numerous handwritten notebooks and art portfolios, all of which lay undisturbed, after her death in 1955, carefully preserved in the basement of the family home. Starting in 2012, thanks primarily to the work of Emma’s great-grandchildren, the writings and paintings of the matriarch began to be studied and catalogued. What came to light was eye-opening. Emma Jung had always been beloved as Mama and Groma. She had been acknowledged as a gifted analyst and—by default—as one of the leading women surrounding Carl Gustav Jung. But until her documents in the family archive were systematically studied, she had not been thought of as a real contributor to the movement of analytical psychology, or as a full partner in her husband’s ground-breaking work. From the time of their engagement, Carl Jung encouraged Emma Rauschenbach to educate herself fully and use all her gifts. She was intellectually equal to university study; but her father, following old-fashioned customs, had not allowed her to apply. Then came her marriage to Carl, followed by the births of their five children and the management of a large household. Early in her marriage, Emma Jung did all she could to fill the gaps in her education, even hiring a tutor in Greek. She devoted her free hours to writing and painting. She revised and polished; but she was challenged for time, and it was hard to finish her work as she wanted to. As an introverted personality, and innately modest, she chose to keep most of her creative work private. With her marriage, too, Emma Jung’s psychological education began. She assisted Carl in his early experimental studies. She served as the main research assistant for his work, Wandlungen und Symbole der Libido (Transformations and symbols of the libido), which established Jung on his theoretical path and effectively ended his partnership with Sigmund Freud. While Emma and Carl Jung were still in Freud’s professional circle, however, Freud addressed Emma Jung in letters as a colleague and even offered someday to publish her writing. Emma Jung’s personal analysis focused, naturally, on her dreams. One of her notebooks shows that she began recording major dreams in 2011. In 2013, she temporarily stopped recording dreams, in order to prepare her inaugural lecture for the Association for Analytical Psychology. This long lecture, analyzing a fairytale, established her as a serious contributor to her husband’s movement and enabled her in 1916 to join the newly formed Psychology Club in Zurich. She was elected its first president. In close conversation with her husband, Emma Jung worked with him on his evolving psychological theory. This was a true collaboration, flowing in both directions. One of her contributions seems to have come from her independent study of the animus. In 1921 Carl published his first discussion of the anima, the powerful feminine archetype operating in the unconscious lives of men; but here he only briefly mentioned the parallel archetype operating in the unconscious lives of women. In contrast, Emma had begun studying the animus several years earlier. Her first reference to “my masculine aspect” appears in a dream text of 1914. Various animus-figures are described and analyzed in her dream journals of 1916-1917. In 1934, when Carl called on his wife to contribute a chapter on the animus to his book, Wirklichkeit der Seele (The reality of the psyche), it may have been a tacit acknowledgement that she deserved recognition for her independent work on this piece of Jungian theory. In another important strand of Emma Jung’s early work, her writings about God, the gods, and Götterdämmerung, she stood slightly apart from her husband. Unlike Carl, she never used the term das Selbst (the Self) to explicate the symbols of God in the psyche. Several of Emma’s poems and fantasies illustrate that she was influenced by Nietzsche’s theme of Götterdämmerung (the twilight of the gods). In an early epigrammatic poem, she describes a mouse visiting Jerusalem:The labor is long and far the climb,The cross won’t fall before its time. Her commentary announces the theme: “that the old gods may fall and new ones arise … Götterdämmerung.” From one perspective, visions of falling gods might portend a general disaster; but for Emma, as an individual, they signified a desperately needed liberation. The gods included her personal god-image, Aranû. This figure had first appeared to her in mid-1916 as a flaming star, holding in his hand a blue bird, which she recognized at once as her soul. She was compelled to follow Aranû into the depths of hell. Less than three years later, in January 1919, she witnessed Aranû’s splendid death: Bend thy knee, mortal,Thy head uncover.A god is dying.Aranû sinks down, the blazing one, His day is spent. But my blue bird, the one he once protected,Where might it be? Her poem tells the answer: In the midst of the conflagration, a lance pierces Aranû’s heart, and the blue bird flies home to her. She greets her returning soul:Thou art the one, I know, the long-held captive;the setting of the god has set thee free. This poem is part of a long fantasy, which includes several scenes of liberation. In one, a voice tells the poet she must use her own power to break out of her stone carapace: “then of divinity thou art free.” In another, she sees “the eye of God, the great rogue jester.” After many visions, she finds herself singing Bach’s Passion Chorale, “O sacred head, sore wounded.” But these words no longer mean what Emma learned in childhood; for she writes, “it is not Christ’s head to whom these tones apply.” Finally, she sees a head carried by ocean waves and recognizes “a human head, perhaps divine, but not the head of Christ.” Emma’s entire creative work comes down to the task of individuation, in which—for her—the soul is more sacred than the psyche’s god-images. It is amazing to reflect that, so soon after her poem of December 1916, depicting the gods’ assaults, she emerges whole from the struggle. It’s also amazing to realize that in January 1919 Emma Jung was still only thirty-six. Her writings also tell us that she was not alone in the work. An inner voice accompanied her, encouraging her to use her own power to break free of “divinity,” her pious deference to the dying gods.Ann Conrad Lammers is a former Jungian psychotherapist and the editor of Erich Neumann’s The Roots of Jewish Consciousness. Essays Neuroscience & Psychology"
