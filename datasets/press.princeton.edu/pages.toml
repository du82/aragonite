["https://press.princeton.edu/books/audio/9780691267562/capital"]
title = "Capital | Princeton University Press"
description = "This audiobook narrated by Simon Vance presents a major new translation of the explosive book that transformed our world"
full_description = "Economics & Finance Capital: Critique of Political Economy, Volume 1 Karl Marx Edited and translated by Paul Reitter Edited by Paul North Foreword by Wendy Brown Afterword by William Clare Roberts Narrator Simon Vance This audiobook narrated by Simon Vance presents a major new translation of the explosive book that transformed our world Audio Preview Hardcover 30% off with code PUP30 Sale Price: $27.97/£24.50 Price: $39.95/£35.00 ISBN: 9780691267562 Published: Sep 17, 2024 Copyright: 2024 Runtime: 30 hours 17 minutes Main_subject: Economics & Finance More ebook 30% off with code PUP30 Sale Price: $27.97/£24.50 Price: $39.95/£35.00 ISBN: 9780691267562 Published: Sep 17, 2024 Copyright: 2024 Runtime: 30 hours 17 minutes Main_subject: Economics & Finance More Audio 30% off with code PUP30 Sale Price: $27.97/£24.50 Price: $39.95/£35.00 ISBN: 9780691267562 Published: Sep 17, 2024 Copyright: 2024 Runtime: 30 hours 17 minutes Main_subject: Economics & Finance More Buy This Request Exam Copy Download Cover Share Overview Author(s) Karl Marx (1818–1883) was living in exile in England when he embarked on an ambitious, multivolume critique of the capitalist system of production. Though only the first volume saw publication in Marx’s lifetime, it would become one of the most consequential books in history. This magnificent new edition of Capital is a translation of Marx for the twenty-first century. It is the first translation into English to be based on the last German edition revised by Marx himself, the only version that can be called authoritative, and it features extensive commentary and annotations by Paul North and Paul Reitter that draw on the latest scholarship and provide invaluable perspective on the book and its complicated legacy. At once precise and boldly readable, this translation captures the momentous scale and sweep of Marx’s thought while recovering the elegance and humor of the original source.For Marx, our global economic system is relentlessly driven by “value”—to produce it, capture it, trade it, and most of all, to increase it. Lifespans are shortened under the demand for ever-greater value. Days are lengthened, work is intensified, and the division of labor deepens until it leaves two classes, owners and workers, in constant struggle for life and livelihood. In Capital, Marx reveals how value came to tyrannize our world, and how the history of capital is a chronicle of bloodshed, colonization, and enslavement.With a foreword by Wendy Brown and an afterword by William Clare Roberts, this is a critical edition of Capital for our time, one that faithfully preserves the vitality and directness of Marx’s German prose and renders his ideas newly relevant to modern readers. Ideas Podcast: Karl Marx’s Capital Awards and Recognition A Millions Most Anticipated Book of Summer Paul Reitter is professor of Germanic languages and literatures and former director of the Humanities Institute at the Ohio State University. His translations include The Autobiography of Solomon Maimon (Princeton). Paul North is professor of Germanic languages and literatures at Yale University. His books include The Yield: Kafka’s Atheological Reformation."
