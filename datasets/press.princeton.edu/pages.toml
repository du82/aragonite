["https://press.princeton.edu/ideas/ideas-podcast-we-have-never-been-woke"]
title = "Ideas Podcast: We Have Never Been Woke | Princeton University Press"
description = "Society has never been more egalitarian—in theory. Prejudice is taboo, and diversity is strongly valued. At the same time, social and economic inequality have exploded. In We Have Never Been Woke, Musa al-Gharbi argues that these trends are closely related, each tied to the rise of a new elite—the symbolic capitalists."
full_description = "Podcast We Have Never Been Woke February 22, 2025 Scroll to Article Content Share We Have Never Been Woke Available in 2 editions Buy This Society has never been more egalitarian—in theory. Prejudice is taboo, and diversity is strongly valued. At the same time, social and economic inequality have exploded. In We Have Never Been Woke, Musa al-Gharbi argues that these trends are closely related, each tied to the rise of a new elite—the symbolic capitalists. In education, media, nonprofits, and beyond, members of this elite work primarily with words, ideas, images, and data, and are very likely to identify as allies of antiracist, feminist, LGBTQ, and other progressive causes. Their dominant ideology is “wokeness” and, while their commitment to equality is sincere, they actively benefit from and perpetuate the inequalities they decry. Indeed, their egalitarian credentials help them gain more power and status, often at the expense of the marginalized and disadvantaged. About the AuthorMusa al-Gharbi is a sociologist and assistant professor in the School of Communication and Journalism at Stony Brook University. He is a columnist for The Guardian and his writing has also appeared in the New York Times, the Washington Post, and The Atlantic, among other publications. Podcasts Sociology"
