title = "Singer, Peter | Princeton University Press"
full_description = "Overview Offices People Authors Speakers History Rights & Intellectual Property News Awards Events Careers Contact Peter Singer Scroll to Article Content Books3 Consider the Turkey Peter Singer Why this holiday season is a great time to rethink the traditional turkey feast Read More View Book Add to Cart Ethics in the Real World: 90 Essays on Things That Matter – A Fully Updated and Expanded Edition Peter Singer Provocative essays on real-world ethical questions from the world's most influential philosopher Read More View Book Add to Cart The Expanding Circle: Ethics, Evolution, and Moral Progress Peter Singer What is ethics? Where do moral standards come from? Are they based on emotions, reason, or some innate sense of right and wrong? For many scientists, the key lies entirely in biology--especially in Darwinian theories of evolution and... Read More View Book Add to Cart Ideas2 Consider the Turkey A turkey is the centerpiece of countless Thanksgiving and Christmas dinners. Yet most of us know almost nothing about today’s specially bred, commercially produced birds. Read More Peter Singer on Consider the Turkey In this Q&A, Peter Singer discusses a few things consumers may want to know about factory farmed turkey heading into the holiday season. Read More Stay connected for the latest books, Ideas, and special offers. Stay connected for the latest book news."
