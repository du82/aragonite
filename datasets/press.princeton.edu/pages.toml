full_description = "Events March 03, 2025 Marybeth Gasman at SXSW EDUDoing the Right Thing Share Date & Time March 03, 2025 4:00 pm - 5:00 pm CST Address Austin Convention Center - Room 8ABC 500 Cesar Chavez St Austin, TX, US Learn More Doing the Right Thing Available in 3 editions Buy This Traditional education research and development is dominated by the most privileged institutions with outsized access to R&D capital and opportunities. Often, their research agendas are not informed by the needs of students, educators, or their communities. To make education R&D more effective, we must expand the array of who gets R&D funding, as well as grow a more diverse pipeline of R&D professionals. Join this session to learn policy solutions for incorporating a broader range of communities’ assets, needs, and perspectives in the education R&D process. Please join SXSW EDU in welcoming Marybeth Gasman, author of Doing the Right Thing."
