full_description = "Overview Offices People Authors Speakers History Rights & Intellectual Property News Awards Events Careers Contact Lara Schwartz Scroll to Article Content Speaker Profile Lara Schwartz focuses on dialogue across difference, freedom of speech and dissent, inclusive pedagogy, dispute resolution, depolarization, law, and public policy. Drawing on her experience as a legislative lawyer, lobbyist, and communications strategist in leading civil rights organizations, Lara understands how to lay the groundwork for important, tough conversations across difference. At American University, she founded and directs the Project on Civic Dialogue (formerly the Project on Civil Discourse), which supports students in developing their skills as listeners, communicators, and learners.Lara regularly speaks at national conferences on issues related to free speech on campus, productive dialogue, inclusive learning communities, collaborative learning, academic freedom, student activism, and college readiness. She has often appeared on national and local radio and television programs and written broadly for the media. She is the author of Try to Love the Questions: From Debate to Dialogue in Classrooms and Life.For more information about engaging our speakers, please email our PUP Speaks team at pupspeaks@press.princeton.edu Books1 Try to Love the Questions: From Debate to Dialogue in Classrooms and Life Lara Schwartz An essential guide to dialogue in the college classroom and beyond Read More View Book Add to Cart Stay connected for the latest books, Ideas, and special offers. Stay connected for the latest book news."
