["https://press.princeton.edu/ideas"]
title = "Ideas | Princeton University Press"
full_description = '''Essay Celebrating Bird Photographer of the Year February 22, 2025 Photographers from "Bird Photographer of the Year: Collection 9" tell the stories behind their selected shots. Read More Podcast We Have Never Been Woke February 22, 2025 Society has never been more egalitarian—in theory. Prejudice is taboo, and diversity is strongly valued. At the same time, social and economic inequality have exploded. In We Have Never Been Woke, Musa al-Gharbi argues that these trends are closely related, each tied to the rise of a new elite—the symbolic capitalists. Read More Essay Paradoxical possibility: embracing anti-racism’s contradictions February 19, 2025 Anti-racism work is paradoxical. It requires the capacity to straddle contradictory yet interdependent realities that seem irreconcilable but must and can both be navigated. Read More Essay Bad Bunny, Puerto Rico, and public history February 19, 2025 The evening before Three King’s Day, on January 6th, Puerto Rican rapper and singer Bad Bunny released his sixth album DeBÍ TiRAR MaS FOTos (I Should Have Taken More Pictures). Instead of releasing highly produced videos, the artist's team worked with Jorell Meléndez-Badillo, author of “Puerto Rico: A National History,” to create historical slides that were launched alongside each of the seventeen tracks. Read More Essay How we make quasi-humans and super-humans February 13, 2025 Are AI and robots pushing us over the edge toward some "post-human" utopia, or apocalyptic "singularity"? Things that define or challenge our intuitions about the boundaries of the human can be sources of trouble. Read More Essay Emma Jung’s years of self-liberation February 11, 2025 Emma Jung’s creative life is recorded in numerous handwritten notebooks and art portfolios, all of which lay undisturbed after her death in 1955. Until her documents in the family archive were systematically studied, she had not been thought of as a real contributor to the movement of analytical psychology, or as a full partner in her husband’s ground-breaking work. Read More'''
