["https://press.princeton.edu/books/hardcover/9780691258522/safe-havens-for-hate"]
title = "Safe Havens for Hate | Princeton University Press"
description = "Why efforts to moderate harmful content on social media fail to stop extremists"
full_description = "Political Science Safe Havens for Hate: The Challenge of Moderating Online Extremism Tamar Mitts Why efforts to moderate harmful content on social media fail to stop extremists Look Inside Look Inside Hardcover Price: $29.95/£25.00 ISBN: 9780691258522 Published (US): Mar 4, 2025 Published (UK): Apr 29, 2025 Copyright: 2025 Pages: 280 Size: 6.13 x 9.25 in. Illus: 30 b/w illus. 20 tables. Main_subject: Political Science More ebook Price: $29.95/£25.00 ISBN: 9780691258522 Published (US): Mar 4, 2025 Published (UK): Apr 29, 2025 Copyright: 2025 Pages: 280 Size: 6.13 x 9.25 in. Illus: 30 b/w illus. 20 tables. Main_subject: Political Science More Preorder Now Request Exam Copy Download Cover Share Overview Author(s) Praise Content moderation on social media has become one of the most daunting challenges of our time. Nowhere is the need for action more urgent than in the fight against terrorism and extremism. Yet despite mass content takedowns, account suspensions, and mounting pressure on technology companies to do more, hate thrives online. Safe Havens for Hate looks at how content moderation shapes the tactics of harmful content producers on a wide range of social media platforms.Drawing on a wealth of original data on more than a hundred militant and hate organizations around the world, Tamar Mitts shows how differing moderation standards across platforms create safe havens that allow these actors to organize, launch campaigns, and mobilize supporters. She reveals how the structure of the information environment shapes the cross-platform activity of extremist organizations and movements such as the Islamic State, the Proud Boys, the Oath Keepers, and QAnon, and highlights the need to consider the online ecosystem, not just individual platforms, when developing strategies to combat extremism.Taking readers to the frontlines of the digital battleground where dangerous organizations operate, Safe Havens for Hate sheds critical light on how governments and technology companies grapple with the tension between censorship and free speech when faced with violence, hate, and extremism. Tamar Mitts is assistant professor of international and public affairs at Columbia University, where she is a faculty member at the Saltzman Institute of War and Peace Studies, the Institute of Global Politics, and the Data Science Institute. “Tamar Mitts illuminates the intricate cat-and-mouse game that defines online safety today. Extremist groups, like other skilled actors exploiting the vulnerabilities of our online information ecosystem, skillfully navigate the shortcomings of content moderation systems and exploit gaps across various platforms. In this insightful book, Mitts highlights critical vulnerabilities in our current approaches, making it an essential read for those in the tech industry and regulatory spaces.”—Camille François, Columbia University “Tamar Mitts shows how online extremists strategically exploit differences in platform policies to advance their violent agendas. With a fascinating theory and compelling evidence, this book is a must-read for anyone who cares about combating violence and hate online.”—Margaret Roberts, University of California, San Diego “For too long, the conversation on how extremists leverage online spaces has been rich in anecdote and poor in data. Mitts’s pathbreaking book remedies this sad state of affairs. Weaving a rich tapestry of cross-platform evidence from multiple studies, Mitts show us how extremists adapt to countermeasures and why they are so hard to stop. A must-read if you want to understand the information environment.”—Jacob N. Shapiro, author of The Terrorist’s Dilemma “Using rich empirical evidence from multiple sources, Safe Havens for Hate reveals the strategies violent extremist groups use to exploit the internet even as governments try to thwart them. This is a must-read for anyone trying to figure out the most effective and long-lasting responses to harmful content online.”—Barbara F. Walter, author of How Civil Wars Start: And How to Stop Them"
