["https://press.princeton.edu/about/mission-values"]
title = "Mission & Values | Princeton University Press"
full_description = "Mission & Values Our MissionPrinceton University Press brings scholarly ideas to the world. We publish peer-reviewed books that connect authors and readers across spheres of knowledge to advance and enrich the global conversation. We embrace the highest standards of scholarship, human creativity and collaboration, and inclusivity in our publishing. In keeping with Princeton University’s commitment to serve the nation and the world, we publish for scholars, students, and engaged readers everywhere.Our ValuesCourageCollaborationCreativityCommunityGlobalismHumanityIndependenceInclusivityFor over a century, we have been entrusted with collaborations that shape the world of learning and ideas. Inspired by these collaborations and our authors, our team values the artistry of book making in an ever-diversifying landscape of reading and listening. We believe books should transcend global and political boundaries, forge new partnerships and understanding, and expand horizons of the human mind. Courage fortifies and guides our every publishing decision, as does a commitment to the enduring importance of the book and the resilience of freedoms to publish and copyright that form its foundation.Our Code of ConductWith a commitment to creating a culture that we believe is necessary to achieve the publishing excellence that is core to the Princeton University Press mission, we embrace a code of conduct that governs all of our collaborations. The Press upholds a positive environment in which its staff, authors, reviewers, media, vendors, and other partners contribute to that mission and business of peer-reviewed publishing in an exemplary professional manner. This environment is defined by humanity, generative relationships, equity and inclusion, and mutual respect. As such, the Press has zero tolerance for racism or any other forms of discrimination or harassment, as well as illegal, dishonest or unethical professional conduct. There is no place in the Press’s publishing ecosystem for people who abuse their status, power or influence or behave in a manner that violates recognized standards of conduct.As guiding principles of conduct, we commit to a positive, professional, sensitive and supportive environment, free of abuse, discrimination and harassment of others. We commit to hold challenging discussions of differences in a professional, non-confrontational manner and with respect to a diversity of viewpoints. We expect our staff, authors, and all of our collaborators to conduct themselves in a professional and courteous manner in all facets of their professional lives. When such expectations are not met, the Press will take appropriate action, including the cessation of partnerships that we believe violate or challenge our ability to achieve a positive culture of collaboration and responsibility.If there is a belief that the outlined Code of Conduct has been violated, please contact the Director of the Press at christie_henry@press.princeton.edu or 609-258-8704, or the Director of Human Resources at 609-258-9387 to discuss the matter.Our Commitment to Environmental SustainabilityWe formed a Sustainability Working Group in 2022 with a focus on materials and greenhouse gas emissions.MaterialsPaper is both a major consumable and an integral part of our work as a publisher. It is also the largest source of greenhouse gas emissions. We are pursuing two strategies to guide our use of paper: first, we ensure that we use paper that is manufactured responsibly; and second, we print responsibly. Princeton University Press joined the Book Chain Project Forest Sourcing tool (previously known as PREPS) in 2022. They accept data only directly from the paper manufacturers and use a tool called Forest Risk Assessment to assign a grade to each paper brand and type. Each paper is recertified every twelve months. We committed to using only those book papers rated three stars or higher by the Book Chain Project beginning in 2022. In 2023, we began to analyze the percentage of paper we use that is certified by the Forest Stewardship Council (FSC). We commit to continue measuring this and comparing the percentage of FSC-certified paper we use year on year, with the goal of prioritizing the use of FSC-certified paper whenever possible.We have increased our use of digital short-run printing technology, our use of print-on-demand (POD) printings in multiple locations around the world, and our use of traditional printing simultaneously in more than one location. Our goals here are to reduce shipping or freight by printing closer to market, and to avoid waste by printing only the books that will reach the hands of readers.Greenhouse gas (GHG) emissionsPrinceton University Press began tracking scope 1 and 2 emissions in 2022 in all three of our office locations. Scope 1 emissions are direct, meaning that they occur primarily from fuel burned onsite, such as natural gas or oil used to heat our offices. Scope 2 emissions are indirect, meaning that they result primarily from electricity, heating, or cooling purchased from an energy utility. Scope 2 emissions are highly dependent on the percentage and type of renewable energy available in the local grids. In future, we hope to be able to work with suppliers to reduce Scope 1 and 2 emissions. We began requesting scope 3 reporting from our manufacturing partners in 2023. Scope 3 emissions consists of all other sources, such as raw materials including paper and ink, freight and shipping, manufacturing processes, and the disposal of any books. Scope 3 emissions are the largest portion of emissions for most businesses, and they are also the most complex to measure and track. Our goal for 2024 is to calculate our emissions to establish a baseline to measure future emissions against, and to choose a reporting tool, with the hope that a standard will emerge that will enable the entire book industry to measure and report on a consistent basis.CollaborationsPrinceton University Press is a signatory of Publishing Declares and the UN SDG Publishers Compact. We participate in sustainability and environmental stewardship committees with the Association of American Publishers (AAP), Book Industry Study Group (BISG), Book Industry Communication (BIC), Green Book Alliance (GBA), and others."
year_published = 2025
