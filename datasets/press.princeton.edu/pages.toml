["https://press.princeton.edu/careers"]
title = "Careers | Princeton University Press"
full_description = "Overview Offices People Authors Speakers History Rights & Intellectual Property News Awards Events Careers Contact Careers Princeton University Press is committed to global publishing excellence of enduring and meaningful impact. We embrace the highest standards of scholarship, inclusivity, and diversity in our publishing to advance and enrich the global conversation. Our cultural identity is defined by collaborations, which are guided by inclusivity, personal and professional growth, freedom of expression, confidence, and respect. We seek to attract, hire, develop, and retain a team that is inspired by our mission and brings with it broad and diverse knowledge and experience as well as a desire to excel. As an affiliate of Princeton University, we are committed to our own mission and that of Princeton University. Our Benefits Princeton University Press’s comprehensive benefits package is designed to support the well-being of employees and their families through all stages of life. Health Care Medical, dental, and vision insurance, and Health Savings Account with employer contributionsLife Insurance100% employer-paid life insurance for employees and their dependentsLegal BenefitLegal support for employees and their household membersRetirement PlansPress-sponsored retirement plans for employee and employer contributionsTuition Assistance & Student Loan RepaymentEmployee and dependent tuition assistance, professional development funds, and funds for the purpose of repaying student loansPaid Maternity, Paternity Leave & Family Support Leave100% paid maternity (20 weeks), parental leave for new parents (12 weeks), and family support leave (4 weeks) to care for an ill family memberPaid Time OffMore than 4 weeks of paid time off for new employees and 100% paid winter and summer week-long collective breaksFlexible ScheduleFlexible working arrangements for majority of positionsPrinceton University PartnershipPrinceton University “affiliate” benefits, which include the use of certain facilities such as the gym and library, and retailer discountsLearn more about our Total Rewards Philosophy. Equity & Inclusion Diversity, equity, and inclusion are vital to our publishing mission: our diverse stories collectively empower us to thrive in a complex, dynamic, and increasingly diverse world. Only through equitable and inclusive collaborations can we achieve a narrative of global impact for the Press. The Equity and Inclusion Strategic Initiative, led by an Equity and Inclusion Council and established in 2018 with the approval by the Board of Trustees, is committed to creating an infrastructure for positive change toward a culture of respectful and confident collaboration. Guided by our values, Code of Conduct and the embrace of peer review in all facets of this collaboration, each of the council’s core foci (internal culture; recruitment, hiring, and retention; media and reader engagement; vendor relations; and acquisitions editorial) commits resources (human and fiscal capital) to exploring how an ethos of equity can positively impact all aspects of our publishing. Internships Princeton University Press is proud to offer competitive publishing internships in several departmental areas, including editorial, graphic design, publicity and sales, and production. Internships are offered during the spring, summer, and fall semesters. Each department’s internship availabilities will be posted when recruiting begins. By participating in the internship program, students observe firsthand the inner workings of a major university press and learn about all aspects of the publishing industry. Opportunities Princeton, United States Oxford, United Kingdom Beijing, China No jobs available at this time.Interested in learning more about careers at Princeton University Press?Request an informational interview. Facilities & Office Manager (Application window closes 2nd of March)Interested in learning more about careers at Princeton University Press?Request an informational interview. No jobs available at this time.Interested in learning more about careers at Princeton University Press?Request an informational interview. Stay connected for the latest books, Ideas, and special offers. Stay connected for the latest book news."
