["https://press.princeton.edu/our-people"]
title = "Our People | Princeton University Press"
full_description = "Overview Offices People Authors Speakers History Rights & Intellectual Property News Awards Events Careers Contact Our People Message from Our DirectorMany thanks for spending a few moments with the Press via our website, one of our most important tools for sharing our publishing with the world and for conveying the energies and expertise of the people of PUP who make that publishing possible. My role as director is to support the people of PUP in every way, so that they can bring their best creative selves to the art and science of book making.The Press has evolved since its origins well over a century ago into a global leader of inquiry and insight, as our historical narrative captures. Our sustainability comes from the wonderful symbiotic relationships we enjoy with authors, readers and listeners, booksellers, librarians and peer publishers and publishing partners across the planet. We are a press with a purpose, and you help generate and define that purpose in a multitude of ways.In an era of unprecedented climate change in the publishing environment, and the world itself, our resilience is rooted in an inclusive embrace of authors and ideas of greatest diversity, seeking to engage all species of readers and listeners invested in the excitement and integrity of knowledge, and in books (and formats) of adaptive and enduring impact. At the center of our strength is an indefatigable commitment to the freedoms to publish and the active protection of copyright. We believe in the superpowers of humanity, especially when that humanity forms collaboration and community.Thank you for the collaborations you entrust to us, which inspire every member of our global team. We are perpetually grateful to share with you this dynamic ecosystem of knowledge and the book.With cheers and appreciations,Christie Henry, Director (2017-present)Christie_Henry@press.princeton.eduPS: If you wish to submit a proposal for consideration to the Press, I thank you, and ask you to please visit our resources for authors for submissions guidelines and editorial contact information. All People170 Department Creative Media LabDirector’s OfficeEditing & ProductionEditorialFinance & OperationsGlobal Development & Intellectual PropertyHuman ResourcesInformation TechnologyMarketing & SalesPublishing Operations Staff Location PrincetonEuropeChina Sort by A - ZZ - A Showing 170 results Filter Sort by: A - Z Z - A Department Creative Media Lab Director’s Office Editing & Production Editorial Finance & Operations Global Development & Intellectual Property Human Resources Information Technology Marketing & Sales Publishing Operations Location Princeton Europe China Close Filters Abigail Johnson Associate Editor (Physical & Earth Sciences) Adriene Khon Junior Operations Analyst Agnieszka Maziarz Senior Accountant Akhil Jonnalagadda Program Coordinator (PUP Speaks) Alena Chekanov Assistant Editor Alexandria Leonard Senior Operations Analyst Alexis Alderton PUP Fellow - Publishing Ali Parrington Assistant Managing Editor Alison Kalett Editorial Director, Science Allegra Martschenko Editorial Coordinator Alyssa Sanford Publicist Amanda Gillette Administrative Assistant Andrew Brewer International Sales Director & Head of Paperback Publishing Anne Savarese Publisher Annie Miller Senior Art Book Publications Coordinator Anthony Lutkus Chief of North American Sales Barbara Nolan Special Sales and Grassroots Marketing Associate Barbara Tonetti Senior Reference Marketing Manager Barry Koen Inventory & Sales Operations Manager Ben Tate Senior Editor, Humanities Benjamin Higgins Studio Coordinator Bob Bettendorf Director of Copywriting Briget Hamernik IP & Royalties Manager Brigitta van Rheinberg Associate Director & Director of Global Development Caitlyn Robson-Iszatt Marketing Coordinator Carmen Jimenez Senior Publicist Carmina Alvarez-Gaffin Design Project Manager Caroline Priday Co-Head of PUP Europe Carrie Hudak Paperback Manager & Senior Production Edito