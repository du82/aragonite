full_description = "Rights & Intellectual Property Princeton University Press’s work within Rights & Intellectual Property brings scholarly ideas to the world, connecting authors and readers across spheres of knowledge to advance and enrich the global conversation. Working closely with distribution partners, international publishers and agents, we increase the reach of our authors and their scholarship by publishing digital and audio content and licensing subsidiary rights in various languages and formats, including print, digital, and audio editions. The Rights and IP team welcomes opportunities to expand the reach of our intellectual property. Film & Other Subsidiary Rights We welcome inquires about film and other subsidiary rights. Please reach out to discuss your project with our team. Email Inquiries Accessibility & Alternative Formats Princeton University Press is committed to providing ebook content created to facilitate assistive technology, aligning with current accessibility guidelines for those readers who benefit from enhanced features, including text-to-speech, bookmarks, and readability on a variety of devices. Read more about our commitment to accessibility in our Accessibility Policy Statement. Accessibility Policy Email Inquiries Permissions For information on how to secure permission to reuse Press content, access formats for students with print disabilities, understand Fair Use and Public Domain tenets, or review permissions guidelines for Press authors, we invite you to browse our permissions resources. Permissions Resources Audiobooks Many Princeton University Press books are now available as audiobooks. Learn more about our audio publishing and licensing partnerships. About Audiobooks International Rights Working closely with international publishers and agents around the world, our international rights team endeavors to increase the reach of our authors and their scholarship by licensing translation rights in various languages and formats. Learn more about our notable titles in translation and our licensing process. About International Rights Digital Our ebooks and digital products are available to individuals and to libraries and their patrons through a variety of distributors and platforms. About Our Digital Products Contacts Inés ter Horst Director of Intellectual Property Rebecca Bengoechea Senior International Rights Manager Emma Morgan International Rights Associate Eleanor Smith International Rights Associate Kim Williams Digital and Audio Publisher Paige Clunie Digital Partnerships Manager Danielle D’Orlando Curator of Audio General Inquiries Email General Inquiries"
