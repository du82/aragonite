["https://press.princeton.edu/books/audio/9780691262963/after-1177-bc"]
title = "After 1177 B.C. | Princeton University Press"
description = "This audiobook narrated by John Chancer tells the gripping story of what happened after the Bronze Age collapsed—why some civilizations endured, why some gave way to new ones, and why some disappeared forever Features Eric Cline’s FAQs as bonus content"
full_description = 'Ancient World After 1177 B.C.: The Survival of Civilizations Eric H. Cline Narrator Eric H. Cline John Chancer This audiobook narrated by John Chancer tells the gripping story of what happened after the Bronze Age collapsed—why some civilizations endured, why some gave way to new ones, and why some disappeared forever Features Eric Cline’s FAQs as bonus content Series: Turning Points in Ancient History Audio Preview Hardcover 30% off with code PUP30 Sale Price: $22.40/£19.60 Price: $32.00/£28.00 ISBN: 9780691262963 Published: Apr 16, 2024 Copyright: 2024 Runtime: 9 hours 17 minutes Main_subject: Ancient World More ebook 30% off with code PUP30 Sale Price: $22.40/£19.60 Price: $32.00/£28.00 ISBN: 9780691262963 Published: Apr 16, 2024 Copyright: 2024 Runtime: 9 hours 17 minutes Main_subject: Ancient World More Audio 30% off with code PUP30 Sale Price: $22.40/£19.60 Price: $32.00/£28.00 ISBN: 9780691262963 Published: Apr 16, 2024 Copyright: 2024 Runtime: 9 hours 17 minutes Main_subject: Ancient World More Buy This Request Exam Copy Download Cover Share Overview Author(s) Resources <iframe src="https://player.vimeo.com/video/908010237?title=0&byline=0&portrait=0" width="480" height="270" frameborder="0" webkitallowfullscreen mozallowfullscreen allowfullscreen></iframe> At the end of Eric Cline’s bestselling history 1177 B.C., many of the Late Bronze Age civilizations of the Aegean and Eastern Mediterranean lay in ruins, undone by invasion, revolt, natural disasters, famine, and the demise of international trade. An interconnected world that had boasted major empires and societies, relative peace, robust commerce, and monumental architecture was lost and the so-called First Dark Age had begun. Now, in After 1177 B.C., Cline tells the compelling story of what happened next, over four centuries, across the Aegean and Eastern Mediterranean world. It is a story of resilience, transformation, and success, as well as failures, in an age of chaos and reconfiguration.After 1177 B.C. tells how the collapse of powerful Late Bronze Age civilizations created new circumstances to which people and societies had to adapt. Those that failed to adjust disappeared from the world stage, while others transformed themselves, resulting in a new world order that included Phoenicians, Philistines, Israelites, Neo-Hittites, Neo-Assyrians, and Neo-Babylonians. Taking the story up to the resurgence of Greece marked by the first Olympic Games in 776 B.C., the book also describes how world-changing innovations such as the use of iron and the alphabet emerged amid the chaos.Filled with lessons for today about why some societies survive massive shocks while others do not, After 1177 B.C. reveals why this period, far from being the First Dark Age, was a new age with new inventions and new opportunities. Listen in: After 1177 B.C. Awards and Recognition A Financial Times Best Book of the Year A Science News Favorite Book of the Year A Federalist Notable Book of the Year Eric H. Cline is professor of classics and anthropology at George Washington University. He is the author of Three Stones Make a Wall: The Story of Archaeology, Digging Deeper: How Archaeology Works, 1177 B.C.: The Year Civilization Collapsed, and (with Glyniss Fawkes) 1177 B.C.: A Graphic History of the Year Civilization Collapsed (all Princeton). John Chancer is an award-winning narrator of hundreds of audiobooks. An actor with a long association with theater on both sides of the Atlantic, he has appeared in dozens of TV and film roles and has voiced numerous audio dramas, radio plays, video games, and cartoons. Book Bundle'
