["https://press.princeton.edu/about-ebook-audiobook-purchases"]
title = "About ebook & Audiobook Purchases | Princeton University Press"
full_description = "Back to Customer Support About ebook & Audiobook Purchases In partnership with Glassboxx, Princeton University Press has developed an app exclusively for reading ebooks and listening to audiobooks purchased on this website. Below you will find instructions and helpful tips for accessing ebook and audiobook content. Download the AppUse the Princeton University Press app to read or listen to books on your desktop or mobile devices. Download the app for iOS, Android, Windows, and macOS at the links below or on the Glassboxx downloads page. Available on App StoreAvailable on Google PlayAvailable on Microsoft Store Download & unzip for macOS Accessing Your BooksSetting Up an Account and Logging inEbook/audiobook customers will need to create an account at checkout in order for us to deliver ebooks and audiobooks to your Princeton University Press app. Once you have purchased an ebook or audiobook from the Princeton University Press website, you will receive a confirmation email. The email will contain links to download our app to access your book. When you open the app, log in with your email address (no password is required) and all your purchased content will be displayed on the MY BOOKS screen. Tap on the cover image to start listening to or reading your new book. Reading or Listening in Your Web BrowserYou can read or listen to your purchased content in the browser by logging in with your email address. The Browser Reader is available here. Please note that PDF ebooks may only be read in our mobile and desktop app. Verification CodeYou need a verification code to log into the app. After you enter your email address on the login screen, we will send a verification code to the email address you entered. The email will come from Glassboxx and has the subject “Your Glassboxx Verification Code.” You might need to check your spam folder to see the verification email. Copy and paste the code from the email into the verification screen and tap VERIFY ME. You will then be taken to the MY BOOKS screen, and you can start using the app to read or listen to your book. Can I use another app to read or listen to my book? While our ebooks and audiobooks are available for purchase from other retailers or platforms, purchases made on the Princeton University Press website can only be enjoyed on our branded mobile or desktop apps, powered by Glassboxx.ebook File FormatsPrinceton University Press publishes ebooks in ePub and PDF formats. Some exclusions may apply. ePubAn ePub file is an ebook that is readable on most devices, including mobile phones, tablets, and computers. Most of our titles are best viewed in a reflowable, ePub format. These may be read in our mobile or desktop app or in the Browser Reader.PDFPDF format is available for many of our books and is sold separately. PDF might be preferred by those who wish to read on a desktop or prefer a fixed layout, particularly with textbooks, highly illustrated books, or titles with mathematical formulas. These may be read in the Princeton University Press mobile or desktop app. Our PDF books cannot be read using the Browser Reader.Troubleshooting TipsTrouble Logging inIf you are having problems logging in to the app—for example if you see the message “Email address not recognized”)—make sure the email address you are entering on the login screen is the email address used when making your purchase from our website. This may be different from the one you are using for your app store account. After following the steps above, if you continue to see the message ‘Email address not recognized’, please contact PUPhelp@glassboxx.com. Mobile app not loading content correctlyIf the mobile app is not loading correctly, open the mobile app and click on the three dots (…) located at the bottom of the screen. Choose LOGOUT and enter your email address. Choose LOGIN and enter the verification code sent to your email. Your content should now load.Transferring your books to a new device If you have a new device, simply download our app from the app store, log in with the email address used when you purchased your books, and you will find them under MY BOOKS. Upgrade Notice (July 28, 2023)If you downloaded the Princeton University Press app prior to July 28, 2023, you will need to update app to access previously ordered digital books. Your device may update automatically depending on your personal settings. Otherwise, you may install the latest versions using the links provided above.Discount CodesYou can apply a valid discount code during checkout when you purchase an ebook or audiobook on this website. Redeem a Digital TokenIf you have a digital token to receive a book, you can redeem it by visiting the token redemption page. Sign in to your existing account or register if this is your first time receiving ebooks or audiobooks directly from Princeton University Press. Terms of UseOur ebook and audiobooks cannot be copied, shared, or printed. This is to protect the rights of the authors and the book publisher.Returns and ExchangesAll sales are final. There are no returns or refunds on ebook or audiobook sales. VAT and PricingPrices exclude VAT. Where applicable, VAT is applied at the appropriate rate and will be included in your final invoice. If you purchased a print book, customers are responsible and required to pay for any duties, tariffs, VAT, or taxes on any goods ordered from our website and received from our warehouse. AccessibilityRead about Princeton University Press’s commitment to accessibility.Read about Glassboxx, Ltd.’s commitment to accessibility. Contact UsIf you have other questions about your ebook or audiobook purchase(s) from this website, or if you need assistance with the app, please visit our Customer Support page or contact Customer Service at PUPhelp@glassboxx.com."
