title = "Exploring Black Experiences | Princeton University Press"
description = "First proposed by Black educators and the Black United Students at Kent State University in 1969, Black History Month, celebrated annually in February in the US, is an opportunity to celebrate Black voices, achievements, and to reflect on the central role of African Americans throughout US history. Princeton University Press is proud to publish books that engage with serious issues and ideas relating to Black experiences."
full_description = "Top left to bottom right: Kara Walker, James R. Jones, Keidrick Roy, Hajar Yazdiha Reading List Exploring Black Experiences February 01, 2025 Scroll to Article Content Share First proposed by Black educators and the Black United Students at Kent State University in 1969, Black History Month, celebrated annually in February in the US, is an opportunity to celebrate Black voices, achievements, and to reflect on the central role of African Americans throughout US history. Princeton University Press is proud to publish books that engage with serious issues and ideas relating to Black experiences. Fortuna and the Immortality Garden (Machine): A Respite for the Weary Time-Traveler. Featuring a Rite of Ancient Intelligence Carried out by the Gardeners toward the Continued Improvement of the Human Specious by Kara E-Walker View Book Add to Cart Kara Walker Edited by Eungie Joo Kara Walker is renowned for her bold examinations of the dynamics of power and the exploitation of race and sexuality through her profound work that has appeared in exhibitions around the world. She has created monumental sculptures, including A Subtlety, or the Marvelous Sugar Baby (2014), for the former Domino Sugar refinery in Brooklyn, and Fons Americanus (2019) for Tate Modern’s Turbine Hall. This beautifully designed book documents the creation of Walker’s major new commission, Fortuna and the Immortality Garden (Machine) (2024), at the San Francisco Museum of Modern Art. God's Long Summer: Stories of Faith and Civil Rights View Book Add to Cart Charles Marsh In the summer of 1964, the turmoil of the civil rights movement reached its peak in Mississippi, with activists across the political spectrum claiming that God was on their side in the struggle over racial justice. This was the summer when violence against blacks increased at an alarming rate and when the murder of three civil rights workers in Mississippi resulted in national media attention. Charles Marsh takes us back to this place and time, when the lives of activists on all sides of the civil rights issue converged and their images of God clashed. Water from the Rock: Black Resistance in a Revolutionary Age View Book Preorder Now Sylvia R. Frey The American Revolution brought about violent and unpredictable social changes throughout the new nation, particularly in the South. Sylvia Frey reveals how slave resistance gave rise to a Black liberation movement that was central to the revolutionary struggle in the southern colonies, and how Black resistance persisted after the war as a struggle for cultural power that manifested itself in the establishment of separate Black churches with distinctive ritual patterns and moral values. She examines how white Southerners responded to Black resistance amid their own fight for independence from the British, and how they reacted to new movements by African Americans in the postwar period. With an incisive foreword by Manisha Sinha, Water from the Rock shows how the upheavals of war created opportunities for a quiet revolution that laid the foundations for the modern civil rights movement in America. American Dark Age: Racial Feudalism and the Rise of Black Liberalism View Book Add to Cart Keidrick Roy Though the United States has been heralded as a beacon of democracy, many nineteenth-century Americans viewed their nation through the prism of the Old World. What they saw was a racially stratified country that reflected not the ideals of a modern republic but rather the remnants of feudalism. American Dark Age reveals how defenders of racial hierarchy embraced America’s resemblance to medieval Europe and tells the stories of the abolitionists who exposed it as a glaring blemish on the national conscience. The Last Plantation: Racism and Resistance in the Halls of Congress View Book Add to Cart James R. Jones Racism continues to infuse Congress’s daily practice of lawmaking and shape who obtains congressional employment. In this timely and provocative book, James Jones reveals how and why many who work in Congress call it the “Last Plantation.” He shows that even as the civil rights movement gained momentum in the 1960s and antidiscrimination laws were implemented across the nation, Congress remained exempt from federal workplace protections for decades. These exemptions institutionalized inequality in the congressional workplace well into the twenty-first century. Between Worlds: The Art of Bill Traylor View Book Add to Cart Leslie Umberger Bill Traylor (ca. 1853–1949) came to art-making on his own and found his creative voice without guidance; today he is remembered as a renowned American artist. Traylor was born into slavery on an Alabama plantation, and his experiences spanned multiple worlds—black and white, rural and urban, old and new—as well as the crucibles that indelibly shaped America—the Civil War, Reconstruction, Jim Crow, and the Great Migration. Between Worlds presents an unparalleled look at the work of this enigmatic and dazzling artist, who blended common imagery with arcane symbolism, narration with abstraction, and personal vision with the beliefs and folkways of his time. Basquiat-isms View Book Add to Cart Jean-Michel Basquiat Edited by Larry Warsh One of the most important artists of the late twentieth century, Jean-Michel Basquiat explored the interplay of words and images throughout his career as a celebrated painter with an instantly recognizable style. In his paintings, notebooks, and interviews, he showed himself to be a powerful and creative writer and speaker as well as image-maker. Basquiat-isms is a collection of essential quotations from this godfather of urban culture. In these brief, compelling, and memorable selections, taken from his interviews as well as his visual and written works, Basquiat writes and speaks about culture, his artistic persona, the art world, artistic influence, race, urban life, and many other subjects. Abloh-isms View Book Add to Cart Virgil Abloh Edited by Larry Warsh Abloh-isms is a collection of essential quotations from American fashion designer, DJ, and stylist Virgil Abloh, who was a major creative figure in the worlds of pop culture and art. Abloh began his career as Kanye West’s creative director before founding the luxury streetwear label Off-White and becoming artistic director for Louis Vuitton, making Abloh the first American of African descent to hold that title at a French fashion house. Defying categorization, Abloh’s work has been the subject of solo exhibitions at museums and galleries, most notably in a major retrospective at the Museum of Contemporary Art Chicago. Gathered from interviews and other sources, this selection of compelling and memorable quotations from the designer reveals his thoughts on a wide range of subjects, including creativity, passion, innovation, race, and what it means to be an artist of his generation. To Build a Black Future: The Radical Politics of Joy, Pain, and Care View Book Add to Cart Christopher Paul Harris When #BlackLivesMatter emerged in 2013, it animated the most consequential Black-led mobilization since the civil rights and Black power era. Today, the hashtag turned rallying cry is but one expression of a radical reorientation toward Black politics, protest, and political thought. To Build a Black Future examines the spirit and significance of this insurgency, offering a revelatory account of a new political culture—responsive to pain, suffused with joy, and premised on care—emerging from the centuries-long arc of Black rebellion, a tradition that traces back to the Black slave. Impermanent Blackness: The Making and Unmaking of Interracial Literary Culture in Modern America View Book Add to Cart Korey Garibaldi In Impermanent Blackness, Korey Garibaldi explores interracial collaborations in American commercial publishing—authors, agents, and publishers who forged partnerships across racial lines—from the 1910s to the 1960s. Garibaldi shows how aspiring and established Black authors and editors worked closely with white interlocutors to achieve publishing success, often challenging stereotypes and advancing racial pluralism in the process. Paul Laurence Dunbar: The Life and Times of a Caged Bird View Book Add to Cart Gene Andrew Jarrett A major poet, Paul Laurence Dunbar (1872–1906) was one of the first African American writers to garner international recognition in the wake of emancipation. In this definitive biography, the first full-scale life of Dunbar in half a century, Gene Andrew Jarrett offers a revelatory account of a writer whose Gilded Age celebrity as the “poet laureate of his race” hid the private struggles of a man who, in the words of his famous poem, felt like a “caged bird” that sings. The Struggle for the People’s King: How Politics Transforms the Memory of the Civil Rights Movement View Book Add to Cart Hajar Yazdiha In the post–civil rights era, wide-ranging groups have made civil rights claims that echo those made by Black civil rights activists of the 1960s, from people with disabilities to women’s rights activists and LGBTQ coalitions. Increasingly since the 1980s, white, right-wing social movements, from family values coalitions to the alt-right, now claim the collective memory of civil rights to portray themselves as the newly oppressed minorities. The Struggle for the People’s King reveals how, as these powerful groups remake collective memory toward competing political ends, they generate offshoots of remembrance that distort history and threaten the very foundations of multicultural democracy. The Darkened Light of Faith: Race, Democracy, and Freedom in African American Political Thought View Book Add to Cart Melvin L. Rogers Could the African American political tradition save American democracy? African Americans have had every reason to reject America’s democratic experiment. Yet African American activists, intellectuals, and artists who have sought to transform the United States into a racially just society have put forward some of the most original and powerful ideas about how to make America live up to its democratic ideals. In The Darkened Light of Faith, Melvin Rogers provides a bold new account of African American political thought through the works and lives of individuals who built this vital tradition—a tradition that is urgently needed today. Before Modernism: Inventing American Lyric View Book Add to Cart Virginia Jackson Before Modernism examines how Black poetics, in antagonism with White poetics in the late eighteenth and early nineteenth centuries, produced the conditions for the invention of modern American poetry. Through inspired readings of the poetry of Phillis Wheatley Peters, George Moses Horton, Ann Plato, James Monroe Whitfield, and Frances Ellen Watkins Harper—as well as the poetry of neglected but once popular White poets William Cullen Bryant and Henry Wadsworth Longfellow—Virginia Jackson demonstrates how Black poets inspired the direction that American poetics has taken for the past two centuries. The Campus Color Line: College Presidents and the Struggle for Black Freedom View Book Add to Cart Eddie R. Cole Some of America’s most pressing civil rights issues—desegregation, equal educational and employment opportunities, housing discrimination, and free speech—have been closely intertwined with higher education institutions. Although it is commonly known that college students and other activists, as well as politicians, actively participated in the fight for and against civil rights in the middle decades of the twentieth century, historical accounts have not adequately focused on the roles that the nation’s college presidents played in the debates concerning racism. Based on archival research conducted at a range of colleges and universities across the United States, The Campus Color Line sheds light on the important place of college presidents in the struggle for racial parity. Black Grief/White Grievance: The Politics of Loss View Book Add to Cart Juliet Hooker In democracies, citizens must accept loss; we can’t always be on the winning side. But in the United States, the fundamental civic capacity of being able to lose is not distributed equally. Propped up by white supremacy, whites (as a group) are accustomed to winning; they have generally been able to exercise political rule without having to accept sharing it. Black citizens, on the other hand, are expected to be political heroes whose civic suffering enables progress toward racial justice. In this book, Juliet Hooker, a leading thinker on democracy and race, argues that the two most important forces driving racial politics in the United States today are Black grief and white grievance. Also of Interest Race, Justice & Equity Collection Steadfast Democrats: How Social Forces Shape Black Political Behavior View Book Add to Cart Ismail K. White and Chryl N. Laird Black Americans are by far the most unified racial group in American electoral politics, with 80 to 90 percent identifying as Democrats—a surprising figure given that nearly a third now also identify as ideologically conservative, up from less than 10 percent in the 1970s. Why has ideological change failed to push more Black Americans into the Republican Party? Steadfast Democrats answers this question with a pathbreaking new theory that foregrounds the specificity of the Black American experience and illuminates social pressure as the key element of Black Americans’ unwavering support for the Democratic Party. Reading Lists Art & Archaeology Education History Literature Political Science Sociology"
