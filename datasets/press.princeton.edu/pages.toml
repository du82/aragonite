["https://press.princeton.edu/news/eo-aupresses"]
title = "EO AUPresses | Princeton University Press"
full_description = "PUP stands in solidarity with AUPresses in decrying the executive order on gender February 12, 2025 Share Princeton University Press is committed to free speech, the freedom to read, and the flourishing of all human beings. Without a richly varied ecosystem of readers, authors, and more, our many collaborations would never be sustained. As members of the Association of University Presses (AUPresses), we are proud to stand in solidarity with librarians, booksellers, and peer publishers in decrying the executive order on gender. Read the full AUPresses statement, below.AUPresses Decries Executive Order on GenderThe Association of University Presses agrees with publishers, authors, booksellers, and librarians across the United States that the White House executive order recognizing only two sexes constitutes censorship, pure and simple.We join with the American Booksellers Association, the Independent Book Publishers Association, National Book Critics Circle, and PEN America, among many others, to demand that this executive order be rescinded or stayed as soon as possible. Gender is lived experience, not political ideology, and this specious order has no place in a free society.University presses strive to give voice to the breadth of human knowledge and experience. The recognition of trans, intersex, and nonbinary people is a matter not only of intellectual freedom but also of civil and human rights. Suppressing LGBTQIA+ voices robs scholars, readers, and future generations of vital insights; creates a precedent for silencing dissident voices; and undermines the dignity of people everywhere.Read the full statement, originally published in Publishers Weekly, February 5, 2025, with the list of signatories, updated February 11, 2025.Statement on the Trump Administration’s Executive Order Targeting Transgender, Intersex, Nonbinary, and Gender-Nonconforming AmericansOn January 20, the White House issued an executive order stating that the United States government will only recognize two sexes, male and female, as defined “at conception.” The ripple effect of this order will undoubtedly affect public schools, public libraries, and the literature that is shelved in both.Among the many harms it causes, the order targeting transgender, intersex, nonbinary, and gender nonconforming Americans threatens unconstitutional censorship that could have a grave impact on literature for years to come. In dismissing trans, intersex, and nonbinary identities, the order blacklists LGBTQIA+ literature and invites the government to dictate the perspectives, beliefs, and identities that can exist in public forums receiving federal funding, amounting to financial coercion through the arbitrary withholding of funds. This censorship may begin with LGBTQIA+ perspectives, but it will not end there: allowing the government to censor one group erodes the First Amendment rights of all Americans, creating a precedent for silencing dissenting voices.If allowed to stand, the order will create new funding requirements imposed not only on federal entities, but private citizens and institutions who contract with them. Those requirements can and will be manipulated to dictate speech. The broader chilling effect on literature could be even harder to undo. Writers rely on funding from sources like the National Endowment for the Arts and the National Endowment for the Humanities, as well as the state-level institutions they fund.Trans, nonbinary, and intersex experience is vastly underrepresented in literature but disproportionately targeted by bans. During the 2022–2023 school year, 30% of books banned included LGBTQIA+ characters or themes. Such censorship robs us of perspectives that enrich the American story. Though the executive order in question tries to paint LGBTQIA+ people and allies as bullies enforcing their perspective on others through “legal and other socially coercive means,” that’s exactly what the order itself does, just as book-banning pressure groups have done since 2020 in school boards and libraries around the country. The fate of trans, intersex, and nonbinary people is not a political ideology, it’s a matter of human rights, civil rights, and freedom of expression. Government erosion of those rights should concern all Americans, regardless of their investment in LGBTQIA+ literature specifically.This executive order is censorship, pure and simple, and it has no place in a free society. It must be rescinded or stayed as soon as possible, and at the latest, before the earliest implementation deadline, February 19, 2025. Financially blacklisting trans, intersex, and non-binary perspectives will rob us of a vital literature yet to be written while insulting the dignity of LGBTQIA+ people everywhere. This return to McCarthyism by other means is a leap backwards to a grim chapter of American history.Sincerely, the undersigned:American Booksellers AssociationAmerican Booksellers for Free ExpressionAndrews McMeelAnnie’s FoundationAssociation of University PressesAudio Publishers AssociationAuthors Against Book BansBerry Powell PressCardinal Rule PressCharlesbridge PublishingChestnut Publishing HouseComic Book Legal Defense FundDeborah Sloan and Company and KidsbuzzDevelopmental TextsDraft2Draft DigitalEmpowering Latino FuturesEveryLibraryFirewater Media GroupFlorida Freedom to Read ProjectForeword ReviewsFreedom to Read ProjectGryphon Publishing Consulting, LLCIndependent Book Publishers Association (IBPA)IngramSparkJudging by the Cover: A BookstoreLafayette Citizens Against CensorshipLambda LiteraryLatino 247 Media GroupLee Wind, authorLevine QueridoLibrary FuturesLivingston Parish Library AllianceLouisiana Citizens Against CensorshipMacmillan Children’s Publishing GroupThe National Book Critics CircleNational Coalition Against CensorshipNorthSouth BooksNosy CrowOurShelvesPatagoniaPublishers and Writers of San Diego and Orange CountyPEN AmericaPFLAG FresnoPubWestRattling Good Yarns PressRead Freely