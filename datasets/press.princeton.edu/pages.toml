["https://press.princeton.edu/books/audio/9780691262888/the-deorhord"]
title = "The Deorhord | Princeton University Press"
description = "From the author of The Wordhord: Daily Life in Old English, an audiobook narrated by Isabel Adomakoh Young that takes you on an entertaining tour of Old English words for animals"
full_description = "The Deorhord: An Old English Bestiary Hana Videen Narrator Isabel Adomakoh Young From the author of The Wordhord: Daily Life in Old English, an audiobook narrated by Isabel Adomakoh Young that takes you on an entertaining tour of Old English words for animals Audio Preview Hardcover 30% off with code PUP30 Sale Price: $17.47 Price: $24.95 ISBN: 9780691262888 Published: Feb 20, 2024 Copyright: 2023 Runtime: 8 hours 41 minutes Paperback 30% off with code PUP30 Sale Price: $17.47 Price: $24.95 ISBN: 9780691262888 Published: Feb 20, 2024 Copyright: 2023 Runtime: 8 hours 41 minutes ebook 30% off with code PUP30 Sale Price: $17.47 Price: $24.95 ISBN: 9780691262888 Published: Feb 20, 2024 Copyright: 2023 Runtime: 8 hours 41 minutes Audio 30% off with code PUP30 Sale Price: $17.47 Price: $24.95 ISBN: 9780691262888 Published: Feb 20, 2024 Copyright: 2023 Runtime: 8 hours 41 minutes Buy This For sale only in the United States and Canada Request Exam Copy Download Cover Share Overview Author(s) Praise Many of the animals we encounter in everyday life, from pets and farm animals to the wild creatures of field and forest, have remained the same since medieval times. But the words used to name and describe them have often changed beyond recognition, starting with the Old English word for “animal” itself, deor (pronounced DAY-or). In The Deorhord, Hana Videen presents a glittering Old English bestiary of animals real and imaginary, big and small, ordinary and extraordinary—the good, the bad, and the downright baffling.From gange-wæfran or walker-weavers (spiders) and hasu-padan or grey-cloaked ones (eagles) to heafdu swelce mona or moon-heads (historians still don’t know!), The Deorhord introduces a world both familiar and strange: where ants could be monsters and panthers could be your friend, where dog-headed men were as real as elephants, and where whales were as sneaky as wolves. The curious stories behind these words provide vivid insights into the language, literature, and lives of those who spoke Old English—the language of Beowulf—more than a thousand years ago.A delightful journey through the weird and wonderful world of Old English, The Deorhord is a magical menagerie of new creatures and new words for the modern englisc reader to discover. Hana Videen is a writer, blogger, and the author of The Wordhord: Daily Life in Old English (Princeton). She holds a PhD in Old English from King’s College London, and has been hoarding Old English words since 2013, when she began tweeting one a day. Website www.oldenglishwordhord.com Isabel Adomakoh Young appears in Foundation on Apple TV+ and Heartstopper on Netflix. Her theater work includes As You Like It at Shakespeare’s Globe and Hamlet at the Bristol Old Vic. She is the narrator of Aphra Behn’s Oroonoko and Girl, Woman, Other by Bernardine Evaristo, among other audiobooks. “If you love words, the weird and the wild, I guarantee you’ll crouch over this book like a dragon over gold.”—Meg Clothier, author of The Book of Eve “A dream! I learnt something new and fascinating on every page.”—Lucy Mangan, author of Are We Having Fun Yet?"
