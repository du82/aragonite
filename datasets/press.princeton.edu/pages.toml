title = "Privacy Policy | Princeton University Press"
full_description = "Privacy Policy Welcome to Princeton University PressThis website is operated by Princeton University Press (hereinafter, “we”, “our” or “us”). We respect your privacy and we are committed to protecting your information. The privacy policy below discloses our practices regarding information collection and usage solely for the website located at press.princeton.edu (the “website”). This privacy policy does not apply to any other websites, apps or services provided by us, our affiliates or clients, unless it appears on such website, app or service.This privacy policy aims to give you information on how we collect and processed your information through your use of this website, including any data you may provide through this website when you use our Service or contact us using the contact information below.It is important that you read this privacy policy together with any other privacy notice or fair processing notice we may provide on specific occasions when we are collecting or processing information about you so that you are fully aware of how and why we are using your data.This privacy policy is provided in a layered format so you can click through to the specific areas set out below. Information CollectionYour provision of your personal information to us is completely voluntary. “Personal information” is information that can specifically identify you. We do not collect personal information unless you submit that information to us. Categories of personal information we may collect include:Identity Data, which includes name or other similar identifiers.Contact Data, which includes address, email address and telephone numbers.Financial Data, which includes credit card, debit card or other payment card details.Additionally, we may also collect certain others types of information that, along with Identity Data, Contact Data, and Financial Data, may be considered and specifically named “personal data” in certain jurisdictions, including the European Union (“EU”) and the United Kingdom (“UK”), such as:Transaction Data, which includes details about payments to and from you.Technical Data, which includes internet protocol (IP) address, location data, your login data, and device and browser information.Profile Data, which includes your username and password, your prior purchases.Usage Data, which includes information about how you use our website.Marketing and Communications Data, which includes your preferences in receiving marketing from usIF YOU ARE SITUATED IN THE EU OR THE UK, PLEASE SEE THE SECTION “ADDITIONAL EU AND UK DISCLOSURES” THAT PERTAIN TO OUR COLLECTION, USE AND DISCLOSURE OF YOUR PERSONAL DATA AND ADDITIONAL RIGHTS YOU HAVE UNDER APPLICABLE LAW.We use different methods to collect data from and about you including through:Direct interactions: You may give us your information by registering or contacting us. This includes information you provide when you:create an account on our website;subscribe to our publications;make a purchase;request marketing to be sent to you; orgive us feedback.Automated technologies or interactions: As you interact with our website, we may automatically collect Technical Data and Usage Data about you. Some of the ways in which we or our website may collect are further described below:Cookies and other technologies: The website may use cookies, a type of technology that installs a small amount of information on a website user’s computer or other device to permit a website to, for example, recognize future visits using that computer or device. The website may use other similar technologies (including, without limitation, tracking pixels, as described further below, and other anonymous identifiers) to gather information about you, such as IP addresses and location data, to customize your visit, to enable us to enhance our service, or for other purposes. For information on how to opt out of cookies, please see the “Opt-Out” section below.The vast majority of data collected and stored in the cookies placed on our website is anonymous information, or information that cannot be associated with an individual person. There are some occasions, such as when we need to record your preferences, when we do need to collect and store information in cookies that relate specifically to you. For instance, if you subscribe to our services or make a purchase, we may associate your personal information that you provide to us with your cookies data to better customize our service offerings for you.We currently use the following cookies, tags, pixels and trackers:Cookie NameDuration/TypePurposeMore InformationA17_fonts_cookie_sans-serif;indefinitedetermine font capabilitieshttps://press.princeton.eduA17_fonts_cookie_serifindefinitedetermine font capabilitieshttps://press.princeton.edu_ga2 yearsanalytic tracking on the site; registers a unique ID that is used to generate statistical data on how the visitor uses the websitehttps://developers.google.com/analytics/devguides/collection/analyticsjs/cookie-usage_gaexp2 yearsanalytic tracking on the site; used to determine a user’s inclusion in an experiment and the expiry of experiments a user has been included in.https://developers.google.com/analytics/devguides/collection/analyticsjs/cookie-usageNID2,000,000 seconds or 23 daysanalytic tracking on the site; contains a unique ID Google uses to remember a visitor preferences and other informationhttps://policies.google.com/technologies/types Information Use and SharingSubject to the section titled “Additional EU and UK Disclosures”, we use information held about you to perform our services and for other purposes outlined below. Specifically, we use your information for a variety of purposes:Where we need to perform the contract we are about to enter into or have entered into with you.To perform specific services that you have requested.To respond to your direct inquiries.Where it is necessary for our legitimate interests (or those of a third party) and your interests and fundamental rights do not override those interests.To send you marketing materials (see below)Where we need to comply with a legal or regulatory obligation.Subject to the section titled “Additional EU and UK Disclosures”, we may share the information we collect about you with certain third parties in the following ways:To use certain services on our website, payment card information may be requested. We may ask you for credit card, debit card, or other payment information. By submitting your payment information through our websites, to the extent permitted by applicable law, you expressly consent to the sharing of your information with third-party payment processors, and other third-party service providers.We may, from time to time, share your information with our business partners, operational service providers and subcontractors and other third parties.Third parties to whom we may choose to sell, transfer, or merge parts of our business or our assets. Alternatively, we may seek to acquire other businesses or merge with them, if we are part of a bankruptcy proceeding or other change in control.Third parties to whom we need to share your information to investigate suspected fraud, harassment or other violations of any law, rule or regulation, or the policies for the website. Third-Party Links and Social Networking ServicesThis website may include links to third-party websites, plug-ins and applications. Clicking on those links or enabling those connections may allow third parties to collect or share data about you. We do not control these third-party websites and are not responsible for their privacy statements. When you leave our website, we encourage you to read the privacy policy of every website you visit.The website may integrate with social networking services. You understand that we do not control such services and are not liable for the manner in which they operate. While we may provide you with the ability to use such services in connection with our website, we are doing so merely as an accommodation and, like you, are relying upon those third party services to operate properly and fairly.You should be aware that information which you voluntarily include and transmit online in a publicly accessible blog, social network or otherwise online may be viewed and used by others. We are unable to control such uses of your information, and by using such services you assume the risk that the information provided by you may be viewed and used by third parties. Data SecurityWe have put in place appropriate security measures to prevent information about you from being accidentally lost, used or accessed in an unauthorized way, altered or disclosed; however, due to the inherent open nature of the Internet, we cannot ensure or warrant the security of any information provided online. We have put in place procedures to deal with any suspected data breach that will affect you and will notify you and any applicable regulator of a breach where we are legally required to do so. Data RetentionWe will only retain your information for as long as necessary to fulfil the purposes we collected it for, including for the purposes of satisfying any legal, accounting, or reporting requirements. To determine the appropriate retention period for your information, we consider the amount, nature, and sensitivity of the information, the potential risk of harm from unauthorized use or disclosure of your information, the purposes for which we process your information and whether we can achieve those purposes through other means, and the applicable legal requirements.In some circumstances, if you are situated in the EU or the UK, you can ask us to delete your data: see Request erasure below for further information.In some circumstances we may anonymize information about you (so that it can no longer be associated with you) for research or statistical purposes in which case we may use and retain this information indefinitely without further notice to you. Additional EU and UK DisclosuresOur role as data controllerPrinceton University Press is the data controller of all personal data collected through our Website. To contact us, please see the section titled “Contact Us”.If you are situated in the EU or UK and have any complaints regarding our privacy practices as data controller, you have the right to make a complaint at any time to your local Supervisory Authority. We would, however, appreciate the chance to deal with your concerns before you approach your Supervisory Authority so please contact us in the first instance. Please see our contact details below in the section titled “Contact Us”. If you are situated in the UK, and have a complaint, please contact our privacy manager located in the UK, who can be contacted here: webmaster@press.princeton.edu. If you are situated in the EU and have a complaint, please contact our EU privacy representative located in Germany, who can be contacted at Carlo.Piltz@piltz.legal.Provision of personal data and failure to provide personal dataWhere we need to collect personal data by law, or under the terms of a contract we have with you and you fail to provide that data when requested, we may not be able to perform the contract we have or are trying to enter into with you (for example, to provide you with our services). In this case, we will not be able to provide services to you.Legal basis for our processing of your personal dataBelow are the types of lawful basis that we will rely on to process your personal data:Legitimate Interest means the interest of our business in conducting and managing our business to enable us to give you the best service/product and the best and most secure experience. We make sure we consider and balance any potential impact on you (both positive and negative) and your rights before we process your personal data for our legitimate interests. We do not use your personal data for activities where our interests are overridden by the impact on you (unless we have your consent or are otherwise required or permitted to by law). You can obtain further information about how we assess our legitimate interests against any potential impact on you in respect of specific activities by contacting us at webmaster@press.princeton.edu.Performance of Contract means processing your data where it is necessary for the performance of a contract to which you are a party or to take steps at your request before entering into such a contract.Comply with a legal or regulatory obligation means processing your personal data where it is necessary for compliance with a legal or regulatory obligation that we are subject.Consent was given by you to us for certain use of your personal data.Change of purposeWe will only use your personal data for the purposes for which we collected it, unless we reasonably consider that we need to use it for another reason and that reason is compatible with the original purpose. If you wish to get an explanation as to how the processing for the new purpose is compatible with the original purpose, please contact us at webmaster@press.princeton.edu. If we need to use your personal data for an unrelated purpose, we will notify you and we will explain the legal basis which allows us to do so. Please note that we may process your personal data without your knowledge or consent, in compliance with the above rules, where this is required or permitted by law.Collection of personal data from third party sourcesWe also collect personal data about you from various third parties and public sources.We may receive your information from our advertising partners, hosting partners, and sales and distribution partners.As discussed above, we also obtain information through automated technologies (see section titled “Information Collection”)Use of your personal data for marketing purposesWe strive to provide you with choices regarding certain personal data uses, particularly around marketing and advertising:Promotional offers from us: We may use your personal data to form a view on what we think you may want or need, or what may be of interest to you. This is how we decide which products, services and offers may be relevant for you (we call this marketing). You will receive marketing communications from us if you have requested information from us or used our services and, in each case, you have not opted out of receiving that marketing.Third-party marketing: We will get your express opt-in consent before we share your personal data with any company outside our company for marketing purposes.To see how you can opt out of marketing communications, please see the section titled “Opt-Out”.Rights of EU and UK Data SubjectsUnder certain circumstances, you have rights under data protection laws in relation to your personal data. you have the right to:Request access to your personal data (commonly known as a “data subject access request”). This enables you to receive a copy of the personal data we hold about you and to check that we"
