["https://press.princeton.edu/books/hardcover/9780691206691/women-architects-at-work"]
title = "Women Architects at Work | Princeton University Press"
description = "A comprehensive history of the women architects who left their enduring mark on American Modernism"
full_description = 'Art & Architecture Women Architects at Work: Making American Modernism Mary Anne Hunting and Kevin D. Murphy A comprehensive history of the women architects who left their enduring mark on American Modernism Look Inside Look Inside Hardcover Price: $65.00/£55.00 ISBN: 9780691206691 Published (US): Feb 18, 2025 Published (UK): Apr 15, 2025 Copyright: 2025 Pages: 272 Size: 9 x 11 in. Illus: 74 color + 88 b/w illus. Main_subject: Art & Architecture More ebook Price: $65.00/£55.00 ISBN: 9780691206691 Published (US): Feb 18, 2025 Published (UK): Apr 15, 2025 Copyright: 2025 Pages: 272 Size: 9 x 11 in. Illus: 74 color + 88 b/w illus. Main_subject: Art & Architecture More Buy This Request Exam Copy Download Cover Share Overview Author(s) Praise In the decades preceding World War II, professional architecture schools enrolled increasing numbers of women, but career success did not come easily. Women Architects at Work tells the stories of the resilient and resourceful women who surmounted barriers of sexism, racism, and classism to take on crucial roles in the establishment and growth of Modernism across the United States.Mary Anne Hunting and Kevin D. Murphy describe how the Cambridge School of Architecture and Landscape Architecture in Massachusetts evolved for the professional education of women between 1916 and 1942. While alumnae such as Eleanor Agnes Raymond, Victorine du Pont Homsey, and Sarah Pillsbury Harkness achieved some notoriety, others like Elizabeth-Ann Campbell Knapp and Louisa Vaughan Conrad have been largely absent from histories of Modernism. Hunting and Murphy describe how these innovative practitioners capitalized on social, educational, and professional ties to achieve success and used architecture to address social concerns, including how modernist ideas could engage with community and the environment. Some joined women-led architectural firms while others partnered with men or contributed to Modernism as retailers of household furnishings, writers and educators, photographers and designers, or fine artists.With stunning illustrations, Women Architects at Work offers new histories of recognized figures while recovering the stories of previously unsung women, all of whom contributed to the modernization of American architecture and design. Mary Anne Hunting is an architectural historian and the author of Edward Durell Stone: Modernism’s Populist Architect. Kevin D. Murphy is the Andrew W. Mellon Chair in the Humanities and professor and chair in the Department of the History of Art and Architecture at Vanderbilt University. His books include Jonathan Fisher of Blue Hill, Maine: Commerce, Culture, and Community on the Eastern Frontier. "[Mary Anne Hunting and Kevin D. Murphy] succeeded in reviving the work of scores of impressive women. A well-populated, deeply researched history."—Kirkus Reviews "This book models the research and scholarship needed to more fully represent women in the history of architecture. The result is a richer story of both women in architecture and modernism in the United States."—Library Journal starred review "A valuable survey of modernist women architects. . . . Interspersed with ample photos and sketches, this is a comprehensive and welcome revival of a lesser-known chapter in the history of architecture."—Publishers Weekly “Impeccably researched and written alongside gorgeous illustrations, this book opens our eyes to the importance of the women of the Cambridge School of Architecture and Landscape Architecture. Hunting and Murphy change how we think about the development of modernist architecture in the United States, revealing a nuanced, complex, and fascinating history.”—Despina Stratigakos, author of Where Are the Women Architects? “Women Architects at Work offers a completely new take on American Modernism as a movement to which women contributed not just their tangible projects, but also a different approach to professional practice and collaboration.”—Alice T. Friedman, author of American Glamour and the Evolution of Modern Architecture “A detailed and original exploration of women who studied architecture in the United States and then entered professional practice largely, but not exclusively, as architects. This ambitious book features a broad representation of both foreign- and American-born women who advanced the modern movement and its understanding of vernacular concerns.”—Mardges Bacon, author of Le Corbusier in America: Travels in the Land of the Timid'
