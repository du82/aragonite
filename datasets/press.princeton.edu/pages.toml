["https://press.princeton.edu/resources/permissions"]
title = "Permissions | Princeton University Press"
description = "Request permission to reprint material, inquire about accessible formats for print-disabled students, find recommendations for fair use and public domain content, and review permissions guidelines for authors."
full_description = "Back to Resources Permissions Republication for Commercial and Course UseMost material published by Princeton University Press cannot be reproduced without permission. Please note that it is the requestor’s responsibility to ascertain copyright, including checking credit lines and acknowledgments to confirm that the Press is the copyright holder or exclusive publisher. Individuals and businesses seeking permission for commercial use or course instructors seeking permissions for print and electronic course packs can follow this link to the Copyright Clearance Center to submit a request electronically. Online Permission Request FormFor requests for titles not listed with the Copyright Clearance Center, you may submit your request online by following this link to our Online Permission Request Form. Please allow 2–4 weeks for a response from the Permissions Department regarding your inquiry. Please note that our grant of permission does not apply to any part of the material that is separately copyrighted. It is the responsibility of the requestor to determine, based on the credit lines or source notations listed in the book, the correct copyright source for the material. Accessible FormatsPrinceton University Press is committed to providing ebook content created to facilitate assistive technology, aligning with current accessibility guidelines for those readers who benefit from enhanced features, including text-to-speech, bookmarks, and readability on a variety of devices. Read more about our commitment to accessibility in our Accessibility Policy Statement. Permissions for Albert Einstein’s WritingsIt is the responsibility of the requestor to confirm authenticity, research origins and/or ascertain copyright for Einstein quotations.Publication and Other Uses of MaterialIf you wish to reproduce material for publication in print, digital, or any other form, including but not limited to the uses listed below, you need to obtain the written permission in advance.Publication in any hard copy form (i.e. book, periodical).Use in television, film or video.Publication in any electronic form.Duplication in any networked or public site, or in any “virtual library” (but you may incorporate the URL for certain material, though not the material itself, in your personal hypertext).Public display in any form of electronic or hard copy (except for a single copy for use in an academic lecture of seminar).Duplication by photocopying or any other means for use in any teaching pack.Permission ContactsFor unpublished material or for material originally published after 1971 or published in The Collected Papers of Albert Einstein, please contact Princeton University Press to obtain permission to publish reproduction of material.For material originally published prior to 1971, please contact the Albert Einstein Archives at The Hebrew University of Jerusalem to obtain permission to publish reproduction of material.Other RightsEinstein’s texts are available for publication in translation in many languages. For more information, please contact the International Rights team at internationalrights@press.princeton.edu.Einstein’s name and image may be licensed for use in commercials or advertisements in various media, including newspapers, magazines, television, film, or video. For more information, please contact CMG Worldwide. Fair Use and Public DomainFor some helpful tips about the principles of “fair use” and “public domain” works we encourage you to read our guidelines for use. Good Sense PrinciplesIdeas, themes, and facts are not copyrightable.Limit your borrowing, both quantitatively and qualitatively.Avoid uses that replace the original.Keep the borrowed portion as insignificant as possible a part of the new work. Copyright ResourcesUS Copyright OfficeAssociation of University PressesAmerican Center for Social Media, Poetry Foundation Code of Best Practices in Fair Use for Poetry"
