["https://press.princeton.edu/books/paperback/9780691249575/the-entanglement"]
title = "The Entanglement | Princeton University Press"
description = "Why human nature is an aesthetic phenomenon—and why we need art and philosophy to understand ourselves"
full_description = '''Philosophy The Entanglement: How Art and Philosophy Make Us What We Are Alva Noë Why human nature is an aesthetic phenomenon—and why we need art and philosophy to understand ourselves Look Inside Look Inside Hardcover Price: $18.95/£14.99 ISBN: 9780691249575 Published: Feb 25, 2025 Pages: 288 Size: 5.25 x 8 in. Main_subject: Philosophy Paperback Price: $18.95/£14.99 ISBN: 9780691249575 Published: Feb 25, 2025 Pages: 288 Size: 5.25 x 8 in. Main_subject: Philosophy ebook Price: $18.95/£14.99 ISBN: 9780691249575 Published: Feb 25, 2025 Pages: 288 Size: 5.25 x 8 in. Main_subject: Philosophy Buy This Request Exam Copy Download Cover Share Overview Author(s) Praise In The Entanglement, philosopher Alva Noë explores the inseparability of life, art, and philosophy, arguing that we have greatly underestimated what this entangled reality means for understanding human nature.Life supplies art with its raw materials, but art, Noë argues, remakes life by giving us resources to live differently. Our lives are permeated with the aesthetic. Indeed, human nature is an aesthetic phenomenon, and art—our most direct and authentic way of engaging the aesthetic—is the truest way of understanding ourselves. All this suggests that human nature is not a natural phenomenon. Neither biology, cognitive science, nor AI can tell a complete story of us, and we can no more pin ourselves down than we can fix or settle on the meaning of an artwork. Even more, art and philosophy are the means to set ourselves free, at least to some degree, from convention, habit, technology, culture, and even biology. In making these provocative claims, Noë explores examples of entanglement—in artworks and seeing, writing and speech, and choreography and dancing—and examines a range of scientific efforts to explain the human.Challenging the notions that art is a mere cultural curiosity and that philosophy has been outmoded by science, The Entanglement offers a new way of thinking about human nature, the limits of natural science in understanding the human, and the essential role of art and philosophy in trying to know ourselves. Awards and Recognition Winner of the Outstanding Monograph Prize, American Society for Aesthetics Alva Noë is professor of philosophy at the University of California, Berkeley, where he is a member of the Center for New Media, the Institute for Cognitive and Brain Sciences, and the Program in Critical Theory. His many books include Strange Tools: Art and Human Nature and Learning to Look: Dispatches from the Art World. "What Noë shows is how that essential act of ‘making’ art is more than just an act of pleasure. What it really encompasses is a radical act of inquiry into our entanglement."—Adam Frank, Big Think "Art is at the heart of philosophy and the fusion of the two with a range of subjects can help us better understand what makes us human. . . . Alva Noë has introduced his thesis that is bound to generate enough debate on the antidote supplied by art and philosophy that 'makes us what we are,' a state where the people, surrounded by music, art, sculpture, poetry become creative enough to break out of the codified social organisation into a more liberated and an inspirationally fulfilling life infused with the aesthetic."—Shelley Walia, The Hindu "For a half-decade, I’ve been puzzling through art’s functionless function with Alva Noë. . . . [The Entanglement] digs into the difference between the pictures and objects humans use every day, to shop on Amazon.com or to call on their gods, and the pictures and objects we use as works of art."—Blake Gopnik, New York Times "Alva Noë’s fascinating and expansive new book gives an account of what art does, what it and philosophy of philosophy have in common, and how these activities should be situated in our best account of the world."—Owen Andrew Wynn, Times Literary Supplement "[An] interesting interdisciplinary book exploring the inseparability of life, art and philosophy in the context of an entangled reality… is an original and liberating phenomenological perspective in relation to existential self-making and world-making."—David Lorimer, The Paradigm Explorer “The sheer ambition of Noë’s ideas is impressive. His book is a beautiful example of poised, appealing, even amusing philosophical prose. My work as an art critic will certainly be shaped by the ideas in The Entanglement.”—Blake Gopnik, former chief art critic at the Washington Post and author of Warhol “Alva Noë, one of the most important philosophers working today, argues that artistic creation lies at the root of ethics, philosophy, and even human agency. Fundamentally, Noë shows, each of us is our own artistic project, constantly remaking ourselves and the life worlds we occupy. A stunningly ambitious and brilliant contribution to twenty-first-century thought.”—Jason Stanley, author of How Fascism Works: The Politics of Us and Them “Although the word fun is rarely applied to philosophy, Alva Noë is fun to read. In The Entanglement, he argues that the aesthetic is always already ‘entangled’ in dynamic, embodied, reflective human experience, and, further, that art and philosophy are vehicles of liberation, the means by which, we, creatures of habit and our own rote technologies, can also wrench ourselves free of them. Boldly conceived, lucidly written, and charged with ethical meanings, this is a book that will spawn discussion, critique, and further thought, exactly—I think—what its author intended.”—Siri Hustvedt, author of A Woman Looking at Men Looking at Women “I am always inspired by Alva Noë’s elegant and fresh thinking.”—Sheila Heti, author of Pure Color: A Novel “Bold, daring, and original, this book will help to move art closer to the center of philosophical attention, where it has always belonged. Alva Noë is one of the few big-picture thinkers with the expertise and imagination to synthesize a wide array of subjects into a compelling and lucid account of what makes us human. In The Entanglement, he draws on his many years of work on the philosophy of art and perception to give us his most comprehensive vision yet of the place of art in life and the shaping of meaning.”—Justin Smith, author of The Internet Is Not What You Think It Is'''
