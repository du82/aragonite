["https://press.princeton.edu/books/audio/9780691257372/long-live-queer-nightlife"]
title = "Long Live Queer Nightlife | Princeton University Press"
description = "It’s closing time for an alarming number of gay bars in cities around the globe—but this audiobook narrated by Amin El Gamal reveals why it’s definitely not the last dance"
full_description = '''Long Live Queer Nightlife: How the Closing of Gay Bars Sparked a Revolution Amin Ghaziani Narrator Amin El Gamal It’s closing time for an alarming number of gay bars in cities around the globe—but this audiobook narrated by Amin El Gamal reveals why it’s definitely not the last dance Collections: Race, Justice & Equity Audio Preview Hardcover 30% off with code PUP30 Sale Price: $20.97/£17.50 Price: $29.95/£25.00 ISBN: 9780691257372 Published: Mar 19, 2024 Copyright: 2024 Runtime: 9 hours 20 minutes ebook 30% off with code PUP30 Sale Price: $20.97/£17.50 Price: $29.95/£25.00 ISBN: 9780691257372 Published: Mar 19, 2024 Copyright: 2024 Runtime: 9 hours 20 minutes Audio 30% off with code PUP30 Sale Price: $20.97/£17.50 Price: $29.95/£25.00 ISBN: 9780691257372 Published: Mar 19, 2024 Copyright: 2024 Runtime: 9 hours 20 minutes Buy This Request Exam Copy Download Cover Share Overview Author(s) <iframe src="https://player.vimeo.com/video/933866216?title=0&byline=0&portrait=0" width="480" height="270" frameborder="0" webkitallowfullscreen mozallowfullscreen allowfullscreen></iframe> In this exhilarating journey into underground parties, pulsating with life and limitless possibility, acclaimed author Amin Ghaziani unveils the unexpected revolution revitalizing urban nightlife.Far from the gay bar with its largely white, gay male clientele, here is a dazzling scene of secret parties—club nights—wherein culture creatives, many of whom are queer, trans, and racial minorities, reclaim the night in the name of those too long left out. Episodic, nomadic, and radically inclusive, club nights are refashioning queer nightlife in boundlessly imaginative and powerfully defiant ways.Drawing on Ghaziani’s immersive encounters at underground parties in London and more than one hundred riveting interviews with everyone from bar owners to party producers, revelers to rabble-rousers, Long Live Queer Nightlife showcases a spectacular, if seldom-seen, vision of a queer world shimmering with self-empowerment, inventiveness, and joy. Awards and Recognition A Them Queer Book We're Itching to Read A Write Through the Night Best Nonfiction Book of the Year Amin Ghaziani is professor of sociology and Canada Research Chair in Urban Sexualities at the University of British Columbia. He is the award-winning author of The Dividends of Dissent, Sex Cultures, and There Goes the Gayborhood? (Princeton). His work has been featured widely in international media outlets, including the New Yorker, the Financial Times, the Los Angeles Times, the Guardian, USA Today, and British Vogue. Amin El Gamal is an Egyptian-American actor, producer, and advocate. An AudioFile Earphones Award–winning audiobook narrator, their TV and film work includes roles on the Fox show Prison Break and in the film Message from the King, opposite Chadwick Boseman.'''
