["https://press.princeton.edu/books/audio/9780691262925/puerto-rico"]
title = "Puerto Rico | Princeton University Press"
description = "This audiobook narrated by Tony Chiroldes traces the multifaceted history of Puerto Rico from pre-Columbian times to today"
full_description = 'History Puerto Rico: A National History Jorell Meléndez-Badillo Narrator Tony Chiroldes This audiobook narrated by Tony Chiroldes traces the multifaceted history of Puerto Rico from pre-Columbian times to today Collections: Race, Justice & Equity Audio Preview Hardcover 30% off with code PUP30 Sale Price: $20.97/£17.50 Price: $29.95/£25.00 ISBN: 9780691262925 Published: Apr 2, 2024 Copyright: 2024 Runtime: 10 hours 27 minutes Main_subject: History More Paperback 30% off with code PUP30 Sale Price: $20.97/£17.50 Price: $29.95/£25.00 ISBN: 9780691262925 Published: Apr 2, 2024 Copyright: 2024 Runtime: 10 hours 27 minutes Main_subject: History More ebook 30% off with code PUP30 Sale Price: $20.97/£17.50 Price: $29.95/£25.00 ISBN: 9780691262925 Published: Apr 2, 2024 Copyright: 2024 Runtime: 10 hours 27 minutes Main_subject: History More Audio 30% off with code PUP30 Sale Price: $20.97/£17.50 Price: $29.95/£25.00 ISBN: 9780691262925 Published: Apr 2, 2024 Copyright: 2024 Runtime: 10 hours 27 minutes Main_subject: History More Buy This Request Exam Copy Download Cover Share Overview Author(s) Praise <iframe src="https://player.vimeo.com/video/912737384?title=0&byline=0&portrait=0" width="480" height="270" frameborder="0" webkitallowfullscreen mozallowfullscreen allowfullscreen></iframe> (English) <iframe src="https://player.vimeo.com/video/912704668?title=0&byline=0&portrait=0" width="480" height="270" frameborder="0" webkitallowfullscreen mozallowfullscreen allowfullscreen></iframe> (Spanish) Puerto Rico is a Spanish-speaking territory of the United States with a history shaped by conquest and resistance. For centuries, Puerto Ricans have crafted and negotiated complex ideas about nationhood. Jorell Meléndez-Badillo provides a new history of Puerto Rico that gives voice to the archipelago’s people while offering a lens through which to understand the political, economic, and social challenges confronting them today.In this masterful work of scholarship, Meléndez-Badillo sheds light on the vibrant cultures of the archipelago in the centuries before the arrival of Columbus, and captures the full sweep of Puerto Rico’s turbulent history in the centuries that followed, from the first indigenous insurrection against colonial rule in 1511—led by the powerful chieftain Agüeybaná II—to the establishment of the Commonwealth in 1952. He deftly portrays the contemporary period and the intertwined though unequal histories of the archipelago and the continental United States.Puerto Rico is an engaging, sometimes personal, and consistently surprising history of colonialism, revolt, and the creation of a national identity, offering new perspectives not only on Puerto Rico and the Caribbean but on the United States and the Atlantic world more broadly.Available in Spanish from our partners at Grupo Planeta Listen in: Puerto Rico Jorell Meléndez-Badillo is assistant professor of Latin American and Caribbean history at the University of Wisconsin–Madison. He is the author of The Lettered Barriada: Workers, Archival Power, and the Politics of Knowledge in Puerto Rico. Tony Chiroldes is an original Broadway cast member of the award-winning musical In the Heights. His voice work includes the video games Grand Theft Auto: Vice City and BioShock as well as hundreds of commercials in English and Spanish. His audiobooks include the Spanish edition of Barack Obama’s Of Thee I Sing. “Puerto Rico is a much-needed retelling of the island nation’s story. Jorell Meléndez-Badillo’s centering of workers’ movements, women, and queer activism as vital sources of political history resurrects Puerto Rico’s silenced past. The usual suspects of established two-party politics are all here, but the riveting context of an array of actors from the bottom up as well as the author’s personal narrative make it a rewarding read.”—Ed Morales, author of Fantasy Island: Colonialism, Exploitation, and the Betrayal of Puerto Rico “Written with urgency and care, Jorell Meléndez-Badillo’s Puerto Rico eschews a top-down narrative of colonial violence and instead amplifies Puerto Ricans’ vibrant and creative forms of resistance. As Puerto Rico finds itself in a moment of deepening crisis, the histories recounted in this book provide lessons about how Puerto Ricans have always found ways to imagine and fight for a future rooted in freedom.”—Marisol LeBrón, author of Policing Life and Death: Race, Violence, and Resistance in Puerto Rico'
