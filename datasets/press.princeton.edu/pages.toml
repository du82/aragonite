["https://press.princeton.edu/books/audio/9780691262154/a-history-of-the-muslim-world"]
title = "A History of the Muslim World | Princeton University Press"
description = "This audiobook narrated by Ric Jerrom traces the panoramic history of the Muslim world from the age of the Prophet Muḥammad to the the dawn of the modern era"
full_description = "History A History of the Muslim World: From Its Origins to the Dawn of Modernity Michael A. Cook Narrator Ric Jerrom This audiobook narrated by Ric Jerrom traces the panoramic history of the Muslim world from the age of the Prophet Muḥammad to the the dawn of the modern era Audio Preview Hardcover 30% off with code PUP30 Sale Price: $27.97/£24.50 Price: $39.95/£35.00 ISBN: 9780691262154 Published: May 7, 2024 Copyright: 2024 Runtime: 52 hours 0 minutes Main_subject: History More ebook 30% off with code PUP30 Sale Price: $27.97/£24.50 Price: $39.95/£35.00 ISBN: 9780691262154 Published: May 7, 2024 Copyright: 2024 Runtime: 52 hours 0 minutes Main_subject: History More Audio 30% off with code PUP30 Sale Price: $27.97/£24.50 Price: $39.95/£35.00 ISBN: 9780691262154 Published: May 7, 2024 Copyright: 2024 Runtime: 52 hours 0 minutes Main_subject: History More Buy This Request Exam Copy Download Cover Share Overview Author(s) This book describes and explains the major events, personalities, conflicts, and convergences that have shaped the history of the Muslim world. The body of the work takes readers from the origins of Islam to the eve of the nineteenth century, and an epilogue continues the story to the present day. Michael Cook thus provides a broad history of a civilization remarkable for both its unity and diversity.After setting the scene in the Middle East of late antiquity, the book depicts the rise of Islam as one of the great black swan events of history. It continues with the spectacular rise of the Caliphate, an empire that by the time it broke up had nurtured the formation of a new civilization. The book then goes on to cover the diverse histories of all the major regions of the Muslim world, providing a wide-ranging account of the major military, political, and cultural developments that accompanied the eastward and westward spread of Islam from the Middle East to the shores of the Atlantic and the Pacific.At the same time, A History of the Muslim World deploys numerous quotations deriving from primary sources. These expose the reader to a variety of voices from the Muslim past, and what they have to say can be acutely intelligent and insightful. Awards and Recognition A Choice Outstanding Academic Title of the Year Michael Cook is the Class of 1943 University Professor of Near Eastern Studies at Princeton University. His books include Ancient Religions, Modern Politics: The Islamic Case in Comparative Perspective (Princeton), A Brief History of the Human Race, and The Koran: A Very Short Introduction. Ric Jerrom has devised, directed, and performed in experimental theater in more than forty countries and acted on BBC Radio and in UK and Irish theaters. An AudioFile Earphones Award–winning voice artist, he is the narrator of numerous audiobooks, including Patrick O’Brian’s acclaimed Aubrey–Maturin series."
