["https://press.princeton.edu/books/audio/9780691262901/the-balanced-brain"]
title = "The Balanced Brain | Princeton University Press"
description = "This audiobook narrated by Camilla Nord reveals how we can use what we’ve learned about the brain to improve our mental health"
full_description = 'Neuroscience & Psychology The Balanced Brain: The Science of Mental Health Camilla Nord Narrator Camilla Nord This audiobook narrated by Camilla Nord reveals how we can use what we’ve learned about the brain to improve our mental health Audio Preview Hardcover 30% off with code PUP30 Sale Price: $13.97 Price: $19.95 ISBN: 9780691262901 Published: Jan 23, 2024 Copyright: 2023 Runtime: 10 hours 16 minutes Main_subject: Neuroscience & Psychology More Paperback 30% off with code PUP30 Sale Price: $13.97 Price: $19.95 ISBN: 9780691262901 Published: Jan 23, 2024 Copyright: 2023 Runtime: 10 hours 16 minutes Main_subject: Neuroscience & Psychology More ebook 30% off with code PUP30 Sale Price: $13.97 Price: $19.95 ISBN: 9780691262901 Published: Jan 23, 2024 Copyright: 2023 Runtime: 10 hours 16 minutes Main_subject: Neuroscience & Psychology More Audio 30% off with code PUP30 Sale Price: $13.97 Price: $19.95 ISBN: 9780691262901 Published: Jan 23, 2024 Copyright: 2023 Runtime: 10 hours 16 minutes Main_subject: Neuroscience & Psychology More Buy This For sale in the United States, US Dependencies, the Philippines, and Canada Request Exam Copy Download Cover Share Overview Author(s) Praise There are many routes to mental well-being. In this groundbreaking book, neuroscientist Camilla Nord offers a fascinating tour of the scientific developments that are revolutionising the way we think about mental health, showing why and how events—and treatments—can affect people in such different ways.In The Balanced Brain, Nord explains how our brain constructs our sense of mental health —actively striving to maintain balance in response to our changing circumstances. While a mentally healthy brain deals well with life’s turbulence, poor mental health results when the brain struggles with disruption. But just what is the brain trying to balance? Nord describes the foundations of mental health in the brain—from the neurobiology of pleasure, pain and desire to the role of mood-mediating chemicals like dopamine, serotonin, and opioids. She then pivots to interventions, revealing how antidepressants, placebos, and even recreational drugs work; how psychotherapy changes brain chemistry; and how the brain and body interact to make us feel physically (as well as mentally) healthy. Along the way, Nord explains how the seemingly small things we use to lift our moods—a piece of chocolate, a walk, a chat with a friend—work on the same pathways in our brains as the latest treatments for mental health disorders.Understanding the cause of poor mental health is one of the crucial questions of our time. But the answer is unique to each of us. Finding what helps your brain rebalance and thrive means finding the answer to this question. With so many factors at play, there are more possibilities for recovery and resilience than we might think. Listen in: The Balanced Brain Camilla Nord on The Balanced Brain Ideas Podcast: The Balanced Brain Awards and Recognition A Times Best Science and Environment Book Camilla Nord leads the Mental Health Neuroscience Lab at the University of Cambridge. Her research has been featured in the New Statesman, the Daily Mail, the British Journal of Psychiatry and the BBC. "Masterfully nuanced."—David Robson, The Guardian "Rigorous—but also engagingly personal. . . . The Balanced Brain provides an exciting snapshot of what we know so far about this vital organ’s importance for maintaining our mental health."—Peter Carty, inews.co.uk “Simply brilliant. This is science writing at its best. If you want to understand mental health—really understand it—read this book.”—Nichola Raihani, author of The Social Instinct “This excellent book is a breath of fresh air . . . anyone reading it will come away with a kinder, better understanding of themselves. A clear-thinking tour of the latest research from a leading mental health scientist and an accessible exploration of how our bodies and minds make us feel the way we do—or better or worse.”—Lucy Foulkes, author of What Mental Illness Really Is . . . (and what it isn’t) “This is a wonderful, living history of how scientists have gained insights into and currently think about the dynamic health of the brain. Nord’s narrative style is intimate and engaging, making you feel almost as though you were there when breakthroughs were made. The denouement is a deeply compelling message. To navigate the fleeting joys and transient displeasures of life, there is one sustaining imperative—namely, balance.”—Karl Friston, University College London “Extremely relevant . . . a highly readable synthesis of the neuroscience underpinning mental health and its treatment."—Simon Baron-Cohen, author of The Pattern Seekers “Fascinating . . . Camilla Nord, one of our most original thinkers, writes compellingly about the complexities of the brain and mental health. She presents new insights from neuroscience about how the brain generates our mental state, thoughts, moods and feelings, and what happens when things go wrong. This thought-provoking book is an essential resource.”—Sarah-Jayne Blakemore, author of Inventing Ourselves'
