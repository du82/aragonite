["https://press.princeton.edu/news/cristobal-pera-board"]
title = "Cristóbal Pera Board | Princeton University Press"
full_description = "Cristóbal Pera joins the Princeton University Press Board of Trustees February 25, 2025 Share The VP and Publisher of Planeta USA brings to PUP’s Board decades of experience in global, Spanish-language publishing and literary translation Princeton University Press is thrilled to welcome Cristóbal Pera to the Press’s Board of Trustees. Pera is Vice President and Publisher of Planeta USA, the North American arm of the Spanish publisher, and brings to the Board decades of experience as a publisher, editor, and literary agent in Europe, Latin America, and the United States. At Planeta USA, Pera heads up the publisher’s bilingual publishing collaboration with Princeton University Press, which launched in 2024 with the release of Puerto Rico: A National History / Puerto Rico: Historia de una nación by Jorell Meléndez-Badillo. Prior to his leadership of Planeta USA, Pera was Publishing Director of Vintage Español, director of The Wylie Agency España, and editorial director of Random House Mondadori México, among other roles. Pera also serves on the Advisory Board of George Washington University’s Graduate Program in Publishing and previously served on the advisory boards of the Frankfurt Academy of the Frankfurt Book Fair and of Words Without Borders. Of Pera’s appointment to PUP’s Board, Press Director Christie Henry notes, “It has been a joy to expand our global publishing through the Planeta partnership, which we jointly imagined with Cristóbal and the Planeta team. We are excited and grateful to now open a new collaborative chapter, in which Cristóbal—with his incredible knowledge and vision and his scholarly expertise in Latin American literature—will help propel PUP forward as a member of our Board of Trustees. I join the Board in its every celebration and anticipation of his contributions.” Pera adds, “It is a great honor to join the PUP Board of Trustees. What an exciting opportunity to pursue my two passions, book publishing and academia, and to continue learning alongside a stellar group of publishers, editors, and scholars. The partnership between Princeton University Press and Grupo Planeta will continue to advance the cultural and political conversation with our simultaneous editions in English and Spanish.” Over the course of his career, Pera has edited and published works by a wide roster of internationally renowned novelists, scholars, and journalists, including Jorge Luis Borges, Sandra Cisneros, Julia Alvarez, Erika L. Sánchez, Enrique Krauze, Lydia Cacho, and Jorge Ramos. He has edited several books by Gabriel García Márquez, including Living to Tell the Tale, I’m Not Here to Give a Speech, and The Scandal of the Century, as well as García Márquez’s novel Until August, which was published posthumously in 2024. Pera holds a PhD in Latin American Literature and has taught and lectured at the University of Texas at Austin, the University of Barcelona, Yale University, Princeton University, Middlebury College, and the Universitat Pompeu Fabra. He is the author of Modernistas en París: El mito de París en la prosa modernista hispanoamericana as well as a novel, La bahía suspendida. He has also translated into Spanish works by George Orwell, Richard Powers, Mavis Gallant, and Ian Banks, and has contributed numerous essays to scholarly publications. Pera’s term on the PUP board began in January 2025."
