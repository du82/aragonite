["https://press.princeton.edu/about/offices/europe"]
title = "Europe | Princeton University Press"
full_description = "Europe Scroll to Article Content The European office of Princeton University Press celebrates its twenty-fifth anniversary in 2024. Located in the heart of Oxford, the office at 99 Banbury Road provides a welcoming space for staff, authors, and visitors alike. Its presence has given us the opportunity to grow the Press’s scholarly connections and visibility in Europe through the thoughtful expansion of our collaborations with authors and through increased media coverage and sales reach. Originally consisting of three people, the European office has now grown to twenty-five, including members of our editorial, sales, marketing, publicity, rights, and digital and audio teams. Our European editors commission in the humanities, social sciences, and sciences, and our publishing teams bring scholarly ideas to the world in close collaboration with our colleagues based in the Princeton, NJ, and Beijing, China offices. The European office also works with the University Press Group, which manages sales throughout Europe. Our print books are distributed in the region by John Wiley & Sons Ltd and we work with a broad range of global vendors to deliver digital and audio content to scholars, students, and engaged readers everywhere. European Advisory Board The 24-member European Advisory Board is a vital source of insight and advice on developments in the European academy and publishing, and serves as a sounding board for new editorial initiatives and discipline specific book projects. Board members also help raise awareness of the Press within the broad community of academic authors and scholarly publishing in Europe. Hamideh Afsarmanesh Professor of Computer Science and Head of the Federated Collaborative Networks group, Informatics Institute, Computer Science Department, University of Amsterdam Jim Al-Khalili CBE FRS Distinguished Professor of Physics and Professor of the Public Engagement in Science, University of Surrey; author and broadcaster Richard Bourke Professor of the History of Political Thought and Fellow of King’s College, University of Cambridge Kai Brodersen Professor of Ancient Culture and former President of the University of Erfurt Paul Cartledge A. G. Leventis Professor of Greek Culture, Emeritus, University of Cambridge Iain Couzin Director of the Max Planck Institute for Ornithology and Chair of Biodiversity and Collective Behavior, University of Konstanz Diane Coyle CBE Bennett Professor of Public Policy, University of Cambridge Pedro G. Ferreira Professor of Astrophysics, University of Oxford, and Director of the Beecroft Institute for Particle Astrophysics and Cosmology Jonathan Glasspool Chair of Bonhill Plc and Bath Spa University; Former Managing Director, Bloomsbury Publishing Plc Sunetra Gupta Professor of Theoretical Epidemiology, Department of Zoology, University of Oxford Sir Peter Knight Senior Fellow in Residence at the Kavli Royal Society International Centre at Chicheley Hall, former President of the Institute of Physics, and Emeritus Professor/Senior Research Investigator, Imperial College London Tom Kraushaar Publisher, Klett-Cott Verlag, Germany Margaret MacMillan CC, CH Professor of International History and Honorary Fellow of St Antony’s College, University of Oxford Rana Mitter Deutsche Bank Director of the University China Centre and Professor of the History and Politics of Modern China, University of Oxford Ann Mroz Editor and Digital Publishing Director, Times Educational Supplement, and former Editor of Times Higher Education Geoff Mulgan Chief Executive Officer of the National Endowment for Science, Technology, and the Arts Angus Phillips Director of the Oxford International Centre for Publishing Studies, Oxford Brookes University Danny Quah Li Ka Shing Professor of Economics, Lee Kuan Yew School of Public Policy, National University of Singapore Miri Rubin Professor of Medieval and Early Modern History and Head of the School of History, Queen Mary University of London David Runciman Professor and Head of the Department of Politics and Fellow of Trinity Hall, University of Cambridge Marion Turner Professor of English Literature and Chair of the English Faculty Board, and Fellow of Jesus College, University of Oxford Robert Wade Professor of Political Economy and Development, London School of Economics Nigel Warburton Freelance philosopher, author of numerous books, and copresenter with David Edmonds of the Philosophy Bites podcast Patricia Williams Former Commissioning Editor (Cambridge UP, Harvard UP) and Publisher for the National Gallery, London. Trustee of the Isaiah Berlin Literary Trust, Honorary Fellow of Wolfson College, Oxford Contact General Princeton University Press 99 Banbury Road Oxford OX2 6JX United Kingdom Email Sales Princeton University Press 99 Banbury Road Oxford OX2 6JX United Kingdom Email Inspection Copy Enquiries Princeton University Press 99 Banbury Road Oxford OX2 6JX United Kingdom Email Media and PR Princeton University Press 99 Banbury Road Oxford OX2 6JX United Kingdom Email Stay connected for the latest books, Ideas, and special offers. Stay connected for the latest book news."
