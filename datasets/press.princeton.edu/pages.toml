["https://press.princeton.edu/books/audio/9780691262215/father-time"]
title = "Father Time | Princeton University Press"
description = "This audiobook narrated by Katherine Fenton gives a sweeping account of male nurturing, explaining how and why men are biologically transformed when they care for babies"
full_description = 'Biology Father Time: A Natural History of Men and Babies Sarah Blaffer Hrdy Narrator Katherine Fenton This audiobook narrated by Katherine Fenton gives a sweeping account of male nurturing, explaining how and why men are biologically transformed when they care for babies Audio Preview Hardcover 30% off with code PUP30 Sale Price: $20.97/£17.50 Price: $29.95/£25.00 ISBN: 9780691262215 Published: May 14, 2024 Copyright: 2024 Runtime: 13 hours 47 minutes Main_subject: Biology More ebook 30% off with code PUP30 Sale Price: $20.97/£17.50 Price: $29.95/£25.00 ISBN: 9780691262215 Published: May 14, 2024 Copyright: 2024 Runtime: 13 hours 47 minutes Main_subject: Biology More Audio 30% off with code PUP30 Sale Price: $20.97/£17.50 Price: $29.95/£25.00 ISBN: 9780691262215 Published: May 14, 2024 Copyright: 2024 Runtime: 13 hours 47 minutes Main_subject: Biology More Buy This Request Exam Copy Download Cover Share Overview Author(s) Praise <iframe src="https://player.vimeo.com/video/943395663?title=0&byline=0&portrait=0" width="480" height="270" frameborder="0" webkitallowfullscreen mozallowfullscreen allowfullscreen></iframe> It has long seemed self-evident that women care for babies and men do other things. Hasn’t it always been so? When evolutionary science came along, it rubber-stamped this venerable division of labor: mammalian males evolved to compete for status and mates, while females were purpose-built to gestate, suckle, and otherwise nurture the victors’ offspring. But come the twenty-first century, increasing numbers of men are tending babies, sometimes right from birth. How can this be happening? Puzzled and dazzled by the tender expertise of new fathers around the world—several in her own family—celebrated evolutionary anthropologist and primatologist Sarah Blaffer Hrdy set out to trace the deep history of male nurturing and explain a surprising departure from everything she had assumed to be “normal.”In Father Time, Hrdy draws on a wealth of research to argue that this ongoing transformation in men is not only cultural, but profoundly biological. Men in prolonged intimate contact with babies exhibit responses nearly identical to those in the bodies and brains of mothers. They develop caring potential few realized men possessed. In her quest to explain how men came to nurture babies, Hrdy travels back through millions of years of human, primate, and mammalian evolution, then back further still to the earliest vertebrates—all while taking into account recent economic and social trends and technological innovations and incorporating new findings from neuroscience, genetics, endocrinology, and more. The result is a masterful synthesis of evolutionary and historical perspectives that expands our understanding of what it means to be a man—and what the implications might be for society and our species. Awards and Recognition A New Statesman Best Book of the Academic Presses A Telegraph Best Book to Read This Summer A Daily Express Best Book of the Year Sarah Blaffer Hrdy is professor emerita of anthropology at the University of California, Davis. She is the author of The Woman That Never Evolved, Mother Nature, and Mothers and Others: The Evolutionary Origins of Mutual Understanding. Katherine Fenton is an award-winning voice actor and the narrator of many audiobooks, including Ira Levin’s Rosemary’s Baby, Elizabeth Gilbert’s The Last American Man, and The Shock Doctrine by Naomi Klein. Science | Evolution'
