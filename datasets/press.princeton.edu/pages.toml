title = "China | Princeton University Press"
full_description = "China Scroll to Article Content Princeton University Press opened its China office in August 2017, the first such presence for an American university press, because of China’s increasing centrality in the world of ideas and its growing investment in higher education and scholarly research. Our ambition is to selectively publish exemplary Chinese scholarship and make it available globally in translation. The Press has established a China Advisory Board of internationally recognized scholars to collaborate in this endeavor. It will also launch a fellowship program to identify innovative Chinese scholars and support their book projects. China Academic Advisory Board The China Advisory Board advises the Press in its scholarly mission in China and serves as an informal referral system for promising authors, ideas, and proposals. Justin Yifu Lin Professor and Honorary Dean of the National School of Development, Director of the Center for New Structural Economics, and Dean of the Institute of South-South Cooperation and Development, Peking University Yigong Shi Professor at the School of Life Sciences, Tsinghua University Hui Wang Professor in the Department of Chinese Language and Literature and Director of the Institute for Advanced Studies in Humanities and Social Sciences, Tsinghua University Yu Xie Bert G. Kerstetter ’66 University Professor of Sociology and Joint Faculty with the Princeton Institute for International and Regional Studies, Princeton University Lan Xue Professor and Dean of the School of Public Policy and Management, Tsinghua University Xuetong Yan Dean of the Institute of Modern International Relations, Tsinghua University, and President of the Carnegie-Tsinghua Management Board Andrew Chi-Chih Yao Professor and Dean of the Institute for Interdisciplinary Information Sciences, Tsinghua University Daniel A. Bell Dean of the School of Political Science and Public Administration, Shandong University, and Professor at Tsinghua Universi