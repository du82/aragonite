["https://press.princeton.edu/books/audio/9780691262116/ai-needs-you"]
title = "AI Needs You | Princeton University Press"
description = "This audiobook narrated by Daisy Donovan shares an electrifying vision of how we can safeguard AI’s future for the public good"
full_description = "Computer Science & Electrical Engineering AI Needs You: How We Can Change AI's Future and Save Our Own Verity Harding Narrator Daisy Donovan This audiobook narrated by Daisy Donovan shares an electrifying vision of how we can safeguard AI’s future for the public good Audio Preview Hardcover 30% off with code PUP30 Sale Price: $17.47/£14.00 Price: $24.95/£20.00 ISBN: 9780691262116 Published: Mar 12, 2024 Copyright: 2024 Runtime: 8 hours 30 minutes Main_subject: Computer Science & Electrical Engineering More ebook 30% off with code PUP30 Sale Price: $17.47/£14.00 Price: $24.95/£20.00 ISBN: 9780691262116 Published: Mar 12, 2024 Copyright: 2024 Runtime: 8 hours 30 minutes Main_subject: Computer Science & Electrical Engineering More Audio 30% off with code PUP30 Sale Price: $17.47/£14.00 Price: $24.95/£20.00 ISBN: 9780691262116 Published: Mar 12, 2024 Copyright: 2024 Runtime: 8 hours 30 minutes Main_subject: Computer Science & Electrical Engineering More Buy This Request Exam Copy Common Reading Selection Download Cover Share Overview Author(s) Praise Artificial intelligence may be the most transformative technology of our time. As AI’s power grows, so does the need to figure out what—and who—this technology is really for. AI Needs You argues that it is critical for society to take the lead in answering this urgent question and ensuring that AI fulfills its promise.Verity Harding draws inspiring lessons from the histories of three twentieth-century tech revolutions—the space race, in vitro fertilization, and the internet—to empower each of us to join the conversation about AI and its possible futures. Sharing her perspective as a leading insider in technology and politics, she rejects the dominant narrative, which often likens AI’s advent to that of the atomic bomb. History points the way to an achievable future in which democratically determined values guide AI to be peaceful in its intent; to embrace limitations; serve purpose, not profit; and to be firmly rooted in societal trust.AI Needs You gives us hope that we, the people, can imbue AI with a deep intentionality that reflects our best values, ideals, and interests, and that serves the public good. AI will permeate our lives in unforeseeable ways, but it is clear that the shape of AI’s future—and of our own—cannot be left only to those building it. It is up to us to guide this technology away from our worst fears toward a future that we can trust and believe in. Awards and Recognition An Economist What will be the bestsellers in the coming year? An Economist Biggest Book of the Year A Tatler Front & Female Must-Read Non-Fiction Book of the Year So Far A Behavioral Scientist Notable Book of the Year Verity Harding is director of the AI & Geopolitics Project at the Bennett Institute for Public Policy at the University of Cambridge and founder of Formation Advisory, a consultancy firm that advises on the future of technology and society. She worked for many years as global head of policy for Google DeepMind and as a political adviser to Britain’s deputy prime minister. Daisy Donovan writes for TV and film and has created, written, and presented comedy documentaries for Channel 4 and TBS. She is the narrator of Maggie O’Farrell’s acclaimed memoir I Am, I Am, I Am, among other audiobooks. “What is the world that AI is creating? And why are the rest of us letting this world be shaped by a small, privileged group of (mainly) men in Silicon Valley? This book, rooted in deep historical insights about prior technological disruptions, is essential reading for anybody keen to ensure the transformative power of AI is directed to the common good.”—Diane Coyle, author of Cogs and Monsters “Essential. There’s no one else I’d more want to read on this subject.”—Sathnam Sanghera, author of Stolen History"
