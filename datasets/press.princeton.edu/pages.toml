["https://press.princeton.edu/ideas/celebrating-bird-photographer-of-the-year"]
title = "Celebrating Bird Photographer of the Year | Princeton University Press"
description = 'Photographers from "Bird Photographer of the Year: Collection 9" tell the stories behind their selected shots.'
full_description = "Essay Celebrating Bird Photographer of the Year February 22, 2025 Scroll to Article Content Share Bird Photographer of the Year Available in 2 editions Buy This PUP is delighted to be the publisher of Bird Photographer of the Year annual collections, and to present this showcase of the winning photographs from the 2024 competition.The beautiful, large-format book showcases the best images from the 2024 contest—some of the most stunning bird photographs ever taken. A gorgeous record of avian beauty and diversity across the globe, it presents a vast variety of photos by experienced professionals and enthusiastic amateurs, reflecting the huge diversity of bird and nature lovers, which is vital for ensuring the conservation and survival of birds. A portion of the profits from this book goes to Birds on the Brink, a charity that supports bird conservation around the world. Moreover, the book demonstrates the dedication and passion of bird photographers and the incredible quality of today’s digital imaging systems.Bird Behaviour | Bronze Award Winner The AttackMagellanic Penguin, Spheniscus magellanicus. Volunteer Point, Falkland Islands (Islas Malvinas).Tom Schandy, Norway.I was at Volunteer Point on the Falkland Islands in January 2023 when I noticed a Southern Sea Lion patrolling along the beach trying to catch penguins. This individual has been there for several years and, in this picture, it is a Magellanic Penguin that faces the underwater threat. The photograph shows that sea lion attacking from underwater in an attempt to capture the penguin on the crest of the wave. In the event, it was successful and this Southern Sea Lion had penguin for breakfast that day.Canon EOS R5 with Canon 100–400mm f/4.5–5.6 II lens. 400mm; 1/1,600s; f/5.6; ISO 200.Black And White | Bronze Award Winner Snow TurkeysWild Turkey, Meleagris gallopavo. Carlton County, Minnesota, United States.Sparky Stensaas, United States.Three Wild Turkeys were transformed into abstract art when photographed through our living room picture window on a snowy day. Most photographers say you should never shoot through window glass, but I do it all the time and get good results. Rules were made to be broken! As a bit of background, after about a month with little motivation to do any bird photography, I was inspired to try something creative by my recent purchase of three BPOTY books. The creative winning shots really jump-started my bird photography again!Canon EOS R5 with Canon RF 100–500mm f/4.5–7.1 lens. 114mm; 1/125s; f/8; ISO 200.Best Portrait | Silver Award Winner SwanceptionMute Swan, Cygnus olor. London, United Kingdom.Samual Stone, United Kingdom.I conceived the idea for this image some time ago, but each time I attempted to turn it into reality one of the elements was not right. It felt like I was in a creative rut and I had not taken an image I was really happy with for a while. On this particular morning, I decided to return to this idea out of desperation. I spotted my local Mute Swans in their usual spot, preening in the morning light. Fortunately, it was also a crisp morning, and the mist was slowly descending, creating a soft morning glow. After so many attempts, everything finally came together when a swan swam into the perfect spot. Finally, I created the image I had pictured in my mind.Nikon Z6 with Sigma 150–600mm f/5–6.3 lens. 155mm; 1/500s; f/6.3; ISO 1,600.Comedy Bird Photo | Silver Award Winner Open DoorEastern Screech-Owl, Megascops asio. Clearwater, Florida, United States.Robert Gloeckner, United States.This image shows an Eastern Screech-Owl as it leans out of a ‘window’ of its home. These tiny owls are common in Florida’s densely populated areas. On my way to work one day I spotted a dead palm tree in Clearwater that had likely looking holes in its trunk. Later that day I checked again and spotted this owl peeking out of it. During nesting season, Eastern Screech- Owls often use premade holes in trees as their nesting cavity.Canon EOS R5 with Canon 100–400mm f/4.5–5.6 lens. 400mm; 1/320s; f/6.3; ISO 800.11 and Under | Gold Award Winner Turbulent Fish HuntEurasian Bittern, Botaurus stellaris. Lake Federsee, Bad Buchau, Germany.Julian Mendla, Germany.Lake Federsee is a famous wintering area for numerous migratory birds. From November to March, Eurasian Bitterns are frequent visitors to this lake. As soon as the lake freezes over, these rare birds retreat to trenches through the reeds. Surprisingly, this individual was very close to the boardwalk that leads through the nature reserve. From there, I could easily watch its fishing campaign and take numerous photos.Nikon D500 with Nikon 200–500mm f/5.6 lens. 500mm; 1/800s; f/5.6; ISO 1,000.Best Portrait | Gold Award Winner Winter PinkGrey-crowned Rosy-finch, Leucosticte tephrocotis. Homer, Alaska, United StatesAlan Murphy, United StatesDuring my stay in Alaska, Grey-crowned Rosy-finches would gather in large flocks next to my hotel. Fortunately for photographers, they are a very tame species and they allowed me to set up my tripod and camera to grab a few frames before they all took off. The colours in the background are distant boats in a marina.Nikon D850 with Nikon 600mm f/4 lens. 600mm; 1/250s; f/6.3; ISO 1,000. Essays Princeton Nature"
year_published = 2025
clearnet = "https://press.princeton.edu/ideas/celebrating-bird-photographer-of-the-year"
