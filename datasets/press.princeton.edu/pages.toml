full_description = "Condemning the arrest of Educational Bookshop owners February 11, 2025 Share Princeton University Press believes that access to books is a vital right of readers everywhere. We stand in solidarity with the American Booksellers Association (ABA), PEN America, and writers and publishers in Israel and beyond in condemning the arrest of Mahmoud Muna and Ahmed Muna, owners of the Educational Bookshop in East Jerusalem and valued partners for PUP’s international sales team.We echo the ABA in asserting that the “erosion of the right to read anywhere threatens the right to read everywhere” and Liesl Gerntholtz, managing director of PEN America’s Freedom to Write Center, in emphasizing that: “Now more than ever, books offer a bridge towards understanding, sharing knowledge, and fostering dialogue. When authorities arrest booksellers for the ‘crime’ of selling books, they threaten everyone’s right to understand and engage the stories and ideas those books hold.”Read the full statement from PEN America here.Read an open letter in in support of the Munas, on behalf of Israeli and international authors here (in Hebrew, Arabic, and English)."
