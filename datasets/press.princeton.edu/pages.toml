full_description = "Common Reading FAQ About Common Reading2025 Catalog & ThemesHow can I request a sample copy?Request print copies by clicking Order Sample Copies and and completing the form. Certain requests, including those for larger selection committees (of approximately 10 or more), might be fulfilled digitally.Where can I find free supplementary course materials?Sample course materials, discussion guides, and other helpful resources are available for many Common Reading titles! Check out each book’s webpage for ideas on how to complement your school’s programming—see Viral Justice as a sample.Where can I learn about pricing or how to place an order?You (or your bookstore representative) can email commonreads@press.princeton.edu for info on bulk discounts or to place an order with us through our distributor, Ingram Publisher Services.How can I arrange an author visit to my campus?Many PUP authors are available for live/virtual campus visits or workshops; send an email to ask about your event. For those authors represented by PUP Speaks, additional information is available here.Can Princeton print a customized edition?Yes! Send an email to request a quote on options such as adding your school’s logo to the cover or binding in a letter to your first-year class. All customized editions are non-returnable and require a longer lead time (approx. 8 weeks) for printing. Minimum order quantities apply.Are ebooks available?Ebooks are available for all PUP titles, and many titles are also available as audiobooks—check our catalog for ebook and audiobook ISBNs. Ask about bulk pricing here.How do I get more information on PUP’s Common Reading program?Feel free to send an email with any additional questions!"
