["https://press.princeton.edu/books/paperback/9780691242699/night-vision"]
title = "Night Vision | Princeton University Press"
description = "A philosopher’s personal meditation on how painful emotions can reveal truths about what it means to be truly human"
full_description = '''Philosophy Night Vision: Seeing Ourselves through Dark Moods Mariana Alessandri A philosopher’s personal meditation on how painful emotions can reveal truths about what it means to be truly human Look Inside Audio Preview Look Inside Hardcover Price: $17.95/£14.99 ISBN: 9780691242699 Published: Jul 30, 2024 Copyright: 2023 Pages: 224 Size: 5.25 x 8 in. Main_subject: Philosophy More Paperback Price: $17.95/£14.99 ISBN: 9780691242699 Published: Jul 30, 2024 Copyright: 2023 Pages: 224 Size: 5.25 x 8 in. Main_subject: Philosophy More ebook Price: $17.95/£14.99 ISBN: 9780691242699 Published: Jul 30, 2024 Copyright: 2023 Pages: 224 Size: 5.25 x 8 in. Main_subject: Philosophy More Audio Price: $17.95/£14.99 ISBN: 9780691242699 Published: Jul 30, 2024 Copyright: 2023 Pages: 224 Size: 5.25 x 8 in. Main_subject: Philosophy More Buy This Request Exam Copy Common Reading Selection Download Cover Share Overview Author(s) Praise Resources <iframe src="https://player.vimeo.com/video/815029856?title=0&byline=0&portrait=0" width="480" height="270" frameborder="0" webkitallowfullscreen mozallowfullscreen allowfullscreen></iframe> Under the light of ancient Western philosophies, our darker moods like grief, anguish, and depression can seem irrational. When viewed through the lens of modern psychology, they can even look like mental disorders. The self-help industry, determined to sell us the promise of a brighter future, can sometimes leave us feeling ashamed that we are not more grateful, happy, or optimistic. Night Vision invites us to consider a different approach to life, one in which we stop feeling bad about feeling bad.In this powerful and disarmingly intimate book, Existentialist philosopher Mariana Alessandri draws on the stories of a diverse group of nineteenth- and twentieth-century philosophers and writers to help us see that our suffering is a sign not that we are broken but that we are tender, perceptive, and intelligent. Thinkers such as Audre Lorde, María Lugones, Miguel de Unamuno, C. S. Lewis, Gloria Anzaldúa, and Søren Kierkegaard sat in their anger, sadness, and anxiety until their eyes adjusted to the dark. Alessandri explains how readers can cultivate “night vision” and discover new sides to their painful moods, such as wit and humor, closeness and warmth, and connection and clarity.Night Vision shows how, when we learn to embrace the dark, we begin to see these moods—and ourselves—as honorable, dignified, and unmistakably human. Awards and Recognition A NPR Book We Love Mariana Alessandri is associate professor of philosophy at the University of Texas Rio Grande Valley, the nation’s first bilingual university. In addition, she and her partner are the founders of RGV PUEDE, a nonprofit whose mission is to promote dual language education in South Texas public schools. They live on the border with their two tesoros. "Mariana Alessandri explores our culture’s obsession with ‘toxic positivity’ and our fear of darker emotions like grief, anxiety and depression. . . . Instead of encouraging our loved ones to 'stay positive,' maybe it’s worth sitting with someone in their darkness."—Kira Condee-Padunova, NPR "Alessandri offers a very different understanding of clinical mood disorders, one that at first seems like bad news but ultimately proves comforting, even uplifting. . . . Alessandri makes her argument through a series of biographical sketches. . . . [she] relates these stories with insight and sensitivity. In doing so she makes a persuasive case against the superficiality of 'don’t worry, be happy' peppiness. . . . Alessandri certainly does us a service in calling attention to the value of dark moods. We do need better night vision."—Andrew Stark, Wall Street Journal "A compelling, philosophically sound case for finding ‘dignity’ and strength in the discomforting emotions that are a natural part of the human condition. . . . Through insightful observations of temperaments at the dark end of the emotional spectrum, Night Vision reminds readers that our humanity is only truly visible in the dark and that the darkness is where we emotionally grow."—Shahina Piyarali, Shelf Awareness "Vigorous, deeply personal, and provocative."—Glenn C. Altschuler, Psychology Today "In Night Vision, Alessandri moves the needle from normalizing mental health issues to revering them. If her points resonate, you may find yourself feeling less shame and blame when ‘stay positive’ just isn’t working."—TheSkimm "This is the book to read this season."—Choice “Night Vision provides a much-needed counterpoint to toxic positivity run amok. This book is for anyone who has ever been told to chill when they’re anxious, to cheer up when they’re depressed, or to count their blessings and stay positive when they’re grieving or ill. It will give you blessed validation that you’re not wrong or bad for having those feelings—just human. The world needs a lot of fixing, and learning to know and accept the reality of negative emotions may help us all understand more about how to fix it.”—Julie K. Norem, author of The Positive Power of Negative Thinking “Night Vision is a stellar and courageous literary achievement. Writing with a nimble authorial voice that smoothly transitions from personal stories to philosophical insights, Alessandri contends that the distressing emotions and moods we try to banish with therapy or pills are more like teachers than demons, delivering self-knowledge, making us more human and more capable of sharing our humanity.”—Gordon Marino, author of The Existentialist’s Survival Guide “Against the tyranny of optimism, Mariana Alessandri boldly validates our darker moods—like anxiety, grief, and anger—and teaches us not to fear them. Mining both philosophy and her own personal experiences as a teacher, she shows how our culture’s disparagement of these emotions weakens our capacity to learn from them and intensifies our unnecessary shame at feeling them. Night Vision is a refreshing embrace of the uncheerful self.”—Joshua Foa Dienstag, author of Pessimism: Philosophy, Ethic, Spirit “In facing the darkness of life and its unsettling truths—with courage, compassion, and something like hope—Alessandri has written a book for our time, and for every time. Night Vision is brilliant and unflinchingly pitch black.”—John Kaag, author of Sick Souls, Healthy Minds: How William James Can Save Your Life “Night Vision is a magnificently written and refreshing analysis of our modern obsession with lightness and positivity. Drawing on Plato, bell hooks, Audre Lorde, María Lugones, and many other philosophical perspectives, Alessandri presents a persuasive case for us to transform our perception of darkness so that we’re more empathetic toward ourselves and understanding of others. It’s scholarly, energizing, and delightful.”—Skye C. Cleary, author of How to Be Authentic: Simone de Beauvoir and the Quest for Fulfillment “Mariana Alessandri’s Night Vision invites us to linger, as she has, with the darknesses that are part of our human condition. It is a bold and uncompromising book, one that takes us beneath the platitudes of ‘Suffering is good for you’ or ‘Get over it’ into something deeper, more troubling, and more powerful. Many of us will recognize among the vulnerabilities she dwells with here at least one that is our own.”—Todd May, author of Death Using Night Vision in a Seminar for First-year Students'''
