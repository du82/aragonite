ment 1427 E. 60th Street Chicago, IL 60637-2902 View additional Journals Division contacts. Chicago Distribution Center Address for orders: Customer Service Chicago Distribution Center 11030 South Langley Avenue Chicago IL 60628 SAN: 2025280 Phone orders: (800) 621-2736 (USA/Canada) (773) 702-7000 (International) Fax orders: (800) 621-8476 (USA/Canada) (773) 702-7212 (International) CDC Staff: See the staff list on the CDC website. Employment opportunities The University of Chicago Press does not post job openings on its website. However you may consult sites for University of Chicago job opportunities and/or jobs at AUP Presses. Our job openings are included in both listings. EU General Product Safety Regulation Books and journals published by the University of Chicago Press comply with the requirements of the General Product Safety Regulation (December 2024). For any queries concerning GPSR, please contact our authorized representative in the EU: Easy Access System Europe - Mustamäe tee 50, 10621 Tallinn, Estonia, gpsr.requests@easproject.com Directions to the Press The University of Chicago Press (Books & Journals Divisions) is located 7.5 miles from downtown Chicago (the Loop), and may be reached easily by the expressway system and by public transportation. Be the first to know Get the latest updates on new releases, special offers, and media highlights when you subscribe to our email lists! Sign up here for updates about the Press"
