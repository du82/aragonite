title = "University of Chicago Press Endowed Publication Programs"
description = "The funds from Endowed Publication Programs assist the publication of books from the University of Chicago Press. Boos from first-time authors and highly-illustrated books are among the types of books assisted by these funds."
full_description = "Endowed Publication Programs The Bevington Fund The Bevington Fund helps publish work by emerging scholars and is used in support of first books, particularly in the humanities. The fund was established in 2006 with a $100,000 gift by David and Peggy Bevington, which has been augmented by students, friends, and a foundation. Black Knights Arabic Epic and the Making of Medieval Race Rachel Schine Promise to Pay The Politics and Power of Money in Early America Katie A. Moore Intimate Subjects Touch and Tangibility in Britain’s Cerebral Age Simeon Koole In Levittown’s Shadow Poverty in America’s Wealthiest Postwar Suburb Tim Keogh Textual Magic Charms and Written Amulets in Medieval England Katherine Storm Hindley The Scattered Court Hindustani Music in Colonial Bengal Richard David Williams Oceans under Glass Tank Craft and the Sciences of the Sea Samantha Muka A Great and Rising Nation Naval Exploration and Global Empire in the Early US Republic Michael A. Verney The Meijer Foundation Fund Endowed in 2018 by a generous gift from the Meijer Foundation of Grand Rapids, Michigan, this fund supports the publication of books of enduring interest in the disciplines of American political history, political science, and related areas. In recognition of the Meijer family’s connection to the greater Midwest, special consideration is given to books and authors that are grounded in the history and culture of the Great Lakes region. Coming Out Republican A History of the Gay Right Neil J. Young Plowshares into Swords Weaponized Knowledge, Liberal Order, and the League of Nations David Ekbladh Living in the Future Utopianism and the Long Civil Rights Movement Victoria W. Wolcott A Righteous Smokescreen Postwar America and the Politics of Cultural Globalization Sam Lebovic The Rise of Common-Sense Conservatism The American Right and the Reinvention of the Scottish Enlightenment Antti Lepistö Pulp Empire The Secret History of Comic Book Imperialism Paul S. Hirsch The Neil Harris Endowment Fund The Neil Harris Endowment Fund was established in 2008 to support the publication of heavily illustrated, historically significant books. The Fund honors the innovative scholarship of Neil Harris, the Preston and Sterling Morton Professor Emeritus of History and Art History at the University of Chicago, and it is supported by contributions from the students, colleagues, and friends of Neil Harris. To honor the legacy of the scholarship of Professor Harris, the Neil Harris Endowment Fund supports the publication of illustrated interdisciplinary books by the University of Chicago Press, primarily in history, but also occasionally in related disciplines, such as art history and architecture. The Chieftain and the Chair The Rise of Danish Design in Postwar America Maggie Taft Country and Midwestern Chicago in the History of Country Music and the Folk Revival Mark Guarino Atmospheres of Projection Environmentality in Art and Screen Media Giuliana Bruno Conflict Graffiti From Revolution to Gentrification John Lennon The Contested Crown Repatriation Politics between Europe and Mexico Khadija von Zinnenburg Carroll Value in Art Manet and the Slave Trade Henry M. Sayre Encounters in the New World Jesuit Cartography of the Americas Mirela Altic Non-Design Architecture, Liberalism, and the Market Anthony Fontenot The Philip Gossett Publication Fund This fund supports books on music that embody the high scholarly standards of its namesake, the renowned opera historian, teacher, and editor Philip Gossett (1941-2017). Gossett was the Robert W. Reneker Distinguished Service Professor Emeritus of Music and former Dean of the Division of Humanities at the University of Chicago. Publications supported by the fund range from musicological studies to critical editions published by the Press, including The Works of Giuseppe Verdi. The fund was established in 2018 with the support of family, friends, and former colleagues and students of Philip Gossett. The Franke Family Charitable Foundation has provided a generous inaugural gift. The Susan Elizabeth Abrams Fund in History of Science The Susan Elizabeth Abrams Fund in History of Science supports the publication of books in the history of science that reflect the standards of Susan Abrams, science editor at the Press from 1979 to 2003. The Arrival of the Fittest Biology’s Imaginary Futures, 1900–1935 Jim Endersby Eating and Being A History of Ideas about Our Food and Ourselves Steven Shapin Disputed Inheritance The Battle over Mendel and the Future of Biology Gregory Radick Reading the Book of Nature How Eight Best Sellers Reconnected Christianity and the Sciences on the Eve of the Victorian Age Jonathan R. Topham Knowing Manchuria Environments, the Senses, and Natural Knowledge on an Asian Borderland Ruth Rogaski The Quest for Sexual Health How an Elusive Ideal Has Transformed Science, Politics, and Everyday Life Steven Epstein The Maternal Imprint The Contested Science of Maternal-Fetal Effects Sarah S. Richardson Darwin and the Making of Sexual Selection Evelleen Richards Be the first to know Get the latest updates on new releases, special offers, and media highlights when you subscribe to our email lists! Sign up here for updates about the Press"
