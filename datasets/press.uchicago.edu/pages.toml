description = "The Books Division of the University of Chicago Press has been publishing books for scholars, students, and general readers since 1892. The Books Division has published more than eleven thousand books since the Press was founded. It has more than five thousand books in print at the present time, including such well-known works as The Chicago Manual of Style; The Structure of Scientific Revolutions, by Thomas Kuhn; A River Runs Through It, by Norman Maclean; and The Road to Serfdom, by F. A. Hayek."
