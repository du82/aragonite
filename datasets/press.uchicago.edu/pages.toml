full_description = "Journals Division Explore themes from our archive. The monthly From the Archives page highlights previously published articles spanning across disciplines and publications. Articles pulled from our archive open up new perspectives on a variety of salient topics. Learn more about Explore themes from our archive. Subscriptions and Access Complete Chicago Package Subscribe to the Complete Chicago Package (CCP) to save up to 55% on the comprehensive collection of more than 90 journals published by the University of Chicago Press. Learn more about Complete Chicago Package Chicago Emerging Nations Initiative We offer free electronic access and deeply discounted print subscriptions to our entire list of journals for qualified higher education and research institutions in developing countries. Learn more about Chicago Emerging Nations Initiative Institutional Subscriptions Institutional subscriptions are tiered to serve the unique research and educational needs of your organization. Most subscriptions are available as electronic-only, print-only, and electronic + print. Learn more about Institutional Subscriptions Individual Subscriptions Information about individual subscriptions and memberships for society journals is available on journal homepages. All individual subscriptions provide access to the full archive of a title–back to volume 1, issue 1. Learn more about Individual Subscriptions JOURNALS BY SUBJECT All journals New journals Art and art history Economics Education History History and philosophy of science Humanities Law and politics Literary studies Medieval and Renaissance studies Philosophy Science Social sciences PUBLISH YOUR JOURNAL WITH US In addition to working with the departments and faculty of the University of Chicago, the Press publishes and distributes influential scholarly publications on behalf of learned and professional societies and associations, foundations, museums, and other not-for-profit organizations. We offer a full range of publishing and membership services. Our partners can choose the services that best fit their needs. For more information, contact: Kari Roane, Director, Journals Acquisitions and Publisher Phone: 773-702-7362 Email: kroane@uchicago.edu Learn more about PUBLISH YOUR JOURNAL WITH US Contact Subscriptions: subscriptions@press.uchicago.edu Access control and support: journalsupport@press.uchicago.edu 877-705-1878 (U.S. and Canada) +1 773-753-3347 (International) University of Chicago Press Journals Division 1427 E. 60th Street Chicago, IL 60637-2902 Contact information Media inquiries Email j-marketing@press.uchicago.edu to join our press release distribution list, contact an author, request access to an article, or submit other publicity queries. Press Releases Visit our press release feed to learn about recent research published in University of Chicago Press journals. Learn more about Press Releases Advertising Journals published by the University of Chicago Press offer custom advertising that reaches scholars, professionals, and influencers in art and art history, economics, education, history, humanities, law and politics, medieval and Renaissance studies, science, and social science. Learn more about journal advertising opportunities More from Chicago journals Transforming Anthropology NEW TO CHICAGO IN 2024 Transforming Anthropology, the flagship journal of the Association of Black Anthropologists, seeks to advance scholarship across the four fields of anthropology and beyond. Read more about Transforming Anthropology The Sixteenth Century Journal NEW TO CHICAGO IN 2024 The Sixteenth Century Journal publishes research and inquiry related to the sixteenth century broadly defined (1450-1650) in all fields and all world regions. Read more about The Sixteenth Century Journal A CENTURY OF SCIENCE IJPS celebrates 100 years The first issue of the International Journal of Plant Sciences (IJPS; then named the Botanical Bulletin) was published in November 1875. To mark the journal’s 150th birthday, we have solicited short appreciations of our editors’, authors’, and readers’ favorite IJPS papers for a new section entitled From the Archives. Learn more JOURNAL NEWS Learn how to submit a manuscript to Chicago science journals Find out more FROM THE JOURNALS DIVISION Virtual Exhibits Visit our virtual exhibits hub to view all upcoming virtual exhibits, along with journal news, subscription discounts, recent and free articles, and calls for papers. View recent and upcoming exhibits"
