e leading role in creating an unimaginably beautiful world that works for everyone. Foundations Community Partnership Zlock Performing Arts Center 275 Swamp Rd, Newtown, PA 18940 Mar 19, 2025 09:00 PM At Skylight: CD Eskilson presents SCREAM/QUEEN w/ Edwin Bodney, Sara Ellen Fowler, & Dare Williams A debut poetry collection drawing on horror-movie tropes to examine the body—both its traumas and its possibilities. Skylight Books 1818 N Vermont Ave Los Angeles, CA 90027 Mar 19, 2025 03:30 PM Book Event - Novel Ecologies: Nature Remade and the Illusions of Tech Join us to hear Professor Allison Carruth speak about her new book, Novel Ecologies, in conversation with Vinson Cunningham. Princeton’s Effron Center for the Study of America Chancellor Green Hall Princeton, NJ 08542 Mar 21, 2025 06:00 PM Book Presentation: Slashing Sounds On World Poetry Day, the Italian Cultural Institute of Chicago and University of Chicago Press will host a book presentation of Slashing Sounds by Jolanda Insana, translated by Catherine Theis. With this bilingual edition of Slashing Sounds, Catherine Theis presents the first book-length collection of Insana’s poetry in English, a powerful offering that addresses a lack of female Italian voices in Anglophone poetry publishing. Register here Italian Cultural Institute of Chicago 500 N. Michigan Avenue, Suite 1450 Chicago, Illinois 60611 Mar 25, 2025 03:30 PM Book Event - The United States Governed by Six Hundred Thousand Despots: A True Story of Slavery Jonathan Schroeder speaks about the John Jacobs Autobiography “The True Story of Slavery: The United States Governed by Six Thousand Despots.” Moeser Auditorium CB# 3320; 105 Hill Hall 145 E Cameron Ave, Chapel Hill, NC Apr 3, 2025 05:00 PM Author Event - Jeffrey Moser We invite you to join the Department of Art History at the University of Chicago for this upcoming lecture as part of the 2024-25 Smart Lecture series. The lecture is Thursday, April 3 in CWAC 157 at 5:00pm CT with a Q&A session 