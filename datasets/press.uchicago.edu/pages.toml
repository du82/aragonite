["https://press.uchicago.edu/press/Press_D-I_Pillars.html"]
title = "The Pillars of Diversity & Inclusion at the University of Chicago Press"
description = "The Pillars of Diversity & Inclusion at the University of Chicago Press"
full_description = "The Pillars of Diversity & Inclusion at the University of Chicago Press To fulfill our mission to publish and disseminate meaningful scholarship, we at the Press believe in building a more diverse and inclusive publishing process from start to finish. In keeping with the intellectual values of the University of Chicago, the Press thinks broadly and critically about all aspects of our work. The Four Pillars identified here provide a living framework to develop our priorities and plans. To further our goals, our approach calls for ongoing dedication, investment, and evaluation from all Press staff. We invite you to engage with the Pillars below to learn more about the Press’s initiatives and encourage you to send questions and feedback to PressDI@uchicago.edu. Recruiting and Employee Development The Press will devote attention and resources to recruiting, hiring, and retaining colleagues from underrepresented and historically marginalized groups. Workplace Culture The Press will nurture a workplace culture where diverse perspectives, experiences, individuals, and ideas thrive. Publications and Partnerships The Press will be conscious of the values of diversity and inclusion in its publishing choices and partnerships. Community Engagement The Press will advance our mission outside our walls and into our larger community—stretching from our UChicago colleagues to our South and West Side neighbors to our global partners in publishing. The first two Pillars of our D&I initiatives provide a way for us to share resources, grow the Press community, and hold ourselves accountable to these goals. But this is not enough, for as a university press, our mission is to publish ideas that make a positive difference in the world: the second two Pillars reflect this. The Press’s efforts to create an inclusive environment and publishing program are ongoing and open to participation from all staff, such as in working groups or as leaders of initiatives. We will use this space to share highlights of our activities across these Four Pillars and to invite a free and open exchange of ideas. Be the first to know Get the latest updates on new releases, special offers, and media highlights when you subscribe to our email lists! Sign up here for updates about the Press"
