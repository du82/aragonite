examples from a variety of fields that will appeal to today’s students and other readers. It also accounts for new technologies used in research and offers basic guidelines for the appropriate use of generative AI. And it ends with an expanded chapter on ethics that addresses researchers’ broader obligations to their research communities and audiences as well as systemic questions about ethical research practices. This new edition will be welcomed by a new and more diverse generation of researchers. Read Moreabout The Craft of Research, Fifth Edition Read Lessabout The Craft of Research, Fifth Edition 368 pages | 19 halftones, 6 line drawings, 7 tables | 5 1/2 x 8 1/2 | © 2024 Chicago Guides to Writing, Editing, and Publishing Reference and Bibliography Rhetoric and Communication Reviews Table of contents Excerpt Gallery Awards Author Events Related Titles Reviews Reviews "While the underlying principles of research have changed little, its related sources, processes, and applications have changed significantly since the 1995 publication of this book’s classic first edition. Even since the fourth edition (2016), a greater variety of tools—such as generative artificial intelligence—and methodologies have emerged. Changes in this book’s edition reflect the authors’ responses to these advances and changing attitudes; for example, the purposes, genres, and formats of research products have expanded. The growing recognition of collective intelligence and the need for sound argumentation are also addressed in this edition. What has not changed is the authors’ overall approach to research: as a conceptual framework with generic practical advice." Booklist Back to top Table of Contents Table of Contents Preface: The Aims of This Edition Introduction: Your Research and Your Audience I.1. What Is Research? I.2. Connecting with Your Audience I.3. Understanding Your Role I.4. Imagining the Role of Your Audience I.5. How to Use This Book Quick Tip: A Checklist for Understanding 