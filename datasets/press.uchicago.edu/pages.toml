e Graphs 13.5. Representing Data Ethically Quick Tip: Look for Opportunities to Include Visual Evidence14. Introductions and Conclusions 14.1. The Common Structure of Introductions 14.2. Step 1: Stating a Context 14.3. Step 2: Stating Your Problem 14.4. Step 3: Stating Your Response 14.5. Setting the Right Pace 14.6. Finding Your First Few Words 14.7. Writing Your Conclusion Quick Tip: Use Key Terms in Titles15. Revising Style: Telling Your Story Clearly 15.1. Judging Style 15.2. The First Two Principles of Clear Writing 15.3. A Third Principle: Old before New 15.4. Choosing between the Active and Passive Voice 15.5. A Final Principle: Complexity Last 15.6. Editorial Polish Quick Tip: The Quickest Revision Strategy16. Research Presentations 16.1. Presenting to Auditors 16.2. Giving a Preliminary Presentation 16.3. Giving a Final Presentation Quick Tip: Treat Your Presentation as a Performance Part V. Some Last Considerations17. The Ethics of Research 17.1. Ethical Obligation to Yourself 17.2. Ethical Obligation to Your Audience and Fellow Researchers 17.3. Research and Social Responsibility 17.4. A Final Thought18. Advice for Teachers 18.1. The Risks of Imposing Formal Rules 18.2. On Assignment Scenarios: Creating a Ground for Curiosity 18.3. Recognizing and Tolerating the Inevitable Messiness of Learning Our Debts Appendix: A Brief Guide to Bibliographic and Other Resources Index Read Moreabout table of contents Read Lessabout table of contents Gallery Back to top Gallery See More Gallery Images See Less Gallery Images Related Titles Back to top Related Titles Beyond the Laboratory Peter J. Kuznick Shaping Science Janet Vertesi Limits of the Numerical Christopher Newfield Getting In Paris H. Grey $(function() { $.get( contextPath + "/book/formats", { isbn:"9780226833880" }, function( data ) { var size = Object.keys( data ).length; var salesRestrictionJson = {}; var pubDateJson = {}; var isbnHasChapterSale; pubDateJson[9780226826677] = "June 2024"; pubDateJson[97802