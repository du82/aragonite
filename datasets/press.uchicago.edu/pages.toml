["https://press.uchicago.edu/resource/accessibility.html"]
title = "Accessibility information from the University of Chicago Press"
description = "The University of Chicago Press assists Accessibility Offices at institutions of higher learning in providing access to our books for students with  disabilities."
full_description = "Accessibility Information Electronic file requests for students with print disabilities The University of Chicago Press will assist Accessibility Offices at institutions of higher learning with providing access to our books to students who have disabilities that prevent them from using these books in printed form. We can provide alternative access in cases where we have electronic files for these books available at BiblioVault. The files that you require may be available from other sources. Please check with the following resources before submitting any request to BiblioVault: American Printing House for the Blind Learning Ally Library of Congress National Library Service for the Blind and Physically Handicapped Please go to BiblioVault to determine which books have electronic files. If BiblioVault has an electronic file for the book, the option to “Request Accessible File” will appear on the book product page. If that option does not appear, BiblioVault cannot supply the file. BiblioVault will fulfill the request as quickly as it can, but we cannot guarantee that we can send the files in less than two weeks. BiblioVault can e-mail files to the accessibility office or send them on a CD-ROM. Transmittal via e-mail is free; there is a $10.00 charge for transmittal via CD-ROM. If an accessibility office cannot locate a source of an electronic file for one of our books that a student with a reading disability must read for a course, it has the permission of the University of Chicago Press to create such a file and to provide it to the student once it has provided the Press with this permission form (PDF format) completed with the information about the course and signed by the office administrator. Be the first to know Get the latest updates on new releases, special offers, and media highlights when you subscribe to our email lists! Sign up here for updates about the Press"
year_published = 2025
