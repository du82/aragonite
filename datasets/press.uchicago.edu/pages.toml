full_description = "Publicity and Media Contacting the University of Chicago Press Publicity Department The University of Chicago Press Publicity Department 1427 East 60th Street Chicago, Illinois 60637 USA Voice: (773) 702-7740 Fax: (773) 702-9756 E-mail: press_publicity@uchicago.edu Requesting a Review Copy To request a review copy, you may contact us by e-mail at press_publicity@uchicago.edu, by phone at (773) 702-7740, or fax at (773) 702-9756. Please be sure to include the title and author of the book, the title of your publication, your name, and full mailing address. Social Media Influencer Program If you're a social media influencer interested in receiving review copies or more information about our books, please sign up here. Catalogs Our recent seasonal catalogs are available in PDF format. Be the first to know Get the latest updates on new releases, special offers, and media highlights when you subscribe to our email lists! Sign up here for updates about the Press"
