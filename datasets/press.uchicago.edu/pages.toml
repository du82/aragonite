["https://press.uchicago.edu/books/publishers.html"]
title = "Publishers Distributed by the University of Chicago Press"
description = "A listing of the major publishers sold, marketed, and distributed by the University of Chicago Press."
full_description = "Publishers Distributed by the University of Chicago Press The publications of dozens of other publishers are included on the University of Chicago Press website, carried within our catalogs, and marketed and sold to the book trade and the public. A selection of our larger distributed publishers are listed below. Please note that the University of Chicago Press may not have sales rights for these publishers throughout the world. To visit a publisher’s home website, click on its name. Publicity news about our distributed publishers is posted to our distributed presses Twitter feed @ChicagoDistrib. ACMRS Press ACMRS Press is the publications division of the Arizona Center for Medieval and Renaissance Studies at Arizona State University in Tempe, Arizona. Our mission is to publish, disseminate, and promote the most forward-looking, vanguard research in medieval and renaissance studies. We publish books that are historically grounded and theoretically expansive, with the aim of fostering dialogues that reach into the present moment and point us to different, more inclusive, futures. Our books analyze pre-modern history, literature, and/or culture through the lenses of ecocriticism, disability studies, critical race studies, women’s studies, postcolonial studies, new media studies, quantitative studies, performance studies, and more. Furthermore, we value projects that explore these complex topics in a manner that is accessible so as to reach as wide an audience as possible, including but not limited to classroom use. We are committed to offering our titles at competitive prices with the belief that leading edge scholarship should be affordable. Browse Books American Meteorological Society The American Meteorological Society publishes books focusing on the study of weather. Browse Books Asia Ink Asia Ink is a print and digital publisher of award-winning illustrated books created by Sherry Buchanan in 2002 to bring authoritative editorial and distinctive design to print and digital illustrated books. In addition to its own titles, Asia Ink offers tailor-made printed and digital solutions to co-publishers, museums, galleries and collectors, drawing on an expert team of designers, editors and print and digital production managers. Browse Books Association of University Presses The Association of University Presses is one of the world’s largest organizations of nonprofit scholarly publishers. AUP is dedicated to the support of creative and effective scholarly communications. AUP produces an annual membership directory distributed by the University of Chicago Press. Browse Books Bard Graduate Center Bard Graduate Center publishes award-winning exhibition catalogues, books, and journals focusing on scholarship in the decorative arts, design history, and material culture. Browse Books Bodleian Library Publishing The Bodleian Library at the University of Oxford publishes books related to their collection, in some cases facsimile editons of rare or noteworthy titles. Browse Books Brandeis University Press Founded 50 years ago in 1971, Brandeis University Press was part of the University Press of New England consortium. In January 2019, the consortium disbanded and Brandeis University Press became a stand-alone entity, working with the University of Chicago Press for sales, marketing and distribution. In January 2021, Brandeis University Press acquired the UPNE backlist. The Press has a vibrant backlist of over 700 titles, and its remit is to build this list expanding into a wide variety of subject areas to represent the interests of the university, and to explore the wider world in which it is situated. Our publishing program engages diverse subjects and perspectives in the humanities, social sciences, natural history and the environment. The Press is also committed to publishing compelling and innovative approaches to the study of the Jewish experience worldwide. Browse Books Brandeis University Press also distributes books published by: Historical Society of Israel Browse Books Brigham Young University UCP distributes Brigham Young University’s Middle Eastern Texts Initiative books worldwide. Browse Books Campus Verlag Founded in 1975 Campus Verlag is one of the most successful, independent German publishers of business books, general non-fiction and academic titles. Campus also publishes books in English in the social sciences, history and management. Browse Books Carnegie Mellon University Press Carnegie Mellon University Press, now in its forty-fourth year of publishing, was founded by Gerald Costanzo in 1972 as Three Rivers Press. The Press publishes regional social history (titles that explore the rich history of Pittsburgh and Western Pennsylvania), art history, the performing arts (original plays and adaptations), literary analysis, education, and university history. Browse Books CavanKerry Press Our mission at CavanKerry Press is in our commitment to expanding the reach of poetry to a general readership by publishing works that explore the emotional and psychological landscapes of everyday life. Browse Books Center for the Study of Language and Information The Center for the Study of Language and Information, an independent research center in Stanford, CA, publishes books in information science, computing, linguistics, cognition, and philosophy. Browse Books Conservation International Conservation International, based in Washington, DC, publishes books related to its mission to preserve global biodiversity, including field guides, reports, and heavily-illustrated books. Browse Books Dalton Watson Fine Books For over forty years, Dalton Watson Fine Books has produced collectible and lushly illustrated large-format titles focusing on subjects like automotive history and sports car racing, as well as iconic cultural figures including Steve McQueen and The Beatles. Browse Books DIAPHANES DIAPHANES was founded in 2001 and has since gained a high reputation for independent publishing in the field of contemporary philosophy, academic studies, arts and literature. Based in Zurich and Berlin, DIAPHANES publishes in German, English and French language. Browse Books Eburon Academic Publishers Eburon Academic Publishers in Delft, Netherlands, publishes scholarly books in the humanities and social sciences. Browse Books EPFL Press EFPL Press is an imprint of the Presses Polytechniques et Universitaires Romandes Foundation, a non-profit foundation based in Lausanne, Switzerland. We are involved in the fields of architecture, urbanism, natural sciences, engineering and management. We publish books from the EPFL, as well as from Swiss and foreign universities. Browse Books Field Museum of Natural History The Field Museum, based in Chicago, IL, publishes books related to its mission to explore, explain, and sustain the Earth and its peoples, including Rapid Inventory reports and lavishly-illustrated books about the Museum’s collections. Browse Books Gingko Gingko aims to inform and educate the interested public and work with scholars of diverse backgrounds and research interests to increase crucial understanding of the Middle East, West Asia and North Africa through conferences, publications, public events and cultural programmes. Our mission is to foster constructive, informed and open discussion based on mutual respect that gives a voice to a new generation of thinkers and opinion formers, and thereby help bridge an increasingly virulent divide between the West and the Middle East. Browse Books The Grolier Club Founded in 1884, the Grolier Club is America’s oldest and largest society for bibliophiles and enthusiasts in the graphic arts. Since its beginnings, the Grolier Club has published or sponsored almost 500 books and exhibition catalogues – some of them now the standard references in their fields – on such subjects as photography, William Blake, Mayan writing, Albrecht Dürer's alphabet book, and the well-known Grolier Hundred series on topics in literature, book history, science, and medicine. Many of the publications have been designed and printed by the leading book artists and typographers of the past and present, including Theodore Low De Vinne, D. B. Updike, Bruce Rogers, Stanley Morison, Joseph Blumenthal, the Mardersteigs, and Jerry Kelly. All reflect the Grolier Club’s objective to promote “the study, collecting, and appreciation of books and works on paper.” Browse Books HAU HAU Books is committed to publishing the most distinguished texts in classic and advanced anthropological theory. The titles aim to situate ethnography as the prime heuristic of anthropology and return it to the forefront of conceptual developments in the discipline. HAU Books is sponsored by some of the world’s most distinguished anthropology departments and research institutions and releases its titles in both print editions and open-access formats. Browse Books Haus Publishing Founded in 2003, Haus Publishing are London-based independent publishers of history, biography, literary fiction, political nonfiction and essays. Series include: Literary Travellers, Armchair Traveller’s Histories, Haus Curiosities, and Arabia Books. Browse Books Hirmer Publishers Hirmer Publishers is a German publisher based in Munich. Hirmer publishes some of its books in English editions or in bilingual German-English editions on art, architecture, photography, and antiques. Browse Books Hong Kong University Press Established in 1956, and part of the University of Hong Kong, Asia’s most prominent English-speaking university, we publish most of our books in English. Building on our unique position in Asia, works published by the Press examine, critique, and celebrate Asia’s place in the world. While academics from every area of Asian Studies are represented on our list, we have gained particular renown for publications in cultural studies, film and media studies, and Chinese history and culture. Browse Books Hong Kong University Press also distributes books published by: HKU Museum and Art Gallery Browse Books Intellect Ltd Intellect Ltd is a UK-based company committed to serving the academic community by publishing authors and editors with original thinking. Browse Books Intellect Ltd also distributes books published by: HammerOn Press Browse Books Iter Press Iter Press advances medieval and early modern scholarship through the publication of books, journals, and finding tools in print and online. The Press is well known for its comprehensive and massive Iter Bibliography (1.5 million records) and its contributions to the fields of women and gender studies, digital humanities, and English textual studies. Through its partnerships with the University of Toronto Libraries, the University of Chicago Press, and the Electronic Textual Cultures Lab (Victoria), Iter Press encourages online dissemination of research, notably realized in its collaborations with the Centre for Reformation and Renaissance Studies (Toronto), the Arizona Center for Medieval and Renaissance Studies (Tempe), and Brill (Leiden). UCP distributes Iter Press books worldwide. Browse Books Karolinum Press, Charles University The Karolinum Press is part of Charles University, Prague, one of Europe’s oldest universities. The Karolinum Press is the largest publisher of scientific and educational books in the Czech Republic. Browse Books Koç University Press Founded in 2010 Koç University Press, embraces the desire to become a pioneer suited for the university’s aim of being “the center of perfection”. KUP books are selected from the titles that are able to offer the most sophisticated knowledge of their own fields. The featured studies are on history, art history, politics, sociology, archaeology, gender studies, and cultural studies; positive sciences, social sciences, literary theory, art, law, medicine, and ethics; finance, economics, business, innovation, and entrepreneurship. With the growing number of titles every year, KUP tries to close the gaps of the academic publishing and those in our intellectual world in a most influential way. Browse Books McMullen Museum of Art, Boston College The McMullen Museum of Art at Boston College publishes scholarly, interdisciplinary volumes in conjunction with its exhibitions. Browse Books Mildred Lane Kemper Art Museum The Mildred Lane Kemper Art Museum at Washington University in St. Louis publishes engaging catalogs with a focus on modern and contemporary art that push the forefront of critical inquiry by promoting innovative ideas, historically grounded interpretations, and original research from a variety of theoretical perspectives. Browse Books Missouri Botanical Garden Press Missouri Botanical Garden Press plays a key role in the Garden's mission to discover and share knowledge about plants and their environment. Through its publications, MBG Press provides an important outlet for the dissemination of botanical research. Books are primarily focused on taxonomy, biodiversity, conservation, and related topics in plant science. Browse Books Missouri Historical Society Press Through their publications, the Missouri Historical Society (MHS) exposes readers to perspectives of St. Louis and Missouri not usually introduced in simple history lessons. MHS publications offer readers of all backgrounds the chance to explore the historical and contemporary cultural, social, and political issues of the region—and discover the shared heritage of those who call it home. Browse Books Missouri Historical Society Press also distributes books published by: Edition Falkenberg Browse Books Museum of Modern Art in Warsaw The Museum’s mission is to collect, make available, and promote important works of 20th- and 21st-century art, highlighting arts links to important historical events, social phenomena, and scientific development. Browse Books Museum Tusculanum Press Museum Tusculanum Press is an independent, full range, international scholarly publisher publishing monographs, anthologies, journals, e-books, e-journals within the humanities, social sciences, and theology. Browse Books Neubauer Collegium The Neubauer Collegium for Culture and Society explores new possibilities for humanistic research by fostering an environment in which new forms of thinking emerge and thrive. Browse Books Newberry Library The Newberry is a world-renowned independent research library and community of learning in Chicago, serving the public since 1887. Browse Books New Issues Poetry & Prose New Issues Poetry & Prose was established in 1996 by poet Herbert S. Scott. New Issues publishes four to six new poetry titles each year, as well as the winner of the AWP Award Series in the Novel. New Issues Press offices are housed in the Ernest Wilbur Building on the Oakland Campus of Western Michigan University. Browse Books Nus Press Pte Ltd NUS Press is the scholarly publishing division of the National University of Singapore. Established in 1971, the Press is heir to a tradition of academic publishing in S"
