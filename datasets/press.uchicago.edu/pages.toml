["https://press.uchicago.edu/resource/author_name_changes.html"]
title = "The University of Chicago Press and Author Name Changes"
description = "The University of Chicago Press and Author Name Changes"
full_description = "University of Chicago Press and Author Name Changes The University of Chicago Press supports an author’s right to change their name in previously published work. We are committed to implementing the updates promptly and respecting the author’s privacy in all cases. Authors seeking to change a name in an already published work should contact the Press for detailed information or to initiate the process. To change a name in a journal, contact the editorial office or email journalnamechange@uchicago.edu with your request and the DOIs of the manuscript(s) in question. To change a name in a book, email: booknamechange@uchicago.edu with your request, as well as the title of the book(s) in question. Be the first to know Get the latest updates on new releases, special offers, and media highlights when you subscribe to our email lists! Sign up here for updates about the Press"
