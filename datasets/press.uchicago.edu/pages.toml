title = "Desk copy, text exam copy, and information for instructors and professors"
description = "Information about requesting desk and examination copies from the University of Chicago Press, plus our Books for Courses Catalog. Find books and textbooks for your classroom. Get a desk copy. Get an exam copy."
full_description = "Instructors Looking for Course Books Students can buy ebooks for courses direct from our site at a deep discount Our Chicago Discount Digital Coursebooks program offers a 30% discount to students who buy assigned coursebooks directly from Chicago in ebook format, with the possibility of deeper discounts for bulk purchases of ebooks made by instructors or institutions on behalf of their students. For more information, click here. Instructor Copies The University of Chicago Press will send you an instructor copy of the book you wish to consider or use in your course. We encourage requests for ebooks. Using our online form, qualified instructors can be examining the book in minutes (if requested during our office hours, otherwise overnight). Print instructor copies are also available. To submit your request, follow the link to request an instructor copy below the cover image on the left side of the book's page. Easiest Place to Start: Our Books for Courses Catalog Our catalog of books for courses includes our new and most-adopted books for the classroom. Be the first to know Get the latest updates on new releases, special offers, and media highlights when you subscribe to our email lists! Sign up here for updates about the Press"
