["https://press.uchicago.edu/resource/rights.html"]
title = "Rights, Permissions, and Translations contact information for the University of Chicago Press"
description = "A guide to requesting permission to use materials published by the University of Chicago Press and for the licensing of subsidiary and translation rights to our publications."
full_description = "Licensing from a Book or Journal The University of Chicago Press is pleased to work with authors and others who wish to use our books in their publications and courses, and for other purposes. We want to make the process of requesting permission to use our books as straightforward as possible. Before requesting permission, please refer to our Fair Use Guidelines and Image and Figure Permissions [see below]. Permissions for Republication Use this PDF form to request permission to republish our material. Permission for Course Use Contact the Copyright Clearance Center at: http://www.copyright.com 222 Rosewood Drive Danvers, MA 01923 USA Voice: (978) 750-8400 Fax: (978) 646-8600 E-mail: info@copyright.com Book Translations Selections of book Entire book Other Subsidiary Rights Contact the Contracts Department. Image and Figure Permissions The University of Chicago Press can only authorize material for which it holds the copyright. Check the credit of the image or figure you wish to reproduce. Credit may be found within the text or in a caption on the page, in the credit section of the book, or on the copyright page. If the material is copyrighted by a person or other organization, you will need to direct your permission request to the cited source. Contact the US Copyright Office for additional information. Contacts For additional information, please contact: Department of Contracts & Subsidiary Rights The University of Chicago Press 1427 East 60th Street Chicago, IL 60637 Voice: (773) 702-7636 Fax: (773) 702-9756 Contracts Manager Voice: (773) 702-6096 Fax: (773) 702-9756 E-mail: permissions@press.uchicago.edu Lucina Schell International Rights Manager Voice: (773) 702-7741 Fax: (773) 702-2705 E-mail: intlrights@uchicago.edu Be the first to know Get the latest updates on new releases, special offers, and media highlights when you subscribe to our email lists! Sign up here for updates about the Press"
