["https://press.uchicago.edu/books/orders.html"]
title = "How to order University of Chicago Press books"
description = "Information on ordering University of Chicago Press books from our Chicago Distribution Center. For booksellers, wholesalers, libraries, institutions, and individuals."
full_description = "Book Orders Chicago Distribution Center Policies Except as noted, the following information applies for all CDC customers and all of CDC's client publishers. CDC will ship an order of any size, whether it contains books from one or multiple client publishers. For the convenience of customers, CDC can combine titles from multiple client publishers on one order. However, titles from different publishers do not combine for quantity discount. (See information on discount schedules.) Upon request, CDC will combine backorder titles on one invoice/shipment. How to Order Address for orders: Customer Service Chicago Distribution Center 11030 South Langley Avenue Chicago IL 60628 SAN: 2025280 Phone orders: (800) 621-2736 (USA and Canada) (773) 702-7000 (International) Fax orders: (800) 621-8476 (USA and Canada) (773) 702-7212 (International) E-mail orders: orders@press.uchicago.edu Special sales, corporate sales: Titles published by the University of Chicago Press are available for corporate, premium, and special sales. Please direct inquiries to the UCP Sales Department at marketing@press.uchicago.edu. Business hours: Monday through Friday, 7:30 am to 4:30 pm US Central Time (GMT -6) Customers may transmit their requests and purchase orders to the above addresses. To facilitate the CDC filling your orders, please provide the following about your account and the books you are ordering. Customer account number Purchase order number Customer phone and fax numbers Customer SAN For each book being ordered: ISBN, title, author, and quantity desired Any special shipping instructions Shipping CDC shipments are FOB Chicago, IL. CDC's preferred domestic carriers are FedEx and UPS. All domestic shipments weighing less than 15 pounds will be sent by priority mail unless otherwise requested. Canadian shipments are consolidated twice weekly. Once they are inside Canada, packages are shipped to the customer via FedEx Ground. Overseas shipments go surface or international airmail, as designated by the customer. Other shipping arrangements are available upon request. Any claims for shipping discrepancies, shortages, or damages must be made within thirty (30) days of invoice date. Credit Terms Orders placed before credit has been established must be paid in advance. For all accounts with established credit, payment is due within thirty (30) days of invoice date. To establish credit, (1) obtain the CDC credit application by clicking here: CDC Credit application, (2) complete the application, and (3) send it to: Chicago Distribution Center ATTN: Accounts Receivable 11030 South Langley Chicago, IL 60628 USA If you have questions about this process, e-mail Cynthia Bastion: cab9@uchicago.edu CDC Payments CDC accepts VISA, MasterCard, American Express, and Discover. All checks must be in US funds drawn on a US bank. Electronic fund and wire transfers should be directed to: The Northern Trust 50 South LaSalle Street Chicago IL 60603 Account name: University of Chicago Press Bank 3 Account number: 2725681 Routing number: 071000152 Swift Code: CNORUS44 Discount Schedules Each CDC client publisher determines its own discount schedule. For information on its discount policy and schedule, contact the marketing manager at the individual publisher. To request a list of these individuals and their contact information, click here: custserv@press.uchicago.edu Returns Policy All books returned to CDC must be in saleable condition. CDC will return to the customer shelf-worn and stickered books, along with a charge for return postage. Titles that are out of print may be returned for six months after the OP date. CDC's database maintains line item sales detail for all of its customers. Credit will be issued based upon the latest purchase information available. If no purchase information is available, CDC will issue credit at the maximum discount allowed if purchase was made through the CDC. Journal Orders Visit our Journals Division for more information about subscriptions. Be the first to know Get the latest updates on new releases, special offers, and media highlights when you subscribe to our email lists! Sign up here for updates about the Press"
