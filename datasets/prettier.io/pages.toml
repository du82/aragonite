title = "Prettier 3.4: A lot of bug fixes · Prettier"
description = "This release includes numerous bug fixes and other improvements."
full_description = '''Prettier 3.4: A lot of bug fixesNovember 26, 2024 · 19 min readSosuke SuzukiThis release includes numerous bug fixes and other improvements. If you appreciate Prettier and would like to support our work, please consider sponsoring us directly via our OpenCollective or by sponsoring the projects we depend on, such as typescript-eslint, remark, and Babel. Thank you for your continued support! Other Changes​ JavaScript​ Fix template literal print with array (#13315 by @fisker, @syi0808)​ // Inputconst string = `${[[1, 2], [3, 4]]}`// Prettier 3.3const string = `${[ [2], [4],]}`;// Prettier 3.4const string = `${[ [1, 2], [3, 4],]}`; Add missing parentheses in tagged template literals (#16500 by @syi0808)​ // Input(String?.raw)``;(getTag?.())``;// Prettier 3.3String?.raw``;getTag?.()``;// Prettier 3.4(String?.raw)``;(getTag?.())``; Don't remove useless \ in string literals (#16563 by @sosukesuzuki, #16763 by @fisker)​ Previously, Prettier would remove useless escape characters (\) from string literals. However, this behavior was inconsistent as it did not apply to template literals, which was reported in issue #16542. This issue is a feature request to extend this behavior to template literals as well. After discussing this internally, the Prettier team concluded that removing useless escape characters, whether in string literals or template literals, is the responsibility of a linter, not a formatter. This change disables the removal of useless escape characters in string literals across all languages supported by Prettier. To keep the previous behavior, we recommend using ESLint rules like no-useless-escape. Escaped quotes (e.g. "\"\'") may get unescaped when changing between different quotes. This is explained on the Rationale page of the official documentation. // Inputconst str = "\a";// Prettier 3.3const str = "a";// Prettier 3.4const str = "\a"; Improve comment formatting for logical expression in unary expression (#16593 by @sosukesuzuki)​ // Input!( cond1 || // foo cond2 || // bar cond3 // baz);// Prettier 3.3!( ( cond1 || // foo cond2 || // bar cond3 ) // baz);// Prettier 3.4!( cond1 || // foo cond2 || // bar cond3 // baz); Removed support for experimental syntax (#16643, #16705 by @fisker)​ DecimalLiteral - The Decimal proposal decided not to introduce new syntax. The decimal plugin will be removed from Babel 8. importReflection - The "Import Reflection" proposal has been renamed to "Source Phase Imports" Disclaimer about non-standard syntax TypeScript​ Add missing parentheses in tagged template literals (#16500 by @syi0808)​ // Input(String?.raw!)``;(String?.raw)!``;// Prettier 3.3String?.raw!``;String?.raw!``;// Prettier 3.4(String?.raw)!``;(String?.raw)!``; Preserve a comment on between decorator and modified parameter property (#16574 by @sosukesuzuki)​ The current version of Prettier unexpectedly moves a line comment between a parameter property modified by readonly, private, public, etc and a decorator. This output results in invalid TypeScript code. This change ensures that the original format is preserved. // Inputclass Foo { constructor( @decorator // comment readonly foo, ) {}}// Prettier 3.3class Foo { constructor( @decorator readonly // comment foo, ) {}}// Prettier 3.4class Foo { constructor( @decorator // comment readonly foo, ) {}} Preserve a comment between modifier and the decorated property name (#16578 by @sosukesuzuki)​ There was a bug where block comments between the modifier and the name of a decorated property were being treated as trailing comments of the decorator. This behavior was not only unexpected but also lacked idempotency. With this change, the position of the block comment between the modifier and the property name is preserved. // Inputclass Foo { @decorator readonly /* comment */ propertyName;}// Prettier 3.3class Foo { @decorator /* comment */ readonly propertyName;}// Prettier 3.3 (second output)class Foo { @decorator /* comment */ readonly propertyName;}// Prettier 3.4class Foo { @decorator readonly /* comment */ propertyName;} Don't print an extra line break for arrow function with type parameter in assignment (#16586 by @sosukesuzuki)​ There was a bug where an extra line was inserted when assigning a chained arrow function with type parameters to a variable if there was a line comment above it. This change ensures that the extra line is no longer inserted. // Inputconst foo1 = // comment <T,>() => () => 1;// Prettier 3.3const foo1 = // comment <T,>() => () => 1;// Prettier 3.4const foo1 = // comment <T,>() => () => 1; Support "Top-level await statements" (#16729 by @fisker)​ // Input(await (await fetch()).json()).foo// Prettier 3.3await(await fetch()).json().foo;// Prettier 3.4(await (await fetch()).json()).foo; Fix class heritage breaks even though it remains inside the line width (#16730 by @fisker)​ // Inputexport class JiraCreatePixFraudDetectionGateway implements Pick<IssuePixFraudDetectionGateway, "createPixFraudDetectionIssue">{ constructor(private readonly logger: Logger) { this.logger = logger.child({ context: JiraCreatePixFraudDetectionGateway.name, }); }}// Prettier 3.3export class JiraCreatePixFraudDetectionGateway implements Pick<IssuePixFraudDetectionGateway, "createPixFraudDetectionIssue">{ constructor(private readonly logger: Logger) { this.logger = logger.child({ context: JiraCreatePixFraudDetectionGateway.name, }); }}// Prettier 3.4export class JiraCreatePixFraudDetectionGateway implements Pick<IssuePixFraudDetectionGateway, "createPixFraudDetectionIssue">{ constructor(private readonly logger: Logger) { this.logger = logger.child({ context: JiraCreatePixFraudDetectionGateway.name, }); }} Print declare before accessibility in class properties (#16731 by @fisker)​ // Inputclass A { declare private readonly name: string;}// Prettier 3.3class A { private declare readonly name: string;}// Prettier 3.4class A { declare private readonly name: string;} CSS​ Resolve some types of overrun in CSS (#16570 by @seiyab)​ /* Input */@media (prefers-reduced-data: no-preference) { @font-face { unicode-range: U+0000-00FF, U+0131,U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }}/* Prettier 3.3 */@media (prefers-reduced-data: no-preference) { @font-face { unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }}/* Prettier 3.4 */@media (prefers-reduced-data: no-preference) { @font-face { unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }} Remove extra indentation in pseudo-class function (#16572 by @sosukesuzuki)​ This change fixes a bug where extra indentation was added when line breaks were included in the argument list of pseudo-class functions like :where(), :is(), and :not. /* Input */:where(input:not([type="button"], [type="reset"], [type="submit"]), textarea, select) { /* CSS here */}/* Prettier 3.3 */:where( input:not([type="button"], [type="reset"], [type="submit"]), textarea, select ) { /* CSS here */}/* Prettier 3.4 */:where( input:not([type="button"], [type="reset"], [type="submit"]), textarea, select) { /* CSS here */} Fix formatting of incomplete CSS value comments (#16583 by @sosukesuzuki, @fisker)​ When formatting CSS value comments, the trailing / may be lost, resulting in an invalid comment. This change ensures that value comments are not truncated. /* Input */h1 { --OFF: /* OFF */;}/* Prettier 3.3 */h1 { --OFF: /* OFF *;}/* Prettier 3.4 */h1 { --OFF: /* OFF */;} SCSS​ Fix error thrown when formatting SCSS file (#16607 by @fisker)​ // Input@if true { $newKey: ($key: ( $theme-name: $value ))}// Prettier 3.3Error// Prettier 3.4@if true { $newKey: ( $key: ( $theme-name: $value, ), );} Fix wrong trailing comma position after comment in SCSS (#16617 by @Ma-hawaj, @fisker)​ /* Input */$z-indexes: ( header: 1035, overlay: 1202 // TODO: change to 1050 after bootstrap modals will be removed);/* Prettier 3.3 */$z-indexes: ( header: 1035, overlay: 1202 // TODO: change to 1050 after bootstrap modals will be removed,);/* Prettier 3.4 */$z-indexes: ( header: 1035, overlay: 1202, // TODO: change to 1050 after bootstrap modals will be removed); HTML​ Keep doctype in non-html files unchanged (#16765 by @fisker)​ In Prettier v3, we print HTML5 doctype in lowercase, it's safe for HTML files, however users may use the html parser to format other files eg: XHTML files, lowercase the doctype will break XHTML documents. Starting with Prettier 3.4, we'll only lowercase HTML5 doctype (<!doctype html>) when the file extension is .html or .htm, otherwise they will be untouched. <!-- Input --><!-- foo.xhtml --><!DOCTYPE html><!-- Prettier 3.3 --><!doctype html><!-- Prettier 3.4 --><!DOCTYPE html> Vue​ Fix extra semicolon inserted in Vue event binding with non-ascii characters (#16733 by @fisker)​ <!-- Input --><template> <button @click="点击事件">点击!</button> <button @click="onClick">Click!</button></template><!-- Prettier 3.3 --><template> <button @click="点击事件;">点击!</button> <button @click="onClick">Click!</button></template><!-- Prettier 3.4 --><template> <button @click="点击事件">点击!</button> <button @click="onClick">Click!</button></template> Angular​ Support Angular 19 (#16862 by @fisker)​ Angular 19 added support for typeof keyword in template expressions. <!-- Input --><div>{{ typeof x === 'object' ? 'Y' : 'N'}}</div><!-- Prettier 3.3 --><div> {{ typeof x === 'object' ? 'Y' : 'N'}}</div>// Prettier 3.4<div>{{ typeof x === "object" ? "Y" : "N" }}</div> Markdown​ Remove excessive spaces after line prefixes for unordered lists in Markdown (#15526 by @TomasLudvik)​ <!-- Input -->- first line - second line indented- third line - fourth line - fifth line<!-- Prettier 3.3 -->- first line - second line indented- third line - fourth line - fifth line<!-- Prettier 3.4 -->- first line - second line indented- third line - fourth line - fifth line Fix incorrect wrap in sentence with linkReference (#16546 by @seiyab)​ <!-- Input (--prose-wrap=always) -->This folder has [VHS] tape files to create gifs for the [Widget Showcase]. To run them, install VHS from main (the theme and screenshot commands are not yet released).<!-- Prettier 3.3 -->This folder has [VHS] tape files to create gifs for the [Widget Showcase]. To runthem, install VHS from main (the theme and screenshot commands are not yet released).<!-- Prettier 3.4 -->This folder has [VHS] tape files to create gifs for the [Widget Showcase]. Torun them, install VHS from main (the theme and screenshot commands are not yetreleased). Preserve non-ASCII whitespaces at the end of the line and beginning of the next line (#16619 by @tats-u)​ Prettier removes non-ASCII spaces at the end of the line and beginning of the next line. However, this behavior is not consistent with the CommonMark spec. https://spec.commonmark.org/0.31.2/#soft-line-breaks Spaces at the end of the line and beginning of the next line are removed: https://spec.commonmark.org/0.31.2/#unicode-whitespace-character A Unicode whitespace character is a character in the Unicode Zs general category, or a tab (U+0009), line feed (U+000A), form feed (U+000C), or carriage return (U+000D). Unicode whitespace is a sequence of one or more Unicode whitespace characters. A space is U+0020. The CommonMark spec doesn't mention non-ASCII spaces here, so removing them changes the content of the Markdown document. <!-- Input --> EM Space (U+2003) EM Space 全角スペース (U+3000) 全形空白<!-- Prettier 3.3 -->EM Space (U+2003) EM Space全角スペース (U+3000) 全形空白<!-- Prettier 3.4 --> EM Space (U+2003) EM Space 全角スペース (U+3000) 全形空白 Don't break a line a between Chinese or Japanese and others (#16691 by @tats-u)​ Markdown documents are mainly converted to HTML or components of JavaScript-based frameworks. This means that paragraphs in Markdown are eventually processed by the browser according to CSS rules. This is because many Markdown converter preserve line breaks in paragraphs in input Markdown and HTML itself does not specify how browsers should handle line breaks in text in HTML. According to CSS rules (CSS Text Module Level 3 or later), browsers should remove line breaks between Chinese/Japanese characters instead of replacing them with spaces. However, this rule has been ignored by WebKit-based or Webkit-derived browsers (Chrome, Safari, and so on) for long time. For example, the following HTML paragraph: <p>日本語汉语漢語<p> generated from the following Markdown: 日本語汉语漢語 should be rendered as follows according to CSS rules and actually is rendered such by Firefox: 日本語汉语漢語 However, Chrome and Safari render it as follows: 日本語 汉语 漢語 This is why we should stop Prettier from line breaking between Chinese/Japanese characters. We decided to stop Prettier from forcing users to use a plugin for a Markdown converter that concatenates lines that start or end with Chinese/Japanese characters (remark-join-cjk-lines, for example). Also, a line break between Chinese/Japanese and others are equivalent to a space according to before the commit suspending a concrete rule in CSS Text Module Level 3 by commenting it out fixing an issue on the CSS Working Group Editor Drafts. Firefox follows this rule. Therefore, all browsers render the following paragraph: <!-- prettier-ignore -->```html<p>日本語 English 汉语 한국어 漢語</p><p></p> as follows: 日本語 English 汉语 한국어 漢語 However, Prettier has broken a line between Chinese/Japanese characters in Markdown for a long time, and between Chinese/Japanese and latin characters in some cases since 3.0.0. For example, the following Markdown paragraph: 日本語English汉语English漢語 is formatted as follows if --prose-wrap is set to the other value than preserve in Prettier 3.x: 日本語English汉语English漢語 However, the following HTML, which is generated by a Markdown-to-HTML converter based on the above Markdown: <p>日本語English汉语English漢語</p> is rendered as follows by all browsers: 日本語English汉语 English 漢語 This is why we should stop Prettier from line breaking al so around Chinese/Japanese characters in Markdown. We are going to conform Prettier's behavior to this rule in a future version. After that, line breaks between Chinese/Japanese and others will be allowed again under certain rules. One of the few exceptions is spaces and line breaks between Chinese/Japanese and Korean letters. The following Markdown paragraphs are equivalent even in the current Prettier version: 현재 韓國의 大統領은 尹錫悅이다. 현재韓國의大統領은尹錫悅이다. You get the former if you format the latter with --prose-wrap=always and a sufficiently long --print-width value or with --prose-wrap=never, and you get the latter if you format the former with --prose-wrap=always with a extremely short --print-width value. Therefore, we do not have to touch such spaces and line breaks. Another exception is those between a Chinese/Japanese character and a meaningful symbol in Ma'''
