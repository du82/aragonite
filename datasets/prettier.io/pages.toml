title = "Plugins · Prettier"
description = "Plugins are ways of adding new languages or formatting rules to Prettier. Prettier’s own implementations of all languages are expressed using the plugin API. The core prettier package contains JavaScript and other web-focused languages built in. For additional languages you’ll need to install a plugin."
full_description = '''On this pagePluginsPlugins are ways of adding new languages or formatting rules to Prettier. Prettier’s own implementations of all languages are expressed using the plugin API. The core prettier package contains JavaScript and other web-focused languages built in. For additional languages you’ll need to install a plugin. Using Plugins​ You can load plugins with: The CLI, via --plugin: prettier --write main.foo --plugin=prettier-plugin-foo tipYou can set --plugin options multiple times. The API, via the plugins options: await prettier.format("code", { parser: "foo", plugins: ["prettier-plugin-foo"],}); The Configuration File: { "plugins": ["prettier-plugin-foo"]} Strings provided to plugins are ultimately passed to import() expression, so you can provide a module/package name, a path, or anything else import() takes. Official Plugins​ @prettier/plugin-php @prettier/plugin-pug by @Shinigami92 @prettier/plugin-ruby @prettier/plugin-xml Community Plugins​ prettier-plugin-apex by @dangmai prettier-plugin-astro by @withastro contributors prettier-plugin-elm by @giCentre prettier-plugin-erb by @adamzapasnik prettier-plugin-gherkin by @mapado prettier-plugin-glsl by @NaridaL prettier-plugin-go-template by @NiklasPor prettier-plugin-java by @JHipster prettier-plugin-jinja-template by @davidodenwald prettier-plugin-jsonata by @Stedi prettier-plugin-kotlin by @Angry-Potato prettier-plugin-motoko by @dfinity prettier-plugin-nginx by @joedeandev prettier-plugin-prisma by @umidbekk prettier-plugin-properties by @eemeli prettier-plugin-rust by @jinxdash prettier-plugin-sh by @JounQin prettier-plugin-sql by @JounQin prettier-plugin-sql-cst by @nene prettier-plugin-solidity by @mattiaerre prettier-plugin-svelte by @sveltejs prettier-plugin-toml by @bd82 Developing Plugins​ Prettier plugins are regular JavaScript modules with the following five exports or default export with the following properties: languages parsers printers options defaultOptions languages​ Languages is an array of language definitions that your plugin will contribute to Prettier. It can include all of the fields specified in prettier.getSupportInfo(). It must include name and parsers. export const languages = [ { // The language name name: "InterpretedDanceScript", // Parsers that can parse this language. // This can be built-in parsers, or parsers you have contributed via this plugin. parsers: ["dance-parse"], },]; parsers​ Parsers convert code as a string into an AST. The key must match the name in the parsers array from languages. The value contains a parse function, an AST format name, and two location extraction functions (locStart and locEnd). export const parsers = { "dance-parse": { parse, // The name of the AST that the parser produces. astFormat: "dance-ast", hasPragma, locStart, locEnd, preprocess, },}; The signature of the parse function is: function parse(text: string, options: object): Promise<AST> | AST; The location extraction functions (locStart and locEnd) return the starting and ending locations of a given AST node: function locStart(node: object): number; (Optional) The pragma detection function (hasPragma) should return if the text contains the pragma comment. function hasPragma(text: string): boolean; (Optional) The preprocess function can process the input text before passing into parse function. function preprocess(text: string, options: object): string; printers​ Printers convert ASTs into a Prettier intermediate representation, also known as a Doc. The key must match the astFormat that the parser produces. The value contains an object with a print function. All other properties (embed, preprocess, etc.) are optional. export const printers = { "dance-ast": { print, embed, preprocess, getVisitorKeys, insertPragma, canAttachComment, isBlockComment, printComment, getCommentChildNodes, handleComments: { ownLine, endOfLine, remaining, }, },}; The printing process​ Prettier uses an intermediate representation, called a Doc, which Prettier then turns into a string (based on options like printWidth). A printer's job is to take the AST generated by parsers[<parser name>].parse and return a Doc. A Doc is constructed using builder commands: import { doc } from "prettier";const { join, line, ifBreak, group } = doc.builders; The printing process consists of the following steps: AST preprocessing (optional). See preprocess. Comment attachment (optional). See Handling comments in a printer. Processing embedded languages (optional). The embed method, if defined, is called for each node, depth-first. While, for performance reasons, the recursion itself is synchronous, embed may return asynchronous functions that can call other parsers and printers to compose docs for embedded syntaxes like CSS-in-JS. These returned functions are queued up and sequentially executed before the next step. Recursive printing. A doc is recursively constructed from the AST. Starting from the root node: If, from the step 3, there is an embedded language doc associated with the current node, this doc is used. Otherwise, the print(path, options, print): Doc method is called. It composes a doc for the current node, often by printing child nodes using the print callback. print​ Most of the work of a plugin's printer will take place in its print function, whose signature is: function print( // Path to the AST node to print path: AstPath, options: object, // Recursively print a child node print: (selector?: string | number | Array<string | number> | AstPath) => Doc,): Doc; The print function is passed the following parameters: path: An object, which can be used to access nodes in the AST. It’s a stack-like data structure that maintains the current state of the recursion. It is called “path” because it represents the path to the current node from the root of the AST. The current node is returned by path.node. options: A persistent object, which contains global options and which a plugin may mutate to store contextual data. print: A callback for printing sub-nodes. This function contains the core printing logic that consists of steps whose implementation is provided by plugins. In particular, it calls the printer’s print function and passes itself to it. Thus, the two print functions – the one from the core and the one from the plugin – call each other while descending down the AST recursively. Here’s a simplified example to give an idea of what a typical implementation of print looks like: import { doc } from "prettier";const { group, indent, join, line, softline } = doc.builders;function print(path, options, print) { const node = path.node; switch (node.type) { case "list": return group([ "(", indent([softline, join(line, path.map(print, "elements"))]), softline, ")", ]); case "pair": return group([ "(", indent([softline, print("left"), line, ". ", print("right")]), softline, ")", ]); case "symbol": return node.name; } throw new Error(`Unknown node type: ${node.type}`);} Check out prettier-python's printer for some examples of what is possible. (optional) embed​ A printer can have the embed method to print one language inside another. Examples of this are printing CSS-in-JS or fenced code blocks in Markdown. The signature is: function embed( // Path to the current AST node path: AstPath, // Current options options: Options,): | (( // Parses and prints the passed text using a different parser. // You should set `options.parser` to specify which parser to use. textToDoc: (text: string, options: Options) => Promise<Doc>, // Prints the current node or its descendant node with the current printer print: ( selector?: string | number | Array<string | number> | AstPath, ) => Doc, // The following two arguments are passed for convenience. // They're the same `path` and `options` that are passed to `embed`. path: AstPath, options: Options, ) => Promise<Doc | undefined> | Doc | undefined) | Doc | undefined; The embed method is similar to the print method in that it maps AST nodes to docs, but unlike print, it has power to do async work by returning an async function. That function's first parameter, the textToDoc async function, can be used to render a doc using a different plugin. If a function returned from embed returns a doc or a promise that resolves to a doc, that doc will be used in printing, and the print method won’t be called for this node. It's also possible and, in rare situations, might be convenient to return a doc synchronously directly from embed, however textToDoc and the print callback aren’t available at that case. Return a function to get them. If embed returns undefined, or if a function it returned returns undefined or a promise that resolves to undefined, the node will be printed normally with the print method. Same will happen if a returned function throws an error or returns a promise that rejects (e.g., if a parsing error has happened). Set the PRETTIER_DEBUG environment variable to a non-empty value if you want Prettier to rethrow these errors. For example, a plugin that has nodes with embedded JavaScript might have the following embed method: function embed(path, options) { const node = path.node; if (node.type === "javascript") { return async (textToDoc) => { return [ "<script>", hardline, await textToDoc(node.javaScriptCode, { parser: "babel" }), hardline, "</script>", ]; }; }} If the --embedded-language-formatting option is set to off, the embedding step is entirely skipped, embed isn’t called, and all nodes are printed with the print method. (optional) preprocess​ The preprocess method can process the AST from the parser before passing it into the print method. function preprocess(ast: AST, options: Options): AST | Promise<AST>; (optional) getVisitorKeys​ This property might come in handy if the plugin uses comment attachment or embedded languages. These features traverse the AST iterating through all the own enumerable properties of each node starting from the root. If the AST has cycles, such a traverse ends up in an infinite loop. Also, nodes might contain non-node objects (e.g., location data), iterating through which is a waste of resources. To solve these issues, the printer can define a function to return property names that should be traversed. Its signature is: function getVisitorKeys(node, nonTraversableKeys: Set<string>): string[]; The default getVisitorKeys: function getVisitorKeys(node, nonTraversableKeys) { return Object.keys(node).filter((key) => !nonTraversableKeys.has(key));} The second argument nonTraversableKeys is a set of common keys and keys that prettier used internal. If you have full list of visitor keys const visitorKeys = { Program: ["body"], Identifier: [], // ...};function getVisitorKeys(node /* , nonTraversableKeys*/) { // Return `[]` for unknown node to prevent Prettier fallback to use `Object.keys()` return visitorKeys[node.type] ?? [];} If you only need exclude a small set of keys const ignoredKeys = new Set(["prev", "next", "range"]);function getVisitorKeys(node, nonTraversableKeys) { return Object.keys(node).filter( (key) => !nonTraversableKeys.has(key) && !ignoredKeys.has(key), );} (optional) insertPragma​ A plugin can implement how a pragma comment is inserted in the resulting code when the --insert-pragma option is used, in the insertPragma function. Its signature is: function insertPragma(text: string): string; Handling comments in a printer​ Comments are often not part of a language's AST and present a challenge for pretty printers. A Prettier plugin can either print comments itself in its print function or rely on Prettier's comment algorithm. By default, if the AST has a top-level comments property, Prettier assumes that comments stores an array of comment nodes. Prettier will then use the provided parsers[<plugin>].locStart/locEnd functions to search for the AST node that each comment "belongs" to. Comments are then attached to these nodes mutating the AST in the process, and the comments property is deleted from the AST root. The *Comment functions are used to adjust Prettier's algorithm. Once the comments are attached to the AST, Prettier will automatically call the printComment(path, options): Doc function and insert the returned doc into the (hopefully) correct place. (optional) getCommentChildNodes​ By default, Prettier searches all object properties (except for a few predefined ones) of each node recursively. This function can be provided to override that behavior. It has the signature: function getCommentChildNodes( // The node whose children should be returned. node: AST, // Current options options: object,): AST[] | undefined; Return [] if the node has no children or undefined to fall back on the default behavior. (optional) printComment​ Called whenever a comment node needs to be printed. It has the signature: function printComment( // Path to the current comment node commentPath: AstPath, // Current options options: object,): Doc; (optional) canAttachComment​ function canAttachComment(node: AST): boolean; This function is used for deciding whether a comment can be attached to a particular AST node. By default, all AST properties are traversed searching for nodes that comments can be attached to. This function is used to prevent comments from being attached to a particular node. A typical implementation looks like function canAttachComment(node) { return node.type && node.type !== "comment";} (optional) isBlockComment​ function isBlockComment(node: AST): boolean; Returns whether or not the AST node is a block comment. (optional) handleComments​ The handleComments object contains three optional functions, each with signature ( // The AST node corresponding to the comment comment: AST, // The full source code text text: string, // The global options object options: object, // The AST ast: AST, // Whether this comment is the last comment isLastComment: boolean,) => boolean; These functions are used to override Prettier's default comment attachment algorithm. ownLine/endOfLine/remaining is expected to either manually attach a comment to a node and return true, or return false and let Prettier attach the comment. Based on the text surrounding a comment node, Prettier dispatches: ownLine if a comment has only whitespace preceding it and a newline afterwards, endOfLine if a comment has a newline afterwards but some non-whitespace preceding it, remaining in all other cases. At the time of dispatching, Prettier will have annotated each AST comment node (i.e., created new properties) with at least one of enclosingNode, precedingNode, or followingNode. These can be used to aid a plugin's decision process (of course the entire AST and original text is also passed in for making more complicated decisions). Manually attaching a comment​ The util.addTrailingComment/addLeadingComment/addDanglingComment functions can be used to manually attach a comment to an AST node. An example ownLine function that ensures a comment does not follow a "punctuation" node (made up for demonstration purposes) might look like: import { util }'''
