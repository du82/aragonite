["https://prettier.io/blog/2023/11/30/cli-deep-dive"]
title = "Prettier's CLI: A Performance Deep Dive · Prettier"
description = "Hey, I'm Fabio and I've been contracted by the Prettier team to speed up Prettier's command line interface (CLI). In this post we'll take a look at the optimizations I've discovered, the process that lead to finding them, some exciting numbers comparing the current CLI with the new one, and some guesses about what could be optimized next."
full_description = '''Prettier's CLI: A Performance Deep DiveNovember 30, 2023 · 24 min readFabio SpampinatoHey, I'm Fabio and I've been contracted by the Prettier team to speed up Prettier's command line interface (CLI). In this post we'll take a look at the optimizations I've discovered, the process that lead to finding them, some exciting numbers comparing the current CLI with the new one, and some guesses about what could be optimized next. Installation​ The new work-in-progress CLI for Prettier has just been released, and you can install it now: npm install prettier@next It should be largely backwards compatible: prettier . --check # Like before, but faster If you find any issues you can temporarily use the old CLI using an environment variable: PRETTIER_LEGACY_CLI=1 prettier . --check You can also try it via npx, though npx itself is pretty slow: npx prettier@next . --check The goal is to make it close to ~100% backwards compatible, and then just ship it in a future stable release of the prettier package, replacing the current CLI. Overview​ Prettier's CLI works roughly like in the diagram above: There's some action we want to execute on files, for example checking if they are formatted properly. We need to actually find all the files to execute this action on. We need to resolve .gitignore and .prettierignore files, to figure out if some of those files are to be ignored. We need to resolve .editorconfig files, for EditorConfig-specific formatting configurations for those files. We need to resolve .prettierrc files, and ~10 more, for Prettier-specific formatting configurations for those files. We need to check if each of the files matches its formatting configuration. Finally we need to output some kind of result to the terminal. After this high-level look at the CLI's architecture I think there are mainly 3 observations to make: The amount of work to do scales with the number of target files, but most files are completely unchanged between runs of the CLI, because for example a commit in a large-enough repository generally only touches a fraction of the files, so if we could only remember work done in the previous run most of the work on the current run could be skipped. There are potentially a huge number of configuration files to resolve, since our repository could have thousands of folders and each folder could have some configuration files in it, moreover if for example we find 10 different .editorconfig files, each of them could define different settings for files matching specific globs, so they all need to be combined together in a file-specific way, for each target file. But, in almost every case a repository is only going to contain just one or a handful of .editorconfig files, even if the repo has thousands of folders, so somehow this shouldn't be that expensive. This isn't a particularly insightful observation, but if everything a program is doing is necessary, and everything done is done efficiently, then the program itself must execute efficiently as a result, so we are generally just going to try to skip unnecessary work as much as possible, and what we can't skip we'll try to make efficient. From these observations I started writing a new CLI for Prettier from scratch, as it's often easier to rewrite things with performance in mind from the start than to patch them to be performant. I'll use Babel's monorepo to take measurements throughout this post, as it provides a good sort of benchmark, and it should give you a sense of what the improvement will be in practice for a real, fairly large, monorepo. Finding files fast​ First of all we need to find our target files. Prettier's current CLI uses fast-glob for that, and the code for using it may look like this: import fastGlob from "fast-glob";const files = await fastGlob("packages/**/*.{js,cjs,mjs}", { ignore: ["**/.git", "**/.sl", "**/.svn", "**/.hg", "**/node_modules"], absolute: true, dot: true, followSymbolicLinks: false, onlyFiles: true, unique: true,}); If we run that on Babel's monorepo we'll see that it takes some ~220ms to find ~17k files matching our globs, out of ~30k total files found, which seems reasonably good, considering that Babel's monorepo contains over 13k folders also. With a quick profiling we can spot that a significant amount of time is being spent checking if the found files match any of our "ignore" globs, which seem internally converted to regexes and matched one by one. So I tried merging the globs into a single one: "**/{.git,.sl,.svn,.hg,node_modules}", but it seems to get internally split up again for some reason, so that didn't change anything. By commenting our ignore globs out entirely we can find pretty much the same files, because almost none of them got actually ignored, in just around ~180ms, which is ~20% less time. So if we could match those globs differently, in a faster way, we could lower times a bit. This is probably a good time to mention that fast-glob does a pretty cool optimization, if our glob looks like this: packages/**/*.{js,cjs,mjs}, then it can spot that the beginning of it is entirely static, what we are actually asking it to do is to search for **/*.{js,cjs.mjs} inside the packages folder only. This optimization can be significant if there are lots of files in other folders we don't actually care about, because they will just never be scanned at all. That got me thinking: our ignore globs are basically the same, but the static part is at the end, rather than at the start. So I wrote another library for finding files with a glob that is able to take advantage of globs with a static end too. The equivalent code for finding files with that would be this: import readdir from "tiny-readdir-glob";const { files } = await readdir("packages/**/*.{js,cjs,mjs}", { ignore: "**/{.git,.sl,.svn,.hg,node_modules}", followSymlinks: false,}); And it finds the same files in just around ~130ms. By commenting out the ignore glob, just to check how much overhead that adds, it seems to take about the same amount of time, so that got optimized enough that it's hard to measure its cost in this scenario. It got faster than we perhaps expected, for a few reasons: Other than the ignore glob, the **/*.{js,cjs,mjs} portion of the main glob ended up getting optimized too. Globs are matched against the relative path of a file from the root folder we started searching from, so there would be a bunch of path.relative calls in there, but if our glob looks like this: **/.git, then it doesn't matter if we calculate the relative path or not, we'll effectively be looking at the end of that string for a child path anyway, so I'm just skipping those path.relative calls completely. Node's fs.readdir API is used internally in both libraries to scan directories, and it gives us the names of the found files and folders, not their absolute paths, which is what we actually want, but we can generate that more manually, by joining the parent path and the name with the path separator, rather than by calling path.join, which speeds things up a bit more. Additionally this new library is ~90% smaller, about 65kb of minified code is no longer needed, which speeds up startup for the entire CLI. In much smaller repos than Babel's the new CLI might be able to find all the target files by the time the old one just finished parsing fast-glob. Rewriting this part of the CLI may seem a little heavy-handed for the kind of speed up that we got, but the main reason for the rewrite is actually another. It would seem that there should be nothing that we could do here that would speed up the CLI by multiple seconds, since finding all the files takes less than half a second to begin with, but, the crucial point to highlight here is that for the entire CLI we not only need to find files to format, but we also need to find configuration files, and knowing every single file and folder that was found, even if they didn't match our globs, is very valuable information that will allow us to shave multiple seconds later. tiny-readdir-glob can give us that information more or less for free, so it seemed worth writing it even just for that alone. To summarize the perhaps interesting points from this section: If you can, always tell Prettier the extensions to look for, for example with a glob like packages/**/*.{js,cjs,mjs}. If you used packages/**/* or just packages instead in this scenario 13k extra files would need to be processed, and it would be more expensive for Prettier to discard them later on. There's always something left to optimize or special-case for performance, even in already optimized libraries, if one has the time to look into it. It's worth thinking about what kind of information is being thrown away, or made somewhat expensive to reconstruct. Here the glob library has to know the found files and folders just to do its work, exposing that information to the caller unlocks additional performance basically for free, in some cases. Guesses on how to speed this up further: This seems to be bottlenecked by the performance of fs.promises.readdir in Node, and/or the overhead of creating a Promise for each found folder. It may be worth looking into using the callback-style version of that API, and into optimization opportunities in Node itself. Resolving configurations fast​ This is possibly the most impactful optimization behind the new CLI, and it's basically about finding configuration files as fast as possible, for each folder only ever checking once if it contains configuration files, and parsing the found configuration files only once. A major problem behind the current CLI is that it caches resolved configurations by file path, rather than by folder path, so for example Babel's monorepo has ~17k files to format, but only 1 .editorconfig file in the whole repo, we should be parsing that file once, but instead it got parsed ~17k times. Additionally if you imagine those ~17k files being under the same folder, that folder got asked if it contained an .editorconfig file ~17k times, so actually the deeper nested into folders files to format were, the slower the entire CLI would get. This problem got largely solved in two steps: Resolved configuration files are cached by folder path, so it doesn't matter anymore how many files each folder contains, or how deep they are into folders. The found folders are now being asked basically 0 times if they contain each of the ~15 supported configuration files, because we know from the previous section every single file in the repo, so we can just do a lookup in there, which ends up being a lot faster than asking the filesystem. This wouldn't matter much in most small repos, but Babel's for example has ~13k folders, and 13k * 15 checks with the filesystem added multiplied up quickly enough. Let's now take a deeper look into how each specific supported type of configuration is resolved. Resolving EditorConfig configurations​ Assuming from the previous step that we've parsed every .editorconfig file in the repo and that we can fetch the relevant ones for any target file in constant time, what we now want to do is to merge them together into a single configuration object, for each target file, basically. Right away this idea kinda goes out of the window, because the editorconfig package doesn't provide a function for doing this. The closest one seems the one called parseFromFiles, which besides being deprecated it seems to do what we want, but it wants configurations as strings, so it will presumably parse them by itself after each call, which is the thing we wanted to avoid in the first place, we only want to ever parse those once. So that package got rewritten for Prettier's needs, tiny-editorconfig provides exactly the resolve function we need, and it leaves the logic for finding configuration files to us, which is what we want anyway because we need to cache these files in a custom way. While I was at it I've rewritten the INI parser behind it too, and it seems to be ~9x faster. It shouldn't matter much, because most repos will only have 1 .editorconfig file in them, but I enjoy writing these little parsers, and hey if you happen to have thousands of .editorconfig files in your repo you'll notice the extra performance boost! Additionally this new library is ~82% smaller, ~50kb of minified code got deleted, which speeds up startup for the whole CLI. Also it uses the same glob library that tiny-readdir-glob uses, while in the current CLI fast-glob and editorconfig use different ones, so actually a bit more code than that got effectively deleted. Previously it would have taken multiple seconds to resolve these files for Babel's monorepo, now it takes roughly ~100ms. Guesses on how to speed this up further: It should be possible in some (most?) cases to pre-resolve these configuration files for any possible file path we could encounter, for example depending on the globs in them it may be possible that we can end up with 3 possible resolved configurations at most, one for files that don't match any of the globs, one for files that match the **/*.js glob, and one for files that match the **/*.md glob. It's a bit complicated to implement though, and unclear what the speedup will be in practice, but it's something to think about for the future. Resolving Prettier configurations​ For Prettier-specific configurations, like the .prettierrc file, we are also assuming that we've resolved all the found configuration files, and can retrieve them in constant time for any target file. It's basically an identical situation to what we had for EditorConfig-specific configurations, so we'll basically do the same, this time hard-coding the logic for merging the configurations inside the CLI itself, as making a standalone package for it seems of basically no utility to the ecosystem. The main aspects to consider here for the future are, in my opinion: A large number of different configuration files are supported. In Babel's monorepo this translates to ~150k lookups in the object of known paths we created in the first step, which while not super expensive it's not free either. If this number could be reduced by a lot it would speed things up a bit. Also some of the parsers required to parse those configuration files are relatively expensive, the json5 parser requires ~100x as much code as the smallest JSONC (JSON with Comments) parser that I know of for JavaScript, while being in some cases ~50x slower at parsing also. If fewer formats could be supported the CLI would be leaner as a result. If we could check just once if a file named for example .prettierrc.json5 got found anywhere in the repo we could reduce the number of checks for these configuration files by an order of magnitude, because if no file with that name was found anywhere in the repo then we don't need to ask each of Babel's ~13k folders if they have it. The list of all known file names is another piece of valuable information that the glob library we are using could give us for free. Resolvi'''
author = "https://github.com/fabiospampinato"
year_published = 2023
clearnet = "https://prettier.io/blog/2023/11/30/cli-deep-dive"
tags = ["--check", "--no-cache", ".editorconfig", ".gitignore", ".prettierignore", "actually", "also.", "amount", "babel's", "basically"]
