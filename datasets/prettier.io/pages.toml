["https://prettier.io/blog/2023/07/05/3.0.0"]
title = "Prettier 3.0: Hello, ECMAScript Modules! · Prettier"
description = "We are excited to announce the release of the new version of Prettier!"
full_description = '''Prettier 3.0: Hello, ECMAScript Modules!July 5, 2023 · 36 min readSosuke SuzukiWe are excited to announce the release of the new version of Prettier! We have made the migration to using ECMAScript Modules for all our source code. This change has significantly improved the development experience for the Prettier team. Please rest assured that when using Prettier as a library, you can still use it as CommonJS as well. This update comes with several breaking changes. One notable example is the alteration in markdown formatting - spaces are no longer inserted between Latin characters and Chinese or Japanese characters. We'd like to extend our gratitude to Tatsunori Uchino, who has made significant contributions to Prettier over the past year, particularly with this feature. Additionally, the default value of trailingComma has been changed to "all". Another important change in this release is the significant overhaul of the plugin interface. Prettier now supports plugins written using ECMAScript Modules and async parsers. If you're a plugin developer, please exercise caution while updating. You can find the migration guide here. As always, we welcome bug reports and feedback! This release also includes numerous formatting improvements and bug fixes. If you appreciate Prettier and would like to support our work, please consider sponsoring us directly via our OpenCollective or by sponsoring the projects we depend on, such as typescript-eslint, remark, and Babel. Thank you for your continued support! Highlights​ Markdown​ Improve handling of whitespace for Chinese, Japanese, and Korean (#11597 by @tats-u)​ Stop inserting spaces between Chinese or Japanese and Western characters​ Previously, Prettier would insert spaces between Chinese or Japanese and Western characters (letters and digits). While some people prefer this style, it isn’t standard, and is in fact contrary to official guidelines. Please see here for more details. We decided it’s not Prettier’s job to enforce a particular style in this case, so spaces aren’t inserted anymore, while existing ones are preserved. If you need a tool for enforcing spacing style, consider textlint-ja or lint-md (rules space-round-alphabet and space-round-number). The tricky part of this change were ambiguous line breaks between Chinese or Japanese and Western characters. When Prettier unwraps text, it needs to decide whether such a line break should be simply removed or replaced with a space. For that Prettier examines the surrounding text and infers the preferred style. <!-- Input -->漢字Alphabetsひらがな12345カタカナ67890漢字 Alphabets ひらがな 12345 カタカナ 67890<!-- Prettier 2.8 -->漢字 Alphabets ひらがな 12345 カタカナ 67890漢字 Alphabets ひらがな 12345 カタカナ 67890<!-- Prettier 3.0 -->漢字Alphabetsひらがな12345カタカナ67890漢字 Alphabets ひらがな 12345 カタカナ 67890 Comply to line breaking rules in Chinese and Japanese​ There are rules that prohibit certain characters from appearing at the beginning or the end of a line in Chinese and Japanese. E.g., full stop characters 。, ．, and . shouldn’t start a line whereas （ shouldn’t end a line. Prettier now follows these rules when it wraps text, that is when proseWrap is set to always. <!-- Input -->HTCPCPのエラー418は、ティーポットにコーヒーを淹（い）れさせようとしたときに返されるステータスコードだ。<!-- Prettier 2.8 with --prose-wrap always --print-width 8 -->HTCPCP のエラー418 は、ティーポットにコーヒーを淹（い）れさせようとしたときに返されるステータスコードだ。<!-- Prettier 3.0 with the same options -->HTCPCPのエラー418は、ティーポットにコーヒーを淹（い）れさせようとしたときに返されるステータスコードだ。 Do not break lines inside Korean words​ Korean uses spaces to divide words, and an inappropriate division may change the meaning of a sentence: 노래를 못해요.: I’m not good at singing. 노래를 못 해요.: I can’t sing (for some reason). Previously, when proseWrap was set to always, successive Hangul characters could get split by a line break, which could later be converted to a space when the document is edited and reformatted. This doesn’t happen anymore. Korean text is now wrapped like English. <!-- Input -->노래를 못해요.<!-- Prettier 2.8 with --prose-wrap always --print-width 9 -->노래를 못해요.<!-- Prettier 2.8, subsequent reformat with --prose-wrap always --print-width 80 -->노래를 못 해요.<!-- Prettier 3.0 with --prose-wrap always --print-width 9 -->노래를못해요.<!-- Prettier 3.0, subsequent reformat with --prose-wrap always --print-width 80 -->노래를 못해요. A line break between Hangul and non-Hangul letters and digits is converted to a space when Prettier unwraps the text. Consider this example: 3분 기다려 주지. In this sentence, if you break the line between “3” and “분”, a space will be inserted there when the text gets unwrapped. API​ Support plugins with async parsers (#12748 by @fisker, #13211 by @thorn0 and @fisker)​ parse function in a plugin can return a Promise now. In order to support async parsers for embedded languages, we had to introduce a breaking change to the plugin API. Namely, the embed method of a printer has now to match a completely new signature, incompatible with previous versions. If you're a plugin author and your plugins don't define embed, you have nothing to worry about, otherwise see the docs for details. Also, the preprocess method of a printer can return a promise now. Support config files in ESM (#13130 by @fisker)​ Config files in ESM are supported, supported config file names: prettier.config.js (in place with {"type": "module"} in package.json) .prettierrc.js (same as above) prettier.config.mjs .prettierrc.mjs. export default { trailingComma: "es5", tabWidth: 4, semi: false, singleQuote: true,}; Shareable config package can also be a pure ESM package. Breaking Changes​ JavaScript​ Change the default value for trailingComma to all (#11479 by @fisker, #13143 by @sosukesuzuki)​ Since version 2.0. we've changed the default value for trailingComma to es5. Internet Explorer, the last browser to not allow trailing commas in function calls, has been unsupported on June 15, 2022. Accordingly, change the default value for trailingComma to all. If the old behavior is still preferred, please configure Prettier with { "trailingComma": "es5" }. Remove Flow syntax support from babel parser (#14314 by @fisker, @thorn0)​ For historical reasons, Prettier used to recognize Flow syntax in JS files when the parser option was set to babel even if the file didn't include the @flow pragma. This support was limited and bad for performance, so it has been removed in Prettier 3.0. Prettier with the babel parser still automatically switches to the Flow syntax if it finds the @flow pragma or the file has the .js.flow extension. Flow​ Remove support for Flow comments (#13687, #13703 by @thorn0)​ Being a kind of preprocessor, Flow comments AKA comment types are processed on the token level and can't be represented in an AST in the general case. Flow builds the AST as if these special comment tokens didn't exist. Example: /*:: if */ (x) + y; This is parsed as if (x) +y; by Flow and as x + y; by JS parsers that don't support Flow. Previously, for some special cases, Prettier tried to detect that this syntax was used and to preserve it. As an attempt to solve an unsolvable problem, this limited support was fragile and riddled with bugs, so it has been removed. Now if the parser option is set to flow or babel-flow, Flow comments will be parsed and reprinted like normal code. If a parser that doesn't support Flow is used, they will be treated like usual comments. // Inputlet a /*: foo */ = b;// Prettier 2.8let a /*: foo */ = b;// Prettier 3.0 with --parser flowlet a: foo = b;// Prettier 3.0 with --parser babellet a /*: foo */ = b; Print trailing comma in type parameters and tuple types when --trailing-comma=es5 (#14086, #14085 by @fisker)​ // Inputtype Foo = [ { from: string, to: string, }, // <- 1];type Foo = Promise< | { ok: true, bar: string, baz: SomeOtherLongType } | { ok: false, bar: SomeOtherLongType }, // <- 2>;// Prettier 2.8type Foo = [ { from: string, to: string, } // <- 1];type Foo = Promise< | { ok: true, bar: string, baz: SomeOtherLongType } | { ok: false, bar: SomeOtherLongType } // <- 2>;// Prettier 3.0type Foo = [ { from: string, to: string, }, // <- 1];type Foo = Promise< | { ok: true, bar: string, baz: SomeOtherLongType } | { ok: false, bar: SomeOtherLongType }, // <- 2>; CSS​ Add the pure css parser (#7933, #9092, #9093 by @fisker)​ Previously, when --parser=css was passed, Prettier tried to parse the content using postcss-scss and postcss-less. This caused confusion, and made syntax errors difficult to spot. Now --parser=css works only with the vanilla CSS syntax. If you use parser="css" for your .less/.scss files, update it to the correct parser or remove the parser option to let Prettier auto-detect the parser by the file extension. /* Input *//* Less Syntax with `--parser=css` */a {.bordered();}/* Prettier 2.8 *//* Less Syntax with `--parser=css` */a { .bordered();}/* Prettier 3.0 */SyntaxError: (postcss) CssSyntaxError Unknown word (2:4) 1 | /* Less Syntax with `--parser=css` */> 2 | a {.bordered();} /* Input *//* Scss Syntax with `--parser=css` */::before {content: #{$foo}}/* Prettier 2.8 *//* Scss Syntax with `--parser=css` */::before { content: #{$foo};}/* Prettier 3.0 */SyntaxError: (postcss) CssSyntaxError Unknown word (2:22) 1 | /* Scss Syntax with `--parser=css` */> 2 | ::before {content: #{$foo}} GraphQL​ Drop support for "comma separated interfaces" syntax (#12835 by @fisker)​ # Inputtype Type1 implements A, B {a: a}# Prettier 2.8type Type1 implements A, B { a: a}# Prettier 3.0SyntaxError: Syntax Error: Unexpected Name "B". (1:26)> 1 | type Type1 implements A, B {a: a} API​ Drop support for Node.js 10 and 12 (#11830 by @fisker, #13118 by @sosukesuzuki)​ The minimal required Node.js version is v14 Change public APIs to asynchronous (#12574, #12788, #12790, #13265 by @fisker)​ prettier.format() returns Promise<string> prettier.formatWithCursor() returns Promise<{formatted: string, cursorOffset: number}> prettier.formatAST() returns Promise<string> prettier.check() returns Promise<boolean> prettier.getSupportInfo() returns Promise prettier.clearConfigCache() returns Promise<void> prettier.resolveConfig.sync is removed prettier.resolveConfigFile.sync is removed prettier.getFileInfo.sync is removed If you still need sync APIs, you can try @prettier/sync Npm package file structures changed (#12740 by @fisker, #13530 by @fisker, #14570 by @fisker)​ File structures changes: bin-prettier.js -> bin/prettier.cjs esm/standalone.mjs -> standalone.mjs esm/parser-angular.mjs -> plugins/angular.mjs parser-angular.js -> plugins/angular.js esm/parser-babel.mjs -> plugins/babel.mjs parser-babel.js -> plugins/babel.js esm/parser-espree.mjs -> plugins/acorn-and-espree.mjs parser-espree.js -> plugins/acorn.js global object renamed prettierPlugins.espree -> prettierPlugins.acorn esm/parser-flow.mjs -> plugins/flow.mjs parser-flow.js -> plugins/flow.js esm/parser-glimmer.mjs -> plugins/glimmer.mjs parser-glimmer.js -> plugins/glimmer.js esm/parser-graphql.mjs -> plugins/graphql.mjs parser-graphql.js -> plugins/graphql.js esm/parser-html.mjs -> plugins/html.mjs parser-html.js -> plugins/html.js esm/parser-markdown.mjs -> plugins/markdown.mjs parser-markdown.js -> plugins/markdown.js esm/parser-meriyah.mjs -> plugins/meriyah.mjs parser-meriyah.js -> plugins/meriyah.js esm/parser-postcss.mjs -> plugins/postcss.mjs parser-postcss.js -> plugins/postcss.js esm/parser-typescript.mjs -> plugins/typescript.mjs parser-typescript.js -> plugins/typescript.js esm/parser-yaml.mjs -> plugins/yaml.mjs parser-yaml.js -> plugins/yaml.js Check full list on https://unpkg.com/browse/prettier@3.0.0/. A new plugin has been added: plugins/estree.mjs (ESM version) plugins/estree.js (UMD version) If you use standalone version, this plugin should be loaded when printing JavaScript, TypeScript, Flow, or JSON. import { format } from "prettier/standalone";- import prettierPluginBabel from "prettier/parser-babel";+ import * as prettierPluginBabel from "prettier/plugins/babel";+ import * as prettierPluginEstree from "prettier/plugins/estree";console.log(- format(code, {+ await format(code, { parser: "babel",- plugins: [prettierPluginBabel],+ plugins: [prettierPluginBabel, prettierPluginEstree], })); - node ./node_modules/prettier/bin-prettier.js . --write+ node ./node_modules/prettier/bin/prettier.cjs . --write Support plugins in ESM (#13201 by @fisker)​ Since v3.0.0, we load plugins via import() instead of require(), plugins can be ESM modules now. If you use --plugin by directory path, or file path without extensions, the plugin may not able to load. - prettier . --plugin=path/to/my-plugin-directory+ prettier . --plugin=path/to/my-plugin-directory/index.js - prettier . --plugin=path/to/my-plugin-file+ prettier . --plugin=path/to/my-plugin-file.js Update prettier.doc (#13203, #14456 by @fisker)​ prettier.doc.builders.concat was deprecated in v2.3.0, now it's removed. The following apis are never documented, they mean to only use internally, now they are removed. prettier.doc.utils.getDocParts prettier.doc.utils.propagateBreaks prettier.doc.utils.cleanDoc prettier.doc.utils.getDocType prettier.doc.debug.printDocToDebug textToDoc trims trailing hard lines (#13220 by @fisker)​ Previously, in all core languages, after embedded code printed to Doc, we call prettier.doc.utils.stripTrailingHardline() to remove the trailing hard lines. We believe make textToDoc return docs without trailing hard lines makes the plugins easier to do embed print. Removed support for custom parser api (#13250 by @fisker and @thorn0)​ Before plugins were a thing, Prettier had a similar but more limited feature called custom parsers. It’s been removed in v3.0.0 as its functionality was a subset of what the Plugin API did. If you used it, please check how to migrate. The second argument parsers passed to parsers.parse has been removed (#13268 by @fisker)​ The plugin's print function signature changed from function parse(text: string, parsers: object, options: object): AST; to function parse(text: string, options: object): Promise<AST> | AST; The second argument parsers has been removed, if you still need other parser during parse process, you can: Import the plugin yourself (recommended) import * as prettierPluginBabel from "prettier/plugins/babel";const myCustomPlugin = { parsers: { "my-custom-parser": { async parse(text) { const ast = await prettierPluginBabel.parsers.babel.parse(text); ast.program.body[0].expression.callee.name = "_"; return ast; }, astFormat: "estree", }, },}; Get the parser from the options argument function getParserFromOptions(options, parserName) { const parserOrParserInitFunction = options.plugins.find( (plugin) => plugin.parsers && Object.hasOwn(plugin.parsers, parserName), )?.parsers[parserName]; return typeof parserOrParserInitFunction === "function" ? parserOrParserInitFunction() : parserOrParserInitFunction;}const myCustomPlugin = { parsers: { "my-custom-parser": { async parse(text, options) { const babelParser = await getParserFromOptions(options, "babel"); const ast = await babelPa'''
