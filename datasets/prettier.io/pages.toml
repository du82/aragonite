full_description = "Prettier 3.5: New objectWrap option, experimentalOperatorPosition option and TS config file support!February 9, 2025 · 9 min readSosuke SuzukiThis release includes a lot of bug fixes and the following new features: Support for the new objectWrap option Support for the new experimental experimentalOperatorPosition option Support for TypeScript configuration file See each section for details.Read more Prettier 3.4: A lot of bug fixesNovember 26, 2024 · 19 min readSosuke SuzukiThis release includes numerous bug fixes and other improvements. If you appreciate Prettier and would like to support our work, please consider sponsoring us directly via our OpenCollective or by sponsoring the projects we depend on, such as typescript-eslint, remark, and Babel. Thank you for your continued support!Read more Prettier 3.3: New Flow features and a lot of bug fixesJune 1, 2024 · 7 min readSosuke SuzukiThis release includes support for new Flow features such as component and hook declarations. All of these features were implemented by the engineers on the Flow team, thank you. If you appreciate Prettier and would like to support our work, please consider sponsoring us directly via our OpenCollective or by sponsoring the projects we depend on, such as typescript-eslint, remark, and Babel. Thank you for your continued support!Read more Prettier 3.2: Support JSONC and Angular’s ICU expressionJanuary 12, 2024 · 6 min readSosuke SuzukiThis release includes new features such as adding a JSONC parser, adding Angular’s ICU expressions, and many bug fixes. We are still seeking feedback for the --experimental-ternaries option released in Prettier 3.1. Please read A curious case of the ternaries and respond via the Google Forms link provided. Additionally, we recommend reading Prettier's CLI: A Performance Deep Dive by Fabio Spampinato. This faster CLI is slated to be released as version 4.0.Read more Prettier's CLI: A Performance Deep DiveNovember 30, 2023 · 24 min readFabio SpampinatoHey, I'm Fabio and I've been contracted by the Prettier team to speed up Prettier's command line interface (CLI). In this post we'll take a look at the optimizations I've discovered, the process that lead to finding them, some exciting numbers comparing the current CLI with the new one, and some guesses about what could be optimized next.Read more"
