title = "Prettier blog · Prettier"
description = "Read blog posts about Prettier from the team"
full_description = "Prettier 2.7: new --cache CLI option and TypeScript 4.7 syntax!June 14, 2022 · 9 min readSosuke SuzukiThis release includes a new --cache CLI option. Enabling this option will use some attributes as cache keys and format files only if they have changed. This could dramatically improve CLI performance. We've also added support formatting for TypeScript 4.7 syntax! If you enjoy Prettier and would like to support our work, consider sponsoring us directly via our OpenCollective or by sponsoring the projects we depend on, including typescript-eslint, remark, and Babel.Read more Prettier 2.6: new singleAttributePerLine option and new JavaScript features!March 16, 2022 · 13 min readSosuke SuzukiThis release includes a new singleAttributePerLine option. This is an option to print only one attribute per line in Vue SFC templates, HTML, and JSX. Per our Option Philosophy, we would prefer not to add such an option. However, there are many users who want this feature, and major style guides like Airbnb’s JavaScript Style Guide and Vue’s style guide recommend the single attribute per line style. A PR to add this feature was opened in October 2019, and both it and the corresponding issue have received a significant amount of support from users. For us it was a hard decision to add this option. We hope the addition of this option will benefit many users without significantly harming our principles. We've also added support formatting for some new JavaScript syntax proposals via Babel.Read more Prettier begins paying maintainersJanuary 6, 2022 · 2 min readChristopher ChedeauPrettier, an opinionated code formatter for JavaScript and many web languages, has been accepting donations at OpenCollective since 2019 and thanks to many generous donations we now have $50,000 in the bank! As a result, we are now able to pay the two active maintainers $1,500/month each. This funding will ensure that they will be able to continue consistent maintenance of Prettier into the future.Read more"
