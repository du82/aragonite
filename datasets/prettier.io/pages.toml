["https://prettier.io/blog/2024/06/01/3.3.0"]
title = "Prettier 3.3: New Flow features and a lot of bug fixes · Prettier"
description = "This release includes support for new Flow features such as component and hook declarations. All of these features were implemented by the engineers on the Flow team, thank you."
full_description = '''Prettier 3.3: New Flow features and a lot of bug fixesJune 1, 2024 · 7 min readSosuke SuzukiThis release includes support for new Flow features such as component and hook declarations. All of these features were implemented by the engineers on the Flow team, thank you. If you appreciate Prettier and would like to support our work, please consider sponsoring us directly via our OpenCollective or by sponsoring the projects we depend on, such as typescript-eslint, remark, and Babel. Thank you for your continued support! Highlights​ Flow​ declare namespace printing support (#16066 by @SamChou19815)​ // Inputdeclare namespace foo { declare var bar: string;}// Prettier 3.2// does not parse// Prettier 3.3declare namespace foo { declare var bar: string;} Component syntax printing support (#16191 by @SamChou19815)​ // Inputcomponent MyComponent(a: string, b: number) renders SomeComponent { return <OtherComponent />;}hook useMyHook(a: string) { return useState(a);}// Prettier 3.2// does not parse// Prettier 3.3component MyComponent(a: string, b: number) renders SomeComponent { return <OtherComponent />;}hook useMyHook(a: string) { return useState(a);} Support big int Enums (#16268 by @gkz)​ Adds support for big int Flow Enums. // Inputenum E { A = 0n, B = 1n,}// Prettier 3.2// error// Prettier 3.3enum E { A = 0n, B = 1n,} Support inexact tuple types (#16271 by @gkz)​ Adds support for Flow's inexact tuple types. // Inputtype T = [number, ...];// Prettier 3.2type T = [number];// Prettier 3.3type T = [number, ...]; Support 'implies' type guard variant (#16272 by @gkz)​ Adds support for Flow's implies type guard variant. Also updates the flow-parser dependency. // Inputdeclare function f(x: mixed): implies x is T;// Prettier 3.2// error// Prettier 3.3declare function f(x: mixed): implies x is T; Other Changes​ JavaScript​ Unquote keys in import attributes (#15888 by @sosukesuzuki)​ // Inputimport json from "./mod.json" with { "type": "json" };// Prettier 3.2import json from "./mod.json" with { "type": "json" };// Prettier 3.3import json from "./mod.json" with { type: "json" }; Fix unstable object print (#16058 by @fisker)​ // Inputa = {"\a": 1, "b": 2}// Prettier 3.2 (--quote-props consistent)a = { "a": 1, "b": 2 };// Prettier 3.2 (--quote-props as-needed)a = { "a": 1, b: 2 };// Prettier 3.3a = { a: 1, b: 2 }; Format embedded GQL in template literal statements (#16064 by @keithlayne)​ // Input/* GraphQL */ ` query foo { id }`;// Prettier 3.2/* GraphQL */ ` query foo { id }`;// Prettier 3.3/* GraphQL */ ` query foo { id }`; Improve formatting of React useImperativeHandle hook (#16070 by @Jaswanth-Sriram-Veturi)​ // InputuseImperativeHandle(ref, () => { /* Function body */}, []);// Prettier 3.2useImperativeHandle( ref, () => { /* Function body */ }, [],);// Prettier 3.3useImperativeHandle(ref, () => { /* Function body */}, []); Allow linebreaks in member expressions in template interpolations (#16116 by @bakkot)​ When there is already a linebreak in a template interpolation, allow it to stay there even if it is a member expression. Note that (as of #15209) Prettier will not insert a linebreak inside an interpolation when one is not already present. // Input`template with ${ very.very.very.very.very.very.very.very.very.very.very.long.chain}`;// Prettier 3.2`template with ${very.very.very.very.very.very.very.very.very.very.very.long.chain}`;// Prettier 3.3`template with ${ very.very.very.very.very.very.very.very.very.very.very.long.chain}`; Fix dynamic import when the module source is a template string (#16267 by @fisker)​ // Inputconst module = await import(`data:text/javascript, console.log("RUN");`);// Prettier 3.2const module = await (`data:text/javascript, console.log("RUN");`);// Prettier 3.3const module = await import(`data:text/javascript, console.log("RUN");`); TypeScript​ Add missing parentheses to TSInferType (#16031 by @fisker)​ // Inputtype Foo<T> = T extends (infer U extends number) | { a: infer U extends number } ? U : never;// Prettier 3.2type Foo<T> = T extends infer U extends number | { a: infer U extends number } ? U : never;// Prettier 3.3type Foo<T> = T extends (infer U extends number) | { a: infer U extends number } ? U : never; Throw errors for duplicated accessibility modifiers (#16040 by @fisker, @auvred)​ // Inputclass Foo { public public bar() {};}// Prettier 3.2class Foo { public bar() {}}// Prettier 3.3SyntaxError: Accessibility modifier already seen. (2:10) 1 | class Foo {> 2 | public public bar() {}; | ^^^^^^ 3 | } Respect --no-semi for readonly class field (#16133 by @sxzz)​ // Inputclass A { field readonly [expr] = true}// Prettier 3.2class A { field; readonly [expr] = true}// Prettier 3.3class A { field readonly [expr] = true} Add necessary parentheses to yield expressions (#16194 by @kirkwaiblinger)​ Add parentheses around yield expressions if parent is an angle-bracket type assertion. // Inputfunction* g() { const y = <T>(yield x);}// Prettier 3.2function* g() { const y = <T>yield x;}// Prettier 3.3function* g() { const y = <T>(yield x);} Markdown​ Improve wrapping for code block in markdown and jsx in mdx (#15993 by @seiyab)​ <!-- Input -->```cssimg { filter: drop-shadow(2px 2px 0 hsl(300deg 100% 50%)) drop-shadow( -2px -2px 0 hsl(210deg 100% 50%)) drop-shadow(2px 2px 0 hsl(120deg 100% 50%)) drop-shadow( -2px -2px 0 hsl(30deg 100% 50%) );}```<!-- Prettier 3.2 -->```cssimg { filter: drop-shadow(2px 2px 0 hsl(300deg 100% 50%)) drop-shadow( -2px -2px 0 hsl(210deg 100% 50%) ) drop-shadow(2px 2px 0 hsl(120deg 100% 50%)) drop-shadow( -2px -2px 0 hsl(30deg 100% 50%) );}```<!-- Prettier 3.3 -->```cssimg { filter: drop-shadow(2px 2px 0 hsl(300deg 100% 50%)) drop-shadow(-2px -2px 0 hsl(210deg 100% 50%)) drop-shadow(2px 2px 0 hsl(120deg 100% 50%)) drop-shadow(-2px -2px 0 hsl(30deg 100% 50%));}``` <!-- Input --><ExternalLink href="http://example.com">Prettier</ExternalLink> is an opinionated-code-formatter-that-support-many-languages-and-integrate-with-most-editors<!-- Prettier 3.2 --><ExternalLink href="http://example.com">Prettier</ExternalLink> is an opinionated-code-formatter-that-support-many-languages-and-integrate-with-most-editors<!-- Prettier 3.3 --><ExternalLink href="http://example.com">Prettier</ExternalLink> is anopinionated-code-formatter-that-support-many-languages-and-integrate-with-most-editors Add newline between markdown footnote definitions (#16063 by @Atema)​ <!-- Input -->[^a]: Footnote A[^b]: Footnote B<!-- Prettier 3.2 -->[^a]: Footnote A[^b]: Footnote B<!-- Prettier 3.3 -->[^a]: Footnote A[^b]: Footnote B Improve wrapping for markdown / mdx (#16158 by @seiyab)​ { "proseWrap": "always" } <!-- Input -->\word very-very-very-very-very-very-very-very-very-very-long-word very-very-very-very-very-very-very-very-very-very-long-word<!-- Prettier 3.2 -->\word very-very-very-very-very-very-very-very-very-very-long-word very-very-very-very-very-very-very-very-very-very-long-word<!-- Prettier 3.3 -->\word very-very-very-very-very-very-very-very-very-very-long-wordvery-very-very-very-very-very-very-very-very-very-long-word API​ Add support for package.yaml config (#16157 by @danielbayley)​ Enable support for reading prettier configuration from package.yaml. # package.yamlprettier: semi: false singleQuote: trueEdit this page'''
