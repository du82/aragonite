["https://priceonomics.com/how-has-cryptocurrency-mining-influenced-gpu-prices"]
title = "How Much Did Cryptocurrency Mining Inflate GPU Prices? - Priceonomics"
description = "In 2018 I set up a mining rig with dual Radeon RX 470 GPUs. I was frustrated with how much they cost. The 470 was expensive and outdated."
full_description = 'How Much Did Cryptocurrency Mining Inflate GPU Prices? Team Recurrency <img fetchpriority="high" decoding="async" class="alignright wp-image-8596 size-medium" src="https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/IMG_20130430_185928-225x300.jpg?strip=all&lossy=1&ssl=1" alt="Radeon HD 5870 BTC mining rig" width="225" height="300" srcset="https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/IMG_20130430_185928-225x300.jpg?strip=all&amp;lossy=1&amp;ssl=1 225w, https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/IMG_20130430_185928.jpg?strip=all&amp;lossy=1&amp;ssl=1 649w, https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/IMG_20130430_185928.jpg?strip=all&amp;lossy=1&amp;w=129&amp;ssl=1 129w, https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/IMG_20130430_185928.jpg?strip=all&amp;lossy=1&amp;w=389&amp;ssl=1 389w, https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/IMG_20130430_185928.jpg?strip=all&amp;lossy=1&amp;w=519&amp;ssl=1 519w" sizes="(max-width: 225px) 100vw, 225px" data-eio="l" /> I started mining Bitcoin (BTC) in 2013 using a set of dual ATI Radeon HD 5870 graphics cards (GPUs) stuffed in an old desktop chassis and hidden away in my basement. The rig was loud. It used a ton of power and the fans struggled to keep up with GPU cooling needs. I removed the side panel of the case and pointed a box fan at the rig to ease the inferno. In 2013, I earned $4/day in BTC and spent $2/day on electricity. Not bad for passive income, but mining BTC was far from passive. The rig needed more attention than my 2-year-old daughter. Crashes were near-constant. A mild brownout, internet hiccup, or sideways glance would freeze things up and require a reboot. After just a couple of months, I parted out the mining rig and sold the GPUs for a nice profit. Radeon HD 5870s were going for above-market prices because BTC had risen to $250 making mining more profitable and GPUs harder to find. Even in 2013, the GPU supply chain had trouble keeping up with spiking demand from cryptocurrency mining. ASICs Disrupt the Market Late in 2013, mining saw a massive disruption with the appearance of chips that were custom-built to do only one thing, mine BTC. Unlike CPUs or GPUs, ASICs were only designed to mine cryptocurrencies. ASICs were vastly superior to GPUs in that they used less power and produced exponentially higher hash rates, which determined mining speed and profitability. I used the profit from my GPU sale to drop $200 on a Butterfly Labs Jalapeño ASIC miner. Then I waited. And waited…and waited some more. If I had received the ASIC when I placed the order, hash rates dictated I would have earned 10+ BTC per day. However, ASIC manufacturers were new to the business. They didn’t have a solid understanding of freight management, ship times, or distribution. Today’s distributors use enterprise resource planning (ERP) software to manage the complex dance of getting an item manufactured in China to my house in Atlanta. But Butterfly Labs had no such software. <img decoding="async" class="alignnone wp-image-8597" src="https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/IMG_0312-300x225.jpg?strip=all&lossy=1&ssl=1" alt="Jalapeño miner" width="350" height="263" srcset="https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/IMG_0312-300x225.jpg?strip=all&amp;lossy=1&amp;ssl=1 300w, https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/IMG_0312-1024x768.jpg?strip=all&amp;lossy=1&amp;ssl=1 1024w, https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/IMG_0312-768x576.jpg?strip=all&amp;lossy=1&amp;ssl=1 768w, https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/IMG_0312.jpg?strip=all&amp;lossy=1&amp;ssl=1 1153w, https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/IMG_0312.jpg?strip=all&amp;lossy=1&amp;w=230&amp;ssl=1 230w, https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/IMG_0312.jpg?strip=all&amp;lossy=1&amp;w=461&amp;ssl=1 461w, https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/IMG_0312.jpg?strip=all&amp;lossy=1&amp;w=691&amp;ssl=1 691w, https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/IMG_0312.jpg?strip=all&amp;lossy=1&amp;w=922&amp;ssl=1 922w" sizes="(max-width: 350px) 100vw, 350px" data-eio="l" /> <img decoding="async" class="alignnone wp-image-8598" src="https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/13-1-300x225.jpg?strip=all&lossy=1&ssl=1" alt="Jalapeño miner naked" width="350" height="263" srcset="https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/13-1-300x225.jpg?strip=all&amp;lossy=1&amp;ssl=1 300w, https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/13-1-1024x768.jpg?strip=all&amp;lossy=1&amp;ssl=1 1024w, https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/13-1-768x576.jpg?strip=all&amp;lossy=1&amp;ssl=1 768w, https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/13-1.jpg?strip=all&amp;lossy=1&amp;ssl=1 1153w, https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/13-1.jpg?strip=all&amp;lossy=1&amp;w=230&amp;ssl=1 230w, https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/13-1.jpg?strip=all&amp;lossy=1&amp;w=461&amp;ssl=1 461w, https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/13-1.jpg?strip=all&amp;lossy=1&amp;w=691&amp;ssl=1 691w, https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/13-1.jpg?strip=all&amp;lossy=1&amp;w=922&amp;ssl=1 922w" sizes="(max-width: 350px) 100vw, 350px" data-eio="l" /> I eventually received my Jalapeño miner in late 2013. I was bummed to see that mining competition had spiked with the introduction of ASICs. My little Jalapeño could only eke out 0.02 BTC/day. I removed the cover and used my box fan trick and a slight overclock to snag a couple of extra percentage points. But competition kept climbing. In less than a month, I was earning less than 0.002 BTC/day — $2 at the time. I turned off the Jalapeño and left it to collect dust in the basement. Unlike GPUs, ASICs had little value after their mining lifespan. They couldn’t be used for much else. Ethereum Is Introduced <img decoding="async" class="alignright wp-image-8599 size-medium" src="https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/IMG_20170811_162246-300x225.jpg?strip=all&lossy=1&ssl=1" alt="Mining Ethereum" width="300" height="225" srcset="https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/IMG_20170811_162246-300x225.jpg?strip=all&amp;lossy=1&amp;ssl=1 300w, https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/IMG_20170811_162246-1024x768.jpg?strip=all&amp;lossy=1&amp;ssl=1 1024w, https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/IMG_20170811_162246-768x576.jpg?strip=all&amp;lossy=1&amp;ssl=1 768w, https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/IMG_20170811_162246.jpg?strip=all&amp;lossy=1&amp;ssl=1 1153w, https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/IMG_20170811_162246.jpg?strip=all&amp;lossy=1&amp;w=230&amp;ssl=1 230w, https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/IMG_20170811_162246.jpg?strip=all&amp;lossy=1&amp;w=461&amp;ssl=1 461w, https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/IMG_20170811_162246.jpg?strip=all&amp;lossy=1&amp;w=691&amp;ssl=1 691w, https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/IMG_20170811_162246.jpg?strip=all&amp;lossy=1&amp;w=922&amp;ssl=1 922w" sizes="(max-width: 300px) 100vw, 300px" data-eio="l" />I gave up on mining until I heard about a new cryptocurrency, called Ethereum (ETH), from my Facebook crypto group. Unlike BTC, Ethereum used a hashing algorithm known as SHA3, which was supposed to be ASIC-proof. Mining with GPUs made sense again. I set up a new rig with dual Radeon RX 470 GPUs. But I was frustrated with how much I had to pay. The 470 was a mid-range GPU and was already somewhat outdated in 2018. The GPU demand cycle had begun again and I was behind the curve. Nevertheless, I set up my RX 470 GPUs with a base model Dell and started mining. The Dell didn’t have space for two GPUs so I used a PCIe extender that enabled me to have enough space for both cards. However, this setup meant one of the RX 470s was hanging precariously out of the case. Coincidentally, the perpetually rappelling GPU maintained a lower core temp because it was hanging outside of the case. Happy accidents. Profitability Declines Again The decline in Ethereum profitability has been slower. ASICs have never quite taken over the GPU market. But a 2019 “crypto winter” saw profits shrink with the value of ETH. I no longer had a basement to spare, so my mining rig lived in the corner of my bedroom. My wife was not happy with this arrangement. I soon parted with my Dell and sold the GPUs, but this time for a loss. The Cycle Continues In late 2021, crypto winter was breaking. Prices of BTC and ETH returned to all-time highs and kept climbing. Global adoption of cryptocurrencies had grown. But a chip shortage, fueled by the pandemic, meant the supply of GPUs did not grow with mining demand. Prices on second-hand markets like eBay exploded since no one could find a new GPU in stores. According to a report from JPR, crypto miners bought 25% of all GPUs produced in the first half of 2021. Tom’s Hardware scrapped eBay to highlight how crypto-induced demand and pandemic-reduced supply combined for a perfect storm of GPU prices. <img decoding="async" class="aligncenter size-full wp-image-23931" src="https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/image2-13.jpg?strip=all&lossy=1&ssl=1" alt="Prices from Toms Hardware" width="867" height="600" srcset="https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/image2-13.jpg?strip=all&amp;lossy=1&amp;ssl=1 867w, https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/image2-13-300x208.jpg?strip=all&amp;lossy=1&amp;ssl=1 300w, https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/image2-13-768x531.jpg?strip=all&amp;lossy=1&amp;ssl=1 768w, https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/image2-13.jpg?strip=all&amp;lossy=1&amp;w=173&amp;ssl=1 173w, https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/image2-13.jpg?strip=all&amp;lossy=1&amp;w=520&amp;ssl=1 520w, https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/image2-13.jpg?strip=all&amp;lossy=1&amp;w=693&amp;ssl=1 693w" sizes="(max-width: 640px) 100vw, 640px" data-eio="l" /> There was a clear increase in auction prices in February 2021. Limited supply meant fewer GPUs were being sold, and the ones that did hit the market were going 3X over retail. After all, why would someone sell their RTX 3090 when they could use it to mine themselves and make a hefty return? A Year Before Prices Begin to Stabilize After a rough year for GPU purchasers, we are beginning to see light at the end of the tunnel. Crypto prices are off from their all-time highs. And Nvidia and AMD are finally beginning to ship more GPUs. It is still near impossible to find them in stores, but GPU prices on eBay are falling. <img decoding="async" class="aligncenter wp-image-23929 size-full" src="https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/chart-12-e1648042016945.png?strip=all&lossy=1&ssl=1" alt="" width="691" height="427" srcset="https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/chart-12-e1648042016945.png?strip=all&amp;lossy=1&amp;ssl=1 691w, https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/chart-12-e1648042016945-300x185.png?strip=all&amp;lossy=1&amp;ssl=1 300w, https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/chart-12-e1648042016945.png?strip=all&amp;lossy=1&amp;w=138&amp;ssl=1 138w, https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/chart-12-e1648042016945.png?strip=all&amp;lossy=1&amp;w=414&amp;ssl=1 414w, https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/chart-12-e1648042016945.png?strip=all&amp;lossy=1&amp;w=552&amp;ssl=1 552w" sizes="(max-width: 640px) 100vw, 640px" data-eio="l" /> Will Proof-of-Stake Break the Cycle? Along with increasing supply, and slowing mining demand, there is a dark horse affecting GPU prices today: proof-of-stake. BTC, ETH, and most other cryptocurrencies have historically relied on a proof-of-work model for maintaining blockchain decentralization and security. Essentially, rewards are distributed to miners based on how much hash rate, or processing work, they contribute. (This is a simplistic explanation. For more details on mining, watch this.) Proof-of-stake upends this traditional model and distributes rewards to someone who “stakes” existing ETH. So, on average, you earn more by staking more ETH, and not by contributing more work in the form of algorithmic hashes. We don’t know exactly when the ETH blockchain will fully transition to proof-of-stake. But the general consensus is the end of 2022. At that time, hundreds of thousands of miners will no longer be able to mine ETH with their GPUs. Some may switch to other cryptocurrencies, but many will offload their GPUs on reseller markets. I predict we see drastically reduced GPU prices. Some miners may choose to get out ahead of this transition and sell their GPUs before the market is disrupted. So we will likely see continued declines throughout 2022. But, who knows? Another cryptocurrency using proof-of-work may explode on the market and begin the cycle all over again. I know my old Dell case is ready to get back in the game. This article was written by Priceonomics partner Recurrency, and originally published to their blog. Published March 22, 2022 by Team Recurrency'
