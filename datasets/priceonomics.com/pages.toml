["https://priceonomics.com/most-and-least-affordable-places-to-buy-a-home"]
title = "Most and Least Affordable Places to Buy a Home - Priceonomics"
description = "How much of a house's purchase price will the typical annual salary cover in cities across America."
full_description = 'Most and Least Affordable Places to Buy a Home Team Recurrency <img fetchpriority="high" decoding="async" src="https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/The-Most-and-Least-Affordable-Places-to-Buy-a-Home-in-America-refi-site.jpg?strip=all&lossy=1&resize=640%2C170&ssl=1" alt="a screenshot of a video game" width="905" height="241" data-eio="l" /> This post is from RefiGuide.org, a Priceonomics Data Studio customer. Does your company have interesting data? Become a Priceonomics customer. *** The Coronavirus pandemic has upended the real estate market so far in unexpected and varied ways. Record low mortgage interest rates combined with people spending most of their time at home has caused a boom in home buying many housing markets despite widespread unemployment. Not only that, but people are moving and considering new locations. Office closures mean that many people are working from home and some employers have suggested this may be a permanent trend. All these trends are conspiring together to cause people to consider moving to new places across America. Along with Priceonomics customer RefiGuide.org, we decided to perform an analysis for people looking to buy a home based on affordability. If you are tired of living in a place where homeownership is out of reach because of high prices compared to incomes, where else should you consider living? We found that the most affordable housing markets in America were uniformly located in the South and Midwest. The most affordable place we looked at in America was Youngstown, Ohio where the median household income in one year is more than the typical purchase price of a home. On the other hand, almost all the least affordable places to buy a home were in California. Of all the markets we examined, Newport Beach was the least affordable market in the country. *** Before diving into the results, it’s worth spending a moment on the methodology and data. In this analysis, we are primarily interested in affordability of housing in an area. To do so, we compared two metrics – income and the cost of a house. How far will the prevailing median household income go toward the purchase price of a home in the city. All income data is derived from the US Census 2018 data and housing data from Zillow’s June 30, 2020 market estimates. We looked at the 609 largest “places” (a designation in the US Census for cities and towns) in America. Below are the top 50 most affordable places in America. To calculate the affordability we took median annual income as percentage of home prices in the area. <img decoding="async" src="https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/image3-50.png?strip=all&lossy=1&resize=640%2C623&ssl=1" alt="table" width="1200" height="1168" data-eio="l" /> Chart via RefiGuide.org The most affordable place in America is Youngstown, Ohio, followed by Jackson, Mississippi. In both places, the median household income is higher than the purchase price of a house! Every single city on the most affordable list is located in the South or Midwest. Of the 609 places in America, only 50 places have an affordability score over 36%. The vast majority of places in America are much less affordable. Next, let’s look at the least affordable housing markets in America. The following chart shows the places where the local income does not go particularly far toward a home purchase: <img decoding="async" src="https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/the-least-affordable-places-to-buy-a-home-in-america_2020-08-20T15_17_05.060Z.png?strip=all&lossy=1&resize=640%2C596&ssl=1" alt="table" width="1200" height="1118" data-eio="l" /> Chart via RefiGuide.org The least affordable place in America is Newport Beach, California, followed by Santa Monica, California. In these places, the typical annual income covers just 5.3% of a home’s purchase price. In fact 24 out of the top 25 places on the least affordability list are located in California. A few cities in New York, Colorado, Hawaii and Florida also make the list that’s generally dominated by California. From the two above charts, it seems clear that there is a geographic pattern in affordability. Next, let’s look at the average affordability of all the places in a given state taken together. <img decoding="async" src="https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/image2-45.png?strip=all&lossy=1&resize=640%2C524&ssl=1" alt="table" width="1200" height="982" data-eio="l" /> Chart via RefiGuide.org The most affordable state in America for homebuyers is Mississippi, followed by Ohio and Oklahoma. Each of the top 12 most affordable states are in the South and Midwest. The least affordable states are Hawaii, Washington DC, and California. The least affordable places are all in the West and East of the country. Lastly, let’s look at the 50 largest housing markets according to Zillow. These places tend to have the most job opportunities and largest economies, which can be a major factor in the long term affordability of a city, even in the area of remote work. <img decoding="async" src="https://etzq49yfnmd.exactdn.com/wp-content/uploads/2022/03/affordability-ranking-of-top-50-largest-housing-markets_2020-08-20T15_09_55.058Z.png?strip=all&lossy=1&resize=640%2C625&ssl=1" alt="table" width="1200" height="1171" data-eio="l" /> Chart via RefiGuide.org Of the largest 50 housing markets in America, Detroit, Michigan is the most affordable where a household’s salary covers 83.4% of the home’s purchase price. Each of the top 5 cities are in the South or Midwest. San Francisco is the least affordable major city in the country, followed by Los Angeles and Oakland. The top 6 of the top 10 cities are in California with New York, Honolulu, Boston and Miami also making the least affordable major cities list. *** Housing affordability has long been a hot button issue in America. Over the last decade housing prices have increased at a tremendous rate and made homeownership beyond the reach of many Americans. A couple of different forces are affecting the housing market as a result of the pandemic. On one hand many people are laid off, meaning many people in the economy are housing insecure. On the other hand, many Americans are using the pandemic to reassess where they want to live. To assist those that are considering a move, below is a data sheet for the housing prices, median income, and affordability rate of over 600 places in America. *** Note: If you’re a company that wants to work with Priceonomics to turn your data into great stories, learn more about the Priceonomics Data Studio. Published August 20, 2020 by Team Recurrency'
