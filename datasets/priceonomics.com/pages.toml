full_description = "Priceonomics turns data into great stories. We’re a collection of writers, data scientists, engineers and analysts that are obsessed with creating and spreading quality, data-driven information. We’re based in San Francisco, CA and funded by great investors like Y Combinator, Spark Capital, SV Angel and more. We make money by helping companies turn their data into content marketing that performs. We help companies come up with interesting topics, analyze their data, and turn the insights into great content marketing that spreads. It works! You can frequently see some of our work from the Priceonomics Data Studio showcased on Priceonomics. Our approach uses a key piece of software we created called Content Tracker, a content measurement dashboard, that we encourage you to use at your company. You can learn more about the “Priceonomics way” of doing content marketing by reading The Content Marketing Handbook, our 30,000+ word blog post about the topic. CEO, FounderRides a bike and drinks coffee. Previously, co-founder of Personforce, a network of tech job sites that reaches 80 million users. MBA from Stanford and BA from Dartmouth. Dad of two kids. SalesSusan has a BA in information and communication studies from the University of New Brunswick, and lots of experience in the startup world. She handles our outbound sales and customer service. In her free time she enjoys video games and coding in python. CTOBrendan is in charge of engineering and data crawling at Priceonomics. Previously he was at Salesforce / Radian6. Brendan trained as a mechatronics engineer and he hails from the east coast of Canada. BS and MS in Mechanical Engineering from the University of New Brunswick. Lead Systems EngineerA huge fan of *nix operating systems and FOSS, he also brews beer and loves to travel. Originally from Israel, he’s previously worked for the IDF and a local ISP as well as an ERP developer. He has a B.Sc. C.S. (Networking) from the University of New Brunswick."
