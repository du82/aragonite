title = "Privacy policy"
full_description = ".model_embed > div > div { height: 90vh !important; } Privacy PolicyUpdatedFebruary 23, 2024We at PrimeIntellect, Inc. (“PrimeIntellect”, “us”, “we”, or “our”)”) endeavor to respect your privacy. This Privacy Policy (“Policy”) is designed to help you understand how we collect, use, safeguard, share, and disclose your personal information in connection with our products and services. It also explains your rights and choices with respect to your personal information. This Policy applies when you interact or make a purchase through our websites located at primeintellect.ai, and any other websites, pages, features or content we own or operate (collectively, the “Site(s)”); when, as a subscriber to our GPU Cloud, you use our Cloud available through the online platform at primeintellect.ai/app/signin (the “Platform”); or other products or services that direct you to this Policy (collectively, including the Sites and the Cloud, the “Service(s)”). Please read this entire Policy to make sure that you fully understand it. By using our Services, you agree to the collection, use and disclosure of your personal information in accordance with this Policy, and you agree to the accompanying Terms of Service(“Terms”). Our Terms govern all use of our Services, and together with the Privacy Policy and any other terms provided, constitute your agreement with us. If you do not agree with or you are not comfortable with any part of this Policy or the Terms, please immediately discontinue access or use of our Services. In providing our Services to subscribers of our Cloud and Colocation plans, or purchasers of our hardware (“Clients”), PrimeIntellect is a data processor as we process personal information on behalf and at the direction of the Clients. This Policy does not apply to Prime's processing when we are a data processor. If you have submitted personal information to a Client that is processed by us, you should directly contact that Client for assistance with any requests or questions relating to the processing of your personal information. We may change this Policy from time to time at our sole discretion. We encourage you to frequently check this page for any changes to this Policy. Your continued use of our Services after any change in this Policy will constitute your acceptance of such change. If we change this Policy in a way that we believe materially affects how we process your personal information or reduce your rights, we will provide you with advance notice via email or by posting a prominent notice on our Sites.1. Personal InformationPrimeIntellect collects certain personal information about you and your use of our Services. The definition of personal information (used interchangeably with “personal data” for European residents) depends on the applicable law based on your physical location. Only the definition that applies to your physical location will apply to you under this Policy. For purpose of this Policy, personal information does not include data that has been anonymized or aggregated so that it can no longer enable us, whether alone or in combination with other information, to identify you. From time to time, PrimeIntellect may release aggregated information by publishing a report on trends or usage on our Sites. The personal information that PrimeIntellect collects falls into three primary categories: (1) information you voluntarily provide to us, (2) information we collect from you automatically, and (3) information we collect from third parties. Information You Voluntarily Provide to Us. We, or service providers that assist us in providing, maintaining, and operating our Services, may collect the following types of personal information from you:Web Forms. We may collect your first and last name, email, company name, and phone number when you request demos, request a quote, apply for a discount, or would like to get in touch with us for other matters. Personal information that you provide by email or web forms will be used only for such purposes as are described at the point of collection (for example on a web form), such as to send information to you or respond to your questions or comments. If you provide contact information, we may contact you to clarify your comment or question, or to learn about your level of interest in, or satisfaction with our services.Order Information. When you place an order on our Site, we may collect information relating to the orders, such as, your full name, billing address, shipping address, payment information (including credit card numbers), email address, and phone number.Registration and Account Information. When you register to use our GPU Cloud, to participate in a PrimeIntellect Forum, or any other type of PrimeIntellect account we will ask you to create an account and may collect your email address, first name, last name, phone number, and company affiliation.Customer Service. When you engage with our support team via online chat box, phone, or email, we may collect records, copies of your correspondence (including email addresses), and any additional information you choose to share with us.Blog and Forums. We offer publicly accessible blogs and community forums. Please be aware that any information you provide in these areas may be read, collected, and used by others who access them, including your username and/or the social media handle you opt to log in with when leaving a comment.Career Information. If you apply for a position at PrimeIntellect, we may collect your professional and education information such as your resume/CV, education and training experience, schools/universities attended, academic grades, degrees obtained, expected start date, physical location, and/or professional certification and licenses.Information We Automatically Collect. To the extent permitted under the applicable law, we may collect certain types of information automatically, such as whenever you interact with the Sites or use the Services. We may collect the following types of information automatically from you:Usage Data. When you browse our Sites, we automatically collect log data such as your web request, Internet Protocol (“IP”) address, browser type, domain names, referring and exit pages and URLs, pages viewed and the order of these page views, the date and time you access our servers, and other diagnostic data.Location Information. When you use our Services, we may infer the generic physical location of your device and the geographic regions you come from. For example, your IP address may indicate your general geographic region. For instructions on changing the relevant settings, please contact your service provider or device manufacturer.2. Cookies and Other Tracking TechnologiesWe, and third parties on our behalf, use cookies, web beacons, and similar tracking technologies (collectively, “Tracking Technologies”) to collect personal information automatically as you interact with our Sites, to help us customize your experience and better manage content on our Sites, including to:Analyze our web traffic using an analytics packageIdentify whether you already visited our SitesStore information about your preferencesRecognize when you return to our Sites‍Cookies.When you visit our Sites or otherwise interact with our Services, we (or third-party data or ad networks we work with) may send one or more “cookies” to your computer or other devices. Cookies are alphanumeric identifiers stored on your computer through your web browser and are used by most websites to help personalize your web experience. Some cookies may facilitate additional site features for enhanced performance and functionality such as remembering preferences, allowing social interactions, analyzing usage for site optimization, providing custom content, allowing third parties to provide social sharing tools, and serving images or videos from third-party websites. Some features on the Sites will not function if you do not allow cookies. The following types of cookies may be used on our Sites:Essential Cookies. These cookies are essential because they enable you to use our Sites as you reasonably expect. For example, strictly necessary cookies allow you to access secure areas on our Sites and provide necessary security functions. Without these cookies, some Site features cannot be provided. This category of cookies is essential for our Sites to work and they cannot be disabled.Marketing Cookies. These cookies may be set through our Sites by our marketing partners. Personal information may be collected by these companies that enable them to serve up advertisements on other sites that are relevant to your interests.Personalization Cookies. We use functional cookies to remember your choices so that we may tailor our Sites to provide you with enhanced features and personalized content. While these cookies can be disabled, this may result in less functionality during your use of our Sites.Analytics Cookies. These cookies allow us to collect passive information about your use of our Sites, for example, count page visits and traffic sources so we can measure and improve the performance of our Sites and our marketing campaigns.‍Managing Cookies. You have the right to decide whether to accept cookies. If you do not want us to deploy cookies in your browser, you may exercise your preference by modifying your web browser setting to either (1) refuse some or all cookies or (2) notify you and ask for your permission when a website tries to set a cookie. If you choose to disable cookies in your browser, you can still use our Sites, although your ability to use some of the features may be affected. If you want to exercise your rights regarding personal information collected via cookies and similar tracking technologies, please see the Your Rights and Choices section below.Analytics. We use Google Analytics, which uses cookies and other similar tracking technologies to collect and analyze information about your use of our Sites and report on activities and trends. This service may also collect information regarding your use of other websites, apps and online resources. You consent to the processing of data by these analytics providers in the manner and for the purposes set out in this Privacy Notice.3. How We use Your InformationWe use your personal information as described in this Policy for business and commercial purposes, or as disclosed to you prior to such processing taking place. We may process your personal information:To Provide Prime's Services. We will use your personal information to provide information, perform Services that you request, including managing your request as a visitor, purchaser or subscriber to our products and services. For example, when you order products from us, we require your shipping information to deliver your order, and we require payment information to process your order. We will not be able to provide you with Service without such information. Third parties such as payment processing companies and courier services may also access and/or collect your personal information when assisting us to fulfill your order. We work diligently with such third parties to protect your information.To Maintain Legal and Regulatory Compliance. Our Services are subject to certain laws and regulations which may require us to process your personal information. For example, we process your personal information to fulfill our business obligations, ensure compliance with employment and recruitment laws, to manage risk as required under applicable laws and regulations, or to respond to requests by judicial process or governmental agency.To Enforce Compliance with Our Terms, Agreements and Policies. When you access or use our Services, you are bound to our Terms. We may process your personal information for compliance purposes, such as carrying out our obligations and enforcing our Terms or other legal rights, including those arising from any contracts entered into between you and us, including for billing and collection.Analytics Cookies. These cookies allow us to collect passive information about your use of our Sites, for example, count page visits and traffic sources so we can measure and improve the performance of our Sites and our marketing campaigns.To Provide Customer Support or Respond to You. We collect any information that you provide to us when you contact us and send us an inquiry Without your personal information, we cannot respond to you or ensure your continued use and satisfaction of the Services. If you send us a request (for example via a support email or via one of our feedback mechanisms), we reserve the right to publish it in order to help us clarify or respond to your request or to help us support other users.To Provide You with Service-Related Communications. We will send you administrative or account-related information to keep you updated about your account and the Services. Such communications may include information about Privacy Policy updates, security updates, tips or other relevant transaction-related information. Service-related communications are not promotional in nature. You are not able to unsubscribe from such communications, otherwise you may miss important developments relating to your account or the Services.To Provide Marketing Communication. We may occasionally send you an email to tell you about new features, solicit your feedback, or just keep you up to date with what's going on with PrimeIntellect and our products. When you no longer wish to receive these marketing messages from us, you can opt out at any time by unsubscribing or following the instructions contained within such messages.To Research and Develop Our Services. We may process your personal information and derive analytical and statistical data to better understand the way you use and interact with our Services. For instance, analyzing where, on which types of devices and how our Site is used, how many visitors we receive, and where they click on the Site may help us improve our existing Services and to build new Services. Please see our Cookies and Other Similar Tracking Technologies section for more information.To Personalize Your Experience. We may process your information to personalize your experience. By personalization, we enable you to more easily interact with our Services across platforms and devices.To Facilitate Corporate Acquisitions, Mergers and Transactions. We may process any information regarding your account and your use of our Services as is necessary in the context of corporate acquisitions, mergers or other corporate transactions.With Your Consent. For any other purpose disclosed to you prior to you providing us your personal information or which is reasonably necessary to provide the services or other related services requested, with your permission or upon your direction.4. Why We Share Your InformationWe share your personal information as needed to fulfill the purposes described in this Poli"
