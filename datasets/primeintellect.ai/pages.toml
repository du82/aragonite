["https://primeintellect.ai/blog/intellect-math"]
title = "Decentralized Training in the Inference-Time-Compute Paradigm"
description = "Prime Intellect is building a peer-to-peer protocol for compute and intelligence, enabling collective creation, ownership, and access to sovereign open-source AI. We’re moving beyond centralized AI to empower anyone—from solo GPU operators to global datacenters—to contribute compute, code, or capital and shape the open and decentralized AI ecosystem."
full_description = '''.model_embed > div > div { height: 90vh !important; } H2 Essay TitleAuthorsJustusJohannes AnnouncementsJanuary 21, 2025Decentralized Training in the Inference-Time-Compute ParadigmWe have started working on LLM reasoning and have a few updates to share:Research preview: By fine-tuning on synthetic reasoning traces, we can provide better policy initializations for online reinforcement learning. We use this insight to train INTELLECT-MATH, a state-of-the-art model for mathematical reasoning (prior to the release of Deepseek-R1) in the 7B parameter regime that reduces the training time required to match the existing state-of-the-art by 10x. Additionally, we release NuminaMath-QwQ-CoT-5M, a dataset containing five million reasoning traces across 860k mathematics questions verified for correctness. All of our code as well as weights and data are open source.An Outlook on Decentralized Training in the Inference-Compute Paradigm: Huge amounts of forward passes during reinforcement learning will result in lower communication requirements and fundamentally shift compute infrastructure requirements, making globally distributed training the path forward. We explain why and share our research plans for the coming months.We are hiring: This year, we will train a fully open reproduction of o3, enabling everyone globally to contribute compute resources permissionlessly. If you want to be part of this, join our research team.Research Preview: 10x Faster Training for State-of-the-Art Mathematical ReasoningOpenAI’s o1 and o3 represent a major shift in how language models are trained and used - by spending more time thinking about problems during inference, they can better handle complex tasks like solving math problems or writing code.Reasoning models like these are trained differently compared to traditional chat models: Given a set of problems, they generate candidate solutions that are assigned rewards based on the solutions’ correctness, which allows the models to learn from their own answers and iteratively self-improve without training on human task demonstrations. This iterative process is called online reinforcement learning (RL).PRIME-RL, A recent piece of work from Tsinghua University and UIUC, has introduced an online RL algorithm that leverages rewards from implicit process reward models. Using this approach, the authors trained Eurus-2-7B-PRIME, which (prior to the release of Deepseek-R1) substantially outperformed all other 7B parameter models as well as bigger models like GPT-4o on mathematical reasoning benchmarks.While PRIME-RL and related methods lead to great performance, online reinforcement learning tends to be unstable and quite expensive compared to supervised training: since we have to sample solutions from our model at every training step, the whole training process takes very long.Better Initializations with Synthetic Reasoning DataThe online RL procedure that led to Eurus-2-7B-PRIME was initialized with Eurus-2-7B-SFT, a model that was fine-tuned on 230k math questions and solutions in a supervised manner. The solutions for this dataset were generated with Llama-3.1-70B-Instruct, with a specific system prompt that asks the model to reason step by step and indicate what action it is currently taking by outputting strings such as “[ASSESS]”, “[ADVANCE]” or “[VERIFY]” as part of its chain of thought.While this system prompt helps generate data that nudges the model towards structured reasoning, it is clearly possible to generate higher-quality SFT data with the help of existing reasoning models and thus train a better SFT model. We hypothesize that this can be very impactful: by starting RL from a better policy that already imitates desired reasoning behaviors such as self-correction, we won’t have to wait for these behaviors to emerge from reinforcement learning alone, and will thus get to better model performance faster.To obtain a synthetic fine-tuning dataset, we used QwQ-32B, the best open reasoning model at the time of writing this article. We started from a set of mathematics questions and responses with ground truth solutions obtained from the NuminaMath dataset and consequently used QwQ to generate responses. The responses were then filtered for correctness (by comparing to the ground truth response) and length (as our base model has a context window of 4096) - no further post-processing was applied.The resulting SFT dataset consisted of 733k questions with corresponding responses. Following the work on Eurus, we fine-tuned the base model Qwen-7B-Math on this dataset and consequently applied PRIME-RL using the exact same setup and RL data as the original work.PerformanceUsing the described methodology, we train INTELLECT-MATH, a model that outperforms Eurus-2-7B-PRIME on several mathematical reasoning benchmarks and is the best 7B parameter model for mathematical reasoning (prior to the release of Deepseek-R1). Furthermore, we show that an earlier checkpoint of the model was able to match the performance of Eurus-2-7B-PRIME with 10x less GPU hours (47 RL steps for INTELLECT-MATH vs. 592 for Eurus-2-PRIME).Compared to Eurus-2-PRIME, INTELLECT-MATH-7B-SFT and INTELLECT-MATH-7B exhibit more typical reasoning behavior that can be seen in models like o1 or Deepseek-R1: they naturally summarize the question at hand, verify their reasoning and “think out loud”, whereas Eurus-2-7B-PRIME has to be specifically instructed to do so in its system prompt. Notably, the main difference between INTELLECT-MATH-7B-SFT and INTELLECT-MATH-7B is that the former is much more verbose and contains too much unnecessary self-questioning, which often leads to it getting stuck in infinite reasoning loops. During reinforcement learning, we saw its response length decrease, which indicates that the RL stage refines the reasoning behavior learned through SFT to avoid pure imitation.Eurus-2-PRIMESystem Prompt When tackling complex reasoning tasks, you have access to the following actions. Use them as needed to progress through your thought process. [ASSESS] [ADVANCE] [VERIFY] [SIMPLIFY] [SYNTHESIZE] [PIVOT] [OUTPUT] You should strictly follow the format below: [ACTION NAME] # Your action step 1 # Your action step 2 # Your action step 3 ... Next action: [NEXT ACTION NAME]UserQuadratic polynomials $P(x)$ and $Q(x)$ have leading coefficients $2$ and $-2,$ respectively. The graphs of both polynomials pass through the two points $(16,54)$ and $(20,53).$ Find $P(0) + Q(0).$Eurus-2-PRIME [ASSESS]We are given two quadratic polynomials $P(x)$ and $Q(x)$ with leading coefficients $2$ and $-2$, respectively. The graphs of both polynomials pass through the points $(16,54)$ and $(20,53)$. We need to find the value of $P(0) + Q(0)$.[ADVANCE]Let's express the quadratic polynomials $P(x)$ and $Q(x)$ in the general form: $ P(x) = 2x^2 + bx + c $ $ Q(x) = -2x^2 + dx + e $Since the graphs of both polynomials pass through the points $(16,54)$ and $(20,53)$, we can substitute these points into the equations of $P(x)$ and $Q(x)$ to form a system of equations.For $P(x)$: $ P(16) = 2(16)^2 + 16b + c = 54 $ $ 512 + 16b + c = 54 $ $ 16b + c = -458 \quad \text{(Equation 1)} $ $ P(20) = 2(20)^2 + 20b + c = 53 $ $ 800 + 20b + c = 53 $ $ 20b + c = -747 \quad \text{(Equation 2)} $For $Q(x)$: $ Q(16) = -2(16)^2 + 16d + e = 54 $ $ -512 + 16d + e = 54 $ $ 16d + e = 566 \quad \text{(Equation 3)} $ $ Q(20) = -2(20)^2 + 20d + e = 53 $ $ -800 + 20d + e = 53 $ $ 20d + e = 853 \quad \text{(Equation 4)} $[ADVANCE]Now, we can solve the system of equations for $P(x)$:Subtract Equation 1 from Equation 2: $ (20b + c) - (16b + c) = -747 - (-458) $ $ 4b = -289 $ $ b = -\frac{289}{4} $Substitute $b = -\frac{289}{4}$ into Equation 1: $ 16\left(-\frac{289}{4}\right) + c = -458 $ $ -1156 + c = -458 $ $ c = 698 $So, for $P(x)$, we have: $ P(x) = 2x^2 - \frac{289}{4}x + 698 $ $ P(0) = 698 $Next, we can solve the system of equations for $Q(x)$:Subtract Equation 3 from Equation 4: $ (20d + e) - (1