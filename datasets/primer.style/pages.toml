["https://primer.style/components"]
title = "Components | Primer"
description = "Design and usage guidelines for individual Primer components."
full_description = "🎉 👀 New look, same Primer! Preview the new docs experience here and let us know what you think.ComponentsDesign and usage guidelines for individual Primer components.Action barAction bar contains a collection of horizontally aligned buttons.Action listAction list is a vertical list of interactive actions or options. It's composed of items presented in a consistent, single-column format, with room for icons, descriptions, side information, and other rich visuals.Action menuAction menu is composed of action list and overlay patterns used for quick actions and selections.Anchored overlayAnchored overlay opens an overlay relative to the anchor position.AutocompleteAutocomplete allows users to quickly filter through a list of options and pick one or more values for a field.AvatarAvatar is an image that represents a user or organization.Avatar pairAvatar pair is composed of two avatars, one larger one and a smaller one, overlaid slightly.Avatar stackAvatar stack displays two or more avatars in an inline stack.BannerBanner is used to highlight important information.BlankslateBlankslate is used as placeholder to tell users why content is missing.Border boxBorder box is a box component with a border.BoxBox is a basic wrapper component for most layout related needs.Branch nameBranch name is a label-type component rendered as an <a> tag by default that displays the name of a branch.BreadcrumbsBreadcrumbs display the current page or context within the site, allowing them to navigate different levels of the hierarchy.ButtonButton is used to initiate actions on a page or form.Button groupButton group renders a series of buttons.CheckboxCheckbox is a form control for single and multiple selections.Checkbox groupCheckbox group renders a set of checkboxes.Circle badgeCircle badge visually connects logos of third-party services, eg. in the marketplace.Circle octiconUse circle octicon to render any Octicon with a circle background. CircleOcticons are most commonly used to represent the status of a pull request in the comment timeline.Clipboard copyClipboard copy copies element text content or input values to the clipboard.Close buttonUse CloseButton to render an × without default button styles.Comment boxComment box allows users to write and preview comments.Counter labelCounter label is a button with a numbered label accompanied by text.Data tableData table is a 2-dimensional data structure where each row is an item, and each column is a data point about the item.DetailsDetails is a styled component to enhance the native behaviors of the <details> element.DialogDialog is a floating surface used to display transient content such as confirmation actions, selection options, and more.Form controlForm control displays a labelled input and, optionally, associated validation text and/or hint text.HeaderHeader is a navigation bar that has all of its items aligned vertically with consistent horizontal spacing.HeadingHeading defines the hierarchical structure and importance of the content they contain.Hidden text expanderHidden text expander indicates and toggles hidden text.IconIcons at GitHub are called Octicons, which are available in various implementations including React, Figma, Rails, and Styled System.Icon buttonIcon button is used for buttons that show an icon in place of a text label.ImageUse image to render images.Inline messageinline message is used to inform the user about the result of an action within the content.LabelUse the label component to add contextual metadata to a design.Label groupUse label group to add commonly used margins and other layout constraints to groups of LabelsLayoutLayout provides foundational patterns for responsive pages.LinkLinks are used to apply styles to hyperlink text.MarkdownUse markdown to wrap markdown content.Nav listNav list renders a vertical list of navigation links.Octicon symbolsOcticonSymbols renders a symbol dictionary using a list of Octicons.OverlayOverlay components codify design patterns related to floating surfaces such as dialogs and menus.Page headerPage header determines the top-level headings of a UI.Page layoutPage layout defines the header, main, pane, and footer areas of a page.PageheadPagehead denotes the title and start of a given section.PaginationPagination is a horizontal set of links to navigate paginated content.Pointer boxA customisable bordered box with a caret pointerPopoverPopover is used to bring attention to specific user interface elements.Progress barProgress bar visualizes one or more parts of a whole.RadioRadio button is a form control for making a single selection from a short list of options.Radio groupRadio group is used to render a short list of mutually exclusive options.Relative timeRelative time displays time in a way that is clear, concise, and accessible.Segmented controlSegmented control is used to pick one choice from a linear set of closely related choices, and immediately apply that selection.SelectSelect is an input for selecting a single option from a menu.Select panelThe Select Panel is an anchored dialog that allows users to quickly navigate and select one or multiple items from a list. It includes a text input for filtering, supports item grouping, and offers a footer for additional actions. Changes are applied upon closing the panel.Skeleton avatarUse skeleton avatar to replace avatars while content is in a loading state.Skeleton boxUse skeleton box to render a skeleton loader in a size and shape not provided by skeleton avatar or text components.Skeleton textUse skeleton text to replace lines of text while content is in a loading state.SpinnerUse Spinner to show users that an action is in progress.Split page layoutSplit page layout is used to provide structure for a split layout.StackStack is a layout component that creates responsive horizontal and vertical flows.State labelState label is used for rendering the status of an item.SubnavUse the sub nav component for navigation on a dashboard-type interface with another set of navigation components above it.Tab containerUse tab container to create tabbed content with keyboard support.Tab navTab nav contains a set of links that let users navigate between different views in the same context.Tab panelsTab panels let users switch between views in the same context.TextText styles a string.Text inputText input is used to set a value that is a single line of text.Text input with tokensText input with tokens is an input for a value that is a list.TextareaTextarea is used to set a value that is multiple lines of text.TimelineThe timeline component is used to display items on a vertical timeline, connected by timeline elements.Toggle switchToggle switch is used to immediately toggle a setting on or off.TokenToken is a compact representation of an object, and is typically used to show a collection of related metadata.TooltipTooltips add additional context to interactive UI elements and appear on mouse hover or keyboard focus.Tree viewTree view is a hierarchical list of items that may have a parent-child relationship where children can be toggled into view by expanding or collapsing their parent item.TruncateUse Truncate to shorten overflowing text with an ellipsis.Underline navThe underline nav is used to display navigation in a horizontal tabbed format.Underline panelsThe underline panels are used to break related content into tabbed panels.FooterEdit this page on GitHub8 contributorsLast edited by camertron on January 16, 2024"
