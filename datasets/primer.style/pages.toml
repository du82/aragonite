["https://primer.style/components/pagination"]
title = "Pagination | Primer"
description = "Pagination is a horizontal set of links to navigate paginated content."
full_description = "🎉 👀 New look, same Primer! Preview the new docs experience here and let us know what you think.PaginationPagination is a horizontal set of links to navigate paginated content.OverviewReactCSSOn this pageUsageAnatomyOptionsAccessibilityOn this pageUsageAnatomyOptionsAccessibilityUsagePagination renders a list of page links that let users quickly navigate content that is split into sequential pages.Best practicesEvery page should have a URL.Paginate content that would be easier to browse when it is segmented.Place pagination at the end of the page content.If the content is only long enough for a single page, don't render pagination.Don't show too many or too few items per page.Too many items per page could be overwhelming.Too few items per page could be frustrating to browse.AnatomyPrevious page link: Always links to the page before the current page.Next page link: Always links to the page after the current page.Page numbers: Lets users skip to whatever page the number represents.Current page: The page the user is on right now.Truncation indicator: A visual hint that a chunk of page links are skipped.OptionsNumber of pages shown at the beginning and end of the listIf it would be useful for users to be able to skip to a page near the beginning or end of the list, define how many page links should be shown at the beginning and end.Number of pages surrounding the current pageYou can specify how many page links before or after the current page will be shown. The first and last pages will always be shown, even if you set this value to 0.Without page linksIf you want to prevent users from skipping pages and force them to navigate sequentially, you may hide the page numbers and only show the previous and next page links.AccessibilityKnown accessibility issues (GitHub staff only)View open accessibility issues related to this componentFooterEdit this page on GitHub2 contributorsLast edited by emilybrick on September 7, 2023"
year_published = 2025
