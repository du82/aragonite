["https://primer.style/components/blankslate"]
title = "Blankslate | Primer"
description = "Blankslate is used as placeholder to tell users why content is missing."
full_description = '''🎉 👀 New look, same Primer! Preview the new docs experience here and let us know what you think.BlankslateBlankslate is used as placeholder to tell users why content is missing.OverviewReactRailsFigmaOn this pageAnatomyVariationsContent and copyFirst time user experiencesIn a narrow containerAccessibilityOn this pageAnatomyVariationsContent and copyFirst time user experiencesIn a narrow containerAccessibilityAnatomyThe blankslate component is made up of several elements that work together to inform the user about a feature and how to proceed forward. Below are the different elements of the component and how to modify them.GraphicThe graphic can bring delight, preview an interface element, or represent the goal of the feature. Graphics should be placed intentionally and with thought about the intention of the content. Graphics also differ in meaning and appeal to the user, which is why the Blankslate component has multiple variations. These variations are outlined later on this page.Please note that when a graphic is used to convey meaning or purpose, rather than purely for decoration, this information must also be conveyed to users that may not be able to see it, such as screen reader users. Either make sure that the meaning or purpose is also conveyed in the actual text used inside the component, or add a text alternative to the image itself. In the case of Octicons, this is done by adding an aria-label attribute to the element - for example, <Octicon icon={RepoIcon} aria-label="Repository" />. For other graphics, this implementation is at the consumer's discretion.Primary TextUse primary text to explain the purpose of the empty state, help users feel comfortable to engage with the content, or begin a feature flow. Primary text should sound welcoming, human, and convey the intention of the feature.Secondary textThis optional text is used to inform the user about the feature in more detail. Secondary text should be brief and non-redundant if possible. From the text, users should be able to understand the general purpose of the feature and how it may help them accomplish a goal.Primary actionBlankslates can and are encouraged to use one primary action. This button should lead to a feature or component creation flow. Button copy should be kept brief and descriptive. If a button requires further specification, consider adding an Octicon.Secondary actionSecondary actions are optional and are represented by a text link located below the primary action button. A secondary action is used to direct a user to additional content about the feature. This might look like Learn more about X or "Check out the guide on X.BorderThe border is invisible by default, but can be added to help define the structure of the Blankslate component when needed. This can be particularly helpful in page layouts where the Blankslate is not the only content on the screen. For implementation, check out the Primer CSS Blankslate component.VariationsEmpty states have multiple variations that can be used in different contexts.OcticonsOcticons can be used to represent the feature where the Blankslate is found.If the Octicon is not purely decorative, but intended to convey meaning or purpose that is not already apparent from the text used in the component, make sure to add a meaningful text alternative to your Octicon via aria-label.Code blockBlankslates that use a list of steps or offer instructions in the format of code to get started with a feature can insert a code block. This is the case for getting started with packages in GitHub:Content and copyEmpty states should explain features in addition to conveying intention. In the example below, the primary text is used to provide a welcome invitation to creating a positive community while the secondary text supports this intent by informing the user on how to do this by providing a code of conduct.First time user experiencesFor first time user experiences, use illustration Blankslates to playfully engage the user and introduce the Octocat as a symbol of GitHub. Primary text should welcome the user to the platform and feature. Secondary text should seek to educate the user, but at a simpler, less-technical level.In a narrow containerWhen a Blankslate is rendered in a narrow area, the spacing and font sizes are reduced so that it's visually proportional to the narrow area it's being rendered in. This is implemented using container queries, so this will happen on any viewport size.AccessibilityKnown accessibility issues (GitHub staff only)View open accessibility issues related to this componentFooterEdit this page on GitHub5 contributorsLast edited by francinelucca on November 7, 2024'''
