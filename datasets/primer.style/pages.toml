["https://primer.style/components/label"]
title = "Label | Primer"
description = "Use the label component to add contextual metadata to a design."
full_description = '''🎉 👀 New look, same Primer! Preview the new docs experience here and let us know what you think.LabelUse the label component to add contextual metadata to a design.OverviewReactRailsCSSOn this pageUsageAccessibility and usability expectationsRelated linksOn this pageUsageAccessibility and usability expectationsRelated linksGuidelines for this component are in progressInterested in contributing? Review the guidelines for writing component documentation and open a pull request in our documentation repository.UsageA label is a piece of text that is visually stylized to differentiate it as contextual metadata. It can be used to add a status, category, or other metadata to a design.Accessibility and usability expectationsBy itself, this component only provides a consistent visual styling to text. Authors should consider how the Labels will be used, and how to provide semantic/programmatic information for screen reader users.Built-in accessibility featuresThe Label component only provides a styled visual wrapper around its content. By default, the component results in a <span> element with an appropriate CSS class.The selectable variant/scheme colors meet minimum color contrast requirements.Implementation requirementsAdd structure when neededThe component itself does not convey any semantics or meaning, so you will need to provide this in the code/structures where the Label is used. For instance, if Label components represent a list of tags/labels, make sure to group them in an actual <ul> unordered list, with each Label wrapped in a separate <li> list item.Convey meaning with more than colorLabel has different schemes/variants (such as accent, attention, success, danger), which result in different colors for the text, background, and borders. These differences are purely visual, so they may be difficult to distinguish for users with impaired color perception. They also won't be perceived by screen reader users. For this reason, you can't rely on the scheme/variant alone to give meaning to your content. Make sure that the label text provides sufficient meaning/context on its own, regardless of its visual presentation. For example, if Label components are used to list a series of successes and failures, do not rely solely on the use of the success and danger schemes/variants to communicate that meaning. Make each label's meaning clear by prefixing it with an appropriate "Pass: …" and "Fail: …" string.How to test the componentIntegration testsThe Label is not used in a way where it relies solely on the use of color (the specific scheme/variant used) to convey its meaningIf the Label is intended to provide additional meaning/semantics (such as being part of a list of labels), it is wrapped in an appropriate structure (such as an actual list)Component testsContent passed into the component is output as the label's visible textThe contrast for all variants/schemes meets the minimum requirement of 4.5:1 between foreground and background colorsKnown accessibility issues (GitHub staff only)View open accessibility issues related to this componentRelated linksCounter labelLabel groupState labelTokenFeature onboardingFooterEdit this page on GitHub3 contributorsLast edited by emilybrick on July 30, 2024'''
