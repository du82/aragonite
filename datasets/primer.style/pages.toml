title = "Checkbox | Primer"
description = "Checkbox is a form control for single and multiple selections."
full_description = "🎉 👀 New look, same Primer! Preview the new docs experience here and let us know what you think.CheckboxCheckbox is a form control for single and multiple selections.OverviewReactRailsFigmaOn this pageUsageAccessibilityRelated linksOn this pageUsageAccessibilityRelated linksUsageUse checkboxes to allow users to select multiple items from a list of individual items, or to mark one individual item as selected.StatesCheckboxes have static dimensions and three different states: rest (default), focus, and disabled.Selected statesCheckboxes are capable of showing two forms of selection: checked (left) or indeterminate (right).The indeterminate state is colored in some browsers (e.g. Safari) and grey in others (e.g. Chrome).Best practicesAn individual checkbox should not have its own validation message or style. Instead, show a validation message on the checkbox group. For more information, see the Validation Message section in the Forms documentation.While there are certain use cases where an individual checkbox may be required, the most common use case is to require a selection from a checkbox group. In this case, an individual checkbox button should not be marked as required, but the checkbox group should be marked as required instead. For more information, see the Required field indicator in the Forms documentation.AccessibilityKnown accessibility issues (GitHub staff only)View open accessibility issues related to this componentRelated linksFormsForm controlCheckbox groupRadioRadio groupFooterEdit this page on GitHub7 contributorsLast edited by francinelucca on November 1, 2024"
