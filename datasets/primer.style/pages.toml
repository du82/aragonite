["https://primer.style/brand/components/IDE"]
title = "IDE | Primer Brand UI"
description = "Use the IDE to showcase a simulated integrated developer environment, complete with a code editor and AI chat that's intended to enhance code representation in marketing contexts."
full_description = "IDEUse the IDE to showcase a simulated integrated developer environment, complete with a code editor and AI chat that's intended to enhance code representation in marketing contexts.SourceStorybook The IDE does not automatically apply syntax highlighting to code snippets. Usage of this component in GitHub.com is expected to use the proprietary tokenizer and highlighter, the output of which can be passed directly into IDE as a parameter. Line-by-line animations can be enabled using pre-formatted prop values. A replay button is enabled by default. Simulate GitHub Copilot Chat using the IDE.Chat sub-component. The script is fully customizable, and code snippets will require pre-formatting to enable syntax highlighting. A glass variant is available to simplify placement of the IDE on background images. This variant adds alpha transparency and background blurring. When using the glass variant, pay close attention to the background image behind the tabs of the IDE.Editor. Ensure there is sufficient contrast between the text and the background on inactive tabs. The full contents of IDE.Chat and IDE.Editor are intentionally not made available to users of assistive technologies. Summaries of the content — which must be provided using the alternativeText prop — are made available instead. In both cases, the goal is to provide a meaningful summary of the content that will allow users of assistive technologies to understand the purpose and scope of the conversation or code snippet, without needing to understand the full content. Supported file extensions in the editor include: py, ts, js, jsx, hs, html, css, scss, json, md, yml, yaml, txt, sh, sql"
