["https://primer.style/brand/components/Testimonial"]
title = "Testimonial | Primer Brand UI"
description = "Use testimonial to display a quote from a customer or user."
full_description = "TestimonialUse testimonial to display a quote from a customer or user.OverviewReactOn this pageAnatomyUsageOptionsRelated componentsOn this pageAnatomyUsageOptionsRelated componentsAnatomyQuote: The quote from the customer.Name: The name of the customer.Position: The position or role of the customer.Avatar or Logo: Optional avatar of the customer or the company logo.UsageUse the testimonial component to showcase a quote or a review from a customer. Use the testimonials to build credibility, trust, and provide social proof by displaying customers' sentiments about the product.Testimonials should be short and concise. Quotes should be not be longer than 3-4 lines. Avoid using long quotes that can be hard to understand or that don't provide enough context.DoUse short and concise quotes.Don’tDon't use long quotes that can be hard to read and understand.Use highlitghts to alternate the color of the quote mark and emphasize specific parts of the quote.DoUse emphasis to highlight te beginning of the quote and provide extra visual weight.Don’tDon't use multiple highlights in the same quote to avoid visual noise.Avatars and logos are optional and can be used to provide more credibility about the customer or the company. When using an avatar, use an image of the customer to make the testimonial more personal. If an image is not available, use a logo or a similar visual asset that represents the customer company or the organization.DoUse a real life image of the customer or the logo of the company.Don’tDon't use illustrations or generic images. Use real life images to provide trust.Testimonials can be used individually or in a group. When using a group of testimonials, use the same size and alignment for all of them. When including an avatar or a logo, use them in all testimonials of the group and keep the same style and size— don't alternate between logos and avatars. We recommend using a maximum of 4 testimonials per group to avoid visual noise and to keep the quotes relevant.DoUse a maximum of 3 or 4 testimonials per group, with the same size and alginment.Don’tDon't use different sizes, alignments or alternate avatars and logos for groups of testimonials.Use a single testimonial to highlight a specific feature or benefit of the product. Use multiple testimonials to showcase each feature when in a list or a river.DoUse testimonials to enhance the credibility of an specific feature or benefit.Don’tDon't use multiple testimonials to showcase the same feature to avoid visual noise.OptionsSizeThe testimonial component uses the small size by default. Use the large size to provide more visual weight.DoUse the large size when using a single, full-width testimonial.Don’tDon't use small size for full-width testimonials.DoUse the small size when paired with other components that showcase features, like rivers.Don’tDon't use the large size in small sized areas or components like rivers, so they don't conflict with the main content. Even if the quote is short, use the small size instead.DoUse the small size for single row groups of testimonials.Don’tDon't use the large size in single row groups, even if the content is short. Stack them vertically and use 2 columns instead.Related componentsPillar: To display related content with less visual emphasis.Card: To display navigational related content with higher visual weight.River: To display navigational related content with higher visual weight.FooterEdit this page on GitHub"
year_published = 2025
