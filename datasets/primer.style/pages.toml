title = "Breadcrumbs | Primer"
description = "Breadcrumbs display the current page or context within the site, allowing them to navigate different levels of the hierarchy."
full_description = '''🎉 👀 New look, same Primer! Preview the new docs experience here and let us know what you think.BreadcrumbsBreadcrumbs display the current page or context within the site, allowing them to navigate different levels of the hierarchy.OverviewReactRailsFigmaOn this pageUsageAnatomyOptionsAccessibility and usability expectationsOn this pageUsageAnatomyOptionsAccessibility and usability expectationsUsageBreadcrumbs are used to show taxonomical context on pages that are many levels deep in a site’s hierarchy. Breadcrumbs show and link to pages higher up in the ancestry.Breadcrumbs are most appropriate on pages that:Are many levels deep on a siteDo not have a section-level navigationMay need the ability to quickly go back to the previous (parent) pageAll items must contain links, with the last item as the user's current contextAnatomyBreadcrumbs are made of links (indicating parents), dividers, and the current page. The default breadcrumbs component can be modified to change the number of items within the chain.Note: The space between items is set to 0px as the divider has padding built into it.OptionsBreadcrumb lengthBy default the breadcrumbs component can show up to 10 items within the chain.Accessibility and usability expectationsBreadcrumbs provide users with a structured set of links to both help them understand where they are within the context of a site, and to allow them to more easily jump directly to previous sections within the site's structure.The last item in the breadcrumb trail refers to the current page. To convey this visually, the link is styled differently from the preceding links. For screen reader users, this information is conveyed programmatically through the use of the aria-current attribute in the rendered output.The text of each breadcrumb link should match the heading element (h1–h6) or the unique part of the <title> element that it is linked to. If the breadcrumb link text is not unique, it should be made unique by adding additional context. While this approach should be used in the majority of cases, if the breadcrumb link text is overly verbose, it can be made more concise, as long as it still provides sufficient information to the user. For example, the last item in a breadcrumb trail for a blog post could be the full title of the blog post itself, or (as it is likely long, and arguably redundant) just be generically labelled as "Blog post".Built-in accessibility featuresThis component is rendered as a <nav> navigation landmark region, with an accessible name of "Breadcrumbs".<nav … aria-label="Breadcrumbs"> … </nav>This makes the breadcrumb navigation easily discoverable for screen reader users who navigate via page landmarks.The individual breadcrumb items are rendered as an <ol> ordered list, with each item marked up as a link in a separate <li> list item.Implementation requirementsIn the Rails implementation, the link in the last item is automatically given an aria-current="page".In the current React implementation, you need to explicitly mark the last item as selected, which results in aria-current="page" being added to the link.<Breadcrumbs> <Breadcrumbs.Item href="…"> … </Breadcrumbs.Item> <Breadcrumbs.Item href="…"> … </Breadcrumbs.Item> … <Breadcrumbs.Item href="…" selected> … </Breadcrumbs.Item></Breadcrumbs>How to test the componentIntegration testsEach breadcrumb link has appropriate and descriptive link textFor the React implementation, the last breadcrumb item has been explicitly marked as selected, to visually and programmatically identify it as a link referring to the current pageComponent testsThe breadcrumb component is exposed as a navigation landmark with an appropriate name/labelThe breadcrumb items have an appropriate structure, such as an <ol> ordered listFor the Rails implementation, the last item link is programmatically identified as a link to the current page using aria-current="page"For the React implementation, if a breadcrumb item has been marked as selected, the last item link in the rendered output is programmatically identified as a link to the current page using aria-current="page"Known accessibility issues (GitHub staff only)View open accessibility issues related to this componentFooterEdit this page on GitHub6 contributorsLast edited by auareyou on May 9, 2024'''
year_published = 2025
