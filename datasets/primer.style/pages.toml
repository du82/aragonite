["https://primer.style/brand/components/BreakoutBanner"]
title = "Breakout banner | Primer Brand UI"
description = "Use a breakout banner to break up content on longer pages and highlight important information."
full_description = "Breakout bannerUse a breakout banner to break up content on longer pages and highlight important information.OverviewReactOn this pageAnatomyUsageRelated componentsOn this pageAnatomyUsageRelated componentsUse breakout banners to promote important information and actions in-between blocks of content.Whereas the CTA banner is intended to redirect users to their respective conversion outlets, links in the breakout banner should only cross-link to supporting content.AnatomyUsageBreakout banners should be used in the middle of a page to break up long blocks of content. Avoid using the breakout banner at the beginning or towards the end of a page.DoUse breakout banners to break up longer pages.Don’tDon't use the breakout banner too early or late in the page (E.g. near the footer). Prefer CTA banner in case of the latter. Also avoid placing the breakout banner too close to related components like the CTA banner.AlignmentThe breakout banner content can be aligned to the start or center of the parent element, with the former being the default. Use the center alignment if context calls for it.E.g. Use center alignment if the breakout banner is placed between two sections that are also centered aligned to avoid breaking the visual flow.DoUse start alignment when possible.Don’tDon't use start alignment when adjacent content is center aligned.Use sparinglyBreakout banners should be used sparingly, at most once per page. This is to avoid diluting the impact of the spotlighted content or links in the context of the wider page.DoUse breakout banner sparingly.Don’tDon't stack multiple breakout banners, prefer Bento instead.Use concise headingsBoth heading and optional descriptions in the breakout banner should be short and focussed. Heading should be not be longer than 3 lines, and description should be no longer than 3-4 lines.DoUse concise, but impactful heading and description text.Don’tDon't use longer form content in the heading or description. Consider using Bento as an alternative.Background visualsBackground images should be abstract and low fidelity to not compete with the foreground text.DoUse approved wallpapers that provide space and contrast with the foreground text.Don’tDon't use images of people's faces, real objects, etc.Leading visualsDoUse logos or icons that are related to the adjacent banner content.Don’tDon't use decorative imagery as a leading visual. Use the background image to apply decoration.DoUse monochrome colors, which correspond to the text color of the current, active color mode.Don’tDon't use full color visuals.Related componentsCTABanner: To highlight important information and actions towards the end of a page.FooterEdit this page on GitHub"
year_published = 2025
