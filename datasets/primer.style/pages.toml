["https://primer.style/brand/components/Grid"]
title = "Grid | Primer Brand UI"
description = "Use the grid component to create flexible and responsive grid-based layouts."
full_description = '''GridUse the grid component to create flexible and responsive grid-based layouts.OverviewReactOn this pageUsageGrid vs StackAccessibilityRelated componentsOn this pageUsageGrid vs StackAccessibilityRelated componentsUsageUse the grid component to define a layout that maintains consistent element positioning and sizing across pages. The grid is based on a 12-column layout and uses vertical and horizontal gaps to separate content units consistently1.Use the grid for general page layout, and grouping related elements with a similar purpose. E.g. A "contact us" form or a list of cards.In most cases, we recommend using the same column span for each element to create a consistent layout.DoUse the same column span for each content unit to create a consistent layout and spacing.Don’tDon't use different column spans when grouping the same element type.Use different column spans instead of an even distribution when creating a visual hierarchy between items or when defining a general page or a section layout. E.g. A section with an image and text, a layout with main content and a sidebar or a form with inputs and text areas.DoUse different column spans to create a visual hierarchy between a large image and text.Don’tDon't span in few columns large images or long content text that will create unbalanced layouts.DoUse different column spans when you want to create a visual hierarchy on a section between different elements. Like a footer with notes and navigational lists.Don’tDon't use equal column spans when the content is not related or the elements are different.ResponsiveThe grid component provides control over the number of columns at each breakpoint. For most of the cases, we recommend using the same column span on each child at each breakpoint to create a consistent layout and spacing in all screen sizes.For example, a group of cards might span 3 columns on a extra large viewport, 4 columns on large viewports, 6 on medium and 12 columns on small viewports.Use the same column span for each content unit at each breakpoint to create visually consistent layouts.When using even column spans, we recommend to span each item full width on small viewports and stacking the items vertically to ensure that the content is readable and accessible on small screens.Use full width on small viewports to ensure that the content is readable and accessible.Grid vs StackWe recommend using either the grid or stack component, depending on how the child items are displayed and how they work on different screen sizes. If the element is a sequential list of items in a vertical or horizontal order, we recommend using the stack component. Otherwise, if the element needs columns and rows or for general page layout, we recommend using the grid component instead2.Grid examplesPage or section layoutWhen defining the page or a section layout. E.g. A page with navigation, main content and footer areas.Sub sectionsWhen dividing an area into two areas. E.g. A "Send feedback" sidebar and a form, and the form uses the grid for the form layout itself.Card or pillar gridsWhen laying out cards, pillars, or similar content-based elements.Stack examplesNavigationFor the page navigation or a list of links. E.g. Having a logo on the left side and the navigation on the right.List of actionsFor a group of action or buttons, where items are displayed next to each other, and they are distributed horizontally or vertically, depending on the content length and the screen size.Form elementsFor combinations of input fields with a button next to it.Profile cardsFor combinations of an avatar and descriptive content, where the information takes the remaining space from its parent element. This could be applied to any combinations of an icon and text too.AccessibilityBy default, the grid assumes that it will be used in a purely decorative fashion and thus sets no roles, ARIA attributes, or keyboard shortcuts. This is equivalent to having a sequence of <div> elements on the page by default. Any interactive content within the grid should be given an appropriate accessibility treatment based on the specific workflow of your application.Related componentsStack: To enable layout of its immediate children along the vertical or horizontal axis.The grid component is implemented using the CSS Grid Layout specification.↩This section is based on the article Grid for layout, Flexbox for components by @shadeed↩FooterEdit this page on GitHub'''
year_published = 2025
