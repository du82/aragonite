title = "Comparison table | Primer Brand UI"
description = "Use the comparison table component to compare two products or features in a table format."
full_description = "Comparison tableUse the comparison table component to compare two products or features in a table format.SourceStorybookFigma A heading can be provided using the heading prop on the root <ComparisonTable>. This will render a heading at an appropriate size relative to the table, and present it accordingly. By default, the first data column will be marked as featured. This is to draw attention to a particular product as the basis of a comparison against adjacent columns. Featured columns will have the visually-hidden text featured appended to their column title. This text is used to identify the featured column to screen reader users and can be customized using the visuallyHiddenFeaturedLabel prop. ComparisonTable has an alternative visual presentation mode called minimal. This will display the data without the featured columns. This variant is suitable for embedding into long-form content, or in situations where usage of on-screen color needs to be minimized. Optional node that appears below the table. This is useful for adding additional context or disclaimers."
