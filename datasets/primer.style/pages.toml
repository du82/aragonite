["https://primer.style/brand/components/RadioGroup"]
title = "Radio group | Primer Brand UI"
description = "Radio group is used to render a short list of mutually exclusive options."
full_description = '''Radio groupRadio group is used to render a short list of mutually exclusive options.OverviewReactOn this pageUsageAccessibilityRelated componentsOn this pageUsageAccessibilityRelated componentsUsageUse radio group to allow users to select a single option from a short list of related options.OrientationA vertical orientation makes options easier to visually scan.AnatomyLabel: A title that labels the group of options and helps users understand the relationship between the options in the groupRequired indicator: Indicates that a selection is requiredCaption: May be used to provide additional context about the radio group when the label alone is not sufficientOptions: A list of mutually exclusive options represented using radio buttonsValidation message: A message explaining why the selection failed validation. See the form pattern documentation for more information on form validation patterns.Best practicesPut radio buttons in a logical orderOnly use a radio group for a short list of options: aim for 6 or less options. For longer sets of options, consider using a select or an action menuRadio buttons cannot be unchecked, so only use a radio group when a selection is required. Consider the following alternatives:use a radio group, but with one option that equates to "none of these options"use a checkbox group that fails validation if more than one option is selectedIf there is an option that's the most likely option to be checked, that option should be checked by defaultAccessibilityOnce a user checks an option from a radio group, the result should not be saved or applied until the user has explicitly submitted their input using a "save" or "submit" button. A radio group is a single tab stop, and the options can be navigated using the arrow keys: this means assistive technologies like a screen reader cannot "read" an option without selecting it. See the saving pattern guidelines for more information.Radio groups must be labeled. The label may be visually hidden, but visible labels are preferred.Related componentsFormControl: Used to group form controls with labelsRadio: Individual radio button controlCheckboxGroup: For allowing multiple selectionsFooterEdit this page on GitHub'''
