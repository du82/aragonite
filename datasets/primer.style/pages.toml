full_description = '''Checkbox groupCheckbox group renders a set of checkboxes.OverviewReactOn this pageUsageAnatomyAccessibilityRelated componentsOn this pageUsageAnatomyAccessibilityRelated componentsUsageUse checkbox group to allow users to select multiple items from a list of individual items, or to mark one individual item as selected.Best practicesPut checkboxes in a logical orderIf users are only allowed to select a single option, consider using a radio group insteadEach checkbox's state should be independent from other checkboxes in the group. For example: checking one checkbox should not check or disable any other checkboxesAnatomyLabel: A title that labels the group of options and helps users understand the relationship between the options in the group.Required indicator: Indicates that a selection is required.Caption: May be used to provide additional context about the checkbox group when the label alone is not sufficientOptions: A list of options represented using checkboxes.Validation message: A message explaining why the selection failed validation. See the form pattern documentation for more information on form validation patterns.AccessibilityOnce a user checks an option from a checkbox group, the result should not be saved or applied until the user has explicitly submitted their input using a "save" or "submit" button. See the saving pattern guidelines for more information.Related componentsCheckbox: Used to render an individual checkbox control.FormControl: Used to group individual controls with an associated label.RadioGroup: Similar to CheckboxGroup, but used for organizing radio controls.FooterEdit this page on GitHub'''
