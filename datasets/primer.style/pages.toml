["https://primer.style/brand/components/FormControl"]
title = "Form control | Primer Brand UI"
description = "Use the form control component to display form inputs alongside labels, validation and more."
full_description = 'Form controlUse the form control component to display form inputs alongside labels, validation and more.SourceStorybookFigma FormControl is responsible for layout and ensuring that relevant IDs and ARIA attributes are passed to its children. FormControl can help compose form layouts quickly, while ensuring the inputs are accessible for assistive technologies. Labels should only be visually hidden when the context is clear from the input itself. For example, a search input with a search icon. The majority of the time, labels should be visible. When the form is submitted with an invalid value, the invalid input receives focus to help the user correct the error. This is especially important for users navigating the form using a screen reader. More information on form validation best practices can be found in the Primer UI Patterns documentation. FormControl.Hint can be used to provide additional context or guidance to the user. FormControl.Hint must be a direct child of FormControl. Pass the fullWidth prop to FormControl to provide additional behavior and state context to all children, rather than the input only. Pass the required prop to FormControl to provide additional behavior and state context to all children, rather than the input only. When marking a field as required, it is recommended to also provide a corresponding message at the start of the form informing the user that "all fields marked with an asterisk (*) are required". FormControl.Label should be provided for the FormControl to be accessible to assistive technology, but it may be visually hidden. Additional props can be passed to the <label> element. See MDN for a list of props accepted by the <label> element.'
year_published = 2025
