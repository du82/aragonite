["https://primer.style/components/data-table"]
title = "Data table | Primer"
description = "Data table is a 2-dimensional data structure where each row is an item, and each column is a data point about the item."
full_description = '''🎉 👀 New look, same Primer! Preview the new docs experience here and let us know what you think.Data tableData table is a 2-dimensional data structure where each row is an item, and each column is a data point about the item.OverviewReactFigmaOn this pageAnatomyUsageOptionsInteractionsAccessibilityRelated components and patternsOn this pageAnatomyUsageOptionsInteractionsAccessibilityRelated components and patternsAnatomyTable headerThe table header shows contextual information about the table and render controls that affect the table.Title: A concise label that describes the table and its contentsSubtitle: A brief description to adds more context for the table when the title alone is not enoughActions: Controls that affect the entire tableFilter: An input used to filter table data to make it easier for the user to focus only on the rows relevant to their task. Even though the filter affects the entire table, it's not considered an "action".Column headersA very short label that describes the data in the column.Column headers are buttons that sort rows by the column data in ascending or descending order. Sort functionality may be disabled on a column-by-column basis.The column that contains row actions does not have a visible column header.Row headersA row header identifies the item being represented in the row. They are typically the first cell in the row, and are visually distinct from the other cells in the row.Row actionsActions that affect the item represented in the row.Data cellsThe data for each row that is described by its corresponding column header and optional row header.Pagination footerThe pagination footer shows the user where they are in relation to the total number of rows and provides controls for navigating all rows.UsageWhen to use a data tableTo navigate a lot of information at once and to make it easy to compare data points between rows or columnsIf the data is easy to understand when all data points are displayed in a flat hierarchyWhen to use something elseUse a list or something elseWhen there are columns where the cells will usually be emptyIf the data is easier to understand with grouping and hierarchy (sections, headings, subheadings, etc.)When rows and columns are only a means of layoutFor data with longform content such as paragraphs or long listsUse a data gridIf the primary purpose is to edit or otherwise interact with the cells (like a spreadsheet)If rows or columns support some kind of user interactionBest practicesOrder rows intuitivelyData should be initially rendered in an intuitive order. For example, starting with the most recently created items.By default, sort alphabetically by the first column's content. Rows will be re-ordered as the user updates the sort parametersMinimize the number of columnsIt's easier to scan many rows than it is to scan many columns. Consider swapping columns and rows when it's unlikely that there will ever be more rows than columns.Adapt column widths when necessaryUse the column width options to appropriately size the columns depending on the content and the available horizontal space.Keep column headers shortColumn headers are short labels used to define the kind of data that is shown in that column.Keep cell content conciseCells should represent data in the shortest possible format. This makes the table easier to scan, and preserves horizontal space.Don't use a single column to show multiple pieces of dataThe column header should accurately represent the data point rendered in the column's cells. It would also be unclear which data point is being used when sorting.Make numbers easier to compareRight-align numeric values and use the tabular-num font variant when possible.Avoid wrapping or truncation of cell content as much as possibleIdeally, the cell content is very short and the column will be wide enough to accommodate its content. In cases where it's not possible to fit the content, you may wrap or truncate the content.Cells that are likely to contain long strings may choose to wrap the content. This is the preferred way to accommodate long content because it doesn't hide the content.Content truncation is available as a last resort when column widths are set. The full content may be exposed in a tooltip.By default, leave empty cells blankYou may show a message to explain an absence of data. Just don't use a character like “x” or “-”. It creates a weird experience for assistive technologies like screen readers.Use “skeleton” placeholders to indicate loading contentThe placeholder should match the real content as closely as possible.Use the following properties to adjust the size and alignment of the placeholder:column widthalignmentwhether or not there is a leading visualDon't worry about whether the text wraps. Ideally, the height of the cell will not change once the data is loaded. However, it wouldn't be possible to know how many lines of text the content wraps to.Use pagination to accommodate tables with a large datasetBy paginating, the user can focus on segments of a large dataset without being overwhelmed. Pagination also helps with performance by reducing the amount of data to be downloaded and the amount of content that needs to be rendered.Don't put too many or too few rows per pageIf page length is too short, it would be annoying to browse the data in small segments. If page length is too long, users could get lost or overwhelmed.The following factors influence what the ideal page length would be for your use-case:Whether rows can be filteredNumber of columnsVisual complexity of the rendered cellsAmount of context needed when reviewing the dataThese factors make it difficult to recommend an “ideal” page size for all use cases, but 20 rows is a good place to start.Communicate when the table has no data to showShow a Blankslate component in place of the tableConsider small screensSome strategies for adapting the table for narrow viewports include:Use the column width optionsRemove less important columnsScroll horizontallyDo's and Don'tsDoUse a data table for data in a flat hierarchical structureDon’tDon't use a data table for information that has hierarchical relationshipsDoRestrict the data in a column to represent one type of dataDon’tDon't group data in a column cell that isn't described by the column headerDoLeave the cell blank (preferred) or show text that explains the absenceDon’tDon't show a character, icon, or emoji to indicate a cell is emptyDoAllow the title in the page header to act as a table title when appropriateDon’tDon't repeat or rephrase the title in the page header as the table titleOptionsColumn widthsGrow (default)Stretch to fill available space, and min width is the width of the widest cell in the column. This is the same behavior as a CSS grid column with the value minmax(auto, 1fr).May have a min and max width constraint.Grow or collapseStretch to fill available space in the parent or shrink to fit in the available space in the parent.May have a min and max width constraint. Without a min width constraint, the column could collapse to a width of 0px.AutoThe column is the width of its widest cell. Not intended for use with columns whose content length varies a lot because a layout shift will occur when the content changes.May have a min and max width constraint.Explicit widthWill be exactly that width and will not grow or shrink to fill the parent.Action columnThe action column would not accept a width. Its min-width would be the width of the actions.Filling available spaceIf all columns have width constraints set and the row doesn't fill the table container, the difference is added to the width of the last column.CellsDensityOptions:Condensed: Optimize for showing more information in a smaller area.Normal (default): Shows a lot of information in a small area, but provides enough whitespace that the cells won't risk visually running together.Spacious: Optimizes readability for tables with visually busy cell content.Text alignmentLeft (default): Matches natural reading direction of text in right-to-left writing systems.Right: Optimizes for comparing column data that is easier to compare when it's right-aligned. Most commonly used for numeric data.Content fittingWrapping (default)Single-line truncationMulti-line truncationRow actions cell options1 actionRow actions are placed in the last column, and they don't require a visible column header.Multiple actionsIf you have multiple actions for a row, start by pulling them into a dropdown menu.1 primary action, other actions in an overflowIf one of the actions is heavily used, pull it out for easier access. Do not pull out more than 1 action.InteractionsSortingIf a table is sortable, it must start with one column sorted on page load. Interacting with a column that is already sorted will toggle the sort between ascending and descending. If a column is not sorted yet, the first click sorts in ascending order.StatesUnsorted (default)Ascending sort activeDescending sort activeSort in progressFilteringA filter input (internal) is used to write a query and only show rows that match that query.AccessibilityLabeling and describing the tableThe table must have a title, and can optionally have a subtitle to describe more context. If you encounter a case where there is enough context that the table doesn’t need a visible label, you may hide it so it’s only accessible to assistive technologies.If you use the table header, the table's title and subtitle will automatically be associated with the table for assistive technologies.If your table's title exists somewhere else on the page (for example, in the PageHeader), then you must manually associate that contextual information with the table using ARIA.Labeling actionsThe row header string will be prepended to the ARIA text of action buttons. For examples, Download {row header}“, “Actions:{row header}”To handle cases where the row header can be very long, we should give consumers the option to specify a shorter string to identify the rows. For example, if an issue title is used as the row header, we could use the issue number instead of the full issue title.Pagination buttonsThe pagination control for a DataTable uses button elements, and not a elements. This is because activating the pagination control requests data, and does not have a corresponding URL to link to.Loading and sorting contentIt is important to ensure parity between what can be seen visually when a table is loading or sorting content and what is announced to assistive technology. This is provided by the DataTable component automatically, but must be considered if a custom loading solution is otherwise utilized. For loading content via a custom loading method, this also includes the initial loading period. An announcement should not be made if content is retrieved before 750ms.Known accessibility issues (GitHub staff only)View open accessibility issues related to this componentRelated components and patternsActionBarPaginationFooterEdit this page on GitHub8 contributorsLast edited by maximedegreve on December 12, 2023'''
