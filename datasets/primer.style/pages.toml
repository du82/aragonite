["https://primer.style/components/link"]
title = "Link | Primer"
description = "Links are used to apply styles to hyperlink text."
full_description = '''🎉 👀 New look, same Primer! Preview the new docs experience here and let us know what you think.LinkLinks are used to apply styles to hyperlink text.OverviewReactRailsFigmaOn this pageUsageAnatomyAccessibility and usability expectationsOn this pageUsageAnatomyAccessibility and usability expectationsUsageLinks enable users to navigate between pages or resources in a seamless way. Links can be used within a body of text or as a standalone element.Links navigate you to a new place or new content. Do not use links for triggering an action. Instead, use buttons, which are designed to activate a feature.Links should be concise and not exceed more than a few words.AnatomyThe link component can be displayed in default, muted, or blue colors. Links can be underlined, may include a leading visual or trailing visual, and can be either the default or small size.Accessibility and usability expectationsLinks play a key part in your experience on the web, but without proper consideration they can be frustrating to use, skipped over, or completely unnoticed.For assistive technologies like screen readers, links and buttons are expected to function differently from each other. If a link is activated and does not do what was expected, that can be disorienting and frustrating.A common way a screen reader might navigate the page is by going through a list of all the links on the page. Without context, "read more" or "click here" links are not helpful.People who have low or colorblind vision may have trouble identifying links that just use color to distinguish them from plain text, this is why keeping the underline styling on links within body text is important for identification.You should only use this component for links - controls that navigate to another location within the current page, another web page, or point to a downloadable file. Don't use this component for controls that trigger in-page actions, such as opening a modal dialog, expanding/collapsing a disclosure widget, or submitting a form – in all these cases, use more specific components such as buttons.How to test linksIntegration testsActivating a link changes the URL. It is not intended to be used as a trigger for an action. A button is more appropriate for elements that trigger an action when activated.Where muted links are used, this visual presentation is not used as the only way to differentiate links or to somehow convey semantic meaningThe links have an appropriately descriptive link text; in the case of image links, the images have an appropriate text alternativeComponent testsLinks are rendered as standard <a href="…"> … </a> linksContent passed into the component is output as the link's visible textImplementation requirementsSetting the muted property changes the visual presentation of the link to use a more subdued color. However, this visual change is not conveyed programmatically – so muted links will be announced the same way as regular links by screen readers. Don't rely solely on the muted property to distinguish links that serve a different purpose. If links need to be differentiated, make the difference clear in the link text itself. Alternatively, group these links separately and add context, such as a preceding heading or explanatory paragraph.Links must have appropriate link text that is sufficiently descriptive – giving users enough information to understand where the link will take them. For links that are wrapped around images, make sure that the images have an appropriate text alternative, as this will act as the link text.Functionality and purposeA link's function is to navigate to a different page or new content. If instead a feature on the page is activated, use a <button>. Learn when to use a link or button.A link's purpose must be obvious from the link text alone. If you can't get an idea of where a link will take you based on the link text without reading the sourrounding text, the link text should be updated. Learn how to write good link text.This is important because screen readers allow users to browse through a list of links, where the link text is the only clue of where a link will take you.Visual distinction & contrastLike normal text, a link must have a 4.5:1 contrast against the background color that it is placed on. Use a contrast checker to validate that your link meets this required contrast.If a link is sourrounded by text, it must be underlined or pass a 3:1 contrast against the sourrounding text as well. Alternativly an icon, a background shape or an outline can demarcate a link.Some examples of this are:links within body texta headline and subline which both are individual linksissue numbers or usernames within a commit lineGuidelinesVisually demarcate your links by using:the accent.fg color in combination with fg.default for the sourrounding text on any of the canvas.[...] colorsan underline for the link textan icon before or after the link textusing a background shape behind the linkusing a link color that has a 3:1 contrast against the sourrounding text color AND a 4.5:1 against the background colorMake sure a link's purpose can be understood from the link text alone, without needing the surrounding context.Links should look like links, not buttons, except in rare circumstances, like calls to action.DoBe descriptive with your links so that they can stand alone and be understood.Don’tDon't use generic terms like 'click here' that can't be understood out of context.DoUnderline links in paragraphs and sentencesDon’tDon't use underlines for non-link highlights or forget to demarcate linksDoUse a link color that has a 3:1 contrast against the text colorDon’tDon't use a color that has less than a 3:1 contrast against the text color for linksDoUse an icon or a background shape to demarcate a linkDon’tDon't use text styles like italic or bold to demarcate linksFor engineersUse Primer link components:Rails componentReact componentDon't override the link styling provided in the componentsMake sure links receive our global focus indicator styling when navigating the page with a keyboard (reference: Focus management)Don't use the title attributeContent within a title is inaccessible for many users, such as touch-only and keyboard-only users. If additional content needs to be associated with a link consider using a tooltip or alternatives to a tooltip.Avoid adding side effects to link click events. Links should navigate, not affect the page.Don't force links to open in a new tab/window by setting the target property.Links should always open in a new window when clicking while holding Command/Control.Common mistakesOnly adding an underline to a link when it has focus or is hovered overUnderlining every link on the page. For example, a navigation list is a list of links but navigational links don't have to be underlined because the intent is understood and an underline is not needed to identify the interactive nature of the control.Writing link textLink text should be descriptive enough to convey the destination without relying on the surrounding text. Screen reader users often tab through links on a page to quickly find content without needing to listen to the full page. When link text is too generic like "Read more", the destination of the link is not conveyed.It may be acceptable in some scenarios to provide a more descriptive link text for screen reader users by setting the aria-label. However, this technique will result in divergence between the label and the text and is not an ideal, future-proof solution. Whenever possible, prefer a single descriptive link text that is available for both sighted users and screen reader users.If you must resort to the ARIA technique to provide a descriptive link text, follow these principles:The visible text is included in full as part of the accessible name to avoid a violation of SC 2.5.3: Label in Name.The sentence that the link is a part of is well-formed and grammatical when read with both the visible text and the accessible name.DoAccessible name fully includes the visible link text, "Learn more" and is well-formed with either label.There are various plans available.<a href="..." aria-label="Learn more about GitHub pricing plans">Learn more</a>Don’tAccessible name results in poorly-formed sentence, "Learn more about keyboard shortcuts allow you to access common commands more quickly". <a href="..." aria-label="Learn more about keyboard shortcuts">Keyboard shortcuts</a> allow you to access common commands more quickly.As demonstrated in the examples, this technique adds more complexity to the code and can introduce more problems than it solves so only use this technique if absolutely necessary.Additional resourcesColor to Distinguish Links from Text (requires a subscription to access the content)Accessibility Insights plugin: With the Accessibility Insights plugin installed, open the plugin, visit the Assessment option and select 7. LinksWebAIM: Links and Hypertext - Introduction to Links and Hypertexterblint-github: Avoid generic link textRelated WCAG guidelines and success criteriaUnderstanding Success Criterion 4.1.2: Name, Role, ValueAuthoring Practices Guide - LinksAccessible Rich Internet Applications (WAI-ARIA) 1.2 (w3.org)Understanding Success Criterion 2.4.4: Link Purpose (In Context)Known accessibility issues (GitHub staff only)View open accessibility issues related to this componentFooterEdit this page on GitHub6 contributorsLast edited by auareyou on May 9, 2024'''
year_published = 2025
clearnet = "https://primer.style/components/link"
