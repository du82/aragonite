["https://primer.style/brand/components/River"]
title = "River | Primer Brand UI"
description = "Use the river component to introduce a feature using a type and media pairing."
full_description = "RiverUse the river component to introduce a feature using a type and media pairing.OverviewReactOn this pageUsageAnatomyRelated componentsOn this pageUsageAnatomyRelated componentsUsageUse rivers to showcase features and introduce topics. Rivers are composed of images or videos paired alongside text content like headings, paragraphs, and links.A river’s content should be short and concise, no longer than 3 or 4 sentences and in a single paragraph when possible.DoWrite short and concise text content.Don’tDon't overload the river with too much content.StackedTwo or more rivers can be stacked to guide the user through a set of features. When stacking rivers, alternate between left and right alignments to create a more dynamic reading flow. When alternating alignments, use a 40:60 image to text ratio, otherwise keep the ratio to 50:50.It is possible to use 2 or more following left or right river to create a simple alignment promoting easy scroll scan.DoAlternate rivers with left and right alignments.Don’tDon't break the flow in a stack of rivers that would otherwise stay aligned.Note that too many rivers can make the design feel repetitive. In that situation, consider introducing a breakout section or break the content with a different component, such as pillar or card to provide a better visual hierarchy and experience. For example, use the river for the top features you want to highlight and then use pillars to showcase the rest.DoUse pillars or cards to breakout a multiple river section and provide a better visual hierarchy.Don’tDon't stack numerous rivers without breaking the content to avoid repetitive a layout that can make the design feel repetitive.Sections with riversA single river component acts as a section and it should not include any child sections within in. Multiple rivers can be used to conform a section. In that case, the section should include a section intro that introduces the main topic or features.DoUse a section intro to introduce multiple rivers.Don’tDon't add child sections or other components to the river body content.River breakoutA river breakout component has an image that fills the width of the container while providing more space for content such as text and lists.This is useful when you want to create a highlight which can be used to create more emphasis or simply break a monotonous vertical flow of left/right rivers. It can also be helpful on smaller viewports to avoid stacking two images or two chunks of text from adjacent river components.As its name suggest, a river breakout should not be the first in the stack, it should be positioned in-between two standard rivers.Some examples of when to use a river breakout:Expand on more complex feature that require more room for contentGive designer a tool to emphasize the feature storyUse a branded wallpaper in a more cinematic way than the standard 50/50 or 60/40 text-to-image column ratiosDoUse a river breakout to emphasize a part of the river or break up a series of river components.Don’tDon't stack river breakouts on top of other river breakout components or center-aligned river components. These both show a full-width image. This diminishes the visual impact the river breakout is intended to provide.The leading content in a river breakout component must always be present, but the trailing content is optional.DoAlways provide leading content.Don’tDon't exclude the leading content.Limit trailing content to a maximum of 500 characters (or two timeline items) to avoid overwhelming the user and disrupting the layout's balance.DoLimit high character counts in trailing content to preserve visual balance.Don’tAvoid using high character counts in trailing content.River story scrollA river story scroll component is used to compose rivers and create a dynamic, scroll-driven presentation. It's a great way to showcase a set of features or topics in an interactive and visually engaging way.CompositionRiver story scroll functions as a self-contained unit and is often paired with a a section intro. To effectively leverage this pattern, use between three and six rivers. For other configurations, simply stack rivers in a standard layout.This component should be used sparingly, at most twice per page, and alternated with other content types rather than placed consecutively. This approach enhances user engagement and keeps the spotlight on key information while preventing user fatigue.Content alignment and visualsContent across the different rivers in a story scroll must share the same alignment; either start or end. This ensures that the content flows smoothly with predictable placement and transitions. Additionally, all visuals in a story should share the same aspect ratio to achieve a consistent effect.DoEnsure all visuals maintain a consistent aspect ratio.Don’tAvoid using visuals with varying aspect ratios.AnatomyContentRiver provides a heading as the main title and a body text as the main content that describes the adjacent visual. The heading should be short and concise and the body should describe the feature or topic in a short paragraph.VisualA river can include either an image or video to illustrate the feature or topic. The media should be relevant to the content and should not be used as a decorative element.Always use high quality images and videos. Avoid using images with text or single logos. Ensure the image fills the provided container.The image is automatically styled to fit the width of the parent container. If you have bespoke styling requirements, you can disable the provided default styles and style the image manually.Additional guidanceWe recommend using a river left as the first river of the flow to start with a visual and avoid stacking text with above section on mobileRiver components stacks create a unit, the set should be considered to be the main parent section. The parent section should be spaced as a regular section with the largest spacing while internal elements should use smaller spacingIf the image is critical for the user to understand the message, default to right aligned. If the text is critical for the user to understand the image, choose left aligned.LinkRiver can include an optional call to action to link to more detailed content about the feature or topic. Avoid using buttons to do so, instead use the regular link built into the component.DoUse the provided link component.Don’tAvoid using buttons.Related componentsPillar: To display non-navigational related content in a compact way.Card: To display navigational related content in a compact way.FooterEdit this page on GitHub"
year_published = 2025
clearnet = "https://primer.style/brand/components/River"
