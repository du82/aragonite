["https://primer.style/brand/components/Text"]
title = "Text | Primer Brand UI"
description = "Use the text component create a range of body text"
full_description = "TextUse the text component create a range of body textOverviewReactOn this pageUsageOptionsRelated componentsOn this pageUsageOptionsRelated componentsUsageUse the text component to provide content and a clear hierarchy structure. The text component renders an HTML <span> tag without any default styling. Use <p> for any text that is meant to be a paragraph of text. Use multiple text components to represent paragraphs as distinct blocks of text. This helps with readability and makes it easier for search engines and assistive technologies to understand the content.OptionsVariantThe text component provides two variant options: default and muted. The muted variant is used to de-emphasize text or to provide visual contrast when paired with a title.DoUse muted text to de-emphasize text and provide additional context.Don’tDon't use standalone muted text. Muted text should always be paired with emphasized text or a title.SizeThe text size ranges from 100 to 700, with 400 as the default size. This scale is built to provide hierarchy for all types of scenarios.DoUse a smaller size to provide visual hierarchy when the text is paired with a title. Use as many text components as needed to represent different blocks of content.Don’tWhen the text is paired with a title, use a smaller size to provide visual hierarchy.AlignmentText alignment options offer a convenient way to control the positioning of content within block level elements.Available options include start, center, and end, which are recommended for supporting bidirectional reading.WeightThe text component also supports weight options. Weight is automatically determined by the text size, but can be overridden when the scenario calls for it.ResponsiveThe text component is responsive by default and the size will scale down on smaller screens. Weight options will remain the same across all screen sizes but can be overridden for each breakpoint.Related componentsHeading: to render headings.Ordered list: to render ordered lists.Unordered list: to render unordered lists.FooterEdit this page on GitHub"
