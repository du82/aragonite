["https://primer.style/components/nav-list"]
title = "Nav list | Primer"
description = "Nav list renders a vertical list of navigation links."
full_description = "🎉 👀 New look, same Primer! Preview the new docs experience here and let us know what you think.Nav listNav list renders a vertical list of navigation links.OverviewReactRailsOn this pageUsageAnatomyOptionsResponsive layoutAccessibilityRelated linksOn this pageUsageAnatomyOptionsResponsive layoutAccessibilityRelated linksUsageA nav list organizes navigation links for the user's current context and indicates which view they're currently on. It is typically used as a sidebar that changes what is rendered in the main content area.StatesResting: The default state. The link is not the one currently being shown.Current: Indicates that this link is the current view being shown.Inactive: Indicates that the link href is unavailable due to a system error. See degraded experience guidelines for more information.Loading: Indicates that the link href is still being calculated. See loading guidelines for more information.Expanded sub-items: The item is expanded to show its sub-items.Collapsed sub-items: The item has sub-items, but they are hidden.Action list item interactive states: Hover and focus states match the action list items.Best practicesNav list items should only ever be links. Do not try and add items to the nav list that are buttons or non-interactive content.If you need to render a list of actions or a list of actions mixed with links, use the action list insteadAvoid inconsistent use of leading visuals. Ideally all items have a leading visual, or no items have them. This keeps the link text aligned at the start of the item, making the links easier to scan.Associate related items using a group or divider when it makes the content easier to understand.Items should be listed in a logical or intuitive order.DoUse leading visuals consistently.Don’tAvoid mixing items that have leading visuals with items that don't.DoOnly use dividers to visually group items.Don’tDon't use dividers to separate individual items.AnatomyNav list items are rendered using action list items, so they share anatomy, styles, and some options.OptionsLeading and trailing visualsLeading visuals are commonly used to show a visual hint for what the item is. For example, an icon or avatar that represents the view being linked to.Trailing visuals are commonly used to show auxiliary information about the item. For example, a count of unread notifications on the page.Nav list items may have both a leading and a trailing visual.Grouped list sectionsYou can semantically group your nav list into multiple lists using groups. You can choose whether or not to show a label for each group.If you want to visually group your nav list into sections but don't want the semantics of nested <ul>s, you may use dividers to visually break your list into sections.Grouping should be used to make long or complex nav lists easier to comprehend.Sub-itemsSub-items may be collapsed or expanded under a top-level nav list item.The top-level nav list item cannot be a link; it only behaves as a toggle that expands and collapses the sub-items.Sub-items may be used to render nested navigation structures. Up to 4 levels of nesting are supported. If you need to handle a more deeply-nested navigation structure, reconsider the design of your navigation or the information hierarchy.Do not replace your NavList with a tree view to support a deeply nested navigation structure. A tree view is never an accessible replacement for navigation, as it serves a different purpose and is not recognized as navigation by assistive technologies.Responsive layoutFor information on responsive layout of a nav list that is used in a sidebar, see the responsive sidebar navigation patterns section of our navigation guidelines for more information.AccessibilityNav lists should always be labeled for assistive technologies, even if the label is visually hidden. Nav list items are links, so they should never contain buttons or other clickable elements.Inactive ItemsInactive nav list items are not rendered as <a> tags since we don't know the href value. The only focusabe part of the item is the leading visual. See the action list accessibility guidelines for more details.Leading VisualsLeading visuals are intended to be decorative only; the context of the leading visual should be provided in the text of NavList.Item. Only the text in NavList.item and any trailing visuals within NavList.Item are included in its accessible name, while anything inside NavList.LeadingVisual will be ignored.Known accessibility issues (GitHub staff only)View open accessibility issues related to this componentRelated linksAction listTree viewFooterEdit this page on GitHub5 contributorsLast edited by TylerJDev on September 16, 2024"
year_published = 2025
