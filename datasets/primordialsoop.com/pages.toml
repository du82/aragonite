title = "SamirBharadwaj.com - Primordial Soop"
description = """
Very early on, blogs began to take on a standard format and visual style. This blog was meant to be text heavy, and part of the aim was to create a rich visual experience to complement the writing.
A lot of organic detail was added into a layout, from a hand drawn swirl around the logo in the header, to three-layers of images to create the textured site background in HTML and CSS.
The work page displayed a portfolio of work as simple thumbnails with short descriptions.
To reward readers who scrolled to the end of long pages, the blog footer was designed as an intricate graphic that doubled as a clickable menu to access the various blog topics."""
