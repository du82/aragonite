["https://primordialsoop.com/ool/2011/create-dappled-light-effect-vector-art"]
title = "Creating a Dappled Light Effect in Vector Images - Primordial Soop"
full_description = "Illustrations from Indian mythology are a theme on my web-technologies and cms software blog, Content Deliverance. When looking for a supporting image for a food blogging post, I remembered the story of Shabari from the Ramayan. I wanted to show Shabari offering Ram fruit, but I also wanted to bring in the atmosphere of the lush forest-garden around the hermitage, where this meeting occurred. I needed to show the complexity of the Shabari character with a fairly simple vector illustration that would be displayed at blog sizes. The visual of dappled light coming through the canopy of leaves was attractive in my head, so I decided that was the way to bring the required seriousness to this image. Producing shadows is always a tricky prospect in digital art; Make it too mathematical and it looks like a trick, make it too organic or fuzzy and it looks like an artist’s fervour gone wrong. Studying how the leaf shadows were created on the figure of Shabari gives a good insight into the organised approach to creating vector illustration. I feel it was a crucial element in the image. I used Inkscape for this illustration, but the same ideas and techniques hold true in any vector graphics software. Working with no visual references, I created a basic figure for Shabari, concentrating on the right silhouette and the basic lighting using linear gradients. I kept the figure simple, because I imagined the dappled light would produce enough apparent detail to create the right impression of form and weight. The figure started out as four vector shapes as shown to the left above, with separate shapes for the two arms, the body, the head and the hair. This was done for the sake of organisation, adjustability, and because those were the pieces that needed different gradient directions and intensities. I had an existing group of foliage shapes from a previous illustration. It was basically a simple leaf shape rotated round to produce a floret of ten leaves of varying sizes. This floret was grouped and then repeated to create foliage. I used the same shapes here for the effect I required."
year_published = 2025
