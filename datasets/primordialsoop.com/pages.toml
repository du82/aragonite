["https://primordialsoop.com/ool/2011/service-productization-process"]
title = "The Service Productization Process - Primordial Soop"
full_description = "I’ve been pondering the creation of a website audit service product here at Primordial Soop recently. I’ve talked about why the need exists for such an audit service, and more recently I’ve explored the advantages of productization for both the client and us as a design studio. To design the service itself, however, is no small task. A factory has little trouble creating its product with regularity and efficiency, but that is only because there was a lot of effort put into the design of the factory and its workings before the first coffee cup, or whatever else, came out of it. This process of setting up the system, part service design, part product design, must be thorough and organised so that the best and most appropriate choices are made as the particulars of the new productized service begin to take shape. This is an exploration of the step-by-step process needed to design the process of a service product, with specific examples for our own website audit service to-be. No matter how far removed from reality it seems, if you could get clients to tell you what they really want, it would be to become the next Microsoft, or Facebook, or some other slightly irrelevant big success story. But what they need is something much simpler and more practical; It could involve getting their existing website to work, show results, attract attention and potential customers, and most likely of all, be found in search engines at some respectable level for related terms. When trying to design a service such as this, it is very important to sort out what you think clients want versus what they really need. As much as it might be a short term gain to promise them what they want, the impracticality of it will catch up with you eventually and ruin your product offering. Concentrate on what the client needs and see how that can be expressed to them in a way that’s compatible with their idea of the problem, and what benefits they will respond to. I’ve spoken before about an informal study I make of new sites I come across, a process to evaluate the effectiveness of a particular site, which doesn’t have any strict rules. Recording the pieces of that process would be interesting in figuring out the most important aspects to concentrate on, since a more comprehensive version of this process will need to be formalised to create this audit service. An account will also have to be made of how many of these considerations are thought of during our more open-ended web design projects, and how many of those issues would be valid to include in our audits as assessments of the site, and also as suggestions for improvement if they are found to be missing. This list of what we already check for, and what we regularly put into websites will be a great starting resource for the itemised list of what goes into the final site audit report."
year_published = 2025
