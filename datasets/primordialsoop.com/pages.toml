["https://primordialsoop.com/portfolio/matteo-coffea-com"]
title = "MatteoCoffea.com - Primordial Soop"
description = """
The visual style and the mood it conveyed was paramount in the design of this site. Coffee shops are very much about the atmosphere and the attempt was to replicate that atmosphere on the web, using the appropriate colours and images.
The site template was made to look sophisticated but also very welcoming, with plenty of visual elements referring back to the actual physical space. The photographic header, which changes on every page, was given prominence in the layout to make this feel as real and warm as possible.
The idea of the many conversations and exchanges of information that go on in a café was taken further by presenting a collection of facts and trivia about coffee and its history. They appear as notes on every page which when clicked lead to an entire page of material.
Adding in an interactive element into the site was of high priority. Social media links to the related Facebook page and blog were featured prominently over the main menu, and a guest-book system was also included to collect customer feedback and encourage the sense of community."""
