["https://primordialsoop.com/ool"]
title = "Design process blog: Origin of Life - Primordial Soop"
full_description = "We’re great supporters of the curious and the inquisitive, so when Melvin of Inquisitive Minds contacted us about doing an interview about our work, we leapt at the idea … well OK, it was more of an enthusiastic crawl, but in our heads there was definitely some leaping involved. A big thank you to Melvin Pereira for inviting us to do this. An excerpt of the interview is below and the link to read it in its entirety follows. Vishal: I’m Vishal Bharadwaj, but not that famous guy who makes those movies. I’ve been working since 2003 when I finally wrenched myself away from the clutches of Academia with most of my vital organs intact. Samir: I’m Samir Bharadwaj, and I’m Vishal Bharadawaj’s brother. No, not the famous guy, the lesser known Academia wrestler. It’s sometimes difficult to make the distinction between when I wasn’t working and when I was, but I’d say since 1998 or so in various freelance capacities. Vishal: I’m a graphic designer, mostly web & identity design, with a healthy side of illustration. I work from home, which means that, yes, I do not have to dress up and go to work. Pants, in fact, are optional. Samir: Graphic Design is the official version of what I do, but it does vary from web design to more traditional print design, to illustration and even writing when the need arises. Generally, design covers all of it. I also wear pants, most of the time. I leave the well ventilated artistry to my esteemed colleague. I’ve been pondering the creation of a website audit service product here at Primordial Soop recently. I’ve talked about why the need exists for such an audit service, and more recently I’ve explored the advantages of productization for both the client and us as a design studio. To design the service itself, however, is no small task. A factory has little trouble creating its product with regularity and efficiency, but that is only because there was a lot of effort put into the design of the factory and its workings before the first coffee cup, or whatever else, came out of it. This process of setting up the system, part service design, part product design, must be thorough and organised so that the best and most appropriate choices are made as the particulars of the new productized service begin to take shape. This is an exploration of the step-by-step process needed to design the process of a service product, with specific examples for our own website audit service to-be. (more…)"
