["https://primordialsoop.com/about"]
title = "About - Primordial Soop"
full_description = "We design a whole range of web sites, ranging from simple web presences to complex dynamic websites and social hubs for you to be able to gather and interact with an audience online in an active way. We use a range of tools to implement these solutions including WordPress, Drupal, Joomla, and any others that suit a particular project. Budget: USD 3000 and above For those who have an existing web presence and need to streamline and sculpt what exists into an efficient and effective solution for their needs, we offer a web site audit service. We study and analyse your web site on various levels including speed, search engine optimisation, design effectiveness, and provide you with a detailed report on the state of things and specific actionable solutions that can be implemented by you, or your IT staff in the case of more technical changes, to make your website a more effective tool for your business or community. Budget: USD 2000 and above As much as the web and digital media are now ubiquitous, there is nothing that can hold the attention of a potential audience or readership as much as a print publication. User attention-spans online are at all time lows, and the printed word is often the way to add a sense of seriousness and commitment to your message. We create arresting book and magazine layouts that are always based on the ideal of readability and usefulness over noise and flash. Things published to paper deserve a respectful attention to detail. Budget: USD 3000 and above A great logo cannot make a bad business good, but a great logo can make a good business stand out from the rest. Having a strong visual identity can be the difference between being one of the many and being the most recognised one in your sphere. We make strong, simple logos and branding identities that are functional, recognisable and adaptable across the vast range of mediums that exist today. Budget: USD 2000 and above Video and motion has taken over the world, both online and off-line. An animated presentation or motion graphics explanation is often the quickest and most engaging way of expressing the benefits of your products, the wonders of your services or the message of your communities. We use a variety of techniques and mediums including hand-drawn animation, 3D graphics and animated typography to show what needs to be shown in the most impressive and effective way possible. Budget: Motion design projects are too varied to make blind estimates. Please contact us with more details if you have a project in mind."
