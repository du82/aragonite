["https://primordialsoop.com/ool/2011/productization-advantages"]
title = "Productization and Its Advantages - Primordial Soop"
full_description = "I find productization to be a fascinating term. It’s one of those so bad it’s good scenarios; So forced, so contrived, and so stinking of business jargon is the term Productization that it is perfectly appropriate for what it stands for. Productization is commonly described as the changing and tweaking of something, either tangible or intangible, to prepare it for being a commercial product. It’s the process of taking an idea, a concept, a method and moulding it into a packaged product. So the term is perfect, because it is in itself an example of productization in an abstract way. While you could use productization to signify the preparatory, pre-production phase of regular physical products, I think it makes the most sense in the commercialisation of services, and more specifically, in packaging and making finite (finitization?) a normally open-ended service, such as design. I have been pondering this subject in relation to my recent thoughts on creating a service product offering from Primordial Soop for the analysis of websites and their optimisation. To really narrow down what this new product should be and should do, I set out to scribble down why productizing such a service is a good idea, for us, for clients, and in what ways it will make our lives better or easier. I was thinking about this specific example, but these ideas should hold true for any similar productization initiative. The costing of websites, or any other design service for that matter, is always a complex issue with clients, because the results seem intangible. The client doesn’t get to hold a website in their hands at the end, so there is no simple gauging of the value they received. Add to this the fact that design services are often indefinite in time and costs, and there is little doubt as to why web sites and web designers scare clients a little. A well-structured service product with a fixed cost and fixed expectations of time-frame and what is deliverable, can put many a client’s misgivings at ease, while also giving them access to the expertise they require."
year_published = 2025
clearnet = "https://primordialsoop.com/ool/2011/productization-advantages"
