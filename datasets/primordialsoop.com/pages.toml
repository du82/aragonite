["https://primordialsoop.com/ool/2011/website-optimization-service-musings"]
title = "Website Optimisation Service Musings - Primordial Soop"
full_description = "Back when the internet was still new and not taken for granted, I got into web design because it was fascinating. One day, someone came along and asked me if I knew how to make one of those “web site things”, and being the adventurous liar that I was, I said yes. Well it wasn’t a complete lie, more like a stretch. I knew what a website was, how it worked, the idea behind HTML, and how things fitted together to create a website, but I’d never made one. Two months after I mildly twisted the truth about my internet knowledge, I did know, and my first website had been made. Such stories are dramatic and invariably gloss over the effort it takes to collect all the knowledge and understanding about things and apply it to practical solutions, ever learning the limits of your understanding and stretching them. But if you’re interested, stretch them you do and your understanding soon becomes expertise, and it cannot be contained in a list of attributes and capabilities any more. That’s the sort of understanding any good designer should maintain in their field. This knowledge and understanding grows into a design intuition in time, where things are measured, studied and looked at in easily understandable discrete steps that anyone could repeat, but the picture that emerges and the analyses and conclusions that are arrived at become more and more removed from any repeatable formula. Such is the gift of experience. The burden of experience is that you become enamoured with handling large projects that truly test your understanding and challenge you to reinvent, create from nothing, and innovate. With that change in outlook, you sometimes lose touch with the mechanics of your craft, and sometimes you lose touch with the people who could use your expertise but simply cannot have you re-inventing things with too much of a fervour, not to mention too much of a cost to them. When your design realities move beyond the ability to solve the problems of most clients, it’s usually time to look deeper at what you do and what you could be doing, because while you wish for your grand sweeping gestures of design and invention, the simple mechanics of function and effectiveness should not be lost. It is a loss of expertise to the client, and a loss of ground level understanding to you; A price neither party can truly afford. There are two distinct ways to move past this impasse, one being to become your own client. Many designers turn to personal ventures as external clients begin to prove less challenging in the good ways, and too challenging in the bad ones. The other route is to find a way to simplify what you offer to meet a broader need."
year_published = 2025
clearnet = "https://primordialsoop.com/ool/2011/website-optimization-service-musings"
