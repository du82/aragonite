["https://principles.design/examples/principles-of-calm-technology"]
title = "Principles of Calm Technology"
description = "Our world is made of information that competes for our attention.What is necessary? What is not?When we design products, we aim to choose the best position f..."
full_description = '''Technology should require the smallest possible amount of attention Technology should inform and create calm Technology should make use of the periphery Technology should amplify the best of technology and the best of humanity Technology can communicate, but doesn’t need to speak Technology should work even when it fails The right amount of technology is the minimum needed to solve the problem Technology should respect social norms Principles of Calm Technology Our world is made of information that competes for our attention. What is necessary? What is not? When we design products, we aim to choose the best position for user interface components, placing the most important ones in the most accessible places on the screen. Equally important is the design of communication. How many notifications are necessary? How and when should they be displayed? To answer this, we can be inspired by the principles of calm technology. Technology should require the smallest possible amount of attention Technology should inform and create calm Technology should make use of the periphery Technology should amplify the best of technology and the best of humanity Technology can communicate, but doesn’t need to speak Technology should work even when it fails The right amount of technology is the minimum needed to solve the problem Technology should respect social norms Author: Amber Case Source: calmtech.com/ Edit this page Question Help Message Streamline Icon: https://streamlinehq.com Do you or your team need help developing your design principles? Get in touch for help, advice or a workshop. <div class="tile ghost" id="contributeTile"> <h2 class="h3 lhs"><a href="https://github.com/benbrignell/principles.design#contributing">Got something <br>to add?</a></h2> <p><a href="https://github.com/benbrignell/principles.design#contributing">Submit an example</a></p> </a> </div> Help needed for "Principles of Calm Technology"! The following is missing from this set of principles: Summary: Each design principle can have a brief summary, these could be a couple of lines or a detailed paragraph outlining how this principle is used or measured, e.g. - principle: Strive to be universal summary: Our aim is to be a resource that is helpful to everyone. We do this by strictly adhering to principles of progressive enhancement… Tip! You may be able to find the missing information at the source URL: https://calmtech.com/. It would be great if you could contribute and update this set of principles with anything that's missing!'''
