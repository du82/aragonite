full_description = '''makes roads safe and useful is inclusive makes roads understandable fits in context is restrained is thorough is environmentally sustainable is innovative is long-lasting is a collaborative process 10 Principles of Good Road Design Design vision "We aim to put people at the heart of our work by designing an inclusive, resilient and sustainable road network; admired for its functional elegance and usefulness, reflecting in its design the beauty of the natural and built environment through which it passes, and enhancing it where possible." Good road design: makes roads safe and useful is inclusive makes roads understandable fits in context is restrained is thorough is environmentally sustainable is innovative is long-lasting is a collaborative process Author: Highways England Strategic Design Panel Source: gov.uk/government/uploads/system/uploads/attachment_data/file/645302/Design_Panel_progress_report.pdf#page=4 Edit this page Question Help Message Streamline Icon: https://streamlinehq.com Do you or your team need help developing your design principles? Get in touch for help, advice or a workshop. <div class="tile ghost" id="contributeTile"> <h2 class="h3 lhs"><a href="https://github.com/benbrignell/principles.design#contributing">Got something <br>to add?</a></h2> <p><a href="https://github.com/benbrignell/principles.design#contributing">Submit an example</a></p> </a> </div> Help needed for "10 Principles of Good Road Design"! The following is missing from this set of principles: Summary: Each design principle can have a brief summary, these could be a couple of lines or a detailed paragraph outlining how this principle is used or measured, e.g. - principle: Strive to be universal summary: Our aim is to be a resource that is helpful to everyone. We do this by strictly adhering to principles of progressive enhancement… Tip! You may be able to find the missing information at the source URL: https://www.gov.uk/government/uploads/system/uploads/attachment_data/file/645302/Design_Panel_progress_report.pdf#page=4. It would be great if you could contribute and update this set of principles with anything that's missing!'''
