["https://principles.design/contribute"]
title = "Contribute"
description = "An Open Source collection of Design Principles and methods"
full_description = "Submitting or editing design principles in the collection If you wish to submit a new example or edit an existing example there are two ways. Submit an example or suggested edit via a short form Submit an example or make an edit via pull request on GitHub. Submissions: Follow the guidelines to submitting a new example Edits: You can make an edit via the GitHub link on a design principles examples page. Guidelines Submissions need to contain the following: A set of original Design Principles A source article or blog post listing a set of design principles in more detail. Along with the principles themselves, a source article would contain something about how you or your team came up with these principles. Consider a few of the following questions: How did you decide on what your design principles should be? What you did you learn? What worked, what didn’t work? How do you follow these principles? Have these principles made your process better? If so, how? You don’t need to cover all these things in detail. Overall we want to know the story behind how you created your principles. Here are some great examples of those that do this: Airbnb Government Design Principles Josh Clark’s “Design in the Era of the Algorithm” You can submit examples from other individuals, companies or teams that you think would be useful to the community."
year_published = 2025
