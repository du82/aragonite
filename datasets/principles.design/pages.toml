["https://principles.design/examples/the-ten-principles-of-inclusive-design"]
title = "The Ten Principles of Inclusive Web Design"
description = "Inclusive Design is where innovation and imagination flourish. Meeting the needs of the widest variety of people does not inhibit creativity. It opens our mi..."
full_description = "Equitable: Be welcoming. Be welcoming, don’t discriminate and engage with people. Create different user experiences and make certain they have equally valuable outcomes. Aesthetics matter. Flexible: Provide options. Provide options. Think who, how, why, what, where & when people will be using your website. Make sure there is choice for diverse users and maintain device independence. Straightforward: Be obvious and not ambiguous. Be obvious and not ambiguous. Make sure your website’s features add value, not complexity. Remember, good design is as little design as possible. Perceptible: Don’t assume anything. Don’t assume anything. Make sure your website’s purpose is clear, its content, structure and sequence are meaningful and convey information to all of the senses. Informative: Be timely, predictable, uncomplicated and precise. Make sure people know where they are on your website and provide different ways for them to find what they’re looking for. Be timely, predictable, uncomplicated and precise. Preventative: Provide easy to follow instructions and gently guide users. Provide easy to follow instructions and gently guide users in interacting with your website. Help them to minimise errors when submitting data, through well considered form design. Tolerant: Handle errors respectfully. Handle errors respectfully and indicate precisely what the error is, where it is and how to fix it. Remember to let people know the outcome. Effortless: Don’t make demands or place restrictions on your users. Don’t make demands or place restrictions on your users. People should not have to work or think hard to find what they want on your website. Ensure it can be used efficiently and effectively. Accommodating: Be approachable, uncluttered and give people room to manoeuvre. Be approachable, uncluttered and give people room to manoeuvre. Make sure that your website is unobtrusive and can be accessed by different devices of all shapes and sizes. Consistent: Follow standards, guidelines, conventions and best practices. Follow standards, guidelines, conventions and best practices. Provide a familiar environment with memorable functionality."
author = "Sandi Wassmer"
year_published = 2024
year_updated = 2024
clearnet = "https://principles.design/examples/the-ten-principles-of-inclusive-design"
