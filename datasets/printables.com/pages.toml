full_description = "This is #5 of 6 very unique trees of my 2024 Christmas Tree LED Tealight collection. The full collection can be found here. Each tree has an inset base for a tealight up to 45mm in diameter. Simply set the LED tealight into the base cup and turn to securely lock the base onto the bottom of the tree. I found that insetting the tealight into the base gives a more full illumination of each tree. Each tree stands approximately 190mm tall and 100mm wide. The only settings I recommend in vase mode are that the outer wall width is set to .7mm and 5 bottom shell layers @.2mm layer height. The base cup unfortunately cannot be printed in vase mode. No supports necessary. -Happy Holidays!-"
