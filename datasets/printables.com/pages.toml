["https://printables.com/model/1133940-canadair-cl-415-bombardier-415-super-scooper-displ"]
title = "Canadair CL-415 | Bombardier 415 Super Scooper | Display Model Multi Color by Extrutim | Download free STL model | Printables.com"
description = "A display model of the Canadair CL-415 / Bombardier 415 in 1:50 and 1:63 scale! | Download free 3D printable STL models"
full_description = "The Canadair CL-415, formerly Bombardier 415, is a specialized firefighting aircraft renowned for its efficiency and reliability. Designed to scoop water from lakes or rivers, it plays a vital role in combating wildfires worldwide.In my opinion one of the most beautiful airplanes which is why I wanted to own it as a display model! I've uploaded the model in two different sizes:- 100% = 456mm wingspan, 316mm long and 133mm high (1:63)- 125% = 568mm wingspan, 395mm long and 167mm high (1:50) Build volume:For the smaller 100% size a height of 208mm is required, for 125% size 260mm.The plane should be easily scalable to at least 150% without the tolerances becoming too large for problem-free assembly.Scaling it smaller than 100% requires a very carefully adjusted filament.The clearance applied at 100% is 0.2mm. Besides some single color parts, the main components are printed with 4 to 5 colors (depending on whether you want to use the same color for the walkways on the top of the plane as for the windows).The individual parts are glued together. The propellers are glued to the shaft and the tip and then clipped into the turboprop engine and are rotatable. When designing, I made sure that all parts can be printed in their optimum orientation. They are already correctly aligned for printing. Apart from the RED_Vertical-Fin part, no supports are required. I have uploaded this part in two versions. With built-in support structure and without.There are different versions of the stand. Straight, tilted upwards and tilted downwards, as well as mirrored versions of the latter. Print instruction:I've refrained from uploading all multicolor components individually for a better overview. Open the files in the slicer and divide the model into parts, not objects! You can then assign the corresponding colors to the parts.I've uploaded a version of the large wings which are connected with two small bridges. This should make the print a little less wobbly, even though printing without these bridges had no negative effect on the print quality for me."
year_published = 2025
year_updated = 2025
