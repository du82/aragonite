description = "Audiophile-grade On-Ear headphones | Download free 3D printable STL models"
full_description = "Faunus 1 is a 40mm Biodynamic Supra Aural headphone with amazing tonality and deep bass extension. Faunus 1 is perfect for those audiophiles out there who love the Koss classics such as KSC75 and Porta Pro, but want to step up their game to higher levels of fidelity. If you don't know how to read FR Graphs then check out my buddy's video on the basics of how to interpret the graphs. DISCLAIMER: Because of the nature of this being DIY there is a high probability that your personal Faunus 1 units will measure differently depending on a number of factors, these graphs are simply indicative of the general target frequency response you will get close to if you follow the instructions. This model is set to [Creative Commons - Attribution - Noncommercial - NoDerivatives] because it is designed purposefully, any changes to the design by anyone other than Capra Audio would no longer be the Faunus 1. This includes using the wrong speakers, wrong pads, or missing or wrong front/rear damping materials. The Faunus 1 is the complete unit itself. It is hard to design and tune a headphone to be good and we do not want our name associated with a potentially worse version of our design."
