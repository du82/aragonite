["https://printables.com/model/24371-filament-clip-grandmas-favorite-filament-clip"]
title = "Filament Clip | Grandma's Favorite Filament Clip by Extrutim | Download free STL model | Printables.com"
description = "I've tested many filament clips, but none was the perfect one. So i designed this little clip. | Download free 3D printable STL models"
full_description = "A simple filament clip which prevents the filament from unwinding reliably!I've tested many filament clips in the past, but couldn't find one that I was 100% satisfied with.Out of this need I have designed this small clip! Since I read all the comments, there are now a few more versions which respond to the personal preferences of some! If you want to support me, please check out the designs in my Printables Store: Click here!Thank you for your support! :) This is the easiest way to attach the clip: Hold the end of the filament between your thumb and index finger, and press down on the previous winding with your middle finger. This way you can loosen the previous winding a bit to make it easier to get underneath with the clip to attach it. Do it a few times and it will be done in a few seconds. Important:Make sure your filament is not over extruded. This can cause the clip to not work as well as it could.I recommend regular PLA, Silky PLA has a poorer layer adhesion which can cause the clip to break. Tip: 2.85mm filament? Just scale the clip in your slicer to 160%.Always have the file at hand: Simply add the clip to the shape gallery in PrusaSlicer. Right click on the print bed in the slicer -> Add Shape -> Gallery -> Add (This is also helpful to quickly access test models). The stronger clip. If you use Silky PLA or another filament with poorer layer adhesion, this scoop will be more sturdy. The clip for beasty filament. Filaments like PC are very slippery and stiff at the same time. The previous turn is clamped much stronger and prevents slipping. The closed clips. If the filament is fed into a Bowden tube these clips can stay on the filament. The hole is shaped so that the filament when it is straight simply slips through, if it is wound on the spool it holds the filament by its bending.There are these two versions, depending on which one you like better in handling."
