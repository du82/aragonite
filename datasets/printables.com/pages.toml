["https://printables.com/model/713445-station-for-bosch-gsr-12v-modular-for-bosch-flexic"]
title = "Station For Bosch GSR 12V | Modular For Bosch FlexiClick 12V GSR GSB GDS GDR by Extrutim | Download free STL model | Printables.com"
description = "A modular station for the Bosch 12V GSR/GSB devices and accessories! | Download free 3D printable STL models"
full_description = "A modular storage solution for Bosch 12V GSR and GSB machines and their accessories!What was originally intended to be just a place to store the accessories for my Bosch GSR with FlexiClick has now become a big modular station. There are various modules, carrying handles, a wall mount and printable rubber feet.Print all files as they are aligned. All overhangs have angles which should be easily printable with all common printers.You just need 3 M3x12mm cylinder head screws per module to connect them. An Allen key with ball head will help you to screw the modules together. Make sure to drive the screws straight into the material. Depending on the flow factor, the screws can be a bit tighter, I have chosen the diameter so that the screws have a good hold even with a small under-extrusion. The one or other module will surely be added to the upload in the future.These files will, of course, cost nothing extra.(Check out the Changelog down below!) The screwdriver rests securely in the holder at the top and can even be placed there without the battery. The wall bracket locks into the holes of the modules in which none of the rubber feet are inserted. The station can therefore be easily taken off the wall bracket. Before you print a module with a bit holder, I recommend that you print this little test to check whether your filament is set correctly and the bits fit well into the holes. There are currently two inserts for the module with storage space. The version with the diagonal tray is for long bit extensions up to 150 mm in length. For the large 4Ah and 6Ah batteries, I have added a module for holding the screwdriver with battery and a module for storing two of these batteries.This module for the screwdriver is slightly larger and protrudes a bit at the front.BTW, the large batteries can also be stored in the other battery holders, but will interfere with other features depending on their position."
