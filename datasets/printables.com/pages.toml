["https://printables.com/model/991053-smaller-tome-for-rpg"]
title = "Smaller Tome for RPG by Bearded Printer | Download free STL model | Printables.com"
description = "Smaller Tome to store your things | Download free 3D printable STL models"
full_description = "Now, before you get all excited, I highly recommend you read the ENTIRE description (with some exceptions) before starting your prints, just to be sure you don't have any regrets. (Who knew you'd be reading a tome in order to print a tome?) Disclaimer: The design was inspired by a friend who asked if I could make a D&D book for her to gift to someone. She knew nothing about D&D and neither did I. So I did some research and spoke with individuals who have played the game to get some ideas of what one might like in a tome like this one. So, if you have any feedback at all or any ideas on how the design can be improved or any additions that I could add to the book, please share! There will be a good chance you'll see some welcome changes if you do. Required Hardware: 24 - 6x3mm magnets (Yes, you'll need 24 of them... lots of magnets. Fortunately, you can usually buy a pack of 50 or 100 for $5-$10) The 3mf file provided was sliced in OrcaSlicer and has recommended configurations for printing each piece of the main tome. The dice tower included in this model is slightly different from the one included in the master tome. The one included with this model doesn't have a door as it doesn't need one to guide dice into the main part of the book. All magnets should have a press fit tolerance. However, because of the different variations of printers out there, you may find you need to glue yours in or you may have to use brute force. Note: When installing magnets, be extra sure you're installing them in the proper orientation so they attract each other. I've made mistakes and don't want you to repeat them. The Book Front Hinge Interface is meant to be glued into where the book binding would be on the front cover. It's designed so, if you try to place it incorrectly, it won't fit right. (I'm considered implementing some sort of fastening implementation to attach the hinge interface to the front cover. So if that's one of your gripes, stay tuned). When snapping in the hinge links, it is recommended that you snap the hinge links into the Book Back portion of the book, first, before snapping them into the Book Front Hinge Interface. I've just found it easier to do it in this sequence."
