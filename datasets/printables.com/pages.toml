["https://printables.com/model/891812-ouroboros-closed-back-audiophile-headphones"]
title = "Ouroboros Closed Back Audiophile Headphones by Capra-Audio | Download free STL model | Printables.com"
description = "High-End, Audiophile-grade, 3D printable closed back headphones. | Download free 3D printable STL models"
full_description = '''Ouroboros is a closed back headphone designed and intended for people who value high quality audio. With a dark-tilted tuning and a decent bass shelf these cans sound both fun and high fidelity. The ring-radiator driver (similar to the one on the legendary HD800 and HD800s) is the reason behind the name Ouroboros as when we first laid eyes on it we were reminded of the serpent eating its tail. Although the driver is sold as a "coaxial dual driver" speaker, we do not use the small beryllium tweeter as a speaker, instead we de-solder the connections to it and allow it to operate as a passive radiator between the front and rear volumes . The Bill of Materials can be found here.The Assembly Instructions can be found here or watched here.The Headband files can be found here. If you have any questions, comments, concerns, or just want to talk about headphones and headphone design join our discord, link in my bio. Additional Affiliate Links if you want to support us further:Polymaker 95a TPUPolymaker PLA ProPolymaker PETG If you don't know how to read FR Graphs then check out my buddy's video on the basics of how to interpret the graphs. DISCLAIMER: Because of the nature of this being DIY there is a high probability that your personal Ouroboros units will measure differently depending on a number of factors, these graphs are simply indicative of the general target frequency response you will get close to if you follow the instructions. This model is set to [Creative Commons - Attribution - Noncommercial - NoDerivatives] because it is designed purposefully, any changes to the design by anyone other than Capra Audio would no longer be the Ouroboros. This includes using the wrong speakers, wrong pads, or missing or wrong front/rear damping materials. The Ouroboros is the complete unit itself. It is hard to design and tune a headphone to be good and we do not want our name associated with a potentially worse version of our design.'''
year_published = 2020
year_updated = 2020
