["https://printables.com/model/484286-extrubox-enclosure-non-permanent-printer-housing-s"]
title = "Extrubox Enclosure | Non Permanent Printer Housing | Scalable And Customizable by Extrutim | Download free STL model | Printables.com"
description = "The Extrubox, a non-permanent enclosure, adaptable to any printer size and removable from your printer in seconds! | Download free 3D printable STL models"
full_description = "The Extrubox, a non-permanent enclosure, adaptable to any printer size and removable from your printer in seconds! a high quality printer enclosure customizable in size and removable within seconds from your printer when you want to work on it, when you want to use it for several printers or when you just don't need it right now! This article is a little longer, please read it carefully, I've made every effort to leave no questions unanswered, but if there are any I'm available in the comments section! So, why the Extrubox?I wanted to have an enclosure but didn't want to lock my printer permanently in a tight box so that I could work on the printer without having to lift it out. I have several printers with different features that I use to print different things. Sometimes I need an enclosure on one printer, sometimes on another. Therefore, I don't need multiple enclosures. This is how the idea of the Extrubox came about, which I can simply place over the printer where I need it at the moment. For maintenance work, etc. the printer can remain in place. The rear panel, which is attached with magnets, is simply removed and the housing is taken away from the printer. The goal was to create a high quality enclosure that each of you who can also operate a printer can easily build yourself at home and is scalable to your desired size. For me, this includes a simple, functional and chic design. You can order the 3030 aluminum extrusions and panels (I recommend polycarbonate instead of acrylic, as it's much easier and safer to work with) custom online, more on that further down in the article. I chose 3030 extrusions because they are also used for many printers (e.g. Prusa) and therefore there are already some accessories and attachments available. (Description also available as .pdf in English and German!)__________________________________________________________________________________________________________________ Dimension of the Extrubox:The dimensions of the 3030 extrusions and the panels refer to the size of the box which you can see in the photos. Compatible with Prusa i3 MK2/MK2.5/MK3/MK4 and many other printers in this size range. How to adjust the enclosure to your desired size you will find out in a section below."
