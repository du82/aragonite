full_description = '''This is a portable Handheld based on Frameworks 13" main board. Designed to be solderless and easy to assemble! -Better airflow. cools down the battery and other components better, and no longer has overheating issues. Performing 2,600 points higher than average with an intel 1240p in future Mark's night raid. Are you tired of buying the newest gadgets only to throw them away five hours later because the next best thing just came out? Introducing the Beth Deck, The future-proofed completely upgradable handheld. Guaranteed to always play the latest games and apps far into the future! (as long as Framework continues to support their 13" mainboards) The whole thing can be assembled in about 15 minutes and disassembled in less than 2 minutes with no soldering and all non-printed parts can be purchased!Parts list5X M3x25mm button head screws 1X USB-C 90-degree adapter ( For the USB hub, this one is smaller than the other)1X USB-C 90-degree adapter (For charging and docking)2X 1.25" speakers (They need soldering, but they sound much better in the new case. Maybe everything being more compact helped? I don't know.) TO BE CLEAR, I'VE PUT THIS TOGETHER IN 15 MINUTES, BUT I'VE DONE THIS LIKE 20 TIMES. TAKE YOUR TIME. YOU'll SAVED MORE TIME BEING CAREFUL, I PROMISE YOU PLA does not work; it's too brittle. The top shell has many small features designed for injection molding. Watch out for warping. The controller might not work properly, specifically, the triggers that use Pogo pins. Use materials like ABS PETG or Composites. Depending on your materials, you might have to change your settings to compensate for warping. Make sure you have all the components. Disassemble the SMX Controller down to its individual components and keep all the screws. Keep both PCBs connected by their ribbon cables but disconnect the joy stick PCBS. Remove the USB hub from its enclosure by removing the plastic clip on the front and back. Place M3 heat-set inserts into the top shell of the beth deck. You can look up how to do this on YouTube if you don't know how. you can do it with a soldering iron or a lighter and a M3 bolt. try to get it straight in though.'''
