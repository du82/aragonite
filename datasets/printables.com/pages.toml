["https://printables.com/model/521805-planetary-phone-stand"]
title = "Planetary Phone Stand by Clockspring | Download free STL model | Printables.com"
description = "It's an overly-complicated geared phone stand that will make it very clear to everyone that you're into 3D printing :D | Download free 3D printable STL models"
full_description = "It's an overly-complicated geared phone stand that will make it very clear to everyone that you're into 3D printing :D Do you need an overly-complicated way to prop your phone up, one that says to everyone around you that you have a 3D printer? Then this is the model for you! The angle of the stand adjusts by pivoting on a set of planetary gears, and is then fixed in place by tightening a sliding bolt form the opposing side. This is a model with a few parts that print in close proximity to each other! So, you'll want to make sure your bottom layer is nice and neat, and that you don't have any issues with stringing, overextrusion or anything else that might bind moving parts together! I'm really blown away by the amount of love people have had for the Planetary Phone Stand! A common refrain was that a wider version would be very useful, so there's now one that's roughly 80mm wide, instead of about 60mm wide, which suits larger phones, and various other things people like to put on stands. There are a few changes to help a wider stand stay balanced and supported, and the overall size on the print bed has increased accordingly, so it's probably not going to fit in a 180mm square now! How many versions of the Planetary Phone Stand are there now?! Well, now there's another! By popular request, there's now a version that has a finer angle adjustment. Now, the big issue with adjusting the angle is the trade-off between granularity and reliability - there's no point having fine adjustment if the thing doesn't stay where it's supposed to once there's a phone on it! This new version has just over twice as many positions, and so far it seems pretty good at staying where it's supposed to!"
year_published = 2023
year_updated = 2023
