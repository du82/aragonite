["https://printables.com/model/644706-popsicle-box-single-material-print"]
title = "Popsicle Box (single-material print!) by Clockspring | Download free STL model | Printables.com"
description = "It's a container with a secrete screw-thread base that also happens to look like a popsicle! | Download free 3D printable STL models"
full_description = "Yes, it's another entry in the questionable food choices boxes collection! Someone seems to have taken a bite out of one of them, though :) The Popsicle Box opens from the bottom with a rotation of the handle, which is in turn engaged with a captive bolt that will open things up. The handle slots into the bolt via a hexagonal slot, and then a nut threads onto the top to keep the handle in place. This is a single-material print, by the way, including the bite! There's an insert that prints separately and prints into place. There are two versions provided - once with a 0.3mm tolerance and one with 0.2mm. The latter is intended for printers that have high accuracy and would otherwise produce a fairly loose fit. That said, you'll probably want to just pop some glue in there anyway to keep it in place. This is an articulated print, so make sure your bottom layer is nice and neat and that there aren't any print issues like stringing or overextrusion that might bind moving parts together. The main popsicle top part is the largest part, and occupies 58mm x 25mm on the print bed, and is 103mm tall. This one should scale up or down a little, but at some point you'll have problems with the screw mechanisms and the fit of the parts! It's always interesting to look back on which bits of a design took the longest, and in this case, I'd say the shape of the bite took far longer than anything else! Getting a stylised bite that looked satisfyingly correct instead of slightly wrong was much trickier than expected, but well worth persevering for!"
year_published = 2023
year_updated = 2023
