["https://printables.com/model/212195-filament-sample-box-infill-color-swatch-fully-prin"]
title = "Filament Sample Box | Infill / Color Swatch | Fully Printable by Extrutim | Download free STL model | Printables.com"
description = "A Filament Swatch with fully printable Box! | Download free 3D printable STL models"
full_description = "The old box design was a remix of this Design which I generously reworked back then. Nevertheless, the old design needed screws and magnets. The samples of course remain unchanged. Time to give the box a complete overhaul from the ground up!I've designed a completely new box which is fully printable, so no more screws and magnets, plus there's space for a label strip to organize your samples and keep track of them. The box is available in different sizes, from 30 to 180 slots in case you want to build up a complete database of filaments. The smallest box with 30 slots fits on a print bed of 180mm, the larger boxes need a print bed of 330mm. The strip for labeling is 100mm long, you can simply scale it to the desired length in the slicer, so you can adjust it to the required number of slots it should cover. Print all parts as aligned, supports are not required. The clip and pins have snap-in points, make sure before printing that your filament is not over or under extruded to get the correct fit. The clip needs to be pushed into its place with a little force. There are two different types of samples. Sample-A has different thicknesses so you can determine how translucent your filament is. Sample-B is simply flat, with this you can show different infills for example by increasing the number of perimeters and setting the top and bottom layers to zero.Also have a look at the Remixes tab, there are many more samples from other users! If you want to support me, please check out the designs in my Printables Store: Click here!Thank you for your support! :) The files from the old box are still there and can be found in a folder in the files.Old description down below ↓ I have modified the model according to my wishes and additionally created a version which is printed in two parts and connected with two M3x30 screws, as well as a version which fits on the Prusa Mini and one with only 20 slots for samples. The other will hold 30 filament samples.I enlarged the holes for the four magnets, now 8x3mm magnets fit inside. For this, a pause is inserted in the slicer at a height of 22.2mm and then the magnet inserted with some glue or tape."
year_published = 2024
year_updated = 2024
