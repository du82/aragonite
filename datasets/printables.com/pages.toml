full_description = '''About 3D Models 24 Store 2 Makes 1 Activity Collections 1 12 corteXcrank @Gdoniu93_219588 published a new model January 28 at 9:02 AM January 28 at 9:02 AM Multiconfiguration WAGO Junction box FREE Hobby & Makers Electronics 3,432 5 4,415 Show older comments 18 Pissman2020 @Pissman2020 If you know what you're doing, and if you're using a junction box, you almost definitely do, a box like this should not cause any issues, but I can 100% see insurance denying a claim because you used a non certified box. I know that would be the case in North America if they found out about a DIY junction box, even if it couldn't have possibly been the cause of any damage. Reply 4 likes February 13 at 4:58 AM P 3 PepperNickel @PepperNickel_211977 @Pissman2020 Independent adjuster here, an insurance adjuster would have to go out of their way to make a deal about it. The desk adjuster would only make a deal out of mistakes in electrical work if that happened to be the cause of loss. I totally agree with using a real junction box if you're installing in any structure. Perfect for electrical harnesses in low-powered equipment. It opens the door for longer-lived projects. Reply 1 like February 13 at 11:38 PM 18 Pissman2020 @Pissman2020 @PepperNickel_211977 yeah for low voltage stuff, this is amazing, for mains voltage, I just wouldn't risk it Reply 1 like February 14 at 12:05 AM 23 Algernon @Algernon I would be very careful on the choice of material, I consider the printing of installation boxes for electronics without the necessary professional expertise as a particularly dangerous pastime.Otherwise as far as the technical execution of the model is concerned, very nice work. Reply 8 likes February 13 at 6:55 AM Ctrl⌘ + Enter to send Enter to add a new line Attach picture POST 12 corteXcrank @Gdoniu93_219588 published a new model January 5 at 4:25 PM January 5 at 4:25 PM Articulated Arm Gadgets Photo & Video 765 5 1,203 Show older comments 8 Jorx @Jorx_1670024 Great d