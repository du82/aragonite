["https://printables.com/model/542130-skull-tome"]
title = "Skull Tome by Clockspring | Download free STL model | Printables.com"
description = "It's a book-style box with skulls!  Skulls, I say!  And it'll hold cards and fit on a Prusa Mini, too. (#562) | Download free 3D printable STL models"
full_description = "It's a book-style box with skulls! Skulls, I say! And it'll hold cards and fit on a Prusa Mini, too. (#562) The whole Printables launch thing felt like it deserved something special, and this is a model I'd been working on for a long time: the Skull Tome! It's a book-shaped box! With skulls! What more could you ask?! It also has some very specific sizing both inside and outside - let's have a look... Well, first, let's look at how this thing works! The cover/lid swings open by splitting the spine of the book in two, rather than just having the hinge sit on the spine itself. This allows the pivot point to be set back into the book itself, rather than on the outside, which in turn keeps the lid closer to the body of the book while open. So, those size constraints! Well, first and foremost I wanted this to fit cards that are 90mm tall and 64mm wide, which is the larger of the two standard playing card sizes and used for many game cards, too. So, that meant that the volume of the main body of the book had to be at least those dimensions (plus the thickness of the walls, of course). However, I was also determined to make this printable on a 180mm print bed, and that's where the design of the hinges comes in, and one reason why the cover prints vertically instead of flat. The other reason, of course, is that that the skull wouldn't work face-down! This is an articulated print, so ensure your bottom layer is nice and neat and that there aren't any print issues like stringing or overextrusion that might bind moving parts together! There are spaces for magnets in the top and bottom edges of the book body, and in corresponding places in the lid. These are purely optional, of course and just keep the book a little more firmly closed than it would be without them. If you'd like to add magnets, you'll need sixteen of the magnets we always use around here - 6x3mm cylindrical ones! Of course, you could use fewer than that, too, depending on how much magnetism you want to add :) Note that the multimaterial files are intended for use in machines that can print in multiple filaments in the same print, like Prusa MMU, Bambu AMS, and Mosaic Palette - they are not meant for separate printing and assembly :)"
