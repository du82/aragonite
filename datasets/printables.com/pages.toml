full_description = '''About 3D Models 117 Club & Store 17 Makes 129 Activity Collections 26 36 Jerrari @Jerrari published a new post February 26 at 4:11 AM February 26 at 4:11 AM Is a MINI drawer smaller than a MEDIUM drawer? Soon you won't have to wonder any longer. The GEN2 naming scheme is upgrading to clearly communicate the size right in the name!This process is still going to take a few days of work to fully complete, so don't panic! I'm also working on new animations, illustrations, and written instructions to compliment the latest designs and assemblies.For the latest changes keep an eye on the projects website: https://www.jerrari3d.com/gen2-modular-systemI have a bunch of new models on the horizon but I have to get through the technical stuff first 😜 15 Show older comments 36 Jerrari @Jerrari An example of a model name would be like this for example:GEN2-185D-2W-1H-Drawer(Depth - Width - Height) (edited) Reply 1 like February 27 at 1:11 PM H 8 Hippo @Hippo_374075 @karenchaudesigns Oh, thank you for mentioning this! I would have never expected this to be a length due to the syntax. A number followed by „L“ in the context of a storage container would always mean the volume in liters to me. Maybe it‘s a regional thing. But it would be good to clarify to avoid future misunderstandings! Reply 2 likes February 27 at 9:12 AM Ctrl⌘ + Enter to send Enter to add a new line Attach picture POST 36 Jerrari @Jerrari published a new post February 24 at 3:13 PM February 24 at 3:13 PM Come hang out with me on tonight's episode of Hot Makes, it's a fun live stream and a great place to find inspiration if you're looking for things to print. I plan on talking about the GEN2 System and my other fun side projects as well. I hope to see you there:YouTube 7PM ET: https://t.co/g78wuVkfkV 6 Ctrl⌘ + Enter to send Enter to add a new line Attach picture POST 36 Jerrari @Jerrari published a new post February 21 at 1:42 PM February 21 at 1:42 PM Good morning, Hey I'd love to hear your opinion. Since the dawn of the GEN2 system I have been working hard on making sure it's clear and easy to understand especially if you're discovering it for the first time, which many of you have done at some point. What I'd like to know is did it make sense or did the naming scheme confuse you?Where I'm getting at is looking at an updated nomenclature that wouldn't alienate what already there, but instead make it more clear.This is just an example of what I'm thinking (ignore the number values in the image, they are just placeholders)I'm mostly focusing on the making it easier to identify the drawer sizes in a way that makes it clear the depth, width, and height. I would also continue to use colors like I currently do as a quick visual identifier for drawer depth.Thank you 8 Show older comments 10 UncleJeff @UncleJeff_2650063 I like the idea of 3x1 or 3x2 or whatever, with the actual measurements as a subheader. the current nomenclature works well enough, but I see the need for a clearer way to list things. Reading through many of these comments makes it clear that some like the actual measurements, but once you start multiplying a number like 88 in your example I see how it could get confusing. (edited) Reply 1 like February 22 at 4:50 PM 36 Jerrari @Jerrari @byWulf That’s a great point, and I’ve been going back and forth on this for a while. My concern with switching entirely to raw number values is that it could introduce more confusion, especially with Decor faceplates. For example, a 2W-1H faceplate is designed to match a 185L-2W-1H Decor Drawer, but if we switched to raw numbers, it would instead be labeled as a 176W-56H faceplate for a 185L-176W-56H Decor Drawer.This could make it harder to quickly recognize which parts are compatible, since users would have to compare a lot of raw numbers instead of a modular naming system. However, that doesn’t mean I won’t include the raw dimensions—I plan to add them as a subheading or additional detail in documentation and listings.One issue I see right now is that there’s no clear guide explaining the unit system, which might be causing the confusion. A visual reference guide showing how the W and H units translate to real-world sizes could help clarify this for both new and existing users. Do you think that would be a good approach? Reply 1 like February 23 at 1:29 PM Ctrl⌘ + Enter to send Enter to add a new line Attach picture POST 36 Jerrari @Jerrari published a new post February 18 at 11:17 PM February 18 at 11:17 PM Hello everyone, I want to cross promote a project for a friend who has helped a lot on the prototyping side of the GEN2 project over the last few years. He is beginning his journey on YouTube and it would mean a lot to him if you could check out his work.Do you enjoy 3D printing but also want to learn how to combine electronics into your projects? Check out this tutorial from my good friend The 3D Printing Pilot: https://www.youtube.com/watch?v=qERUTgcUb6gHe's a wealth of knowledge at combining these two mediums and has worked hard to tie this all into his first ever YouTube tutorial. Download: https://www.printables.com/model/1193708-youtube-subscriberviewers-counterThank you,Joey 7 Show older comments 36 Jerrari @Jerrari @Balvenie_447227 Thank you, that means a lot to him 😊 Reply 1 like February 18 at 11:34 PM 33 FAYRON @fayron_3d Great project! I'm glad to see that our Utility Knife - F1 Gen.2 https://www.printables.com/model/1104014-utility-knife-f1-gen2 is being used in this work. We're considering how to showcase it on our FAYRON channel https://www.youtube.com/@fayron_global to further explore the combination of electronics and 3D printing.Congrats again on the great idea! Reply 2 likes February 19 at 6:58 AM Ctrl⌘ + Enter to send Enter to add a new line Attach picture POST 36 Jerrari @Jerrari published a new post February 17 at 3:01 AM February 17 at 3:01 AM Wow I guess the GEN2 Decor Filament Drawer was something people really wanted this weekend lol. I decided no time was better than the present to also update the original filament drawer. This updated version uses less material to print with the updated body and also includes the new pre-sliced divider files. https://www.printables.com/model/270907-gen2-filament-drawer-standardIf you missed the launch of the Decor version that's available here: https://www.printables.com/model/1189655-gen2-decor-filament-drawer-standard 9 Ctrl⌘ + Enter to send Enter to add a new line Attach picture POST 36 Jerrari @Jerrari published a new post February 15 at 11:52 PM February 15 at 11:52 PM Hope you all are having a great weekend! It's been so snowy here, but that makes a great excuse to design some new 3d models to print. 😜Today I'm releasing the GEN2 Decor Filament Drawer. At my day job I work with many plastic and acrylic sample materials to help match them to paint and pantone colors. I wanted to make sure these chips functioned exactly the same way. At home, whenever I'm planning out a multi-color print I always grab chips from this drawer to see how they work together, which makes it so much easier that hunting through my piles of spools or guessing.Download yours: https://www.printables.com/model/1189655-gen2-decor-filament-drawer-standard 6 11 Jagermeister @Jagermeister_2725245 awesome! Reply February 16 at 12:22 AM 11 trampi @trampi_2404201 Thank you - perfect timing, will certainly print it soon :) Reply February 16 at 7:20 AM Ctrl⌘ + Enter to send Enter to add a new line Attach picture POST 36 Jerrari @Jerrari published a new model February 15 at 11:38 PM February 15 at 11:38 PM GEN2 Decor Filament Drawer - STANDARD 3D Printers Accessories 45 5 97 Show older comments 17 dotmakes @dotmakes_925570 Another great addition to this fantastic system! Reply 1 like February 21 at 5:01 PM Prusa MK3/S/S+ 20 ZoBumifoo @ZoBumifoo Took awhile but I finally got all my filament samples printed and labeled. Reply 1 like March 1 at 7:08 PM Bambu Lab X1 36 Jerrari @Jerrari That turned out so good! I like that color combo for the faceplate too Reply 1 like March 2 at 12:15 AM Ctrl⌘ + Enter to send Enter to add a new line Attach picture POST 36 Jerrari @Jerrari published a new model February 13 at 1:55 AM February 13 at 1:55 AM GEN2 - STEP Files - STANDARD Hobby & Makers Organizers 8 0 Ctrl⌘ + Enter to send Enter to add a new line Attach picture POST 36 Jerrari @Jerrari published a new post February 11 at 3:12 AM February 11 at 3:12 AM Is that a GEN2 Decor Filament Sample drawer I'm working on... Yes, yes it is 😂 14 Show older comments 8 Chase York @Chase_Money_2614736 Will there possibly be a remix for the popular Thingiverse swatch found here: https://www.thingiverse.com/thing:3346069 ? Reply February 13 at 4:52 AM 11 Jagermeister @Jagermeister_2725245 @Jerrari It is the left to right wiggle when you slide it out. I understand the up and down play is because it is basically half the height of a slim drawer. Reply February 13 at 1:47 PM Ctrl⌘ + Enter to send Enter to add a new line Attach picture POST 36 Jerrari @Jerrari published a new post February 7 at 2:07 PM February 7 at 2:07 PM A few years ago I designed a GEN2 parts drawer, I found it very useful for storing and organizing small items such as machine screws. I've been wanting to release a version for the Decor series but I wanted to improve one majorly important part of the parts drawer, and that was labels. My goal was to make 3D printable labels that could be easily printed and swapped around. After a bunch of revisions and tiny tweaks I finally have a design that I'm very happy with.I'm starting with the "GEN2 Decor 2x0.5 Decor Parts Drawer V2 - STANDARD - 15 Slot" to get started, but I will be bringing out plenty more now that I have the core design figured out.This model is currently exclusive to club members as a thank you for all of your support, it makes reworking these models absolutely worth it. https://www.printables.com/model/1181105-gen2-2x05-decor-parts-drawer-v2-standard-15-slotI'm also releasing the Bin Drawers - Extended Sizes model from the club today so that anyone can download it https://www.printables.com/model/959272-gen2-ql-bin-drawers-extended-sizes-standardThank you,Joey 8 T 3 Th.Balslev @ThBalslev_2819094 It looks perfect, but what about the same type just for the large drawers? (edited) Reply February 11 at 7:53 AM Ctrl⌘ + Enter to send Enter to add a new line Attach picture POST 36 Jerrari @Jerrari published a new model February 7 at 3:51 AM February 7 at 3:51 AM GEN2 Decor 2x0.5 Decor Parts Drawer V2 - STANDARD - 15 Slot Hobby & Makers Organizers 23 5 Show older comments 28 byWulf @byWulf Settings: 0.4 nozzle // 0.2 layers // 15% infill // no supports Filament: eSUN PLA+ Black, Cold WhiteWonderful upgrade to the old part drawers. The label plates are very easy to attach and hold securily in place. I printed them face down on a PEI printplate for a nicer finish.Can't white for the other part drawer sizes (3x3 buckets etc) to have these exchangablr labels too! (Or did I just not find them? ^-^'' )Thank you a lot for your long and hard work on the GEN2 system! Reply February 20 at 10:11 PM Bambu Lab P1P 28 byWulf @byWulf Additional feedback to the function of the compartments: It seems to be harder to get all screws out compared to the old version of the parts drawer. I think that has the following three reasons:1. The "ramp" in the front of each compartment got smaller. The old ramp was bigger and helped more to lift up the little screws2. The screw holes for the faceplates let some of my stored screws go partly into these holes instead of coming out of the compartment when trying to pull them towards me up the inner ramp (only for the first row of compartments obviously)3. Some screws hide underneath the label of the next compartment making it hard to know if there are still screws in the compartment or not. Perhaps you could add another little ramp underneath the labels so not much space gets wasted but still pushes the last screws forward into the viewport? Reply February 20 at 10:25 PM 28 byWulf @byWulf And another question: How can I remove the compartment label plates again to replace them? Currently there is no way with my bare fingers. Perhaps a little gap at the top of the plate between the plate and the upper wall for the fingernail or so would be handy. I now used a screwdriver there to kick them out again. Reply February 21 at 2:58 PM 16 Jozo7 @Jozo7Jozo_1460584 Jako vždy vše perfektní.Tisk 0.4 tryskou, vrstva 0.2 a infil 20%,PLA. Reply March 1 at 7:44 PM Creality CR-10S Ctrl⌘ + Enter to send Enter to add a new line Attach picture POST 36 Jerrari @Jerrari published a new post February 2 at 5:08 PM February 2 at 5:08 PM Gridfinity Expansion kit is now available for the GEN2 Table Top Kit V2 - STANDARD!This allows you to add as many grids as you'd like seamlessly no matter how many drawer widths you made your table top kit. https://www.printables.com/model/1172721-gen2-table-top-kit-v2-gridfinity-expansion-standar 8 Ctrl⌘ + Enter to send Enter to add a new line Attach picture POST 36 Jerrari @Jerrari published a new model February 2 at 5:29 AM February 2 at 5:29 AM GEN2 Table Top Kit V2 - Gridfinity Expansion - STANDARD Hobby & Makers Organizers 57 5 116 8 TM @TM_2930380 Love it! Can we expect a Medium Version with magnets? My Tilt Drawers will only truly be complete with some Gridfinity on top! (edited) Reply February 26 at 10:10 PM 17 HespoHusky @HespoHusky I love both the GEN2 and Gridfinity systems and I'm very happy that you've combined them! Reply 1 like February 16 at 2:58 PM Prusa MK4 Ctrl⌘ + Enter to send Enter to add a new line Attach picture POST 36 Jerrari @Jerrari published a new post January 28 at 3:08 AM January 28 at 3:08 AM A little teaser for something I'm currently designing. I think this will be a pretty slick improvement over the original! 7 Show older comments 36 Jerrari @Jerrari Great guess!lol I know right, it looks weird isolated to this single part. So another clue, this is a small section of a model, there would be multiple of these things on there. Reply January 28 at 2:52 PM 16 Sean Saunders @SeanSaunders Is it bad that I have no idea what this is? Reply 1 like January 28 at 12:29 PM Ctrl⌘ + Enter to send Enter to add a new line Attach picture POST 36 Jerrari @Jerrari published a new model January 25 at 10:41 PM January 25 at 10:41 PM GEN2 2x0.5 Slim Double Drawer - LARGE Hobby & Makers Organizers 11 0 66 5 3DSniper @3DSniper_862402 Any chance on Variations of these? (different insert setups) Ive only been able to find plain open.I wound up making some inserts myself that allow some customization at 20mm intervals width wise, and set 40mm space between rows depth wise. Reply February 11 at 4:17 PM Ctrl⌘ + Enter to send Enter to add a new line Attach picture POST 36 Jerrari @Jerrari published a new model January 25 at 10:21 PM January 25 at 10:21 PM GEN2 1x0.5 Slim Single Drawer - LARGE Hobby & Makers Organizers 5 0 48 Ctrl⌘ + Enter to send Enter to ad'''
