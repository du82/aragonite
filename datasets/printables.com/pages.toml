["https://printables.com/model/644708-transposition-tank"]
title = "Transposition Tank by Clockspring | Download free STL model | Printables.com"
description = "A crazy, complicated steampunkish mechanical box with a geared, threaded lid! | Download free 3D printable STL models"
full_description = '''Well, look at this complicated bunch of gears and threads! It will not surprise you that I set out to make a mechanical design that was intentionally convoluted just for the sake of it! You see, I had a spool of filament that was just demanding such a design, and who am I to resist such a call? I had the great pleasure of visiting Protopasta in the US, and boy are they a fun bunch of people! Alex at Protopasta is a filament magician and a very patient fellow. I rolled in with my bestie Courtney from Filament Stories and Alex watched as we piled the meeting room table with containers of arcane elements, glinting and gleaming. Something caught my eye - a gold base that wasn't super smooth, but also wasn't coarse, and it had a kind of industrial character to it that I just immediately loved. I waved my arms around enthusiastically and tried to convey desert hues with reds and oranges, rich but not too bright, with shifting variations. I have no idea how Alex managed to work out what I was talking about, but he knew exactly what we needed, and soon we were at the extrusion line, manually dropping tiny bits of colour into the process at just the right moment to get just the right kind of colour changes. I did mention that Alex is a filament magician! And wow, it's a magical thing to see it all appearing at the other end on the spool! "Desert sunset!" exclaimed Alex! But it immediately made me think of industrial rust, too... And so that's how we got here to the Transposition Tank! I wanted something with lots of detail and complication! But I also wanted to try something I hadn't done before, and in this case it's the combination of a screw thread mechanism and planetary gearing. There are two main considerations here. Firstly, the screw thread and the gearing have to coexist without getting in each others' way, which is easier said than done since they also have to move past each other as the lid is placed into the container body. Secondly, the screw thread needs to pull the gears into a locking position so that things end up nice and secure.'''
year_published = 2023
year_updated = 2023
