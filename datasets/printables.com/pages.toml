["https://printables.com/model/301272-prusa-mk3-mk4-body-kit-the-bulletproof-wide-body-m"]
title = "Prusa MK3 MK4 Body Kit | The Bulletproof Wide Body | MK3 MK3.5 MK3.9 MK4 MK4S by Extrutim | Download free STL model | Printables.com"
description = "A visual upgrade for the Prusa MK3 and MK4 series! | Download free 3D printable STL models"
full_description = "A machine that runs and runs and runs gets a look that is equal to this.In December 2020 I released the Ultimate Prusa Casing, the response was tremendous. For me it was clear, there must be a successor and here it is. The body kit for the MK3 and MK4 series is a purely optical upgrade which is designed solely to ensure that you have even more fun with your printer! It is a solid model which, when mounted correctly, doesn't produce noise or increase the footprint of the printer. For the assembly you only need a few screws, a list is given below.I highly recommend printing this case out of a matte PLA, it will improve the visual quality immensely! A 750g roll of filament is sufficient for this, the entire model can be printed without supports. Print Instructions:I recommend a layer height of 0.2mm, the largest parts are the two side parts, to save time it is worthwhile to lower the infill to 15% and from a height of 10mm to 5%.You don't need any supports for the print. (MK3) There are four different traverses, three different logos and one without. Also two variations of the knob for the LCD cover, you can of course use any other knob.The SD card gets a handle that makes it much easier to use. Normally it's enough to just push the card in, but if it's too loose you can stick a piece of tape to the card to slightly increase the thickness. Display cover (MK3):I've uploaded the CoverV2_Improved-mounting. The LCD is mounted with 4 M3x10mm screws instead of the classic two screws, as this caused vibrations in some cases.You have the LDO OLED screen? Click here for the OLED version of the display cover! On top of that I recommend to mount this baseplate for the printer with the bodykit.And if you want to go even further you can also add this Einsy Case with this doors I designed for the body kit. Assembly:You can find photos of the assembly above at the pictures or at the files as PDF.1. change the display cover. Follow the instructions given in the printer assembly manual.2. screw a middle part to the traverse.3. screw the just connected parts to a side part.4. screw the T-nuts with about 2 turns to the side parts5. place the connected parts on the printer, then attach the other center part, followed by the other side part.6. tighten the screws with the T-nuts in the 3030 extrusions of the printer. Make sure the T-nut has turned and is pulling the side parts to the frame. Also make sure the casing is lined up properly.7. post a Make of your printer in its new look. ;-)"
