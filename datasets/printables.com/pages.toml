full_description = "Update October 26, 2024: Added “ez” versions of the egg bottoms so it's easier to connect the eggs together. Update August 8, 2024: Added v2 egg that is slightly larger than the original in order to fit my baby dragons a little more easily. Also added alternative egg tops with a flattened interior roof for easier bridging. Discover the amazing Baby Crystal Dragon with Egg 3D model, an intricately designed masterpiece by the talented Bearded Printer. This unique piece features a baby dragon that cleverly fits inside an included egg. The model represents a perfect blend of fantasy and innovative design, making it a must-have for any 3D printing enthusiast. The Baby Crystal Dragon with Egg 3D model is defined by its breathtaking detailing and interactivity. Supports: Not required. However, if you want the inside of the egg to look neat toward the top you might consider adding support there if you'd like. When placing the magnets, ensure the magnets placed in a way where they attract each other when the tray is attached to the pot. I've designed the magnets to be a “loose” press fit. Due to the wide variety of printers out there and the various states of tune the printers are in, I didn't want to make the tolerance too tight and make it difficult for those who haven't tuned their printers well enough. So, if your printer is well tuned, you may need to use glue to fasten the magnets. For those who have joined my club at the “Obsessor” tier, prints of this model can be used for commercial purposes."
