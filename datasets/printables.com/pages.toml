description = "Hey there! I started 3D printing in 2019, quickly got hooked and after a few months with a chinese printer I bought my … – 3D models"
full_description = '''About 3D Models 125 Club & Store 8 Makes 269 Activity Collections 28 41 Extrutim @Extrutim published a new model January 18 at 1:57 PM January 18 at 1:57 PM Door Hook | Different Sizes and Customizable Household Other House Equipment 19 5 43 17 Jan Luteran @JanLuteran_568645 Reply 1 like January 19 at 11:50 AM Bambu Lab X1 Ctrl⌘ + Enter to send Enter to add a new line Attach picture POST 41 Extrutim @Extrutim published a new post January 14 at 5:53 PM January 14 at 5:53 PM Some time has passed since I uploaded the last model, but over the holidays I was not idle and created my biggest MMU model so far. A large display model of a Canadair CL-415! This time, after a while, a model for the Printables Store. It consists of 52 parts and the larger version has a wingspan of 568mm!It was a lot of work but I love the result! If you have a second I'd be very happy if you leave a like for my model :) https://www.printables.com/model/1133940 29 Show older comments 15 MrGumballs @MrGumballs awesome Reply 1 like January 14 at 8:39 PM 22 3Dprintfun @3Dprintfun Looks cool! Reply 1 like January 14 at 9:52 PM Ctrl⌘ + Enter to send Enter to add a new line Attach picture POST 41 Extrutim @Extrutim published a new post October 23, 2024 at 3:01 PM October 23, 2024 at 3:01 PM New upload: I saw a video of this thing made of metal and wanted to have it too. So I tried to build it myself as a challenge and this is the result! It is a cuboctahedron which can be formed into an octahedron by rotating it.Here is the model: https://www.printables.com/model/1048153-octahedron-expanding-into-cuboctahedron 14 Ctrl⌘ + Enter to send Enter to add a new line Attach picture POST 41 Extrutim @Extrutim published a new model October 23, 2024 at 2:17 PM October 23, 2024 at 2:17 PM Octahedron Expanding Into Cuboctahedron Art & Design Other Art & Designs 349 4.9 660 Show older comments 10 Dushan @Dushan_1604244 Triangles PLA, joints PETG. A quick print 1+0.5 hour, neverending play. Works perfectly, thank you. Reply 1 like January 30 at 3:03 PM Prusa MK4 13 subworx @subworx_1311106 Printed nicely on my MK3S, used yellow PETG for the joints and tri-color (blue, purple, black) Geeetech PLA for the triangles. Reply 1 like February 20 at 4:39 PM Prusa MK3/S/S+ Ctrl⌘ + Enter to send Enter to add a new line Attach picture POST 41 Extrutim @Extrutim published a new post October 20, 2024 at 4:06 PM October 20, 2024 at 4:06 PM 💡Insight: Hello folks, this Insight is about a rather small feature that basically has a place on every one of my models. Chamfers and roundings, depending on your taste. Many people add them to their models, but many don't. In my opinion, however, they are essential for a “professional” overall impression of a design, as they simply add the finishing touches to a model.I mainly use chamfers as I personally find them prettier than roundings and the angle can be adjusted so that the overhang does not exceed 50° depending on the orientation. I make them in all possible sizes, whereby I differentiate between 2 types. On the one hand, chamfers that are 1mm or larger for the design, I often combine different sized chamfers to give the model a certain look. On the other hand, chamfers with a size smaller than 1mm which are not really visible later in the print but on the file itself, which is especially good for renderings of the model, as they provide more light refraction. In addition, if one of the surfaces has contact with the print bed, this can prevent an elephant foot. Depending on the size and duration that the printer needs for a layer, it can happen that even 45° are not printed cleanly, by using a chamfer with a less steep angle you can achieve the look and still ensure a clean print. If the layer duration is long enough, a chamfer smaller than 45° can also work. However, I only use this to the smallest extent if it is not possible otherwise. There are many great designs which have curves on the underside which are printed messily. If you prefer roundings instead of chamfers for your design, there is a trick with which you can get almost the look of a rounding without the print becoming unclean in the lower section. As you can see in the picture, a chamfer is made first and then a rounding on the upper edge. This is a small compromise but in my opinion much better than a simple rounding. 24 Show older comments 25 Line Arc Line @LineArcLine This is great, I've been meaning to write about this. I call them "Filfers" or "Chillets" (Chamfer + Fillet). Reply 1 like October 21, 2024 at 3:29 PM 20 MattoDesign @MattoDesign @LineArcLine So your rounded edge is a Redge at the end. Reply 1 like October 23, 2024 at 6:29 AM Ctrl⌘ + Enter to send Enter to add a new line Attach picture POST 41 Extrutim @Extrutim published a new post October 16, 2024 at 4:25 PM October 16, 2024 at 4:25 PM Hello folks! I was really stunned when I saw that I actually made it to the finals of the Printables awards! And not only that, even my rubberized doorstop is in the final selection, wow! I'd like to thank everyone who nominated me, who liked or downloaded something or is just following me and my work, thank you so much! ❤Now it's on to the final round, I didn't even know there would be one.So, if you have a moment I would be really happy if you vote for me one more time, thank you very much! https://www.printables.com/awards 34 Show older comments 3 Soegaard @Soegaard_154398 Congrats... Deserved ! Reply 1 like November 4, 2024 at 1:08 PM 23 AWSW @AWSW Well deserved! =) Reply 4 likes October 16, 2024 at 4:36 PM Ctrl⌘ + Enter to send Enter to add a new line Attach picture POST 41 Extrutim @Extrutim published a new post October 8, 2024 at 5:25 PM October 8, 2024 at 5:25 PM 💡Insight: Today I would like to show you how the closure of my 3d printed drybox is designed. The main intention was to create a closure that is easier to use than the one on the original Polymaker Drybox, as it is extremely tight and requires a lot of force to open and close. So I opted for this version with two hinges as you can often find on boxes.This closure is rarely found on 3D printed parts, but then screws are often used, which I wanted to avoid. The advantage of this closure is that the tension can be adjusted very easily by the length of the link and it is not too susceptible to printing inaccuracies, which with other types can quickly lead to the closure being too tight or too loose. The decisive factor for this type of closure is that it is moved slightly beyond the narrowest point to close, so that the closure is automatically held shut.The challenge was not to generate any overhangs that were too steep and would produce an unclean print. However, I could not avoid a bridge on the container where the closure hooks in. It was important to design the hinge in such a way that it is stable enough not to fall off in everyday use but also flexible enough for easy assembly. This is why the joint is slotted as you can see. The round attachment points of the joint are not completely round but slightly cut off on the underside. This provides a larger contact surface and ensures that the attachment points are printed cleanly in the lower area.In addition, the joint on the side of the lid has a small corner which limits the angle of rotation and ensures that the closure cannot rotate beyond a certain angle. This would result in the closure dangling around and getting in the way when the lid is placed on the box. This small but important detail keeps the cap away from the box. 12 Show older comments 25 Line Arc Line @LineArcLine This latch looks great!When you adjust the tension of the latch, what part of the model do you change the length of? The Hook part, the attachment arm part, or the distance to the body’s hook? Reply October 9, 2024 at 1:25 PM 41 Extrutim @Extrutim @LineArcLine Thanks! Basically you could adjust it with all three, but A is the smallest part and the easiest to change and reprint. Reply 1 like October 9, 2024 at 2:15 PM Ctrl⌘ + Enter to send Enter to add a new line Attach picture POST 41 Extrutim @Extrutim published a new post October 5, 2024 at 2:44 PM October 5, 2024 at 2:44 PM Hello folks, I just published this new parametric design, actually they are two different models that are built very differently but still look the same!This is the Upload: https://www.printables.com/model/1027928If you like it, please leave a like, I would be very happy!I had an idea for a container that has these two shadow gaps as a design element.In order for this to look right at the bottom, the model needs a 90° overhang, which means that support structures would be necessary.I therefore decided that the two parts which are printed in the secondary color should be printed separately and then plugged together. This means that neither a support structure nor a color change is necessary.The model is parametric, in Fusion you can open the f3d files and create your own sizes.And since some people don't mind printing supports or changing colors, I made the model the easy way too, which by the way only took a fraction of the time. 11 13 The Cre8er @The_Cre8er Saw this and wondered why there was no likes yet, and then I looked when it was posted. Perfect timing (edited) Reply 2 likes October 5, 2024 at 2:48 PM Ctrl⌘ + Enter to send Enter to add a new line Attach picture POST 41 Extrutim @Extrutim published a new model October 5, 2024 at 2:13 PM October 5, 2024 at 2:13 PM Minimalist Box | Parametric | Multi Part or Color Change Version Household Home Decor 44 0 49 Ctrl⌘ + Enter to send Enter to add a new line Attach picture POST 41 Extrutim @Extrutim published a new model October 4, 2024 at 4:23 PM October 4, 2024 at 4:23 PM Spool Holder To Reverse Bowden Setup 3D Printers Accessories 323 5 410 Show older comments 16 Shushuda @Shushuda I've printed it and I have 2 issues, other than that - stellar design.1. The requirements list misses 2 screws - 2x M3x6mm. These should go into holder-filamentguide where it connects to the main frame. The list shows only 8mm and 8-12mm so I assumed that 8mm goes there and went through the plastic, ruining one side.2. It'd be cool to have some info on which screws go into which holes. Atm it's a lot of guessing, as shown in point 1.Other than that - beautiful solid spool holder :) (edited) Reply October 22, 2024 at 4:43 AM 41 Extrutim @Extrutim @Shushuda You're right, thanks for the info! Two M3x8-12mm screws were missing. Two M3x8mm screws are needed to attach the holder filament guide to the side parts. Here the extrusion of the hole had an error which is why 8mm screws were too long. I've corrected this. Reply October 22, 2024 at 2:42 PM 25 Andrey Orlov @AndreyOrlov Hello. This is a very beautiful design, looks amazing.Printed PETG material without any problems.Thanks for sharing. Reply 1 like October 6, 2024 at 7:51 PM Creality Ender 3 V3 SE Ctrl⌘ + Enter to send Enter to add a new line Attach picture POST 41 Extrutim @Extrutim published a new post October 3, 2024 at 4:21 PM October 3, 2024 at 4:21 PM 💡Insight: Hello folks, in this Insight I'd like to show you a practical way I've been designing the holes for attaching models to the wall for some time now. When it comes to mounting a 3D print e.g. a wall bracket, hooks, shelf supports, etc. to the wall you never know what kind of screws others want to use. Ideally, others can use both flat head and countersunk head screws. Apart from the fact that it's not ideal to screw a countersunk head screw into a socket designed for a flat head, due to the reduced contact surface, there is the further disadvantage that the cone quickly exerts forces on the print, which can cause it to break (due to the small contact surface). I therefore came up with the idea of constructing a kind of washer which is simply placed in the blind hole for a flat head screw when using a countersunk head screw. This saves the effort of designing two different versions of the model, and depending on the print orientation of the model, the most stable alignment to print the washer is always guaranteed. Even if, in theory, the washer would break due to the tightening torque of the countersunk screw, a good distribution of the force on the printed model is still ensured. Depending on the orientation in which the model is printed, I don't create a round hole for the drill holes, but use the teardrop shape shown in the picture to ensure that the overhangs are not too steep. This improves the print quality and ensures that the washer always fits into the blind hole. I set the tolerances slightly higher at 0.3 mm, as a little more play doesn't hurt in this case. I choose a somewhat larger diameter for the blind hole. A screw with a flat head is used with a washer, the larger the diameter, the larger the washer can be that you have lying around somewhere. I also make the countersunk hole slightly larger than necessary, the head diameter of a countersunk head screw is usually twice the screw diameter. 24 Show older comments 21 Milos @Milos Such details are differenciators of great design. Keep up good work! Reply 1 like October 4, 2024 at 10:44 PM 36 Grandpa 3DPrints @Grandpa3DPrints Dude! Reply 2 likes October 3, 2024 at 4:27 PM Ctrl⌘ + Enter to send Enter to add a new line Attach picture POST 41 Extrutim @Extrutim published a new post September 29, 2024 at 10:29 AM September 29, 2024 at 10:29 AM 💡Insight: We're continuing with the construction of my drybox for the Prusa XL!It is fully printable and has a lock which not only closes the box but also serves as the lid for the silica container. Since the drybox has to be as space-saving as possible, the best solution was to place the container for the desiccant in the core of the spool. I also wanted the desiccant to be as easy to change as possible and the color of the color indicator to be easy to check when changing the spool. With the container attached to the lock, you have it directly in your hand when changing the spool.The limiting dimension is the diameter of the spool core, slightly smaller because the air holes are also located on this surface. 47mm is the dimension I've chosen. So I work from the outside in. Subtracting the wall thicknesses and tolerances finally results in the size of the silica container. The closure is similar to a bayonet lock, with the lid of the box acting as the spring. It snaps into the recesses via a 90° turn and a slight ramp. It's important here (as with all features) that you pay attention to the printability. All overhangs are chosen so that a clean print is guaranteed. From 45° it becomes critical, if possible I always stick to 50°, every printer should really be able to manage this well. As you can see, the inner seal is trapezoidal, so it hold securely to the part, with the narrow side lying on the print bed to ensure a smooth surface. The box should also have a viewing window. In my opinion, the best method is to use some clear plastic packaging. Everyone can find some'''
