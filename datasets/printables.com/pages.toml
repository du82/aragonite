["https://printables.com/model/521949-planetary-ptablet-platform"]
title = "Planetary Ptablet Platform by Clockspring | Download free STL model | Printables.com"
description = "It's an overengineered but quite stable planetary-geared tablet stand! | Download free 3D printable STL models"
full_description = '''You may remember the Planetary Phone Stand from a while back, the model that started as an experiment I thought nobody would ever want to print! Well, periodically I get requests for a larger tablet version of that. Of course, that model is already a very tight squeeze on regular printers, so in order to support much larger, heavier devices we now have this multi-part assembled version whose main design goals were (a) be stable, and (b) look completely overengineered in the best possible "why yes, I do have a 3D printer!" way :D The main parts of the structure are the two big, geared sides and the top plate that connects them. There are additional bracing plates underneath, too, and all those parts bolt together with eight big hex-driven bolts (a hex driver tool is included as one of the printable parts!) The planetary gears allow the angle of the platform to be adjusted, and it is locked into place by inserting pins into the radial slots around the outside. The pictures here show a plate with two pins, but an additional model is provided for individual pins if you'd prefer something more subtle. The shelf plate above has a fairly small ledge, but an alternative model is provided that has a much bigger one for more security (and provides a central gap for cables if desired): This is a collection of parts that need to bolt together, and some of which are print-in-place articulated parts in their own right, so make sure your first layer is nice and neat and that there aren't any issues like stringing or overextrusion that might bind moving parts together or compromise dimensional accuracy! That said, the tolerances on this model are as generous as possible to avoid being overly sensitive to those kinds of print problems! The biggest parts are the geared sides (162mm x 175mm on the print bed and 52mm tall) and the shelf platform (166mm x 161mm). These will fit happily on a Prusa Mini bed! The one place that infill will matter on this model is where the centre of the planetary gears connects to strut that joins it to the base. If you go really, really light on infill then you'll just be relying on perimeters for holding that together, which is not going to work. That said, you won't need to go too heavy on infill, just don't go crazy minimal :)'''
year_published = 2023
