description = "A doorstop for multi-material printing! | Download free 3D printable STL models"
full_description = "A simple doorstop for multi-material printing!Intended to print the contact surfaces from flexible filament, of course this is not a must ;) As flexible filament doesn't really bond well with e.g. PLA, the two parts are slightly interlocked to increase the contact surface and counteract shear forces. I made the doorstop primarily for my doors at home, which have quite a large gap. That's why the doorstop is 6 mm thick at the front and 33 mm at the back. Of course, you can scale down the model for your application. If you want to support me, please check out the designs in my Printables Store: Click here!Thank you for your support! :)"
