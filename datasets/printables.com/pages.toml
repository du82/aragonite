["https://printables.com/model/908999-satyr-2-audiophile-open-back-headphones"]
title = "Satyr 2 Audiophile Open-Back Headphones by Capra-Audio | Download free STL model | Printables.com"
description = "High-End, Audiophile-grade, 3D printable open back headphones. | Download free 3D printable STL models"
full_description = "Satyr 2 is mid-forward/neutral with a rise in the bass followed by a sub-bass roll-off common in open-back headphones. Self sourced BOM Affiliate Links:2x 50mm Peerless Drivers8x FHSC M3x6 Bolts8x BHSC M3x6 Bolts10x M3x5 Heat-set Inserts10 Micron Nylon Mesh3.5mm or MiniXLR Connectors ZMF HD600 Pads (Most Comfortable) Additional Affiliate Links if you want to support us further:Polymaker 95a TPUPolymaker PLA ProPolymaker PETG Place a piece of 10micron nylon mesh in in front of the baffle before applying the pads, make sure its nice and tight. Use 4 m3x6 FHSC bolts and 4 m3x5 heat-set inserts to affix the Baffle Frame to the Rear Housing. Use 4 m3x6 bhsc bolts to affix the driver to the 50mm baffle assembly. Use Stock HD600 pads for the best sound. (ZMF perforated leather pads are a nice alternative if the senn pads are out of stock). The Headband files can be found here. If you don't know how to read FR Graphs then check out my buddy's video on the basics of how to interpret the graphs. DISCLAIMER: Because of the nature of this being DIY there is a high probability that your personal Satyr 2 units will measure differently depending on a number of factors, these graphs are simply indicative of the general target frequency response you will get close to if you follow the instructions.This model is set to [Creative Commons - Attribution - Noncommercial - NoDerivatives] because it is designed purposefully, any changes to the design by anyone other than Capra Audio would no longer be the Satyr 2. This includes using the wrong speakers, wrong pads, or missing or wrong front/rear damping materials. The Satyr 2 is the complete unit itself. It is hard to design and tune a headphone to be good and we do not want our name associated with a potentially worse version of our design."
year_published = 2020
year_updated = 2020
