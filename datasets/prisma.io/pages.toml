["https://prisma.io/accelerate"]
title = "Prisma Accelerate | Make your database queries faster"
description = "Accelerate is a managed connection pooler with global caching that helps you speed up your queries with just a few lines of code."
full_description = "Accelerate is a fully managed global connection pool and caching layer for your existing database, enabling query-level cache policies and flexible invalidation options directly from the Prisma ORM. Enable highly scaleable and reliable serverless and edge workloads on managed infrastructure with full tenant isolation. Bring the connection pooler close to your database to decrease latencies. Easily add query caching to your application in just a few lines of code, with no infrastructure to manage. Choose the right cache strategy for each of your queries, tailored exactly to your app. Accelerate scales up and down seamlessly and automatically, based on your app’s traffic. Built to handle any load you can throw at it. Decrease latencies by bringing the cached result closer to the user without changing anything in your database infrastructure. Get more out of the database you already have. Cut down on reads and compute by caching queries, optimizing resource usage and cost. Focus on the core competencies of your team. We'll take care of building and managing infrastructure components, and ensuring full tenant isolation for you. Easily configure Accelerate without leaving your terminal and automate its configuration in your CI environments. Works with the database you already have, whether it's publicly accessible, or via an IP allowlist. If you switch down the line, it’s as easy as updating your connection string. The Platform Console allows you to configure features, collaborate on projects, manage membership and billing directly within each workspace. Monitor queries served and cache utilization through the insights dashboard. Compare latency of cached and non-cached queries to understand the impact on application and database performance. Prisma Accelerate is priced based on usage. Choose the right plan for your workspace based on your project requirements. Simply enable Accelerate on a new or existing project, add it to your app, and start using in your database queries."
