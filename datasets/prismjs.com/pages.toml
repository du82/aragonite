["https://prismjs.com/extending.html"]
title = "Extending Prism ▲ Prism"
full_description = '''Prism is awesome out of the box, but it’s even awesomer when it’s customized to your own needs. This section will help you write new language definitions, plugins and all-around Prism hacking. Every language is defined as a set of tokens, which are expressed as regular expressions. For example, this is the language definition for JSON: At its core, a language definition is just a JavaScript object, and a token is just an entry of the language definition. The simplest language definition is an empty object: Unfortunately, an empty language definition isn't very useful, so let's add a token. The simplest way to express a token is using a regular expression literal: Alternatively, an object literal can also be used. With this notation, the regular expression describing the token is the pattern property of the object: So far, the functionality is exactly the same between the regex and object notations. However, the object notation allows for additional options. More on that later. The name of a token can theoretically be any string that is also a valid CSS class, but there are some guidelines to follow. More on that later. Prism will match tokens against the input text one after the other, in order, and tokens cannot overlap with the matches of previous tokens. So in the above example, token-2 will not match the substring "regex" inside of matches of token-1. More information about Prism's matching algorithm later. Lastly, in many languages, there are multiple different ways of declaring the same constructs (e.g. comments, strings, ...) and sometimes it is difficult or unpractical to match all of them with one single regular expression. To add multiple regular expressions for one token name, an array can be used: Instead of using just plain regular expressions, Prism also supports an object notation for tokens. This notation enables the following options: This option mitigates JavaScript's poor browser support for lookbehinds. When set to true, the first capturing group in the pattern regex is discarded when matching this token, so it effectively functions as a lookbehind.'''
