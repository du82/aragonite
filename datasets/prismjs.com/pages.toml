["https://prismjs.com/test-suite.html"]
title = "Running the test suite ▲ Prism"
full_description = "All test files are run in isolation. A new prism instance is created for each test case. This will slow the test runner a bit down, but we can be sure that nothing leaks into the next test case. Thank you for writing tests! Tests are awesome! They ensure, that we can improve the codebase without breaking anything. Also, this way, we can ensure that upgrading Prism is as painless as possible for you. You can add new tests by creating a new test case file (with the .test file extension) in the tests directory which is located at /tests/languages/${language}. All tests are sorted into directories in the tests/languages directory. Each directory name encodes, which language you are currently testing. So, if you want to test CSS, put your test file in /tests/languages/css to test CSS only. If you create a test case in this directory, the test runner will ensure that the css language definition including all required language definitions are correctly loaded. If you want to test language injection, you typically need to load two or more languages where one language is the “main” language that is being tested, with all other languages being injected into it. The languages are loaded in order, so first markup (+ dependencies) is loaded, then php (+ dependencies). The test loader ensures that no language is loaded more than once (for example if two languages have the same dependencies). By default the last language is the main language: php+markup will have markup as main language. This is equal to putting your code in the following code block: If you need to load the languages in a given order, but you don't want to use the last language as main language, you can mark the main language with an exclamation mark: php!+markup. This will use php as main language. (You can only define one main language. The test runner will fail all tests in directories with more than one main language.) Note: by loading multiple languages you can do integration tests (ensure that loading two or more languages together won't break anything)."
year_published = 2025
clearnet = "https://prismjs.com/test-suite.html"
