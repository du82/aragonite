title = "Known failures ▲ Prism"
full_description = "There are certain edge cases where Prism will fail. There are always such cases in every regex-based syntax highlighter. However, Prism dares to be open and honest about them. If a failure is listed here, it doesn’t mean it will never be fixed. This is more of a “known bugs” list, just with a certain type of bug. Coy's shadows and background might not wrap around the code correctly if combined with float of flexbox layouts. The first workaround is setting display: flex-root; for the pre element. This will fix the issue but flex-root has limited browser support. The second is adding clear: both; to the style of the pre element. This will fix the issue but it will change the way code blocks behave when overlapping with other elements."
year_published = 2025
clearnet = "https://prismjs.com/known-failures.html"
