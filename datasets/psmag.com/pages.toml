full_description = "Book Previews Books Ideas Twenty-Five Must-Read Books for Fall of 2019 Our staffers and contributors highlight the most urgent and exciting titles coming this fall—from fiction to non-fiction, poetry to prose. Pacific Standard Staff Book Talk Books Ideas ‘Indigenous Writing Is Going to Continue to Set the Bar for Literary Excellence’: An Interview With Alicia Elliott and Arielle Twist Terese Marie Mailhot interviews Alicia Elliott and Arielle Twist about some recent triumphs in Indigenous literature—and about other triumphs still to come. Terese Marie Mailhot Book Talk Books Ideas Jia Tolentino Talks to Samantha Irby About ‘Trick Mirror’ The New Yorker staff writer discusses her unpublished first novel, and why Americans are perennially obsessed with a good scam. Samantha Irby Book Talk Books Ideas ‘Jesus Wasn’t This American Corn-Fed God’: Lyz Lenz on Faith, Loss, and Sexism in Rural America The author of God Land discusses misogyny in church leadership—and why so many depictions of Jesus look like Brad Pitt. Lilly Dancyger Book Talk Books Ideas What Lisa Taddeo Learned in Eight Years of Reporting on American Desire Taddeo's new book profiles the intimate wants and needs of three women across the country. Katie Kilkenny Book Talk Books Ideas ‘There Is a Hidden Violence’: Jeremy Slack on the Human Tragedy of Deportation In his new book, Deported to Death, Jeremy Slack undertakes one of the most thorough efforts to date to track the fate of deportees. Isabela Dias Book Reviews Books Ideas What the Attention Economy Does to Workers—and How It Drives America Insane Two new books argue that the attention economy is unsustainable—for people, and for the planet. Rebecca Stoner Book Reviews Books Ideas Can Cities Build Their Way to Housing Equity? A New Book Suggests Not. Sam Stein's Capital City offers a blistering and persuasive critique of how real estate dominates city planning—to the detriment of most residents. Roshan Abraham Book Talk Books Ideas