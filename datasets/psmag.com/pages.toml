full_description = '''Economics The President Didn’t Always Have Power Over Trade Deals Until the 1930s, it was Congress that set the terms of U.S. trade negotiations with other countries and raised and lowered tariffs as it saw fit, while the president did little but sign his name. William Hauk Economics A New Oregon Law Would Make It the First State to Ban Single-Family Zoning Democratic Governor Kate Brown is expected to sign off on the law, which would affect areas that are home to some 2.8 million people. Laura Bliss Economics What Would Happen If the Government Covered Undocumented Immigrants’ Health Care? Democrats want health coverage for everybody in America, including the undocumented. What does that mean for folks already getting government-covered health care? Francie Diep Economics Is Landmarking a Tool of Gentrification or a Bulwark Against It? From YIMBYs to NIMBYs, the Strand's recent historic preservation is a Rorschach test for activists of many stripes. Who's right? Jack Denton Economics Developers Aren’t Reporting How They’re Using Tax Incentives Meant for Low-Income Areas The "opportunity zones" program, established in Trump's 2017 tax bill, might be fueling gentrification and luxury developments. Sophie Kasakove Economics Can Economic Pressure Curb Jair Bolsonaro’s Anti-Indigenous Agenda? An impending trade deal with the E.U. has instigated further pushback from non-governmental organizations and local activists against any deal with the Brazilian government. Sue Branford Economics Hundreds of Toronto Uber Drivers Have Announced Plans to Unionize The announcement tees up a fight between the United Food and Commercial Workers and rideshare giants like Uber and Lyft. Brianna Provenzano Economics How Cities Across the U.S. Are Using Philanthropy to Combat Inequality All over the country low-income citizens are struggling to attain more economic mobility. A new program funded by two large foundations is working to address that. Sarah Holder Economics Democrats Agree That the Housing Crisis Is a Problem. They Just Don’t Agree on How to Fix It. For an issue on which so many agree—the rent is too damned high, especially in urban areas—housing affordability doesn't present one single obvious fix. Kriston Capps'''
