full_description = "Home Impact Impact Audience What They’re Saying “Pacific Standard … focuses on social issues and public policy with the same passion that supermarket glossies lavish on Biggest Loser photo spreads and Heidi Montag’s latest turn under the plastic surgeon’s knife. The magazine and a companion website have gained a toehold with academics, government officials, and journalists.” —”On the Media: Publisher Sara Miller McCune Has Serious Goals for Journalism,” the Los Angeles Times “During [Sara] Miller McCune’s long career as an academic publisher, papers and books full of brilliant ideas would cross her desk, and she would think about how to increase the number of people who saw them and thought about them. She began to conceive of a publication that would take this type of compelling research, which had a tiny readership, and translate it into stories that would make a wider audience pay attention.” —”Meet the 6-Year-Old Mag That Just Took the Internet by Storm,” Columbia Journalism Review “Back in my idealistic youth, I liked to say that the purpose of journalism was to ‘make what matters interesting.’ It’s easy enough to make interesting things interesting—sports, scandals, disasters, movie stars—and it’s even easier to make important things dull. What makes journalism different from sheer entertainment is that it is supposed to deal with ‘real’ issues, problems, and concepts. Presenting them in a way that holds people’s attention—that’s the standard journalism, in its different forms, is always aiming for. Terry Gross does it in one way, Michael Lewis in another, the list could go on. [Pacific Standard] is earning a place on that list.” —James Fallows, The Atlantic Reader Profile & Demographics PSmag.comAudience1.3 million uniques/monthGender54% maleMedian Age25–34Education72% college or post-graduate degreePolitical Affiliation43% IndependentEngagement79% active in politicsHousehold54% no kidsTop 3 OccupationsMarketing; research; administrationTo