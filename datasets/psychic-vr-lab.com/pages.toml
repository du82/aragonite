["https://psychic-vr-lab.com/contact"]
title = "STYLY, Inc."
description = "STYLY, Inc."
full_description = '''STYLY is a spatial layer platform for the "Spatial Computing" era, bridging digital and physical realms. It enables the creation and distribution of digital content targeting both public layers in urban spaces and facilities and personal layers around the individual. We have a global community of over 100,000 creators, with more than 200,000 digital contents distributed. It offers a diverse range of digital content, including art, music, fashion, and videos, submitted by creators worldwide. These digital contents can be enjoyed alone or shared and experienced with friends, making it a versatile platform for various digital experiences. At STYLY, we are seeking team members to help us fulfill our mission of “Free Inner Creativity” and to deliver on our value for the Spatial Computing era. Through STYLY, we aim to construct a Lifestyle OS, fostering growth towards the upcoming new era. We are dedicated to creating a foundation that nurtures all forms of "co-creation," giving rise to new cultures and industries. To accomplish these goals, we need passionate team members who are not afraid to take on challenges and pursue their dreams, individuals who are eager to shape the future of XR with their own hands. Are you ready to unleash your psychic abilities and hidden creativity with us? Join us and let's make it happen together!'''
