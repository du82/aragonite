title = "Psychogeographic Review | The Art of Psychogeography"
description = "The Art of Psychogeography"
full_description = "← Older posts Wandering in a Haunted Landscape Posted on 05/01/2025 by Bobby Seal Something different for the new year. A found document from nearly twelve years ago. It’s a kind of origin myth for this blog. It should have been my first post when I started The Psychogeographic Review back in 2012. Perhaps it will be my last. As soon as I wake up I know that she has gone. The flat is empty, silent. I make coffee, then pack my bags and call for a taxi. It is time to move on, I have an investigation to complete. There are questions in need of answers, which in turn will lead to more questions. I am not the ideal person for the task, but I can see no one else stepping forward to attempt it. The Queen’s train arrived at Ruabon station at 4.15pm precisely. Her horse-drawn carriage, together with an escort of mounted Denbighshire Hussars, was waiting for her at the station entrance. My train pulls into the same station at just after 10.00pm over 100 years later. I step down from the carriage and make my way along the platform, a laptop bag over one shoulder and a heavy suitcase dragging along behind me on its impossibly small wheels. In 1889 Victoria’s carriage awaited her no more than a dozen paces from where she left the train. This year the single taxi waiting outside the small station is snapped up by the elderly couple shuffling along just ahead of me. So, suitcase skittering along behind, I follow the curve of road from the station forecourt into the main street of the village. Here I find a taxi office squeezed in between a pub and a Chinese take-away. By way of conversation the taxi driver asks why I got off the train in Ruabon, one station short of Wrexham General, if Wrexham was where I was heading. I’d have saved myself a six-mile taxi ride, he says. I know this, of course: I’d lived in the town before. But I decided on the train up from Harwich, as I read about the route of her visit, that I wanted to arrive in Wrexham by the same road Queen Victoria took all those years before. I think it best not to mention this to the driver, I always find it best to downplay my odd obsessions when I’m in company. I say instead that I haven’t been to Wrexham for a long time and I want to see a little of the area from the car. In the bloody dark, he mutters to himself. Victoria was staying at Palé Hall, near Bala. She took the train along the Dee valley to Ruabon and from there processed to Wrexham, where there was to be a civic welcome and concert in Acton Park. Afterwards she took tea in Acton Hall, and then returned to town in her carriage, picking up the train for her onward journey at Wrexham General station this time. Acton Hall 1829 Acton Hall is no more. My vehicle pulls up outside an apartment block in Acton Hall Walks, near to the site of the old manor house. I pay the taxi driver and he sits watching me while I struggle to the front door of the building with my luggage. I’ve been abroad for so long that I’ve forgotten the expected tipping etiquette in this country, but clearly I haven’t given him enough to warrant his helping me with my bags. I stand at the firmly locked front door wondering what to do next. I’m sure it had been agreed that someone was going to meet me here. I turn round at the sound of the taxi-cab driving off and as it do so another car arrives and parks in front of me, dazzling me with its lights. Acton Hall Walks Apartments A young woman in a business suit gets out and strides briskly towards me. She is brandishing a practiced smile and a bunch of keys and introduces herself as the letting agent. She leads the way up to the flat and lets me in. Second floor furnished, two bedrooms, two bathrooms and an open-plan living room/kitchen with windows overlooking the park she recites, clearly eager to be on her way. You’ve already signed all the paperwork for a six-month let, she says, so unless there’s anything else? I have no questions, so she shakes my hand and leaves, her heels clattering down the corridor. Years of travel have accustomed me to moving on to my next abode lightly with few possessions, but it’s also given me an appreciation of simple comforts, so this flat will be more than enough for my needs. My books and papers will arrive sometime soon and I already have my laptop and notebook, so anything the flat lacks I can easily do without. I have a phone, though I never call anyone and rarely text. But it gives me access to information on the go and serves my need for a camera without the cumbersome bulk of the SLR I always used to carry. * * * It’s not something I’d planned, but I make a spur of the moment decision as I open the living room blinds that first morning and see the view across the park. Before me is a vista of trees, undergrowth and meadow sloping away into the middle distance; beyond this are the tops of more trees. This view of Acton Park suggests to me that one might have seen a very similar prospect from the upper windows of Acton Hall, which once stood in this spot. I reach for my phone and take a wide-angle picture of the view before me, having already decided that I will do the same every morning for the duration of my time here. The same view every morning, building up over time a record of the subtle daily changes as summer turns to autumn and then into winter. I like to work within a framework and this ever-expanding set of pictures gives me one. * * * I walk, I look, I write; every investigation starts in the same way. This morning I start in Acton Park, walking its perimeter and then heading down the slope towards its centre. She sits on a bench looking out over the pond. She stares at the water so intently that it is obvious that she is aware of my approach along the path that passes her bench. She is warily alert. I am used to this: people sometimes find the intensity of my presence unsettling. Mindful of this, I put my head down and walk ahead a little more swiftly, making a show of ignoring her. But as I pass she speaks. People keep on feeding the ducks with bread, she says. It’s not good for them, but they still do it. Why is that, do you think? I slow down and turn my head in her direction. She continues to stare at the water and I sense she does not actually want an answer. The birds can’t help it, she continues, eventually all that bread will kill them, but they keep on eating it. They just can’t resist. I stop beside her bench, feeling it is only polite to wait and show that I am listening. She is still looking at the water, silent now. So much so that I start to wonder whether she was actually addressing me or simply talking to herself, or maybe the ducks, who are languidly patrolling the shallows near her, ever hopeful. It’s a beautiful morning though, I say, if only to fill the silence. Really? She says, turning to face me for the first time, her brown eyes boring into my face. Or is that just something people say? I smile, unsure how to respond. Acton Park Pond Next you’ll be quoting Keats on beauty, she says. So why not tell me something beautiful and possibly even true? That would be the writerly thing to do, she says, nodding towards the notebook cupped in my right hand, a momentary flicker of a smile in her eyes. Ah yes, I say, still struggling for a response. My name is Bennett, she says, I guess I’ll see you around. And with that she turns back to face the pond. Taking that as my signal that the conversation is over, I mumble a goodbye and continue on my way. Later, back at the flat, I settle down at the kitchen table to write up my report. I fire up my laptop and open up a file I’ve already labelled The Psychogeographic Review. A buzzing sound breaks my reverie. What’s that? An alarm of some sort, or perhaps a timer? Then I realise it is the phone on the wall by the front door. I recall now being shown that last night: it is the intercom linked to the outside door. Removals, the voice says, we’re here with your stuff. I press the button to open the front entrance then prop open the flat door with a heavy chopping board. Two men in matching green polo shirts bustle in, each pushing a sack truck bearing two tea-chest sized boxes. I direct them to stack the boxes against one wall of the living room. One more journey from the van and they are done. Seven boxes: all my worldly possessions, a jumble of mainly books, papers and clothes. I’m not sure what else is inside; I never fully unpack these boxes from one home to the next, I just reach inside if there’s something I need. Why bother unpacking, only to have to pack again? I turn my back on the boxes, feeling weary with the very idea of them. I take two steps and sit at the table. I have my journal to write up and I want compose my report while it is still fresh in my mind. * * * All paths lead to the pond, or so it seems. I follow the curve of gravel along the water’s edge and see her across the pond from a distance. She sits on the same bench. Somehow I knew she would be there. Once again she seems to be acutely aware of my approach, but deliberately continues to look the other way, eyes fixed on the murky waters of the pond. If she doesn’t speak. I will just keep on walking, I tell myself. It’s not as if we’ve arranged to meet. Hello Mr Writer, she says as I near the back of her bench. Hi, I answer, it’s cloudier today. She turns and we share a brief awkward smile at the banality of my remark. Going somewhere? I say, with a nod towards the well-stuffed rucksack on the bench beside her. Maybe, she says, what do you think? I really don’t know, I say. She stands up, slides the straps of her bag over her narrow shoulders and walks around the bench to join me on the path. Shall we go? she says. As we walk, Bennett points out the stone circle squatting on an area of flat ground just beyond the lake. Not Neolithic, of course, she says. A modern reproduction for the National Eisteddfod in 1912. You know, the crowning of the bard and all that? There’s something both tragic and inspiring about a nation that celebrates poets as national heroes, don’t you think? And not dead poets, she continues, but new ones. OK, so they’re required to write in the straight-jacket of an ancient metre, but they’re still living poets. Even the occasional female one too. As we pass the circle Bennett says: You see that other stone over there, the one standing on its own? I nod. It’s more of a post than a Gorsedd stone, of course. Well, legend has it that George Jeffreys, the Hanging Judge, used to tie his horse to it when he wanted to stop to admire the view across the Acton estate. His family owned the house and all the land around her, you know that? She stops and turns to face me, eyes fixed on mine and hands balled into fists. If you stand by the stone at midnight, so the story goes, turn around three times saying his name with each turn, then Jeffreys will appear before you. She’s holds her gaze on me for several seconds, without blinking, then softens her face into a broad grin. Absolute fucking nonsense, of course! And I should know, believe me. It strikes me that I have no idea who Bennett is, nor where she comes from. Neither do I know where we are walking to together. My mind’s eye swoops up above us and I see the park with its lake and, nearby, the stone circle with the two of us walking just beyond it. At the top of the slope I see the modern recreation of Acton Hall, my temporary home. I know now, it feels as if I’ve always known, that this is where we are heading. It’s as if there is something that Bennett and I share, but I can’t for the life of me work out what it is. You live locally? I ask. Not really, she answers. I move around a lot. She nods to herself, as if satisfied with her explanation. We pass a section of ancient wall that forms an entrance into the park. You’re moving on somewhere now then? I mean, I say to her, you have your rucksack with you. I already know the answer. We are out amongst the new houses of Acton Hall Walks now, heading for the apartment block. Just a few nights then, she says. Thanks for offering. Bedding down on the sofa will suit me fine. And so it was settled. Though I had made no such offer, it seemed too unbearably awkward to try to contradict her now. The flat had a spare room, but Bennett turned it down and insisted she was happy to sleep on the sofa. Which was fine, but for the fact that the flat’s entire open-plan living area had now become her domain. Still, it was good to have someone to work with on my investigation; to join me on my walks. * * * I think the idea’s fascinating, says Bennett. We are sitting at the dining table in the flat and planning the next day’s walk. What you’ve got, she continues, is one small town divided into two: Wrexham Abbot and Wrexham Regis. One half is owned by the church and the other owes allegiance to the crown. The two rival entities of hereditary power: church and crown fought over this town. They reached an impasse and tacitly agreed to divide it between themselves. Wrexham Abbot and Wrexham Regis: Janus-faced, impassively cruel. But it’s not unusual; it’s a story, a history, that plays out all over England and Wales. She taps the table between us to emphasise her point. Have you read any Tudor history? You need to remember there was a civil war in this country a century before Parliament and Cromwell began to flex their muscles. What I’m talking about is Henry’s war against the church, and it wasn’t confined to armies on battlefields, but it took place locally in each town, village and country estate up and down the land: a real civil war. She turns to me, her eyes flaring. And, believe me, it’s still being fought. * * * We sit at opposite ends of the sofa. Bennett spends the evening listening to podcasts on her phone, which precludes any conversation. That’s fine by me, I need to study several local maps, tracing the course of urban rivers and streams. Rivers, especially hidden ones, fascinate me. If you follow the course of a country’s rivers and you can map out the growth of its settlements, its agriculture, its trade route and the development of its industry. That’s why I want to have a look at Wrexham’s two rivers, the Gwenfro and the Clywedog. As soon as I start marking the map with a highlighter pen I can tell that I’ve caught Bennett’s attention. I look across at her and, as soon as I catch her eye, she takes out the ear buds and looks at me. What are you up to? I tell her my ideas about the Wrexham’s urban rivers and how I’d like to explore them. We can do that, she says, but you’ll not find a lot of the Gwenfro, the section through the centre of town particularly, it’s been built over. It’s not exactly a lost river, but it’s hard to follow its exact course. But even when its underground, the clues are all there, if you know what you’re looking for. OK, I say. I really want to get to the confluence of the two rivers. According to the OS map, it’s at King’s Mills. Bennett leans on my shoulder and studies the map. Her b"
