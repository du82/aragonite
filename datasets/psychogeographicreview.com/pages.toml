gged into the brooding river waters flowing ceaselessly out from Mitteleuropa. … Continue reading → Share this:BlueskyLike this:Like Loading... Posted in Home | Tagged Rotterdam | Leave a comment Walter Benjamin and The Arcades Project Posted on 17/02/2012 by Bobby Seal In many ways The Arcades Project is Benjamin’s lament for the passing of the flâneur. For Benjamin, the flâneur’s disappearance functions as a symbol for the ravages of capitalism upon metropolitan life. The changing urban environment was no longer conducive … Continue reading → Share this:BlueskyLike this:Like Loading... Posted in Home | Tagged Paris, Walter Benjamin | Leave a comment"
