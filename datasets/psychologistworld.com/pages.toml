["https://psychologistworld.com/glossary"]
title = "Psychology Glossary - Psychologist World"
description = "Definitions of 100+ terms in the field of psychology."
full_description = "By Letter | 3 | A | B | C | D | E | F | G | H | I | J | L | M | N | O | P | R | S | T | U | V | W | Z In memory, a theory by Atkinson and Shiffrin that the human memory can be divided into 3 areas: the Sensory memory, Short-Term memory and Long-Term memory. Alfred Adler (1870-1937): Austrian psychologist and follower of Freudian psychoanalysis until he broke away to help found the field of individual psychology. Influential in the foundation of psychotherapy and counseling. Theodor Adorno (1903-1969): German-born psychologist known for research into authoritarian personality traits with the Fascism Scale (F-Scale). Relating to experiment by Milgram (1963). Theory that a person acts in one of two states: in an Agentic State or Autonomous State. A state of mind in which a person acts on behalf of somebody else, devoid of free will. Opposite to Autonomous State Personality trait of tending to appease and agree with others. One of the Big Five Personality Traits. State of mind that deviates from normal consciousness. Induced, for example, through hypnosis, meditation, sleep or mental disorder such as Major Depressive Disorder. Act of goodwill towards another, either in a selfless manner or with the expectation of a return of favour. A part of Sigmund Freud's Stages of Psychosexual Development, the anal stage follows the Oral Stage (from birth until around the first year) and can last upto around the age of 3. A preoccupation with oral satisfaction, such as feeding, is superseded by satisfaction from defecation. Disruption at this stage can lead to an anal fixation: anally retentive personalities may show signs of obsessive orderliness, while anally expulsive types may be messy or disorganised in later life. Therapy encouraging looking at anger in a different way, often involving the use of relaxation to prevent anger. The Anima is a key archetype in Jungian psychology. It represents qualities considered to be idealised feminine attributes, such as compassion and sensitivity, and may be repressed in males. Conversely, the animus in females represents those qualities which are seen as masculine."
