full_description = "Everyone encounters stressful situations on an almost daily basis, from minor pressures that we hardly notice, to occasional traumatic situations which can cause ongoing stress. Many of us do not realise that some forms of stress, known as eustress, can have a positive effect on our performance, and instead refer to those experiences which cause us negative... Research during the 1960s and 70s suggested that a significant source of stress was major life events, such as marriage or the death of a loved one. Holmes and Rahe (1967) argued that it was the upheaval caused by life-changing events, rather than the positive or negative nature of the events themselves, which was a cause of stress. They suggested that... A life event is a significant experience which can lead to an increase in stress. The subject of the life events is believed to be a less significant factor in causing stress than the amount of disruptive change in a person’s life that the event causes. Therefore, both positive and negative life events which necessitate change in a person’s life... If you're one of the many people who gets stressed out when it comes to taking exams then we have a few tips for you that will help you to overcome this and really concentrating on achieving good grades. Firstly, look after your health. It's too easy to cram so much information into your brain and also try to get on with the rest of your life.... What happens to make us stressed? Find out what a popular theory on stress explains how it aids our survival, and what a folklore story says about the topic. Throughout human evolution, our survival has been contingent on an ability to survive life-threatening situations — from being hunted by predators to recovering from illnesses. But how do we become consciously aware that a situation is dangerous so that we might adapt to (and survive) it? Often, we are first alerted that a situation is..."
