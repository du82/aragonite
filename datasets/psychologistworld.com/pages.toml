full_description = "Psychoanalyst Sigmund Freud theorised that our personality development is based on childhood events and labelled personality types such as analy retentive and oral . Find out your personality type by answering these questions (please note that results require membership, available here): When meeting your partner's parents for the first time, do you? 1. Feel apprehensive and wait to be introduced or for them to make the first move 2. Remain cool and aloof - if they want to get to know you better that's up to them 3. Act as though they're old friends and make a show of affectionPersonality TestsFreudian Personality Type TestAre You An Extravert? TestHow Agreeable Are You?Are You Neurotic? TestConscientiousness Test Your partner has forgotten your birthday, do you? 1. Say nothing but secretly feel hurt 2. Ask where your present is and make him/her feel guilty for forgetting 3. Throw a tantrum Is your choice of clothes? 1. Simple but stylish, with subdued colours 2. Bright and expensive 3. Flamboyant, to say the least You have an interview for a job you've always wanted, do you? 1. Feel nervous and rehearse for ages beforehand about how you'll approach it 2. Assume you're the one for the job and tell them how they really need you 3. Go all out to impress and be chatty and friendly with the interviewers Someone at work has been taking time off by pretending to be ill, what's your reaction? 1. You feel annoyed and complain quietly behind her back 2. You're not standing for that, you confront her in front of other colleagues 3. Say nothing - what she can do, you can do You discover that your partner has been two timing you, do you? 1. End the relationship but feel upset about it 2. Don't worry - you've been doing the same thing behind his back 3. Cause an emotional scene in front of them both You've won some money and there's an expensive piece of jewelry which you've been admiring for ages, however it will leave you with nothing left, do you? 1. Put a deposit on it and say you'll pay monthly - you need to spend the money on necessities 2. Rush out to the shop and buy it 3. Tell yourself you'll buy it but spend the money on clothes instead Your best friend is upset because her boyfriend has ended their relationship, do you 1. Invite her round to share a bottle of wine and a shoulder to cry on 2. Tell her she's better off without him 3. Don't get involved Now let's see what your personality type is... Submit"
