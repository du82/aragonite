title = "Campbell Leaper interviewed in BuzzFeed News"
full_description = "UC Santa Cruz MyUCSC People Calendars Maps A-Z Index Search Psychology About Undergraduate Graduate Faculty Courses Support Us Home / News & Events / News / BuzzFeed News article Campbell Leaper interviewed in BuzzFeed NewsNovember 11, 2016Psychology professor and Department Chair Campbell Leaper was quoted extensively in a BuzzFeed News article about women and sexism in light of the presidential election results. BuzzFeed news reporter Jessica Testa writes: “Leaper said, the second day after Election Day was easier than the first. His immediate reaction to Trump’s election was “deep depression” at the “shocking awareness that we thought things were a lot better than they are,” he said. It seemed during the campaign that the criticism of Trump’s 2005 comments was “society recognizing this as unacceptable behavior,” he said. And then Trump’s election pointed to “a larger current that either supported it or weren’t offended by it.” Read the full article here. NewsEventsFeatured ProfilesDiversity, Equity, and Inclusion Committee UC Santa Cruz, 1156 High Street, Santa Cruz, Ca 95064 ©2025 Regents of the University of California. All Rights Reserved. News & Events Contact Us Feedback Report an accessibility barrier Land Acknowledgment Employment Privacy Accreditation Last modified: December 2, 2016 144.217.85.240"
