["https://psychology.ucsc.edu/news-events/news/whittaker-star.html"]
title = "Facebook grapples with heartache as it jogs memories"
full_description = '''UC Santa Cruz MyUCSC People Calendars Maps A-Z Index Search Psychology About Undergraduate Graduate Faculty Courses Support Us Home / News & Events / News / Facebook grapples with heartache as it jogs memories Facebook grapples with heartache as it jogs memoriesJune 07, 2016The Star online, the web version of the Toronto Star quoted psychology professor Steve Whittaker in an article on Facebook memories. As the news article reads: "We don't really organise our digital stuff particularly well, and so a lot of it is in rather unexpected places. It might not be a Facebook post or status update you might encounter, it could be music and photos in a different place," said Steve Whittaker, a University of California at Santa Cruz psychology professor who has studied how people dispose of their digital possessions – or fail to dispose of them – after a breakup. That disorganisation, he said, makes it harder for some people to deal with unexpected reminders of past relationships online, especially if they were the ones dumped. Read the full article here > NewsEventsFeatured ProfilesDiversity, Equity, and Inclusion Committee UC Santa Cruz, 1156 High Street, Santa Cruz, Ca 95064 ©2025 Regents of the University of California. All Rights Reserved. News & Events Contact Us Feedback Report an accessibility barrier Land Acknowledgment Employment Privacy Accreditation Last modified: June 7, 2016 144.217.85.240'''
