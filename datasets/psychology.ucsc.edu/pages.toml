["https://psychology.ucsc.edu/undergraduate/advising/peer-advisors.html"]
title = "Meet our Peer Advising Team!"
full_description = '''UC Santa Cruz MyUCSC People Calendars Maps A-Z Index Search Psychology About Undergraduate Graduate Faculty Courses Support Us Home / Undergraduates / Undergraduate Advising / Peer Advisors Meet our Peer Advising Team!Our Peer Advisors are available for drop-in advising and over email to provide one-on-one advising for students. All Peer Advisors are trained to answer general questions regarding the Cognitive Science and Psychology undergraduate majors. You can find the Drop-In Advising schedule on the Undergraduate Advising webpage. Peer advisors are trained to assist with: personal academic plans, graduation checks, general questions about the majors, major declaration questions, and much more! For questions, please email psypeer@ucsc.edu! Meet Akela!Hi there! I'm Akela (she/her), and I'm a fourth year Psychology major affiliated with Kresge!"How long have you been at UCSC? If you are a transfer student, which school(s) did you attend prior?"I've been at UCSC throughout my entire four-year college career."Why did you want to become a Peer Advisor?"I personally know and have struggled with how hard it can be to navigate college logistics. I'm a first generation student, and having support (such as peer advisors) to reach out to when I was confused was very helpful, and now I'd like to pass that help along to others!"Outside of your studies, what do you do for fun or to find balance?"Most of my time outside of class is spent crocheting or taking care of my (too) many houseplants!"Is there an opportunity you've taken advantage of while at UCSC you recommend? (i.e. study abroad, research lab work, clubs or organization involvement?)"If you're interested in working with children, or being involved in education in general, I highly recommend Classroom Connection. It's a Merrill class, but non-Merrill affiliates can join if space is available! Although there are several different schools you can help out at, me and two other UCSC students participated at the middle/high school in Pescadero. I highly value the friendships I made with the other students who joined me, as well as the hands-on interactive work I was able to do/explore in a school setting!Meet Arun!Hello! My name is Arun Das (he/him), and I am a third-year Psychology and Sociology double major affiliated with Merrill."How long have you been at UCSC? If you are a transfer student, which school(s) did you attend prior?"I've been at UCSC for my entire three year college career so far."Why did you want to become a Peer Advisor?"Ultimately, I became a peer advisor to help students just as peer advisors helped me. Over the course of my time at UCSC, I found myself joining the drop-in zoom meetings stressed out and worrying about enrollment, major requirements, you name it. I would leave each meeting with a newfound sense of relief that I hope to pass on to students today."Outside of your studies, what do you do for fun or to find balance?"Outside of school, I am an avid record collector, enjoy watching way too much TV, and hanging out with friends."Is there an opportunity you've taken advantage of while at UCSC you recommend? (i.e. study abroad, research lab work, clubs or organization involvement?)"I would highly recommend any student, regardless of year, to visit the Career Center. They have a vast array of resources from online tests to match you with possible career paths and a free wardrobe of professional attire for prospective interviews.Meet Briza! Hey! I'm a 4th year Intensive Psychology major affiliated with Crown College."How long have you been at UCSC? If you are a transfer student, which school(s) did you attend prior?"I've been at UCSC since 2020."Why did you want to become a Peer Advisor?"I wanted the opportunity to put myself out there, while also being able to help people around me."Outside of your studies, what do you do for fun or to find balance?"I like to listen to music, watch a variety of shows, and talk to friends."Is there an opportunity you've taken advantage of while at UCSC you recommend? (i.e. study abroad, research lab work, clubs or organization involvement?)"LSS (Learning Student Services) is a good resource when it comes to courses that anyone might be having trouble with. It's a good way to connect with tutors and/or other students that can help each other out. Meet Logan! Hi, I am Logan Buchholz (he/him)! I'm a fourth-year student majoring in Intensive Psychology, affiliated with Porter College!"How long have you been at UCSC? If you are a transfer student, which school(s) did you attend prior?"I have attended UCSC since Winter 2023, and I transferred here from Moorpark Community College."Why did you want to become a Peer Advisor?"I wanted to become a Peer Advisor because of my Moorpark College academic counselor. She helped me get to UCSC, explore majors, and meet people on campus. It's her compassionate counseling that drove me to stay in school, find a love for Psychology, and apply for Peer Advising!"Outside of your studies, what do you do for fun or to find balance?"To have fun and find a balance I like to mountain bike near campus, surf at our local beaches, and run along the coast. "Is there an opportunity you've taken advantage of while at UCSC you recommend? (i.e. study abroad, research lab work, clubs or organization involvement?)"The one opportunity I have taken advantage of while at UCSC that I recommend is Yoga! Take the class on Tuesdays and Thursdays with Don at noon, it's a mellow class that will help you get through the week. Meet Nicole! Hi, I’m Nicole! I’m a third year pursuing Psychology with an intensive concentration and I’m affiliated with RCC."How long have you been at UCSC? If you are a transfer student, which school(s) did you attend prior?"I’ve been at UCSC since Fall of 2021."Why did you want to become a Peer Advisor?"As a first-generation student, I understand that navigating the college experience can be difficult or confusing. I want to be able to make this journey less stressful and answer any questions or concerns students may have to the best of my abilities. We’re here for you!"Outside of your studies, what do you do for fun or to find balance?"Outside of the academic setting, I enjoy second-hand shopping and going on road trips! I’ve been thrifting since I was 5 with my dad :) We also loved hitting the yard sales every weekend. My favorite road trip so far has been traveling alongside the coast and staying in Big Sur for a bit."Is there an opportunity you've taken advantage of while at UCSC you recommend? (i.e. study abroad, research lab work, clubs or organization involvement?)"Throughout my time here at UCSC, the EOP center has supported me and provided some great resources! Meet Palaash! Hi, I'm Palaash! I'm a 4th year Psychology and Business Management Economics double major, and am affiliated with Oakes."How long have you been at UCSC? If you are a transfer student, which school(s) did you attend prior?"I have been attending UCSC for 4 years now."Why did you want to become a Peer Advisor?"I wanted to become a Peer Advisor because I want to help people succeed & I understand how confusing the process can be to map out the future of your college career."Outside of your studies, what do you do for fun or to find balance?"I enjoy exercising and meditating to balance myself, as well as finding time to hangout with my friends!"Is there an opportunity you've taken advantage of while at UCSC you recommend? (i.e. study abroad, research lab work, clubs or organization involvement?)"CAPS is a very useful service and is there for every student. ExcludedExcludedUndergraduate AdvisingAdvising FormsEvents & WorkshopsEnrollment AssistanceQuarterly NewsletterExcludedPeer AdvisorsNew Student InformationExcludedExcludedExcludedExcludedAP and Transfer CoursesCareer ResourcesPsychology MajorsCognitive Science MajorField Study ProgramEducational OpportunitiesResources and SupportScholarship and AwardsFrequently Asked QuestionsProgram Learning Outcomes UC Santa Cruz, 1156 High Street, Santa Cruz, Ca 95064 ©2025 Regents of the University of California. All Rights Reserved. News & Events Contact Us Feedback Report an accessibility barrier Land Acknowledgment Employment Privacy Accreditation Last modified: May 9, 2024 144.217.85.240'''
