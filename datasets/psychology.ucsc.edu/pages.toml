title = "Congratulations to the Frank X. Barron Creativity Award Winners"
full_description = 'UC Santa Cruz MyUCSC People Calendars Maps A-Z Index Search Psychology About Undergraduate Graduate Faculty Courses Support Us Home / News & Events / News / Congratulations to the Frank X. Barron Creativity Award Winners Congratulations to the Frank X. Barron Creativity Award WinnersJuly 22, 2016Sara Goodman (left) and Yu Zhang (right)Psychology graduate Students Yu Zhang and Sara Goodman are the recent recipients of the Frank X. Barron Creativity Award, a scholarship that awards students who are researching areas broadly defined by one of UC Santa Cruz’s most distinguished faculty. Barron, a Professor Emeritus of Psychology, helped establish UC Santa Cruz as a campus where creativity research is a respected enterprise, and where students and faculty alike understand that human creativity can contribute to psychological health, personal freedom, and social well-being. Read more about Zhang and Goodman in "In Their Words," a new column where students across the Division of Social Sciences share what UC Santa Cruz means to them, advice for fellow students, and plans for the future. In Their Words: Sara Goodman In Their Words: Yu Zhang NewsEventsFeatured ProfilesDiversity, Equity, and Inclusion Committee UC Santa Cruz, 1156 High Street, Santa Cruz, Ca 95064 ©2025 Regents of the University of California. All Rights Reserved. News & Events Contact Us Feedback Report an accessibility barrier Land Acknowledgment Employment Privacy Accreditation Last modified: July 27, 2016 144.217.85.240'
