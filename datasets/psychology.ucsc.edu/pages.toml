["https://psychology.ucsc.edu/news-events/news/bay-area-reporter-hammack.html"]
title = "Unique study compares health of LGB age groups"
full_description = 'UC Santa Cruz MyUCSC People Calendars Maps A-Z Index Search Psychology About Undergraduate Graduate Faculty Courses Support Us Home / News & Events / News / Unique study compares health of LGB age groups Unique study compares health of LGB age groupsOctober 28, 2015The Bay Area Reporter interviews Associate Professor Phil Hammack about his research on the health and well-being of lesbian, gay, and bisexual people. Hammack is a collaborator with the Generations Project, a multi-site research endeavor that includes the University of California, Los Angeles (UCLA), Columbia University, the University of Arizona, and the University of California, San Francisco (UCSF). As Professor Hammack told reporter Matthew S. Bajko: "This study is needed, from my perspective, because the knowledge we have about LGBT people is rapidly becoming dated," Hammack goes on to say "Social change is happening so quickly for LGBT people. Not only do we need to update our knowledge, we also need to change our research designs so they take into account social change." Read the full article on the BAR website » See AlsoUnique study compares health of LGB age groupsPolitics, Culture & Identity (PCI) Lab NewsEventsFeatured ProfilesDiversity, Equity, and Inclusion Committee UC Santa Cruz, 1156 High Street, Santa Cruz, Ca 95064 ©2025 Regents of the University of California. All Rights Reserved. News & Events Contact Us Feedback Report an accessibility barrier Land Acknowledgment Employment Privacy Accreditation Last modified: November 10, 2015 144.217.85.240'
