title = "USA Today features psychology professor Campbell Leaper"
full_description = "UC Santa Cruz MyUCSC People Calendars Maps A-Z Index Search Psychology About Undergraduate Graduate Faculty Courses Support Us Home / News & Events / News / In the News: USA Today USA Today features psychology professor Campbell LeaperMarch 12, 2017Psychology professor Campbell Leaper at the University of California, Santa Cruz was featured in the USA Today article, Gender reveals: Insanely popular--and also outdated, where he discusses the problems that result from gender stereotypes and categorization. “When you put things in a category, we all naturally want to make meaning of that category,” Leaper is quoted saying. “Girl and boy, if those categories exist there must be reasons for that and we start to think about them differently.” Leaper is a developmental and social psychologist who investigates gender and sexism during childhood, adolescence, and adulthood. Find out more about his work on the research page of his website. NewsEventsFeatured ProfilesDiversity, Equity, and Inclusion Committee UC Santa Cruz, 1156 High Street, Santa Cruz, Ca 95064 ©2025 Regents of the University of California. All Rights Reserved. News & Events Contact Us Feedback Report an accessibility barrier Land Acknowledgment Employment Privacy Accreditation Last modified: March 17, 2017 144.217.85.240"
