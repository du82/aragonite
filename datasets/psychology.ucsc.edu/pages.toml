full_description = 'UC Santa Cruz MyUCSC People Calendars Maps A-Z Index Search Psychology About Undergraduate Graduate Faculty Courses Support Us Home / News & Events / News / More than a decade after release, they all come back More than a decade after release, they all come backNovember 05, 2015Distinguished psychology professor Craig Haney was quoted in a USA Today article that followed nine Texas inmates who were released from prison in 2002. Haney, who has long studied the psychological consequences of solitary confinement told USA Today that the practice is "the most extreme example of how far our incarceration policies have gone in the wrong direction." "It benefits no one", he was quoted as saying. Read the full article on the USA today website » The Crime Report published its own article about the USA Today article. NewsEventsFeatured ProfilesDiversity, Equity, and Inclusion Committee UC Santa Cruz, 1156 High Street, Santa Cruz, Ca 95064 ©2025 Regents of the University of California. All Rights Reserved. News & Events Contact Us Feedback Report an accessibility barrier Land Acknowledgment Employment Privacy Accreditation Last modified: November 10, 2015 144.217.85.240'
