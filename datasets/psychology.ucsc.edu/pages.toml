full_description = "UC Santa Cruz MyUCSC People Calendars Maps A-Z Index Search Psychology About Undergraduate Graduate Faculty Courses Support Us Home / News & Events / News / Claude Steele UC Berkeley provost Claude M. Steele speaks about stereotypes, identity, and academic performaceMarch 17, 2016Claude M. Steele, the executive vice chancellor and campus provost at UC Berkeley, is a social psychologist whose research looks at the social impacts of stereotype identities.On March 10, Claude M. Steele, a renowned social psychologist and UC Berkeley’s executive vice chancellor and campus provost, spoke about his research on stereotypes and identity to UCSC students, staff, and faculty. Sponsoring Steele’s visit was the UC Santa Cruz Division of Social Sciences, Office for Diversity, Equity, and Inclusion, and Department of Psychology. Read the Santa Cruz Sentinel event coverage > Watch the video > View photos > NewsEventsFeatured ProfilesDiversity, Equity, and Inclusion Committee UC Santa Cruz, 1156 High Street, Santa Cruz, Ca 95064 ©2025 Regents of the University of California. All Rights Reserved. News & Events Contact Us Feedback Report an accessibility barrier Land Acknowledgment Employment Privacy Accreditation Last modified: March 21, 2016 144.217.85.240"
