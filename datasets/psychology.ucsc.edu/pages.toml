description = "Introduces prospective majors to the scientific study of behavior and mental processes and also provides an overview for non-majors. Emphasizes social, cognitive, developmental, and personality psychology and their interrelations. (General Education Code(s): PE-H.)"
full_description = '''UC Santa Cruz MyUCSC People Calendars Maps A-Z Index Search Psychology About Undergraduate Graduate Faculty Courses Support Us Home / Courses / Course Catalog Course Catalog $(document).ready(function() { var courses="a:165:{i:0;a:8:{s:13:&quot;academic_year&quot;;s:4:&quot;2024&quot;;s:7:&quot;crse_id&quot;;s:6:&quot;027389&quot;;s:7:&quot;subject&quot;;s:4:&quot;PSYC&quot;;s:11:&quot;catalog_nbr&quot;;s:1:&quot;1&quot;;s:5:&quot;title&quot;;s:26:&quot;Introduction to Psychology&quot;;s:5:&quot;units&quot;;s:1:&quot;5&quot;;s:5:&quot;level&quot;;s:14:&quot;Lower Division&quot;;s:11:&quot;description&quot;;s:265:&quot;Introduces prospective majors to the scientific study of behavior and mental processes and also provides an overview for non-majors. Emphasizes social, cognitive, developmental, and personality psychology and their interrelations. (General Education Code(s): PE-H.)&quot;;}i:1;a:8:{s:13:&quot;academic_year&quot;;s:4:&quot;2024&quot;;s:7:&quot;crse_id&quot;;s:6:&quot;027392&quot;;s:7:&quot;subject&quot;;s:4:&quot;PSYC&quot;;s:11:&quot;catalog_nbr&quot;;s:1:&quot;2&quot;;s:5:&quot;title&quot;;s:40:&quot;Introduction to Psychological Statistics&quot;;s:5:&quot;units&quot;;s:1:&quot;5&quot;;s:5:&quot;level&quot;;s:14:&quot;Lower Division&quot;;s:11:&quot;description&quot;;s:511:&quot;An introduction to elementary statistical principles and techniques relevant to psychological research. Topics covered include basic parametric and nonparametric statistics, analysis of variance, and simple factorial designs. This course is prerequisite to PSYC 181. Prerequisite(s): PSYC 1 or PSYC 20; and AM 3 or AM 6 or MATH 3 or MATH 4 or MATH 11A or satisfactory placement score on math placement exam or CEEB Advanced Placement Calculus AB exam. Enrollment limited to 165. (General Education Code(s): SR.)&quot;;}i:2;a:8:{s:13:&quot;academic_year&quot;;s:4:&quot;2024&quot;;s:7:&quot;crse_id&quot;;s:6:&quot;027404&quot;;s:7:&quot;subject&quot;;s:4:&quot;PSYC&quot;;s:11:&quot;catalog_nbr&quot;;s:2:&quot;10&quot;;s:5:&quot;title&quot;;s:40:&quot;Introduction to Developmental Psychology&quot;;s:5:&quot;units&quot;;s:1:&quot;5&quot;;s:5:&quot;level&quot;;s:14:&quot;Lower Division&quot;;s:11:&quot;description&quot;;s:354:&quot;Addresses psychological development from conception through adolescence. Provides an overview of developmental psychology. Prerequisite(s): PSYC 1; and AM 3, or AM 6, or MATH 3 or higher level Mathematics course or mathematics placement (MP) score of 300 or higher, or AP Calculus AB exam score of 3 or higher; and PSYC 2 or STAT 5 or STAT 7 and STAT 7L.&quot;;}i:3;a:8:{s:13:&quot;academic_year&quot;;s:4:&quot;2024&quot;;s:7:&quot;crse_id&quot;;s:6:&quot;027410&quot;;s:7:&quot;subject&quot;;s:4:&quot;PSYC&quot;;s:11:&quot;catalog_nbr&quot;;s:2:&quot;20&quot;;s:5:&quot;title&quot;;s:31:&quot;Cognition: Fundamental Theories&quot;;s:5:&quot;units&quot;;s:1:&quot;5&quot;;s:5:&quot;level&quot;;s:14:&quot;Lower Division&quot;;s:11:&quot;description&quot;;s:271:&quot;Introduces basic concepts in cognitive psychology with a focus on theoretical explanations of cognitive functioning. Topics include perception, attention, memory, concepts, language, visual cognition, executive functions, and reasoning processes. (Formerly course 20A.) .&quot;;}i:4;a:8:{s:13:&quot;academic_year&quot;;s:4:&quot;2024&quot;;s:7:&quot;crse_id&quot;;s:6:&quot;027424&quot;;s:7:&quot;subject&quot;;s:4:&quot;PSYC&quot;;s:11:&quot;catalog_nbr&quot;;s:2:&quot;40&quot;;s:5:&quot;title&quot;;s:33:&quot;Introduction to Social Psychology&quot;;s:5:&quot;units&quot;;s:1:&quot;5&quot;;s:5:&quot;level&quot;;s:14:&quot;Lower Division&quot;;s:11:&quot;description&quot;;s:310:&quot;An analysis of contemporary research in social psychology and of what that research can teach us about the world we live in. Problems of conformity, propaganda, prejudice, attraction, and aggression. Focuses on a person's relationship with other people, how he or she influences them and is influenced by them.&quot;;}i:5;a:8:{s:13:&quot;academic_year&quot;;s:4:&quot;2024&quot;;s:7:&quot;crse_id&quot;;s:6:&quot;027442&quot;;s:7:&quot;subject&quot;;s:4:&quot;PSYC&quot;;s:11:&quot;catalog_nbr&quot;;s:2:&quot;60&quot;;s:5:&quot;title&quot;;s:38:&quot;Introduction to Personality Psychology&quot;;s:5:&quot;units&quot;;s:1:&quot;5&quot;;s:5:&quot;level&quot;;s:14:&quot;Lower Division&quot;;s:11:&quot;description&quot;;s:184:&quot;An overview of major personality theories from Freud to the modern day, and an introduction to contemporary research on personality development and assessment. Prerequisite(s): PSYC 1.&quot;;}i:6;a:8:{s:13:&quot;academic_year&quot;;s:4:&quot;2024&quot;;s:7:&quot;crse_id&quot;;s:6:&quot;027397&quot;;s:7:&quot;subject&quot;;s:4:&quot;PSYC&quot;;s:11:&quot;catalog_nbr&quot;;s:3:&quot;100&quot;;s:5:&quot;title&quot;;s:30:&quot;Research Methods in Psychology&quot;;s:5:&quot;units&quot;;s:1:&quot;7&quot;;s:5:&quot;level&quot;;s:14:&quot;Upper Division&quot;;s:11:&quot;description&quot;;s:477:&quot;An introduction to research methods used to investigate human psychology. Course emphasizes critical thinking, designing and conducting research, analyzing and interpreting data, and writing a professional research report. Prerequisites: Entry Level Writing and Composition requirement; AM 3 or AM 6, or MATH 3 or higher level Math course, or math placement (MP) score of 300 or higher, or AP Calculus AB exam score of 3 or higher; and PSYC 2, or STAT 5, or STAT 7 and STAT 7L.&quot;;}i:7;a:8:{s:13:&quot;academic_year&quot;;s:4:&quot;2024&quot;;s:7:&quot;crse_id&quot;;s:6:&quot;101088&quot;;s:7:&quot;subject&quot;;s:4:&quot;PSYC&quot;;s:11:&quot;catalog_nbr&quot;;s:3:&quot;101&quot;;s:5:&quot;title&quot;;s:34:&quot;Topics in Developmental Psychology&quot;;s:5:&quot;units&quot;;s:1:&quot;5&quot;;s:5:&quot;level&quot;;s:14:&quot;Upper Division&quot;;s:11:&quot;description&quot;;s:119:&quot;These topics, offered at different times by different instructors, examine selected topics in developmental psychology.&quot;;}i:8;a:8:{s:13:&quot;academic_year&quot;;s:4:&quot;2024&quot;;s:7:&quot;crse_id&quot;;s:6:&quot;027493&quot;;s:7:&quot;subject&quot;;s:4:&quot;PSYC&quot;;s:11:&quot;catalog_nbr&quot;;s:3:&quot;102&quot;;s:5:&quot;title&quot;;s:56:&quot;Adolescent Development: Adolescence into Young Adulthood&quot;;s:5:&quot;units&quot;;s:1:&quot;5&quot;;s:5:&quot;level&quot;;s:14:&quot;Upper Division&quot;;s:11:&quot;description&quot;;s:308:&quot;Focuses on individual and relational development from early adolescence into emergin adulthood. Emphasis on the mutual influences of family relationships and adolescent development, and on the interface of family, peer group, and school experience in cultural contexts. Prerequisite(s): PSYC 10 and PSYC 100.&quot;;}i:9;a:8:{s:13:&quot;academic_year&quot;;s:4:&quot;2024&quot;;s:7:&quot;crse_id&quot;;s:6:&quot;027513&quot;;s:7:&quot;subject&quot;;s:4:&quot;PSYC&quot;;s:11:&quot;catalog_nbr&quot;;s:3:&quot;103&quot;;s:5:&quot;title&quot;;s:27:&quot;Adult Development and Aging&quot;;s:5:&quot;units&quot;;s:1:&quot;5&quot;;s:5:&quot;level&quot;;s:14:&quot;Upper Division&quot;;s:11:&quot;description&quot;;s:323:&quot;Overview of the cultural, societal, biological, interpersonal, and cognitive processes of adult development and aging. Class discusses how each of these contexts and processes promotes stability and change as adults experience adulthood, reflect on their lives, and prepare for death. Prerequisite(s): PSYC 10 and PSYC 100.&quot;;}i:10;a:8:{s:13:&quot;academic_year&quot;;s:4:&quot;2024&quot;;s:7:&quot;crse_id&quot;;s:6:&quot;027509&quot;;s:7:&quot;subject&quot;;s:4:&quot;PSYC&quot;;s:11:&quot;catalog_nbr&quot;;s:3:&quot;104&quot;;s:5:&quot;title&quot;;s:22:&quot;Development in Infancy&quot;;s:5:&quot;units&quot;;s:1:&quot;5&quot;;s:5:&quot;level&quot;;s:14:&quot;Upper Division&quot;;s:11:&quot;description&quot;;s:270:&quot;Focuses on psychological development in infancy. Presents research on perceptual, cognitive, and social-emotional development during the first two years of life. Prerequisite(s): PSYC 10 and PSYC 100. Enrollment is restricted to psychology and cognitive science majors.&quot;;}i:11;a:8:{s:13:&quot;academic_year&quot;;s:4:&quot;2024&quot;;s:7:&quot;crse_id&quot;;s:6:&quot;027530&quot;;s:7:&quot;subject&quot;;s:4:&quot;PSYC&quot;;s:11:&quot;catalog_nbr&quot;;s:3:&quot;105&quot;;s:5:&quot;title&quot;;s:19:&quot;Children's Thinking&quot;;s:5:&quot;units&quot;;s:1:&quot;5&quot;;s:5:&quot;level&quot;;s:14:&quot;Upper Division&quot;;s:11:&quot;description&quot;;s:377:&quot;Cognition in children from infancy through adolescence. Basic and current research on children's understanding of the social and physical world. Focus on major theoretical perspectives: especially Piaget's constructivist approach and sociocultural approach. Prerequisite(s): PSYC 10 and PSYC 100. Enrollment is restricted to psychology and cognitive science majors and minors.&quot;;}i:12;a:8:{s:13:&quot;academic_year&quot;;s:4:&quot;2024&quot;;s:7:&quot;crse_id&quot;;s:6:&quot;027507&quot;;s:7:&quot;subject&quot;;s:4:&quot;PSYC&quot;;s:11:&quot;catalog_nbr&quot;;s:3:&quot;106&quot;;s:5:&quot;title&quot;;s:32:&quot;Social and Emotional Development&quot;;s:5:&quot;units&quot;;s:1:&quot;5&quot;;s:5:&quot;level&quot;;s:14:&quot;Upper Division&quot;;s:11:&quot;description&quot;;s:157:&quot;An examination of contemporary theory and research on social and emotional development from infancy through childhood. Prerequisite(s): PSYC 10 and PSYC 100.&quot;;}i:13;a:8:{s:13:&quot;academic_year&quot;;s:4:&quot;2024&quot;;s:7:&quot;crse_id&quot;;s:6:&quot;111507&quot;;s:7:&quot;subject&quot;;s:4:&quot;PSYC&quot;;s:11:&quot;catalog_nbr&quot;;s:3:&quot;107&quot;;s:5:&quot;title&quot;;s:22:&quot;Gender and Development&quot;;s:5:&quot;units&quot;;s:1:&quot;5&quot;;s:5:&quot;level&quot;;s:14:&quot;Upper Division&quot;;s:11:&quot;description&quot;;s:164:&quot;Examines the developmental psychology of gender from infancy to adolescence. . Prerequisite(s): PSYC 10 and PSYC 100. Enrollment is restricted to psychology majors.&quot;;}i:14;a:8:{s:13:&quot;academic_year&quot;;s:4:&quot;2024&quot;;s:7:&quot;crse_id&quot;;s:6:&quot;116224&quot;;s:7:&quot;subject&quot;;s:4:&quot;PSYC&quot;;s:11:&quot;catalog_nbr&quot;;s:3:&quot;108&quot;;s:5:&quot;title&quot;;s:22:&quot;Educational Psychology&quot;;s:5:&quot;units&quot;;s:1:&quot;5&quot;;s:5:&quot;level&quot;;s:14:&quot;Upper Division&quot;;s:11:&quot;description&quot;;s:280:&quot;An overview of psychological theories and principles applied to formal and informal educational settings. Topics include: learning, motivation, cultural diversity, individual differences, and assessment. Students complete a research project. Prerequisite(s): PSYC 10 and PSYC 100.&quot;;}i:15;a:8:{s:13:&quot;academic_year&quot;;s:4:&quot;2024&quot;;s:7:&quot;crse_id&quot;;s:6:&quot;125370&quot;;s:7:&quot;subject&quot;;s:4:&quot;PSYC&quot;;s:11:&quot;catalog_nbr&quot;;s:3:&quot;109&quot;;s:5:&quot;title&quot;;s:58:&quot;Psychobiology of Stress and Well-being across the Lifespan&quot;;s:5:&quot;units&quot;;s:1:&quot;5&quot;;s:5:&quot;level&quot;;s:14:&quot;Upper Division&quot;;s:11:&quot;description&quot;;s:518:&quot;Emphasizes bi-directional relationships between psychobiological systems, stress, and well-being throughout the lifespan. Major topics include biological stress response systems (HPA-axis, autonomic nervous system, immune system, neural threat response), means of measuring stress in research, health behaviors (sleep, substance use, risk-taking), and positive well-being (emotion, psychological resources, prosocial behavior). (Formerly Stress and Well-Being throughout Development.) Prerequisite(s): PSYC 10 and 100.&quot;;}i:16;a:8:{s:13:&quot;academic_year&quot;;s:4:&quot;2024&quot;;s:7:&quot;crse_id&quot;;s:6:&quot;125101&quot;;s:7:&quot;subject&quot;;s:4:&quot;PSYC&quot;;s:11:&quot;catalog_nbr&quot;;s:3:&quot;111&quot;;s:5:&quot;title&quot;;s:28:&quot;The origins of social biases&quot;;s:5:&quot;units&quot;;s:1:&quot;5&quot;;s:5:&quot;level&quot;;s:14:&quot;Upper Division&quot;;s:11:&quot;description&quot;;s:603:&quot;Engages students with fundamental theories and research in developmental psychology to better understand the social nature of human beings and how social biases emerge. Discussions include research and questions central to how social biases form with a focus on research from infancy and early childhood. Asks questions such as: What sets us up to be social? How do we learn about power and status? When and how do kids start to learn about race? Educates students to have foundational knowledge in developmental psychology and critically assess research. Prerequisite(s): PSYC 1, PSYC 10, and PSYC 100.&quot;;}i:17;a:8:{s:13:&quot;academic_year&quot;;s:4:&quot;2024&quot;;s:7:&quot;crse_id&quot;;s:6:&quot;116328&quot;;s:7:&quot;subject&quot;;s:4:&quot;PSYC&quot;;s:11:&quot;catalog_nbr&quot;;s:3:&quot;112&quot;;s:5:&quot;title&quot;;s:17:&quot;Moral Development&quot;;s:5:&quot;units&quot;;s:1:&quot;5&quot;;s:5:&quot;level&quot;;s:14:&quot;Upper Division&quot;;s:11:&quot;description&quot;;s:315:&quot;How and why do children develop into moral beings? This course covers key theories and empirical research about the cognitive, emotional, and behavioral aspects of moral development, including psychoanalytic, behaviorist, constructivist, nativist, and evolutionary approaches. Prerequisite(s): PSYC 10 and PSYC 100.&quot;;}i:18;a:8:{s:13:&quot;academic_year&quot;;s:4:&quot;2024&quot;;s:7:&quot;crse_id&quot;;s:6:&quot;119570&quot;;s:7:&quot;subject&quot;;s:4:&quot;PSYC&quot;;s:11:&quot;catalog_nbr&quot;;s:3:&quot;114&quot;;s:5:&quot;title&quot;;s:39:&quot;Human Development as a Cultural Process&quot;;s:5:&quot;units&quot;;s:1:&quot;5&quot;;s:5:&quot;level&quot;;s:14:&quot;Upper Division&quot;;s:11:&quot;description&quot;;s:299:&quot;Examines interdisciplinary theory, research, and methods of studying the cultural basis of human development, and variations and similarities in human lives and practices in the United States and worldwide cultural communities. Prerequisite(s): PSYC 10 and PSYC 100. (General Education Code(s): CC.)&quot;;}i:19;a:8:{s:13:&quot;academic_year&quot;;s:4:&quot;2024&quot;;s:7:&quot;crse_id&quot;;s:6:&quot;027535&quot;;s:7:&quot;subject&quot;;s:4:&quot;PSYC&quot;;s:11:&quot;catalog_nbr&quot;;s:3:&quot;115&quot;;s:5:&quot;title&quot;;s:38:&quot;Lifespan Developmental Psychopathology&quot;;s:5:&quot;units&quot;;s:1:&quot;5&quot;;s:5:&quot;level&quot;;s:14:&quot;Upper Division&quot;;s:11:&quot;description&quot;;s:309:&quot;Examines theory and research on developmental psychopathology. Emphasizes the origin and longitudinal course of disordered behavior. Explores the processes underlying continuity and change in patterns of adaptation and age-related changes in manifestations of disorders. Prerequisite(s): PSYC 10 and PSYC 100.&quot;;}i:20;a:8:'''
