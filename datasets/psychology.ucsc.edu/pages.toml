title = "Going the distance: contact vs. motivation"
full_description = "UC Santa Cruz MyUCSC People Calendars Maps A-Z Index Search Psychology About Undergraduate Graduate Faculty Courses Support Us Home / News & Events / News / Going the distance: contact vs. motivation Going the distance: contact vs. motivationFebruary 12, 2016The Jerusalem Post published an op-ed by Andrew Pilecki, a UCSC Ph.D. in psychology, and Phillip Hammack, associate professor of psychologyPhillip Hammack, an Associate Professor of Psychology and Andrew Pilecki, a graduate of the department's Ph.D. program, published an op-ed, Going the distance: contact vs. motivation, arguing that well-intentioned programs that promote contact to reduce prejudice are, at best, inconsequential, and at worst, harmful. Pilecki is a Fulbright post-doctoral researcher in Herzliya, Israel. Hammack is Associate Professor of Psychology at UC Santa Cruz and Director of the PCI Lab. Hammack is the author of two books on this topic, Narrative and the Politics of Identity: The Cultural Psychology of Israeli and Palestinian Youth (2011, Oxford University Press), and Can Talking Help? Dialogue and the Politics of Difference (forthcoming, Oxford University Press). Read the story » See AlsoPolitics, Culture, and Political Identity Lab NewsEventsFeatured ProfilesDiversity, Equity, and Inclusion Committee UC Santa Cruz, 1156 High Street, Santa Cruz, Ca 95064 ©2025 Regents of the University of California. All Rights Reserved. News & Events Contact Us Feedback Report an accessibility barrier Land Acknowledgment Employment Privacy Accreditation Last modified: May 10, 2016 144.217.85.240"
