["https://psychology.ucsc.edu/news-events/events/index.html"]
title = "Events"
full_description = '''UC Santa Cruz MyUCSC People Calendars Maps A-Z Index Search Psychology About Undergraduate Graduate Faculty Courses Support Us Home / News & Events / Events EventsCongratulations 2020-2021 Graduates!March 4, 2025Congratulations to our 2022 Award Recipients! July 1, 2022Learning through Observing and Pitching InMay 9, 2022A strength of many Mexican and Indigenous-heritage communities is a learning paradigm that involves Learning by Observing and Pitching In to family and community endeavors (LOPI). In describing key features of LOPI, we hope our work's impact will include broadening participation by recognizing strengths for learning, inspiring changes in formal and informal educational settings, and serving communities in which LOPI prevails, by offering a tool for explaining these ways of learning to outside agencies. Some of the key features of LOPI include community organization in which all ages contribute to shared endeavors, with voluntary and fulfilling participation, collaborating with initiative to foster the direction of the group, using a theory of learning that emphasizes growth in contributing to the greater good, and learning through keen attention and contribution. NSF Program: Research on Education and Learning (REAL)Do dreams mean anything? Why do I feel like I’m falling? Or wake up paralyzed? We asked experts.December 30, 2021Do dreams mean anything? Why do I feel like I’m falling? Or wake up paralyzed? We asked experts. Distinguished Professor Emeritus G. William Domhoff interviewed.California will require large retailers to provide gender-neutral toy sectionsOctober 9, 2021SACRAMENTO — California became the first state in the nation Saturday to adopt a law requiring large retail stores to provide gender-neutral toy sections under a bill signed by Gov. Gavin Newsom. Distinguished Professor Campbell Leaper interviewed.How COVID-19 Challenged Us to Rewrite Our Life StoriesJune 24, 2021How we made meaning, stayed sane, and may have become more authentic. *The pandemic forced people to turn inward, gave them time to slow down and think deeply about their identities, desires and relationships. *An uptick in Google searches related to relationship dissolution at the start of the pandemic suggests that many faced turning points. *Many used technology in positive ways, for example by using it to explore different sides of themselves and connect with others.What prisoners in solitary confinement can teach us about social isolationApril 3, 2020Tens of millions of Californians are sheltering in place — a passive form of social isolation that radically limits the amount of social contact they are supposed to have with others. There are a number of unanticipated, unintended, but potentially very serious consequences of this form of social distancing, no matter how absolutely necessary it is.These L.A. parents don’t want to assign a gender to their baby, so the government did it for themSeptember 25, 2019Campbell Leaper, a psychology professor at UC Santa Cruz who studies childhood gender development, said that gender stereotypes limit kids early and enduringly.Helping and Hindering Undergraduate Women’s STEM Motivation: Experiences with STEM Encouragement, STEM-Related Gender Bias, and Sexual HarassmentMay 9, 2019Professor Campbell Leaper and Graduate Student Christy Starr discuss the #MeToo and other feminist social movements have highlighted the prevalence of sexual harassment and gender-biased treatment, as well as how damaging they can be. In the Realm of "Ahh"May 7, 2019Professor Jean E. Fox Tree discusses voice and style of speech—including pesky filler words—reveal a lot about a speaker.Open Forum: On the legacy of AIDS — trauma and shame get in the way of HIV preventionMarch 28, 2019Men & Women Tend To Approach Conversations Differently — Here's HowMarch 26, 2019Supreme Court takes no action on DACA, what this means for ‘Dreamers’ in SalinasJanuary 22, 2019Professor Gina Langhout was interviewed for this article on DACA.An immigration and deportation talk translates the scientific and legal speakJanuary 17, 2019The Pacific Grove Museum of Natural History is running a series called Hardcore Natural History in which they explore different themes in research presentations through three lenses: plant, animal, and human/cultural. Their latest theme is migration, which they’ve covered via eucalyptus trees and plankton; this Friday they cover the human element in a talk titled “Deportation Uncovered.”Beyond ‘no means no’: What most parents aren’t teaching their sons about sexual consentOctober 4, 2018In the age of #MeToo, and in the wake of the Brett Kavanaugh hearings, parents across the country have been wrestling with the anxieties of raising teenage boys to understand consent. How does a parent bring clarity to an issue that is too complex even for the country’s political leaders to navigate? How can a mother or father prevent their teenage son from someday being accused of sexual assault? NewsEventsFeatured ProfilesDiversity, Equity, and Inclusion Committee UC Santa Cruz, 1156 High Street, Santa Cruz, Ca 95064 ©2025 Regents of the University of California. All Rights Reserved. News & Events Contact Us Feedback Report an accessibility barrier Land Acknowledgment Employment Privacy Accreditation Last modified: June 15, 2011 144.217.85.240'''
