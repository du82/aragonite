full_description = "Upon entering the graduate program, students consult with their faculty sponsors to outline a plan of academic study that corresponds with their interests and goals, including formal course work, seminars, colloquia, independent studies, and research. The major emphasis of the Ph.D. program in Psychology is to prepare students to conduct independent research at a high level of creative scholarship. Students must collect their own data at some phase of their graduate careers; in other phases they may use existing data. In general, all students are expected to be active in conducting both collaborative and independent research throughout their graduate careers, leading up to the completion of a Ph.D. dissertation."
