["https://psychology.ucsc.edu/undergraduate/educational-opportunities/education-abroad.html"]
title = "Global Learning"
full_description = '''Many of our majors choose to study abroad during their time at UCSC, the most popular times being the fall quarter of their junior or senior year. Both the Cognitive Science and Psychology major are flexible in accommodating study abroad plans, so take a look at the info below to see how you can explore the world (and get major credit too)! Exploring UCSC Global Learning Options Check out the Global Learning website to create a profile in the Global Learning Portal and start exploring available programs. Completing Major Requirements Abroad A maximum of THREE major requirements can be fulfilled abroad with the department’s approval Cognitive Science Students are allowed to take two upper division cognitive courses and one interdisciplinary elective to satisfy major requirements. Note: Courses taken to satisfy the DC requirement must be taken at UCSC, without exception. General Psychology, and Intensive Psychology (2019 & 2020-22 Catalogs) Students are allowed to transfer two upper division courses (must be from 2 different areas) and one outside course to satisfy major requirements. Note: Courses taken to satisfy the DC Requirement and 1 UD class from each area (DEV, COG, SOC) must be taken at UCSC, without exception. Major Course Review Process If you are interested in taking courses abroad to fulfill major requirements, begin this process by checking the Psychology Department's pre-approved course list at least 3 weeks before the deadline to submit your study abroad application to see what courses have already been approved (if any) for your selected program. If no courses have been approved for your selected program, or the course you're interested in taking has not been reviewed yet, please submit a course description or syllabus for each course via the Major Course Review form. The review process can take 7-10 business days. Please note that a syllabus is always preferred and may be requested if more information is required to evaluate the course. Once your petition is reviewed, you will receive an email from an advisor with the results of the review. Keep this email as proof of the Department's decision. After you have received approval for your global learning courses, you may include them in your Proposed Academic Plan on the Global Learning Approval Form. Once you've completed all required sections, share your Global Learning Approval Form with psyadv@ucsc.edu. Be sure to provide edit access and include a comment indicating that you are requesting an advisor's signature. We will respond within 5 business days to any signature requests. If you're abroad and your courses change, you should contact the department again via email and submit any new courses for review via the Major Review form linked above. Please note that psychology advisors cannot review potential GE courses. If you are interested in fulfilling General Education requirements abroad, submit your possible GE course(s) to the Office of Admissions. Tips While Studying Abroad Check your UCSC email often so you don't miss important dates and deadlines. You will still be responsible for adhering to enrollment request, senior seminar and field study opportunity deadlines. Take your courses seriously and also take time to enjoy and explore your temporary home. Balance is key! Buen viaje! UCSC Exchanges and UCEAP: Courses & Grades Grades can take up to 4 MONTHS after the official end date of your UCSC Exchange or UCEAP program to be posted to your UCSC transcript. Once your grades have been posted on your UCSC portal, contact your major advisor at psyadv@ucsc.edu to have your academic advisement report updated. Make sure to attach the email that shows proof of your course(s) approval. A note from Amy about her time Studying Abroad! (Amy, Cognitive Science student) "I must say that I did not realize what my UCEAP experience in Russia was worth until my return back to America. Being a student in a place where the weather, language, cultural mentality, history, and even food is different from what I am used to, actually allowed me to learn beyond the books and texts that can seem routinely assigned. I became more aware of just how much a person’s environment plays a role on their ability to be a student. This is now a thought tool that I use as I continue my undergraduate education. There is a greater ability to understand differing viewpoints, different reasonings, and respecting differences without judging. This is essential for university students who aim to enhance critical thinking and awareness. And just like anything that is worth having, my experience abroad did not come without its challenges. Thankfully, that is where learning and personal growth often happens."'''
year_published = 2025
clearnet = "https://psychology.ucsc.edu/undergraduate/educational-opportunities/education-abroad.html"
