title = "Spotlight on Diversity"
full_description = '''Zak Keith Tell us about yourself. I’m Zak, and my pronouns are they/them. I’m from a small rural town in Appalachia, Virginia with a population of about 270 people, where being a non-binary queer person was far from accepted. I pursued my undergraduate studies at Virginia Tech, earning degrees in psychology, sociology, and criminology, driven by a desire to understand individual and societal behaviors. I later worked at the University of Houston as a behavioral researcher, focusing on emotion communication through nonverbal touch between parents and children. Applying to grad school led me to UCSC, where I've been growing both as a scholar and an artist. Additionally, I'm a professional drag queen and have recently started a drag consulting and production business. Can you tell us about how your work contributes to DEI efforts, whether it be in your community, research, service, or teaching? My research is deeply intertwined with diversity, equity, and inclusion, particularly focusing on gender and sexual diversity. Initially, I concentrated on how queer youth construct their identities in digital landscapes. My work with the Santa Cruz Diversity Center has since broadened my scope to include multi-generational queer communities, exploring various intersecting factors of identity such as wellness, conflict resolution, political tensions, community building, and self-care practices. I often represent Queer culture to our community and a core thread throughout my teaching is the significant contributions of Black trans women and African American Vernacular English (AAVE) to Queer culture. I facilitate a trans and non-binary youth support group, witnessing participants grow from shy individuals to confident advocates, underscoring the importance of community support in personal development. Beyond academia, I engage in meaningful conversations with parents and teachers about creating safe and supportive environments for LGBTQ+ youth, such as teaching a Gender 201 class at the queer youth summit for approximately 50 parents and educators. What made you choose UC Santa Cruz, and, in particular, the UCSC psychology department? Choosing UC Santa Cruz and the UCSC psychology department stemmed from my desire for a safe haven and academic inspiration. Phil Hammack's article "From Sickness to Species to Subjects" empowered me and made so much sense to me as a young queer scholar, so I looked into Phil Hammack’s work and discovered his affiliation with social psychology. However, I knew my passion lay in developmental psychology, especially working with families and youth. My decision was solidified when I read a paper co-authored by Phil and my current advisor, Adriana Manago, and learned of Adriana’s work looking at cultural context in digital landscapes. Additionally, I was inspired by UCSC's historical significance in Queer theory and influential professor alumni like Angela Davis. What can the department and campus do to help sustain the work that you do? Although the internal staff and administrators of the Psychology department have been terrific, the funding procedures in the graduate division require improvement, especially in securing Graduate Student Researcher (GSR) positions in partnership with outside organizations. Working with the Santa Cruz Diversity Center highlighted challenges such as changing payment amounts and unhelpful redirections, reflecting inequitable practices compared to STEM organizations. These barriers seemed targeted due to our focus on Queer communities. Internally, I also want to advocate for normalizing the sharing of pronouns and increasing visible safe spaces on campus. The walls of our department are often barren of representation, art, or inclusivity. I would strongly recommend enhancing visibility and signal safety for Queer individuals, particularly for BIPOC Queer community members who are navigating both racial and Queer identities. For example, we have ample artists on this campus who could help to create murals that reflect the inclusivity the department strives to create. The increased visibility that celebrates and accepts these identities would be a valuable addition to our campus. What action do you recommend to others in relation to DEI? What kind of advice would you give to others who want to get more involved in DEI related work? First, for those looking to engage deeply in DEI efforts, embracing the inevitability of mistakes is essential. Our understanding and knowledge in this field are constantly evolving. We are perpetually learning, analyzing, and reevaluating our perspectives. It is crucial to become comfortable with making mistakes, acknowledging our limitations, and committing to continuous learning and improvement. For instance, when working with trans and non-binary individuals who may be adjusting their pronouns, I have encountered numerous parents, teachers, and professors who strive to be inclusive. This process requires time and patience. The key is to be intentional about recognizing and correcting mistakes without shifting the responsibility onto others. This approach applies broadly to many DEI initiatives, where addressing one's privileges and oppressions openly and using these acknowledgments to drive action is fundamental. Therefore, my first piece of advice is to become comfortable with discomfort. If you are not feeling uncomfortable, you are likely not challenging yourself enough. Discomfort is an indicator that you are pushing your boundaries and growing as an individual in DEI work. Second, in terms of practical actions, if you hold any position of authority or influence, it is important to be transparent about your pedagogical practices. Whether you are a teacher, mentor, or leader, clearly articulate your beliefs about mentorship and leadership, and how your identity and the identities of those you work with shape these relationships. For example, I always share my pedagogical practices with my mentees and students. This transparency fosters dialogue and mutual understanding, which are crucial for advancing DEI initiatives. Furthermore, if you have the privilege and power to effect change, do not hesitate to use your voice. Even small actions, like advocating for the inclusion of pronouns in community guidelines, can contribute to creating more equitable practices. These moments of bravery can collectively lead to progress in DEI efforts. Prior Spotlights Kathy Montano Tell us about yourself. I have been a staff member at UCSC and the Psychology Department for eight years and began in my position as Psychology Graduate Program Coordinator in 2018. My professional journey has been anchored in an interest in psychology, particularly in areas such as mental health and well-being, cultural competence, and the psychological welfare of students. I earned my bachelor’s degree in psychology at UCSC and during my undergraduate education I served as a peer advisor within the psychology department. This experience significantly influenced my decision to pursue a career in higher education. Outside of my professional pursuits, I maintain an ongoing interest in mental health and well-being. I also find enjoyment in outdoor activities, exploring diverse musical genres and going to see live music, and cherishing moments with loved ones and family. How do you work to foster a sense of inclusion and community in your role, either on campus or in the community? I work to foster a sense of inclusion and community by recognizing and honoring the multitude of identities that individuals hold, many of which may not be immediately visible. I strive to approach all interactions and tasks with a DEI perspective, understanding that each person brings their unique background and experiences to the program, workplace, etc. This means actively seeking to understand and uplift the needs and perspectives of underrecognized groups, whether it's in planning events, developing policies, or simply engaging in everyday conversations. By creating spaces where everyone feels seen, heard, and valued, I hope to cultivate an environment where individuals can thrive and contribute to the community authentically. I find it important to examine the current policies and procedures currently in place in higher education and challenge what, or whom, these policies are meant to serve. As UCSC begins to hold titles such as an HSI serving institution, it’s important to ensure that the policies and programming are serving students in these identities. Additionally, I hold value in being a perpetual student. I appreciate and take advantage of opportunities where I can continue learning and deepening my understanding of diversity perspectives and practices. This could be by attending diversity trainings and certifications and ultimately being open to feedback and opportunities to grow in this area as well. What do you value about working at UC Santa Cruz and in particular, the psychology department? I really value the content that is being taught and focused on in psychology courses, and especially the research being conducted in the department. I recall being an undergraduate student and taking UCSC psychology courses, and for the first time, seeing my identity and experiences being discussed and valued in educational spaces. As a Hispanic and first-generation woman, much of my adolescent experiences in education ignored these identities. At UCSC, and specifically the psychology department, I quickly recognized that the inclusion of marginalized communities was the focus of many psychology courses and the research being done in the department. I find so much value being in a community that fosters these ideas and is committed to social issues and culturally sensitive approaches to teaching and research. I greatly value supporting graduate students and faculty who are dedicating their time and efforts to advancing cultural understanding and addressing social issues through their research. Additionally, my experience as a staff member within the department has been enriched by a culture of flexibility and understanding. There's a genuine recognition that many staff hold multiple responsibilities outside of work. This understanding fosters a healthy work-life balance, crucial for avoiding burnout, staying motivated, and feeling valued as a staff member. I appreciate the department's commitment to ensuring that staff needs are heard and addressed, demonstrating a true investment in our well-being and success. What can the department/campus do to help sustain the DEI-related work that you do? Sustaining DEI-related work requires ongoing commitment and collaboration from all levels of the department and campus. One way to support this effort is by providing resources and support for DEI initiatives, such as funding for diversity programming and training opportunities for staff. The campus has not offered the Diversity & Inclusion certification programming available to staff since before the onset of the pandemic. This is one of the few educational opportunities where staff were able to commit their time to learning and strengthening their approaches to topics related to DEI. It’s helpful when the campus and the department recognizes these resources as vital for the development of staff which in turn, benefits student success. It's also crucial to work in a department where participation in DEI training is valued, ensuring that staff can fully engage in DEI efforts without having to manage additional responsibilities on top of their full workload. This ultimately contributes to the sustainability of our DEI-related work. Additionally, it would be beneficial for our department to demonstrate a commitment to examining our programmatic practices to better support the current needs of all students, particularly addressing the calls for more support around sharing resources, milestones, and mentoring for graduate students. What action do you recommend to others in relation to DEI? What kind of advice would you give to others who want to get more involved in DEI related work? I recommend taking a proactive approach to Diversity, Equity, and Inclusion by educating oneself on relevant issues and actively supporting marginalized communities. This can involve attending workshops, participating in diversity-focused events, and advocating for inclusive policies. Additionally, remaining open to ideas and feedback is crucial. DEI work requires ongoing commitment and perseverance, both individually and as a community. Start by connecting with individuals involved in DEI work, learn from their experience and how they got involved, and gradually getting involved in initiatives aligned with your goals. Danny Rahal Tell us about yourself. I'm an Assistant Professor in the Psychology Department and an affiliate of the interdisciplinary Global Public Health Program. I studied at the University of North Carolina at Chapel Hill in psychology and biochemistry for my undergraduate degree. I was interested in medicine until I learned about public health as a field and the potential for conducting research that can effect change at the structural level rather than at the individual level. When I interned with a community development nonprofit, I realized that I was primarily interested in the ways that social identities and social interactions in daily life can get under the skin to impact people's health. I became interested in these processes during adolescence, a period when youth are especially sensitive to social experiences and developing their social identities. I volunteered in a lab with Vanessa Volpe, who encouraged me to pursue a PhD, and then I pursued training in development and health psychology at the University of California, Los Angeles under the mentorship of Drs. Andrew Fuligni and Theodore Robles. I completed my postdoctoral training at The Pennsylvania State University to gain experience studying substance use and prevention science. My lab is now focused on using psychobiological measures to characterize how differences in stress and stress responses can contribute to health disparities during adolescence and young adulthood, as well as the ways to protect against poorer health. I'm interested in characterizing varied types of daily stressors and cultural assets, with a growing interest in how civic engagement can serve as both a stressor and a protective factor for varied individuals. Can you tell us about how your work contributes to DEI efforts, whether it be in your community, research, service, or teaching? At UCLA I led a popular psychology blog called Psychology in Action, for which the graduate students wrote blogs that were intended to be jargon-free so that they could be understood by a wide audience. I've been able to use some of these blogs as a resource for understanding material in my courses. I also led outreach events to teach students at local high schools about psychology, explaining my '''
