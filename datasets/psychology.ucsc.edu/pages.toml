["https://psychology.ucsc.edu/about/index.html"]
title = "About the Department"
full_description = "The Psychology department is home to some of the most creative faculty and unique research programs in the country. Also, most of our faculty are award-winning instructors! For more information, please go to our faculty web page. Our department administers the undergraduate Psychology major, the undergraduate Cognitive Science major, and three graduate programs in psychology. Undergraduate Psychology Major and Cognitive Science Major The undergraduate psychology major offers courses in all areas of psychology (cognitive, developmental, social, and personality/clinical). Please go to the psychology major web page for more information. The undergraduate cognitive science major provides students with a foundation in cognitive psychology and elective courses in other departments such as anthropology, linguistics, computer science, philosophy, or biology. Please go to the cognitive science web page for more information. The Psychology department provides many unique opportunities for undergraduate majors in psychology or cognitive science that go beyond the required courses. Please visit our Undergraduate Opportunities page for more information! Graduate Programs in Cognitive, Developmental, and Social Psychology We have graduate doctoral programs in three areas: Cognitive Psychology, Developmental Psychology, and Social Psychology. Each area has its own focus, but a common thread across all of them is a connection between the study of psychology and people's everyday lives. In our graduate program, students work closely with faculty to develop and conduct original research. Please go to our web page about our graduate programs for more information. Browse Our Web Site & Visit our Facebook Page for Announcements We hope you enjoy learning more about our faculty, grad students, and undergraduate program as you browse our web site. Follow or bookmark the UCSC Psychology Department Facebook page for announcements, including job postings and event updates."
