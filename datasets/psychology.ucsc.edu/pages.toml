full_description = 'UC Santa Cruz MyUCSC People Calendars Maps A-Z Index Search Psychology About Undergraduate Graduate Faculty Courses Support Us Home / News & Events / News / Steve Whittaker featured in the Financial Times Steve Whittaker featured in the Financial TimesOctober 06, 2016Psychology professor Steve Whittaker discusses “pilers and filers” in the Financial Times article, There’s magic in mess: why you should embrace a disorderly desk. The piece references Whittaker’s 2001 research with AT&T labs and also his new book about messiness and productivity. Filers, workers who use a formal organization structure for their papers tend to cope less well than pilers, workers who let papers build up on their desk. Tim Hartford writes, "Whittaker points out that the filers struggled because the categories they created turned out not to work well as times changed. This suggests that tidiness can work, but only when documents or emails arrive with an obvious structure. My own desk is messy but my financial records are neat — not because they’re more important but because the record-keeping required for accountancy is predictable." Read more on FT.com NewsEventsFeatured ProfilesDiversity, Equity, and Inclusion Committee UC Santa Cruz, 1156 High Street, Santa Cruz, Ca 95064 ©2025 Regents of the University of California. All Rights Reserved. News & Events Contact Us Feedback Report an accessibility barrier Land Acknowledgment Employment Privacy Accreditation Last modified: December 6, 2016 144.217.85.240'
