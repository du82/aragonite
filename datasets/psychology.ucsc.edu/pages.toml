["https://psychology.ucsc.edu/about/dei/dei-resources.html"]
title = "Resources on Antiracism"
full_description = '''The following list is a compilation of articles, videos, and research on antiracism, categorized by basics, intermediate, advanced, and BIPOC support. Intro: The basics - This category is for people wanting to know more about racism (Defining racism- we can’t engage in antiracism unless we can define and understand racism) Deepening our understanding - This category is for people wanting more about anti racist practices, wanting a deeper understanding. These resources will give more context specific examples (i.e. intersectionality). Applying antiracism in research, teaching, and service - These set of resources answer tackle how antiracism shows up in the organization, what people can do about it- in their research, teaching, service, practices, culture, etc. (what does Antiracist praxis look like, how to do it) BIPOC support category - Resources for BIPOC scholars about how to use writing, research, teaching as an outlet for liberation and healing. These resources include suggestions for how to process, facilitate empowerment, use your voice, develop survivance, and find ways that all of this can guide our scholarship. Intro: The basics of racism and antiracism Let's get to the root of racial injustice - A video that traces the root causes of our current racial climate to their core causes, debunking common misconceptions and calling out "fix-all" cures to a complex social problem. How racial bias works and how to disrupt it - “Psychologist Jennifer L. Eberhardt explores how our biases unfairly target Black people at all levels of society and discusses how creating points of friction can help us actively interrupt and address this troubling problem.” Systemic Racism Explained - Short introductory video explaining how racism is systemic. The UC land grab: a Legacy of profit from Indigenous land - Playlist of videos from UC Berkeley that detail the history of the public land-grant university movement’s role in the displacement and genocide of California Natives and how the UC continues to benefit from this wealth accumulation today. A Conversation with Latinos on Race - discusses the complexities of Latinidad in U.S. and what that means for racial stereotypes. Tedtalk on Racism - Video explaining how subconscious bias leads to racial stereotyping. Antiracism in Academia - "Start here" guide - Introduces individual and systemic racism with first steps to antiracist work. The Significance of Linguistic Profiling - John Baugh talks about how linguistic discrimination and profiling is harmful. Deepening our understanding Dear White Women: how to be an ally - “A letter reminding modern white feminists of their relationship with Black women throughout history.” White Supremacy Culture worksheet - A popular worksheet that lists characteristics of White Supremacy Culture in organizations. Ibram X. Kendi (author of How To Be an Antiracist) video - Ibram X. Kendi discusses his new book How to Be an Antiracist and answers the question "how do I be antiracist, I know I'm not racist" Let's Talk About "BIPOC" Black, Indigenous, People of Color - Four diversity scholars discuss the origins and uses of the acronym. How Standardized Tests Were Designed By Racists and Eugenicists - A brief video of Ibram X Kendi explaining the history of the racist origins of standardized testing. How White Feminists Oppress Black Women: When Feminism Functions as White Supremacy - A short read that takes an intersectional approach to discuss how racism can be engrained in many social justice spaces. Social Change Ecosystem Map - A workbook that suggests various roles needed for social change (e.g. disruptor, visionary, frontline responder, etc). The Urgency of Intersectionality - Classic video of Kimberlé Crenshaw introducing intersectionality. Applying antiracism in our research, teaching, service Anti-racist pedagogy in action: First steps - Columbia’s Center for Teaching and Learning curated 5 step resource guides that include actionable steps toward implementing antiracim in classroom settings including… Self Educate and Acknowledge Racial Trauma, Interrogate Your Positionality & Unconscious Biases, Address Curricular Gaps with Intentional Course Design, Fostering a Class Community, and Engaging the Campus and Committing to Action Beyond the Classroom. Re-Examined: Does Disaggregated Data Matter In Education? - Discusses the need to desegregate data and why it is important for communities and educational outcomes. This source especially highlights this need for those in Asian, Asian American, Native Hawaiian, and Pacific Islander communities. Practicing Equity with Fidelity to Racial Justice - Equity pioneer Estela Bensimon gives the convocation talk about practicing equity within teaching and researching for racial justice efforts. Strategies for anti-racist and decolonized pedagogy - Discusses five key areas of action for educators that lay out strategies for anti-racist and decolonized pedagogy. Conducting research through an Anti-racist lens - A guide for educators for practicing antiracism at different stages of research. Making the transition from ally to co-conspirator - A short read that invites white people to shift from being an ally to a more active and critical role: co-conspirator. BIPOC Support Category Black and Exhausted in America - Robert Sellers, professor in Psychology and Vice Provost of DEI at Ann Arbor, affirms our exhaustion while also reframing struggle and optimism. Surviving Institutions that Weren’t Created For You - Validates BIPOC students when navigating realities of academia. "“For Our Words Usually Land on Deaf Ears Until We Scream”: Writing as a Liberatory Practice" - Shantel Martinez discusses the role of writing for Liberation. Researching while Black (and Female) - NiCole Buchanan reflects on her experience in academia as a Black woman and offers suggestions to WOC in early careers on navigation of academic culture and systems. It takes a village to raise a researcher: Narrative interviewing as intervention, reconciliation, and growth - Former UCSC Psychlogy faculty member, Aaronette White, and William Dotson give an example of how research can promote knowledge of the self in service of liberation. Decolonizing Methodologies: Can relational research be a basis for renewed relationships? - Short video of indigenous community psychologist Shawn Wilson affirming scholars that feel marginalized by white colonial knowledge production systems. Offers introduction to radical relationality in our research.'''
