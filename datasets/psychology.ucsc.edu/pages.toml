["https://psychology.ucsc.edu/about/dei/index.html"]
title = "Diversity, Equity and Inclusion Committee"
full_description = "The Psychology Department’s Diversity, Equity, and Inclusion (DEI) Committee promotes the goals of diversity, equity, and inclusion among faculty, staff, and students in the Psychology Department. Membership The department chair selects the DEI committee members, who are comprised of three faculty (one from each of the three graduate areas), three graduate students (one from each of the three graduate areas), and two psychology staff. The committee reports to and consults with the department chair. Committee charge The charge for the Diversity, Equity, and Inclusion Committee includes the following: Promote the goals of diversity, equity, and inclusion in the Psychology department. Organize quarterly events--such as speakers, workshops, and social gatherings--related to these goals. Facilitate communication and understanding among different constituencies, and serve as a department resource. Engage students, staff, and faculty to assess needs related to DEI; propose strategies for assessing progress. Identify challenges and strengths in achieving DEI goals; and make recommendations to the chair and department regarding ways to achieve DEI goals. Upcoming Events February 21, 2024 - DEI Workshop, Difficult Conversations (hosted in partnership with TLC) March 19, 2024 - Psychology Pi(e) Party, Department Social Spring 2024 - Department DEI Speaker, TBD Spring 2024 - Department Social, TBD"
