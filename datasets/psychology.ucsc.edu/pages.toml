["https://psychology.ucsc.edu/undergraduate/support-resources.html"]
title = "Student Support Resources"
full_description = "Undergraduate and Graduate Student Advising The Undergraduate Advising Office (room 273, Social Sciences 2) can help direct cognitive science and psychology majors to resources on campus. Undergraduate students' College Advising Office is also available to help direct cognitive science and psychology majors to resources on campus. If you are experiencing high levels of distress that interfere with your school work, you can consider taking an incomplete or a medical leave from one or more courses. Your college academic advisor can help to arrange this. Kathy Montano, the Graduate Program Coordinator, can help direct Psychology graduate students to resources on campus. Mental Health Support Counseling and Psychological Services (CAPS) (located at Cowell Student Health Center). Provides counseling services, help with alcohol/drug/substance problems, and crisis assistance. If you find it is difficult to get an appointment with Counseling and Psychological Services, please see one of the Psychology advisors or your college academic advisors. They can often help students get faster appointments. WellTrack is available online at mywelltrack.com, and access for the UCSC community has been paid for by Counseling & Psychological Services (CAPS). All you need is the access code, UCSCCAPS, to use this service for free. Campus Advocacy Resources and Education (CARE) (located at Kresge 174). CARE advocates provide nonjudgmental support and resources for members of the campus community (and their significant others) who have experienced sexual harassment, sexual assault, dating/domestic violence, and stalking. Student Services Conflict Resolution Office located at 107 Kerr Hall. The office was opened in January 2009 to provide professional consultation, mediation and training to members of the UCSC community. Educational Opportunity Programs (EOP) (located at Academic Resources Center, near Music Recital Hall). Provides academic and personal support programs to foster academic success of first-generation college students and students form low-income and educationally disadvantaged backgrounds. Also see EOP’s statement on supporting undocumented students. Ethnic Resource Centers (Bay Tree Bookstore building, 3rd floor): Several centers that offer social and academic support. These include the African American Resource and Cultural Center, The American Indian Resource Center, the Asian American/Pacific Islander Resource Center, and the Chicano Latino Resource Center. Immigration Information Information provided by the UC Office of the President on immigration. Lionel Cantú Queer Center (Building between Crown & Merrill Colleges & Crown-Merrill Apartments). Provides a safe space for self-exploration and support about all genders and sexualities. Women’s Center (Carriage House, near Parking office). Provides community space for all women and their allies seeking individual and social change. SOAR/Student Media/Cultural Arts and Diversity (SOMeCA) (located at Academic Resources Center, near Music Recital Hall). SOMeCA supports campus-wide student organizations. Reporting Resources GET HELP. Guides members of the campus community needing help regarding one of the following: sexual harassment, sexual assault, relationship violence/stalking, race/ethnicity discrimination/harassment, whistleblower complaint (e.g., fraud), and other crime (e.g., robbery, theft). Depending on which one of these is selected, relevant resources on campus are listed. Grievance Policy Describes the procedures and resources applicable in student grievances regarding the conduct of the University, its employees, or third parties. Report Hate/Bias at UCSC. If you experience or observe an incident of hate or bias, please report it. Report Sexual Harassment and Sexual Violence (Title IX Office). If you experience or observe an incident of sexual harassment or sexual violence, please be sure to report it to the UCSC Title IX Office. Also, you can visit the Campus Advocacy Resources and Education (CARE) office (described above) for support and advice. TA Union (UAW Local 2865) Union, contract and contact information for Academic Student Employees."
