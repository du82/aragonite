["https://psychology.ucsc.edu/courses/course-information.html"]
title = "Research Participants"
full_description = "UCSC Psychology faculty conduct research on humans. Faculty depend upon undergraduate students to participate in their research. Students enrolled in some of the lower-division courses, during the academic year and summer session, are required to participate for a set number of hours as identified in course syllabi. The requirement is intended to be a positive educational supplement to the course work. Part of each research study will be devoted to explanation and discussion of the purpose and nature of the study (this will be done at the end of the research project). Students who are unable to participate or who choose not to participate will be provided alternate service assignments that are designed to serve similar educational goals. Accordingly, experience with research study procedures plays an important role in the undergraduate and graduate training of students."
