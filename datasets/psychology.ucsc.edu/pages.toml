title = "Directions from the Main Entrance"
full_description = "Driving North on Bay (from Mission), cross High Street to enter the campus. Pick up a parking permit at the kiosk on your right as you enter campus. Proceed on the main campus road, Coolidge Dr., which turns into McLaughlin at the sweeping curve. Without turning, follow the wide sweeping curve to the left. After you have traveled through the second stop sign, watch for the second right (marked as John R. Lewis College, Social Sciences 2). Turn right, there are several parking areas along here. You may park in any 'A' lot with an 'A' parking permit. Please note: There is a considerable amount of construction taking place on campus. Unfortunately, this has impacted parking near our building. If you cannot locate a parking space in the Social Sciences 2 parking lot, you can try the parking lot at Crown College. To get to the Crown College parking lot, return to the main road (McLaughlin), turn left onto McLaughlin, at the stop sign turn left onto Chinquapin. (Campus Parking Map) The main office for the Psychology Department is on the second floor of Social Sciences 2, Room 273."
