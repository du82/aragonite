full_description = 'UC Santa Cruz MyUCSC People Calendars Maps A-Z Index Search Psychology About Undergraduate Graduate Faculty Courses Support Us Home / News & Events / News / Interview with Dr. Linda Tropp How can we improve dialogue about race relations?October 12, 2015Former UCSC Psychology graduate student Linda Tropp was recently interviewed on a segment on "How can we improve dialogue about race relations?" for the PBS News Hour. Dr. Tropp attained her doctorate in social psychology at UCSC while working with Tom Pettigrew. She is now Professor of Psychological and Brain Sciences as well as Director of the Psychology of Peace and Violence Program at the University of Massachusetts at Amherst. NewsEventsFeatured ProfilesDiversity, Equity, and Inclusion Committee UC Santa Cruz, 1156 High Street, Santa Cruz, Ca 95064 ©2025 Regents of the University of California. All Rights Reserved. News & Events Contact Us Feedback Report an accessibility barrier Land Acknowledgment Employment Privacy Accreditation Last modified: October 12, 2015 144.217.85.240'
