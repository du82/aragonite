["https://psychology.ucsc.edu/undergraduate/cog-science-major/declaring.html"]
title = "Declaring the Cognitive Science Major"
full_description = '''1. Complete the required courses Students who indicate Cognitive Science on their UC admissions applications will be considered proposed Cognitive Science until they declare. To declare the Cognitive Science major you must complete: Calculus: (any 1 of the following courses with a letter grade) AM 11A, MATH 11A, MATH 11B, MATH 19A, MATH 19B, MATH 20A, MATH 20B OR Tests: AP Calculus AB score of 4+ OR AP Calculus BC score of 3+ OR CLEP Calculus score of 60+ Programming:(any 1 of the following courses with a letter grade) ECE 13, CSE 13S, CSE 20, CSE 30 OR CSE 20-test-out Statistics: (any 1 of the following courses with a letter grade) PSYC 2, STAT 5, STAT 7/7L OR AP Statistics score of 4+ PSYC 20: (with a letter grade) Students must have a GPA of 2.8 or higher in the required courses (use a GPA calculator to determine your eligibility). Once these requirements are completed with the required course grades or scores, you can declare the Cognitive Science major! 2. Petition to Declare & Request a Signed Academic Plan Please submit your Petition to Declare in MyUCSC or by following the instructions below. 1. Login to your MyUCSC portal 2. Select the block that says "Undergraduate Student eForms" 3. Click "Petition for Major/Minor" on the left menu that appears. 4. Complete the form, and make sure to submit it once you're done! 3. Fill out our Signed Academic Plan Request Form These Academic Plans detail all of your remaining major requirements. If you already have a Signed Academic Plan from us for the major you intend to declare, you don't need to request an academic plan again. If you need an Expected Graduation Term (EGT) review when you declare, this may delay the processing time for your declaration. Can't access the Signed Academic Plan Request form? In order to access the form, you must be signed into your UCSC Google account. Use a browser not signed into any other Google accounts or open a private/incognito browser that requires you to sign into your UCSC account if you have trouble accessing the Google form. 4. Wait for a follow-up email Once you have submitted your Petition in MyUCSC, we will send you a follow-up email from psyadv@ucsc.edu. We will review your Petition, give you confirmation that you have completed the requirements, and provide you with your Signed Academic Plan. Declaring Cognitive Science as your Second Major If you are already declared in another major and are wishing to declare Cognitive Science as a 2nd major, there are a few steps to take: 1. Verify you’re eligible to declare Cognitive Science Take a look at the major qualficiation courses to see that you meet the requirements to declare. 2. Confirm that you have a Signed Academic Plan from your first major Your plan must be updated recently & include your first major advisor's e-signature. Please reach out to your first major advisor at least 2 weeks before the declaration deadline to request this. 3. Petition to Declare After receiving your updated academic plan, please submit your Petition to Declare in MyUCSC or by following the instructions below. 1. Login to your MyUCSC portal 2. Select the block that says "Undergraduate Student eForms" 3. Click "Petition for Major/Minor" on the left menu that appears. 4. Complete the form, and make sure to submit it once you're done! 4. Wait for a follow-up email Once you have submitted your Petition in MyUCSC, we will send you a follow-up email from psyadv@ucsc.edu. We will review your Petition, give you confirmation that your major is formally declared, and provide you with an updated Signed Academic Plan. Frequently Asked Questions When should I declare? You may declare as early as you like, as long as you have completed the required courses! Students who enter UCSC as frosh are required to be declared in a major by their sixth quarter. Transfer students are required to be declared by their second quarter at UCSC. What if I'm not eligible to declare? If your College told you that you are required to declare a major this quarter but you are NOT eligible yet, submit your Petition for Major/Minor Form through MyUCSC. You will receive follow-up notifications from the Psychology Department and your College about possible conditions to declare past the deadline before an enrollment hold is placed. If you are not yet eligible to declare and your declaration deadline is in a later quarter, wait to submit any petition until you are eligible or you have reached your declaration deadline. Students who entered UCSC as a frosh must declare by the deadline in their 6th quarter at UCSC. Students who entered UCSC as a transfer must declare by the deadline in their 2nd quarter. Please confirm with your College if you are not sure which term you are required to declare your major! I want to appeal to declare Cognitive Science. What should I do? If you didn't meet the GPA requirement and want to see if you are eligible to appeal, please email psyadv@ucsc.edu.'''
