title = "Meet the Psychology Department's newest faculty"
full_description = "UC Santa Cruz MyUCSC People Calendars Maps A-Z Index Search Psychology About Undergraduate Graduate Faculty Courses Support Us Home / News & Events / News / Meet the Psychology Department's newest faculty Meet the Psychology Department's newest facultyNovember 04, 2015 By Melissa De Witte The Psychology Department now consists of 26 faculty thanks to its three newest hires: Christy Byrd (left), Audun Dahl (middle) and Rebecca Covarrubias (right).What do The Hunger Games, kids helping kids, and acting too-cool-for-school all have in common? They are all topics the newest faculty at UC Santa Cruz’s Psychology department explores with their students. The Psychology Department now consists of 26 faculty thanks to its three newest hires: Christy Byrd, Audun Dahl and Rebecca Covarrubias. Byrd and Dahl joined UCSC in 2014. Prior, Byrd was a National Science Foundation Minority Research Fellow at Michigan State University (after attaining her doctorate at the University of Michigan). Dahl came from UC Berkeley where he completed his PhD in Developmental Psychology. Covarrubias started in 2015 after a postdoctoral research fellowship at the University of Delaware. Faculty members bring their own unique expertise and diverse experience. Department chair Campbell Leaper says, “Byrd, Dahl and Covarrubias are engaging with real-world issues, reflective of the department’s mission to understand people in the context of their lived experiences.” Christy Byrd “Professor Byrd really knows how to engage her students with the discipline,” says Leaper. In Fall quarter, Professor Byrd started teaching a class that applies character and plot development from the best-selling Hunger Games trilogy to theories and concepts in developmental and social psychology. “The books really expose psychological issues and processes,” says Byrd. When Byrd is not teaching a class on Hunger Games, she explores the psychological well being of students. Currently, she is studying students’ experience of microaggressions - the subtle ways assumptions and attitudes based on race, sexual orientation, or gender are communicated in everyday conversation. Often these slights are unintentional, but come with hurtful consequences. As part of her study, Byrd recently launched a mobile app (see MicroReport) as part of her study on microaggressions. The app encourages UCSC students to report the microaggressions they experience or witness in the community. App users can also view reports of others and are encouraged to talk about these experiences in a series of workshops Byrd is organizing. “From designing a mobile phone app to addressing issues impacting people on our campus and across the country, Professor Byrd’s research is both innovative and timely.” Leaper says. Audun Dahl Professor Dahl's research explores the early moral development in children. He runs the Early Social Interaction Lab, where he studies how kids responses in social situations. Specifically, he looks when young children help, but also hurt, others to better understand how a sense of right and wrong develops. “I always found it interesting how we can be so sure about something being right and wrong,” says Dahl. He thinks back on his childhood when two of his friends stole from him. “I remember knowing it was wrong,” Dahl recalls. “But how?” Now he tracks how these types of moral convictions develop in children. At his lab, he combines experimental research with naturalistic observations to see when kids make judgments of right or wrong behavior. “Professor Dahl’s research nicely captures children’s lived experience,” says Leaper about the methodology Dahl uses. “He is looking at how children respond to real-life moral dilemmas.” Rebecca Covarrubias Professor Covarrubias is the newest faculty member in the Psychology department. A social and cultural psychologist by training, her work shows how people, particularly underrepresented and diverse individuals manage these multiple worlds: school, work, home, even the doctor’s office. Currently, one of the projects Professor Covarrubias is working on examines how first-generation college students adjust to college life. She explores issues they face both on campus and at home, including emotions like incompatibility and in some situations, even guilt for their academic accomplishments. Covarrubias explores barriers to achieving academic success and is keen to find ways to address these obstacles. “With UC Santa Cruz now a Hispanic Serving Institution and 49% of our majors first-generation, the topics Professor Covarrubias examines is particularly relevant here in the department and on campus--as well as the country,” says Leaper. “Understanding the path to academic success is imperative,” he adds. The Psychology Department welcomes these three new faculty members! See AlsoChristy ByrdAudun Dahl Rebecca Covarrubias NewsEventsFeatured ProfilesDiversity, Equity, and Inclusion Committee UC Santa Cruz, 1156 High Street, Santa Cruz, Ca 95064 ©2025 Regents of the University of California. All Rights Reserved. News & Events Contact Us Feedback Report an accessibility barrier Land Acknowledgment Employment Privacy Accreditation Last modified: November 4, 2015 144.217.85.240"
