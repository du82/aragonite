title = "It Starts At Home: Letting Children Collaborate"
full_description = 'UC Santa Cruz MyUCSC People Calendars Maps A-Z Index Search Psychology About Undergraduate Graduate Faculty Courses Support Us Home / News & Events / News / It Starts At Home: Letting Children Collaborate It Starts At Home: Letting Children CollaborateDr. Rogoff discusses her work researching the collaborative nature of children in Mexico and the United States at a TEDxSantaCruz talk.June 04, 2015As TEDx describe: Why do children in America stop wanting to "help" as they get older? Dr. Barbara Rogoff discusses her work research on the collaborative nature of children in Central America and the United States. Hint: adults here must do better at viewing and accepting children as true contributors and collaborators. Dr. Barbara Rogoff is a UC Santa Cruz Foundation Distinguished Professor of Psychology. She studies the cultural aspects of learning and collaboration among children and spent more than three decades researching child development in the Mayan town of San Pedro in Guatemala. She has written four, award-winning books, including her latest, Developing Destinies: A Mayan Midwife and Town. This talk was given at a TEDx event using the TED conference format but independently organized by a local community. Learn more at http://ted.com/tedx See AlsoTEDxSantaCruz NewsEventsFeatured ProfilesDiversity, Equity, and Inclusion Committee UC Santa Cruz, 1156 High Street, Santa Cruz, Ca 95064 ©2025 Regents of the University of California. All Rights Reserved. News & Events Contact Us Feedback Report an accessibility barrier Land Acknowledgment Employment Privacy Accreditation Last modified: October 16, 2015 144.217.85.240'
