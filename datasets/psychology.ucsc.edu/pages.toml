["https://psychology.ucsc.edu/undergraduate/faq/index.html"]
title = "Undergraduate FAQs"
full_description = '''How do I enroll in my senior seminar? To enroll in a senior seminar you must complete the Senior Seminar Survey. The survey is sent out prior to registration to all eligible seniors (students that have completed 135 units). You must complete the survey in the quarter prior to when you plan on taking your senior seminar. The seminar permission codes are given on a first come first serve basis, so it's very important to complete the survey as soon as possible. Some seminars require certain prerequisites or entrance requirements, so please plan appropriately. I have successfully completed a course at a local community college to declare my major, what is my next step? Please email your unofficial transcript to the Undergraduate Psychology Advisor at psyadv@ucsc.edu. Please also send an official copy of your transcripts to the Registrar's office. I'm not certain if I want to be a psychology major. What do psychologists study? What careers are available for psychology students? Psychologists conduct both basic and applied research, from understanding brain functions to the behavior of complex social organizations. They work within communities and organizations, diagnose and treat people, teach, test intelligence and personality. They assess behavior and mental health, study how human beings relate to each other and also to machines, and bring important knowledge and skills to understanding diverse cultures. They study how people think, hear, see, speak, and acquire language, thoughts, and memory. Psychologists can work within schools, the court system, hospitals and health centers, law enforcement, public health, and corporations and organizations. Psychology is expected to be one of the fastest growing fields in the U.S. through the year 2026 (Department of Labor statistics). Psychology majors learn how to collect, analyze, and interpret data, which are important skills for many jobs. Careers for psychologists vary. They can work independently or with other professionals--other scientists, physicians, lawyers, school personnel--in all different settings, such as hospitals, schools & universities, courtrooms, prisons, health centers. The American Psychological Asssociation (APA) reported that psychologists work in two primary areas, Research and Health Services, as follows (percentages in parentheses). Research: academia (57%), business/government (29%), health care (10%), and schools/educational (4%). Health Services: hospitals (19%), academia (18%), other human service (15%), business/goverment (14%), independent practice (11%), and managed care (9%). Most psychology careers require an advanced degree in psychology, beyond the bachelor's degree. (Information from the APA Education Pipeline, based on 2005 doctorate employment survey). What type of career growth is expected for Psychology? From the Department of Labor: "Employment of psychologists is expected to grow about 14 percent from 2016 to 2026, faster than average for all occupations. Employment will grow because of increased demand for psychological services in schools, hospitals, social service agencies, mental health centers, substance abuse treatment clinics, consulting firms, and private companies."(Occupational Outlook Handbook Website) I don't know if I want psychology as a major. How soon should I begin to take required courses? Plan to complete the mathematics requirement, and enroll in Psychology 1, Intro to Psychology, as early as possible (first year). Please see the Psychology major declaration page. How can I stay informed? Psychology website: http://psychology.ucsc.edu Make sure you read emails from the Psychology Department Peer Advisors (from psypeer@ucsc.edu) and Undergraduate Advisors (from psyadv@ucsc.edu) JOIN THE PSYCFWD GROUP HERE to receive email opportunities shared with us from: other departments at UCSC; California state graduate schools; and job, volunteer, research, scholarship, & internship opportunities Follow us on Instagram @UCSCPsychology Are there options for getting academic credit outside the classroom? Yes, there are various options to earn credit through an Independent Study. Options include enrollment in our Field Study program, working in a research lab, and/or writing a senior thesis. What is Psi Chi? Psi Chi is the National Honor Society in Psychology. Membership in our campus chapter enhances your experience at UCSC by providing activities with other Psi Chi members, such as attending the Western Psychology Association convention, learning about graduate schools, meeting Psychology faculty at informal meetings, and other events. As a highly respected reference, Psi Chi exemplifies academic excellence in scholarly work. Is there a senior exam requirement? No, the Psychology Comprehensive Exam is no longer offered. The exam has been dropped effective Fall 2006. The University's Comprehensive requirement will now be fulfilled by completing a Psychology Senior Seminar 5-unit course at UCSC (may not be completed elsewhere). How do I declare the Psychology major? First, you must complete Psych 1, Psych 2 (or equivalent) with the appropriate grade requirement and the math requirement. Once you have passed each of these courses, go to the declaration of major page to find out more! How do I declare the Cognitive Science major? First, you must complete Psych 2 (or equivalent), Psych 20, the calculus requirement and computer programming requirement. Once you have passed each of these courses, go to the declaration of major page to find out more! Do I have the right prerequisites for a course? Consult with the schedule of classes or the campus catalog. If you don't have the right pre-reqs you will not be able to enroll with the campus enrollment system.'''
year_published = 2025
