full_description = "UC Santa Cruz MyUCSC People Calendars Maps A-Z Index Search Psychology About Undergraduate Graduate Faculty Courses Support Us Home / News & Events / News / In the News: Newsweek Newsweek features psychology professor Craig HaneyMay 09, 2017Psychology Professor Craig Haney, an expert in the psychological effects of incarceration, was featured in a Newsweek magazine article about the impacts of solitary confinement. “The longer they’re in it, and especially if they’re not sure when they’re going to get out, a range of negative psychological reactions begin to mount,” says Haney. Read the full piece here. NewsEventsFeatured ProfilesDiversity, Equity, and Inclusion Committee UC Santa Cruz, 1156 High Street, Santa Cruz, Ca 95064 ©2025 Regents of the University of California. All Rights Reserved. News & Events Contact Us Feedback Report an accessibility barrier Land Acknowledgment Employment Privacy Accreditation Last modified: May 9, 2017 144.217.85.240"
