["https://psychology.ucsc.edu/news-events/news/haney-nyt-louisiana.html"]
title = "The New York Times features psychology professor Craig Haney"
full_description = "UC Santa Cruz MyUCSC People Calendars Maps A-Z Index Search Psychology About Undergraduate Graduate Faculty Courses Support Us Home / News & Events / News / In the News: The New York Times The New York Times features psychology professor Craig HaneyMarch 30, 2017Craig Haney was featured in The New York Times article, 3 Men on Death Row in Louisiana Sue Over Solitary Confinement. The article discusses the recent lawsuit made by three men who were sentenced to death over 25 years ago. The goal of the lawsuit is to “overturn a prison policy that automatically and permanently places prisoners sentenced to death in Louisiana in solitary confinement.” The article references Haney’s interviews with solitary confinement inmates at Pelican Bay State Prison to study their psychological effects. He concluded that “those with no history of mental illness were engaged in a constant, ongoing struggle to maintain their sanity.” “These conditions predictably can impair the psychological functioning of the prisoners who are subjected to them,” says Haney. “For some prisoners, these impairments can be permanent and life-threatening.” NewsEventsFeatured ProfilesDiversity, Equity, and Inclusion Committee UC Santa Cruz, 1156 High Street, Santa Cruz, Ca 95064 ©2025 Regents of the University of California. All Rights Reserved. News & Events Contact Us Feedback Report an accessibility barrier Land Acknowledgment Employment Privacy Accreditation Last modified: April 4, 2017 144.217.85.240"
