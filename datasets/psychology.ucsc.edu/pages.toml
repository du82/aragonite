title = "Undergraduate Degrees"
full_description = "Our Department is committed to offering robust and interdisciplinary programs in both Cognitive Science and Psychology, designed to foster a deep understanding of human behavior and the human mind. A Multidisciplinary Approach The Cognitive Science program at UC Santa Cruz provides a comprehensive exploration of the mind and mental processes by integrating aspects from various fields including cognitive psychology, neuroscience, anthropology, and computer science. This program is designed for individuals who seek a profound understanding of the complex facets of cognition through an interdisciplinary lens. Understanding Human Behavior Our Psychology program offers an in-depth study of human behavior and the psychological, social, and biological processes related to that behavior. According to the American Psychological Association, Psychology is: A discipline, a major topic of study in colleges and universities. A science, a method of conducting research and understanding behavioral data. A profession, a calling that requires one to apply special knowledge, abilities, and skills to solve human problems. UC Santa Cruz Psychology majors take courses in each of the following subfields in their upper-division work: Developmental, Cognitive, and Social. Why UC Santa Cruz? UC Santa Cruz stands as a beacon of Innovative Research and Field Study Opportunities in the fields of Cognitive Science and Psychology. We foster a culture of scientific inquiry, and encouraging students to enhancing their understanding of the complexities of psychology. These experiences are essential for graduate studies and carving out successful future careers."
