["https://psychology.ucsc.edu/news-events/news/perry-recap.html"]
title = "Alumna Kris Perry shares how she overturned Prop 8, the same-sex marriage ban"
full_description = "UC Santa Cruz MyUCSC People Calendars Maps A-Z Index Search Division of Social Sciences About About the Division Message from the Dean Contact Directions & Mailing Address Academics Academic Programs Undergraduate Programs Graduate Programs Research Social Sciences Research Research Centers & Initiatives Research Roundup News & Events Events News News Archives Climate Conference Faculty and Staff Awards Photos Support Us Get Involved Meet Your Philanthropy Team Make a Gift Donors Making a Difference Faculty Excellence Student Awards For Faculty & Staff Faculty & Staff Resources Academic Human Resources Staff Human Resources Computing Office Development Office Events Office Facilities Office Faculty and Staff Awards Finance Research Administration Grants and Fellowships Green Team Marketing Resources Reporting Discrimination & Harassment Request Website Updates Home / News & Events / News / Alumna Kris Perry shares how she overturned Prop 8, the same-sex marriage ban Alumna Kris Perry shares how she overturned Prop 8, the same-sex marriage banOctober 14, 2014 By Melissa De Witte UC Santa Cruz alumna Kris Perry (Merrill, ’86, psychology and sociology) and wife Sandy Stier, who helped overturn Propisition 8 and the first to be married after the same-sex marriage ban was removed. Photo Credit: Quinn DombrowskiMerrill College alumna Kris Perry, center, stands with her son, Elliott, a UC Santa Cruz sophomore, and Kelly Weisberg, professor of law at UC Hastings College of Law, during a visit to UCSC Monday.“UC Santa Cruz and social justice are so intertwined. It gets in your head,” remarked UC Santa Cruz alumna Kris Perry (Merrill, ’86, psychology and sociology) at a lecture she presented on Monday, October 13, 2014 at Kresge College. Perry and her partner, Sandy Stier, became well known after challenging - and eventually leading the charge to overturn - Proposition 8, California’s controversial ban against same-sex marriage. Perry described the 2009 lawsuit she and Stier filed as “putting hate on trial.” “I care about social justice because I care about human rights,” said Perry. Kelly Weisberg, UC Hastings School of Law Professor and founder of the new 3+3 law program in the Division of Social Sciences at UCSC, delivered the opening remarks to the talk. “Kris Perry epitomizes the commitment to social justice that is a founding value of UC Santa Cruz. Her legal case (Perry v. Schwarzenegger, later Perry v. Brown) is a landmark decision in the gay rights movement,” praised Weisberg. Growing up Kris Perry describes herself as an ordinary person in an extraordinary situation. She describes how incredibly uncomfortable she felt growing up. “I internalized homophobia.” She shared. It was not until she came to UC Santa Cruz that she became fully aware of her sexuality and was able to come out. Questioning Authority Recalling election night in 2008, Perry remembered how a “difficult” thing happened. While Barack Obama’s presidential nomination was a significant win for her and many others, the passing of Proposition 8 deflated the momentous occasion. Perry came to fully realize just how tight elections can be and a majority is closer than one thinks. “Proposition 8 took away the freedom of many,” Perry shared. “There are 1,200 tax and government benefits delivered to you through marriage,” she pointed out. Perry says she realized that if California was going to discriminate against its citizens, she would need to reach beyond the state and make demands at the federal level to create change. Putting Hate on Trial In 2008, Perry was working with celebrity activist Rob Reiner at First 5 California, a state government agency he founded dedicated to child health development. Reiner asked if she and Stier would be interested in joining lawyers Ted Olson and David Boies and fellow plaintiffs, couple Paul Katami and Jeff Zarrillo, to sue the very government she worked for. Hollywood Attention Perry’s case and trial inspired Academy-award winning screenwriter Dustin Lance Black (Milk, J Edgar) to write a theatrical version of her story. He based his play on testimony transcript and court documents. It was because of that stellar legal team that she and Stier decided to do it, she said. Boies, a Democrat and Olso , a Republican (who fought each other in the infamous Bush vs. Gore case) had come together to fight on behalf of the two couples. The bipartisanship was incredible, Perry observed. In 2010, Proposition 8 was overturned by the Ninth Circuit Court of Appeals. The case was then upheld by the U.S. Supreme court on appeal. About Perry Perry has a prominent career in the child advocacy and policy field. In 2012, Perry was appointed Executive Director of the First Fives Years Fund, a bipartisan advocacy group devoted to early childhood education for disadvantaged children. Perry married Stier for the third legal time in June 2013. Perry and Stier currently live in Washington, DC and have four grown children. See AlsoMerrill alumna who challenged same-sex marriage ban to speak Monday, Oct. 13Sociology DepartmentThe 3+3 ProgramPsychology DepartmentLionel Cantu Quuer Center NewsEventsFeatured ProfilesDiversity, Equity, and Inclusion Committee UC Santa Cruz, 1156 High Street, Santa Cruz, Ca 95064 ©2025 Regents of the University of California. All Rights Reserved. Contact Feedback Internal Report an accessibility barrier Land Acknowledgment Employment Privacy Accreditation Last modified: October 14, 2014 144.217.85.240"
year_published = 2014
year_updated = 2014
