["https://psychology.ucsc.edu/news-events/news/leaper-slate.html"]
title = "Campbell Leaper interviewed for Slate"
full_description = "UC Santa Cruz MyUCSC People Calendars Maps A-Z Index Search Psychology About Undergraduate Graduate Faculty Courses Support Us Home / News & Events / News / Slate article Campbell Leaper interviewed for SlateNovember 23, 2016Psychology professor and Department Chair Campbell Leaper was interviewed in an article for Slate about how to talk to kids about hatred and hostility in the Trump era. Melinda Wenner Moyer writes, “It can also help, albeit indirectly, to educate your daughters about sexism and feminism. Campbell Leaper, a developmental and social psychologist at the University of California–Santa Cruz, and his colleagues have found that women who learn about sexism and feminism at an early age are more likely than other women to proactively respond to sexual harassment by reporting the incident, confronting the perpetrator, or saying No! I don’t like that. Young women who know little about feminism, on the other hand, are more likely to do little or nothing when they are harassed—and that’s a problem, because “we know from research on stress and coping that proactive coping strategies are much more beneficial for people in terms of reducing stress and promoting mental health,” Leaper says. Put another way: Educating your daughter about feminism may make her more resilient if she is ever sexually harassed or assaulted.” Read the full article, Parenting Advice for the Trump Era, here. NewsEventsFeatured ProfilesDiversity, Equity, and Inclusion Committee UC Santa Cruz, 1156 High Street, Santa Cruz, Ca 95064 ©2025 Regents of the University of California. All Rights Reserved. News & Events Contact Us Feedback Report an accessibility barrier Land Acknowledgment Employment Privacy Accreditation Last modified: December 2, 2016 144.217.85.240"
