full_description = "Mineta San José International Airport: Leave the San Jose Airport and merge onto Highway 17/880 South (this is easily accessible from the airport). Take Highway 17 south to Santa Cruz. It will merge with Highway 1, follow Highway 1 north to Half Moon Bay. You will go through one signal (Highway 9), then across railroad tracks. Stay in the far right turn lane. Turn right at the next signal, onto Mission Street (follow signs for Mission Street and Highway 1 north to Half Moon Bay). Continue on Mission to Bay Street. Turn Right on Bay Street and travel north. As you cross High Street you enter the campus, and are now on Coolidge Drive. San Francisco International Airport: Follow Highway 101 south towards San Jose to Highway 880 south (which becomes Highway 17). Exit onto 880/17 south to Santa Cruz. It will merge with Highway 1, follow Highway 1 north to Half Moon Bay. You will go through one signal (Highway 9), then across railroad tracks. Stay in the far right turn lane. Turn right at the next signal, onto Mission Street (Mission Street and Highway 1 north to Half Moon Bay). Continue on Mission to Bay Street. Turn Right on Bay Street and travel north. As youl cross High Street you enter the campus, and are now on Coolidge Drive."
