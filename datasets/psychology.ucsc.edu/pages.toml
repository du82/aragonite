["https://psychology.ucsc.edu/undergraduate/awards/index.html"]
title = "Scholarship and Award Opportunities"
full_description = "Deans' and Chancellor's Award We invite you to apply for the 2024 Deans’ and Chancellor’s Awards. The awards honor undergraduate students whose projects or theses at UCSC demonstrate excellence in research and creativity. The application portal will open again next year. To apply for these awards, you will need to: Review the Deans' and Chancellor's Award Guidelines Upload a completed thesis, project, or performance (as an attachment or URL). Identify a UCSC researcher (e.g., a faculty member, lecturer, postdoc, researcher) who is willing to write you a letter of recommendation. Your recommender will receive a link for submitting their letter by March 31. We encourage you to reach out to your research mentor well in advance of the deadline for the letter. For additional information about how to apply, please review the Deans' and Chancellor's Award Guidelines. See the 2023 Award Recipients! Gabriel Zimmerman Scholarship The Gabriel Zimmerman Scholarship is awarded based on a meritorious, ongoing, and demonstrated commitment to public service combined with academic excellence. In 2024 up to $10,000 is available to award to one or more outstanding undergraduate students majoring in any of the departments within the Division of Social Sciences. More information about the award, and about the past recipients of this award, is available on the Social Sciences Website. Undergraduate majors in the social sciences are invited to apply for this scholarship by submitting a short essay (2-3 pages maximum) about their passion for social issues and commitment to public service as well as a copy of their resume. The program requires that candidates be in excellent academic standing. Applicants will submit an unofficial copy of their transcripts with their essay and resume. 2024 Applications will open again next year. When it is time to apply, please fill out the Gabriel Zimmerman Memorial Scholarship Application Benjamin Quaye Memorial Endowment for Social Justice The Benjamin Quaye Memorial Endowment for Social Justice Award is an annual undergraduate scholarship for a student with significant financial need who is pursuing educational and career goals in social justice, with a strong preference for a student who is the first in their family to attend college. Students who volunteer to help the under-served, such as foster youth, people with disabilities, and the homeless, are ideal recipients of this award. The award amount is $1600. More information is available on the Social Sciences Website. Psychology and Cognitive Science Majors are invited to apply to be nominated by the Psychology Department. To be considered for the award, please submit your resume, unofficial transcript, and a short essay (max 2 pages) describing your financial need and your educational and career goals in social justice. Applications for 2024 will open again next year. When it is time to apply, please fill out the Benjamin Quaye Memorial Endowment for Social Justice Application Robert Glushko Award for Outstanding Undergraduate Research in Cognitive Science The Robert Glushko Award for Outstanding Undergraduate Research in Cognitive Science is awarded annually to two senior Cognitive Science majors who have demonstrated: sustained and outstanding involvement in Cognitive Science research interest in contributing to the broader impacts of Cognitive Science Special consideration is given to students from underserved backgrounds and/or first-generation students. Each recipient: receives a monetary prize of $500 is acknowledged in the Psychology and Cognitive Science Graduation Ceremony"
