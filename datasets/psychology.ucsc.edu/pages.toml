["http://psychology.ucsc.edu/undergraduate/advising"]
title = ""
full_description = "Advising Services - Psychology & Cognitive Science The Psychology Advising Office is located in Social Sciences 2, Room 150. Unless posted otherwise, Advising is available Monday, Tuesday and Thursday, 9:00am-12:00pm and 1:00pm-4:00pm and Wednesday 1:00pm-4:00pm. For assistance, please review the options below and follow the instructions to speak with staff. To get your questions answered, please follow these steps: Step 1: Email psyadv@ucsc.edu (the fastest way to resolve most concerns.) Step 2: Attend Drop In Advising Step 3: Schedule an Appointment In the Summer, our office will be working remotely. We will provide Drop-in Advising and appointments through Zoom only. Popular Links Advising Forms - Sample Academic Plans and Major Worksheets. Educational Opportunities - Research, Field Study, and Thesis information. Enrollment Assistance - Advice & Resources related to enrollment. NEW‼️ How to Perform a Grad Check! - A guide on accessing your records and using our advising forms. Cognitive Science, General Psychology, and Intensive Psychology pages. Advising Newsletter - Important Dates, Deadlines, & Events. PSYCFWD - Opportunities with Other Departments, Graduate Schools; Job, Volunteer, Research, Scholarship, & Internship postings. Follow @UCSCPsychology on Instagram. Peer Advising Trained Peer Advisors are able to assist students with: Academic Plans Graduation Checks Enrollment Advice Declaring Cognitive Science or Declaring Psychology Study Abroad Questions about our majors, courses and opportunities Drop-In Advising Peer Advisors are available during Drop-In hours and via email at psypeer@ucsc.edu You can attend in person (except during Summer), or you may always choose to use the Zoom link provided in the Advising Calendar. Note that there might be a wait, so be patient and a Peer Advisor will assist you as soon as they are able. Calendar Please review our Advising Schedule and select any event for Instructions. Undergraduate Advisors & Appointments The best way to get in touch with a Staff advisor is by emailing them at psyadv@ucsc.edu Undergraduate Advisors are available to assist students with: Transfer Courses, Study Abroad Courses & Other Substitution options. Declaration and Graduation Petitions & Appeals Veterans Benefits Verification Enrollment Assistance Course Recommendations Educational Opportunities Global Learning Approaching Faculty for Research Assistant Opportunities Graduate School Preparation Signed Academic Plans Need an academic plan signed by an advisor? Fill out our Signed Academic Plan Request Form & an Advisor will provide you with a plan via email. Email Email psyadv@ucsc.edu with questions, requests, and any forms needing signatures. Please allow between 1-3 business days for an email response. We will complete any signature requests within 5 business days. If you would like to petition to have study abroad courses fulfill major requirements, begin the process at least 2 weeks before your study abroad deadline (visit our Global Learning webpage for details). Schedule an appointment Our Undergraduate Advisors will be available for appointments every week. These 15 minute appointments become available through Slug Success 14 days in advance, and are offered on a first-come/first-serve basis. To better maintain consistency in advising, please prioritize appointments within our advisors Alpha split (based on your last name). However, feel free to make appointments with anyone if our availability better fits your schedule. Paige Andersen (A-Fa) (Thursdays) Hi! I'm Paige Andersen (she/her), your Psychology Undergraduate Advisor and a proud UC Santa Cruz alum. I am excited to support your academic journeys! Rebecca Hall (Fe-Ler) (Mondays) Hi! I’m Rebecca (she/her), a Psychology Advisor. I love helping students with academic planning! As a first-generation Latinx graduate, I’m passionate about diversifying campus spaces and making resources accessible. Can’t wait to meet you—please schedule an appointment! Ryan Mulligan (Les-Riu) (Thursdays) Hey there! I'm Ryan Mulligan. If you're feeling unsure about your current plans or goals, or just need a boost of encouragement and some pro tips, don't hesitate to reach out to me. Julia Wanlin (Riv-Z) (Tuesdays) Hi! My name is Julia and I am one of the Psychology Undergraduate Advisors. I am committed to supporting students as they navigate their higher education journey. If you have questions about Global Learning, I'll be the advisor you want to talk to! Most questions about major requirements, enrollment, and inquiries about the major declaration process can be answered through Drop-in Advising with a Peer Advisor. Students who are still proposed in a major, but not declared are best served through Drop-in Advising, unless assistance is needed with appeals or petitions, or there are concerns about meeting the eligibility criteria to declare. While our Staff Advisors are equipped to provide tips and advice, for those interested in pursuing Graduate School we recommend you also review our Career Resources information. For assistance in scheduling an appointment in Navigate Slug Success, check out the Self-Help Guide. Please note that drop-in advising and appointments are only available to active UCSC students. If you are not currently taking classes at UCSC, please email psyadv@ucsc.edu for further assistance. Field Study Advising Students must attend a Field Study Informational Meeting before making an appointment with the Field Study Director. Learn about opportunities beyond the classroom: Field Study (PSYC 193) Research (PSYC 194) Senior Thesis (PSYC 195) Other Academic Resources Psychology Faculty Office Hours Psychology Department Directory Your College Advising Office Remote Learning Resources for UCSC Students The Navigator (campus handbook) UCSC General Catalog Writing Assistance UCSC Writing Program"
