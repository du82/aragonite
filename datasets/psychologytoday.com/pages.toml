["https://psychologytoday.com/us/basics/beauty"]
title = "Beauty | Psychology Today"
description = "We all know that gorgeous people get preferential treatment. It’s a not-too-pretty fact of life long attributed to the halo effect, a type of cognitive bias or judgment discrepancy in which our impression of a person dictates the assumptions we make about that individual. For example, people will more readily blame an unattractive person for a crime than an attractive one. Now there’s evidence that beauty, intelligence, and other positive characteristics may go hand in hand."
full_description = '''Beauty Attractiveness Reviewed by Psychology Today Staff We all know that gorgeous people get preferential treatment. It’s a not-too-pretty fact of life long attributed to the halo effect, a type of cognitive bias or judgment discrepancy in which our impression of a person dictates the assumptions we make about that individual. For example, people will more readily blame an unattractive person for a crime than an attractive one. Now there’s evidence that beauty, intelligence, and other positive characteristics may go hand in hand. Contents The Truth About Beauty How to Be More Attractive The Signs of Beauty The Truth About Beauty Evolutionary psychologists have opened a line of inquiry into other age-old questions about beauty, observing that both men and women alike appear more concerned than ever with both attractiveness and perceived physical imperfections. It’s no surprise that a pretty woman will tend to be favored over others for a desired job opening. And there are some universal standards of beauty across the world--symmetry in the face and the body are preferred traits, for example, as are clear skin and youthfulness. Is it important to be beautiful? Created with Sketch. Unfortunately, yes. We like to say that kindness and looks matter more, and that we appreciate what's on the inside most. But that is not exactly the case, we live by the notion that beautiful is best. In fact, even children are drawn to aesthetically pleasing faces, as opposed to unattractive and asymmetric ones. Is life easier when you are attractive? Created with Sketch. Truthfully, attractive people are afforded higher pay, more opportunities, special treatment, a free pass so to speak. In fact, the more attractive you are the higher chance of getting to the head of the line. Plus, the better-looking student is considered more competent and enjoys higher grades, as well. What are the disadvantages of being beautiful? Created with Sketch. There are drawbacks to being beautiful. A person with a gorgeous face is often deemed incompetent and less likely to be hired. These people are also often the target of jealousy and exclusion. And in the dating scene, a person with extraordinary looks will get passed over as unattainable. Why do we hire attractive people? Created with Sketch. This preference for attractiveness can be found across domains, including politics, media, and the legal field. Beautiful people are also hired sooner, get promotions more quickly, are higher-ranking in their companies, and receive extra benefits and perks on the job. Do beautiful people earn more money? Created with Sketch. Research shows that attractive people earn more than people with below-average looks, which adds up to a significant amount of money over a lifetime. The public would rather deal with a good-looking shop clerk rather than a less visually appealing one. What is the halo effect? Created with Sketch. The halo effect causes a trait, such as beauty, to drastically color your perception of all other traits. If you think someone is beautiful, you are also likely to assume they’re smart, ambitious, and interesting. article continues after advertisement if (!window.ptAdSlots || window.ptAdSlots.length === 0) { window.ptAdSlots = []; } window.ptAdSlots.push('div-gpt-ad-1404853927369-9') How to Be More Attractive While a new haircut, a little powder, and knowing what others find attractive might help you put on a good face, there are inner factors at play. A better foundation to build on is being confident, positive, and engaged with life. Feeling good about who you are will change the way you feel, move your body, and relate to others. What makes a person attractive? Created with Sketch. This is a cliche, but beauty is often in the eyes of the beholder. What is deemed attractive to one person may not be so for another. However, a conventional and symmetric face is generally considered appealing. Also, people are often drawn to what is familiar. For example, people who grew up in the same neighborhood are commonly attracted to each other. I'm not attractive enough. How can I feel better about my looks? Created with Sketch. Most people are far too critical of their own physical appearance, especially those who engage in self-downing or negative self-talk, which can and should be challenged. It is important to also focus on non-physical aspects of one's desirability, such as warmth, character and personality. When evaluating your attractiveness to potential partners, recognize that most individuals weigh all these factors and more in seeking relationships. What do women find attractive in men? Created with Sketch. While heterosexual women also seek symmetry in male partners' features as well as height, they generally value status and resources at least as much, focusing on the question of whether a man will help them raise and support their future children. What do men find attractive in women? Created with Sketch. Heterosexual men more strongly desire women with hourglass-shaped figures as well as feminine features. These characteristics are considered markers of health and fertility. Do people think they’re better looking than they are? Created with Sketch. We are predisposed to thinking we are better than average in many domains including intelligence, attractiveness, and even the ability to drive a car; in effect, everyone else is a moron on the road. In a set of experiments, researchers morphed photographs of study participants into more attractive or more unattractive images. Participants were “more likely to recognize an attractively enhanced version of their own face” but not the unattractive versions. Why do I look better in the mirror than in photographs? Created with Sketch. When you look at the mirror day in and day out, you see a view that you are accustomed to. A photograph of yourself, however, flips the view you see every morning; the right side of the face is now the left side. This angle is a new and unfamiliar perspective, one that doesn’t jibe with your daily view. Will I feel better looking if I have cosmetic surgery? Created with Sketch. Cosmetic procedures are intended to improve a person's self-esteem, but too often lead to dissatisfaction. There are women who feel uncomfortable and insecure about cosmetic surgery, and they feel more angst about looking unlike themselves and regretful about having these procedures done in the first place. Does intelligence make you more attractive? Created with Sketch. The more intelligent you are, the more attractive you appear. However, a genius-level IQ is less desirable in a potential mate. A very high IQ might be perceived has bring trade-offs with other desirable characteristics such as social skills and interpersonal functioning (though this is often more perception than reality). In general, very smart people appear particularly appealing—especially as long-term partners. How can I help a girl or a young woman feel good about her looks? Created with Sketch. Instead of focussing on attractiveness and beauty, it may be more worthwhile to pay attention to identity-shaping qualities that offer a depth of character. These things can be developed: intelligence, creativity, courage, athleticism, imagination, critical thinking, empathy. Attention to these characteristics can help girls and young women feel good about themselves and will have a more profound effect than just being pretty. What makes someone physically attracted to you? Created with Sketch. Here are a few pillars of physical attraction: Beauty, proximity (i.e. encountering the person daily in a work setting), similarity, among others. Indeed, how you look can make someone attracted to you. And the more often two people see each other, the more likely they will become attracted to each other. Plus, we are more attracted to others who are similar to us in appearance, beliefs, and interests. The Signs of Beauty What men and women tend to prefer when it comes to beauty may seem mysterious, but science does explain a lot of it. For example, we are drawn to symmetry, a skinny waist in women, and height in men. Why is symmetry considered attractive? Created with Sketch. Perfect symmetry, such as the distance between the eyes or the distance from eyes to mouth, is considered beautiful. Essentially, it is easier for us to process symmetry than asymmetry. This also signals health and the ability to produce healthy offspring. Why is waist-to-hip ratio important? Created with Sketch. A skinny waist and curvy hips in women is preferred, this shape indicates a good environment for future child-bearing and a higher likelihood of giving birth to healthy children. And the smaller the waist is, the more attractive the woman. Why do we prefer the left side of the face? Created with Sketch. People find the left side of a face more pleasing. In a study that showed participants various faces, from the left angle and the right angle, the left side of the face was rated as more pleasant and attractive. Also, the left side is often preferred by portraitists. Why are baby faced adults considered attractive? Created with Sketch. Women who look child-like—a round face, big eyes, small nose—are considered pleasing to look at, and a baby-face gives the impression of trustworthiness and innocence. The doe-eyes of celebrities like Anne Hathaway, for example, are often preferred by men. Why are tall men attractive? Created with Sketch. Women prefer tall men, as height can signal status and power; the truth is, taller people do actually earn more. And tall men are more likely to win the popular vote in presidential elections and to be re-elected once in office. Why are the eyes important in beauty? Created with Sketch. The limbal ring is the circle around the iris, this line separates the colored part of the eye from the white part. This ring fades as we age. Therefore, prominence of the ring signifies youth, health, and beauty. What is the lumbar curve? Created with Sketch. A curvy spine in women also signifies health and fertility. In one study, researchers hypothesized that because pregnancy shifts a woman's center of gravity forward, men would be attracted to women with a lower back curvature that would minimize the pressure on the spine created by carrying a fetus. Essential Reads Is "The Substance" Really a Feminist Film? In a visual and virtual culture, the images depicted in "The Substance" communicate more loudly than its words. The Objective Science of Beauty Evolution, mathematics, and the Fibonacci sequence. How Art Can Enhance Science Art and science can be aligned in different ways. We describe one use of art as a tool: using ambiguity to evoke curiosity. Conspicuous Consumption: The Art World Goes Bananas A wealthy entrepreneur buys a banana for $6.2 million and then eats it at a press event. How can we make sense of this apparent monied madness? Why Your Love Strategy on Valentine's Day May Be Wrong Some psychological research suggests that chocolates and flowers on Valentine's Day may be the wrong strategy, and even counter-productive. Here's why. Some psychological research suggests that chocolates and flowers on Valentine's Day may be the wrong strategy, and even counter-productive. Here's why. The Rise of Cosmetic Surgery in the Social Media Era Social media’s perpetuation of unrealistic beauty standards fuels cosmetic surgeries. Discover the psychological impact of this trend and what we can do to promote body positivity. Social media’s perpetuation of unrealistic beauty standards fuels cosmetic surgeries. Discover the psychological impact of this trend and what we can do to promote body positivity. Losing Your Looks Personal Perspective: If you hate losing your looks, you’re going to hate looking at yourself in the mirror, which is going to make it harder to grow old gracefully. Personal Perspective: If you hate losing your looks, you’re going to hate looking at yourself in the mirror, which is going to make it harder to grow old gracefully. Making the Stone Stony Art and aesthetics inform psychotherapy just as much as science—and these aesthetic processes can help push patients toward cognitive flexibility. Art and aesthetics inform psychotherapy just as much as science—and these aesthetic processes can help push patients toward cognitive flexibility. Neko Case: Saved By Song In a new memoir, singer-songwriter Neko Case explores how she learned to channel long-ago loneliness into lyrical harmony. In a new memoir, singer-songwriter Neko Case explores how she learned to channel long-ago loneliness into lyrical harmony. How Social Media Affects Body Dissatisfaction in Men Psychologists have long discussed the effect the media has on women’s body dissatisfaction, but men are affected by unobtainable body standards as well. Psychologists have long discussed the effect the media has on women’s body dissatisfaction, but men are affected by unobtainable body standards as well. The Future of Work: Punk or Romantic? Romanticism is focused on the individual, punk on the community, but the two movements are in demand again: as acts of rebellion in dark times. Romanticism is focused on the individual, punk on the community, but the two movements are in demand again: as acts of rebellion in dark times. The Season of Miracles Personal Perspective: Creating a tree from their books enables a family to update traditions they treasure and focus on the values of sustainability, beauty, and meaning. Personal Perspective: Creating a tree from their books enables a family to update traditions they treasure and focus on the values of sustainability, beauty, and meaning. Can Skincare Influence Your Brain and Mood? Skincare is no longer just about vanity, it’s about emotional wellness. Skincare is no longer just about vanity, it’s about emotional wellness. 4 Ways to Reconnect With Nature in Wintertime To notice what is more visible in your environment during the winter months is to be awake and aware, to be mindful and alive. To notice what is more visible in your environment during the winter months is to be awake and aware, to be mindful and alive. 1 2 Next'''
