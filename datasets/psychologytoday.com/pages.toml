title = "BDSM | Psychology Today"
description = "BDSM is an umbrella term for a wide range of sexual practices that involve physical bondage, the giving or receiving of pain, dominant or submissive roleplay, and/or other related activities. The acronym is a combination of Bondage/Discipline, Dominance/Submission, and Sadism/Masochism. Though BDSM has long been socially stigmatized or thought to be a sign of mental illness, recent research suggests that it has no clear connection to psychiatric disorders and can in fact be a part of healthy, loving relationships."
full_description = '''BDSM Kink Reviewed by Psychology Today Staff BDSM is an umbrella term for a wide range of sexual practices that involve physical bondage, the giving or receiving of pain, dominant or submissive roleplay, and/or other related activities. The acronym is a combination of Bondage/Discipline, Dominance/Submission, and Sadism/Masochism. Though BDSM has long been socially stigmatized or thought to be a sign of mental illness, recent research suggests that it has no clear connection to psychiatric disorders and can in fact be a part of healthy, loving relationships. Contents What Is BDSM? BDSM and Mental Health BDSM in Relationships What Is BDSM? Depictions of BDSM-type sexual acts—involving dominance, bondage, or the use of pain—have been found in art and literature from around the world dating back hundreds of years. But until the latter part of the 20th century, many people, particularly in the Western world, believed that an interest in BDSM reflected mental illness, sexual deviance, or a history of abuse or sexual trauma. More recent research, however, has suggested that people who engage in BDSM (also sometimes referred to as kink) are no more likely to be mentally unwell than the rest of the population. Despite decreasing stereotypes, however, many people—including some mental health professionals—still hold negative views about BDSM practices and the people who willingly engage in them. But the rise of the Internet—as well as the explosion of BDSM-related media, including the Fifty Shades books and films—has brought BDSM into the public consciousness, rendered it more socially acceptable, and allowed those interested in it to connect with one another more easily and engage more openly. Is BDSM sex common? Created with Sketch. Sex that incorporates elements of BDSM is more common than many think. One study, for example, found that 30 percent of people had tried spanking during sex and nearly a quarter had tried dominant/submissive roleplay. Another study found that 47 percent of adults reported experimenting with at least one aspect of BDSM. Is BDSM dangerous? Created with Sketch. While some aspects of kink do come with a risk of bodily harm—and in rare cases, people do become seriously injured—BDSM is not inherently dangerous. The majority of dedicated BDSM practitioners pride themselves on practicing “safe, sane, and consensual” sex—where even if pain is inflicted, caution is exercised so that there is no lasting damage. What kind of people enjoy BDSM? Created with Sketch. Interest in BDSM is not concentrated among a single demographic, but a small body of evidence suggests that those who enjoy BDSM may share some key personality traits. One study, for instance, found that people who enjoyed BDSM were less neurotic, more extraverted, more open, and less sensitive to rejection than those who didn’t. Do people who like BDSM have a history of abuse or trauma? Created with Sketch. Not necessarily; some recent studies have found that BDSM practitioners have, on average, lower levels of PTSD than the general population. On the other hand, there are some people who report practicing BDSM as a way of working through their past trauma. Are women or men more interested in BDSM? Created with Sketch. It’s hard to know for sure. Some studies have indicated slightly more men than women report engaging in BDSM, but some researchers caution that social stigma may lead to survey respondents not being entirely truthful. article continues after advertisement if (!window.ptAdSlots || window.ptAdSlots.length === 0) { window.ptAdSlots = []; } window.ptAdSlots.push('div-gpt-ad-1404853927369-9') BDSM and Mental Health To many, the idea of voluntarily being hurt, tied up, or called names during sex is unimaginable; as a result, many have long assumed that those who do desire such practices must have something wrong with them. This may be further compounded in cultures in which speaking openly about sex is frowned upon or that mandate a more traditional view of sexuality. But recent psychological research has tended to conclude that there is nothing inherently mentally unhealthy about mutually consensual BDSM activities. A national survey of Australian adults, for instance, found that those who participated in BDSM were no more likely than others to have experienced sexual abuse or to be unhappy or anxious; a Dutch study found that BDSM practitioners showed greater subjective well-being than a control group. Is an interest in kink a mental disorder? Created with Sketch. No. Early psychologists viewed BDSM-related interests as pathological—leading many in the kink community to feel intense shame about their desires. Today, however, many researchers and clinicians acknowledge that BDSM can be part of healthy sexual expression. However, if the interests and behaviors involve non-consenting parties or cause the individual distress, they may indicate a mental health disorder. Can BDSM be good for partners’ mental health? Created with Sketch. While the direction of cause-and-effect is not fully understood, some studies suggest that BDSM is associated with improved mental health for partnered people. Research has found, for instance, that those who engage in BDSM in romantic relationships—and particularly those who take the dominant role—have lower neuroticism, decreased rejection sensitivity, and greater sexual satisfaction than controls. What’s the difference between BDSM and paraphilias? Created with Sketch. Paraphilias are sexual interests that are “atypical”; by this definition, certain aspects of BDSM (such as extreme sadism or masochism) could be considered paraphilias. However, the DSM currently defines paraphilic disorders as sexual practices that are “atypical” and cause the individual distress or involve non-consenting others. Thus, BDSM alone is not considered a paraphilic disorder. My therapist judges me for enjoying BDSM. What should I do? Created with Sketch. Qualified therapists should never be openly judgmental of his or her patients, even if they engage in practices the therapist personally does not understand. Therapy patients who feel as if their therapist is shaming them for consensual, non-dangerous sexual practices—BDSM or otherwise—should feel empowered to end therapy and find a new clinician. How do I find a kink-friendly therapist? Created with Sketch. Many therapists who identify as “kink-friendly” or “sex-positive” include that information on their website. Individuals can also search for kink-friendly therapists using the Psychology Today Therapy Directory, which allows them to filter by specialty. Patients are also free to ask their therapist directly if they are kink-friendly, if they are comfortable doing so. BDSM in Relationships Many who engage in BDSM within the context of romantic relationships report that it brings them closer to their partner(s). Part of that benefit, many report, are increased feelings of trust that result from setting and respecting boundaries, as well as the emotional safety that comes from being able to explore less conventional sexual interests without judgment. Whether in a long-term relationship or a short-term fling, for the vast majority of those who self-identify as BDSM practitioners, consent from all parties is paramount to the practice. So, too, are open dialogue and clear rules about what is acceptable and what is not. As a result, some people find that relationships that incorporate BDSM have better sexual communication than those that didn’t. How can partners cultivate trust in a BDSM relationship? Created with Sketch. Trust is crucial to BDSM. To build trust, partners should communicate clearly about desires and limits, and decide on a “safeword” or signal to stop. Afterwards, partners should discuss what worked and what didn’t. BDSM aficionados encourage “aftercare”—affectionate, care-taking behavior after sex—which can help both parties decompress and enhance intimacy. Are all BDSM relationships abusive? Created with Sketch. Not at all. Though BDSM typically involves aspects of pain, humiliation, physical restraint, and/or an apparent lack of control, it is not synonymous with abusive relationships or sexual practices. Many people in long-term, loving relationships practice BDSM. In some cases, however, relationships that engage in BDSM can also be abusive. How can someone recognize abuse in a consensual BDSM relationship? Created with Sketch. BDSM practices require ongoing, enthusiastic consent from all parties. Abusive relationships involve physical, emotional, or sexual harm that is non-consensual and do not involve communication or boundaries. Individuals in BDSM relationships who fear their partner, do not trust that their boundaries will be respected, and feel unable to communicate their concerns should seek help immediately. I want to try BDSM, but my partner is uncomfortable with it (or vice versa). How can we navigate this? Created with Sketch. Ultimately, no one is obligated to engage in sexual behavior they’re uncomfortable with. However, if the couple think compromise is possible, it’s best to start small. In some cases, the reluctant partner is uneasy with extreme aspects of BDSM that are depicted in media. Baby steps—using a blindfold, for instance—may help them determine if they’re interested in trying more. Essential Reads Kinky Eyes Wide Open in the Film "Babygirl" Many kinks don’t even require touching of the genitals or experiencing orgasm. The sex is mental, the fantasy and power exchange itself. Is BDSM Always About Sex? BDSM can provide non-sexual fulfillment, serving as a form of play or leisure. Why Gen Z Is the Kinkiest Generation Yet Young adults today are fantasizing about and engaging in kink at higher rates than older generations. Shifting sexual norms have opened the door to exploring previous taboos. Is BDSM Okay? People who like kink aren't more likely to have emotional or relationship problems, be sexist, escapist, or child abuse victims. Rising Interest in Consensual Non-Consent Consensual NonConsent is a kinky sexual practice that is becoming more popular, even though it can be dangerous and must be done quite carefully. Consensual NonConsent is a kinky sexual practice that is becoming more popular, even though it can be dangerous and must be done quite carefully. A Sex Therapist at the Movies: "Babygirl" As a practicing sex therapist, I wondered how the theme of sexual submissiveness could still be enough to sustain a plot in 2024. I needn't have worried. As a practicing sex therapist, I wondered how the theme of sexual submissiveness could still be enough to sustain a plot in 2024. I needn't have worried. What Is Kinky Sex? Does It Matter? There's nothing wrong with liking kinky sex, whatever that means to you. Yet some people stay away from sexual activities they enjoy because they see themselves as "not kinky." There's nothing wrong with liking kinky sex, whatever that means to you. Yet some people stay away from sexual activities they enjoy because they see themselves as "not kinky." Top 5 BDSM and Kink Myths to Debunk The intricate sexual behaviors of people who practice consensual power exchange and less common sexual interests are critical to understand by mental health professionals. The intricate sexual behaviors of people who practice consensual power exchange and less common sexual interests are critical to understand by mental health professionals. What to Understand About People Who Enjoy BDSM and Kink A recent study agrees with many others over the past 20 years: BDSM players are as psychologically and sexually healthy as the general population. A recent study agrees with many others over the past 20 years: BDSM players are as psychologically and sexually healthy as the general population. The Truth About Breath Play and Choking During Sex What is the difference between choking or strangulation and breath play? A few answers: legality, execution, and risk. What is the difference between choking or strangulation and breath play? A few answers: legality, execution, and risk. Overcoming Cultural Taboos Around Sexuality Explore personal values, navigate shame, and create safe spaces for sexual expression. Ready to break free from taboos and embrace your true sexual self? Read on. Explore personal values, navigate shame, and create safe spaces for sexual expression. Ready to break free from taboos and embrace your true sexual self? Read on. How Women Are Transforming "Public" Sex While public sex is nothing new, the ways in which women are taking charge of their own public sexual interactions are transforming the public sexual landscape. While public sex is nothing new, the ways in which women are taking charge of their own public sexual interactions are transforming the public sexual landscape. Why You Should Never Choke a Partner During Sex Choking a partner during sex has become popular thanks to porn. It is just as dangerous as a police chokehold and can cause permanent brain damage or death. Choking a partner during sex has become popular thanks to porn. It is just as dangerous as a police chokehold and can cause permanent brain damage or death. What We Can Learn About Ourselves From BDSM Internal conflict and self-judgment are often at the heart of strong judgments of others. The BDSM community can teach us something about self-acceptance and self-exploration. Internal conflict and self-judgment are often at the heart of strong judgments of others. The BDSM community can teach us something about self-acceptance and self-exploration. 1 2 Next'''
