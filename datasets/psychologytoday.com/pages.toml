title = "Assertiveness | Psychology Today"
description = "Assertiveness is a social skill that relies heavily on effective communication while simultaneously respecting the thoughts and wishes of others. People who are assertive clearly and respectfully communicate their wants, needs, positions, and boundaries to others. There’s no question of where they stand, no matter what the topic."
full_description = '''Assertiveness Reviewed by Psychology Today Staff Assertiveness is a social skill that relies heavily on effective communication while simultaneously respecting the thoughts and wishes of others. People who are assertive clearly and respectfully communicate their wants, needs, positions, and boundaries to others. There’s no question of where they stand, no matter what the topic. Individuals who are high in assertiveness don't shy away from defending their points of view or goals, or from trying to influence others to see their side. They are open to both compliments and constructive criticism. People can improve their assertiveness through practical exercises and experience. Contents Why Assertiveness Is Important How to Be Assertive Why Assertiveness Is Important A person who is assertive clearly communicates their wishes and sets boundaries, but does not make demands of other people or lash out if requests are not met. The ability to be assertive allows someone to make overtures to other people and stand up for themselves or others in a nonaggressive way. It can also protect them from bullies and other social predators. From a cognitive standpoint, assertive people experience fewer anxious thoughts, even when under stress. From a behavioral standpoint, assertive people are firm without being rude. They react to positive and negative emotions without becoming aggressive or resorting to passivity. What are some benefits of being assertive? Created with Sketch. Being assertive offers a number of benefits, ranging from less anxiety and depression to a greater sense of agency and better relationships. Assertiveness is often associated with higher self-esteem and confidence. What are some dangers of not asserting yourself? Created with Sketch. People who are unable to assert themselves may experience sensitivity to criticism, extreme passivity, insecurity, anxiety, or even low self-esteem. They may be treated like emotional doormats whose needs always come second. In extreme cases, they may completely lose sight of what they need and want in life. Why are some people not assertive? Created with Sketch. Individuals who can’t or won’t assert themselves often believe deep down that they’re less worthy than others. They may doubt themselves and hesitate before taking action for fear of the consequences. They frequently avoid trying new things and tend to let other people’s desires determine their goals. article continues after advertisement if (!window.ptAdSlots || window.ptAdSlots.length === 0) { window.ptAdSlots = []; } window.ptAdSlots.push('div-gpt-ad-1404853927369-9') How to Be Assertive Assertive people tend to project confidence. They maintain eye contact, have good posture, and use body language effectively. They are able to express their thoughts and beliefs honestly and reasonably—and they encourage other people to do the same. Being assertive means speaking up for one’s rights without disrespecting anyone else’s. It involves managing stress, solving problems as they arise, and staying calm no matter how the other person reacts. What are assertive behaviors? Created with Sketch. Assertive people are able to be honest about their thoughts and feelings in a respectful way. They actively listen to and are considerate of other people’s perspectives. Assertive people are able to maintain control over their feelings and admit when they’ve made a mistake. How can I be more assertive? Created with Sketch. Concisely state what you want or need from the other person. Listen carefully to their response. Respect their thoughts and feelings; don’t argue or attack if you sense resistance. Instead, offer potential solutions to the problems that come up. If you reach a stalemate where there’s no possible compromise, be prepared to walk away. What’s the difference between assertiveness and passiveness? Created with Sketch. People who are more passive will go along with the wishes and desires of others to please them. They let others lead and make most of the decisions. They tend to lack confidence and often belittle and put themselves down. As a result, they don’t advocate for themselves and may lose sight of their own goals. What’s the difference between assertiveness and aggression? Created with Sketch. Aggressive behavior may include using offensive language, telling instead of asking, and either ignoring or trying to shame the other person into submission. Aggressive people need to win at all costs, often resulting in a pushy attitude and bullying. They can seem superior, intimidating, and even physically threatening. Essential Reads 6 Signs That You Need to Assert Yourself Learn to recognize common emotional signals that indicate assertiveness is needed to improve a relationship. The Power of Assertiveness Training Discover the transformative power of assertiveness training to confidently navigate relationships, communicate effectively, and maintain healthy boundaries. 6 Tips on Being More Assertive to Reduce Stress and Anxiety New research suggests assertiveness can reduce stress, anxiety, and depression. Assertiveness can also improve self-esteem and self-confidence. 7 Ways to Save a Friendship Redirect, politely disagree, or be frank but kind. 5 Social Skills Every Teen With Anxiety Needs to Learn Teaching anxious teens social skills, such as starting conversations, reading cues, and handling rejection, helps them build confidence and navigate social situations. Teaching anxious teens social skills, such as starting conversations, reading cues, and handling rejection, helps them build confidence and navigate social situations. When a Partner Just Won't Let You Finish It's conversational dominance—and it's more than just talking a lot. It's conversational dominance—and it's more than just talking a lot. Adult Children and Parents: Time For a Relationship Upgrade? Adult children and their parents often experience a difficult transition because they each have different memories and are in different developmental stages. How to make it better. Adult children and their parents often experience a difficult transition because they each have different memories and are in different developmental stages. How to make it better. Where's Smokey the Bear When You Need Him? Effective media-psychology campaigns can lead to better public safety following the recent wildfires. Effective media-psychology campaigns can lead to better public safety following the recent wildfires. Escaping the Yes Trap: The Power of No Escape the "yes" trap and reclaim your time! Learn to prioritize self-care and live authentically. Escape the "yes" trap and reclaim your time! Learn to prioritize self-care and live authentically. 6 Ways to Talk to Someone You're Worried About 1. Start with your worry, not their problem. 1. Start with your worry, not their problem. Children as Independent Thinkers Parenthood involves guiding children while navigating their challenges to authority, a key part of their growth and identity. Parenthood involves guiding children while navigating their challenges to authority, a key part of their growth and identity. Harness the Power of Anger for Positive Change When guided by wisdom and compassion, anger transforms from a reactive force into a catalyst for meaningful change. When guided by wisdom and compassion, anger transforms from a reactive force into a catalyst for meaningful change. Assertiveness: It's Not About Control Stereotypical "assertiveness" can seem harsh, but assertiveness is actually an act of kindness. Stereotypical "assertiveness" can seem harsh, but assertiveness is actually an act of kindness. What to Do When You’re Not Sure What to Do Life is about making decisions, but sometimes you struggle to make them. Here's why this happens, and six tips for getting unstuck. Life is about making decisions, but sometimes you struggle to make them. Here's why this happens, and six tips for getting unstuck. 1 2 Next'''
