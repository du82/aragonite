title = "Sex | Psychology Today"
description = "From attraction to action, sexual behavior takes many forms. As pioneering sex researcher Alfred Kinsey put it, the only universal in human sexuality is variability itself."
full_description = '''The Fundamentals of Sex Reviewed by Psychology Today Staff From attraction to action, sexual behavior takes many forms. As pioneering sex researcher Alfred Kinsey put it, the only universal in human sexuality is variability itself. Human interest in sex can be thought of as a built-in imperative: Survival of the species depends on it. And although sexual desire tends to wax and wane over the course of one's life, depending on external demands and relationship satisfaction, it often serves as a passport to bonding, intimacy, pleasure, and even human growth and healing. People engage in sexual activity for many reasons: To feel alive, to maintain a vital aspect of human functioning, to feel desirable or attractive, to achieve closeness, or to please a partner they love. Sex can be one of the most difficult subjects for a couple to discuss: Bodies and interests change over time, and most people will experience some type of sexual problem at some point in life. Therefore, open communication is essential to intimacy and long-term satisfaction. To learn more, see Human Sexuality and Core Questions About Sex. How Does Desire Emerge? Sexual desire involves both biology and psychology, can be unpredictable, and can manifest very differently in men and in women. For men, arousal typically precedes desire. But for women, desire often precedes arousal, in response to physical intimacy, emotional connection, and an atmosphere free of distraction. Researchers focus on human desire by exploring the interplay of biological influences such as neurohormones and psychological influences such as emotions and relationships. Smell plays an often subtle role in attraction; research shows that women are attracted to mates whose natural body odor, or pheromones, signals a genetic profile distinct from their own. Low sexual desire is common among both men and women but it can often be resolved by addressing conflicts, more consistently exchanging affection and conversation outside the bedroom, and making sufficient time for sex. To learn more, see Sexual Attraction and Desire and How Men and Women Think About Sex. article continues after advertisement if (!window.ptAdSlots || window.ptAdSlots.length === 0) { window.ptAdSlots = []; } window.ptAdSlots.push('div-gpt-ad-1404853927369-9') The Pleasure of Sex The pleasure of sex arises from factors including the release of neurochemicals such as oxytocin and dopamine, and the sense of connection expressed through touching, massaging, and cuddling. There is no one way to be sexual, and there is enormous variation in the activities that people find arousing. Men are especially stimulated by visual imagery: About 90 percent of young men report using pornography with some regularity. Many couples today engage in behaviors that were once perceived as atypical, including dominance play and anal intercourse. Researchers now understand that flexibility in sexual repertoires is healthy and generally enhances relationships. Clinicians regard specific behaviors as problematic only when they create harm or distress for one or both partners or when the behavior is compulsive—that is, it becomes the only means of arousal. "Sex addiction" is a label often used to suggest an excessive or pathological interest in sex, but studies show that this perception is more tied to one's moral or religious outlook than to actual sexual practice. To learn more see Arousal, Orgasm and Post-Coital Behavior and Hookups and Casual Sex. How Does Sex Change Over the Lifespan? Sexual behavior changes over time, and the trajectory of change may vary between men and women. Young women may have difficulty navigating cultural attitudes about sexual behavior and promiscuity as they first explore their sexuality, but age brings confidence and greater skill at communicating their needs and desires. Young men often have concerns about performance, penis size, or premature ejaculation. Anxiety is a threat to performance for either men or women. Couples tend to report that their sex life is most robust in their 30s and 40s, but sex is often most deeply rewarding for older partners. People can enjoy satisfying sex throughout the lifespan if they make adjustments for the many changes that time brings, such as relying less on penile penetration and more on massage, whole-body touching, and oral sex. To learn more, see Sex in Long-Term Relationships and Sexual Concerns. What Are the Different Sexual Disorders? A wide variety of behaviors, preferences, and quirks are recognized as part of healthy sexual activity. A sexual behavior becomes a disorder, however, when it leads to significant distress, threatens to harm others, or becomes compulsive. There is a range of clinically recognized sexual disorders. Erectile disorder, also called erectile dysfunction, is a chronic inability to get or to maintain an erection. Orgasmic disorder may be diagnosed when a woman is not able to reach orgasm, and genito-pelvic pain or penetration disorder refers to the experience of extreme pain during penetrative sex. And paraphilias such as pedophilia and fetishistic disorder are present when a person’s sexual arousal depends on fantasizing about or engaging in disturbing or extreme sexual behavior. For more information, see Sexual Disorders and the Diagnosis Dictionary. Next: Human Sexuality Essential Reads How Many Men Have Ever Faked an Orgasm? Research suggests that a surprisingly large number of men have faked an orgasm before. So what are their main reasons for faking it? And what leads them to stop faking orgasm? Sex, Love, and Chatbots The future of digisexuality is here and many of us are concerned, but as we learn more about this new paradigm, we may realize that we have more agency than we think. Overcoming Distorted Self-Perceptions Following Surgery Your body is not perfect, especially after treatment to cure a life-threatening disease. Appreciate your new look, have self-love, and believe that you have sexual energy. Sex Toys Are More Than Fun for One Bored or hoping to boost your sexual satisfaction? Using sex toys with your partner might be the excitement you’re looking for. Recent Posts Does Porn Affect People’s Feelings About Their Sexual Organs? Many men believe their penises are too small, while many women are dissatisfied with their vaginas. Pundits may blame pornography, but a recent study disputes that. Many men believe their penises are too small, while many women are dissatisfied with their vaginas. Pundits may blame pornography, but a recent study disputes that. Social Anxiety in the Streets, Sexual Anxiety in the Sheets Sexual anxiety is social anxiety. Fear of judgment and rejection can impact intimacy, but CBT can help people replace self-doubt with confidence and connection. Sexual anxiety is social anxiety. Fear of judgment and rejection can impact intimacy, but CBT can help people replace self-doubt with confidence and connection. Embracing the Fullness of Life Embark on a transformative journey with Tantra—a timeless path that invites you to awaken your true potential by embracing life’s full spectrum of experiences. Embark on a transformative journey with Tantra—a timeless path that invites you to awaken your true potential by embracing life’s full spectrum of experiences. Are Imagination and Flexibility Important Romantic Values? Fantasies that occur in cyberspace are most valuable when they are bound by reality. Fantasies that occur in cyberspace are most valuable when they are bound by reality. From Screen Time to Sensual Time The "digital mistress" is stealing time, attention, and intimacy. Is tech the new silent threat to relationships? The "digital mistress" is stealing time, attention, and intimacy. Is tech the new silent threat to relationships? 3 Surprising Ways to Build Intimacy in Your Relationship Cultivating lasting intimacy requires more than date nights and lingerie. Here are three novel ways to supercharge your connection, backed by experience and science. Cultivating lasting intimacy requires more than date nights and lingerie. Here are three novel ways to supercharge your connection, backed by experience and science. Break the Dry Spell: Five Therapeutic Steps to Reconnection Break out of your sexual rut and bring back physical intimacy. Break out of your sexual rut and bring back physical intimacy. What Are Sexless Couples Avoiding When They Don’t Have Sex? Sexless couples are more common than most people realize, and there is confusion as to why these couples are not having sex. See what these couples may actually be avoiding. Sexless couples are more common than most people realize, and there is confusion as to why these couples are not having sex. See what these couples may actually be avoiding. Why Fear of Intimacy Is Sabotaging Your Chance at Real Love When you let go of your fear, when you allow yourself to be vulnerable, you open the door to real connection. When you let go of your fear, when you allow yourself to be vulnerable, you open the door to real connection. What Taylor Swift and Travis Kelce Get Right About Love What Taylor Swift and Travis Kelce can teach us about relationships. What Taylor Swift and Travis Kelce can teach us about relationships. 1 2 Next'''
