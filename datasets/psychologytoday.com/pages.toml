["https://psychologytoday.com/us/basics/awe"]
title = "Awe | Psychology Today"
description = "Awe is a complex emotion that occurs when we experience or witness something wondrous, vast, terrifying, inspiring, amazing, or mind-blowing. Awe can be triggered by experiences as diverse as walking through an untamed natural landscape, viewing a highly complex piece of art or architecture, having a spiritual or religious experience, or witnessing a seemingly impossible athletic feat; astronauts who visit space report feeling something like awe when they look at Earth from a great distance."
full_description = "Awe Reviewed by Psychology Today Staff Awe is a complex emotion that occurs when we experience or witness something wondrous, vast, terrifying, inspiring, amazing, or mind-blowing. Awe can be triggered by experiences as diverse as walking through an untamed natural landscape, viewing a highly complex piece of art or architecture, having a spiritual or religious experience, or witnessing a seemingly impossible athletic feat; astronauts who visit space report feeling something like awe when they look at Earth from a great distance. Awe can connect us with others or make us feel part of something greater than ourselves; alternatively, it can leave us feeling small, powerless, and utterly insignificant. While awe is not a wholly positive emotion—it is possible, for example, to be awe-struck by something frightening or saddening—it can and often does come with some psychological benefits, including increased prosociality, generosity, and open-mindedness. Though it’s not always easy to deliberately trigger awe, seeking out situations and experiences where awe is possible could be a path toward improving your mental well-being and even your physical health. Contents The Psychology of Awe Why We Should Seek Awe The Psychology of Awe Awe is still in some ways mysterious, and the study of it is still relatively new. That said, psychologists have defined awe as a powerful blend of admiration, wonder, respect, and sometimes dread and proposed a few theories as to why we feel it. Many such theories have evolutionary roots; one theory, for example, posits that awe was selected for because the ability to experience awe signaled that someone was intelligent or emotionally sensitive—potentially desirable traits in a mate. Another theory, also evolutionary, argues that being in awe of other people (for example, a high-status or highly skilled person) perhaps helped to reinforce early humans’ social hierarchies. Other theories posit that, because awe tends to make us feel more connected to others, it reinforces social bonds and compels people to work toward the greater good. But while awe’s greater purpose remains up for debate, what is known is that awe can be immensely powerful, both for the individual and for social groups more broadly. Are there different kinds of awe? Created with Sketch. Researchers Dacher Keltner and Jonathan Haidt, who were among the first psychologists to examine and define awe, suggest that awe comes in several “flavors,” depending on what triggers it and the nature of the emotion that arises. In an early paper, they suggest that the flavor of awe may vary depending on whether it is triggered by: • Threat • Beauty • Ability • Virtue • Supernatural beliefs Is awe always positive? Created with Sketch. Some research has suggested that most people, when asked to recall an awe-inspiring experience, recount something positive, like seeing the Grand Canyon or holding their child for the first time. However, many researchers who study awe conceptualize it as an emotion that can be either positive or negative, or even a bit of both. A volcanic eruption, for example, could be awe-inspiring at the same time as it is terrifying. How does awe affect our behavior? Created with Sketch. Various studies on the psychology of awe have found that inducing awe can lead participants to behave more generously, become more prosocial, or become more concerned with ethics, fairness, and right and wrong. A common thread, then, may be that awe encourages us to behave in a way that strengthens our connection to one another and promotes the greater good. article continues after advertisement if (!window.ptAdSlots || window.ptAdSlots.length === 0) { window.ptAdSlots = []; } window.ptAdSlots.push('div-gpt-ad-1404853927369-9') Why We Should Seek Awe Awe has the potential to make us kinder, more generous people, and emerging research suggests that it has real benefits for our mental and physical health. The kind of dramatic, life-changing events that often provoke awe may not occur frequently, and true awe can’t be forced. Still, it is possible to create conditions in your life that make awe more likely, especially smaller moments of “everyday awe,” like witnessing an act of kindness or a baby taking its first steps. And when it’s not feasible to seek real-life awe, some research finds that watching awe-inspiring videos or reading awe-inspiring books could provide similar benefits in a pinch. What are the benefits of experiencing awe? Created with Sketch. Research has found that experiencing positively themed awe is associated with increased well-being and a greater sense of social connection; other studies have found that it can also be tied to reduced stress and a reduced tendency to engage in rumination, a key feature of depression and anxiety. Some studies have also found awe-inspiring experiences to be associated with increased oxytocin and reduced inflammation, which could have physical benefits in addition to mental ones. How can awe promote personal growth? Created with Sketch. Awe is closely intertwined with meaning, as moments of awe can help clarify what really matters or even help someone identify a new life purpose. In that sense, experiencing awe can help us assess our lives and determine whether our current path aligns with our deeper values, a journey that often leads to personal growth. Similarly, having awe in one’s life can decrease our self-focus, which in turn has been found to boost mood, rein in rumination, and even help us better control our worst impulses, such as aggression or incivility. How can I experience more awe? Created with Sketch. When people are asked to recall awe-inspiring experiences, many often recount times they spent in nature; thus, psychologists suggest that spending time in natural environments could be a reliable way to induce awe. Aside from that, changing up your routine—taking a different route for your afternoon walk, trying a new restaurant, or otherwise making novel choices—can also set the stage for an awe-inducing experience. Essential Reads A Picture Is Worth a Thousand Words, but How Many Feelings? Creative expression is a cornerstone of culture and communication, but how can we understand the emotional experience of visual art? Death Is a Doorway to Awe His brother's death inspired researcher Dacher Keltner to contemplate how awe brings meaning and sacredness into our lives. Experiencing the Overview Effect With Both Feet on the Ground Virtual reality simulated the Overview Effect effect experienced by astronauts. Brain imaging now demonstrates that participants experience the effect. Awe Is a Response to Mystery Researcher Dacher Keltner explains that the emotion of awe encourages imagination and cooperation, inspiring us to think beyond what we know and to feel connected to others. Allow Yourself to Cultivate Awe Given the value of self-compassion, what might help people open the door to something that could powerfully help them, especially amid sudden, troubling circumstances? Given the value of self-compassion, what might help people open the door to something that could powerfully help them, especially amid sudden, troubling circumstances? I'm Jealous of My Autistic Son Personal Perspective: I've come to look at my son, Nat, not just with the pride of a mother, but with admiration. Personal Perspective: I've come to look at my son, Nat, not just with the pride of a mother, but with admiration. Unlock Creative Brilliance: The Power of the Unknown Personal Perspective: You’ve mastered your craft—but could staying in your lane be holding you back? Mastery is valuable, but stepping into the unfamiliar is the key. Personal Perspective: You’ve mastered your craft—but could staying in your lane be holding you back? Mastery is valuable, but stepping into the unfamiliar is the key. A Neurodiversity Affirmative Approach for Professionals Neurodivergent brains and people are unique and awesome. It is recommended to take a neurodiversity affirmative approach and be awed, humble, and respectful toward them. Neurodivergent brains and people are unique and awesome. It is recommended to take a neurodiversity affirmative approach and be awed, humble, and respectful toward them. Discovering Our True Nature We all deal with inner demons arising from negative thinking, suppressed emotions, and past traumas. We must cut through their illusions to uncover our true nature. We all deal with inner demons arising from negative thinking, suppressed emotions, and past traumas. We must cut through their illusions to uncover our true nature. Making the Stone Stony Art and aesthetics inform psychotherapy just as much as science—and these aesthetic processes can help push patients toward cognitive flexibility. Art and aesthetics inform psychotherapy just as much as science—and these aesthetic processes can help push patients toward cognitive flexibility. Grounding Yourself Through a Moment of Wonder In a distracting, cynical world of ever-breaking news, we can lose our focus and attention to what really matters. But a few minutes gazing at the sky can switch us back on track. In a distracting, cynical world of ever-breaking news, we can lose our focus and attention to what really matters. But a few minutes gazing at the sky can switch us back on track. H.G. Wells, Maslow, and the Peak-Experience H.G. Wells may have been an important source for Maslow's influential concept of peak-experiences. H.G. Wells may have been an important source for Maslow's influential concept of peak-experiences. Access Your Ecstasy Being wired for bliss means you can turn this circuit on naturally. Here are five ideas to enhance your bliss in the new year. Being wired for bliss means you can turn this circuit on naturally. Here are five ideas to enhance your bliss in the new year. Awe in Childhood Without digital distractions, children seem to experience more profound awe, emphasizing the importance of creating opportunities for technology-free wonder. Without digital distractions, children seem to experience more profound awe, emphasizing the importance of creating opportunities for technology-free wonder. 1 2 Next"
