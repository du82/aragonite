title = "ASMR | Psychology Today"
description = "Autonomous sensory meridian response—more commonly referred to as ASMR—is the name given to a tingling sensation, typically on the scalp, neck, or back, that some people report feeling in response to certain visual or auditory stimuli."
full_description = '''ASMR Autonomous Sensory Meridian Response Reviewed by Psychology Today Staff Autonomous sensory meridian response—more commonly referred to as ASMR—is the name given to a tingling sensation, typically on the scalp, neck, or back, that some people report feeling in response to certain visual or auditory stimuli. Contents Understanding ASMR The Benefits of ASMR Understanding ASMR The name “Autonomous Sensory Meridian Response” was conceived in the mid-2000s by an enthusiast who hoped that a clinical sounding name would lend legitimacy to what was, at the time, thought to be a niche experience. In the years since, ASMR has become a popular internet phenomenon—inspiring millions of YouTube videos and countless devotee blogs—but it has not yet been widely studied in the field of psychology. However, researchers have recently begun to explore whether the phenomenon has any scientific basis whatsoever. So far, some preliminary research suggests that ASMR may help manage symptoms of insomnia; other small fMRI studies suggest that those who experience ASMR may have subtle brain differences from those who don’t. These findings need to be replicated in larger, more rigorous studies, but they have started to provide clinical evidence for what was once purely anecdotal. What triggers ASMR? Created with Sketch. Those who experience ASMR say that the sensation is triggered by soft noises, such as a whispering voice, or repetitive visuals, like towels being folded—essentially an array of seemingly ordinary sights and sounds. ASMR can also be triggered by physical contact, such as receiving a massage or getting a haircut. What does ASMR feel like? Created with Sketch. ASMR is an interesting combination of both arousal and relaxation. Some describe it as tingles, chills, or waves that move through the head, neck, and spine, and the physical sensation is accompanied by feelings of happiness, calm, or sleepiness. Can I train myself to experience ASMR? Created with Sketch. There isn’t yet research to demonstrate that people can or cannot cultivate ASMR. However, it seems unlikely, because ASMR is an involuntary physiological response, similar to synesthesia, which can’t be practiced or learned. What’s the relationship between ASMR and misophonia? Created with Sketch. ASMR and misophonia—strong reactions and aversion to sound— may share similar roots: One study found that half of people with misophonia also experienced ASMR. Both have been described as a tingling sensation, but while ASMR is pleasant and relaxing, misophonia is distressing and fuels emotions like anger and disgust. Visual cues can also become tied to specific sounds for both phenomena. article continues after advertisement if (!window.ptAdSlots || window.ptAdSlots.length === 0) { window.ptAdSlots = []; } window.ptAdSlots.push('div-gpt-ad-1404853927369-9') The Benefits of ASMR ASMR can be deeply pleasurable or relaxing for those who experience it. But its best-known application is as a treatment for insomnia. In one small survey, 82 percent of respondents reported that they used ASMR to induce sleep. In podcast episodes or online videos aimed at soothing the listener to slumber, ASMRtists (as they’re known in the ASMR community) whisper softly, rub soft objects together, brush their hair, or complete other tasks aimed at triggering ASMR sensations and accompanying feelings of relaxation. But more research is needed to uncover ASMR’s mechanism of action in insomnia. Is there evidence that ASMR is real? Created with Sketch. Some believe that ASMR can be chalked up to imagined sensations or recreational drugs. But research suggests that ASMR is a real phenomenon. One study found physiological differences between those who did and did not report experiencing ASMR; participants who experienced ASMR had a lower heart rate and increased skin conductance while watching ASMR videos. Can ASMR help you sleep? Created with Sketch. Research on how ASMR may treat insomnia is only just beginning. But anecdotally, it seems to help: Most people report using ASMR to help them fall asleep and the most common time to experience ASMR is before bed. ASMR may ease people to sleep by reducing stress, improving mood, or distracting them from intrusive thoughts. Essential Reads Why We Hate the Music We Hate Effects that seem to get more intense as we get older. What We Really Know About ASMR Watching videos that trigger ASMR can lead to positive responses throughout the body, including enhanced mood, relaxation, and even pain relief. The Psychology of ASMR New research examines the interplay between personality and ASMR receptivity. What Is ASMR All About? Have you wondered why so many people are talking about, joking about, or singing the praises of ASMR? Here's what it might mean for you. A Warning Lesson From Lee Harvey Oswald’s Wedding Ring A gold wedding ring left behind, three shots in Dealey Plaza, and a chilling farewell—Oswald's quiet warning still echoes. Are we listening to the signs of violence today? A gold wedding ring left behind, three shots in Dealey Plaza, and a chilling farewell—Oswald's quiet warning still echoes. Are we listening to the signs of violence today? How Fans Have Found New Ways to De-Stress Are you exhausted by information overload? Here are five ways to connect with the things you love without taxing your resources. Are you exhausted by information overload? Here are five ways to connect with the things you love without taxing your resources. Teasing the Science Behind Brain Tingles in ASMR "It's hard to turn a viral phenomenon into legitimate science," says Dr. Bryson Lochte, who published a key research paper on the little-understood phenomenon of ASMR. "It's hard to turn a viral phenomenon into legitimate science," says Dr. Bryson Lochte, who published a key research paper on the little-understood phenomenon of ASMR. Why Are Certain Sounds So Painful? Why do certain sounds like nails on a chalkboard feel so awful? Research in multisensory integration suggests it's more than just the sound waves themselves. Why do certain sounds like nails on a chalkboard feel so awful? Research in multisensory integration suggests it's more than just the sound waves themselves. Trigger Me This: Why It's Okay to Be Triggered Why do we think issuing "trigger warnings" is helpful? Why do we think issuing "trigger warnings" is helpful? An Update on Misophonia Research What do the misophonia 23andMe genetic results really tell us? How can this information help an individual with misophonia? What do the misophonia 23andMe genetic results really tell us? How can this information help an individual with misophonia? Stuck at Home With Misophonia? Are you stuck at home with misophonia? Are you a parent of a child with misophonia? Some tips for coping. Are you stuck at home with misophonia? Are you a parent of a child with misophonia? Some tips for coping. What Parents Can Do to Manage Coronavirus Stress in Kids With the threat of a pandemic, what can parents do to help kids cope with COVID-19, school closings, event cancellations, and the climate of fear? With the threat of a pandemic, what can parents do to help kids cope with COVID-19, school closings, event cancellations, and the climate of fear? What Do Teachers Know About Misophonia? New research supports the notion that college professors need information about misophonia. How does this impact you? New research supports the notion that college professors need information about misophonia. How does this impact you? How Grown-Ups Can Benefit From a Sleep Schedule Tired all the time? A regular sleep routine might help you rest easier. Tired all the time? A regular sleep routine might help you rest easier. 1 2 Next'''
