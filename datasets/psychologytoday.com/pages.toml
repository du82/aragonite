["https://psychologytoday.com/us/basics/adolescence"]
title = "Adolescence | Psychology Today"
description = 'Adolescence is the transitional stage from childhood to adulthood that occurs between ages 13 and 19. The physical and psychological changes that take place in adolescence often start earlier, during the preteen or "tween" years: between ages 9 and 12.'
full_description = '''Adolescence Puberty, Teenagers Reviewed by Psychology Today Staff Adolescence is the transitional stage from childhood to adulthood that occurs between ages 13 and 19. The physical and psychological changes that take place in adolescence often start earlier, during the preteen or "tween" years: between ages 9 and 12. Contents What Is Adolescence? Talking to Teens Mental Health in Adolescence What Is Adolescence? Adolescence can be a time of both disorientation and discovery. The transitional period can raise questions of independence and identity; as adolescents cultivate their sense of self, they may face difficult choices about academics, friendship, sexuality, gender identity, drugs, and alcohol. Most teens have a relatively egocentric perspective on life; a state of mind that usually abates with age. They often focus on themselves and believe that everyone else—from a best friend to a distant crush—is focused on them too. They may grapple with insecurities and feelings of being judged. Relationships with family members often take a backseat to peer groups, romantic interests, and appearance, which teens perceive as increasingly important during this time. The transition can naturally lead to anxiety about physical development, evolving relationships with others, and one's place in the larger world. Mild anxiety and other challenges are typical, but serious mental health conditions also emerge during adolescence. Addressing a disorder early on can help ensure the best possible outcome. What are the stages of adolescence? Created with Sketch. The stages of adolescence include early adolescence from age 10 to 14, mid-adolescence from age 15 to 17, and late adolescence from age 18 to 24. Each stage encompasses different challenges for teens and necessitates different responses from parents. What is the purpose of adolescence? Created with Sketch. The purpose of adolescence is for a child to psychologically and socially transform into a young adult. Breaking from their childhood attachment and security allows children to acquire freedom and responsibility to develop independence and to differentiate themselves from their parents and childhood to establish their own unique identity. Why is puberty so challenging? Created with Sketch. Puberty begins between ages 9 and 15, and it lasts between a year and a half to three years. The hormonal and biological changes that occur can lead adolescents to feel anxious and self-conscious and to require more privacy and become preoccupied with their appearance, which can influence how they are perceived and accepted. Why do teens make bad decisions and take risks? Created with Sketch. Adolescent risk-taking is often blamed on hormonal changes, but relationships play a key role as well. The teenage years are devoted to creating friendships that can serve individuals for life. Along those lines, research suggests that adolescents are motivated by peer acceptance more than adult perceptions—for better or for worse. How does sleep change during adolescence? Created with Sketch. The biological clock shifts during puberty, prompting teens to become sleepy later and therefore wake up later to get the recommended 8 to 10 hours of sleep. This is why later middle and high school start times are associated with improved attendance and grades as well as a lower likelihood of experiencing depression. article continues after advertisement if (!window.ptAdSlots || window.ptAdSlots.length === 0) { window.ptAdSlots = []; } window.ptAdSlots.push('div-gpt-ad-1404853927369-9') How Do I Talk to My Teen? Speaking openly with adolescents about changes that they are experiencing can be a challenge for any parent, especially given the shift in the parent-child relationship during this time. One important component of communicating with teens is helping them understand what lies ahead. Explaining how their bodies will change so that they aren’t caught by surprise can alleviate a child’s anxiety. Beyond physical changes, parents can begin a conversation about the social and lifestyle changes that accompany adolescence. Discussing the consequences of important decisions—like having sex or experimenting with drugs—can encourage a teen to reflect on their choices. Listening is a powerful yet under-appreciated tool. Parents often orient toward directives and solutions. But setting aside those tendencies and simply listening to the teen can strengthen the relationship. Asking specific or prying questions can make the child feel judged and therefore hesitant to speak openly and honestly. Listening attentively shows interest, validation, and support. It also increases the chances that a teen will confide in a parent as needed. Active listening builds intimacy and trust—while simultaneously allowing the teen to process their experience. How can I maintain a close relationship with a teen? Created with Sketch. Developing an independent identity during adolescence requires experimenting with new relationships and activities while gaining space from parents. But you can still maintain a close relationship despite that process. Express interest and ask questions about your teen’s new passions. Welcome their friends and provide family structure. In disciplinary situations, critique choices rather than character. How do I talk to a teen about healthy sex? Created with Sketch. Convey that you are open to discuss anything, such as sexual health, porn, pleasure, and love. During these conversations, listen openly and non-judgmentally. Shutting down a vulnerable adolescent with negativity or judgment can lead to shame and fear. Being open encourages them to trust you with future questions and to develop a healthy relationship with sex. How do I talk to a teen about drugs and alcohol? Created with Sketch. Most teens will experiment with some combination of alcohol, drugs, and smoking. But parents can inform the choices they make with guidance, such as that the decision to use should be intentional, not automatic and a personal choice, not a socially-pressured one. Parents should discuss the topic openly, honestly, and continually. How can I support a teen when they’re upset? Created with Sketch. Encourage them to share their feelings to ease the emotional burden, even if it’s not with you. Exploring the root of their unhappiness can also lead them to take action: If they’re bored, maybe they can find a new hobby or sport. Adolescence can be an emotional time, but these ideas and others can help. How Does Mental Health Change During Adolescence? Many of the mental health conditions people confront as adults begin to manifest in adolescence. In fact, one in five young adults has a diagnosable disorder, according to the Department of Health and Human Services. However, teens can also struggle with anxiety, depression, and other forms of distress that are developmentally appropriate and will not necessarily endure. It’s difficult to know when a problem merits clinical attention, but when in doubt, querying a school counselor or another mental professional is the best course of action. Parents can help by learning how to identify early warning signs of the disorder they feel concerned about and by not being afraid to ask about their child’s thoughts and experiences. Confronting mental health conditions and accessing treatment early on can prevent a disorder from increasing in severity or duration. When addressed early, most conditions can be managed or treated effectively. Why are teenagers today so stressed and anxious? Created with Sketch. An American Psychological Association report revealed that 91 percent of Generation Z has felt physical or emotional symptoms of stress, such as depression or anxiety. This stress may be due to parental trends like overscheduling, effects of social media like negative social comparisons, and historical events like the great recession and mass shootings. How can I help an anxious teenager? Created with Sketch. Parents can care for their teens by offering empathy and nonjudgmental support—focus on understanding them rather than judging them. Teens achieve more when not pressured to be perfect, so parents can avoid expressing the need for perfection. Maintaining a relationship and encouraging their relationships with other caring adults like teachers and mentors is also helpful. How common are mental health disorders in college? Created with Sketch. At least one in three first-year college students meets the criteria for a mental health disorder, research suggests. An array of factors can contribute to the onset of mental illness during this time: the transition to college, childhood trauma, biological changes, financial stress, academic pressure, lack of sleep, social isolation, and uncertainty about the future. How can I help a college student access mental health care? Created with Sketch. Encourage your child to seek out university mental health services. If the university is unable to provide treatment due to high demand, your child can explore meeting with other health professionals on campus like a doctor or nurse practitioner, asking a campus case manager to help find care off-campus, and beginning teletherapy. What’s the relationship between social media use and mental health? Created with Sketch. Pinning down the relationship between social media and mental health is notoriously difficult. Some recent research suggests that social media doesn’t fuel depression; rather, depression may lead to more social media use, at least among adolescent girls. Essential Reads Embracing Our Freedoms, but at What Cost? People in individualistic cultures celebrate their many choices. But we often fail to recognize the psychological costs that come with having to figure everything out on our own. Meaning and Values in Pediatric Care Meaning and personal values can enable adolescents struggling with illness, injury, and substance abuse to turn their challenges into a self-compassionate narrative. How to Protect Your Child From Social Media Negativity You can't stop negative and mean people from saying hurtful things to your child on social media. But you can use simple, proven techniques using self-talk replacement strategies to guard their hearts. Teenage Abuse of Cough Medicines and Promethazine Recent surveillance indicates apparent renewed interest among teens in Dextromethorphan abuse, sometimes combined with other drugs. Parents and others should be on the alert. How Parents Can Out-Game Their Gamers Taking away your teens' gaming may not be the way to prevent compulsive gaming. Taking away your teens' gaming may not be the way to prevent compulsive gaming. Delta-8 and Delta-9 THC: What's the Difference? What individuals and families need to know about delta-8 and delta-9 THC. What individuals and families need to know about delta-8 and delta-9 THC. 5 Tips for Building Resilience in Adolescents and Teens Adolescence is a time of self-discovery, growth, and learning. Parents and supporters can foster resilience and be a steady presence through it all. Adolescence is a time of self-discovery, growth, and learning. Parents and supporters can foster resilience and be a steady presence through it all. Is Your Teen Neurodiverse? Neurodivergent teens process the world differently. Early support, structure, and self-advocacy help them thrive in school and social life and improve their emotional well-being. Neurodivergent teens process the world differently. Early support, structure, and self-advocacy help them thrive in school and social life and improve their emotional well-being. Is Social Media Causing Your Teen’s Anxiety? Sometimes your teen's mood swings and lack of interest in things they used to love doing is a direct reflection of the negative impact of social media excess. Sometimes your teen's mood swings and lack of interest in things they used to love doing is a direct reflection of the negative impact of social media excess. The New MAHA Commission: Time to Step Forward or Dig In? It’s clear the new MAHA Commission wants to focus on pediatric mental health. What’s not clear is exactly what that means and how we should best respond. It’s clear the new MAHA Commission wants to focus on pediatric mental health. What’s not clear is exactly what that means and how we should best respond. What Can Help Teachers Intervene in Anti-LGBTQ Harassment? How can we reduce anti-LGBTQ harassment in schools? The limited impact of new policies and significant influence of school culture. How can we reduce anti-LGBTQ harassment in schools? The limited impact of new policies and significant influence of school culture. Nicotine Pouch Products Get FDA Approval for Adults The FDA approved the sale of Zyn nicotine pouches, which are increasingly popular with teens. But nicotine pouches cause addiction, as smoking and vaping also do. The FDA approved the sale of Zyn nicotine pouches, which are increasingly popular with teens. But nicotine pouches cause addiction, as smoking and vaping also do. Reversing the Childhood Mental Health Epidemic Screen time likely plays a role in the childhood mental health epidemic. Parents can protect their children by taking steps to safely limit screen time and mitigate its effects. Screen time likely plays a role in the childhood mental health epidemic. Parents can protect their children by taking steps to safely limit screen time and mitigate its effects. How Our Voices Change With Time From childhood to old age, our voice is constantly evolving. Discover what causes these changes and how to keep your voice healthy at any stage of life. From childhood to old age, our voice is constantly evolving. Discover what causes these changes and how to keep your voice healthy at any stage of life. 1 2 Next'''
