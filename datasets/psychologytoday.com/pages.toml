["https://psychologytoday.com/us/basics/evolutionary-psychology"]
title = "Evolutionary Psychology | Psychology Today"
description = '''The human body evolved over eons, slowly calibrating to the African savanna on which 98 percent of humankind lived and died. So, too, did the human brain. Evolutionary psychology is the study of the ways in which the mind was shaped by pressures to survive and reproduce. Findings in this field often shed light on "ultimate" as opposed to "proximal" causes of behavior. Romantic jealousy and mate guarding are proximally intended to keep one's relationship intact.'''
full_description = '''Evolutionary Psychology Sociobiology Reviewed by Psychology Today Staff The human body evolved over eons, slowly calibrating to the African savanna on which 98 percent of humankind lived and died. So, too, did the human brain. Evolutionary psychology is the study of the ways in which the mind was shaped by pressures to survive and reproduce. Findings in this field often shed light on "ultimate" as opposed to "proximal" causes of behavior. Romantic jealousy and mate guarding are proximally intended to keep one's relationship intact. Ultimately, though, the behavior can be explained by the fact that for most of human history, losing a romantic partner jeopardized one's ability to reproduce and raise children. Contents The Science of Evolutionary Psychology Concepts In Evolutionary Psychology Human Nature, Explained Why Evolutionary Psychology Is Controversial The Science of Evolutionary Psychology Natural selection has a lot to do with human behavior. In fact, our behavior is naturally selected just as our physical traits are naturally selected. We are much taller and live longer than our ancestors. Through centuries of generations, evolution has helped us pass along adaptive behaviors that promote our reproduction. What are some basic principles of evolutionary psychology? Created with Sketch. Evolutionary biologist Robert Trivers proposed a number of theories on evolutionary psychology, including why we engage in reciprocal altruism, the nature of sex differences, and parent-offspring investment. Altruism among strangers, for example, can naturally develop because people cooperate with the expectation of receiving similar treatment from others. What is evolutionary behavior? Created with Sketch. Our hunter-gatherer ancestors passed down behavioral traits that are, for the most part, advantageous to us. For example, we are mindful of danger in dark alleyways. This caution is innate and within our behavioral make-up. And our predetermined response to gravitate to that 800-calorie Cinnabon can wreak havoc, but our ancestors made us do it. What is evolutionary mismatch? Created with Sketch. Juggling our ancestral tendencies with the demands of modern-day living can be a struggle. This phenomenon is known as evolutionary mismatch—when we find ourselves in an environment inconsistent with our ancestral conditioning. What is an example of evolutionary mismatch? Created with Sketch. A good example of such mismatch is the contemporary diet: Ten thousand years ago, people battled starvation. They had to pile on the necessary calories just to survive certain lean times; high-fat meats and high-sugar foods were a luxury. Today, however, fatty foods and processed sugars are readily available at low cost. article continues after advertisement if (!window.ptAdSlots || window.ptAdSlots.length === 0) { window.ptAdSlots = []; } window.ptAdSlots.push('div-gpt-ad-1404853927369-9') Concepts In Evolutionary Psychology Many of the behaviors people exhibit have been tools for self-preservation: Homo sapiens jealously guard their romantic partners because competition for mates has always been harsh. Everyone cherishes their closest kin because it's in one's best interest to preserve one's genes. Humans also crave social interaction to encourage cooperation, further increasing the chances for survival. Many of these behaviors are innate: How people react and interact with one another is spelled out in DNA. What is the fight-or-flight response? Created with Sketch. Fight or flight refers to the human body’s built-in response to a perceived threat: It prepares the body to either face danger or quickly run from it. During flight or flight, the brain releases stress hormones, pushing the body into high alert. The heart rate rises, muscles tense, and thoughts race. While the modern-day human does not face the same threats as our ancestors did, the fight-or-flight response system remains intact. What triggers fight or flight? Created with Sketch. Any fearful situation can trigger it, whether it is physical danger or a stressful event, like running late for a meeting. In people with anxiety, the fight-or-flight response is more readily triggered, the brain sees certain situations as threatening, even when there's no actual present danger. In fact, there is a tendency for this response to move into overdrive in anxious individuals. What is kin selection? Created with Sketch. Kin selection is the theory that our calculations about genetic relatedness to others (conscious or unconscious) are powerful drivers of behavior. Most people favor, and will make sacrifices for, immediate kin as opposed to distant relatives, and blood relatives over strangers. This ensures the survival of genes through the survival of the people who are closely related to us. What is reproductive fitness? Created with Sketch. In evolutionary parlance, reproductive success is called reproductive fitness, a measure of how well an organism or a person is adapted to their environment. Men committing foolish or heroic acts that increase status or attractiveness are acting in ways that increase the odds of reproduction, and attempting to maximize reproductive fitness. Reproductive fitness also measures how well an organism is adapted to its environment. What is parental investment? Created with Sketch. The differences in parental investment—the energy and resources invested in an offspring—lead the sex that invests more (females, in most species) to focus on mate quality and the sex that invests less (males) to seek quantity. In humans, we expect choosiness in females and aggression between males as they vie for females. Human Nature, Explained Our emotional complexity differentiates us from other members of the animal kingdom. Evolutionary psychology seeks to explain how our emotions and other aspects of being human served as advantages to our ancestors. Like other social primates, we experience emotions beyond primal fear and anger. Why are we naturally empathic? Created with Sketch. Through evolving as a group, we have developed empathy and altruism, which allow us to commiserate with each other’s circumstances and act in ways that are not self-serving. What is better for the group as a whole, is better for a person as an individual. Why are we naturally drawn to our tribe? Created with Sketch. We have also developed emotions to help keep us in line—for example, shame motivates us to atone for past transgressions, while pride pushes us to remain in the high regard of our peers. And as our social structures developed, so did our value systems and what we define as “right” and “wrong.” Why do people lie? Created with Sketch. Trivers also suggested that complex strategies of cheating, detecting cheating, and the false accusation of cheating (itself a form of cheating) pushed the development of intelligence and helped increase the size of the human brain. Why Evolutionary Psychology Is Controversial People reject evolutionary psychology for ideological reasons. With sexual behavior, for example, there is the notion that the field justifies people’s behaviors and actions. Our present-day traits and characteristics had survival value for our ancestors, and these traits survived because the genes they are linked to were selected and now remain part of our genetic makeup. Shouting evolution made me do it seems so convenient. What is the naturalistic fallacy? Created with Sketch. This refers to common but faulty logic wherein people assume that because something is "natural" it is therefore "good" or just. Violence and aggression are found in all human societies, but that does not make this acceptable behavior. No endorsement is implied in a discovery of what is natural. The general public commits the naturalistic fallacy in thinking that evolutionary psychologists endorse certain findings (such as violence or rape), when in fact evolutionary psychologists are simply outlining reasons that these behaviors may occur. What is the moralistic fallacy? Created with Sketch. The moralistic fallacy is the false belief that the world operates as we wish it would, that what ought to be is in fact the truth, or that because we wish something were not true, it cannot be true. People sometimes reject evolutionary theorists' findings about human nature because they do not want to believe that said findings are true. Why do both conservatives and liberals criticize evolutionary psychology? Created with Sketch. Both sides of the political aisle accuse evolutionary psychology of numerous ills. Among many arguments, for example, conservatives on the right fear that this field of study absolves people of responsibility, while liberals on the left fear that accepting inherited differences hinders the goal of social equality. Why do feminists question evolutionary psychology? Created with Sketch. Feminists are not keen on the idea that women are inherently different from men. Such differences, they think, would force women back in time, losing ground in equal opportunity and equal pay, for example. They also feel that people can use evolutionary psychology to explain away misogyny, poverty, sexual misbehavior, among many areas. Can evolutionary psychology explain homosexuality? Created with Sketch. More and more studies show that homosexuality is genetic. However, being gay doesn’t fit so neatly into the theory of natural selection. Why would nature select for homosexuality if reproductive success is a moot point? But there are valid reasons according to evolutionary biologists. For example, gay aunts and uncles can invest more time and resources in rearing the offspring of close relatives with whom they share part of their genetic makeup. Maybe homosexuality emerged because it benefits entire groups. Essential Reads Do You Feel Safe? It Matters More Than You Think It's not just about avoiding danger; safety is a key to better overall health. Here's why. The Origins of Love Love is a powerful interplay of brain chemistry, heart regulation, and evolution. On Valentine’s Day, we celebrate love’s magic, guided by science, as the force that unites us. Do Dogs Smile? Modern science confirms ancient conclusions. 3 Reasons We Love True Crime and Unsolved Mysteries In uncertain times, true crime provides a way to process real-world anxieties in a structured narrative, offering both excitement and a sense of control. The Mutation That Changed Everything Self-awareness enabled human dominance, but it now threatens survival. To endure, humanity must use its intelligence responsibly to shape a sustainable and meaningful future. Self-awareness enabled human dominance, but it now threatens survival. To endure, humanity must use its intelligence responsibly to shape a sustainable and meaningful future. Primate Lessons: An Evolutionary Lens on School Shootings What can chimpanzees teach us about preventing school shootings? How evolution, neuroscience, and social dynamics shape violent behavior, and how we can intervene. What can chimpanzees teach us about preventing school shootings? How evolution, neuroscience, and social dynamics shape violent behavior, and how we can intervene. Why You Can’t Tickle Yourself We can laugh at our own jokes, mistakes, and pratfalls, but for some reason, we can’t tickle ourselves into a bout of genuine laughter. A new theory reveals the reason why. We can laugh at our own jokes, mistakes, and pratfalls, but for some reason, we can’t tickle ourselves into a bout of genuine laughter. A new theory reveals the reason why. Why Does Virtual Reality Make People Sick? Many virtual reality users experience motion sickness. A new study reveals that virtual movement speed, direction, and head movements play important roles in cybersickness. Many virtual reality users experience motion sickness. A new study reveals that virtual movement speed, direction, and head movements play important roles in cybersickness. Putting "Partner" Into the Term "Romantic Partner" We often refer to our spouse or person whom we are dating as our "partner." If you stop and think about what that truly means, your relationship will likely benefit. We often refer to our spouse or person whom we are dating as our "partner." If you stop and think about what that truly means, your relationship will likely benefit. Symbolic Triggers and Fixed Action Patterns in Humans Symbolic triggers can override reason, driving extreme behaviors from eating disorders to violence. A better understanding of Amplified Symbolic Releasers can help prevent harm. Symbolic triggers can override reason, driving extreme behaviors from eating disorders to violence. A better understanding of Amplified Symbolic Releasers can help prevent harm. Computer Models of How Ideas Evolve and How We Became Creative A million years ago, when everything we encountered was shaped solely by forces of nature, something that began as a spark of insight in someone’s mind would have seemed miraculous. A million years ago, when everything we encountered was shaped solely by forces of nature, something that began as a spark of insight in someone’s mind would have seemed miraculous. The Surgeon General's Report Does Not Show Alcohol Causes Cancer The Surgeon General warns us that even moderate alcohol consumption causes several cancers. However, the causal case lacks rigor. The Surgeon General warns us that even moderate alcohol consumption causes several cancers. However, the causal case lacks rigor. My Stress-Induced, Life-Threatening Wake-Up Call Personal Perspective: I recently had a life-threatening pulmonary embolism that was impacted by chronic stress. Don't let yourself end up like this, too. Personal Perspective: I recently had a life-threatening pulmonary embolism that was impacted by chronic stress. Don't let yourself end up like this, too. Imprinted for Violence? How Biology and Beliefs Mold Killers Humans are biologically programmed for violence. Lorenz’s ethology reveals how imprinting, instincts, and group aggression shape radicalization, school shooters, and terrorists. Humans are biologically programmed for violence. Lorenz’s ethology reveals how imprinting, instincts, and group aggression shape radicalization, school shooters, and terrorists. 1 2 Next'''
