["https://psychologytoday.com/us/basics/therapy"]
title = "Therapy | Psychology Today"
description = 'Psychotherapy, also called talk therapy or usually just "therapy," is a form of treatment aimed at relieving emotional distress and mental health problems. Provided by any of a variety of trained professionals—psychiatrists, psychologists, social workers, or licensed counselors—it involves examining and gaining insight into life choices and difficulties faced by individuals, couples, or families. Therapy sessions refer to structured meetings between a licensed provider and a client with a goal of improving some aspect of their life.'
full_description = '''What Is Therapy? Reviewed by Psychology Today Staff Psychotherapy, also called talk therapy or usually just "therapy," is a form of treatment aimed at relieving emotional distress and mental health problems. Provided by any of a variety of trained professionals—psychiatrists, psychologists, social workers, or licensed counselors—it involves examining and gaining insight into life choices and difficulties faced by individuals, couples, or families. Therapy sessions refer to structured meetings between a licensed provider and a client with a goal of improving some aspect of their life. Psychotherapy encompasses many types of treatment and is practiced by a range of clinicians using a variety of strategies. The critical aspect is that the client or patient works collaboratively with the therapist and can identify improvement and positive change over time. Most therapies in wide use have been well-tested and deemed effective. Though it may at first feel difficult to seek out therapy—especially for those of low-income or without comprehensive insurance—the benefits of successful therapy are literally life-changing. On This Page Should I go to therapy? What’s the first step in looking for a therapist? Can I help a loved one find a therapist? What type of therapy is right for me? Will I be able to afford therapy? What happens in the first session of therapy? Will I receive medication if I go to therapy? What are the red flags of an unqualified or unethical therapist? When does therapy end? Should I go to therapy? Most people, regardless of their specific challenges, can benefit from having an impartial observer listen and offer guidance. Because of therapy’s cost and time investment, however—as well as lingering stigma surrounding mental health—the decision to begin therapy isn’t always an easy one. To determine whether therapy is the right choice for a particular individual, they should consider whether they feel sad, anxious, overwhelmed, or irritable more often than not; if yes, therapy would likely offer emotional support and help them develop the tools to manage their mental health. But strong negative emotions aren’t the only reason someone should seek therapy. If they are struggling with relationship challenges, feel stuck in their career, find themselves turning to drugs, alcohol, or food to cope with unpleasant events, or feel disconnected from the people around them, they may find therapy to be immensely helpful. For more on the choice to start seeing a therapist, visit The Decision to Begin Therapy. article continues after advertisement if (!window.ptAdSlots || window.ptAdSlots.length === 0) { window.ptAdSlots = []; } window.ptAdSlots.push('div-gpt-ad-1404853927369-9') What’s the first step in looking for a therapist? There are countless compassionate and effective therapists in the world—but not every single therapist is the best person to help every individual seeking treatment. Though it can be frustrating for patients and professionals alike, finding the right therapist is usually a process of trial and error. While the prospect of searching for a therapist can indeed be daunting, several online tools can make the process significantly easier. Using online directories (such as the Psychology Today Therapy Directory), search engines, or their insurance company’s online list of covered providers, prospective clients can locate therapists (either in their area or who are licensed to provide online therapy) who take their insurance and who strike them as a potential good fit based on modality, gender, or the most common issues treated. From there, clients should contact a few potential candidates and take steps toward setting up their first appointment. For more on locating and choosing the best therapist, visit How to Find a Therapist. Can I help a loved one find a therapist? Watching a loved one struggle with mental health challenges can be painful and trigger feelings of helplessness. But while the choice to pursue therapy will be, in a large number of cases, solely up to the individual, it is possible for concerned others to offer emotional support as well as concrete assistance. This can mean connecting them with educational resources about therapy, helping them identify potential clinicians in their area, setting up appointments, or providing transportation to their first session. For more on facilitating the process for a loved one, visit Finding Help for Others. What type of therapy is right for me? Many types of therapy have been shown to be effective at treating common mental health challenges, and determining which approach is “best” for a particular person often comes down to their particular concerns, the alliance they’re able to form with their therapist, and their personal preferences. Clients who are coming to therapy with specific mental health concerns—such as obsessive compulsive disorder or post-traumatic stress—may benefit most from a clinician who specializes in the area or who employs a type of therapy specifically designed to treat it. Those seeking help with relationship or family problems may benefit from marriage and family therapy, couples therapy or couples counseling. Those seeking a potentially more affordable type of therapy, or for whom it could be beneficial to attend therapy with others who have similar experiences, may wish to consider group counseling or group therapy. To learn more about different types of therapy, visit Therapy Types and Modalities. Will I be able to afford therapy? The cost of therapy, and whether it can fit into a client’s budget, will likely depend on a few factors, including the individual’s insurance coverage, their location, and their income. While some therapists charge a set fee per session, others offer a sliding scale based on clients’ income. In many locations, low- or no-cost therapy is available for low-income clients, often through universities or other therapist training programs. Prospective clients should verify their insurance coverage, along with the therapist’s fee structure, before setting up an appointment. To learn more about the finances of therapy, visit Cost and Insurance Coverage. What happens in the first session of therapy? The first session of therapy can be anxiety-provoking, and it’s normal to feel nervous or unsure of what to expect. Luckily, most patients will find that the first session of therapy follows a predictable format. Most therapists spend the first session asking general questions to get a sense of the client’s background, their past experience with therapy, and what issues they’re hoping to address. Clients may wonder what they can and should bring to the table in terms of discussion, and the fact is that few, if any, topics are off limits. They will also likely discuss their own modality or style and offer an outline of what the client can expect. If a client has questions about privacy and confidentiality, those concerns should be raised and addressed. Logistical details, such as verifying insurance coverage and setting up a payment schedule, may happen in the first session as well. To learn more about what to expect when starting therapy, visit Your First Therapy Session. Will I receive medication if I go to therapy? Medication is often used in conjunction with psychotherapy—particularly for cases of severe depression, anxiety, or bipolar disorder—but it’s not a given for every client. If a therapist thinks a particular client could benefit from medication, he or she will discuss it with the client before referring him or her to a prescribing professional such as a psychiatrist or nurse practitioner. While the client will likely need to attend periodic meetings with the prescribing professional to discuss any side effects and dosage adjustments, they will also continue to see the therapist to build coping skills and strategies to further support their mental health. For more about the use of medication, visit Medication and Therapy. What are the red flags of an unqualified or unethical therapist? Even the best therapists aren’t perfect, and it’s possible for effective, ethical therapists to make mistakes or inadvertently upset a client. But there are some therapists, unfortunately, who are not suited to the profession. Common warning signs of an ineffective therapist include talking too much—to the point where the client feels unable to talk about their own concerns—or sharing inappropriate details about their own personal life. Therapists who are judgmental or condescending to the client are also likely not good fits, as are therapists who frequently appear bored or distracted. Unethical therapists are much rarer than unqualified or ineffective ones, but they certainly exist. An unethical clinician may make sexual or romantic overtures toward a client, threaten or blackmail them, or breach confidentiality agreements without just cause. Clients should report such therapists to their licensing board and end therapy as soon as possible. For more on therapeutic boundaries, visit Boundaries and Red Flags in Therapy. When does therapy end? Therapy typically ends when the client feels they have achieved their goals or when they feel they are no longer making progress; in some cases, logistical issues, such as changing insurance coverage, necessitate the end of therapy. Alternatively, it is possible for a therapist to determine that they are not the best practitioner to aid a particular client. When this occurs, the therapist will typically refer the client to another provider, where they can continue work if they so choose. For more on what to expect when terminating therapy, see Ending Therapy. Next: The Decision to Begin Therapy Essential Reads The 3 Most Harmful Parenting Styles, According to Research Want to raise happy and healthy kids? Steer clear of these three parenting styles at all costs. Why Hope Matters After Childhood Sexual Abuse Regardless of how hope is understood or expressed, it can be the key difference between hanging on and giving up. For a survivor of CSA, hope is essential in the healing process. Can Artificial Intelligence Add Value to Therapy? Can artificial intelligence bring something new to therapy? For those living with obsessive-compulsive disorder, it might. Treating Men Like Women A mental health system built for women alienates men and exacerbates their struggles. Recent Posts What Research Never Tells You Venezuelan immigrants fled violence with nothing but the hope for safety. These are some of their stories. Venezuelan immigrants fled violence with nothing but the hope for safety. These are some of their stories. 5 Ways to Make Your Marriage ‘Antifragile' Want to thrive through adversity with your spouse, as opposed to just surviving? Antifragility could be the answer. Want to thrive through adversity with your spouse, as opposed to just surviving? Antifragility could be the answer. How to Not Fight an Ocean: A DBT Skill We Can All Use Personal Perspective: Here's how to stop fighting reality by using the DBT skill of radical acceptance. Personal Perspective: Here's how to stop fighting reality by using the DBT skill of radical acceptance. 5 Ways to Protect Your Relationship With the '24-Hour Rule' Tired of constant conflict in your relationship? A time-out could be all you need. Tired of constant conflict in your relationship? A time-out could be all you need. Advice for More Accurate ADHD Diagnosis While ADHD is often misdiagnosed based on stereotypical ideas, there are two ADHD symptoms that can easily go undetected, rendering some to go undiagnosed. While ADHD is often misdiagnosed based on stereotypical ideas, there are two ADHD symptoms that can easily go undetected, rendering some to go undiagnosed. How to Say "I Think You Should Talk to a Therapist" It takes three steps, and you’ll leave the conversation feeling more connected than when you started. It takes three steps, and you’ll leave the conversation feeling more connected than when you started. What's Behind the Inaccessibility of Mental Health Services Despite laws to improve mental health insurance, there has been little improvement. Among the reasons is the reluctance of therapists to accept insurance fees and oversight. Despite laws to improve mental health insurance, there has been little improvement. Among the reasons is the reluctance of therapists to accept insurance fees and oversight. For Success in Therapy, Focus on Persistence, Not Resistance Choosing to start psychotherapy takes courage and persistence. Identifying resistance to the therapuetic process goes a long way in promoting healing. Choosing to start psychotherapy takes courage and persistence. Identifying resistance to the therapuetic process goes a long way in promoting healing. Strengthening Your Relationship While Navigating Parenthood Many couples struggle after having a baby—but it doesn’t have to be that way. Learn how to stay connected, communicate better, and keep your relationship strong through parenthood. Many couples struggle after having a baby—but it doesn’t have to be that way. Learn how to stay connected, communicate better, and keep your relationship strong through parenthood. 2 Ways for Couples to Work Through "Retroactive Jealousy" Is your romantic past hindering your chances of building a loving future? Here's how you and your partner can overcome it together. Is your romantic past hindering your chances of building a loving future? Here's how you and your partner can overcome it together. 1 2 Next'''
