title = "Nostalgia | Psychology Today"
description = "Nostalgia is a longing and affection for the past. This can encompass positive emotions such as happiness as well as other emotions and recollections, such as tenderness and longing. We have the feeling of nostalgia when we yearn for simpler times, for example, when we were children."
full_description = '''Nostalgia Reviewed by Psychology Today Staff Nostalgia is a longing and affection for the past. This can encompass positive emotions such as happiness as well as other emotions and recollections, such as tenderness and longing. We have the feeling of nostalgia when we yearn for simpler times, for example, when we were children. Johannes Hofer, a Swiss physician, coined the term in 1688; at that time, longing for the past and homeland was deemed an illness. Thinking about yesteryear can be filled with regret and bittersweet remembrances, and for people who are prone to rumination and depression, nostalgia can sometimes foster a negative state of mind. Nostalgia, however, is now generally regarded in a positive light. It’s self-reflection that connects us to fond memories and and can help build a coherent sense of identity. Contents The Emotional Comfort of Nostalgia How Nostalgia Helps Shape Us The Emotional Comfort of Nostalgia Through nostalgia, we can escape to a time when life felt more secure, or a time of positive experiences or events. When we feel uncertain or stressed, thinking back nostalgically can give us emotional comfort. Film, TV, and advertising campaigns deploy the use of nostalgia to great effect. Is nostalgia based on selective memory? Created with Sketch. People engaging in nostalgia do focus more on selective memories, recalling positive past events and experiences rather than negative and difficult ones. This perspective of time lets us downplay or even forget the hard times we have endured. How do autobiographical memories relate to nostalgia? Created with Sketch. We often rely on our autobiographical memories, which can be emotionally charged depending on the events that happened. We may also reform our memories into an idealized version of the event; in effect, we focus on the positives and minimize the negatives. Can nostalgia help regulate how we feel? Created with Sketch. Nostalgia can help a person regulate their emotions. The discomfort of stress, anxiety, or loneliness can be alleviated when we think about the past with positivity and affection; the feeling of nostalgia can help us feel comfort and stability. Can nostalgia be a coping mechanism? Created with Sketch. In the face of an obstacle or challenging moment, we can dip into nostalgia as a coping mechanism. Reflecting on a happy, joyful event or experience can give us comfort and support while working through a present difficulty. For example, dipping into nostalgia can help us get through a difficult event such as the death of a loved one. What is the reminiscence bump? Created with Sketch. The reminiscence bump refers to having an increased number of autobiographical memories from adolescence and early adulthood (the bump) relative to other periods of life. There are several possible reasons why this period of life stays with people, including the emerging importance of social relationships to adolescents and the concentration of personally significant milestones at around this time. What is the peak-end rule? Created with Sketch. The peak-end rule is a concept that helps explain why people remember personal experiences as being more or less positive or negative than they might have rated the event when it actually occurred. These retrospective evaluations are especially influenced by the peak moments of the experience—the high point in positive or negative emotional intensity—as well as the emotional experience at its end. What is solastalgia? Created with Sketch. Solastalgia is a term coined in 2003 by Australian philosopher Glenn Albrecht to capture the longing for one's immediate surroundings or homeland as it once existed, prior to environmental change. It is a portmanteau of the words "solace" and "nostalgia." Solastalgia can be evoked by man-made change or by natural disasters such as wildfires that destroy a town or region. It implies a longing for a physical place that has been irrevocably altered. article continues after advertisement if (!window.ptAdSlots || window.ptAdSlots.length === 0) { window.ptAdSlots = []; } window.ptAdSlots.push('div-gpt-ad-1404853927369-9') How Nostalgia Helps Shape Us By dipping into nostalgia, we can develop a narrative of who we are. We are connected to our past and feel a sense of continuity through nostalgia. This identity-shaping can also apply to a collective group, such as friends and family. Does collective nostalgia bring people together? Created with Sketch. A shared history can bring a group of people together, giving them a sense of meaning and connection. Nostalgia fosters social bonding and commonality. These can be events of the past remembered by members of a particular group—say, a shared ethnic group—which may differ from how the events are remembered by people in other groups. Collective memory may also be used to describe the remembering that happens within a smaller group, such as when members of a family discuss a shared experience or when people work together to help each other remember factual information, sometimes called collaborative recall. Can a person get stuck in nostalgia? Created with Sketch. Nostalgia is, for the most part, positive and helpful. However, being obsessed with the past can lead to maladaptive behavior; for instance, not being able to move forward with future plans or foregoing the present day while lingering on a long gone past. Can therapy help if I feel stuck in nostalgia? Created with Sketch. Being stuck in the past can bring on rumination, loneliness, isolation, and even depression; seeking guidance from a mental health professional can help address difficult emotions. Essential Reads A Fantastic Year or Just 365 Disappointments? In between nostalgia and New Year’s resolutions, reflecting on the past to identify a "Groundhog Year" of our life can provide valuable insights for present and future challenges. How Fans Can Cope With Loss Fans of One Direction are grieving the loss of Liam Payne. Parasocial loss can be confusing, but staying connected with other fans, creating rituals and indulging in nostalgia help Does Nostalgia Change Our Attitudes Toward AI? New research suggests that nostalgia influences our attitudes toward innovative technology like AI. The Profound Benefits of Mental Time Travel Findings on retrospection, prospection, and coherence. Is Being Materialistic Actually a Bad Thing? Personal Perspective: Materialism isn't a bad thing if objects bring you joy, such as through collecting, but it's important to consider moderation and other variables in context. Personal Perspective: Materialism isn't a bad thing if objects bring you joy, such as through collecting, but it's important to consider moderation and other variables in context. Should You Go to Your School Reunion? Are you struggling with the clash between "Should I stay?" and "Should I go?" to your school reunion? Here are 10 concerns that may be holding you back and how to get past each. Are you struggling with the clash between "Should I stay?" and "Should I go?" to your school reunion? Here are 10 concerns that may be holding you back and how to get past each. Savoring the Past: Why Memories Outshine Real-Time Joy Ever look back on a vacation and wonder why you enjoyed it more in hindsight than when you were there? Ever look back on a vacation and wonder why you enjoyed it more in hindsight than when you were there? The Most Nostalgic Time of the Year Nostalgia allows us to recall and draw strength from the past in order to move forward. Nostalgia allows us to recall and draw strength from the past in order to move forward. Emotional Time Travel Do you time travel to the past when present life is stressful or lonely? In looking back, you can find clues to positive changes in the present and new possibilities. Do you time travel to the past when present life is stressful or lonely? In looking back, you can find clues to positive changes in the present and new possibilities. Ethnic Americans and Thanksgiving Traditions: Everybody Eat! Cooking both turkey and lasagna for Thanksgiving was like being bilingual, but in culinary terms. My grandma got a turkey the size of a Buick to prove she was a naturalized citizen. Cooking both turkey and lasagna for Thanksgiving was like being bilingual, but in culinary terms. My grandma got a turkey the size of a Buick to prove she was a naturalized citizen. Navigating Holiday Stress in a Virtual Workplace Explore strategies for managing holiday stress, prioritizing self-care, and maintaining emotional well-being while balancing remote work and personal responsibilities. Explore strategies for managing holiday stress, prioritizing self-care, and maintaining emotional well-being while balancing remote work and personal responsibilities. Why Decorating Early for Christmas May Make You Happier A boost in meaning and social connection, among other things. A boost in meaning and social connection, among other things. The Hold of the Old “We cannot become what we want by remaining what we are.” -Max Dupree “We cannot become what we want by remaining what we are.” -Max Dupree Why Nostalgia Strongly Shapes Us and Our Politics Many people look backwards, wanting to re-create an idealized past, but such nostalgia can distort history and cause harm. Many people look backwards, wanting to re-create an idealized past, but such nostalgia can distort history and cause harm. 1 2 Next'''
