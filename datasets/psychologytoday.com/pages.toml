["https://psychologytoday.com/us/basics/chronic-pain"]
title = "Chronic Pain | Psychology Today"
description = "When someone touches a hot stove and burns their fingers, a little pain is normal. In fact, it’s a healthy reaction to a threat in the environment, warning that person to change their behavior immediately. But sometimes the pain lingers long after the danger has passed, becoming chronic."
full_description = '''Chronic Pain Fibromyalgia Reviewed by Psychology Today Staff When someone touches a hot stove and burns their fingers, a little pain is normal. In fact, it’s a healthy reaction to a threat in the environment, warning that person to change their behavior immediately. But sometimes the pain lingers long after the danger has passed, becoming chronic. Chronic pain in the form of headaches, joint problems, or full-blown fibromyalgia can radically impact one's life. For many people, there is no end in sight to the pain; it may even derail employment and relationships. Some 100 million Americans suffer from some form of chronic pain. It can be influenced by many factors, including emotion and memory. Contents Causes and Symptoms How to Manage Causes and Symptoms of Chronic Pain When an injury occurs, pain sensors light up, sending messages via an electrical signal to the brain. Normal pain—as in a minor headache—can be relieved by a few aspirins or the passage of time. But chronic pain is something different; the brain continues to receive pain signals long after the original injury or onset of pain. What are the symptoms of chronic pain? Created with Sketch. Pain from a chronic condition can range from a dull ache to throbbing agony. Other symptoms may include exhaustion, daytime fatigue, poor sleep, or mood swings. Sometimes the pain is severe enough to interfere with day-to-day functioning and enjoyment. Chronic pain can also lead to cognitive problems and, in some cases, depression. How long does chronic pain last? Created with Sketch. Generally, any pain that lasts three months or longer is considered chronic. For those who are lucky, it will end within months, but for others, chronic pain can go on indefinitely. Who is most at risk for developing chronic pain? Created with Sketch. While anyone can suffer from chronic pain, people are more susceptible if they are female, over 65 years old, overweight, depressed, or have a history of smoking. Having surgery can also increase a person’s chances of getting chronic pain. article continues after advertisement if (!window.ptAdSlots || window.ptAdSlots.length === 0) { window.ptAdSlots = []; } window.ptAdSlots.push('div-gpt-ad-1404853927369-9') How to Manage Chronic Pain Pain was traditionally treated primarily as a physical problem. Patients were given medication, physical therapy, or, in extreme cases, surgery. While these methods helped some people, others experienced moderate to severe negative consequences, including surgical complications and addiction to pain medication and opioids. Today, experts understand that pain can be addressed on the psychological and social levels as well. Though every individual's pain is different and may respond to different interventions, there are certain strategies that can help manage the symptoms of chronic pain. Is pain all in a person’s head? Created with Sketch. Historically, pain was considered a physical sensation felt somewhere in the body. Research has shown that pain activates some of the same areas of the brain that handle emotions, such as the limbic system. This means that pain may be caused or exacerbated by biological, psychological, or social factors, which opens up more avenues for effective treatment. What are the major treatments for chronic pain? Created with Sketch. Breathing and meditation practices can help reduce symptoms of stress that may be exacerbating pain. To further manage pain, it may be best to not smoke and to limit alcohol. Practicing good sleep hygiene, getting adequate exercise, and eating healthfully can have beneficial effects as well, as can exercising self-compassion. How does chronic pain affect mental health? Created with Sketch. Chronic pain can contribute to the development of mental health problems, such as depression and anxiety. Chronic pain sufferers who are struggling with such challenges can benefit from seeing a therapist; there are even clinicians who specialize in treating the negative emotions triggered by chronic pain. Essential Reads Chronic Pain Can Exist Without Physical Injury Chronic pain can develop when the brain continues to send out pain messages even after an injury has healed. When this occurs, the treatment must be focused on the nervous system. How Unwanted Thoughts Drive the Experience of Pain There is no escape from mental pain. It's necessary to learn techniques that soften the body's physiologic response to threats. "Medical" Marijuana and Chronic Pain Most states allow some form of "medical marijuana." It is especially popular with pain patients, many of whom do not have medical access to opioids. Treating Pain—Avoiding the Brain A new class of non-opioid drugs treats pain by blocking signals before they reach the brain, reducing the risk of addiction. How to Not Fight an Ocean: A DBT Skill We Can All Use Personal Perspective: Here's how to stop fighting reality by using the DBT skill of radical acceptance. Personal Perspective: Here's how to stop fighting reality by using the DBT skill of radical acceptance. Redefining Friendship: How to Know If It's Worth Preserving a Friendship A Personal Perspective: When you need your friends, are they there for you? Are you there for them? A Personal Perspective: When you need your friends, are they there for you? Are you there for them? Why We Hide Chronic Illness People who live with chronic illness often experience a tension between wanting to hide their illness and being fully known. Learn more about how to work with this conflict. People who live with chronic illness often experience a tension between wanting to hide their illness and being fully known. Learn more about how to work with this conflict. It's Time to Re-evaluate Envy When study participants read texts about successful fictional characters and described whether they felt envy or admiration, those who experienced envy recorded more details. When study participants read texts about successful fictional characters and described whether they felt envy or admiration, those who experienced envy recorded more details. Grading the Progress of National Initiatives on the Opioid Crisis Two leading drug experts set out a road map to reverse the opioid epidemic in 2016. This is how we've progressed since then. Two leading drug experts set out a road map to reverse the opioid epidemic in 2016. This is how we've progressed since then. Pain: What Is It Good For? What can we gain from listening to our pain? What can we gain from listening to our pain? Hypnotherapy Can Help With What Now? People mainly think of hypnotherapy as an aid in smoking cessation and weight control. But there is so much more to it than that. People mainly think of hypnotherapy as an aid in smoking cessation and weight control. But there is so much more to it than that. How to Cope With "Brain Fog" When You're Sick or in Pain Personal Perspective: Chronic pain and illness are often accompanied by cognitive difficulties known as “brain fog,” characterized by an inability to focus or remember things. Personal Perspective: Chronic pain and illness are often accompanied by cognitive difficulties known as “brain fog,” characterized by an inability to focus or remember things. How Stress Affects Migraines We do everything we can to avoid stress, to minimize it, to push it down. But did you know that, for migraine, a day of low stress can be bad too? We do everything we can to avoid stress, to minimize it, to push it down. But did you know that, for migraine, a day of low stress can be bad too? Mangione Tragedy: Pain, Isolation, and the Survival Response Luigi Mangione's murder of the CEO of UnitedHealthcare is unacceptable but understandable in light of what happens to the brain when people feel trapped by pain and circumstances. Luigi Mangione's murder of the CEO of UnitedHealthcare is unacceptable but understandable in light of what happens to the brain when people feel trapped by pain and circumstances. 1 2 Next'''
