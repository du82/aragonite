["https://psychologytoday.com/us/basics/appetite"]
title = "Appetite | Psychology Today"
description = "If only nourishment were a simple process: Get hungry, eat, get full, stop eating. In reality, an array of biochemicals sending signals between the brain and the body control both hunger and appetite, and the difference between the two is complex."
full_description = "Appetite Hunger, Satiety Reviewed by Psychology Today Staff If only nourishment were a simple process: Get hungry, eat, get full, stop eating. In reality, an array of biochemicals sending signals between the brain and the body control both hunger and appetite, and the difference between the two is complex. Hunger denotes a physical need for food; appetite is a desire for food—and it can be difficult to distinguish between the two. Appetite can be influenced by physical conditions such as blood sugar levels, hormones, and exercise. It can also be driven by mood and emotions. Stress, loneliness, and boredom can trigger eating and drive an individual to the choice of fatty, sugary, or salty foods instead of healthier, more nutritious options. Emotional eating can also override signals of fullness, which can lead to overeating and result in weight problems if the behavior becomes routine. No one should ignore the body’s cravings, but it is wise to be mindful about what may be driving a desire for food. Contents What Creates Appetite? Appetite Loss Overeating and Emotional Eating What Creates Appetite? It may seem like the stomach is the arbiter of hunger, but the brain is calling the shots. It is important to remember that humans evolved under conditions of food scarcity, and that such scarcity prevailed for most of human history. Maintaining a body weight that allows not just for everyday functioning but for reproduction of the species, then, has not been left to chance: Many hormones and neurochemicals help regulate appetite and influence weight. Researchers believe the hormone ghrelin plays a central role in stimulating hunger. Ghrelin is produced in the stomach, and an empty stomach prompts the hormone to be released into the bloodstream and travel to the brain, where it activates nerve cells that increase appetite. Once eating begins, the stomach expands, curbing the release of ghrelin and diminishing a person's appetite. Which factors contribute to appetite? Created with Sketch. People are driven to eat for many reasons besides hunger. Social cues can subtly raise appetite, because people tend to eat more during a meal with friends or family than during a meal by themselves. Cultural norms, such as finishing what’s on the plate, and sensory cues, such as the smell of warm chocolate cake can also influence appetite and the amount of food people consume. Does sleep influence appetite and weight? Created with Sketch. Sleep habits can influence the hormones that control appetite, potentially leading to weight gain. Levels of the hormone ghrelin increase with poor sleep, producing greater feelings of hunger. And the hormone leptin decreases, which requires more food for a person to feel full. Additionally, sleep disruptions can alter how food is metabolized, and lead to less exercise and general movement the next day. What leads appetite to increase? Created with Sketch. A sudden desire to eat more could be due to physical conditions such as diabetes, hyperthyroidism, hypoglycemia, Grave’s disease, premenstrual syndrome, and side effects of some medications. In terms of mental health, stress, anxiety, and depression can lead to different eating patterns including increased appetite. How has evolution affected appetite? Created with Sketch. For most of human evolutionary history, calories were scarce and uncertain. So even today, we want to store as much energy as possible. That mindset hinders appetite in several ways. Our instincts tell us to keep eating well beyond when we are sated. Worse, the foods we crave—calorie-dense fats and sugars—were once rare and valued as a bulwark against starvation; now they're plentiful and harmful in excess. And we don't crave plants, precisely because they were more abundant in our past. article continues after advertisement if (!window.ptAdSlots || window.ptAdSlots.length === 0) { window.ptAdSlots = []; } window.ptAdSlots.push('div-gpt-ad-1404853927369-9') Appetite Loss Although people may experience natural fluctuations in their appetite from time to time, sudden or severe appetite loss can be a harbinger of physical and mental health challenges. Addressing and treating the underlying condition is key to regaining a healthy appetite. Which mental health conditions are linked to appetite loss? Created with Sketch. Diminished appetite may be indicative of stress, anxiety, depression, or grief. In these situations, distress can become all-consuming, eliminating the desire to eat and preventing such basic tasks as preparing a meal. Physical manifestations of stress can also contribute to appetite loss; for example, nausea and headaches can interfere with the cues that direct appetite. Depression can both fuel and be fueled by food as well. When people don’t eat due to concerns around weight and body image, it may be due to an eating disorder rather than appetite loss. (For more, see Eating Disorders.) Appetite loss can also be a side effect of medications for mental health conditions, such as Adderall or Ritalin for ADHD and Prozac for depression. Is appetite loss a sign of depression? Created with Sketch. It can be, yes. One of the symptoms of depression is a consistent decrease in appetite or significant weight loss when not dieting. People who are depressed often lose interest and pleasure in eating, similar to the absence of motivation overall. Additionally, some believe that the condition may blunt physiological taste sensitivity, another pathway for appetite loss in depression. (However, the opposite relationship can also occur—significant weight gain can be a symptom of depression.) Which physical conditions can result in appetite loss? Created with Sketch. A cold, flu, or stomach bug • Irritable Bowel Syndrome or Crohn's disease • Diabetes • Hypothyroidism • Anemia • Aging • Pregnancy • Cancer Why do people lose their appetite when they’re sick? Created with Sketch. Illnesses can strip people of the desire to eat, because immune cells release proteins called cytokines that suppress appetite and encourage rest. The body can then marshall all of its resources to fight off the infection. Overeating and Emotional Eating Emotions can have a powerful influence on our food choices. Consuming food for the purpose of regulating emotions, rather than to satisfy hunger, is called emotional eating or stress eating. It can be evoked by stress, depression, sadness, shame, anger, loneliness, and boredom. Many people struggle with emotional eating at some point, but research suggests that therapies such as Acceptance and Commitment Therapy, Cognitive Behavioral Therapy, and Dialectical Behavior Therapy can help people overcome patterns of emotional eating. Why do I stress eat? Created with Sketch. Stress levels are central to emotional eating. Other components of motivation and self-regulation may be involved as well, including restrained eating (restricting and monitoring food intake, which can lead to constant thoughts of food), impulsivity (not considering the consequences of unhealthy food consumption), reward sensitivity (how responsive one is to the mood-lifting properties of comfort food), and cognitive reappraisal (how one evaluates an emotion-inducing situation). How do I stop emotional eating? Created with Sketch. Developing coping skills to manage the stress that induces emotional eating is key to changing the habit. That can be accomplished by learning skills around time management, problem solving, conflict resolution, mindfulness, and cognitive behavioral therapy. People can also take action by anticipating situations that might lead to challenging food choices, such as by not going grocery shopping when they’re hungry and or buying foods they know will be hard to resist, for example. Can someone be addicted to food? Created with Sketch. Compulsive overeating is called Binge-Eating Disorder. Binges involve eating an abnormally large amount of food in a contained time period, accompanied by feeling a lack of control over eating during the binge, according to the DSM-5. Binges may involve eating abnormally fast, eating until uncomfortably full, and feelings of shame and distress. Binges tend to occur once a week for at least three months to receive a diagnosis. Essential Reads Ever Wonder Why You Can Always Find Room for Dessert? A novel brain circuit that drives craving for sweets after meals, explaining why we always have room for dessert. Blocking it may help reduce sugar intake and overeating. Craving Sugar Linked to Gut Bacteria A new study finds that craving sugar is driven by a deficiency in a gut microbe that releases a substance that acts much like the drug Ozempic to lower blood sugar and appetite. Why Is Losing Weight So Difficult? Losing weight is difficult, but keeping it off can be harder. Have you ever wondered why? Memory in fat cells may contribute to this yo-yo effect. The Link between Emotional Eating and Early Trauma Using food to cope with negative emotions is common in those who experience trauma in childhood. Showing compassion for yourself and your body can help break the cycle Should You Go Vegan This Veganuary? Going vegan for a month might be a powerful tool to show you which of your food habits still work for you, and which ones are due for a change. Going vegan for a month might be a powerful tool to show you which of your food habits still work for you, and which ones are due for a change. The Mindful Eating Hack You Won't Find in a Monastery Holiday overeating can produce feelings of self-loathing and guilt. But if you know how to use the power of your imagination, those meals can be joyful and stress-free. Holiday overeating can produce feelings of self-loathing and guilt. But if you know how to use the power of your imagination, those meals can be joyful and stress-free. The Challenge of Holiday and Social Eating How we handle eating in social situations is not just a matter of following advice. Here’s what can really make a difference. How we handle eating in social situations is not just a matter of following advice. Here’s what can really make a difference. Stop Emotional and Stress Eating in Just Three Bites Did you know that over 30 percent of stressed-out persons resort to overeating to manage their feelings? Instead of eating three donuts when you're stressed, how about three bites? Did you know that over 30 percent of stressed-out persons resort to overeating to manage their feelings? Instead of eating three donuts when you're stressed, how about three bites? Are the Snack Foods You’re Eating Making You Depressed? Eating ultra-processed snack foods might make depression worse. There are better ways to lift your mood without eating. Eating ultra-processed snack foods might make depression worse. There are better ways to lift your mood without eating. Fast Food Is Fatal for French Youth Sedentary youngsters are vulnerable to fast-food as the French are discovering, Sedentary youngsters are vulnerable to fast-food as the French are discovering, Semaglutide and Empty Promises of Change Could the promise of a wonder drug stop us from tackling the behavioral and environmental drivers of the obesity crisis? Could the promise of a wonder drug stop us from tackling the behavioral and environmental drivers of the obesity crisis? Do This One Thing to Have More Control Over Food Emotional eating might help in the moment--but doesn't make you feel better for very long. There's a better way to manage eating and get in touch with your hunger. Emotional eating might help in the moment--but doesn't make you feel better for very long. There's a better way to manage eating and get in touch with your hunger. Love Made to Order: How Food Flavor Fuels Attraction Looking for the perfect date food? Learn how flavor impacts attraction. Looking for the perfect date food? Learn how flavor impacts attraction. Food for Thought: Exploring Cravings and Compulsions Sugar plus ultra-processed foods can act similarly to drugs in changing brains and behavior. Sugar plus ultra-processed foods can act similarly to drugs in changing brains and behavior. 1 2 Next"
