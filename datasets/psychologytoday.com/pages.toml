title = "Aphantasia | Psychology Today"
description = "Aphantasia is the inability to form mental images; a person without a mind’s eye cannot imagine the scene of a sandy beach, for example. They cannot visualize people, places, objects, or other images. This is not a clinical disorder or disability, it is considered a neurological characteristic. People with aphantasia have a different way of perceiving and processing images."
full_description = '''Aphantasia Reviewed by Psychology Today Staff Aphantasia is the inability to form mental images; a person without a mind’s eye cannot imagine the scene of a sandy beach, for example. They cannot visualize people, places, objects, or other images. This is not a clinical disorder or disability, it is considered a neurological characteristic. People with aphantasia have a different way of perceiving and processing images. Many individuals do not know that they have aphantasia, but approximately 1 to 4 percent of the population is estimated to experience this phenomenon. The condition was first documented in the late 1800s. Much later, in 2015, Adam Zeman, a professor at the University of Exeter in the United Kingdom who specializes in cognitive and behavioral neurology, described this phenomenon. According to his research, people without mental imagery compensate by relying on their verbal ability as well as conceptual thought. People with aphantasia develop alternative strategies to remember things, problem-solve, and think creatively. Aphantasia as a Spectrum People with aphantasia often do not even realize that they have it until their teenage or young adult years. A person with this feature would be hard-pressed to consider what mental imagery means: you cannot see what you cannot see, so to speak. There are also different degrees of aphantasia, some people have no mental imagery whatsoever, and others may visualize an image that is dim, vague, or fuzzy. Aphantasics may not be put off by descriptions of things that are visually disgusting or scary. Because it exists on a spectrum, some can visualize a mental image when they open their eyes. Does aphantasia develop because of a person’s brain structure? Created with Sketch. Differences in brain structure may be involved, especially in brain regions used for mental visualization. In some individuals, the visual cortex may be less active or developed. Is aphantasia genetic? Created with Sketch. This phenomenon can run in families; a person with aphantasia is more likely than a person without aphantasia to have a family member with the characteristic. Genetics may influence certain brain regions that are involved in mental imagery. Does aphantasia affect memory? Created with Sketch. Not being able to visualize a past event or something that happened may make it harder for a person to remember the event. They may remember certain aspects of what transpired, but not a mental image of it. Aphantasics may have poor episodic memory, a conscious memory of a previous experience. Is there a link between aphantasia and autism? Created with Sketch. People within the autism spectrum may also experience aphantasia. And while aphantasia and autism may co-occur, the former does not involve the challenges associated with autism. Can aphantasia be a result of injuries or other physical conditions? Created with Sketch. Developing aphantasia is relatively rare. However, damage to certain parts of the brain, such as the occipital lobe, may cause this phenomenon. A stroke, concussion, or other brain injury could cause aphantasia. Do people with aphantasia have vivid dreams? Created with Sketch. Some people with aphantasia can have mental images during dreaming, however, they may not be as vivid or frequent. Researchers are not sure why the ability to experience imagery during dreams is conserved, but it may involve the ability to visualize involuntarily, which occurs during dreaming, as opposed to consciously summoning mental imagery to mind. What is hyperaphantasia? Created with Sketch. This is the opposite of aphantasia, wherein an individual can vividly see mental imagery as if it were right before them. Some 3 percent of people have hyperaphantasia. Can a person be tested for aphantasia? Created with Sketch. Health professionals may use imaging scans for testing, these may include computed tomography, magnetic resonance imaging, or electroencephalograms. There are also surveys to gauge mental imagery including the vividness of visual imagery questionnaire. Can you treat aphantasia? Created with Sketch. There is no reason to treat this phenomenon; it is a cognitive variation in how one’s mental world is experienced. However, if aphantasia develops because of a health condition or brain injury, for example, the underlying cause should be addressed. article continues after advertisement if (!window.ptAdSlots || window.ptAdSlots.length === 0) { window.ptAdSlots = []; } window.ptAdSlots.push('div-gpt-ad-1404853927369-9') Essential Reads Some People Say They Don't Have Sexual Fantasies A small percentage of adults claim to have never had a sexual fantasy before. Some of them may have aphantasia, or an inability to conjure mental imagery, sexual or otherwise. What Imageless Minds Tell Us About Consciousness More signs that every human mind is absolutely unique. When Your Mind's Eye Is Blind Are you able to imagine things in your mind's eye? If not, you may have an interesting condition. Is Aphantasia a Memory Disorder? New research suggests that aphantasia might be a disorder of the episodic memory system. Can Your Imagination Be Measured? Most research on mental imagery relies on self-report measures. A new study presents a novel way of measuring the vividness of mental imagery by using an priming-adaptation task. Most research on mental imagery relies on self-report measures. A new study presents a novel way of measuring the vividness of mental imagery by using an priming-adaptation task. What Form Do Our Thoughts Take? Don't assume everyone else's thoughts are the same as yours. Don't assume everyone else's thoughts are the same as yours. Can You Train Your Brain to Imagine Better? Research reveals imagery training can enhance peak performance for athletes with low imagery skills or aphantasia through targeted exercises. Research reveals imagery training can enhance peak performance for athletes with low imagery skills or aphantasia through targeted exercises. Mental Imagery: Going to the Movies in Your Head When someone is under a lot of pressure, the popular advice is to "be present" and "live in the moment," but perhaps there are advantages to doing the opposite. When someone is under a lot of pressure, the popular advice is to "be present" and "live in the moment," but perhaps there are advantages to doing the opposite. Aphantasia and the Science of Imagination Training Unveil the power of imagination for peak performance and motivation. Discover how mental imagery shapes success, even for those who struggle to imagine. Unveil the power of imagination for peak performance and motivation. Discover how mental imagery shapes success, even for those who struggle to imagine. Pupil Size May Reflect the Strength of Your Imagination Changes in pupil size reflect someone's ability to picture vivid mental images in their mind's eye using visual imagination, a new study finds. Changes in pupil size reflect someone's ability to picture vivid mental images in their mind's eye using visual imagination, a new study finds. If You Couldn’t Imagine Ghosts, Would They Still Be Scary? For people who have trouble creating mental images, reading a scary story is a walk in the park. For people who have trouble creating mental images, reading a scary story is a walk in the park.'''
