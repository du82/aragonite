["https://psychologytoday.com/us/basics/depression"]
title = "Depression | Psychology Today"
description = '"The grey drizzle of horror," author William Styron memorably called depression. The mood disorder may descend seemingly out of the blue, or it may come on the heels of a defeat or personal loss, producing persistent feelings of sadness, worthlessness, hopelessness, helplessness, pessimism, or guilt.'
full_description = '''What Is Depression? Reviewed by Psychology Today Staff "The grey drizzle of horror," author William Styron memorably called depression. The mood disorder may descend seemingly out of the blue, or it may come on the heels of a defeat or personal loss, producing persistent feelings of sadness, worthlessness, hopelessness, helplessness, pessimism, or guilt. Depression also interferes with concentration, motivation, and other aspects of everyday functioning. According to the World Health Organization, depression is the leading cause of disability worldwide. Globally, more than 300 million people of all ages suffer from the disorder. And the incidence of the disorder is increasing everywhere. Americans are highly concerned with happiness, yet they are increasingly depressed: Some 15 million Americans battle the disorder, and increasing numbers of them are young people. Depression comes in forms ranging from major depression to dysthymia and seasonal affective disorder. Depressive episodes are also a feature of bipolar disorder. Depression is a complex condition, involving many systems of the body, including the immune system, either as cause or effect. It disrupts sleep and it interferes with appetite; in some cases, it causes weight loss; in others, it contributes to weight gain. Depression is also often accompanied by anxiety. Research indicates that not only do the two conditions co-occur but that they overlap in vulnerability patterns. Because of its complexity, a full understanding of depression has been elusive. There is mounting evidence that depression may actually be a necessary defense strategy of the body, a kind of shutdown or immobilization in response to danger or defeat, that is actually meant to preserve your energy and help you survive. Researchers have some evidence that depression susceptibility is related to diet, both directly—through inadequate consumption of nutrients such as omega-3 fats—and indirectly, through the variety of bacteria that populate the gut. But depression involves mood and thoughts as well as the body, and it causes pain for both those living with the disorder and those who care about them. Depression is also increasingly common in children. Even in the most severe cases, depression is highly treatable. The condition is often cyclical, and early treatment may prevent or forestall recurrent episodes. Many studies show that the most effective treatment is cognitive behavioral therapy, which addresses problematic thought patterns, with or without the use of antidepressant drugs. In addition, evidence is quickly accumulating that regular mindfulness meditation, on its own or combined with cognitive therapy, can stop depression before it starts by diminishing reactivity to distressing experiences, effectively enabling disengagement of attention from the repetitive negative thoughts that often set the downward spiral of mood in motion. For more on causes, symptoms, and treatments of depressive disorders, see our Diagnosis Dictionary. What Are the Signs of Depression? Not everyone who is depressed experiences every symptom. Some people experience a few symptoms, some many. The severity of symptoms varies among individuals and over time. Depression often involves persistent sad, anxious, or empty mood; feelings of hopelessness or pessimism; and feelings of guilt, worthlessness, or helplessness. It can also involve loss of interest or pleasure in hobbies and activities that were once enjoyed, including sex. Decreased energy, fatigue, or a sense of being "slowed down" are also common, as are restlessness, irritability, and difficulty concentrating, remembering, or making decisions. Many with depression have thoughts of death or suicide. People with depression may experience disruptions in sleep (insomnia, early morning awakening or oversleeping) and in eating behavior (appetite changes, weight loss or gain). Persistent physical symptoms may include headaches, digestive disorders, and chronic pain. For more see Signs and Symptoms of Depression. article continues after advertisement if (!window.ptAdSlots || window.ptAdSlots.length === 0) { window.ptAdSlots = []; } window.ptAdSlots.push('div-gpt-ad-1404853927369-9') What Causes Depression? There is no single known cause of depression. Rather, it likely results from a combination of genetic, biologic, environmental, and psychological factors. Major negative experiences—trauma, loss of a loved one, a difficult relationship, or any stressful situation that overwhelms the ability to cope—may trigger a depressive episode. Subsequent depressive episodes may occur with or without an obvious trigger. Depression is not an inevitable consequence of negative life events, however. Research increasingly suggests that it is only when such events set in motion excessive rumination and negative thought patterns, especially about oneself, that mood enters a downward spiral. Research utilizing brain-imaging technologies such as magnetic resonance imaging (MRI) shows that the brains of people who have depression look different than those of people who do not. Specifically, the parts of the brain responsible for regulating mood, thinking, sleep, appetite, and behavior appear to function abnormally. It is not clear which changes seen in the brain may be the cause of depression and which may be the effect. Some types of depression tend to run in families, suggesting there may be some genetic vulnerability to the disorder. For more see Causes of Depression. How Is Depression Treated? Depression, even the most severe cases, is a highly treatable disorder. As with many illnesses, the earlier treatment begins, the more effective it can be and the greater the likelihood that recurrence can be prevented. Appropriate treatment for depression starts with an examination by a physician. Certain medications, as well as some medical conditions such as viral infections or a thyroid disorder, can cause the same symptoms as depression and should be ruled out. The doctor should ask about alcohol and drug use, and whether the patient has thoughts about death or suicide. Once diagnosed, a person with depression can be treated a number of ways. The most common treatments are medication and psychotherapy. Many studies show that cognitive behavioral psychotherapy is highly effective, alone or in combination with drug therapy. Psychotherapy addresses the thinking patterns that precipitate depression, and studies show that it prevents recurrence. Drug therapy is often helpful in relieving symptoms, such as severe anxiety, so that people can engage in meaningful psychotherapy. For more see Treatment of Depression and Therapy for Depression. Natural Approaches to Depression Depression requires active treatment, because the disorder can have enduring effects on brain function that make future episodes more likely. The longer a depression episode lasts, the more likely a future episode. However, there are many ways to treat depression, and some of the most effective, especially in cases of mild to moderate disorder, do not require a prescription or medical-type intervention of any kind. Depression can be seen as a kind of cave, and it takes some time and effort to get out of the cave. But it is possible, usually by learning some new patterns of thinking and doing. Nutrition plays a role as well. For more see Natural Approaches to Depression. Depression and Your Health Mental anguish is hard on your health: People suffering from depression have three times the risk of experiencing a cardiac event. In fact, depression affects the entire body. It weakens the immune system, increasing susceptibility to viral infections and, over time, possibly even some kinds of cancer—a strong argument for early treatment. It also interferes with sleep, adding to feelings of lethargy, compounding problems of focus and concentration, and generally undermining health. Those suffering from depression also experience higher rates of diabetes and osteoporosis. Sometimes depression manifests as a persistent low mood, a condition known as dysthymia which is usually marked by years-long periods of low energy, low self-esteem, and little ability to experience pleasure. For more see Depression and Physical Health. Living with Depression Everyone experiences an occasional blue mood. Yet clinical depression is a more pervasive experience of repetitive negative rumination, bleak outlook, and lack of energy. It is not a sign of personal weakness or a condition that can be willed or wished away. People with depression cannot merely "pull themselves together" to get better. It doesn't help that modern-day living carries growing pressures. There is an emphasis on early childhood achievement at the expense of free play, a cultural shift away from direct social contact in favor of electronic connection, and a focus on material wealth at the expense of rich experiences and social contact. All play a part. However, there is some evidence that, painful as depression is, it may serve a positive purpose, bringing with it ways of thinking that force those who suffer to focus on problems as a prelude to solving them. In effect, some researchers hypothesize that depression can help prod a person into much needed self-awareness. For more see How to Prevent and Manage Depression. The Major Forms of Depression What most people mean when they talk about depression is unipolar depression—an unremitting state of sadness, apathy, hopelessness, and loss of energy. It is also called major depression. Depressive episodes also occur in bipolar disorder, a condition marked by periods of depression interspersed with periods of high-energy mania. People swing between the two poles of mood states, sometimes over the course of days, and sometimes over years, often with stable periods in between. The birth of a baby can trigger mood swings or crying spells in the days or weeks that follow, the so-called baby blues. When the reaction is more severe and prolonged, it is considered postpartum depression, a condition requiring treatment because it can interfere with a parent's ability to care for their newborn. Depression can also occur seasonally, primarily in the winter months when sunlight is in short supply. Known as seasonal affective disorder, or SAD, it is often ameliorated by daily exposure to specific types of artificial light. For more see Types of Depression. The Biology of Depression Depression makes deep inroads on biology to bring about the many symptoms of depression, from sleep disruption and inability to experience pleasure to lack of motivation and feelings of guilt. Because of its complexity—and because the disorder contributes so much to human suffering—the biology of depression is a major subject of ongoing research. Overexcitability of the stress response system, shifts in activity of various neurochemicals in the brain, diminished efficiency of nerve circuitry and nerve generation, disturbances in energy use in nerve cells, the intrusion of inflammatory substances in the brain, upsets in the brain’s 24-hour (circadian) clock—all play a role in depression onset or progression and influence the kind and severity of symptoms. For more see The Biology of Depression Depression and Suicide Most suicides are linked to some form of psychiatric illness, particularly depression, and the more severe the depression, the greater the risk. Still, most people with major depression do not die by their own hand. Studies show that about 5 percent of depressed persons may have thoughts about suicide—suicidal ideation. Only a small percentage of them actively make plans to end their lives. The clearest warning sign of suicide is talk about wanting to die. And the best way to determine whether suicide is a risk is to ask. For more see Depression and Suicide. Children and Depression Mental health conditions such as depression are increasingly afflicting the young, including preschoolers. Especially in the young, depression requires active treatment—it can interfere with normal development. Depression can show up in children much as it does in adults, signified by sadness, lethargy, and disinterest. But especially among children it manifests as irritability. Other times it manifests as anger and acting out. Depression in children can have many causes. It can be a response to bullying. There is ample evidence that social media plays a role in depression among young people. Another source may be the decline of free play, an arena in which children traditionally work out their concerns and a great source of pleasure. For more see Children and Depression. Next: Signs and Symptoms of Depression Essential Reads Make Something Out of Your Mental Health Challenges Need some inspiration for the hidden gifts within your mental health struggles? Lincoln and Darwin got you covered. Are You Suffering from Purpose Anxiety? 5 Signs to Watch For Struggling to find your purpose? You’re not alone. Discover the hidden signs of purpose anxiety—and how to break free to build a fulfilling, passion-driven life. How We Can Miss One of the Easiest Ways to Feel Good How reward devaluation strengthens depression. Do Antidepressants Work? In a controversial new book, a psychiatrist exposes popular misconceptions about SSRIs. Recent Posts 5 Ways to Beat Post-Viral Blues Feeling down after a viral infection can be caused by the immune molecules that helped you recover. Feeling down after a viral infection can be caused by the immune molecules that helped you recover. How to Protect Your Child From Social Media Negativity You can't stop negative and mean people from saying hurtful things to your child on social media. But you can use simple, proven techniques using self-talk replacement strategies to guard their hearts. You can't stop negative and mean people from saying hurtful things to your child on social media. But you can use simple, proven techniques using self-talk replacement strategies to guard their hearts. What Childhood Has to Do With Your Adult Relationships There is a good reason that psychologists ask about your childhood, and it's not about blaming your parents. Its about changing how you feel and react in close relationships. There is a good reason that psychologists ask about your childhood, and it's not about blaming your parents. Its about changing how you feel and react in close relationships. Anxiety and Depression in an Unstable World How does uncertainty affect mental health? Political and economic instability fuel anxiety, depression, and cognitive strain. Learn how—and why—it’s reshaping our brains. How does uncertainty affect mental health? Political and economic instability fuel anxiety, depression, and cognitive strain. Learn how—and why—it’s reshaping our brains. How to Say "I Think You Should Talk to a Therapist" It takes three steps, and you’ll leave the conversation feeling more connected than when you started. It takes three steps, and you’ll leave '''
