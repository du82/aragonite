["https://psychologytoday.com/us/basics/aging"]
title = "Aging | Psychology Today"
description = "By 2060, according to the US Census, the number of adults aged 65 years or older will total about 98 million, or one-quarter of the population. The aging adult may need to manage such milestones as menopause, empty nest, retirement, not to mention being the sandwich generation that cares for parents and children."
full_description = '''How Do We Age? Reviewed by Psychology Today Staff By 2060, according to the US Census, the number of adults aged 65 years or older will total about 98 million, or one-quarter of the population. The aging adult may need to manage such milestones as menopause, empty nest, retirement, not to mention being the sandwich generation that cares for parents and children. You might think that older people are grumpy, doddering, frail, and feeble; and that how you age is dictated by your genes. This is not the case, not in the least. Overall, they are more conscientious, agreeable, and better able to regulate emotions. They also have higher levels of happiness than their midlife counterparts, and they’re often more mellow, have flexible mindsets, and are more grateful. Many older people today report better health, greater wealth, and higher levels of education than elders in past decades. Science is paying a lot of attention to the well-being of people in their later years. One area of concern is cognitive function and the effects of dementia and Alzheimer’s disease. Physical health is another important area of concern for an aging population; keeping the body moving and healthy helps to ensure the quality of a long life. Additionally, surveys find that more young people are turning to elders for advice and wisdom in a range of domains. And today, people age 65 and older suffer less debilitating disorders, people aged 75 to 84 report fewer impairments, and fewer people are living in nursing homes or in assisted-living arrangements. Plus, life expectancy has increased by a wide margin; men can expect to live to around age 83, and a woman can expect to live to about age 85. For more on how the brain ages and the impact on mental health, visit The Aging Brain and Mental Health in the Aging. On This Page The Signs of Normal Aging Aging in a Lifespan The Signs of Normal Aging As far as evolution is concerned, we are here to reproduce, and our bodies must be fit and healthy in our younger years for such childbearing. In advanced years, after reproduction, the negative effect of our genes becomes more apparent as there is no evolutionary benefit in prolonging our lifespans. But modern medicine has changed this greatly, the lifespan has increased and we’re seeing more age-related health problems as a result; the decline is seen in everything from cognitive function to weakened teeth. For more on how the body changes and living a longer healthier life, visit The Biology of Aging and Healthy Aging. Is cognitive decline common in aging? Created with Sketch. It is quite normal to experience forgetfulness, a diminished attention span, mild memory loss, some confusion, impaired judgment, and difficulty in learning new things like mastering a smartphone. These cognitive signs can appear after age 60, and more often after age 70. Do older adults sleep poorly? Created with Sketch. A study in the Journal of Clinical Sleep Medicine reported that up to 48 percent of elderly adults suffer insomnia. Older adults wake up earlier, tire easily, nap during the day, and eat earlier. All of which is not a great combination for a normal sleep schedule. Add to this equation, the medications a senior may be using, or other medical conditions they are managing such as diabetes or Alzheimer’s, or any other serious disease. Is poor vision common in aging? Created with Sketch. In normal aging, older people experience changes in their eyesight. The eye lens becomes thick and stiff, and the elderly person finds it hard to focus their vision. This is called presbyopia. Older people are also more at risk for cataracts, darkening of the eye lens that blocks vision. The bespectacled elderly person is not a stereotype, as deteriorating sight happens to virtually everyone at an advanced age. When do older people suffer hearing loss? Created with Sketch. Half of people aged 75 and older have difficulty hearing, and one-third of people between the ages of 65 and 74 suffer as well. This age-related loss, called presbycusis, normally affects hearing in both ears. Because it happens over time, the person may not be aware of the change. Do we all lose our teeth at old age? Created with Sketch. About a quarter of people age 65 and older have lost all their teeth, with gum disease as a leading cause. About 68 percent of older people have gum disease and they suffer other normal aspects of decline such as tooth enamel wearing away. But healthy habits can combat age-related dental problems, and at the top of that self-care list is to avoid smoking, as well as assiduous brushing and flossing. When does hair go gray? Created with Sketch. People in their thirties will find gray strands here and there, usually starting at the temples. But half of adults will lose 50 percent of their hair color by age 50. Going gray is hereditary; and some people go prematurely gray, where gray hair appears as early as in one’s mid-20s. Research on twins has found that they go gray at about the same time. And according to the National Institutes of Health, stress can cause premature gray hairs to set in; stress affects stem cells that regenerates hair pigment. article continues after advertisement if (!window.ptAdSlots || window.ptAdSlots.length === 0) { window.ptAdSlots = []; } window.ptAdSlots.push('div-gpt-ad-1404853927369-9') Aging in a Lifespan Psychologists have long cared about aging and mental health, and the American Psychological Association has had a division focused on Adult Development and Aging since the 1940s. However, it was not until the 2010s that geropsychology became recognized as a distinct area of inquiry by the American Board of Professional Psychology, with its own standards for board certification. For more on geropsychology and caregiving, visit Caring for Aging Loved Ones. What is geropsychology? Created with Sketch. Geropsychology is a specialty that focuses on understanding, treating, and improving the mental health of older adults. To do this, health professionals work with families and caregivers. They consult within different systems of care such as skilled nursing or assisted living facilities, engage in advocacy for the needs of older adults, and have a role collaborating with other health care professionals and social service agencies. When does menopause start? Created with Sketch. Menopause is marked by the depletion of eggs in the ovaries, as well as dropping hormone levels. Fertility normally peaks at around ages 25 to 30, declining after age 35. The precursor of menopause is perimenopause, which can occur as early as age 35, but mostly at around age 40. The menstrual cycle starts to ease and halts around age 50. Menopause may be marked by symptoms like hot flashes and mood swings. Is male menopause real? Created with Sketch. There is debate on whether male menopause, also called andropause, even exists. This stage refers to the drop in testosterone in men. However, the drop is not universal. A drop does happen in some men, and mostly after age 60. About 20 percent of men in their 60s, and as many as 50 percent of men in their 80s, go through such a drop in hormones. Men can feel a drop in energy, increased fatigue, low mood, as well as difficulty with sleep. Why do men die younger? Created with Sketch. Men tend to engage in riskier behaviors: they drive more aggressively than women, they experience a higher rate of automobile accidents, men drink more and smoke more, and more men than women are exposed to workplace hazards. Are there other reasons for women living longer than men? Created with Sketch. Having two X chromosomes provides women with a backup if a genetic mutation occurs, men meanwhile have a single X chromosome to express all their genes. The female’s genetic reserve might allow a greater repertoire of effective neural, endocrine, and immune responses to potentially damaging environmental demands. Also, female hormones, particularly estrogen, and the resiliency of the female body to accommodate pregnancy and breast-feeding are also thought to promote longevity. Estrogen has a beneficial effect on lipids in the blood and seems to protect against premature heart disease. What is empty nest? Created with Sketch. The idea of empty nest syndrome was first proposed in 1914 to describe the slide into depression that supposedly occurred for women after their last child left home and they were stripped of the meaning and structure of motherhood. As sometimes happens in research, this idea struck a cultural chord and became widely popular, even though there was no real evidence that this was a common experience. When research finally accumulated on this topic, in the 1970s, the “syndrome” was mostly debunked. While there are some feelings of loss and sadness, most parents report a sense of relief and freedom when their youngest child leaves home. Is the mid-life crisis real? Created with Sketch. Researchers have not found data showing that the mid-life crisis even exists. This myth is perpetuated by the vision of a silver-haired middle-aged man in a red sports car. The media loves that stuff. According to researchers such as Susan Krauss Whitbourne, some people in mid-life expect to feel general malaise, and so they do through self-fulfilling prophecy. Do people regret retiring? Created with Sketch. No. Contrary to popular myth and concern, retirees do not summarily wither away in retirement. They are free of work stress and have more time for family and meaningful pursuits. That does not mean that all baby boomers are retiring. In fact, many older workers aren't retiring, they’re staying employed and finding ways to contribute, whether through mentoring or charity or altruism. Next: The Aging Brain Essential Reads The Midlife Crisis Redefined Are you suffering a midlife crisis, or is it really that you are taking advantage of a midlife opportunity? Longevity and Meaning Do you want to live a long life or a long, meaningful life? Reflect upon “How do I find deeper meaning in my aging journey?” not “How do I keep myself alive until I am 100?” How Our Voices Change With Time From childhood to old age, our voice is constantly evolving. Discover what causes these changes and how to keep your voice healthy at any stage of life. Men's Social Networks Decline Significantly as They Age A new longitudinal study takes a careful look at how social networks change over the course of a lifetime. Recent Posts Facing Existential Dread With Randy Blythe Existential dread can be understood as intense feelings of anxiety, depression, or loneliness that arise from contemplating mortality. We can cope with a strong sense of purpose. Existential dread can be understood as intense feelings of anxiety, depression, or loneliness that arise from contemplating mortality. We can cope with a strong sense of purpose. I'm Jealous of My Autistic Son Personal Perspective: I've come to look at my son, Nat, not just with the pride of a mother, but with admiration. Personal Perspective: I've come to look at my son, Nat, not just with the pride of a mother, but with admiration. Antidepressants May Worsen Dementia, Study Shows New study shows dementia patients who are on antidepressants, especially selective serotonin reuptake inhibitors (SSRIs), over time may experience faster cognitive decline. New study shows dementia patients who are on antidepressants, especially selective serotonin reuptake inhibitors (SSRIs), over time may experience faster cognitive decline. The Cost of Caring The cost of caring for an aging loved one will continue to come down to fate or fortune until living with dignity becomes an inalienable right. The cost of caring for an aging loved one will continue to come down to fate or fortune until living with dignity becomes an inalienable right. Are All Gen Zers Really Entitled, Lazy, and Phone-Addicted? We’ve all heard the stereotypes about Gen Z, but are they really true? And is stereotyping even helpful? We’ve all heard the stereotypes about Gen Z, but are they really true? And is stereotyping even helpful? 3 Foods That Age Your Body and Brain Research shows that ultra-processed foods, sugary drinks, and alcohol accelerate aging and cognitive decline. Learn how diet impacts brain health, and how to slow the process. Research shows that ultra-processed foods, sugary drinks, and alcohol accelerate aging and cognitive decline. Learn how diet impacts brain health, and how to slow the process. New Models for Aging as Women Having seen both grandmothers and her mother face their final years alone, the fiftysomething author contemplates community-based living models for her own future. Having seen both grandmothers and her mother face their final years alone, the fiftysomething author contemplates community-based living models for her own future. Vital Questions for Aging Parents and Their Adult Children As we age, the dynamics within our families evolve, and it becomes crucial to navigate the changing dynamics with grace and foresight. As we age, the dynamics within our families evolve, and it becomes crucial to navigate the changing dynamics with grace and foresight. Menopause and Disordered Eating: What You Should Know Hormonal and health changes in later life can affect mental health and eating habits, increasing the risk of disordered eating or eating disorders in older adults. Hormonal and health changes in later life can affect mental health and eating habits, increasing the risk of disordered eating or eating disorders in older adults. Confronting the Old Man in the Mirror Personal Perspective: What you need to do when your "mirrored self" represents a major degradation from your inwardly imagined self. Personal Perspective: What you need to do when your "mirrored self" represents a major degradation from your inwardly imagined self. 1 2 Next'''
