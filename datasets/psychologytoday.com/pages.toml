["https://psychologytoday.com/us/basics/pornography"]
title = "Pornography | Psychology Today"
description = "Pornography, or porn, is any sexually explicit material—written, visual, or otherwise—intended to sexually arouse. Pornography has existed for millennia, and today it remains widely available in books, magazines, and audio recordings, but is most readily found and accessed online: The world’s largest porn site claims that in 2018, it had a daily average of 92 million unique viewers, the vast majority of them males."
full_description = '''Pornography Porn Reviewed by Psychology Today Staff Pornography, or porn, is any sexually explicit material—written, visual, or otherwise—intended to sexually arouse. Pornography has existed for millennia, and today it remains widely available in books, magazines, and audio recordings, but is most readily found and accessed online: The world’s largest porn site claims that in 2018, it had a daily average of 92 million unique viewers, the vast majority of them males. How does the ubiquity of porn affect individuals and their relationships? Is it a harmless pastime or a potential addiction? Is it a way to add spice to a couple's sex life, or a relationship destroyer? The debate over of whether pornography is detrimental to sexual development and mental health continues to rage as psychologists and others evaluate the validity of “porn addiction,” a supposed disorder that has no universally accepted diagnostic criteria and is not included in the DSM-5. Contents Porn in Our Lives Problems with Porn Pornography in Relationships Porn in Our Lives Pornography's many detractors argue that it damages intimacy and relationships, and promotes the subjugation of women. Nevertheless, some experts suggest that it may be a way for some men to satisfy sexual fantasies they are not comfortable discussing with their partners. Some research suggests that porn use may help stem sexual offenses, promote a greater understanding of sexual diversity, and help people better access their own desires and sexuality—which they can then communicate to their partners. Why does pornography exist? Created with Sketch. When one stops to think about it, it’s odd that so many humans seem to enjoy watching, and listening to, other humans have sex. Evolutionary research suggests it may be a vestige of an earlier stage in human history: The loud cries many females make during sex, or “female copulatory vocalization,” may have served in early primate communities to attract others to join in; some research suggests that such promiscuous mating may have been common in the earliest human communities as well. Do most people use porn? Created with Sketch. Well over 90 percent of men report at least occasional use of porn on surveys, and while studies of female porn use are seen as less reliable because many may be more reluctant to report honestly, estimates are that between 20 and 50 percent of women use porn at least occasionally. Why do men look at porn? Created with Sketch. In surveys of male porn habits, most report that they use it for arousal or sexual satisfaction. But a smaller percentage reveal that they look at pornography to escape uncomfortable emotions, relieve stress, address boredom, or forget their daily problems. These men, research finds, may be more likely to use porn impulsively as a coping strategy, and to find their personal use of porn to be problematic. Why do women look at porn? Created with Sketch. Research on female porn use finds that they are more likely than men to empathize with the characters in scenes and not just to focus on the sexual acts portrayed. Some women also report feeling better about their bodies after seeing similarities between themselves and female performers. Studies also reveal cognitive dissonance among women: They admit to finding porn arousing but are more likely than men to believe that viewing it is inappropriate. article continues after advertisement if (!window.ptAdSlots || window.ptAdSlots.length === 0) { window.ptAdSlots = []; } window.ptAdSlots.push('div-gpt-ad-1404853927369-9') Problems with Porn While some people are comfortable with their use of porn, it can be a deep source of distress for others, both male and female, who report feeling confused, embarrassed, conflicted, or ashamed about their own use, even if it is relatively minimal in frequency. Experts widely agree that someone’s use of porn is a problem if he or she believes it is, and that such a belief is largely determined by one's religious, familial, or cultural values. Can a person become addicted to pornography? Created with Sketch. Many psychologists question whether “porn addiction” is a valid clinical diagnosis. Instead, some studies show, individuals who believe they have an addiction to porn may not in fact view it more than other people, but may hold religious or cultural beliefs that make them feel more distressed about it. Other research finds that seeing oneself as a porn or sex addict may be correlated with experiencing anxiety or depression. Is porn use dangerous for teens? Created with Sketch. It is widely understood that many if not most teens view porn. And while parents and other adults may worry about porn serving as sexual education for many young people because of its unrealistic depictions of sex, some research suggests that even as porn use has risen among teens, dangerous sexual behavior in the age group has actually declined. Does porn use lead to erectile dysfunction? Created with Sketch. The belief is generally not accurate. In studies, men who used porn frequently and experienced ED were much more likely than others to hold conservative views about sex and religion; the shame they may have felt about their porn use was seen by researchers as more likely to have contributed to their ED than their use of porn itself. Pornography in Relationships There is no question that porn can become a source of conflict in committed relationships, especially when one partner has hidden their porn use because they know or suspect that the other would disapprove or consider it an act of infidelity. Experts encourage couples to discuss porn and other potentially divisive issues before marriage to avoid potentially disruptive arguments in the future. Joint counseling can help partners understand each other’s true sexual interests and negotiate what will and will not be acceptable in their relationship going forward. But it is more likely, many psychologists believe, that disputes about porn use will be found to be driven by other, more critical sexual or communication issues that need to be addressed. Is using porn a type of infidelity? Created with Sketch. In surveys, most people say they do not think that the use of porn by people in committed relationships is a form of infidelity, but those who are single, who are more religious, who don’t use porn themselves, or who have low self-esteem are more likely to agree that it is. In the end, experts advise, if one’s partner believes that it’s a betrayal, then that concern must be addressed. Why does my partner use porn? Created with Sketch. Humans need positive social interactions that provide physical affection, and when relationships don’t provide the affection we feel we need, we will seek substitutes for that deficit, sometimes in porn. Experts point to research confirming this theory, known as "affection exchange" as evidence that problematic porn use in relationships is typically a symptom of deeper issues. How can couples address the use of porn? Created with Sketch. When someone discovers a partner’s porn use, especially if they find the content of the material to be offensive, it can present a serious challenge to a relationship. Some therapists, though, suggest that couples see it as an opportunity to discuss each other’s erotic identities, fantasies, and differences, and to find common ground through open and honest sharing. Why is it difficult for couples to talk about porn? Created with Sketch. Talking about sex is extremely difficult for many if not most couples, even generally happy ones. Talking about porn may be even more uncomfortable. Partners who can come to the conversation with open minds, a joint commitment to reach agreement, and a willingness to seek outside help if necessary, tend to emerge stronger. Essential Reads Detoxing From Dopamine Many are suffering from overstimulation by technology, and artificial intelligence threatens to worsen the problem. Dr. Anna Lembke sees the value of dopamine fasts. How Does Internet Porn Shape Romantic Life? Discover how internet porn is reshaping our romantic lives, impacting sexual expectations and real-life intimacy and connection in surprising ways. Are Young Women Into Porn? Although adults realize boys and young men frequently watch porn, they might be surprised at how many girls and young women also use it. Arguments About Porn Aren't About Porn Many couples argue about pornography—one partner wanting the other to stop watching it. Arguing over this "solution" distracts couples from discussing the actual emotional issues. Does Porn Affect People’s Feelings About Their Sexual Organs? Many men believe their penises are too small, while many women are dissatisfied with their vaginas. Pundits may blame pornography, but a recent study disputes that. Many men believe their penises are too small, while many women are dissatisfied with their vaginas. Pundits may blame pornography, but a recent study disputes that. Social Anxiety in the Streets, Sexual Anxiety in the Sheets Sexual anxiety is social anxiety. Fear of judgment and rejection can impact intimacy, but CBT can help people replace self-doubt with confidence and connection. Sexual anxiety is social anxiety. Fear of judgment and rejection can impact intimacy, but CBT can help people replace self-doubt with confidence and connection. 5 Hidden Ways Porn and Toxic Relationships Can Fuel Each Other Pornography use and toxic relationships can reinforce each other, fueling secrecy, avoidance, and unhealthy expectations. Learn how to break free and build real intimacy instead. Pornography use and toxic relationships can reinforce each other, fueling secrecy, avoidance, and unhealthy expectations. Learn how to break free and build real intimacy instead. Divided We Date: Love in the Days of the Donald Young singles are forced to navigate a world where traditional dating norms are being redefined by technology and a rapidly changing culture. For many, it's no fun. Young singles are forced to navigate a world where traditional dating norms are being redefined by technology and a rapidly changing culture. For many, it's no fun. When the Real Issue Is Not Enough Sex, Not Too Much Porn More sex means better connection, deeper pleasure, and a healthier balance between fantasy and reality. More sex means better connection, deeper pleasure, and a healthier balance between fantasy and reality. What Parents Don’t Know About Internet Porn: A Parent Guide It’s not just what teens are seeing in internet porn but why they seek it out. Read this guide for parents about the teenage perspective and learn how to help. It’s not just what teens are seeing in internet porn but why they seek it out. Read this guide for parents about the teenage perspective and learn how to help. What We Know About Pornography and Adolescents Researchers across the globe are trying to better understand how earlier exposure to online pornography is affecting youth today. Researchers across the globe are trying to better understand how earlier exposure to online pornography is affecting youth today. What Is It Like to Date a Compulsive Porn User? Unrealistic porn expectations can lower sexual satisfaction for both partners. Unrealistic porn expectations can lower sexual satisfaction for both partners. Pornography: Pursuit of the Ideal? Pornographic pursuits are sometimes described as seeking behaviors, for when individuals attempt to sexually turn themselves on, that's precisely what they're engaged in. Pornographic pursuits are sometimes described as seeking behaviors, for when individuals attempt to sexually turn themselves on, that's precisely what they're engaged in. Does More Porn Use Equal More Sex Problems? Reporting negative impacts of porn use is relatively uncommon. Paradoxically, those who use the least porn are the most likely to report negative effects. Reporting negative impacts of porn use is relatively uncommon. Paradoxically, those who use the least porn are the most likely to report negative effects. 1 2 Next'''
