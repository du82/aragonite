["https://psychologytoday.com/us/basics/affective-forecasting"]
title = "Affective Forecasting | Psychology Today"
description = "Affective forecasting, also known as hedonic forecasting, is predicting how you will feel in the future. Researchers had long examined the idea of making predictions about the future, but psychologists Timothy Wilson and Daniel Gilbert investigated it further. They looked into whether a person can estimate their future feelings. For example, would marrying a certain person bring you happiness? Or would moving to a new city boost your mood?"
full_description = '''Affective Forecasting Reviewed by Psychology Today Staff Affective forecasting, also known as hedonic forecasting, is predicting how you will feel in the future. Researchers had long examined the idea of making predictions about the future, but psychologists Timothy Wilson and Daniel Gilbert investigated it further. They looked into whether a person can estimate their future feelings. For example, would marrying a certain person bring you happiness? Or would moving to a new city boost your mood? The researchers coined the term affective forecasting in the 1990s. Contents Why We Are Terrible at Predicting How We Will Feel What Matters Now vs. What Matters Tomorrow Why We Are Terrible at Predicting How We Will Feel In Wilson and Gilbert's research, they found that people misjudge what will make them happy and have trouble seeing through the filter of the present. They also discovered that how people feel in the moment blinds them, coloring the decisions they will make down the road. Because of this, affective forecasting is unreliable in decision-making. Can people predict how they will feel in the future? Created with Sketch. People tend to be inaccurate in forecasting how they might feel later. They also tend to overestimate how positive or negative they would feel about future situations. An example might be wishing to purchase a luxury car. You might anticipate immense and extended joy when you finally buy that car, however over time, the joy of owning that car will dissipate. How can you improve your predictions about how you will feel? Created with Sketch. You can try to plan for the worst outcome, or you can try to anticipate the pleasure that might come. But instead of making assumptions about how you might feel in any given situation, you could try speaking to people who have experienced the situation themselves. How do we forecast our feelings in everyday life? Created with Sketch. You might not know it, but affective forecasting finds its way into daily living. On the morning of a work meeting, you anticipate the day with dread and guilt, as the boss seems unhappy all of the time. Of course, you forecast for the worst outcome. The same happens with positive daily events. You anticipate a joyful evening with a good friend, looking forward to sharing your ups and downs with someone who cares. And, of course, you forecast happy feelings. Are older people better at affective forecasting? Created with Sketch. Older adults tend to be better at forecasting the future. This is largely because older people might pull from their past experiences. They know that the elated feeling they felt after purchasing that luxury car did not last as long as they had estimated. How does affective forecasting affect procrastination? Created with Sketch. Our present self thinks that our future self will be more motivated. Therefore, our present self is eager to procrastinate and put off being productive. Staying with an exercise or fitness program is a good example of this thinking. Why bother working out now when you’ll be more inclined to do so tomorrow? article continues after advertisement if (!window.ptAdSlots || window.ptAdSlots.length === 0) { window.ptAdSlots = []; } window.ptAdSlots.push('div-gpt-ad-1404853927369-9') What Matters Now vs. What Matters Tomorrow There are various related tendencies that can work in tandem with affective forecasting. For example, we all deploy a bit of false consensus, whereby we think that everybody thinks like we do and wants what we do. Some of us also do not think about the needs of our future selves; time discounting is a focus on what matters today and not so much on what matters tomorrow. What is projection bias? Created with Sketch. This is the tendency to project one’s current preferences into the future. However, what one wants now may not be the same at a later date. A person’s momentary emotional state has a lot of influence over their future selves. What is temporal, or time, discounting? Created with Sketch. People think about what they want in this very moment, but not necessarily what they might want in the future. Saving money is one example of not having much regard for your future self: Stashing cash away now means you cannot buy that luxury car now. Yet, saving money now will mean more gain for you in the future. What is focalism? Created with Sketch. This is the inclination toward focusing on certain details of an event and disregarding others. People may underestimate how an event will influence their thoughts and feelings. For example, if a person has just eaten a meal, then goes grocery shopping, that person will be less likely to anticipate future hunger, resulting in less food in the cart than they might actually need. What is impact bias? Created with Sketch. We tend to be poor judges and overestimate how long or how intense our happiness or sadness might be in any given situation. The joyous occasion of a wedding, for example, might give you the feeling that super elation will extend for a long time to come. Yet the honeymoon period might be far shorter than previously anticipated. Essential Reads Now That the Election Is Over, What Comes Next Emotionally? Researchers who study emotions would like us to know one thing: Whatever comes next, it will almost certainly not feel as bad—or as good—as we might think. Affective Forecasting: How It Affects Our Health Discovering how we relate to our future selves can explain why we struggle to reach our heath goals. You Are Stronger Than You Think What if you are more resilient than you think you are? How might that change the way you live? Why You Can’t Imagine How You’ll Feel in the Future It's hard for a lot of people to imagine how they'll feel in the future, but making positive predictions could be good for their long-term psychological well-being. Where's Smokey the Bear When You Need Him? Effective media-psychology campaigns can lead to better public safety following the recent wildfires. Effective media-psychology campaigns can lead to better public safety following the recent wildfires. Am I Naïve? To see through the lies, manipulations, and misbehavior of others, it's important to pay attention to our own internal guidance system. To see through the lies, manipulations, and misbehavior of others, it's important to pay attention to our own internal guidance system. The Problem With Serendipity Random events shape our lives, and we crave meaning in chaos. Being open to serendipity could be the secret to a life full of unexpected joys. Random events shape our lives, and we crave meaning in chaos. Being open to serendipity could be the secret to a life full of unexpected joys. 5 Surprising Threats to Long-Term Relationships 2. Being overly affectionate newlyweds. 2. Being overly affectionate newlyweds. Adversity's Brain-Shaping Impact Children exposed to abuse may suffer long-term emotional and physical problems. Children exposed to abuse may suffer long-term emotional and physical problems. The Neuroscience of Secrets Hiding or sharing secrets impacts brain function, stress levels, and emotional well-being, and can have a major effect on relationships. Hiding or sharing secrets impacts brain function, stress levels, and emotional well-being, and can have a major effect on relationships. 5 Reasons You're Not Borderline Even If TikTok Says You Are Your mental health is unlikely to be diagnosed by #Relatable online. Your mental health is unlikely to be diagnosed by #Relatable online. How to Stop Worrying About Uncertain Futures Worry too much? If so, a lesson from the great "horse manure crisis of 1894" may help reduce your anxiety about the future. Worry too much? If so, a lesson from the great "horse manure crisis of 1894" may help reduce your anxiety about the future. How Well Can Divorce Be Predicted? 9 issues are especially telling, including plans for the future. 9 issues are especially telling, including plans for the future.