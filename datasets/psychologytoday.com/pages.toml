title = "Altruism | Psychology Today"
description = "Altruism is acting to help someone else at some cost to oneself. It can include a vast range of behaviors, from sacrificing one’s life to save others, to giving money to charity or volunteering at a soup kitchen, to simply waiting a few seconds to hold the door open for a stranger. Often, people behave altruistically when they see others in challenging circumstances and feel empathy and a desire to help."
full_description = '''Altruism Generosity Reviewed by Psychology Today Staff Altruism is acting to help someone else at some cost to oneself. It can include a vast range of behaviors, from sacrificing one’s life to save others, to giving money to charity or volunteering at a soup kitchen, to simply waiting a few seconds to hold the door open for a stranger. Often, people behave altruistically when they see others in challenging circumstances and feel empathy and a desire to help. Contents Why Altruism Is Important What Makes Someone Generous? Why Altruism Is Important Altruistic urges and behaviors are an important part of the glue that binds families and social groups together, helping them to cooperate and thrive. Individuals who go out of their way to aid others often receive something in return—whether it’s an intangible reward, such as admiration and respect, or material support at a later time. Altruistic impulses and the reciprocation of kind deeds help ensure all members of a tight-knit group have backup when they need it. Is altruism part of human nature? Created with Sketch. It seems to be for most people. Cooperative behavior allowed our ancestors to survive under harsh conditions, and it still serves a purpose in a highly complex society. Is altruism selfish or selfless? Created with Sketch. Altruism can be viewed as both. In some sense, altruists put others’ interests ahead of their own—but giving to others often feels good and can result in longer-term gains for the giver. "Reciprocal altruism" is a term used by scientists for helping that is sustained by an eventual payoff from the person that receives help. What is the “warm glow” effect? Created with Sketch. Even when people don’t expect recognition or reward for a good deed, they often feel energized and happy afterward—a sensation sometimes called a "helper's high” or “warm glow.” It likely helps to reinforce altruistic behavior in those who feel it. What animals show altruism? Created with Sketch. Many species benefit when individuals put service to the larger group ahead of their own personal interest. A variety of animals, from rats to bonobos to whales, have been caught engaging in apparently altruistic behavior. What is altruistic punishment? Created with Sketch. Altruism isn’t always a strictly warm-and-fuzzy experience. Altruistic punishment is a term for a costly act that punishes someone in order to benefit others, such as intervening when someone is being bullied. article continues after advertisement if (!window.ptAdSlots || window.ptAdSlots.length === 0) { window.ptAdSlots = []; } window.ptAdSlots.push('div-gpt-ad-1404853927369-9') Cultivating Generosity Most people are inclined to help out a best friend or a close family member in need. But how far does that kindness extend? Some people are clearly more or less altruistic than others—with callous psychopaths, perhaps, on the low end, people who risk their lives for strangers on the other end, and the rest of us in the middle. Many forces, both internal and external, likely underlie these individual differences in altruism. Is altruism learned or innate? Created with Sketch. Even young children feel good about sharing, and to some extent, altruistic tendencies may be built-in for most people. Many altruistic acts are reactive: Human beings respond compassionately when they see others in pain and in need of help. Of course, people also learn norms of altruism within their culture, including how much or how little generosity is considered acceptable. What causes people to be altruistic? Created with Sketch. Neurological, cultural, and other kinds of factors may cause some people to be more altruistic than others. So-called “extreme altruists” appear to differ from others in the size of their brains’ amygdala and their responsiveness to signs of distress. External influences such as a religious upbringing or socioeconomic status may also play a role. Why would altruism be more common when individuals are related? Created with Sketch. Close relatives (such as parents and siblings) share many more of a person’s genes than others do. According to evolutionary theory, an interest in helping close kin spread those shared genes by surviving and reproducing—a sort of favoritism called kin selection—helps explain why humans are more likely to help those relatives than strangers or even distant family members. Essential Reads Different Feelings of Love in Different Parts of the Brain Ever wondered why love for a friend feels different than love for a partner? Brain science gives us insight into the regulations of different types of love. How to Encourage Generosity in Your Kids This Holiday Season The holidays can be a perfect time to teach generosity to our kids. Here are three ways to encourage the "warm glow" of kindness during this festive season. What’s Your Kindness Quotient? We care about our neighbors 74 percent as much as we do ourselves. Failure to Replicate the "Identified Victim Effect" We conducted several replications and a reanalysis of a meta-analysis on the classic identified victim effect and found no support for the original, seminal findings. When Your Friend Is Gone but You Survived Nobody wants to talk about survivor guilt, yet it is more pervasive than most recognize and leaders can take a role to ameliorate its effects. Nobody wants to talk about survivor guilt, yet it is more pervasive than most recognize and leaders can take a role to ameliorate its effects. Help Me if You Can Helping is not unique to humans. Chimps, dogs, and mice do it too. Helping is not unique to humans. Chimps, dogs, and mice do it too. How Can Social Supports Save Us? Some people claim that they are better off being alone, away from other people. There may be another side to this view. Some people claim that they are better off being alone, away from other people. There may be another side to this view. We Can Have an Impact A Personal Perspective: Decency becomes a growing intention, one person at a time, one situation following another. A Personal Perspective: Decency becomes a growing intention, one person at a time, one situation following another. How to Consider Moral Development When Parenting We hope our children all develop great morals. Here is how you can help. We hope our children all develop great morals. Here is how you can help. How Lonely Are We and Why Does It Matter? The sense of loneliness spiked during COVID and continues to harm our society and health. Who is most affected and what should we do to fight this trend? The sense of loneliness spiked during COVID and continues to harm our society and health. Who is most affected and what should we do to fight this trend? A Brief Review of Anna Freud's Concept of Altruistic Surrender Giving until it hurts may seem virtuous, but it may be a manifestation of defense mechanisms erected in response to covert, overly harsh self-criticism. Giving until it hurts may seem virtuous, but it may be a manifestation of defense mechanisms erected in response to covert, overly harsh self-criticism. Fix Annoying Things, Close Drawers, Do Small Favors A Personal Perspective: Dramatic changes have real appeal. Declutter the whole house! But making many small changes will have a much bigger impact over time. A Personal Perspective: Dramatic changes have real appeal. Declutter the whole house! But making many small changes will have a much bigger impact over time. Can 25 Cents Cause a Chain Reaction of Connection? Personal Perspective: COVID-19 and politics have built walls in our society. Sharing a grocery cart that costs you a quarter is a good first step toward breaking down those barriers. Personal Perspective: COVID-19 and politics have built walls in our society. Sharing a grocery cart that costs you a quarter is a good first step toward breaking down those barriers. Do We Make Better Choices When It's All About Us? Every day we make choices that affect us and choices that affect others. New research using animal behaviour reveals which we are better at and how choices link to autistic traits. Every day we make choices that affect us and choices that affect others. New research using animal behaviour reveals which we are better at and how choices link to autistic traits. 1 2 Next'''
