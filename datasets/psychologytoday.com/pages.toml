["https://psychologytoday.com/us/basics/narcissism"]
title = "Narcissism | Psychology Today"
description = '''Narcissists have a prominent place in the popular imagination, and the label "narcissist" is widely deployed to refer to people who appear too full of themselves. There's also a growing sense that narcissism is on the rise around the world, especially among young people, although most psychological research does not support that notion.'''
full_description = '''Narcissism Reviewed by Psychology Today Staff Narcissists have a prominent place in the popular imagination, and the label "narcissist" is widely deployed to refer to people who appear too full of themselves. There's also a growing sense that narcissism is on the rise around the world, especially among young people, although most psychological research does not support that notion. Narcissism is properly viewed on a spectrum. The trait is normally distributed in the population, with most people scoring near the middle, and a few at either extreme. The Narcissistic Personality Inventory (NPI), developed by Robert Raskin and Calvin S. Hall in 1979, is the most commonly used measure of the trait. Scores range from 0 to 40, with the average tending to fall in the low to mid-teens. Healthy individuals who score somewhat higher may be perceived as exceedingly charming, especially on the first encounter, but eventually come across as vain. Such individuals may have awkward or stressful personal encounters but still have a fundamentally healthy personality. Contents The Traits of Narcissism How to Handle a Narcissist Narcissism in Relationships The Traits of Narcissism It’s easy to describe someone who spends a bit too much time talking about her career or who never seems to doubt himself as a narcissist, but the trait is more complicated than that. Narcissism does not necessarily represent a surplus of self-esteem or of insecurity; more accurately, it encompasses a hunger for appreciation or admiration, a desire to be the center of attention, and an expectation of special treatment reflecting perceived higher status. Interestingly, research finds, many highly narcissistic people often readily admit to an awareness that they are more self-centered. A high level of narcissism, not surprisingly, can be damaging in romantic, familial, or professional relationships. How do I spot a narcissist? Created with Sketch. Narcissism is characterized by a grandiose sense of self-importance, a lack of empathy for others, a need for excessive admiration, and the belief that one is unique and deserving of special treatment. If you encounter someone who consistently exhibits these behaviors, you may be dealing with a highly narcissistic individual. What’s the difference between narcissism and pathological narcissism? Created with Sketch. Pathological narcissism, or narcissistic personality disorder, is rare: It affects an estimated 1 percent of the population, a prevalence that hasn't changed since clinicians started measuring it. The disorder is suspected when narcissistic traits impair a person’s daily functioning. That dysfunction typically causes friction in relationships due to the pathological narcissist's lack of empathy. It may also manifest as antagonism, fueled by grandiosity and attention-seeking. In seeing themselves as superior, the pathological narcissist naturally views everyone else as inferior and may be intolerant of disagreement or questioning. Do narcissists know that they are narcissists? Created with Sketch. If you wonder whether someone is a narcissist, it might be best just to ask them. It’s generally assumed that people either don’t realize that they are narcissists, or deny it to avoid a challenge to their identity. But in research using the so-called Single-Item Narcissism Scale, people who answered affirmatively to the single question, “Are you a narcissist?” were far more likely than others to score highly on narcissism on the 40-question Narcissistic Personality Inventory. Are there any benefits to being narcissistic? Created with Sketch. Research has discovered some benefits in relatively high but subclinical narcissism, such as increased mental toughness (performing well in high-pressure situations) and higher achievement in school and on the job. A heightened sense of self-worth may also make a person more motivated and assertive than others. Other research has linked narcissism to a lower incidence of depression. Is my boss a narcissist? Created with Sketch. A narcissistic boss places getting ahead over getting along, which means they’re often uncollaborative, arrogant, and argumentative, and myopically focused on becoming “the winner.” Narcissistic bosses take all the credit for successes and lash out at those who do not demonstrate loyalty. These tendencies and others indicate that you may be dealing with a narcissistic boss. article continues after advertisement if (!window.ptAdSlots || window.ptAdSlots.length === 0) { window.ptAdSlots = []; } window.ptAdSlots.push('div-gpt-ad-1404853927369-9') How to Handle a Narcissist Navigating a relationship with a narcissist can be deeply frustrating and distressing. In their quest for control and admiration, narcissistic people may manipulate and exploit others, damaging their self-esteem and even aiming to alter their sense of reality. Arguing with a narcissist about their action often proves fruitless. A more successful solution is to establish boundaries and emotionally distance yourself. Recognize that you may not be able to control your feelings about a person, but you can control how you respond to them. Cutting ties with a narcissistic partner, family member, or boss may eventually be the best if not the only solution. In that process, it's helpful to reflect on the characteristics of the individual to avoid finding oneself in similar scenarios in the future. What are the strategies to handle a narcissist? Created with Sketch. Acknowledging your frustration, appreciating where the behavior comes from, and refusing to lose your own sense of purpose when a narcissist takes center stage are key strategies, among others. Researchers who classify narcissists as either vulnerable or grandiose argue that specific approaches are warranted for each type. How do I deal with a narcissistic boss? Created with Sketch. Manage your expectations, align your successes with your boss’s, draw boundaries, and don’t try to argue, justify, or explain yourself. These and other tactics can help you navigate a narcissist in the workplace. Are narcissists successful leaders? Created with Sketch. Narcissists tend to have an intense drive for power, attention, and affirmation, which may benefit them in campaigns for corporate management or political leadership. Once in charge, though, they may focus more on self-promotion and the suppression of opposition than advancing an organization’s goals and their lack of empathy fosters little loyalty. Narcissism in Relationships A narcissist's desire to elicit admiration and praise, especially from potential romantic partners, often makes them charming and charismatic, traits that can rapidly ignite a romance. But their inherent deficit of empathy may prevent them from understanding a partner's inner world and establishing a fulfilling long-term relationship. It's nearly impossible for people with narcissistic personality disorder to truly fall in love and build a trusting, equal partnership. Such an individual may seek to establish strict rules in a relationship and attempt to isolate a new partner from friends and family, among other disturbing behaviors. Why do narcissists make such a good first impression? Created with Sketch. Research suggests that people may initially be drawn to narcissists because they seem to possess stronger self-esteem than they really do, a trait that people often appreciate. Can narcissists fall in love? Created with Sketch. Narcissists may show passion and charm in the early stages of dating. But for most narcissists, relationships are transactional. They provide positive attention and sexual satisfaction to bolster a narcissist’s ego and self-esteem. The objective is to enjoy uncommitted pleasure, and most narcissists lose interest in the relationship as the expectation for intimacy increases or they feel that they’ve conquered the challenge of securing a relationship. Do narcissists have more hookups than other people? Created with Sketch. From an evolutionary perspective, it has been theorized that, at least in the realm of mating, narcissism may serve an adaptive function: increased success in short-term mating. Cross-cultural research has found that narcissists tend to have higher levels of sociosexuality: They are more interested in short-term relationships or hookups, and more likely to pursue partners who are already in committed relationships. What’s the difference between selfishness and narcissism in a relationship? Created with Sketch. Narcissistic personality disorder is relatively rare—there are many more people who are simply selfish. The difference lies in whether the person is periodically mean and self-centered or whether they consistently lack empathy. Essential Reads Hugging and Narcissism: A Surprising Insight Some people love to hug other people, while others don’t. A new study sheds light on personality differences between these two groups. Spot the Liar: Looking Beyond Narcissism Most people misunderstand the link between narcissism and lying. Other dark personality traits do a much better job of predicting lying. Did You Ever Think the Narcissist Is Just Overly Sensitive? Although most people think of narcissists as impervious to the judgment of others, new research on personality shows how easy it is to provoke their insecurity. How to Handle Narcissistic Fragility Narcissists lash out when they feel threatened or hurt. If you are on the receiving end, it can feel excruciating. Here are six things to keep in mind to stay centered. The Quiet Form of Narcissism Vulnerable narcissism is less showy and aggressive, yet it entails similar degrees of envy, shame, resentment, and entitlement as its grandiose counterpart. Vulnerable narcissism is less showy and aggressive, yet it entails similar degrees of envy, shame, resentment, and entitlement as its grandiose counterpart. Why Narcissists Target Emotionally Intelligent People 3 reasons why a narcissist fixates and targets the emotionally intelligent. 3 reasons why a narcissist fixates and targets the emotionally intelligent. Loneliness and Narcissism: A Conundrum Many narcissists are lonely. They erect walls for protection as they are vulnerable and apprehensive about intimacy. Many narcissists are lonely. They erect walls for protection as they are vulnerable and apprehensive about intimacy. 6 Signs Your Relationship May Not Be Worth the Fight Are you overlooking hidden signs that your relationship might not work out? Discover the subtle cues that could signal deeper incompatibilities. Are you overlooking hidden signs that your relationship might not work out? Discover the subtle cues that could signal deeper incompatibilities. What Every Survivor Desperately Wants But Rarely Gets Shari Franke never has to wonder if her past was real—her abusers were exposed. Most survivors don't get that. Here’s why that validation is so powerful. Shari Franke never has to wonder if her past was real—her abusers were exposed. Most survivors don't get that. Here’s why that validation is so powerful. Loving Attraction Between Narcissistic and Borderline Traits The attraction between narcissists and borderlines arises from mirrored wounds. Their intensity can lead to cycles of idealization and devaluation, but healing is possible. The attraction between narcissists and borderlines arises from mirrored wounds. Their intensity can lead to cycles of idealization and devaluation, but healing is possible. The "Ick" Factor: The Science Behind Sudden Attraction Shifts From crush to cringe, the "ick" is a sudden turnoff. Research using TikTok reveals the top icks, common reactions, and who has them more. From crush to cringe, the "ick" is a sudden turnoff. Research using TikTok reveals the top icks, common reactions, and who has them more. Domestic Abusers Punish Their Exes Post-Separation After separation, domestic abusers cause as much pain as they can, and try to win at all costs. Learn how to protect your client or yourself from an abuser's punishing strategy. After separation, domestic abusers cause as much pain as they can, and try to win at all costs. Learn how to protect your client or yourself from an abuser's punishing strategy. Revisiting the Narcissistic Personality The narcissistic personality can leave a debris field of suffering behind them. Here is how they see themselves and what you can expect. The narcissistic personality can leave a debris field of suffering behind them. Here is how they see themselves and what you can expect. Why Do I Attract Narcissists? Healthy relationships start with embracing your inner wholeness. Break the cycle of attracting narcissists by building self-worth and fostering independence. Healthy relationships start with embracing your inner wholeness. Break the cycle of attracting narcissists by building self-worth and fostering independence. 1 2 Next'''
