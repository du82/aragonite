title = "Alcoholism | Psychology Today"
description = "For many, beer, wine, and spirits conjure up thoughts of social gatherings and tipsy fun. But alcohol is a nervous system depressant and easily alters behavior, culminating in some cases in the emotional pain and physical disintegration of alcohol addiction, colloquially known as alcoholism. Experts continue to debate the benefits and risks of drinking and passionately argue over whether moderation or complete abstinence is the best option for those who struggle with alcoholism."
full_description = "Alcoholism Alcoholic Reviewed by Psychology Today Staff For many, beer, wine, and spirits conjure up thoughts of social gatherings and tipsy fun. But alcohol is a nervous system depressant and easily alters behavior, culminating in some cases in the emotional pain and physical disintegration of alcohol addiction, colloquially known as alcoholism. Experts continue to debate the benefits and risks of drinking and passionately argue over whether moderation or complete abstinence is the best option for those who struggle with alcoholism. Alcohol Use Disorder is a pattern of disordered drinking that leads to significant distress. It can involve withdrawal symptoms, disruption of daily tasks, discord in relationships, and risky decisions that place oneself or others in danger. About 15 million American adults and 400,000 adolescents suffer from alcohol use disorder, according to the National Institute on Alcohol Abuse and Alcoholism. But treatment and support are available to help those suffering begin to heal. For more information on symptoms, causes, and treatment of alcohol use disorder see our Diagnosis Dictionary. Contents Signs, Symptoms, and Diagnosis Causes and Risk Factors The Effects of Alcohol Treatment and Recovery Supporting Someone with a Drinking Problem Signs, Symptoms, and Diagnosis Alcoholism most often refers to alcohol use disorder—a problematic pattern of drinking that leads to impairment or distress—which can be characterized as mild, moderate, or severe based on the number of symptoms a patient has, such as failing to fulfill obligations or developing a tolerance. Mild is classified as 2 to 3 symptoms, moderate is classified as 4 to 5 symptoms, and severe is classified as 6 or more symptoms, according to the DSM-5. What are the symptoms of alcoholism? Created with Sketch. Alcohol use disorder is a problematic pattern of alcohol use that leads to distress in one’s daily life, according to the DSM-5. The symptoms that can lead to a diagnosis include drinking more alcohol than intended, failing to cut back on alcohol use, devoting substantial time and effort to drinking and recovering from drinking, strong cravings for alcohol, failing to fulfill obligations at work, school, or home, disengaging from relationships and activities, and developing tolerance or withdrawal, among others. Experiencing at least two symptoms throughout the course of a year merits a diagnosis, from mild to moderate to severe. What are early warning signs of addiction? Created with Sketch. The later stages of addiction can yield physical changes, but behavioral signs can help detect it early on. People with an addiction often develop rigid routines that revolve around uninterrupted access to alcohol and other drugs; they may be irritated by schedule changes and blame their frustration on others. They may have powerful mood swings that seem to change their personality. Relationships may deteriorate, as their social circle narrows to other drug or alcohol users. Their work may decline as well, and they may lose a spiritual or religious practice they once valued. Where’s the line between heavy drinking and alcoholism? Created with Sketch. If the drinking world is conceptualized as a spectrum, normal social drinking is one on end (a few drinks per month, almost always in a social context) and alcohol use disorder is on the other end. But there’s a large gray area in the middle, in which drinking can cause problems for someone’s health, job, or loved ones, but not to a clinical extent. An example would be a father who falls asleep on the couch after having several drinks three or four days a week, missing out on time with his kids and wife. Another would be a college student who repeatedly has trouble making it to class because she was drunk the night before. These individuals, sometimes called “almost alcoholics,” may not see the connection at first but would often benefit from help and support. Why does addiction go undiagnosed? Created with Sketch. Alcohol use disorder affects millions of people, but it often goes undetected. Substance use frequently co-occurs with mental illness, but some research suggests that psychiatrists only treat addiction for around half of the patients who have both mental illness and substance use problems. This discrepancy highlights the obstacles in addiction care, such as that clinicians may be unaware of the signs of substance use or not want to alienate patients by bringing it up, and patients may not want to reveal their substance use, among other hurdles. article continues after advertisement if (!window.ptAdSlots || window.ptAdSlots.length === 0) { window.ptAdSlots = []; } window.ptAdSlots.push('div-gpt-ad-1404853927369-9') Causes and Risk Factors Like all addictions, alcohol use disorder is linked to a complex combination of biological, social, and psychological factors. Research highlights a genetic component to the disorder, as about half of one's predisposition to alcoholism can be attributed to genetic makeup. People may turn to alcohol as a way to cope with trauma or other, often unrecognized psychological disorders. Socially, alcoholism may be tied to family dysfunction or a culture of drinking. Why do people start drinking? Created with Sketch. Before it becomes problematic, why do people turn to alcohol in the first place? A number of factors can motivate people to drink. One is simply its rewarding consequences, such as having fun or escaping social anxiety. Having an impulsive personality plays into the decision to seek rewards despite negative repercussions. Another factor is stress, because alcohol can alleviate distressing emotions. Social norms, such as drinking during a happy hour or on a college campus, and positive experiences with alcohol in the past (as opposed to getting nauseous or flushed) play a role as well. Is alcoholism genetic? Created with Sketch. The chance of developing any health problem is related to the genetic code we are born with. Just like some people have a greater risk of developing cardiovascular disease or cancer, others have a greater risk of developing an alcohol use disorder. Someone with a family history of alcohol problems, someone prone to anxiety or depression, someone who is highly impulsive and takes risks, and someone who needs more alcohol than average to experience its effects has a higher likelihood of developing the disorder. Can childhood experiences lead to alcoholism? Created with Sketch. Childhood trauma can fuel problematic drinking in adulthood, because the person might use alcohol to cope with feelings of anger, depression, anxiety, loneliness, or grief. Compared to people without a drinking problem, men and women who sought treatment for alcohol addiction had a higher prevalence of childhood trauma, research finds. Furthermore, the greater the abuse or neglect experienced, the more severe their drinking problem was. Therapy can help people who suffered as a child to address those challenges and develop healthier coping skills. The Effects of Alcohol Alcohol is a powerful substance, with the capacity for positive experiences, such as bursts of creativity and fun, as well as harmful repercussions, such as addiction and health problems. Becoming dependent on alcohol can lead to challenges for both the mind and the body. What does alcohol do to the brain? Created with Sketch. Heavy drinking can fuel changes in the brain—about half of people who meet the criteria for alcoholism show problems with thinking or memory, research suggests. The ability to plan ahead, learn and hold information (like a phone number or shopping list), withhold responses as needed, and work with spatial information (such as using a map) can be affected. Brain structures can shift as well, particularly in the frontal lobes, which are key for planning, making decisions, and regulating emotions. But many people in recovery show improvements in memory and concentration, even within the first month of sobriety. Does alcohol affect creativity? Created with Sketch. The idea that altered forms of consciousness such as mania or alcohol can enhance creativity is a popular belief. And it turns out there’s some evidence for that idea. Researchers found that participants who had a few drinks were better and faster at creative problem solving than their sober counterparts. The reason may be that alcohol tamps down working memory and therefore sparks people to think outside the box. How does alcohol affect mood? Created with Sketch. As anyone who has had even a glass of wine can attest, alcohol can have a noticeable influence on mood. Drinking releases endorphins which can lead people to feel happy, energized, and excited. But alcohol is also classified as a depressant and can cause fatigue, restlessness, and depression. It may shift from stimulant to sedative in line with whether blood alcohol content is rising or falling. Given the power of alcohol on the brain, people who drink heavily may come to rely on it to regulate their mood. What are the health consequences of heavy drinking? Created with Sketch. One recent analysis found a sobering relationship between alcohol and health. People who drank seven to 14 alcoholic drinks a week lowered their life expectancy by about six months, people who drank 14 to 24 drinks a week lowered their life expectancy by one to two years, and consuming more than 24 drinks a week lowered life expectancy by four to five years. Alcohol consumption was also linked to a greater risk for stroke, coronary disease, heart failure, and fatally high blood pressure. However, it’s difficult to discern if drinking was the primary problem, or whether lifestyle choices such as diet and exercise influenced health outcomes as well. Treatment and Recovery In some cases, the first step in treating alcohol use disorder is detoxification—experiencing withdrawal in a safe setting with medical professionals. Following withdrawal, there are many paths to recovery. Some people are able to stop drinking on their own. There are many organized programs that provide the support of peers, usually through frequent meetings. Alcoholics Anonymous is one example; it offers a structured 12-step path toward recovery with a community of support from those who have dealt with similar challenges. Cognitive behavioral therapy is another path, available in person or online. Non-abstinence-based recovery models—such as Moderation Management—advocate for reducing one's alcohol consumption rather than abstaining completely. The biggest barrier to therapy of any kind that patients may face is shame and stigma; most programs address such concerns directly. What steps can I take to curb my drinking on my own? Created with Sketch. Some people prefer to try cutting back or quitting on their own before committing time and money to rehab. And there are a few approaches that can identify and combat drinking at an early stage. People can focus on education and support, such as through Alcoholics Anonymous, or take on a sobriety challenge. People can learn mindfulness; rather than trying to soothe uncomfortable feelings with alcohol, mindfulness encourages techniques such as breathing, visualization, and meditation. In a clinical setting, motivational interviewing, which cultivates the drive to change behaviors, and Screening, Brief Intervention, Referral, and Treatment (SBIRT), which funnels patients to treatment, are also helpful options. What should I look for in an addiction treatment center? Created with Sketch. A few empirically validated practices can help identify strong treatment programs. Treatment centers should ideally have rigorous and reliable screening for substance use disorders and related conditions. They should have an integrated treatment approach that addresses other mental and physical health conditions. They should emphasize linking different phases of care, such as connecting patients to mental health professionals, housing, and peer support groups when transitioning out of the acute phase of care. They should also have proactive strategies to avoid dropping out, involve the family in treatment, employ qualified and certified staff, and be accredited by an external regulatory organization. Find a treatment center using the Psychology Today Therapy Directory. Does Alcoholics Anonymous work? Created with Sketch. Alcoholics Anonymous is a decades-old treatment, but one that research shows is effective. A recent review found that Alcoholics Anonymous led to higher rates of abstinence from alcohol long term compared to other treatments. One of the key reasons, according to the data, is that people continue to participate for years after they have completed the 12-step program. AA is not for everyone and there are plenty of different treatment options, but it can be successful and meaningful for those who choose it. What are the critiques of Alcoholics Anonymous? Created with Sketch. Some have criticized Alcoholics Anonymous and other 12-step programs because they are rooted in religious ideology rather than scientific principles. Some also disagree with the notion of admitting powerlessness to God or a higher power and completely ceding control, and the belief that addiction is a disease, a point vigorously debated in the clinical and scientific communities. Does moderation rather than abstention work? Created with Sketch. Some people may be hesitant to seek treatment because they don’t want to abstain entirely. Moderation management or moderation treatment can be an effective approach, in which people learn responsible drinking habits through a structured program. Research suggests this form of treatment can help people shift from heavy to moderate drinking, improve quality of life, and enhance emotional well-being. Can ketamine treat alcohol use disorder? Created with Sketch. For the past several years, evidence has been growing that ketamine might help those with severe depression. Research has also targeted ketamine’s effect on substance and alcohol use: One recent study found that the combination of ketamine and motivational enhancement therapy had higher rates of abstinence, longer time to relapse, and fewer days of heavy drinking than people who received a control (midazolam). Another found that ketamine could effectively interfere in creating alcohol-related memories. What does it mean to be in recovery from alcohol use disorder? Created with Sketch. The American Society of Addiction Medicine defines recovery as “an active process of continual growth that addresses the biological, psychological, social and spiritual disturbances inherent in addiction.” SAMHSA defines it as “a process of change through which individuals improve their health and wellness, live a self-directed life, and strive to reach their full potential.” As popular opinion about the nature of addiction shifts from a moral failing to a health issue, that conversation should incorporate recovery as w"
