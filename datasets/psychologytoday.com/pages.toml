title = "Mindfulness | Psychology Today"
description = "Mindfulness is a state of active, open attention to the present. This state is described as observing one’s thoughts and feelings without judging them as good or bad."
full_description = "Mindfulness Present Moment Awareness Reviewed by Psychology Today Staff Mindfulness is a state of active, open attention to the present. This state is described as observing one’s thoughts and feelings without judging them as good or bad. Contents Understanding Mindfulness Practicing Mindfulness The Benefits of Mindfulness Understanding Mindfulness To live mindfully is to live in the moment and reawaken oneself to the present, rather than dwelling on the past or anticipating the future. To be mindful is to observe and label thoughts, feelings, sensations in the body in an objective manner. Mindfulness can therefore be a tool to avoid self-criticism and judgment while identifying and managing difficult emotions. Mindfulness is rooted in Buddhist and Hindu teachings. Buddhism includes a journey toward enlightenment, and the concept of “sati,”—which encompasses attention, awareness, and being present—is considered the first step toward enlightenment. The term was roughly translated from the ancient language Pali into the term “mindfulness.” The emergence of mindfulness in Western culture can be attributed to Jon Kabat-Zinn. Kabat-Zinn studied mindfulness under several Buddhist teachers, such as Philip Kapleau and Thich Nhat Hanh. As a professor at the University of Massachusetts medical school in the late 1970s, Kabat-Zinn developed a program called Mindfulness-Based Stress Reduction (MBSR) to treat chronic pain. He discovered that patients would often try to avoid pain—but that that avoidance would lead to deeper distress. Practicing mindfulness was a more successful approach. As mindfulness shifted into mainstream science and medicine, it became a pivotal therapeutic technique; it was integrated into Mindfulness-Based Cognitive Therapy, Dialectical Behavior Therapy, and Acceptance and Commitment Therapy, among others. What is mindfulness? Created with Sketch. Mindfulness encompasses two key ingredients: awareness and acceptance. Awareness is the knowledge and ability to focus attention on one’s inner processes and experiences, such as the experience of the present moment. Acceptance is the ability to observe and accept—rather than judge or avoid—those streams of thought. What is the purpose of mindfulness? Created with Sketch. The goal of mindfulness is to cultivate perspective on one’s consciousness and identity that can bring greater peace mentally and relationally. Mindfulness may also be used in mindfulness-based therapies, to address stress, anxiety, or pain, and simply to become more relaxed. What is the history of mindfulness? Created with Sketch. Mindfulness has its origins in Buddhist and Hindu teachings, from which the concept “sati” was roughly translated to “mindfulness.” The practice was popularized in the West through the work of Jon-Kabat Zinn. Zinn created Mindfulness-Based Stress Reduction to treat pain, anxiety, and stress, and he ultimately brought mindfulness into mainstream clinical practice. What’s the difference between mindfulness and flow? Created with Sketch. Flow is a state in which one is completely absorbed in an activity and loses self-awareness. Flow and mindfulness both involve deep concentration—but only flow involves goal-directed behavior. While mindfulness channels concentration entirely toward the present moment, flow channels concentration toward skills and goal achievement, which might include thoughts of the past and future and judgment of those thoughts. What’s the difference between mindfulness and meditation? Created with Sketch. Mindfulness is one form of meditation. Meditation utilizes various practices to quiet the mind or achieve a higher level of consciousness, one of which is mindfulness. Mindfulness can be cultivated within or outside of formal meditation and woven into any activity, such as taking a walk or being engaged in conversation. article continues after advertisement if (!window.ptAdSlots || window.ptAdSlots.length === 0) { window.ptAdSlots = []; } window.ptAdSlots.push('div-gpt-ad-1404853927369-9') Practicing Mindfulness A person’s experience of time tends to be subjective and heavily influenced by their emotional state. Fears and insecurities about the past and the future can make it difficult to fully appreciate the present. The key is learning how to pay attention. Mindfulness can take place through meditation sessions or smaller moments throughout the day. To cultivate a state of mindfulness, you can begin by sitting down and taking deep breaths. Focus on each breath and the sensations of the moment, such as sounds, scents, the temperature, and the feeling of air passing in and out of the body. Shift your attention, then, to the thoughts and emotions that you’re experiencing. Allow each thought to exist without judging it or ascribing negativity to it. Sit with those thoughts. The experience may evoke a strong emotional reaction. Exploring that response can be an opportunity to address or resolve underlying challenges. How do I practice mindfulness? Created with Sketch. To cultivate awareness, observe your thoughts and emotions and explore why those specific ideas might be surfacing. To cultivate acceptance, avoid judging or pushing away unpleasant thoughts. Emotions are natural and everyone has them—acknowledging them can help you understand yourself better and move forward. How can I be more mindful? Created with Sketch. Mindfulness can help bring you into the present moment throughout the day. As you wake up, you can focus on your breathing and the way your body gradually becomes more energized. You can incorporate a brief meditation into your work day, perhaps on your lunch break, and focus and appreciate the experience of eating during meals. Why is mindfulness so popular? Created with Sketch. Mindfulness has been embraced by corporate leaders, sports teams, the military, and countless individuals around the world. The practice may owe its popularity to today’s fast-paced, technology-driven world, rife with financial and time pressures. Mindfulness may represent an unmet need for moments of quiet, contemplation, and calm. The Benefits of Mindfulness Mindfulness is frequently used in meditation and certain kinds of therapy. Its benefits include lowering stress levels, reducing harmful ruminating, and protecting against depression and anxiety. Research even suggests that mindfulness can help people better cope with rejection and social isolation. Does mindfulness really work? Created with Sketch. Review studies suggest that mindfulness-based interventions can help reduce anxiety, depression, and pain. To a lesser extent, they can alleviate stress and improve quality of life. However, inconsistencies in the way mindfulness is defined and measured make it difficult to determine whether mindfulness really provides other benefits. How does mindfulness help relieve anxiety? Created with Sketch. Mindfulness encompasses awareness and acceptance, which can help people understand and cope with uncomfortable emotions, allowing them to gain control and relief. To cultivate these skills, concentrate on breathing to lengthen and deepen your breaths. Foster an awareness of the five senses. Notice your thoughts and feelings, and practice curiosity and self-compassion. Can mindfulness help me break bad habits? Created with Sketch. Mindfulness can play a role in helping people break habits such as smoking or overeating. When a habit has developed, the trigger (hunger) prompts a behavior (eating) that leads to a reward (satisfaction). Becoming aware of the behavior and what is derived from it can help alter the reward and replace it with a healthier behavior. Can mindfulness help my relationship? Created with Sketch. Higher levels of mindfulness predict happier and more satisfying relationships, research suggests. It’s difficult to disentangle whether mindfulness directly caused those improvements, but mindfulness does benefit key relationship skills, such as being present and attentive, regulating emotions, being self-aware, and cultivating empathy and compassion. Essential Reads Well-Being: Be Your Own Superhero Americans value self-reliance. But our collective mental health might improve if we added more self-care and self-compassion to the mix. Why Mindfulness Matters: A New Lens for Viewing Happiness Discover how practicing mindfulness can shift your perspective on happiness, helping you embrace the present, manage emotions, and build a more flexible, fulfilling life. Why You Wake Up at 3 a.m., and How to Get Back to Sleep Falling and staying asleep can be a challenge. Here's how to get better at the staying asleep part. Cultivating Attention: The Heart of Therapeutic Transformation How mindfulness and ethical attention can transform therapeutic practice, empowering both clients and psychologists to embrace growth and meaning The Mental Blueprint of Champions Mental training that combines imagery with mindfulness can efficiently and effectively impact your performance in any field. No special equipment is needed, just your imagination. Mental training that combines imagery with mindfulness can efficiently and effectively impact your performance in any field. No special equipment is needed, just your imagination. The Best 1-Minute Mindfulness Practice for Reducing Stress Stress overwhelms quickly. Active mindful breathing can help you escape its scary, contorting grip, reversing the effects of stress in just minutes. Stress overwhelms quickly. Active mindful breathing can help you escape its scary, contorting grip, reversing the effects of stress in just minutes. Bound Up and Breaking Free While our powerlessness brings feelings of being tied up, literally, the notion of being bound is precisely what gives rise to set us in motion! While our powerlessness brings feelings of being tied up, literally, the notion of being bound is precisely what gives rise to set us in motion! Allow Yourself to Cultivate Awe Given the value of self-compassion, what might help people open the door to something that could powerfully help them, especially amid sudden, troubling circumstances? Given the value of self-compassion, what might help people open the door to something that could powerfully help them, especially amid sudden, troubling circumstances? How to Not Fight an Ocean: A DBT Skill We Can All Use Personal Perspective: Here's how to stop fighting reality by using the DBT skill of radical acceptance. Personal Perspective: Here's how to stop fighting reality by using the DBT skill of radical acceptance. The Art of Doing Less You wake up, grab your phone, and the race begins. But what if the real problem isn’t stress but never stopping? Research reveals that mindfulness isn’t a luxury. It’s survival. You wake up, grab your phone, and the race begins. But what if the real problem isn’t stress but never stopping? Research reveals that mindfulness isn’t a luxury. It’s survival. How Are You at Remembering Names? You Should Know This! Do you have trouble remembering the names of people that you meet? A recent study turns all that painful learning and forgetting on end. Do you have trouble remembering the names of people that you meet? A recent study turns all that painful learning and forgetting on end. 3 Ways to Declutter Your Life Believe decluttering is just a way to clean up your physical space? Think again. Believe decluttering is just a way to clean up your physical space? Think again. Don’t Forget to Breathe—and Listen to Some Music When we are feeling the stressors of the day, a little reset can do wonders. By taking five minutes for focused breathing, and listening to music, you can refresh, and refocus. When we are feeling the stressors of the day, a little reset can do wonders. By taking five minutes for focused breathing, and listening to music, you can refresh, and refocus. Unlocking Potential: The Leadership Imperative of Empathy Discover why empathy, vulnerability, and belonging aren’t just leadership buzzwords—they’re the key to unlocking potential and thriving in a world driven by human connection. Discover why empathy, vulnerability, and belonging aren’t just leadership buzzwords—they’re the key to unlocking potential and thriving in a world driven by human connection. 1 2 Next"
