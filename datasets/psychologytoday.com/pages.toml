["https://psychologytoday.com/us/basics/attachment"]
title = "Attachment | Psychology Today"
description = "Attachment is the emotional bond that forms between infant and caregiver, and it is how the helpless infant gets primary needs met. It then becomes an engine of subsequent social, emotional, and cognitive development. An infant's early social experience stimulates the growth of the brain and can influence the formation of stable relationships with others."
full_description = '''Attachment Bonding Reviewed by Psychology Today Staff Attachment is the emotional bond that forms between infant and caregiver, and it is how the helpless infant gets primary needs met. It then becomes an engine of subsequent social, emotional, and cognitive development. An infant's early social experience stimulates the growth of the brain and can influence the formation of stable relationships with others. Attachment provides the infant's first coping system; it sets up a mental representation of the caregiver in an infant's mind, which can be summoned as a comforting mental presence in difficult moments. Attachment allows an infant to separate from the caregiver without distress and explore the world around her. Neuroscientists believe that attachment is such a primal need that there are networks of neurons in the brain dedicated to setting it in motion in the first place and a hormone—oxytocin—that fosters the process. Attachment styles are not immutable, they can change substantially over time, research suggests, and may differ from relationship to relationship. Enduring a terrible relationship might lead to a less secure attachment orientation; a history of supportive relationships may lead to increased security. Therapy—providing a safe connection and an opportunity to learn relational skills—may also be helpful. Contents Early Attachment Attachment Styles Attachment in Early Life Attachment develops through everyday interactions as a caregiver attends to an infant's needs. The bond between infant and caregiver is usually so well established before the end of the first year of life that it is possible to test the nature and quality of the bond at that time. As a result of their work with many child-caregiver pairs, researchers have described several basic patterns of attachment. In their studies, researchers briefly separate young children from their caregiver and observe their behavior before and after they are reunited with the caregiver. Children with a secure attachment may be distressed upon separation but warmly welcome the caregiver back through eye contact and hug-seeking. Anxious-resistant attachment describes a child who is frightened by separation and continues to display anxious behavior once the caregiver returns. Avoidant attachment denotes a child who reacts fairly calmly to a parent’s separation and does not embrace their return. Disorganized attachment is manifest in odd or ambivalent behavior toward a caregiver upon return—approaching then turning away from or even hitting the caregiver—and may be the result of childhood trauma. A majority of children tend to show “secure” attachment behavior in studies, while others seem “insecure,” showing one of the other patterns. How does secure attachment develop? Created with Sketch. Secure attachment in children has been theorized to result from sensitive, responsive caregiving, and insecurity from its lack. While there is evidence that parenting can influence attachment security, it’s also clear that other factors—including genetics—play a formative role. What is attachment theory? Created with Sketch. British psychoanalyst John Bowlby proposed that children’s attachment behaviors (such as showing distress at a parent’s absence) are part of an evolved behavioral system that helps ensure they are cared for. Psychologist Mary Ainsworth later began to experimentally study variations in how children respond to separation from parents. Others have expanded attachment theory to adult relationships. How does trauma affect attachment? Created with Sketch. Abuse and trauma in childhood may hinder the development of secure attachment and may be predictive of attachment insecurity later in life. In cases of severe neglect or mistreatment, a child may develop reactive attachment disorder (RAD), characterized by difficulty forming a bond with caregivers. article continues after advertisement if (!window.ptAdSlots || window.ptAdSlots.length === 0) { window.ptAdSlots = []; } window.ptAdSlots.push('div-gpt-ad-1404853927369-9') Attachment Styles in Adulthood Attachment security and behaviors have been studied in adult relationships, and attachment-related patterns that differ between individuals are commonly called "attachment styles." There seems to be an association between a person’s attachment characteristics early in life and in adulthood, but the correlations are far from perfect. Many adults feel secure in their relationships and comfortable depending on others (echoing “secure” attachment in children). Others tend to feel anxious about their connection with close others—or prefer to avoid getting close to them in the first place. Studies of persons with borderline personality disorder, characterized by a longing for intimacy and a hypersensitivity to rejection, have shown a high prevalence and severity of insecure attachment. Attachment styles in adulthood have labels similar to those used to describe attachment patterns in children: Secure Anxious-preoccupied (high anxiety, low avoidance) Dismissing-avoidant (low anxiety, high avoidance) Fearful-avoidant (high anxiety, high avoidance) However, attachment styles may be better thought of as dimensional, where a person rates as relatively high, low, or somewhere in the middle in their levels of attachment-related anxiety and attachment-related avoidance. Also, a person may not exhibit the same kind of attachment pattern in every close relationship. How can you tell if someone has an insecure attachment style? Created with Sketch. A person may have high attachment anxiety if she worries a lot about being abandoned or uncared for. This is measurable by one’s agreement with statements such as “I worry about being alone” and “I often worry that romantic partners don’t really love me." Someone high in attachment avoidance likely worries about other people getting “too close.” How does attachment affect relationships? Created with Sketch. People with a secure attachment style tend to fare better on outcomes such as relationship stability and sexual satisfaction, research suggests, and may be less likely to engage in disruptive acts such as partner surveillance or harmful sexual behavior. Essential Reads Is Problematic Smartphone Use Predicted by Nomophobia? Some three quarters of students report that smartphones have detrimental effects on their ability to complete academic work. What's causing the problem? How Our Bonds With Pets Support Mental Health The attachment and caregiving systems explain the deep bonds we form with dogs, enhancing mental health through connection, purpose, stress reduction, and emotional healing. Breaking the Pursue/Withdraw Cycle: The Power of Response When any response is better than no response at all. Building Parent-Child Attachment: 3 Fundamental Concepts How do parental sensitivity, context, and development impact attachment? Awareness of these important concepts helps create an understanding of security in parent-child attachment. The Healing Power of Time-Out My toddler’s first time-out turned into a battle of wills, testing my parenting skills like never before. Would discipline drive us apart—or bring us closer? My toddler’s first time-out turned into a battle of wills, testing my parenting skills like never before. Would discipline drive us apart—or bring us closer? What Childhood Has to Do With Your Adult Relationships There is a good reason that psychologists ask about your childhood, and it's not about blaming your parents. Its about changing how you feel and react in close relationships. There is a good reason that psychologists ask about your childhood, and it's not about blaming your parents. Its about changing how you feel and react in close relationships. The Love That Exists in the Archives of Our Heart Romantic love is infused with a certain variability and impermanence, but its reality can "empirically" endure inside us. Romantic love is infused with a certain variability and impermanence, but its reality can "empirically" endure inside us. 2 Ways for Couples to Work Through "Retroactive Jealousy" Is your romantic past hindering your chances of building a loving future? Here's how you and your partner can overcome it together. Is your romantic past hindering your chances of building a loving future? Here's how you and your partner can overcome it together. So, You Cheated On Your Partner: Now What? After infidelity, take responsibility, allow your partner’s emotions, reflect on why it happened, and rebuild trust with honesty, boundaries, and consistent actions over time. After infidelity, take responsibility, allow your partner’s emotions, reflect on why it happened, and rebuild trust with honesty, boundaries, and consistent actions over time. Why Relationships Drift Relationships thrive not on perfection but on presence — on showing up fully, even when it’s uncomfortable. Relationships thrive not on perfection but on presence — on showing up fully, even when it’s uncomfortable. The Psychology Behind "Bridget Jones" and Dating Younger Men Bridget Jones dates younger men in a new hit rom-com movie, but is this just a romantic fantasy, or does research into attractiveness measure just how possible this might be? Bridget Jones dates younger men in a new hit rom-com movie, but is this just a romantic fantasy, or does research into attractiveness measure just how possible this might be? Why You Fought With Your Partner on Valentine’s Day From too-high expectations to fighting to feel closer, these are the top reasons couples get into it on Valentine's Day—and how to tone it down next year. From too-high expectations to fighting to feel closer, these are the top reasons couples get into it on Valentine's Day—and how to tone it down next year. 3 Signs That You're the "Parent" in Your Relationship No partner should have to play the part of a parent. Here's how to tell if you have fallen into that role. No partner should have to play the part of a parent. Here's how to tell if you have fallen into that role. Healing From Heartbreak Most people struggle with a broken heart at some point. These five strategies can help you learn from and move through a breakup so you'll be ready for your next relationship. Most people struggle with a broken heart at some point. These five strategies can help you learn from and move through a breakup so you'll be ready for your next relationship. 1 2 Next'''
