["https://psychologytoday.com/us/basics/affirmations"]
title = "Affirmations | Psychology Today"
description = "Affirmations are statements intended to build and maintain healthy self-esteem and to help foster a positive outlook on life. The positive psychology practice of self-affirmation aims to help people combat negative beliefs and restore trust in themselves—or simply like themselves again. Typically, self-affirmation is accomplished by way of short, positive statements repeated to oneself, whether aloud or not, on a regular basis—but that’s not the only way to achieve some of the benefits."
full_description = '''Affirmations Reviewed by Psychology Today Staff Affirmations are statements intended to build and maintain healthy self-esteem and to help foster a positive outlook on life. The positive psychology practice of self-affirmation aims to help people combat negative beliefs and restore trust in themselves—or simply like themselves again. Typically, self-affirmation is accomplished by way of short, positive statements repeated to oneself, whether aloud or not, on a regular basis—but that’s not the only way to achieve some of the benefits. Some therapists treating clients with depression, low self-esteem, anxiety, or other concerns may suggest daily affirmations, and some research suggests that affirmations, especially if they are the right affirmations—that is, those that truly reflect a person’s core values—can help them rebound. However, some clinicians are skeptical of the practice and certain clients may be especially unlikely to improve after trying affirmations. Contents What Is Self-Affirmation? Do Affirmations Work? What Is Self-Affirmation? Self-affirmation is the idea that when people can demonstrate, or remind themselves of, their personal adequacy, they can access mental-health benefits including a greater ability to manage threats to their self-worth. Reminding themselves of who they are, and what they value, can help them resist being triggered by negativity or challenges. Affirmations, according to advocates of the approach, are reminders that one's value is not contingent on others' critical feedback or on the negative outcome of any given event. How does a person decide what their affirmations will be? Created with Sketch. Research into self-affirmation finds that beneficial results are more likely achieved when a person is able to identify one, two, or three values that have personal significance to them—anything from love to justice to physical health, friendship, creativity, gratitude, or humor—and then take time to write about why the value or values matter to them. From there, on their own or working with a therapist, they can craft the particular statements they will use as affirmations. What are the best affirmations? Created with Sketch. There is no “best” affirmation; research suggests that people try out thoughts or statements that reflect the traits and values that hold the most significance for them. This could be feeling at peace, having confidence in their decision-making, being content with their life choices, trusting that they can handle whatever obstacles the day brings, or something more specific to their particular challenges of the moment. Affirmations should be in the first person and be positive, not negative (“I can be free from cigarettes” instead of “I don’t like smoking anymore”). Some research suggests that when someone faces a specific, bounded challenge, like passing a class, affirmations based on a growth mindset (“I can learn new things”) may lead to better results than those based on trait generalizations (“I am intelligent”). Does it help to say affirmations out loud each day? Created with Sketch. It might, but once a person has discovered affirmations that resonate with them—“I am enough,” “I love myself,” “I deserve success”—they can say them out loud, think them to themselves, or write them down and take them out of their pocket when they feel they need a reminder. Does someone have to say affirmations out loud every day to reap the benefits? Created with Sketch. No. In fact, people may not even need to make statements to self-affirm. Some research suggests that consciously and regularly taking part in activities based on one's values and that promote one’s identity and sense of self—such as time with friends or family, volunteer activities, or religious or cultural engagement—can provide many of the benefits of affirmations. article continues after advertisement if (!window.ptAdSlots || window.ptAdSlots.length === 0) { window.ptAdSlots = []; } window.ptAdSlots.push('div-gpt-ad-1404853927369-9') Do Affirmations Work? Studies using magnetic resonance imaging have shown that during self-affirmation tasks, regions of the brain involved in emotional processing, decision-making, self-perception, and social cognition become more active. Other research has found that people prompted to write about the values most personally important to them later performed better on stress-inducing problem-solving tasks than others. And other studies show that affirmations can help people enhance self-control, improve academic achievement, adopt healthier habits, and reduce prejudice. Why might affirmations not work? Created with Sketch. While a good deal of research supports the practice of self-affirmation for many, some studies find that affirmations may backfire, primarily because people with especially low self-esteem may find it too challenging to believe that the affirmations they state are true. For example, someone experiencing poor body image who is asked to repeat “I love my body,” despite not believing it, may end up feeling even worse. Why are some therapists skeptical about affirmations? Created with Sketch. Affirmations have helped many, but for individuals with clinically diagnosable mental-health conditions, including some with major depressive disorder, trying affirmations and not achieving positive progress can lead them to feel even worse, as they may feel that their condition is “all in their head” and so, if positive statements could not address it, that represents a personal failing. Is a self-affirmation the same as a mantra? Created with Sketch. Not exactly. Mantras and affirmations have different goals. A mantra is a phrase or statement meant to help someone block out external thoughts and distractions so they can relax or concentrate as part of a mindfulness or meditation practice. Is affirming the same as manifesting? Created with Sketch. No. Manifesting is the notion that, through the power of one’s own belief, one can think, or "manifest," a hope, goal, or dream into reality. As such, it’s a form of what’s known as magical thinking. Manifesting is based on the idea that people’s thoughts can affect the external world (which they cannot) while affirmations are focused on the more achievable goal of changing one’s internal world for the better. Essential Reads The Pain of Loss Becomes Part of Life Personal Perspective: Some things don't get much easier, so the best we can do is just accept that they are hard. How to Feel Better Quickly When Something Makes You Feel Bad A recent study concludes that beliefs about the benefits of self-affirmation impact the use of this coping strategy for dealing with self-threats. Research Supports Morning Affirmations: Rise and Shine! Even if you’re not sure about the power of self-affirmations, the science behind them is—when used correctly, they can significantly affect your mindset and behavior. The Science Behind Self-Affirmations Years of research show promise for self-affirmations as an intervention. The Hidden Impact of Appreciation Appreciation strengthens relationships, boosts well-being, and fosters teamwork. A simple “thank you” creates a ripple effect of positivity. Start today—your impact matters! Appreciation strengthens relationships, boosts well-being, and fosters teamwork. A simple “thank you” creates a ripple effect of positivity. Start today—your impact matters! 5 Practical Ways to De-Escalate Emotional Distress How do you manage individuals in distress? Research and practical experience provide some guidance. How do you manage individuals in distress? Research and practical experience provide some guidance. The Words That Can Disarm Difficult People It’s not what you say but how you say it. In the throes of emotional conversation, we can bond through building rapport. It’s not what you say but how you say it. In the throes of emotional conversation, we can bond through building rapport. Random Acts of Kindness Random Acts of Kindness Week is February 9-15. Learn more about the considerable benefits of kindness here. Random Acts of Kindness Week is February 9-15. Learn more about the considerable benefits of kindness here. The Search for Self-Respect A Personal Perspective: Accepting and loving yourself is not enough to achieve healing and wholeness. You need self-respect. A Personal Perspective: Accepting and loving yourself is not enough to achieve healing and wholeness. You need self-respect. 3 Steps to Resilient, Enduring and Fulfilling Love Our closest relationships promise us great rewards and we enrich them by bringing a full representation of who we are. Our closest relationships promise us great rewards and we enrich them by bringing a full representation of who we are. We Can Have an Impact A Personal Perspective: Decency becomes a growing intention, one person at a time, one situation following another. A Personal Perspective: Decency becomes a growing intention, one person at a time, one situation following another. It's Time to Re-evaluate Envy When study participants read texts about successful fictional characters and described whether they felt envy or admiration, those who experienced envy recorded more details. When study participants read texts about successful fictional characters and described whether they felt envy or admiration, those who experienced envy recorded more details. Failure as a Natural State Failure is often seen as a roadblock, but what if it's a natural part of growth? What if embracing our past missteps is the key to moving forward? Failure is often seen as a roadblock, but what if it's a natural part of growth? What if embracing our past missteps is the key to moving forward? Journaling: The Hidden Daily Routine Journaling provides an outlet for self-reflection, emotional processing, and personal growth, with the potential to increase self-awareness, empowerment, and social connection. Journaling provides an outlet for self-reflection, emotional processing, and personal growth, with the potential to increase self-awareness, empowerment, and social connection. 1 2 Next'''
