title = "Neurodiversity | Psychology Today"
description = "Neurodiversity refers to the idea that neurological differences, such as those seen in autism or ADHD, reflect normal variations in brain development. Neurodiversity is often contrasted with the “medical model,” which views conditions like autism or ADHD as disorders to prevent, treat, or cure. There has been a push to move away from this idea of pathology and more toward a more nuanced perspective with variations of what is “normal.”"
full_description = '''Neurodiversity Reviewed by Psychology Today Staff Neurodiversity refers to the idea that neurological differences, such as those seen in autism or ADHD, reflect normal variations in brain development. Neurodiversity is often contrasted with the “medical model,” which views conditions like autism or ADHD as disorders to prevent, treat, or cure. There has been a push to move away from this idea of pathology and more toward a more nuanced perspective with variations of what is “normal.” Contents Who Is Neurodiverse? Neurodiverse and Brilliant Who Is Neurodiverse? The word neurodiversity—a portmanteau of “neurological” and “diversity”—was first coined in the 1990s by Australian social scientist Judy Singer, who is herself on the autism spectrum. It has gained significant ground in recent years, particularly among advocacy communities. The term originally referred most commonly to autism but has since come to include ADHD, dyslexia, Tourette's, synesthesia, as well as other learning and developmental differences. Does society pathologize the neurodiverse population? Created with Sketch. The neurodiversity paradigm suggests that, because neurological differences are normal and have existed throughout human history, they should be respected, understood, and supported, rather than pathologized or viewed as disordered. There is nothing to cure. Modifying the environment of a neurodiverse individual, reducing stigma, and prioritizing each person’s inherent dignity will, proponents argue, allow for such individuals to discover innate talents and thrive within a diverse society. Should low-functioning, severe autism be viewed separately? Created with Sketch. Parents of children with severe autism argue that portraying the autism spectrum as just “different” minimizes the challenges that many autistic individuals and their caretakers face. They point out that those with extreme neurological differences are simply not capable of caring for themselves. The opposing argument says that neurodiversity can help the severely autistic, not hurt them. They propose that seeing severely affected individuals from a traditional medical perspective hurts everyone. Why is neurodiversity controversial? Created with Sketch. The neurodiversity paradigm has generated controversy, particularly in the autism community. Proponents of neurodiversity—many of whom have high-functioning autism or a similar difference—argue that the traditional medical model dehumanizes people with neurological differences and strips them of the ability to determine their own best interests. However, disagreement has been voiced particularly by parents of children with low-functioning or severe autism as well as related conditions. Parents feel that their children suffer from being marginalized and that their needs are left unheard. Is there a bridge between high function and low function? Created with Sketch. High-functioning Asperger's syndrome and low-functioning autism disorder have been removed from the DSM, which now lists only one category, autism spectrum disorder. However, the gap between high-functioning and low-functioning can be wide. Some experts, including researcher Simon Baron-Cohen, argue that a middle ground could be reached between the two views, with better explanations of what constitutes different and disabled, and what it means to have a “normal” brain. article continues after advertisement if (!window.ptAdSlots || window.ptAdSlots.length === 0) { window.ptAdSlots = []; } window.ptAdSlots.push('div-gpt-ad-1404853927369-9') Neurodiverse and Brilliant In one study of child prodigies, researchers found that these children scored high in autistic traits. For example, their attention to detail was on the obsessive end, which is a hallmark of the autism spectrum. The Austrian pediatrician and medical theorist Hans Asperger—after whom the syndrome was named—even referred to children with precocious aptitude as "little professors.” What is a savant? Created with Sketch. Some neurodiverse individuals have keen memory and recall, others are prodigious at math. These savants are often hyper-focused on details and may have a specialized interest. One example is Rubik’s cube speed solver Max Park, who was diagnosed at a young age with autism. He is a world champion who set world records solving the puzzle, even with just one hand. What does Rain Man mean? Created with Sketch. The term Rain Man is a derogatory term that identifies a mentally and, or, socially impaired individual; it’s also a term that often refers to autistic individuals. The term was highlighted in the 1988 film of the same name. The story was based on the life of Kim Peek, who was considered a megasavant but was not known to be autistic. He had a prodigious memory even at the early age of 16 months. In later years, he was able to read an entire book in an hour and retain the information in it. He could also read the left page of a book with his left eye, as well as the right page with his right eye. Peek was thought to have FG syndrome, whereby one or more recessive genes are located on the X chromosome. Can neurodiverse individuals find employment? Created with Sketch. People in this community may have genius IQ scores, yet unemployment or underemployment among them has been high—even chronically high. However, some companies are waking up to the value of employing neurodiverse individuals. These people are seen as useful in areas including data, IT, software design, car design, product-testing, and other skilled fields. Which companies hire neurodiverse employees? Created with Sketch. To increase the diversity of its workforce, Microsoft developed a hiring program geared solely toward those on the spectrum—people who would never make it through a standard phone interview. Some of the roles filled at Microsoft include software engineer, lab engineer, data analyst, and data scientist. The company has hired more than 100 people on the spectrum. In Germany, the technology company SAP moved on an initiative to hire hundreds of individuals on the spectrum as software engineers and product-testers. Other companies that hire the neurodiverse include Goldman Sachs, JPMorgan Chase, Dell, among others. With big corporations taking this lead, perhaps smaller organizations will follow. Essential Reads Neurodivergence and the Myth of Laziness Unpacking the myth of laziness, the reality of neurodivergent struggles, and how to work with your brain—not against it. How Neurodivergence Overlaps with Addiction Research indicates a significant overlap between autism spectrum disorder and addiction. The explanation of this turns on recognizing the neurodiversity inherent in addiction itself. The Power of Representation When Joanna watched "The Good Doctor," she saw herself in a way she never had before—and it changed everything. Why Neurodivergent Women Struggle With Impostor Feelings Many neurodivergent women face late diagnoses, masking, and self-doubt. Overcoming impostor feelings means embracing identity, rejecting stereotypes, and trusting lived experience. Right Brain vs. Whole Brain: How Creativity Really Works New research debunks the myth that creativity is a "right brain" activity. New research debunks the myth that creativity is a "right brain" activity. The Female Neurodivergent Experience Neurodivergence in women isn’t static—it evolves with life’s transitions. From school to career to motherhood, challenges shift in intensity, requiring new strategies and support. Neurodivergence in women isn’t static—it evolves with life’s transitions. From school to career to motherhood, challenges shift in intensity, requiring new strategies and support. Reading After All These Years Personal Perspective: Joanna hadn't read for pleasure in almost 50 years. Now that she has started, nothing is stopping her. Personal Perspective: Joanna hadn't read for pleasure in almost 50 years. Now that she has started, nothing is stopping her. Is Your Teen Neurodiverse? Neurodivergent teens process the world differently. Early support, structure, and self-advocacy help them thrive in school and social life and improve their emotional well-being. Neurodivergent teens process the world differently. Early support, structure, and self-advocacy help them thrive in school and social life and improve their emotional well-being. Neurodiversity Affirming Assessments for Autism and ADHD With the explosion of the neurodiversity movement, many autistic and ADHD adults are finally getting answers about themselves. Formal assessments can be an important piece of the puzzle. With the explosion of the neurodiversity movement, many autistic and ADHD adults are finally getting answers about themselves. Formal assessments can be an important piece of the puzzle. 8 Tenets of Dynamic Friendship for Neurodivergent Women Neurodivergent women navigate friendships in unique ways. Learn science-backed strategies to build connections that honor your needs, energy, and authenticity. Neurodivergent women navigate friendships in unique ways. Learn science-backed strategies to build connections that honor your needs, energy, and authenticity. A Neurodiversity Affirmative Approach for Professionals Neurodivergent brains and people are unique and awesome. It is recommended to take a neurodiversity affirmative approach and be awed, humble, and respectful toward them. Neurodivergent brains and people are unique and awesome. It is recommended to take a neurodiversity affirmative approach and be awed, humble, and respectful toward them. What if Everyone Were Autistic? A Personal Perspective: With so many initiatives to help autistic people adjust to a neurotypical world, I sometimes wonder what the world might look like if roles were reversed. A Personal Perspective: With so many initiatives to help autistic people adjust to a neurotypical world, I sometimes wonder what the world might look like if roles were reversed. Children With Disabilities Have a Right to Be Held Accountable Too Accountability for one's choices is an essential skill and one that shouldn't be denied to kids with disabilities. Accountability for one's choices is an essential skill and one that shouldn't be denied to kids with disabilities. Self-Compassion Practice for Parents of Autistic Children Self-compassion practices can help parents of autistic children to manage stress, nurture well-being, and create a more resilient environment for their families. Self-compassion practices can help parents of autistic children to manage stress, nurture well-being, and create a more resilient environment for their families. 1 2 Next'''
