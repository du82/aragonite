["https://psychologytoday.com/us/basics/emotional-intelligence"]
title = "Emotional Intelligence | Psychology Today"
description = "Emotional intelligence refers to the ability to identify and manage one’s own emotions, as well as the emotions of others. Emotional intelligence is generally said to include a few skills: namely emotional awareness, or the ability to identify and name one’s own emotions; the ability to harness those emotions and apply them to tasks like thinking and problem solving; and the ability to manage emotions, which includes both regulating one’s own emotions when necessary and helping others to do the same."
full_description = '''Emotional Intelligence Reviewed by Psychology Today Staff Emotional intelligence refers to the ability to identify and manage one’s own emotions, as well as the emotions of others. Emotional intelligence is generally said to include a few skills: namely emotional awareness, or the ability to identify and name one’s own emotions; the ability to harness those emotions and apply them to tasks like thinking and problem solving; and the ability to manage emotions, which includes both regulating one’s own emotions when necessary and helping others to do the same. Contents The Roots of Emotional Intelligence How to Cultivate Emotional Intelligence The Roots of Emotional Intelligence The theory of emotional intelligence was introduced by Peter Salovey and John D. Mayer in the 1990s, and further developed and brought to the lay public by Daniel Goleman. The concept, also known as emotional quotient or EQ, has gained wide acceptance. However, some psychologists argue that because EQ cannot be captured via psychometric tests (as can, for example, general intelligence), it lacks true explanatory power. How self-aware is an emotionally intelligent person? Created with Sketch. The emotionally intelligent are highly conscious of their own emotional states, even negative ones—from frustration or sadness to something more subtle. They are able to identify and understand what they are feeling, and being able to name an emotion helps manage that emotion. Because of this, the emotionally intelligent have high self-confidence and are realistic about themselves. Do the emotionally intelligent have a better handle on self-regulation? Created with Sketch. A person high in EQ is not impulsive or hasty with their actions. They think before they do. This translates into steady emotion regulation, or the ability to reduce how intense an emotion feels. Taking anger or anxiety down a notch is called down-regulation. The emotionally intelligent are able to shift gears and lighten mood, both internally and externally. Are the emotionally intelligent tuned into the emotions of others? Created with Sketch. Such people are especially tuned into the emotions that others experience. It’s understandable that sensitivity to emotional signals both from within oneself and from one's social environment could make one a better friend, parent, leader, or romantic partner. Being in tune with others is less work for others. Are the emotionally intelligent more empathic? Created with Sketch. This person is able to recognize and understand the emotions of others, a skill tied to empathy. The person with a high EQ can hear and understand another person’s point of view clearly. The empathic are generally supportive of the people in their lives, and they easily modulate their emotions to match the mood of another person as well. Is emotional intelligence a valid construct? Created with Sketch. This is a subject of active debate within the field. Some personality psychologists argue that emotional intelligence can be more parsimoniously described by traits such as agreeableness, and even charisma. A highly charismatic person, for example, is socially adept and can quickly read a room. article continues after advertisement if (!window.ptAdSlots || window.ptAdSlots.length === 0) { window.ptAdSlots = []; } window.ptAdSlots.push('div-gpt-ad-1404853927369-9') How to Cultivate Emotional Intelligence We are naturally drawn to a person with high EQ. We are comfortable and at ease with their easy rapport. It feels as though they can read social cues with superhuman ability. Perhaps they can even mind-read how other people feel to some extent. This effortlessness is welcome in all domains of life—at home, in social settings, and at work. Who wouldn’t want a boss who understood how you are feeling and what you are trying to accomplish? Can I learn to be more emotionally intelligent? Created with Sketch. Yes, you can. You can start by learning to identify the emotions you are feeling as well as understanding them. If you are able to name the emotion you are feeling, you have a better chance of understanding what you are feeling. You can also learn to better regulate your emotions just by stopping and thinking before you act and judge. These skills will help you martial inner resolve and stick to what really matters in life. Are the emotionally intelligent higher performers in the workplace? Created with Sketch. While some studies have found a link between emotional intelligence and job performance, many others have shown no correlation whatsoever, and the lack of a scientifically valid scale makes it difficult to truly measure or predict how emotionally intuitive a person may be on the job or in other areas of life. Are the emotionally intelligent more motivated? Created with Sketch. These people are able to mobilize and utilize their emotions, and they are motivated to manage tasks and problem-solve obstacles. They are connected to who they are and what they value in life, which are foundational for prioritizing and reaching any objective or goal. Knowing what matters is crucial for productivity. Can you test for emotional intelligence in the workplace? Created with Sketch. In recent years, some employers have incorporated emotional intelligence tests into their application and interview processes, on the theory that someone high in emotional intelligence would make a better leader or coworker. However, it is not clear if these measures are accurate or even useful. Can emotional intelligence be measured? Created with Sketch. Testing for EQ in the workplace, for example, is difficult because there is no validated psychometric test or scale for emotional intelligence as there is for the general intelligence factor—and many argue that emotional intelligence is therefore not an actual construct, but a way of describing interpersonal skills. Essential Reads The Words That Can Disarm Difficult People It’s not what you say but how you say it. In the throes of emotional conversation, we can bond through building rapport. 3 Things Emotionally Intelligent People Do and 3 They Don’t Emotionally intelligent people are generally happier in life and more satisfied with their relationships. Often, it is because they consistently do these three things. Sharing Without Losing: The Abundance of Love and Trust Some instances in life are zero-sum—there can only be one winner or recipient. Children and adults do not view social resources as necessarily zero-sum. How Do You Read Emotional Cues? Why do people often disagree about others' emotions? New research reveals we have stable individual differences in how much we rely on faces versus context. Is It Ever Too Early to Focus on Emotional Well-Being? Because little kids often have big emotions, even the very young can benefit from strategies that strengthen self-compassion and bolster self-esteem. Because little kids often have big emotions, even the very young can benefit from strategies that strengthen self-compassion and bolster self-esteem. The Future of Your Mental Health on Artificial Intelligence Are you concerned about how artificial intelligence will impact your mental health? Here's how we can utilize AI in safe and productive ways. Are you concerned about how artificial intelligence will impact your mental health? Here's how we can utilize AI in safe and productive ways. The Power of Staying and Working It Out When “cutting off toxic people” is a common trope, choosing to stay and work through conflict can be a radical act of love and resilience. When “cutting off toxic people” is a common trope, choosing to stay and work through conflict can be a radical act of love and resilience. Navigating Emotional Agility Through Classical Music Use mindful listening to classical music to practice emotional agility, the essential skill of knowing how much effort and which emotion to lead with. Use mindful listening to classical music to practice emotional agility, the essential skill of knowing how much effort and which emotion to lead with. Why Joy Matters More Than Happiness, for Both Kids and Adults A key element in raising resilient, thriving, and confident kids starts with something deeper—and it's not about just making sure they're happy. A key element in raising resilient, thriving, and confident kids starts with something deeper—and it's not about just making sure they're happy. What Makes Us Human? How We Differ From Artificial Intelligence Artificial intelligence (AI) is getting smarter, but it will never replace what makes us human. Discover the traits that keep us indispensable in an AI-driven world. Artificial intelligence (AI) is getting smarter, but it will never replace what makes us human. Discover the traits that keep us indispensable in an AI-driven world. How To Prevent Unhealthy Narratives in Your Child The recipe for undoing an unhealthy narrative isn’t what you might guess, but it’s not hard. Here are specific strategies to help kids form lasting, healthy narratives. The recipe for undoing an unhealthy narrative isn’t what you might guess, but it’s not hard. Here are specific strategies to help kids form lasting, healthy narratives. Can Journaling Help to Heal Childhood Trauma? What we've learned about the effect of expressive writing on traumatic memories. What we've learned about the effect of expressive writing on traumatic memories. Why Narcissists Target Emotionally Intelligent People 3 reasons why a narcissist fixates and targets the emotionally intelligent. 3 reasons why a narcissist fixates and targets the emotionally intelligent. How to Offer Emotional Validation (and How Not to) When someone is struggling, they crave emotional validation—but not at the cost of truth. Avoid the trap of "lightgassing." When someone is struggling, they crave emotional validation—but not at the cost of truth. Avoid the trap of "lightgassing." 1 2 Next'''
