["https://pubmed.ncbi.nlm.nih.gov/39938514"]
title = "Neutrophil-derived vesicles control complement activation to facilitate inflammation resolution"
description = "Although subsets with immunosuppressive properties exist, neutrophils are typically known for their pro-inflammatory role and pathogen clearance capabilities. Here, we reveal that neutrophils can paradoxically aid in resolving inflammation by actively producing anti-inflammatory extracellular vesicl …"
full_description = 'Abstract Although subsets with immunosuppressive properties exist, neutrophils are typically known for their pro-inflammatory role and pathogen clearance capabilities. Here, we reveal that neutrophils can paradoxically aid in resolving inflammation by actively producing anti-inflammatory extracellular vesicles. These large aging-neutrophil-derived vesicles (LAND-Vs) do not fit into classical vesicle categorizations due to their specific size, structure, or biogenesis pathway. They are protected from efferocytotic clearance by phagocytes due to surface "do not eat me" signals and accumulate in the resolution phase of inflammation. CD55 on LAND-Vs exerts a robust, sustained anti-inflammatory effect by inhibiting complement 3 convertase, thereby reducing neutrophil recruitment and tissue damage. CD55+ LAND-Vs originate in ordered lipid raft domains, where CD55 accumulates asymmetrically during neutrophil aging, and are subsequently formed through RhoA-dependent budding. Collectively, LAND-V emerges as a pivotal physiological immunomodulator and showcases functions that transcend the limited lifespan of neutrophils, offering a therapeutic target for inflammatory and infectious diseases. Keywords: CD55; COVID-19; aging; complement; do not eat me signal; extracellular vesicles; inflammation resolution; lung injury; neutrophils; pneumonia.'
year_published = 2025
clearnet = "https://pubmed.ncbi.nlm.nih.gov/39938514"
