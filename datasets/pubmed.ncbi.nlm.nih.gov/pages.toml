["https://pubmed.ncbi.nlm.nih.gov/39933514"]
title = "Lactate controls cancer stemness and plasticity through epigenetic regulation"
description = "Tumors arise from uncontrolled cell proliferation driven by mutations in genes that regulate stem cell renewal and differentiation. Intestinal tumors, however, retain some hierarchical organization, maintaining both cancer stem cells (CSCs) and cancer differentiated cells (CDCs). This heterogeneity, …"
full_description = "Abstract Tumors arise from uncontrolled cell proliferation driven by mutations in genes that regulate stem cell renewal and differentiation. Intestinal tumors, however, retain some hierarchical organization, maintaining both cancer stem cells (CSCs) and cancer differentiated cells (CDCs). This heterogeneity, coupled with cellular plasticity enabling CDCs to revert to CSCs, contributes to therapy resistance and relapse. Using genetically encoded fluorescent reporters in human tumor organoids, combined with our machine-learning-based cell tracker, CellPhenTracker, we simultaneously traced cell-type specification, metabolic changes, and reconstructed cell lineage trajectories during tumor organoid development. Our findings reveal distinctive metabolic phenotypes in CSCs and CDCs. We find that lactate regulates tumor dynamics, suppressing CSC differentiation and inducing dedifferentiation into a proliferative CSC state. Mechanistically, lactate increases histone acetylation, epigenetically activating MYC. Given that lactate's regulation of MYC depends on the bromodomain-containing protein 4 (BRD4), targeting cancer metabolism and BRD4 inhibitors emerge as a promising strategy to prevent tumor relapse. Keywords: cancer metabolism; cell plasticity; cell types; cell-cell interactions; differentiation; heterogeneity; live imaging; organoids; single-cell tracking; stem cells."
