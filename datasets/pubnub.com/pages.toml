title = "SDKs Documentation | PubNub Docs"
description = "Discover PubNub's SDK documentation for seamless app development across various platforms. Streamline your process with powerful tools."
full_description = "On this pageSDKs DocumentationPubNub offers a comprehensive suite of development toolkits, each designed to integrate with the PubNub API for seamless real-time communication features. Most Popular​ This collection covers key programming languages like JavaScript, Python, and Swift alongside platforms such as Android, iOS, and Unity for game development. It will help you integrate real-time communication across various tech stacks for both frontend and backend development, including mobile, web, and server-side apps. JavaScript Java Kotlin Dart Go Swift Objective-C C# Python Unreal Engine Unity C-core PHP Ruby Rust REST API Core vs Chat Client​ These client application development tools include support for mobile kits such as Swift for iOS and Kotlin for Android, and JavaScript for web apps. By applying the pub/sub integration to deliver content dynamically, these SDKs let you build interactive and responsive chat applications, real-time analytics, software integrations in finance, and more. JavaScript Kotlin Java Swift Objective-C Unity Redux C# C# PCL Dart Asyncio Cocoa Swift Cocoa IoT Device Control​ The section lists app development tools designed for direct control and management of devices for IoT projects. These software packages enable integration with a wide range of hardware, supporting real-time data exchange and device management. They can can serve as valuable resources in such sectors as agriculture for remote monitoring systems, smart cities for IoT infrastructure, and home automation for smart devices. POSIX C Python RaspberryPi mbed C# PCL Atmel SAMA5D3 Atmel SAM D21 Electric Imp FreeRTOS Microchip PIC32 MPLAB Harmony PIC32 POSIX C POSIX C++ Rust Qt TI MSP430 F5529 w/ CC3100 TI CC3200 LaunchPad (Energia) MQTT Support Server​ Browse through the technical documentation on server SDKs to learn how to efficiently manage backend services and server-to-server communications. These development toolkits are essential for building scalable, secure backends by enabling server tasks like processing analytics, managing user authentication, and handling database operations. You can apply them in scenarios where server efficiency and reliability are crucial, such as financial services, cloud-based platforms, and large-scale web applications. Node.js C# Ruby Rust Python Lua Go PHP POSIX C POSIX C++ Qt Windows C Windows C++ Call For Contributions​ The following SDKs, software libraries, frameworks, and docs are no longer officially supported and are open for contributions from our community members. Contact support for more information on how you can contribute. Adobe ColdFusion Android Angular2 AngularJS Arduino Axway Appcelerator BlackBerry CodeName One Erlang Google Web Toolkit Impact Java ME for Symbian Kinoma Create LinkIt ONE Monkey X Parse Perl 5 PhoneGap React Qooxdoo Samsung Smart TV Scala Sencha Touch Socket.IO Twisted Vue WebOS Android Chat Components iOS Chat Components React Chat Components React Native Chat Components Last updated on Feb 17, 2025"
