title = "Real-time decisioning and analytics for video games | PubNub"
description = "PubNub Illuminate - a real time decisioning and analytics solution for games companies who need to take immediate actions in their games"
full_description = '''Illuminate for Gaming Accelerate game evolution and monetization in real time Map the KPIs that are important to your game, trigger decisions based on player behaviors, and see instant outcomes — all without burdening your dev team Contact Sales Put the power of real-time experimentation into the hands of the teams directly responsible for growth and the company's bottom lineWATCH ILLUMINATE IN ACTION Act on player behavior in milliseconds, see the results instantly and then iterate again INNOVATION IS HEREA solution made for Product Managers, so you can keep your engineering team focused on building your game, not coding experimentsIn-the-moment actionability is made easy with IlluminateRun targeted monetization experiments in channels and see immediate resultsSend personalized recommendations immediately based on player actions as they happenTrigger actions based on user or cohort behaviors, and see instant outcomesImprove fraud detection and identify and act upon suspicious behavior in real-timeTake the weight off of the dev team by setting up and implementing actions no-/low-codeSee the impact of your actions in real time with live charts and graphs Stop the cycle of missed opportunities that impact your game's success5 Ways Illuminate Will Revolutionize Online GamingTransform your online game into a dynamic, engaging, and monetarily successful platform.Illuminate + Gaming One PagerReal-time decisioning and analytics that gives you the power to to observe, respond, and refine your game's strategy.PubNub Illuminate Documentation Check out our documentation to learn how to set-up and best practices when using Illuminate for your app. You're in good company Hear what our customers have been saying about Illuminate“As a gaming pioneer that has continually been at the forefront of innovation, we’re excited about the potential of PubNub Illuminate,” said Nikolay Dimitrov, Technical Director of Gameloft Sofia. “Gameloft has more than 55 million unique users per month on our various games, so the ability for our LiveOps managers to leverage tactical real-time decisioning and analytics (through a no-code interface) is compelling." - Nikolay Dimitrov, Technical Director "The power to make real-time decisions is a fantastic opportunity for game makers to create iconic moments in response to individual or collective player action. We're excited to partner with PubNub on the launch of Illuminate, and to equip game teams with the ability to deliver spontaneous gameplay that delights players and captures their imagination."- Ali El Rhermoul, Co-Founder & CTOFrequently asked questions Does my real-time app need to be powered by PubNub to use Illuminate? How is Illuminate different than my standard analytics tools? How can I try out Illuminate?Talk to an ExpertLet's connect to discuss your real-time project.First Name *Last Name *Business Email Address *Subscribe to PubNub Newsletter & UpdatesSubmitBy submitting this form, you are agreeing to our Terms and Conditions and Privacy Policy.(self.__next_s=self.__next_s||[]).push(["https://cdn.leandata.com/js-snippet/ld-book-v2.js",{}])(self.__next_s=self.__next_s||[]).push(["https://www.pubnub.com/js/forms2/js/forms2.min.js",{}])'''
