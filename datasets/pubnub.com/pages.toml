title = "Real-time Blockchain and Web3 Data Communications  | PubNub"
description = "PubNub is here to support the new wave of technology - Web3"
full_description = "BLOCKCHAIN & WEB3Real-time data communications for blockchain Securely stream data to and from blockchain-based smart contracts and seamlessly deliver time-critical updates and alerts Contact Sales Try for Free Increase adoption of blockchain and apps while creating a real-time bridge between what happens in the real world and what happens virtuallySecurely stream real-time dataPubNub allows you to securely stream real-time data to/from blockchain-based smart contracts - from inventory and price feeds to sensor dataTrigger and deliver time-critical alerts Build time-critical alerts and notifications for price fluctuations, transactions, balance updates, security concerns, etc.Reliably route data Securely and reliably route your data to off-chain caching and analyticsCapabilities to support your Web3 real-time interactionsReal-Time Notifications Many Web3 products need to alert the user(s) in real-time when someone sends them a Web3 transaction, when a Web3 transaction is finished, and when the user’s wallet is updated. Since Web3 is, by design, an asynchronous set of technologies, it doesn’t have any built-in mechanism for alerting users when something has occurred. PubNub covers these real-time requirements. Chat/Collaboration Many Web3 products want a collaboration/chat layer for user-to-user communication related to Web3 use cases.Game Player SyncMany Web3 products are simply games that leverage Web3 concepts, and like any other game, PubNub can be useful for synchronizing game player turn-by-turn movements, leaderboards, and other game dynamics in a scalable, compliant way.Talk to an expert Contact Sales"
