full_description = "CHATBuild communities with live chat functionality Provide chat experiences your users need, built the way you want. Contact Sales Try for Free Build your exact vision with chatBe rewarded for your growthPubNub has no concurrency or channel limits, so you can build and scale into the future without worrying about breaking the bank.Quickly incorporate logic on your messagesFunctions are serverless and enable the creation and execution of business logic on messages at the edge of the network.Have an extension to your Engineering teamPubNub provides 24/7 support across the globe and a dedicated Solution Architects team who will help develop a plan with you.See what you can create using PubNub softwareCheck out our DemosExplore how you can build a feature-rich chat and team collaboration application using PubNub Chat. Explore our Demos Explore our Tutorials This in-app chat tutorial demonstrates how to quickly set up and build a simple standalone chat application. Start Building FEATURESWhy PubNub?Our standard messaging features allow you to build direct, group, and large scale chat without needing to maintain the infrastructure and backend yourself. Explore how to build with Docs UsersManage user metadata, permissions, presence, and mentionsMessagesManage real-time, historical, and unread messages. Handle files, reactions, and eventsPush NotificationsIntegrate mobile devices with 3rd party push services (FCM or APNs) to trigger push notifications ChannelsUnlimited secure channels for direct or group messagingModerationModerate messages for profanity and spam. Flag messages, ban or mute usersFilesCreate the ability to share images, files, and documents to one or more other chat usersIntegrationsMonitor content and images, add on-the-fly translation, chatbots, GIFs and stickers librariesNo-code ToolsEasily manage users, channels, and their relationships through a no-code interfaceGet to market quickly with our Chat SDKOur Chat SDK provides a number of out-of-the-box chat features like read receipts, @mentions, and unread message counts, that can be easily integrated with your own UI, cutting down on the amount of time needed to develop a high-quality, custom chat experience. Learn more about our Chat SDK Manage and moderate your chat with BizOps WorkspaceBizOps Workspace offers no-code tools designed to manage and moderate chat apps powered by PubNub. Effortlessly manage users, channels, and their relationships. Ensure community safety and engagement through content moderation, user bans, and moderator messaging—all without writing a single line of code. Learn more about BizOps Workspace Expand your chat app with integrationsConnect your chat app to third-party APIs and services such as generative AI, chatbots, content moderation, voice & video, translation, and more! Explore integrations Learn how our customers leverage our platform“Since deploying this support chatbot built with PubNub, Swiggy has been able to automate up to 70% of all customer support tickets. Because of this, their time to resolution has also decreased dramatically, from an average of around five minutes pre-automation to just 30 to 40 seconds now.” Rahul BennapalanSoftware Development Engineer 4 at SwiggyEnterprise-grade security and complianceOperate securely through TLS and AES256 encryption, and access flexible authorization schema through OAuth and LDAP models. We require no inbound open ports, which helps prevent attacks on your infrastructure. Plus, we support compliance for regulatory environments that include ISO 27001, HIPAA, GDPR, SOC2 Type 2, and CCPA.Ready to build real-time features?DocumentationGet started quickly with PubNub’s SDKs, APIs and 3rd party integrationsLive Code TourExplore PubNub's core features in our interactive live coding tourTutorialsStart building chat, geolocation, IOT solutions, and more with PubNub by exploring our step-by-step tutorialsTalk to an expert Contact Sales"
