full_description = "A fully-convergent, user friendly, secure and freedom respecting OS for your daily usage. With PureOS, you are the only one in control of your digital life. Whether you are a technology enthusiast, someone looking to protect the digital life of your family, or an enterprise IT/security department, you can use PureOS freely for any purpose, study and share its source code, and adapt it to your needs. PureOS is a fully auditable operating system: you don’t have to trust our word that it respects and protects you—it is independently verifiable by security experts and software developers around the world. Real convergence means bringing your desktop computer with you wherever you go. When we talk about how we have invested in convergence with PureOS we start with the desktop OS and shrink it down to your pocket. We've created a new, more stable version of PureOS, with the same great privacy protecting features and software but with a more solid foundation. Here's a look at some of the changes: With so many completely free software applications available, we know there is something for everyone, including popular software applications from categories like education, games, graphics, internet, office, programming, science, sound, and video. Furthermore, PureOS builds on top of decades of technological advancements, providing cutting-edge technology to let you enjoy fluid high-framerate videos, frame-perfect animations and better power management for your computer and mobile devices. This entire website and all its visual content are licensed by the PureOS team under a Creative Commons Attribution-ShareAlike 4.0 International License. PureOS is developed by paid and volunteer members of the Purism community, and benefits from the work of its extended communities and projects."
