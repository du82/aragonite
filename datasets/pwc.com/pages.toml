["https://pwc.com/us/en/services/tax.html"]
title = "US Tax Services: PwC"
description = "Delivering tax services, insights and guidance on US tax policy, tax reform, legislation, registration and tax law."
full_description = "{{item.videoDuration}} {{item.publishDate}} {{item.title}} {{item.text}} {{item.videoDuration}} {{item.publishDate}} {{item.title}} {{item.text}} Tax can play a key role in driving broader business strategy, while also shaping the tax department agenda. There are complex rules for reporting and compliance. Stay agile while working under budget and dealing with talent pressures. Stay informed on a changing tax landscape, the 2024 election, Pillar Two, energy credits and how they all could impact your business. Pillar Two is an unprecedented change to the global tax system with impacts across the entire business, it's not the only challenge ahead. 2025 marks the beginning of a year for action on a significant “must-pass” tax bill. While some key decisions on timing and process could change, Republicans are unified in holding that failure to enact a tax bill this year is not an option. Embedding a tax perspective into your company's strategic plan is now essential. With policy changes on the horizon and demands for cost management, technology transformation, and business model optimization, tax capabilities are crucial. Tax departments can significantly contribute to cost-cutting, resource allocation, and regulatory risk reduction. Activating your tax strategy requires experience and foresight. Make the best decisions to strategically move your business forward with confidence. © 2017 - 2025 PwC. All rights reserved. PwC refers to the PwC network and/or one or more of its member firms, each of which is a separate legal entity. Please see www.pwc.com/structure for further details."
