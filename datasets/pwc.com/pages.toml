["https://pwc.com/us/en/library/case-studies/workday-esg-transformation.html"]
title = "Workday ESG transformation for Sustainable Success: PwC"
description = "Learn how Workday transformed its ESG program to meet regulatory requirements and enhance stakeholder transparency."
full_description = "Commitment to sustainability requires more than a routine compliance check — it demands a mindset shift in a continuously evolving environment. As Workday considered its existing ESG program, it knew it needed clearer structure and direction to meet future regulatory requirements. Leaning into its longstanding relationship with PwC, Workday engaged the firm to help assess and improve its ESG reporting efforts. Together, Workday and PwC identified priorities and established a clear, actionable roadmap toward the company’s goals that laid the foundation for compliance with future regulations. High-priority ESG issues identified as important to the business and key stakeholders, tracked annually in Workday’s Global Impact Report As consumers, investors and other stakeholders demand greater sustainability transparency, companies face a number of challenges. How can they take actions that count? How do they balance voluntary sustainability efforts that help build brand reputation with mandatory disclosures in compliance with government regulations? How can they stay on top of an evolving regulatory landscape without impacting their ability to serve their customers and take care of their people? Workday, a leading enterprise platform that helps organizations manage their most important assets — their people and money, was driven to answer these questions. When the SEC proposed a new rule around climate-related disclosures, Workday realized that to continue to grow and stay compliant with future regulatory requirements, not only in the US but across the globe, it needed to reassess its ESG strategy. Deeply committed to its sustainability efforts, it set out to re-evaluate its reporting around key stakeholder priorities. Workday wanted to refresh its ESG strategy to focus on the company’s critical priorities. To do so, it needed to align its team on the pressing regulatory requirements and build a reporting capability to address them. For guidance in the transition, Workday turned to its longtime strategic advisor, PwC. With PwC’s assistance, Workday wanted to hone its ability to assess ESG priorities and prepare for successful reporting in the future."
author = "PricewaterhouseCoopers"
year_published = 2025
