["https://pwc.com/us/en/site-information.html"]
title = "Cookie information: pwc.com/us"
description = "Details about the cookies used on the pwc.com/us site."
full_description = "Cookies are small text files that are placed on your computer by the websites that you visit. Cookies and similar tracking tools are widely used in order to make websites work, or work more efficiently, as well as to provide information to the owners of the site. The use of cookies is now standard for most websites. Cookies help us operate this website and understand how you use it so that we can personalize content and provide you with an improved user experience. Details about the specific cookies used and their purposes can be found below. You can control and manage cookies using your browser settings as well as certain opt-out tools (see below). Please note that if you are accessing this website using multiple browsers or devices, you will need to manage cookies on each browser and device, as applicable. Please also note that removing or blocking cookies can impact your user experience and some functionality may no longer be available. When you first arrive at our website, you will see a notice about our use of cookies, providing you with the opportunity to accept all cookies, reject all cookies that are not strictly necessary, or learn more about the types of cookies used and customize your choices. You can also change these settings at any time by visiting Cookie Settings. Most browsers allow you to view, manage, delete and block cookies for a website. Guidance on how to control cookies for common browsers is linked below. Please note that if you set your browser preferences to block all cookies, you may not be able to access all or parts of the website, and if you delete cookies relating to the site, including your cookie preferences, you will be treated as a first-time visitor the next time you visit the site. Some of the third parties that collect information from or about you on PwC sites or apps may participate in the Digital Advertising Alliance’s (“DAA”) self-regulatory program. To make choices about the use of information from or about you for online behavioral or interest-based advertising on websites (desktop and mobile browsers), please visit the DAA, and within mobile applications, you can download the DAA’s AppChoices application from your mobile device at www.aboutads.info/appchoices or from your device’s app store."
