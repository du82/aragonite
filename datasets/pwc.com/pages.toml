["https://pwc.com/us/en/library/case-studies/cross-financial-automates-policy-data-document-ai.html"]
title = "Cross Financial automates policy data with Document AI: PwC"
description = "Cross Insurance automates policy data pulls with PwC's Document AI and Google Cloud. Enhanced accuracy reduced work and improved customer experience."
full_description = "{{item.videoDuration}} {{item.publishDate}} {{item.title}} {{item.text}} {{item.videoDuration}} {{item.publishDate}} {{item.title}} {{item.text}} Cross Financial Corp. (Cross Insurance) is an industry-leading insurance broker that offers coverage solutions for individuals and businesses. PwC helped the team at Cross Insurance address the labor-intensive task of transferring plan benefits and rates from documents its insurance partners generate into its sales management system. By integrating AI into a document data extraction solution that is embedded within Salesforce, PwC helped streamline the sales process, saving time, improving accuracy and enabling Cross Insurance to deliver quotes faster than ever. GenAI streamlined and made the data extraction process more consistent while creating a reliable source of truth “As an insurance broker, our services team consolidates insurance policy details from multiple providers every time we respond to a customer request. We were doing this manually, inputting benefit attributes and plan rates from Summary of Benefits and Coverage (SBC) documents. Because those documents came from different insurance issuers, they were often set up with different file types and structures. This process was prone to inefficiencies and delays. We wanted to streamline and automate the process to minimize manual work, enhance data accuracy and get information to clients faster – ultimately improving their experience.” “We worked with PwC to help identify and implement a solution utilizing Document AI technology, powered by Google Cloud. This solution allows us to extract plan attributes from SBC documents automatically and upload SBC files directly from Salesforce to Google Cloud. Generative AI (GenAI) then automatically labels the files and extracts key data, significantly reducing the time it takes to train the document model. GenAI can identify attributes without prior labeling, resulting in enhanced flexibility and accuracy. The extracted information is then promptly returned to Salesforce, either in real time or through batch processing.”"
author = "PricewaterhouseCoopers"
year_published = 2025
