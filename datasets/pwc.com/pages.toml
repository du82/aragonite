["https://pwc.com/us/en/site/privacy.html"]
title = "Privacy Statement: PwC"
description = "PwC's website privacy statement."
full_description = "PwC is committed to protecting your privacy. This privacy statement describes why and how we collect, use and disclose personal information collected from individuals themselves or from other third parties, and provides information about individuals’ rights with respect to their personal information. We may use personal information provided to us for any of the purposes described in the relevant section of this privacy statement or as otherwise stated at the point of collection. Our goal is to process personal information as necessary for our legitimate business purposes in a transparent manner. If you have any questions regarding our privacy practices, please contact us as set forth in the Contact Us section below. “PwC” (and “we,” “us,” “our”) refers to such PwC member firm in the US that: (1) is involved in providing or receiving services or products; (2) sends you communications; (3) posted a position for which you are applying; or (4) you have a role or relationship with, including through the use of and access to our websites and applications. Each member firm in the PwC network is a separate legal entity — be aware that if you are in a jurisdiction outside of the US, you may or may not have a direct relationship with us, but rather with one of our member firms. For further details, please see www.pwc.com/structure. Use the buttons below to find out more about the sections of this privacy statement that are relevant to you. We collect and use business contact details for individuals associated with existing and potential PwC clients to manage and maintain our relationship with those individuals. Like most businesses, we use a customer relationship management system (the “PwC CRM”) to store personal information about our business contacts. The collection of personal information about contacts and the addition of that personal information to the PwC CRM is initiated by PwC staff and may include name, employer name, title, phone, email and other business contact details. In addition, the PwC CRM may collect data from PwC email and calendar systems concerning interactions between PwC staff and business contacts."
