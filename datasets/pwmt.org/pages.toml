["https://pwmt.org/about"]
title = "pwmt.org"
full_description = "pwmt.org – programs with movie titles – is a community developing functional open source applications and libraries that mainly focus on simplistic and space saving user interfaces and key board interaction. We try to keep our code as documented and tested as possible, so that everyone easily can understand and extend it. Moritz studies computer science at Graz University of Technology and is the founder of pwmt. He loves photography, spending time in the kitchen to cook and bake and to build things. Sebastian studies mathematics at the University of Graz and computer science at the Graz University of Technology. Besides developing quality code for pwmt he is a Debian developer and a coffee enthusiast."
