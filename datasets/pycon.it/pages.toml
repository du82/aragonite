["https://pycon.it/en/event/arduino-e-micropython-soluzioni-iot-dal-sensore-al-cloud"]
title = "Arduino e MicroPython: Soluzioni IoT dal Sensore al Cloud | PyCon Italia"
description = "Join PyCon Italia May 28th to May 31st 2025 in Bologna, Italy!"
full_description = "Impara a costruire un sistema IoT completo con MicroPython e Arduino! In questo workshop pratico, i partecipanti acquisiranno esperienza nella lettura dei dati dai sensori della scheda e nell’invio di questi dati al cloud, dove potranno visualizzarli in tempo reale su una dashboard interattiva. In questo workshop pratico, esploreremo come MicroPython, un linguaggio semplice e potente, può essere utilizzato per creare un sistema IoT completo. I partecipanti apprenderanno come utilizzare l’ecosistema Arduino, interagendo con sensori per raccogliere dati e inviarli al cloud attraverso l’Arduino Cloud. Durante l’evento, ogni partecipante avrà l’opportunità di sviluppare una vera applicazione, utilizzando i dati provenienti dai sensori per monitorare e visualizzare in tempo reale le informazioni su una dashboard interattiva. Il workshop è pensato per chi desidera entrare nel mondo dell’IoT e vuole sperimentare concretamente come integrare hardware, sensori e cloud in un progetto completo, sfruttando la potenza e la facilità d’uso di MicroPython. Since 2023, I have been working as a firmware engineer at Arduino, contributing to the development of innovative hardware and software solutions. I also play an active role in organizing event presentations, promoting the democratization of electronic design and connecting with the community. I hold a Master’s Degree in Computer Engineering from Politecnico di Milano, specializing in embedded systems. With nearly a decade of experience in firmware development and embedded system design, I have gained expertise across various fields, including industrial, automotive, and consumer electronics. Passionate about technical writing, public speaking, and traveling, I am always seeking new experiences and knowledge."
