["https://pycon.it/en/event/rust-python-interoperability-2"]
title = "Rust-Python interoperability | PyCon Italia"
description = "Join PyCon Italia May 28th to May 31st 2025 in Bologna, Italy!"
full_description = "Python shines for its flexibility and speed of iteration, but it doesn’t deliver amazing performance on its own. That’s where Rust comes in: you can harness the full power of the underlying hardware by rewriting hot modules as native extensions, without having to touch the rest of the application! Python has served you well: you spun up a prototype and iterated quickly, keeping up with the evolving requirements of a successful product. Nonetheless, as time goes on, cracks are starting to show up: an endpoint is slower than it needs to be, a data processing job that took seconds now takes almost an hour, and your infrastructure bill is growing too fast compared to the size of your user base. Engineers are starting to whisper: is it time for a rewrite? Should we pause feature development to rebuild everything on more solid foundations? That’s an option, but it’s expensive. There’s another path: rather than throwing away your entire Python codebase to start over, you analyse your application and isolate the performance-critical bits—the so-called “hot modules” where your application spends most of its time. You will rewrite those in Rust and package them as a Python native extension. This workshop will teach you how. We will cover the pyo3 crate, the subtleties of Python’s Global interpreter lock, and typical examples that may arise in your daily Rust-Python interoperability work. By the end of the session, you will be well-equipped to seamlessly replace your slow Python modules with easy-to-use and blazingly fast Rust modules. We assume you are familiar Python and you have basic Rust knowledge, but we don’t assume any prior interoperability knowledge. We will provide a brief explanation and references whenever we rely on advanced features in either language. The workshop will be extremely hands-on: no slides, just a series of exercises and a tutor to help you while you work through them, building your understanding of each concept through a dedicated puzzle (with tests to verify your solutions)."
year_published = 2025
clearnet = "https://pycon.it/en/event/rust-python-interoperability-2"
