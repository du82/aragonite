["https://pycon.it/privacy-policy"]
title = "Privacy Policy | PyCon Italia"
description = "Join PyCon Italia May 28th to May 31st 2025 in Bologna, Italy!"
full_description = "Under no circumstances do we sell, rent, or distribute your personal information (including your email address, name, or anything else you have entered in your profile) to third parties. Only our system administrators and support team have access to your information. You can edit and delete any information at any time, from your profile page . We have endeavored to make sure that we ask for as little personal information as possible throughout the site, both for presenters and simple participants. Presenters are invited to provide additional personal information, part of which will become public (for example: full biography). The submission entry form explains what data will be published and what data will be kept private, and each presenter can preview his/ her public page before it is made accessible, and can edit its contents at any time. Participants may possibly agree to post their profile page to other PyCon Italy participants to help with contacts during the event. If you sign up for our newsletter or mailing list, your email address will be used only to send the list messages, and will not be used or shared in any other way. You can unsubscribe at any time by following the link at the bottom of each message. If you agree to receive job offers from those sponsors who are looking for staff, no personal information (including name and email address) will be shared with these sponsors: all messages will go through our systems to protect your privacy. You can revoke consent at any time from your profile page . Our staff will delete your data from all files, database records, and backups. You will be notified at the end of the process. The information cannot be restored later. The only exception to the complete deletion of data is invoices: if you bought something on our site, we are legally required to keep invoices for 5 years after they are issued. PyCon Italia is considered to be the data controller under the Data Protection Regulation (EU) No. 2016/679 (GDPR). All event organizers are required to declare their compliance with the GDPR rules and regulations."
year_published = 2025
clearnet = "https://pycon.it/privacy-policy"
