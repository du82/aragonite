["https://pycon.it/en/keynotes/accessibility-awareness"]
title = "Accessibility awareness | PyCon Italia"
description = "Keynote by Sarah Abderemane"
full_description = "Accessibility is generally not considered or integrated into the software development process.Awareness of accessibility is needed among developers and beyond, so that it can be integrated in, or at least think better about users’ needs in the process of creating tools or software. This is important because it affects so many folks, far more than people might think. The aim of this talk is to raise awareness through examples and give a few pointers on how to contribute to this effort to make tools and software accessible to all. Sarah Abderemane, also known as “sabderemane”, is a software developer in France. She currently works at Kraken Tech, part of the Octopus Energy group, contributing to solutions to climate change. She works mainly on the backend, but also likes to work on the frontend in her spare time. Sarah organizes the Django Paris meetup and is an active member of the Django community: she is one of the organizers of the Djangonaut Space program, a member of the Django Accessibility team and Vice President of the Django Software Foundation."
year_published = 2025
clearnet = "https://pycon.it/en/keynotes/accessibility-awareness"
tags = ["abderemane", "accessibility", "awareness", "friday,", "sarah", "stay", "tuned!"]
