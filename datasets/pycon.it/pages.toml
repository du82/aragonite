["https://pycon.it/en/event/fastapi-benchmarks"]
title = "FastAPI & Benchmarks | PyCon Italia"
description = "Join PyCon Italia May 28th to May 31st 2025 in Bologna, Italy!"
full_description = "In this talk, The FastAPI Expert will present you numbers you can trust, and explain the reason for them. During the last years, I’ve seen a lot of benchmarks, and none of them seem to be fair. To be fair, I don’t think information is well spread when the matter is “how to be more performant”, so we see a lot of naive benchmarks around. Nonetheless, when performed correctly, trying to analyze the numbers, we can understand the pitfalls, and improve the applications, or even the frameworks itself. For that reason, this talk will be about benchmarks and getting knowledge about those numbers. In this talk, we’ll see a bit about HTTP parsing, JSON parsing for request and response, files parsing, dependency injection, async def vs def, and much more. The idea is to compare similar solutions, and leave this talk with concrete knowledge about how you can improve your own deployed FastAPI application."
