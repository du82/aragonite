["https://pycon.it/help-pycon-it"]
title = "Help PyCon Italia | PyCon Italia"
description = "Join PyCon Italia May 28th to May 31st 2025 in Bologna, Italy!"
full_description = "Python Italia is the association behind PyCon Italia, the Italian Python Conference. Python Italia is a non-profit organization formed by volunteers who support Python’s spread with their activity. It’s clear that every form of help is welcome and valuable. Share our tweets, posts, and blog posts on your social channels, help us spread our communications because only in this way can we more effectively reach all those who may be interested in the Python programming language and in PyCon Italia! Word of mouth is the oldest and most effective form of spreading a message: if you know someone who might be interested in the Python programming language or the conference, talk to them and involve them: every person is an important building block to support all our activities! Sign up for the Association! The membership fee is only €10. You can do this directly during the conference, of course; the growth of our Association is essential for a thriving future and for finding new ideas, new forces, new enthusiasm, and new collaborations! Go to our Association page to register! Help us organize PyCon Italia by becoming a member and requesting to join our organizing team: you can simply share your opinion or actively participate in various tasks within the working teams. The more we are, the better the results will be! Send us a brief email at help@pycon.it. Any financial support helps us cover the management costs of the Association and the costs of organizing the conference: catering, location, technicians, etc.; if you want to make a donation, you will always remain in our hearts for your generosity! Alternatively, if you know a company that might be interested in strengthening its brand by associating with PyCon Italia, put them in touch with us and we will explore the best ways to collaborate. Every sponsor, from the smallest to the largest, makes it possible for us to organize PyCon Italia every year, and it is essential for us. During the conference, 