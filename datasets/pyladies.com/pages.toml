["https://pyladies.com/blog/Announcement-CFP-Launch/cfp-launch-announcement"]
title = "Announcement: CFP Launch – PyLadies"
full_description = "Announcement: CFP Launch Denny Perez July 28, 2023 | Tag: » Conference, Global, PyLadies Tweet !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+'://platform.twitter.com/widgets.js';fjs.parentNode.insertBefore(js,fjs);}}(document, 'script', 'twitter-wjs'); 📢 Call for Paper Launch: PyLadiesCon - Share Your Insights with Us! Dear PyLadies community members, As we venture further into the journey of PyLadiesCon, we are thrilled to announce the official launch of our Call for Papers. 🎉 What is PyLadiesCon? PyLadiesCon is an extraordinary event designed to promote diversity, learning, and empowerment within the Python community. It celebrates women in Python, aiming to create a welcoming and inclusive environment for all attendees. Conference dates: Dec 1-3, 2023 Location: Online across various timezones 🌟 Share Your Knowledge: Call for Papers We invite speakers from all backgrounds and experiences to share their insights, expertise, and stories with our vibrant community. Whether you’re a seasoned Python developer, an industry expert, or a first-time speaker, we encourage you to submit your proposals! As we are a global community, we welcome talks in the following languages: English, Español, Português, Français, and 中文. 🔗 Submit Your Proposal: Please click here to submit your proposal. The topics can range from technical talks to best practices, case studies, and more. Every story and perspective is valuable, and your contribution will enrich the conference experience for everyone. 🗓️ Important Dates: Call for Papers Launch: August 4th Proposal Submission Deadline: September 10th Speaker Notifications: October 10th 🚀 Be Part of the Journey Join us in shaping this remarkable event that empowers and inspires women in the Python community and beyond. Your voice matters, and your presence will contribute to the success of PyLadiesCon. If you have any questions or need further information about the Call for Papers, please don’t hesitate to contact us at: pyladiescon@pyladies.com Thank you for your unwavering support and dedication to the PyLadies community. Together, let’s make PyLadiesCon an extraordinary celebration of women in Python!"
