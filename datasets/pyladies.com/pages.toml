title = "Help us decide our PyLadies Projects and PyLadies Global Council Selection Process! – PyLadies"
full_description = "Help us decide our PyLadies Projects and PyLadies Global Council Selection Process! Lorena Mesa November 04, 2019 | Tag: » Global, Organizing, PyCon, PyLadies Tweet !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+'://platform.twitter.com/widgets.js';fjs.parentNode.insertBefore(js,fjs);}}(document, 'script', 'twitter-wjs'); Help us decide our PyLadies Projects and PyLadies Global Council Selection Process! The PyLadies Global Interim team has continued to meet monthly to discuss the future of our PyLadies Project teams and our PyLadies Global Council. PyLadies Projects We have an open GitHub issue on selecting the initial PyLadies Projects we’d like to focus on. PyLadies Projects will be managed as open source projects and be focused to working on one specific area. For example, we have PyLadies Technology and Infrastructure Project proposal open. All Project teams are open to any self-identifying PyLadies member. Please weigh in today on these teams! We will close the PyLadies Project issue on November 18 2019 23:59:59 Anywhere on Earth. Selecting the PyLadies Global Council Additionally there is an open GitHub Issue discussing how the PyLadies Global Council selection process will work. If you have thoughts on how the selection should work, what requirements should be in place for Council members, or more please add your feedback on the issue today! We will close the PyLadies Project issue on November 18 2019 23:59:59 Anywhere on Earth. Stay in touch with PyLadies and PyLadies Global! Have something you want the PyLadies Global interim team to work on? Please add your item under “New Business” to our next meeting - which you can find on the PyLadies Global Organizing Repo. If you are just looking to stay updated on our work, all meetings have minutes and published notes. As always, please join us on Slack! You can sign up at: https://slackin.pyladies.com/. PyLadies Interim Global Team: Debora Azevedo (@Debora Azevedo) Rachell Calhoun (@rachell) Jes Ford (@jesford) Georgi Ker (@Georgi Ker) Katia Lira (@katia) Lorena Mesa (@lorenanicole) Mariatta Wijaya (@mariatta) Carol Willing (@willingc) Elaine Wong (@elaine)"
