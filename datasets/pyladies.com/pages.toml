title = "Announcement: PyLadies Conference – PyLadies"
full_description = "Announcement: PyLadies Conference Denny Perez June 22, 2023 | Tag: » Conference, Global, PyLadies Tweet !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+'://platform.twitter.com/widgets.js';fjs.parentNode.insertBefore(js,fjs);}}(document, 'script', 'twitter-wjs'); 📢 Announcement: PyLadies Conference - Join Us! Attention all PyLadies community members! We’re excited to share that we are in the early stages of planning a PyLadies Conference (PyLadiesCon), a transformative event designed to promote diversity, learning, and empowerment within the Python community. 🎉 Save the date! The conference will take place on the first weekend of December, where we’ll gather together for a weekend filled with insightful talks, engaging panels, and collaborative networking opportunities. We’re reaching out to you, our fantastic community because we believe in the power of teamwork. As we embark on this journey, we seek enthusiastic volunteers passionate about Python, equality, and fostering a welcoming environment for all. 🌟 Volunteer with Us: By becoming a volunteer, you’ll play a crucial role in making PyLadiesCon a memorable experience for all attendees. 🔗 Apply to Volunteer: Sign up here Join us in shaping this remarkable event that aims to empower women in the Python community and beyond. Your involvement will make a difference and provide invaluable networking opportunities and personal growth. While the conference is still in the planning phase, we want to ensure we have a strong team of dedicated volunteers ready to help us bring this vision to life. If you have any questions or need further information, please don’t hesitate to contact our volunteer coordinator at: pyladiescon@pyladies.com Thank you for your unwavering support and dedication to the PyLadies community. Let’s make PyLadiesCon an extraordinary celebration of women in Python!"
