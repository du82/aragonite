["https://pyladies.com/blog/At-PyCon-2014---2nd-PyLadies-Luncheon/pyladies-pycon-2014-lunch"]
title = "At PyCon 2014 - 2nd PyLadies Luncheon – PyLadies"
full_description = "At PyCon 2014 - 2nd PyLadies Luncheon Esther Nam March 10, 2014 | Tag: » Announcements, Events, PyCon Tweet !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+'://platform.twitter.com/widgets.js';fjs.parentNode.insertBefore(js,fjs);}}(document, 'script', 'twitter-wjs'); Thanks to the generous support of the PSF, PyLadies will be having a luncheon for attendees who identify as women on the third day of the PyCon 2014 conference! More than one hundred PyLadies attended last year’s lunch at PyCon 2013, and this year the venue will be large enough to accommodate even more! In order to help the organizers plan the event, we highly recommend you procure your free ticket now, via the RSVP link below. Who - Anybody attending PyCon 2014 who identifies as a woman When - Sunday, April 13, 2014 during lunch Where - Room 516 at the Convention Ctr RSVP - Eventbrite - Free but exclusive to conference attendees. The PyLadies Lunch is a great opportunity for women attending the conference who love Python, or who want to learn more about Python or PyLadies, to meet others in the same boat in a fun, relaxed environment. We cordially invite you to join us and make new friends, forge connections, and share Python programming stories with folks from all around the world."
