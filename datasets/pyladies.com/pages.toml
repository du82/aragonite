title = "CfP: PyCon 2015 – PyLadies"
full_description = "CfP: PyCon 2015 Lynn Root August 04, 2014 | Tag: » Blog, PyCon Tweet !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+'://platform.twitter.com/widgets.js';fjs.parentNode.insertBefore(js,fjs);}}(document, 'script', 'twitter-wjs'); ZOMG It’s happening! It’s back! The call for proposals for PyCon 2015 is now open! Submit your proposals for talks, tutorials, or posters to PyCon in Montreal, closing on September 15th. Financial aid applications will open up September 1st, and close January 1st. If you’d like to help women attend PyCon, please consider donating to PyLadies! Last PyCon, we had many women give tutorials, talks, and posters, setting the record of 33% female speakers. CAN WE DO BETTER?! Keep on the lookout for local and global PyLadies Meetups and Hangouts to help the Python community brainstorm proposals! PyCon’s site has many resources and advice for ideating and creating a proposal (or two, or three…nothing is stopping you!)."
