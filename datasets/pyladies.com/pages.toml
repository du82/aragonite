["https://pyladies.com/blog/Announcement-for-Registering-PyLadies-Members/announcement-for-registering-pyladies-members"]
title = "Announcement for Registering PyLadies Members – PyLadies"
full_description = "Announcement for Registering PyLadies Members Abigail Dogbe July 01, 2020 | Tag: » Global, Organizing, PyLadies Tweet !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+'://platform.twitter.com/widgets.js';fjs.parentNode.insertBefore(js,fjs);}}(document, 'script', 'twitter-wjs'); Announcement for Registering PyLadies Members This has been a busy past many months for PyLadies! As we shared on our blog in August 2019, PyLadies has been hard at work, revamping our PyLadies presence as well as our global leadership. Why? To enable us to better run our chapters, not only locally but globally. The intent is to bring together all of our local chapters, to help us collaborate, to share ideas and also start a PyLadies Global Council , which will be responsible for overseeing the Global PyLadies Community. To do this, however, we need your help! We want to engage with our PyLadies members! Starting today, PyLadies members can register to become a basic member or a voting member. As of today we have registration available in: English Chinese - Mandarin French / Francés Portuguese / Português Spanish / Español Russian / Русский язык We’re currently in the process of translating our registration documentation into Arabic. If you’d like to help with translation, let us know by adding your voice to the GitHub issue here. Questions? You can open an issue on the PyLadies Info repo here. Or else join us in PyLadies Slack! As always, you can keep up to date with the work for PyLadies Global through the PyLadies Global repo where monthly meeting minutes are posted, such as Feb 2020 minutes. Thank you to the volunteers for their translation efforts: Portuguese: Débora Azevedo Spanish: Diana Rodriguez Russian: Volodymyr Kirichinets Chinese: Georgi Ker French: Georgi Ker As well as a thank you to the PyLadies Global Interim Admins and broader team!"
