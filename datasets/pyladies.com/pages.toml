title = "Attend Google I/O with PyLadies! – PyLadies"
full_description = "Attend Google I/O with PyLadies! Lynn Root April 26, 2014 | Tag: » Announcements, Conferences, outreach Tweet !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+'://platform.twitter.com/widgets.js';fjs.parentNode.insertBefore(js,fjs);}}(document, 'script', 'twitter-wjs'); Are you a PyLady who missed the lottery to attend Google I/O? Well, now is your chance! As a PyLady, you have an opportunity to buy one of 50 allotted tickets from Google for $300. PLEASE NOTE: No additional financial aid will be given! You are responsible for your own funds, travel arrangements, etc. Feel free to coordinate on the PyLadies Google Group mailing list or others (e.g. DevChix, Systers, etc) for roommates, etc. About Google I/O: June 25th & 26th San Francisco, CA at Moscone Center $300 for a ticket (versus $900 of the regular sticker price) Social networking opportunities for women Link: https://www.google.com/events/io Requirements: Identify as a woman (emphatically trans & queer friendly) Are not a Google employee Are able to arrange and pay for your own travel and stay (absolutely NO additional financial aid will be given) You are applying for yourself (not on behalf of someone else) Not already signed up/registered to attend General Criteria (including, but not limited to): Usage of Google Apps, products, and APIs Involvement with PyLadies, Python, and/or the Open Source community Ability to give back to Python/PyLadies community Timeline: Applications due: Friday, May 9th at 11:59 PM Pacific Time Notifications of recipients: Friday, May 16th (roughly) Award recipients must register within 2 weeks of receiving award letter and signup process All information here will not be made public, and will be reviewed by PyLadies leadership only. Please contact us regarding any questions you have. APPLY HERE"
