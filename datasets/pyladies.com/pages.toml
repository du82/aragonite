full_description = "Call for Blog Posts: Share Your Inspiring Stories Audrey Roy Greenfeld July 27, 2014 | Tag: » Blog Tweet !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+'://platform.twitter.com/widgets.js';fjs.parentNode.insertBefore(js,fjs);}}(document, 'script', 'twitter-wjs'); PyLadies wants to hear your inspiring stories about Python programming and Python community leadership. As our contributing instructions say: “We’re looking for posts about Python and the ladies doing cool things with it.” Whether you run a PyLadies or DjangoGirls chapter, maintain a Python library, or are simply learning and want to show off your Python project, we want to hear about it and help share your successes with the world. First read the contributing instructions for pyladies.com, then get started. If you run into any problems while trying to post, file an issue so we can help."
