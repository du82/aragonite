title = "Sponsor"
full_description = "Sponsor Us Why Help the PyLadies? PyLadies want to bring fresh talent into the Python community and to support both seasoned and budding developers through workshops, community activities, and local advocacy. Your support of PyLadies' outreach efforts will pay off hugely over the long term by improving the diversity of the software industry as a whole. How you can help Email us, indicating how you would like to sponsor Pyladies. Make a donation through the Python Software Foundation. Donations made are tax-deductible. If you would prefer not to use credit card or PayPal, please contact us to make other arrangements. If you know of a talented, deserving developer who might benefit greatly from attending a Python or Open Source conference, let us know. We'll do our best to help as many women as possible."
