["https://pyladies.com/blog/-Share-Your-PyLadies-Chapter-at-PyLadiesCon/chapters-video-request"]
title = "🎬 Share Your PyLadies Chapter at PyLadiesCon! – PyLadies"
full_description = "🎬 Share Your PyLadies Chapter at PyLadiesCon! Denny Perez November 03, 2023 | Tag: » Conference, Global, PyLadies Tweet !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+'://platform.twitter.com/widgets.js';fjs.parentNode.insertBefore(js,fjs);}}(document, 'script', 'twitter-wjs'); Hello amazing PyLadies! We have an exciting opportunity for your PyLadies Chapter to shine at the upcoming PyLadiesCon! We invite you to create and share a 90-second video (1 minute 30 sec) introducing your wonderful community. Here’s a guide to help craft your video: Participants: One member from your community can present. Introduction: Please introduce the organizers with their names and roles in the community. Scripting: Consider preparing a script to succinctly convey the essence of your chapter’s story and activities. Presentation Material: Feel free to use our specially designed PyLadiesCon template for your video Slides Template. If you have pre-existing materials, simply add the PyLadiesCon event logo. Submission: Submit your recorded video in advance; it will be showcased during the event. 🚀 Here’s a quick rundown of what to include: A brief introduction of your chapter and its mission. Highlights of your community’s achievements and activities. 🌟 For inspiration and a better idea of what we’re looking for, check out this example video. If you need help creating your video, let us know, and we’ll set up a time to work on it together. Please send your video to pyladiescon@pyladies.com and any related materials by November 15th. We can’t wait to see what you’ve prepared!"
