["https://pyladies.com/blog/Nominate-a-PyLady-for-the-Outstanding-PyLadies-Award/outstanding-award-nominations"]
title = "Nominate a PyLady for the Outstanding PyLadies Award! – PyLadies"
full_description = "Nominate a PyLady for the Outstanding PyLadies Award! Bethany Garcia November 21, 2024 | Tag: » Global, Outstanding PyLady Award Tweet !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+'://platform.twitter.com/widgets.js';fjs.parentNode.insertBefore(js,fjs);}}(document, 'script', 'twitter-wjs'); Reminder: nominate a PyLady by the end of the year for the Oustanding PyLady Award! Attention all PyLadies and PyLadies Supporters! The December 31st, 2024 (AOE) deadline is fast approaching for Outstanding PyLady Award nominations! Outstanding PyLady Award recipient lanyard pin. Photo taken by @psobot. The PyLadies community is made up of many remarkable members and volunteers that make significant contributions to bettering the Python community. The Outstanding PyLady award is meant to elevate diverse Pythonistas doing amazing things, highlighting their achievements, and thanking them for all the work they’ve contributed. Nominations are accepted year-round, but December 31st is the cut-off date for recognition at PyCon US 2025. Recognition will take the form of an award certificate, plus one of the following: Free registration and travel assistance (if needed) to PyCon US 2025 1, or A cash award of $1000 USD 2. Self nominations and multiple nominations are accepted (and encouraged!), as are nominations from outside the PyLadies community; just fill out this form per nominee. Winners will be notified by the Global Council. Let us know about all the wonderful work that’s been done this year and get those nominations in! To learn more about the process or see who’s previously received the award, checkout the PyLadies kit. 1 An award winner may choose a future PyCon US if they can not attend the next upcoming conference. 2 Non-US based recipients will be subject to the Federal US tax withholding of 30% unless all requirements are met, according to the Python Software Foundation’s Vendor Policies. Contact accounting(at)python.org with any questions."
