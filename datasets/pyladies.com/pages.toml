["https://pyladies.com/blog/DjangoCon-2012-Pro-Tips-for-those-new-to-D.C./djangocon-in-dc"]
title = "DjangoCon 2012: Pro Tips for those new to D.C. – PyLadies"
full_description = "DjangoCon 2012: Pro Tips for those new to D.C. August 09, 2012 | Tag: » Events Tweet !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+'://platform.twitter.com/widgets.js';fjs.parentNode.insertBefore(js,fjs);}}(document, 'script', 'twitter-wjs'); [_This guest post is lifted straight from D.C. PyLady Katie’s wonderful blog! She will be writing a series of posts to help Djangonauts from all over feel at home in the U.S. capital come early September!_] Coming to DjangoCon in September? Let’s have a chat about DC. by Katie Cunningham (with mad props to Jackie Kazil, who helped write this post!) The location DjangoCon DC is actually in Northern Virginia, not in the heart of the Capitol. Specifically, it’s being held in Crystal City at the Hyatt Regency, which is close to the Crystal City Metro Station (the yellow and blue metro lines) and one stop away from Reagan National Airport (DCA). I worked in the area for many years, and while it doesn’t have as much of the DC grit and history, it makes up for in being a great nexus between convenience and cost. As someone who’s been to several conferences in DC, I can tell you this is a good thing. It is a safe, clean, affordable, and transportation-accessible part of the DC metro area that is littered with Django developers. If, for some reason, you aren’t going to be staying at the conference’s hotel, you’re in luck. DC has a LOT of hotels. In general, the closer they are to a metro stop, the more expensive they are, but it’s still possible to find no-frills hotels very close to a metro stop. If you want to remain close to the main action, I would get a hotel at L'Enfant (which is close to the Mall), Crystal City, or National Airport. Franconia/Springfield may look convenient, but it’s actually not close to anything. Getting to DCFlying View DC airports in a larger map There are three airports in the D.C. region. Travel sites like Hipmunk and Kayak try to make all our local airports equivalent, as if it’s just a short jaunt from each to DC. This is a dirty, nasty lie. The airport visible from the hotel is Reagan National. It is only one metro stop from the hotel (or just under a mile walk if you are crazy). The other airports, Dulles and BWI, are inconvenient but usually cheaper if you are on a budget and willing to spend an extra hour to two hours using a combination of shuttle services, Amtrak, buses, metro. If you choose to stomach one of the other options, then add about $15 to your trip. If you take a taxi, you could end up spending more than the cost of your savings. If you’re coming in on an international flight, it may be worth looking for a flight that lands at some other international airport like Atlanta or New York, then catch a flight into Reagan. Trust me, you will not regret this. Train The train station is located at Union Station. It can be nice way to travel if you are on the Eastern Seaboard. The commute from Union Station to the conference isn’t bad, since Union Station is also a metro stop. Chinatown buses and other bus services For those on a budget or looking for adventure and located on the Eastern Seaboard you might check look into the Chinatown buses. Various companies in Chinatown shuttle to Baltimore, Philideplia, New York, and Boston. D.C. to New York is between three and five hours (depending on your driver aherance to the speed limit) and costs around $20 each way. They will drop you off in Chinatown near the metro, which is the same metro line that you would need to get to the conference. Sometimes you can find a service that offers wifi and plugs and sometimes there are live animals and sketchy late night stops. Adventure! Other buses services will drop you off in other parts, but they are usually close to a metro stop. Bolt Bus is probably one of the nicest. Driving Don’t. It’s not worth it unless you are car pooling. You won’t need your car while visiting. If you do though, you can park you car at the Hotel (expect to pay a pretty hefty amount per night, though). If you want to bring your car, bring a GPS and some antacids. I’ve been told we’re pretty bad drivers around here. Transportation DC’s metro is stupidly simple and is probably going to all the places you want to go. DC metro area cabs are priced pretty well as a back up. I wouldn’t bother to rent a car. However, if you want to rent a bike, I have good news! There’s a Revolution Cycles in Crystal City that rents bikes by the week. I spoke with the owners, and they have about 100 bikes available. Given how many people are going to be in town, they recommended reserving one ahead of time. I’m no bike enthusiast (I still think my green Huffy was pretty rad), but I have been informed by bike geeks that these are good bikes. There is also BikeShare, which is like Zipcars for bikes, through DC and in the conference hotel neighbor. Bring your own helmet, though. Don’t be one of those guys. But there are only 10 spots at the hotel, so don’t count on easily finding a bike at the conference. This is a better option used to tool around D.C. for a couple hours. At the moment, I don’t have much information regarding bike parking at the hotel. Hotels in the region are starting to have bike parking sections available, but if you’re renting a bike for the week, keep in mind that you might be keeping it in your room (I hope I’m wrong). More soon! I’m going to post something about our tourist scene, if anyone is interested in seeing the sites while you’re here. By Esther Nam Tweet"
