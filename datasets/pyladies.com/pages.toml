full_description = "Welcome! We are an international mentorship group with a focus on helping more women become active participants and leaders in the Python open-source community. Our mission is to promote, educate and advance a diverse Python community through outreach, education, conferences, events and social gatherings. PyLadies also aims to provide a friendly support network for women and a bridge to the larger Python world. Anyone with an interest in Python is encouraged to participate! Latest Blog Posts Nominate a PyLady for the Outstanding PyLadies Award! November 21, 2024 Reminder: nominate a PyLady by the end of the year for the Oustanding PyLady Award! Read more → Inaugural Winners of the Outstanding PyLady Award May 28, 2024 Announcing the first recipients of the Outstanding PyLady Awards (🎉 OPA 🎉)! Read more →"
