title = "About"
full_description = "We are... ...a group of women developers worldwide who love the Python programming language. We write code by day or night. Some of us hack on Python projects on the side, while others work full-time on Python development. But it doesn't matter. We all just like writing Python code, and that's what brings us together. Please join us! Are you an experienced female Python developer? Or are you new and need help getting into Python development? Here's what to do: Join your local Meetup group or start your own with our PyLadies starter kit Join the PyLadies Slack chat. Ask questions! **Developers and aspiring developers only, please! There are some fantastic groups for women in other areas of technology, which some of us participate in as well, but let's keep this group primarily focused on Python programming."
