title = "PyCon 2014: Lightning Talks Proposals Due October 15th! – PyLadies"
full_description = "PyCon 2014: Lightning Talks Proposals Due October 15th! Lynn Root October 04, 2013 | Tag: » pycon Tweet !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+'://platform.twitter.com/widgets.js';fjs.parentNode.insertBefore(js,fjs);}}(document, 'script', 'twitter-wjs'); For the first time at PyCon, you can submit a proposal to give a Lightning Talk! If you missed the earlier call for proposals for the longer talks, you still have a chance to present your beloved subject in front of a large audience. The deadline is coming soon, so hurry up! You have until October 15th, 2013 to propose your 5-minute presentation. If your Lightning Talk is pre-accepted, you will have a reserved slot on the lightning talk schedule. For those who enjoy spontaneity, don’t worry! We will embrace our tradition of accepting Lightning Talk proposals on site. For more information on submission guidelines, check out our How to Submit a Lightning Proposal, or get inspired by looking through previous year’s lightning talks."
