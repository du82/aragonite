full_description = "Blog Nominate a PyLady for the Outstanding PyLadies Award! November 21, 2024 Reminder: nominate a PyLady by the end of the year for the Oustanding PyLady Award! Read more → Inaugural Winners of the Outstanding PyLady Award May 28, 2024 Announcing the first recipients of the Outstanding PyLady Awards (🎉 OPA 🎉)! Read more → PyLadies at PyCon US 2024 March 06, 2024 We are proud to share that there will be strong representation from PyLadies and our community members at PyCon US 2024. Don’t miss the talks and tutorials presented by PyLadies, and be sure to attend and check out the events and summits organized by PyLadies members worldwide. Read more → Announcing: The Outstanding PyLady Award January 22, 2024 Introducing: the Outstanding PyLady Award! Read more → 🎬 Share Your PyLadies Chapter at PyLadiesCon! November 03, 2023 Hello amazing PyLadies! Read more → PyLadiesCon - CFP Closed. A summary, and a Retrospective. October 03, 2023 The CFP for the first PyLadiesCon has closed on September 17, 2023. On behalf of PyLadies organizers team, we’re grateful for the support from the community in helping us spread the news about our CFP, and also for everyone who submitted their proposals. Read more → PyLadiesCon - Sponsorship Launch October 02, 2023 Join us! Become a sponsor of the first ever Global PyLadies conference! Read more → PyLadiesCon - CFP 外展套件 September 15, 2023 None Read more → PyLadiesCon - CFP 外展套件 September 15, 2023 None Read more → Announcement: CFP Extended September 10, 2023 ANNOUNCEMENT: CFP Extended Read more → PyLadiesCon - Thank You CfP Workshop Mentors September 08, 2023 Over the last few weeks, we have organised 2 CfP workshops for new speakers. Thank you to all of you who signed up and attended. I hope to see your amazing proposal and talks at the PyLadies Conference. Read more → PyLadiesCon - CFP Outreach Kit (Français) September 05, 2023 None Read more → PyLadiesCon - CFP Outreach Kit (Português) September 05, 2023 None Read more → PyLadiesCon - CFP Outreach Kit (Español) September 05, 2023 None Read more → PyLadiesCon - CFP Outreach Kit (English) September 03, 2023 None Read more → PyLadiesCon - CfP Workshop August 17, 2023 PyLadiesCon - CfP Workshop Read more → Announcement: CFP Launch July 28, 2023 📢 Call for Paper Launch: PyLadiesCon - Share Your Insights with Us! Read more → Announcement: PyLadies Conference June 22, 2023 📢 Announcement: PyLadies Conference - Join Us! Read more → Global Council Announcement June 20, 2021 2020 was quite a complicated year due to the COVID-19 pandemic, humanity has faced multiple unforeseen challenges, to tell the truth, in this modern era no one imagined having to experience something like what is happening. But we would also like to highlight that 2020 has given us a new perspective on how we see things, on everything we take for granted. This was the year we rediscovered the spirit of solidarity and community. Read more → Announcing the Inaugural PyLadies Global Council September 21, 2020 None Read more → Announcement for Registering PyLadies Members July 01, 2020 None Read more → PyLadies Global Council Selection Process Voting Now Open! December 18, 2019 None Read more → Help us decide our PyLadies Projects and PyLadies Global Council Selection Process! November 04, 2019 None Read more → Important PyLadies Update August 15, 2019 None Read more → EuroPython 2016, a first time participant's thoughts! August 01, 2016 EuroPython wrapped up July 24th in Bilbao, Spain. As a first time participant I was thrilled to attend, speak, and represent the PSF as a member of the Board of Directors! Read more → A PyLadies-packed PyCon 2015 March 23, 2015 Want to pack your PyCon schedule with PyLadies events? Here are all the details! Read more → PyLadies at PyTennessee February 01, 2015 None Read more → Donate to PyLadies @ PyCon 2015! December 01, 2014 TL;DR: Donate to PyLadies for PyCon! Read more → Fundraising for PyLadies for PyCon 2015 November 02, 2014 TL;DR: Donate to PyLadies for PyCon! Read more → Austin Ladies Hack September 01, 2014 PyLadies Austin hosted Austin’s first ever Ladies-focussed Hackathon - Austin Ladies Hack, from Aug 15th-17th, 2014. Read more → PyLadies Values People August 25, 2014 A caring community matters to us Read more → PyLadiesATX event: What's a Web Framework? Python, Django, and more August 24, 2014 From August 9-11, I led a 2-part, all-women workshop series on web frameworks & learning Django for PyLadiesATX. Read more → Python is for everyone August 06, 2014 We started PyLadies as a friendly support network for women and a bridge to the larger Python community. Read more → The first Django Girls happened! August 05, 2014 This is a story about turning 45 women into Django developers. Read more → CfP: PyCon 2015 August 04, 2014 ZOMG It’s happening! It’s back! Read more → Call for Blog Posts: Share Your Inspiring Stories July 27, 2014 PyLadies wants to hear your inspiring stories about Python programming and Python community leadership. Read more → Attend Google I/O with PyLadies! April 26, 2014 Are you a PyLady who missed the lottery to attend Google I/O? Well, now is your chance! As a PyLady, you have an opportunity to buy one of 50 allotted tickets from Google for $300. Read more → pip install pyladies April 18, 2014 At PyCon this year, I had the pleasure of announcing pip install pyladies. Read more → PyLadies @ PyCon 2014 March 27, 2014 None Read more → At PyCon 2014 - 2nd PyLadies Luncheon March 10, 2014 Thanks to the generous support of the PSF, PyLadies will be having a luncheon for attendees who identify as women on the third day of the PyCon 2014 conference! Read more → Contributing your first patch to Python: PyLadies office hours March 05, 2014 PyLadies is proud to be working with the Python Software Foundation to support paid Python internships for women this summer through the GNOME Outreach Program for Women. Read more → Get paid to contribute to Python this summer March 03, 2014 Read more → PyLadies at PyCon 2014: tutorial spotlight January 30, 2014 PyCon 2014 has a record-setting percentage of women speakers, at 33%, up from last year’s record-setting 20%. The talk schedule has been announced, and tutorial signups are open. Read more → Fundraising for PyLadies for PyCon 2014 October 07, 2013 TL;DR: Donate to PyLadies for PyCon! Read more → PyCon 2014: Lightning Talks Proposals Due October 15th! October 04, 2013 For the first time at PyCon, you can submit a proposal to give a Lightning Talk! If you missed the earlier call for proposals for the longer talks, you still have a chance to present your beloved subject in front of a large audience. Read more → PyCon 2014 Proposal Brainstorm Sessions! August 18, 2013 When someone suggests you to submit a talk, tutorial, or poster to Pycon, sometimes, it feels like this: Read more → Getting More Women to Submit Talk Proposals August 17, 2013 Getting More Women to Submit Talk Proposals written by Celia La, for NYC Pyladies Read more → PyCon 2014 Call for Proposals is open July 16, 2013 The PyCon 2014 call for proposals is open, and we want to see talk submissions from you! Read more → How to hook people on CS through Magic April 04, 2013 None Read more → PyLadies @ PyCon - Join Us! March 07, 2013 PyCon’s Opening Reception is less than a week away, are you excited? Read more → How I Learned to Stop Worrying and Love Rebase February 26, 2013 Rebase is a downright scary concept. When the best way to explain how it works I’ve heard starts with thinking that you’re time-traveling back to before certain changes were ever introduced to a project, you probably should be afraid. We’ve all read enough science fiction to know what happens if you go back to the Age of the Dinosaurs and step on an ugly-looking bug. Read more → Why PyLadies? February 23, 2013 PyLadies is a group of women working on welcoming, encouraging and directly inviting women to join the Python community and to learn from each other. Read more → PyLadies Lunch @ PyCon January 28, 2013 This year, there is such an amazing line up of talks, tutorials, events, and sponsors at PyCon that we’re sure you don’t have enough planned. Us PyLadies have organized to host a lunch for women attending the conference who love Python, or who want to learn more about Python or PyLadies. Read more → PyLadies Speak at PyCon! January 13, 2013 PyCon talks were announced last week, and this year a record number of them are being given by women in the Python community, many of whom are PyLadies contributors! Congratulations to all the smart, accomplished women in the Python community who are helping to change the ratio at PyCon! Read more → PyCon Proposal Brainstorm Session Aug 27th August 25, 2012 [Thanks Lynn for putting this together!] Read more → DjangoCon 2012: Pro Tips for those new to D.C. August 09, 2012 [_This guest post is lifted straight from D.C. PyLady Katie’s wonderful blog! She will be writing a series of posts to help Djangonauts from all over feel at home in the U.S. capital come early September!_] Read more → Government Fellowship Opportunity July 10, 2012 The new Consumer Financial Protection Bureau is hiring a group of 30 designers and developers (Python- and Wordpress-friendly) to improve internal operations and the way that we interact with the public. The CFPB is a US government agency. Read more → SF PyLadies First Workshop June 06, 2012 Ed. note: This post about the first San Francisco PyLadies chapter’s workshop is copied straight from Lynn’s personal blog (with Lynn’s generous permission – thanks!)] Read more → SF PyLadies First Workshop May 21, 2012 Ed. note: This post about the first San Francisco PyLadies chapter’s workshop is copied straight from Lynn’s personal blog (with Lynn’s generous permission – thanks!)] Read more → Jessica McKellar to be Keynte speaker at DjangoCon Europe! May 17, 2012 [Originally posted on the DjangoCon Europe blog. Thanks Jonas for letting us repost here! DjangoCon Europe 2012 will go from June 4-June 8 in Zurich, Switzerland.] Read more → SF Study Group May 12, 2012 Udacity is offering a free online intro to programming course starting Monday April 16th. Each week, videos will be posted online at the start of the week and homework will be due on the Tuesday of the following week. Read more → Workshop Planning Session May 10, 2012 On May 8, 2011, six of the PyLadies got together at Intelligentsia Coffee in Pasadena. It was really great to see everyone! Sadly Jess was out of town attending Google I/O, otherwise we would have had seven of us. Read more → Welcome to mynt April 12, 2012 For a quick overview of what mynt has to offer, give the quickstart guide a read. You can also find API reference style documentation on the docs page. If you run into any problems open an issue on GitHub. Lastly, if you have any questions or just want to chat, you can hop into our IRC channel on freenode, #mynt. Read more → Bay Area Girl Geek Dinner March 29, 2012 Ed. note The most recent Bay Area Girl Geek Dinner was Python-themed, and hosted by Yelp. Many thanks to Lynn for letting us repost this article from her blog! Lynn is starting up the SF Chapter of PyLadies, so drop her a line if you’re interested in joining! Read more → PyLadies in the News February 24, 2012 The LA Weekly blog featured a few of the LA PyLadies in a recent post. The Open Hatchery highlights a nice example of the power of community collaboration and outreach (we can’t wait to meet Pam at PyCon!) Read more → Get the Most out of your Conference-going Experience January 22, 2012 As seen in our last newsletter: @kjam and @sandymahalo are pro conference attendees (and speakers!). Here they present advice for those who may be new to the world of tech conferences and other neck-beard-laden gatherings like SCALE10x, which is happening this entire weekend in Los Angeles. Read more → Call for PyCon Applications and Sponsors December 15, 2011 As previously mentioned, the PyLadies are working with the PSF to ensure that PyLadies who want to attend PyCon 2012 can do so. To that end,we are accepting applications for grants to attend PyCon in Santa Clara, CA from March 7-15. Read more → PyLadies at PyCon 2012 December 12, 2011 We’re happy to announce that with the help of the Python Software Foundation, PyLadies will be making an appearance at PyCon 2012! We will be exhibiting during the main portion of conference and will be on hand to help any other interested PyLadies in joining or starting up their own chapter. We will soon have details about grants to attend this upcoming PyCon, so stay tuned! Read more → Recaps: October Hackathon, November Beginner's Workshop November 29, 2011 Idealab in Pasadena played host to a PyLadies hackathon this past October. Our very own Sophia has posted some great photos of the event over at her own site, backCODE – check them out! Read more → Djangsta Shirts - Extra Print Run! September 19, 2011 If you were at DjangoCon you probably saw people wearing these, standing out magnificently amongst the sea of bright green. They were the cool people – the Djangstas, if you will. Read more → Recap: PyLadies at DjangoCon 2011 September 14, 2011 Last week the PyLadies took Portland, Oregon by storm: after months of planning, brainstorming, planning, rehearsing, and even a bit of planning, we flew in en masse to DjangoCon 2011 for six action-packed days of tutorials, talks, code sprints, and raucous socializing with Django developers from all over the world. Read more → Djangsta Shirts on Sale at DjangoCon September 06, 2011 These “Djangsta” shirts premiered at DjangoCon to a rousing success and are selling out quickly! If you are coming to DjangoCon this year, find a PyLady and get one! Proceeds help PyLadies outreach efforts. Shirt logo was designed by xtine. Read more → PyLadies Meetup at DjangoCon September 05, 2011 All women at DjangoCon are invited to the PyLadies meetup, Wed night at DjangoCon US! Thanks to Michelle Rowley and Eric Holscher (both of PDX Python) for organizing and planning the party. Read more → DjangoCon Sponsorship Program September 05, 2011 Announcing the results of the PyLadies' DjangoCon Sponsorship Program. Read more → Mid-August News Bites August 16, 2011 Mid-August – in France we’d be halfway through our nationally recognized four weeks of vacation, but here in Los Angeles we PyLadies have been as busy as ever, working hard to plan some big, big things! Read more → Intro to Django at Mahalo July 25, 2011 Last Saturday the PyLadies and the LA Django meetup group held an introductory Django Workshop, with generous amounts of support by Mahalo and Cars.com Guided by Sandy and Katharine, two of the PyLadies' Djangologists extraordinaires, the morning tutorial covered the basics of setting up a Django web application, from database configuration to navigating the built-in admin interface. Read more → Django Workshop and Hackathon July 12, 2011 The PyLadies are continuing their summer series of hack"
