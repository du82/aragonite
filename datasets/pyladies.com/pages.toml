["https://pyladies.com/blog/Contributing-your-first-patch-to-Python-PyLadies-office-hours/opw-office-hours"]
title = "Contributing your first patch to Python: PyLadies office hours – PyLadies"
full_description = "Contributing your first patch to Python: PyLadies office hours Jessica McKellar March 05, 2014 | Tag: » Announcements, outreach Tweet !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+'://platform.twitter.com/widgets.js';fjs.parentNode.insertBefore(js,fjs);}}(document, 'script', 'twitter-wjs'); PyLadies is proud to be working with the Python Software Foundation to support paid Python internships for women this summer through the GNOME Outreach Program for Women. Please visit the project page for the full program details and how to apply! Applications are due by March 19th. You do not need to be a student to apply. Part of the application process is submitting a patch for a bug in Python. Need help getting started? We’re running virtual office hours this Sunday. What: Submit your first patch to Python! When: Sunday, March 9th, from 12pm - 6pm Eastern (UTC - 5). Where: IRC, in the #pyladies channel on the freenode network. Who: Anyone interested in contributing to Python. While we particularly encourage prospective OPW and Google Summer of Code interns to attend, this event is open to everyone. These are unstructured office hours; you’ll go through this material on environment setup and contributing your first patch at your own pace, with support from a great group of mentors on IRC. The setup material includes instructions for installing an IRC client and joining the #pyladies IRC channel. See you on Sunday!"
