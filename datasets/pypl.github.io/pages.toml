title = "PYPL PopularitY of Programming Language index"
description = "PYPL index popularity of programming language"
full_description = '''The PYPL PopularitY of Programming Language Index is created by analyzing how often language tutorials are searched on Google. The more a language tutorial is searched, the more popular the language is assumed to be. It is a leading indicator. The raw data comes from Google Trends. If you believe in collective wisdom, the PYPL Popularity of Programming Language index can help you decide which language to study, or which one to use in a new software project. document.write('<b>'+((getUrlParameter('country') =="") ? "Worldwide" : country[getUrlParameter('country')])+'</b>, '+month[new Date().getMonth()]+' '+new Date().getFullYear()) : The PYPL PopularitY of Programming Language Index is created by analyzing how often language tutorials are searched on Google : the more a language tutorial is searched, the more popular the language is assumed to be. It is a leading indicator. The raw data comes from Google Trends. If you believe in collective wisdom, the PYPL Popularity of Programming Language index can help you decide which language to study, or which one to use in a new software project. The index is currently limited to 29 languages. You can still analyze the popularity of your favorite language and compare it to others, using Google Trends. C++ has the same popularity as C on Google trends: to avoid duplication, it is not included in the PYPL index.'''
