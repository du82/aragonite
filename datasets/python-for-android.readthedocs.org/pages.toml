title = "python-for-android 2024.01.21 documentation"
full_description = "python-for-android# python-for-android (p4a) is a development tool that packages Python apps into binaries that can run on Android devices. It can generate: Android Package (APK) files, ready to install locally on a device, especially for testing. This format is used by many app stores but not Google Play Store. Android App Bundle (AAB) files which can be shared on Google Play Store. Android Archive (AAR) files which can be used as a re-usable bundle of resources for other projects. It supports multiple CPU architectures. It supports apps developed with Kivy framework, but was built to be flexible about the backend libraries (through “bootstraps”), and also supports PySDL2, and a WebView with a Python web server. It automatically supports dependencies on most pure Python packages. For other packages, including those that depend on C code, a special “recipe” must be written to support cross-compiling. python-for-android comes with recipes for many of the mosty popular libraries (e.g. numpy and sqlalchemy) built in. python-for-android works by cross-compiling the Python interpreter and its dependencies for Android devices, and bundling it with the app’s python code and dependencies. The Python code is then interpreted on the Android device. It is recommended that python-for-android be used via Buildozer, which ensures the correct dependencies are pre-installed, and centralizes the configuration. However, python-for-android is not limited to being used with Buildozer. Buildozer is released and distributed under the terms of the MIT license. You should have received a copy of the MIT license alongside your distribution. Our latest license is also available. Contents# Getting Started Concepts Installation Usage Advanced usage Build options Python versions Bootstrap options Requirements blacklist (APK size optimization) Commands Commands index General arguments Distribution arguments Working on Android Storage paths Runtime permissions Other common tasks Advanced Android API use distutils/setuptools integration Have p4a apk run setup.py (replaces --requirements) Use your setup.py to call p4a Recipes Creating your own Recipe Methods and tools to help with compilation Using a PythonRecipe Using a CythonRecipe Using a CompiledComponentsPythonRecipe Using an NDKRecipe A Recipe template Examples of recipes The Recipe class Bootstraps Creating a new bootstrap Services Service creation Troubleshooting Debug output Debugging on Android Unpacking an APK FAQ Docker Testing an python-for-android pull request Common steps Using python-for-android commands directly from the pull request files Installing python-for-android using the github’s branch of the pull request Using buildozer with a custom app FAQ Contribution Guidelines Contact Us Indices and tables# Index Module Index Search Page"
