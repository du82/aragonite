title = "Python Ireland"
full_description = "Introduction Python Ireland is the Irish organisation representing the various chapters of Python users. We organise meet ups and events for software developers, students, academics and anyone who wants to learn the language. One of our aims is to help grow and diversify the Python community in Ireland. We also develop and foster links with other Python based communities overseas. PyCon Ireland 2024 🎉 We are thrilled to announce PyCon Ireland 2024, taking place in the vibrant city of Dublin on November 16th and 17th! 🗓️ We warmly invite both newcomers to the Python community and seasoned veterans to join us for this exciting event. 🐍💻PyCon Ireland 2024 will feature a dynamic, multi-track conference on Saturday, followed by an engaging day of hands-on workshops on Sunday. Your conference ticket grants access to all activities (see T&Cs for details) and includes breakfast and lunch on Saturday. Join us on Saturday evening for a fun and relaxed entertainment night, perfect for networking and unwinding. 🎤🍽️Our conference will showcase a diverse range of talks and workshops tailored to various skill levels, from beginners to experts, and spanning multiple fields. Topics will include everything from scripting and machine learning to web development and cloud deployments. 🌐🤖We are excited to announce the program of the conference! Get your tickets today, and share your anticipation to your followers on your favourite social media.We look forward to welcoming you to PyCon Ireland, known for its warm and friendly atmosphere. Please be mindful to adhere to our code of conduct to ensure a positive experience for all attendees. 🌟🤝See you in Dublin for an unforgettable PyCon Ireland 2024! 🎊✨ Monthly MeetupsOur monthly meetups are held every second Wednesday of the month.More details on meetup.comIf you want to receive occasional news about our events, please subscribe to our newsletter"
