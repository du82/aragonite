h themAllow for publishing the transcriptLogo on caption screen, main room, during the conference.Publicised on the PyCon Ireland website, with a link to your company website.3x Complimentary tickets Volunteers €2000 Logo on front side of all volunteers T shirts (around 20, helping at registration and around)Signage at registration deskPublicised on the PyCon Ireland website and the conference app, with a link to your company website.2x Complimentary tickets Bar and Entertainment - €2500Logo on drinks vouchers for attendeesExclusive signage in entertainment venue.Optional speech in venue.Publicised on the PyCon Ireland website, with a link to your company website.2x Complimentary tickets Lanyards - €1250Lanyards need to be providedYour choice of LanyardLogo on LanyardsPublicised on the PyCon Ireland website and the conference app, with a link to your company website. Workshop - €500 (Limit 2) Signage in both workshop rooms.Publicised on the PyCon Ireland website and the conference app, with a link to your company website. * Note regarding complimentary ticketsIf you do not wish to avail of your ticket allocation, please let us know so we can redistribute the tickets (or feel free to offer them to attendees yourselves). How to applyPlease contact us at [email protected] with your choice of the above options and we will be in contact! Terms and Conditions Sponsorship application is handled on a "ﬁrst-come, ﬁrst-served" basis.Sponsors should be committed to the use of the Python language and supportive of Python Ireland’s mission to provide a conference aimed at the Python community: Python users and programmers of all skill levels.The organisation of PyCon Ireland 2022 is being carried out by Python Ireland Developers Limited and all contracts and ﬁnancial matters are handled by the company.The Committee of Python Ireland Developers Limited retains the right to reject any sponsor that it deems to be inappropriate.After written acceptance by the Committee, the sponsor 