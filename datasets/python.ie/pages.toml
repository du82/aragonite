["https://python.ie/policies/code-conduct"]
title = "Code of Conduct"
full_description = '''Python Ireland Code of Conduct Python Ireland Developers CLG (Python Ireland) is a community organisation intended for networking and collaboration in the developer community.We value the participation of each delegate/attendee, speaker, exhibitor, organiser and volunteer (member) of the Python community and want all members to have an enjoyable and fulfilling experience. Accordingly, all members are expected to show respect and courtesy to other members at all Python Ireland events, whether officially sponsored by Python Ireland or not.To make clear what is expected, all delegates/attendees, speakers, exhibitors, organisers and volunteers at any Python Ireland event are required to conform to the following Code of Conduct. Python Ireland Developers Limited organisers and volunteers will enforce this code throughout all events.The Short VersionPython Ireland is dedicated to providing a harassment-free experience for everyone, regardless of gender, sexual orientation, disability, physical appearance, body size, race, or religion. We do not tolerate harassment of any member in any form.All communication should be appropriate for a professional audience including people of many different backgrounds. Sexual language and imagery is not appropriate for any venue, including talks, workshops and sprints.Be kind to others. Do not insult or put down other attendees. Behave professionally. Remember that harassment and sexist, racist, or exclusionary jokes are not appropriate for Python Ireland.Participants violating these rules may be asked to leave the event without a refund at the sole discretion of the event organisers.Thank you for helping make this a welcoming, friendly event for all.The Long VersionHarassment includes offensive verbal comments related to gender, sexual orientation, disability, physical appearance, body size, race, religion, sexual images in public spaces, deliberate intimidation, stalking, following, harassing photography or recording, sustained disruption of talks or other events, inappropriate physical contact, and unwelcome sexual attention.Participants asked to stop any harassing behaviour are expected to comply immediately.Exhibitors in the expo hall, sponsor or vendor booths, or similar activities are also subject to the anti-harassment policy. In particular, exhibitors should not use sexualised images, activities, or other material. Booth staff (including volunteers) should not use sexualised clothing/uniforms/costumes, or otherwise create a sexualised environment.Be careful in the words that you choose. Remember that sexist, racist, and other exclusionary jokes can be offensive to those around you. Excessive swearing and offensive jokes are not appropriate for Python Ireland.If a participant engages in behaviour that violates this code of conduct, the event organisers may take any action they deem appropriate, including warning the offender or expulsion from the event with no refund.Contact InformationIf you are being harassed, notice that someone else is being harassed, or have any other concerns, please contact a member of event staff. In the case of PyCon Ireland, staff will be wearing "PyCon Ireland Staff" t-shirts. You may also contact venue staff and ask to be put in touch with the Python Ireland chairperson "Nicolas Laurance" or the event organiser.If the matter is especially urgent, please call/contact any of these individuals:Nicolas Laurance - +353 (0)83 855 70 16Event staff will be happy to help participants contact hotel/venue security or local law enforcement, provide escorts, or otherwise assist those experiencing harassment to feel safe for the duration of the event. We value your attendance.LicenseThis Code of Conduct was forked from the example policy from the [PyCon Code of Conduct on Github](https://github.com/python/pycon-code-of-conduct) which is under a Creative Commons Zero license.Conference Code of Conduct by Python Ireland Developers Limited is licensed under a Creative Commons Attribution 3.0 Unported License. Handling Harassment Attendee Procedure for incident handlingThis procedure has been adopted from the Ada Initiative's guide titled "Conference anti-harassment/Responding to Reports".Keep in mind that all conference staff will be wearing a conference t-shirt/button with the word "STAFF" on it (or otherwise clearly marked as staff). The staff will also be prepared to handle the incident. All of our staff are informed of the code of conduct policy and guide for handling harassment at the conference. There will be a mandatory staff meeting onsite at the conference when this will be reiterated.Report the harassment incident (preferably in writing) to a conference staff member. All reports are confidential. Please do not disclose public information about the incident until the staff have had sufficient time in which to address the situation. This is as much for your safety and protection as it is the other attendees. When reporting the event to staff, try to gather as much information as available but do not interview people about the incident. Staff will assist you in writing the report/collecting information. The important information consists of: The staff is well informed on how to deal with the incident and how to further proceed with the situationIf everyone is presently physically safe, involve law enforcement or security only at a victim's request. If you do feel your safety in jeopardy please do not hesitate to contact local law enforcement by dialing 112. If you do not have a cell phone, you can use any hotel phone or simply ask a staff member.If at all possible, all reports should be made directly to the event organiser or Python Ireland Chairperson.Staff Procedure for incident handlingThis procedure has been adopted from the Ada Initiative's guide titled "Conference anti-harassment/Responding to Reports.Be sure to have a good understanding of our Code of Conduct policy, which can be found here:Also have a good understanding of what is expected from an attendee that wants to report a harassment incident. These guidelines can be found here: Attendee Procedure for incident handlingTry to get as much of the incident in written form by the reporter. If you cannot, transcribe it yourself as it was told to you. The important information to gather include the following:Identifying information (name/badge number) of the participant doing the harassingThe behaviour that was in violationThe approximate time of the behaviour (if different than the time the report was made)The circumstances surrounding the incidentOther people involved in the incidentPrepare an initial response to the incident. This initial response is very important and will set the tone for Python Ireland. Depending on the severity/details of the incident, please follow these guidelines:If there is any general threat to attendees or the safety of anyone including conference staff is in doubt, summon security or policeOffer the victim a private place to sitAsk "is there a friend or trusted person who you would like to be with you?" (if so, arrange for someone to fetch this person)Ask them "how can I help?"Provide them with your list of emergency contacts if they need help laterIf everyone is presently physically safe, involve law enforcement or security only at a victim's requestThere are also some guidelines as to what not to do as an initial response:Do not overtly invite them to withdraw the complaint or mention that withdrawal is OK. This suggests that you want them to do so, and is therefore coercive. "If you're OK with it [pursuing the complaint]" suggests that you are by default pursuing it and is not coercive.Do not ask for their advice on how to deal with the complaint. This is a staff responsibility.Do not offer them input into penalties. This is the staff's responsibility.Once something is reported to a staff member, immediately meet with the conference chair and/or event coordinator. The main objectives of this meeting is to find out the following:What happened?Are we doing anything about it?Who is doing those things?When are they doing them?After the staff meeting and discussion, have a staff member (preferably the conference chair or event coordinator if available) communicate with the alleged harasser. Make sure to inform them of what has been reported about them.Allow the alleged harasser to give their side of the story to the staff. After this point, if the report stands, let the alleged harasser know what actions will be taken against them.Some things for the staff to consider when dealing with Code of Conduct offenders:Warning the harasser to cease their behaviour and that any further reports will result in sanctionsRequiring that the harasser avoid any interaction with, and physical proximity to, their victim for the remainder of the eventEnding a talk that violates the policy earlyNot publishing the video or slides of a talk that violated the policyNot allowing a speaker who violated the policy to give (further) talks at the event now or in the futureImmediately ending any event volunteer responsibilities and privileges the harasser holdsRequiring that the harasser not volunteer for future events your organisation runs (either indefinitely or for a certain time period)Requiring that the harasser refund any travel grants and similar they received (this would need to be a condition of the grant at the time of being awarded)Requiring that the harasser immediately leave the event and not returnBanning the harasser from future events (either indefinitely or for a certain time period)Removing a harasser from membership of relevant organisationsPublishing an account of the harassment and calling for the resignation of the harasser from their responsibilities (usually pursued by people without formal authority: may be called for if the harasser is the event leader, or refuses to stand aside from the conflict of interest, or similar, typically event staff have sufficient governing rights over their space that this isn't as useful)Give accused attendees a place to appeal to if there is one, but in the meantime the report stands. Keep in mind that it is not a good idea to encourage an apology from the harasser.It is very important how we deal with the incident publicly. Our policy is to make sure that everyone aware of the initial incident is also made aware that it is not according to policy and that official action has been taken - while still respecting the privacy of individual attendees. When speaking to individuals (those who are aware of the incident, but were not involved with the incident) about the incident it is a good idea to keep the details out.Depending on the incident, the conference chair, or designate, may decide to make one or more public announcements. If necessary, this will be done with a short announcement either during the plenary and/or through other channels. No one other than the conference chair or someone delegated authority from the conference chair should make any announcements. No personal information about either party will be disclosed as part of this process.If some attendees were angered by the incident, it is best to apologize to them that the incident occurred to begin with. If there are residual hard feelings, suggest to them to write an email to the conference chair or to the event coordinator. It will be dealt with accordingly.'''
year_published = 2025
