Logo on drinks vouchers for attendees Exclusive signage in entertainment venue. Optional speech in venue. Publicised on the PyCon Ireland website, with a link to your company website.2x Complimentary tickets Gold - €1750 (Limit 5) 1 REMAININGChoice of Exhibition space in main reception area.Put your logo or Job Specifications in the scheduled notifications to all attendees (using Attendify)2x Complimentary tickets*.Publicised on the PyCon Ireland website and the conference app, with a link to your company website.Swag bag space Silver - €8502x Conference ticketsPublicised on the PyCon Ireland website, and the conference app, with a link to your company website.Swag bag space Lanyards - €1000 (Limit 1) SOLDLanyards IncludedYour choice of LanyardLogo on LanyardsPublicised on the PyCon Ireland website and the conference app, with a link to your company website. Workshop - €500 (Limit 2) 1 REMAINING Signage in either workshop room. Publicised on the PyCon Ireland website and the conference app, with a link to your company website. * Note regarding complimentary ticketsIf you do not wish to avail of your ticket allocation, please let us know so we can redistribute the tickets (or feel free to offer them to attendees yourselves). How to apply Please contact us at [email protected] with your choice of the above options and we will be in contact! Terms and Conditions Sponsorship application is handled on a "ﬁrst-come, ﬁrst-served" basis. Sponsors should be committed to the use of the Python language and supportive of Python Ireland’s mission to provide a conference aimed at the Python community: Python users and programmers of all skill levels. The organisation of PyCon Ireland 2017 is being carried out by Python Ireland Developers Limited and all contracts and ﬁnancial matters are handled by the company. The Committee of Python Ireland Developers Limited retains the right to reject any sponsor that it deems to be inappropriate. After written acceptance by the Committee, the sponsor should provide the sponsorship funds, logo image in an appropriate format, and other details required within three weeks of receipt of the acceptance, and in any case one week before the start of the Conference. Sponsorship pledges cannot be processed without payment. All pledges must be made in Euros by electronic transfer, and made payable to: Python Ireland Developers Limited. Bank details for electronic transfer will be sent on request. Sponsors may not sublet, assign or apportion any part of the item(s) sponsored nor represent advertise or distribute literature or materials for the products or services of any other ﬁrm or organisation. Python Ireland Developers Limited will not be liable for damage or loss to sponsors' properties by ﬁre, theft, accident or any other cause whether the result of negligence or otherwise or case of force majeure. For sponsorship packages that include the use of signage, please note that signage space may be limited. The conference organisers will inform each sponsor about the maximum size and number of signs that they can use. Banners must be self-supporting. Refund Policy - Please contact [email protected] regarding refunds. The following is our refund policy:- Full Refund up to 90 days before the conference. 50% Refund within 90 days before the conference. No Refunds within 60 days before the conference.'''
