["https://python.ie/policies/personal-statements-policy"]
title = "Code of Conduct"
full_description = "Purpose: To establish clear boundaries between the actions of Python Ireland’s committee members in their official capacity on behalf of Python Ireland and any statements voiced in their capacity as private individuals. Policy Statement: Python Ireland respects the personal privacy and autonomy of its leadership, committee members and all other members.Those in a position of responsibility are expected to uphold the organisation’s values in their official capacity.Python Ireland expects a high level of professionalism and conduct from its leadership while respecting their rights to autonomy, opinions, and views when acting outside of their respective roles.Python Ireland takes the community code of conduct seriously and any legitimate complaints should be brought to our attention without hesitation. Scope: Official Capacity: Statements, actions, or public communications explicitly made on behalf of Python Ireland or in a capacity representing the organization, such as on a stage during during a Python Ireland event.Personal Capacity: Private opinions, comments, or engagements on personal accounts that do not claim to represent Python Ireland. In particular, in-person communication outside of a Python Ireland event, online activity not made via a Python Ireland account, and communication that is not in direct violation of community standards (please see section “Caveats”*). Guidelines: Official Scrutiny: Public statements or actions made explicitly on behalf of Python Ireland are subject to scrutiny by the organisation or external parties.Complaint Handling: Python Ireland has a zero tolerance policy towards “trolling” for the purpose of, or with the intent to harass committee members, or invasive scrutiny of Python Ireland committee members' irrelevant personal online activity. However, complaints made to Python Ireland will be investigated with due care and consideration. Communication: When handling complaints or concerns, Python Ireland will ensure its position is clearly communicated to protect the integrity of the organisation and its core aims. Caveat: In cases where a complaint involves allegations of illegal activity, Python Ireland encourages the complainant to report the matter directly to the appropriate authorities. Python Ireland does not adjudicate or investigate such issues but will cooperate with legal inquiries as required.This policy aims to protect the integrity of Python Ireland while fostering a respectful and safe environment for all of its members.*Examples of such violations that should be reported include but are not limited to:Contact through personal communication channels causing a community member to fear harm to their career or continued full participation in Python Ireland activities if they do not oblige a committee member;Conduct directly detrimental to the reputation of Python Ireland."
