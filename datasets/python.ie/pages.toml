full_description = '''PyCon Ireland 2016 PyCon Ireland is back! This year the conference will be held on Sat 5th - Sun 6th November in the Radisson Blu Royal Hotel in Dublin. The format will consists of two tracks of talks along with two tracks of workshops. Tickets are now SOLD OUT Like Pycon or DjangoCon, we chose to apply a "everybody pays" policy.Everybody really does mean everybody - attendees, speakers, volunteers, organisers - with one exception: those who can’t afford to pay, who can submit a financial aid application.Thank you to everyone who has bought a ticket. We hope you have a fantastic time at the conference. This years event promises to be bigger than ever given the huge numbers we've been seeing at our meetups during the year. Schedule Continuing on the success of last years purely data science track, we're having an even better track this year covering Data Science Tools in python, Machine Learning, Data Visualization and Cleaning Data. So you can completely immerse yourself in the wonderful world of data analysis through Python. The tutorials & workshops are back too! Each year the workshops have always been hugely popular and this year will be no different. Advanced Python WorkshopThere is also a one-day Advanced Python workshop run by Mike Müller of Python Academy. It takes place at The Trinity City Hotel, Dublin City on Friday November the 4th. This is a great opportunity to lift your Python skills to an advanced level. Full details http://www.python-academy.com/courses/python_advanced_pyconie.html'''
