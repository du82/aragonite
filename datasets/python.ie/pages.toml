["https://python.ie/previous-pycons/pycon-2015/call-for-sponsors"]
title = "PyCon 2015 - Call for Sponsors"
full_description = '''PyCon Ireland 2015 - Sponsorship Prospectus What is PyCon Ireland? PyCon Ireland is a Python conference organised by the Python Ireland Community. This year PyCon Ireland will consist of two days of talks, tutorials and workshops. Talk are given by high quality speakers and professionals from the Python Community within Ireland and abroad. Tutorials are classroom based session which help build on the continuous learning objectives of the Python professionals that PyCon attracts. The conference format is personal, informative and friendly. Our aim is to present a mix of both world class python leaders and showcase Irish talent. Last year, we increased our attendance to just over 350 delegates. PyCon brings in the top Python professionals from Ireland, UK, Europe and further afield. We also encourage third level students to attend and offer student and unwaged ticket options. In 2015, we're aiming to increase PyCon Ireland's value for our attendees and sponsors. We will be focusing on improving our media coverage and continue building the profile of the conference. Year on year PyCon has grown, starting at around 100 attendees right up to last year’s 350 person attendance. Sponsorship and a recruitment stall present an opportunity to connect directly with the talent attending. Our delegates’ skills are rarely limited to Python only. Our more successful sponsors have made as many as 15 direct hires through PyCon Ireland. In one case the cost saving made through direct hiring was in excess of €120K. Python Ireland invites you to increase your brand value with a key demographic of software developers through conference sponsorship opportunities. With the value of independent and open source developers being broadly recognised as a low cost / high value resource, this is a perfect opportunity to consider sponsorship. Sponsorship options Diamond - €5000 (Limit 1) First choice of exhibition space in main reception area.10x complimentary tickets*.Stage signage in main conference room with an audience of 400.Option to present a Keynote talk.Logo on intermission slides during the conference.Logo on all videos on after the event.Mentioned in all marketing mail sent to PyCon attendees.Logo on swag bag handed to each attendee.Publicised on the PyCon Ireland & Python Ireland website, with a link to your company website.Swag bag space. Platinum - €2500 (Limit 3) Choice of Exhibition space in main reception area.5x Complimentary tickets*.Stage signage in second conference room with an audience of 120pax. Publicised on the PyCon Ireland website, with a link to your company website. Swag bag space. Gold - €1000Choice of Exhibition space in main reception area.2x Complimentary tickets*.Publicised on the PyCon Ireland website, with a link to your company website.Swag bag space Silver - €5002x Conference ticketsPublicised on the PyCon Ireland website, with a link to your company website.Swag bag space Bar and Entertainment - €2000 (Limit 1) Logo on drinks vouchers for attendees Exclusive signage in entertainment venue. Optional speech in venue. Publicised on the PyCon Ireland website, with a link to your company website.2x Complimentary tickets Lanyards - €500 + cost of lanyards (Limit 1)Your choice of LanyardLogo on LanyardsPublicised on the PyCon Ireland website, with a link to your company website. Workshop - €500 (Limit 2) Signage in either workshop room. Publicised on the PyCon Ireland website, with a link to your company website. * Note regarding complimentary ticketsThere are 2 additional tickets allocated for staff members at your exhibition stand only which do not count towards your total allocation. If you do not wish to avail of your ticket allocation, please let us know so we can redistribute the tickets (or feel free to offer them to attendees yourselves). How to apply Please contact us at [email protected] with your choice of the above options and we will be in contact! Terms and Conditions Sponsorship application is handled on a "ﬁrst-come, ﬁrst-served" basis. Sponsors should be committed to the use of the Python language and supportive of Python Ireland’s mission to provide a conference aimed at the Python community: Python users and programmers of all skill levels. The organisation of PyCon Ireland 2015 is being carried out by Python Ireland Developers Limited and all contracts and ﬁnancial matters are handled by the company. The Committee of Python Ireland Developers Limited retains the right to reject any sponsor that it deems to be inappropriate. After written acceptance by the Committee, the sponsor should provide the sponsorship funds, logo image in an appropriate format, and other details required within three weeks of receipt of the acceptance, and in any case one week before the start of the Conference. Sponsorship pledges cannot be processed without payment. All pledges must be made in Euros by electronic transfer, and made payable to: Python Ireland Developers Limited. Bank details for electronic transfer will be sent on request. Sponsors may not sublet, assign or apportion any part of the item(s) sponsored nor represent advertise or distribute literature or materials for the products or services of any other ﬁrm or organisation. Python Ireland Developers Limited will not be liable for damage or loss to sponsors' properties by ﬁre, theft, accident or any other cause whether the result of negligence or otherwise or case of force majeure. For sponsorship packages that include the use of signage, please note that signage space may be limited. The conference organisers will inform each sponsor about the maximum size and number of signs that they can use. Banners must be self-supporting. Refund Policy - Please contact [email protected] regarding refunds. The following is our refund policy:- Full Refund up to 60 days before the conference. 50% Refund within 60 days before the conference. No Refunds within 30 days before the conference.'''
