["https://python.ie/previous-pycons/pycon-2018/terms-and-conditions-attend-pycon-ie-2018"]
title = "Terms and conditions to attend Pycon IE 2018"
full_description = '''Terms and conditions to attend Pycon IE 2018 These Terms and Conditions apply to all attendees, organizers, speakers and volunteers who have registered for PyCon Ireland 2018 and/or PyCon Ireland 2018-related events, and sponsors’ staff.RegistrationRegistering for the event does not guarantee your ticket until it has been paid for in full. So to secure your ticket, you must pay the registration invoice as soon as possible.Cancellation PolicyCancellations made prior to 1 October 2018 - any registration fee paid will be refunded in full.Cancellations made on or after 1 October 2018 - No refund.SubstitutionsPrior to 1 October 2018, you may substitute another person, however you must contact us with this person's details.Privacy NoticeIn the course of registering for the event and related events, personal information will be collected about attendees such as their name, contact details, etc. This information is required to facilitate registration to to the event, for catering requirements, and for organisers or their agents to contact particular attendees as and when required in respect of the event. Attendees who do not disclose this personal information will be unable to complete registration at the event and will therefore not be able to attend.Personal information will only be disclosed to Government agencies where organisers believe disclosure is appropriate for legal compliance and law enforcement; to facilitate court proceedings; to enforce our terms and conditions; or to protect the rights, property, or safety of the event, our attendees, or others. Python Ireland CLG will not sell your personal information to third parties and will not use your personal information to send promotional material from any of our affiliated partners and/or sponsors.From time to time event organisers update their information and website practices. Please regularly review the event’s web page for the most recent information about the event privacy practices.All personal information will be kept private and used only for event registration purposes, statistics for future events, and convenience for future event registration.NetworkThe event may provide attendees with access to a wired and/or wireless network. The access to this network is a privilege and not an entitlement, and must be used appropriately. Inappropriate use includes, but is not limited to: unlawful activities, interfering with the equipment or network access of others and not respecting the reasonable expectations of privacy that attendees have for traffic flowing through the network.Any deliberately malicious activities on either the wired or wireless networks will be grounds for instant dismissal from the conference (Without reimbursement).If any attendees use the network inappropriately, then the PyCon Ireland organisers will take any enforcement action they consider appropriate. Enforcement action includes but is not limited to:suspending access to the networkdisconnecting the network permanentlythe alleged offender may be asked to immediately leave the venue and/or will be prohibited from continuing to attend PyCon Ireland 2018 (without reimbursement)the incident may be reported to Garda Siochana (Irish Police)any other measure the PyCon Ireland 2018 Organisers see fitBeware that for security and operational reasons PyCon Ireland 2018 may both monitor and log network traffic.Audio VisualEvent organisers may provide recordings of talks (audio and/or video) given at the event. This service is provided on a best-effort basis only. Any recordings will be released as and when they are ready, which may be some time after the conclusion of the event, and the recordings may be of varying quality. If you give a talk at the conference, you thereby agree that the talk may be recorded and published on social media.Discrimination and Anti-Social BehaviourPython Ireland is proud to support diverse groups of people in IT, and will not tolerate in any fashion any intimidation, harassment, and/or any abusive, discriminatory or derogatory behaviour by any attendees of the event and/or related events.Examples of these behaviours and measures the event organisers may take are set out in the Code of Conduct. By registering for and attending PyCon Ireland 2018, you agree to this Code of Conduct.MediaThere are a limited number of Media Passes available to media personnel. Media Passes are free of charge, and entitle media personnel to attend the event with all the entitlements of a Professional registration. Please note, due to the limited numbers of Media Passes available, all Media Passes will need to be approved by the event organisers.Any media attending the event are required to identify themselves as "media" to attendees prior to speaking on the record with any attendees of the event. It is the responsibility of the media to introduce themselves to the persons they wish to interview and to arrange any interviews with those persons. The event organisers will not make introductions or arrange interviews on behalf of media.To apply for a Media Pass, please contact [email protected]StudentsStudents who register for a student ticket (if available) to attend the event may be required to provide event organisers with proof that they are eligible for registration as a student, such as providing a valid full time student ID card.AlcoholLiquor licensing laws, requires persons to be aged 18 years and older before they can lawfully drink alcohol in Ireland. The licensed premises used as PyCon Ireland 2018 venues will not serve alcohol to persons 18 years and under. Those attendees who look under 25 years old, may be required to show identification such as National Age Card, a passport, a driving licence, or an identity card issued by an EU member state to licensed premises proving they are 18 years old or older.Those attendees who are younger than 18 years old are required to advise event organisers of their age, when they register. Those attendees may not be able to attend all of the associated social events.Please consume alcohol responsibly. Please adhere to local liquor laws which are available in most licensed establishments and online Smoke-freeAll event venues including the social event venues are smoke-free, including e-cigarettes. If attendees wish to smoke during the event and/or related events, they must do so in signed areas. Immigration/Entry RequirementsAnyone who lives outside Ireland will need an identity card issued by an EU member state, or a passport and may require a visa to gain entry into Ireland. Please contact your local Irish Embassy department to determine your travel needs. You should take into account the Cancellation Policy above and do this well in advance of the event.Where a letter of invitation is required, one will be issued by event organisers for anyone with a valid ticket.'''
