["https://python.ie/previous-pycons/pycon-2022/call-for-sponsors"]
title = "PyConIE 2022 - Call for Sponsors"
full_description = '''PyCon Ireland 2022 - Sponsorship Prospectus What is PyCon Ireland?PyCon Ireland is a Python conference organised by the Python Ireland Community. This year PyCon Ireland will consist of two days of talks, tutorials and workshops. Talk are given by high quality speakers and professionals from the Python Community within Ireland and abroad. Tutorials are classroom based session which help build on the continuous learning objectives of the Python professionals that PyCon attracts.The conference format is personal, informative and friendly. Our aim is to present a mix of both world class python leaders and showcase Irish talent. Last year, we increased our attendance to just over 380 delegates. PyCon brings in the top Python professionals from Ireland, UK, Europe and further afield. We also encourage third level students to attend and offer student and unwaged ticket options. In 2018, we're aiming to increase PyCon Ireland's value for our attendees and sponsors. We will be focusing on improving our media coverage and continue building the profile of the conference. Year on year PyCon has grown, starting at around 100 attendees right up to last edition's 420 person attendance.Sponsorship and a recruitment stall present an opportunity to connect directly with the talent attending. Our delegates’ skills are rarely limited to Python only. Our more successful sponsors have made as many as 15 direct hires through PyCon Ireland. In one case the cost saving made through direct hiring was in excess of €120K.Python Ireland invites you to increase your brand value with a key demographic of software developers through conference sponsorship opportunities. With the value of independent and open source developers being broadly recognised as a low cost / high value resource, this is a perfect opportunity to consider sponsorship. Sponsorship options Diamond - €7500 (Limit 1, Sold out)Premium exhibition space in main exhibition area.10x complimentary tickets*.Stage