full_description = "Bugs found by the Python project¶ CPython has an extensive test suite which sometimes spot bugs in third party code. Kernel bugs¶ FreeBSD copy_file_range bug Crash with mmap and sparse files on Mac OS X test_os on Linux 2.6.?35? return code Many issues with threads+signals on OpenBSD and old versions of FreeBSD: test disabled on these platforms FreeBSD: when close(fd) on a fifo fails with EINTR, the file descriptor is not really closed FreeBSD: bug in ZFS: https://github.com/python/cpython/issues/59953 Compiler bugs¶ ppc64le double to float cast + memcpy bug https://bugs.python.org/issue35752 https://gcc.gnu.org/bugzilla/show_bug.cgi?id=88892 Visual Studio: PGO on 64 bits Visual Studio PGupdate duplicated functions: “Disable COMDAT folding in Windows PGO builds.” http://bugs.python.org/issue8847#msg166935 http://hg.python.org/cpython/rev/029cde4e58c5 Error with gcc-4.6 -O1 -ftree-vectorize “Python 3.2 doesn’t compile correctly with -O3” http://gcc.gnu.org/ml/gcc-help/2011-01/msg00136.html http://gcc.gnu.org/bugzilla/show_bug.cgi?id=47271 http://gcc.gnu.org/viewcvs?view=revision&revision=169233 Apple Clang bug llvm-gcc-4.2 miscompiles Python (XCode 4.1 on Mac OS 10.7)"
