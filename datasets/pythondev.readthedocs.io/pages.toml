full_description = "Communication Channels¶ See also the Python community. Mailing lists: python-ideas python-dev python-committers see the list of all Python mailing lists IRC: #python on Libera Chat #python-dev on Libera Chat: only for development of Python, mostly to discuss bugs and pull requests Discord discuss.python.org (Discourse) (exist since 2018) python.zulipchat.com (Zulip) (exist since 2017) Twitter, incomplete list of core devs: Barry Warsaw Brett Cannon Guido van Rossum Łukasz Langa Mariatta Wijaya Serhiy Storchaka Yury Selivanov … the full list is very long, and I’m too lazy to complete it :-) There are two physical meetings for CPython core developers: Language Summit during Pycon US (one day) Sprint in September (one week)"
