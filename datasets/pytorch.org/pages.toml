title = "PyTorch Cloud Credit Program | PyTorch"
full_description = "We believe providing public, self-service, and automated access to Cloud Infrastructure is crucial for every project to incubate, grow, and succeed. That’s why PyTorch has created the Cloud Credits program, focussed on the mutual success of projects and participating companies. To date, supporters like AWS have donated cloud credits to showcase direct support of our incubating and graduated projects. In fact, many organizations sponsor PyTorch projects for their business to succeed. Advance the ecosystem Join the PyTorch Credits program and benefit in the following ways: Highlight your company participation in the ecosystem Help shape the future of cloud native Establish your company as a thought leader in the space Collaborate with various companies and organizations — improving open source technologies Cloud credit levels + benefits Supporter Starting benefits Coordinated PyTorch blog Appropriate placement on the PyTorch website $250k+ Advocate Everything included in Supporter benefits, plus: Bonus online program slot (live webinar, live stream, or on-demand webinar - your choice) to highlight your participation in the program $500k+ Champion Everything included in Advocate benefits, plus: Top placement on the PyTorch website with an explanation of the offering PyTorch marketing campaign to drive awareness towards the donation - Coordinated blog post and media outreach - Social media shout out to thank your company for their contribution - Mention in the PyTorch keynote at the next PyTorch Conference PyTorch will set up resource pooling and CI capacity for self-service of your offering $1m+ How it works Step 1 Decide how to donate Cloud credits can be donated via cash or credit: Credit, for products a sponsor usually sells as a service to the public Cash, to be earmarked for paying for services when we run out of donated credits Step 2 Determine the technical points of contact Projects often need help utilizing credits. We ask that you provide a technical support resource with a defined SLA. Step 3 Projects benefit from your donation After getting set up with PyTorch, projects can access these credits via a curated self-service portal, managed by PyTorch. Join the PyTorch Cloud Credits Program"
