["https://pytorch.org/ecosystem"]
title = "Ecosystem | PyTorch"
full_description = "Tap into a rich ecosystem of tools, libraries, and more to support, accelerate, and explore AI development. Diffusers provides pretrained diffusion models across multiple modalities, such as vision and audio, and serves as a modular toolbox for inference and training of diffusion models. Captum (“comprehension” in Latin) is an open source, extensible library for model interpretability built on PyTorch. Kornia is a differentiable computer vision library that consists of a set of routines and differentiable modules to solve generic CV problems. FuseMedML is a python framework accelerating ML based discovery in the medical field by encouraging code reuse AllenNLP is an open-source research library built on PyTorch for designing and evaluating deep learning models for NLP. docTR (Document Text Recognition) - a seamless, high-performing & accessible library for OCR-related tasks powered by Deep Learning. Renate is a library providing tools for re-training pytorch models over time as new data becomes available. PyPose is a robotics-oriented, PyTorch-based library that combines deep perceptual models with physics-based optimization techniques, so that users can focus on their novel applications. pomegranate is a library of probabilistic models that is built in a modular manner and treats all models as the probability distributions that they are. Substra is a federated learning Python library to run federated learning experiments at scale on real distributed data. Horovod is a distributed training library for deep learning frameworks. Horovod aims to make distributed DL fast and easy to use. CrypTen is a framework for Privacy Preserving ML. Its goal is to make secure computing techniques accessible to ML practitioners. MONAI provides domain-optimized foundational capabilities for developing healthcare imaging training workflows. A deep learning library for video understanding research. Hosts various video-focused models, datasets, training pipelines and more. RoMa is a standalone library to handle rotation representations with PyTorch (rotation matrices, quaternions, rotation vectors, etc). It aims for robustness, ease-of-use, and efficiency."
