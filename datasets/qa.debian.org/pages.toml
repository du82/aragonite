["https://qa.debian.org/developer.php"]
title = "DDPO -- Debian Quality Assurance"
full_description = '''Debian Developer's Packages Overview List of packages for maintainer: Separate multiple logins by spaces. Logins without @ get @debian.org appended. If you include an uppercase letter, search is done by maintainer name; only a single pattern (possibly including spaces) is accepted in that mode. Display co-maintained packages: yes no only Search based on the GPG key ID: Display co-maintained packages: yes no only List of packages for maintainer, query by source package name: Display co-maintained packages: yes no only List of packages, space separated: List of packages for a task: List of packages for a WNPP/RM tag: (RFP, ITP, ITA, O, RM) Subscribing to Packages Additional packages can be added to the list of packages shown. There are two interfaces, URL and mail based. Firstly, one can append &packages=pkg1+pkg2+... to the URL, or enter package names in the 'Display configuration' form. This will create a new section "url" in the listing, independently of the selected login. Secondly, using the DDPO control bot at ddpo@qa.debian.org, packages are added to the listing for a login (mail address), optionally sorted in user-defined sections. The following commands are accepted: user address Process commands for address. Defaults to the address used in the From: header. Example: user cb@df7cb.de subscribe srcpackage [section] Adds srcpackage to the listing. If section is omitted, defaults to "ddpo". This command can also be used to move srcpackage to a different section. Examples: subscribe endeavour subscribe rdiff-backup sponsor-panthera The special section "uploader" allows subscription to uploads made by a developer. This is useful when a DD is not using their @debian.org address for their packages. It is also possible to use a keyid here (8-char, prefixed by 0x; useful if the account was created recently and the projectb does not know about it yet). (Appending &uploader= to the URL gives the same result.) Example: subscribe myon@debian.org uploader unsubscribe srcpackage Removes the srcpackage from the listing. Example: unsubscribe libextractor which Print the list of subscribed packages (automatically shown after subscribe/unsubscribe commands). help Print help text. quit thanks Stops processing commands. Display configuration: You need to allow cookies if you want the configuration to be stored. If not, remember/bookmark the right URL that will be provided after submitting changes. You can override the settings by providing an extra arg to the URL (e.g. &buildd=1 if you want to display the buildd column). These args will not change the custom settings you defined before (the cookie is not modified). Co-maintained (&comaint=) yes no only Description (&description=) In separate column As source mouseover only Bugs (&bugs=) Show (1) Hide (0) Sum. (2) Sum.&RC (3) Version (&version=) oldoldstable and newer oldstable and newer stable and newer testing and newer unstable only experimental and unstable VCS (&vcs=) Show Hide Ubuntu (&ubuntu=) Show Hide Excuses (&excuses=) Show Hide Binary Package (&bin=) Show Hide Buildd (&buildd=) Show (1) Hide (0) Detail (2) Lintian (&lintian=) Show Hide Debcheck (&problems=) Show Hide Piuparts (&piuparts=) Show Hide CI (&ci=) Show Hide Popcon (&popc=) Show Hide Watch (&watch=) Show Hide Section (&section=) Show Hide Ordering (&ordering=) Name (0) Date (1) N./D. (2) Section (3) Uploads (&uploads=) Show Hide Additionally show packages: uploaders: Help (click to collapse) The description of the package is available as mouseover title from the package name. An asterisk (*) indicates the presence of co-maintainers (Uploaders: control field) Blue packages are co-maintained by this developer The 'Bugs' columns display the real number of bugs. If there are merged bugs, the total is in parentheses Version columns are color-coded, mouseover titles show more information: Cyan: package in stable Red: package in stable security (not shown if also in stable) Dark blue: package in stable proposed updates (not shown if also in stable security) Light blue: package pending for stable proposed updates (not shown if also in stable security) Dark purple: package on backports Purple: testing version Green: unstable version Red: non-maintainer upload Grey: version in new Orange: version in incoming Light Red: version in delayed Ubuntu column: green: Ubuntu version is in sync with version in unstable magenta: Ubuntu version is greater than version in unstable navy blue: Ubuntu version is lower than version in unstable The 'Popcon' column displays the maximal install count for any binary in the source package Watch column: green: upstream found version is in sync with version in unstable/experimental magenta: upstream found version is greater than version in unstable navy blue: upstream found version is lower than version in unstable (a bug in the watch file?) Error: uscan had problems following the watch file The 'pending uploads' section shows packages uploaded/Changed-By this developer in incoming, new, and delayed The 'uploads' sections show all packages in the archive signed by this developer's key (NMUs, sponsored, QA uploads) collapse(1,"<b>Help</b>"); Updated: general information: Wed Mar 5 15:00:17 UTC 2025, projectb: Wed Mar 5 15:15:06 UTC 2025, bugs: Wed Mar 5 15:19:02 UTC 2025. Time needed to generate page: 0.00s Git repository | Report problems with DDPO to the qa.debian.org pseudopackage.'''
