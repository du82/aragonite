["https://qa.debian.org/daca"]
title = "Debian's Automated Code Analysis project"
full_description = "The following tools are being evaluated, looking for major false positives or bugs, and other issues that may degrade their usefulness. Feedback is appreciated. Automated Code Analysis helps detect and fix bugs and other issues in source code. The DACA project aims to give users easy access to a wide set of tools to improve quality, while giving the tool's developers a test bed, more visibility, and more feedback. Check the DACA (development) website and learn how to contribute and join the project. Note: if you think the results reveal a security bug, please don't hesitate to contact the security team More results and tools will be added as (CPU and human) time permits. Are you interested? email daca-general@lists.alioth.debian.org Made by Raphael Geissert. Template is Copyright (C) 1999-2009 Software in the Public Interest and others; See license terms."
