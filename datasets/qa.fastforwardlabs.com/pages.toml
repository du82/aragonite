title = "Evaluating QA: Metrics, Predictions, and the Null Response | NLP for Question Answering"
description = "A deep dive into computing QA predictions and when to tell BERT to zip it!"
full_description = '''Evaluating QA: Metrics, Predictions, and the Null ResponseA deep dive into computing QA predictions and when to tell BERT to zip it! Jun 9, 2020 • 31 min read no answer null threshold bert distilbert exact match F1 robust predictions Prerequisites Answering questions is complicated The SQuAD2.0 dev set Load the dev set using HF data processors A positive example A negative example Metrics for QA Exact Match F1 Load a Transformer model fine-tuned on SQuAD 2.0 Evaluating a model on the SQuAD2.0 dev set with HF [Optional] Computing predictions Using the null threshold Putting it all together Final Thoughts In our last post, Building a QA System with BERT on Wikipedia, we used the HuggingFace framework to train BERT on the SQuAD2.0 dataset and built a simple QA system on top of the Wikipedia search engine. This time, we'll look at how to assess the quality of a BERT-like model for Question Answering. We'll cover what metrics are used to quantify quality, how to evaluate a model using the Hugging Face framework, and the importance of the "null response" (questions that don't have answers) for both improved performance and more realistic QA output. By the end of this post, we'll have implemented a more robust answering method for our QA system. Note: Throughout this post we’ll be using a distilBERT model fine-tuned on SQuAD2.0 by a member of the NLP community; this model can be found here in the HF repository. Additionally, much of the code in this post is inspired by the HF squad_metrics.py script. Prerequisites a basic understanding of Transformers and PyTorch a basic understanding of Transformer outputs (logits) and softmax a Transformer fine-tuned on SQuAD2.0 the SQuAD2.0 dev set Answering questions is complicated Quantifying the success of question answering is a tricky task. When you or I ask a question, the correct answer could take multiple forms. For example, in our previous post, BERT answered the question, "Why is the sky blue?" with "Rayleigh scattering," but another answer would be: The Earth's atmosphere scatters short-wavelength light more efficiently than that of longer wavelengths. Because its wavelengths are shorter, blue light is more strongly scattered than the longer-wavelength lights, red or green. Hence the result that when looking at the sky away from the direct incident sunlight, the human eye perceives the sky to be blue. Both of these answers can be found in the Wikipedia article Diffuse Sky Radiation and both are correct. However, we've also had a model answer the same question with "because its wavelengths are shorter," which is close - but not really a correct answer; the sky itself doesn't have a wavelength. This answer is missing too much context to be useful. What if we'd asked a question that couldn't be answered by the Diffuse Sky Radiation page? For example: "Could the sky ever be green?" If you read that Wiki article you'll see there probably isn't a sure-fire answer to this question. What should the model do in this case? How should we judge a model’s success when there are multiple correct answers, even more incorrect answers, and potentially no answer available to it at all? To properly assess quality, we need a labeled set of questions and answers. Let's turn back to the SQuAD dataset. The SQuAD2.0 dev set The SQuAD dataset comes in two flavors: SQuAD1.1 and SQuAD2.0. The latter contains the same questions and answers as the former, but also includes additional questions that cannot be answered by the accompanying passage. This is intended to create a more realistic question answering task. The ability to identify unanswerable questions is much more challenging for Transformer models, which is why we focused on the SQuAD2.0 dataset rather than SQuAD1.1. SQuAD2.0 consists of over 150k questions, of which more than 35% are unanswerable in relation to their associated passage. For our last post, we fine-tuned on the train set (130k examples); now we'll focus on the dev set, which contains nearly 12k examples. Only about half of these examples are answerable questions. In the following section, we'll look at a couple of these examples to get a feel for them. (Use the hidden cells below to get set up, if needed.) # collapse-hide # use this cell to install packages if needed !pip install torch torchvision -f https://download.pytorch.org/whl/torch_stable.html !pip install transformers # collapse-hide import json import collections from pprint import pprint import numpy as np import torch from transformers import AutoTokenizer, AutoModelForQuestionAnswering # This is the directory in which we'll store all evaluation output model_dir = "models/distilbert/twmkn9_distilbert-base-uncased-squad2/" # collapse-hide # Download the SQuAD2.0 dev set !wget -P data/squad/ https://rajpurkar.github.io/SQuAD-explorer/dataset/dev-v2.0.json Load the dev set using HF data processors Hugging Face provides the Processors library for facilitating basic processing tasks with some canonical NLP datasets. The processors can be used for loading datasets and converting their examples to features for direct use in the model. We'll be using the SQuAD processors. from transformers.data.processors.squad import SquadV2Processor # this processor loads the SQuAD2.0 dev set examples processor = SquadV2Processor() examples = processor.get_dev_examples("./data/squad/", filename="dev-v2.0.json") print(len(examples)) 100%|██████████| 35/35 [00:05<00:00, 6.71it/s] 11873 While examples is a list, most other tasks we'll work with use a unique identifier - one for each question in the dev set. # generate some maps to help us identify examples of interest qid_to_example_index = {example.qas_id: i for i, example in enumerate(examples)} qid_to_has_answer = {example.qas_id: bool(example.answers) for example in examples} answer_qids = [qas_id for qas_id, has_answer in qid_to_has_answer.items() if has_answer] no_answer_qids = [qas_id for qas_id, has_answer in qid_to_has_answer.items() if not has_answer] def display_example(qid): from pprint import pprint idx = qid_to_example_index[qid] q = examples[idx].question_text c = examples[idx].context_text a = [answer['text'] for answer in examples[idx].answers] print(f'Example {idx} of {len(examples)}\n---------------------') print(f"Q: {q}\n") print("Context:") pprint(c) print(f"\nTrue Answers:\n{a}") A positive example Approximately 50% of the examples in the dev set are questions that have answers contained within their corresponding passage. In these cases, up to five possible correct answers are provided (questions and answers were generated and identified by crowd-sourced workers). Answers must be direct excerpts from the passage, but we can see there are several ways to arrive at a "correct" answer. display_example(answer_qids[1300]) Example 2548 of 11873 --------------------- Q: Where on Earth is free oxygen found? Context: ("Free oxygen also occurs in solution in the world's water bodies. The " 'increased solubility of O\n' '2 at lower temperatures (see Physical properties) has important implications ' 'for ocean life, as polar oceans support a much higher density of life due to ' 'their higher oxygen content. Water polluted with plant nutrients such as ' 'nitrates or phosphates may stimulate growth of algae by a process called ' 'eutrophication and the decay of these organisms and other biomaterials may ' 'reduce amounts of O\n' '2 in eutrophic water bodies. Scientists assess this aspect of water quality ' "by measuring the water's biochemical oxygen demand, or the amount of O\n" '2 needed to restore it to a normal concentration.') True Answers: ['water', "in solution in the world's water bodies", "the world's water bodies"] A negative example The other half of the questions in the dev set do not have an answer in the corresponding passage. These questions were generated by crowd-sourced workers to be related and relevant to the passage, but unanswerable by that passage. There are thus no True Answers associated with these questions, as we see in the example below. Note: In this case, the question is a trick -- the numbers are reoriented in a way that no longer holds true. Will the model pick up on that? display_example(no_answer_qids[1254]) Example 2564 of 11873 --------------------- Q: What happened 3.7-2 billion years ago? Context: ("Free oxygen gas was almost nonexistent in Earth's atmosphere before " 'photosynthetic archaea and bacteria evolved, probably about 3.5 billion ' 'years ago. Free oxygen first appeared in significant quantities during the ' 'Paleoproterozoic eon (between 3.0 and 2.3 billion years ago). For the first ' 'billion years, any free oxygen produced by these organisms combined with ' 'dissolved iron in the oceans to form banded iron formations. When such ' 'oxygen sinks became saturated, free oxygen began to outgas from the oceans ' '3–2.7 billion years ago, reaching 10% of its present level around 1.7 ' 'billion years ago.') True Answers: [] Metrics for QA There are two dominant metrics used by many question answering datasets, including SQuAD: exact match (EM) and F1 score. These scores are computed on individual question+answer pairs. When multiple correct answers are possible for a given question, the maximum score over all possible correct answers is computed. Overall EM and F1 scores are computed for a model by averaging over the individual example scores. Exact Match This metric is as simple as it sounds. For each question+answer pair, if the characters of the model's prediction exactly match the characters of (one of) the True Answer(s), EM = 1, otherwise EM = 0. This is a strict all-or-nothing metric; being off by a single character results in a score of 0. When assessing against a negative example, if the model predicts any text at all, it automatically receives a 0 for that example. F1 F1 score is a common metric for classification problems, and widely used in QA. It is appropriate when we care equally about precision and recall. In this case, it's computed over the individual words in the prediction against those in the True Answer. The number of shared words between the prediction and the truth is the basis of the F1 score: precision is the ratio of the number of shared words to the total number of words in the prediction, and recall is the ratio of the number of shared words to the total number of words in the ground truth. Let's see how these metrics work in practice. We'll load up a fine-tuned model (this one, to be precise) and its tokenizer, and compare our predictions against the True Answers. Load a Transformer model fine-tuned on SQuAD 2.0 tokenizer = AutoTokenizer.from_pretrained("twmkn9/distilbert-base-uncased-squad2") model = AutoModelForQuestionAnswering.from_pretrained("twmkn9/distilbert-base-uncased-squad2") The following get_prediction method is essentially identical to what we used last time in our simple QA system. def get_prediction(qid): # given a question id (qas_id or qid), load the example, get the model outputs and generate an answer question = examples[qid_to_example_index[qid]].question_text context = examples[qid_to_example_index[qid]].context_text inputs = tokenizer.encode_plus(question, context, return_tensors='pt') outputs = model(**inputs) answer_start = torch.argmax(outputs[0]) # get the most likely beginning of answer with the argmax of the score answer_end = torch.argmax(outputs[1]) + 1 answer = tokenizer.convert_tokens_to_string(tokenizer.convert_ids_to_tokens(inputs['input_ids'][0][answer_start:answer_end])) return answer Below are some functions we'll need to compute our quality metrics. # these functions are heavily influenced by the HF squad_metrics.py script def normalize_text(s): """Removing articles and punctuation, and standardizing whitespace are all typical text processing steps.""" import string, re def remove_articles(text): regex = re.compile(r"\b(a|an|the)\b", re.UNICODE) return re.sub(regex, " ", text) def white_space_fix(text): return " ".join(text.split()) def remove_punc(text): exclude = set(string.punctuation) return "".join(ch for ch in text if ch not in exclude) def lower(text): return text.lower() return white_space_fix(remove_articles(remove_punc(lower(s)))) def compute_exact_match(prediction, truth): return int(normalize_text(prediction) == normalize_text(truth)) def compute_f1(prediction, truth): pred_tokens = normalize_text(prediction).split() truth_tokens = normalize_text(truth).split() # if either the prediction or the truth is no-answer then f1 = 1 if they agree, 0 otherwise if len(pred_tokens) == 0 or len(truth_tokens) == 0: return int(pred_tokens == truth_tokens) common_tokens = set(pred_tokens) & set(truth_tokens) # if there are no common tokens then f1 = 0 if len(common_tokens) == 0: return 0 prec = len(common_tokens) / len(pred_tokens) rec = len(common_tokens) / len(truth_tokens) return 2 * (prec * rec) / (prec + rec) def get_gold_answers(example): """helper function that retrieves all possible true answers from a squad2.0 example""" gold_answers = [answer["text"] for answer in example.answers if answer["text"]] # if gold_answers doesn't exist it's because this is a negative example - # the only correct answer is an empty string if not gold_answers: gold_answers = [""] return gold_answers In the following cell, we start by computing EM and F1 for our first example - the one that has several True Answers associated with it. prediction = get_prediction(answer_qids[1300]) example = examples[qid_to_example_index[answer_qids[1300]]] gold_answers = get_gold_answers(example) em_score = max((compute_exact_match(prediction, answer)) for answer in gold_answers) f1_score = max((compute_f1(prediction, answer)) for answer in gold_answers) print(f"Question: {example.question_text}") print(f"Prediction: {prediction}") print(f"True Answers: {gold_answers}") print(f"EM: {em_score} \t F1: {f1_score}") Question: Where on Earth is free oxygen found? Prediction: water bodies True Answers: ['water', "in solution in the world's water bodies", "the world's water bodies"] EM: 0 F1: 0.8 We see that our prediction is actually quite close to some of the True Answers, resulting in a respectable F1 score. However, it does not exactly match any of them, so our EM score is 0. Let's try with our negative example now. prediction = get_prediction(no_answer_qids[1254]) example = examples[qid_to_example_index[no_answer_qids[1254]]] gold_answers = get_gold_answers(example) em_score = max((compute_exact_match(prediction, answer)) for answer in gold_answers) f1_score = max((compute_f1(prediction, answer)) for answer in gold_answers) print(f"Question: {example.question_text}") print(f"Prediction: {prediction}") print(f"True Answers: {gold_answers}") print(f"EM: {em_score} \t F1: {f1_score}") Question: What happened 3.7-2 billion years ago? Prediction: [CLS] what happened 3 . 7 - 2 billion years ago ? [SEP] free oxygen gas was almost nonexistent in earth ' s atmosphere before photosynthetic archaea and bacteria evolve'''
