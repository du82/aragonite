full_description = "Evaluating QA: the Retriever & the Full QA SystemA review of Information Retrieval and the role it plays in an IR QA system Jun 30, 2020 • 30 min read elasticsearch mean average precision recall for IRQA QA system design Prerequisites Retrieving the right document is important Elasticsearch as an IR Tool Using Elasticsearch with SQuAD2.0 Evaluating Retriever Performance Improving Search Results with a Custom Analyzer The Full IR QA System Connecting the retriever to the reader Evaluating the system Final Thoughts Post Script: The Code In our last post, Evaluating QA: Metrics, Predictions, and the Null Response, we took a deep dive into how to assess the quality of a BERT-like Reader for Question Answering (QA) using the Hugging Face framework. In this post, we'll focus on the other component of a modern Information Retrieval-based (IR) QA system: the Retriever. Specifically, we'll introduce Elasticsearch as a powerful and efficient IR tool that can be used to scour through large corpora and retrieve relevant documents. We'll explain how to implement and evaluate a Retriever in the context of Question Answering and demonstrate its impact on an IR QA system. Prerequisites a basic understanding of Information Retrieval & Search a basic understanding of IR based QA systems (see our previous posts) a basic understanding of Transformers and PyTorch a basic understanding of the SQuAD2.0 dataset Retrieving the right document is important As we've discussed throughout this series, many modern QA systems take a two-staged approach to answering questions. In the first stage, a document retriever selects N potentially relevant documents from a given corpus. Subsequently, a machine comprehension model processes each of the N documents to determine an answer to the input question. Because of recent advances in NLP and deep learning (i.e., flashy Transformers), the machine comprehension component has typically been the main focus of evaluation and performance enhancement. Retrievers have received limited attention in the context of QA, despite their obvious importance: stage two of an IR QA system is bounded by the performance of stage one. Let's get more specific. We recently explained methods that - given a question and context passage - enable BERT-like models to produce robust answers by selectively processing predictions and by refraining from answering certain questions at all. While the ability to properly comprehend a passage and produce a correct answer is a critical feature of any QA tool, the success of the overall system is highly dependent on first providing a correct passage to read through. Without being fed a context passage that actually contains the ground-truth answer, the overall system's performance is limited to how well it can predict no-answer questions. To demonstrate, we'll revisit an example from our second blog post, in which we asked three questions of a Wikipedia search engine-based QA system: **Example 1: Incorrect** Question: When was Barack Obama born? Top wiki result: <WikipediaPage 'Barack Obama Sr.'> Answer: 18 June 1936 / February 2 , 1961 / **Example 2: Correct** Question: Why is the sky blue? Top wiki result: <WikipediaPage 'Diffuse sky radiation'> Answer: Rayleigh scattering / **Example 3: Correct** Question: How many sides does a pentagon have? Top wiki result: <WikipediaPage 'The Pentagon'> Answer: five / In Example 1, the Reader had no chance of producing the correct answer because of its outright absence from the context served up by the Retriever. Namely, the Retriever erroneously provided a page about Barack Obama Sr. instead of his son, the former US President. In this case, the only way the Reader could have possibly produced the correct answer was if the correct answer was actually not to answer at all. On the flip side, in Example 3, the Retriever did not identify the globally \"correct\" document - it returned an article about \"The Pentagon\" instead of a page about geometry - but nonetheless, it provided enough context for the Reader to succeed. These quick examples illustrate why an effective Retriever is crucial for an end-to-end QA system. Now let's take a deeper look at a classic tool used for information retrieval - Elasticsearch. Elasticsearch as an IR Tool Modern QA systems employ a variety of techniques for the task of information retrieval, ranging from traditional sparse vector word matching (e.g., Elasticsearch) to novel approaches using dense representations of encoded passages combined with efficient search capabilities. Despite the flurry of contemporary research efforts in this area, the traditional sparse vector approach performs very well overall, and has only recently been overtaken by embedding-based systems for QA retrieval tasks. For that reason, we'll explore Elasticsearch as an easy-to-use framework for document retrieval. So, what exactly is Elasticsearch? Elasticsearch is a powerful open-source search and analytics engine built on the Apache Lucene library that is capable of handling all types of data - including textual, numerical, geospatial, structured, and unstructured data. It is built to scale with a robust set of features, rich ecosystem, and diverse list of client libraries, making it easy to integrate and use. In the context of information retrieval for automated question answering, we are keenly interested in the features surrounding full-text search. Elasticsearch provides a convenient way to index documents so they can quickly be queried for nearest neighbor search using a similarity metric based on TF-IDF. Specifically, it uses BM25 term weighting to represent question and context passages as high-dimensional, sparse vectors that are efficiently searched in an inverted index. For more information on how an inverted index works under the hood, we recommend this quick and concise blog post. Using Elasticsearch with SQuAD2.0 With this basic understanding of how Elasticsearch works, let's dive in and build our own Document Retrieval system by indexing a set of Wikipedia article paragraphs that support questions and answers from the SQuAD2.0 dataset. Before we get started, we'll need to download and prepare data from SQuAD2.0. Download and Prepare SQUAD2.0 # collapse-hide # Download the SQuAD2.0 train & dev sets !wget -P data/squad/ https://rajpurkar.github.io/SQuAD-explorer/dataset/train-v2.0.json !wget -P data/squad/ https://rajpurkar.github.io/SQuAD-explorer/dataset/dev-v2.0.json import json A common practice in IR for QA is to segment large articles into smaller passages before indexing, for two main reasons: Transformer-based Readers are slow; providing an entire Wikipedia article to BERT for processing can take 5 - 30 seconds, even with a decent GPU! Smaller passages reduce noise; by identifying a more concise context passage for BERT to read through, we reduce the chance of BERT getting lost. Of course, the chunking method proposed here doesn't come without a cost. Larger documents contain more information on which to retrieve. By reducing passage size, we are potentially trading off system recall for speed - although, as we will discuss later in this post, there are techniques to alleviate this. With our chunking approach, each article paragraph will be prepended with the article title, and collectively serve as the corpus of documents over which our Elasticsearch Retriever will search. In practice, open-domain QA systems sit atop massive collections of documents (think: all of Wikipedia) to provide a breadth of information from which to answer general-knowledge questions. For the purposes of demonstrating Elasticsearch functionality, we will limit our corpus to only the Wikipedia articles supporting SQuAD2.0 questions. The following parse_qa_records function will extract question/answer examples, as well as paragraph content from the SQuAD2.0 data set. # collapse-hide def parse_qa_records(data): ''' Loop through SQuAD2.0 dataset and parse out question/answer examples and unique article paragraphs Returns: qa_records (list) - Question/answer examples as list of dictionaries wiki_articles (list) - Unique Wikipedia titles and article paragraphs recreated from SQuAD data ''' num_with_ans = 0 num_without_ans = 0 qa_records = [] wiki_articles = {} for article in data: for i, paragraph in enumerate(article['paragraphs']): wiki_articles[article['title']+f'_{i}'] = article['title'] + ' ' + paragraph['context'] for questions in paragraph['qas']: qa_record = {} qa_record['example_id'] = questions['id'] qa_record['document_title'] = article['title'] qa_record['question_text'] = questions['question'] try: qa_record['short_answer'] = questions['answers'][0]['text'] num_with_ans += 1 except: qa_record['short_answer'] = \"\" num_without_ans += 1 qa_records.append(qa_record) wiki_articles = [{'document_title':title, 'document_text': text}\\ for title, text in wiki_articles.items()] print(f'Data contains {num_with_ans} question/answer pairs with a short answer, and {num_without_ans} without.'+ f'\\nThere are {len(wiki_articles)} unique wikipedia article paragraphs.') return qa_records, wiki_articles # load and parse data train_file = \"data/squad/train-v2.0.json\" dev_file = \"data/squad/dev-v2.0.json\" train = json.load(open(train_file, 'rb')) dev = json.load(open(dev_file, 'rb')) qa_records, wiki_articles = parse_qa_records(train['data']) qa_records_dev, wiki_articles_dev = parse_qa_records(dev['data']) Data contains 86821 question/answer pairs with a short answer, and 43498 without. There are 19035 unique wikipedia article paragraphs. Data contains 5928 question/answer pairs with a short answer, and 5945 without. There are 1204 unique wikipedia article paragraphs. # parsed record example qa_records[10] {'example_id': '56d43c5f2ccc5a1400d830ab', 'document_title': 'Beyoncé', 'question_text': 'What was the first album Beyoncé released as a solo artist?', 'short_answer': 'Dangerously in Love'} # parsed wiki paragraph example print(wiki_articles[10]) {'document_title': 'Beyoncé_10', 'document_text': 'Beyoncé Beyoncé\\'s first solo recording was a feature on Jay Z\\'s \"\\'03 Bonnie & Clyde\" that was released in October 2002, peaking at number four on the U.S. Billboard Hot 100 chart. Her first solo album Dangerously in Love was released on June 24, 2003, after Michelle Williams and Kelly Rowland had released their solo efforts. The album sold 317,000 copies in its first week, debuted atop the Billboard 200, and has since sold 11 million copies worldwide. The album\\'s lead single, \"Crazy in Love\", featuring Jay Z, became Beyoncé\\'s first number-one single as a solo artist in the US. The single \"Baby Boy\" also reached number one, and singles, \"Me, Myself and I\" and \"Naughty Girl\", both reached the top-five. The album earned Beyoncé a then record-tying five awards at the 46th Annual Grammy Awards; Best Contemporary R&B Album, Best Female R&B Vocal Performance for \"Dangerously in Love 2\", Best R&B Song and Best Rap/Sung Collaboration for \"Crazy in Love\", and Best R&B Performance by a Duo or Group with Vocals for \"The Closer I Get to You\" with Luther Vandross.'} Download Elasticsearch With our data ready to go, let's download, install, and configure Elasticsearch. We recommend opening this post as a Colab notebook and executing the following code snippet to set up Elasticsearch. Alternatively, you can install and launch Elasticsearch on your local machine by following the instructions here. # collapse-hide # if using Colab - start Elasticsearch from source ! wget https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-7.6.2-linux-x86_64.tar.gz -q ! tar -xzf elasticsearch-7.6.2-linux-x86_64.tar.gz ! chown -R daemon:daemon elasticsearch-7.6.2 import os from subprocess import Popen, PIPE, STDOUT es_server = Popen(['elasticsearch-7.6.2/bin/elasticsearch'], stdout=PIPE, stderr=STDOUT, preexec_fn=lambda: os.setuid(1) # as daemon ) # wait until ES has started ! sleep 30 Load Data into Elasticsearch We'll use the official low-level Python client library for interacting with Elasticsearch. # collapse-hide !pip install elasticsearch !pip install tqdm By default, Elasticsearch is launched locally on port 9200. We first need to instantiate an Elasticsearch client object and connect to the service. from elasticsearch import Elasticsearch config = {'host':'localhost', 'port':9200} es = Elasticsearch([config]) # test connection es.ping() True Before we go further, let's introduce a few concepts that are specific to Elasticsearch and the process of indexing data. An index is a collection of documents that have common characteristics (similar to a database schema in an RDBMS). Documents are JSON objects having their own set of key-value pairs consisting of various data types (similar to rows/fields in RDBMS). When we add a document into an index, the document's text fields undergo analysis prior to being indexed. This means that when executing a search query against an index, we are actually searching against the post-processed representation that is stored in the inverted index, not the raw input document itself. Image Credit The analysis process is a customizable pipeline carried out by an Analyzer. Elasticsearch analyzer pipelines are composed of three sequential steps: character filters, a tokenizer, and token filters. Each of these components modifies the input stream of text according to some configurable settings. Character filters have the ability to add, remove, or replace characters. A common application is to strip html markup from the raw input. The character-filtered text is passed to a tokenizer which breaks up the input string into individual tokens. The default (standard) tokenizer splits tokens on whitespace, and most symbols (like commas, periods, semicolons, etc.) The token stream is passed to a token filter which adds, removes, or modifies tokens. Typical token filters include converting all text to lowercase, and removing stop words. Elasticsearch comes with several built-in Analyzers that satisfy common use cases and defaults to the Standard Analyzer. The Standard Analyzer doesn't contain any character filters, uses a standard tokenizer, and applies a lowercase token filter. Let's take a look at an example sentence as it's passed through this pipeline: \"I'm in the mood for drinking semi-dry red wine!\" Image Credit Crafting analyzers to your use case requires domain knowledge of the problem and dataset at hand, and doing so properly is key to optimizing relevance scoring for your search application. We found this blog series very useful in explaining the importance of analysis in Elasticsearch. Create an Index Let's create a new index and add our Wikipedia articles to it. To do so, we provide a name and optionally some index configurations. Here we are specifying a set of mappings that indicate our anticipated index schema, data types, and how the text fields should be processed. If no body is passed, Elasticsearch will automatically infer fields and data ty"
