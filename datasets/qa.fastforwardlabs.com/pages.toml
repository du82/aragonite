full_description = '''Building a QA System with BERT on WikipediaA high-level code walk-through of an IR-based QA system with PyTorch and Hugging Face. May 19, 2020 • 23 min read PyTorch Hugging Face Wikipedia BERT Transformers So you've decided to build a QA system Setting up your virtual environment Hugging Face Transformers Fine-tuning a Transformer model for Question Answering 1. Pick a Model 2. QA dataset: SQuAD 3. Fine-tuning script Time to train! Training on the command line Training in Colab Training Output Using a pre-fine-tuned model from the Hugging Face repository Let's try our model! QA on Wikipedia pages Putting it all together Wrapping Up So you've decided to build a QA system You want to start with something simple and general, so you plan to make it open domain, using Wikipedia as a corpus for answering questions. You want to use the best NLP that your compute resources allow (you're lucky enough to have access to a GPU), so you're going to focus on the big, flashy Transformer models that are all the rage these days. Sounds like you're building an IR-based QA system. In our previous post (Intro to Automated Question Answering), we covered the general design of these systems, which typically require two main components: the document retriever (a search engine) that selects the n most relevant documents from a large collection, and a document reader that processes these candidate documents in search of an explicit answer span. Now we're going to build it! This post is chock full of code that walks through our approach. We'll also highlight and clarify some powerful resources (including off-the-shelf models and libraries) that you can use to quickly get going on a QA system of your own. We'll cover all the necessary steps including: installing libraries and setting up an environment, training a Transformer style model on the SQuAD dataset, understanding Hugging Face's run_squad.py training script and output, and passing a full Wikipedia article as context for a question. By the end of this post we'll have a working IR-based QA system, with BERT as the document reader and Wikipedia's search engine as the document retriever - a fun toy model that hints at potential real-world use cases. This article was originally developed in a Jupyter Notebook and, thanks to fastpages, converted to a blog post. For an interactive environment, click the "Open in Colab" button above (though we note that, due to Colab's system constraints, some of the cells in this notebook might not be fully executable. We'll highlight when this is the case, but don't worry -- you'll still be able to play around with all the fun stuff.) Let's get started! Setting up your virtual environment A virtual environment is always best practice and we're using venv on our workhorse machine. For this project, we'll be using PyTorch, which handles the heavy lifting of deep differentiable learning. If you have a GPU you'll want a PyTorch build that includes CUDA support, though most cells in this notebook will work fine without one. Check out PyTorch's quick install guide to determine the best build for your GPU and OS. We'll also be using the Transformers library, which provides easy-to-use implementations of all the popular Transformer architectures, like BERT. Finally, we'll need the wikipedia library for easy access and parsing of Wikipedia pages. You can recreate our env (with CUDA 9.2 support -- but use the appropriate version for your machine) with the following commands in your command line: $ python3 -m venv myenv $ source myenv/bin/activate $ pip install torch==1.5.0+cu92 torchvision==0.6.0+cu92 -f https://download.pytorch.org/whl/torch_stable.html $ pip install transformers==2.5.1 $ pip install wikipedia==1.4.0 Note: Our GPU machine sports an older version of CUDA (9.2 -- we're getting around to updating that), so we need to use an older version of PyTorch for the necessary CUDA support. The training script we'll be using requires some specific packages. More recent versions of PyTorch include these packages; however, older versions do not. If you have to work with an older version of PyTorch, you might need to install TensorboardX (see the hidden code cell below). # collapse-hide # line 69 of `run_squad.py` script shows why you might need to install # tensorboardX if you have an older version of torch try: from torch.utils.tensorboard import SummaryWriter except ImportError: from tensorboardX import SummaryWriter Conversely, if you're working in Colab, you can run the cell below. !pip install torch torchvision -f https://download.pytorch.org/whl/torch_stable.html !pip install transformers==2.5.1 !pip install wikipedia==1.4.0 Hugging Face Transformers The Hugging Face Transformers package provides state-of-the-art general-purpose architectures for natural language understanding and natural language generation. They host dozens of pre-trained models operating in over 100 languages that you can use right out of the box. All of these models come with deep interoperability between PyTorch and Tensorflow 2.0, which means you can move a model from TF2.0 to PyTorch and back again with just a line or two of code! If you're new to Hugging Face, we strongly recommend working through the HF Quickstart guide as well as their excellent Transformer Notebooks (we did!), as we won't cover that material in this notebook. We'll be using AutoClasses, which serve as a wrapper around pretty much any of the base Transformer classes. Fine-tuning a Transformer model for Question Answering To train a Transformer for QA with Hugging Face, we'll need to pick a specific model architecture, a QA dataset, and the training script. With these three things in hand we'll then walk through the fine-tuning process. 1. Pick a Model Not every Transformer architecture lends itself naturally to the task of question answering. For example, GPT does not do QA; similarly BERT does not do machine translation. HF identifies the following model types for the QA task: BERT distilBERT ALBERT RoBERTa XLNet XLM FlauBERT We'll stick with the now-classic BERT model in this notebook, but feel free to try out some others (we will - and we'll let you know when we do). Next up: a training set. 2. QA dataset: SQuAD One of the most canonical datasets for QA is the Stanford Question Answering Dataset, or SQuAD, which comes in two flavors: SQuAD 1.1 and SQuAD 2.0. These reading comprehension datasets consist of questions posed on a set of Wikipedia articles, where the answer to every question is a segment (or span) of the corresponding passage. In SQuAD 1.1, all questions have an answer in the corresponding passage. SQuAD 2.0 steps up the difficulty by including questions that cannot be answered by the provided passage. The following code will download the specified version of SQuAD. # set path with magic %env DATA_DIR=./data/squad # download the data def download_squad(version=1): if version == 1: !wget -P $DATA_DIR https://rajpurkar.github.io/SQuAD-explorer/dataset/train-v1.1.json !wget -P $DATA_DIR https://rajpurkar.github.io/SQuAD-explorer/dataset/dev-v1.1.json else: !wget -P $DATA_DIR https://rajpurkar.github.io/SQuAD-explorer/dataset/train-v2.0.json !wget -P $DATA_DIR https://rajpurkar.github.io/SQuAD-explorer/dataset/dev-v2.0.json download_squad(version=2) env: DATA_DIR=./data/squad --2020-05-11 21:36:52-- https://rajpurkar.github.io/SQuAD-explorer/dataset/train-v2.0.json Resolving rajpurkar.github.io (rajpurkar.github.io)... 185.199.109.153, 185.199.108.153, 185.199.111.153, ... Connecting to rajpurkar.github.io (rajpurkar.github.io)|185.199.109.153|:443... connected. HTTP request sent, awaiting response... 200 OK Length: 42123633 (40M) [application/json] Saving to: ‘./data/squad/train-v2.0.json’ train-v2.0.json 100%[===================>] 40.17M 14.6MB/s in 2.8s 2020-05-11 21:36:55 (14.6 MB/s) - ‘./data/squad/train-v2.0.json’ saved [42123633/42123633] --2020-05-11 21:36:56-- https://rajpurkar.github.io/SQuAD-explorer/dataset/dev-v2.0.json Resolving rajpurkar.github.io (rajpurkar.github.io)... 185.199.110.153, 185.199.111.153, 185.199.108.153, ... Connecting to rajpurkar.github.io (rajpurkar.github.io)|185.199.110.153|:443... connected. HTTP request sent, awaiting response... 200 OK Length: 4370528 (4.2M) [application/json] Saving to: ‘./data/squad/dev-v2.0.json’ dev-v2.0.json 100%[===================>] 4.17M 6.68MB/s in 0.6s 2020-05-11 21:36:56 (6.68 MB/s) - ‘./data/squad/dev-v2.0.json’ saved [4370528/4370528] 3. Fine-tuning script We've chosen a model and we've got some data. Time to train! All the standard models that HF supports have been pre-trained, which means they've all been fed massive unsupervised training sets in order to learn basic language modeling. In order to perform well at specific tasks (like question answering), they must be trained further -- fine-tuned -- on specific datasets and tasks. HF helpfully provides a script that fine-tunes a Transformer model on one of the SQuAD datasets, called run_squad.py. You can grab the script here or run the cell below. # download the run_squad.py training script !curl -L -O https://github.com/huggingface/transformers/blob/b90745c5901809faef3136ed09a689e7d733526c/examples/run_squad.py This script takes care of all the hard work that goes into fine-tuning a model and, as such, it's pretty complicated. It hosts no fewer than 45 arguments, providing an impressive amount of flexibility and utility for those who do a lot of training. We'll leave the details of this script for another day, and focus instead on the basic command to fine-tune BERT on SQuAD 1.1 or 2.0. Below are the most important arguments for the run_squad.py fine-tuning script. # fine-tuning your own model for QA using HF's `run_squad.py` # turn flags on and off according to the model you're training cmd = [ 'python', # '-m torch.distributed.launch --nproc_per_node 2', # use this to perform distributed training over multiple GPUs 'run_squad.py', '--model_type', 'bert', # model type (one of the list under "Pick a Model" above) '--model_name_or_path', 'bert-base-uncased', # specific model name of the given model type (shown, a list is here: https://huggingface.co/transformers/pretrained_models.html) # on first execution this initiates a download of pre-trained model weights; # can also be a local path to a directory with model weights '--output_dir', './models/bert/bbu_squad2', # directory for model checkpoints and predictions # '--overwrite_output_dir', # use when adding output to a directory that is non-empty -- # for instance, when training crashes midway through and you need to restart it '--do_train', # execute the training method '--train_file', '$DATA_DIR/train-v2.0.json', # provide the training data '--version_2_with_negative', # ** MUST use this flag if training on SQuAD 2.0! DO NOT use if training on SQuAD 1.1 '--do_lower_case', # ** set this flag if using an uncased model; don't use for Cased Models '--do_eval', # execute the evaluation method on the dev set -- note: # if coupled with --do_train, evaluation runs after fine-tuning '--predict_file', '$DATA_DIR/dev-v2.0.json', # provide evaluation data (dev set) '--eval_all_checkpoints', # evaluate the model on the dev set at each checkpoint '--per_gpu_eval_batch_size', '12', # evaluation batch size for each gpu '--per_gpu_train_batch_size', '12', # training batch size for each gpu '--save_steps', '5000', # how often checkpoints (complete model snapshot) are saved '--threads', '8', # num of CPU threads to use for converting SQuAD examples to model features # --- Model and Feature Hyperparameters --- '--num_train_epochs', '3', # number of training epochs - usually 2-3 for SQuAD '--learning_rate', '3e-5', # learning rate for the default optimizer (Adam in this case) '--max_seq_length', '384', # maximum length allowed for the full input sequence '--doc_stride', '128' # used for long documents that must be chunked into multiple features -- # this "sliding window" controls the amount of stride between chunks ] Here's what to expect when executing run_squad.py for the first time: Pre-trained model weights for the specified model type (i.e., bert-base-uncased) are downloaded. SQuAD training examples are converted into features (takes 15-30 minutes depending on dataset size and number of threads). Training features are saved to a cache file (so that you don't have to do this again for this model type). If --do_train, training commences for as many epochs as you specify, saving the model weights every --save_steps steps until training finishes. These checkpoints are saved in [--output_dir]/checkpoint-[step number] subdirectories. The final model weights and peripheral files are saved to --output_dir. If --do_eval, SQuAD dev examples are converted into features. Dev features are also saved to a cache file. Evaluation commences and outputs a dizzying assortment of performance scores. Time to train! But first, a note on compute requirements. We don't recommend fine-tuning a Transformer model unless you're rocking at least one GPU and a considerable amount of RAM. For context, our GPU is several years old (GeForce GTX TITAN X), and while it's not nearly as fast as the Tesla V100 (the current Cadillac of GPUs), it gets the job done. Fine-tuning bert-base-uncased takes about 1.75 hours per epoch. Additionally, our workhorse machine has 32GB CPU and 12GB GPU memory, which is sufficient for data processing and training most models on either of the SQuAD datasets. The following cells demonstrate two ways to fine-tune: on the command line and in a Colab notebook. Training on the command line We saved the following as a shell script (run_squad.sh) and ran on the command line ($ source run_squad.sh) of our workhorse GPU machine. Shell scripts help prevent numerous mistakes and mis-keys when typing args to a command line, especially for complex scripts like this. They also allow you to keep track of which arguments were used last (though, as we'll see below, the run_squad.py script has a solution for that). We actually kept two shell scripts -- one explicitly for training and another for evaluation. #!/bin/sh export DATA_DIR=./data/squad export MODEL_DIR=./models python run_squad.py \ --model_type bert \ --model_name_or_path bert-base-uncased \ --output_dir models/bert/ \ --data_dir data/squad \ --overwrite_output_dir \ --overwrite_cache \ --do_train \ --train_file train-v2.0.json \ --version_2_with_negative \ --do_lower_case \ --do_eval \ --predict_file dev-v2.0.json \ --per_gpu_train_batch_size 2 \ --learning_rate 3e-5 \ --num_train_epochs 2.0 \ --max_seq_length 384 \ --doc_stride 128 \ --threads 10 \ --save_steps 5000 Training in Colab Alternatively, you can execute training in the cell as shown below. We note that standard Colab environments only provide 12GB of RAM. Converting the SQuAD dataset to features is memory intensive and may cause the basic Colab environment to fail silently. If you have a Colab instance with additional memory capacity (16GB+'''
