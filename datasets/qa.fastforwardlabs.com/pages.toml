["https://qa.fastforwardlabs.com/elasticsearch/qa%20system%20design/passage%20ranking/masked%20language%20model/word%20embeddings/2020/07/22/Improving_the_Retriever_on_Natural_Questions.html"]
title = "How to Maximize Retriever Performance on a More Natural Dataset | NLP for Question Answering"
description = "Practical considerations for improving information retrieval in an IR QA system"
full_description = "How to Maximize Retriever Performance on a More Natural DatasetPractical considerations for improving information retrieval in an IR QA system Jul 22, 2020 • 22 min read elasticsearch QA system design passage ranking masked language model word embeddings Prerequisites Shortcomings of SQuAD2.0 A More Realistic Alternative: Natural Questions Query Expansion Techniques Entity Enrichment Synonym Expansion Static Embedding Similarity Contextual Query Expansion Does Query Expansion Improve Retrieval on Natural Questions? Passage Ranking Does Passage Ranking Improve Retrieval on Natural Questions? Final Thoughts If you’ve been following along on our question answering journey thus far, you now understand the basic building blocks that form the pipeline of a modern Information Retrieval-based (IR) Question Answering system, and how that system can be evaluated on the SQuAD2.0 dataset. But, as it turns out, implementing question answering for real-world use cases is a bit more nuanced than evaluating system performance against a toy dataset. In this post, we’ll explore several challenges faced by the Retriever when applying IR-QA to a more realistic dataset, as well as a few practical approaches for overcoming them. Prerequisites a basic understanding of IR-QA systems (see our previous posts) a basic understanding of modern NLP techniques Shortcomings of SQuAD2.0 While SQuAD has been a popular benchmark for the task of machine comprehension, there are several perceived flaws in how the dataset was constructed that render it an unfair comparison to how humans naturally seek answers to questions. Specifically, SQuAD was created through artificial crowdsourcing where annotators were presented with a Wikipedia paragraph and asked to write questions that can be answered from it. By first reading a body of text and then generating questions, the annotators had already leaked information into the questions they crafted. The methodology used here is not ideal, because a.) many questions lack context in absence of the provided paragraph and b.) there is a high lexical overlap between passages and questions - which artificially inflates the efficacy of exact match search tools (like Elasticsearch). Consider the following example: Question: Other than the Automobile Club of Southern California, what other AAA Auto Club chose to simplify the divide? Answer: California State Automobile Association This is a fundamentally different scenario from that in the real world; human curiosity often leads us to blindly seek answers from an unknown domain. The SQuAD dataset consists of questions constructed from a known domain; essentially the process is (albeit imperfectly) rigged. A More Realistic Alternative: Natural Questions In response to the criticism of SQuAD’s shortcomings, and to spur the progress of open-domain QA systems, Google released the Natural Questions (NQ) dataset in 2019. NQ consists of real, anonymized questions issued to the Google search engine, and provides an entire Wikipedia article as context that may or may not contain the answer to a given question. The inclusion of open-ended, human-written questions and the need to reason over full pages of content make building a QA system over the NQ dataset a much more realistic and challenging task than datasets before it. Here are a few example questions from NQ: where does the energy in a nuclear explosion come from? how many episodes in season 2 breaking bad? meaning of cats in the cradle song? Notice how some of the NQ questions are underspecified, raw, and syntactically erroneous. Do these seem oddly familiar to how you interact with search engines every day? Let’s explore a couple of techniques that might help overcome the challenges presented by this dataset and improve the Elasticsearch Retriever we built for our previous blog post. Query Expansion Techniques Entity Enrichment As we learned previously, the inverted index data structure underlying Elasticsearch doesn’t preserve word order in a query by default. Consider the following question: Question: \"Who is the bad guy in The Hunger Games?\" In this example, we as humans can intuit that the combination of words “The Hunger Games” has a very specific meaning in contrast to the three tokens (\"the\", \"hunger\", \"games\") independently. We want to enable Elasticsearch to identify content specific to \"The Hunger Games” trilogy, and not become entangled with general content about hunger and games. To accomplish this, we can apply named entity recognition (NER) - an information extraction technique that automatically identifies named entities (e.g., people, places, organizations, locations, etc.) in free text. Implementing entity enrichment requires extended use of Elasticsearch’s rich query language and a pre-trained NER model (we chose one readily available through the spaCy NLP library). The process is as follows: Apply NER to process a question and extract out any named entities. Create a phrase subquery for each entity to preserve the order of tokens for that phrase in match criteria. Create a standard match subquery for the original question itself. Combine all subqueries into a boolean compound query that scores candidate documents according to overlap criteria from both question and phrase queries. To simplify query expansion testing, we built a QueryExpander class (hidden below) that automates several query expansion methods. Let's take a look how our query is transformed through entity enrichment: # collapse-hide # install dependencies !pip install elasticsearch_dsl !pip install transformers==2.11.0 # import packages import re import os import json import time import spacy from elasticsearch_dsl import Q, Search import gensim.downloader as api from transformers import pipeline, AutoTokenizer import warnings warnings.simplefilter(action='ignore', category=FutureWarning) # initialize models nlp = spacy.load(\"en_core_web_sm\") word_vectors = api.load(\"glove-wiki-gigaword-50\") unmasker = pipeline('fill-mask', model=\"bert-base-uncased\", tokenizer=\"bert-base-uncased\") tokenizer = AutoTokenizer.from_pretrained(\"bert-base-uncased\", use_fast=True) class QueryExpander: ''' Query expansion utility that augments ElasticSearch queries with optional techniques including Named Entity Recognition and Synonym Expansion Args: question_text entity_args (dict) - Ex. {'spacy_model': nlp} synonym_args (dict) - Ex. {'gensim_model': word_vectors, 'n_syns': 3} OR {'MLM': unmasker, 'tokenizer': base_tokenizer, 'n_syns': 3, 'threshold':0.3} ''' def __init__(self, question_text, entity_args=None, synonym_args=None): self.question_text = question_text self.entity_args = entity_args self.synonym_args = synonym_args if self.synonym_args and not self.entity_args: raise Exception('Cannot do synonym expansion without NER! Expanding synonyms\\ on named entities reduces recall.') if self.synonym_args or self.entity_args: self.nlp = self.entity_args['spacy_model'] self.doc = self.nlp(self.question_text) self.build_query() def build_query(self): # build entity subquery if self.entity_args: self.extract_entities() # identify terms to expand if self.synonym_args: self.identify_terms_to_expand() # build question subquery self.construct_question_query() # combine subqueries sub_queries = [] sub_queries.append(self.question_sub_query) if hasattr(self, 'entity_sub_queries'): sub_queries.extend(self.entity_sub_queries) query = Q('bool', should=[*sub_queries]) self.query = query def extract_entities(self): ''' Extracts named entities using spaCy and constructs phrase match subqueries for each entity. Saves both entities and subqueries as attributes. ''' entity_list = [entity.text.lower() for entity in self.doc.ents] entity_sub_queries = [] for ent in entity_list: eq = Q('multi_match', query=ent, type='phrase', fields=['title', 'text']) entity_sub_queries.append(eq) self.entities = entity_list self.entity_sub_queries = entity_sub_queries def identify_terms_to_expand(self): ''' Identify terms in the question that are eligible for expansion per a set of defined rules ''' if hasattr(self, 'entities'): # get unique list of entity tokens entity_terms = [ent.split(' ') for ent in self.entities] entity_terms = [ent for sublist in entity_terms for ent in sublist] else: entity_terms = [] # terms to expand are not part of entity, a stopword, numeric, etc. entity_pos = [\"NOUN\",\"VERB\",\"ADJ\",\"ADV\"] terms_to_expand = [idx_term for idx_term in enumerate(self.doc) if \\ (idx_term[1].lower_ not in entity_terms) and (not idx_term[1].is_stop)\\ and (not idx_term[1].is_digit) and (not idx_term[1].is_punct) and (not len(idx_term[1].lower_)==1 and idx_term[1].is_alpha) and (idx_term[1].pos_ in entity_pos)] self.terms_to_expand = terms_to_expand def construct_question_query(self): ''' Builds a multi-match query from the raw question text extended with synonyms for any eligible terms ''' if hasattr(self, 'terms_to_expand'): syns = [] for i, term in self.terms_to_expand: if 'gensim_model' in self.synonym_args.keys(): syns.extend(self.gather_synonyms_static(term)) elif 'MLM' in self.synonym_args.keys(): syns.extend(self.gather_synonyms_contextual(i, term)) syns = list(set(syns)) syns = [syn for syn in syns if (syn.isalpha() and self.nlp(syn)[0].pos_ != 'PROPN')] question = self.question_text + ' ' + ' '.join(syns) self.expanded_question = question self.all_syns = syns else: question = self.question_text qq = Q('multi_match', query=question, type='most_fields', fields=['title', 'text']) self.question_sub_query = qq def gather_synonyms_contextual(self, token_index, token): ''' Takes in a token, and returns specified number of synonyms as defined by predictions from a masked language model ''' tokens = [token.text for token in self.doc] tokens[token_index] = self.synonym_args['tokenizer'].mask_token terms = self.predict_mask(text = ' '.join(tokens), unmasker = self.synonym_args['MLM'], tokenizer = self.synonym_args['tokenizer'], threshold = self.synonym_args['threshold'], top_n = self.synonym_args['n_syns']) return terms @staticmethod def predict_mask(text, unmasker, tokenizer, threshold=0, top_n=2): ''' Given a sentence with a [MASK] token in it, this function will return the most contextually similar terms to fill in the [MASK] ''' preds = unmasker(text) tokens = [tokenizer.convert_ids_to_tokens(pred['token']) for pred in preds if pred['score'] > threshold] return tokens[:top_n] def gather_synonyms_static(self, token): ''' Takes in a token and returns a specified number of synonyms defined by cosine similarity of word vectors. Uses stemming to ensure none of the returned synonyms share the same stem (ex. photo and photos can't happen) ''' try: syns = self.synonym_args['gensim_model'].similar_by_word(token.lower_) lemmas = [] final_terms = [] for item in syns: term = item[0] lemma = self.nlp(term)[0].lemma_ if lemma in lemmas: continue else: lemmas.append(lemma) final_terms.append(term) if len(final_terms) == self.synonym_args['n_syns']: break except: final_terms = [] return final_terms def explain_expansion(self, entities=True): ''' Print out an explanation for the query expansion methodology ''' print('Question:', self.question_text, '\\n') if entities: print('Found Entities:', self.entities, '\\n') if hasattr(self, 'terms_to_expand'): print('Synonym Expansions:') for i, term in self.terms_to_expand: if 'gensim_model' in self.synonym_args.keys(): print(term, '-->', self.gather_synonyms_static(term)) elif 'MLM' in self.synonym_args.keys(): print(term, '-->', self.gather_synonyms_contextual(i,term)) else: print('Question text has no terms to expand.') print() print('Expanded Question:', self.expanded_question, '\\n') print('Elasticsearch Query:\\n', self.query) question = \"Who is the bad guy in The Hunger Games?\" entity_args = {'spacy_model': nlp} qe_ner = QueryExpander(question, entity_args) qe_ner.explain_expansion(entities=True) Question: Who is the bad guy in The Hunger Games? Found Entities: ['the hunger games'] Elasticsearch Query: Bool(should=[MultiMatch(fields=['title', 'text'], query='Who is the bad guy in The Hunger Games?', type='most_fields'), MultiMatch(fields=['title', 'text'], query='the hunger games', type='phrase')]) From the example above, we see that our NER model successfully identified \"The Hunger Games\" as a named entity, and the final boolean query served to Elasticsearch is comprised of two parts: one multi-match query for the raw question text, and one phrase-match query for the extracted entity. Synonym Expansion The exact match nature of Elasticsearch is powerful and effective, but it isn't perfect. Word matching is limited in its ability to take semantically related concepts into consideration, and for the vague nature of NQ questions, will degrade the performance of our Retriever. For example, let's further consider the question from above and a supporting context passage: Question: \"Who is the bad guy in The Hunger Games?\" Context: \"President Coriolanus Snow is the main antagonistic villain in The Hunger Games trilogy, and though seemingly laid-back, his demeanor hides a sadistic mind.\" An exact match-based Retriever like Elasticsearch would struggle to fetch this supporting context passage because it lacks the ability to relate the concepts of \"bad guy\" and \"villain.\" More sophisticated document retrieval systems (that take advantage of learned, dense representations of text) would perform better in this situation; however, these systems are non-trivial to implement and impractical to maintain. Rather, we can try to help generalize the query through synonym expansion at search time - that is, we can identify ambiguous terms in the input question and augment the query with additional synonyms for those terms. But how do we determine what a synonym is? And how do we know which terms in the question should be expanded? We experimented with two methods that follow the same process, but differ slightly in how synonyms are designated. The process entails: Identifying a set of candidate tokens. Ideally, we want to expand tokens such that additional terms serve to increase recall, while adding minimal noise and without altering the semantics of the original query. We look at every term in the question and choose to only expand nouns, verbs, adjectives, and adverbs that are not part of a named entity. Expanding each candidate token. Related terms can be derived in numerous ways, from traditional lexicon lookups (e.g., WordNet) to similarity measures between learned vector space representations (e.g., Word2Vec). We’ve tested the use of static word embedding similarity and masked language model predictions as proxies for generating synonymous terms (more on these methods in a bit). Post-processing synonyms and crafting a new query. We then filter the expanded vocabulary to remove any duplicative, non-alphanumeric, and proper noun tokens. The final set of expanded terms is used to create a new Elasticsearch query by appending the novel words to the original question text. Let’s"
