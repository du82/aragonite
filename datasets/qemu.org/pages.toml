["https://qemu.org/support"]
title = "Support - QEMU"
full_description = "If you have a support question that is not answered by our documentation you have a number of options available to you. If the question is specifically about the integration of QEMU with the rest of your Linux distribution you may be better served by asking through your distribution’s support channels. This includes questions about a specifically packaged version of QEMU. The QEMU developers are generally concerned with the latest release and the current state of the master branch and do not provide support for older releases or QEMU binaries shipped by third party distributions. Questions about complex configurations of networking and storage are usually met with a recommendation to use management tools like virt-manager from the libvirt project to configure and run QEMU. Management tools handle the low-level details of setting up devices that most users should not need to learn. There is a qemu-discuss@nongnu.org mailing list for user focused questions. If your question is more technical or architecture specific you may want to send your question to another of QEMU’s mailing lists A lot of developers hang around on IRC (network: irc.oftc.net, channel #qemu, also available via Matrix). QEMU developers tend to be available on working week days and are distributed around the world across all time zones. Please be patient as you may have to stay connected and wait for a response. If you can’t leave IRC open and wait you may also seek help in a mailing list. If you think you have found a bug you can report it on our bug tracker. Please see our guide on how to report a bug"
year_published = 2025
