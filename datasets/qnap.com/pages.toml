["https://qnap.com/en-us/product/qvp-85b"]
title = "QVP-85B | 8-bay ultra-performance NVR server for SMBs and SOHO | QNAP (US)"
description = "The QVP-85B QVR Pro is a tower-based network surveillance server with an Intel® Core™ multi-core processor that supports eight free IP camera channels and up to sixty-four IP camera channels. Offering an economic and high-performance software and hardware integrated video surveillance solution, the QVP-85B fulfills requirements for secure, reliable, and centrally-managed video surveillance storage for small businesses and offices."
full_description = "QVP-85B 8-bay ultra-performance NVR server for SMBs and SOHO QVP-85B Features Features Specification Accessories Compatibility Downloads Buy→ The QVP-85B QVR Pro is a tower-based network surveillance server with an Intel® Core™ multi-core processor that supports eight free IP camera channels and up to sixty-four IP camera channels. Offering an economic and high-performance software and hardware integrated video surveillance solution, the QVP-85B fulfills requirements for secure, reliable, and centrally-managed video surveillance storage for small businesses and offices. Support ONVIF camerasSupports thousands of cameras from over 200+ brands and ONVIF standards.Surveillance managementMonitor and manage cameras from Windows®, Mac® and mobile devices. QVP-85B vs. other NAS-based surveillance systems. What’s the difference? In a conventional NAS-based surveillance system, surveillance is just one of many applications available to users. As all these applications need to share NAS system resources and storage space, surveillance performance could be impacted. The QVP-85B QVR Pro Appliance overcomes this by providing dedicated storage space and reserving full system resources for surveillance, delivering the utmost performance to fulfill professional surveillance system requirements. The QVP-85B also comes with built-in camera channel licenses and essential applications to enable local installation without requiring an internet connection. Simply install the hard drives and power up the QVP-85B to start the installation process. High-capacity video surveillance storage solution QVP-85B is a professional network surveillance server, compatible with 8,000+ IP cameras of 200+ brands and thousands of ONVIF network cameras. Build a complete surveillance solution with affordable deployment Live surveillance monitoring, remote management, and smart AI All-in-one surveillance Say goodbye to expensive and complicated PC NVR. QNAP network surveillance server integrates QVR Pro software and high-performance hardware. Direct video playback QVP-85B has HDMI™ output for direct surveillance video playback, removing the need for a dedicated workstation. Surveillance failover Install the high-availability QVR Guard app on another NAS to automatically takeover recording tasks if QVP-85B fails. Live surveillance video monitoring Monitor live feeds and receive alert notifications from client applications on PCs or mobiles. Large-scale central management Centrally control up to 256 Surveillance NAS (licenses sold separately) in different locations via QVR Center. AI surveillance event search Instead of manually searching through a whole day of event videos, QVR Smart Search helps you efficiently search through hundreds of hours of video recordings from hundreds of cameras to find specific events. MP4 surveillance videos Videos are saved using the non-proprietary MP4 video format. Comprehensive camera support and management The QVP-85B supports thousands of camera models from over 200+ brands with a variety of image formats (including cameras that use ONVIF and RTSP/ HTTP streaming). Even USB webcams are supported, allowing home and budget-conscious users to quickly build surveillance solutions tailored to their environment while providing convenient camera management. Motion detection using budget-friendly USB webcams Standard surveillance systems normally only support event recording and notification functions for expensive cameras with integrated motion detection. The QVP-85B provides motion detection even for entry-level cameras and USB webcams. As long as your camera can stream its footage to the QVR Pro appliance (e.g. through RTSP protocol) it supports motion detection, allowing you to build a budget-friendly, motion-detecting surveillance system. QVR Pro Client The QVR Pro Client software can be installed on Windows® and Mac® devices, allowing you to monitor from different platforms and flexibly switch from live view or playback mode to take full control over monitored areas. Live view and playback Monitor the live view of multiple channels and play recordings on a single interface. You can also view recordings at a specific time by clicking the timeline or by defining a time range. Region of Interest The Region of Interest (ROI) feature allows for viewing multiple regional images from the same camera in live view and playback mode. You can define and enlarge multiple areas to watch the area more closely. Qdewarp Technology The innovative Qdewarp enables users to view standard fisheye camera recordings in proportional ratios and sizes without affecting original recordings. The distorted parts on the edges can be turned into a clear panoramic view. Multiple Notification Methods The event notification provides multiple ways of being informed of emerging events, including flashing red borders of channels, alert buzzers, and the motion icon on the e-map. Easy remote monitoring with the QVR Pro Client mobile app The QVR Pro Client mobile app allows you to remotely monitor multiple channels simultaneously. If your network connection is slow or metered/capped, you can choose the low-bandwidth mode to view a bandwidth-optimized stream without affecting the quality of recordings. In addition, you can remotely set the camera’s preset point or control the PTZ cameras within the app. Expand your surveillance applications – Control, failover, and facial recognition QVR CenterQVR Pro control center Centrally manage multiple QVR Pro servers installed in different areas. You can also centrally monitor live feeds, play back recordings and receive event notifications from multiple QVR Pro servers, helping you reduce response times to events. Learn More: QVR Center QVR GuardHigh-availability failover management Protect QVR Pro from system failure to ensure uninterruptible surveillance recordings. If your QVR Pro fails or crashes, QVR Guard automatically takes over recording tasks, providing dependable redundancy for your surveillance system. Learn More: QVR Guard QVR FaceSmart facial recognition and analytics Obtain real-time video analytics from connected cameras and use them to set profiles, groups, and event notifications for instant facial recognition. This is ideal for smart retail, door access management, and VIP welcoming systems. Learn More: QVR Face Smoother surveillance streaming with 2.5GbE connectivity Connect the two built-in 2.5GbE ports to a QNAP 2.5GbE switch to benefit from a smoother surveillance streaming experience. Flexible Storage Expansion Connect TL SATA JBODs: TL-D400S, TL-R400S, TL-D800S, TL-D1600S to expand the storage capacity of the QVP-85B to accommodate data and business growth. Extend hardware warranty up to 5 years The QVP-85B is backed by a 3-year warranty at no additional cost. You can also purchase a warranty extension that extends your warranty coverage up to 5 years. Learn More: QNAP warranty services People Also Viewed QVP-21C 2-bay high-performance NVR for SMBs and SOHO Learn More QDA-UMP4A M.2 PCIe NVMe SSD to 2.5-inch U.2 SSD adapter Learn More TS-h1277AFX High-performance all-flash NAS – Optimizing collaboration and productivity for creatives, with unmatched affordability. Learn More QVP-41B NVR Server X Smart PoE Switch, Building Complete Surveillance Network Learn More QVP-21C 2-bay high-performance NVR for SMBs and SOHO Learn More QDA-UMP4A M.2 PCIe NVMe SSD to 2.5-inch U.2 SSD adapter Learn More TS-h1277AFX High-performance all-flash NAS – Optimizing collaboration and productivity for creatives, with unmatched affordability. Learn More QVP-41B NVR Server X Smart PoE Switch, Building Complete Surveillance Network Learn More Optional Accessories RAM RAM-16GDR4T0-SO-2666 DDR type: DDR4(260PIN)Capacity: 16GBSpec: 1G X 8Frequency: DDR4-2666Form(PIN): 260PINPower Supply: 1.2VDram Organization: 1024M*64Temperature: 0℃~85℃Environmental Regulation: RoHS RAM-32GDR4K0-SO-3200 DDR type: DDR4(260PIN)Capacity: 32GBSpec: 2G X 8Frequency: DDR4-3200Form(PIN): 260PINPower Supply: 1.2VDram Organization: 4G*64Temperature: 0℃~85℃Environmental Regulation: RoHS RAM-8GDR4T0-SO-2666 DDR type: DDR4(260PIN)Capacity: 8GBSpec: 1G X 8Frequency: DDR4-2666Form(PIN): 260PINPower Supply: 1.2VDram Organization: 1024M*64Temperature: 0℃~85℃Environmental Regulation: RoHS Please ensure that your device has SO-DIMM slots before purchasing."
