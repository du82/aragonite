title = "Festival Mental | QNAP (US)"
description = "QTS is the operating system for entry- and mid-level QNAP NAS. WIth Linux and ext4, QTS enables reliable storage for everyone with versatile value-added features and apps, such as snapshots, Plex media servers, and easy access of your personal cloud."
full_description = "Festival Mental Festival Mental Thanks to the QNAP TS-364 NAS and myQNAPcloud, Festival Mental now has a place to store large files and a way to access these files easily from anywhere. To view this video please enable JavaScript, and consider upgrading to a web browser Customer Festival Mental Industry Nonprofit & Public Sectors Product TS-364 Tell us your challenge I can say that QNAP is not just a piece of technological equipment, but an integral part of the Mental Festival's technical team. - João Gata – Director of Festival Mental Background MENTAL Festival - Cinema, Arts and Information, is co-produced by Safe Space Portugal, a non-profit organization founded in 2017 to combat illiteracy about mental health. It takes place every year and involves a vast team of professionals and volunteers who accompany the production of plays, dancing, musical concerts and a whole international exhibition of short films. The core of the festival are the M-Talks, panels of guests who discuss the themes chosen for each edition, highlighted by a carefully chosen feature film. Each member of the production team chooses their place of work, as Mental also has an annual production, which takes place all over the country. Due to this peculiarity, it was necessary to find a storage solution that was very practical and simple to use for everyone, but that also provided high security. Challenges João Gata, director of the festival, explains that “as an international showcase for short and mid-length films, we receive hundreds of films every year, which are carefully selected and stored in both MP4 and DCP formats. We also have dozens of hours of video recordings of all the M-Talks and other content, as well as all the graphic design materials, from brochures to video segments and all the social media posts. So every year we have a few more terabytes of content that has to be available to everyone on the team at all times. At the same time, in order to receive files of tens of gigabytes, such as short films, it was essential to have a physical destination so that the filmmakers could upload them directly.” The customer uses these solutions NAS User and System Management Deploy QNAP NAS in your business to realize the lowest IT TCO and highest ROI with simple and secure NAS user and system management. Learn More Secure remote access TeamViewer enables remote management and connectivity to multiple NAS devices with an unparalleled level of safety and IT efficiency. Learn More DDNS service: myQNAPcloud Access QNAP devices remotely from your phones and computers. Learn More Storage for Professional Photographers and Enthusiasts QNAP helps keeps your data secure and private with both NAS and DAS. Learn More Backup, Restoration & Sync for NAS Use Hybrid Backup Sync to double up your protection by quickly backing up your NAS to remote and cloud storage spaces – ideal for building a complete 3-2-1 backup and recovery plan. Learn More Multi-factor Authentication Secure your NAS account with two-step verification or passwordless login using QNAP Authenticator, preventing data breaches and password theft. Learn More NAS User and System Management Deploy QNAP NAS in your business to realize the lowest IT TCO and highest ROI with simple and secure NAS user and system management. Learn More Secure remote access TeamViewer enables remote management and connectivity to multiple NAS devices with an unparalleled level of safety and IT efficiency. Learn More DDNS service: myQNAPcloud Access QNAP devices remotely from your phones and computers. Learn More Storage for Professional Photographers and Enthusiasts QNAP helps keeps your data secure and private with both NAS and DAS. Learn More Backup, Restoration & Sync for NAS Use Hybrid Backup Sync to double up your protection by quickly backing up your NAS to remote and cloud storage spaces – ideal for building a complete 3-2-1 backup and recovery plan. Learn More Multi-factor Authentication Secure your NAS account with two-step verification or passwordless login using QNAP Authenticator, preventing data breaches and password theft. Learn More Solution Coming with an Intel® Celeron® N5095 quad-core processor and 8 GB DDR4 memory, the high-performing TS-364 NAS provides the Festival Mental production team with unified content storage for management and sharing. It not only addresses the growing need for storage but also boosts the speed and productivity of collaboration across multiple locations. “QNAP solved all of these issues for us in one fell swoop with the TS-364 three-bay model, which has proved to be a real partner for our needs in its first year of use”, says João. In addition to promoting efficient collaboration, QNAP NAS also enables high accessibility and security for files . “Access is facilitated by the creation of user groups with dedicated permissions, and also useful is the creation of power schedules to keep the NAS active when it is being accessed across different time zones,” says João. They also use the Qmanager mobile app to access the NAS remotely for necessary security updates or other technical needs enabling them to easily manage and maintain resilience. Result With the TS-364 NAS solution, the team can achieve the full benefit of collaboration without wasting time and effort to organize user access. João Gata, Director of Festival Mental, says “This solution has made it possible for the festival team to work in a more agile and streamlined way, which is extremely important given the fact that this is a small team working to tight deadlines.” Moreover, the festival team adopts the myQNAPcloud service to enhance the smoothness of data transmission which not only increases operational efficiency but also enables them to collaborate remotely and securely. “We now have a sub-domain on myQNAPcloud.com as it is much more professional than using free cloud tools, which we used until now to receive the files of the films on show during the festival. What's more, we've streamlined processes here too, as uploads are made directly to a resource on our local network, thus avoiding that we waste time on further downloads, ” says João. “This is the reason that I say that QNAP is not just a piece of technological equipment, but an integral part of the Festival's technical team”. Explore more from our customers All Customer stories José Manuel Chacón, Down Madrid CDO Thanks to QuMagie's AI-powered intelligent photo management, we organize images efficiently and avoid time-consuming searching ▶ ▶ Chairperson of the PWSA Taiwan – Dr. NI-CHUNG LEE There are different challenges in caring for each PWSA patient. With the convenient service of QNAP QuWAN, social workers at various PWSA locations can quickly access care information securely to make the service process smoother. ▶ ▶ Polanów Town Hall Polanów's Town Hall Adopts TS-853U-RP to Accelerate Administrative Task Efficiency ▶ ▶ Fundación Acrescere Fundación Acrescere improve their working efficiency with QNAP TS-453B ▶ ▶ All Customer stories"
