full_description = "QXP-3X4PES Use a PCIe Gen 3 x4 card to connect your NAS to TL PCIe Interface JBOD for storage expansion QXP-3X4PES Features Features Specification Downloads Buy→ The QXP-3X4PES PCIe card is designed for expanding the capacity of a QuTS hero or QTS NAS by connecting it to QNAP TL PCIe Interface JBOD. Multiple JBODs can be daisy-chained via high-speed cables to scale up to petabyte-level storage to handle exponential data growth caused by archiving/backing up surveillance recordings, RAW multimedia files, big data, and virtualization applications. Note: • The host QNAP NAS requires QuTS hero h5.1.2 / QTS 5.1.2 (or later) and updating to specific BIOS versions per each model. Petabyte-scale capacity with economyExpand up to petabyte-scale capacity for QuTS hero NAS, by connecting multiple PCIe JBOD expansion enclosures. .Up to 32 Gb/sThe QXP-3X4PES PCIe Gen 3 x4 expansion card provides up to 32 Gb/s data transfer speed. Note: Actual transfer speeds depend on the host NAS's PCIe slot and the storage units used.SFF-8644 special cables supportedInstall a QXP-3X4PES for connecting the enclosures using SFF-8644 4X special cables. Expand up to petabyte-scale capacity A NAS with a QXP-3X4PES can be daisy-chained with multiple TL PCIe Interface JBODs (TL-R1200PES-RP, TL-R1600PES-RP and TL-R2400PES-RP), which supports SATA HDDs. This provides the potential to store up to petabyte-scale capacity.Actual number of expansion units may depend on the host NAS. Learn More: TL-R1200PES-RP, TL-R1600PES-RP, TL-R2400PES-RP Note:1. The TL PCIe Interface JBOD series requires users to connect cables to specific inputs/outputs.2. Actual number of expansion units may depend on the host NAS. Always consult the compatibility list before purchasing accessories for host devices. Supported SFF-8644 special cables CAB-PCIE10M-8644-4X Length 1m Note: • Always consult the compatibility list before purchasing accessories for host devices.• The QXP-3XxPES series does not come with an