["https://qnap.com/en-us/product/qna-t310g1t"]
title = "QNA-T310G1T | Connect to 10GbE/NBASE-T networks over Thunderbolt™ 3 | QNAP (US)"
description = "The QNAP QNA series is a cost-effective Thunderbolt 3 to 10GbE adapter that empowers your Mac® or Windows® computers with blazing-fast 10GbE network connectivity using a Thunderbolt 3 type-C port. And of course, it can be used with QNAP Thunderbolt™ 3 NAS to add additional 10GbE connectivity. With the portable QNA series adapter, a 10GbE network can be created between your Thunderbolt 3 computer and another 10GbE-capable device or NAS to facilitate high-speed data transfer for large files and help to streamline collaborative workflows to improve efficiency."
full_description = 'QNA-T310G1T Connect to 10GbE/NBASE-T networks over Thunderbolt™ 3 Watch Video Review QNA-T310G1T Features Features Specification Downloads Buy→ The QNAP QNA series is a cost-effective Thunderbolt 3 to 10GbE adapter that empowers your Mac® or Windows® computers with blazing-fast 10GbE network connectivity using a Thunderbolt 3 type-C port. And of course, it can be used with QNAP Thunderbolt™ 3 NAS to add additional 10GbE connectivity. With the portable QNA series adapter, a 10GbE network can be created between your Thunderbolt 3 computer and another 10GbE-capable device or NAS to facilitate high-speed data transfer for large files and help to streamline collaborative workflows to improve efficiency. ● Windows®11 devices: The driver for the Marvell AQtion AQC107 is required to use the QNA-T310G1T. Click here to download drivers● Windows®10 devices: The driver for the QNA is required to use the QNA-T310G1T. Click here to download drivers● Mac® devices: Supports macOS 10.13.3 (or later). M1, M2, M3 chips compatible. ● Linux: Supports Linux core 3.10, 3.12, 3.2, 4.2, and 4.4. The driver for the Marvell AQtion AQC107 is required to use the QNA-T310G1T. Click here to download drivers● QNAP Thunderbolt™ 3 NAS: Requires QTS 4.3.6 (or later). QNA-T310G1T 2023-10-25 Score: 10/10 - RedesZone (Spain) (2023/10/25) "This 10GbE to Thunderbolt 3 QNAP QNA-T310G1T adapter has behaved impeccably in performance tests, achieving more than 9.5Gbps of real speed in the local home network, both in download and upload, perfect to take full advantage of the speed of 10G networks." Enable blazing-fast 10GbE connectivity for your Mac With the QNA series adapters, you can connect your Mac and Windows® computers to a 10GbE network to enjoy access speeds of up to 1069 MB/s. With both Thunderbolt™ 3 and 10GbE connectivity, your data transfers will be faster than ever! Please note:1. QNA Series adapters will not work when connected using a Thunderbolt 2 to Thunderbolt 3 adapter.2. To ensure optimal performance, it is recommended to set the Jumbo Frames on all the devices in your local network environment to MTU 9000. How to set the MTU. File Transfer (1 x 10GbE) Windows Download 1068 MB/s Windows Upload 1069 MB/s Mac File Transfer (1 x 10GbE) Download 1042 MB/s Upload 1045 MB/s AJA System Test with MacBook Pro Tested in QNAP Labs. Figures may vary by environment.10GbE TransferTest Environment: 10GB file transfer from Thunderbolt 3 laptop to 10GbE NAS via QNA adapter and QSW switch.Sever NAS: TS-677, QTS 4.3.4, , AMD Ryzen 5 2600, 3.40 GHz, 8GB RAM, RAID5, Samsung SSD 850 PRO 512GB x 6, LAN: QXG-10G1TClient PC: MSI laptop, Windows 10, Intel Core i7-4770 3.40GHz, 32GB RAM, Thunderbolt 3, MTU 9000MacBook Pro, macOS High Sierra version 10.13.5, Intel Core i7 2.9 GHz, 16GB RAM, Thunderbolt 3, MTU 9000 10GbE data transfer that media professionals need As video resolutions move from 1080p, to 4K, 8K (and beyond) media creators are struggling with the storage and network requirements needed for editing huge multimedia files. The QNA-T310G1T features a Thunderbolt 3 to 10GbE Multi-Gigabit (10G/5G/2.5G/1G/100M) port, allowing you to easily add 10GbE connectivity to any Thunderbolt 3 device. Coupled with a QNAP 10GbE switch, a budget-friendly 10GbE environment can be created for creative studios to benefit from the incredible speed and bandwidth that 10GbE provides. Learn More: QNAP 10GbE switch Stylish The QNA series features a metallic bright-toned cover that fits perfectly alongside other devices. Portable The QNA series requires no extra power supply, and you can easily carry it around for universal deployment. Heat Dissipation The QNA series has shallow grooves on its top for effective heat dissipation. Effortless setup Simply connect a QNA adapter to your Mac or Windows® computer using the included Thunderbolt 3 cable and connect the adapter to a 10GbE-capable switch, NAS, or other device using a 10GbE cable (RJ45 Cat 5e/Cat 6a cable or above or a SFP+ DAC). How to set the MTU Mac: Open “System Preferences” → go to “Network” → Select the QNA Thunderbolt Ethernet → click “Advanced...” → go to the “Hardware” tab → change “Configure” to “Manually” → set “MTU” to “9000”.Windows: Open "Settings" → go to "Network & Internet" → click "Change your adapter options" → right click on the Thunderbolt 3 Ethernet adapter and click "Properties" → click "Configure..." → go to the "Advanced" tab → select "Jumbo Frame" and set the value to "9KB MTU".NAS: Open "Network & Virtual Switch" → go to "Network" > "Interfaces" → find the applicable Ethernet adapter, click and select "Configure" → go to the "IPv4" tab → set "Jumbo Frame" to 9000. People Also Viewed TL-R1200PES-RP PCIe Interface 12-bay JBOD, supporting SATA drives, for petabyte-scale expansion designed specifically for QNAP NAS Learn More QDA-UMP4A M.2 PCIe NVMe SSD to 2.5-inch U.2 SSD adapter Learn More QXP-400eS-A1164 Expand PC and NAS storage with easy installation Learn More'
