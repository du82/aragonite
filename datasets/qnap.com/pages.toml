full_description = "Centrale del Latte di Salerno Centrale del Latte di Salerno Learn how QNAP ADRA NDR protects Centrale del Latte di Salerno's data and IT environment by improving data security. Customer Centrale del Latte di Salerno Industry General Enterprises Product QGD-1602P/adra-ndr Tell us your challenge Through its LAN ports, QNAP ADRA NDR provides security for networked NAS by rapidly detecting ransomware and similar threats. - Ing. Errico Di Domenico – Operation Manager, Centrale del Latte di Salerno Background A company with a deep history since 1928, Centrale del Latte di Salerno has always been committed to providing products of the highest quality. As a result of its extensive network of offices and services, cybersecurity has become a crucial issue. It has become imperative to ensure business continuity by checking mailboxes and protecting data. The customer uses these solutions Network Security (Network Detection and Response, NDR) QNAP ADRA (Network Detection and Response, NDR) protects sensitive data in LAN devices from malware attacks. Learn More Network Security (Network Detection and Response, NDR) QNAP ADRA (Network Detection and Response, NDR) protects sensitive data in LAN devices from malware attacks. Learn More Experiencing past challenges Centrale del Latte was susceptible to cyberattacks at many points, making cybersecurity challenges a daily occurrence. Managing mailboxes was a major critical issue, and some users' misuse had temporarily caused problems to services. To increase the number of replicas of master data and create virtual environments, maintaining data security was a priority. Solution Today, the Salerno site has QNAP storage dedicated to data security. There are currently two TS-983XU-RP backup units in use as primary and secondary backups, as well as one TS-431XeU-2G QNAP serving as a backup repository. There are also two external locations where TS-431XeU-2G network storage models are located, protecting local information.To further improve network security, the milk plant implemented QNAP ADRA NDR – an appliance installed on Guardian hardware – alongside QNAP storage systems for data backup and replication: QGD-1600, QGD-1600P, and QGD-1602P. As a result of this solution, threats such as ransomware were quickly identified and the NAS data was protected from malicious attacks by infected client devices. The ADRA NDR QNAP appliance was successfully installed with support from 4x4 System and helped block targeted attacks on the backup infrastructure. Result Introducing QNAP ADRA NDR has improved the safety of Centrale del Latte di Salerno significantly. It provided protection for systems and data by detecting and blocking targeted attacks. The installation and configuration were carried out without any issues thanks to the collaboration with our partner 4x4 System, led by Mariano Natella, Sales Division Manager. Now, the company plans to replicate data to other locations using QNAP, demonstrating its confidence in the solution. Additionally, QNAP and the partner have provided proactive cyber security support to the milk plant. Explore more from our customers All Customer stories IT Manager, Holland Mechanics China QNAP NAS exceeded our expectations. Its powerful performance and flexibility have transformed our IT operations, driving remarkable efficiency. ▶ ▶ Michal Jedlicka, Systems Architect QNAP family products are an integral part of our development infrastructure and allow us to respond flexibly to our needs. ▶ ▶ Daniele Sacchetti – IT manager, Lomec Ingranaggi S.r.l. We chose QNAP's NDR ADRA because of their ability to discover potential threats that firewalls cannot detect. What's more, the “Honeypot” feature is great. It attracts attackers, identifies source IPs, and automatically blocks threats, alerting IT administrators in real time. ▶ ▶ Mutsuo Nakato, CEO of Marunaka Transportation We are amazed at the network risk visualization, rapid network isolation, and stable operation of QNAP’s low-cost ADRA NDR. ▶ ▶ All Customer stories"
