["https://qnap.com/en-us/compatibility-expansion"]
title = "Storage Expansion Compatibility | QNAP (US)"
description = "QTS is the operating system for entry- and mid-level QNAP NAS. WIth Linux and ext4, QTS enables reliable storage for everyone with versatile value-added features and apps, such as snapshots, Plex media servers, and easy access of your personal cloud."
full_description = "QNAP Storage Expansion Compatibility Storage Expansion Compatibility When expanding your total data storage capacity, deploying multiple servers can increase both management complexity and costs. QNAP expansion enclosures provide an economical solution for expanding the total storage space while greatly streamlining management and maintenance tasks. Compatibility List Check the compatible expansion enclosure for your QNAP product and the maximum number of applicable expansion enclosures. Please note=> For QTS - The maximum size supported for a RAID group is 308 TB. The maximum size supported for a storage pool is 308 TB. (Starting from QTS version 4.2, the minimum size of a storage pool is 144 GB.) The maximum capacity for volumes and iSCSI LUNs depends on both the capacity of the drives and the system specifications. If the NAS has less than 4GB RAM, then the maximum capacity is 144 TB. If the NAS has at least 4GB RAM, then the maximum capacity is 250 TB. A SAS storage expansion card is required if the NAS does not have Mini-SAS ports. Please check the compatibility list of expansion cards for your QNAP NAS. For QTS & QES - The maximum number of RAID groups supported for a storage pool is 128. For USB JBOD/RAID enclosures - QNAP recommends connecting to a USB port on the rear panel of the NAS to ensure an optimal connection."
