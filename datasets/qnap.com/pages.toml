["https://qnap.com/en-us/product/qxp-3x8pes"]
title = "QXP-3X8PES | Use a PCIe Gen 3 x8 card to connect your NAS to TL PCIe Interface JBOD for storage expansion | QNAP (US)"
description = "The QXP-3X8PES PCIe card is designed for expanding the capacity of a QuTS hero or QTS NAS by connecting it to QNAP TL PCIe Interface JBOD. Multiple JBODs can be daisy-chained via high-speed cables to scale up to petabyte-level storage to handle exponential data growth caused by archiving/backing up surveillance recordings, RAW multimedia files, big data, and virtualization applications."
full_description = "QXP-3X8PES Use a PCIe Gen 3 x8 card to connect your NAS to TL PCIe Interface JBOD for storage expansion QXP-3X8PES Features Features Specification Downloads Buy→ The QXP-3X8PES PCIe card is designed for expanding the capacity of a QuTS hero or QTS NAS by connecting it to QNAP TL PCIe Interface JBOD. Multiple JBODs can be daisy-chained via high-speed cables to scale up to petabyte-level storage to handle exponential data growth caused by archiving/backing up surveillance recordings, RAW multimedia files, big data, and virtualization applications. Note: • The host QNAP NAS requires QuTS hero h5.1.2 / QTS 5.1.2 (or later) and updating to specific BIOS versions per each model. Petabyte-scale capacity with economyExpand up to petabyte-scale capacity for QuTS hero NAS, by connecting multiple PCIe JBOD expansion enclosures. .Up to 64 Gb/sThe QXP-3X8PES PCIe Gen 3 x8 expansion card provides up to 64 Gb/s data transfer speed. Note: Actual transfer speeds depend on the host NAS's PCIe slot and the storage units used.SFF-8644 special cables supportedInstall a QXP-3X8PES for connecting the enclosures using SFF-8644 8X special cables. Expand up to petabyte-scale capacity A NAS with a QXP-3X8PES can be daisy-chained with multiple TL PCIe Interface JBODs (TL-R1200PES-RP, TL-R1600PES-RP and TL-R2400PES-RP), which supports SATA HDDs. This provides the potential to store up to petabyte-scale capacity.Actual number of expansion units may depend on the host NAS. Learn More: TL-R1200PES-RP, TL-R1600PES-RP, TL-R2400PES-RP Note:1. The TL PCIe Interface JBOD series requires users to connect cables to specific inputs/outputs.2. Actual number of expansion units may depend on the host NAS. Always consult the compatibility list before purchasing accessories for host devices.3. To attain 64Gbps transfer speeds with a QXP-3X8PES expansion card, you can connect to a TDS-h2489FU NAS with ten JBODs to achieve up to 3.4 PB capacity (using RAID 60). To achieve 4.1 PB capacity (the maximum capacity calculated using RAID 60) with a QXP-3X8PES expansion card, you can connect to a TS-h2490FU NAS with twelve JBODs using 32Gbps transfer speeds. To attain 64Gbps transfer speeds with a QXP-3X8PES expansion card, the TS-h2490FU NAS can only by connected to four JBODs via PCIe slot 2. Supported SFF-8644 special cables CAB-PCIE10M-8644-8X Length 1m Note: • Always consult the compatibility list before purchasing accessories for host devices.• The QXP-3XxPES series does not come with any cables.• The TL-Rx00PES-RP series package contains a 1M CAB-PCIE10M-8644-8X special cable that only supports the QXP-3X8PES. The 1M CAB-PCIE10M-8644-4X special cable for QXP-3X4PES series is sold separately. People Also Viewed QDA-UMP4A M.2 PCIe NVMe SSD to 2.5-inch U.2 SSD adapter Learn More QXP-3X4PES Use a PCIe Gen 3 x4 card to connect your NAS to TL PCIe Interface JBOD for storage expansion Learn More TS-h1277AFX High-performance all-flash NAS – Optimizing collaboration and productivity for creatives, with unmatched affordability. Learn More TL-R2400PES-RP PCIe Interface 24-bay JBOD, supporting SATA drives, for petabyte-scale expansion designed specifically for QNAP NAS Learn More QDA-U2MP Use two M.2 PCIe NVMe SSD in a U.2 PCIe NVMe SSD drive bay for PC and NAS Learn More QXP-820S-B3408 High-Bandwidth, Full Duplex 12Gb/s SAS Card Learn More QDA-UMP4A M.2 PCIe NVMe SSD to 2.5-inch U.2 SSD adapter Learn More QXP-3X4PES Use a PCIe Gen 3 x4 card to connect your NAS to TL PCIe Interface JBOD for storage expansion Learn More TS-h1277AFX High-performance all-flash NAS – Optimizing collaboration and productivity for creatives, with unmatched affordability. Learn More TL-R2400PES-RP PCIe Interface 24-bay JBOD, supporting SATA drives, for petabyte-scale expansion designed specifically for QNAP NAS Learn More QDA-U2MP Use two M.2 PCIe NVMe SSD in a U.2 PCIe NVMe SSD drive bay for PC and NAS Learn More QXP-820S-B3408 High-Bandwidth, Full Duplex 12Gb/s SAS Card Learn More Note: The actual performance result may vary by host device performance."
