["https://qnap.com/en-us/customer-stories/tvs-h1288x-firstlapse"]
title = "FIRSTLAPSE | QNAP (US)"
description = "QTS is the operating system for entry- and mid-level QNAP NAS. WIth Linux and ext4, QTS enables reliable storage for everyone with versatile value-added features and apps, such as snapshots, Plex media servers, and easy access of your personal cloud."
full_description = "FIRSTLAPSE FIRSTLAPSE With in-built data protection, performance, and scalability, QNAP NAS TVS-h1288X helps FIRSTLAPSE speed up their workflow and get rid of lags. Customer FIRSTLAPSE Industry Videography & Photography Product TVS-h1288X Tell us your challenge We often had lag before, but now with SSD caching and a powerful CPU + 10GbE everything is smooth when we work and render 4K and 5K content. - Henrik Matzen, the Co-founder of FIRSTLAPSE Background FIRSTLAPSE is a professional timelapse production company which aims to be among the best timelapse photographers in the world. Since 2013, they have been delivering movies and content to companies across the globe. While they are aware of their need to optimize tools, their old storage methods were holding them back. The customer uses these solutions 10/25GbE network QNAP provides affordable 10GbE solutions for small businesses and home users to easily upgrade their network environment. Learn More Storage for Professional Photographers and Enthusiasts QNAP helps keeps your data secure and private with both NAS and DAS. Learn More QNAP NAS with Adobe CC Provides a key collaborative video editing solution for Adobe Creative Cloud users. Learn More Backup, Restoration & Sync for NAS Use Hybrid Backup Sync to double up your protection by quickly backing up your NAS to remote and cloud storage spaces – ideal for building a complete 3-2-1 backup and recovery plan. Learn More Multi-factor Authentication Secure your NAS account with two-step verification or passwordless login using QNAP Authenticator, preventing data breaches and password theft. Learn More 10/25GbE network QNAP provides affordable 10GbE solutions for small businesses and home users to easily upgrade their network environment. Learn More Storage for Professional Photographers and Enthusiasts QNAP helps keeps your data secure and private with both NAS and DAS. Learn More QNAP NAS with Adobe CC Provides a key collaborative video editing solution for Adobe Creative Cloud users. Learn More Backup, Restoration & Sync for NAS Use Hybrid Backup Sync to double up your protection by quickly backing up your NAS to remote and cloud storage spaces – ideal for building a complete 3-2-1 backup and recovery plan. Learn More Multi-factor Authentication Secure your NAS account with two-step verification or passwordless login using QNAP Authenticator, preventing data breaches and password theft. Learn More Challenges As a specialized timelapse production company, FIRSTLAPSE needs a lot of capacity to store and backup timelapses. With constant business growth, they had to bring a lot of external HDDs on location for multiple backups, and this raised fears of drives being lost or stolen. Besides, since they prefer having the full control over their data, they realized that they need to seek a much more economic and efficient solution instead having to pay for a cloud service. Solution The high-capacity TVS-h1288X features a powerful Intel® Xeon® W processor and built-in 10GbE connectivity supporting Port Trunking. Running the reliable ZFS-based QuTS hero operating system, the TVS-h1288X helps FIRSTLAPSE form creative workflows, a file server, to efficient file backup/recovery. The TVS-h1288X has four 2.5-inch SATA 6Gb/s drive bays for SSDs and two M.2 NVMe Gen 3 x4 SSD slots that allow FIRSTLAPSE to flexibly configure SSD caching to increase IOPS performance, reduce storage volume latency, and optimize 2.5GbE/10GbE performance. So far FIRSTLAPSE have set up drives with 4 bays occupied and left 4 slots open for expansion. They also set up the M.2 cache to accelerate workflows when working with hundreds of digital images in each timelapse. Result The TVS-h1288X provides FIRSTLAPSE with a more efficient workflow and data security. Its high capacity and scalability to meet future demands provide certainty for content creators. Now it is installed in the studio and directly connected via 10GbE to their PC. Instead of carrying external HDDs for backups, they have everything centralized in one place and can edit directly on the NAS via 10GbE. They can also connect via VPN to the NAS and get to work no matter where they are, while clients can securely connect to the NAS to download the content that FIRSTLAPSE have created for them. Even better, with QNAP Hybrid Backup Sync, they can ensure their files are backed up and protected. FIRSTLAPSE also take advantage of QNAP’s companion mobile apps including Qmanager and Authenticator. FIRSTLAPSE can see the performance and the capacity remotely plus it has the 2-factor security enabled to prevent unwelcome guests from logging in. With the TVS-h1288X and its apps, FIRSTLAPSE now can always have a remote backup by uploading data on the go to the QNAP NAS back home in the office without worrying about losing files, and the best part is, with SSD cache, a powerful CPU and 10GbE, everything is smooth when working and rendering 4K/5K content. Explore more from our customers All Customer stories David Wall – Director of Denhef Digital I am definitely looking forward to using this QNAP NAS for collaborations with other film makers. We might then all connect to the same project and files on the NAS and work together on the same timeline. ▶ ▶ Shin Suzuki QNAP NAS allows me to seamlessly access the database I have been working on. Thanks to the AI features, I can reach the specific files I'm looking for as if I were recollecting old memories. ▶ ▶ Albert Dros The TVS-h1288X will be my main storage solution system for storing all of my photos and videos ▶ ▶ James Rushforth Switching to a dedicated NAS has streamlined my workflow, increased my productivity and was much easier to set up than I expected. I just wish I’d discovered QNAP sooner. -- James Rushforth ▶ ▶ All Customer stories"
