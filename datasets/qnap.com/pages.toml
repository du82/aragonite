["https://qnap.com/en-us/customer-stories/tvs-h1288x_albertdros"]
title = "Albert Dros | QNAP (US)"
description = "QTS is the operating system for entry- and mid-level QNAP NAS. WIth Linux and ext4, QTS enables reliable storage for everyone with versatile value-added features and apps, such as snapshots, Plex media servers, and easy access of your personal cloud."
full_description = "Albert Dros Albert Dros Albert Dros centralized his high-resolution photos to a TVS-h1288X NAS. To view this video please enable JavaScript, and consider upgrading to a web browser Customer Albert Dros Industry Videography & Photography Product TVS-h1288X QSW-2104-2T QXP-T32P Tell us your challenge The TVS-h1288X will be my main storage solution system for storing all of my photos and videos - Albert Dros Background Albert Dros is a photographer from the Netherlands, and is featured in international media such as National Geographic, TIME, HuffPost, and the Daily Mail. Known as a leading landscape photography professional, Albert maintains a high standard for capturing shots even when working in challenging natural environments. The customer uses these solutions Storage for Professional Photographers and Enthusiasts QNAP helps keeps your data secure and private with both NAS and DAS. Learn More Storage for Professional Photographers and Enthusiasts QNAP helps keeps your data secure and private with both NAS and DAS. Learn More Previous challenges To get the best shots possible, Albert often takes 10,000+ photos per trip, and file sizes of high-resolution images sometimes reach up to 100 MB. Early in his career, he used to store files in external hard drives and a DAS, the Drobo 5N and 8D, however he often had organizational issues since the number of drives constantly increased. Solution Albert chose the 12-bay desktop NAS TVS-h1288X, the Intel® Xeon® W desktop QuTS hero NAS, for his new storage solution. This model is ideal for high-speed media collaboration over Thunderbolt™ 3 and 10 GbE (built-in). He chose Western Digital Red series drives that specially designed for NAS use:• 8x WD Red Plus 10TB• 4x WD Red SA500 1TB SSD• 2x WD Red SN700 NVMe 1TB SSD Result After centralizing all his photos, Albert found out the many other benefits of QNAP NAS for professional photographers besides its large storage capacity. Data safety: Albert loves the NAS application Hybrid Backup Sync that easily mirror-syncs his files to a remote NAS for ensuring his data safety. Hybrid Backup Sync supports most major cloud services and FTP. He works on different projects every day, and constant data sync and mirroring makes sure his backups are always up to date. Connectivity: Albert has two workstations, a Mac Studio and MacBook. At his home he accesses the NAS with a 10 GbE Mac Studio via the networking switch QSW-2104-2T. Albert also uses the Thunderbolt 3 ports on the TVS-h1288X that allows him to directly access NAS folders with a MacBook that travels with him while shooting. Explore more from our customers All Customer stories David Wall – Director of Denhef Digital I am definitely looking forward to using this QNAP NAS for collaborations with other film makers. We might then all connect to the same project and files on the NAS and work together on the same timeline. ▶ ▶ Shin Suzuki QNAP NAS allows me to seamlessly access the database I have been working on. Thanks to the AI features, I can reach the specific files I'm looking for as if I were recollecting old memories. ▶ ▶ Henrik Matzen, the Co-founder of FIRSTLAPSE We often had lag before, but now with SSD caching and a powerful CPU + 10GbE everything is smooth when we work and render 4K and 5K content. ▶ ▶ James Rushforth Switching to a dedicated NAS has streamlined my workflow, increased my productivity and was much easier to set up than I expected. I just wish I’d discovered QNAP sooner. -- James Rushforth ▶ ▶ All Customer stories"
