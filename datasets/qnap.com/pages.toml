["https://qnap.com/en-us/case-studies/ts-1685-imi"]
title = "Institute of Molecular Immunology and Experimental Oncology | QNAP"
description = "QTS is the operating system for entry- and mid-level QNAP NAS. WIth Linux and ext4, QTS enables reliable storage for everyone with versatile value-added features and apps, such as snapshots, Plex media servers, and easy access of your personal cloud."
full_description = "“For us as researchers, user friendliness is paramount. The QNAP NAS operating system (QTS) allows us to easily set up all required tasks without any difficulty. ” - Institute of Molecular Immunology and Experimental Oncology Background The Institute of Molecular Immunology and Experimental Oncology (IMI) is located in the main campus of the School of Medicine at the Rechts der Isar Hospital - located at The Technical University of Munich. The institute focuses on the clinically relevant questions of how immune responses are controlled by local regulatory cues. IMI aims to achieve the translation of basic science discoveries into applications useful in gene therapy of regenerative medicine and immune intervention in chronic diseases as well as in disease prevention. IMI pursues research goals by deploying advanced flow cytometry, cutting-edge fluorescent microscopy, and data-driven omics techniques. Challenge Generating large amounts of data with state-of-the-art flow cytometry and microscopy, IMI require an exceptional reliable data storage which allows them to perform data analysis and further processing. Speed, ease-of-use, and secure cross-platform accessibility was also required as researchers use various devices, including macOS and Windows. Backup solutions must be user-friendly and accessible to non-IT professionals. Solution After carefully researching their available options, IMI decided to deploy the TS-1685 and the TS-453BT3. The TS-1685 was installed in a high-performance fluorescence microscopy lab with twelve 12TB IronWolf HDDs installed in a RAID 5 configuration. IMI also used Time Machine to back up data from numerous Macs to the TS-453BT3 and replaced an old Time Capsule for higher storage capacity and improved performance. Result QTS (the QNAP NAS operating system) allows IMI to easily set up all required tasks with little difficulty. The TS-1685 stores up to 6 months of data on-site for daily analysis and reevaluation, enabling IMI to keep up with ever-evolving research. The built-in dual 10GbE ports enable high-speed data acquisition, and workstations can minimize data transfer times while maintaining writing speeds over 600 MB/s. The TS-453BT3 not only accommodates Time Machine backup data, but also acts as a central data hub for flow cytometry data between different acquisition and analysis machines. By removing the need for intermediate USB storage devices, IMI’s storage solution is more secure against potential malware infection. IMI is convinced that QNAP NAS is a future-proof solution, as they can expand the storage space just by swapping to larger drives, and are happy that their sensitive data is safely stored to an on-premises file server."
author = "QNAP Systems, Inc."
