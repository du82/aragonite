["https://qnap.com/en-us/product/tbs-h574tx"]
title = "TBS-h574TX | Make your creativity bloom with the lightning-fast Thunderbolt™ 4 All-Flash NASbook | QNAP (US)"
description = "Designed for film sets, small studios, small-scale video production teams and SOHO users, the compact TBS-h574TX Thunderbolt™ 4 all-flash NASbook elevates video production for optimum productivity. It packs high-speed I/O and Intel® Core™ performance required by video production, allowing creators using Mac® or Windows® to enjoy the smoothest experience ever in real-time video editing, large file transfer, video transcoding, and backup. The TBS-h574TX, as the bridge between pre-production and post-production, takes video projects and team collaboration to the next level. The TBS-h574TX runs the ZFS-based QuTS hero operating system that ensures data integrity. You can also switch to QTS operating system based on your needs."
full_description = '''TBS-h574TX Make your creativity bloom with the lightning-fast Thunderbolt™ 4 All-Flash NASbook Watch Video Review TBS-h574TX Features Features Specification Expansion Accessories Compatibility Downloads Buy→ Designed for film sets, small studios, small-scale video production teams and SOHO users, the compact TBS-h574TX Thunderbolt™ 4 all-flash NASbook elevates video production for optimum productivity. It packs high-speed I/O and Intel® Core™ performance required by video production, allowing creators using Mac® or Windows® to enjoy the smoothest experience ever in real-time video editing, large file transfer, video transcoding, and backup. The TBS-h574TX, as the bridge between pre-production and post-production, takes video projects and team collaboration to the next level. The TBS-h574TX runs the ZFS-based QuTS hero operating system that ensures data integrity. You can also switch to QTS operating system based on your needs. Ultra-fast RAW file editingWith an E1.S to M.2 SSD adapter attached in each slot, you can flexibly install five E1.S or M.2 PCIe NVMe SSDs for lightning-fast multimedia file editing.Stay agile for ongoing projectsHot-swappable M.2 SSD and automatic RAID disk replacement enhance system reliability, reduce the risk of data loss, and smoothen ongoing projects.Thunderbolt™ 4 for faster direct connectionsTwo Thunderbolt™ 4 ports allow directly connecting Mac®/PC workstations to the TBS-h574TX, delivering up to 20Gbps for 4K video editing.Hybrid-architecture CPU for multitasking The 13th Gen Intel® Core™ processors with hybrid-architecture (P-core and E-core) delivers high performance and efficiency.2.5GbE and 10GbE as standard2.5GbE and 10GbE networks accelerate large file transfer and allow for more connected devices/workstations by attaching a network switch.Faster USB transferTwo USB 3.2 Gen 2 (10Gbps) ports enable fast file import/export from/to external storage devices. TBS-h574TX & TVS-h874T 2024-01-12 TechRadar Pro CES 2024 Picks Awards - TechRadar Pro (US) (2024/01/12) "TechRadar Pro, Residential Systems, and TWICE are proud to announce the winners of this year’s Picks Awards, the brands’ annual program honoring the best and most influential consumer technology that was at CES 2024. The staff selected winners based on the impact they’re expected to have on the business technology industries. Congratulations to all the winners!" TBS-h574TX 2024-05-21 Platinum Award - Profesional Review (Spain) (2024/05/21) "This TBS-h574TX NAS is an option designed and built for professionals in the content creation sector, particularly editors. The hardware, interfaces, and storage are geared towards transfer speed and real-time transcoding. An All Flash system with multi-level RAID SSD, adding the failover protection and deduplication technology provided by QuTS hero. One of the big new features will undoubtedly be the hardware, with a Raptor Lake CPU and Iris Xe graphics, which for a NAS is quite a beast when it comes to 4K and even 8K video transcoding.The interfaces are prepared to provide the maximum possible speed, both 10 Gbps LAN and Thunderbolt 4, reaching 2 GB/s transfer. In terms of design, this is a small and compact device, with good aesthetics, designed to be placed on or under a desk." TBS-h574TX 2024-03-20 Platinum Award - El chapuzas informático (Spain) (2024/03/20) "Now, with the QNAP TBS-h574TX, we can have an ideal complement for video editing tasks at home or in a small business, with high-speed data access, guaranteed stability, and durability for professional workflows. Its performance is based on Intel Core i5-1340PE 12 core processor (4 Performance + 8 Efficent) and 16GB RAM - an ideal combo for virtualisation, multimedia, and web service tasks." TBS-h574TX 2024-07-22 Editor's favourite - Geeknetic (Spain) (2024/07/22) "TBS-h574TX NAS has five bays for NVMe storage drives that we look for in mid-range or high-end NAS. The NVMe storage drives are normally used to make our PC or laptop as responsive as we expect. It is a perfect combination, TBS-h574TX provides high capacity, high-speed connectivity and we can easily use the NAS as if we use an external USB drive, just with higher performance." TBS-h574TX-i5-16G 2025-02-15 Product Review - Letem světem Applem (Czech) (2025/02/15) "QNAP TBS-h574TX-i5-16G is a beast for editors and productions. The QNAP TBS-h574TX is a compact, high-performance NAS with excellent features for creative professionals. The use of E1.S drives indicates future readiness, and even as M.2 drives become more prevalent, the EDSFF standard is gaining in importance. This makes the lifespan of this NAS drive really long, as the capacities offered for the E1.S format are likely to continue to increase. Thus, we can definitely recommend the QNAP TBS-h574TX to potential customers and users who want a single box to load all their recorded footage into, which they can bring home and start cutting right away. It does this job very well and looks great in an attractive, robust design. The E1.S support means greater longevity than M.2 drives while still supporting M.2 to keep costs and availability reasonable for today's use." QNAP TBS-h574TX Honored with Red Dot Award 2024 for Outstanding Product Design QNAP TBS-h574TX Honored with TechRadar Pro Picks Award for CES 2024 Available Models TBS-h574TX-i3-12G TBS-h574TX-i5-16G TBS-h574TX-i3-12G Intel® Core™ i3-1320PE 8C(4P+4E)/12T up to 4.50GHz, 12 GB on board (non-expandable) TBS-h574TX-i5-16G Intel® Core™ i5-1340PE 12C(4P+8E)/16T up to 4.50GHz, 16 GB on board (non-expandable) | SPECIAL OFFER | Get 1TB myQNAPcloud Storage cloud space free for 1 year Purchase and register a TBS-h574TX between December 1st 2023 – April 30th 2025 and get one year of myQNAPcloud Storage 1TB cloud storage space for free! More details All-flash NASbook supporting E1.S/M.2 NVMe SSDs – a perfect companion for video production Compared to large rackmount all-flash array storage, the TBS-h574TX all-flash NASbook features a compact, portable design with five SSD slots yet delivers extreme performance. It is the ideal choice to accelerate ongoing creative video projects from pre-production to post-production, and seamlessly works with USB DAS (TR-004) for file backup/archiving. The TBS-h574TX is always ready for your next project! An E1.S to M.2 SSD adapter is attached to each drive bay of the TBS-h574TX, providing great flexibility to choose between M.2 SSDs and E1.S SSDs on demand. M.2 NVMe SSD Supports M.2 2280 modules Smaller capacity but more available on the market More affordable and more vendor options; suited for diverse applications Faster than SATA SSDs HS-M2SSD-07 or TPAD-M2SSD-04 thermal kit (optional purchase) is recommended for maximizing the M.2 PCIe NVMe SSD cooling efficiency for stable data transfer EDSFF E1.S SSD Supports heights of 5.9mm / 9.5mm / 15mm Larger capacity but less common on the market Suited for high-intensity data transfer and is more future-proof Compared to M.2 SSDs, E1.S SSDs are hot-swappable and have higher heat dissipation efficiency Advanced power-loss protection (PLP) that prevents data loss HS-M2SSD-07 heatsink (optional purchase) is recommended for maximizing the cooling efficiency of 5.9mm E1.S SSD to ensure stable data transfer Maximize uptime with hot-swappable M.2 / E1.S SSD Frontline video production teams are sometimes at risk of project interruptions due to unexpected SSD failures in storage devices. The TBS-h574TX supports hot-swappable SSDs, along with conditional automatic RAID replacement with spares. If an SSD enters a critical state, the system automatically moves data from the affected drive to a spare in the RAID group, seamlessly integrating it into the existing RAID without the need for RAID rebuilding, significantly reducing the risk of data loss. Hot-swappable M.2 SSD: Agile innovationAn E1.S to M.2 adapter is attached in each slot, allowing M.2 SSDs to become hot-swappable. This enables replacing SSDs without downtime and enhances system maintenance flexibility.Hot-swappable E1.S SSD: Future-proof storageThe TBS-h574TX supports hot-swappable E1.S SSDs, providing reliable high-density data transfer and making it perfect for accommodating future storage needs. High-performance SSDs. Effective heat dissipation. Designed with an excellent cooling system, the TBS-h574TX is equipped with dual fans and supports SSD heatsinks (heatsinks sold separately) to effectively enhance heat dissipation during intensive workloads, allowing creators to confidently enjoy the ultimate performance of SSD. M.2 / E1.S SSD may overheat and suffer decreased performance during high-speed operations. It is recommended to purchase and install heatsinks on SSD controllers to enhance heat dissipation for stable high-speed transfer performance. Thunderbolt™ 4 direct connection to workstations for higher productivity The TBS-h574TX has two Thunderbolt™ 4 ports for high-speed data transfer (up to 20Gbps bandwidth). Mac® (including M1 and M2 chip models) or Windows® workstations can directly connect to the TBS-h574TX for fast and smooth real-time video editing, allowing for the transfer of a 1TB 4K video just in 11 minutes. Notes:• QNAP Thunderbolt NAS adopts Thunderbolt Networking for peer-to-peer connection, up to 20Gbps.• Mac® system requirement: macOS 13.5 (or later)• Connect the TBS-h574TX to your Mac® or Windows® PC with Thunderbolt™ 4 / Thunderbolt™ 3 cables and your connected devices with the Thunderbolt icon Transmission efficiency TBS-h574TX (1 x Direct connected client) Write MB/s Read MB/s TBS-h574TX (2 x Direct connected client) Write MB/s Read MB/s TBS-h574TX (1 x Direct connected client) Write MB/s Read MB/s TBS-h574TX (2 x Direct connected client) Write MB/s Read MB/s Tested in QNAP Labs. Figures may vary by environment.NAS：TBS-h574TX-i5-16G OS : QuTS hero h5.1.1Volume Type : Samsung 980 PRO 1TB x3 + 970 EVO Plus 1TB x2, RAID 5Client PC：PC 1 – MacBook Pro M2 Pro, Mac OS 13.5, 16GB RAMPC 2 – Mac Studio M1 Max, Mac OS 13.5, 32GB RAM Diverse I/O, greater possibilities. 2.5GbE and 10GbE ports | Productive teamwork The 2.5GbE and 10GbE ports can be used with a network switch to add more connected devices to the TBS-h574TX for collaboration, significantly reducing file transfer times across devices. USB 3.2 Gen 2 ports | Faster file import/export Creators and editors can easily import materials from external storage devices to the TBS-h574TX via two USB 3.2 Gen 2 (10Gbps) ports and one USB 2.0 port during pre-/post-production. USB ports | Easier storage expansion The TBS-h574TX capacity is scalable by connecting QNAP USB DAS TR-004 or USB JBOD TL-D800C to archive massive number of video files for ever-growing storage and backup needs. Compact, aesthetic, yet unmatched performance The TBS-h574TX provides content creators the perfect combination of stylish design and performance. With its metal-finish case, it delivers optimized cooling performance. The set-top design makes the TBS-h574TX space-saving – smaller than A4 paper and with only 2.54 liters in volume – ideal for small-scale studios or video production teams looking for a portable solution. Next-gen Intel® Core™ processors with hybrid architecture for multitasking potential The TBS-h574TX adopts the 13th Gen Intel® Core™ hybrid-architecture processor with P-core (Performance-core) and E-core (Efficient-core) performance. Multi-core and multi-thread advantages enable higher multitasking performance with lower CPU workloads and resource consumption, empowering creators with higher productivity. Processor Intel® Core™ i5-1340PE 12-core (4P+8E) and 16-thread processor, up to 4.5 GHz Learn more Memory Built-in 16GB DDR4 memory GPU Built-in Intel® Iris® Xe Graphics accelerate video processing and graphical computing Encryption Engine Features Intel® AES-NI 256 hardware-accelerated encryption to boost system performance while securing sensitive data Recommended video production scenarios Pre-production Post-production Remote collaboration Pre-production: Best video file management solution for DIT – raw footage on-site editing and powerful video transcoding DIT (Digital Imaging Technician) is the keyman to take responsibility of video file management on shooting site in a frontline video production team.DIT can quickly import large raw footage from camera SD cards to the TBS-h574TX through USB 3.2 Gen 2 (10Gbps) ports and proceed with video transcoding on the NASbook. In addition to saving RAW files, DIT can easily share small files with remote teams for instant discussion and confirmation, or save files to external hard drives or cloud storage.The TBS-h574TX comes with a built-in HDMI™ output, allowing on-site personnel to immediately play raw footage from the NASbook on a large screen. The team can also complete the rough cut on-site using Thunderbolt™ 4, significantly reducing the post-production team’s workload. Benefits for a pre-production team: Fast file import from SD cards to NASbook Store small files to myQNAPcloud Storage Remote access and sharing video files High-resolution video display using HDMI™ output Rough cut on-site using Thunderbolt™ 4 Post-production: Productive team collaboration NAS is way more collaborative than DAS. The TBS-h574TX provides Thunderbolt™ 4 and 10GbE connectivity that allow the post-production team to edit video files directly from the NASbook, without waiting for files to move from drive to drive, computer to computer.Once the post-production team finishes current video editing projects on the TBS-h574TX, they can save the final files to a USB DAS (such as TR-004) to free up the NASbook’s storage space for the next project! Benefits for a post-production team: Directly connect the NASbook to Mac® via Thunderbolt™ 4 Directly connect the NASbook to Windows® workstations through 10GbE and 2.5GbE connectivity File storage and backup by connecting a DAS through the high-speed UBS 3.2 Gen 2 ports Remote collaboration: Hot-swappable M.2 SSDs facilitate file sharing for collaboration and delivery Due to the difficulty of sharing large media files over networks, remote teams often resort to physically exchanging files by using external hard drives. Now the TBS-h574TX also offers a portable file exchanging/delivery solution.You can implement a TBS-h574TX for each of the remote work teams, configuring three M.2 SSDs in RAID 5, and the remaining two M.2 SSDs as single disk. The TBS-h574TX makes M.2 SSDs hot-swappable, allowing you to treat the two M.2 SSDs with single disk mode as portable external hard drives: simply remove SSDs from one NASbook and insert them to another NASbook for fast large-scale file transfer. Benefits for remote teamwork: Hot-swappable feature enables physically transferring large media files Pre-production Pre-production: Best video file management solution for DIT – raw footage on-site editing and powerful video transcoding DIT (Digital Imaging Technician) is the keyman to take responsibility of video file '''
