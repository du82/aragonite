["https://qnap.com/en-us/customer-stories/qgd-1602p_lomec-ingranaggi-srl"]
title = "Lomec Ingranaggi Srl | QNAP (US)"
description = "QTS is the operating system for entry- and mid-level QNAP NAS. WIth Linux and ext4, QTS enables reliable storage for everyone with versatile value-added features and apps, such as snapshots, Plex media servers, and easy access of your personal cloud."
full_description = "Lomec Ingranaggi Srl Lomec Ingranaggi Srl To detect potential threats in its intranet, the Bologna-based engineering company chose QNAP. Customer Lomec Ingranaggi Srl Industry General Enterprises Product QGD-1602P Tell us your challenge We chose QNAP's NDR ADRA because of their ability to discover potential threats that firewalls cannot detect. What's more, the “Honeypot” feature is great. It attracts attackers, identifies source IPs, and automatically blocks threats, alerting IT administrators in real time. - Daniele Sacchetti – IT manager, Lomec Ingranaggi S.r.l. Background Lomec Ingranaggi Srl, a metal engineering company based in Bologna since 1975, supplies automotive giants such as Stellantis, Iveco CNH, OMP, ZF and Bosch. With 90 employees and three 3,500 square foot plants, the company has strict quality and cybersecurity requirements. Regular customer audits ensure these standards are met, making cybersecurity a critical aspect of operations. Challenges Lomec Ingranaggi Srl operates a complex IT infrastructure, including a data center with 22 virtual machines, interconnected facilities, and a high-speed fiber optic network. Despite the adoption of enterprise-grade firewalls, anti-virus and Endpoint Detection and Reaction systems, there was no effective mechanism for detecting suspicious activity within the intranet, a significant risk especially with external users accessing the network via VPN or direct LAN connections. The challenge was to find a solution that seamlessly integrates with existing security measures while providing comprehensive threat detection. Solution To fill this gap, Lomec Ingranaggi Srl worked with MisterWeb to implement QNAP's ADRA NDR systems, which offer advanced Network Detection & Response (NDR) capabilities. Two ADRA NDR devices were installed: One in the main data center and the other in the warehouse data center. These devices were connected to key points in the network, including firewalls, Wi-Fi controllers, and video surveillance systems. ADRA NDR systems not only monitor LANs, WANs, and NAS, but also detect anomalies, isolate potential threats, and alert IT administrators in real time. Adding honeypot instances further increases security by attracting malicious users and neutralizing threats before they cause harm. Result The implementation of QNAP's ADRA NDR systems has significantly strengthened Lomec Ingranaggi Srl's cybersecurity. The company is now able to effectively detect and respond to potential threats, while keeping sensitive projects secure. ADRA NDR devices have seamlessly integrated with existing IT infrastructure, providing a solid layer of protection without disrupting operations. This enhanced security framework not only meets the rigorous standards required by Lomec's customers, but also gives the company peace of mind knowing that their network is constantly monitored and protected against evolving threats. Explore more from our customers All Customer stories IT Manager, Holland Mechanics China QNAP NAS exceeded our expectations. Its powerful performance and flexibility have transformed our IT operations, driving remarkable efficiency. ▶ ▶ Michal Jedlicka, Systems Architect QNAP family products are an integral part of our development infrastructure and allow us to respond flexibly to our needs. ▶ ▶ Ing. Errico Di Domenico – Operation Manager, Centrale del Latte di Salerno Through its LAN ports, QNAP ADRA NDR provides security for networked NAS by rapidly detecting ransomware and similar threats. ▶ ▶ Mutsuo Nakato, CEO of Marunaka Transportation We are amazed at the network risk visualization, rapid network isolation, and stable operation of QNAP’s low-cost ADRA NDR. ▶ ▶ All Customer stories"
