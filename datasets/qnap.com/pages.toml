["https://qnap.com/en-us/product/qgd-3014-16pt"]
title = "QGD-3014-16PT | Desktop Smart Edge PoE Switch<br>Cost-optimized intelligent IP surveillance solution | QNAP (US)"
description = "The QGD-3014-16PT Desktop Guardian PoE managed switch has sixteen 30-watt Gigabit PoE ports, two Gigabit SFP/RJ45 combo ports and two 2.5GbE host management ports. With a dual-processor design including an Intel® Celeron® J4125 quad-core 2.0GHz processor and four 3.5-inch SATA drive bays, the QGD-3014-16PT meets requirements for high-speed transmission, storage space, and virtual machine performance in surveillance applications. Supporting VMs and QTS for versatile applications such as QVR Pro, HBS 3 and QuWAN, the QGD-3014-16PT combines surveillance deployment, video storage computing, remote backup and WAN optimization to create intelligent surveillance infrastructure and remote backup solutions."
full_description = "QGD-3014-16PT Desktop Smart Edge PoE SwitchCost-optimized intelligent IP surveillance solution Watch Video QGD-3014-16PT Features Features Specification Accessories Compatibility Downloads Buy→ The QGD-3014-16PT Desktop Guardian PoE managed switch has sixteen 30-watt Gigabit PoE ports, two Gigabit SFP/RJ45 combo ports and two 2.5GbE host management ports. With a dual-processor design including an Intel® Celeron® J4125 quad-core 2.0GHz processor and four 3.5-inch SATA drive bays, the QGD-3014-16PT meets requirements for high-speed transmission, storage space, and virtual machine performance in surveillance applications. Supporting VMs and QTS for versatile applications such as QVR Pro, HBS 3 and QuWAN, the QGD-3014-16PT combines surveillance deployment, video storage computing, remote backup and WAN optimization to create intelligent surveillance infrastructure and remote backup solutions. PoE+Compliant with the IEEE 802.3at PoE+ standard and includes sixteen 30-watt Gigabit PoE ports. Supplies a total power budget of 140 watts to meet the demands of high-powered devices (PDs) and supports smart PoE management.Layer 2 networkProvides comprehensive Layer 2 management features, such as VLAN, LACP, QoS IGMP Snooping, and Wake-on-LAN for IT staff to efficiently control network bandwidth and enhance security via the user-friendly switch management web interface.Four SATA drive baysSupports up to four SATA SSDs or HDDs.4K HDMI™ outputSupports real-time transcoding and has HDMI™ 2.0 output for direct 4K 60Hz surveillance video playback. Data backup and recoverySupports local, remote and cloud backup; centralizes management; and strengthens 3-2-1 backup planning for disaster recovery.Mesh VPNDirectly host containers and virtual machines to run various applications. Flexibly install QuWAN SD-WAN, virtual routers, firewalls for various networking management applications. Next-Generation Intelligent IP Surveillance and Remote Backup Solution Modern enterprises need to deploy surveillance systems in various sites with multiple IP cameras, switches, NAS/NVR, and then transmit local data to central servers. This can often be a complicated, inefficient, and expensive process. The QGD-3014-16PT integrates PoE power capabilities, surveillance server, and data backup management, thus simplifying the software and hardware requirements and increasing the transmission and backup efficiency of surveillance videos. Complete Surveillance Infrastructure Deployment for Smart Retail Combining QVR Pro surveillance software, HBS remote backup, and QuWAN SD-WAN solutions, the QGD-3014-16PT is a total package for surveillance deployment. Businesses can centrally manage video capture, playback, and processing to benefit from a cost-optimized smart surveillance solution. PoE power: 15–30-watt Gigabit PoE capabilities to high-power IP cameras. Camera management: QUSBCam2 allows using USB cameras and webcams as ONVIF® cameras. Virtual network: Two 2.5GbE host management ports provide bandwidth for virtual networking. Storage backup: Install four 3.5-inch SATA drives to attain large storage space for backup. Surveillance server: QVR Pro is compatible with a wide range of ONVIF® IP cameras and allows central management of live feeds and recordings. Video output: Connect the QGD-3014-16PT via HDMI™ output to a 4K display for direct playback of security footage. Surveillance video: Simultaneously view live feeds and recordings via the QVR Pro Client Fiber uplink: 1GbE SFP/RJ45 combo port to connect to a backbone network or data center. Remote VPN: Supports the QuWAN SD-WAN encrypted VPN network for secure connection. Mobile monitoring: Universally access recordings and feeds with the QVR Pro Client mobile app. Central management: Use QVR Center to manage multiple instances of QVR Pro. Remote Backup: HBS 3 enables you to back up recordings and transfer data from one QGD-3014-16PT to a remote QGD-3014-16PT, QNAP NAS, remote server or cloud storage. Surveillance failover: QVR Guard automatically takes over recording tasks if a QVR Pro server fails. Minimalist design with 4K 60Hz HDMI™ output for fashionable retail space The QGD-3014-16PT has a modern design and quiet cooling system to balance system performance, and noise. This stylish appearance allows the QGD-3014-16PT to easily fit in with modern retail spaces and showrooms. The QGD-3014-16PT combines the functions of a PoE switch, NVR, NAS and router, and provides HDMI™ 2.0 output for direct playback of live feeds up to 4K (3840x2160) 60Hz resolution. By consolidating the functions of multiple devices in a near-silent and stylish form factor, the QGD-3014-16PT satisfies the requirements for smart retail surveillance environments. Intelligent PoE Management for High-Power IP Cameras Compliant with the IEEE 802.3at PoE+ standards, the QGD-3014-16PT has sixteen ports with 30-watt Gigabit PoE capabilities. The QGD-3014-16PT can supply a total power budget of 140 watts to meet the demands of bullet cameras, fisheye cameras, 4K PTZ cameras and Speed Dome cameras compliant with the ONVIF® standard; or high-power devices such as 4K PTZ camera, IP phones, LED lights, and digital signage. The QGD-3014-16PT supports intelligent PoE management functions, including scheduling, power supply prioritization, and power enabling/disabling. You can obtain real-time network connection status and power consumption information of PDs and configure PDs simultaneously to promote an energy-saving PoE network. A Total Smart IP Surveillance System with QVR Pro QVR Pro allows you to arrange a dedicated, independent storage space for surveillance data on the QGD-3014-16PT and leverage the advantages of scalable storage including four drive bays space and flexible storage expansion. With camera management, storage space allocation, playback, failover, and remote live viewing, QVR Pro helps you deploy a comprehensive smart IP surveillance system. Learn More: QVR Pro, QNAP mobile apps, Surveillance Station 5,000 + compatible IP cameras 8 free IP camera channels 16 maximum IP camera channels QUSBCam2 recording from USB webcams QVR Pro Manage cameras and recording space. QVR Pro Client Monitor footage and live feeds from different platforms. QVR Center Centrally manage multiple QVR Pros for a greater surveillance experience. QVR Guard The high-availability failover management app for QVR Pro. QUSBCam2 Use USB webcams as ONVIF® networked cameras. Integrated HBS 3 Remote Backup Solution for Surveillance Data HBS 3 consolidates backup, restoration and synchronization functions (via RTRR, Rsync, FTP, CIFS/SMB protocol) for easily transferring data from the QGD-3014-16PT to a remote QGD-3014-16PT, QNAP NAS, remote server, or cloud storage. Learn More: HBS 3 Deploy a Multi-site VPN with SD-WAN Solution QuWAN SD-WAN provides full mesh IPsec VPN topology between the QGD Switches and local/remote QNAP devices to fulfill enterprise surveillance video, system data transmission, and filing needs. QuWAN optimizes the network service by using bandwidth aggregation, QoS, and failover, providing a stable surveillance working environment. QuWAN also adopts software defined networking to achieve optimum surveillance network connectivity and supports cloud-centric management over multiple NAS for deploying a resilient IP surveillance infrastructure. Learn More: QuWAN QuWAN OrchestratorManage the network using a centralized management cloud platform.QuCPE ServerThe high-performance core VPN Server at the HQ. NASAdd branch offices to the VPN Infrastructure with your existing NAS.QGD SwitchFulfill surveillance and VoIP applications at small business sites (such as stores).QHora RouterProvides easy-to-use VPN functions for remote workers.QVPNMobile users can connect to SSL VPN using their PCs, laptops or mobile phones. The First PoE Switch Series with VM Support The QGD-3014-16PT supports QNAP’s QTS operating system and is the world’s first PoE switch series that supports hosting virtual machines, containers, and other cloud applications – enabling diverse networking and storage solutions. In addition to QuWAN, QVR Pro, HybridMount, and other applications. The QGD-3014-16PT not only provides an all-in-one networking solution for IP surveillance, storage expansion, network security, and wireless LAN management, but also a SD-WAN solution for connecting to other QNAP devices in multiple sites. The QGD-3014-16PT adopts a dual-processor structure, enabling independent operation of the networking management interfaces (QSS – QNAP Switch System) and QTS. By using the Network Virtual Switch, the data from QTS and QSS can be transferred by Intranet, accelerating computing between end devices and hosts. In addition, the QGD-3014-16PT provides a user-friendly web interface, QuNetSwitch, to help users deploy flexible and secure IT infrastructure. Learn More: QNAP QGD Switches Please note: QTS and QSS can work independently without interference to ensure continuous operation. For example, when restarting QTS, the QSS PoE power supply will not be interrupted. When rebooting QSS, the VMs on QTS will remain operational. QuNetSwitch: User-Friendly Layer 2 Management Software The QGD-3014-16PT provides complete functions of Layer 2 management (for example: VLAN, LACP, and LLDP). These can divide network IP traffic into several groups, providing more efficient network management. The QGD-3014-16PT provides powerful security features, including IGMP Snooping, Static MAC, QoS, and WoL. There is also an overview dashboard and graphical statistics analysis that displays all the information about the switch and PDs at a glance, simplifying the management of powered devices. Port Management VLAN Port Trunking QoS - Port status- Port statistics- Port configuration- Jumbo frame support- IEEE 802.3x flow control- Auto-negotiation of speed and duplex modes - VLAN configuration- Port-based private VLAN- IEEE 802.1Q-based VLAN - Port trunking- LACP groups - Bandwidth control- Traffic classification IGMP Security Management Advanced Applications - IGMP snooping v2/v3 - Access Control Lists (ACL): ACL by IP address, ACL by MAC- Static MAC address- Rate limits - Link Layer Discovery Protocol (LLDP): LLDP remote device- Interfaces: Web UI, Telnet, Command Line Interface (CLI)- SNTP, DNS, DHCP client entry - Port mirroring- Loop protection to avoid broadcast loops- Wake-on-LAN More VM applications x Virtual Router x Virtual Firewall = Enhanced Cybersecurity The QGD-3014-16PT can be transformed into a secure router with a firewall via virtual router and virtual firewall software by installing MikroTik RouterOS and OpenWrt. Flexibly configure routing functions and separate or protect local networks and apply multiple security policies. Learn More: Deploy MikroTik RouterOS router software with a QNAP NAS, Deploy pfSense, OpenWrt router software using Virtualize Station X Zabbix = Centralized Network Management Platform The QGD-3014-16PT supports Zabbix Network Monitoring Software that auto-detects connected SNMP-compliant servers/devices, and monitors network status. Zabbix provides a dashboard and analysis reports for efficient large-scale network management. FreePBX= IP PBX System The QGD-3014-16PT offers 15-30 watts PoE per port for SIP IP Conferencing Phones. You can also deploy a secure IP PBX phone system for multiple users by installing FreePBX software. Flexible Storage Expansion Connect a TR RAID, TL USB JBOD, or TL SATA JBOD to expand the storage capacity of the QGD-3014-16PT to accommodate data and business growth.The total number of TR and TL USB interface storage expansion devices cannot be more than 2. Learn More: Storage Expansion Compatibility Expansion units TL SATA JBOD TL USB JBOD TR RAID Connectivity PCIe (Multi-channel SATA 6Gbps) USB-C 3.2 Gen2 10Gbps TR-002: USB-C 3.2 Gen2 10Gbps TR-004: USB-C 3.2 Gen1 5GbpsTR-004U: USB-C 3.2 Gen1 5Gbps Number of bays 4: TL-D400S, TL-R400S8: TL-D800S12: TR-R1200S-RP16: TL-D1600S 8: TL-D800C12: TL-R1200C-RP 2: TR-0024: TR-004, TR-004U Supported OS QNAP QTS, Windows, Linux/Ubuntu QNAP QTS, Windows, macOS, Linux/Ubuntu QNAP QTS, Windows, macOS, Linux/Ubuntu Create QTS Storage pools Yes QTS operations such as disk scan Yes Yes Controlled by RAID disks H/W RAID Protection Depends on software RAID management Yes (RAID 0/1/5/10) RAID migration & capacity expansion Yes Yes No Max units supported by the QGD-3014-16PT 2 1* 2* * The total number of connected TR and TL USB expansion units cannot exceed two. People Also Viewed QGD-1600 The world’s first smart edge switch that runs QTS and supports hosting Virtual Machines (VMs), enabling versatile applications to satisfy all your networking needs. Learn More QGD-1602 Smart Edge Switch with 2.5GbE and 10GbE Capability Learn More CAYIN MediaSign Player Transform your NAS into a Media Player Learn More QSW-2104-2T-R2 4-port 2.5GbE and 2-port 10GbE Multi-Gig unmanaged switch. Affordably upgrade to high-speed networking. Learn More TS-h1277AFX High-performance all-flash NAS – Optimizing collaboration and productivity for creatives, with unmatched affordability. Learn More QGD-1600 The world’s first smart edge switch that runs QTS and supports hosting Virtual Machines (VMs), enabling versatile applications to satisfy all your networking needs. Learn More QGD-1602 Smart Edge Switch with 2.5GbE and 10GbE Capability Learn More CAYIN MediaSign Player Transform your NAS into a Media Player Learn More QSW-2104-2T-R2 4-port 2.5GbE and 2-port 10GbE Multi-Gig unmanaged switch. Affordably upgrade to high-speed networking. Learn More TS-h1277AFX High-performance all-flash NAS – Optimizing collaboration and productivity for creatives, with unmatched affordability. Learn More Optional Accessories Network Expansion Card RAM Other Accessories QXG-2G2T-I225 Dual port 2.5GbE 4-speed Network cardDimension (L × W × H): 8.13 × 6.89 × 2.52 (cm)Weight: 0.23 (kg) RAM-4GDR4A0-SO-2666 DDR type: DDR4(260PIN)Capacity: 4GBSpec: 512M