["https://qnap.com/en-us/customer-stories/pwsa_taiwan"]
title = "Prader-Willi Syndrome Association Taiwan (PWSA Taiwan) | QNAP (US)"
description = "QTS is the operating system for entry- and mid-level QNAP NAS. WIth Linux and ext4, QTS enables reliable storage for everyone with versatile value-added features and apps, such as snapshots, Plex media servers, and easy access of your personal cloud."
full_description = '''Prader-Willi Syndrome Association Taiwan (PWSA Taiwan) Prader-Willi Syndrome Association Taiwan (PWSA Taiwan) Uses QNAP QuWAN SD-WAN solution to achieve safe storage and convenient access of care data at branches across Taiwan. Customer Prader-Willi Syndrome Association Taiwan (PWSA Taiwan) Industry Nonprofit & Public Sectors Product QHora-301W TS-253D Tell us your challenge There are different challenges in caring for each PWSA patient. With the convenient service of QNAP QuWAN, social workers at various PWSA locations can quickly access care information securely to make the service process smoother. - Chairperson of the PWSA Taiwan – Dr. NI-CHUNG LEE Background In 2001, with the assistance of the Rare Diseases Foundation and several specialists, 25 families of patients with the rare disease Prader-Willi Syndrome met together to form the "Prader-Willi Syndrome Patient Friends.” As more and more families joined, members felt the challenges faced by families were becoming complex and burdensome. To provide more resources and further support families of patients, the "Prader-Willi Syndrome Association" was officially established in 2005. Over the past decade, the association has provided care, counseling, resource connections, and organized various supportive activities. Currently, it serves over 230 families of patients across Taiwan. Learn more: PWSA Taiwan The customer uses these solutions Backup, Restoration & Sync for NAS Use Hybrid Backup Sync to double up your protection by quickly backing up your NAS to remote and cloud storage spaces – ideal for building a complete 3-2-1 backup and recovery plan. Learn More QuWAN SD-WAN solution Supports Auto-Mesh IPsec VPN and Cloud management on QNAP devices for flexibly deploying and managing a new multi-site, multinational IT infrastructure. Learn More Backup, Restoration & Sync for NAS Use Hybrid Backup Sync to double up your protection by quickly backing up your NAS to remote and cloud storage spaces – ideal for building a complete 3-2-1 backup and recovery plan. Learn More QuWAN SD-WAN solution Supports Auto-Mesh IPsec VPN and Cloud management on QNAP devices for flexibly deploying and managing a new multi-site, multinational IT infrastructure. Learn More Challenges As of 2023, the association has three service locations across Taiwan, including the headquarters and three PWSA workshops in the north and south. PWSA workshops are tailored to the specific needs of Prader-Willi Syndrome in the form of professional development, therapeutic arrangement, and courses during weekdays. The aim is to assist patients in staying healthy, stabilizing emotions, learning appropriate interpersonal interaction through fixed schedule and structured service strategies, while also allowing parents to take a brief break. The service locations in the north and south are distant from each other. Daily service records, assessment reports, and other data are scattered across multiple computers in various locations. Additionally, frontline teachers are busy leading on-site courses and activities, making it difficult to centralize and return service data to the headquarters for storage and processing. When staff changes, it becomes a challenge to pass on valuable care experience and service data. In addition, while public cloud services are widely available, due to the sensitive nature of personal service data of patients, it is quite challenging to ensure secure access. Therefore, it is not the preferred choice from a data security perspective. Another option is the traditional point-to-point VPN, but it is complex to configure, and using it is relatively difficult for teachers without an IT background. Therefore, the association began to seek a cross-location file management approach that is both secure and easy to use. Solution QNAP provided PWSA Taiwan with the QHora-301W router together with the QuWAN intelligent network bandwidth optimization solution to achieve multi-location networking, centralized file storage management, and data sharing. QHora-301W supports advanced Wi-Fi 6 wireless technology and 10GbE wired network connections. Its most notable feature is the provision of enterprise-grade SD-WAN Mesh VPN. This enables association staff to rapidly deploy multi-location regional networks through the cloud and simplifies the complex configuration of VPN deployment. QuWAN Mesh VPN’s Automated Connection Configuration TechnologyQuWAN utilizes its advanced virtualization technology to automatically configure all external connections and significantly simplifies the setup process for Mesh VPN multi-location networking. Staff of the association only needs to bind the QHora-301W router to the QuWAN Orchestrator central management platform, and the system automatically completes the connection configuration for Mesh VPN. After binding QuWAN Orchestrator, the connections between all branches' devices will be as if they are in the same internal network, thus ensuring smoother and more secure data storage, transmission, and backup. Hybrid Backup SyncHybrid Backup Sync Hybrid Backup Sync is a license-free file backup, synchronization, and restoration solution provided by QNAP. It ensures that the association’s data can be securely backed up on QNAP NAS at the headquarters and branch locations. QNAP recommends scheduling automatic backup tasks for daily data backups. With the networking functionality of QuWAN Mesh VPN, remote backup becomes extremely simple. You just need to specify a NAS within the organizational network as the backup destination to easily complete off-site data backup. Result After adopting the QNAP QHora-301W and QuWAN solutions for a one-time multi-location network deployment, teachers in various PWSA locations can easily store service records in the shared NAS folder on their desktops and immediately complete the process of file consolidation, storage, and backup. The headquarters can also instantly share data with each branch. Now, social workers and teachers can focus more on serving patients. The consolidation of data at various locations not only allows the association, physicians, and parents to better understand the care needs of each patient, but also provides the association with more comprehensive data for continuous optimization and promotion of patient services. This creates a more supportive environment for patients and their families. Explore more from our customers All Customer stories João Gata – Director of Festival Mental I can say that QNAP is not just a piece of technological equipment, but an integral part of the Mental Festival's technical team. ▶ ▶ José Manuel Chacón, Down Madrid CDO Thanks to QuMagie's AI-powered intelligent photo management, we organize images efficiently and avoid time-consuming searching ▶ ▶ Polanów Town Hall Polanów's Town Hall Adopts TS-853U-RP to Accelerate Administrative Task Efficiency ▶ ▶ Fundación Acrescere Fundación Acrescere improve their working efficiency with QNAP TS-453B ▶ ▶ All Customer stories'''
