["https://qnap.com/en-us/product/qgd-1600"]
title = "QGD-1600 | The world’s first smart edge switch that runs QTS and supports hosting Virtual Machines (VMs), enabling versatile applications to satisfy all your networking needs. | QNAP (US)"
description = "QNAP’s QGD-1600 is the world’s first managed switch that supports Virtual Machines (VMs). It features multiple Gigabit ports for highly flexible networking environment deployment. With a dual-CPU design, the QGD-1600 provides both Layer 2 management functions for VM and QTS applications. The QGD-1600 also features Software-Defined Networking (SDN), enabling it to function as a NAS, NVR, router and firewall for IP surveillance, network security and storage expansion applications. Therefore, the QGD series offers SMBs a cost-optimized and centrally managed LAN deployment solution."
full_description = "QGD-1600 The world’s first smart edge switch that runs QTS and supports hosting Virtual Machines (VMs), enabling versatile applications to satisfy all your networking needs. Watch Video Slides QGD-1600 Use as Switch & NAS Use as ADRA NDR Use as Switch & NAS Specification Accessories Compatibility Downloads Buy→ QNAP’s QGD-1600 is the world’s first managed switch that supports Virtual Machines (VMs). It features multiple Gigabit ports for highly flexible networking environment deployment. With a dual-CPU design, the QGD-1600 provides both Layer 2 management functions for VM and QTS applications. The QGD-1600 also features Software-Defined Networking (SDN), enabling it to function as a NAS, NVR, router and firewall for IP surveillance, network security and storage expansion applications. Therefore, the QGD series offers SMBs a cost-optimized and centrally managed LAN deployment solution. Gigabit RJ45/SFP portsMultiple Gigabit and RJ45/SFP combo ports provide computers, LAN switches and NAS with higher bandwidth to empower applications like virtualization, 4K video editing and file sharing.Layer 2 networkQGD-1600 provides comprehensive Layer 2 management features, such as VLAN, LACP, QoS IGMP Snooping, and Wake-on-LAN for IT administrators to efficiently control the network bandwidth and enhance security via the user-friendly switch management web interface.User-friendly management interfaceQuNetSwitch offers a user-friendly web interface to help IT administrators efficiently control Layer 2 networks. Additionally, the overview dashboard and graphical statistics analysis show IT administrators all switch information and pored devices at a glance, making central management of network devices intuitive and easy.Two SATA drive baysSupports up to two SATA drives.Flexible PCIe expansionPCIe expandability allows for 10GbE network cards, QM2 dual-port M.2 SSD/10GbE cards, USB 3.1 Gen 2 (10Gbps) cards, or Wireless Adapters.Virtualization applicationsHost containerized applications and virtual machines with various operating systems. Flexibly install virtual router, firewall, or wireless LAN management software for various networking management applications. Available Models QGD-1600-8G QGD-1600-4G QGD-1600-8G 14 x Gigabit RJ45 ports, 2 x Gigabit RJ45/SFP combo ports; Intel® Celeron® J4115 quad-core 1.8 GHz processor (burst up to 2.5 GHz), 8 GB DDR4 RAM QGD-1600-4G 14 x Gigabit RJ45 ports, 2 x Gigabit RJ45/SFP combo ports; Intel® Celeron® J4115 quad-core 1.8 GHz processor (burst up to 2.5 GHz), 4 GB DDR4 RAM The First Switch with VM Support The Guardian series is the world’s first switch with the QTS operating system built in for VM, container, and other cloud applications, enabling diverse networking and storage solutions. In addition to QVR Pro, VJBOD, and other diverse storage applications, the QTS App Center also supports VMs for running many open-source software applications. Integrated with public cloud services, the QGD-1600 meets the needs of various applications in IP surveillance, storage expansion and network security. The QGD-1600 dual-CPU design enables you to run the networking management interfaces of QSS (QNAP Switch System) and QTS independently. The QGD-1600 offers a user-friendly web interface, QuNetSwitch, to help SMBs easily deploy a flexible and secure IT infrastructure. Learn More: QVR Pro, VJBOD, Virtualization Station, pfSense QTS and QSS can work independently without interfering each other to ensure continuous operation. For example, when restarting the QTS, the QSS connections will not be interrupted; when rebooting the QSS, the VMs on QTS will keep running. QuNetSwitch: Layer 2 Management with User-friendly Web GUI The QGD-1600 provides comprehensive Layer 2 management features (including VLAN, LACP, and LLDP) for efficient control of networks through IP grouping and bandwidth management. Powerful security functions (including IGMP Snooping, static MAC, QoS, and Wake-on-LAN) are also suitable for simple networking environments and easy deployment. Aside from the QNAP Switch System (QSS), the QGD-1600 also offers the user-friendly web interface software QuNetSwitch (via QTS) to help IT staff control Layer 2 management networks. The overview dashboard and statistical analysis area displays all the information about the switch and devices at a glance, making centralized management of network devices intuitive and easy. Port Management VLAN Port Trunking QoS - Port status- Port statistics- Port configuration- Jumbo frame support- IEEE 802.3x flow control- Auto-negotiation of speed and duplex modes - VLAN configuration- Port-based private VLAN- IEEE 802.1Q-based VLAN - Port trunking- LACP groups - Bandwidth control- Traffic classification IGMP Security Management Advanced Applications - IGMP snooping v2/v3 - Access Control Lists (ACL): ACL by IP address, ACL by MAC- Static MAC address- Rate limits - Link Layer Discovery Protocol (LLDP): LLDP remote device- interfaces: Web UI, Telnet, Command Line Interface (CLI)- SNTP, DNS, DHCP client entry - Port mirroring- Loop protection to avoid broadcast loops- Wake-on-LAN Deploy a multi-site VPN with SD-WAN solution The QGD-1600 and other QNAP solutions now support QuWAN – QNAP’s SD-WAN solution. QuWAN provides full mesh IPsec VPN topology between QNAP devices based in multiple sites to fulfill enterprise video, VoIP, ERP system data, and filing needs. QuWAN adopts software-defined networking to achieve optimum network connectivity, and supports cloud-centric management for deploying a resilient IT Infrastructure. Learn More: QuWAN QuWAN OrchestratorManage the network using a centralized management cloud platform.QuCPE ServerThe high-performance core VPN Server at the HQ.NASAdd branch offices to the VPN Infrastructure with your existing NAS.QGD SwitchFulfill surveillance and VoIP applications at small business sites (such as stores).QHora RouterProvides easy-to-use VPN functions for remote workers.QVPNMobile users can connect to SSL VPN using their PCs, laptops or mobile phones. The Guardian Smart Edge Switch meets your business needs. The QGD-1600 is a central networking solution that offers Web-based management, and innovative virtualization applications to solve various networking problems. Virtual Router x Virtual Firewall = Enhanced CybersecurityThe QGD-1600 can be transformed into a secure router with a firewall via virtual router and virtual firewall software by installing MikroTik RouterOS and OpenWrt. Flexibly configure routing functions and separate or protect local networks and apply multiple security policies. You can also easily manage all networking devices with Zabbix network management software.» Learn more: Deploy MikroTik RouterOS router software with a QNAP NAS, Deploy pfSense, RouterOS or OpenWrt router software using Virtualization Station Zabbix = Centralized Network Management PlatformThe QGD-1600 supports Zabbix Network Monitoring Software that auto-detects connected SNMP-compliant servers/devices, and monitors network status. Zabbix provides a Dashboard and Analysis Reports for efficient large-scale network management. People Also Viewed QGD-1602P Smart Edge PoE Switch with 2.5GbE and 10GbE Capability for the Wi-Fi 6 & SD-WAN Generation Learn More QGD-1602 Smart Edge Switch with 2.5GbE and 10GbE Capability Learn More TS-h1277AFX High-performance all-flash NAS – Optimizing collaboration and productivity for creatives, with unmatched affordability. Learn More QSW-2104-2T-R2 4-port 2.5GbE and 2-port 10GbE Multi-Gig unmanaged switch. Affordably upgrade to high-speed networking. Learn More QGD-3014-16PT Desktop Smart Edge PoE SwitchCost-optimized intelligent IP surveillance solution Learn More QGD-1602P Smart Edge PoE Switch with 2.5GbE and 10GbE Capability for the Wi-Fi 6 & SD-WAN Generation Learn More QGD-1602 Smart Edge Switch with 2.5GbE and 10GbE Capability Learn More TS-h1277AFX High-performance all-flash NAS – Optimizing collaboration and productivity for creatives, with unmatched affordability. Learn More QSW-2104-2T-R2 4-port 2.5GbE and 2-port 10GbE Multi-Gig unmanaged switch. Affordably upgrade to high-speed networking. Learn More QGD-3014-16PT Desktop Smart Edge PoE SwitchCost-optimized intelligent IP surveillance solution Learn More Optional Accessories Storage Expansion Card Network Expansion Card Other Accessories Interface Expansion RAM QM2-2P-344 (EOL) Dual M.2 PCIe SSD expansion card; supports up to two M.2 2280/22110 formfactor M.2 PCIe (Gen3 x4) SSDs; PCIe Gen3 x4 host interface; Low-profile bracket pre-loaded, Low-profile flat and Full-height are bundledDimension (L × W × H): 19.50 × 5.30 × 12.30 (cm)Weight: 0.30 (kg) QM2-2P-344A Dual M.2 PCIe SSD expansion card; M.2 2280/22110 PCIe NVMe(Gen 3x4) SSDs; PCIe Gen3x4 host interfaceDimension (L × W × H): 17.05 × 6.89 × 1.93 (cm)Weight: 0.30 (kg) QM2-2P-384 (EOL) Dual M.2 PCIe SSD expansion card; supports up to two M.2 2280/22110 formfactor M.2 PCIe (Gen3 x4) SSDs; PCIe Gen3 x8 host interface; Low-profile bracket pre-loaded, Low-profile flat and Full-height are bundledDimension (L × W × H): 19.50 × 5.30 × 12.30 (cm)Weight: 0.30 (kg) QM2-2P-384A Dual M.2 PCIe SSD expansion card; M.2 2280/22110 PCIe NVMe(Gen 3x4) SSDs; PCIe Gen3x8 host interfaceDimension (L × W × H): 17.05 × 6.89 × 1.93 (cm)Weight: 0.30 (kg) LAN-10G2T-X550 (EOL) QNAP Dual-port 10 Gigabit Network Expansion Card for rackmount and tower models (10GBASE-T interface)Dimension (L × W × H): 6.00 × 10.50 × 26.00 (cm)Weight: 0.42 (kg) QXG-10G1T Single-port (10Gbase-T) 10GbE network expansion card, PCIe Gen3 x4, Low-profile bracket pre-loaded, Low-profile flat and Full-height are bundledDimension (L × W × H): 14.30 × 19.30 × 5.20 (cm)Weight: 0.17 (kg) QXG-10G2T Dual-port 10GBASE-T 10Gb network expansion card; low-profile formfactor; PCIe Gen3 x4Dimension (L × W × H): 5.45 × 3.95 × 1.80 (cm)Weight: 0.29 (kg) QXG-2G1T-I225 Single port 2.5GbE 4-speed Network cardDimension (L × W × H): 6.73 × 6.89 × 2.52 (cm)Weight: 0.19 (kg) QXG-2G2T-I225 Dual port 2.5GbE 4-speed Network cardDimension (L × W × H): 8.13 × 6.89 × 2.52 (cm)Weight: 0.23 (kg) QNA-UC5G1T RAIL-B02 new rail kit for new 1U & 2U NAS: TVS-471U, 1253U, etcDimension (L × W × H): 73.80 × 10.00 × 7.00 (cm)Weight: 2.48 (kg) This rail kit is designed for racks with 25-inch mounting depth. You may need to reserve some space when installing and adjusting the rail kit for racks with 18-inch mounting depth. For installation details, click https://qnap.to/rail-b02. QXP-10G2U3A Dual-port USB 3.2 Gen 2 10Gbps Type-A PCIe Gen 3 x2 Card, Asmedia ASM3142Dimension (L × W × H): 8.96 × 6.89 × 1.40 (cm)Weight: 0.09 (kg) RAM-4GDR4A0-SO-2666 DDR type: DDR4(260PIN)Capacity: 4GBSpec: 512M X 16Frequency: DDR4-2666Form(PIN): 260PINPower Supply: 1.2VDram Organization: 512M*64Temperature: 0℃~85℃Environmental Regulation: RoHS"
