["https://qnap.com/en-us/product/es2486dc"]
title = "ES2486dc | Powerful and cost-efficient Intel® Xeon® D based Enterprise ZFS NAS, optimized for inline deduplication and all-flash applications | QNAP (US)"
description = "The ES2486dc Enterprise ZFS NAS is QNAP’s first high-availability NAS with all-flash arrays and dual active controllers. Powered by an Intel® Xeon® D-2142IT 8 cores/16 threads processor, the ES2486dc supports up to 24 x 2.5-inch SAS 12Gbps SSDs and provides excellent I/O throughputs. Random write performance for all-flash arrays is further driven by the flash-optimized QES 2.1.1 operating system that comes pre-installed on the ES2486dc. The QES uses ZFS to support logical volume management; block-based inline data deduplication and inline compression reduce I/O and SSD storage consumption, which significantly extends SSD lifespan with higher price-performance ratio for all-flash storage arrays. Coupled with near-limitless snapshots and SnapSync for data protection, the QES-based ES2486dc fulfills demanding business applications, such as mission-critical file servers, virtualization servers, VDI, medium-sized data center, video streaming, surveillance storage, and efficient file backup and recovery."
full_description = "ES2486dc Powerful and cost-efficient Intel® Xeon® D based Enterprise ZFS NAS, optimized for inline deduplication and all-flash applications Watch Video Slides Calculator ES2486dc Features Features Specification Expansion Accessories Compatibility Downloads Buy→ The ES2486dc Enterprise ZFS NAS is QNAP’s first high-availability NAS with all-flash arrays and dual active controllers. Powered by an Intel® Xeon® D-2142IT 8 cores/16 threads processor, the ES2486dc supports up to 24 x 2.5-inch SAS 12Gbps SSDs and provides excellent I/O throughputs. Random write performance for all-flash arrays is further driven by the flash-optimized QES 2.1.1 operating system that comes pre-installed on the ES2486dc. The QES uses ZFS to support logical volume management; block-based inline data deduplication and inline compression reduce I/O and SSD storage consumption, which significantly extends SSD lifespan with higher price-performance ratio for all-flash storage arrays. Coupled with near-limitless snapshots and SnapSync for data protection, the QES-based ES2486dc fulfills demanding business applications, such as mission-critical file servers, virtualization servers, VDI, medium-sized data center, video streaming, surveillance storage, and efficient file backup and recovery. Dual active-active controllersIntel® Xeon® D dual active-active controllers provide superb uptime and redundancy to ensure high availability (HA).Reliable & High-performanceBattery-protected DRAM write to cache data protection and flash read acceleration provides industry-leading random access performance.Flexible PCIe expansionPCIe expandability allows for 10GbE/25GbE adapters to increase application performance.10GbE connectivityFour 10GbE SFP+ ports accelerate large file sharing and intensive data transfer from virtualization or datacenter.Data protection & recoveryNear-limitless snapshots and SnapSync for snapshot remote backup assist businesses to resume essential services in the shortest time.Virtualization applicationsSupports VMware® vSphere® 6.5, Windows Server® 2019 and Citrix® XenServer® 7.0 for storage virtualization. Compatible with OpenStack® cloud environments. Available Models ES2486dc-2142IT-96G (Legacy) ES2486dc-2142IT-128G (Legacy) ES2486dc-2142IT-96G (Legacy) Intel® Xeon® D-2142IT 8-core 1.90 GHz processor, up to 3.0 GHz, 48 GB RDIMM DDR4 ECC (4 x 4 GB+4 x 8GB) per controller ES2486dc-2142IT-128G (Legacy) Intel® Xeon® D-2142IT 8-core 1.90 GHz processor, up to 3.0 GHz, 64 GB RDIMM DDR4 ECC (4 x 16 GB) per controller Active-Active high availability with optimal storage efficiency In Active-Active storage system architecture, both controllers can provide a comprehensive range of services, which is different from the Active-Standby architecture of single-controller systems. An advantage of Active-Active architecture is the lack of idle computing resources. To leverage the strengths of the ES2486dc Active-Active controller architecture, QNAP recommends creating multiple storage pools and distributing ownership between both controllers to enable simultaneous output from both controllers for improved load balancing. Active-Standby single-controller system With two HA systems you are paying twice the price, and the HA system can cause load imbalances because workloads are only processed on the active system. Moreover, a power outage can cause data loss, while network disconnections will invalidate the HA architecture. Active-Active dual-controller system Both controllers of the ES2486dc can carry traffic, along with Copy-To-Flash protection against power failure and the dual-path SAS interface design. Besides conserving computing resources, a high-speed, uninterrupted, and high-availability storage service is also provided through communication protocols such as SMB, NFS and iSCSI. Intel® Xeon® D dual controllers optimize inline deduplication and SSD workloads Powered by Intel® Xeon® D-2142IT 8 cores/16 threads processors, the ES2486dc delivers massive computing power to maximize inline data deduplication and inline compaction performance. The dual active-active controller architecture provides failover/failback operations since the standby controller can quickly take over if one controller breaks down. Redundant hot-swappable power supplies and cooling fans also provide businesses with near-zero downtime and high availability. The ES2486dc connects to the JBOD enclosure (EJ1600 v2) through dual-path mini-SAS design and can sustain continuous operations even if a JBOD cable is disconnected. 1M Sequential Read/Write Read 12473 MB/s Write 4923 MB/s 4K Random Read/Write Read 565124 IOPS* Write 144195 IOPS *Use 2 LUNs Tested in QNAP Labs. Figures may vary by environment.Test Environment:NAS: ES2486dcFW: QES 2.2.0CPU: Intel(R) Xeon(R) D-2142IT 1.90GHz (8C/16T)SSD: Seagate 1.92TB SAS SSD XS1920SE7000 *24RAM: 48 GB per controllerFC: QNAP QNA-32G2FC*1 per controllerServers:2 ServersCPU: Intel Xeon E-2124 3.30GHz (4C/4T)OS: Windows Server 2016RAM: 64 GB, 16GB*4FC: Qlogic Fibre Channel Expansion Card Multi-level cache technology with read and write support boosts storage performance The ES2486dc simultaneously supports read caches including primary cache (L1 ARC), SSD cache as a secondary cache (L2 ARC), and write cache ZFS Intent Log (ZIL) for synchronous transactions to meet performance demands for various enterprise applications. Up to 512 GB main memory NVRAM cache reduces the risk of losing write cache data SSD cache Each controller has eight RDIMM slots, allowing up to 512 GB memory.Note: The main memory will retain 8 GB through the ZIL cache. If a sudden power outage occurs, the system can write cache data from the battery-protected DRAM to M.2 SSD through Copy To Flash (C2F) to ensure data security.Note: To ensure write cache data security, QNAP recommends replacing BBU annually. QNAP provides a one-year warranty for the BBU. Configure SSDs for SSD caching to increase IOPS performance and reducing latency for storage volume. Use SAS or SATA SSDs flexibly within your IT budget Although SATA 6Gbps SSDs provide high-performance affordable storage, this type of drive is unsuitable for dual-controller environments because it lacks dual-port support. By using a QDA-SA3 adapter specially designed for QNAP all-flash Enterprise ZFS NAS, a SATA 6Gbps drive can be used in the 2.5-inch SAS drive bay of the ES2486dc— allowing storage capacity expansions with cost-effective SATA drives. By installing a SATA SSD with the QDA-SA3 into the dual-controller ES2486dc, the SATA SSD can share SAS dual-port advantages to ensure a high-availability and fault-tolerant enterprise storage environment. Learn More: QDA-SA3 drive adapter PCIe expansion for 25GbE high-speed networks The ES2486dc provides two PCIe Gen 3.0 x8 slots connected to the CPU, allowing you to install lightning-fast 10GbE/25GbE network cards to boost virtualization, media streaming, and other bandwidth-demanding applications. Installing a Smart NIC that supports iSER can improve VMware® virtualization performance. You can also install a SAS expansion card ( SAS-12G2E ) for connecting up to seven 16-bay EJ1600 v2 expansion enclosures to seamlessly expand potential storage capacity to over 1PB, with unprecedented performance of up to 48 Gbps per host connection. Learn More: Network expansion cards, iSER, Storage expansion compatibility Dual controller NAS: High performance, high reliability, and high availability The ES2486dc adopts dual active-active controllers to provide reliable mission-critical business applications in IT storage. ES2486dc 1 2 3 4 5 6 7 8 3x hot-swappable system fans The fans rotation speed will automatically adjust to the NAS temperature. Intel® Xeon® D-2142IT processor Intel® Xeon® D-2142IT 8 cores/16 threads 1.9 GHz processor (burst up to 3.0 GHz) supporting DDR4 memory and PCI Express 3.0. DDR4 2133 MHz ECC memory Quad-channel DDR4 ECC memory with 8 RDIMM slots providing up to 512 GB memory per controller. 2x PCIe Gen 3.0 x8 slots Supports 10GbE/25GbE network cards or SAS expansion cards for greater application potential. 4x 10GbE SFP+ ports Ideal for running bandwidth-demanding applications, such as virtualization and fast data backup or restoration. Battery Backup Unit (BBU) If a sudden power outage occurs, the BBU enables write to cache data protection, while simultaneously replicating data to a backup controller to achieve 100% data integrity. 3x Gigabit Ethernet ports Supports Service Binding, Port Trunking, and MPIO. One Gigabit LAN port is dedicated to remote management. 700W power supply Power units are hot-swappable and the redundant power supply units in one chassis ensure continuous system uptime. QES 2.1.1: ZFS-based, and optimized for all flash performance The ES2486dc features the QES (QNAP Enterprise Storage) 2.1.1 operating system which is based on the simple and efficient FreeBSD kernel and ZFS file system for high-end enterprise applications. QES 2.1.1 not only provides reliable data protection, recovery, and business-class features, it is also optimized for flash storage to drive outstanding performance of all-flash storage arrays, accelerating mission-critical services and eliminate challenges in VDI environments. QES 2.1.1 also comes with Quality of Service (QoS) capabilities to ensure consistent primary storage performance in multi-application environments. The flash-optimized QES 2.1.1 continues the same user experience as the intuitive QTS, thus easy to learn for enterprise users and can be quickly implemented into existing IT infrastructures. Learn More: QES operating system QES and QTS comparison OS Kernel FreeBSD Linux File system ZFS Ext4 SMB/FTP/NFS/iSCSI End-to-end data integrity Snapshot upper limit 65536 1024 Remote disaster backup and recovery SnapSync Snapshot Replica Inline data deduplication Deduplicate backup data at the source(HBS 3) Inline data compression Inline data compaction Application consistency Snapshot AgentVSS Hardware Provider(QNAP NetBak Replicator) Snapshot AgentVSS Hardware Provider(QNAP NetBak Replicator) Qtier (Auto Tiering) App Center Application services(Virtualization Station, Web Server, multimedia services, etc.) Application scenarios • Reliable storage for mission-critical business tasks.• The perfect backup storage for dual-controller Enterprise ZFS NAS. • High-performance storage with SSD and Qtier technology for maximized cost-efficiency.• Storage for hosting virtual machines and containerized applications.• Application server using QTS services (Web server, VPN server, FTP server, etc). Unleashed SSD potential – cost-effective and agile with ultimate performance QES 2.1.1 features QNAP’s exclusive Write Coalescing algorithm that further optimizes all-flash performance in ZFS, providing a highly cost-effective all-flash solution for enterprise-class data management and mission-critical services. Learn More: QNAP all-flash solution Write Coalescing Algorithm Transforms all random writes to sequential writes along with reduced I/O. Not only does it effectively increase random write performance for all-flash environments, but also improves SSD lifespan. Software-Defined Over-Provisioning Users can allocate an additional over-provisioning ratio for SSDs (from 1% to 60%) and Storage Pools (from 1% to 40%) for a constant performance boost over 100%. Deduplication and compression optimizes storage usage for virtualization The QES-powered ES2486dc provides businesses with the most cost-effective remote virtual desktop platform and mission-critical information warehousing. Inline data deduplication Block-based data deduplication optimizes storage usage and significantly decreases storage capacity requirements. Inline compression Shrinks data size to reduce storage I/O workloads for improved performance. In VDI, deduplicated virtual desktops are easily cached to achieve optimal virtual desktop performance. Inline compaction Especially helpful for increasing SSD storage utilization efficiency when highly-repetitive data or massive small files (e.g. bank or e-commerce transaction logs) are generated. Delivers higher cost efficiency for all-flash storage systems. Self-Healing ensures data integrity and reliability Designed with a focus on data integrity, the QES-based ES2486dc uses its end-to-end checksums to detect and correct silent data corruption caused by hardware defects, firmware bugs or metadata errors. If data integrity violations are detected, QES automatically repairs the data with data from the other mirror before passing it to applications. Streamlined remote backups with nearly limitless snapshots and SnapSync The ES2486dc supports up to 65,536 snapshots for iSCSI LUN and shared folders. In other words, if one snapshot is created every hour, and 24 snapshots are created per day, you can create up to 7 years’ worth of snapshots without having to delete any! The ES2486dc also replicates snapshots to remote servers through block-level SnapSync. In the event of a primary site failure, SnapSync assists businesses to resume essential services in the shortest possible time. Business Continuity Copy-on-write technology enables instant QES snapshot creation without affecting ongoing data writing. SnapSync supports incremental backups, real-time deduplication, and compression. The source ES2486dc will perform deduplication before compressing the metadata to reduce synchronized data and save bandwidth resources. VMware SRM SnapSync supports VMware Site Recovery Manager (SRM), which offers enterprise-class remote backup and disaster recovery solutions for virtual applications. With the Storage Replication Adapter (SRA) for SRM, operation overheads of the ESXi® server can be offloaded to a QNAP NAS to accelerate and simplify virtual machine backup and restoration. Create VMware/Windows backups for VSS-Aware applications using QNAP Snapshot Agent QNAP NetBak Replicator is easy-to-use with VSS-aware backup software, helping businesses to create complete backups in data centers and virtualization environments without requiring additional software. To build a QNAP Snap Agent and VSS Hardware Provider operating environment, all applications (including VSS Service, Requestor, Provider and QNAP Snap Agent) can be deployed with VSS-Aware applications on the same server, and the minimal requirements are only one ES2486dc and one server for it to be operational. Learn More: QNAP Snapshot Agent, Tutorial Compatible with VMware, Microsoft, and Citrix virtualization, and supports iSER The ES2486dc supports VMware® vSphere® 6.5, Windows Server® 2019, and Citrix XenServer® 7.0 for flexible deployment and management in virtualization environments. It also supports VMware® VAAI and Microsoft® ODX to increase performance by offloading server loading for ESXi® server and Hyper-V® respectively. The QNAP vSphere Client plug-in and Web plug-in are also supported to increase operations and management efficiency in virtualization applications. The ES2486dc"
