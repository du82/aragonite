eir prompt response always amazes me. We look forward to growing our NAS business with QNAP in the new year and beyond!" - John Wu President of King Star Computer "I have worked with QNAP for 10+ years. I primary use their QVR-Pro surveillance software with larger rack mount hardware running 100+ cameras at each site. The professional Tech Support and Sales Team is ALWAYS more than you expect." - Chip Watchek President of Convergent Waves, Inc. Join the Winning Team Become a partner today and let us help you grow. Got Questions? Apply Now (US) Apply Now (Canada) Join Webinars Stay informed on the latest QNAP innovations, and talk to us! I’m interested Online Resources QNAP Marketing Resource QNAP College (Video Tutorials) QNAP Compatibility QNAP Download Center QNAP Customer Service'
