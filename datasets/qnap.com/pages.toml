description = "QTS is the operating system for entry- and mid-level QNAP NAS. WIth Linux and ext4, QTS enables reliable storage for everyone with versatile value-added features and apps, such as snapshots, Plex media servers, and easy access of your personal cloud."
full_description = "LCO (Le Cliniche Odontoiatriche) LCO (Le Cliniche Odontoiatriche) A Faster and More Secure Network for LCO with QNAP's SD-WAN Solution. Customer LCO (Le Cliniche Odontoiatriche) Industry Healthcare Product QHora-301W Tell us your challenge QNAP's SD-WAN solution has made our network more resilient, efficient, and secure, enabling us to optimize costs and enhance the productivity of our clinics. - Maria Serena Romiti, CEO of LCO – Le Cliniche Odontoiatriche Background LCO – Le Cliniche Odontoiatriche (The Dental Clinics) is a growing healthcare organization with four locations in Lazio and Lombardy, Italy. With 87 qualified professionals, it manages over 80,000 patients annually, offering services in dentistry, aesthetic medicine, ophthalmology, and orthopedics. To support efficient growth, LCO required a technologically advanced network. Challenges LCO faced inefficient management of its existing MPLS network: high costs, limited flexibility, and insufficient performance for its activity volume. The absence of an internal IT department and the use of critical software like XDENT and Zucchetti made a reliable, easy-to-manage solution essential. The network also needed to securely and rapidly support data sharing between locations. Solution In collaboration with its partner BraianTech Srl, QNAP implemented an SD-WAN solution based on QHora routers. The main office was equipped with the QHora-321 router, while the other locations used QHora-301W routers. The MPLS connectivity was replaced with high-performance FTTH fiber. Existing QNAP NAS devices, already used for Windows server virtualization and data backup, were integrated into the new SD-WAN infrastructure. QNAP's solution delivered centralized management, enhanced security with snapshots and backups, and a high-speed network with zero downtime during deployment. Result The new SD-WAN infrastructure significantly improved network performance while reducing operational costs by 40%. The speed and stability of the connectivity boosted productivity for medical and administrative staff, improving data exchange and appointment management. QNAP's solution simplified IT management, eliminating expensive third-party appliances and hardware firewalls. With the new network in place, LCO plans to undertake full digitalization projects, aiming for paperless operations and automated patient contact procedures within the next 12–24 months. Explore more from our customers All Customer stories The case of Professor Nagasaki and Professor Kawaguchi of Center for Genomic Medicine, Kyoto University Graduate School of Medicine High-performance TS-2483XU-RP accelerates and streamlines genome data analysis. ▶ ▶ Institute of Molecular Immunology and Experimental Oncology Discover how the TS-1685 and TS-453BT3 provide comprehensive file storage solutions for state-of-the-art medical research. ▶ ▶ All Customer stories"
