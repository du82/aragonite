title = "Mobile App | QNAP (US)"
description = "QTS is the operating system for entry- and mid-level QNAP NAS. WIth Linux and ext4, QTS enables reliable storage for everyone with versatile value-added features and apps, such as snapshots, Plex media servers, and easy access of your personal cloud."
full_description = '''Mobile App QNAP offers a wide range of mobile apps for NAS management, multimedia, surveillance, and download management, providing you with a hands-on way to control your NAS wherever you are. Mobile App Productivity Entertainment Surveillance Networking Qfile Pro Qfile Pro is a must-have mobile app for accessing NAS files from your mobile devices. It’s also the best app to back up mobile photos, videos, and documents to your NAS. Qfile Pro adds integration with Qsync Pro to make your user experience even better! Recently processed files Display files that have been recently accessed and deleted, allowing you to quickly find desired files. Auto upload Automatically upload your mobile photos/videos to the NAS. Browse your folders Conveniently browse all NAS folders, including folders from local NAS, remote NAS/servers, or cloud storage. Access myQNAPcloud Storage Access files stored in QNAP-hosted cloud “myQNAPcloud Storage” . File sharing Check your Sharing Links and Team Folder. Background task Lists current task progress, such as auto uploads, synchronization, and more. Storage and Cache Check your current storage and cache usage. Qsync feature Sync NAS folders between your mobile devices and NAS. QNAP Authenticator Add an extra layer of security to your user accounts. QNAP Authenticator provides multiple login options to keep your NAS accounts safe from unauthorized access. Pair multiple NAS accounts Add NAS accounts and use various login methods with an extra layer of security. Get security code with TOTP Make login safer and more secure with two-step verification using TOTP (time-based one-time password). Log In with a QR code Forgot password? Don’t worry. Conveniently scan the QR code with the QNAP Authenticator app QR code reader, approve the sign-in request, then log in to your NAS. Support TOTP-compliant platforms Quickly check all the bindings including QNAP NAS and other TOTP-compliant platforms, apps, and web accounts. Each account periodically generates a real-time security code. List of paired NAS accounts Easily check all the QNAP NAS accounts paired with your device. Unlock your app with biometric login Login to QNAP Authenticator app with Face ID or Touch ID. Biometric authentication provides speedy and convenient access. Advanced information Quickly start QNAP Authenticator with instructions and FAQ. Qmanager Ever wanted to monitor and manage your Turbo NAS with your iOS® or Android™ mobile device? The Qmanager app makes it easy. Manage multiple Turbo NAS units Add multiple Turbo NAS units on Qmanager, and conveniently manage anyone of them, anytime and anywhere. Monitor system status Monitor your system information, such as CPU usage, memory usage, system event info, online users, etc. Shutdown/restart remotely Restart or shutdown your Turbo NAS remotely. Monitor connection status Check connection status or logged in users remotely, to prevent invasion. Manage system services Easily turn on/off application services of the Turbo NAS via Qmanager. It only takes one click! Manage download/backup tasks Check the Download Station or backup task info. You can also pause or run the download or backup tasks remotely. Identify the NAS Use "Find My NAS" to turn on the NAS "Beep" sound to easily identify its location. Qsync Pro Qsync Pro synchronizes data and folders between your mobile devices and NAS, allowing you to access data on your NAS anytime anywhere. System Requirements: QNAP NAS running QTS 4.3.4 (or later) and Qsync Central. Mobile devices running Android 7.0/iOS 11 (or later). Note (Android): If your QNAP NAS is incompatible with QTS 4.3.4 (or later), you must use Qsync 2.0.9. Please note that this version of Qsync has been discontinued and will not receive any further updates after December 2020. View All Connection Statuses at a Glance You can view all your mobile devices and NAS connection statuses information on the Qsync Pro Overview page. The page displays the following information: sync status, device data, NAS user account, connection information, paired folders, and storage usage data. Flexibly Pair Folders Flexibly pair folders on your mobile devices and NAS on the QSync Pro Manage Paired Folders page to synchronize data for paired folders. Set Qsync Device Quota Set a Qsync quota on your mobile device to prevent synchronized data from consuming excessive phone storage space. Manage Your Team Folders Share and modify team folders with Qsync Pro for more efficient collaboration. Upload Photos to Your NAS Easily synchronize photos from your phone or cloud storages to the NAS on Qsync Pro My Device page. Only Auto-Sync Charging Devices or Those with Wi-Fi Connection Use automatic synchronization settings to save your device’s battery life and data usage by limiting syncing to charging mobile devices or only when connected to the Wi-Fi. View File Synchronization Status You can view successfully synced or edited files in File Update Center and check ongoing or incomplete tasks in Background Task. Synchronize Specific File Type Exclude specific file formats from synchronization on the Filter Settings Page. Qsirch Instantly find files with Qsirch Search Multiple NAS at One Time Search for files on a single NAS or across multiple NAS at the same time. Search While You Type Simply choose categories, enter keywords, and matching files will be immediately displayed. Search by Category Filter search results by selecting categories to quickly find desired files. Comprehensive Search Find files from over 6,000 formats by searching for filenames, metadata (title, author, EXIF, IPTC, XMP, and more) and by using over 30 search conditions (including content, date modified, and file path). Visible Search Results Display search results by thumbnail to preview content or by list for more detailed information. Preview, Download and Share Immediately preview, download and share files after finding them. Offline Search Find your offline files in other QNAP Apps (including Qfile, Qphoto, Qmusic and Qvideo). Note: Only available for Android versions. KoiMeeter Conveniently make video calls from your mobile phone or join a KoiBox video conference. Easily view presentations on your phone and share your mobile phone screen. System requirements: iOS 12.1 (or later); Android 6.0 (or later) Dial pad Enter a KoiCode to start video calls with others or to join in-progress KoiBox meetings. Remote view and share mobile phone screens Tap “Insight View” to remotely view the presentation on your phone. You can also share your mobile phone screen. Instant QR code Quickly share your contacts with a QR code. Add contacts Use QR codes or a KoiCode to add contacts. Contact list Get an overview of your contact list, including contact information and KoiBox devices. Qnotes3 Share your inspirations with a convenient note-taking tool for mobile devices. Brand-new user interface Get started with an intuitive and user-friendly interface. Synchronization and offline editing Instantly sync with Notes Station 3 on your NAS. Create or edit notes even when you're not connected to your NAS. Add tags Easily manage and search for notes by using tags. Team Collaboration Improve your team's productivity and efficiency with collaborative note-taking. Share notes and manage shared list Share your notes with others and easily manage your shared list. Audiovisual notes Create notes from audio or photos to ensure no details are lost. QmailClient Quickly check & manage multiple email accounts anytime and anywhere Instantly switch multiple email accounts Switch between multiple email accounts in QmailClient to check your latest emails, and quickly find desired emails using search criteria (such as sender, receiver or subject). Easily manage your Inbox Managing your emails is easy with familiar touchscreen controls. Just swipe the screen to archive/delete emails, add tags, or mark emails as read/unread. Send emails and attachments directly from your NAS or cloud accounts Use File Station to browse saved emails and to quickly send content stored on your NAS and connected cloud services. Send emails with large attachments Use "SmartShare" to avoid attachment size limits by sending links to files (on your NAS or Google Drive account) instead of attaching the files themselves. Easy to use Use familiar touchscreen controls to read, write, reply, and forward emails. Push Notifications Instantly receive real-time push notifications on your mobile devices when new emails arrive and if connection errors occur. QuMagie Mobile QuMagie Mobile allows you to view photos in the NAS on mobile devices anytime and anywhere. View photos anytime and anywhere Simply connect to the Internet to view all your photos in QuMagie anytime and anywhere. Group and manage photos in different albums Manage photos with QuMagie’s in-built AI image recognition technology. The QuMagie AI image recognition technology can detect people, objects, and locations. Similar photos are then categorized into the following three albums: People, Things, and Places. View people photos in specified album QuMagie Core AI technology features facial recognition. You can view photos related to people in the QuMagie album People on mobile devices. View things photos in specified album QuMagie Core intelligent AI technology enables subject identification. You can view photos related to objects in the QuMagie album Things on mobile devices. Find photos faster Powerful search filters allow you to quickly find photos through customized tags, people, dates, and titles. Automatically upload photos You can automatically back up mobile photos and videos to your NAS by enabling "Auto upload". Files can also be organized with fast filtering by file types. Qmusic Ever wanted to stream and enjoy the music stored on your Turbo NAS with iOS® and Android™ mobile device? The free Qmusic app allows you to listen to your terabytes of music collection on the Turbo NAS anytime and anywhere. Play music on demand Easily connect to the Turbo NAS and play the music collection with simple operations. It’s 1-2-3 to have a mobile music box! Browse music library flexibly Browse music collection on the Turbo NAS by song, singer, album, or folder. Play music offline Click the “Download” button to instantly download the music on the Turbo NAS to your mobile device for offline listening. The music never stops even when the Internet is not available. Enjoy music with one click 4 ways to play the music immediately: Random song, Random playlist, My favorite, and Recently added. Edit playlists online You can easily create playlists, edit the playlist contents, or add the songs in the “Now playing ” list to the playlist. Music searching Search songs by title, album, or artist to find the right tracks for your mood. * Currently available for Android. Qvideo The free Qvideo app allows you to enjoy and share the video collection stored on your Turbo NAS from mobile devices anytime and anywhere. Enjoy videos on demand Watch any of the videos stored on your Turbo NAS using mobile devices at anytime, anywhere. Stream videos via Chromecast Stream videos stored on the Turbo NAS directly on TV via Chromecast device. Video browsing Browse your video collection using a timeline view, thumbnails, detailed list and folders. Share beautiful moments Share interesting videos with family and friends via email, message and social networks. Organize videos Organize your videos by category, tags, ratings, or labels for a clearer display and easier searching. Sync videos with your Turbo NAS Qvideo supports Qsync, a handy service that synchronizes files between Qsync-enabled devices/applications and a Turbo NAS, making it ideal for frequent travelers to access and share the most up-to-date files. Qphoto The Qphoto app allows you to easily browse and share the photos on your Turbo NAS anytime and anywhere with mobile devices. Photo browsing Browse your photo collection using a timeline view, thumbnails, detailed list and folders. Easily search for photos Use keywords or tags to easily find specific photos & videos on your Turbo NAS. Enjoy slideshows Create and enjoy slideshows with photos and background music from your mobile devices. Instant photo sharing Share photos from your Turbo NAS via Facebook, Twitter, Google+, WhatsApp, Line, Instagram, Gmail, and more. Save your great moments Upload photos directly to your Turbo NAS from your device camera and gallery or the inserted SD card to save your great moments. Sync photos with NAS Qphoto supports Qsync that synchronizes files between Qsync-enabled devices/applications and a Turbo NAS. If photos or videos are accidentally deleted from your mobile devices, you can still retrieve them from the “Trash Can” folder. Private Collection Archive personal photos in the password-protected “Private Collection”. Your private photos cannot be accessed by other Turbo NAS users. Instant Upload to NAS Save space on your mobile device by instantly uploading photos and videos to your NAS as you take them. It’s convenient and provides peace of mind that your photos and videos are securely saved on your NAS. View Photos on your Mobile Device Directly browse the photos on your mobile device for easier and faster photo backup and management. Qremote When enjoying the HD Station, rather than hardware remotes, Qremote app is so convenient to make your mobile devices as a handy remote control. Multimedia content playback Control playback of videos, music and photos stored in the Turbo NAS remotely and enjoy them on TV without additional gadgets like a controller, USB keyboard or mouse. Multimedia content playback Control playback of videos, music and photos stored in the Turbo NAS remotely and enjoy them on TV without additional gadgets like a controller, USB keyboard or mouse. Multimedia content playback Control playback of videos, music and photos stored in the Turbo NAS remotely and enjoy them on TV without additional gadgets like a controller, USB keyboard or mouse. OceanKTV Client Turn your tablet into a remote control An easy way to remotely control OceanKTV The OceanKTV Client allows you to control OceanKTV on a QNAP NAS with a tablet device. You can browse the song list and request, adjust the volume, add special effects, and more. Tutorial An easy way to remotely control OceanKTV The OceanKTV Client allows you to control OceanKTV on a QNAP NAS with a tablet device. You can browse the song list and request, adjust the volume, add special effects, and more. Tutorial Qget Easily search download sources, download contents to the Turbo NAS, and manage download tasks on mobile devices. Download files on the go With the inbuilt Internet browser, you can add tasks with a direct download link (HTTP/FTP/Magnet link) to the Download Station. Back up videos from video sharing sites With a simple tap, you can back up YouTube videos to the Turbo NAS through the HappyGet*. *HappyGet is a third-party application available in QNAP App Cent'''
