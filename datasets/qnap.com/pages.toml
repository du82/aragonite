["https://qnap.com/en-us/customer-stories/ts-ai642_shin-suzuki"]
title = "Shin Suzuki Photo Studio | QNAP (US)"
description = "QTS is the operating system for entry- and mid-level QNAP NAS. WIth Linux and ext4, QTS enables reliable storage for everyone with versatile value-added features and apps, such as snapshots, Plex media servers, and easy access of your personal cloud."
full_description = '''Shin Suzuki Photo Studio Shin Suzuki Photo Studio QNAP’s AI NAS allows Shin Suzuki Photo Studio's workflows to stay one step ahead from just storing data and to smartly manage 20 years of photos. Customer Shin Suzuki Photo Studio Industry Videography & Photography Product TS-AI642 Tell us your challenge QNAP NAS allows me to seamlessly access the database I have been working on. Thanks to the AI features, I can reach the specific files I'm looking for as if I were recollecting old memories. - Shin Suzuki Background Shin Suzuki is a Japanese photographer. He has been engaged with the photography of iconic marketing promotions, such as Suntory and Japan Railways, for over 20 years. In 2011, he founded Shin Suzuki Photo studio and has been involved in photographing more than 46,000 people. In addition to advertising, he has taken a wide range of photos, from family portraits to business portraits, consistently aiming to provide a fun and unprecedented photographic experience. The customer uses these solutions Storage for Professional Photographers and Enthusiasts QNAP helps keeps your data secure and private with both NAS and DAS. Learn More Backup, Restoration & Sync for NAS Use Hybrid Backup Sync to double up your protection by quickly backing up your NAS to remote and cloud storage spaces – ideal for building a complete 3-2-1 backup and recovery plan. Learn More Smart photo management Make photo management easier than ever with the QuMagie photo app with facial/image recognition. Learn More Find NAS files and images faster Qsirch is a Google™-like full-text search and AI-powered semantic search tool for you to quickly find files and images stored on NAS. Learn More Storage for Professional Photographers and Enthusiasts QNAP helps keeps your data secure and private with both NAS and DAS. Learn More Backup, Restoration & Sync for NAS Use Hybrid Backup Sync to double up your protection by quickly backing up your NAS to remote and cloud storage spaces – ideal for building a complete 3-2-1 backup and recovery plan. Learn More Smart photo management Make photo management easier than ever with the QuMagie photo app with facial/image recognition. Learn More Find NAS files and images faster Qsirch is a Google™-like full-text search and AI-powered semantic search tool for you to quickly find files and images stored on NAS. Learn More Previous challenges As his business grew, the more he faced problems of data management. Shin Suzuki Photo Studio had several other photographers, each of whom backed up the original image (RAW format files) to an external hard drive after shooting. Due to file sizes and bandwidth requirements, it was not practical to back up image files to the cloud, and dozens of drives made it a headache to manage their data. Photographers not only shoot at their own studio in Tokyo, but also travel throughout Japan. This caused them major issues in organizing their drives. Some customers would purchase additional image files months later, so it was also a painstaking process to search for the desired files by unplugging and plugging in multiple external drives to the computer. Solution Shin had two primary requirements for the new storage system. The first was a system that would provide advanced protection for client's data. The second was to create an environment where photographers could concentrate on shooting, and to remove the hassles associated with data management. He decided to acquire the QNAP AI NAS TS-AI642 as a solution, a special NAS system that has the performance required for small and medium-sized businesses and uses a system-on-a-chip (SoC) with an 6 TOPS NPU that improves the performance of AI-based tasks such as photo management and file search. Result QNAP AI NAS features a wide variety of on-demand apps, especially the AI photo management app QuMagie and the AI search app Qsirch that provide significant benefits to Shin Suzuki Photo Studio. AI-powered Photo Management & Search QuMagie is an application that uses AI to identify people and objects in photos and organize them into smart albums. The same person in different photos can be grouped into a single album, making it much easier and faster to find photos of repeat customers who take annual family photos. QuMagie also smartly identifies and categorizes common things, for example, person in a wedding dress into a "wedding" album, or a dog into a "dog" album, allowing Shin and his team to find the similar previous works and demonstrate to new clients as reference. To search for photos, they use the Qsirch full-text search application, which searches for the specific file using tags such as things in the photo, color, camera type, and location. This functionality is like using a NAS to do the human-like thinking of "I don't remember the file name, but I remember what was in the picture" and allows you to find the file you are looking for from tons of files that has been stored for several years. All files can be easily shared with a few clicks, with no need to upload them to the cloud. Access files between Mac® and Windows® After installing the NAS, access to the data is now via the network, allowing for smoother connection from the desktops, whether Windows® or Mac®. When working remotely, Shin can use the Qfile Pro mobile app to connect to the NAS. Shin says the most appealing aspect of adding NAS to his studio's workflows is that it is not limited by location or time constraints. While remote access can open up potential risks of unauthorized access, thanks to Qfile Pro's myQNAPcloud connect support, he can safely connect to the NAS without needing advanced IT knowledge. Various features to protect his valuable data Because of the need for advanced data protection, Shin set up the AI NAS with a RAID 6 configuration for a high level of redundancy. The previous method of data management using external drives always ran the risk of data loss risk from drive failure, but RAID solved this problem. In addition, to protect the data from accidents and unforeseen events, Hybrid Backup Sync is used to fulfill automatic replication to external storage services. Originally, Shin’s expectations for NAS features were basic, such as RAID and the ability to simultaneously access from multiple client devices, but after the full-scale introduction of QNAP NAS, he realized the high value of its use. Later, to expand capacity, an 8-bay JBOD enclosure TL-D800S was introduced, leveling up the overall storage capacity to over 100TB. The majority of the photo data has been migrated and well archived. Explore more from our customers All Customer stories David Wall – Director of Denhef Digital I am definitely looking forward to using this QNAP NAS for collaborations with other film makers. We might then all connect to the same project and files on the NAS and work together on the same timeline. ▶ ▶ Henrik Matzen, the Co-founder of FIRSTLAPSE We often had lag before, but now with SSD caching and a powerful CPU + 10GbE everything is smooth when we work and render 4K and 5K content. ▶ ▶ Albert Dros The TVS-h1288X will be my main storage solution system for storing all of my photos and videos ▶ ▶ James Rushforth Switching to a dedicated NAS has streamlined my workflow, increased my productivity and was much easier to set up than I expected. I just wish I’d discovered QNAP sooner. -- James Rushforth ▶ ▶ All Customer stories'''
author = "QNAP Systems, Inc."
year_published = 2025
