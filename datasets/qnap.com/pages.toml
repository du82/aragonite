title = "TL-D1600S | High-performance desktop SATA 6Gbps JBOD storage enclosure | QNAP (US)"
description = "TL-D1600S JBOD storage enclosure allows you to back up and expand your QNAP NAS, Windows® and Ubuntu® computers and servers. The TL-D1600S features twelve 3.5-inch/2.5-inch SATA 6Gb/s drive bays and four 2.5-inch SATA 6Gb/s SSD bays and comes with a QXP PCIe card for connecting the enclosure using a SFF-8088 (or SFF-8644) cable. It provides reliable read/write performance for smooth storage and backup tasks."
full_description = "TL-D1600S High-performance desktop SATA 6Gbps JBOD storage enclosure TL-D1600S Features Features Specification Supported NAS Accessories Compatibility Downloads Buy→ TL-D1600S JBOD storage enclosure allows you to back up and expand your QNAP NAS, Windows® and Ubuntu® computers and servers. The TL-D1600S features twelve 3.5-inch/2.5-inch SATA 6Gb/s drive bays and four 2.5-inch SATA 6Gb/s SSD bays and comes with a QXP PCIe card for connecting the enclosure using a SFF-8088 (or SFF-8644) cable. It provides reliable read/write performance for smooth storage and backup tasks. 1. QNAP recommends following the standard procedure for connecting or disconnecting the TL-D1600S. For more information, please see the TL-D1600S user manual.2. The TL-D1600S can only be used as an individual storage pool or volume on the NAS. Its storage pool or volume cannot be combined into the connected NAS. NAS applications cannot be installed on the TL-D1600S.3. The TL-D1600S only supports QNAP NAS running on QTS 4.5.4 (or above) or QuTS hero h4.5.4 operating system.4. When the TL-D1600S is connected to a Windows® system, if JBOD disk slots are empty, virtual disks will be created in the empty slots due to the firmware mechanism of the control chip.5. When the TL-D1600S is connected to a Windows® system, JBOD Manager will poll the first detected physical disk / virtual disk for monitoring the JBOD health status (physical disks take priority for monitoring).6. Non-Server versions of Windows have a 63TB limit for a single volume. Thus, when connecting QNAP storage expansion products, the same limitation applies. For volumes larger than 63TB, it is recommended to use the Windows Server operating system.7. The QXP-1600eS expansion card included in the package currently supports only Ubuntu and QTS operating systems and does not yet support Windows. For Windows support, please purchase the QXP-1600eS-A1164 Lockable drive traysLockable hard drive trays prevent accidental drive removal.High-speed connectivitySFF-8088 (or SFF-8644) connection cable supports four SATA 6Gb/s channels per cable (24Gb/s in total) and provides faster data transfer speeds than eSATA and USB.Flexible storage managementEasy to use. QNAP NAS and PC can both use utility software to monitor, obtain, and manage JBOD information. High-performing TL SATA JBOD The TL SATA JBOD supports multi-lane SATA 6Gb/s transfer, and each SATA lane directly connects to a single SATA drive to help improve performance. With the 1-1 high-speed channel, the TL SATA JBOD delivers excellent transfer performance. Note: The SFF ports and drive slots order: SFF port 1 to HDD slot 1-4, SFF port 2 to HDD slot 5-8, SFF port 3 to HDD slot 9-12, SFF port 4 to SDD slot 1-4 Flexible Storage Configuration and Management The TL-D1600S provides software-controlled storage configuration for greater management flexibility. You can configure RAID and monitor JBOD enclosure and disk health with Storage & Snapshots when connected to a QTS or QuTS hero NAS, or with the QNAP JBOD Manager utility when connected to a computer. Learn More: Storage & Snapshots, QNAP JBOD Manager Use the Storage & Snapshots Manager in QTS or QuTS hero to configure the TL-D1600S as a storage enclosure for your QNAP NAS. The NAS expansion storage mode supports various NAS functions, including storage pools and snapshots. With TL-D1600S, you can easily expand storage capacity. The QNAP JBOD Manager is a desktop utility for monitoring the TL-D1600S on Windows® and Ubuntu® computers. You can quickly obtain disk statuses, JBOD information and health, view fan rotation speed, and check for firmware version updates. What you need to know You can connect your TL-D1600S to Windows® and Ubuntu® computers through SFF-8088 (or SFF-8644) high-speed cable and use built-in utility to manage RAID configuration. Note: 1. QXP series PCIe cards do not support Mac Pro.2. If there are any unexpected boot failures during QXP PCIe cards installation on the host, please check with the host manufacturing company for any new BIOS updates. Alternatively, you can try disabling the boot from the PCIe slot function or disable the external graphics card option.3. The TL-D1600S manufactured before February 2022 comes with the QXP-1600eS SATA expansion card which requires driver installation to work with Windows/Ubuntu. The QXP-1600es Ubuntu driver currently supports Ubuntu 18.04.2/20.04.3 LTS (Kernel 3.10 ~ 5.4.0). Please go to the download center to install the driver Intelligently Monitor JBOD Enclosure Status on PC and Servers with QNAP JBOD Manager The QNAP JBOD Manager is a desktop utility for monitoring the TL-D1600S on Windows® and Ubuntu® computers. You can quickly obtain the disk statuses, JBOD information and health, view fan rotation speed, and check for firmware version updates. All device events are recorded, and will send desktop notifications when a system alert occurs. Learn More: QNAP JBOD Manager Notes:1. You can set up new software RAID groups in [Windows Storage Spaces] in Windows 8/10/11 (or later versions).2. Windows Server 2012 R2 (or later version) users can set up new software RAID groups in [Server Manager].3. Ubuntu users need to pass commands into [mdadm] to set up new software RAID groups.4. Does not support macOS. Flexibly Expand Connectivity with QXP PCIe Cards Install an exclusive QXP PCIe card onto your QNAP NAS, Windows® or Ubuntu® PC to connect the JBOD enclosure via SFF-8088 (or SFF-8644) cable , for easy and flexible storage expansion. Learn More: QXP PCIe Cards How to update a BIOS Note: 1. Starting in February 2022, the package includes QXP-1600eS-A1164 expansion card (previously QXP-1600eS) and four 1M SFF-8088 to SFF-8644 cables.2. A SATA JBOD storage enclosure can only connect to one NAS. Users can only use QNAP JBOD Manager to view statuses of devices and disks installed with QNAP expansion cards and JBODs. Users can only create single storage expansions when the QXP PCIe card is not connected to a TL SATA JBOD enclosure.3. TL SATA JBOD storage enclosure can install different QXP PCIe cards. For example, one NAS can be matched with multiple QXP PCIe cards to connect to TL SATA JBOD storage enclosure or users can use one QXP-800eS to expand two TL-D400S (there are no quantity limits except for restrictions mentioned in the previous note).4. The TL SATA JBOD and QXP SATA expansion card support at most 1 meter (3.28 feet) long cable.5. The QXP-1600eS PCIe SATA expansion card included with the TL-D1600S and TL-R1200S-RP JBOD is incompatible with 1U 4-bay NAS with PCIe slots and the following desktop models. For more information, and to view a full list of compatible NAS models, visit the Storage Expansion Compatibility and Compatibility List.6. Users of the TVS-871U-RP, TVS-1271U-RP, and x80 series NAS must update their BIOS to the minimum BIOS version. If not, unexpected boot failures might occur. SAS/SATA 6Gb/s external cables 1-meter (3.28 ft.) SFF-8644 to SFF-8088 cable • For QXP-1600eS-A1164, QXP-1600eS PCIe SATA card• Support SATA 6Gb/s and SAS 6Gb/s• Compatible with third-party SAS 6Gb/s JBOD productsOrder number: CAB-SAS10M-8644-8088 1-meter (3.28 ft.) SFF-8088 to SFF-8088 cable • For QXP-400eS-A1164 and QXP-800eS-A1164 PCIe SATA cards• Support SATA 6Gb/s and SAS 6Gb/s• Compatible with third-party SAS 6Gb/s JBOD products*Order number: CAB-SAS10M-8088 Versatile usage scenarios to meet storage expansion needs The TL-D1600S meets many storage expansion requirements for the home and office. Below is a list of potential application scenarios: Scenario 1: Expand your NAS capacity The TL-D1600S provides an alternative method for users to expand their NAS storage capacity. By connecting the TL-D1600S to their NAS and using Storage & Snapshots Manager in QTS or QuTS hero, users can easily configure and manage their storage expansion. The TL-D1600S supports a variety of QNAP NAS storage and file management functions, allowing users to build storage pools, finding files with Qsirch, and organizing files with Qfiling. Connection Type SATA USB 3.2 Gen 1 By device Drive bays 16 4 By device Supported systems QNAP QTS/QuTS hero, Windows, Linux etc... QNAP QTS/QuTS hero, Windows, Linux etc... QNAP QTS/QuTS hero, Windows, Linux etc... Disk health monitoring Supported (QNAP QTS/QuTS hero, Windows, Linux) Supported (QNAP QTS/QuTS hero, Windows) Not Supported Hardware RAID protection Not Supported Supported (QNAP QTS/QuTS hero, Windows) Varies by device Create Storage Pool Supported(QNAP QTS) Supported(QNAP QTS) Not Supported RAID migration, capacity expansion Supported (QNAP QTS/QuTS hero, Windows, Linux) Not Supported Varies by device Note:1. The TL-D1600S does not support QNAP NAS models that cannot be updated to QTS 4.4.2 (or later) and the following NAS models: TS-128, TS-228, TS-131, TS-231, TS-431, TS-431U.2. Drives can only be migrated from one TL USB JBOD to another TL USB JBOD. Files and data stored on drives migrated to or from other JBOD devices will not be recognized. Scenario 2: External storage for your NAS You can use the TL-D1600S to expand your NAS storage. You can select disks to create storage pools for expanding your NAS capacity, or you can treat each disk as an individual external storage space and use it as a removable drive for greater flexibility. Regardless of the mode you use, you can always use Storage & Snapshots Manager in QTS or QuTS hero to set up and manage your TL-D1600S and use hard drive S.M.A.R.T. and Notification Center to check disk status anytime and anywhere. Mode 1: Expand NAS capacity by storage pool mode You can use Storage & Snapshots Manager in QTS or QuTS hero to configure the RAID storage pool for your TL-D1600S and expand NAS capacity.Note: The TL-D1600S can only be used as an individual storage pool or volume on the NAS. Its storage pool or volume cannot be combined into the connected NAS. NAS applications cannot be installed on the TL-D1600S. Mode 2: Expand your NAS by external storage mode You can treat each disk on your TL-D1600S as an individual storage space and expand your NAS capacity. For example, it will show 8 independent external disks on an 8-bay NAS.Note: The TL-D1600S supports multiple disk formats, including NTFS (for Windows), HFS+ (for Mac), EXT4 (for Ubuntu or QNAP NAS), exFAT (for Windows, Mac, Ubuntu, and QNAP NAS) etc. Scenario 3: Expand the storage space of your Windows® and Ubuntu® computers You can use your TL-D1600S to expand the storage space of Windows® and Ubuntu® computers. You can set up the RAID configuration of your TL-D1600S to further secure data protection. Moreover, you can also use the single disk mode and format with exFAT file system for more convenient access and sharing of files between Windows® and Ubuntu® computers. Note:1. The QNAP JBOD Manager supports Windows 8/10/11 (or later versions), Windows Server 2012 R2 (or later versions), Ubuntu 18.04/ 20.04 LTS (or later versions).2. Because Windows® and Ubuntu® operating systems are incompatible, the TL-D1600S does not support cross-platform sharing after the RAID configuration setup. Mode 1: RAID configuration mode You can obtain data protection by building a software RAID 0, RAID 1, and RAID 5 volume with native utility in your Windows® and Ubuntu® computers, and use the QNAP JBOD Manager to monitor the TL-D1600S status information. Mode 2: Single disk mode You can format hard drives with the exFAT file system while accessing and sharing files between Windows® and Ubuntu® computers.Note: Your QNAP NAS can also use the exFAT file system by buying the exFAT driver license from QNAP Software Store. Scenario 4: Third-party hardware RAID card for advanced protection You can install third-party hardware RAID cards on your TL-D1600S for advanced hardware RAID 1, RAID 5, RAID 6, RAID 10, RAID 50, and RAID 60 protection and use Windows® utility software to manage your TL-D1600S. Function MRAID MegaRAID Storage Manager Storage Manager RAID Management Brand Areca Broadcom Microsemi HighPoint Model ARC-1883x MegaRAID SAS 9286-8e (6 Gb/s)MegaRAID SAS 9286-8e (12 Gb/s) SmartRAID 3154-8e RocketRAID 3742A Note: The third-party hardware RAID card cannot be used simultaneously with QNAP JBOD manager and QXP series PCIe cards. TL-D1600S Offers Better Performance Than Other USB and eSATA JBOD Solutions The TL-D1600S features SFF-8088 (or SFF-8644) connectivity and multiple SATA 6Gb/s bays. This provides better sequential read performance and faster data transfer speeds than existing USB and eSATA expansion enclosures, while also being a more economical option compared to a QNAP REXP SAS enclosure. Sequential ThroughputWindows RAID 0 TL-D1600S: Read 5111 MB/s TL-D1600S: Write 3760 MB/s Windows RAID 5 TL-D1600S: Read 4979 MB/s TL-D1600S: Write 1801 MB/s Ubuntu RAID 0 TL-D1600S: Read 6072 MB/s TL-D1600S: Write 6168 MB/s Ubuntu RAID 5 TL-D1600S: Read 6033 MB/s TL-D1600S: Write 1744 MB/s QTS RAID 0 TL-D1600S: Read 6650.4 MB/s TL-D1600S: Write 6283.1 MB/s QTS RAID 5 TL-D1600S: Read 6621.6 MB/s TL-D1600S: Write 2657.9 MB/s Tested in QNAP Labs. Figures may vary by environment. Test environment: JBOD model: TL-D1600SVolume type: Samsung SSD 860 EVO 1TBNAS: TS-1683XU, Intel Xeon E-2124 4.3GHz, 8GB RAM, QNAP QXP-1600eS-A1164, QTS 5.0.0Client PC:Windows: Intel Core i7-4790 3.6GHz, 16GB RAM, QNAP QXP-1600eS-A1164, Windows Server 2016Ubuntu: Intel Core i7-4790 3.6GHz, 16GB RAM, QNAP QXP-1600eS-A1164, Ubuntu 18.04 Desktop Extend hardware warranty up to 5 years The TL-D1600S is backed by a 2-year warranty at no additional costs. You can purchase a warranty extension that extends your warranty coverage up to 5 years. Learn More: QNAP warranty services People Also Viewed TL-R1620Sdc Dual-controller SAS 12Gb/s storage expansion for enterprises Learn More QDA-UMP4A M.2 PCIe NVMe SSD to 2.5-inch U.2 SSD adapter Learn More TS-h1277AFX High-performance all-flash NAS – Optimizing collaboration and productivity for creatives, with unmatched affordability. Learn More TR-004 4 Bay USB Type-C Direct Attached Storage with Hardware RAID Learn More TR-002 2 Bay USB Type-C Direct Attached Storage with Hardware RAID Learn More TL-R1620Sdc Dual-controller SAS 12Gb/s storage expansion for enterprises Learn More QDA-UMP4A M.2 PCIe NVMe SSD to 2.5-inch U.2 SSD adapter Learn More TS-h1277AFX High-performance all-flash NAS – Optimizing collaboration and productivity for creatives, with unmatched affordability. Learn More TR-004 4 Bay USB Type-C Direct Attached Storage with Hardware RAID Learn More TR-002 2 Bay USB Type-C Direct Attached Storage with Hardware RAID Learn More Optional Accessories Other Accessories Cable / Transceiver BRKT-PWR-02 Power bracket for PWR-PSU-250W-DT03 Dimension (L × W × H): 12.96 × 2.85 × 6.45 (cm)Weight: 0.16 (kg) FAN-9CM-T01 92x92x25mm fan, 12V, 4PINDimension (L × W × H): 18.20 × 14.10 × 4.00 (cm)Weight: 0.10 (kg) PWR-PSU-250W-DT03 250W power supply unit, DeltaDimension (L × W × H): 12.50 × 11.00 × 6.35 (cm)Weight: 0.98 (kg) For sa"
