title = "QDA-SA3 | 2.5-inch 6Gbps SAS to SATA drive adapter (Designed for dual-controller all-flash ES2486dc NAS) | QNAP (US)"
description = "The QDA-SA3 adapter is designed for QNAP’s dual-controller all-flash array Enterprise ZFS NAS (ES2486dc) and allows the usage of a SATA 6Gbps drive in a 2.5-inch SAS 12Gbps/6Gbps drive bay — providing the ability to expand storage capacity with cost-effective SATA drives."
