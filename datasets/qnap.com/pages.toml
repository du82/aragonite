description = "QTS is the operating system for entry- and mid-level QNAP NAS. WIth Linux and ext4, QTS enables reliable storage for everyone with versatile value-added features and apps, such as snapshots, Plex media servers, and easy access of your personal cloud."
full_description = "“Thanks to the GLOBAL SP - QNAP partnership, our joint customers benefit from a high-performance, secure solution adapted to their needs.” - Frédéric BOURZEIX, General Manager of Global SP Background Global SP is a leading player in the field of hosting. Established in 2000, the company offers a complete range of cloud solutions for companies (VSEs, SMEs, large accounts), IT resellers, and software publishers.The priority of Global SP is to accompany companies in their outsourcing needs to enable them to refocus on their core business. With total control of its infrastructures without subcontracting, Global SP offers high level of services and maintains close relationships with its customers. Challenge The pandemic, as well as upsurge in malware attacks like ransomware have forced companies to adapt to teleworking environments. Faced with growing needs for mobility and security, Global SP has been looking to deploy QNAP NAS technologies. This choice allows customers to enjoy better services: security, backup, monitoring, supervision, and disaster planning with greater cost efficiency. Solution As a hosting company, Global SP has chosen the TS-464U-RP, TS-432PXU-RP, TS-453DU-RP, and TS-h977XU-RP rackmount NAS to share the physical space of the datacenter and offer customers dedicated physical servers. Both the TS-432PXU-RP and TS-453DU-RP have 2.5GbE ports for high-speed networking and PCIe expandability for greater application potential. The TS-h977XU-RP also uses the QTS and the ZFS-based QuTS hero operating systems that prioritizes data security and supports inline data deduplication for optimized storage utilization. Result QNAP NAS solutions and the QuTS hero operating system provide all the features that users need: external sharing links, synchronization, collaborative work, VPN, mobile applications, and more.QNAP NAS allows Global SP to help small businesses and large enterprises to grow and increase their productivity and efficiency. Global SP’s customers are pleased with the increased performance provided by the NAS solutions.”Thanks to the NAS solution, we were able to very easily deploy a shared server combining security, backup, and accessibility. The management of users and access rights is relatively simple, including for sharing with external parties. Deployment of QNAP NAS is an ideal solution for developing structures like us without in-house IT experts.”Antoine DREVELLE – CEO of KAPSERA"
