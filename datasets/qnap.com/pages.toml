["https://qnap.com/en-us/case-studies/ts-453b-foundation-acrescere"]
title = "Fundación Acrescere improve their working efficiency with QNAP TS-453B"
description = "QTS is the operating system for entry- and mid-level QNAP NAS. WIth Linux and ext4, QTS enables reliable storage for everyone with versatile value-added features and apps, such as snapshots, Plex media servers, and easy access of your personal cloud."
full_description = '"Thanks to QNAP NAS, we´re more productive, secure and efficient. We´re very happy" - Fundación Acrescere Introduction The Fundación Acrescere is a NGO focused on home projects for minors, shelters for young people, leisure programs, and incentive programs for foster care both in Spain and the Third World. Challenge The Fundación Acrescere used to have a Windows 2008 server, both as a file server and for running their management software applications. Not only did this solution suffer from repeated downtime that caused disruption to their file storage and services, but they needed a modern solution that allowed secure remote access from users working outside the office. Solution The Fundación Acrescere found a solution with the QNAP TS-453B. This NAS features a quad-core Intel processor to tackle big workloads without performance issues, and empowers applications including virtualization, centralized storage, encryption, backup/recovery, sharing and disaster planning. “With QNAP NAS, we have a modern infrastructure which allows us to have fast file storage and a virtualized Windows 2016 server that lets us use our administrative software applications” says Juan Antonio Melendo, IT Manager of Fundación Acrescere Benefits "In comparison with our previous server, now we have additional file safety and the ability to take snapshots to protect us from possible malware attacks" says Juan Antonio Melendo IT Manager of Fundación Acrescere With the arrival of QNAP NAS, the Fundación Acrescere has benefitted from higher performance - including file read/write speeds of up to 225MB/s and integrated encryption to protect confidential information stored on the NAS. The TS-453B has also provided them with a complete backup, synchronization and disaster recovery solution thanks to the integrated Hybrid Backup Sync app. Another key aspect is QVPN - an app that adds VPN functionality and allows users to securely access files and other resources on the TS-453B. "Another option that we will use in the future is to set up VPN access so that we can work anywhere and be able to connect to all the resources we have in the Foundation," says Antonio Melendo, IT Manager of Fundación Acrescere.'
