["https://qnap.com/en-us/product/tl-r1200pes-rp"]
title = "TL-R1200PES-RP | PCIe Interface 12-bay JBOD, supporting SATA drives, for petabyte-scale expansion designed specifically for QNAP NAS | QNAP (US)"
description = "The TL-R1200PES-RP TL PCIe interface JBOD storage enclosure allows you to expand the storage capacity of a QuTS hero or QTS NAS by using SATA hard drives. Providing large data capacity and fast transfer speed, the TL-R1200PES-RP is the ideal solution for archiving/backing up virtualization applications, surveillance recordings, large data, and multimedia.Actual number of expansion units may depend on the host NAS. Click here to learn more."
full_description = '''TL-R1200PES-RP PCIe Interface 12-bay JBOD, supporting SATA drives, for petabyte-scale expansion designed specifically for QNAP NAS Watch Video Slides TL-R1200PES-RP Features Features Specification Supported NAS Accessories Compatibility Downloads Buy→ The TL-R1200PES-RP TL PCIe interface JBOD storage enclosure allows you to expand the storage capacity of a QuTS hero or QTS NAS by using SATA hard drives. Providing large data capacity and fast transfer speed, the TL-R1200PES-RP is the ideal solution for archiving/backing up virtualization applications, surveillance recordings, large data, and multimedia.Actual number of expansion units may depend on the host NAS. Click here to learn more. Note: • The host QNAP NAS requires QuTS hero h5.1.2 / QTS 5.1.2 (or later) and updating to specific BIOS versions per each model.• Supported maximum pool sizes: 2.0 PB for QuTS hero NAS; 308 TB for QTS NAS.• Users can purchase the optional RAIL-S01 short rail kit to deploy the TL-R1200PES-RP in a 19-inch rack following the ANSI/EIA-RS-310-D standard. 2.0 PB capacityExpand up to 2.0 PB capacity for QuTS hero NAS, by connecting twelve expansion enclosures (up to 144 hard drives in total).EconomyThe TL-R1200PES-RP supports SATA hard drives, which are common, budget-friendly, and available with large capacities.Up to 64 Gb/sThe TL-R1200PES-RP features PCIe Gen 3 x8, providing up to 64 Gb/s data transfer speed. Note: Actual transfer speeds depend on the host NAS's PCIe slot and the storage units used.Easy setupJust connect your TL-R1200PES-RP to the host NAS to expand NAS capacity. RAID re-building on the host NAS is not required, and setup is finished within a few minutes.Host-based power managementThe TL-R1200PES-RP power on/off is linked with the host NAS.Redundant power supplyEnsures service continuity with stable and reliable power supplies. QNAP enterprise NAS with petabyte-class storage Use QNAP enterprise and all-flash QuTS hero NAS paired with multiple TL-R1200PES-RP JBODs, to obtain both breakthrough performance and massive capacity. The TL-R1200PES-RP supports SATA hard drives, providing greater choice in selecting high-capacity drives. This configuration is ideal for enterprises, science research institutions, and media production companies that require high-capacity storage for backing up or storing virtual machines, containers, and what is produced/generated by their high-performance NAS. Find your petabyte-class solution TL-R2400PES-RP TL-R1600PES-RP TL-R1200PES-RP Drive bays per unit 24 16 12 Max. number of JBOD units connected 12 12 12 Max. number of total hard drives 288 192 144 Max. capacity 4.1 PB 2.9 PB 2.0 PB Cascades multiple expansion units Install the QXP-3X8PES (PCIe Gen 3 x8) or the QXP-3X4PES (PCIe Gen 3 x4) storage expansion cards in your QNAP NAS depending on your requirements for flexible storage expansion.Actual number of expansion units may depend on the host NAS. Click here to learn more. Note:1. The TL-Rx00PES-RP PCIe expansion series requires users to connect cables to specific inputs/outputs.2. Not all NAS models support cascade connections. Expand existing NAS storage pools You can expand existing storage pools on the host NAS by simply adding a new RAID created on the TL-R1200PES-RP. RAID re-building or complicated settings are not required. All settings can be configured using Storage & Snapshots Manager on the host NAS. The TL-R1200PES-RP is a great solution for accommodating ever-increasing data or backup files. Note: To achieve better performance, it is recommended to create storage volumes physically located within the same NAS or expansion enclosure, rather than creating storage volumes across the NAS or expansion enclosure. Power on/off linked with host QNAP NAS The TL-R1200PES-RP power status is linked with the host NAS, which helps to reduce hardware management tasks for IT staff. Supported PCIe storage expansion cards QXP-3X8PES QXP-3X4PES Expansion ports 2 2 Interface PCIe Gen 3 x8 PCIe Gen 3 x4 Supported cables CAB-PCIE10M-8644-8X special cables CAB-PCIE10M-8644-4X special cables Learn More Learn More Note:• The TL-R1200PES-RP package contains a 1M CAB-PCIE10M-8644-8X special cable that only support the QXP-3X8PES. The QXP-3XxPES series are sold separately.• The QXP-3XxPES series does not come with any cables.• Always consult the compatibility list before purchasing accessories and expansion cards. 5-year warranty as standard The TL-R1200PES-RP is backed by a 5-year warranty at no extra cost – providing your business organization with greater peace of mind. Learn More People Also Viewed TL-R1620Sdc Dual-controller SAS 12Gb/s storage expansion for enterprises Learn More TS-h1277AFX High-performance all-flash NAS – Optimizing collaboration and productivity for creatives, with unmatched affordability. Learn More QDA-UMP4A M.2 PCIe NVMe SSD to 2.5-inch U.2 SSD adapter Learn More TR-004 4 Bay USB Type-C Direct Attached Storage with Hardware RAID Learn More TR-002 2 Bay USB Type-C Direct Attached Storage with Hardware RAID Learn More TL-R1620Sdc Dual-controller SAS 12Gb/s storage expansion for enterprises Learn More TS-h1277AFX High-performance all-flash NAS – Optimizing collaboration and productivity for creatives, with unmatched affordability. Learn More QDA-UMP4A M.2 PCIe NVMe SSD to 2.5-inch U.2 SSD adapter Learn More TR-004 4 Bay USB Type-C Direct Attached Storage with Hardware RAID Learn More TR-002 2 Bay USB Type-C Direct Attached Storage with Hardware RAID Learn More Optional Accessories Other Accessories Interface Expansion Cable / Transceiver KEY-HDDTRAY-01 Key for HDD trayDimension (L × W × H): 11.70 × 1.00 × 13.00 (cm)Weight: 0.01 (kg) PWR-PSU-300W-DT02 Single 300W power supply unit for redundant PSU, Active PFC, 90~264VAC, , Vout:12VDC/12VSB, CCL, RoHSDimension (L × W × H): 18.50 × 7.35 × 4.00 (cm)Weight: 0.91 (kg) For safety information and operating instructions, please refer to the documentation of your original QNAP product. SCR-HDD25A-96 Screw pack for 2.5" HDD / SSD intallation, 96 pieces, Flat head machine screwDimension (L × W × H): 0.10 × 11.80 × 12.80 (cm)Weight: 0.01 (kg) SCR-HDD35B-96 Screw pack for 3.5" HDD intallation, 96 pieces, Flat head machine screwDimension (L × W × H): 0.10 × 11.80 × 12.80 (cm)Weight: 0.03 (kg) SP-TS-TRAY-BLACK Black HDD tray with black flat head machine screw x6 for 2.5" HDD & silver flat head machine screw x8 for 3.5" HDDDimension (L × W × H): 18.50 × 14.00 × 4.00 (cm)Weight: 0.20 (kg) RAIL-B02 new rail kit for new 1U & 2U NAS: TVS-471U, 1253U, etcDimension (L × W × H): 73.80 × 10.00 × 7.00 (cm)Weight: 2.48 (kg) This rail kit is designed for racks with 25-inch mounting depth. You may need to reserve some space when installing and adjusting the rail kit for racks with 18-inch mounting depth. For installation details, click https://qnap.to/rail-b02. RAIL-S01 Rail Kit, support rack-post 4.96" ~ 16.34" (126 ~ 415mm) depth cabinet, for 1U/2U/3U short-depth rackmount QNAP modelDimension (L × W × H): 54.00 × 11.00 × 7.00 (cm)Weight: 1.62 (kg) QXP-3X4PES QXP-3X8PES CAB-PCIE10M-8644-4X QNAP PCIe JBOD special cable for TL-Rx00PES-RP and QXP-3X8(4)PES only (SFF-8644 4X to SFF-8644 4X), 1.0 mDimension (L × W × H): 110.00 × 2.17 × 2.00 (cm)Weight: 0.17 (kg) CAB-PCIE10M-8644-8X QNAP PCIe JBOD special cable for TL-Rx00PES-RP and QXP-3X8PES only (SFF-8644 8X to SFF-8644 8X), 1.0 mDimension (L × W × H): 110.00 × 1.15 × 2.00 (cm)Weight: 0.26 (kg)'''
