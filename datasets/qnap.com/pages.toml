["https://qnap.com/en-us/customer-stories/tvs-h474_jotelulu"]
title = "Jotelulu | QNAP (US)"
description = "QTS is the operating system for entry- and mid-level QNAP NAS. WIth Linux and ext4, QTS enables reliable storage for everyone with versatile value-added features and apps, such as snapshots, Plex media servers, and easy access of your personal cloud."
full_description = "Jotelulu Jotelulu Jotelulu delivers business continuity and resiliency thanks to its integration with QNAP. To view this video please enable JavaScript, and consider upgrading to a web browser Customer Jotelulu Industry IT & Engineering Product TVS-h474 Tell us your challenge Increasing security is one of Jotelulu's strategic pillars. QNAP, through integration, puts us in touch with the local environment and gives us the possibility to continue to contribute in terms of resilience and business continuity. It is a great opportunity to continue creating value in the IT and SME sector. - David Amorín - CEO of Jotelulu Background Jotelulu is a platform designed for IT companies to market cloud services in a simple, branded, and priced way. Launched in 2020, it meets the growing demand for cloud services by SMEs and the need for IT companies to sell these services competitively with better margins. Exclusive to the IT channel, in the last 4 years, Jotelulu has become a major player in the cloud sector and has a unique opportunity to play a leading role in the digitization of European SMEs. Challenges One of the main objectives of Jotelulu and its partners is to increase security, protect data and enhance the resilience of SMEs. Any solution, integration or alliance in this line is evaluated, and if it brings value, implemented as soon as possible. Giving the possibility of having a synchronized backup between a local environment (QNAP) and the cloud is a perfect alternative to more complex business continuity solutions. Security is the highest priority for everyone. Therefore, the integration between Jotelulu and QNAP is a great opportunity to respond to a need increasingly demanded by the market. Solution Jotelulu had been seeking a first-class technology partner to integrate with to offer a simple, fast, and effective solution that would increase the security and resilience of any company through data synchronization between local environments and their cloud services. Given the unique nature of the companies their partners work with, Jotelulu chose a QNAP TVS-h474 NAS with Seagate IronWolf ST2000VN003 2TB hard drives, an ideal solution for the type of company their cloud services are aimed at. Thanks to QNAP’s Hybrid Backup Sync (HBS 3), Jotelulu’s integration was successful. Hybrid Backup Sync was used for replication with their object storage service, which allows real-time synchronized copies of repository content. It is already possible to perform such synchronizations in a simplified way from any QNAP device with the QTS and QuTS hero operating systems. Likewise, for server backups, Nakivo Backup has been used, enabling the copy of the Operating System and server contents to the QNAP NAS. Result It was very satisfying to experience the ease of synchronization and copying processes after the integration, while at the same time providing an interesting alternative as a business continuity solution. Furthermore, all this integration has allowed them to create numerous contents as a guide to make all the procedures and configurations of the replicas even simpler. Some outstanding examples, depending on the service, are: Mapping of Jotelulu Object Storage to QNAP Synchronized copy from QNAP to Jotelulu Object Repository Recovering a backup of object storage to QNAP Backup GNU/Linux server to a QNAP NAS Backup Windows server to a QNAP NAS This alliance and integration with QNAP opens up a very interesting range of possibilities while connecting them with local environments and power alternatives to secure data. Explore more from our customers All Customer stories Pablo García, PhD in Industrial Engineering at Beamagine SL and project collaborator. Thanks to the TS-h886 NAS and its virtual machine with LXC container, we can visualize the data from all the 3D and 2D image sensors installed in a car in real time while recording them securely, robustly and efficiently, without affecting the system's overall performance. ▶ ▶ Luis Yáñez – Founder & Consultant of Difoosion. With QNAP, we have turned chaos into clarity. What once was a disjointed and expensive process, is now a unified and efficient work flow that boosts our productivity. ▶ ▶ Sergio de Luz, Director of RedesZone I installed the TVS-h1288X NAS to be the hub of the entire local network acting as the main router with virtualized pfSense, and also to control home automation, with excellent results right out of the box. ▶ ▶ Global SP QNAP TS-h977XU-RP NAS and solutions help Global SP provide customers services with higher security at reduced costs. ▶ ▶ All Customer stories"
