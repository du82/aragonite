["https://qnap.com/en-us/product/qwa-ac2600"]
title = "QWA-AC2600 | Turn your Ubuntu/Linux PC or QNAP NAS into a high-performance and secure wireless access point/base station | QNAP (US)"
description = "The QWA-AC2600 is a 2.4/5 GHz Dual Band Dual Concurrent (DBDC), 4 x 4 Multi-user MIMO (MU-MIMO), low-profile PCI Express (PCIe) 2.0 x1 wireless adapter with two Qualcomm QCA9984 NICs that supports up to 2533 Mbps (800 Mbps for IEEE 802.11n (2.4 GHz) and 1733 Mbps for IEEE 802.11ac (5 GHz)). The QWA-AC2600 can be used as an access point or a base station with Ubuntu/Linux PCs or QNAP NAS. Combining the higher compatibility of 802.11n and faster connection of 802.11ac, the QWA-AC2600 enables versatile applications including wireless LANs in the workplace and Internet of Things (IoT) deployment in the field."
full_description = '''QWA-AC2600 Turn your Ubuntu/Linux PC or QNAP NAS into a high-performance and secure wireless access point/base station Watch Video Slides Datasheet QWA-AC2600 Features Features Specification Buy→ The QWA-AC2600 is a 2.4/5 GHz Dual Band Dual Concurrent (DBDC), 4 x 4 Multi-user MIMO (MU-MIMO), low-profile PCI Express (PCIe) 2.0 x1 wireless adapter with two Qualcomm QCA9984 NICs that supports up to 2533 Mbps (800 Mbps for IEEE 802.11n (2.4 GHz) and 1733 Mbps for IEEE 802.11ac (5 GHz)). The QWA-AC2600 can be used as an access point or a base station with Ubuntu/Linux PCs or QNAP NAS. Combining the higher compatibility of 802.11n and faster connection of 802.11ac, the QWA-AC2600 enables versatile applications including wireless LANs in the workplace and Internet of Things (IoT) deployment in the field. 1The QWA-AC2600 utilizes the 802.11n and 802.11ac standards and offers speeds up to 2533 Mbps to deliver a low-latency, high-speed wireless experience.2The QWA-AC2600 supports Dual Band Dual Concurrent (DBDC) for acting as an access point or a base station, adding more possibilities to your investment.3The QWA-AC2600 supports 4 x 4 MU-MIMO technology for communicating with multiple clients with multiple signal lanes (spatial streams).4The QWA-AC2600 comes with four 5 dBi detachable omni-directional high-gain antennas. The universal RP-SMA connectors enable antenna replacements for boosting signals and coverage. 5The QWA-AC2600 features an 80 cm high-frequency coaxial cable for extending the antennas' magnetic stand base for flexible deployment and coverage.6The QWA-AC2600 has an active cooling module to ensure optimal heat dissipation. The fan will adjust its speed to match the temperature of the module. A tailor-made private wireless network that meets your needs The QWA-AC2600 is compatible with most PCIe-enabled QNAP NAS*. When used with the WirelessAP Station app** your NAS will evolve into a high-performance wireless access point that can be connected to from multiple devices. The QWA-AC2600 can also be used to extend your wireless network coverage. Combined with useful features (including DHCP and NAT) provided by the Network and Virtual Switch app, the QWA-AC2600 can be used for a variety of applications, delivering private, fast, low-latency and secure connectivity across your home and/or workplace. Learn More: WirelessAP Station *QNAP NAS models with a 32-bit ARM processor require QTS 4.3.5 (or later). For compatible QNAP NAS, visit https://www.qnap.com/compatibility**The WirelessAP Station app requires Container Station be installed on your QNAP NAS.***To use the QWA-AC2600 installed on QNAP NAS as a client, QTS 4.3.5 (or later) is required. Turn your Ubuntu/Linux PC or QNAP NAS into a wireless access point/base station The QWA-AC2600 can turn your Ubuntu*/Linux PC or QNAP NAS into a wireless access point/base station for other wireless devices to directly access data stored on it. The QWA-AC2600's 2.4/5 GHz** DBDC design can be configured to utilize two wireless networks for boosting performance. For a single Ubuntu/Linux PC or QNAP NAS, multiple sets of QWA-AC2600 can be installed to enable a more flexible deployment and expansion for wireless network applications which require security, privacy and high performance. *The driver used by the QWA-AC2600 (ath10k) is built in to Ubuntu 17.10 (and later).**When the QWA-AC2600 is installed in a PC, the following channels are supported:- 2.4GHz: 1 to 11- 5GHz: 36, 37, 38, 149, 153, 157, 161 and 165 Bandwidth expansion to fix crowded Wi-Fi networks Multiple devices connecting wirelessly with your router to access NAS files can lead to bottlenecked traffic and slow data transfer. Why not cut out the middle man and access your NAS directly? All you need to do is install the QWA-AC2600 in your QNAP NAS and use the WirelessAP Station app. This solution instantly turns your NAS into a secure wireless access point, which allows multiple devices to directly connect to it, achieving optimum access speeds. Before: Bandwidth bottleneck In a traditional setup, if a lot of devices access NAS-based files and services, they will be using the bandwidth of the network. The more connected devices there are, the more slowly the network will run. After: Direct access to the NAS With the QWA-AC2600 and WirelessAP Station app, your NAS can perform as a high-performance wireless access point that can be accessed by multiple devices. Your devices can directly access data stored on the NAS and in bypassing the router, access speeds to the network will not be affected. Network coverage extension to bring wireless connection everywhere With the QWA-AC2600, your QNAP NAS can serve as a second wireless access point at home or in the workplace. The QWA-AC2600 supports 2.4G / 5G channels and comes with four 5 dBi detachable omni-directional high-gain antennas for boosting signals and coverage. The QWA-AC2600 allows users to directly connect their devices to the NAS to access files and services, providing an excellent wireless experience wherever it is deployed. Before: Poor Wi-Fi signal with only one wireless access point The position of your wireless access point can have a significant impact on Wi-Fi signal and range. Wireless access points are not designed to transmit signals over long distances, so there may be "dead zones" in your environment where the Wi-Fi connection is slower or unreliable. After: NAS as your 2nd wireless AP to get the best coverage Deploy your QNAP NAS as a Wireless access point to improve coverage. With the QWA-AC2600 and the WirelessAP Station app, your NAS is transformed into a high-performance wireless access point. Just place the NAS in a more centralized location and it will help lengthen the reach of your existing Wi-Fi network and eliminate potential dead zones. People Also Viewed QXG-ES10G1T Industry-first NAS-exclusive E1.S to 10GbE network module Learn More QDA-UMP4A M.2 PCIe NVMe SSD to 2.5-inch U.2 SSD adapter Learn More TS-h1277AFX High-performance all-flash NAS – Optimizing collaboration and productivity for creatives, with unmatched affordability. Learn More QXG-10G2T Dual-port, 5-speed 10 GbE (RJ45) network expansion card Learn More QM2-2P-244A Add two NVMe SSDs to your NAS with a PCIe 2.0 expansion card Learn More QXG-25G2SF-CX6 Supports SR-IOV and RoCE for Improved Network and VMware® Virtualization Environments Learn More QXG-ES10G1T Industry-first NAS-exclusive E1.S to 10GbE network module Learn More QDA-UMP4A M.2 PCIe NVMe SSD to 2.5-inch U.2 SSD adapter Learn More TS-h1277AFX High-performance all-flash NAS – Optimizing collaboration and productivity for creatives, with unmatched affordability. Learn More QXG-10G2T Dual-port, 5-speed 10 GbE (RJ45) network expansion card Learn More QM2-2P-244A Add two NVMe SSDs to your NAS with a PCIe 2.0 expansion card Learn More QXG-25G2SF-CX6 Supports SR-IOV and RoCE for Improved Network and VMware® Virtualization Environments Learn More'''
