title = "ES1686dc | Next-generation Enterprise ZFS NAS: High-performance and near-zero downtime high availability | QNAP (US)"
description = "Delivering enterprise high availability, the ES1686dc Enterprise ZFS NAS features Intel® Xeon® D processors, dual active controllers, up to 512 GB DDR4 ECC memory, SAS 12Gb/s, and ZFS that supports logical volume management. The ES1686dc runs the latest QES 2.1.0 operating system that supports near-limitless snapshots, SnapSync, block-level data deduplication, and inline data compression. Whether being used as a mission-critical file server, virtualization server, VDI, medium-sized data center, video streaming, surveillance storage, and efficient file backup &amp; recovery, the ES1686dc helps your business to achieve service-level agreements for performance and uptime."
full_description = "ES1686dc Next-generation Enterprise ZFS NAS: High-performance and near-zero downtime high availability Datasheet Calculator ES1686dc Features Features Specification Expansion Accessories Compatibility Downloads Buy→ Delivering enterprise high availability, the ES1686dc Enterprise ZFS NAS features Intel® Xeon® D processors, dual active controllers, up to 512 GB DDR4 ECC memory, SAS 12Gb/s, and ZFS that supports logical volume management. The ES1686dc runs the latest QES 2.1.0 operating system that supports near-limitless snapshots, SnapSync, block-level data deduplication, and inline data compression. Whether being used as a mission-critical file server, virtualization server, VDI, medium-sized data center, video streaming, surveillance storage, and efficient file backup & recovery, the ES1686dc helps your business to achieve service-level agreements for performance and uptime. Dual active-active controllersIntel® Xeon® D dual active-active controllers provide supreme uptime and redundancy to ensure high availability.Reliable & High-performanceBattery-protected DRAM write to cache data protection and Flash read acceleration provides industry-leading random access performance.2 x PCIe Gen 3 slotsPCIe expandability allows for 10GbE/25GbE adapters to increase application performance.4 x 10GbE SFP+ portsFour 10GbE SFP+ ports accelerate virtualization, large file sharing, and intensive data transfer.Real-time SnapSyncNear-limitless snapshots and SnapSync for snapshot remote backup assist businesses to resume essential services in the shortest time.Virtualization applicationsSupports VMware® vSphere® 6.5, Windows Server® 2016 and Citrix® XenServer® 7.0 for storage virtualization. Compatible with OpenStack® cloud environments. Available Models ES1686dc-2123IT-64G ES1686dc-2142IT-96G ES1686dc-2142IT-128G ES1686dc-2123IT-64G Intel® Xeon® D-2123IT 4-core 2.20 GHz processor (burst up to 3.0 GHz) per controller, 32 GB RDIMM DDR4 ECC (4x 8 GB) per controller ES1686dc-2142IT-96G Intel® Xeon® D-2142IT 8-core 1.90 GHz processor (burst up to 3.0 GHz) per controller, 48 GB RDIMM DDR4 ECC (4 x 4 GB+4 x 8GB) per controller ES1686dc-2142IT-128G Intel® Xeon® D-2142IT 8-core 1.90 GHz processor (burst up to 3.0 GHz) per controller, 64 GB RDIMM DDR4 ECC (4 x 16 GB) per controller Active-Active high availability with optimal storage efficiency In Active-Active storage system architecture, both controllers are able to provide a complete range of services, which is different from the Active-Standby architecture of single-controller systems. The Active-Active architecture does not have the disadvantage of idle computing resources. To leverage the strengths of the ES1686dc Active-Active controller architecture, it is recommended to create multiple storage pools and distribute their ownership between both controllers. This allows simultaneous output from both controllers for better load balancing. Active-Standby single-controller system With two HA systems you are paying twice the price and causing a load imbalance as workloads are only processed on the active system. A power outage could cause data loss, and the disconnected network invalidates the HA architecture. Active-Active dual-controller system Both controllers of the ES1686dc can carry traffic, along with Copy-To-Flash protection against power failure and the dual-path SAS interface. Besides conserving computing resources, a high-speed, uninterrupted, and high-availability storage service is also provided through communication protocols such as SMB, NFS and iSCSI. High performance. High efficiency. SMB Sequential Throughout (10 GbE x 8) Write MB/s Read MB/s iSCSI Random 4K IOPS(10 GbE x 8) Write IOPS Read IOPS SMB Sequential Throughout (10 GbE x 8) Write MB/s Read MB/s iSCSI Random 4K IOPS(10 GbE x 8) Write IOPS Read IOPS Tested in QNAP Labs. Figures may vary by environment. Learn more about test environment. Intel® Xeon® D dual-controller ensures high availability and failure-resistant service Powered by two Intel® Xeon® D processors, the ES1686dc features a dual active-active controller architecture that provides failover/failback operations as the standby controller can quickly take over if one controller breaks down. Redundant hot-swappable power supplies and cooling fans are also included to provide businesses with near-zero downtime high availability. The ES1686dc connects to the JBOD enclosure (TL-R1620Sdc) via the dual-path mini-SAS design to sustain continuous operations even if a JBOD cable is disconnected. Designed around redundancy, the ES1686dc is the best realization of reliable enterprise storage for uninterrupted mission-critical enterprise tasks and productivity. Multi-level cache technology with both read and write The ES1686dc simultaneously supports main memory read cache (L1 ARC), SSD secondary read cache (L2 ARC), and memory write cache (ZFS Intent Log) to meet performance demands for various enterprise applications. Up to 512 GB main memory Each controller has eight RDIMM slots, allowing for up to 512 GB memory.Note: The main memory will retain 8GB for use by the write cache. NVRAM cache reduces the risk of losing write cache data If unplanned power outages occur, the system can write cache data from the battery-protected DRAM to M.2 SSD through Copy To Flash (C2F) to ensure that data is not lost.Note: To ensure write cache data safety, it is recommended to annually replace the BBU. QNAP provides one-year warranty for the BBU. PCIe expansion for 25GbE high-speed networks The ES1686dc provides two PCIe Gen3 x8 slots connected to the CPU, allowing you to install lightning-fast 10GbE/25GbE network cards to boost virtualization, media streaming, and other bandwidth-demanding applications. Installing NVIDIA® Mellanox Smart NICs further adds support for iSER for improved VMware® virtualization performance. You can also install a SAS expansion card (QXP-820S-B3408) for connecting up to seven 16-bay TL-R1620Sdc expansion enclosures to seamlessly expand the potential storage capacity over 1PB, with unprecedented performance of up to 48Gbps per host connection. Learn More: Network expansion card (NVIDIA® Mellanox), iSER, Storage Expansion Compatibility Dual controller NAS: High reliability and high availability “Reliability” is the priority for mission-critical business applications. The ES1686dc adopts dual active-active controllers to provide the most reliable base for business IT storage. ES1686dc 1 2 3 4 5 6 7 3x hot-swappable system fans The fans rotation speed will automatically adjust to the NAS temperature. Intel® Xeon® D-2100 series processor Provides Intel® Xeon® D-2142IT and Intel® Xeon® D-2123IT options with DDR4 memory and PCIe Gen3 support. DDR4 2133 MHz ECC memory Quad-channel DDR4 ECC memory with 8 RDIMM slots for up to 512 GB memory per controller. 2x PCIe Gen3 x8 slots Supports 10GbE/ 25GbE network cards or SAS expansion cards for greater application potential. 4x 10GbE SFP+ ports Ideal for running bandwidth-demanding applications such as virtualization and fast backup/restoration. Battery Backup Unit (BBU) If a sudden power loss occurs, the BBU enables write to cache data protection, and at the same time the data is replicated to a backup controller to achieve 100% data integrity. 3x Gigabit ports Supports Service Binding, Port Trunking and MPIO. One Gigabit LAN port is dedicated to remote management. QES 2.1.0: ZFS-based, and optimized for all flash performance The ES1686dc features the QES (QNAP Enterprise Storage) 2.1.0 operating system, which is based on the simple and efficient FreeBSD kernel and the ZFS file system that has been proven through years of experience to be most suitable for high-end enterprise applications. Not only does QES 2.1.0 provide reliable data protection, recovery, and business-class features, it is optimized for flash storage and is capable of driving outstanding performance for all-flash storage arrays to accelerate mission-critical services and eliminate challenges in VDI environments. QES 2.1.0 also comes with Quality of Service (QoS) capabilities that help ensure consistent primary storage performance in multi-application environments. Continuing the same user experience with the intuitive QTS operating system, QES provides business users with an easy learning curve for quick implementation within IT infrastructures. Learn More: QES 2.1.0 QES and QTS comparison OS Kernel FreeBSD Linux File system ZFS Ext4 CIFS/FTP/NFS/iSCSI End-to-end data integrity Snapshot upper limit 65536 1024 Remote disaster backup and recovery SnapSync Snapshot Replica Deduplication Deduplicate backup data at the source(Hybrid Backup Sync 3.0) Real-time data compression Real-time data compaction Application consistency Snapshot AgentVSS Hardware Provider(QNAP NetBak Replicator) Snapshot AgentVSS Hardware Provider(QNAP NetBak Replicator) Qtier (Auto Tiering) App Center Application services (Virtualization Station, Web Server, multimedia service, etc.) Application scenarios • Reliable storage for mission-critical business tasks.• The perfect backup storage for the dual-controller Enterprise ZFS NAS. • High-performance storage with SSD and Qtier technology for maximized cost-efficiency.• Storage for hosting virtual machines and containerized applications.• Application server using QTS services (Web server, VPN server, FTP server, etc). Unleashed SSD potential – cost-effective and agile with ultimate performance QES 2.1.0 features QNAP’s exclusive Write Coalescing algorithm that further optimizes all-flash performance in ZFS, providing a highly cost-effective all-flash solution for enterprise-class data management and mission-critical services. Learn More: QNAP all-flash solution Note: The Write coalescing algorithm in QES 2.1.0 does not support for dual-controller NAS. This will be supported in future versions of QES. Write Coalescing algorithm Transforms all random writes to sequential writes along with reduced I/O. It not only effectively increases random write performance for all-flash environments but also can improve SSD lifespans. Software-defined over-provisioning Users can allocate an additional over-provisioning ratio for SSDs (from 1% to 60%) and Storage Pools (from 1% to 40%) for a constant performance boost of over 100%. Deduplication and compression to maximize VDI storage performance In VDI environments where there could be over 90% duplicate data from OS images and applications that are spread over virtual desktops, the QES-powered ES1686dc provides businesses with the most cost-effective remote virtual desktop platform and mission-critical information warehousing. Inline data deduplication Block-based data deduplication optimizes storage usage and significantly decreases storage capacity requirements. Inline compression Shrinks data size to reduce storage I/O workloads for improved performance. In VDI, deduplicated virtual desktops are easily cached to achieve optimal virtual desktop performance. Inline compaction Especially helpful for increasing SSD storage utilization efficiency when highly-repetitive data or massive small files (e.g. transaction logs of banks or e-commerce) are generated. It delivers higher cost efficiency of all-flash storage systems. Note: Data compaction in QES 2.1.0 does not support dual-controller NAS. This will be supported in future versions of QES. Self-Healing ensures data integrity and reliability Designed with a focus on data integrity, a fundamental aspect of storage security and reliability, the QES-based ES1686dc uses its end-to-end checksums to detect and correct silent data corruption caused by hardware defects, bugs in firmware or metadata errors. If integrity violations are detected, QES automatically repairs the damage using data from the other mirror before the data is passed to applications. Streamlined remote backups with nearly limitless snapshots and SnapSync The ES1686dc supports up to 65,536 snapshots for iSCSI LUN and shared folders (if 1 snapshot is created every hour, 24 snapshots per day, then up to 7 years worth of snapshots can be created without needing to delete any) and replicates snapshots to remote servers by using the block-level SnapSync. In the event of a primary site failure, SnapSync assists businesses to resume essential services in the shortest possible time. Business Continuity Copy-on-write technology makes QES snapshot creation almost instantaneous without affecting ongoing data writing. SnapSync supports incremental backups, real-time deduplication and compression. The source ES1686dc will perform deduplication before compressing the metadata to reduce synchronized data and save bandwidth resources. VMware SRM SnapSync supports VMware Site Recovery Manager (SRM) that offers enterprise-class remote backup and disaster recovery solutions for virtual applications. With the Storage Replication Adapter (SRA) for SRM, operation overheads of the ESXi® server can be offloaded to a QNAP NAS to accelerate and simplify virtual machine backup and restoration. Create VMware/Windows backups for VSS-Aware applications using QNAP Snapshot Agent QNAP Netbak Replicator is easy-to-use and VSS-aware backup software, helping businesses to create complete backups in data centers and virtualization environments without needing additional software. To build a QNAP Snap Agent and VSS Hardware Provider operating environment, all applications (including VSS Service, Requestor, Provider and QNAP Snap Agent) can be deployed with VSS-Aware applications on the same server, and the minimal requirements are only one ES1686dc and one server for it to be operational. Learn More: QNAP Snapshot Agent, Tutorial Compatible with VMware, Microsoft and Citrix virtualization, and supports iSER The ES1686dc supports VMware® vSphere® 6.5, Windows Server® 2016, and Citrix XenServer® 7.0 for flexible deployment and management in virtualization environments. It also supports VMware® VAAI and Microsoft® ODX to increase performance by offloading server loading for ESXi® server and Hyper-V® respectively. The QNAP vSphere Client plug-in, Web plug-in and QNAP SMI-S provider are also supported to increase the efficiency of operations and management in virtualization applications. The ES1686dc and VMware® ESXi server installed with NVIDIA® Mellanox Smart NICs that support iSER can acquire iSER advantages to offload CPU workloads with boosted VMware® virtualization performance. Learn More: iSER QES is OpenStack Ready to explore out-of-the-box enterprise cloud services QES supports OpenStack® Cinder and Manila file sharing services. With the QNAP Cinder Driver, the ES1686dc can provide block-level storage space to virtual machines. It not only accelerates the deployment of virtual machines and enhances virtual machine image access efficiency through iSCSI, but it is also easier to integrate into commercial cloud storage platforms, providing businesses with a flexible, easy-to-use, and low-cost storage solution. Standard 5-"
