["https://qnap.com/en-us/product/qgd-1602"]
title = "QGD-1602 | Smart Edge Switch with 2.5GbE and 10GbE Capability | QNAP (US)"
description = "The QNAP QGD-1602 is the world’s first managed switch series that supports Virtual Machines (VMs). Featuring 2.5GbE and 10GbE SFP+ ports, the QGD-1602 allows you to build a high-speed network infrastructure. With a dual-CPU design, the QGD-1602 uses Intel® Atom® multi-core 2.2GHz processors with two SATA drive bays to support VM and QTS applications. The QGD-1602 not only fulfills IP surveillance, network security and storage expansion applications, but also integrates QuWAN to form a SD-WAN architecture with other QNAP devices across multiple sites, helping to build a resilient and secure IT infrastructure. With 20GbE internal bandwidth capacity and Intel® QuickAssist Technology (Intel® QAT), the QGD-1602 achieves the high-performance transmission required for edge computing virtualization and IPsec VPN, and offers SMBs a cost-optimized and centrally managed LAN deployment solution."
full_description = "QGD-1602 Smart Edge Switch with 2.5GbE and 10GbE Capability Watch Video Slides QGD-1602 Use as Switch & NAS Use as ADRA NDR Use as Switch & NAS Specification Accessories Compatibility Downloads Buy→ The QNAP QGD-1602 is the world’s first managed switch series that supports Virtual Machines (VMs). Featuring 2.5GbE and 10GbE SFP+ ports, the QGD-1602 allows you to build a high-speed network infrastructure. With a dual-CPU design, the QGD-1602 uses Intel® Atom® multi-core 2.2GHz processors with two SATA drive bays to support VM and QTS applications. The QGD-1602 not only fulfills IP surveillance, network security and storage expansion applications, but also integrates QuWAN to form a SD-WAN architecture with other QNAP devices across multiple sites, helping to build a resilient and secure IT infrastructure. With 20GbE internal bandwidth capacity and Intel® QuickAssist Technology (Intel® QAT), the QGD-1602 achieves the high-performance transmission required for edge computing virtualization and IPsec VPN, and offers SMBs a cost-optimized and centrally managed LAN deployment solution. 10GbE connectivityTwo 10GbE SFP+ ports provide computers, LAN switches and NAS with higher bandwidth to empower applications like virtualization, 4K video editing and file sharing.Layer 2 networkProvides comprehensive Layer 2 management features (such as VLAN, LACP, QoS IGMP Snooping, and Wake-on-LAN) with user-friendly network management software. IT staff can efficiently control network bandwidth and enhance security using a web-based management interface.Dual M.2 PCIe slotsSet up an SSD cache or storage pools to increase file access efficiency.Two SATA drive baysSupports up to two SATA drives.Flexible PCIe expansionTwo PCIe Gen3 x2 slots allow users to install 10GbE network cards, QM2 dual-port M.2 SSD/10GbE cards, USB 3.2 Gen 2 (10Gbps) cards, or wireless adapters.Mesh VPNHost containerized applications and virtual machines with various operating systems. Flexibly install QuWAN, virtual router, firewalls, or wireless LAN management software for various networking management applications. Available Models QGD-1602-C3758-16G QGD-1602-C3558-8G QGD-1602-C3758-16G 8 x 2.5GbE Gigabit RJ45 ports, 8 x Gigabit RJ45 ports, 2 x 10GbE SFP+ ports; Intel® Atom® C3758 octa-core 2.2 GHz processor, 16 GB DDR4 RAM, supports hosting up to 6 VMs QGD-1602-C3558-8G 8 x 2.5GbE Gigabit RJ45 ports, 8 x Gigabit RJ45 ports, 2 x 10GbE SFP+ ports; Intel® Atom® C3558 quad-core 2.2 GHz processor, 8 GB DDR4 RAM, supports hosting up to 4 VMs Upgraded performance for smoother virtualization The QGD-1602 provides a full upgrade of network speeds, performance and memory, which not only greatly enhances the network transmission speeds of edge devices, but also optimizes the capabilities of running multiple virtual machines and containers for highly-efficient virtualization applications. 8 -core CPU (Max.) 10 GbE network 20 Gbps Internal bandwidth capacity 64 GB RAM (Max.) 6 VMs Sturdy hardware with Intel QAT for optimized performance The QGD-1602 uses Intel® Atom® C3000 series multi-core 2.2GHz processors, has two SATA drive bays, and provides and two M.2 NVMe SSD slots for SSD caching to increase IOPS performance. Two PCIe Gen3 x2 slots allows users to install 10GbE network cards, QM2 dual-port M.2 SSD/10GbE cards, USB 3.2 Gen 2 (10Gbps) cards, or Wireless Adapters to boost core functionality. The QGD-1602 also supports Intel® QuickAssist Technology (Intel® QAT) to greatly enhance IPsec VPN performance. Intel® QAT is supported when using QTS 4.4.3 (or later). The First Switch Series with VM Support The Guardian supports QNAP’s QTS operating system and is the world’s first switch series that can host virtual machines, containers, and provide other cloud applications - enabling diverse networking and storage solutions. In addition to QuWAN, QVR Pro, HybridMount, and other applications, the included App Center also supports VMs for running many open-source software applications. The Guardian provides SMBs with not only an all-in-one networking solution for IP surveillance, storage expansion, network security, and wireless LAN management, but also a SD-WAN solution for connecting to other QNAP devices at multiple sites. The dual-processor Guardian enables you to independently run the networking management interfaces (QSS - QNAP Switch System) and QTS. The Guardian provides a user-friendly web interface, QuNetSwitch, to help SMBs deploy a flexible and secure IT infrastructure. Learn More: QVR Pro, VJBOD, Virtualization Station, pfSense QTS and QSS can work independently without interference to ensure continuous operation. For example, when restarting QTS, the QSS connections will not be interrupted; when rebooting QSS, the VMs on QTS will keep running. Deploy a multi-site VPN with SD-WAN solution The QGD-1602 and other QNAP solutions now support QuWAN – QNAP’s SD-WAN solution. QuWAN provides full mesh IPsec VPN topology between QNAP devices based in multiple sites to fulfill enterprise video, VoIP, ERP system data, and filing needs. QuWAN adopts software-defined networking to achieve optimum network connectivity, and supports cloud-centric management for deploying a resilient IT Infrastructure. Learn More: QuWAN QuWAN OrchestratorManage the network using a centralized management cloud platform.QuCPE ServerThe high-performance core VPN Server at the HQ.NASAdd branch offices to the VPN Infrastructure with your existing NAS.QGD SwitchFulfill surveillance and VoIP applications at small business sites (such as stores).QHora RouterProvides easy-to-use VPN functions for remote workers.QVPNMobile users can connect to SSL VPN using their PCs, laptops or mobile phones. Faster wired and wireless transmission The QGD-1602 has eight 2.5GbE ports and eight Gigabit ports for connecting various high-speed devices. Two in-built 10GbE SFP+ ports can serve as uplink ports to the Internet and core networks or simply be connected to routers and LAN Fiber switches. The additional two 5GbE and two Gigabit host management ports can be connected to multiple hosts or LAN devices to improve LAN efficiency. The switching capacity of QGD-1602 is 96Gbps, guaranteeing the full potential of each port. By installing an 802.11ac Wireless Adapter and the WirelessAP Station App, the QGD-1602 can work as an access point for connecting multiple edge devices and offer wireless speeds up to 2533Mbps. 20GbE Internal Bandwidth for Virtualized Applications QTS can directly access to and control the data processed in QSS using Virtual Switches. The QGD-1602 provides 20GbE internal bandwidth to accelerate computing between end devices and hosts. The additional two 5GbE and two Gigabit host management ports can also be connected to multiple hosts for deploying multiple virtual machines. QuNetSwitch: Layer 2 Management with User-friendly Web GUI The QGD-1602 provides comprehensive Layer 2 management features (including VLAN, LACP, and LLDP) for efficient control of networks through IP grouping and bandwidth management. Powerful security functions (including IGMP Snooping, static MAC, QoS, and Wake-on-LAN) are also suitable for simple networking environments and easy deployment. Aside from the QNAP Switch System (QSS), the QGD-1602 also offers the user-friendly web interface software QuNetSwitch (via QTS) to help IT staff control Layer 2 management networks. The overview dashboard and statistical analysis area displays all the information about the switch and devices at a glance, making centralized management of devices intuitive and easy. Port Management VLAN Port Trunking QoS - Port status- Port statistics- Port configuration- Jumbo frame support- IEEE 802.3x flow control- Auto-negotiation of speed and duplex modes - VLAN configuration- Port-based private VLAN- IEEE 802.1Q-based VLAN - Port trunking- LACP groups - Bandwidth control- Traffic classification IGMP Security Management Advanced Applications - IGMP snooping v2/v3 - Access Control Lists (ACL): ACL by IP address, ACL by MAC- Static MAC address- Rate limits - Link Layer Discovery Protocol (LLDP): LLDP remote device- interfaces: Web UI, Telnet, Command Line Interface (CLI)- SNTP, DNS, DHCP client entry - Port mirroring- Loop protection to avoid broadcast loops- Wake-on-LAN The Guardian Smart Edge Switch meets your business needs. The QGD-1602 is a central networking solution that offers Web-based management, and innovative virtualization applications to solve various networking problems. Virtual Router x Virtual Firewall = Enhanced CybersecurityThe QGD-1602 can be transformed into a secure router with a firewall via virtual router and virtual firewall software by installing MikroTik RouterOS and OpenWrt. Flexibly configure routing functions and separate or protect local networks and apply multiple security policies. You can also easily manage all networking devices with Zabbix network management software. » Learn more:Deploy MikroTik RouterOS router software with a QNAP NAS, Deploy pfSense, RouterOS or OpenWrt router software using Virtualization Station Zabbix = Centralized Network Management PlatformThe QGD-1602 supports Zabbix Network Monitoring Software that auto-detects connected SNMP-compliant servers/devices, and monitors network status. Zabbix provides a Dashboard and Analysis Reports for efficient large-scale network management. People Also Viewed QGD-1600 The world’s first smart edge switch that runs QTS and supports hosting Virtual Machines (VMs), enabling versatile applications to satisfy all your networking needs. Learn More QGD-1600P The world’s first smart PoE edge switch that runs QTS and supports hosting Virtual Machines (VMs), enabling versatile applications to satisfy all your networking needs.(Models without PoE are also available.) Learn More QSW-2104-2T-R2 4-port 2.5GbE and 2-port 10GbE Multi-Gig unmanaged switch. Affordably upgrade to high-speed networking. Learn More TS-h1277AFX High-performance all-flash NAS – Optimizing collaboration and productivity for creatives, with unmatched affordability. Learn More QGD-3014-16PT Desktop Smart Edge PoE SwitchCost-optimized intelligent IP surveillance solution Learn More QGD-1600 The world’s first smart edge switch that runs QTS and supports hosting Virtual Machines (VMs), enabling versatile applications to satisfy all your networking needs. Learn More QGD-1600P The world’s first smart PoE edge switch that runs QTS and supports hosting Virtual Machines (VMs), enabling versatile applications to satisfy all your networking needs.(Models without PoE are also available.) Learn More QSW-2104-2T-R2 4-port 2.5GbE and 2-port 10GbE Multi-Gig unmanaged switch. Affordably upgrade to high-speed networking. Learn More TS-h1277AFX High-performance all-flash NAS – Optimizing collaboration and productivity for creatives, with unmatched affordability. Learn More QGD-3014-16PT Desktop Smart Edge PoE SwitchCost-optimized intelligent IP surveillance solution Learn More Optional Accessories Storage Expansion Card Other Accessories Network Expansion Card Interface Expansion RAM QM2-2P-344A Dual M.2 PCIe SSD expansion card; M.2 2280/22110 PCIe NVMe(Gen 3x4) SSDs; PCIe Gen3x4 host interfaceDimension (L × W × H): 17.05 × 6.89 × 1.93 (cm)Weight: 0.30 (kg) QM2-2P-384 (EOL) Dual M.2 PCIe SSD expansion card; supports up to two M.2 2280/22110 formfactor M.2 PCIe (Gen3 x4) SSDs; PCIe Gen3 x8 host interface; Low-profile bracket pre-loaded, Low-profile flat and Full-height are bundledDimension (L × W × H): 19.50 × 5.30 × 12.30 (cm)Weight: 0.30 (kg) QM2-2P-384A Dual M.2 PCIe SSD expansion card; M.2 2280/22110 PCIe NVMe(Gen 3x4) SSDs; PCIe Gen3x8 host interfaceDimension (L × W × H): 17.05 × 6.89 × 1.93 (cm)Weight: 0.30 (kg) FAN-4CM-R01 40x40x25mm fan, 12V, 4PIN QNA-UC5G1T RAIL-B02 new rail kit for new 1U & 2U NAS: TVS-471U, 1253U, etcDimension (L × W × H): 73.80 × 10.00 × 7.00 (cm)Weight: 2.48 (kg) This rail kit is designed for racks with 25-inch mounting depth. You may n