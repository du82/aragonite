title = "QDA-U2MP | Use two M.2 PCIe NVMe SSD in a U.2 PCIe NVMe SSD drive bay for PC and NAS | QNAP (US)"
description = "The QDA-U2MP can accommodate two M.2 PCIe 3.0 x4 NVMe SSDs within a 2.5-inch U.2 (SFF-8639) PCIe 3.0 x4 NVMe SSD drive bay. No software driver is required for the QDA-U2MP, and it can be installed in a PC/workstation (Windows®, Linux®) or QNAP NAS to replace an expensive U.2 SSD with more-affordable M.2 SSDs."
full_description = "QDA-U2MP Use two M.2 PCIe NVMe SSD in a U.2 PCIe NVMe SSD drive bay for PC and NAS QDA-U2MP Features Features Specification Accessories Downloads Buy→ The QDA-U2MP can accommodate two M.2 PCIe 3.0 x4 NVMe SSDs within a 2.5-inch U.2 (SFF-8639) PCIe 3.0 x4 NVMe SSD drive bay. No software driver is required for the QDA-U2MP, and it can be installed in a PC/workstation (Windows®, Linux®) or QNAP NAS to replace an expensive U.2 SSD with more-affordable M.2 SSDs. 1Install two M.2 2280 (M key) PCIe NVMe SSDs in a U.2 PCIe NVMe SSD drive bay (M.2 SSDs sold separately).2Up to PCIe 3.0 x4 file transfer speeds. Architecture diagram Note: The connected drive may not reach its optimal performance due to protocol translation and some overhead. High-quality construction for better heat dissipation The M.2 SSD thermal pads and aluminum-alloy metal frame assist in dissipating heat from the M.2 SSD to ensure high performance. Install in a PC/workstation for higher performance with lower costs Use the QDA-U2MP to install two M.2 SSDs in the 2.5-inch U.2 SSD tray of a high-end PC/workstation (Windows® or Linux®), and easily deal with tasks that require intensive data transmission (such as on-the-fly video editing, server-grade applications, or online gaming). Users can use utilities from their SSD manufacturer or third-party providers (for example: CrystalDiskInfo) to view the health status of installed SSDs. Note: Consult your PC system provider if the PC operating system supports U.2 NVMe SSD. Install in QNAP NAS for efficient yet cost-effective storage Install one or more QDA-U2MP in a NAS to maximize PCIe bandwidth utilization in a cost-effective way by using M.2 SSDs instead of expensive U.2 SSD for optimizing data-intensive applications. It can also boost IOPS performance when configuring SSD caching. Users can monitor drive health and manage SSD usage from the QTS Storage & Snapshots Manager. Note: Supports QNAP NAS models that include the QDA-U2MP as optional accessory and feature the QTS 4.4.2 (or later) or QuTS hero h4.5.2 (or later): TS-h2490FU, TS-h1090FU, TS-h973AX Read Quick Installation Guide People Also Viewed QXP-3X4PES Use a PCIe Gen 3 x4 card to connect your NAS to TL PCIe Interface JBOD for storage expansion Learn More QDA-UMP4A M.2 PCIe NVMe SSD to 2.5-inch U.2 SSD adapter Learn More TS-h1277AFX High-performance all-flash NAS – Optimizing collaboration and productivity for creatives, with unmatched affordability. Learn More TL-R2400PES-RP PCIe Interface 24-bay JBOD, supporting SATA drives, for petabyte-scale expansion designed specifically for QNAP NAS Learn More QXP-820S-B3408 High-Bandwidth, Full Duplex 12Gb/s SAS Card Learn More QXP-16G2FC Add QNAP NAS to your existing Fibre Channel SAN environment with a budget-friendly solution Learn More QXP-3X4PES Use a PCIe Gen 3 x4 card to connect your NAS to TL PCIe Interface JBOD for storage expansion Learn More QDA-UMP4A M.2 PCIe NVMe SSD to 2.5-inch U.2 SSD adapter Learn More TS-h1277AFX High-performance all-flash NAS – Optimizing collaboration and productivity for creatives, with unmatched affordability. Learn More TL-R2400PES-RP PCIe Interface 24-bay JBOD, supporting SATA drives, for petabyte-scale expansion designed specifically for QNAP NAS Learn More QXP-820S-B3408 High-Bandwidth, Full Duplex 12Gb/s SAS Card Learn More QXP-16G2FC Add QNAP NAS to your existing Fibre Channel SAN environment with a budget-friendly solution Learn More Optional Accessories Other Accessories SCR-FLM25P045A-96 Screw pack for QDA top cover installation, 96 pieces, Flat head machine screwDimension (L × W × H): 1.30 × 11.50 × 0.30 (cm)Weight: 0.02 (kg) SCR-M2SSDA-96 Screw pack for M.2 SSD installation, 96 pieces, Flat head machine screw TPAD-M2SSD-03 Thermal pads kit for M.2 SSD module, silcone, 68x21x1.5mm and 68x15x1.5mm, 6pcs.Dimension (L × W × H): 11.50 × 12.50 × 0.80 (cm)Weight: 0.20 (kg)"
