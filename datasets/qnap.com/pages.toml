["https://qnap.com/en-us/product/qxp-1600es-a1164"]
title = "QXP-1600eS-A1164 | Easily expand PC and NAS storage | QNAP (US)"
description = "The QNAP QXP-1600eS-A1164 expansion card is designed for QNAP’s TL series JBOD storage enclosures that support SATA drives. The storage capacity of a QNAP NAS or Windows®/ Ubuntu® (Linux®) PC can be easily expanded by installing a QXP-1600eS-A1164 into a PCIe slot, and then connecting it to a TL series JBOD storage enclosure using an SFF-8088 or SFF-8644 cable. The low-profile card form-factor allows the QXP-1600eS-A1164 to be compatible with a wide range of NAS, computers, and servers."
full_description = "QXP-1600eS-A1164 Easily expand PC and NAS storage QXP-1600eS-A1164 Features Features Specification Buy→ The QNAP QXP-1600eS-A1164 expansion card is designed for QNAP’s TL series JBOD storage enclosures that support SATA drives. The storage capacity of a QNAP NAS or Windows®/ Ubuntu® (Linux®) PC can be easily expanded by installing a QXP-1600eS-A1164 into a PCIe slot, and then connecting it to a TL series JBOD storage enclosure using an SFF-8088 or SFF-8644 cable. The low-profile card form-factor allows the QXP-1600eS-A1164 to be compatible with a wide range of NAS, computers, and servers. Supports QNAP NAS and Windows®/Ubuntu® PCs Each SFF-8088 or SFF-8644 (internal) connector on the QXP-1600eS-A1164 supports up to four SATA drives. A QXP-1600eS-A1164 can be installed based on the number of drives you want to connect for storage expansion. For example, a QXP-1600eS-A1164 can be connected to a 16-bay desktop TL-D1600S JBOD enclosure or a 12-bay rackmount TL-R1200S-RP JBOD enclosure; it can also be connected to two 8-bay desktop TL-D800S JBOD enclosures simultaneously or connected to a 12-bay rackmount TL-R1200S-RP JBOD enclosure and a 4-bay rackmount TL-R400S JBOD enclosure simultaneously. Learn More: TL series JBOD storage enclosure Note: To update the firmware of TL JBOD storage enclosure through QTS or JBOD Manager, make sure all the device connection (including the NAS/PC, QXP SATA HBAs, and TL JBOD storage enclosures) is completed. QNAP JBOD Manager for Windows®/Ubuntu® users The QNAP JBOD Manager utility allows Windows® and Ubuntu® (Linux®) PC users to monitor the status of fans, system temperature, and drive information of TL series JBOD storage enclosures. Learn More: QNAP JBOD Manager SAS/SATA 6Gb/s external cables 1-meter (3.28 ft.) SFF-8644 to SFF-8088 cable • For QXP-1600eS-A1164 PCIe SATA card• Support SATA 6Gb/s and SAS 6Gb/s• Compatible with third-party SAS 6Gb/s JBOD productsOrder number: CAB-SAS10M-8644-8088 1-meter (3.28 ft.) SFF-8088 to SFF-8088 cable • For QXP-400eS-A1164 and QXP-800eS-A1164 PCIe SATA cards• Support SATA 6Gb/s and SAS 6Gb/s• Compatible with third-party SAS 6Gb/s JBOD products*Order number: CAB-SAS10M-8088 QNAP Accessories Store People Also Viewed QDA-UMP4A M.2 PCIe NVMe SSD to 2.5-inch U.2 SSD adapter Learn More QXP-3X4PES Use a PCIe Gen 3 x4 card to connect your NAS to TL PCIe Interface JBOD for storage expansion Learn More TS-h1277AFX High-performance all-flash NAS – Optimizing collaboration and productivity for creatives, with unmatched affordability. Learn More TL-R2400PES-RP PCIe Interface 24-bay JBOD, supporting SATA drives, for petabyte-scale expansion designed specifically for QNAP NAS Learn More QDA-U2MP Use two M.2 PCIe NVMe SSD in a U.2 PCIe NVMe SSD drive bay for PC and NAS Learn More QXP-820S-B3408 High-Bandwidth, Full Duplex 12Gb/s SAS Card Learn More QDA-UMP4A M.2 PCIe NVMe SSD to 2.5-inch U.2 SSD adapter Learn More QXP-3X4PES Use a PCIe Gen 3 x4 card to connect your NAS to TL PCIe Interface JBOD for storage expansion Learn More TS-h1277AFX High-performance all-flash NAS – Optimizing collaboration and productivity for creatives, with unmatched affordability. Learn More TL-R2400PES-RP PCIe Interface 24-bay JBOD, supporting SATA drives, for petabyte-scale expansion designed specifically for QNAP NAS Learn More QDA-U2MP Use two M.2 PCIe NVMe SSD in a U.2 PCIe NVMe SSD drive bay for PC and NAS Learn More QXP-820S-B3408 High-Bandwidth, Full Duplex 12Gb/s SAS Card Learn More Note: The actual performance result may vary by host device performance."
