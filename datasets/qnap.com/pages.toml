["https://qnap.com/en-us/product/qsw-m1204-4c"]
title = "QSW-M1204-4C | Upgrade your network with a 10GbE managed switch | QNAP (US)"
description = "The QSW-M1204-4C is a Layer 2 Web Managed Switch with eight 10GbE SFP+ ports and four 10GbE SFP+/RJ45 combo ports that enables blazing-fast transfer speeds, simultaneous multi-workstation access to large files (ideal for video editing and multimedia), and empowers bandwidth-demanding tasks like virtualization. Supporting Layer 2 switching and providing a user-friendly entry-level network management solution, the QSW-M1204-4C is an affordable way for businesses and organizations to fully embrace 10GbE connectivity. The QSW-M1204-4C is made in Taiwan (MIT), providing a high-quality and reliable networking solution."
full_description = "QSW-M1204-4C Upgrade your network with a 10GbE managed switch QSW-M1204-4C Features Features Specification Accessories Compatibility Downloads Buy→ The QSW-M1204-4C is a Layer 2 Web Managed Switch with eight 10GbE SFP+ ports and four 10GbE SFP+/RJ45 combo ports that enables blazing-fast transfer speeds, simultaneous multi-workstation access to large files (ideal for video editing and multimedia), and empowers bandwidth-demanding tasks like virtualization. Supporting Layer 2 switching and providing a user-friendly entry-level network management solution, the QSW-M1204-4C is an affordable way for businesses and organizations to fully embrace 10GbE connectivity. The QSW-M1204-4C is made in Taiwan (MIT), providing a high-quality and reliable networking solution. 10GbE connectivityIncludes four 10GbE SFP+/ RJ45 combo ports. Compatible with 10GbE and NBASE-T technologies to support five speeds (10G / 5G / 2.5G / 1G / 100M) using existing cables.User-friendly management interfaceThe QNAP Switch System (QSS) is easy to use and provides an overview dashboard, port management and setting guide, making central network management intuitive.Layer 2 networkProvides Layer 2 management features (such as LACP, VLAN, ACL and LLDP) for IT staff to efficiently control network bandwidth and enhance security.RSTP protocolOne of the few web-managed switches that supports Rapid Spanning Tree Protocol (RSTP). Easily and efficiently deploy small/medium-scale networks that support expansion, redundancy, and loop prevention.Flow ControlCompliant with IEEE802.3x Flow Control in full-duplex mode, the QSW-M1204-4C avoids packet loss from unparalleled bandwidth.Online OS updateQSS can be updated with just one click, helping IT staff ensure their network security. Flexible deployment combo ports and 10GbE / NBASE-T The 12-port QSW-M1204-4C switch includes eight SFP+ (fiber) ports, and four SFP+/RJ45 (copper) combo ports for connecting different interfaces. With RJ45 interfaces, 10GbE is supported using Cat 6a (or above) cables. Direct Attach Copper (DAC) cables can be used with SFP+ ports for connecting to servers inside a rack. The switching capacity of the QSW-M1204-4C is 240 Gbps, guaranteeing the full potential of each port. The QSW-M1204-4C is also compatible with 10GbE and NBASE-T technologies to support up to five speeds (10G / 5G / 2.5G / 1G / 100M). The SFP+/RJ45 (copper) combo ports provide higher transmission speeds with existing cables. Depending on cable types and their lengths, different speeds can be achieved for faster, more efficient data transfer. Note: If the distance between the switch and the device is less than 45 meters (148 feet), a Cat 6 cable can be used to achieve 10Gb/s speeds. Fully embrace High-Speed Networking with QNAP! From NAS with built-in 10GbE SFP+ and 10GBASE-T ports, or NAS with PCIe slots that support 10GbE network adapters, QNAP has led the industry in 10GbE adoption. Other high-speed network solutions from QNAP include Thunderbolt 3 to 10GbE Network Adapters and USB 3.2 Gen 1 to 5GbE Network Adapters. These can all be used with the QSW-M1204-4C to create a comprehensive high-speed network environment for boosting the performance of photo/video editing, virtualization, large-file data transfers, and other bandwidth-demanding tasks. Learn More: QNAP 10GbE NAS Solution, QNAP 10GbE Network Expansion Card, QNAP USB 3.2 Gen 1 to 5GbE Network Adapter, QNAP Thunderbolt 3 to 10GbE Network Adapter QSS: Intuitive Network Management Software The QNAP Switch System (QSS) features an easy-to-use Web GUI with value-added functions to simplify network set up and management. Learn More: QSS Sleek Design Use the at-a-glance major functions, flat control layers and one-click login to simplify set up and management. GUI The visual illustration matches physical ports for greater usability. Value-added With the settings guide, status chart reference, online firmware update, learning and management costs are greatly reduced. QSS: Human-centered settings guide QSS provides an overview dashboard, port management and setting guide to help administrators control Layer 2 networks. Overview Dashboard View real-time system information, port connection status and port traffic. Port Management View port status, port packet statistics, and configure port speeds. Setting Guide Quickly learn how to set up the network using the introduction and step-by-step guide. Exclusive Status Chart Referencing Refer to four major status charts during each configuration to avoid going back and forth between different setting pages. Online Firmware Check and Update Keep your QSW-M1204-4C secure with one-click firmware updates Optimize Network Performance with bandwidth and packet control The QSW-M1204-4C provides bandwidth and packet control functions (such as LACP, VLAN, QoS, and IGMP Snooping) to boost network performance through IP grouping and bandwidth management. LACP VLAN QoS IGMP Snooping Link Aggregation (LAG) combines multiple network connections to increase throughput and protect against connection failure. Virtual Networks (VLAN) allows groups of devices from different networks to be combined into a single network. QoS (Quality of Service) helps prioritize bandwidth usage to optimize network resource allocation. IGMP snooping assists in minimizing bandwidth loss and preventing network information leakage. Powerful security and system functions The QSW-M1204-4C has powerful security and system functions (including ACL, LLDP, RSTP and Flow Control) to help administrators enhance network reliability using access controls, troubleshooting, loop prevention and avoiding packet loss. ACL LLDP RSTP Flow Control - Access controls- Security system - Device disclosure- Troubleshooting - Loop prevention- Backup path - Balance speed- Jam prevention Versatile installation and sleek appearance The QSW-M1204-4C features a sleek modern design that blends in with modern digital homes and offices. A Rackmount Kit is included to provide extra installation options. People Also Viewed TS-832PX High-capacity NAS with 10GbE SFP+ and 2.5GbE, Supports PCIe Expansion for M.2 SSDs to Accelerate Applications Learn More QSW-3205-5T Effortless 10G speed with the cost-effective 5-port 10GbE Unmanaged Switch Learn More QSW-2104-2T-R2 4-port 2.5GbE and 2-port 10GbE Multi-Gig unmanaged switch. Affordably upgrade to high-speed networking. Learn More TS-216G The most affordable 2-bay 2.5GbE QNAP NAS. Your most reliable file management center. Learn More TS-h1277AFX High-performance all-flash NAS – Optimizing collaboration and productivity for creatives, with unmatched affordability. Learn More QSW-M2116P-2T2S 90-watt 10GbE PoE++ and 30-watt 2.5GbE PoE+ Managed Switch for the Wi-Fi 6 Generation Learn More TS-832PX High-capacity NAS with 10GbE SFP+ and 2.5GbE, Supports PCIe Expansion for M.2 SSDs to Accelerate Applications Learn More QSW-3205-5T Effortless 10G speed with the cost-effective 5-port 10GbE Unmanaged Switch Learn More QSW-2104-2T-R2 4-port 2.5GbE and 2-port 10GbE Multi-Gig unmanaged switch. Affordably upgrade to high-speed networking. Learn More TS-216G The most affordable 2-bay 2.5GbE QNAP NAS. Your most reliable file management center. Learn More TS-h1277AFX High-performance all-flash NAS – Optimizing collaboration and productivity for creatives, with unmatched affordability. Learn More QSW-M2116P-2T2S 90-watt 10GbE PoE++ and 30-watt 2.5GbE PoE+ Managed Switch for the Wi-Fi 6 Generation Learn More Optional Accessories Other Accessories Cable / Transceiver SP-EAR-QSWSTANDARDRACK-01 Standard rack mount unit size usage, design for single installation into single unit space of rack mount.Dimension (L × W × H): 9.82 × 6.41 × 3.50 (cm)Weight: 0.37 (kg) TRX-10GITSFPP-SR Optical Transceiver 10GbE SFP+ 850nm SR up to 300m industrial-temperature(-40~85°C )Dimension (L × W × H): 5.98 × 1.40 × 1.20 (cm)Weight: 0.08 (kg) TRX-10GSFP-SR-MLX Mellanox MFM1T02A-SR SFP+ Optical Module for 10GBASE-SRD