["https://qnap.com/en-us/customer-stories/tvs-h1288x-redeszone"]
title = "RedesZone | QNAP (US)"
description = "QTS is the operating system for entry- and mid-level QNAP NAS. WIth Linux and ext4, QTS enables reliable storage for everyone with versatile value-added features and apps, such as snapshots, Plex media servers, and easy access of your personal cloud."
full_description = "RedesZone RedesZone The TVS-h1288X NAS as the heart of the organization IT – an all in one virtualized router with pfSense, home automation and centralized file server. To view this video please enable JavaScript, and consider upgrading to a web browser Customer RedesZone Industry IT & Engineering Product TVS-h1288X Tell us your challenge I installed the TVS-h1288X NAS to be the hub of the entire local network acting as the main router with virtualized pfSense, and also to control home automation, with excellent results right out of the box. - Sergio de Luz, Director of RedesZone Background The ADSLZone Group was started in 2003 as an IT forum. Over the years, it launched vertical services, including RedesZone, a website specializing in networking, security, and storage. The customer uses these solutions Start a virtual machine on NAS Use Virtualization Station to host virtual machines for virtualized server applications, and further improve virtual machine performance with hardware acceleration. Learn More Start a container on NAS Run your microservices using Container Station that integrates Docker®, LXD, and Kata Containers lightweight virtualization technologies. Learn More Hybrid cloud solutions QNAP offers easy yet solid solutions for enterprises to build hybrid cloud infrastructure. Learn More Backup, Restoration & Sync for NAS Use Hybrid Backup Sync to double up your protection by quickly backing up your NAS to remote and cloud storage spaces – ideal for building a complete 3-2-1 backup and recovery plan. Learn More Start a virtual machine on NAS Use Virtualization Station to host virtual machines for virtualized server applications, and further improve virtual machine performance with hardware acceleration. Learn More Start a container on NAS Run your microservices using Container Station that integrates Docker®, LXD, and Kata Containers lightweight virtualization technologies. Learn More Hybrid cloud solutions QNAP offers easy yet solid solutions for enterprises to build hybrid cloud infrastructure. Learn More Backup, Restoration & Sync for NAS Use Hybrid Backup Sync to double up your protection by quickly backing up your NAS to remote and cloud storage spaces – ideal for building a complete 3-2-1 backup and recovery plan. Learn More Challenges Sergio de Luz, Director of RedesZone, previously built entire local networks at home with a carrier router and multiple switches without VLAN support. His SOHO required upgrading to a segmented network for product testing and personal use (such as computers and smart TV). From early on Sergio realized that virtualizing the router with pfSense was the most suitable solution for his use scenarios, plus it also avoids single point of failure. In addition, Sergio also wanted a server for installing Home Assistant (home automation software). A possible solution to both challenges was to get dedicated hardware for pfSense, but this involves buying a server with 10GbE cards and installing the operating system that can run as the main virtualized router. That would cost a lot in both hardware and electricity bills. Solution Sergio chose one of the QNAP's top-of-the-line desktop NAS, the TVS-h1288X, as a main virtualized router with pfSense running on Virtualization Station, and Home Assistant running on Container Station. TVS-h1288X’s features - Intel Xeon processor with 6 cores and 12 threads, it has enough power to manage several VMs simultaneously. - 64 GB RAM is more than enough for his current use, but is expandable to 128 GB for future growth. - Twelve drive bays, and dual M.2 NVMe slots for running VMs increasing IOPS performance and reducing latency for storage volumes. - Dual 10GbE ports and four 2.5GbE ports as standard. The powerful TVS-h1288X allows him to run multiple VMs such as pfSense or Home Assistant without hardware issues. Sergio also has full 10Gb network performance with Cat 8 cables. Of course, NAS is used as a file server as well – and Sergio uses Hybrid Backup Sync to back up his files. Public cloud storage can also be easily mounted on the NAS using HybridMount. Sergio usually manages his NAS with a web GUI, but he also has the SSH server enabled in case of running something via commands. Result Sergio states that his TVS-h1288X has been in constant 24/7 operation for more than 6 months, including installing several updates of both QuTS hero operating system and pfSense. The network has been stable, and it runs fast at 10 Gbps in local, and 4.5 Gbps in VLAN routing with pfSense. Sergio is convinced his use scenario, using a NAS as the heart of the whole company IT, can be beneficial for other IT specialists who work from home as it is no longer necessary to go to office where servers are located. Explore more from our customers All Customer stories David Amorín - CEO of Jotelulu Increasing security is one of Jotelulu's strategic pillars. QNAP, through integration, puts us in touch with the local environment and gives us the possibility to continue to contribute in terms of resilience and business continuity. It is a great opportunity to continue creating value in the IT and SME sector. ▶ ▶ Pablo García, PhD in Industrial Engineering at Beamagine SL and project collaborator. Thanks to the TS-h886 NAS and its virtual machine with LXC container, we can visualize the data from all the 3D and 2D image sensors installed in a car in real time while recording them securely, robustly and efficiently, without affecting the system's overall performance. ▶ ▶ Luis Yáñez – Founder & Consultant of Difoosion. With QNAP, we have turned chaos into clarity. What once was a disjointed and expensive process, is now a unified and efficient work flow that boosts our productivity. ▶ ▶ Global SP QNAP TS-h977XU-RP NAS and solutions help Global SP provide customers services with higher security at reduced costs. ▶ ▶ All Customer stories"
