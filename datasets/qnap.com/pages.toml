["https://qnap.com/en-us/product/qucpe-3032"]
title = "QuCPE-3032 | Network Virtualization Premise Equipment with an Intel® Atom Refresh quad-core processor, suitable for deploying virtual networks in multiple edge offices | QNAP (US)"
description = "QNAP’s QuCPE-3032 Network Virtualization Premise Equipment is a universal virtualization platform specifically designed for SMBs. The QuCPE-3032 adopts the high-performance Intel® Atom Refresh quad-core processor that supports Intel® QAT, Smart NIC SR-IOV and DPDK hardware acceleration technologies while also providing eight 2.5GbE RJ45 ports and two 10GbE SFP+ ports. With enhanced bandwidth and computing performance for running VNFs and connecting SD-WAN (Supporting VPN/WireGuard), the QuCPE-3032 is suitable for multi-user and multi-tasking business applications. The QuCPE-3032 also features the QNE (QNAP Network Equipment) OS for chaining VNF services and AMIZcloud centralized deployment and management platform to realize flexible Zero Touch Provisioning."
full_description = "QuCPE-3032 Network Virtualization Premise Equipment with an Intel® Atom Refresh quad-core processor, suitable for deploying virtual networks in multiple edge offices QuCPE-3032 Features Features Specification Accessories Compatibility Downloads Buy→ QNAP’s QuCPE-3032 Network Virtualization Premise Equipment is a universal virtualization platform specifically designed for SMBs. The QuCPE-3032 adopts the high-performance Intel® Atom Refresh quad-core processor that supports Intel® QAT, Smart NIC SR-IOV and DPDK hardware acceleration technologies while also providing eight 2.5GbE RJ45 ports and two 10GbE SFP+ ports. With enhanced bandwidth and computing performance for running VNFs and connecting SD-WAN (Supporting VPN/WireGuard), the QuCPE-3032 is suitable for multi-user and multi-tasking business applications. The QuCPE-3032 also features the QNE (QNAP Network Equipment) OS for chaining VNF services and AMIZcloud centralized deployment and management platform to realize flexible Zero Touch Provisioning. Network Function VirtualizationThe QuCPE-3032 is powered by QNAP’s proprietary QNE operating system, providing convenient and intuitive Network Service Composer with the world’s first visualized VM / VNF service chaining topology.Multi-site Network InfrastructureThe incorporated QuWAN SD-WAN solution helps achieve multi-site network infrastructure expansion.Hardware Acceleration TechnologiesIntel® QAT, Smart NIC SR-IOV and DPDK hardware acceleration technologies offer superior computing power for virtualization deployment and enhance SD-WAN and VPN transmission efficiency.Cloud ManagementAMIZcloud is a centralized management platform that enables HQ-based IT staff to centrally monitor all edge devices, virtual machines, and containers. The QuCPE-3032 helps enterprises achieve Zero Touch Provisioning to enhance IT deployment efficiency and reduce maintenance costs.Installation-On-DemandThe Application Store is a software platform providing various Virtualized Network Functions (VNF) and applications including firewalls and software routers.WireGuard VPNSupports WireGuard VPN to offer privacy protection and advanced encrypted security transmission for faster and stable remote working networks. Available Models QuCPE-3032-C3558R-8G QuCPE-3032-C3558R-8G Intel® Atom Refresh C3558R 4-core/4-thread 2.4GHz processor, 8 GB DDR4 ECC memory (1 x 8GB); 2 x 10GbE SFP+ ports、8 x 2.5GbE RJ45 ports Build a multi-site network infrastructure for SMBs and Micro-enterprises QNAP’s high-performance QuCPE integrates the QuWAN SD-WAN solution, AMIZcloud platform, and WireGuard VPN. Small businesses and micro-enterprises can flexibly build multi-site network infrastructure by deploying a QuCPE Series 7 in their headquarters, and QuCPE Series 3 in their branches and workplaces. Easily deploy virtual network environments with the 2-in-1 Premise Equipment When deploying virtualized environments, Enterprises often choose to install costly enterprise-grade solutions on edge servers or free solutions with limited technical support – a hard decision for resource-constricted SMBs. In addition, simultaneously running multiple VMs can impact network performance. QNAP’s QuCPE Network Virtualization Premise Equipment combines hardware acceleration technologies, QNAP’s proprietary QNE Network operating system and the AMIZcloud centralized management platform to help SMBs build a highly-optimized virtual network infrastructure. The QNE Network Operating System completes your virtual network infrastructure QNAP’s proprietary QNE Network operating system supports the intuitive Network Service Composer and Software-Defined WAN (SD-WAN), allowing for flexible network deployment and multi-site network infrastructure expansion. By supporting Virtual Network Functions (VNF), Virtual Machines and Containers, QNE Network integrates network, computing, and application services to realize network virtualization, application virtualization and efficient management, greatly lowering management and maintenance complexity. Learn More: QNE Network AMIZcloud - powerful centralized VM management platform The AMIZcloud centralized management platform enables HQ-based IT staff to centrally monitor all edge devices, virtual machines, and containers. Supporting troubleshooting, and remote management via the Account Center, the QuCPE-3032 helps enterprises achieve Zero Touch Provisioning, thus enhancing IT deployment efficiency and reducing maintenance costs. Learn More: AMIZcloud Efficient management via Service Composer with visualized topology With the visualized topology of the Network Service Composer, you can easily set up VNFs or VMs, create virtual switches, and allocate physical network resources for chained services by drag and drop. When settings change, you can directly add/remove individual VNFs using the service composer, greatly simplifying operational network combination. Learn More: Service Composer, QNE Network Manager SD-WAN enables chaining network services QNE incorporates QNAP’s QuWAN SD-WAN solution (subscription-free) to form encrypted VPN tunnels with other QNAP devices based in multiple sites and achieve multi-site network services chaining. For example, you can automatically create a firewall network (using QuWAN and pfSense VNFs) to enhance WAN security in the Service Composer UI using drag-and-drop. Learn More: QuWAN, Deploying QVPN Server via Cloud, QVPN Service with WireGuard Optimize LAN/WAN performance Service Composer also supports SR-IOV and QuWAN SD-WAN, which greatly improves the WAN transmission of the QuCPE-3032 that runs QuWAN, while also helping users to enjoy high-speed and secure LAN and WAN network transmission at the same time. Enhanced security You can automatically create a firewall network (using QuWAN and pfSense VNFs) to enhance WAN security in the Service Composer UI using drag-and-drop. Run your VM/VNF Directly on QuCPE QNE Network inherits versatile virtual applications from the QNAP QTS system. QuCPE can simultaneously run multiple virtual machines, software containers, and even bespoke user-made virtual machines in Virtualization Station and Container Station, assisting SMBs in improving deployment and management flexibility while streamlining hardware costs. Near-zero service downtime with High Availability By installing and configuring HA Manager App, QuCPE-3032 supports Active-Standby High Availability system which enables failover from a primary QuCPE host to a secondary QuCPE host equipped with the same services. Without onsite maintenance, Device HA technology guarantees near-zero service downtime on QuCPE. Intel hardware acceleration technologies boost virtual network performance Specifically designed for running virtualization applications, the QuCPE-3032 Network Virtualization Premise Equipment adopts multiple Intel hardware acceleration technologies to allow direct hardware access, thus enhancing VM and virtual network transmission performance. DPDK (Data Plane Development Kit)Allows data to bypass the OS Kernel and directly enter user space to offer a double packet transmission rate (Total T/R x L2) and improve overall virtualization application performance.Smart NIC SR-IOV (Single Root I/O Virtualization)By installing an SR-IOV compatible PCIe SmartNIC, you can allocate bandwidth resources from a physical network card directly to VMs. With traffic bypassing the Hypervisor vSwitch, it helps enhance I/O throughout and network efficiency, ensuring reliable VM applications and reduced CPU overheads.Intel QAT (Intel QuickAssist Technology)Offloads computationally-intensive compression and improves IPsec cryptography VPN performance. Smart IT tools for network management efficiency QNE Network provides comprehensive management features for Smart IT network management. Notification CenterConsolidates QTS system events and alerts, providing a single-app solution for notifications instead of having to configure individual settings in multiple apps. Notifications can be sent through email, SMS, and other communication apps.QuLog CenterCentralizes statistical rankings of error/warning events and access, assisting IT staff in monitoring and responding to potential system risks.Security CenterProvides security management for IT staff, including managing SSL certificates. Other features include automatically detecting history edits to prevent malicious edits.ZabbixZabbix is a third-party solution that automatically detects devices and monitors network status. Zabbix provides user-friendly topology and network reporting, suitable for enterprise network management. Supports third Party Virtual Network Functions The Application Store and VM Marketplace provides multiple free and premium VNF and applications that users can install on demand. Firewall Software Virtual firewall software (like pfSense) help enterprises separate or protect local networks and apply multiple security policies.Learn more: QNAP x pfSense Virtual Router The QuCPE-3032 can be transformed into a security router by installing RouterOS or OpenWrt. Create site-to-site VPN tunnels between HQ and branch offices while securing enterprise network data transmission. Learn more: Deploy MikroTik RouterOS router software with a QNAP NAS, Deploy pfSense, RouterOS or OpenWrt router software using Virtualization Station Notes QuCPE QNE Network allocates the full capacity of the M.2 SSDs to be an Application Volume. VM, Container and vDisk data is stored in the Application Volume by default. If two identical M.2 SSDs are installed in the QuCPE-3032, they will be configured as RAID 1 by default in QNE Network Edition. All the storage management features in the QTS OS (such as creating storage pools for file storage and Snapshots) are not supported by QuCPE QNE Network Edition. People Also Viewed QuCPE-3034 Network Virtualization Premise Equipment with an Intel® Atom Refresh eight-core processor, suitable for deploying virtual networks in multiple edge offices Learn More QMiroPlus-201W Next-Generation 2.5GbE NAS and SD-WAN Router Learn More QGD-1602 Smart Edge Switch with 2.5GbE and 10GbE Capability Learn More QuCPE-7012 Network Virtualization Premise Equipment with an Intel® Xeon D multi-core processor, suitable for multi-user and multi-tasking business applications. Learn More QuCPE-3034 Network Virtualization Premise Equipment with an Intel® Atom Refresh eight-core processor, suitable for deploying virtual networks in multiple edge offices Learn More QMiroPlus-201W Next-Generation 2.5GbE NAS and SD-WAN Router Learn More QGD-1602 Smart Edge Switch with 2.5GbE and 10GbE Capability Learn More QuCPE-7012 Network Virtualization Premise Equipment with an Intel® Xeon D multi-core processor, suitable for multi-user and multi-tasking business applications. Learn More Optional Accessories Other Accessories RAM SP-EAR-QSWSTANDARDRACK-01 Standard rack mount unit size usage, design for single installation into single unit space of rack mount.Dimension (L × W × H): 9.82 × 6.41 × 3.50 (cm)Weight: 0.37 (kg) HS-M2SSD-02 Heatsink for M.2 SSD module;68*19.8*1MM;Dark Green; 2PCSDimension (L × W × H): 2.50 × 8.00 × 7.80 (cm)Weight: 0.10 (kg) HS-M2SSD-03 M.2 SSD HEATSINK PACKAGE;6 PCS;V1.0Dimension (L × W × H): 2.50 × 22.20 × 8.00 (cm)Weight: 0.25 (kg) RAM-8GDR4A0-UD-2400 DDR type: DDR4(288PIN)Capacity: 8GBSpec: 1024M X 8Frequency: DDR4-2400Form(PIN): 288PINPower Supply: 1.2VDram Organization: 1024M*64Temperature: 0℃~85℃Environmental Regulation: RoHS"
