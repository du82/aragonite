["https://qnap.com/en-us/customer-stories/qgd-1602p_marunaka"]
title = "Marunaka Transportation | QNAP (US)"
description = "QTS is the operating system for entry- and mid-level QNAP NAS. WIth Linux and ext4, QTS enables reliable storage for everyone with versatile value-added features and apps, such as snapshots, Plex media servers, and easy access of your personal cloud."
full_description = "Marunaka Transportation Marunaka Transportation QNAP's ADRA NDR appliances provides cost-effective protection against targeted ransomware for small business. Customer Marunaka Transportation Industry General Enterprises Product QGD-1602P QGD-1600P Tell us your challenge We are amazed at the network risk visualization, rapid network isolation, and stable operation of QNAP’s low-cost ADRA NDR. - Mutsuo Nakato, CEO of Marunaka Transportation Background Marunaka Transport is a logistics company in Japan. With the recent increase in system failures and damage caused by ransomware attacks throughout the industry, Marunaka recognized the need to take measures against data breaches and network attacks to maintain the trust of their customers. Previous challenges The IT infrastructure of the transportation industry is essential for normal operations, and if a system failure occurs it is difficult to continue business operations and may cause losses. Therefore, high security and performance is required for network equipment, but at the same time, it is necessary to take into consideration the fact that large IT investment is not possible for small companies. Marunaka Transportation's system administrators urgently needed a security solution that could be built within their budget. Solution The system administrator of Marunaka deployed QNAP QGD-1602P and QGD-1600P ADRA NDR appliances, which are smart edge switches with advanced network traffic monitoring and security features. ADRA detects and analyzes lateral movements of malware activities at the access layer of the network, which is difficult to prevent with general security appliances, and quarantines infected clients from the network to prevent the spread of infection to other clients. Since only a portion of network traffic is checked, ADRA detection does not affect throughput in storage and services. The customer uses these solutions Network Security (Network Detection and Response, NDR) QNAP ADRA (Network Detection and Response, NDR) protects sensitive data in LAN devices from malware attacks. Learn More Network Security (Network Detection and Response, NDR) QNAP ADRA (Network Detection and Response, NDR) protects sensitive data in LAN devices from malware attacks. Learn More Result Currently, two ADRAs are in operation as the core switch and distribution switch. Approximately thirty Windows PCs are connected to the network for the mission-critical business system, and printers and other vendor NAS are also installed. After migrating from the test environment to the production environment, system administrators have realized the following benefits: Real-time traffic monitoring: The ADRA NDR appliance monitors network traffic in real time and can detect suspicious activity or unusual behavior. This allows for quicker detection and responsesd to unauthorized access or network attacks. Enhanced security: The advanced security features of the ADRA NDR appliances enable better protection of the company's critical data and customer information. The risk of data breach is reduced, allowing employees to focus on their core business with peace of mind and improved work efficiency. Faster troubleshooting: In the past, it took a long time to identify and resolve network issues, but the log information and traffic analysis of the ADRA NDR appliance enables issues to be identified and addressed quickly. As a result, with the installation of QNAP's ADRA NDR appliance, Marunaka Transportation has strengthened its security measures and provided securer and more reliable services to its customers. In addition, operational efficiency has also been improved through faster trouble resolution and network optimization. Explore more from our customers All Customer stories IT Manager, Holland Mechanics China QNAP NAS exceeded our expectations. Its powerful performance and flexibility have transformed our IT operations, driving remarkable efficiency. ▶ ▶ Michal Jedlicka, Systems Architect QNAP family products are an integral part of our development infrastructure and allow us to respond flexibly to our needs. ▶ ▶ Daniele Sacchetti – IT manager, Lomec Ingranaggi S.r.l. We chose QNAP's NDR ADRA because of their ability to discover potential threats that firewalls cannot detect. What's more, the “Honeypot” feature is great. It attracts attackers, identifies source IPs, and automatically blocks threats, alerting IT administrators in real time. ▶ ▶ Ing. Errico Di Domenico – Operation Manager, Centrale del Latte di Salerno Through its LAN ports, QNAP ADRA NDR provides security for networked NAS by rapidly detecting ransomware and similar threats. ▶ ▶ All Customer stories"
