title = "HS-264 | Silent and lightweight home NAS for multimedia playback and streaming with dual HDMI™  2.0 4K output | QNAP (US)"
description = "Designed as a multimedia center for digital homes, the HS-264 provides various apps and utilities (such as QuMagie, Video Station, Music Station, and Plex Media Server) for storing and enjoying all your photos, videos, and music. High performance and streaming quality are ensured by an Intel® Celeron® N5105 quad-core processor and two 2.5GbE ports, while the dual HDMI™  2.0 (4K @60Hz) output enables you to use the HS-264 as a Home Theater PC for an amazing entertainment experience.The HS-264 uses the QTS operating system by default. You will be able to switch to using the QuTS hero operating system. QuTS hero provides benefits such as ZFS data integrity and WORM technology to prevent data tampering. (Switching to QuTS hero is supported starting from QTS 5.2.1.)"
full_description = 'HS-264 Silent and lightweight home NAS for multimedia playback and streaming with dual HDMI™ 2.0 4K output Watch Video Review HS-264 Features Features Specification Expansion Accessories Compatibility Downloads Buy→ Designed as a multimedia center for digital homes, the HS-264 provides various apps and utilities (such as QuMagie, Video Station, Music Station, and Plex Media Server) for storing and enjoying all your photos, videos, and music. High performance and streaming quality are ensured by an Intel® Celeron® N5105 quad-core processor and two 2.5GbE ports, while the dual HDMI™ 2.0 (4K @60Hz) output enables you to use the HS-264 as a Home Theater PC for an amazing entertainment experience.The HS-264 uses the QTS operating system by default. You will be able to switch to using the QuTS hero operating system. QuTS hero provides benefits such as ZFS data integrity and WORM technology to prevent data tampering. (Switching to QuTS hero is supported starting from QTS 5.2.1.) 2.5GbE connectivitySupercharge your media streaming and file sharing with two 2.5GbE ports. Up to 5 Gbps transfer speeds can be made by setting port trunking.4K HDMI™ outputDual HDMI™ 2.0 output for direct 4K HD media playback. Supports 4K media streaming and transcoding.Silent operationThe fanless, low vibration design keeps the HS-264 cool and quiet while also preventing dust buildup.Home entertainment centerCentrally store and easily access your photos, music, and videos with the HS-264. Snapshot protection against RansomwareProtect your files and data from accidental deletion and malware attacks with snapshots that fully record the system status and data.Secure remote accessAccess your files and multimedia at any time with the simple and secure myQNAPcloud remote access service. HS-264 2022-12-21 Gold Award - Hardwaresfera (Spain) (2022/12/21) "The features of the QNAP HS-264 NAS are top-notch. A good amount of RAM, a good processor to be able to have 4K quality playback, as long as the content is." Available Models HS-264-8G HS-264-8G Intel® Celeron® N5105 4-core/4-thread processor, burst up to 2.9 GHz, 8 GB, not expandable Your ideal home entertainment center Featuring a modern set-top design, the HS-264 fits perfectly alongside your TV, receiver, games consoles, and other elements of a modern digital lifestyle. Equipped with two USB 3.2 Gen2 Type-A ports and dual HDMI™ 2.0 (4K @60Hz) output, the HS-264 provides all the necessary connections for consolidating and enjoying an amazing multimedia experience. Quieter in your office, easier to set up Ideal for office environment Noise used with SSD Noise used with HDD True 4K, greater multimedia enjoyment than ever Featuring advanced Intel® UHD Graphics 600, the HS-264 supports dual-channel 4K H.264 hardware decoding and real-time transcoding, allowing you to convert videos to universal file formats that can be smoothly played on multiple devices*. *The HS-264’s hardware provides H.264 hardware decoding, encoding and transcoding capabilities. However, playback quality may vary due to factors including playback software, file formats, system usage, and available bandwidth. Smooth file transfer with enhanced 2.5GbE connectivity Powered by an Intel® Celeron® N5105 quad-core 2.0 GHz processor, 8GB DDR4 RAM, and supporting SATA 6Gb/s hard drives, the HS-264 provides high read/write performance. Smooth file transfer is ensured with two 2.5GbE ports, supporting up to 5Gbps when used in a Port Trunking configuration. HS-264 features two 3.5/ 2.5-inch SATA drive bays for reliable read and write performance. Note: To avoid excess vibration and heat generation, it is recommended to use 5400 RPM hard drives or low-temperature/low-noise NAS hard drives with the HS-264. Check compatibility list. SMB Sequential Throughout (2.5 GbE x 2) Write MB/s Read MB/s iSCSI Random 4K IOPS (2.5 GbE x 2) Write IOPS Read IOPS SMB Sequential Throughout (2.5 GbE x 2) Write MB/s Read MB/s iSCSI Random 4K IOPS (2.5 GbE x 2) Write IOPS Read IOPS Tested in QNAP Labs. Figures may vary by environment. Learn more about test environment. Connect to a TV or Monitor with HDMI™ With HDMI™ output, the HS-264 allows you to directly enjoy multimedia content, use web browsers, manage your NAS, or watch recorded surveillance footage or live feeds on your NAS. HybridDesk Station Your HS-264 not only provides storage for your multimedia, but it can also be used as a Home Theater PC! Connect the HS-264 to an TV or A/V Receiver with HDMI™ , install HybridDesk Station, and easily watch movies or play music using the QNAP remote control (sold separately) or the Qremote mobile app. Learn More Use your NAS as a PC Simply connect a keyboard, mouse, and HDMI™ display to the HS-264 to use it as a PC - directly accessing your NAS files and services, and browsing the Internet with Google Chrome™ and Firefox® are just that easy. Ultimate visual experience with 4K HDMI™ output The HS-264 has an HDMI™ 2.0 port which supports 4K (3840 x 2160) 60Hz output. The best storage for your high-resolution multimedia files High-resolution RAW files eat up phone storage so quickly. Whether you are a photographer enthusiastic, YouTuber, or professional photo/video editors, use the HS-264 with high-capacity hard drives to alleviate your storage anxiety and organize files efficiently as the best storage center. Storage for massive photos The AI-powered QuMagie with intelligent face and object recognition brings you the ultimate photo management and sharing solution. Includes timeline scrolling, customizable folder covers, iOS® Live Photo display, a powerful search tool, and more. Learn More: AI-powered QuMagie, QuMagie Mobile App Storage for music collections Use Music Station to collect and play lossless music, sing along with lyrics, and share albums, playlists or folders with friends and family. You can also put tons of music right in your pocket using the Qmusic mobile app. Learn More: Music Station, Qmusic mobile app App Store high-resolution videos Centrally collect GoPro diaries, videos of your family, friends, and pets in Video Station, and easily share your favorites. Take all your videos with you on your mobile devices using the Qvideo mobile app. Learn More: Video Station, Qvideo mobile App Faster image identification with integrated Intel® OpenVINO™ AI engine. With integrated Intel® OpenVINO™ AI computing resources, the HS-264 accelerates AI image recognition performance without impacting other applications or services. QNAP AI Core primarily works with the QuMagie application. QuMagie photo management Easy-to-use photo management solution that integrates AI image recognition and intelligent classification for your collection. With GPU acceleration % Performance boost Tested in QNAP Labs. Figures may vary by environment and NAS models.Test environment: NAS: TS-364 Stream all your media to every device in the house The HS-264 is a complete multimedia center, allowing fast and easy streaming for photos, music and video to TVs, computers and mobile devices. Plex multimedia streaming By installing Plex® Media Server from the App Center, you can stream media files stored on the HS-264 to mobiles and media streaming devices (including DLNA®, Roku®, Amazon Fire TV® and Google Chromecast™). Learn More Stream to Android TV™ or Apple TV® Qmedia is QNAP’s exclusive streaming app, allowing streaming audio, photos, and videos from the HS-264 to Android TV™, Apple TV® (via Qmedia) or set-top boxes. Learn More Apple TV Amazon Fire TV Roku DLNA PLEX Qmedia Access your NAS from anywhere The myQNAPcloud service enables quick and easy remote access to your HS-264, allowing you to be always connected without needing to configure complex network settings. With myQNAPcloud Link you are provided with a unique domain name for your HS-264, and will automatically connect using the best method based on your network environment. Learn More: myQNAPcloud service Protect your data from ransomware threats with Snapshots Snapshots are an advanced backup method and are normally reserved for high-end business NAS. QNAP provides snapshots as standard for all NAS – including the HS-264. Snapshots work by recording the current state of the system, allowing it to be restored back this state at any time - greatly helping in mitigating the threat of ransomware. Read the guide for home data protection against ransomware 1. Back up PCs to your NAS Always remember to back up! You should routinely (or automatically) back up files and data from your computer to your HS-264. 2. Take snapshots within seconds Instantly take snapshots to record the current state of your system and data. You can quickly restore files and data to a previously recorded state by selecting a snapshot version from a specific time point. 3. Back up snapshots Multiply data protection by backing up snapshot files! Replicate snapshots in the HS-264 to a remote NAS (Snapshot Replica) and only copy the changes made. This helps save time & bandwidth, and can be run manually or on a scheduled basis. 4. Restore data using snapshots Snapshot content can be quickly restored to a local NAS, or restored on a folder/file basis to a local/remote NAS or cloud storage. You can also conveniently view and restore snapshots from the client side. 1 2 3 4 Back up PCs to your NAS Always remember to back up! You should routinely (or automatically) back up files and data from your computer to your HS-264. Take snapshots within seconds Instantly take snapshots to record the current state of your system and data. You can quickly restore files and data to a previously recorded state by selecting a snapshot version from a specific time point. Back up snapshots Multiply data protection by backing up snapshot files! Replicate snapshots in the HS-264 to a remote NAS (Snapshot Replica) and only copy the changes made. This helps save time & bandwidth, and can be run manually or on a scheduled basis. Restore data using snapshots Snapshot content can be quickly restored to a local NAS, or restored on a folder/file basis to a local/remote NAS or cloud storage. You can also conveniently view and restore snapshots from the client side. Flexible and economical storage expansion QNAP provides easy and affordable solutions to expand your NAS storage capacity. Attach QNAP expansion enclosures Connect expansion enclosures to the HS-264, and manage NAS storage expansion with the user-friendly Storage & Snapshots Manager app. Learn More Migrate to a new NAS Install your NAS hard drives into a larger QNAP NAS and retain all your existing data and configurations. Learn More Upgrade RAID capacity Hot-swap lower-capacity drives with larger-capacity drives to expand your NAS capacity so it can grow with your files and multimedia collections. Learn More Switch to QuTS hero operating system for optimal data integrity and reliability The HS-264 also supports QuTS hero - QNAP’s ZFS-based NAS operating system, providing end-to-end data integrity, WORM protection, data reduction (inline data deduplication, compression, and compaction), and much more. FAQ QuTS hero hardware requirements At least 8GB RAM. At least 16GB RAM for Inline Data Deduplication. 32GB memory is recommended for optimal performance. It is recommended to create an SSD RAID with at least two SSDs to attain optimal system performance. Please note that M.2 SSD hot-swapping is not supported. Understand hardware requirement before switching to QuTS hero What’s the difference between QTS and QuTS hero? What’s the difference between QTS and QuTS hero? QTS and QuTS hero are QNAP NAS operating systems which are best suited for different use cases. Click here to learn more QTS Suited for cross-teams file sync, and HDD-SSD hybrid storage applications. QuTS hero Provides higher data protection and data reduction. Is optimized for SSD-based applications. You cannot switch a NAS OS with disks installed. You must back up NAS data to another storage space (such as a cloud), remove all disks from the NAS, and then switch OS. Learn how Learn More How to migrate data from an old NAS? How to migrate data from an old NAS? QTS and QuTS hero operating systems use different file systems. When you want to migrate an old NAS data to a new NAS, your action-taking will depend on your current situation. Please take proper actions to avoid irreversible data loss. If you want to… 1. Migrate data from an old NAS to a new NAS, but both OS are differentYou cannot migrate system settings and data by simply moving current disks to a new NAS. You must back up old NAS data to a new one using Hybrid Backup Sync. Learn how-to If you want to… 2. Migrate data from an old NAS to a new NAS with a same OSYou can migrate system settings and data with few initial settings and moving drives. Please note that you must remove all the disks of the new NAS before switching its operating system (if needed). Learn how-to Learn More Protect your data with higher security The HS-264 provides advanced privacy and security settings but is easy to set up and use. Besides IP blocking and HTTPS connectivity, there are more apps that help ensure an optimal level of NAS protection against threats like malware and hackers. Advanced folder permissions Easily manage folder permissions, specifying read, read/write, and deny access of individual users to each folder and subfolder. QuFirewall protection Supports IPv6, firewall access lists, and GeoIP filtering to restrict access based on geographical locations for higher NAS network security. Learn More: QuFirewall Extend hardware warranty up to 5 years The HS-264 is backed by a 2-year warranty at no additional cost. You can also purchase a warranty extension that extends your warranty coverage up to 5 years. Learn More How to choose a lightweight NASBook? Fanless Silent NASHS-264 NASbook in your briefcaseTBS-464 10GbE-ready Silent NASHS-453DX Your own home entertainment center 2.5GbE NASbook for offices and meetings Enabling higher productivity and smooth multimedia streaming • Intel® Celeron® N5105 quad-core processor• 2 x 3.5-inch SATA drive bays• Built-in Intel® UHD Graphics• 2 x 2.5GbE ports• 2 x HDMI™ 2.0 (4K @ 60Hz) outputs to display media on screens• Silent & fanless design • Intel® Celeron® N5105 quad-core processor• 4 x M.2 2280 NVMe SSD slots• Built-in Intel® UHD Graphics • 2 x 2.5GbE ports for smoother file accessing• 2 x HDMI™ 2.0 (4K @60Hz) outputs to display projects on monitors • Intel® Celeron® J4115 quad-core processor• 2 x 3.5-inch SATA drive bays + 2 x M.2 2280 SATA SSD slots• Built-in Intel® HD Graphics 600• 1 x 10GBASE-T (10G/5G/2.5G/1G/100M) port for faster multimedia streaming and file sharing• Silent & fanless design Learn More Learn More Learn More People Also Viewed TS-216G The most affordable 2-bay 2.5GbE QNAP NAS. Your most reliable file management center. Learn More TS-133 Save you money and time. The best entry-level NAS storage. Learn More CAYIN MediaSign Player Transform your NAS into a Media Player L'
