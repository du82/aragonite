full_description = "Denhef Digital Denhef Digital The TVS-h1288X futureproofs David's storage for recordings, resolving remote access and backup challenges while enhancing workflow efficiency. To view this video please enable JavaScript, and consider upgrading to a web browser Customer Denhef Digital Industry Videography & Photography Product TVS-h1288X Tell us your challenge I am definitely looking forward to using this QNAP NAS for collaborations with other film makers. We might then all connect to the same project and files on the NAS and work together on the same timeline. - David Wall – Director of Denhef Digital Background Since 2013, David Wall has been operating the studio Denhef Digital, offering captivating still images and film production services. Today, he stands as a seasoned professional photographer and filmmaker, delighting a diverse clientele across Europe. With ongoing projects for a dozen highly-engaging clients, David continues to showcase his talent and dedication to his craft. However, as his business expands, the demand for storage of his work and materials presents significant challenges. The customer uses these solutions Multimedia Editing Create an efficient video editing, storage and collaborative environment with 10GbE, Thunderbolt, and high-speed switches. Learn More Thunderbolt™ Solution Use Thunderbolt™ NAS, DAS, and accessories to create a total multimedia editing, file storage and file sharing environment. Learn More Secure remote access to NAS Best-in-class NAS remote access and network security provides network settings suggestions to ensure secure networking. Learn More Storage for Content Creators Easily store, organize, and manage your YouTube, Blog, and media contents and creativity. Learn More Best Storage for Apple Users Experience data storage like never before – seamlessly work, backup, and sync your files between your QNAP NAS and iPhones, iPads, and Macs! Learn More Multimedia Editing Create an efficient video editing, storage and collaborative environment with 10GbE, Thunderbolt, and high-speed switches. Learn More Thunderbolt™ Solution Use Thunderbolt™ NAS, DAS, and accessories to create a total multimedia editing, file storage and file sharing environment. Learn More Secure remote access to NAS Best-in-class NAS remote access and network security provides network settings suggestions to ensure secure networking. Learn More Storage for Content Creators Easily store, organize, and manage your YouTube, Blog, and media contents and creativity. Learn More Best Storage for Apple Users Experience data storage like never before – seamlessly work, backup, and sync your files between your QNAP NAS and iPhones, iPads, and Macs! Learn More Challenges Before adopting QNAP NAS, David frequently encountered the frustration of insufficient storage space. As a content creator, he heavily relied on having ample storage to house large raw files and recordings, especially considering potential requests from clients years down the line. Using external SSDs with space limitations and backup complexities forced him to neglect backing up footage for over three years, exposing him to significant risks. Moreover, his remote and overseas assignments made data access cumbersome, hindering client presentations. These challenges highlighted the urgent need for a resilient and adaptable storage solution, capable of meeting his evolving requirements while safeguarding data security and accessibility. Solution The QNAP NAS addressed David's needs seamlessly. The high-capacity TVS-h1288X features a powerful Intel® Xeon® W processor and supports up to four Thunderbolt™ 3 ports, making it a perfect match for David’s Thunderbolt™-equipped Mac Studio for high-speed media collaboration. Its simple installation and configuration, along with easy storage expansion capabilities, perfectly accommodated his growing file demands. David implemented a RAID 6 configuration to protect against data loss from up to two disks failing, while Thunderbolt™ transmission ensured rapid data transfer that significantly enhances efficiency. Accessing and logging into the NAS became swift and efficient with Qfinder Pro. Most importantly, utilizing NAS granted full control over storage space, meeting confidentiality agreements of NDA contracts with clients, a feat impossible with cloud services. This comprehensive solution ensures data security and accessibility, elevating David's workflow to new heights. Result Through the TVS-h1288X, David securely stores all his raw files and assets, eliminating backup space concerns and simplifying his backup process. Thunderbolt™ technology streamlines his post-production workflow, even with 4K recordings. Seamless sharing of past work with clients via tablets or iPhones, along with Plex for video playback, enhances their experience and trust. With QNAP NAS, David gains complete storage control and significantly improves working efficiency, allowing him to fully focus on his travelling videography projects. Future collaboration with other artists through QNAP NAS will result in stunning works, further elevating his creative endeavors and pushing artistic boundaries. Explore more from our customers All Customer stories Shin Suzuki QNAP NAS allows me to seamlessly access the database I have been working on. Thanks to the AI features, I can reach the specific files I'm looking for as if I were recollecting old memories. ▶ ▶ Henrik Matzen, the Co-founder of FIRSTLAPSE We often had lag before, but now with SSD caching and a powerful CPU + 10GbE everything is smooth when we work and render 4K and 5K content. ▶ ▶ Albert Dros The TVS-h1288X will be my main storage solution system for storing all of my photos and videos ▶ ▶ James Rushforth Switching to a dedicated NAS has streamlined my workflow, increased my productivity and was much easier to set up than I expected. I just wish I’d discovered QNAP sooner. -- James Rushforth ▶ ▶ All Customer stories"
