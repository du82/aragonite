["https://qnap.com/en-us/customer-stories/tvs-h1288x-qxp-t32p-qsw-m804-4c-james-rushforth"]
title = "James Rushforth | QNAP (US)"
description = "QTS is the operating system for entry- and mid-level QNAP NAS. WIth Linux and ext4, QTS enables reliable storage for everyone with versatile value-added features and apps, such as snapshots, Plex media servers, and easy access of your personal cloud."
full_description = '''James Rushforth James Rushforth James Rushforth achieves real-time video editing in 4K, working directly off them connected via Thunderbolt™ 3. Customer James Rushforth Industry Videography & Photography Product TVS-h1288X QXP-T32P QSW-M804-4C Tell us your challenge Switching to a dedicated NAS has streamlined my workflow, increased my productivity and was much easier to set up than I expected. I just wish I’d discovered QNAP sooner. -- James Rushforth - James Rushforth Background Specialising in adventurous travel, James Rushforth works as an author, photographer, public speaker and guide. His latest two-volume set of photo-location guidebooks to Iceland recently won four publishing awards during 2022 – Travel Category winner at the Best Indie Book Awards, Guidebook of the Year at both the British Guild of Travel Writers and Outdoor Writers and Photographers Guild annual awards, and Travel Guidebook of the Year at the Foreword INDIES. James has also written titles on rock climbing, via ferrata, ski mountaineering and photography. Challenge Storing data for six illustrated publications, a map and an interactive mobile app, along with associated video content for advertising took up a lot of disk space – especially given the ever-increasing file sizes of digital media. Previously James was using sixteen external hard drives of varying sizes, then backing them up manually – a laborious process that made finding specific files a time-consuming process. Additionally, James spends roughly half the year abroad leading workshops and researching new guidebooks. A nice lifestyle perhaps, but one that makes accessing essential data back home at the office problematic, especially at short notice. Solution For such demanding requirements, James opted for the TVS-h1288X, populating all eight of the 3.5-inch bays with Seagate 16TB IronWolf Pro SATA Hard Drives in a RAID6 configuration, providing 96TB of theoretical usable disk space. Two 1TB IronWolf 525 NVMe SSDs were attached to the M.2 slots for hosting the system drive, whilst a further two 2TB Seagate IronWolf 125 SSDs were placed in the 2.5-inch SATA bays to deliver increased read and write performance for current video projects. Finally, a QSW-M804-4C 10GbE managed switch was utilised for more efficient networking. The customer uses these solutions 10/25GbE network QNAP provides affordable 10GbE solutions for small businesses and home users to easily upgrade their network environment. Learn More Storage for Professional Photographers and Enthusiasts QNAP helps keeps your data secure and private with both NAS and DAS. Learn More Thunderbolt™ Solution Use Thunderbolt™ NAS, DAS, and accessories to create a total multimedia editing, file storage and file sharing environment. Learn More 10/25GbE network QNAP provides affordable 10GbE solutions for small businesses and home users to easily upgrade their network environment. Learn More Storage for Professional Photographers and Enthusiasts QNAP helps keeps your data secure and private with both NAS and DAS. Learn More Thunderbolt™ Solution Use Thunderbolt™ NAS, DAS, and accessories to create a total multimedia editing, file storage and file sharing environment. Learn More Result / Benefit Optimised for a RAID environment, James has reported read and write speeds in excess of 1200 Mbps for the eight Seagate IronWolf HDDs. James states "the original idea was to use the 3.5-inch SATA SSDs for current projects before transferring the files onto the HDDs for storage. In reality, the HDDs are fast enough for everything but real-time video editing in 4K and I find myself working directly off them more and more whilst connected via Thunderbolt™ 3. This centralised high-capacity storage has greatly increased my productivity, allowing files to be found quickly whilst simultaneously providing peace of mind. The ability to access the NAS from anywhere in the world has also proved invaluable, allowing me to send time-sensitive files whilst working away from home." Explore more from our customers All Customer stories David Wall – Director of Denhef Digital I am definitely looking forward to using this QNAP NAS for collaborations with other film makers. We might then all connect to the same project and files on the NAS and work together on the same timeline. ▶ ▶ Shin Suzuki QNAP NAS allows me to seamlessly access the database I have been working on. Thanks to the AI features, I can reach the specific files I'm looking for as if I were recollecting old memories. ▶ ▶ Henrik Matzen, the Co-founder of FIRSTLAPSE We often had lag before, but now with SSD caching and a powerful CPU + 10GbE everything is smooth when we work and render 4K and 5K content. ▶ ▶ Albert Dros The TVS-h1288X will be my main storage solution system for storing all of my photos and videos ▶ ▶ All Customer stories'''
