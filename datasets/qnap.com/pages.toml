["https://qnap.com/en-us/case-studies/ts-853u-rp-polanow-town-hall"]
title = "Polanów's Town Hall Adopts the TS-853U-RP to Accelerate Administrative Task Efficiency."
description = "QTS is the operating system for entry- and mid-level QNAP NAS. WIth Linux and ext4, QTS enables reliable storage for everyone with versatile value-added features and apps, such as snapshots, Plex media servers, and easy access of your personal cloud."
full_description = "“It was a great decision to install QNAP NAS in our IT environment, because our employees have direct access to their data from a dependable NAS device, without worrying about losing data. It has helped to increase our productivity by about 30%.” - Krzysztof Szypulski, the IT Specialist of Polanów Town Hall Introduction Polanów is a town in Poland with a population of over 3,000 residents. Polanów's Town Hall provides a variety of public and civil services, including education, culture, leisure, housing and more. Challenge Prior to adopting QNAP NAS, almost all the employees of Polanów's Town Hall’s faced common issues regarding data storage and file sharing. The personnel lacked a centralized, dedicated huge-volume data storage space. They stored files across numerous devices, including computers, external hard drives and USB storage. However they consistently ran out of storage space very quickly and therefore looked for a high-capacity storage solution to meet their growing data storage needs. Furthermore, with so many kinds of storage devices in use, file sharing among employees become inconvenient and inefficient. Last but not least, disk failures happened, especially, after over-use or due to age, causing them to suffer data loss.Another major problem was that initially, the town hall’s IT environment did not accommodate a professional NAS system for secure data storage and backup. However, as they needed to securely store and back up important and confidential government data and materials from computers and servers, a reliable storage was of paramount importance. In short, the IT personnel sought a NAS system that could provide a high-performance scalable storage and backup solution to meet the various requirements of the staff from different departments. Solution Determined to tackle these challenges once and for all, Polanów's Town Hall decided to implement the TS-853U-RP. Designed to handle mission-intensive business applications, the TS-853U-RP works as a powerful, reliable and scalable private cloud solution for SMBs. The TS-853U-RP is powered by a cutting-edge 22nm quad-core Intel® Celeron® 2.0GHz processor with 4GB energy-efficient DDR3L RAM (upgradable to 8GB), coupled with the support of SATA 6Gb/s drives and 4 Gigabit LAN ports. Secure backup solution with Xopero and RAID5 Xopero is an integrated backup solution for QNAP NAS users to easily and effectively create backups, synchronize and restore data from servers and personal computers. With Xopero, the staff of Polanów's Town Hall greatly improved their backup processes for their important and confidential government data. Moreover, their TS-853U-RP is configured with the RAID5 to provide reliable and sustainable data protection. Centralized storage space and cross-platform file sharing Using the TS-853U-RP as a central storage system provides universal access for all employees. With easy access to data stored on the NAS, they can access and share files across computers or mobile devices connected to the NAS. Redundant Power Supply The TS-853U-RP features a hot-swappable redundant power supply to ensure maximum system uptime. High storage capacity with scale-up storage expansion With 8 drive bays, the TS-853U-RP brings high storage potential. When running out of storage space, it can be easily expanded using a QNAP expansion enclosure. Benefit Since adopting the TS-853U-RP, Polanów's Town Hall has gained considerable benefit from using the NAS. According to the staff, there was a 30% increase in productivity and 25% increase in efficiency. The TS-853U-RP also proved to be a cost-saving alternative to using external storage devices as the employees are no longer concerned about data loss due to device failure. They also spend much less on purchasing these devices than they did previously. With the in-built FTP server, the TS-853U-RP works as a centralized file storage & sharing platform, providing quick and easy file sharing across Windows®, Mac®, iOS® and Android™ devices. The high-speed data transfer also noticeably shortened the time required to share data. The staff were very satisfied with the TS-853U-RP’s fantastic performance, and now they can work with comfort.The TS-853U-RP and Xopero combined solution has provided the Polanów Town Hall with a comprehensive NAS and backup solution, providing high data security, large storage potential, and more.“It was a great decision to install QNAP NAS in our IT environment, because our employees have direct access to their data from a dependable NAS device, without worrying about losing data. It has helped to increase our productivity by about 30%”, said Krzysztof Szypulski, the IT Specialist of Polanów Town Hall."
