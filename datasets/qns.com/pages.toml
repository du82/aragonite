["https://qns.com/2025/02/catholic-charities-250k-heating-grant-howard-beach"]
title = "Catholic Charities announces $250K heating assistance grant at Howard Beach resource center – QNS"
description = "Catholic Charities Brooklyn and Queens is enhancing its heating assistance efforts with a $250,000 grant from the National Grid Foundation"
full_description = '''News Catholic Charities announces $250K heating assistance grant at Howard Beach resource center By Meaghan McGoldrick O’Neil Posted on February 28, 2025 National Grid Foundation leadership and staff present Catholic Charities Brooklyn and Queens leadership, Msgr. Joseph Pfeiffer Resource Center staff and residents with a $250,000 fuel-neutral heating fund check. Photo courtesy of Catholic Charities Brooklyn and Queens Sign up for our QNS email newsletter to get news, updates, and local insights delivered straight to your inbox! Catholic Charities Brooklyn and Queens is enhancing its heating assistance efforts with a $250,000 grant from the National Grid Foundation amid severe winter conditions. The donation, presented on Feb. 26 at the Msgr. Joseph Pfeiffer Resource Center in Howard Beach, will help families and older adults stay warm by covering critical heating costs. Close Get the Full StoryNews, events, culture and more — delivered to you. Thank you for subscribing! Email Sign Up if (!window.AdButler){(function(){var s = document.createElement("script"); s.async = true; s.type = "text/javascript";s.src = 'https://ads.empowerlocal.co/app.js';var n = document.getElementsByTagName("script")[0]; n.parentNode.insertBefore(s, n);}());} var rnd = Math.floor(Math.random()*10e6); var divsize = document.querySelector('#emp-c0862').parentNode.clientWidth; var AdButler = AdButler || {}; AdButler.ads = AdButler.ads || []; var abkw = window.abkw || ''; console.log("emp-c0862-size-"+divsize); if(divsize >= 728){ var plc551963 = window.plc551963 || 0; document.write('<'+'div id="placement_551963_'+plc551963+'"></'+'div>'); AdButler.ads.push({handler: function(opt){ AdButler.register(181918, 551963, [728,90], 'placement_551963_'+opt.place, opt); }, opt: { pid: rnd, rnd: rnd ,place: plc551963++, keywords: abkw, domain: 'ads.empowerlocal.co', click:'CLICK_MACRO_PLACEHOLDER' }}); } else{ var plc551957 = window.plc551957 || 0; document.write('<'+'div id="placement_551957_'+plc551957+'"></'+'div>'); AdButler.ads.push({handler: function(opt){ AdButler.register(181918, 551957, [300,250], 'placement_551957_'+opt.place, opt); }, opt: { pid: rnd, rnd: rnd ,place: plc551957++, keywords: abkw, domain: 'ads.empowerlocal.co', click:'CLICK_MACRO_PLACEHOLDER' }}); } “On behalf of our community, I extend my heartfelt gratitude to the foundation for its incredible generosity and unwavering support,” said Monsignor Alfred LoPinto, president and CEO of Catholic Charities Brooklyn and Queens and affiliates. “Your commitment to assisting those most in need in our boroughs truly embodies the spirit of compassion and charity that uplifts us all. Thank you for making a meaningful difference in the lives of so many.” The grant will be distributed across five Catholic Charities programs that provide emergency heating assistance. This marks the first year that the National Grid Foundation has partnered with Catholic Charities Brooklyn and Queens to support its emergency heating funds. Of the total grant, $100,000 will fund the newly established Catholic Charities “Stay Cozy Fund,” providing emergency financial assistance to families struggling to pay their heating bills. An additional $20,000 will support older adults at Catholic Charities centers who need help covering their National Grid heating costs. The remaining $130,000 will go toward heating expenses at several Catholic Charities residences and service centers, including the Peter Striano Residence, Monastery Senior Housing, Caring Communities Apartments, and St. Malachy’s Early Childhood Development Center, which serve low-income individuals and families. var divsize = document.querySelector('#emp-f4114').parentNode.clientWidth; var rnd = Math.floor(Math.random()*10e6); var pid551953 = rnd; var plc551953 = window.plc551953 || 0; var abkw = window.abkw || ''; var absrc = 'https://ads.empowerlocal.co/adserve/;ID=181918;size=0x0;setID=551953;type=js;sw='+screen.width+';sh='+screen.height+';spr='+window.devicePixelRatio+';kw='+abkw+';pid='+pid551953+';place='+(plc551953++)+';rnd='+rnd+';click=CLICK_MACRO_PLACEHOLDER'; var _absrc = absrc.split("type=js"); absrc = _absrc[0] + 'type=js;referrer=' + encodeURIComponent(document.location.href) + _absrc[1]; document.write('<scr'+'ipt src="'+absrc+'" type="text/javascript"></'+'script>'); Catholic Charities Msgr. Joseph Pfeiffer Resource Center residents. Photo courtesy of Catholic Charities Brooklyn and Queens National Grid Foundation Board Chair Eileen Cohen credited the funding to the group’s deep roots in the community. “We have a long history of serving as a community partner, understand the critical need in our communities, and want our customers to know we are here to help,” Cohen said in a statement. “We are so grateful to these amazing organizations who have partnered with us; they help deliver so many much-needed services during these trying economic times.” googletag.cmd.push(function() { googletag.display('qns_content_responsive_1'); }); The National Grid Foundation began in 1998 and, since then, has granted more than $43 million to local community organizations to help enhance quality of life. This year, the foundation is distributing $3 million this year to six emergency fuel-neutral heating funds across New York City, Long Island, and Massachusetts. The funding includes a one-time $900,000 donation to expand the foundation’s annual heating grants and extend support across the Northeast. “This year’s emergency heating fund assistance allows the Foundation to expand its support to additional communities and broaden and deepen our local help,” said newly-appointed Foundation Executive Director Robert Simmons. “We are critically concerned about energy affordability and are so pleased that through this funding, we anticipate being able to support more than 7,500 families this year.” googletag.cmd.push(function() { googletag.display('qns_content_responsive_2'); }); About the Author'''
