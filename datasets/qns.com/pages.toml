title = "Death of 3-year-old Far Rockaway boy in December deemed a homicide: NYPD – QNS"
description = "The death of a 3-year-old boy who was found dead in his Far Rockaway home in December is now being investigated as a homicide"
full_description = '''News Death of 3-year-old Far Rockaway boy in December deemed a homicide: NYPD By Bill Parry Posted on February 28, 2025 The death of a 3-year-old boy in a home on Mott Avenue near McBride Street in Far Rockaway has been reclassified as a homicide after the results of an autopsy were revealed on Thursday. Via Google Maps Sign up for our QNS email newsletter to get news, updates, and local insights delivered straight to your inbox! The death of a 3-year-old boy who was found dead in his Far Rockaway home in December is now being investigated as a homicide, the NYPD announced Thursday. Police from the 101st Precinct in Far Rockaway responded to a 911 call of a child in need of medical attention at 22-53 Mott Ave. just after 6 a.m. on Friday, Dec.13. Officers found Elias Rosado with blunt force trauma to his body. Close Get the Full StoryNews, events, culture and more — delivered to you. Thank you for subscribing! Email Sign Up if (!window.AdButler){(function(){var s = document.createElement("script"); s.async = true; s.type = "text/javascript";s.src = 'https://ads.empowerlocal.co/app.js';var n = document.getElementsByTagName("script")[0]; n.parentNode.insertBefore(s, n);}());} var rnd = Math.floor(Math.random()*10e6); var divsize = document.querySelector('#emp-88284').parentNode.clientWidth; var AdButler = AdButler || {}; AdButler.ads = AdButler.ads || []; var abkw = window.abkw || ''; console.log("emp-88284-size-"+divsize); if(divsize >= 728){ var plc551963 = window.plc551963 || 0; document.write('<'+'div id="placement_551963_'+plc551963+'"></'+'div>'); AdButler.ads.push({handler: function(opt){ AdButler.register(181918, 551963, [728,90], 'placement_551963_'+opt.place, opt); }, opt: { pid: rnd, rnd: rnd ,place: plc551963++, keywords: abkw, domain: 'ads.empowerlocal.co', click:'CLICK_MACRO_PLACEHOLDER' }}); } else{ var plc551957 = window.plc551957 || 0; document.write('<'+'div id="placement_551957_'+plc551957+'"></'+'div>'); AdButler.ads.push({handler: function(opt){ AdButler.register(181918, 551957, [300,250], 'placement_551957_'+opt.place, opt); }, opt: { pid: rnd, rnd: rnd ,place: plc551957++, keywords: abkw, domain: 'ads.empowerlocal.co', click:'CLICK_MACRO_PLACEHOLDER' }}); } EMS responded to the location and rushed the youngster to St. John’s Episcopal Hospital in Far Rockaway, where he was pronounced dead. An autopsy by the Office of the Chief Medical Examiner determined the child’s death was a homicide. An NYPD spokeswoman could not say if there was an adult at the home when officers responded or who placed the 911 call. There are no arrests and the homicide investigation remains ongoing. Anyone with information about this incident is asked to call the NYPD’s Crime Stoppers Hotline at 1-800-577-TIPS (8477) or, for Spanish, 1-888-57-PISTA (74782). The public can also submit their tips by logging onto the Crime Stoppers website at crimestoppers.nypdonline.org or on X (the platform formerly known as Twitter) @NYPDTips. All calls and messages are confidential. About the Author Bill Parry Senior Reporter. Reach me at bparry@schnepsmedia.com'''
