["https://qns.com/2025/02/bronx-man-unprovoked-attack-7-train-rider-corona"]
title = "Bronx man arrested for unprovoked attack on 7 train rider in Corona: NYPD – QNS"
description = "A Bronx man was arrested and booked at the 107th Precinct for an unprovoked attack on a 7 train rider in Corona"
full_description = '''Police & Fire Bronx man arrested for unprovoked attack on 7 train rider in Corona: NYPD By Bill Parry Posted on February 27, 2025 A Bronx man was arrested and charged in an unprovoked attack on a 7 train rider in Corona. Police are still looking for his accomplice. Photos courtesy of the NYPD Sign up for our QNS email newsletter to get news, updates, and local insights delivered straight to your inbox! A Bronx man was arrested Wednesday morning and booked at the 107th Precinct in Fresh Meadows for an unprovoked attack on a 7 train rider in Corona nearly two weeks earlier. Close Get the Full StoryNews, events, culture and more — delivered to you. Thank you for subscribing! Email Sign Up Marlon Serrano, 51, of Wales Avenue in the Mott Haven section of the Bronx, was arraigned in Queens Criminal Court later in the day, where he was criminally charged with assault in the second degree for the beatdown that occurred on a Flushing-bound 7 train on the morning of Thursday, Feb. 13.if (!window.AdButler){(function(){var s = document.createElement("script"); s.async = true; s.type = "text/javascript";s.src = 'https://ads.empowerlocal.co/app.js';var n = document.getElementsByTagName("script")[0]; n.parentNode.insertBefore(s, n);}());} var rnd = Math.floor(Math.random()*10e6); var divsize = document.querySelector('#emp-1db20').parentNode.clientWidth; var AdButler = AdButler || {}; AdButler.ads = AdButler.ads || []; var abkw = window.abkw || ''; console.log("emp-1db20-size-"+divsize); if(divsize >= 728){ var plc551963 = window.plc551963 || 0; document.write('<'+'div id="placement_551963_'+plc551963+'"></'+'div>'); AdButler.ads.push({handler: function(opt){ AdButler.register(181918, 551963, [728,90], 'placement_551963_'+opt.place, opt); }, opt: { pid: rnd, rnd: rnd ,place: plc551963++, keywords: abkw, domain: 'ads.empowerlocal.co', click:'CLICK_MACRO_PLACEHOLDER' }}); } else{ var plc551957 = window.plc551957 || 0; document.write('<'+'div id="placement_551957_'+plc551957+'"></'+'div>'); AdButler.ads.push({handler: function(opt){ AdButler.register(181918, 551957, [300,250], 'placement_551957_'+opt.place, opt); }, opt: { pid: rnd, rnd: rnd ,place: plc551957++, keywords: abkw, domain: 'ads.empowerlocal.co', click:'CLICK_MACRO_PLACEHOLDER' }}); } The 37-year-old man was approached by Serrano and another man, who remains at large, and engaged in a verbal dispute with the victim at around 6:35 a.m. as the train approached the 103rd Street-Corona Plaza station. The argument escalated into violence when Serrano allegedly struck him on his head multiple times with a coffee tumbler with enough force to break the tumbler, causing the victim to sustain lacerations to his head and considerable pain, according to the criminal complaint. The unapprehended man then threw an umbrella at the victim as the two men exited the train and fled the station on foot onto Corona Plaza. EMS responded to the scene and transported the victim to New York-Presbyterian Queens Hospital, where he was listed in stable condition and received eight staples to close the lacerations on his head, according to the criminal complaint. A detective from the Queens Transit Crimes Squad who was working the investigation heard that Serrano had been taken into custody by the Queens Special Victims Squad in a separate investigation, according to a law enforcement source with knowledge of the case. The Transit detective sent video stills obtained from surveillance video showing Serrano attacking the 7 train rider and the Special Victims detective who confirmed it was Serrano. var divsize = document.querySelector('#emp-46ad7').parentNode.clientWidth; var rnd = Math.floor(Math.random()*10e6); var pid551953 = rnd; var plc551953 = window.plc551953 || 0; var abkw = window.abkw || ''; var absrc = 'https://ads.empowerlocal.co/adserve/;ID=181918;size=0x0;setID=551953;type=js;sw='+screen.width+';sh='+screen.height+';spr='+window.devicePixelRatio+';kw='+abkw+';pid='+pid551953+';place='+(plc551953++)+';rnd='+rnd+';click=CLICK_MACRO_PLACEHOLDER'; var _absrc = absrc.split("type=js"); absrc = _absrc[0] + 'type=js;referrer=' + encodeURIComponent(document.location.href) + _absrc[1]; document.write('<scr'+'ipt src="'+absrc+'" type="text/javascript"></'+'script>'); At his arraignment on Wednesday, Serrano was ordered to return to court on May 6. The NYPD is still seeking Serrano’s accomplice. A reward of up to $3,500 is offered for information leading to his arrest. Anyone with information regarding this assault investigation is asked to call the NYPD’s Crime Stoppers Hotline at 1-800-577-TIPS (8477) or for Spanish, 1-888-57-PISTA (74782). The public can also submit their tips by logging onto the Crime Stoppers website at crimestoppers.nypdonline.org or on X (the platform formerly known as Twitter) @NYPDTips. All calls and messages are confidential. About the Author Bill Parry Senior Reporter. Reach me at bparry@schnepsmedia.com'''
