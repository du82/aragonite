title = "Asian American Republican Club of Queens officially launches in Flushing – QNS"
description = "The Queens County Republican Party proudly announced the formation of the Asian American Republican Club of Queens,"
full_description = '''Politics Asian American Republican Club of Queens officially launches in Flushing By Robert Pearl Posted on February 28, 2025 Photo by Robert Pearl Sign up for our QNS email newsletter to get news, updates, and local insights delivered straight to your inbox! The Queens County Republican Party proudly announced the formation of the Asian American Republican Club of Queens, marking a significant milestone in mobilizing Asian American voters under the Republican banner. The launch event, held at the Four Points Sheraton in Flushing, attracted prominent elected officials, community leaders, and enthusiastic supporters eager to expand conservative principles to the Asian communities of Queens. Close Get the Full StoryNews, events, culture and more — delivered to you. Thank you for subscribing! Email Sign Up Photo by Robert Pearl A Growing Political Movement if (!window.AdButler){(function(){var s = document.createElement("script"); s.async = true; s.type = "text/javascript";s.src = 'https://ads.empowerlocal.co/app.js';var n = document.getElementsByTagName("script")[0]; n.parentNode.insertBefore(s, n);}());} var rnd = Math.floor(Math.random()*10e6); var divsize = document.querySelector('#emp-72f89').parentNode.clientWidth; var AdButler = AdButler || {}; AdButler.ads = AdButler.ads || []; var abkw = window.abkw || ''; console.log("emp-72f89-size-"+divsize); if(divsize >= 728){ var plc551963 = window.plc551963 || 0; document.write('<'+'div id="placement_551963_'+plc551963+'"></'+'div>'); AdButler.ads.push({handler: function(opt){ AdButler.register(181918, 551963, [728,90], 'placement_551963_'+opt.place, opt); }, opt: { pid: rnd, rnd: rnd ,place: plc551963++, keywords: abkw, domain: 'ads.empowerlocal.co', click:'CLICK_MACRO_PLACEHOLDER' }}); } else{ var plc551957 = window.plc551957 || 0; document.write('<'+'div id="placement_551957_'+plc551957+'"></'+'div>'); AdButler.ads.push({handler: function(opt){ AdButler.register(181918, 551957, [300,250], 'placement_551957_'+opt.place, opt); }, opt: { pid: rnd, rnd: rnd ,place: plc551957++, keywords: abkw, domain: 'ads.empowerlocal.co', click:'CLICK_MACRO_PLACEHOLDER' }}); } Asian American Republicans have made significant strides in Brooklyn, with notable electoral victories, and now aim to replicate that success in Queens. Leading the charge are State Senator Steve Chan (R-Brooklyn) and Assembly Member Lester Chang (R-Brooklyn), both of whom emphasized the importance of engaging voters who may not yet realize their alignment with the Republican Party’s core values. var divsize = document.querySelector('#emp-4c2d2').parentNode.clientWidth; var rnd = Math.floor(Math.random()*10e6); var pid551953 = rnd; var plc551953 = window.plc551953 || 0; var abkw = window.abkw || ''; var absrc = 'https://ads.empowerlocal.co/adserve/;ID=181918;size=0x0;setID=551953;type=js;sw='+screen.width+';sh='+screen.height+';spr='+window.devicePixelRatio+';kw='+abkw+';pid='+pid551953+';place='+(plc551953++)+';rnd='+rnd+';click=CLICK_MACRO_PLACEHOLDER'; var _absrc = absrc.split("type=js"); absrc = _absrc[0] + 'type=js;referrer=' + encodeURIComponent(document.location.href) + _absrc[1]; document.write('<scr'+'ipt src="'+absrc+'" type="text/javascript"></'+'script>'); “Many Asian American voters in Queens still believe they have no political alternative,” said Senator Chan. “It is our job to show them that there is a better option—one that values public safety, strong education, and economic opportunity.” Assemblyman Chang echoed the sentiment, stating, “We are here to ensure that the voices of hard-working families are heard. Republican policies protect small businesses, support law enforcement, and promote educational excellence—all key concerns in our community.” “Over the last few election cycles, the Democratic Party has moved so far left that it no longer represents the values of many immigrant communities,” said Senator Chan, one of the many speakers emphasizing concerns over rising crime, lenient bail laws, and the impact of illegal immigration have made neighborhoods less safe, and they criticized policies that fail to address these issues effectively. Education was also a major focus, particularly the battle to preserve gifted and talented programs and specialized high school admissions tests (SHSAT), which many Asian American families see as crucial to their children’s success. Republican leaders pledged to fight against efforts to dismantle merit-based education. Additionally, economic burdens were highlighted, with small business owners in Flushing and beyond feeling the weight of high taxes and unnecessary regulations. GOP leaders vowed to champion policies that foster entrepreneurship and economic growth. googletag.cmd.push(function() { googletag.display('qns_content_responsive_1'); }); Photo by Robert Pearl A Show of Support from Republican Leaders googletag.cmd.push(function() { googletag.display('qns_content_responsive_2'); }); Mayoral candidate Curtis Sliwa also addressed the crowd, offering his full support for the new club. “This is the beginning of something big,” Sliwa said. “Asian American Republicans are not just a growing force—they are a winning force.” In a show of unity, Sliwa, Chan, and Chang joined hands with the club’s founding officers and directors, including Dr. Philip Wang, Kenneth Paek, Betsy Deng, Michael Lau, and Myung Lee. Dr. Wang, a candidate for City Council District 20, expressed his gratitude, saying, “I am deeply honored to have received the official endorsements of both the Queens County Republican Party and the Queens County Conservative Party. This is just the beginning of a movement that will empower Asian American voices in Queens and beyond.” googletag.cmd.push(function() { googletag.display('qns_content_responsive_3'); }); Photo by Robert Pearl Looking to the Future The newly formed Asian American Republican Club of Queens aims to be a hub for civic engagement, policy advocacy, and grassroots organizing. With a focus on voter outreach, education, and candidate support, the club plans to hold regular meetings, community events, and training sessions for those interested in running for office. As the event concluded, Senator Chan urged attendees to stay active and involved: “This is not just about one election or one race—this is about the future of our city, our state, and our country.” With enthusiasm high and momentum growing, the club’s formation marks a significant step in reshaping the political landscape of Queens and ensuring that Asian American voices are heard loud and clear in the Republican movement. About the Author'''
