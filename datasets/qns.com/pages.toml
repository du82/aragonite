title = "German restaurant Zum Stammtisch announces ‘bittersweet’ closure of beloved Pork Store after 13 years of service – QNS"
description = "After 13 years of serving the Glendale community, Zum Stammtisch’s beloved Pork Store will close its doors for the final time on March 1, 2025."
full_description = '''Glendale German restaurant Zum Stammtisch announces ‘bittersweet’ closure of beloved Pork Store after 13 years of service By Colum Motherway Posted on January 23, 2025 Zum Stammtisch has sadly announced that its beloved Pork Store will close on March 1 Photo via Zum Stammtisch Sign up for our QNS email newsletter to get news, updates, and local insights delivered straight to your inbox! After 13 years of serving the Glendale community, Zum Stammtisch’s beloved Pork Store will close its doors for the final time on March 1, 2025. While the local deli is entering the end of an era, the restaurant will continue serving its customers as usual for many more years. The Pork Store has long offered authentic German meats and delicacies that ‘you wouldn’t find anywhere else.’ Zum Stammtisch lovers will have to say goodbye to its fresh wurst and extensive selection of German imports, including meats, cheeses, salads, breads, chocolates, and dairy products. Close Get the Full StoryNews, events, culture and more — delivered to you. Thank you for subscribing! Email Sign Up if (!window.AdButler){(function(){var s = document.createElement("script"); s.async = true; s.type = "text/javascript";s.src = 'https://ads.empowerlocal.co/app.js';var n = document.getElementsByTagName("script")[0]; n.parentNode.insertBefore(s, n);}());} var rnd = Math.floor(Math.random()*10e6); var divsize = document.querySelector('#emp-25c2c').parentNode.clientWidth; var AdButler = AdButler || {}; AdButler.ads = AdButler.ads || []; var abkw = window.abkw || ''; console.log("emp-25c2c-size-"+divsize); if(divsize >= 728){ var plc551963 = window.plc551963 || 0; document.write('<'+'div id="placement_551963_'+plc551963+'"></'+'div>'); AdButler.ads.push({handler: function(opt){ AdButler.register(181918, 551963, [728,90], 'placement_551963_'+opt.place, opt); }, opt: { pid: rnd, rnd: rnd ,place: plc551963++, keywords: abkw, domain: 'ads.empowerlocal.co', click:'CLICK_MACRO_PLACEHOLDER' }}); } else{ var plc551957 = window.plc551957 || 0; document.write('<'+'div id="placement_551957_'+plc551957+'"></'+'div>'); AdButler.ads.push({handler: function(opt){ AdButler.register(181918, 551957, [300,250], 'placement_551957_'+opt.place, opt); }, opt: { pid: rnd, rnd: rnd ,place: plc551957++, keywords: abkw, domain: 'ads.empowerlocal.co', click:'CLICK_MACRO_PLACEHOLDER' }}); } The Pork Store has been serving Glendale for the last 13 years. Photo via Zum Stammtisch Founded in November 1972 by John Lehner and two partners, Zum Stammtisch quickly became a gathering spot for locals, particularly the German and European communities. Before immigrating to the United States in the 1950s, Lehner worked as a coppersmith in Freising, Bavaria. His father owned a small bar and restaurant, which inspired John’s dream of one day owning his establishment. After arriving in the U.S., Lehner was drafted into the Army, where he served for two years before returning to New York. It was there he met his future wife, Erna, and they married shortly after, having two sons: Werner, born in 1967, and Hans, born in 1973. The German restaurant is a historic part of the local community. Photo via Zum Stammtisch Despite a challenging start, Zum Stammtisch quickly became a popular spot. The restaurant’s reputation as a gathering place for Germans and Europeans in the area grew steadily. Lehner bought out his original partners within the first decade, taking complete control of the business. In 1988, when a neighboring building became available, Lehner expanded Zum Stammtisch, creating a dedicated party room and separate smoking and non-smoking areas. var divsize = document.querySelector('#emp-aec8a').parentNode.clientWidth; var rnd = Math.floor(Math.random()*10e6); var pid551953 = rnd; var plc551953 = window.plc551953 || 0; var abkw = window.abkw || ''; var absrc = 'https://ads.empowerlocal.co/adserve/;ID=181918;size=0x0;setID=551953;type=js;sw='+screen.width+';sh='+screen.height+';spr='+window.devicePixelRatio+';kw='+abkw+';pid='+pid551953+';place='+(plc551953++)+';rnd='+rnd+';click=CLICK_MACRO_PLACEHOLDER'; var _absrc = absrc.split("type=js"); absrc = _absrc[0] + 'type=js;referrer=' + encodeURIComponent(document.location.href) + _absrc[1]; document.write('<scr'+'ipt src="'+absrc+'" type="text/javascript"></'+'script>'); Lehner was dedicated to teaching his sons the ins and outs of running a restaurant, ensuring they understood every aspect of the business. After Lehner’s passing in October 1993, Werner and Hans took over, maintaining their father’s high standards while incorporating their ideas to keep the restaurant fresh and true to its roots. The restaurant will continue to serve its beloved patrons as normal. Photo via Zum Stammtisch Over the years, Zum Stammtisch has gained significant recognition, having been featured on numerous television shows and written about in various food magazines and articles. Prestigious mentions include appearances on the Food Network’s ‘Dining Around’ with Kelly Choi and ‘The Best Thing I Ever Ate,’ as well as features on CW11 News, ‘Newsday,’ and others. The restaurant also earned high ratings from ZAGAT, scoring 24 for food, 20 for décor, and 22 for service. googletag.cmd.push(function() { googletag.display('qns_content_responsive_1'); }); The deli will be missed by many Glendale residents. Photo via Zum Stammtisch Building on their success, Hans and Werner expanded the family legacy even further by opening the Pork Store right next to Zum Stammtisch. The shop quickly became known for its authentic offerings and quality products, complementing the restaurant’s established reputation. googletag.cmd.push(function() { googletag.display('qns_content_responsive_2'); }); Though the Pork Store is now closing its doors, Zum Stammtisch’s legacy of authentic German cuisine and hospitality will continue to be enjoyed by generations of patrons across Glendale and beyond. About the Author Colum Motherway Reach me at cmotherway@schnepsmedia.com'''
