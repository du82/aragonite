["https://qownnotes.org/getting-started/shortcuts.html"]
title = "Shortcuts | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# Shortcuts # Linux / Windows # In the main window Ctrl + N creates a new note with the current date and time in the name Ctrl + ⇧ Shift + N creates a new note in a new tab Ctrl + ⇧ Shift + F lets you search for notes (in the name of the note and its content) Alt + F lets you search for notes in all tags / subfolders Alt + ⇧ Shift + P switches to the previous workspace Ctrl + ⇧ Shift + E edits an encrypted note Alt + R removes the current note Alt + ⇧ Shift + U checks for updates Ctrl + ⇧ Shift + T opens the todo list Ctrl + ⇧ Shift + O opens the current note in an external editor Alt + ⇧ Shift + O opens the current note in a view Alt + ⇧ Shift + F shows the current note in the file manager Alt + ⇧ Shift + E enables or disables editing of notes Alt + Up jumps to the previous visible note Alt + Down jumps to the next visible note Alt + Page Up jumps to the previous note tab Alt + Page Down jumps to the next note tab Ctrl + W closes the current note tab Ctrl + ⇧ Shift + D toggles the distraction free mode you can also close it with Esc Ctrl + P prints the current note as text Ctrl + ⇧ Shift + P prints the current note as markdown Ctrl + ⇧ Shift + V pastes notes, images and html from the clipboard Ctrl + , opens the settings Alt + ⇧ Shift + A adds a new tag to a note Ctrl + ⇧ Shift + R reloads the current note folder Ctrl + Alt + F lets you select a different note folder Ctrl + ⇧ Shift + S reloads the scripting engine Ctrl + ⇧ Shift + M hides or shows the main menu bar Ctrl + ⇧ Shift + A lets you search for actions Ctrl + S manually saves modified notes Alt + ⇧ Shift + I opens the Script repository dialog F4 jumps to the note edit panel F5 jumps to the note list F6 jumps to the note subfolder panel F7 jumps to the tags panel F8 jumps to the navigation panel F10 activates the context menu of the current widget F11 toggles full-screen mode Alt + ⇧ Shift + H copies the headline of the current note # In the note search bar Down or Tab sets the focus to the note list Return creates a new note with the text from the search bar as headline # In the note list double-click on note to open note in a new tab (keep in mind that there is a scripting hook that can override the double-click action) Ctrl + A selects all notes (to move, copy or remove them with a right click) Tab or Return lets you edit the current note # In the note text edit panel Ctrl + Click on a link to open it Ctrl + F lets you search in the current note use the Up and Down keys or F3 and ⇧ Shift + F3 keys to jump to the previous and next matches Esc closes the search bar Ctrl + R lets you search and replace in the current note Ctrl + D duplicates the current line or the selected text Ctrl + Alt + Down does the same Alt + Backspace deletes the current line Ctrl + Backspace deletes the current word Ctrl + L opens a dialog to add a text link (also works on selected text) Ctrl + ⇧ Shift + L opens a dialog to add note link Ctrl + T inserts the current date and time in a user specific format Ctrl + ⇧ Shift + I inserts an image (the image will be copied to the media folder in the current notes folder) Ctrl + ⇧ Shift + X inserts an attachment (the file will be copied to the attachments folder in the current notes folder) Alt + ⇧ Shift + T inserts a table Ctrl + ⇧ Shift + C inserts a code block at the current position Ctrl + ⇧ Shift + B inserts a block quote at the current position Ctrl + B formats the selected text bold Ctrl + I formats the selected text italic Ctrl + U formats the selected text underline Alt + ⇧ Shift + S strikes out the selected text Ctrl + ⇧ Shift + U cycles through the cases of the selected text Tab indents the selected text (also works on multiple lines) ⇧ Shift + Tab un-indents the selected text Tab after an unordered list character indents the list item ⇧ Shift + Tab after an unordered list character un-indents the list item Return in lists creates a new list item Alt + Left jumps back in the note history Alt + Right jumps forward in the note history Ctrl + ⇧ Shift + 1..9 sets a note bookmark on bookmark slot 1..9 Ctrl + 1..9 jumps to the note bookmark on bookmark slot 1..9 Ctrl + + increases the note text font size by one point Ctrl + - decreases the note text font size by one point Ctrl + 0 resets the note text font size Ctrl + Space tries to solve simple equations like (4+5)*3= in front of the cursor, auto-completes text or opens urls Ctrl + ⇧ Shift + H inserts a headline from the note filename at the top of the note Alt + ⇧ Shift + X splits the current note into two notes at the current cursor position Alt + ⇧ Shift + W searches for the selected text on the web Ctrl + Up scrolls the content up Ctrl + Down scrolls the content down Ctrl + ⇧ Shift + Down moves the current line down Ctrl + ⇧ Shift + Up moves the current line up ⇧ Shift + Return adds two spaces and a newline character to force a markdown newline # In the note preview panel Ctrl + F lets you search in the current note use the Up and Down keys or F3 and ⇧ Shift + F3 keys to jump to the previous and next matches Esc closes the search bar # In the Todo list Ctrl + S saves the current todo item Ctrl + I saves the current todo item and inserts in into the current note Ctrl + R removes the current todo item # macOS # In the main window ⌘ Cmd + N creates a new note with the current date and time in the name ⌘ Cmd + ⇧ Shift + N creates a new note in a new tab ⌘ Cmd + ⇧ Shift + F lets you search for notes (in the name of the note and its content) ⌃ Ctrl + F lets you search for notes in all tags / subfolders ⌃ Ctrl + ⇧ Shift + P switches to the previous workspace ⌘ Cmd + ⇧ Shift + E edits an encrypted note ⌃ Ctrl + R removes the current note ⌃ Ctrl + ⇧ Shift + U checks for updates ⌘ Cmd + ⇧ Shift + T opens the todo list ⌘ Cmd + ⇧ Shift + O opens the current note in an external editor ⌃ Ctrl + ⇧ Shift + O opens the current note in a view ⌃ Ctrl + ⇧ Shift + F opens the folder of the current note in Finder ⌃ Ctrl + ⇧ Shift + E enables or disables