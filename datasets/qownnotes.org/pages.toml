full_description = "# QOwnNotesAPI Nextcloud App QOwnNotesAPI (opens new window) può gestire l'accesso alle note spostate nel cestino e alle versioni delle note per te. TIP Puoi abilitare QOwnNotesAPI direttamente nella tua istanza Nextcloud o ownCloud cercando qownnotes nella pagina delle app del tuo server su https://<your-cloud-domain>/settings/apps. Pagina delle App Nextcloud (opens new window) Pagina delle App ownCloud (opens new window) La condivisione delle note viene eseguita tramite l'API fornita da Nextcloud / ownCloud. Le attività sono accessibili direttamente tramite CalDAV. Usa il tuo client di sincronizzazione Nextcloud / ownCloud per sincronizzare le tue note, che sono semplici file markdown. Non è necessario reinventare la ruota. E ci sono anche persone che usano servizi diversi per sincronizzare i propri file di note (come Dropbox, Syncthing o Resilio Sync). ::: # Cosa fa QOwnNotesAPI Accesso alle note spostate nel cestino Accesso alle versioni delle note # Cosa non fa QOwnNotesAPI Sincronizzazione delle note (si prega di usare il proprio client di sincronizzazione ownCloud / Nextcloud) Condivisione delle note (che viene eseguita direttamente tramite l'API ownCloud / Nextcloud) Accesso alle immagini da Nextcloud Text (opens new window) (che viene fatto direttamente tramite l'API Nextcloud) Aiutaci a migliorare questo sito! (opens new window) ← QOwnNotes Web App Alla ricerca di note → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
