["https://qownnotes.org/ar/getting-started/importing-notes.html"]
title = "استيراد الملاحظات | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# استيراد الملاحظات # Evernote يمكنك الوصول إلى صندوق حوار استيراد Evernote من قائمة ملاحظة > استيراد لاستيراد ملفات Enex. سيستورد أيضا الصور والملحقات والوسوم والبيانات الوصفية والتنسيق الأساسي للنصوص. # Joplin يمكنك الوصول إلى صندوق حوار استيراد Joplin من قائمة ملاحظة > استيراد. # صيغ عديدة تستطيع أداة سطر الأوامر jimmy (opens new window) تحويل صيغ عديدة إلى صيغة ماركداون (مثل Google Keep (opens new window)، و Synology Note Station (opens new window)، وغيرهما الكثير (opens new window)). للاحتفاظ بكل ما يمكن من البيانات الوصفية، ننصح بتطبيق تطويعات إضافية (opens new window). لو واجهتك مشكلة في التحويل، يمكنك إنشاء مسألة في GitHub (opens new window). # Google Keep استخدم Google Takeout لتنزيل مهام Keep استخرج محتويات الملف المضغوط نزّل keep_to_markdown.py إلى جوار مجلد Keep الذي استخرجته python keep_to_markdown.py Keep out/ أبدل الاسم Keep في الأمر باسم المجلد الذي فيه الملاحظات بصيغة JSON. ومجلد out سيُنشأ إذا لم يكن موجودا. من https://gitlab.com/-/snippets/2002921 (opens new window) # تومبوي يمكنك استيراد ملاحظاتك من تومبوي باستخدام بُريمج يُسمى Trombone (opens new window). ربما تحتاج إلى تثبيت python2 حتى يعمل. سيحوّل ملاحظاتك في تومبوي إلى ملف Evernote بالامتداد enex، والذي يمكنك عندئذٍ استيراده إلى QOwnNotes. إلى من يريد فعل ذلك: تأكد أولا من أن Python2 مثبتة لديك، وربما تحتاج أيضا إلى تثبيت python-is-python2 (يمكنك إزالتها فيما بعد). قد يكون فعل ذلك أسهل أو أأمن في جذر بديل (chroot) أو حاوية Docker، إذا أمكنك ذلك (سنشرح هذا هنا فيما بعد). sudo apt install python2 python-is-python2 1نزّل ملف trombone من GitHub، واستخرج محتوياته، وانتقل إلى المجلد الناتج: cd ~/Downloads/trombone-master sudo make sudo make install 1234ثم انتقل إلى المجلد الذي فيه ملاحظات تومبوي الخاصة بك: cd ~/.local/share/tomboy/ 1ثم نفّذ هذا الأمر: find ./ -type f -name '*.note' -print0 | xargs -0 trombone > EXPORT.enex 1إذا واجهت أخطاء بخصوص يونيكود بسبب ملفات ملاحظات معينة، عليك فقط أن تزيل هذه الملاحظات وتنفّذ أمر التحويل مجددا حتى يعطيك رسالة تقول Saving... . ستجد ملفًا اسمه EXPORT.enex والذي يمكنك عندئذٍ استيراده إلى QOwnNotes. عند الاستيراد إلى QOwnNotes، قد تود تعطيل جميع الخصائص المراد استيرادها، ربما باستثناء تاريخ الإنشاء والتحديث، لأن تومبوي لا يدعم تلك الخصائص. ساعدنا في تحسين هذه الصفحة! (opens new window) ← ماركداون (Markdown) مُعامِلات واجهة سطر الأوامر → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
