["https://qownnotes.org/ar/getting-started/browser-extension.html"]
title = "إضافة المتصفح رفيقة ويب QOwnNotes | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# إضافة المتصفح رفيقة ويب QOwnNotes تتيح لك قص المحتوى من صفحات المتصفح وكذلك إدارة إشارات المتصفح المرجعية عبر المتصفحات وأنظمة التشغيل المختلفة. TIP يجب أن يكون QOwnNotes مفتوحا حتى تعمل إضافة المتصفح رفيقة الويب. لا حاجة للاتصال بالإنترنت. إضافة المتصفح تعمل بدون اتصال. # التثبيت الحصول على الإضافة ‏سوق Chrome الإلكتروني (opens new window) صفحة إضافات فيرفكس (opens new window) يمكنك أيضا أن تجد الإضافة على GitHub (opens new window). إضافة رمز الأمان لإعداد الإضافة. المرة الأولى التي ستنقر فيها على أيقونة إضافة المتصفح QOwnNotes، سيظهر لك صندوق حواري فيه رمز أمان. انسخ الرمز. اذهب إلى مكان إدارة الإضافات في متصفحك. انقر على تفاصيل إضافة QOwnNotes. ألصق الرمز إلى خانة رمز الأمان. لاستعمال الوضع الخصوصي، عليك السماح للإضافة بالعمل في النوافذ الخصوصية، في إعدادات الإضافة. # مقص الويب انقر بزر الفأرة الأيمن على صفحة ويب أو حدد نصًّا حتى تستخدم وظيفة مقص الويب. يمكنك كذلك إنشاء ملاحظة جديدة بلقطة شاشة من صفحة الويب الحالية. WARNING Info إن لم يعمل مقص الويب، فتأكد أن تطبيق QOwnNotes الحاسوبي مفتوح، وأن رمز الأمان مضبوط في إضافة المتصفح الرفيقة. وتأكد كذلك أنك قبلت تجميع بيانات المستخدم عندما ضغطت على أيقونة الإضافة أول مرة في شريط المتصفح. وإذا كنت تستخدم فيرفكس، فتحتاج كذلك أن تتأكد أنك فعّلت الصلاحية الاختيارية الوصول إلى بياناتك لكل المواقع في إعدادات صلاحيات الإضافة، وإلا فقد تقابل الخطأ: TypeError: chrome.tabs.captureVisibleTab is not a function. TIP مقص الويب قابل للبرمجة أيضا! ألقِ نظرة على websocketRawDataHook إذا أردت التحكم في ما تقصه من صفحات الويب. # الإشارات المرجعية إذا أردت تحكمًا كاملًا في إشارات المتصفح المرجعية الخاصة بك وتريد استخدامها عبر متصفحات وأنظمة تشغيل مختلفة فإن إضافة متصفح QOwnNotes من أجلك. ستُظهر إضافة المتصفح مبدئيا جميع روابط الملاحظة الحالية في نافذة منبثقة عندما تضغط على أيقونة QOwnNotes في متصفحك. سيكون لهذه الروابط الوسم current. يمكنك أيضا إدارة إشاراتك المرجعية في ملاحظات ذات الوسم bookmarks (والذي يمكن تغييره في الإعدادات). يمكن أن تعطى لهذه الروابط وسومًا ووصفًا ليظهروا في إضافة المتصفح. سيتم تخزين الإشارات المرجعية الجديدة في ملاحظة اسمها Bookmarks (والذي يمكن تغييره أيضا في الإعدادات). TIP يمكنك استيراد إشاراتك المرجعية من المتصفح إلى QOwnNotes باستخدام إضافة المتصفح رفيقة الويب! # صيغ روابط الإشارات المرجعية - [اسم صفحة الوب](https://www.example.com) - [اسم صفحة الوب](https://www.example.com) #وسم١ #وسم٢ - [اسم صفحة الوب](https://www.example.com) شيء من الوصف فقط - [اسم صفحة الوب](https://www.example.com) #وسم١ #وسم٢ شيء من الوصف والوسوم * [اسم صفحة الوب](https://www.example.com) رمز عناصر القائمة البديل صالح أيضا 12345يمكنك البحث في إضافة المتصفح بالاسم أو وسوم الرابط أو الوصف. تُحلَّل كل الروابط الأخرى في الملاحظة الحالية، لكن بغير وسوم أو وصف. ساعدنا في تحسين هذه الصفحة! (opens new window) ← مُعامِلات واجهة سطر الأوامر مدير قصاصات سطر الأوامر → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
