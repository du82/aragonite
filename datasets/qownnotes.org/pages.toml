["https://qownnotes.org/ar/installation/debian.html"]
title = "التثبيت على دبيان | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = '''# التثبيت على دبيان # دبيان 12.0 نفّذ الأوامر التالية في الطرفية لاستيثاق المستودع. SIGNED_BY='/etc/apt/keyrings/qownnotes.gpg' sudo mkdir -p "$(dirname "${SIGNED_BY}")" curl --silent --show-error --location http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Debian_12/Release.key | gpg --dearmor | sudo tee "${SIGNED_BY}" > /dev/null sudo chmod u=rw,go=r "${SIGNED_BY}" 1234نفّذ الأوامر التالية في الطرفية لإضافة المستودع وتثبيت QOwnNotes منه. SIGNED_BY='/etc/apt/keyrings/qownnotes.gpg' ARCHITECTURE="$(dpkg --print-architecture)" echo "deb [arch=${ARCHITECTURE} signed-by=${SIGNED_BY}] http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Debian_12/ /" | sudo tee /etc/apt/sources.list.d/qownnotes.list > /dev/null sudo apt update sudo apt install qownnotes 12345TIP إذا استخدمت هذا المستودع مع نسخة أخرى من دبيان، فنرجو التأكد من أن Qt النسخة 5.15 على الأقل مثبتة لديك. تنزيل مباشر (opens new window) # دبيان 11.0 نفّذ الأوامر التالية في الطرفية لاستيثاق المستودع. SIGNED_BY='/etc/apt/keyrings/qownnotes.gpg' sudo mkdir -p "$(dirname "${SIGNED_BY}")" curl --silent --show-error --location http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Debian_11/Release.key | gpg --dearmor | sudo tee "${SIGNED_BY}" > /dev/null sudo chmod u=rw,go=r "${SIGNED_BY}" 1234نفّذ الأوامر التالية في الطرفية لإضافة المستودع وتثبيت QOwnNotes منه. SIGNED_BY='/etc/apt/keyrings/qownnotes.gpg' ARCHITECTURE="$(dpkg --print-architecture)" echo "deb [arch=${ARCHITECTURE} signed-by=${SIGNED_BY}] http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Debian_11/ /" | sudo tee /etc/apt/sources.list.d/qownnotes.list > /dev/null sudo apt update sudo apt install qownnotes 12345TIP إذا استخدمت هذا المستودع مع نسخة أخرى من دبيان، فنرجو التأكد من أن Qt النسخة 5.11 على الأقل مثبتة لديك. تنزيل مباشر (opens new window) # دبيان 10.0 نفّذ الأوامر التالية في الطرفية لاستيثاق المستودع. wget http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Debian_10/Release.key -O - | sudo apt-key add - 1نفّذ الأوامر التالية في الطرفية لإضافة المستودع وتثبيت QOwnNotes منه. sudo bash -c "echo 'deb http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Debian_10/ /' >> /etc/apt/sources.list.d/qownnotes.list" sudo apt-get update sudo apt-get install qownnotes 123TIP إذا استخدمت هذا المستودع مع نسخة أخرى من دبيان، فنرجو التأكد من أن Qt النسخة 5.8 على الأقل مثبتة لديك. تنزيل مباشر (opens new window) # دبيان 9.0 نفّذ الأوامر التالية في الطرفية لاستيثاق المستودع. wget http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Debian_9.0/Release.key -O - | sudo apt-key add - 1نفّذ الأوامر التالية في الطرفية لإضافة المستودع وتثبيت QOwnNotes منه. sudo bash -c "echo 'deb http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Debian_9.0/ /' >> /etc/apt/sources.list.d/qownnotes.list" sudo apt-get update sudo apt-get install qownnotes 123TIP إذا استخدمت هذا المستودع مع نسخة أخرى من دبيان، فنرجو التأكد من أن Qt النسخة 5.5 على الأقل مثبتة لديك. تنزيل مباشر (opens new window) ساعدنا في تحسين هذه الصفحة! (opens new window) ← التثبيت على ماك أو إس التثبيت على openSUSE Linux → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!'''
