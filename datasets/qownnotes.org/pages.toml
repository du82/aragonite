["https://qownnotes.org/hu/getting-started/concept.html"]
title = "Koncepció | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# Koncepció # QOwnNotes A QOwnNotes jegyzeteket tárol a jegyzetek mappájában markdown fájlként Kommunikál a Nextcloud / ownCloud szerverével, hogy nyilvánosan oszhassa meg a jegyzeteket másokkal A jegyzetelőzményeket és a kukákat is elérheti a Nextcloud / ownCloud szerveren a QOwnNotesApi Nextcloud alkalmazáson keresztül A Nextcloud / ownCloud szerveren szereplő Todo listák a QOwnNotes szolgáltatásból érhetők el A QOwnNotes nem szinkronizálja a jegyzeteit és a média / melléklet fájlokat! A fájlszinkronizálás összetett erőfeszítés, máris vannak nagyszerű fájlszinkronizálási megoldások (lásd: Nextcloud asztali szinkronizálási kliens) # Markdown jegyzetfájlok Az összes jegyzeted és média- / mellékletfájlod a te tulajdonodban van! Jegyzeteit egyszerű szöveges Markdown-fájlokként tárolja az asztali számítógépe A QOwnNotes mellett tetszőleges szövegszerkesztőt használhat a jegyzetfájlok megtekintésére vagy szerkesztésére A jegyzetek szinkronizálása más eszközökkel (asztali és mobil) a Nextcloud (opens new window) vagy a ownCloud (opens new window) szinkronizálási klienssel a szerverhez # QOwnNotes böngészőbővítmény Kezelheti a böngésző könyvjelzőit a QOwnNotes szolgáltatással, vagy használhatja webleíró eszközként. TIP A böngészőbővítmények offline működnek, nincs szükség internetkapcsolatra. További információért keresse fel a QOwnNotes Web Companion böngészőbővítményt. # QOwnNotes command-line snippet manager A QOwnNotes segítségével kezelheti parancsrészleteit, és végrehajthatja őket a parancssorban. TIP További információért keresse fel a QOwnNotes parancssori kódrészletkezelőt. # Nextcloud asztali szinkronizáló kliens A jegyzetek szinkronizálása más eszközökkel (asztali & mobil) a Nextcloud (opens new window) vagy a ownCloud (opens new window) szinkronizálási klienssel a szerverhez. TIP Természetesen más megoldások, például a Dropbox, a szinkronizálás, a Seafile vagy a BitTorrent Sync is használhatók a jegyzetek és más fájlok szinkronizálására. A git használatával szinkronizálhat olyan eszközökkel is, mint a gitomatic (opens new window). # Nextcloud szerver A jegyzetek online kezeléséhez használhat olyan szervereket, mint a Nextcloud (opens new window) vagy a ownCloud (opens new window). Hosztolhatja saját szerverét, vagy használhat hosztolt megoldásokat. Van egy közösség által karbantartott Nextcloud szolgáltatók listája (opens new window), valamint egy Nextcloudot használó eszközök listája (opens new window). A Portknox (opens new window) jelentése szerint a QOwnNotesAPI telepítve van (opens new window). TIP Természetesen más megoldások, például a Dropbox, a szinkronizálás, a Seafile vagy a BitTorrent Sync is használhatók a jegyzetek és más fájlok tárolására. # QOwnNotesAPI Nextcloud app A QOwnNotesAPI (opens new window) segítségével hozzáférhet a kiszolgálóoldali kukába helyezett jegyzetek és jegyzetek verzióihoz. TIP További információkért keresse fel a QOwnNotesAPI Nextcloud alkalmazást. # Nextcloud Notes szerver alkalmazás A Nextcloud Notes (opens new window) használatával szerkesztheti a jegyzeteit az interneten. WARNING Ne feledje, hogy a Nextcloud Notes jelenleg csak egy szintű almappákat támogat. # Nextcloud Deck server app You can use QOwnNotes to quickly create cards in Nextcloud Deck (opens new window). # Nextcloud Notes mobile app To access your Nextcloud / ownCloud notes from your mobile device you can use different apps. # Android Nextcloud Notes for Android (opens new window) (harmadik fél) TIP You could also use any sync-tool like Synchronize Ultimate or FolderSync to sync your note files and use software like neutriNotes to edit your notes. # iOS CloudNotes iOS rendszerhez (opens new window) (harmadik fél) TIP You can also use Notebooks (opens new window) and sync your notes via WebDAV, there is a good tutorial at Taking Notes with Nextcloud, QOwnNotes, and Notebooks (opens new window) # api.qownnotes.org This is an online service provided by QOwnNotes to check if there is a new release of the application available. It is talking to GitHub and checks for the latest release, gets a suited download url and compiles the changes from the changelog compared to the version of QOwnNotes you are currently using as html to show in the update dialog. In addition, it also provides the Release RSS Feed (opens new window) and an implementation of the legacy update checking api for older versions of QOwnNotes. TIP You can access the source code for api.qownnotes.org (opens new window) on GitHub (opens new window). # QOwnNotes Web App You can insert photos from your mobile phone into the current note in QOwnNotes on your desktop via the web application on app.qownnotes.org (opens new window). TIP Please visit QOwnNotes Web App for more information. Segítsen javítani ezt az oldalt! (opens new window) ← Áttekintés QOwnNotes Demo → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
