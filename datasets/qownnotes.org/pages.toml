title = "단축키 | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# 단축키 # Linux / Windows # 기본 창에서 Ctrl + N 이름에 현재 날짜와 시간이 포함된 새 노트를 만듭니다 Ctrl + ⇧ Shift + N 새 탭에서 새 노트를 만듭니다 Ctrl + ⇧ Shift + F 노트를 검색할 수 있습니다 (노트 이름 및 내용) Alt + F 모든 태그/하위 폴더에서 노트를 검색할 수 있습니다 Alt + ⇧ Shift + P 이전 작업 공간으로 전환합니다 Ctrl + ⇧ Shift + E 암호화된 노트를 편집합니다 Alt + R 현재 노트를 제거합니다 Alt + ⇧ Shift + U 업데이트를 확인합니다 Ctrl + ⇧ Shift + T 작업관리 목록을 엽니다 Ctrl + ⇧ Shift + O 외부 편집기에서 현재 노트를 엽니다 Alt + ⇧ Shift + O 보기에서 현재 노트를 엽니다 Alt + ⇧ Shift + F 파일 관리자의 현재 노트를 표시합니다 Alt + ⇧ Shift + E 노트 편집 사용 또는 사용 안 함 Alt + Up 이 이전에 표시된 음으로 점프합니다 Alt + Down 다음으로 보이는 노트로 이동합니다 Alt + Page Up 이전 노트 탭으로 이동합니다 Alt + Page Down 다음 노트 탭으로 이동합니다 Ctrl + W 현재 노트 탭을 닫습니다 Ctrl + ⇧ Shift + D 주의 집중 해제 모드를 전환합니다 Esc로도 닫을 수 있습니다 Ctrl + P 현재 노트를 텍스트로 인쇄합니다 Ctrl + ⇧ Shift + P 현재 노트를 마크다운으로 인쇄합니다 Ctrl + ⇧ Shift + V 클립보드에서 노트, 이미지 및 HTML을 붙여넣습니다 Ctrl + , 설정을 엽니다 Alt + ⇧ Shift + A 노트에 새 태그를 추가합니다 Ctrl + ⇧ Shift + R 현재 노트 폴더를 다시 로드합니다 Ctrl + Alt + F 다른 노트 폴더를 선택할 수 있습니다 Ctrl + ⇧ Shift + S 스크립팅 엔진을 다시 로드합니다 Ctrl + ⇧ Shift + M 기본 메뉴 표시줄을 숨기거나 표시합니다 Ctrl + ⇧ Shift + A 작업을 검색할 수 있습니다 Ctrl + S 수정된 노트를 수동 저장합니다 Alt + ⇧ Shift + I 스크립트 저장소 대화 상자를 엽니다 F4 노트 편집 패널로 이동합니다 F5 노트 목록으로 이동합니다 F6 노트 하위 폴더 패널로 이동합니다 F7 태그 패널로 이동합니다 F8 탐색 패널로 이동합니다 F10 현재 위젯의 상황에 맞는 메뉴를 활성화합니다 F11 전체 화면 모드로 전환합니다 Alt + ⇧ Shift + H 현재 노트의 헤드라인을 복사합니다 # 노트 검색 표시줄 Down 또는 Tab 노트 목록에 집중을 설정합니다 Return 검색 줄의 텍스트를 헤드라인으로 사용하여 새 노트를 만듭니다 # 노트 목록에서 노트를 두 번 클릭하여 새 탭에서 노트를 엽니다 (두 번 클릭 작업을 재정의할 수 있는 스크립팅 후크가 있습니다) Ctrl + A 모든 노트를 선택합니다 (오른쪽 클릭으로 이동, 복사 또는 제거) Tab 또는 Return 현재 노트를 편집할 수 있습니다 # 노트 텍스트 편집 패널에서 Ctrl + 링크를 클릭하여 엽니다 Ctrl + F 현재 노트에서 검색할 수 있습니다 Up 및 Down 또는 F3 및 ⇧ Shift + F3 키를 사용하여 이전 및 다음 일치로 이동합니다 Esc 검색 표시줄을 닫습니다 Ctrl + R을 사용하여 현재 노트를 검색하고 바꿀 수 있습니다 Ctrl + D 현재 줄 또는 선택한 텍스트를 복제합니다 Ctrl + Alt + Down도 마찬가지입니다 Alt + 백스페이스 현재 줄을 삭제합니다 Ctrl + 백 스페이스 현재 단어를 삭제합니다 Ctrl + L 텍스트 링크를 추가하는 대화 상자를 엽니다 (선택한 텍스트에서도 작동) Ctrl + ⇧ Shift + L은 노트 링크를 추가하는 대화 상자를 엽니다 Ctrl + T 현재 날짜와 시간을 사용자별 형식으로 삽입합니다 Ctrl + ⇧ Shift + I 이미지를 삽입합니다 (이미지가 현재 노트 폴더의 미디어 폴더에 복사됩니다) Ctrl + ⇧ Shift + X 첨부 파일을 삽입합니다 (파일이 현재 노트 폴더의 첨부 파일 폴더에 복사됩니다) Alt + ⇧ Shift + T 표를 삽입합니다 Ctrl + ⇧ Shift + C 현재 위치에 코드 블록을 삽입합니다 Ctrl + ⇧ Shift + B 현재 위치에 블록 따옴표를 삽입합니다 Ctrl + B 선택한 텍스트를 굵게 표시합니다 Ctrl + I 선택한 텍스트를 기울임꼴로 표시합니다 Ctrl + U 선택한 텍스트 밑줄 형식을 지정합니다 Alt + ⇧ Shift + S 선택한 텍스트를 취소선을 표시합니다 Ctrl + ⇧ Shift + U 선택한 텍스트의 대소문자를 순환합니다 Tab 선택한 텍스트를 들여쓰기합니다 (여러 줄에서도 작동) ⇧ Shift + Tab 선택한 텍스트의 들여쓰기를 해제합니다 Tab 정렬되지 않은 목록 문자 뒤의 목록 항목을 들여쓰기합니다 ⇧ Shift + Tab 정렬되지 않은 목록 문자 뒤의 목록 항목의 들여쓰기를 해제합니다 Return 목록에서 새 목록 항목을 만듭니다 Alt + Left 노트 기록으로 돌아갑니다 Alt + Right 노트 기록에서 앞으로 이동합니다 Ctrl + ⇧ Shift + 1..9 북마크 슬롯 1...9에 노트 북마크를 설정합니다 Ctrl + 1..9 북마크 슬롯 1..9의 노트 북마크로 이동합니다. Ctrl + + 노트 텍스트 글꼴 크기를 1포인트 늘립니다 Ctrl + - 노트 텍스트 글꼴 크기를 1포인트 줄입니다 Ctrl + 0 노트 텍스트 글꼴 크기를 재설정합니다 Ctrl + 스페이스 커서 앞에서 (4+5)*3=와 같은 간단한 방정식을 풀거나 텍스트를 자동으로 선택하거나 Url을 엽니다 Ctrl + ⇧ Shift + H 노트 파일 이름의 헤드라인을 노트 상단에 삽입합니다 Alt + ⇧ Shift + X 현재 커서 위치에서 현재 노트를 두 개의 노트로 분할합니다 Alt + ⇧ Shift + W 웹에서 선택한 텍스트를 검색합니다 Ctrl + Up 내용을 위로 스크롤합니다 Ctrl + Down 내용을 아래로 스크롤합니다 Ctrl + ⇧ Shift + Down 현재 줄을 아래로 이동합니다 Ctrl + ⇧ Shift + Up 현재 줄을 위로 이동합니다 ⇧ Shift + Return 두 개의 공백과 새 줄 문자를 추가하여 새 줄을 강제로 표시합니다 # 노트 미리 보기 패널에서 Ctrl + F 현재 노트에서 검색할 수 있습니다 Up 및 Down 키 또는 F3 및 ⇧ Shift + F3 키는 이전 및 다음 일치 항목으로 이동합니다 Esc 검색 표시줄을 닫습니다 # 할 일 목록에서 Ctrl + S 현재 할 일 항목을 저장합니다 Ctrl + I 현재 할 일 항목을 저장하고 현재 노트에 삽입합니다 Ctrl + R 현재 작업관리 항목을 제거합니다 # macOS # 기본 창에서 ⌘ Cmd + N 이름에 현재 날짜와 시간이 포함된 새 노트를 만듭니다 ⌘ Cmd + ⇧ Shift + N 새 탭에 새 노트를 만듭니다 ⌘ Cmd + ⇧ Shift + F 노트를 검색할 수 있습니다 (노트 및 내용 이름) ⌃ Ctrl + F 모든 태그/하위 폴더에서 노트를 검색할 수 있습니다 ⌃ Ctrl + ⇧ Shift + P 이전 작업영역으로 전환합니다 ⌘ Cmd + ⇧ Shift + E 암호화된 노트를 편집합니다 ⌃ Ctrl + R 현재 노트를 제거합니다 ⌃ Ctrl + ⇧ Shift + U 업데이트를 확인합니다 ⌘ Cmd + ⇧ Shift + T 작업관리 목록을 엽니다 ⌘ Cmd + ⇧ Shift + O 외부 편집기에서 현재 노트를 엽니다 ⌃ Ctrl + ⇧ Shift + O 보기에서 현재 노트를엽니다 ⌃ Ctrl + ⇧ Shift + F 파인더에서 현재 노트의 폴더를 엽니다 ⌃ Ctrl + ⇧ Shift + E 노트 편집을 활성화 또는 비활성화합니다 ⌃ Ctrl + Up 이전에 볼 수 있는 노트로 이동합니다 ⌃ Ctrl + Down 보이는 다음 노트로 이동합니다 ⌥ Alt + Page Up 이전 노트 탭으로 이동합니다 ⌥ Alt + Page Down 다음 노트 탭으