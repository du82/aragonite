title = "التثبيت على ميكروسوفت ويندوز | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = '# التثبيت على ميكروسوفت ويندوز نزّل الملف المضغوط لويندوز من إصدارات QOwnNotes على GitHub (opens new window) (ابحث عن ملف اسمه QOwnNotes.zip) واستخرجه إلى أي مكانٍ تشاء. لا حاجة إلى تثبيت أي شيء! WARNING إذا أردت استخدام التحديث التلقائي فنرجو التأكد من استخراجه إلى مكان مسموح لحسابك بالكتابة فيه. غالبًا ليس لحسابك إذن الكتابة في مجلدات مثل C:\Program Files (x86) أو C:\Program Files. يمكنك إذًا تشغيل QOwnNotes.exe من مجلد QOwnNotes مباشرةً؛ لا حاجة إلى تثبيت أي شيء. # الوضع المحمول استخدم QOwnNotesPortable.bat لتشغيل QOwnNotes في الوضع المحمول حيث سيتم تخزين كل شيء (بما في ذلك ملاحظاتك) في مجلد QOwnNotes الخاص بك. TIP لستَ مضطرًا إلى استخدام الوضع المحمول إن لم تكن لديك صلاحيات إدارية في حاسوبك. لا يحتاج QOwnNotes إلى تثبيته ليعمل! # ويندوز إكس بي أوقف إطار Qt دعم ويندوز إكس بي منذ النسخة 5.8، لكن يتم بناء QOwnNotes الآن بنسخة 5.7 من Qt لجعله متاحًا لمستخدمي ويندوز إكس بي. عليك تنزيل مِلف ZIP من AppVeyor (opens new window) بنفسك واستخراجه إلى أي مجلد تشاء. يمكنك إذًا تشغيل QOwnNotes.exe من هذا المجلد مباشرةً؛ لا حاجة إلى تثبيت أي شيء. TIP معلومة آلية التحديث التلقائي لا تعمل مع نسخة AppVeyor المبنية لويندوز إكس&nbps;بي! عليك تنزيل الإصدارات الجديدة بنفسك. # Chocolatey يرعى المجتمع حزمة QOwnNotes في Chocolatey (opens new window). يمكنك تثبيتها بالأمر: choco install qownnotes 1# Scoop توجد حزمة يرعاها المجتمع من QOwnNotes (opens new window) في Scoop (opens new window). يمكنك تثبيت QOwnNotes في الوضع المحمول إذا أضفت «Extras bucket». scoop bucket add extras scoop update scoop install qownnotes 123 ساعدنا في تحسين هذه الصفحة! (opens new window) ← التثبيت على أوبنتو وإلمنتري ولينكس منت التثبيت على ماك أو إس → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!'
