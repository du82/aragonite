title = "ماركداون (Markdown) | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = '# ماركداون (Markdown) المراد من هذه الورقة أن تكون مرجعا سريعا وأن تُظهر صياغة ماركداون في QOwnNotes. # Headings استخدم العنوان لتنظيم نصوصك. # عنوان مستوى أول ## عنوان مستوى ثان ### عنوان مستوى ثالث #### عنوان مستوى رابع ##### عنوان مستوى خامس ###### عنوان مستوى سادس 123456TIP لوحة التنقل تُظهر هيكل عناوينك. كبديل، للعناوين من المستويين الأول والثاني، يمكن تسطيرهم هكذا: شكل بديل لعناوين المستوى الأول ================================== شكل بديل لعناوين المستوى الثاني ------------------------------------ 12345TIP بشكل افتراضي QOwnNotes ينشئ اسم ملف الملاحظة من عنوان المستوى الأول (h1). # التوكيد التوكيد البسيط، أو الخط المائل، يكون *بنجمة واحدة على كل جانب*. التوكيد القوي، أو الخط العريض، يكون **بنجمتين اثنتين على كل جانب**. 123TIP يمكنك استخدام الاختصار Ctrl + B لجعل النص عريضًا وأيضا Ctrl + I لجعله مائلًا. # التسطير يوجد كذلك إعداد اختياري لتفعيل عرض التسطير في إعدادات المعاينة. _مسطر_ 1TIP يمكنك استخدام الاختصار Ctrl + U لتسطير نص. # الشطب ~~مشطوب~~ 1TIP يمكنك استخدام الاختصار Alt + Shift + S لشطب نص. # القوائم توجد طرق عديدة لإنشاء قوائم. 1. العنصر الأول في قائمة مرقمة 2. عنصر آخر * قائمة منقوطة فرعية. 1. الرقم الفعلي غير مهم؛ المهم أنه رقم 1. قائمة مرقمة فرعية (تعمل فقط في المحرر، ولا تعمل في المعاينة) 4. وعنصر آخر. * القوائم المنقوطة قد تستخدم النجوم - أو الشرطات + أو علامات الجمع 12345678910TIP إذا ضغطت Enter في نهاية قائمة، سيتم إنشاء عنصر قائمة جديد. # الروابط أكثر استخدام الروابط للإشارة إلى صفحات ويب أو إلى ملاحظات أخرى. وتُعرَّف الروابط بأكثر من طريقة. # الروابط الخارجية [أنا رابط مُعرَّف في مكاني](https://www.google.com) [أنا رابط مُعرَّف في مكاني ولي عنوان](https://www.google.com "الصفحة الرئيسية لـGoogle") [يمكنك استخدام الأرقام لتعريف الروابط بأسلوب المراجع][1] الروابط المجردة والروابط المحاطة بأقواس زاويّة ستُحوّل آليًا إلى روابط في المعاينة. http://www.example.com أو <http://www.example.com> [1]: https://www.qownnotes.org 12345678910# الروابط الداخلية [هذا رابط لملف ملاحظة اسمه Journal.md](Journal.md) <Journal.md> يعمل أيضا. 123TIP يمكنك استخدام الاختصار Ctrl + L لإنشاء روابط إلى صفحات ويب أو إلى ملاحظات أخرى. اضغط Ctrl + Shift + X لإظهار حوار يساعدك في إدراج مرفق في الملاحظة. يمكنك ضغط Ctrl + Space والمؤشر على رابط في محرر الملاحظات لفتحه. # الإشارات المرجعية الإشارات المرجعية المستخدمة في إضافة المتصفح رفيقة ويب QOwnNotes تستخدم روابط في قوائم. - [اسم صفحة الوب](https://www.example.com) #وسم١ #وسم٢ شيء من الوصف والوسوم 1# الصور يمكن تضمين الصور في QOwnNotes. وستظهر في المعاينة. ![نص بديل](media/my-image.jpg) 1TIP استخدم الاختصار Ctrl + Shift + I لإدراج صورة في الملاحظة. يمكن أن تكون الصورة أيضا في الحافظة؛ سيكتشفها الحوار ويظهر معاينة لها. يمكنك أيضا لصق الصورة من الحافظة مباشرةً في الملاحظة بالاختصار Ctrl + Shift + V. # الأكواد المضمّنة وكتل الأكواد `الأكواد` المضمّنة في السطر حولها `فاصلة عُليا مائلة` (زر `ذ` في تخطيط لوحة المفاتيح الإنجليزي الشائع، أو `Shift + ع` في التخطيط العربي الشائع). 1TIP يمكنك استخدام الاختصار Ctrl + Shift + C على نص محدد، أو مجرد داخل نص، لجعله كود مضمّن. كتل الأكواد إما أن تكون مُسوّرة بسطرين كلٍ منهما به ثلاث فاصلات عُليا مائلة، وإما أن تكون سطورها مبدوءة بأربع مسافات. # سور المسافات الأربعة أضف أربع مسافات في بداية كل سطر من سطور كودك لتنسيقه ككتلة كود. <div dir="ltr">s = "كود بمسافات بادئة" print s</div> 12# سور الفاصلات العليا المائلة يمكنك أيضا استخدام ثلاث فاصلات عليا مائلة لإنشاء كتلة كود. ``` الكود يأتي هنا الكود يأتي هنا ``` 1234TIP يمكنك استخدام الاختصار Ctrl + Shift + C على عدد من السطور المحددة أو في سطر فارغ لإنشاء كتلة كود. # سور الفاصلات مع تلوين الأكواد يوجد كذلك شيء من التلوين النحوي لكتل الأكواد في QOwnNotes. ~~~markdown ```bash # أنا تعليق cd Notes ``` ~~~ اللغات المدعومة حاليا (ومعرِّفات كتل الأكواد) هي: BASh scripting, bash C, c C++, cpp C++, cxx C++, c++ C#, c# CMake, cmake C#, csharp CSS, css Go, go HTML, html INI, ini Java, java JavaScript, javascript JavaScript, js JSON, json Makefile, make PHP, php Python, py Python, python QML, qml Rust, rust Shell scripting, sh SQL, sql TypeScript, ts TypeScript, typescript V, v Vex, vex XML, xml YAML, yml YAML, yaml # الجداول الجداول ليست جزءًا من جوهر مواصفات ماركداون، لكن معاينة QOwnNotes تدعمها. يمكن استخدام النقطتين الرأسيتين لمحاذاة الأعمدة. | الجداول | رائعة | حقا | | ------------- |:-------------:| -----:| | العمود الثالث | محاذى لليمين | $1600 | | العمود الثاني | ممركز | $12 | | خطوط الحمار الوحشي | جميلة وأنيقة | $1 | يجب فصل كل خلية ترويسة بثلاث شرطات على الأقل. يمكنك أيضا استخدام ماركداون داخل خلايا الجداول. | ماركداون | أقل | جمالا | | --- | --- | --- | | *ما زال* | `يُعرض` | **بإتقان** | | 1 | 2 | 3 | ~~~ ::: tip اضغط <kbd>Alt + Shift + T</kbd> لإظهار حوار يساعدك في إنشاء الجداول. يمكنك حتى استيراد ملفات CSV في ذلك الحوار. استخدم <kbd>Ctrl + Space</kbd> داخل جدول ماركداون لتنسيقه آليًا. ::: ## كتل الاقتباس ```markdown > كتل الاقتباس مفيدة جدا في رسائل البريد الإلكتروني لمحاكاة الرد على نص. > هذا السطر جزء من نفس الاقتباس. كسر الاقتباس. > هذا سطر طويل جدا ولكنه سيُنسّق بشكل سليم كاقتباس عندما يلف إلى السطر التالي. ياه يا فتى، لنستمر في الكتابة حتى نضمن أن هذا بالطول الكافي لكي يلف فعلا عند الجميع. آه، يمكنك *وضع* **ماركداون** داخل كتلة اقتباس. 123456789101112131415161718192021222324252627282930313233TIP يمكنك إخبار QOwnNotes أن يظلّل كتل الاقتباس بكاملها أو أن يظلّل حرف الاقتباس فقط، في إعدادات المحرر يمكنك استخدام الاختصار Ctrl + Shift + B لجعل النص المحدد كتلة اقتباس. # مسطرة أفقية توجد ثلاث طرق للحصول على مسطرة أفقية: الشَرطات، والشرطات السفلية، والنجوم. ثلاث أو أكثر... شرطات --- شرطات سفلية ___ نجوم *** 12345678910111213# فصل السطور يمكنك فصل فقرة إلى أكثر من سطر واحد لتسهيل التحرير، ستظل هذه السطور تُعرض في المعاينة كفقرة واحدة بلا فواصل. يمكن فرض سطر جديد داخل فقرة بإنهاء السطر بمسافتين. يمكنك إنشاء فقرة مستقلة بفصلها عما قبلها وبعدها بسطر فارغ. TIP يمكنك إضافة مسافتين وسطر جديد بالاختصار ⇧ Shift + Enter. إليك سطر لنبدأ به. هذا السطر مفصول عن سابقه بسطرين جديدين، لذا فإنه يكون *فقرة منفصلة*. وأيضا هذا السطر يبدأ فقرة منفصلة، لكن... هذا السطر مفصول فقط بمسافتين وسطر جديد واحد، لذا فإنه سطر منفصل في *نفس الفقرة*. 123456TIP يظلّل المحرر بشكل افتراضي المسافات التي في آخر السطر. # التعليقات لا تظهر التعليقات في المعاينة. [comment]: # (لن يظهر هذا التعليق في المعاينة) <!-- تعليقات هتمل مخفية أيضا --> 123TIP سيتم كذلك تجاهل أي تعليق HTML في بداية الملاحظة عند توليد اسم ملف الملاحظة آليًا. # قوائم مربعات الاختيار يمكنك إنشاء قوائم مهام بسيطة باستخدام قوائم مربعات الاختيار. - [x] تم - [ ] افعل 12TIP يمكنك اختيار أو تفريغ مربعات الاختيار في المعاينة. # التمهيد (Frontmatter) في QOwnNotes، يمكنك استخدام تمهيد (مثلا YAML) لإضافة بعض المعلومات الوصفية الإضافية. هذه المعلومات لن تظهر في المعاينة وكذلك لن تعيق التوليد الآلي لاسم ملف الملاحظة. --- title: اسمٌ ما description: شيءٌ من الوصف --- # العنوان الرئيسي للملاحظة يبدأ هنا شيءٌ من النص 12345678اسم ملف الملاحظة في هذا المثال سيكون العنوان الرئيسي للملاحظة يبدأ هنا.md. ساعدنا في تحسين هذه الصفحة! (opens new window) ← تجربة QOwnNotes استيراد الملاحظات → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!'
