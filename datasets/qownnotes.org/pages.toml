["https://qownnotes.org/ar/installation/macos.html"]
title = "التثبيت على ماك أو إس | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# التثبيت على ماك أو إس قم بتنزيل صورة قرص macOS الأخيرة من إصدارات QOwnNotes على GitHub (opens new window)، وافتحها واسحب تطبيق QOwnNotes إلى مجلد تطبيقاتك. في المرة الأولى، ستحتاج إلى النقر بزر الفأرة الأيمن على التطبيق والنقر على فتح (Open) لفتح QOwnNotes. الإصدارة المتاحة حاليًّا على GitHub ليست متاحة إلا لمعمارية x86. WARNING If you get an error message QOwnNotes.app cannot be opened because the developer cannot be verified you need to visit your macOS Security settings and click on Open anyway. To take the application out of the quarantine you can also run the following command in the terminal: xattr -r -d com.apple.quarantine /Applications/QOwnNotes.app 1 TIP The application uses its internal updater to update itself. You can see the latest version on the bottom right of the application. # Homebrew يتعهد المجتمع حزمة مبنية (cask) لـ QOwnNotes في Homebrew (opens new window). يمكنك تثبيته بالأمر: brew install qownnotes 1# Nix كذلك يمكنك تثبيت QOwnNotes عبر مدير الحزم Nix (opens new window) على ماك أو إس على x86 و Apple Silicon؛ انظر التثبيت عبر Nix. ساعدنا في تحسين هذه الصفحة! (opens new window) ← التثبيت على ميكروسوفت ويندوز التثبيت على دبيان → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
