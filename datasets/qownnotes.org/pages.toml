["https://qownnotes.org/installation/fedora.html"]
title = "Install on Fedora Linux | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = '''# Install on Fedora Linux There are QOwnNotes repositories for Fedora 28 and higher. TIP QOwnNotes is provided in the Fedora repositories (opens new window). That version is generally one or two patch versions behind the master repository available through the instructions below. For most users you can just issue dnf install qownnotes in a terminal window. If you want the most up-to-date version, please continue reading. # On systems with config-manager dnf plugin Run the following shell commands as root to add the repository. dnf config-manager --add-repo http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Fedora_\$releasever/ dnf makecache dnf install qownnotes 1234TIP You may need to accept the repo key before you can download from it. If you have any problems, import the key manually with: rpm --import http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Fedora_40/repodata/repomd.xml.key 1Please note that the portion "Fedora_40" in the above code should reflect the version of Fedora you are using (i.e. "Fedora_39", "Fedora_38" etc.) # Legacy install method Use this method if your Fedora version doesn't support the config-manager dnf plugin, run these commands as root. Run the following shell command as root to trust the repository. rpm --import http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Fedora_40/repodata/repomd.xml.key 1Again: note that the portion "Fedora_40" in the above code should reflect the version of Fedora you are using (i.e. "Fedora_39", "Fedora_38" etc.) Then run the following shell commands as root to add the repository and install QOwnNotes from there. cat > /etc/yum.repos.d/QOwnNotes.repo << EOL [qownnotes] name=OBS repo for QOwnNotes (Fedora \$releasever - \$basearch) type=rpm-md baseurl=http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Fedora_\$releasever/ gpgcheck=1 gpgkey=http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Fedora_\$releasever/repodata/repomd.xml.key enabled=1 EOL dnf clean expire-cache dnf install qownnotes 123456789101112Direct Download (opens new window) (this example link is for Fedora 40) # QOwnNotes version-updating notes for Fedora # Problems with GPG keys? Changes in Fedora's cryptographic policies can mean "old" (expired) repository keys are not automatically extended. This can lead to problems updating QOwnNotes. Detail: If you have a problem with invalid keys (i.e. GPG errors) such as certificate is not alive and/or key is not alive due to key expiry, this terminal command should delete the expired key: sudo rpm -e $(rpm -q --qf "%{NAME}-%{VERSION}-%{RELEASE}\t%{SUMMARY}\n" gpg-pubkey | grep pbek | cut -f1) 1Detailed explanation of the command is available on GitHub in a topic (opens new window) related to this exact issue. Once the expired key has been deleted, you must then newly import the current key manually as described in the beginning of these installation instructions. Help us improve this page! (opens new window) ← Install on openSUSE Linux Install as Snap → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!'''
year_published = 2025
