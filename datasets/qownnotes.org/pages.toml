title = "الدوال والكائنات التي يوفرها QOwnNotes | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = '''# الدوال والكائنات التي يوفرها QOwnNotes # بدء برنامج خارجي في الخلفية # نداء الدالة ومُعامِلاتها /** * QML wrapper to start a detached process * * @param executablePath the path of the executable * @param parameters a list of parameter strings * @param callbackIdentifier an identifier to be used in the onDetachedProcessCallback() function (optional) * @param callbackParameter an additional parameter for loops or the like (optional) * @param processData data written to the process if the callback is used (optional) * @param workingDirectory the working directory to execute the process in (optional, only works without callback) * @return true on success, false otherwise */ bool startDetachedProcess(QString executablePath, QStringList parameters, QString callbackIdentifier, QVariant callbackParameter, QByteArray processData, QString workingDirectory); 1234567891011121314# مثال مثال بسيط: script.startDetachedProcess("/path/to/my/program", ["my parameter"]); 1تنفيذ عمليات كثيرة: for (var i = 0; i < 100; i++) { var dur = Math.floor(Math.random() * 10) + 1; script.startDetachedProcess("sleep", [`${dur}s`], "my-callback", i); } function onDetachedProcessCallback(callbackIdentifier, resultSet, cmd, thread) { if (callbackIdentifier == "my-callback") { script.log(`#${thread[1]} i[${thread[0]}] t${cmd[1]}`); } } 12345678910ربما تحب أن تلقي نظرة على الأمثلة custom-actions.qml (opens new window) أو callback.qml (opens new window) أو execute-command-after-note-update.qml (opens new window). وربما تحب أيضا أن تلقي نظرة على خطاف onDetachedProcessCallback (عند رد عملية منفصلة). # بدء برنامج خارجي وانتظار ناتجه # نداء الدالة ومُعامِلاتها /** * QML wrapper to start a synchronous process * * @param executablePath the path of the executable * @param parameters a list of parameter strings * @param data the data that will be written to the process (optional) * @param workingDirectory the working directory to execute the process in (optional) * @return the text that was returned by the process QByteArray startSynchronousProcess(QString executablePath, QStringList parameters, QByteArray data, QString workingDirectory); 123456789# مثال var result = script.startSynchronousProcess("/path/to/my/program", ["my parameter"], "data", "/path/to/execute/in"); 1ربما تحب أن تلقي نظرة على المثال encryption-keybase.qml (opens new window). # الحصول على مسار مجلد الملاحظة الحالية # نداء الدالة ومُعامِلاتها /** * QML wrapper to get the current note folder path * * @return the path of the current note folder */ QString currentNoteFolderPath(); 123456# مثال var path = script.currentNoteFolderPath(); 1ربما تحب أن تلقي نظرة على المثال absolute-media-links.qml (opens new window). # الحصول على الملاحظة الحالية # نداء الدالة ومُعامِلاتها /** * QML wrapper to get the current note * * @returns {NoteApi} the current note object */ NoteApi currentNote(); 123456# مثال var note = script.currentNote(); 1ربما تحب أن تلقي نظرة على المثال custom-actions.qml (opens new window). # الكتابة في نافذة السجل # نداء الدالة ومُعامِلاتها /** * QML wrapper to log to the log widget * * @param text */ void log(QString text); 123456# مثال script.log("رسالتي النصية"); 1# تنزيل رابط إلى سلسلة نصية # نداء الدالة ومُعامِلاتها /** * QML wrapper to download an url and returning it as text * * @param url * @return {QString} the content of the downloaded url */ QString downloadUrlToString(QUrl url); 1234567# مثال var html = script.downloadUrlToString("https://www.qownnotes.org"); 1ربما تحب أن تلقي نظرة على المثال insert-headline-with-link-from-github-url.qml (opens new window). # تنزيل رابط إلى مجلد الوسائط # نداء الدالة ومُعامِلاتها /** * QML wrapper to download an url to the media folder and returning the media * url or the markdown image text of the media relative to the current note * * @param {QString} url * @param {bool} returnUrlOnly if true only the media url will be returned (default false) * @return {QString} the media markdown or url */ QString downloadUrlToMedia(QUrl url, bool returnUrlOnly); 123456789# مثال var markdown = script.downloadUrlToMedia("http://latex.codecogs.com/gif.latex?\frac{1}{1+sin(x)}"); 1ربما تحب أن تلقي نظرة على المثال paste-latex-image.qml (opens new window). # إضافة ملف وسائط إلى مجلد الوسائط # نداء الدالة ومُعامِلاتها /** * QML wrapper to insert a media file into the media folder and returning * the media url or the markdown image text of the media relative to the current note * * @param {QString} mediaFilePath * @param {bool} returnUrlOnly if true only the media url will be returned (default false) * @return {QString} the media markdown or url */ QString ScriptingService::insertMediaFile(QString mediaFilePath, bool returnUrlOnly); 12345678910# مثال var markdown = script.insertMediaFile("/path/to/your/image.png"); 1ربما تحب أن تلقي نظرة على المثال scribble.qml (opens new window). # إضافة ملف مرفق إلى مجلد المرفقات # نداء الدالة ومُعامِلاتها * QML wrapper to insert an attachment file into the `attachments` folder and * returning the attachment url or the markdown text of the attachment * relative to the current note * * @param {QString} attachmentFilePath * @param {QString} fileName to use in the markdown * @param {bool} returnUrlOnly if true only the attachment url will be returned * (default false) * @return {QString} the attachment markdown or url */ QString ScriptingService::insertAttachmentFile(const QString &attachmentFilePath, const QString &fileName, bool returnUrlOnly); 12345678910111213# مثال var markdown = script.insertAttachmentFile("/path/to/your/file.png"); 1# إعادة توليد معاينة الملاحظة تنعش معاينة الملاحظة. # نداء الدالة ومُعامِلاتها /** * يعيد توليد معاينة الملاحظة */ QString ScriptingService::regenerateNotePreview(); 1234# مثال script.regenerateNotePreview(); 1ربما تحب أن تلقي نظرة على المثال scribble.qml (opens new window). # تسجيل إجراء مخصص # نداء الدالة ومُعامِلاتها /** * Registers a custom action * * @param identifier the identifier of the action * @param menuText the text shown in the menu * @param buttonText the text shown in the button * (no button will be viewed if empty) * @param icon the icon file path or the name of a freedesktop theme icon * you will find a list of icons here: * https://specifications.freedesktop.org/icon-naming-spec/icon-naming-spec-latest.html * @param useInNoteEditContextMenu if true use the action in the note edit * context menu (default: false) * @param hideButtonInToolbar if true the button will not be shown in the * custom action toolbar (default: false) * @param useInNoteListContextMenu if true use the action in the note list * context menu (default: false) */ void ScriptingService::registerCustomAction(QString identifier, QString menuText, QString buttonText, QString icon, bool useInNoteEditContextMenu, bool hideButtonInToolbar, bool useInNoteListContextMenu); 123456789101112131415161718192021222324TIP يمكنك أيضا تعيين اختصارات محلية أو عامة لإجراءاتك المخصصة في إعدادات الاختصارات. WARNING تذكر أن سمة أيقونات فري دسكتوب (opens new window) متاحة غالبا فقط على لينكس. لذلك إذا أردت استخدام أيقونة في ماك أو ويندوز، عليك تزويد بُريمجك بواحدة. للحصول على مسار بُريمجك لضبط المسار المناسب لأيقونتك، يمكنك استخدام خاصية scriptDirPath. # مثال import QtQml 2.0 import QOwnNotesTypes 1.0 Script { /** * Initializes the custom actions */ function init() { // add a custom action without a button script.registerCustomAction("mycustomaction1", "Menu text"); // add a custom action with a button script.registerCustomAction("mycustomaction2", "Menu text", "Button text"); // add a custom action with a button and freedesktop theme icon script.registerCustomAction("mycustomaction3", "Menu text", "Button text", "task-new"); // add a custom action with a button and an icon from a file script.registerCustomAction("mycustomaction4", "Menu text", "Button text", "/usr/share/icons/breeze/actions/24/view-calendar-tasks.svg"); } /** * This function is invoked when a custom action is triggered * in the menu or via button * * @param identifier string the identifier defined in registerCustomAction */ function customActionInvoked(identifier) { switch (identifier) { case "mycustomaction1": script.log("Action 1"); break; case "mycustomaction2": script.log("Action 2"); break; case "mycustomaction3": script.log("Action 3"); break; case "mycustomaction4": script.log("Action 4"); break; } } } 1234567891011121314151617181920212223242526272829303132333435363738394041424344للمزيد من بعض الأمثلة يمكنك أن تلقي نظرة على custom-actions.qml (opens new window). TIP يمكنك تنفيذ إجراء مخصص بعد تشغيل التطبيق، باستخدام المُعامِل --action customAction_<المعرِّف>. للمزيد من المعلومات يمكنك أن تلقي نظرة على تنفيذ إجراءات قائمة بعد التشغيل. # Registering a label # نداء الدالة ومُعامِلاتها /** * Registers a label to write to * * @param identifier the identifier of the label * @param text the text shown in the label (optional) */ void ScriptingService::registerLabel(QString identifier, QString text); 1234567# مثال script.registerLabel("html-label", "<strong>Strong</strong> HTML text<br />with three lines<br />and a <a href='https://www.qownnotes.org'>link to a website</a>."); script.registerLabel("long-label", "another very long text, another very long text, another very long text, another very long text, another very long text, another very long text, another very long text, another very long text, another very long text, another very long text, another very long text that will wrap"); script.registerLabel("counter-label"); 12345The labels will be visible in the Scripting panel, which you need to enable in the Window / Panels menu. You can use both plain text or html in the labels. The text will be selectable and links can be clicked. ربما تحب أن تلقي نظرة على مثال البُريمج scripting-label-demo.qml (opens new window). # Setting the text of a registered label # نداء الدالة ومُعامِلاتها /** * Sets the text of a registered label * * @param identifier the identifier of the label * @param text the text shown in the label */ void ScriptingService::setLabelText(QString identifier, QString text); 1234567# مثال script.setLabelText("counter-label", "counter text"); 1You can use both plain text or html in the labels. The text will be selectable and links can be clicked. ربما تحب أن تلقي نظرة على مثال البُريمج scripting-label-demo.qml (opens new window). TIP The scripting label also supports external links, as well as internal links to notes, tasks, deck cards and more. You might get a grasp of what's supported by taking a look at URL handling (opens new window). # إنشاء ملاحظة جديدة # نداء الدالة ومُعامِلاتها /** * Creates a new note * * @param text the note text */ void ScriptingService::createNote(QString text); 123456# مثال script.createNote("My note headline\n===\n\nMy text"); 1ربما تحب أن تلقي نظرة على المثال custom-actions.qml (opens new window). TIP If you turned off that your note headline determines the note filename then you have to rename your note file yourself afterward, like this: var note = script.currentNote(); note.renameNoteFile('your-filename'); 12 # الوصول إلى الحافظة # نداء الدالة ومُعامِلاتها /** * يرجع محتوى الحافظة كنص أو هتمل * * @param asHtml قيمة منطقية لإرجاع محتوى الحافظة كهتمل وليس كنص */ QString ScriptingService::clipboard(bool asHtml); 123456# مثال var clipboardText = script.clipboard(); var clipboardHtml = script.clipboard(true); 12ربما تحب أن تلقي نظرة على المثال custom-actions.qml (opens new window). # كتابة نص إلى محرر نص الملاحظات # نداء الدالة ومُعامِلاتها /** * تكتب النص المعطى عند موضع المؤشر الحالي في محرر نص الملاحظات * * @param text النص الذي سيُكتب */ void ScriptingService::noteTextEditWrite(QString text); 123456# مثال // اكتب نصا في محرر نص الملاحظات script.noteTextEditWrite("نصي المخصص"); 12ربما تحب أن تلقي نظرة على الإجراء المخصص transformTextRot13 في المثال custom-actions.qml (opens new window). ويمكنك استخدام هذه الدالة مع noteTextEditSelectAll لاستبدال كل نص الملاحظة الحالية. # قراءة النص المحدد في محرر نص الملاحظات # نداء الدالة ومُعامِلاتها /** * ترجع النص المحدد حاليا في محرر نص الملاحظات * * @return */ QString ScriptingService::noteTextEditSelectedText(); 123456# مثال // اقرأ النص المحدد حاليا في محرر نص الملاحظات var text = script.noteTextEditSelectedText(); 12ربما تحب أن تلقي نظرة على الإجراء المخصص transformTextRot13 في المثال custom-actions.qml (opens new window). # تحديد كل النص الذي في محرر نص الملاحظات # نداء الدالة ومُعامِلاتها /** * تحدد كل النص الذي في محرر نص الملاحظات */ void ScriptingService::noteTextEditSelectAll(); 1234# مثال script.noteTextEditSelectAll(); 1يمكنك استخدمها مع noteTextEditWrite لتغيير كامل نص الملاحظة الحالية. # تحديد نص السطر الحالي في محرر نص الملاحظات # نداء الدالة ومُعامِلاتها /** * تحدد السطر الحالي في محرر نص الملاحظات */ void ScriptingService::noteTextEditSelectCurrentLine(); 1234# مثال script.noteTextEditSelectCurrentLine(); 1# تحديد الكلمة الحالية في محرر نص الملاحظات # نداء الدالة ومُعامِلاتها /** * تحدد الكلمة الحالية في محرر نص الملاحظات */ void ScriptingService::noteTextEditSelectCurrentWord(); 1234# مثال script.noteTextEditSelectCurrentWord(); 1# تعيين التحديد الحالي في محرر نص الملاحظات # نداء الدالة ومُعامِلاتها /** * Sets the currently selected text in the note text edit * * @param start * @param end */ void ScriptingService::noteTextEditSetSelection(int start, int end); 1234567# مثال // زيادة النص المحدد حاليا بمحرف واحد في الاتجاهين script.noteTextEditSetSelection( script.noteTextEditSelectionStart() - 1, script.noteTextEditSelectionEnd() + 1); 1234# الحصول على موضع بداية التحديد الحالي في محرر نص الملاحظات # نداء الدالة ومُعامِلاتها /** * ترجع موضع بداية النص المحدد حاليا في محرر نص الملاحظات */ int ScriptingService::noteTextEditSelectionStart(); 1234# مثال script.log(script.noteTextEditSelectionStart()); 1# الحصول على موضع نهاية التحديد الحالي في محرر نص الملاحظات # نداء الدالة ومُعامِلاتها /** * ترجع موضع نهاية النص المحدد حاليا في محرر نص الملاحظات */ int ScriptingService::noteTextEditSelectionEnd(); 1234# مثال script.log(script.noteTextEditSelectionEnd()); 1# تعيين موضع مؤشر النص في محرر نص الملاحظات # نداء الدالة ومُعامِلاتها /** * Sets the text cursor in the note text edit to a certain position * 0 would be the beginning of the note * special case: -1 would be the end of the note * * @param position */ void ScriptingService::noteTextEditSetCursorPosition(int position); 12345678# مثال // انتقل إلى المحرف الحادي عشر في الملاحظة (الترقيم يبدأ من الصفر) script.noteTextEditSetCursorPosition(10); // انتقل إلى نهاية الملاحظة script.noteTextEditSetCursorPosition(-1); 12345# الحصول على الموضع الحالي لمؤشر النص في محرر نص الملاحظات # نداء الدالة ومُعامِلاتها /** * ترجع الموضع الحالي لمؤشر النص في محرر نص الملاحظات * والصفر يدل على بداية الملاحظة */ int ScriptingService::noteTextEditCursorPosition(); 12345# مثال script.log(script.noteTextEditCursorPosition()); 1# قراءة الكلمة الحالية في محرر نص الملاحظات # نداء الدالة ومُعامِلاتها /** * Reads the current word in the note text edit * * @param withPreviousCharacters also get more characters at the beginning * to get character'''
