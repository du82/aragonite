full_description = "# Tasti di scelta rapida # Linux / Windows # Nella finestra principale Ctrl + N crea una nuova nota con la data e l'ora correnti nel nome Ctrl + ⇧ Shift + N crea una nuova nota in una nuova scheda Ctrl + ⇧ Shift + F ti permette di cercare note (nel nome della nota e nel suo contenuto) Alt + F ti consente di cercare note in tutte le etichette / sottocartelle Alt + ⇧ Shift + P passa all'area di lavoro precedente Ctrl + ⇧ Shift + E modifica una nota crittografata Alt + R rimuove la nota corrente Alt + ⇧ Shift + U controlla gli aggiornamenti Ctrl + ⇧ Shift + T apre l'elenco delle cose da fare Ctrl + ⇧ Shift + O apre la nota corrente in un editor esterno Alt + ⇧ Shift + O apre la nota corrente in una vista Alt + ⇧ Shift + F mostra la nota corrente nel gestore file Alt + ⇧ Shift + E abilita o disabilita la modifica delle note Alt + Up jumps to the previous visible note Alt + ↓ passa alla successiva nota visibile Alt + Pag↑ salta alla scheda note precedente Alt + Pag↓ passa alla scheda note successiva Ctrl + W chiude la scheda note corrente Ctrl + ⇧ Shift + D alterna la modalità senza distrazioni puoi anche chiuderla con Esc Ctrl + P stampa la nota corrente come testo Ctrl + ⇧ Shift + P stampa la nota corrente come markdown Ctrl + ⇧ Shift + V incolla note, immagini e html dagli appunti Ctrl + , apre le impostazioni Alt + ⇧ Shift + A aggiunge una nuova etichetta a una nota Ctrl + ⇧ Shift + R ricarica la cartella delle note corrente Ctrl + Alt + F consente di selezionare una cartella di note diversa Ctrl + ⇧ Shift + S ricarica il motore di scripting Ctrl + ⇧ Shift + M nasconde o mostra la barra del menu principale Ctrl + ⇧ Shift + A consente di cercare azioni Ctrl + S salva manualmente le note modificate Alt + ⇧ Shift + I apre la finestra di dialogo dell'archivio degli script F4 passa al pannello di modifica delle note F5 salta all'elenco delle note F6 vai al pannello delle sottocartelle delle note F7 vai al pannello delle etichette F8 salta al pannello di navigazione F10 attiva il menù contestuale del widget corrente F11 alterna la modalità a schermo intero Alt + ⇧ Shift + H copia il titolo della nota corrente # Nella barra di ricerca delle note ↓ or Tab imposta lo stato attivo sull'elenco delle note Invio crea una nuova nota con il testo della barra di ricerca come titolo # Nell'elenco delle note doppio clic su una nota per aprirla in un nuovo tab (ricorda che ci può essere un collegamento cogli script che sovrascrive l'azione di doppio clic Ctrl + A seleziona tutte le note (per spostarle, copiarle o rimuoverle con un clic destro) Tab o Invio consente di modificare la nota corrente # Nel pannello di modifica del testo della nota Ctrl + clic su un collegamento per aprirlo Ctrl + F ti permette di cercare nella nota corrente usa i tasti ↑ e ↓ o F3 e ⇧ Shift + F3 per passare alla corrispondenza precedente e successiva Esc chiude la barra di ricerca Ctrl + R consente di cercare e sostituire nella nota corrente Ctrl + D duplica la riga corrente o il testo selezionato Ctrl + Alt + Down fa lo stesso Alt + Backspace cancella la riga corrente Ctrl + Backspace cancella la parola corrente Ctrl + L apre una finestra di dialogo per aggiungere un collegamento di testo (funziona anche sul testo selezionato) Ctrl + ⇧ Shift + L apre una finestra di dialogo per aggiungere un collegamento a una nota Ctrl + T inserisce la data corrente nel formato ISO 8601 Ctrl + ⇧ Shift + I inserisce un'immagine (l'immagine verrà copiata nella cartella media nella cartella note corrente) Ctrl + ⇧ Shift + X inserisce un allegato (il file sarà copiato nella cartella attachments della cartella note corrente) Alt + ⇧ Shift + T inserisce una tabella Ctrl + ⇧ Shift + C inserisce un blocco di codice nella posizione corrente Ctrl + ⇧ Shift + B inserisce una citazione in blocco nella posizione corrente Ctrl + B formatta il testo selezionato in grassetto Ctrl + I formatta il testo selezionato in corsivo Ctrl + U formatta il testo selezionato in sottolineato (sottolinea il testo selezionato) Alt + ⇧ Shift + S cancella il testo selezionato Ctrl + ⇧ Shift + U scorre le occorrenze di testo selezionato Tab fa rientrare il testo selezionato (funziona anche su più righe) ⇧ Shift + Tab annulla il rientro del testo selezionato Tab dopo un carattere di elenco non ordinato fa rientrare l'elemento dell'elenco ⇧ Shift + Tab dopo un carattere di elenco non ordinato annulla il rientro della voce dell'elenco Invio negli elenchi crea un nuovo elemento dell'elenco Alt + Sinistra torna indietro nella cronologia delle note Alt + Right salta in avanti nella cronologia delle note Ctrl + ⇧ Shift + 1..9 imposta un segnalibro nota nell'indice segnalibro 1..9 Ctrl + 0..9 salta al segnalibro della nota nell'indice del segnalibro 0..9 Ctrl + + aumenta la dimensione del carattere del testo della nota di un punto Ctrl + - riduce la dimensione del carattere del testo della nota di un punto Ctrl + 0 ripristina la dimensione del carattere del testo della nota Ctrl + Spazio cerca di risolvere semplici equazioni come (4+5)*3= davanti al cursore, completa automaticamente il testo o apre gli URL Ctrl + ⇧ Shift + H inserisce un titolo dal nome del file della nota all'inizio della nota Alt + ⇧ Shift + X divide la nota corrente in due note nella posizione corrente del cursore Alt + ⇧ Shift + W cerca il testo selezionato sul web Ctrl + Up scorre il contenuto verso l'alto Ctrl + Giù scorre il contenuto verso il basso Ctrl + ⇧ Shift + ↓ sposta la riga corrente verso il basso Ctrl + ⇧ Shift + ↑ sposta la riga corrente verso l'alto ⇧ Shift + Invio aggiunge due spazi e un carattere di nuova riga per forzare una nuova riga di markdown # Nel pannello di anteprima della nota Ctrl + F ti permette di cercare nella nota corrente usa i tasti ↑ e ↓ o F3 e ⇧ Shift + F3 per passare alla corrispondenza precedente e successiva Esc chiude la barra di ricerca # Nell'elenco delle Todo Ctrl + S salva l'elemento attività corrente Ctrl + I salva l'elemento attività corrente e lo inserisce nella nota corrente Ctrl + R rimuove l'elemento da fare corrente # macOS # Nella finestra principale ⌘ Cmd + N crea una nuova nota con la data e l'ora correnti nel nome ⌘ Cmd + ⇧ Shift + N crea una nuova nota in una nuova scheda ⌘ Cmd + ⇧ Shift + F ti permette di cercare note (nel nome della nota e nel suo contenuto) ^ Ctrl + F ti consente di cercare note in tutte le etichette / sottocartelle ^ Ctrl + ⇧ Shift + P passa all'area di lavoro precedente ⌘ Cmd + ⇧ Shift + E modifica una nota crittografata ^ Ctrl + R rimuove la nota corrente ^ Ctrl + ⇧ Shift + U controlla gli aggiornamenti ⌘ Cmd + ⇧ Shift + T apre l'elenco delle cose da fare ⌘ Cmd + ⇧ Shift + O apre la nota corrente in un editor esterno ^ Ctrl + ⇧ Shift + O apre la nota corrente in una vista ⌃ Ctrl + ⇧ Shift + F apre la cartella della nota corrente nel Finder ⌃ Ctrl + ⇧ Shift + E abilita o disabilita la modifica delle note ⌃ Ctrl + Up salta alla nota visibile precedente ⌃ Ctrl + Down passa alla nota vista successivamente ⌥ Alt + Pag↑ salta alla scheda note precedente ⌥ Alt + Pag↓ passa alla scheda note successiva ⌘ Cmd + W chiude la scheda della nota corrente ⌘ Cmd + ⇧ Shift + D attiva o disattiva la modalità senza distrazioni puoi anche chiudere con Esc ⌘ Cmd + P stampa la nota corrente come testo ⌘ Cmd + ⇧ Shift + P stampa la nota corrente come markdown ⌘ Cmd + ⌃ Ctrl + V incolla note, immagini e html dagli appunti ⌘ Cmd + , apre le impostazioni ⌃ Ctrl + ⇧ Shift + A aggiunge un nuovo tag a una nota ⌘ Cmd + ⇧ Shift + R ricarica la cartella della nota corrente ⌘ Cmd + ⌃ Ctrl + F consente di selezionare una cartella di note diversa ⌘ Cmd + ⇧ Shift + S ricarica il motore di scripting ⌘ Cmd + ⇧ Shift + M nasconde o mostra la barra del menu principale ⌘ Cmd + ⇧ Shift + A ti consente di cercare azioni ⌘ Cmd + S salva manualmente le note modificate ⌃ Ctrl + ⇧ Shift + I apre la finestra di dialogo Repository di script F4 passa al pannello di modifica delle note F5 passa all'elenco delle note F6 passa al pan