title = "Paramètres de l'interface de ligne de commande | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# Paramètres de l'interface de ligne de commande Les paramètres suivants peuvent être utilisés dans l'interface en ligne de commande (CLI) pour contrôler le comportement de l'application : Paramètre La description --help Affiche l'écran d'aide --version Affiche le numéro de version de l'application --portable Exécute l'application en mode portable --clear-settings Efface les paramétrages et exécute l'application --dump-settings Affiche l'ensemble des paramètres ainsi que d'autres informations à propos de l'application et de l'environnement en MarkDown Github puis ferme l'application --session <name> Exécute l'application dans un contexte de paramètres et de fichiers internes différent --allow-multiple-instances Autorise l'exécution simultanée de plusieurs instances de QOwnNotes, même si cela est interdit dans les paramètres --action <name> Déclenche une action de menu après le démarrage de l'application (voir ci-dessous) --completion <shell> Generate shell completion code. Supports fish, bash. TIP Si vous rencontrez des problèmes avec votre installation de QOwnNotes, vous pouvez démarrer l'application avec de nouveaux paramètres sans perdre vos paramètres actuels en utilisant le paramètre --session. QOwnNotes --session test 1 Le lancement de l'application via la ligne de commande se fait différemment selon le système d'exploitation : Système d'exploitation Commande Linux QOwnNotes (ou qownnotes si installé en tant que paquet snap) macOS /Applications/QOwnNotes.app/Contents/MacOS/QOwnNotes Windows QOwnNotes.exe TIP To directly copy the settings dump to the clipboard to post in a GitHub issue (opens new window) you can use xclip or xsel on Linux, pbcopy on macOS and clip on Windows: # Copy the settings dump to the clipboard with xclip on Linux QOwnNotes --dump-settings | xclip -selection clipboard # Copy the settings dump to the clipboard with xsel on Linux QOwnNotes --dump-settings | xsel --clipboard # Copy the settings dump to the clipboard with pbcopy on macOS QOwnNotes --dump-settings | pbcopy # Copy the settings dump to the clipboard with clip on Windows QOwnNotes --dump-settings | clip 1234567891011 # Déclencher des actions de menu après le démarrage Avec le paramètre --action <name> vous pouvez déclencher des actions de menu après que l'application ait été démarrée. Par exemple, pour ouvrir la boîte de dialogue de la liste de tâches après le démarrage, utilisez : QOwnNotes --action actionShow_Todo_List 1TIP Vous pouvez obtenir les noms d'objet de l'action de menu avec mainwindow.ui (opens new window). Recherchez simplement le titre du menu en anglais. Notez que ces textes peuvent changer avec le temps. Pour déclencher des actions de scripting utilisez customAction_ suivi de l'identifiant de l'action personnalisée. L'identifiant de l'action personnalisée est le premier paramètre de l'appel script.registerCustomAction dans le script. Par exemple, pour exécuter l'action personnalisée myAction, lancez QOwnNotes comme ceci : QOwnNotes --action customAction_myAction 1TIP Si vous exécutez QOwnNotes une deuxième fois avec le paramètre d'action et que vous n'avez autorisé qu'une seule instance d'application, l'action de menu sera déclenchée dans la première instance. Aidez-nous à améliorer ce site! (opens new window) ← Importer des notes Extension de navigateur QOwnNotes Web Companion → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
