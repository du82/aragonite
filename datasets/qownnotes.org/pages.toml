["https://qownnotes.org/fa/getting-started/markdown.html"]
title = "مارک داون | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = '''# مارک داون برگه تقلب مارک داون به صورت یک مرجع سریع و ویترینی از چیدمان مارک داون در QOwnNotes در نظر گرفته شده است. # Headings برای سر و شکل دادن به متن خود از سرفصل ها استفاده کنید. # H1 ## H2 ### H3 #### H4 ##### H5 ###### H6 123456TIP پنل جهت یابی ساختار سرفصل های شما را نشان می دهد. از سوی دیگر، برای H1 و H2، یک سبک زیرخط دار: Alt-H1 ====== Alt-H2 ------ 12345TIP به صورت پیش فرض QOwnNotes ** نام پرونده یادداشت** را از سرفصل 1 ایجاد می کند (h1). # تکیه تکیه (که با نام ایتالیک نیز شناخته می شود) با علامت *ستاره*. تکیه مؤکد (که به صورت پررنگ نیز شناخته می شود) با علامت **ستاره**. 123TIP می‌توانید از میانبر Ctrl + B برای پررنگ کردن متن و از Ctrl + I برای ایتالیک کردن آن استفاده کنید. # خط زیرین علاوه بر این، یک گزینه اختیاری در تنظیمات برای فعال کردن خط زیرین وجود دارد که در * تنظیمات پیش نمایش* قابل اجرا می باشد. _خط زیرین_ 1TIP می توانید از میانبر Ctrl + U برای زیر خط دار کردن یک متن استفاده کنید. # ابطال ~~ابطال~~ 1TIP می توانید از میانبر Alt + Shift + S برای ابطال یک متن استفاده کنید. # لیست ها روش های زیادی برای ایجاد لیست وجود دارد. 1. نخستین مورد لیست مرتب شده 2. مورد بعدی *زیر فهرست مرتب نشده. 1. اعداد حقیقی اهمیتی ندارند بلکه فقط عدد هستند 1. زیرفهرست مرتب شده (تنها در ویرایشگر کار می کند نه در پیش نمایش) 4. و موردی دیگر. * برای لیست مرتب نشده می توان از ستاره - یا منها + یا بعلاوه استفاده کرد 12345678910TIP با فشار دادن دکمه ورود در انتهای هر لیست، یک مورد لیست جدید ایجاد می شود. # پیوندها Two of the simpler uses for links are pointing to webpages or other notes. There are multiple ways each of these links can look. # External links [I'm an inline-style link](https://www.google.com) [I'm an inline-style link with title](https://www.google.com "Google's Homepage") [You can use numbers for reference-style link definitions][1] Plain URLs and URLs in angle brackets will automatically get turned into links in the preview. http://www.example.com or <http://www.example.com> [1]: https://www.qownnotes.org 12345678910# Internal links [I link to the Journal.md note](Journal.md) <Journal.md> works similarly. 123TIP می توانید از میانبر Ctrl + L برای ایجاد پیوند به صفحات وب یا سایر یادداشت ها استفاده کنید. استفاده از Ctrl + Shift + X یک کادر گفتگو را ظاهر می کند که به شما کمک می کند تا ** پیوست ها** را در یادداشت خود درج کنید. می توانید با فشار دادن Ctrl + Space و در حالی که مکان نما را بر روی پیوند در ویرایش یادداشت نگه داشته اید، پیوند را دنبال کنید. # Bookmarks نشانک های بکار رفته توسط افزونه مرورگر همراه وب QOwnNotes از پیوندهای موجود در لیست ها استفاده می کنند. - [Webpage name](https://www.example.com) #tag1 #tag2 some description and tags 1# تصاویر امکان تعبیه تصاویر در QOwnNotes وجود دارد. آنها در پیش نمایش نشان داده می شوند. ![alt text](media/my-image.jpg) 1TIP می توانید از میانبر Ctrl + Shift + I برای درج تصویر در یادداشت استفاده کنید. همچنین تصاویر می‌توانند در کلیپ بورد قرار بگیرند؛ به طوری که کادر گفتگو آن را شناسایی کرده و یک پیش نمایش نشان می دهد. علاوه بر این، می‌توانید با Ctrl + Shift + V یک تصویر را مستقیماً از کلیپ بورد به یادداشت خود بچسبانید. # کد توکار و کد بلاک ها Inline `code` has `backticks around` it. 1TIP می توانید برای ایجاد یک کد بلاک توکار از میانبر Ctrl + Shift + C در متن توکار منتخب یا درست در داخل متن استفاده کنید. Blocks of code are either fenced by lines with three backticks, or are indented with four spaces. # 4-Spaces fence چهار فاصله در جلوی کدتان برای نشان دار کردن آن به عنوان کد بلاک اضافه کنید. s = "Code with space indent" print s 12# Backtick fence علاوه بر این می توانید از سه بک تیک برای ایجاد یک کد پلاک استفاده کنید. ``` Code goes here Code goes here ``` 1234TIP You can use the shortcut Ctrl + Shift + C on multiple selected lines of text or in an empty line to create a code block. # Backtick fence with code highlighting There also is some syntax highlighting with code blocks in QOwnNotes. ```bash # I am a comment cd Notes ``` 1234Currently, supported languages (and code block identifiers) are: BASh scripting, bash C, c C++, cpp C++, cxx C++, c++ C#, c# CMake, cmake C#, csharp CSS, css Go, go HTML, html INI, ini Java, java JavaScript, javascript JavaScript, js JSON, json Makefile, make PHP, php Python, py Python, python QML, qml Rust, rust Shell scripting, sh SQL, sql TypeScript, ts TypeScript, typescript V, v Vex, vex XML, xml YAML, yml YAML, yaml # Tables Tables aren't part of the core Markdown spec, but the QOwnNotes preview supports them. Colons can be used to align columns. | Tables | Are | Cool | | ------------- |:-------------:| -----:| | col 3 is | right-aligned | $1600 | | col 2 is | centered | $12 | | zebra stripes | are neat | $1 | There must be at least 3 dashes separating each header cell. You can also use inline Markdown. | Markdown | Less | Pretty | | --- | --- | --- | | *Still* | `renders` | **nicely** | | 1 | 2 | 3 | 12345678910111213141516TIP Alt + Shift + T را فشار دهید تا یک کادر گفتگو فعال شود که می تواند به شما در ایجاد جداول کمک کند. حتی می توانید پرونده های CSV را در آن کادر گفتگو وارد کنید. به منظور قالب بندی خودکار یک جدول مارک داون از Ctrl + Space در داخل آن استفاده کنید. # نقل قول های بلند > Blockquotes are very handy in email to emulate reply text. > This line is part of the same quote. Quote break. > This is a very long line that will still be quoted properly when it wraps. Oh boy let's keep writing to make sure this is long enough to actually wrap for everyone. Oh, you can *put* **Markdown** into a blockquote. 123456TIP می توانید به QOwnNotes بگویید که نقل قول های بلند یا فقط نویسه نقل قول را به طور کامل در * تنظیمات ویرایشگر* برجسته کند می توانید از میانبر Ctrl + Shift + B برای علامت گذاری متن به صورت نقل قول بلند استفاده کنید. # خط افقی جدا کننده سه راه برای رسم یک خط افقی جدا کننده وجود دارد: خط ربط، ستاره یا زیرین خط. Three or more... Hyphens --- Asterisks *** Underscores ___ 12345678910111213# شکست خط برای ویرایش راحت‌تر می‌توانید پاراگراف را به بیش از یک خط منفرد تقسیم کنید؛ البته همچنان به عنوان یک پاراگراف منفرد و بدون تقسیمات ارائه می شود. از طریق خاتمه یک خط با دو فاصله می توانید درون پاراگراف خط شکنی انجام دهید. شما می‌توانید پاراگراف جداگانه‌ای را از طریق خطوط خالی با تحدید حدود ایجاد کنید. TIP می توانید با استفاده از ⇧ Shift + بازگشت دو فاصله و یک خط نو وارد کنید. Here's a line for us to start with. This line is separated from the one above by two newlines, so it will be a *separate paragraph*. This line is also begins a separate paragraph, but... This line is only separated by two trailing spaces and a single newline, so it's a separate line in the *same paragraph*. 123456TIP فاصله های مؤخر به صورت پیش فرض در ویرایشگر برجسته هستند. # توضیحات توضیحات در پیش نمایش نشان داده نمی شود. [comment]: # (This comment will not appear in the preview) <!-- HTML comments are also hidden --> 123TIP هنگام ایجاد خودکار نام پرونده یادداشت، بلوک توضیح html اصلی در یادداشت هم نادیده گرفته می شود. # لیست های صندوق بررسی شما می توانید لیست های ساده انجام دادنی را با لیست های صندوق بررسی ایجاد کنید. - [x] done - [ ] todo 12TIP شما قادر خواهید بود صندوق های بررسی را در پیش نمایش علامت بزنید یا علامت آنها را بردارید. # پیش‌ گفتار در QOwnNotes می توانید از یک پیش گفتار (مانند YAML) برای افزودن مقداری ابرداده اضافی استفاده کنید. در پیش نمایش نشان داده نمی شود و برای تشکیل خودکار نام پرونده یادداشت اختلال ایجاد نمی کند. --- title: Some name description: Some description --- # Note headline starts here Some text 12345678نام پرونده این یادداشت نمونه Note headline starts here.mdخواهد بود. در اصلاح این صفحه ما را یاری کنید! (opens new window) ← حالت نمایشی QOwnNotes وارد کردن یادداشت ها → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!'''
