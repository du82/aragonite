["https://qownnotes.org/it/getting-started/concept.html"]
title = "Idea | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# Idea # QOwnNotes QOwnNotes memorizza le note nella cartella note come file markdown Può collegarsi al tuo server Nextcloud / ownCloud per condividere pubblicamente le note con altre persone Puoi anche accedere alla cronologia delle note e al cestino sul tuo server Nextcloud / ownCloud tramite l 'app QOwnNotesApi Nextcloud Da QOwnNotes puoi accedere agli elenchi di cose da fare sul tuo server Nextcloud / ownCloud QOwnNotes non sincronizza le tue note e i file multimediali / allegati! La sincronizzazione dei file è un'attività complessa, esistono già ottime soluzioni per la sincronizzazione dei file (vedi Client di sincronizzazione desktop Nextcloud) # File di note Markdown Tutte le tue note e file multimediali / allegati sono tue! Le tue note vengono archiviate come file di testo Markdown sul tuo computer Puoi usare qualsiasi tuo editor di testo preferito insieme a QOwnNotes per visualizzare o modificare i file delle note Sincronizza le tue note con altri dispositivi (desktop e mobili) con il tuo client di sincronizzazione Nextcloud (opens new window) o ownCloud (opens new window) sul tuo server # Estensione del browser QOwnNotes Puoi gestire i segnalibri del tuo browser con QOwnNotes o usarlo come web clipper. TIP L'estensione del browser funziona offline, senza alcuna connessione internet. ::: tip Per ulteriori informazioni, visita l'estensione del browser QOwnNotes Web Companion. # Gestore dei frammenti di comandi QOwnNotes Puoi gestire i tuoi frammenti di comandi con QOwnNotes ed eseguirli sulla linea di comando. TIP Per favore, visita Gestore dei frammenti di comandi QOwnNotes per ulteriori informazioni. # Client di sincronizzazione desktop Nextcloud Sincronizza le tue note con altri dispositivi (desktop e mobili) con il tuo client di sincronizzazione Nextcloud (opens new window) o ownCloud (opens new window) sul tuo server. TIP Ovviamente, puoi usare anche altre soluzioni, come Dropbox, Syncthing, Seafile o BitTorrent Sync per sincronizzare le tue note e altri file. Puoi anche usare git per eseguire la sincronizzazione con strumenti come gitomatic (opens new window). # Server Nextcloud Per lavorare con le tue note online puoi usare server come Nextcloud (opens new window) o ownCloud (opens new window). Puoi ospitare il tuo server o utilizzare soluzioni ospitate. Esiste un elenco di provider Nextcloud gestito dalla community (opens new window), nonché un elenco di dispositivi con Nextcloud (opens new window). Portknox (opens new window) ha segnalato di avere QOwnNotesAPI installato (opens new window). TIP Ovviamente puoi usare altre soluzioni, come Dropbox, Syncthing, Seafile o BitTorrent Sync anche per ospitare le tue note e altri file. # App QOwnNotesAPI Nextcloud QOwnNotesAPI (opens new window) ti consente di accedere alle note spostate nel cestino e alle versioni delle note lato server. TIP Per ulteriori informazioni, visita l'app QOwnNotesAPI Nextcloud. # Applicazione server Nextcloud Notes Usa Nextcloud Notes (opens new window) per modificare le tue note nel web. WARNING Tieni presente che Nextcloud Notes attualmente supporta solo fino a un livello di sottocartelle. # App del server Nextcloud Deck Puoi usare QOwnNotes per creare rapidamente delle cards in Nextcloud Deck (opens new window). # App Nexcloud Notes per dispositivi mobili Per accedere alle tue note Nextcloud/Owncloud dal tuo dispositivo mobile puoi usare app differenti. # Android Nextcloud Notes for Android (opens new window) (terze parti) TIP Puoi anche usare qualsiasi strumento di sincronizzazione come Synchronize Ultimate o Folder Sync per sincronizzare i files delle tue note. Inoltre puoi usare programmi come neutriNotes per modificare le tue note. # iOS CloudNotes for iOS (opens new window) (terze parti) TIP Puoi anche usare Notebooks (opens new window) e sincronizzare le tue note tramite WebDAV, è presente una buona guida su Prendere note con Nextcloud, QOwnNotes e Notebook (opens new window)::: # api.qownnotes.org Questo è un servizio online offerto da QOwnNotes per controllare se c'è una nuova versione disponibile dell'applicazione. Comunicando con GitHub controlla l'ultima versione e ottiene un URL adatto per il download. Compila le modifiche dal changelog comparandole alla versione di QOwnNOtes che stai attualmente usando come html per mostrarlo nella finestra di dialogo di aggiornamento. Inoltre, fornisce anche il Feed RSS di rilascio (opens new window) e un'implementazione dell'API di controllo degli aggiornamenti legacy per le versioni precedenti di QOwnNotes. TIP Puoi accedere al codice sorgente api.qownnotes.org (opens new window) su GitHub (opens new window). # Applicazione web di QOwnNotes Puoi inserire foto dal tuo cellulare nella nota corrente in QOwnNotes sul tuo desktop tramite l'applicazione web su app.qownnotes.org (opens new window). TIP È pregato di visitare QOwnNotes Web App per ulteriori informazioni. Aiutaci a migliorare questo sito! (opens new window) ← Panoramica Demo QOwnNotes → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
