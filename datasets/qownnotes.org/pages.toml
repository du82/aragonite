title = "QOwnNotes 데모 | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# QOwnNotes 데모 :: 팁 노트 데모 환경의 현재 상태에 따라 항상 작동하지 않을 수도 있습니다. ::: 다음 지침에 따라 QOwnNotes를 설치하지 않고도 웹 브라우저에서 사용해 볼 수 있습니다: Docke로 재생 (opens new window) 링크를 클릭합니다. 2) 로그인/시작 버튼 (스크린샷 글머리표 1 참조)을 클릭하고 Docker 계정으로 로그인합니다 (아직 Docker 계정이 없는 경우 생성해야 함). 컨테이너가 생성되고 회전할 때까지 기다립니다. 그런 다음 상단의 6080을 클릭할 수 있습니다 (스크린샷 글머리표 2 참조). 오류가 발생하면 조금 더 기다렸다가 6080을 다시 클릭하십시오. 데스크톱 환경이 로드되는 데 시간이 좀 걸립니다. 새 브라우저 탭이 열리고 데스크톱이 생성됩니다. 화면의 왼쪽 아래 기호 (작업 표시줄)를 클릭하고 액세서리 위에 마우스를 올려놓고 QOwnNotes (스크린샷 글머리표 3 참조)를 클릭합니다. QOwnNotes 설치 대화상자가 열리고 해당 대화상자를 클릭한 후 마침을 눌러 QOwnNotes 기본 창을 확인합니다. 이 페이지를 개선할 수 있도록 도와주세요! (opens new window) ← 개념 마크다운 → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
