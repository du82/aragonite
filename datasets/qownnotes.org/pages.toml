kę w nowej karcie (pamiętaj, że istnieje hak skryptowy, który może przesłonić akcję podwójnego kliknięcia) ⌘ Cmd + A zaznacza wszystkie notatki (aby przenieść, skopiować lub usunąć je prawym przyciskiem myszy) Tab lub Return umożliwia edycję bieżącej notatki # W panelu edycji tekstu notatki ⌘ Cmd + Kliknij link, aby go otworzyć ⌘ Cmd + F umożliwia wyszukiwanie w bieżącej notatce użyj klawiszy w górę i w dół lub F3 i ⇧ Shift + F3, aby przejść do poprzedniego i następnego dopasowania Esc zamyka pasek wyszukiwania ⌘ Cmd + R umożliwia wyszukiwanie i zamienianie w bieżącej notatce ⌘ Cmd + D duplikuje bieżącą linię lub zaznaczony tekst ⌘ Cmd + ⌃ Ctrl + W dół robi to samo ⌘ Cmd + Backspace usuwa bieżącą linię ⌃ Ctrl + Backspace usuwa bieżące słowo ⌘ Cmd + L otwiera okno dialogowe dodawania linku tekstowego (działa również na zaznaczonym tekście) ⌘ Cmd + ⇧ Shift + L otwiera okno dialogowe dodawania linku do notatki ⌘ Cmd + T wstawia aktualną datę i czas w formacie określonym przez użytkownika ⌘ Cmd + ⇧ Shift + I wstawia obraz (obraz zostanie skopiowany do folderu media w aktualny folder notatek) ⌘ Cmd + ⇧ Shift + X wstawia załącznik (plik zostanie skopiowany do folderu załączniki w aktualny folder notatek) ⌃ Ctrl + ⇧ Shift + T wstawia tabelę ⌘ Cmd + ⇧ Shift + C wstawia blok kodu w bieżącej pozycji ⌘ Cmd + ⇧ Shift + B wstawia cytat blokowy w bieżącej pozycji ⌘ Cmd + ⇧ Shift + <0>B</0> wstawia cytat blokowy w bieżącej pozycji ⌘ Cmd + I formatuje zaznaczony tekst kursywą ⌘ Cmd + U formatuje podkreślenie zaznaczonego tekstu ⌃ Ctrl + ⇧ Shift + S przekreśla zaznaczony tekst ⌘ Cmd + ⇧ Shift + U przełącza wielkości liter w wybranym tekście Tab wcina zaznaczony tekst (działa również na wielu liniach) ⇧ Shift + Tab usuwa wcięcie zaznaczonego tekstu Tab po nieuporządkowanym znaku listy wcina element listy ⇧ Shift + Tab po nieuporządkowanym znaku listy wcina element listy Powrót na listach tworzy nowy element listy ⌘ Cmd + ⌃ Ctrl + W lewo przeskakuje z powrotem w historii notatek ⌘ Cmd