["https://qownnotes.org/es/getting-started/cli-parameters.html"]
title = "Parámetros de la interfaz de las órdenes de terminal | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# Parámetros de la interfaz de las órdenes de terminal Puede utilizar estos parámetros en la interfaz de las órdenes de terminal (CLI) para controlar el comportamiento de la aplicación: Parámetro Descripción --help Muestra la pantalla de ayuda --version Imprime el número de versión de la aplicación --portable Ejecuta la aplicación en modo portable --clear-settings Elimina los ajustes y ejecuta la aplicación --dump-settings Imprime un volcado de la configuración y otra información sobre la aplicación y el entorno de GitHub en markdown y sale de la aplicación --session <name> Ejecuta la aplicación en un contexto diferente para la configuración y archivos internos --allow-multiple-instances Permite iniciar varias instancias de QOwnNotes, incluso si no está permitido en la configuración --action <name> Activa una acción de menú después de que se inicie la aplicación (vea abajo) --completion <shell> Genera un código de finalización de consola. Soporta fish y bash. TIP Si tiene problemas con la instalación de QOwnNotes, es posible que desee iniciar la aplicación con una configuración nueva sin perder la configuración actual mediante el parámetro --session. QOwnNotes --session test 1 Puede ejecutar la aplicación en la interfaz de órdenes de terminal de manera diferente en diferentes sistemas operativos: Sistema Operativo Orden Linux QOwnNotes (o qownnotes si se instaló como snap) macOS /Applications/QOwnNotes.app/Contents/MacOS/QOwnNotes Windows QOwnNotes.exe TIP Para copiar directamente el volcado de configuración en el portapapeles para luego publicarlo como un informe de GitHub (opens new window), puede utilizar xclip o xsel en Linux, pbcopy en macOS y clip en Windows: # Copiar el volcado de configuración en el portapapeles con xclip en Linux QOwnNotes --dump-settings | xclip -selection clipboard # Copiar el volcado de configuración en el portapapeles con xsel en Linux QOwnNotes --dump-settings | xsel --clipboard # Copiar el volcado de configuración en el portapapeles con pbcopy en macOS QOwnNotes --dump-settings | pbcopy # Copiar el volcado de configuración en el portapapeles con clip en LinuxWindows QOwnNotes --dump-settings | clip 1234567891011 # Activar acciones del menú después del inicio Con el parámetro --action <name> puede activar acciones de menú después de que se inicie la aplicación. Por ejemplo, para abrir el cuadro de diálogo de la lista de tareas pendientes después del inicio utilice: QOwnNotes --action actionShow_Todo_List 1TIP Puede obtener los nombres de objeto de la acción del menú desde mainwindow.ui (opens new window). Simplemente busque el título del menú en inglés. Tenga en cuenta que estos textos pueden cambiar con el tiempo. Para activar acciones de secuencia de órdenes, utilice customAction_ seguido del identificador de la acción personalizada. El identificador de la acción personalizada es el primer parámetro de la llamada script.registerCustomAction en el script. Por ejemplo, para ejecutar la acción personalizada myAction, inicie QOwnNotes así: QOwnNotes --action customAction_myAction 1TIP Si ejecuta QOwnNotes por segunda vez con el parámetro de acción y solo ha permitido una instancia de aplicación, la acción del menú se activará en la primera instancia. ¡Ayúdanos a mejorar este sitio! (opens new window) ← Importar notas Extensión del navegador QOwnNotes Web Companion → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
