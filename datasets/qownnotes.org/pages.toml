["https://qownnotes.org/installation/debian.html"]
title = "Install on Debian Linux | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = '''# Install on Debian Linux # Debian 12.0 Run the following shell commands to trust the repository. SIGNED_BY='/etc/apt/keyrings/qownnotes.gpg' sudo mkdir -p "$(dirname "${SIGNED_BY}")" curl --silent --show-error --location http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Debian_12/Release.key | gpg --dearmor | sudo tee "${SIGNED_BY}" > /dev/null sudo chmod u=rw,go=r "${SIGNED_BY}" 1234Run the following shell commands to add the repository and install QOwnNotes from there. SIGNED_BY='/etc/apt/keyrings/qownnotes.gpg' ARCHITECTURE="$(dpkg --print-architecture)" echo "deb [arch=${ARCHITECTURE} signed-by=${SIGNED_BY}] http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Debian_12/ /" | sudo tee /etc/apt/sources.list.d/qownnotes.list > /dev/null sudo apt update sudo apt install qownnotes 12345TIP If you use this repository for other Debian Linux versions please make sure that you have Qt installed at least at version 5.15. Direct Download (opens new window) # Debian 11.0 Run the following shell commands to trust the repository. SIGNED_BY='/etc/apt/keyrings/qownnotes.gpg' sudo mkdir -p "$(dirname "${SIGNED_BY}")" curl --silent --show-error --location http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Debian_11/Release.key | gpg --dearmor | sudo tee "${SIGNED_BY}" > /dev/null sudo chmod u=rw,go=r "${SIGNED_BY}" 1234Run the following shell commands to add the repository and install QOwnNotes from there. SIGNED_BY='/etc/apt/keyrings/qownnotes.gpg' ARCHITECTURE="$(dpkg --print-architecture)" echo "deb [arch=${ARCHITECTURE} signed-by=${SIGNED_BY}] http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Debian_11/ /" | sudo tee /etc/apt/sources.list.d/qownnotes.list > /dev/null sudo apt update sudo apt install qownnotes 12345TIP If you use this repository for other Debian Linux versions please make sure that you have Qt installed at least at version 5.11. Direct Download (opens new window) # Debian 10.0 Run the following shell commands to trust the repository. wget http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Debian_10/Release.key -O - | sudo apt-key add - 1Run the following shell commands to add the repository and install QOwnNotes from there. sudo bash -c "echo 'deb http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Debian_10/ /' >> /etc/apt/sources.list.d/qownnotes.list" sudo apt-get update sudo apt-get install qownnotes 123TIP If you use this repository for other Debian Linux versions please make sure that you have Qt installed at least at version 5.8. Direct Download (opens new window) # Debian 9.0 Run the following shell commands to trust the repository. wget http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Debian_9.0/Release.key -O - | sudo apt-key add - 1Run the following shell commands to add the repository and install QOwnNotes from there. sudo bash -c "echo 'deb http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Debian_9.0/ /' >> /etc/apt/sources.list.d/qownnotes.list" sudo apt-get update sudo apt-get install qownnotes 123TIP If you use this repository for other Debian Linux versions please make sure that you have Qt installed at least at version 5.5. Direct Download (opens new window) Help us improve this page! (opens new window) ← Install on macOS™ Install on openSUSE Linux → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!'''
