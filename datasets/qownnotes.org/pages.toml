title = "QOwnNotes Web App | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# QOwnNotes Web App Puoi inserire foto dal tuo cellulare nella nota corrente in QOwnNotes sul desktop tramite l'applicazione web su app.qownnotes.org (opens new window). L'applicazione web sul telefono comunica con l'applicazione desktop QOwnNotes tramite Internet. La comunicazione tra QOwnNotes e il servizio web è cifrata in transito. Nessuna immagine verrà archiviata sul server. C'è la pagina delle impostazioni Applicazione web per aggiungere il supporto per le applicazioni web. Non dimenticarti di copiare il tuo token segreto dalla pagina delle impostazione di QOwnNotes su app.qownnotes.org (opens new window) per poter comunicare con la tua istanza locale di QOwnNotes. Puoi anche leggere il token dal codice QR con il tuo telefono nell'applicazione web. Puoi trovare il codice sorgente dell'applicazione web su web-app su GitHub (opens new window). Puoi anche ospitare questo servizio web da solo, le immagini docker appena create sono disponibili su qownnotes-web-app su DockerHub (opens new window). Aiutaci a migliorare questo sito! (opens new window) ← Gestore dei frammenti di comandi QOwnNotesAPI Nextcloud App → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
