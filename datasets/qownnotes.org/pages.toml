["https://qownnotes.org/es/getting-started/importing-notes.html"]
title = "Importar notas | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# Importar notas # Evernote Dispone de un cuadro de diálogo de importación desde Evernote que puede abrir mediante el menú Nota▸Importar para importar archivos Enex. Se importarán asimismo las imágenes, los archivos adjuntos, las etiquetas, el formato básico y los metadatos. # Joplin Dispone de un diálogo de importación de Joplin al que puede acceder mediante el menú Nota▸Importar. # Formatos variados La herramienta de órdenes de terminal jimmy (opens new window) puede convertir varios formatos a Markdown (como Google Keep (opens new window), Synology Note Station (opens new window) y más (opens new window)). Para preservar tantos metadatos como sea posible, se recomienda aplicar ajustes adicionales (opens new window). Si existen problemas con la conversión, siéntanse libre de abrir un boleto en GitHub (opens new window). # Google Keep Descargue las tareas de Keep mediante Google Takeout Extraiga el archivador Descargue keep_to_markdown.py en el directorio junto a la carpeta de Keep extraída python keep_to_markdown.py Keep out/ Reemplace Keep por la carpeta que contiene las notas en formato JSON. La carpeta out se creará si no existiese. De https://gitlab.com/-/snippets/2002921 (opens new window) # Tomboy Es posible importar sus notas de Tomboy a través de una secuencia de órdenes denominada Trombone (opens new window). Para que la secuencia de órdenes funcione, puede necesitar instalar python2. Esto convertirá sus notas de Tomboy en un archivo .enex de Evernote, el cual podrá importar en QOwnNotes. Si desea efectuar este proceso, primero cerciórese de que ha instalado Python2 y, opcionalmente, python-is-python2 (puede desinstalarlo posteriormente). Puede que esto sea más sencillo/seguro en un contenedor chroot o Docker si tiene esa opción (esto será documentado aquí posteriormente). sudo apt install python2 python-is-python2 1Descargue el archivo de trombone desde GitHub, extráigalo y entre en la carpeta resultante: cd ~/Downloads/trombone-master sudo make sudo make install 1234A continuación, entre en la carpeta que contenga sus notas de Tomboy: cd ~/.local/share/tomboy/ 1Ahora, ejecute lo siguiente: find ./ -type f -name '*.note' -print0 | xargs -0 trombone > EXPORT.enex 1Si recibe errores relacionados con Unicode en ciertas notas, simplemente vaya quitándolas y vuelva a ejecutar la conversión hasta que se genere el mensaje Saving... («Guardando…»). Obtendrá un archivo con el nombre EXPORT.enex, el cual podrá importar en QOwnNotes. Durante la importación a QOwnNotes, puede desmarcar todos los atributos de la importación excepto la fecha de creación / modificación, ya que Tomboy no contiene esas características. ¡Ayúdanos a mejorar este sitio! (opens new window) ← Markdown Parámetros de la interfaz de las órdenes de terminal → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
