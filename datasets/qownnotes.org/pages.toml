["https://qownnotes.org/de/getting-started/overview.html"]
title = "Übersicht | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# Übersicht Bearbeiten Sie Ihre Notizen mit Markdown-Hervorhebungen, farbigen Tags und Unterordnern Q für das verwendete Qt-Framework (opens new window) Own, weil Sie Ihre eigenen Notizen besitzen Notes für die Notizen, die Sie erstellen QOwnNotes (opens new window) ist die Open Source (GPL) Klartextdatei-Markdown-Notizanwendung für GNU/Linux, MacOS und Windows, die (optional) mit der Notizenanwendung (opens new window) von Nextcloud (opens new window) und ownCloud (opens new window) zusammenarbeitet. TIP Treten Sie unserer Telegram Gruppe (opens new window) bei, um zu diskutieren, zu lernen und sich mit der QOwnNotes-Community zu verbinden. Verstehen Sie das Konzept von QOwnNotes # Features Sie können Ihre bereits vorhandenen Text- oder Markdowndateien verwenden; kein Import nötig QOwnNotes ist in C++ geschrieben und für geringen Ressourcenverbrauch optimiert (keine CPU- und speicherhungrige Electron-App) Evernote- und Joplin-Import Kompatibel mit der Notes (opens new window)-App von Nextcloud / ownCloud und Mobile und Nextcloud Text Erstellen Sie Nextcloud Deck (opens new window) Karten und verlinken Sie sie in Ihren Notizen Unterstützt das Teilen von Notizen auf Ihrem ownCloud / Nextcloud Server Verwalten Sie Ihre Nextcloud / ownCloud To-do-Listen (Nextcloud tasks oder Tasks Plus / Calendar Plus) oder verwenden Sie einen anderen CalDAV, um Ihre Aufgaben darauf zu synchronisieren Ältere Versionen Ihrer Notizen können von Ihrem Nextcloud / ownCloud-Server wiederhergestellt werden Gelöschte Notizen können von Ihrem Nextcloud / ownCloud-Server wiederhergestellt werden Externe Änderungen von Notizdateien werden überwacht (Notizen oder Notizliste werden neu geladen) Unterstützung für hierarchische Notizschlagwörter und Notiz-Unterordner Optionale Verschlüsselung von Notizen, AES-256 ist eingebaut, oder Sie können personalisierte Verschlüsselungsmethoden wie Keybase.io (opens new window) (encryption-keybase.qml (opens new window)) oder PGP (encryption-pgp.qml (opens new window)) benutzen Der Notizenordner kann frei gewählt werden (mehrere Notizenordner können verwendet werden) Das Suchen von Wortstücken in Notizen ist möglich und Suchergebnisse werden in den Notizen hervorgehoben Browsererweiterung um Notizen aus ausgewähltem Text hinzuzufügen, Screenshots zu erstellen oder um Ihre Lesezeichen zu verwalten Rechtschreibprüfung wird unterstützt Portabler Modus um QOwnNotes auf USB-Sticks mitzunehmen Skriptunterstützung und ein online Skriptverzeichnis (opens new window), wo Sie Skripte in der App installieren können Implementation of the OpenAI completion API (opens new window) to be used in scripts Vim-Modus Web-App um Fotos von Ihrem mobilen Telefon in Notizen auf QOwnNote auf Ihrem Desktop einzufügen # Aussehen Markdown-Hervorhebung von Notizen und ein Markdown-Vorschaumodus Unterstützung für Schemata im Dunkelmodus Schemata-Unterstützung für die Hervorhebung von Markdown-Syntax Alle Schaltflächen können platziert werden, wo immer Sie möchten, sie können sogar schweben oder gestapelt werden (vollständig dockbar) Unterstützung für Freedesktop-Schemasymbole. Sie können QOwnNotes mit Ihren originalen Desktop-Symbolen und mit Ihrem bevorzugten dunklen Desktop-Design verwenden Ablenkungsfreier Modus, Vollbildmodus und Schreibmaschinenmodus Zeilennummern Unterschiede zwischen aktueller Notiz und extern geänderter Notiz werden in einem Dialog angezeigt # Sprachen Verfügbar in mehr als 60 verschiedenen Sprachen wie Englisch, Deutsch, Französisch, Polnisch, Chinesisch, Japanisch, Russisch, Portugiesisch, Ungarisch, Niederländisch und Spanisch Ihre Hilfe wird sehr geschätzt, um diese Übersetzungen zu verbessern oder QOwnNotes in mehr Sprachen zu übersetzen Hilf uns diese Seite zu verbessern! (opens new window) Konzept → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
