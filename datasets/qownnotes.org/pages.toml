full_description = "# Áttekintés Szerkesztheti jegyzeteit kiemeléssel, színes címkékkel és almappákkal Q a Qt framework (opens new window), amelyet használ Own mert birtokolja a jegyzeteit Notes az Ön jegyzetei végett, melyeket elkészít A QOwnNotes (opens new window) a nyílt forráskódú (GPL) sima szövegű fájl macOS és Windows, amelyek (opcionálisan) együtt működnek a Nextcloud (opens new window) és az ownCloud (opens new window) Notes alkalmazással (opens new window). TIP Csatlakozzon a Telegram csoport (opens new window)unkhoz, beszélgetés, tanulás és egymással kapcsolatba lépésünk érdekében a QOwnNotes közösséggel. Értse meg a QOwnNotes fogalmát # Funkciók You can use your existing text or markdown files, no need for an import A QOwnNotes C++ nyelven íródott, és alacsony erőforrás-fogyasztásra van optimalizálva (nincs CPU és memóriaéhes Electron alkalmazás) Evernote és Joplin import Compatible with the Notes (opens new window) application of Nextcloud / ownCloud and mobile and Nextcloud Text Create Nextcloud Deck (opens new window) cards and link to them in your notes Support for sharing notes on your ownCloud / Nextcloud server Manage your Nextcloud / ownCloud todo lists (Nextcloud tasks or Tasks Plus / Calendar Plus) or use another CalDAV server to sync your tasks to Older versions of your notes can be restored from your Nextcloud / ownCloud server Trashed notes can be restored from your Nextcloud / ownCloud server External changes of note files are watched (notes or note list are reloaded) Support for hierarchical note tagging and note subfolders Optional encryption of notes, AES-256 is built in, or you can use custom encryption methods like Keybase.io (opens new window) (encryption-keybase.qml (opens new window)) or PGP (encryption-pgp.qml (opens new window)) The notes folder can be freely chosen (multiple note folders can be used) Searching parts of words in notes is possible and search results are highlighted in the notes Browser extension to add notes from the selected text, make screenshots or manage your bookmarks Spellchecking support Portable mode for carrying QOwnNotes around on USB sticks Scripting support and an online script repository (opens new window) where you can install scripts inside the application Implementation of the OpenAI completion API (opens new window) to be used in scripts Vim mode Web application to insert photos from your mobile phone into the current note in QOwnNotes on your desktop # Megjelenés A jegyzetek jelölésének kiemelése és egy jelölés előnézeti mód Sötét módú téma támogatás Theming support for the Markdown syntax highlighting Minden panel tetszőlegesen elhelyezhető, akár lebeghet vagy teljesen dokkolható Támogatja a freedesktop téma ikonokat, használhatja a QOwnNotes programot a natív asztali ikonokkal és a kedvenc sötét asztali témájával Figyelemelterelés mentes mód, teljes képernyős mód és Írógép mód Sorszám Az aktuális és a külsőleg megváltozott jegyzet közötti különbségeket egy párbeszédpanelen mutatják # Nyelvek Több mint 60 különböző nyelven érhető el, mint például angol, német, francia, lengyel, kínai, japán, orosz, portugál, magyar, holland és spanyol Segítségét nagyra értékelik ezen fordítások fejlesztése vagy a QOwnNotes több nyelvre történő lefordítása érdekében Segítsen javítani ezt az oldalt! (opens new window) Koncepció → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
