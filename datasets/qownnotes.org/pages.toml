["https://qownnotes.org/hu/getting-started/shortcuts.html"]
title = "Parancsikonok | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# Parancsikonok # Linux / Windows # A főablakban Ctrl + N új jegyzetet hoz létre az aktuális dátummal és idővel a névben Ctrl + ⇧ Shift + N új jegyzetet hoz létre egy új lapon Ctrl + ⇧ Shift + F lehetővé teszi a jegyzetek keresését (a jegyzet nevében és tartalmában) Alt + F lehetővé teszi jegyzetek keresését (a jegyzet és tartalma nevében) Alt + ⇧ Shift + P átvált az előző munkaterületre Ctrl + ⇧ Shift + E titkosított jegyzetet szerkeszt Alt + R eltávolítja az aktuális jegyzetet Alt + ⇧ Shift + U frissítéseket keres Ctrl + ⇧ Shift + T megnyitja a teendők listáját Ctrl + ⇧ Shift + O megnyitja az aktuális jegyzetet egy külső szerkesztőben Alt + ⇧ Shift + O nézetben megnyitja az aktuális jegyzetet Alt + ⇧ Shift + F megjeleníti az aktuális jegyzetet a fájlkezelőben Alt + ⇧ Shift + E engedélyezi vagy letiltja a jegyzetek szerkesztését Alt + Up jumps to the previous visible note Alt + Down a következő látható jegyzethez ugrik Alt + Page Up az előző jegyzethez ugrik Alt + Page Down a következő jegyzetlapra ugrik A Ctrl + W bezárja az aktuális jegyzetfület Ctrl + ⇧ Shift + D átkapcsolja a figyelemelvonás mentes módot bezárhatja az Esc gombbal is Ctrl + P a figyelemelterelés nélküli mód váltása Ctrl + ⇧ Shift + P kinyomtatja az aktuális jegyzetet leértékelésként Ctrl + ⇧ Shift + V jegyzeteket, képeket és html fájlokat illeszt be a vágólapról Ctrl + , megnyitja a beállításokat Alt + ⇧ Shift + A új címkét ad a jegyzethez Ctrl + ⇧ Shift + R újratölti az aktuális jegyzetmappát Ctrl + Alt + F lets you select a different note folder Ctrl + ⇧ Shift + S újratölti a szkriptmotort Ctrl + ⇧ Shift + M elrejti vagy megjeleníti a főmenüsort Ctrl + ⇧ Shift + A műveletek keresését teszi lehetővé Ctrl + S manuálisan menti a módosított jegyzeteket Alt + ⇧ Shift + I megnyitja a szkripttár párbeszédpanelt F4 a jegyzetszerkesztő panelhez ugrik F5 ugrik a jegyzetlistára F6 a jegyzet almappája panelre ugrik F7 a címkék panelre ugrik F8 a navigációs panelre ugrik F10 aktiválja az aktuális eszköz helyi menüjét F11 a teljes képernyős mód váltása Alt + ⇧ Shift + H az aktuális jegyzet címsorát másolja # A jegyzet keresősávban Down or Tab a fókuszt a jegyzetlistára állítja Return új jegyzetet hoz létre, amelynek címsoraként a keresősáv szövege található # A jegyzetlistában kattintson duplán a jegyzetre a jegyzet új lapon történő megnyitásához (ne feledje, hogy van egy parancsfájl-horog, amely felülírhatja a dupla kattintás műveletet) Ctrl + A kijelöli az összes jegyzetet (jobb egérgombbal áthelyezéshez, másoláshoz vagy eltávolításhoz) Tab or Return lehetővé teszi az aktuális jegyzet szerkesztését # A jegyzet szövegszerkesztő paneljén Ctrl + Click linkre kattintva nyissa meg Ctrl + F lets you search in the current note használja aUp and Down keys or F3 and ⇧ Shift + F3 billentyűket gombokkal az előző és a következő megfelelökre ugorhat Az Esc bezárja a keresősávot Ctrl + R lehetővé teszi az aktuális jegyzet keresését és cseréjét A Ctrl + D másolja az aktuális sort vagy a kijelölt szöveget Ctrl + Alt + Down ugyanezt teszi Alt + Backspace törli az aktuális sort Ctrl + Backspace törli az aktuális szót A Ctrl + L megnyit egy párbeszédpanelt szöveges hivatkozás hozzáadásához (a kiválasztott szövegen is működik) Ctrl + ⇧ Shift + L megnyílik egy párbeszédpanel a jegyzethivatkozás hozzáadásához Ctrl + T beszúrja az aktuális dátumot és időt egy felhasználóspecifikus formátumban Ctrl + ⇧ Shift + I beszúr egy képet (a kép az aktuális jegyzetmappa média mappájába másolódik) Ctrl + ⇧ Shift + X beszúr egy mellékletet (a fájl az aktuális jegyzetmappa mellékletek mappájába másolódik) Alt + ⇧ Shift + T beszúr egy táblázatot Ctrl + ⇧ Shift + C kódblokkot szúr be az aktuális pozícióba Ctrl + ⇧ Shift + B blokk idézőjelet szúr be az aktuális pozícióba Ctrl + B formats the selected text bold Ctrl + I a kijelölt szöveget dőlt formázza Ctrl + U formázza a kijelölt szöveget aláhúzással Alt + ⇧ Shift + S kihúzza a kijelölt szöveget Ctrl + ⇧ Shift + U körbejárja a kiválasztott szöveg eseteit Tab behúzza a kijelölt szöveget (több soron is működik) ⇧ Shift + Tab megszünteti a kijelölt szöveg behúzását Tab egy rendezetlen lista karakter után behúzza a lista elemét ⇧ Shift + Tab rendezetlen lista karakter után behúzza a lista elemét Return listákban létrehoz egy új listaelemet Alt + Left visszaugrik a jegyzettörténetbe előreugrik a jegyzettörténetben Shift + ⇧ + 1..9 jegyzet könyvjelzőt állít be az 1..9 könyvjelző nyílásba A Ctrl + 1..9 a jegyzet könyvjelzőjére ugrik az 1..9. könyvjelzőhelyen Ctrl + + increases the note text font size by one point Ctrl + - egy ponttal csökkenti a jegyzet szövegének betűméretét Ctrl + 0 visszaállítja a jegyzet szövegének betűméretét A ⌘ + szóköz megpróbál olyan egyszerű egyenleteket megoldani, mint (4+5)*3=a kurzor előtt, automatikusan kiegészíti a szöveget vagy megnyitja az URL-eket Ctrl + ⇧ Shift + Hcímsort szúr be a jegyzet tetején lévő jegyzet fájlnévből Alt + ⇧ Shift + X az aktuális hangjegyet két hangra osztja a kurzor aktuális pozíciójában Alt + ⇧ Shift + W megkeresi a kiválasztott szöveget a weben Ctrl + Up felfelé görgeti a tartalmat Ctrl + Down lefelé görgeti a tartalmat Ctrl + ⇧ Shift + Le az aktuális sort lefelé mozgatja Ctrl + ⇧ Shift + Up feljebb mozgatja az aktuális sort ⇧ Shift + Return két szóközt és egy újsor karaktert ad hozzá, hogy kikényszerítse az újsor leértékelését # A jegyzet előnézeti paneljén Ctrl + F lehetővé teszi az aktuális jegyzetben történő keresést használja a Fel és Le vagy az F3 és ⇧ Shift + F3 billentyűk az előző és a következő egyezésre ugráshoz Az Esc bezárja a keresősávot # A Todo listában Ctrl + S elmenti az aktuális aktuális elemet Ctrl + I menti az aktuális aktuális elemet, és beszúrja az aktuális jegyzetbe Ctrl + R eltávolítja az aktuális aktuális elemet # macOS # A főablakban ⌘ Cmd + N új jegyzetet hoz létre az aktuális dátummal és idővel a névben ⌘ Cmd + ⇧ Shift + N új jegyzetet hoz létre egy új lapon ⌘ Cmd + ⇧ Shift + F lehetővé teszi jegyzetek keresését (a 