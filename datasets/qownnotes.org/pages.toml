["https://qownnotes.org/ar/contributing/code-of-conduct.html"]
title = "ميثاق السلوك | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# ميثاق السلوك # عهدنا نحن، أعضاءً ومساهمين وقادة، نتعهد بجعل المشاركة في مجتمعنا تجرِبة خالية من المضايقات للجميع، بغض النظر عن عمرهم وعن حجم جسمهم وعن وجود إعاقة ظاهرة أو غير ظاهرة وعن جنسهم وعن جنسيتهم وعن عِرقهم وعن خبرتهم وعن تعليمهم وعن حالتهم الاجتماعية والاقتصادية وعن طبقتهم وعن طائفتهم وعن دينهم وعن مظهرهم الخارجي ولون جلدهم وعن هُويتهم الجنسية وميلهم الجنسي. نتعهد بالتصرف والتعامل بطرق تساهم في جعل المجتمع مفتوحًا ومُرحِّبًا ومتنوعًا وشموليًا وذا بيئة صحية. # معاييرنا من أمثلة السلوك الذي يساهم في جعل بيئة مجتمعنا إيجابية: التعاطف مع الآخرين والإحسان إليهم احترام آراء الآخرين ووجهات نظرهم وتجاربهم إعطاء النقد البنّاء، وقبوله بصدر رحب قَبول المسؤولية والاعتذار للذين تأثروا بأخطائنا، والتعلم من التجرِبة التركيز على ما هو أفضل، ليس فحسب لنا كأفراد، ولكن للمجتمع جميعه من أمثلة السلوك المرفوض: استخدام لغة أو صور ذات معنى جنسي، أو تحرش أو مضايقة جنسية من أي نوع التصيد (المشاغبة)، والتعليقات المهينة أو الازدرائية، والهجوم الشخصي أو السياسي المضايقة أو التحرش، سواءً عبر وسيلة تواصل عامة أو خاصة نشر معلومات الآخرين الخاصة بغير إذنهم الصريح، مثل عنوان المسكن أو عنوان البريد الإلكتروني أي سلوك آخر يُعدّ غير لائق في السياق المهني # مسؤوليات الإنفاذ قادة المجتمع مسؤولون عن توضيح معاييرنا للسلوك المقبول وعن إنفاذها، وسيتخذون الإجراءات التصحيحية العادلة المناسبة للرد على أي سلوك يرونه غير لائق أو يمثل تهديدًا أو هجومًا أو ضررًا. لدى قادة المشروع الحق والمسؤولية في إزالة أو تعديل أو رفض أيٍّ من: التعليقات، والإيداعات، والأكواد، وتعديلات الويكي، والمسائل، وأيّة مساهمات أخرى لا تتسق مع ميثاق السلوك، وسيشاركون أسباب الإجراءات الإشرافية عند الحاجة. # النطاق يطبَّق ميثاق السلوك هذا في جميع مساحات المجتمع، وكذلك يطبَّق عندما يكون أحد الأفراد ممثلا رسميا للمجتمع في مساحة عامة. يتضمن تمثيل مجتمعنا: استخدام عنوان بريد إلكتروني رسمي، والنشر عبر حساب تواصل اجتماعي رسمي، والعمل ممثلا مختارا لنا في فعالية على الإنترنت أو على الأرض. # الإنفاذ يمكن إبلاغ قادة المجتمع المسؤولين عن إنفاذ ميثاق السلوك، عن حالات التطاول أو المضايقات أو أي سلوك مرفوض (انظر قائمة تواصل على www.qownnotes.org/ar (opens new window)). سنراجع جميع الشكاوى ونحقق فيها فورا وبإنصاف. يلتزم جميع قادة المجتمع باحترام خصوصية وتأمين مَن يبلغ عن أي حادث. # إرشادات الإنفاذ سيتبّع قادة المجتمع إرشادات الأثر المجتمعي هذه في تحديد عواقب أي فعل يرونه مخالفا لميثاق السلوك: # ١. التصحيح الأثر المجتمعي: استخدام لغة غير لائقة، أو أي سلوك آخر يُعدّ غير مهني أو غير مقبول في المجتمع. العواقب: تحذير مكتوب، عبر الخاص، من قادة المجتمع، موضحا طبيعة المخالفة ولماذا كان هذا السلوك غير لائق. قد يُطلب اعتذار عام. # ٢. التحذير الأثر المجتمعي: مخالفة في موقف واحد أو سلسلة من الأفعال. العواقب: التحذير بالعواقب في حالة استمرار السلوك. ممنوع خلال مدة محددة التعامل مع هؤلاء الأشخاص، بما في ذلك التعامل غير المرغوب فيه مع الذين ينفذون ميثاق السلوك. هذا يشمل تجنب التعامل في مساحات المجتمع وكذلك قنوات التواصل الخارجية مثل مواقع التواصل الاجتماعي. قد تؤدي مخالفة هذه الشروط إلى حظر مؤقت أو دائم. # ٣. الحظر المؤقت الأثر المجتمعي: مخالفة فادحة لمعايير المجتمع، بما في ذلك الاستمرار في سلوك غير لائق. العواقب: حظر مؤقت من أي نوع من التعامل أو التواصل العام مع المجتمع لمدة زمنية محددة. ممنوع خلال هذه المدة التعامل عبر وسيلة تواصل عامة أو خاصة مع هؤلاء الأشخاص، بما في ذلك التعامل غير المرغوب فيه مع الذين ينفذون ميثاق السلوك. قد تؤدي مخالفة هذه الشروط إلى حظر دائم. # ٤. الحظر الدائم الأثر المجتمعي: إظهار عادة لمخالفة معايير المجتمع، بما في ذلك استمرار الأفعال غير اللائقة، ومضايقة فرد أو التحرش به لفظيا أو غير ذلك، والعنف تجاه بعض الفئات من البشر أو الاستهزاء بهم. العواقب: حظر دائم من أي نوع من التعامل العام داخل المجتمع. # الإسناد ميثاق السلوك هذا مشتق من Contributor Covenant (ميثاق المساهمين) (opens new window)، النسخة ١٫٢، والمتاحة على https://www.contributor-covenant.org/version/2/1/code_of_conduct.html (opens new window). إرشادات الأثر المجتمعي مستوحاة من سلّم إنفاذ ميثاق السلوك من موزيلا (opens new window). لإجابات عن الأسئلة الشائعة عن ميثاق السلوك هذا، انظر صفحة الأسئلة الشائعة (بالإنجليزية) على https://www.contributor-covenant.org/faq (opens new window). الترجمات متاحة على https://www.contributor-covenant.org/translations (opens new window). ساعدنا في تحسين هذه الصفحة! (opens new window) ← شارك معنا المطورون → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
year_published = 2025
