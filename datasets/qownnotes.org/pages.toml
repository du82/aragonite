["https://qownnotes.org/installation/appimage.html"]
title = "Install as AppImage | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# Install as AppImage You can download the latest AppImage from the QOwnNotes releases page (opens new window). It should be named like QOwnNotes-x86_64.AppImage on that page. TIP If you have jq (opens new window) installed you can also download the latest AppImage directly: # query the latest Linux release from the QOwnNotes API, parse the JSON for the URL and download it curl -L https://api.qownnotes.org/latest_releases/linux | jq .url | xargs curl -Lo QOwnNotes-x86_64.AppImage 12 Then you can change the execute-permissions on the file: chmod a+x QOwnNotes-*.AppImage 1TIP AppImages need libfuse2 to run! For example under Ubuntu you can install the library with sudo apt install libfuse2. Afterward you should be able to execute the AppImage to run QOwnNotes. WARNING If you want to use the automatic updater please make sure to put your AppImage in a place where your user account has write-access to, like somewhere in your home directory. TIP If you have troubles running the AppImage, because your glibc version is too old you can try the AppImage built on OBS (opens new window), it should be built with glibc 2.16. Help us improve this page! (opens new window) ← Install as Flatpak Install via Nix → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
