full_description = "# QOwnNotes Demo TIP Let op Dit werkt niet altijd, afhankelijk van de huidige staat van de demo-omgeving. U kunt QOwnNotes uitproberen in uw webbrowser zonder het te installeren door deze instructies te volgen: Klik op deze Spelen met Docker (opens new window) -link. 2) Klik op de knop Login / Start (zie screenshot bullet 1) en log in met je Docker-account (je moet er een maken als je er nog geen hebt). Wacht tot de container is gemaakt en rondgedraaid. Dan zou je bovenaan op 6080 moeten kunnen klikken (zie screenshot bullet 2). Als u een foutmelding krijgt, wacht dan nog even en probeer nogmaals op 6080 te klikken, het duurt even voordat de desktopomgeving is geladen. Er zou een nieuw browsertabblad moeten worden geopend om een bureaublad te produceren. Klik op het symbool linksonder zweef op het scherm (in de taakbalk) over Accessoires en klik op QOwnNotes (zie screenshot bullet 3). De QOwnNotes installatiedialoog zou moeten openen, klik erdoorheen en druk op Voltooien om het hoofdvenster van QOwnNotes te zien. Help ons deze pagina te verbeteren! (opens new window) ← Concept Markdown → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
