title = "QOwnNotesAPI Nextcloud App | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# QOwnNotesAPI Nextcloud App QOwnNotesAPI (opens new window) puede manejar el acceso a notas en la papelera y versiones de notas por usted. TIP Puede habilitar QOwnNotesAPI directamente en su instancia de Nextcloud o ownCloud buscando qownnotes en la página de aplicaciones de su servidor en https://<your-cloud-domain>/settings/apps. Página de aplicaciones de Nextcloud (opens new window) página de aplicaciones ownCloud (opens new window) El intercambio de notas se realiza a través de la API proporcionada por Nextcloud / ownCloud. Se accede a las tareas directamente a través de CalDAV. TIP Utilice su cliente de sincronización de Nextcloud / ownCloud para sincronizar sus notas. Sus notas son simples archivos markdown. No es necesario reinventar la rueda. Y también hay personas que utilizan diferentes servicios para sincronizar sus archivos de notas (como Dropbox, Syncthing o Resilio Sync). # Lo que QOwnNotesAPI hace Acceder a sus notas en la papelera Acceder a las versiones de sus notas # Lo que QOwnNotesAPI no hace Sincronizar sus notas (por favor utilice su cliente de sincronización de ownCloud / Nextcloud) Compartir notas (que se hace directamente a través de la API de ownCloud / Nextcloud) Acceder a imágenes desde Nextcloud Text (opens new window) (que se realiza directamente a través de la API de Nextcloud) ¡Ayúdanos a mejorar este sitio! (opens new window) ← Aplicación web de QOwnNotes Buscar notas → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
