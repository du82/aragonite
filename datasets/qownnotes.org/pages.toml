title = "QOwnNotes Web App | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# QOwnNotes Web App Zdjęcia z telefonu komórkowego można wstawiać do bieżącej notatki w aplikacji QOwnNotes na pulpicie za pomocą aplikacji internetowej na stronie app.qownnotes.org (opens new window). Aplikacja internetowa w telefonie komunikuje się z aplikacją komputerową QOwnNotes przez Internet. Komunikacja pomiędzy QOwnNotes a serwisem internetowym jest transportowo szyfrowana. Żadne obrazy nie będą przechowywane na serwerze. There is a settings page Web application to add support for the web application. Nie zapomnij skopiować swojego poufnego tokena ze strony ustawień QOwnNotes do app.qownnotes.org (opens new window), aby móc komunikować się z lokalną instancją QOwnNotes. Możesz również zeskanować token z kodu QR telefonem w aplikacji internetowej. Kod źródłowy aplikacji internetowej można znaleźć na stronie web-app na GitHubie (opens new window). Możesz również hostować tę usługę internetową samodzielnie, świeżo zbudowane obrazy docker są dostępne na qownnotes-web-app na DockerHub (opens new window). Pomóż nam ulepszyć tę stronę! (opens new window) ← Command-line Snippet Manager QOwnNotesAPI Nextcloud App → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
