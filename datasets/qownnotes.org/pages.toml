full_description = 'QOwnNotes Kostenlose Open-Source-Markdown-Notizen für Klartextdateien mit Nextcloud / ownCloud-Integration Schnellstart → Besitze deine Notizen Alle Notizen werden als Nur-Text-Markdown-Dateien auf Ihrem Computer gespeichert, ohne "Vendor Lock-In". Sie können Synchronisierungsdienste wie Nextcloud verwenden, um Notizen geräteübergreifend zu synchronisieren.Kleiner Fußabdruck Native Anwendung, die auf Geschwindigkeit optimiert ist und wenig Prozessor- und Speicherressourcen benötigt.Anpassung Stark anpassbar und skriptfähig, Sie haben die Kontrolle darüber, wie Sie mit Ihren Notizen arbeiten möchten. Blog RSS Veröffentlichungen RSS How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know! Erstellt von Patrizio Bekerle mit ❤️'
