title = "Markdown | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = '# Markdown Esta hoja de referencia de Markdown está pensada como una referencia rápida y una muestra de la sintaxis de Markdown en QOwnNotes. # Encabezados Utilice los encabezados para estructurar sus textos. # H1 ## H2 ### H3 #### H4 ##### H5 ###### H6 123456TIP El panel de navegación muestra la estructura de sus encabezados. Alternativamente, para H1 y H2, un estilo de subrayado: Alt-H1 ====== Alt-H2 ------ 12345TIP Por defecto, QOwnNotes crea el nombre de archivo de una nota a partir del encabezado 1 (h1). # Énfasis Enfatice, también conocido como cursiva, con *asteriscos*. Puede usar el énfasis fuerte, también conocido como negrita, con **asteriscos**. 123TIP Puede usar el atajo Ctrl + B para poner el texto en negrita y Ctrl + I para ponerlo en cursiva. # Subrayar También existe una configuración opcional para habilitar la renderización del subrayado en la Configuración de la vista previa. _subrayado_ 1TIP Puede utilizar el atajo Ctrl + U para subrayar un texto. # Tachar ~~tachar~~ 1TIP Puedes usar el atajo Alt + Shift + S para tachar un texto. # Listas Hay muchas formas de crear listas. 1. Primer elemento de lista ordenada 2. Otro articulo * Sublista desordenada. 1. Los números reales no importan, solo que sean números 1. Sublista ordenada (solo funciona en el editor, no en la vista previa) 4. Y otro artículo. * La lista desordenada puede usar asteriscos - O menos + O más 12345678910TIP Si presiona Enter al final de una lista, se creará un nuevo elemento de lista. # Enlaces Dos de los usos más simples de los enlaces son apuntar a páginas web u otras notas. Existen múltiples formas en las que cada uno de estos enlaces puede verse. # Enlaces externos [Soy un enlace en estilo de línea](https://www.google.com) [Soy un enlace en estilo de línea con un título](https://www.google.com "Página de inicio de Google") [Puede utilizar números para las definiciones de los enlaces en el estilo de referencia][1] Las URL y URL entre paréntesis entre corchetes angulares se convertirán automáticamente en enlaces en la vista previa. http://www.example.com o <http://www.example.com> [1]: https://www.qownnotes.org 12345678910# Enlaces internos [Yo enlazo a la nota Diario.md](Diario.md) <Journal.md> funciona de forma similar. 123TIP Puede utilizar el atajo Ctrl + L para crear enlaces a páginas web u otras notas. Ctrl + Shift + X abrirá un diálogo que le ayudará a inserta archivos adjuntos en su nota. Puede presionar Ctrl + Espacio mientras el cursor está en un enlace en la edición de notas para abrir el enlace. # Marcadores Los marcadores utilizados por la extensión de navegador QOwnNotes Web Companion utilizan enlaces en listas. - [Nombre de la página web](https://www.ejemplo.com) #etiqueta1 #etiqueta2 alguna descripción y etiquetas 1# Imágenes Las imágenes se pueden incrustar en QOwnNotes. Estas se mostrarán en la vista previa. ![texto alternativo](media/mi-imagen.jpg) 1TIP Puede usar el atajo Ctrl + Shift + I para insertar una imagen en una nota. La imagen también puede estar en el portapapeles, el diálogo la detectará y mostrará una vista previa. También puede pegar directamente una imagen del portapapeles en su nota con Ctrl + Shift + V. # Código en línea y bloques de código El `código` en línea tiene `comillas invertidas` a su alrededor. 1TIP Puede usar el atajo Ctrl + Shift + C en texto en línea seleccionado o solo dentro del texto para crear un bloque de código en línea. Los bloques de código están delimitados por líneas con tres comillas invertidas o indentados con cuatro espacios. # Valla de 4 espacios Agregue cuatro espacios delante de su código para marcarlo como bloque de código. s = "Código con identación de espacio" print s 12# Valla de comillas invertidas También puede utilizar tres comillas invertidas para crear un bloque de código. ``` El código va aquí El código va aquí ``` 1234TIP Puede usar el [atajo] (./ shortcuts.md) Ctrl + Shift + C en varias líneas de texto seleccionadas o en una línea vacía para crear un bloque de código. # Valla de comillas invertidas con resaltado de código También hay algo de resaltado de sintaxis con bloques de código en QOwnNotes. ```bash # Soy un comentario cd Notas ``` 1234Actualmente, los idiomas admitidos (e identificadores de bloque de código) son: BASh scripting, bash C, c C++, cpp C++, cxx C++, c++ C#, c# CMake, cmake C#, csharp CSS, css Go, go HTML, html INI, ini Java, java JavaScript, javascript JavaScript, js JSON, json Makefile, make PHP, php Python, py Python, python QML, qml Rust, rust Shell scripting, sh SQL, sql TypeScript, ts TypeScript, typescript V, v Vex, vex XML, xml YAML, yml YAML, yaml # Tablas Las tablas no forman parte de la especificación principal de Markdown, pero la vista previa de QOwnNotes las admite. Se pueden usar virguillas para alinear columnas. | Las | Tablas | Molan | | ------------- |:-------------:| -----:| | la col 3 está | alineada a la derecha | $1600 | | la col 2 is | centrada | $12 | | las plecas | son elegantes | $1 | Debe haber al menos 3 guiones separando cada celda de encabezado. También puede utilizar Markdown en línea. | Markdown | Mola | Menos | | --- | --- | --- | | *Sin embargo* | `se muestra` | **correctamente** | | 1 | 2 | 3 | 12345678910111213141516TIP Presione Alt + Shift + T para activar un cuadro de diálogo que puede ayudarlo a crear tablas. Incluso puede importar archivos CSV en ese cuadro de diálogo. Use Ctrl + Espacio dentro de una tabla de markdown para formatearla automáticamente. # Citas en bloque > Las citas en bloque son muy útiles en los correos electrónicos para emular el texto de respuesta. > Esta línea es parte de la misma cita. Salto de cita. > Esta es una línea muy larga que aún se citará adecuadamente cuando la cita termine. Vaya, sigamos escribiendo para asegurarnos de que esto sea lo suficientemente largo como para envolver todo. Oh, puede *poner* **Markdown** en una cita en bloque. 123456TIP Puede decirle a QOwnNotes que resalte completamente las citas en bloque o solo el carácter de la cita en bloque en la Configuración del editor Puede usar el atajo Ctrl + Shift + B para marcar texto como cita en bloque. # Regla horizontal Hay tres formas de crear una regla horizontal: guiones, asteriscos o guiones bajos. Tres o más... Guiones --- Asteriscos *** Guiones bajos ___ 12345678910111213# Saltos de línea Puede dividir un párrafo en más de una sola línea para facilitar la edición. Las líneas aún se renderizan como un solo párrafo sin interrupciones. Puede forzar un salto de línea dentro de un párrafo terminando una línea con dos espacios. Puede hacer un párrafo separado delimitándolo con líneas vacías. TIP Puede ingresar dos espacios y una nueva línea con ⇧ Shift + Return. Aquí hay una línea con la cual podemos comenzar. Esta línea está separada de la anterior por dos líneas nuevas, por lo que será un *párrafo separado*. Esta línea también inicia un párrafo separado pero... Esta línea solo está separada por dos espacios finales y una sola línea nueva, por lo que es una línea separada en el *mismo párrafo*. 123456TIP Los espacios finales están resaltados de forma predeterminada en el editor. # Comentarios Los comentarios no se muestran en la vista previa. [comentario]: # (Este comentario no aparecerá en la vista previa) <!-- Los comentarios de HTML también están ocultos --> 123TIP Un bloque de comentario html inicial en una nota también se ignorará en la generación automática del nombre de archivo de la nota. # Listas de casillas de verificación Puede crear listas de tareas pendientes simples con listas de casillas de verificación. - [x] hecho - [ ] por hacer 12TIP Puede marcar / desmarcar las casillas de verificación en la vista previa. # Frontmatter En QOwnNotes puede usar un frontmatter (por ejemplo, YAML) para agregar algo de metainformación adicional. No se mostrará en la previsualización ni perturbará la generación automática de nombres de archivo para las notas. --- title: Un título description: Alguna descripción --- # El titular de la nota comienza aquí Algún texto 12345678El nombre de archivo de esta nota de ejemplo sería El título de la nota comienza aquí.md. ¡Ayúdanos a mejorar este sitio! (opens new window) ← Demo de QOwnNotes Importar notas → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!'
year_published = 2025
