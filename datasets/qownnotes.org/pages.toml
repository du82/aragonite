title = "Opdrachtregel-interface-parameters | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# Opdrachtregel-interface-parameters U kunt deze parameters op de opdrachtregelinterface (CLI) gebruiken om het gedrag van de toepassing te regelen: Parameter Beschrijving --help Toont het helpscherm --version Drukt het versienummer van de applicatie af --portable Start de applicatie in draagbare modus --clear-settings Wist de instellingen en start de applicatie --dump-settings Print een dump van de instellingen en andere informatie over de applicatie en omgeving in GitHub Markdown en sluit de applicatie af --session <name> Voert de applicatie uit in een andere context voor instellingen en interne bestanden --allow-multiple-instances Maakt het mogelijk om meerdere exemplaren van QOwnNotes te starten, zelfs als dit niet is toegestaan in de instellingen --action <name> Activeert een menuactie nadat de applicatie is gestart (zie hieronder) --completion <shell> Genereer shell-voltooiingscode. Met ondersteuning voor fish, bash. TIP Als u problemen ondervindt met uw installatie van QOwnNotes, wilt u misschien de toepassing starten met nieuwe instellingen zonder uw huidige instellingen te verliezen door de parameter --session te gebruiken. QOwnNotes --session test 1 U kunt de toepassing op de opdrachtregelinterface op verschillende besturingssystemen op verschillende manieren uitvoeren: Besturingssysteem Opdracht Linux QOwnNotes (of qownnotes indien geïnstalleerd als module) macOS /Applications/QOwnNotes.app/Contents/MacOS/QOwnNotes Windows QOwnNotes.exe TIP Om de instellingendump rechtstreeks naar het klembord te kopiëren en dit te gebruiken bij de melding van een GitHub-probleem (opens new window) kunt u xclip</1 gebruiken> of <code>xsel op Linux, pbcopy op macOS en clip op Windows: # Kopieer de instellingendump naar het klembord met xclip op Linux QOwnNotes --dump-settings | xclip -selection clipboard # Kopieer de instellingen dump naar het klembord met xsel op Linux QOwnNotes --dump-settings | xclip -selection clipboard # Kopieer de instellingendump naar het klembord met pbcopy op macOS QOwnNotes --dump-settings | pbcopy # Kopieer de instellingendump naar het klembord met clip op Windows QOwnNotes --dump-settings | clip 1234567891011 # Menuacties activeren na opstarten Met de parameter --action <name> kunt u menuacties activeren nadat de applicatie is gestart. Gebruik bijvoorbeeld om het dialoogvenster met de takenlijst te openen na het opstarten: QOwnNotes --action actionShow_Todo_List 1TIP U kunt de objectnamen van de menuactie ophalen van hoofdvenster.ui (opens new window). Zoek gewoon naar de Engelse menutitel. Houd er rekening mee dat deze teksten in de loop van de tijd kunnen veranderen. Om scriptacties te activeren, gebruikt u customAction_ gevolgd door de identifier van de aangepaste actie. De id van de aangepaste actie is de eerste parameter van de script.registerCustomAction-aanroep in het script. Om bijvoorbeeld de aangepaste actie myAction uit te voeren, start u QOwnNotes als volgt: QOwnNotes --action customAction_myAction 1TIP Als u QOwnNotes een tweede keer uitvoert met de actieparameter en slechts één toepassingsinstantie hebt toegestaan, wordt de menuactie in eerste instantie geactiveerd. Help ons deze pagina te verbeteren! (opens new window) ← Notities importeren Browser-extensie QOwnNotes Web Companion → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
