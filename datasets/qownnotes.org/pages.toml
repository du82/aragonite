["https://qownnotes.org/de/getting-started/concept.html"]
title = "Konzept | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# Konzept # QOwnNotes QOwnNotes speichert Notizen in Ihren Notizordner als Markdown-Dateien Es kann mit Ihrem Nextcloud / ownCloud-Server kommunizieren, um Notizen öffentlich mit anderen Personen zu teilen Sie können auch auf Ihrem Nextcloud / ownCloud-Server über die QOwnNotesApi Nextcloud-App auf Ihren Notizverlauf und Papierkorb zugreifen Auf To-do-Listen auf Ihrem Nextcloud / ownCloud-Server kann über QOwnNotes zugegriffen werden Medien- / Anhangsdateien werden nicht von QOwnNotes synchronisiert! Die Dateisynchronisierung ist ein komplexes Unterfangen. Es gibt bereits großartige Dateisynchronisierungslösungen (siehe Nextcloud Desktop Sync Client). # Markdown-Notizdateien Sie besitzen alle Ihre Notizen und Medien- / Anhangsdateien! Ihre Notizen werden als Klartext Markdowndateien auf Ihrem Desktop-PC gespeichert Sie können einen beliebigen Texteditor neben QOwnNotes verwenden, um Ihre Notizdateien anzuzeigen oder zu bearbeiten Synchronisieren Sie Ihre Notizen auf anderen Geräten (Desktop & Mobile) mit Ihrem Nextcloud (opens new window) oder ownCloud (opens new window)-Client auf Ihrem Server # QOwnNotes-Browsererweiterung Sie können Ihre Browser-Lesezeichen mit QOwnNotes verwalten oder sie als Webclipper verwenden. TIP Die Browsererweiterungen funktionieren offline, es ist keine Internetverbindung erforderlich. Weitere Informationen finden Sie unter QOwnNotes Web Companion-Browsererweiterung. # QOwnNotes command-line snippet manager Sie können Ihre Befehlsschnipsel mit QOwnNotes verwalten und auf der Befehlszeile ausführen. TIP Weitere Informationen finden Sie unter QOwnNotes-Befehlszeilen-Snippet-Manager. # Nextcloud Desktop Sync Client Synchronisieren Sie Ihre Notizen mit anderen Geräten (desktop & mobile) mit Ihrem Nextcloud (opens new window)- oder ownCloud (opens new window)-Sync-Client mit Ihrem Server. TIP Natürlich können auch andere Lösungen wie Dropbox, Syncthing, Seafile oder BitTorrent Sync verwendet werden, um Ihre Notizen und andere Dateien zu synchronisieren. Sie können auch git verwenden, um mit Tools wie gitomatic (opens new window) zu synchronisieren. # Nextcloud Server Um online mit Ihren Notizen zu arbeiten, können Sie Server wie Nextcloud (opens new window) oder ownCloud (opens new window) verwenden. Sie können Ihren eigenen Server hosten oder gehostete Lösungen verwenden. Es gibt eine von der Community gepflegte Liste der Nextcloud-Anbieter (opens new window) sowie eine Liste der Geräte mit Nextcloud (opens new window). Portknox (opens new window) hat gemeldet, dass QOwnNotesAPI installiert ist (opens new window). TIP Natürlich können auch andere Lösungen wie Dropbox, Syncthing, Seafile oder BitTorrent Sync verwendet werden, um Ihre Notizen und andere Dateien zu hosten. # QOwnNotesAPI Nextcloud-App Mit der QOwnNotesAPI (opens new window) können Sie auf Ihre serverseitigen verworfenen Notizen und Notizenversionen zugreifen. TIP Bitte besuchen Sie QOwnNotesAPI Nextcloud App für weitere Informationen. # Nextcloud Notes Server App Verwenden Sie Nextcloud Notes (opens new window), um Ihre Notizen im Web zu bearbeiten. WARNING Beachten Sie, dass Nextcloud Notes derzeit nur bis zu einer Ebene von Unterordnern unterstützt. # Nextcloud Deck Server App Sie können QOwnNotes verwenden, um Karten schnell in Nextcloud Deck (opens new window) zu erstellen. # Nextcloud Notes Mobile App Um auf Ihre Nextcloud / ownCloud Notizen von Ihrem mobilen Endgerät aus zuzugreifen, können Sie verschiedene Apps verwenden. # Android Nextcloud Notes für Android (opens new window) (Drittanbieter) TIP Sie könnten auch ein Sync-Tool wie Synchronize Ultimate oder FolderSync benutzen, um Ihre Notizdateien zu synchronisieren, und Software wie neutriNotes, um Ihre Notizen zu bearbeiten. # iOS CloudNotes für iOS (opens new window) (Drittanbieter) TIP Sie können auch Notebooks (opens new window) verwenden und Ihre Notizen via WebDAV synchronisieren. Es gibt ein gutes Tutorial auf Taking Notes with Nextcloud, QOwnNotes, and Notebooks (opens new window) # api.qownnotes.org Dies ist ein Onlinedienst von QOwnNotes, mit dem überprüft werden kann, ob eine neue Version der Anwendung verfügbar ist. Er kommuniziert mit GitHub und schaut nach dem letzten Update, erhält eine passende Download-URL und kompiliert die Änderungen aus dem Changelog, verglichen mit der QOwnNotes-Version, die sie gerade als HTML nutzen, um den Update-Dialog anzuzeigen. Zusätzlich stellt er einen Versionen RSS Feed (opens new window) und eine Implementierung der Legacy update checking API für ältere QOwnNotes-Versionen bereit. TIP Auf den Quellcode von api.qownnotes.org (opens new window) können Sie über GitHub (opens new window) zugreifen. # QOwnNotes Web-App Sie können Fotos von Ihrem mobilen Endgerät in die aktuelle Notiz in QOwnNotes auf Ihrem Desktop einfügen, indem Sie die Web-App auf app.qownnotes.org (opens new window) verwenden. TIP Bitte besuchen Sie QOwnNotes Web-App für mehr Informationen. Hilf uns diese Seite zu verbessern! (opens new window) ← Übersicht QOwnNotes Demo → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
