["https://qownnotes.org/scripting/methods-and-objects.html"]
title = "Methods and objects QOwnNotes provides | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = '''# Methods and objects QOwnNotes provides # Starting an external program in the background # Method call and parameters /** * QML wrapper to start a detached process * * @param executablePath the path of the executable * @param parameters a list of parameter strings * @param callbackIdentifier an identifier to be used in the onDetachedProcessCallback() function (optional) * @param callbackParameter an additional parameter for loops or the like (optional) * @param processData data written to the process if the callback is used (optional) * @param workingDirectory the working directory to execute the process in (optional, only works without callback) * @return true on success, false otherwise */ bool startDetachedProcess(QString executablePath, QStringList parameters, QString callbackIdentifier, QVariant callbackParameter, QByteArray processData, QString workingDirectory); 1234567891011121314# Example Simple example: script.startDetachedProcess("/path/to/my/program", ["my parameter"]); 1Running a lot of processes: for (var i = 0; i < 100; i++) { var dur = Math.floor(Math.random() * 10) + 1; script.startDetachedProcess("sleep", [`${dur}s`], "my-callback", i); } function onDetachedProcessCallback(callbackIdentifier, resultSet, cmd, thread) { if (callbackIdentifier == "my-callback") { script.log(`#${thread[1]} i[${thread[0]}] t${cmd[1]}`); } } 12345678910You may want to take a look at the example custom-actions.qml (opens new window), callback.qml (opens new window) or execute-command-after-note-update.qml (opens new window). You also might want to take a look at the onDetachedProcessCallback hook. # Starting an external program and wait for the output # Method call and parameters /** * QML wrapper to start a synchronous process * * @param executablePath the path of the executable * @param parameters a list of parameter strings * @param data the data that will be written to the process (optional) * @param workingDirectory the working directory to execute the process in (optional) * @return the text that was returned by the process QByteArray startSynchronousProcess(QString executablePath, QStringList parameters, QByteArray data, QString workingDirectory); 123456789# Example var result = script.startSynchronousProcess("/path/to/my/program", ["my parameter"], "data", "/path/to/execute/in"); 1You may want to take a look at the example encryption-keybase.qml (opens new window). # Getting the path of the current note folder # Method call and parameters /** * QML wrapper to get the current note folder path * * @return the path of the current note folder */ QString currentNoteFolderPath(); 123456# Example var path = script.currentNoteFolderPath(); 1You may want to take a look at the example absolute-media-links.qml (opens new window). # Getting the current note # Method call and parameters /** * QML wrapper to get the current note * * @returns {NoteApi} the current note object */ NoteApi currentNote(); 123456# Example var note = script.currentNote(); 1You may want to take a look at the example custom-actions.qml (opens new window). # Logging to the log widget # Method call and parameters /** * QML wrapper to log to the log widget * * @param text */ void log(QString text); 123456# Example script.log("my text"); 1# Downloading an url to a string # Method call and parameters /** * QML wrapper to download an url and returning it as text * * @param url * @return {QString} the content of the downloaded url */ QString downloadUrlToString(QUrl url); 1234567# Example var html = script.downloadUrlToString("https://www.qownnotes.org"); 1You may want to take a look at the example insert-headline-with-link-from-github-url.qml (opens new window). # Downloading an url to the media folder # Method call and parameters /** * QML wrapper to download an url to the media folder and returning the media * url or the markdown image text of the media relative to the current note * * @param {QString} url * @param {bool} returnUrlOnly if true only the media url will be returned (default false) * @return {QString} the media markdown or url */ QString downloadUrlToMedia(QUrl url, bool returnUrlOnly); 123456789# Example var markdown = script.downloadUrlToMedia("http://latex.codecogs.com/gif.latex?\frac{1}{1+sin(x)}"); 1You may want to take a look at the example paste-latex-image.qml (opens new window). # Inserting a media file into the media folder # Method call and parameters /** * QML wrapper to insert a media file into the media folder and returning * the media url or the markdown image text of the media relative to the current note * * @param {QString} mediaFilePath * @param {bool} returnUrlOnly if true only the media url will be returned (default false) * @return {QString} the media markdown or url */ QString ScriptingService::insertMediaFile(QString mediaFilePath, bool returnUrlOnly); 12345678910# Example var markdown = script.insertMediaFile("/path/to/your/image.png"); 1You may want to take a look at the example scribble.qml (opens new window). # Inserting an attachment file into the attachments folder # Method call and parameters * QML wrapper to insert an attachment file into the `attachments` folder and * returning the attachment url or the markdown text of the attachment * relative to the current note * * @param {QString} attachmentFilePath * @param {QString} fileName to use in the markdown * @param {bool} returnUrlOnly if true only the attachment url will be returned * (default false) * @return {QString} the attachment markdown or url */ QString ScriptingService::insertAttachmentFile(const QString &attachmentFilePath, const QString &fileName, bool returnUrlOnly); 12345678910111213# Example var markdown = script.insertAttachmentFile("/path/to/your/file.png"); 1# Regenerating the note preview Refreshes the note preview. # Method call and parameters /** * Regenerates the note preview */ QString ScriptingService::regenerateNotePreview(); 1234# Example script.regenerateNotePreview(); 1You may want to take a look at the example scribble.qml (opens new window). # Registering a custom action # Method call and parameters /** * Registers a custom action * * @param identifier the identifier of the action * @param menuText the text shown in the menu * @param buttonText the text shown in the button * (no button will be viewed if empty) * @param icon the icon file path or the name of a freedesktop theme icon * you will find a list of icons here: * https://specifications.freedesktop.org/icon-naming-spec/icon-naming-spec-latest.html * @param useInNoteEditContextMenu if true use the action in the note edit * context menu (default: false) * @param hideButtonInToolbar if true the button will not be shown in the * custom action toolbar (default: false) * @param useInNoteListContextMenu if true use the action in the note list * context menu (default: false) */ void ScriptingService::registerCustomAction(QString identifier, QString menuText, QString buttonText, QString icon, bool useInNoteEditContextMenu, bool hideButtonInToolbar, bool useInNoteListContextMenu); 123456789101112131415161718192021222324TIP You can also assign local and global shortcuts to your custom actions in the Shortcuts settings. WARNING Keep in mind that freedesktop theme icons (opens new window) are mostly available only under Linux. So if you really want to use an icon under macOS or Windows you need to provide one with your script. To get the path of your script to set a proper path for your icon you can use the scriptDirPath property. # Example import QtQml 2.0 import QOwnNotesTypes 1.0 Script { /** * Initializes the custom actions */ function init() { // add a custom action without a button script.registerCustomAction("mycustomaction1", "Menu text"); // add a custom action with a button script.registerCustomAction("mycustomaction2", "Menu text", "Button text"); // add a custom action with a button and freedesktop theme icon script.registerCustomAction("mycustomaction3", "Menu text", "Button text", "task-new"); // add a custom action with a button and an icon from a file script.registerCustomAction("mycustomaction4", "Menu text", "Button text", "/usr/share/icons/breeze/actions/24/view-calendar-tasks.svg"); } /** * This function is invoked when a custom action is triggered * in the menu or via button * * @param identifier string the identifier defined in registerCustomAction */ function customActionInvoked(identifier) { switch (identifier) { case "mycustomaction1": script.log("Action 1"); break; case "mycustomaction2": script.log("Action 2"); break; case "mycustomaction3": script.log("Action 3"); break; case "mycustomaction4": script.log("Action 4"); break; } } } 1234567891011121314151617181920212223242526272829303132333435363738394041424344For some more examples please see custom-actions.qml (opens new window). TIP You can also trigger a custom action after the application was started with the parameter --action customAction_<identifier>. For more information please take a look at Trigger menu actions after startup. # Registering a label # Method call and parameters /** * Registers a label to write to * * @param identifier the identifier of the label * @param text the text shown in the label (optional) */ void ScriptingService::registerLabel(QString identifier, QString text); 1234567# Example script.registerLabel("html-label", "<strong>Strong</strong> HTML text<br />with three lines<br />and a <a href='https://www.qownnotes.org'>link to a website</a>."); script.registerLabel("long-label", "another very long text, another very long text, another very long text, another very long text, another very long text, another very long text, another very long text, another very long text, another very long text, another very long text, another very long text that will wrap"); script.registerLabel("counter-label"); 12345The labels will be visible in the Scripting panel, which you need to enable in the Window / Panels menu. You can use both plain text or html in the labels. The text will be selectable and links can be clicked. You may then want to take a look at the example script scripting-label-demo.qml (opens new window). # Setting the text of a registered label # Method call and parameters /** * Sets the text of a registered label * * @param identifier the identifier of the label * @param text the text shown in the label */ void ScriptingService::setLabelText(QString identifier, QString text); 1234567# Example script.setLabelText("counter-label", "counter text"); 1You can use both plain text or html in the labels. The text will be selectable and links can be clicked. You may then want to take a look at the example script scripting-label-demo.qml (opens new window). TIP The scripting label also supports external links, as well as internal links to notes, tasks, deck cards and more. You might get a grasp of what's supported by taking a look at URL handling (opens new window). # Creating a new note # Method call and parameters /** * Creates a new note * * @param text the note text */ void ScriptingService::createNote(QString text); 123456# Example script.createNote("My note headline\n===\n\nMy text"); 1You may want to take a look at the example custom-actions.qml (opens new window). TIP If you turned off that your note headline determines the note filename then you have to rename your note file yourself afterward, like this: var note = script.currentNote(); note.renameNoteFile('your-filename'); 12 # Accessing the clipboard # Method call and parameters /** * Returns the content of the clipboard as text or html * * @param asHtml returns the clipboard content as html instead of text */ QString ScriptingService::clipboard(bool asHtml); 123456# Example var clipboardText = script.clipboard(); var clipboardHtml = script.clipboard(true); 12You may want to take a look at the example custom-actions.qml (opens new window). # Write text to the note text edit # Method call and parameters /** * Writes text to the current cursor position in the note text edit * * @param text */ void ScriptingService::noteTextEditWrite(QString text); 123456# Example // write text to the note text edit script.noteTextEditWrite("My custom text"); 12You might want to look at the custom action transformTextRot13 in the example custom-actions.qml (opens new window). You can use this together with noteTextEditSelectAll to overwrite the whole text of the current note. # Read the selected text in the note text edit # Method call and parameters /** * Reads the selected text in the note text edit * * @return */ QString ScriptingService::noteTextEditSelectedText(); 123456# Example // read the selected text from the note text edit var text = script.noteTextEditSelectedText(); 12You might want to look at the custom action transformTextRot13 in the example custom-actions.qml (opens new window). # Select all text in the note text edit # Method call and parameters /** * Selects all text in the note text edit */ void ScriptingService::noteTextEditSelectAll(); 1234# Example script.noteTextEditSelectAll(); 1You can use this together with noteTextEditWrite to overwrite the whole text of the current note. # Select the current line in the note text edit # Method call and parameters /** * Selects the current line in the note text edit */ void ScriptingService::noteTextEditSelectCurrentLine(); 1234# Example script.noteTextEditSelectCurrentLine(); 1# Select the current word in the note text edit # Method call and parameters /** * Selects the current word in the note text edit */ void ScriptingService::noteTextEditSelectCurrentWord(); 1234# Example script.noteTextEditSelectCurrentWord(); 1# Set the currently selected text in the note text edit # Method call and parameters /** * Sets the currently selected text in the note text edit * * @param start * @param end */ void ScriptingService::noteTextEditSetSelection(int start, int end); 1234567# Example // expands the current selection by one character script.noteTextEditSetSelection( script.noteTextEditSelectionStart() - 1, script.noteTextEditSelectionEnd() + 1); 1234# Get the start position of the current selection in the note text edit # Method call and parameters /** * Returns the start position of the current selection in the note text edit */ int ScriptingService::noteTextEditSelectionStart(); 1234# Example script.log(script.noteTextEditSelectionStart()); 1# Get the end position of the current selection in the note text edit # Method call and parameters /** * Returns the end position of the current selection in the note text edit */ int ScriptingService::noteTextEditSelectionEnd(); 1234# Example script.log(script.noteTextEditSelectionEnd()); 1# Set the text cursor in the note text edit to a certain position # Method call and parameters /** * Sets the text cursor in the note text edit to a certain position * 0 would be the beginning of the note * special case: -1 would be the end of the note * * @param position */ void ScriptingService::noteTextEditSetCursorPosition(int position); 12345678# Example // jump t'''
