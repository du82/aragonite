title = "مدير قصاصات سطر الأوامر | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = '''# مدير قصاصات سطر الأوامر يمكنك استخدام مدير قصاصات سطر أوامر QOwnNotes (opens new window) من أجل تنفيذ قصاصات الأوامر المخزنة في الملاحظات في QOwnNotes من سطر الأوامر. يمكنك استخدام ملاحظات بوسم خاص لتخزين قصاصات الأوامر، والتي يمكنك تنفيذها من مدير قصاصات سطر الأوامر. # التثبيت قم بزيارة صفحة الإصدارة الأخيرة (opens new window) وقم بتنزيل النسخة التي تريدها. TIP إذا كان jq (opens new window) مثبتا على جهازك، يمكنك أيضا استخدام هذه القصاصة لتنزيل وتثبيت مثلا النسخة الأخيرة من AppImage لمعمارية AMD64 من لينكس إلى ‪/usr/local/bin/qc‬: curl https://api.github.com/repos/qownnotes/qc/releases/latest | \ jq '.assets[] | select(.browser_download_url | endswith("_linux_amd64.tar.gz")) | .browser_download_url' | \ xargs curl -Lo /tmp/qc.tar.gz && \ tar xfz /tmp/qc.tar.gz -C /tmp && \ rm /tmp/qc.tar.gz && \ sudo mv /tmp/qc /usr/local/bin/qc && \ /usr/local/bin/qc --version 1234567 # الاعتماديات للبحث عن أوامر من سطر الأوامر، تحتاج إلى تثبيت fzf (opens new window) (للبحث الضبابي، أي التقريبي) أو peco (opens new window) (أقدم، لكن احتمال كونه مثبتا بشكل افتراضي أكبر). TIP بشكل افتراضي، fzf هو المستخدم في البحث، لكن يمكنك استخدام peco بضبطه باستخدام qc configure. # التثبيت قبل أن تستخدم مدير القصاصات عليك تفعيل خادم Web socket (2) في شاشة إعدادات إضافة المتصفح وقصاصات الأوامر (1) في QOwnNotes. ثم يجب عليك إظهار رمز الأمان (3) ونسخه (4). الآن افتح ملف إعداد مدير القصاصات باستخدام: # إعداد مدير القصاصات qc configure 12ثم ضع رمز الأمان في خاصية token: [QOwnNotes] token = "رمز الأمان الخاص بك هنا" 12::: تلميح داخل إعدادات QOwnNotes بإمكانك أيضا وضع وسم الملاحظة الذي يجب إستعماله من أجل البحث عن الأوامر داخل الملاحظات. بشكل تلقائي يتم إستعمال الوسم commands. ::: # صيغة قصاصات الأوامر يمكنك استخدام قائمة منقوطة عناصرها أكواد مضمّنة في السطر لتخزين قصاصات الأوامر. سيتم البحث عن قصاصات الأوامر في جميع الملاحظات الموسومة بالوسم commands. وإذا أضفت cmd: قبل الكود المضمّن في السطر، فإنك ستجده أيضا في الملاحظة الحالية بغض النظر عن وسوم الملاحظة. - `echo I am a command` I am a description #tag1 #tag2 #tag3 * `echo I am also a command` I am a description #tag3 #tag4 #tag5 - cmd: `echo I will be found in the current note` This command will be found in the current note regardless of note tags <!-- Example for asking for user input --> - `read -p "PR ID: " id && git fetch origin pull/$id/head:pull-$id && git checkout pull-$id` Ask for pull request ID and checkout pull request 1234567يمكن استخدام **كتل أكواد bash أو shell ** لقصاصات الأوامر، على أن تُسبق بعنوان من المستوى الثاني أو أعلى، والذي سيستخدم لوصفها. الوسوم مدعومة إذا كانت بين العنوان وكتلة الكود. ## افعل شيئا بكتلة كود باش: bash - سيتم تجاهل هذا النص - لكن يمكن استخدام الوسوم: #وسم١ #وسم٢ ```bash echo do this echo do that ``` ## افعل شيئا آخر بكتلة كود شل: sh ```sh echo do something else echo do something other ``` سيُنتج هذا المثال قصاصتي أوامر: أولاهما موسومة بالوسمين وسم١ و وسم٢. # الاستخدام # ابحث عن قصاصات أوامر ونفذها qc exec 12# ابحث عن قصاصات أوامر واعرضها qc search 12# التهيئة نفّذ qc configure. [General] editor = "vim" # محرر النصوص المفضل لديك column = 40 # عرض العمود في أمر السرد selectcmd = "fzf" # برنامج التحديد من أجل أمر التحرير (fzf أو peco) sortby = "" # تعيين طريقة ترتيب القصاصات؛ القيم المقبولة هي: # recency = بالأحدث (القيمة الافتراضية) # -recency = بالأحدث، ترتيب عكسي # description = بالوصف # -description = بالوصف، ترتيب عكسي # command = بالأمر # -command = بالأمر، ترتيب عكسي # output = بالناتج # -output = بالناتج، ترتيب عكسي [QOwnNotes] token = "MvTagHXF" # رمز الأمان websocket_port = 22222 # منفذ مقبس الويب في التطبيق 1234567891011121314151617# إكمال الصَدفة يمكنك توليد كود إكمال الصدفة المناسب لصدفتك بالأمر qc completion <اسم_صدفتك>. مثلا لصدفة Fish، يمكنك تنفيذ الأمر: qc completion fish > ~/.config/fish/completions/qc.fish 1 ساعدنا في تحسين هذه الصفحة! (opens new window) ← إضافة المتصفح رفيقة ويب QOwnNotes تطبيق ويب QOwnNotes → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!'''
