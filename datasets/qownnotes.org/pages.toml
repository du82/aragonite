full_description = 'QOwnNotes Nextcloud / ownCloud 통합을 통한 무료 오픈 소스 일반 텍스트 파일 마크다운 노트 생성 빠른 시작 → 노트 소유 모든 노트는 "벤더 잠금"이 아닌 일반 텍스트 마크다운 파일로 컴퓨터에 저장됩니다. Nextcloud와 같은 동기화 서비스를 사용하여 장치 간에 노트를 동기화합니다.작은 설치 공간 속도에 최적화되고 프로세서 및 메모리 리소스를 거의 사용하지 않는 기본 응용 프로그램입니다.사용자 정의 사용자 정의 및 스크립트화가 가능한 기능을 통해 노트 작업 방법을 제어할 수 있습니다. RSS 블로그 RSS 릴리스 How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know! Patrizio Bekerle이 ❤️으로 제작했으며, 비너스걸이 한국어 번역을 했습니다.'
