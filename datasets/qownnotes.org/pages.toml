title = "التثبيت على فيدورا | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = '# التثبيت على فيدورا توجد مستودعات QOwnNotes لتوزيعة فيدورا 28 والأحدث. TIP يتوفر QOwnNotes في مستودعات فيدورا (opens new window). لكن النسخة المتاحة فيها غالبا تكون أقدم رقعةً أو رقعتين من نسخة المستودع المتاحة عبر الشرح التالي. يمكن لمعظم المستخدمين أن ينفذوا الأمر dnf install qownnotes في الطرفية. أما إذا أردت أحدث نسخة مطلقًا، فرجاءً تابع القراءة. # على الأنظمة ذات إضافة config-manager لـ dnf نفّذ الأمر التالي في الطرفية بصلاحيات الجذر لإضافة المستودع. dnf config-manager --add-repo http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Fedora_\$releasever/ dnf makecache dnf install qownnotes 1234TIP ربما تحتاج إلى قبول مفتاح المستودع قبل التنزيل منه. إذا واجهت مشاكل، يمكنك استيراد المفتاح يدويا بالأمر: rpm --import http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Fedora_40/repodata/repomd.xml.key 1لاحظ أن "Fedora_40" في الأمر السابق يجب أن تغيّرها إلى ما يناسب نسخة توزيعتك (أي "Fedora_39" أو "Fedora_38" إلخ). # على الأنظمة الأقدم استعمل هذه الطريقة إذا كانت نسختك من فيدورا لا تدعم إضافة config-manager لـ dnf. نفّذ الأمر التالي في الطرفية بصلاحيات الجذر لاستيثاق المستودع. rpm --import http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Fedora_40/repodata/repomd.xml.key 1مجددا، لاحظ أن "Fedora_40" في الأمر السابق يجب أن تغيّرها إلى ما يناسب نسخة توزيعتك (أي "Fedora_39" أو "Fedora_38" إلخ). ثم نفّذ الأوامر التالية في الطرفية بصلاحيات الجذر لإضافة المستودع وتثبيت QOwnNotes منه. cat > /etc/yum.repos.d/QOwnNotes.repo << EOL [qownnotes] name=OBS repo for QOwnNotes (Fedora \$releasever - \$basearch) type=rpm-md baseurl=http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Fedora_\$releasever/ gpgcheck=1 gpgkey=http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Fedora_\$releasever/repodata/repomd.xml.key enabled=1 EOL dnf clean expire-cache dnf install qownnotes 123456789101112تنزيل مباشر (opens new window) (هذا الرابط مثال على فيدورا 40) # ملاحظات بخصوص ترقية QOwnNotes على فيدورا # مشاكل مع مفاتيح GPG؟ التغيير في سياسات فيدورا الأمنية قد يعني أن مفاتيح المستودع «القديمة» (أي المنتهية) لا تُمدّ آليًّا. هذا قد يعرقل ترقية QOwnNotes. التفصيل: إذا واجهت مشكلة مع المفاتيح التالفة (أيْ أخطاء GPG) بسبب انتهاء المفتاح، مثل certificate is not alive أو key is not alive أو كليهما، فإن تنفيذ هذا الأمر في الطرفية سيحذف المفتاح المنتهي: sudo rpm -e $(rpm -q --qf "%{NAME}-%{VERSION}-%{RELEASE}\t%{SUMMARY}\n" gpg-pubkey | grep pbek | cut -f1) 1ستجد شرحًا مفصلًا لهذا الأمر في نقاش على GitHub (opens new window) بخصوص هذه العلة نفسها. ما إن تحذف المفتاح المنتهي، عليك أن تستورد يدويًّا المفتاح الحالي من جديد بالطريقة الموصوفة في أول هذا الشرح. ساعدنا في تحسين هذه الصفحة! (opens new window) ← التثبيت على openSUSE Linux التثبيت كحزمة Snap → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!'
