["https://qownnotes.org/nl/getting-started/importing-notes.html"]
title = "Notities importeren | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# Notities importeren # Evernote Er is een Evernote-importdialoog welke u kunt bereiken in het menu Notitie / Importeren om * Enex* -bestanden te importeren. Afbeeldingen, bijlagen, labels, basisopmaak en metagegevens worden ook geïmporteerd. # Joplin Er is een Joplin-importdialoog welke u kunt bereiken in het menu Notitie / Importeren. # Verschillende formaten De opdrachtregel jimmy (opens new window) kan verschillende formaten converteren naar Markdown (zoals Google Keep (opens new window), Synology Note Station (opens new window) en meer (opens new window)). Om zoveel mogelijk metadata te behouden, is het raadzaam om extra aanpassingen (opens new window) toe te passen. Als er problemen zijn met de conversie, open dan gerust een ticket op GitHub (opens new window). # Google Keep Download Keep-taken met Google Takeout Archief uitpakken Download keep_to_markdown.py naar map naast map met uitgepakte Keep-taken python keep_to_markdown.py Keep out/ Vervang Keep door de map met notities in JSON-formaat. De out-map wordt aangemaakt als deze niet bestaat. Van https://gitlab.com/-/snippets/2002921 (opens new window) # Tomboy U kunt uw Tomboy-notities importeren met een script genaamd Trombone (opens new window). U kunt python2 installeren om het script te laten werken. Het converteert uw Tomboy-notities naar een Evernote .enex -bestand die u vervolgens kunt importeren in QOwnNotes. Voor iedereen die dit wil doen, zorg er eerst voor dat Python2 is geïnstalleerd en u zou ook python-is-python2 kunnen installeren (dit kan later verwijderd worden). Dit kan gemakkelijker/veiliger zijn in een chroot- of Docker-container, als u die mogelijkheid hebt (wordt hier later gedocumenteerd). sudo apt install python2 python-is-python2 1Download het trombone-bestand van GitHub, pak het uit en navigeer naar die map: cd ~/Downloads/trombone-master sudo make sudo make install 1234cd vervolgens naar de map waar zich de tomboy-notities bevinden: cd ~/.local/share/tomboy/ 1Voer dan dit uit: find ./ -type f -name '*.note' -print0 | xargs -0 trombone > EXPORT.enex 1Treden er unicode-fouten op bij specifieke notities? Verwijder dan gewoon elke notitie en voer de conversie opnieuw uit totdat deze het bericht geeft Opslaan... . Dit levert een bestand met de naam EXPORT.enex dat vervolgens in QOwnNotes kan worden geïmporteerd. Tijdens de import in QOwnNotes kunt u alle te importeren attributen uitschakelen, behalve misschien de aanmaak-/wijzigingsdatum, aangezien Tomboy die kenmerken niet ondersteunt. Help ons deze pagina te verbeteren! (opens new window) ← Markdown Opdrachtregel-interface-parameters → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
year_published = 2025
