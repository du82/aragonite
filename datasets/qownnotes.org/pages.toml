title = "Tastaturbefehle | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# Tastaturbefehle # Linux / Windows # Im Hauptfenster Strg + N erstellt eine neue Notiz mit dem aktuellen Datum und der aktuellen Uhrzeit im Namen Strg + ⇧ Umschalt + N erstellt eine neue Notiz in einem neuen Tab Mit Strg + ⇧ Umschalt + F können Sie nach Notizen suchen (im Namen der Notiz und ihren Inhalten) Mit Alt + F können Sie in allen Schlagwörtern / Unterordnern nach Notizen suchen Alt + ⇧ Umschalt + P wechselt zum vorherigen Arbeitsbereich Strg + ⇧ Umschalt + E bearbeitet eine verschlüsselte Notiz Alt + R entfernt die aktuelle Notiz Alt + ⇧ Umschalt + U sucht nach Updates Strg + ⇧ Umschalt + T öffnet die To-do-Liste Strg + ⇧ Umschalt + O öffnet die aktuelle Notiz in einem externen Editor Alt + ⇧ Umschalt + O öffnet die aktuelle Notiz in einer Ansicht Alt + ⇧ Umschalt + F zeigt die aktuelle Notiz im Datei-Explorer Alt + ⇧ Umschalt + E aktiviert oder deaktiviert die Bearbeitung von Notizen Alt + Up jumps to the previous visible note Alt + Pfeil nach unten springt zur nächsten sichtbaren Notiz Alt + Bild nach oben springt zum vorherigen Notiz-Tab Alt + Bild nach unten springt zum nächsten Notiz-Tab Strg + W schließt den aktuellen Notiz-Tab Strg + ⇧ Umschalt + D schaltet den ablenkungsfreien Modus an/ab Sie können ihn auch mit Esc schließen Strg + P druckt die aktuelle Notiz als Text aus Strg + ⇧ Umschalt + P druckt die aktuelle Notiz als Markdown Strg + ⇧ Umschalt + V fügt Notizen, Bilder und HTML aus der Zwischenablage ein Strg + , öffnet die Einstellungen Alt + ⇧ Umschalt + A fügt einer Notiz ein neues Schlagwort hinzu Strg + ⇧ Umschalt + R lädt den aktuellen Notizordner neu Strg + Alt + F erlaubt Ihnen einen anderen Notizordner auszuwählen Strg + ⇧ Umschalt + S lädt die Skript-Engine neu Strg + ⇧ Umschalt + M verbirgt oder zeigt die Hauptmenüleiste Strg + ⇧ Umschalt + A lässt Sie nach Aktionen suchen Strg + S speichert geänderte Notizen manuell Alt + ⇧ Umschalt + I öffnet den Skript-Repository-Dialog F4 springt zum Notizbearbeitungsfeld F5 springt zur Notizenliste F6 springt zum Unterordnerfenster für Notizen F7 springt zum Schlagwort-Bedienfeld F8 springt zum Navigationsbereich F10 aktiviert das Kontextmenü des aktuellen Widgets F11 schaltet den Vollbildmodus um Alt + ⇧ Umschalt + H kopiert die Überschrift der aktuellen Notiz # In der Notizsuchleiste Pfeil nach unten oder Tab legt den Fokus auf die Notizenliste Eingabe erstellt eine neue Notiz mit dem Text aus der Suchleiste als Überschrift # In der Notizliste Doppelklicken Sie auf die Notiz, um die Notiz in einem neuen Tab zu öffnen (beachten Sie, dass es einen Skript-Hook gibt, der die Doppelklickaktion überschreiben kann) Strg + A wählt alle Notizen aus (um sie mit einem Rechtsklick zu verschieben, zu kopieren oder zu entfernen) Mit Tab oder Enter können Sie die aktuelle Notiz bearbeiten # Im Notiztext-Bearbeitungsfeld Strg + Klicken Sie auf einen Link, um ihn zu öffnen Mit Strg + F können Sie in der aktuellen Notiz suchen verwenden Sie dazu die Tasten Pfeil nach oben und Pfeil nach unten oder F3 und ⇧ Umschalt + F3 um zum vorherigen und nächsten Element zu springen Esc schließt die Suchleiste Mit Strg + R können Sie in der aktuellen Notiz suchen und ersetzen Strg + D dupliziert die aktuelle Zeile oder den ausgewählten Text Strg + Alt + Pfeil nach unten macht dasselbe Alt + Rücktaste löscht die aktuelle Zeile Strg + Rücktaste löscht das aktuelle Wort Strg + L öffnet einen Dialog zum Hinzufügen eines Textlinks (funktioniert auch bei markiertem Text) Strg + ⇧ Umschalt + L öffnet einen Dialog zum Hinzufügen eines Notizlinks Strg + T fügt das aktuelle Datum und die Uhrzeit in einem benutzerspezifischen Format ein Strg + ⇧ Umschalt + I fügt ein Bild ein (das Bild wird in den Ordner media im aktuellen Notizenordner kopiert.) Strg + ⇧ Umschalt + X fügt einen Anhang ein (die Datei wird in den Ordner attachments im aktuellen Notizenordner kopiert) Alt + ⇧ Umschalt + T fügt eine Tabelle ein Strg + ⇧ Umschalt + C fügt an der aktuellen Position einen Codeblock ein Strg + ⇧ Umschalt + B fügt an der aktuellen Position ein Blockzitat ein Strg + B formatiert den ausgewählten Text fett Strg + I formatiert den ausgewählten Text kursiv Strg + U formatiert den ausgewählten Text unterstrichen Alt + ⇧ Umschalt + S streicht den markierten Text durch Strg + ⇧ Umschalt + U blättert durch die Groß- und Kleinschreibung des ausgewählten Textes Tab rückt den ausgewählten Text ein (funktioniert auch für mehrere Zeilen) ⇧ Umschalt + Tab hebt die Einrückung für den ausgewählten Text auf Tab rückt das Listenelement nach einem ungeordneten Listenzeichen ein ⇧ Umschalt + Tab hebt das Listenelement nach einem ungeordneten Listenzeichen auf Enter in Listen erstellt ein neues Listenelement Alt + Pfeil nach links springt im Notizverlauf ein Element zurück Alt + Pfeil nach rechts springt im Notizverlauf ein Element vorwärts Strg + ⇧ Umschalt + 1..9 setzt ein Notiz-Lesezeichen auf den Lesezeichen-Slot 1..9 Strg + 1..9 springt zum Notiz-Lesezeichen auf Lesezeichenplatz 1..9 Strg + + vergrößert den Notiztext um einen Punkt Strg + - verringert die Schriftgröße des Notiztextes um einen Punkt Strg + 0 setzt die Schriftgröße des Notiztextes zurück Strg + Leertaste versucht, einfache Gleichungen wie (4+5)*3= vor dem Cursor zu lösen, vervollständigt Text automatisch oder öffnet URLs Strg + ⇧ Umschalt + H fügt eine Überschrift aus dem Dateinamen der Notiz oben in der Notiz ein Alt + ⇧ Umschalt + X teilt die aktuelle Notiz an der aktuellen Cursorposition in zwei Notizen auf Alt + ⇧ Umschalt + W sucht im Web nach dem ausgewählten Text Strg + Pfeil nach oben scrollt den Inhalt nach oben Strg + Pfeil nach unten scrollt den Inhalt nach unten Strg + ⇧ Umschalt + Pfeil nach unten verschiebt die aktuelle Zeile nach unten Strg + ⇧ Umschalt + Pfeil nach oben verschiebt die aktuelle Zeile nach oben ⇧ Umschalt + Enter fügt zwei Leerzeichen und ein Zeilenumbruchzeichen hinzu, um einen Markdown-Zeilenumbruch zu erzwingen # In der Notizvorschau Mit Strg + F können Sie in