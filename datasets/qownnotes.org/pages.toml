["https://qownnotes.org/fa/getting-started/web-app.html"]
title = "برنامه تحت وب QOwnNotes | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# برنامه تحت وب QOwnNotes شما می توانید تصاویر تلفن همراه خود را در یادداشت کنونی QOwnNotes در دسکتاپ خود از طریق برنامه تحت وب در app.qownnotes.org (opens new window) درج کنید. برنامه تحت وب در تلفن شما از طریق اینترنت با برنامه دسکتاپ QOwnNotes ارتباط برقرار می کند. ارتباط بین QOwnNotes و خدمات وب به صورت انتقال رمزنگاری شده می باشد. هیچ تصویری در سرور ذخیره نمی شود. There is a settings page Web application to add support for the web application. به خاطر داشته باشید که از توکن مخفی خود از صفحه تنظیمات QOwnNotes به app.qownnotes.org (opens new window) رونوشت برداری کنید تا قادر به برقراری ارتباط با طرح مقطعی خود در QOwnNotes باشید. شما همچنین می توانید توکن را با تلفن خود در برنامه تحت وب از کیو آر کد اسکن کنید. شما می توانید کد منبع برنامه تحت وب را در web-app on GitHub (opens new window) بیابید. شما همچنین قادر به میزبانی از این سرویس تحت وب هستید. تصاویر داکر تازه ساخته شده در qownnotes-web-app on DockerHub (opens new window)موجود می باشد. در اصلاح این صفحه ما را یاری کنید! (opens new window) ← مدیر تکه کد خط فرمان برنامه نکست کلود QOwnNotesAPI → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
