title = "التثبيت على أوبنتو وإلمنتري ولينكس منت | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = '''# التثبيت على أوبنتو وإلمنتري ولينكس منت # أوبنتو 18.04 أو أحدث، إلمنتري، أو لينكس منت 18 أو أحدث قم بتثبيت QOwnNotes على أوبنتو (نسخة 18.04 على الأقل) باستخدام المستودع الشخصي (PPA). لاحظ أن المستودع به أيضا حزم لمعمارية ARM، إذا أردت استخدام QOwnNotes على Raspberry Pi. افتح طرفية، وأدخل السطور التالية فيها لإضافة المستودع وتثبيت QOwnNotes. sudo add-apt-repository ppa:pbek/qownnotes sudo apt-get update sudo apt-get install qownnotes 123تنزيل مباشر (opens new window) # معاينة نسخة Qt6 من QOwnNotes إذا أردت تجربة حزم Qt6 وكنت تستخدم أوبنتو 22.04 أو أحدث، يمكنك استخدام هذا المستودع: # أزل المستودع الشخصي الخاص بنسخة كيوت 5 إذا كان لديك sudo add-apt-repository --remove ppa:pbek/qownnotes # أضف المستدوع الشخصي الخاص بنسخة كيوت 6 sudo add-apt-repository ppa:pbek/qownnotes-qt6 # وأخيرا تثبيت QOwnNotes sudo apt-get update sudo apt-get install qownnotes 123456789تنزيل مباشر (opens new window) إذا وجدت أي مشاكل، رجاءً أبلغ عنها على صفحة مسائل QOwnNotes على GitHub (opens new window)! # النسخ الأقدم من أوبنتو ومشتقاتها الأفضل تجربة استخدام الـ AppImage من إصدارات QOwnNotes على GitHub (opens new window). عندئذٍ يمكنك جعل الملف قابلا للتنفيذ: chmod a+x QOwnNotes-*.AppImage 1بعدئذٍ ستتمكن من تنفيذ الـ AppImage لتشغيل QOwnNotes. # مستودع OBS ربما تستطيع أيضا استخدام QOwnNotes على نسخ أوبنتو التي لم تعد تستقبل تحديثات في المستودع الشخصي، باستخدام مستودعات Open Build Service (opens new window). إليك أمثلة على استخدام مستودع xUbuntu 20.04. نفّذ الأمر التالي في الطرفية لاستيثاق المستودع. wget http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/xUbuntu_20.04/Release.key -O - | sudo apt-key add - 1نفّذ الأوامر التالية في الطرفية لإضافة المستودع وتثبيت QOwnNotes منه. sudo su - sh -c "echo 'deb http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/xUbuntu_20.04/ /' >> /etc/apt/sources.list.d/qownnotes.list" apt-get update apt-get install qownnotes 1234تنزيل مباشر (opens new window) ساعدنا في تحسين هذه الصفحة! (opens new window) ← التثبيت التثبيت على ميكروسوفت ويندوز → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!'''
year_published = 2025
