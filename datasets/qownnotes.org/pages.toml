title = "App QOwnNotesAPI Nextcloud | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# App QOwnNotesAPI Nextcloud QOwnNotesAPI (opens new window) peut gérer l'accès aux notes mises à la corbeille et aux notes de versions pour vous. TIP Vous pouvez activer QOwnNotesAPI directement dans votre instance Nextcloud ou ownCloud en recherchant qownnotes sur la page Apps de votre serveur à l'adresse https://<your-cloud-domain>/settings/apps. Page des Apps de Nextcloud (opens new window) page des Apps d'ownCloud (opens new window) Le partage des notes se fait via l'API fournie par Nextcloud / ownCloud. L'accès aux tâches se fait directement via CalDAV. TIP Utilisez votre client de synchronisation Nextcloud / ownCloud pour synchroniser vos notes qui sont de simples fichiers Markdown. Il n'est pas nécessaire de réinventer la roue. Et il y a aussi des personnes qui utilisent différents services pour synchroniser leurs fichiers de notes (comme Dropbox, Syncthing ou Resilio Sync). # Ce que fait QOwnNotesAPI Accéder à vos notes dans la corbeille Accéder à vos versions de notes # Ce que QOwnNotesAPI ne fait pas Synchroniser vos notes (veuillez utiliser votre client de synchronisation ownCloud / Nextcloud) Partager des notes (ceci se fait directement via l'API ownCloud / Nextcloud) Accéder à des images depuis Nextcloud Text (opens new window) (cela se fait directement via l'API Nextcloud) Aidez-nous à améliorer ce site! (opens new window) ← Application Web QOwnNotes Recherche de notes → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
