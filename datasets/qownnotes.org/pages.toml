["https://qownnotes.org/getting-started/git-versioning.html"]
title = "Git versioning | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = '''# Git versioning You can set up QOwnNotes to automatically commit changes in your note folder locally to a git repository in your note folder. This can be done in the Git versioning settings in the General settings. You need to have git installed on your system and the git executable needs to be in your PATH or you can set the path to the git executable in the Git versioning settings. You also need to turn on git support for each note folder you want to use git versioning with! TIP Don't forget to set your git username and email address in the terminal: git config --global user.email "[email protected]" git config --global user.name "Your name" 12 Help us improve this page! (opens new window) ← Shortcuts Installation → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!'''
