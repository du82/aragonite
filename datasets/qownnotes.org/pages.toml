["https://qownnotes.org/es/getting-started/overview.html"]
title = "Descripción general | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# Descripción general Edite sus notas con resaltado de Markdown, etiquetas de colores y subcarpetas Q es por el framework Qt (opens new window) que se utiliza Own es debido a que es dueño de sus propias notas Notes es por las notas que redacta QOwnNotes (opens new window) es la aplicación de bloc de notas en formato Markdown en archivos de texto plano de código abierto (GPL) para GNU/Linux, macOS y Windows, que (opcionalmente) funciona junto a las aplicaciones de notas (opens new window) de Nextcloud (opens new window) y ownCloud (opens new window). TIP Únase a nuestro Telegram Group (opens new window) para discutir, aprender y conectarse con la comunidad de QOwnNotes. Comprender el concepto de QOwnNotes # Características Puede usar sus archivos de texto o markdown existentes, sin necesidad de importarlos QOwnNotes está escrito en C ++ y optimizado para bajo consumo de recursos (sin CPU y aplicación de Electron que consume mucha memoria) Importación de Evernote y Joplin Compatible con la aplicación de notas (opens new window) de Nextcloud / ownCloud, las versiones móviles y Nextcloud Text Cree tarjetas de Nextcloud Deck (opens new window) y enlácelas a sus notas Soporte para compartir notas en su servidor de ownCloud / Nextcloud Administre sus listas de elementos pendientes de Nextcloud / ownCloud (Nextcloud tasks o Tasks Plus / Calendar Plus) o use otro servidor de CalDAV con el cual sincronizar sus tareas Las versiones antiguas de sus notas pueden ser restauradas desde su servidor de Nextcloud / ownCloud Las notas en la papelera pueden ser restauradas desde su servidor de Nextcloud / ownCloud Los cambios externos de los archivos de notas son supervisados (las notas o la lista de notas se vuelven a cargar) Soporte para etiquetado jerárquico de notas y subcarpetas de notas Cifrado opcional de notas, AES-256 está integrado, o puede utilizar métodos de cifrado personalizados como Keybase.io (opens new window) (encryption-keybase.qml (opens new window)) o PGP (encryption-pgp.qml (opens new window)) La carpeta de notas se puede elegir libremente (se pueden utilizar múltiples carpetas de notas) Es posible buscar partes de palabras en las notas. Los resultados de la búsqueda se resaltan en las notas Extensión del navegador para agregar notas a partir del texto seleccionado, hacer capturas de pantalla o administrar sus marcadores Compatibilidad con revisores ortográficos Modo portátil para llevar consigo QOwnNotes en memorias USB Soporte de secuencias de órdenes y un repositorio de scripts (opens new window) en línea desde el que puede instalar scripts dentro de la aplicación Implementación de la API de finalización de OpenAI (opens new window) para su uso en scripts Modo Vim Aplicación web para insertar fotos desde su teléfono móvil en la nota actual en QOwnNotes en su escritorio # Apariencia Resaltado de Markdown de notas y un modo de vista previa de Markdown Soporte de tema de modo oscuro Soporte de temas para el resaltador de sintáxis de Markdown Todos los paneles pueden colocarse donde desee, incluso pueden flotar o apilar (totalmente acoplables) Soporte para iconos de tema de escritorio gratuito, puede usar QOwnNotes con sus iconos de escritorio nativos y con su tema de escritorio oscuro favorito Modo sin distracciones, Modo de pantalla completa y Modo de máquina de escribir Números de línea Las diferencias entre la nota actual y la nota modificada externamente se se muestran en un diálogo # Idioma Disponible en más de 60 idiomas diferentes como inglés, alemán, francés, polaco, chino, japonés, ruso, portugués, húngaro, holandés y español Su ayuda es muy apreciada para mejorar estas traducciones o para traducir QOwnNotes en más idiomas. ¡Ayúdanos a mejorar este sitio! (opens new window) Concepto → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
