["https://qownnotes.org/de/getting-started/markdown.html"]
title = "Markdown | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = '''# Markdown Dieses Markdown-Cheatsheet dient als Kurzreferenz und Beispiel für die Markdown-Syntax in QOwnNotes. # Überschriften Verwenden Sie Überschriften, um Ihre Texte zu strukturieren. # H1 ## H2 ### H3 #### H4 ##### H5 ###### H6 123456TIP Das Bedienfeld Navigation zeigt die Struktur Ihrer Überschriften. Alternativ für H1 und H2 eine unterstrichene Schriftweise: Alt-H1 ====== Alt-H2 ------ 12345TIP Standardmäßig erstellt QOwnNotes den Dateinamen einer Notiz aus der Überschrift 1 (h1). # Hervorhebung Hervorhebung durch "Kursivschrift", mit *Sternchen*. Starke Hervorhebung, auch: "fett", mit **Sternchen**. 123TIP Sie können die Tastenkombination Strg + B verwenden, um Text fett hervorzuheben, und Strg + I, um ihn kursiv hervorzuheben. # Unterstreichen Es gibt auch eine optionale Einstellung in den Vorschau-Einstellungen, um das Unterstreichen zu aktivieren. _unterstreichen_ 1TIP Sie können den Shortcut Strg + U verwenden, um einen Text zu unterstreichen. # Durchstreichen ~~durchstreichen~~ 1TIP Sie können den Shortcut Alt + Umschalt + S verwenden, um einen Text durchzustreichen. # Listen Es gibt viele Möglichkeiten, Listen zu erstellen. 1. Erster geordneter Listeneintrag 2. Ein weiterer Eintrag * Ungeordnete Unterliste. 1. Tatsächliche Zahlen spielen keine Rolle, nur dass es eine Zahl ist! 1. Geordnete Unterliste (funktioniert nur im Editor, nicht in der Vorschau) 4. Und noch ein Eintrag. * Ungeordnete Liste kann Sternchen verwenden - Oder Minusse + Oder Plusse 12345678910TIP Wenn Sie am Ende einer Liste die Enter -Taste drücken, wird ein neues Listenelement erstellt. # Links Zwei einfachere Verwendungen von Links ist das Verweisen auf Webseiten oder andere Notizen. Es gibt mehrere Arten, wie jeder dieser Links aussehen kann. # Externe Links [Ich bin ein inline-Link](https://www.google.com) [Ich bin ein inline-Link mit Titel](https://www.google.com "Google's Homepage") [Sie können Nummern für Referenzlink-Definitionen benutzen][1] Klartext URLs und URLs in spitzen Klammern werden in der Vorschau automatisch zu Links. http://www.example.com oder <http://www.example.com> [1]: https://www.qownnotes.org 12345678910# Interne Links [Ich verlinke zur Notiz Journal.md](Journal.md) <Journal.md> funktioniert ähnlich. 123TIP Sie können den shortcut Ctrl + L verwenden: Erstellen Sie Links zu Webseiten oder anderen Notizen. Wenn Sie Strg + Umschalt + X verwenden, wird ein Dialogfeld angezeigt, durch das Sie in Ihre Notiz Anhänge einfügen können. Sie können Strg + Leertaste drücken, während sich der Cursor auf einem Link in der Notizbearbeitung befindet, um dem Link zu folgen. # Lesezeichen Die von der QOwnNotes Web Companion-Browsererweiterung verwendeten Lesezeichen verwenden Links in Listen. - [Name der Webseite](https://www.example.com) #tag1 #tag2 eine Beschreibung und Schlagworte 1# Bilder Bilder können in QOwnNotes eingebettet werden. Sie werden in der Vorschau angezeigt. ![alternativer Text](media/my-image.jpg) 1TIP Sie können die Tastenkombination Strg + Umschalt + I verwenden, um ein Bild in eine Notiz einzufügen. Das Bild kann sich auch in der Zwischenablage befinden. Das Dialogfeld erkennt es und zeigt eine Vorschau an. Sie können ein Bild auch direkt aus der Zwischenablage mit Strg + Umschalt + V in Ihre Notiz einfügen. # Inline-Code und Code-Blöcke Inline `Code` hat `Backticks drumherum`. 1Sie können die Verknüpfung Strg + Umschalt + C für ausgewählten Inline-Text oder nur innerhalb von Text verwenden, um einen Inline-Codeblock zu erstellen. ::: Codeblocks sind entweder umschlossen von Zeilen mit drei Backticks, oder sind mit vier Leerzeichen eingerückt. # Code-Blöcke mit vier führenden Leerzeichen Fügen Sie vier Leerzeichen vor Ihrem Code hinzu, um ihn als Codeblock zu markieren. s = "Code mit Leerzeicheneinrückung" print s 12# Code-Blöcke mit Backticks Sie können auch drei Backticks verwenden, um einen Codeblock zu erstellen. ``` Code kommt hierher Code kommt hierher ``` 1234TIP Du kannst den shortcut Strg + Umschalt + C auf mehreren ausgewählten Textzeilen oder in einer leeren Zeile benutzen, um einen Codeblock zu generieren. # Backtick-Zaun mit Code-Hervorhebung Es gibt auch einige Syntaxhervorhebungen mit Codeblöcken in QOwnNotes. ```bash # Ich bin ein Kommentar cd Notes ``` 1234Momentan unterstützte Sprachen (und Codeblock Identifier) sind: BASh scripting, bash C, c C++, cpp C++, cxx C++, c++ C#, c# CMake, cmake C#, csharp CSS, css Go, go HTML, html INI, ini Java, java JavaScript, javascript JavaScript, js JSON, json Makefile, make PHP, php Python, py Python, python QML, qml Rust, rust Shell scripting, sh SQL, sql TypeScript, ts TypeScript, typescript V, v Vex, vex XML, xml YAML, yml YAML, yaml # Tabellen Tabellen sind nicht Teil vom Kern-Markdown, aber QOwnNotes unterstützt sie. Doppelpunkte können zum Ausrichten von Spalten verwendet werden. | Tabellen | Sind | Cool | | ------------- |:-------------:| -----:| | Spalte 3 ist | rechtsbündig | $1600 | | Spalte 3 ist | zentriert | $12 | | Zebrastreifen | sind toll | $1 | Die Kopfzeilen-Zellen müssen immer durch mindestens drei Bindestriche getrennt werden. Sie können auch inline-Markdown verwenden. | Markdown | Weniger | Hübsch | | --- | --- | --- | | *Rendert* | `immernoch` | **schön** | | 1 | 2 | 3 | 12345678910111213141516TIP Drücken Sie Alt + Umschalt + T, um ein Dialogfeld zu aktivieren, mit dem Sie Tabellen erstellen können. In diesem Dialog können Sie sogar CSV-Dateien importieren! Verwenden Sie Strg + Leertaste in einer Markdown-Tabelle, um sie automatisch zu formatieren. # Zitat-Blöcke > Blockzitate sind sehr nützlich, um Antworttext in E-Mails zu emulieren. > Diese Zeile ist Teil desselben Zitats. Zitatpause. > Das ist eine sehr lange Zeile, die nach einem Zeilenumbruch immer noch richtig zitiert wird. Oh Mann, lass uns weiter schreiben, um sicherzustellen, dass es lang genug ist, um tatsächlich für alle umgebrochen zu werden. Oh, Sie können **Markdown** in ein Blockquote *packen*. 123456TIP Sie können QOwnNotes anweisen, Blockzitate oder nur das Blockzitatzeichen in den Editoreinstellungen vollständig hervorzuheben Sie können die Verknüpfung Strg + Umschalt + B verwenden, um Text als Blockzitat zu markieren. # Horizontale Linie Es gibt drei Möglichkeiten, um eine horizontale Linie zu erhalten: Bindestriche, Sternchen oder Unterstriche. Drei oder mehr... Bindestriche --- Sternchen *** Unterstriche ___ 12345678910111213# Zeilenumbrüche Sie können einen Absatz zur einfacheren Bearbeitung in mehr als eine einzelne Zeile aufteilen, sie werden immer noch als ein einzelner Absatz ohne Unterbrechungen dargestellt. Sie können einen Zeilenumbruch innerhalb eines Absatzes erzwingen, indem Sie eine Zeile mit zwei Leerzeichen beenden. Sie können einen separaten Absatz erstellen, indem Sie ihn durch Leerzeilen abgrenzen. TIP Mit ⇧ Shift + Return können Sie zwei Leerzeichen und einen Zeilenumbruch eingeben. Hier ist eine Zeile für den Anfang. Diese Zeile ist von der vorherigen getrennt, weshalb sie ein *separater Absatz* ist. Diese Zeile fängt ebenfalls einen separaten Absatz an, aber... Diese Zeile wird nur durch zwei anhängende Leerzeichen und einen einzigen Zeilenumbruch getrennt, weshalb sie eine separate Zeile im *selben Absatz* ist. 123456TIP Nachgestellte Leerzeichen werden im Editor standardmäßig hervorgehoben. # Kommentare Kommentare werden in der Vorschau nicht angezeigt. [comment]: # (Dieser Kommentar erscheint nicht in der Vorschau) <!-- HTML Kommentare werden ebenfalls verborgen --> 123TIP Ein führender HTML-Kommentarblock in einer Notiz wird bei der automatischen Generierung von Notizdateinamen ebenfalls ignoriert. # Checkboxlisten Sie können einfache To-do-Listen mit Checkboxlisten erstellen. - [x] erledigt - [ ] to-do 12TIP Sie können Checkboxen in der Vorschau abhaken / aufheben. # Präambel In QOwnNotes können Sie eine Präambel (z.B. YAML) verwenden, um zusätzliche Metainformationen hinzuzufügen. Es wird nicht in der Vorschau angezeigt und stört die automatische Generierung von Notizendateinamen nicht. --- title: Irgendein Name description: Etwas Beschreibung --- # Notizkopfzeile beginnt hier Etwas Text 12345678Der Dateiname dieser Beispielnotiz würde lauten: Notizkopfzeile beginnt hier.md. Hilf uns diese Seite zu verbessern! (opens new window) ← QOwnNotes Demo Notizen importieren → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!'''
