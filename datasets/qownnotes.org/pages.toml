["https://qownnotes.org/ar/installation/opensuse.html"]
title = "التثبيت على openSUSE Linux | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# التثبيت على openSUSE Linux # جميع نسخ أوبن سوزي يمكنك تثبيت QOwnNotes باستخدام أداة مثبت حزم OBS (opens new window). نفّذ الأوامر التالية في الطرفية بصلاحيات الجذر لتثبيت opi: zypper install opi 1ثم ثبّت QOwnNotes باستخدامه: opi qownnotes 1WARNING ستسأل هذه الأداة خدمة OBS بكاملها، لذا تأكد من أن تختار qownnotes وليس qownnotes-lang إذا سئلت. تأكد أيضا من أن المستودع المختار هو الرسمي home:pbek:QOwnNotes وليس مستودع طرف ثالث. TIP تحتاج إلى تحديد خيار الإبقاء على المستودع بعد التثبيت للحصول على التحديثات. # openSUSE Leap 15.6 نفّذ الأوامر التالية في الطرفية بصلاحيات الجذر لإضافة المستودع وتثبيت QOwnNotes منه. zypper addrepo -f http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/15.6/home:pbek:QOwnNotes.repo zypper refresh zypper install qownnotes 123تنزيل مباشر (opens new window) # openSUSE Leap 15.5 نفّذ الأوامر التالية في الطرفية بصلاحيات الجذر لإضافة المستودع وتثبيت QOwnNotes منه. zypper addrepo -f http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/15.5/home:pbek:QOwnNotes.repo zypper refresh zypper install qownnotes 123تنزيل مباشر (opens new window) # openSUSE Leap 15.4 نفّذ الأوامر التالية في الطرفية بصلاحيات الجذر لإضافة المستودع وتثبيت QOwnNotes منه. zypper addrepo -f http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/15.4/home:pbek:QOwnNotes.repo zypper refresh zypper install qownnotes 123تنزيل مباشر (opens new window) # openSUSE Leap 15.3 نفّذ الأوامر التالية في الطرفية بصلاحيات الجذر لإضافة المستودع وتثبيت QOwnNotes منه. zypper addrepo -f http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/openSUSE_Leap_15.3/home:pbek:QOwnNotes.repo zypper refresh zypper install qownnotes 123تنزيل مباشر (opens new window) # openSUSE Leap 15.2 نفّذ الأوامر التالية في الطرفية بصلاحيات الجذر لإضافة المستودع وتثبيت QOwnNotes منه. zypper addrepo -f http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/openSUSE_Leap_15.2/home:pbek:QOwnNotes.repo zypper refresh zypper install qownnotes 123تنزيل مباشر (opens new window) # openSUSE Tumbleweed نفّذ الأوامر التالية في الطرفية بصلاحيات الجذر لإضافة المستودع وتثبيت QOwnNotes منه. zypper addrepo -f http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/openSUSE_Tumbleweed/home:pbek:QOwnNotes.repo zypper refresh zypper install qownnotes 123تنزيل مباشر (opens new window) # SLE 15 نفّذ الأوامر التالية في الطرفية بصلاحيات الجذر لإضافة المستودع وتثبيت QOwnNotes منه. zypper addrepo -f http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/SLE_15/home:pbek:QOwnNotes.repo zypper refresh zypper install qownnotes 123تنزيل مباشر (opens new window) ساعدنا في تحسين هذه الصفحة! (opens new window) ← التثبيت على دبيان التثبيت على فيدورا → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
