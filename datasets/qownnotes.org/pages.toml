["https://qownnotes.org/pl/getting-started/overview.html"]
title = "Przegląd | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# Przegląd Edytuj swoje notatki za pomocą podświetlania znaczników, kolorowych znaczników i podfolderów Q dla frameworka Qt (opens new window) używanego Own, ponieważ jesteś właścicielem własnych notatek Notes dotyczące notatek, które robisz QOwnNotes (opens new window) to open source (GPL) zwykły plik tekstowy notatka notowań aplikacja dla GNU / Linux, **macO ** i Windows, który (opcjonalnie) współpracuje z aplikacją do notatek (opens new window) z Nextcloud (opens new window) i ownCloud (opens new window). TIP Dołącz do naszej grupy telegramów (opens new window), aby dyskutować, uczyć się i łączyć ze społecznością QOwnNotes. Zrozum pojęcie QOwnNotes # Funkcje You can use your existing text or markdown files, no need for an import QOwnNotes jest napisany w C++ i zoptymalizowany pod kątem niskiego zużycia zasobów (bez aplikacji Electron, która wymaga dużej ilości procesora i pamięci) Import z Evernote i Joplin Compatible with the Notes (opens new window) application of Nextcloud / ownCloud and mobile and Nextcloud Text Create Nextcloud Deck (opens new window) cards and link to them in your notes Support for sharing notes on your ownCloud / Nextcloud server Manage your Nextcloud / ownCloud todo lists (Nextcloud tasks or Tasks Plus / Calendar Plus) or use another CalDAV server to sync your tasks to Older versions of your notes can be restored from your Nextcloud / ownCloud server Trashed notes can be restored from your Nextcloud / ownCloud server External changes of note files are watched (notes or note list are reloaded) Support for hierarchical note tagging and note subfolders Optional encryption of notes, AES-256 is built in, or you can use custom encryption methods like Keybase.io (opens new window) (encryption-keybase.qml (opens new window)) or PGP (encryption-pgp.qml (opens new window)) The notes folder can be freely chosen (multiple note folders can be used) Searching parts of words in notes is possible and search results are highlighted in the notes Browser extension to add notes from the selected text, make screenshots or manage your bookmarks Spellchecking support Portable mode for carrying QOwnNotes around on USB sticks Scripting support and an online script repository (opens new window) where you can install scripts inside the application Implementation of the OpenAI completion API (opens new window) to be used in scripts Vim mode Web application to insert photos from your mobile phone into the current note in QOwnNotes on your desktop # Wygląd zewnętrzny Podświetlanie przecen notatek i tryb podglądu przecen Obsługa motywów trybu ciemnego Theming support for the Markdown syntax highlighting Wszystkie panele można umieścić w dowolnym miejscu, mogą nawet unosić się lub ustawiać w stos (w pełni dokowalne) Obsługa ikon motywów freedesktop, możesz używać QOwnNotes ze swoimi natywnymi ikonami pulpitu oraz ze swoim ulubionym ciemnym motywem pulpitu Tryb bez rozpraszania uwagi, Tryb pełnoekranowy i Tryb maszyny do pisania Numery wierszy Różnice między bieżącą notatką a zewnętrznie zmienioną notatką są pokazane w oknie dialogowym # Języki Dostępne w ponad 60 różnych językach, takich jak angielski, niemiecki, francuski, polski, chiński, japoński, rosyjski, portugalski, węgierski, holenderski i hiszpański Twoja pomoc jest bardzo ceniona w ulepszaniu tych tłumaczeń lub w tłumaczeniu QOwnNotes na więcej języków Pomóż nam ulepszyć tę stronę! (opens new window) Pojęcie → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
