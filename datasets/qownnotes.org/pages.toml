 schakelt de volledige schermmodus in Alt + ⇧ + H kopieert de kop van de huidige notitie # In de notitie-zoekbalk Down or Tab stelt de focus in op de notitielijst Return maakt een nieuwe notitie aan met de tekst uit de zoekbalk als kop # In de notitielijst dubbelklik op notitie om notitie in een nieuw tabblad te openen (houd er rekening mee dat er een scripting-hook is die de dubbelklikactie kan overschrijven) Ctrl + A selecteert alle notities (om ze te verplaatsen, kopiëren of verwijderen met een rechterklik) Met Tab of Return kunt u de huidige notitie bewerken # In het tekstbewerkingspaneel voor notities Ctrl + Click op een link om het te openen Ctrl + F laat je zoeken in de huidige notitie Gebruik Up en Down toetsen of F3 and ⇧ + F3 toetsen om naar de vorige en volgende overeenkomsten te gaan Esc sluit de zoekbalk Ctrl + R laat je zoeken en vervangen in de huidige notitie Ctrl + D dupliceert de huidige regel of de geselecteerde tekst Ctrl + Alt + Down doet hetzelfde Alt + Backspace verwijdert de huidige regel Ctrl + Backspace verwijdert het huidige woord Ctrl + ⇧ + <0>L</0> opent een dialoogvenster om een notitielink toe te voegen Ctrl + ⇧ Shift + L opent een dialoogvenster om een notitielink toe te voegen Ctrl + T voegt de huidige datum en tijd in een gebruikersspecifiek formaat in Ctrl + ⇧ Shift + I voegt een afbeelding in (de afbeelding wordt gekopieerd naar de map media in de huidige notitiemap) Ctrl + ⇧ Shift + X voegt een bijlage in (het bestand wordt gekopieerd naar de map attachments in de huidige notitiemap) Alt + ⇧ Shift + T voegt een tafel in Ctrl + ⇧ Shift + C voegt een codeblok in op de huidige positie Ctrl + ⇧ Shift + B voegt een blokcitaat in op de huidige positie Ctrl + B maakt de geselecteerde tekst vetgedrukt Ctrl + I maakt de geselecteerde tekst cursief op Ctrl + U maakt de geselecteerde tekst onderstrepen op Alt + ⇧ Shift + S haalt de geselecteerde tekst door Ctrl + ⇧ Shift + U doorloopt de gevallen van de geselecteerde tekst Tab laat de geselecteerde tekst inspringen (werkt ook op meerdere regels) ⇧ Shift + Tab un-indents the selected text Tab nadat een ongeordend lijstteken het lijstitem inspringt ⇧ Shift + Tab nadat een ongeordend lijstteken de inspringing van het lijstitem opheft Return in lijsten maakt een nieuw lijstitem Alt + Links springt terug in de notitiegeschiedenis Alt + Rechts springt vooruit in de notitiegeschiedenis Ctrl + ⇧ Shift + 1..9 zet een notitiebladwijzer op bladwijzervak 1..9 Ctrl + 1..9 springt naar de notitiebladwijzer op bladwijzervak 1..9 Ctrl + + vergroot de lettergrootte van de notitietekst met één punt Ctrl + - verkleint de lettergrootte van de notitietekst met één punt Ctrl + 0 stelt de lettergrootte van de notitietekst opnieuw in Ctrl + Space probeert eenvoudige vergelijkingen op te lossen, zoals (4+5)*3= voor de cursor, vult automatisch tekst aan of opent url's Ctrl + ⇧ + H voegt een kop in van de bestandsnaam van de notitie bovenaan de notitie Alt + ⇧ Shift + X splits the current note into two notes at the current cursor position Alt + ⇧ Shift + W zoekt naar de geselecteerde tekst op internet Ctrl + Omhoog schuift de inhoud omhoog Ctrl + Omlaag schuift de inhoud naar beneden Ctrl + ⇧ Shift + Down verplaatst de huidige regel naar beneden Ctrl + ⇧ Shift + Up verplaatst de huidige line-up ⇧ Shift + Return voegt twee spaties en een teken voor een nieuwe regel toe om een nieuwe regel af te dwingen # In het notitievoorbeeldpaneel Ctrl + F laat je zoeken in de huidige notitie Gebruik Up en Down toetsen of F3 and ⇧ + F3 toetsen om naar de vorige en volgende overeenkomsten te gaan Esc sluit de zoekbalk # In de Todo-lijst Ctrl + S slaat het huidige todo-item op Ctrl + I slaat het huidige todo-item op en voegt het in de huidige notitie in Ctrl + R verwijdert het huidige todo-item # macOS # In het hoofdvenster ⌘ Cmd + N maakt een nieuwe notitie met de huidige datum en tijd in de naam ⌘ Cmd + ⇧ Shift + N erstellt eine neue Notiz in einem neuen Tab ⌘ Cmd + ⇧ Shift + F laat je naar n