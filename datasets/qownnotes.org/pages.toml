["https://qownnotes.org/es/getting-started/web-app.html"]
title = "Aplicación web de QOwnNotes | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# Aplicación web de QOwnNotes Puede insertar fotos de su teléfono móvil en la nota actual en QOwnNotes en su escritorio a través de la **aplicación web ** en app.qownnotes.org (opens new window). La aplicación web de su teléfono se comunica con su aplicación de escritorio QOwnNotes a través de Internet. La comunicación entre QOwnNotes y el servicio web está **encriptada en su transporte **. No se almacenarán imágenes en el servidor. Hay una aplicación web de la página de configuración que añade soporte para la aplicación web. No olvide copiar su ficha secreta de la página de configuración de QOwnNotes a app.qownnotes.org (opens new window) para poder comunicarse con su instancia local de QOwnNotes. También puede escanear la ficha del código QR con su teléfono en la aplicación web. Puede encontrar el código fuente de la aplicación web en aplicación web en GitHub (opens new window). También puede alojar este servicio web usted mismo; las imágenes de Docker recién compiladas están disponibles en qownnotes-web-app en DockerHub (opens new window). ¡Ayúdanos a mejorar este sitio! (opens new window) ← Gestor de fragmentos de órdenes de terminal QOwnNotesAPI Nextcloud App → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
