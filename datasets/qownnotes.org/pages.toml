full_description = '''# Controllo versioni con Git Puoi impostare automaticamente QOwnNotes per fare il commit delle modifiche dalla tua cartella locale delle note alla cartella delle note nella tua repository di git. Questo può essere fatto nelle impostazioni di Controllo versioni con Git sotto Impostazioni generali. E' necessario che tu abbia git installato e avere l'eseguibile git impostato nella tua variabile di sistema 'PATH' o puoi impostare quest'ultima nelle impostazioni di Controllo versioni con Git. Devi anche attivare il supporto a git per ogni cartella delle note con cui vuoi venga effettuato il controllo versioni con Git! TIP Don't forget to set your git username and email address in the terminal: git config --global user.email "[email protected]" git config --global user.name "Il tuo nome" 12 Aiutaci a migliorare questo sito! (opens new window) ← Tasti di scelta rapida Installazione → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!'''
