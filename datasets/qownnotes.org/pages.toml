["https://qownnotes.org/installation/windows.html"]
title = "Install on Microsoft Windows™ | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = '''# Install on Microsoft Windows™ Download the latest Windows archive from QOwnNotes Releases on GitHub (opens new window) (look for a file called QOwnNotes.zip) and unzip it to anywhere you like. There is no installation needed! WARNING If you want to use the automatic updater please make sure you unzip it to a place where your user account has write access to. By default, your user account most likely doesn't have write access to places like C:\Program Files (x86) or C:\Program Files. You can then directly run QOwnNotes.exe from your QOwnNotes folder, no installation is required. # Portable mode Use QOwnNotesPortable.bat to run QOwnNotes in portable mode where everything (including your notes) will only be stored in your QOwnNotes folder. TIP You don't need the portable mode if you just don't have Administration permissions to your computer. QOwnNotes doesn't need to be installed! # Windows XP Qt dropped support for Windows XP with version 5.8, but QOwnNotes is now also built with Qt 5.7 to allow Windows XP users to still use it. You need to download the ZIP file from AppVeyor (opens new window) yourself and unzip it to a folder of your liking. You can then directly run QOwnNotes.exe from that folder, no installation is required. Info The automatic update mechanism does not work with the AppVeyor build for Windows XP! You will have to download new releases yourself. # Chocolatey There is a community maintained package of QOwnNotes at Chocolatey (opens new window). You can install it with: choco install qownnotes 1# Scoop There is a community maintained package of QOwnNotes (opens new window) at Scoop (opens new window). If you add the Extras bucket you can use it to install QOwnNotes in portable mode. scoop bucket add extras scoop update scoop install qownnotes 123 Help us improve this page! (opens new window) ← Install on Ubuntu Linux, elementary OS and Linux Mint Install on macOS™ → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!'''
