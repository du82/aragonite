title = "QOwnNotes Demo | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# QOwnNotes Demo TIP Note This might not always work, depending on the current state of the demo environment. A következő utasításokat követve kipróbálhatja a QOwnNotes t webböngészőjében telepítés nélkül. Kattintson erre a Play With Docker (opens new window) linkre. 2) Kattintson a Bejelentkezés / Indítás gombra (lásd a(z) 1 képernyőképet), és jelentkezzen be a Docker-fiókjával (létre kell hoznia, ha még nincs ilyen). Várja meg, amíg a tartály létrejön és felpörög. Ezután képesnek kell lennie a tetején a 6080 gombra kattintani (lásd a képernyőképes 2-es pontot). Ha hibát észlel, várjon még egy kicsit, és próbálkozzon újra a 6080 gombra kattintással, eltart egy ideig, amíg az asztali környezet betöltődik. Meg kell nyitni egy új böngésző lapot, amely létrehoz egy asztalt. Kattintson a képernyőn a bal alsó szimbólumra (a tálcán), vigye az egérmutatót a Kiegészítők fölé, és kattintson a QOwnNotes elemre (lásd a képernyőképet bullet 3). Meg kell nyitni a ** QOwnNotes ** telepítési párbeszédpanelt, kattintson rá, és nyomja meg a * Befejezés * gombot a QOwnNotes főablakának megtekintéséhez. Segítsen javítani ezt az oldalt! (opens new window) ← Koncepció Markdown → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
