["https://qownnotes.org/es/getting-started/command-line-snippet-manager.html"]
title = "Gestor de fragmentos de órdenes de terminal | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = '''# Gestor de fragmentos de órdenes de terminal Puede utilizar el Gestor de fragmentos de órdenes de terminal de QOwnNotes (opens new window) para ejecutar fragmentos de órdenes almacenados en notas en QOwnNotes desde las órdenes de terminal. Puede utilizar notas con una etiqueta especial para almacenar fragmentos de órdenes, que puede ejecutar desde el gestor de fragmentos de órdenes de terminal. # Instalación Visite la página del último lanzamiento (opens new window) y descargue la versión que necesite. TIP Si tiene jq (opens new window) instalado, también puede usar este fragmento para descargar e instalar, por ejemplo, la última AppImage de Linux AMD64 en /usr/local/bin/qc: curl https://api.github.com/repos/qownnotes/qc/releases/latest | \ jq '.assets[] | select(.browser_download_url | endswith("_linux_amd64.tar.gz")) | .browser_download_url' | \ xargs curl -Lo /tmp/qc.tar.gz && \ tar xfz /tmp/qc.tar.gz -C /tmp && \ rm /tmp/qc.tar.gz && \ sudo mv /tmp/qc /usr/local/bin/qc && \ /usr/local/bin/qc --version 1234567 # Dependencias Se necesita instalar fzf (opens new window) (fuzzy search) o peco (opens new window) (más antiguo, pero más probable de estar instalado de forma predeterminada) para buscar ordenes en las órdenes de terminal. TIP De forma predeterminada, fzf se usa para buscar, pero puede usar peco configurándolo con qc configure. # Configuración Antes de usar el gestor de fragmentos, debe habilitar el servidor de zócalo web (2) en la configuración de extensión del navegador/fragmentos de comando (1) en QOwnNotes. Luego, debe mostrar la ficha de seguridad (3) y copiarla (4). Ahora abra el archivo de configuración del gestor de fragmentos con: # Configurar el gestor de fragmentos qc configure 12Y coloque la ficha de seguridad en el atributo token: [QOwnNotes] token = "su_ficha_aquí" 12TIP En la configuración de QOwnNotes, también puede establecer qué etiqueta de nota se debe usar para buscar órdenes en las notas. De forma predeterminada, se utiliza la etiqueta órdenes. # Sintaxis de fragmentos de órdenes Puede usar listas desordenadas con bloques de código en terminal para almacenar fragmentos de órdenes. Todas las notas con la etiqueta órdenes se buscan para encontrar fragmentos de órdenes. Si agrega un cmd: antes del bloque de código en terminal, la orden también se encontrará en la nota actual independientemente de las etiquetas de la nota. - `echo Soy una órden` Soy una descripción #etiqueta1 #etiqueta2 #etiqueta3 * `echo Tambien soy una órden` Soy una descripcion #etiqueta3 #etiqueta4 #etiqueta5 - cmd: `echo Seré encontrada en la nota actual` Esta órden se encontrará en la nota actual independientemente de las etiquetas de nota <!-- Ejemplo para solicitar la entrada del usuario --> - `read -p "PR ID: " id && git fetch origin pull/$id/head:pull-$id && git checkout pull-$id` Preguntar por el ID del pull request y realizar checkout al pull request 1234567Los bloques de código de bash o shell, precedidos por un encabezado 2 o superior como descripción, también pueden ser usados para fragmentos de órdenes. Las etiquetas también son compatibles si se encuentran entre el encabezado y el bloque de código. ## Haz esto con un bloque de código "bash" - este texto será ignorado - pero se pueden usar etiquetas: #etiqueta1 #etiqueta2 ```bash echo haz esto echo haz eso ``` ## Realizar otra cosa con un bloque de código "sh" ```sh echo haz otra cosa echo haz algo más ``` El ejemplo anterior dará como resultado dos fragmentos de órdenes, el primero con las dos etiquetas etiqueta1 y etiqueta2. # Uso # Buscar y ejecutar fragmentos de órdenes qc exec 12# Buscar e imprimir fragmentos de órdenes qc search 12# Configuración Ejecute qc configure. [General] editor = "vim" # su editor de texto favorito column = 40 # tamaño de columna para órdenes de lista selectcmd = "fzf" # orden de selector para orden de edición (fzf o peco) sortby = "" # especifica cómo se ordenan los fragmentos (más reciente (predeterminado), -recency, descripción, -description, orden, -command, salida, -output) [QOwnNotes] token = "MvTagHXF" # su ficha de la API de QOwnNotes websocket_port = 22222 # puerto del zócalo web en QOwnNotes 123456789# Finalización de la consola Puede generar un código de finalización de su consola con la qc completion <shell>. Por ejemplo, para la consola Fish puede usar: qc completion fish > ~/.config/fish/completions/qc.fish 1 ¡Ayúdanos a mejorar este sitio! (opens new window) ← Extensión del navegador QOwnNotes Web Companion Aplicación web de QOwnNotes → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!'''
