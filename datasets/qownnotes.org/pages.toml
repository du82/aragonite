title = "تجربة QOwnNotes | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# تجربة QOwnNotes TIP Note قد لا يعمل هذا أحيانا، حسب حالة بيئة التجربة وقت استخدامها. يمكنك تجربة QOwnNotes في متصفحك بغير تثبيته، باتباع هذه التعليمات: ١) انقر على هذا الرابط: Play with Docker (opens new window). ٢) انقر على زر Login / Start (انظر النقطة 1 في لقطات الشاشة) وسجّل دخولك باستخدام حسابك على Docker (تحتاج إلى إنشاء حساب إذا لم يكن لديك واحدا بالفعل). ٣) انظر حتى ينتهي إنشاء الحاوية وتبدأ في العمل. عندئذ يمكنك النقر على 6080 في الأعلى (انظر النقطة 2 في لقطات الشاشة). إذا واجهك خطأ، برجاء الانتظار قليلا ثم حاول النقر على 6080 من جديد؛ قد تحتاج بيئة سطح المكتب لبعض الوقت حتى تحمّل. ٤) سيفتح المتصفح لسانا جديدا فيه سطح مكتب. انقر على الرمز يسار أسفل الشاشة (في شريط المهام)، وقف على Accessories، وانقر على QOwnNotes (انظر النقطة 3 في لقطات الشاشة). ٥) ستظهر شاشة تثبيت QOwnNotes، انقر خلالها واضغط Finish حتى ترى شاشة QOwnNotes الرئيسية. ساعدنا في تحسين هذه الصفحة! (opens new window) ← المفاهيم ماركداون (Markdown) → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
