full_description = "# QOwnNotes Web App Sie können Fotos von Ihrem Mobiltelefon über die Webanwendung auf app.qownnotes.org (opens new window) in die aktuelle Notiz in QOwnNotes auf Ihrem Desktop einfügen. Die Webanwendung auf Ihrem Telefon kommuniziert über das Internet mit Ihrer QOwnNotes-Desktopanwendung. Die Kommunikation zwischen QOwnNotes und dem Webdienst ist transportverschlüsselt. Es werden keine Bilder auf dem Server gespeichert. Es gibt die Einstellungsseite Webanwendung, um Unterstützung für die Webanwendung hinzuzufügen. Vergessen Sie nicht, Ihr geheimes Token von der QOwnNotes-Einstellungsseite nach app.qownnotes.org (opens new window) zu kopieren, um mit Ihrer lokalen Instanz von QOwnNotes kommunizieren zu können. Sie können den Token auch aus dem QR-Code mit Ihrem Telefon in der Webanwendung scannen. Den Quellcode der Webanwendung finden Sie unter web-app auf GitHub (opens new window). Sie können diesen Webdienst auch selbst hosten. Die frisch erstellten Docker-Images finden Sie unter qownnotes-web-app auf DockerHub (opens new window). Hilf uns diese Seite zu verbessern! (opens new window) ← Befehlszeilen-Snippet-Manager QOwnNotesAPI Nextcloud App → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
