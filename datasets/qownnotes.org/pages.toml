["https://qownnotes.org/pl/getting-started/concept.html"]
title = "Pojęcie | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# Pojęcie # QOwnNotes QOwnNotes przechowuje notatki w Twoim folderze notatek jako pliki znaczników Może komunikować się z serwerem Nextcloud / ownCloud, aby publicznie udostępniać notatki innym osobom Możesz także uzyskać dostęp do historii notatek i kosza na serwerze Nextcloud / ownCloud za pośrednictwem aplikacji QOwnNotesApi Nextcloud Listy rzeczy do zrobienia na serwerze Nextcloud / ownCloud są dostępne z poziomu QOwnNotes QOwnNotes nie synchronizuje twoich notatek i plików multimedialnych / załączników! Synchronizacja plików to złożone przedsięwzięcie, istnieją już świetne rozwiązania do synchronizacji plików (patrz Klient synchronizacji pulpitu Nextcloud) # Pliki notatek Markdown jesteś właścicielem wszystkich swoich notatek i plików multimedialnych / załączników! Notatki są przechowywane na komputerze jako pliki zwykłego tekstu Markdown Możesz użyć dowolnego edytora tekstu oprócz QOwnNotes do przeglądania lub edycji plików notatek Synchronizuj swoje notatki z innymi urządzeniami (stacjonarnymi i mobilnymi) za pomocą klienta synchronizacji Nextcloud (opens new window) lub ownCloud (opens new window) z serwerem # Rozszerzenie przeglądarki QOwnNotes Możesz zarządzać swoimi zakładkami przeglądarki za pomocą QOwnNotes lub używać go jako narzędzia do usuwania stron internetowych. TIP Rozszerzenia przeglądarki działają offline, nie jest potrzebne połączenie internetowe. Aby uzyskać więcej informacji, odwiedź rozszerzenie QOwnNotes Web Companion do przeglądarki. # QOwnNotes command-line snippet manager Możesz zarządzać fragmentami poleceń za pomocą QOwnNotes i wykonywać je w wierszu poleceń. TIP Odwiedź stronę menedżera fragmentów wiersza polecenia QOwnNotes, aby uzyskać więcej informacji. # Klient synchronizacji pulpitu Nextcloud Synchronizuj swoje notatki z innymi urządzeniami (stacjonarnymi i mobilnymi) za pomocą klienta synchronizacji Nextcloud (opens new window) lub ownCloud (opens new window) z serwerem. TIP Oczywiście inne rozwiązania, takie jak Dropbox, Syncthing, Seafile lub BitTorrent Sync mogą być również używane do synchronizacji notatek i innych plików. Możesz także użyć git do synchronizacji z narzędziami takimi jak gitomatic (opens new window). # Serwer Nextcloud Aby pracować z notatkami online, możesz użyć serwerów takich jak Nextcloud (opens new window) lub ownCloud (opens new window). Możesz hostować własny serwer lub skorzystać z rozwiązań hostowanych. Istnieje lista obsługiwanych przez społeczność dostawców Nextcloud (opens new window), a także lista urządzeń z Nextcloud (opens new window). Portknox (opens new window) zgłosił, że ma QOwnNotesAPI zainstalowane (opens new window). TIP Oczywiście inne rozwiązania, takie jak Dropbox, Syncthing, Seafile lub BitTorrent Sync mogą być również używane do hostowania notatek i innych plików. # QOwnNotesAPI Nextcloud app QOwnNotesAPI (opens new window) umożliwia dostęp do notatek w koszu i wersji notatek po stronie serwera. TIP Aby uzyskać więcej informacji, odwiedź QOwnNotesAPI Nextcloud App. # Aplikacja serwerowa Nextcloud Notes Użyj Nextcloud Notes (opens new window), aby edytować swoje notatki w sieci. WARNING Należy pamiętać, że program Nextcloud Notes obsługuje obecnie tylko jeden poziom podfolderów. # Nextcloud Deck server app You can use QOwnNotes to quickly create cards in Nextcloud Deck (opens new window). # Nextcloud Notes mobile app To access your Nextcloud / ownCloud notes from your mobile device you can use different apps. # Android Nextcloud Notes dla Androida (opens new window) (inna firma) TIP You could also use any sync-tool like Synchronize Ultimate or FolderSync to sync your note files and use software like neutriNotes to edit your notes. # iOS CloudNotes na iOS (opens new window) (inna firma) TIP You can also use Notebooks (opens new window) and sync your notes via WebDAV, there is a good tutorial at Taking Notes with Nextcloud, QOwnNotes, and Notebooks (opens new window) # api.qownnotes.org This is an online service provided by QOwnNotes to check if there is a new release of the application available. It is talking to GitHub and checks for the latest release, gets a suited download url and compiles the changes from the changelog compared to the version of QOwnNotes you are currently using as html to show in the update dialog. In addition, it also provides the Release RSS Feed (opens new window) and an implementation of the legacy update checking api for older versions of QOwnNotes. TIP You can access the source code for api.qownnotes.org (opens new window) on GitHub (opens new window). # QOwnNotes Web App You can insert photos from your mobile phone into the current note in QOwnNotes on your desktop via the web application on app.qownnotes.org (opens new window). TIP Please visit QOwnNotes Web App for more information. Pomóż nam ulepszyć tę stronę! (opens new window) ← Przegląd Demo QOwnNotes → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
