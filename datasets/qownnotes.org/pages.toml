title = "QOwnNotes 웹 앱 | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# QOwnNotes 웹 앱 app.qownnotes.org (opens new window)의 웹 응용 프로그램을 통해 전화기의 사진을 바탕 화면의 QOnNotes에 있는 현재 노트에 삽입할 수 있습니다. 전화기의 웹 응용프로그램은 인터넷을 통해 QOnNotes 데스크탑 응용프로그램과 통신합니다. QOnNotes와 웹 서비스 간의 통신은 전송 암호화되어 있습니다. 서버에 이미지가 저장되지 않습니다. 웹 응용 프로그램에 대한 지원을 추가하기 위한 설정 페이지 웹 응용 프로그램이 있습니다. QOnNotes의 로컬 인스턴스와 통신할 수 있도록 QOnNotes 설정 페이지에서 app.qownnotes.org (opens new window)로 비밀 토큰을 복사하는 것을 잊지 마십시오. 웹 애플리케이션에서 전화기로 QR 코드의 토큰을 스캔할 수도 있습니다. 웹 애플리케이션의 소스 코드는 web-app on GitHub (opens new window) web-app에서 확인할 수 있습니다. 또한 이 웹 서비스를 직접 호스팅할 수 있으며, 새로 구축된 도커 이미지는 DockerHub의 qownnotes-web-app (opens new window)에서 이용할 수 있습니다. 이 페이지를 개선할 수 있도록 도와주세요! (opens new window) ← 명령줄 스니펫 관리자 QOwnNotesAPI Nextcloud 앱 → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
