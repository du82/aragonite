["https://qownnotes.org/nl/getting-started/concept.html"]
title = "Concept | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# Concept # QOwnNotes QOwnNotes slaat notities op in uw notitiemap als markdown-bestanden Het kan met uw Nextcloud / ownCloud-server praten om openbaar notities te delen met andere mensen Je hebt ook toegang tot je notitiegeschiedenis en prullenbak op je Nextcloud / ownCloud-server via de QOwnNotesApi Nextcloud-app Todo-lijsten op uw Nextcloud / ownCloud-server zijn toegankelijk vanuit QOwnNotes QOwnNotes synchroniseert uw notities niet en media- / bijlagebestanden! Bestandssynchronisatie is een complexe onderneming, er zijn al geweldige oplossingen voor het synchroniseren van bestanden beschikbaar (zie Nextcloud desktop-synchronisatieclient) # Markdown-notitiebestanden Je bezit al je notities en media / bijlagen! Uw notities worden opgeslagen als platte tekst Markdown-bestanden op uw desktopcomputer U kunt naast QOwnNotes elke gewenste teksteditor gebruiken om uw notitiebestanden te bekijken of te bewerken Synchroniseer uw notities met andere apparaten (desktop en mobiel) met uw Nextcloud (opens new window) of ownCloud (opens new window) synchronisatieclient naar uw server # QOwnNotes-browserextensie U kunt uw browserbladwijzers beheren met QOwnNotes of deze gebruiken als webclipper. TIP De browserextensies werken offline, geen internetverbinding nodig. Bezoek de QOwnNotes Web Companion browserextensie voor meer informatie. # QOwnNotes-opdrachtregelfragmentbeheer U kunt uw opdrachtfragmenten beheren met QOwnNotes en ze uitvoeren op de opdrachtregel. TIP Ga naar QOwnNotes command-line snippet manager voor meer informatie. # Nextcloud desktop-synchronisatieclient Synchroniseer uw notities met andere apparaten (desktop & mobile) met uw Nextcloud (opens new window) of ownCloud (opens new window) synchronisatieclient naar uw server. TIP Natuurlijk kunnen andere oplossingen, zoals Dropbox, Syncthing, Seafile of BitTorrent Sync worden gebruikt om uw notities en andere bestanden te synchroniseren. Je kunt ook git gebruiken om te synchroniseren met tools zoals gitomatic (opens new window). # Nextcloud-server Om online met uw notities te werken, kunt u servers zoals Nextcloud (opens new window) gebruiken of ownCloud (opens new window). U kunt uw eigen server hosten of gehoste oplossingen gebruiken. Er is een door de community onderhouden lijst met Nextcloud-providers (opens new window), evenals een lijst met apparaten met Nextcloud (opens new window). Portknox (opens new window) heeft gemeld dat ze QOwnNotesAPI hebben geïnstalleerd (opens new window). TIP Natuurlijk kunnen ook andere oplossingen, zoals Dropbox, Syncthing, Seafile of BitTorrent Sync worden gebruikt om uw notities en andere bestanden te hosten. # QOwnNotesAPI Nextcloud app QOwnNotesAPI (opens new window) geeft u toegang tot uw server-side weggegooide notities en notitieversies. TIP Bezoek QOwnNotesAPI Nextcloud App voor meer informatie. # Nextcloud Notes-server-app Gebruik Nextcloud Notes (opens new window) om uw notities op het web te bewerken. WARNING Houd er rekening mee dat Nextcloud Notes momenteel slechts maximaal één niveau aan submappen ondersteunt. # Nextcloud Deck server app U kunt QOwnNotes gebruiken om snel kaarten aan te maken in Nextcloud Deck (opens new window). # Nextcloud Notes mobile app Om toegang te krijgen tot uw Nextcloud / ownCloud-notities vanaf uw mobiele apparaat kunt u verschillende apps gebruiken. # Android Nextcloud Notes voor Android (opens new window) (derde partij) TIP U kunt ook elke synchronisatietool zoals Synchronize Ultimate of FolderSync gebruiken om uw notitiebestanden te synchroniseren en software zoals neutriNotes gebruiken om uw notities te bewerken. # iOS CloudNotes for iOS (opens new window) (3rd party) TIP U kunt ook Notitieblokken (opens new window) gebruiken en uw notities synchroniseren via WebDAV. E is een goede uitleg bij Notities maken met Nextcloud, QOwnNotes en Notebooks (opens new window) # api.qownnotes.org Dit is een online service van QOwnNotes om te controleren of er een nieuwe release van de applicatie beschikbaar is. Het praat met GitHub en controleert op de nieuwste release, verkrijgt een geschikte download-url en compileert de wijzigingen van de changelog in vergelijking met de versie van OwnNotes die u momenteel gebruikt tot html om weer te geven in het updatedialoogvenster. Daarnaast biedt het ook de Release RSS Feed (opens new window) en een implementatie van de legacy update die api controleert voor oudere versies van QOwnNotes. TIP U kunt toegang krijgen tot de broncode voor api.qownnotes.org (opens new window) op GitHub (opens new window). # QOwnNotes-webapp U kunt foto's van uw mobiele telefoon in de huidige notitie in QOwnNotes op uw bureaublad invoegen via de webapplicatie op app.qownnotes.org (opens new window). TIP Bezoek QOwnNotes Web App voor meer informatie. Help ons deze pagina te verbeteren! (opens new window) ← Overzicht QOwnNotes Demo → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
