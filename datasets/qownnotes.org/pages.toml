full_description = '# جستجوی یادداشت ها به منظور جستجوی یادداشت ها یا متن داخل یادداشت ها می توانید از کلید میانبر Ctrl + ⇧ Shift + F (یا ⌘ Cmd + ⇧ Shift + F در مکینتاش) برای پرش به پنل جستجوی یادداشت استفاده کنید. روش های مختلفی برای جستجوی یادداشت ها وجود دارد: note book با کلمه note یا book در میان یادداشت ها و در نام پرونده یا متن یادداشت مورد جستجو قرار می گیرد "note book" دقیقاً به شکل note book در میان یادداشت ها و در نام پرونده یا متن یادداشت مورد جستجو قرار می گیرد n:book یا name:book با کلمه book در میان یادداشت ها و درست در نام یادداشت یا نام پرونده جستجو می شود در اصلاح این صفحه ما را یاری کنید! (opens new window) ← برنامه نکست کلود QOwnNotesAPI میانبرها → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!'
