["https://qownnotes.org/ar/contributing/translation.html"]
title = "الترجمة | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = '# الترجمة شكرا لك على تقديم المساعدة! كيف يمكنني المساعدة في ترجمة QOwnNotes؟ # انضم إلينا على Crowdin لترجمة QOwnNotes Crowdin هي منصة شهيرة لإدارة التوطينات لتطبيقات المحمول والويب والحواسيب والمحتويات المرتبطة. يمكنك التسجيل في Crowdin (opens new window) وترجمة QOwnNotes إلى لغتك باستخدام أدوات سهلة. QOwnNotes على Crowdin (opens new window) فقط أرسل رسالة إلى مالك المشروع على Crowdin (opens new window) أو أنشئ طلبا على GitHub (opens new window) إذا أردت ترجمة QOwnNotes إلى لغة جديدة. إذا كنت ترغب في إضافة ترجمات جديدة إلى اللغات الحالية يمكنك القيام بذلك على الفور. # التدقيق اللغوي إذا كنت تتحدث لغةً ما بطلاقة، أو حتى كانت لغتك الأم، وكانت هذه اللغة مترجمة لكن لم تُراجع، سنكون ممتنين لك إذا ساعدتنا في جعل استخدام QOwnNotes مضمونًا أكثر ومريحًا أكثر بمراجعة الترجمات التي لم تُعتمد بعد، وتصحيحها إن لزم الأمر. عليك سؤال المالك للحصول على إذن التدقيق اللغوي للغتك. اضغط هنا لمعرفة ما إذا كانت لغتك متواجدة بين اللغات المترجمة! QOwnNotes على Crowdin (opens new window) بمجرد أن تتواصل مع مالك المشروع على Crowdin (opens new window) وتحصل على الإذن بالتدقيق اللغوي للغتك، تستطيع البدء! # نصائح عامة برجاء مراعاة بعض الأشياء أثناء العمل على المشروع. # الصحة برجاء توطين النص على أصح وجه ممكن، مع الحفاظ على سلاسته في اللغة التي تترجم إليها. # الدقة يجب على النص المترجم أن يمثل النص الأصلي تماما، وبدون أي حذف أو إضافة لأي جزء من السلسلة النصية. # السياق إذا احتجت سياق أكثر، أو مساعدة في نص معين، وكنت تعرف لغة أخرى، يمكنك تحويل اللغة ورؤية كيف ترجم الآخرون هذا النص. لكن لا تتردد في ترك رسالة على الجانب الأيمن من الصفحة لطلب توضيح. # المصطلحات الأساسية الشائعة يجب التدقيق واستخدام نفس الترجمة للمصطلحات الأساسية الشائعة؛ مثلا كلمة «ملاحظة» ("note") يجب ترجمتها دائما بنفس الطريقة. إذا كانت trashed notes تُترجم إلى الملاحظات المهملة في العربية، فعليك دوما ترجمتها بهذا التعبير. إلا أن تُلزمك قواعد اللغة باستخدام بديل، لكن أبقِ الأمور بسيطة. للعثور على جميع التعبيرات المتطابقة، ابحث في Crowdin لترى إن كانت جميع تواجدات مصطلحٍ ما لها نفس الترجمة بالفعل. ويمكنك اقتراح ترجمة أفضل والتصويت على الترجمات الأخرى. عليك توطين جميع التواجدات بنفس الطريقة لأقصى درجة ممكنة. يجب أن يكون لكلمة Note ترجمة واحدة دائما. # صيغ الجمع برجاء إضافة الترجمات المناسبة لصيغ الجمع كلها في خاناتها المناظرة. # المتغيرات المتغيرات مثل %1 يجب أن تكتب بغير مسافة. وفي اللغات التي تُكتب من اليمين إلى اليسار، يمكنك نسخ المتغيرات من النص الأصلي أو كتابتها في ترجمتك. # مفاتيح الوصول استخدم علامة & أمام أي حرف يجب أن يُستخدم كمفتاح اختصار. يمكن أن يكون كما في الأصل لكن لا يُشترط ذلك. # الحاويات المخصصة السلاسل النصية مثل ::: tip و ::: warning و ::: info في التوثيق هي علامات الحاويات المخصصة (opens new window) في VuePress ويجب ألا تترجم. # سلاسل نصية أخرى يجب ألا تترجم بعض المقاطع لا نترجمها في التوثيق: لا نترجم أبدا الأكواد أو الروابط أو الوسوم؛ جميعها يجب أن تبقى كما هي، وبدون مسافات إضافية. (وإن أضافت اقتراحات الترجمة الآلية مسافات إضافية، فيجب حذفها.) لا نترجم التواريخ والأوقات (اتركها فارغة) وأيضا لا نترجم الإشارات (والتي حصل عليها QOwnNotes في العديد من اللغات المترجمة)، لذا يمكنك ببساطة تخطيها # الترجمة والتدقيق اللغوي ممتعان! سوف تتعامل مع لغة هذا التطبيق، وستتعلم مصطلحات جديدة، وستتلقى الكثير من المعلومات عن المشروع. فإذا كنت مستعدًا للمساعدة في تدقيق ترجمة لغتك، فتواصل مع Patrizio (opens new window) لتسأله عن أي شيء تود معرفته أو لتطلب إذن التدقيق اللغوي للغتك. شكرا جزيلا على مساعدتك! 🙂 ساعدنا في تحسين هذه الصفحة! (opens new window) ← المطورون تبرّع → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!'
