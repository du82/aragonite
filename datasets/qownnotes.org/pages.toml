full_description = '# التثبيت على Slackware Linux # Slackware 14.2 عليك أولا تثبيت Qt 5 و libxkbcommon و libproxy و js185. cd /tmp wget "http://bear.alienbase.nl/mirrors/people/alien/sbrepos/current/x86_64/qt5/qt5-5.6.1_1-x86_64-1alien.txz" wget http://bear.alienbase.nl/mirrors/people/alien/sbrepos/current/x86_64/libxkbcommon/libxkbcommon-0.5.0-x86_64-1alien.txz sudo installpkg libxkbcommon-0.5.0-x86_64-1alien.txz qt5-5.6.1_1-x86_64-1alien.txz slackpkg update slackpkg install libproxy js185-1.0.0-x86_64-1 123456عندئذٍ يمكنك استنساخ مستودع slackbuilds الخاص بـ QOwnNotes وبناء التطبيق. cd /tmp git clone https://github.com/pbek/qownnotes-slackbuilds.git cd qownnotes-slackbuilds/14.2/qownnotes ./dobuild.sh 1234بعدئذٍ يمكنك تثبيت الحزمة الموَّلدة بالأمر installpkg. # Slackware 14.1 عليك أولا تثبيت Qt 5. cd /tmp wget "http://bear.alienbase.nl/mirrors/people/alien/sbrepos/14.1/x86_64/qt5/qt5-5.5.1-x86_64-4alien.txz" sudo installpkg qt5-5.5.1-x86_64-4alien.txz 12عندئذٍ يمكنك استنساخ مستودع slackbuilds الخاص بـ QOwnNotes وبناء التطبيق. cd /tmp git clone https://github.com/pbek/qownnotes-slackbuilds.git cd qownnotes-slackbuilds/14.1/qownnotes ./dobuild.sh 1234بعدئذٍ يمكنك تثبيت الحزمة الموَّلدة بالأمر installpkg. QOwnNotes Slackbuild على GitHub (opens new window) ساعدنا في تحسين هذه الصفحة! (opens new window) ← التثبيت على Void Linux التثبيت على FreeBSD → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!'
