["https://qownnotes.org/ko/getting-started/markdown.html"]
title = "마크다운 | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# 마크다운 이 마크다운 속임수는 QOwnNotes의 마크다운 구문에 대한 빠른 참조 및 설명을 제공하기 위한 것입니다. # 제목 제목을 사용하여 텍스트를 구성합니다. # H1 ## H2 ### H3 #### H4 ##### H5 ###### H6 123456::: 팁 네비게이션 패널은 제목의 구조를 보여줍니다. ::: 또는 H1과 H2의 경우 밑줄이 있는 스타일: Alt-H1 ====== Alt-H2 ------ 12345::: 팁 기본적으로 QOwnNotes는 머리글 1 (h1)에서 노트의 파일 이름을 작성합니다. ::: # 강조 강조, 별칭 기울임꼴로 *별표*를 사용합니다. **애스터리스크**로 굵게 강조합니다. 123단축키 Ctrl + B를 사용하여 텍스트를 굵게 표시하고 Ctrl + I을 사용하여 기울임꼴로 표시할 수 있습니다. ::: # 밑줄 미리보기 설정에서 밑줄 렌더링을 활성화하는 옵션 설정도 있습니다. _밑줄_ 1::: 팁 단축키 Ctrl + U를 사용하여 텍스트에 밑줄을 표시할 수 있습니다. ::: # 취소선 ~~취소선~~ 1::: 팁 단축키 Alt + Shift + S을 사용하여 텍스트를 삭제할 수 있습니다. ::: # 목록 목록을 만드는 방법은 여러 가지가 있습니다. 1. 첫 번째 정렬된 목록 항목 2. 다른 항목 * 정렬되지 않은 하위 목록입니다. 1. 실제 숫자는 중요하지 않습니다. 단지 숫자일 뿐입니다 1. 정렬된 하위 목록 (미리보기가 아닌 편집기에서만 작동) 4. 그리고 다른 아이템입니다. * 정렬되지 않은 목록은 별표를 사용할 수 있습니다 - 또는 마이너스 + 또는 플러스 12345678910::: 팁 목록 끝에 있는 Enter<0>을 누르면 새 목록 항목이 생성됩니다. ::: 링크 링크를 쉽게 사용할 수 있는 두 가지 방법은 웹 페이지나 기타 노트를 가리킵니다. 이러한 링크는 여러 가지 방법으로 볼 수 있습니다. 외부 링크 [저는 인라인 스타일 링크입니다](https://www.google.com) [저는 제목이 있는 인라인 스타일 링크입니다](https://www.google.com \"Google's Homepage\") [참조 스타일 링크 정의에 숫자를 사용할 수 있습니다][1] 각 괄호 안의 일반 URL과 URL은 미리보기에서 자동으로 링크로 바뀝니다. http://www.example.com 또는 <http://www.example.com> [1]: https://www.qownnotes.org 내부 링크 [Journal.md 노트에 링크합니다] (Journal.md) <Journal.md> 비슷하게 작동합니다. ::: 팁 단축키 Ctrl + L을 사용하여 웹 페이지 또는 기타 노트에 대한 링크를 만들 수 있습니다. Ctrl + Shift + X를 사용하면 노트에 첨부 파일을 삽입하는 데 도움이 되는 대화 상자가 나타납니다. 노트의 링크에서 커서를 편집하여 링크를 따라가는 동안 Ctrl + Space를 누를 수 있습니다. ::: 북마크 QOwnNotes Web Companion 브라우저 확장에서 사용되는 북마크는 목록의 연결을 사용합니다. - [웹페이지 이름](https://www.example.com) #tag1 #tag2 일부 설명 및 태그 이미지 이미지를 QOwnNotes에 포함할 수 있습니다. 미리보기에 표시됩니다. ![alt text](media/my-image.jpg) ::: 팁 단축키 Ctrl + Shift + I 를 사용하여 노트에 이미지를 삽입할 수 있습니다. 이미지가 클립보드에 있을 수도 있으며 대화상자가 이미지를 감지하고 미리보기를 표시합니다. Ctrl + Shift + V을 사용하여 클립보드의 이미지를 노트에 직접 붙여넣을 수도 있습니다. ::: 인라인 코드 및 코드 블록 인라인 '코드' 주위에 '백틱'이 있습니다. ::: 팁 선택한 인라인 텍스트 또는 텍스트 바로 안쪽에서 단축키 Ctrl + Shift + C를 사용하여 인라인 코드 블록을 만들 수 있습니다. ::: 코드 블록은 세 개의 백 틱이 있는 선으로 울타리를 두르거나 네 개의 공백으로 들여씁니다. 4-공간 울타리 코드 앞에 공백 4개를 추가하여 코드 블록으로 표시합니다. s = \"공백 들여쓰기 코드\" print s 백틱 울타리 세 개의 백틱을 사용하여 코드 블록을 만들 수도 있습니다. ~~~markdown 코드는 여기에 있습니다 코드는 여기에 있습니다 ::: 팁 [shortcut](./shortcuts.md) <kbd>Ctrl + Shift + C</kbd>를 선택한 여러 텍스트 행 또는 빈 행에서 사용하여 코드 블록을 만들 수 있습니다. ::: ### 코드 강조 표시가 있는 백틱 울타리 QOwnNotes에는 코드 블록을 사용하여 구문을 강조 표시하는 기능도 있습니다. ~~ 마크다운 '''bash # 저는 주석입니다 cd Notes 현재 지원되는 언어 (및 코드 블록 식별자) 는 다음과 같습니다: * BASh scripting, `bash` * C, `c` * C++, `cpp` * C++, `cxx` * C++, `c++` * C#, `c#` * CMake, `cmake` * C#, `csharp` * CSS, `css` * Go, `go` * HTML, `html` * INI, `ini` * Java, `java` * JavaScript, `javascript` * JavaScript, `js` * JSON, `json` * Makefile, `make` * PHP, `php` * Python, `py` * Python, `python` * QML, `qml` * Rust, `rust` * Shell scripting, `sh` * SQL, `sql` * TypeScript, `ts` * TypeScript, `typescript` * V, `v` * Vex, `vex` * XML, `xml` * YAML, `yml` * YAML, `yaml` # 표 표는 핵심 마크다운 사양의 일부가 아니지만 QOwnNotes 미리보기는 표를 지원합니다. ~~ 마크다운 열을 정렬하는 데 콜론을 사용할 수 있습니다. | Tables | Are | Cool | | ------------- |:-------------:| -----:| | 열 3 은 | 오른쪽 정렬 | $1600 | | 열 2 는 | 가운데 | $12 | | 얼룩말 줄무늬 | 깔끔하다 | $1 | 각 머리말 셀을 구분하는 대시가 3개 이상 있어야 합니다. 인라인 마크다운을 사용할 수도 있습니다. | 마크다운 | 더 적은 | 예쁜 | | --- | --- | --- | | *Still* | `renders` | **nicely** | | 1 | 2 | 3 | ::: 팁 Alt + Shift + T을 눌러 표 작성에 도움이 되는 대화상자를 활성화합니다. 이 대화 상자에서 CSV 파일을 가져올 수도 있습니다. 마크다운 테이블 내부의 Ctrl + Space를 사용하여 자동으로 형식을 지정합니다. ::: 블럭 따옴표 > 이메일에서 블록 따옴표는 회신 텍스트를 에뮬레이트하는 데 매우 유용합니다. > 이 줄은 같은 인용구의 일부입니다. 따옴표로 묶습니다. > 줄 바꿈이 끝날 때도 여전히 적절하게 따옴표로 묶일 수 있는 매우 긴 줄입니다. 모든 사람이 실제로 감싸기에 충분한 길이인지 확인하기 위해 계속 작성해 보겠습니다. 아, 블록 따옴표에 **마크다운**을 *입력*할 수 있습니다. ::: 팁 QOwnNotes에서 블록 따옴표를 완전히 강조 표시하거나 편집기 설정에서 블록 따옴표 문자만 강조 표시하도록 지정할 수 있습니다 단축키 Ctrl + Shift + B을 사용하여 텍스트를 블록 따옴표로 표시할 수 있습니다. ::: 수평 규칙 수평 규칙을 얻는 세 가지 방법이 있습니다: 하이픈, 별표 또는 밑줄을 사용할 수 있습니다. 3개 이상... 하이픈 --- 별표 *** 밑줄 ___ 줄 바꿈 문단을 하나 이상의 행으로 분할하여 편집할 수 있지만, 문단은 계속해서 중단 없이 단일 문단으로 렌더링됩니다. 두 개의 공백으로 선을 종료하여 문단 내부에서 줄 바꿈을 수행할 수 있습니다. 빈 줄로 구분하여 별도의 단락을 만들 수 있습니다. ::: 팁 ⇧ Shift + Return으로 공백 2개와 줄 바꿈을 입력할 수 있습니다. ::: 여기부터 시작할 수 있는 줄이 있습니다. 이 줄은 위의 줄과 두 줄로 분리되어 있으므로 *별도의 단락*이 될 것입니다. 이 행은 또한 별도의 단락으로 시작합니다. 하지만... 이 줄은 두 개의 후행 공백과 하나의 새 줄로만 구분되므로 *동일한 문단*에서 별도의 줄입니다. ::: 팁 후행 공백은 편집기에서 기본적으로 강조 표시됩니다. ::: 주석 설명은 미리보기에 표시되지 않습니다. [comment]: # (이 설명은 미리보기에 나타나지 않습니다) <!-- HTML 주석도 숨겨집니다 --> ::: 팁 노트의 선행 html 주석 블록은 자동 노트 파일 이름 생성에서도 무시됩니다. ::: 확인란 목록 확인란 목록을 사용하여 간단한 작업관리 목록을 작성할 수 있습니다. - [x] 완료 - [ ] 할 일 ::: 팁 미리보기에서 확인란을 선택하거나 선택 취소할 수 있습니다. ::: 전문 QOwnNotes에서 전문 (예: YAML)을 사용하여 추가 메타 정보를 추가할 수 있습니다. 미리보기에 표시되지 않으며 자동 노트 파일 이름 생성을 방해하지 않습니다. # --- 제목: 일부 이름 description: 일부 설명 # 노트 헤드라인이 여기에서 시작됩니다 일부 텍스트 이 예제 노트의 파일 이름은 Note headline starts here.md입니다. 이 페이지를 개선할 수 있도록 도와주세요! (opens new window) ← QOwnNotes 데모 노트 가져오기 → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
