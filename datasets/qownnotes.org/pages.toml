["https://qownnotes.org/installation/building.html"]
title = "Building QOwnNotes | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# Building QOwnNotes # Building from GitHub You can also build QOwnNotes yourself from the source code. Checkout the code directly from the git repository: git clone https://github.com/pbek/QOwnNotes.git -b release cd QOwnNotes git submodule update --init 123For debugging, it's easiest to use QtCreator. When downloading Qt Creator (opens new window), you will also need the package qtwebsockets to build QOwnNotes with Qt6. If you build under Windows, you want to stick to MinGw 64-bit. On Linux, you most likely have a package for QtCreator in your repository. Afterward open the project file src/QOwnNotes.pro and click on Build / Build Project QOwnNotes. If you know what you are doing, you can also build QOwnNotes directly in your terminal: cd src # build binary translation files if you want another language than English lrelease QOwnNotes.pro # prepare build process and build the application qmake make 12345678Please feel free to contribute source code to this project, make suggestions or report troubles on the QOwnNotes issues page (opens new window). Visit QOwnNotes on GitHub (opens new window). TIP If you want to contribute source code to the project please make your pull requests to the main branch. # Source archive You will find source archives of QOwnNotes on QOwnNotes source archive (opens new window). The source archives will be accessible like that: https://github.com/pbek/QOwnNotes/releases/download/v23.7.0/qownnotes-23.7.0.tar.xz # Building with nix If you have the Nix package manager (opens new window) available you can just git-clone the source code, like explained above and build with: # Open a nix-shell to get all needed tools nix-shell # Build the application just nix-build # Run the built application just nix-run 12345678 Help us improve this page! (opens new window) ← Install on FreeBSD Spellchecking → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
