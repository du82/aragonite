full_description = '# Install on Slackware Linux # Slackware 14.2 First you need to install Qt 5, libxkbcommon, libproxy and js185. cd /tmp wget "http://bear.alienbase.nl/mirrors/people/alien/sbrepos/current/x86_64/qt5/qt5-5.6.1_1-x86_64-1alien.txz" wget http://bear.alienbase.nl/mirrors/people/alien/sbrepos/current/x86_64/libxkbcommon/libxkbcommon-0.5.0-x86_64-1alien.txz sudo installpkg libxkbcommon-0.5.0-x86_64-1alien.txz qt5-5.6.1_1-x86_64-1alien.txz slackpkg update slackpkg install libproxy js185-1.0.0-x86_64-1 123456Then you can checkout the QOwnNotes slackbuilds repository and build the application. cd /tmp git clone https://github.com/pbek/qownnotes-slackbuilds.git cd qownnotes-slackbuilds/14.2/qownnotes ./dobuild.sh 1234After that you can install the generated package with installpkg. # Slackware 14.1 First you need to install Qt 5. cd /tmp wget "http://bear.alienbase.nl/mirrors/people/alien/sbrepos/14.1/x86_64/qt5/qt5-5.5.1-x86_64-4alien.txz" sudo installpkg qt5-5.5.1-x86_64-4alien.txz 12Then you can checkout the QOwnNotes slackbuilds repository and build the application. cd /tmp git clone https://github.com/pbek/qownnotes-slackbuilds.git cd qownnotes-slackbuilds/14.1/qownnotes ./dobuild.sh 1234After that you can install the generated package with installpkg. QOwnNotes Slackbuild on GitHub (opens new window) Help us improve this page! (opens new window) ← Install on Void Linux Install on FreeBSD → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!'
