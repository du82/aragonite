["https://qownnotes.org/getting-started/qownnotesapi.html"]
title = "QOwnNotesAPI Nextcloud App | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# QOwnNotesAPI Nextcloud App QOwnNotesAPI (opens new window) can handle the access to trashed notes and note versions for you. TIP You can enable QOwnNotesAPI directly in your Nextcloud or ownCloud instance by searching for qownnotes in your server's Apps page at https://<your-cloud-domain>/settings/apps. Nextcloud Apps page (opens new window) ownCloud Apps page (opens new window) Note sharing is done via the API provided by Nextcloud / ownCloud. Tasks are accessed directly via CalDAV. TIP Use your Nextcloud / ownCloud sync client to sync your notes, your notes are simple markdown files. There is no need to invent the wheel twice. And there are also people who are using different services to sync their note files (like Dropbox, Syncthing or Resilio Sync). # What QOwnNotesAPI does Accessing your trashed notes Accessing your note versions # What QOwnNotesAPI doesn't do Syncing your notes (please use your ownCloud / Nextcloud sync client) Sharing notes (that is done directly via the ownCloud / Nextcloud API) Accessing images from Nextcloud Text (opens new window) (that is done directly via the Nextcloud API) Help us improve this page! (opens new window) ← QOwnNotes Web App Searching for notes → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
