title = "بناء QOwnNotes | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# بناء QOwnNotes # البناء من GitHub يمكنك كذلك بناء QOwnNotes بنفسك من المصدر البرمجي. استنسخ المصدر مباشرةً من مستودع جت: git clone https://github.com/pbek/QOwnNotes.git -b release cd QOwnNotes git submodule update --init 123للتنقيح، من الأسهل استعمال QtCreator. عند تنزيل Qt Creator (opens new window)، ستحتاج كذلك إلى حزمة qtwebsockets لبناء QOwnNotes على Qt6. وإذا كنت تبني على ويندوز، ربما تفضل البقاء مع MinGw 64-bit. على لينكس، غالبا ستجد QtCreator في مستودعات توزيعتك. بعدئذٍ، افتح ملف المشروع src/QOwnNotes.pro وانقر على Build ثم Build Project QOwnNotes. ويمكنك كذلك بناء QOwnNotes من الطرفية إذا كنت تعرف ما تفعل: cd src # ابنِ الملفات الثنائية للترجمات إذا أردت لغة غير الإنجليزية lrelease QOwnNotes.pro # حضّر عملية البناء وابنِ التطبيق qmake make 12345678رجاءً لا تتردد في المشاركة في هذا المشروع بكود برمجي أو اقتراحات أو إبلاغ عن مشاكل على صفحة مسائل QOwnNotes (opens new window). قم بزيارة QOwnNotes على GitHub (opens new window). TIP إذا أردت المساهمة في المشروع بمصدر برمجي، نرجو إنشاء طلبات الجذب إلى الفرع main. # ملفات المصدر البرمجي المضغوطة يمكنك العثور على الملفات المضغوطة لمصدر QOwnNotes في أرشيف مصادر QOwnNotes (opens new window). يمكن الوصول إلى الملفات المضغوطة للكود المصدري برابط مثل هذا: https://github.com/pbek/QOwnNotes/releases/download/v23.7.0/qownnotes-23.7.0.tar.xz # البناء بـ Nix إذا كان لديك مدير الحزم Nix (opens new window) فيمكنك استنساخ المصدر بــجت، كما شُرح بالأعلى، ثم بناءه بالأوامر التالية: # افتح صدفة نِكس لجلب الأدوات المطلوبة nix-shell # ابنِ التطبيق just nix-build # شغّل التطبيق المبني just nix-run 12345678 ساعدنا في تحسين هذه الصفحة! (opens new window) ← التثبيت على FreeBSD التدقيق الإملائي → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
