full_description = "# حالت نمایشی QOwnNotes TIP Note This might not always work, depending on the current state of the demo environment. شما می توانید QOwnNotes را در مرورگر خود و بدون نیاز به نصب با دنبال کردن این دستورالعمل ها امتحان کنید: روی این پیوند بازی با داکر (opens new window) کلیک کنید. 2) روی دکمه ورود / شروع کلیک کرده (گزینه نماگرفت 1) و با حساب کاربری داکر خود وارد شوید (اگر در حال حاضر فاقد آن هستید باید یکی از آن را ایجاد کنید). تا زمانی که محفظه ایجاد شده و بچرخد، منتظر بمانید. سپس حتماً قادر به کلیک روی 6080 در بالای صفحه خواهید بود (گزینه نماگرفت 2). در صورت مواجهه با خطا، لطفاً کمی بیشتر منتظر مانده و سعی کنید دوباره روی 6080 کلیک کنید؛ بارگذاری برای محیط رومیزی کمی به طول می انجامد. یک زبانه مرورگر جدید باید باز شود ک کنده یک میز کار ایجاد می کند. روی نماد دکمه چپ در صفحه نمایش (در نوار وظایف) کلیک کرده، روی لوازم کاربردی رفته و روی QOwnNotes کلیک کنید (گزینه نماگرفت 3). کادر گفتگوی نصب QOwnNotes باید باز شود؛ با کلیک روی آن و فشار دادن پایان پنجره اصلی QOwnNotes را ملاحظه خواهید کرد. در اصلاح این صفحه ما را یاری کنید! (opens new window) ← مفاهیم مارک داون → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
