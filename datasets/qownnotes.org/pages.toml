["https://qownnotes.org/de/getting-started/qownnotesapi.html"]
title = "QOwnNotesAPI Nextcloud App | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# QOwnNotesAPI Nextcloud App QOwnNotesAPI (opens new window) kann den Zugriff auf gelöschte Notizen und Notizversionen für Sie erledigen. TIP Sie können QOwnNotesAPI direkt in Ihrer Nextcloud- oder ownCloud-Instanz aktivieren, indem Sie nach qownnotes auf der Apps-Seite Ihres Servers unter https://<your-cloud-domain>/settings/apps suchen. Nextcloud Apps-Seite (opens new window) ownCloud Apps-Seite (opens new window) Das Teilen von Notizen erfolgt über die von Nextcloud / ownCloud bereitgestellte API. Auf Aufgaben wird direkt über CalDAV zugegriffen. TIP Verwenden Sie Ihren Nextcloud / ownCloud Sync-Client, um Ihre Notizen zu synchronisieren. Ihre Notizen sind einfache Markdown-Dateien. Das Rad muss nicht zweimal erfunden werden. Es gibt auch Leute, die andere Dienste zum Synchronisieren ihrer Notizdateien verwenden (wie Dropbox, Syncthing oder Resilio Sync). # Was QOwnNotesAPI macht Auf Ihre gelöschten Notizen zugreifen Auf Ihre Notizversionen zugreifen # Was QOwnNotesAPI nicht macht Ihre Notizen synchronisieren (bitte verwenden Sie Ihren ownCloud / Nextcloud-Synchronisierungsclient) Notizen teilen (dies erfolgt direkt über die ownCloud- / Nextcloud-API) Auf Ihre Bilder von Nextcloud Text (opens new window) zugreifen (dies erfolgt direkt über die Nextcloud-API.) Hilf uns diese Seite zu verbessern! (opens new window) ← QOwnNotes Web App Nach Notizen suchen → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
