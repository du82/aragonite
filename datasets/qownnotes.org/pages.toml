["https://qownnotes.org/installation/ubuntu.html"]
title = "Install on Ubuntu Linux, elementary OS and Linux Mint | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = '''# Install on Ubuntu Linux, elementary OS and Linux Mint # Ubuntu Linux 18.04 or newer, elementary OS, Linux Mint 18 or newer Install QOwnNotes on Ubuntu Linux (minimum 18.04) using the PPA repository. Note that there are also packages for ARM in the repository, in case you want to use QOwnNotes on a Raspberry Pi. Open a terminal and enter the following lines to add the repository and install QOwnNotes. sudo add-apt-repository ppa:pbek/qownnotes sudo apt-get update sudo apt-get install qownnotes 123Direct Download (opens new window) # QOwnNotes Qt6 Preview If you already want to try the Qt6 packages and are on Ubuntu 22.04 or newer you can use this repository: # Remove Qt5 PPA in case you had it installed sudo add-apt-repository --remove ppa:pbek/qownnotes # Add Qt6 PPA sudo add-apt-repository ppa:pbek/qownnotes-qt6 # Install QOwnNotes sudo apt-get update sudo apt-get install qownnotes 123456789Direct Download (opens new window) If you find any issues please report them on QOwnNotes Issues on GitHub (opens new window)! # Older Ubuntu Linux distributions and derivatives Best try to use the AppImage from QOwnNotes Releases on GitHub (opens new window). Then you can change the execute-permissions on the file: chmod a+x QOwnNotes-*.AppImage 1Afterward you should be able to execute the AppImage to run QOwnNotes. # OBS Repository You may also be able to use the QOwnNotes on Ubuntu versions that aren't anymore updated on Ubuntu Launchpad then you can use the repositories from the Open Build Service (opens new window). Below are example calls for the xUbuntu 20.04 repository. Run the following shell command to trust the repository. wget http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/xUbuntu_20.04/Release.key -O - | sudo apt-key add - 1Run the following shell commands to add the repository and install QOwnNotes from there. sudo su - sh -c "echo 'deb http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/xUbuntu_20.04/ /' >> /etc/apt/sources.list.d/qownnotes.list" apt-get update apt-get install qownnotes 1234Direct Download (opens new window) Help us improve this page! (opens new window) ← Installation Install on Microsoft Windows™ → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!'''
