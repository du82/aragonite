full_description = '# 노트 검색 노트를 검색하거나 노트 내부의 텍스트를 검색하려면 Ctrl + ⇧ Shift + F (또는 MacOS의 경우 ⌘ Cmd + ⇧ Shift + F) 단축키를 사용하여 노트 검색 패널로 이동할 수 있습니다. 노트를 검색하는 방법은 여러 가지가 있습니다: 노트북은 파일 이름이나 노트 텍스트에 노트 또는 북이라는 단어가 있는 노트를 검색합니다 "노트북"은 파일 이름 또는 노트 텍스트에서 텍스트 노트와 정확히 일치하는 노트북을 검색합니다 n:북 또는 이름:북은 노트 이름 또는 파일 이름에 북 이 있는 노트를 검색합니다 이 페이지를 개선할 수 있도록 도와주세요! (opens new window) ← QOwnNotesAPI Nextcloud 앱 단축키 → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!'
