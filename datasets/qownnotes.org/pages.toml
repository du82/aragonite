["https://qownnotes.org/fr/getting-started/web-app.html"]
title = "Application Web QOwnNotes | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# Application Web QOwnNotes Vous pouvez insérer des photos depuis votre téléphone mobile vers la note courante dans QOwnNotes sur l'application de bureau via l'application Web sur app.qownnotes.org (opens new window). L'application Web sur votre téléphone communique avec votre application de bureau QOwnNotes via Internet. La communication entre QOwnNotes et le service Web est chiffrée. Aucune image ne sera stockée sur le serveur. There is a settings page Web application to add support for the web application. N'oubliez pas de copier votre jeton secret depuis la page des paramètres de QOwnNotes vers app.qownnotes. org (opens new window) pour pouvoir communiquer avec votre instance locale de QOwnNotes. Vous pouvez également scanner le jeton à partir du code QR avec votre téléphone dans l'application Web. Vous pouvez trouver le code source de l'application Web sur web-app sur GitHub (opens new window). Vous pouvez également auto-héberger ce service Web, les images Docker fraîchement construites sont disponibles sur qownnotes-web-app sur DockerHub (opens new window). Aidez-nous à améliorer ce site! (opens new window) ← Gestionnaire de snippets en ligne de commande App QOwnNotesAPI Nextcloud → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
