["https://qownnotes.org/fr/getting-started/concept.html"]
title = "Concept | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# Concept # QOwnNotes QOwnNotes stocke les note dans votre dossier de notes sous forme de fichiers Markdown Il peut parler à votre serveur Nextcloud / ownCloud pour partager publiquement des notes avec d'autres personnes Vous pouvez également accéder à l'historique de vos notes et à la corbeille sur votre serveur Nextcloud / ownCloud via l'application QOwnNotesApi Nextcloud Les listes Todo sur votre serveur Nextcloud / ownCloud sont accessibles depuis QOwnNotes QOwnNotes ne synchronise pas vos notes et vos fichiers multimédias / pièces jointes! La synchronisation de fichiers est une entreprise complexe, il existe déjà d'excellentes solutions de synchronisation de fichiers (voir Client de synchronisation de bureau Nextcloud) # Fichiers de notes en Markdown Vous possédez toutes vos notes et fichiers multimédias / pièces jointes! Vos notes sont stockées sous forme de fichiers Markdown en texte brut sur votre ordinateur de bureau Vous pouvez utiliser n'importe quel éditeur de texte que vous aimez à côté de QOwnNotes pour afficher ou modifier vos fichiers de notes Synchronisez vos notes avec d'autres appareils (bureau et mobile) avec votre client de synchronisation Nextcloud (opens new window) ou ownCloud (opens new window) sur votre serveur # Extension de navigateur QOwnNotes Vous pouvez gérer vos signets de navigateur avec QOwnNotes ou l'utiliser comme web clipper. TIP Les extensions de navigateur fonctionnent hors ligne, aucune connexion Internet n'est nécessaire. Veuillez visiter l'extension de navigateur QOwnNotes Web Companion pour plus d'informations. # Gestionnaire d'extraits de commandes en ligne de commande de QOwnNotes Vous pouvez gérer les extraits de commandes avec QOwnNotes et les exécuter depuis la ligne de commande. TIP Veuillez visiter Gestionnaire d’extraits de commandes en ligne de commande QOwnNotes pour plus d'informations. # Client de synchronisation Nextcloud pour ordinateur de bureau Synchronisez vos notes avec d'autres appareils (ordinateur de bureau & mobile), vers votre serveur grâce aux clients Nextcloud (opens new window) ou ownCloud (opens new window). TIP Bien sûr, d'autres solutions comme Dropbox, Syncthing, Seafile ou BitTorrent Sync peuvent également être utilisées pour synchroniser vos notes ou d'autres fichiers. Vous pouvez également utiliser git pour synchroniser, par exemple avec gitomatic (opens new window). # Serveur Nextcloud Pour travailler en ligne avec vos notes vous pouvez utiliser des serveurs, tels que Nextcloud (opens new window) ou ownCloud (opens new window). Vous pouvez héberger votre propre serveur ou faire appel à une solution hébergée. Il existe une liste de fournisseurs Nextcloud gérée par la communauté (opens new window), ainsi qu'une liste d'appareils fonctionnant avec Nextcloud (opens new window). Portknox (opens new window) a signalé qu'ils ont QOwnNotesAPI installé (opens new window). TIP Bien sûr, d'autres solutions comme Dropbox, Syncthing, Seafile ou BitTorrent Sync peuvent également être utilisées pour héberger vos notes ou d'autres fichiers. # App QOwnNotesAPI pour Nextcloud QOwnNotesAPI (opens new window) vous permet d'accéder à vos notes mises à la corbeille et versions de notes côté serveur. TIP Veuillez visiter App QOwnNotesAPI Nextcloud pour plus d'informations. # App serveur Nextcloud Notes Utilisez Nextcloud Notes (opens new window) pour modifier vos notes sur le Web. WARNING Gardez à l'esprit que Nextcloud Notes ne prend actuellement en charge qu'un seul niveau de sous-dossiers. # Nextcloud Deck server app You can use QOwnNotes to quickly create cards in Nextcloud Deck (opens new window). # Nextcloud Notes mobile app To access your Nextcloud / ownCloud notes from your mobile device you can use different apps. # Android Notes Nextcloud pour Android (opens new window)(tiers) TIP You could also use any sync-tool like Synchronize Ultimate or FolderSync to sync your note files and use software like neutriNotes to edit your notes. # iOS CloudNotes pour iOS (opens new window) (tierce partie) TIP You can also use Notebooks (opens new window) and sync your notes via WebDAV, there is a good tutorial at Taking Notes with Nextcloud, QOwnNotes, and Notebooks (opens new window) # api.qownnotes.org This is an online service provided by QOwnNotes to check if there is a new release of the application available. It is talking to GitHub and checks for the latest release, gets a suited download url and compiles the changes from the changelog compared to the version of QOwnNotes you are currently using as html to show in the update dialog. In addition, it also provides the Release RSS Feed (opens new window) and an implementation of the legacy update checking api for older versions of QOwnNotes. TIP You can access the source code for api.qownnotes.org (opens new window) on GitHub (opens new window). # QOwnNotes Web App You can insert photos from your mobile phone into the current note in QOwnNotes on your desktop via the web application on app.qownnotes.org (opens new window). TIP Please visit QOwnNotes Web App for more information. Aidez-nous à améliorer ce site! (opens new window) ← Aperçu Démo QOwnNotes → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
