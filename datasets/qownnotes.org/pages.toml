["https://qownnotes.org/ar/installation/arch.html"]
title = "التثبيت على آرتش لينكس | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# التثبيت على آرتش لينكس # مستودع مستخدمي آرتش (AUR) بدلا من استخدام pacman، توجد أيضا حزمة رسمية من QOwnNotes في AUR؛ تسمى qownnotes. ستجدها هنا: QOwnNotes على AUR (opens new window) قم بمزامنة قاعدة بيانات الحزم وتثبيت الحزمة باستخدام yay: yay -S qownnotes 1TIP إذا أردت تسريع عملية البناء، ربما تحب قراءة CCACHE and AUR (بالإنجليزية) (opens new window). # pacman أضف السطور التالية إلى ملف /etc/pacman.conf لديك بأمر التحرير sudo nano /etc/pacman.conf: [home_pbek_QOwnNotes_Arch_Extra] SigLevel = Optional TrustAll Server = http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Arch_Extra/$arch 123نفّذ الأوامر التالية في الطرفية لاستيثاق المستودع: wget http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Arch_Extra/x86_64/home_pbek_QOwnNotes_Arch_Extra.key -O - | sudo pacman-key --add - sudo pacman-key --lsign-key F2205FB121DF142B31450865A3BA514562A835DB 12إذا فشل الأمر sudo pacman-key --lsign-key F2205FB121DF142B31450865A3BA514562A835DB برسالة تشبه:ERROR: FFC43FC94539B8B0 could not be locally signed. فحاول أن تجد أولا المُعرِّف keyid الفعلي الخاص بالمفتاح الذي تم تنزيله؛ أي بالأمر (والناتج): gpg /path/to/downloaded/home_pbek_QOwnNotes_Arch_Extra.key gpg: WARNING: no command supplied. Trying to guess what you mean ... pub rsa2048 2019-07-31 [SC] [expires: 2021-10-10] F2205FB121DF142B31450865A3BA514562A835DB uid home:pbek OBS Project <home:[email protected]> 12345يمكنك الآن مزامنة قاعدة بيانات الحزم وتثبيت الحزمة باستخدام pacman: sudo pacman -Syy qownnotes 1تنزيل مباشر (opens new window) TIP بالطبع يمكنك أيضا استخدام هذا المستودع مع التوزيعات الأخرى المبنية على آرتش، مثل مانجارو. ساعدنا في تحسين هذه الصفحة! (opens new window) ← التثبيت عبر Nix التثبيت على Solus → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
