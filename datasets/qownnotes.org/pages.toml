full_description = '# التثبيت عبر Nix يمكنك تثبيت QOwnNotes عبر مدير الحزم Nix (opens new window) على NixOS (opens new window)، وعلى توزيعات لينكس الأخرى، وعلى ماك أو إس، وعلى ويندوز. اسم الحزمة هو qownnotes (opens new window). هذه الحزمة مبنية بـ Qt6 وتشمل التكامل مع صدفة fish وصدفة bash. انظر QOwnNotes على nix (opens new window) للمزيد من المعلومات. بعدئذٍ يمكنك تشغيل QOwnNotes بالأمر qownnotes أو الأمر QOwnNotes. TIP يمكن أيضا تثبيت مدير قصاصات QOwnNotes لسطر الأوامر (qc (opens new window)) عبر متجر Nix (opens new window). يمكنك تجربته بالأمر nix-shell -p qc --run "qc exec". TIP Info On macOS the package works natively on x86 and Apple Silicon! ساعدنا في تحسين هذه الصفحة! (opens new window) ← التثبيت كـ AppImage التثبيت على آرتش لينكس → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!'
