["https://qownnotes.org/installation/opensuse.html"]
title = "Install on openSUSE Linux | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# Install on openSUSE Linux # On every openSUSE version You can install QOwnNotes using the OBS Package Installer (opens new window) tool. Run the following shell commands as root to install opi: zypper install opi 1Then install QOwnNotes with it: opi qownnotes 1WARNING This tool will query the entire OBS service so be sure to choose qownnotes, and not qownnotes-lang if asked. Also check that the chosen repo is the official home:pbek:QOwnNotes and not a third-party one. TIP You need to choose the option to keep the repository after installation to get updates. # openSUSE Leap 15.6 Run the following shell commands as root to add the repository and install QOwnNotes from there. zypper addrepo -f http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/15.6/home:pbek:QOwnNotes.repo zypper refresh zypper install qownnotes 123Direct Download (opens new window) # openSUSE Leap 15.5 Run the following shell commands as root to add the repository and install QOwnNotes from there. zypper addrepo -f http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/15.5/home:pbek:QOwnNotes.repo zypper refresh zypper install qownnotes 123Direct Download (opens new window) # openSUSE Leap 15.4 Run the following shell commands as root to add the repository and install QOwnNotes from there. zypper addrepo -f http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/15.4/home:pbek:QOwnNotes.repo zypper refresh zypper install qownnotes 123Direct Download (opens new window) # openSUSE Leap 15.3 Run the following shell commands as root to add the repository and install QOwnNotes from there. zypper addrepo -f http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/openSUSE_Leap_15.3/home:pbek:QOwnNotes.repo zypper refresh zypper install qownnotes 123Direct Download (opens new window) # openSUSE Leap 15.2 Run the following shell commands as root to add the repository and install QOwnNotes from there. zypper addrepo -f http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/openSUSE_Leap_15.2/home:pbek:QOwnNotes.repo zypper refresh zypper install qownnotes 123Direct Download (opens new window) # openSUSE Tumbleweed Run the following shell commands as root to add the repository and install QOwnNotes from there. zypper addrepo -f http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/openSUSE_Tumbleweed/home:pbek:QOwnNotes.repo zypper refresh zypper install qownnotes 123Direct Download (opens new window) # SLE 15 Run the following shell commands as root to add the repository and install QOwnNotes from there. zypper addrepo -f http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/SLE_15/home:pbek:QOwnNotes.repo zypper refresh zypper install qownnotes 123Direct Download (opens new window) Help us improve this page! (opens new window) ← Install on Debian Linux Install on Fedora Linux → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
