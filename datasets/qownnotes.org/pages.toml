title = "المفاهيم | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# المفاهيم # QOwnNotes QOwnNotes يخزن الملاحظات في مجلد ملاحظاتك كملفات ماركداون (Markdown) يستطيع التواصل مع خادم Nextcloud أو ownCloud الخاص بك حتى يشارك ملاحظاتك علنًا مع الناس الآخرين تستطيع أيضا الوصول إلى تاريخ ملاحظاتك وملاحظاتك المهملة على خادم Nextcloud أو ownCloud الخاص بك عبر QOwnNotesApi Nextcloud app يمكن الوصول إلى قوائم مهامك على خادم Nextcloud أو ownCloud من داخل QOwnNotes QOwnNotes لا يزامن ملاحظاتك ولا ملفات الوسائط أو المرفقات! مزامنة الملفات هي مَسعًى معقد، ويوجد بالفعل حلول مزامنة ملفات عظيمة (انظر عميل مزامنة Nextcloud الحاسوبي) # ملفات ملاحظات ماركداون أنت تملك جميع ملاحظاتك وملفات وسائطك ومرفقاتك! يتم تخزين ملاحظاتك كملفات نصية مجردة بصيغة ماركداون على حاسوبك تستطيع استخدام أي محرر نصوص تريده بجانب QOwnNotes لعرض أو تعديل ملفات ملاحظاتك زامن ملاحظاتك مع الأجهزة الأخرى (الحاسوب والمحمول) باستخدام عميل مزامنة Nextcloud (opens new window) أو ownCloud (opens new window) مع خادمك # إضافة متصفح QOwnNotes يمكنك استخدام QOwnNotes لإدارة إشارات المتصفح المرجعية أو كـمقص ويب. TIP إضافة المتصفح تعمل بدون اتصال بالإنترنت. برجاء زيارة إضافة المتصفح رفيقة ويب QOwnNotes للمزيد من المعلومات. # مدير قصاصات سطر أوامر QOwnNotes يمكنك إدارة قصاصات الأوامر الخاصة بك باستخدام QOwnNotes وتنفيذها في سطر الأوامر. TIP برجاء زيارة مدير قصاصات سطر أوامر QOwnNotes لمزيد من المعلومات. # عميل مزامنة Nextcloud الحاسوبي زامن ملاحظاتك مع الأجهزة الأخرى (الحاسوب والمحمول) باستخدام عميل مزامنة Nextcloud (opens new window) أو ownCloud (opens new window) مع خادمك. TIP بالطبع يمكن استخدام حلول أخرى، مثل Dropbox أو Syncthing أو Seafile أو BitTorrent Sync، لمزامنة ملاحظاتك والملفات الأخرى. يمكنك أيضا استخدام git للمزامنة باستخدام أدوات مثل gitomatic (opens new window). # خادم Nextcloud حتى تعمل مع ملاحظاتك على الإنترنت، يمكنك استخدام خوادم مثل Nextcloud (opens new window) أو ownCloud (opens new window). يمكنك استضافة خادمك الخاص أو استخدام الحلول المستضافة. يتعهد المجتمع قائمة بمزوّدي Nextcloud (opens new window)، بالإضافة إلى قائمة أجهزة بـ Nextcloud (opens new window). يقال إن Portknox (opens new window) لديهم QOwnNotesAPI مثبتًا (opens new window). TIP بالطبع يمكن استخدام حلول أخرى، مثل Dropbox أو Syncthing أو Seafile أو BitTorrent Sync، لاستضافة ملاحظاتك والملفات الأخرى. # QOwnNotesAPI Nextcloud app يتيح لك QOwnNotesAPI (opens new window) الوصول إلى ملاحظاتك المهملة ونسخ ملاحظاتك الموجودة على الخادم. TIP برجاء زيارة QOwnNotesAPI Nextcloud App للمزيد من المعلومات. # تطبيق خادم Nextcloud Notes استخدم Nextcloud Notes (opens new window) لتحرير ملاحظاتك على الويب. WARNING تذكر أن Nextcloud Notes حاليا يدعم مستوى واحد من المجلدات الفرعية كحد أقصى. # تطبيق خادم Nextcloud Deck يمكنك استخدام QOwnNotes لإنشاء بطاقات في Nextcloud Deck (opens new window) بسرعة. # تطبيق محمول Nextcloud Notes للوصول إلى ملاحظاتك على Nextcloud أو ownCloud من جهازك المحمول، يمكنك استخدام تطبيقات مختلفة. # أندرويد Nextcloud Notes لأندرويد (opens new window) (من طرف ثالث) TIP يمكنك أيضا استخدام أي أداة مزامنة مثل Synchronize Ultimate أو FolderSync لمزامنة ملفات ملاحظاتك، وتطبيق مثل neutriNotes لتحريرها. # آي أو إس CloudNotes لآي أو إس (opens new window) (من طرف ثالث) TIP يمكنك أيضا استخدام Notebooks (opens new window) ومزامنة ملاحظاتك عبر WebDAV؛ هذا درس جيد (بالإنجليزية):Taking Notes with Nextcloud, QOwnNotes, and Notebooks (opens new window) # api.qownnotes.org هذه خدمة شبكية يقدمها QOwnNotes للتحقق من وجود إصدارات جديدة من التطبيق. إنها تسأل GitHub عن آخر إصدار، وتحصل على رابط تنزيل مناسب، وتُجمّع التغييرات من سجل التغييرات بالمقارنة مع نسخة QOwnNotes التي تستخدمها حاليا، وتجعلها في صيغة HTML لعرضها لك في حوار التحديث. بالإضافة إلى ذلك فإنها أيضا توفر موجز RSS للإصدارات (opens new window)، ونسخة من واجهة API القديمة الخاصة بالتحديث لنسخ QOwnNotes القديمة. TIP يمكنك الوصول إلى كود مصدر api.qownnotes.org (opens new window) على GitHub (opens new window). # تطبيق ويب QOwnNotes يمكنك إضافة صور من هاتفك المحمول إلى الملاحظة الحالية في QOwnNotes على حاسوبك عبر تطبيق الويب على app.qownnotes.org (opens new window). TIP برجاء زيارة تطبيق ويب QOwnNotes للمزيد من المعلومات. ساعدنا في تحسين هذه الصفحة! (opens new window) ← نظرة عامة تجربة QOwnNotes → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
