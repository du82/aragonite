["https://qownnotes.org/it/getting-started/importing-notes.html"]
title = "Importare le note | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# Importare le note # Evernote C'è una voce per importare le note di Evernote che puoi raggiungere in Nota / Importa menù per importare * File Enex di Evernote * files. Saranno automaticamente importati anche immagini, allegati, etichette, formattazione standard e i metadati. # Joplin C'è una voce per importare le note di Joplin che puoi raggiungere nel menù in Nota / Importa. # Various Formats The command line tool jimmy (opens new window) can convert various formats to Markdown (such as Google Keep (opens new window), Synology Note Station (opens new window) and more (opens new window)). To preserve as much metadata as possible, it's recommended to apply additional tweaks (opens new window). If there are any issues with the conversion, feel free to open a ticket at GitHub (opens new window). # Google Keep Scarica i Task di Keep usando Google Takeout Estrai un archivio Scarica keep_to_markdown.py nella cartella dov'è stata estratta la cartella di Keep python keep_to_markdown.py Keep out/ Sostituisci Keep con la cartella contenente i file nel formato JSON. La cartella di output verrà creata se non esistente. From https://gitlab.com/-/snippets/2002921 (opens new window) # Tomboy Puoi importare le note di Tomboy tramite uno script chiamato Trombone (opens new window). Potresti dover installare python2 per far funzionare lo script. Convertirà le tue note di Tomboy in un file Enex di Evernote, che potrai importare su QOwnNotes. Per chiunque desideri farlo, assicurati prima di aver installato Python2, inoltre potresti dover installare anche python-is-python2 (puoi rimuoverlo in seguito). Potrebbe essere più facile e sicuro farlo all'interno dell'ambiente chroot o in un container Docker, se ne hai possibilità (sarà descritto qui prossimamente). sudo apt install python2 python-is-python2 1Scarica il file trombone da GitHub, estrailo e entra in quella cartella: cd ~/Downloads/trombone-master sudo make sudo make install 1234Dunque fai il comando cd all'interno della cartella in cui si trovano le tue note di Tomboy: cd ~/.local/share/tomboy/ 1Quindi esegui: find ./ -type f -name '*.note' -print0 | xargs -0 trombone > EXPORT.enex 1Se ricevi errori Unicode su note specifiche, rimuovi ognuna di queste note ed esegui di nuovo la conversione finché non viene visualizzato un messaggio che dice Salvataggio in corso .... Avrai un file chiamato EXPORT.enex che può essere importato in QOwnNotes. Durante l'importazione in QOwnNotes potresti dover deselezionare tutti gli attributi da importare tranne forse la data di creazione/modifica, poiché Tomboy non comprende questi attributi. Aiutaci a migliorare questo sito! (opens new window) ← Markdown Parametri dell'interfaccia della riga di comando → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
year_published = 2025
clearnet = "https://qownnotes.org/it/getting-started/importing-notes.html"
