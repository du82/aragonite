title = "개요 | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# 개요 마크다운 강조 표시, 색상 태그 및 하위 폴더를 사용하여 노트 편집 Q가 사용되는 Qt framework (opens new window) Own 자신의 노트를 소유하고 있으므로 소유 Notes 노트를 위한 노트 QOwnNotes (opens new window)는 GNU/리눅스, macOS 및 Windows용 응용 프로그램을 사용하는 오픈 소스 (GPL) 일반 텍스트 파일 마크다운 노트로, (선택적으로) Nextcloud (opens new window) 및 ownCloud (opens new window)의 Notes 응용 프로그램 (opens new window)과 함께 작동합니다. ::: 팁 Telegram 그룹 (opens new window)에 가입하여 QOnNotes 커뮤니티에 대해 토론하고, 배우고, 연결하십시오. ::: QOwnNotes의 개념 이해 # 기능 가져오기 없이 기존 텍스트 또는 마크다운 파일을 사용할 수 있습니다 QOwnNotes는 C++로 작성되었으며 낮은 리소스 소비에 최적화되어 있습니다 (CPU 및 메모리 사용량이 많은 일렉트론 앱 없음) Evernote 및 Joplin 가져오기 Nextcloud / ownCloud 및 모바일의 노트 (opens new window) 응용 프로그램 및 Nextcloud 텍스트와 호환 가능 Nextcloud Deck (opens new window)카드를 생성하여 노트에 연결 ownCloud / Nextcloud 서버에서 노트 공유 지원 Nextcloud / ownCloud 할 일 목록 (Nextcloud 작업 또는 Tasks Plus / Calendar Plus)를 관리하거나 다른 CalDAV 서버를 사용하여 작업을 동기화할 수 있습니다 이전 버전 의 노트를 Nextcloud / ownCloud에서 복원할 수 있습니다 폐기된 노트는 Nextcloud / ownCloud 서버에서 복원할 수 있습니다 노트 파일의 외부 변경 사항이 감시됩니다 (노트 또는 노트 목록이 다시 로드됨) 계층적 노트 태깅 및 노트 하위 폴더 지원 노트의 옵션인 ** 암호화 가 내장되어 있거나, Keybase.io (opens new window)( encryption-keybase.qml (opens new window)) 또는 ** PGP( encryption-pgp.qml (opens new window))와 같은 사용자 지정 암호화 방법을 사용할 수 있습니다 노트 폴더는 자유롭게 선택할 수 있습니다 (여러 개의 노트 폴더를 사용할 수 있음) 노트에서 단어의 일부를 검색할 수 있으며 검색 결과가 노트에서 강조 표시됩니다 선택한 텍스트에서 노트 추가, 스크린샷 만들기 또는 북마크를 관리하는 브라우저 확장 맞춤법 검사 지원 USB 스틱에 QOwnNotes를 휴대하기 위한 휴대용 모드 스크립트 지원 및 응용 프로그램 내부에 스크립트를 설치할 수 있는 온라인 스크립트 저장소 (opens new window) 스크립트에 사용할 OpenAI 완료 API 구현 (opens new window) Vim 모드 바탕 화면의 QOwnNotes에서 휴대폰의 사진을 현재 노트에 삽입하는 웹 응용 프로그램 # 외관 노트의 마크다운 강조 표시 및 마크다운 미리 보기 모드 어두운 모드 테마 지원 마크다운 구문 강조에 대한 디밍 지원 모든 패널은 원하는 위치에 배치할 수 있으며, 플로팅 또는 스택 (완전 도킹 가능) 도 가능합니다 **무료 데스크톱 테마 아이콘 **을 지원하므로 **기본 바탕 화면 아이콘 ** 및 즐겨찾는 어두운 바탕 화면 테마와 함께 QOnNotes를 사용할 수 있습니다 무장애 모드, 전체 화면 모드 및 타이프라이터 모드 줄 번호 현재 노트와 외부적으로 변경된 노트 간의 차이가 대화 상자에 표시됩니다 # 언어 영어, 한국어, 독일어, 프랑스어, 폴란드어, 중국어, 일본어, 러시아어, 포르투갈어, 헝가리어, 네덜란드어 및 스페인어와 같은 60개 이상의 다양한 언어로 제공됩니다 이러한 번역을 개선하거나 QOnNotes를 더 많은 언어로 번역할 수 있도록 도움을 주시면 감사하겠습니다 이 페이지를 개선할 수 있도록 도와주세요! (opens new window) 개념 → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
