["https://qownnotes.org/nl/getting-started/overview.html"]
title = "Overzicht | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# Overzicht Bewerk uw notities met markdown-markering, gekleurde tags en submappen Q voor het Qt framework (opens new window) dat wordt gebruikt Own omdat je je eigen notities bezit Notes voor de notities die u maakt QOwnNotes (opens new window) is het open source (GPL) platte tekstbestand markdown notitie-applicatie voor GNU / Linux, MacOS en Windows, die (optioneel) samenwerkt met de notitietoepassing (opens new window) van Nextcloud (opens new window) en ownCloud (opens new window) (opent nieuw venster). TIP Word lid van onze Telegram Group (opens new window) om te discussiëren, te leren en contact te maken met de QOwnNotes-gemeenschap. Begrijp het concept van QOwnNotes # Kenmerken U kunt uw bestaande tekst- of markdown-bestanden gebruiken. U hoeft niets te importeren QOwnNotes is geschreven in C++ en geoptimaliseerd voor laag verbruik van bronnen (geen CPU en geheugenverslindende Electron-app) Evernote en Joplin importeren Compatibel met de Notities (opens new window) applicatie van Nextcloud / ownCloud en mobile en Nextcloud Text Maak Nextcloud Deck (opens new window) kaarten aan en koppel ernaar in je notities Ondersteuning voor Delen van notities op uw OwnCloud / Nextcloud server Beheer uw Nextcloud / ownCloud todolijsten (**Nextcloud-taken ** of Tasks Plus / Calendar Plus) of gebruik een andere CalDAV-server om uw taken te synchroniseren Verouderde versies van uw notities kunnen hersteld worden vanaf uw **Nextcloud / ownCloud **server Gewiste notities kunnen worden hersteld vanaf uw Nextcloud / ownCloud server Externe wijzigingen van notitiebestanden worden bewaakt (notities of notitielijsten worden opnieuw geladen) Ondersteuning voor hiërarchische labeling van notities en notitie-submappen Optionele versleuteling van notities. AES-256 is ingebouwd, of u kunt aangepaste coderingsmethoden gebruiken zoals Keybase.io (opens new window) (encryption-keybase.qml (opens new window)) of PGP (encryption-pgp.qml (opens new window)) De Notites-map is vrij te kiezen (meerdere mappen met notities zijn ook mogelijk) Het zoeken naar delen van woorden in notities is mogelijk en zoekresultaten worden gemarkeerd in de notities Browser-extensie om notities toe te voegen uit geselecteerde tekst, maak schermopnamen of beheer uw bladwijzers Ondersteuning voor Spellingcontrole Portable modus om QOwnNotes mee te nemen op USB-sticks Ondersteuning voor Scripting en een online scriptrepository (opens new window) waar u scripts in de applicatie kunt installeren Implementatie van de OpenAI completion API (opens new window) voor het gebruik in scripts Vim-modus Webapplicatie om foto's van uw mobiele telefoon toe te voegen in de huidige notitie in QOwnNotes op uw PC/laptop # Uiterlijk Markdown-markering van notities en een markdown-voorbeeldmodus Thema-ondersteuning voor donkere modus Ondersteuning voor Thema's bij de Markdown syntaxisaccentuering Alle panelen kunnen worden geplaatst waar u maar wilt, ze kunnen zelfs zweven of stapelen (volledig dockbaar) Ondersteuning voor freedesktop-themapictogrammen, u kunt QOwnNotes gebruiken met uw native bureaubladpictogrammen en met uw favoriete donkere bureaubladthema Distraction free mode, Full-screen mode en Typewriter mode Regelnummers Verschillen tussen huidige notitie en extern gewijzigde notitie worden getoond in een dialoogvenster # Talen Beschikbaar in meer dan 60 verschillende talen zoals Engels, Duits, Frans, Pools, Chinees, Japans, Russisch, Portugees, Hongaars, Nederlands en Spaans Uw hulp wordt zeer op prijs gesteld om deze vertalingen te verbeteren of om QOwnNotes in meer talen te vertalen Help ons deze pagina te verbeteren! (opens new window) Concept → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
