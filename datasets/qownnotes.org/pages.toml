["https://qownnotes.org/nl/getting-started/web-app.html"]
title = "QOwnNotes-webapp | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# QOwnNotes-webapp U kunt foto's van uw mobiele telefoon invoegen in de huidige notitie in QOwnNotes op uw desktop via de webapplicatie op app.qownnotes.org (opens new window). De webtoepassing op uw telefoon communiceert via internet met uw QOwnNotes-desktoptoepassing. De communicatie tussen QOwnNotes en de webservice is transport versleuteld. Er worden geen afbeeldingen op de server opgeslagen. Er is een instellingenpagina Webapplicatie om ondersteuning voor de webapplicatie toe te voegen. Vergeet niet uw geheime token te kopiëren van de instellingenpagina van QOwnNotes naar app.qownnotes.org (opens new window) om te kunnen communiceren met uw lokale instantie van QOwnNotes. U kunt de token van de QR-code ook scannen met uw telefoon in de webapplicatie. Je kunt de broncode van de webapplicatie vinden op web-app op GitHub (opens new window). U kunt deze webservice ook zelf hosten, de pas gebouwde docker-afbeeldingen zijn beschikbaar op qownnotes-web-app op DockerHub (opens new window). Help ons deze pagina te verbeteren! (opens new window) ← Command-line Snippet Manager QOwnNotesAPI Nextcloud App → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
