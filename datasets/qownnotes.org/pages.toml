["https://qownnotes.org/ar/getting-started/overview.html"]
title = "نظرة عامة | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# نظرة عامة تحرير ملاحظاتك مع تلوين ماركداون ووسوم ملونة ومجلدات فرعية Q نسبةً إلى إطار عمل Qt (opens new window) المستخدم Own لأنك أنت من يملك ملاحظاتك Notes للملاحظات التي تدوّنها QOwnNotes (opens new window) هو تطبيق حر ومفتوح المصدر (بترخيص GPL) لتدوين الملاحظات بصيغة ماركداون في ملفات نصية مجردة، لأنظمة غنو/لينكس وماك أو إس وويندوز، والذي (اختياريًا) يعمل مع تطبيق Notes (opens new window) من Nextcloud (opens new window) و ownCloud (opens new window). TIP انضم إلى مجموعتنا على تيليجرام (opens new window) للنقاش والتعلم والتواصل مع مجتمع QOwnNotes. نظرة على مفاهيم QOwnNotes # الخصائص يمكنك استخدام ملفاتك الحالية، النصية أو التي بصيغة ماركداون؛ لا تحتاج إلى استيرادها QOwnNotes مكتوب بلغة سي++ ومحسَّن لتقليل استهلاك الموارد (ليس تطبيق Electron متعطش للذاكرة والمعالج) استيراد من Evernote و Joplin متوافق مع تطبيق Notes (opens new window) من Nextcloud / ownCloud والمحمول وكذلك Nextcloud Text أنشئ بطاقات Nextcloud Deck (opens new window) وأضف روابط إليهم في ملاحظاتك دعم مشاركة الملاحظات على خادم ownCloud أو Nextcloud الخاص بك إدارة قوائم مهامك على Nextcloud أو ownCloud (تطبيقات Nextcloud tasks أو Tasks Plus أو Calendar Plus)، أو استخدام خادم CalDAV آخر لمزامنة مهامك معه النسخ الأقدم من ملاحظاتك يمكن استعادتها من خادم Nextcloud أو ownCloud الخاص بك الملاحظات المهملة يمكن استعادتها من خادم Nextcloud أو ownCloud الخاص بك التعديلات خارج التطبيق على ملفات الملاحظات يتم مراقبتها (ويتم إعادة تحميل الملاحظة أو قائمة الملاحظات) دعم الوسوم الهرمية للملاحظات وكذلك المجلدات الفرعية للملاحظات تعمية اختيارية للملاحظات؛ يتضمن التطبيق خوارزمية AES-256، لكن يمكنك استخدم طريقة تعمية مخصصة مثل Keybase.io (opens new window) (انظر encryption-keybase.qml (opens new window)) أو PGP (انظر encryption-pgp.qml (opens new window)) مجلد الملاحظات يمكن اختياره بحرية (يمكن اختيار مجلدات متعددة للملاحظات) إمكانية البحث بأجزاء الكلمات في الملاحظات، وتظليل نتائج البحث فيها إضافة للمتصفح حتى يمكنك إضافة ملاحظات من النص المحدد أو أخذ لقطات شاشة أو إدارة إشاراتك المرجعية دعم التدقيق الإملائي الوضع المحمول لحمل QOwnNotes على وحدة تخزين USB والتنقل به قابلية البرمجة وكذلك مستودع بُريمِجات (opens new window) على الإنترنت، حيث يمكنك تثبيت البُريمِجات من داخل التطبيق دعم API الإكمال بالذكاء المصطنع من OpenAI (opens new window) لاستعماله في البرمجة وضع Vim تطبيق ويب ليمكنك إضافة صور من محمولك إلى الملاحظة الحالية في QOwnNotes على حاسوبك # المظهر تلوين ماركداون للملاحظات ووضع معاينة لماركداون دعم سِمة الوضع المظلم دعم السمات في تلوين ماركداون جميع اللوحات تستطيع وضعها أينما شئت؛ يمكن حتى جعلها حرة طافية أو مرصوصة (قابلة للتركيب) دعم أيقونات سمات فري دسكتوب؛ يمكنك حتى استخدام QOwnNotes مع أيقونات سطح مكتبك الأصيلة وسمة سطح مكتبك المظلمة المفضلة الوضع الخالي من المشوشات، ووضع ملء الشاشة، ووضع الآلة الكاتبة ترقيم السطور الفروقات بين الملاحظة الحالية والملاحظة المعدّلة خارج التطبيق تظهر في صندوق حوار # اللغات متاح بأكثر من ٦٠ لغة مختلفة مثل العربية والإنجليزية والفرنسية والألمانية والإسبانية والبولندية والصينية واليابانية والروسية والبرتغالية والمجرية والهولندية مساعدتك مرحب بها جدا لتحسين هذه الترجمات أو لترجمة QOwnNotes إلى لغات أخرى ساعدنا في تحسين هذه الصفحة! (opens new window) المفاهيم → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
