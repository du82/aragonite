full_description = '''# Control de versiones de Git Puede configurar QOwnNotes para que realice cambios de los commits automáticamente en su carpeta de notas localmente a un repositorio de git en su carpeta de notas. Esto puede realizarse en la configuración de Control de versiones de Git en la Configuración general. Necesita tener git instalado en su sistema, y el ejecutable de git necesita estar en su ruta PATH. También puede establecer la ruta del ejecutable de git en la configuración de Control de versiones de Git. ¡También necesita activar el soporte de git para cada carpeta de notas si desea usar el control de versiones de git en ellas! TIP Don't forget to set your git username and email address in the terminal: git config --global user.email "[email protected]" git config --global user.name "Tu nombre" 12 ¡Ayúdanos a mejorar este sitio! (opens new window) ← Atajos Instalación → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!'''
