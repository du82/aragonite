full_description = '''# التثبيت على Raspberry Pi OS # Raspberry Pi OS 12 نفّذ الأوامر التالية في الطرفية لاستيثاق المستودع. wget http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Raspbian_12/Release.key -O - | sudo apt-key add - 1نفّذ الأوامر التالية في الطرفية لإضافة المستودع وتثبيت QOwnNotes منه. sudo bash -c "echo 'deb http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Raspbian_12/ /' >> /etc/apt/sources.list.d/qownnotes.list" sudo apt-get update sudo apt-get install qownnotes 123تنزيل مباشر (opens new window) # Raspberry Pi OS 11 نفّذ الأوامر التالية في الطرفية لاستيثاق المستودع. wget http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Raspbian_11/Release.key -O - | sudo apt-key add - 1نفّذ الأوامر التالية في الطرفية لإضافة المستودع وتثبيت QOwnNotes منه. sudo bash -c "echo 'deb http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Raspbian_11/ /' >> /etc/apt/sources.list.d/qownnotes.list" sudo apt-get update sudo apt-get install qownnotes 123تنزيل مباشر (opens new window) # Raspberry Pi OS 10 نفّذ الأوامر التالية في الطرفية لاستيثاق المستودع. wget http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Raspbian_10/Release.key -O - | sudo apt-key add - 1نفّذ الأوامر التالية في الطرفية لإضافة المستودع وتثبيت QOwnNotes منه. sudo bash -c "echo 'deb http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Raspbian_10/ /' >> /etc/apt/sources.list.d/qownnotes.list" sudo apt-get update sudo apt-get install qownnotes 123تنزيل مباشر (opens new window) # Raspbian 9.0 نفّذ الأوامر التالية في الطرفية لاستيثاق المستودع. wget http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Raspbian_9.0/Release.key -O - | sudo apt-key add - 12نفّذ الأوامر التالية في الطرفية لإضافة المستودع وتثبيت QOwnNotes منه. sudo bash -c "echo 'deb http://download.opensuse.org/repositories/home:/pbek:/QOwnNotes/Raspbian_9.0/ /' >> /etc/apt/sources.list.d/qownnotes.list" sudo apt-get update sudo apt-get install qownnotes 123تنزيل مباشر (opens new window) ساعدنا في تحسين هذه الصفحة! (opens new window) ← التثبيت على CentOS Linux التثبيت على Gentoo Linux → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!'''
