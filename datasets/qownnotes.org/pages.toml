full_description = "# QOwnNotesAPI Nextcloud App QOwnNotesAPI (opens new window) może obsłużyć dla Ciebie dostęp do notatek w koszu i wersji notatek. TIP Możesz włączyć QOwnNotesAPI bezpośrednio w instancji Nextcloud lub ownCloud, wyszukując qownnotes na stronie Aplikacje Twojego serwera pod adresem https://<your-cloud-domain>/settings/apps. Strona aplikacji NextCloud (opens new window) strona ownCloud Apps (opens new window) Udostępnianie notatek odbywa się za pośrednictwem interfejsu API dostarczanego przez Nextcloud / ownCloud. Dostęp do zadań można uzyskać bezpośrednio przez CalDAV. TIP Użyj swojego Nextcloud / ownCloud klienta synchronizacji do synchronizacji notatek, Twoje notatki są prostymi plikami przecen. Nie ma potrzeby dwukrotnego wymyślania koła. Są też ludzie, którzy używają różnych usług do synchronizacji ich pliki notatek (takie jak Dropbox, Syncthing lub Resilio Sync). # Co robi QOwnNotesAPI Uzyskiwanie dostępu do usuniętych notatek Uzyskiwanie dostępu do wersji notatek # Czego nie robi QOwnNotesAPI Synchronizowanie notatek (użyj własnego klienta synchronizacji Cloud / Nextcloud) Udostępnianie notatek (odbywa się to bezpośrednio przez ownCloud / Nextcloud API) Uzyskiwanie dostępu do obrazów z Nextcloud Text (opens new window) (odbywa się to bezpośrednio przez API Nextcloud) Pomóż nam ulepszyć tę stronę! (opens new window) ← QOwnNotes Web App Wyszukiwanie notatek → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
