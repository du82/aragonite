["https://qownnotes.org/pl/getting-started/cli-parameters.html"]
title = "Argumenty interfejsu wiersza poleceń | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# Argumenty interfejsu wiersza poleceń Możesz użyć tych parametrów w interfejsie wiersza poleceń (CLI), aby kontrolować zachowanie aplikacji: Parametr Opis --help Wyświetla ekran pomocy --version Wyświetla numer wersji aplikacji --portable Uruchamia aplikację w trybie przenośnym --clear-settings Czyści ustawienia i uruchamia aplikację --dump-settings Wyświetla zrzut ustawień i innych informacji o programie i środowisku w formacie GitHub Markdown, a następnie zamyka program. --session <name> Uruchamia aplikację w innym kontekście – dotyczy ustawień i plików wewnętrznych. --allow-multiple-instances Pozwala na uruchomienie kilku instancji QOwnNotes, nawet jeśli jest to niedozwolone w ustawieniach. --action <name> Uruchamia akcję menu po uruchomieniu aplikacji (patrz poniżej) --completion <shell> Generate shell completion code. Supports fish, bash. TIP Jeśli napotkasz problemy z instalacją QOwnNotes, możesz uruchomić aplikację ze świeżymi ustawieniami bez utraty bieżących ustawień, używając parametru --session. QOwnNotes --session test 1 Możesz uruchomić aplikację poprzez wiersz poleceń na różnych systemach operacyjnych: System operacyjny Komenda Linux QOwnNotes (lub qownnotes jeśli zainstalowany jako snap) macOS /Applications/QOwnNotes.app/Contents/MacOS/QOwnNotes Windows QOwnNotes.exe TIP To directly copy the settings dump to the clipboard to post in a GitHub issue (opens new window) you can use xclip or xsel on Linux, pbcopy on macOS and clip on Windows: # Copy the settings dump to the clipboard with xclip on Linux QOwnNotes --dump-settings | xclip -selection clipboard # Copy the settings dump to the clipboard with xsel on Linux QOwnNotes --dump-settings | xsel --clipboard # Copy the settings dump to the clipboard with pbcopy on macOS QOwnNotes --dump-settings | pbcopy # Copy the settings dump to the clipboard with clip on Windows QOwnNotes --dump-settings | clip 1234567891011 # Wyzwalaj akcje menu po uruchomieniu Za pomocą parametru --action <name> możesz wywołać akcje menu po uruchomieniu aplikacji. Na przykład, aby otworzyć okno dialogowe listy rzeczy do zrobienia po uruchomieniu, użyj: QOwnNotes --action actionShow_Todo_List 1::: Wskazówka You can get the object names of the menu action from mainwindow.ui (opens new window). Po prostu wyszukaj tytuł menu w języku angielskim. Pamiętaj, że te teksty mogą się zmieniać w czasie. ::: Aby uruchomić działania skryptowe użyj customAction_, po którym następuje identyfikator akcji niestandardowej. Identyfikator akcji niestandardowej jest pierwszym parametrem wywołania script.registerCustomAction w skrypcie. Na przykład, aby uruchomić niestandardową akcję myAction, uruchom QOwnNotes w ten sposób: QOwnNotes --action customAction_myAction 1TIP Jeśli uruchomisz QOwnNotes po raz drugi z parametrem akcji i zezwolisz tylko na jedną instancję aplikacji, akcja menu zostanie wyzwolona w pierwszej instancji. Pomóż nam ulepszyć tę stronę! (opens new window) ← Importowanie notatek Rozszerzenie przeglądarki QOwnNotes Web Companion → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
