full_description = "# Demo de QOwnNotes TIP Nota Es posible que esto no siempre funcione, dependiendo del estado actual del entorno de la demostración. Puede probar QOwnNotes en su navegador web sin instalarlo siguiendo estas instrucciones: Haga clic en este enlace Reproducir con Docker (opens new window). 2) Haga clic en el botón Iniciar sesión / Iniciar (consulte la viñeta de captura de pantalla 1) e inicie sesión con su cuenta de Docker (debe crear una si aún no tiene una). Espere hasta que el contenedor sea creado e iniciado. Entonces debería poder hacer clic en 6080 en la parte superior (vea la viñeta de captura de pantalla 2). Si recibe un error, espere un poco más e intente hacer clic en 6080 nuevamente, el entorno de escritorio demora un poco en cargarse. Debería abrirse una nueva pestaña del navegado, mostrando un escritorio. Haga clic en el símbolo inferior izquierdo en la pantalla (en la barra de tareas), coloque el cursor sobre Accesorios y haga clic en QOwnNotes (vea la viñeta de captura de pantalla 3). El diálogo de instalación de QOwnNotes debería abrirse. Haga clic en él y presione Finalizar para ver la ventana principal de QOwnNotes. ¡Ayúdanos a mejorar este sitio! (opens new window) ← Concepto Markdown → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
