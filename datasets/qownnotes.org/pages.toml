full_description = '''# Git versioning You can set up QOwnNotes to automatically commit changes in your note folder locally to a git repository in your note folder. This can be done in the Git versioning settings in the General settings. You need to have git installed on your system and the git executable needs to be in your PATH or you can set the path to the git executable in the Git versioning settings. You also need to turn on git support for each note folder you want to use git versioning with! TIP Don't forget to set your git username and email address in the terminal: git config --global user.email "[email protected]" git config --global user.name "Your name" 12 이 페이지를 개선할 수 있도록 도와주세요! (opens new window) ← 단축키 설치 → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!'''
