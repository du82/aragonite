full_description = "# QOwnNotesAPI Nextcloud App A QOwnNotesAPI (opens new window) képes kezelni az hozzáférést az kukába helyezett jegyzetekhez és az jegyzetek verzióihoz. TIP A QOwnNotesAPI-t közvetlenül engedélyezheti a Nextcloud vagy a ownCloud példányban, ha a szerver Apps page https://<your-cloud-domain>/settings/apps. Nextcloud Apps page (opens new window) ownCloud Apps page (opens new window) A jegyzetmegosztás a Nextcloud / ownCloud által biztosított API-n keresztül történik. A feladatokhoz közvetlenül a CalDAV-on keresztül férhet hozzá. TIP Használja a Nextcloud / ownCloud szinkronizáló klienst a jegyzetek szinkronizálásához, a jegyzetek egyszerű jelölőfájlok. Nem szükséges kétszer feltalálni a kereket. És vannak olyan emberek is, akik különböző szolgáltatásokat használnak a jegyzetfájlok szinkronizálására (például Dropbox, Syncthing vagy Resilio Sync). # Mit tesz a QOwnNotesAPI Hozzáférés a kukába helyezett jegyzetekhez Hozzáférés a jegyzet verzióihoz # Amit a QOwnNotesAPI nem tesz A jegyzetek szinkronizálása (kérjük, használja a sajátCloud / Nextcloud szinkronizáló klienst) Jegyzetek megosztása (ez közvetlenül a ownCloud / Nextcloud API-n keresztül történik) Képek elérése a Nextcloud Text (opens new window) ből (ez közvetlenül a Nextcloud API-n keresztül történik) Segítsen javítani ezt az oldalt! (opens new window) ← QOwnNotes webalkalmazás Jegyzetek keresése → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
