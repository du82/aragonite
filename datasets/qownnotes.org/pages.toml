title = "مُعامِلات واجهة سطر الأوامر | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = '# مُعامِلات واجهة سطر الأوامر يمكنك استخدام هذه المعاملات في واجهة سطر الأوامر (CLI) للتحكم في سلوك التطبيق: المُعامِل الوصف ‪--help يُظهر شاشة المساعدة ‪--version يعرض رقم نسخة التطبيق ‪--portable يشغل التطبيق في الوضع المحمول ‪--clear-settings يمسح الإعدادات ويشغل التطبيق ‪--dump-settings يطبع تفريغ الإعدادات ومعلومات أخرى عن التطبيق والبيئة، بصيغة ماركداون GitHub ويخرج من التطبيق ‪--session <اسم> يشغل التطبيق في سياق مختلف للإعدادات والملفات الداخلية ‪--allow-multiple-instances يسمح بتشغيل عدة نسخ من تطبيق QOwnNotes حتى في حالة منع ذلك في الإعدادات ‪--action <اسم> ينفذ إجراء قائمة بعد تشغيل التطبيق (انظر بالأسفل) ‪--completion <الصدفة> يولّد أوامر الإكمال الملائمة للصَدفة. يقبل fish و bash. TIP إذا كنت تواجه مشاكل مع QOwnNotes المثبت لديك، ربما تود أن تشغّل التطبيق بإعدادات جديدة بغير أن تفقد إعداداتك الحالية، باستخدام المُعامل --session. QOwnNotes --session test 1 قد تحتاج إلى تشغيل التطبيق من واجهة سطر الأوامر بطرق مختلفة على أنظمة التشغيل المختلفة: نظام التشغيل الأمر لينكس QOwnNotes (أو qownnotes لو كان مثبتًا عبر snap) ماك أو إس <span dir="ltr">/Applications/QOwnNotes.app/Contents/MacOS/QOwnNotes</span> ويندوز QOwnNotes.exe TIP لنسخ تفريغ الإعدادات إلى الحافظة مباشرةً لنشره في مسألة أو مشكلة على GitHub (opens new window)، يمكنك استخدام xclip أو xsel على لينكس، أو pbcopy على macOS، أو clip على Windows: # انسخ تفريغ الإعدادات إلى الحافظة على لينكس باستخدام xclip QOwnNotes --dump-settings | xclip -selection clipboard # انسخ تفريغ الإعدادات إلى الحافظة على لينكس باستخدام xsel QOwnNotes --dump-settings | xsel --clipboard # انسخ تفريغ الإعدادات إلى الحافظة على ماك باستخدام pbcopy QOwnNotes --dump-settings | pbcopy # انسخ تفريغ الإعدادات إلى الحافظة على ويندوز باستخدام clip QOwnNotes --dump-settings | clip 1234567891011 # تنفيذ إجراءات قائمة بعد التشغيل باستخدام المُعامِل --action <اسم>، يمكنك تنفيذ إجراءات قائمة بعد تشغيل التطبيق. مثلا لإظهار حوار قائمة المهام بعد التشغيل، استخدم: QOwnNotes --action actionShow_Todo_List 1TIP يمكنك الحصول على أسماء كائنات إجراءات القائمة من mainwindow.ui (opens new window). فقط ابحث بالعنوان الإنجليزي للقائمة. لاحظ أن هذه النصوص قد تتغير بمرور الوقت. لتنفيذ إجراء برمجي، استخدم customAction_ متبوعًا باسم الإجراء المخصص. اسم الإجراء المخصص هو المُعامل الأول في نداء script.registerCustomAction في البُريمج. مثلا لتنفيذ الإجراء المخصص myAction، شغّل QOwnNotes هكذا: QOwnNotes --action customAction_myAction 1TIP إذا كنت تستخدم وضع النسخة الوحيدة وقمت بتشغيل QOwnNotes مرة ثانية باستخدام مُعامِل الإجراء، فإن إجراء القائمة سيُنفَّذ في النسخة الأولى. ساعدنا في تحسين هذه الصفحة! (opens new window) ← استيراد الملاحظات إضافة المتصفح رفيقة ويب QOwnNotes → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!'
