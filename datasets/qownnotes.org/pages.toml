["https://qownnotes.org/hu/getting-started/command-line-snippet-manager.html"]
title = "Command-line Snippet Manager | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = '''# Command-line Snippet Manager A QOwnNotes Command-line Snippet Manager (opens new window) segítségével futtathatja a jegyzetekben tárolt parancsrészleteket a QOwnNotes alkalmazásban a parancssorból. Speciális címkével ellátott megjegyzések segítségével tárolhatja a parancsrészleteket, amelyeket a parancssori kódrészletkezelőből hajthat végre. # Telepítés Keresse fel a legfrissebb kiadás oldalát (opens new window) és töltse le a kívánt verziót. TIP Ha telepítve van a jq (opens new window), ezt a kódrészletet használhatja például a legújabb Linux AMD64 AppImage letöltéséhez és telepítéséhez a /usr/local/bin/qc címre: curl https://api.github.com/repos/qownnotes/qc/releases/latest | \ jq '.assets[] | select(.browser_download_url | endswith("_linux_amd64.tar.gz")) | .browser_download_url' | \ xargs curl -Lo /tmp/qc.tar.gz && \ tar xfz /tmp/qc.tar.gz -C /tmp && \ rm /tmp/qc.tar.gz && \ sudo mv /tmp/qc /usr/local/bin/qc && \ /usr/local/bin/qc --version 1234567 # Függőségek Az fzf (opens new window) (fuzzy search) vagy a peco (opens new window) (régebbi, de nagyobb valószínűséggel alapértelmezés szerint telepítve) telepítése szükséges a parancsok kereséséhez a parancssorban. TIP Alapértelmezés szerint az fzf kifejezést használja a kereséshez, de használhatja a peco-t, ha beállítja a qc configure paranccsal. # Beállítás A kódrészletkezelő használata előtt engedélyeznie kell a Web socket szervert (2) a QOwnNotes Böngészőbővítmény / parancsrészletek (1) beállításainál. Ezután meg kell mutatnia a biztonsági tokent (3), és ki kell másolnia (4). Most nyissa meg a kódrészletkezelő konfigurációs fájlját a következővel: # Konfigurálja a kódrészletkezelőt qc konfigurálása 12És helyezze a biztonsági tokent a token attribútumba: [QOwnNotes] token = "yourtokenhere" 12TIP A QOwnNotes beállításaiban azt is beállíthatja, hogy milyen jegyzetcímkét használjon a parancsok kereséséhez a jegyzetekben. Alapértelmezés szerint a commands címke használatos. # A parancsrészletek szintaxisa Használhat soron belüli kódblokkokkal rendelkező rendezetlen listákat a parancsrészletek tárolására. Minden commands címkét tartalmazó jegyzetben a rendszer parancsrészleteket keres. Ha a soron belüli kódblokk elé egy cmd: karakterláncot ad hozzá, a parancs az aktuális jegyzetben is megtalálható lesz, függetlenül a jegyzetcímkéktől. - `visszhang Én vagyok a parancs` Leírás vagyok #tag1 #tag2 #tag3 * `visszhang Én is parancs vagyok` Leírás vagyok #tag3 #tag4 #tag5 - cmd: `echo I megtalálható lesz az aktuális jegyzetben` Ez a parancs megtalálható az aktuális jegyzetben a jegyzetcímkéktől függetlenül <!-- Példa a felhasználói bevitel kérésére --> - `read -p "PR ID: " id && git lekérési eredet pull/$id/head:pull-$id && git checkout pull-$id` Kérjen lekérési azonosítót és lekérési kérést 1234567A bash vagy shell kódblokkok, amelyeket leírásként 2-es vagy magasabb címsor előz meg, szintén használhatók parancsrészletekhez. A címkék is támogatottak, ha a címsor és a kódblokk között vannak. ## Ezt egy "bash" kódblokk segítségével teheti meg - ezt a szöveget figyelmen kívül hagyja - de használhatók a címkék: #tag1 #tag2 ```bash echo csináld ezt echo tedd ezt ``` ## Csinálj valami mást az "sh" kódblokk segítségével ```sh echo csináljon valami mást visszhang csinál valami mást ``` A fenti példa két parancsrészletet eredményez, az első a két tag1 és tag2 címkével. # Használat # Parancsrészletek keresése és végrehajtása qc exec 12# Parancsrészletek keresése és nyomtatása qc keresés 12# Konfiguráció Futtassa a qc configure parancsot. [General] editor = "vim" # kedvenc szövegszerkesztőd column = 40 # oszlopméret a lista parancshoz selectcmd = "fzf" # választó parancs a szerkesztési parancshoz (fzf vagy peco) sortby = "" # adja meg a kódrészletek rendezési módját (recency (alapértelmezett), -recency, description, -description, parancs, -command, output, -output) [QOwnNotes] token = "MvTagHXF" # your QOwnNotes API token websocket_port = 22222 # websocket port in QOwnNotes 123456789# Shell befejezése A shell befejezési kódját a qc befejezés <shell> paranccsal állíthatja elő. Például a Fish shell-hez használhatja: qc befejezési hal > ~/.config/fish/completions/qc.fish 1 Segítsen javítani ezt az oldalt! (opens new window) ← QOwnNotes Web Companion böngészőbővítmény QOwnNotes webalkalmazás → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!'''
