full_description = "# QOwnNotes webalkalmazás A mobiltelefonról származó fotókat beillesztheti az asztali QOwnNotes aktuális jegyzetébe az webalkalmazás segítségével az app.qownnotes.org (opens new window) oldalon. A telefonon található webalkalmazás az interneten keresztül kommunikál a QOwnNotes asztali alkalmazásával. A QOwnNotes és a webszolgáltatás közötti kommunikáció ** szállítás titkosított **. Nem tárol képeket a szerveren. There is a settings page Web application to add support for the web application. Ne felejtse el másolni a titkos tokent a QOwnNotes beállítások oldaláról az app.qownnotes fájlba.org (opens new window), hogy kommunikálni tudjon a QOwnNotes helyi példányával. A tokent a QR-kódból is beolvashatja a telefonjával a webalkalmazásban. A webalkalmazás forráskódját a webalkalmazás a GitHub webhelyen találja meg (opens new window). Ezt a webszolgáltatást saját maga is üzemeltetheti, a frissen épített dokkoló képek a qownnotes-web-app oldalon érhetők el a DockerHubon (opens new window). Segítsen javítani ezt az oldalt! (opens new window) ← Command-line Snippet Manager QOwnNotesAPI Nextcloud App → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
