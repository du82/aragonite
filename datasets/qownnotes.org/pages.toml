title = "Skróty | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# Skróty # Linux / Windows # W głównym oknie Ctrl + N tworzy nową notatkę z bieżącą datą i godziną w nazwie KONTEKST Ctrl + ⇧ Shift + N tworzy nową notatkę w nowej karcie Ctrl + ⇧ Shift + F umożliwia wyszukiwanie notatek (w nazwie notatki i jej treści) Alt + F umożliwia wyszukiwanie notatek we wszystkich tagach / podfolderach Alt + ⇧ Shift + P przełącza do poprzedniego obszaru roboczego Ctrl + ⇧ Shift + E edytuje zaszyfrowaną notatkę Alt + R usuwa bieżącą notatkę Alt + ⇧ Shift + U sprawdza dostępność aktualizacji Ctrl + ⇧ Shift + T otwiera listę rzeczy do zrobienia Ctrl + ⇧ Shift + O otwiera bieżącą notatkę w zewnętrznym edytorze Alt + ⇧ Shift + O otwiera bieżącą notatkę w widoku Alt + ⇧ Shift + F pokazuje bieżącą notatkę w menedżerze plików Alt + ⇧ Shift + E włącza lub wyłącza edycję notatek Alt + Up jumps to the previous visible note Alt + W dół przeskakuje do następnej widocznej nuty Alt + Page Up przeskakuje do poprzedniej zakładki notatki Alt + Page Down przeskakuje do następnej zakładki notatki Ctrl + W zamyka bieżącą kartę notatek Ctrl + ⇧ Shift + D przełącza tryb bez rozpraszania uwagi możesz go również zamknąć za pomocą Esc Ctrl + P drukuje bieżącą notatkę jako tekst Ctrl + ⇧ Shift + P drukuje bieżącą notatkę jako przecenę Ctrl + ⇧ Shift + V wkleja notatki, obrazy i html ze schowka Ctrl + , otwiera ustawienia Alt + ⇧ Shift + A dodaje nowy tag do notatki Ctrl + ⇧ Shift + R ponownie ładuje bieżący folder notatek Ctrl + Alt + F pozwala wybrać inny folder notatek Ctrl + ⇧ Shift + S ponownie ładuje silnik skryptów Ctrl + ⇧ Shift + M ukrywa lub pokazuje pasek menu głównego Ctrl + ⇧ Shift + A umożliwia wyszukiwanie działań Ctrl + S ręcznie zapisuje zmodyfikowane notatki Alt + ⇧ Shift + I otwiera okno dialogowe repozytorium skryptów F4 przeskakuje do panelu edycji notatki F5 przeskakuje do listy notatek F6 przeskakuje do panelu podfolderów notatek F7 przeskakuje do panelu tagów F8 przeskakuje do panelu nawigacyjnego F10 aktywuje menu kontekstowe bieżącego widżetu F11 przełącza tryb pełnoekranowy Alt + ⇧ Shift + H kopiuje nagłówek bieżącej notatki # W pasku wyszukiwania notatek Down lub Tab ustawia fokus na listę notatek Return tworzy nową notatkę z tekstem z paska wyszukiwania jako nagłówek # Na liście notatek kliknij dwukrotnie notatkę, aby otworzyć notatkę w nowej karcie (pamiętaj, że istnieje hak skryptowy, który może przesłonić akcję podwójnego kliknięcia) Ctrl + A zaznacza wszystkie notatki (aby przenieść, skopiować lub usunąć je prawym przyciskiem myszy) Tab lub Powrót pozwala edytować bieżącą notatkę # W panelu edycji tekstu notatki Ctrl + klik na linku aby go otworzyć Ctrl + F umożliwia wyszukiwanie w bieżącej notatce użyj klawiszy w górę i w dół lub F3 i ⇧ Shift + F3, aby przejść do poprzedniego i następnego dopasowania Esc zamyka pasek wyszukiwania Ctrl + R pozwala wyszukiwać i zamieniać w bieżącej notatce Ctrl + D duplikuje bieżącą linię lub wybrany tekst Ctrl + Alt + W dół robi to samo Alt + Backspace usuwa bieżącą linię Ctrl + Backspace usuwa bieżące słowo Ctrl + L otwiera okno dialogowe dodawania linku tekstowego (działa również na zaznaczonym tekście) Ctrl + ⇧ Shift + L otwiera okno dialogowe dodawania linku do notatki Ctrl + T wstawia bieżącą datę i czas w formacie określonym przez użytkownika Ctrl + ⇧ Shift + I wstawia obraz (obraz zostanie skopiowany do folderu media w bieżących notatkach teczka) Ctrl + ⇧ Shift + X wstawia załącznik (plik zostanie skopiowany do folderu załączników w bieżącym folder notatek) Alt + ⇧ Shift + T wstawia tabelę Ctrl + ⇧ Shift + C wstawia blok kodu w bieżącej pozycji Ctrl + ⇧ Shift + B wstawia cytat blokowy w bieżącej pozycji Ctrl + B formatuje zaznaczony tekst pogrubiony Ctrl + I formatuje zaznaczony tekst kursywą Ctrl + U formatuje podkreślenie zaznaczonego tekstu Alt + ⇧ Shift + S przekreśla zaznaczony tekst Ctrl + ⇧ Shift + U przełącza wielkości liter wybranego tekstu Tab wcina zaznaczony tekst (działa również na wielu liniach) ⇧ Shift + Tab usuwa wcięcie zaznaczonego tekstu Tab po nieuporządkowanym znaku listy wcina element listy ⇧ Shift + Tab po nieuporządkowanym znaku listy wcina element listy Return na listach tworzy nowy element listy Alt + Ctrl + W lewo przeskakuje z powrotem w historii notatek Alt + W prawo przeskakuje do przodu w historii notatek Ctrl + ⇧ Shift + 1..9 ustawia zakładkę notatki w gnieździe zakładek 1..9 Ctrl + 0..9 przeskakuje do zakładki notatki w gnieździe zakładek 0..9 Ctrl + + zwiększa rozmiar czcionki tekstu notatki o jeden punkt Ctrl + - zmniejsza rozmiar czcionki tekstu notatki o jeden punkt Ctrl + 0 resetuje rozmiar czcionki tekstu notatki Ctrl + Spacja próbuje rozwiązać proste równania, takie jak (4+5)*3= przed kursorem, automatycznie uzupełnia tekst lub otwiera adresy URL Ctrl + ⇧ Shift + H wstawia nagłówek z nazwy pliku notatki na górze notatki Alt + ⇧ Shift + X dzieli bieżącą nutę na dwie nuty w bieżącej pozycji kursora Alt + ⇧ Shift + W wyszukuje wybrany tekst w sieci Ctrl + W górę przewija zawartość w górę Ctrl + W dół przewija zawartość w dół Ctrl + ⇧ Shift + Down przesuwa bieżącą linię w dół Ctrl + ⇧ Shift + Up przesuwa aktualną linię w górę ⇧ Shift + Return dodaje dwie spacje i znak nowego wiersza, aby wymusić nową linię markdown # W panelu podglądu notatek Ctrl + F umożliwia wyszukiwanie w bieżącej notatce użyj klawiszy w górę i w dół lub F3 i ⇧ Shift + F3, aby przejść do poprzedniego i następnego dopasowania Esc zamyka pasek wyszukiwania # Na liście rzeczy do zrobienia Ctrl + S zapisuje bieżący element do zrobienia Ctrl + I zapisuje bieżący element do zrobienia i wstawia do bieżącej notatki Ctrl + R usuwa bieżący element do zrobienia # macOS # W głównym oknie ⌘ Cmd + N tworzy nową notatkę z bieżącą datą i godziną w nazwie ⌘ Cmd + ⇧ Shift + N tworzy nową notatkę w nowej karcie ⌘ Cmd + ⇧ Shift + F umożliwia wyszukiwanie notatek (w nazwie notatki i jej treści) ⌃ Ctrl + F umożliwia wyszukiwanie notatek we wszystkich tagach / podfolderach ⌃ Ctrl + ⇧ Shift + P przełącza do poprzedni