["https://qownnotes.org/es/getting-started/concept.html"]
title = "Concepto | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# Concepto # QOwnNotes QOwnNotes almacena notas en su carpeta de notas como archivos de Markdown Puede hablar con su servidor Nextcloud / ownCloud para compartir notas públicamente con otras personas También puede acceder a su historial de notas y a la papelera en su servidor Nextcloud / ownCloud a través de la aplicación QOwnNotesApi Nextcloud Se puede acceder a las listas de tareas en su servidor Nextcloud / ownCloud desde QOwnNotes ¡QOwnNotes no sincroniza sus notas y archivos multimedia / adjuntos! La sincronización de archivos es una tarea compleja, ya existen excelentes soluciones de sincronización de archivos (consulte Cliente de sincronización de escritorio de Nextcloud) # Archivos de notas de Markdown ¡Tú eres dueño de todas tus notas y archivos multimedia / adjuntos! Sus notas se almacenan como archivos Markdown de texto sin formato en su computadora de escritorio Puede utilizar cualquier editor de texto que desee junto a QOwnNotes para ver o editar sus archivos de notas Sincronice sus notas con otros dispositivos (escritorio y móvil) con su cliente de sincronización Nextcloud (opens new window) o ownCloud (opens new window) con su servidor # Extensión del navegador QOwnNotes Puede administrar los marcadores de su navegador con QOwnNotes o usarlo como web clipper. TIP Las extensiones del navegador funcionan fuera de línea. No se requiere de una conexión a Internet. Por favor visite la extensión del navegador QOwnNotes Web Companion para mayor información. # Gestor de fragmentos de órdenes de terminal de QOwnNotes Puede administrar sus fragmentos de órdenes con QOwnNotes y ejecutarlos en las órdenes de terminal. TIP Por favor visite el gestor de fragmentos de órdenes de terminal de QOwnNotes para mayor información. # Cliente de sincronización de escritorio de Nextcloud Sincronice sus notas con otros dispositivos (desktop & mobile) con su cliente de sincronización Nextcloud (opens new window) o ownCloud (opens new window) con su servidor. TIP Por supuesto, otras soluciones, como Dropbox, Syncthing, Seafile o BitTorrent Sync también se pueden utilizar para sincronizar sus notas y otros archivos. También puede usar git para sincronizar con herramientas como gitomatic (opens new window). # Servidor Nextcloud Para trabajar con sus notas en línea, puede utilizar servidores como Nextcloud (opens new window) o ownCloud (opens new window). Puede alojar su propio servidor o utilizar soluciones alojadas. Hay una lista mantenida por la comunidad de proveedores de Nextcloud (opens new window), así como una lista de dispositivos con Nextcloud (opens new window). Portknox (opens new window) ha informado que tienen QOwnNotesAPI instalado (opens new window). TIP Por supuesto, otras soluciones, como Dropbox, Syncthing, Seafile o BitTorrent Sync también se pueden utilizar para alojar sus notas y otros archivos. # QOwnNotesAPI Nextcloud app QOwnNotesAPI (opens new window) le permite acceder a su notas enviadas a la papelera y versiones de notas del lado del servidor. TIP Por favor visite Aplicación QOwnNotesAPI Nextcloud para mayor información. # Aplicación de servidor de Nextcloud Notes Utilice Nextcloud Notes (opens new window) para editar sus notas en la web. WARNING Tenga en cuenta que Nextcloud Notes actualmente solo admite un nivel de subcarpetas. # Aplicación de Nextcloud Deck para servidores Es posible utilizar QOwnNotes para crear con rapidez tarjetas en Nextcloud Deck (opens new window). # Aplicación móvil Nexcloud Notes Para acceder a sus notas de Nextcloud / ownCloud desde su dispositivo móvil, puede utilizar diferentes aplicaciones. # Android Nextcloud Notes para Android (opens new window) (terceros) TIP También puede usar cualquier herramienta de sincronización, como Synchronize Ultimate o FolderSync, para sincronizar sus archivos de notas, y usar software como neutriNotes para editarlas. # iOS CloudNotes para iOS (opens new window) (terceros) TIP También puede utilizar Notebooks (opens new window) y sincronizar sus notas por medio de WebDAV. Hay un buen tutorial en Tomar notas con Nexcloud, QOwnNotes, y Notebooks (opens new window) # api.qownnotes.org Este es un servicio en línea proporcionado por QOwnNotes para verificar si hay una nueva versión de la aplicación disponible. Se comunica con GitHub y comprueba si existe una versión más reciente, obtiene una URL de descarga adecuada y compila los cambios del registro de novedades comparado con la versión de QOwnNotes que está utilizando actualmente en formato HTML para su visualización en el cuadro de diálogo Actualización. Además, también proporciona el feed RSS de versiones (opens new window) y una implementación de la API heredada de comprobación de actualizaciones para las versiones anteriores de QOwnNotes. TIP Se puede acceder al código fuente de api.qownnotes.org (opens new window) en GitHub (opens new window). # Aplicación web de QOwnNotes Es posible insertar fotografías de su teléfono móvil en la nota actual en QOwnNotes en su equipo de escritorio por medio de la aplicación web disponible en app.qownnotes.org (opens new window). TIP Por favor visite la aplicación web de QOwnNotes para mayor información. ¡Ayúdanos a mejorar este sitio! (opens new window) ← Descripción general Demo de QOwnNotes → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
