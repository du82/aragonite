["https://qownnotes.org/hu/getting-started/markdown.html"]
title = "Markdown | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = '''# Markdown Ez a Markdown-cheatsheet gyors leírása és bemutatása a QOwnNotes markdown szintaxisában. # Headings Használja a fejléceket a szövegek strukturálásához. # H1 ## H2 ### H3 #### H4 ##### H5 ###### H6 123456TIP A Navigációs panel mutatja a címsorok felépítését. Alternatív megoldásként H1 és H2 esetében aláhúzás-stílus stílus: Alt-H1 ====== Alt-H2 ------ 12345TIP Alapértelmezés szerint a QOwnNotes létrehozza a jegyzet fájlnevét az 1 fejlécből (h1). # Hangsúly Kiemelés, más néven dőlt betű, *csillaggal*. Erős hangsúly, más néven félkövér, **csillaggal**. 123TIP Használhatja a parancsikont Ctrl + B a félkövér szöveg készítéséhez, és a Ctrl + I dőlt betűséhez. # Aláhúzás Van egy opcionális beállítás is, amely lehetővé teszi az aláhúzás megjelenítését az Előnézet beállításai alatt. _underline_ 1TIP A szöveg aláhúzásához használhatja a parancsikont Ctrl + U. # Kihúz ~~strike out~~ 1TIP Használhatja az parancsikon Alt + Shift + S a szöveg törléséhez. # Listák A listák létrehozásának számos módja van. 1. Első rendezett listaelem 2. Egy másik elem * Rendezetlen allista. 1. A tényleges számok nem számítanak, csak az, hogy ez egy szám 1. Rendezett allista (csak a szerkesztőben működik, az előnézetben nem) 4. És még egy elem. * A rendezetlen lista csillagokat használhat - Vagy mínuszok + Vagy pluszok 12345678910TIP Ha megnyomja az Enter gombot a lista végén, akkor egy új listaelem jön létre. # Linkek Two of the simpler uses for links are pointing to webpages or other notes. There are multiple ways each of these links can look. # External links [I'm an inline-style link](https://www.google.com) [I'm an inline-style link with title](https://www.google.com "Google's Homepage") [You can use numbers for reference-style link definitions][1] Plain URLs and URLs in angle brackets will automatically get turned into links in the preview. http://www.example.com or <http://www.example.com> [1]: https://www.qownnotes.org 12345678910# Internal links [I link to the Journal.md note](Journal.md) <Journal.md> works similarly. 123TIP Használhatja a parancsikont Ctrl + L hozzon létre linkeket weboldalakra vagy egyéb jegyzetekre. A Ctrl + Shift + X használatával megjelenik egy párbeszédpanel, amely segít csatolni a mellékleteket a jegyzetbe. Nyomja meg a Ctrl + szóköz billentyűt, miközben a kurzor a jegyzet szerkesztésében egy linken van, hogy kövesse a linket. # Bookmarks A QOwnNotes Web Companion böngészőbővítmény által használt könyvjelzők hivatkozásokat használnak a listákban. - [Webpage name](https://www.example.com) #tag1 #tag2 some description and tags 1# Képek A képek beágyazhatók a QOwnNotes programba. Megjelennek az előnézetben. ![alt text](media/my-image.jpg) 1TIP Használhatja a parancsikont Ctrl + Shift + I a kép beszúrásához egy jegyzetbe. A kép a vágólapon is lehet, a párbeszédpanel észleli és előnézetet mutat. A vágólapról közvetlenül beilleszthet egy képet a jegyzetébe a Ctrl + Shift + V gombbal. # Beépített kód és kódblokkok Inline `code` has `backticks around` it. 1TIP Használhatja a parancsikont Ctrl + Shift + C a kiválasztott szöveges szövegen vagy közvetlenül a szöveg belsejében, hogy létrehozzon egy inline kódblokkot. Blocks of code are either fenced by lines with three backticks, or are indented with four spaces. # 4-Spaces fence Tegyen négy szóközt a kód elé, hogy kódblokkként jelölje meg. s = "Code with space indent" print s 12# Backtick fence Három backticket is használhat egy kódblokk létrehozásához. ``` Code goes here Code goes here ``` 1234TIP You can use the shortcut Ctrl + Shift + C on multiple selected lines of text or in an empty line to create a code block. # Backtick fence with code highlighting There also is some syntax highlighting with code blocks in QOwnNotes. ```bash # I am a comment cd Notes ``` 1234Currently, supported languages (and code block identifiers) are: BASh scripting, bash C, c C++, cpp C++, cxx C++, c++ C#, c# CMake, cmake C#, csharp CSS, css Go, go HTML, html INI, ini Java, java JavaScript, javascript JavaScript, js JSON, json Makefile, make PHP, php Python, py Python, python QML, qml Rust, rust Shell scripting, sh SQL, sql TypeScript, ts TypeScript, typescript V, v Vex, vex XML, xml YAML, yml YAML, yaml # Tables Tables aren't part of the core Markdown spec, but the QOwnNotes preview supports them. Colons can be used to align columns. | Tables | Are | Cool | | ------------- |:-------------:| -----:| | col 3 is | right-aligned | $1600 | | col 2 is | centered | $12 | | zebra stripes | are neat | $1 | There must be at least 3 dashes separating each header cell. You can also use inline Markdown. | Markdown | Less | Pretty | | --- | --- | --- | | *Still* | `renders` | **nicely** | | 1 | 2 | 3 | 12345678910111213141516TIP Nyomja meg az Alt+Shift+T billentyűkombinációt egy párbeszédpanel aktiválásához, amely segíthet a táblázatok létrehozásában. Akár CSV fájlokat is importálhat abban a párbeszédpanelen. Használja a Ctrl + szóközt egy jelölési táblázatban az automatikus formázáshoz. # Idézetek > Blockquotes are very handy in email to emulate reply text. > This line is part of the same quote. Quote break. > This is a very long line that will still be quoted properly when it wraps. Oh boy let's keep writing to make sure this is long enough to actually wrap for everyone. Oh, you can *put* **Markdown** into a blockquote. 123456TIP Azt mondhatja a QOwnNotes-nak, hogy a Szerkesztő beállításai-ban jelölje ki teljesen a blokk idézeteket vagy csak a blokk idézet karaktert. Használhatja a parancsikont Ctrl + Shift + B a szöveg blokk idézetként történő megjelölésére. # Vízszintes vonal Három módon lehet vízszintes szabályt kapni: kötőjel, csillag vagy aláhúzás. Three or more... Hyphens --- Asterisks *** Underscores ___ 12345678910111213# Sortörések Egy bekezdést több sorra is bonthat a könnyebb szerkesztés érdekében, de ezek továbbra is egyetlen bekezdésként jelennek meg törés nélkül. Kényszeríthet sortörést a bekezdésen belül, ha egy sort két szóközzel fejez be. Külön bekezdést készíthet úgy, hogy üres sorokkal határolja el. TIP Két szóközt és egy újsort írhat be a ⇧ Shift + Return billentyűkombinációval. Here's a line for us to start with. This line is separated from the one above by two newlines, so it will be a *separate paragraph*. This line is also begins a separate paragraph, but... This line is only separated by two trailing spaces and a single newline, so it's a separate line in the *same paragraph*. 123456TIP A szóközöket a szerkesztő alapértelmezés szerint kiemeli. # Hozzászólások A jegyzet nem jelenik meg az előnézetben. [comment]: # (This comment will not appear in the preview) <!-- HTML comments are also hidden --> 123TIP A jegyzetek vezető html megjegyzésblokkja az automatikus jegyzetfájl-generálás során sem kerül figyelembe. # Jelölőnégyzet -listák Létrehozhat egyszerű todo listákat jelölőnégyzet listákkal. - [x] done - [ ] todo 12TIP Az előnézetben bejelölheti / eltávolíthatja a jelölőnégyzeteket. # Frontmatter A QOwnNotes alkalmazásban frontmatterrel (pl. YAML) adhat további meta-információkat. nem jelenik meg az előnézetben, és nem zavarja az automatikus jegyzetfájlnév előállítását. --- title: Some name description: Some description --- # Note headline starts here Some text 12345678Ennek a példafájlnak a neve Note headline starts here.md lenne. Segítsen javítani ezt az oldalt! (opens new window) ← QOwnNotes Demo Jegyzetek importálása → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!'''
year_published = 2025
