["https://qownnotes.org/nl/getting-started/command-line-snippet-manager.html"]
title = "Command-line Snippet Manager | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = '''# Command-line Snippet Manager U kunt de QOwnNotes Command-line Snippet Manager (opens new window) gebruiken om opdrachtfragmenten uit te voeren die zijn opgeslagen in notities in QOwnNotes vanaf de opdrachtregel. U kunt notities met een speciale tag gebruiken om command snippets op te slaan, die u uit kunt voeren vanuit de command-line snippet manager. # Installatie Ga naar de nieuwste release-pagina (opens new window) en download de versie die je nodig hebt. TIP Als je jq (opens new window) hebt geïnstalleerd, kun je dit fragment ook gebruiken om bijvoorbeeld de nieuwste Linux AMD64 AppImage te downloaden en te installeren naar /usr/local/bin/qc: curl https://api.github.com/repos/qownnotes/qc/releases/latest | \ jq '.assets[] | select(.browser_download_url | endswith("_linux_amd64.tar.gz")) | .browser_download_url' | \ xargs curl -Lo /tmp/qc.tar.gz && \ tar xfz /tmp/qc.tar.gz -C /tmp && \ rm /tmp/qc.tar.gz && \ sudo mv /tmp/qc /usr/local/bin/qc && \ /usr/local/bin/qc --version 1234567 # Afhankelijkheden fzf (opens new window) (fuzzy zoeken) of peco (opens new window) (ouder, maar waarschijnlijker standaard geïnstalleerd) moeten worden geïnstalleerd om naar opdrachten op de opdrachtregel te zoeken. TIP Standaard wordt fzf gebruikt om te zoeken, maar u kunt peco gebruiken door dit in te stellen met qc configure. # Opstelling Voordat u de snippetmanager gebruikt, moet u de Websocketserver (2) inschakelen in de instellingen voor Browserextensie / opdrachtfragmenten (1) in QOwnNotes. Dan moet je het security token (3) laten zien en kopiëren (4). Open nu het configuratiebestand van de snippetmanager met: # Configureer de snippetmanager qc configureren 12En plaats het security token in het token attribuut: [QOwnNotes] token = "yourtokenhere" 12TIP In de QOwnNotes-instellingen kunt u ook instellen welke notitietag moet worden gebruikt om naar opdrachten in notities te zoeken. Standaard wordt de tag opdrachten gebruikt. # Syntaxis van opdrachtfragmenten U kunt ongeordende lijsten met in-line codeblokken gebruiken om opdrachtfragmenten op te slaan. Alle notities met de tag opdrachten worden doorzocht op opdrachtfragmenten. Als je een cmd: toevoegt voor het in-line codeblok, zal het commando ook gevonden worden in de huidige notitie ongeacht notitietags. - `echo ik ben een commando` ik ben een beschrijving #tag1 #tag2 #tag3 * `echo ik ben ook een commando` ik ben een beschrijving #tag3 #tag4 #tag5 - cmd: `echo I zal worden gevonden in de huidige notitie` Dit commando zal worden gevonden in de huidige notitie, ongeacht notitietags <!-- Voorbeeld om gebruikersinvoer te vragen --> - `read -p "PR ID: " id && git fetch origin pull/$id/head:pull-$id && git checkout pull-$id` Vraag om een pull-verzoek-ID en check-out pull-verzoek 1234567bash of shell codeblokken, voorafgegaan door een kop 2 of hoger als beschrijving, kunnen ook worden gebruikt voor opdrachtfragmenten. Tags worden ook ondersteund als ze tussen de kop en het codeblok staan. ## Doe dit met een "bash" codeblok - deze tekst wordt genegeerd tekst - maar tags kunnen worden gebruikt: #tag1 #tag2 ```bash echo doe dit echo doe dat ``` ## Mach etwas anderes mit einem "sh" Codeblock ```sh echo doe iets anders echo doe iets anders ``` Bovenstaand voorbeeld resulteert in twee opdrachtfragmenten, de eerste met de twee tags tag1 en tag2. # Gebruik # Zoek en voer opdrachtfragmenten uit qc exec 12# Parancsrészletek keresése és nyomtatása qc keresés 12# Configuratie Run qc configure. [General] editor = "vim" # je favoriete teksteditor column = 40 # kolomgrootte voor lijstopdracht selectcmd = "fzf" # selector commando voor edit commando (fzf of peco) sortby = "" # specificeer hoe fragmenten worden gesorteerd (recentheid (standaard), -recentie, beschrijving, -beschrijving, opdracht, -commando, uitvoer, -uitvoer) [QOwnNotes] token = "MvTagHXF" # your QOwnNotes API token websocket_port = 22222 # websocket port in QOwnNotes 123456789# Shell voltooiing U kunt shell-aanvullingscode voor uw shell genereren met qc voltooiing <shell>. Voor de Fish shell kun je bijvoorbeeld gebruiken: qc completion fish > ~/.config/fish/completions/qc.fish 1 Help ons deze pagina te verbeteren! (opens new window) ← Browser-extensie QOwnNotes Web Companion QOwnNotes-webapp → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!'''
