["https://qownnotes.org/pl/getting-started/browser-extension.html"]
title = "Rozszerzenie przeglądarki QOwnNotes Web Companion | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# Rozszerzenie przeglądarki QOwnNotes Web Companion Umożliwia wycinanie ze strony przeglądarki i zarządzanie zakładkami przeglądarki w różnych przeglądarkach i systemach operacyjnych. TIP Info Aby rozszerzenie przeglądarki Web Companion działało, aplikacja QOwnNotes musi być uruchomiona. Nie wymaga połączenia z Internetem. Rozszerzenia przeglądarki działają w trybie offline. # Instalacja Pobierz rozszerzenie Chrome Web Store (opens new window) Firefox Add-ons page (opens new window) Rozszerzenie znajdziesz również w GitHub (opens new window). Dodaj token zabezpieczający, aby skonfigurować rozszerzenie. Po pierwszym kliknięciu ikony rozszerzenia przeglądarki QOwnNotes pojawi się okno dialogowe z tokenem bezpieczeństwa. Skopiuj token. Przejdź do lokalizacji zarządzania rozszerzeniami przeglądarki. Kliknij w szczegóły rozszerzenia QOwnNotes. Wklej token w polu Token bezpieczeństwa. To use the private mode, you need to allow the extension to run in private windows in the extension settings. # Schowek sieciowy Aby użyć funkcji wycinania fragmentów stron (web-clipper), kliknij prawym przyciskiem myszy stronę sieci Web lub zaznaczony tekst. W tym miejscu możesz też utworzyć nową notatkę ze zrzutem ekranu bieżącej strony sieci Web. WARNING Info If the web clipper doesn't work, please check if the QOwnNotes desktop application is running, and the Web Companion browser extension is configured with the security token. Also, make sure you accepted the consent dialog, when you first clicked the extension icon in the browser toolbar. If you are using Firefox, you also need to make sure that you have turned on the optional permission Access your data for all websites in the Permission extension settings, otherwise you might get an error TypeError: chrome.tabs.captureVisibleTab is not a function. TIP Nożyczki sieciowe są również skryptowalne! Spójrz na websocketRawDataHook, jeśli chcesz kontrolować, co wycinasz ze stron internetowych. # Zakładki Jeśli chcesz mieć pełną kontrolę nad zakładkami przeglądarki i używać ich w różnych przeglądarkach i systemach operacyjnych, rozszerzenie przeglądarki QOwnNotes jest dla Ciebie. By default, the browser extension will show all links of the current note in a popup when you click the QOwnNotes icon in your browser. Te linki zostaną otagowane jako current (bieżące). Możesz też zarządzać zakładkami w notatkach za pomocą tagu notatki bookmarks (zakładki – można go zmienić w ustawieniach). Linki te również mogą być opatrzone tagami i opisem, które zostaną wyświetlone w rozszerzeniu przeglądarki. Nowe zakładki są przechowywane w notatce o nazwie Zakładki (można ją również zmienić w ustawieniach). ::: Wskazówka Możesz też zaimportować zakładki ze swojej przeglądarki do QOwnNotes za pomocą rozszerzenia Web Companion. ::: # Składnia linków zakładek - [Nazwa strony](https://www.example.com) - [Nazwa strony](https://www.example.com) #tag1 #tag2 - [Nazwa strony](https://www.example.com) tylko część opisu - [Nazwa strony](https://www.example.com) #tag1 #tag2 część opisu i tagi * [Nazwa strony](https://www.example.com) znak listy alternatywnej również działa 12345You are able to search for name, url tags or description in the browser extension. In the current note all other links inside of text are parsed, but without tags or description. Pomóż nam ulepszyć tę stronę! (opens new window) ← Argumenty interfejsu wiersza poleceń Command-line Snippet Manager → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
