["https://qownnotes.org/nl/getting-started/browser-extension.html"]
title = "Browser-extensie QOwnNotes Web Companion | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# Browser-extensie QOwnNotes Web Companion Maakt het mogelijk om vanaf een browserpagina te knippen en browserbladwijzers te beheren in verschillende browsers en besturingssystemen. TIP Info QOwnNotes moet actief zijn om de Web Companion-browserextensie te laten werken. Geen internetverbinding nodig. De browserextensies werken offline. # Installatie Verkrijg de extensie Chrome webshop (opens new window) Firefox Add-ons-pagina (opens new window) U kunt de extensie ook vinden op GitHub (opens new window). Voeg het beveiligingstoken toe om de extensie te configureren. De eerste keer dat u op het QOwnNotes-pictogram voor de browserextensie klikt, ontvangt u een dialoogvenster met een beveiligingstoken. Kopieer de token. Ga naar de locatie voor extensiebeheer van uw browser. Klik in de details van de QOwnNotes-extensie. Plak het token in het veld Beveiligingstoken. Om de privémodus te gebruiken, moet u in de extensie-instellingen toestemming verlenen om de extensie in privévensters te laten draaien. # Webclipper Klik met de rechtermuisknop op een webpagina of geselecteerde tekst om de webclipper -functionaliteit te gebruiken. Daar kun je ook een nieuwe notitie maken met een screenshot van de huidige webpagina. ::: waarschuwing Info Als de webclipper niet werkt, controleer dan of de QOwnNotes-desktopapplicatie wel actief is en de browserextensie Web Companion is geconfigureerd met het beveiligingstoken. Zorg ervoor dat bij het klikken van het extensiepictogram in de browsertaakbalk dat ook het toestemmingsdialoogvenster wordt geaccepteerd. Als u Firefox gebruikt, moet u er ook voor zorgen dat u de optionele toestemming hebt ingeschakeld. Toegang tot uw gegevens voor alle websites in de * Toestemming * extensieinstellingen, anders krijgt u mogelijk een foutmelding TypeError: chrome.tabs.captureVisibleTab is geen functie. ::: TIP De webclipper is ook scriptbaar! Bekijk de websocketRawDataHook als je wilt bepalen wat je van webpagina's knipt. # Bladwijzers Als u volledige controle wilt over uw browserbladwijzers en ze wilt gebruiken in verschillende browsers en besturingssystemen, dan is de QOwnNotes-browserextensie iets voor u. Standaard toont de browserextensie alle ** links van de huidige notitie** in een pop-up wanneer u op het QOwnNotes-pictogram in uw browser klikt. Deze links krijgen een tag current. U kunt ook uw bladwijzers in notities beheren met de notitietag bladwijzers (wijzigbaar in de instellingen). Deze links kunnen ook tags en een beschrijving hebben die in de browserextensie wordt weergegeven. Nieuwe bladwijzers worden opgeslagen in een notitie genaamd Bladwijzers (ook te wijzigen in de instellingen). TIP U kunt ook uw browserbladwijzers importeren in QOwnNotes met de webpartner-browserextensie! # Syntaxis van bladwijzerkoppelingen - [Webpaginanaam](https://www.example.com) - [Webpaginanaam](https://www.example.com) #tag1 #tag2 - [Webpaginanaam](https://www.example.com) slechts een beschrijving - [Webpaginanaam](https://www.example.com) #tag1 #tag2 een beschrijving en tags * [Webpaginanaam](https://www.example.com) het alternatieve lijstteken werkt ook 12345Je kunt zoeken op naam, url-tags of beschrijving in de browserextensie. In de huidige notitie worden alle andere koppelingen in de tekst doorzocht, maar zonder tags of beschrijving. Help ons deze pagina te verbeteren! (opens new window) ← Opdrachtregel-interface-parameters Command-line Snippet Manager → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
year_published = 2025
