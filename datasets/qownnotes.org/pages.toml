title = "Contrôle de version avec git | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = '''# Contrôle de version avec git Vous pouvez configurer QOwnNotes pour automatiquement valider (« commit ») les changements de votre dossier de notes localement dans un dépôt git dans votre dossier de notes. La configuration se fait dans Contrôle de version git, dans Général, dans les paramètres. Il faut que git soit installé sur votre système, et le chemin vers l’exécutable git doit soit être dans la variable d’environnement PATH, soit peut être spécifié dans les paramètres, dans la section Contrôle de version git. Il faut aussi activer le support de git pour chaque dossier de notes pour lequel vous souhaitez utiliser git ! TIP Don't forget to set your git username and email address in the terminal: git config --global user.email "[email protected]" git config --global user.name "Votre nom" 12 Aidez-nous à améliorer ce site! (opens new window) ← Raccourcis Installation → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!'''
