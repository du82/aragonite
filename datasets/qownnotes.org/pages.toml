full_description = "# Demo QOwnNotes TIP Note This might not always work, depending on the current state of the demo environment. Możesz wypróbować QOwnNotes w swojej przeglądarce internetowej bez instalowania go, postępując zgodnie z tymi instrukcjami: Kliknij link Graj z Dockerem (opens new window). 2) Kliknij przycisk Zaloguj / Rozpocznij (patrz punktor zrzutu ekranu 1) i zaloguj się na swoje konto Docker (musisz go utworzyć, jeśli jeszcze go nie masz). Poczekaj, aż pojemnik zostanie utworzony i rozkręci się. Wtedy powinieneś być w stanie kliknij 6080 na górze (patrz zrzut ekranu punktor 2). Jeśli dostaniesz błąd proszę poczekać jeszcze trochę i spróbować ponownie kliknąć 6080, zajmie to chwilę do załadowania środowiska graficznego. Powinna otworzyć się nowa karta przeglądarki, tworząc pulpit. Kliknij symbol w lewym dolnym rogu na ekranie (na pasku zadań), najedź na Akcesoria i kliknij QOwnNotes (patrz zrzut ekranu punktora 3). Powinno się otworzyć okno dialogowe instalacji QOwnNotes, kliknij je i naciśnij Zakończ, aby wyświetlić główne okno QOwnNotes. Pomóż nam ulepszyć tę stronę! (opens new window) ← Pojęcie Obniżka cen → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
