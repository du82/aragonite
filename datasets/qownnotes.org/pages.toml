["https://qownnotes.org/getting-started/web-app.html"]
title = "QOwnNotes Web App | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# QOwnNotes Web App You can insert photos from your mobile phone into the current note in QOwnNotes on your desktop via the web application on app.qownnotes.org (opens new window). The web application on your phone communicates with your QOwnNotes desktop application over the internet. The communication between QOwnNotes and the web service is transport encrypted. No images will be stored on the server. There is a settings page Web application to add support for the web application. Don't forget to copy your secret token from the QOwnNotes settings page to app.qownnotes.org (opens new window) to be able to communicate with your local instance of QOwnNotes. You can also scan the token from the QR code with your phone in the web application. You can find the source code of the web application at web-app on GitHub (opens new window). You can also host this web service yourself, the freshly built docker images are available at qownnotes-web-app on DockerHub (opens new window). Help us improve this page! (opens new window) ← Command-line Snippet Manager QOwnNotesAPI Nextcloud App → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
