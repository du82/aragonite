title = "Searching for notes | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = '# Searching for notes To search for notes or for text inside notes you can use the shortcut Ctrl + ⇧ Shift + F (or ⌘ Cmd + ⇧ Shift + F on macOS) to jump to the Note search panel. There are different ways to search for notes: note book will search for notes with the word note or book in the file name or note text "note book" will search for notes with exactly the text note book in the file name or note text n:book or name:book will search for notes with book just in the note name or file name Help us improve this page! (opens new window) ← QOwnNotesAPI Nextcloud App Shortcuts → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!'
