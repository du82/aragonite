full_description = "# QOwnNotesAPI Nextcloud App يتيح QOwnNotesAPI (opens new window) لك الوصول إلى الملاحظات المهملة ونسخ الملاحظات. TIP يمكنك تفعيل QOwnNotesAPI مباشرةً في خادم Nextcloud أو ownCloud الخاص بك بالبحث عن qownnotes في صفحة التطبيقات (Apps) على خادمك في https://<your-cloud-domain>/settings/apps. صفحة تطبيقات Nextcloud (opens new window) صفحة تطبيقات ownCloud (opens new window) تتم مشاركة الملاحظات عبر API الذي يوفره Nextcloud / ownCloud. يتم الوصول إلى المهام مباشرةً عبر CalDAV. TIP استخدم عميل مزامنة Nextcloud أو ownCloud لمزامنة ملاحظاتك؛ ملاحظاتك ملفات ماركداون بسيطة. لا حاجة لاختراع العجلة مرتين. وأيضا يوجد مَن يستخدمون خدمات أخرى لمزامنة ملفات ملاحظاتهم (مثل Dropbox أو Syncthing أو Resilio Sync). # ما يفعله QOwnNotesAPI يتيح لك الوصول إلى ملاحظاتك المهملة يتيح لك الوصول إلى نسخ ملاحظاتك # ما لا يفعله QOwnNotesAPI يزامن ملاحظاتك (برجاء استخدام عميل مزامنة ownCloud / Nextcloud) يشارك ملاحظاتك (هذا يتم مباشرةً عبر ownCloud / Nextcloud API) يتيح الوصول إلى صورك من Nextcloud Text (opens new window) (هذا يتم مباشرةً عبر Nextcloud API) ساعدنا في تحسين هذه الصفحة! (opens new window) ← تطبيق ويب QOwnNotes البحث عن الملاحظات → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
