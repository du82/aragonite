full_description = "# افزونه مرورگر همراه وب QOwnNotes امکان برش زدن از صفحه مرورگر و مدیریت نشانک های مرورگر را در مرورگرها و سیستم های عامل فراهم می کند. TIP Info QOwnNote باید اجرا شود تا افزونه مرورگر همراه وب کار کند. نیازی به اتصال اینترنت نیست. افزونه های مرورگر به صورت آفلاین کار می کنند. # نصب دریافت افزونه کروم وب استور (opens new window) صفحه افزونه های فایرفاکس (opens new window) شما می توانید افزونه را در گیت هاب (opens new window) نیز پیدا کنید. برای پیکربندی افزونه توکن امنیتی را اضافه کنید. نخستین باری که روی آیکون افزونه مرورگر QOwnNotes کلیک کنید، کادر محاوره ای دارای توکن امنیتی دریافت خواهید کرد. رونوشت برداری توکن. به مکان مدیریت افزونه مرورگر خود بروید. روی جزئیات افزونه QOwnNotes کلیک کنید. توکن را در قسمت توکن امنیتی بچسبانید. To use the private mode, you need to allow the extension to run in private windows in the extension settings. # وب کلیپر به منظور استفاده کارآمد از وب کلیپر بر روی یک صفحه وب یا متن منتخب کلیک راست کنید. علاوه بر این، می توانید یک یادداشت جدید را با نماگرفتی از صفحه وب کنونی ایجاد نمایید. WARNING Info If the web clipper doesn't work, please check if the QOwnNotes desktop application is running, and the Web Companion browser extension is configured with the security token. Also, make sure you accepted the consent dialog, when you first clicked the extension icon in the browser toolbar. If you are using Firefox, you also need to make sure that you have turned on the optional permission Access your data for all websites in the Permission extension settings, otherwise you might get an error TypeError: chrome.tabs.captureVisibleTab is not a function. TIP وب کلیپر هم قابل اسکریپت نویسی می باشد! در صورت تمایل به کنترل آنچه که از صفحات وب برش می زنید، نگاهی به websocketRawDataHook بیندازید. # نشانک ها در صورت تمایل به کنترل کامل نشانک های مرورگر خود و استفاده از آنها در مرورگرها و سیستم عامل های مختلف می‌توانید از افزونه مرورگر QOwnNotes بهره گیرید. By default, the browser extension will show all links of the current note in a popup when you click the QOwnNotes icon in your browser. این پیوندها یک برچسب کنونی می گیرند. همچنین می توانید با نشانک های برچسب یادداشت (قابل تغییر در تنظیمات) نشانک های خود را در یادداشت ها مدیریت کنید. این پیوند ها همچنین برچسب ها و توضیحی دارند که در افزونه مرورگر نشان داده می شود. نشانک های جدید در یادداشتی با نام نشانک ها ذخیره شده‌اند (همچنین در بخش تنظیمات قابل تغییر هستند). TIP علاوه بر این می توانید نشانک های مرورگر خود را با افزونه مرورگر همراه وب در QOwnNotes وارد نمایید! # چیدمان پیوندهای نشانک - [نام صفحه وب](https://www.example.com) - [نام صفحه وب](https://www.example.com) #برچسب1 #برچسب2 - [نام صفحه وب](https://www.example.com) فقط مقداری توضیح - [نام صفحه وب](https://www.example.com) #برچسب1 #برچسب2 مقداری توضیح و برچسب ها * [نام صفحه وب](https://www.example.com) نویسه لیست جایگزین هم کار می کند 12345You are able to search for name, url tags or description in the browser extension. In the current note all other links inside of text are parsed, but without tags or description. در اصلاح این صفحه ما را یاری کنید! (opens new window) ← پارامترهای رابط خط فرمان مدیر تکه کد خط فرمان → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!"
