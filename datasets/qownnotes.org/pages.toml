["https://qownnotes.org/ar/installation/appimage.html"]
title = "التثبيت كـ AppImage | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = '# التثبيت كـ AppImage يمكنك تنزيل AppImage الأخيرة من صفحة إصدارات QOwnNotes (opens new window). من المفترض أن يكون اسم ملفها شيئا مثل QOwnNotes-x86_64.AppImage في هذه الصفحة. TIP إذا كان مثبتًا لديك jq (opens new window) فيمكنك أيضا تنزيل AppImage الأخيرة مباشرةً: <span dir="rtl"># استعلم عن إصدارة لينكس الأخيرة عبر QOwnNotes API، وحلل JSON الناتج للحصول على الرابط، ونزّلها</span> curl -L https://api.qownnotes.org/latest_releases/linux | jq .url | xargs curl -Lo QOwnNotes-x86_64.AppImage 12 عندئذٍ يمكنك جعل الملف قابلا للتنفيذ: chmod a+x QOwnNotes-*.AppImage 1TIP صور AppImage تحتاج مكتبة libfuse2 حتى تعمل! على أوبنتو مثلا، يمكنك تثبيتها بالأمر sudo apt install libfuse2. بعدئذٍ ستتمكن من تنفيذ الـ AppImage لتشغيل QOwnNotes. WARNING إذا أردت استخدام التحديث التلقائي فنرجو التأكد من وضع ملف AppImage في مكان مسموح لحسابك بالكتابة فيه، مثل مجلد المنزل. TIP إذا واجهتك مشكلة في تشغيل الـ AppImage لأن نسخة مكتبة glibc التي لديك قديمة، يمكنك تجربة الـ AppImage المبنية على OBS (opens new window)؛ من المفترض أنها مبنية مع glibc النسخة 2.16. ساعدنا في تحسين هذه الصفحة! (opens new window) ← التثبيت كحزمة Flatpak التثبيت عبر Nix → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!'
