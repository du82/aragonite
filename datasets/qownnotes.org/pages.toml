title = "Raccourcis | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = "# Raccourcis # Linux / Windows # Dans la fenêtre principale Ctrl + N crée une nouvelle note avec la date et l'heure actuelles dans le nom Ctrl + ⇧ Maj + N crée une nouvelle note dans un nouvel onglet Ctrl + ⇧ Maj + F permet de rechercher des notes (dans le nom de la note et dans son contenu) Alt + F vous permet de rechercher des notes dans toutes les balises / sous-dossiers Alt + ⇧ Maj + P bascule vers l'espace de travail précédent Ctrl + ⇧ Maj + E permet d'éditer une note chiffrée Alt + R supprime la note actuelle Alt + ⇧ Maj + U recherche les mises à jour Ctrl + ⇧ Maj + T ouvre la liste des tâches Ctrl + ⇧ Maj + O ouvre la note courante dans un éditeur externe Alt + ⇧ Maj + O ouvre la note courante dans une vue Alt + ⇧ Maj + F affiche la note courante dans le gestionnaire de fichiers Alt + ⇧ Maj + E active ou désactive l'édition des notes Alt + Up jumps to the previous visible note Alt + Down passe à la note visible suivante Alt + Pg. Préc bascule vers l'onglet de note précédent ⌥ Alt + Pg. Suiv bascule vers l'onglet de note suivant Ctrl + W ferme l'onglet de note actuel Ctrl + ⇧ Maj + D active ou désactive le mode sans distraction vous pouvez également le fermer avec Esc Ctrl + P imprime la note actuelle sous forme de texte Ctrl + ⇧ Maj + P imprime la note courante sous forme de Markdown Ctrl + ⇧ Maj + V colle des notes, des images ou du code HTML à partir du presse-papiers Ctrl + , ouvre les paramètres Alt + ⇧ Maj + A ajoute une nouvelle étiquette à une note Ctrl + ⇧ Maj + R recharge le dossier de notes courant Ctrl + Alt + F lets you select a different note folder Ctrl + ⇧ Maj + S recharge le moteur de script Ctrl + ⇧ Maj + M masque ou affiche la barre de menu principale Ctrl + ⇧ Maj + A vous permet de rechercher des actions Ctrl + S enregistre manuellement les notes modifiées Alt + ⇧ Maj + I ouvre la boîte de dialogue du dépôt de scripts F4 passe au panneau d'édition des notes F5 passe à la liste des notes F6 passe au panneau du sous-dossier de notes F7 passe au panneau des balises F8 passe au panneau de navigation F10 active le menu contextuel du widget courant F11 bascule en mode plein écran Alt + ⇧ Maj + H copie le titre de la note actuelle # Dans la barre de recherche de notes Down or Tab définit le focus sur la liste de notes Return crée une nouvelle note avec le texte de la barre de recherche comme titre # Dans la liste des notes double-cliquez sur une note pour l'ouvrir dans un nouvel onglet (n'oubliez pas qu'il existe un crochet de script qui peut redéfinir l'action de double-clic) Ctrl + A sélectionne toutes les notes (pour les déplacer, les copier ou les supprimer avec un clic droit) Tab ou Retour vous permet d'éditer la note actuelle # Dans le panneau d'édition du texte de la note Ctrl + Click sur un lien pour l'ouvrir Ctrl + F vous permet de rechercher dans la note actuelle utilisez les touches directionnelles ↑ Haut et ↓ Bas ou bien F3 et ⇧ Maj + F3 pour passer aux correspondances précédentes et suivantes respectivement Esc ferme la barre de recherche Ctrl + R vous permet de rechercher et de remplacer dans la note actuelle Ctrl + D duplique la ligne courante ou le texte sélectionné Ctrl + Alt + Down fait la même chose Alt + Backspace supprime la ligne courante Ctrl + Backspace supprime le mot courant Ctrl + L ouvre une boîte de dialogue pour ajouter un lien texte (fonctionne également sur le texte sélectionné) Ctrl + ⇧ Maj + L ouvre une boîte de dialogue permettant d'ajouter un lien vers une note Ctrl + T insère la date courante dans le format spécifié par l'utilisateur Ctrl + ⇧ Maj + I insère une image (l'image sera copiée dans le sous-dossier media du dossier de notes courant) Ctrl + ⇧ Maj + X insère une pièce jointe (le fichier sera copié dans le sous-dossier attachments du dossier de notes courant) Alt + ⇧ Maj + T insère une table Ctrl + ⇧ Maj + C insère un bloc de code à la position courante Ctrl + ⇧ Maj + B insère un bloc de citation à la position courante Ctrl + B met en forme le texte sélectionné en gras Ctrl + I met en forme le texte sélectionné en italique Ctrl + U met en forme le texte sélectionné en souligné Alt + ⇧ Maj + S raye le texte sélectionné Ctrl + ⇧ Maj + U fait défiler les casses pour le texte sélectionné Tab indente le texte sélectionné (fonctionne également sur plusieurs lignes) ⇧ Maj + Tab désindente le texte sélectionné Tab après un caractère de liste non ordonné indente l'élément de liste ⇧ Maj + Tab après un élément de liste non ordonnée le désindente Entrée dans les listes crée un nouvel élément de liste Alt + ← Gauche revient en arrière dans l'historique des notes Alt + → Droite saute en avant dans l'historique des notes Ctrl + ⇧ Maj + 1…9 définit un signet de note sur l'emplacement de signet 1…9 Ctrl + 1…9 bascule vers le signet de note sur l'emplacement de signet 1…9 Ctrl + + augmente la taille de la police du texte de la note d'un point Ctrl + - diminue la taille de la police du texte de la note d'un point Ctrl + 0 réinitialise la taille de la police du texte de la note Ctrl + Espace tente de résoudre des équations simples comme (4+5)*3= devant le curseur, complète automatiquement du texte ou ouvre des URLs Ctrl + ⇧ Maj + H insère un titre basé sur le nom de fichier de la note en haut de cette dernière Alt + ⇧ Maj + X divise la note actuelle en deux notes à la position actuelle du curseur Alt + ⇧ Maj + W recherche le texte sélectionné sur le Web Ctrl + ↑ Haut fait défiler le contenu vers le haut Ctrl + ↓ Bas fait défiler le contenu vers le bas Ctrl + ⇧ Maj + ↓ Bas déplace la ligne courante vers le bas Ctrl + ⇧ Maj + ↑ Haut déplace la ligne courante vers le haut ⇧ Maj + Entrée ajoute deux espaces et un caractère de retour à la ligne pour forcer une nouvelle ligne en Markdown # Dans le panneau d'aperçu de la note Ctrl + F vous permet de rechercher dans la note actuellevous permet de rechercher dans la note actuelle utilisez les touches directionnelles ↑ Haut et ↓ Bas ou bien F3 et ⇧ Maj + F3 pour passer aux correspondances précédentes et suivantes respectivement Esc ferme la barre de recherche # Dans la liste Todo Ctrl + S enregistre l'élément de tâche actuel Ctrl + I enregistre l'élément de tâche actuel et l'insère dans la note actuelle Ctrl + R supprime l'élément de tâche actuel # macOS # Dans la fenêtre principale ⌘ Cmd + N crée une nouvelle note avec la date et l'heure actuelles dans son nom ⌘ Cmd + ⇧ Maj + N crée une nouvelle note dans un nouvel onglet ⌘ + ⇧ Maj + F permet de rechercher des notes (dans le nom de la note et dans son contenu) ^ Ctrl + F permet de rechercher des notes dans toutes les balises / sous-dossiers ^ Ctrl + ⇧ Maj + P bascule vers l'espace de travail précédent ⌘ Cmd + ⇧ Maj + E permet d'éditer une note chiffrée ^ Ctrl + R supprime la note courante ^ Ctrl + ⇧ Maj + U recherche les mises à jour ⌘ Cmd + ⇧ Maj + T ouvre la liste des tâches ⌘ Cmd + ⇧ Maj + O ouvre la note courante dans un éditeur externe ⌃ Ctrl + ⇧ Maj + O ouvre la note courante dans une vue ^ Ctrl + ⇧ Maj + F ouvre le dossier de la note actuelle dans le Finder ⌃ Ctrl + ⇧ Maj + E active ou désactive l'édition des notes ^ Ctrl + ↑ Haut passe à la note visible précédente ^ Ctrl + ↓ Bas passe à la note visible suivante ⌥ Alt + Pg. Préc bascule vers l'onglet de note précédent ⌥ Alt + Pg. Suiv bascule vers l'onglet de note suivant ⌘ Cmd + W ferme l'onglet de note courant ⌘ Cmd + ⇧ Maj + D active ou désactive le mode sans distraction vous pouvez également le fermer avec Esc ⌘ Cmd + P imprime la note courante sous forme de texte ⌘ Cmd + ⇧ Maj + P imprime la note courante sous forme de Markdown ⌘ Cmd + ^ Ctrl + V colle des notes, des images ou du HTML à partir du presse-papiers ⌘ Cmd + , ouvre les paramètres ^ Ctrl + ⇧ Maj + A ajoute une nouvelle étiquette à une note ⌘ Cmd + ⇧ Maj + R recharge le dossier de notes courant ⌘ Cmd + ^ Ctrl + F permet de sélectionner un dossier de notes différent ⌘ Cmd + ⇧ Maj + S recharge le moteur de script ⌘ Cmd + ⇧ Maj + M masque ou affiche la barre de menu principal