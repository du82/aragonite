["https://qownnotes.org/it/getting-started/command-line-snippet-manager.html"]
title = "Gestore dei frammenti di comandi | QOwnNotes"
description = "Open source Markdown note taking for Linux, macOS and Windows, that works together with Nextcloud Notes"
full_description = '''# Gestore dei frammenti di comandi Puoi usare il Gestore dei frammenti di comandi QOwnNotes (opens new window) per eseguire frammenti di comandi memorizzati nelle note in QOwnNotes tramite la linea di comando. Puoi usare note con etichette speciali per memorizzare frammenti di comandi che puoi eseguire dal gestore dei frammenti di comandi. # Installazione Visita la pagina dell'ultimo rilascio (opens new window) e scarica la versione di cui hai bisogno. TIP Se hai installato jq (opens new window) puoi usarlo per scaricare e installare, per esempio l'ultima AppImage di Linux AMD64 in /usr/local/bin/qc: curl https://api.github.com/repos/qownnotes/qc/releases/latest | \ jq '.assets[] | select(.browser_download_url | endswith("_linux_amd64.tar.gz")) | .browser_download_url' | \ xargs curl -Lo /tmp/qc.tar.gz && \ tar xfz /tmp/qc.tar.gz -C /tmp && \ rm /tmp/qc.tar.gz && \ sudo mv /tmp/qc /usr/local/bin/qc && \ /usr/local/bin/qc --version 1234567 # Dipendenze fzf (opens new window) (fuzzy search) or peco (opens new window) (più vecchio, ma più probabile che sia installato per impostazione predefinita) deve essere installato per cercare i comandi sulla riga di comando. TIP Per impostazione predefinita viene utilizzato fzf per la ricerca, ma puoi utilizzare peco impostandolo con qc configure. # Preparazione Prima di utilizzare lo snippet manager è necessario abilitare il server Web socket (2) nelle impostazioni Estensione del browser / frammenti di comando (1) in QOwnNotes. Quindi devi mostrare il token di sicurezza (3) e copiarlo (4). Ora apri il file di configurazione dello snippet manager con: # Configura il gestore degli snippet qc configure 12E inserisci il token di sicurezza nell'attributo token: [QOwnNotes] token = "yourtokenhere" 12TIP Nelle impostazioni di QOwnNotes puoi anche impostare quale tag nota deve essere utilizzato per cercare i comandi nelle note. Per impostazione predefinita, viene utilizzato il tag commands. # Sintassi dei frammenti di comando Puoi utilizzare elenchi non ordinati con blocchi di codice in linea per memorizzare frammenti di comando. Tutte le note con il tag comandi vengono cercate per frammenti di comando. Se aggiungi un cmd: prima del blocco di codice in linea, il comando si troverà anche nella nota corrente indipendentemente dai tag della nota. - `echo sono un comando` sono una descrizione #tag1 #tag2 #tag3 * `echo sono anche un comando` Sono una descrizione #tag3 #tag4 #tag5 - cmd: `echo sarò trovato nella nota corrente` Questo comando sarà trovato nella nota corrente indipendentemente dai tag della nota <!-- Esempio di richiesta di input da parte dell'utente --> - `read -p "PR ID: " id && git fetch origin pull/$id/head:pull-$id && git checkout pull-$id` Richiedi l'ID della richiesta pull e la richiesta pull checkout 1234567I blocchi di codice bash o shell, preceduti da un'intestazione 2 o superiore come descrizione, possono essere utilizzati anche per frammenti di comando. I tag sono supportati anche se si trovano tra l'intestazione e il blocco di codice. ## Fallo con un blocco di codice "bash". - questo testo verrà ignorato - ma si possono usare i tag: #tag1 #tag2 ```bash echo fai questo echo fai quest'altro ``` ## Fai qualcos'altro con un blocco di codice "sh". ```sh echo fare qualcos'altro echo fai qualcos'altro ``` L'esempio precedente risulterà in due frammenti di comando, il primo con i due tag tag1 e tag2. # Come si usa # Cerca ed esegui frammenti di comando qc exec 12# Cerca e visualizza frammenti di comando qc search 12# Configurazione Esegui qc configure. [General] editor = "vim" # il tuo editor di testo preferito column = 40 # numero di colonne per la lista comandi selectcmd = "fzf" # selettore per modificare il comando (fzf o peco) sortby = "" # specifica come i frammenti saranno ordinati (recency (predefinito), -recency, description, -description, command, -command, output, -output) [QOwnNotes] token = "MvTagHXF" # il tuo token API QOwnNotes websocket_port = 22222 # porta websocket di QOwnNotes 123456789# Completamento console Puoi generare il codice per il completamento da console per la tua shell con qc completion <shell>. Per esempio, per la Fish shell puoi usare: qc completion fish > ~/.config/fish/completions/qc.fish 1 Aiutaci a migliorare questo sito! (opens new window) ← Estensione del browser QOwnNotes Web Companion QOwnNotes Web App → Crafted by Patrizio Bekerle with ❤️ How did you find out about QOwnNotes?0 / 200 Submit Thank you for letting us know!'''
year_published = 2025
