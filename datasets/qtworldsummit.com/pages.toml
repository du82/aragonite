["https://qtworldsummit.com"]
title = "Qt World Summit 2025 | Munich, Germany"
description = """
All-Access Pass (2 Days)

Entry to all QtWS sessions: keynotes and breakout
Meals, snacks and drinks included
Exclusive entertainment
                        Buy Tickets"""
full_description = "Interested in learning more about sponsorship options for Qt World Summit 2025?Please contact us at qtws@qt.io. You can freely choose the sessions you want to attend from the event agenda. Pre-booking is not possible. You will get all the session recordings after the event. Yes, you are able to attend only the first day of Qt World Summit by purchasing the ticket: Day 1 Only. The contract terms (“Terms”) between The Qt Company Oy, having its registered address at Miestentie 7, 02150 Espoo, Finland (“The Qt Company”) and you as the customer (“Customer”) commences upon the confirmation of Customer’s booking via Eventbrite to the event called Qt World Summit (“Event”) by The Qt Company. The booking information given by the Customer should contain at least the following data: company name, the participating person’s job title/function, and relevant contact details, e.g. email address and mobile number. The Customer will not be permitted to participate in the Event if the full payment by the Customer has not been received by The Qt Company. Cancellations received by email address qtws@qt.io on or before April 5th, 2025, by 4:00 pm CET, will receive full credit of 100% paid registration fees. No refunds or credits will be issued after April 5th, 2025. The Customer may transfer his/her registration to another person until seventy-two (72) hours of Customer´s scheduled arrival date by providing authorization to The Qt Company by email at qtws@qt.io. Personal data of The Qt Company’s customers is stored and processed according to the Act on the Protection of Privacy in Electronic Communications. Customers that do not agree with this should contact The Qt Company in writing immediately by email address qtws@qt.io. The Customer confirms that he/she has agreed that all customer data is stored in the database of The Qt Company, and The Qt Company shall have the right to use Customer’s job function, company name and logo in The Qt Company’s promotional materials for future editions of the Event and services related to the Event."
year_published = 2025
clearnet = "https://qtworldsummit.com"
