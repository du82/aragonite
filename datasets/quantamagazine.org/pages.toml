full_description = "What's up in Geometry Latest Articles The ‘Elegant’ Math Model That Could Help Rescue Coral Reefs mathematical biology The ‘Elegant’ Math Model That Could Help Rescue Coral Reefs By Max G. Levy February 26, 2025 Comment Save Article Read Later Physicists and marine biologists built a quantitative framework that predicts how coral polyps collectively construct a variety of coral shapes. The Largest Sofa You Can Move Around a Corner geometry The Largest Sofa You Can Move Around a Corner By Richard Green February 14, 2025 Comment Save Article Read Later A new proof reveals the answer to the decades-old “moving sofa” problem. It highlights how even the simplest optimization problems can have counterintuitive answers. Mathematicians Discover New Way for Spheres to ‘Kiss’ sphere packing Mathematicians Discover New Way for Spheres to ‘Kiss’ By Gregory Barber January 15, 2025 Comment Save Article Read Later A new proof marks the first progress in decades on important cases of the so-called kissing problem. Getting there meant doing away with traditional approaches. The Year in Math 2024 in Review The Year in Math By Jordana Cepelewicz December 16, 2024 Comment Save Article Read Later Landmark results in geometry and number theory marked an exciting year for mathematics, at a time when advances in artificial intelligence are starting to transform the subject’s future. Physicists Reveal a Quantum Geometry That Exists Outside of Space and Time fundamental physics Physicists Reveal a Quantum Geometry That Exists Outside of Space and Time By Charlie Wood September 25, 2024 Comment Save Article Read Later A decade after the discovery of the “amplituhedron,” physicists have excavated more of the timeless geometry underlying the standard picture of how particles move. If the Universe Is a Hologram, This Long-Forgotten Math Could Decode It fundamental physics If the Universe Is a Hologram, This Long-Forgotten Math Could Decode It By Charlie Wood September 25, 2024 Comment Save Article Read Later A 1930s-era breakthrough is helping physicists understand how quantum threads could weave together into a holographic space-time fabric. Mathematicians Discover New Shapes to Solve Decades-Old Geometry Problem geometry Mathematicians Discover New Shapes to Solve Decades-Old Geometry Problem By Gregory Barber September 20, 2024 Comment Save Article Read Later Mathematicians have long wondered how “shapes of constant width” behave in higher dimensions. A surprisingly simple construction has given them an answer. The Geometric Tool That Solved Einstein’s Relativity Problem explainers The Geometric Tool That Solved Einstein’s Relativity Problem By Joseph Howlett August 12, 2024 Comment Save Article Read Later Tensors are used all over math and science to reveal hidden geometric truths. What are they? Monumental Proof Settles Geometric Langlands Conjecture Langlands program Monumental Proof Settles Geometric Langlands Conjecture By Erica Klarreich July 19, 2024 Comment Save Article Read Later In work that has been 30 years in the making, mathematicians have proved a major part of a profound mathematical vision called the Langlands program. Previous 1 2 3 4 ... 19 Next Follow Quanta Facebook Facebook X Youtube YouTube Instagram Instagram RSS RSS Bluesky Newsletter Newsletter Past Week Most Read Articles Undergraduate Upends a 40-Year-Old Data Science Conjecture By Steve Nadis After 20 Years, Math Couple Solves Major Group Theory Problem By Leila Sloman Chatbot Software Begins to Face Fundamental Limitations By Anil Ananthaswamy New Proofs Probe the Limits of Mathematical Truth By Joseph Howlett The Quanta Newsletter Get highlights of the most important news delivered to your email inbox Email Subscribe Recent newsletters"
