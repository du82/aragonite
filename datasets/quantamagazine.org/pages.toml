description = "Leila Sloman is a math writer based in Princeton, New Jersey. She received her Ph.D. in mathematics from Stanford University in 2021, and has also written for Popular Mechanics and Scientific American."
full_description = "Leila Sloman Contributing Correspondent Latest Articles After 20 Years, Math Couple Solves Major Group Theory Problem group theory After 20 Years, Math Couple Solves Major Group Theory Problem By Leila Sloman February 19, 2025 Comment Save Article Read Later Britta Späth has dedicated her career to proving a single, central conjecture. She’s finally succeeded, alongside her partner, Marc Cabanes. ‘Groups’ Underpin Modern Math. Here’s How They Work. group theory ‘Groups’ Underpin Modern Math. Here’s How They Work. By Leila Sloman September 6, 2024 Comment Save Article Read Later What do the integers have in common with the symmetries of a triangle? In the 19th century, mathematicians invented groups as an answer to this question. Grad Students Find Inevitable Patterns in Big Sets of Numbers combinatorics Grad Students Find Inevitable Patterns in Big Sets of Numbers By Leila Sloman August 5, 2024 Comment Save Article Read Later A new proof marks the first progress in decades on a problem about how order emerges from disorder. In Highly Connected Networks, There’s Always a Loop graph theory In Highly Connected Networks, There’s Always a Loop By Leila Sloman June 7, 2024 Comment Save Article Read Later Mathematicians show that graphs of a certain common type must contain a route that visits each point exactly once. Geometers Engineer New Tools to Wrangle Spacecraft Orbits geometry Geometers Engineer New Tools to Wrangle Spacecraft Orbits By Leila Sloman April 15, 2024 Comment Save Article Read Later Mathematicians think abstract tools from a field called symplectic geometry might help with planning missions to far-off moons and planets. Number of Distances Separating Points Has a New Bound geometry Number of Distances Separating Points Has a New Bound By Leila Sloman April 9, 2024 Comment Save Article Read Later Mathematicians have struggled to prove Falconer’s Conjecture, a simple, but far-reaching, hypothesis about the distances between points. They’re finally getting close. Maze Proof Establishes a ‘Backbone’ for Statistical Mechanics probability Maze Proof Establishes a ‘Backbone’ for Statistical Mechanics By Leila Sloman February 7, 2024 Comment Save Article Read Later Four mathematicians have estimated the chances that there’s a clear path through a random maze. The Mathematician Who Finds the Poetry in Math and the Math in Poetry Q&A The Mathematician Who Finds the Poetry in Math and the Math in Poetry By Leila Sloman January 12, 2024 Comment Save Article Read Later The links between math, music and art have been explored for thousands of years. Sarah Hart is now turning a mathematical eye to literature. ‘A-Team’ of Math Proves a Critical Link Between Addition and Sets combinatorics ‘A-Team’ of Math Proves a Critical Link Between Addition and Sets By Leila Sloman December 6, 2023 Comment Save Article Read Later A team of four prominent mathematicians, including two Fields medalists, proved a conjecture described as a “holy grail of additive combinatorics.” Previous 1 2 3 4 Next About the author Leila Sloman is a math writer based in Princeton, New Jersey. She received her Ph.D. in mathematics from Stanford University in 2021, and has also written for Popular Mechanics and Scientific American. She was an intern at Quanta Magazine in 2022. Follow Quanta Facebook Facebook X Youtube YouTube Instagram Instagram RSS RSS Bluesky Newsletter Newsletter All Time Most Read from Leila Sloman Mathematicians Discover the Fibonacci Numbers Hiding in Strange Spaces By Leila Sloman Surprise Computer Science Proof Stuns Mathematicians By Leila Sloman ‘A-Team’ of Math Proves a Critical Link Between Addition and Sets By Leila Sloman A Very Big Small Leap Forward in Graph Theory By Leila Sloman The Quanta Newsletter Get highlights of the most important news delivered to your email inbox Email Subscribe Recent newsletters"
