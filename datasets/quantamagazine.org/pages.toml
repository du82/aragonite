title = "About Quanta Magazine"
description = "Illuminating basic science and math research through public service journalism."
full_description = '''About Quanta Magazine Illuminating basic science and math research through public service journalism. Mission Statement Quanta Magazine is an editorially independent online publication launched by the Simons Foundation in 2012 to enhance public understanding of science. Why Quanta? Albert Einstein called photons “quanta of light.” Our goal is to “illuminate science.” Our reporters focus on developments in mathematics, theoretical physics, theoretical computer science and the basic life sciences. The best traditional news organizations provide excellent reporting on applied areas of science such as health, medicine, technology, engineering and the environment. We strive to complement and augment existing media coverage. Our work often resembles journalistic alchemy — we mash together the complexities of science with the malleable art of storytelling in an attempt to forge a precious new alloy. It can be a mind-bending enterprise, but we relish the challenge. At Quanta Magazine, scientific accuracy is every bit as important as telling a good story. Since Quanta is a nonprofit foundation-funded publication, all of its resources go toward producing responsible, freely accessible journalism that is meticulously researched, reported, edited, copy-edited and fact-checked. And our editorial independence ensures the impartiality of our science coverage — our articles do not reflect or represent the views of the Simons Foundation. All editorial decisions, including which research or researchers to cover, are made by Quanta’s staff reporting to the editor in chief; editorial content is not reviewed by anyone outside of the news team prior to publication; Quanta has no involvement in any of the Simons Foundation’s grant-giving or research efforts; and researchers who receive funding from the foundation do not receive preferential treatment. The decision to cover a particular researcher or research result is made solely on editorial grounds in service of our readers. Quanta has been recognized with numerous awards, including the 2022 Pulitzer Prize in Explanatory Reporting, the 2020 National Magazine Award for General Excellence and two People’s Voice Webby Awards. To reach an even wider audience, we have syndication partnerships with several publications, which reprint our articles. Through international partnerships, our articles have been translated into German, Spanish, French, Chinese, Italian and Japanese, and we plan to make them available in other languages. We want everyone to keep reading. Thank you for visiting Quanta Magazine. We invite you to explore our pages, and we look forward to your comments. Syndication Partners Latest News About Quanta Quanta Magazine Unravels Space and Time in Ambitious New Series 09.25.2024 For over a decade, Quanta Magazine has challenged and delighted fans with stories about the most fundamental questions in science. Today, in its most ambitious project to date, the magazine brings its audience into what might be the deepest mystery of all: the nature of reality itself. Samir Patel Joins Quanta Magazine as Editor-in-Chief 04.16.2024 Patel succeeds Thomas Lin, who had led Quanta since its launch as Simons Science News in 2012. Lin remains at the Simons Foundation as the head of Quanta Books, a new science book imprint. Quanta Magazine Partners With PRX and Cosmologist Janna Levin for Season 3 of the Joy of Why Podcast 01.25.2024 The popular math and science podcast returns with a new co-host and a 24-episode season. All news about Quanta About Simons Foundation The Simons Foundation’s mission is to advance the frontiers of research in mathematics and the basic sciences. Co-founded in New York City by Jim and Marilyn Simons, the foundation celebrated its 25th anniversary in 2019. The Simons Foundation at its core exists to support basic — or discovery-driven — scientific research, undertaken in pursuit of understanding the phenomena of our world. Staff Featured Contributors Advisory Board Staff Samir Patel Editor in Chief Natalie Wolchover Senior Editor Michael Moyer Executive Editor Jordana Cepelewicz Math Editor Bill Andrews Senior Editor Matt Carlstrom Senior Engagement Editor Samuel Velasco Art Director Charlie Wood Staff Writer Yasemin Saplakoglu Staff Writer Kristina Armitage Visual Designer Ben Brubaker Staff Writer Christopher W. Young Director of Video Arleen Santana Web Producer Emily Buder Senior Video Producer Hannah Waters Senior Editor Simone Barr Audience Producer Joseph Howlett Staff Writer Mark Belan Graphics Editor Featured Contributors Anil Ananthaswamy Contributing Writer Carrie Arnold Contributing Writer Philip Ball Contributing Writer Rebecca Boyle Contributing Writer Viviane Callier Contributing Writer Lakshmi Chandrasekaran Contributing Writer Puja Changoiwala Contributing Writer Lyndie Chiou Contributing Writer K.C. Cole Contributing Writer Rachel Crowell Contributing Writer Claudia Dreifus Contributing Writer Dan Falk Contributing Writer R. Douglas Fields Contributing Columnist Veronique Greenwood Contributing Writer Sheon Han Contributing Writer Nicole Yunger Halpern Contributing Columnist Kevin Hartnett Contributing Writer Patrick Honner Contributing Columnist Kelsey Houston-Edwards Contributing Writer Erica Klarreich Contributing Correspondent Roberta Klarreich Contributing Copy Editor Liz Kruesi Contributing Writer Janna Levin Contributing Columnist Thomas Lewton Contributing Writer Katie McCormick Contributing Writer Melanie Mitchell Contributing Columnist George Musser Contributing Writer Pradeep Mutalik Puzzle Columnist Steve Nadis Contributing Writer Jonathan O'Callaghan Contributing Writer C. Brandon Ogbunu Contributing Columnist Stephen Ornes Contributing Writer Allison Parshall Contributing Writer Gabriel Popkin Contributing Writer David S. Richeson Contributing Columnist Robin George Andrews Contributing Writer Leila Sloman Contributing Correspondent Tara C. Smith Contributing Columnist Joshua Sokol Contributing Writer Alex Stone Contributing Writer Steven Strogatz Podcast Host Joanna Thompson Contributing Writer Allison Whitten Contributing Writer Christie Wilcox Contributing Writer Ariel Bleicher Contributing Writer Matt Strassler Contributing Writer Shi En Kim Contributor Advisory Board Scott Aaronson Schlumberger Chair of Computer Science and Director of the Quantum Information Center, University of Texas at Austin Boaz Barak Gordon McKay Professor of Computer Science, Harvard University Laura DeMarco Professor of Mathematics, Harvard University Maria Geffen Associate Professor of Otorhinolaryngology, Neuroscience and Neurology, University of Pennsylvania David J. Gross Chancellor’s Chair professor of theoretical physics, Kavli Institute for Theoretical Physics Mark Jannot Contributing editor, The New York Times Magazine Nicole King Professor, Department of Molecular and Cell Biology, University of California, Berkeley Alex Kontorovich Distinguished Professor of Mathematics, Rutgers University Kate LaRue Digital Art Director, The New York Times Magazine Sarah Marshall VP, Audience Strategy, Condé Nast Priyamvada Natarajan Professor, Departments of Astronomy & Physics, Yale University const staffArray = {"59339":{"name":"Samir Patel","avatar":"https:\/\/www.quantamagazine.org\/wp-content\/uploads\/2024\/04\/Samir-Patel-520x520.jpg","url":"https:\/\/www.quantamagazine.org\/authors\/samirpatel\/","description":"Samir Patel joined <i>Quanta Magazine<\/i> as Editor in Chief in 2024. He previously served in the same position at <i>Atlas Obscura<\/i>, and was also deputy editor of <i>Archaeology Magazine<\/i>. As a science writer and photographer, his work has appeared in <i>Nature<\/i>, <i>The New York Times<\/i>, <i>National Public Radio<\/i>, <i>Discover<\/i>, and other publications. He has reported from all over the world and covered a wide range of topics, from archaeology and climate to art conservation and social justice. Samir also teaches reporting and writing as an adjunct professor at Columbia Journalism School. He lives with his family in Brooklyn.","tagline":"Editor in Chief","twitter":"","contact":"\/contact-us\/?editor=samir-patel"},"10":{"name":"Natalie Wolchover","avatar":"https:\/\/www.quantamagazine.org\/wp-content\/uploads\/2024\/09\/QuantaTeam_Natalie1-white-BG-520x520.jpg","url":"https:\/\/www.quantamagazine.org\/authors\/natalie\/","description":"Natalie Wolchover is a senior editor at <i>Quanta Magazine<\/i> covering the physical sciences. Her writing has been featured in <i>The Best American Science and Nature Writing<\/i>, <i>The Best American Magazine Writing<\/i> and <i>The Best Writing on Mathematics<\/i> and has won several awards, including the 2022 Pulitzer Prize for Explanatory Reporting, the 2016 Evert Clark\/Seth Payne Award and the American Institute of Physics\u2019 2017 Science Communication Award, and she is a National Magazine Award finalist. Natalie directs the Institute for Advanced Study\u2019s Science Journalism Workshop. She is currently writing a book titled <i>The Question to Which the Universe Is the Answer<\/i>, scheduled for publication in Fall 2025.","tagline":"Senior Editor","twitter":"https:\/\/twitter.com\/nattyover","contact":"\/contact-us\/?editor=natalie-wolchover"},"23":{"name":"Michael Moyer","avatar":"https:\/\/www.quantamagazine.org\/wp-content\/uploads\/2024\/09\/QuantaTeam_Michael-M-white-BG2-520x520.jpg","url":"https:\/\/www.quantamagazine.org\/authors\/michael\/","description":"Before joining <em>Quanta Magazine<\/em> in 2014, Michael Moyer spent six years at <em>Scientific American<\/em>, where he was most recently in charge of physics and space coverage and led the magazine\u2019s special editorial projects. His writing has been recognized with the American Institute of Physics Science Writing Award and included in the \u201cThe Best American Science and Nature Writing\u201d book series. Prior to his tenure at <em>Scientific American<\/em>, he was articles editor at <em>Popular Science<\/em> magazine, and before that, he studied physics and the philosophical foundations of physics at Columbia University and the University of California, Berkeley.","tagline":"Executive Editor","twitter":"https:\/\/twitter.com\/mmoyr","contact":"\/contact-us\/?editor=michael-moyer"},"1241":{"name":"Jordana Cepelewicz","avatar":"https:\/\/www.quantamagazine.org\/wp-content\/uploads\/2024\/09\/QuantaTeam_Jordana-White-BG-520x520.jpg","url":"https:\/\/www.quantamagazine.org\/authors\/jordana-cepelewicz\/","description":"Jordana Cepelewicz is the math editor at <em>Quanta Magazine<\/em>. She previously covered mathematics and biology as a staff writer. Her writing has also appeared in <em>Nautilus <\/em>and\u00a0<em>Scientific American<\/em>. Before entering the world of science reporting, Jordana did editorial work at\u00a0<em>Harper\u2019s Magazine<\/em>,\u00a0<em>Politico<\/em> and\u00a0<em>Tea Leaf Nation<\/em>. She graduated from Yale University in 2015 with bachelor\u2019s degrees in mathematics and comparative literature.","tagline":"Math Editor","twitter":"https:\/\/twitter.com\/jordanacep","contact":"\/contact-us\/?editor=jordana-cepelewicz"},"16315":{"name":"Bill Andrews","avatar":"https:\/\/www.quantamagazine.org\/wp-content\/uploads\/2019\/09\/BANDREWS-temporary-520x520.jpg","url":"https:\/\/www.quantamagazine.org\/authors\/billandrews\/","description":"Bill Andrews joined\u00a0<em>Quanta Magazine<\/em>\u00a0as senior editor in 2019. Previously, he spent seven years at\u00a0<em>Discover<\/em>, where he led the magazine's award-winning math, space and physics coverage. He has also worked at\u00a0<em>Astronomy<\/em>\u00a0magazine and the Mayo Clinic. He received his bachelor's degree in science writing at the Massachusetts Institute of Technology and his master's in journalism at the University of Wisconsin, Madison.","tagline":"Senior Editor","twitter":"","contact":"\/contact-us\/?editor=bill-andrews"},"20495":{"name":"Matt Carlstrom","avatar":"https:\/\/www.quantamagazine.org\/wp-content\/uploads\/2020\/03\/QuantaTeam_MCARLSTROM-temporary-520x520.jpg","url":"https:\/\/www.quantamagazine.org\/authors\/mattcarlstrom\/","description":"Matt Carlstrom, who joined <i>Quanta Magazine<\/i> as its first engagement editor in 2020, leads the magazine\u2019s social media, newsletters, syndication and data analytics. Previously, for the World Science Festival, Matt produced live programming about computer science, physics and neuroscience. At <i>Big Think<\/i>, he produced video interviews with luminaries including E.O. Wilson, Jennifer Doudna and Ronan Farrow. He worked in digital advertising for clients including Google and HP. He studied advertising research and strategy at Temple University.","tagline":"Senior Engagement Editor ","twitter":"","contact":"\/contact-us\/?editor=matt-carlstrom"},"23845":{"name":"Samuel Velasco","avatar":"https:\/\/www.quantamagazine.org\/wp-content\/uploads\/2022\/02\/SVELASCO-Temporary_v3-520x520.jpg","url":"https:\/\/www.quantamagazine.org\/authors\/svelasco\/","description":"Before joining <em>Quanta<\/em>, Samuel Velasco was the creative director at 5W Infographics, a firm that specializes in information design and data visualization. Prior to that he was an art director at\u00a0<em>Fortune<\/em>\u00a0magazine, where he designed features and department stories and created infographics. Samuel\u2019s work has appeared in publications such as <em>National Geographic<\/em>, <em>Scientific American<\/em>, <em>Smithsonian<\/em> magazine and <em>The New York Times<\/em> and has won more than 30 international awards. He is a co-author of the book\u00a0<em>Look Inside<\/em>.","tagline":"Art Director","twitter":"","contact":"\/contact-us\/?editor=samuel-velasco"},"8084":{"name":"Charlie Wood","avatar":"https:\/\/www.quantamagazine.org\/wp-content\/uploads\/2021\/11\/CW_1-520x520.jpg","url":"https:\/\/www.quantamagazine.org\/authors\/charlie-wood\/","description":"Charlie Wood is a staff writer covering physics at <em>Quanta Magazine<\/em>. His articles about advances in the physical sciences both on and off the planet have appeared in <em>Popular Science<\/em>, <em>Scientific American<\/em>, <em>The Christian Science Monitor<\/em> and other publications. Previously, he taught high school physics and English in Mozambique and Japan. He has a master\u2019s degree in science journalism from New York University and a bachelor\u2019s degree in physics from Brown University.","tagline":"Staff Writer","twitter":"https:\/\/twitter.com\/walkingthedot","contact":"\/contact-us\/?editor=charlie-wood"},"42263":{"name":"Yasemin Saplakoglu","avatar":"https:\/\/www.quantamagazine.org\/wp-content\/uploads\/2022\/02\/YSaplakoglu_1-520x520.jpg","url":"https:\/\/www.quantamagazine.org\/authors\/yasemin-saplakoglu\/","description":"Yasemin is a staff writer covering biology for <i>Quanta Magazine<\/i>. Previously, she reported for three years on a wide range of fields for <i>Live Science<\/i>, with e'''
