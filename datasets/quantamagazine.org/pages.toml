full_description = "Charlie Wood Staff Writer X Twitter Email Latest Articles Heat Destroys All Order. Except for in This One Special Case. quantum physics Heat Destroys All Order. Except for in This One Special Case. By Charlie Wood January 16, 2025 Comment Save Article Read Later Heat is supposed to ruin anything it touches. But physicists have shown that an idealized form of magnetism is heatproof. Exotic New Superconductors Delight and Confound condensed matter physics Exotic New Superconductors Delight and Confound By Charlie Wood December 6, 2024 Comment Save Article Read Later Three new species of superconductivity were spotted this year, illustrating the myriad ways electrons can join together to form a frictionless quantum soup. It Might Be Possible to Detect Gravitons After All quantum gravity It Might Be Possible to Detect Gravitons After All By Charlie Wood October 30, 2024 Comment Save Article Read Later A new experimental proposal suggests detecting a particle of gravity is far easier than anyone imagined. Now physicists are debating what it would really prove. Can Space-Time Be Saved? Q&A Can Space-Time Be Saved? By Charlie Wood September 25, 2024 Comment Save Article Read Later Curious connections between physics and math suggest to Latham Boyle that space-time may survive the jump to the next theory of reality. Physicists Reveal a Quantum Geometry That Exists Outside of Space and Time fundamental physics Physicists Reveal a Quantum Geometry That Exists Outside of Space and Time By Charlie Wood September 25, 2024 Comment Save Article Read Later A decade after the discovery of the “amplituhedron,” physicists have excavated more of the timeless geometry underlying the standard picture of how particles move. If the Universe Is a Hologram, This Long-Forgotten Math Could Decode It fundamental physics If the Universe Is a Hologram, This Long-Forgotten Math Could Decode It By Charlie Wood September 25, 2024 Comment Save Article Read Later A 1930s-era breakthrough is helping physicists understand how quantum threads could weave together into a holographic space-time fabric. The Two Faces of Space-Time explainers The Two Faces of Space-Time By Charlie Wood September 25, 2024 Comment Save Article Read Later A mysterious phenomenon known as duality often leads to new discoveries in physics. This time, space-time itself can sometimes be two things at once. The Thought Experiments That Fray the Fabric of Space-Time fundamental physics The Thought Experiments That Fray the Fabric of Space-Time By Charlie Wood +1 authors Mark Belan September 25, 2024 Comment Save Article Read Later These three imagined scenarios lead many physicists to doubt that space-time is fundamental. The Unraveling of Space-Time fundamental physics The Unraveling of Space-Time By Charlie Wood +5 authors Joseph Howlett Amanda Gefter Emily Buder Mark Belan Natalie Wolchover September 25, 2024 Comment Save Article Read Later This special issue of Quanta Magazine explores the ultimate scientific quest: the search for the fundamental nature of reality. Previous 1 2 3 4 ... 11 Next About the author Charlie Wood is a staff writer covering physics at Quanta Magazine. His articles about advances in the physical sciences both on and off the planet have appeared in Popular Science, Scientific American, The Christian Science Monitor and other publications. Previously, he taught high school physics and English in Mozambique and Japan. He has a master’s degree in science journalism from New York University and a bachelor’s degree in physics from Brown University. Follow Quanta Facebook Facebook X Youtube YouTube Instagram Instagram RSS RSS Bluesky Newsletter Newsletter All Time Most Read from Charlie Wood Inside the Proton, the ‘Most Complicated Thing You Could Possibly Imagine’ By Charlie Wood Merrill Sherman Physicists Use Quantum Mechanics to Pull Energy out of Nothing By Charlie Wood How Our Reality May Be a Sum of All Possible Realities By Charlie Wood Physicists Reveal a Quantum Geometry That Exists Outside of Space and Time By Charlie Wood The Quanta Newsletter Get highlights of the most important news delivered to your email inbox Email Subscribe Recent newsletters"
