full_description = "Yasemin Saplakoglu Staff Writer Email Latest Articles Concept Cells Help Your Brain Abstract Information and Build Memories memory Concept Cells Help Your Brain Abstract Information and Build Memories By Yasemin Saplakoglu January 21, 2025 Comment Save Article Read Later Individual cells in the brain light up for specific ideas. These concept neurons, once known as “Jennifer Aniston cells,” help us think, imagine and remember episodes from our lives. Fish Have a Brain Microbiome. Could Humans Have One Too? microbiome Fish Have a Brain Microbiome. Could Humans Have One Too? By Yasemin Saplakoglu December 2, 2024 Comment Save Article Read Later The discovery that other vertebrates have healthy, microbial brains is fueling the still controversial possibility that we might have them as well. How the Human Brain Contends With the Strangeness of Zero neuroscience How the Human Brain Contends With the Strangeness of Zero By Yasemin Saplakoglu October 18, 2024 Comment Save Article Read Later Zero, which was invented late in history, is special among numbers. New studies are uncovering how the brain creates something out of nothing. The Cellular Secret to Resisting the Pressure of the Deep Sea biophysics The Cellular Secret to Resisting the Pressure of the Deep Sea By Yasemin Saplakoglu September 9, 2024 Comment Save Article Read Later Cell membranes from comb jellies reveal a new kind of adaptation to the deep sea: curvy lipids that conform to an ideal shape under pressure. How Colorful Ribbon Diagrams Became the Face of Proteins molecular biology How Colorful Ribbon Diagrams Became the Face of Proteins By Yasemin Saplakoglu August 23, 2024 Comment Save Article Read Later Proteins are often visualized as cascades of curled ribbons and twisted strings, which both reveal and conceal the mess of atoms that make up these impossibly complex molecules. What Happens in a Mind That Can’t ‘See’ Mental Images neuroscience What Happens in a Mind That Can’t ‘See’ Mental Images By Yasemin Saplakoglu August 1, 2024 Comment Save Article Read Later Neuroscience research into people with aphantasia, who don’t experience mental imagery, is revealing how imagination works and demonstrating the sweeping variety in our subjective experiences. How AI Revolutionized Protein Science, but Didn’t End It molecular biology How AI Revolutionized Protein Science, but Didn’t End It By Yasemin Saplakoglu June 26, 2024 Comment Save Article Read Later Three years ago, Google’s AlphaFold pulled off the biggest artificial intelligence breakthrough in science to date, accelerating molecular research and kindling deep questions about why we do science. Electric ‘Ripples’ in the Resting Brain Tag Memories for Storage neuroscience Electric ‘Ripples’ in the Resting Brain Tag Memories for Storage By Yasemin Saplakoglu May 21, 2024 Comment Save Article Read Later New experiments reveal how the brain chooses which memories to save and add credence to advice about the importance of rest. New AI Tools Predict How Life’s Building Blocks Assemble molecular biology New AI Tools Predict How Life’s Building Blocks Assemble By Yasemin Saplakoglu May 8, 2024 Comment Save Article Read Later Google DeepMind’s AlphaFold3 and other deep learning algorithms can now predict the shapes of interacting complexes of protein, DNA, RNA and other molecules, better capturing cells’ biological landscapes. Previous 1 2 3 4 ... 5 Next About the author Yasemin is a staff writer covering biology for Quanta Magazine. Previously, she reported for three years on a wide range of fields for Live Science, with extensive coverage of neuroscience, health and COVID-19. She has also written for Scientific American and the San Jose Mercury News. She holds an undergraduate degree in biomedical engineering from the University of Connecticut and a master’s degree in science communication from the University of California, Santa Cruz. Follow Quanta Facebook Facebook X Youtube YouTube Instagram Instagram RSS RSS Bluesky Newsletter Newsletter All Time Most Read from Yasemin Saplakoglu What Causes Alzheimer’s? Scientists Are Rethinking the Answer. By Yasemin Saplakoglu What Happens in a Mind That Can’t ‘See’ Mental Images By Yasemin Saplakoglu Is It Real or Imagined? How Your Brain Tells the Difference. By Yasemin Saplakoglu How AI Revolutionized Protein Science, but Didn’t End It By Yasemin Saplakoglu The Quanta Newsletter Get highlights of the most important news delivered to your email inbox Email Subscribe Recent newsletters"
