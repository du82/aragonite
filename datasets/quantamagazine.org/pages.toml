ve Article Read Later Microbiologists are searching for a universal theory of how bacteria form communities based not on their species but on the roles they play. ‘Species Repulsion’ Enables High Biodiversity in Tropical Trees biodiversity ‘Species Repulsion’ Enables High Biodiversity in Tropical Trees By Veronique Greenwood September 13, 2023 Comment Save Article Read Later Because tree seedlings don’t grow as well when close to their parents, more tree species can be packed into tropical forests. In a Fierce Desert, Microbe ‘Crusts’ Show How Life Tamed the Land microbiology In a Fierce Desert, Microbe ‘Crusts’ Show How Life Tamed the Land By Zack Savitsky July 12, 2023 Comment Save Article Read Later Extreme microorganisms carpeting the Atacama Desert in Chile illuminate how life might have first taken hold on Earth’s surface. The Key to Species Diversity May Be in Their Similarities ecology The Key to Species Diversity May Be in Their Similarities By Veronique Greenwood June 26, 2023 Comment Save Article Read Later New modeling work suggests why nature is more diverse than niche-based ecological theory predicts. Previous 1 2 3 4 ... 6 Next Follow Quanta Facebook Facebook X Youtube YouTube Instagram Instagram RSS RSS Bluesky Newsletter Newsletter Past Week Most Read Articles Undergraduate Upends a 40-Year-Old Data Science Conjecture By Steve Nadis After 20 Years, Math Couple Solves Major Group Theory Problem By Leila Sloman Chatbot Software Begins to Face Fundamental Limitations By Anil Ananthaswamy New Proofs Probe the Limits of Mathematical Truth By Joseph Howlett The Quanta Newsletter Get highlights of the most important news delivered to your email inbox Email Subscribe Recent newsletters"
