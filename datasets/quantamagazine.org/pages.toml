full_description = "Quanta Magazine | Science and Math News Philipp Ammon for Quanta Magazine Latest Articles Q&A The Physicist Working to Build Science-Literate AI By John Pavlus ― Comment By training machine learning models with enough examples of basic science, Miles Cranmer hopes to push the pace of scientific discovery forward. Read article Comment Save Article Read Later ― By John Pavlus Get Quanta's Newsletter Email Subscribe The ‘Elegant’ Math Model That Could Help Rescue Coral Reefs mathematical biology The ‘Elegant’ Math Model That Could Help Rescue Coral Reefs By Max G. Levy Comment Save Article Read Later Physicists and marine biologists built a quantitative framework that predicts how coral polyps collectively construct a variety of coral shapes. New Maps of the Bizarre, Chaotic Space-Time Inside Black Holes quantum gravity New Maps of the Bizarre, Chaotic Space-Time Inside Black Holes By Lyndie Chiou Comment Save Article Read Later Physicists hope that understanding the churning region near singularities might help them reconcile gravity and quantum mechanics. How ‘Event Scripts’ Structure Our Personal Memories neuroscience How ‘Event Scripts’ Structure Our Personal Memories By Ingrid Wickelgren Comment Save Article Read Later By screening films in a brain scanner, neuroscientists discovered a rich library of neural scripts — from a trip through an airport to a marriage proposal — that form scaffolds for memories of our experiences. After 20 Years, Math Couple Solves Major Group Theory Problem group theory After 20 Years, Math Couple Solves Major Group Theory Problem By Leila Sloman Comment Save Article Read Later Britta Späth has dedicated her career to proving a single, central conjecture. She’s finally succeeded, alongside her partner, Marc Cabanes. Follow Quanta Facebook Facebook X Youtube YouTube Instagram Instagram RSS RSS Bluesky Newsletter Newsletter Quanta Podcast More episodes ecology The Hidden World of Electrostatic Ecology By Max G. Levy Comment Save Article Read Later Invisibly to us, insects and other tiny creatures use static electricity to travel, avoid predators, collect pollen and more. New experiments explore how evolution may have influenced this phenomenon. Your browser does not support the audio element. 00:00 / 24:08 APPLE SPOTIFY More episodes Catalytic Computing Taps the Full Power of a Full Hard Drive By Ben Brubaker Comment Save Article Read Later The Largest Sofa You Can Move Around a Corner geometry The Largest Sofa You Can Move Around a Corner By Richard Green Comment Save Article Read Later A new proof reveals the answer to the decades-old “moving sofa” problem. It highlights how even the simplest optimization problems can have counterintuitive answers. How Hans Bethe Stumbled Upon Perfect Quantum Theories quantum physics How Hans Bethe Stumbled Upon Perfect Quantum Theories By Matt von Hippel Comment Save Article Read Later Quantum calculations amount to sophisticated estimates. But in 1931, Hans Bethe intuited precisely how a chain of particles would behave — an insight that had far-reaching consequences. Undergraduate Upends a 40-Year-Old Data Science Conjecture algorithms Undergraduate Upends a 40-Year-Old Data Science Conjecture By Steve Nadis Comment Save Article Read Later A young computer scientist and two colleagues show that searches within data structures called hash tables can be much faster than previously deemed possible. Past Week Most Read Articles After 20 Years, Math Couple Solves Major Group Theory Problem By Leila Sloman New Maps of the Bizarre, Chaotic Space-Time Inside Black Holes By Lyndie Chiou How ‘Event Scripts’ Structure Our Personal Memories By Ingrid Wickelgren Catalytic Computing Taps the Full Power of a Full Hard Drive By Ben Brubaker Featured Videos See all videos By clicking to watch this video, you agree to our privacy policy. Why Some People Don’t ‘See’ Mental Imagery: Aphantasia Christopher W. Young/Quanta Magazine Why Some People Don’t ‘See’ Mental Imagery: Aphantasia 08:29 How AI Cracked the Protein Folding Code and Won a Nobel Prize 22:19 Space-Time: The Biggest Problem in Physics 19:41 Searching for Dark Matter with a Tabletop ‘Quantum Compass’ 06:43 Special Features Multimedia More multimedia The Thought Experiments That Fray the Fabric of Space-Time fundamental physics The Thought Experiments That Fray the Fabric of Space-Time By Charlie Wood +1 authors Mark Belan Comment Save Article Read Later These three imagined scenarios lead many physicists to doubt that space-time is fundamental. More multimedia Recommended Features All articles What Is Machine Learning? By John Pavlus How AI Revolutionized Protein Science, but Didn’t End It By Yasemin Saplakoglu Powerful ‘Machine Scientists’ Distill the Laws of Physics From Raw Data By Charlie Wood All articles The Joy of Why More episodes How Will We Know We’re Not Alone? Your browser does not support the audio element. 00:00 / 37:48 APPLE SPOTIFY The first planet beyond our solar system was identified just 30 years ago. Since then, thousands have been found and characterized. As we look for more, exoplanet experts are also probing for signs of alien biospheres hundreds of light-years away. In this episode, co-host Janna Levin speaks with astrophysicist and astrobiologist Lisa Kaltenegger about how we’ll know we’re not alone in the cosmos. More episodes About Quanta Magazine Illuminating basic science and math research through public service journalism. More about us Quanta Magazine is committed to in-depth, accurate journalism that serves the public interest. Each article braids the complexities of science with the malleable art of storytelling and is meticulously reported, edited and fact-checked. Launched and funded by the Simons Foundation, Quanta is editorially independent — our articles do not reflect or represent the views of the foundation. More about us The Quanta Newsletter Get highlights of the most important news delivered to your email inbox Email Subscribe Recent newsletters"
