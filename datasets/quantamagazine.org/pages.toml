full_description = "What's up in Quantum gravity Latest Articles New Maps of the Bizarre, Chaotic Space-Time Inside Black Holes quantum gravity New Maps of the Bizarre, Chaotic Space-Time Inside Black Holes By Lyndie Chiou February 24, 2025 Comment Save Article Read Later Physicists hope that understanding the churning region near singularities might help them reconcile gravity and quantum mechanics. In the Quantum World, Even Points of View Are Uncertain quantum physics In the Quantum World, Even Points of View Are Uncertain By Anil Ananthaswamy November 22, 2024 Comment Save Article Read Later The reference frames from which observers view quantum events can themselves have multiple possible locations at once — an insight with potentially major ramifications. It Might Be Possible to Detect Gravitons After All quantum gravity It Might Be Possible to Detect Gravitons After All By Charlie Wood October 30, 2024 Comment Save Article Read Later A new experimental proposal suggests detecting a particle of gravity is far easier than anyone imagined. Now physicists are debating what it would really prove. Can Space-Time Be Saved? Q&A Can Space-Time Be Saved? By Charlie Wood September 25, 2024 Comment Save Article Read Later Curious connections between physics and math suggest to Latham Boyle that space-time may survive the jump to the next theory of reality. If the Universe Is a Hologram, This Long-Forgotten Math Could Decode It fundamental physics If the Universe Is a Hologram, This Long-Forgotten Math Could Decode It By Charlie Wood September 25, 2024 Comment Save Article Read Later A 1930s-era breakthrough is helping physicists understand how quantum threads could weave together into a holographic space-time fabric. The #1 Clue to Quantum Gravity Sits on the Surfaces of Black Holes explainers The #1 Clue to Quantum Gravity Sits on the Surfaces of Black Holes By Joseph Howlett September 25, 2024 Comment Save Article Read Later A black hole formula worked out in the 1970s remains the most concrete clue physicists have about the threads of the space-time fabric. The Two Faces of Space-Time explainers The Two Faces of Space-Time By Charlie Wood September 25, 2024 Comment Save Article Read Later A mysterious phenomenon known as duality often leads to new discoveries in physics. This time, space-time itself can sometimes be two things at once. The Logic That Must Lie Behind a New Physics Q&A The Logic That Must Lie Behind a New Physics By Amanda Gefter September 25, 2024 Comment Save Article Read Later The philosopher Karen Crowther digs into how the space-time fabric could possibly emerge from something non-spatiotemporal. The Thought Experiments That Fray the Fabric of Space-Time fundamental physics The Thought Experiments That Fray the Fabric of Space-Time By Charlie Wood +1 authors Mark Belan September 25, 2024 Comment Save Article Read Later These three imagined scenarios lead many physicists to doubt that space-time is fundamental. Previous 1 2 3 4 ... 10 Next Follow Quanta Facebook Facebook X Youtube YouTube Instagram Instagram RSS RSS Bluesky Newsletter Newsletter Past Week Most Read Articles Undergraduate Upends a 40-Year-Old Data Science Conjecture By Steve Nadis After 20 Years, Math Couple Solves Major Group Theory Problem By Leila Sloman Chatbot Software Begins to Face Fundamental Limitations By Anil Ananthaswamy New Proofs Probe the Limits of Mathematical Truth By Joseph Howlett The Quanta Newsletter Get highlights of the most important news delivered to your email inbox Email Subscribe Recent newsletters"
