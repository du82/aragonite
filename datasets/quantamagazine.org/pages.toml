full_description = "What's up in Mathematical biology Latest Articles The ‘Elegant’ Math Model That Could Help Rescue Coral Reefs mathematical biology The ‘Elegant’ Math Model That Could Help Rescue Coral Reefs By Max G. Levy February 26, 2025 Comment Save Article Read Later Physicists and marine biologists built a quantitative framework that predicts how coral polyps collectively construct a variety of coral shapes. How Is Science Even Possible? The Joy of Why How Is Science Even Possible? By Steven Strogatz June 20, 2024 Comment Save Article Read Later How are scientists able to crack fundamental questions about nature and life? How does math make the complex cosmos understandable? In this episode, the physicist Nigel Goldenfeld and co-host Steven Strogatz explore the deep foundations of the scientific process. Can We Program Our Cells? The Joy of Why Can We Program Our Cells? By Steven Strogatz March 8, 2023 Comment Save Article Read Later By genetically instructing cells to perform tasks that they wouldn’t in nature, synthetic biologists can learn deep secrets about how life works. Steven Strogatz discusses the potential of this young field with researcher Michael Elowitz. How Do Fireflies Flash in Sync? Studies Suggest a New Answer. mathematical biology How Do Fireflies Flash in Sync? Studies Suggest a New Answer. By Joshua Sokol September 20, 2022 Comment Save Article Read Later Field research suggests a new explanation for the synchronized flashing in fireflies and confirms that a novel form of “chimeric” synchrony occurs naturally. Hidden Chaos Found to Lurk in Ecosystems mathematical biology Hidden Chaos Found to Lurk in Ecosystems By Joanna Thompson July 27, 2022 Comment Save Article Read Later New research finds that chaos plays a bigger role in population dynamics than decades of ecological data seemed to suggest. At the Dawn of Life, Heat May Have Driven Cell Division origins of life At the Dawn of Life, Heat May Have Driven Cell Division By Carrie Arnold November 23, 2021 Comment Save Article Read Later A mathematical model shows how a thermodynamic mechanism could have made protocells split in two. Turing Patterns Turn Up in a Tiny Crystal patterns Turing Patterns Turn Up in a Tiny Crystal By Elena Renken August 10, 2021 Comment Save Article Read Later The mechanism behind leopard spots and zebra stripes also appears to explain the patterned growth of a bismuth crystal, extending Alan Turing’s 1952 idea to the atomic scale. Emery Brown and the Truth About Anesthesia The Joy of x Emery Brown and the Truth About Anesthesia By Steven Strogatz April 26, 2021 Comment Save Article Read Later Anesthesia is very different from sleep — which is why it offers unique opportunities for studying the human brain, says the physician-researcher and statistician Emery Brown. Trachette Jackson Fights Cancer With Math The Joy of x Trachette Jackson Fights Cancer With Math By Steven Strogatz April 12, 2021 Comment Save Article Read Later Quantitative models built by the mathematical biologist Trachette Jackson can make cancer therapies safer and more effective. Previous 1 2 3 Next Follow Quanta Facebook Facebook X Youtube YouTube Instagram Instagram RSS RSS Bluesky Newsletter Newsletter Past Week Most Read Articles Undergraduate Upends a 40-Year-Old Data Science Conjecture By Steve Nadis After 20 Years, Math Couple Solves Major Group Theory Problem By Leila Sloman Chatbot Software Begins to Face Fundamental Limitations By Anil Ananthaswamy New Proofs Probe the Limits of Mathematical Truth By Joseph Howlett The Quanta Newsletter Get highlights of the most important news delivered to your email inbox Email Subscribe Recent newsletters"
