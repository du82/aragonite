full_description = "Privacy Policy Updated: February 1, 2023 This “Privacy Policy” describes the privacy practices of The Simons Foundation, Inc., a 501(c)(3) non-profit organization, and its subsidiaries and affiliates (collectively, “Simons Foundation,” “we,” “us” or “our”), only in connection with our online publications. This Privacy Policy describes how we collect, use, maintain, protect, disclose and otherwise process personal information, and explains the rights and choices available to individuals with respect to their information. This Privacy Policy applies to our website, https://www.quantamagazine.org/, and any other websites that we own or control that contain a link to this Privacy Policy. This Privacy Policy also applies to information collected via email, text and other electronic messages between you and any of our websites. This Privacy Policy does not apply to services that have separate privacy policies that do not incorporate this Privacy Policy. This Privacy Policy does not apply to information collected by any third party, including through any application or content that may link or be accessible from us through our websites. Simons Foundation may provide additional or supplemental privacy notices to individuals at the time their data is collected. Such additional or supplemental privacy notice will govern how we may process the information you provide at that time. Please read this Privacy Policy carefully to understand our policies and practices regarding your information and how we will treat it. If you do not agree with our policies and practices, your choice is not to use our websites. By accessing or using our websites, you agree to this Privacy Policy. This Privacy Policy may change from time to time. Your continued use of this website after we make changes is deemed to be acceptance of those changes, so please check the policy periodically for updates. For information about the Simons Foundation’s privacy practices in other contexts, or for individuals located in the European Union, please see our Institutional Privacy Policy here. Table of Contents Personal Information We Collect How We Use Your Personal Information How We Share Your Personal Information Your Choices Security International Transfer Other Sites and Services Changes to This Privacy Policy Contact Us Personal Information We Collect Information you give us We collect personal information about individuals who interact with the Simons Foundation, including by using our website and subscribing to our publications. We collect some of this information automatically when individuals navigate through the site, such as IP addresses and information collected through cookies and other tracking technologies. The types of personal information we collect include, but are not limited to: Personal and business contact information, such as your name, email address, and social media handles; Feedback and correspondence, such as information you provide when interacting with us by email, phone calls or through other methods of communication, such as posting public comments; Usage information, such as information about how you use our websites and interact with us, including information associated with any content you upload to the websites or otherwise submit to us, and information you provide when you use any interactive features of the websites; Subscription information, such your preferences for receiving communications about our activities, events, and publications, and details about how you engage with our communications Information automatically collected When you access our websites, we, our service providers and our partners may automatically log information about you, your computer or mobile device, and your activity on our websites. The information that may be collected automatically includes your device’s operating system type and version number, manufacturer and model, device identifier, browser type, screen resolution, IP address, the website you visited before browsing to our websites, general location information such as city, state or geographic area, and information about your use of and actions on our websites, such as pages you viewed, how long you spent on a page, navigation paths between pages, information about your activity on a page, access times and length of access. This information is collected using cookies, pixel tags and similar technologies. Pixel tags (which are also known as web beacons and clear GIFs) are used on our websites and HTML-formatted emails to track the actions of users on our websites. Unlike cookies, which are stored on the hard drive of your computer or mobile device by a website, pixel tags are embedded invisibly on webpages or within HTML-formatted emails. Pixel tags measure the success of our marketing campaigns and compile statistics about usage of our websites or engagement with email notices so that we can manage our content more effectively. Please refer to our Cookies Policy for more details about our use of cookies. How We Use Your Personal Information To provide our services We use your personal information to provide our services in the following ways: to operate, maintain, administer and improve our websites; to publish our newsletters, magazines and other communications; to manage and communicate with you regarding your Simons Foundation account, if you have one, including by sending you service announcements, technical notices, updates, security alerts and support and administrative messages; to better understand your needs and interests and to personalize your experience with the websites; to provide support and maintenance for the websites; to respond to your requests, questions and feedback; to fulfill any other purpose for which you provide it. To communicate with you If you request information from us (such as by signing up for our newsletter or publications), register on our websites or request resources from us in order to support our mission, we may send you Simons Foundation–related marketing communications as permitted by law. You will have the ability to opt out of such communications. To comply with law We use your personal information as we believe necessary or appropriate to comply with any applicable court order, law, regulation and legal processes, including to respond to any government or regulatory request. With your consent We will request your consent to use your personal information where required by law, such as where we use certain cookies or similar technologies or before sending you certain marketing messages. You have the right to withdraw your consent at any time in the manner that was indicated when we requested the consent or by contacting us at [email protected]. If you have consented to receive marketing communications from our third-party partners, you may withdraw your consent by contacting those partners directly. To create anonymous data for analytics We may create anonymous data from your personal information and other individuals whose personal information we collect. We make personal information into anonymous data by excluding information that makes the data personally identifiable to you, and use that anonymous data for business purposes. For compliance, fraud prevention and safety We use your personal information as we believe necessary or appropriate to (a) enforce the terms and conditions that govern the service; (b) protect our rights, privacy, safety or property, and/or that of you or others; and (c) protect, investigate and deter against fraudulent, harmful, unauthorized, unethical or illegal activity. As stated in a supplemental privacy notice In some circumstances, we may provide a supplemental privacy notice that explains how we use personal information in a specific context. How We Share Your Personal Information Affiliates We may disclose your personal information to our subsidiaries and affiliates for purposes consistent with this Privacy Policy. Contractors and Service Providers We may employ third-party companies and individuals to administer and provide our services on our behalf (such as customer support, hosting, email delivery, database management services and job applicant management systems, as well as external reviewers and advisers who help us process and make determinations regarding grant applications). These third parties may use your information only as directed by Simons Foundation and in a manner consistent with this Privacy Policy. Contractors and Service Providers are prohibited from using or disclosing your information for any other purpose. Partners We may sometimes share your personal information with partners or enable partners to collect information via our websites. For example, some of our websites use Disqus, a third-party service that enables our visitors to post comments on our website. You may view the Disqus Privacy Policy here and control Disqus targeting and personalization here. Professional advisers and corporate transactions We may disclose your personal information to professional advisers, such as lawyers, bankers, auditors, accountants and insurers, where necessary in the course of the professional services rendered to us, including to the extent reasonably needed to proceed with the negotiation or completion of a corporate transaction, such as a merger, reorganization, acquisition, or transfer or sale of all or a portion of our assets, in which case your personal information may be part of that corporate transaction. Compliance with laws and law enforcement; protection and safety We may disclose information about you to government or law enforcement officials or private parties as required by law, and disclose and use such information as we believe necessary or appropriate to (a) comply with any applicable court order, laws, regulation and lawful requests and legal processes, such as to respond to subpoenas; (b) enforce the terms and conditions that govern our websites; (c) protect our rights, privacy, safety or property, and/or that of you or others; and (d) protect, investigate and deter against fraudulent, harmful, unauthorized, unethical or illegal activity. Your Choices Access, update, correct or delete your information An individual who has registered for an account with us may review, update, correct or delete the personal information in their account profile by contacting us at [email protected]. Marketing communications You may opt out of marketing-related emails by following the instructions contained at the bottom of our emails, or by contacting us at [email protected]. You may continue to receive service-related and other nonmarketing emails. Online behavioral advertising Some of the partners that collect information about users’ activities on our websites may be members of organizations or programs that provide choices to individuals regarding targeted advertising. Users may opt out of receiving targeted advertising on websites through members of the Network Advertising Initiative by clicking here or the Digital Advertising Alliance by clicking here. European users may opt out of receiving targeted advertising on websites through members of the European Interactive Digital Advertising Alliance by clicking here, selecting the user’s country and then clicking “Choices” (or similarly titled link). If you choose to opt out of targeted advertisements, you will still see advertisements online, but they may not be relevant to you. Even if you do choose to opt out, not all companies that serve online behavioral advertising are included in this list, so you may still receive cookies and tailored advertisements from companies that are not listed. “Do Not Track” signals Some Internet browsers may be configured to send “Do Not Track” signals to the online services that you visit. We currently do not honor “Do Not Track” signals. To find out more about “Do Not Track,” please visit http://www.allaboutdnt.com. Choosing not to share your personal information You may choose not to provide personal information to us. However, we may not be able to provide services to you if we are required to collect your personal information or if we need your personal information in order to provide the services. We will tell you what information you must provide to receive our services by designating it as required or through other appropriate means. Security We take a number of organizational, technical and physical measures designed to protect the personal information we collect, both during transmission and once we receive it. However, no security safeguards are 100% secure, and we cannot guarantee the security of your information. Any transmission of personal information is at your own risk. We are not responsible for circumvention of any privacy settings or security measures contained on the Website. The safety and security of your information also depends on you. Where we have given you (or where you have chosen) a password for access to certain parts of our websites, you are responsible for keeping this password confidential. We ask you not to share your password with anyone. Children Our websites are not intended for children under 16. If you become aware that a child has provided us with information without parental or guardian consent, please contact us at [email protected]. We will delete such information from our files as soon as reasonably practicable. International Transfer Simons Foundation is headquartered in the United States and may have service providers in other countries. Your personal information may be transferred to the United States or other locations outside of your state, province, country or other governmental jurisdiction where privacy laws may not be as protective as those in your jurisdiction. European Union users should read the important information provided in our Institutional Privacy Policy about transfer of personal information outside of the European Economic Area (EEA). Other Sites and Services Our websites may contain links to other websites and services. These links are not an endorsement, authorization or representation that we are affiliated with that third party. We do not exercise control over third-party websites or services and are not responsible for their actions. Other websites and services may follow different rules regarding the use or disclosure of the personal information you submit to them. We encourage you to read the privacy policies of the other websites you visit and services you use. Changes to This Privacy Policy We reserve the right to modify this Privacy Policy at any time. We encourage you to periodically review this page for the latest information on our privacy practices. If we make material changes to this Privacy Policy, we will notify you by updating the date of this Privacy Policy and posting it on our websites. We may (and, where required by law, will) also provide notification of changes in another way that we believe is reasonably likely to reach you"
