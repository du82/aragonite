full_description = "Media over QUIC is a live media protocol powered by QUIC: a super-charged TCP/UDP replacement designed for HTTP/3. It’s being developed by the IETF and individuals from your favorite big tech companies. Try it out! Watch or Publish a broadcast This website is a proof-of-concept using a minimal fork of the protocol. Some features include: Web support via WebTransport and WebCodecs CDN support via MoqTransport. Rust libraries with native and web support. ffmpeg and gstreamer integration. Fully open source demo and library The core functionality is now fully written in Rust, including web support! Check out the issues and in touch if you’re interested in contributing, sponsoring, or just want more information! Visit Github or join Discord The protocol is being developed by the IETF MoQ working group. The IETF is an open organization that develops Internet standards, including some of your favorite protocols like HTTP, TLS, and DNS. We are designing a protocol that is simple and yet flexible enough to support the wide range of use-cases: from ultra-low latency to ultra-high quality, 1 viewer to 1 million viewers, contribution and distribution, and everything in between. See the motivation for more information. Note: This is not an official IETF website, nor does the MoQ working group endorse this website. The standard is being produced by many individuals from companies such as Google, Meta, Cisco, Akamai, etc."
