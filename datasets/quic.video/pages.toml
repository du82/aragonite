full_description = "Blog Posts The MoQ Onion Media over Transfork over WebTransport over QUIC over UDP over IP over Ethernet over Fiber over Light over Space over Time by kixelated To WASM, or not to WASM Have our benevolent W3C overlords allowed us to use Rust in the browser yet? by kixelated Fork Time to take another stab at it. by kixelated Forward? Error? Correction? Concealing packet loss is harder than you think. by kixelated Never* use Datagrams Rethink your approach. *Unless you're doing something dope. by kixelated QUIC's (hidden) Super Powers Most of QUIC's killer features aren't obvious or documented. Time to change that. by kixelated Replacing HLS/DASH Low-latency, high bitrate, mass fan-out is hard. Who knew? by kixelated Replacing WebRTC The long path to use something else for real-time media. by kixelated Distribution @ Twitch Eight years of progress at Twitch with various distribution protocols. by kixelated The MoQ Onion Media over Transfork over WebTransport over QUIC over UDP over IP over Ethernet over Fiber over Light over Space over Time by kixelated To WASM, or not to WASM Have our benevolent W3C overlords allowed us to use Rust in the browser yet? by kixelated QUIC's (hidden) Super Powers Most of QUIC's killer features aren't obvious or documented. Time to change that. by kixelated Distribution @ Twitch Eight years of progress at Twitch with various distribution protocols. by kixelated"
