full_description = "Rust! Native code is written in Rust and is available at kixelated/moq-rs. It’s split into a few crates: cratedescriptionmoq-transportA library that mostly implements the MoqTransport draft… with a few strong opinions.moq-relayA MoQ server that connects publishers to subscribers, caching any duplicate subscriptions.moq-karpA MoQ client that integrates with ffmpeg to publish media in a new container.moq-webA MoQ client utilizing WebAssembly, WebCodecs, and WebTransport for web support.moq-gstA MoQ gstreamer plugin that can publish media via moq-karp.moq-clockIt’s a clock! Just to demonstate that MoqTransport can do more than media.quic.videoThis website lul. Check out the open issues for a rough road map and potential contributions! There are some additional repositories that might be of interest: | crate | description | | web-transport-quinn | A WebTransport client and server utilizing Quinn. | | web-transport-wasm | A WASM WebTransport wrapper around the web-sys bindings. | | web-transport | A common interface, utilizing one of the above depending on the platform. | | web-codecs | A WebCodecs WASM wrapper providing a more ergonomic API. | License Everything is licensed under MIT or Apache-2.0 so knock yourself out. If you do end up using MoQ for your project, let the world know! The more public traction we can get, the better we can make the standard."
