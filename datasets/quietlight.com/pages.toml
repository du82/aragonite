["https://quietlight.com/advisors/brad-wayland"]
title = "Brad Wayland Quiet Light"
description = "Brad Wayland is an entrepreneur who began working in the online space in 2003. He has a wide range of experience operating and marketing online businesses."
full_description = "Brad Wayland is an entrepreneur who began working in the online space in 2003. He spent over a decade in the custom printing industry where he bootstrapped a business to millions in sales and over 100 employees. While honing his SEO skills in the print industry he spent much of his time learning other aspects of the web from traditional ecommerce, to affiliate marketing, to content. Eventually his love for content businesses led him to being a serial acquirer and he ended up on the buy side 26 times. A majority of his acquisitions were part of a rollup strategy he was pursuing. In 2015 he sold his content portfolio to private equity. Brad has experienced 4 successful exits from businesses he owned and operated. Brad joined the Quiet Light team in 2017 and has represented more than 80 successful transactions. When a sale becomes a statement of “this is the exact number I need” but does not consider the time it will take to talk with potential buyers, negotiate terms, get through due diligence etc it can end up making the process more painful than it has to be. By considering the whole transaction the entire process can be smooth and easy for all. Price is important but so is the peace of mind of selling quickly and efficiently. I started as an accountant but quickly realized it was not the direction for me. I had a financial planning degree and had a nice offer to start doing financial planning full time. A couple of friends of mine had mentioned to me they might want to consider bringing me on at their custom t-shirt company. I liked the idea of working with people on a team so I took them up on their offer and worked doing sales and business development for about 6 months. Meanwhile they had launched a website and it started to get some orders. I started entering orders from the site in the mornings and became very interested in how people were finding the site. 2 months later I was at my first SEO convention and was hooked. I spent years fumbling around the SEO until 2007 when I finally helped create something that could rank and rank well. We received links from Gizmodo and Adobe within 60 days of launching our new “create your own” and grew our sales into a multimillion dollar business."
