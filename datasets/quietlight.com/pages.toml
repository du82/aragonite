["https://quietlight.com/advisors/pat-yates"]
title = "Pat Yates Quiet Light"
description = "Pat is a seasoned entrepreneur with a focus on e-commerce.  In 2014 he struck a deal with Robert Herjavec on the Emmy Award-winning show “Shark Tank”.  Pat grew a single slipper kiosk business into a multi-million dollar e-commerce focused business.  During that time Pat has done licensing deals with DreamWorks, NCAA, NFL and Disney.  In […]"
full_description = "Pat is a seasoned entrepreneur with a focus on e-commerce. In 2014 he struck a deal with Robert Herjavec on the Emmy Award-winning show “Shark Tank”. Pat grew a single slipper kiosk business into a multi-million dollar e-commerce focused business. During that time Pat has done licensing deals with DreamWorks, NCAA, NFL and Disney. In 2015 he struck up a relationship with Mark the founder of Quiet Light and continued eventually leading him to becoming an advisor. My background was mall retail until the early 2000s, but I loved the challenge of reaching all types of customers all around the world. Yes, from day 1. I started my first business just a few months after graduating from college and getting married to my wife of over 30 years. I love hearing them remember how it started, what was great, what hurt. In the end, it takes you through their ride in a way. Amazing stuff. “Pat, remember this, you are going from a meal ticket to a soup line” – Joe Peden when I left my job to start my first business. I would like start by saying that while the whole process was bumpy at times at no point did I feel pressured to make any decisions. This was huge for me because it was a major event of my life not only financially, but also personally. Pat made the entire process painless. He was understanding and accommodating, participated in a countless number of calls, even if it was not directly related to his function as a broker. He was just a great partner throughout the whole process and I am extremely happy that I decided to go with him as my broker. Really appreciate all your help, Pat. Truly a 5 star professional. Highly recommended! “I wanted to personally thank you for your services in selling this business for my brother. You were the only brokerage firm that was willing to take a chance on us. Without you I would have a small nest egg to get through healing from my medical condition. My heart’s desire and burden was to make sure that the business we worked so hard to create would continue & we would be rewarded financially for all the blood, sweat & tears put into it. Thank you again.”"
