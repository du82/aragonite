["https://quietlight.com/3-types-of-addbacks"]
title = "Types of Add Backs When Selling an Online Business"
description = "Add backs improve a company's apparent profits. If you're selling your ecommerce business, read on the types of add backs and how to maximize them."
full_description = "How much is your business worth? That’s a million-dollar question for some entrepreneurs. Whether you plan to sell eventually or not, you have to know the value of your business as an asset. To know your worth, you have to understand the dance between your SDE and multiple. You can add value to your business by identifying a clear addback schedule in your profit and loss (P&L) statement. Learn how to calculate your SDE and multiple, and how the 3 levels of addbacks affect your value. In all likelihood, your business is your most valuable asset. But no matter how successful your eCommerce business is, 50% of all the money you’ll ever earn from this business will come when you sell it. For most of you reading this, that means that, at most, you’ve only realized half of your business value. But a business doesn’t have value “just because:” you have to prepare to sell your business from the start. Not only does this put more revenue in your pocket, but it’s also about doing the right thing and creating a great opportunity for your future buyer. However, some eCommerce businesses lack a pool of enthusiastic buyers. Even though you’re doing great things and driving revenue, a buyer might not want to purchase your business. But to see where your eCommerce business is today, and assess how much it could be worth to a buyer, you need to know your fair market value. “When you’ve got the right data, the SDE and the multiple equal the list price,” says Quiet Light’s Joe Valley. That means correctly calculating your Seller’s Discretionary Earnings (SDE), which includes your multiple and your addback schedule. Your goal shouldn’t be to jack up the SDE or the value of your business with “creative math.” This is about getting paid a fair, correct price for what you’ve created. Actually, if you’re taking a do-it-yourself approach to your eCommerce business sale, or go with an inexperienced broker, you could lose out on tens of even hundreds of thousands of dollars when you sell."
year_published = 2020
