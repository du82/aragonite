["https://quietlight.com/amazon-businesses-sale"]
title = "Top Reasons For Selling an Amazon FBA Business"
description = "Learn everything you need to know about selling your Amazon FBA business. Click here to get started."
full_description = "Joe Valley says: 9 years ago at 4:40 pm Great article Mark. I’ve worked with many buyers and sellers with the process and agree…Amazon is a component of most ecommerce business sale/transactions today. While it is not online yet for easy access – anyone wishing to review our new ebook “10 Steps to Selling an Amazon Business”, they can send me an email at [email protected] and I’ll send it right away. It covers the process from planning, valuation and all the way through to transition and training. It’s a good read for sellers and buyers alike. Tom Wise says: 9 years ago at 4:42 pm Thank you for another interesting post. As I see it verifiable and established trading records, plus an increasing cost of entry, make amazon businesses increasingly interesting. You mention ‘impending doom’ and give the example of e-cigarettes and the FDA. I have looked at some profitable smaller vendors whose limited products, I feel, could be picked off by bigger players or manufacturers. If you have time could you add other, specific or general, examples of ‘impending doom’? Joe Valley says: 9 years ago at 12:22 pm Tom, When specifically looking at the Amazon Marketplace and “impending doom”, I see the risk is more specific to competition creeping up if you don’t go beyond Amazon. I think Amazon is a GREAT place to start. But if you get big enough you’ll get noticed and then competition will rise up and eat into your revenues and profits. I’ve seen this first hand. A recent client of mine launched a brand about three years ago. And for the first two years Amazon revenue rose daily like a rocket taking off. As Amazon entrepreneurs took notice one jumped in the game. They knocked off the product, gave away a lot of products at substantial discounts for reviews and rose in the rankings. This hurt my clients Amazon sales…a lot. But…this client is very bright and not the least bit lazy or complacent. He made a specific effort to expand well beyond Amazon. Built a great looking website and grew a substantial B2B business with many recurring clients. Some orders were huge in comparison to the one offs sold on Amazon. Overall revenues were flat, but the risk associated with all revenues coming from one place was minimized. So while the competitors rise up on Amazon, it is and should be considered a launching pad to many other sources of revenues such as: Jet.com B2B Sales Walmart Marketplace Daily Deal Sites eBay Your Own URL Email campaigns Affiliate Marketing Brick and mortar retail And so many more areas. Rarely do I see an Amazon seller doing great on another 3rd party reseller site. Rarely do I see an eBay seller doing well on Amazon. Normally this has nothing to do with product or audience, and more to do with choice and effort. Many…many entrepreneurs are “lifestyle” entrepreneurs. I am one of them. I’d rather make less money and have fewer headaches and work hours, then make 2-3x as much working longer hours and seeing my family less. When buying a business all of the above should be considered. What type of lifestyle do you want to live? Are you comfortable out-sourcing to contractors? At what point does the work become work and no longer a goal oriented project? Buying a business is not just buying a job. Rarely does a buyer want to keep revenues flat. Small goal oriented and risk averse growth can still pay huge dividends while keeping the “lifestyle” in check. And when it comes time to sell the same business in 3-5 years with revenues from multiple sources…the more valuable the business will be to a broader base of buyers."
