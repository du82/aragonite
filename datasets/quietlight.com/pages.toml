["https://quietlight.com/sellers-discretionary-income"]
title = "What is Seller's Discretionary Income And Why is it Important?"
description = "Seller's Discretionary Income (SDE) is a critical metric for accurately valuing businesses. Learn what it represents, how it's calculated, and why it matters."
full_description = "Correctly valuing an internet-based business requires careful analysis of several core components of its performance. By looking critically at the right numbers, savvy buyers can gain a deep understanding of the business’s story, as well as make informed predictions about its future potential. In order to make sense of the numerous spreadsheets and reports that you’ll be presented with during the research process, it’s important to sharpen your business-buying vocabulary. When you’re reviewing marketing materials for available websites, you may notice terms such as “EBITDA,” “SDE”, and “ODI” floating throughout the text. What do these terms mean, and why are they so critical in the valuation process? In this article, we’ll be explaining the vocabulary that accompanies the most important metrics when it comes to valuing internet-based businesses. As its name implies, this value represents profits taken before any interest expense, taxes, depreciation, and amortization are accounted for. In other words, EBITDA is the profit for the business owner before non-cash expenses. Correctly calculating EBITDA is essential to avoid problems with your financial records and to prepare an accurate balance sheet. In some cases, adjusted EBITDA can be applied to the multiple to determine the business valuation on its own. However, usually, it is added to the current owner’s salary and benefits to produce a value for SDE, which is then applied to the multiple. Seller’s Discretionary Earnings (SDE) are the pre-tax and pre-interest profits before non-cash expenses, one owner’s benefits, one time investments, and any non-related income or discretionary expenses are accounted for. In addition, SDE may require that expenses be adjusted if a new owner will necessarily need to take on a new expense after the asset sale. The ultimate goal of identifying the seller’s discretionary earnings is to properly identify what a new owner can reasonably expect their annual earnings and discretionary cash flow to be. Of course, this determines the sale price and market value."
year_published = 2014
year_updated = 2025
