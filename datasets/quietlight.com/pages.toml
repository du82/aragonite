["https://quietlight.com/about"]
title = "Quiet Light Brokerage: The Advisors for Online Business Sales"
description = "In 2006, founder Mark Daoust received a call from a fellow entrepreneur selling his web hosting website. Quiet Light Brokerage was founded with this phone call."
full_description = "Late in 2006, our founder, Mark Daoust, received a call from a good friend and fellow entrepreneur who was considering selling his 8-year-old web hosting website. Just 10 months prior Mark had sold his own profitable website and was looking for a new direction. A lot changed since that first phone call in 2006. Today, entrepreneurs recognize Quiet Light as a leading voice and authority in the emerging niche of selling and buying profitable online businesses. If we are honest, there are way more complexities in buying and selling businesses than we originally thought. But with each transaction we learned lessons, improved our processes, and refined our approach to be more effective. Today we can look back on over 750 online businesses sold and over $500,000,000 in total transaction value. Even though we are recognized as one of the most successful M&A advisors in the marketplace, we still take an attitude of continual improvement to our processes. In 2008, our founder hired a group of highly proven salespeople to work with Quiet Light’s sellers. It didn’t take long for these first business brokers to move on to other lines of work. Some started their own businesses, others found jobs, and others just found less and less time to work with Quiet Light. It wasn’t until 2010 that Mark literally stumbled onto the winning formula: hire entrepreneurs who have bought, sold, and started significant online businesses. The value of Quiet Light is in its advisors. Any person who works with our clients has firsthand experience in buying, selling, and starting their own Internet based business. In fact, many of our current advisors started as clients of Quiet Light! Ethan is a serial entrepreneur and has successfully built numerous multi-million dollar companies. He has sold and acquired a number of companies, one of which appeared on Shark Tank, and served as a broker for both buyers and sellers transactions’. Paul is a serial entrepreneur who has built several multi-million dollar online businesses. His most recent venture became a category leading ecommerce brand which he exited for seven figures in 2019. Quiet Light brokered the sale."
