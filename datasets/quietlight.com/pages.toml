["https://quietlight.com/referrals"]
title = "Referrals | Quiet Light"
description = "Reading Time: < 1 minute"
full_description = "At Quiet Light Brokerage, we help entrepreneurs exit their profitable online businesses with the dedicated assistance of a ridiculously-qualified advisor from start to finish. No junior members here. All of our advisors are seasoned entrepreneurs themselves. In fact, our advisors on average have 15 years of online business experience so you can be sure they’re speaking from a “been there and done that” point of view. To get started, drop us a note via the form at the top of the page and we’ll reach out with a calendar link to schedule a time to chat more about our referral program. We’ll sign a referral agreement stating we’ll pay you 10% of all fees collected on the referral/introduction you made. A simple email introduction will do, and we’ll take it from there. You’ll be bcc’d on the reply email and our CRM system will tag you as the referee. We’ll update you regularly with where we are in the process with your referral. We’re even working on a dashboard that you’ll be able to log into in the near future. When the business you referred to us is sold and we are paid, we’ll wire or ACH you 10% of the fees collected. Our average referral fee is about $7,500. We’ve paid referrals as low as $1,000 and as high as the mid 6-figure range. The more online entrepreneurs you refer to us the more consistent your referral fees will be. Our Expertise is in eCommerce, FBA, Saas, Content, Affiliate businesses, etc. In other words, businesses that are online-oriented and not geographically bound. If the business is producing a significant amount of its revenue through walk-in customers, you should probably seek a local business broker who’ll be able to find you a local buyer. Having said that, businesses that have a physical presence but are remotely run, or can be remotely run, may still be within our wheelhouse. We list businesses in the $250,000 to $25,000,000 value range, which usually means they are generating at least $75,000 in profit per year. Having said that, we are happy to talk with anyone who has a good business, is generating a good profit, and is on track to hit this goal in the near future. We are not just here for the moment they are ready to sell, but to help guide them along the path so that they maximize their exit when the time is right."
