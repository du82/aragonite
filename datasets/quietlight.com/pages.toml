full_description = "Prior to this he spent 4 years in investment banking at Citigroup, focussing in the technology, telecoms, and media sectors, before leaving to work for a boutique advisory firm as Head Of Brokerage & Operations. During this time he also developed a passion for personal development and self-discovery and founded a media and digital-course platform in the space. He joined Quiet Light in 2019 to merge his passions of entrepreneurship and helping other founders. In his 10 years of business brokerage, he has advised on 125+ successful business sales across e-commerce, SaaS and content, and is the author of one of the industry’s leading guides on buying online businesses. Coming to market too late after they have decided to sell. This can mean the business is not well prepared for exit, leaving value on the table instead of planning the sale properly. It can also make sellers impatient and emotionally spent before the process begins, causing them to make poor decisions abouts buyers, offers, and the eventual exit itself. Freedom of movement worldwide (I love to travel) and the scope for global impact and connection. My own business – Inner Truth – touches tens of thousands of people each month and it’s amazing to connect such a diverse audience worldwide. I always knew I wanted to offer something individual and unique to the world but it took me a lot of time to acquire the knowledge I needed and mature the skillset ahead of making the transition. Being a solo entrepreneur is such an inner journey of growth so taking the time to prepare was important for me. Spending time with lots of other entrepreneurs was key! For me I think the greatest benefit of anything is being at service to others. Helping someone sell their online business is a trusted role and a privilege I take with deep responsibility. Honouring that trust with great service and a successful sale is massively rewarding. Jordan Peterson. His understanding of philosophy, theology, mythology,