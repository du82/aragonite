title = "How to Sell Your Amazon FBA Business for Maximum Value"
description = "Ready to sell your Amazon FBA business? Follow these proven steps to prepare, value, market, and negotiate for a maximum value sale."
full_description = "For FBA businesses, history indicates that more than 50% of all the money you’ll ever make comes the day you sell your Amazon business. This is mainly true for young (< 4 years old) businesses having rapid growth because the majority of cash is tied up in inventory. If this is true for you, learning the nuances of selling your Amazon business will help ensure you get the maximum value when eventually exiting. Years ago, when the original version of this article was published, the question of whether or not you could sell an Amazon business was at the heart of the article. Now, with the rise of the aggregators, the question is not “can I”, but “how do I get maximum value and a first-rate contract structure when I sell my Amazon business”? Still, the below email serves as reassurance that Amazon is aware of how common Amazon business ownership transference is (indeed, they have trained customer service representatives relevant to this). The email below is from an Amazon Seller Support Representative. It clearly shares the process of transferring ownership of an Amazon seller account. It also states “By doing this, all customer reviews and ratings will be transferred…” This makes it clear that Amazon is politely acknowledging that owners can sell their Amazon business by transferring control of the Seller Account. Let’s go on to dispel another myth. In the following video, seasoned online business broker Chuck Mullins sits down with Riverbend Consulting Co-Founder Lesley Hansell to discuss the correct process for transferring Amazon accounts. The letter below shows how to “unlink” accounts when you sell your Amazon business. This letter is in reference to a sale in which the seller had two Amazon Business accounts. The accounts sold two completely different types of products, but with all deposits going to the same bank account. We were enlisted to assist in selling both Amazon businesses. In the process of selling these Amazon businesses, it was important to the seller, buyer, and Quiet Light, that the accounts were unlinked and completely separated from each other (with no future recourse from Amazon)."
