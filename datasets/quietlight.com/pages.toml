["https://quietlight.com/advisors/jason-yelowitz"]
title = "Jason Yelowitz Quiet Light"
description = "Jason Yelowitz joined Quiet Light Brokerage and quickly became a most requested advisor. Within a year he set a new bar in virtually every metric for the firm."
full_description = "A recognized speaker and author, Jason joined Quiet Light in the spring of 2010 and quickly became the most requested advisor on our team. Within one year of working with Quiet Light, Jason set a new bar in virtually every metric for our firm. He quickly established himself as an accomplished, top professional within the industry by being savvy, honest, and considerate. A caring collaborator, he consistently cultivates genuine partnerships that result in successful transactions, and has become friends with many of his former clients.Before and during his tenure with Quiet Light, Jason has started seven businesses, raising over $10 million in venture capital funding for the first one, alone. A prominent spokesperson at conferences and business schools, he has volunteered to coach and mentor others who are interested in becoming entrepreneurs. As the author of The Bathrobe Millionaire, Jason tells his story of starting a business that was profitable from day one, and that generated total revenues in excess of $15 million while the entire workflow was completely automated leaving him free to explore nature, watch movies and catch up with loved ones. This book is more than just his success story; it examines the principles leading to success, and how he has inverted his thinking, often rejecting cliche “conventional wisdom”. Jason’s insight has resulted in significant financial gains and a balanced lifestyle. No, I previously thought my career would be in a large corporation. I’m somewhat risk-averse financially, and the fluctuations of being an entrepreneur occasionally make me queasy. But working for others never felt right to me, so I became a reluctant entrepreneur at first, and later an enthusiastic one. Now, I’ll start a business anytime I have a good idea. I’ve learned not to take it personally when an idea flops. Some ideas work wonderfully out of the gate, some do not. In general, I find that several months after the transaction, the vast majority of my clients are glad they sold. The sales process can be a whirlwind of documents, spreadsheets, Zoom conversations, and emotions. In the “eye of the storm”, clients sometimes question why they are doing it. Generally, once the dust settles, they remember why they approached Quiet Light in the first place, and are happy with their decision. People’s reasons for selling range from personal, to financial, to burn out or simply craving a new challenge. My greatest benefit is the satisfaction of helping people achieve their goals, regardless of their reasoning."
