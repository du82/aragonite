["https://quietlight.com/how-to-buy-an-online-business-with-an-sba-loan"]
title = "Learn How to Buy a Business with an SBA Loan Successfully"
description = "Discover how SBA loans have evolved since 2009 & why they’re now a great choice for buying an online business like Ecommerce, SaaS or content sites."
full_description = "SBA lending has come a long way since the depths of the Great Recession in 2009. In the wake of economic collapse and chaos nearly eleven years ago, the entire lending industry re-evaluated how loans were written, making it extremely difficult to obtain an SBA-backed loan to finance a new business acquisition. Back then, our view of SBA loans was that they were slow and uncertain. They seemed to be the choice of buyers who really had no other option. However, a lot has changed since then. Today, SBA loans are a GREAT choice for both buyers and sellers of internet-based businesses. Whether you’re interested in buying an Ecommerce brand, SaaS company, or content site, this article will explain how to go about buying an online business using an SBA loan. When financing a deal using an SBA loan, a buyer needs to only put down 10% of the purchase price at closing. This means a buyer can acquire an online business, recoup their initial investment in just a few months, and then have the business literally pay for itself over the next few years. Additionally, buyers who use SBA loans are often able to offer better deals (and improve their chances of winning those deals) because their immediate return on investment is significantly stronger. Obviously, this greatly benefits the seller as well. For a seller in an SBA deal, they get to receive all or most of their funds at closing. What seller doesn’t want that? In order to provide the most helpful information possible, we reached out to one of our recommended lenders at a major bank to ask every question we could think of about SBA loans, as well as took lessons from our extensive experience at Quiet Light Brokerage. There are a lot of boxes that your bank and the SBA will require you to check off before getting an SBA loan. However, at the broadest level, an SBA loan has just three basic requirements. Here’s an overview of the conditions you’ll need to meet. First, your bank and the SBA will want to know if the business you’re acquiring will be able to sufficiently service the loan. In other words, will your new business be generating enough revenue to pay back the SBA?"
