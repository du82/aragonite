title = "8-Year-Old Electronics Business | $4.7M+ Revenue | YoY Revenue Up 4.33% | Seven Brand Registries | Quiet Light"
description = "Reading Time: < 1 minute Launched in 2015, this traditional mass-market consumer electronics business is famous for its series of personal evaporative air coolers, a product designed to circulate evaporate"
full_description = "Launched in 2015, this traditional mass-market consumer electronics business is famous for its series of personal evaporative air coolers, a product designed to circulate evaporated water through the air, which cools and adds moisture to the room. While they will retain certain aspects of the business, the sale will include everything related to the consumer electronics business, including the client base, Amazon and other marketplace accounts, the website, and the trademark for consumer electronics classes. At over $4.7M in the TTM, revenue is up 4.33% year over year, making this an extremely profitable business with huge potential for growth. All products use a patented technology, providing a clear advantage over the competition. With remote work showing no signs of slowing down, consumers will continue to become more interested in cooling their personal space and decreasing their electricity costs. While the highest volume of sales comes from the US, there is also a huge market in Australia, Europe, and the UK. Marketplaces make up 68% of revenue, with 14% from the direct site and 18% from partner sales. With 16 total SKUs, the top seller generates 57.45% of revenue. Expanding into retail channels offers tremendous opportunity for growth, as 64% of consumers buy air-treatment products in-store (source: Euromonitor, 2020). There is plenty of room to grow the product line within the same niche, especially by adding products that offset the seasonality of current sales. Building relationships with ad networks is an additional option to increase traffic and revenue. The current owner spends about 20 hours per week operating the business. Inventory is split between Amazon FBA and a 3PL; the latter can easily be shipped to Amazon or a new location. The owner is committed to a smooth transition and will happily offer full training and support. This business is currently under offer and therefore no longer available. Join the waiting list to be notified if it becomes available again"
