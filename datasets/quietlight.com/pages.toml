title = "Walker Deibel Quiet Light"
description = "Walker Deibel cofounded three startups and has acquired seven companies, including an online business from Quiet Light Brokerage before becoming an advisor."
full_description = "Before becoming an advisor, Walker Deibel co-founded three startups and has acquired seven companies outright, including an online business from Quiet Light. Walker’s bestselling book, Buy Then Build: How Acquisition Entrepreneurs Outsmart the Startup Game is the seminal work on acquisition entrepreneurship was introduced with critical acclaim, recognized by FORBES as “one of the top 7 books all entrepreneurs must-read,” and is used in multiple, ranked MBA programs. You can get your copy, and check out reader reviews, here. Walker frequently speaks on the unique intersection of acquisition and entrepreneurship, having been the Keynote speaker at Duke University, the Alliance of M&A Advisors Conference, and MIT. His writing has been featured in Inc, Entrepreneur, Fast Company, Forbes, and the Harvard Business Review. He has been awarded the M&A Thought Leader of the Year by both the Alliance of M&A Advisors (2019) and Axial (2020). He holds an MBA from the Olin School of Business at Washington University in St. Louis, where he received the Declaration of Accomplishment in Entrepreneurship. Walker is a Certified M&A Advisor, Certified M&A Professional, Certified Exit Planning Advisor, and former SEC licensed stockbroker. Walker is also an Emmy-nominated film producer and former Missouri State Cycling Champion. He lives in St. Louis, Missouri with his wife, their three daughters, and Scout, a very good dog. It’s not a “mistake” if you don’t have the knowledge, to begin with. In my opinion, there are three major trends that when lined up profile the perfect exit. This is rather difficult even if you know what they are–but most first-time entrepreneurs build without thinking of exiting so they don’t consider the trends. The first is your own desire to work in the business and take it to the next level. It starts off strong, typically gets stronger, but then wanes. The second is the growth trajectory of the business itself. It launches, goes through an adolescent growth phase, then levels out (and even eventually declining)."
