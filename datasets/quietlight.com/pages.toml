["https://quietlight.com/buyer-or-seller-who-pays-for-the-business-valuation"]
title = "Buyer or Seller: Who Pays for the Business Valuation? | Quiet Light"
description = "Whether you're buying or selling a business, you know that an accurate valuation is important. But who is responsible for paying for the business valuation?"
full_description = "Regardless of whether you are buying or selling a business, having a thorough and accurate valuation is a crucial part of creating a successful transaction. Whichever side you find yourself on, you may be wondering who is responsible for paying for the business valuation. After all, you don’t want to be left with the bill if the other party is ordinarily responsible for the valuation. First, let’s explore what a business valuation actually is. A business valuation is a process for determining the current value of a given company. That is, it is an estimate of how much the owner could currently sell the business for. When it comes to privately owned online businesses, the most common valuation method is the SDE multiple method. Get a free, individually-tailored valuation and business-readiness assessment. Sell when you're ready. Not a minute before. According to the SDE multiple method, the value of a business is equal to the seller’s discretionary earnings (SDE) times a number, called the multiple. Simple, right? Well, not really. While (almost) anybody could multiply two numbers together to determine a value, accurately calculating the SDE and the multiple requires a high degree of knowledge and experience. The seller’s discretionary earnings is the amount of money the business generates that is available to the owner for discretionary (optional) spending. In other words, it is the total benefit the business provides to the owner (hence why SDE is also sometimes called the “owner’s benefit”). That sounds a lot like income, right? Not quite. To calculate SDE, start with income and add back all allowable expenses and income. This typically includes: SDE captures the true money-generating capacity of the business, or what the owner actually makes from the business. As such, SDE is usually higher than the official income of the business. You may be tempted to look at the SDE of a business and extrapolate a value solely based on that figure. In this scenario, all businesses with the same SDE would have the same value. However, this is certainly not the case."
year_published = 2024
year_updated = 2024
