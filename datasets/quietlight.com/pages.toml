description = "Ryan Condie has started 8 businesses, bought 4, and sold 2. He owns a lead generation software company, an FBA business, and is the host of the “Let’s Buy a Business” podcast.  In 2014, he started a candy factory from scratch which can now be found in Sam’s Club, Walgreens, and thousands of other stores.  […]"
