["https://quietlight.com/advisors/chris-duty"]
title = "Chris Duty Quiet Light"
description = "Chris has always been an entrepreneur at heart. In his early teens, he earned his spending money by bootlegging CDs with his side-by-side burner and selling them to classmates. His first internet start-up was at age 15, reselling electronics on Ebay, where, as an early adopter, he had a 4 digit password until Ebay forced […]"
full_description = "Chris has always been an entrepreneur at heart. In his early teens, he earned his spending money by bootlegging CDs with his side-by-side burner and selling them to classmates. His first internet start-up was at age 15, reselling electronics on Ebay, where, as an early adopter, he had a 4 digit password until Ebay forced him to update in 2015. After college, Chris helped start various online businesses, including an SEO agency, online real-estate brokerage, and flash sale website before entering the VC-backed high-growth start-up world. There, he honed his skills in mobile product management at RetailMeNot (IPO 2013) before moving on to leadership and executive roles at Mobile Travel Technologies in London (Sold to Travelport in 2015) and Student.com in Shanghai, China. During a year-long sabbatical in 2016, Chris connected with a friend that had launched a successful Kickstarter campaign and needed help selling on Amazon. He was immediately taken by the opportunity and, after helping his friend, became one of the founding team members of 101 Commerce, the first Amazon aggregator. Through 101 Commerce and another aggregator, Chris helped acquire and operate 10+ FBA businesses, many were bought through Quiet Light. In 2021, Chris was offered to lead M&A at an up-and-coming aggregator when he reached out to solicit advice from Joe Valley. By the end of that call, Joe had convinced Chris to, instead, join Quiet Light as a business broker. The brightest part of his acquisition experience was working with the entrepreneurs and sharing their joy of accomplishment on closing day. Chris looks forward to sharing that moment many times over from a new perspective. I don’t generally write reviews, but it would be ungrateful of me to not tell everyone who wants to listen about my outstanding experience with Chris and Quiet Light. To be clear, no part of me wanted to exit my e-commerce business, but my professional career of 20 years in advertising suddenly took off and I needed to sell. Having spent countless hours listening to the Quiet Light Podcast and modeling my business around Mark’s 4 tenets of the kinds of businesses QLB are willing to sell, I knew I had laid solid foundations. But given the scale and young age of my business, when I reached out directly to Chris my only hope was to get a reply and maybe a recommendation. Looking back, it’s fair to say I was entirely unprepared for the staggering level of passion, professionalism, clear communication and strength of counsel I would receive over the coming weeks."
