full_description = "Media Coverage Highlighted articles: In October 2024 Big Think published a superb piece about Garson O’Toole and the Quote Investigator website. The article was titled “Einstein didn’t say that: How viral misquotes evolve and replicate”, and the journalist was Kevin Dickinson. Click here to read the article. In April 2017 The New York Times published an excellent article about Garson O’Toole, the Quote Investigator website, and the book “Hemingway Didn’t Say That”. The piece was titled “That Wasn’t Mark Twain: How a Misquotation Is Born”, and the journalist was Niraj Chokshi. Click here to read the article (Paywall). Click here to see the accompanying quiz (Paywall). In April 2017 The Wall Street Journal published a wonderful review of my book “Hemingway Didn’t Say That”. The review was titled “Things You Know That Ain’t So”. The reviewer was Fred R. Shapiro who is the brilliant editor of “The New Yale Book of Quotations”. Click here to read the review (Paywall). Additional Selected Citations Appear Below: Medium: On January 13, 2025 Enrique Dans who is a Professor of Innovation at IE Business School in Madrid Spain published an article on the Medium website. Dans mentioned a quotation attributed Albert Einstein, and he linked to the QI article titled “Quote Origin: Two Things Are Infinite: The Universe and Human Stupidity”. Snopes: On January 11, 2025 “Snopes” published an article by Madison Dapcevich titled “Did Ben Franklin Pen Famous ‘Tell Me and I Forget’ Quote?” Snopes concluded that the quotation was misattributed to Benjamin Franklin, and Snopes referred to the QI article on this topic titled “Quote Origin: Tell Me and I Forget; Teach Me and I May Remember; Involve Me and I Learn”. Snopes: On December 29, 2024 “Snopes” published an article by Caroline Wazer titled “No Concrete Proof Nikola Tesla Said ‘You May Live to See Man-Made Horrors Beyond Your Comprehension’”. Snopes stated that there was not enough verified evidence to definitively confirm or debunk the ascription to Tesla. Snopes referred to the QI article on this topic titled “Quote Origin: You May Live To See Man-Made Horrors Beyond Your Comprehension”. Business Times (Singapore): On December 21, 2024 the “Business Times” website published an article titled “Book review: The M&A Failure Trap” by Martin Fridson who found misattributions in the book he was reviewing. Fridson stated “Publishers ought to instruct their editors to make use of Quote Investigator”. The article referred to the information in the QI articles titled “Quote Origin: There’s a Sucker Born Every Minute” and “Quote Origin: It’s Difficult to Make Predictions, Especially About the Future”. Forbes: On December 20, 2024 the “Forbes” website published “At Least The Government Didn’t Close, Which Is Critical To Millions” by Erik Sherman. The article linked to a QI article titled “Quote Origin: Insanity Is Doing the Same Thing Over and Over Again and Expecting Different Results” about a quotation misattributed to Albert Einstein Wall Street Journal: On August 9, 2024 “The Wall Street Journal” published “How to Stay Sane When Markets Get Wild” by journalist Jason Zweig who wrote “To paraphrase Mark Twain, truth is stranger than fiction because fiction has to make sense. Markets don’t.” The WSJ article linked to the QI article titled “Quote Origin: Truth Is Stranger than Fiction, But It Is Because Fiction Is Obliged to Stick to Possibilities; Truth Isn’t” Snopes: On July 24, 2024 “Snopes” published an article by Caroline Wazer titled “Lenin Said, ‘There Are Decades Where Nothing Happens’ and ‘Weeks Where Decades Happen’?”. Snopes stated that the quotation was misattributed to Lenin, and Snopes referred to the QI article on this topic titled “Quote Origin: Days Into Which 20 Years Are Compressed”. New York Times: On July 20, 2024 “The New York Times published an article titled “Here’s the Hope if Biden Withdraws” by Nicholas Kristof. The article linked to a QI article about a quotation commonly misattributed to Lenin. The QI article is titled “Quote Origin: Days Into Which 20 Years Are Compressed”. The Guardian: On July 10, 2024 “The Guardian” of London published an article titled “Big, beautiful goals – but can’t be bothered? 11 great productivity tips for lazy people” by commentator Joel Snape. He wrote “I will happily spend 20 minutes on Quote Investigator rather than hoovering the living room or, er, writing a feature about productivity.” Snape’s piece linked to a QI article titled “Quote Origin: Choose a Lazy Person To Do a Hard Job Because That Person Will Find an Easy Way To Do It”. The QI article discussed a quotation that is often misattributed to Bill Gates and Walter Chrysler. USA Today: On June 7, 2024 “USA Today” published an article titled “On today’s subject or perhaps the lack of a subject” by columnist David Murdock. The piece linked to a QI article titled “Quote Origin This Is the Sort of Nonsense Up With Which I Will Not Put” about a statement that is often misattributed to Winston Churchill. Mental Floss: On June 4, 2024 “Mental Floss” published an article titled “‘Definition of Insanity’: Did Albert Einstein Really Coin This Famous Phrase?” by Jake Rossen. The piece mentioned QI’s book titled “Hemingway Didn’t Say That: The Truth Behind Familiar Quotations” and linked to a QI article titled “Insanity Is Doing the Same Thing Over and Over Again and Expecting Different Results”. Washington Post: On April 20, 2024 “The Washington Post” published “Opinion: Having exhausted the other options, the House did the right thing on Ukraine” by columnist Max Boot. The article linked to a QI article about a quotation commonly misattributed to Winston Churchill. The QI article is titled “Quote Origin: Americans Will Always Do the Right Thing — After Exhausting All the Alternatives”. Snopes: On January 22, 2024 Snopes analyzed a quotation that has often been misattributed to Winston Churchill. The Snopes piece mentioned the Quote Investigator and linked to the QI article on this topic titled “Success Is Never Final and Failure Never Fatal. It’s Courage That Counts”. Axios: On January 21, 2024 journalist Rebecca Falconer published “DeSantis’ Churchill attribution puts fake quotes in the spotlight” which discussed a misquotation employed by a politician who had just announced the end of his 2024 presidential campaign. The Axios piece mentioned the Quote Investigator and linked to an article on the QI website titled “Success Is Never Final and Failure Never Fatal. It’s Courage That Counts”. This quotation is often incorrectly attributed to Winston Churchill. International Business Times, 10 Tampa Bay, Splice Today: On January 21 and 22, 2024 several news organizations discussed a misquotation employed by a politician. The organizations mentioned the Quote Investigator and linked to the QI article on this topic titled “Success Is Never Final and Failure Never Fatal. It’s Courage That Counts”. The organizations included International Business Times in Singapore, 10 Tampa Bay: the website of a television broadcaster in Florida, and Splice Today of Baltimore, Maryland. Hacker News: On May 30, 2021 a QI article appeared on the front page of Hacker News which is a social news website focusing on technology and entrepreneurship. Hacker News is operated by startup incubator Y Combinator. The QI piece was titled “Computer Science Is Not About Computers, Any More Than Astronomy Is About Telescopes”. The Daily Messenger: On May 3, 2021 the website of the newspaper in Canandaigua, New York (part of Gannett) published a piece which discussed legislative negotiations about taxes and referred to the saying “Laws are like sausages, it’s better not to see them being made”. The journalist John Ninfo linked to the Quote Investigator article on the topic. USA Today: On April 27, 2021 the news organization published “Fact check: No, Albert Einstein did not say famous quote about fish climbing trees” which explored the remark “Everyone is a genius. But if you judge a fish by its ability to climb a tree, it will live its whole life believing that it is stupid”. Einstein has often received credit for this statement. USA Today referred to the analysis on the Quote Investigator website which noted the existence of an array of similar allegories concerning animals in school dating to the 1800s in various journals and newspapers. USA Today: On February 19, 2021 a journalist at the news organization published “Fact check: Clarence Darrow, not Mark Twain, said quote about enjoying some obituaries”. The journalist remarked that the quip “I’ve never wished a man dead, but I have read some obituaries with great pleasure” had been attributed to Mark Twain. However, he also noted that a similar statement had been attributed to attorney Clarence Darrow. He discussed the analysis presented by the Quote Investigator website to clarify the topic. Killeen Daily Herald: On January 24, 2021 Journalist Bob Maindelle of the Killeen, Texas news organization mentioned the quotation “If you always do what you’ve always done, you always get what you’ve always gotten”. He also mentioned the Quote Investigator analysis of the saying. Washington Post: On January 13, 2021 commentator George F. Will wrote, “Brevity is the soul of Twitter, as well as of (thank you, Dorothy Parker) lingerie”. He linked to the QI article about the Parker quotation. Australian Associated Press (AAP) FactCheck: On January 12, 2021 a team of journalists in Australia published a piece examining an inspirational quotation attributed to writer C. S. Lewis in popular Facebook posts: “You can’t go back and change the beginning, but you can start where you are and change the ending”. The AAP FactCheck article linked to an article on the Quote Investigator website which explored a similar quotation and traced it to back to James R. Sherman’s book “Rejection”. CNN: On January 11, 2021 commentator Paul Begala referred to the saying “Ninety percent of life is just showing up”. He linked to the QI article on the topic. Website of Radio Station WHAV of Haverhill, Massachusetts: On December 23, 2020 Dr. Raymond F. Comeau published a piece titled “The Mystery of a Whittier Christmas Quote” which examined the provenance of four poetic lines attributed to John Greenleaf Whittier. The article linked to a Quote Investigator article which traced the lines to Margaret E. Sangster. Washington Post: On December 7, 2020 columnist Charles Lane of the Washington D.C. newspaper referred to a remark often attributed to economist John Maynard Keynes: “When the facts change, I change my mind. What do you do, sir?” The columnist noted that the attribution is currently unsupported and linked to the QI article. Le Monde of Paris, France: On December 2, 2020 an article in the leading French newspaper Le Monde examined a statement attributed to the prominent philosopher Arthur Schopenhauer about the multi-stage acceptance of truths. The newspaper linked to an exploration of the topic on the Quote Investigator website. Schopenhauer did pen thematically germane remarks on the topic, but they differed markedly from modern formulations. RealClearPolitics: On November 27 2020 Carl M. Cannon, the Washington bureau chief for RealClearPolitics, examined a quotation ascribed to Helen Keller: “The best and most beautiful things in the world cannot be seen or even touched — they must be felt with the heart.” Cannon referred to the research of Garson O’Toole available on the Quote Investigator website. Y Combinator Startup Accelerator: On July 18 2020 a Quote Investigator article appeared on the front page of the news aggregator website Hacker News. The QI article was titled “The Floggings Will Continue Until Morale Improves”. Washington Post: On July 15, 2020 a columnist in the Washington D.C. newspaper referred to a remark attributed to Napoleon: “When your enemy is executing a false movement, never interrupt him.”. The analysis of the quotation on the QI website was mentioned. Washington Post: On April 20, 2020 a columnist in the Washington D.C. newspaper discussed protestors and referred to the adage “My right to swing my fist ends where your nose begins”. The article linked to the QI article on the subject. Trivia Genius: In March 2020 this website about trivia published “10 Quotes Famous People Never Actually Said”. The article linked to the Quote Investigator analysis of serval quotations including “A woman needs a man like a fish needs a bicycle” and “Our deepest fear is not that we are inadequate. Our deepest fear is that we are powerful beyond measure.” Slate: Senior technology writer Will Oremus wrote about research that analyzed rumors propagated on twitter. His piece titled “Lies Travel Faster Than Truth on Twitter—and Now We Know Who to Blame” linked to a popular QI entry titled “A Lie Can Travel Halfway Around the World While the Truth Is Putting On Its Shoes”. Guardian: Guillermo del Toro’s Oscar winning film “The Shape of Water” has faced accusations of plagiarism. Film critic Ryan Gilbey says that claims of this type are common in Hollywood and observes that “claims multiply during awards season”. The article links to a QI article about a quotation attributed to Dorothy Parker: “The Only “Ism” in which Hollywood Believes Is Plagiarism”. New York Daily News: A research article in the journal “Science” about the propagation of inaccurate information via twitter caused many people to search for a saying that is often misattributed to Mark Twain. The search led people to QI’s article titled “A Lie Can Travel Halfway Around the World While the Truth Is Putting On Its Shoes” which contained a precursor expression written by Jonathan Swift. A “Daily News” journalist composed an opinion piece on this topic titled: “Tweets untrue at any speed: What Jonathan Swift had to say about the age in which we live”. The Chronicle of Higher Education: English Professor Ben Yagoda wrote about the slang term “smacked ass” which he first heard in Philadelphia, Pennsylvania. Yagoda noted that QI “found the earliest use I’ve seen, by the Inquirer columnist Tom Fox in 1971”. The Ringer: Ben Lindbergh praised tough-to-obtain 1998 video game “Panzer Dragoon Saga”. While discussing the influence of the game Lindbergh linked to a QI analysis of a quotation about the rock group “Velvet Underground”. Center for Mark Twain Studies: Twain expert Matt Seybold who is an Assistant Professor of American Literature wrote a piece about an apocryphal quotation and linked to the QI article “Never Let Schooling Interfere with Your Education”. BBC: Reporter Rebecca Seales spoke to QI and wrote an enjoyable and informative article titled “Let’s save Maya Angelou from fake quotes”. Seales discussed several quotations examined by QI including: “They may forget what you said, but they will never forget how you made them feel” and “A bird doesn’t sing because it has an answer, it sings because it has a song”. Wall Street Journal: Wo"
