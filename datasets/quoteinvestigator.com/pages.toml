full_description = "Quote Origin: Nine-Tenths of Painting Will Be Extinguished by the Competition of Photographs George Bernard Shaw? Henrietta Clopath? Sidney Trefusis? Charles Baudelaire? Apocryphal? Anonymous? Question for Quote Investigator: Generative artificial intelligence (AI) systems are now capable of rapidly constructing images, videos, 3d-objects, and text. The current output displays flaws, but the quality and variety continues to improve. Artists are experiencing a volatile mixture of wonder, anticipation, uncertainty, fear, … Continue reading “Quote Origin: Nine-Tenths of Painting Will Be Extinguished by the Competition of Photographs” Posted byquoteresearchFebruary 26, 2025Posted inUncategorizedTags: Charles Baudelaire, George Bernard Shaw, Henrietta Clopath, Sidney Trefusis Quote Origin: Edison Has Invented Too Many Things New York Times? Anonymous? Apocryphal? Question for Quote Investigator: After Thomas Edison invented the phonograph many praised the device. However, a major newspaper apparently reacted with the following odd remark: Mr. Edison has invented too many things. This statement has been attributed to “The New York Times”. Is this quotation accurate? Did it ever appear … Continue reading “Quote Origin: Edison Has Invented Too Many Things” Posted byquoteresearchFebruary 25, 2025February 25, 2025Posted inUncategorizedTags: New York Times Quote Origin: The Tree Remembers What the Axe Forgets Shona Proverb? G. Fortune? Maya Angelou? Wolfgang Mieder? Anonymous? Question for Quote Investigator: A faultfinder may deliver a harsh criticism and quickly forget it. Yet, the recipient of the barb may create a painful memory. Similarly, a person who causes an injury may forget the incident, but the person who is hurt will likely remember … Continue reading “Quote Origin: The Tree Remembers What the Axe Forgets” Posted byquoteresearchFebruary 20, 2025Posted inUncategorizedTags: G. Fortune, Maya Angelou, Shona Proverb, Wolfgang Mieder Quote Origin: You Will Find the Key To Success Under Your Alarm Clock Benjamin Franklin? Apocryphal? Anonymous? Question for Quote Investigator: Achieving success in life requires simple skills such as showing up for work on time. The following saying is pertinent: You will find the key to success under the alarm clock. This statement has been attributed to U.S. statesman Benjamin Franklin. However, I am skeptical because I … Continue reading “Quote Origin: You Will Find the Key To Success Under Your Alarm Clock” Posted byquoteresearchFebruary 17, 2025February 17, 2025Posted inUncategorizedTags: Benjamin Franklin"
