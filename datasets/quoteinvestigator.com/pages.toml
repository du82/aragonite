full_description = "Quote Origin: Nine-Tenths of Painting Will Be Extinguished by the Competition of Photographs George Bernard Shaw? Henrietta Clopath? Sidney Trefusis? Charles Baudelaire? Apocryphal? Anonymous? Silhouette of a person holding a camera from Unsplash Question for Quote Investigator: Generative artificial intelligence (AI) systems are now capable of rapidly constructing images, videos, 3d-objects, and text. The current output displays flaws, but the quality and variety continues to improve. Artists are experiencing a volatile mixture of wonder, anticipation, uncertainty, fear, resentment, and disgust. An analogous technological upheaval occurred as photography matured. Here are two statements of prediction about the disruption that occurred during the 19th and early 20th century: (1) Nine-tenths of painting will be extinguished by the competition of photographs. (2) Color photography will eventually supersede the art of painting. The first statement has been linked to the playwright George Bernard Shaw, and the second statement has been linked to the painter Henrietta Clopath. However, I have not seen any solid citations. Would you please explore this topic? Reply from Quote Investigator: In 1887 George Bernard Shaw published “An Unsocial Socialist” which featured an eccentric protagonist named Sidney Trefusis who was enamored with photography. Trefusis was asked to predict the future of the arts. Boldface added to excerpts by QI:1 “Photography perfected in its recently discovered power of reproducing colour as well as form! Historical pictures replaced by photographs of tableaux vivants formed and arranged by trained actors and artists, and used chiefly for the instruction of children. Nine-tenths of painting as we understand it at present extinguished by the competition of these photographs; and the remaining tenth only holding its own against them by dint of extraordinary excellence!” Shaw’s character Trefusis condemned painters and etchers who derided photography:2 “The artists are sticking to the old barbarous, difficult, and imperfect processes of etching and portrait painting merely to keep up the value of their monopoly of the required skill. They have left the new, more complexly organized, and more perfect, yet simple and beautiful method of photography in the hands of tradesmen, sneering at it publicly, and resorting to its aid surreptitiously.” Of course, Shaw’s personal views may have differed from those of the protagonist in his novel. Today, the number of digital color photographs vastly exceeds the number of paintings and etchings although most photographs are not snapped to display high aesthetic values. Below are additional selected citations in chronological order. Continue reading “Quote Origin: Nine-Tenths of Painting Will Be Extinguished by the Competition of Photographs” Posted byquoteresearchFebruary 26, 2025Posted inUncategorizedTags: Charles Baudelaire, George Bernard Shaw, Henrietta Clopath, Sidney Trefusis"
