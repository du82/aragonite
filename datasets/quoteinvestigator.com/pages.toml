full_description = "Quote Origin: If You See a Swiss Banker Jump Out of a Window, Jump Right After. There Is Bound To Be a Profit In It Voltaire? Cardinal Richelieu? Étienne François de Choiseul? Catharine Sedgwick? Marie-Henri Beyle? Lionel de Rothschild? Anonymous? Picture of office windows from Mike Kononov at Unsplash Question for Quote Investigator: Bankers in Switzerland are world-renowned for their financial acuity. Here are three remarks which illustrate this perception: (1) If you ever see a Swiss banker jump out of a window, jump after him; there is a large profit to be made. (2) If you see a Geneva banker jump out a window, follow him. There is money to be made on the way down. (3) If you see a Zurich banker jumping out of a third story window, you may safely jump after him; you will be sure of making ten percent. French philosopher Voltaire (François-Marie Arouet) has received credit for this quip. However, I have never seen a solid citation. Would you please explore the provenance of this saying? Reply from Quote Investigator: The important 2021 reference work “The Quotable Voltaire” edited by Garry Apgar and Edward M. Langille included an entry for this quip. The scholars concluded: “Likely misattributed to Voltaire”.1 The joke is difficult to trace because it has many forms. The earliest match found by QI appeared in “The Gentleman’s Magazine” of London in 1783. The quotation appeared in French with an ascription to Cardinal Richelieu (Armand Jean du Plessis, 1st Duke of Richelieu). Boldface added to excerpts by QI:2 . . . he was amazed at their knowledge, yet he could not help thinking the saying of Cardinal Richelieu extremely applicable, “Si vous voyez un Genevois se jetter par la fenêtre, jettez vous y après; car soyez assuré qu’il y aura douze pour cent à gagner.” Here is one possible translation into English : “If you see a Genevan throw himself out of the window, throw yourself out afterwards; be assured that there will be twelve percent to be gained.” Cardinal Richelieu died in 1642; hence, the evidence provided by the attribution above is very weak. Voltaire died in 1778, and he received credit by 1807. This evidence is also weak. QI concurs with Apgar and Langille. QI would not credit Voltaire with the quip. The Duke of Choiseul (Étienne François de Choiseul) died in 1785. He received credit by 1790. QI believes he is a plausible candidate for creator, but he was not named in the earliest citation, and the posthumous evidence is weak. Thus, based on current data QI would assign an anonymous ascription to this joke. Below are additional selected citations in chronological order. Continue reading “Quote Origin: If You See a Swiss Banker Jump Out of a Window, Jump Right After. There Is Bound To Be a Profit In It” Posted byquoteresearchDecember 29, 2024December 30, 2024Posted inUncategorizedTags: Cardinal Richelieu, Catharine Sedgwick, Étienne François de Choiseul, Lionel de Rothschild, Marie-Henri Beyle, Voltaire"
