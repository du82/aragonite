full_description = "Quote Origin: The Most Common Form of Despair Is Not Being Who You Are Søren Kierkegaard? Carl Rogers? John Rowan? Howard Sasportas? Walter Lowrie? Anonymous? Illustration representing confusion about self-identity from Pixabay Question for Quote Investigator: Unhappy people often feel compelled to wear a social mask and to live inauthentic lives. Danish theologian and existentialist philosopher Søren Kierkegaard has been credited with the following remark: The most common form of despair is not being who you are. I have been unable to find a citation and have become skeptical of this attribution. Would you please explore the provenance of this statement? Reply from Quote Investigator: QI believes that this statement evolved over time from passages written by Søren Kierkegaard in his 1849 book “Sygdommen til Døden” (“The Sickness unto Death”). An English translation by Walter Lowrie was published in 1941. Kierkegaard discussed despair extensively in the book. The following sentences contained the central idea of the quotation although the expression was somewhat convoluted. Boldface added to excerpt s by QI:1 A despairing man wants despairingly to be himself. But if he despairingly wants to be himself, he will not want to get rid of himself. Yes, so it seems; but if one inspects more closely, one perceives that after all the contradiction is the same. That self which he despairingly wills to be is a self which he is not (for to will to be that self which one truly is, is indeed the opposite of despair); what he really wills is to tear his self away from the Power which constituted it. The central idea was also expressed in the following passage:2 This form of despair is: in despair at not willing to be oneself; or still lower, in despair at not willing to be a self; or lowest of all, in despair at willing to be another than himself. In 1956 the influential U.S. psychologist Carl Rogers published an article in the journal “Pastoral Psychology”. Rogers wrote a paraphrase of the viewpoint expressed by Søren Kierkegaard:3 In this connection I have been astonished to find how accurately the Danish philosopher, Soren Kierkegaard, pictured the dilemma of the individual more than a century ago, with keen psychological insight. He points out that the most common despair is to be in despair at not choosing, or willing, to be one’s self; but that the deepest form of despair is to choose “to be another than himself.” On the other hand “to will to be that self which one truly is, is indeed the opposite of despair,” and this choice is the deepest responsibility of man. This text was further paraphrased to yield the popular modern expression as indicated further below. Continue reading “Quote Origin: The Most Common Form of Despair Is Not Being Who You Are” Posted byquoteresearchJanuary 24, 2025Posted inUncategorizedTags: Carl Rogers, Howard Sasportas, John Rowan, Soren Kierkegaard, Walter Lowrie"
