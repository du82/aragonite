["https://qz.com/microsoft-skype-shut-down-zoom-1851767123"]
title = "How Microsoft Skype went wrong as others zoomed by"
description = "As Skype was failing to compete with social platforms like Snapchat, Zoom was building out its end-user experience"
full_description = '''{"@type":"NewsArticle","@context":"http://schema.org","url":"https://qz.com/microsoft-skype-shut-down-zoom-1851767123","author":[{"@type":"Person","name":"Ece Yildirim"}],"headline":"Skype signs off: How Microsoft's video platform went wrong as others zoomed by","description":"As Skype was failing to compete with social platforms like Snapchat, Zoom was building out its end-user experience","dateline":"02/28/2025 at 16:54","datePublished":"2025-02-28T16:54:00-05:00","dateModified":"2025-02-28T20:53:54-05:00","mainEntityOfPage":{"@type":"WebPage","url":"https://qz.com/microsoft-skype-shut-down-zoom-1851767123"},"mentions":[{"@type":"Corporation","@context":"http://schema.org","name":"Apple Inc.","tickerSymbol":"AAPL","url":"https://qz.com/quote/AAPL"},{"@type":"Corporation","@context":"http://schema.org","name":"eBay Inc.","tickerSymbol":"EBAY","url":"https://qz.com/quote/EBAY"},{"@type":"Corporation","@context":"http://schema.org","name":"Meta Platforms Inc.","tickerSymbol":"META","url":"https://qz.com/quote/META"},{"@type":"Corporation","@context":"http://schema.org","name":"Microsoft Corporation","tickerSymbol":"MSFT","url":"https://qz.com/quote/MSFT"},{"@type":"Corporation","@context":"http://schema.org","name":"Snap Inc. Class A","tickerSymbol":"SNAP","url":"https://qz.com/quote/SNAP"},{"@type":"Corporation","@context":"http://schema.org","name":"Zoom Communications Inc.","tickerSymbol":"ZM","url":"https://qz.com/quote/ZM"}],"image":{"@type":"ImageObject","height":675,"width":1200,"url":"https://i.kinja-img.com/image/upload/c_fill,h_675,pg_1,q_80,w_1200/0b893c450481a245d1acf9fe579bd30a.jpg","thumbnail":{"@type":"ImageObject","height":180,"width":320,"url":"https://i.kinja-img.com/image/upload/c_fill,h_180,pg_1,q_80,w_320/0b893c450481a245d1acf9fe579bd30a.jpg"}},"isAccessibleForFree":"False","hasPart":{"@type":"WebPageElement","isAccessibleForFree":"False","cssSelector":".js_regwalled-content"},"articleBody":"Skype (MSFT) is chirping its last goodbye. \n\nIts parent company, Microsoft, announced on Friday that Skype will be going offline for good on May 5, 2025. The tech giant is instead pivoting all its focus to Microsoft Teams, which has many of the same core features as Skype but is geared towards businesses rather than consumers.\n\nEffective immediately, Microsoft will cease Skype’s paid offerings such as credits and subscriptions. Existing Skype users can use their accounts to log into Teams over the coming days if they wish to automatically transfer over previous chats and contacts. And until the May deadline, Teams and Skype users will be able to call and chat with each other.\n\nIn its heyday, Skype was the leading video communication tool, so much so that the brand name acted as a verb for video chatting. So how did Skype lose its crown while relative newcomers, like Zoom (ZM), enjoyed atmospheric rises in popularity?\n\nSkype’s fall can be traced back to Microsoft’s acquisition in 2011, experts from New York University’s Stern School of Business told Quartz.\n\nSkype was founded in 2003 by Nordic entrepreneurs and a small team of Estonian developers. It was acquired first by eBay (EBAY) in 2005 and then by Microsoft in what was the software giant’s largest acquisition at the time.\n\n“Microsoft wanted to have an integrated messaging system of text, voice and video for a long time,” said NYU Stern professor of entrepreneurship Arun Sundararajan. \n\nMicrosoft first tried to build it itself with Office Communicator, which later turned into Lync, before re-debuting as Skype for Business post-acquisition. This was a separate platform from the original Skype, whose consumer base was its primary strength.\n\n“The business market and the consumer market are very different,” Sundararajan said.\n\nWith the social media boom, widespread adoption of smartphones and the explosion of messaging apps such as Snapchat (SNAP) and WhatsApp (META) in the early 2010s, the “locus of competition for tech shifted from being business-centric to being consumer-centric and Microsoft, as a specialist in the business market, had to adjust,” he added.\n\nSkype might’ve helped the tech giant do just that, Sundararajan said, but ultimately there was a mismatch between Skype’s consumer base and Microsoft’s competencies in the business market.\n\n“I think that a lot of Skype’s journey post-2011 was driven by it not being squarely positioned as a business product,” Sundararajan said. Instead, Microsoft tried to have Skype compete with other consumer-facing products to little success, such as in 2017 when Skype debuted an ill-received user interface with “highlights” that mirrored Snapchat’s popular “stories” feature. \n\nThen, video-chat features appeared inside popular texting platforms, such as Apple’s (AAPL) FaceTime and Meta’s WhatsApp.\n\n“For a lot of people, there was an extension of an existing product that they were using that started to offer high quality video-calling and as a consequence the standalone value of having a separate app that they used to associate with video-calling went down,” Sundararajan said.\n\nMicrosoft eventually discontinued Skype for Business, passing the baton to the arguably more successful Microsoft Teams, which was already integrated into the Microsoft Office Suite. \n\nSkype and its business counterpart were competitors under the umbrella of the same parent company. “It is unlikely that two similar platform products would coexist nicely,” NYU Stern professor of management communication Jeffrey Younger told Quartz.\n\nAs Skype was failing to compete with the social media and messaging app giants, Zoom was building out its product. So, when the pandemic hit and the need for video-conferencing sky-rocketed, Zoom had the product with the better end-user experience. \n\nIt was easier to adopt and initiate calls for new users, and the service made screen-sharing painless. And once universities and offices adopted Zoom, network effects kicked in. People started getting on Zoom simply because everyone else was already on Zoom.\n\n“It’s possible that had COVID hit four years earlier in 2016, Skype may have ended up being the dominant platform,” Sundararajan said. \n\n“The lesson is to be judicious about where your strengths lie, and the extent to which you can compete in markets that don’t play to your strengths,” he added. “And timing really is everything.”\n\n","articleSection":"skype","keywords":["skype","microsoft","symbian software","skype technologies","msn messenger","teleconferencing","cross platform software","business finance","jeffrey younger","snap","arun sundararajan","mark gillett","snapchat","microsoft office","ebay","the microsoft","videotelephony","instant messaging","microsoft teams","technology internet"],"publisher":{"@type":"Organization","@context":"http://schema.org","name":"Quartz","url":"https://qz.com","logo":{"@type":"ImageObject","width":500,"url":"https://x.kinja-static.com/assets/images/logos/newsletter/quartz-500px.png"},"sameAs":["https://www.facebook.com/quartznews","https://www.youtube.com/channel/UC9f78Z5hgtDt0n8JWyfBk8Q","https://twitter.com/qz","https://instagram.com/qz"]},"video":[]}ByEce YildirimUpdatedFriday 8:53PMWe may earn a commission from links on this page.Photo: NurPhoto (Getty Images)In This StoryMSFT0.00%ZM0.00%EBAY+1.26%SNAP+1.95%META+0.42%Skype (MSFT0.00%) is chirping its last goodbye. Its parent company, Microsoft, announced on Friday that Skype will be going offline for good on May 5, 2025. The tech giant is instead pivoting all its focus to Microsoft Teams, which has many of the same core features as Skype but is geared towards businesses rather than consumers.Suggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's re