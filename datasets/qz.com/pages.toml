["https://qz.com/amazon-alexa-plus-generative-ai-new-devices-1851766874"]
title = "Amazon will launch new devices with Alexa Plus"
description = "The model and its companion gadgets are intended to go beyond the duties of a traditional virtual assistant"
full_description = '''{"@type":"NewsArticle","@context":"http://schema.org","url":"https://qz.com/amazon-alexa-plus-generative-ai-new-devices-1851766874","author":[{"@type":"Person","name":"Ece Yildirim"}],"headline":"Amazon is launching a new lineup of Alexa Plus companion gadgets","description":"The model and its companion gadgets are intended to go beyond the duties of a traditional virtual assistant","dateline":"02/27/2025 at 14:51","datePublished":"2025-02-27T14:51:00-05:00","dateModified":"2025-02-27T16:59:18-05:00","mainEntityOfPage":{"@type":"WebPage","url":"https://qz.com/amazon-alexa-plus-generative-ai-new-devices-1851766874"},"mentions":[{"@type":"Corporation","@context":"http://schema.org","name":"Amazon.com Inc.","tickerSymbol":"AMZN","url":"https://qz.com/quote/AMZN"},{"@type":"Corporation","@context":"http://schema.org","name":"Alphabet Inc.","tickerSymbol":"GOOGL","url":"https://qz.com/quote/GOOGL"}],"image":{"@type":"ImageObject","height":675,"width":1200,"url":"https://i.kinja-img.com/image/upload/c_fill,h_675,pg_1,q_80,w_1200/3d2746f550fc6d42b9ba134ecdfee9de.jpg","thumbnail":{"@type":"ImageObject","height":180,"width":320,"url":"https://i.kinja-img.com/image/upload/c_fill,h_180,pg_1,q_80,w_320/3d2746f550fc6d42b9ba134ecdfee9de.jpg"}},"isAccessibleForFree":"False","hasPart":{"@type":"WebPageElement","isAccessibleForFree":"False","cssSelector":".js_regwalled-content"},"articleBody":"Amazon (AMZN) is gearing up for a “brand new lineup of devices” to launch this fall that will accompany the tech giant’s latest AI venture, CEO Andy Jassy said in an interview with Bloomberg Television on Thursday.\n\nAmazon unveiled Alexa Plus, its long-awaited generative AI version of the popular virtual assistant Alexa, on Wednesday. The model and its companion gadgets are intended to go beyond the duties of a traditional virtual assistant and help users with everyday tasks like making reservations or hiring someone to fix your oven, Jassy said.\n\n“It really is the first big, large scale practical use of generative AI [that] the consumers are going to be able to see and use naturally,” Jassy said.\n\nThe upcoming companion devices are only one part of what Jassy deems Alexa’s own “sustainable” business model.\n\n“We have opportunities to service new products and advertising in various interfaces, like our mobile and our desktop interface that’s coming in Alexa, and then we have subscriptions,” Jassy said.\n\nAlexa Plus, essentially the company’s answer to Google’s (GOOGL) Gemini, will start rolling out in some Amazon devices next month. It will be free for Amazon Prime subscribers and will cost $19.99 for non-Prime users. \n\nWith Alexa Plus and the company’s focus on building generative AI capabilities for its cloud computing unit Amazon Web Services, Amazon is putting all bets on AI.\n\n“We’re spending a pretty significant amount of CapEx, and the lion’s share of it is on generative AI,” Jassy said.\n\nThe Alexa Plus product was at the center of investor worries last year when former employees told Fortune Magazine that the company struggled to mesh the existing Alexa technology with generative AI. At the time, Amazon claimed the employees were incorrect.\n\n","articleSection":"amazon","keywords":["amazon","alexa","alexa plus","business finance","artificial intelligence","andy jassy","microsoft bing","generative artificial intelligence","amazon web services","jassy","technology internet","amazon alexa","virtual assistant"],"publisher":{"@type":"Organization","@context":"http://schema.org","name":"Quartz","url":"https://qz.com","logo":{"@type":"ImageObject","width":500,"url":"https://x.kinja-static.com/assets/images/logos/newsletter/quartz-500px.png"},"sameAs":["https://www.facebook.com/quartznews","https://www.youtube.com/channel/UC9f78Z5hgtDt0n8JWyfBk8Q","https://twitter.com/qz","https://instagram.com/qz"]},"video":[]}ByEce YildirimUpdatedThursday 4:59PMWe may earn a commission from links on this page.Photo: Bloomberg (Getty 