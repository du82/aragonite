title = "From Target to Apple, the companies ditching and keeping DEI"
description = "From Target to Disney, companies are rolling back their diversity programs. But Apple, Costco, and others are holding firm"
full_description = '{"@type":"NewsArticle","@context":"http://schema.org","url":"https://qz.com/dei-companies-trump-target-apple-costco-goldman-citi-1851766804","author":[{"@type":"Person","name":"Kevin Williams"}],"headline":"6 big companies ditching DEI — and 6 that are sticking with it","description":"From Target to Disney, companies are rolling back their diversity programs. But Apple, Costco, and others are holding firm","dateline":"02/28/2025 at 05:00","datePublished":"2025-02-28T05:00:00-05:00","dateModified":"2025-02-28T13:43:48-05:00","mainEntityOfPage":{"@type":"WebPage","url":"https://qz.com/dei-companies-trump-target-apple-costco-goldman-citi-1851766804"},"mentions":[{"@type":"Corporation","@context":"http://schema.org","name":"Apple Inc.","tickerSymbol":"AAPL","url":"https://qz.com/quote/AAPL"},{"@type":"Corporation","@context":"http://schema.org","name":"Citigroup Inc.","tickerSymbol":"C","url":"https://qz.com/quote/C"},{"@type":"Corporation","@context":"http://schema.org","name":"Costco Wholesale Corporation","tickerSymbol":"COST","url":"https://qz.com/quote/COST"},{"@type":"Corporation","@context":"http://schema.org","name":"Delta Air Lines Inc.","tickerSymbol":"DAL","url":"https://qz.com/quote/DAL"},{"@type":"Corporation","@context":"http://schema.org","name":"Walt Disney Company","tickerSymbol":"DIS","url":"https://qz.com/quote/DIS"},{"@type":"Corporation","@context":"http://schema.org","name":"Goldman Sachs Group Inc.","tickerSymbol":"GS","url":"https://qz.com/quote/GS"},{"@type":"Corporation","@context":"http://schema.org","name":"Paramount Global","tickerSymbol":"PARA","url":"https://qz.com/quote/PARA"},{"@type":"Corporation","@context":"http://schema.org","name":"PepsiCo Inc.","tickerSymbol":"PEP","url":"https://qz.com/quote/PEP"},{"@type":"Corporation","@context":"http://schema.org","name":"Target Corporation","tickerSymbol":"TGT","url":"https://qz.com/quote/TGT"},{"@type":"Corporation","@context":"http://schema.org","name":"Unilever PLC","tickerSymbol":"UL","url":"https://qz.com/quote/UL"},{"@type":"Corporation","@context":"http://schema.org","name":"Walmart Inc.","tickerSymbol":"WMT","url":"https://qz.com/quote/WMT"}],"image":{"@type":"ImageObject","height":675,"width":1200,"url":"https://i.kinja-img.com/image/upload/c_fill,h_675,pg_1,q_80,w_1200/1b439ea9776c92e3947748a274738ab8.jpg","thumbnail":{"@type":"ImageObject","height":180,"width":320,"url":"https://i.kinja-img.com/image/upload/c_fill,h_180,pg_1,q_80,w_320/1b439ea9776c92e3947748a274738ab8.jpg"}},"isAccessibleForFree":"False","hasPart":{"@type":"WebPageElement","isAccessibleForFree":"False","cssSelector":".js_regwalled-content"},"articleBody":" Companies from Disney (DIS) to Walmart (WMT) are ditching DEI as the Trump administration has put a chill on such efforts by eliminating it from federal programs.\n\nWhile the headlines are alarming, employment law firm Littler surveyed 350 C-suite executives and found that nearly half (49%) of C-suite leaders are not considering new or further rollbacks of their DEI programs as a result of Trump executive orders targeting DEI. Only 8% are seriously considering changes.\n\n “Despite the increased scrutiny, many companies seem to be taking a measured approach,” the firm says.\n\nHere are six that have ditched their DEI programs — and six that are sticking with them.\n\nDitching: Target\n\nBecause of its full embrace of DEI after the George Floyd protests rocked its Minneapolis headquarters hometown in 2020, Target (TGT) is perhaps feeling the biggest backlash for rolling back its policies.\n\nThe retailer recently announced the end of its three-year DEI goals and that it will stop reporting to external groups such as the Human Rights Campaign’s Corporate Equality Index. Target will also discontinue a program aimed at increasing its share of products from Black or minority-owned businesses.\n\nDitching: Disney\n\nDisney’s DEI rollback has been less dramatic than some companies. But Axios reports that it is getting rid of its Reimagine Tomorrow initiative, which was used to highlight stories and talent from underrepresented communities. The company is also eliminating executive evaluations that focus on diversity.\n\nDitching: Citigroup\n\nPerhaps no company did a faster U-turn than Citigroup (C), whose head of talent said in December: “DEI is part of our DNA.” But just a month after Trump’s inauguration and declaration that DEI policies are illegal in federal contracts, Citigroup pulled the plug on most of its DEI, citing its government contracts.\n\nDitching: Paramount\n\n Paramount (PARA) surprised Hollywood by announcing it will no longer use diversity targets tied to race or gender in hiring, and the company has begun removing DEI language from its website\n\nDitching: Pepsi\n\nPepsi (PEP) will eliminate its chief DEI officer role, shifting it to a “broader role focused on associate engagement, leadership development, and the continued delivery of A Space to Be You,” the company’s inclusivity program, CEO Ramon Laguarta said in a memo to employees. The company has also removed many references to DEI from its investor reports.\n\nDitching: Goldman Sachs\n\n Goldman Sachs (GS) announced this week that it would drop a stipulation that a company it takes public must have at least two diverse members on its board of directors, one of whom had to be a woman\n\nSticking: Costco\n\nCostco (COST) beat back an attempt by some shareholders to roll back or clarify DEI policies. Costco’s board responded that its diversity programs comply with the law, and cemented its commitment to diversifying its supplier base — including giving special consideration to small businesses. \n\n\nSticking: Apple\n\nThe National Center for Public Policy Research, a conservative think tank, had called on Apple (AAPL) to follow other major companies in backing off from DEI. But shareholders gave it a resounding thumbs down, quashing a proposal to end the iPhone maker’s DEI program.\n\nSticking: Lush\n\nLush has responded to a rollback in DEI by putting out three new bath bombs named Diversity, Equity, and Inclusion. Hilary Jones, the company’s global ethics director, told Adweek that the company is “not going to roll back on anything, and we wanted to make sure that we were visible in not rolling back.”\n\nSticking: National Football League\n\nThe National Football League has reiterated its commitment to DEI. NFL Commissioner Roger Goodell told the Washington Post that the league would continue to abide by its minority hiring programs because those “efforts are fundamental.”\n\nSticking: Delta\n\n Delta (DAL) Airlines is sticking with DEI. “We are steadfast in our commitments because we think that they are actually critical to our business,” Peter Carter, Delta’s chief external affairs officer said of the company’s diversity efforts during a recent earnings call.\n\nSticking: Ben &amp; Jerry’s\n\nIt should come as no surprise that the famously progressive company that gave us Cherry Garcia and Caramel Chew Chew is announcing it is sticking with DEI.\n\n“We believe that companies that timidly bow to the current political climate by attempting to turn back the clock will become increasingly uncompetitive in the marketplace and will ultimately be judged as having been on the wrong side of history,” the company said in a statement.\n\n","articleSection":"walmart","keywords":["walmart","roger goodell","corporate social responsibility","diversity","ben jerry","identity politics","iphone","disney","cherry garcia","lush","costco","pepsi","national football league","multiculturalism","trump","business finance","caramel chew chew","citigroup","ramon laguarta","target","nfl","goldman sachs","hilary jones","peter carter","affirmative action","anti racism","diversity equity and inclusion"],"publisher":{"@type":"Organization","@context":"http://schema.org","name":"Quartz","url":"https://qz.com","logo":{"@type":"ImageObject","width":500,"url":"https://x.kinja-static.com/assets/images/logos/newsletter/quartz-500px.png"},"sameAs":["https://www.facebook.com/quartznews","https://www.youtube.com/channel/UC9f78Z5hgtDt0n8JWyfBk8Q","https://twitter.com/qz","https://instagram.com/qz"]},"video":[]}Business News6 big companies ditching DEI — and 6 that are sticking with itFrom Target to Disney, companies are rolling back their diversity programs. But Apple, Costco, and others are holding firmByKevin WilliamsPublishedFriday 5:00AMWe may earn a commission from links on this page.Start SlideshowStart SlideshowPhoto: Smith Collection (Getty Images) Companies from Disney (DIS) to Walmart (WMT) are ditching DEI as the Trump administration has put a chill on such efforts by eliminating it from federal programs.AdvertisementWhile the headlines are alarming, employment law firm Littler surveyed 350 C-suite executives and found that nearly half (49%) of C-suite leaders are not considering new or further rollbacks of their DEI programs as a result of Trump executive orders targeting DEI. Only 8% are seriously considering changes. “Despite the increased scrutiny, many companies seem to be taking a measured approach,” the firm says.Here are six that have ditched their DEI programs — and six that are sticking with them.AdvertisementPrevious SlideNext SlideList slidesDitching: TargetList slidesDitching: TargetImage: Bloomberg (Getty Images)Because of its full embrace of DEI after the George Floyd protests rocked its Minneapolis headquarters hometown in 2020, Target (TGT) is perhaps feeling the biggest backlash for rolling back its policies.AdvertisementThe retailer recently announced the end of its three-year DEI goals and that it will stop reporting to external groups such as the Human Rights Campaign’s Corporate Equality Index. Target will also discontinue a program aimed at increasing its share of products from Black or minority-owned businesses.AdvertisementPrevious SlideNext SlideList slidesDitching: DisneyList slidesDitching: DisneyPhoto: Orlando Sentin