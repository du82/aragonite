title = "What are the most and least sinful U.S. states?"
description = "Americans in some states are far more prone to vices than in others"
full_description = '{"@type":"NewsArticle","@context":"http://schema.org","url":"https://qz.com/most-least-sinful-us-states-1851766382","author":[{"@type":"Person","name":"Ben Kesslen"}],"headline":"The 5 most sinful states in America — and the 5 least sinful","description":"Americans in some states are far more prone to vices than in others","dateline":"02/27/2025 at 05:00","datePublished":"2025-02-27T05:00:00-05:00","dateModified":"2025-02-27T05:00:05-05:00","mainEntityOfPage":{"@type":"WebPage","url":"https://qz.com/most-least-sinful-us-states-1851766382"},"image":{"@type":"ImageObject","height":675,"width":1200,"url":"https://i.kinja-img.com/image/upload/c_fill,h_675,pg_1,q_80,w_1200/2940f9e326e86930a79ba4b483ac75c3.jpg","thumbnail":{"@type":"ImageObject","height":180,"width":320,"url":"https://i.kinja-img.com/image/upload/c_fill,h_180,pg_1,q_80,w_320/2940f9e326e86930a79ba4b483ac75c3.jpg"}},"isAccessibleForFree":"False","hasPart":{"@type":"WebPageElement","isAccessibleForFree":"False","cssSelector":".js_regwalled-content"},"articleBody":"We’re all prone to sin sometimes, but in some states, residents can’t stop being bad.\n\nWalletHub set out to find the least and most sinful states in the U.S. It looked at data across seven metrics: 1) Anger &amp; Hatred, 2) Jealousy, 3) Excesses &amp; Vices, 4) Greed, 5) Lust, 6) Vanity and 7) Laziness. Sound familiar?\n\nThe study considered serious issues like violent crimes, school bullying, teen dating violence, and theft rates. It also looked at drug use and gambling, casinos per capita, gambling-related arrests, and porn consumption. WalletHub then considered some lighter topics, like how vain a population is, looking at manicurists and pedicurists per capita, and plastic surgery rates.\n\n“People across the nation have their own moral struggles, from violent outbursts and bullying to compulsive gambling, excessive lust and self-destructive consumption,” said WalletHub analyst Chip Lupo. “While individual cases of negative behavior may only affect a few people, when these behaviors are exhibited by a high share of a state’s population, the majority of the state’s residents suffer as a result.”\n\nLupo suggested that states “invest in resources to help people curb vices, such as robust rehabilitation programs for people with gambling and drug addictions.”\n\nContinue reading to see which states are the most — and least — sinful. \n\n5th Least Sinful: Wyoming\n\n4th Least Sinful: Utah\n\n3rd Least Sinful: Vermont\n\n2nd Least Sinful: New Hampshire\n\nLeast Sinful: Idaho\n\n5th Most Sinful: Texas\n\n4th Most Sinful: Louisiana\n\n3rd Most Sinful: Florida\n\n2nd Most Sinful: California\n\nMost Sinful: Nevada\n\n","articleSection":"behavioral addiction","keywords":["behavioral addiction","chip lupo","vice","problem gambling","wallethub","social issues"],"publisher":{"@type":"Organization","@context":"http://schema.org","name":"Quartz","url":"https://qz.com","logo":{"@type":"ImageObject","width":500,"url":"https://x.kinja-static.com/assets/images/logos/newsletter/quartz-500px.png"},"sameAs":["https://www.facebook.com/quartznews","https://www.youtube.com/channel/UC9f78Z5hgtDt0n8JWyfBk8Q","https://twitter.com/qz","https://instagram.com/qz"]},"video":[]}LifestyleThe 5 most sinful states in America — and the 5 least sinfulAmericans in some states are far more prone to vices than in othersByBen KesslenPublishedThursday 5:00AMWe may earn a commission from links on this page.Start SlideshowStart SlideshowPhoto: Jon Feingersh Photography Inc (Getty Images)We’re all prone to sin sometimes, but in some states, residents can’t stop being bad.AdvertisementWalletHub set out to find the least and most sinful states in the U.S. It looked at data across seven metrics: 1) Anger & Hatred, 2) Jealousy, 3) Excesses & Vices, 4) Greed, 5) Lust, 6) Vanity and 7) Laziness. Sound familiar?The study considered serious issues like violent crimes, school bullying, teen dating violence, and theft rates. It also looked at drug use and gambling, casinos per capita, gambling-related arrests, and porn consumption. WalletHub then considered some lighter topics, like how vain a population is, looking at manicurists and pedicurists per capita, and plastic surgery rates.“People across the nation have their own moral struggles, from violent outbursts and bullying to compulsive gambling, excessive lust and self-destructive consumption,” said WalletHub analyst Chip Lupo. “While individual cases of negative behavior may only affect a few people, when these behaviors are exhibited by a high share of a state’s population, the majority of the state’s residents suffer as a result.”Lupo suggested that states “invest in resources to help people curb vices, such as robust rehabilitation programs for people with gambling and drug addictions.”Continue reading to see which states are the most — and least — sinful. AdvertisementPrevious SlideNext Slide2 / 12List slides5th Least Sinful: WyomingList slides5th Least Sinful: WyomingPhoto: RichVintage (Getty Images)AdvertisementPrevious SlideNext Slide3 / 12List slides4th Least Sinful: UtahList slides4th Least Sinful: UtahPhoto: DutcherAerials (Getty Images)AdvertisementPrevious SlideNext Slide4 / 12List slides3rd Least Sinful: VermontList slides3rd Least Sinful: VermontPhoto: DenisTangneyJr (Getty Images)AdvertisementPrevious SlideNext Slide5 / 12List slides2nd Least Sinful: New HampshireList slides2nd Least Sinful: New HampshirePhoto: DenisTangneyJr (Getty Images)AdvertisementPrevious SlideNext Slide6 / 12List slidesLeast Sinful: IdahoList slidesLeast Sinful: IdahoPhoto: Anna Gorin (Getty Images)AdvertisementPrevious SlideNext Slide7 / 12List slides5th Most Sinful: TexasList slides5th Most Sinful: TexasPhoto: RF Pictures (Getty Images)AdvertisementPrevious SlideNext Slide8 / 12List slides4th Most Sinful: LouisianaList slides4th Most Sinful: LouisianaPhoto: John Coletti (Getty Images)AdvertisementPrevious SlideNext Slide9 / 12List slides3rd Most Sinful: 