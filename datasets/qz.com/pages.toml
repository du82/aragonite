5,"width":1200,"url":"https://i.kinja-img.com/image/upload/c_fill,h_675,pg_1,q_80,w_1200/fb8628ebfaea947a560dc86d43cc6ad5.jpg","thumbnail":{"@type":"ImageObject","height":180,"width":320,"url":"https://i.kinja-img.com/image/upload/c_fill,h_180,pg_1,q_80,w_320/fb8628ebfaea947a560dc86d43cc6ad5.jpg"}},"isAccessibleForFree":"False","hasPart":{"@type":"WebPageElement","isAccessibleForFree":"False","cssSelector":".js_regwalled-content"},"articleBody":"Costco and bulk-buying go hand-in-hand, but the retailer won’t sell just anything – although its wealthier shoppers have a big love for Rolex watches and even Porches. Walmart may have lost its revenue crown to Amazon, but it’s flexing its muscles to compete, all while winning favor with President Donald Trump. McDonald’s says it has cracked the code and won’t raise egg prices for customers, at least for now. Meanwhile, Target put DEI on the chopping block – only to push shoppers away. Check out these stories and more in this week’s roundup.\n\n\nA Costco executive on the luxury items its wealthy customers love\n\nCostco (COST) is best known for its no-frills, bulk-buying experience, but the warehouse giant also moves a surprising amount of luxury goods. \n\nRead More\n\nWalmart’s bold bet to beat Amazon and win Trump’s favor\n\nWalmart (WMT) is betting big it can win over affluent shoppers, outpace Amazon (AMZN), and gain favor with President Donald Trump. \n\nRead More\n\nMcDonald’s says it won’t charge extra for eggs\n\nMcDonald’s is bucking the trend of rising egg prices – at least for a limited time. \n\nRead More\n\nTarget put DEI on the chopping block. Then fewer customers showed up\n\nTarget (TGT) announced it was scaling back its Diversity, Equity, and Inclusion (DEI) efforts one month ago. Now, the retail giant is seeing a rapid decline in store visits.\n\nRead More\n\nPapa John’s is beating Domino’s in the pizza wars\n\nPapa John’s is gaining ground in the competitive pizza market, outperforming Domino’s as the latter struggles with a tough macroeconomic environment. \n\nRead More\n\nWill Trump spare restaurants from tariffs?\n\nThe restaurant industry is on edge, urging President Donald Trump to exempt food and beverage imports from a proposed round of tariffs set to take effect on March 4, which could cost the sector $12 billion. \n\nRead More\n\nGeneric brand groceries are winning big as inflation makes a comeback\n\nInflation is hitting consumers hard, and both grocery shoppers and restaurants are feeling the squeeze. \n\nRead More\n\nBen &amp; Jerry’s founders eye a sweet deal to reclaim their brand from Unilever\n\nBen &amp; Jerry’s (UL) founders, Ben Cohen and Jerry Greenfield, are reportedly in talks to buy back their namesake ice cream brand from Unilever. \n\nRead More\n\nStarbucks is laying off more than 1,000 workers\n\nStarbucks is laying off 1,100 corporate employees as part of an effort to streamline operations and focus on its core business, CEO Brian Niccol said in a statement on Monday. \n\nRead More\n\nSubway is bringing back the discounted footlong. Here’s what you get for $6.99\n\nRestaurants continue to respond to price-weary consumers with value meals and deals. The latest to entry the fray: Subway. \n\nRead More\n\n","articleSection":"walmart","keywords":["walmart","costco","mcdonald s","business finance","shoppers drug mart","amazon","ben cohen","papa johns","target","jerry greenfield","brand","coffee in seattle","unilever","diversity equity and inclusion","will trump","ben jerry","donald trump","starbucks","brian niccol"],"publisher":{"@type":"Organization","@context":"http://schema.org","name":"Quartz","url":"https://qz.com","logo":{"@type":"ImageObject","width":500,"url":"https://x.kinja-static.com/assets/images/logos/newsletter/quartz-500px.png"},"sameAs":["https://www.facebook.com/quartznews","https://www.youtube.com/channel/UC9f78Z5hgtDt0n8JWyfBk8Q","https://twitter.com/qz","https://instagram.com/qz"]},"video":[]}RetailCostco's luxury favorites, Walmart's big bet, and McDonald's egg promise: Retail news roundupPlus, Papa John's slices the competition as Domino's warns tariffs could drive up pizza pricesByFrancisco VelasquezUpdatedFriday 9:45AMWe may earn a commission from links on this page.Start SlideshowStart SlideshowGraphic: Images: Gary Hershorn, Ethan Miller, Justin Sullivan, Shelby Knowles/BloombergCostco and bulk-buying go hand-in-hand, but the retailer won’t sell just anything – although its wealthier shoppers have a big love for Rolex watches and even Porches. Walmart may have lost its revenue crown to Amazon, but it’s flexing its muscles to compete, all while winning favor with President Donald Trump. McDonald’s says it has cracked the code and won’t raise egg prices for customers, at least for now. Meanwhile, Target put DEI on the chopping block – only to push shoppers away. Check out these stories and more in this week’s roundup.AdvertisementPrevious SlideNext Slide2 / 12List slidesA Costco executive on the luxury items its wealthy customers loveList slidesA Costco executive on the luxury items its wealthy customers lovePeople walk through the parking lot at a Costco on Feb. 1, 2025, in Bayonne, New Jersey. Image: Gary Hershorn (Getty Images)Costco (COST) is best known for its no-frills, bulk-buying experience, but the warehouse giant also moves a surprising amount of luxury goods. AdvertisementRead MoreAdvertisementPrevious SlideNext Slide3 / 12List slidesWalmart’s bold bet to beat Amazon and win Trump’s favorList slidesWalmart’s bold bet to beat Amazon and win Trump’s favorWalmart CEO Doug McMillon delivers a keynote address during CES 2024 in Las Vegas, Nevada. Image: Ethan Miller (Getty Images)Walmart (WMT) is betting big it can win over affluent shoppers, outpace Amazon (AMZN), and gain favor with President Donald Trump. AdvertisementRead MoreAdvertisementPrevious SlideNext Slide4 / 12List slidesMcDonald’s says it won’t charge extra for eggsList slidesMcDonald’s says it won’t charge extr