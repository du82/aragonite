shortage list. Semaglutide has been on the agency’s shortage list since March 2022. During this time, pharmacies, telehealth companies, and other healthcare providers have been able to make and sell what are known as compounded versions of the drug. In its lawsuit, the Outsourcing Facility Association (OFA) claims that the agency is “dismissing evidence that the shortage persists” and that its decision will “deprive patients of a vital treatment.”AdvertisementRead MoreAdvertisementPrevious SlideNext Slide5 / 8List slidesHims & Hers can’t sell off-brand Ozempic forever. But it can still sell these weight loss drugsList slidesHims & Hers can’t sell off-brand Ozempic forever. But it can still sell these weight loss drugsHims & Hers will start selling generic liraglutide later this year. Image: Hims & Hers (Getty Images)Hims & Hers (HIMS) made a killing last year selling an off-brand version of Ozempic, but with the drug’s shortage now declared over by the FDA, the company will soon have to halt sales of its cheaper alternative. That said, the millennial-focused telehealth company still has a few options on the table. AdvertisementRead MoreAdvertisementPrevious SlideNext Slide6 / 8List slidesEli Lilly is making more doses of Zepbound cheaperList slidesEli Lilly is making more doses of Zepbound cheaperAn Eli Lilly & Co. Zepbound injection pen arranged in the Brooklyn borough of New York, US, on Thursday, March 28, 2024.Image: Bloomberg / Contributor (Getty Images)Eli Lilly (LLY) is making more doses of its blockbuster weight-loss drug Zepbound available in vials and at lower prices. The pharma giant announced on Tuesday that it is now expanding its single-dose vial offerings of Zepbound to include higher doses. Last August, Eli Lilly began selling the lowest doses of Zepbound — 2.5 mg and 5 mg — in vials rather than the standard auto-injector pen, cutting the price by about half. Now, it’s adding two higher doses to the mix and further reducing the price of the lower ones.AdvertisementRead MoreAdvertisementPrevious SlideNext Slide7 / 8List slidesHims & Hers will stop selling some weight loss drugs — and the stock plummets 27%List slidesHims & Hers will stop selling some weight loss drugs — and the stock plummets 27%Hims & Hers said it will stop selling its compounded semaglutide injections later this year. Image: Hims & Hers (Getty Images)Hims & Hers (HIMS) stock took a steep dive, dropping more than 27% Tuesday morning — even after the millennial-focused telehealth company reported soaring sales for 2024 just the night before. Hims & Hers reported a striking 69% jump in sales for 2024, reaching $1.5 billion. But despite the strong growth, investors appear rattled by the looming loss of a key sales driver later this year.AdvertisementRead MoreAdvertisement8 / 8List slidesList slidesPreviousStart over'''
