title = "JPMorgan Chase CEO Jamie Dimon defends return-to-office policy"
description = '"I should never curse, ever,” Dimon said of his harsh remarks to employees who have protested the end of hybrid work'
full_description = '''{"@type":"NewsArticle","@context":"http://schema.org","url":"https://qz.com/jpmorgan-chase-jamie-dimon-hybrid-remote-work-rto-1851766285","author":[{"@type":"Person","name":"Ben Kesslen"}],"headline":"JPMorgan CEO Jamie Dimon is sorry for cursing. But return-to-office is still on","description":"\"I should never curse, ever,” Dimon said of his harsh remarks to employees who have protested the end of hybrid work","dateline":"02/25/2025 at 08:21","datePublished":"2025-02-25T08:21:00-05:00","dateModified":"2025-02-25T08:21:40-05:00","mainEntityOfPage":{"@type":"WebPage","url":"https://qz.com/jpmorgan-chase-jamie-dimon-hybrid-remote-work-rto-1851766285"},"mentions":[{"@type":"Corporation","@context":"http://schema.org","name":"Comcast Corporation Class A Common Stock","tickerSymbol":"CMCSA","url":"https://qz.com/quote/CMCSA"},{"@type":"Corporation","@context":"http://schema.org","name":"JPMorgan Chase & Co.","tickerSymbol":"JPM","url":"https://qz.com/quote/JPM"}],"image":{"@type":"ImageObject","height":675,"width":1200,"url":"https://i.kinja-img.com/image/upload/c_fill,h_675,pg_1,q_80,w_1200/d0d2687ea8f3e9d1c9e5c4825e101867.jpg","thumbnail":{"@type":"ImageObject","height":180,"width":320,"url":"https://i.kinja-img.com/image/upload/c_fill,h_180,pg_1,q_80,w_320/d0d2687ea8f3e9d1c9e5c4825e101867.jpg"}},"isAccessibleForFree":"False","hasPart":{"@type":"WebPageElement","isAccessibleForFree":"False","cssSelector":".js_regwalled-content"},"articleBody":"JPMorgan Chase (JPM) CEO Jamie Dimon said he regretted cursing during a recent company town hall but stands by the importance of the company’s new return-to-office policy.\n\nDimon said to CNBC, “I should never curse, ever,” when asked about his harsh remarks to a group of employees in Columbus, Ohio earlier this month.\n\nAt the time, the CEO said, “Don’t give me the s— that ‘work from home Friday’ works.” His language soured again when addressing an employee petition to reinstate hybrid work, saying, “I don’t care how many people sign that f—ing petition.”\n\n“I shouldn’t get angry and stuff like that,” Dimon told CNBC (CMCSA).\n\nHe went on to reiterate his core message around the company’s mandate ending hybrid work. \n\n“I completely respect people that don’t want to go to the office all five days a week. That’s your right. It’s my right. It’s a citizen’s right,” he said. “But they should respect that the company is going to decide what’s good for the clients, the company, etc., not an individual. And so they can get a job — and I’m not being mean — they can get a job elsewhere.”\n\nDimon has remained steadfast in his defense of the new policy, which has drawn significant ire from his workers.\n\nIn a petition, employees said the new policy “is a great leap backward: It hurts employees, customers, shareholders, and the firm’s reputation.”\n\n“From a corporate-citizenship perspective, it worsens traffic and pollution while disproportionately pushing out women, caregivers, senior employees, and individuals with disabilities,” the petition added. “Many of these are top performers, and many of them only able to join the workforce under hybrid work rules. This directly contradicts JPMC’s commitments to diversity, equity, and inclusion.”\n\nSpeaking about the petition, Dimon said Monday: “I forgot how many people signed, 1,200 people. That’s fine. And they have the right to feel that way. But we’re not going to change. We’re going back to the office.”\n\n","articleSection":"jamie dimon","keywords":["jamie dimon","dimon","chase bank","house of morgan","labor","jpmorgan chase","environment","business finance"],"publisher":{"@type":"Organization","@context":"http://schema.org","name":"Quartz","url":"https://qz.com","logo":{"@type":"ImageObject","width":500,"url":"https://x.kinja-static.com/assets/images/logos/newsletter/quartz-500px.png"},"sameAs":["https://www.facebook.com/quartznews","https://www.youtube.com/channel/UC9f78Z5hgtDt0n8JWyfBk8Q","https://twitter.com/qz","https://instagram.com/qz"]},"video":[]}ByBen KesslenPublishedTuesday 8:21AMWe may earn a commission from links on this page.Photo: Bloomberg / Contributor (Getty Images)In This StoryJPM+1.32%CMCSA+0.95%JPMorgan Chase (JPM+1.32%) CEO Jamie Dimon said he regretted cursing during a recent company town hall but stands by the importance of the company’s new return-to-office policy.Suggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkview videoNvidia's record earnings reveal just 3 customers make up 30% of revenueSuggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkNvidia's record earnings reveal just 3 customers make up 30% of revenueDimon said to CNBC, “I should never curse, ever,” when asked about his harsh remarks to a group of employees in Columbus, Ohio earlier this month.AdvertisementRelated ContentJamie Dimon is fed up with remote workJamie Dimon on why he didn't run for presidentRelated ContentJamie Dimon is fed up with remote workJamie Dimon on why he didn't run for presidentAt the time, the CEO said, “Don’t give me the s— that ‘work from home Friday’ works.” His language soured again when addressing an employee petition to reinstate hybrid work, saying, “I don’t care how many people sign that f—ing petition.”Advertisement“I shouldn’t get angry and stuff like that,” Dimon told CNBC (CMCSA+0.95%).He went on to reiterate his core message around the company’s mandate ending hybrid work. Advertisement“I completely respect people that don’t want to go to the office all five days a week. That’s your right. It’s my right. It’s a citizen’s right,” he said. “But they should respect that the company is going to decide what’s good for the clients, the company, etc., not an individual. And so they can get a job — and I’m not being mean — they can get a job elsewhere.”Dimon has remained steadfast in his defense of the new policy, which has drawn significant ire from his workers.AdvertisementIn a petition, employees said the new policy “is a great leap backward: It hurts employees, customers, shareholders, and the firm’s reputation.”“From a corporate-citizenship perspective, it worsens traffic and pollution while disproportionately pushing out women, caregivers, senior employees, and individuals with disabilities,” the petition added. “Many of these are top performers, and many of them only able to join the workforce under hybrid work rules. This directly contradicts JPMC’s commitments to diversity, equity, and inclusion.”AdvertisementSpeaking about the petition, Dimon said Monday: “I forgot how many people signed, 1,200 people. That’s fine. And they have the right to feel that way. But we’re not going to change. We’re going back to the office.”📬 Sign up for the Daily BriefOur free, fast, and fun briefing on the global economy, delivered every weekday morning.'''
