title = "What are the best jobs that don't require a college degree?"
description = "There are lots of great fields out there for people who didn't go to college"
full_description = '''{"@type":"NewsArticle","@context":"http://schema.org","url":"https://qz.com/best-jobs-highest-pay-no-college-degree-1851766192","author":[{"@type":"Person","name":"Ben Kesslen"}],"headline":"10 high-paying and fast-growing jobs that don't require a college degree","description":"There are lots of great fields out there for people who didn't go to college","dateline":"02/28/2025 at 05:00","datePublished":"2025-02-28T05:00:00-05:00","dateModified":"2025-02-28T05:00:03-05:00","mainEntityOfPage":{"@type":"WebPage","url":"https://qz.com/best-jobs-highest-pay-no-college-degree-1851766192"},"image":{"@type":"ImageObject","height":675,"width":1200,"url":"https://i.kinja-img.com/image/upload/c_fill,h_675,pg_1,q_80,w_1200/a7d21c5674d0224bc675da8bac06a981.jpg","thumbnail":{"@type":"ImageObject","height":180,"width":320,"url":"https://i.kinja-img.com/image/upload/c_fill,h_180,pg_1,q_80,w_320/a7d21c5674d0224bc675da8bac06a981.jpg"}},"isAccessibleForFree":"False","hasPart":{"@type":"WebPageElement","isAccessibleForFree":"False","cssSelector":".js_regwalled-content"},"articleBody":"For many, the path to success starts with obtaining a college degree. But that isn’t the only way to land a good job. \n\nThere are lots of fast-growing jobs right now that don’t require a bachelor’s and have good salaries. \n\nKiplinger compiled a list of the highest-paying jobs and fastest-growing jobs for workers without a college degree. Continue reading to see which ones made the list.\n\n#10: Construction and building inspector\n\nConstruction and building inspectors make a median annual salary of $67,700. Some states require a license to be an inspector but not a college degree.\n\n#9: Flight attendant\n\nFlight attendants see a median annual salary of $68,370, and most airlines don’t require a college degree.\n\n#8: Athlete\n\nWhile this one might be a little unrealistic, Kiplinger put it as 8th on the list. Athletes have a median annual salary of $70,280, and no degree is required — just talent.\n\n#7: Wholesale and manufacturing sales representative\n\nWholesale and manufacturing sales representatives see a median annual salary of $73,080 and often aren’t required to have college degrees.\n\n#6: Locomotive engineers\n\nLocomotive engineers net a median annual salary of $73,580. Usually, no college degree is required, but you do need on-the-job training and certification from the Federal Railroad Administration, Kiplinger said.\n\n#5: Detective and criminal investigator\n\nIf you have an eye for solving crimes, you could make the median annual salary of $74,910 as a criminal investigator or detective — and you usually won’t need a college degree for it.\n\n#4: Aircraft and avionics equipment mechanic and technician\n\nAircraft and avionics equipment mechanics and technicians net a median annual salary of $75,400. While you will need to enter an FAA-approved program to get an Airframe and Powerplant (A&amp;P) certification, you don’t need a bachelor’s.\n\n#3: Electrical power-line installer and repairer\n\nElectrical power-line installers and repairers have a median annual salary of $85,420, and you will need some technical training or an apprenticeship but not a bachelor’s.\n\n#2: Transportation, storage, and distribution manager\n\nTransportation, storage, and distribution managers see a median annual salary of $99,200 and have no degree requirements.\n\n#1: Elevator and escalator installer and repairer\n\nElevator and escalator installers and repairers will see a median annual salary of $102,420 and tend to require a four-year apprenticeship but not a college degree, according to Kiplinger.\n\n","articleSection":"recruitment","keywords":["recruitment","human resource management","kiplinger personal finance","elevator","salary","median"],"publisher":{"@type":"Organization","@context":"http://schema.org","name":"Quartz","url":"https://qz.com","logo":{"@type":"ImageObject","width":500,"url":"https://x.kinja-static.com/assets/images/logos/newsletter/quartz-500px.png"},"sameAs":["https://www.facebook.com/quartznews","https://www.youtube.com/channel/UC9f78Z5hgtDt0n8JWyfBk8Q","https://twitter.com/qz","https://instagram.com/qz"]},"video":[]}Money & Markets10 high-paying and fast-growing jobs that don't require a college degreeThere are lots of great fields out there for people who didn't go to collegeByBen KesslenPublishedFriday 5:00AMWe may earn a commission from links on this page.Start SlideshowStart SlideshowPhoto: Sean Anthony Eddy (Getty Images)For many, the path to success starts with obtaining a college degree. But that isn’t the only way to land a good job. AdvertisementThere are lots of fast-growing jobs right now that don’t require a bachelor’s and have good salaries. Kiplinger compiled a list of the highest-paying jobs and fastest-growing jobs for workers without a college degree. Continue reading to see which ones made the list.AdvertisementPrevious SlideNext Slide2 / 12List slides#10: Construction and building inspectorList slides#10: Construction and building inspectorPhoto: Milan_Jovic (Getty Images)Construction and building inspectors make a median annual salary of $67,700. Some states require a license to be an inspector but not a college degree.AdvertisementPrevious SlideNext Slide3 / 12List slides#9: Flight attendantList slides#9: Flight attendantPhoto: Houston Chronicle/Hearst Newspapers / Contributor (Getty Images)Flight attendants see a median annual salary of $68,370, and most airlines don’t require a college degree.AdvertisementPrevious SlideNext Slide4 / 12List slides#8: AthleteList slides#8: AthletePhoto: Photo and Co (Getty Images)While this one might be a little unrealistic, Kiplinger put it as 8th on the list. Athletes have a median annual salary of $70,280, and no degree is required — just talent.AdvertisementPrevious SlideNext Slide5 / 12List slides#7: Wholesale and manufacturing sales representativeList slides#7: Wholesale and manufacturing sales representativePhoto: Maskot (Getty Images)Wholesale and manufacturing sales representatives see a median annual salary of $73,080 and often aren’t required to have college degrees.AdvertisementPrevious SlideNext Slide6 / 12List slides#6: Locomotive engineersList slides#6: Locomotive engineersPhoto: Monty Rakusen (Getty Images)Locomotive engineers net a median annual salary of $73,580. Usually, no college degree is required, but you do need on-the-job training and certification from the Federal Railroad Administration, Kiplinger said.AdvertisementPrevious SlideNext Slide7 / 12List slides#5: Detective and criminal investigatorList slides#5: Detective and criminal investigatorPhoto: South_agency (Getty Images)If you have an eye for solving crimes, you could make the median annual salary of $74,910 as a criminal investigator or detective — and you usually won’t need a college degree for it.AdvertisementPrevious SlideNext Slide8 / 12List slides#4: Aircraft and avionics equipment mechanic and technicianList slides#4: Aircraft and avionics equipment mechanic and technicianPhoto: Monty Rakusen (Getty Images)Aircraft and avionics equipment mechanics and technicians net a median annual salary of $75,400. While you will need to enter an FAA-approved program to get an Airframe and Powerplant (A&P) certification, you don’t need a bachelor’s.AdvertisementPrevious SlideNext Slide9 / 12List slides#3: Electrical power-line installer and repairerList slides#3: Electrical power-line installer and repairerPhoto: THOMAS KIENZLE / Contributor (Getty Images)Electrical power-line installers and repairers have a median annual salary of $85,420, and you will need some technical training or an apprenticeship but not a bachelor’s.AdvertisementPrevious SlideNext Slide10 / 12List slides#2: Transportation, storage, and distribution managerList slides#2: Transportation, storage, and distribution managerPhoto: boonchai wedmakawand (Getty Images)Transportation, storage, and distribution managers see a median annual salary of $99,200 and have no degree requirements.AdvertisementPrevious SlideNext Slide11 / 12List slides#1: Elevator and escalator installer and repairerList slides#1: Elevator and escalator installer and repairerPhoto: kadmy (Getty Images)Elevator and escalator installers and repairers will see a median annual salary of $102,420 and tend to require a four-year apprenticeship but not a college degree, according to Kiplinger.Advertisement12 / 12List slidesList slidesPreviousStart over'''
