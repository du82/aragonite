title = "Microsoft cancels data center leases, hitting stock"
description = "The tech giant canceled data center leases with at least two private operators in the U.S., TD Cowen analysts said"
full_description = '''{"@type":"NewsArticle","@context":"http://schema.org","url":"https://qz.com/microsoft-stock-data-center-lease-ai-td-cowen-bofa-1851766114","author":[{"@type":"Person","name":"Britney Nguyen"}],"headline":"Microsoft is canceling data center leases, analysts say — and the stock slips","description":"The tech giant canceled data center leases with at least two private operators in the U.S., TD Cowen analysts said","dateline":"02/24/2025 at 12:39","datePublished":"2025-02-24T12:39:00-05:00","dateModified":"2025-02-24T13:03:58-05:00","mainEntityOfPage":{"@type":"WebPage","url":"https://qz.com/microsoft-stock-data-center-lease-ai-td-cowen-bofa-1851766114"},"mentions":[{"@type":"Corporation","@context":"http://schema.org","name":"Bank of America Corporation","tickerSymbol":"BAC","url":"https://qz.com/quote/BAC"},{"@type":"Corporation","@context":"http://schema.org","name":"Meta Platforms Inc.","tickerSymbol":"META","url":"https://qz.com/quote/META"},{"@type":"Corporation","@context":"http://schema.org","name":"Microsoft Corporation","tickerSymbol":"MSFT","url":"https://qz.com/quote/MSFT"},{"@type":"Corporation","@context":"http://schema.org","name":"Oracle Corporation","tickerSymbol":"ORCL","url":"https://qz.com/quote/ORCL"},{"@type":"Corporation","@context":"http://schema.org","name":"SoftBank Group Corp. ADR","tickerSymbol":"SFTBY","url":"https://qz.com/quote/SFTBY"},{"@type":"Corporation","@context":"http://schema.org","name":"Toronto Dominion Bank","tickerSymbol":"TD","url":"https://qz.com/quote/TD"}],"image":{"@type":"ImageObject","height":675,"width":1200,"url":"https://i.kinja-img.com/image/upload/c_fill,h_675,pg_1,q_80,w_1200/1e3c0b9ae23436727abffd8f9955d199.jpg","thumbnail":{"@type":"ImageObject","height":180,"width":320,"url":"https://i.kinja-img.com/image/upload/c_fill,h_180,pg_1,q_80,w_320/1e3c0b9ae23436727abffd8f9955d199.jpg"}},"isAccessibleForFree":"False","hasPart":{"@type":"WebPageElement","isAccessibleForFree":"False","cssSelector":".js_regwalled-content"},"articleBody":"Microsoft (MSFT) shares fell slightly on Monday following an analyst report that the company canceled some U.S. data center leases, potentially signaling an oversupply of AI infrastructure.\n\nOn Friday, analysts at TD Cowen (TD) said in a note that the tech giant had canceled leases worth “a couple of hundred megawatts,” or approximately two data centers worth of capacity. In some cases, Microsoft said “facility/power delays” were a reason for termination, analysts said in the note, adding that Meta (META) had previously used a similar justification to cancel data center leases.\n\nTD Cowen also noted that Microsoft “has pulled back on” converting statement of qualification, agreements that typically turn into traditional leases. The analysts expressed uncertainty about whether Microsoft’s actions represent a temporary delay or a complete termination of the agreements.\n\nThe company is potentially “in an oversupply position,” with the note adding that Microsoft has turned down other data center and land acquisition deals. The TD Cowen analysts wrote that this indicated “the loss of a major demand signal that Microsoft was originally responding to and that we believed the shift in their appetite for capacity is tied to OpenAI.”\n\nThe company’s stock was down by around 1.2% at noon and has fallen by more than 4% so far this year. \n\n“Thanks to the significant investments we have made up to this point, we are well positioned to meet our current and increasing customer demand,” a Microsoft spokesperson said in a statement shared with Quartz, declining to address the note directly. “Last year alone, we added more capacity than any prior year in history. While we may strategically pace or adjust our infrastructure in some areas, we will continue to grow strongly in all regions. This allows us to invest and allocate resources to growth areas for our future.”\n\nThe spokesperson added that Microsoft’s plan to spend more than $80 billion on AI infrastructure this fiscal year is still on track.\n\nLast week, The Information reported that OpenAI has told investors that it expects the Stargate Project — which it has partnered with SoftBank (SFTBY) and Oracle (ORCL) on — to provide three-quarters of the computing power it needs for its artificial intelligence models by the end of the decade — a shift away from Microsoft.\n\nBank of America (BAC) analysts said in a note on Monday that Microsoft is “strongly refuting” changes to its data center strategy.\n\n“They [Microsoft] make investments based on a 10-year view on demand for cloud and AI demand,” the Bank of America analysts said. “They tweak their forecasts up and down on this overtime on a regional basis depending on which regions need to be prioritized.”\n\n","articleSection":"microsoft","keywords":["microsoft","openai","business finance","artificial intelligence","openai","big tech","cybernetics","computational neuroscience","softbank","technology internet","oracle","softbank group","stargate llc"],"publisher":{"@type":"Organization","@context":"http://schema.org","name":"Quartz","url":"https://qz.com","logo":{"@type":"ImageObject","width":500,"url":"https://x.kinja-static.com/assets/images/logos/newsletter/quartz-500px.png"},"sameAs":["https://www.facebook.com/quartznews","https://www.youtube.com/channel/UC9f78Z5hgtDt0n8JWyfBk8Q","https://twitter.com/qz","https://instagram.com/qz"]},"video":[]}ByBritney NguyenUpdatedMonday 1:03PMWe may earn a commission from links on this page.Microsoft CEO Satya Nadella at OpenAI DevDay on November 6, 2023 in San Francisco, California.Photo: Justin Sullivan (Getty Images)In This StoryMSFT0.00%META+0.42%SFTBY-2.06%ORCL-0.84%BAC+3.84%Microsoft (MSFT0.00%) shares fell slightly on Monday following an analyst report that the company canceled some U.S. data center leases, potentially signaling an oversupply of AI infrastructure.Suggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkview videoNvidia's record earnings reveal just 3 customers make up 30% of revenueSuggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkNvidia's record earnings reveal just 3 customers make up 30% of revenueOn Friday, analysts at TD Cowen (TD+0.47%) said in a note that the tech giant had canceled leases worth “a couple of hundred megawatts,” or approximately two data centers worth of capacity. In some cases, Microsoft said “facility/power delays” were a reason for termination, analysts said in the note, adding that Meta (META+0.42%) had previously used a similar justification to cancel data center leases.AdvertisementRelated ContentAmazon plans an AI spending spree — joining Google, Meta, and MicrosoftDeepSeek sinks stocks, Big Tech earnings, and AI for cancer: AI news roundupRelated ContentAmazon plans an AI spending spree — joining Google, Meta, and MicrosoftDeepSeek sinks stocks, Big Tech earnings, and AI for cancer: AI news roundupTD Cowen also noted that Microsoft “has pulled back on” converting statement of qualification, agreements that typically turn into traditional leases. The analysts expressed uncertainty about whether Microsoft’s actions represent a temporary delay or a complete termination of the agreements.AdvertisementThe company is potentially “in an oversupply position,” with the note adding that Microsoft has turned down other data center and land acquisition deals. The TD Cowen analysts wrote that this indicated “the loss of a major demand signal that Microsoft was originally responding to and that we believed the shift in their appetite for capacity is tied to OpenAI.”AdvertisementThe company’s stock was down by around 1.2% at noon and has fallen by more than 4% so far this year. “Thanks to the significant investments we have made up to this point, we are well positioned to meet our current and increasing customer demand,” a Microsoft spokesperson said in a statement shared with Quartz, declining to address the note directly. “Last year alone, we added more capacity than any prior year in history. While we may strategically pace or adjust our infrastructure in some areas, we will continue to grow strongly in all regions. This allows us to invest and allocate resources to growth areas for our future.”AdvertisementThe spokesperson added that Microsoft’s plan to spend more than $80 billion on AI infrastructure this fiscal year is still on track.Last week, The Information reported that OpenAI has told investors that it expects the Stargate Project — which it has partnered with SoftBank (SFTBY-2.06%) and Oracle (ORCL-0.84%) on — to provide three-quarters of the computing power it needs for its artificial intelligence models by the end of the decade — a shift away from Microsoft.AdvertisementBank of America (BAC+3.84%) analysts said in a note on Monday that Microsoft is “strongly refuting” changes to its data center strategy.“They [Microsoft] make investments based on a 10-year view on demand for cloud and AI demand,” the Bank of America analysts said. “They tweak their forecasts up and down on this overtime on a regional basis depending on which regions need to be prioritized.”📬 Sign up for the Daily BriefOur free, fast, and fun briefing on the global economy, delivered every weekday morning.'''
