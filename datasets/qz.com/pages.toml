title = "Amazon may bring AI to Alexa and charge for it"
description = "The retail giant reportedly has a last-ditch plan to save its digital assistant using AI"
full_description = '''{"@type":"NewsArticle","@context":"http://schema.org","url":"https://qz.com/amazon-alexa-ai-1851177310","author":{"@type":"Person","name":"Thomas Germain / Gizmodo"},"headline":"Amazon wants customers to pay for a supercharged AI Alexa","description":"The retail giant reportedly has a last-ditch plan to save its digital assistant using AI","dateline":"01/18/2024 at 14:52","datePublished":"2024-01-18T14:52:00-05:00","dateModified":"2024-02-09T11:10:58-05:00","mainEntityOfPage":{"@type":"WebPage","url":"https://qz.com/amazon-alexa-ai-1851177310"},"image":{"@type":"ImageObject","height":675,"width":1200,"url":"https://i.kinja-img.com/image/upload/c_fill,h_675,pg_1,q_80,w_1200/8cec4f9eee3768426af45d73b357f0ee.jpg","thumbnail":{"@type":"ImageObject","height":180,"width":320,"url":"https://i.kinja-img.com/image/upload/c_fill,h_180,pg_1,q_80,w_320/8cec4f9eee3768426af45d73b357f0ee.jpg"}},"isAccessibleForFree":"False","hasPart":{"@type":"WebPageElement","isAccessibleForFree":"False","cssSelector":".js_regwalled-content"},"articleBody":"More than 75 million people use Alexa, but by Amazon’s standards, the service is a total failure. The problem is Alexa doesn’t make any money, and the service is a huge drain on company resources. Apparently, Amazon has a last-ditch plan to save its digital assistant by supercharging it with AI and charging you for the privilege of using it—but things aren’t looking good. \n\nAccording to a report in Business Insider on Thursday, the secret new Alexa barely works thanks to hallucinating AI and broken tech. It apparently sparked political tensions inside the company, particularly because many Amazon employees don’t believe that people will be willing to pay.\n\nThe new service is tentatively called “Alexa Plus,” and it even has a launch date set for June 30, Business Insider reported. It seems that deadline will be hard to meet. \n\nAmazon is testing the underlying technology, named “Remarkable Alexa,” with 15,000 customers. Employees who spoke to BI said that tests show Remarkable Alexa is great at having conversations and terrible at doing anything useful. \n\nThe new Alexa gives exceedingly long and often inaccurate answers, BI said, and it has a hard time with more complicated requests that require dealing with multiple services (e.g. play “Paranoid Android” and turn off the lights).\n\nBeyond the classic failures of this generation of artificial intelligence, the new Alexa requires a massive shift in both the company’s strategy and the technology running behind the scenes. Some long-time Alexa workers aren’t happy about it. According to BI, the team who built the original Alexa doesn’t want to let their baby go and has forced Amazon to maintain parts of the original technology stack, which makes the new Remarkable Alexa bloated and more difficult to run. \n\nThen there are people who aren’t sold on the entire project. The number of services Amazon wants to tack onto your monthly bill keeps growing. There’s Prime, of course, but Amazon also pushes various streaming services, Audible, and more. Employees reportedly told BI that a lot of people don’t think the company will be able to convince its customers to pay a fee to use a smart speaker on top of the money they already pay.\n\nThis potentially doomed-from-the-start initiative is a response to growing pressure to make waves in the fledgling AI business. Google, Apple, and Amazon all spent billions of dollars developing smart assistants, a technology that was supposed to be the future of computing. Years later, that project failed to deliver any meaningful revenue. Silicon Valley generally views Alexa, Google Assistant, and Siri as misguided investments, and the teams working on smart speakers have been especially hard hit by layoffs and budget cuts in recent years. After making such a big deal about them, the tech industry doesn’t want to let them go. \n\nNow there’s renewed interest in these assistants as a way for consumers to interface with next-generation AI. Amazon and Apple in particular are playing catch up in that arena after Google, Microsoft, and OpenAI ran away with the AI hype cycle. Amazon built out its own AI models to compete with the ChatGPTs of the world, which the company calls Q, and reportedly has even more ambitious models in development. \n\nAdding AI to digital assistants is a no-brainer, and if Amazon can do it in a way that also turns Alexa into a money maker, it would solve a number of major headaches. If the plan doesn’t work, however, it could bring Alexa one step closer to the grave. \n\nThis article originally appeared on Gizmodo.\n\n","articleSection":"amazon","keywords":["amazon","alexa","openai","ring","google","alexa plus","alexa internet","technology internet","smart speaker","artificial intelligence","applications of artificial intelligence","apple","microsoft bing","microsoft","siri","amazon echo","amazon alexa"],"publisher":{"@type":"Organization","@context":"http://schema.org","name":"Quartz","url":"https://qz.com","logo":{"@type":"ImageObject","width":500,"url":"https://x.kinja-static.com/assets/images/logos/newsletter/quartz-500px.png"},"sameAs":["https://www.facebook.com/quartznews","https://www.youtube.com/channel/UC9f78Z5hgtDt0n8JWyfBk8Q","https://twitter.com/qz","https://instagram.com/qz"]},"video":[]}ByThomas Germain / GizmodoPublishedJanuary 18, 2024We may earn a commission from links on this page.Photo: Tyler Nottley / Shutterstock.com (Shutterstock)More than 75 million people use Alexa, but by Amazon’s standards, the service is a total failure. The problem is Alexa doesn’t make any money, and the service is a huge drain on company resources. Apparently, Amazon has a last-ditch plan to save its digital assistant by supercharging it with AI and charging you for the privilege of using it—but things aren’t looking good. Suggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkview videoNvidia's record earnings reveal just 3 customers make up 30% of revenueSuggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkNvidia's record earnings reveal just 3 customers make up 30% of revenueAccording to a report in Business Insider on Thursday, the secret new Alexa barely works thanks to hallucinating AI and broken tech. It apparently sparked political tensions inside the company, particularly because many Amazon employees don’t believe that people will be willing to pay.AdvertisementRelated ContentAmazon is struggling to bring AI to AlexaAlexa is losing Amazon billions of dollarsRelated ContentAmazon is struggling to bring AI to AlexaAlexa is losing Amazon billions of dollarsThe new service is tentatively called “Alexa Plus,” and it even has a launch date set for June 30, Business Insider reported. It seems that deadline will be hard to meet. AdvertisementAmazon is testing the underlying technology, named “Remarkable Alexa,” with 15,000 customers. Employees who spoke to BI said that tests show Remarkable Alexa is great at having conversations and terrible at doing anything useful. AdvertisementThe new Alexa gives exceedingly long and often inaccurate answers, BI said, and it has a hard time with more complicated requests that require dealing with multiple services (e.g. play “Paranoid Android” and turn off the lights).Beyond the classic failures of this generation of artificial intelligence, the new Alexa requires a massive shift in both the company’s strategy and the technology running behind the scenes. Some long-time Alexa workers aren’t happy about it. According to BI, the team who built the original Alexa doesn’t want to let their baby go and has forced Amazon to maintain parts of the original technology stack, which makes the new Remarkable Alexa bloated and more difficult to run. AdvertisementThen there are people who aren’t sold on the entire project. The number of services Amazon wants to tack onto your monthly bill keeps growing. There’s Prime, of course, but Amazon also pushes various streaming services, Audible, and more. Employees reportedly told BI that a lot of people don’t think the company will be able to convince its customers to pay a fee to use a smart speaker on top of the money they already pay.This potentially doomed-from-the-start initiative is a response to growing pressure to make waves in the fledgling AI business. Google, Apple, and Amazon all spent billions of dollars developing smart assistants, a technology that was supposed to be the future of computing. Years later, that project failed to deliver any meaningful revenue. Silicon Valley generally views Alexa, Google Assistant, and Siri as misguided investments, and the teams working on smart speakers have been especially hard hit by layoffs and budget cuts in recent years. After making such a big deal about them, the tech industry doesn’t want to let them go. AdvertisementNow there’s renewed interest in these assistants as a way for consumers to interface with next-generation AI. Amazon and Apple in particular are playing catch up in that arena after Google, Microsoft, and OpenAI ran away with the AI hype cycle. Amazon built out its own AI models to compete with the ChatGPTs of the world, which the company calls Q, and reportedly has even more ambitious models in development. Adding AI to digital assistants is a no-brainer, and if Amazon can do it in a way that also turns Alexa into a money maker, it would solve a number of major headaches. If the plan doesn’t work, however, it could bring Alexa one step closer to the grave. AdvertisementThis article originally appeared on Gizmodo.📬 Sign up for the Daily BriefOur free, fast, and fun briefing on the global economy, delivered every weekday morning.'''
