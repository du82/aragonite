r Business, passing the baton to the arguably more successful Microsoft Teams, which was already integrated into the Microsoft Office Suite. AdvertisementSkype and its business counterpart were competitors under the umbrella of the same parent company. “It is unlikely that two similar platform products would coexist nicely,” NYU Stern professor of management communication Jeffrey Younger told Quartz.As Skype was failing to compete with the social media and messaging app giants, Zoom was building out its product. So, when the pandemic hit and the need for video-conferencing sky-rocketed, Zoom had the product with the better end-user experience. AdvertisementIt was easier to adopt and initiate calls for new users, and the service made screen-sharing painless. And once universities and offices adopted Zoom, network effects kicked in. People started getting on Zoom simply because everyone else was already on Zoom.“It’s possible that had COVID hit four years earlier in 2016, Skype may have ended up being the dominant platform,” Sundararajan said. Advertisement“The lesson is to be judicious about where your strengths lie, and the extent to which you can compete in markets that don’t play to your strengths,” he added. “And timing really is everything.”📬 Sign up for the Daily BriefOur free, fast, and fun briefing on the global economy, delivered every weekday morning.'''
