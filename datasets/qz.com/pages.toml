(Getty Images)Costco (COST) beat back an attempt by some shareholders to roll back or clarify DEI policies. Costco’s board responded that its diversity programs comply with the law, and cemented its commitment to diversifying its supplier base — including giving special consideration to small businesses. AdvertisementPrevious SlideNext SlideList slidesSticking: AppleList slidesSticking: ApplePhoto: SOPA Images (Getty Images)The National Center for Public Policy Research, a conservative think tank, had called on Apple (AAPL) to follow other major companies in backing off from DEI. But shareholders gave it a resounding thumbs down, quashing a proposal to end the iPhone maker’s DEI program.AdvertisementPrevious SlideNext SlideList slidesSticking: LushList slidesSticking: LushImage: NurPhoto (Getty Images)Lush has responded to a rollback in DEI by putting out three new bath bombs named Diversity, Equity, and Inclusion. Hilary Jones, the company’s global ethics director, told Adweek that the company is “not going to roll back on anything, and we wanted to make sure that we were visible in not rolling back.”AdvertisementPrevious SlideNext SlideList slidesSticking: National Football LeagueList slidesSticking: National Football LeaguePhoto: Roberto Schmidt (Getty Images)The National Football League has reiterated its commitment to DEI. NFL Commissioner Roger Goodell told the Washington Post that the league would continue to abide by its minority hiring programs because those “efforts are fundamental.”AdvertisementPrevious SlideNext SlideList slidesSticking: DeltaList slidesSticking: DeltaPhoto: SOPA Images (Getty Images) Delta (DAL) Airlines is sticking with DEI. “We are steadfast in our commitments because we think that they are actually critical to our business,” Peter Carter, Delta’s chief external affairs officer said of the company’s diversity efforts during a recent earnings call.AdvertisementPrevious SlideNext SlideList slidesSticking: Ben & Jerry’sList slidesSticking: Ben & Jerry’sPhoto: Bloomberg (Getty Images)It should come as no surprise that the famously progressive company that gave us Cherry Garcia and Caramel Chew Chew is announcing it is sticking with DEI.Advertisement“We believe that companies that timidly bow to the current political climate by attempting to turn back the clock will become increasingly uncompetitive in the marketplace and will ultimately be judged as having been on the wrong side of history,” the company said in a statement.AdvertisementList slidesList slidesPreviousStart over'
