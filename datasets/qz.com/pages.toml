title = "Amgen's potential Ozempic competitor sends stock up 13%"
description = "Amgen's potential weight loss drug is heading to a larger phase 3 trial"
full_description = '''{"@type":"NewsArticle","@context":"http://schema.org","url":"https://qz.com/amgen-weight-loss-drug-stock-1851454154","author":[{"@type":"Person","name":"Bruce Gil"}],"headline":"Amgen teased trial results for its potential Ozempic competitor — and the stock surged 13%","description":"Amgen's potential weight loss drug is heading to a larger phase 3 trial","dateline":"05/03/2024 at 10:43","datePublished":"2024-05-03T10:43:00-04:00","dateModified":"2024-08-06T15:03:27-04:00","mainEntityOfPage":{"@type":"WebPage","url":"https://qz.com/amgen-weight-loss-drug-stock-1851454154"},"mentions":[{"@type":"Corporation","@context":"http://schema.org","name":"Amgen Inc.","tickerSymbol":"AMGN","url":"https://qz.com/quote/AMGN"},{"@type":"Corporation","@context":"http://schema.org","name":"Eli Lilly and Company","tickerSymbol":"LLY","url":"https://qz.com/quote/LLY"},{"@type":"Corporation","@context":"http://schema.org","name":"Morgan Stanley","tickerSymbol":"MS","url":"https://qz.com/quote/MS"},{"@type":"Corporation","@context":"http://schema.org","name":"Novo Nordisk A/S","tickerSymbol":"NVO","url":"https://qz.com/quote/NVO"}],"image":{"@type":"ImageObject","height":675,"width":1200,"url":"https://i.kinja-img.com/image/upload/c_fill,h_675,pg_1,q_80,w_1200/a0d7d4649c96a48997c4b471ecb1330a.jpg","thumbnail":{"@type":"ImageObject","height":180,"width":320,"url":"https://i.kinja-img.com/image/upload/c_fill,h_180,pg_1,q_80,w_320/a0d7d4649c96a48997c4b471ecb1330a.jpg"}},"isAccessibleForFree":"False","hasPart":{"@type":"WebPageElement","isAccessibleForFree":"False","cssSelector":".js_regwalled-content"},"articleBody":"Amgen stock picked up 13% during Friday morning trading, a day after its CEO Robert Bradway teased encouraging trial results of its experimental weight loss drug MariTide. \n\n“The interim phase 2 analysis for this study is complete, and we are very encouraged with results that we’ve seen thus far and with the conduct of the trial,” Bradway said Thursday on a call with investors. “Following the interim analysis, I would say, we’re confident in MariTide’s differentiated profile and believe it will address important unmet medical needs.”\n\nWhile results from the study will be released in late 2024, the company is already planning a larger phase 3 trial of drug for multiple uses, including obesity and diabetes. \n\nBradway’s comments come as several pharma companies are aiming to disrupt the weight loss drug duopoly dominated by Novo Nordisk, known for making Ozempic and Wegovy, and Eli Lilly, the producer of Zepbound.\n\nMorgan Stanley analysts anticipate that the global market for GLP-1 drugs — the class of drug these weight loss medications belong to — will reach $105 billion by 2030. It also projects the drugs will be adopted by about 31.5 million people in the United States, or about 9% of the nation’s population, by 2035.\n\nMariTide vs. Wegovy\n\nAn early stage trial of MariTide found that users on the drug lost average of 14.5% of their weight in about 12 weeks. For comparison, a clinical trial of Wegovy found that participants lost an average of 15% of their weight in 68 weeks.\n\nAmgen Chief Scientific Officer James E. Bradner told inverstors that MariTide is expected to be sold in a “convenient, handheld, patient-friendly auto-injector device with a monthly or even less frequent single-injection administration.” This is opposed to the weekly injections required for weight loss drugs currently on the market.\n\n","articleSection":"amgen","keywords":["amgen","eli lilly and company","anti obesity medication","james e bradner","health medical pharma","glp 1 receptor agonist","peptide therapeutics","robert a bradway","novo nordisk","eli lilly","maritide","zepbound","robert bradway","semaglutide","clinical trial","amycretin"],"publisher":{"@type":"Organization","@context":"http://schema.org","name":"Quartz","url":"https://qz.com","logo":{"@type":"ImageObject","width":500,"url":"https://x.kinja-static.com/assets/