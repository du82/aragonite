["https://qz.com/nvidia-stock-fall-q4-earnings-3-trillion-market-cap-ai-1851767004"]
title = "Nvidia stock slide drops market cap out of $3 trillion club"
description = "The AI chipmaker's shares slipped despite it beating revenue and guidance expectations"
full_description = '''{"@type":"NewsArticle","@context":"http://schema.org","url":"https://qz.com/nvidia-stock-fall-q4-earnings-3-trillion-market-cap-ai-1851767004","author":[{"@type":"Person","name":"Britney Nguyen"}],"headline":"Nvidia's stock slide kicked its market cap out of the $3 trillion club","description":"The AI chipmaker's shares slipped despite it beating revenue and guidance expectations","dateline":"02/28/2025 at 10:44","datePublished":"2025-02-28T10:44:00-05:00","dateModified":"2025-02-28T10:59:32-05:00","mainEntityOfPage":{"@type":"WebPage","url":"https://qz.com/nvidia-stock-fall-q4-earnings-3-trillion-market-cap-ai-1851767004"},"mentions":[{"@type":"Corporation","@context":"http://schema.org","name":"Advanced Micro Devices Inc.","tickerSymbol":"AMD","url":"https://qz.com/quote/AMD"},{"@type":"Corporation","@context":"http://schema.org","name":"Intel Corporation","tickerSymbol":"INTC","url":"https://qz.com/quote/INTC"},{"@type":"Corporation","@context":"http://schema.org","name":"NVIDIA Corporation","tickerSymbol":"NVDA","url":"https://qz.com/quote/NVDA"}],"image":{"@type":"ImageObject","height":675,"width":1200,"url":"https://i.kinja-img.com/image/upload/c_fill,h_675,pg_1,q_80,w_1200/2382c044e58444ac7c7e3483e90446e7.jpg","thumbnail":{"@type":"ImageObject","height":180,"width":320,"url":"https://i.kinja-img.com/image/upload/c_fill,h_180,pg_1,q_80,w_320/2382c044e58444ac7c7e3483e90446e7.jpg"}},"isAccessibleForFree":"False","hasPart":{"@type":"WebPageElement","isAccessibleForFree":"False","cssSelector":".js_regwalled-content"},"articleBody":"Despite delivering another record quarter, Nvidia (NVDA) fell out of the $3 trillion market cap club after some unimpressed investors were left wanting more.\n\nNvidia’s stock was up by around 1.4% during morning trading on Friday at around $121 per share, leaving the firm with a roughly $2.9 trillion market cap.\n\nStill, the chipmaker’s shares fell in early trading on Thursday after it reported fiscal fourth-quarter earnings results. Advanced Micro Devices (AMD), Intel (INTC), and other chip rivals also saw declining shares.\n\n“What seems to be driving the share reaction is that it’s yet another typical Nvidia report where they beat and raise expectations,” Ken Mahoney, CEO of Mahoney Asset Management, said in post-earnings comments shared with Quartz. “For them to have this track record of doing that every time, in some way almost works against them as the market is not impressed unless it is a blowout beat and raise.”\n\nThe company reported revenue of $39.3 billion for its fiscal fourth quarter — a 78% increase from the previous year, and above the consensus of $38.1 billion. Its full-year revenue more than doubled year over year to $130.5 billion.\n\nRevenue guidance for the first quarter of the current fiscal year was set at $43 billion, plus or minus 2% — also above Wall Street’s expectations of $42 billion.\n\nAhead of earnings results, analysts were optimistic that the chipmaker would beat expectations and raise its outlook as it ramps up Blackwell production — despite shockwaves from Chinese AI startup DeepSeek. \n\n“We’ve successfully ramped up the massive-scale production of Blackwell AI supercomputers, achieving billions of dollars in sales in its first quarter,” Nvidia CEO Jensen Huang said in a statement. He called demand for the new chips “amazing” as companies roll out reasoning AI models.\n\n","articleSection":"nvidia","keywords":["nvidia","deepseek","business finance","advanced micro devices","megacap stock","jensen huang","ken mahoney","intel"],"publisher":{"@type":"Organization","@context":"http://schema.org","name":"Quartz","url":"https://qz.com","logo":{"@type":"ImageObject","width":500,"url":"https://x.kinja-static.com/assets/images/logos/newsletter/quartz-500px.png"},"sameAs":["https://www.facebook.com/quartznews","https://www.youtube.com/channel/UC9f78Z5hgtDt0n8JWyfBk8Q","https://twitter.com/qz","https://instagram.com/qz"]},"video":[]}ByBritney Ngu