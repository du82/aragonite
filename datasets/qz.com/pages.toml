["https://qz.com/china-tariffs-walmart-sherwin-williams-brown-dividend-1851755268"]
title = "Worried about tariffs? Walmart and other 'dividend aristocrat' stocks to buy in a volatile market"
description = "Eric Beiley, Executive Managing Director of The Beiley Group at Steward Partners, breaks down what China's retaliatory tariffs could mean for investors"
full_description = "Eric Beiley, Executive Managing Director of The Beiley Group at Steward Partners, breaks down for Quartz what China’s retaliatory tariffs could mean for investors, for the latest installment of our “Smart Investing” video series. Watch the interview above and check out the transcript below. The transcript of this conversation has been lightly edited for length and clarity. ANDY MILLS (AM): Given that China has imposed these retaliatory tariffs and launched an antitrust investigation into Google, how do you see this impacting global markets and strategies for US investors? ERIC BEILEY (EB): Overall, I think we’ve dodged a bullet. Yesterday investors woke up pretty concerned. We were down pretty significantly with the Trump tariff announcements on first Mexico and Canada, then China. But as the day went on, we saw these agreements with Mexico and Canada, and you saw the reaction by investors, right? The markets recovered across the board. And so that’s positive. And then into today, tariffs are still a major theme and I think will be with the Trump administration, but we haven’t seen yet from investors a willingness to really exit. I think investors are still overall confident and on board with the equity market. EB: No, it is a big deal because tariffs have significant impacts. And across the board for investors, I would say they’re negative. Tariffs are attacks and so it has negative implications on pricing, on inflation, consumer demand, obviously on all the companies and how they react to their manufacturing practices. So tariffs are negative. We’re seeing it’s also a negotiation tool and if used effectively so far, you know, investors are nervous, but still on board. And so that’s, that’s my hope going forward. EB: I think number one is interest rates. We saw that in the early part of January. It looked like from a couple economic figures that inflation was on the rise. And if we, if you looked at the yield markets, the 30-year tipped at 5% and 5% is a level that is a big no-no for equities, right? And you saw this huge decline, right? 800 point decline in the markets, but then very quickly we recovered as more economic data came in. That inflation was not as prevalent. And today we’ve seen a big reversal. Rates have come down and equities have gone higher. The risk trade is there, but we’ll have to see. Rates and inflation are a big issue. And the Fed met in January and they decided to keep rates level, which was the consensus view, and we’ll have to see going forward. Trump wants lower rates. And so it’ll be interesting to see how the Fed-Trump relationship evolves."
