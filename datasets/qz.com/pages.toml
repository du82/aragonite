title = "Citigroup accidentally credited $81 trillion to customer's account"
description = 'But the reported "near miss" was caught before funds were actually transferred'
full_description = '''{"@type":"NewsArticle","@context":"http://schema.org","url":"https://qz.com/citigroup-trillion-dollar-transfer-near-miss-fraser-1851766972","author":[{"@type":"Person","name":"William Gavin"}],"headline":"Citigroup accidentally credited a customer's account with $81 trillion","description":"But the reported \"near miss\" was caught before funds were actually transferred","dateline":"02/28/2025 at 08:40","datePublished":"2025-02-28T08:40:00-05:00","dateModified":"2025-02-28T09:42:00-05:00","mainEntityOfPage":{"@type":"WebPage","url":"https://qz.com/citigroup-trillion-dollar-transfer-near-miss-fraser-1851766972"},"mentions":[{"@type":"Corporation","@context":"http://schema.org","name":"Citigroup Inc.","tickerSymbol":"C","url":"https://qz.com/quote/C"}],"image":{"@type":"ImageObject","height":675,"width":1200,"url":"https://i.kinja-img.com/image/upload/c_fill,h_675,pg_1,q_80,w_1200/90751b6ecb70aef7911c48f774c9e1e9.jpg","thumbnail":{"@type":"ImageObject","height":180,"width":320,"url":"https://i.kinja-img.com/image/upload/c_fill,h_180,pg_1,q_80,w_320/90751b6ecb70aef7911c48f774c9e1e9.jpg"}},"isAccessibleForFree":"False","hasPart":{"@type":"WebPageElement","isAccessibleForFree":"False","cssSelector":".js_regwalled-content"},"articleBody":"Citigroup (C) mistakenly credited $81 trillion to a customer’s account last year and took hours to reverse the transaction, The Financial Times reports. The bank was supposed to credit just $280. \n\nThe error, which took place last April, was missed by two officials assigned to check the transaction before it was approved for processing, the Times reports. It was caught by a third employee who had detected a problem with the bank’s account balances more than an hour later. \n\nIn that case, no funds actually left Citigroup, which told the Federal Reserve and the Office of the Comptroller of the Currency that it was a “near miss.” A near miss is when a bank processes the incorrect amount meant to be transferred, but is able to recover the cash. A total of 10 incidents occurred at Citigroup last year, the Times reported, citing an internal report.\n\nIn a statement, Citigroup said a payment of that magnitude “could not actually have been executed,” noting that its detective controls caught the issue and the transaction was reversed. The incident, the bank said, “underscores our continued efforts to continue eliminating manual processes and automating controls through our transformation.”\n\nCitigroup has focused on eliminating the possibility of such incidents after taking reputational and financial hits from past mistakes. \n\nBritish regulators hit Citigroup with a $79 million fine last year over a May 2022 incident when one of its traders sold $1.4 billion worth of stocks on European exchanges, triggered a so-called “flash crash.” The trader had meant to sell just $58 million worth of stocks, but accidentally issued an order to sell $444 billion, the majority of which was blocked before being sold.\n\nIn 2020, Citigroup mistakenly used its own funds to pay off a $894 million loan owned by Revlon, a cosmetics company. Although some of the cash was returned by lenders, 10 of them had refused to give back the funds.\n\n Citigroup and those 10 firms reached a settlement in late 2022, after Revlon filed for Chapter 11 bankruptcy protection. Then-Citigroup CEO Michael Corbat said in September 2020 he would retire ahead of schedule, with reports pointing to regulators’ frustration over the company’s inability to fix risk and compliance issues. \n\nHis successor, Jane Fraser, has pledged to address the bank’s issues. Citigroup has been conducting a massive reorganization since late 2023 and is investing heavily in data and technology investments. \n\n“Fragmented tech platforms, manual processes and controls, and a weak first line of defense, too few subject matter experts,” Fraser told analysts last year. “This is a massive body of work that goes well beyond the consent order, and this is not old Citi putting on Band-Aids. This is Citi tackling the root issues head-on.”\n\nThe Federal Deposit Insurance Commission and Federal Reserve Board found continuing weaknesses related to data reliability and the firm’s compensating controls, the groups said in June. In July, Citigroup was fined $136 million for “insufficient progress” on improving its data handling.\n\n","articleSection":"citigroup","keywords":["citigroup","business finance","jane fraser","midtown manhattan","michael corbat","subprime mortgage crisis","revlon","federal deposit insurance","bank"],"publisher":{"@type":"Organization","@context":"http://schema.org","name":"Quartz","url":"https://qz.com","logo":{"@type":"ImageObject","width":500,"url":"https://x.kinja-static.com/assets/images/logos/newsletter/quartz-500px.png"},"sameAs":["https://www.facebook.com/quartznews","https://www.youtube.com/channel/UC9f78Z5hgtDt0n8JWyfBk8Q","https://twitter.com/qz","https://instagram.com/qz"]},"video":[]}ByWilliam GavinUpdatedFriday 9:42AMWe may earn a commission from links on this page.CitigroupPhoto: Mike Kemp/In Pictures (Getty Images)In This StoryC+0.10%Citigroup (C+0.10%) mistakenly credited $81 trillion to a customer’s account last year and took hours to reverse the transaction, The Financial Times reports. The bank was supposed to credit just $280. Suggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkview videoNvidia's record earnings reveal just 3 customers make up 30% of revenueSuggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkNvidia's record earnings reveal just 3 customers make up 30% of revenueThe error, which took place last April, was missed by two officials assigned to check the transaction before it was approved for processing, the Times reports. It was caught by a third employee who had detected a problem with the bank’s account balances more than an hour later. AdvertisementRelated ContentCitigroup CEO Jane Fraser says low-income consumers are being 'cautious' about their spending habitsHow Jane Fraser became the first woman to lead a major Wall Street bankRelated ContentCitigroup CEO Jane Fraser says low-income consumers are being 'cautious' about their spending habitsHow Jane Fraser became the first woman to lead a major Wall Street bankIn that case, no funds actually left Citigroup, which told the Federal Reserve and the Office of the Comptroller of the Currency that it was a “near miss.” A near miss is when a bank processes the incorrect amount meant to be transferred, but is able to recover the cash. A total of 10 incidents occurred at Citigroup last year, the Times reported, citing an internal report.AdvertisementIn a statement, Citigroup said a payment of that magnitude “could not actually have been executed,” noting that its detective controls caught the issue and the transaction was reversed. The incident, the bank said, “underscores our continued efforts to continue eliminating manual processes and automating controls through our transformation.”AdvertisementCitigroup has focused on eliminating the possibility of such incidents after taking reputational and financial hits from past mistakes. British regulators hit Citigroup with a $79 million fine last year over a May 2022 incident when one of its traders sold $1.4 billion worth of stocks on European exchanges, triggered a so-called “flash crash.” The trader had meant to sell just $58 million worth of stocks, but accidentally issued an order to sell $444 billion, the majority of which was blocked before being sold.AdvertisementIn 2020, Citigroup mistakenly used its own funds to pay off a $894 million loan owned by Revlon, a cosmetics company. Although some of the cash was returned by lenders, 10 of them had refused to give back the funds. Citigroup and those 10 firms reached a settlement in late 2022, after Revlon filed for Chapter 11 bankruptcy protection. Then-Citigroup CEO Michael Corbat said in September 2020 he would retire ahead of schedule, with reports pointing to regulators’ frustration over the company’s inability to fix risk and compliance issues. AdvertisementHis successor, Jane Fraser, has pledged to address the bank’s issues. Citigroup has been conducting a massive reorganization since late 2023 and is investing heavily in data and technology investments. “Fragmented tech platforms, manual processes and controls, and a weak first line of defense, too few subject matter experts,” Fraser told analysts last year. “This is a massive body of work that goes well beyond the consent order, and this is not old Citi putting on Band-Aids. This is Citi tackling the root issues head-on.”AdvertisementThe Federal Deposit Insurance Commission and Federal Reserve Board found continuing weaknesses related to data reliability and the firm’s compensating controls, the groups said in June. In July, Citigroup was fined $136 million for “insufficient progress” on improving its data handling.📬 Sign up for the Daily BriefOur free, fast, and fun briefing on the global economy, delivered every weekday morning.'''
