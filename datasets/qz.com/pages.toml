tent"},"articleBody":"Nvidia (NVDA) finished the fiscal year by delivering record revenue and outlook above expectations for the fourth quarter — and more than doubling its full-year revenue from the previous year.\n\nThe chipmaker reported revenue of $39.3 billion for the fourth quarter of fiscal year 2025 — a 78% increase from the previous year, and above the consensus of $38.1 billion. Meanwhile, Nvidia’s full-year revenue grew 114% year over year to a record $130.5 billion.\n\n“We’ve successfully ramped up the massive-scale production of Blackwell AI supercomputers, achieving billions of dollars in sales in its first quarter,” Nvidia CEO Jensen Huang said in a statement, adding that demand for the new chips is “amazing” as companies roll out reasoning AI models.\n\nAccording to Nvidia’s 10-K filing, just three anonymous customers made up more than 30% of total revenue for the fiscal year ended in January.\n\n“Direct Customer A” accounted for 12% of total revenue, while Direct Customers B and C each represented 11%, according to the Securities and Exchange Commission filing. Direct Customer B made up 13% of total revenue for fiscal year 2024, the filing said.\n\nAll of the sales “were primarily attributable to the Compute &amp; Networking segment,” according to the filing. \n\nFor the fiscal third quarter, Nvidia had reported revenue of $35.1 billion — 36% of which came from three unnamed customers. For the three months ended in October, Customers A, B, and C each accounted for 12% of Nvidia’s quarterly revenue, according to the company’s Form 10-Q. \n\nThe filing also showed that, in the first nine months of fiscal year 2025, sales to Customers B and C each made up 11% of revenue, while a Customer D accounted for 12% of revenue. \n\nAlthough the chipmaker will not disclose the companies, its top customers could likely include Alphabet (GOOGL), Amazon (AMZN), Meta (META), Microsoft (MSFT), and Tesla (TSLA). \n\n","articleSection":"nvidia","keywords":["nvidia","business finance","amazon","meta","jensen huang","tesla","internal revenue service","microsoft","alphabet","american brands","meta platforms"],"publisher":{"@type":"Organization","@context":"http://schema.org","name":"Quartz","url":"https://qz.com","logo":{"@type":"ImageObject","width":500,"url":"https://x.kinja-static.com/assets/images/logos/newsletter/quartz-500px.png"},"sameAs":["https://www.facebook.com/quartznews","https://www.youtube.com/channel/UC9f78Z5hgtDt0n8JWyfBk8Q","https://twitter.com/qz","https://instagram.com/qz"]},"video":[{"@type":"VideoObject","@context":"https://schema.org","name":"Nvidia's record earnings reveal just 3 customers make up 30% of revenue","contentUrl":"https://kinja-otfp.global.ssl.fastly.net/197489/197489_240p,480p,720p,1080p.m3u8","description":"Nvidia finished the fiscal year by delivering record revenue and outlook above expectations for the fourth quarter — and more than doubling its full-year revenue from the previous year.","duration":"PT106S","thumbnailUrl":["https://i.kinja-img.com/image/upload/c_fit,q_80,w_636/17857f9717beb3955012432013aa0ef2.jpg"],"uploadDate":"2025-02-27T16:54:17.352-05:00[America/New_York]"}]}ByBritney NguyenUpdatedThursday 4:57PMWe may earn a commission from links on this page.Nvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkNvidia’s record earnings reveal just 3 customers make up 30% of revenueIn This StoryNVDA+1.66%GOOGL+0.12%AMZN+0.25%META+0.42%MSFT0.00%Nvidia (NVDA+1.66%) finished the fiscal year by delivering record revenue and outlook above expectations for the fourth quarter — and more than doubling its full-year revenue from the previous year.Suggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupTarget's DEI problem, Apple woos Trump, and cheap weight loss drugs: Business news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkview videoNvidia's record earnings reveal just 3 customers make up 30% of revenueSuggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupTarget's DEI problem, Apple woos Trump, and cheap weight loss drugs: Business news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkNvidia's record earnings reveal just 3 customers make up 30% of revenueThe chipmaker reported revenue of $39.3 billion for the fourth quarter of fiscal year 2025 — a 78% increase from the previous year, and above the consensus of $38.1 billion. Meanwhile, Nvidia’s full-year revenue grew 114% year over year to a record $130.5 billion.AdvertisementRelated ContentApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupNvidia’s stock slide puts Apple and Microsoft back on topRelated ContentApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupNvidia’s stock slide puts Apple and Microsoft back on top“We’ve successfully ramped up the massive-scale production of Blackwell AI supercomputers, achieving billions of dollars in sales in its first quarter,” Nvidia CEO Jensen Huang said in a statement, adding that demand for the new chips is “amazing” as companies roll out reasoning AI models.AdvertisementAccording to Nvidia’s 10-K filing, just three anonymous customers made up more than 30% of total revenue for the fiscal year ended in January.Advertisement“Direct Customer A” accounted for 12% of total revenue, while Direct Customers B and C each represented 11%, according to the Securities and Exchange Commission filing. Direct Customer B made up 13% of total revenue for fiscal year 2024, the filing said.All of the sales “were primarily attributable to the Compute & Networking segment,” according to the filing. AdvertisementFor the fiscal third quarter, Nvidia had reported revenue of $35.1 billion — 36% of which came from three unnamed customers. For the three months ended in October, Customers A, B, and C each accounted for 12% of Nvidia’s quarterly revenue, according to the company’s Form 10-Q. The filing also showed that, in the first nine months of fiscal year 2025, sales to Customers B and C each made up 11% of revenue, while a Customer D accounted for 12% of revenue. AdvertisementAlthough the chipmaker will not disclose the companies, its top customers could likely include Alphabet (GOOGL+0.12%), Amazon (AMZN+0.25%), Meta (META+0.42%), Microsoft (MSFT0.00%), and Tesla (TSLA+3.07%). 📬 Sign up for the Daily BriefOur free, fast, and fun briefing on the global economy, delivered every weekday morning.'''
