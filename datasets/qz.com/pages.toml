title = "Bitcoin bleeds 25% in a month, falls under $80,000. What's next?"
description = "Bitcoin could fall to $72,000 as the Trump-driven cryptocurrency rally has faded, a crypto leader says"
full_description = '''{"@type":"NewsArticle","@context":"http://schema.org","url":"https://qz.com/bitcoin-bleeding-despite-trump-bitcoin-etf-sec-coinbase-1851767007","author":[{"@type":"Person","name":"Vinamrata Chaturvedi"}],"headline":"Bitcoin has bled 25% in a month despite Trump. How low can it go?","description":"Bitcoin could fall to $72,000 as the Trump-driven cryptocurrency rally has faded, a crypto leader says","dateline":"02/28/2025 at 10:50","datePublished":"2025-02-28T10:50:00-05:00","dateModified":"2025-02-28T11:01:00-05:00","mainEntityOfPage":{"@type":"WebPage","url":"https://qz.com/bitcoin-bleeding-despite-trump-bitcoin-etf-sec-coinbase-1851767007"},"mentions":[{"@type":"Corporation","@context":"http://schema.org","name":"Coinbase Global Inc","tickerSymbol":"COIN","url":"https://qz.com/quote/COIN"},{"@type":"Corporation","@context":"http://schema.org","name":"Robinhood Markets Inc.","tickerSymbol":"HOOD","url":"https://qz.com/quote/HOOD"}],"image":{"@type":"ImageObject","height":675,"width":1200,"url":"https://i.kinja-img.com/image/upload/c_fill,h_675,pg_1,q_80,w_1200/bc323f6dd95224f1ce6d3274335b0e3e.jpg","thumbnail":{"@type":"ImageObject","height":180,"width":320,"url":"https://i.kinja-img.com/image/upload/c_fill,h_180,pg_1,q_80,w_320/bc323f6dd95224f1ce6d3274335b0e3e.jpg"}},"isAccessibleForFree":"False","hasPart":{"@type":"WebPageElement","isAccessibleForFree":"False","cssSelector":".js_regwalled-content"},"articleBody":"Bitcoin continued its downward slide, falling below $80,000 on Thursday night. The leading crypto is 25% down from its all-time high that was reached just a month ago during Donald Trump’s inauguration.\n\nIt recovered slightly on Friday morning, hovering around $82,000. However, investor sentiment remains pessimistic as the Trump-led crypto rally appears to be over. The prevailing question now is: How much lower can Bitcoin go?\n\n“The worst case scenario would be that Bitcoin would drop to the $72,000-74,000 range,” said Sid Powell, CEO &amp; Co-Founder of Maple, an institutional capital marketplace built on the blockchain.\n\nIn an email to Quartz, Powell explained that, according to technical analysis, a breakdown below a prolonged range typically results in a significant decline.\n\n“If Bitcoin is in the $90,000-1000,000 range, as we’ve seen over the last few months, it would have the potential to slide to $70,000.”\n\nBut why is Bitcoin experiencing such a significant downturn?\n\nThe latest decline may be linked to a crypto hack targeting a Dubai-based exchange named Bybit. On Feb. 21, 2025, attackers — allegedly the North Korean state-sponsored Lazarus Group — stole approximately $1.4 billion in crypto assets from the exchange’s wallet. Adding to market jitters, the recent memecoin scandal involving Argentina’s President Javier Milei has reignited skepticism and negative sentiment among investors, further weighing on the crypto market.\n\nFurthermore, macroeconomic factors are at play, with Bitcoin and the entire crypto market facing pressure from the ongoing tariff war. Amid rising trade tensions, there was a broad risk-off decline across all markets, but, as Powell noted, the crypto market has been hit the hardest.\n\n“There’s a lot of nervousness from investors on how U.S. tariffs could impact the broader landscape and the excitement over the new administration fading now that Trump has been in office for some time,” he added.\n\nBitcoin ETFs continue facing massive outflows\n\nOnce hailed as the most successful exchange-traded funds (ETFs) in history, U.S. Bitcoin ETFs have seen significant withdrawals in recent weeks. Excluding two positive days, they have recorded net outflows totaling $3.7 billion this month. On Tuesday, Feb. 25th, Bitcoin ETFs experienced a record outflow of over $1 billion in a single day.\n\nThis sustained outflow is naturally putting pressure on Bitcoin’s price, signaling that investors are no longer pouring in funds at the same pace as before.\n\nRead more: Bitcoin is better than gold. Here’s why\n\nPerhaps the SEC will bring Bitcoin back on track\n\nPowell believes that the Trump rally has certainly faded and that positive actions from policymakers could help improve the state of the crypto market.\n\nIn recent weeks, the Securities and Exchange Commission (SEC) has emerged as a big supporter of the crypto industry — a shift that seemed unimaginable just a few years ago.\n\nFor example, on Thursday, the SEC stated that most memecoins, such as Dogecoin and Shiba Inu, are not securities under U.S. federal law. The financial watchdog explained that memecoins have limited or no functionality and are “more akin to collectibles.”\n\nHowever, the SEC’s latest stance did little to boost memecoin prices, as negative sentiment weighed on the broader crypto market.\n\nEarlier this month, the SEC, led by Hester Peirce, dropped cases against Coinbase, Robinhood, and other crypto companies that had been accused of selling unregistered securities, marking a notable shift in the regulatory landscape for cryptocurrencies.\n\n“If the SEC continues to loosen its grip and we see more pro-crypto laws put in place, Bitcoin can pull back, and we’ll see another positive moment in the market once again,” he added.\n\n","articleSection":"bitcoin","keywords":["bitcoin","hester peirce","shiba inu","business finance","coinbase","cryptocurrency bubble","donald trump","cryptocurrencies","bitcoin cash","bybit","u s federal","exchange traded fund","sid powell","javier milei","dogecoin","cryptocurrency exchanges"],"publisher":{"@type":"Organization","@context":"http://schema.org","name":"Quartz","url":"https://qz.com","logo":{"@type":"ImageObject","width":500,"url":"https://x.kinja-static.com/assets/images/logos/newsletter/quartz-500px.png"},"sameAs":["https://www.facebook.com/quartznews","https://www.youtube.com/channel/UC9f78Z5hgtDt0n8JWyfBk8Q","https://twitter.com/qz","https://instagram.com/qz"]},"video":[]}ByVinamrata ChaturvediUpdatedFriday 11:01AMWe may earn a commission from links on this page.Image: SOPA Images (Getty Images)In This StoryCOIN+1.68%HOOD+1.48%Bitcoin continued its downward slide, falling below $80,000 on Thursday night. The leading crypto is 25% down from its all-time high that was reached just a month ago during Donald Trump’s inauguration.Suggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkview videoNvidia's record earnings reveal just 3 customers make up 30% of revenueSuggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkNvidia's record earnings reveal just 3 customers make up 30% of revenueIt recovered slightly on Friday morning, hovering around $82,000. However, investor sentiment remains pessimistic as the Trump-led crypto rally appears to be over. The prevailing question now is: How much lower can Bitcoin go?AdvertisementRelated ContentTrump finally signed a crypto executive order. Here's what it meansHow to invest in Bitcoin and crypto — without actually buying itRelated ContentTrump finally signed a crypto executive order. Here's what it meansHow to invest in Bitcoin and crypto — without actually buying it“The worst case scenario would be that Bitcoin would drop to the $72,000-74,000 range,” said Sid Powell, CEO & Co-Founder of Maple, an institutional capital marketplace built on the blockchain.AdvertisementIn an email to Quartz, Powell explained that, according to technical analysis, a breakdown below a prolonged range typically results in a significant decline.Advertisement“If Bitcoin is in the $90,000-1000,000 range, as we’ve seen over the last few months, it would have the potential to slide to $70,000.”But why is Bitcoin experiencing such a significant downturn?The latest decline may be linked to a crypto hack targeting a Dubai-based exchange named Bybit. On Feb. 21, 2025, attackers — allegedly the North Korean state-sponsored Lazarus Group — stole approximately $1.4 billion in crypto assets from the exchange’s wallet. Adding to market jitters, the recent memecoin scandal involving Argentina’s President Javier Milei has reignited skepticism and negative sentiment among investors, further weighing on the crypto market.AdvertisementFurthermore, macroeconomic factors are at play, with Bitcoin and the entire crypto market facing pressure from the ongoing tariff war. Amid rising trade tensions, there was a broad risk-off decline across all markets, but, as Powell noted, the crypto market has been hit the hardest.“There’s a lot of nervousness from investors on how U.S. tariffs could impact the broader landscape and the excitement over the new administration fading now that Trump has been in office for some time,” he added.AdvertisementBitcoin ETFs continue facing massive outflowsOnce hailed as the most successful exchange-traded funds (ETFs) in history, U.S. Bitcoin ETFs have seen significant withdrawals in recent weeks. Excluding two positive days, they have recorded net outflows totaling $3.7 billion this month. On Tuesday, Feb. 25th, Bitcoin ETFs experienced a record outflow of over $1 billion in a single day.AdvertisementThis sustained outflow is naturally putting pressure on Bitcoin’s price, signaling that investors are no longer pouring in funds at the same pace as before.Read more: Bitcoin is better than gold. Here’s whyPerhaps the SEC will bring Bitcoin back on trackPowell believes that the Trump rally has certainly faded and that positive actions from policymakers could help improve the state of the crypto market.AdvertisementIn recent weeks, the Securities and Exchange Commission (SEC) has emerged as a big supporter of the crypto industry — a shift that seemed unimaginable just a few years ago.For example, on Thursday, the SEC stated that most memecoins, such as Dogecoin and Shiba Inu, are not securities under U.S. federal law. The financial watchdog explained that memecoins have limited or no functionality and are “more akin to collectibles.”AdvertisementHowever, the SEC’s latest stance did little to boost memecoin prices, as negative sentiment weighed on the broader crypto market.Earlier this month, the SEC, led by Hester Peirce, dropped cases against Coinbase, Robinhood, and other crypto companies that had been accused of selling unregistered securities, marking a notable shift in the regulatory landscape for cryptocurrencies.Advertisement“If the SEC continues to loosen its grip and we see more pro-crypto laws put in place, Bitcoin can pull back, and we’ll see another positive moment in the market once again,” he added.📬 Sign up for the Daily BriefOur free, fast, and fun briefing on the global economy, delivered every weekday morning.'''
