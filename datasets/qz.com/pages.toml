["https://qz.com/amazon-ai-alexa-plus-prime-virtual-assistant-1851766561"]
title = "Amazon Alexa gets an AI upgrade"
description = "The tech giant announced its generative AI-powered Alexa Plus, which is free for Amazon Prime users or $19.99 a month"
full_description = '''{"@type":"NewsArticle","@context":"http://schema.org","url":"https://qz.com/amazon-ai-alexa-plus-prime-virtual-assistant-1851766561","author":[{"@type":"Person","name":"Britney Nguyen"}],"headline":"Amazon's Alexa finally got its big AI upgrade","description":"The tech giant announced its generative AI-powered Alexa Plus, which is free for Amazon Prime users or $19.99 a month","dateline":"02/26/2025 at 11:32","datePublished":"2025-02-26T11:32:00-05:00","dateModified":"2025-02-26T13:03:00-05:00","mainEntityOfPage":{"@type":"WebPage","url":"https://qz.com/amazon-ai-alexa-plus-prime-virtual-assistant-1851766561"},"mentions":[{"@type":"Corporation","@context":"http://schema.org","name":"Amazon.com Inc.","tickerSymbol":"AMZN","url":"https://qz.com/quote/AMZN"},{"@type":"Corporation","@context":"http://schema.org","name":"Comcast Corporation Class A Common Stock","tickerSymbol":"CMCSA","url":"https://qz.com/quote/CMCSA"},{"@type":"Corporation","@context":"http://schema.org","name":"NVIDIA Corporation","tickerSymbol":"NVDA","url":"https://qz.com/quote/NVDA"}],"image":{"@type":"ImageObject","height":675,"width":1200,"url":"https://i.kinja-img.com/image/upload/c_fill,h_675,pg_1,q_80,w_1200/c6dd324c9f1108a6e97c0a2430c8c2a7.jpg","thumbnail":{"@type":"ImageObject","height":180,"width":320,"url":"https://i.kinja-img.com/image/upload/c_fill,h_180,pg_1,q_80,w_320/c6dd324c9f1108a6e97c0a2430c8c2a7.jpg"}},"isAccessibleForFree":"False","hasPart":{"@type":"WebPageElement","isAccessibleForFree":"False","cssSelector":".js_regwalled-content"},"articleBody":"Amazon’s (AMZN) popular virtual assistant finally got its generative artificial intelligence update.\n\nThe tech giant announced Alexa Plus on Wednesday, which now enables new capabilities such as assisting users with tasks such as shopping for groceries and sending event invites, according to The Verge. The upgraded AI-powered virtual assistant will also be able to memorize personal details about users, Amazon reportedly said, such as eating habits and other interests.\n\nUsers will be able to have conversations with Alexa Plus, which can also take and analyze photos, The Verge reported.\n\n“Every once in a while, a technology comes around and it changes everything,” Panos Panay, senior vice president of devices and services at Amazon, said at an event on Wednesday, according to CNBC (CMCSA). “[Large language models] enter the stage and fundamentally change the way we think about AI...It’s shaken up everything.”\n\nThe Alexa Plus service will be free for Amazon Prime subscribers when it begins rolling out next month, or $19.99 per month for non-Prime members, CNBC reported. Panay told CNBC that the service will be available on “almost every” Alexa device. \n\nDuring Amazon’s third-quarter earnings call in October, Amazon chief executive Andy Jassy said the company was continuing “to rearchitect the brain” of its virtual assistant with a set of next-generation foundation models — or larger models trained on broad, generalized data sets.\n\n“When we first were pursuing Alexa, we had this vision of it being the world’s best personal assistant and people thought that was kind of a crazy idea,” David Fildes, Amazon vice president of investor relations, said. “And I think if you look at what’s happened in generative AI over the last couple of years, I think you’re kind of missing the boat if you don’t believe that’s going to happen. It absolutely is going to happen.”\n\nIn June, Fortune reported that the AI-powered Alexa — which Amazon demoed the previous September and said would be available for a free preview on its Alexa-fitted devices in the U.S. — was not even close to being ready. Former employees told the publication that the company didn’t have enough data nor access to the chips needed to run the large language models (LLM) powering the new version of its virtual assistant. The company also reportedly deprioritized Alexa AI to focus on building generative AI for its cloud computing unit, Amazon Web Services.\n\nAt the time, Amazon said its former employees were incorrect and uninformed on its Alexa AI efforts, and that the Amazon Artificial General Intelligence team had access to both in-house Trainium chips and Nvidia’s (NVDA) chips.\n\n","articleSection":"alexa","keywords":["alexa","amazon","artificial intelligence","andy jassy","microsoft bing","generative artificial intelligence","alexa plus","technology internet","amazon alexa","virtual assistant","amazon web services","nvidia","panos panay","david fildes"],"publisher":{"@type":"Organization","@context":"http://schema.org","name":"Quartz","url":"https://qz.com","logo":{"@type":"ImageObject","width":500,"url":"https://x.kinja-static.com/assets/images/logos/newsletter/quartz-500px.png"},"sameAs":["https://www.facebook.com/quartznews","https://www.youtube.com/channel/UC9f78Z5hgtDt0n8JWyfBk8Q","https://twitter.com/qz","https://instagram.com/qz"]},"video":[]}ByBritney NguyenUpdatedWednesday 1:03PMWe may earn a commission from links on this page.Amazon at CES 2024 in Las Vegas, Nevada on January 10, 2024.Photo: Bridget Bennett/Bloomberg (Getty Images)In This StoryAMZN+0.25%CMCSA+0.95%NVDA+1.66%Amazon’s (AMZN+0.25%) popular virtual assistant finally got its generative artificial intelligence update.Suggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkview videoNvidia's record earnings reveal just 3 customers make up 30% of revenueSuggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkNvidia's record earnings reveal just 3 customers make up 30% of revenueThe tech giant announced Alexa Plus on Wednesday, which now enables new capabilities such as assisting users with tasks such as shopping for groceries and sending event invites, according to The Verge. The upgraded AI-powered virtual assistant will also be able to memorize personal details about users, Amazon reportedly said, such as eating habits and other interests.AdvertisementRelated ContentAmazon wants customers to pay for a supercharged AI AlexaAmazon is launching a new lineup of Alexa Plus companion gadgetsRelated ContentAmazon wants customers to pay for a supercharged AI AlexaAmazon is launching a new lineup of Alexa Plus companion gadgetsUsers will be able to have conversations with Alexa Plus, which can also take and analyze photos, The Verge reported.Advertisement“Every once in a while, a technology comes around and it changes everything,” Panos Panay, senior vice president of devices and services at Amazon, said at an event on Wednesday, according to CNBC (CMCSA+0.95%). “[Large language models] enter the stage and fundamentally change the way we think about AI...It’s shaken up everything.”AdvertisementThe Alexa Plus service will be free for Amazon Prime subscribers when it begins rolling out next month, or $19.99 per month for non-Prime members, CNBC reported. Panay told CNBC that the service will be available on “almost every” Alexa device. During Amazon’s third-quarter earnings call in October, Amazon chief executive Andy Jassy said the company was continuing “to rearchitect the brain” of its virtual assistant with a set of next-generation foundation models — or larger models trained on broad, generalized data sets.Advertisement“When we first were pursuing Alexa, we had this vision of it being the world’s best personal assistant and people thought that was kind of a crazy idea,” David Fildes, Amazon vice president of investor relations, said. “And I think if you look at what’s happened in generative AI over the last couple of years, I think you’re kind of missing the boat if you don’t believe that’s going to happen. It absolutely is going to happen.”In June, Fortune reported that the AI-powered Alexa — which Amazon demoed the previous September and said would be available for a free preview on its Alexa-fitted devices in the U.S. — was not even close to being ready. Former employees told the publication that the company didn’t have enough data nor access to the chips needed to run the large language models (LLM) powering the new version of its virtual assistant. The company also reportedly deprioritized Alexa AI to focus on building generative AI for its cloud computing unit, Amazon Web Services.AdvertisementAt the time, Amazon said its former employees were incorrect and uninformed on its Alexa AI efforts, and that the Amazon Artificial General Intelligence team had access to both in-house Trainium chips and Nvidia’s (NVDA+1.66%) chips.📬 Sign up for the Daily BriefOur free, fast, and fun briefing on the global economy, delivered every weekday morning.'''
