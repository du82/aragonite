ion, increased R&D and SG&A expenses, and higher profit share and royalty expenses.AdvertisementThe company reported a net income of $4.1 billion, a decrease of 39% from the previous year, with diluted earnings per share of $7.56.AdvertisementAmgen's R&D expenses increased by 25% to $6.0 billion, reflecting higher spending on clinical programs and support for marketed products, including those acquired from Horizon.Amgen's balance sheet showed cash and cash equivalents of $12.0 billion as of December 31, 2024. The company repaid $3.6 billion in debt during the year and returned capital to shareholders through $4.8 billion in dividends and $200 million in stock repurchases.AdvertisementThe company continues to face challenges from biosimilar competition, particularly for products like Prolia and XGEVA, with patents expiring in 2025. Amgen is also navigating regulatory and reimbursement pressures, including Medicare price setting under the Inflation Reduction Act.Amgen's strategic focus remains on advancing its innovative pipeline, expanding its manufacturing network, and leveraging its global presence to drive growth. The company is also committed to achieving its environmental sustainability targets by 2027.AdvertisementThis content was summarized by generative artificial intelligence using public filings retrieved from SEC.gov. The original data was derived from the Amgen Inc. annual 10-K report dated February 14, 2025. To report an error, please email earnings@qz.com.📬 Sign up for the Daily BriefOur free, fast, and fun briefing on the global economy, delivered every weekday morning.'''
