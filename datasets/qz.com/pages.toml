title = "Apple sticks to DEI with shareholders' rejection of proposal"
description = '''Investors sided with Apple management, which called diversity "critical" to the company's success'''
full_description = '''{"@type":"NewsArticle","@context":"http://schema.org","url":"https://qz.com/apple-dei-investors-diversity-annual-meeting-vote-1851766357","author":[{"@type":"Person","name":"William Gavin"}],"headline":"Apple shareholders just rejected a proposal to end DEI efforts","description":"Investors sided with Apple management, which called diversity \"critical\" to the company's success","dateline":"02/25/2025 at 11:39","datePublished":"2025-02-25T11:39:00-05:00","dateModified":"2025-02-25T11:45:43-05:00","mainEntityOfPage":{"@type":"WebPage","url":"https://qz.com/apple-dei-investors-diversity-annual-meeting-vote-1851766357"},"mentions":[{"@type":"Corporation","@context":"http://schema.org","name":"Apple Inc.","tickerSymbol":"AAPL","url":"https://qz.com/quote/AAPL"},{"@type":"Corporation","@context":"http://schema.org","name":"Amazon.com Inc.","tickerSymbol":"AMZN","url":"https://qz.com/quote/AMZN"},{"@type":"Corporation","@context":"http://schema.org","name":"Boeing Company","tickerSymbol":"BA","url":"https://qz.com/quote/BA"},{"@type":"Corporation","@context":"http://schema.org","name":"Costco Wholesale Corporation","tickerSymbol":"COST","url":"https://qz.com/quote/COST"},{"@type":"Corporation","@context":"http://schema.org","name":"Deutsche Bank AG","tickerSymbol":"DB","url":"https://qz.com/quote/DB"},{"@type":"Corporation","@context":"http://schema.org","name":"Walt Disney Company","tickerSymbol":"DIS","url":"https://qz.com/quote/DIS"},{"@type":"Corporation","@context":"http://schema.org","name":"Alphabet Inc.","tickerSymbol":"GOOGL","url":"https://qz.com/quote/GOOGL"},{"@type":"Corporation","@context":"http://schema.org","name":"McDonald's Corporation","tickerSymbol":"MCD","url":"https://qz.com/quote/MCD"},{"@type":"Corporation","@context":"http://schema.org","name":"Target Corporation","tickerSymbol":"TGT","url":"https://qz.com/quote/TGT"},{"@type":"Corporation","@context":"http://schema.org","name":"Walmart Inc.","tickerSymbol":"WMT","url":"https://qz.com/quote/WMT"}],"image":{"@type":"ImageObject","height":675,"width":1200,"url":"https://i.kinja-img.com/image/upload/c_fill,h_675,pg_1,q_80,w_1200/711c620b65066b2a34b0a3ce4fef0496.jpg","thumbnail":{"@type":"ImageObject","height":180,"width":320,"url":"https://i.kinja-img.com/image/upload/c_fill,h_180,pg_1,q_80,w_320/711c620b65066b2a34b0a3ce4fef0496.jpg"}},"isAccessibleForFree":"False","hasPart":{"@type":"WebPageElement","isAccessibleForFree":"False","cssSelector":".js_regwalled-content"},"articleBody":"Apple (AAPL) shareholders on Tuesday voted to keep the iPhone maker’s diversity policies, shutting down a conservative think tank’s proposal.\n\nThe technology giant had defended its diversity, equity, and inclusion (DEI) practices ahead of its annual meeting. In a prepared statement, Apple cited its established compliance program and a desire to create a “culture of belonging where everyone can do their best work.” \n\nApple said its practices have been instrumental to its success over the years. The tech giant’s market capitalization is $3.7 trillion, making it the most valuable company in the world. \n\n“We believe that how we conduct ourselves is as critical to Apple’s success as making the best products in the world,” Apple said in a statement.\n\nThe company is one of a few targeted by the self-described conservative think tank the National Center for Public Policy Research, which claimed that DEI ‘poses litigation, reputational and financial risks” to companies and their shareholders. The group estimated that “likely over 50,000&quot; workers were potentially discriminated against because of Apple’s policies, according to a proxy filing.\n\nInvestors took Apple’s side in the fight over DEI. They also followed the company’s lead on the other six proposals brought forward at the meeting. \n\nThe push against DEI programs comes as President Donald Trump’s administration and conservative activists have taken a hard-line stance against such programs. In January, the president directed federal agencies to identify up to nine potential civil compliance investigations of public groups and attempted to ban contracts for implementing “illegal DEI” programs.\n\nAbout 20% of companies in the S&amp;P 100 have retreated from DEI commitments, Bloomberg News reported. Amazon (AMZN), Google-parent (GOOGL) Alphabet, Target (TGT), McDonald’s (MCD), Walmart (WMT), Boeing (BA), Walt Disney Co. (DIS), and several others have made such commitments, sometimes for fear of a boycott from conservative consumers. \n\nApple joins the ranks of a handful of other companies that have continued to defend their diversity policies. \n\nCostco (COST) shareholders overwhelmingly voted against a measure by the National Center for Public Policy Research last month requesting a report on the risks of maintaining DEI initiatives. Deutsche Bank AG (DB) CEO Christian Sewing recently said his firm is “firmly behind” diversity programs, while McKinsey &amp; Co. said it would prioritize diversity.\n\n","articleSection":"apple","keywords":["apple","business finance","walt disney co","corporate social responsibility","diversity","identity politics","iphone","donald trump","costco","mckinsey co","boeing","technology internet","multiculturalism","diversity equity and inclusion","deutsche bank ag","walmart","christian sewing","google","target","alphabet","environmentalism","mcdonalds","affirmative action","apple inc"],"publisher":{"@type":"Organization","@context":"http://schema.org","name":"Quartz","url":"https://qz.com","logo":{"@type":"ImageObject","width":500,"url":"https://x.kinja-static.com/assets/images/logos/newsletter/quartz-500px.png"},"sameAs":["https://www.facebook.com/quartznews","https://www.youtube.com/channel/UC9f78Z5hgtDt0n8JWyfBk8Q","https://twitter.com/qz","https://instagram.com/qz"]},"video":[]}ByWilliam GavinUpdatedTuesday 11:45AMWe may earn a commission from links on this page.ApplePhoto: Michael Nagle/Bloomberg (Getty Images)In This StoryAAPL+0.89%AMZN+0.25%GOOGL+0.12%TGT+1.04%MCD-1.06%Apple (AAPL+0.89%) shareholders on Tuesday voted to keep the iPhone maker’s diversity policies, shutting down a conservative think tank’s proposal.Suggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkview videoNvidia's record earnings reveal just 3 customers make up 30% of revenueSuggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkNvidia's record earnings reveal just 3 customers make up 30% of revenueThe technology giant had defended its diversity, equity, and inclusion (DEI) practices ahead of its annual meeting. In a prepared statement, Apple cited its established compliance program and a desire to create a “culture of belonging where everyone can do their best work.” AdvertisementRelated ContentTrump to Apple: Ditch DEIApple faces a DEI backlashRelated ContentTrump to Apple: Ditch DEIApple faces a DEI backlashApple said its practices have been instrumental to its success over the years. The tech giant’s market capitalization is $3.7 trillion, making it the most valuable company in the world. Advertisement“We believe that how we conduct ourselves is as critical to Apple’s success as making the best products in the world,” Apple said in a statement.AdvertisementThe company is one of a few targeted by the self-described conservative think tank the National Center for Public Policy Research, which claimed that DEI ‘poses litigation, reputational and financial risks” to companies and their shareholders. The group estimated that “likely over 50,000" workers were potentially discriminated against because of Apple’s policies, according to a proxy filing.Investors took Apple’s side in the fight over DEI. They also followed the company’s lead on the other six proposals brought forward at the meeting. AdvertisementThe push against DEI programs comes as President Donald Trump’s administration and conservative activists have taken a hard-line stance against such programs. In January, the president directed federal agencies to identify up to nine potential civil compliance investigations of public groups and attempted to ban contracts for implementing “illegal DEI” programs.About 20% of companies in the S&P 100 have retreated from DEI commitments, Bloomberg News reported. Amazon (AMZN+0.25%), Google-parent (GOOGL+0.12%) Alphabet, Target (TGT+1.04%), McDonald’s (MCD-1.06%), Walmart (WMT+1.39%), Boeing (BA+0.17%), Walt Disney Co. (DIS+1.91%), and several others have made such commitments, sometimes for fear of a boycott from conservative consumers. AdvertisementApple joins the ranks of a handful of other companies that have continued to defend their diversity policies. Costco (COST+1.20%) shareholders overwhelmingly voted against a measure by the National Center for Public Policy Research last month requesting a report on the risks of maintaining DEI initiatives. Deutsche Bank AG (DB-0.19%) CEO Christian Sewing recently said his firm is “firmly behind” diversity programs, while McKinsey & Co. said it would prioritize diversity.📬 Sign up for the Daily BriefOur free, fast, and fun briefing on the global economy, delivered every weekday morning.'''
