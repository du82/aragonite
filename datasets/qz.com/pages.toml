["https://qz.com/emails/daily-brief/1851766697/mcdonalds-eggs-tesla-trump-alexa-bitcoin-daily-brief"]
title = "McDonald's is keeping eggs cheap, Tesla stock slips"
description = "McDonalds won't charge extra for eggs, yet"
full_description = '''{"@type":"NewsArticle","@context":"http://schema.org","url":"https://qz.com/emails/daily-brief/1851766697/mcdonalds-eggs-tesla-trump-alexa-bitcoin-daily-brief","author":[{"@type":"Person","name":"Bruce Gil"}],"headline":"🌏 McDonald's is keeping eggs cheap","description":"Plus, Tesla stock crashed out","dateline":"02/27/2025 at 05:55","datePublished":"2025-02-27T05:55:00-05:00","dateModified":"2025-02-27T05:55:00-05:00","mainEntityOfPage":{"@type":"WebPage","url":"https://qz.com/emails/daily-brief/1851766697/mcdonalds-eggs-tesla-trump-alexa-bitcoin-daily-brief"},"image":{"@type":"ImageObject","height":675,"width":1200,"url":"https://i.kinja-img.com/image/upload/c_fill,h_675,pg_1,q_80,w_1200/b940ee452c6cfffe0224cf71a19b245e.jpg","thumbnail":{"@type":"ImageObject","height":180,"width":320,"url":"https://i.kinja-img.com/image/upload/c_fill,h_180,pg_1,q_80,w_320/b940ee452c6cfffe0224cf71a19b245e.jpg"}},"isAccessibleForFree":"False","hasPart":{"@type":"WebPageElement","isAccessibleForFree":"False","cssSelector":".js_regwalled-content"},"articleBody":"Good morning, Quartz readers!\n\nHere’s what you need to know\n\nMcDonald’s won’t charge extra for eggs, yet. The restaurant chain said it won’t add surcharges on eggs, even as others do and prices hit record highs.\n\nMeanwhile, Trump will shell out $1 billion to solve the egg crisis. The administration just announced its five-point plan to lower prices. \n\nTesla and GM car owners are loyal. New research from S&amp;P Global revealed that the two car makers have the highest brand loyalty. \n\nBitcoin’s downward trend worsens. Bitcoin ETFs saw a record $1 billion outflow in just one day.\n\nAmazon’s Alexa got an AI update. The tech giant unveiled Alexa Plus, a generative AI upgrade, that’s free for Prime users or $19.99/month.\n\niPhone bug types ‘Trump’ in place of ‘racist.’ Apple is fixing the bug after it went viral on social media. \n\nTesla stock is crashing out\n\nTesla stock surged after President Donald Trump’s election due to his ties with CEO Elon Musk, but those gains have largely vanished.\n\nThe stock closed at $302.80 on Tuesday, down 37% from its mid-December peak of $479.86. This marks Tesla’s lowest close since Nov. 7, two days after the election, bringing its market cap below $1 trillion. While the stock had been slowly declining, the latest drop was partly due to a sales slump abroad.\n\nHow much did Tesla sales fall? Quartz’s William Gavin breaks it down.\n\nAI is transforming the world\n\nTechnological disruptions will speed up in the next five years as AI adoption grows, requiring more resources, especially electricity and infrastructure, but possibly less labor, according to Bank of America Institute’s “The World in 2030, Part I” report.\n\nUp to 2 billion jobs could be lost globally, prompting a massive re-skilling effort for up to a third of the workforce. And People may spend more time on social media alone. \n\nHow else will AI change the world in 2030? Quartz’s Josh Fellman has the details.\n\nMore from Quartz\n\n💳 Trump sees Apple spending millions on ‘gold cards’ for immigrants\n\n🐣 Egg prices aren’t done soaring. Here’s what to know\n\n✈️ A man spent hours next to a corpse on a plane after the passenger died mid-flight\n\n🍎 Trump to Apple: Ditch DEI\n\n🚘 Trump says tariffs will help car companies. Here’s why he’s wrong\n\n📈 Nvidia, Tesla, Salesforce, Super Micro Computer, AppLovin, Axon, Intuit, NRG: Stocks to watch today\n\n💾 Super Micro Computer stock soars 16% as it avoids a Nasdaq de-listing\n\n🏡 10 common pitfalls first-time homebuyers should watch out for\n\n🎞️ The 8 highest-grossing animated movies ever made\n\n😃 10 colleges with the happiest students in America\n\nDid you know we have two premium weekend emails, too? One gives you analysis on the week’s news, and one provides the best reads from Quartz and elsewhere to get your week started right. Become a member or give a membership as a gift!\n\nOur best wishes on a safe start to the day. Send any news, comments, eggs, or Alexas to talk@qz.com. Today’s Daily Brief was brought to you by Bruce Gil and Audrey McNamara.\n\n","articleSection":"mcdonald s","keywords":["mcdonald s","musk","applovin","iphone","apple","bruce gil","big tech","nvidia","alexa plus","tesla model s","william gavin","intuit","nikola tesla","audrey mcnamara","josh fellman","tesla","donald trump","tesla inc","super micro computer","elon musk","salesforce","amazon alexa"],"publisher":{"@type":"Organization","@context":"http://schema.org","name":"Quartz","url":"https://qz.com","logo":{"@type":"ImageObject","width":500,"url":"https://x.kinja-static.com/assets/images/logos/newsletter/quartz-500px.png"},"sameAs":["https://www.facebook.com/quartznews","https://www.youtube.com/channel/UC9f78Z5hgtDt0n8JWyfBk8Q","https://twitter.com/qz","https://instagram.com/qz"]},"video":[]}This story was published on our Quartz Daily Brief newsletter, the most important and interesting news from the global economy. Inoculate yourself against ignorance with intel, charts, and surprising discoveries.ByBruce GilPublishedThursday 5:55AMWe may earn a commission from links on this page.Image: Justin Sullivan / Staff (Getty Images)Good morning, Quartz readers!Here’s what you need to knowMcDonald’s won’t charge extra for eggs, yet. The restaurant chain said it won’t add surcharges on eggs, even as others do and prices hit record highs.Suggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkview videoNvidia's record earnings reveal just 3 customers make up 30% of revenueSuggested ReadingThe best golden visas, the happies