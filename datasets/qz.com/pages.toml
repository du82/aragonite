title = "Apple to invest $500 billion in the U.S. with focus on AI"
description = '"We are bullish on the future of American innovation," Apple CEO Tim Cook said'
full_description = '''{"@type":"NewsArticle","@context":"http://schema.org","url":"https://qz.com/apple-invest-billions-ai-ceo-tim-cook-data-center-1851766070","author":[{"@type":"Person","name":"William Gavin"}],"headline":"Apple will invest $500 billion in the U.S. with a focus on AI","description":"\"We are bullish on the future of American innovation,\" Apple CEO Tim Cook said","dateline":"02/24/2025 at 07:46","datePublished":"2025-02-24T07:46:00-05:00","dateModified":"2025-02-24T08:32:00-05:00","mainEntityOfPage":{"@type":"WebPage","url":"https://qz.com/apple-invest-billions-ai-ceo-tim-cook-data-center-1851766070"},"mentions":[{"@type":"Corporation","@context":"http://schema.org","name":"Apple Inc.","tickerSymbol":"AAPL","url":"https://qz.com/quote/AAPL"},{"@type":"Corporation","@context":"http://schema.org","name":"Alphabet Inc.","tickerSymbol":"GOOGL","url":"https://qz.com/quote/GOOGL"},{"@type":"Corporation","@context":"http://schema.org","name":"Microsoft Corporation","tickerSymbol":"MSFT","url":"https://qz.com/quote/MSFT"},{"@type":"Corporation","@context":"http://schema.org","name":"Oracle Corporation","tickerSymbol":"ORCL","url":"https://qz.com/quote/ORCL"},{"@type":"Corporation","@context":"http://schema.org","name":"SoftBank Group Corp. ADR","tickerSymbol":"SFTBY","url":"https://qz.com/quote/SFTBY"},{"@type":"Corporation","@context":"http://schema.org","name":"Tesla Inc.","tickerSymbol":"TSLA","url":"https://qz.com/quote/TSLA"},{"@type":"Corporation","@context":"http://schema.org","name":"Taiwan Semiconductor Manufacturing Company Ltd.","tickerSymbol":"TSM","url":"https://qz.com/quote/TSM"}],"image":{"@type":"ImageObject","height":675,"width":1200,"url":"https://i.kinja-img.com/image/upload/c_fill,h_675,pg_1,q_80,w_1200/4ea5710e69d6e28ec7e6182cb0d9dc5b.jpg","thumbnail":{"@type":"ImageObject","height":180,"width":320,"url":"https://i.kinja-img.com/image/upload/c_fill,h_180,pg_1,q_80,w_320/4ea5710e69d6e28ec7e6182cb0d9dc5b.jpg"}},"isAccessibleForFree":"False","hasPart":{"@type":"WebPageElement","isAccessibleForFree":"False","cssSelector":".js_regwalled-content"},"articleBody":"Apple (AAPL) said Monday that it will invest $500 billion in the United States over the next four years, with a focus on supporting domestic manufacturing and artificial intelligence. \n\nThe Cupertino, California-based technology giant plans to open a 250,000-square-foot manufacturing plant in 2026 that will produce servers, hire thousands of workers across a variety of fields, and launch a new education initiative. Apple also said it was committed to expanding its data centers across the U.S., which are vital for its ambitious AI plans.\n\n“We are bullish on the future of American innovation, and we’re proud to build on our long-standing U.S. investments with this $500 billion commitment to our country’s future,” Apple CEO Tim Cook said in a statement. “And we’ll keep working with people and companies across this country to help write an extraordinary new chapter in the history of American innovation.”\n\nWhile Apple’s announcement made no mention of President Donald Trump, the investments would occur over the length of his second term in office. Trump quickly followed Apple’s announcement by writing on Truth Social, his social media platform, that Apple “wouldn’t be investing 10 cents” without “faith in what we are doing.”\n\n“Thank you Tim Cook and Apple,” he added with three exclamation points.\n\nApple said its $500 billion commitment is comprised of its work with domestic suppliers, infrastructure for Apple Intelligence, corporate facilities, and work for its Apple TV+ streaming network across 20 states. It also includes the 164,000 full-time workers it directly employs.\n\nThe company plans to double its U.S. Advanced Manufacturing Fund to $10 billion. That includes a multibillion-dollar investment in advanced silicon manufacturing in Taiwan Semiconductor Manufacturing Company’s (TSM) Fab 21 plant in Arizona, which Apple said began making its chips in January. \n\nSome 20,000 people are expected to be hired by Apple over the next four years across its research and development, silicon engineering, and AI-focused teams. The company said it will also open an “Apple Manufacturing Academy” in Detroit, offering free in-person and online classes to train workers on AI and manufacturing strategies.\n\nApple’s planned $500 billion investment is the second major tech-focused spending commitment announced since Trump took office. Companies including SoftBank (SFTBY), Oracle (ORCL), OpenAI, and Microsoft (MSFT) are working together on a $500 billion initiative named Stargate to build new AI infrastructure for OpenAI.\n\nAlthough Stargate was announced at the White House and Apple’s plans were not, the move is clearly meant to dovetail with Trump’s themes of investing in domestic work, according to Wedbush Securities analyst Dan Ives. \n\nCook enjoyed a relatively stable relationship with Trump during his first term, occasionally winning the president’s praise. Last month, he donated to and attended Trump’s inauguration, standing alongside several other major tech leaders include Tesla’s (TSLA) Elon Musk and Google’s (GOOGL) Sundar Pichai. \n\nIn 2019, after Cook convinced Trump to give Apple an exemption from a series of tariffs affecting Chinese imports, Cook gifted the then-president with one of the first Mac Pros built at its new U.S. facility. The company is now facing a potential investigation from China’s antitrust watchdog as part of Beijing’s response to Trump’s tariffs that went into effect earlier in February. \n\n“Cook continues to prove that he is 10% politician and 90% CEO,” Ives wrote, noting that he will use his global connections to try and ensure “smoother waters” for Apple as Trump pursues his trade war. \n\n","articleSection":"apple","keywords":["apple","business finance","openai","tim cook","apple intelligence","apple manufacturing","tsmc","microsoft","american brands","elon musk","softbank","technology internet","archos tv portable video player pvp","dan ives","sundar pichai","softbank group","stargate llc","second presidency of donald trump","donald trump","steve jobs","taiwan semiconductor manufacturing company","apple inc","oracle","apple store"],"publisher":{"@type":"Organization","@context":"http://schema.org","name":"Quartz","url":"https://qz.com","logo":{"@type":"ImageObject","width":500,"url":"https://x.kinja-static.com/assets/images/logos/newsletter/quartz-500px.png"},"sameAs":["https://www.facebook.com/quartznews","https://www.youtube.com/channel/UC9f78Z5hgtDt0n8JWyfBk8Q","https://twitter.com/qz","https://instagram.com/qz"]},"video":[{"@type":"VideoObject","@context":"https://schema.org","name":"Apple’s $500 billion bet on America: AI, factories, and thousands of jobs","contentUrl":"https://kinja-otfp.global.ssl.fastly.net/197484/197484_240p,480p,720p,1080p.m3u8","description":"Apple said Monday that it will invest $500 billion in the United States over the next four years, with a focus on supporting domestic manufacturing and artificial intelligence.","duration":"PT137S","thumbnailUrl":["https://i.kinja-img.com/image/upload/c_fit,q_80,w_636/f0dd21bcfc5ad281cb3743d86051a172.jpg"],"uploadDate":"2025-02-24T11:49:39.354-05:00[America/New_York]"}]}ByWilliam GavinUpdatedMonday 8:32AMWe may earn a commission from links on this page.Apple’s $500 billion bet on America: AI, factories, and thousands of jobs CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkApple’s $500 billion bet on America: AI, factories, and thousands of jobsIn This StoryAAPL+0.89%TSM-1.62%SFTBY-2.06%ORCL-0.84%MSFT0.00%Apple (AAPL+0.89%) said Monday that it will invest $500 billion in the United States over the next four years, with a focus on supporting domestic manufacturing and artificial intelligence. Suggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkview videoNvidia's record earnings reveal just 3 customers make up 30% of revenueSuggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkNvidia's record earnings reveal just 3 customers make up 30% of revenueThe Cupertino, California-based technology giant plans to open a 250,000-square-foot manufacturing plant in 2026 that will produce servers, hire thousands of workers across a variety of fields, and launch a new education initiative. Apple also said it was committed to expanding its data centers across the U.S., which are vital for its ambitious AI plans.AdvertisementRelated ContentApple just became the first company ever to hit a $3.5 trillion market capDonald Trump says Tim Cook is a better Apple CEO than Steve JobsRelated ContentApple just became the first company ever to hit a $3.5 trillion market capDonald Trump says Tim Cook is a better Apple CEO than Steve Jobs“We are bullish on the future of American innovation, and we’re proud to build on our long-standing U.S. investments with this $500 billion commitment to our country’s future,” Apple CEO Tim Cook said in a statement. “And we’ll keep working with people and companies across this country to help write an extraordinary new chapter in the history of American innovation.”AdvertisementWhile Apple’s announcement made no mention of President Donald Trump, the investments would occur over the length of his second term in office. Trump quickly followed Apple’s announcement by writing on Truth Social, his social media platform, that Apple “wouldn’t be investing 10 cents” without “faith in what we are doing.”Advertisement“Thank you Tim Cook and Apple,” he added with three exclamation points.Apple CEO Tim Cook laughs during the inauguration of President Donald Trump on January 20, 2025.Photo: Julia Demaree Nikhinson/Pool/AFP (Getty Images)AdvertisementApple said its $500 billion commitment is comprised of its work with domestic suppliers, infrastructure for Apple Intelligence, corporate facilities, and work for its Apple TV+ streaming network across 20 states. It also includes the 164,000 full-time workers it directly employs.The company plans to double its U.S. Advanced Manufacturing Fund to $10 billion. That includes a multibillion-dollar investment in advanced silicon manufacturing in Taiwan Semiconductor Manufacturing Company’s (TSM-1.62%) Fab 21 plant in Arizona, which Apple said began making its chips in January. AdvertisementSome 20,000 people are expected to be hired by Apple over the next four years across its research and development, silicon engineering, and AI-focused teams. The company said it will also open an “Apple Manufacturing Academy” in Detroit, offering free in-person and online classes to train workers on AI and manufacturing strategies.Apple’s planned $500 billion investment is the second major tech-focused spending commitment announced since Trump took office. Companies including SoftBank (SFTBY-2.06%), Oracle (ORCL-0.84%), OpenAI, and Microsoft (MSFT0.00%) are working together on a $500 billion initiative named Stargate to build new AI infrastructure for OpenAI.AdvertisementAlthough Stargate was announced at the White House and Apple’s plans were not, the move is clearly meant to dovetail with Trump’s themes of investing in domestic work, according to Wedbush Securities analyst Dan Ives. Cook enjoyed a relatively stable relationship with Trump during his first term, occasionally winning the president’s praise. Last month, he donated to and attended Trump’s inauguration, standing alongside several other major tech leaders include Tesla’s (TSLA+3.07%) Elon Musk and Google’s (GOOGL+0.12%) Sundar Pichai. AdvertisementIn 2019, after Cook convinced Trump to give Apple an exemption from a series of tariffs affecting Chinese imports, Cook gifted the then-president with one of the first Mac Pros built at its new U.S. facility. The company is now facing a potential investigation from China’s antitrust watchdog as part of Beijing’s response to Trump’s tariffs that went into effect earlier in February. “Cook continues to prove that he is 10% politician and 90% CEO,” Ives wrote, noting that he will use his global connections to try and ensure “smoother waters” for Apple as Trump pursues his trade war. 📬 Sign up for the Daily BriefOur free, fast, and fun briefing on the global economy, delivered every weekday morning.'''
