["https://qz.com/elon-musk-doge-memecoin-crypto-joe-rogan-sec-trump-1851767112"]
title = "Dogecoin fan Elon Musk says ‘don’t bet the farm’ on meme coins"
description = 'Meme-coin launches tend to be vulnerable to "pump and dump" schemes'
full_description = '''{"@type":"NewsArticle","@context":"http://schema.org","url":"https://qz.com/elon-musk-doge-memecoin-crypto-joe-rogan-sec-trump-1851767112","author":[{"@type":"Person","name":"William Gavin"}],"headline":"Dogecoin fan Elon Musk says ‘don’t bet the farm’ on meme coins","description":"Meme-coin launches tend to be vulnerable to \"pump and dump\" schemes","dateline":"02/28/2025 at 16:14","datePublished":"2025-02-28T16:14:00-05:00","dateModified":"2025-02-28T16:57:52-05:00","mainEntityOfPage":{"@type":"WebPage","url":"https://qz.com/elon-musk-doge-memecoin-crypto-joe-rogan-sec-trump-1851767112"},"image":{"@type":"ImageObject","height":675,"width":1200,"url":"https://i.kinja-img.com/image/upload/c_fill,h_675,pg_1,q_80,w_1200/3a268aa31eb62e15deec756be521f78f.png","thumbnail":{"@type":"ImageObject","height":180,"width":320,"url":"https://i.kinja-img.com/image/upload/c_fill,h_180,pg_1,q_80,w_320/3a268aa31eb62e15deec756be521f78f.png"}},"isAccessibleForFree":"False","hasPart":{"@type":"WebPageElement","isAccessibleForFree":"False","cssSelector":".js_regwalled-content"},"articleBody":"Elon Musk may be known as one of Dogecoin’s biggest fans, even naming his Department of Government Efficiency after the memecoin. But he doesn’t think everyone should spend a lot of cash on them. \n\nThe topic of meme coins — cryptocurrencies that are based on viral memes, trends, and pop culture references — came up during a Friday interview with podcaster Joe Rogan. During an exchange, both men compared buying the tokens to gambling in a casino, with Rogan expressing disbelief that meme coins are “still legal.” \n\n“It is so bananas that people dump real money into these coins and then you can just pump them up and sell them,” Rogan said on the Joe Rogan Experience podcast, with Musk comparing buying and selling meme coins to playing musical chairs. \n\n“If you expect to win at meme coins, you’re being foolish. You’re not gonna win at meme coins,” Musk said. “If you want to have some fun, then play with meme coins... just don’t bet the farm on a meme coin.”\n\nMeme coins are usually designed to capitalize on social media trends, are often worth just cents or fractions of a cent, and tend to be highly volatile. Often, such cryptocurrencies are used by their creators to make a quick buck through what’s called a “pump and dump” scheme, where prices are artificially inflated before major sell-offs that leave late investors at a loss. \n\nIn recent months, several meme coins have gained short-term popularity, only to crash soon after. A popular type of memecoin is the celebrity meme coin, which tends to give insiders a quick buck and leave outsiders holding the bag. \n\nInfluencer Haliey Welch launched a “Hawk Tuah” coin, named after her own viral meme, in December. The coin reached a $490 million valuation before quickly falling to $29.1 million. As of Friday, Hawk Tuah coin has a $15,000 market cap.\n\nMore recently, President Donald Trump and First Lady Melania Trump launched $Trump and $Melania, Argentinian President Javier Millei backed $Libra, and Central African Republic President Faustin-Archange Touadéra debuted $Car. The value of each has tanked over the past month, leading some in the crypto industry to declare an end to the “meme coin boom.”\n\n“People get shocked that somebody pumped and dumped,” Rogan said, mocking people who attempt to cash in on meme coins but fail to make a profit. “It’s just weird that it’s legal still.”\n\nThe Securities and Exchange Commission on Thursday said that most meme coins “are akin to collectibles” and do not qualify as securities. As a result, neither meme coin buyers nor holders are protected by federal securities laws. However, the agency said it would still examine products it believes could be mislabeled as a meme coin to avoid regulation “by disguising a product that otherwise would constitute a security.”\n\n\n","articleSection":"meme coins","keywords":["meme coins","elon musk","welch","melania trump","trump","hawk tuah","cryptocurrencies","hawk tuah","haliey welch","the joe rogan experience","doge","faustin archange touadera","joe rogan","donald trump","fads and trends","javier millei","internet meme"],"publisher":{"@type":"Organization","@context":"http://schema.org","name":"Quartz","url":"https://qz.com","logo":{"@type":"ImageObject","width":500,"url":"https://x.kinja-static.com/assets/images/logos/newsletter/quartz-500px.png"},"sameAs":["https://www.facebook.com/quartznews","https://www.youtube.com/channel/UC9f78Z5hgtDt0n8JWyfBk8Q","https://twitter.com/qz","https://instagram.com/qz"]},"video":[]}ByWilliam GavinPublishedFriday 4:14PMWe may earn a commission from links on this page.Podcaster Joe Rogan interviewed Tesla and SpaceX CEO Elon Musk, a senior advisor to President Donald Trump, on February 28, 2025.Screenshot: Joe Rogan Experience/YouTubeElon Musk may be known as one of Dogecoin’s biggest fans, even naming his Department of Government Efficiency after the memecoin. But he doesn’t think everyone should spend a lot of cash on them. Suggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkview videoNvidia's record earnings reveal just 3 customers make up 30% of revenueSuggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkNvidia's record earnings reveal just 3 customers make up 30% of revenueThe topic of meme coins — cryptocurrencies that are based on viral memes, trends, and pop culture references — came up during a Friday interview with podcaster Joe Rogan. During an exchange, both men compared buying the tokens to gambling in a casino, with Rogan expressing disbelief that meme coins are “still legal.” AdvertisementRelated ContentBitcoin falls below $90,000 as the Trump-fueled crypto boom fadesLet's talk about the time Elon Musk discussed being an 'illegal immigrant'Related ContentBitcoin falls below $90,000 as the Trump-fueled crypto boom fadesLet's talk about the time Elon Musk discussed being an 'illegal immigrant'“It is so bananas that people dump real money into these coins and then you can just pump them up and sell them,” Rogan said on the Joe Rogan Experience podcast, with Musk comparing buying and selling meme coins to playing musical chairs. Advertisement“If you expect to win at meme coins, you’re being foolish. You’re not gonna win at meme coins,” Musk said. “If you want to have some fun, then play with meme coins... just don’t bet the farm on a meme coin.”AdvertisementMeme coins are usually designed to capitalize on social media trends, are often worth just cents or fractions of a cent, and tend to be highly volatile. Often, such cryptocurrencies are used by their creators to make a quick buck through what’s called a “pump and dump” scheme, where prices are artificially inflated before major sell-offs that leave late investors at a loss. In recent months, several meme coins have gained short-term popularity, only to crash soon after. A popular type of memecoin is the celebrity meme coin, which tends to give insiders a quick buck and leave outsiders holding the bag. AdvertisementInfluencer Haliey Welch launched a “Hawk Tuah” coin, named after her own viral meme, in December. The coin reached a $490 million valuation before quickly falling to $29.1 million. As of Friday, Hawk Tuah coin has a $15,000 market cap.More recently, President Donald Trump and First Lady Melania Trump launched $Trump and $Melania, Argentinian President Javier Millei backed $Libra, and Central African Republic President Faustin-Archange Touadéra debuted $Car. The value of each has tanked over the past month, leading some in the crypto industry to declare an end to the “meme coin boom.”Advertisement“People get shocked that somebody pumped and dumped,” Rogan said, mocking people who attempt to cash in on meme coins but fail to make a profit. “It’s just weird that it’s legal still.”The Securities and Exchange Commission on Thursday said that most meme coins “are akin to collectibles” and do not qualify as securities. As a result, neither meme coin buyers nor holders are protected by federal securities laws. However, the agency said it would still examine products it believes could be mislabeled as a meme coin to avoid regulation “by disguising a product that otherwise would constitute a security.”📬 Sign up for the Daily BriefOur free, fast, and fun briefing on the global economy, delivered every weekday morning.'''
