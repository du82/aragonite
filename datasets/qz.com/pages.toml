["https://qz.com/charles-schwab-smart-investing-1851765299"]
title = "Why investors aren't acting bearish, according to a strategist"
description = "Fear is rising, but Schwab's senior investment strategist Kevin Gordon explains why stock bets are bigger than ever"
full_description = "Kevin Gordon, Director and Senior Investment Strategist at Charles Schwab (SCHW), spoke with Quartz for the latest installment of our “Smart Investing” video series. Watch the interview above and check out the transcript below. The transcript of this conversation has been lightly edited for length and clarity. ANDY MILLS (AM): The Wall Street Journal published an article about a survey showing that investors haven’t been this pessimistic about stocks since 2023. Are you seeing this data over at Schwab? KEVIN GORDON (KG): So not reflected to the extent that that survey from the American Association of Individual Investors is showing. That is mostly, I think, reflective of what’s going on geopolitically from a trade war, tariff war perspective, and maybe to some extent from an immigration perspective. And we’ve seen a little bit of a rolling back in ETF flows specifically in the equity market, which is what I cover, but not to the extreme in terms of the spike in bearishness that that particular survey is citing. I will say what’s been really interesting in this post-pandemic era is the swings in attitudinal sentiment are much wider and much more skittish than what you would see on the behavioral side of things. So since the bear market ended in 2022, we really haven’t seen this massive shift in equity market positioning. If anything, the exposures kind of crept higher over time. In some metrics, we’re at the most exposed in terms of American investors most exposed to equities that we’ve ever been, so it’s not necessarily being reflected in some of the surveys that you cite, but I think to some extent if you do start to see, or at least continue to see a pickup in bearishness, and if there is a more sustained level of bearishness, then you could probably start to see that at some point being reflected in equity market positioning. I think the bigger story is kind of being told at the sector level and how much of that is more rotation versus pulling out of equities altogether. There’s been a much more interesting shift at play where there’s been more outflows from tech and tech-related areas, like communication services, to some extent consumer discretionary, and more going into areas like financials and more cyclical-dominated areas in parts of the market."
