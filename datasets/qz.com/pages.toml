["https://qz.com/delmonicos-eggs-benedict-price-sexier-1851766679"]
title = "$52 Eggs Benedict is not for anyone worried about egg prices"
description = 'The rising cost of eggs makes them "sexier" for guests at high end establishments, explained one restaurateur'
full_description = '''{"@type":"NewsArticle","@context":"http://schema.org","url":"https://qz.com/delmonicos-eggs-benedict-price-sexier-1851766679","author":[{"@type":"Person","name":"Madeline Fitzgerald"}],"headline":"This $52 Eggs Benedict includes lobster, caviar, and truffles — and it's not for anyone worried about egg pric","description":"The rising cost of eggs makes them \"sexier\" for guests at high end establishments, explained one restaurateur","dateline":"02/27/2025 at 05:00","datePublished":"2025-02-27T05:00:00-05:00","dateModified":"2025-02-27T05:00:09-05:00","mainEntityOfPage":{"@type":"WebPage","url":"https://qz.com/delmonicos-eggs-benedict-price-sexier-1851766679"},"image":{"@type":"ImageObject","height":675,"width":1200,"url":"https://i.kinja-img.com/image/upload/c_fill,h_675,pg_1,q_80,w_1200/059ad9c37702a13777f7f41ec2b73b52.jpg","thumbnail":{"@type":"ImageObject","height":180,"width":320,"url":"https://i.kinja-img.com/image/upload/c_fill,h_180,pg_1,q_80,w_320/059ad9c37702a13777f7f41ec2b73b52.jpg"}},"isAccessibleForFree":"False","hasPart":{"@type":"WebPageElement","isAccessibleForFree":"False","cssSelector":".js_regwalled-content"},"articleBody":"As egg prices surge across the country, many home cooks are doing without the kitchen staple. But at Delmonico’s, the birthplace of Eggs Benedict, customers are more excited than ever to try new egg dishes.\n\n“Eggs have become sexier now that they’re more expensive,” Dennis Turcinovic, owner and managing partner of Delmonico’s Hospitality Group, told Quartz.\n\nEggs are so sexy, in fact, that the restaurant is now launching a $52 Royal Eggs Benedict dish featuring Maine lobster, black truffle, and Ossetra caviar. This meal will be available on the menu alongside the restaurant’s $27 classic Eggs Benedict. Prior to its addition to the current menu, Delmonico’s occasionally served the Royal variation for brunch and always kept the dish available as a secret menu item.\n\nThis promotion comes as egg shortages and rising prices remain top of mind for American consumers. The USDA said combined retail egg prices surged 13.8% in January after an 8.4% rise in December. The price of a dozen large grade A eggs reached a record $4.95 in January, up over 96% from just $2.52 a year ago, according to data released earlier this month by the Bureau of Labor Statistics.\n\nThe rising cost is largely due to two factors: steady inflation and a surge in bird flu cases affecting egg-laying hens nationwide. This has led to shortages in grocery stores, with some, including Trader Joe’s, limiting how many cartons customers can purchase.\n\nNow that there’s “buzz” around eggs, Turcinovic said, it seemed like the right time to bring Delmonico’s luxury dish to the forefront. In recent weeks, the restaurant has even seen an “uptick” in guests coming in for “a glass of champagne, Eggs Benedict, and a dessert.”\n\nTurcinovic notes that while smaller restaurants and home cooks might be struggling to deal with the skyrocketing cost of eggs, the change is marginal at high-end establishments – especially compared to the longstanding volatility in the price of meat or seafood.\n\n“We’re used to fluctuations,” he said. “We’re an expensive restaurant. We charge for so much more than food prices, like service and tablecloths. When the cost of one dish increases by 30 or 40 cents, we won’t really make drastic changes [in price.]”\n\nThe price increase is “not going to hurt us,” he added. “We won’t see it. It’ll be pennies at the end of the year.”\n\nBruce Gil contributed reporting.\n\n","articleSection":"eggs benedict","keywords":["eggs benedict","caviar","french cuisine","joe","dennis turcinovic","russian cuisine","iranian cuisine","eggs as food","hospitality recreation","cuisine of new york city","ossetra","roe","menu","bruce gil"],"publisher":{"@type":"Organization","@context":"http://schema.org","name":"Quartz","url":"https://qz.com","logo":{"@type":"ImageObject","width":500,"url":"https://x.kinja-static.com/assets/images/logos/newsletter/quartz-500px.png"},"sameAs":["https://www.facebook.com/quartznews","https://www.youtube.com/channel/UC9f78Z5hgtDt0n8JWyfBk8Q","https://twitter.com/qz","https://instagram.com/qz"]},"video":[]}ByMadeline FitzgeraldPublishedThursday 5:00AMWe may earn a commission from links on this page.Photo: Sarah Blesener/Bloomberg via Getty Images (Getty Images)As egg prices surge across the country, many home cooks are doing without the kitchen staple. But at Delmonico’s, the birthplace of Eggs Benedict, customers are more excited than ever to try new egg dishes.Suggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkview videoNvidia's record earnings reveal just 3 customers make up 30% of revenueSuggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkNvidia's record earnings reveal just 3 customers make up 30% of revenue“Eggs have become sexier now that they’re more expensive,” Dennis Turcinovic, owner and managing partner of Delmonico’s Hospitality Group, told Quartz.AdvertisementRelated ContentIt’s not too late to address Roe v. Wade with your employees. Here’s how.Watch Janet Yellen explain how overturning Roe v. Wade will hurt the US economyRelated ContentIt’s not too late to address Roe v. Wade with your employees. Here’s how.Watch Janet Yellen explain how overturning Roe v. Wade will hurt the US economyEggs are so sexy, in fact, that the restaurant is now launching a $52 Royal Eggs Benedict dish featuring Maine lobster, black truffle, and Ossetra caviar. This meal will be available on the menu alongside the restaurant’s $27 classic Eggs Benedict. Prior to its addition to the current menu, Delmonico’s occasionally served the Royal variation for brunch and always kept the dish available as a secret menu item.AdvertisementPhoto: Business WireAdvertisementThis promotion comes as egg shortages and rising prices remain top of mind for American consumers. The USDA said combined retail egg prices surged 13.8% in January after an 8.4% rise in December. The price of a dozen large grade A eggs reached a record $4.95 in January, up over 96% from just $2.52 a year ago, according to data released earlier this month by the Bureau of Labor Statistics.The rising cost is largely due to two factors: steady inflation and a surge in bird flu cases affecting egg-laying hens nationwide. This has led to shortages in grocery stores, with some, including Trader Joe’s, limiting how many cartons customers can purchase.AdvertisementNow that there’s “buzz” around eggs, Turcinovic said, it seemed like the right time to bring Delmonico’s luxury dish to the forefront. In recent weeks, the restaurant has even seen an “uptick” in guests coming in for “a glass of champagne, Eggs Benedict, and a dessert.”Turcinovic notes that while smaller restaurants and home cooks might be struggling to deal with the skyrocketing cost of eggs, the change is marginal at high-end establishments – especially compared to the longstanding volatility in the price of meat or seafood.Advertisement“We’re used to fluctuations,” he said. “We’re an expensive restaurant. We charge for so much more than food prices, like service and tablecloths. When the cost of one dish increases by 30 or 40 cents, we won’t really make drastic changes [in price.]”The price increase is “not going to hurt us,” he added. “We won’t see it. It’ll be pennies at the end of the year.”AdvertisementBruce Gil contributed reporting.📬 Sign up for the Daily BriefOur free, fast, and fun briefing on the global economy, delivered every weekday morning.'''
