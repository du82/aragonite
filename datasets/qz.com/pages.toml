st slides2nd most diverse: Houston, TexasPhoto: Sean Pavone (iStock by Getty Images)Houston is the second most diverse major city in America. It performed especially well in the socioeconomic diversity category.AdvertisementPrevious SlideNext Slide11 / 12List slidesMost diverse: Arlington, TexasList slidesMost diverse: Arlington, TexasPhoto: Jacob Boomsma (iStock by Getty Images)Arlington is the most diverse major city in America. It performed especially well in the cultural diversity category. Advertisement Advertisement12 / 12List slidesList slidesPreviousStart over'
