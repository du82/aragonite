["https://qz.com/amazon-alexa-gen-ai-brain-q3-earnings-1851687195"]
title = "Amazon's Alexa AI is having some problems"
description = 'Amazon CEO Andy Jassy said the company continues "to rearchitect the brain" of its voice assistant'
full_description = '''{"@type":"NewsArticle","@context":"http://schema.org","url":"https://qz.com/amazon-alexa-gen-ai-brain-q3-earnings-1851687195","author":[{"@type":"Person","name":"Britney Nguyen"}],"headline":"Amazon is struggling to bring AI to Alexa","description":"Amazon CEO Andy Jassy said the company continues \"to rearchitect the brain\" of its voice assistant","dateline":"11/01/2024 at 11:21","datePublished":"2024-11-01T11:21:00-04:00","dateModified":"2024-11-01T11:36:17-04:00","mainEntityOfPage":{"@type":"WebPage","url":"https://qz.com/amazon-alexa-gen-ai-brain-q3-earnings-1851687195"},"mentions":[{"@type":"Corporation","@context":"http://schema.org","name":"Amazon.com Inc.","tickerSymbol":"AMZN","url":"https://qz.com/quote/AMZN"},{"@type":"Corporation","@context":"http://schema.org","name":"NVIDIA Corporation","tickerSymbol":"NVDA","url":"https://qz.com/quote/NVDA"}],"image":{"@type":"ImageObject","height":675,"width":1200,"url":"https://i.kinja-img.com/image/upload/c_fill,h_675,pg_1,q_80,w_1200/a40057705579dfaa09a9dd643b9f0bdc.jpg","thumbnail":{"@type":"ImageObject","height":180,"width":320,"url":"https://i.kinja-img.com/image/upload/c_fill,h_180,pg_1,q_80,w_320/a40057705579dfaa09a9dd643b9f0bdc.jpg"}},"isAccessibleForFree":"False","hasPart":{"@type":"WebPageElement","isAccessibleForFree":"False","cssSelector":".js_regwalled-content"},"articleBody":"A decade after making waves with its voice assistant, Alexa, Amazon (AMZN) seems to be struggling to bring it into the generative artificial intelligence era.\n\n\nDuring the company’s third-quarter earnings call, Amazon chief executive Andy Jassy said the company is continuing “to rearchitect the brain” of its voice assistant with a set of next-generation foundation models — or larger models trained on broad, generalized data sets. \n\n“When we first were pursuing Alexa, we had this vision of it being the world’s best personal assistant and people thought that was kind of a crazy idea,” David Fildes, Amazon vice president of investor relations, said. “And I think if you look at what’s happened in generative AI over the last couple of years, I think you’re kind of missing the boat if you don’t believe that’s going to happen. It absolutely is going to happen.”\n\nBy rearchitecting Alexa with its foundation models, Fildes said Amazon believes it has “an opportunity to be the leader” in the next generation of voice assistants and generative AI applications. The next generation, he said, will not only be better at answering questions and summarizing data, “but also taking actions.”\n\nJassy said Amazon would share the new models with customers soon, and that the company is “increasingly adding more AI into all of our devices,” including the Kindle. Amazon declined to share more specifics on its release plans in an email to Quartz.\n\nAlexa AI’s postponed release is due to technical challenges, Bloomberg reported earlier this week, citing unnamed people familiar with the matter. One person told the publication that Amazon’s Alexa AI teams were recently told their target deadline is now in 2025. \n\nIn June, Fortune reported that the AI-powered Alexa — which Amazon demoed last September and said would be available for a free preview on its Alexa-fitted devices in the U.S. — is not even close to being ready. Former employees told the publication that the company doesn’t have enough data nor access to the chips needed to run the large language model (LLM) powering the new version of its voice assistant. The company also reportedly deprioritized Alexa AI to focus on building generative AI for its cloud computing unit, Amazon Web Services.\n\nAmazon said its former employees are incorrect and uninformed on its current Alexa AI efforts, and that the Amazon Artificial General Intelligence team has access to both in-house Trainium chips and Nvidia’s (NVDA) graphics processing units (GPUs). \n\n“We have already integrated generative AI into different components of Alexa, and are working hard on implementation at scale—in the over half a billion ambient, Alexa-enabled devices,” an Amazon spokesperson previously told Quartz in a statement. “We are excited about what we’re building and look forward to delivering it for our customers.”\n\n\nOn Amazon’s third-quarter earnings call, Jassy said Amazon has a “very deep partnership with Nvidia” and plans to “be their lead partner on most of their new chips.” Production of the second version of Amazon’s training chips, Trainium, will start ramping up in the next few weeks, Jassy said.\n\n","articleSection":"amazon","keywords":["amazon","alexa","andy jassy","microsoft bing","generative artificial intelligence","trainium","virtual assistant","david fildes","artificial intelligence","applications of artificial intelligence","amazon web services","nvidia","kindle","alexa internet","amazon echo","amazon alexa"],"publisher":{"@type":"Organization","@context":"http://schema.org","name":"Quartz","url":"https://qz.com","logo":{"@type":"ImageObject","width":500,"url":"https://x.kinja-static.com/assets/images/logos/newsletter/quartz-500px.png"},"sameAs":["https://www.facebook.com/quartznews","https://www.youtube.com/channel/UC9f78Z5hgtDt0n8JWyfBk8Q","https://twitter.com/qz","https://instagram.com/qz"]},"video":[]}ByBritney NguyenUpdatedNovember 1, 2024We may earn a commission from links on this page.Amazon’s third-generation Echo Dot.Image: AmazonIn This StoryAMZN+0.25%NVDA+1.66%A decade after making waves with its voice assistant, Alexa, Amazon (AMZN+0.25%) seems to be struggling to bring it into the generative artificial intelligence era.Suggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkview videoNvidia's record earnings reveal just 3 customers make up 30% of revenueSuggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkNvidia's record earnings reveal just 3 customers make up 30% of revenueDuring the company’s third-quarter earnings call, Amazon chief executive Andy Jassy said the company is continuing “to rearchitect the brain” of its voice assistant with a set of next-generation foundation models — or larger models trained on broad, generalized data sets. AdvertisementRelated ContentAmazon's Alexa finally got its big AI upgradeAmazon is launching a new lineup of Alexa Plus companion gadgetsRelated ContentAmazon's Alexa finally got its big AI upgradeAmazon is launching a new lineup of Alexa Plus companion gadgets“When we first were pursuing Alexa, we had this vision of it being the world’s best personal assistant and people thought that was kind of a crazy idea,” David Fildes, Amazon vice president of investor relations, said. “And I think if you look at what’s happened in generative AI over the last couple of years, I think you’re kind of missing the boat if you don’t believe that’s going to happen. It absolutely is going to happen.”AdvertisementBy rearchitecting Alexa with its foundation models, Fildes said Amazon believes it has “an opportunity to be the leader” in the next generation of voice assistants and generative AI applications. The next generation, he said, will not only be better at answering questions and summarizing data, “but also taking actions.”AdvertisementJassy said Amazon would share the new models with customers soon, and that the company is “increasingly adding more AI into all of our devices,” including the Kindle. Amazon declined to share more specifics on its release plans in an email to Quartz.Alexa AI’s postponed release is due to technical challenges, Bloomberg reported earlier this week, citing unnamed people familiar with the matter. One person told the publication that Amazon’s Alexa AI teams were recently told their target deadline is now in 2025. AdvertisementIn June, Fortune reported that the AI-powered Alexa — which Amazon demoed last September and said would be available for a free preview on its Alexa-fitted devices in the U.S. — is not even close to being ready. Former employees told the publication that the company doesn’t have enough data nor access to the chips needed to run the large language model (LLM) powering the new version of its voice assistant. The company also reportedly deprioritized Alexa AI to focus on building generative AI for its cloud computing unit, Amazon Web Services.Amazon said its former employees are incorrect and uninformed on its current Alexa AI efforts, and that the Amazon Artificial General Intelligence team has access to both in-house Trainium chips and Nvidia’s (NVDA+1.66%) graphics processing units (GPUs). Advertisement“We have already integrated generative AI into different components of Alexa, and are working hard on implementation at scale—in the over half a billion ambient, Alexa-enabled devices,” an Amazon spokesperson previously told Quartz in a statement. “We are excited about what we’re building and look forward to delivering it for our customers.”On Amazon’s third-quarter earnings call, Jassy said Amazon has a “very deep partnership with Nvidia” and plans to “be their lead partner on most of their new chips.” Production of the second version of Amazon’s training chips, Trainium, will start ramping up in the next few weeks, Jassy said.📬 Sign up for the Daily BriefOur free, fast, and fun