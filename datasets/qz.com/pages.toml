title = "After Nvidia earnings beat, analysts are turn to GTC"
description = "The chipmaker will unveil its next AI chip, Blackwell Ultra, and the Vera Rubin platform at its annual GTC developers conference"
full_description = '''{"@type":"NewsArticle","@context":"http://schema.org","url":"https://qz.com/nvidia-q4-earnings-gtc-blackwell-ultra-rubin-ai-chip-1851766868","author":[{"@type":"Person","name":"Britney Nguyen"}],"headline":"Nvidia beat earnings expectations again. Here's what comes next","description":"The chipmaker will unveil its next AI chip, Blackwell Ultra, and the Vera Rubin platform at its annual GTC developers conference","dateline":"02/27/2025 at 16:10","datePublished":"2025-02-27T16:10:00-05:00","dateModified":"2025-02-27T17:00:37-05:00","mainEntityOfPage":{"@type":"WebPage","url":"https://qz.com/nvidia-q4-earnings-gtc-blackwell-ultra-rubin-ai-chip-1851766868"},"mentions":[{"@type":"Corporation","@context":"http://schema.org","name":"Jefferies Financial Group Inc.","tickerSymbol":"JEF","url":"https://qz.com/quote/JEF"},{"@type":"Corporation","@context":"http://schema.org","name":"NVIDIA Corporation","tickerSymbol":"NVDA","url":"https://qz.com/quote/NVDA"}],"image":{"@type":"ImageObject","height":675,"width":1200,"url":"https://i.kinja-img.com/image/upload/c_fill,h_675,pg_1,q_80,w_1200/65e255cfb5e590b8e54a6e8f00faa996.jpg","thumbnail":{"@type":"ImageObject","height":180,"width":320,"url":"https://i.kinja-img.com/image/upload/c_fill,h_180,pg_1,q_80,w_320/65e255cfb5e590b8e54a6e8f00faa996.jpg"}},"isAccessibleForFree":"False","hasPart":{"@type":"WebPageElement","isAccessibleForFree":"False","cssSelector":".js_regwalled-content"},"articleBody":"After it delivered another record quarter, all eyes will be on Nvidia’s (NVDA) announcements at its annual GPU Technology Conference in March.\n\nNvidia unveiled its Blackwell artificial intelligence platform at last year’s conference — known as the GTC — which has now “successfully ramped up” large-scale production and is “achieving billions of dollars in sales in its first quarter,” Nvidia CEO Jensen Huang said in a statement. Demand for the chips, which faced production delays due to design flaws and overheating issues, is “amazing” as companies roll out reasoning AI models, according to Huang.\n\nOn the company’s fiscal fourth quarter earnings call, Huang said he will discuss the company’s next AI chip, Blackwell Ultra, its next-generation AI platform, Vera Rubin, and its plans for following products at the conference. During the company’s earnings call in May, Huang announced that Nvidia already had another chip coming after Blackwell, and that the company is “on a one-year rhythm.” The following month, Huang announced Blackwell Ultra and the Rubin platform during an appearance at COMPUTEX in Taiwan.\n\nDuring the call with analysts on Wednesday, Huang said Nvidia has “some really exciting things to share” at the GTC about enterprise and agentic AI, reasoning models, and robotics. \n\nThe upcoming developers conference will be “another positive catalyst to help solidify the performance advantages of Blackwell and lay a framework for continued AI spending, particularly on the inference side,” Jefferies (JEF) analysts said in a note on Thursday.\n\nDespite surpassing revenue and guidance expectations, Nvidia’s shares fell on Thursday as some investors were left unimpressed by its results. \n\nHowever, Nvidia is expected to “get the market excited about everything in the product pipeline,” at the GTC next month, John Belton, a portfolio manager at Gabelli Funds, said in post-earnings comments shared with Quartz. \n\nSean Sun, a portfolio manager at Thornburg Investment Management, shared similar sentiments, saying Nvidia’s “real story is its rapid cadence of innovation,” in comments shared with Quartz. “With GTC around the corner, I expect further product announcements to build on today’s momentum.”\n\nThe GTC takes place between March 17 and 21, and Huang will deliver his keynote address on March 18.\n\n","articleSection":"nvidia","keywords":["nvidia","business finance","virtual reality","blackwell artificial intelligence platform","blackwell ultra","thornburg investment management","gabelli funds","jensen huang","sean sun","blackwell","intel","graphics processing unit","john belton","vera rubin"],"publisher":{"@type":"Organization","@context":"http://schema.org","name":"Quartz","url":"https://qz.com","logo":{"@type":"ImageObject","width":500,"url":"https://x.kinja-static.com/assets/images/logos/newsletter/quartz-500px.png"},"sameAs":["https://www.facebook.com/quartznews","https://www.youtube.com/channel/UC9f78Z5hgtDt0n8JWyfBk8Q","https://twitter.com/qz","https://instagram.com/qz"]},"video":[]}ByBritney NguyenUpdatedThursday 5:00PMWe may earn a commission from links on this page.Nvidia CEO Jensen Huang at the company’s annual GPU Technology Conference on March 18, 2024 in San Jose, California.Photo: Justin Sullivan (Getty Images)In This StoryNVDA+1.66%JEF+1.22%After it delivered another record quarter, all eyes will be on Nvidia’s (NVDA+1.66%) announcements at its annual GPU Technology Conference in March.Suggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkview videoNvidia's record earnings reveal just 3 customers make up 30% of revenueSuggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkNvidia's record earnings reveal just 3 customers make up 30% of revenueNvidia unveiled its Blackwell artificial intelligence platform at last year’s conference — known as the GTC — which has now “successfully ramped up” large-scale production and is “achieving billions of dollars in sales in its first quarter,” Nvidia CEO Jensen Huang said in a statement. Demand for the chips, which faced production delays due to design flaws and overheating issues, is “amazing” as companies roll out reasoning AI models, according to Huang.AdvertisementRelated ContentNvidia stock rises after Jensen Huang says demand for its new AI chips is 'insane'Nvidia stock jumps 4% before CEO Jensen Huang's CES keynoteRelated ContentNvidia stock rises after Jensen Huang says demand for its new AI chips is 'insane'Nvidia stock jumps 4% before CEO Jensen Huang's CES keynoteOn the company’s fiscal fourth quarter earnings call, Huang said he will discuss the company’s next AI chip, Blackwell Ultra, its next-generation AI platform, Vera Rubin, and its plans for following products at the conference. During the company’s earnings call in May, Huang announced that Nvidia already had another chip coming after Blackwell, and that the company is “on a one-year rhythm.” The following month, Huang announced Blackwell Ultra and the Rubin platform during an appearance at COMPUTEX in Taiwan.AdvertisementDuring the call with analysts on Wednesday, Huang said Nvidia has “some really exciting things to share” at the GTC about enterprise and agentic AI, reasoning models, and robotics. AdvertisementThe upcoming developers conference will be “another positive catalyst to help solidify the performance advantages of Blackwell and lay a framework for continued AI spending, particularly on the inference side,” Jefferies (JEF+1.22%) analysts said in a note on Thursday.Despite surpassing revenue and guidance expectations, Nvidia’s shares fell on Thursday as some investors were left unimpressed by its results. AdvertisementHowever, Nvidia is expected to “get the market excited about everything in the product pipeline,” at the GTC next month, John Belton, a portfolio manager at Gabelli Funds, said in post-earnings comments shared with Quartz. Sean Sun, a portfolio manager at Thornburg Investment Management, shared similar sentiments, saying Nvidia’s “real story is its rapid cadence of innovation,” in comments shared with Quartz. “With GTC around the corner, I expect further product announcements to build on today’s momentum.”AdvertisementThe GTC takes place between March 17 and 21, and Huang will deliver his keynote address on March 18.📬 Sign up for the Daily BriefOur free, fast, and fun briefing on the global economy, delivered every weekday morning.'''
