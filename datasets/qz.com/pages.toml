full_description = '''{"@type":"NewsArticle","@context":"http://schema.org","url":"https://qz.com/palo-alto-networks-inc-panw-reports-earnings-1851764153","author":[{"@type":"Person","name":"Quartz Intelligence Newsroom"}],"headline":"Palo Alto Networks Inc. (PANW) reports earnings","description":"The report was filed on February 14, 2025","dateline":"02/14/2025 at 17:15","datePublished":"2025-02-14T17:15:24-05:00","dateModified":"2025-02-14T17:15:24-05:00","mainEntityOfPage":{"@type":"WebPage","url":"https://qz.com/palo-alto-networks-inc-panw-reports-earnings-1851764153"},"mentions":[{"@type":"Corporation","@context":"http://schema.org","name":"Palo Alto Networks Inc.","tickerSymbol":"PANW","url":"https://qz.com/quote/PANW"}],"isAccessibleForFree":"False","hasPart":{"@type":"WebPageElement","isAccessibleForFree":"False","cssSelector":".js_regwalled-content"},"articleBody":"Palo Alto Networks Inc. (PANW) has submitted its 10-Q filing for the quarterly period ended January 31, 2025.\n\nThe filing includes financial statements for the quarter, showing total revenue of $2.3 billion, an increase from $2.0 billion in the same quarter the previous year. This growth is attributed to increased demand for the company&#39;s products and subscriptions.\n\nProduct revenue for the quarter was $421.5 million, representing 18.7% of total revenue, compared to 19.8% in the same quarter of the previous year. The increase in product revenue is driven by demand for new generation hardware products.\n\nSubscription and support revenue grew to $1.8 billion, accounting for 81.3% of total revenue, up from 80.2% in the previous year. This growth is due to increased demand for the company&#39;s subscription and support offerings.\n\nCost of revenue for the quarter was $599.2 million, representing 26.5% of total revenue, compared to 25.3% in the same quarter of the previous year. The increase in cost of revenue is primarily due to higher inventory reserves and increased costs to support subscription and support offerings.\n\nThe company reported a gross profit of $1.7 billion for the quarter, compared to $1.5 billion in the previous year, with a gross margin of 73.5%, down from 74.7% in the previous year.\n\nOperating expenses totaled $1.4 billion for the quarter, representing 62.9% of total revenue, compared to 72.0% in the previous year. The decrease in operating expenses as a percentage of revenue is due to a reduction in general and administrative expenses.\n\nNet income for the quarter was $267.3 million, down from $1.7 billion in the previous year. The decrease in net income is primarily due to the release of a valuation allowance in the previous year.\n\nCash provided by operating activities was $2.1 billion for the six months ended January 31, 2025, compared to $2.2 billion in the previous year. The decrease is attributed to higher payments for business growth.\n\nPalo Alto Networks continues to focus on expanding its global presence and investing in research and development to support future growth.\n\nThis content was summarized by generative artificial intelligence using public filings retrieved from SEC.gov. The original data was derived from the Palo Alto Networks Inc. quarterly 10-Q report dated February 14, 2025. To report an error, please email earnings@qz.com.\n\n","articleSection":"palo alto networks inc","keywords":["palo alto networks inc","business finance","american brands"],"publisher":{"@type":"Organization","@context":"http://schema.org","name":"Quartz","url":"https://qz.com","logo":{"@type":"ImageObject","width":500,"url":"https://x.kinja-static.com/assets/images/logos/newsletter/quartz-500px.png"},"sameAs":["https://www.facebook.com/quartznews","https://www.youtube.com/channel/UC9f78Z5hgtDt0n8JWyfBk8Q","https://twitter.com/qz","https://instagram.com/qz"]},"video":[]}ByQuartz Intelligence NewsroomPublishedFebruary 14, 2025We may earn a commission from links on this page.In This StoryPANW+1.33%Palo Alto Networks Inc. (PANW+1.33%