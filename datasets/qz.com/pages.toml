description = "Quartz ObsessionJoin us every week as reporters from our global newsroom dig into the most fascinating facets of an idea: where it came from, how it got to us, and what it can tell us about the forces that are changing the way we live and work. Apple PodcastsSpotifyPandora"
full_description = '''The algorithm: Letters of recommendationThe making of the recommendation formulas that influence what we stream, shop, and see online today.Quartz Staff Video game remakes: Revival of the fittestThe games you loved once? Get ready to spend money on them a second time.Quartz Staff Green steel: Structural changeWhat if we changed not just the materials we used to make things, but the way we make our materials?Quartz Staff VR headsets: We’re practically thereVirtual reality has always been a future-tech promise, but today’s applications are more practical than you might expect.Quartz Staff Smart rings: Digital digitsData-collecting, payment-making tech, wrapped around your finger. Is it worth it?Quartz Staff Tail lights: Smart signalsThose simple lights on the back of your car are one of the most important technological innovations in automaking history — and they’re not finished yet.Quartz Staff The World’s Fair: Tech’s bygone showcaseWorld's Fairs provided a glimpse into new inventions and technologies from across the globe. Smart homes: Built to crashWe fill our houses with the Internet of Things, but the technology leaves much to be desired. Superapps: There can be only oneDespite antitrust scrutiny, the dream of building a superapp in the US persists. AI hallucinations: Turn on, tune in, beep boopChatbots aren't always right. Researchers call these faulty performances "hallucinations." Single-use plastics: The message in a bottleSingle-use plastics are a problem, but why is it often the duty of consumers to do something about it? Online voting: Yes or noEstonia pioneered online voting in its elections almost two decades ago. Could the US replicate its success? Public tech bank: A newer dealIn the wake of SVB's collapse, this episode imagines another option for the US government in financing tech innovation. Algorithmic hiring: We’re only humanWhat is it like going through the job search process without ever interacting with a real person? Tree planting: Sowing complacencyNot only is tree planting not that helpful in offsetting carbon emissions—it might even be counterproductive'''
