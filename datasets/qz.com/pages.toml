d profile and believe it will address important unmet medical needs.”AdvertisementRelated ContentOzempic and prescription weight loss drugs: How they work, what they cost, side effects, and everything to knowThe weight loss drug race has Amgen coming for Novo Nordisk and Eli LillyRelated ContentOzempic and prescription weight loss drugs: How they work, what they cost, side effects, and everything to knowThe weight loss drug race has Amgen coming for Novo Nordisk and Eli LillyWhile results from the study will be released in late 2024, the company is already planning a larger phase 3 trial of drug for multiple uses, including obesity and diabetes. AdvertisementBradway’s comments come as several pharma companies are aiming to disrupt the weight loss drug duopoly dominated by Novo Nordisk, known for making Ozempic and Wegovy, and Eli Lilly, the producer of Zepbound.AdvertisementMorgan Stanley analysts anticipate that the global market for GLP-1 drugs — the class of drug these weight loss medications belong to — will reach $105 billion by 2030. It also projects the drugs will be adopted by about 31.5 million people in the United States, or about 9% of the nation’s population, by 2035.MariTide vs. WegovyAn early stage trial of MariTide found that users on the drug lost average of 14.5% of their weight in about 12 weeks. For comparison, a clinical trial of Wegovy found that participants lost an average of 15% of their weight in 68 weeks.AdvertisementAmgen Chief Scientific Officer James E. Bradner told inverstors that MariTide is expected to be sold in a “convenient, handheld, patient-friendly auto-injector device with a monthly or even less frequent single-injection administration.” This is opposed to the weekly injections required for weight loss drugs currently on the market.📬 Sign up for the Daily BriefOur free, fast, and fun briefing on the global economy, delivered every weekday morning.'''
