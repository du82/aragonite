["https://qz.com/openai-gpt-4-5-larger-smarter-model-1851766879"]
title = "OpenAI debuts ChatGPT-4.5: Bigger, smarter, more expensive"
description = 'ChatGPT Pro users get first dibs on a research preview of GPT 4.5, a "giant, expensive" new model'
full_description = '''{"@type":"NewsArticle","@context":"http://schema.org","url":"https://qz.com/openai-gpt-4-5-larger-smarter-model-1851766879","author":[{"@type":"Person","name":"Ece Yildirim"}],"headline":"OpenAI debuts GPT-4.5: Bigger, smarter — and more expensive","description":"ChatGPT Pro users get first dibs on a research preview of GPT 4.5, a \"giant, expensive\" new model","dateline":"02/27/2025 at 15:48","datePublished":"2025-02-27T15:48:00-05:00","dateModified":"2025-02-27T17:09:53-05:00","mainEntityOfPage":{"@type":"WebPage","url":"https://qz.com/openai-gpt-4-5-larger-smarter-model-1851766879"},"mentions":[{"@type":"Corporation","@context":"http://schema.org","name":"Comcast Corporation Class A Common Stock","tickerSymbol":"CMCSA","url":"https://qz.com/quote/CMCSA"}],"image":{"@type":"ImageObject","height":675,"width":1200,"url":"https://i.kinja-img.com/image/upload/c_fill,h_675,pg_1,q_80,w_1200/2bf92d3134a15f819e665de1b139034e.jpg","thumbnail":{"@type":"ImageObject","height":180,"width":320,"url":"https://i.kinja-img.com/image/upload/c_fill,h_180,pg_1,q_80,w_320/2bf92d3134a15f819e665de1b139034e.jpg"}},"isAccessibleForFree":"False","hasPart":{"@type":"WebPageElement","isAccessibleForFree":"False","cssSelector":".js_regwalled-content"},"articleBody":"OpenAI says it’s releasing its “largest” and “strongest” chat model to date.\n\nGPT 4.5 will be released as a research preview first to ChatGPT Pro users and developers on all paid tiers. The company is also working to bring it to ChatGPT Plus and ChatGPT for Teams users next week, trailed by ChatGPT Edu and ChatGPT for Enterprise users the following week. \n\n\n“We really wanted to launch it to Plus and Pro at the same time, but we’ve been growing a lot and are out of GPUs,” CEO Sam Altman posted on X. “This isn’t how we want to operate, but it’s hard to perfectly predict growth surges that lead to GPU shortages.” The executive also described the model as “giant” and “expensive.” \n\nAlthough the model builds upon the previous GPT-4o and is supposedly the “first model that feels like talking to a thoughtful person,” according to Altman, it “won’t crush benchmarks.”\n\n“We’re still experimenting with this model ourselves, especially because its not a reasoning model, and we’re exploring capabilities that emerge with unsupervised learning, and we’re really excited to bring this to the world today so that we can explore it together,” OpenAI research lead Mia Glaese said in the company’s livestream announcement of the model.\n\nGPT-4.5 outperformed previous models in accuracy tests conducted by OpenAI, apparently producing less false or unsupported information. The model is also reportedly better at interpreting nuance like subtle cues or implicit expectations.\n\nThe model, which had been codenamed Orion, will be the company’s final non-chain-of-thought model, according to Altman. Future models, like the highly anticipated GPT-5 — which Altman promised will be unveiled in the next few months, will instead be more advanced LLMs that rely on reasoning capabilities. Models that rely on reasoning are expected to be better at tackling complex questions by “thinking” before producing a response.\n\n“We believe that reasoning will be a core capability of our future models, but we also think that the two paradigms that we talked about today, unsupervised learning and reasoning, complement each other; models like GPT 4.5 that have more world knowledge and are inherently smarter will be stronger foundations for future reasoning,” Glaese said.\n\nThe pressure is on for ChatGPT to continue growing its performance capabilities as rivals including China’s DeepSeek emerge with great fanfare. \n\nStill, OpenAI recently said its user growth remains intact despite the competition. OpenAI chief operating officer Brad Lightcap told CNBC last week that ChatGPT’s weekly active users were up 33% since December.\n\n","articleSection":"openai","keywords":["openai","openai","gpt 4","orion","artificial intelligence","openai o3","generative pre trained transformer","sam altman","technology internet","mia glaese","draftwho is chatgpt","brad lightcap","large language models","chatgpt"],"publisher":{"@type":"Organization","@context":"http://schema.org","name":"Quartz","url":"https://qz.com","logo":{"@type":"ImageObject","width":500,"url":"https://x.kinja-static.com/assets/images/logos/newsletter/quartz-500px.png"},"sameAs":["https://www.facebook.com/quartznews","https://www.youtube.com/channel/UC9f78Z5hgtDt0n8JWyfBk8Q","https://twitter.com/qz","https://instagram.com/qz"]},"video":[]}ByEce YildirimPublishedThursday 3:48PMWe may earn a commission from links on this page.Photo: Tomohiro Ohsumi (Getty Images)In This StoryCMCSA+0.95%OpenAI says it’s releasing its “largest” and “strongest” chat model to date.GPT 4.5 will be released as a research preview first to ChatGPT Pro users and developers on all paid tiers. The company is also working to bring it to ChatGPT Plus and ChatGPT for Teams users next week, trailed by ChatGPT Edu and ChatGPT for Enterprise users the following week. Suggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkview videoNvidia's record earnings reveal just 3 customers make up 30% of revenueSuggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkNvidia's record earnings reveal just 3 customers make up 30% of revenueRelated ContentOpenAI is deepening its ties to the defense industryNvidia's stock surge, ChatGPT on iPhones, and OpenAI rakes in cash: AI news roundup“We really wanted to launch it to Plus and Pro at the same time, but we’ve been growing a lot and are out of GPUs,” CEO Sam Altman posted on X. “This isn’t how we want to operate, but it’s hard to perfectly predict growth surges that lead to GPU shortages.” The executive also described the model as “giant” and “expensive.” AdvertisementRelated ContentOpenAI is deepening its ties to the defense industryNvidia's stock surge, ChatGPT on iPhones, and OpenAI rakes in cash: AI news roundupAdvertisementAlthough the model builds upon the previous GPT-4o and is supposedly the “first model that feels like talking to a thoughtful person,” according to Altman, it “won’t crush benchmarks.”Advertisement“We’re still experimenting with this model ourselves, especially because its not a reasoning model, and we’re exploring capabilities that emerge with unsupervised learning, and we’re really excited to bring this to the world today so that we can explore it together,” OpenAI research lead Mia Glaese said in the company’s livestream announcement of the model.GPT-4.5 outperformed previous models in accuracy tests conducted by OpenAI, apparently producing less false or unsupported information. The model is also reportedly better at interpreting nuance like subtle cues or implicit expectations.AdvertisementThe model, which had been codenamed Orion, will be the company’s final non-chain-of-thought model, according to Altman. Future models, like the highly anticipated GPT-5 — which Altman promised will be unveiled in the next few months, will instead be more advanced LLMs that rely on reasoning capabilities. Models that rely on reasoning are expected to be better at tackling complex questions by “thinking” before producing a response.“We believe that reasoning will be a core capability of our future models, but we also think that the two paradigms that we talked about today, unsupervised learning and reasoning, complement each other; models like GPT 4.5 that have more world knowledge and are inherently smarter will be stronger foundations for future reasoning,” Glaese said.AdvertisementThe pressure is on for ChatGPT to continue growing its performance capabilities as rivals including China’s DeepSeek emerge with great fanfare. Still, OpenAI recently said its user growth remains intact despite the competition. OpenAI chief operating officer Brad Lightcap told CNBC last week that ChatGPT’s weekly active users were up 33% since December.📬 Sign up for the Daily BriefOur free, fast, and fun briefing on the global economy, delivered every weekday morning.'''
