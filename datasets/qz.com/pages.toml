["https://qz.com/emails/daily-brief/1851766911/amazon-alexa-microsoft-google-blue-origin-katy-perry-da"]
title = "Amazon to upgrade Alexa and launch new lineup of gadgets in fall 2025"
description = "Amazon to upgrade Alexa, launch new gadget lineup this fall"
full_description = '''{"@type":"NewsArticle","@context":"http://schema.org","url":"https://qz.com/emails/daily-brief/1851766911/amazon-alexa-microsoft-google-blue-origin-katy-perry-da","author":[{"@type":"Person","name":"Francisco Velasquez"}],"headline":"🌏 Amazon’s Alexa buddies","description":"Plus: Eli Lilly’s got big U.S. drug plans","dateline":"02/27/2025 at 17:00","datePublished":"2025-02-27T17:00:00-05:00","dateModified":"2025-02-27T17:00:02-05:00","mainEntityOfPage":{"@type":"WebPage","url":"https://qz.com/emails/daily-brief/1851766911/amazon-alexa-microsoft-google-blue-origin-katy-perry-da"},"image":{"@type":"ImageObject","height":675,"width":1200,"url":"https://i.kinja-img.com/image/upload/c_fill,h_675,pg_1,q_80,w_1200/aef9ab3eb2340960aacc86370ac9b18b.jpg","thumbnail":{"@type":"ImageObject","height":180,"width":320,"url":"https://i.kinja-img.com/image/upload/c_fill,h_180,pg_1,q_80,w_320/aef9ab3eb2340960aacc86370ac9b18b.jpg"}},"isAccessibleForFree":"False","hasPart":{"@type":"WebPageElement","isAccessibleForFree":"False","cssSelector":".js_regwalled-content"},"articleBody":"Good morning, Quartz readers!\n\nHere’s what you need to know\n\nAmazon’s Alexa is getting some new friends. The tech giant will launch a fresh lineup of gadgets, alongside an updated model, this fall. \n\n… Also in Jeff Bezos’ orbit, Blue Origin’s first all-female crew is prepping for takeoff. The six-person team includes Katy Perry, Gayle King, and Lauren Sanchez, who reportedly spearheaded the mission.\n\nNvidia’s annual revenue owes much to three anonymous customers. These secretive spenders accounted for over 30% of the chipmaker’s yearly earnings, which surpassed $130 billion. \n\n… In another key development, Nvidia’s AI-spending spree continues. The company is setting its first-quarter guidance above Wall Street’s expectations, though that didn’t keep its stock from slipping.\n\nMicrosoft’s got a bone to pick with President Trump’s new AI chip restrictions. The company warned that the limits could drive allies toward Chinese suppliers. Amazon’s taking on Google and Microsoft with a new chip.\n\nGoogle says it’s got you covered when it comes to deleting personal info. An update to the company’s “Results About You” tool now scans for sensitive data.\n\nPapa John’s is slicing through the competition. The pizza maker posted strong profits, while its rival Domino’s struggled and warned that tariffs on a key ingredient could push up pie prices.\n\nTrump’s tariffs are imminent. New rules could raise prices on goods from the U.S.’s top trade partners, including China, Canada, and Mexico.\n\nEli Lilly wants to make drugs in America – if it gets a tax cut \n\nEli Lilly is planning to invest billions into building four new drug manufacturing plants in the U.S., which could create thousands of jobs. But there’s a catch: The pharma giant wants tax cuts before moving forward.\n\nThe company says it aims to boost domestic drug production, especially key ingredients that are currently sourced overseas. With demand rising for weight-loss drugs, Eli Lilly CEO David Ricks emphasized the need for tax policies, such as those from the 2017 Tax Cuts and Job Act, to be extended or improved in order to make this happen.\n\nHow much is Eli Lilly planning to invest to build these new plants? Quartz’s Bruce Gil takes a closer look.\n\nTariffs and rising costs bite \n\nThe U.S. economy is showing signs of a slump, made worse by President Trump’s tariffs. With inflation high and interest rates rising, the outlook is bleak for many Americans.\n\nNew reports reveal slowing growth, as a spike in jobless claims points to a weakening labor market. Meanwhile, the housing market is struggling, with pending home sales dropping to their lowest level in over two decades.\n\nTo make matters worse, Trump’s tariffs on steel and aluminium are driving home prices even higher, making it harder for buyers. \n\nHow should the latest economic reports be interpreted? Quartz’s Vinamrata Chaturvedi has the details.\n\nMore from Quartz\n\n🛒 Generic brand groceries are winning big as inflation makes a comeback\n\n📺 Warner Bros. Discovery stock spikes 10% because the streaming growth outlook is strong\n\n🤹 Warner Bros. Discovery’s streaming unit is shooting for 150 million subscribers\n\n🎀 OpenAI debuts GPT-4.5: Bigger, smarter, costlier\n\n🏃 Meta just fired about 20 employees for alleged leaks\n\n🪝 CFPB lets Capital One off the hook for $2 billion\n\n🥷 FBI and Bybit say North Koren agents were behind the $1.5 billion hack\n\n🥪 Subway is bringing back the discounted footlong. Here’s what you get for $6.99\n\n😎 Nvidia, Salesforce, Snowflakes, Warner Bros. Discovery, eBay: Stocks to watch\n\n💉 Moderna’s bird flu vaccine has a problem\n\n🏙️ The 5 most diverse major cities in America — and the 5 least\n\n🪃 The 10 cities where Americans are financially struggling the most\n\n🧑‍🔧 The 8 best used cars for less than $20,000, according to Consumer Reports\n\n😇 The 5 most sinful states in America — and the 5 least sinful\n\n\nDid you know we have two premium weekend emails, too? One gives you analysis on the week’s news, and one provides the best reads from Quartz and elsewhere to get your week started right. Become a member or give a membership as a gift!\n\nOur best wishes on a safe start to the day. Send any news, comments, pizza, or Alexas to talk@qz.com. Today’s Daily Brief was brought to you by Francisco Velasquez and Harri Weber.\n\n","articleSection":"alexa","keywords":["alexa","david ricks","francisco velasquez","customs duties","jeff bezos","ebay","eli lilly","blue origin","openai","lauren sanchez","moderna","indiana historical society","trump","business finance","warner bros discovery","tariff","papa johns","gayle king","bruce gil","harri weber","lilly","domino","bybit","nvidia","microsoft","katy perry","salesforce"],"publisher":{"@type":"Organization","@context":"http://schema.org","name":"Quartz","url":"https://qz.com","logo":{"@type":"ImageObject","width":500,"url":"https://x.kinja-static.com/assets/images/logos/newsletter/quartz-500px.png"},"sameAs":["https://www.facebook.com/quartznews","https://www.youtube.com/channel/UC9f78Z5hgtDt0n8JWyfBk8Q","https://twitter.com/qz","https://instagram.com/qz"]},"video":[]}This story was published on our Quartz Daily Brief newsletter, the most important and interesting news from the global economy. Inoculate yourself against ignorance with intel, charts, and surprising discoveries.ByFrancisco VelasquezPublishedThursday 5:00PMWe may earn a commission from links on this page.Image: Bloomberg (Getty Images)Good morning, Quartz readers!Here’s what you need to knowAmazon’s Alexa is getting some new friends. The tech giant will launch a fresh lineup of gadgets, alongside an updated model, this fall. Suggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkview videoNvidia's record earnings reveal just 3 customers make up 30% of revenueSuggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkNvidia's record earnings reveal just 3 customers make up 30% of revenueRelated ContentAmazon's AI-powered Alexa is reportedly not even close to being readyAmazon is giving Alexa an AI upgrade… Also in Jeff Bezos’ orbit, Blue Origin’s first all-female crew is prepping for takeoff. The six-person team includes Katy Perry, Gayle King, and Lauren Sanchez, who reportedly spearheaded the mission.AdvertisementRelated ContentAmazon's AI-powered Alexa is reportedly not even close to being readyAmazon is giving Alexa an AI upgradeNvidia’s annual revenue owes much to three anonymous customers. These secretive spenders accounted for over 30% of the chipmaker’s yearly earnings, which surpassed $130 billion. Advertisement… In another key development, Nvidia’s AI-spending spree continues. The company is setting its first-quarter guidance above Wall Street’s expectations, though that didn’t keep its stock from slipping.AdvertisementMicrosoft’s got a bone to pick with President Trump’s new AI chip restrictions. The company warned that the limits could drive allies toward Chinese suppliers. Amazon’s taking on Google and Microsoft with a new chip.Google says it’s got you covered when it comes to deleting personal info. An update to the company’s “Results About You” tool now scans for sensitive data.AdvertisementPapa John’s is slicing through the competition. The pizza maker posted strong profits, while its rival Domino’s struggled and warned that tariffs on a key ingredient could push up pie prices.Trump’s tariffs are imminent. New rules could raise prices on goods from the U.S.’s top trade partners, including China, Canada, and Mexico.AdvertisementEli Lilly wants to make drugs in America – if it gets a tax cut Eli Lilly is planning to invest billions into building four new drug manufacturing plants in the U.S., which could create thousands of jobs. But there’s a catch: The pharma giant wants tax cuts before moving forward.AdvertisementThe company says it aims to boost domestic drug production, especially key ingredients that are currently sourced overseas. With demand rising for weight-loss drugs, Eli Lilly CEO David Ricks emphasized the need for tax policies, such as those from the 2017 Tax Cuts and Job Act, to be extended or improved in order to make this happen.How much is Eli Lilly planning to invest to build these new plants? Quartz’s Bruce Gil takes a closer look.AdvertisementTariffs and rising costs bite The U.S. economy is showing signs of a slump, made worse by President Trump’s tariffs. With inflation high and interest rates rising, the outlook is bleak for many Americans.AdvertisementNew reports reveal slowing growth, as a spike in jobless claims points to a weakening labor market. Meanwhile, the housing market is struggling, with pending home sales dropping to their lowest level in over two decades.To make matters worse, Trump’s tariffs on steel and aluminium are driving home prices even higher, making it harder for buyers. AdvertisementHow should the latest economic reports be interpreted? Quartz’s Vinamrata Chaturvedi has the details.More from Quartz🛒 Generic brand groceries are winning big as inflation makes a comeback📺 Warner Bros. Discovery stock spikes 10% because the streaming growth outlook is strongAdvertisement🤹 Warner Bros. Discovery’s streaming unit is shooting for 150 million subscribers🎀 OpenAI debuts GPT-4.5: Bigger, smarter, costlier🏃 Meta just fired about 20 employees for alleged leaks🪝 CFPB lets Capital One off the hook for $2 billion🥷 FBI and Bybit say North Koren agents were behind the $1.5 billion hack🥪 Subway is bringing back the discounted footlong. Here’s what you get for $6.99Advertisement😎 Nvidia, Salesforce, Snowflakes, Warner Bros. Discovery, eBay: Stocks to watch💉 Moderna’s bird flu vaccine has a problem🏙️ The 5 most diverse major cities in America — and the 5 least🪃 The 10 cities where Americans are financially struggling the most🧑‍🔧 The 8 best used cars for less than $20,000, according to Consumer Reports😇 The 5 most sinful states in America — and the 5 least sinfulDid you know we have two premium weekend emails, too? One gives you analysis on the week’s news, and one provides the best reads from Quartz and elsewhere to get your wee