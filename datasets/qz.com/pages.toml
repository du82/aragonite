["https://qz.com/pfizer-dei-webpage-changes-1851767006"]
title = "Pfizer changes DEI page to emphasize merit"
description = 'The pharma giant edited its diversity and inclusion page to emphasize "merit"'
full_description = '''{"@type":"NewsArticle","@context":"http://schema.org","url":"https://qz.com/pfizer-dei-webpage-changes-1851767006","author":[{"@type":"Person","name":"Bruce Gil"}],"headline":"Pfizer quietly made some big DEI changes","description":"The pharma giant edited its diversity and inclusion page to emphasize \"merit\"","dateline":"02/28/2025 at 11:29","datePublished":"2025-02-28T11:29:00-05:00","dateModified":"2025-02-28T11:32:41-05:00","mainEntityOfPage":{"@type":"WebPage","url":"https://qz.com/pfizer-dei-webpage-changes-1851767006"},"mentions":[{"@type":"Corporation","@context":"http://schema.org","name":"Biogen Inc.","tickerSymbol":"BIIB","url":"https://qz.com/quote/BIIB"},{"@type":"Corporation","@context":"http://schema.org","name":"Bristol-Myers Squibb Company","tickerSymbol":"BMY","url":"https://qz.com/quote/BMY"},{"@type":"Corporation","@context":"http://schema.org","name":"Johnson & Johnson","tickerSymbol":"JNJ","url":"https://qz.com/quote/JNJ"},{"@type":"Corporation","@context":"http://schema.org","name":"Eli Lilly and Company","tickerSymbol":"LLY","url":"https://qz.com/quote/LLY"},{"@type":"Corporation","@context":"http://schema.org","name":"Pfizer Inc.","tickerSymbol":"PFE","url":"https://qz.com/quote/PFE"}],"image":{"@type":"ImageObject","height":675,"width":1200,"url":"https://i.kinja-img.com/image/upload/c_fill,h_675,pg_1,q_80,w_1200/d3e1df78fe2b6fb287ddf06a81e5f217.jpg","thumbnail":{"@type":"ImageObject","height":180,"width":320,"url":"https://i.kinja-img.com/image/upload/c_fill,h_180,pg_1,q_80,w_320/d3e1df78fe2b6fb287ddf06a81e5f217.jpg"}},"isAccessibleForFree":"False","hasPart":{"@type":"WebPageElement","isAccessibleForFree":"False","cssSelector":".js_regwalled-content"},"articleBody":"Pfizer (PFE) made some major changes to its diversity, equity, and inclusion (DEI) webpage on Thursday, joining other major American corporations that have recently aligned themselves closer with the Trump administration.\n\nThe pharmaceutical giant pulled some language relating to diversity initiatives from its DEI page and placed a new emphasis on “merit.” The webpage’s title was changed from “Diversity, Equity, and Inclusion” to “Merit-Based Diversity, Equity, and Inclusion,” according to an archived version of the page from earlier this month. The company also added a new sentence to the page’s introduction paragraph: “Our culture of diversity, equity and inclusion is based on merit—one where hard work, talent, and contributions drive success, and barriers to opportunity are removed.”\n\nOther sections of the webpage underwent similar changes. A section previously titled “Diversity in Our Global Supply” has been renamed “Inclusive Supplier Strategy.” The paragraph under this heading now states, “All areas of our business groups are dedicated to finding and selecting the best suppliers,” replacing the previous language that emphasized advancing DEI. \n\nPfizer did not immediately respond to a request for comment from Quartz. However, a company spokesperson told STAT News, which first reported the changes, “We constantly update and evolve the content and design of our website to reflect our current programs, initiatives, and commitments.”\n\nThe changes come as the pharma industry is recalibrating its public approach to DEI and aligning itself closer to the new administration. CEOs of major drugmakers reportedly met with Trump earlier this month. Bristol Myers Squibb (BMY), Johnson &amp; Johnson (JNJ), and Biogen (BIIB) have also recently removed references to DEI from their annual reports, according to Bloomberg. The Trump administration is attempting to eliminate diversity programs across public and private sectors, including at public schools and in the military. \n\nMeanwhile, Eli Lilly (LLY) CEO David Ricks, alongside Commerce Secretary Howard Lutnick, announced this week that the company plans to invest $27 billion in four new manufacturing sites in the United States. In an interview on Wednesday, the executive simultaneously called for “extended or improved” tax cuts.\n\n","articleSection":"pfizer","keywords":["pfizer","david ricks","corporate social responsibility","diversity","identity politics","johnson johnson","eli lilly","multiculturalism","business finance","biogen","howard lutnick","edi","bristol myers squibb","affirmative action","anti racism","diversity equity and inclusion"],"publisher":{"@type":"Organization","@context":"http://schema.org","name":"Quartz","url":"https://qz.com","logo":{"@type":"ImageObject","width":500,"url":"https://x.kinja-static.com/assets/images/logos/newsletter/quartz-500px.png"},"sameAs":["https://www.facebook.com/quartznews","https://www.youtube.com/channel/UC9f78Z5hgtDt0n8JWyfBk8Q","https://twitter.com/qz","https://instagram.com/qz"]},"video":[]}ByBruce GilPublishedFriday 11:29AMWe may earn a commission from links on this page.Pfizer logo is seen on Pfizer World Headquarters in Manhattan, New York, United States of America, on July 6th, 2024.Image: NurPhoto / Contributor (Getty Images)In This StoryPFE+0.52%BMY+0.57%JNJ+0.27%BIIB+0.07%LLY+0.84%Pfizer (PFE+0.52%) made some major changes to its diversity, equity, and inclusion (DEI) webpage on Thursday, joining other major American corporations that have recently aligned themselves closer with the Trump administration.Suggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkview videoNvidia's record earnings reveal just 3 customers make up 30% of revenueSuggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkNvidia's record earnings reveal just 3 customers make up 30% of revenueThe pharmaceutical giant pulled some language relating to diversity initiatives from its DEI page and placed a new emphasis on “merit.” The webpage’s title was changed from “Diversity, Equity, and Inclusion” to “Merit-Based Diversity, Equity, and Inclusion,” according to an archived version of the page from earlier this month. The company also added a new sentence to the page’s introduction paragraph: “Our culture of diversity, equity and inclusion is based on merit—one where hard work, talent, and contributions drive success, and barriers to opportunity are removed.”AdvertisementRelated ContentWalmart just became the biggest company to roll back its DEI initiatives6 big companies ditching DEI — and 6 that are sticking with itRelated ContentWalmart just became the biggest company to roll back its DEI initiatives6 big companies ditching DEI — and 6 that are sticking with itOther sections of the webpage underwent similar changes. A section previously titled “Diversity in Our Global Supply” has been renamed “Inclusive Supplier Strategy.” The paragraph under this heading now states, “All areas of our business groups are dedicated to finding and selecting the best suppliers,” replacing the previous language that emphasized advancing DEI. AdvertisementPfizer did not immediately respond to a request for comment from Quartz. However, a company spokesperson told STAT News, which first reported the changes, “We constantly update and evolve the content and design of our website to reflect our current programs, initiatives, and commitments.”AdvertisementThe changes come as the pharma industry is recalibrating its public approach to DEI and aligning itself closer to the new administration. CEOs of major drugmakers reportedly met with Trump earlier this month. Bristol Myers Squibb (BMY+0.57%), Johnson & Johnson (JNJ+0.27%), and Biogen (BIIB+0.07%) have also recently removed references to DEI from their annual reports, according to Bloomberg. The Trump administration is attempting to eliminate diversity programs across public and private sectors, including at public schools and in the military. Meanwhile, Eli Lilly (LLY+0.84%) CEO David Ricks, alongside Commerce Secretary Howard Lutnick, announced this week that the company plans to invest $27 billion in four new manufacturing sites in the United States. In an interview on Wednesday, the executive simultaneously called for “extended or improved” tax cuts.📬 Sign up for the Daily BriefOur free, fast, and fun briefing on the global economy, delivered every weekday morning.'''
