title = "Amazon takes on Google and Microsoft with new quantum computing chip"
description = "Amazon said its prototype chip, Ocelot, can reduce error correction costs by up to 90%"
full_description = '''{"@type":"NewsArticle","@context":"http://schema.org","url":"https://qz.com/amazon-unveil-quantum-computing-chip-ocelot-aws-qubits-1851766663","author":[{"@type":"Person","name":"Britney Nguyen"}],"headline":"Google, Microsoft, and now Amazon: The quantum computing race is heating up","description":"Amazon said its prototype chip, Ocelot, can reduce error correction costs by up to 90%","dateline":"02/27/2025 at 06:00","datePublished":"2025-02-27T06:00:00-05:00","dateModified":"2025-02-27T08:41:02-05:00","mainEntityOfPage":{"@type":"WebPage","url":"https://qz.com/amazon-unveil-quantum-computing-chip-ocelot-aws-qubits-1851766663"},"mentions":[{"@type":"Corporation","@context":"http://schema.org","name":"Amazon.com Inc.","tickerSymbol":"AMZN","url":"https://qz.com/quote/AMZN"},{"@type":"Corporation","@context":"http://schema.org","name":"Alphabet Inc.","tickerSymbol":"GOOGL","url":"https://qz.com/quote/GOOGL"},{"@type":"Corporation","@context":"http://schema.org","name":"Microsoft Corporation","tickerSymbol":"MSFT","url":"https://qz.com/quote/MSFT"}],"image":{"@type":"ImageObject","height":675,"width":1200,"url":"https://i.kinja-img.com/image/upload/c_fill,h_675,pg_1,q_80,w_1200/4440ed74a48c00b188bb07e2f47b0020.jpg","thumbnail":{"@type":"ImageObject","height":180,"width":320,"url":"https://i.kinja-img.com/image/upload/c_fill,h_180,pg_1,q_80,w_320/4440ed74a48c00b188bb07e2f47b0020.jpg"}},"isAccessibleForFree":"False","hasPart":{"@type":"WebPageElement","isAccessibleForFree":"False","cssSelector":".js_regwalled-content"},"articleBody":"Amazon (AMZN) Web Services has unveiled its first-ever quantum computing chip that it said is a step toward building practical quantum computers at scale.\n\nThe tech giant said it designed Ocelot — a small-scale prototype chip — to test its quantum error correction architecture. \n\nUnlike classical computers which use binary bits, quantum computers use quantum bits — or qubits — which are usually electrons, photons, or another subatomic particle. Connected together, qubits have far more processing power than binary 0s and 1s because they can be 0 and 1 at the same time in a state called superposition. The more qubits that are used, however, the more errors usually occur in a computation, which is costly to fix and makes quantum less appealing to commercialization efforts.\n\nAmazon said it designed the chip to implement quantum error correction in an efficient and scalable way that can reduce the additional qubits needed for the process by up to 90%.\n\nOcelot uses cat qubits, Amazon said — a type of qubit technology that has “inherent protection against bit-flip errors,” which is one of the two types of errors quantum systems can face. With cat qubits, the company said it has shown that this kind of technology can fit on a microchip with other components of quantum error correction.\n\n“We believe that Ocelot’s architecture, with its hardware-efficient approach to error correction, positions us well to tackle the next phase of quantum computing: learning how to scale,” Fernando Brandão, head of quantum algorithms at AWS, and Oskar Painter, head of quantum hardware at AWS, said in a statement. “Using a hardware-efficient approach will allow us to more quickly and cost effectively achieve an error-corrected quantum computer that benefits society.”\n\nLast week, Microsoft (MSFT) announced its first quantum computing chip, Majorana 1, built with “topological superconductors” or “topoconductors” — a novel material that enabled the company to create a new state of matter called “topological superconductivity.”\n\nThe new state of matter, which Microsoft has worked on for almost two decades, makes it possible for quantum systems to scale to one million qubits on a single, hand-sized chip, the company said, adding that it has demonstrated the world’s first topological qubit and already placed eight on Majorana 1. At one million qubits, a quantum computer could perform far more difficult calculations than traditional computers with higher accuracy.\n\nGoogle (GOOGL) also announced a quantum computing chip called Willow in December, which it said demonstrated two “major achievements” in quantum computing. Willow was able to “exponentially” reduce the rate of errors when adding more qubits and performed a computation in under five minutes. According to the company, this same computation would take Frontier, currently considered the world’s fastest supercomputer and operated by the Oak Ridge National Laboratory and U.S. Department of Energy, 10 septillion years to solve.\n\n","articleSection":"quantum computing","keywords":["quantum computing","microsoft","google","amazon","physical and logical qubits","willow","microsoft azure quantum","fernando brandao","oskar painter","oak ridge national laboratory","us department of energy","topological quantum computer","quantum network","quantum error correction","majorana 1","technology internet","qubit"],"publisher":{"@type":"Organization","@context":"http://schema.org","name":"Quartz","url":"https://qz.com","logo":{"@type":"ImageObject","width":500,"url":"https://x.kinja-static.com/assets/images/logos/newsletter/quartz-500px.png"},"sameAs":["https://www.facebook.com/quartznews","https://www.youtube.com/channel/UC9f78Z5hgtDt0n8JWyfBk8Q","https://twitter.com/qz","https://instagram.com/qz"]},"video":[]}ByBritney NguyenUpdatedThursday 8:41AMWe may earn a commission from links on this page.Amazon Web Services’ first-generation quantum chip, Ocelot, developed by the AWS Center for Quantum Computing in Pasadena, California.Image: AWSIn This StoryAMZN+0.25%MSFT0.00%GOOGL+0.12%Amazon (AMZN+0.25%) Web Services has unveiled its first-ever quantum computing chip that it said is a step toward building practical quantum computers at scale.Suggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkview videoNvidia's record earnings reveal just 3 customers make up 30% of revenueSuggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkNvidia's record earnings reveal just 3 customers make up 30% of revenueThe tech giant said it designed Ocelot — a small-scale prototype chip — to test its quantum error correction architecture. AdvertisementRelated ContentAmazon stock is up as its AI platform stands to challenge Google and Microsoft'sAmazon’s AI cloud dominance is getting chipped away by rivalsRelated ContentAmazon stock is up as its AI platform stands to challenge Google and Microsoft'sAmazon’s AI cloud dominance is getting chipped away by rivalsUnlike classical computers which use binary bits, quantum computers use quantum bits — or qubits — which are usually electrons, photons, or another subatomic particle. Connected together, qubits have far more processing power than binary 0s and 1s because they can be 0 and 1 at the same time in a state called superposition. The more qubits that are used, however, the more errors usually occur in a computation, which is costly to fix and makes quantum less appealing to commercialization efforts.AdvertisementAmazon said it designed the chip to implement quantum error correction in an efficient and scalable way that can reduce the additional qubits needed for the process by up to 90%.AdvertisementOcelot uses cat qubits, Amazon said — a type of qubit technology that has “inherent protection against bit-flip errors,” which is one of the two types of errors quantum systems can face. With cat qubits, the company said it has shown that this kind of technology can fit on a microchip with other components of quantum error correction.“We believe that Ocelot’s architecture, with its hardware-efficient approach to error correction, positions us well to tackle the next phase of quantum computing: learning how to scale,” Fernando Brandão, head of quantum algorithms at AWS, and Oskar Painter, head of quantum hardware at AWS, said in a statement. “Using a hardware-efficient approach will allow us to more quickly and cost effectively achieve an error-corrected quantum computer that benefits society.”AdvertisementLast week, Microsoft (MSFT0.00%) announced its first quantum computing chip, Majorana 1, built with “topological superconductors” or “topoconductors” — a novel material that enabled the company to create a new state of matter called “topological superconductivity.”The new state of matter, which Microsoft has worked on for almost two decades, makes it possible for quantum systems to scale to one million qubits on a single, hand-sized chip, the company said, adding that it has demonstrated the world’s first topological qubit and already placed eight on Majorana 1. At one million qubits, a quantum computer could perform far more difficult calculations than traditional computers with higher accuracy.AdvertisementGoogle (GOOGL+0.12%) also announced a quantum computing chip called Willow in December, which it said demonstrated two “major achievements” in quantum computing. Willow was able to “exponentially” reduce the rate of errors when adding more qubits and performed a computation in under five minutes. According to the company, this same computation would take Frontier, currently considered the world’s fastest supercomputer and operated by the Oak Ridge National Laboratory and U.S. Department of Energy, 10 septillion years to solve.📬 Sign up for the Daily BriefOur free, fast, and fun briefing on the global economy, delivered every weekday morning.'''
