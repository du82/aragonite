["https://qz.com/nvidia-4q-earnings-ai-chips-blackwell-deepseek-1851766451"]
title = "Nvidia Q4 FY2025 earnings beat expectations on AI chip demand"
description = "The chipmaker reported record revenue, and set fiscal first quarter guidance at $43 billion"
full_description = '''{"@type":"NewsArticle","@context":"http://schema.org","url":"https://qz.com/nvidia-4q-earnings-ai-chips-blackwell-deepseek-1851766451","author":[{"@type":"Person","name":"Britney Nguyen"}],"headline":"Nvidia beats earnings expectations on Blackwell AI chip demand","description":"The chipmaker reported record revenue, and set fiscal first quarter guidance at $43 billion","dateline":"02/26/2025 at 16:40","datePublished":"2025-02-26T16:40:00-05:00","dateModified":"2025-02-26T17:45:00-05:00","mainEntityOfPage":{"@type":"WebPage","url":"https://qz.com/nvidia-4q-earnings-ai-chips-blackwell-deepseek-1851766451"},"mentions":[{"@type":"Corporation","@context":"http://schema.org","name":"NVIDIA Corporation","tickerSymbol":"NVDA","url":"https://qz.com/quote/NVDA"}],"image":{"@type":"ImageObject","height":675,"width":1200,"url":"https://i.kinja-img.com/image/upload/c_fill,h_675,pg_1,q_80,w_1200/005de620bf5c1e0b02c2cb02867a8bf1.jpg","thumbnail":{"@type":"ImageObject","height":180,"width":320,"url":"https://i.kinja-img.com/image/upload/c_fill,h_180,pg_1,q_80,w_320/005de620bf5c1e0b02c2cb02867a8bf1.jpg"}},"isAccessibleForFree":"False","hasPart":{"@type":"WebPageElement","isAccessibleForFree":"False","cssSelector":".js_regwalled-content"},"articleBody":"Nvidia’s (NVDA) revenue and outlook topped analysts’ expectations, driven by demand for its new Blackwell chips. The stock fluctuated in after-hours trading after closing up 3.7%.\n\nThe chipmaker reported revenue of $39.3 billion for its fiscal fourth quarter — a 78% increase from the previous year and an all-time high. Consensus had been for $38.1 billion. Net income was $22 billion for earnings per share of 89 cents, also beats. Nvidia’s full-year revenue more than doubled year over year to $130.5 billion.\n\nRevenue guidance for the first quarter of the current fiscal year was set at $43 billion, plus or minus 2% — also above Wall Street’s expectations of $42 billion.\n\n“We’ve successfully ramped up the massive-scale production of Blackwell AI supercomputers, achieving billions of dollars in sales in its first quarter,” Nvidia CEO Jensen Huang said in a statement. He called demand for the new chips “amazing” as companies roll out reasoning AI models. \n\nThe company’s gross margins will be in the low 70s, but is expected to return to the mid-70s later in the fiscal year as Blackwell fully ramps up, CFO Colette Kress said on Nvidia’s earnings call.\n\nNvidia’s data center revenue rose 93% year on year to a record $35.6 billion last quarter. However, data center sales in China remain low due to restrictions, Kress said, adding that the company will continue complying with chip export controls.\n\nAhead of the earnings, analysts were optimistic that the chipmaker would beat expectations and raise its outlook as it ramps up production of its Blackwell chips — despite shockwaves from Chinese artificial intelligence startup DeepSeek.\n\nIn December, Hangzhou-based DeepSeek released a model it said cost just $5.6 million to train and develop on Nvidia’s reduced-capability H800 chips. The startup’s powerful reasoning model, R1, spooked investors in January, causing Nvidia’s stock to plunge 17%, wiping out nearly $600 billion in value — a record loss for a U.S. company.\n\n“Nvidia’s upcoming earnings will crush the DeepSeek anxiety,” Kevin Cook, senior stock strategist at Zacks Investment Research, told Quartz ahead of the results. The company dominates “the technology stack that enterprises want and the next stacks they don’t even know they need yet.” \n\nEncouraging updates on production and shipments of the Blackwell platform will probably move the stock, Kunjan Sobhani, lead semiconductor analyst at Bloomberg Intelligence, told Quartz ahead of earnings. Investors are wary of a potential “air pocket” in growth between the first and second quarters of the current fiscal year as customers move to Blackwell from Hopper, he said.\n\n“That is the spot when the Hopper shipments could really come down, and the Blackwell ramp — from a quarter to quarter perspective — might not be enough to show significant sequential growth,” Sobhani said, adding that Blackwell could “catch up in the second half.”\n\nFor Nvidia’s reputation and valuation, “the sequential expectations matter,” Sobhani said. “If they say something which agitates this sort of concern further, that could imply temporary volatility in the sentiment and the stock.”\n\n","articleSection":"nvidia","keywords":["nvidia","blackwell","deepseek","business finance","h800","hopper","blackwell chips","colette kress","bloomberg","intel","kevin cook","h800 chips","jensen huang","kunjan sobhani","earnings call"],"publisher":{"@type":"Organization","@context":"http://schema.org","name":"Quartz","url":"https://qz.com","logo":{"@type":"ImageObject","width":500,"url":"https://x.kinja-static.com/assets/images/logos/newsletter/quartz-500px.png"},"sameAs":["https://www.facebook.com/quartznews","https://www.youtube.com/channel/UC9f78Z5hgtDt0n8JWyfBk8Q","https://twitter.com/qz","https://instagram.com/qz"]},"video":[]}ByBritney NguyenUpdatedWednesday 5:45PMWe may earn a commission from links on this page.Nvidia CEO Jensen Huang in Taipei on June 2, 2024.Photo: Annabelle Chih/Bloomberg (Getty Images)In This StoryNVDA+1.66%Nvidia’s (NVDA+1.66%) revenue and outlook topped analysts’ expectations, driven by demand for its new Blackwell chips. The stock fluctuated in after-hours trading after closing up 3.7%.Suggested ReadingThe best golden visas, the happiest college students, and Selena Gomez's mansion: Lifestyle roundupApple's DEI defense, Nvidia's earnings beat, and Amazon's quantum chip: Tech news roundupBitcoin spirals, Microsoft slips, and the best states for property taxes: Markets news roundupNvidia's record earnings reveal just 3 customers make up 30% of revenue CCShare SubtitlesOffEnglishShare this VideoFacebookTwitterEmailRedditLinkview videoNvidia's record earnings reveal just 3 customers make up 