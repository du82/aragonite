title = "Eli Lilly's investment, cheaper Zepbound, Hims & Hers: Pharma news"
description = "Plus, Moderna's bird flu contract with the U.S. is being evaluated"
full_description = '''{"@type":"NewsArticle","@context":"http://schema.org","url":"https://qz.com/eli-lilly-zepbound-hims-hers-1851766914","author":[{"@type":"Person","name":"Bruce Gil"}],"headline":"Eli Lilly's big investment, cheaper Zepbound, and what's next for Hims & Hers: Pharma news roundup","description":"Plus, Moderna's bird flu contract with the U.S. is being evaluated","dateline":"02/28/2025 at 05:00","datePublished":"2025-02-28T05:00:00-05:00","dateModified":"2025-02-28T09:46:30-05:00","mainEntityOfPage":{"@type":"WebPage","url":"https://qz.com/eli-lilly-zepbound-hims-hers-1851766914"},"mentions":[{"@type":"Corporation","@context":"http://schema.org","name":"Hims & Hers Health Inc. Class A","tickerSymbol":"HIMS","url":"https://qz.com/quote/HIMS"},{"@type":"Corporation","@context":"http://schema.org","name":"Eli Lilly and Company","tickerSymbol":"LLY","url":"https://qz.com/quote/LLY"},{"@type":"Corporation","@context":"http://schema.org","name":"Moderna Inc.","tickerSymbol":"MRNA","url":"https://qz.com/quote/MRNA"},{"@type":"Corporation","@context":"http://schema.org","name":"Novo Nordisk A/S","tickerSymbol":"NVO","url":"https://qz.com/quote/NVO"}],"image":{"@type":"ImageObject","height":675,"width":1200,"url":"https://i.kinja-img.com/image/upload/c_fill,h_675,pg_1,q_80,w_1200/05906fc0c8ad054bcae8849fb3ef84c4.jpg","thumbnail":{"@type":"ImageObject","height":180,"width":320,"url":"https://i.kinja-img.com/image/upload/c_fill,h_180,pg_1,q_80,w_320/05906fc0c8ad054bcae8849fb3ef84c4.jpg"}},"isAccessibleForFree":"False","hasPart":{"@type":"WebPageElement","isAccessibleForFree":"False","cssSelector":".js_regwalled-content"},"articleBody":"Eli Lilly announced plans to invest $27 billion in four new manufacturing sites in the United States. The pharma giant also made a wider range of doses of its blockbuster weight-loss drug Zepbound available in vials and at lower prices. Meanwhile, Hims &amp; Hers, which profited heavily last year from selling an off-brand version of Ozempic, is now exploring alternative options after being forced to halt sales.\n\nCheck out those stories and more pharmaceutical news highlights from this week.\n\nEli Lilly wants to make drugs in America. First it wants a tax cut\n\nEli Lilly (LLY), the maker of the blockbuster weight-loss drug Zepbound, announced Wednesday that it plans to invest $27 billion in four new manufacturing sites in the United States. But the company made it clear that those plans hinge on tax cuts. The new sites could create 3,000 permanent jobs and nearly 10,000 construction jobs, Eli Lilly said; the facilities would focus on producing active pharmaceutical ingredients (APIs) — the main ingredient in drugs, which the industry currently sources largely from China and other countries.\n\nRead More\n\nModerna’s bird flu vaccine has a problem\n\nA $590 million contract awarded to Moderna (MRNA) by the U.S. government to aid in vaccine development for bird flu is being reevaluated, according to Bloomberg News. Bloomberg reports that the review is part of a government effort to re-examine spending on RNA-based vaccines, which is based on the same science that underpinned Moderna’s Covid vaccine. The vaccine contract was announced by the Department of Health and Human Services in the final days of the Biden administration. Vaccine-skeptic Robert Kennedy Jr. — a politician and lawyer, not a medical professional — now leads HHS.\n\nRead More\n\nOff-brand weight loss drug makers are suing the FDA again\n\nA group that represents pharmacies that have been producing off-brand versions of GLP-1 weight-loss drugs just filed another lawsuit against the U.S. Food and Drug Administration (FDA). This time, it’s over the health regulator’s decision to remove semaglutide — the active ingredient in Novo Nordisk’s (NVO) popular Ozempic and Wegovy treatments — from its drug shortage list. Semaglutide has been on the agency’s shortage list since March 2022. During this time, pharmacies, telehealth companies, and other healthcare providers have been able to make and sell what are known as compounded versions of the drug. In its lawsuit, the Outsourcing Facility Association (OFA) claims that the agency is “dismissing evidence that the shortage persists” and that its decision will “deprive patients of a vital treatment.”\n\nRead More\n\nHims &amp; Hers can’t sell off-brand Ozempic forever. But it can still sell these weight loss drugs\n\nHims &amp; Hers (HIMS) made a killing last year selling an off-brand version of Ozempic, but with the drug’s shortage now declared over by the FDA, the company will soon have to halt sales of its cheaper alternative. That said, the millennial-focused telehealth company still has a few options on the table. \n\nRead More\n\nEli Lilly is making more doses of Zepbound cheaper\n\nEli Lilly (LLY) is making more doses of its blockbuster weight-loss drug Zepbound available in vials and at lower prices. The pharma giant announced on Tuesday that it is now expanding its single-dose vial offerings of Zepbound to include higher doses. Last August, Eli Lilly began selling the lowest doses of Zepbound — 2.5 mg and 5 mg — in vials rather than the standard auto-injector pen, cutting the price by about half. Now, it’s adding two higher doses to the mix and further reducing the price of the lower ones.\n\nRead More\n\nHims &amp; Hers will stop selling some weight loss drugs — and the stock plummets 27%\n\nHims &amp; Hers (HIMS) stock took a steep dive, dropping more than 27% Tuesday morning — even after the millennial-focused telehealth company reported soaring sales for 2024 just the night before. Hims &amp; Hers reported a striking 69% jump in sales for 2024, reaching $1.5 billion. But despite the strong growth, investors appear rattled by the looming loss of a key sales driver later this year.\n\nRead More\n\n","articleSection":"eli lilly","keywords":["eli lilly","zepbound","eli lilly and company","tirzepatide","health medical pharma","glp 1 receptor agonists","hims hers health","semaglutide","ro","research and development in the united states","anti obesity medication","moderna","pharmaceutical industry","peptide therapeutics","novo nordisk","us food and drug administration","peptide hormones","robert kennedy jr"],"publisher":{"@type":"Organization","@context":"http://schema.org","name":"Quartz","url":"https://qz.com","logo":{"@type":"ImageObject","width":500,"url":"https://x.kinja-static.com/assets/images/logos/newsletter/quartz-500px.png"},"sameAs":["https://www.facebook.com/quartznews","https://www.youtube.com/channel/UC9f78Z5hgtDt0n8JWyfBk8Q","https://twitter.com/qz","https://instagram.com/qz"]},"video":[]}PharmaEli Lilly's big investment, cheaper Zepbound, and what's next for Hims & Hers: Pharma news roundupPlus, Moderna's bird flu contract with the U.S. is being evaluatedByBruce GilPublishedFriday 5:00AMWe may earn a commission from links on this page.Start SlideshowStart SlideshowGraphic: Images: Bloomberg / Contributor, Cheng Xin, UCG / Contributor, Hims & HersEli Lilly announced plans to invest $27 billion in four new manufacturing sites in the United States. The pharma giant also made a wider range of doses of its blockbuster weight-loss drug Zepbound available in vials and at lower prices. Meanwhile, Hims & Hers, which profited heavily last year from selling an off-brand version of Ozempic, is now exploring alternative options after being forced to halt sales.AdvertisementCheck out those stories and more pharmaceutical news highlights from this week.AdvertisementPrevious SlideNext Slide2 / 8List slidesEli Lilly wants to make drugs in America. First it wants a tax cutList slidesEli Lilly wants to make drugs in America. First it wants a tax cutDavid Ricks, chief executive officer of Eli Lilly & Co., speaks during a presentation at the company’s manufacturing plant in Limerick, Ireland, on Thursday, Sept. 12, 2024. Image: Bloomberg / Contributor (Getty Images)Eli Lilly (LLY), the maker of the block