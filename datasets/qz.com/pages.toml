a attention from urban policy enthusiasts, when he spoke about growing up in an apartment subsidized by New York’s Mitchell-Lama Housing program.AdvertisementChalamet’s superstar status means it’s unlikely that he’ll be eligible for government subsidized housing in the near future. Given his current real estate portfolio, however, it’s also pretty unlikely that he’s losing sleep over it. In 2022, Chalamet purchased a Beverly Hills property from model Kate Upton and baseball player Justin Verlander for $10.9 million.The 5,521-square-foot home has a lengthy celebrity pedigree: before Upton and Verlander, saxophonist Kenny G owned the property. He subsequently sold the house to Pete Sapras, a two-time Grand Slam winning tennis player.The four bedroom, 4.5 bathroom home sits on a 1.5 acre lot, with a pool and a tennis court.AdvertisementPrevious SlideNext Slide5 / 7List slidesEdward NortonList slidesEdward NortonPhoto: Redfin.comEdward Norton received his fourth Academy Award nomination for his portrayal of folk singer Pete Seeger, in a “Complete Unknown.” After decades in the film industry, Norton primarily resides in Malibu – renting and then buying a 1920s cottage, which he put on the market in 2018.AdvertisementNorton didn’t move very far from his old home though – in 2017, he bought a different Malibu property for $11.8 million. The home in question is an architectural gem and a designated California State Cultural Landmark. Architect John Lautner designed the home, in the late 1960s, to resemble an ocean wave. The five bedroom, five bathroom property is 3,366 square feet and features 37 feet of ocean frontage.AdvertisementPrevious SlideNext Slide6 / 7List slidesDemi MooreList slidesDemi MoorePhoto: Paul Harris / Contributor (Getty Images)Demi Moore turned in a career re-defining performance in Coralie Fargeat’s body horror film “The Substance.” Moore won a Golden Globe for Best Actress in a Motion Picture Comedy or Musical and received an Oscar nomination for Best Actress in a Leading Role for her portrayal of aging celebrity Elisabeth Sparkle.AdvertisementOff screen, the actress has owned an array of properties, including a New York City studio apartment and a mansion in Beverly Hills. Pictured above is her Idaho ranch – Moore purchased property with her former husband Bruce Willis and retained ownership following their divorce. The six bedroom, eight bathroom ranch is located in Hailey, Idaho, on a 10.5 acre lot. Realtor.com (NWSA) estimates that the property is worth $3.6 million.Advertisement7 / 7List slidesList slidesPreviousStart over'''
