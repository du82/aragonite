["https://rachelandrew.co.uk/archives/2019/07/25/announcing-smashing-print-magazine"]
title = "Announcing Smashing Print Magazine – Rachel Andrew"
description = "Doing stuff on the web since 1996."
full_description = '''Announcing Smashing Print Magazine July 25, 2019 In Writing Life at Smashing Magazine never stops throwing new surprises and challenges my way. When I came on board as Editor in Chief of the online Smashing Magazine, I didn’t expect to find myself editing a print magazine. However here we are, with our very first edition of Smashing Print. Where the online magazine often covers very immediate subjects, technical topics that can be out of date in a few months, I wanted the content of the print magazine to be more timeless. Perhaps to capture a snapshot of where we are now. A take on today that would make interesting reading 10 or more years from now. We have headed right in with what I think is one of the biggest issues of the current few years, that of privacy and ethics. I chose authors who I knew had interesting things to say on the subject, but then let them choose how to fulfil the brief of writing on this subject. Reading the pieces as a collection I have enjoyed the places in which the different takes on the subjects meet and diverge, these essays raise as many questions as they provide answers and I hope that they make you think. This is essentially a pilot issue. We hope to be producing this in this format twice a year, assuming that the feedback is good! Taking a magazine to print is no small task for our little team, and we are all very excited to see what you make of it. You can read my editorial and Vitaly’s article in this preview PDF, or buy your copy here. It’s worth noting that Smashing Members will receive a copy included in their membership. Grid, content re-ordering and accessibility Get Ready For CSS Grid Layout – 2nd edition Leave a Reply Cancel replyComment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post's permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post's URL again. (Learn More) © 2025 Rachel Andrew'''
