full_description = "Hello I’m Rachel Andrew. I’m a technical writer at Google, where I’m content lead for web.dev and developer.chrome.com. I’ve written a bunch of books, a lot of articles, and work on a couple of CSS specifications at the CSS Working Group. I speak at conferences, most often about CSS these days. You can find out more about me, read what I’m working on now, or explore the archives of this site, which go back to 2001. Contact me here. This site… Is a redesign in progress. Apologies for any mess, as I move over 20 years of content around. © 2025 Rachel Andrew"
