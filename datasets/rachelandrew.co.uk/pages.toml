title = "2024 in review – Rachel Andrew"
description = "Doing stuff on the web since 1996."
full_description = '''2024 in review January 1, 2025 In Fitness, On life in general 2024 went fast, and this post looks back at some of the things that featured in another far too busy year. Work Life at Google has not got any less challenging or busy during 2024, but I’m proud of the things my team and I have achieved. Everything that ends up on web.dev or developer.chrome.com is written or edited by our small team of writers, supporting the broader DevRel team and other folks in Chrome. We had our first in-person meeting as a team this year, bringing the US-based folks to London, and it was a really great couple of days. We got to know each other better but also achieved so much in terms of ideas for the content, and future plans. I was promoted this year, which helped me feel slightly less of an imposter in the giant company. I’ve actually been at Google three years now, but still feel like a newbie in terms of operating within that kind of structure. I feel I’m at my best working at pace, being able to make rapid decisions and progress; holding fire while layers of decisions get made, is a frustration I’m having to learn to deal with. That said, I feel that my small company background of working within tight financial restrictions is helpful, coming into big tech at a time when there is less money around. I benefitted from another 6 months of manager coaching provided by Google, and returned to the same coach as last year. I’ve found that incredibly helpful in learning how to navigate things at Google and as a manager. Despite my role being far less about production work these days, I do get to do some writing. I enjoy pulling together my series celebrating what’s new on the web platform each month, and I’ve been able to publish content on some of the CSS layout things I’m involved with, including the ongoing masonry debate, and the reading-flow property. I’ve also had the opportunity to do some speaking, which you can read about in public speaking in 2024. Most of my CSS contributions remain something of a side project, though it’s far easier to progress things as part of the Chrome team than it was as an independent, and I’m supported in attending CSSWG meetings. I wrapped up 2024 by posting my thoughts on adding block direction overflow to level 2 of the multicol specifcation, and I’m continuing to work on reading-flow, you can now check out the demos using Chrome Canary. Life and fitness I’ve managed to avoid collecting more cats—Pixel, Max, and Em are still very much in charge in my house and sometimes show up in meetings. My daughter and I have been managing to catch up in the gaps in both of our busy schedules. I’ve traveled a fair bit this year, though nothing like I did in the days before the pandemic. I still enjoy travel, but with a very fulltime job that involves a lot of meetings it’s hard work keeping up with everything on the road. Having met my goal of running 1300 miles in 2023, I decided to run 1400 in 2024 and achieved this while running the “Southville Robin” Strava art route the day after Christmas. I’m proud of hitting these goals, and of how much I’m fallen in love with running again once I decided not to worry about getting faster, and instead just aim to be consistent. I’ve run in some beautiful places too, getting a chance to explore these places I travel to. It’s hard to pick favourite locations but the Olympic Forest Park in Beijing, and round the harbour in San Diego were both pretty cool. I’ve created an album on Flickr of my favourite photos taken on a run during 2024. San Diego harbour at sunrise The Olympic Forest Park in Beijing I’ve been dealing with increasing pain in my arm and shoulder, which I thought might lead to more surgery. I’ve had a chat to the surgeon and a bunch of tests, and we’ve decided to try to take a non-surgical route initially on my shoulder. Given that I’ve basically dragged it out of place myself, maybe I can drag it back in. I start physiotherapy in January to try and sort it out. I’ve rediscovered sewing this year. In my teens I was a reasonable dressmaker, enough that people paid me to make costumes. I’ve entered modernity by purchasing a computerized sewing machine, which is quite the upgrade from my 1970s machine that’s actually older than I am. The nerve damage in my dominant hand means that a lot of craft activities that involve fine motor skills are hard for me to do, but machine sewing is fine. I’ve also discovered that I can use a cutting wheel left handed (scissors are one thing I still struggle to use left handed) which helps a lot. So far I’ve made some simple clothes (tracksuit bottoms, pyjamas, and a straightforward top) along with some bags and baskets—Sotak Handmade has some lovely patterns. I’m still in Bristol, but planning a move back up North. I’ve been stalking the local Facebook groups of the towns I’m keen on living in, to get a sense of what these places are like now. It’s been almost 30 years since I moved away from the North-East, a lot has changed! However, it’s where I’d ultimately like to be, and as it wouldn’t make much difference in terms of travel to the London office or further afield, the only thing stopping me is that moving is such a giant hassle. #review Public speaking in 2024 Blog questions challenge Likes 👍 Gaz Shaw Leave a Reply Cancel replyComment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post's permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post's URL again. (Learn More) © 2025 Rachel Andrew'''
