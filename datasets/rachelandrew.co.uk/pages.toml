["https://rachelandrew.co.uk/archives/2022/07/31/a-new-home-for-this-site"]
title = "A new home for this site – Rachel Andrew"
description = "Doing stuff on the web since 1996."
full_description = '''A new home for this site July 31, 2022 In On life in general At work, I’ve recently spent a good chunk of my time moving content off legacy sites to the current ones, including making my manager sad by finally pulling the plug on HTML5Rocks. I figured I might as well do the same during my weekends, so have moved my blog archive, so I can begin posting again. As I have negative amounts of free time right now, I decided to go with the simplest option of importing everything into WordPress, hosting it on WP Engine, and using a simple theme. I’m intrigued to see what WordPress is like after my ten year absence. I also feel there is also a benefit to using such a widely used tool, given my job is to provide resources for developers. I’ve also pulled in a bunch of posts that relate to that time I smashed up my arm, which were on a separate blog that only had a few posts on it. At one point I wanted to separate the personal and the work-related, partly due to working freelance and my site being something of my shop window in terms of getting work. I don’t feel as if that matters so much now. I imagine something is broken, I’ll tidy it up as I spot things, but I’m glad to have my site back up and running as a place to write for myself again. 2021 in review Stop treating all of your content as if it were news Leave a Reply Cancel replyComment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post's permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post's URL again. (Learn More) © 2025 Rachel Andrew'''
