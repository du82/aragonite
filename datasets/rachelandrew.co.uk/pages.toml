full_description = '''Get Ready for CSS Grid Layout January 7, 2016 In Web stuff, Writing I’m very happy to be announcing my latest book today – Get Ready For CSS Grid Layout. As regular readers of this blog will know, I’ve spent a fair amount of time over the last few years experimenting with the emerging CSS Grid Layout specification. So when the possibility of writing a short book introducing the specification for A Book Apart came up, I was very keen to do so. I’ve worked as a technical editor for A Book Apart, write and edit for A List Apart and have been getting people excited about Grid Layout from the An Event Apart stage in 2015 (and will be doing so again this year). Writing for A Book Apart seemed a natural fit. Even more so, when I discovered they were launching a range of Briefs books. Briefs will be published as ebook only – perfect for introducing a topic in a concise way. Get Ready for CSS Grid Layout is an introduction to Grid Layout, with just the information you need to start exploring the spec and seeing how it will fit into your workflow in future. By giving you the basics in a quick to read format I hope to get you up to speed so that when Grid lands in browsers you’ll be ahead of the curve and ready to take advantage of it. Alongside my book is Pricing Design by Dan Mall. A great guide to pricing – a subject that I know a lot of designers find really tricky. These Briefs are a natural addition to the range of A Book Apart books. I’m looking forward to seeing what else they have in store. 2015 in Review A Review of Gauges – real-time web analytics One Comment Zlate (Author) January 22, 2016 Reply I’m intrigued to read, yet first I wanted to peak what’s the methodology behind the grid layouts explicated in the booklet. Is it based on the new Flexbox model or something different? Leave a Reply Cancel replyComment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Δdocument.getElementById( "ak_js