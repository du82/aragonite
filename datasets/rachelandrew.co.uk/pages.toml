full_description = "Books I love to write about the web, and to teach people through the structured format of a book. In addition to writing books I also act as a technical editor for other writers. I have written 23 books as a solo or co-author since 2002, many of these are detailed below. The New CSS Layout CSS Grid Layout will transform the way the you design and develop for the web—and Rachel Andrew will change the way you grok the spec. Learn to use Grid Layout within a system that includes existing methods to perform the tasks they were designed for—and take advantage of this pivotal moment in the evolution of layout. Published by A Book ApartAuthors: Rachel AndrewPublication date: October 2017Buy now! HTML5 for Web Designers Harness the power of this essential evolving spec with help from Jeremy Keith and Rachel Andrew. Brush up on syntax and updated elements, and get ready to work with responsive images, microformats, and microdata. Published by A Book ApartAuthors: Jeremy Keith and Rachel AndrewBuy nowPublication date: February 2016 Get Ready for CSS Grid Layout Get Ready For CSS Grid LayoutMove out in front of the curve and learn how to use CSS Grid Layout today. Learn exactly what you need to know, from line-based positioning basics to evaluating template areas, with a detailed explanation of the new spec. Published by A Book ApartBuy nowPublication date: January 2016 Older books The Profitable Side Project Handbook: A practical guide to developing a product business alongside your existing work. Publication date: January 2014 CSS3 Layout Modules: This pocket guide introduces some of the latest techniques for CSS layout. Publication date: August 2014 The Smashing Book 4 – New Perspectives on Web Design: Another beautifully produced multiple author book From Smashing Magazine. My chapter is on providing technical support. Published by Smashing Magazine, Publication date: November 2013. The CSS3 Anthology (4th Edition): Retitled The CSS3 Anthology, this is the 4th edition of my popular book of CSS tips and tricks.Published by SitePoint. Publication date: March 2012. The Smashing Book 3 – Redesign the Web: This is a multiple author book on the subject of redesign. Each author wrote a chapter on a subject relating to the theme. My chapter being on Selecting a Platform. Published by Smashing Magazine. Publication date: May 2012 The CSS Anthology 3rd Edition: Third edition of this bestselling CSS book. Published by SitePoint. Publication date: August 2009. Everything You Know About CSS is Wrong: With rising take-up launch of Internet Explorer 8, we have a new tool in our toolkit of CSS layout techniques – CSS tables. In this book I explore how you can use CSS tables to simplify CSS layouts.Published by SitePoint. Authors: Rachel Andrew, Kevin Yank. Publication date: October 2008. HTML Utopia: Designing Without Tables Using CSS, 2nd Edition: This completely revised and expanded second edition includes new techniques for laying out your web pages using positional CSS, and makes crafting beautiful, accessible and maintainable websites a snap. Published by SitePoint Authors: Rachel Andrew and Dan Shafer Publication date: April 2006. Build Your Own Standards Compliant Website Using Dreamweaver 8: In Build Your Own Standards Compliant Website Using Dreamweaver 8, I guide you, step-by-step, through the process of creating a complete, flexible, and easy-to-maintain site in strict XHTML and CSS using Dreamweaver. Published by SitePoint. Publication date: September 2005. The CSS Anthology 2nd Edition: Second edition of my CSS Anthology, revised and updated. Published by SitePoint. Publication date: August 2007. The CSS Anthology 1st Edition: The CSS Anthology: 101 Essential Tips, Tricks & Hacks is ideal for experienced Web designers who would like to add sparkle to their existing designs, as well as newcomers who want to learn Web design the right way the first time. Published by SitePoint. Publication date: August 2004. ASP.NET Web Development with Macromedia Dreamweaver MX 2004: This concise, no-nonsense book teaches you how to develop accessible, standards-compliant ASP.NET-driven web sites with the latest technologies: ASP.NET and Macromedia Dreamweaver MX 2004. Published by Apress. Authors: Costas Hadjisotiriou, Kevin Marshall, Rachel Andrew. Publication date: April 2004. ASP Web Development with Macromedia Dreamweaver MX 2004: This is a no-nonsense book that teaches the reader how to develop accessible, standards compliant ASP-driven web sites using ASP and Macromedia Dreamweaver MX. Published by Apress. Authors: Rachel Andrew, Rob Turnbull, Alan Foley, Drew McLellan. Publication date: February 2004. PHP Web Development with Macromedia Dreamweaver MX 2004: PHP Web Development with Macromedia Dreamweaver MX 2004 presents real-world tutorials so you can expect fast results as you progress through the book. Published by Apress. Authors: Rachel Andrew, Allan Kent, David Powers. Publication date: July 2004. Dreamweaver MX 2004 Design Projects: Dreamweaver MX 2004 Design Projects takes you through the process of creating four real-world case studies, enabling you to take your Dreamweaver skills to a new level. Published by Friends of Ed. Authors: Rachel Andrew, Craig Grannell, Allan Kent, Christopher Schmitt. Publication date: October 2004. The Dreamweaver Developer’s Instant Troubleshooter: Solving the most common problems faced by Dreamweaver users with the aid of some of the most respected names in the community. Published by Apress. Authors: Rachel Andrew, Gareth Downes-Powell, Nancy Gill, Kevin Marshall, Drew McLellan. Publication date: July 2003. Dreamweaver MX Design Projects: We gave four web professionals a design brief: we asked them each to plan, design, and implement a specific type of web site, then write up all their design and development considerations. Published by Glasshaus. Authors: Rachel Andrew, Christopher Schmitt, Allan Kent, Craig Grannell. Publication date: January 2003. Fundamental Web Design and Development Skills: If you’re considering a career in web development, this unrivalled book will provide you with all the core skills you need. Published by Glasshaus. Authors: Rachel Andrew, Crystal Waters, Chris Ullman. Publication date: September 2003. Dynamic Dreamweaver MX: It’s now possible to use Dreamweaver to produce dynamic, creative, visually stunning sites that comply with web standards and accessibility laws. Published by Glasshaus. Authors: Rachel Andrew, Alan Foley, Omar Elbaga, Rob Turnbull, Bob Regan. Publication date: July 2002. © 2025 Rachel Andrew"
