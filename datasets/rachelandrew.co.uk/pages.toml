["https://rachelandrew.co.uk/archives/2022/12/23/thank-you-an-event-apart"]
title = "Thank you An Event Apart – Rachel Andrew"
description = "Doing stuff on the web since 1996."
full_description = '''Thank you An Event Apart December 23, 2022 In Speaking With Eric Meyer at An Event Apart in 2016. Photo by Jeffrey Zeldman. It’s Christmas Eve Eve, and I was adding the last of my expenses into Concur, when my work email account received a message. My colleagues, being more sensible than me, have vanished, so I checked just in case there was some actual content-related emergency. It was an email from Eric Meyer, informing me that An Event Apart had ended its 17-year run. The conference in San Francisco, which I had just spoken at, was to be the last. I can’t explain how significant my involvement with An Event Apart has been to my career and for the things I care about. I’m so, so sad right now. I’m sometimes credited with spreading the word about CSS Grid, but without An Event Apart, that effort would never have gotten off the ground. They handed me a soapbox, and I made good use of it, but I needed that push. I gave my CSS Grid talk for over a year, a veritable Ship of Theseus. I rewrote chunks of it while sitting in the show’s audience, as the spec or implementation changed the day before my talk. Speaking with audience members afterward helped me refine how I explained things and gave me feedback for the CSS Working Group. They gave me space to unpack ideas that still aren’t a reality, as in my talk about overflow, which was essentially an exploration of a way to enable CSS Regions. I intend to return to those ideas in 2023, partly due to discussions at the conference in San Francisco this year. The team at An Event Apart put their trust in me to deliver, and I hope I did. I worked through so many of my ideas of their stages and in the conversations with attendees. I met people who are my friends, colleagues, and co-conspirators for the open web platform. I always thought they would be running these shows forever. Eventually, I’d be irrelevant and not asked to speak, so I’d find some reason to show up in the city and say hi anyway. Thank you Eric, Jeffrey, and the rest of the An Event Apart crew. I loved working with you. Thank you for letting me speak my brains on your stage; it helped me more than you can ever know. Thank you for being exemplary in the way you cared about quality and how you cared for the speakers at your events. Thank you for your love of web standards and the web platform. Thank you. Stop treating all of your content as if it were news 2022 in review One Comment Eric Meyer December 23, 2022 Reply Thank YOU, Rachel, for everything you brought to the stage, to your work, and to all of us at AEA. We’ll hugely miss our times together. Leave a Reply Cancel replyComment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post's permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post's URL again. (Learn More) © 2025 Rachel Andrew'''
