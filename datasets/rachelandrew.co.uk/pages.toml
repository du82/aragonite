["https://rachelandrew.co.uk/writing"]
title = "Writing about the business of web development for A List Apart – Rachel Andrew"
description = "Doing stuff on the web since 1996."
full_description = '''Writing about the business of web development for A List Apart May 10, 2013 In Business, Writing I have been a reader of A List Apart for almost as long as I have been a web developer. I have always enjoyed their approach to writing for the web, giving space for opinion and new ideas rather than just “how to” articles. So I am very excited about my new column, launched with my first article yesterday – You Can’t Do Everything. If you read this blog or follow me on Twitter you will know that I enjoy talking and writing about the business side of the work that I do. Like most of us, I ended up running a business because I wanted to do web development. I’ve had to learn business skills as I went along. Over 11 years after founding edgeofmyseat.com, I’m in the position of having run a successful services business that transitioned to a product business. I’ll be using my column to write about the things I have learned – and am still learning – along the way. The best 5K ever Shipping your product – the workshop Leave a Reply Cancel replyComment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post's permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post's URL again. (Learn More) © 2025 Rachel Andrew'''
