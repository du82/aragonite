["https://rachelandrew.co.uk/archives/2013/06/23/dear-apple-i-am-not-a-freak"]
title = "Dear Apple, I am not a freak. – Rachel Andrew"
description = "Doing stuff on the web since 1996."
full_description = '''Dear Apple, I am not a freak. June 23, 2013 In Links and online oddities I am interested in running and cycling. As a web developer I am interested in the latest tech news and gadgets. As a business owner and a writer I need to keep up with the latest tech and business news. So why does Apple newsstand think I might want to read fashion, slimming and celebrity gossip? Ah yes, that would be because I am a woman. Magazines “for Her” this morning contained a selection of celebrity gossip, slimming, fashion and home styling magazines. In the “for Him” section we have Wired UK and Stuff (a gadget magazine). Both of these are magazines that I would be far more interested in – given the interests I listed in my opening paragraph – than celebrity gossip. I have enough to do in my own life without reading about what someone I don’t know wore to a party last week. It is 2013. Women can be interested in fast cars and gadgets; men can be interested in celeb gossip and home decor. That’s all good. Can whoever is responsible for listing things in this archaic “for him” and “for her” fashion please stop treating those of us who are atypical for our gender like freaks? Shipping your product – the workshop Book Review: Design Evolution 7 Comments Laura Kalbag (Author) June 23, 2013 Reply Ugh, I can’t believe Apple would do it too. Newsagents such as WHSmiths have been doing it for years, including publications about web design and politics under “Men’s” too. Infuriating. Estelle (Author) June 23, 2013 Reply Amen! prisca (Author) June 23, 2013 Reply Hear! Hear! Couldn’t agree more, Rachel… Zak Kain (Author) June 23, 2013 Reply Because of these long-standing societal biases, this approach to marketing and sales still works! if it didn’t, Apple wouldn’t do it. Sadly, women who don’t love tech and men who don’t love celeb gossip must still be the majority here in the West. Craig Grannell (Author) June 23, 2013 Reply This kind of thing drives me nuts too. It’s similar to the toys thing I keep banging on about on Twitter. I can’t for the life of me see how any magazines should be filed by gender (including things like Cosmo and Men’s Health—just put those in a ‘lifestyle’ section). farkus (Author) June 23, 2013 Reply Well you are in the minority and since apple hand picks and controls everything, you have no right to complain. Its what you signed up for. Just go to the tech section or go android where everything is actually catered to your interests and not apple’s stereotypes Paul D. Waite (Author) June 24, 2013 Reply @farkus: “since apple hand picks and controls everything, you have no right to complain”. I think people still have a right to complain. Leave a Reply Cancel replyComment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post's permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post's URL again. (Learn More) © 2025 Rachel Andrew'''
