["https://rachelandrew.co.uk/archives/2024/05/26/masonry-and-reading-order"]
title = "Masonry and reading order – Rachel Andrew"
description = "Doing stuff on the web since 1996."
full_description = '''Masonry and reading order May 26, 2024 In Web stuff I recently wrote a post about the CSS masonry proposal on the Chrome for Developers blog. I was keen not to muddy the waters with anything that wasn’t the main point of that post—which was to explain why the Chrome team felt that masonry should be specified outside of grid. Since then, a couple of people have mentioned the content reordering issue that masonry presents, notably Andy Bell in his post I’m worried about the tabbing behaviour, rather than the syntax and name of CSS masonry. This is just a quick note to hopefully share some positive news on that front. CSS masonry is an example of an automatic layout method, where the developer of the site doesn’t have control over where the items end up, and their placement can change due to size of content, or available space in the component. The other place where this can happen is if you use the dense packing mode in grid, with grid-auto-flow: dense. There’s a proposal however that aims to deal with this, that would let developers indicate to the browser that they want to follow the “visual” flow of items rather than source order. This is currently named reading-order-items, and I recently added a draft of the proposal to the CSS Display Level 4 editor’s draft. The specification deals with reordering both in an automatic sense, but also the reordering you might want to do when placing items on the grid. That draft only mentions grid and flexbox because we are purposefully scoping this to specific layout methods where reordering is likely to occur. At the moment there is no separate masonry specification. If we end up with CSS Masonry Level 1, rather than bundling masonry with grid, then we can expand reading-order-items as well. Ideally we could then implement masonry at the same time as the method to deal with the reading order issue it creates. To be clear, my personal hope is that we can land the proposal for reading-order-items before we have interoperable masonry, in whatever form it takes. This is not a new hope. In fact, at the CSS Working Group meeting in January 2020 where the Mozilla proposal for masonry was first demonstrated, Brian Kardell and I brought up the content reordering issue, and then spent some time discussing possible solutions. I’ve been talking about this issue even before masonry-in-grid started to be discussed, for example in this 2019 post on this blog. Members of the community have also raised concerns, there some discussion specifically related to masonry in this issue. I’m really excited about the fact that we have some forward motion on a reading order solution. I presented the idea at TPAC last year, with the accessibility folks in the room, and they were in agreement that this seemed like a workable way forward (obviously pending testing once we have an experimental implementation). There’s an engineer at Chrome working on a prototype, and I’m keeping on top of questions so we can bring any issues to the CSSWG. I’ll also talk about the proposal at CSS Day in a couple of weeks. We are a way off this being something you can rely on to solve this problem, but do keep an eye out for an implementation in Chrome Canary, as I’d love to get as many people as possible testing this and looking for edge cases once it’s there. In the meantime, I’ll do whatever I can do to keep prodding it along the path to solving this issue for us all. #css #standards On having no visual memory Masonry and good defaults 36 Comments Christian "Schepp" Schaefer May 26, 2024 Reply @rachelandrew I’d love to hear and discuss reading order in more depth at the in-person CSS Café the day after the conference. So if you hadn’t had enough CSSy discussions during the conf and if it doesn’t interfere with any plans on running, please feel invited to drop by: https://meetu.ps/e/N4Dwx/3C5mM/i CSS Café meets CSS Day: an in-Person Pop-Up Event!, Sat, Jun 8, 2024, 10:30 AM | Meetup Rachel Andrew May 26, 2024 Reply @Schepp I’m hoping to pop along 🙂 Christian "Schepp" Schaefer May 26, 2024 Reply @rachelandrew 🥳 Reposts ♻️ bkardell ♻️ Ryan Marx ♻️ Bramus ♻️ Luke ♻️ Christopher Voigt ♻️ Bruce Lawson ♻️ Baldur Bjarnason ♻️ Thain ♻️ Hidde ♻️ Apple Annie :prami: ♻️ CM Harrington ♻️ Fynn Becker Likes 👍 bkardell 👍 Ryan Marx 👍 DivergenteInc 👍 theAdhocracy 👍 Luke 👍 Adrian Roselli 👍 Dustin Wilson 👍 Troels Thomsen 👍 Baldur Bjarnason 👍 Hidde 👍 Miyuki Satake 👍 Guillaume Deblock 👍 Rainer 👍 Vadim Makeev 👍 Luka 👍 Christian "Schepp" Schaefer 👍 Apple Annie :prami: 👍 Jeferson 👍 Roma Komarov 👍 Fynn Becker 👍 Robin Rendle Leave a Reply Cancel replyComment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post's permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post's URL again. (Learn More) © 2025 Rachel Andrew'''
