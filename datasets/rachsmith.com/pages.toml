title = "Australian slang that I have used with my long-suffering American colleagues"
full_description = "Australian slang that I have used with my long-suffering American colleagues Added: September 9, 2022 #work Often I’ll say something in a meeting or in Slack and then later realise, people don’t use that phrase in the USA. Here’s a non-exhaustive list of things my CodePen colleagues have probably had to Google at some point. bloke1 bugger2 carrying on like a pork chop3 chuck a sickie4 chuck a wobbly5 crack the shits6 devo7 DTs8 well fuck me dead9 have a crack at it10 maccas11 nah, yeah12 old mate13 playing silly buggers14 she’ll be right15 struggler16 sus17 that’s cooked18 whinger19 woop woop20 yeah, nah21 Footnotes a man ↩ a mild swear, like saying “shit” or “damn it” ↩ getting very upset, rant, complain ↩ taking a sick day, whether you’re sick or not ↩ throw a tantrum ↩ get really mad or upset ↩ devastated ↩ dick togs, in the US they are called speedos I think ↩ I’m surprised, amazed, or very confused ↩ give it a try ↩ Mcdonald’s ↩ yes ↩ a person who’s name you don’t know ↩ behaving in an annoying way ↩ it will be okay ↩ someone who struggles to manage basic tasks ↩ suspicious, suspect, shady ↩ that’s really bad, that’s messed up ↩ whiner, complainer ↩ remote location ↩ no ↩"
