full_description = "Beyond random Added: July 15, 2022 #development Link: Letting go of random A great explanation with visuals of why random might not be the best tool for your generative creations. When I was making lots of animated Pens, my favourite way to animate was to use generative elements, and I leaned on Math.random() for almost all of it. This post makes me excited to use more normal distribution or noise when I get back to making art again. Beyond random Added: July 15, 2022 #development Link: Letting go of random A great explanation with visuals of why random might not be the best tool for your generative creations. When I was making lots of animated Pens, my favourite way to animate was to use generative elements, and I leaned on Math.random() for almost all of it. This post makes me excited to use more normal distribution or noise when I get back to making art again. Thanks for reading! If you'd like to share your thoughts you can leave a comment, send me an email, hit me up on Mastodon, or add an issue on GitHub. Comments Leave a Comment 💯 Thanks for submitting your comment! It will appear here after it has been approved. Comment (You can use Markdown syntax if you wish) Name Website URL Submit // @ts-nocheck const handleSubmit = (event) => { event.preventDefault(); const myForm = event.target; const formData = new FormData(myForm); fetch('/', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams(formData.entries()).toString(), }) .then(() => { myForm.reset(); const commentSubmittedMessage = document.querySelector('#comment-submitted'); commentSubmittedMessage.style.display = 'block'; commentSubmittedMessage.scrollIntoView(); }) .catch((error) => alert(error)); }; // @ts-ignore document .querySelector('#comment-form') .addEventListener('submit', handleSubmit);"
