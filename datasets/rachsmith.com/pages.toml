full_description = "Hi 👋🏼 I'm Rach. A 37 year old developer building software for CodePen, wife, mother of two, productivity nerd and recovering screen addict. This is my digital garden. I grew up in a small coastal town in Queensland, Australia. I was obsessed with computers as a kid and the internet as a teen, and knew I wanted to do something with coding as an adult. It took me a while to land on a career and after a few detours I finally discovered front end development as a profession. I spent the first years of my career working in different digital and advertising agencies in Australia and London until I landed a dream job with Active Theory in Venice, California. I lived and worked in LA for a few years until I was offered a job with CodePen, and I've been with them ever since. I do front end and backend work now, I specialise in the communication between the two, designing and implementing most of our internal APIs. I've moved back to Australia now, where I live with my husband Andy, a primary schooler and a preschooler. Outside of work and looking after the kids I don't have too much time for hobbies, so writing on this site is an attempt to make time for myself and my interests. I do better at it some times than others."
