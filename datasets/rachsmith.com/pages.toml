["https://rachsmith.com/6-things-to-do-instead-of-work"]
title = "Don't want to fix that bug? Here are 6 things you can do instead"
description = "Look, coding is hard. Every time you start to solve a problem or fix a bug you run the risk of not being able to do it and then feeling like you aren't as smart as you thought you were."
full_description = "Don't want to fix that bug? Here are 6 things you can do instead Added: January 7, 2023 #work Look, coding is hard. Every time you start to solve a problem or fix a bug you run the risk of not being able to do it and then feeling like you aren’t as smart as you thought you were. That sucks! Here are some things you can do instead. Choose a new font for your IDE My paid favourites are Berkeley Mono, Operator Mono and Dank Mono. But there is a whole set of free monospace fonts on Google Fonts that you can try out, one by one until you find one you like, or don’t. Change your terminal I’ve heard warp is good? Choose a new theme for your IDE Some of my favourites: Moonlight II, In Bed By 7pm and Houston. But there are hundreds (thousands?) of options to choose from. Try them out. Use each for half an hour before you decide to change back to the same one you’ve had for the last 3 years. Decide you’re going to learn all the keyboard shortcuts in VSCode Pretend you’re improving your productivity when you’re actually procrastinating! Check out the Keybindings reference or if you’re too lazy for that, watch some videos on people’s favourite VSCode shortcuts. Buy a new keyboard Your code is going to be so much better when you have the ultimate keyboard. Research is important so make sure you head back to YouTube to find out which is the best. Now instead of doing the work that makes you money, you are spending money. Amazing! Redesign your personal website I mean it has been at least 6 months since you overhauled it. And the fact it doesn’t include a dark/light theme switcher is frankly, embarrassing. Check out other people’s sites for some inspo. Bonus: you can go back to Google Fonts!"
