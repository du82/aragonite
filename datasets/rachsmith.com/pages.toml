full_description = "Comedy series I've watched over and over (and over) Added: June 4, 2024 #miscellany I love a good comedy series. It’s my comfort television. These are my favourites over the years. 90s We only had free-to-air TV at our house, so it was slim pickings from the four channels available to us. I was always happy to watch a re-run of these shows though. The Simpsons The Nanny Keeping Up Appearances Fawlty Towers (my dad owned the VHS tapes) 2000s I was watching more Reality TV and crime shows in this decade, but there were a few DVD box-sets that my housemates and I would watch over and over. Seinfeld Kath & Kim The Mighty Boosh 2010s We got streaming platforms! And access to shows that had only been on cable previously. The Office (US) Parks and Recreation Peep Show It’s Always Sunny in Philadelphia 2020s I haven’t had a series reach “watch several times” status. I did enjoy Schitt’s Creek, but I’ve only watched it once. I think its due for a rewatch soon."
