title = "35 Free Radical Candor Book Club Discussion Questions | Radical Candor"
description = "Organize a virtual Radical Candor book club! Here's a list of 35 questions to get you started with the book club discussions for each chapter."
full_description = '''35 Radical Candor Book Club Discussion Questions Elisse Lockhart Radical Candor Facebook Twitter LinkedIn A great way to practice the principles of Radical Candor is by starting a virtual book club. We’ve put together this list of Radical Candor book club questions to get you started with the discussions for each chapter. You can also visit our book page to buy copies of Radical Candor by Kim Scott in bulk at a reduced rate. After your club members have read the book, use the critical thinking questions below to help guide the discussion. Get additional Radical Candor resources when you download the Radical Candor Book Club Guide PDF >> <img fetchpriority="high" decoding="async" class="aligncenter wp-image-15078" title="Radical Candor Book Club by Kim Scott" src="https://www.radicalcandor.com/wp-content/uploads/2021/09/RadicalCandor3D-788x1024.png" alt="Radical Candor Book Club by Kim Scott" width="535" height="695" /> Table of Contents Toggle Part 1: A New Management PhilosophyIntroChapter 1: Build Radically Candid RelationshipsChapter 2: Get, Give, and Encourage GuidanceChapter 3: Understand What Motivates Each Person on Your TeamChapter 4: Drive Results CollaborativelyPart 2: Tools & TechniquesChapter 5: RelationshipsChapter 6: GuidanceChapter 7: TeamChapter 8: Results Part 1: A New Management Philosophy Intro Describe an experience when you didn’t give direct feedback, but you wish you did. Who are the best leaders you’ve worked for in your career? What made them so exceptional? What can you learn? Tell a story about the worst boss you ever had. What did they do that made them so bad? How can you avoid those mistakes? Chapter 1: Build Radically Candid Relationships What does the Radical Candor book say are the key responsibilities of a boss? Many people mistakenly call Radical Candor the same as brutal honesty. What is the difference between Radical Candor and brutal honesty? What are some ways that you show you Care Personally at work? Do you think Challenging Directly is a strength or a weakness for you? Chapter 2: Get, Give, and Encourage Guidance Describe an experience when you received feedback that you appreciated and that was delivered in a helpful and caring way. Describe an experience when you received feedback in a way that you didn’t learn from because you resented the way it was delivered to you. Have you ever been so nice that it ended up working against you? Have you ever felt there was no way to not be mean if you needed to get your desired outcome? Chapter 3: Understand What Motivates Each Person on Your Team Have you ever underestimated an employee’s contributions because they weren’t gunning for a promotion? What happened? Did you regret it? Have you ever clipped the wings of an employee on a steep growth trajectory? What happened? Did you regret it? Are you more at risk of being an absentee manager or a micromanager? What kinds of situations push you towards one of these modes? Are you currently on a gradual or steep growth trajectory? Were you ever on the opposite one? Chapter 4: Drive Results Collaboratively Have you ever tried to tell a team of people what to do? What were the results? Which step(s) of the Get Stuff Done (GSD) Wheel are easiest or most comfortable for you? What steps do you tend to skip? Where do you get stuck? What are some of the practices your team or organization has today that fall into the different steps of the GSD wheel? Are you a quiet listener or a loud listener? Do you want to foster a culture of debate on a team? If so, how will you do it? If not, why not? How do you help your team make decisions? Are you worried you grab too many decisions? Part 2: Tools & Techniques <img src="https://www.radicalcandor.com/wp-content/uploads/2020/03/Kim-Scott-Radical-Candor-1024x576.jpg" height="576" width="1024" srcset="https://www.radicalcandor.com/wp-content/uploads/2020/03/Kim-Scott-Radical-Candor-1024x576.jpg 1024w, https://www.radicalcandor.com/wp-content/uploads/2020/03/Kim-Scott-Radical-Candor-300x169.jpg 300w, https://www.radicalcandor.com/wp-content/uploads/2020/03/Kim-Scott-Radical-Candor-768x432.jpg 768w, https://www.radicalcandor.com/wp-content/uploads/2020/03/Kim-Scott-Radical-Candor-1536x864.jpg 1536w, https://www.radicalcandor.com/wp-content/uploads/2020/03/Kim-Scott-Radical-Candor-200x113.jpg 200w, https://www.radicalcandor.com/wp-content/uploads/2020/03/Kim-Scott-Radical-Candor-500x281.jpg 500w, https://www.radicalcandor.com/wp-content/uploads/2020/03/Kim-Scott-Radical-Candor-680x383.jpg 680w, https://www.radicalcandor.com/wp-content/uploads/2020/03/Kim-Scott-Radical-Candor-980x552.jpg 980w, https://www.radicalcandor.com/wp-content/uploads/2020/03/Kim-Scott-Radical-Candor.jpg 1400w" sizes="(max-width: 1024px) 100vw, 1024px" class="aligncenter wp-image-12929 size-large sp-no-webp" alt="Radical Candor Book Club Kim Scott" decoding="async" title="Radical Candor Book Club Kim Scott" > Chapter 5: Relationships What activities do you do to stay centered? Describe an experience when you weren’t able to bring your best self to work. What happened? How do you build trust with your direct reports/ staff? What strategies or activities have been most effective, and how can you tell? Chapter 6: Guidance Have you solicited feedback from your direct reports/staff? If so, how have you done it, and has it been successful? Do you have a go-to question for soliciting feedback? What is it? What are some of the ways that you have rewarded criticism? Which of the Radical Candor book’s tips for giving guidance did you find most helpful? What’s something you could do tomorrow with someone on your team to offer Radical Candor? Chapter 7: Team Do you or can you begin facilitating “Career Conversations” with your direct reports, as a way of caring personally and helping them map out their career trajectories? Do you know the balance of rock stars and superstars on your team? How do you think about growth for different people? Did any of the Radical Candor book’s suggestions for hiring and firing resonate as applicable to your team/company? Chapter 8: Results How do you approach 1:1 meetings? How’s that different than the recommendations laid out in the Radical Candor book? Will you change your 1:1’s? How do you help nurture new ideas? Which ideas from the book will you adopt? Do you hold staff meetings? How do they compare to the approach in the book? Any recommendations that you’ll incorporate? Do you think the Big Debate or Big Decision meetings described in the book would help your team? What do you think about the number of meetings suggested in this chapter? How do you prevent meeting-creep from taking over the time your team should be spending executing? We hope these questions for your Radical Candor book club are helpful in creating a meaningful discussion with your team! Of course, understanding the ideas is just the first step, and changing your habits and day-to-day actions is hard. Get more practice with our free Radical Candor Playbook. ————————————————————————————————————————————————————————————– (This post was updated Aug. 22, 2022) Download our free learning guides to start putting Radical Candor into practice. Sign up for our Radical Candor email newsletter >> Shop the Radial Candor store >> Get Radical Candor coaching and consulting for your team >> Get Radical Candor coaching and consulting for your company >> Need more help getting your team to practice giving helpful feedback with each other? Then you need The Feedback Loop (think Groundhog Day meets The Office), a 5-episode workplace comedy series starring David Alan Grier that brings to life Radical Candor’s simple framework for navigating candid conversations. You’ll get an hour of hilarious content about a team whose feedback fails are costing them business; improv-inspired exercises to teach everyone the skills they need to work better together; and after-episode action plans you can put into practice immediately to up your helpful feedback EQ. We’re offering Radical Candor readers 10% off the self-paced e-course. Follow this link and enter the promo code FEEDBACK at checkout. articlebook Related Posts <img loading="lazy" class="wpex-align-middle" src="https://www.radicalcandor.com/wp-content/uploads/2025/03/scaling-at-work-680x383.png" alt="Leading Large Teams" srcset="https://www.radicalcandor.com/wp-content/uploads/2025/03/scaling-at-work-680x383.png 680w, https://www.radicalcandor.com/wp-content/uploads/2025/03/scaling-at-work-300x169.png 300w, https://www.radicalcandor.com/wp-content/uploads/2025/03/scaling-at-work-1024x576.png 1024w, https://www.radicalcandor.com/wp-content/uploads/2025/03/scaling-at-work-768x432.png 768w, https://www.radicalcandor.com/wp-content/uploads/2025/03/scaling-at-work.png 1400w, https://www.radicalcandor.com/wp-content/uploads/2025/03/scaling-at-work-200x113.png 200w, https://www.radicalcandor.com/wp-content/uploads/2025/03/scaling-at-work-980x552.png 980w, https://www.radicalcandor.com/wp-content/uploads/2025/03/scaling-at-work-500x281.png 500w" width="680" height="383"> Leading Large Teams: How to Manage 50+ Direct Reports In an Open Office or Factory Setting Edited By Brandi Neal, Radical Candor podcast writer and producer, and director of content creation… <img loading="lazy" class="wpex-align-middle" src="https://www.radicalcandor.com/wp-content/uploads/2025/02/challenging-direct-reports-680x365.jpg" alt="Challenging Direct Reports" srcset="https://www.radicalcandor.com/wp-content/uploads/2025/02/challenging-direct-reports-680x365.jpg 680w, https://www.radicalcandor.com/wp-content/uploads/2025/02/challenging-direct-reports-300x161.jpg 300w, https://www.radicalcandor.com/wp-content/uploads/2025/02/challenging-direct-reports-1024x549.jpg 1024w, https://www.radicalcandor.com/wp-content/uploads/2025/02/challenging-direct-reports-768x412.jpg 768w, https://www.radicalcandor.com/wp-content/uploads/2025/02/challenging-direct-reports.jpg 1400w, https://www.radicalcandor.com/wp-content/uploads/2025/02/challenging-direct-reports-200x107.jpg 200w, https://www.radicalcandor.com/wp-content/uploads/2025/02/challenging-direct-reports-980x526.jpg 980w, https://www.radicalcandor.com/wp-content/uploads/2025/02/challenging-direct-reports-500x268.jpg 500w" width="680" height="365"> Managing Resistance: How to Reset Expectations With Challenging Direct Reports Edited By Brandi Neal, Radical Candor podcast writer and producer, and director of content creation… <img loading="lazy" class="wpex-align-middle" src="https://www.radicalcandor.com/wp-content/uploads/2025/02/Hybrid-Work-680x365.jpg" alt="Hybrid Work" srcset="https://www.radicalcandor.com/wp-content/uploads/2025/02/Hybrid-Work-680x365.jpg 680w, https://www.radicalcandor.com/wp-content/uploads/2025/02/Hybrid-Work-300x161.jpg 300w, https://www.radicalcandor.com/wp-content/uploads/2025/02/Hybrid-Work-1024x549.jpg 1024w, https://www.radicalcandor.com/wp-content/uploads/2025/02/Hybrid-Work-768x412.jpg 768w, https://www.radicalcandor.com/wp-content/uploads/2025/02/Hybrid-Work.jpg 1400w, https://www.radicalcandor.com/wp-content/uploads/2025/02/Hybrid-Work-200x107.jpg 200w, https://www.radicalcandor.com/wp-content/uploads/2025/02/Hybrid-Work-980x526.jpg 980w, https://www.radicalcandor.com/wp-content/uploads/2025/02/Hybrid-Work-500x268.jpg 500w" width="680" height="365"> How to Apply Radical Candor to Hybrid Workplaces By Nahla Davies, a software developer and tech writer. Before devoting her work full-time to… <img alt='' src='https://www.radicalcandor.com/wp-content/uploads/2016/06/elisse-profile-150x150.jpg' srcset='https://www.radicalcandor.com/wp-content/uploads/2016/06/elisse-profile-150x150.jpg 2x' class='avatar avatar-70 photo avatar-default wpex-align-middle wpex-round' height='70' width='70' decoding='async'/> Elisse Lockhart'''
