full_description = 'Radical Candor Team Meet the team of people dedicated to spreading the word about Radically Candid guidance and feedback. Core Team Candor Coaches Partners Contact Our Team Meet The Radical Candor Team Our dedicated Radical Candor team, led by Kim Scott & Jason Rosoff, provides proven management and feedback training. <img src="https://www.radicalcandor.com/wp-content/uploads/2024/02/Leslee-bio.jpg" class="sp-no-webp" alt="Our Team radical candor team,candor coach,kim scott,feedback" decoding="async" title="Our Team 1 Our Team" > Leslee Echivarre Social Media Marketing Specialist Leslee Echivarre is the Social Media Marketing Specialist at Radical Candor. Her initiatives aim to expand brand awareness and engagement across all social channels. With nearly three years of experience in social media management, Leslee is adept at crafting compelling content and executing strategies to foster meaningful connections with audiences. Driven by her desire to make a difference, Leslee is drawn to companies that share her commitment to positive impact. Radical Candor’s mission of bringing humanity back to the workplace resonates deeply with her, as the team strives to excel professionally and foster personal growth and empathy in every aspect of life. Leslee feels privileged to be part of such an inspiring company and team. Before joining Radical Candor, Leslee held pivotal roles managing social media for various organizations. From overseeing content creation to optimizing audience engagement, she demonstrated her ability to deliver tangible results, evident in the significant growth of clients’ social media presence. Outside of work, Leslee is a passionate advocate for music at the National Music Council, actively promoting awareness of crucial music-related issues and championing music education for all. In her spare time, she enjoys indulging in hobbies such as drawing, video gaming, attending concerts, and baking, while also co-parenting two beloved cats, Good and Corky, with her boyfriend. Contact Leslee ▶️ <img width="1017" height="1017" decoding="async" src="https://www.radicalcandor.com/wp-content/uploads/2024/04/Close-up-2-e1712360327186.jpeg" alt="Our Team radical candor team,candor coach,kim scott,feedback" title="Our Team 2 Our Team"> Dan Greene Chief Revenue Officer Dan Greene is an accomplished and highly successful leader with a talent for growing and scaling organizations and inspiring his teams to achieve exceptional results. He started his career in the Navy, serving as a carrier-based fighter pilot and team leader. After leaving active duty, Dan attended business school at UCLA and helped start an aviation company called Tactical Air Support, Inc. From there, Dan moved on to leading and scaling sales organizations at Google, Twitter, Impossible Foods, and several growth-stage tech startups. Before joining Radical Candor as Chief Revenue Officer, Dan founded Lucid Advisors, LLC — a company focused on helping to create the next generation of great leaders and managers. As CRO, Dan leads our Go-To-Market teams in growing Radical Candor’s global business. Dan also works closely with our customers doing workshops, speaking engagements, and 1:1 coaching regularly. Dan lives in Willow Glen, California, with his wife, Karen, their three kids, and his (sometimes loyal) yellow lab Scout. Contact Dan ▶️ <img src="https://www.radicalcandor.com/wp-content/uploads/2022/06/Drew-Muir.jpeg" class="sp-no-webp" alt="Our Team radical candor team,candor coach,kim scott,feedback" decoding="async" title="Our Team 3 Our Team" > Drew Muir Director of Client Partnerships Drew Muir is Radical Candor’s Director of Client Partnerships and brings 15+ years of experience working with companies large and small to improve individual and organizational performance. Prior to joining Radical Candor, Drew designed and deployed go-to-market strategies for F500 companies as part of CEB, and led commercial efforts for the business arm of The Second City on the West Coast. In these roles and with Radical Candor, Drew is passionate about helping people actually listen to one another and enjoy working together. Drew currently lives on California’s Central Coast with his wife and their Golden Retriever, Gerry. When he’s not working or walking/playing with/paying way too much attention to Gerry, Drew is likely catching up on soccer highlights, reading, or finding a reason to be outside. Contact Drew ▶️ <img src="https://www.radicalcandor.com/wp-content/uploads/2019/02/B-Neal.png" class="sp-no-webp" alt="Our Team radical candor team,candor coach,kim scott,feedback" decoding="async" title="Our Team 4 Our Team" > Brandi Neal Director of Content Creation & Marketing A writer, editor, storyteller, and content strategist with 20 years of experience, Brandi Neal is the director of content creation and marketing and podcast writer and producer for Radical Candor. In one of her previous jobs, she worked as a web development copywriter and a scriptwriter at L.L.Bean where she wrote and sometimes starred in product videos. Always willing to take one for the team, she went on camera for an instructional skiing video when the talent failed to show up despite the clothes not fitting her and not knowing how to ski IRL. A former daily newspaper reporter and editor, magazine writer, travel writer, and digital journalist, she is also the editor of two literary anthologies and co-founder of the narrative magazine The Blue Room. In addition, she was a 2016 recipient of an Idyllwild Arts Fellowship for nonfiction. Brandi has a BA in journalism from the University of Toledo and an MFA in nonfiction from the University of Southern Maine’s Stonecoast Creative Writing program. Some of the stranger things she has done include walking on fire (three times), hiking to the top of an active volcano in the middle of the night, hanging from the wing of an airplane (and letting go), and participating in an impala dung-spitting contest, which is just as gross as it sounds. Brandi lives in Southern California with the world’s most handsome dog, Bodhi, and her senior cat, Ted. In a movie of her life, she wants to be played by Stana Katic. Contact Brandi ▶️ <img width="745" height="745" decoding="async" src="https://www.radicalcandor.com/wp-content/uploads/2022/11/Read-headshot2-e1708635570873.jpg" alt="Our Team radical candor team,candor coach,kim scott,feedback" title="Our Team 5 Our Team"> Erin Read Operations Manager A southern transplant now firmly rooted in the northeast, Erin Read is a project manager and performer with 16 years of experience supporting and encouraging creative thinkers. Much of her career has been spent in the nonprofit arts, working with theater companies and philanthropic foundations to enrich the greater Philadelphia cultural community. Prior to joining Radical Candor, Erin oversaw COVID testing logistics for organizations throughout the United States. She co-created client collateral and piloted new testing software in the infancy of the pandemic. In addition to her work as Radical Candor’s operations manager, Erin also works with her local children’s hospital in a program that provides clinicians with opportunities to practice delivering difficult news to patients and families. Whether telling stories for connection, safeguarding public health, or bolstering communication skills, community is at the root of her career. Outside of work, Erin is happiest by the water after spending her most recent paycheck at the nearest bookstore. Contact Erin ▶️ <img src="https://www.radicalcandor.com/wp-content/uploads/2019/02/Unknown.jpeg" class="sp-no-webp" alt="Our Team radical candor team,candor coach,kim scott,feedback" decoding="async" title="Our Team 6 Our Team" > Jason Rosoff CEO + Co-Founder Jason is the CEO and Co-founder of Radical Candor. Over the last four years, he’s helped all kinds of organizations, from tiny startups to the giants in the Fortune 100, realize the power of creating a more Radically Candid culture. Through this work, he’s helped hundreds of companies develop real human relationships between team members and through those relationships, achieve amazing results collaboratively. He has been a guest on myriad podcasts to talk about Radical Candor. In his past lives, Jason received undergraduate and graduate degrees in business from New York University. He also worked as a product design team lead at Fog Creek Software, the small-but-mighty New York-based software company that created well-loved products like Trello and Stackoverflow. In 2010, he moved to California and helped launch Khan Academy, the world-renowned educational tech non-profit. Over the next seven years, he helped it grow from three people to a few hundred and reach over 100 million students around the world as both chief people and chief product officer. Jason lives in a small town on the coast of Connecticut with his partner Jillian and dog Jack. Meet Jason ▶️ Watch Jason’s Radical Candor story ▶️ Book a talk or a workshop ▶️ <img width="2000" height="2000" decoding="async" src="https://www.radicalcandor.com/wp-content/uploads/2019/02/SandlerHeadshot-1-e1726778675967.jpg" alt="Our Team radical candor team,candor coach,kim scott,feedback" title="Our Team 7 Our Team"> Amy Sandler Principal Coach & Podcast Host Amy Sandler is Principal Coach and Podcast Host at Radical Candor, where she’s also served as Chief Marketing Officer and Chief Content Officer. Amy has trained tens of thousands of people worldwide, ranging from CEOs and leadership teams to recent graduates just starting their career. Her leadership philosophy focuses on empowering people to develop greater awareness, resilience and compassion, essential foundations for teamwork and shared success. A pioneer in bringing mindfulness-based leadership practices to the workplace, Amy was selected in 2014 to be one of the first 30 certified teachers of the Search Inside Yourself leadership program developed at Google. Amy brought mindfulness training and breathwork meditation to executive coaching organizations Vistage and YPO, where she also served in leadership roles. (Watch a keynote she delivered to the Society for Marketing Professional Services.) Amy has spoken about Radical Candor, the value of mindfulness at work and living authentically on podcasts including SuperManagers by Fellow, The Digital Workplace, Blue Sky Podcast, and the Unplug meditation app, where her Mindful Meeting was voted the top work meditation in 2021. In her interview with the Simple Habit app on “Mindfulness in the Workplace and Loving Yourself,” Amy shares her journey of being a recovering perfectionist, the continual sense of “not enough-ness” many high achievers struggle with, and how coming out as a member of the LGBTQ community in the mid-1990s set her on the path of inner inquiry and healing. Amy has an AB and MBA from Harvard University and an MFA in Screenwriting from UCLA. A certified breathwork meditation teacher, Amy is in the third year of a medical Qi Gong teacher certification program. She has performed stand-up comedy and walked on fire seven times. Meet Amy ▶️ Watch Amy Go from Obnoxious Aggression to Manipulative Insincerity ▶️ Book a talk or a workshop ▶️ <img src="https://www.radicalcandor.com/wp-content/uploads/2019/02/Kim-Scott-Headshot-2023.png" class="sp-no-webp" alt="Our Team radical candor team,candor coach,kim scott,feedback" decoding="async" title="Our Team 8 Our Team" > Kim Scott Co-Founder Kim Scott is the author of Radical Candor: Be a Kick-Ass Boss Without Losing Your Humanity and Radical Respect: How to Work Together Better and co-founder of Radical Candor, a company that helps people put the ideas in her books into practice. She has been a guest on more than 100 podcasts to talk about Radical Candor and Radical Respect. Kim was a CEO coach at Dropbox, Qualtrics, Twitter and other tech companies. She was a member of the faculty at Apple University and before that led AdSense YouTube, and DoubleClick teams at Google. She’s also managed a pediatric clinic in Kosovo and started a diamond-cutting factory in Moscow. She lives with her family in Silicon Valley. Meet Kim ▶️ Watch Kim’s Radical Candor story ▶️ Book a talk with Kim Scott ▶️ <img src="https://www.radicalcandor.com/wp-content/uploads/2019/02/team-nora-wilcox.jpg" class="sp-no-webp" alt="Our Team radical candor team,candor coach,kim scott,feedback" decoding="async" title="Our Team 9 Our Team" > Nora Wilcox Director of Operations Nora Wilcox is a program administrator with more than 10 years of experience designing and managing educational and training programs. Spending the majority of her career in the non-profit arts, she has helped organizations successfully scale their offerings; build cohesive and effective teams and develop operational strategy for growth. Prior to joining Radical Candor, Nora was the associate director of education for the Hudson Valley Shakespeare Festival (HVSF) — a critically acclaimed non-profit theater located in the New York City metro area. While there, Nora helped develop and implement innovative theater-based arts-in-education programs and performances for more than 60,000 students and educators annually. Both in her role at HVSF and now as director of operations at Radical Candor, Nora is passionate about creating meaningful experiences that empower people to be more empathetic and collaborative creators. Nora currently lives in Texas with her husband, son and a gang of rescue animals — two cats, Mario and Luigi, and a dog named Cooper. When she’s not debating whether or not to open an Instagram account for her dog, you might find her baking gluten-free recipes or binge watching The Office. Contact Nora ▶️ Meet The Radical Candor Team — Candor Coaches Our highly skilled coaches are here to help your team roll out Radical Candor. Get to know the coaches “Mel created emotional safety at MetaLab by sharing her own life story of Radical Candor that modeled to our employees how vulnerability can be a doorway to innovation. People still talk about the impact of her training today!” — Amber Larsen, Director of Learning & Development, MetaLab <img width="1540" height="1590" decoding="async" src="https://www.radicalcandor.com/wp-content/uploads/2020/01/Mel-Andrada-Bio-scaled-e1738965189630.jpg" alt="Our Team radical candor team,candor coach,kim scott,feedback" title="Our Team 10 Our Team"> Melissa Andrada Candor Coach Melissa Andrada (Mel — they/she) is a Mental Health consultant, leadership coach, and workshop facilitator collaborating with organizations to co-design cultures of belonging for measurable impact and innovation. With a unique blend of strategic insight, operational excellence, and emotionally attuned and vulnerable facilitation, Mel partners with organizations to embed Radical Candor into their culture, empowering teams to foster trust, psychological safety, and open feedback—particularly around mental health and belong'
