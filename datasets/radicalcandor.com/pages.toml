title = "How To Practice Radical Candor With Strangers | Radical Candor"
description = "Kim Scott is the author of Radical Candor: Be a Kick-Ass Boss Without Losing Your Humanity and Radical Respect: How to Work Together Better and co-founder of Radical Candor, a company that helps people put the ideas in her books into practice. Kim was a CEO coach at Dropbox, Qualtrics, Twitter and other tech companies. She was a member of the faculty at Apple University and before that led AdSense YouTube, and DoubleClick teams at Google. She's also managed a pediatric clinic in Kosovo and started a diamond-cutting factory in Moscow. She lives with her family in Silicon Valley."
full_description = '''How to Practice Radical Candor With Strangers Kim Scott Encouraging Feedback, Giving Feedback, Radical Candor Facebook Twitter LinkedIn “I can see how Radical Candor works when I already have a relationship… but what about with people I barely know? Isn’t it too risky to give Radical Candor to strangers?” Our Radical Candor coaches get this question fairly often, and I won’t pretend it isn’t risky to offer feedback to a complete stranger. It is. But not being Radically Candid is also risky. And the rewards of being Radically Candid for you and for the other person can be enormous. In fact, the idea of Radical Candor was born for me when a perfect stranger on a street corner in the East Village of New York City criticized something I was doing. I still have no idea who he is, but I am enormously grateful to him because he changed my whole life in two minutes flat. It was shortly after 9/11, and I was standing at a red light with my new Golden Retriever puppy, Belvedere. Getting Belvedere was the thing I had done to comfort myself and the people I worked with after 9/11. Belvedere was also where I most often turned for comfort, taking long walks with me and serving as an endlessly absorbent Kleenex, as I was getting out of a bad relationship that had been consuming me for seven years. It’s impossible to exaggerate how much I adored–and depended on–that little fluff of reddish fur. And there’s nothing like emotional bondage to create the conditions for Ruinous Empathy. I never said a cross word to Belvedere, and she was absolutely untrained and undisciplined. As I was standing there, she tugged at the leash and almost wound up under the tires of a taxi roaring by. I pulled her back at the last moment, head over heels. “If you don’t teach that dog to sit, she’s going to die!” said the tall bearded man in blue jeans standing next to me. He pointed at the ground, bent down to get in Belvy’s face, and bellowed at her, “SIT!!” To my astonishment, Belvy sat. She didn’t just sit, she pounded her butt into the pavement, and looked up at the man wagging her tail. The man was in my face now. “See? It’s not mean, it’s clear.” The light changed, and the man strode across the street, leaving me with words to live by. <img fetchpriority="high" decoding="async" class="alignnone wp-image-12838" title="Radical Candor with Strangers" src="https://www.radicalcandor.com/wp-content/uploads/2020/02/radicalcandor_strangers-1024x575.png" alt="Radical Candor with Strangers" width="622" height="349" srcset="https://www.radicalcandor.com/wp-content/uploads/2020/02/radicalcandor_strangers-1024x575.png 1024w, https://www.radicalcandor.com/wp-content/uploads/2020/02/radicalcandor_strangers-300x169.png 300w, https://www.radicalcandor.com/wp-content/uploads/2020/02/radicalcandor_strangers-768x431.png 768w, https://www.radicalcandor.com/wp-content/uploads/2020/02/radicalcandor_strangers-1536x863.png 1536w, https://www.radicalcandor.com/wp-content/uploads/2020/02/radicalcandor_strangers-200x112.png 200w, https://www.radicalcandor.com/wp-content/uploads/2020/02/radicalcandor_strangers.png 1400w" sizes="(max-width: 622px) 100vw, 622px" /> The man didn’t have to have me over for dinner, remember my birthday, or even know my name. He showed he cared by aligning us on something that was really important to me: the survival of my puppy. Belvy was my emotional life raft, and I wasn’t sure I would have survived her death at that moment in my life. But the man didn’t have to know any of those details. He could see I loved the dog. Talking about how to help Belvy survive was all he needed to do to show he cared personally. Then he offered some help–he showed me how to get her to sit. And then he walked off. That stranger helped me be a better dog owner, a better manager, and a better person in two minutes flat by being Radically Candid. It didn’t require a huge time investment from him. He just said what he thought when he didn’t have anything else to do while waiting for the light to change… (This post was updated Feb. 5, 2020.) How to use the Radical Candor Order of Operations >> ————————————————————————————————————————————————————————————– Take the Radical Candor quiz >> Sign up for our Radical Candor email newsletter >> Listen to the Radical Candor podcast >> Shop the Radical Candor store >> Get Radical Candor coaching and consulting for your team >> Get Radical Candor coaching and consulting for your company >> Need help with Radical Candor? Then you need The Feedback Loop (think Groundhog Day meets The Office), a 5-episode workplace comedy series starring David Alan Grier that brings to life Radical Candor’s simple framework for navigating candid conversations. You’ll get an hour of hilarious content about a team whose feedback fails are costing them business; improv-inspired exercises to teach everyone the skills they need to work better together; and after-episode action plans you can put into practice immediately to up your helpful feedback EQ. We’re offering Radical Candor readers 10% off the self-paced e-course. Follow this link and enter the promo code FEEDBACK at checkout. Advice Columnarticle Related Posts <img loading="lazy" class="wpex-align-middle" src="https://www.radicalcandor.com/wp-content/uploads/2025/03/scaling-at-work-680x383.png" alt="Leading Large Teams" srcset="https://www.radicalcandor.com/wp-content/uploads/2025/03/scaling-at-work-680x383.png 680w, https://www.radicalcandor.com/wp-content/uploads/2025/03/scaling-at-work-300x169.png 300w, https://www.radicalcandor.com/wp-content/uploads/2025/03/scaling-at-work-1024x576.png 1024w, https://www.radicalcandor.com/wp-content/uploads/2025/03/scaling-at-work-768x432.png 768w, https://www.radicalcandor.com/wp-content/uploads/2025/03/scaling-at-work.png 1400w, https://www.radicalcandor.com/wp-content/uploads/2025/03/scaling-at-work-200x113.png 200w, https://www.radicalcandor.com/wp-content/uploads/2025/03/scaling-at-work-980x552.png 980w, https://www.radicalcandor.com/wp-content/uploads/2025/03/scaling-at-work-500x281.png 500w" width="680" height="383"> Leading Large Teams: How to Manage 50+ Direct Reports In an Open Office or Factory Setting Edited By Brandi Neal, Radical Candor podcast writer and producer, and director of content creation… <img loading="lazy" class="wpex-align-middle" src="https://www.radicalcandor.com/wp-content/uploads/2025/02/challenging-direct-reports-680x365.jpg" alt="Challenging Direct Reports" srcset="https://www.radicalcandor.com/wp-content/uploads/2025/02/challenging-direct-reports-680x365.jpg 680w, https://www.radicalcandor.com/wp-content/uploads/2025/02/challenging-direct-reports-300x161.jpg 300w, https://www.radicalcandor.com/wp-content/uploads/2025/02/challenging-direct-reports-1024x549.jpg 1024w, https://www.radicalcandor.com/wp-content/uploads/2025/02/challenging-direct-reports-768x412.jpg 768w, https://www.radicalcandor.com/wp-content/uploads/2025/02/challenging-direct-reports.jpg 1400w, https://www.radicalcandor.com/wp-content/uploads/2025/02/challenging-direct-reports-200x107.jpg 200w, https://www.radicalcandor.com/wp-content/uploads/2025/02/challenging-direct-reports-980x526.jpg 980w, https://www.radicalcandor.com/wp-content/uploads/2025/02/challenging-direct-reports-500x268.jpg 500w" width="680" height="365"> Managing Resistance: How to Reset Expectations With Challenging Direct Reports Edited By Brandi Neal, Radical Candor podcast writer and producer, and director of content creation… <img loading="lazy" class="wpex-align-middle" src="https://www.radicalcandor.com/wp-content/uploads/2025/02/Hybrid-Work-680x365.jpg" alt="Hybrid Work" srcset="https://www.radicalcandor.com/wp-content/uploads/2025/02/Hybrid-Work-680x365.jpg 680w, https://www.radicalcandor.com/wp-content/uploads/2025/02/Hybrid-Work-300x161.jpg 300w, https://www.radicalcandor.com/wp-content/uploads/2025/02/Hybrid-Work-1024x549.jpg 1024w, https://www.radicalcandor.com/wp-content/uploads/2025/02/Hybrid-Work-768x412.jpg 768w, https://www.radicalcandor.com/wp-content/uploads/2025/02/Hybrid-Work.jpg 1400w, https://www.radicalcandor.com/wp-content/uploads/2025/02/Hybrid-Work-200x107.jpg 200w, https://www.radicalcandor.com/wp-content/uploads/2025/02/Hybrid-Work-980x526.jpg 980w, https://www.radicalcandor.com/wp-content/uploads/2025/02/Hybrid-Work-500x268.jpg 500w" width="680" height="365"> How to Apply Radical Candor to Hybrid Workplaces By Nahla Davies, a software developer and tech writer. Before devoting her work full-time to… <img alt='' src='https://www.radicalcandor.com/wp-content/uploads/2019/04/kim-scott-square-1-150x150.jpg' srcset='https://www.radicalcandor.com/wp-content/uploads/2019/04/kim-scott-square-1-150x150.jpg 2x' class='avatar avatar-70 photo avatar-default wpex-align-middle wpex-round' height='70' width='70' decoding='async'/> Kim Scott Kim Scott is the author of Radical Candor: Be a Kick-Ass Boss Without Losing Your Humanity and Radical Respect: How to Work Together Better and co-founder of Radical Candor, a company that helps people put the ideas in her books into practice. Kim was a CEO coach at Dropbox, Qualtrics, Twitter and other tech companies. She was a member of the faculty at Apple University and before that led AdSense YouTube, and DoubleClick teams at Google. She's also managed a pediatric clinic in Kosovo and started a diamond-cutting factory in Moscow. She lives with her family in Silicon Valley. TwitterFacebookLinkedIn'''
