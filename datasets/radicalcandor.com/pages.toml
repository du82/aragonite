full_description = '''Telling People What to Do Doesn’t Work The Radical Candor® approach — Caring Personally while Challenging Directly — can move you from a command-and-control culture to one of collaboration. Developed by Kim Scott, Radical Candor is a communication framework for specific and sincere praise and kind and clear criticism. Contact Our Team Why is something so simple so hard to do? You’re told you have to be professional Your entire working life you’ve been told to be professional. Too often, that’s code for leaving your humanity at home. To build strong relationships, you have to Care Personally. This can be as simple as showing enough vulnerability to admit when you’re having a bad day, and creating a safe place for others to do the same. <img fetchpriority="high" decoding="async" width="538" height="411" src="https://www.radicalcandor.com/wp-content/uploads/2020/08/Screen-Shot-2020-08-06-at-3.46.34-PM.png" class="vc_single_image-img attachment-full" alt="People do want feedback" title="Radical Candor approach" srcset="https://www.radicalcandor.com/wp-content/uploads/2020/08/Screen-Shot-2020-08-06-at-3.46.34-PM.png 538w, https://www.radicalcandor.com/wp-content/uploads/2020/08/Screen-Shot-2020-08-06-at-3.46.34-PM-300x229.png 300w, https://www.radicalcandor.com/wp-content/uploads/2020/08/Screen-Shot-2020-08-06-at-3.46.34-PM-200x153.png 200w" sizes="(max-width: 538px) 100vw, 538px" /> <img decoding="async" width="509" height="419" src="https://www.radicalcandor.com/wp-content/uploads/2020/08/Screen-Shot-2020-08-06-at-3.45.53-PM.png" class="vc_single_image-img attachment-full" alt="Radical Candor approach" title="Radical Candor approach" srcset="https://www.radicalcandor.com/wp-content/uploads/2020/08/Screen-Shot-2020-08-06-at-3.45.53-PM.png 509w, https://www.radicalcandor.com/wp-content/uploads/2020/08/Screen-Shot-2020-08-06-at-3.45.53-PM-300x247.png 300w, https://www.radicalcandor.com/wp-content/uploads/2020/08/Screen-Shot-2020-08-06-at-3.45.53-PM-200x165.png 200w" sizes="(max-width: 509px) 100vw, 509px" /> “If you don’t have anything nice to say…” Since you learned to talk you’ve likely been told some version of, “If you don’t have anything nice to say, don’t say anything at all.” Then you become the boss and the very thing you’ve been taught not to do since you were 18 months old is suddenly your job. In order to succeed, you have to Challenge Directly. Challenging people is often the best way to show you care. It does not mean that whatever you think is the truth; it means you share your (humble) opinions directly. Need help overcoming these specific guidance and feedback challenges? We’ve got a suite of resources to help you get you started. Learn more A compass for candid conversations Because the Radical Candor approach can be hard to put into practice, we developed a simple feedback framework that you can keep top of mind in the heat of the moment. Use the Radical Candor Framework to Guide Your Conversations Understanding what is not Radical Candor can help you better understand what kind, clear, specific and sincere communication looks like. These behaviors that everyone falls into at one time or another are not personality types. Remember that these phrases are not labels. Please don’t write people’s names in these boxes; use the framework as a compass to guide your conversations to a more productive place. The Radical Candor Framework is a trademark of Radical Candor, LLC. <img src="/wp-content/uploads/2019/04/2x2-e1724887803132.png" class="sp-no-webp" alt="Our Approach radical candor approach,radical candor,kim scott" decoding="async" title="Our Approach 1 Our Approach" > <img decoding="async" width="795" height="481" src="https://www.radicalcandor.com/wp-content/uploads/2021/07/MS_RC-1.png" class="vc_single_image-img attachment-full" alt="Radical Candor podcast" title="Radical Candor podcast" srcset="https://www.radicalcandor.com/wp-content/uploads/2021/07/MS_RC-1.png 795w, https://www.radicalcandor.com/wp-content/uploads/2021/07/MS_RC-1-300x182.png 300w, https://www.radicalcandor.com/wp-content/uploads/2021/07/MS_RC-1-768x465.png 768w, https://www.radicalcandor.com/wp-content/uploads/2021/07/MS_RC-1-200x121.png 200w" sizes="(max-width: 795px) 100vw, 795px" /> <img src="/wp-content/uploads/2019/04/2x2obnoxious-e1724887892419.png" width="188" class="sp-no-webp" alt="Our Approach radical candor approach,radical candor,kim scott" decoding="async" title="Our Approach 2 Our Approach" > Obnoxious Aggression® Obnoxious Aggression, also called brutal honesty or front stabbing, is what happens when you challenge someone directly, but don’t show you care about them personally. It’s praise that doesn’t feel sincere or criticism and feedback that isn’t delivered kindly. Learn more <img src="/wp-content/uploads/2019/04/2x2ruinous-e1724887874639.png" width="179" class="sp-no-webp" alt="Our Approach radical candor approach,radical candor,kim scott" decoding="async" title="Our Approach 3 Our Approach" > Ruinous Empathy® Ruinous Empathy is what happens when you want to spare someone’s short-term feelings, so you don’t tell them something they need to know. You Care Personally, but fail to Challenge Directly. It’s praise that isn’t specific enough to help the person understand what was good, or criticism that is sugar-coated and unclear. Or simply silence. Ruinous Empathy may feel nice or safe, but is ultimately unhelpful and even damaging. This is a feedback fail. Learn more <img src="https://www.radicalcandor.com/wp-content/uploads/2023/08/ruinous-empathy-our-approach.png" height="375" width="666" srcset="https://www.radicalcandor.com/wp-content/uploads/2023/08/ruinous-empathy-our-approach.png 666w, https://www.radicalcandor.com/wp-content/uploads/2023/08/ruinous-empathy-our-approach-300x169.png 300w, https://www.radicalcandor.com/wp-content/uploads/2023/08/ruinous-empathy-our-approach-200x113.png 200w, https://www.radicalcandor.com/wp-content/uploads/2023/08/ruinous-empathy-our-approach-500x282.png 500w" sizes="(max-width: 666px) 100vw, 666px" class="vc_single_image-img attachment-full sp-no-webp" alt="ruinous empathy" decoding="async" title="ruinous empathy our approach" > <img decoding="async" width="791" height="576" src="https://www.radicalcandor.com/wp-content/uploads/2021/07/MS_RS.png" class="vc_single_image-img attachment-full" alt="manipulative insincerity" title="MS_RS" srcset="https://www.radicalcandor.com/wp-content/uploads/2021/07/MS_RS.png 791w, https://www.radicalcandor.com/wp-content/uploads/2021/07/MS_RS-300x218.png 300w, https://www.radicalcandor.com/wp-content/uploads/2021/07/MS_RS-768x559.png 768w, https://www.radicalcandor.com/wp-content/uploads/2021/07/MS_RS-200x146.png 200w" sizes="(max-width: 791px) 100vw, 791px" /> <img src="/wp-content/uploads/2019/04/2x2manipulative-e1724887849284.png" width="179" class="sp-no-webp" alt="Our Approach radical candor approach,radical candor,kim scott" decoding="async" title="Our Approach 4 Our Approach" > Manipulative Insincerity® Manipulative Insincerity — backstabbing, political or passive-aggressive behavior — is what happens when you neither Care Personally nor Challenge Directly. It’s praise that is insincere, flattery to a person’s face and harsh criticism behind their back. Often it’s a self-protective reaction to Obnoxious Aggression. This is the worst kind of feedback fail. Learn more And REMEMBER… SAYING “IN THE SPIRIT OF RADICAL CANDOR” while acting like a jerk still means you’re acting like a jerk. <img decoding="async" width="666" height="375" src="https://www.radicalcandor.com/wp-content/uploads/2020/07/Greta_Dale_Taylor-removebg-preview.png" class="vc_single_image-img attachment-full" alt="Radical Candor emotional reaction" title="Greta_Dale_Taylor" srcset="https://www.radicalcandor.com/wp-content/uploads/2020/07/Greta_Dale_Taylor-removebg-preview.png 666w, https://www.radicalcandor.com/wp-content/uploads/2020/07/Greta_Dale_Taylor-removebg-preview-300x169.png 300w, https://www.radicalcandor.com/wp-content/uploads/2020/07/Greta_Dale_Taylor-removebg-preview-200x113.png 200w" sizes="(max-width: 666px) 100vw, 666px" /> Build a Radically Candid culture of Guidance and Feedback Change is hard. We can help. <img decoding="async" width="488" height="274" src="https://www.radicalcandor.com/wp-content/uploads/2020/08/Kim_Scott-removebg-preview-1.png" class="vc_single_image-img attachment-full" alt="Radical Candor Keynotes" title="Kim_Scott" srcset="https://www.radicalcandor.com/wp-content/uploads/2020/08/Kim_Scott-removebg-preview-1.png 488w, https://www.radicalcandor.com/wp-content/uploads/2020/08/Kim_Scott-removebg-preview-1-300x168.png 300w, https://www.radicalcandor.com/wp-content/uploads/2020/08/Kim_Scott-removebg-preview-1-200x112.png 200w" sizes="(max-width: 488px) 100vw, 488px" /> Inspiring Keynotes A Candor Coach will introduce key concepts, share their own stories, and provide tips and tactics to get you started on your Radical Candor journey. Book a talk <img src="https://www.radicalcandor.com/wp-content/uploads/2019/02/feedback-workshops.png" height="338" width="600" srcset="https://www.radicalcandor.com/wp-content/uploads/2019/02/feedback-workshops.png 600w, https://www.radicalcandor.com/wp-content/uploads/2019/02/feedback-workshops-300x169.png 300w, https://www.radicalcandor.com/wp-content/uploads/2019/02/feedback-workshops-200x113.png 200w" sizes="(max-width: 600px) 100vw, 600px" class="vc_single_image-img attachment-full sp-no-webp" alt="feedback workshops" decoding="async" title="feedback workshops" > Immersive Workshops Develop a shared vocabulary and practice Radical Candor's order of operations: solicit feedback, offer specific praise, and give criticism that’s kind and clear. Host a workshop <img src="https://www.radicalcandor.com/wp-content/uploads/2019/02/digital-feedback-courses.png" height="338" width="600" srcset="https://www.radicalcandor.com/wp-content/uploads/2019/02/digital-feedback-courses.png 600w, https://www.radicalcandor.com/wp-content/uploads/2019/02/digital-feedback-courses-300x169.png 300w, https://www.radicalcandor.com/wp-content/uploads/2019/02/digital-feedback-courses-200x113.png 200w" sizes="(max-width: 600px) 100vw, 600px" class="vc_single_image-img attachment-full sp-no-webp" alt="digital feedback courses" decoding="async" title="digital feedback courses" > Laugh & Learn The Feedback Loop program includes a workplace comedy starring David Alan Grier to help you develop a candid culture of effective feedback. Get The Feedback Loop Want to learn more? Let’s talk! We understand each organization is unique. We’d love to meet with your team to understand the specific problems you are trying to solve so we can customize a feedback coaching, management training or workshop engagement that best meets your needs. Name:*Company:*Email:* How did you hear about Radical Candor?The BookSocial MediaThe Radical Candor PodcastGoogleWord of MouthOtherPhone:What is your training budget for Radical Candor?*Less than $5,000$5,000-$10,000$10,000 - $20,000More than $20,000Our keynotes and workshops run $5,000 and up, so it doesn't look like an in-person engagement will be a fit for your budget. If your budget is flexible or you'd like to talk to us about something else, please adjust your selections above. But we do have other ways to help you out! There are a few great ways to share the ideas in Radical Candor with your team: Read the book and use our guides to have a discussion with your team. Our podcast — weekly episodes packed with practical tips. Our blog — advice columns, stories, and how-to articles. These can hopefully help you and your team build a culture of Radical Candor. Still have questions? Send us an email.Tell us more!*Unique IDThis field is hidden when viewing the formGoogle Ads?This field is hidden when viewing the formGoogle Ads GCLIDCommentsThis field is for validation purposes and should be left unchanged. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); gform.initializeOnLoaded( function() {gformInitSpinner( 24, 'https://www.radicalcandor.com/wp-content/plugins/gravityforms/images/spinner.svg', true );jQuery('#gform_ajax_frame_24').on('load',function(){var contents = jQuery(this).contents().find('*').html();var is_postback = contents.indexOf('GF_AJAX_POSTBACK') >= 0;if(!is_postback){return;}var form_content = jQuery(this).contents().find('#gform_wrapper_24');var is_confirmation = jQuery(this).contents().find('#gform_confirmation_wrapper_24').length > 0;var is_redirect = contents.indexOf('gformRedirect(){') >= 0;var is_form = form_content.length > 0 && ! is_redirect && ! is_confirmation;var mt = parseInt(jQuery('html').css('margin-top'), 10) + parseInt(jQuery('body').css('margin-top'), 10) + 100;if(is_form){form_content.find('form').css('opacity', 0);jQuery('#gform_wrapper_24').html(form_content.html());if(form_content.hasClass('gform_validation_error')){jQuery('#gform_wrapper_24').addClass('gform_validation_error');} else {jQuery('#gform_wrapper_24').removeClass('gform_validation_error');}setTimeout( function() { /* delay the scroll by 50 milliseconds to fix a bug in chrome */ }, 50 );if(window['gformInitDatepicker']) {gformInitDatepicker();}if(window['gformInitPriceFields']) {gformInitPriceFields();}var current_page = jQuery('#gform_source_page_number_24').val();gformInitSpinner( 24, 'https://www.radicalcandor.com/wp-content/plugins/gravityforms/images/spinner.svg', true );jQuery(document).trigger('gform_page_loaded', [24, current_page]);window['gf_submitting_24'] = false;}else if(!is_redirect){var confirmation_content = jQuery(this).contents().find('.GF_AJAX_POSTBACK').html();if(!confirmation_content){confirmation_content = contents;}jQuery('#gform_wrapper_24').replaceWith(confirmation_content);jQuery(document).trigger('gform_confirmation_loaded', [24]);window['gf_submitting_24'] = false;wp.a11y.speak(jQuery('#gform_confirmation_message_24').text());}else{jQuery('#gform