full_description = 'Change is hard. We Can Help. An executive education company founded by Jason Rosoff and Kim Scott, Radical Candor is a team of passionate professionals helping organizations move from a culture of command and control to one of collaboration. Contact Our Team <img fetchpriority="high" decoding="async" width="578" height="330" src="https://www.radicalcandor.com/wp-content/uploads/2024/03/kim-and-jason-crop-e1709758247930.webp" class="vc_single_image-img attachment-full" alt="Effective communication strategies in the workplace" title="Effective communication strategies in the workplace" srcset="https://www.radicalcandor.com/wp-content/uploads/2024/03/kim-and-jason-crop-e1709758247930.webp 578w, https://www.radicalcandor.com/wp-content/uploads/2024/03/kim-and-jason-crop-e1709758247930-300x171.webp 300w, https://www.radicalcandor.com/wp-content/uploads/2024/03/kim-and-jason-crop-e1709758247930-200x114.webp 200w, https://www.radicalcandor.com/wp-content/uploads/2024/03/kim-and-jason-crop-e1709758247930-500x285.webp 500w" sizes="(max-width: 578px) 100vw, 578px" /> At Radical Candor, We’ve Got Your Back We’re dedicated to supporting people and teams who want to transform their work by using Kim Scott’s proven Radical Candor framework to develop a feedback-first culture. <img src="https://www.radicalcandor.com/wp-content/uploads/2020/07/High_Five-removebg-preview.png" height="375" width="666" srcset="https://www.radicalcandor.com/wp-content/uploads/2020/07/High_Five-removebg-preview.png 666w, https://www.radicalcandor.com/wp-content/uploads/2020/07/High_Five-removebg-preview-300x169.png 300w, https://www.radicalcandor.com/wp-content/uploads/2020/07/High_Five-removebg-preview-200x113.png 200w, https://www.radicalcandor.com/wp-content/uploads/2020/07/High_Five-removebg-preview-500x282.png 500w" sizes="(max-width: 666px) 100vw, 666px" class="vc_single_image-img attachment-full sp-no-webp" alt="Radical Candor feedback coaching and consulting." decoding="async" title="Radical Candor feedback coaching and consulting." > Build a Great Team Everyone can be excellent at something. Putting the right people in the right roles will help you and your team reach your highest potential. Learn more <img src="https://www.radicalcandor.com/wp-content/uploads/2023/09/Radical-Candor-approach.png" height="165" width="290" srcset="https://www.radicalcandor.com/wp-content/uploads/2023/09/Radical-Candor-approach.png 290w, https://www.radicalcandor.com/wp-content/uploads/2023/09/Radical-Candor-approach-200x114.png 200w" sizes="(max-width: 290px) 100vw, 290px" class="vc_single_image-img attachment-full sp-no-webp" alt="Radical Candor approach" decoding="async" title="Radical Candor approach" > Achieve Results Collaboratively Learn how to get everyone moving in the same direction, and keep them moving without bogging things down. Learn more <img decoding="async" width="666" height="375" src="https://www.radicalcandor.com/wp-content/uploads/2020/07/Group-removebg-preview.png" class="vc_single_image-img attachment-full" alt="Radical Candor feedback coaching and consulting." title="Radical Candor feedback coaching and consulting." srcset="https://www.radicalcandor.com/wp-content/uploads/2020/07/Group-removebg-preview.png 666w, https://www.radicalcandor.com/wp-content/uploads/2020/07/Group-removebg-preview-300x169.png 300w, https://www.radicalcandor.com/wp-content/uploads/2020/07/Group-removebg-preview-200x113.png 200w" sizes="(max-width: 666px) 100vw, 666px" /> Create a Culture of Feedback Implementing a feedback-first culture will improve your relationships and help your team achieve more success than you ever thought possible. Learn more From bestselling book to boots on the ground What started as an epiphany after Kim Scott received candid advice from a stranger has not only become a bestselling book, Radical Candor blossomed into a company creating BS-free zones at workplaces around the world. Learn more <img width="1280" height="720" decoding="async" class="vp-img aligncenter" src="/wp-content/uploads/2019/04/video-amazon2.jpg" alt="Our Company radical candor,Kim Scott,feedback" title="Our Company 1 Our Company"> Change is Hard. We Can Help. Our Candor Coaches — dedicated management and leadership experts who share our passion for bringing Radical Candor to life — deliver inspiring keynotes and immersive workshops to teams around the world. <img src="https://www.radicalcandor.com/wp-content/uploads/2023/09/Learn-Radical-Candor-1.png" height="375" width="666" srcset="https://www.radicalcandor.com/wp-content/uploads/2023/09/Learn-Radical-Candor-1.png 666w, https://www.radicalcandor.com/wp-content/uploads/2023/09/Learn-Radical-Candor-1-300x169.png 300w, https://www.radicalcandor.com/wp-content/uploads/2023/09/Learn-Radical-Candor-1-200x113.png 200w" sizes="(max-width: 666px) 100vw, 666px" class="vc_single_image-img attachment-full sp-no-webp" alt="Learn Radical Candor" decoding="async" title="Learn Radical Candor" > Learn Key Concepts Giving and receiving feedback can be uncomfortable, but it’s an important part of success at work. Learn Kim Scott’s powerful framework, develop a shared vocabulary and get practical tips you can immediately put into practice. Book a talk <img src="https://www.radicalcandor.com/wp-content/uploads/2020/08/Pic3-removebg-preview.png" height="375" width="666" srcset="https://www.radicalcandor.com/wp-content/uploads/2020/08/Pic3-removebg-preview.png 666w, https://www.radicalcandor.com/wp-content/uploads/2020/08/Pic3-removebg-preview-300x169.png 300w, https://www.radicalcandor.com/wp-content/uploads/2020/08/Pic3-removebg-preview-200x113.png 200w, https://www.radicalcandor.com/wp-content/uploads/2020/08/Pic3-removebg-preview-500x282.png 500w" sizes="(max-width: 666px) 100vw, 666px" class="vc_single_image-img attachment-full sp-no-webp" alt="Feedback" decoding="async" title="The Feedback Loop" > Commit to Candor Each organization is unique. We’d love to learn about the specific problems you’re trying to solve so we can customize an engagement that best meets your needs. Let’s connect <img src="https://www.radicalcandor.com/wp-content/uploads/2019/02/feedback-workshops.png" height="338" width="600" srcset="https://www.radicalcandor.com/wp-content/uploads/2019/02/feedback-workshops.png 600w, https://www.radicalcandor.com/wp-content/uploads/2019/02/feedback-workshops-300x169.png 300w, https://www.radicalcandor.com/wp-content/uploads/2019/02/feedback-workshops-200x113.png 200w" sizes="(max-width: 600px) 100vw, 600px" class="vc_single_image-img attachment-full sp-no-webp" alt="feedback workshops" decoding="async" title="feedback workshops" > Put It Into Practice We teach you how to give and receive clear and kind feedback, providing tools to help your team start putting Radical Candor in action. Our virtual sessions are optimized for inclusion. Host a workshop Radical Candor in Action Helping companies around the world create a culture of guidance. <img src="https://www.radicalcandor.com/wp-content/uploads/2019/02/icon-zenhub.png" height="500" width="500" srcset="https://www.radicalcandor.com/wp-content/uploads/2019/02/icon-zenhub.png 500w, https://www.radicalcandor.com/wp-content/uploads/2019/02/icon-zenhub-150x150.png 150w, https://www.radicalcandor.com/wp-content/uploads/2019/02/icon-zenhub-300x300.png 300w, https://www.radicalcandor.com/wp-content/uploads/2019/02/icon-zenhub-50x50.png 50w" sizes="(max-width: 500px) 100vw, 500px" class="vc_single_image-img attachment-full sp-no-webp" alt="Our Company radical candor,Kim Scott,feedback" decoding="async" title="icon-zenhub" > ZenHub applies the Radical Candor principles Read about how ZenHub, known for building the new standard in developer collaboration tools, applied the principles of Radical Candor to their internal engineering organization. Learn more <img src="https://www.radicalcandor.com/wp-content/uploads/2019/02/icon-amazon.png" height="500" width="500" srcset="https://www.radicalcandor.com/wp-content/uploads/2019/02/icon-amazon.png 500w, https://www.radicalcandor.com/wp-content/uploads/2019/02/icon-amazon-150x150.png 150w, https://www.radicalcandor.com/wp-content/uploads/2019/02/icon-amazon-300x300.png 300w, https://www.radicalcandor.com/wp-content/uploads/2019/02/icon-amazon-50x50.png 50w" sizes="(max-width: 500px) 100vw, 500px" class="vc_single_image-img attachment-full sp-no-webp" alt="Our Company radical candor,Kim Scott,feedback" decoding="async" title="icon-amazon" > Amazon’s “Day One: Insights for Entrepreneurs” Radical Candor’s Kim Scott teamed up with Amazon to support entrepreneurs and business leaders in the market for inspiration and innovation. Learn more <img src="https://www.radicalcandor.com/wp-content/uploads/2019/02/icon-gather.png" height="500" width="500" srcset="https://www.radicalcandor.com/wp-content/uploads/2019/02/icon-gather.png 500w, https://www.radicalcandor.com/wp-content/uploads/2019/02/icon-gather-150x150.png 150w, https://www.radicalcandor.com/wp-content/uploads/2019/02/icon-gather-300x300.png 300w, https://www.radicalcandor.com/wp-content/uploads/2019/02/icon-gather-50x50.png 50w" sizes="(max-width: 500px) 100vw, 500px" class="vc_single_image-img attachment-full sp-no-webp" alt="Our Company radical candor,Kim Scott,feedback" decoding="async" title="icon-gather" > Radical Candor gives guidance to Gather Learn how Nicholas Miller, co-founder and CEO of Gather, the leading event software for restaurants and venues, introduced Radical Candor, and how it helped Gather evolve their feedback culture. Learn more <img src="https://www.radicalcandor.com/wp-content/uploads/2019/02/icon-gem.png" height="500" width="500" srcset="https://www.radicalcandor.com/wp-content/uploads/2019/02/icon-gem.png 500w, https://www.radicalcandor.com/wp-content/uploads/2019/02/icon-gem-150x150.png 150w, https://www.radicalcandor.com/wp-content/uploads/2019/02/icon-gem-300x300.png 300w, https://www.radicalcandor.com/wp-content/uploads/2019/02/icon-gem-50x50.png 50w" sizes="(max-width: 500px) 100vw, 500px" class="vc_single_image-img attachment-full sp-no-webp" alt="Our Company radical candor,Kim Scott,feedback" decoding="async" title="icon-gem" > Gem uses Radical Candor to recognize success Gem, a Los Angeles-based blockchain company focused on healthcare and supply chain, introduced their 20-person team to Radical Candor. Looking for ideas to roll out the framework? Learn more <img src="https://www.radicalcandor.com/wp-content/uploads/2019/02/icon-evernote.png" height="500" width="500" srcset="https://www.radicalcandor.com/wp-content/uploads/2019/02/icon-evernote.png 500w, https://www.radicalcandor.com/wp-content/uploads/2019/02/icon-evernote-150x150.png 150w, https://www.radicalcandor.com/wp-content/uploads/2019/02/icon-evernote-300x300.png 300w, https://www.radicalcandor.com/wp-content/uploads/2019/02/icon-evernote-50x50.png 50w" sizes="(max-width: 500px) 100vw, 500px" class="vc_single_image-img attachment-full sp-no-webp" alt="Our Company radical candor,Kim Scott,feedback" decoding="async" title="icon-evernote" > Evernote learns the benefits of Radical Candor <img width="640" height="354" decoding="async" class="vp-img aligncenter" src="/wp-content/uploads/2019/04/msnbc.jpg" alt="Our Company radical candor,Kim Scott,feedback" title="Our Company 2 Our Company"> <img src="https://www.radicalcandor.com/wp-content/uploads/2019/02/icon-threesixeight.png" height="500" width="500" srcset="https://www.radicalcandor.com/wp-content/uploads/2019/02/icon-threesixeight.png 500w, https://www.radicalcandor.com/wp-content/uploads/2019/02/icon-threesixeight-150x150.png 150w, https://www.radicalcandor.com/wp-content/uploads/2019/02/icon-threesixeight-300x300.png 300w, https://www.radicalcandor.com/wp-content/uploads/2019/02/icon-threesixeight-50x50.png 50w" sizes="(max-width: 500px) 100vw, 500px" class="vc_single_image-img attachment-full sp-no-webp" alt="Our Company radical candor,Kim Scott,feedback" decoding="async" titl