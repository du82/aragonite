 on a path to success.” Daniel Anstandig Founder and CEO, Futuri “Amy was relatable, funny, and down to earth. Facilitators are key in these sessions and Amy did a great job connecting with the audience with both humor and accountability.” Vertex “A really fundamentally important session that could change the way our organisation runs.” BBC Studios “We’ve tried other feedback workshops in the past, and this one is the one that worked!” Peldi Guilizzoni, Founder and CEO, Balsamiq “By fostering a culture of impromptu feedback in our team, we’ve been able to move even faster as an agile company. We get to the root of issues faster, but we also are able to mentor much more effectively and take mistakes as an opportunity to learn and teach.” ZenHub “Investing in Radical Candor training pays for itself. We grew 285% the year we implemented.” James Carbary, Founder of Sweet Fish Media “Radical Candor has had a significant impact on our team. It’s encouraged our managers to step outside of their comfort zones, engage in healthy debates and think about feedback in a different light. It’s helped us open all lines of communication between managers and direct reports, and implementing the concepts in Radical Candor has been a positive experience for everyone.” Nicholas Miller, Co-founder and CEO, Gather “Because we’ve made it easier for clients to give us specific feedback we can take action on, we’ve increased overall satisfaction and retention over the last 12 months, and we’ve been able to reduce churn by five points over the last year.” Alice Default, Co-founder and CEO, Double “Just attended an awesome and insightful webinar by Amy Sandler on Radical Candor (hosted by the fab team at Growth Faculty). Amy was phenomenal in breaking down the importance of caring personally while challenging directly—a key balance that helps resolve conflict and build stronger teams. Highly recommend diving into her work if you haven’t already!” Amelia Crabtree, Program Medical Director, Australia “Heartfelt thanks to Melissa (Mel) Andrada for an incredible Radical Candor workshop this morning. Your guidance created a safe and open space for us to share our stories, reminding us of the power and importance of genuine connection. We developed essential skills and a common language for giving feedback, focused listening, and skillfully giving praise. This experience brought us even closer as a community dedicated to serving and caring for our students and each other with deep authenticity.” Trinity Episcopal School Charlotte, NC, USA “When we discovered Kim Scott’s groundbreaking concept of ‘Radical Candor’, it revolutionized our approach to team cohesion and efficacy. This approach is all about creating authentic spaces for feedback and open communication. Radical Candor encourages leaders to foster an environment where honest feedback thrives, including feedback directed at the leaders themselves.” Funtasia™️ Educational Enterprise “After the Radical Candor training, I had an employee come to me and say, ‘I can see a total change in my manager. I went from barely speaking to him to meeting with him on a regular basis. I went from being uncertain about my future at Heitman to now being confident that I can fulfill my career goals.’” Heitman, Christine Nicholl, SVP, Global Head of Organizational Development “It’s been an incredible journey for us — from book studies to informal discussion, the Radical Candor quadrants have become a new vocabulary in our district. The positive impact of Radical Candor has been far-reaching, thank you!” Becky Peters St. Vrain Valley School District Colorado, USA “The AsiaPacific leadership team used this workshop to assess and improve how they communicate to their teams and each other, integrating learnings from the Indian, Singaporean, and Australian cultures while together. Having a Radical Candor coach and peers from other regions to practice with was invaluable.” Clare Martin MiQ Bangalore, India “Thank you so much for coming and working with our team. Everyone loved the workshop…everything you shared with us will help us be our best selves and best Hireologists.” Christen Calloway Hireology Illinois, USA “I loved it! I was already familiar with the concept, and still it was a great conversation…Meeting these world-class business ‘gurus’ is very inspiring and aspirational.” Nubank team member São Paulo, Brazil “I’ve only heard GREAT things about the training. It makes me so proud of this team to hear them reflecting on their styles and thinking about what they need to change in their behaviors.” Janel Lao Jobvite California, USA Workshops: Where Theory Meets Practice Stop hoping for better communication—be intentional about making it happen with a Radical Candor workshop. We’ll teach your team how Radical Candor can become an integral part of their success at work. Our immersive virtual and in-person workshops turn concepts into competencies, giving your team the practical skills they need to solicit, give, gauge, and encourage feedback. What Sets Our Workshops Apart: √ Real-world scenarios that mirror your challenges √ Safe, supportive environment √ Immediate application of Radical Candor principles √ Virtual and in-person options Digital Courses that Deliver Results Learn From the Expert: Embark on an hour-long animated learning adventure with the Radical Candor expert Kim Scott. Kim will guide learners through 10 snack-sized sections explaining how to apply the principles of Radical Candor and how to avoid feedback fails. Knowledge checks at the end of each section reinforce learning. Available for companies with their own LMS or for individuals here starting at $149. The Feedback Loop: Experience the world’s first workplace comedy series that actually teaches valuable skills. Think Groundhog Day meets The Office! You’ll get an hour of hilarious content; improv-inspired exercises; and after-episode action plans you can put into practice immediately. The program easily scales across in-person and remote organizations. Available for companies with their own LMS or for individuals from $149 a person. Learn to say what you mean without being mean. Contact Radical Candor today! Ready to get started? Let’s Talk! We understand each organization is unique. We’d love to meet with you to understand the specific problems you are trying to solve so we can customize a feedback training engagement that best meets your needs. Click on the logos below to see how other organizations have rolled out Radical Candor. Name:*Company:*Email:* How did you hear about Radical Candor?The BookSocial MediaThe Radical Candor PodcastGoogleWord of MouthOtherPhone:What is your training budget for Radical Candor?*Less than $5,000$5,000-$10,000$10,000 - $20,000More than $20,000Our keynotes and workshops run $5,000 and up, so it doesn't look like an in-person engagement will be a fit for your budget. If your budget is flexible or you'd like to talk to us about something else, please adjust your selections above. But we do have other ways to help you out! There are a few great ways to share the ideas in Radical Candor with your team: Read the book and use our guides to have a discussion with your team. Our podcast — weekly episodes packed with practical tips. Our blog — advice columns, stories, and how-to articles. These can hopefully help you and your team build a culture of Radical Candor. Still have questions? Send us an email.Tell us more!*Unique IDThis field is hidden when viewing the formGoogle Ads?This field is hidden when viewing the formGoogle Ads GCLIDPhoneThis field is for validation purposes and should be left unchanged. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); gform.initializeOnLoaded( function() {gformInitSpinner( 24, 'https://www.radicalcandor.com/wp-content/plugins/gravityforms/images/spinner.svg', true );jQuery('#gform_ajax_frame_24').on('load',function(){var contents = jQuery(this).contents().find('*').html();