title = "Radical Candor In The News | Stories By And About Radical Candor"
description = "Read articles, essays and news about and by Kim Scott and the Radical Candor team."
full_description = 'Radical Candor In The News Read articles about and by Kim Scott and the Radical Candor team <img src="https://www.radicalcandor.com/wp-content/uploads/2019/02/logo-the-new-york-times.png" height="400" width="600" srcset="https://www.radicalcandor.com/wp-content/uploads/2019/02/logo-the-new-york-times.png 600w, https://www.radicalcandor.com/wp-content/uploads/2019/02/logo-the-new-york-times-300x200.png 300w, https://www.radicalcandor.com/wp-content/uploads/2019/02/logo-the-new-york-times-200x133.png 200w" sizes="auto, (max-width: 600px) 100vw, 600px" class="wpex-align-middle sp-no-webp" alt="The New York Times Radical Candor" decoding="async" loading="lazy" style="border-radius:var(--wpex-rounded);" title="In The News 1 In The News" > ‘Founder Mode’ Explains the Rise of Trump in Silicon Valley by Kim Scott (The New York Times) Silicon Valley’s current fascination with a trendy management meme illustrates a broader and more troubling turn in certain powerful pockets of its culture — one that has seized our politics and could even unduly influence our election (again). I’m talking about founder mode. A recently coined management style being celebrated by some venture capitalists, it embraces the notion that a company’s founder must make decisions unilaterally. This neo-authoritarianism is nothing short of a rejection of the historical values that made Silicon Valley what it is today. Read more <img src="https://www.radicalcandor.com/wp-content/uploads/2023/10/TedX.png" height="225" width="225" srcset="https://www.radicalcandor.com/wp-content/uploads/2023/10/TedX.png 225w, https://www.radicalcandor.com/wp-content/uploads/2023/10/TedX-150x150.png 150w, https://www.radicalcandor.com/wp-content/uploads/2023/10/TedX-200x200.png 200w" sizes="auto, (max-width: 225px) 100vw, 225px" class="wpex-align-middle sp-no-webp" alt="In The News radical candor,news,radical candor in the news,Kim Scott,google,apple,silicon valley" decoding="async" loading="lazy" style="border-radius:var(--wpex-rounded);" title="In The News 2 In The News" > TEDxPortland: How to Lead With Radical Candor New York Times bestselling author, Kim Scott, has cracked the code on giving valuable feedback in a way that builds genuine relationships, drives results, and creates positive workplaces. Her riveting talk explores the idea of adopting radical candor and how leaders create an environment of trust and innovation that fosters personal growth and professional development. Kim draws from personal experiences and examples as a Silicon Valley executive, highlighting the transformative power of this leadership approach. Read the transcript <img src="https://www.radicalcandor.com/wp-content/uploads/2023/04/INC.jpg" height="280" width="500" srcset="https://www.radicalcandor.com/wp-content/uploads/2023/04/INC.jpg 500w, https://www.radicalcandor.com/wp-content/uploads/2023/04/INC-300x168.jpg 300w, https://www.radicalcandor.com/wp-content/uploads/2023/04/INC-200x112.jpg 200w" sizes="auto, (max-width: 500px) 100vw, 500px" class="wpex-align-middle sp-no-webp" alt="Radical Candor Inc." decoding="async" loading="lazy" style="border-radius:var(--wpex-rounded);" title="In The News 3 In The News" > How Much Should You Pay Yourself? 3 Tips for Entrepreneurs by Sarah Lynch (Inc.) A good test: “Look yourself in the mirror and see if you feel good about [the gap]. And if you don’t, then either pay yourself less or redistribute some of the equity,” Kim Scott says. Additionally, founders can create a system of checks and balances to further ensure salary fairness, Scott says. Whether that’s consulting investors or advisers, working with someone else to develop a compensation plan can be beneficial. “Don’t just decide yourself on what you pay yourself,” Scott says, “because you wind up making a sub-optimal decision.” Read more <img src="https://www.radicalcandor.com/wp-content/uploads/2023/09/safe-places.png" height="119" width="490" srcset="https://www.radicalcandor.com/wp-content/uploads/2023/09/safe-places.png 490w, https://www.radicalcandor.com/wp-content/uploads/2023/09/safe-places-300x73.png 300w, https://www.radicalcandor.com/wp-content/uploads/2023/09/safe-places-200x49.png 200w" sizes="auto, (max-width: 490px) 100vw, 490px" class="wpex-align-middle sp-no-webp" alt="safe places to work" decoding="async" loading="lazy" style="border-radius:var(--wpex-rounded);" title="In The News 4 In The News" > Top 24 Fearless Pioneers 2023 Celebrating business and thought leaders around the world nominated for their contribution and commitment to promoting psychological safety and eliminating fear in the workplace. Kim Scott is a renowned author, leadership coach, and distinguished former executive at both Google and Apple. Her influential book Radical Candor has played a crucial role in advancing psychological safety in the workplace. She has helped organizations cultivate a culture of radical candor, promoting open and constructive conversations that contribute to a psychologically safe environment. By embracing Kim’s principles, teams can establish stronger connections, drive collaboration, and empower individuals to reach their full potential. Read more <img src="https://www.radicalcandor.com/wp-content/uploads/2023/04/Screenshot-2023-04-04-at-1.18.15-PM.png" height="125" width="360" srcset="https://www.radicalcandor.com/wp-content/uploads/2023/04/Screenshot-2023-04-04-at-1.18.15-PM.png 360w, https://www.radicalcandor.com/wp-content/uploads/2023/04/Screenshot-2023-04-04-at-1.18.15-PM-300x104.png 300w, https://www.radicalcandor.com/wp-content/uploads/2023/04/Screenshot-2023-04-04-at-1.18.15-PM-200x69.png 200w" sizes="auto, (max-width: 360px) 100vw, 360px" class="wpex-align-middle sp-no-webp" alt="Radical Candor CNBC" decoding="async" loading="lazy" style="border-radius:var(--wpex-rounded);" title="In The News 5 In The News" > Mark Zuckerberg’s new return-to-office mandate is a clear problem, says Harvard expert: It’ll cause a ‘huge amount of distrust’ by Ashton Jackson (CNBC) Empathy, or a lack thereof, has become a problem for CEOs across the country as workplaces shift away from Covid-era protocols, experts say. Employees and bosses spoke often about their lives outside the office while trying to navigate the pandemic’s uncertain peak, but the trend is now reversing, leadership coach Muriel Wilkins told the “Radical Candor” podcast earlier this month. ″[Now] leaders just want to drive to results,” said Wilkins. “And they’re sort of saying, ‘Well, it’s either drive the results or be empathetic. I can’t do both.’” Read more <img src="https://www.radicalcandor.com/wp-content/uploads/2023/04/harvard-business-review-logo-FD07ED9958-seeklogo.com_.png" height="178" width="300" srcset="https://www.radicalcandor.com/wp-content/uploads/2023/04/harvard-business-review-logo-FD07ED9958-seeklogo.com_.png 300w, https://www.radicalcandor.com/wp-content/uploads/2023/04/harvard-business-review-logo-FD07ED9958-seeklogo.com_-200x119.png 200w" sizes="auto, (max-width: 300px) 100vw, 300px" class="wpex-align-middle sp-no-webp" alt="HBR Radical Candor" decoding="async" loading="lazy" style="border-radius:var(--wpex-rounded);" title="In The News 6 In The News" > When Your Boss Gives You Bad Feedback, Badly by Kim Scott, Liz Fosslien, and Mollie West Duffy (HBR) It’s difficult to manage your feelings when getting feedback that feels too harsh, overly nice, or somehow dishonest. We all struggle with feedback, so extend a little grace to yourself for having strong emotions, and to the other person for initiating a difficult conversation. The authors present the three most common ways people deliver feedback in a way that causes harm and elicits strong emotions, as well as five key steps to take when you get poorly delivered feedback. Read more <img src="https://www.radicalcandor.com/wp-content/uploads/2019/02/logo-the-new-york-times.png" height="400" width="600" srcset="https://www.radicalcandor.com/wp-content/uploads/2019/02/logo-the-new-york-times.png 600w, https://www.radicalcandor.com/wp-content/uploads/2019/02/logo-the-new-york-times-300x200.png 300w, https://www.radicalcandor.com/wp-content/uploads/2019/02/logo-the-new-york-times-200x133.png 200w" sizes="auto, (max-width: 600px) 100vw, 600px" class="wpex-align-middle sp-no-webp" alt="The New York Times Radical Candor" decoding="async" loading="lazy" style="border-radius:var(--wpex-rounded);" title="In The News 1 In The News" > Work From the Office, Get Laid off at Home by Sarah Kessler (The New York Times) Kim Scott, a former Google executive and the author of Radical Candor, suggested that awkwardness or embarrassment [of being laid off in person] could be avoided by planning ahead — for instance, having an extra conference room for people to collect themselves and an option to collect belongings after hours. [If you’re laying someone off remotely] the medium matters. A video call with your manager beats the impersonal email. “It’s very hard to care personally over email,” Scott said. Read more <img src="https://www.radicalcandor.com/wp-content/uploads/2023/04/NicePng_wall-street-journal-logo_1550192.png" height="350" width="601" srcset="https://www.radicalcandor.com/wp-content/uploads/2023/04/NicePng_wall-street-journal-logo_1550192.png 601w, https://www.radicalcandor.com/wp-content/uploads/2023/04/NicePng_wall-street-journal-logo_1550192-300x175.png 300w, https://www.radicalcandor.com/wp-content/uploads/2023/04/NicePng_wall-street-journal-logo_1550192-200x116.png 200w" sizes="auto, (max-width: 601px) 100vw, 601px" class="wpex-align-middle sp-no-webp" alt="Radical Candor Wall Street Journal" decoding="async" loading="lazy" style="border-radius:var(--wpex-rounded);" title="In The News 8 In The News" > A Boss’s Guide to Leading Through Uncertain Times by Ray A. Smith (The Wall Street Journal) After a round of layoffs at a software startup she ran a couple decades ago, Kim Scott recalls telling staff there wouldn’t be anymore—only to have to lay off some staff later. After that, the former Google executive who wrote a book about frank communications at work, began sharing status reports on the company’s financial status at the weekly all-hands meeting. Read more <img src="https://www.radicalcandor.com/wp-content/uploads/2023/04/harvard-business-review-logo-FD07ED9958-seeklogo.com_.png" height="178" width="300" srcset="https://www.radicalcandor.com/wp-content/uploads/2023/04/harvard-business-review-logo-FD07ED9958-seeklogo.com_.png 300w, https://www.radicalcandor.com/wp-content/uploads/2023/04/harvard-business-review-logo-FD07ED9958-seeklogo.com_-200x119.png 200w" sizes="auto, (max-width: 300px) 100vw, 300px" class="wpex-align-middle sp-no-webp" alt="HBR Radical Candor" decoding="async" loading="lazy" style="border-radius:var(--wpex-rounded);" title="In The News 6 In The News" > How Leaders Can Get the Feedback They Need to Grow by Kim Scott, Liz Fosslien and Mollie West Duffy (HBR) When things are uncertain, it can feel comforting to avoid difficult feedback. But creating stability for your team — and success for your organization — depends on your ability to learn what needs to change. Burying your head in the sand is never the safe thing to do. A culture of ruinous empathy or false harmony is not the path to success. Instead, invite criticism from your team with these six tips for how to successfully solicit Radical Candor from your employees. Read more <img src="https://www.radicalcandor.com/wp-content/uploads/2023/04/Built_In_Logo.jpg" height="532" width="1017" srcset="https://www.radicalcandor.com/wp-content/uploads/2023/04/Built_In_Logo.jpg 1017w, https://www.radicalcandor.com/wp-content/uploads/2023/04/Built_In_Logo-300x157.jpg 300w, https://www.radicalcandor.com/wp-content/uploads/2023/04/Built_In_Logo-768x402.jpg 768w, https://www.radicalcandor.com/wp-content/uploads/2023/04/Built_In_Logo-200x105.jpg 200w" sizes="auto, (max-width: 1017px) 100vw, 1017px" class="wpex-align-middle sp-no-webp" alt="Radical Candor Built In" decoding="async" loading="lazy" style="border-radius:var(--wpex-rounded);" title="In The News 10 In The News" > Why employees appreciate radical candor if it’s done right. Here’s how to get the information across without offending them. by Dawn Kawamoto (Built In) Former Google AdSense director Kim Scott vividly remembers a turning point in her career when her boss gave her a dose of Radical Candor. It began with a meeting room to discuss AdSense. Standing in one corner clad in bright blue spandex pants was Google co-founder Sergey Brin exercising on an elliptical machine and in the other corner was then CEO Eric Schmidt with his nose buried in his laptop. Read more <img src="https://www.radicalcandor.com/wp-content/uploads/2023/04/NicePng_wall-street-journal-logo_1550192.png" height="350" width="601" srcset="https://www.radicalcandor.com/wp-content/uploads/2023/04/NicePng_wall-street-journal-logo_1550192.png 601w, https://www.radicalcandor.com/wp-content/uploads/2023/04/NicePng_wall-street-journal-logo_1550192-300x175.png 300w, https://www.radicalcandor.com/wp-content/uploads/2023/04/NicePng_wall-street-journal-logo_1550192-200x116.png 200w" sizes="auto, (max-width: 601px) 100vw, 601px" class="wpex-align-middle sp-no-webp" alt="Radical Candor Wall Street Journal" decoding="async" loading="lazy" style="border-radius:var(--wpex-rounded);" title="In The News 8 In The News" > Why Is Your Boss Asking About Your Feelings? Inside the Empathy Management Trend by Ray A. Smith (The Wall Street Journal) Empathy can easily be misinterpreted, says Kim Scott, a CEO coach and former Google executive whose book “Radical Candor” advocates for direct communications at work. Managers sometimes mistakenly assume they should ask a lot of questions about staffers’ lives outside work in a way that can feel intrusive. “That is not caring personally, it’s being oblivious to how the other person feels,” she says. Too much focus on empathy can also cause some leaders to hold off on tough feedback. It’s counterproductive “when empathy begins to paralyze us to ‘I’m so aware of how you might feel that I’m afraid to talk to you.’” Read more <img src="https://www.radicalcandor.com/wp-content/uploads/2023/04/Screenshot-2023-04-04-at-2.03.51-PM.png" height="210" width="839" srcset="https://www.radicalcandor.com/wp-content/uploads/2023/04/Screenshot-2023-04-04-at-2.03.51-PM.png 839w, https://www.radicalcandor.com/wp-content/uploads/2023/04/Screenshot-2023-04-04-at-2.03.51-PM-300x75.png 300w, https://www.radicalcandor.com/wp-content/uploads/2023/04/Screenshot-2023-04-04-at-2.03.51-PM-768x192.png 768w, https://www.radicalcandor.com/wp-content/uploads/2023/04/Screenshot-2023-04-04-at-2.03.51-PM-200x50.png 200w" sizes="auto, (max-width: 839px) 100vw, 839px" class="wpex-align-middle sp-no-webp" alt="Radical Candor Quartz" decoding="async" loading="lazy" style="border-radius:var(--wpex-rounded);" title="In The News 12 In The News" > The most ethical way for leaders to '
