ndor.com/wp-content/uploads/2021/01/RC-Resources-500x424.png 500w, https://www.radicalcandor.com/wp-content/uploads/2021/01/RC-Resources-680x576.png 680w" sizes="(max-width: 889px) 100vw, 889px" /> What: The Feedback Loop, an original workplace comedy series starring Kim Scott and David Alan Grier and an accompanying digital learning program. Where: Your computer. When: Work at your own pace. How Much? Sign up now and get 10% off the already low price of $149. Enter code FEEDBACK at checkout. You’ll Get: An hour of hilarious content about a team whose feedback fails are costing them business, delivered over 5 episodes. Quizzes and action plans you can put into practice immediately. Buy the self-paced e-course Radical Candor is on ‘Sessions by MasterClass’ What: Kim Scott, Jason Rosoff and Radical Candor role players deliver the principles of our feedback framework in 8 structured sections on Sessions by MasterClass. Why: Set yourself on a path for personal and professional growth, learn how to have productive conversations using Radical Candor principles, and acquire the tools to transform your mindset. Where: Your computer. When: You decide! How Much? Save 20% when you use the link MasterClass.com/RadicalCandor. Sign up for MasterClass Get the 1-Hour Radical Candor LIT Videobook What: Learn how to Care Personally and Challenge Directly on the fly when you experience Radical Candor as a 1-hour videobook with animation, interviews, and more. Why: Informal, pervasive guidance and feedback are clutch to a radically candid work environment. And it always starts with you. Where: Your computer. When: You decide! How Much? $25 Buy the videobook Radical Candor Feedback Training for Teams & Companies Interactive Workshops Through storytelling, a trained Candor Coach will introduce you and your team to the core Radical Candor concepts and a shared vocabulary as well as tips and techniques that demonstrate for your team how Radical Candor can become an integral part of their success at work. Digital Radical Candor Feedback Training Courses Learn From the Expert Embark on an hour-long animated learning adventure with the Radical Candor expert Kim Scott. Kim will guide learners through 10 snack-sized sections explaining how to apply the principles of Radical Candor and how to avoid feedback fails. Knowledge checks at the end of each section reinforce this new set of communication skills that can be implemented immediately. Available for companies with their own LMS. The Feedback Loop: A Workplace Comedy Series Radical Candor and Second City Works introduce The Feedback Loop (think Groundhog Day meets The Office), a 5-episode workplace comedy series that brings Radical Candor’s feedback framework to life. You’ll get an hour of hilarious content about a team whose feedback fails are costing them business; improv-inspired exercises to teach everyone the skills they need to work better together; after-episode action plans you can put into practice immediately. The program easily scales across in-person and remote organizations. Individual licenses start at $149 a person. Keynote: The talk Radical Candor author Kim Scott, or a trained Candor Coach, will introduce key Radical Candor concepts, providing tips and tactics to get you started on your Radical Candor journey. Solutions that scale Train-the-Trainer Workshop Facilitate certified Radical Candor workshops within your organization using our copyrighted training materials. One of our Radical Candor experts will train up to 20 people to deliver Radical Candor workshops during this workshop. Radical Candor Content Licensing Get unlimited access to our Radical Candor copyrighted content, including training decks and workshop materials, to use across your organization. The annual fee is scaled based on the size of your company. After the Radical Candor training, I had an employee come to me and say, ‘I can see a total change in my manager. I went from barely speaking to him to meeting with him on a regular basis. I went from being uncertain about my future at Heitman to now being confident that I can fulfill my career goals.’” — Heitman Book a consultation Videos to Help You Learn the Feedback Framework Radical Candor In 6 Minutes Learn the basics of Radical Candor in six minutes. Obnoxious Aggression is what happens when you challenge someone directly, but don’t care about them personally. Manipulative Insincerity is praise that is non-specific and insincere or criticism that is neither clear nor kind. Ruinous Empathy is “nice” but ultimately unhelpful or even damaging. Radical Candor is criticism that is kind and clear, and praise that is specific and sincere. Mini Keynote With Kim Scott Kim breaks down the concepts on Radical Candor, provides specific stories and examples, and reveals the two incidents that prompted her to bottle the magic of Radical Candor and share it with the world. Radical Candor not only become a best-selling book, but it’s also blossomed into a company creating BS-free zones at workplaces around the world. The Talk that Started a Revolution Kim’s talk at First Round Capital went viral and started a feedback revolution around the world. Why? Because implementing a feedback-first culture will improve your relationships and help your team achieve more success than you ever thought possible. Next, Kim is tackling bias and bullying in the workplace. Order her new book, Just Work: How To Root Out Bias, Prejudice, and Bullying to Create a Kick-Ass Culture of Inclusivity, to learn how we can recognize, attack, and eliminate workplace injustice ― and transform our careers and organizations in the process. Radical Candor Feedback Training Learning Guides Our Radical Candor guides are designed to help you deepen your learning. Each section of each guide includes text as well as links to go further down the road to Radical Candor by listening to a podcast episode or watching a video. Plus, you can now join the Radical Candor Community and keep it kind and clear 24/7! <img src="https://www.radicalcandor.com/wp-content/uploads/2022/11/Radical-Candor-Learning-Guides.png" height="350" width="1400" srcset="https://www.radicalcandor.com/wp-content/uploads/2022/11/Radical-Candor-Learning-Guides.png 1400w, https://www.radicalcandor.com/wp-content/uploads/2022/11/Radical-Candor-Learning-Guides-300x75.png 300w, https://www.radicalcandor.com/wp-content/uploads/2022/11/Radical-Candor-Learning-Guides-1024x256.png 1024w, https://www.radicalcandor.com/wp-content/uploads/2022/11/Radical-Candor-Learning-Guides-768x192.png 768w, https://www.radicalcandor.com/wp-content/uploads/2022/11/Radical-Candor-Learning-Guides-200x50.png 200w" sizes="(max-width: 1400px) 100vw, 1400px" class="vc_single_image-img attachment-full sp-no-webp" alt="Radical Candor Resources" decoding="async" title="Radical Candor Learning Guide Resources" > Join the Radical Candor Community <img src="https://www.radicalcandor.com/wp-content/uploads/2024/10/RadicalCandorCommunity.png" height="501" width="987" srcset="https://www.radicalcandor.com/wp-content/uploads/2024/10/RadicalCandorCommunity.png 987w, https://www.radicalcandor.com/wp-content/uploads/2024/10/RadicalCandorCommunity-300x152.png 300w, https://www.radicalcandor.com/wp-content/uploads/2024/10/RadicalCandorCommunity-768x390.png 768w, https://www.radicalcandor.com/wp-content/uploads/2024/10/RadicalCandorCommunity-200x102.png 200w" sizes="(max-width: 987px) 100vw, 987px" class="vc_single_image-img attachment-full sp-no-webp" alt="Join the Radical Candor Community" decoding="async" title="RadicalCandorCommunity" > We’re so excited to announce our new community and accompanying app that’s full of tools and resources to help you practice Radical Candor on your own or with other community members. Get access to Radical Candor courses, an ad-free podcast, real-time, interactive learning opportunities, regular interaction with Radical Candor experts, and so much more! If you’ve ever struggled with communication at work, this is your community. Join the Radical Candor Community >> The Radical Candor Quick Start Guide This one-page quick-start guide gives you the quick and dirty on Radical Candor complete with definitions for the quadrants and the order of operations. Print it out and keep it by your desk! Download the guide (landscape) >>Download the guide (portrait) >> The ‘Radical Candor’ Book Club Discussion Guide We’ve put together this list of questions to get you started with your Radical Candor book club. Visit our book page to buy copies of Radical Candor in bulk at a reduced rate. After your club members have read the book, use the critical thinking questions to help guide the discussion. Download the guide >> The Radical Candor Practice Playbook So, you’ve read the book, listened to the podcast, watched the videos and attended a workshop or keynote. Now what? Continue developing your skills with our Radical Candor Practice Playbook, a workbook that takes you through each step of the Order of Operations. Download the playbook >> 5 Tips for Practicing Radical Candor with Direct Reports Your ability to build trusting, human connections with the people who report directly to you will determine the quality of everything that follows. Despite these relationships being vitally important, most of us are at a loss when we set out to build relationships with our direct reports. Download the guide >> 6 Ways to Encourage Feedback Between Others It’s a lot easier to lead by example than it is to change other people’s behavior. If you want to encourage feedback between the people on your team or at your organization, you’re going to have to create an environment where people feel safe and encouraged to give real feedback. Download the guide >> Quick Start Guide: Encouraging Feedback Encouraging feedback between others will facilitate stronger relationships between peers, allow for more praise to be shared and provide more perspectives on what’s going well and why. Download the guide >> 11 Ways for Managers to Get Feedback From their Teams As a manager, it’s crucially important for you to get feedback and find out what people really think. Getting people to Challenge you Directly can be the difference between success and failure, which means you need to make a concerted effort to get feedback. Download the guide >> 6 Steps for Rolling Out Radical Candor On Your Team Radical Candor builds trust and opens the door for the kind of communication that helps you achieve the results you’re aiming for. If you’re ready to introduce Radical Candor to your team, follow these six steps to roll it out like a boss. Download the guide >> How to Have Radically Candid Performance Development Conversations It is a manager’s job to help each person on their team develop and grow their careers, as well as manage their performance. Balancing the intrinsic desire to improve and grow and the extrinsic desire for rewards like bonuses, equity, and promotion is one of the most difficult things about being a manager. We can help you navigate. Download the guide >> Use the C.O.R.E. Model to Give Effective Feedback Radically Candid praise and criticism both include caring and a challenge. In order to make sure your feedback lets the other person know what was good and what wasn’t — what to do more of and what to do less of — use the four-step CORE method. Download the guide >> Use Our 7-Step Get Sh*t Done Wheel To Get More Done With Less Drama The GSD Wheel has 7 steps: Listen, Clarify, Debate, Decide, Persuade, Implement and Learn. When run effectively, the GSD Wheel will enable your team to achieve more collectively than anyone could ever dream of achieving individually. Download the guide >> Radical Candor Success Stories View this post on Instagram A post shared by Funtasia™️ Educational Enterprise (@funtasia) <img src="https://www.radicalcandor.com/wp-content/uploads/2023/09/Hubspot-Forbes.png" height="788" width="1400" srcset="https://www.radicalcandor.com/wp-content/uploads/2023/09/Hubspot-Forbes.png 1400w, https://www.radicalcandor.com/wp-content/uploads/2023/09/Hubspot-Forbes-300x169.png 300w, https://www.radicalcandor.com/wp-content/uploads/2023/09/Hubspot-Forbes-1024x576.png 1024w, https://www.radicalcandor.com/wp-content/uploads/2023/09/Hubspot-Forbes-768x432.png 768w, https://www.radicalcandor.com/wp-content/uploads/2023/09/Hubspot-Forbes-200x113.png 200w" sizes="auto, (max-width: 1400px) 100vw, 1400px" class="wpex-align-middle wpex-shadow sp-no-webp" alt="The Importance of Communication in the Workplace" decoding="async" loading="lazy" title="Resources 1 Resources" > View this post on Instagram A post shared by Imana Sherrill (@tescharlotte_isherrill) <img decoding="async" class="vc_single_image-img" src="https://www.radicalcandor.com/wp-content/uploads/2022/04/gather-technologies_-125x100.png" width="125" height="100" alt="Radical Candor case study Gather" title="Radical Candor case study gather-technologies_" /> <img decoding="async" class='
