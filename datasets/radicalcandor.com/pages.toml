sulting." title="Radical Candor feedback coaching and consulting." srcset="https://www.radicalcandor.com/wp-content/uploads/2021/01/key_work_fbl.png 920w, https://www.radicalcandor.com/wp-content/uploads/2021/01/key_work_fbl-300x198.png 300w, https://www.radicalcandor.com/wp-content/uploads/2021/01/key_work_fbl-768x506.png 768w, https://www.radicalcandor.com/wp-content/uploads/2021/01/key_work_fbl-200x132.png 200w" sizes="(max-width: 920px) 100vw, 920px" /> Strategies for building a cohesive team. <img src="https://www.radicalcandor.com/wp-content/uploads/2023/07/Module_5_-_08_ProRe.png" height="375" width="666" srcset="https://www.radicalcandor.com/wp-content/uploads/2023/07/Module_5_-_08_ProRe.png 666w, https://www.radicalcandor.com/wp-content/uploads/2023/07/Module_5_-_08_ProRe-300x169.png 300w, https://www.radicalcandor.com/wp-content/uploads/2023/07/Module_5_-_08_ProRe-200x113.png 200w" sizes="(max-width: 666px) 100vw, 666px" class="vc_single_image-img attachment-full sp-no-webp" alt="Homepage NEW radical candor,feedback training" decoding="async" title="Module_5_-_08_ProRe" > Tools to help you and your team get stuff done with less drama. <img src="https://www.radicalcandor.com/wp-content/uploads/2023/07/Module_4_-_08_ProRes.png" height="375" width="666" srcset="https://www.radicalcandor.com/wp-content/uploads/2023/07/Module_4_-_08_ProRes.png 666w, https://www.radicalcandor.com/wp-content/uploads/2023/07/Module_4_-_08_ProRes-300x169.png 300w, https://www.radicalcandor.com/wp-content/uploads/2023/07/Module_4_-_08_ProRes-200x113.png 200w" sizes="(max-width: 666px) 100vw, 666px" class="vc_single_image-img attachment-full sp-no-webp" alt="Homepage NEW radical candor,feedback training" decoding="async" title="Module_4_-_08_ProRes" > It’s not a license to act like a jerk. <img src="https://www.radicalcandor.com/wp-content/uploads/2023/07/Module_2.png" height="375" width="666" srcset="https://www.radicalcandor.com/wp-content/uploads/2023/07/Module_2.png 666w, https:/