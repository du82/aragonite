ing the concepts in Radical Candor has been a positive experience for everyone.” Nicholas Miller, Co-founder and CEO, Gather “Because we’ve made it easier for clients to give us specific feedback we can take action on, we’ve increased overall satisfaction and retention over the last 12 months, and we’ve been able to reduce churn by five points over the last year.” Alice Default, Co-founder and CEO, Double “Just attended an awesome and insightful webinar by Amy Sandler on Radical Candor (hosted by the fab team at Growth Faculty). Amy was phenomenal in breaking down the importance of caring personally while challenging directly—a key balance that helps resolve conflict and build stronger teams. Highly recommend diving into her work if you haven’t already!” Amelia Crabtree, Program Medical Director, Australia “Heartfelt thanks to Melissa (Mel) Andrada for an incredible Radical Candor workshop this morning. Your guidance created a safe and open space for us to share our stories, reminding us of the power and '
