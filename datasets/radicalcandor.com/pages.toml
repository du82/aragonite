["https://www.radicalcandor.com/encourage-feedback"]
title = "How To Encourage Feedback Between Others In The Workplace | Radical Candor"
description = "Kim Scott is the author of Radical Candor: Be a Kick-Ass Boss Without Losing Your Humanity and Radical Respect: How to Work Together Better and co-founder of Radical Candor, a company that helps people put the ideas in her books into practice. Kim was a CEO coach at Dropbox, Qualtrics, Twitter and other tech companies. She was a member of the faculty at Apple University and before that led AdSense YouTube, and DoubleClick teams at Google. She's also managed a pediatric clinic in Kosovo and started a diamond-cutting factory in Moscow. She lives with her family in Silicon Valley."
full_description = '''5 Easy Ways to Encourage Feedback Between Others at Work Kim Scott Encouraging Feedback Facebook Twitter LinkedIn It’s a lot easier to lead by example than it is to change other people’s behavior. If you want to encourage feedback between the people on your team, you’re going to have to create an environment where people feel safe and encouraged to give real feedback. When I was at Google, rather than focusing on “giving feedback” to my team, I encouraged them to tell me when I was wrong. I did everything I could to encourage people to criticize me, or at least simply to talk to me. After a false start, the team started to open up. We began to debate openly, and we had more fun together. You have to lead by example, so it makes sense to start by soliciting feedback and then to focus on giving it. But real managerial leverage comes when you learn to encourage feedback between others. As just one person, if all the praise and criticism goes through you, you become a bottleneck. In order to foster a feedback culture and ensure that it scales across the team/company, it’s important to make sure that peers give and receive feedback to one another. In addition to leading by example, here are some things you can do to encourage feedback between team members. Need help with Radical Candor? Let's talk! >> Table of Contents Toggle 1. Encourage feedback by insisting people talk to one another directlyDon’t triangulate2. Facilitate clean escalation to encourage feedback3. Use a system of peer recognition to encourage feedback4. Introduce Whoops-a-Daisy & the Killer Whale5. Conduct speak-truth-to-power meetings to encourage feedback 1. Encourage feedback by insisting people talk to one another directly When someone tells you about something great a colleague did, urge them to also share that feedback directly with the colleague who did the great work. This will develop stronger relationships between peers, allow for more praise to be shared (again, you don’t want to be a feedback bottleneck), and provide more perspectives on what’s going well and why. When there are issues, insist that people communicate them directly. Remind them that Radically Candid criticism is kind and clear. It’s kinder for them to tell their colleague about the issue that needs to be fixed than to report that issue to the boss. They’ll also be able to be more clear because they have details and context of the issue you lack. <img src="https://www.radicalcandor.com/wp-content/uploads/2016/09/Feedback_loop_home-1024x576.jpg" height="551" width="980" srcset="https://www.radicalcandor.com/wp-content/uploads/2016/09/Feedback_loop_home-1024x576.jpg 1024w, https://www.radicalcandor.com/wp-content/uploads/2016/09/Feedback_loop_home-300x169.jpg 300w, https://www.radicalcandor.com/wp-content/uploads/2016/09/Feedback_loop_home-768x432.jpg 768w, https://www.radicalcandor.com/wp-content/uploads/2016/09/Feedback_loop_home-1536x864.jpg 1536w, https://www.radicalcandor.com/wp-content/uploads/2016/09/Feedback_loop_home-200x113.jpg 200w, https://www.radicalcandor.com/wp-content/uploads/2016/09/Feedback_loop_home-500x281.jpg 500w, https://www.radicalcandor.com/wp-content/uploads/2016/09/Feedback_loop_home-680x383.jpg 680w, https://www.radicalcandor.com/wp-content/uploads/2016/09/Feedback_loop_home-980x552.jpg 980w, https://www.radicalcandor.com/wp-content/uploads/2016/09/Feedback_loop_home.jpg 1400w" sizes="(max-width: 980px) 100vw, 980px" class="wp-image-13507 size-large aligncenter sp-no-webp" alt="encourage feedback" fetchpriority="high" decoding="async" title="encourage feedback" > Don’t triangulate The flip side of this is that if people come to you criticizing a colleague, don’t give them a chance to bring you into a triangle of complaining, name calling, or backstabbing. Talking with the person on each side of an issue individually may seem like being a good listener, but it usually means you’ll get one-sided, biased and incomplete stories plus hurt feelings. You are not being empathetic, you’re just stirring the pot! You are a boss, not a diplomat. Shuttle diplomacy won’t work for you. When you triangulate, you end up creating politics. Each side becomes suspicious that you’re talking behind their back (which you are). The two begin to distrust each other and a toxic relationship develops. You can avoid this by simply asking them to talk to each other directly. 2. Facilitate clean escalation to encourage feedback Part of your job as the boss is to offer fair, efficient conflict resolution. Sometimes people on your team will run into a conflict they can’t resolve. They may be able to challenge directly, but that doesn’t mean they can resolve the issue without your involvement. In those cases, provide a way for them to escalate the issue to you together. Offer to have a three-way conversation to discuss the issue. Each party will tell their side of the story with the other present, avoiding the one-sidedness and exaggeration that may come up in triangulation. You will act as moderator and facilitator. It’s best to do this in person, but a video or phone call will also work. Avoid conducting these discussions over email — an asynchronous conversation makes it difficult for you to spot and react well to emotions that will inevitably arise. <img decoding="async" class="wp-image-13152 size-large aligncenter" title="encourage feedback" src="https://www.radicalcandor.com/wp-content/uploads/2019/12/Greta_Dale_Taylor-1024x576.jpg" alt="encourage feedback" width="980" height="551" srcset="https://www.radicalcandor.com/wp-content/uploads/2019/12/Greta_Dale_Taylor-1024x576.jpg 1024w, https://www.radicalcandor.com/wp-content/uploads/2019/12/Greta_Dale_Taylor-300x169.jpg 300w, https://www.radicalcandor.com/wp-content/uploads/2019/12/Greta_Dale_Taylor-768x432.jpg 768w, https://www.radicalcandor.com/wp-content/uploads/2019/12/Greta_Dale_Taylor-1536x864.jpg 1536w, https://www.radicalcandor.com/wp-content/uploads/2019/12/Greta_Dale_Taylor-200x113.jpg 200w, https://www.radicalcandor.com/wp-content/uploads/2019/12/Greta_Dale_Taylor.jpg 1400w" sizes="(max-width: 980px) 100vw, 980px" /> Your role in this meeting is to help the two parties come up with a solution they both can understand and live with. Don’t punish them for failing to work it out without your involvement. Your job is to be supportive, not punitive when they can’t work it out. Otherwise, you’ll create a culture with no good path to conflict resolution, and people will therefore avoid conflict at all costs. People will be afraid to criticize each other in case it leads to conflict. That’s the opposite of encouraging a culture of Radical Candor! With a supportive clean escalation meeting, however, you’ll help build trust between the two parties and show them how sharing criticism leads to a better outcome for everyone. 3. Use a system of peer recognition to encourage feedback Many companies have systems in place for peers to recognize and praise each other’s work. Google, for example, has a peer bonus system that allows employees to give monetary bonuses to their peers for work well done. Monetary systems like this can be expensive, and not every company can afford to do this. But there are many other recognition systems that require less investment. At Square, Gokul Rajaram has his team submit kudos about great things they’ve seen each other do each week. They are submitted to a shared document so others can comment. Gokul reads them all each week and selects a couple of kudos to highlight. At Qualtrics, Jared Smith built a system on the intranet that allowed employees to give each other virtual appreciation badges for great work. Badges accumulated on a person’s profile page on the company intranet, and helped to create a culture of praise. If your company uses Slack, you can create a #kudos channel. If you use Google Docs, Office 365, or other software with collaborative editing, you can easily create a shared document for shout-outs. Part of the reason these systems work so well is that they help people overcome a reticence to praise. People worry about their praise feeling patronizing. They wonder if they are really qualified to praise someone else’s work. Having a standardized recognition system emphasizes the worth of praise, both to individuals and to the company. The system helps people be more confident that their praise will be appreciated, and therefore makes them more likely to offer it. Even if your company doesn’t have a system like this, you can come up with a low-tech, low-cost version for your own team to encourage more praise between team members. 4. Introduce Whoops-a-Daisy & the Killer Whale Dan Woods, who was CTO at a startup where I worked in the 1990s, developed the cheapest, most effective system for encouraging praise and criticism on a team that I’ve ever seen. He used a stuffed whale (sometimes a dog) to encourage praise and a stuffed animal, I use a daisy (or Daisy Duck), to encourage public self-criticism. I admired his system so much I stole it, and it was probably my single most effective management tool at Google. <img src="https://www.radicalcandor.com/wp-content/uploads/2016/09/killer-whale.jpg" height="225" width="290" class="aligncenter wp-image-9004 size-full sp-no-webp" alt="encourage feedback" decoding="async" title="encourage feedback" > Here’s how it worked: At every all-hands meeting, I invited people to nominate each other to win the killer whale for a week. The idea was to get people from the team to stand up and talk about some extraordinary work they’d seen somebody else do. The winner of the whale the previous week decided who deserved the whale this week. <img decoding="async" class="aligncenter wp-image-12660" title="encourage feedback" src="https://www.radicalcandor.com/wp-content/uploads/2017/01/daisy-duck.png" alt="encourage feedback" width="319" height="448" srcset="https://www.radicalcandor.com/wp-content/uploads/2017/01/daisy-duck.png 722w, https://www.radicalcandor.com/wp-content/uploads/2017/01/daisy-duck-214x300.png 214w, https://www.radicalcandor.com/wp-content/uploads/2017/01/daisy-duck-142x200.png 142w" sizes="(max-width: 319px) 100vw, 319px" /> Next, people nominated themselves for the stuffed daisy, which we named “Whoops.” If anyone screwed up that week, they could stand up, tell the story, get automatic forgiveness, and help prevent somebody else from making the same mistake. When we first started doing this at Google, there were crickets. Not knowing what else to do, I put $20 on Whoops’s head. The stories started pouring out. Plausible deniability goes a long way — now people could pretend they weren’t copping to my corny stuffed animal, they really wanted that $20! The stories that the Killer Whale and Whoops elicited were my favorite part of most all-hands meetings. We all learned a lot in that 15 minutes, and everyone received a strong message that feedback was encouraged. 5. Conduct speak-truth-to-power meetings to encourage feedback One of the most helpful suggestions I ever got as a manager came from Roxana Wales, who worked at NASA and then in Learning and Development at Google. She told me that one of the most important things any “manager of managers” could do to foster a culture of feedback was to have so-called “skip-level meetings.” This sounds unbearably big company hierarchical but bear with me. The best way to put hierarchy in its place is to admit when it exists and think of ways to make sure everyone feels they are on an equal footing at a human level despite the structure. You have to find ways to help people speak truth to power. Skip-level meetings, or speak-truth-to-power meetings as I prefer to call them, are conversations you have with teams without their manager in the room to get feedback on how that manager is doing. I know, I know, this is the opposite of clean escalation. It also has the potential to turn into a gripe session or to disempower the manager. So these meetings must be conducted extremely carefully. Given these risks, why have these conversations at all? The reason is that when there is a power imbalance, requiring clean escalation is sometimes not realistic. What percentage of people actually tell their boss what they really think? Certainly not the majority. Plus, managers, especially new managers, will consciously or unconsciously seek to repress criticism rather than to encourage it. Speak-truth-to-power meetings are a great way to encourage the flow of feedback despite these potential barriers. I share detailed tips for effective speak-truth-to-power meetings here. You can also read this quick start guide. Creating an environment where everyone is encouraged to give one another feedback that’s kind. clear, specific and sincere will help you build a culture of trust, creating a workplace people actually like being part of. ————————————————————————————————————————————————————————————– *This post was updated Sept. 21, 2022 Download our free learning guides to start putting Radical Candor into practice. Sign up for our Radical Candor email newsletter >> Shop the Radial Candor store >> Get Radical Candor coaching and consulting for your team >> Get Radical Candor coaching and consulting for your company >> Need help practicing Radical Candor? Then you need The Feedback Loop (think Groundhog Day meets The Office), a 5-episode workplace comedy series starring David Alan Grier that brings to life Radical Candor’s simple framework for navigating candid conversations. You’ll get an hour of hilarious content about a team whose feedback fails are costing them business; improv-inspired exercises to teach everyone the skills they need to work better together, and after-episode action plans you can put into practice immediately to up your helpful feedback EQ. We’re offering Radical Candor readers 10% off the self-paced e-course. Follow this link and enter the promo code FEEDBACK at checkout. articlecommunicationculture Rel