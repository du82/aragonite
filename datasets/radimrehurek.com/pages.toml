["http://radimrehurek.com/gensim/models/doc2vec.html"]
title = "models.doc2vec – Doc2vec paragraph embeddings — gensim"
description = "Efficient topic modelling in Python"
full_description = '''models.doc2vec – Doc2vec paragraph embeddings¶ Introduction¶ Learn paragraph and document embeddings via the distributed memory and distributed bag of words models from Quoc Le and Tomas Mikolov: “Distributed Representations of Sentences and Documents”. The algorithms use either hierarchical softmax or negative sampling; see Tomas Mikolov, Kai Chen, Greg Corrado, and Jeffrey Dean: “Efficient Estimation of Word Representations in Vector Space, in Proceedings of Workshop at ICLR, 2013” and Tomas Mikolov, Ilya Sutskever, Kai Chen, Greg Corrado, and Jeffrey Dean: “Distributed Representations of Words and Phrases and their Compositionality. In Proceedings of NIPS, 2013”. For a usage example, see the Doc2vec tutorial. Make sure you have a C compiler before installing Gensim, to use the optimized doc2vec routines (70x speedup compared to plain NumPy implementation, https://rare-technologies.com/parallelizing-word2vec-in-python/). Usage examples¶ Initialize & train a model: >>> from gensim.test.utils import common_texts >>> from gensim.models.doc2vec import Doc2Vec, TaggedDocument >>> >>> documents = [TaggedDocument(doc, [i]) for i, doc in enumerate(common_texts)] >>> model = Doc2Vec(documents, vector_size=5, window=2, min_count=1, workers=4) Persist a model to disk: >>> from gensim.test.utils import get_tmpfile >>> >>> fname = get_tmpfile("my_doc2vec_model") >>> >>> model.save(fname) >>> model = Doc2Vec.load(fname) # you can continue training with the loaded model! Infer vector for a new document: >>> vector = model.infer_vector(["system", "response"]) class gensim.models.doc2vec.Doc2Vec(documents=None, corpus_file=None, vector_size=100, dm_mean=None, dm=1, dbow_words=0, dm_concat=0, dm_tag_count=1, dv=None, dv_mapfile=None, comment=None, trim_rule=None, callbacks=(), window=5, epochs=10, shrink_windows=True, **kwargs)¶ Bases: Word2Vec Class for training, using and evaluating neural networks described in Distributed Representations of Sentences and Documents. Parameters documents (iterable of list of TaggedDocument, optional) – Input corpus, can be simply a list of elements, but for larger corpora,consider an iterable that streams the documents directly from disk/network. If you don’t supply documents (or corpus_file), the model is left uninitialized – use if you plan to initialize it in some other way. corpus_file (str, optional) – Path to a corpus file in LineSentence format. You may use this argument instead of documents to get performance boost. Only one of documents or corpus_file arguments need to be passed (or none of them, in that case, the model is left uninitialized). Documents’ tags are assigned automatically and are equal to line number, as in TaggedLineDocument. dm ({1,0}, optional) – Defines the training algorithm. If dm=1, ‘distributed memory’ (PV-DM) is used. Otherwise, distributed bag of words (PV-DBOW) is employed. vector_size (int, optional) – Dimensionality of the feature vectors. window (int, optional) – The maximum distance between the current and predicted word within a sentence. alpha (float, optional) – The initial learning rate. min_alpha (float, optional) – Learning rate will linearly drop to min_alpha as training progresses. seed (int, optional) – Seed for the random number generator. Initial vectors for each word are seeded with a hash of the concatenation of word + str(seed). Note that for a fully deterministically-reproducible run, you must also limit the model to a single worker thread (workers=1), to eliminate ordering jitter from OS thread scheduling. In Python 3, reproducibility between interpreter launches also requires use of the PYTHONHASHSEED environment variable to control hash randomization. min_count (int, optional) – Ignores all words with total frequency lower than this. max_vocab_size (int, optional) – Limits the RAM during vocabulary building; if there are more unique words than this, then prune the infrequent ones. Every 10 million word types need about 1GB of RAM. Set to None for no limit. sample (float, optional) – The threshold for configuring which higher-frequency words are randomly downsampled, useful range is (0, 1e-5). workers (int, optional) – Use these many worker threads to train the model (=faster training with multicore machines). epochs (int, optional) – Number of iterations (epochs) over the corpus. Defaults to 10 for Doc2Vec. hs ({1,0}, optional) – If 1, hierarchical softmax will be used for model training. If set to 0, and negative is non-zero, negative sampling will be used. negative (int, optional) – If > 0, negative sampling will be used, the int for negative specifies how many “noise words” should be drawn (usually between 5-20). If set to 0, no negative sampling is used. ns_exponent (float, optional) – The exponent used to shape the negative sampling distribution. A value of 1.0 samples exactly in proportion to the frequencies, 0.0 samples all words equally, while a negative value samples low-frequency words more than high-frequency words. The popular default value of 0.75 was chosen by the original Word2Vec paper. More recently, in https://arxiv.org/abs/1804.04212, Caselles-Dupré, Lesaint, & Royo-Letelier suggest that other values may perform better for recommendation applications. dm_mean ({1,0}, optional) – If 0, use the sum of the context word vectors. If 1, use the mean. Only applies when dm is used in non-concatenative mode. dm_concat ({1,0}, optional) – If 1, use concatenation of context vectors rather than sum/average; Note concatenation results in a much-larger model, as the input is no longer the size of one (sampled or arithmetically combined) word vector, but the size of the tag(s) and all words in the context strung together. dm_tag_count (int, optional) – Expected constant number of document tags per document, when using dm_concat mode. dbow_words ({1,0}, optional) – If set to 1 trains word-vectors (in skip-gram fashion) simultaneous with DBOW doc-vector training; If 0, only trains doc-vectors (faster). trim_rule (function, optional) – Vocabulary trimming rule, specifies whether certain words should remain in the vocabulary, be trimmed away, or handled using the default (discard if word count < min_count). Can be None (min_count will be used, look to keep_vocab_item()), or a callable that accepts parameters (word, count, min_count) and returns either gensim.utils.RULE_DISCARD, gensim.utils.RULE_KEEP or gensim.utils.RULE_DEFAULT. The rule, if given, is only used to prune vocabulary during current method call and is not stored as part of the model. The input parameters are of the following types: word (str) - the word we are examining count (int) - the word’s frequency count in the corpus min_count (int) - the minimum count threshold. callbacks – List of callbacks that need to be executed/run at specific stages during training. shrink_windows (bool, optional) – New in 4.1. Experimental. If True, the effective window size is uniformly sampled from [1, window] for each target word during training, to match the original word2vec algorithm’s approximate weighting of context words by distance. Otherwise, the effective window size is always fixed to window words to either side. following (Some important internal attributes are the) – wv¶ This object essentially contains the mapping between words and embeddings. After training, it can be used directly to query those embeddings in various ways. See the module level docstring for examples. Type KeyedVectors dv¶ This object contains the paragraph vectors learned from the training data. There will be one such vector for each unique document tag supplied during training. They may be individually accessed using the tag as an indexed-access key. For example, if one of the training documents used a tag of ‘doc003’: >>> model.dv['doc003'] Type KeyedVectors __getitem__(tag)¶ Get the vector representation of (possibly multi-term) tag. Parameters tag ({str, int, list of str, list of int}) – The tag (or tags) to be looked up in the model. Returns The vector representations of each tag as a matrix (will be 1D if tag was a single tag) Return type np.ndarray add_lifecycle_event(event_name, log_level=20, **event)¶ Append an event into the lifecycle_events attribute of this object, and also optionally log the event at log_level. Events are important moments during the object’s life, such as “model created”, “model saved”, “model loaded”, etc. The lifecycle_events attribute is persisted across object’s save() and load() operations. It has no impact on the use of the model, but is useful during debugging and support. Set self.lifecycle_events = None to disable this behaviour. Calls to add_lifecycle_event() will not record events into self.lifecycle_events then. Parameters event_name (str) – Name of the event. Can be any label, e.g. “created”, “stored” etc. event (dict) – Key-value mapping to append to self.lifecycle_events. Should be JSON-serializable, so keep it simple. Can be empty. This method will automatically add the following key-values to event, so you don’t have to specify them: datetime: the current date & time gensim: the current Gensim version python: the current Python version platform: the current platform event: the name of this event log_level (int) – Also log the complete event dict, at the specified log level. Set to False to not log at all. add_null_word()¶ build_vocab(corpus_iterable=None, corpus_file=None, update=False, progress_per=10000, keep_raw_vocab=False, trim_rule=None, **kwargs)¶ Build vocabulary from a sequence of documents (can be a once-only generator stream). Parameters documents (iterable of list of TaggedDocument, optional) – Can be simply a list of TaggedDocument elements, but for larger corpora, consider an iterable that streams the documents directly from disk/network. See TaggedBrownCorpus or TaggedLineDocument corpus_file (str, optional) – Path to a corpus file in LineSentence format. You may use this argument instead of documents to get performance boost. Only one of documents or corpus_file arguments need to be passed (not both of them). Documents’ tags are assigned automatically and are equal to a line number, as in TaggedLineDocument. update (bool) – If true, the new words in documents will be added to model’s vocab. progress_per (int) – Indicates how many words to process before showing/updating the progress. keep_raw_vocab (bool) – If not true, delete the raw vocabulary after the scaling is done and free up RAM. trim_rule (function, optional) – Vocabulary trimming rule, specifies whether certain words should remain in the vocabulary, be trimmed away, or handled using the default (discard if word count < min_count). Can be None (min_count will be used, look to keep_vocab_item()), or a callable that accepts parameters (word, count, min_count) and returns either gensim.utils.RULE_DISCARD, gensim.utils.RULE_KEEP or gensim.utils.RULE_DEFAULT. The rule, if given, is only used to prune vocabulary during current method call and is not stored as part of the model. The input parameters are of the following types: word (str) - the word we are examining count (int) - the word’s frequency count in the corpus min_count (int) - the minimum count threshold. **kwargs – Additional key word arguments passed to the internal vocabulary construction. build_vocab_from_freq(word_freq, keep_raw_vocab=False, corpus_count=None, trim_rule=None, update=False)¶ Build vocabulary from a dictionary of word frequencies. Build model vocabulary from a passed dictionary that contains a (word -> word count) mapping. Words must be of type unicode strings. Parameters word_freq (dict of (str, int)) – Word <-> count mapping. keep_raw_vocab (bool, optional) – If not true, delete the raw vocabulary after the scaling is done and free up RAM. corpus_count (int, optional) – Even if no corpus is provided, this argument can set corpus_count explicitly. trim_rule (function, optional) – Vocabulary trimming rule, specifies whether certain words should remain in the vocabulary, be trimmed away, or handled using the default (discard if word count < min_count). Can be None (min_count will be used, look to keep_vocab_item()), or a callable that accepts parameters (word, count, min_count) and returns either gensim.utils.RULE_DISCARD, gensim.utils.RULE_KEEP or gensim.utils.RULE_DEFAULT. The rule, if given, is only used to prune vocabulary during build_vocab() and is not stored as part of the model. The input parameters are of the following types: word (str) - the word we are examining count (int) - the word’s frequency count in the corpus min_count (int) - the minimum count threshold. update (bool, optional) – If true, the new provided words in word_freq dict will be added to model’s vocab. create_binary_tree()¶ Create a binary Huffman tree using stored vocabulary word counts. Frequent words will have shorter binary codes. Called internally from build_vocab(). property dbow¶ Indicates whether ‘distributed bag of words’ (PV-DBOW) will be used, else ‘distributed memory’ (PV-DM) is used. property dm¶ Indicates whether ‘distributed memory’ (PV-DM) will be used, else ‘distributed bag of words’ (PV-DBOW) is used. property docvecs¶ estimate_memory(vocab_size=None, report=None)¶ Estimate required memory for a model using current settings. Parameters vocab_size (int, optional) – Number of raw words in the vocabulary. report (dict of (str, int), optional) – A dictionary from string representations of the specific model’s memory consuming members to their size in bytes. Returns A dictionary from string representations of the model’s memory consuming members to their size in bytes. Includes members from the base classes as well as weights and tag lookup memory estimation specific to the class. Return type dict of (str, int), optional estimated_lookup_memory()¶ Get estimated memory for tag lookup, 0 if using pure int tags. Returns The estimated RAM required to look up a tag in bytes. Return type int get_latest_training_loss()¶ Get current value of the training loss. Returns Current training loss. Return type float infer_vector(doc_words, alpha=None, min_alpha=None, epochs=None)¶ Infer a vector for given post-bulk training document. Notes Subsequent calls to this function may infer different representations for the same document. For a more stable representation, increase the number of epochs to assert a stricter convergence. Parameters doc_words (list of str) – A document for which the vector representation will be inferred. alpha (float, optional) – The initial learning rate. If unspecified, value from model initialization will be reused. min_alpha (float, optional) – Learning rate will linearly drop to min_alpha over all inference epochs. If unspecified, value from model initialization will be reused. epochs (int, optional) – Number of times to train the new document. Larger values take more time, but may improve quality and run-to-run stability of inferred vectors. If unspecified, the epochs value from model initialization will be reuse'''
