full_description = '''models.word2vec – Word2vec embeddings¶ Introduction¶ This module implements the word2vec family of algorithms, using highly optimized C routines, data streaming and Pythonic interfaces. The word2vec algorithms include skip-gram and CBOW models, using either hierarchical softmax or negative sampling: Tomas Mikolov et al: Efficient Estimation of Word Representations in Vector Space, Tomas Mikolov et al: Distributed Representations of Words and Phrases and their Compositionality. Other embeddings¶ There are more ways to train word vectors in Gensim than just Word2Vec. See also Doc2Vec, FastText. The training algorithms were originally ported from the C package https://code.google.com/p/word2vec/ and extended with additional functionality and optimizations over the years. For a tutorial on Gensim word2vec, with an interactive web app trained on GoogleNews, visit https://rare-technologies.com/word2vec-tutorial/. Usage examples¶ Initialize a model with e.g.: >>> from gensim.test.utils import common_texts >>> from gensim.models import Word2Vec >>> >>> model = Word2Vec(sentences=common_texts, vector_size=100, window=5, min_count=1, workers=4) >>> model.save("word2vec.model") The training is streamed, so ``sentences`` can be an iterable, reading input data from the disk or network on-the-fly, without loading your entire corpus into RAM. Note the sentences iterable must be restartable (not just a generator), to allow the algorithm to stream over your dataset multiple times. For some examples of streamed iterables, see BrownCorpus, Text8Corpus or LineSentence. If you save the model you can continue training it later: >>> model = Word2Vec.load("word2vec.model") >>> model.train([["hello", "world"]], total_examples=1, epochs=1) (0, 2) The trained word vectors are stored in a KeyedVectors instance, as model.wv: >>> vector = model.wv['computer'] # get numpy vector of a word >>> sims = model.wv.most_similar('computer', topn=10) # get other similar words The reason for separating the trained vectors into KeyedVectors is that if you don’t need the full model state any more (don’t need to continue training), its state can be discarded, keeping just the vectors and their keys proper. This results in a much smaller and faster object that can be mmapped for lightning fast loading and sharing the vectors in RAM between processes: >>> from gensim.models import KeyedVectors >>> >>> # Store just the words + their trained embeddings. >>> word_vectors = model.wv >>> word_vectors.save("word2vec.wordvectors") >>> >>> # Load back with memory-mapping = read-only, shared across processes. >>> wv = KeyedVectors.load("word2vec.wordvectors", mmap='r') >>> >>> vector = wv['computer'] # Get numpy vector of a word Gensim can also load word vectors in the “word2vec C format”, as a KeyedVectors instance: >>> from gensim.test.utils import datapath >>> >>> # Load a word2vec model stored in the C *text* format. >>> wv_from_text = KeyedVectors.load_word2vec_format(datapath('word2vec_pre_kv_c'), binary=False) >>> # Load a word2vec model stored in the C *binary* format. >>> wv_from_bin = KeyedVectors.load_word2vec_format(datapath("euclidean_vectors.bin"), binary=True) It is impossible to continue training the vectors loaded from the C format because the hidden weights, vocabulary frequencies and the binary tree are missing. To continue training, you’ll need the full Word2Vec object state, as stored by save(), not just the KeyedVectors. You can perform various NLP tasks with a trained model. Some of the operations are already built-in - see gensim.models.keyedvectors. If you’re finished training a model (i.e. no more updates, only querying), you can switch to the KeyedVectors instance: >>> word_vectors = model.wv >>> del model to trim unneeded model state = use much less RAM and allow fast loading and memory sharing (mmap). Embeddings with multiword ngrams¶ There is a gensim.models.phrases module which lets you automatically detect phrases longer than one word, using collocation statistics. Using phrases, you can learn a word2vec model where “words” are actually multiword expressions, such as new_york_times or financial_crisis: >>> from gensim.models import Phrases >>> >>> # Train a bigram detector. >>> bigram_transformer = Phrases(common_texts) >>> >>> # Apply the trained MWE detector to a corpus, using the result to train a Word2vec model. >>> model = Word2Vec(bigram_transformer[common_texts], min_count=1) Pretrained models¶ Gensim comes with several already pre-trained models, in the Gensim-data repository: >>> import gensim.downloader >>> # Show all available models in gensim-data >>> print(list(gensim.downloader.info()['models'].keys())) ['fasttext-wiki-news-subwords-300', 'conceptnet-numberbatch-17-06-300', 'word2vec-ruscorpora-300', 'word2vec-google-news-300', 'glove-wiki-gigaword-50', 'glove-wiki-gigaword-100', 'glove-wiki-gigaword-200', 'glove-wiki-gigaword-300', 'glove-twitter-25', 'glove-twitter-50', 'glove-twitter-100', 'glove-twitter-200', '__testing_word2vec-matrix-synopsis'] >>> >>> # Download the "glove-twitter-25" embeddings >>> glove_vectors = gensim.downloader.load('glove-twitter-25') >>> >>> # Use the downloaded vectors as usual: >>> glove_vectors.most_similar('twitter') [('facebook', 0.948005199432373), ('tweet', 0.9403423070907593), ('fb', 0.9342358708381653), ('instagram', 0.9104824066162109), ('chat', 0.8964964747428894), ('hashtag', 0.8885937333106995), ('tweets', 0.8878158330917358), ('tl', 0.8778461217880249), ('link', 0.8778210878372192), ('internet', 0.8753897547721863)] class gensim.models.word2vec.BrownCorpus(dirname)¶ Bases: object Iterate over sentences from the Brown corpus (part of NLTK data). class gensim.models.word2vec.Heapitem(count, index, left, right)¶ Bases: Heapitem Create new instance of Heapitem(count, index, left, right) count¶ Alias for field number 0 index¶ Alias for field number 1 left¶ Alias for field number 2 right¶ Alias for field number 3 class gensim.models.word2vec.LineSentence(source, max_sentence_length=10000, limit=None)¶ Bases: object Iterate over a file that contains sentences: one line = one sentence. Words must be already preprocessed and separated by whitespace. Parameters source (string or a file-like object) – Path to the file on disk, or an already-open file object (must support seek(0)). limit (int or None) – Clip the file to the first limit lines. Do no clipping if limit is None (the default). Examples >>> from gensim.test.utils import datapath >>> sentences = LineSentence(datapath('lee_background.cor')) >>> for sentence in sentences: ... pass class gensim.models.word2vec.PathLineSentences(source, max_sentence_length=10000, limit=None)¶ Bases: object Like LineSentence, but process all files in a directory in alphabetical order by filename. The directory must only contain files that can be read by gensim.models.word2vec.LineSentence: .bz2, .gz, and text files. Any file not ending with .bz2 or .gz is assumed to be a text file. The format of files (either text, or compressed text files) in the path is one sentence = one line, with words already preprocessed and separated by whitespace. Warning Does not recurse into subdirectories. Parameters source (str) – Path to the directory. limit (int or None) – Read only the first limit lines from each file. Read all if limit is None (the default). class gensim.models.word2vec.Text8Corpus(fname, max_sentence_length=10000)¶ Bases: object Iterate over sentences from the “text8” corpus, unzipped from https://mattmahoney.net/dc/text8.zip. class gensim.models.word2vec.Word2Vec(sentences=None, corpus_file=None, vector_size=100, alpha=0.025, window=5, min_count=5, max_vocab_size=None, sample=0.001, seed=1, workers=3, min_alpha=0.0001, sg=0, hs=0, negative=5, ns_exponent=0.75, cbow_mean=1, hashfxn=<built-in function hash>, epochs=5, null_word=0, trim_rule=None, sorted_vocab=1, batch_words=10000, compute_loss=False, callbacks=(), comment=None, max_final_vocab=None, shrink_windows=True)¶ Bases: SaveLoad Train, use and evaluate neural networks described in https://code.google.com/p/word2vec/. Once you’re finished training a model (=no more updates, only querying) store and use only the KeyedVectors instance in self.wv to reduce memory. The full model can be stored/loaded via its save() and load() methods. The trained word vectors can also be stored/loaded from a format compatible with the original word2vec implementation via self.wv.save_word2vec_format and gensim.models.keyedvectors.KeyedVectors.load_word2vec_format(). Parameters sentences (iterable of iterables, optional) – The sentences iterable can be simply a list of lists of tokens, but for larger corpora, consider an iterable that streams the sentences directly from disk/network. See BrownCorpus, Text8Corpus or LineSentence in word2vec module for such examples. See also the tutorial on data streaming in Python. If you don’t supply sentences, the model is left uninitialized – use if you plan to initialize it in some other way. corpus_file (str, optional) – Path to a corpus file in LineSentence format. You may use this argument instead of sentences to get performance boost. Only one of sentences or corpus_file arguments need to be passed (or none of them, in that case, the model is left uninitialized). vector_size (int, optional) – Dimensionality of the word vectors. window (int, optional) – Maximum distance between the current and predicted word within a sentence. min_count (int, optional) – Ignores all words with total frequency lower than this. workers (int, optional) – Use these many worker threads to train the model (=faster training with multicore machines). sg ({0, 1}, optional) – Training algorithm: 1 for skip-gram; otherwise CBOW. hs ({0, 1}, optional) – If 1, hierarchical softmax will be used for model training. If 0, hierarchical softmax will not be used for model training. negative (int, optional) – If > 0, negative sampling will be used, the int for negative specifies how many “noise words” should be drawn (usually between 5-20). If 0, negative sampling will not be used. ns_exponent (float, optional) – The exponent used to shape the negative sampling distribution. A value of 1.0 samples exactly in proportion to the frequencies, 0.0 samples all words equally, while a negative value samples low-frequency words more than high-frequency words. The popular default value of 0.75 was chosen by the original Word2Vec paper. More recently, in https://arxiv.org/abs/1804.04212, Caselles-Dupré, Lesaint, & Royo-Letelier suggest that other values may perform better for recommendation applications. cbow_mean ({0, 1}, optional) – If 0, use the sum of the context word vectors. If 1, use the mean, only applies when cbow is used. alpha (float, optional) – The initial learning rate. min_alpha (float, optional) – Learning rate will linearly drop to min_alpha as training progresses. seed (int, optional) – Seed for the random number generator. Initial vectors for each word are seeded with a hash of the concatenation of word + str(seed). Note that for a fully deterministically-reproducible run, you must also limit the model to a single worker thread (workers=1), to eliminate ordering jitter from OS thread scheduling. (In Python 3, reproducibility between interpreter launches also requires use of the PYTHONHASHSEED environment variable to control hash randomization). max_vocab_size (int, optional) – Limits the RAM during vocabulary building; if there are more unique words than this, then prune the infrequent ones. Every 10 million word types need about 1GB of RAM. Set to None for no limit. max_final_vocab (int, optional) – Limits the vocab to a target vocab size by automatically picking a matching min_count. If the specified min_count is more than the calculated min_count, the specified min_count will be used. Set to None if not required. sample (float, optional) – The threshold for configuring which higher-frequency words are randomly downsampled, useful range is (0, 1e-5). hashfxn (function, optional) – Hash function to use to randomly initialize weights, for increased training reproducibility. epochs (int, optional) – Number of iterations (epochs) over the corpus. (Formerly: iter) trim_rule (function, optional) – Vocabulary trimming rule, specifies whether certain words should remain in the vocabulary, be trimmed away, or handled using the default (discard if word count < min_count). Can be None (min_count will be used, look to keep_vocab_item()), or a callable that accepts parameters (word, count, min_count) and returns either gensim.utils.RULE_DISCARD, gensim.utils.RULE_KEEP or gensim.utils.RULE_DEFAULT. The rule, if given, is only used to prune vocabulary during build_vocab() and is not stored as part of the model. The input parameters are of the following types: word (str) - the word we are examining count (int) - the word’s frequency count in the corpus min_count (int) - the minimum count threshold. sorted_vocab ({0, 1}, optional) – If 1, sort the vocabulary by descending frequency before assigning word indexes. See sort_by_descending_frequency(). batch_words (int, optional) – Target size (in words) for batches of examples passed to worker threads (and thus cython routines).(Larger batches will be passed if individual texts are longer than 10000 words, but the standard cython code truncates to that maximum.) compute_loss (bool, optional) – If True, computes and stores loss value which can be retrieved using get_latest_training_loss(). callbacks (iterable of CallbackAny2Vec, optional) – Sequence of callbacks to be executed at specific stages during training. shrink_windows (bool, optional) – New in 4.1. Experimental. If True, the effective window size is uniformly sampled from [1, window] for each target word during training, to match the original word2vec algorithm’s approximate weighting of context words by distance. Otherwise, the effective window size is always fixed to window words to either side. Examples Initialize and train a Word2Vec model >>> from gensim.models import Word2Vec >>> sentences = [["cat", "say", "meow"], ["dog", "say", "woof"]] >>> model = Word2Vec(sentences, min_count=1) wv¶ This object essentially contains the mapping between words and embeddings. After training, it can be used directly to query those embeddings in various ways. See the module level docstring for examples. Type KeyedVectors add_lifecycle_event(event_name, log_level=20, **event)¶ Append an event into the lifecycle_events attribute of this object, and also optionally log the event at log_level. Events are important moments during the object’s life, such as “model created”, “model saved”, “model loaded”, etc. The lifecycle_events attribute is persisted across object’s save() and load() operations. It has no impact on the use of the model, but is useful during debugging and support. Set self.lifecycle_events = None to disable this behaviour. Calls to add_lifecycle_event() will not record events into self.lifecycle_events then. Par'''
