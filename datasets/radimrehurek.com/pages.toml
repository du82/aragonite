title = "Radim Řehůřek : Articles"
full_description = "Christmas in Vietnam: Mui Ne and Saigon posted on February 15, 2016 by Radim | 8 Comments For our vacation this year, we picked Vietnam: Christmas in the touristy region of Mui Ne, then New Year in Saigon (aka Ho Chi Minh City). This post is a short travel log with pictures, highlights, travel costs and tips from our stay there. My hope is this may help someone planning a similar trip. Read more on Christmas in Vietnam: Mui Ne and Saigon… Making sense of word2vec posted on December 23, 2014 by Radim | 21 Comments One year ago, Tomáš Mikolov (together with his colleagues at Google) made some ripples by releasing word2vec, an unsupervised algorithm for learning the meaning behind words. In this blog post, I’ll evaluate some extensions that have appeared over the year. Read more on Making sense of word2vec… Doc2vec tutorial posted on December 15, 2014 by Radim | 36 Comments The latest gensim release of 0.10.3 has a new class named Doc2Vec. All credit for this class, which is an implementation of Quoc Le & Tomáš Mikolov: “Distributed Representations of Sentences and Documents”, as well as for this tutorial, goes to the illustrious Tim Emerick. Doc2vec (aka paragraph2vec, aka sentence embeddings) modifies the word2vec algorithm to unsupervised learning of continuous representations for larger blocks of text, such as sentences, paragraphs or entire documents. Read more on Doc2vec tutorial… Multicore LDA in Python: from over-night to over-lunch posted on September 21, 2014 by Radim | 4 Comments Latent Dirichlet Allocation (LDA), one of the most used modules in gensim, has received a major performance revamp recently. Using all your machine cores at once now, chances are the new LdaMulticore class is limited by the speed you can feed it input data. Make sure your CPU fans are in working order! Read more on Multicore LDA in Python: from over-night to over-lunch… Gran Canaria in winter posted on April 4, 2014 by Radim | 7 Comments Now that I have a blog, I figured I could start posting more info about our travels. So here’s a little digest from one of our recent trips. I’m hoping it will be useful to other tourists looking to visit Gran Canaria, especially in the same season we went (February). Read more on Gran Canaria in winter…"
