["https://radix-ui.com/primitives/case-studies/supabase"]
title = "Supabase – Case studies – Radix Primitives"
description = "With Radix Primitives, Supabase has vastly improved accessibility across their design system components."
full_description = "We have a design system called Supabase UI which is comprised of ‘atom’ level components that can be used together to create repeatable UI patterns that you see in lots of modern web applications. Supabase UI is used across all of our Next.js applications, and it has become a useful tool to keep things consistent across all our mediums. Currently, we only have a few developers contributing internally to our UI library⁠—plus a few open source contributions⁠—but we will probably see more developers working on it simultaneously soon. Radix Primitives have quickly become the foundation of many of our components. The biggest advantage we see here is vastly improved accessibility across anything we’ve used it for. The opposing strategy to this is to build components from scratch; anyone who has done this will know all too well the smaller accessibility details such as hitting Esc to close a dialog box, or the confusion between, let’s say, a Dialog and an Alert Dialog. All of these concepts are handled by Radix primitives, so we are essentially just left with the more pressing job of styling and composing the components in the way that we like. It’s been great introducing components one at a time into our UI library. Obviously we couldn’t just replace everything all at once, but Radix has made it easy by having a separate NPM package for each primitive. Anyone looking to build a UI system could even pick and choose what they wanted to use, and maybe even use their own custom components alongside Radix Primitives. There is also room to compose components however you want. Some of our components in Supabase UI are more reminiscent of how Ant Design works, but with Radix Primitives, it has been simple to expose the parts we needed in our own UI library, so you'll never be stuck with just a default setting. The docs are amazing, we especially love the examples! It’s worth noting that you can style the primitives using whatever styling library you like. You’re never stuck with being forced one way or another."
year_published = 2025
