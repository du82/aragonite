["https://radix-ui.com/primitives/docs/guides/styling"]
title = "Styling – Radix Primitives"
description = "Radix Primitives are unstyled—and compatible with any styling solution—giving you complete control over styling."
full_description = '''Radix Primitives are unstyled—and compatible with any styling solution—giving you complete control over styling. You are in control of all aspects of styling, including functional styles. For example—by default—a Dialog Overlay won't cover the entire viewport. You're responsible for adding those styles, plus any presentation styles. All components and their parts accept a className prop. This class will be passed through to the DOM element. You can use it in CSS as expected. When components are stateful, their state will be exposed in a data-state attribute. For example, when an Accordion Item is opened, it includes a data-state="open" attribute. The examples below are using styled-components, but you can use any CSS-in-JS library of your choice. Most CSS-in-JS libraries export a function for passing components and their styles. You can provide the Radix primitive component directly. Radix Primitives were designed to encapsulate accessibility concerns and other complex functionalities, while ensuring you retain complete control over styling.'''
year_published = 2025
clearnet = "https://radix-ui.com/primitives/docs/guides/styling"
