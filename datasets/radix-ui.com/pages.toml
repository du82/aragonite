["https://radix-ui.com/primitives/docs/components/popover"]
title = "Popover – Radix Primitives"
description = "Displays rich content in a portal, triggered by a button."
full_description = "The button that toggles the popover. By default, the Popover.Content will position itself against the trigger. An optional element to position the Popover.Content against. If this part is not used, the content will position alongside the Popover.Trigger. An optional arrow element to render alongside the popover. This can be used to help visually link the anchor with the Popover.Content. Must be rendered inside Popover.Content. You may want to constrain the width of the content so that it matches the trigger width. You may also want to constrain its height to not exceed the viewport. We expose several CSS custom properties such as --radix-popover-trigger-width and --radix-popover-content-available-height to support this. Use them to constrain the content dimensions. We expose a CSS custom property --radix-popover-content-transform-origin. Use it to animate the content from its computed origin based on side, sideOffset, align, alignOffset and any collisions. We expose data-side and data-align attributes. Their values will change at runtime to reflect collisions. Use them to create collision and direction-aware animations."
