["https://radix-ui.com/primitives/docs/components/select"]
title = "Select – Radix Primitives"
description = "Displays a list of options for the user to pick from—triggered by a button."
full_description = '''The button that toggles the select. The Select.Content will position itself by aligning over the trigger. The part that reflects the selected value. By default the selected item's text will be rendered. if you require more control, you can instead control the select and pass your own children. It should not be styled to ensure correct positioning. An optional placeholder prop is also available for when the select has no value. A small icon often displayed next to the value as a visual affordance for the fact it can be open. By default renders ▼ but you can use your own icon via asChild or use children. The textual part of the item. It should only contain the text you want to see in the trigger when that item is selected. It should not be styled to ensure correct positioning. Renders when the item is selected. You can style this element directly, or you can use it as a wrapper to put an icon into, or both. An optional button used as an affordance to show the viewport overflow as well as functionaly enable scrolling upwards. An optional button used as an affordance to show the viewport overflow as well as functionaly enable scrolling downwards. Used to group multiple items. use in conjunction with Select.Label to ensure good accessibility via automatic labelling. An optional arrow element to render alongside the content. This can be used to help visually link the trigger with the Select.Content. Must be rendered inside Select.Content. Only available when position is set to popper. By default, Select will behave similarly to a native MacOS menu by positioning Select.Content relative to the active item. If you would prefer an alternative positioning approach similar to Popover or DropdownMenu then you can set position to popper and make use of additional alignment options such as side, sideOffset and more. When using position="popper" on Select.Content, you may want to constrain the width of the content so that it matches the trigger width. You may also want to constrain its height to not exceed the viewport.'''
