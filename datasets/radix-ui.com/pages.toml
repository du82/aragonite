["https://radix-ui.com/colors/docs/overview/aliasing"]
title = "Aliasing – Radix Colors"
description = "How to use Radix Colors."
full_description = '''Referencing color scales by their actual scale name can work well, like blue and red. But often, creating semantic aliases like accent, primary, neutral, or brand can be helpful, especially when it comes to theming. With this approach, you will likely run into issues where you need to use the same scale for multiple semantics. Common examples include: Or you can simply recommend that your teammates defer to the original scale name for situations where there is no appropriate semantic alias. Each step in Radix Colors scales is designed for a specific use case. To help your team know which step to use, you can provide aliases based on the designed use cases. Again, with this approach, you will likely run into issues where you need to use the same step for multiple use cases. Common examples include: Or you can simply recommend that your teammates defer to the original step number for situations where use cases don't have an alias. When designing for both light and dark modes, you sometimes need to map a variable to one color in light mode, and another color in dark mode. Common examples include: Avoid using specific variable names like "CardBg", or "Tooltip", because you will likely need to use each variable for multiple use cases.'''
