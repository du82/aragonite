["https://radix-ui.com/primitives"]
title = "Radix Primitives"
description = "Unstyled, accessible, open source React primitives for high-quality web apps and design systems."
full_description = "Supports keyboard and touch input, step interval, multiple thumbs for value ranges, and RTL direction. Supports one or multiple items open at the same time, keyboard navigation, collapse and expand animation. A set of two-state buttons that can be toggled on or off. Supports single and multiple pressed buttons. “Radix Primitives are crucial for the Node.js website and are a significant part of Node’s Web Design System. It allows our engineers to focus on what matters and create delightful experiences for the community.” “We’ve been able to focus on building solid user experiences on top of Radix Primitives. With UI components, there are just too many angles and rabbit holes to cover for product teams that wish to move quickly.” It takes a lot of time to develop and maintain a robust set of UI components, and it's mostly undifferentiated work. Building on top of Radix components will save you time and money, so you can ship a better product faster. It’s no secret that robust UI components are tricky to build. Nailing accessibility details and complex logic sucks time away from product feature development. With Radix, you can focus on your unique engineering challenges instead. Radix Primitives follow the WAI-ARIA guidelines, implementing correct semantics and behaviors for our components. Primitives provide full keyboard support for components where users expect to use a keyboard or other input devices. Out of the box, Primitives provide sensible focus management defaults, which can be further customized in your code. We test Primitives with common assistive technologies, looking out for practical issues that people may experience. One of our main goals is to provide the best possible developer experience. Radix Primitives provides a fully-typed API. All components share a similar API, creating a consistent and predictable experience. Each component is its own independently versioned package, so new components can be added alongside your existing code. No need to disrupt feature work with a huge rewrite⁠—you can start small and add more components one by one."
year_published = 2025
