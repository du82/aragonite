["https://radix-ui.com/primitives/case-studies/composer"]
title = "Composer – Case studies – Radix Primitives"
description = "Composer have been able to make their product significantly more accessible and reduce code complexity while allowing them to focus on building complex trading software."
full_description = "We are building a web app using ClojureScript, Reagent (a React wrapper), Radix UI and Tailwind CSS. Composer’s design system is in its formative stage; we follow the atomic design methodology and strive to design reusable component patterns throughout the app. Being able to adopt Radix Primitives incrementally has been invaluable, helping us replace old components one at a time without any breaking changes. The biggest win has been avoiding z-index wars since Radix manages all the stacking contexts with portals. Radix Primitives have made our product significantly more accessible and reduced code complexity while allowing us to focus on building complex trading software. The DX is magical 🪄. Composing primitives to our preferences and styling them how we like with Tailwind is a breeze. We love that implementing a primitive feels as easy as implementing an HTML element but with 100x more flexibility. We also appreciate that the team is always responsive on Discord and willing to help us through any roadblocks, especially because we use ClojureScript and have challenges that are unique to our language. The documentation is straightforward and well-written, with realistic examples that make it easy to adopt a primitive. The beauty is that the concepts are relatively the same across the primitives, so you don’t have to access the documentation frequently. Composer is an automated trading platform. It provides investors with the power to build a portfolio of hedge fund-like strategies without a spreadsheet or line of code."
