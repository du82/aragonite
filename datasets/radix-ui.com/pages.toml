["https://radix-ui.com/primitives/docs/components/toast"]
title = "Toast – Radix Primitives"
description = "A succinct message that is displayed temporarily."
full_description = '''The fixed area where toasts appear. Users can jump to the viewport by pressing a hotkey. It is up to you to ensure the discoverability of the hotkey for keyboard users. An action that is safe to ignore to ensure users are not expected to complete tasks with unexpected side effects as a result of a time limit. When obtaining a user response is necessary, portal an AlertDialog styled as a toast into the viewport instead. When a toast must appear every time a user clicks a button, use state to render multiple instances of the same toast (see below). Alternatively, you can abstract the parts to create your own imperative API. Combine --radix-toast-swipe-move-[x|y] and --radix-toast-swipe-end-[x|y] CSS variables with data-swipe="[start|move|cancel|end]" attributes to animate a swipe to close gesture. Here's an example: For toasts that are the result of a user action, choose foreground. Toasts generated from background tasks should use background. Foreground toasts are announced immediately. Assistive technologies may choose to clear previously queued messages when a foreground toast appears. Try to avoid stacking distinct foreground toasts at the same time. Background toasts are announced at the next graceful opportunity, for example, when the screen reader has finished reading its current sentence. They do not clear queued messages so overusing them can be perceived as a laggy user experience for screen reader users when used in response to a user interaction. Use the altText prop on the Action to instruct an alternative way of actioning the toast to screen reader users. You can direct the user to a permanent place in your application where they can action it or implement your own custom hotkey logic. If implementing the latter, use foreground type to announce immediately and increase the duration to give the user ample time.'''
year_published = 2025
