["https://radix-ui.com/colors/docs/palette-composition/understanding-the-scale"]
title = "Use cases – Radix Colors"
description = "How to use Radix Colors."
full_description = "This table is a simple overview of the most common use case for each step. However, there are many exceptions and caveats to factor in, which are covered in further detail below. Steps 1 and 2 are designed for app backgrounds and subtle component backgrounds. You can use them interchangeably, depending on the vibe you're going for. You may want to use white for your app background in light mode, and Step 1 or 2 from a gray or coloured scale in dark mode. In this case, set up a mutable alias for AppBg and map it to a different color for each color mode. If your component has a transparent background in its default state, you can use Step 3 for its hover state. Steps 11 and 12—which are designed for text—are guaranteed to Lc 60 and Lc 90 APCA contrast ratio on top of a step 2 background from the same scale. Step 9 has the highest chroma of all steps in the scale. In other words, it's the purest step, the step mixed with the least amount of white or black. Because 9 is the purest step, it has a wide range of applications: Step 10 is designed for component hover states, where step 9 is the component's normal state background. Most step 9 colors are designed for white foreground text. Sky, Mint, Lime, Yellow, and Amber are designed for dark foreground text and steps 9 and 10."
