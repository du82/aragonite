["https://radix-ui.com/primitives/case-studies/university-of-amsterdam"]
title = "University of Amsterdam – Case studies – Radix Primitives"
description = "University of Amsterdam uses Radix Primitives because they provide a great set of components that are easy to customise and easy to style to their own needs."
full_description = "At the University of Amsterdam we’re completely rebuilding the student information portal. Because we can ignore all legacy code, we’re setting up a design system from scratch. This design system is still in its infancy but will be used across multiple student platforms. Our current team is relatively small, with only 2 front-end and 1 back-end developer. Radix Primitives allow us to build accessible and customisable components for our design system, without forcing us into a pre-defined style. Radix is the perfect starting point for our design system, because most of the primitives line up with our exact needs. This saves us a lot of time reinventing the wheel. What we like the most about Radix is the fact that its developer experience is so fresh. It's not bloated by tons of components or conventions you should adhere to. It just provides a great set of primitive components that are easy to customise and easy to style to our own needs. It was clear from the start that the developer experience was one of the main selling points for Radix. We use TypeScript in combination with VSCode and the code suggestions Radix Primitives provide out of the box because of this make the API very easy to implement. We rarely need to re-read the documentation after implementing a primitive. Another themeable React component library, Chakra UI, while great in its own way, became so bloated with its own rules and utils that I stopped recommending it. Radix just provides you with logical props and straightforward typings. Each component is separately versioned which allows us to pick and choose which primitives we want to implement. We like the simplicity of this. The docs are great! They provide a great introduction and clearly show code examples for each primitive. I like the split between the ‘anatomy’ and a basic example. Although I noticed some functionality or “best practices” are not always mentioned in the docs. This might be because they are still subject to change I can imagine. I used the Radix design system for more practical use examples of some components and some of the practices used in that repo would be welcome additions to the Radix documentation (E.g polymorphism in combination with Stitches)."
year_published = 2025
