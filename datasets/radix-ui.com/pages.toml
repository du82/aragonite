["https://radix-ui.com/primitives/docs/components/menubar"]
title = "Menubar – Radix Primitives"
description = "A visually persistent menu common in desktop applications that provides quick access to a consistent set of commands."
full_description = "A visually persistent menu common in desktop applications that provides quick access to a consistent set of commands. The button that toggles the content. By default, the Menubar.Content will position itself against the trigger. An optional arrow element to render alongside a menubar menu. This can be used to help visually link the trigger with the Menubar.Content. Must be rendered inside Menubar.Content. Renders when the parent Menubar.CheckboxItem or Menubar.RadioItem is checked. You can style this element directly, or you can use it as a wrapper to put an icon into, or both. You may want to constrain the width of the content (or sub-content) so that it matches the trigger (or sub-trigger) width. You may also want to constrain its height to not exceed the viewport. We expose several CSS custom properties such as --radix-menubar-trigger-width and --radix-menubar-content-available-height to support this. Use them to constrain the content dimensions. We expose a CSS custom property --radix-menubar-content-transform-origin. Use it to animate the content from its computed origin based on side, sideOffset, align, alignOffset and any collisions. We expose data-side and data-align attributes. Their values will change at runtime to reflect collisions. Use them to create collision and direction-aware animations. Adheres to the Menu Button WAI-ARIA design pattern and uses roving tabindex to manage focus movement among menu items."
year_published = 2025
