["https://radix-ui.com/themes/docs/components/heading"]
title = "Heading – Radix Themes"
description = "Semantic heading element."
full_description = "Use the as prop to change the heading level. This prop is purely semantic and does not change the visual appearance. Use the size prop to control the size of the heading. The prop also provides correct line height and corrective letter spacing—as text size increases, the relative line height and letter spacing decrease. Heading sizes match Text sizes. However, the line heights are set a bit tighter as headings tend to be shorter than running text. The prop works similarly to the upcoming half-leading control spec, but uses a common negative margin workaround under the hood for cross-browser support. Trimming the leading is useful when dialing in vertical spacing in cards or other “boxy” components. Otherwise, padding looks larger on top and bottom than on the sides. The default trim values are configured for the system font stack that’s used by Radix Themes. If you are using custom fonts, you can adjust the trim values using the corresponding CSS variables. text-wrap: pretty is an experimental value that is not yet supported in all browsers. However, it can be treated as a progressive enhancement for browsers that do support it. Use the color prop to assign a specific color. The text colors are designed to achieve at least Lc 60 APCA contrast over common background colors."
