["https://radix-ui.com/colors/docs/palette-composition/composing-a-palette"]
title = "Composing a color palette – Radix Colors"
description = "A guide to composing a color palette with Radix Colors."
full_description = "Radix Colors are not intended to be customised. They’re designed to be accessible, well-balanced, and harmonious. Any customisation would likely break these features. For example, you could use Radix Colors for your gray scale and your semantic scales, then add custom brand/accent colors. If you want a neutral vibe, or you want to keep things simple, gray will work well with any hue or palette. Alternatively, choose the gray scale which is saturated with the hue closest to your accent hue. The difference is subtle, but this will create a more colorful and harmonius vibe. Note: If your project uses a lot of colorful UI components like Badge, be careful when using saturated grays for your app background, especially in dark mode. Colorful UI components may clash with your saturated gray background color. For most projects, you will need colors to communicate semantic meaning. Here are some common pairings that work well in Western culture. In many cases, you might eventually need most of the scales, for one reason or another. Your app may support multiplayer mode, where you assign a color to each user. Your app may have a labelling feature, where your users assign a color to a task. Your app may use badges to communicate “pending” or “rejected” states. Radix Colors are well-balanced, and designed to work in harmony. So for product communication, most color pairings will work. Steps 11 and 12 are designed for low-contrast text and high-contrast text respectively. Depending on the vibe you want, you can use your accent scale or your gray scale. You may want to experiment with using your accent scale for text in your marketing sites, and your gray scale for text in your apps."
