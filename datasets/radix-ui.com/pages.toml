["https://radix-ui.com/themes/docs/overview/layout"]
title = "Layout – Radix Themes"
description = "Get the layout concerns right."
full_description = "Layout components are used to separate layout responsibilities from content and interactivity. This is the separation of concerns that makes your app maintainable and easy to reason about, and understanding these principles is key to building your interfaces effectively. Flex component does everything that Box can do, but comes with an additional set of props to organize items along an axis. It provides convenient access to the CSS flexbox properties Grid is used to organize the content in columns and rows. Like Box and Flex, it’s made to provide convenient access to the underlying CSS grid properties without any magic of its own. Section provides a consistent vertical spacing between the larger parts of your page content, creating a sense of hierarchy and separation. There’s just a few pre-defined sizes for different spacing levels to keep things simple and consistent. Container’s sole responsibility is to provide a consistent max-width to the content it wraps. Like Section, it comes just with a couple of pre-defined sizes that work well with common breakpoints and typical content widths for comfortable reading. Each layout component has a set of it’s own specialized props and also a shared set of common layout props. All layout props support responsive object values. Positioning props can change how the element is placed relative to the normal flow of the document. As usual, the corresponding CSS values are accepted for each property, and the space scale steps can be used for the offset values. Margin props are available on most components in order to provide spacing around the elements. They are not exclusive to layout components. The margin props may be unavailable on components that don’t render a HTML node or rely on their Root part for layout. If needed, it’s possible to use just the layout component from Radix Themes. Just make sure that JavaScript tree-shaking works on your side, and import the CSS that powers the layout styles: You’ll still have to wrap your app with Theme to provide the space scale and scaling factor settings."
year_published = 2025
