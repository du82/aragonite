description = "News from FT: Start-ups such as 01.ai and DeepSeek have reduced prices by adopting strategies such as focusing on smaller data sets to train AI models and hiring cheap but skilled computer engineers. Bigger technology groups such as Alibaba, Baidu and ByteDance have also engaged in a pricing war to cut “inference” costs, the price…"
full_description = "Smaller data sets are the key RadOnc Notes Reading January 20, 2025October 23, 2024 1 Minute News from FT: Start-ups such as 01.ai and DeepSeek have reduced prices by adopting strategies such as focusing on smaller data sets to train AI models and hiring cheap but skilled computer engineers. Bigger technology groups such as Alibaba, Baidu and ByteDance have also engaged in a pricing war to cut “inference” costs, the price of calling upon large language models to generate a response, by more than 90 per cent and to a fraction of that offered by US counterparts. This is despite Chinese companies having to navigate Washington’s ban on exports of the highest-end Nvidia AI chips, seen as crucial to developing the most cutting edge models in the US. Source: Chinese AI groups get creative to drive down cost of models by @FinancialTimes More context: Researchers view the model-of-expert approach as a key way to achieve the same level of intelligence as a dense model but with less computing power. But the approach can be more prone to failure as engineers have to orchestrate the training process across multiple “experts” rather than in one model. This is rapidly evolving field and we had discussed something called as “efficient language models”. Hopefully, we should have some traction soon in this direction. Share this:EmailTelegramTwitterFacebookRedditPrintPinterestPocketWhatsAppLike Loading... Related Published by RadOnc Notes View all posts by RadOnc Notes Published January 20, 2025October 23, 2024"
