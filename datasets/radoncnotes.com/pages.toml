title = "When AI is attempted in a public health setting – RadOncNotes"
description = "There's a simple cookie cutter template in the mainstream media: Lpixel's AI, powered by algorithms developed in-house, can inform doctors of signs of disease based on chest X-ray images. The company has put diagnostic support AI that detects abnormalities in the lungs into practical use in Japan and is expanding on that know-how for tuberculosis.…"
full_description = "When AI is attempted in a public health setting RadOnc Notes Reading January 18, 2025October 23, 2024 1 Minute There’s a simple cookie cutter template in the mainstream media: Lpixel’s AI, powered by algorithms developed in-house, can inform doctors of signs of disease based on chest X-ray images. The company has put diagnostic support AI that detects abnormalities in the lungs into practical use in Japan and is expanding on that know-how for tuberculosis. The number of people suffering from tuberculosis worldwide was estimated at 10.6 million in 2022, up from 10.3 million in 2021, according to the World Health Organization. The largest number is in Southeast Asia, accounting for 46% of the total. Because tuberculosis is an infectious disease, early detection and treatment are considered important. Thailand has nine doctors per 10,000 people, compared with Japan’s 26. The shortage is a societal issue and has led to situations where X-rays might be taken but there is no one available to diagnose a patient based on the results. Lpixel developed its AI tech based largely on X-ray image data of Japanese people, with data from Thai tuberculosis patients making up about 5%. It also took into account differences in the level of medical equipment available and the imaging skills of technicians. Source: AI diagnosis tech to help Thailand, Brazil navigate doctor shortages by @NAR Name the company. Mention the scope of the public health problem that it is trying to “solve”. Then magically introduce the “start-up” which is attempting to solve a “global problem”. I never heard of this company though. Interesting details here: ASEAN is moving towards a system whereby medical devices approved in one member country may go through a simplified approval process in other countries. AI Medical Service received approval in Singapore in February and aims to sell its system in Thailand and Vietnam in the future. “In emerging countries where medical infrastructure is not fully developed, AI-equipped medical devices could quickly penetrate the market,” said Kenji Yoshida, head of the company’s global business. Indonesia has just seven doctors per 10,000 people, and Vietnam eight. Let’s see what comes out of it. Share this:EmailTelegramTwitterFacebookRedditPrintPinterestPocketWhatsAppLike Loading... Related Published by RadOnc Notes View all posts by RadOnc Notes Published January 18, 2025October 23, 2024"
