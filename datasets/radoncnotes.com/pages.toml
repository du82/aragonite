title = "Accountability sinks – RadOncNotes"
description = "This is interesting: Once you start looking for accountability sinks, you see them all over the place. When your health insurance declines a procedure; when the airline cancels your flight; when a government agency declares that you are ineligible for a benefit; when an investor tells all their companies to shovel so-called AI into their…"
full_description = "Accountability sinks RadOnc Notes Reading January 19, 2025October 23, 2024 1 Minute This is interesting: Once you start looking for accountability sinks, you see them all over the place. When your health insurance declines a procedure; when the airline cancels your flight; when a government agency declares that you are ineligible for a benefit; when an investor tells all their companies to shovel so-called AI into their apps. Everywhere, broken links between the people who face the consequences of the decision and the people making the decisions. That’s assuming, of course, that a person did make a decision at all. Another mechanism of accountability sinks is the way in which decisions themselves cascade and lose any sense of their origins. Source: Accountability sinks | A Working Library by Mandy Brown In the context of AI: The comparisons to AI are obvious, inasmuch as delegating decisions to an algorithm is a convenient way to construct a sink. But organizations of any scale—whether corporations or governments or those that occupy the nebulous space between—are already quite good at forming such sinks. The accountability-washing that an AI provides isn’t a new service so much as an escalated and expanded one. Which doesn’t make it any less frightening, of course; but it does perhaps provide a useful clue. Any effort that’s tried and failed to hold a corporation to account isn’t likely to have more success against an algorithm. We need a new bag of tricks Interesting indeed. Share this:EmailTelegramTwitterFacebookRedditPrintPinterestPocketWhatsAppLike Loading... Related Published by RadOnc Notes View all posts by RadOnc Notes Published January 19, 2025October 23, 2024"
