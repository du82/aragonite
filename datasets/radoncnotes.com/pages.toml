description = "Consider this: Today, AI products are used ubiquitously to generate code, text, and images, analyze data, automate tasks, enhance online platforms, and much, much, much more—with usage expected only to increase going forward. Yet these cutting-edge models require enormous computing resources for their training and inference, that computing requires massive arrays of advanced hardware housed…"
full_description = "The looming energy costs associated with AI RadOnc Notes Reading January 16, 2025October 23, 2024 1 Minute Consider this: Today, AI products are used ubiquitously to generate code, text, and images, analyze data, automate tasks, enhance online platforms, and much, much, much more—with usage expected only to increase going forward. Yet these cutting-edge models require enormous computing resources for their training and inference, that computing requires massive arrays of advanced hardware housed at industrial-scale facilities, and those facilities require access to vast quantities of power, water, broadband, and other infrastructure for their operations. Thus, the downstream result of the AI boom has been a rapid increase in US fixed investment to meet the growth in computing demand, with hundreds of billions of dollars going to high-end computers, data center facilities, power plants, and more. Right now, US data center construction is at a record-high rate of $28.6B a year, up 57% from last year and 114% from only two years ago. For context, that’s roughly as much as America spends on restaurant, bar, and retail store construction combined. Source: The AI Investment Boom by Joseph Politano Taken from the link: data by the author This is growing! I am tracking the small modular nuclear reactors as well on the sidelines (they provide a fascinating insight into how things are rapidly changing). But at what point will this become unsustainable, is anyone’s guess. Share this:EmailTelegramTwitterFacebookRedditPrintPinterestPocketWhatsAppLike Loading... Related Published by RadOnc Notes View all posts by RadOnc Notes Published January 16, 2025October 23, 2024"
