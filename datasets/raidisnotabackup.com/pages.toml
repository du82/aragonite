title = "RAID is NOT a backup! · RAID is NOT a backup!"
description = "So you've built a server. It has multiple disks in a RAID configuration. Do you need a backup? YES!"
full_description = "RAID is NOT a backup! What is RAID? RAID is a common technique to provide resiliency and availability to a set of data and protect against one of the most common data loss scenarios: the failure of a disk. The simplest type of RAID is a ‘mirror’, which keeps two or more copies of data on two or more different disks. If one disk fails, the second copy is still available and no availability or data loss has occurred. You would usually see this for system disks in uptime-critical servers. More common for bulk data are more advanced modes like RAID-5 and RAID-6, which consists of 3-4 or more disks with data stripped (written sequentially), along with parity information, across all disks, and which can tolerate losing 1 or 2 (respectively) disks in the array before losing data. It’s worth noting that a pure ‘stripe’, also called RAID-0, is not really a RAID level - it increases the risk of data loss rather than decreasing it, since one disk failure destroys the whole array. It should never be used for redundancy or any critical data. The Wikipedia page for RAID provides some helpful information about the history and benefits of the various RAID implementations. RAID is NOT a backup! So why do I need a backup? Having a number of disks in RAID may seem like a backup, especially if you’re using a mirrored RAID mode like RAID-1 or RAID-10. But this is wrong! RAID protects you against one and only one thing: a disk failure. It does not protect you against any of the following things: Multiple disk failures beyond the RAID level chosen (e.g. both disks in a mirror, or 3 disks in a RAID-6), including possible UREs. Failure of the RAID controller itself (if applicable), the computer running the RAID, or the environment containing the servers (e.g. a flood, fire, or theft). Data corruption from filesystem bugs, cosmic rays, or minor hardware or firmware failures, which can and do happen all the time - you usually just don’t notice and software works around it. Malicious or accidental deletion or modification of files, including by viruses, bad application writes, or administrative mistakes (e.g. rm-ing the wrong file or mkfs on an existing filesystem). The adage is simple: “RAID replicates everything, instantly, even the stuff you don’t want it to.”"
year_published = 2025
