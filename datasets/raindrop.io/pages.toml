["https://raindrop.io/pro/buy"]
title = "Pricing — Raindrop.io"
description = "All in One Bookmark Manager. For your inspiration, read later, media and stuff."
full_description = "Absolutely! Raindrop.io is completely free to use indefinitely.You can use it on unlimited devices and create unlimited bookmarks and collections in all plans. In short you will have full-text search, permanent copies of your bookmarks, more space for uploads, cloud backup and tools to keep your bookmarks clean. Yes! We offer either monthly or yearly billing options. The yearly billing option is always cheaper (usually ~20% discount). We handle billing via FastSpring. It's the same payment provider used in companies such as Adobe, Sketch, DaisyDisk and other. We do not handle your credit card information directly.Paypal is fully supported, select it as your payment method on checkout. When you cancel your plan, you will remain on the plan until the end of your billing cycle, at which time the plan will be canceled. Your account email will be notified after each failed payment. Payments may be retried up to 4 times within the next week. After this, if the payment did not succeed, you will be downgraded to the Free plan."
year_published = 2025
