["https://ramsdenj.com/posts/2016-08-29-arch-linux-on-the-surface-pro-4"]
title = "Arch Linux on The Surface Pro 4 · John Ramsden"
description = """
I recently acquired a Surface Pro 4 and it was instantly obvious what a great machine it is. Having a tablet for casual use, while still having the capabilities of a powerful computer that you can use with a normal keyboard and mouse is extremely convenient.
One of the first things that I wondered when I got the Surface was: how well will this thing run Linux? I can accept having to use Windows when I’m casually using the machine as a tablet, but when I really want to get work done, I am most comfortable in Linux. There were some difficulties at the beginning of installation, but once I was able to get started, installing Linux on the Surface was as easy as installing it on a regular laptop."""
full_description = '''Arch Linux on The Surface Pro 4 August 29, 2016 17-minute read John Ramsden Linux • Archlinux • Zfs • Open-Source • Filesystem • HardwareI recently acquired a Surface Pro 4 and it was instantly obvious what a great machine it is. Having a tablet for casual use, while still having the capabilities of a powerful computer that you can use with a normal keyboard and mouse is extremely convenient.One of the first things that I wondered when I got the Surface was: how well will this thing run Linux? I can accept having to use Windows when I’m casually using the machine as a tablet, but when I really want to get work done, I am most comfortable in Linux. There were some difficulties at the beginning of installation, but once I was able to get started, installing Linux on the Surface was as easy as installing it on a regular laptop.{:.no_toc}TOC will be output here {:toc}Prepare The System Link to headingIf you plan on keeping Windows around, the C drive must be shrunk to make room for Linux. Otherwise, you can skip to booting to install media. Even if you don’t plan on using Windows, currently the only way to get firmware updates is through Microsoft. If only just for updates, you may want to keep a small Windows partition.Disk Management Link to headingOpen the Control Panel and go to System and Security->Administrative Tools->Computer Management, then click on Storage, and finally Disk Management.Select the main desk and choose to shrink the partition.I chose to only partition off a 40GiB chunk.After shrinking the disk you should see an unallocated space showing the size of your new unformatted partition.Alternatively, if you don’t plan on keeping Windows around, the drive can be wiped later within the Arch install media.Delete Recovery Partition (optional) Link to headingWhile playing with the partitions, you may want to delete the Windows recovery partition. It takes up unnecessary space, and you’re worried about not having it you can back it up to USB key.Booting Link to headingWhen booting from install media, and eventually when booting your own install, you have to decide if you want to leave secure boot enabled.UEFI Menu Link to headingTo change around the secure boot options, you need to be able to access the UEFI menu.Instructions to access the UEFI menu:Turn off the computer.With the computer off hold down the volume up button.While still holding the volume up button, turn on the computer.Keep holding the volume up button until the surface logo disappears.Secure Boot Options Link to headingThis section will go through the different options with secure boot..Option 1: Disable Secure Boot Link to headingThe simplest option at this stage is to boot into the UEFI menu, and disable secure boot. Unfortunately, when booting with secure boot disabled, you’ll be faced with a nice big red bar at the top when it gets to the Surface logo. If you are fine with that this is the easiest option.In the UEFI menu under security, you’ll find secure boot. The following options are available:Microsoft OnlyMicrosoft and 3rd Party CANoneSelect ’none’ to turn off secure boot.Option 2: Use a Signed Bootloader Link to headingThe archiso has a signed bootloader which is supposed to allow booting with secure boot enabled. I was unable to boot using this method but the process is detailed on the arch wiki.Option 3: Use Your Own Self-Signed Keys Link to headingThe last option is using your own set of self signed keys. This process is also detailed on the arch wiki and there is a very good resource all about secure boot that goes into detail on the process – Rod Smith’s Controlling Secure Boot.Change Boot Options Link to headingNext you’re going to want to change the boot options to prioritize USB, or whatever media you are booting from.Open the UEFI menu and select “Configure Alternate System Boot Order”, Drag whichever option you want to boot from to the top.You should now be able to stick in a USB drive and boot from it, installing Linux as usual.Booting from SD Card or Difficult Media Link to headingI ran into an issue where I could not get certain USB key images to boot. I was also unable to get the images to boot from an SD card. For whatever reason, if you’re having trouble booting an image the normal way, you may want to try installing an alternate bootloader and using it to boot your install media. When I did this, I was able to boot any image, from any device.I installed the rEFInd bootloader to Windows’ existing boot partition, and changed some settings so that instead of running Windows’ regular bootloader at startup, rEFInd would be run. From rEFInd I could boot from difficult ISO images. This was especially useful because if you just stick a USB key in the Surface and boot from it, you cannot have a keyboard plugged in. In my case wireless was also not working and I was unable to ssh in to the box. To get around this I booted from an SD card, plugged a USB ethernet adapter in, and I was then able to ssh in. Alternately, this also lets you plug in a keyboard and do the installation directly on the device.Download the bootloader and extract it to a known directory within Windows. Make sure to get the binary zip file.Setting Up rEFInd as a Bootloader Link to headingTo setup rEFInd as a bootloader, I opened up the command prompt within Windows and installed rEFInd to Windows existing system partition.Note: This will NOT remove Windows’ existing bootloader, it will use rEFInd instead. rEFInd can simply be deleted at any time and Windows can be set back to using the original bootloader.Open the cmd prompt as an administrator.Mount the system partition to drive ‘Z:’ C:\Windows\system32> mountvol Z: /S Change directory to wherever rEFInd has been extracted. C:\Windows\system32> cd C:\Users\John\Downloads Copy rEFInd to the system partition. C:\Users\John\Downloads> xcopy /E refind Z:\EFI\refind\ Change directory to the system partition. C:\Users\John\Downloads> Z: Rename the configuration file Z:> rename refind.conf-sample refind.conf Set rEFInd as the default EFI boot program. If this doesn’t work try step 8. Z:> bcdedit /set {bootmgr} path \EFI\refind\refind_x64.efi If the previous step does not work, you may be able to go in and edit the BCD with other tools. You can use the Visual BCD Editor, which will let you change the ApplicationPath element.Installation Link to headingOnce booted into the Linux installer, the process should be fairly similar to a regular install.Formatting Link to headingI decided to use ZFS as my file system using a single pool for ‘root’, which I put on a 40GB partition on the SSD. I then used a separate pool for ‘/home’ that I put on a micro SD card. I won’t be going into detail about my reasoning for how I considered ZFS, if you’re looking for an explanation about how to set it up, and why I did what I did, I describe how to set up ZFS on Arch Linux in detail in previous posts.Besides the fact that I used ZFS, this process should be very similar with any other file system.This is what the discs look like on the Surface. As you can see I’m currently booted off the micro SD card which is showing up as /dev/sda. The SSD is showing up as /dev/nvme0n1, and is only using about 200GB of space leaving 40GB unpartitioned, which I will use for the root file system.[root@archiso /]# lsblk NAME MAJ:MIN RM SIZE RO TYPE MOUNTPOINT sda 8:0 1 119.1G 0 disk └─sda1 8:1 1 119.1G 0 part /run/archiso/bootmnt loop0 7:0 0 330M 1 loop /run/archiso/sfs/airootfs nvme0n1 259:0 0 238.5G 0 disk ├─nvme0n1p1 259:1 0 260M 0 part ├─nvme0n1p2 259:2 0 128M 0 part └─nvme0n1p3 259:3 0 197.2G 0 part Using my partitioning tool of choice gdisk, I open up the SSD and make a new ‘Solaris root’ partition.[root@archiso /]# gdisk /dev/nvme0n1 GPT fdisk (gdisk) version 1.0.1 Found valid GPT with protective MBR; using GPT. Command (? for help): p Disk /dev/nvme0n1: 500118192 sectors, 238.5 GiB Logical sector size: 512 bytes Disk identifier (GUID): 904273B8-CE67-42A3-AB13-35EFC6772FB3 Partition table holds up to 128 entries First usable sector is 34, last usable sector is 500118158 Partitions will be aligned on 2048-sector boundaries Total free space is 85774957 sectors (40.9 GiB) Number Start (sector) End (sector) Size Code Name 1 2048 534527 260.0 MiB EF00 EF 2 534528 796671 128.0 MiB 0C01 Mi 3 796672 414345215 197.2 GiB 0700 Ba Command (? for help): n Partition number (4-128, default 4): First sector (34-500118158, default = 414345216) or {+-}size{KMGTP}: Last sector (414345216-500118158, default = 500118158) or {+-}size{KMGTP}: Current type is 'Linux filesystem' Hex code or GUID (L to show codes, Enter = 8300): bf00 Changed type of partition to 'Solaris root' Command (? for help): w Final checks complete. About to write GPT data. THIS WILL OVERWRITE EXISTING PARTITIONS!! Do you want to proceed? (Y/N): Y OK; writing new GUID partition table (GPT) to /dev/nvme0n1. The operation has completed successfully. Setup the Root Pool Link to headingI then proceeded to set up my root pool. If I were not using ZFS, this step would simply be replaced with formatting the partitions using a different file system.First I got the disk ID for the partition I will be installing my pool on. It shows up as /dev/disk/by-id/nvme-eui.002538415b108e66-part4.[root@archiso /]# ls /dev/disk/by-id/ nvme-eui.002538415b108e66 nvme-eui.002538415b108e66-part1 nvme-eui.002538415b108e66-part2 nvme-eui.002538415b108e66-part3 nvme-eui.002538415b108e66-part4 usb-Generic-_USB3.0_CRW_-SD_201509231639-0:0 usb-Generic-_USB3.0_CRW_-SD_201509231639-0:0-part1 Create a new zpool ‘vault’.[root@archiso /]# zpool create -f -o ashift=12 \ vault nvme-eui.002538415b108e66-part4 [root@archiso /]# zpool status pool: vault state: ONLINE scan: none requested config: NAME STATE READ WRITE CKSUM vault ONLINE 0 0 0 nvme-eui.002538415b108e66-part4 ONLINE 0 0 0 errors: No known data errors Set pool properties.[root]# zfs set compression=on vault [root]# zfs set atime=on vault [root]# zfs set relatime=on vault [root]# zfs set mountpoint=none vault Set up datasets for ‘/’, ‘/usr’, ‘/var’, and ‘/tmp’.[root@archiso /]# zfs create -o mountpoint=none vault/ROOT [root@archiso /]# zfs create -o mountpoint=legacy vault/ROOT/default [root@archiso /]# zfs create -o setuid=off -o devices=off -o sync=disabled -o mountpoint=/tmp vault/tmp cannot mount '/tmp': directory is not empty filesystem successfully created, but not mounted [root@archiso /]# zfs create -o xattr=sa -o mountpoint=legacy vault/var [root@archiso /]# zfs create -o mountpoint=legacy vault/usr Mask tmpfs backed tmp.1 [root@archiso /]# systemctl mask tmp.mount Created symlink /etc/systemd/system/tmp.mount → /dev/null. Unmount and export the pool, setup the fstab, and set the boot dataset.[root@archiso /]# zfs umount -a [root@archiso /]# nano /etc/fstab [root@archiso /]# zpool set bootfs=vault/ROOT/default vault [root@archiso /]# zpool export vault Import the pool at ‘/mnt’ and copy in the cache.[root@archiso /]# zpool import -d /dev/disk/by-id -R /mnt vault [root@archiso /]# umount /mnt/vault [root@archiso /]# mount -t zfs vault/ROOT/default /mnt 1 [root@archiso /]# mkdir -p /mnt/etc/zfs/ [root@archiso /]# cp /etc/zfs/zpool.cache /mnt/etc/zfs/zpool.cache Make the mountpoints and mount the boot partition. I decided to share the existing Windows boot partition.[root@archiso /]# mkdir /mnt/{home,boot,var,usr,tmp} [root@archiso /]# mount /dev/nvme0n1p1 /mnt/boot Set ‘tmp’ to be a legacy dataset so that it can be mounted. I set this back later. I then proceeded to mount all of the datasets.2 [root@archiso /]# zfs set mountpoint=legacy vault/tmp [root@archiso /]# mount -t zfs vault/tmp /mnt/tmp [root@archiso /]# mount -t zfs vault/var /mnt/var [root@archiso /]# mount -t zfs vault/usr /mnt/usr Setup the fstab.[root@archiso /]# genfstab -U -p /mnt >> /mnt/etc/fstab [root@archiso /]# nano /mnt/etc/fstab Edit the mirrorlist and bootstrap the system.[root@archiso /]# nano /etc/pacman.d/mirrorlist [root@archiso /]# pacstrap -i /mnt base base-devel Edit hooks[root@archiso /]# nano /mnt/etc/mkinitcpio.conf # ... HOOKS="base udev autodetect modconf block keyboard zfs usr filesystems shutdown" # ... Enter chroot Link to headingFinally I found myself at the main install step. From here on out the steps are fairly similar on any system.Enter the chroot[root@archiso /]# arch-chroot /mnt /bin/bash Archzfs Repository Link to headingSince I’m using the archzfs repo I need to add the server to pacman.conf.[root@archiso ~]# nano /etc/pacman.conf # REPOSITORIES [archzfs] Server = http://archzfs.com/$repo/x86_64 # Other repositories... [root@archiso ~]# pacman-key -r 5E1ABF240EE7A126 gpg: key 5E1ABF240EE7A126: public key "Jesus Alvarez <jeezusjr@gmail.com>" imported gpg: Total number processed: 1 gpg: imported: 1 ==> Updating trust database... gpg: next trustdb check due at 2016-10-19 [root@archiso ~]# pacman-key --lsign-key 5E1ABF240EE7A126 -> Locally signing key 5E1ABF240EE7A126... ==> Updating trust database... gpg: marginals needed: 3 completes needed: 1 trust model: pgp gpg: depth: 0 valid: 1 signed: 7 trust: 0-, 0q, 0n, 0m, 0f, 1u gpg: depth: 1 valid: 7 signed: 67 trust: 1-, 0q, 0n, 6m, 0f, 0u gpg: depth: 2 valid: 67 signed: 7 trust: 67-, 0q, 0n, 0m, 0f, 0u gpg: next trustdb check due at 2016-10-19 Update the repositories[root@archiso ~]# pacman -Syyu [root@archiso ~]# pacman -S zfs-linux Bootloader Link to headingSetup the bootloader. I use systemd-boot for it’s simplicity (formerly gummiboot).[root@archiso ~]# bootctl --path=/boot install [root@archiso ~]# pacman -S intel-ucode [root@archiso ~]# nano /boot/loader/entries/arch.conf [root@archiso ~]# nano /boot/loader/loader.conf title Arch Linux linux /vmlinuz-linux initrd /intel-ucode.img options zfs=vault/ROOT/default rw [root@archiso ~]# nano /boot/loader/entries/arch.conf I also added an entry to boot back to WindowsFind the UUID for Windows.[root]# blkid /dev/nvme0n1: LABEL="vault" UUID="427324970059401446" UUID_SUB="6036059601541096496" TYPE="zfs_member" PTUUID="904273b8-ce67-42a3-ab13-35efc6772fb3" PTTYPE="gpt" /dev/nvme0n1p1: LABEL="SYSTEM" UUID="1A20-9B51" TYPE="vfat" PARTLABEL="EF" PARTUUID="08632d56-2dcf-4798-832d-47a55c6af4e9" /dev/nvme0n1p3: LABEL="Windows" UUID="A6EC3AE6EC3AB103" TYPE="ntfs" PARTLABEL="Ba" PARTUUID="1f00bed2-bfb7-48b9-95f2-5dba2cfb1552" /dev/nvme0n1p4: LABEL="vault" UUID="427324970059401446" UUID_SUB="6036059601541096496" TYPE="zfs_member" PARTLABEL="Solaris root" PARTUUID="c33beba4-c30b-4f9d-b6d7-007999f93374" /dev/nvme0n1p2: PARTLABEL="Mi" PARTUUID="f2d9397d-8988-4371-a221-1fb48af17ef5" /dev/sda1: LABEL="shard" UUID="1357983430707090525" UUID_SUB="12710706323195723640" TYPE="zfs_member" PARTLABEL="zfs-f3ab621862d13b4a" PARTUUID="276229ef-0856-0a44-a92e-6115378e4e51" /dev/sda9: PARTUUID="cafec46c-c234-d744-a4ea-7eefe3544ea2" Add a boot entry.[root@archiso ~]# nano /boot/loader/entries/windows.conf title Blade (Windows) efi /EFI/Microsoft/Boot/bootmgfw.efi options root=PARTUUID=1f00bed2-bfb7-4'''
