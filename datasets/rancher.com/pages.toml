["https://www.rancher.com/learn-the-basics"]
title = "Learn Kubernetes and Containers | Rancher"
description = "Whether you are new to containers or trying to take your first steps with Kubernetes in production, learning paths can guide you through the process by focusing on foundational knowledge paired with practical progression."
full_description = "In recent years, containers have become a key feature in modern software development. Both developers and operations professionals have recognized the advantages of building, deploying, and managing software within containers. But what exactly are containers and how do they work? In this series, we'll introduce you to the core concepts at the heart of containers and teach you how to work with Docker, the most popular container image builder and runtime in the world. You'll learn what containers are and how they work, how containers differ from other virtualization technologies, how to use Docker to build and run your own container images, and the fundamentals of container networking, storage, and security. Upon completing this course, you should be comfortable working with containers in a local environment. You'll be ready to tackle more complex areas, like Kubernetes: a container orchestration platform. In this series, we'll walk you through what Kubernetes is and how it evolves the concepts of users in single-host container management. You'll learn why an additional management layer called a container orchestration platform is necessary when running containers in production and why Kubernetes became the de facto standard. We'll discuss how each of the system's software components contribute to managing complex container environments, introduce you to the different workload types Kubernetes supports, and give you hands-on experience with Kubernetes clusters. After finishing this series, you should have a solid understanding of what Kubernetes is and how it works. You will also have experience working with Kubernetes tooling, designing applications for Kubernetes, and deploying software to Kubernetes clusters. Once you've finished this material, you'll be ready to learn about using Kubernetes in production and exploring the greater Kubernetes ecosystem. Taking Kubernetes into production and getting comfortable with the cloud native ecosystem can feel like a daunting challenge. Securing your environments, setting up high availability to decrease the likelihood of downtime, and integrating Kubernetes into your development and deployment processes all take careful thought and execution."
