["https://www.rancher.com/why-rancher"]
title = "Why Rancher Prime? | Rancher"
description = "Rancher for Kubernetes is a complete stack that eases the operational and security challenges of managing multiple container clusters on or off the cloud."
full_description = "Rancher is the unified cloud-native platform helping teams manage their Kubernetes from infrastructure to applications. 100% open source, Rancher streamlines cluster deployment, offering centralized authentication, access control and observability across your deployments anywhere – from bare metal, private clouds, public clouds or vSphere. Get more value out of Rancher and start optimizing infrastructure workflows, maintain application reliability, and fortify your organization's cloud-native environments with Rancher Prime. Most developers don’t care about IT infrastructure. They just want to write code and build their apps securely using their preferred workflow. Rancher Prime makes it simple to deliver Kubernetes-as-a-Service to development teams with push button deployment of their containerized workloads on-premises, in the cloud, in hybrid deployments or at the edge. Meanwhile, operators can maintain full administrative control and observability. Rancher Prime unites Kubernetes clusters with centralized authentication and access control, enterprise security, auditing, backups, upgrades, observability and alerts. Deploy and secure clusters consistently in minutes anywhere using our intuitive UI or powerful CLI. Manage on-prem clusters and those hosted on cloud services like AKS, EKS & GKE from a single pane of glass. Centrally configure security policy, audit logs and monitor performance. Deploy multi-cluster apps consistently from our app catalog. Control access by connecting them to your internal identity provider like Active Directory, LDAP or Okta. Leverage Helm for turnkey multi-cluster deployment of popular open source tools or apps from our bespoke Rancher Prime library of integrations and curated catalog. Rancher Prime supports tools that DevOps teams already love like Jenkins, Gitlab or Travis for building CI/CD pipelines, Prometheus and Grafana for observability, Fluentd for logging, and Istio for service mesh. Rancher Prime allows direct enablement of the encryption provider, and configuration of audit logging and rate-limiting. Scan and assess cluster configurations against CIS benchmark best practices. Consistently deploy securely provisioned clusters with full lifecycle container management integration with NeuVector by SUSE."
