title = "About Us | Rancher"
description = "Rancher allows enterprises to run containers and Kubernetes in production and deliver Kubernetes-as-a-Service across any infrastructure."
full_description = "At SUSE, we believe every business is on a journey of digital transformation, and that transformation can be enhanced and accelerated by open innovation. In today’s hyper-connected world, innovation is occurring virtually everywhere – in the data center, in the cloud, at the edge and beyond. The most successful businesses will be those that capitalize on open and interoperable solutions that let them harness innovation, no matter where it occurs. SUSE is exceptionally prepared to help each business Choose Open, with the industry’s most adaptable Enterprise Linux and a leading Container Management solution that provides full management of all Kubernetes distributions. Because SUSE is truly open, businesses can choose the right combination of technology and solutions to ensure their business success. At SUSE, our mission is to help our customers innovate everywhere. We started Rancher in 2014 to create software that would simplify the lives of teams who were building applications using containers. The market was new, Docker had just been introduced and questions about how to manage, secure and orchestrate containers were pressing and exciting problems to solve. Within a year we introduced the first version of Rancher, an open -source software platform for teams innovating around containers. By 2016 we had adopted Kubernetes as an orchestrator and had thousands of teams using Rancher to run containers in production. As our community has grown, we haven’t stopped innovating. Rancher 2.0 became the first enterprise-grade platform for delivering Kubernetes as an enterprise service. Projects like k3s and submariner continue to push the Kubernetes community forward. In 2020, Rancher became part of SUSE, a pioneering open source innovator. All along, and especially now, we’ve maintained our commitment to build open-source software that helps users innovate everywhere. The SUSE and Rancher Community brings together accomplished and aspiring cloud native practitioners to quickly and efficiently develop practical cloud native knowledge and skills, to discover and explore new technologies and ideas that inspire us, and to share our passion and expertise with like-minded enthusiasts."
