title = "ESP32-CAM Save Picture in Firebase Storage | Random Nerd Tutorials"
description = "Take and upload a picture to Firebase Storage using the ESP32-CAM. Create a Firebase project with Storage that allows you to store your files, go to the console to visualize the pictures or create a web app to display them"
full_description = '''ESP32-CAM Save Picture in Firebase Storage In this guide, you’ll learn how to take and upload a picture to Firebase Storage using the ESP32-CAM. You’ll create a Firebase project with Storage that allows you to store your files. Then, you can access your Firebase console to visualize the pictures or create a web app to display them (we’ll do this in a future tutorial). The ESP32-CAM will be programmed using Arduino IDE. Updated 19 September 2023. Note: this project is compatible with any ESP32 Camera Board with the OV2640 camera. You just need to make sure you use the right pinout for the board you’re using. What is Firebase? Firebase is Google’s mobile application development platform that helps you build, improve, and grow your app. It has many services used to manage data from any Android, IOS, or web application like authentication, realtime database, hosting, storage, etc. Project Overview This simple tutorial exemplifies how to take and send photos taken with the ESP32-CAM to Firebase Storage. The ESP32-CAM takes a picture and sends it to Firebase every time it resets (press the RST button). The idea is that you add some sort of trigger that might be useful for your projects, like a PIR motion sensor or a pushbutton, for example. When the ESP32 first runs, it takes a new picture and saves it in the filesystem (LittleFS); The ESP32-CAM connects to Firebase as a user with email and password; The ESP32-CAM sends the picture to Firebase Storage; After that, you can go to your Firebase console to view the pictures; Later, you can build a web app that you can access from anywhere to display the ESP32-CAM pictures (we’ll create this in a future tutorial). Contents Here’s a summary of the steps you need to follow to create this project. Create a Firebase Project Set Authentication Methods Create Storage Bucket Get Project API Key ESP32-CAM Send Pictures to Firebase Storage 1) Create a Firebase Project 1) Go to Firebase and sign in using a Google Account. 2) Click Get Started and then Add project to create a new project. 3) Give a name to your project, for example: ESP Firebase Demo. 4) Disable the option Enable Google Analytics for this project as it is not needed and click Create project. 5) It will take a few seconds to set up your project. Then, click Continue when it’s ready. 6) You’ll be redirected to your Project console page. 2) Set Authentication Methods To allow authentication with email and password, first, you need to set authentication methods for your app. “Most apps need to know the identity of a user. In other words, it takes care of logging in and identifying the users (in this case, the ESP32-CAM). Knowing a user’s identity allows an app to securely save user data in the cloud and provide the same personalized experience across all of the user’s devices.” To learn more about the authentication methods, you can read the documentation. 1) On the left sidebar, click on Authentication and then on Get started. 2) Select the Option Email/Password. 3) Enable that authentication method and click Save. 4) The authentication with email and password should now be enabled. 5) Now, you need to add a user. Still on the Authentication tab, select the Users tab at the top. Then, click on Add User. 6) Add an email address for the authorized user. It can be your google account email or any other email. You can also create an email for this specific project. Add a password that will allow you to sign in to your app and access the storage files. Don’t forget to save the password in a safe place because you’ll need it later. When you’re done, click Add user. 7) A new user was successfully created and added to the Users table. Notice that Firebase creates a unique UID for each registered user. The user UID allows us to identify the user and keep track of the user to provide or deny access to the project or the database. There’s also a column that registers the date of the last sign-in. At the moment, it is empty because we haven’t signed in with that user yet. 3) Create Storage Bucket 1) On the left sidebar, click on Storage and then on Get started. 2) Select Start in test mode—click Next. We’ll change the storage rules later on. 3) Select your storage location—it should be the closest to your country. 4) Wait a few seconds while it creates the storage bucket. 5) The storage bucket is now set up. Copy the storage bucket ID because you’ll need it later (copy only the section highlighted with a red rectangle as shown below). Storage Rules We’ll change the storage rules so that only authenticated users can upload files to the storage bucket. Select the Rules tab. Change your database rules. Use the following rules: rules_version = '2'; service firebase.storage { match /b/{bucket}/o { match /{allPaths=**} { allow read, write: if request.auth !=null; } } } When you’re done, click Publish. 4) Get Project API Key To interface with your Firebase project using the ESP32-CAM, you need to get your project API key. Follow the next steps to get your project API key. 1) On the left sidebar, click on Project Settings. 2) Copy the Web API Key to a safe place because you’ll need it later. 5) ESP32-CAM – Send Pictures to Firebase Storage Before proceeding with the tutorial, make sure you check the following prerequisites. Installing the ESP32 add-on We’ll program the ESP32-CAM board using Arduino IDE. So you need the Arduino IDE installed as well as the ESP32 add-on. Follow the next tutorial to install it, if you haven’t already. Installing the ESP32 Board in Arduino IDE (Mac OS X and Linux instructions) Installing ESP Firebase Client Library The Firebase-ESP-Client library provides several examples to interface with Firebase services. It provides an example that shows how to send files to Firebase Storage. Our code we’ll be based on that example. So, you need to make sure you have that library installed. Installation – VS Code + PlatformIO If you’re using VS Code with the PlatformIO extension, click on the PIO Home icon and select the Libraries tab. Search for “Firebase ESP Client “. Select the Firebase Arduino Client Library for ESP8266 and ESP32. Then, click Add to Project and select the project you’re working on. Also, change the monitor speed to 115200 by adding the following line to the platformio.ini file of your project: monitor_speed = 115200 Installation – Arduino IDE If you’re using Arduino IDE, follow the next steps to install the library. Go to Sketch > Include Library > Manage Libraries Search for Firebase ESP Client and install the Firebase Arduino Client Library for ESP8266 and ESP32 by Mobizt. Now, you’re all set to start programming the ESP32-CAM board to send pictures to Firebase Storage. ESP32-CAM Send Pictures to Firebase – Code Copy the following code to your Arduino IDE, or to the main.cpp file if you’re using VS Code. It takes a picture and sends it to Firebase when it first boots. /********* Rui Santos Complete instructions at: https://RandomNerdTutorials.com/esp32-cam-save-picture-firebase-storage/ Permission is hereby granted, free of charge, to any person obtaining a copy of this software and associated documentation files. The above copyright notice and this permission notice shall be included in all copies or substantial portions of the Software. Based on the example provided by the ESP Firebase Client Library *********/ #include "Arduino.h" #include "WiFi.h" #include "esp_camera.h" #include "soc/soc.h" // Disable brownout problems #include "soc/rtc_cntl_reg.h" // Disable brownout problems #include "driver/rtc_io.h" #include <LittleFS.h> #include <FS.h> #include <Firebase_ESP_Client.h> //Provide the token generation process info. #include <addons/TokenHelper.h> //Replace with your network credentials const char* ssid = "REPLACE_WITH_YOUR_SSID"; const char* password = "REPLACE_WITH_YOUR_PASSWORD"; // Insert Firebase project API Key #define API_KEY "REPLACE_WITH_YOUR_FIREBASE_PROJECT_API_KEY" // Insert Authorized Email and Corresponding Password #define USER_EMAIL "REPLACE_WITH_THE_AUTHORIZED_USER_EMAIL" #define USER_PASSWORD "REPLACE_WITH_THE_AUTHORIZED_USER_PASSWORD" // Insert Firebase storage bucket ID e.g bucket-name.appspot.com #define STORAGE_BUCKET_ID "REPLACE_WITH_YOUR_STORAGE_BUCKET_ID" // For example: //#define STORAGE_BUCKET_ID "esp-iot-app.appspot.com" // Photo File Name to save in LittleFS #define FILE_PHOTO_PATH "/photo.jpg" #define BUCKET_PHOTO "/data/photo.jpg" // OV2640 camera module pins (CAMERA_MODEL_AI_THINKER) #define PWDN_GPIO_NUM 32 #define RESET_GPIO_NUM -1 #define XCLK_GPIO_NUM 0 #define SIOD_GPIO_NUM 26 #define SIOC_GPIO_NUM 27 #define Y9_GPIO_NUM 35 #define Y8_GPIO_NUM 34 #define Y7_GPIO_NUM 39 #define Y6_GPIO_NUM 36 #define Y5_GPIO_NUM 21 #define Y4_GPIO_NUM 19 #define Y3_GPIO_NUM 18 #define Y2_GPIO_NUM 5 #define VSYNC_GPIO_NUM 25 #define HREF_GPIO_NUM 23 #define PCLK_GPIO_NUM 22 boolean takeNewPhoto = true; //Define Firebase Data objects FirebaseData fbdo; FirebaseAuth auth; FirebaseConfig configF; void fcsUploadCallback(FCS_UploadStatusInfo info); bool taskCompleted = false; // Capture Photo and Save it to LittleFS void capturePhotoSaveLittleFS( void ) { // Dispose first pictures because of bad quality camera_fb_t* fb = NULL; // Skip first 3 frames (increase/decrease number as needed). for (int i = 0; i < 4; i++) { fb = esp_camera_fb_get(); esp_camera_fb_return(fb); fb = NULL; } // Take a new photo fb = NULL; fb = esp_camera_fb_get(); if(!fb) { Serial.println("Camera capture failed"); delay(1000); ESP.restart(); } // Photo file name Serial.printf("Picture file name: %s\n", FILE_PHOTO_PATH); File file = LittleFS.open(FILE_PHOTO_PATH, FILE_WRITE); // Insert the data in the photo file if (!file) { Serial.println("Failed to open file in writing mode"); } else { file.write(fb->buf, fb->len); // payload (image), payload length Serial.print("The picture has been saved in "); Serial.print(FILE_PHOTO_PATH); Serial.print(" - Size: "); Serial.print(fb->len); Serial.println(" bytes"); } // Close the file file.close(); esp_camera_fb_return(fb); } void initWiFi(){ WiFi.begin(ssid, password); while (WiFi.status() != WL_CONNECTED) { delay(1000); Serial.println("Connecting to WiFi..."); } } void initLittleFS(){ if (!LittleFS.begin(true)) { Serial.println("An Error has occurred while mounting LittleFS"); ESP.restart(); } else { delay(500); Serial.println("LittleFS mounted successfully"); } } void initCamera(){ // OV2640 camera module camera_config_t config; config.ledc_channel = LEDC_CHANNEL_0; config.ledc_timer = LEDC_TIMER_0; config.pin_d0 = Y2_GPIO_NUM; config.pin_d1 = Y3_GPIO_NUM; config.pin_d2 = Y4_GPIO_NUM; config.pin_d3 = Y5_GPIO_NUM; config.pin_d4 = Y6_GPIO_NUM; config.pin_d5 = Y7_GPIO_NUM; config.pin_d6 = Y8_GPIO_NUM; config.pin_d7 = Y9_GPIO_NUM; config.pin_xclk = XCLK_GPIO_NUM; config.pin_pclk = PCLK_GPIO_NUM; config.pin_vsync = VSYNC_GPIO_NUM; config.pin_href = HREF_GPIO_NUM; config.pin_sccb_sda = SIOD_GPIO_NUM; config.pin_sccb_scl = SIOC_GPIO_NUM; config.pin_pwdn = PWDN_GPIO_NUM; config.pin_reset = RESET_GPIO_NUM; config.xclk_freq_hz = 20000000; config.pixel_format = PIXFORMAT_JPEG; config.grab_mode = CAMERA_GRAB_LATEST; if (psramFound()) { config.frame_size = FRAMESIZE_UXGA; config.jpeg_quality = 10; config.fb_count = 1; } else { config.frame_size = FRAMESIZE_SVGA; config.jpeg_quality = 12; config.fb_count = 1; } // Camera init esp_err_t err = esp_camera_init(&config); if (err != ESP_OK) { Serial.printf("Camera init failed with error 0x%x", err); ESP.restart(); } } void setup() { // Serial port for debugging purposes Serial.begin(115200); initWiFi(); initLittleFS(); // Turn-off the 'brownout detector' WRITE_PERI_REG(RTC_CNTL_BROWN_OUT_REG, 0); initCamera(); //Firebase // Assign the api key configF.api_key = API_KEY; //Assign the user sign in credentials auth.user.email = USER_EMAIL; auth.user.password = USER_PASSWORD; //Assign the callback function for the long running token generation task configF.token_status_callback = tokenStatusCallback; //see addons/TokenHelper.h Firebase.begin(&configF, &auth); Firebase.reconnectWiFi(true); } void loop() { if (takeNewPhoto) { capturePhotoSaveLittleFS(); takeNewPhoto = false; } delay(1); if (Firebase.ready() && !taskCompleted){ taskCompleted = true; Serial.print("Uploading picture... "); //MIME type should be valid to avoid the download problem. //The file systems for flash and SD/SDMMC can be changed in FirebaseFS.h. if (Firebase.Storage.upload(&fbdo, STORAGE_BUCKET_ID /* Firebase Storage bucket id */, FILE_PHOTO_PATH /* path to local file */, mem_storage_type_flash /* memory storage type, mem_storage_type_flash and mem_storage_type_sd */, BUCKET_PHOTO /* path of remote file stored in the bucket */, "image/jpeg" /* mime type */,fcsUploadCallback)){ Serial.printf("\nDownload URL: %s\n", fbdo.downloadURL().c_str()); } else{ Serial.println(fbdo.errorReason()); } } } // The Firebase Storage upload callback function void fcsUploadCallback(FCS_UploadStatusInfo info){ if (info.status == firebase_fcs_upload_status_init){ Serial.printf("Uploading file %s (%d) to %s\n", info.localFileName.c_str(), info.fileSize, info.remoteFileName.c_str()); } else if (info.status == firebase_fcs_upload_status_upload) { Serial.printf("Uploaded %d%s, Elapsed time %d ms\n", (int)info.progress, "%", info.elapsedTime); } else if (info.status == firebase_fcs_upload_status_complete) { Serial.println("Upload completed\n"); FileMetaInfo meta = fbdo.metaData(); Serial.printf("Name: %s\n", meta.name.c_str()); Serial.printf("Bucket: %s\n", meta.bucket.c_str()); Serial.printf("contentType: %s\n", meta.contentType.c_str()); Serial.printf("Size: %d\n", meta.size); Serial.printf("Generation: %lu\n", meta.generation); Serial.printf("Metageneration: %lu\n", meta.metageneration); Serial.printf("ETag: %s\n", meta.etag.c_str()); Serial.printf("CRC32: %s\n", meta.crc32.c_str()); Serial.printf("Tokens: %s\n", meta.downloadTokens.c_str()); Serial.printf("Download URL: %s\n\n", fbdo.downloadURL().c_str()); } else if (info.status == firebase_fcs_upload_status_error){ Serial.printf("Upload failed, %s\n", info.errorMsg.c_str()); } } View raw code You need to insert your network credentials, storage bucket ID, and project API key for the project to work. This sketch was based on a basic example provided by the library. You can find more examples here. How the Code Works Continue reading to learn how the code works or skip to the demonstration section. Libraries First, include the required libraries. #include "WiFi.h" #include "esp_camera.h" #include "Arduino.h" #include "soc/soc.h" // Disable brownout problems #include "soc/rtc_cntl_reg.h" // Disable brownout problems #include "driver/rtc_io.h" #include <LittleFS.h> #include <FS.h> #include <Firebase_ESP_Client.h> //Provide the token generation process info. #include <addons/TokenHelper.h> Network Credentials Insert your network credentials in the following variables so that the ESP can connect to the internet and communicate with Firebase. //Repla'''
