title = "ESP32-CAM HTTP Post Images/Photos to Server | Random Nerd Tutorials"
description = "Make HTTP POST requests using the ESP32-CAM board with Arduino IDE to send photos to a local Raspberry Pi or cloud server. We'll use PHP to view and the delete the photos"
full_description = '''ESP32-CAM Post Images to Local or Cloud Server using PHP (Photo Manager) Learn how to make HTTP POST requests using the ESP32-CAM board with Arduino IDE to send photos to a server. We’ll show how to post a JPG/JPEG image to a local server (Raspberry Pi LAMP server) or to a cloud server (that you can access from anywhere). The photos will be displayed in a gallery where you can view or delete the photos. To save the images in the server and create the gallery, we’ll use PHP scripts. Updated on 27 March 2023 To build this project, you need to follow the next steps. Follow the LAMP Server or the Hosting Server instructions depending on if you want to access the photos locally or from anywhere. Hosting your PHP Application Raspberry Pi LAMP Server (local access) Hosting Server (access from anywhere) PHP scripts to save and display photos in the server Raspberry Pi LAMP Server (local access) Hosting Server (access from anywhere) Program the ESP32-CAM with Arduino IDE Testing and Final Demonstration 1. Hosting Your PHP Application The goal of this project is to have a local or cloud server to store and access your ESP32-CAM photos. 1. Raspberry Pi local server: With a Raspberry Pi LAMP server, you can access your images locally (as illustrated below). You can run a LAMP (Linux, Apache, MySQL, PHP) server on a Raspberry Pi to access data in your local network. Raspberry Pi LAMP Server: Local Linux server that you use to access your images locally. Setup Local RPi LAMP Server » 2. Cloud server (Bluehost hosting solution) You also can visualize the ESP32-CAM photos from anywhere in the world by accessing your own server + domain. Here’s a high level overview on how it works: Bluehost (user-friendly with cPanel): free domain name when you sign up for the 3-year plan. I recommend choosing the unlimited websites option; Note that any hosting service that offers PHP will work with this tutorial. If you don’t have a hosting account, I recommend signing up for Bluehost. Get Hosting and Domain Name with Bluehost » When buying a hosting account, you’ll also have to purchase a domain name. This is what makes this project interesting: you’ll be able to go your domain name (http://example.com) and see your ESP32-CAM photos. If you like our projects, you might consider signing up to Bluehost, because you’ll be supporting our work. HTTP POST Request Method The Hypertext Transfer Protocol (HTTP) works as a request-response protocol between a client and server. Here’s an example: The ESP32 (client) submits an HTTP request to a Server (for example: local RPi Lamp Server or example.com); The server returns a response to the ESP32 (client); HTTP POST is used to send data to a server to create/update a resource. For example, publish an image to a server. POST /upload.php HTTP/1.1 Host: example.com Content-Type: image/jpeg 2.1. Preparing Your .php Files and uploads Folder (Raspberry Pi LAMP Server) This section prepares your .php files and uploads folder for your Raspberry Pi LAMP Server. If you’re using your own server + domain name, skip to the next section. Having a Raspberry Pi running Apache and PHP, in the Raspberry Pi board terminal window navigate to the /var/www/html/ directory: pi@raspberrypi:~ $ cd /var/www/html/ Create a new folder called uploads: pi@raspberrypi:/var/www/html $ mkdir uploads pi@raspberrypi:/var/www/html $ ls uploads At the moment, /var/www/html is owned by root, use the next commands to change to the pi user and give it all permissions so that you can save photos using a PHP script later on. sudo chown -R pi:pi /var/www/html chmod -R 777 /var/www/html/ Finally, create a new upload.php file: pi@raspberrypi:/var/www/html $ nano upload.php This PHP script is responsible for receiving incoming images from the ESP32-CAM, rename the images with a timestamp and store them in the uploads folder. Edit the newly created file (upload.php) and copy the following snippet: <?php // Rui Santos // Complete project details at https://RandomNerdTutorials.com/esp32-cam-post-image-photo-server/ // Code Based on this example: w3schools.com/php/php_file_upload.asp $target_dir = "uploads/"; $datum = mktime(date('H')+0, date('i'), date('s'), date('m'), date('d'), date('y')); $target_file = $target_dir . date('Y.m.d_H:i:s_', $datum) . basename($_FILES["imageFile"]["name"]); $uploadOk = 1; $imageFileType = strtolower(pathinfo($target_file,PATHINFO_EXTENSION)); // Check if image file is a actual image or fake image if(isset($_POST["submit"])) { $check = getimagesize($_FILES["imageFile"]["tmp_name"]); if($check !== false) { echo "File is an image - " . $check["mime"] . "."; $uploadOk = 1; } else { echo "File is not an image."; $uploadOk = 0; } } // Check if file already exists if (file_exists($target_file)) { echo "Sorry, file already exists."; $uploadOk = 0; } // Check file size if ($_FILES["imageFile"]["size"] > 500000) { echo "Sorry, your file is too large."; $uploadOk = 0; } // Allow certain file formats if($imageFileType != "jpg" && $imageFileType != "png" && $imageFileType != "jpeg" && $imageFileType != "gif" ) { echo "Sorry, only JPG, JPEG, PNG & GIF files are allowed."; $uploadOk = 0; } // Check if $uploadOk is set to 0 by an error if ($uploadOk == 0) { echo "Sorry, your file was not uploaded."; // if everything is ok, try to upload file } else { if (move_uploaded_file($_FILES["imageFile"]["tmp_name"], $target_file)) { echo "The file ". basename( $_FILES["imageFile"]["name"]). " has been uploaded."; } else { echo "Sorry, there was an error uploading your file."; } } ?> View raw code Your upload.php file should look like this. Save your file and exit (Ctrl+X, Y, and Enter key): Then, create a new gallery.php file: pi@raspberrypi:/var/www/html $ nano gallery.php Edit the newly created file (gallery.php) and copy the following snippet: <!-- Rui Santos Complete project details at https://RandomNerdTutorials.com/esp32-cam-post-image-photo-server/ Permission is hereby granted, free of charge, to any person obtaining a copy of this software and associated documentation files. The above copyright notice and this permission notice shall be included in all copies or substantial portions of the Software. --> <!DOCTYPE html> <html> <head> <title>ESP32-CAM Photo Gallery</title> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <style> .flex-container { display: flex; flex-wrap: wrap; } .flex-container > div { text-align: center; margin: 10px; } </style> </head><body> <h2>ESP32-CAM Photo Gallery</h2> <?php // Image extensions $image_extensions = array("png","jpg","jpeg","gif"); // Check delete HTTP GET request - remove images if(isset($_GET["delete"])){ $imageFileType = strtolower(pathinfo($_GET["delete"],PATHINFO_EXTENSION)); if (file_exists($_GET["delete"]) && ($imageFileType == "jpg" || $imageFileType == "png" || $imageFileType == "jpeg") ) { echo "File found and deleted: " . $_GET["delete"]; unlink($_GET["delete"]); } else { echo 'File not found - <a href="gallery.php">refresh</a>'; } } // Target directory $dir = 'uploads/'; if (is_dir($dir)){ echo '<div class="flex-container">'; $count = 1; $files = scandir($dir); rsort($files); foreach ($files as $file) { if ($file != '.' && $file != '..') {?> <div> <p><a href="gallery.php?delete=<?php echo $dir . $file; ?>">Delete file</a> - <?php echo $file; ?></p> <a href="<?php echo $dir . $file; ?>"> <img src="<?php echo $dir . $file; ?>" style="width: 350px;" alt="" title=""/> </a> </div> <?php $count++; } } } if($count==1) { echo "<p>No images found</p>"; } ?> </div> </body> </html> View raw code This PHP script is responsible for displaying the images on the gallery. Your gallery.php file should look like this. Save your file and exit (Ctrl+X, Y, and Enter key): 2.2. Preparing Your .php Files and uploads Folder (Hosting Service) If you prefer to run your server remotely and access the photos from anywhere, you need a hosting account. After signing up for a hosting account and setting up a domain name, you can login to your cPanel or similar dashboard. After that, open the File Manager. Open the “Advanced” tab and select “File Manager“: Then, select the public_html option. Press the “+ File” button to create a new upload.php file and a new gallery.php file. Then, click the “+Folder” button to create the Uploads folder. With the three items created, edit the upload.php file: This PHP script is responsible for receiving incoming images from the ESP32-CAM, rename the images with a timestamp and store them in the uploads folder. Edit the newly created file (upload.php) and copy the following snippet: <?php // Rui Santos // Complete project details at https://RandomNerdTutorials.com/esp32-cam-post-image-photo-server/ // Code Based on this example: w3schools.com/php/php_file_upload.asp $target_dir = "uploads/"; $datum = mktime(date('H')+0, date('i'), date('s'), date('m'), date('d'), date('y')); $target_file = $target_dir . date('Y.m.d_H:i:s_', $datum) . basename($_FILES["imageFile"]["name"]); $uploadOk = 1; $imageFileType = strtolower(pathinfo($target_file,PATHINFO_EXTENSION)); // Check if image file is a actual image or fake image if(isset($_POST["submit"])) { $check = getimagesize($_FILES["imageFile"]["tmp_name"]); if($check !== false) { echo "File is an image - " . $check["mime"] . "."; $uploadOk = 1; } else { echo "File is not an image."; $uploadOk = 0; } } // Check if file already exists if (file_exists($target_file)) { echo "Sorry, file already exists."; $uploadOk = 0; } // Check file size if ($_FILES["imageFile"]["size"] > 500000) { echo "Sorry, your file is too large."; $uploadOk = 0; } // Allow certain file formats if($imageFileType != "jpg" && $imageFileType != "png" && $imageFileType != "jpeg" && $imageFileType != "gif" ) { echo "Sorry, only JPG, JPEG, PNG & GIF files are allowed."; $uploadOk = 0; } // Check if $uploadOk is set to 0 by an error if ($uploadOk == 0) { echo "Sorry, your file was not uploaded."; // if everything is ok, try to upload file } else { if (move_uploaded_file($_FILES["imageFile"]["tmp_name"], $target_file)) { echo "The file ". basename( $_FILES["imageFile"]["name"]). " has been uploaded."; } else { echo "Sorry, there was an error uploading your file."; } } ?> View raw code Save your file and exit. Then, edit the gallery.php file and copy the following snippet. This is responsible for displaying the images in the gallery. <!-- Rui Santos Complete project details at https://RandomNerdTutorials.com/esp32-cam-post-image-photo-server/ Permission is hereby granted, free of charge, to any person obtaining a copy of this software and associated documentation files. The above copyright notice and this permission notice shall be included in all copies or substantial portions of the Software. --> <!DOCTYPE html> <html> <head> <title>ESP32-CAM Photo Gallery</title> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <style> .flex-container { display: flex; flex-wrap: wrap; } .flex-container > div { text-align: center; margin: 10px; } </style> </head><body> <h2>ESP32-CAM Photo Gallery</h2> <?php // Image extensions $image_extensions = array("png","jpg","jpeg","gif"); // Check delete HTTP GET request - remove images if(isset($_GET["delete"])){ $imageFileType = strtolower(pathinfo($_GET["delete"],PATHINFO_EXTENSION)); if (file_exists($_GET["delete"]) && ($imageFileType == "jpg" || $imageFileType == "png" || $imageFileType == "jpeg") ) { echo "File found and deleted: " . $_GET["delete"]; unlink($_GET["delete"]); } else { echo 'File not found - <a href="gallery.php">refresh</a>'; } } // Target directory $dir = 'uploads/'; if (is_dir($dir)){ echo '<div class="flex-container">'; $count = 1; $files = scandir($dir); rsort($files); foreach ($files as $file) { if ($file != '.' && $file != '..') {?> <div> <p><a href="gallery.php?delete=<?php echo $dir . $file; ?>">Delete file</a> - <?php echo $file; ?></p> <a href="<?php echo $dir . $file; ?>"> <img src="<?php echo $dir . $file; ?>" style="width: 350px;" alt="" title=""/> </a> </div> <?php $count++; } } } if($count==1) { echo "<p>No images found</p>"; } ?> </div> </body> </html> View raw code Save your file and exit. That’s it! Your server is ready. 3. ESP32-CAM HTTP Post Images/Photos to Server Now that you have your server ready (Raspberry Pi LAMP server or cloud server), it’s time to prepare the ESP32-CAM with the code to publish a new image to your server every 30 seconds. Before proceeding with this tutorial, make sure you complete the following prerequisites. Parts Required To follow this tutorial you need the following components: ESP32-CAM with OV2640 – read Best ESP32-CAM Dev Boards FTDI programmer Female-to-female jumper wires 5V power supply for ESP32-CAM Local server: Raspberry Pi Board – read Best Raspberry Pi Starter Kits MicroSD Card – 32GB Class10 Raspberry Pi Power Supply (5V 2.5A) Cloud server (alternative): Bluehost You can use the preceding links or go directly to MakerAdvisor.com/tools to find all the parts for your projects at the best price! Arduino IDE We’ll program the ESP32-CAM using Arduino IDE, so make sure you have the ESP32 add-on installed. Installing the ESP32 Board in Arduino IDE (Windows, Mac OS X, Linux) Check the PHP URL You should try to open the Raspberry Pi local IP address or your external example.com domain name, followed by /upload.php that should return: Sorry, only JPG, JPEG, PNG & GIF files are allowed.Sorry, your file was not uploaded. If you see that message save your URL/domain name and path, your server should be ready and you can continue with this guide. Additionally, try to access the /gallery.php path. You should get something as shown below: ESP32-CAM Code If you’re using a local server without TLS/SSL, or a cloud server that doesn’t support HTTPS, use the HTTP POST Request Code. If you’re using a cloud server that requires HTTPS requests, use this code instead: HTTPS POST Request Code. ESP32-CAM HTTP POST Request The next sketch posts the image to a server using HTTP POST. Copy the code below to your Arduino IDE. /* Rui Santos Complete project details at https://RandomNerdTutorials.com/esp32-cam-post-image-photo-server/ Permission is hereby granted, free of charge, to any person obtaining a copy of this software and associated documentation files. The above copyright notice and this permission notice shall be included in all copies or substantial portions of the Software. */ #include <Arduino.h> #include <WiFi.h> #include "soc/soc.h" #include "soc/rtc_cntl_reg.h" #include "esp_camera.h" const char* ssid = "REPLACE_WITH_YOUR_SSID"; const char* password = "REPLACE_WITH_YOUR_PASSWORD"; String serverName = "192.168.1.XXX"; // REPLACE WITH YOUR Raspberry Pi IP ADDRESS //String serverName = "example.com"; // OR REPLACE WITH YOUR DOMAIN NAME String serverPath = "/upload.php"; // The default serverPath should be upload.php const int serverPort = 80; WiFiClient client; // CAMERA_MODEL_AI_THINKER #define PWDN_GPIO_NUM 32 #define RESET_GPIO_NUM -1 #define XCLK_G'''
