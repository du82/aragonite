title = "Android App Arduino MIT App Inventor | Random Nerd Tutorials"
description = "Android Apps for Arduino with MIT App Inventor 2 is a step-by-step course to get you building cool Android apps for Arduino even with no prior experience"
full_description = "Android Apps for Arduino with MIT App Inventor 2 My step-by-step course to get you building cool Androidapplications for Arduino, even with no prior experience! GET ALL 8 PROJECTS What’s included in the course? Android Apps for Arduino with MIT App Inventor 2 is a practical course in which you’re going to build 8 Android applications to interact with the Arduino. Each project contains: Step-by-step instructions for building the app design and logic Downloadable code and schematics .aia files (files that you can upload to the MIT App Inventor 2 software to edit the app) .apk files (files that you can move to your smartphone for quickly running the app) What are you going to build? The next video shows a quick overview of the course and live demonstrations of the apps you’re going to build. Introduction The introduction shows you an overview of MIT APP Inventor 2, so that you get familiar with the software you’re going to use to build the apps. Project #1: LED Controller (Bluetooth) In this project you’re going to create an Android app that turns an LED on and off. You’ll learn how to: Make a simple design with buttons, listpicker, images and labels Build the blocks that send information to the Arduino to turn an LED on and off Program the Arduino to receive the information from the app Test your app in real time while building it Project #2: Login Protected LED Controller (Bluetooth) This project is a continuation of Project 1 with an additional feature. The LED controller screen is password protected. To control the LED, you must enter a valid username and password. You’ll learn how to: Add a password and textbox field to your app design Build apps with multiple screens Switch between the app’s screens Project #3: LED Slider (Bluetooth) This project shows you how to build a slider that controls the LED brightness. Your app also has an LED image that changes color while you move the slider. In this project you’ll learn how to: Add a slider to your app design Read the slider values and send them to the Arduino Project #4: RGB LED Controller (Bluetooth) In this project you’re going to control the color of an RGB LED using a color picker picker – you’ll build the color picker to set the color. You’ll learn how to: Build a color picker for you app Deal with colors: get colors from pixels and split colors into RGB LED parameters Use RGB LEDs with Arduino Project #5: Temperature Readings (Bluetooth) In this project you’re going to read the temperature with the DS18B20 temperature sensor and display the values on the app. You’ll learn how to: Read temperature with DS18B20 Send the temperature readings from the Arduino to the Android app Display updated temperature readings in Celsius or Fahrenheit Project #6: Relay Controller (Bluetooth) In this project you’re going to build an Android app that controls a lamp connected to a relay using three different methods: with ON and OFF buttons, with voice commands and by shaking your smartphone. You’ll learn how to: Send voice commands Recognize voice commands and send the information to the Arduino Trigger an event when you shake your smartphone Use the relay module with Arduino Note: we provide the LED version of this project, if you’re not comfortable dealing with relays. Project #7: Send Messages to LCD display (Bluetooth) In this project you’re going to build an Android app that allows you to write messages and send them to the Arduino to be displayed on an LCD. You’ll learn how to: Add a textbox to your design to ask for user input Send text string messages to the Arduino Display text on the LCD Project #8: Remote Controlled Robot (Bluetooth) In this project you’re going to build a bluetooth remote controlled robot. We’ll also show you how to assemble the robot car chassis kit. Your app will have five controls: forward, reverse, left, right and stop. You’ll learn how to: Assemble a robot Control 2 DC motors via bluetooth Send different commands for each robot control Who is this for? I believe this course is perfect for anyone that loves electronics, open-source hardware and software, and of course Android and Arduino board. If you’re a beginner don’t worry, you’ll start from the very beginning and you’ll learn everything you need to know to complete all projects presented. 2 FREE AMAZING BONUS BONUS PROJECT #9: Control ESP8266 Outputs (WiFi) – VALUE: $5 FREE This is an extra project to show you how to build an Android app to control the ESP8266 outputs. We’ll start with an introduction to the ESP8266 WiFi module, followed by a blinking an LED project to get you familiar with the ESP8266. Then, we’ll build an Android app to control two LEDS connected to the ESP8266. EBOOK: Arduino For Beginners – VALUE: $10 FREE If this is your first contact with Arduino, it’s ok. With this course, we provide the “Arduino For Beginners” eBook which is a guide for absolute beginners. If you are already familiar with the Arduino you can also follow the Arduino for Beginners eBook, or go directly to the projects, it’s up to you. Get the Complete Course(8 Android Applications + 1 ESP8266 Project) 8 Android Applications for Arduino with step-by-step instructions 1 Android Application For ESP8266 (VALUE: $5 FREE) Arduino For Beginners eBook (VALUE: $10 FREE) Source code (.aia, .apk and .ino files) Schematics Unlimited updates Exclusive access to the Private Facebook group where you can ask me for help and interact with other members GET ALL PROJECTS | $19 Click here to get the eBook | $19 Backed by a 60 day 100% money-back guarantee If you don’t like the course, I don’t want your money. Seriously, that’s why I offer a 60 days money back guarantee. Email me here and I will promptly refund all your money. No questions, no hassles – it’s that simple. Frequently Asked Questions Do I get free future updates? Yes, I often update all my courses, so everyone who purchases gets free lifetime updates. You’ll also have access to future content that we’ll be adding to the course. What if I don’t like it? Well, if you don’t like it, I don’t want your money. Seriously, that’s why I offer a 60 days money back guarantee. Email me here and I will promptly refund all your money. No questions, no hassles – it’s that simple! Have a question? If you still have questions after reading this page please email me here. I’ll do my best to answer your questions. Who is this course for? This course is perfect if for:Beginners – If you’re just starting using this board, this course is perfect for you, because I’ll start from the very beginning and you’ll learn everything you need to knowMakers/DIYers – If you love making things, this course is perfect for you. You’ll design several circuits and projectsHobbyists – If this is your hobby and you like to make projects in the weekends or late at night, this course is perfect for you. It has everything you need to know, so you don’t spend a ton of time looking for the right information in the wrong places See what others are saying"
