title = "About Random Nerd Tutorials | Random Nerd Tutorials"
description = "Random Nerd tutorials aims to be a free blog that provides content that will help you with your projects."
full_description = "Hi, Welcome to Random Nerd Tutorials! Random Nerd Tutorials helps makers, hobbyists, and engineers build electronics projects. Since establishing in 2013, Random Nerd Tutorials has become a trusted place to learn electronics and programming online. RNT has more than 600 free tutorials published online that anyone can follow. We periodically publish project tutorials and guides related with: ESP32, ESP8266, Arduino, Raspberry Pi, Home Automation and Internet of Things! We document our projects step-by-step and provide all the resources so that you can replicate the project yourself, even if you are a beginner. We have several courses that will help you get started with electronics. Whether you want to learn ESP32, ESP8266, Arduino, or Home Automation, you are in the right place. For more information about our courses check our products’ page here. Subscribe to Our Newsletter and Get Our Free Resources To stay updated with our newest projects and tutorials, make sure you subscribe to our newsletter. We share a new project or tutorial every week. When you subscribe to our newsletter you get access to our exclusive free resources: 4 eBooks and 1 mini-video course. Enter your email below to get your free resources. Stay updated by subscribing to our weekly newsletter! SUBSCRIBE Who Runs Random Nerd Tutorials? Behind Random Nerd Tutorials is Rui Santos and Sara Santos. We both live in Porto, Portugal, and we have known each other since 2009. Keep reading to learn more about us. Hi! I’m Rui Santos, the founder of the Random Nerd Tutorials blog. I have a master’s degree in Electrical and Computer Engineering from FEUP. I’m the author of “BeagleBone For Dummies”, and Technical reviewer of the book “Raspberry Pi For Kids For Dummies”. I recently wrote a book with Sara Santos for the NoStarchPress publisher about projects with the Raspberry Pi: “20 Easy Raspberry Pi Projects: Toys, Tools, Gadgets, and More!“ If you want to know how I started the Random Nerd Tutorials blog, read the “How RNT Started?” section below. Hi! I’m Sara Santos! I started working at Random Nerd Tutorials back in 2015 as a hobby: I helped Rui with some simple tasks when he had a lot of work to do. Back then, I knew nothing about electronics, programming, Arduino, etc… Over time I started learning everything I could about those subjects and I just loved it! At first, I helped Rui once a week on Saturdays, but then, I started working on the RNT blog alongside him, almost every day! In 2016 I finished my Master’s degree in Bioengineering from FEUP, and at the end of 2016, I started working in a Water Treatment Company. At the same time, Rui and I accepted an invitation from NoStarchPress to write a book about Raspberry Pi (so, I had a lot of work to do). In August 2017, I decided to quit my job to dedicate myself 100% to the Random Nerd Tutorials blog. Currently, I work full-time at Random Nerd Tutorials as a Content Editor and I love what I do! How RNT Started? Rui Santos started the Random Nerd Tutorials blog in 2013 to share his Arduino electronics projects. Back then, he was studying Electrical and Computer Engineering, and a friend told him about the Arduino board. He was amazed with what his friend said about the board, and immediately ordered an Arduino starter kit to experiment. Then, he thought it would be a good idea to create a blog to share his Arduino projects with others and give them instructions on how to replicate the projects themselves. At that time, there wasn’t much information about the Arduino, and his blog posts started receiving a considerable amount of views and good feedback. This encouraged him to keep posting new projects and tutorials. Over time, he added content not only about Arduino, but also about other subjects like Raspberry Pi, ESP8266, Node-RED, ESP32,and Home Automation. Today, Random Nerd Tutorials has more than 600 free blog posts, videos, and courses that anyone can follow to start making their own electronics projects. Random Nerd Tutorials has been featured in… Random Nerd Tutorials is a community with more than 100,000 followers! You can also be part of the Random Nerd Tutorials community by subscribing to our blog. New content is published every week. When you subscribe to our blog you have access to our free resources. If you’re curious and want to learn more about the progress of our blog over time, you can check our yearly recaps that we started writing back in 2017. At the end of each year, we publish a summary of what happened throughout that year on our blog, interesting facts, and new milestones for the upcoming year. You can read the following articles to learn more about what happened over the years: Year in Review 2024 Year in Review 2023 Year in Review 2022 Year in Review 2021 Year in Review 2020 Year in Review 2019 Year in Review 2018 Year in Review 2017 Our Work We cover a wide variety of subjects related to electronics and programming. If you want to start your learning journey with us, check out our resources below: ESP32 and ESP32-CAM Learn ESP32 with Arduino IDE (eBook) SMART HOME with Raspberry Pi, ESP32, and ESP8266 (eBook) Learn LVGL: Build GUIs for ESP32 Projects (eBook) Build Web Servers with ESP32 and ESP8266 (eBook) Firebase Web App with the ESP32 and ESP8266 (eBook) Build ESP32-CAM Projects using Arduino IDE (eBook) ESP32 tutorials and projects ESP32-CAM tutorials and projects ESP8266 NodeMCU Home Automation Using ESP8266 (eBook) Build Web Servers with ESP32 and ESP8266 (eBook) Firebase Web App with the ESP32 and ESP8266 (eBook) ESP8266 tutorials and projects MicroPython with ESP32/ESP8266 MicroPython Programming with ESP32 and ESP8266 (eBook) MicroPython ESP32/ESP8266 tutorials and projects Home Automation and IoT SMART HOME with Raspberry Pi, ESP32, and ESP8266 (eBook) Home Automation Platform – Home Automation Server (it’s no longer maintained) Home Automation and IoT projects and tutorials Arduino Arduino Step-by-step Projects – Build 25 projects (eBook) Android Apps For Arduino with MIT App Inventor (eBook) Free Arduino Mini Course Arduino blog posts and projects Raspberry Pi and Raspberry Pi Pico SMART HOME with Raspberry Pi, ESP32, and ESP8266 (eBook) Learn Raspberry Pi Pico/Pico W with MicroPython (eBook) 20 Easy Raspberry Pi Projects: Toys, Tools, Gadgets, and More! (No Starch Press – book) Raspberry Pi tutorials and projects Raspberry Pi Pico tutorials and projects BeagleBone BeagleBone For Dummies (Wiley Inc. – book) Blog post series – Getting Started with the BeagleBone Black Maker Advisor We launched Maker Advisor website in October 2017. Why did we create Maker Advisor? We noticed that our followers often had trouble finding where to buy the parts, and where to find the best price. So, we created a page called Maker Advisor Tools to help electronics hobbyists and makers find the best tools at the best price. We also post buying guides, as well as reviews on tools, gadgets and development boards that we think you may like. At the moment, all Random Nerd Tutorials projects contain links to the Maker Advisor price comparison pages, so that you know exactly where to get your parts from. By getting your parts using our affiliate links you are supporting our work. How to Support Our Work? There are several ways in which you can support our work: Enroll in one of our premium eBooks and courses. You can check all our products here; Buy our book: 20 Easy Raspberry Pi Projects: Toys, Tools, Gadgets, and More! (Rui Santos and Sara Santos); You can visit Maker Advisor to read our product recommendations; Buy us a coffee: paypal.com/paypalme/RandomNerdTutorials; Become a Random Nerd Tutorials follower – it’s free. You can subscribe here our newsletter and get access to free resources; Subscribe to our YouTube channel. How to Connect with Us? 1. Do you have technical questions related to a specific blog post or tutorial? If you have any questions relating to a specific project, you can write a comment on the project page. We’ll make an effort to answer your questions. However, please note that due to the great number of comments we receive every day, we cannot assure you’ll have an immediate answer. We don’t write custom code for you. We can’t write entire programs for you. We receive many emails per day requesting complete tutorials. There’s not enough time in the day to do that. We make an effort to make our code as general and documented as possible so that you can easily modify the code yourself. However, if you have any questions feel free to ask by leaving a comment on the project page. We may give you quick tips on how to modify your code or redirect you to a specific project tutorial. 2. Are you having trouble with your purchase? If you’re having any trouble with your purchase, you can contact us by sending a message using our support page. 3. Do you have any questions regarding our courses? If you have any questions regarding our courses, contact us by sending a message using our support page. 4. Do you have suggestions for a specific project? If you have ideas for a new project, you can send us a message using our contact page. Please note that we don’t make custom projects! 5. Would you like to write a project for us? If you’ve built a project and you’d like to document it and post it on our blog, write us using our contact page. If the project is good, well-documented, and related to our blog, we’d love to publish it and share it with our audience. 6. Partnerships and collaborations For partnerships and collaborations, use our contact page. Stay Tuned – Follow Us Stay tuned by following us on: YouTube Facebook Twitter Instagram Pinterest Our Travel Blog – Tripiwi We are both passionate about traveling, and we try to travel as much as we can. We put a lot of work into researching and planning each journey so that we can make the most of our trips. We believe that our work can be valuable for others so we created a new blog where we share practical travel guides, tips, and itineraries based on our personal adventures. Check out our new blog on the link below: Tripiwi Travel Blog You may also follow our travel adventures on social media: Instagram TikTok Youtube Thanks so much for reading our story. Good luck with your projects, Rui Santos and Sara Santos"
