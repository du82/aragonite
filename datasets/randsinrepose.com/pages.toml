title = "Act Last, Read the Room, and Taste the Soup – Rands in Repose"
description = """
The quiet is my favorite attribute of a holiday break. My various Slacks are quiet, the house is quiet, and while it takes three days of quiet, eventually my head is quiet.

Quiet creates reflection. I replay the critical parts of recent life and rather than living them, I observe them… at a distanc"""
full_description = "Management An idea doesn’t get better with agreement Act Last, Read the Room, and Taste the Soup The quiet is my favorite attribute of a holiday break. My various Slacks are quiet, the house is quiet, and while it takes three days of quiet, eventually my head is quiet. Quiet creates reflection. I replay the critical parts of recent life and rather than living them, I observe them… at a distance. This often allows me to find the lessons rather than react to the situation. This holiday break I found three lessons and they are lessons I wish I knew a long time ago: 1. Act last. In poker, a full table is ten players, and the betting starts to the left of the button which is a round plastic thing that sits in front of one player and rotates clockwise with each subsequent hand. The button, the last player to bet, is the prime position because you get to see how every other player at the table is indicating they are going to play this hand. You have the most information for which to make a betting decision. Oddly, at work, you will find yourself in precisely the same situation. You’ll be sitting in a meeting where folks are going around the table and giving their opinion about this important topic and for a great many situations when it’s your turn to offer your opinion; the correct move is to pass. Information builds context and context is the circumstance that forms the setting for an idea so that it can be understood. The more folks go around the table and weigh in on what they think about the idea, the more context you have, so the better you can shape your opinion before you share it. Extroverted humans love to own the energy of a live conversation which means they’ll likely play their cards right out of the gate. Unlike poker, this is often the right move to land a new idea. It’s called “first mover advantage,” and for the human who wants to define the narrative by landing their compelling idea first, it’s solid opening play. Thing is… acting early might set tone, but it doesn’t make an idea sound. An idea doesn’t get better with agreement; it gets better with debate. It gets better when a diverse set of human have a chance to stare at it and share their unique, informed perspective. So, the question is, “When to act first or act last?” It’s a fair question which is why you need to… 2. Read the room. My opening move in any presentation is to read the room. The slippery question I am answering for myself is, “What mood is this particular set of humans in?” Impossible to answer, right? What is the aggregate happiness or sadness of a group of 500 humans? How are they feeling? And why does it matter? The reason you care about the ambient mood of a group of humans is you have business with the folks. You have a talk to deliver; you have 1:1 to complete, or you have an urgent topic to discuss at a cross-functional meeting. Their collective mood is critical signal on your approach path for getting your work done, and the sooner you have tested the mood, the sooner you have your approach vector. My opening moves for reading the room: For a talk, I almost always open with an audience participation exercise. Raise your hands. How many extroverts? How many introverts? Why do care about the split of perceived personality types? What I care about is how many folks willingly raise their hand. 500 people and only a 100 raise their hands to identify as extrovert or introvert? Ok, this particular crowd has it’s guard up. No clue why, but it means they are holding me at arm’s reach so I will do extra work to connect by explaining my background and my goals for the talk to make myself familiar. For a 1:1, I do what I wrote about here. I ask “How are you?” As I wrote, I am carefully listening to your answer: What’s the first thing they say? Do they deflect with humor? Is it the standard off-the-cuff answer? Or is it different? How is it different? What words did they choose and how quickly are they saying them? How long did they wait to answer? Did they even answer the question? Do you understand the answer isn’t the point, either? The content is merely a delivery vehicle for the mood, and the mood sets your agenda. Finally, for a meeting, and to make it harder, let’s say it’s a meeting I am not running, but have a role as a participant. Not being able to land the first question and set tone makes the initial read harder, but all the signal is still in the room. Who is running the meeting? How do they open it? Who perks up? Who keeps their nose buried in their phone? As topic changes, how does the demeanor of the different meeting denizens change? What is every single thing I know about that them and how might that context inform their changes of mood depending on topic?1 Reading the room is the specialty of introverts because we are comforted by the act of gathering of context. This context gives us the impression we have a map for how this particular meeting might go, but where introverts can fail is when all we do is listen, all we do is build more context, and we don’t… 3. Taste the Soup. What do we hate about micromanagers? I’ll tell you what I hate. I hate the leaders who believe that prescribing every single action without room for improvisation, iteration, or feedback is anything but demeaning and demoralizing. If I screwed up, if I failed on something critical because I failed to listen to your guidance then sure… dictator it up. Until we arrive at that failure case, I don’t need to be told what to do; I need you to taste the soup. In your career, you’ve had a lot of soup. You’ve had tomato, chicken noodle, potato leek, and countless others. More importantly, you’ve had different variations of each soup. Big huge noodle chicken noodle. Some amazing type of cream on that tomato soup. This soup journey has taught you a lot about soup. Now, when presented with a new bowl of soup, the moment that counts is the first taste. You taste a bit and wonder, “What is going on with this soup?” In a meeting where an individual or team is presenting a complex idea or project, my job as the leader is soup tasting. It’s sampling critical parts of the idea to get a sense of how this soup has been or will be made. Who are the critical people? What are the critical parts? Which decisions matter? I don’t know. I do believe that a pre-requisite for leadership is that you have experience. You’ve had trials which have resulted in both impressive successes and majestic failures. These aggregate lessons define your metaphoric soup tasting ability, and when your team brings you a topic to review, it is this experience you apply to ask the critical soup questions. Leaders who default to micromanagement teach you nothing about the craft of building. Their tell-assertive style creates an unsafe environment where some of the best parts of being human, our inspiration and our creativity, cannot exist. Tasting soup, asking small, but critical questions based on legitimate experience, creates an environment of helpful and instructive curiosity. Why do you choose this design? What is this metric going to tell us? What do you think the user is thinking at this moment? The opposite of quiet is noisy, and business is noisy. It’s full of humans acting first, ignoring the room, and tasting none of the soup… and being annoying successful with each of these acts. Like all advice you ever received, mine is situationally useful, but based on what I value as a leader. Let others share their thoughts. You never know when a great idea will appear. Understand that as a leader, your team is going to be less likely to contradict your idea which is another good reason to act last. Understand that everyone is busy having their life and they are often bringing that life to the conference, the 1:1, or the meeting. Their life might not always cleanly fit neatly into business and your job as a leader to read the room to understand what they need. Demonstrate respect to the team by asking great questions. Be curious. Your experience has taught your lessons, and your questions often share lessons better than your lectures. Plus, you never know what kind of soup you’ll discover. And have a great new year. Exhausting right? Now you know why it takes three full days to clear my head. ↩ # January 5, 2018"
