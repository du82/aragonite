full_description = "100 Days of WTF Just Happened Today? At the 100 day mark of this presidency, here’s my situation: My Twitter consumption has returned to normal levels. I no longer read every single tweet looking for the next 140 words that are going to piss me off. My ACLU donation is now recurring. I know a lot more about the Federal Budget because… More # April 30, 2017 Media No Comments on 100 Days of WTF Just Happened Today? Screwed by Sith? When Return of the Jedi hit the theaters, I saw it on the first night. The theatre was, of course, packed. It was the first time I ever saw fans dress-up in costume for a movie. There was a Boba Fett, a Darth Vader, and a Princess Leia. I thought they were nuts. When the… More # May 29, 2005 Media 9 Comments on Screwed by Sith? Your Favorite SpongeBob Hands down. No question. Rock Bottom. I know nothing about SpongeBob history, but there are clearly, at least, two drawing styles. The early style has less vibrant colors and pays more attention to drawing detail… also voices are clearly not well defined yet and the creators are still trying stuff out. The latter style looks… More # January 18, 2004 Media 5 Comments on Your Favorite SpongeBob Where the Wild Things Are Variety (via movies.go.com) is reporting that Spike Jonez has signed up to direct a live action version of Where The Wild Things are. How very cool. Apparently this was originally intended to be a CG movie, but Jonez wants to live action. Can’t decide which I’d like to see more. # November 2, 2003 Media 10 Comments on Where the Wild Things Are The Donut Book I’m not manic about keeping crap. During the last survey of the garage, I counted five medium sized brown boxes which I knew contained report cards, year books, a painfully out-of-date set of Dungeon and Dragon books, and a collection on comic books I plan, at some future date, to impressively hand over to my… More # September 30, 2003 Media 17 Comments on The Donut Book Cultural Literacy and Commercials I