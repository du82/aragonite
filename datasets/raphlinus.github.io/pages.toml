title = "Covid-19 resources | Raph Levien’s blog"
description = "I’ve been following the Covid-19 pandemic closely the last week or so, to the point of not really being able to concentrate on other things. In the hope the resources I’ve found might be useful, I’m sharing them with my blog readership. This will be updated frequently, most recently 3/16."
full_description = "Covid-19 resources Mar 14, 2020 I’ve been following the Covid-19 pandemic closely the last week or so, to the point of not really being able to concentrate on other things. In the hope the resources I’ve found might be useful, I’m sharing them with my blog readership. This will be updated frequently, most recently 3/16. Avoid misinformation There is, unfortunately, a huge amount of misinformation, and even active disinformation out there. Since this pandemic is likely to be efficient in converting misinformation into deaths, now is a good time to improve one’s information sources. To quote Dr. Shlain 3/12 dispatch, “There is a ton of bullshit being disseminated. Please do not disseminate anything you can’t verify. Science must prevail.” I’ve found Twitter to be an excellent source of information, provided of course one follows actual experts. My personal favorite is @JeremyKonyndyk, who among other things led Ebola response under Obama, but I also want to raise up @ScottGottliebMD, who has been doing a particularly excellent job calling attention to the need for better testing, and has excellent conservative credentials (works at the AEI). The virus doesn’t care about our political affiliation, and now more than ever is a time we need to be reaching across political divisions to work together. I could make a list of all the people I follow on Twitter, but what I recommend is following the various experts Jeremy retweets, as there is a great range. Unfortunately, a lot of the misinformation is being spread by people in authority, including elected officials, the more irresponsible media outlets, and, sadly, the President. People on epidemiology Twitter are consistently citing misinformation as one of the challenges they face - they do not have the bandwidth to debunk each bit individually. Do your part. Tune out information sources that are prone to misinformation, and please don’t help this stuff propagate. There is one very easy way to identify misinformation. Anyone proposing “cures” that go beyond common sense health advice or consensus public health advice is absolutely spreading dangerous misinformation. Unfortunately, this stuff is fairly common. [As a bit more subtlety, doctors are actively considering existing antiviral agents. Some look promising, and hopefully we will see the result of this research soon. But doctors shouldn’t be paying attention to me for information, there are much better sources such as Dr. Seheult’s MedCram channel. Anyone who is suggesting people seek out such things without a doctor’s prescription is a dangerous quack]. [I’m going to expand on this topic of the pipeline from research to actionable advice soon, as it’s quite tricky territory. For example, in non-expert circles I see a lot of attention given to the advice to avoid ibuprofen. There is weak support for this, and it might be a good idea to use acetaminophen instead out of caution, but there is not yet expert consensus on this. Update 3/17: the WHO now recommends using acetaminophen rather than ibuprofen as self-medication.] More tips on misinformation in this Twitter thread from Imran Malek. A few organizations deserve credit for very good work. The Atlantic is consistently good, with a series of excellent articles by James Hamblin in particular. He is one of the best health communicators working today. On TV, Chris Hayes deserves praise. And I should give credit where credit is due to Fox News for suspending Trish Regan’s show. I just wish they’d go farther and make a collective decision not to air misinformation altogether. If you have Fox News watching people in your family, now might be a good time to remind them that it’s an exceedingly poor source of information. It’s very hard to get through to such people, but it might be helpful to point out that they are saying one thing to their audience and doing another regarding the health of their own employees. Overviews and updates Dr. Jordan Shlain is running regular updates. Dr. Shlain Dispatch #4 is filled with good stats and tips. A fantastic summary of the science is the How to fight the coronavirus SARS-CoV-2 and its disease, CoVID-19 slide deck from the Michael Lin lab at Stanford. A complementary talk, with a greater emphasis on analysis of Wuhan (and with both slides and video available) is from @XihongLin at Harvard. The Imperial College Impact of non-pharmaceutical interventions (NPIs) to reduce COVID-19 mortality and healthcare demand report is sobering, and is one of the few responsible sources to cite actual numbers. In their simulation of what happens if we don’t take actual steps, they predict 2.2 million deaths in the US. That should give the people who complain that the “flattenthecurve” graphs are too simplistic and qualitiative some food for thought. Raw data resources Worldometer has up-to-date information by country. The Johns Hopkins COVID-19 map has long been the go-to resource, but a limitation is that it aggregates all cases by state in the US but no finer. Especially for large states such as California, the New York Times dashboard may be more useful. The Our World in Data website is one of the most comprehensive, and I particularly commend their trajectories chart. It is remarkable how similar the trajectories are for most countries (with Japan and smaller city-states being the exceptions). Note that interpretation is tricky; the US has been way behind on testing capacity but will be bringing that online over the next few days, so we are likely to see a massive uptick in case numbers that represent testing coverage rather than a spike in cases. That will make it hard to evaluate the effectiveness of “social distancing” measures. Likely most readers of this blog understand exponential growth pretty well, but the 3 Blue 1 Brown video on Exponential growth and epidemics does a really good job of putting it in context of epidemics, and in particular explains that a logistic curve is likely a better model, and that only matches a pure exponential up to the inflection point. For fans of modeling, Trevor Bedford @trvrb is a good person to follow. The Nextstrain work has been tracking the genetic variation from the various strains of SARS-CoV-2 virus, and you can follow Dr Emma Hodcroft @firefoxx66 for updates on that. I now have a covid-19 Twitter list which is carefully curated to provide a wide range of expertise, and high signal to noise ratio. Practical tips I recommend flattenthecurve.com, not just for explaining the need for “social distancing” and encouraging it, but also because it puts the advice in context of people actually living their lives. If you do start developing symptoms, the best guide is Home care for patients with suspected novel coronavirus (nCoV) infection presenting with mild symptoms and management of contacts, from the World Health Organization (also see country-specific versions such as the UK version. For more discussion of the policy choices around this, see What Will You Do If You Start Coughing? by James Hamblin. Your local public health department is a great resource. Become familiar with it and be prepared to follow their advice, as this stuff works better when it’s coordinated, and they’ll also point you to authoritative resources. Here’s the Berkeley Coronavirus page, for example. Here’s a Twitter thread with much great advice: COVID-19 Prep Update- March 14 by Andy Slavett. I am not going to post my own projections because it wouldn’t be responsible, but they are very much on track with his. But beyond basic health advice, it’s super important to take care of yourself. Many sources recommend not binging on Covid-19 news (I have been terrible at following that advice). Do other things to stay healthy, and do things to take care of your emotional, spiritual, and mental health. I’ve personally been dealing with waves of intense anger, especially when I check my feeds and see the latest monumental fuckup - as I write, I just saw the images of huge crowds at airports on 3/14. Be aware that this is a tough and stressful time, and have plans in place to manage it. Our Quaker meeting has suspended in-person meetings (along with probably most other religious organizations in the country by now), and is doing online meetings for worship. In addition, we’re setting up an emergency preparedness network, groups of about 10 each by local neighborhood, where we’ll be checking in with each other and can serve as a point of contact in case of emergency. I feel good getting involved in this, and maybe you can consider setting up something similar, whether it’s through your religious group, school, or other social group. Also make sure to take care of your health in other ways: eat right, sleep well, continue to get exercise. Because we don’t have a cure for Covid-19 yet, general health is one of the absolute best predictors of outcome. Take care of yourself, take care of each other. Note: this blog is open source! Feel free to adapt this post as you like (under CC BY 4.0 license), and also send pull requests to the repo to update it."
