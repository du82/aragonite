minus(other) { return new Point(this.x - other.x, this.y - other.y); } atan2() { return Math.atan2(this.y, this.x); } } class Affine { constructor(c) { this.c = c; } apply_pt(p) { const c = this.c; const x = c[0] * p.x + c[2] * p.y + c[4]; const y = c[1] * p.x + c[3] * p.y + c[5]; return new Point(x, y); } apply_cubic(cu) { const c = this.c; const new_c = new Float64Array(8); for (let i = 0; i < 8; i += 2) { new_c[i] = c[0] * cu.c[i] + c[2] * cu.c[i + 1] + c[4]; new_c[i + 1] = c[1] * cu.c[i] + c[3] * cu.c[i + 1] + c[5]; } return new CubicBez(new_c); } static rotate(th) { const c = new Float64Array(6); c[0] = Math.cos(th); c[1] = Math.sin(th); c[2] = -c[1]; c[3] = c[0]; return new Affine(c); } } // Compute an approximation to int (1 + 4x^2) ^ -0.25 dx // This isn't especially good but will do. function approx_myint(x) { const d = 0.67; return x / (1 - d + Math.pow(Math.pow(d, 4) + 0.25 * x * x, 0.25)); } // Approximate the inverse of the function above. // This is better. function approx_inv_myint(x) { const b = 0.39; return x * (1 - b + Math.sqrt(b * b + 0.25 * x * x)); } class QuadBez { constructor(x0, y0, x1, y1, x2, y2) { this.x0 = x0; this.y0 = y0; this.x1 = x1; this.y1 = y1; this.x2 = x2; this.y2 = y2; } to_svg_path() { return `M${this.x0} ${this.y0} Q${this.x1} ${this.y1} ${this.x2} ${this.y2}` } eval(t) { const mt = 1 - t; const x = this.x0 * mt * mt + 2 * this.x1 * t * mt + this.x2 * t * t; const y = this.y0 * mt * mt + 2 * this.y1 * t * mt + this.y2 * t * t; return new Point(x, y); } eval_deriv(t) { const mt = 1 - t; const x = 2 * (mt * (this.x1 - this.x0) + t * (this.x2 - this.x1)); const y = 2 * (mt * (this.y1 - this.y0) + t * (this.y2 - this.y1)); return new Point(x, y); } weightsum(c0, c1, c2) { const x = c0 * this.x0 + c1 * this.x1 + c2 * this.x2; const y = c0 * this.y0 + c1 * this.y1 + c2 * this.y2; return new Point(x, y); } subsegment(t0, t1) { const p0 = this.eval(t0); const p2 = this.eval(t1); const dt = t1 - t0; const p1x = p0.x + (this.x1 - this.x0 + t0 * (this.x2 - 2 * this.x1 + this.x0)) * dt; const p1y = p0.y + (this.y1 - this.y0 + t0 * (this.y2 - 2 * this.y1 + this.y0)) * dt; return new QuadBez(p0.x, p0.y, p1x, p1y, p2.x, p2.y); } } const GAUSS_LEGENDRE_COEFFS_8 = [ 0.3626837833783620, -0.1834346424956498, 0.3626837833783620, 0.1834346424956498, 0.3137066458778873, -0.5255324099163290, 0.3137066458778873, 0.5255324099163290, 0.2223810344533745, -0.7966664774136267, 0.2223810344533745, 0.7966664774136267, 0.1012285362903763, -0.9602898564975363, 0.1012285362903763, 0.9602898564975363, ]; const GAUSS_LEGENDRE_COEFFS_8_HALF = [ 0.3626837833783620, 0.1834346424956498, 0.3137066458778873, 0.5255324099163290, 0.2223810344533745, 0.7966664774136267, 0.1012285362903763, 0.9602898564975363, ]; const GAUSS_LEGENDRE_COEFFS_16_HALF = [ 0.1894506104550685, 0.0950125098376374, 0.1826034150449236, 0.2816035507792589, 0.1691565193950025, 0.4580167776572274, 0.1495959888165767, 0.6178762444026438, 0.1246289712555339, 0.7554044083550030, 0.0951585116824928, 0.8656312023878318, 0.0622535239386479, 0.9445750230732326, 0.0271524594117541, 0.9894009349916499, ]; const GAUSS_LEGENDRE_COEFFS_24_HALF = [ 0.1279381953467522, 0.0640568928626056, 0.1258374563468283, 0.1911188674736163, 0.1216704729278034, 0.3150426796961634, 0.1155056680537256, 0.4337935076260451, 0.1074442701159656, 0.5454214713888396, 0.0976186521041139, 0.6480936519369755, 0.0861901615319533, 0.7401241915785544, 0.0733464814110803, 0.8200019859739029, 0.0592985849154368, 0.8864155270044011, 0.0442774388174198, 0.9382745520027328, 0.0285313886289337, 0.9747285559713095, 0.0123412297999872, 0.9951872199970213, ]; const GAUSS_LEGENDRE_COEFFS_32 = [ 0.0965400885147278, -0.0483076656877383, 0.0965400885147278, 0.0483076656877383, 0.0956387200792749, -0.1444719615827965, 0.0956387200792749, 0.1444719615827965, 0.0938443990808046, -0.2392873622521371, 0.0938443990808046, 0.2392873622521371, 0.0911738786957639, -0.3318686022821277, 0.0911738786957639, 0.3318686022821277, 0.0876520930044038, -0.4213512761306353, 0.0876520930044038, 0.4213512761306353, 0.0833119242269467, -0.5068999089322294, 0.0833119242269467, 0.5068999089322294, 0.0781938957870703, -0.5877157572407623, 0.0781938957870703, 0.5877157572407623, 0.0723457941088485, -0.6630442669302152, 0.0723457941088485, 0.6630442669302152, 0.0658222227763618, -0.7321821187402897, 0.0658222227763618, 0.7321821187402897, 0.0586840934785355, -0.7944837959679424, 0.0586840934785355, 0.7944837959679424, 0.0509980592623762, -0.8493676137325700, 0.0509980592623762, 0.8493676137325700, 0.0428358980222267, -0.8963211557660521, 0.0428358980222267, 0.8963211557660521, 0.0342738629130214, -0.9349060759377397, 0.0342738629130214, 0.9349060759377397, 0.0253920653092621, -0.9647622555875064, 0.0253920653092621, 0.9647622555875064, 0.0162743947309057, -0.9856115115452684, 0.0162743947309057, 0.9856115115452684, 0.0070186100094701, -0.9972638618494816, 0.0070186100094701, 0.9972638618494816, ]; const GAUSS_LEGENDRE_COEFFS_32_HALF = [ 0.0965400885147278, 0.0483076656877383, 0.0956387200792749, 0.1444719615827965, 0.0938443990808046, 0.2392873622521371, 0.0911738786957639, 0.3318686022821277, 0.0876520930044038, 0.4213512761306353, 0.0833119242269467, 0.5068999089322294, 0.0781938957870703, 0.5877157572407623, 0.0723457941088485, 0.6630442669302152, 0.0658222227763618, 0.7321821187402897, 0.0586840934785355, 0.7944837959679424, 0.0509980592623762, 0.8493676137325700, 0.0428358980222267, 0.8963211557660521, 0.0342738629130214, 0.9349060759377397, 0.0253920653092621, 0.9647622555875064, 0.0162743947309057, 0.9856115115452684, 0.0070186100094701, 0.9972638618494816, ]; function tri_sign(x0, y0, x1, y1) { return x1 * (y0 - y1) - y1 * (x0 - x1); } // Return distance squared function line_nearest_origin(x0, y0, x1, y1) { const dx = x1 - x0; const dy = y1 - y0; let dotp = -dx * x0 - dy * y0; let d_sq = dx * dx + dy * dy; if (dotp <= 0) { return x0 * x0 + y0 * y0; } else if (dotp >= d_sq) { return x1 * x1 + y1 * y1; } else { const t = dotp / d_sq; const x = x0 + t * (x1 - x0); const y = y0 + t * (y1 - y0); return x * x + y * y; } } class CubicBez { /// Argument is array of coordinate values [x0, y0, x1, y1, x2, y2, x3, y3]. constructor(coords) { this.c = coords; } static from_pts(p0, p1, p2, p3) { const c = new Float64Array(8); c[0] = p0.x; c[1] = p0.y; c[2] = p1.x; c[3] = p1.y; c[4] = p2.x; c[5] = p2.y; c[6] = p3.x; c[7] = p3.y; return new CubicBez(c); } p0() { return new Point(this.c[0], this.c[1]); } p1() { return new Point(this.c[2], this.c[3]); } p2() { return new Point(this.c[4], this.c[5]); } p3() { return new Point(this.c[6], this.c[7]); } to_svg_path() { const c = this.c; return `M${c[0]} ${c[1]}C${c[2]} ${c[3]} ${c[4]} ${c[5]} ${c[6]} ${c[7]}` } weightsum(c0, c1, c2, c3) { const x = c0 * this.c[0] + c1 * this.c[2] + c2 * this.c[4] + c3 * this.c[6]; const y = c0 * this.c[1] + c1 * this.c[3] + c2 * this.c[5] + c3 * this.c[7]; return new Point(x, y); } eval(t) { const mt = 1 - t; const c0 = mt * mt * mt; const c1 = 3 * mt * mt * t; const c2 = 3 * mt * t * t; const c3 = t * t * t; return this.weightsum(c0, c1, c2, c3); } eval_deriv(t) { const mt = 1 - t; const c0 = -3 * mt * mt; const c3 = 3 * t * t; const c1 = -6 * t * mt - c0; const c2 = 6 * t * mt - c3; return this.weightsum(c0, c1, c2, c3); } // quadratic bezier with matching endpoints and minimum max vector error midpoint_quadbez() { const p1 = this.weightsum(-0.25, 0.75, 0.75, -0.25); return new QuadBez(this.c[0], this.c[1], p1.x, p1.y, this.c[6], this.c[7]); } subsegment(t0, t1) { let c = new Float64Array(8); const p0 = this.eval(t0); const p3 = this.eval(t1); c[0] = p0.x; c[1] = p0.y; const scale = (t1 - t0) / 3; const d1 = this.eval_deriv(t0); c[2] = p0.x + scale * d1.x; c[3] = p0.y + scale * d1.y; const d2 = this.eval_deriv(t1); c[4] = p3.x - scale * d2.x; c[5] = p3.y - scale * d2.y; c[6] = p3.x; c[7] = p3.y; return new CubicBez(c); } area() { const c = this.c; return (c[0] * (6 * c[3] + 3 * c[5] + c[7]) + 3 * (c[2] * (-2 * c[1] + c[5] + c[7]) - c[4] * (c[1] + c[3] - 2 * c[7])) - c[6] * (c[1] + 3 * c[3] + 6 * c[5])) * 0.05; } chord() { return new Line([this.c[0], this.c[1], this.c[6], this.c[7]]); } deriv() { const c = this.c; return new QuadBez( 3 * (c[2] - c[0]), 3 * (c[3] - c[1]), 3 * (c[4] - c[2]), 3 * (c[5] - c[3]), 3 * (c[6] - c[4]), 3 * (c[7] - c[5]) ); } // A pretty good algorithm; kurbo does more sophisticated error analysis. arclen(accuracy) { return this.arclen_rec(accuracy, 0); } arclen_rec(accuracy, depth) { const c = this.c; const d03x = c[6] - c[0]; const d03y = c[7] - c[1]; const d01x = c[2] - c[0]; const d01y = c[3] - c[1]; const d12x = c[4] - c[2]; const d12y = c[5] - c[3]; const d23x = c[6] - c[4]; const d23y = c[7] - c[5]; const lp_lc = Math.hypot(d01x, d01y) + Math.hypot(d12x, d12y) + Math.hypot(d23x, d23y) - Math.hypot(d03x, d03y); const dd1x = d12x - d01x; const dd1y = d12y - d01y; const dd2x = d23x - d12x; const dd2y = d23y - d12y; const dmx = 0.25 * (d01x + d23x) + 0.5 * d12x; const dmy = 0.25 * (d01y + d23y) + 0.5 * d12y; const dm1x = 0.5 * (dd2x + dd1x); const dm1y = 0.5 * (dd2y + dd1y); const dm2x = 0.25 * (dd2x - dd1x); const dm2y = 0.25 * (dd2y - dd1y); const co_e = GAUSS_LEGENDRE_COEFFS_8; let est = 0; for (let i = 0; i < co_e.length; i += 2) { const xi = co_e[i + 1]; const dx = dmx + dm1x * xi + dm2x * (xi * xi); const dy = dmy + dm1y * xi + dm2y * (xi * xi); const ddx = dm1x + dm2x * (2 * xi); const ddy = dm1y + dm2y * (2 * xi); est += co_e[i] * (ddx * ddx + ddy * ddy) / (dx * dx + dy * dy); } const est3 = est * est * est; const est_gauss8_err = Math.min(est3 * 2.5e-6, 3e-2) * lp_lc; let co = null; if (Math.min(est3 * 2.5e-6, 3e-2) * lp_lc < accuracy) { co = GAUSS_LEGENDRE_COEFFS_8_HALF; } else if (Math.min(est3 * est3 * 1.5e-11, 9e-3) * lp_lc < accuracy) { co = GAUSS_LEGENDRE_COEFFS_16_HALF; } else if (Math.min(est3 * est3 * est3 * 3.5e-16, 3.5e-3) * lp_lc < accuracy || depth >= 20) { co = GAUSS_LEGENDRE_COEFFS_24_HALF; } else { const c0 = this.subsegment(0, 0.5); const c1 = this.subsegment(0.5, 1); return c0.arclen_rec(accuracy * 0.5, depth + 1) + c1.arclen_rec(accuracy * 0.5, depth + 1); } let sum = 0; for (let i = 0; i < co.length; i += 2) { const xi = co[i + 1]; const wi = co[i]; const dx = dmx + dm2x * (xi * xi); const dy = dmy + dm2y * (xi * xi); const dp = Math.hypot(dx + dm1x * xi, dy + dm1y * xi); const dm = Math.hypot(dx - dm1x * xi, dy - dm1y * xi); sum += wi * (dp + dm); } return 1.5 * sum; } inv_arclen(s, accuracy) { if (s <= 0) { return 0; } const total_arclen = this.arclen(accuracy); if (s >= total_arclen) { return 1; } // For simplicity, measure arclen from 0 rather than stateful delta. const f = t => this.subsegment(0, t).arclen(accuracy) - s; const epsilon = accuracy / total_arclen; return solve_itp(f, 0, 1, epsilon, 1, 2, -s, total_arclen -s); } find_offset_cusps(d) { const q = this.deriv(); // x'' cross x' is a quadratic polynomial in t const d0x = q.x0; const d0y = q.y0; const d1x = 2 * (q.x1 - q.x0); const d1y = 2 * (q.y1 - q.y0); const d2x = q.x0 - 2 * q.x1 + q.x2; const d2y = q.y0 - 2 * q.y1 + q.y2; const c0 = d1x * d0y - d1y * d0x; const c1 = 2 * (d2x * d0y - d2y * d0x); const c2 = d2x * d1y - d2y * d1x; const cusps = new CuspAccumulator(d, q, c0, c1, c2); this.find_offset_cusps_rec(d, cusps, 0, 1, c0, c1, c2); return cusps.reap(); } find_offset_cusps_rec(d, cusps, t0, t1, c0, c1, c2) { cusps.report(t0); const dt = t1 - t0; const q = this.subsegment(t0, t1).deriv(); // compute interval for ds/dt, using convex hull of hodograph const d1 = tri_sign(q.x0, q.y0, q.x1, q.y1); const d2 = tri_sign(q.x1, q.y1, q.x2, q.y2); const d3 = tri_sign(q.x2, q.y2, q.x0, q.y0); const z = !((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0)); const ds0 = q.x0 * q.x0 + q.y0 * q.y0; const ds1 = q.x1 * q.x1 + q.y1 * q.y1; const ds2 = q.x2 * q.x2 + q.y2 * q.y2; const max_ds = Math.sqrt(Math.max(ds0, ds1, ds2)) / dt; const m1 = line_nearest_origin(q.x0, q.y0, q.x1, q.y1); const m2