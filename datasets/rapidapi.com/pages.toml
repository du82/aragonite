full_description = "Come join our team and together, we can empower developers to build modern software through API innovation Today, almost every developer uses APIs in their modern software development process. Started at a hackathon in 2015, Rapid has been committed from the onset to make software development easier and faster through the use of APIs. Today, Rapid is the world’s largest API Hub where almost 3 million developers find, test, and connect to thousands of public APIs. We’re adding new APIs and thousands of developers every day. And, we are making it easier for development teams and larger organizations to build better software through a private API workspace. Come join our team and together, we can empower developers to build modern software through API innovation. At Rapid, we are committed to creating a work environment that gives our team the support and freedom to do their best work. Our values are what unites us and has fostered a culture that remains amazingly strong even as we scale and grow. In addition to receiving a competitive salary and generous stock options, Rapid employees enjoy many added benefits and perks including global offsites, team events, happy hours and a generous referral bonus program. Team members can also take advantage of lunch benefits and vacation perks, depending on your location. We are a team building and maintaining the world’s largest API hub and providing an industry-leading experience for our users."
