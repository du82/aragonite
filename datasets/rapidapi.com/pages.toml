description = "Security, trust and compliance for API consumption and publishing, including role-based access control, and federated identity"
full_description = "Rapid delivers foundational enterprise-grade security critical for your APIs. Rapid’s approach to security and trust focuses on business continuity access control, data privacy, and disaster recovery encapsulated in an Information Security Management System that meets national and international data security and privacy standards. Rapid enforces all communication with the API Hub for Enterprise using TLS 1.2 to the highest level of encryption supported by your client. At rest, your data is encrypted using AWS KMS, which has been independently validated and certified, including in the AWS SOC reports, PCI DSS, and FedRAMP approvals. API Hub for Enterprise can deliver the service from across several geographical locations, including the United States, Canada, and the European Union. Rapid is subject to similar privacy requirements as our customers. Our privacy program is inclusive with our security program and has been deployed to meet the data privacy requirements of many regulations globally. Rapid replicates real-time production data and stores data in geographically separated redundant data centers. Each data center location has a security control framework in place that is equivalent to our production data centers. Our Information Security Management System (ISMS) is a risk-based ISMS and based on numerous international standards and the regulatory frameworks. We have implemented approximately 230 unique controls across Rapid that are applicable to the API Hub for Enterprise SaaS service, the technology stack and endpoint systems we use for business operations. The control framework includes but is not limited to the following key control families. Rapid controls access to information and information processing facilities and systems by implementing controls relating to: To ensure that security is built into everything that we do, we have deployed the following operational processes: As both a Data Controller, Processor and Sub-Processor, Rapid ensures the operational processes and legal mechanisms we have in place are appropriate to meet the privacy obligations placed on us as either a Data Controller or Processor. An example of some of the processes we have in place are:"
