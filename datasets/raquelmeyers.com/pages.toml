title = "Boria [2020s] – raquel meyers"
description = "A R K A M E Y E R S [Arkaitz Saiz + Raquel Meyers] An ongoing project about the biggest saltwater lagoon in Europe, the Mar Menor.     Boria is a collaborative project that reflects on the Mar Menor from two points of view. One from the Marmenoran diaspora and another as an unusual visitor to its unknown space.There is a kind of boria (fog in Cartagenero) that seems to prevent seeing what is happening in the Mar Menor for more than four decades: the pollution and destruction of Europe’s largest salt lagoon, which could have been partly avoided had the 1987 Coastal Act not been repealed.The causes of the collapse of the Mar Menor are well known and documented: the entry of heavy metals from abandoned mines washed away by the rains; the massive construction; the dredging and widening of the Estacio Canal; intensive agriculture… All these impacts have had tremendous consequences such as the episode of the famous sopa verde (eutrophication) of 2016 caused by discharges loaded with nitrates or tons of dead fish, first in October 2019 and then in August 2021.At present the most important economic sectors of the Mar Menor are intensive agriculture with extensive areas of illegal irrigation and second residence tourism, whose fierce urbanism generates empty areas out of season. The permanent populations coexist with agricultural and livestock farms, whose majority employment is generated by the primary sector and services. An unsustainable social and environmental economic model, which has caused the ecological crisis of the Mar Menor.[ES]Boria es un proyecto colaborativo que reflexiona sobre el Mar Menor desde dos puntos de vista. Uno desde la diáspora marmenorense y otro como visitante inusual a su espacio desconocido.Existe una especie de boria (niebla en cartagenero) que parece impedir ver lo que está sucediendo en el Mar Menor desde hace más de cuatro décadas: la contaminación y destrucción de la laguna salada más grande de Europa y que pudo haberse evitado en parte si no se hubiese derogado la ley de Costas de 1987.Las causas del colapso del Mar Menor son más que conocidas y están más que documentadas: la entrada de metales pesados de minas abandonadas arrastrados por las lluvias; la construcción masiva; el dragado y ensanche del Canal del Estacio; la agricultura intensiva… Todos estos impactos han tenido tremendas consecuencias como el episodio de la famosa sopa verde (eutrofización) de 2016 causada por vertidos cargados de nitratos o las toneladas de peces muertos, primero en octubre de 2019 y después en agosto de 2021.En la actualidad los sectores económicos más importantes del Mar Menor son el de agricultura intensiva con extensas zonas de regadío ilegal y el turismo de segunda residencia, cuyo urbanismo feroz genera zonas vacías fuera de temporada. Las poblaciones permanentes conviven con explotaciones agrarias y agropecuarias, cuyo empleo mayoritario lo genera el sector primario y servicios. Un modelo económico insostenible social y medioambiental, que ha provocado la crisis ecológica del Mar Menor.[+ información]Exhibitions:  27th April- 12th May 2023 // Boria [ARKAMEYERS] y otros relatos sobre el Mar Menor @ Centro Cultural Puertas de Castilla, Murcia, ES                   16th-31st may 2022 // Boria @ Gizaziena, Centro Municipal de Distrito de San Francisco, Bilbao, ES caostica.com         Fotos Juan Dopico @ Gizazinea22sd february-31st march 2022 //Boria @ Museo Educación Ambiental de Pamplona, ES https://educacionambiental.pamplona.esLa crisis del Mar Menor llega a Pamplona @ Diario de NavarraLa exposición sobre la ‘Boria’ (niebla) del mar Menor llega al Museo de Educación Ambiental de Pamplona @ Pamplona Actual    28.12.2021-315.01.2022 // Mar Menor Bizirik Zero Isurketa’ @ IORTIA , Alsasua, ES6th-31st october 2021 // ‘Mar Menor Bizirik Zero Isurketa @ Hika Ateneo, Bilbao, ES hikaateneo.eus / marmenorbizirikzeroisurketa.wordpress.com"
full_description = "A R K A M E Y E R S [Arkaitz Saiz + Raquel Meyers] An ongoing project about the biggest saltwater lagoon in Europe, the Mar Menor. Boria is a collaborative project that reflects on the Mar Menor from two points of view. One from the Marmenoran diaspora and another as an unusual visitor to its unknown space. There is a kind of boria (fog in Cartagenero) that seems to prevent seeing what is happening in the Mar Menor for more than four decades: the pollution and destruction of Europe’s largest salt lagoon, which could have been partly avoided had the 1987 Coastal Act not been repealed. The causes of the collapse of the Mar Menor are well known and documented: the entry of heavy metals from abandoned mines washed away by the rains; the massive construction; the dredging and widening of the Estacio Canal; intensive agriculture… All these impacts have had tremendous consequences such as the episode of the famous sopa verde (eutrophication) of 2016 caused by discharges loaded with nitrates or tons of dead fish, first in October 2019 and then in August 2021. At present the most important economic sectors of the Mar Menor are intensive agriculture with extensive areas of illegal irrigation and second residence tourism, whose fierce urbanism generates empty areas out of season. The permanent populations coexist with agricultural and livestock farms, whose majority employment is generated by the primary sector and services. An unsustainable social and environmental economic model, which has caused the ecological crisis of the Mar Menor. Boria es un proyecto colaborativo que reflexiona sobre el Mar Menor desde dos puntos de vista. Uno desde la diáspora marmenorense y otro como visitante inusual a su espacio desconocido. Existe una especie de boria (niebla en cartagenero) que parece impedir ver lo que está sucediendo en el Mar Menor desde hace más de cuatro décadas: la contaminación y destrucción de la laguna salada más grande de Europa y que pudo haberse evitado en parte si no se hubiese derogado la ley de Costas de 1987."
