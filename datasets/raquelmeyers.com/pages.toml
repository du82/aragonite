["https://www.raquelmeyers.com/esther-and-john-clay-fine-art-gallery-lccc"]
title = "Esther and John Clay Fine Art Gallery @ LCCC [2023] – raquel meyers"
description = "Keys of Fury. Type In Beyond the Scrolling Horizon [2023] [KYBDslöjd, Brutalism and Digital Craft] Solo Exhibition @ Esther and John Clay Fine Art Gallery. Laramie County Community College (LCCC),Wynoming, US Sept. 19 – Oct. 24 2023[Keys of Fury] is a typing project (KYBDslöjd) that makes material the text characters while typing on the keyboard. This process slows down the interaction between the end-user and the computer, which prompts questions about our relationships with technology. The computer is a tool that allows us to express ideas visually in contrast to the constant connection to technology and its functionality today. The use of obsolete and vintage computers examines how these tools can still serve a vital function. The characters in Commodore 64 (PETSCII) are used without ornament like concrete in brutalist architecture, capturing the spirit and the contradictions of our time.KYBDslöjd uses a particular way of working with keystrokes and PETSCII on the Commodore 64 with software developed by Mathman (Johan Kotlinski) called Nop. The program consists of two parts: a block of data statements containing the instructions (where all the keystrokes are recorded), and a section of code, which reads the data and outputs the animation. There is no menu, so all the instructions; like color, position, and character shape are typed on the keyboard. A black screen with a blinking cursor is the starting point to build graphics and animations, character by character. This process is like cross-stitch, a form of counted thread embroidery, or the typewriter technique, both not allowing for corrections. Any unintended strikes force the user to start all over again. In KYBDslöjd, hardware and software are a challenge, they are not decorations, or sources of nostalgia. It is a conversation about why we must return to a deeper understanding of the technology that has infiltrated our everyday lives.  We must continue innumerable acts of resistance. The tyranny of the “easy to use” and immediate gratification are dissuasive tactics that lead toward boredom.RAQUEL MEYERS, Multi-Media Artist + SHARIFA MOORE, Executive Director & Curator for Denver Digerati are coming to the Esther & John Clay Fine Arts Gallery. Exhibit Dates: Sept. 19 – Oct. 24 2023 Artist Talk: Sept. 20 | 11 a.m. – 12 p.m. Reception: Sept 20 | 12-1:30 p.m. Animation Screening with Sharifa Wednesday Oct. 4 | 11 a.m. – 12 p.m"
full_description = "Keys of Fury. Type In Beyond the Scrolling Horizon [2023] [KYBDslöjd, Brutalism and Digital Craft] Solo Exhibition @ Esther and John Clay Fine Art Gallery. Laramie County Community College (LCCC),Wynoming, US Sept. 19 – Oct. 24 2023 [Keys of Fury] is a typing project (KYBDslöjd) that makes material the text characters while typing on the keyboard. This process slows down the interaction between the end-user and the computer, which prompts questions about our relationships with technology. The computer is a tool that allows us to express ideas visually in contrast to the constant connection to technology and its functionality today. The use of obsolete and vintage computers examines how these tools can still serve a vital function. The characters in Commodore 64 (PETSCII) are used without ornament like concrete in brutalist architecture, capturing the spirit and the contradictions of our time. KYBDslöjd uses a particular way of working with keystrokes and PETSCII on the Commodore 64 with software developed by Mathman (Johan Kotlinski) called Nop. The program consists of two parts: a block of data statements containing the instructions (where all the keystrokes are recorded), and a section of code, which reads the data and outputs the animation. There is no menu, so all the instructions; like color, position, and character shape are typed on the keyboard. A black screen with a blinking cursor is the starting point to build graphics and animations, character by character. This process is like cross-stitch, a form of counted thread embroidery, or the typewriter technique, both not allowing for corrections. Any unintended strikes force the user to start all over again. In KYBDslöjd, hardware and software are a challenge, they are not decorations, or sources of nostalgia. It is a conversation about why we must return to a deeper understanding of the technology that has infiltrated our everyday lives. We must continue innumerable acts of resistance. The tyranny of the “easy to use” and immediate gratification are dissuasive tactics that lead toward boredom."
