["https://www.raquelmeyers.com/desplazamientos-1-2025"]
title = "Desplazamientos #1. Bitamine – Casa Planas [2025] – raquel meyers"
description = "[En proceso / In progress]Proyecto seleccionado: Es una pena que el hormigón no arda [Raquel Meyers] bitamine.net “Es una pena que el hormigón no arda”, es la traducción de la frase Schade, class Beton nicht brennt utilizada por trabajadores y okupas alemanes en los años 1970s contra la construcción masiva de hormigón armado. El hormigón es el material «milagroso» que modificó los territorios en la posguerra con múltiples implicaciones en la economía, el turismo y el progreso. Este proyecto quiere investigar y conversar sobre cuáles son las ruinas, las cicatrices, los vestigios y las relaciones humanas con el cemento en Palma de Mallorca e Irún. DESPLAZAMIENTOS #1 January-March 2025 Programa de investigación artística BITAMINE – CASA PLANAS Bitamine, Habitación para la investigación artística, cultural y social en la frontera, situada en Irun-Euskadi, en asociación con Casa Planas, Centro de investigación de la imagen contemporánea situado en Palma de Mallorca, impulsan un programa de becas dirigido a investigadoras/es residentes en Euskadi.Este programa de investigación artística tiene como objetivo desarrollar y producir proyectos que aporten una reflexión sobre el impacto del turismo en términos socioculturales.La investigación parte de la activación del Archivo Internacional sobre la historia del turismo (Planas Archive)"
full_description = "“Es una pena que el hormigón no arda”, es la traducción de la frase Schade, class Beton nicht brennt utilizada por trabajadores y okupas alemanes en los años 1970s contra la construcción masiva de hormigón armado. El hormigón es el material «milagroso» que modificó los territorios en la posguerra con múltiples implicaciones en la economía, el turismo y el progreso. Este proyecto quiere investigar y conversar sobre cuáles son las ruinas, las cicatrices, los vestigios y las relaciones humanas con el cemento en Palma de Mallorca e Irún. DESPLAZAMIENTOS #1 January-March 2025 Programa de investigación artística BITAMINE – CASA PLANAS Bitamine, Habitación para la investigación artística, cultural y social en la frontera, situada en Irun-Euskadi, en asociación con Casa Planas, Centro de investigación de la imagen contemporánea situado en Palma de Mallorca, impulsan un programa de becas dirigido a investigadoras/es residentes en Euskadi. Este programa de investigación artística tiene como objetivo desarrollar y producir proyectos que aporten una reflexión sobre el impacto del turismo en términos socioculturales. La investigación parte de la activación del Archivo Internacional sobre la historia del turismo (Planas Archive)"
