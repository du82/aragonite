title = "Biblioteca recíproca [Interdependence Library] A R K A M E Y E R S [2022] – raquel meyers"
description = "Biblioteca recíproca [Interdependence Library] > A R K A M E Y E R S [2022->]Project selected for WIKIRIKI residences 2021-2022 / Wikitoki: ‘Biblioteca recíproca [Interdependence Library]’, by Raquel Meyers and Arkaitz Saiz. For its link to models of social reproduction that put life at the center and the socio-cultural context of the neighborhood in which Wikitoki is located. ‘Biblioteca recíproca [Interdependence Library]’ aims to document the cultural diversity of the neighborhoods of Bilbao La Vieja, San Francisco and Zabala and collectivize objects, intangible resources, skills, affections, knowledge and knowledge of our neighbors; as well as the origin of their countries, cultures, religions… from a contemporary perspective and from a critical reflection on care. Not only from a theoretical point of view but also from a practical one. It is a project inspired by the spirit of the “libraries of things” and the “Artotekas” (Art Libraries).[Project website] >>>          31st may 2022 – 18:30h // Teletext Workshop ‘Biblioteca recíproca [Interdependence Library]’ Project @ WIKIRIKI Residency Wikitoki, Harrobi Plaza, 5, 2º, 48003 [+info] https://wikitoki.org/actividad/taller-de-teletexto-de-biblioteca-reciproca/     26th may 2022 – 18:30h // Presentation ‘Biblioteca recíproca [Interdependence Library]’ Project @ WIKIRIKI Residency Wikitoki, Harrobi Plaza, 5, 2º, 48003 [+info] https://wikitoki.org/actividad/presentacion-de-biblioteca-reciproca/  [ES]Proyecto seleccionado para las residencias WIKIRIKI 2021-2022 de WIKITOKI:Biblioteca Recíproca, de Raquel Meyers y Arkaitz Saiz. Por su vinculación a modelos de reproducción social que pongan la vida en el centro y al contexto socio-cultural del barrio en que se sitúa Wikitoki.‘Biblioteca recíproca [Interdependence Library]’ tiene la intención de documentar la diversidad cultural de los barrios de Bilbao La Vieja, San Francisco y Zabala y colectivizar objetos, recursos inmateriales, habilidades, afectos, conocimientos y saberes de nuestr@s vecin@s; así como la procedencia de sus países, culturas, religiones… desde una perspectiva contemporánea y, de reflexión crítica sobre el cuidado. No solo desde un punto de vista teórico sino también práctico. Es un proyecto inspirado en el espíritu de las «bibliotecas de cosas [libraries of things]» y las «Artotekas» (bibliotecas de arte).[+ información].El teletexto del barrio @ Biblioteca recíproca [Interdependence Library] >>> https://www.arkameyers.com/barriotxt/100.html                   31st january 2022 //  DibujaTolRato & Koop SF 34, Bilbao, ES Reinterpretation KOOP SF34 / Invitation to observe, reinterpret and draw a co-working to the African. Very different to the European version of table-computer-chair-wifi. https://dibujatolrato.com/agenda/ Materials: PETSCII and Alphabet Stamps, Grid Paper & Geometrical Stickers."
full_description = "Project selected for WIKIRIKI residences 2021-2022 / Wikitoki: ‘Biblioteca recíproca [Interdependence Library]’, by Raquel Meyers and Arkaitz Saiz. For its link to models of social reproduction that put life at the center and the socio-cultural context of the neighborhood in which Wikitoki is located. ‘Biblioteca recíproca [Interdependence Library]’ aims to document the cultural diversity of the neighborhoods of Bilbao La Vieja, San Francisco and Zabala and collectivize objects, intangible resources, skills, affections, knowledge and knowledge of our neighbors; as well as the origin of their countries, cultures, religions… from a contemporary perspective and from a critical reflection on care. Not only from a theoretical point of view but also from a practical one. It is a project inspired by the spirit of the “libraries of things” and the “Artotekas” (Art Libraries). 31st may 2022 – 18:30h // Teletext Workshop ‘Biblioteca recíproca [Interdependence Library]’ Project @ WIKIRIKI Residency Wikitoki, Harrobi Plaza, 5, 2º, 48003 [+info] https://wikitoki.org/actividad/taller-de-teletexto-de-biblioteca-reciproca/ 26th may 2022 – 18:30h // Presentation ‘Biblioteca recíproca [Interdependence Library]’ Project @ WIKIRIKI Residency Wikitoki, Harrobi Plaza, 5, 2º, 48003 [+info] https://wikitoki.org/actividad/presentacion-de-biblioteca-reciproca/ Biblioteca Recíproca, de Raquel Meyers y Arkaitz Saiz. Por su vinculación a modelos de reproducción social que pongan la vida en el centro y al contexto socio-cultural del barrio en que se sitúa Wikitoki. ‘Biblioteca recíproca [Interdependence Library]’ tiene la intención de documentar la diversidad cultural de los barrios de Bilbao La Vieja, San Francisco y Zabala y colectivizar objetos, recursos inmateriales, habilidades, afectos, conocimientos y saberes de nuestr@s vecin@s; así como la procedencia de sus países, culturas, religiones… desde una perspectiva contemporánea y, de reflexión crítica sobre el cuidado. No solo desde un punto de vista teórico sino también práctico. Es un proyecto inspirado en el espíritu de las «bibliotecas de cosas [libraries of things]» y las «Artotekas» (bibliotecas de arte)."
