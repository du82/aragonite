title = "info – raquel meyers"
full_description = "Raquel Meyers (Cartagena, Spain b. 1977) works with obsolete technologies like the Commodore 64, Teletext, typewriters or fax machines mixed with photography, animation and embroidery, among other techniques. She defines her practice as KYBDslöjd [mecanografía expandida] whose significance can be defined roughly as <a manual skill with a keyboard>. It is based on and refers to the typewriter, Concrete Poetry, Demoscene and Brutalism. The keystrokes contribute to the execution, while poetry contributes to a system, through revealing the architecture of PETSCII, the raw and unadorned character set of Commodore 64. Her work has been shown in art centers, galleries and festivals such as Ars Electronica, Transmediale, Xpo Gallery, La Casa encendida, Liste Art Fair Basel, P21 Seoul, la Maison des Auteurs Angoulême, BmoCA, SeMA NANJI, La Gaîté lyrique, Tokyo Blip Festival, Square Sounds Melbourne, BilbaoArte, LABoral, Denver Digerati, iMAL, Piksel, Shibuya Pixel Art, LEV, MFRU, HeK, ETOPIA, Eufònic Urbà … Crespo, B. & Meyers, R. (2022). ELIGE TU PROPIA NORMALIDAD – AUKERATU ZEURE NORMALTASUNA – CHOOSE YOUR OWN NORMALITY. Babestu, Contemporary Creation Support Programme Azkuna Zentroa [Limited Edition] https://eligetupropianormalidad.com/ Cocker E., Damianisch A., Séraphin L., Daus C. (2020), ‘LANGUAGE-BASED ARTISTIC RESEARCH (SPECIAL INTEREST GROUP)‘, Research Catalogue. researchcatalogue.net Meyers, R. (2020). Escombro de antropoceno y ruidos de fondo, Sección crítica: “Entre silencios”, Fundación BilbaoArte Fundazioa. bilbaoarte.org Meyers, R. (2020). Reliquias y escombros del futuro [Relics and Rubble of the Future], AusArt Journal for Research in Art. 8 (1) – 2020, pp. 283-293. UPV/EHU. https://ojs.ehu.eus/index.php/ausart/article/view/21517 Meyers, R. (2018). Narcisismo tecnológico electrocutado / Electroshocked techno-narcissism, AusArt Journal for Research in Art. 6 (2) – 2018, pp. 233-243. UPV/EHU. http://www.ehu.eus/ojs/index.php/ausart/article/view/20378"
