["https://www.raquelmeyers.com/technorubble-museum-of-teletext-art-muta-2024"]
title = "Technorubble @ Museum of Teletext Art MUTA [2024] – raquel meyers"
description = "July-December 2024 Museum of Teletext Art MUTA presents: Raquel Meyers: Technorubble (2024) Page 806 Yle Teksti-TV https://yle.fi/aihe/tekstitv?P=806#14         21st September- 8th october 2024// 07-24 @ Poriginal Gallery (Pori) https://fixc.fi/FixC cooperative exhibits works from VILKE collection and from MUTA collection in Poriginal Gallery, Pori 21.9-8.10.2024.The name of the exhibition reflects the years of operation of the FixC cooperative up to the time of the exhibition. The exhibition presents a wide selection of high-quality art from the Museum of Teletext Art (MUTA) and the VILKE collection.Among the artists of the MUseum of Teletext Art, the world’s only teletext art museum founded in 2014 by the FixC cooperative, you can find e.g. Software art pioneer LIA, renoun media hacking duo ÛBERMORGEN and the master of mecanografía expandid Raquel Meyers.Artists featured in the 07-24 exhibitionVILKE:Philip von Knorring, Mika Taanila, Pekka Nevalainen, mfx, Alli Savolainen, Maria Duncker, Jimi Tenor, Heidi Kilpeläinen A.K.A. HK119 and Marjatta Oja.MUTA:LIA, Karin Ferrari, Jarkko Räsänen, Seppo Renvall, Kari Yli-Annala, Erkka Nissinen, Paula Lehtonen, ÜBERMORGEN, Ryo Ikeshiro, Raquel Meyers, Kathrin Günter, Dragan Espenschied, Ian Gouldstone, Juha van Ingen, Max Capacity, Emilie Gervais, Karin Andersen, Bakketun & Norum, Dan Farrimond, Karin Ferrari, Maria Lavman Vetö, Karin Andresson, Mad as Hell and Max Haarich.As part of the exhibition, a series of new works will be presented on the Museum of Teletext Art pages on YLE Teletext (starting on pages 803, 805, and 806) from July to the end of December. These works are by Paula Lehtonen, Karin Ferrari, Max Haarich, Ryo Ikeshiro, Raquel Meyers, and Erkka Nissinen."
full_description = "July-December 2024 Museum of Teletext Art MUTA presents: Raquel Meyers: Technorubble (2024) Page 806 Yle Teksti-TV https://yle.fi/aihe/tekstitv?P=806#14 FixC cooperative exhibits works from VILKE collection and from MUTA collection in Poriginal Gallery, Pori 21.9-8.10.2024. The name of the exhibition reflects the years of operation of the FixC cooperative up to the time of the exhibition. The exhibition presents a wide selection of high-quality art from the Museum of Teletext Art (MUTA) and the VILKE collection. Among the artists of the MUseum of Teletext Art, the world’s only teletext art museum founded in 2014 by the FixC cooperative, you can find e.g. Software art pioneer LIA, renoun media hacking duo ÛBERMORGEN and the master of mecanografía expandid Raquel Meyers. Philip von Knorring, Mika Taanila, Pekka Nevalainen, mfx, Alli Savolainen, Maria Duncker, Jimi Tenor, Heidi Kilpeläinen A.K.A. HK119 and Marjatta Oja. LIA, Karin Ferrari, Jarkko Räsänen, Seppo Renvall, Kari Yli-Annala, Erkka Nissinen, Paula Lehtonen, ÜBERMORGEN, Ryo Ikeshiro, Raquel Meyers, Kathrin Günter, Dragan Espenschied, Ian Gouldstone, Juha van Ingen, Max Capacity, Emilie Gervais, Karin Andersen, Bakketun & Norum, Dan Farrimond, Karin Ferrari, Maria Lavman Vetö, Karin Andresson, Mad as Hell and Max Haarich. As part of the exhibition, a series of new works will be presented on the Museum of Teletext Art pages on YLE Teletext (starting on pages 803, 805, and 806) from July to the end of December. These works are by Paula Lehtonen, Karin Ferrari, Max Haarich, Ryo Ikeshiro, Raquel Meyers, and Erkka Nissinen."
