["https://www.raquelmeyers.com/interlude-p21-seoul"]
title = "Interlude @ P21 [2022] – raquel meyers"
description = "P21 [Seoul] Emmy Skensved / Raquel Meyers Interlude 2022. 11. 26. – 2023. 01. 07 Curated by Zachary Williams An interlude in a book offers an opportunity to diverge from the story’s central narrative. Beyond its literary function, an interlude is a window in time, it can be a break, a moment in crisis to find peace or a place for reflection. In this exhibition, an interlude is the crossing of paths of artists Emmy Skensved and Raquel Meyers. Both artists presented in this exhibition took part in the 2022 SeMA Nanji Residency. As part of this residency, artists have time to weave their practice with the material and intellectual landscape in Korea over a 3 month period. This culminated in the 2022 SeMA Nanji Residency Open Studio and exhibition titled All Together Now.In P1, Emmy Skensved’s works titled Holed Up offer a solution to an insecure landscape. Her works acknowledge that within both urban and natural environments our security is not guaranteed and we require progressive solutions. These works force us to consider our relationship to the city and the spaces we inhabit. The soft and functional appearance of Skensved’s works can also lure us into the fantasy of our own personal interlude; camping in nature and being able to escape the perceived chaos of the city. Outdoor recreation gear found new practical and symbolic relevance during the covid pandemic, people all over the world sought solutions to safely enjoy their free time away from large crowds. In P2, Raquel Meyers provides a layered documentation of a potential urban context for Skensved’s works. She presents an installation comprising animation, sound, textile, text, and photography as part of her on-going series: Concrete Redundancy. In this iteration, produced during the residency, Meyer’s continues her exploration of the ethereal, material and symbolic qualities of concrete. These explorations have taken her from her hometown in Spain, to the Platteforum residency in Denver, Colorado USA and now onto Seoul. Through her eyes, Seoul’s modern past is rendered in this gray miracle material. Concrete can offer us security; it also cracks and transforms, proving as mortal as our own corporeal forms. The work by both Meyers and Skensved play off one another, each offering us a lens in which to view the urban landscape around us, in this case Seoul. 막간(Interlude)은 이야기의 중심적인 서술에서 벗어나는 기회, 잠시동안의 환기를 제공한다. 단순히 문학적 기능을 넘어서, 막간은 시간의 창이 될 수 있고, 휴식일 수도 있고, 위기의 순간 찾아오는 평화 일 수도 있고, 성찰의 장소일 수도 있다. 이번 전시회에 두 작가는 모두 2022년 서울시립미술관 난지 레지던시에 참여했다. 레지던시의 일환으로, 작가들은 3개월에 걸쳐 한국의 물질적이고 지적인 풍경과 함께 그들의 작업을 엮는 시간을 가졌고, 레지던시 오픈 스튜디오와 All Together Now 전시회에서 절정에 달했다. 이번 전시 ‘Interlude’는 두 작가 Emmy Skensved와 Raquel Meyers가 서로 교차되는 지점, 잠시 쉬어가는 막간의 순간이다. P1에 전시된 Emmy Skensved의 ‘Holded Up’시리즈는 불안정한 풍경에 대한 해결책을 제시한다. 그녀의 작품들은 도시와 자연 환경 모두에서 우리의 안전이 보장되지 않으며 진보적인 해결책이 필요하다는 것을 이야기하면서 현재 우리가 살고 있는 도시와 상호 관계를 생각해보도록 이끈다. 작품 외적으로 명확하게 보여지는 기능적인 특징과 부드러운 질감은 잠시 도시의 혼란에서 벗어날 수 있도록 잠시동안 자연의 환상 속으로 유인하는 듯 하다. 아웃도어 장비는 코로나 팬데믹 동안 빽빽한 도시로부터 안전하게 삶을 즐길 수 있는 하나의 해결책을 제시함으로써, 새롭고 실용적이며 상징적인 연관성을 가진다. P2에서 Raquel Meyers는 Emmy Skensved의 작품에 한 층 더 잠재적인 맥락을 제공한다. 그녀는 애니메이션, 소리, 섬유, 글, 사진으로 구성된 설치를 보여준다. 그녀의 콘크리트의 물질적, 상징적 특성에 대한 연구는 고향 스페인에서부터 미국 콜로라도주 덴버에 있는 플랫포룸 레지던스, 그리고 현재 서울로 이어지며, 그녀의 눈으로 바라보는 생경한 서울의 모습을 콘크리트라는 기적의 회색 소재로 그려낸다. 콘크리트는 우리에게 안식처를 제공하는 건축의 한 재료로 볼 수 있으나, 그것은 우리 인간의 몸처럼 갈라지고 변형되는 치명적인 위험요소를 내포하고 있다는 사실을 그녀의 연구를 통해서 우리에게 일깨운다. 이번 전시를 통해 Emmy Skensved와 Raquel Meyers의 작품들은 각각의 공간에서 서로 충돌하고 때로는 섞이면서 각자의 눈으로 우리 주변, 특히 서울의 풍경을 볼 수 있는 새로운 ‘막간(Interlude)’을 제시한다. 글 Zachary Williams 번역 이혁인"
