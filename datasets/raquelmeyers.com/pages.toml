["https://www.raquelmeyers.com/estas-obsoleta-2024"]
title = "Estás obsoleta @ Centro Cultural Ramón Alonso Luzzy [2024] – raquel meyers"
description = "ESTÁS OBSOLETA Atworks_ Raquel Meyers. Comisario_Salvi Vivancos Centro Cultural Ramón Alonso Luzzy, Cartagena, ES Del 17 de abril al 2 de junio de 2024.Estás obsoleta es una exposición work-in-progress que surge de la colaboración de Rakel Meyers (artworks) y Salvi Vivancos (curator). Se trata de dos coleccionistas de una misma generación, que se han dedicado durante largo tiempo a preservar esos equipos domésticos obsoletos que de una manera u otra han quedado inutilizados por el frenético ritmo de los avances tecnológicos y los hábitos de consumo de la sociedad.Estás obsoleta presenta estas máquinas en sí mismas como si de piezas de arte se tratara y los muestra a la manera de obras pictóricas o escultóricas. Repentinamente, mediante un ejercicio de rescate y ordenación objetos en desuso y sin aparente valor vuelven a tener una utilidad, se podría decir tal vez que no demasiado práctica. Pero este ensalzamiento no se trata de un proceso meramente simbólico, sino  que estos equipos se van a convertir en el soporte funcional para la obra de Rakel Meyers. Un trabajo creativo basado en la propia reutilización de esta tecnología y de sus modos, pero a la que Rakel le incorpora otras formas de hacer, su artesanía digital.Digital no solo porque utiliza la informática para sus creaciones, aunque en la forma del software y hardware más primitivo a su alcance, sino también porque es a través de una pulsión consciente con cada uno de sus dedos que sus ideas se transmiten a la pantalla.  Una meditación cercana a lo monacal, en la que la transferencia de sus ideas se transcribe de manera directa a cada pixel a través del teclado, sin dejar espacio a la mediación de la rapidez que exige lo inmediato.Pero Estás Obsoleta es más que la confrontación de todo lo anterior, es una propuesta a la participación e invita a quienes quieran ser parte de este montaje expositivo en constante evolución a aportar sus propios equipos obsoletos y a participar en las diversas actividades que irán sucediendo desde hoy hasta el próximo 2 de junio.Texto, Salvi Vivancos                      Fotos @ Ark Saiz"
full_description = "ESTÁS OBSOLETA Atworks_ Raquel Meyers. Comisario_Salvi Vivancos Centro Cultural Ramón Alonso Luzzy, Cartagena, ES Del 17 de abril al 2 de junio de 2024. Estás obsoleta es una exposición work-in-progress que surge de la colaboración de Rakel Meyers (artworks) y Salvi Vivancos (curator). Se trata de dos coleccionistas de una misma generación, que se han dedicado durante largo tiempo a preservar esos equipos domésticos obsoletos que de una manera u otra han quedado inutilizados por el frenético ritmo de los avances tecnológicos y los hábitos de consumo de la sociedad. Estás obsoleta presenta estas máquinas en sí mismas como si de piezas de arte se tratara y los muestra a la manera de obras pictóricas o escultóricas. Repentinamente, mediante un ejercicio de rescate y ordenación objetos en desuso y sin aparente valor vuelven a tener una utilidad, se podría decir tal vez que no demasiado práctica. Pero este ensalzamiento no se trata de un proceso meramente simbólico, sino que estos equipos se van a convertir en el soporte funcional para la obra de Rakel Meyers. Un trabajo creativo basado en la propia reutilización de esta tecnología y de sus modos, pero a la que Rakel le incorpora otras formas de hacer, su artesanía digital. Digital no solo porque utiliza la informática para sus creaciones, aunque en la forma del software y hardware más primitivo a su alcance, sino también porque es a través de una pulsión consciente con cada uno de sus dedos que sus ideas se transmiten a la pantalla. Una meditación cercana a lo monacal, en la que la transferencia de sus ideas se transcribe de manera directa a cada pixel a través del teclado, sin dejar espacio a la mediación de la rapidez que exige lo inmediato. Pero Estás Obsoleta es más que la confrontación de todo lo anterior, es una propuesta a la participación e invita a quienes quieran ser parte de este montaje expositivo en constante evolución a aportar sus propios equipos obsoletos y a participar en las diversas actividades que irán sucediendo desde hoy hasta el próximo 2 de junio."
