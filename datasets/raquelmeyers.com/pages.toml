title = "The Murcianer #7 – raquel meyers"
description = "The Murcianer #7Desde The Murcianer queremos presentar y visualizar a los artistas encargados de elaborar cada una de las portadas. Reivindicamos la importancia del artista visual en un mundo que se rige cada vez más por la imagen. Ellos son los responsables de ilustrar los libros, cómics y revistas que lees, de la ropa que te pones, de la película de dibujos que ves, de los videojuegos a los que juegas, de tu bebida favorita, o del anuncio que ves en TV o internet…🎨 Nuestra nueva portada 7 viene de la mano de la artista visual e ilustradora Cartagenera: @rakelmeyers“He utilizado el teletexto para ilustrar cómo La Manga será sumergida por los lodos del Mar Menor debido a la codicia humana, urbanística, política y del sector primario y agropecuario”.Raquel trabaja con las llamadas tecnologías obsoletas como el Commodore 64, el teletexto, la máquina de escribir o el fax para combatir y criticar la tiranía del régimen tecnocrático solucionista y el narcisismo electrocutado.Pronto más cosicas interesantes sobre Raquel !! ;)#themurcianer #raquelmeyers #murcia #murciaquehermosaeres #lamanga #limon #ilustracion #ilustración #ilustraciones #ilustradora #ilustradores #ilustracioneditorial #revista #illustration #illustrations #spain #illustrator #editorialillustration #magazine #landscape #cartagena #sosmarmenor #playa #beach #regiondemurciaDesde The Murcianer queremos presentar y visualizar a los artistas encargados de elaborar cada una de las portadas. Reivindicamos la importancia del artista visual en un mundo que se rige cada vez más por la imagen. Ellos son los responsables de ilustrar los libros, cómics y revistas que lees, de la ropa que te pones, de la película de dibujos que ves, de los videojuegos a los que juegas, de tu bebida favorita, o de la publicidad que ves en TV o internet…Autora de la portada 7: @rakelmeyersLa Cartagenera Raquel Meyers vive a medio camino entre Cartagena e Irún (País Vasco).Trabaja con tecnologías obsoletas como el Commodore 64, Teletexto, máquinas de escribir o fax mezcladas con fotografía, animación y bordado, entre otras técnicas. Define su práctica como KYBDslöjd [mecanografía expandida] cuyo significado puede describirse aproximadamente como <una habilidad manual con un teclado>. Se basa en y hace referencia a la máquina de escribir, la poesía concreta, la demoscenia y el brutalismo. Las pulsaciones de teclas contribuyen a la ejecución, mientras que la poesía contribuye a un sistema, al revelar la arquitectura de PETSCII, el conjunto de personajes crudo y sin adornos de Commodore 64. Su trabajo ha sido mostrado en centros de arte, galerías y festivales nacionales e internacionales.Y para añadir otro dato curioso, también es la vocalista de la mítica banda de hardcore cartagenera @milkhouse.hxc que llevan repartiendo cera desde finales de los 90!Desliza la imágenes para ver las preguntas que le hicimos a Raquel!Foto: Como siempre nuestro querido capo de la fotografía @leantedit#themurcianer #raquelmeyers #cartagena #murcia #murciaquehermosaeres #lamanga #ilustracion #ilustración #ilustradora #ilustrador #ilustradores #artistavisual #revista #illustration #illustrations #spanishillustrator #spain #editorialillustration #magazinecover #portrait #retrato #regiondemurcia #hormigónplayero"
full_description = "Desde The Murcianer queremos presentar y visualizar a los artistas encargados de elaborar cada una de las portadas. Reivindicamos la importancia del artista visual en un mundo que se rige cada vez más por la imagen. Ellos son los responsables de ilustrar los libros, cómics y revistas que lees, de la ropa que te pones, de la película de dibujos que ves, de los videojuegos a los que juegas, de tu bebida favorita, o del anuncio que ves en TV o internet… 🎨 Nuestra nueva portada 7 viene de la mano de la artista visual e ilustradora Cartagenera: @rakelmeyers “He utilizado el teletexto para ilustrar cómo La Manga será sumergida por los lodos del Mar Menor debido a la codicia humana, urbanística, política y del sector primario y agropecuario”. Raquel trabaja con las llamadas tecnologías obsoletas como el Commodore 64, el teletexto, la máquina de escribir o el fax para combatir y criticar la tiranía del régimen tecnocrático solucionista y el narcisismo electrocutado. #themurcianer #raquelmeyers #murcia #murciaquehermosaeres #lamanga #limon #ilustracion #ilustración #ilustraciones #ilustradora #ilustradores #ilustracioneditorial #revista #illustration #illustrations #spain #illustrator #editorialillustration #magazine #landscape #cartagena #sosmarmenor #playa #beach #regiondemurcia Desde The Murcianer queremos presentar y visualizar a los artistas encargados de elaborar cada una de las portadas. Reivindicamos la importancia del artista visual en un mundo que se rige cada vez más por la imagen. Ellos son los responsables de ilustrar los libros, cómics y revistas que lees, de la ropa que te pones, de la película de dibujos que ves, de los videojuegos a los que juegas, de tu bebida favorita, o de la publicidad que ves en TV o internet… La Cartagenera Raquel Meyers vive a medio camino entre Cartagena e Irún (País Vasco).Trabaja con tecnologías obsoletas como el Commodore 64, Teletexto, máquinas de escribir o fax mezcladas con fotografía, animación y bordado, entre otras técnicas. Define su práctica como KYBDslöjd [mecanografía expandida] cuyo significado puede describirse aproximadamente como <una habilidad manual con un teclado>. Se basa en y hace referencia a la máquina de escribir, la poesía concreta, la demoscenia y el brutalismo. Las pulsaciones de teclas contribuyen a la ejecución, mientras que la poesía contribuye a un sistema, al revelar la arquitectura de PETSCII, el conjunto de personajes crudo y sin adornos de Commodore 64. Su trabajo ha sido mostrado en centros de arte, galerías y festivales nacionales e internacionales."
