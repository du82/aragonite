n perspective by using different dots, the music playing in the background, and the mysterious storytelling that felt as if in a strange dream. On the other hand, we felt its raw expression to be dark and gloomy, regardless of the artist’s intentions. We would have liked to see a development in the story that betrayed this feeling to show light and hope to the audience."
