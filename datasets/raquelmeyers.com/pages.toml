["https://www.raquelmeyers.com/biblioteca-reciproca-el-almarjal-2023"]
title = "Biblioteca Recíproca El Almarjal @ MUCHO MÁS MAYO [2023] – raquel meyers"
description = "4th-14th may 2023 // Festival de Arte Emergente MUCHO MÁS MAYO, Cartagena, ES MEJOR CON MENOS. Prácticas artísticas y ética de la sobriedad muchomasmayo.cartagena.esInstalación móvil multiplataforma y proyecto colaborativo. Raquel Meyers, 2023 Es un proyecto reflexiona sobre la obsolescencia y la memoria del barrio del Ensanche [la denominada Área 2, delimitada por las calles Esparta, Ronda Ciudad de La Unión, Jorge Juan, Alameda de San Antón y Paseo Alfonso XIII], cuya intención es documentar su diversidad y colectivizar objetos, recursos inmateriales, habilidades, afectos, conocimientos y saberes de las personas que lo habitan. Es un proyecto colaborativo donde se invita a cualquier persona a compartir sus conocimientos, anécdotas, historias, sucesos…_del barrio _de los vecinos y vecinas _de las personas que ya no están _de los sitios que han desaparecido _de lo nuevo _de lo viejo _del pasado _del presente _del futuro …El proyecto es móvil y utiliza unos dispositivos, Las Carritas han sido diseñadas y producidas en colaboración con Maria del Mar Melgarejo y los alumnos de la asignatura de “Taller de Diseño I” del curso 2022-2023 utilizando materiales reciclados.Cuadernillos de la Biblioteca Recíproca El Almarjal  Parte I, Parte II, Parte III, Parte IV…Los cuadernillos físicos pueden consultarse en La Carrita instalada en la Biblioteca Josefina Soria del centro cultural Ramón Alonso Luzzy de Cartagena.4th-14th may 2023 // Instalación de la Biblioteca Recíproca El Almarjal en uno de los kioscos cerrados del Ensanche Localización: Esquina calle Alfonso XIII con Ángel Bruna [en frente de fotos Pencho]    12th may 2023 // Las Carritas de la Biblioteca Recíproca El Almarjal Presentación de las carritas realizadas por estudiantes de Taller de diseño I. Grado de ingeniería de diseño Industrial y desarrollo de producto (ETSII) UPCT Universidad Politécnica de Cartagena. Impartido por las profesoras Mar Melgarejo y María José Muñoz para el festival Mucho Más Mayo en Cartagena.    13th may 2023 // Paseo taller de la Biblioteca Recíproca El Almarjal en colaboración con Leticia M Carcelén [Anse. Asociación de Naturalistas del Sureste]      14th may 2023 // Ensanchando la calle con la Biblioteca Recíproca El Almarjal Invitado especial, Maestro Almarjal        Photos Arkaitz SaizFrom 15th may 2023 // Biblioteca Recíproca El Almarjal en la Biblioteca Josefina Soria del centro cultural Ramón Alonso Luzzy."
