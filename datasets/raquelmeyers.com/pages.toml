title = "불필요한 콘크리트 [Concrete Redundancy] @ SeMA Nanji 2022 – raquel meyers"
description = "September-October-November 2022 // SeMA Nanji Residency/Nanji 人 (in) Raquel Meyers 서울시립미술관 Seoul Museum of Art + Fundación BilbaoArte Fundazioa Project: 불필요한 콘크리트 [Concrete Redundancy] https://sema.seoul.go.kr https://bilbaoarte.org/Artists/raquel-meyers-sema-nanji-residency/Concrete Redundancy is a temporary raw habitat for the times we are living, a picnic by the Anthropocene. I feel that there is a brutal dilemma between care and redundancy that we can no longer avoid, the poetics of the 2020s. What awaits us is a techno-medieval version of the world where all stored knowledge and memory will be reduced to premium access or will simply disappear leaving “the cloud” in ruins. Humans will be reduced, not to relics, but techno-rubble; an Anthropocene souvenir for the future.불필요한 콘크리트 is a tool for the struggle, it refers to and uses Brutalism, photography, memory, technology, rubble, and the obsolete as its framework. Redundancy is the state of not being necessary or useful;  Concrete is a material that, like technology and humanity, is built-in obsolescence.    Meyers, R. (2022). 불필요한 콘크리트 [Concrete Redundancy] SeMA Nanji Residency. 48 pages, B&W Raquel Meyers [Concept, Text, Photographies, Teletext Graphics & Design] Sharifa Moore [Text Editor] Hanbum Lee [Printing Management] Intime, Seoul [Printing]     11th-13th november 2022 // 2022 SeMA NANJI RESIDENCY_ Open Studio: Tourism (Seoul) https://sema.seoul.go.kr/kr/whatson/exhibition/detail?exNo=1106217강호연, 권도연, 권아람, 김세은, 김웅용, 나오미, 듀킴, 문이삭, 박관택, 박선호, 손현선, 송세진, 안상훈, 이민지, 이유성, 이은솔, 이은실, 장파, 전보경, 정희민, Emmy Skensved, Laia Ventayol-Garcia, Mathieu Latulippe, Raquel Meyers, Timo Andersson – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – 국외입주자 기획전 《All Together Now》: 11. 11.(금) – 13.(일), 13:00 – 19:00 Emmy Skensved, Laia Ventayol-Garcia, Mathieu Latulippe, Raquel Meyers, Timo Andersson – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – 난지미술창작스튜디오 x 고양레지던시 〈RtoR Express〉: 11. 12.(토) – 13.(일), 14:30 – 17:10 *〈RtoR Express〉는 사전 예약 및 현장 등록을 통해 참여 가능합니다. – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – – –"
