title = "Digerati Emergent Media Festival + Denver Digerati Residency [2023] – raquel meyers"
description = "Digerati Emergent Media Festival, Denver, US https://denverdigerati.org/festival Saturday, Sept 16 2023 Live Performance @ Evans School, Denver, USDigerati Emergent Media Festival 2023 Donde todo arde / Where Everything BurnsWe are on rampant like a wildfire. Extreme weather, earthquakes, floods… are becoming mostly everyday news. The global Heat Records in July, Canada’s Record Wildfires, Greece wildfire declared largest ever recorded in Europe … We are living in the “Pyrocene”i, a term coined by the American environmental historian Stephen Pyne. The fire age where everything is for burning.Donde todo arde / Where Everything Burns is a Live Performance use Teletext News regarding Climate Change and Technology from the Teletext Public Television Service from Europe (Spain, Portugal, Germany, Sweden… among others) that they have been archived since the early 2021s, mixed with animations create with the Personal Computer Commodore 64.Meyers uses a particular way of working with keystrokes and PETSCII on the Commodore 64 with software developed by Mathman (Johan Kotlinski) called Nop. The program consists of two parts: a block of data statements containing the instructions (where all the keystrokes are recorded), and a section of code, which reads the data and outputs the animation. There is no menu, so all the instructions; like color, position, and character shape are typed on the keyboard. A black screen with a blinking cursor is the starting point to build graphics and animations, character by character. This process is like cross-stitch, a form of counted thread embroidery, or the typewriter technique, both not allowing for corrections. Any unintended strikes force the user to start all over again.The sound was made by her alter ego Hormigón playero using NintendoDS, BOSS ME-20B, GameBoy, Zoom H5, Audacity.Photos by Arkaitz SaizSeptember 2023 // Denver Digerati, Artist in Residency at Evans School, Denver, US Welcome to the Here and Now 2023 denverdigerati.orgWe stand at a remarkable crossroads in the world of digital arts. A momentous wave of experimentation and innovation has engulfed the creative landscape, ushering in a new era of artistic expression and experiences. With great enthusiasm and excitement, we invite you to join us for our eighth festival, where we celebrate the vibrant landscape of emergent media and embrace the possibilities of the present moment.Our theme, “Welcome to the Here and Now,” encapsulates the essence of the feeling we aim to cultivate within our community. We believe in the power of the digital arts to transcend boundaries and capture the zeitgeist of the time. In this fast-paced world of ever-evolving technologies and interconnectedness, the boundaries between the physical and the digital, the virtual and the real, are increasingly blurred.Join us as we witness the convergence of art and technology and celebrate the audacity and ingenuity of the here and now. Welcome to the future of storytelling."
full_description = "Digerati Emergent Media Festival, Denver, US https://denverdigerati.org/festival Saturday, Sept 16 2023 Live Performance @ Evans School, Denver, US We are on rampant like a wildfire. Extreme weather, earthquakes, floods… are becoming mostly everyday news. The global Heat Records in July, Canada’s Record Wildfires, Greece wildfire declared largest ever recorded in Europe … We are living in the “Pyrocene”i, a term coined by the American environmental historian Stephen Pyne. The fire age where everything is for burning. Donde todo arde / Where Everything Burns is a Live Performance use Teletext News regarding Climate Change and Technology from the Teletext Public Television Service from Europe (Spain, Portugal, Germany, Sweden… among others) that they have been archived since the early 2021s, mixed with animations create with the Personal Computer Commodore 64. Meyers uses a particular way of working with keystrokes and PETSCII on the Commodore 64 with software developed by Mathman (Johan Kotlinski) called Nop. The program consists of two parts: a block of data statements containing the instructions (where all the keystrokes are recorded), and a section of code, which reads the data and outputs the animation. There is no menu, so all the instructions; like color, position, and character shape are typed on the keyboard. A black screen with a blinking cursor is the starting point to build graphics and animations, character by character. This process is like cross-stitch, a form of counted thread embroidery, or the typewriter technique, both not allowing for corrections. Any unintended strikes force the user to start all over again. The sound was made by her alter ego Hormigón playero using NintendoDS, BOSS ME-20B, GameBoy, Zoom H5, Audacity. We stand at a remarkable crossroads in the world of digital arts. A momentous wave of experimentation and innovation has engulfed the creative landscape, ushering in a new era of artistic expression and experiences. With great enthusiasm and excitement, we invite you to join us for our eighth festival, where we celebrate the vibrant landscape of emergent media and embrace the possibilities of the present moment."
