["https://www.raquelmeyers.com/medialive-bmoca"]
title = "MediaLive: Technology as Healing @ BMoCA [2023-2024] – raquel meyers"
description = "MediaLive: Technology as Healing [2023-2024] October 12 – January 14, 2024 BMoCA. Boulder Museum of Contemporary Art.Mirela Alistar / Ále Campos / Eceertrey / Thessia Machado / Cherish Marquez / Sophia Mehdizadeh with support from the Brain Music Lab / Raquel Meyers in partnership with Denver Digerati / Rory ScottCuando la casa se quema, la obsolescencia es resistencia [When the House Burns Down, Obsolescence is Resistance] Raquel Meyers [2023] Duration: 2 min 8 CRT televisions, 1 Raspberry Pi 4 housing the animated content made on Commodore 64, RCA splitter and cables. Sound by Hormigón Playero [NintendoDS, BOSS ME-20B, GameBoy, Zoom H5, Audacity] Live Type In animation made on Commodore 64 by Raquel Meyers.Technology as awareness, awareness as empathy, empathy as healing, healing as change. From our earliest stone tools to the advent of AI, technology is a catalog of human innovation. MediaLive explores the synergies between art and technology as instruments of positive change for our collective future.This exhibition features the work of 8 artists who explore different forms of technology as solution-based methods for grappling with the complex global challenges of our time. With a broad range of artistic mediums, MediaLive addresses issues of self-identity, biomaterials, shared digital spaces, sonic empathy, and obsolescence. Through their seemingly disparate practices, the artists reveal the undeniable possibilities of healing through technology. MediaLive presents various interpretations of how we can transform art practices into sustainable action.MediaLive: Technology as Healing is generously supported by the Boulder Arts Commission, an agency of the Boulder City Council. BMoCA’s annual exhibition fund is graciously underwritten by the Kemper Family Foundations, UMB Bank, n.a., Trustee, the Scintilla Foundation, Lynn McGowin, City of Boulder, Boulder Arts Commission, and Scientific & Cultural Facilities District.  ATLAS Institute at University of Colorado Boulder and Denver Digerati are key partners in the 2023 iteration of MediaLive: Technology As Healing."
