title = "Elige tu propia normalidad * Aukeratu zeure normaltasuna * Choose your own normality [2021-2022] – raquel meyers"
description = "https://eligetupropianormalidad.com/“Choose your own normality” is a project by Borja Crespo & Raquel Meyers with the support and guidance of Azkuna Zentroa – Alhóndiga Bilbao (ES), within the framework of its Babestu programe. An extraordinary call to support contemporary creation.What is normality? Nobody knows. Not you, not me. No one. That’s why it has to be invented. It has to be created. That’s the reason behind the hard sell. It has to be sold. As if it were a new dress that one wears. It´s difficult, if not impossible, to define and constrain normality in these turbulent times, in the midst of a pandemic crisis. Are these new times, marked by uncertainty, really new? Those people who dedicate their existence to the wonderful world of culture, in all its forms and expressions, are in the midst of a tsunami which has turned everything upside down. “And now, what?” Do we shuffle the pack? Do we reset? Do we adapt to whatever comes next? Do we create our own normality? Do we want, deep down, to live a dystopia? Even if it’s a B-series or Z-series dystopia? When destiny catches up with us, if there is destiny, only a clear line of thought can ease our consciences: my reality is mine, and I share it, just like my freedom, but nobody is going to disregard my idea of normality, which is personal and non-transferable. Choose your own normality. There are millions and millions. Right now, at this very moment, hundreds of thousands and thousands are being created. Little by little, slowly but surely.“Choose your own normality” arose from the urgency of a critical reflection on the new perspectives on a future that nobody can decipher, beyond the unfathomable influence of the digital. Life on the internet, without the internet. The project intends to create a space for dialogue and criticism in these pandemic times of change, which perhaps is not such, of “hollow” transformation and “superficial” goals. It rushes to expose new futuristic visions which come very close to the dystopias of the collective imagination, handling concepts as diverse as resilience, picture-in-picture (PiP), white noise, digital fatigue, the theory of the black swan, the invisible……Convocatoria / Deialdia / Open Call *.txt >>> PINCHA AQUÍ / SAKATU HEMEN / CLICK HERE ⇛ ⇨ ⇒ ↳ ↦ → RHIZOME Events:8th february 2022 // Book presentation ‘Choose your Own Normality’ Project @ Mediateka BBK – Azkuna Zentroa Alhóndiga Bilbao, ES    8th-9th february 2022 // Fanzine Workshop ‘Choose your Own Normality’ @ Mediateka BBK – Azkuna Zentroa Alhóndiga Bilbao, ES      16th september 2021 // Open Door Day To Artistic Creation @ Azkuna Zentroa Alhóndiga Bilbao, ES      23th-25th april 2021 // Libros Mutantes RSPV – Madrid Art Book Fair @ La Casa Encendida (Madrid) https://www.lacasaencendida.es/proyectos/libros-mutantes-2021-12429      Photos by Arkaitz SaizPublication:ELIGE TU PROPIA NORMALIDAD – AUKERATU ZEURE NORMALTASUNA – CHOOSE YOUR OWN NORMALITY’, the book. Paperback, A5, color, 94 pages, Spanish >>> →PDF Design by Raquel Meyers Production by Azkuna Zentroa – Alhóndiga Bilbao, ES  Fanzines:‘ZINE 001  / 02.2021 >> Two A4 Print on Both Sides PDF to print [Spanish]‘ZINE 002  / 04.2021 >> Four A4 Print on Both Sides PDF to print [Spanish]‘ZINE 003  / 04.2021 >> One A4 Print on Both Sides PDF to print [Spanish] Special Edition + Risograph printing by Raquel Meyers in collaboration with Another Press & Azkuna Zentroa for Libros Mutantes RSPV – Madrid Art Book Fair 2021 @ La Casa Encendida , Madrid, ES.‘ZINE 004  / 06.2021 >> Two A4 Print on Both Sides PDF to print [Spanish] Zine + floppyzine *.adf‘ZINE 005  / 09.2021 >> Two A4 Print on Both Sides PDF to print [Spanish]"
full_description = "“Choose your own normality” is a project by Borja Crespo & Raquel Meyers with the support and guidance of Azkuna Zentroa – Alhóndiga Bilbao (ES), within the framework of its Babestu programe. An extraordinary call to support contemporary creation. What is normality? Nobody knows. Not you, not me. No one. That’s why it has to be invented. It has to be created. That’s the reason behind the hard sell. It has to be sold. As if it were a new dress that one wears. It´s difficult, if not impossible, to define and constrain normality in these turbulent times, in the midst of a pandemic crisis. Are these new times, marked by uncertainty, really new? Those people who dedicate their existence to the wonderful world of culture, in all its forms and expressions, are in the midst of a tsunami which has turned everything upside down. “And now, what?” Do we shuffle the pack? Do we reset? Do we adapt to whatever comes next? Do we create our own normality? Do we want, deep down, to live a dystopia? Even if it’s a B-series or Z-series dystopia? When destiny catches up with us, if there is destiny, only a clear line of thought can ease our consciences: my reality is mine, and I share it, just like my freedom, but nobody is going to disregard my idea of normality, which is personal and non-transferable. Choose your own normality. There are millions and millions. Right now, at this very moment, hundreds of thousands and thousands are being created. Little by little, slowly but surely. “Choose your own normality” arose from the urgency of a critical reflection on the new perspectives on a future that nobody can decipher, beyond the unfathomable influence of the digital. Life on the internet, without the internet. The project intends to create a space for dialogue and criticism in these pandemic times of change, which perhaps is not such, of “hollow” transformation and “superficial” goals. It rushes to expose new futuristic visions which come very close to the dystopias of the collective imagination, handling concepts as diverse as resilience, picture-in-picture (PiP), white noise, digital fatigue, the theory of the black swan, the invisible……"
