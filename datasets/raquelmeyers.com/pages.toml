title = "Cáceres Abierto [2023] – raquel meyers"
description = "Obsolescencia es resistencia. El futuro de Internet es el teletexto Teletext Workshop @ IES Al-Qázeres Artistic Bachelor Students [22th-24th March 2023] 28th April – 18th June 2023 @ Sala de Arte El Brocense, Cáceres Abierto, Cáceres, ES https://www.caceresabierto.com[ES] El teletexto es una tecnología obsoleta que sigue funcionando en la Unión Europa como servicio de información e de interacción para acceder a sus contendidos. Una tecnología pre internet cuyas limitaciones se convierten en posibilidades ya que utiliza hardware y software libre para su producción y programación. El uso de tecnologías ‘obsoletas’ o antiguas hace que tengamos que posicionarnos en medio de una encrucijada tecnológica. Desde la perspectiva del utopismo tecnológico propuesta por el evento, Raquel Meyers propone la generación de un teletexto autónomo y funcional de forma colectiva, con los alumnos del Bachillerato Artístico del IES AlQazeres y la colaboración del profesor Jesús Vázquez. Los resultados podrán verse en tres formatos: Televisión (formato original), Fanzine y contrapublicidad (insertado en pantalla publicitaria de calle).Teletext Online Version > raquelmeyers.com/ccA23/100.html    [EN] Teletext is an obsolete technology that continues to function in the European Union as an information and interaction service to access its contents. A pre internet technology whose limitations become possibilities because it uses hardware and free software for its production and programming. The emplee of ‘obsolete’ or old technologies means that we have to position ourselves at a technological crossroads. From the perspective of the technological utopism proposed by the event, Raquel Meyers proposes the generation of an autonomous and functional teletext collectively, with students of the Artistic Baccalaureate of the IES AlQazeres and the collaboration of Professor Jesús Vázquez. The results can be seen in three formats: Television (original format), Fanzine and counter-publication (inserted in street advertising screen).    Full Program [PDF]"
full_description = "Obsolescencia es resistencia. El futuro de Internet es el teletexto Teletext Workshop @ IES Al-Qázeres Artistic Bachelor Students [22th-24th March 2023] 28th April – 18th June 2023 @ Sala de Arte El Brocense, Cáceres Abierto, Cáceres, ES https://www.caceresabierto.com [ES] El teletexto es una tecnología obsoleta que sigue funcionando en la Unión Europa como servicio de información e de interacción para acceder a sus contendidos. Una tecnología pre internet cuyas limitaciones se convierten en posibilidades ya que utiliza hardware y software libre para su producción y programación. El uso de tecnologías ‘obsoletas’ o antiguas hace que tengamos que posicionarnos en medio de una encrucijada tecnológica. Desde la perspectiva del utopismo tecnológico propuesta por el evento, Raquel Meyers propone la generación de un teletexto autónomo y funcional de forma colectiva, con los alumnos del Bachillerato Artístico del IES AlQazeres y la colaboración del profesor Jesús Vázquez. Los resultados podrán verse en tres formatos: Televisión (formato original), Fanzine y contrapublicidad (insertado en pantalla publicitaria de calle). [EN] Teletext is an obsolete technology that continues to function in the European Union as an information and interaction service to access its contents. A pre internet technology whose limitations become possibilities because it uses hardware and free software for its production and programming. The emplee of ‘obsolete’ or old technologies means that we have to position ourselves at a technological crossroads. From the perspective of the technological utopism proposed by the event, Raquel Meyers proposes the generation of an autonomous and functional teletext collectively, with students of the Artistic Baccalaureate of the IES AlQazeres and the collaboration of Professor Jesús Vázquez. The results can be seen in three formats: Television (original format), Fanzine and counter-publication (inserted in street advertising screen)."
