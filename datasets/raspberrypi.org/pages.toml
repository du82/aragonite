title = "Teach, learn, and make with the Raspberry Pi Foundation"
description = "We are a charity with the mission to enable young people to realise their full potential through the power of computing and digital technologies."
full_description = "Enabling all young people to realise their full potential through computing AI education Discover world-leading curricula, resources, and professional development to support the teaching and learning of AI literacy. We bring together original research, industry expertise, and practical classroom experience to help you bring the excitement of AI into your classroom. Find out more Coding for kids Awesome activities to help young people learn to code and become tech creators. Learn to code Easy-to-follow guides to help kids learn how to build their own games, animations, apps, and websites with different software and hardware. Discover projectsopen_in_new Coolest Projects Online showcases and in-person events for young tech creators to share their projects, get feedback, and be inspired. View showcase galleryopen_in_new Your code in space The Astro Pi Challenge gives young people the opportunity to write programs and experiments that run on the International Space Station. Explore Astro Piopen_in_new Join or start a Code Club Code Club is a global movement of coding clubs where young people develop the confidence to get creative with digital technologies. “The best part of it is being able to interact with other people and to share ideas on projects.” – Young person, Liverpool Central Library Code Club Visit Code Clubopen_in_new Resources for teachers & schools We support teachers and schools with free, high-quality curricula, classroom resources, and professional development. Professional development for teachers open_in_new Free training and PD to help you develop the skills, knowledge, and confidence to teach computing. The Computing Curriculum arrow_forward A complete set of evidence-based classroom resources to teach computing. Experience AI open_in_new Lessons and practical activities to help young people understand AI and how it is changing the world. Ada Computer Science open_in_new A platform with everything you need to teach and learn computer science. Hello World arrow_forward The magazine for computing educators to share research, knowledge, and resources. Research Discover insights from the world’s leading computing education research, including teaching and learning of programming, gender balance, culturally relevant pedagogy, and AI education. Explore our research News Experience AI Experience AI: The story so far 27th Feb 2025 Education Teaching about AI - Teacher symposium 25th Feb 2025 Community Code Club: Empowering the Next Generation of Digital Creators 19th Feb 2025 Research Teaching about AI in K–12 education: Thoughts from the USA 13th Feb 2025 See all blog posts “When I started coding, I started to discover that it was very fun, I could create anything I wanted. My imagination was running wild.” Watch Jay’s story to see how this amazing young person is learning and teaching coding inspired by our initiatives. Read transcript Watch more stories Raspberry Pi computers From industries large and small, to the kitchen table tinkerer, to the classroom coder, Raspberry Pi Holdings plc make computing accessible and affordable for everybody. Visit raspberrypi.comopen_in_new"
