full_description = "Accessibility statement Our aim We are committed to making our websites more accessible and inclusive for everyone. This is an important part of our aim to ensure that everyone who visits a Raspberry Pi Foundation website feels welcome. What we are doing Our efforts to ensure that our websites are accessible and usable to the widest possible audience are based on best practice guidelines, specifically the Web Content Accessibility Guidelines (WCAG) 2.1 published by the World Wide Web Consortium (W3C). These guidelines explain how to make web content more accessible. The guidelines have three levels: A, AA, and AAA. As an organisation, we aim for Level AAA. Get in touch with us Although we are working to make the Raspberry Pi Foundation websites as accessible as possible, we appreciate that issues may arise. We are always happy to receive feedback. If you have experienced any difficulties, or if you enjoyed using our websites, please get in touch at accessibility@raspberrypi.org."
