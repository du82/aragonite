full_description = "Fixing MySQL Failed Startup in Ubuntu Server 14.04 January 8, 2015 When installing Ubuntu Server 14.04, you have the ability to automatically install and configure a LAMP stack. However, doing so in the latest build (as of 08/01/2015), seems to cause an ownership issue on a few directories that will prevent you from being able to actually start the service. Continue reading Using ZeroMQ with Node.js October 24, 2014 ZeroMQ (sometimes referred to as ØMQ) is an asynchronous messaging library which allows you to utilise a number of different patterns to fit the needs of a variety of scenarios and is capable of handling load balancing by itself, as can be seen in the demonstration video below. Continue reading Mining Dogecoin with a Zeusminer Blizzard and a Raspberry Pi September 15, 2014 Despite a lot of people claiming that mining cryptocurrency is dead and no longer profitable, it is still a fun thing to participate with and so I picked up a Zeusminer Blizzard (pictured below) on eBay to use with my Raspberry Pi to mine some Dogecoin. Continue reading Cross-fading Views in Android August 27, 2014 A new Android app I have recently been working on needed sprucing up a little bit yesterday and I’ve always found cross-fading between loading screens to be a nice, yet subtle, transitioning effect, so I put together a reusable class for it. Continue reading Solving Odd Camera Issues with Unity Dialogue System July 14, 2014 Earlier today, I purchased Dialogue System for Unity for a project I am working on that will require interactive dialogues as well as bark dialogues (dialogues that are not interactive, but occur on a trigger; such as you walking by someone). Continue reading Prev Next"
