full_description = "Reading the Room Temperature with an LM35 Sensor May 21, 2013 Today I’m going to show you how to hook up an LM35 temperature sensor and read the room temperature from it. Continue reading Using a 7 Segment LED Display w/ Arduino Uno May 19, 2013 I recently purchased an Arduino Uno starter kit which included a number of 7 segment LED displays (like the one pictured below), which were some what confusing for someone new to electronics and the Arduino itself. Continue reading Setting Default CurrentCulture in all Versions of .NET September 12, 2012 If you are using any version of .NET prior to 4.5, you will not have access to the handy property that is DefaultThreadCurrentCulture (or if you are using .NET 4.5 just stop reading here and use that property!). However, that does not mean you can’t set the default CultureInfo to be used across the current thread and all threads spawned afterwards in the one place. Continue reading C# XNA Per Pixel Collision Detection on Rotated Objects December 19, 2011 I’ve been working on a new project this week which requires per pixel collision detection, however all the game objects that I need to detect the collisions on need to be rotated dynamically which introduced a lot of trouble when trying to detect collisions. Continue reading Prev"
