full_description = "Kioptrix Level 2 CTF Walkthrough July 30, 2017 Service Discovery & Authentication BypassAn Nmap scan [nmap -sS -sV -T4 -Pn -vv 192.168.22.130] revealed a number of different services running on the machine and fingerprinted the machine as running CentOS: Continue reading Kioptrix Level 1 CTF Walkthrough July 30, 2017 Service DiscoveryAn Nmap scan [nmap -sS -sV -T4 -vv 192.168.22.128] revealed that the machine had a number of services running, most notably an old version of Apache and a Samba service. Continue reading FristiLeaks CTF Walkthrough July 29, 2017 FristiLeaks is a VM created by Ar0xA and has a difficulty rating of “basic”. The goal is to get root access and read the flag file. Continue reading Arabic Font <= 1.2 CSRF Stored XSS July 20, 2017 Due to a lack of CSRF mitigation and entity encoding in the output generated by `arabic-font.php` and `/inc/panel.php`, it is possible to store and execute scripts in the context of an admin user. Continue reading What's New in WPXF 1.6.1 June 18, 2017 This is the first time I have written a blog post regarding WordPress Exploit Framework. I’ve never felt the need to write one yet, but given some of the changes in the latest update that I have pushed to GitHub, it seemed fitting to do so now in order to update people on some of the bigger changes in v1.6.1. Continue reading Prev Next"
