title = "Glyphduino - An Arduino LCD Glyph Library"
full_description = 'What is it? Glyphduino is an easy to use Arduino library containing a number of premade glyphs that can easily be integrated into your own projects that utilise an LCD screen that is compatible with the LiquidCrystal library. Installation To install Glyphduino, simply Download Glyphduino and extract the Glyphduino folder that is inside the ZIP file into your libraries folder, which can be found inside the folder that the Arduino software is installed. For example, in Windows, this would typically be C:\Program Files (x86)\Arduino\libraries Code example Want to see just how easy it is? Check out the example sketch below! The sketch will look like this when you run it on your Arduino: Supported glyphs Listed below are the glyphs currently supported by Glyphduino. Have any requests or glyphs of your own to contribute? Head over to the GitHub Page and open up a new ticket / issue! Arrow (North East) GLYPHDUINO_ARROW_NE Arrow (North West) GLYPHDUINO_ARROW_NW Arrow (South East) GLYPHDUINO_ARROW_SE Arrow (South West) GLYPHDUINO_ARROW_SW Battery (Empty) GLYPHDUINO_BATTERY_EMPTY Battery (1 Bar) GLYPHDUINO_BATTERY_1_BAR Battery (2 Bars) GLYPHDUINO_BATTERY_2_BAR Battery (3 Bars) GLYPHDUINO_BATTERY_3_BAR Battery (4 Bars) GLYPHDUINO_BATTERY_4_BAR Battery (Full) GLYPHDUINO_BATTERY_FULL Bell GLYPHDUINO_BELL Clock GLYPHDUINO_CLOCK Cross GLYPHDUINO_CROSS Dogecoin GLYPHDUINO_DOGECOIN Heart GLYPHDUINO_HEART Heart (Empty) GLYPHDUINO_HEART_EMPTY Lock GLYPHDUINO_LOCK Lock (Unlocked) GLYPHDUINO_LOCK_UNLOCKED Music Note GLYPHDUINO_MUSIC_NOTE Ohm GLYPHDUINO_OHM Pi GLYPHDUINO_PI Speaker GLYPHDUINO_SPEAKER Tick GLYPHDUINO_TICK Contributing and reporting issues If you find any problems with Glyphduino or want to contribute to the project, head over to the GitHub page. Alternatively you can contact me directly on Google+ or Twitter.'
