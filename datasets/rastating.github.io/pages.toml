full_description = '''Setting Default Audio Device in Ubuntu 18.04 May 6, 2018 After upgrading to Ubuntu 18.04, I ran into an issue (or possibly a feature) causing the active audio input / output devices to revert to a device of the system's choosing after a power cycle. Continue reading Mitre STEM CTF Cyber Challenge 2018: Write-up April 21, 2018 A write-up of the challenges completed by the Manchester Grey Hats CTF team during the 2018 Mitre STEM Cyber Challenge CTF. Continue reading HackTheBox Node Walkthrough March 3, 2018 OverviewNode is a machine focused around some of the newer technologies being utilised within web development; specifically Node.js, Express.js and mongodb. Initial exploitation and escalation puts a lot of emphasis on enumeration of misconfigurations within the custom software; rather than looking for publicly known exploits. Continue reading Overcoming Some "Gotcha's" in Frida March 1, 2018 I took part in a new research project recently, which involved quite a significant amount of reverse engineering; to which Frida came to the rescue. Whilst using it to hook into some obfuscated code, I ran into a few issues, with fixes which weren’t overly obvious. Continue reading Protecting WordPress Against CVE-2018-6389 w/ ModSecurity February 6, 2018 This week, a denial of service vulnerability within WordPress was disclosed publicly, after the WordPress team refused to acknowledge it as a legitimate bug; despite an attacker being able to single handedly bring down the service. Continue reading Prev Next'''
