 | Check 3 (port 50868/udp): CLEAN (Failed to receive data) | Check 4 (port 38517/udp): CLEAN (Failed to receive data) |_ 0/4 checks are positive: Host is CLEAN or ports are blocked | smb-os-discovery: | OS: Windows 6.1 (Samba 4.3.9-Ubuntu) | Computer name: red | NetBIOS computer name: RED\x00 | Domain name: \x00 | FQDN: red |_ System time: 2017-08-06T15:08:03+01:00 | smb-security-mode: | account_used: guest | authentication_level: user | challenge_response: supported |_ message_signing: disabled (dangerous, but default) |_smbv2-enabled: Server supports SMBv2 protocol Samba As Nmap was able to identify a Samba service that seemingly allowed guest access, I used smbclient to get a list of the available shares and began to enumerate them for information: root@kali:~# smbclient -L \\RED -I 10.2.0.104 Domain=[WORKGROUP] OS=[Windows 6.1] Server=[Samba 4.3.9-Ubuntu] Sharename Type Comment --------- ---- ------- print$ Disk Printer Drivers kathy Disk Fred, What are we doing here? tmp Disk All temporary files should be stored here IPC$ IPC IPC Service (red server (Samba, Ubuntu)) Domain=[WORKGROUP] OS=[Windows 6.1] Server=[Samba 4.3.9-Ubuntu] Server Comment --------- ------- RED red server (Samba, Ubuntu) The first share I took a look into was the kathy share; which contained three files: A todo list A WordPress archive A vsftpd configuration file root@kali:~/stapler# smbclient //RED/kathy -I 10.2.0.104 Domain=[WORKGROUP] OS=[Windows 6.1] Server=[Samba 4.3.9-Ubuntu] smb: \> ls . D 0 Fri Jun 3 17:52:52 2016 .. D 0 Mon Jun 6 22:39:56 2016 kathy_stuff D 0 Sun Jun 5 16:02:27 2016 backup D 0 Sun Jun 5 16:04:14 2016 19478204 blocks of size 1024. 16397128 blocks available smb: \> cd backup smb: \backup\> ls . D 0 Sun Jun 5 16:04:14 2016 .. D 0 Fri Jun 3 17:52:52 2016 vsftpd.conf N 5961 Sun Jun 5 16:03:45 2016 wordpress-4.tar.gz N 6321767 Mon Apr 27 18:14:46 2015 19478204 blocks of size 1024. 16397128 blocks available smb: \backup\> get vsftpd.conf getting file \backup\vsftpd.conf of size 5961 as vsftpd.conf (1455.3 KiloBytes/sec) (average 1455.3 KiloBytes/sec) smb: \backup\> get wordpress-4.tar.gz getting file \backup\wordpress-4.tar.gz of size 6321767 as wordpress-4.tar.gz (45730.3 KiloBytes/sec) (average 43517.5 KiloBytes/sec) smb: \backup\> cd .. smb: \> cd kathy_stuff\ smb: \kathy_stuff\> ls . D 0 Sun Jun 5 16:02:27 2016 .. D 0 Fri Jun 3 17:52:52 2016 todo-list.txt N 64 Sun Jun 5 16:02:27 2016 19478204 blocks of size 1024. 16397128 blocks available smb: \kathy_stuff\> get todo-list.txt getting file \kathy_stuff\todo-list.txt of size 64 as todo-list.txt (20.8 KiloBytes/sec) (average 840.5 KiloBytes/sec) smb: \kathy_stuff\> The todo-list.txt file contained the text, I'm making sure to backup anything important for Initech, Kathy; which led me to believe the WordPress archive may be one from a live deployment and contain a valid wp-config.php, but after inflating the archive (tar -xvf wordpress-4.tar.gz) it seemed that it just contained the core files for an installation, rather than being an actual backup. Likewise, there was nothing of huge interest in the vsftpd.conf file; other than it confirming what Nmap had already found (i.e. that anonymous FTP access was enabled). Next, I took a look at the tmp share, only to find a file named ls which contained the output of ls being executed on the machine: root@kali:~/stapler# smbclient //RED/tmp -I 10.2.0.104 Domain=[WORKGROUP] OS=[Windows 6.1] Server=[Samba 4.3.9-Ubuntu] smb: \> ls . D 0 Tue Jun 7 09:08:39 2016 .. D 0 Mon Jun 6 22:39:56 2016 ls N 274 Sun Jun 5 16:32:58 2016 19478204 blocks of size 1024. 16397128 blocks available smb: \> get ls getting file \ls of size 274 as ls (89.2 KiloBytes/sec) (average 89.2 KiloBytes/sec) smb: \> root@kali:~/stapler# cat ls .: total 12.0K drwxrwxrwt 2 root root 4.0K Jun 5 16:32 . drwxr-xr-x 16 root root 4.0K Jun 3 22:06 .. -rw-r--r-- 1 root root 0 Jun 5 16:32 ls drwx------ 3 root root 4.0K Jun 5 15:32 systemd-private-df2bff9b90164a2eadc490c0b8f76087-systemd-timesyncd.service-vFKoxJ Whilst I was taking a look at Samba, I also had a look for any vulnerabilities that could be leveraged at this stage that affect Samba 4.3.9, but none seemed applicable. Anonymous FTP As the vsftpd configuration file and Nmap both indicated anonymous FTP access was enabled, I connected to see if there were any useful files. Only one file was present though, which was a note which potentially revealed a username (elly): root@kali:~/stapler# ftp 10.2.0.104 Connected to 10.2.0.104. 220- 220-|-----------------------------------------------------------------------------------------| 220-| Harry, make sure to update the banner when you get a chance to show who has access here | 220-|-----------------------------------------------------------------------------------------| 220- 220 Name (10.2.0.104:root): anonymous 331 Please specify the password. Password: 230 Login successful. Remote system type is UNIX. Using binary mode to transfer files. ftp> ls 200 PORT command successful. Consider using PASV. 150 Here comes the directory listing. -rw-r--r-- 1 0 0 107 Jun 03 2016 note 226 Directory send OK. ftp> get note local: note remote: note 200 PORT command successful. Consider using PASV. 150 Opening BINARY mode data connection for note (107 bytes). 226 Transfer complete. 107 bytes received in 0.00 secs (52.2722 kB/s) ftp> root@kali:~/stapler# cat note Elly, make sure you update the payload information. Leave it in your FTP account once your are done, John. Reverse Domain Lookup As there is both a web server and a DNS server present, I used dig to do a reverse lookup, to see if there are any hostnames associated with 127.0.0.1, but only found localhost: root@kali:~/stapler# dig +noall +answer -x 127.0.0.1 @10.2.0.104 1.0.0.127.in-addr.arpa. 0 IN PTR localhost. Port 666 Using nc to connect to port 666 to try and fingerprint the service manually resulted in it outputting some binary data and instantly closing the connection. A closer look at the data retrieved led me to believe it was possibly a ZIP file, as there seemed to be a plaintext file name in the output: Piping the output directly to a file (nc 10.2.0.104 666 > 666.zip) allowed me to unzip it and extract message2.jpg, which was a screenshot of some terminal output: This suggested that a custom binary may have possibly been being used for the echo command that has a buffer overflow; for now though, as the service seemingly wasn’t processing any input being passed to it, this was put on the bench. PHP CLI Server & Apache Running dirb against port 80 (i.e. the PHP CLI server) didn’t return much. It indicated that it was serving up the contents of a home directory, but began running into errors, even when throttling the request rate: ---- Scanning URL: http://10.2.0.104/ ---- + http://10.2.0.104/.bashrc (CODE:200|SIZE:3771) + http://10.2.0.104/.profile (CODE:200|SIZE:675) (!) FATAL: Too many errors connecting to host (Possible cause: EMPTY REPLY FROM SERVER) With [seemingly] no low hanging fruit available, I did a full port scan and found another web server running. This time, it was Apache on port 12380: PORT STATE SERVICE REASON VERSION 12380/tcp open http syn-ack ttl 64 Apache httpd 2.4.18 ((Ubuntu)) Running dirb against port 12380 didn’t return any results and the landing page, when accessed over HTTP, didn’t elude to anything. Accessing over HTTPS, however, led to a page with the text Internal Index Page! A look at the SSL certificate showed that the common name was red.initech: I added red.initech to my hosts file to see if there was a vhost setup for it in Apache, but it led back to the same page as before. Now that I had access to what was seemingly an internal web server, I began running dirb again, which uncovered a few interesting results: root@kali:~/stapler# dirb https://red.initech:12380 /usr/share/wordlists/dirb/big.txt *** ---- Scanning URL: https://red.initech:12380/ ---- ==> DIRECTORY: https://red.initech:12380/announcements/ ==> DIRECTORY: https://red.initech:12380/javascript/ ==> DIRECTORY: https://red.initech:12380/phpmyadmin/ + https://red.initech:12380/robots.txt (CODE:200|SIZE:59) + https://red.initech:12380/server-status (CODE:403|SIZE:302) The first thing I checked out from these results was the phpMyAdmin installation. By going to https://red.initech:12380/phpmyadmin/doc/html/index.html I was able to fingerprint the installation as version 4.5.4.1, which has no usable unauthenticated vulnerabilities that can be used against it. Next, I checked out the announcements directory to see if there was any interesting information, but the only file was message.txt which contai'''
