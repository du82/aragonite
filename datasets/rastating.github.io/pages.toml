description = "Earlier today, I purchased Dialogue System for Unity for a project I am working on that will require interactive dialogues as well as bark dialogues (dialogu..."
full_description = "Solving Odd Camera Issues with Unity Dialogue System July 14, 2014 Earlier today, I purchased Dialogue System for Unity for a project I am working on that will require interactive dialogues as well as bark dialogues (dialogues that are not interactive, but occur on a trigger; such as you walking by someone). I began by reading through The Documentation and setting up some simple dialogues and managed to get the triggers to work and the conversation flows to work correctly, but for some reason I kept running into a problem in which the camera seemed to be inverted on the Z axis and the background colour of the main camera was being shown as can be seen in the below screenshot: Unfortunately, Googling didn’t reveal any occurrence of this and I couldn’t find anything in the documentation to do with it either. As it turns out, it may have been something a bit more obvious to someone who is more experienced with the system that is easily fixed. The solution was to simply remove the value in the “Default Sequence” property found under the “Camera Settings” drop down in the Dialogue System Controller properties. By default, this value is set to Camera(Closeup); required Camera(Closeup,listener)@, as can be seen above, which seems to be what was causing odd camera behaviour. If like me you aren’t interested [yet] in interacting with the camera just empty this property and it should be fine. On a side note, I highly recommend purchasing Dialogue System if you’re in need of adding dialogues to your game. Although I haven’t spent much time with it, I can safely say it is very well polished and has a very easy to use yet flexible work flow. #unity #dialogue #camera #background colour"
year_published = 2025
