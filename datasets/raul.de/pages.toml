["https://raul.de/leichte-sprache/wer-ich-bin"]
title = "Wer ich bin - Raúl Krauthausen"
description = "Ich bin Raul Krauthausen.Ich bin Berliner.Ich schreibe Bücher.Ich bin Moderator.Ich schreibe Texte im Internet.Ich bin Botschafter für Inklusion.Ich bin .Ich habe die SOZIALHELD*INNEN gegründet. Ich habe Kommunikation studiert.Das bedeutet:In meinem Studium habe ich gelernt:Wie kann ich Werbung für etwas machen?Wie kann ich mich für etwas einsetzen?Und wie kann ich gute Texte schreiben? Seit 15 Jahren […]"
full_description = "Wer ich bin Ich bin Raul Krauthausen.Ich bin Berliner.Ich schreibe Bücher.Ich bin Moderator.Ich schreibe Texte im Internet.Ich bin Botschafter für Inklusion.Ich bin AktivistAktivist / AktivistinEin Aktivist oder eine Aktivistin setzt sich für etwas ein. Die Person macht sich für etwas stark. Zum Beispiel für die Rechte von Menschen mit Behinderung. Die Person spricht mit vielen Menschen darüber. Zum Beispiel mit Politikern und Politikerinnen..Ich habe die SOZIALHELD*INNEN gegründet. Ich habe Kommunikation studiert.Das bedeutet:In meinem Studium habe ich gelernt:Wie kann ich Werbung für etwas machen?Wie kann ich mich für etwas einsetzen?Und wie kann ich gute Texte schreiben? Seit 15 Jahren arbeite ich in der Welt des Internet. Seit 2011 bin ich Mitglied des NetzwerkNetzwerkEin Netzwerk braucht man zur Zusammen-Arbeit. Verschiedene Menschen und Gruppen tun sich in einem Netzwerk zusammen. Sie unterstützen sich gegenseitig. Sie arbeiten zusammen an wichtigen Themen. Sie beraten sich. Sie tauschen sich aus. Und sie treffen sich. Ashoka.In diesem Netzwerks verbinden sich Menschen auf der ganzen Welt.Sie wollen das Zusammen-Leben verändern.Und zusammen Probleme lösen. 2011 habe ich die SOZIALHELD*INNEN gegründet.Seitdem machen wir viele Projekte zusammen.Ich spreche mit vielen Menschen darüber.Ich erzähle anderen von den Ideen und Zielen der SOZIALHELD*INNEN. 2013 wurde ich mit dem Bundes-Verdienst-Kreuz am BandeBundes-Verdienst-Kreuz am BandeDas Bundes-Verdienst-Kreuz am Bande ist ein Orden. Den Orden bekommen Menschen, die etwas Besonderes geleistet haben. geehrt.Das Bundes-Verdienst-Kreuz ist ein Orden.Den Orden bekommen Menschen, die etwas Besonderes geleistet haben. Im Januar 2014 habe ich ein Buch über mein Leben geschrieben.Es heißt: Dachdecker wollte ich eh nicht werden – Das Leben aus der Rollstuhl-PerspektivePerspektivePerspektive ist ein anderes Wort für Blick-Winkel. Es zeigt: So gucke ich auf die Welt. Oder: So denke ich über ein bestimmtes Thema.. Seit 2015 habe ich eine eigene Gesprächs-Sendung.Sie heißt KRAUTHAUSEN – face to face.Face ist das englische Wort für Gesicht.Die Sendung kann man beim Sender Sport 1 sehen.Oder auf dieser Internet-Seite. Im Mai 2019 kam der Film DIE KINDER DER UTOPIEUtopieEine Utopie ist eine Vorstellung von der Zukunft. Man stellt sich vor: So soll das Zusammen-Leben in der Zukunft sein. Oder: So sehen die Häuser in der Zukunft aus. Oder: So reisen wir in Zukunft von einem Ort zum anderen. in die Kinos.Für diesen Film setze ich mich ein.Damit möglichst viele Menschen den Film sehen. Seit dem Jahr 2020 mache ich verschiedene PodcastPodcastEin Podcast kann eine Ton-Datei sein oder ein Video. Ein Podcast kann wie eine Radio-Sendung sein. Oder wie eine Fernseh-Sendung. Einen Podcast kann man sich im Internet ansehen oder anhören. Oder man kann ihn herunter-laden. Man kann ihn jederzeit hören oder sehen..Ihr findet sie hier auf meiner Internet-Seite. Weiterlesen: Was ich mache"
