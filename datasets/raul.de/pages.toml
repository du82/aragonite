full_description = "Unfassbares Krautreporter-Kommentar: So blockieren Eltern und Lehrkräfte die Inklusion behinderter Kinder Sie warten darauf, dass jemand anderes das Problem löst. Dabei könnten sie jetzt schon helfen. 29. November 2024 Bosetti Late Night: „Luke Mockridge – Darf er das?“ vom 29. September 2024 Witze über Menschen mit Behinderung: diskriminierend oder inklusiv? Wann wird Kritik zu Cancel Culture? In „Bosetti Late Night“ gehen Sarah Bosetti und ihre Gäste Janina Nagel, Raul Krauthausen und Okan Seese dem viel diskutierten Thema auf den Grund. 2. Oktober 2024 Krautreporter-Kommentar: Diese Umweltpolitik schadet Menschen mit Behinderung vom 11. September 2024 Die meisten sind sich einig, dass die Klimakrise bekämpft werden muss. Nur: Wenn dieser Kampf so weitergeht, wird die Klimakrise vor allem behinderte Leben fordern. 25. September 2024 Inklusion ist keine Frage des Geldes – Es geht um gleichwertige Teilhabe! Inklusion ist mehr als eine wirtschaftliche Notwendigkeit – sie ist ein grundlegendes Menschenrecht! In meiner Rede auf dem Vielfaltskongress der GRÜNEN habe ich klargemacht, dass behinderte Menschen nicht nur dann wertvoll sind, wenn sie dem Arbeitsmarkt dienen. Inklusion bedeutet gleichberechtigte Teilhabe für alle – unabhängig von Produktivität oder Leistungsfähigkeit. Doch warum sind wir in Deutschland… 22. September 2024 Die trügerische Verheißung der Robotaxis Im heutigen digitalen Zeitalter werden wir oft von der faszinierenden Idee autonomer Fahrzeuge – z. B. den sogenannten Robotaxis – in den Bann gezogen. Sie versprechen eine Zukunft der Unabhängigkeit und Mobilität, insbesondere für Menschen mit Behinderungen. Doch wie nahe ist diese utopische, barrierefreie Zukunft wirklich? 7. Dezember 2023 Inklusive Hochschule? – Wie der Bildungssektor Menschen mit Behinderung ausklammert Kürzlich wurde ich mit dem Bildungspreis Ansbach geehrt und zum Namensgeber eines Hörsaals ernannt. Doch dieser Raum ist (noch) nicht barrierefrei. Ein paradoxer Moment, der den Finger auf die Wunde der deutschen Bildungslandschaft legt. 🤔 29. September 2023 Probleme der Inklusion – Wie das Fachkonzept der Sozialraumorientierung Abhilfe schaffen könnte Die Bedürfnisse behinderter Menschen werden oft weder von Behörden noch Sozialarbeitenden ideal abgedeckt. Professor Wolfgang Hintes Fachkonzept der Sozialraumorientierung liefert interessante Ansatzpunkte, wie Bedarfe durch eine Kombination aus unterschiedlichen Ressourcen erfüllt werden können. Dazu zählen persönliche, leistungsgesetzliche, professionelle und umweltbedingte Faktoren. 31. August 2023 „Disability Dongle“: Wenn nicht behinderte Lösungen für behinderte Menschen kreieren „Disability Dongles“ sind Innovationen, die versprechen, das Leben von behinderten Menschen zu erleichtern, aber letztlich Probleme „lösen“, von denen niemand wusste, dass sie existieren. Schon garnicht Betroffene. Gut gemeint also, aber oft nutzlos und fernab der tatsächlichen Bedürfnisse. Von Google Glasses über AR-Brillen, bis zu speziellen Schuhen für Blinde. Die Ursache: Die meisten Innovationen werden… 16. August 2023 Chancengerechte und zukunftsfähige Schule für Kinder mit Behinderungen Kürzlich war ich zu einer Lesung meines neuen Buches “Wer Inklusion will, findet einen Weg, wer sie nicht will, findet Ausreden” auf dem PxP Musik- und Bildungsfestival geladen. Das Festival ist eine Bewegung für eine chancengerechte und zukunftsfähige Schule. Mir ist folgendes aufgefallen: Das Wort Inklusion ist tagelang so gut wie nicht vorgekommen, bis ich… 3. August 2023 Über die Floskel „Barrieren in den Köpfen senken!“ Was fehlt, ist eine Rechtsgrundlage, auf deren Basis Teilhabe und Barrierefreiheit umgesetzt werden müssen. Stattdessen kann von Entscheidungstragenden noch immer auf leere Worthülsen zurückgegriffen werden, um Inklusion zu vertagen. Eine Aussage, die beispielhaft hierfür steht, ist „Wir müssen erst die Barrieren in den Köpfen senken!“. Diese Formulierung hat eine Reihe problematischer Implikationen, die ich ausführen… 25. Juli 2023 1 2 3 … 13 Nächste Seite→ [mc4wp_form id=“50673″]"
