full_description = "Begeisterndes Pop & Pasta mit Raúl Krauthausen und Saioa Alvarez Raúl Krauthausen ist Inklusions-Aktivist und Gründer der SOZIALHELD*INNEN. Als studierter Kommunikationswirt und Design Thinker arbeitet Raúl Krauthausen seit über 15 Jahren in der Internet- und Medienwelt: als Moderator, Speaker, Podcasthost und Autor. 2013 erhielt er das Bundesverdienstkreuz am Bande. Bei Pop & Pasta spricht er Politik, Medien, Kinderbücher und seine Ehe. 28. Oktober 2024 Bosetti Late Night: „Luke Mockridge – Darf er das?“ vom 29. September 2024 Witze über Menschen mit Behinderung: diskriminierend oder inklusiv? Wann wird Kritik zu Cancel Culture? In „Bosetti Late Night“ gehen Sarah Bosetti und ihre Gäste Janina Nagel, Raul Krauthausen und Okan Seese dem viel diskutierten Thema auf den Grund. 2. Oktober 2024 Ulrich Hartmann zu Gast bei KRAUTHAUSEN – face to face Ulrich Hartmann ist Musiker, Moderator und Aktivist, der in Berlin lebt. Er studierte u. a. Musik an der Popakademie und ist bei der „Aktion Luftsprung“ tätig, einer Stiftung, die sich dem künstlerischen und beruflichen Einstieg chronisch erkrankter Menschen widmet. Als Profimusiker leitet er mit seinen Erfahrungen und seinem musikalischen Talent das Projekt Projekt „Luftsprung Live“,… 27. April 2024 Sema Gedik zu Gast bei KRAUTHAUSEN – face to face Zu Gast bei KRAUTHAUSEN – face to face: Sema Gedik, Modeschöpferin und Unternehmerin. Wir diskutieren über Semas Weg in die Modebranche, der durch die Erkenntnis geprägt wurde, dass es mehr Mode für Hunde als für kleinwüchsige oder behinderte Menschen gibt. Gedik, die Modedesign an der HTW Berlin und dem Amsterdam Fashion Institute studierte, hat sich… 18. Februar 2024 Phil Hubbe zu Gast bei KRAUTHAUSEN – face to face Zu Gast bei KRAUTHAUSEN – face to face: Phil Hubbe, Cartoonist. Er ist bekannt für seinen humorvollen, aber nachdenklichen Ansatz, mit dem er tagesaktuelle Geschehnisse und insbesondere das Thema Inklusion kommentiert. Er spricht über seinen eigenen Weg zu Behinderungsthemen durch seine Diagnose und wie er lernte, seine Erlebnisse künstlerisch umzusetzen​​. Gerade Menschen mit schweren Beeinträchtigungen… 25. November 2023 Anna Reizbikh zu Gast bei KRAUTHAUSEN – face to face Zu Gast bei KRAUTHAUSEN – face to face: Anna Reizbikh, Sängerin. Seit über zehn Jahren singt sie in verschiedenen Bands und balanciert geschickt ihre Termine zwischen Arbeit, Musik, Schauspielerei und Zeit mit Freunden. Für sie ist es unverständlich, dass ihre Behinderung mit Selbstbewusstsein in Verbindung gebracht wird. Musik ist für sie Freiheit, da sie sich… 2. Oktober 2023 Die Bedeutung von Teilhabe und Teilgabe – Raus aus dem Integrationsdenken! Im Kontext der Inklusion ist oft von dem Begriff „Teilhabe“ die Rede. Er bedeutet, dass behinderte Menschen im selben Umfang, wie nicht-behinderte Personen Zugang zu allen Bereichen gesellschaftlichen Lebens erhalten. Ich finde dies zu kurz gedacht und bevorzuge den Begriff „Teilgabe“. Behinderte Menschen sollen eine aktive Rolle bei der Gestaltung von Gesellschaft und Politik übernehmen… 22. August 2023 Anna Spindelndreier zu Gast bei KRAUTHAUSEN – face to face Zu Gast bei KRAUTHAUSEN – face to face: Anna Spindelndreier, Fotografin. Sie wuchs in Hamm auf und zog für ihr Fotografie-Studium nach Dortmund, wo sie heute als freie Fotografin arbeitet. Ihre Bilder sollen Menschen erreichen, aufklären und gleichzeitig berühren und erfreuen. Ihre besondere Perspektive, bedingt durch ihre Art der Fotografie und ihre Körpergröße, ist eine… 24. Juni 2023 Felix Brückner zu Gast bei KRAUTHAUSEN – face to face Zu Gast bei KRAUTHAUSEN – face to face: Felix Brückner, Musiker. Der Sänger und Gitarrist gründete zusammen mit dem Schlagzeuger Justus die Band FHEELS, als beide an der Hamburger School of Music studierten und ihre ersten eigenen Kompositionen vorstellten. Musik ist für Brückner das einzige Mittel, um dauerhafte, innere Zufriedenheit zu erreichen. Mit Raul Krauthausen… 1. April 2023 Saioa Alvarez Ruiz zu Gast bei KRAUTHAUSEN – face to face Zu Gast bei KRAUTHAUSEN – face to face: Saioa Alvarez Ruiz, Performerin. Saioa Alvarez Ruiz ist Performerin und lebt in Berlin. Sie studierte Soziologie, Politik- und Medienwissenschaften an der Universität Düsseldorf und Theaterpädagogik an der Universität der Künste Berlin. Ihren höchsten Bildungsgrad erlangte sie durch das Leben mit Behinderung. Die erlernten Überlebens- und Kampfstrategien genauso… 18. Februar 2023 1 2 3 … 15 Nächste Seite→ [mc4wp_form id=“50673″]"
