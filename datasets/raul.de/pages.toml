["https://raul.de/allgemein/republica-2024-raul-krauthausen-und-georgine-kellermann-der-lange-weg-zu-mir-selbst-meine-befreiung-als-trans-frau-nach-ueber-60-jahren"]
title = "re:publica 2024: Raul Krauthausen und Georgine Kellermann - Der lange Weg zu mir selbst: Meine Befreiung als trans* Frau nach über 60 Jahren - Raúl Krauthausen"
description = "Im Gespräch mit Raul Krauthausen spricht Georgine Kellermann über ihr neues Buch, ihr Coming-out mit 62 Jahren, ihre Vorstellungen von einer diversen Gesellschaft und vom Glück, sie selbst sein zu dürfen."
full_description = "re:publica 2024: Raul Krauthausen und Georgine Kellermann – Der lange Weg zu mir selbst: Meine Befreiung als trans* Frau nach über 60 Jahren Im Gespräch mit Raul Krauthausen spricht Georgine Kellermann über ihr neues Buch, ihr Coming-out mit 62 Jahren, ihre Vorstellungen von einer diversen Gesellschaft und vom Glück, sie selbst sein zu dürfen. Georgine Kellermann hat 62 Jahre lang öffentlich nur als Mann existiert. Als Georg. Das Outing kam 2019. Sie selbst nennt es „Offenbarung“, seitdem Micky Beisenherz in der WDR-Talkshow „Kölner Treff“ den letzten Schritt zu Georgine so betitelt hat. Diesen letzten Schritt von Georgine Kellermann nennen viele „mutig“. Sie selbst sagt, mutig wäre gewesen, so weiterzumachen, wie das ganze Leben davor. Einfach bis zur Pensionierung zu warten und danach wie geplant den Rest des Lebens auch öffentlich als Frau zu leben. Ein Zufall hat ihr geholfen, den letzten Schritt vier Jahre vor der Pensionierung zu gehen. Georgine denkt heute, dass das auch „Self-Care“ war. Dass der Schritt ihrer Seele gut tut. Jeden Tag aufs Neue. Vom Glück, sie selbst zu sein, schreibt Georgine Kellermann in ihrem Buch „Georgine – Der lange Weg zu mir selbst“, dass am 30. Mai 2024 im Ullstein Verlag erscheint. Die Idee zu diesem Buch kam aus dem Verlag. Weil sich Georgine Kellermann in den sozialen Medien – vor allem auf X (vormals Twitter) sehr aktiv für die Rechte von trans* Menschen einsetzte. Bei X hat sie heute mehr als 40.000 Follower*innen. In manchen Medien wird sie als eine der bekanntesten trans* Frauen in Deutschland bezeichnet. Ihr Sender, der WDR, hat die Offenbarung seiner Studioleiterin sehr empathisch begleitet und unterstützt. Es war keine Frage, dass auch die Reporterin Georgine vor der Kamera stehen durfte, wie es der Reporter Georg viele Jahrzehnte zuvor getan hatte. Der WDR ist da ein Vorreiter unter den Öffentlich Rechtlichen. Und auch, wenn es schon in die richtige Richtung geht, Georgine möchte mehr. „Für mich sind wir am Ziel, wenn eine trans* Person einen Kommentar in den Tagesthemen spricht, der nichts mit einem queeren Thema zu tun hat“, ist ihr großer Wunsch."
