["https://raul.de/leben-mit-behinderung/das-ding-mit-dem-tellerrand"]
title = "Das Ding mit dem Tellerrand - Raúl Krauthausen"
description = "Karriereratgeber preisen Scheitern als Chance für beruflichen Aufstieg an: alles eine Frage der Erfahrung. Und wenn es die nicht gibt? Wenn Menschen mit Behinderung zwischen Wohneinrichtung und Werkstatt tingeln, bewegen sie sich auf wenigen, ausgetretenen Pfaden - die Karriereberater wären nicht begeistert."
full_description = "Das Ding mit dem Tellerrand Photo: Jonas Deister | Gesellschaftsbilder.de Karriereratgeber preisen Scheitern als Chance für beruflichen Aufstieg an: alles eine Frage der Erfahrung. Und wenn es die nicht gibt? Wenn Menschen mit Behinderung zwischen Wohneinrichtung und Werkstatt tingeln, bewegen sie sich auf wenigen, ausgetretenen Pfaden – die Karriereberater wären nicht begeistert. Mein Freund Holger und ich trafen uns immer im selben Café; es war eben in der Nähe, barrierefrei erreichbar, die Kellner*innen freundlich, der Kaffee lecker. Ich war zufrieden, dieser Ort bot mir alles, was ich in genau dem Moment wollte. Holger dagegen fand das irgendwann langweilig; er würde noch so viele andere tolle Cafés kennen, also warum immer in dasselbe gehen? Bis dato hatte ich mir gar keine Gedanken darüber gemacht, warum auch? Ich hatte schließlich alles, was ich brauchte. Aber als Holger anfing von den anderen Cafés zu berichten, bekam auch ich Lust diesen Orten einen Besuch abzustatten und Neues zu erleben. Da draußen gibt es halt viel mehr, als vier Wände bieten. Es gibt Sinnsprüche, die sind nicht besonders sinnvoll. “Was ich nicht weiß, macht mich nicht heiß” zum Beispiel, oder: “Was der Bauer nicht kennt, isst er nicht.” Letzterer ist durch dieses aufgezeigte Essverhalten nicht automatisch ein glücklicherer Mensch, dachte ich mir. Kennenzulernen gibt es eben einiges, und das müssen keine Walderdbeeren aus einem südamerikanischen Vulkankrater oder getrocknete Moosbeeren vom Nordpol sein. Im Gegenteil, Ausflüge bilden, sie erweitern den Horizont – und wer will, kann dann ja ins Café in der Nähe zurückkehren, wie gesagt: Der Kaffee hatte ein tolles Aroma. Diese kurze Anekdote mit Holger skizziert nicht nur, wie die Idee der Wheelmap entstand, die Online-Karte zum Finden und Markieren rollstuhlgerechter Orte. Sie zeigt auch, inwiefern der Austausch mit Anderen Lust auf Neues weckt und Perspektiven eröffnen kann, zu denen man vorher keinen Zugang hatte, weil einem die nötigen Informationen fehlten. In den eigenen vier Wänden dauerhaft bleiben, das Sammeln von Erfahrungen herunterfahren und sich in gewohnten Strukturen bewegen – so sieht auch nicht selten die Wohn- und Arbeitssituation von Menschen mit Behinderung aus. Für Menschen mit Behinderung gibt es Förderschulen, in denen sie von nichtbehinderten Kindern separiert unterrichtet werden. Immer nur unter “ihresgleichen” gewesen, scheint separiertes Wohnen und Arbeiten wie eine logische Konsequenz aus der gesonderten Beschulung, da keine anderen Perspektiven geboten werden. Man kann es Aussonderung nennen, auch wenn es gut gemeint ist. Und so sagen es Mitarbeiter*innen aus Wohn- und Pflegeheimen oder Werkstätten oft: “Aber den Menschen geht es doch gut hier bei uns, sie sind glücklich!”, “Manche können eben nur an einer Förderschule unterrichtet werden/ in einer Werkstatt arbeiten.” Oder auch “Die Leute fühlen sich nicht ausgeschlossen, die fühlen sich hier wohl!”. Wohlgemerkt, diese Perspektive stammt von Menschen, die dazu ausgebildet werden Menschen mit Behinderung in ihrem Leben zu begleiten, bei Entscheidungen zu beraten sowie ein selbstbestimmtes und selbstständiges Leben zu ermöglichen. Aber oft tun sie mit dieser Haltung genau das Gegenteil. Denn sie schützen sie vor Herausforderungen, Veränderungen und Grenzerfahrungen. Sicherlich sind viele Menschen in Einrichtungen nicht unglücklich. Aber leben sie ein erfülltes Leben, können sie dort ihr ganzes Potenzial ausschöpfen? Wer entscheidet, was für sie Glück bedeutet? Man sollte sich bei solchen Behauptungen, dass andere glücklich sind, folgende Fragen stellen: Was sagen eigentlich die betroffenen Menschen selbst dazu?Wurden die Menschen darüber informiert, dass es Möglichkeiten gibt außerhalb eines Heimes zu leben bzw. außerhalb einer Werkstatt zu arbeiten?Wenn ja, wurden sie diesbezüglich über Unterstützungsmöglichkeiten in Kenntnis gesetzt?Haben sie die Möglichkeit, auf Basis dieser Informationen eine freie Entscheidung zu treffen? Es ist erschreckend zu sehen, wie wenig diese Fragen gestellt werden. Bei meinen Besuchen in solchen Einrichtungen stelle ich immer wieder fest, dass weiterhin großer Nachholbedarf bei der schlichten Aufklärung über Rechte und Ansprüche besteht – und die sind ja auch nicht gerade üppig. Wie Einrichtungen ticken und handeln, zeigen sie oftmals eine Orientierung an einem medizinischen und defizitären Modell von Behinderung. Wie in diesem Artikel schon ausführlich dargelegt, werden Menschen mit Behinderung in Einrichtungen separiert, abhängig gehalten und erleben keinen alltäglichen, selbstverständlichen Umgang auf Augenhöhe; da beißt die Maus keinen Faden ab. Betreuende und Pflegende sehen sich häufig eher als Vormünder anstatt als Unterstützer*innen, und sie agieren eher aufgrund vermeintlicher Wünsche und Vorstellungen und nicht aufgrund tatsächlicher. Ja, vielleicht erscheinen die Menschen erstmal zufrieden – denn für das Notwendige ist gesorgt, viele Grundbedürfnisse sind (in der Regel) erfüllt. Man kennt sich, kann miteinander lachen, ist weniger Belastungen und mehr Verständnis ausgesetzt. Wenn sie aber nur von anderen umgeben sind, die den gleichen Aktivitäten nachgehen, sich immer mit denselben Leuten unterhalten, die ähnliche Gedanken haben, weil sie sich mit immer gleichen Dingen beschäftigen – woher sollen die neuen Perspektiven kommen? Von nichtbehinderten Vorgesetzten oder Betreuenden, die in der Regel kein großes Interesse daran haben, ihre besten Mitarbeiter*innen in den allgemeinen Arbeitsmarkt zu vermitteln? Sicherlich nicht. Denn das macht ja erstmal Arbeit und gefährdet den wirtschaftlichen Betrieb. Fest steht, dass der gängige Umgang mit Menschen mit Behinderung in Wohneinrichtungen und Werkstätten in der Regel nicht der Inklusion entspricht. Teilhabe, Selbstbestimmung und freie Entfaltung der Persönlichkeit können schlichtweg nicht stattfinden in einem System, das die genannten Punkte meist nur in einem festgesetzten Rahmen und unter fremdbestimmten Annahmen zulässt. Was steckt hinter diesem ganzen Phänomen? Die Angst vor großen Veränderungen? Oder die Unlust seine eigene Komfortzone zu verlassen, um sich und seine Arbeit kritisch zu reflektieren? Oder einfach nur der “gute Wille”, das Gefühl der Mehrheitsgesellschaft Menschen mit Behinderung immer und vor allem schützen zu müssen? Wovor denn? Davor, Unannehmlichkeiten zu erfahren, Fehler zu machen, zu scheitern? Warum haben nicht auch Menschen mit Behinderung das Recht aus ihren Fehlern und Herausforderungen zu lernen oder nach einem Tief ein Hoch zu erleben? Zumindest zeigt es deutlich, dass im Großen und Ganzen Nicht-Behinderte über Menschen mit Behinderung reden und entscheiden, anstatt mit ihnen gemeinsam zu diskutieren, ihnen konstruktiv zuzuhören und sie in Entscheidungen mit einzubeziehen. Ich bin dann also mit Holger los, hin zu einem seiner vorgeschlagenen Cafés. Der erste Ort war eine Katastrophe. Der Kaffee kam lauwarm, der Apfelkuchen schmeckte nach Füßen. Aber ich lernte dort Kellnerin Eva kennen und sie erzählte mir einige gute neue Witze. In einem weiteren Café zog es wegen der kaum isolierten Fenster wie Hechtsuppe, aber ich sah am Nebentisch erstmals einen metallenen Handofen, mit dem sich ein Gast wärmte; solch einen hab ich jetzt auch. Wohin es als nächstes geht? Schauen wir mal. In die Wheelmap."
