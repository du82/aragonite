full_description = "Vorträge re:publica 2024: Wie sähe ein kultureller Wendepunkt für echte Inklusion aus? Es geht um weit mehr als barrierefreie Zugänge und normative Lösungen. Es geht um eine tiefgreifende kulturelle Veränderung, die Inklusion nicht als Herausforderung, sondern als Chance begreift. 6. Juni 2024 re:publica 2024: Raul Krauthausen und Georgine Kellermann – Der lange Weg zu mir selbst: Meine Befreiung als trans* Frau nach über 60 Jahren Im Gespräch mit Raul Krauthausen spricht Georgine Kellermann über ihr neues Buch, ihr Coming-out mit 62 Jahren, ihre Vorstellungen von einer diversen Gesellschaft und vom Glück, sie selbst sein zu dürfen. 28. Mai 2024 Chancengerechte und zukunftsfähige Schule für Kinder mit Behinderungen Kürzlich war ich zu einer Lesung meines neuen Buches “Wer Inklusion will, findet einen Weg, wer sie nicht will, findet Ausreden” auf dem PxP Musik- und Bildungsfestival geladen. Das Festival ist eine Bewegung für eine chancengerechte und zukunftsfähige Schule. Mir ist folgendes aufgefallen: Das Wort Inklusion ist tagelang so gut wie nicht vorgekommen, bis ich… 3. August 2023 Aktivismus statt Resignation – Raúl Krauthausen und Benjamin Schwarz auf der TINCON 2022 Wie löst man Probleme, die einem so groß erscheinen, dass man wie erstarrt zuhause vor dem Bildschirm ausharrt? Benjamin Schwarz und ich haben versucht, diese Frage zu beantworten, indem wir für unser Buch “Wie kann ich was bewegen” mit vielen jungen und alten Aktiven und Aktivistinnen gesprochen haben, um deren Zauberformel zu erfahren. Und sind… 5. Juli 2022 #Kunterbunteskinderbuch: re:publica 2016 – Kinderbücher: Inklusiv. Queer. Interkulturell. Aber wie? #rpTEN Ich liebe die re:publica! Sie ist ein Festival, ein Ort der gelebten Inklusion, Vielfalt und das Zuhause der Bloggerszene. Dieses Jahr hatten Suse Bauer und ich die große Ehre, zu einem Thema, welches uns wirklich ein Herzensanliegen ist, auf der Bühne sprechen zu dürfen: Vielfalt in Kinderbüchern! 3. Mai 2016 Vortrag beim ESPRIX Forum 2016 Am 10. März 2016 war Raul Krauthausen am ESPRIX Forum 2016. Gründer der Aktionsgruppe SOZIALHELDEN und Initiator von Wheelmap.org / Träger des Bundesverdienstkreuzes. Autor des Buches „Dachdecker wollt ich ja eh nicht werden“. 10. März 2016 Vortrag auf der APG Open Source 2014 Am 5. Juni 2014 war ich auf der APG Open Source 2014-Konferenz. Dort sprach ich in meinem Vortrag „Identität im Spiegel der anderen“ über einen gewünschten Perspektivwechsel und thematisierte den Umgang mit Menschen mit Behinderung in den Medien. Menschen mit Behinderung werden zu oft als eingeschränkt oder leidend dargestellt, das aber nicht immer ihrem Selbstbild… 18. Juni 2014 „Mobilitätsinnovationen für Menschen mit Behinderung“ auf der re:publica 2014. #rp14 Am 7. Mai 2014 hatte ich die großartige Gelegenheit auf der re:publica 14 einen Vortrag zu Mobilitätsinnovationen für Menschen mit besonderen Bedürfnissen zu halten: In dem Vortrag gehe ich den Fragen nach: Was sind (sinnvolle) Innovationen im Bereich Mobilität für besondere Bedürfnisse? Was macht keinen Sinn? Was fehlt? Wie kann die mobile Zukunft für behinderte… 8. Mai 2014 Mit Wheelmap.org auf der Local Web Conference 2014 in Nürnberg. #lwc14 Am 5. Februar 2014 hatte ich die großartige Gelegenheit auf der Local Web Conference 2014 dem Panel „Smart City – Menschen, Technik, Infrastruktur“ beizuwohnen und einen kurzen Vortrag über die SOZIALHELDEN und die Wheelmap zu halten: 7. Februar 2014 The Accessible City: Raul Krauthausen at TEDxHamburg Raul Krauthausen co-founded the SOZIALHELDEN platform, a multi-award-winning group of extraordinary changemakers, of which he is one of the creative masterminds. The group has a track record of creating successful, sustainable and well marketed social innovations, including “Pfandtastisch helfen!”, Germany’s most prominent recycling for social change project, and “SuperZivi”, a radio casting show for young… 4. Juni 2013 1 2 Nächste Seite→ [mc4wp_form id=“50673″]"
