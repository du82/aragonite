full_description = "Wie kann ich was bewegen? Wie wird aus politischem Protest politisches Handeln? Wie kann ich als einzelner Mensch Einfluss nehmen? Kurz gesagt: Wie kann ich etwas bewegen? Darüber spricht der politische Aktivist Raul Krauthausen zusammen mit Benjamin Schwarz in diesem Podcast mit Deutschlands bekanntesten Aktivistinnen und Aktivisten. Jetzt auf Apple Podcasts via Spotify oder als RSS-Feed abonnieren! Auch als Transkript verfügbar. Podcast: „Wie kann ich was bewegen?“ – Folge 29: Mit Maja Göpel In dieser Folge sprechen wir mit Prof. Dr. Maja Göpel, Politökonomin, Expertin für Nachhaltigkeitspolitik und Transformationsforschung, Autorin, Rednerin, Beraterin, Hochschullehrerin und Mitbegründerin von Scientists4Future. 16. August 2022 Podcast: „Wie kann ich was bewegen?“ – Folge 28: Mit Sarah-Lee Heinrich Mit 15 trat Sarah der Grünen Jugend bei und gründete die Ortsgruppe Unna. Ihre politischen Kernthemen sind soziale Ungleichheit, insbesondere das Hartz-IV-System und gesellschaftliche Ausbeutung. Sarah spricht mit Raul und Benjamin darüber, was es bedeutet in Deutschland arm zu sein, wieso die Ampel Regierung aktuell keine soziale Krise bewältigen kann und wer konkret eigentlich in… 2. August 2022 Podcast: „Wie kann ich was bewegen?“ – Folge 27: Mit Deutsche Wohnen & Co enteignen Gegen den Mietenwahnsinn: In dieser Folge sprechen Raul und Benjamin mit Veza und Aino von Deutsche Wohnen & Co enteignen. Die Berliner Bürger:innen-Initiative fordert, dass große Wohnkonzerne in Berlin enteignet und vergesellschaftet werden. In Berlin würde das 243.000 Wohnungen betreffen, was per Volksentscheid mehrheitlich befürwortet wurde. Veza, Aino, Benjamin und Raul führen eine spannende Diskussion,… 19. Juli 2022 Aktivismus statt Resignation – Raúl Krauthausen und Benjamin Schwarz auf der TINCON 2022 Wie löst man Probleme, die einem so groß erscheinen, dass man wie erstarrt zuhause vor dem Bildschirm ausharrt? Benjamin Schwarz und ich haben versucht, diese Frage zu beantworten, indem wir für unser Buch “Wie kann ich was bewegen” mit vielen jungen und alten Aktiven und Aktivistinnen gesprochen haben, um deren Zauberformel zu erfahren. Und sind… 5. Juli 2022 Podcast: „Wie kann ich was bewegen?“ – Folge 26: Mit Linus Neumann In dieser Folge sprechen Raul und Benjamin mit Linus Neumann, Sprecher des Chaos Computer Clubs, Experte für IT-Sicherheit und Diplom-Psychologe. Der Verein und einstige Hacker-Vereinigung CCC ist seit den Achtzigern politisch und aktivistisch unterwegs, wenn es um das “Menschenrecht auf weltweite, ungehinderte Kommunikation” geht. So werden gerade auch die digitalen Machenschaften von Meta, Google oder… 5. Juli 2022 Podcast: „Wie kann ich was bewegen?“ – Folge 25: Mit Barbara Metz Die gebürtige Bayerin kämpft seit 15 Jahren in der Deutschen Umwelthilfe für saubere Luft, weniger Plastik und gegen die Klimakrise. Lösungsorientiert und erfolgreich. So deckte der Verein mit über 100 festen Mitarbeiter:innen u.a. die VW-Abgas-Affäre aka Diesel-Skandal auf und erklagte das Recht auf saubere Luft für alle europäischen Bürger:innen. 21. Juni 2022 Podcast: „Wie kann ich was bewegen?“ – Folge 24: Mit Lina Hurlin Wieso sind die meisten Städte aktuell eigentlich nicht für Menschen gebaut und was kann man tun, um sich gegen immer steigenden Mieten zu wehren? 7. Juni 2022 Podcast: „Wie kann ich was bewegen?“ – Folge 23: Mit Dario Schramm Dario Schramm, Autor des Buches “Die Vernachlässigten, Generation Corona: Wie uns Schule und Politik im Stich lassen” war Sprachrohr für die Schülerinnen und Schüler auf Bundesebene während der Coronakrise. Damals fragte niemand nach ihren Bedürfnissen, Meinungen und Ideen zur Regelung der Pandemie-Situation in den Schulen. Solch politische Prozesse ohne die Beteiligung von Betroffenen sind der… 24. Mai 2022 Podcast: „Wie kann ich was bewegen?“ – Folge 22: Mit Sigrid Arnade Die studierte Tiermedizinerin und Ökologin Dr. Sigrid Arnade ist auf einen Rollstuhl angewiesen. Ihr Gespür für Gerechtigkeit und der Drang dafür zu kämpfen, ließen sie zur Journalistin und Aktivistin werden. So wurde Dr. Arnade Geschäftsführerin der Interessenvertretung Selbstbestimmt Leben e.V. und ist heute als Sprecherin der LIGA Selbstvertretung aktiv und wurde mehrfach für ihre aktivistische Arbeit… 10. Mai 2022 Podcast: „Wie kann ich was bewegen?“ – Folge 21: Mit Lisa Göldner (Teil 2 / 2) Die erfolgreiche Klimaaktivistin bespricht mit mir und Benjamin Schwarz in Teil zwei dieses Gesprächs, was ihr aktuell mehr Angst bereitet, ein dritter Weltkrieg oder die Klimakrise. Aber auch, welche Parallelen diese beiden Themen haben. Ich zeige zudem die gravierende Problematik des Eco-ableism auf, die systematische Benachteiligung von Menschen mit Behinderung im Umweltschutz. Wir drei diskutieren,… 26. April 2022 ←Vorherige Seite 1 2 3 4 Nächste Seite→ [mc4wp_form id=“50673″]"
