["https://raul.de/allgemein/ich-moechte-nicht-geheilt-werden"]
title = "Ich möchte nicht geheilt werden! - Raúl Krauthausen"
description = "Warum ich ein Problem mit dem Begriff „Heilerziehungspflege“ habe - und mit den Folgen, die sich aus der Bezeichnung oftmals ergeben."
full_description = "Ich möchte nicht geheilt werden! Warum ich ein Problem mit dem Begriff „Heilerziehungspflege“ habe – und mit den Folgen, die sich aus der Bezeichnung oftmals ergeben. Worte bewegen unsere Welt. Worte geben Sinn, bewerten, entwerten, gestalten, können Neues erschaffen und zerstören. Worte sind mächtig. Und deshalb können Bezeichnungen einen großen Unterschied machen. In diesem Zusammenhang finde ich den Begriff „Heilerziehungspflege“ äußerst problematisch. Warum das so ist, möchte ich im Folgenden erklären – und zur Diskussion anregen, wie wir gemeinsam vorurteilsfreie Sprache, Begriffe und damit auch wertschätzendes Verhalten entwickeln können. Was genau ist Heilerziehungspflege (HEP)? In den Beschreibungen zum Berufsbild der Heilerziehungspflegenden liest man deren Aufgaben: Menschen mit geistiger, körperlicher, seelischer oder mehrfacher Behinderung aller Altersgruppen sollen sozialpädagogisch und pflegerisch in ihrem Leben begleitet, versorgt und erzogen werden. Außerdem umfasst der Tätigkeitsbereich Beratung in allen lebenspraktischen Fragen, in Rechtsfragen und auch bei sensiblen zwischenmenschlichen Beziehungen. Wenn nötig sollen durch die Heilerziehungspflegenden Planungs-, Unterstützungs- und Assistenzprozesse eingeleitet und voll umfassend begleitet werden – dabei soll dem behinderten Menschen ein möglichst selbstbestimmtes und selbständiges Leben ermöglicht werden. Nach einer 2-5 jährigen Ausbildung (je nach Bundesland) können Fachkräfte zum Beispiel in Tagesstätten, Wohnheimen, Einrichtungen für betreutes Wohnen, in der persönlichen Assistenz, in Einrichtungen der Psychiatrie, Berufsbildungsbereichen, Werkstätten, Integrativ- und Sonder-Kindertagesstätten und Rehabilitationseinrichtungen arbeiten. Definition des Begriffes „Heil-erziehungs-pflege“: „Heil-…“: Das Wort „Heil“ meint im Zusammenhang mit der Heilerziehungspflege grundsätzlich „Ganzheitlichkeit“. Kritik: Gleichzeitig findet sich der Begriff „Heilen“ meistens im medizinischen Kontext und bedeutet hier dann: „eine Krankheit beseitigen“. Die Idee einer „Heilung“ im Zusammenhang mit dem Thema Behinderung ist fatal – denn sie suggeriert, dass Behinderung etwas Defizitäres ist, das idealerweise beseitigt werden sollte. „…-Erziehungs-…“: Das Lexikon Brockhaus definiert Erziehung so: Unter Erziehung versteht man die pädagogische Einflußnahme auf die Entwicklung und das Verhalten Heranwachsender. Dabei beinhaltet der Begriff sowohl den Prozeß als auch das Resultat dieser Einflußnahme. (Brockhaus Enzyklopädie, Stichwort Erziehung). Kritik: Dies auf erwachsene Menschen – egal ob mit oder ohne Behinderung – anwenden zu wollen, ist unpassend und paternalistisch. In Deutschland finden erzieherische Maßnahmen bei Erwachsenen gesellschaftlich akzeptiert lediglich bei der Resozialisierung im Strafvollzug statt – in der Bemühung, dass Straftäter*innen ihr Verhalten ändern und sich den moralischen Vorstellungen der Mehrheitsgesellschaft anpassen. „…-Pflege“: Bei dem Begriff „Pflege“ geht es um Versorgung und Betreuung von kranken, behinderten oder sterbenden Menschen, die üblicherweise von Pflegefachkräften oder Angehörigen übernommen und so effektiv wie möglich durchgeführt wird. Kritik: Betroffene nennen es oftmals: „Hauptsache satt, sauber, trocken“. Der behinderte Mensch erscheint hierbei passiv. Allerdings ist die Grundidee vom Umgang mit behinderten Menschen, die Hilfe bei alltäglichen Tätigkeiten benötigen, so viel Selbständigkeit auch im hygienischen Bereich zu erhalten oder zu entwickeln. Der Balance-Akt: Der Aufgabenbereich von Heilerziehungspflegenden reicht oft stark in die Privatsphäre der behinderten Menschen hinein. Es wird schnell klar, dass hier besonders viel Empathie gefragt ist. Gerade auch bei Menschen mit schweren Mehrfachbehinderungen muss immer im Vordergrund stehen, den Willen und die Wünsche des*r Einzelnen als Priorität zu sehen. Nicht die Vorstellung des*der Heilerziehungspflegers*in, was seiner*ihrer Meinung nach für den behinderten Menschen das Beste wäre, ist entscheidend – sondern die Wünsche des*der Betroffenen. Auch wenn es Zeit und Geduld kosten mag, diese herauszufinden und zu verstehen, sollte dieser Aspekt immer maßgebend für Heilerziehende sein. Eines ist klar: Lebensbegleitung heißt nicht Bevormundung, sondern Unterstützung, wo es notwendig wird, Förderung, wo es möglich ist und aktives Eintreten gegen Benachteiligungen durch mangelnde Teilhabe. Das kann nur gelingen, wenn Heilerziehungspfleger*innen gelernt haben, Beeinträchtigungen, Ursachen und Auswirkungen richtig einschätzen zu können, Fähigkeiten und Ressourcen zu erkennen und zu aktivieren. Oft sind es Strukturen und Barrieren der Umwelt, die behinderten Menschen eine volle Teilhabe verwehren, wie zum Beispiel fehlende Rampen oder Aufzüge, nicht vorhandene Blindenleitsysteme oder nicht stattfindende Gebärdensprachdolmetschung und keine Texte in Leichter Sprache. Anstatt behinderte Menschen therapieren, normalisieren oder in Sondereinrichtungen stecken zu wollen, sollte immer zuerst der inklusive Weg gesucht werden. Heilerziehungspflegende sollten hier kooperativ und interdisziplinär denken und handeln – und mit anderen Berufsgruppen, Fachdiensten und Regelschulen Lösungen entwickeln. Gemeinsam mit den Betroffenen sollte über Ziele, Inhalte und Formen jeder Aktivität diskutiert und gemeinsam die bestmögliche Lösung gefunden werden. Das Ziel muss immer sein: Jeder Mensch sollte ein für sich sinnvolles und erfülltes Leben führen und als Teil der Gesellschaft aktiv sein können. Das Problem: In Gesprächen oder bei Online-Diskussionen mit Heilerziehungspflegenden habe ich immer wieder den Eindruck, dass ein großer Teil ihrer beruflichen Motivation ist, „gute Taten“ für hilfsbedürftige Menschen zu vollbringen. Und das „gute Gefühl“, sich um scheinbar hilflose Individuen kümmern zu können, über allem steht. Viele „lieben“ ihren Beruf und finden, dass es „nichts Schöneres gibt als behinderten Leuten zu helfen“. Ihre „Patienten sind immer so fröhlich und dankbar“. Wenn ich Vorträge vor Heilerziehungspflegern*innen halte und mit Vertretern*innen dieser Berufsgruppe diskutiere, wird mir immer wieder erzählt, wie befriedigend dieser Beruf ist, wie gut es sich anfühlt, gebraucht zu werden und helfen zu können – und wie sehr die Dankbarkeit der behinderten Menschen die Anstrengungen im Job vergessen lassen. Mir wird bei derartigen Beschreibungen nicht selten mulmig: Viel zu oft geht es um die guten Gefühle, die Heilerziehungspflegende empfinden. Und zu selten liegt der Fokus bei den Menschen mit Behinderung. So schön es ist, wenn man durch den Beruf Befriedigung empfindet – sollte diese nicht durch die Hilfsbedürftigkeit und Dankbarkeit der zu versorgenden Menschen entstehen. Jede*r Heilerziehungspfleger*in sollte regelmäßig seine*ihre Motivation für die Berufswahl hinterfragen. Generell finde ich die wiederkehrende Beschreibung „sie sind so dankbar“ höchst bedenklich. Die Heilerziehungspflegenden sind für die behinderten Menschen mit Assistenzbedarf da, hierfür werden sie ausgebildet und bezahlt. Wenn hier Dankbarkeit seitens der Betroffenen ins Spiel kommt – läuft etwas schief, stimmt die Balance nicht, findet die Zusammenarbeit nicht auf Augenhöhe statt. Statt behinderte Menschen zu fördern oder zu empowern, werden sie nicht selten separiert und abhängig gehalten, um sich – im schlimmsten Falle angetrieben von einem Helfersyndrom – das befriedigende Gefühl gebraucht zu werden, aufrecht erhalten zu können. Leider unterstützt so manche Beschreibung des Heilerziehungspflegeberufes diese Vorstellungen. Man liest zum Beispiel: Du wirst sehr viel Verantwortung für deine Schützlinge auf dich nehmen müssen, denn diese sind immer auf dich angewiesen und vertrauen auf deine Unterstützung. Möchtest du einen Beruf ausüben, in dem du sehr viel mit hilfsbedürftigen Menschen zu tun hast, echte Herausforderungen zu bewältigen hast und wo du wirklich gebraucht wirst, dann ist eine Ausbildung zum Heilerziehungspfleger bestimmt das Richtige für dich!. (Quelle: ausbildung.de) Oder: Du arbeitest mit Menschen und kannst die positiven Auswirkungen auf die von dir betreuten Menschen direkt erleben. (…) Ich finde es gut, enge Beziehungen und Freundschaften zu den betreuten Menschen aufzubauen. (Quelle: Zukunftsberuf Pfleger) Es wird von „Berufung“ (Quelle: Campus Berlin), „fürsorglichem“ Charakter (Quelle: azubiyo) und der hohen Anerkennung des Berufes durch die Gesellschaft (Quelle: Gesellschaft für Pflege- und Sozialberufe gGmbH) geschrieben. Behinderte Menschen werden auffällig häufig auf verschiedenen Ausbildungs-Portalen als „Schützlinge“ bezeichnet – eine Zusammenarbeit mit den Betroffenen auf Augenhöhe ist in diesen Konzepten offensichtlich nicht angedacht. Paternalismus pur. Wenn ich bisher das Thema Heilerziehungspflege kritisch aufgriff, gab es u.a. online heftige, zuweilen gekränkte oder auch einfach uneinsichtige Reaktionen von Heilerziehungspflegenden. Einige Beispiele: Du willst nicht geheilt oder gepflegt werden, interessant…… also manche Denkensweisen von Menschen mit Behinderung muss ich echt nicht verstehen. Jeder will so leben, wie er es möchte, aber diese Selbstbestimmungnummer, die kann man auch echt übertreiben. (Quelle: Facebook-Kommentar) Ich lasse mir wegen einer Berufsbezeichnung nicht madig machen, dass ich bestimmte Werte vertrete. Und ja – auch muss in meinem Alltag erziehen und pflegen. Das stellt nun mal einen Teil meines Berufes dar und das ist nicht zu verleugnen (Quelle: Facebook-Kommentar) Würde viele meiner Bewohner auch lieber im ambulant betreuten Wohnen sehen. Aber dieses ist nunmal bei vielen Behinderungsbildern nicht möglich. (Quelle: Facebook-Kommentar) Es ist nunmal Fakt, dass es bei schweren geistigen Behinderungen eine Grenze in den Möglichkeiten der Förderung gibt. Muss man darüber wirklich diskutieren? (Quelle: Facebook-Kommentar) Ein Lösungsansatz: Auch Menschen mit Behinderung, die selbst nicht wissen, welche Assistenz sie genau benötigen, haben einen eigenen Willen, der respektiert werden muss. Mehr noch: Der Wille sollte nicht nur respektiert werden, sondern er ist als Willensbekundung umzusetzender Arbeitsauftrag. Es steht Heilerziehungspflegenden nicht zu, die eigenen Maßstäbe für das Leben anderer Menschen anzulegen. Stattdessen ist es ihre Pflicht, zu prüfen, wie die Wünsche des*der Betroffenen gewahrt und umgesetzt werden können. Entsprechende Ansätze bietet das Prinzip des Personenzentrierten Denkens und der Persönlichen Zukunftsplanung. Dies ist eine Methode zur Unterstützung von Menschen mit hohem Assistenzbedarf. Die individuelle Planung von Perspektiven im Dialog mit den betroffenen Menschen und ihren Angehörigen orientiert sich an den Wünschen und den Zielen des betroffenen Menschen in allen Lebenssituationen (Schule, Beruf, Freizeit, Hobby). Der Ansatz fragt konkret danach, was der Einzelne braucht und will, um sein Leben mit Zufriedenheit und Wohlbefinden führen zu können. Hier wird mit Selbstbestimmung, Empowerment und Kompetenzen gearbeitet. Der Empowerment-Ansatz geht davon aus, dass der Mensch mit Behinderung immer auch Experte in eigener Sache und dass der Status des Erwachsenseins anzuerkennen und zu würdigen ist. Selbst dann, wenn diese Lebensweise nicht die wäre, die der*die Heilerziehungspflegende Fachkraft für sich selbst als „richtig“ empfinden würde. Behinderte Menschen wollen nicht geheilt, erzogen und gepflegt werden – sondern wünschen sich Assistenz und Unterstützung, um so selbständig wie möglich zu sein und nach ihren eigenen Vorstellungen leben zu können. Der Mensch mit Behinderung definiert selbst, was er*sie braucht – ganz egal, welche Behinderung vorliegt. Über die individuellen Bedürfnisse von behinderten Menschen sollte nicht das Personal entscheiden. Aber nicht nur ein neues Bewusstsein und neue Aufgabenstellungen bezogen auf den Berufsstand der Heilerziehungspflegenden sind nötig – auch eine andere Bezeichnung muss her. Eine treffende, wertschätzende, auf Respekt basierende, die den Assistenz-Charakter der Tätigkeit hervorhebt. In diesem Sinne schlage ich als neue Berufsbezeichnung für die Heilerziehungspflege Inklusionsassistenz vor; als Anwälte*innen/Alliierte*innen der Betroffenen unterstützend aktiv zu werden – und nicht als Vormund. Fragen, die ich zum Thema Heilerziehungspflege mit euch diskutieren möchte: Gibt es Ausbilder*innen mit Behinderung? Wie inklusiv ist die Ausbildung der Heilerziehungspflege eigentlich? Gibt es behinderte Menschen, die diesen Beruf ausüben? Und wenn nein, warum nicht? Wird das medizinische oder das soziale Modell von Behinderung gelehrt? Wie kann verhindert werden, dass die Paternalismus-Falle zuschlägt? Welche Ideen, Anregungen und Vorschläge habt ihr zu dem Thema? (sb) Weitere Beiträge entstanden durch die Unterstützung zahlreicher Supporter auf SteadyHQ.com. Hier kannst auch du mich bei meiner Arbeit unterstützen: (Foto: JD, Gesellschaftsbilder.de)"
