full_description = "Wie kann ich was bewegen? Wie wird aus politischem Protest politisches Handeln? Wie kann ich als einzelner Mensch Einfluss nehmen? Kurz gesagt: Wie kann ich etwas bewegen? Darüber spricht der politische Aktivist Raul Krauthausen zusammen mit Benjamin Schwarz in diesem Podcast mit Deutschlands bekanntesten Aktivistinnen und Aktivisten. Jetzt auf Apple Podcasts via Spotify oder als RSS-Feed abonnieren! Auch als Transkript verfügbar. Podcast: „Wie kann ich was bewegen?“ – Folge 10: Mit Kathrin Henneberger Ich treffe auf Kathrin Henneberger. Sie war jahrelang Pressesprecherin von “Ende Gelände” und kämpft gegen die Zerstörung von Klima und Natur durch Kohlekonzerne. Nun kandidiert sie als Politikerin von Bündnis 90/Die Grünen für den Deutschen Bundestag. Raul und Kathrin sprechen über den Ernst der Klimakrise, Gewalt und Aktivismus, die globale Klimagerechtigkeit und die Schuldfrage. Und… 23. September 2021 Podcast: „Wie kann ich was bewegen?“ – Folge 9: Mit Luisa Neubauer Ich spreche mit Luisa Neubauer, Deutschlands bekanntester Klimaschutzaktivistin. Gemeinsam mit Greta Thunberg rief die studierte Geografin mit Fridays for Future eine Bewegung ins Leben, die weltweite Missstände des Klimaschutzes in vielen Ländern auf die politische Agenda brachte. 18. Juni 2021 Podcast: „Wie kann ich was bewegen?“ – Folge 8: Mit Orry Mittenmayer Ich spreche mit dem Gewerkschafter Orry Mittenmayer, seines Zeichens Aktivist für bessere Arbeitsbedingungen und Vorsitzender des ersten Betriebsrates von Deliveroo. Er ist Gründer der Kampagne “Liefern am Limit”, Politikwissenschaftler, gelernter Buchhändler und zudem ehrenamtlicher Aktivist bei der Gewerkschaft Nahrung-Genuss-Gaststätten (NGG). 3. Juni 2021 Podcast: „Wie kann ich was bewegen?“ – Folge 7: Mit Margarete Stokowski Ich spreche mit Margarete Stokowski, Deutschlands wichtigster Feministin. Durch ihre Texte über Macht, Sex und Körper, aber auch Rechtspopulismus, Pornos oder Gender Studies, ist sie Vorbild und Vordenkerin im Kampf gegen das Patriarchat. Im Gespräch mit geht es um ihren politischen Einfluss als Autorin und gewalttätigen Protest. 21. Mai 2021 Podcast: „Wie kann ich was bewegen?“ – Folge 6: Mit Shai Hoffmann Raul trifft Demokratie-Aktivist Shai Hoffmann, einen ehemaligen deutschen Schauspieler, der gleichzeitig Sozialunternehmer, Speaker und Moderator ist. Er initiierte gemeinnützige Projekte wie den Bus der Begegnungen, den DemokratieBus, das Tiny House Grundgesetz und den Bus der Zukunft. Er tourte durch Deutschland, um wildfremde Menschen zum Dialog einzuladen. Seine Vision ist eine Gesellschaft, die bunt, vielfältig und… 8. Mai 2021 Podcast: „Wie kann ich was bewegen?“ – Folge 5: Mit Tupoka Ogette Tupoka Ogette ist Autorin, Trainerin, Beraterin und Aktivistin für Rassismuskritik und Antirassismus. Tupoka ist bundesweit bekannt und gehört zu den begehrtesten Speakerinnen des Landes. Ihr Bestseller „exit Racism“ handelt von Rassismus und seinen Wirkungsweisen. Es ist jedoch viel mehr als ein Sachbuch, es ist ein Workshop und mittlerweile das Standardwerk rassismuskritischer Bildungsarbeit. 22. April 2021 Podcast: „Wie kann ich was bewegen?“ – Folge 4: Mit Cesy Leonard von den Radikalen Töchtern Cesy Leonard ist Künstlerin und Aktivistin. Sie gehörte zum kreativen Kernteam des Zentrums für Politische Schönheit, mit dem sie unter anderem Björn Höcke eine Version des Berliner Holocaust-Mahnmals neben sein Haus in Thüringen baute. Seit mehr als 10 Jahren arbeitet sie als politische Aktionskünstlerin. 2019 gründete sie gemeinsam mit Katharina Haverich die Radikalen Töchter. Die… 8. April 2021 Podcast: „Wie kann ich was bewegen?“ – Folge 3: Mit Reconquista Internet Die Bewegung Reconquista Internet (heute forum:neuland) steht für „Liebe und Vernunft“,die Zivilisierung und wortwörtlich die Rückeroberung des Internets. Oder auch: den Nazis nicht das Netz überlassen. Die Aktivistinnen und Aktivisten helfen mit Initiativen wie „Hass melden“ den Opfern von Hass im Netz, indem sie dafür sorgen, dass diese strafrechtlich verfolgt werden. Öffentlich treten sie so… 25. März 2021 Podcast: „Wie kann ich was bewegen?“ – Folge 2: Mit Dr. Gerhard Schick Er verzichtete auf sein einflussreiches Mandat im Bundestag, um Aktivist zu werden. Diesmal spricht Raul mit Dr. Gerhard Schick. Er war der finanzpolitische Experte der Grünen Bundestagsfraktion, bevor er alle Ämter abgab, um die Bürgerbewegung Finanzwende zu gründen. Mit Raul spricht er darüber, warum er glaubt, als Aktivist mehr erreichen zu können als im Parlament,… 20. März 2021 Podcast: „Wie kann ich was bewegen?“ – Folge 1: Mit Carola Rackete Die Naturschutzökologin Carola Rackete und Seenotretterin erzählt, warum sie den Begriff Aktivistin nicht mag und wieso die Klimabewegung nicht radikal genug ist. Raul und Carola diskutieren, wie negative Nachrichten unsere Weltsicht beeinflussen und warum Menschen für Zusammenarbeit gemacht sind. Schließlich berichtet Carola auch von der Seenotrettung mit Seawatch und warum sie die damit verbundene Aufmerksamkeit… 20. März 2021 ←Vorherige Seite 1 2 3 4 [mc4wp_form id=“50673″]"
