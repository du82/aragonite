full_description = "Was ich mache Die Kinder der UtopieUtopieEine Utopie ist eine Vorstellung von der Zukunft. Man stellt sich vor: So soll das Zusammen-Leben in der Zukunft sein. Oder: So sehen die Häuser in der Zukunft aus. Oder: So reisen wir in Zukunft von einem Ort zum anderen.Aktionen zu einem Kino-Film über Inklusion und Erwachsen-Werden. Der Film wurdee am 15. Mai 2019 in Kino vielen Kinos in Deutschland gezeigt. KIMBUK ist ein Kinderbuch-FestivalEs zeigt: Figuren in Büchern für Kinder und Jugendliche müssen vielfältig sein.KIMBUK ist ein Festival für:Macher*innen von Kinder-Büchern und Jugend-Büchern Buch-Verlage Leser*innen re:sponsiveRaúl Krauthausen war 8 Wochen lang unterwegs.Vor der Bundestags-Wahl 2017.Er hat Fragen gestellt.Er hat mit vielen verschiedenen Leuten gesprochen.Über Themen, die Euch wichtig sind. KRAUTHAUSEN face to faceFace to face sind Gespräche zu zweit.Ich spreche mit Gästen.Über Kunst.Über ihre Interessen.Und über ihren Blick auf das Leben.Und natürlich geht es auch ab und zu um das Thema Inklusion.AbilityWatchAbilityWatch ist eine Organisation behinderter Menschen.Sie organisiert Demonstrationen.Sie informiert Menschen und macht Aktionen.AbilityWatch zeigt immer wieder:Menschen mit und ohne Behinderung haben nicht die gleichen Rechte und Möglichkeiten.Die UN Behinderten-Rechts-KonventionUN Behinderten-Rechts-KonventionDie UN-Behinderten-Rechts-Konvention ist ein Vertrag von Menschen und Staaten. Man kann auch UN-Vertrag dazu sagen. Die Abkürzung für diesen Vertrag ist UN-BRK. Es geht um die Rechte von Menschen mit Behinderung. Sie müssen Teil der Gesellschaft sein. Sie dürfen nicht ausgeschlossen sein. Sie müssen bei allem mit-machen können. Zum Beispiel: Mit allen Menschen zusammen in die Schule gehen. Mit allen Menschen zusammen arbeiten. Mit allen Menschen zusammen Freizeit verbringen. Das Ziel ist: Gleiche Chancen und Möglichkeiten für alle. Ein gutes Leben für alle. wird nicht eingehalten. Inklusions-FaktenWarum muss es Inklusion in allen Schulen geben?Gründe dafür kann man auf dieser Internet-Seite lesen. SOZIALHELD*INNENSeit 2004 gibt es die SOZIALHELD*INNEN.Sie machen viele Projekte zum Thema Inklusion.Und sie finden spannende, neue Lösungen."
