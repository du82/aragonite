["https://raul.de/leben-mit-behinderung/warum-mich-wissenschaftliche-umfragen-muede-machen"]
title = "Warum mich wissenschaftliche Umfragen müde machen - Raúl Krauthausen"
description = "Täglich erreichen mich Umfragen über Umfragen von nicht-behinderten Studierenden, die von mir alles über Behinderung, Pflege, Therapie usw. wissen wollen. Gut gemeint? Möglich. Aber auch nervig. Denn gut gemacht geht oft anders. Wissenschaft ist keine Einbahnstraße und Expertenwissen nicht immer kostenlos!"
full_description = "Warum mich wissenschaftliche Umfragen müde machen Täglich erreichen mich Umfragen über Umfragen von nicht-behinderten Studierenden, die von mir alles über Behinderung, Pflege, Therapie usw. wissen wollen. Gut gemeint? Möglich. Aber auch nervig. Denn gut gemacht geht oft anders. Wissenschaft ist keine Einbahnstraße und Expertenwissen nicht immer kostenlos! Es ist ein alltägliches Ritual, das nicht gerade zu meinen Leidenschaften gehört: Das Wegklicken von Mails. Nicht einmal antworten. Klingt arrogant. Ist aber eine Notreaktion, schließlich hat der Tag nur 24 Stunden. Denn ich empfinde es nicht als Privileg mit Umfragen zum Leben mit Behinderung überschüttet zu werden. Nicht, dass diese an sich blöd wären. Aber mich beeindruckt nicht nur, wie viele es sind, sondern wie sie daherkommen. Lela Finkbeiner, eine Expertin für Diversitätsforschung, hat ihre Eindrücke von der Umfragenschwemme in einem Facebookpost so beschrieben: „Manchmal beschleicht mich das Gefühl, ihr denkt alle, die Welt hat auf Euch gewartet. Schmeißt einfach so Umfragen ungefragt ins Netz und wartet darauf, dass sich zahlreiche Leute auf Eure ellenlangen Texte und hunderte Fragen mit Freude melden, alle Welt es sehr spannend findet, was ihr da gerade tut. Wir werden tagtäglich mich solchen Anfragen überschwemmt und es werden immer mehr.“Lela Finkbeiner, Expertin für Diversitätsforschung, via Facebook Nun drängt sich natürlich die Frage auf: Ist es nicht gut, ein Anzeichen für Inklusion, wenn es so viele Umfragen gibt? Diese Frage ist schwer zu beantworten. Aber so, wie es jetzt läuft, ist es nicht gut. Mir fällt auf, wie wenig vorbereitet die Fragensteller*innen sind. In die Materie sind sie kaum eingearbeitet, ihre Umfragen erscheinen zuweilen wie hastig zusammengeschustert – und dann sehe ich: Es geht um eine Bachelor-Arbeit. Auch die muss es geben. Aber klar: Mit Einführung des BA-Studiengangs gibt es auch mehr Abschlussarbeiten, die zu schreiben sind. Ernsthafte Forschung dagegen sieht anders aus. Die Fragestellungen in vielen Umfragen gehen meiner Meinung nach an den Lebenswelten von Menschen mit Behinderung vorbei – sie drücken eine unsichtbare Distanz aus, die man nur allzu gut kennt. Aus den Fragebögen gafft mich dann ein Gesicht an, als wäre ich ein Objekt im Zoo. Nicht schön. Ich habe persönlich seit einiger Zeit den Schluss gezogen, Umfragen erst ab einer Masterarbeit oder höher zu beantworten, wenn überhaupt. Noch einmal, das klingt arrogant. Aber ich würde mich über gut gemachte Umfragen einer BA-Arbeit verdammt freuen. Nur gibt es sie kaum. Es ist schon interessant: Da nehmen Umfragen zur Inklusion inflationär zu, aber was bewirken sie? Sind sie etwa Vorboten dafür, dass sich etwas bewegt? Dass die Mehrheitsgesellschaft Augen und Ohren öffnet für diese Menschenrechtsfragen? Ich befürchte, diese Umfragen schürfen nur an einer Oberfläche. Sie kommunizieren wie in einer Einbahnstraße. Und ihre Effekte bleiben aus. Womöglich bedienen sie nur das Abschlussregelwerk eines Wissenschaftssystems, das nicht wirklich inklusiv denkt und handelt. Die Bachelor-Arbeit ist halt auch “nur” eine Zwischenstation zum Master, an die sich später niemand mehr erinnert. Die taube Aktivistin Lela Finkbeiner, hat dazu ein paar Tipps, wie man es richtiger machen könnte: „Schonmal daran gedacht, dass die Strategie nicht wirklich passend ist: zu viele Fragen, zu viel Text, keine DGS (Deutsche Gebärdensprache), keine tauben Interviewpartner*innen (ja, das kann eine sehr große Rolle spielen, besonders bei psychologischen Themen), auch nicht selten den ‚Probanden‘ das Gefühl geben, sie werden für die eigenen Ziele ausgebeutet und sich nicht wirklich für die Barrieren, Sorgen, Ängste, etc. der Community interessiert, bzw. im Regen stehen gelassen. Ist ja schließlich nicht Euer Problem.“Lela Finkbeiner, taube Aktivistin Ein Ausweg wäre mehr Ernsthaftigkeit. Auch mehr Bereitschaft zuzuhören, nicht nur eine „Befindlichkeit“ mal eben schnell „abfragen“. Sowas ist nicht leicht. Aber vielleicht ginge es mit einem inklusiven Ansatz besser: Wurden die Fragen gemeinsam mit Kommiliton*innen erarbeitet, die eine Behinderung haben? Woran liegt es, dass die Beziehung zwischen der Wissenschaft und uns Menschen mit Behinderung als Forschungsobjekte nicht gerade harmonisch abläuft? Lela Finkbeiner hat mir dazu eine Videomail geschickt: „Traditionell werden Menschen mit Behinderung an den Rand gedrängt, eben auch von den Wissenschaften“, sagt sie. Und im gesamten Bereich der Pädagogik, überall dort, wo man sich mit Inklusion beschäftigt, finde man keine ethischen Leitlinien „Unterschwellig kriegen wir zu spüren, dass die Forschenden davon ausgehen, ihre Arbeit habe ganz hohe Relevanz“.Lela Finkbeiner Was, wenn Betroffene an den Umfragen nicht mitwirken wollen, sind sie dann Spielverderber*innen? Es brauche mehr Austausch darüber, mehr Zugänglichkeit zu den Ergebnissen. Denn es stimmt: Welche Ergebnisse einer wissenschaftlichen Umfrage, an der ich teilgenommen habe, erhielt ich zugeschickt? So gut wie keine! Und von denen die ich bekam, überraschten mich die Ergebnisse nur selten. Damit die Wissenschaft in ihrem Einbahnstraßenmodus nicht in einer Sackgasse landet, braucht sie mehr Inklusion. Aber noch immer sind Forschende mit Behinderung unzureichend beteiligt. Auch wenn sie einen Hochschulabschluss haben, verfügen sie über schlechtere Karrierechancen als nichtbehinderte Absolvent*innen – wie überall in der Gesellschaft, von wegen „Golden Ticket“ oder „Quotenbehinderte*r“: Leistung wird schlicht nicht anerkannt, obwohl alle davon profitieren, und zwar in jeder Wissenschaftsdisziplin. Fangen wir vielleicht mit der Inklusions- und Teilhabeforschung an; dort fällt ein Mangel an Inklusion selbst halt besonders krass auf. Es gibt ein Projekt, dass mir sehr gut gefällt: AKTIF ist ein Zusammenschluss von Forschenden ohne und mit Behinderung, das schafft Synergien und Schub. Ähnlich arbeitet das ZeDiSplus, Fachkolleg Inklusion, Institut für inklusive Bildung und iXnet. Wir brauchen mehr Aktif! und Co. Lela Finkbeiners Gedanken dazu: “Es ist an der Zeit über einen Paradigmenwechsel im wissenschaftlichen Arbeiten nachzudenken. Es reicht nicht aus, dass ausschließlich geschaut wird, ob Arbeiten wissenschaftlichen Standards entsprechen, um unter Privilegierten bestehen zu können. Bewertet und finanziert werden sollte auch und vor Allem, wie Wissenschaft zum Empowerment beitragen kann innerhalb marginalisierter Gruppen, hier im Fall für Menschen mit Behinderungen. Um entsprechende Rahmenbedingungen zu schaffen, stehen alle in der Verantwortung. in erster Linie Privilegierte an Universitäten. Eine Idee: Warum knüpfen zum Beispiel Auftraggeber*innen von Projekten und Studien die Vergabe nicht mit der Forderung einer Quote von daran beteiligten behinderten Forschenden?” Und nun zur nächsten Umfrage… Dieser Beitrag erschien in Zusammenarbeit mit der tauben Expertin für Diversitätsforschung Lela Finkbeiner."
