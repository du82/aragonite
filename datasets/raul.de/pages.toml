description = "Ich bin für und . Als Rollstuhlfahrer weiß ich:Eine barrierefreie und inklusive Gesellschaft ist wichtig. Darum setze ich mich dafür ein.Jeden Tag. Ich arbeite bei den SOZIALHELD*INNEN mit. Ich schreibe einen eigenen . Und ich mache einen .In meinen Podcast lade ich Gäste ein.Zum Beispiel bekannte Künstlerinnen.Oder bekannte . Ich schreibe einen .Immer einmal in […]"
full_description = "Ich bin Raul Krauthausen Ich bin AktivistAktivist / AktivistinEin Aktivist oder eine Aktivistin setzt sich für etwas ein. Die Person macht sich für etwas stark. Zum Beispiel für die Rechte von Menschen mit Behinderung. Die Person spricht mit vielen Menschen darüber. Zum Beispiel mit Politikern und Politikerinnen. für InklusionInklusionInklusion bedeutet dazugehören. Es heißt: Alle Menschen sind Teil der Gesellschaft. Alle sind dabei und können mitmachen. Man hört ihnen zu. Alle haben die gleichen Rechte. Und alle haben die gleichen Chancen. Alle haben ein gutes Leben zusammen. Das ist das Ziel. und Barriere-FreiheitBarriere-FreiheitBarriere-Freiheit heißt: Es gibt keine Hindernisse. Zum Beispiel: Alle Menschen kommen in ein Haus. Auch Menschen mit Rollstuhl. Weil es eine Rampe gibt. Oder: Alle Menschen können die Informationen verstehen. Weil sie in Gebärden-Sprache übersetzt werden. Und in Leichte Sprache. Barriere-Freiheit ist für alle Menschen gut. Sie können alle Orte erreichen. Und sie können alle Informationen verstehen. Durch mehr Barriere-Freiheit gibt es mehr Teilhabe..Als Rollstuhlfahrer weiß ich:Eine barrierefreie und inklusive Gesellschaft ist wichtig. Darum setze ich mich dafür ein.Jeden Tag. Ich arbeite bei den SOZIALHELD*INNEN mit. Ich schreibe einen eigenen BlogBlogEin Blog ist eine Internet-Seite. Eine Person schreibt Texte in diesem Blog. Diese Person nennt man Blogger oder Bloggerin. Die Texte haben ein festes Thema. Zum Beispiel Inklusion.. Und ich mache einen PodcastPodcastEin Podcast kann eine Ton-Datei sein oder ein Video. Ein Podcast kann wie eine Radio-Sendung sein. Oder wie eine Fernseh-Sendung. Einen Podcast kann man sich im Internet ansehen oder anhören. Oder man kann ihn herunter-laden. Man kann ihn jederzeit hören oder sehen..In meinen Podcast lade ich Gäste ein.Zum Beispiel bekannte Künstlerinnen.Oder bekannte Aktivist*innenAktivist / AktivistinEin Aktivist oder eine Aktivistin setzt sich für etwas ein. Die Person macht sich für etwas stark. Zum Beispiel für die Rechte von Menschen mit Behinderung. Die Person spricht mit vielen Menschen darüber. Zum Beispiel mit Politikern und Politikerinnen.. Ich schreibe einen NewsletterNewsletterNewsletter ist das englische Wort für Info-Brief oder Mitteilungs-Post. Meistens werden Newsletter als E-Mail verschickt. So erfährt man Neuigkeiten. Zum Beispiel Neuigkeiten zum Thema Inklusion. Für einen Newsletter muss man sich anmelden. Das heißt: Man trägt seine E-Mail-Adresse ein. Dann bekommt man den Newsletter geschickt..Immer einmal in der Woche.Den Newsletter könnt ihr abonnieren.Das bedeutet:Ihr bekommt ihn immer wieder zugeschickt. Ich freue mich, wenn Ihr meine Arbeit unterstützt.Durch eine Spende. Weiterlesen: Wer ich bin"
