full_description = "Allgemein Krautreporter-Kommentar: So blockieren Eltern und Lehrkräfte die Inklusion behinderter Kinder Sie warten darauf, dass jemand anderes das Problem löst. Dabei könnten sie jetzt schon helfen. 29. November 2024 Pop & Pasta mit Raúl Krauthausen und Saioa Alvarez Raúl Krauthausen ist Inklusions-Aktivist und Gründer der SOZIALHELD*INNEN. Als studierter Kommunikationswirt und Design Thinker arbeitet Raúl Krauthausen seit über 15 Jahren in der Internet- und Medienwelt: als Moderator, Speaker, Podcasthost und Autor. 2013 erhielt er das Bundesverdienstkreuz am Bande. Bei Pop & Pasta spricht er Politik, Medien, Kinderbücher und seine Ehe. 28. Oktober 2024 Bosetti Late Night: „Luke Mockridge – Darf er das?“ vom 29. September 2024 Witze über Menschen mit Behinderung: diskriminierend oder inklusiv? Wann wird Kritik zu Cancel Culture? In „Bosetti Late Night“ gehen Sarah Bosetti und ihre Gäste Janina Nagel, Raul Krauthausen und Okan Seese dem viel diskutierten Thema auf den Grund. 2. Oktober 2024 Krautreporter-Kommentar: Diese Umweltpolitik schadet Menschen mit Behinderung vom 11. September 2024 Die meisten sind sich einig, dass die Klimakrise bekämpft werden muss. Nur: Wenn dieser Kampf so weitergeht, wird die Klimakrise vor allem behinderte Leben fordern. 25. September 2024 Inklusion ist keine Frage des Geldes – Es geht um gleichwertige Teilhabe! Inklusion ist mehr als eine wirtschaftliche Notwendigkeit – sie ist ein grundlegendes Menschenrecht! In meiner Rede auf dem Vielfaltskongress der GRÜNEN habe ich klargemacht, dass behinderte Menschen nicht nur dann wertvoll sind, wenn sie dem Arbeitsmarkt dienen. Inklusion bedeutet gleichberechtigte Teilhabe für alle – unabhängig von Produktivität oder Leistungsfähigkeit. Doch warum sind wir in Deutschland… 22. September 2024 re:publica 2024: Wie sähe ein kultureller Wendepunkt für echte Inklusion aus? Es geht um weit mehr als barrierefreie Zugänge und normative Lösungen. Es geht um eine tiefgreifende kulturelle Veränderung, die Inklusion nicht als Herausforderung, sondern als Chance begreift. 6. Juni 2024 re:publica 2024: Raul Krauthausen und Georgine Kellermann – Der lange Weg zu mir selbst: Meine Befreiung als trans* Frau nach über 60 Jahren Im Gespräch mit Raul Krauthausen spricht Georgine Kellermann über ihr neues Buch, ihr Coming-out mit 62 Jahren, ihre Vorstellungen von einer diversen Gesellschaft und vom Glück, sie selbst sein zu dürfen. 28. Mai 2024 Ulrich Hartmann zu Gast bei KRAUTHAUSEN – face to face Ulrich Hartmann ist Musiker, Moderator und Aktivist, der in Berlin lebt. Er studierte u. a. Musik an der Popakademie und ist bei der „Aktion Luftsprung“ tätig, einer Stiftung, die sich dem künstlerischen und beruflichen Einstieg chronisch erkrankter Menschen widmet. Als Profimusiker leitet er mit seinen Erfahrungen und seinem musikalischen Talent das Projekt Projekt „Luftsprung Live“,… 27. April 2024 Sema Gedik zu Gast bei KRAUTHAUSEN – face to face Zu Gast bei KRAUTHAUSEN – face to face: Sema Gedik, Modeschöpferin und Unternehmerin. Wir diskutieren über Semas Weg in die Modebranche, der durch die Erkenntnis geprägt wurde, dass es mehr Mode für Hunde als für kleinwüchsige oder behinderte Menschen gibt. Gedik, die Modedesign an der HTW Berlin und dem Amsterdam Fashion Institute studierte, hat sich… 18. Februar 2024 Ich bin müde. Ein Appell gegen Grabenkämpfe und für echte Begegnung Lasst uns die Online-Debatten herunterfahren und uns mehr auf echte, persönliche Begegnungen konzentrieren. Vielleicht finden wir dann den Weg zurück zu einer Gemeinschaft, die auf Respekt, Verständnis und gemeinsamen Werten basiert. 16. Dezember 2023 1 2 3 … 25 Nächste Seite→ [mc4wp_form id=“50673″]"
