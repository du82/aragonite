ieser Folge zeigen wir dir, wie unterschiedlich die Arbeit verschiedener Aktivist:innen ist und wie auch du dich aktivistisch engagieren kannst. Aktivistinnen wie Luisa Neubauer, Margarete Stokowski und Cesy Leonard sprechen darüber, wie sie zum Aktivismus kamen,… 3. April 2024 Podcast: „Wie kann ich was bewegen“ – in einer Partei?, Folge 35: Engagiere dich und gestalte Politik aktiv mit! In dieser Episode beleuchten wir, wie du in einer Partei deinen Platz finden kannst. Emily Büning, Bundesgeschäftsführerin der Grünen, und Nela Riehl, Spitzenkandidatin von Volt für die Europawahl, teilen ihre persönlichen Erfahrungen. Sie betonen, wie erfüllend es ist, eine politische Heimat zu finden, und unterstreichen die Bedeutung von… 19. März 2024 Podcast: „Wie kann ich was bewegen“ – beim Deutschen Roten Kreuz?, Folge 34: In dieser Folge geht es Raul um das Deutsche Rote Kreuz und die Arbeit mit Geflüchteten. Dafür haben wir mit Bastian Schlinck, Fachreferent für die Bereiche Migration und Integration / Bürgerschaftliches Engagement beim Deutschen Roten Kreuz (DRK), gesprochen. Er verrät uns auch alles über die vielfältigen Möglichkeiten, sich beim DRK ehrenamtlich zu engagieren, insbesondere in… 6. März 2024 Podcast: „Wie kann ich was bewegen“ – In der Kindernothilfe?, Folge 33: In dieser Episode tauchen wir tief in die Welt der Kindernothilfe ein, einer Organisation, die sich dem Kampf gegen Armut, Ausbeutung und Ungerechtigkeit verschrieben hat, die Kinder weltweit betreffen. Gemeinsam mit Iven Schwerdtfeger und Katrin Weidemann von der Kindernothilfe entdecken wir, wie sich jeder Einzelne einbringen und einen echten Unterschied im Leben von Kindern machen… 20. Februar 2024 Podcast: „Wie kann ich was bewegen“ – Amadeu-Antionio-Stiftung?, Folge 32: In dieser Folge zeigen Raul und Anna Weers von der Amadeu Antonio Stiftung wie du dich gegen Rechts engagieren kannst. Vor allem in ländlichen Regionen. Erfahre mehr über die mutigen Schritte, die wir gemeinsam unternehmen können, um gegen Rechtsextremismus vorzugehen und eine inklusive, gerechtere Welt zu schaffen. 15. Februar 2024 Podcast: „Wie kann ich was bewegen“ – bei Amnesty?, Folge 31: Gemeinsam mit Lisa Nöth und anderen Aktivistinnen von Amnesty Deutschland stellen wir die verschiedenen Formen des Engagements im Kampf für Menschenrechte vor, um dir den Einstieg in den Aktivismus zu erleichtern. Schwerpunkt ist der Protest gegen Menschenrechtsverletzungen im Iran. Wie kann ich was bewegen? ist dein Weg in das politische Engagement mit Raul Krauthausen. 23. Januar 2024 Podcast: „Wie kann ich was bewegen“ – bei PETA?, Folge 30: Pelzfarmverbot, Zirkusverbot, Kleintierverkaufverbot: die Arbeit von PETA bewegt nachweislich etwas! Aber wie kann man da mitmachen? 9. Januar 2024 1 2 3 4 Nächste Seite→ [mc4wp_form id=“50673″]"
