["https://raul.de/podcasts"]
title = "Podcasts von und mit Raúl Krauthausen"
description = "Gespräche mit den bekanntesten Aktivist*innen und Künstler*innen Deutschlands über das eigene Wirken, Teilhabe, und Inklusion."
full_description = "Podcasts Podcast Im Aufzug Alleine Aufzugfahren ist langweilig. Daher lade ich mir für meine Aufzugfahrten Gäste ein. Menschen, mit denen es garantiert nicht langweilig wird. Gäste, die mich und hoffentlich euch inspirieren. Die uns auf neue Gedanken bringen. Eines kann ich euch jetzt schon versprechen: Das werden die spannendsten und unterhaltsamsten Aufzugsfahrten eures Lebens. Website zum Podcast Apple Podcasts Spotify RSS Podcast Die Neue Norm Muss man drei “Behinderten” zuhören? Muss man nicht, man sollte. Judyta Smykowski, Jonas Karpa und Raúl Krauthausen brechen die Norm des Normalen auf und sprechen über Vielfalt, Inklusion und das Leben von Menschen mit Behinderung.Eben Die Neue Norm in Zusammenarbeit mit Bayern 2. Website zum Podcast Apple Podcasts Spotify RSS Podcasts, Video & TV Krauthausen – face to face Muss man drei “Behinderten” zuhören? Muss man nicht, man sollte. Judyta Smykowski, Jonas Karpa In “face to face”-Gesprächen tausche ich mich mit meinen Gästen über ihr künstlerisches Schaffen, persönliche Interessen und Lebenseinstellungen aus. Und natürlich geht es auch ab und zu um das Thema Inklusion. Website zur TV-Sendung Apple Podcasts Spotify RSS Podcast Wie kann ich was bewegen? Wie wird aus politischem Protest politisches Handeln? Wie kann ich als einzelner Mensch Einfluss nehmen? Kurz gesagt: Wie kann ich etwas bewegen?Darüber spricht der politische Aktivist Raul Krauthausen in diesem Podcast mit Deutschlands bekanntesten Aktivistinnen und Aktivisten. Website zum Podcast Apple Podcasts Spotify RSS Buch zum Podcasts Podcast Die Jugend von heute Wie ticken junge Menschen wirklich? Sind sie eher konsumfixiert oder nachhaltig? Sind sie als “Digital Natives 2.0”, mehr im Social Media Zuhause als im echten Leben? Und wo pendeln sie zwischen Sinnsuche & politischem Aktivismus? Im Podcast „Die Jugend von heute“ richte ich diese Fragen an jene, um die es dabei geht: die Jugend.In jeder Folge interviewe ich eine Person, welche die Generation Z alias Gen Z entweder persönlich vertritt oder sich intensiv mit ihr beschäftigt & auskennt. Zur Gen Z zählt dieser Podcast alle, die zwischen Ende der 1990er und bis Anfang der 2010er zur Welt gekommen sind. „Die Jugend von heute“ entstaubt altbekannte Blickwinkel auf Themen & Trends, die unsere Gesellschaft und den Zeitgeist prägen. Weil früher eben doch nicht alles besser war. Dieser Podcast wird produziert von Studio36. Zu den Folgen im Blog Apple Podcasts"
