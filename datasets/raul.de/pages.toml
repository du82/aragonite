["https://raul.de/leben-mit-behinderung/inklusion-ist-keine-frage-des-geldes-es-geht-um-gleichwertige-teilhabe"]
title = "Inklusion ist keine Frage des Geldes – Es geht um gleichwertige Teilhabe! - Raúl Krauthausen"
description = "Inklusion bedeutet gleichberechtigte Teilhabe für alle – unabhängig von Produktivität oder Leistungsfähigkeit. Doch warum sind wir in Deutschland noch so weit von echter Inklusion entfernt?"
full_description = "Inklusion ist keine Frage des Geldes – Es geht um gleichwertige Teilhabe! Inklusion ist mehr als eine wirtschaftliche Notwendigkeit – sie ist ein grundlegendes Menschenrecht! In meiner Rede auf dem Vielfaltskongress der GRÜNEN habe ich klargemacht, dass behinderte Menschen nicht nur dann wertvoll sind, wenn sie dem Arbeitsmarkt dienen. Inklusion bedeutet gleichberechtigte Teilhabe für alle – unabhängig von Produktivität oder Leistungsfähigkeit. Doch warum sind wir in Deutschland noch so weit von echter Inklusion entfernt? Wie wir das System grundlegend verändern müssen, um wirklich alle Menschen willkommen zu heißen. Erklärtes Ziel der Behindertenbewegung ist es, Inklusion zu schaffen, ableistische Barrieren abzubauen und eine Gesellschaft zu gestalten, an der alle Menschen gleichwertig teilhaben können. Doch davon sind wir noch weit entfernt, denn die vorherrschenden Strukturen sind alles andere als inklusionsfördernd, ganz im Gegenteil, sie sind sogar Exklusion schaffend und ausbeutend. Und alle Bemühungen, Inklusion voranzubringen, verfolgen einen fehlgeleiteten Ansatz, bei dem Inklusion einen wirtschaftlichen Zweck erfüllen muss. Die Behindertenrechts-Aktivistin Lela Finkbeiner schreibt hierzu: Wenn Kapitalismus Ableismus küsst, dann sieht das so aus:„Inklusion auf dem Arbeitsmarkt ist auch ein Schlüssel gegen den Fachkräftemangel.“Wer fragt, warum, hinterfragt die eigenen Definitionen zu Ableismus, bitte! Und auch ich sage es jetzt laut und deutlich: Inklusion ist keine Frage, die durch kapitalistisches Denken gelöst werden kann. Behinderte Menschen müssen gleichberechtigt im gesellschaftlichen, beruflichen, schulischen Alltag vorkommen. Egal, wie produktiv, egal, wie leistungsfähig wir sind. Wir haben ein Recht auf Teilhabe, nicht nur diejenigen unter uns, die mehr leisten können. Unser Recht besteht unabhängig von unserer körperlichen, seelischen Verfassung und unserer Nützlichkeit für den Arbeitsmarkt und wir verdienen Inklusion, die nicht auf Leistungs-Parametern beruht. Punkt! Aber was ist Inklusion überhaupt? Um zu verstehen, wie die Inklusion aussehen soll, die wir uns wünschen, greife ich gerne auf eine Analogie zurück, die wie folgt lautet: Inklusion ist wie im Park sein. Nehmen wir mal einen öffentlichen Park. Viele unterschiedliche Menschen kommen hier her, mit dem Plan, einen schönen Tag zu verbringen. Wenn ich im Park bin, habe ich als Besucher*in keinen Einfluss darauf, wer mit mir in diesem Park ist. Und natürlich muss ich mich nicht mit allen gleich gut verstehen. Manchmal geht mir sogar gegen den Strich, was andere Personen oder Gruppen tun. Doch wenn mir meine Nachbar*innen nicht passen, habe ich jederzeit die Möglichkeit, mich woanders hinzubegeben – wenn der Raum groß und barrierearm genug ist. In den Park kommen Menschen vor mir rein, andere gehen nach mir raus. Es gibt eine gemeinsame Zeit, die wir im Park verbringen. Und jede*r ist von Natur aus willkommen und hat das Recht, dort zu sein und teilzuhaben. Natürlich so lange man sich an bestehende Regeln hält, wie keinen Müll auf den Boden werfen und sich anständig benehmen. Verstößt jemand gegen diese Regeln, kann diese Person von Parkwächter*innen (also von Menschen, die für die Einhaltung von Regeln sorgen sollen) hinausgeschmissen werden. Solche barrierefreien Orte der Begegnung sollte es überall geben: Klassenräume, Kindergärten, Arbeitsplätze, Kulturräume, Mobilitätsräume, Freizeiträume. Orte, an denen nicht jede*r einzelne entscheidet, wer willkommen ist und mitmachen darf. Sondern, an denen alle teilhaben dürfen, solange sie dich anständig verhalten. Das wäre gelebte, wahrhaftige Inklusion. Uns müssen dieselben Räume auf dieselbe Art zur Verfügung stehen, wir müssen gleichberechtigten Zugang zu Gebäuden und Angeboten haben und müssen einander in unserer Vielfalt, in unserer Einzigartigkeit akzeptieren, oder zumindest hinnehmen. Wer hat denn dann das Mandat? Wieso fällt es uns aber so schwer, Inklusion auf diese Art umzusetzen? Zum einen liegt es an den laschen Gesetzen bzgl. Barrierefreiheit und Inklusion. Obwohl Deutschland die UN-Behindertenrechtskonvention vor fast 14 Jahren ratifiziert hat, gab und gibt es nur unzureichende Bemühungen, die versprochene gleichberechtigte Teilhabe in allen Lebensbereichen tatsächlich auch durchzusetzen. Die Beispiele hierfür sind zahllos. Der private Wirtschaftssektor bspw. unterliegt keiner Pflicht zur Barrierefreiheit und schließt so behinderte Menschen von gleichberechtigter Teilhabe aus. Unzählige neue Wohnungen, die aktuell in Berlin gebaut werden, werden nicht den Richtlinien zur Barrierefreiheit entsprechen. Genauso neue Fernzüge der Deutschen Bahn, die Einstiegsmöglichkeiten für Rollstuhlnutzende noch immer nicht vereinfacht hat und die Anzahl rollstuhlgerechter Plätze auf einem Minimum hält. Dies ist nicht mehr nur mit Fahrlässigkeit zu begründen, sondern dies ist eine ganz aktive Verweigerung, Inklusion ernst zu nehmen. Und die Untätigkeit unseres Staates, entsprechende Gesetze zu verabschieden, tut sein Übriges, Inklusion auszubremsen. Unser ganzes System ist darauf ausgelegt, Menschen mit Behinderungen auszusondern und in parallele Systeme abzuschieben. Systeme, in denen Bildung, Arbeit und Wohnen zu einer gesellschaftlichen Randerfahrung verkommt. Dabei gibt es durchaus das Bewusstsein, dass Schule, Arbeit und Wohnen inklusiv gestalten werden sollten. Doch die Umsetzungen sind eine Farce. Nehmen wir etwa die Schule. Förderschulen sollen zum Zwecke der Inklusion abgebaut und behinderte Kids auf Regelschulen inkludiert werden. Und die Zahlen belegen, dass Inklusion tatsächlich zu gelingen scheint. Dennoch werden immer mehr Förderschulen, (oder Sonderschulen, wie ich sie noch immer nenne, denn Kids werden mehr ausgesondert als gefördert), gebaut. Wie geht das zusammen? Eine Analyse von Hans Wocken hat ergeben, dass Kinder, die bereits Regelschulen besuchen und Schwierigkeiten mit dem Lehrstoff haben, lediglich als Kinder mit Förderschulbedarf umetikettiert werden. So wird kein einziges Kind von Förderschulen auf eine Regelschule inkludiert und die Zahlen sprechen dennoch von der versprochenen Inklusion. Das ist Betrug und Etikettenschwindel im großen Stil. Der Bildungssektor stellt sich quer und maskiert seine Untätigkeit perfide mit der Illusion von Inklusion. Wagen sich doch vereinzelt Eltern mit behinderten Kids vor und wollen ihr Kind auf Regelschulen unterbringen, endet dies nicht selten im Desaster. Oft sind es Eltern nicht-behinderter Schüler*innen, die nicht wollen, dass ihr Kind mit behinderten Kindern lernt. Und Lehrer*innen oder Erzieher*innen weigern sich, behinderte Kids zu unterrichten, mit der Begründung, nicht für das Unterrichten oder die Betreuung behinderter Kids ausgebildet zu sein. Doch dürfen sie sich einfach querstellen? Haben sie das Mandat, also die Entscheidungsgewalt, sich zu verweigern? Die Antwort ist ganz klar nein! Sie dürfen Inklusion nicht auf diese Weise im Weg stehen. Wenn ein*e Mitarbeiter*in bei BMW sagt, er*sie habe keine Lust, Sportwagen zu bauen, sondern schraubt stattdessen die Bauteile zu Postkutschen zusammen, dann hat er*sie den Job nicht lange. Warum also lassen wir Lehrkräfte, die nicht das Mandat haben, damit durchkommen, einer bestimmten Gruppe von Kids die Unterrichtung zu verweigern? Es liegt allein in der Verantwortung der Schulbehörde oder der Eltern des behinderten Kindes, über seine Ausbildung zu entscheiden. Nur dort liegt die Entscheidungsgewalt. Alle anderen Befindlichkeiten, von Lehrer*innen, von Eltern nicht-behinderter Kids, zählen nicht. Wenn Lehrer*innen sagen „Wir sind für behinderte Kinder nicht ausgebildet“, haben sie keine Lust, ihre Komfortzone zu verlassen. Denn: Eltern wurden auch nicht dafür ausgebildet, Kids mit Behinderung großzuziehen und dennoch tun viele von ihnen ihr Bestes, um sich den Gegebenheiten anzupassen. Also, wieso sollte man per se immer eine besondere Schulung benötigen? Davon auszugehen, dass Kinder mit Behinderung immer auf eine sonderpädagogische Fach- oder Pflegekraft angewiesen sind, ist schlichtweg falsch. Selbst eine Pflegebedürftigkeit, die von einer Fachkraft oder pflegenden Angehörigen übernommen wird, ist kein Grund für den zwingenden Besuch einer Sonder- oder Förderschule. Die Fackraftisierung des Themas Inklusion ist Teil des Problems, also die Fehlannahme, dass für alles, was mit Inklusion zu tun hat, eine Ausbildung vonnöten ist. Gesellschaftliche Teilhabe sollte unabhängig von Unterstützungsbedarf und Qualifikation von ALLEN ermöglicht werden und möglich sein. Denn die Alternative, Exklusion für Kids mit Behinderung, ist keine Alternative. Dies ist inakzeptabel, ist diskriminierend und nicht mit der UN-BRK vereinbar. Es darf also nicht mehr zählen, was einzelne Leute finden, die keine Entscheidungsgewalt haben. Aber solange die Verantwortung auf das Individuum (also das behinderte Kind) geschoben werden kann, haben solche Verweigerungen Erfolg. Was meine ich damit? Wir haben ein System, das für nicht-behinderte Menschen gestaltet ist und nur für sie reibungslos funktioniert. Behinderte Menschen, behinderte Kids kommen nicht vor. Das heißt, um in der Analogie von oben zu bleiben: Wir kommen nicht in den Park herein. Niemand dort hat eine Ahnung, was er*sie mit einer behinderten Person anfangen sollen, wie man überhaupt den barrierereichen Park betreten soll, wer dafür zuständig ist, den Park zugänglich zu machen. Der Finger wird auf den behinderten Menschen gerichtet und gefragt: „Wieso willst du überhaupt im Park mit uns sein? Geh doch auf dem Bordstein stehen. Da müssen wir uns nicht mit dir befassen“. Genau das muss verändert werden. Wir verdienen es, selbstverständlicher Bestandteil der Gesellschaft zu sein. Und behinderte Kids verdienen Schulen, die sie selbstverständlich, wie alle anderen Kids, besuchen können. Sie müssen im Bewusstsein von angehenden Lehrer*innen auftauchen, sodass diese später nicht behaupten können, sie hätten davon nichts geahnt, behinderte Kids unterrichten zu müssen. Schulen müssen mit Fördergeldern unterstützt werden, sodass die Gebäude barrierefrei gestaltet werden können, sie müssen beim Lehrplan mit bedacht werden, sodass auch leistungsschwache Kids teilhaben können. Die Ressourcen der Schule müssen Inklusion als festen Bestandteil einkalkulieren. Somit ist nicht mehr jedes behinderte Kind, das eine Regelschule besuchen möchte, ein problematisches Übel, das die Möglichkeiten der Schule strapaziert. Anstatt behinderte Schüler*innen für ihren Wunsch nach Inklusion zu bestrafen, benötigen wir ein Schulsystem, das mit Geld, Zugänglichkeit und Personal so auf Inklusion ausgelegt und ausgestattet ist, dass behinderte Kinder die Regel sein können und nicht die Ausnahme darstellen. Die falschen Mantras, die wir reproduzieren Wirklich Dinge umzusetzen, ist schwer. Was stattdessen passiert, ist, dass Politiker*innen oder Menschen in Entscheidungspositionen oft auf billige Mantras zurückgreifen, die wie ein Schutzschild wirken, um bloß nicht wirklich ins Handeln kommen zu müssen. Eine dieser Floskeln ist: „Wir müssen erst die Barrieren in den Köpfen senken.“ Dann wird genickt und geklatscht und jede*r macht sich auf den frommen Weg, an der eigenen Voreingenommenheit zu arbeiten. Aber nichts muss aktiv, akut jetzt und ein für alle Mal verändert werden. Straßen und Gebäude, Transport, Kommunikation und Arbeitsplätze werden nicht barrierefrei und inklusiv gestaltet, denn wir sind in unseren Köpfen noch nicht so weit. Für mich hat diese Aussage mehrere problematische Komponenten: Zum einen suggeriert sie, dass es überhaupt Barrieren in den Köpfen gibt. Was sicher nicht für alle zutrifft. Es könnte sein, dass bereits 90 % der Bevölkerung keinen einzigen problematischen Gedanken mit Behinderung verknüpft. Die Aussage, es gäbe Barrieren zu senken, schafft Tatsachen, die nicht überprüft und ggf. auch nicht überprüfbar sind. Zum Anderen bringt dieser Satz ggf. sogar mein Gegenüber auf die Idee, meine Behinderung als problematisch sehen zu dürfen, denn es suggeriert ja, dass die Mehrheit der Gesellschaft ein Problem mit Behinderung hat. Also kann ich getrost dazu gehören und wäre dabei in guter, großer Gesellschaft. Es wird eine Legitimation für diskriminierendes Denken geschaffen. Aber das größte Problem an diesem Satz ist eigentlich:Es wird die Verantwortung zur Veränderung auf die Zivilgesellschaft verlagert, die meistens keinen Einfluss hat, wobei wir wieder bei der Mandatsfrage wären. Denn genauso wenig, wie Individuen Inklusion im Wege stehen sollten, dürfen wir Inklusion in die Hände der Bevölkerung geben und mit der Umsetzung auf sie warten. Denn selbst, wenn sie so weit sind, haben sie keine Entscheidungsgewalt, Veränderungen auf den Weg zu bringen. Meine Nachbar*in kann noch so sehr wollen, dass ein behindertes Kind in die Klasse ihres Kindes geht, aber sie hat nicht den Einfluss, die Schule barrierefrei umbauen zu lassen. Daher halte ich es für eine paternalistische, faule Behauptung, die Gesellschaft wäre einfach „noch nicht bereit dafür“, behinderte Menschen im Alltag zu haben. Als müsse man behinderte Menschen vor der ignoranten Mehrheitsgesellschaft schützen. Aber Inklusion bedeutet nicht nur, dass jemand mit einer Behinderung ein Recht auf Anschluss zur Mehrheitsgesellschaft hat. Menschen ohne Behinderung haben auch ein Recht auf die Begegnung mit behinderten Menschen. Hier können doch auch zwei Seiten profitieren und nicht nur eine! Nun gut, Entscheidungsträger*innen scheinen nun aber davon auszugehen, dass diese Barrieren in den Köpfen bestehen und wollen dagegen vorgehen. Das Mittel der Wahl ist immer, Aufklärung zu betreiben. Die Aktion Mensch macht beispielsweise seit fast 60 Jahren Aufklärungskampagnen. Wären diese effektvoll, dann wären die Barrieren in Deutschlands Köpfen bereits abgebaut. Fakt ist aber, und das wissen wir aus Studien mit Aussteiger*innen aus der rechten Szene, dass nicht Aufklärung, sondern Begegnung den entscheidenden Impuls zum Umdenken setzt. Daher ist das größte Vergehen an behinderten Menschen, dass uns diese Begegnung verwehrt wird. Die Parallelsysteme von Förderschule, Werkstatt und Heimen sind nicht nur problematisch, da behindertes Leben darin verwaltet und ausgebeutet wird, sondern weil Parallelsysteme auch dafür sorgen, dass ebendiese wichtige Begegnung ausbleibt. Für behinderte Menschen heißt das also, dass der öffentliche Raum in allen Aspekten barrierefrei sein muss, damit Begegnung stattfinden kann. Und als Konsequenz dessen bauen sich auch Barrieren in den Köpfen ab, nicht umgekehrt. Was brauchen wir also? Behinderte Menschen sind die letzte Gruppe, die genannt und die erste Gruppe, die vergessen wird. Unsere Anliegen werden stets mit dem Kostenargument zum Schweigen gebracht. Würden wir Frauentoiletten auch mit einem Kostenargument abbügeln? In fast jedem öffentlichen Gebäude – Restaurants, Museen, Gemeindehäusern – gibt es zwei Toiletten, um Geschlechter zu trennen, aber die wenigsten Gebäude haben Rampen oder A"
