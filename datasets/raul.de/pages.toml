["https://raul.de/allgemein/ein-plaedoyer-fuer-eine-vielfaeltige-inklusive-gesellschaft"]
title = "Ein Plädoyer für eine vielfältige, inklusive Gesellschaft - Raúl Krauthausen"
description = "Menschen schauen neugierig und oft voyeuristisch, wenn sie mich sehen. “Was hat er?”, “Ist das eine Krankheit?”. Woher rührt diese defizitäre Sichtweise?"
full_description = "Ein Plädoyer für eine vielfältige, inklusive Gesellschaft Immer wieder erlebe ich es, dass Menschen in ihrem Alltag – auf der Straße, im Supermarkt, im Café innehalten, weil ihr Blick auf mich fällt. Plötzlich sind sie aus dem Konzept gebracht: Sie schauen neugierig, irritiert oder auch zuweilen offen voyeuristisch. Ich sehe die Fragezeichen in ihrem Gesicht: “Was hat er?”, “Ob er vielleicht Schmerzen hat?”, “Ist das eine Krankheit?”. Nicht selten werden diese Gedanken sogar direkt laut ausgesprochen. In Vorträgen erzähle ich immer mal wieder von der mir unbekannten Dame, die mich unvermittelt in der Bahn ansprach: Bei wem sind Sie in Behandlung? Eindeutiger kann man einen Menschen wohl kaum auf seine Diagnose, seine scheinbare Krankheit, seine Behinderung reduzieren. Eine größere Anzahl beliebter TV-Formate basieren auf der Empfindung, die viele Menschen beim Blick auf Behinderung oder scheinbares Leid haben: “Gut, dass ich nicht betroffen bin! Im Gegensatz zu ihm*ihr geht es mir ja noch gut!” Woher rührt diese defizitäre Sichtweise? Es gibt zwei populäre Ansätze zum Thema Behinderung: das medizinische und das soziale Modell. Beide unterscheiden sich komplett voneinander. Das medizinische Modell von Behinderung ist der klassische Ansatz, der seit jeher den Blick auf behinderte Menschen prägte. Hier wird Behinderung als Problem empfunden, als ein Zustand, der behandelt und im Idealfall beseitigt werden kann. Wenn eine Beseitigung nicht möglich ist, dann wäre wenigstens eine Optimierung des behinderten Menschen wünschenswert, um ihn möglichst schnell wieder zu einem “funktionierenden” Mitglied der Mehrheitsgesellschaft zu machen und wieder in den Arbeitsmarkt einzugliedern. Der behinderte Mensch wird auf sein “Defizit” reduziert: Der Mensch und seine Behinderung ist das Problem – behindernde Faktoren werden außen vor gelassen. Besonders bedenklich finde ich an diesem Modell, dass Behinderung problematisiert wird. Die Lösung des Problems wird vom behinderten Menschen und seinem familiären Umfeld erwartet. Dass durch die nicht-behinderte Mehrheitsgesellschaft behindernde Faktoren geschaffen und beibehalten werden (u.a. mangelnde Barrierefreiheit), die die Behinderung erst zu einem Problem machen – wird dabei nicht mit einbezogen. Um es klar zu sagen: Nicht Laufen zu können, macht nicht automatisch unglücklich – wohl aber durch nicht vorhandene Barrierefreiheit – Treppen, nicht funktionierende Aufzüge, keine Gebärdensprachdolmetuschng, fehlende Leitsysteme für Blinde usw. – vom gesellschaftlichen und beruflichen Leben ausgeschlossen zu werden. Dies zu verändern liegt weder in den Möglichkeiten, noch in der Verantwortung des einzelnen behinderten Menschen. Sondern ist eine Aufgabe, die gesamtgesellschaftlich angegangen und gelöst werden muss – zum Nutzen aller. Denn zum einen haben auch nicht-behinderte Menschen ein Anrecht darauf, mit behinderten Menschen zusammen zu leben. Und zum anderen stimme ich wenigstens einer Sichtweise des medizinischen Modells zu: Behinderung ist nicht notgedrungen ein statischer Zustand. Aber nicht in Richtung Heilung und Optimierung – stattdessen kann jeder nicht-behinderte Mensch schnell und unerwartet eine Behinderung erwerben. Statistisch gesehen ist das sogar weitaus häufiger der Fall, als dass eine Behinderung geheilt wird. Das soziale Modell sieht das Problem nicht in der behinderten Person selber, sondern in gesellschaftlichen Bedingungen, die verbessert werden müssen. Ganz simpel zusammengefasst: Während beim medizinischen Modell der Mensch und seine Behinderung das Problem ist, wenn er*sie beispielsweise eine Veranstaltung nicht besuchen kann, weil der Zugang nur über eine Treppe möglich ist – sieht das soziale Modell das Problem hier in der fehlenden Rampe, also der nicht barrierefreien Umgebung und wendet sich der Problemlösung zu. Das soziale Modell berücksichtigt eine große Anzahl an Aspekten, denn hier wird davon ausgegangen, dass die durch die Umwelt konstruierte Behinderung in allen Lebensbereichen stattfindet. Durch das im Jahre 2009 in Kraft getretene Übereinkommen der Vereinten Nationen der Rechte von Menschen mit Behinderungen (UN BRK) sollte die Sicht des sozialen Modells von Behinderung in der Gesellschaft übernommen werden. Acht Jahre später muss man leider sagen, dass nach wie vor die defizitorientierte Sicht auf Menschen mit Behinderung in Gesellschaft, Medizin und Politik dominiert. Gesellschaftlich ist die Durchsetzung des sozialen Modells besonders aus einem Grund erschwert: Menschen mit und ohne Behinderung haben im Alltag kaum Berührungspunkte. Behinderte Menschen sind auf dem ersten Arbeitsmarkt selten anzutreffen, die Inklusion in der Schule findet viel zu selten statt, so bleiben behinderte Schüler*innen an Förderschulen unter sich, der Wohnungsmarkt ist kaum barrierefrei und Menschen mit Behinderung wohnen oft in Wohngruppen oder Heimen, die ihnen zwar Barrierefreiheit ermöglichen – aber kein Zusammenleben mit nicht-behinderten Menschen. Der Lebensweg vieler Menschen mit Behinderung entwickelt sich häufig von einer Sonderschule hin zur Werkstatt mit angeschlossener Wohngruppe (die oft am Stadtrand liegen und mit öffentlichen Verkehrsmitteln schwer erreicht werden können, nicht selten nicht barrierefrei gestaltet sind) – Überschneidungen mit der nicht-behinderten Mehrheitsgesellschaft gibt es kaum. So sind nicht-behinderte Menschen oft ahnungslos, Fragen wie “Wie lebt die Person?” oder “Wie gestaltet sie ihr Leben?” können nicht kommuniziert werden, Freundschaften in der Schule und am Arbeitsplatz zwischen behinderten und nicht-behinderten Menschen können meistens erst gar nicht entstehen – durch die behinderte und nicht-behinderte Gesellschaft zieht sich ein Spalt. Als problematisch betrachte ich, dass Menschen mit und ohne Behinderung von Anfang ihres Lebens an getrennt aufwachsen und größtenteils unterschiedliche Bildungsinstitutionen besuchen. Dabei könnten wir die kindliche Unvoreingenommenheit nutzen, um schon in jungen Jahren in Beziehung zueinander zu treten und uns zu einer Wir-Gesellschaft zu entwickeln – Behinderung lediglich als ein Problem der behindernden Umwelt verstehen lernen, das gemeinsam gelöst werden kann. Kinder mit und ohne Behinderung sollten von Beginn an zusammen leben, lernen, spielen und Spaß haben – sie sollten gemeinsam aufwachsen dürfen. “Es ist normal, verschieden zu sein”, singt der Rapper Graf Fidi. Auch wenn diese Aussage in den vergangenen Jahren immer populärer geworden ist, spiegelt sie sich immer noch nicht ausreichend in unserem Gesellschaftsleben wider. Es gibt Menschen mit Behinderung, die viel Energie darauf verwenden, sich den Normen der nicht-behinderten Mehrheitsgesellschaft anzupassen. Eine Normalität, an der sich die Mehrheit der Gesellschaft orientiert, selbst wenn sie für einen behinderten Menschen aufgrund seiner Beeinträchtigung unerreichbar ist. Ein Beispiel: Wenn ein Mensch ohne Arme auf die Welt kommt, ist die übliche Reaktion, dieses “Defizit” durch Prothesen ausgleichen zu wollen (offensichtlich das medizinische Modell). Aber kann dieser Mensch nicht auch ohne Arme als vollständig empfunden werden? Kann es nicht zu seiner Individualität gehören dürfen, seinen eigenen Weg zu entwickeln und zu finden? Wenn wenn wir barrierefrei und vielfältig leben und denken würden – gäbe es dann noch eine Verwendung für den Stempel normal und nicht-normal? Ist es nicht endlich an der Zeit, jeden Menschen in seiner Verschiedenheit wahrzunehmen und zu akzeptieren? Wir sollten aufhören, den Menschen der Gesellschaft und selbst gestalteten Umwelt anzupassen. Stattdessen sollten wir gemeinsam an einer Gesellschaft arbeiten, die Vielfalt und Inklusion ermöglicht, in der jeder Mensch sich in seiner Individualität verstanden und aufgehoben fühlt, in der niemand um soziale Teilhabe kämpfen muss. Und wir sollten unsere Umgebung so gestalten, dass Barrierefreiheit zur Norm wird. (sb) Weitere Beiträge entstanden durch die Unterstützung zahlreicher Supporter auf SteadyHQ.com. Hier kannst auch du mich bei meiner Arbeit unterstützen:"
author = "Raul Krauthausen"
