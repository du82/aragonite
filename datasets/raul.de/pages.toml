full_description = "Referenzen re:publica 2024: Wie sähe ein kultureller Wendepunkt für echte Inklusion aus? Es geht um weit mehr als barrierefreie Zugänge und normative Lösungen. Es geht um eine tiefgreifende kulturelle Veränderung, die Inklusion nicht als Herausforderung, sondern als Chance begreift. 6. Juni 2024 re:publica 2024: Raul Krauthausen und Georgine Kellermann – Der lange Weg zu mir selbst: Meine Befreiung als trans* Frau nach über 60 Jahren Im Gespräch mit Raul Krauthausen spricht Georgine Kellermann über ihr neues Buch, ihr Coming-out mit 62 Jahren, ihre Vorstellungen von einer diversen Gesellschaft und vom Glück, sie selbst sein zu dürfen. 28. Mai 2024 Schließt die Häuser der Gewalt! Ein Jahr nach den Morden im Oberlinhaus zeigt sich: Nichts an der strukturellen Gewalt gegen behinderte Menschen hat sich geändert – und die geschlossenen Wohneinrichtungen stehen im Zentrum des Geschehens. Was jetzt getan werden muss. 28. April 2022 Podcast: „Wie kann ich was bewegen?“ – Folge 18: Mit Gianni Jovanovic Ich spreche mit Gianni Jovanovic, Dentalhygieniker, intersektionaler Aktivist und Comedian. Er ist der Sohn einer Roma-Familie mit einer von grausamen Diskriminierungs- und Rassismus-Erfahrungen geprägten Biographie. Von Zwangsheirat bis Abschiebung: Gianni hat bereits viele Leben hinter sich. Er gründete die Initiative “Queer Roma”, den Verein “Save Space” und engagiert sich bei der Initiative “Colors of Change” für… 10. Februar 2022 Podcast: „Die Jugend von heute“ – Folge 4: Mit Clara Mayer Wie ticken junge Menschen wirklich? Sind sie eher konsumfixiert oder nachhaltig? Sind sie als Digital Natives 2.0, mehr im Social Media Zuhause als im echten Leben? Und wo pendeln sie zwischen Sinnsuche & politischem Aktivismus? Im Podcast „Die Jugend von heute“ richte ich diese Fragen an jene, um die es dabei geht: die Jugend. In jeder Folge… 8. Februar 2022 Podcast: „Wie kann ich was bewegen?“ – Folge 17: Mit Waldemar Zeiler Ich treffe auf Waldemar Zeiler, Sachbuch-Autor, Speaker und Sinnbild des Sozialunternehmers. Er ist einer der Gründer des Unternehmens Einhorn, das nachhaltige Kondome und Periodenprodukte vertreibt. Als politischer Aktivist wollte er 2020 mit anderen das Olympiastadion anmieten, um dort über Petitionen für den Bundestag zu verhandeln. Gegen heftige Kritik und Widerstände schafften er und andere Aktivisten… 27. Januar 2022 Podcast: „Wie kann ich was bewegen?“ – Folge 16: Mit Nini Tsiklauri Ich spreche mit Nini Tsiklauri, Autorin, Schauspielerin, Sängerin, Politikwissenschaftlerin und Europa-Aktivistin. Nini ist in Ungarn, Georgien und Deutschland aufgewachsen, spricht fünf Sprachen und hat den Kaukasuskrieg hautnah miterlebt. In ihrem Buch “Lasst uns um Europa kämpfen – Mit Liebe und Mut für eine neue EU.” macht Nini klar, dass Europa für sie eine Herzensaufgabe ist.… 13. Januar 2022 Beschluss Bundesverfassungsgericht: Menschen mit Behinderungen dürfen bei einer Triage nicht benachteiligt werden Am 27.06.2020 reichten neun Menschen, unteranderem ich, Verfassungsbeschwerde beim Bundesverfassungsgericht in Karlsruhe ein. Im Falle von begrenzten Intensivbetten müssen Ärzt*innen schwerwiegende Entscheidungen treffen. Wer wird behandelt, wer nicht? Die Sorge, dass Menschen mit Behinderung auf Grund ihrer Behinderung diskriminiert werden ist groß. 7. Januar 2022 Podcast: „Wie kann ich was bewegen?“ – Folge 15: Mit Aljosha Muttardi Ich treffe in dieser Folge auf den Arzt, YouTuber und Aktivisten Aljosha Muttardi. Aljosha wurde mit dem YouTube Kanal “Vegan ist ungesund” medial bekannt und setzt sich mit viel Herzblut für LGBTQIA+ Rechte und das Tierwohl ein. Er arbeitete jahrelang als Anästhesist in einer Klinik, bis er seinen “normalen” Job für den Vollzeit-Aktivismus an den Nagel… 16. Dezember 2021 Podcast: „Wie kann ich was bewegen?“ – Folge 14: Mit Katja Diehl Ich treffe auf Katja Diehl, die für eine sozial- und geschlechtergerechte Verkehrswende kämpft. Die Kommunikationsberaterin findet, dass jede und jeder das Recht haben sollte, ein Leben ohne eigenes Auto zu führen. In ihrem Buch AUTOKORREKTUR entwickelt Katja eine Zukunft, die mehr Lebensqualität sowohl in Städten als auch auf dem Land bietet. 2. Dezember 2021 1 2 3 … 6 Nächste Seite→ [mc4wp_form id=“50673″]"
