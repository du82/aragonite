["http://raul.de/blog"]
title = "Blog - Raúl Krauthausen"
description = "Als Rollstuhlfahrer merke ich in meinem Alltag, wie weit wir in Deutschland von einer barrierefreien Gesellschaft entfernt sind. Daher engagiere ich mich für eine inklusive Gesellschaft."
full_description = "Blog Krautreporter-Kommentar: So blockieren Eltern und Lehrkräfte die Inklusion behinderter Kinder Sie warten darauf, dass jemand anderes das Problem löst. Dabei könnten sie jetzt schon helfen. 29. November 2024 Pop & Pasta mit Raúl Krauthausen und Saioa Alvarez Raúl Krauthausen ist Inklusions-Aktivist und Gründer der SOZIALHELD*INNEN. Als studierter Kommunikationswirt und Design Thinker arbeitet Raúl Krauthausen seit über 15 Jahren in der Internet- und Medienwelt: als Moderator, Speaker, Podcasthost und Autor. 2013 erhielt er das Bundesverdienstkreuz am Bande. Bei Pop & Pasta spricht er Politik, Medien, Kinderbücher und seine Ehe. 28. Oktober 2024 Bosetti Late Night: „Luke Mockridge – Darf er das?“ vom 29. September 2024 Witze über Menschen mit Behinderung: diskriminierend oder inklusiv? Wann wird Kritik zu Cancel Culture? In „Bosetti Late Night“ gehen Sarah Bosetti und ihre Gäste Janina Nagel, Raul Krauthausen und Okan Seese dem viel diskutierten Thema auf den Grund. 2. Oktober 2024 Krautreporter-Kommentar: Diese Umweltpolitik schadet Menschen mit Behinderung vom 11. September 2024 Die meisten sind sich einig, dass die Klimakrise bekämpft werden muss. Nur: Wenn dieser Kampf so weitergeht, wird die Klimakrise vor allem behinderte Leben fordern. 25. September 2024 Inklusion ist keine Frage des Geldes – Es geht um gleichwertige Teilhabe! Inklusion ist mehr als eine wirtschaftliche Notwendigkeit – sie ist ein grundlegendes Menschenrecht! In meiner Rede auf dem Vielfaltskongress der GRÜNEN habe ich klargemacht, dass behinderte Menschen nicht nur dann wertvoll sind, wenn sie dem Arbeitsmarkt dienen. Inklusion bedeutet gleichberechtigte Teilhabe für alle – unabhängig von Produktivität oder Leistungsfähigkeit. Doch warum sind wir in Deutschland… 22. September 2024 Podcast: „Im Aufzug“ Folge 55: Helena Steinhaus, ist Armut ein strukturelles Problem? Wenn es um Arbeitslosigkeit geht, fällt schnell auch das Stichwort Faulheit. Das Stigma um Armut ist riesig. Helena Steinhaus hat selbst mehrmals von Hartz IV gelebt. Sie weiß, dass solche Klischees einfach nicht die Realität widerspiegeln und wie problematisch dieses Bild in unserer Gesellschaft ist. Um besonders den Sanktionen des Jobcenters entgegenzuwirken, die oft angedroht… 20. Juni 2024 re:publica 2024: Wie sähe ein kultureller Wendepunkt für echte Inklusion aus? Es geht um weit mehr als barrierefreie Zugänge und normative Lösungen. Es geht um eine tiefgreifende kulturelle Veränderung, die Inklusion nicht als Herausforderung, sondern als Chance begreift. 6. Juni 2024 Podcast: „Im Aufzug“ Folge 54: Esra Karakaya, wie wird man sichtbar? Sie war wütend darüber, wie Frauen mit Kopftüchern in den Medien dargestellt werden – deswegen hat sie es selbst einfach anders gemacht. Esra Karakaya macht Communities sichtbar, die in unserer Medienwelt oft unterrepräsentiert werden. Sie erzählt mir, warum sich das für sie befreiend anfühlt und wieso ihre Wut auch wichtig findet. Esra hat ihre Zweifel… 6. Juni 2024 re:publica 2024: Raul Krauthausen und Georgine Kellermann – Der lange Weg zu mir selbst: Meine Befreiung als trans* Frau nach über 60 Jahren Im Gespräch mit Raul Krauthausen spricht Georgine Kellermann über ihr neues Buch, ihr Coming-out mit 62 Jahren, ihre Vorstellungen von einer diversen Gesellschaft und vom Glück, sie selbst sein zu dürfen. 28. Mai 2024 Podcast: „Im Aufzug“ Folge 53: Jürgen Dusel, warum passiert in Sachen Inklusion in Deutschland so wenig? Jürgen Dusel ist der Beauftragte der Bundesregierung für die Belange von Menschen mit Behinderungen. Eine Position, die vieles bewirken kann. Oder? Darüber will ich mit ihm sprechen: über seine Arbeit, das politische System und auch seine Grenzen. Ich will ihm auf den Zahn fühlen, wann sich denn endlich mal was ändert und was wir bisher… 23. Mai 2024 Podcast: „Wie kann ich was bewegen“ – Zusammen gegen Rechts?, Folge 39: In dieser packenden Episode mit Moderator Raul Krauthausen, spricht Danny von Campact über seine Arbeit bei „Zusammen gegen Rechts“. Wie ist die Initiative in wenigen Stunden als direkte Reaktion auf die Enthüllungen über rechtsextreme Netzwerke in Deutschland ins Leben gerufen worden? Erfahre, wie „Zusammen gegen Rechts“ mit Demonstrationen überall in Deutschland aktiv gegen die AfD… 15. Mai 2024 Podcast: „Im Aufzug“ Folge 52: Daniel Bröckerhoff, wie funktioniert Journalismus mit Haltung? In dieser Zeit voller Rechtspopulismus wollte ich von Daniel Bröckerhoff wissen, wie er über Wahlempfehlungen im Journalismus denkt. Wir sprechen darüber, ob alle Journalist*innen links sind und wie er überhaupt vom Fernsehgarten zum Journalismus kam. Daniel ist aber nicht nur Journalist, er ist vor allem auch Vater. Zwei seiner Töchter haben Behinderungen. In ihrem Familien-Alltag… 10. Mai 2024 Podcast: „Wie kann ich was bewegen“ – bei Campact?, Folge 38: In dieser Episode von „Wie kann ich was bewegen?“ erfährst du das wichtigste zur beeindruckenden Arbeit von Campact, der Organisation, die seit 20 Jahren progressive Kampagnen in Deutschland führt. Christoph Bautz, Mitbegründer von Campact, teilt exklusive Einblicke in die Mechanismen und Strategien hinter dieser einflussreichen Kampagnen-Organisation. 1. Mai 2024 Ulrich Hartmann zu Gast bei KRAUTHAUSEN – face to face Ulrich Hartmann ist Musiker, Moderator und Aktivist, der in Berlin lebt. Er studierte u. a. Musik an der Popakademie und ist bei der „Aktion Luftsprung“ tätig, einer Stiftung, die sich dem künstlerischen und beruflichen Einstieg chronisch erkrankter Menschen widmet. Als Profimusiker leitet er mit seinen Erfahrungen und seinem musikalischen Talent das Projekt Projekt „Luftsprung Live“,… 27. April 2024 Podcast: „Im Aufzug“ Folge 51: Gavric und Matthias Renger, was sind Shitmoves? Iris und Matthias sind ein Paar. Aber sie sind auch Geschäftspartner*innen: vom Podcast „Couple Of” bis hin zur eigenen Agentur. 25. April 2024 Podcast: „Wie kann ich was bewegen“ – bei der Tafel?, Folge 37: In dieser Episode von „Wie kann ich was bewegen?“ tauchen mit Sirkka Jendis, Geschäftsführerin von Tafel Deutschland e.V., tief in die Rolle der Tafeln in Deutschland ein. Wir diskutieren die Notwendigkeit der Tafeln als Reaktion auf Armut in einem der reichsten Länder der Welt und beleuchten, wie ehrenamtliche Arbeit nicht nur den Empfängerinnen, sondern auch… 16. April 2024 Podcast: „Im Aufzug“ Folge 50: Tobias Polsfuß, wie kann Wohnen inklusiver werden? Heute gehts ums Wohnen – ein Thema, das uns alle betrifft und beschäftigt. Tobias Polsfuß ist Mitgründer und Geschäftsführer von WOHN:SINN. Als Bündnis unterstützt und berät der Verein inklusive Wohnprojekte. Er selbst hat jahrelang während des Studiums in einer inklusiven WG gewohnt. Tobias erzählt mir von seinem Alltag dort und wie er schließlich zur Idee… 11. April 2024 Podcast: „Wie kann ich was bewegen“ – im Aktivismus?, Folge 36: Von Protestaktionen über das Schreiben von Kolumnen bis hin zu politischer Aktionskunst – Aktivismus kann sehr vielfältig aussehen. In dieser Folge zeigen wir dir, wie unterschiedlich die Arbeit verschiedener Aktivist:innen ist und wie auch du dich aktivistisch engagieren kannst. Aktivistinnen wie Luisa Neubauer, Margarete Stokowski und Cesy Leonard sprechen darüber, wie sie zum Aktivismus kamen,… 3. April 2024 Podcast: „Im Aufzug“ Folge 49: Mine, wie divers ist die deutsche Musikbranche? Wenn ich eins nicht erwartet hätte, dann, dass Mine mal Aufzugsmusik gemacht hat. Ihr Musikstil ist besonders und wird immer sehr abenteuerlich beschrieben. Ich wollte von ihr wissen, welche Musik sie in ihrer Jugend im Ländle geprägt hat und wie ehrlich sie in ihren Texten sein will. Wir sprechen über Helene Fischer, Mines aufwändige Musikvideos… 28. März 2024 Podcast: „Wie kann ich was bewegen“ – in einer Partei?, Folge 35: Engagiere dich und gestalte Politik aktiv mit! In dieser Episode beleuchten wir, wie du in einer Partei deinen Platz finden kannst. Emily Büning, Bundesgeschäftsführerin der Grünen, und Nela Riehl, Spitzenkandidatin von Volt für die Europawahl, teilen ihre persönlichen Erfahrungen. Sie betonen, wie erfüllend es ist, eine politische Heimat zu finden, und unterstreichen die Bedeutung von… 19. März 2024 Podcast: „Im Aufzug“-Spezial – Folge 48: Adina und Laura über unser neues Kinderbuch „Als Ela das All eroberte“ Wir haben ein Kinderbuch geschrieben! „Als Ela das All eroberte” ist zusammen mit Adina Hermann und Laura Rosendorfer entstanden und erzählt die Geschichte von Ela, die ins Weltall fliegen möchte. Wir finden, Kinderbücher wollen oft zu viel erklären und besonders Behinderung wird gerne übererklärt. Wir haben versucht, Elas Träume von einer Reise ins Weltall anders… 14. März 2024 Podcast: „Wie kann ich was bewegen“ – beim Deutschen Roten Kreuz?, Folge 34: In dieser Folge geht es Raul um das Deutsche Rote Kreuz und die Arbeit mit Geflüchteten. Dafür haben wir mit Bastian Schlinck, Fachreferent für die Bereiche Migration und Integration / Bürgerschaftliches Engagement beim Deutschen Roten Kreuz (DRK), gesprochen. Er verrät uns auch alles über die vielfältigen Möglichkeiten, sich beim DRK ehrenamtlich zu engagieren, insbesondere in… 6. März 2024 Podcast: „Im Aufzug“ – Folge 47: Thomas Laschyk, wie hilft Humor gegen Fake News? Gegen Fake News und Hetze aufklären: Das hat er sich mit dem Volksverpetzer zur Aufgabe gemacht. Thomas Laschyk und sein Team überschreiten damit häufig die Grenzen des klassischen Journalismus. Denn was manchmal fast unseriös wirkt, erreicht Menschen auf eine ganz andere Weise, indem es die Taktiken der Fake News gegen sie nutzt. 29. Februar 2024 Podcast: „Wie kann ich was bewegen“ – In der Kindernothilfe?, Folge 33: In dieser Episode tauchen wir tief in die Welt der Kindernothilfe ein, einer Organisation, die sich dem Kampf gegen Armut, Ausbeutung und Ungerechtigkeit verschrieben hat, die Kinder weltweit betreffen. Gemeinsam mit Iven Schwerdtfeger und Katrin Weidemann von der Kindernothilfe entdecken wir, wie sich jeder Einzelne einbringen und einen echten Unterschied im Leben von Kindern machen… 20. Februar 2024 Sema Gedik zu Gast bei KRAUTHAUSEN – face to face Zu Gast bei KRAUTHAUSEN – face to face: Sema Gedik, Modeschöpferin und Unternehmerin. Wir diskutieren über Semas Weg in die Modebranche, der durch die Erkenntnis geprägt wurde, dass es mehr Mode für Hunde als für kleinwüchsige oder behinderte Menschen gibt. Gedik, die Modedesign an der HTW Berlin und dem Amsterdam Fashion Institute studierte, hat sich… 18. Februar 2024 Podcast: „Im Aufzug“ – Folge 46: Enno Bunger, braucht es Schmerz für gute Songs? Ob Depressionen, Dad Jokes oder Udo Lindenberg: Diese Aufzugsfahrt mit Enno Bunger wird nicht langweilig. Wir sprechen über seinen Karrierestart im Supermarkt, dass er und H.P. Baxxter denselben Musiklehrer hatten und warum er eigentlich gegen seine Heimat Ostfriesland allergisch ist. Seine Lieder entstehen oft aus einem Schmerz heraus und so singt er darin auch von… 15. Februar 2024 Podcast: „Wie kann ich was bewegen“ – Amadeu-Antionio-Stiftung?, Folge 32: In dieser Folge zeigen Raul und Anna Weers von der Amadeu Antonio Stiftung wie du dich gegen Rechts engagieren kannst. Vor allem in ländlichen Regionen. Erfahre mehr über die mutigen Schritte, die wir gemeinsam unternehmen können, um gegen Rechtsextremismus vorzugehen und eine inklusive, gerechtere Welt zu schaffen. 15. Februar 2024 Podcast: „Im Aufzug“ – Folge 45: Katja Diehl, warum ist uns das Auto so heilig? Heute steigen wir tief in die fabelhafte Welt der Mobilität ein: von engen Aufzügen bis hin zu großen Autos. Ich kenne Katja Diehl schon lange und schätze ihre Arbeit zur Verkehrswende sehr. Besonders dankbar bin ich ihr dafür, dass sie Menschen mit Behinderung immer mitdenkt. Aber Autos zu kritisieren, ist keine einfache Arbeit. Doch wieso… 1. Februar 2024 Podcast: „Wie kann ich was bewegen“ – bei Amnesty?, Folge 31: Gemeinsam mit Lisa Nöth und anderen Aktivistinnen von Amnesty Deutschland stellen wir die verschiedenen Formen des Engagements im Kampf für Menschenrechte vor, um dir den Einstieg in den Aktivismus zu erleichtern. Schwerpunkt ist der Protest gegen Menschenrechtsverletzungen im Iran. Wie kann ich was bewegen? ist dein Weg in das politische Engagement mit Raul Krauthausen. 23. Januar 2024 Podcast: „Im Aufzug“ – Folge 44: Marlene Engelhorn, Was ist dein Gefühl? Über Geld zu sprechen, ist in unserer Gesellschaft noch immer ein Tabu. Aber heute tun wir genau das. Denn Marlene Engelhorn ist reich – schon bevor ihr mit Ende 20 mitgeteilt wurde, dass sie einige Millionen Euro erben wird. Aber genau das will sie ändern. Denn als Grund der extremen sozialen Ungerechtigkeit sieht sie auch… 18. Januar 2024 1 2 3 … 23 Nächste Seite→"
