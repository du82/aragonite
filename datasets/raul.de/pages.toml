title = "Raúl Krauthausen - Aktivist für Inklusion und Barrierefreiheit"
description = "Als Rollstuhlfahrer weiß ich, wie wichtig eine inklusive Gesellschaft ist. Hier blogge ich dazu und podcaste mit bekannten Künstler*innen & Aktivist*innen."
full_description = "Raúl Krauthausen Inklusionsaktivist und Medienmacher aus Berlin „Auch nicht-behinderte Menschen haben ein Recht darauf, mit behinderten Menschen zusammenzuleben“ Als Rollstuhlfahrer weiß ich, wie wichtig eine barrierefreie und inklusive Gesellschaft ist. Aus diesem Grund engagiere ich mich, u.a. bei den SOZIALHELD*INNEN täglich für diese Themen und poste in meinem Blog regelmäßig dazu oder podcaste mit deutschlands bekanntesten Künstler*innen und Aktivist*innen. Podcast Im Aufzug mit Raul Krauthausen und Gästen Alleine Aufzug fahren ist langweilig. Daher lade ich mir für meine Aufzugfahrt Gäste ein. U.a. mit Klaas Heufer-Umlauf, Kevin Kühnert oder Ariana Barborie philosophiere ich über Politik, Gesellschaft und Gott und die Welt. Mehr Bücher Kinderbuch, Sachbücher und Biografie In meinen Büchern beschäftige ich mich mit den Themen Inklusion und der Frage, wie eine zugänglichere Welt uns alle bereichert und warum wir uns manchmal trotzdem so schwer damit tun. Mehr Newsletter „Sent from my wheelchair“ Eine Übersicht, welche Links, Artikel und Beiträge ich zu den Themen Innovation, Inklusion und Barrierefreiheit interessant fand. Mehr Blog Krautreporter-Kommentar: So blockieren Eltern und Lehrkräfte die Inklusion behinderter Kinder 29. November 2024 Sie warten darauf, dass jemand anderes das Problem löst. Dabei könnten sie jetzt schon helfen. Weiterlesen Zum Blog Termine Keine Veranstaltungen Alle Termine Unterstütze meine Arbeit Damit ich mich weiterhin für das Thema Inklusion einsetzen, Medieninhalte produzieren und unserer geliebten Regierung auf der Nase rumtanzen kann, bin ich auf jeden Euro angewiesen. Ich bin der Überzeugung, dass meine Arbeit für jede*n frei zugänglich sein muss, weshalb ich keine Paywalls habe – deswegen unterstützt dein Beitrag nicht nur mich, sondern auch alle anderen, die sich für meine Inhalte interessieren. RAUL AGUAYO-KRAUTHAUSENIBAN: DE87 2004 1133 0198 5662 00BIC: COBADEHD001 paypal.me/raulde Unterstützen via Steady Unterstützen via PayPal.me"
year_published = 2024
year_updated = 2025
