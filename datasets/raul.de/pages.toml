title = "Kontakt - Raúl Krauthausen"
description = "Ein wichtiges Anliegen? Hier kann man mich kontaktieren."
full_description = "Kontakt Raúl Aguayo-Krauthausenc/o SOZIALHELDEN e.V.c/o Immobilien Scout GmbHInvalidenstr. 6510557 Berlin Vorab Mich erreichen sehr viele E-Mails und Anfragen, deren Beantwortung oft etwas dauert bzw. nicht immer möglich ist. Bevor eine Mail unbeantwortet bleibt, empfehle ich hier folgende Links und Verweise, die oft auch weiterhelfen können: Thema: “Bürokratie, Wohnen, Pflege, Assistenz und selbstbestimmtes Leben für Menschen mit Behinderung”:Eine prima Anlaufstelle hier sind die sogenannten Ergänzenden Unabhängigen Teilhabeberatungsstellen (EUTB) für Menschen mit Behinderung.Thema: “Bildung und Bildungspolitik für Menschen mit Behinderung”:Sehr gute Erfahrung mache ich in den Bereichen mit den Expert*innen von Mittendrin e.V. aus NRW, die aber auch in andere Bundesländer gut vernetzt sind.Thema: “Arbeitsmarkt und Ausbildung für Menschen mit Behinderung”:Meine Kolleg*innen von JOBinklusive.org kennen sich in den Bereichen bestens aus.Thema: “(Sozial-)Recht für Menschen mit Behinderung:Da ist die Kanzlei Menschen und Rechte rund um Oliver Tolmein meine erste Wahl.Thema: “Umfragen/Interviews von Studierenden für eine Universitätsleistung” z.B.: der Heilerziehungspflege o.ä.:Täglich erreichen mich Umfragen von nicht-behinderten Studierenden, die von mir alles mögliche über Behinderung, Pflege, Therapie usw. wissen wollen. Aber mich machen wissenschaftliche Umfragen müde. Wissenschaft ist keine Einbahnstraße und Expertenwissen nicht immer kostenlos. “Nichts über uns, ohne uns!” muss auch in der Wissenschaft gelten. Wir Menschen mit Behinderungen werden kaum an den Fragestellungen, an der Methodik als auch den Zielen von Forschung über uns beteiligt. Eher werden wir ausgeforscht und damit ausgenutzt. Es ehrt mich, dass meine Texte und Themen Bestandteil von Studiengängen wie der Heilerziehungspflege sind. Ich stehe der Bezeichnung aber kritisch gegenüber (So möchte ich zum Beispiel nicht geheilt werden, wie es der Begriff „Heilerziehungspflege“ aber suggeriert) und kann und möchte nicht weiter ohne Bezahlung meine Erfahrung und mein Wissen zur Verfügung stellen.Presseanfragen:Sie suchen zu einem bestimmten Thema behinderte Menschen als O-Ton oder Expert*in? Versuchen Sie unsere SOZIALHELD*INNEN-Expert*innen-Datenbank um weitere Stimmen behinderter Menschen zu Wort kommen zu lassen.Kooperationsanfragen:Sämtliche Kooperationsanfragen können gern in unteres Formular gestellt werden.Unternehmerische Beratung:Als Expert*innen in eigener Sache kann Sie unser SOZIALHELD*INNEN-Team aus Produktmanager*innen, Designer*innen, Journalist*innen, Entwickler*innen sowie weiterer Expertisen beratend unterstützen. Kontaktformular Name * Deine E-Mail Adresse * Worum geht es? * Dringlichkeit * Diese Nachricht ist nur zur InformationDiese Nachricht benötigt eine Antwort so schnell wie möglichDiese Nachricht benötigt eine Antwort innerhalb von 7 Tagen Nachricht * Damit dieses Formular funktioniert bitte JavaScript aktivieren. Hier kannst du mich finanziell unterstützen Via SteadyVia PayPal.me Inhaltlich Verantwortlicher gemäß § 55 Abs. 2 RStV:Raúl Aguayo-Krauthausen (Anschrift wie oben) Haftungshinweis: Trotz sorgfältiger inhaltlicher Kontrolle übernehme ich keine Haftung für die Inhalte externer Links. Für den Inhalt der verlinkten Seiten sind ausschließlich deren Betreiber verantwortlich."
