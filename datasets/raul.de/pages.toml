["https://raul.de/vortraege/republica-2024-wie-saehe-ein-kultureller-wendepunkt-fuer-echte-inklusion-aus"]
title = "re:publica 2024: Wie sähe ein kultureller Wendepunkt für echte Inklusion aus? - Raúl Krauthausen"
description = "Es geht um weit mehr als barrierefreie Zugänge und normative Lösungen. Es geht um eine tiefgreifende kulturelle Veränderung, die Inklusion nicht als Herausforderung, sondern als Chance begreift."
full_description = "re:publica 2024: Wie sähe ein kultureller Wendepunkt für echte Inklusion aus? Es geht um weit mehr als barrierefreie Zugänge und normative Lösungen. Es geht um eine tiefgreifende kulturelle Veränderung, die Inklusion nicht als Herausforderung, sondern als Chance begreift. Die Vorteile von Inklusion liegen auf der Hand und sind wissenschaftlich belegt: barrierefreie Maßnahmen bringen Nutzen für alle, die Auflösung paralleler Systeme spart Kosten und hebt die einzigartigen Kräfte hervor, die behinderte Menschen in die Gesellschaft und ihre Arbeit einbringen. Das Hauptproblem:Oftmals bemühen wir uns, griffige Argumente und Lösungen zu liefern, während unser Gegenüber (Entscheidungstragende, Meinungsmachende bei Social Media) sich bereits entschieden haben, und nicht hören zu wollen, was müde, mürbe und krank macht. Setze ich, setzen wir an der falschen Stelle an, indem wir versuchen, diese Menschen zu überzeugen? Ich stelle fest:Nur durch Veränderung unserer Kultur können wir Politik beeinflussen. Indem wir selbst behinderte Menschen in den Fokus gesellschaftlichen Lebens rücken (Kunst, Parties, Panels, Lösungsvorschläge des culture hack labs [reinforce narratives, narrative research reports etc.]), machen wir politische Veränderungen unverzichtbar."
author = "Raul Krauthausen"
year_published = 2024
