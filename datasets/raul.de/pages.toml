full_description = "Diese Beiträge wurden durch die zahlreichen Unterstützer*innen ermöglicht. Podcast: „Im Aufzug“ Folge 55: Helena Steinhaus, ist Armut ein strukturelles Problem? Wenn es um Arbeitslosigkeit geht, fällt schnell auch das Stichwort Faulheit. Das Stigma um Armut ist riesig. Helena Steinhaus hat selbst mehrmals von Hartz IV gelebt. Sie weiß, dass solche Klischees einfach nicht die Realität widerspiegeln und wie problematisch dieses Bild in unserer Gesellschaft ist. Um besonders den Sanktionen des Jobcenters entgegenzuwirken, die oft angedroht… 20. Juni 2024 Podcast: „Im Aufzug“ Folge 54: Esra Karakaya, wie wird man sichtbar? Sie war wütend darüber, wie Frauen mit Kopftüchern in den Medien dargestellt werden – deswegen hat sie es selbst einfach anders gemacht. Esra Karakaya macht Communities sichtbar, die in unserer Medienwelt oft unterrepräsentiert werden. Sie erzählt mir, warum sich das für sie befreiend anfühlt und wieso ihre Wut auch wichtig findet. Esra hat ihre Zweifel… 6. Juni 2024 Podcast: „Im Aufzug“ Folge 53: Jürgen Dusel, warum passiert in Sachen Inklusion in Deutschland so wenig? Jürgen Dusel ist der Beauftragte der Bundesregierung für die Belange von Menschen mit Behinderungen. Eine Position, die vieles bewirken kann. Oder? Darüber will ich mit ihm sprechen: über seine Arbeit, das politische System und auch seine Grenzen. Ich will ihm auf den Zahn fühlen, wann sich denn endlich mal was ändert und was wir bisher… 23. Mai 2024 Podcast: „Wie kann ich was bewegen“ – Zusammen gegen Rechts?, Folge 39: In dieser packenden Episode mit Moderator Raul Krauthausen, spricht Danny von Campact über seine Arbeit bei „Zusammen gegen Rechts“. Wie ist die Initiative in wenigen Stunden als direkte Reaktion auf die Enthüllungen über rechtsextreme Netzwerke in Deutschland ins Leben gerufen worden? Erfahre, wie „Zusammen gegen Rechts“ mit Demonstrationen überall in Deutschland aktiv gegen die AfD… 15. Mai 2024 Podcast: „Im Aufzug“ Folge 52: Daniel Bröckerhoff, wie funktioniert Journalismus mit Haltung? In dieser Zeit voller Rechtspopulismus wollte ich von Daniel Bröckerhoff wissen, wie er über Wahlempfehlungen im Journalismus denkt. Wir sprechen darüber, ob alle Journalist*innen links sind und wie er überhaupt vom Fernsehgarten zum Journalismus kam. Daniel ist aber nicht nur Journalist, er ist vor allem auch Vater. Zwei seiner Töchter haben Behinderungen. In ihrem Familien-Alltag… 10. Mai 2024 Podcast: „Wie kann ich was bewegen“ – bei Campact?, Folge 38: In dieser Episode von „Wie kann ich was bewegen?“ erfährst du das wichtigste zur beeindruckenden Arbeit von Campact, der Organisation, die seit 20 Jahren progressive Kampagnen in Deutschland führt. Christoph Bautz, Mitbegründer von Campact, teilt exklusive Einblicke in die Mechanismen und Strategien hinter dieser einflussreichen Kampagnen-Organisation. 1. Mai 2024 Ulrich Hartmann zu Gast bei KRAUTHAUSEN – face to face Ulrich Hartmann ist Musiker, Moderator und Aktivist, der in Berlin lebt. Er studierte u. a. Musik an der Popakademie und ist bei der „Aktion Luftsprung“ tätig, einer Stiftung, die sich dem künstlerischen und beruflichen Einstieg chronisch erkrankter Menschen widmet. Als Profimusiker leitet er mit seinen Erfahrungen und seinem musikalischen Talent das Projekt Projekt „Luftsprung Live“,… 27. April 2024 Podcast: „Im Aufzug“ Folge 51: Gavric und Matthias Renger, was sind Shitmoves? Iris und Matthias sind ein Paar. Aber sie sind auch Geschäftspartner*innen: vom Podcast „Couple Of” bis hin zur eigenen Agentur. 25. April 2024 Podcast: „Wie kann ich was bewegen“ – bei der Tafel?, Folge 37: In dieser Episode von „Wie kann ich was bewegen?“ tauchen mit Sirkka Jendis, Geschäftsführerin von Tafel Deutschland e.V., tief in die Rolle der Tafeln in Deutschland ein. Wir diskutieren die Notwendigkeit der Tafeln als Reaktion auf Armut in einem der reichsten Länder der Welt und beleuchten, wie ehrenamtliche Arbeit nicht nur den Empfängerinnen, sondern auch… 16. April 2024 Podcast: „Im Aufzug“ Folge 50: Tobias Polsfuß, wie kann Wohnen inklusiver werden? Heute gehts ums Wohnen – ein Thema, das uns alle betrifft und beschäftigt. Tobias Polsfuß ist Mitgründer und Geschäftsführer von WOHN:SINN. Als Bündnis unterstützt und berät der Verein inklusive Wohnprojekte. Er selbst hat jahrelang während des Studiums in einer inklusiven WG gewohnt. Tobias erzählt mir von seinem Alltag dort und wie er schließlich zur Idee… 11. April 2024 1 2 3 … 36 Nächste Seite→"
