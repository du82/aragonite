["https://raul.de/begeisterndes/der-grimme-online-award-2018"]
title = "Danke für den Grimme Online Award 2018! - Raúl Krauthausen"
description = "Früher dachte ich ganz naiv, es gäbe online im Großen und Ganzen nur News-Seiten, Blogs und Foren. Die Bandbreite der existierenden Online-Projekte ist mir eigentlich erst durch den Grimme Online Award bewusst geworden. Wie kreativ und vielfältig Online-Projekte mittlerweile sind, kann man jährlich an den großartigen Nominierungen und Preisträgern erkennen. Umso mehr war ich überrascht […]"
full_description = "Danke für den Grimme Online Award 2018! Die Gewinner des Grimme Online Awards 2018 Früher dachte ich ganz naiv, es gäbe online im Großen und Ganzen nur News-Seiten, Blogs und Foren. Die Bandbreite der existierenden Online-Projekte ist mir eigentlich erst durch den Grimme Online Award bewusst geworden. Wie kreativ und vielfältig Online-Projekte mittlerweile sind, kann man jährlich an den großartigen Nominierungen und Preisträgern erkennen. Umso mehr war ich überrascht und geehrt, dass ich für meine Projekte in ihrer Gesamtheit für die Kategorie Grimme Online Award Spezial nominiert wurde. Auf dem roten Teppich Der Abend der Preisverleihung war extrem spannend und inspirierend. Besonders freue ich mich über die doppelte Wertschätzung der Arbeit der Chemikerin und YouTuberin Mai Thi Nguyen-Kim, die nicht nur ein tolles Role Model ist, sondern mit Erfolg auch Laien wie mir zeigt, wie großartig Naturwissenschaften eigentlich sind. Zusammen mit der Journalistin und Designerin Melanie Gath stellt sich die Wissenschaftlerin auf ihrem YouTube-Kanal MaiLab Halbwissen jeder Art zu Themen wie Impfen, Tierversuche oder Genetik. Mai Thi Nguyen-Kim Ebenfalls großartige Preisträgerinnen sind die Macherinnen des empowernden und aufklärenden Instagram-Accounts Mädelsabende. Mädelsabende Meine Lieblingsprojekte unter den Nominierten, die keinen Preis erhielten, sind Deutschland3000 mit der großartigen Eva Schulz, der Halbe Katoffl Podcast und Digitalcourage e.V. Die Worte, die mich an diesem Abend am meisten berührten, kamen von der Kabarettistin und Schauspielerin Idil Baydar: “Wir sollten alle Gastarbeiter auf diesem Planeten sein.” Zum Ende des Abends war die Spannung groß und aufgrund der Tatsache, dass ein ganze Kategorie voller großartiger Nominierter schon leer ausging, gingen meine Vorstellung auf einen Preis gen Null – umso unfassbarer die Freude, dass ich tatsächlich einen der Grimme Online Awards aus der Kategorie Spezial gewonnen habe. Dankesrede beim Grimme Online Award 2018 Auf der Bühne bei der Preisverleihung war ich so überwältigt, dass ich mich jetzt einfach nochmal in Ruhe bei allen bedanken möchte, die den Award erst möglich machten und die bei der Ehrung durch den Preis mitgemeint sind: Suse Bauer für die großartige Redaktion hinter KRAUTHAUSEN – face to face, ZDF Blickwechsel, #re:spsonsive und diesem Blog. Tim Klimes von der Produktionsfirma AVE und Peter Pauli von der Produktionsfirma abm für das Realisieren der oben genannten Videoformate. Dem ZDF und der bpb für das in mich gesetzte Vertrauen. Dem KIMBUK-Team für die tolle Zusammenarbeit am ersten vielfältigen Kinderbuchfestival in Deutschland. Den SOZIALHELDEN und den Projekten Leidmedien.de und Wheelmap.org, mit denen alles begann. Und natürlich allen, die mir hier, online und via Steady ihr Vertrauen schenken. Die Begründung der Jury: Wenn eine Jury bei einem Online-Preis eine persönliche Leistung auszeichnet, so kann sie keine URL nennen, auf die sie sich alleine bei ihrer Entscheidung bezieht. Und das ist auch der Fall bei dem diesjährigen Preis in der Kategorie Spezial: Raul Krauthausen erhält den Grimme Online Award nicht für ein einzelnes Online-Angebot. Vielmehr würdigt die Jury sein unermüdliches Engagement als Inklusions-Aktivist, der Initiativen wie die „Sozialhelden“ oder Websites wie wheelmap.org auf den Weg gebracht hat und der auf Twitter und Facebook bemerkenswert sichtbar den Dialog zu Aspekten der Inklusion führt. Crossmedialität ist Raul Krauthausens erklärtes Prinzip – auch an der Schnittstelle zwischen Web und traditionellen Medien – und damit trägt er das Thema Behinderung an Personenkreise und Publika heran, die gewöhnlich nicht täglichen Kontakt damit haben. Das Netz ist fast schon sein natürlicher zweiter Lebens-, auf jeden Fall aber präferierter Kommunikationsraum geworden. Zusammen mit Partnern und Unterstützern trägt Raul Krauthausen seine Botschaft über das Netz in die Öffentlichkeit – und bietet Journalisten mit dem Angebot Leidmedien.de eine Hilfestellung, damit sie ihrerseits klischeebefreit über das Thema Behinderung schreiben können. Die Jury zeichnet Raul Krauthausen für sein anhaltendes und leidenschaftliches Wirken und den konsequenten Einsatz unterschiedlicher Medienangebote aus, weil er damit sein gesellschaftlich relevantes Thema in eine unübersehbare, vor allem digitale Präsenz geführt hat. Beschreibung: Das Internet, so scheint es, ist das Habitat des Aktivisten Raul Krauthausen: Er bloggt über Inklusion, ist auf Twitter im direkten Dialog, gibt auf Facebook Tipps und der von ihm gegründete Verein „Sozialhelden“ realisiert Webangebote zum Thema Behinderung. Oft trägt Krauthausen seine Themen mit Partnern an neue Personenkreise heran, so zum Beispiel bei der Facebook-Serie zur Bundestagswahl „re:sponsive“, im Projekt „Blickwechsel“ des ZDF oder in der Talkshow „KRAUTHAUSEN – face to face“. Moderator Daniel Bröckerhoff mit Preisträger Raul Krauthausen: persönliche Leistung in der Kategorie Spezial (sb) Weitere Beiträge entstanden durch die Unterstützung zahlreicher Supporter auf SteadyHQ.com. Hier kannst auch du mich bei meiner Arbeit unterstützen: Fotos: Grimme-Institut/Arkadiusz Goniwiecha"
author = "Raul Krauthausen"
year_published = 2018
