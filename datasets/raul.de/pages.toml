["https://raul.de/zur-person"]
title = "Raúl Krauthausen - Aktivist für Inklusion und Barrierefreiheit"
description = "Als Rollstuhlfahrer merke ich in meinem Alltag, wie weit wir in Deutschland von einer barrierefreien Gesellschaft entfernt sind. Daher engagiere ich mich für eine inklusive Gesellschaft."
full_description = "Raul Krauthausen „Auch nicht-behinderte Menschen haben ein Recht darauf, mit behinderten Menschen zusammenzuleben.“ Raúl Krauthausen Seit über 20 Jahren setze ich mich für die Belange behinderter Menschen ein. Als Inklusionsaktivist, Autor, Moderator und Speaker bin ich ständig im Einsatz. Auch in den Medien bin ich sehr aktiv und bringe die Themen von Menschen mit Behinderungen immer wieder in die öffentliche Diskussion. Mit Haltung, Humor und vielen Verbündeten treibe ich die Vision von sozialer Gerechtigkeit und Teilhabe unermüdlich voran. Zu meinen bekanntesten Projekten zählen u. a. die Wheelmap, eine weltweite digitale Landkarte barrierefreier Orte, die von User*innen laufend ergänzt wird, sowie Leidmedien.de, mein Online-Ratgeber zum Thema Sprache und Behinderung. Für meine Arbeit wurde ich mehrfach ausgezeichnet, u. a. mit dem World Summit Award der Vereinten Nationen (2012), dem Bundesverdienstkreuz am Bande (2013) sowie dem Grimme Online Award (2018). Ausführliche Infos über meinen Werdegang, Aktionen und Auszeichnungen findest du im Factsheet (Passwort hier erfragen). Inklusionsaktivist Zusammen mit den Sozialheld*innen und anderen Mitstreitenden gehe ich immer wieder dahin, wo es wehtut und organisiere politische Proteste und Aktionen on- und offline, wie z. B.: 2016: Protest-Kampagne #NichtMeinGesetz zusammen mit der Aktionsgruppe AbilityWatch e. V. gegen die umstrittene Reformierung des Bundesteilhabegesetzes. 2019: 200-köpfiger Protest gegen das von Gesundheitsminister Spahn vorgeschlagene Intensivpflege- und Rehabilitationsstärkungsgesetz. 2021: Beschwerde gegen die Triage-Regelung beim Bundesverfassungsgericht. Im Dezember desselben Jahres stimmte das BVG in Karlsruhe zu, dass Menschen mit Behinderungen im Falle einer Triage nicht benachteiligt werden dürfen. Autor Als Autor habe ich folgende Bücher veröffentlicht: Dachdecker wollte ich eh nicht werden: Das Leben aus der Rollstuhlperspektive, mit Marion Appelt. Rowohlt Verlag, Reinbek 2014. Wie kann ich was bewegen? Die Kraft des konstruktiven Aktivismus, mit Benjamin Schwarz. Edition Körber, Hamburg 2021. Wer Inklusion will, findet einen Weg. Wer sie nicht will, findet Ausreden. Rowohlt Verlag, Reinbek 2023. Als Ela das All eroberte, mit Adina Hermann. Carlsen Verlag, Hamburg 2024. Hier findest du mehr über meine Bücher und die Termine meiner Lesungen. Moderator & Speaker Mit KRAUTHAUSEN – face to face moderiere ich seit 2015 meine eigene Talksendung zu den Themen Kultur und Inklusion auf Sport1. In meinem Podcast „Im Aufzug“ spreche ich mit interessanten Menschen über Gott, die Welt und Themen der sozialen Gerechtigkeit. Auf verschiedenen Veranstaltungen und Plattformen referiere ich außerdem regelmäßig zu den Themen, die mich bewegen, und bin gerne als Gast auf Podien und in Diskussionskreisen dabei. Hier kannst du mich als Moderator/Speaker oder für eine Lesung buchen. Medienarbeit Meine Medienarbeit beinhaltet eigene Projekte und Produktionen in unterschiedlichen Formaten, ebenso wie Auftritte und Interviews in den verschiedensten Medien. Klick doch mal rein! Interviews Süddeutsche Zeitung Manager Magazin Utopia SRF Kultur monster.de WDR kugelzwei SWR Kultur Deutschlandfunk Merkur Videos re:publica 2024 DW Deutschland Jung & Naiv TEDx WDR Kölner Treff Hol dir meinen Newsletter 💌 In meiner Welt passiert sehr viel! Meine eigene Arbeit hält mich ständig auf Trab. Aber auch die Projekte anderer Aktivist*innen, Politiker*innen und Medienschaffender verfolge ich mit großem Interesse. Wenn du regelmäßige Updates aus der Welt der Inklusion in dein Postfach bekommen willst, abonniere doch meinen Newsletter sent from my wheelchair – 20.000 Menschen sind bereits dabei! Hier entlang Soziale Medien facebook (49k) Instagram (130k) LinkedIn (60k) TikTok (180k) threads (28k) YouTube (5k) Newsletter (20k) Unterstütze meine Arbeit Damit ich mich weiterhin für das Thema Inklusion einsetzen, Medieninhalte produzieren und unserer geliebten Regierung auf der Nase rumtanzen kann, bin ich auf jeden Euro angewiesen. Ich bin der Überzeugung, dass meine Arbeit für jede*n frei zugänglich sein muss, weshalb ich keine Paywalls habe – deswegen unterstützt dein Beitrag nicht nur mich, sondern auch alle anderen, die sich für meine Inhalte interessieren. RAUL AGUAYO-KRAUTHAUSENIBAN: DE87 2004 1133 0198 5662 00BIC: COBADEHD001 paypal.me/raulde Unterstützen via Steady Unterstützen via PayPal.me"
