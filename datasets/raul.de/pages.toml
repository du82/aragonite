e vertreibt. Als politischer Aktivist wollte er 2020 mit anderen das Olympiastadion anmieten, um dort über Petitionen für den Bundestag zu verhandeln. Gegen heftige Kritik und Widerstände schafften er und andere Aktivisten… 27. Januar 2022 Podcast: „Wie kann ich was bewegen?“ – Folge 16: Mit Nini Tsiklauri Ich spreche mit Nini Tsiklauri, Autorin, Schauspielerin, Sängerin, Politikwissenschaftlerin und Europa-Aktivistin. Nini ist in Ungarn, Georgien und Deutschland aufgewachsen, spricht fünf Sprachen und hat den Kaukasuskrieg hautnah miterlebt. In ihrem Buch “Lasst uns um Europa kämpfen – Mit Liebe und Mut für eine neue EU.” macht Nini klar, dass Europa für sie eine Herzensaufgabe ist.… 13. Januar 2022 Podcast: „Wie kann ich was bewegen?“ – Folge 15: Mit Aljosha Muttardi Ich treffe in dieser Folge auf den Arzt, YouTuber und Aktivisten Aljosha Muttardi. Aljosha wurde mit dem YouTube Kanal “Vegan ist ungesund” medial bekannt und setzt sich mit viel Herzblut für LGBTQIA+ Rechte und das Tierwohl ein. Er arbeitete jahrelang als Anästhesist in einer Klinik, bis er seinen “normalen” Job für den Vollzeit-Aktivismus an den Nagel… 16. Dezember 2021 Podcast: „Wie kann ich was bewegen?“ – Folge 14: Mit Katja Diehl Ich treffe auf Katja Diehl, die für eine sozial- und geschlechtergerechte Verkehrswende kämpft. Die Kommunikationsberaterin findet, dass jede und jeder das Recht haben sollte, ein Leben ohne eigenes Auto zu führen. In ihrem Buch AUTOKORREKTUR entwickelt Katja eine Zukunft, die mehr Lebensqualität sowohl in Städten als auch auf dem Land bietet. 2. Dezember 2021 Podcast: „Wie kann ich was bewegen?“ – Folge 13: Mit Benjamin Schwarz und Raul Krauthausen Wie kann ich was bewegen? Wie wird aus politischem Protest politisches Handeln? Wie kann ich als einzelner Mensch Einfluss nehmen? Kurz gesagt: Wie kann ich etwas bewegen? Darüber spricht der politische Aktivist und Gründer der Sozialheld*innen Raul Krauthausen im Podcast Wie kann ich was bewegen? mit Deutschlands bekanntesten Aktivistinnen und Aktivisten. Eigentlich war Wahlkampf mal so gedacht: als Wettkampf der… 4. November 2021 Podcast: „Wie kann ich was bewegen?“ – Folge 12: Mit Julian Zuber Wir sprechen darüber, ob Aktivismus konstruktiv sein muss, wie ernst die klimapolitische Lage ist und wieso akuter Handlungsbedarf für jede und jeden besteht. 27. Oktober 2021 Podcast: „Wie kann ich was bewegen?“ – Folge 11: Mit Dana Buchzik Ich spreche mit Dana Buchzik, Journalistin mit den Schwerpunkten Kultur, Kommunikation und Radikalisierung. Dana wuchs selbst in einer Sekte auf und weiß, wovon sie spricht: Sie gilt als DIE Expertin für Radikalisierung in privaten Umfeldern sowie Hass im Netz. 8. Oktober 2021 ←Vorherige Seite 1 2 3 4 Nächste Seite→ [mc4wp_form id=“50673″]"
