["https://raul.de/leben-mit-behinderung/ausgeforscht-und-ausgenutzt-ein-plaedoyer-fuer-einen-rollenwechsel-in-der-forschung-zu-behinderung"]
title = "Ausgeforscht und ausgenutzt? Ein Plädoyer für einen Rollenwechsel in der Forschung zu Behinderung. - Raúl Krauthausen"
description = "Was für Politik gilt, muss auch für Wissenschaft gelten: “Nichts über uns, ohne uns!” Menschen mit Behinderungen werden kaum an den Fragestellungen, an der Methodik als auch den Zielen von Forschung über sie beteiligt. Sie werden ausgeforscht und damit ausgenutzt. Die Deutungshoheit haben andere. Es ist höchste Zeit, dass sich das ändert!"
full_description = "Ausgeforscht und ausgenutzt? Ein Plädoyer für einen Rollenwechsel in der Forschung zu Behinderung. Was für Politik gilt, muss auch für Wissenschaft gelten: “Nichts über uns, ohne uns!” Menschen mit Behinderungen werden kaum an den Fragestellungen, an der Methodik als auch den Zielen von Forschung über sie beteiligt. Sie werden ausgeforscht und damit ausgenutzt. Die Deutungshoheit haben andere. Es ist höchste Zeit, dass sich das ändert! “Nothing about us without us!” (“Nichts über uns, ohne uns!”) Dieser Slogan etablierte sich in den 1990er Jahren in der internationalen Community der Behindertenrechtsaktivist*innen. Er fordert eine Politik, die grundsätzlich diejenigen in Entscheidungsfindungen und Erkenntnisprozesse mit einbezieht, die von diesen Erkenntnissen und Entscheidungen unmittelbar betroffen sind. Der Satz bezieht sich auf eine urdemokratische Rechtstradition, die Menschen Selbstbestimmungsrechte zuspricht, über ihre Leben zu verfügen und die Freiheit des Individuums auch in die Realität umzusetzen. In Deutschland sind diese Traditionen auf theoretischer Ebene bekannt und in lobenden Worten rund um das Grundgesetz immer wieder Thema. In der Praxis jedoch entscheiden vor allem gesetzgebende Männer über die Körper von Frauen, wenn es um Schwangerschaftsabbrüche und viele andere Themen von körperlicher Selbstbestimmung geht. Über die Sozialgesetze und die Regelsätze von Sozialleistungen entscheiden Menschen, die in aller Regel seit Jahrzehnten ein vielfaches Einkommen haben und sich mit Aussagen zitieren lassen, wie gut man doch von Hartz IV leben könne, wenn man nur mal weniger heizt. Bei Innenministerkonferenzen beraten 17 weiße Männer darüber, wie wenig Racial Profiling eigentlich existiere und weshalb es deshalb keine Studien über rechtsradikale Einstellungen in den Polizeien geben müsse. Sie haben Rassismus durch die Polizei ja nie am eigenen Leib erlebt, also kann es ihn in ihrer Logik nicht geben. Von den 16 Integrationsbeauftragten und Ausländerbeauftragten aller Bundesländer haben die wenigsten eine Migrationsgeschichte. Der Antisemitismusbeauftragte der Bundesregierung ist nicht jüdisch… und so weiter! Der Standard der Selbstbestimmung und Beteiligung ist noch nicht flächendeckend angekommen, um es vorsichtig zu formulieren. Die Schieflage der Interessenvertretung, bei der Angehörige der von Entscheidungen betroffenen Gruppen diese Entscheidungen gar nicht mitbestimmen können, findet sich auch in der Wissenschaft. Von den Anfängen der Ethnologie, die die legitimierenden Begleitnarrative für die Verbrechen des Kolonialismus durch rassistische Erzählungen über “die” Schwarzen Menschen mit letztlich pseudowissenschaftlichen Behauptungen erfand, über die medizinisch begründete Behauptung von Männern, Frauen seien nicht zu rationalen Überlegungen fähig bis hin zu heutigen Debatten um die Raubkunst im Humboldt Forum: Die Norm wird von der Macht gesetzt, diejenigen ohne Macht sind “die anderen” und sollen nicht auf Augenhöhe mitmachen können, geschweige denn wirksam sein. Diese Fehlentwicklung gibt es in der Wissenschaft auch im Bezug auf Menschen mit Behinderung. Der Debattenbeitrag von Lela Finkbeiner und mir hat kürzlich die Frage aufgeworfen, wie viele der unzähligen Anfragen zu Interviews für wissenschaftliche Arbeiten eigentlich auch etwas für Menschen mit Behinderung bringen. Wer forscht hier für wen und wem kommen die Ergebnisse zugute? Wir beschreiben, wie sie die vielen Anfragen oft nicht einmal mehr absagen können, weil die schiere Menge an Online-Umfragen, qualitativen Interviews und anderen Formen der Datenerhebung viel zu groß ist und immer weiter wächst. Dann sind die Fragen selten wirklich neu, sie objektifizieren die Befragten zudem häufig und auch die Ergebnisse, so man sie denn überhaupt einmal zu Gesicht bekommt, bringen selten Erkenntnisse, die die Situation von Menschen mit Behinderung voranbringen könnten. Oft kommen die Veröffentlichungen von Studienergebnissen über reine (theoretische) Handlungsempfehlungen nicht hinaus. Außerdem werden Menschen mit Behinderung nur sehr selten ins Forschungsdesign und die Entwicklung von Fragebögen in der Konzeptionsphase mit einbezogen. Den Erkenntnisgewinn definieren andere. Wie sinnvoll wären all diese Forschungsbudgets eingesetzt, wenn Forscher*innen mit Behinderung kritische Analysen, aktivistische Interpretationen und politische Forderungen aus den wissenschaftlichen Erkenntnis ableiten würden, weil sie von Beginn an an den Studien beteiligt sind? Was all diese Studien und Befragungen stattdessen voranbringen, sind die startenden Karrieren der Studierenden oder der etablierten Wissenschaftler*innen. Wenn das auch selten derart karrieristisch gemeint ist, das Problem liegt auch nicht auf individueller, sondern struktureller Ebene. Die Forschenden greifen auf die Expertise von Menschen mit Behinderung zurück, die selbst jedoch selten davon profitieren. Die Ergebnisse der Arbeit, die natürlich unbezahlt geleistet wird, kommen fast ausschließlich den nicht-behinderten Studierenden zugute. Und genau das muss sich ändern. Wissenschaftliche Fachbereiche wie die Disability Studies, Disability History oder Deaf Studies haben sich gegründet, um die vielfältigen Dimensionen der Themen rund um Behinderungen zu erforschen. Sie sind in den letzten Jahrzehnten gewachsen und haben erste Grundlagen geschaffen. Dass sie auch in Deutschland englische Begriffe für die Selbstbezeichnung nutzen, hat auch damit zu tun, dass das Bewusstsein für die gesamtgesellschaftliche Relevanz im deutschsprachigen Raum noch nicht allzu weit gediehen ist. Zudem sind es ja faktisch oft kleine Fachbereiche und somit automatisch Nischen, die dennoch sehr notwendige und wichtige Empowerment-Arbeit leisten. Es darf aber nicht nur Nischen geben, in denen Behinderungen erforscht werden, sondern die gesamte Wissenschaft muss allen Menschen offenstehen. Daher muss sie sich auch fragen lassen, ob sie denn den Menschen, von deren Perspektiven, Lebenserfahrung und Ideen sie gerade in den Sozial- und Humanwissenschaften auch lebt, wirklich zugänglich ist. Inwiefern kann die Betrachtung der Welt die Welt wirklich annähernd abbilden, wenn große Teile der Menschen selbst nur auf der Seite der Ausgeforschten stehen, auf der Seite der Begutachteten, Klassifizierten, Eingeordneten und Bewerteten? Wer vermeintlich “unentdecktes” Land ausmisst und in Karten einzeichnet, bringt meist auch eine Flagge mit, um das Land dann in Besitz zu nehmen. In der Regel ohne die Leute, die schon dort leben, zu fragen, ob das in Ordnung geht. Besonders die europäischen Staaten haben das die letzten 500 Jahre getan. Natürlich bestehen zwischen einer wissenschaftlichen Arbeit und einem Eroberungsfeldzug viele, gravierende Unterschiede. Es gibt jedoch auch Kontinuitäten bei der Dynamik zwischen vermeintlich “neutralen” Wissenschaftler*innen und den Feldern, die sie beforschen. Im Besonderen, wenn diese Felder von Menschen bewohnt werden. Objektive, “reine” Empirie, die einfach nur die Realität abbildet, gibt es nicht. Deshalb muss nicht gleich der Wahrheitsbegriff abgeschafft werden, aber zumindest die Menschen, deren Realität man erforschen möchte, müssen diese Forschung mitgestalten und vor allem von ihr profitieren können. Sonst läuft es unter dem Strich auf Ausbeutung aus, bei der die eine Seite ihre Ressourcen, ihr Wissen, ihre Expertise einbringt und die andere Seite davon zehrt und Lorbeeren einheimst. Abgesehen davon, dass sich beleidigende Fragen vermeiden ließen, wenn Betroffene stärker in die methodischen Fragen, die Konzeption und auch die Auswertung von Ergebnissen involviert wären, käme es auch der Forschung und dem Erkenntnisgewinn, ja der Wissenschaft insgesamt zugute, wenn Menschen mit Behinderung auch in der Forschung stärker vertreten wären! Nur sehr wenige Beispiele wirksamer Partizipation an und in der Forschung für Menschen mit Behinderungen gibt es bereits. Das Institut für angewandte Sozialwissenschaften (infas) bspw. führt im Auftrag des Bundesministeriums für Arbeit und Soziales (BMAS) seit 2018 eine große Repräsentativbefragung zur Teilhabe von Menschen mit Behinderung durch. Bei der Planung und Durchführung der Befragung werden Menschen mit Behinderungen in Beiräten, Dialogen und Veranstaltungen einbezogen. Darüber hinaus wird “ein inklusives Expertengremium eingesetzt, das die Erprobung der Erhebungsinstrumente und die Bewertung von Ergebnissen zusammen mit behinderten Menschen sicherstellt”. Im Lead sind Menschen mit Behinderung hier allerdings nicht. Und inwieweit die Ergebnisse die Situation von Menschen mit Behinderung verbessern, bleibt unklar. Ein sehr gutes Beispiel, wie sich die Forderung “Nichts über uns ohne uns” in empirischer Forschung umsetzen lässt, bietet der gerade durchgeführte #Afrozensus, bei dem unter Federführung Schwarzer Menschen und Selbstorganisationen zum ersten Mal in der Geschichte der Bundesrepublik die Situation Schwarzer Menschen in Deutschland ausführlich abgefragt wurde. Der Blickwinkel unterscheidet sich ums Ganze vom Gestus kolonialer Unterwerfung eben dadurch, dass die betreffenden Leute das gesamte Projekt selbst erdacht, konzipiert und organisiert haben sowie auswerten werden. Es bestand zudem von vornherein die Intention, auf Basis dieser sinnvoll erhobenen Daten die Situation Schwarzer Menschen verbessern zu können. Davon können wir alle etwas lernen. Sowohl die Methodik als auch die Ziele der Forschung von Menschen mit Behinderungen müssen diese selbst stärker beteiligen, in den Fokus rücken und auch die Deutungshoheit bestimmen lassen. Dann wäre der Existenzgrund eines grandiosen Vereins wie bspw. “bifos – Bildung und Forschungsinstitut zum selbstbestimmten Leben Behinderter” und deren Workshops obsolet. Die Welt verändert sich, das war schon immer so. In Bezug auf Fragen der Selbstbestimmung gibt es in den letzten Jahren Fortschritte, teilweise auch wirklich bahnbrechende Paradigmenwechsel. Es ist höchste Zeit, dass sich das auch in der Wissenschaft niederschlägt, deren Bedeutung wir nicht erst seit der jüngsten Pandemie fast alltäglich vor Augen geführt bekommen. Vielleicht bedarf es auch eines Verhaltenscodex oder eine Art Selbstverpflichtung für Forschungseinrichtungen und die dort beschäftigten Forscher*innen? Und wenn wir schon dabei sind, bauen wir gleich eine ganz neue Gesellschaft, in der gar niemand mehr über andere Menschen bestimmen kann, weil bei Entscheidungen wirklich alle, die es betrifft, einbezogen werden. Los geht’s. Dieser Text entstand in Zusammenarbeit mit David Häußer und Anne Lützelberger."
