title = "Bücher von Raúl Krauthausen"
description = 'Mein neues Buch: "Wer Inklusion will, findet einen Weg.Wer sie nicht will, findet Ausreden." Wie eine zugänglichere Welt uns alle bereichert.'
full_description = "Bücher Kinderbuch Als Ela das All eroberte Ela ist fasziniert von Planeten, Sternen und Raketen. Ihr Traum? Als Astronautin ins Weltall fliegen! Doch irgendwie glauben nicht alle daran, dass Ela das schaffen kann. Und zwar nur, weil sie mit Rollstuhl lebt.Zum Glück sind da aber auch Elas bester Freund Ben, der sie immer unterstützt, und Onkel Micha, der Ela ermutigt, weiter an ihre Wünsche und Ziele zu glauben. Ela lernt, dass sie ihre Träume auf die eine oder andere Art verwirklichen kann – und wird. Schließlich führen viele Wege zu den Sternen! Das erste Kinderbuch von SPIEGEL-Bestseller-Autor Raúl Krauthausen und Multitalent Adina Hermann Wundervolle, empowernde und Mut machende Geschichte für alle Kinder ab 5 Jahren Mit wissenschaftlich geprüften FAQs rund um das All und wertvollen Antworten auf Kinderfragenrund um die Hauptfigur Ela Vorwort von (F)Astronautin Insa Thiele-Eich Barrierefreie Typographie für inklusiven Lesespaß Website Jetzt bestellen Hörbuch Song von Sukini E-Book bestellen Song zum Buch Sukini feat. Fufu: Träume und Planeten Der Song zum Kinderbuch “Als Ela das All eroberte“ ist ein Weltraumsong mit galaktischem Beat über Liebe, Nähe und Abenteuer, über Ideen, die wie Raketen angezündet werden um die Dinge zu verändern, die verändert gehören. Spotify iTunes Youtube Music SPIEGEL Bestseller Wer Inklusion will, findet einen Weg. Wer sie nicht will, findet Ausreden. Wie eine zugänglichere Welt uns alle bereichert. Warum tun wir uns mit Inklusion so schwer? Was bedeutet Barrierefreiheit eigentlich wirklich? Und wie gehen wir mit unserem eigenen internalisierten und dem Ableismus anderer um? Ich bin ein aktiver Verfechter von Inklusion und Teilhabe von Menschen mit Behinderungen in allen Lebensbereichen und kämpfe gegen Diskriminierung und für Sichtbarkeit. Nach zwei Jahrzehnten Arbeit in diesem Bereich stelle ich nun erstmals meine Ansichten und Lösungsansätze in meinem neuen Buch „Wer Inklusion will, findet einen Weg. Wer sie nicht will, findet Ausreden.“ vor. Inklusion ist ein Menschenrecht, das leider oft vernachlässigt wird. Ich rufe dazu auf, Behinderung als eine Eigenschaft wie die Haarfarbe zu betrachten und fordere ein Umdenken. In meinem Buch habe ich auch Gespräche mit Expert*innen auf dem Gebiet der Inklusion aufgenommen und biete einen umfassenden Einblick in das Thema sowie Lösungsmöglichkeiten für bestehende Missstände. Jetzt bestellen Als Hörbuch bei Spotify Lesungen Sachbuch Wie kann ich was bewegen? Die Kraft des konstruktiven Aktivismus. Benjamin Schwarz und ich trafen für dieses Buch 16 der bekanntesten Aktivist*innen Deutschlands. In vielen Gesprächen erfuhren wir die persönlichen Hintergründe und Motive des jeweiligen aktivistischen Handelns sowie neue Gedanken zu den wichtigen politischen Fragestellungen unserer Zeit. Auf Basis dieser Gespräche entstand die Herleitung zum konstruktiven Aktivismus. Überall, wo es Bücher gibt. Website Jetzt bestellen Als Hörbuch bei Spotify Podcast zum Buch Als PDF in Einfacher Sprache Biographie Dachdecker wollte ich eh nicht werden Das Leben aus der Rollstuhlperspektive. Menschen tätscheln ihm den Kopf oder starren ihn an – Raul Krauthausen, im Rollstuhl sitzt und kleinwüchsig ist, weiß, dass viele Menschen Schwierigkeiten haben, mit Behinderten unverkrampft umzugehen. Dabei ist jeder zehnte Deutsche behindert, da sollten wir uns doch eigentlich an den Umgang mit jenen gewöhnt haben, die nicht «normal» sind. Doch das Gegenteil ist der Fall. Raúl Krauthausen sieht seine Behinderung als eine Eigenschaft von vielen. Er beschreibt mit Witz und Sachkenntnis, wie sein Alltag wirklich ist und wie ein Miteinander von Behinderten und Noch-nicht-Behinderten aussehen kann. Jetzt bestellen Audible Hörbuch Apple Books In Einfacher Sprache Für sehbehinderte Menschen Bei der Deutschen Blindenstudienanstalt e.V. (blista) gibt es das Buch auch als DAISY-Hörbuch (auch in einfacher Sprache) für blinde und sehbehinderte Menschen sowie bei den Norddeutschen Büchereien für blinde und sehbehinderte Menschen in Punktschrift."
