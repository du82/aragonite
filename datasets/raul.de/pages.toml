full_description = "Was ich mache Alle Bücher (4) Organisationen (2) Podcasts (5) Projekte (5) Video & TV (2) Kinderbuch Als Ela das All eroberte Ela ist fasziniert von Planeten, Sternen und Raketen. Ihr Traum? Als Astronautin ins Weltall fliegen! Doch irgendwie glauben nicht alle daran, dass Ela das schaffen kann. Und zwar nur, weil sie mit Rollstuhl lebt.Zum Glück sind da aber auch Elas bester Freund Ben, der sie immer unterstützt, und Onkel Micha, der Ela ermutigt, weiter an ihre Wünsche und Ziele zu glauben. Ela lernt, dass sie ihre Träume auf die eine oder andere Art verwirklichen kann – und wird. Schließlich führen viele Wege zu den Sternen! Das erste Kinderbuch von SPIEGEL-Bestseller-Autor Raúl Krauthausen und Multitalent Adina Hermann Wundervolle, empowernde und Mut machende Geschichte für alle Kinder ab 5 Jahren Mit wissenschaftlich geprüften FAQs rund um das All und wertvollen Antworten auf Kinderfragenrund um die Hauptfigur Ela Vorwort von (F)Astronautin Insa Thiele-Eich Barrierefreie Typographie für inklusiven Lesespaß Website Jetzt bestellen Hörbuch Song von Sukini E-Book bestellen Song zum Buch Sukini feat. Fufu: Träume und Planeten Der Song zum Kinderbuch “Als Ela das All eroberte“ ist ein Weltraumsong mit galaktischem Beat über Liebe, Nähe und Abenteuer, über Ideen, die wie Raketen angezündet werden um die Dinge zu verändern, die verändert gehören. Spotify iTunes Youtube Music SPIEGEL Bestseller Wer Inklusion will, findet einen Weg. Wer sie nicht will, findet Ausreden. Wie eine zugänglichere Welt uns alle bereichert. Warum tun wir uns mit Inklusion so schwer? Was bedeutet Barrierefreiheit eigentlich wirklich? Und wie gehen wir mit unserem eigenen internalisierten und dem Ableismus anderer um? Ich bin ein aktiver Verfechter von Inklusion und Teilhabe von Menschen mit Behinderungen in allen Lebensbereichen und kämpfe gegen Diskriminierung und für Sichtbarkeit. Nach zwei Jahrzehnten Arbeit in diesem Bereich stelle ich nun erstmals meine Ansichten und Lösungsansätze in meinem neuen Buch „Wer Inklusion will, findet einen Weg. Wer sie nicht will, findet Ausreden.“ vor. Inklusion ist ein Menschenrecht, das leider oft vernachlässigt wird. Ich rufe dazu auf, Behinderung als eine Eigenschaft wie die Haarfarbe zu betrachten und fordere ein Umdenken. In meinem Buch habe ich auch Gespräche mit Expert*innen auf dem Gebiet der Inklusion aufgenommen und biete einen umfassenden Einblick in das Thema sowie Lösungsmöglichkeiten für bestehende Missstände. Jetzt bestellen Als Hörbuch bei Spotify Lesungen Sachbuch Wie kann ich was bewegen? Die Kraft des konstruktiven Aktivismus. Benjamin Schwarz und ich trafen für dieses Buch 16 der bekanntesten Aktivist*innen Deutschlands. In vielen Gesprächen erfuhren wir die persönlichen Hintergründe und Motive des jeweiligen aktivistischen Handelns sowie neue Gedanken zu den wichtigen politischen Fragestellungen unserer Zeit. Auf Basis dieser Gespräche entstand die Herleitung zum konstruktiven Aktivismus. Überall, wo es Bücher gibt. Website Jetzt bestellen Als Hörbuch bei Spotify Podcast zum Buch Als PDF in Einfacher Sprache Biographie Dachdecker wollte ich eh nicht werden Das Leben aus der Rollstuhlperspektive. Menschen tätscheln ihm den Kopf oder starren ihn an – Raul Krauthausen, im Rollstuhl sitzt und kleinwüchsig ist, weiß, dass viele Menschen Schwierigkeiten haben, mit Behinderten unverkrampft umzugehen. Dabei ist jeder zehnte Deutsche behindert, da sollten wir uns doch eigentlich an den Umgang mit jenen gewöhnt haben, die nicht «normal» sind. Doch das Gegenteil ist der Fall. Raúl Krauthausen sieht seine Behinderung als eine Eigenschaft von vielen. Er beschreibt mit Witz und Sachkenntnis, wie sein Alltag wirklich ist und wie ein Miteinander von Behinderten und Noch-nicht-Behinderten aussehen kann. Jetzt bestellen Audible Hörbuch Apple Books In Einfacher Sprache Für sehbehinderte Menschen Bei der Deutschen Blindenstudienanstalt e.V. (blista) gibt es das Buch auch als DAISY-Hörbuch (auch in einfacher Sprache) für blinde und sehbehinderte Menschen sowie bei den Norddeutschen Büchereien für blinde und sehbehinderte Menschen in Punktschrift. Podcast Im Aufzug Alleine Aufzugfahren ist langweilig. Daher lade ich mir für meine Aufzugfahrten Gäste ein. Menschen, mit denen es garantiert nicht langweilig wird. Gäste, die mich und hoffentlich euch inspirieren. Die uns auf neue Gedanken bringen. Eines kann ich euch jetzt schon versprechen: Das werden die spannendsten und unterhaltsamsten Aufzugsfahrten eures Lebens. Website zum Podcast Apple Podcasts Spotify RSS Podcast Die Neue Norm Muss man drei “Behinderten” zuhören? Muss man nicht, man sollte. Judyta Smykowski, Jonas Karpa und Raúl Krauthausen brechen die Norm des Normalen auf und sprechen über Vielfalt, Inklusion und das Leben von Menschen mit Behinderung.Eben Die Neue Norm in Zusammenarbeit mit Bayern 2. Website zum Podcast Apple Podcasts Spotify RSS Podcasts, Video & TV Krauthausen – face to face Muss man drei “Behinderten” zuhören? Muss man nicht, man sollte. Judyta Smykowski, Jonas Karpa In “face to face”-Gesprächen tausche ich mich mit meinen Gästen über ihr künstlerisches Schaffen, persönliche Interessen und Lebenseinstellungen aus. Und natürlich geht es auch ab und zu um das Thema Inklusion. Website zur TV-Sendung Apple Podcasts Spotify RSS Podcast Wie kann ich was bewegen? Wie wird aus politischem Protest politisches Handeln? Wie kann ich als einzelner Mensch Einfluss nehmen? Kurz gesagt: Wie kann ich etwas bewegen?Darüber spricht der politische Aktivist Raul Krauthausen in diesem Podcast mit Deutschlands bekanntesten Aktivistinnen und Aktivisten. Website zum Podcast Apple Podcasts Spotify RSS Buch zum Podcasts Podcast Die Jugend von heute Wie ticken junge Menschen wirklich? Sind sie eher konsumfixiert oder nachhaltig? Sind sie als “Digital Natives 2.0”, mehr im Social Media Zuhause als im echten Leben? Und wo pendeln sie zwischen Sinnsuche & politischem Aktivismus? Im Podcast „Die Jugend von heute“ richte ich diese Fragen an jene, um die es dabei geht: die Jugend.In jeder Folge interviewe ich eine Person, welche die Generation Z alias Gen Z entweder persönlich vertritt oder sich intensiv mit ihr beschäftigt & auskennt. Zur Gen Z zählt dieser Podcast alle, die zwischen Ende der 1990er und bis Anfang der 2010er zur Welt gekommen sind. „Die Jugend von heute“ entstaubt altbekannte Blickwinkel auf Themen & Trends, die unsere Gesellschaft und den Zeitgeist prägen. Weil früher eben doch nicht alles besser war. Dieser Podcast wird produziert von Studio36. Zu den Folgen im Blog Apple Podcasts Projekt Quartiermeister*in In Kooperation mit der Biermarke Quartiermeister bin ich das Gesicht für deren Bio-Helles Quartiermeister ist die erste gemeinwohlbilanzierte Biermarke Deutschlands. Seit 2010 finanziert das Unternehmen aus Kreuzberg soziale Initiativen mit seinen Erlösen. Gemeinsam setzen wir eine Kampagne zur inklusiven Kiez- und Kneipenkultur um. Zur Website Projekt #AbleismusTötet #AbleismusTötet ist ein journalistisches Rechercheprojekt zu Gewalt an Menschen mit Behinderungen. Auf Initiative der Menschenrechts- und Behindertenorganisation AbilityWatch e.V. hat ein großes interdisziplinäres Team drei Säulen entwickelt, um diesem Thema öffentlichkeitswirksam, aber zugleich wissenschaftlich fundiert zu begegnen. Zur Website Projekt Die Kinder der Utopie Eine Kampagne für einen Kinofilm über Inklusion und Erwachsenwerden. Nur am 15. Mai 2019 bundesweit im Kino. Zur Website Projekt Kinderbuch-Festival KIMBUK Das vielfältige Kinderbuch-Festival KIMBUK für Macher*innen, Verlage und Nutzer*innen. Zur Website Video & TV re:sponsive Acht Wochen lang ist Raúl Krauthausen im Vorfeld der Bundestagswahl in Deutschland unterwegs. Um über eure Themen und eure Fragen zu reden. Zur Website Organisation AbilityWatch Als DPO (Disabled People’s Organisation) organisiert AbilityWatch Demonstrationen, betreibt Öffentlichkeitsarbeit und weist mit provokanten Aktionen auf die fehlende Gleichberechtigung und mangelnde Einhaltung der UN-Behindertenrechtskonvention hin. Zur Website Projekt Inklusionsfakten Sammlung von Argumenten für inklusive Bildung. Zur Website Organisation Sozialhelden*Innen Seit 2004 entwickeln die SOZIALHELDEN mit Leidenschaft und Spaß lösungsorientiere Projekte rund um die Themen Inklusion und Disability Mainstreaming. Zur Website"
