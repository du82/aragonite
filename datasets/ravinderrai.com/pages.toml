["https://ravinderrai.com/predicting-gaming-behavior-with-aws"]
title = "Predicting Gaming Behavior with AWS - Ravi Rai: Data Scientist"
description = "In this post we will go over the basics of training a model with AWS. This is the fundamentals of and end-to-end project, where we will take data from an S3"
full_description = '''Machine Learning | AWS | Python Predicting Gaming Behavior with AWS ByRavi August 10, 2024August 10, 2024 In this post we will go over the basics of training a model with AWS. This is the fundamentals of and end-to-end project, where we will take data from an S3 bucket, clean it with AWS Glue, then run a small training pipeline to train a model on our dataset. The problem here is predicting engagement levels of gamers, for which we can find the data thanks to Kaggle: Game Behavior Dataset. This post comes from a notebook, and in the repository there is another notebook where we did all the data exploration steps, which you can find here: https://github.com/RavinderRai/gaming-behavior-predictor. That being said, the data here is of high quality, so not too much typical data science work is to be done. Rather the focus is on running through the full data science life cycle using AWS. But you can of course use this tutorial as a template for a more complex dataset/problem. Getting Started First, let’s brush over the basics of getting started with AWS: Naturally, you’ll first need to install the AWS CLI. Then you will need to create an IAM role within your account. Once you do, find it in the Users tab and click on it Go to security credentials and create an Access key. You will get both an access key and secret access key. Save them. Then in a command prompt (I used Anaconda Prompt), type in aws configure. It will ask you for these keys. It will also ask for some default values afterward, just hit enter to leave these blank. See the below note for an alternative to this. Next, go to the permissions section and give it Sagemaker and Glue access. Alternatively, if you are just practicing then you can just give yourself Adminstrator access for simplicity. After that, log out, and sign back in with your IAM role. Now you will need your Amazon Resource Name (ARN) for Sagemaker and Glue. To get those: Find the IAM service in you AWS account, and click on it. You can search for it in the search bar on the top left if needed. Once you’re there, click on Roles under Access Management on the side bar. Then you can search for roles, which in this case you will need the AWSGlueServiceRole and the AmazonSageMaker-ExecutionRole, so type those in. Finally, get their respective ARNs and save them in a .env file in your root directory. The last thing to do is create a bucket in S3, create a folder in it called raw_data, and store the Kaggle dataset there. You can download it locally first here: Game Behavior Dataset. You will need the bucket name of your S3 bucket too, which you can put in your .env file as well, or just define the variable here. Note: you can also input your access keys here when connecting to AWS services. See below for an example. """ from dotenv import load_dotenv import boto3 load_dotenv('.env') aws_access_key = os.environ["AWS_ACCESS_KEY"] aws_secret_access_key = os.environ["AWS_SECRET_ACCESS_KEY"] s3 = boto3.client( 's3', aws_access_key_id=aws_access_key, aws_secret_access_key=aws_secret_access_key, ) """ Now let’s load in the necessary imports and environment variables. You should also load the AWS keys here if you are going that route. %load_ext dotenv %dotenv import os import sys import boto3 from pathlib import Path # Change to root directory os.chdir('..') # Create a folder for all our code SRC_PATH = Path("src") sys.path.extend([f"./{SRC_PATH}"]) # And we'll need our role's glue_role = os.getenv('GLUE_ROLE') sagemaker_role = os.getenv('SAGEMAKER_ROLE') bucket = os.getenv('BUCKET') Glue Here we are going to load in our raw data, clean it, and then save that new cleaned version in S3 again. This way we don’t overwrite our original data. To make the scripts, we will actually write the files here and then create .py files out of them in a specified directory. This is the point in the SRC_PATH, as that will contain all of our relevant scripts to deploy to AWS. (SRC_PATH / "etl").mkdir(parents=True, exist_ok=True) sys.path.extend([f"./{SRC_PATH}/etl"]) %%writefile {SRC_PATH}/etl/script.py import sys from awsglue.transforms import * from awsglue.utils import getResolvedOptions from pyspark.context import SparkContext from awsglue.context import GlueContext from awsglue.job import Job import pandas as pd from io import StringIO import boto3 args = getResolvedOptions(sys.argv, ['JOB_NAME', 'INPUT_BUCKET', 'INPUT_KEY', 'OUTPUT_BUCKET', 'OUTPUT_KEY']) sc = SparkContext() glueContext = GlueContext(sc) spark = glueContext.spark_session job = Job(glueContext) job.init(args['JOB_NAME'], args) # Read data from S3 s3_client = boto3.client('s3') obj = s3_client.get_object(Bucket=args['INPUT_BUCKET'], Key=args['INPUT_KEY']) df = pd.read_csv(StringIO(obj['Body'].read().decode('utf-8'))) #target label encoding df['EngagementLevel'] = df['EngagementLevel'].map({'Low': 0, 'Medium': 1, 'High': 2}) # Perform transformations to independent variables df['Gender'] = df['Gender'].map({'Male': 1, 'Female': 0}) df['GameDifficulty'] = df['GameDifficulty'].map({'Easy': 0, 'Medium': 1, 'Hard': 2}) df_encoded = pd.get_dummies(df, columns=['Location', 'GameGenre'], drop_first=True) encoded_cols = list(set(df_encoded.columns) - set(df.columns)) df_encoded[encoded_cols] = df_encoded[encoded_cols].astype(int) # Convert the DataFrame back to CSV csv_buffer = StringIO() df_encoded.to_csv(csv_buffer, index=False) # Upload the transformed data to S3 s3_client.put_object(Bucket=args['OUTPUT_BUCKET'], Key=args['OUTPUT_KEY'], Body=csv_buffer.getvalue()) job.commit() The following code is standard code to run the above script in Glue. The main things you’ll need are your bucket name, paths to where the raw data is stored and where to store the transformed data. You can modify these as you like. file_path = f"{(SRC_PATH / 'etl' / 'script.py').as_posix()}" s3_client = boto3.client('s3') bucket_name = 'gaming-behavior' script_file_name = 'script.py' s3_key = f'glue-scripts/{script_file_name}' # Upload the script to S3 s3_client.upload_file(file_path, bucket_name, s3_key) #print(f'Script uploaded to s3://{bucket_name}/{s3_key}') glue_client = boto3.client('glue') # Parameters for the Glue job job_name = 'etl-job' script_location = f's3://{bucket_name}/{s3_key}' # S3 locations for input and output data input_bucket = 'gaming-behavior' input_key = 'raw_data/online_gaming_behavior_dataset.csv' output_bucket = 'gaming-behavior' output_key = 'transformed_data/transformed_online_gaming_behavior_dataset.csv' # Create or update the Glue job response = glue_client.create_job( Name=job_name, Role=glue_role, Command={ 'Name': 'glueetl', 'ScriptLocation': script_location, 'PythonVersion': '3' }, DefaultArguments={ '--job-language': 'python', '--enable-continuous-cloudwatch-log': 'true', '--enable-spark-ui': 'true', '--INPUT_BUCKET': input_bucket, '--INPUT_KEY': input_key, '--OUTPUT_BUCKET': output_bucket, '--OUTPUT_KEY': output_key }, MaxRetries=0, MaxCapacity=2.0, Timeout=2880, GlueVersion='2.0' ) print(f'Glue job {job_name} created successfully') Here we actually run the Glue job, which will process the data as we instructed in our script and sstore the transformed data into the same S3 bucket. You double-check to see if it worked on your AWS account. start_response = glue_client.start_job_run(JobName=job_name) print(f'Glue job {job_name} started successfully with run ID: {start_response["JobRunId"]}') Sagemaker Here we will start the training pipeline in Sagemaker. If you’re not familiar, a pipeline is just a sequence of steps that we run through in order. Sagemaker can put them together nicely, and doing it this way helps with reproducibility and scalability. Pre-processing Now we will preprocess the data in Sagemaker and start a small pipeline (it will just be the preprocessing and training steps for now). In our case here, the data was already of high quality, so most cleaning steps were done in the glue job. It might seem redundant here to have a Glue job and pre-processing job, but typically the preprocessing step involves data transformation and feature engineering, specifically in preparation for a model, so it’s good practice to separate these things. import sagemaker from sagemaker.workflow.parameters import ParameterString from sagemaker.workflow.pipeline_definition_config import PipelineDefinitionConfig from sagemaker.workflow.pipeline_context import PipelineSession from sagemaker.workflow.steps import CacheConfig from sagemaker.sklearn.processing import SKLearnProcessor from sagemaker.processing import ProcessingInput, ProcessingOutput from sagemaker.workflow.steps import ProcessingStep from sagemaker.workflow.pipeline import Pipeline # don't redo steps if already done from previous failed jobs cache_config = CacheConfig(enable_caching=True, expire_after="15d") S3_LOCATION = f"s3://{bucket}" sm_boto3 = boto3.client("sagemaker") pipeline_session = PipelineSession(default_bucket=bucket) sagemaker_session = sagemaker.session.Session() region = sagemaker_session.boto_session.region_name We are keeping all scripts in the same folder, so make sure that folder has subfolders for each job. If it does, then ignore it. (SRC_PATH / "preprocessing").mkdir(parents=True, exist_ok=True) sys.path.extend([f"./{SRC_PATH}/preprocessing"]) %%writefile {SRC_PATH}/preprocessing/script.py from pathlib import Path import numpy as np import pandas as pd from sklearn.model_selection import train_test_split def preprocess(base_directory): """Load the supplied data, split it and transform it.""" df = _read_data_from_input_csv_files(base_directory) # the only transformation we need to do is drop the player id and split the data # everything else was done in the etl script df = df.drop(columns=['PlayerID']) df_train, df_test = train_test_split(df, test_size=0.2) y_train = df_train.EngagementLevel y_test = df_test.EngagementLevel X_train = df_train.drop("EngagementLevel", axis=1) X_test = df_test.drop("EngagementLevel", axis=1) _save_splits(base_directory, X_train, y_train, X_test, y_test) def _read_data_from_input_csv_files(base_directory): """Read the data from the input CSV files. This function reads every CSV file available and concatenates them into a single dataframe. """ input_directory = Path(base_directory) / "input" files = list(input_directory.glob("*.csv")) if len(files) == 0: message = f"The are no CSV files in {input_directory.as_posix()}/" raise ValueError(message) raw_data = [pd.read_csv(file) for file in files] df = pd.concat(raw_data) # Shuffle the data return df.sample(frac=1, random_state=42) def _save_splits(base_directory, X_train, y_train, X_test, y_test): """Save data splits to disk. This function combines the transformed features and the target variable, and saves them separately as training and testing sets. """ train = pd.concat([X_train, y_train], axis=1) test = pd.concat([X_test, y_test], axis=1) train_path = Path(base_directory) / "train" test_path = Path(base_directory) / "test" train_path.mkdir(parents=True, exist_ok=True) test_path.mkdir(parents=True, exist_ok=True) pd.DataFrame(train).to_csv(train_path / "train.csv", header=True, index=False) pd.DataFrame(test).to_csv(test_path / "test.csv", header=True, index=False) if __name__ == "__main__": preprocess(base_directory="/opt/ml/processing") The next blocks of code are defining our jobs. For the instance type, you can use ml.t3.medium, or you can use other’s like ml.m5.xlarge. You can’t use ml.m5.xlarge by default though – you’ll have to request a limit increase, but it is noticeably faster than the former. pipeline_definition_config = PipelineDefinitionConfig(use_custom_job_prefix=True) dataset_location = ParameterString( name="dataset_location", default_value=f"{S3_LOCATION}/transformed_data", ) processor = SKLearnProcessor( base_job_name="preprocess-data", framework_version="1.2-1", instance_type="ml.t3.medium", instance_count=1, role=sagemaker_role, sagemaker_session=pipeline_session, ) Here we define the processing step. You can change the name, but the important part here is the outputs. Decide on a file path and add more/less for you task. You can also modify the input if needed too. preprocessing_step = ProcessingStep( name="preprocess-data", step_args=processor.run( code=f"{(SRC_PATH / 'preprocessing' / 'script.py').as_posix()}", inputs=[ ProcessingInput( source=dataset_location, destination="/opt/ml/processing/input", ), ], outputs=[ ProcessingOutput( output_name="train", source="/opt/ml/processing/train", destination=f"{S3_LOCATION}/preprocessing/train", ), ProcessingOutput( output_name="test", source="/opt/ml/processing/test", destination=f"{S3_LOCATION}/preprocessing/test", ) ], ), cache_config=cache_config ) # now create the pipeline using the processing step above preprocessing_pipeline = Pipeline( name="preprocessing-pipeline-pipeline", parameters=[dataset_location], steps=[ preprocessing_step, ], pipeline_definition_config=pipeline_definition_config, sagemaker_session=pipeline_session, ) # this will push the pipeline to AWS preprocessing_pipeline.upsert(role_arn=sagemaker_role) This next line will start or execute the pipeline in Sagemaker. If you run it, go to you sagemaker account and click on the pipelines section. You should see it there. It will be a certain color depending on it’s stage. In this case, it should run in just a few minutes. preprocessing_pipeline.start() You should see this: Modeling Now for modeling we do the same thing as before: create a folder in SRC for the training script, and then define the pipeline. Note in the training script, you’ll see things like os.environ[“SM_MODEL_DIR”], os.environ[“SM_CHANNEL_TRAIN”], and os.environ[“SM_CHANNEL_TEST”]. These are file paths that are standard to Sagemaker, so leave these as it. (SRC_PATH / "modeling").mkdir(parents=True, exist_ok=True) sys.path.extend([f"./{SRC_PATH}/modeling"]) %%writefile {SRC_PATH}/modeling/script.py import argparse import os import json import pandas as pd import xgboost as xgb from sklearn.metrics import accuracy_score, cohen_kappa_score from pathlib import Path import joblib import tarfile def train(model_directory, train_path, test_path, learning_rate=0.1, max_depth=7,): """This function trains an XGBoost model and saves it in the S3 bucket.""" # get the training set, get the final column (target) # and then drop it to get the X_train set X_train = pd.read_csv(Path(train_path) / "train.csv") y_train = X_train[X_train.columns[-1]] X_train = X_train.drop(X_train.columns[-1], axis=1) # repeat for testing set X_test = pd.read_csv(Path(test_path) / "test.csv") y_test = X_test[X_test.columns[-1]] X_test = X_test.drop(X_test.columns[-1], axis=1) model = xgb.XGBClassifier(objective='multi:softmax', num_class=3, eval_metric='mlogloss', learning_rate=learning_rate, max_depth=max_depth) model.fit(X_train, y_train) y_pred = model.predict(X_test) accuracy = accuracy_score(y_test, y_pred) kappa = cohen_kappa_score(y_test, y_pred) # Just printing these for now, but ideally you would log these with somet'''
