full_description = "Introduction Heads up... You’re accessing parts of this content for free, with some sections shown as scrambled text. Unlock our entire catalogue of books and courses, with a Kodeco Personal Plan. Unlock now Heads up... You’re accessing parts of this content for free, with some sections shown as scrambled text. Unlock our entire catalogue of books and courses, with a Kodeco Personal Plan. Unlock now A beautiful UI is essential for every app. It doesn’t just look nice; it also makes your app more fun to use. In the previous lesson, you learned how to make a basic yet interactive UI in Jetpack Compose. You were introduced to composable function parameters, which let you modify or affect your composables in some way. Now, you’ll learn how to make your composables look as beautiful as they are in your ideal design. What happens when you want to modify your composables further, but the composable function doesn’t have that feature you want? For example, say you want to make the Text clickable or set the height of the Column. The Text composable doesn’t have an onClick parameter, and the Column doesn’t have a height parameter. What do you do in those scenarios? Well, the amazing folks behind Jetpack Compose provided modifiers to help with that. :] In this lesson, you’ll style Kodeco Chat using modifiers. You’ll: Learn how to style your composables using modifiers. Understand the purpose of modifiers in Jetpack Compose. Demonstrate how to use a modifier to add padding. Identify the purpose of dp and sp units. It’s time to get started!"
