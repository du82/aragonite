full_description = '''<span class="banner container-1584 mt-16"> <span>Kodeco requires JavaScript. Please enable JavaScript to enjoy the best experience.</span> </span> Home ... Artificial Intelligence APIs with Python Python for AI Python for AI: A Crash Course Module 1 of 1 in Python for AI Python for AI: A Crash Course Nov 16 2024, Python 3.12, JupyterLab 4.2.4 Leave a rating/review Sign up/Sign in With a free Kodeco account you can download source code, track your progress, bookmark, personalise your learner profile and more! Create account Already a member of Kodeco? Sign in This module covers the fundamentals of Python programming with a focus on AI apps. Students will learn Python syntax, environment management, working with external libraries, handling data formats, and basic file operations. The course emphasizes hands-on practice using Jupyter notebooks. By Joey deVilla. Start learning for free EXPERIENCE Beginner level EST TIME TO COMPLETE 3 hrs, 37 mins CONTENT 5 lessons Home ... Artificial Intelligence APIs with Python Python for AI Python for AI: A Crash Course Share Share this Twitter Share Facebook Share Email Share Save for later Sign up/Sign in With a free Kodeco account you can download source code, track your progress, bookmark, personalise your learner profile and more! Create account Already a member of Kodeco? Sign in Share Share this Twitter Share Facebook Share Email Share Save for later Sign up/Sign in With a free Kodeco account you can download source code, track your progress, bookmark, personalise your learner profile and more! Create account Already a member of Kodeco? Sign in Module outcomes Understand and apply Python syntax through practical examples such as performing network requests, manipulating JSON data and process files. Set up and use Jupyter notebooks for Python development. Effectively manage Python environments and integrate third-party libraries. Covered concepts Python language Jupyter Notebooks Package management File operations Libraries Data Manipulation Module content 1 Introduction to Python & Jupyter Notebooks Lesson (1 hr, 1 min) This will be an introduction to the Python programming language and Jupyter Notebooks, the “computational notebook” environment that you’ll use throughout this course. You’ll set up a Python programming environment, learn the basics of Jupyter Notebook and Python, and then apply those basics to build ELIZA, the original AI chatbot from the 1960s! Start Introduction • Start Reading · 1 min Intro to Python & JupyterLab Reading · 6 mins JupyterLab Demo Video · 9 mins Instruction Reading · 35 mins ELIZA Demo Video · 9 mins Conclusion Reading · 1 min Quiz: Introduction to Python & JupyterLab 6 questions 2 Python Syntax & Best Practices Lesson (56 mins) In the Python programming world, there is the concept of code being “Pythonic,” which means that it follows the conventions that the Python programming community has adopted. This lesson will cover advanced features of the Python programming language, as well as tried-and-true ways of writing Python that will make your code easier to understand and maintain — not just for yourself, but for everyone else. Start Introduction • Start Reading · 1 min Sets Reading · 6 mins Comprehensions Reading · 13 mins Functions: Deep Dive Reading · 8 mins Classes & Objects Reading · 15 mins Writing Python Code Demo Video · 13 mins Python Syntax & Best Practices - Conclusion Reading · 2 mins Quiz: Python Syntax & Best Practices 6 questions 3 Working with Python Libraries & Package Management Lesson (28 mins) One of the factors behind Python’s popularity is the large collection of libraries that its community has written over the decades. This lesson will explain what Python’s libraries are, how they work, and how to find libraries using PyPI, the Python package index. You’ll learn how to install Python libraries and create virtual environments to manage dependencies and ensure that your projects remain isolated from one another, avoiding conflicts between packages required by different projects. Start Introduction • Start Reading · 1 min Python Libraries Reading · 11 mins Python Libraries Demo Video · 7 mins Virtual Environments Reading · 4 mins Virtual Environment Demo Video · 4 mins Conclusion Reading · 1 min Quiz: Working with Python Libraries & Package Management 12 questions 4 Working with Local Data (File Operations & Data Handling) Lesson (39 mins) AI applications are data-driven. This lesson will cover the first of two ways for your AI application to get data: from your local file system. It will focus on reading and writing data from your file system in two popular formats: CSV (comma-separated values) and JSON (JavaScript Object Notation). Start Introduction • Start Reading · 1 min File Handling Reading · 11 mins File Handling Demo Video · 7 mins CVS Files Reading · 6 mins CSV Files Demo Video · 3 mins JSON Files Reading · 7 mins JSON Files Demo Video · 3 mins Conclusion Reading · 1 min Quiz: Working with Local Data 6 questions 5 Working with Online Data & APIs Lesson (33 mins) Chances are that most of the data your AI applications will need aren’t in your local files, but available online through APIs (application programming interfaces). This lesson will cover what APIs are, how to communicate with them using HTTP methods and SDKs, and how your applications can use the information gathered from APIs. Start Introduction • Start Reading · 1 min Getting Online Data Reading · 18 mins Getting Online Data Demo Video · 13 mins Conclusion Reading · 1 min Quiz: Working with Online Data & APIs 5 questions Instructors Joey deVilla Contributors Joey deVilla Author Tom Barker Tech Editor April Rames Editor Adriana Kutenko Illustrator Ehab Amer Final Pass Editor Kelvin Pere Video Editor Brian Moakley Video Editor Over 300 content creators. Join our team. { "@context": "http://schema.org", "@type": "Course", "name": "Python for AI: A Crash Course", "description": "&lt;p&gt;This module cov