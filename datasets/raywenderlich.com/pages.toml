["https://raywenderlich.com/ai/programs/ai-apis/azure-ai-services/45606697-azure-content-safety/01-introduction-to-azure-content-safety/01"]
title = "Introduction | Kodeco"
description = "A Kodeco subscription is the best way to learn and master mobile development. Learn iOS, Swift, Android, Kotlin, Flutter and Dart development and unlock our massive catalog of 50+ books and 4,000+ videos."
full_description = "Introduction In the age of user generated content, content moderation is critical for providing a safe space for your users. The sheer amount of content demand effective, automated content moderation solutions and these solutions need to operate in real-time, regardless of the scale of data moderation needed. This is where Azure Content Safety and similar platforms come to the rescue, offering the reassurance of real-time operation. Azure Content Safety uses artificial intelligence to detect and flag harmful content like text, images, and likely videos soon, too. Since it relies on computation and AI without the need for human moderators, it can process vast amounts of content in real time without affecting the effectiveness of the moderation. This lesson will help you to understand why content moderation is important, and the challenges faced in achieving it with the ever-increasing amount of content generation and AI apps. You will then dive into Azure Content Safety, which uses AI for moderation as a solution to overcome these challenges. Finally, you’ll cover some of the ethical considerations that you need to account for when incorporating AI-focused content moderation into systems. Get ready for an amazing learning journey about content moderation and AI — to help you understand how you can build a better, safer app, especially in the context of generating or consuming vast amounts of data. By the end of this lesson, you will: Learn the importance and challenges of content moderation in AI apps. Explore the features and capabilities of Azure Content Safety. Analyze ethical considerations in automated content moderation."
