entor will grade and return your homework within three days of receiving it. Is the monthly plan or the one-time payment option better for me? If you believe you can progress through the material swiftly, the monthly plan will be a good option for you. On the other hand, if you prefer a stress-free experience without the monthly payment reminders, opting for the one-time payment is ideal because it grants you ample time to complete the bootcamp curriculum. Please note that the monthly plan gives you access to a mentor for the entire duration of your subscription, whereas the one-time payment gives you access to a mentor for 1 year. What happens if I have to withdraw from the On-Demand Bootcamp? We understand that circumstances can change, and if you need to withdraw from the bootcamp, your options will vary depending on your billing cycle: - If you enrolled with a monthly plan, you can cancel your future billing with your membership and you will not be renewed on your next billing date OR you can pause your membership for up to three months, then you can pick up your studies again at that time. - If you enrolled with a one-time payment, you will be eligible for a full refund within the first 14 days of your enrollment into the bootcamp. *Please note: if you’ve accessed a significant portion of program materials, this might affect your eligibility for a full refund. Please email support@kodeco.com for further assistance on the withdrawal process.'''
