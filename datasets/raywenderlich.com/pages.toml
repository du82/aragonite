on the original TextKit. Go to module Expand module content Hide module content Show module content Hide module content Meet Writing Tools · Start lesson 16 mins Controlling Writing Tools With UIKit 23 mins Integrating Writing Tools With Custom Views 8 mins 2 App Intents with Siri Sep 19 2024 · Multimodal Module (55 mins) This module focuses on the latest Siri and App Intents update with Apple Intelligence. Students will learn how to leverage these powerful tools to create deeply integrated, context-aware iOS apps that can interact seamlessly with Siri. Go to module Expand module content Hide module content Show module content Hide module content Introduction to Apple Intelligence with Siri & App Intents · Start lesson 20 mins Siri Interactions with App Intents 17 mins Optimizing User Experience with Siri Integration 18 mins Genmoji Sep 19 2024 · Multimodal Module (23 mins) Explore Genmoji, enhancing your apps with expressive, customizable emojis. Learn to render, store, and communicate with text that includes Genmoji. Go to module Expand module content Hide module content Show module content Hide module content Introduction to Genmoji · Start lesson 11 mins Implementing Genmoji in Your App 7 mins Advanced Genmoji Applications 5 mins'
