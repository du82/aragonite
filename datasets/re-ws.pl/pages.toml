title = "New VCI+A-BT (DS150E) ST-Link pinout – re-ws.pl"
description = "New VCI+A-BT is advertised as DS150E. Under the hood there is nice STM32 and STM8 pair. Its pinout is as below:"
full_description = "New VCI+A-BT (DS150E) ST-Link pinout Posted on August 7, 2019 - August 8, 2019 by Kamil (aka. v3l0c1r4pt0r) This device could easily be found at the Chinese sellers. They advertise them as DS150E. Under the hood there is nice STM32 and STM8 pair. One is present on main PCB (in my case TCS MAIN V6.0), the other on relay board (TCS+RELAY V3.0). Both chips have their ST-Link headers broken out. If one want to read/write the firmware installed in internal flash, it should be as easy as connecting few of these pins. Control board (STM32) Main PCB with STM32 The main chip is STM32F205ZGT6 (where T6 is 144-pin variant). On this board there is J400 header. Its pinout is as below: J400 header Num. Function SoC pin Num. Function SoC pin 1 VDD 108 2 TMS/SWDIO 105 3 PE15 68 4 TCK/SWCLK 109 5 PE15 68 6 TDO 133 7 N/C – 8 TDI 110 9 VSS 16 10 NRST 25 I don’t know, why PE15 is broken out here and why is it doubled. To ensure the pinout is not changing from version to version, one can probe continuity between J400 pin and SoC pin. Relay board (STM8) Relay board with STM8 on board The slave chip is STM8S003K3T6C. On this board there is J001 header, matching the standard goldpin pitch, so should be extra easy to handle. Its pinout is: J001 header Num. Function STM8 pin 1 VSS 4 2 VDD 6 3 SWIM 26 4 NRST 1 Also here it is easy to check if pins on particular revision of board are the same using chip pin assignment. Posted in RandomTagged CAN, can-hacking, electronics, English, hacking, hardware, PCB, pinout, Reverse Engineering, STM32, STM8 Fernando Vianel says: June 29, 2020 at 23:54 Hello! Does anyone have the stm8s firmware of the relay card to send me? I paid 50.00 for the valid firmware of the stm8s of the relay board. my email: fernandovianel@gmail.com or WhatsApp: +55 32988894294 Reply Eliezer says: November 18, 2021 at 15:35 Hello Fernando, I’m Eliezer, did you get the firmware from the stm8s (DS150E)? because I need to too! thanks Reply Fernando says: December 2, 2021 at 21:40 Não consegui e tive que comprar outra placa , porém não funcionou…parece ter mais defeitos, então desisti.. Reply"
