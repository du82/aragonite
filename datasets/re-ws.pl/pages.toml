full_description = "Pinout of laser driver for CPRI SFP+ module – GN1157 Posted on October 15, 2022 by Kamil (aka. v3l0c1r4pt0r) On one of the usual sources of weird electronics I came across quiet unusual SFP+ module and could not resist buying it to see how it works. For now I was unable to make it work, but at least I made few photos of its internals. It turned out its main part is obscure chip made by Semtech and described as GN1157, which serves as laser diode driver. Obviously obtaining datasheet is impossible even in China. However, thanks to being able to see the board, I was able to reverse engineer some part of its pinout. Continue reading “Pinout of laser driver for CPRI SFP+ module – GN1157” → Posted in RandomTagged electronics, hacking, hardware, pinout, Reverse Engineering1 Comment"
