full_description = "Peugeot 407 rain sensor pinout Posted on August 3, 2020 - August 3, 2020 by Kamil (aka. v3l0c1r4pt0r) I had a project in mind featuring rain sensor, present in Peugeot 407 car, among others, probably. However, reality is that it is on my todo list for years now and I don’t think I will do it ever. But, I already bought the sensor in the past and it was lying in my drawer. So why not to disassemble it and figure out the pinout. Identification To be precise in what I am talking about, here are some magic values, I know about this thing: Manufacturer: Bosch Part number: 1 397 212 Another number: 96 524 903 80 Peugeot part number: 6405 CW Continue reading “Peugeot 407 rain sensor pinout” → Posted in RandomTagged 407, CAN, can-hacking, English, hacking, Peugeot, pinout, Reverse Engineering3 Comments"
