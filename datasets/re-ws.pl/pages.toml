title = "December 2019 – re-ws.pl"
description = "ReverseEngineering WorkStation"
full_description = "OpenRISC 1000 support integrated into radare2 Posted on December 22, 2019 by Kamil (aka. v3l0c1r4pt0r) Few months ago, as part of an effort to reverse engineer Lenkeng LKV373A HDMI to Ethernet converter, I announced disassembly plugin for radare2. This week it has been officially released by radare2 team. My patches are integrated into radare2 version 4.1.0 and 4.1.1. They also should be currently present in GUI variant of radare2 – Cutter. Its version 1.10 is based on radare2 code version 4.1.1. At the moment of writing this, Arch Linux still do not have these versions in repository, but I expect updates will appear in few days. Posted in NewsTagged EnglishLeave a comment Playing with GF-07 GPS device Posted on December 11, 2019 by Kamil (aka. v3l0c1r4pt0r) GF-07 is dirt-cheap GPS locator. You put SIM card in it, send SMS and you know where it is. That’s it. But not for me. I like to know what I am using, especially if it is that cheap and such obscure device as this one. It comes together with manual that is written in so bad English that I barely understand anything. Immediately after opening SIM slot, one can see few test pads. Fortunately all of them are described in silkscreen. Let’s see what can be done with it as a one-evening hack. SIM cover opened (pin headers visible) Continue reading “Playing with GF-07 GPS device” → Posted in RandomTagged English, GPS, GSM, hacking, hardware, Reverse Engineering49 Comments Hacking Android’s Bluetooth application to receive any file (outside whitelist) Posted on December 9, 2019 - December 12, 2019 by Kamil (aka. v3l0c1r4pt0r) Bluetooth application in AOSP hardcodes strange constraint in form of whitelist of MIME types that are allowed to be received. Also LineageOS seems to have that code compiled for some reason. There is no other way to allow any file transfer than to make your own Bluetooth apk and install it. In this tutorial I will show how to recompile APK and install it in system. Before I start I have to warn anybody trying to follow the tutorial: THERE IS NO WARRANTY THAT THIS METHOD WILL WORK, I am not responsible for bootloops, broken Bluetooth or any other harm made to your device. You, and only you are responsible for your device, so don’t do it, if you don’t know what you’re doing! Continue reading “Hacking Android’s Bluetooth application to receive any file (outside whitelist)” → Posted in UncategorizedTagged Android, Bluetooth, English, hacking, LineageOS, programmingLeave a comment"
