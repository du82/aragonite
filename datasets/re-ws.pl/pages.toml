title = "November 2018 – re-ws.pl"
description = "ReverseEngineering WorkStation"
full_description = "SADVE – tiny program for computing #define values Posted on November 10, 2018 - July 14, 2019 by Kamil (aka. v3l0c1r4pt0r) While tinkering with spy camera, I found one detail that is significantly slowing the process of reverse engineering and debugging the applications, installed on its embedded Linux platform – finding final values of preprocessor directives and sometimes also results of sizeof() operator. As I am not aware of any existing solution for that problem (I guess there might be some included in one of the more sophisticated IDEs, however I use Vim for development) it is good reason to create one. By the way I used cmake template I published some days ago to bootstrap the project. Continue reading “SADVE – tiny program for computing #define values” → Posted in UncategorizedTagged C, cmake, English, Linux, programming, software2 Comments UART pinout for noname spy camera Posted on November 3, 2018 - October 6, 2019 by Kamil (aka. v3l0c1r4pt0r) Front side of the main board As I wrote few months ago, I bought tiny WiFi camera, advertised as a spy camera or nannycam. This week, I decided to work on the topic a bit. However, due to some serious failure, I alarmed on Twitter, I was not able to connect to its WiFi hotspot anymore. Therefore I had to use UART to recover it from backup. Below you can find parameters needed to connect to this cam. At first however I want to present any identification numbers, that might be useful to confirm it is the same device, as it has no real name. Identification Device overview (rubber package already stripped from PCB) As can be seen in picture on the right, the device consists of main PCB, camera with tape cable, battery pack and optional USB cable for charging. To be able to reach UART header, I had to strip the rubber package from main board. Below I was able to see two identification strings: HB-WIFI-Z6 – this is most likely the name of the board, unfortunately neither Google or even Taobao does not know it MS-ME198407 – this is very interesting, as it seems to mean some internal name of laptop computer (don’t know who is the vendor) Furthermore on camera tape there is one more magic string – HY-OV9712-6. After first dash it seems to be oh – not to be confused with zero). How do I know it? Because OV9712 is model name of camera optics made by OmniVision and it more or less matches the parameters of the camera. Last batch of IDs is, at first processor name and vendor, which is quite unusual at least outside China – T10 made by Ingenic, which appear to produce MIPS cores and dev boards for it. Also I can see in logs the board should be called ISVP, which is not necessarily true – see Google. At last cpuinfo says that system type is mango, which appear to be fairly common in cheap Chinese cameras. Continue reading “UART pinout for noname spy camera” → Posted in RandomTagged English, hardware, pinout, UART16 Comments"
