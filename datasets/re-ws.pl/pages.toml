title = "SADVE – tiny program for computing #define values – re-ws.pl"
description = "SADVE is small utility for finding final values of preprocessor directives and  results of sizeof() operator."
full_description = "SADVE – tiny program for computing #define values Posted on November 10, 2018 - July 14, 2019 by Kamil (aka. v3l0c1r4pt0r) While tinkering with spy camera, I found one detail that is significantly slowing the process of reverse engineering and debugging the applications, installed on its embedded Linux platform – finding final values of preprocessor directives and sometimes also results of sizeof() operator. As I am not aware of any existing solution for that problem (I guess there might be some included in one of the more sophisticated IDEs, however I use Vim for development) it is good reason to create one. By the way I used cmake template I published some days ago to bootstrap the project. Usage Ease of use was the main goal here, as it is obviously possible to create improvised solution by creating hello-world type of program, including required headers and printing the symbol we want to compute value of. So, to be able to use SADVE, you just have to clone the repo and use standard cmake installation commands and you’re done: mkdir -p build cd build cmake .. make sudo make install Then you can call it like below: sadve -d AF_INET sys/socket.h And you should get 2 as an answer. That’s it. If instead you want to get size of some structure, you can type: sadve -s sockaddr sys/socket.h And you should get size of sockaddr structure. Obviously, you can see full usage with sadve --help. Internals Internally the program simply automates the process I described in the first paragraph of Usage – it applies what is desired by user to hello-world-like template and compiles. Therefore it might not be the best idea to make it a backend for web service available for general public, at least without a lot of isolation and input sanitization. However for private usage this should be enough. If you are interested in doing such task with cmake, I encourage you to dive into source code on Github. To speed the process up, I had to store all cmake build files in ~/.cache with no interface for cleaning it up. Posted in UncategorizedTagged C, cmake, English, Linux, programming, software"
