title = "Peugeot 407 rain sensor pinout – re-ws.pl"
description = "ReverseEngineering WorkStation"
full_description = "Peugeot 407 rain sensor pinout Posted on August 3, 2020 - August 3, 2020 by Kamil (aka. v3l0c1r4pt0r) I had a project in mind featuring rain sensor, present in Peugeot 407 car, among others, probably. However, reality is that it is on my todo list for years now and I don’t think I will do it ever. But, I already bought the sensor in the past and it was lying in my drawer. So why not to disassemble it and figure out the pinout. Identification To be precise in what I am talking about, here are some magic values, I know about this thing: Manufacturer: Bosch Part number: 1 397 212 Another number: 96 524 903 80 Peugeot part number: 6405 CW Disassembly It is pretty easy, considering the fact that car manufacturers does not like tinkerers. All you have to do is to push the two parts against each other and latch should undo. For reference, here is the picture of what is holding two halves together: Pinout It was not very hard to find out which pin is for what. Most of the chips on board are made by NXP, so information about them is not top secret. Here it is: Sensor connector Num. Function 1 12V 2 CANH 3 GND 4 CANL As you can see the sensor goes directly to 12 volt source (car battery). Signals are, unsurprisingly, CAN low and high. And that’s it. Maybe I will play a bit more with the thing in future, but I don’t promise anything. For sure it does not seem to be hard to hack it a bit, considering its heart is oldschool Motorola chip (now taken over by NXP) – 6800 series. Should be possible to get documentation, hard to say if Bosch secured binary code of the program or not. Gallery Last, but not least, some more photos for everyone to enjoy 🙂 Posted in RandomTagged 407, CAN, can-hacking, English, hacking, Peugeot, pinout, Reverse Engineering"
