["https://re-ws.pl/2018/02/setting-up-new-v3-hidden-service-with-ultimate-security-part-2-pki-and-tls"]
title = "Setting up new v3 Hidden Service with ultimate security: Part 2: PKI and TLS – re-ws.pl"
description = "Setting up new v3 Hidden Service with ultimate security: Part 2: PKI and TLS"
full_description = '''Setting up new v3 Hidden Service with ultimate security: Part 2: PKI and TLS Posted on February 20, 2018 - January 6, 2019 by Kamil (aka. v3l0c1r4pt0r) This post is a part of Tor v3 tutorial. Other parts are: Hidden Service setup PKI and TLS Client Authentication Installing client certificates to Firefox for Android After setting up working Tor hidden service, the next step to ultimate security is having properly implemented Public Key Infrastructure (PKI). For this step, there are a lot of tutorials already existing and there is not much that needs to be added to them. Personally, I was using tutorial available here for the second time now and I find it very well-written. Because I am going to follow this tutorial, I will just post commands that have to be executed. Before starting, I have to add one important remark. To make our PKI really secure one, it is crucial to have root CA air-gapped, that is device, on which it will be generated should be disconnected permanently from the internet. Good candidate for such a device might be some old laptop or Raspberry Pi Zero, as it lacks Ethernet port and anything reasonable to connect to internet. It is also important to store generated certificate in a safe place and secure it with strong non-dictionary password, which will be saved only in our mind. If the requirements are fulfilled, we can start the setup. Below are commands to type as well as output from them, for easier determination of whether the commands were successful or not. Preparations At first, we need to create following directory structure: ca ├── [drwxr-xr-x] certs ├── [drwxr-xr-x] crl ├── [-rw-r--r--] index.txt ├── [drwxr-xr-x] intermediate │ ├── [drwxr-xr-x] certs │ ├── [drwxr-xr-x] crl │ ├── [drwxr-xr-x] csr │ ├── [-rw-r--r--] index.txt │ ├── [drwxr-xr-x] newcerts │ ├── [drwx------] private │ └── [-rw-r--r--] serial ├── [drwxr-xr-x] newcerts ├── [drwx------] private └── [-rw-r--r--] serial And file content is (enclosed between pipe symbols: |): ./index.txt: || ./intermediate/index.txt: || ./intermediate/serial: |1000 | ./serial: |1000 | Then, we need to save this file into root/openssl.cnf and this file into root/intermediate/openssl.cnf. Inside them, the only thing that have to be changed is dir property in CA_default section. Use absolute path to your directory. Root CA Note: when giving values for certain fields, better give some country, state (I have just checked it’s necessary), ON, most importantly, Common Name and e-mail. Just in case some program will check if they exists. $ openssl genrsa -aes256 -out private/ca.key.pem 8192 Generating RSA private key, 8192 bit long modulus .................++ ....++ e is 65537 (0x010001) Enter pass phrase for private/ca.key.pem: Verifying - Enter pass phrase for private/ca.key.pem: $ chmod 400 private/ca.key.pem $ openssl req -config openssl.cnf -key private/ca.key.pem -new -x509 -days 7300 \ > -sha256 -extensions v3_ca -out certs/ca.cert.pem Enter pass phrase for private/ca.key.pem: You are about to be asked to enter information that will be incorporated into your certificate request. What you are about to enter is what is called a Distinguished Name or a DN. There are quite a few fields but you can leave some blank For some fields there will be a default value, If you enter '.', the field will be left blank. ----- Country Name (2 letter code) [GB]:PL State or Province Name [England]:lodzkie Locality Name []: Organization Name [Alice Ltd]:r4pt0r Test Systems Organizational Unit Name []: Common Name []:r4pt0r Root CA Email Address []:admin@example.com $ chmod 444 certs/ca.cert.pem $ openssl x509 -noout -text -in certs/ca.cert.pem Certificate: Data: Version: 3 (0x2) Serial Number: 9a:16:72:e8:ac:81:cd:be Signature Algorithm: sha256WithRSAEncryption Issuer: C = PL, ST = lodzkie, O = r4pt0r Test Systems, CN = r4pt0r Root CA, emailAddress = admin@example.com Validity Not Before: Feb 20 17:22:27 2018 GMT Not After : Feb 15 17:22:27 2038 GMT Subject: C = PL, ST = lodzkie, O = r4pt0r Test Systems, CN = r4pt0r Root CA, emailAddress = admin@example.com Subject Public Key Info: Public Key Algorithm: rsaEncryption Public-Key: (8192 bit) Modulus: 00:dd:8c:8f:5d:be:f4:0f:63:91:9c:73:bf:a8:17: <quite a lot of data> 6d:c1:3f:5c:05 Exponent: 65537 (0x10001) X509v3 extensions: X509v3 Subject Key Identifier: 29:53:8A:D2:ED:CF:35:C2:BB:A8:12:06:01:74:99:A3:B8:E5:DC:FE X509v3 Authority Key Identifier: keyid:29:53:8A:D2:ED:CF:35:C2:BB:A8:12:06:01:74:99:A3:B8:E5:DC:FE X509v3 Basic Constraints: critical CA:TRUE X509v3 Key Usage: critical Digital Signature, Certificate Sign, CRL Sign Signature Algorithm: sha256WithRSAEncryption a9:6d:9e:d4:bf:1b:55:d8:f0:b5:e9:9d:56:e8:58:04:d6:c3: <quite a lot of data> 89:50:26:4f:3e:93:95:06:c7:38:08:c7:16:0e:d2:a2 Intermediate CA $ openssl genrsa -aes256 -out intermediate/private/intermediate.key.pem 8192 Generating RSA private key, 8192 bit long modulus .++ ........................................................................................................................................................................................................................................................................................++ e is 65537 (0x010001) Enter pass phrase for intermediate/private/intermediate.key.pem: Verifying - Enter pass phrase for intermediate/private/intermediate.key.pem: $ chmod 400 intermediate/private/intermediate.key.pem $ openssl req -config intermediate/openssl.cnf -new -sha256 \ > -key intermediate/private/intermediate.key.pem -out intermediate/csr/intermediate.csr.pem Enter pass phrase for intermediate/private/intermediate.key.pem: You are about to be asked to enter information that will be incorporated into your certificate request. What you are about to enter is what is called a Distinguished Name or a DN. There are quite a few fields but you can leave some blank For some fields there will be a default value, If you enter '.', the field will be left blank. --