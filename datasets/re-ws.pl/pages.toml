full_description = "Using CMocka for unit testing C code Posted on October 25, 2018 - July 14, 2019 by Kamil (aka. v3l0c1r4pt0r) Writing unit tests along with the source code (or even before the code itself – see TDD) is currently very popular among programmers writing in languages like Java or C#. For C code, however it is a bit different. There are only a few frameworks enabling the possibility to write unit tests. One of them is quite special – it allows to mock functions. And its name is CMocka. Unfortunately there are not many resources that describes the process of setting up cmocka, especially together with cmake to allow programmers add new executables, tests and mocks without unnecessary overhead. But before showing how to do it, let’s go back to basics (if you already know them, you can skip next heading). Continue reading “Using CMocka for unit testing C code” → Posted in TutorialsTagged C, cmake, cmocka, English, programming, software2 Comments"
