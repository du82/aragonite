title = "UART pinout for noname spy camera – re-ws.pl"
description = "UART pinout for noname spy camera"
full_description = '''UART pinout for noname spy camera Posted on November 3, 2018 - October 6, 2019 by Kamil (aka. v3l0c1r4pt0r) Front side of the main board As I wrote few months ago, I bought tiny WiFi camera, advertised as a spy camera or nannycam. This week, I decided to work on the topic a bit. However, due to some serious failure, I alarmed on Twitter, I was not able to connect to its WiFi hotspot anymore. Therefore I had to use UART to recover it from backup. Below you can find parameters needed to connect to this cam. At first however I want to present any identification numbers, that might be useful to confirm it is the same device, as it has no real name. Identification Device overview (rubber package already stripped from PCB) As can be seen in picture on the right, the device consists of main PCB, camera with tape cable, battery pack and optional USB cable for charging. To be able to reach UART header, I had to strip the rubber package from main board. Below I was able to see two identification strings: HB-WIFI-Z6 – this is most likely the name of the board, unfortunately neither Google or even Taobao does not know it MS-ME198407 – this is very interesting, as it seems to mean some internal name of laptop computer (don’t know who is the vendor) Furthermore on camera tape there is one more magic string – HY-OV9712-6. After first dash it seems to be oh – not to be confused with zero). How do I know it? Because OV9712 is model name of camera optics made by OmniVision and it more or less matches the parameters of the camera. Last batch of IDs is, at first processor name and vendor, which is quite unusual at least outside China – T10 made by Ingenic, which appear to produce MIPS cores and dev boards for it. Also I can see in logs the board should be called ISVP, which is not necessarily true – see Google. At last cpuinfo says that system type is mango, which appear to be fairly common in cheap Chinese cameras. UART pinout It can be found on the back of the board, near its edge. Back of the main board 5-pin header Num. Function 1 UART0 RX 2 UART0 TX 3 UART1 RX 4 UART1 TX 5 GND Note: UART0 seem to be inactive, UART1 is where uboot and Linux can be accessed. Software To connect to UART above, you have to use 115200 bauds in 8N1 mode. During the powerup, you can see it utilizes custom uboot as bootloader. It should be possible to interrupt it in one second timeslot. After that Linux is loaded and it asks for login (you most likely will not see it because of the amount of messages printed). root account is present and does not ask for password. UART log Below you can find full log of system startup, after I successfully recovered the board to working state. U-Boot SPL 2013.07 (Jul 31 2017 - 17:53:34) pll_init:347 l2cache_clk = 450000000 pll_cfg.pdiv = 8, pll_cfg.h2div = 4, pll_cfg.h0div = 4, pll_cfg.cdiv = 1, pll_cfg.l2div = 2 nf=36 nr = 1 od0 = 1 od1 = 1 cppcr is 02404900 CPM_CPAPCR 0470890d nf=50 nr = 1 od0 = 1 od1 = 1 cppcr is 03204900 CPM_CPMPCR 0320490d cppcr 0x9a7b5510 apll_freq 860160000 mpll_freq 1200000000 ddr sel mpll, cpu sel apll ddrfreq 400000000 cclk 860160000 l2clk 430080000 h0clk 300000000 h2clk 300000000 pclk 150000000 CPM_DDRCDR(0000002c) = a0000002 DDRC_DLP:0000f003 CPM_SSICDR(00000074) = e0000011 U-Boot 2013.07 (Jul 31 2017 - 17:53:34) Board: ISVP (Ingenic XBurst T10 SoC) DRAM: 64 MiB Top of RAM usable for U-Boot at: 84000000 Reserving 435k for U-Boot at: 83f90000 Reserving 32784k for malloc() at: 81f8c000 Reserving 32 Bytes for Board Info at: 81f8bfe0 Reserving 124 Bytes for Global Data at: 81f8bf64 Reserving 128k for boot params() at: 81f6bf64 Stack Pointer at: 81f6bf48 Now running in RAM - U-Boot at: 83f90000 MMC: msc: 0 CPM_SSICDR(74) = e000000b the manufacturer ef SF: Detected W25Q64JV *** Warning - bad CRC, using default environment In: serial Out: serial Err: serial Net: CPM_MACCDR(54) = a0000017 Jz4775-9161 Hit any key to stop autoboot: 1 ^H^H^H 0 CPM_SSICDR(74) = e000000b the manufacturer ef SF: