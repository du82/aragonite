full_description = "Pinout of laser driver for CPRI SFP+ module – GN1157 Posted on October 15, 2022 by Kamil (aka. v3l0c1r4pt0r) On one of the usual sources of weird electronics I came across quiet unusual SFP+ module and could not resist buying it to see how it works. For now I was unable to make it work, but at least I made few photos of its internals. It turned out its main part is obscure chip made by Semtech and described as GN1157, which serves as laser diode driver. Obviously obtaining datasheet is impossible even in China. However, thanks to being able to see the board, I was able to reverse engineer some part of its pinout. Continue reading “Pinout of laser driver for CPRI SFP+ module – GN1157” → Posted in RandomTagged electronics, hacking, hardware, pinout, Reverse Engineering1 Comment Peugeot 407 rain sensor pinout Posted on August 3, 2020 - August 3, 2020 by Kamil (aka. v3l0c1r4pt0r) I had a project in mind featuring rain sensor, present in Peugeot 407 car, among others, probably. However, reality is that it is on my todo list for years now and I don’t think I will do it ever. But, I already bought the sensor in the past and it was lying in my drawer. So why not to disassemble it and figure out the pinout. Identification To be precise in what I am talking about, here are some magic values, I know about this thing: Manufacturer: Bosch Part number: 1 397 212 Another number: 96 524 903 80 Peugeot part number: 6405 CW Continue reading “Peugeot 407 rain sensor pinout” → Posted in RandomTagged 407, CAN, can-hacking, English, hacking, Peugeot, pinout, Reverse Engineering3 Comments Playing with GF-07 GPS device Posted on December 11, 2019 by Kamil (aka. v3l0c1r4pt0r) GF-07 is dirt-cheap GPS locator. You put SIM card in it, send SMS and you know where it is. That’s it. But not for me. I like to know what I am using, especially if it is that cheap and such obscure device as this one. It comes together with manual that is written in so bad English that I barely understand anything. Immediately after opening SIM slot, one can see few test pads. Fortunately all of them are described in silkscreen. Let’s see what can be done with it as a one-evening hack. SIM cover opened (pin headers visible) Continue reading “Playing with GF-07 GPS device” → Posted in RandomTagged English, GPS, GSM, hacking, hardware, Reverse Engineering49 Comments"
