title = "Pinout of laser driver for CPRI SFP+ module – GN1157 – re-ws.pl"
description = "Pinout of laser driver for CPRI SFP+ module – GN1157"
full_description = "Pinout of laser driver for CPRI SFP+ module – GN1157 Posted on October 15, 2022 by Kamil (aka. v3l0c1r4pt0r) On one of the usual sources of weird electronics I came across quiet unusual SFP+ module and could not resist buying it to see how it works. For now I was unable to make it work, but at least I made few photos of its internals. It turned out its main part is obscure chip made by Semtech and described as GN1157, which serves as laser diode driver. Obviously obtaining datasheet is impossible even in China. However, thanks to being able to see the board, I was able to reverse engineer some part of its pinout. Just in case somebody needs it, here it is: GN1157 Pin Meaning Comments 1 GND Ground 2 RD_N Directly to SFP+ 3 RD_P Directly to SFP+ 4 Module power, filtered with capacitors 5 TD_P Directly to SFP+ 6 TD_N Directly to SFP+ 7 Either I2C, or RST, to external 8051 uC, not connected to SFP+ I2C bus! 8 Either I2C, or RST, to external 8051 uC, not connected to SFP+ I2C bus! 9 Either I2C, or RST, to external 8051 uC, not connected to SFP+ I2C bus! 10 VCC Module power 11 Tx_Disable Directly to SFP+ 12 Power circuitry to TX laser, via inductor, capacitor, resistor to TXOUT2 13 VCC Module power 14 Resistor to GND 15 GND_PAD Ground, directly to pad underneath chip 16 TXOUT1 TOSA, laser diode for TX, unknown polarity 17 TXOUT2 TOSA, laser diode for TX, unknown polarity 18 GND_PAD Ground, directly to pad underneath chip 19 VCC Module power 20 TX or RX laser capacitor, V_PD or RSSI 21 Tx_Fault Directly to SFP+ 22 TX or RX laser capacitor, V_PD or RSSI 23 Resistor to GND 24 VCC Module power 25 RXIN1 ROSA, laser diode for RX, unknown polarity 26 RXIN2 ROSA, laser diode for RX, unknown polarity 27 GND Ground 28 RX_LOS Directly to SFP+ As can be seen in the table above, on the board there is another important chip – 8051 MCU, but I was not able to get more information on it, beside fact that it is connected to this driver via separate I2C bus. It would be interesting challenge to try extracting this MCU’s firmware, but as I have two of these modules and I plan to have them working together to see how CPRI transmission looks like in Wireshark, I don’t want to break any of them. I already have Banana Pi R3 for that purpose, but there is some issue with using SFP connectors, so for now my problem is finding time to debug the issue 🙂 Till then, here are some photos of mentioned SFP+ module made for Nokia and marked as IAB410060001. SFP+ module Bottom side of PCB. Chip is Silicon Labs C8051F336 8051 MCU Posted in RandomTagged electronics, hacking, hardware, pinout, Reverse Engineering"
