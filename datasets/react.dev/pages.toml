full_description = "CommunityTranslationsReact docs are translated by the global community into many languages all over the world. Source site All translations are provided from the canonical source docs: English — Contribute Full translations French (Français) — ContributeJapanese (日本語) — ContributeKorean (한국어) — ContributeSimplified Chinese (简体中文) — ContributeSpanish (Español) — ContributeTurkish (Türkçe) — Contribute In-progress translations For the progress of each translation, see: Is React Translated Yet? Arabic (العربية) — ContributeAzerbaijani (Azərbaycanca) — ContributeBelarusian (Беларуская) — ContributeBengali (বাংলা) — ContributeCzech (Čeština) — ContributeFinnish (Suomi) — ContributeGerman (Deutsch) — ContributeGujarati (ગુજરાતી) — ContributeHebrew (עברית) — ContributeHindi (हिन्दी) — ContributeHungarian (magyar) — ContributeIcelandic (Íslenska) — ContributeIndonesian (Bahasa Indonesia) — ContributeItalian (Italiano) — ContributeKazakh (Қазақша) — ContributeLao (ພາສາລາວ) — ContributeMacedonian (Македонски) — ContributeMalayalam (മലയാളം) — ContributeMongolian (Монгол хэл) — ContributePersian (فارسی) — ContributePolish (Polski) — ContributePortuguese (Brazil) (Português do Brasil) — ContributeRussian (Русский) — ContributeSerbian (Srpski) — ContributeSinhala (සිංහල) — ContributeSwahili (Kiswahili) — ContributeTamil (தமிழ்) — ContributeTelugu (తెలుగు) — ContributeTraditional Chinese (繁體中文) — ContributeUkrainian (Українська) — ContributeUrdu (اردو) — ContributeVietnamese (Tiếng Việt) — Contribute How to contribute You can contribute to the translation efforts! The community conducts the translation work for the React docs on each language-specific fork of react.dev. Typical translation work involves directly translating a Markdown file and creating a pull request. Click the “contribute” link above to the GitHub repository for your language, and follow the instructions there to help with the translation effort. If you want to start a new translation for your