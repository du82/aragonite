title = "React Conf 2021 Recap – React"
description = "The library for web and native user interfaces"
full_description = "BlogReact Conf 2021 RecapDecember 17, 2021 by Jesslyn Tannady and Rick Hanlon Last week we hosted our 6th React Conf. In previous years, we’ve used the React Conf stage to deliver industry changing announcements such as React Native and React Hooks. This year, we shared our multi-platform vision for React, starting with the release of React 18 and gradual adoption of concurrent features. This was the first time React Conf was hosted online, and it was streamed for free, translated to 8 different languages. Participants from all over the world joined our conference Discord and the replay event for accessibility in all timezones. Over 50,000 people registered, with over 60,000 views of 19 talks, and 5,000 participants in Discord across both events. All the talks are available to stream online. Here’s a summary of what was shared on stage: React 18 and concurrent features In the keynote, we shared our vision for the future of React starting with React 18. React 18 adds the long-awaited concurrent renderer and updates to Suspense without any major breaking changes. Apps can upgrade to React 18 and begin gradually adopting concurrent features with the amount of effort on par with any other major release. This means there is no concurrent mode, only concurrent features. In the keynote, we also shared our vision for Suspense, Server Components, new React working groups, and our long-term many-platform vision for React Native. Watch the full keynote from Andrew Clark, Juan Tejada, Lauren Tan, and Rick Hanlon here: React 18 for Application Developers In the keynote, we also announced that the React 18 RC is available to try now. Pending further feedback, this is the exact version of React that we will publish to stable early next year. To try the React 18 RC, upgrade your dependencies: npm install react@rc react-dom@rc and switch to the new createRoot API: // beforeconst container = document.getElementById('root');ReactDOM.render(<App />, container);// afterconst container = document.getElementById('root');const root = ReactDOM.createRoot(container);root.render(<App/>); For a demo of upgrading to React 18, see Shruti Kapoor’s talk here: Streaming Server Rendering with Suspense React 18 also includes improvements to server-side rendering performance using Suspense. Streaming server rendering lets you generate HTML from React components on the server, and stream that HTML to your users. In React 18, you can use Suspense to break down your app into smaller independent units which can be streamed independently of each other without blocking the rest of the app. This means users will see your content sooner and be able to start interacting with it much faster. For a deep dive, see Shaundai Person’s talk here: The first React working group For React 18, we created our first Working Group to collaborate with a panel of experts, developers, library maintainers, and educators. Together we worked to create our gradual adoption strategy and refine new APIs such as useId, useSyncExternalStore, and useInsertionEffect. For an overview of this work, see Aakansha’ Doshi’s talk: React Developer Tooling To support the new features in this release, we also announced the newly formed React DevTools team and a new Timeline Profiler to help developers debug their React apps. For more information and a demo of new DevTools features, see Brian Vaughn’s talk: React without memo Looking further into the future, Xuan Huang (黄玄) shared an update from our React Labs research into an auto-memoizing compiler. Check out this talk for more information and a demo of the compiler prototype: React docs keynote Rachel Nabors kicked off a section of talks about learning and designing with React with a keynote about our investment in React’s new docs (now shipped as react.dev): And more… We also heard talks on learning and designing with React: Debbie O’Brien: Things I learnt from the new React docs. Sarah Rainsberger: Learning in the Browser. Linton Ye: The ROI of Designing with React. Delba de Oliveira: Interactive playgrounds with React. Talks from the Relay, React Native, and PyTorch teams: Robert Balicki: Re-introducing Relay. Eric Rozell and Steven Moyes: React Native Desktop. Roman Rädle: On-device Machine Learning for React Native And talks from the community on accessibility, tooling, and Server Components: Daishi Kato: React 18 for External Store Libraries. Diego Haz: Building Accessible Components in React 18. Tafu Nakazaki: Accessible Japanese Form Components with React. Lyle Troxell: UI tools for artists. Helen Lin: Hydrogen + React 18. Thank you This was our first year planning a conference ourselves, and we have a lot of people to thank. First, thanks to all of our speakers Aakansha Doshi, Andrew Clark, Brian Vaughn, Daishi Kato, Debbie O’Brien, Delba de Oliveira, Diego Haz, Eric Rozell, Helen Lin, Juan Tejada, Lauren Tan, Linton Ye, Lyle Troxell, Rachel Nabors, Rick Hanlon, Robert Balicki, Roman Rädle, Sarah Rainsberger, Shaundai Person, Shruti Kapoor, Steven Moyes, Tafu Nakazaki, and Xuan Huang (黄玄). Thanks to everyone who helped provide feedback on talks including Andrew Clark, Dan Abramov, Dave McCabe, Eli White, Joe Savona, Lauren Tan, Rachel Nabors, and Tim Yung. Thanks to Lauren Tan for setting up the conference Discord and serving as our Discord admin. Thanks to Seth Webster for feedback on overall direction and making sure we were focused on diversity and inclusion. Thanks to Rachel Nabors for spearheading our moderation effort, and Aisha Blake for creating our moderation guide, leading our moderation team, training the translators and moderators, and helping to moderate both events. Thanks to our moderators Jesslyn Tannady, Suzie Grange, Becca Bailey, Luna Wei, Joe Previte, Nicola Corti, Gijs Weterings, Claudio Procida, Julia Neumann, Mengdi Chen, Jean Zhang, Ricky Li, and Xuan Huang (黄玄). Thanks to Manjula Dube, Sahil Mhapsekar, and Vihang Patel from React India, and Jasmine Xie, QiChang Li, and YanLun Li from React China for helping moderate our replay event and keep it engaging for the community. Thanks to Vercel for publishing their Virtual Event Starter Kit, which the conference website was built on, and to Lee Robinson and Delba de Oliveira for sharing their experience running Next.js Conf. Thanks to Leah Silber for sharing her experience running conferences, learnings from running RustConf, and for her book Event Driven and the advice it contains for running conferences. Thanks to Kevin Lewis and Rachel Nabors for sharing their experience running Women of React Conf. Thanks to Aakansha Doshi, Laurie Barth, Michael Chan, and Shaundai Person for their advice and ideas throughout planning. Thanks to Dan Lebowitz for help designing and building the conference website and tickets. Thanks to Laura Podolak Waddell, Desmond Osei-Acheampong, Mark Rossi, Josh Toberman and others on the Facebook Video Productions team for recording the videos for the Keynote and Meta employee talks. Thanks to our partner HitPlay for helping to organize the conference, editing all the videos in the stream, translating all the talks, and moderating the Discord in multiple languages. Finally, thanks to all of our participants for making this a great React Conf!PreviousHow to Upgrade to React 18NextThe Plan for React 18"
