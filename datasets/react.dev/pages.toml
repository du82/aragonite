title = "React 19 Upgrade Guide – React"
description = "The library for web and native user interfaces"
full_description = '''BlogReact 19 Upgrade GuideApril 25, 2024 by Ricky Hanlon The improvements added to React 19 require some breaking changes, but we’ve worked to make the upgrade as smooth as possible, and we don’t expect the changes to impact most apps. NoteReact 18.3 has also been published To help make the upgrade to React 19 easier, we’ve published a react@18.3 release that is identical to 18.2 but adds warnings for deprecated APIs and other changes that are needed for React 19.We recommend upgrading to React 18.3 first to help identify any issues before upgrading to React 19.For a list of changes in 18.3 see the Release Notes. In this post, we will guide you through the steps for upgrading to React 19: Installing Codemods Breaking changes New deprecations Notable changes TypeScript changes Changelog If you’d like to help us test React 19, follow the steps in this upgrade guide and report any issues you encounter. For a list of new features added to React 19, see the React 19 release post. Installing NoteNew JSX Transform is now required We introduced a new JSX transform in 2020 to improve bundle size and use JSX without importing React. In React 19, we’re adding additional improvements like using ref as a prop and JSX speed improvements that require the new transform.If the new transform is not enabled, you will see this warning:ConsoleYour app (or one of its dependencies) is using an outdated JSX transform. Update to the modern JSX transform for faster performance: https://react.dev/link/new-jsx-transformWe expect most apps will not be affected since the transform is enabled in most environments already. For manual instructions on how to upgrade, please see the announcement post. To install the latest version of React and React DOM: npm install --save-exact react@^19.0.0 react-dom@^19.0.0 Or, if you’re using Yarn: yarn add --exact react@^19.0.0 react-dom@^19.0.0 If you’re using TypeScript, you also need to update the types. npm install --save-exact @types/react@^19.0.0 @types/react-dom@^19.0.0 Or, if you’re using Yarn: yarn add --exact @types/react@^19.0.0 @types/react-dom@^19.0.0 We’re also including a codemod for the most common replacements. See TypeScript changes below. Codemods To help with the upgrade, we’ve worked with the team at codemod.com to publish codemods that will automatically update your code to many of the new APIs and patterns in React 19. All codemods are available in the react-codemod repo and the Codemod team have joined in helping maintain the codemods. To run these codemods, we recommend using the codemod command instead of the react-codemod because it runs faster, handles more complex code migrations, and provides better support for TypeScript. NoteRun all React 19 codemods Run all codemods listed in this guide with the React 19 codemod recipe:npx codemod@latest react/19/migration-recipeThis will run the following codemods from react-codemod: replace-reactdom-render replace-string-ref replace-act-import replace-use-form-state prop-types-typescript This does not include the TypeScript changes. See TypeScript changes below. Changes that include a codemod include the command below. For a list of all available codemods, see the react-codemod repo. Breaking changes Errors in render are not re-thrown In previous versions of React, errors thrown during render were caught and rethrown. In DEV, we would also log to console.error, resulting in duplicate error logs. In React 19, we’ve improved how errors are handled to reduce duplication by not re-throwing: Uncaught Errors: Errors that are not caught by an Error Boundary are reported to window.reportError. Caught Errors: Errors that are caught by an Error Boundary are reported to console.error. This change should not impact most apps, but if your production error reporting relies on errors being re-thrown, you may need to update your error handling. To support this, we’ve added new methods to createRoot and hydrateRoot for custom error handling: const root = createRoot(container, { onUncaughtError: (error, errorInfo) => { // ... log error report }, onCaughtError: (error, errorInfo) => { // ... log error report }}); For more info, see the docs for createRoot and hydrateRoot. Removed deprecated React APIs Removed: propTypes and defaultProps for functions PropTypes were deprecated in April 2017 (v15.5.0). In React 19, we’re removing the propType checks from the React package, and using them will be silently ignored. If you’re using propTypes, we recommend migrating to TypeScript or another type-checking solution. We’re also removing defaultProps from function components in place of ES6 default parameters. Class components will continue to support defaultProps since there is no ES6 alternative. // Beforeimport PropTypes from 'prop-types';function Heading({text}) { return <h1>{text}</h1>;}Heading.propTypes = { text: PropTypes.string,};Heading.defaultProps = { text: 'Hello, world!',}; // Afterinterface Props { text?: string;}function Heading({text = 'Hello, world!'}: Props) { return <h1>{text}</h1>;} NoteCodemod propTypes to TypeScript with:npx codemod@latest react/prop-types-typescript Removed: Legacy Context using contextTypes and getChildContext Legacy Context was deprecated in October 2018 (v16.6.0). Legacy Context was only available in class components using the APIs contextTypes and getChildContext, and was replaced with contextType due to subtle bugs that were easy to miss. In React 19, we’re removing Legacy Context to make React slightly smaller and faster. If you’re still using Legacy Context in class components, you’ll need to migrate to the new contextType API: // Beforeimport PropTypes from 'prop-types';class Parent extends React.Component { static childContextTypes = { foo: PropTypes.string.isRequired, }; getChildContext() { return { foo: 'bar' }; } render() { return <Child />; }}class Child extends React.Component { static contextTypes = { foo: PropTypes.string.isRequired, }; render() { return <div>{this.context.foo}</div>; }} // Afterconst FooContext = React.createContext();class Parent extends React.Component { render() { return ( <FooContext value='bar'> <Child /> </FooContext> ); }}class Child extends React.Component { static contextType = FooContext; render() { return <div>{this.context}</div>; }} Removed: string refs String refs were deprecated in March, 2018 (v16.3.0). Class components supported string refs before being replaced by ref callbacks due to multiple downsides. In React 19, we’re removing string refs to make React simpler and easier to understand. If you’re still using string refs in class components, you’ll need to migrate to ref callbacks: // Beforeclass MyComponent extends React.Component { componentDidMount() { this.refs.input.focus(); } render() { return <input ref='input' />; }} // Afterclass MyComponent extends React.Component { componentDidMount() { this.input.focus(); } render() { return <input ref={input => this.input = input} />; }} NoteCodemod string refs with ref callbacks:npx codemod@latest react/19/replace-string-ref Removed: Module pattern factories Module pattern factories were deprecated in August 2019 (v16.9.0). This pattern was rarely used and supporting it causes React to be slightly larger and slower than necessary. In React 19, we’re removing support for module pattern factories, and you’ll need to migrate to regular functions: // Beforefunction FactoryComponent() { return { render() { return <div />; } }} // Afterfunction FactoryComponent() { return <div />;} Removed: React.createFactory createFactory was deprecated in February 2020 (v16.13.0). Using createFactory was common before broad support for JSX, but it’s rarely used today and can be replaced with JSX. In React 19, we’re removing createFactory and you’ll need to migrate to JSX: // Beforeimport { createFactory } from 'react';const button = createFactory('button'); // Afterconst button = <button />; Removed: react-test-renderer/shallow In React 18, we updated react-test-renderer/shallow to re-export react-shallow-renderer. In React 19, we’re removing react-test-render/shallow to prefer installing the package directly: npm install react-shallow-renderer --save-dev - import ShallowRenderer from 'react-test-renderer/shallow';+ import ShallowRenderer from 'react-shallow-renderer'; NotePlease reconsider shallow rendering Shallow rendering depends on React internals and can block you from future upgrades. We recommend migrating your tests to @testing-library/react or @testing-library/react-native. Removed deprecated React DOM APIs Removed: react-dom/test-utils We’ve moved act from react-dom/test-utils to the react package: ConsoleReactDOMTestUtils.act is deprecated in favor of React.act. Import act from react instead of react-dom/test-utils. See https://react.dev/warnings/react-dom-test-utils for more info. To fix this warning, you can import act from react: - import {act} from 'react-dom/test-utils'+ import {act} from 'react'; All other test-utils functions have been removed. These utilities were uncommon, and made it too easy to depend on low level implementation details of your components and React. In React 19, these functions will error when called and their exports will be removed in a future version. See the warning page for alternatives. NoteCodemod ReactDOMTestUtils.act to React.act:npx codemod@latest react/19/replace-act-import Removed: ReactDOM.render ReactDOM.render was deprecated in March 2022 (v18.0.0). In React 19, we’re removing ReactDOM.render and you’ll need to migrate to using ReactDOM.createRoot: // Beforeimport {render} from 'react-dom';render(<App />, document.getElementById('root'));// Afterimport {createRoot} from 'react-dom/client';const root = createRoot(document.getElementById('root'));root.render(<App />); NoteCodemod ReactDOM.render to ReactDOMClient.createRoot:npx codemod@latest react/19/replace-reactdom-render Removed: ReactDOM.hydrate ReactDOM.hydrate was deprecated in March 2022 (v18.0.0). In React 19, we’re removing ReactDOM.hydrate you’ll need to migrate to using ReactDOM.hydrateRoot, // Beforeimport {hydrate} from 'react-dom';hydrate(<App />, document.getElementById('root'));// Afterimport {hydrateRoot} from 'react-dom/client';hydrateRoot(document.getElementById('root'), <App />); NoteCodemod ReactDOM.hydrate to ReactDOMClient.hydrateRoot:npx codemod@latest react/19/replace-reactdom-render Removed: unmountComponentAtNode ReactDOM.unmountComponentAtNode was deprecated in March 2022 (v18.0.0). In React 19, you’ll need to migrate to using root.unmount(). // BeforeunmountComponentAtNode(document.getElementById('root'));// Afterroot.unmount(); For more see root.unmount() for createRoot and hydrateRoot. NoteCodemod unmountComponentAtNode to root.unmount:npx codemod@latest react/19/replace-reactdom-render Removed: ReactDOM.findDOMNode ReactDOM.findDOMNode was deprecated in October 2018 (v16.6.0). We’re removing findDOMNode because it was a legacy escape hatch that was slow to execute, fragile to refactoring, only returned the first child, and broke abstraction levels (see more here). You can replace ReactDOM.findDOMNode with DOM refs: // Beforeimport {findDOMNode} from 'react-dom';function AutoselectingInput() { useEffect(() => { const input = findDOMNode(this); input.select() }, []); return <input defaultValue="Hello" />;} // Afterfunction AutoselectingInput() { const ref = useRef(null); useEffect(() => { ref.current.select(); }, []); return <input ref={ref} defaultValue="Hello" />} New deprecations Deprecated: element.ref React 19 supports ref as a prop, so we’re deprecating the element.ref in place of element.props.ref. Accessing element.ref will warn: ConsoleAccessing element.ref is no longer supported. ref is now a regular prop. It will be removed from the JSX Element type in a future release. Deprecated: react-test-renderer We are deprecating react-test-renderer because it implements its own renderer environment that doesn’t match the environment users use, promotes testing implementation details, and relies on introspection of React’s internals. The test renderer was created before there were more viable testing strategies available like React Testing Library, and we now recommend using a modern testing library instead. In React 19, react-test-renderer logs a deprecation warning, and has switched to concurrent rendering. We recommend migrating your tests to @testing-library/react or @testing-library/react-native for a modern and well supported testing experience. Notable changes StrictMode changes React 19 includes several fixes and improvements to Strict Mode. When double rendering in Strict Mode in development, useMemo and useCallback will reuse the memoized results from the first render during the second render. Components that are already Strict Mode compatible should not notice a difference in behavior. As with all Strict Mode behaviors, these features are designed to proactively surface bugs in your components during development so you can fix them before they are shipped to production. For example, during development, Strict Mode will double-invoke ref callback functions on initial mount, to simulate what happens when a mounted component is replaced by a Suspense fallback. Improvements to Suspense In React 19, when a component suspends, React will immediately commit the fallback of the nearest Suspense boundary without waiting for the entire sibling tree to render. After the fallback commits, React schedules another render for the suspended siblings to “pre-warm” lazy requests in the rest of the tree: Previously, when a component suspended, the suspended siblings were rendered and then the fallback was committed. In React 19, when a component suspends, the fallback is committed and then the suspended siblings are rendered. This change means Suspense fallbacks display faster, while still warming lazy requests in the suspended tree. UMD builds removed UMD was widely used in the past as a convenient way to load React without a build step. Now, there are modern alternatives for loading modules as scripts in HTML documents. Starting with React 19, React will no longer produce UMD builds to reduce the complexity of its testing and release process. To load React 19 with a script tag, we recommend using an ESM-based CDN such as esm.sh. <script type="module"> import React from "https://esm.sh/react@19/?dev" import ReactDOMClient from "https://esm.sh/react-dom@19/client?dev" ...</script> Libraries depending on React internals may block upgrades This release includes changes to React internals that may impact libraries that ignore our pleas to not use internals like SECRET_INTERNALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED. These changes are necessary to land improvements in React 19, and will not break libraries that follow our guidelines. Based on our Versioning Policy, these updates are not listed as breaking changes, and we are not including docs for how to upgrade them. The recommendation is to remove any code that depends on interna'''
