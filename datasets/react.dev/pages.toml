full_description = "React DocsReact VersionsThe React docs at react.dev provide documentation for the latest version of React. We aim to keep the docs updated within major versions, and do not publish versions for each minor or patch version. When a new major is released, we archive the docs for the previous version as x.react.dev. See our versioning policy for more info. You can find an archive of previous major versions below. Latest version: 19.0 react.dev Previous versions 18.react.dev 17.react.dev 16.react.dev 15.react.dev NoteLegacy Docs In 2023, we launched our new docs for React 18 as react.dev. The legacy React 18 docs are available at legacy.reactjs.org. Versions 17 and below are hosted on legacy sites.For versions older than React 15, see 15.react.dev. Changelog React 19 Blog Posts React v19 React 19 Upgrade Guide React Compiler Beta Release Talks React 19 Keynote A Roadmap to React 19 What’s new in React 19 React for Two Computers React Compiler Deep Dive React Compiler Case Studies React 19 Deep Dive: Coordinating HTML Releases v19.0.0 (December, 2024) React 18 Blog Posts React v18.0 How to Upgrade to React 18 The Plan for React 18 Talks React 18 Keynote React 18 for app developers Streaming Server Rendering with Suspense React without memo React Docs Keynote React Developer Tooling The first React Working Group React 18 for External Store Libraries Releases v18.3.1 (April, 2024) v18.3.0 (April, 2024) v18.2.0 (June, 2022) v18.1.0 (April, 2022) v18.0.0 (March 2022) React 17 Blog Posts React v17.0 Introducing the New JSX Transform React v17.0 Release Candidate: No New Features Releases v17.0.2 (March 2021) v17.0.1 (October 2020) v17.0.0 (October 2020) React 16 Blog Posts React v16.0 DOM Attributes in React 16 Error Handling in React 16 React v16.2.0: Improved Support for Fragments React v16.4.0: Pointer Events React v16.4.2: Server-side vulnerability fix React v16.6.0: lazy, memo and contextType React v16.7: No, This Is Not the One With Hooks React v16.8: