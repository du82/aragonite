title = "Installation – React"
description = "The library for web and native user interfaces"
full_description = 'Learn ReactInstallationReact has been designed from the start for gradual adoption. You can use as little or as much React as you need. Whether you want to get a taste of React, add some interactivity to an HTML page, or start a complex React-powered app, this section will help you get started. Try React You don’t need to install anything to play with React. Try editing this sandbox! App.jsApp.js ResetForkfunction Greeting({ name }) { return <h1>Hello, {name}</h1>; } export default function App() { return <Greeting name="world" /> } You can edit it directly or open it in a new tab by pressing the “Fork” button in the upper right corner. Most pages in the React documentation contain sandboxes like this. Outside of the React documentation, there are many online sandboxes that support React: for example, CodeSandbox, StackBlitz, or CodePen. To try React locally on your computer, download this HTML page. Open it in your editor and in your browser! Creating a React App If you want to start a new React app, you can create a React app using a recommended framework. Build a React Framework If a framework is not a good fit for your project, or you prefer to start by building your own framework, you can build your own React framework. Add React to an existing project If want to try using React in your existing app or a website, you can add React to an existing project. Deprecated Options Create React App (Deprecated) Create React App is a deprecated tool, previously recommended for creating new React apps. If you want to start a new React app, you can create a React app using a recommended framework. For more information, see Sunsetting Create React App. Next steps Head to the Quick Start guide for a tour of the most important React concepts you will encounter every day.PreviousThinking in ReactNextCreating a React App'
