full_description = 'CommunityMeet the TeamReact development is led by a dedicated team working full time at Meta. It also receives contributions from people all over the world. React Core The React Core team members work full time on the core component APIs, the engine that powers React DOM and React Native, React DevTools, and the React documentation website. Current members of the React team are listed in alphabetical order below. <img alt="Andrew Clark" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" sizes="100vw" srcSet="/_next/image?url=%2Fimages%2Fteam%2Facdlite.jpg&amp;w=640&amp;q=75 640w, /_next/image?url=%2Fimages%2Fteam%2Facdlite.jpg&amp;w=750&amp;q=75 750w, /_next/image?url=%2Fimages%2Fteam%2Facdlite.jpg&amp;w=828&amp;q=75 828w, /_next/image?url=%2Fimages%2Fteam%2Facdlite.jpg&amp;w=1080&amp;q=75 1080w, /_next/image?url=%2Fimages%2Fteam%2Facdlite.jpg&amp;w=1200&amp;q=75 1200w, /_next/image?url=%2Fimages%2Fteam%2Facdlite.jpg&amp;w=1920&amp;q=75 1920w, /_next/image?url=%2Fimages%2Fteam%2Facdlite.jpg&amp;w=2048&amp;q=75 2048w, /_next/image?url=%2Fimages%2Fteam%2Facdlite.jpg&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=%2Fimages%2Fteam%2Facdlite.jpg&amp;w=3840&amp;q=75"/><img alt="Andrew Clark" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" sizes="100vw" srcSet="/_next/image?url=%2Fimages%2Fteam%2Facdlite.jpg&amp;w=640&amp;q=75 640w, /_next/image?url=%2Fimages%2Fteam%2Facdlite.jpg&amp;w=750&amp;q=75 750w, /_next/image?url=%2Fimages%2Fteam%2Facdlite.jpg&amp;w=828&amp;q=75 828w, /_next/image?url=%2Fimages%2Fteam%2Facdlite.jpg&amp;w=1080&amp;q=75 1080w, /_next/image?url=%2Fimages%2Fteam%2Facdlite.jpg&amp;w=1200&amp;q=75 1200w, /_next/image?url=%2Fimages%2Fteam%2Facdlite.jpg&amp;w=1920&amp;q=75 1920w, /_next/image?url=%2Fimages%2Fteam%2Facdlite.jpg&amp;w=2048&amp;q=75 2048w, /_next/image?url=%2Fimages%2Fteam%2Facdlite.jpg&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=%2Fimages%2Fteam%2Facdlite.jpg&amp;w=3840&amp;q=75"/>Andrew ClarkEngineer at VercelAndrew got started with web development by making sites with WordPress, and eventually tricked himself into doing JavaScript. His favorite pastime is karaoke. Andrew is either a Disney villain or a Disney princess, depending on the day.acdliteacdlite acdlite <img alt="Dan Abramov" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" sizes="100vw" srcSet="/_next/image?url=%2Fimages%2Fteam%2Fgaearon.jpg&amp;w=640&amp;q=75 640w, /_next/image?url=%2Fimages%2Fteam%2Fgaearon.jpg&amp;w=750&amp;q=75 750w, /_next/image?url=%2Fimages%2Fteam%2Fgaearon.jpg&amp;w=828&amp;q=75 828w, /_next/image?url=%2Fimages%2Fteam%2Fgaearon.jpg&amp;w=1080&amp;q=75 1080w, /_next/image?url=%2Fimages%2Fteam%2Fgaearon.jpg&amp;w=1200&amp;q=75 1200w, /_next/image?url=%2Fimages%2Fteam%2Fgaearon.jpg&amp;w=1920&amp;q=75 1920w, /_next/image?url=%2Fimages%2Fteam%2Fgaearon.jpg&amp;w=2048&amp;q=75 2048w, /_next/image?url=%2Fimages%2Fteam%2Fgaearon.jpg&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=%2Fimages%2Fteam%2Fgaearon.jpg&amp;w=3840&amp;q=75"/><img alt="Dan Abramov" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" sizes="100vw" srcSet="/