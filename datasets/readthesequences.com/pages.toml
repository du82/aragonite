["https://www.readthesequences.com/AffectiveDeathSpirals"]
title = "Affective Death Spirals"
full_description = "Many, many, many are the flaws in human reasoning which lead us to overestimate how well our beloved theory explains the facts. The phlogiston theory of chemistry could explain just about anything, so long as it didn’t have to predict it in advance. And the more phenomena you use your favored theory to explain, the truer your favored theory seems—has it not been confirmed by these many observations? As the theory seems truer, you will be more likely to question evidence that conflicts with it. As the favored theory seems more general, you will seek to use it in more explanations. If you know anyone who believes that Belgium secretly controls the US banking system, or that they can use an invisible blue spirit force to detect available parking spaces, that’s probably how they got started. This positive feedback cycle of credulity and confirmation is indeed fearsome, and responsible for much error, both in science and in everyday life. But it’s nothing compared to the death spiral that begins with a charge of positive affect—a thought that feels really good. A new political system that can save the world. A great leader, strong and noble and wise. An amazing tonic that can cure upset stomachs and cancer. Heck, why not go for all three? A great cause needs a great leader. A great leader should be able to brew up a magical tonic or two. The halo effect is that any perceived positive characteristic (such as attractiveness or strength) increases perception of any other positive characteristic (such as intelligence or courage). Even when it makes no sense, or less than no sense. Positive characteristics enhance perception of every other positive characteristic? That sounds a lot like how a fissioning uranium atom sends out neutrons that fission other uranium atoms. Weak positive affect is subcritical; it doesn’t spiral out of control. An attractive person seems more honest, which, perhaps, makes them seem more attractive; but the effective neutron multiplication factor is less than one. Metaphorically speaking. The resonance confuses things a little, but then dies out."
year_published = 2025
clearnet = "https://www.readthesequences.com/AffectiveDeathSpirals"
tags = ["affective", "death", "spirals"]
