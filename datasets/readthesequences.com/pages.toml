["https://www.readthesequences.com/Joint-Configurations"]
title = "Joint Configurations"
full_description = "The key to understanding configurations, and hence the key to understanding quantum mechanics, is realizing on a truly gut level that configurations are about more than one particle. Continuing from the previous essay, Figure 1 shows an altered version of the experiment where we send in two photons toward D at the same time, from the sources B and C. And remember, the rule of the half-silvered mirror (at D) is that a right-angle deflection multiplies by i, and a straight line multiplies by 1. So the amplitude flows from the starting configuration, separately considering the four cases of deflection/non-deflection of each photon, are: Now—and this is a very important and fundamental idea in quantum mechanics—the amplitudes in cases 1 and 4 are flowing to the same configuration. Whether the B photon and C photon both go straight, or both are deflected, the resulting configuration is one photon going toward E and another photon going toward F. So we add up the two incoming amplitude flows from case 1 and case 4, and get a total amplitude of (1 + 0i) + (−1 + 0i) = 0. When we wave our magic squared-modulus-ratio reader over the three final configurations, we’ll find that “two photons at Detector 1” and “two photons at Detector 2” have the same squared modulus, but “a photon at Detector 1 and a photon at Detector 2” has squared modulus zero. Way up at the level of experiment, we never find Detector 1 and Detector 2 both going off. We’ll find Detector 1 going off twice, or Detector 2 going off twice, with equal frequency. (Assuming I’ve gotten the math and physics right. I didn’t actually perform the experiment.) The configuration’s identity is not, “the B photon going toward E and the C photon going toward F. ” Then the resultant configurations in case 1 and case 4 would not be equal. Case 1 would be, “B photon to E, C photon to F” and case 4 would be “B photon to F, C photon to E.” These would be two distinguishable configurations, if configurations had photon-tracking structure."
year_published = 2025
clearnet = "https://www.readthesequences.com/Joint-Configurations"
