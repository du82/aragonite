["https://www.readthesequences.com/ChurchVsTaskforce"]
title = "Church vs. Taskforce"
full_description = "I am generally suspicious of envying crazy groups or trying to blindly copycat the rhythm of religion—what I called “hymns to the nonexistence of God,” replying, “A good ‘atheistic hymn’ is simply a song about anything worth singing about that doesn’t happen to be religious.” But religion does fill certain holes in people’s minds, some of which are even worth filling. If you eliminate religion, you have to be aware of what gaps are left behind. If you suddenly deleted religion from the world, the largest gap left would not be anything of ideals or morals; it would be the church, the community. Among those who now stay religious without quite really believing in God— how many are just sticking to it from wanting to stay with their neighbors at the church, and their family and friends? How many would convert to atheism, if all those others deconverted, and that were the price of staying in the community and keeping its respect? I would guess… probably quite a lot. In truth… this is probably something I don’t understand all that well, myself. “Brownies and babysitting” were the first two things that came to mind. Do churches lend helping hands in emergencies? Or just a shoulder to cry on? How strong is a church community? It probably depends on the church, and in any case, that’s not the correct question. One should start by considering what a hunter-gatherer band gives its people, and ask what’s missing in modern life—if a modern First World church fills only some of that, then by all means let us try to do better. So without copycatting religion—without assuming that we must gather every Sunday morning in a building with stained-glass windows while the children dress up in formal clothes and listen to someone sing—let’s consider how to fill the emotional gap, after religion stops being an option. To help break the mold to start with—the straitjacket of cached thoughts on how to do this sort of thing—consider that some modern offices may also fill the same role as a church. By which I mean that some people are fortunate to receive community from their workplaces: friendly coworkers who bake brownies for the office, whose teenagers can be safely hired for babysitting, and maybe even help in times of catastrophe…? But certainly not everyone is lucky enough to find a community at the office."
