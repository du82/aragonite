["https://www.readthesequences.com/The-Parable-Of-Hemlock"]
title = "The Parable of Hemlock"
full_description = "“Do you suppose,” asked one of the onlookers, “that even hemlock will not be enough to kill so wise and good a man?” “No,” replied another bystander, a student of philosophy; “all men are mortal, and Socrates is a man; and if a mortal drinks hemlock, surely he dies.” “Nonsense,” replied the student, a little sharply; “all men are mortal by definition; it is part of what we mean by the word ‘man.’ All men are mortal, Socrates is a man, therefore Socrates is mortal. It is not merely a guess, but a logical certainty.” “I suppose that’s right…” said the onlooker. “Oh, look, Socrates already drank the hemlock while we were talking.” “Then Socrates must not be a man,” replied the student. “All men are mortal, Socrates is not mortal, therefore Socrates is not a man. And that is not merely a guess, but a logical certainty.” The fundamental problem with arguing that things are true “by definition” is that you can’t make reality go a different way by choosing a different definition. You could reason, perhaps, as follows: “All things I have observed which wear clothing, speak language, and use tools, have also shared certain other properties as well, such as breathing air and pumping red blood. The last thirty ‘humans’ belonging to this cluster whom I observed to drink hemlock soon fell over and stopped moving. Socrates wears a toga, speaks fluent ancient Greek, and drank hemlock from a cup. So I predict that Socrates will keel over in the next five minutes.” But that would be mere guessing. It wouldn’t be, y’know, absolutely and eternally certain. The Greek philosophers—like most prescientific philosophers—were rather fond of certainty. Luckily the Greek philosophers have a crushing rejoinder to your questioning. You have misunderstood the meaning of “All humans are mortal,” they say. It is not a mere observation. It is part of the definition of the word “human.” Mortality is one of several properties that are individually necessary, and together sufficient, to determine membership in the class “human.” The statement “All humans are mortal” is a logically valid truth, absolutely unquestionable. And if Socrates is human, he must be mortal: it is a logical deduction, as certain as certain can be."
