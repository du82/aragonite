["https://www.readthesequences.com/Explaining-Vs-Explaining-Away"]
title = "Explaining vs. Explaining Away"
full_description = "… Do not all charms flyAt the mere touch of cold philosophy?There was an awful rainbow once in heaven:We know her woof, her texture; she is givenIn the dull catalogue of common things.Philosophy will clip an Angel’s wings,Conquer all mysteries by rule and line,Empty the haunted air, and gnomed mine—Unweave a rainbow… My usual reply ends with the phrase: “If we cannot learn to take joy in the merely real, our lives will be empty indeed.” I shall expand on that later. Tracing back the chain of causality, step by step, I discover that my belief that I’m wearing socks is fully explained by the fact that I’m wearing socks… On the other hand, if I see a mirage of a lake in the desert, the correct causal explanation of my vision does not involve the fact of any actual lake in the desert. In this case, my belief in the lake is not just explained, but explained away. If reductionism is correct, then even your belief in reductionism is just the mere result of the motion of molecules—why should I listen to anything you say? The key word, in the above, is mere; a word which implies that accepting reductionism would explain away all the reasoning processes leading up to my acceptance of reductionism, the way that an optical illusion is explained away. But you can explain how a cognitive process works without its being “mere”! My belief that I’m wearing socks is a mere result of my visual cortex reconstructing nerve impulses sent from my retina which received photons reflected off my socks… which is to say, according to scientific reductionism, my belief that I’m wearing socks is a mere result of the fact that I’m wearing socks. What could be going on in the anti-reductionists’ minds, such that they would put rainbows and belief-in-reductionism in the same category as haunts and gnomes? Several things are going on simultaneously. But for now let’s focus on the basic idea introduced in a previous essay: The Mind Projection Fallacy between a multi-level map and a mono-level territory."
