["https://www.readthesequences.com/The-Argument-From-Common-Usage"]
title = "The Argument from Common Usage"
full_description = "Albert: “Look, suppose that I left a microphone in the forest and recorded the pattern of the acoustic vibrations of the tree falling. If I played that back to someone, they’d call it a ‘sound’! That’s the common usage! Don’t go around making up your own wacky definitions!” Barry: “One, I can define a word any way I like so long as I use it consistently. Two, the meaning I gave was in the dictionary. Three, who gave you the right to decide what is or isn’t common usage?” Not all definitional disputes progress as far as recognizing the notion of common usage. More often, I think, someone picks up a dictionary because they believe that words have meanings, and the dictionary faithfully records what this meaning is. Some people even seem to believe that the dictionary determines the meaning—that the dictionary editors are the Legislators of Language. Maybe because back in elementary school, their authority-teacher said that they had to obey the dictionary, that it was a mandatory rule rather than an optional one? Dictionary editors read what other people write, and record what the words seem to mean; they are historians. The Oxford English Dictionary may be comprehensive, but never authoritative. But surely there is a social imperative to use words in a commonly understood way? Does not our human telepathy, our valuable power of language, rely on mutual coordination to work? Perhaps we should voluntarily treat dictionary editors as supreme arbiters—even if they prefer to think of themselves as historians—in order to maintain the quiet cooperation on which all speech depends. The phrase “authoritative dictionary” is almost never used correctly, an example of proper usage being The Authoritative Dictionary of ieee Standards Terms. The ieee is a body of voting members who have a professional need for exact agreement on terms and definitions, and so The Authoritative Dictionary of IEEE Standards Terms is actual, negotiated legislation, which exerts whatever authority one regards as residing in the IEEE."
