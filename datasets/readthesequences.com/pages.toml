["https://www.readthesequences.com/How-To-Seem-And-Be-Deep"]
title = "How to Seem (and Be) Deep"
full_description = "I recently attended a discussion group whose topic, at that session, was Death. It brought out deep emotions. I think that of all the Silicon Valley lunches I’ve ever attended, this one was the most honest; people talked about the death of family, the death of friends, what they thought about their own deaths. People really listened to each other. I wish I knew how to reproduce those conditions reliably. I was the only transhumanist present, and I was extremely careful not to be obnoxious about it. (“A fanatic is someone who can’t change his mind and won’t change the subject.” I endeavor to at least be capable of changing the subject.) Unsurprisingly, people talked about the meaning that death gives to life, or how death is truly a blessing in disguise. But I did, very cautiously, explain that transhumanists are generally positive on life but thumbs down on death. Afterward, several people came up to me and told me I was very “deep.” Well, yes, I am, but this got me thinking about what makes people seem deep. At one point in the discussion, a woman said that thinking about death led her to be nice to people because, who knows, she might not see them again. “When I have a nice thing to say about someone,” she said, “now I say it to them right away, instead of waiting.” “That is a beautiful thought,” I said, “and even if someday the threat of death is lifted from you, I hope you will keep on doing it—” At another point in the discussion, a man spoke of some benefit X of death, I don’t recall exactly what. And I said: “You know, given human nature, if people got hit on the head by a baseball bat every week, pretty soon they would invent reasons why getting hit on the head with a baseball bat was a good thing. But if you took someone who wasn’t being hit on the head with a baseball bat, and you asked them if they wanted it, they would say no. I think that if you took someone who was immortal, and asked them if they wanted to die for benefit X, they would say no.”"
