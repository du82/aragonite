["https://www.readthesequences.com/A-Priori"]
title = "A Priori"
full_description = "Traditional Rationality is phrased as social rules, with violations interpretable as cheating: if you break the rules and no one else is doing so, you’re the first to defect—making you a bad, bad person. To Bayesians, the brain is an engine of accuracy: if you violate the laws of rationality, the engine doesn’t run, and this is equally true whether anyone else breaks the rules or not. Consider the problem of Occam’s Razor, as confronted by Traditional philosophers. If two hypotheses fit the same observations equally well, why believe the simpler one is more likely to be true? You could argue that Occam’s Razor has worked in the past, and is therefore likely to continue to work in the future. But this, itself, appeals to a prediction from Occam’s Razor. “Occam’s Razor works up to October 8th, 2027 and then stops working thereafter” is more complex, but it fits the observed evidence equally well. You could argue that Occam’s Razor is a reasonable distribution on prior probabilities. But what is a “reasonable” distribution? Why not label “reasonable” a very complicated prior distribution, which makes Occam’s Razor work in all observed tests so far, but generates exceptions in future cases? Indeed, it seems there is no way to justify Occam’s Razor except by appealing to Occam’s Razor, making this argument unlikely to convince any judge who does not already accept Occam’s Razor. (What’s special about the words I italicized?) If you are a philosopher whose daily work is to write papers, criticize other people’s papers, and respond to others’ criticisms of your own papers, then you may look at Occam’s Razor and shrug. Here is an end to justifying, arguing and convincing. You decide to call a truce on writing papers; if your fellow philosophers do not demand justification for your un-arguable beliefs, you will not demand justification for theirs. And as the symbol of your treaty, your white flag, you use the phrase “a priori truth.”"
