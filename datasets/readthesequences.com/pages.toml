["https://www.readthesequences.com/An-Especially-Elegant-Evolutionary-Psychology-Experiment"]
title = "An Especially Elegant Evolutionary Psychology Experiment"
full_description = "In a 1989 Canadian study, adults were asked to imagine the death of children of various ages and estimate which deaths would create the greatest sense of loss in a parent. The results, plotted on a graph, show grief growing until just before adolescence and then beginning to drop. When this curve was compared with a curve showing changes in reproductive potential over the life cycle (a pattern calculated from Canadian demographic data), the correlation was fairly strong. But much stronger—nearly perfect, in fact—was the correlation between the grief curves of these modern Canadians and the reproductive-potential curve of a hunter-gatherer people, the !Kung of Africa. In other words, the pattern of changing grief was almost exactly what a Darwinian would predict, given demographic realities in the ancestral environment. The first correlation was 0.64, the second an extremely high 0.92 (N = 221). The most obvious inelegance of this study, as described, is that it was conducted by asking human adults to imagine parental grief, rather than asking real parents with children of particular ages. (Presumably that would have cost more / allowed fewer subjects.) However, my understanding is that the results here squared well with the data from closer studies of parental grief that were looking for other correlations (i.e., a raw correlation between parental grief and child age). The parental grief is not even subconsciously about reproductive value—otherwise it would update for Canadian reproductive value instead of !Kung reproductive value. Grief is an adaptation that now simply exists, real in the mind and continuing under its own inertia. Parents do not care about children for the sake of their reproductive contribution. Parents care about children for their own sake; and the non-cognitive, evolutionary-historical reason why such minds exist in the universe in the first place is that children carry their parents’ genes. Indeed, evolution is the reason why there are any minds in the universe at all. So you can see why I’d want to draw a sharp line through my cynicism about ulterior motives at the evolutionary-cognitive boundary; otherwise, I might as well stand up in a supermarket checkout line and say, “Hey! You’re only correctly processing visual information while bagging my groceries in order to maximize your inclusive genetic fitness!”"
year_published = 2025
clearnet = "https://www.readthesequences.com/An-Especially-Elegant-Evolutionary-Psychology-Experiment"
