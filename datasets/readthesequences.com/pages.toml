["https://www.readthesequences.com/The-Parable-Of-The-Dagger"]
title = "The Parable of the Dagger"
full_description = "Either this box contains an angry frog, or the box with a false inscription contains an angry frog, but not both. Either this box contains gold and the box with a false inscription contains an angry frog, or this box contains an angry frog and the box with a true inscription contains gold. And the jester said to the king: “One box contains an angry frog, the other box gold; and one, and only one, of the inscriptions is true.” “You see,” the jester said, “let us hypothesize that the first inscription is the true one. Then suppose the first box contains gold. Then the other box would have an angry frog, while the box with a true inscription would contain gold, which would make the second statement true as well. Now hypothesize that the first inscription is false, and that the first box contains gold. Then the second inscription would be—” “One box contains a key,” said the king, “to unlock your chains; and if you find the key you are free. But the other box contains a dagger for your heart if you fail.” The jester reasoned thusly: “Suppose the first inscription is true. Then the second inscription must also be true. Now suppose the first inscription is false. Then again the second inscription must be true. So the second box must contain the key, if the first inscription is true, and also if the first inscription is false. Therefore, the second box must logically contain the key.” “It is entirely possible,” replied the king. “I merely wrote those inscriptions on two boxes, and then I put the dagger in the second one.” Raymond M. Smullyan, What Is the Name of This Book?: The Riddle of Dracula and Other Logical Puzzles (Penguin Books, 1990). ↩︎"
year_published = 2025
