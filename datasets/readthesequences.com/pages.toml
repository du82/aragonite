["https://www.readthesequences.com/BewareOfOtherOptimizing"]
title = "Beware of Other-Optimizing"
full_description = "I’ve noticed a serious problem in which aspiring rationalists vastly overestimate their ability to optimize other people’s lives. And I think I have some idea of how the problem arises. You read nineteen different webpages advising you about personal improvement—productivity, dieting, saving money. And the writers all sound bright and enthusiastic about Their Method, they tell tales of how it worked for them and promise amazing results… But most of the advice rings so false as to not even seem worth considering. So you sigh, mournfully pondering the wild, childish enthusiasm that people can seem to work up for just about anything, no matter how silly. Pieces of advice #4 and #15 sound interesting, and you try them, but… they don’t… quite… well, it fails miserably. The advice was wrong, or you couldn’t do it, and either way you’re not any better off. And then you read the twentieth piece of advice—or even more, you discover a twentieth method that wasn’t in any of the pages—and stars above it actually works this time. At long, long last you have discovered the real way, the right way, the way that actually works. And when someone else gets into the sort of trouble you used to have—well, this time you know how to help them. You can save them all the trouble of reading through nineteen useless pieces of advice and skip directly to the correct answer. As an aspiring rationalist you’ve already learned that most people don’t listen, and you usually don’t bother—but this person is a friend, someone you know, someone you trust and respect to listen. And so you put a comradely hand on their shoulder, look them straight in the eyes, and tell them how to do it. I, personally, get quite a lot of this. Because you see… when you’ve discovered the way that really works… well, you know better by now than to run out and tell your friends and family. But you’ve got to try telling Eliezer Yudkowsky. He needs it, and there’s a pretty good chance that he’ll understand."
