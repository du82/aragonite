["https://www.readthesequences.com/Beautiful-Probability"]
title = "Beautiful Probability"
full_description = "Should we expect rationality to be, on some level, simple? Should we search and hope for underlying beauty in the arts of belief and choice? Let me introduce this issue by borrowing a complaint of the late great Bayesian Master, E. T. Jaynes:1 Two medical researchers use the same treatment independently, in different hospitals. Neither would stoop to falsifying the data, but one had decided beforehand that because of finite resources he would stop after treating n = 100 patients, however many cures were observed by then. The other had staked his reputation on the efficacy of the treatment, and decided he would not stop until he had data indicating a rate of cures definitely greater than 60%, however many patients that might require. But in fact, both stopped with exactly the same data: n = 100 [patients], r = 70 [cures]. Should we then draw different conclusions from their experiments?” [Presumably the two control groups also had equal results.] Cyan directs us to chapter 37 of MacKay’s excellent statistics book, free online, for a more thorough explanation of this problem.2 According to old-fashioned statistical procedure—which I believe is still being taught today—the two researchers have performed different experiments with different stopping conditions. The two experiments could have terminated with different data, and therefore represent different tests of the hypothesis, requiring different statistical analyses. It’s quite possible that the first experiment will be “statistically significant,” the second not. Whether or not you are disturbed by this says a good deal about your attitude toward probability theory, and indeed, rationality itself. Non-Bayesian statisticians might shrug, saying, “Well, not all statistical tools have the same strengths and weaknesses, y’know—a hammer isn’t like a screwdriver—and if you apply different statistical tools you may get different results, just like using the same data to compute a linear regression or train a regularized neural network. You’ve got to use the right tool for the occasion. Life is messy—”"
year_published = 2025
clearnet = "https://www.readthesequences.com/Beautiful-Probability"
tags = ["beautiful", "probability"]
