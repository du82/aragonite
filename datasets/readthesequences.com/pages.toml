["https://www.readthesequences.com/Fake-Reductionism"]
title = "Fake Reductionism"
full_description = "There was an awful rainbow once in heaven:We know her woof, her texture; she is givenIn the dull catalogue of common things. I am guessing—though it is only a guess—that Keats himself did not know the woof and texture of the rainbow. Not the way that Newton understood rainbows. Perhaps not even at all. Maybe Keats just read, somewhere, that Newton had explained the rainbow as “light reflected from raindrops”— —which was actually known in the thirteenth century. Newton only added a refinement by showing that the light was decomposed into colored parts, rather than transformed in color. But that put rainbows back in the news headlines. And so Keats, with Charles Lamb and William Wordsworth and Benjamin Haydon, drank “confusion to the memory of Newton” because “he destroyed the poetry of the rainbow by reducing it to a prism.” That’s one reason to suspect Keats didn’t understand the subject too deeply. I am guessing, though it is only a guess, that Keats could not have sketched out on paper why rainbows only appear when the Sun is behind your head, or why the rainbow is an arc of a circle. If so, Keats had a Fake Explanation. In this case, a fake reduction. He’d been told that the rainbow had been reduced, but it had not actually been reduced in his model of the world. This is another of those distinctions that anti-reductionists fail to get—the difference between professing the flat fact that something is reducible, and seeing it. In this, the anti-reductionists are not too greatly to be blamed, for it is part of a general problem. I’ve written before on seeming knowledge that is not knowledge, and beliefs that are not about their supposed objects but only recordings to recite back in the classroom, and words that operate as stop signs for curiosity rather than answers, and technobabble that only conveys membership in the literary genre of “science”… There is a very great distinction between being able to see where the rainbow comes from, and playing around with prisms to confirm it, and maybe making a rainbow yourself by spraying water droplets—"
year_published = 2025
