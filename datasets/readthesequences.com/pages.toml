["https://www.readthesequences.com/HighChallenge"]
title = "High Challenge"
full_description = "There’s a class of prophecy that runs: “In the Future, machines will do all the work. Everything will be automated. Even labor of the sort we now consider ‘intellectual,’ like engineering, will be done by machines. We can sit back and own the capital. You’ll never have to lift a finger, ever again.” No; they can play computer games—not like our games, of course, but much more advanced and entertaining. Yet wait! If you buy a modern computer game, you’ll find that it contains some tasks that are—there’s no kind word for this—effortful. (I would even say “difficult,” with the understanding that we’re talking about something that takes ten minutes, not ten years.) So in the future, we’ll have programs that help you play the game—taking over if you get stuck on the game, or just bored; or so that you can play games that would otherwise be too advanced for you. But isn’t there some wasted effort, here? Why have one programmer working to make the game harder, and another programmer to working to make the game easier? Why not just make the game easier to start with? Since you play the game to get gold and experience points, making the game easier will let you get more gold per unit time: the game will become more fun. So this is the ultimate end of the prophecy of technological progress—just staring at a screen that says “You Win,” forever. The world of machines that do all the work—well, I don’t want to say it’s “analogous to the Christian Heaven” because it isn’t supernatural; it’s something that could in principle be realized. Religious analogies are far too easily tossed around as accusations… But, without implying any other similarities, I’ll say that it seems analogous in the sense that eternal laziness “sounds like good news” to your present self who still has to work. And as for playing games, as a substitute—what is a computer game except synthetic work? Isn’t there a wasted step here? (And computer games in their present form, considered as work, have various aspects that reduce stress and increase engagement; but they also carry costs in the form of artificiality and isolation.)"
year_published = 2025
