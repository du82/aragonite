["https://www.readthesequences.com/PurchaseFuzziesAndUtilonsSeparately"]
title = "Purchase Fuzzies and Utilons Separately"
full_description = "There is this very, very old puzzle/observation in economics about the lawyer who spends an hour volunteering at the soup kitchen, instead of working an extra hour and donating the money to hire someone… If the lawyer needs to work an hour at the soup kitchen to keep themselves motivated and remind themselves why they’re doing what they’re doing, that’s fine. But they should also be donating some of the hours they worked at the office, because that is the power of professional specialization. One might consider the check as buying the right to volunteer at the soup kitchen, or validating the time spent at the soup kitchen. More on this later. I hold open doors for little old ladies. I can’t actually remember the last time this happened literally (though I’m sure it has, sometime in the last year or so). But within the last month, say, I was out on a walk and discovered a station wagon parked in a driveway with its trunk completely open, giving full access to the car’s interior. I looked in to see if there were packages being taken out, but this was not so. I looked around to see if anyone was doing anything with the car. And finally I went up to the house and knocked, then rang the bell. And yes, the trunk had been accidentally left open. Under other circumstances, this would be a simple act of altruism, which might signify true concern for another’s welfare, or fear of guilt for inaction, or a desire to signal trustworthiness to oneself or others, or finding altruism pleasurable. I think that these are all perfectly legitimate motives, by the way; I might give bonus points for the first, but I wouldn’t deduct any penalty points for the others. Just so long as people get helped. But in my own case, since I already work in the nonprofit sector, the further question arises as to whether I could have better employed the same sixty seconds in a more specialized way, to bring greater benefit to others. That is: can I really defend this as the best use of my time, given the other things I claim to believe?"
