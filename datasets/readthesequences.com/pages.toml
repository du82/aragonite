["https://www.readthesequences.com/ASenseThatMoreIsPossible"]
title = "A Sense That More Is Possible"
full_description = "To teach people about a topic you’ve labeled “rationality,” it helps for them to be interested in “rationality.” (There are less direct ways to teach people how to attain the map that reflects the territory, or optimize reality according to their values; but the explicit method is the course I tend to take.) And when people explain why they’re not interested in rationality, one of the most commonly proffered reasons tends to be like: “Oh, I’ve known a couple of rational people and they didn’t seem any happier.” Who are they thinking of? Probably an Objectivist or some such. Maybe someone they know who’s an ordinary scientist. Or an ordinary atheist. Even if you limit yourself to people who can derive Bayes’s Theorem—which is going to eliminate, what, 98% of the above personnel?—that’s still not a whole lot of rationality. I mean, it’s a pretty basic theorem. Since the beginning I’ve had a sense that there ought to be some discipline of cognition, some art of thinking, the studying of which would make its students visibly more competent, more formidable: the equivalent of Taking a Level in Awesome. But when I look around me in the real world, I don’t see that. Sometimes I see a hint, an echo, of what I think should be possible, when I read the writings of folks like Robyn Dawes, Daniel Gilbert, John Tooby, and Leda Cosmides. A few very rare and very senior researchers in psychological sciences, who visibly care a lot about rationality—to the point, I suspect, of making their colleagues feel uncomfortable, because it’s not cool to care that much. I can see that they’ve found a rhythm, a unity that begins to pervade their arguments— Even among those few who impress me with a hint of dawning formidability—I don’t think that their mastery of rationality could compare to, say, John Conway’s mastery of math. The base knowledge that we drew upon to build our understanding—if you extracted only the parts we used, and not everything we had to study to find it—it’s probably not comparable to what a professional nuclear engineer knows about nuclear engineering. It may not even be comparable to what a construction engineer knows about bridges. We practice our skills, we do, in the ad-hoc ways we taught ourselves; but that practice probably doesn’t compare to the training regimen an Olympic runner goes through, or maybe even an ordinary professional tennis player."
