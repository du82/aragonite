["https://www.readthesequences.com/Amazing-Breakthrough-Day-April-First"]
title = "Amazing Breakthrough Day: April 1st"
full_description = "As I argued in The Beauty of Settled Science, it is a major problem that media coverage of science focuses only on breaking news. Breaking news, in science, occurs at the furthest fringes of the scientific frontier, which means that the new discovery is often: People never get to see the solid stuff, let alone the understandable stuff, because it isn’t breaking news. On Amazing Breakthrough Day, I propose, journalists who really care about science can report—under the protective cover of April 1st—such important but neglected science stories as: Note that every one of these headlines are true—they describe events that did, in fact, happen. They just didn’t happen yesterday. There have been many humanly understandable amazing breakthroughs in the history of science, that can be understood without a PhD or even a BSc. The operative word here is history. Think of Archimedes’s “Eureka!” when he understood the relation between the water a ship displaces, and the reason the ship floats. This is far enough back in scientific history that you don’t need to know fifty other discoveries to understand the theory; it can be explained in a couple of graphs; anyone can see how it’s useful; and the confirming experiments can be duplicated in your own bathtub. Modern science is built on discoveries built on discoveries built on discoveries and so on all the way back to Archimedes. Reporting science only as breaking news is like wandering into a movie three-fourths of the way through, writing a story about “Bloody-handed man kisses girl holding gun!” and wandering back out again. Then point out that Reddit and Digg don’t link only to breaking news. They also link to short webpages that give good explanations of old science. Readers vote it up, and that should tell you something. Explain that if your newspaper doesn’t change to look more like Reddit, you’ll have to start selling drugs to make payroll. Editors love to hear that sort of thing, right? On the Internet, a good new explanation of old science is news and it spreads like news. Why couldn’t the science sections of newspapers work the same way? Why isn’t a new explanation worth reporting on?"
year_published = 2025
