["https://www.readthesequences.com/TheDesignSpaceOfMindsInGeneral"]
title = "The Design Space of Minds-in-General"
full_description = "People ask me, “What will Artificial Intelligences be like? What will they do? Tell us your amazing story about the future.” ATP synthase is a molecular machine—one of three known occasions when evolution has invented the freely rotating wheel—that is essentially the same in animal mitochondria, plant chloroplasts, and bacteria. ATP synthase has not changed significantly since the rise of eukaryotic life two billion years ago. It’s something we all have in common—thanks to the way that evolution strongly conserves certain genes; once many other genes depend on a gene, a mutation will tend to break all the dependencies. Any two AI designs might be less similar to each other than you are to a petunia. Asking what “AIs” will do is a trick question because it implies that all AIs form a natural class. Humans do form a natural class because we all share the same brain architecture. But when you say “Artificial Intelligence,” you are referring to a vastly larger space of possibilities than when you say “human.” When people talk about “AIs” we are really talking about minds-in-general, or optimization processes in general. Having a word for “AI” is like having a word for everything that isn’t a duck. All humans, of course, fit into a tiny little dot—as a sexually reproducing species, we can’t be too different from one another. This tiny dot belongs to a wider ellipse, the space of transhuman mind designs—things that might be smarter than us, or much smarter than us, but that in some sense would still be people as we understand people. This transhuman ellipse is within a still wider volume, the space of posthuman minds, which is everything that a transhuman might grow up into. And then the rest of the sphere is the space of minds-in-general, including possible Artificial Intelligences so odd that they aren’t even posthuman. But wait—natural selection designs complex artifacts and selects among complex strategies. So where is natural selection on this map?"
year_published = 2025
