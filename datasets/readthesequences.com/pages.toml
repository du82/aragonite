["https://www.readthesequences.com/Is-Humanism-A-Religion-Substitute"]
title = "Is Humanism a Religion Substitute?"
full_description = "For many years before the Wright Brothers, people dreamed of flying with magic potions. There was nothing irrational about the raw desire to fly. There was nothing tainted about the wish to look down on a cloud from above. Only the “magic potions” part was irrational. Suppose you were to put me into an fMRI scanner, and take a movie of my brain’s activity levels, while I watched a space shuttle launch. (Wanting to visit space is not “realistic,” but it is an essentially lawful dream—one that can be fulfilled in a lawful universe.) The fMRI might—maybe, maybe not—resemble the f MRI of a devout Christian watching a nativity scene. Should an experimenter obtain this result, there’s a lot of people out there, both Christians and some atheists, who would gloat: “Ha, ha, space travel is your religion!” But that’s drawing the wrong category boundary. It’s like saying that, because some people once tried to fly by irrational means, no one should ever enjoy looking out of an airplane window on the clouds below. If a rocket launch is what it takes to give me a feeling of aesthetic transcendence, I do not see this as a substitute for religion. That is theomorphism—the viewpoint from gloating religionists who assume that everyone who isn’t religious has a hole in their mind that wants filling. Now, to be fair to the religionists, this is not just a gloating assumption. There are atheists who have religion-shaped holes in their minds. I have seen attempts to substitute atheism or even transhumanism for religion. And the result is invariably awful. Utterly awful. Absolutely abjectly awful. When someone sets out to write an atheistic hymn—“Hail, oh unintelligent universe,” blah, blah, blah—the result will, without exception, suck. Why? Because they’re being imitative. Because they have no motivation for writing the hymn except a vague feeling that since churches have hymns, they ought to have one too. And, on a purely artistic level, that puts them far beneath genuine religious art that is not an imitation of anything, but an original expression of emotion."
year_published = 2025
