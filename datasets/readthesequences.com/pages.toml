["https://www.readthesequences.com/RaisingTheSanityWaterline"]
title = "Raising the Sanity Waterline"
full_description = "To paraphrase the Black Belt Bayesian: Behind every exciting, dramatic failure, there is a more important story about a larger and less dramatic failure that made the first failure possible. If every trace of religion were magically eliminated from the world tomorrow, then—however much improved the lives of many people would be—we would not even have come close to solving the larger failures of sanity that made religion possible in the first place. We have good cause to spend some of our efforts on trying to eliminate religion directly, because it is a direct problem. But religion also serves the function of an asphyxiated canary in a coal mine—religion is a sign, a symptom, of larger problems that don’t go away just because someone loses their religion. Consider this thought experiment—what could you teach people that is not directly about religion, that is true and useful as a general method of rationality, which would cause them to lose their religions? In fact—imagine that we’re going to go and survey all your students five years later, and see how many of them have lost their religions compared to a control group; if you make the slightest move at fighting religion directly, you will invalidate the experiment. You may not make a single mention of religion or any religious belief in your classroom; you may not even hint at it in any obvious way. All your examples must center about real-world cases that have nothing to do with religion. If you can’t fight religion directly, what do you teach that raises the general waterline of sanity to the point that religion goes underwater? Here are some such topics I’ve already covered—not avoiding all mention of religion, but it could be done: Suppose we have a scientist who’s still religious, either full-blown scriptural-religion, or in the sense of tossing around vague casual endorsements of “spirituality.” When you consider it—these are all rather basic matters of study, as such things go. A quick introduction to all of them (well, except naturalistic metaethics) would be… a four-credit undergraduate course with no prerequisites?"
year_published = 2025
