["https://www.readthesequences.com/Empty-Labels"]
title = "Empty Labels"
full_description = "Consider (yet again) the Aristotelian idea of categories. Let’s say that there’s some object with properties A, B, C, D, and E, or at least it looks E-ish. Me: “In Aristotelian logic, it’s not supposed to make a difference what the properties are, or what I call them. That’s why I’m just using the letters.” Next, I invent the Aristotelian category “zawa,” which describes those objects, all those objects, and only those objects, that have properties A, C, and D. Then I add another word, “yokie,” which describes all and only objects that are B and E; and the word “xippo,” which describes all and only objects which are E but not D. Impressive, isn’t it? Let’s invent even more new words: “Bolo” is A, C, and yokie; “mun” is A, C, and xippo; and “merlacdonian” is bolo and mun. And the thing to remember about the Aristotelian idea of categories is that [A, C, D] is the entire information of “zawa.” It’s not just that I can vary the label, but that I can get along just fine without any label at all—the rules for Aristotelian classes work purely on structures like [A, C, D]. To call one of these structures “zawa,” or attach any other label to it, is a human convenience (or inconvenience) which makes not the slightest difference to the Aristotelian rules. Let’s say that “human” is to be defined as a mortal featherless biped. Then the classic syllogism would have the form: Here the illusion of inference comes from the labels, which conceal the premises, and pretend to novelty in the conclusion. Replacing labels with definitions reveals the illusion, making visible the tautology’s empirical unhelpfulness. You can never say that Socrates is a [mortal, ¬feathers, biped] until you have observed him to be mortal. There’s an idea, which you may have noticed I hate, that “you can define a word any way you like.” This idea came from the Aristotelian notion of categories; since, if you follow the Aristotelian rules exactly and without flaw—which humans never do; Aristotle knew perfectly well that Socrates was human, even though that wasn’t justified under his rules—but, if some imaginary nonhuman entity were to follow the rules exactly, they would never arrive at a contradiction. They wouldn’t arrive at much of anything: they couldn’t say that Socrates is a [mortal, ¬feathers, biped] until they observed him to be mortal."
