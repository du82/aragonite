["https://www.readthesequences.com/ShutUpAndDoTheImpossible"]
title = "Shut Up and Do the Impossible!"
full_description = "The virtue of tsuyoku naritai, “I want to become stronger,” is to always keep improving—to do better than your previous failures, not just humbly confess them. Yet there is a level higher than tsuyoku naritai. This is the virtue of isshokenmei, “make a desperate effort.” All-out, as if your own life were at stake. “In important matters, a ‘strong’ effort usually only results in mediocre results.” And there is a level higher than isshokenmei. This is the virtue I called “make an extraordinary effort.” To try in ways other than what you have been trained to do, even if it means doing something different from what others are doing, and leaving your comfort zone. Even taking on the very real risk that attends going outside the System. I have already written somewhat on this subject, in On Doing the Impossible. My younger self used to whine about this a lot: “You can’t develop a precise theory of intelligence the way that there are precise theories of physics. It’s impossible! You can’t prove an AI correct. It’s impossible! No human being can comprehend the nature of morality—it’s impossible! No human being can comprehend the mystery of subjective experience! It’s impossible!” What legitimizes this strange message is that the word “impossible” does not usually refer to a strict mathematical proof of impossibility in a domain that seems well-understood. If something seems impossible merely in the sense of “I see no way to do this” or “it looks so difficult as to be beyond human ability”—well, if you study it for a year or five, it may come to seem less impossible than in the moment of your snap initial judgment. But the principle is more subtle than this. I do not say just, “Try to do the impossible,” but rather, “Shut up and do the impossible!” For my illustration, I will take the least impossible impossibility that I have ever accomplished, namely the AI-Box Experiment. The AI-Box Experiment, for those of you who haven’t yet read about it, had its genesis in the Nth time someone said to me: “Why don’t we build an AI, and then just keep it isolated in the computer, so that it can’t do any harm?”"
