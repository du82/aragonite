["https://www.readthesequences.com/Is-Reality-Ugly"]
title = "Is Reality Ugly?"
full_description = "Consider the cubes, {1, 8, 27, 64, 125, … }. Their first differences {7, 19, 37, 61, … } might at first seem to lack an obvious pattern, but taking the second differences {12, 18, 24, … } takes you down to the simply related level. Taking the third differences {6, 6, … } brings us to the perfectly stable level, where chaos dissolves into order. But this is a handpicked example. Perhaps the “messy real world” lacks the beauty of these abstract mathematical objects? Perhaps it would be more appropriate to talk about neuroscience or gene expression networks? Abstract math, being constructed solely in imagination, arises from simple foundations—a small set of initial axioms—and is a closed system; conditions that might seem unnaturally conducive to neatness. Which is to say: In pure math, you don’t have to worry about a tiger leaping out of the bushes and eating Pascal’s Triangle. Strange that people ask this. I mean, the question might have been sensible two and a half millennia ago… Back when the Greek philosophers were debating what this “real world” thingy might be made of, there were many positions. Heraclitus said, “All is fire.” Thales said, “All is water.” Pythagoras said, “All is number.” Beneath the complex forms and shapes of the surface world, there is a simple level, an exact and stable level, whose laws we name “physics.” This discovery, the Great Surprise, has already taken place at our point in human history—but it does not do to forget that it was surprising. Once upon a time, people went in search of underlying beauty, with no guarantee of finding it; and once upon a time, they found it; and now it is a known thing, and taken for granted. Then why can’t we predict the location of every tiger in the bushes as easily as we predict the sixth cube? I count three sources of uncertainty even within worlds of pure math—two obvious sources, and one not so obvious. The first source of uncertainty is that even a creature of pure math, living embedded in a world of pure math, may not know the math. Humans walked the Earth long before Galileo/Newton/Einstein discovered the law of gravity that prevents us from being flung off into space. You can be governed by stable fundamental rules without knowing them. There is no law of physics which says that laws of physics must be explicitly represented, as knowledge, in brains that run under them."
year_published = 2025
clearnet = "https://www.readthesequences.com/Is-Reality-Ugly"
tags = ["reality", "ugly?"]
