["https://www.readthesequences.com/HelplessIndividuals"]
title = "Helpless Individuals"
full_description = "When you consider that our grouping instincts are optimized for 50-person hunter-gatherer bands where everyone knows everyone else, it begins to seem miraculous that modern-day large institutions survive at all. Well—there are governments with specialized militaries and police, which can extract taxes. That’s a non-ancestral idiom which dates back to the invention of sedentary agriculture and extractible surpluses; humanity is still struggling to deal with it. There are corporations in which the flow of money is controlled by centralized management, a non-ancestral idiom dating back to the invention of large-scale trade and professional specialization. And in a world with large populations and close contact, memes evolve far more virulent than the average case of the ancestral environment; memes that wield threats of damnation, promises of heaven, and professional priest classes to transmit them. But by and large, the answer to the question “How do large institutions survive?” is “They don’t!” The vast majority of large modern-day institutions—some of them extremely vital to the functioning of our complex civilization—simply fail to exist in the first place. I first realized this as a result of grasping how Science gets funded: namely, not by individual donations. Science traditionally gets funded by governments, corporations, and large foundations. I’ve had the opportunity to discover firsthand that it’s amazingly difficult to raise money for Science from individuals. Not unless it’s science about a disease with gruesome victims, and maybe not even then. Why? People are, in fact, prosocial; they give money to, say, puppy pounds. Science is one of the great social interests, and people are even widely aware of this—why not Science, then? Any particular science project—say, studying the genetics of trypanotolerance in cattle—is not a good emotional fit for individual charity. Science has a long time horizon that requires continual support. The interim or even final press releases may not sound all that emotionally arousing. You can’t volunteer; it’s a job for specialists. Being shown a picture of the scientist you’re supporting at or somewhat below the market price for their salary lacks the impact of being shown the wide-eyed puppy that you helped usher to a new home. You don’t get the immediate feedback and the sense of immediate accomplishment that’s required to keep an individual spending their own money."
year_published = 2025
