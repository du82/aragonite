["https://www.readthesequences.com/The-Logical-Fallacy-Of-Generalization-From-Fictional-Evidence"]
title = "The Logical Fallacy of Generalization from Fictional Evidence"
full_description = "When I try to introduce the subject of advanced AI, what’s the first thing I hear, more than half the time? And I reply, “Well, no, not exactly. I try to avoid the logical fallacy of generalizing from fictional evidence.” Some people get it right away, and laugh. Others defend their use of the example, disagreeing that it’s a fallacy. What’s wrong with using movies or novels as starting points for the discussion? No one’s claiming that it’s true, after all. Where is the lie, where is the rationalist sin? Science fiction represents the author’s attempt to visualize the future; why not take advantage of the thinking that’s already been done on our behalf, instead of starting over? Not every misstep in the precise dance of rationality consists of outright belief in a falsehood; there are subtler ways to go wrong. First, let us dispose of the notion that science fiction represents a full-fledged rational attempt to forecast the future. Even the most diligent science fiction writers are, first and foremost, storytellers; the requirements of storytelling are not the same as the requirements of forecasting. As Nick Bostrom points out:1 When was the last time you saw a movie about humankind suddenly going extinct (without warning and without being replaced by some other civilization)? While this scenario may be much more probable than a scenario in which human heroes successfully repel an invasion of monsters or robot warriors, it wouldn’t be much fun to watch. So there are specific distortions in fiction. But trying to correct for these specific distortions is not enough. A story is never a rational attempt at analysis, not even with the most diligent science fiction writers, because stories don’t use probability distributions. I illustrate as follows: Bob Merkelthud slid cautiously through the door of the alien spacecraft, glancing right and then left (or left and then right) to see whether any of the dreaded Space Monsters yet remained. At his side was the only weapon that had been found effective against the Space Monsters, a Space Sword forged of pure titanium with 30% probability, an ordinary iron crowbar with 20% probability, and a shimmering black discus found in the smoking ruins of Stonehenge with 45% probability, the remaining 5% being distributed over too many minor outcomes to list here."
