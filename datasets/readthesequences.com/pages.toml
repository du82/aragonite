["https://www.readthesequences.com/FinalWords"]
title = "Final Words"
full_description = "Sunlight enriched air already alive with curiosity, as dawn rose on Brennan and his fellow students in the place to which Jeffreyssai had summoned them. They sat there and waited, the five, at the top of the great glassy crag that was sometimes called Mount Mirror, sometimes Mount Monastery, and more often simply left unnamed. The high top and peak of the mountain, from which you could see all the lands below and seas beyond. (Well, not all the lands below, nor seas beyond. So far as anyone knew, there was no place in the world from which all the world was visible; nor, equivalently, any kind of vision that would see through all obstacle-horizons. In the end it was the top only of one particular mountain: there were other peaks, and from their tops you would see other lands below; even though, in the end, it was all a single world.) “What do you think comes next?” said Hiriwa. Her eyes were bright, and she gazed to the far horizons like a lord. Taji shrugged, though his own eyes were alive with anticipation. “Jeffreyssai’s last lesson doesn’t have any obvious sequel that I can think of. In fact, I think we’ve learned just about everything that I knew the beisutsukai masters knew. What’s left, then—” Styrlyn wasn’t smiling. Brennan suspected rather strongly that Styrlyn was older than he had admitted. Brennan wasn’t smiling either. He might be young, but he kept high company, and had witnesssed some of what went on behind the curtains of the world. Secrets had their price, always; that was the barrier that made them secrets. And Brennan thought he had a good idea of what this price might be. There was a cough from behind them, at a moment when they had all happened to be looking in any other direction but that one. Jeffreyssai stood there, in a casual robe that looked more like very glassy glass than any proper sort of mirrorweave. Jeffreyssai stood there and looked at them, a strange abiding sorrow in those inscrutable ancient eyes. “Sen… sei,” Taji started, faltering as that bright anticipation stumbled over Jeffreyssai’s return look. “What’s next?”"
