["https://www.readthesequences.com/Bind-Yourself-To-Reality"]
title = "Bind Yourself to Reality"
full_description = "So perhaps you’re reading all this, and asking: “Yes, but what does this have to do with reductionism?” Partially, it’s a matter of leaving a line of retreat. It’s not easy to take something important apart into components, when you’re convinced that this removes magic from the world, unweaves the rainbow. I do plan to take certain things apart, in this book; and I prefer not to create pointless existential anguish. Partially, it’s the crusade against Hollywood Rationality, the concept that understanding the rainbow subtracts its beauty. The rainbow is still beautiful plus you get the beauty of physics. But even more deeply, it’s one of these subtle hidden-core-of-rationality things. You know, the sort of thing where I start talking about “the Way.” It’s about binding yourself to reality. In one of Frank Herbert’s Dune books, if I recall correctly, it is said that a Truthsayer gains their ability to detect lies in others by always speaking truth themselves, so that they form a relationship with the truth whose violation they can feel. It wouldn’t work, but I still think it’s one of the more beautiful thoughts in fiction. At the very least, to get close to the truth, you have to be willing to press yourself up against reality as tightly as possible, without flinching away, or sneering down. You can see the bind-yourself-to-reality theme in Lotteries: A Waste of Hope. Understanding that lottery tickets have negative expected utility does not mean that you give up the hope of being rich. It means that you stop wasting that hope on lottery tickets. You put the hope into your job, your school, your startup, your eBay sideline; and if you truly have nothing worth hoping for, then maybe it’s time to start looking. It’s not dreams I object to, only impossible dreams. The lottery isn’t impossible, but it is an un-actionable near-impossibility. It’s not that winning the lottery is extremely difficult—requires a desperate effort—but that work isn’t the issue."
year_published = 2025
