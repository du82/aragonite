["https://www.readthesequences.com/Hand-Vs-Fingers"]
title = "Hand vs. Fingers"
full_description = "Back to our original topic: Reductionism and the Mind Projection Fallacy. There can be emotional problems in accepting reductionism, if you think that things have to be fundamental to be fun. But this position commits us to never taking joy in anything more complicated than a quark, and so I prefer to reject it. To review, the reductionist thesis is that we use multi-level models for computational reasons, but physical reality has only a single level. Here I’d like to pose the following conundrum: When you pick up a cup of water, is it your hand that picks it up? Recently, however, scientists have made a stunning discovery: It’s not your hand that holds the cup, it’s actually your fingers, thumb, and palm. Yes, I know! I was shocked too. But it seems that after scientists measured the forces exerted on the cup by each of your fingers, your thumb, and your palm, they found there was no force left over—so the force exerted by your hand must be zero. The theme here is that, if you can see how (not just know that) a higher level reduces to a lower one, they will not seem like separate things within your map; you will be able to see how silly it is to think that your fingers could be in one place, and your hand somewhere else; you will be able to see how silly it is to argue about whether it is your hand that picks up the cup, or your fingers. The operative word is “see,” as in concrete visualization. Imagining your hand causes you to imagine the fingers and thumb and palm; conversely, imagining fingers and thumb and palm causes you to identify a hand in the mental picture. Thus the high level of your map and the low level of your map will be tightly bound together in your mind. In reality, of course, the levels are bound together even tighter than that— bound together by the tightest possible binding: physical identity. You can see this: You can see that saying (1) “hand” or (2) “fingers and thumb and palm,” does not refer to different things, but different points of view."
year_published = 2025
clearnet = "https://www.readthesequences.com/Hand-Vs-Fingers"
tags = ["fingers", "hand"]
