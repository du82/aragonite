["https://www.readthesequences.com/Belief-In-Self-Deception"]
title = "Belief in Self-Deception"
full_description = "I spoke of my conversation with a nominally Orthodox Jewish woman who vigorously defended the assertion that she believed in God, while seeming not to actually believe in God at all. While I was questioning her about the benefits that she thought came from believing in God, I introduced the Litany of Tarski—which is actually an infinite family of litanies, a specific example being: “I didn’t think it was,” I replied to her. “I’m just asking—assuming that God does not exist, and this is known, then should you still believe in God?” She hesitated. She seemed to really be trying to think about it, which surprised me. I thought at the time that she was having difficulty allowing herself to visualize the world where God does not exist, because of her attachment to a God-containing world. Now, however, I suspect she was having difficulty visualizing a contrast between the way the world would look if God existed or did not exist, because all her thoughts were about her belief in God, but her causal network modelling the world did not contain God as a node. So she could easily answer “How would the world look different if I didn’t believe in God?,” but not “How would the world look different if there was no God?” She didn’t answer that question, at the time. But she did produce a counterexample to the Litany of Tarski: I tried to explain that if you say, “People are bad,” that means you believe people are bad, and if you say, “I believe people are nice,” that means you believe you believe people are nice. So saying “People are bad and I believe people are nice” means you believe people are bad but you believe you believe people are nice. If there were a verb meaning “to believe falsely,” it would not have any significant first person, present indicative. She said, smiling, “Yes, I believe people are nicer than, in fact, they are. I just thought I should put it that way for you.” “I reckon Granny ought to have a good look at you, Walter,” said Nanny. “I reckon your mind’s all tangled up like a ball of string what’s been dropped.”"
