["https://www.readthesequences.com/Einsteins-Superpowers"]
title = "Einstein’s Superpowers"
full_description = "There is a widespread tendency to talk (and think) as if Einstein, Newton, and similar historical figures had superpowers—something magical, something sacred, something beyond the mundane. (Remember, there are many more ways to worship a thing than lighting candles around its altar.) Once I unthinkingly thought this way too, with respect to Einstein in particular, until reading Julian Barbour’s The End of Time cured me of it.1 Barbour laid out the history of anti-epiphenomenal physics and Mach’s Principle; he described the historical controversies that predated Mach—all this that stood behind Einstein and was known to Einstein, when Einstein tackled his problem… And maybe I’m just imagining things—reading too much of myself into Barbour’s book—but I thought I heard Barbour very quietly shouting, coded between the polite lines: What Einstein did isn’t magic, people! If you all just looked at how he actually did it, instead of falling to your knees and worshiping him, maybe then you’d be able to do it too! (Barbour did not actually say this. It does not appear in the book text. It is not a Julian Barbour quote and should not be attributed to him. Thank you.) Maybe I’m mistaken, or extrapolating too far… but I kinda suspect that Barbour once tried to explain to people how you move further along Einstein’s direction to get timeless physics; and they sniffed scornfully and said, “Oh, you think you’re Einstein, do you?” 10 points for each favorable comparison of yourself to Einstein, or claim that special or general relativity are fundamentally misguided (without good evidence). 30 points for suggesting that Einstein, in his later years, was groping his way towards the ideas you now advocate. Barbour never bothers to compare himself to Einstein, of course; nor does he ever appeal to Einstein in support of timeless physics. I mention these items on the Crackpot Index by way of showing how many people compare themselves to Einstein, and what society generally thinks of them."
year_published = 2025
