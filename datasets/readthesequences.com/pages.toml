["https://www.readthesequences.com/Joy-In-The-Merely-Real-Sequence"]
title = "Joy in the Merely Real - Sequence"
full_description = "We humans are, after all, built out of inhuman parts. The world of atoms looks nothing like the world as we ordinarily think of it, and certainly looks nothing like the world’s conscious denizens as we ordinarily think of them. … Mere Reality collects seven sequences of essays on this topic. The first three introduce the question of how the human world relates to the world revealed by physics: “Lawful Truth” (on the basic links between physics and human cognition), “Reductionism 101” (on the project of scientifically explaining phenomena), and “Joy in the Merely Real” [this sequence] (on the emotional, personal significance of the scientific world-view)."
