["https://www.readthesequences.com/TheTruePrisonersDilemma"]
title = "The True Prisoner’s Dilemma"
full_description = "Player 1, and Player 2, can each choose C or D. Player 1’s and Player 2’s utilities for the final outcome are given by the first and second number in the pair. For reasons that will become apparent, “C” stands for “cooperate” and D stands for “defect.” Observe that a player in this game (regarding themselves as the first player) has this preference ordering over outcomes: (D,C) > (C,C) > (D,D) > (C,D). Option D, it would seem, dominates C: If the other player chooses C, you prefer (D,C) to (C,C); and if the other player chooses D, you prefer (D,D) to (C,D). So you wisely choose D, and as the payoff table is symmetric, the other player likewise chooses D. If only you’d both been less wise! You both prefer (C,C) to (D,D). That is, you both prefer mutual cooperation to mutual defection. The Prisoner’s Dilemma is one of the great foundational issues in decision theory, and enormous volumes of material have been written about it. Which makes it an audacious assertion of mine, that the usual way of visualizing the Prisoner’s Dilemma has a severe flaw, at least if you happen to be human. The classic visualization of the Prisoner’s Dilemma is as follows: you are a criminal, and you and your confederate in crime have both been captured by the authorities. Independently, without communicating, and without being able to change your mind afterward, you have to decide whether to give testimony against your confederate (D) or remain silent (C). Both of you, right now, are facing one-year prison sentences; testifying (D) takes one year off your prison sentence, and adds two years to your confederate’s sentence. Or maybe you and some stranger are, only once, and without knowing the other player’s history or finding out who the player was afterward, deciding whether to play C or D, for a payoff in dollars matching the standard chart. And, oh yes—in the classic visualization you’re supposed to pretend that you’re entirely selfish, that you don’t care about your confederate criminal, or the player in the other room."
