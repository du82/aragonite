["https://www.readthesequences.com/Chaotic-Inversion"]
title = "Chaotic Inversion"
full_description = "I was recently having a conversation with some friends on the topic of hour-by-hour productivity and willpower maintenance—something I’ve struggled with my whole life. I can avoid running away from a hard problem the first time I see it (perseverance on a timescale of seconds), and I can stick to the same problem for years; but to keep working on a timescale of hours is a constant battle for me. It goes without saying that I’ve already read reams and reams of advice; and the most help I got from it was realizing that a sizable fraction of other creative professionals had the same problem, and couldn’t beat it either, no matter how reasonable all the advice sounds. “What do you do when you can’t work?” my friends asked me. (Conversation probably not accurate, this is a very loose gist.) “Well,” they said, “if you know you can’t work for a while, you should watch a movie or something.” “Unfortunately,” I replied, “I have to do something whose time comes in short units, like browsing the Web or watching short videos, because I might become able to work again at any time, and I can’t predict when—” I’d always thought of my workcycle as something chaotic, something unpredictable. I never used those words, but that was the way I treated it. But here my friends seemed to be implying—what a strange thought—that other people could predict when they would become able to work again, and structure their time accordingly. And it occurred to me for the first time that I might have been committing that damned old chestnut the Mind Projection Fallacy, right out there in my ordinary everyday life instead of high abstraction. Maybe it wasn’t that my productivity was unusually chaotic; maybe I was just unusually stupid with respect to predicting it. That’s what inverted stupidity looks like—chaos. Something hard to handle, hard to grasp, hard to guess, something you can’t do anything with. It’s not just an idiom for high abstract things like Artificial Intelligence. It can apply in ordinary life too."
year_published = 2025
