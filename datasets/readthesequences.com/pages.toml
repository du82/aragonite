["https://www.readthesequences.com/UseTheTryHarderLuke"]
title = "Use the Try Harder, Luke"
full_description = "I first watched Star Wars IV-VI when I was very young. Seven, maybe, or nine? So my memory was dim, but I recalled Luke Skywalker as being, you know, this cool Jedi guy. Imagine my horror and disappointment when I watched the saga again, years later, and discovered that Luke was a whiny teenager. I mention this because yesterday, I looked up, on Youtube, the source of the Yoda quote: “Do, or do not. There is no try.” I present to you a little-known outtake from the scene, in which the director and writer, George Lucas, argues with Mark Hamill, who played Luke Skywalker: Luke raises his hand, and slowly, the X-wing begins to rise out of the water—Yoda’s eyes widen—but then the ship sinks again. Mark: “This is the hero who’s going to take down the Empire? Look, it was one thing when he was a whiny teenager at the beginning, but he’s in Jedi training now. Last movie he blew up the Death Star. Luke should be showing a little backbone.” George: “No. You give up. And then Yoda lectures you for a while, and you say, ‘You want the impossible.’ Can you remember that?” Mark: “Impossible? What did he do, run a formal calculation to arrive at a mathematical proof? The X-wing was already starting to rise out of the swamp! That’s the feasibility demonstration right there! Luke loses it for a second and the ship sinks back—and now he says it’s impossible? Not to mention that Yoda, who’s got literally eight hundred years of seniority in the field, just told him it should be doable—” Mark: “It’s his friggin’ spaceship! If he leaves it in the swamp, he’s stuck on Dagobah for the rest of his miserable life! He’s not just going to walk away! Look, let’s just cut to the next scene with the words ‘one month later’ and Luke is still raggedly standing in front of the swamp, trying to raise his ship for the thousandth time—” Mark: “Fine! We’ll show a sunset and a sunrise, as he stands there with his arm out, straining, and then Luke says ‘It’s impossible.’ Though really, he ought to try again when he’s fully rested—”"
