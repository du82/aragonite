["https://www.readthesequences.com/Professing-And-Cheering"]
title = "Professing and Cheering"
full_description = "I once attended a panel on the topic, “Are science and religion compatible?” One of the women on the panel, a pagan, held forth interminably upon how she believed that the Earth had been created when a giant primordial cow was born into the primordial abyss, who licked a primordial god into existence, whose descendants killed a primordial giant and used its corpse to create the Earth, etc. The tale was long, and detailed, and more absurd than the Earth being supported on the back of a giant turtle. And the speaker clearly knew enough science to know this. I still find myself struggling for words to describe what I saw as this woman spoke. She spoke with… pride? Self-satisfaction? A deliberate flaunting of herself ? The woman went on describing her creation myth for what seemed like forever, but was probably only five minutes. That strange pride/​satisfaction/​flaunting clearly had something to do with her knowing that her beliefs were scientifically outrageous. And it wasn’t that she hated science; as a panelist she professed that religion and science were compatible. She even talked about how it was quite understandable that the Vikings talked about a primordial abyss, given the land in which they lived—explained away her own religion!— and yet nonetheless insisted this was what she “believed,” said with peculiar satisfaction. I’m not sure that Daniel Dennett’s concept of “belief in belief” stretches to cover this event. It was weirder than that. She didn’t recite her creation myth with the fanatical faith of someone who needs to reassure herself. She didn’t act like she expected us, the audience, to be convinced—or like she needed our belief to validate her. Dennett, in addition to suggesting belief in belief, has also suggested that much of what is called “religious belief ” should really be studied as “religious profession.” Suppose an alien anthropologist studied a group of postmod- ernist English students who all seemingly believed that Wulky Wilkensen was a post-utopian author. The appropriate question may not be “Why do the students all believe this strange belief?” but “Why do they all write this strange sentence on quizzes?” Even if a sentence is essentially meaningless, you can still know when you are supposed to chant the response aloud."
