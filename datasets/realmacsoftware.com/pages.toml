description = "RapidWeaver release notes, including links to download every version of RapidWeaver since 2004."
full_description = '''We’ve fine-tuned Classic with essential bug fixes and enhanced overall stability. Most of these updates are behind the scenes, but here’s a quick summary of the more visible improvements to keep everything running smoothly. We have another great update for you today. This release has fixed some minor issue, and is an essential update for all users. We have another great update for you today. This release has fixed some long-standing issues, tidied up a few things under-the-hood, and continues to improve stability. In this release we’ve improved the code around project saving by adding additional checks to ensure the data being saved is valid and accessible. In the event that a bad or missing file is detected, the user will be notified and asked to email Realmac support. A special thanks to Multithemes for providing two new themes for this release. Visit Multithemes for more great RapidWeaver addons. This is a recommend update for all users as it contains many under the hood fixes and improvements. Happy Weaving! Projects saved in 7.1 are NOT backwards compatible with 7.0.4 or earlier versions of RapidWeaver. Please back-up your projects before Installing this update. New Theme API: RGBA support for theme colours is now supported by using this new key "RWSupportsAlphaInColours" within the "RWThemeCapabilities" dictionary. After more than a year in development we're thrilled to be able to finally say that, RapidWeaver 7.0 is here. Thanks to everyone for their support during the beta program and all our loyal RapidWeaver users around the world. If you need to use RapidWeaver 6 to convert or upgrade any old projects you can do so using this license number: RMSD58-F492A0-46144B-2AEC49-BC67CF-7884CZ-J6P6CF-XW7H4U-QFMQEB-BU9URJ-BMFW6G-LDHX6K-VJ67YJ-S54WYE-ASAF5E-VQB8MA-PBRAYV-AJ83B2-8PH2Y8-ZEWTCY-RGP5N2-UKXJJT-G7YHHF-72AJXC-4K8U92-FKQYK9-FZ3HSQ-5LHHNU-D2GFBU-PKDYUC-6H9EDD-T6MU9R-2HKK99-FWNNPV-B5M74Q-2RCAKK-W6RVSF-AGVUJ6-SLSE2H-MQXCKG RapidWeaver now adds a creation date in any source images added to a project that lack a creation date.'''
