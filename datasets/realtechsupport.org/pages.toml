["https://realtechsupport.org/projects/logicsplanetarycomputing.html"]
title = "REALTECHSUPPORT"
full_description = "Just as large language models now impact the production of text, spatially explicit artificial intelligence models stand to alter our perception of landscape and change the way we understand planet Earth. On the Logics of Planetary Computing focuses on one specific context of planetary computing fueled by the recent expansion of private sector remote sensing in the Alas Mertajati in Central Bali, Indonesia. Topically, I target the integration of geography and artificial intelligence, GeoAI, as a prime theater of planetary computing. Technically, I place the inquiry within the confluence of multispectral, high-resolution satellite sensor data, geographic information systems, and landscape analysis at various levels of computational intensity. Across these lines of inquiry, the project attempts to expand the nascent GeoAI discourse within critical technology studies. The AI installation invites you to explore this new space, and to experience how the choices of the analyst impact the analysis with an appreciation for the power and limits of GeoAI. Acknowledgements This project was supported in part by a Mellon Fellowship from the National Endowment for the Humanities."
year_published = 2025
