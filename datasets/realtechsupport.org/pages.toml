["https://realtechsupport.org/projects/g.html"]
title = "REALTECHSUPPORT"
full_description = "This work was a bet between the author and quantum gravity research. The bet consisted in claiming that the author could walk far enough on a pair of custom designed shoes to erase the classic Newtonian formulation of gravity inscribed in the soles before the quantization of gravity could be finalized and integrated into the other main forces (strong and weak atomic force, electromagnetic force). Newton’s Law of Gravitation (carved into the shoe soles) describes the attraction force of two bodies separated by the distance R. G is the constant of gravitation. For the purpose of this experiment, the two bodies are the shoe owner and the planet earth."
