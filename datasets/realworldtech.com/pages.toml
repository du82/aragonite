["https://www.realworldtech.com/page/2"]
title = "Real World Tech"
full_description = "What’s Next for Moore’s Law? For Intel, III+V = 10nm QWFETsApril 21, 2015 by David KanterOn the eve of the 50th anniversary of Moore’s Law, the future of silicon CMOS is an open question. With rising costs and uncertain benefits, some semiconductor companies have questioned the wisdom of pursuing further scaling. I predict that Intel’s 10nm process technology will use Quantum Well FETs (QWFETs) with a 3D fin geometry, InGaAs for the NFET channel, and strained Germanium for the PFET channel, enabling lower voltage and more energy efficient transistors in 2016, and the rest of the industry will follow suit at the 7nm node.Read MoreDiscuss (73 comments)Adaptive Clocking in AMD’s SteamrollerMay 6, 2014 by David KanterMy favorite paper from the ISSCC processor session describes an adaptive clocking technique implemented in AMD’s 28nm Steamroller core that compensates for power supply noise. Initial results show a 10-20% decrease in power consumption from reducing the voltage, with no loss in performance. This elegant technique is likely to be adopted across AMD’s entire product line including GPUs, x86 CPUs, ARM-based CPUs, and other critical blocks in highly integrated SoCs.Read MoreDiscuss (12 comments)AMD’s Jaguar MicroarchitectureApril 1, 2014 by David KanterPages: 1 2 3 4 5 6 7Jaguar is AMD’s first 28nm processor, a compact 3.1mm2 design that targets 2-25W devices. It is a derivative of the earlier 40nm Bobcat, a fully out-of-order two issue design, with significant improvements in instruction set architecture and implementation. Some of the highlights include support for AVX, wider 128-bit datapaths, and a higher performance L2 cache. Jaguar is already shipping in several AMD SoCs targeted at tablets, notebooks, microservers, and desktops. However, it is far more prominent as the CPU powering the Sony Playstation 4 and Microsoft Xbox One.Read More (7 pages)Discuss (86 comments)Splitting my time between MPR and RWTMarch 10, 2014 by David KanterAs of January, 2014 I joined the Linley Group as an analyst and senior editor of the Microprocessor Report (MPR), where I am responsible for PC and server processors, and will be lending a hand with graphics, power management, and mobile devices. I will continue to write shorter articles at RWT and share my thoughts on the industry, but in a fashion that does not conflict with my editorial responsibilities. I will also continue to provide consulting to the industry focusing on intellectual property, as well as technical and competitive analysis.Read MoreDiscuss (12 comments)Knights Landing DetailsJanuary 2, 2014 by David KanterPages: 1 2The 14nm Knights Landing leverages Intel’s resources with a laser-like focus on HPC to deliver a massive improvement over the previous generation. The building block of this architecture is a pair of Silvermont-inspired CPUs with wide vector units and most importantly, a brand new cache hierarchy, on-die fabric, and system infrastructure that is shared with Skylake. This article is an in-depth analysis and prediction of the Knights Landing architecture.Read More (2 pages)Discuss (493 comments)Knights Landing CPU SpeculationNovember 18, 2013 by David KanterPages: 1 2 3Knights Landing is Intel’s first clean sheet redesign of the Larrabee family, targeted at throughput computing and manufactured on a 14nm process with products expected in late 2014 or early 2015. The adoption of AVX3, on-package embedded DRAM, and bootable products have been disclosed, but most details are unknown. This article analyzes the options available for the Knights Landing CPU core and explains why Intel’s existing cores are a poor fit for the target workloads, concluding that the most likely outcome is a new custom core for Knights Landing.Read More (3 pages)Discuss (93 comments)Silvermont, Intel’s Low Power ArchitectureMay 6, 2013 by David KanterPages: 1 2 3 4 5 6 7 8Silvermont is Intel’s first CPU core tailored for power efficient applications such as smartphones, tablets, and microservers. The 22nm microarchitecture features updated instruction set extensions, full out-of-order execution with a tightly coupled L2 cache, aggressive power management, and a new high performance SoC fabric. These enhancements deliver tremendous performance and frequency gains over the aging Atom core, putting Intel’s mobile strategy in a more competitive position.Read More (8 pages)Discuss (409 comments)Intel’s Long Awaited Return to the Memory BusinessApril 23, 2013 by David KanterPages: 1 2Graphics is a focal point of the upcoming Haswell platform, necessitating a high bandwidth memory solution. To deliver high performance Intel is returning to the DRAM market, which it exited in 1985. The memory that ships with Haswell will be a custom embedded DRAM mounted in the package and manufactured on a variant of Intel’s 22nm process. By avoiding the commodity memory market, Intel will preserve high margins by cannibalizing discrete GPUs and dedicated graphics memory.Read More (2 pages)Discuss (53 comments)Microservers must Specialize to SurviveJanuary 28, 2013 by David KanterPages: 1 2 3 4The server market is at a potential inflection point, with a new breed of ARM-based microserver vendors challenging the status quo, particularly for cloud computing. We survey 20 modern processors to understand the options for alternative architectures. To achieve disruptive performance, microserver vendors must deeply specialize in particular workloads. However, there is a trade-off between differentiation and market breadth. As the handful of microserver startups are culled to 1-2 viable vendors, only the companies which deliver compelling advantages to significant markets will survive.Read More (4 pages)Discuss (346 comments)Lessons in Technology and Innovation from the iPad 3 Graphics and DisplayJanuary 1, 2013 by David KanterPages: 1 2 3The iPad 3 was an influential and successful tablet, but an excellent example of an unbalanced system. In particular, the superb Retina display was not adequately matched by the GPU of the A5X, and represented a step backwards in terms of graphics capabilities. This article explores the challenges of designing innovative products given the underlying technical constraints, through the lens of the iPad 3 and its successors.Read More (3 pages)Discuss (133 comments)« Previous PageNext Page »"
