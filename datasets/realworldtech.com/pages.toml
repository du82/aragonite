title = "Software - Real World Tech"
full_description = "A Look at SPECpowerMay 12, 2008 by David KanterPages: 1 2 3 4In this article, we take a look at SPECpower – the framework and the benchmark used to measure the intersection of performance and power consumption.Read More (4 pages)Discuss (7 comments)Performance Analysis Tools: A Look at VTuneAugust 6, 2006 by David KanterPages: 1 2 3 4 5It is often said that a programmer’s best friend is a good text editor, and that their best tool is their brain. Recently, I had an opportunity to examine and become familiar with a programmer’s second best tool: a good performance monitor.For many applications, performance can be a critical advantage. Almost any scientific or engineering computing falls into this category, such as crash simulations, or weather modeling. However many desktop applications require good performance: computer games and video encoding are extremely taxing. In the embedded market, performance is likely to be even more important, unlike the general market; systems are not upgraded with faster hardware on a regular basis, and resources are scarce. Many applications, such as cell phones are constrained by thermal and power characteristics, so developers must squeeze out every last bit of performance.Read More (5 pages)Discuss (9 comments)Benchmarking RFCSeptember 5, 2004 by David KanterBenchmarking RFC The practice of benchmarking computer systems and components aspires to be a science, yet all too frequently appears to be an art and a particularly unreliable one at that. The potential pitfalls of benchmarking are myriad: the urge to declare a ‘winner’, atypical workloads and poorly disclosed system settings frequently plague reviews. While […]Read MoreDiscuss (One comment)Wolves in CISC ClothingDecember 28, 2003 by Paul DeMonePages: 1 2 3 4 5 6 7 8 9Paul examines three software emulations for x86.Read More (9 pages)Discuss (18 comments)Interview With Intel’s Compiler TeamJuly 28, 2003 by David KanterPages: 1 2David Kanter and Rob Thorpe interview a member of Intel’s Compiler teamRead More (2 pages)Discuss (43 comments)Coding Challenge IApril 16, 2003 by Dean KentPages: 1 2 3 4 5 6 7 8 9In this article, we provide the results of our first Coding Challenge.Read More (9 pages)Discuss (16 comments)Compilers – Code OptimizationNovember 3, 2002 by Robert ThorpePages: 1 2 3 4 5 6This is the second installment of a three part series on compiler technology and implementation.Read More (6 pages)Discuss (15 comments)Compilers and PerformanceJuly 13, 2002 by Dean KentFor those who may not be familiar with it, COSBI (Comprehensive Open Source Benchmark Initiative) is Van Smith’s effort to wrest control of benchmarking design from the hands of corporate interests and into the hands of the user community (please refer to Van’s Hardware Journal for more information). While this is certainly a laudable goal, it is also fraught with potential problems. Thus, when Van’s Hardware Journal published some preliminary results of the Quick CPU Test, a question that has been nagging me for quite some time was brought to the fore… just how much of an effect do different compilers have on the performance of a program, particularly across platforms?Read MoreDiscuss (18 comments)Winstone Reporting Methodology ExaminedJune 19, 2002 by William CampbellPages: 1 2 3 4 5Bill examines the recommended Winstone reporting methodology, and gives it a poor performance rating.Read More (5 pages)Discuss (16 comments)Compilers – The BasicsApril 19, 2002 by Robert ThorpePages: 1 2 3 4 5 6Rob provides some background on compilers and how they workRead More (6 pages)Discuss (15 comments)« Previous PageNext Page »"
