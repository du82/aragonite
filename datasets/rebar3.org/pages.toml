title = "Releases | Rebar3"
description = """
📘 What are releases and target systems anyway?
 A release is a set of applications needed for booting an Erlang VM and starting your project. This is described through a release resource file (.rel) which is used to generate a .script and .boot. The boot file is the binary form of the script file and is what is used by the Erlang Run-Time System (ERTS) to start an Erlang node, sort of like booting an operating system."""
full_description = '''Documentation Deployment Releases Releases 📘 What are releases and target systems anyway? A release is a set of applications needed for booting an Erlang VM and starting your project. This is described through a release resource file (.rel) which is used to generate a .script and .boot. The boot file is the binary form of the script file and is what is used by the Erlang Run-Time System (ERTS) to start an Erlang node, sort of like booting an operating system. Even running erl on the command line is using a boot script. A target system is an Erlang system capable of being booted on another machine (virtual or otherwise). Often ERTS is bundled along with the target system. For more information, check out the chapter on releases from Adopting Erlang. Getting Started Add a relx section to your project’s rebar.config: {relx, [{release, {<release_name>, <release_vsn>}, [<app>]}, {release, {<release_name>, <release_vsn>}, [<app>]}, {dev_mode, true}, {include_erts, false}, {extended_start_script, true}]}. Running rebar3 release will build the release and provide a script for starting a node under _build/<profile>/rel/<release name>/bin/<release name>. <release_name> must be an atom. <release_vsn> can be one of: Version type Result string() A string is used, as is, for the version. Example: "0.1.0" git | semver Uses the latest git tag on the repo to construct the version. {cmd, string()} Uses the result of executing the contents of string() in a shell. Example to use a file VERSION: {cmd, "cat VERSION | tr -d '[:space:]'"} {git, short | long} Uses either the short (8 characters) or the full Git ref. of the current commit. {file, File} Uses the content of a file. For example, a better way to use a VERSION file than using cmd would be: {file, "VERSION"} Each <app> is an atom of the app name (e.g., myapp), or a tuple. For the tuple syntax of <app>, see App Syntax. You can add multiple release sections to your project’s rebar.config under relx. You can either just specify different releases sharing the same configuration: {relx, [{release, {<release name>, "0.0.1"}, [<app>]}, {release, {<other release name>, "0.1.0"}, [<app>]}, {dev_mode, false}, {include_erts, true}, ]}. Or you can also specify releases with independent configurations by using a 4-tuple release definition: {relx, [{release, {<release name>, "0.0.1"}, [<app>], [{dev_mode, false}, {include_erts, true}]}, {release, {<release name>, "0.1.0"}, [<app>], [{dev_mode, true}]} ]}. You can build specific releases using rebar3 release -n <release_name> Build Configuration App Syntax {release, {myrelease, "0.1.0"}, [<app1>, <app2>]} In a release, each <app> is an atom of the app name, or a tuple with the app name and additional options: % No options specified myapp % All options specified {myapp, "1.1.0", transient, [otherapp]} % Some options specified {myapp, "1.1.0"} {myapp, "1.1.0", transient} {myapp, "1.1.0", [otherapp]} {myapp, transient} {myapp, [otherapp]} {myapp, transient, [otherapp]} In this case, myapp is included in the release, its app version is "1.1.0", its start type is transient, and its list of included apps is [otherapp]. These options directly correspond to the release resource file (.rel): {<app_name>, % atom() <app_vsn>, % string() <start_type>, % permanent | transient | temporary | load | none <included_apps>} % [atom()] Elements after <app_name> may be omitted, as long as the order is preserved. If <app_vsn> is included (uncommon), it must match .app.src. Otherwise, relx determines it from .app.src. The release resource file syntax, repeated below for completeness, makes it so that: <start_type> defaults to permanent. <included_apps> defaults to included_apps from .app.src. If specified, must be a subset included_apps from .app.src. Source Code Inclusion in Release By default, the release will include source files of your applications, if present. If you don’t want to include the source files, set include_src to false. {include_src, false} Application exclusions The following allows you to remove specific applications from the output release. {exclude_apps, [app1, app2]} The Applications will be removed from the .app file of any Application in the release that had them listed under applications. Module exclusions The following directive allows you to remove application modules from the output release. {exclude_modules, [ {app1, [app1_mod1, app1_mod2]}, {app2, [app2_mod1, app2_mod2]} ]}. The modules will be removed from the Application’s .app file’s module list. Modes Other modes include prod and minimal: {relx, [... {mode, <mode>}, ... ] }. Mode Expanded Options dev [{dev_mode, true}, {include_src, true}, {debug_info, keep}, {include_erts, false}] prod [{include_src, false}, {debug_info, strip}, {include_erts, true}, {dev_mode, false}] minimal [{include_src, false}, {debug_info, strip}, {include_erts, false}, {dev_mode, false}] While developing you’ll likely want all your changes to applications be immediately available in the release. relx provides multiple modes, including a mode dev for this particular use case. Instead of copying the applications that make up the release to the release structure it creates symlinks, so compiling and restarting or loading the changed modules is all that is necessary. The prod mode expands to options that are commonly used for production releases: include_src is false, so that source code is not included in the release; debug_info is set to strip, which makes BEAM files smaller and only removes data that is used by tools you more than likely aren’t including in your release; and include_erts is set to true, to bundle in the current Erlang runtime, making a release you can copy to a compatible target and run without first installing Erlang. 📘 Rebar3 Prod Profile When building in the rebar3 prod profile, like with rebar3 as prod release then the relx prod mode is enabled automatically. The minimal mode is the same as prod except it does not include the Erlang runtime. You can override options that the modes expand to by including explicit setting them. For example, if you wanted to keep the debug info in the BEAM modules you can use a configuration like: [ {mode, prod}, {debug_info, keep} ] Verification Checks Missing Functions By default relx will check that the external functions used in the modules of the project applications included in a release exist. This means a warning will be given if a function is called that isn’t included in the release, even if it is a dependency in rebar.config or an application included in OTP. This helps to protect against a common mistake that has bitten us all at some point, forgetting to add an application to the .app.src of the application that depends on it. If for some reason you wish to disable this check you can set it to false in the relx config: {check_for_undefined_functions, false} Stale Modules Option src_tests will issue a warning if the source code for a module is missing or is newer than the object code: {src_tests, true} This is useful to catch any modifications to dependency source files. Since rebar3 release will automatically compile all changes to the Applications in your project, the dependencies should be the only modules that could possibly be stale. Runtime Configuration VM Configuration By default relx will give a basic vm.args file that sets a node name and cookie. For a complete list of options and their use check the Erlang documentation. ## Name of the node -name {{release_name}}@127.0.0.1 ## Cookie for distributed Erlang -setcookie {{release_name}} To provide a custom vm.args or vm.args.src, simply create the file in the top level config/ directory at the root of your project. If you name it something other than vm.args or vm.args.src you must add to the relx configuration: {vm_args, "config/vm_prod.args"} or: {vm_args_src, "config/vm_prod.args.src"} Application Configuration For passing Application configuration at release runtime there is sys.config and sys.config.src: [ {<app_name>, [{<key>, <val>}, ...]} ]. If either file config/sys.config.src or config/sys.config exists in the project then relx will automatically include one of them (.src takes precedence if both exist) in the release. To set a specific file to use as the Application configuration file it can be set with either sys_config or sys_config_src: {sys_config, "config/sys_prod.config"} {sys_config_src, "config/sys_prod.config.src"} The files will be renamed to sys.config or sys.config.src when included into the release. If none exists then a file with an empty list is used. Read more about Erlang configuration in the config docs and in the systools docs. Environment Variable Replacement With OTP-21+ and Rebar3 3.6+ Starting with Erlang/OTP 21 and Rebar3 3.6.0 the configuration options sys_config_src and vm_args_src are available for explicitly including templates that will be rendered at runtime, substituting variables defined as ${VARIABLE} with their equivalent value in the shell environment. Since Rebar3 3.14.0, a default value can be optionally set when using variables by defining them as ${VARIABLE:-DEFAULT}. As of Rebar3 3.14.0 the configs will be included if they exist, so only if the files are not named config/sys.config.src and config/vm.args.src do you need to include {sys_config_src, <filename>} or {vm_args_src, <filename>} in the relx config. %% sys.config.src [ {appname, [ {port, ${PORT:-8080}}, {log_level, ${LOG_LEVEL:-info}}, {log_root, "${LOG_ROOT:-/var/log/appname}"} ]} ]. # vm.args.src -name ${NODE_NAME} %% rebar.config {relx, [{release, {<release name>, "0.0.1"}, [<app>]}, {mode, dev}]}. There is no need to set RELX_REPLACE_OS_VARS=true when using .src files for configuration. In the following section we’ll see older forms of runtime configuration. Before OTP-21 and Rebar3 3.6 By setting RELX_REPLACE_OS_VARS=true both vm.args and sys.config files may contain OS environment variables that will be replaced with the current value from the environment the node is started in. This means a vm.args and sys.config for a release that starts a web server listening on a port could look like: # vm.args -name ${NODE_NAME} %% sys.config [ {appname, [{port, "${PORT}"}]} ]. And then be used to start multiple nodes of the same release with different name. #!/bin/bash export RELX_REPLACE_OS_VARS=true for i in `seq 1 10`; do NODE_NAME=node_$i PORT=808$i _build/default/rel/<release>/bin/<release> foreground & sleep 1 done Overlays: Build-Time Configuration Overlays provide the ability to define files and templates to include in the target system. For example, custom scripts for managing your node or the Procfile needed for running on Heroku. {relx, [ ... {overlay_vars, "vars.config"}, {overlay, [{mkdir, "log/sasl"}, {template, "priv/app.config", "etc/app.config"}, {copy, "Procfile", "Procfile"}]} ]}. The supported actions are: mkdir to create a directory within the release copy to copy a file from a local directory to a location within the release template to behave the way copy does, but with variable expansion in it. Relx’s templating exposes variables along with the full power of a Mustache templating system (see mustache). You can look at the documentation there for the full syntax supported. There is a set of variables made available by default which are described in the next session, and custom variables can otherwise be declared in the file specified in {overlay_vars, "vars.config"}, which should have the following format: %% some variables {key, value}. {other_key, other_val}. %% includes variables from another file "./some_file.config". The default variables are defined below. Predefined Overlay variables Name Description log The current log level in the format of (<logname>:<loglevel>) output_dir The current output directory for the built release target_dir The same as output_dir; exists for backwards compatibility overridden The current list of overridden apps (a list of app names) goals The list of user-specified goals in the system lib_dirs The list of library directories, both user-specified and derived config_file The list of config file used in the system providers The list of provider names used for this run of relx sys_config The location of the sys.config file root_dir The root dir of the current project default_release_name The current default release name for the relx run default_release_version The current default release version for the relx run default_release The current default release for the relx run release_erts_version The version of the Erlang Run-Time System in use erts_vsn The same as release_erts_version (for backwards compatibility) release_name The currently executing release release_version The currently executing version rel_vsn Same as release_version. Exists for backwards compatibility release_applications A list of applications included in the release Splitting configurations It is possible to split overlay files to deal with more complex situations. To explain this lets look at a simplified example. We build our application and want to distinguish between production and developing builds by having the overlay variable build spell out either "prod" or "dev" so the app.config file could include it in its configuration and we can either enable or disable features. For this we build three overlay files: dev.config prod.config base.config For dev builds we will use dev.config as overlay_vars and for prod we will be using prod.config. %% base.config {data_dir, "/data/yolo_app"}. {version, "1.0.0"}. {run_user, "root"}. %% dev.config %% Include the base config "./base.config". %% The build we have {build, "dev"}. %% prod.config %% Include the base config "./base.config". %% The build we have {build, "prod"}. Deployable Tarball With ERTS Included A target system can not have symlinks like those created when using dev_mode and often we want to include ERTS along with the system so it does not need to be previously installed on the target. Rebar3 will automatically add {mode, prod} to the Relx configuration if the prod profile is used to build the release. For example: $ rebar3 as prod tar ===> Verifying dependencies... ===> Analyzing applications... ===> Compiling relx_overlays ===> Assembling release myrel-0.1.0... ===> Release successfully assembled: _build/prod/rel/myrel ===> Building release tarball myrel-0.1.0.tar.gz... ===> Tarball successfully created: _build/prod/rel/myrel/myrel-0.1.0.tar.gz Now a tarball myrel-0.1.0.tar.gz can be copied to another compatible system and booted: $ mkdir myrel $ mv myrel-0.1.0.tar.gz myrel/ $ cd myrel $ tar -zxvf myrel-0.1.0.tar.gz $ bin/myrel console Without ERTS When it is required to leave ERTS out of a release the prod profile configuration can be set in rebar.config under profiles. For example, to use the ERTS and base applications like kernel and stdlib on the target, set mode to minimal and system_libs to false in the relx configuration tuple: {profiles, [{prod, [{relx, [{mode, minimal}, {system_libs, false'''
year_published = 2022
year_updated = 2022
