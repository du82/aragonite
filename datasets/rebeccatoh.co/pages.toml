title = "Why write? – rebeccatoh.co"
description = "Writing sucks (or at least the act of writing does), but I keep doing it anyway. Didn’t the writer Dorothy Parker once say, “I hate writing, I love having written”? She’s a …"
full_description = "Why write? blog, creative work, writing Writing sucks (or at least the act of writing does), but I keep doing it anyway. Didn’t the writer Dorothy Parker once say, “I hate writing, I love having written”? She’s a total kindred spirit. Writing is painful and torturous, but if you are like me, and Parker, you understand the bizarre satisfaction and joy of having written, of having produced words that somehow bring shape to your thoughts and help you build a more solid identity in this sometimes fluid world, in which we are so often lost. Somehow, writing makes me feel more like a person. Or maybe I am already a person, but now I feel like I have told my story, and therefore I am better connected to the larger world outside of me. In other words, I feel less alone. Ever since I started writing regularly on my blog, I have also had a few friends come up to me telling me about how they too would love to start writing or to write more. I do think there is something visceral about writing that draws a certain group of people irresistibly to it. And there’s no denying that in many people, there is this deep need to at least make some kind of noise, so that the world knows of their existence, and then they can feel like they have lived as a main character in this bizarre story of life instead of having just floated past, like a ghost. I am of course talking about myself. Crucially, I also have come to see how necessary writing has become in my growth as both a creative and a human being. And despite the self-doubt (do my thoughts matter?) and the insecurity (who is even reading this?) and the lack of confidence (maybe I should leave the writing to people who are smarter than me!), I feel more and more certain that writing is something I need to do. And certainly, starting to write regularly has been one of the best things I have done for myself in 2017. Not only that, I have a strong feeling that writing consistently will pay off in more ways than I can imagine. How, I have no idea yet. For now, I soldier on. During my short blogging hiatus recently, I have had a lot of time to rethink my reasons for writing. Here are some of them. Writing to learn I’m a learning geek/nerd, and the best way to learn is to teach others. Some people like to learn the French language or American history or astronomy; I like to learn about how to live life to my fullest potential, and how to find true peace and happiness and meaning in my life. When I write about what I have learned – either through the experiences I have had in my own life or through books I have read – my learning solidifies, deepens, becomes a more permanent part of me. (Plus I have such a bad memory, so writing helps me to remember more of my life than my memory is capable of doing…) Writing to understand myself Self-knowledge is key. It is true that sometimes even I don’t know who I am or the reasons behind why I do the things I do. When I write, I open a door into a deeper part of myself. And if I give myself the opportunity to write honestly, without garnishing or covering up, then I also give myself the chance to see myself for who I am. And truly, I think, genuine self-understanding is the path to greater meaning and happiness, because if we don’t know who we are, how can we begin to contemplate how we want to live in this world, or what kind of a life is worth living? These are questions no one can answer except ourselves. And we must start to answer these questions by looking at ourselves honestly, even if it hurts. Writing to organize my thoughts better I’m not a good talker. It’s always hard for me to adequately express what’s in my head when I talk, because unlike writing, I cannot sit down and edit and re-edit and organize and re-organize, which is what I do with my writing. Writing allows me to sort through my thoughts and imbue them with some kind of coherence and clarity. I also sound slightly smarter when I write =] Writing to help and inspire I can’t tell you how many times an article or a book or even a single sentence has helped pull me out of a rut or shine a light through the cracks exactly when I needed it. My personal experience tells me that it is important for people to share their knowledge openly and generously, and writing is a great medium for that. Who knows when you can save a life with just one sentence in one entry on your tiny obscure blog that is read only by 20 people on most days? For me, if I can just make one person’s day brighter, I already have a good enough reason to write. Writing to build a community Ever since I started writing, I have been getting emails and comments and messages from total strangers. They write me to tell me that they are on a similar path to living life on their own terms, or that they have a similar view towards life, or that they appreciate that I have written about my struggles, since they share the same struggles, and I realize: Wow, we are all part of an invisible tribe. As virtual as this tribe is, it is nevertheless real. Writing because it is hard A part of me is stubborn and enjoys challenges a little too much. Writing is challenging. Writing one article a week is even more challenging. But I want to do it anyway because sometimes it’s fun to do things that are hard. And it’s also rewarding, because the harder it is to write, the better I am going to be as a writer as time goes by. It’s like going to the gym, only I am growing writing/thinking muscles rather than actual muscles. Writing because I enjoy writing I know I already said that I find writing to be a rather painful affair, yet it’s also true that I enjoy writing. On good days, the words flow. They come tumbling out of me. Writing becomes easy. But even on days when writing is tough, I do still enjoy doing it. I can’t really explain why, except that maybe it’s… true love? April 27, 2017June 1, 2020 Rebecca Toh"
