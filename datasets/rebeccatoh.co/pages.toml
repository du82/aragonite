full_description = "Reading challenge & Anthony Bourdain blog My reading challenge of 2020 is to read 50 books. I’m only two down. Need to buck up! Halfway through Anthony Bourdain’s “Kitchen Confidential” and Rachel Cusk’s “Outline”. Nowadays my practice is to abandon books quickly. I don’t have enough life to read bad books. Definitely going to finish reading “Kitchen Confidential” but I haven’t decided if Rachel Cusk’s book is good or bad (feels over-written and too literary, which is not a bad thing but not to my taste these days). But Anthony Bourdain… Reading the book made me want to go back to watching Parts Unknown. As much as I love him I haven’t seen every single episode yet. It really is a beautiful and wonderfully made show, with a special something that you cannot put your finger to. Heart? Guts? Honesty? I don’t know. But I love it. His blog in particular is a thing of beauty. I go back to it every once and awhile, just to savor his words. The guy really was a born writer. The world misses him. March 23, 2020March 24, 2020 Rebecca Toh"
