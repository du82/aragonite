title = "Too positive? – rebeccatoh.co"
description = "A friend told me that she finds my writing “too positive”, and the moment she said that, I kind of got what she meant. Looking back at the articles I have written, I get how there just …"
full_description = "Too positive? blog, happiness, mindfulness A friend told me that she finds my writing “too positive”, and the moment she said that, I kind of got what she meant. Looking back at the articles I have written, I get how there just might be a tad too much “life is good and everything is going to be alright” sort of vibe to my writing. So I feel the need to put out a disclaimer today: I am not happy all the time, and life is not all rainbow and fluffy clouds for me 24/7 (and no, I am emphathically not a unicorn). Perhaps I just need to be a better writer so I can more fully express not just the brightness of life, but also its shadows and its dark corners. But my friend’s comment made me think. While it is true that I have bad days and sometimes horrible days, it is also true that generally, I see the world in a positive light. I have my fears and worries and insecurities and sadness, but at my deepest core, I know that there is always a way out of my suffering. It’s this conviction that has led me to work at trying to understand what it takes to be “truly happy”. If I didn’t believe that such a thing were possible, I would not have continued to search for it. And yet I don’t know where this faith or confidence comes from. Could it be that I was born positive? And if it were only a matter of genetics, then aren’t those who are born negative doomed to a life of darkness? I don’t have answers to these questions, but maybe science can offer us some insight. Matthieu Ricard is a Tibetan Buddhist monk who is known as “the world’s happiest man” (although he dislikes the title). He earned this title after a 12-year scientific study, during which he was hooked up to fMRI machines while he meditated. His brain scans showed that whenever he was meditating, areas of his brain would light up with excessive activity, as compared to a normal person. These areas are usually linked to happiness “and a reduced propensity towards negativity”. Years of skillful meditation have altered his brain and made him experience greater happiness. In “The Joy of Living”, Buddhist monk Yongey Mingyur Rinpoche describes what it takes for our brains to create thoughts or memories: Neurons (a specialized nerve cell in our brain) transmitting electro-chemical signals to one another. Every time neurons connect, they form “a bond very much like old friendships”. The more they connect, the stronger the bond. So if I grew up in a broken family where my parents were always quarrelling, everytime they fought, the same signals would be passed from one neuron to the other. Over time, the bonds between these neurons would be so strong that any small thing would trigger these bad memories of my childhood. It is very likely then that I would grow up with a propensity towards more negative thoughts. This is basically what is known as neuroplasticity, which is the scientific consensus that our brains are not static, and that they can change over our lifetime. What this implicates is huge. If our brains have the plasticity to change for the worse (i.e. childhood experiences leading to a more negative personality), then it means our brains also have the plasticity to grow towards greater happiness. Maybe it is an uphill task by the time we try to change our brains as adults, but I still think it is worth a try. To end this article, I must say, I do get sick of saying/typing the word “happiness” over and over again. I don’t even like that word much, because it’s so vague. What does it mean when someone says she is happy? Can we be sure that what she is feeling is true happiness? “Happiness” as a word has lost its meaning because we have over-used it, or we have misunderstood it. For me, happiness is not just a mood, but a kind of peace and non-resistance that sometimes has nothing to do with merely pleasant feelings. Happiness, to me, is also the full acceptance of all my emotions, whether good or bad. It is the result of constant honest self-reflection, constant self-discovery, and the growing ability to see life for what it truly is. It is, finally, the taking off of my mask that I have put on all my life, and now, in my nakedness, I am finally free to be myself, warts and all. It is truly a life-long journey of self-education. So what is happiness to you? What have you done to achieve it? And are you happy now? I would love to hear from you. June 18, 2017October 28, 2019 Rebecca Toh"
