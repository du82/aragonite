title = "mental health – rebeccatoh.co"
full_description = "on being angry blog, mental health This fucking sore throat, please go away soon. This is one of those moments in life where I don’t want to accept my circumstances. I don’t want to accept this obscene pain in my throat. I don’t want to accept that I’m now sick in a very cold foreign country where I have to run a retreat in half a day’s time just because a few days before I had to fly off I decided to go hang out with my niece who turned out to be down with a virus. Sometimes you just want to be angry and petulant and unreasonable, even if you’re just reaping what you sowed 😉 These days I think it’s quite charming when people are honest about their feelings. Maybe a couple of years ago I thought it was wonderful when people worked hard to be at peace with their life’s circumstances and to only smile at life’s tribulations, but now I think a little bit of anger and annoyance is good. It’s more real. Life is shit sometimes and we do deserve to be angry. It’s even healthy to be angry, otherwise all the bad emotions just get repressed/suppressed. Then they get stuck inside of us and become bad energy. I have things in my life that I’m angry about. Some of these things go a long way back – ancient history with deep roots. Maybe these things are even the reason why I get angry about other more recent things. But I’m not very good with anger, as in I don’t really know how to express anger. I’m not good at shouting at other people. Instead I shut down and withdraw and bury that anger deep, which allows all the anger – past and present – to be compressed into such a small point that with time, it explodes. Learning how to be angry in a healthy way is one of my projects in 2023. March 19, 2023March 19, 2023 Rebecca Toh1 Comment A beautiful garden blog, mental health Sometimes I feel like my inner world is an actual, physical place I can visit. Here I am, firmly in the real world. But at any moment, whenever I feel like it, I can take a walk and open a door. Then I step into a room that looks like a beautiful garden. It didn’t always look like a garden, much less a beautiful one. Many times in the past it has resembled a rubbish dump or a dark, cold, featureless place. It used to be haunted by monsters. I have talked about my experience with depression/anxiety but failed to mention that at my lowest, I feared walking on bridges or going up tall buildings, because all I wanted was to jump off them. Killing myself felt like a logical solution to my “problem”, which seemed grand and unsolvable. 12 years ago I woke up and suddenly felt the quality of my mind changed, darkened, to the point that going from my bed to my bathroom felt like the world’s greatest impossibility. I began to have constant panic attacks. I also began experiencing something called depersonalization disorder, which made me feel like I was constantly living behind a veil, separate and disconnected from the rest of the world. It was scary beyond description. I didn’t think I would ever get better. My room was a prison. My mind was the imprisoner. And I was the only soul in this room. This went on for many years. Fast forward to 12 years later. I am still here, having never succeeded in killing myself. There are still some monsters in my room, but I am much friendlier with them now. Most days they don’t appear at all. I have low days, but they are normal low days, not fuck-I-really-want-to-kill-myself kind of low days. I haven’t experienced a panic attack in four years now. On occasions when I feel one bubbling up – which is hardly at all – I welcome it and say hello to it. It then loses its energy and slithers out of the room quietly. I don’t want to downplay the difficulty of recovering from mental illness. And of course many other things helped (when one is trying to recover from mental illness one tries every solution available), but really, nothing has helped me as much as realizing that the monsters in the room aren’t as scary as they seem to be and that they aren’t. Even. Real. (To be clear, this has nothing to do with positive thinking. Positive thinking sucks – it’s forceful and denies reality. What has helped me is meeting reality as it is and accepting it, warts and all.) I write this because one of you reading this might be experiencing what I once felt. Maybe you are fighting a daily battle to stop the pain you are feeling. Maybe there is no light in your life. Maybe you just want to kill yourself. I write this to remind you – or even my future self – that even if your room feels like it’s haunted by monsters right now, one day it can feel like a beautiful garden, warm and full of interesting things that you want to spend a lifetime exploring and learning about. So get friendly with your monsters. Acknowledge them and find out why they are there. Then open the door and let them out. Your garden awaits. July 31, 2019February 21, 2020 Rebecca TohLeave a comment"
