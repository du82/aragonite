["https://rebeccatoh.co/naked"]
title = "Strip naked – rebeccatoh.co"
description = "Writing reveals who we are — it’s like that steamboat voyage Charles Marlow undertook that brought him riding straight into the heart of darkness. There is always something to be found in our heart…"
full_description = "Strip naked blog, writing Writing reveals who we are — it’s like that steamboat voyage Charles Marlow undertook that brought him riding straight into the heart of darkness. There is always something to be found in our hearts — some true part of ourselves — that is revealed when we journey inwards, putting pen on paper. Or fingertips on keyboard. Whether we like it or not, whether we try to present the truth as something else or not, something slips out. Always. The whole process of writing, for me, is to be okay with that. Wanting to be seen as cool is a thing of the past. That was when I was 20 and still wrecked with debilitating insecurity and a sort of damaged ability to love myself. Back then I thought everyone was better and more lovable than me, and I’d better have a talent or be good at something so people would love me a little more than I deserve. But now I am older and I just want to strip naked. Come and see my heart if you want. Explore the dark bits and the bright parts and see that it’s all me. It’s all me. Today they call it “living with authenticity”. They can give it whatever label they want but it’s okay, I am gonna strip naked anyway. I want to get real. I think getting real helps with my writing. Being honest means that I don’t have to come up with things to write about — they simply bubble up out of me because that’s the way things are. Mostly it’s just a relief. A weight off the shoulder, not having to pretend to be someone I am not. What can I say? You’re gonna see a lot of that here. July 31, 2018February 21, 2020 Rebecca Toh"
