full_description = "balance-harmony blog “Balance – harmony – is when you discover something about yourself that is stable at all times. It is there when you wake up. It is there when you go to bed. It is there if this world has COVID. It is there when this world does not have COVID. If you have money, if you don’t have money. There is something stable about you – something remains the same. That means, it feels like you’re unshakeable. It feels like you found your place. You cannot be disturbed. And I personally think that it’s something really really great, not just to practise it, but also to share these ideas and concepts until they become reality. Harmony is ultimate.” – Shi Heng Yi September 29, 2021September 29, 2021 Rebecca Toh Shrutarshi Basu says: September 30, 2021 at 2:00 am Interesting idea, but it seems at odds with Buddhist concepts of impermanence and non-self. I wonder if there’s a way to reconcile the two? Reply"
