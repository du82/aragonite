full_description = "iain banks blog, writing Discovering Iain Banks feels almost like the first time I read Anthony Bourdain. It’s a feeling of pure electricity. It will forever be an honor to read words written by beings who’re born to write. People like these are not just writers, but conduits of forces that are spiritual or alien or out-of-this-world. They remind me that the world isn’t just so. There is definitely something beyond, but what? In the meantime art and writing and music and the countless results of inspired creativity will sustain us here, until we get there, whatever and wherever that is. As always, I’m a little late. Iain Banks is no longer with us. But I read a really beautiful obituary about him in The Guardian and I feel… satisfied. My satisfaction comes from knowing that he had lived a life filled with most of the things he wanted – books, writing, readers, the chance to live in his imagination, and the ability to warp the shape of this universe through his thoughts. I’m satisfied, and I hope Iain Banks was too. August 25, 2023December 9, 2023 Rebecca Toh"
