full_description = "If you want to read more blog Try this: Every time you feel like opening up your Instagram app, fire up your Kindle (or any other ebook-reading app) or pick up your book instead. You will find that, instead of getting sucked into scrolling through your timeline mindlessly, you will be reading instead. That’s how I finally finished 1984 and Brave New World in less than two weeks recently. This little trick works because it helps tag a new good habit you want to adopt (reading) with a bad habit you want to get rid of (your addiction to social media). You can do that with any other combination of habits you want to adopt/end. It works beautifully. I learned this from reading James Clear’s “Atomic Habits” (a really helpful book). October 25, 2019February 21, 2020 Rebecca Toh"
