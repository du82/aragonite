["https://rebeccatoh.co/center"]
title = "Putting life at the center – rebeccatoh.co"
description = "“Nothing behind me, everything ahead of me, as is ever so on the road.” Jack Kerouac, On the Road” July, August and September were spent traveling. I went to Tasmania and drove a couple of hu…"
full_description = "Putting life at the center blog, life lessons “Nothing behind me, everything ahead of me, as is ever so on the road.” Jack Kerouac, On the Road” July, August and September were spent traveling. I went to Tasmania and drove a couple of hundred miles across the island, accompanied by Jason Mraz’s smooth voice drifting out of the stereo singing, “Drive a little slower / not ready to go home / I’d rather stay with you…”; In August I was in Japan, traveling in Shikoku, hopping between the Setouchi art islands; after that I came back to Singapore, took another short trip to Tokyo, and then flew directly to weather-perfect Boston, where I stayed for about 2 weeks. It’s kind of insane when I type it out like that, but for some time now I have been living this way, traveling for months out of a year, so it doesn’t seem that unusual to me. But people are always telling me, “You really travel a lot!” or “You travel too much!” To which I routinely reply, “But I like traveling!” I guess this is how I want to live my life right now, doing more of the things I like and lesser of the things I dislike, and to work less and live more. There is a constant tension within me: Part of me wants to be and enjoys being a productive, useful member of society (creating / working / hanging out with people is a lot of fun and often makes me dizzy with excitement); another part of me yearns very much to be alone with my books and music and solitude for long periods of time, preferably at somewhere beautiful and surrounded by nature. I need this swinging between the two states (40% connection, 60% isolation) in order to feel balanced, happy, sane. So I work hard for months, and then drop out, go somewhere far enough, and try to disconnect. I like this kind of life. I have always wanted to live this kind of life. Of course, to live such a lifestyle also means having to unlearn many of the ideas fed to me while I was growing up. Like the idea that the best thing for us is to find a stable job and work hard and retire at the age of 65 or so. Anything less is considered irresponsible, lazy. Well, I’m a freelancer. I’m a photographer. I’m everything my father told me not to be. Maybe I’m irresponsible and lazy, but I’m happy. I work hard when I want to. I reject jobs when I need to focus on other parts of my life. I don’t see the need to constantly feed the economic machine. I earn money and I save my money. I don’t need a lot of material things. Maybe I will never get to buy a private property or a fancy car – that’s totally fine with me. But I want to always have time to read books and see new places and listen to music and be with my cats and learn how to be an urban sketcher and take swimming lessons. I chose to have less so I can be more. So… questions: Why can’t we retire at the age of 35? Why 65? Or what’s to stop us from redefining the terms “retirement” or “work” or “play”? Why can’t work be play? Why can’t play be work? Why can’t life be work + play + do nothing in particular at all in equal measures? And why are we so scared of leisure? Why can’t we build our life around… life, as opposed to building it around work? Think about it – if your life is at the center, as it should be, then work becomes just one component, along with all the other things that matter – your relationships, your hobbies, your travels, etc. Wouldn’t that be absolutely cool? Then instead of blindly heading to work and coming home every day, seeing your bank account increase by a fixed amount every month, by putting your life at the center, you force yourself to constantly think about what matters, how you want to live, and what makes a good life. Then when you are able to attempt to put all these philosophical meditations into real-life action, you begin to live an embodied life, not one where half of your life happens only inside of your head. Since I dropped out of university 11 years ago, I have pondered and wrestled with the following question. It’s a very thorny question and is at the heart of life itself. How do I get to live life the way I want to live life, without being sucked into the machinations of society? I haven’t figured everything out, but in my mess, I feel like I have succeeded somewhat in proving my own thesis – at the very least to myself – that it’s possible to live life with some degree of freedom. Of course, that’s because “freedom” is something I value a lot. You might not value it as much as I do, so the shape of your life is probably going to look very different from mine. But the point is, we must individually overcome the fixed ideas we have been burdened with by society since our birth, whenever it makes sense. And we must find our own true north through this laborious process. It is in this questioning and through years of trial and error (which means we must go out and try doing things at the risk of failing at them) before we can slowly create a life whose shape is pleasing and satisfying. That’s when you can begin to know what the center of your life even looks like. And – in a more practical sense – we must learn to want less, lest we get strangled by the money monster. And maybe, just maybe, we can then die without too many regrets. Isn’t that what life is all about at the end of the day, this eternal struggle to find your own comfortable place in the world? October 26, 2017October 28, 2019 Rebecca Toh"
year_published = 2017
year_updated = 2019
