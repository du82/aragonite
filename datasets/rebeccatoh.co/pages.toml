title = "Inner compass – rebeccatoh.co"
description = "(Image by my favorite Nicholas Stathopoulos) I’m sure I am not the only person on earth who is always thinking to herself, “Oh my god, oh my god, I’m alive! Against all odds, I&#8…"
full_description = "Inner compass blog, life lessons (Image by my favorite Nicholas Stathopoulos) I’m sure I am not the only person on earth who is always thinking to herself, “Oh my god, oh my god, I’m alive! Against all odds, I’m here. Wow, wow, wow.” This confused wonder at my sheer existence started when I was a kid. Today a lot of the energy that I put into my life comes from this deeply-rooted amazement at the fact that I am alive – not juat that, but I am an actual human being who lives on a little rock called Earth. This rock doesn’t just spin on its axis, it also rotates around the sun at the freaking insane speed of 30km/sec. 30km/sec! My body, and everything else in this world, is made up of atoms. The general consensus is that the particles that make up an atom – protons, neutrons and electrons – were first formed out of the Big Bang, an event that also created time and space and Earth itself. I’m amazed, but I’m only pretending to understand what that means, because how does anything create time and space? How?! And atoms, when you further split them, become particles called quarks that behave strangely and are so mind-blowingly tiny they measure 10-15 meters wide, meaning one millimeter of space can contain a trillion quarks. Take a moment to let that fact sink into your consciousness. So the world is not as mundane as we think it is. Our lives are not as mundane as we think they are. Sometimes when I get tired of life (there are certainly moments haha), I find myself thinking of all these and some perspective returns, and I’m reminded: Life is a delicious mystery and everything is weird and strange and yet, I’m here. You are here. That’s pretty amazing, isn’t it? Spiritual leaders like to ask us to wake up. But they might be right – we need to wake up to just how cool it is to be a human being. Because we’re here, we can do things. We have a mind (another weird thing) and we can think. We have time (weird, so weird), which is a sort of concept/idea, but it feels so real that our entire lives are anchored upon it. (Does time exist? I don’t know. The world’s smartest people are still debating about it.) When we walk, we walk through this wonderful thing we call space, which is actually made up of atoms, with atoms themselves made up of mostly space, so can someone tell me what the hell is really going on? And while here, we can fall in love, despair, dream, imagine. The most epic thing of all: We can use our free will and actions to create change both in this world and within ourselves. We are small and insignificant in the grand scheme of things, but we’re far far far from powerless. In fact I dare say we’re pretty magical beings, because we can alter reality (although we don’t usually think of it this way). So that’s the basis of my thought process when it comes to contemplating about how to go about this whole life thing. I can’t help but lean towards the idea that I am very privileged to be here to experience all of this magic, and since I am here, I might as well have a decent go at it. But how? How do we know we are doing life right? If you ask me, at this moment in time, with my limited, limited wisdom, here is what I understand: We all have an inner compass. When we listen to it and act accordingly (the key point here is to act), we are guided in the direction towards wherever we need to be. It sounds really frilly, but let me use Darius Foroux’s definition of a good life to further illuminate my point: “To me, living properly means that I’m satisfied with my life. That I can look myself in the mirror, and genuinely say, ‘I like my life.'” Without knowing it, I realized I have also been navigating and measuring my life in this rather simple and clear-cut way. Thinking about whether my life is satisfying to me and whether I like my life helps me to find my way through life, even if as metrics they feel vague to others. Perhaps some things cannot be properly measured, but if we can be genuinely honest with ourselves when answering these two questions, we will somehow find the answer from deep within our hearts. This is how I activate my inner compass. Did I like my life when I didn’t know what I was good at? No. I didn’t like my life either when I was working in a job I didn’t like. I didn’t like my life when I didn’t understand how I fit into this world. I didn’t like my life when I had no savings and had to live hand-to-mouth. And I don’t like my life when I don’t have the time to create. I don’t feel satisfied when I don’t have good relationships with the people I love. I don’t like my life when I go too fast and forget to fully taste the current moment. I’m not satisfied when all I do is work and earn money. I don’t like my life when I don’t get to read or go to the library. And I certainly don’t like my life when I try to be happy all the time. Whatever I didn’t like, I changed. Every time I changed, I moved in a direction I was supposed to go. It didn’t matter if I couldn’t foresee what was going to come next. All I knew was that I had to change, so I took action. If I didn’t like that I didn’t have time to create, for example, I would try to find time, or acknowledge that it’s really my excuses that are stopping me from creating, and not because of an actual lack of time. My inner compass would do its job, and I would listen and act accordingly. For me, it’s very simple – I change until I am living a satisfying life that I genuinely like. It’s a direction I’m always trying to move towards. (It’s a work-in-progress, of course, and I fail more often than I succeed.) So these two very simple questions… 1. Am I satisfied with my life? 2. Do I genuinely like my life? … are at the core of my inner compass. I remind myself constantly that there is only the individual path and no universal path. I don’t have to be like anyone else, and I have to always discover my path for myself. And this is all things go: My path gets clearer over time. Then it gets muddled. Then it gets clearer again. The struggle is the path; it’s okay. Half the time I don’t know what I’m doing, but I’m still trying and life is still glorious and I’d still rather be alive on a small rock in the middle of nowhere than dead. As a way to end the article, I’d just like to note that happiness is not the point at all. I know we all instinctively seek happiness, but to be happy, we cannot make happiness a goal; happiness can only be a by-product of living a good and meaningful life. As for what good and meaningful entail, that will take us a whole lifetime – or more – to find out, but that’s the whole point of this grand adventure we call life, I think. December 17, 2017June 1, 2020 Rebecca Toh"
