full_description = "the future is written blog, futuretech Have you heard about GPT-3 yet? The language-generating AI? The AI that “writes”? Here’s a screenplay it wrote, given this prompt – Below is a screenplay for a film-noir hard boiled detective story by Raymond Chandler about the boy wizard Harry Potter: “Scene: A small dingy office, early morning, furniture of the Salvation Army store variety. Sordid atmosphere. Harry Potter, in ratty tweed suit, unpressed shirt, and unshined shoes, sits behind the desk looking haggard, rumpled, and embittered. In one corner of the office a torn shade rattles at the wind gusts outside. Harry has one long index finger on the butt of a .38 and he broods over a photograph. The photograph shows a gorgeous blonde wearing an evening gown. She is holding a cocktail in one hand and looking pensively at a cigarette in the other. A tear adorns her cheek. Harry looks at her for a long moment, sighs, then puts his gun down and stands.” — GPT-3 I’m kinda scared. More here and here. August 18, 2020August 18, 2020 Rebecca Toh"
