full_description = "thinking, reading, writing, discussing and knowledge-building blog, learning “Dear Bard students, Welcome to Bard College! You are now a part of the academic universe of thinking, reading, writing, discussing and knowledge-building. Your first class will be Language & Thinking (L&T), which begins on Monday, August 15th. All Bard freshman experience L&T, a two-week immersion into thinking, reading, writing, discussing and knowledge-building, thinking, reading, writing, discussing and knowledge-building, thinking, reading, writing, discussing and knowledge-building, thinking, reading, writing, discussing and knowledge-building, thinking, reading, writing, discussing and knowledge-building. For our first class, you should read the book, Citizen by Claudia Rankin, and the hand-out, Metamorphosis by Franz Kafka. Both of these readings should be in your new folder (or at least with it). Looking forward to Monday. Be ready to think, read, write, discuss and knowledge-build, think, read, write, discuss and knowledge-build, think, read, write, discuss and knowledge-build, think, read, write, discuss and knowledge-build, think, read, write, discuss and knowledge-build.” Watching College Behind Bars and this made me smile! Find out more about the Bard Prison Initiative here. May 10, 2020May 11, 2020 Rebecca Toh"
