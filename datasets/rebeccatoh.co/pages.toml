description = "I have decided that I will buy books again, that I will live in a house full of books again even if it means I cannot move as nimbly through the world. Because I love books. It’s as simple as…"
full_description = "Buying books again blog, books, reading I have decided that I will buy books again, that I will live in a house full of books again even if it means I cannot move as nimbly through the world. Because I love books. It’s as simple as that. I love books, I want to own books, and I will own books. I’m saying this because last year I had this bizarre new idea that maybe I should give away most of my books and keep only the few I really like/love (and I really did give away more than 50% of them). But that’s utter nonsense. I’m going to start buying books again. May 22, 2020May 22, 2020 Rebecca Toh Christopher Murphy says: May 23, 2020 at 3:12 am I look forward to buying books again, but from a bookshop. One day soon, I hope. Reply"
