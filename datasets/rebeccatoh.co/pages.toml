full_description = "Focus blog Our brain craves focus. When it is focused, it is happy, still, powerful. But a focused brain is a rarity in today’s world. What do you do to keep your brain focused? March 20, 2023March 19, 2023 Rebecca Toh em says: August 7, 2023 at 11:57 am it’s been a real fight, lately, to keep my brain focused. There’s many reasons why that is, but what I know is that I hate the feeling of distraction that seems to be my base state on most days. The only thing that really returns my brain into a zone of focus is writing (sometimes meditating/exercise works too, but writing does it the most consistently). Writing demands a lot of presence from me so it’s just not possible to do it and be worried/distracted/bored/fitful/etc. Reply"
