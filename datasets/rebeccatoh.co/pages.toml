title = "100 notes on creativity – rebeccatoh.co"
full_description = "#1 Start somewhere 100 notes on creativity, blog, creative work Everything starts from somewhere. Books start from the momentum of the first word, then a sentence, then one paragraph, then a page. It builds from there. Movies begin from a writer sitting in a dark room dreaming up the first line of a dialogue, or one scene sketched out on paper. Paintings arise from one uncertain stroke that leads to the next. Start somewhere. It doesn’t matter where. Begin small and gently. The bar — one word, one line, one stroke — is so low you cannot help but succeed. August 19, 2020August 19, 2020 Rebecca TohLeave a comment"
