full_description = "– blog, photography A (half) secret place. unphotographable.co February 16, 2021 Rebecca TohLeave a comment the world deserves witnesses. blog, photography This is why I will continue to be a photographer. February 2, 2021 Rebecca TohLeave a comment dance dance dance blog, photography Went to a jazz club in Chicago and there was this grandma nobody wanted to dance with. She wore these shoes with lights and wanted so much to dance with someone. You could see it in her eyes. Once in awhile she’d get up and jiggle, but soon she would sit down again, as if remembering something. January 14, 2021January 14, 2021 Rebecca TohLeave a comment Fujifilm X100V blog, photography I can’t stop admiring my new camera. And somehow, this gold soft release button looks quite good on this particular body (normally I’d have gone for black or red). December 29, 2020December 29, 2020 Rebecca Toh4 Comments the elegant joy of black and white photography, part 3 blog, photography Photographed in Hong Kong. Revisit parts one and two. November 22, 2020July 4, 2022 Rebecca TohLeave a comment afternoon gathering blog, photography A new project brewing with friends. September 29, 2020September 29, 2020 Rebecca TohLeave a comment larry blog, photography Took some photos for Larry and his family this morning, while they were going about their morning routine. He’s going into surgery this Friday. He wrote about his story here. September 1, 2020 Rebecca TohLeave a comment the elegant joy of black and white photography, part 2 blog, photography Shot in Singapore, Portland, Tokyo, Sapporo. Part one here. August 14, 2020August 14, 2020 Rebecca Toh4 Comments A tale of two cities blog, photography, society and politics “We can either accept the death of Hong Kong’s way of life as a consequence of the new security law, assuming – wrongly – that we are impotent to do anything about it. Or we can hear the cry of Hongkongers – repeated again and again over the past year and most recently just yesterday in polling stations across the city – and take a stand. A stand that makes it clear to Hongkongers that even if Beijing and its puppet Chief Executive Carrie Lam refuse to listen, the world hears them. A stand that says even if we cannot immediately “liberate” the city, we can at least make the Chinese Communist Party pay the highest possible price for breaching an international treaty, breaking its promises and destroying Hong Kong’s autonomy and freedoms. A stand which says clearly to Hongkongers that even though they may be entering into “the worst of times,” their convictions inspire us to work for “the best of times.” A stand that says the world knows that even if One Country, Two Systems is dead, it is now “A Tale of Two Cities.” A city increasingly under the grip of the brutal, mendacious, repressive Chinese Communist Party while a free, open, vibrant city still beats in the hearts of ordinary Hongkongers. A city that is increasingly dead in its institutions, governance, and autonomy versus a city that is as alive as ever in its people’s hearts.” Full article here. July 20, 2020July 20, 2020 Rebecca TohLeave a comment"
