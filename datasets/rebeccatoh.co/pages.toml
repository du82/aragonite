description = "A thought related to moving – I have so many things I feel positively haunted by my possessions. Incidentally it’s also the first day of Ghost Month here in Singapore, so I guess it&#82…"
full_description = "so many things blog A thought related to moving – I have so many things I feel positively haunted by my possessions. Incidentally it’s also the first day of Ghost Month here in Singapore, so I guess it’s kind of apt, this feeling. But really, why do I have so many things? What happened to wanting to be a minimalist? * “Living out my small life in a spiraling megacity, I often feel like an 8-bit creature composed mainly of a mouth roaming a spontaneously generated set of white-walled malls, hungrily swallowing products: ordinary products, but also lifestyle-as-product, ethics-as-product, individuality-as-product. Sometimes the marketing is devilishly creative, and the consumption at times satisfying—the equivalent of haute cuisine. But I am pursued by a hangover that seems to locate me no matter where I am, and an incredible, relentless urge to purge my body of the aftereffects of my things, as well as my job, my ambition, my aspirations, my expectations, and to keep only my little and lonely life.” – Conscience Round Wow. August 16, 2023 Rebecca Toh"
