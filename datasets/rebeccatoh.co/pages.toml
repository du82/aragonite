title = "Till the day I die – rebeccatoh.co"
description = "Some days I feel deader than dead about photography—don’t know why I’m doing it, don’t know what it’s good for, don’t know if I’m any good at it. I think about giving it up and rack my brains about…"
full_description = "Till the day I die blog, photography Some days I feel deader than dead about photography—don’t know why I’m doing it, don’t know what it’s good for, don’t know if I’m any good at it. I think about giving it up and rack my brains about what else I would rather be doing. Maybe I will be an interior designer. Or go work in a bookstore. Or I might want to try starting my own company publishing books. I daydream the various options. But after I feel deader than dead I always circle back to the feeling that photography is something that I love without reason. I don’t know why. Maybe I’m not very good at it, maybe it’s not good for anything, maybe there is no good reason behind why I should keep doing it, but I can’t help it because something in me loves it. Maybe it’s that voiceless part of me, hidden away from the world, that loves it. I really have no idea. It’s all so mysterious. But sometimes that feeling of inexplicable love seizes me and I feel like I can go on again. I suppose this cycle will continue till the day I die. June 13, 2020June 13, 2020 Rebecca Toh"
