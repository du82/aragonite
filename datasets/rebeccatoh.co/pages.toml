description = "I have realised that I prefer to be a student rather than a teacher. There’s less pressure and I get to ask questions rather than provide answers. And I can fail as much as I want to—it&#8217…"
full_description = "student blog, learning I have realised that I prefer to be a student rather than a teacher. There’s less pressure and I get to ask questions rather than provide answers. And I can fail as much as I want to—it’s almost the imperative of a student to fail, in order to stumble her way towards learning more. But in the end every student is a teacher and every teacher (if she wants to be effective) is a student. We must maintain an openness and a love and hunger for life-long learning. If we stop learning, we become birds whose wings are clipped. We cannot fly without our wings. July 27, 2020August 7, 2020 Rebecca Toh"
