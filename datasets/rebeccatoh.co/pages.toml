description = "“I think in terms of the day’s resolutions, not the years’.” – Henry Moore I really like this quote by Henry Moore because it reminds me that it’s better to live our life in…"
full_description = "noodles, NYC, snow blog “I think in terms of the day’s resolutions, not the years’.” – Henry Moore I really like this quote by Henry Moore because it reminds me that it’s better to live our life in days, not years. Also, it’s in line with my desire to not over-plan my life. I feel it’s enough to have a vague idea of which direction I want to travel in and to leave the path open for sneaky surprises. It’s too boring to plan one’s life out in meticulous detail. And the last thing I want is a boring life. Anyhow, writing this from Finland. It’s at least -10 degrees outside and the whole day it’s been snowing nonstop. I wonder why we aren’t buried under snow yet. I fell sick yesterday/today and had some time to think about why I haven’t been writing as much as I want to. I opened my blog (this wonderful place) and realised the last time I posted was in January. If only I’d written more. Then I’d have recorded a little more of my life. Then the memories wouldn’t have slipped away. Going to New York City next week and I’m looking forward to refreshing my impression of that place (change my mind, NYC), but mainly I just want to eat all kinds of deliriously good Chinese food there. All I think about is noodles these days. March 19, 2023 Rebecca Toh"
