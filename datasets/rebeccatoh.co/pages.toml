description = "Still working on my little community library project and I’m still feeling stupidly happy about everything, even though there’re about 200 more things to do than I’d imagined. I d…"
full_description = "somewhere blog Still working on my little community library project and I’m still feeling stupidly happy about everything, even though there’re about 200 more things to do than I’d imagined. I do think I was led by life to this moment. Although I can say the same thing about every moment before this, this very moment just feels more comfortable, more right, more interesting, more filled with potential, more effortless, even though there is a lot of work involved. I’ve always loved libraries. They are a glimpse of the kind of ‘better world’ we all want to live in. That’s because by their very nature they are inclusive and welcoming. Anyone who walks through the doors of a library is reminded, just by inhaling the air of the library, just by being embraced by its atmosphere, to be a kinder and more caring person, and to forget, for a moment, the usual rules of our capitalistic society. A library is a good place. July 8, 2024August 15, 2024 Rebecca Toh"
