title = "lost and stupid – rebeccatoh.co"
description = "I don’t want to become someone who is too sure about things. I want to be a friend of doubt, just like Anthony Bourdain was. He said, “Life is complicated. It’s filled with nuance. It’s unsat…"
full_description = "lost and stupid blog I don’t want to become someone who is too sure about things. I want to be a friend of doubt, just like Anthony Bourdain was. He said, “Life is complicated. It’s filled with nuance. It’s unsatisfying… If I believe in anything, it is doubt. The root cause of all life’s problems is looking for a simple fucking answer.” So no simple fucking answers. I’m fine with that. 2023 has been quite surprising. I have streamlined my commitments – cutting and letting go – to create more ‘open time’ in 2024 to do some personal projects I’ve been wanting to do. This is an exploratory and learning phase, and I’m feeling good and excited. I ended the year having learned some major lessons about life and existence, which I will outline in this year’s ’23 thoughts and lessons from 2023′. I’ll update with the link once I’ve written it. If you’re interested you can read last year’s ’22 thoughts and lessons from 2022′ here. December 17, 2023September 4, 2024 Rebecca Toh"
