["https://rebeccatoh.co/matters"]
title = "Crafting a life that matters – rebeccatoh.co"
description = "All of last year I had a meaning crisis. I was shooting a lot and working with a lot of cool companies and brands, but I couldn’t help but feel like something was missing. Things felt hollow,…"
full_description = "Crafting a life that matters blog, happiness, life lessons, mindfulness All of last year I had a meaning crisis. I was shooting a lot and working with a lot of cool companies and brands, but I couldn’t help but feel like something was missing. Things felt hollow, devoid of significance. True, I was earning money doing what I enjoy doing, I was self-employed, I didn’t have to work for a boss in an office, I had a lot of freedom to go wherever I want and whenever I want – these are all things I’d worked very hard to achieve over the last decade (yes, decade!). But now that I’d “arrived” (not that it’s some big accomplishment, but it was a destination I’d dreamed of for awhile), I started asking myself, “So what?” And of course, “What’s next?” At first, I wondered if this was a matter of me being never satisfied, of not knowing how to appreciate the here and the now. Perhaps it was just me wanting to be, as usual, somewhere else. I was troubled. I discussed this existential crisis with my friends and my family and then one day my sister said to me, “But what you do matter! The photos you took for me elevated my brand and helped me reach out to more people. Even though you don’t think that you are helping people with what you do, you are. You helped a small brand become more visible and allowed me to help more people lead a healthier life, and that’s something.” (My sister runs a cold-pressed juice company.) I’d never thought of things that way. And then I realized something: For the last 10 years, all my efforts had been directed at achieving things for myself. I had spent years and years being introspective and asking myself: “What do I really like to do?” “What do I really want to become?” “What will really make me happy?” These are not bad questions to ask myself at all – in fact these were the very questions that led me to building a career with all the elements that I originally yearned for – freedom, money, enjoyment. But it was all me, me, me. I’d never actually thought of my work in terms of helping other people. I had spent, on the contrary, a lot of time thinking about how to help myself: How to have more clients, how to have a better portfolio, how to get the attention of the brands I love so I could get commissioned by them to work on new projects, but I hadn’t focused on helping people. In a book I’m reading now – “The Power of Meaning” – the author writes memorably about a group of people who devote their lives not to personal happiness but to a meaningful life that has, at its foundation, a service mindset: “Though the darvishes led seemingly normal lives as lawyers, construction workers, engineers, and parents, they adopted a meaning mindset that imbued everything they did with significance – whether it was helping to clean up a dinner spread or singing the poetry of Rumi and Attar and living by its wisdom. For the darvishes, the pursuit of personal happiness was completely beside the point. Rather, they focused constantly on how they could make themselves useful to others, how they could help other people feel happier and more whole, and how they could connect to something larger. They crafted lives that mattered – which leaves just one question for the rest of us: How can we do the same?” Nowadays, I too try to imbue everything I do with a service mindset. It’s not an easy thing to do for a person like myself who has been, all along, so self-centred about achieving and realizing my own goals, my own dreams, my own desires. Looking outwards and trying to make other people’s lives better through my work as a photographer gives new meaning to what I do, and lifts me out of the sense of futility and purposelessness I’d been feeling over the last year. It’s an ongoing process where I learn to put others ahead of myself (it’s truly not quite as easy I’d imagined). And this spills over, naturally, to my personal life as well, where I have discovered just how important it is for me to be a better, kinder and more giving friend, sister, daughter and partner. Living a life where I put others before me also means having the courage to make commitments. Being so obsessed with freedom, I have been actively shunning making new commitments for a long time, not wanting to be tied down to any project or any community. But yesterday I met with a few new friends from the mindfulness retreat I attended a couple of weeks ago. We had gathered to discuss coming together to build a mindfulness community made up of young people in Singapore, as part of the Wake Up movement inspired by Thich Nhat Hanh. The conclusion, at the end of our meeting, was to meet weekly as a group and eventually organise regular events, like a Day of Mindfulness, to reach out to more young people and help bring to them the joy, happiness and peace that can be the result of a mindfulness practice. Leaving the meeting, I was both inspired by and in awe of my new friends – many of them don’t just talk about being compassionate but really walk the talk by already being involved in organizations that advocate for animals and tackle climate change; one of them has accompanied a doctor on trips overseas where they operate on children with cleft palates, and another has pledged to give 10% of his income to charity for life. These are people who not just talk about putting others before them, but live this principle out through their own lives. I have a lot to learn from them. May 28, 2017June 18, 2020 Rebecca Toh"
year_published = 2017
year_updated = 2020
