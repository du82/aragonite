title = "Why I write – rebeccatoh.co"
description = "When I write, I sometimes get into a state they call “flow”. It’s a dance – just me and my brain locked in a flow of movement. I forget myself. Time stops.  At other times it’s like gett…"
full_description = "Why I write blog, writing When I write, I sometimes get into a state they call “flow”. It’s a dance – just me and my brain locked in a flow of movement. I forget myself. Time stops. At other times it’s like getting trapped in a maze. On your feet you wear heavy, clunky boots. Can you imagine? It’s a fucking hot day and your shirt is sticking to your skin and your head is buzzing, but there you are, trying to find your way out of a goddamn maze, burdened by those heavy shoes. You’re never going to get out, you think to yourself. That’s what writing is – both ends of it. Part euphoria, part drudgery, but always irresistible. In the end, whether I am dancing or getting lost, it’s the movement of it all that enraptures me. The movement of my thoughts as they get downloaded on to paper (or computer screen). The movement of my fingers across the keyboard. The movement from confusion to clarity as I travel in my head, gathering this thought and that, untying and tying knots, trying to put things together in an order that makes sense. Yes. An order that makes sense. That’s why I write – to find order, to be a little less confused, to understand. Not fully, but just a little more. A little more understanding goes a long way. October 26, 2019February 21, 2020 Rebecca Toh"
