title = "books – rebeccatoh.co"
full_description = "reading blog, books Amongst others, this: I love the cover. I love the idea. I love the execution. A dream of a book. If I could write a book like this I would die with no regrets. December 9, 2023 Rebecca TohLeave a comment Jostein Gaarder is a genius blog, books I’m reading Jostein Gaarder’s book “The Solitaire Mystery” for the second time and I’m amazed again by the depth of his writing. I enjoy the way his brain works – he thinks almost in a non-linear way, which I guess is how he’s able to write fiction that feels like a mind-boggling puzzle. He is also, of course, a philosopher (which is why all his books are about philosophy) who thinks too much about life (in a good way), and because he writes what he does and writes the way he does, I feel a little less alone in this world. I remember when I was about 20 I asked my friend if she felt it was amazing that space was so huge. She didn’t find it amazing. She thought it was just science. And she felt it was just a fact of science that we were on earth and floating in space. She didn’t think beyond that, didn’t feel awe, didn’t feel the urge to wonder. Maybe that’s why we later lost touch, even though we were so close before. “The Solitaire Mystery” is about time, creation, spirituality, consciousness. It is also constantly exploding with awe. And maybe a little sadness and anxiety. Because this whole affair of being alive is just that – awe mixed with sadness and anxiety. If you’ve read this book too I want to be your friend. “Our lives are part of a unique adventure… Nevertheless, most of us think the world is ‘normal’ and are constantly hunting for something abnormal–like angels or Martians. But that is just because we don’t realize the world is a mystery. As for myself, I felt completely different. I saw the world as an amazing dream. I was hunting for some kind of explanation of how everything fit together.” – “The Solitaire Mystery”, Jostein Gaarder March 19, 2023March 19, 2023 Rebecca TohLeave a comment"
