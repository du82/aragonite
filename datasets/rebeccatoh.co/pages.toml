title = "Be really good at one thing – rebeccatoh.co"
description = "Ivan Orkin in culinary school. I love this photo. I love watching Chef’s Table on Netflix. I love seeing how just one thing – cooking – can become the source of so much joy, frust…"
full_description = "Be really good at one thing blog, creative work, life lessons Ivan Orkin in culinary school. I love this photo. I love watching Chef’s Table on Netflix. I love seeing how just one thing – cooking – can become the source of so much joy, frustration, achievement, failure. In other words, an entire universe. For many (if not all) of these chefs, cooking is something upon which they build their entire lives. In the recent episode I watched, ramen chef Ivan Orkin had a difficult childhood. As a kid, no one expected much of him. He drifted until, one day, he became obsessed with… ramen. This obsession was pivotal because it led to him unlocking the discipline and focus that were previously missing in his life. He later opened his own ramen shop in Japan and gained success as being “one of the best ramen makers on the planet”. Just this one thing – cooking ramen well – has transformed Orkin’s life. So, this week’s food for thought: Instead of wanting to do or be many things, why not work at becoming really good – single-mindedly good – at one thing? Why not be an expert at writing about food (and only food)? Why not be so good at teaching cycling that you are at the top of people’s mind whenever anyone wants to learn to ride a bike? Once you can be known for being good at one thing, this one thing can then become a platform, a stepping board, to other things. What’s your one thing? March 3, 2017October 28, 2019 Rebecca Toh Julie says: March 7, 2017 at 5:02 pm Hello! I have recently started following you and am really enjoying your thoughts and ideas! Thanks so much for the inspiration and I am taking this tip of focusing on one thing! Well, two things… Reply"
