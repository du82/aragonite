["https://rebeccatoh.co/downsizing"]
title = "Downsizing – rebeccatoh.co"
description = "My life keeps getting smaller these days. Just today I got rid of a calendar, a photo-holder and a book whose author I no longer hold in high regard. Every day I feel the urge to get rid of a few m…"
full_description = "Downsizing blog, happiness, life lessons, mindfulness My life keeps getting smaller these days. Just today I got rid of a calendar, a photo-holder and a book whose author I no longer hold in high regard. Every day I feel the urge to get rid of a few more things in my life. In fact, I want to do it until I am left with only the things I need. The essential things. It’s a high ideal, and one that requires constant mindfulness. After all, it’s easy to think that we need an extra pair of scissors at home, when the truth is we can survive just as well on one (true story: I have two pairs of scissors in my kitchen and I can’t make myself get rid of one of them. Yet.) But I have been getting better at getting rid of a whole bunch of other things – clothes I don’t like, decorative pieces around the home that don’t quite spark joy, random things I bought from my travels overseas. I’m not quite a minimalist yet but you can definitely say that I aspire towards being one, or at least have the inclination of one. Although, I have to say, I used to really enjoy buying things. I have tasted what I thought was true happiness when I walked into a store and bought an iPad mini on the spot. Or when I was buying a $1,000 bicycle just one day after the thought of buying a bicycle drifted into my head. (I have barely used both the iPad mini and the bicycle since. The joy of buying both of them wore off in less than a few days after the purchase.) It used to be that I would walk into a mall and think of things to buy (not that I needed anything in particular). I’d feel my body awash with the pleasure of the anticipation of spending money on something, anything. It was almost primal. Nowadays, sometimes, when I have had a long day, I find myself dropping back naturally into the habit of wanting to walk into a mall and look for things to buy, but I have learned to dismiss the thought. (Actually, now I sometimes feel not just zero urge to buy things but a slight discomfort at the number of things that are on sale in a mall. Imagine the amount of resources it must take to produce all these things.) As time went by, I began slowly to suspect that my things were a barrier towards more happiness in my life. Firstly, I was spending so much money on them, money I could have invested or saved. Secondly, even though I owned all these things, I never did learn to savour each of them. I would buy something and move on to the next thing or gadget I wanted to buy (I was always looking out for the next version of Kindle, for example). So I began the process of wanting not just to buy fewer things and save more money, but also to look deeply into why I wanted to do this. And I realized it was because I wanted to have the opportunity to see clearly, for myself, what are the truly important things in my life. These days I make myself own one pair of sandals, one pair of sneakers, and one pair of track shoes. One for every possible occasion. I like all of them, and I don’t question any more if my footwear fits my outfit – my sandals are black and my sneakers are white, so they fit almost anything! I also got rid of my Spotify and New York Times subscriptions (and a bunch of other superfluous subscriptions I signed up for on a whim), deleted Uber off my phone (saving Grab for the really dire moments when I absolutely need to pay $20 to get a ride home, as opposed to less than $3 if I take the train home), trimmed down my insurance policies, cut my spending on books by 90%, stopped buying new clothes, etc. In the last year I have managed to save quite a lot of money, way more than I have ever saved throughout my entire life. Having saved this much money means I now have the freedom to ride out the tough times of my freelance career if it ever comes to that, start a side business, or even better, not work for awhile if I want to, without having to worry about money issues at all. Also, I don’t spend precious time battling my craving to shop online anymore, nor do I waste time researching on the best, for example, wallet or bag to buy. I’m happy enough with the wallet and the bag that I already own. That’s the beauty of being a more minimalist lifestyle – you learn to enjoy and savour what you already have. Freedom and time – now those are things that are truly important to me. As I said, I am merely an aspiring minimalist. I don’t live in a clutter-free home yet (although I try to keep my living room neat, my store-room and study room are still piled with clutter that I hope to clear some day). But I don’t think there’s any turning back. I have enjoyed the benefits of buying and owning fewer things too much to morph back into a maximalist again. And I certainly hope to one day live in a home as cool and awesomely minimalist as this guy’s 😉 June 4, 2017June 1, 2020 Rebecca Toh"
year_published = 2017
year_updated = 2020
