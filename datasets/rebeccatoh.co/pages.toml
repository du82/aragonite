full_description = "Painting what you see outside your window blog, creative work When I visited the Édouard Manet exhibition in Chicago a few years ago, I started to understand something — even though Manet would eventually come to be known as the father of impressionism, a lot of his work towards the end of his life was simply painting what he saw outside his window, as he was sick and unable to leave the house. Those works later came to be part of his canon, part of what he left behind for the world. This reminded me that art is simply the story every day people try to tell of their every day lives. History can decide later on whether that is officially “art”, but that’s not relevant to us at all. Therefore everyone can begin to make art, art that belongs first of all to ourselves, by simply painting what we see outside our windows. October 28, 2019July 16, 2022 Rebecca Toh J says: October 28, 2019 at 10:00 pm Hi Rebecca – Thanks for all the words. I was just wondering if your archives can show beyond issue 48? I can’t read those from before… Thanks and keep writing! Reply Rebecca Toh says: November 2, 2019 at 2:08 pm Hey J, That’s a really good question! I think for now Mailchimp only displays part of the archive, but not the full archive. Let me see if I can change the settings to display everything. Thanks for your comment and kind words! And thank you for reading! Love, R Reply"
