["https://rebeccatoh.co/bourdain"]
title = "Bourdain – rebeccatoh.co"
description = "I was a fool to have found Anthony Bourdain’s work so late. But now he is dead. There is something I enjoy about Bourdain, but it’s hard to write about without — in Bourdainesque language — fucking…"
full_description = "Bourdain blog, life lessons Photo from Anthony Bourdain’s Tumblr I was a fool to have found Anthony Bourdain’s work so late. But now he is dead. There is something I enjoy about Bourdain, but it’s hard to write about without — in Bourdainesque language — fucking it up. But okay. Okay. It’s the idea of Tony Bourdain, alright? Imagine him, sitting on the back of a scooter in Hanoi, the traffic roaring. There is exhaust and smoke everywhere. CHAOS. Cut to another scene — he is eating dinner by the roadside on a low red plastic stool, adding with abandon fish sauce and chilli into his piping hot Cơm Hến and slurping it up. Then he’s riding across Myanmar on a crazily jumpy train — almost under threat of derailment — sleeping right through the journey. An old-school Chinese song plays, and suddenly he is walking through Chungking Mansion in Hong Kong, cool as ice. Another cut again brings us to him, knife in hand, killing chickens for stew in the dark (with much difficulty, it must be added) as a boat brings him slowly downriver into the jungle of the Congo… You can’t deny that he is full of… swag. But he is also king of the kind of seductive, beautiful, sordid imagery that paints the world as it is. He knows that the world is complicated, so he doesn’t try to package it. He tries simply to be a part of that complexity. Maybe we can say that the final products of No Reservations and Parts Unknown are still well-packaged, highly edited, biased works of one man’s views and imagination, but if there is anyone out there who’s trying his hardest to cut the bullshit, it’s Tony Bourdain. Then there is the other idea of him — 44 but still broke, behind on rent, living in a rent-stabilized apartment, without health insurance, with little to no hope of ever realizing his dreams of traveling the world. This other Tony Bourdain decided to write Kitchen Confidential — the book that lifted him out of obscurity — for other cooks and waiters who were as angry and self-loathing as he was. “Fuck everybody else,” he thought, and wrote the book that he thought no one else would read. Then there were the drugs. He wrote all about it in his books. There was no attempt to hide. The addiction, the depression, the suicide attempts, the desperation. It was all out there, like barely healed cuts on one’s inner arm. So I guess I appreciate Bourdain because he was many things —all the good (his success, his talent, his vision) and all the bad (so broken, so afraid of the world and so fucked up), but mostly because, he always tried to be true. And not to mention the swag. The swag. July 31, 2018February 21, 2020 Rebecca Toh"
