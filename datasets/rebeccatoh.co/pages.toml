full_description = "going into hiding blog I enjoy not being found. It’s my way of coping with an external world that is largely unknown and potentially dangerous. ‘I don’t want to be found, seen or heard from’ is a thought I constantly have. At the same time, I realise I have the need to communicate, but preferably in ways that allow me to be partially hidden (like writing in a blog that few people read). Is this a desire for non-existence? I don’t think so, because I do want to exist and I do want people to know I exist. But I don’t want to be found. Do you see the difference? May 7, 2024May 7, 2024 Rebecca Toh Nitin Khanna says: May 7, 2024 at 12:50 am I see the difference, and I see you (via your blog). I understand how it feels to want to be a part of the world but… as an observer? A commentator? A conversationalist but with only a few folks? A limited participant, perhaps! Enjoy! Reply"
