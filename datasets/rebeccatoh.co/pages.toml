["https://rebeccatoh.co/caring"]
title = "Caring deeply – rebeccatoh.co"
description = "In 1962 Fred Rogers created “Mister Rogers’ Neighbourhood”. For 31 seasons, 912 episodes, over a span of almost 40 years, Fred Rogers showed up – rain or shine – at hi…"
full_description = "Caring deeply blog, creative work, happiness In 1962 Fred Rogers created “Mister Rogers’ Neighbourhood”. For 31 seasons, 912 episodes, over a span of almost 40 years, Fred Rogers showed up – rain or shine – at his “television house” and talked directly to children about subjects as disparate as kindness, death, assassination, divorce and so on, and at a pace so slow and gentle as to seem radical today. He taught millions of children about self worth and made them feel – even through a television screen – that they are loved, cherished, important. He taught them to be open to all kinds of feelings, no matter good or bad, and showed them that it’s okay to feel blue sometimes. He taught kids to wonder and to make believe, but he also taught them how to deal with the darkness of this world: “The world is not always a kind place. That’s something all children learn for themselves, whether we want them to or not, but it’s something they really need our help to understand.” Fred Rogers made wonderful, meaningful television that created a real impact in countless children’s lives, and he did it consistently for 40 years. And he did it because he cared. He cared deeply about the well-being of children. He saw that television was instrumental in shaping the inner lives and consumption habits of children who would grow up to be adults, so he created a children’s TV series that had nothing to do with coveting, but “about appreciating what you already have, about caring for others and seeing the best in them”. Fred Rogers once said that caring is discipline. He didn’t explain further, but he must mean that to be able to create top-notch work day in, day out, one must be disciplined, and this discipline must surely be fuelled by a deep caring. What is it that you and I care deeply about? What do we care about so deeply that we can find the will in us to be so disciplined that we can work at something in a consistent manner over many years? I think this is a decent question to ask ourselves every day. Because when you really think about it, consuming meaninglessly, upgrading our homes, chasing after the next promotion, mindlessly pursuing financial goals – these just don’t cut it. When it comes down to it, we must recognise that life is finite. We are only here for awhile. And yet there seems to be some deep, mysterious, inexplicable joy to be had when we get to do something we truly care about, no matter how hard or painful the process might be. Maybe the answer to that question will not be immediately obvious or take the form you were expecting. But listen to your inner voice. Reject convention. Take that first step. Fuck, jump off the cliff if you need to. But whatever it is, know that as long as you are seeking the answer, the answer is already revealing itself to you. May we all find what we are looking for. November 25, 2018August 4, 2022 Rebecca Toh"
