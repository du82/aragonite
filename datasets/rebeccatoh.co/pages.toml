full_description = "we don’t need to become better blog, self-compassion There is a lot of pressure to become better. A better cook, a better writer, a better friend, a better partner, a better reader, a better meditator, a better yoga student, etc. But self-hatred can sometimes be disguised as self-improvement. We like to think the pressure comes from outside, but more often it comes from inside. We want to become better because we think there is something fundamentally wrong with us. But what if we stop thinking there is something wrong with us, apart from being fully human? And any self-improvement is done, truly, out of a place of curiosity and joy? What would life look like then? “How many moments have we lost from thinking we’re unlovable?” – Tara Brach September 29, 2020September 29, 2020 Rebecca Toh"
