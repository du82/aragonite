title = "buddhism – rebeccatoh.co"
full_description = "aimlessness blog, buddhism, meditation, mindfulness “There is a word in Buddhism that means ‘wishlessness’ or ‘aimlessness’. The idea is that you do not put something in front of you and run after it, because everything is already here, in yourself. While we practice walking meditation, we do not try to arrive anywhere. We only make peaceful, happy steps. If we keep thinking of the future, of what we want to realize, we will lose our steps. The same is true with sitting meditation. We sit just to enjoy our sitting; we do not sit to attain any goal. This is quite important. Each moment of sitting meditation brings us back to life, and we should sit in a way that we enjoy our sitting for the entire time we do it. Whether we are eating a tangerine, drinking a cup of tea, or walking in meditation, we should do it in a way that is ‘aimless’.” — “Peace is Every Step”, Thich Nhat Hanh July 28, 2020July 28, 2020 Rebecca TohLeave a comment Perception blog, buddhism, mindfulness “When you look at the night sky, you might see a very beautiful star, and you smile at it. But a scientist may tell you that the star is no longer there, that it was extinct ten million years ago. So our perception is not correct. When we see a very beautiful sunset, we are very happy, perceiving that the sun is there with us. In fact it was already behind the mountain eight minutes ago. It takes eight minutes for the sunshine to reach our planet. The hard fact is that we never see the sun in the present, we only see the sun of the past. Suppose while walking in the twilight, you see a snake, and you scream, but when you shine your flashlight on it, it turns out to be a rope. This is an error of perception. During our daily lives we have many misperceptions. If I don’t understand you, I may be angry at you all the the time. We are not capable of understanding each other, and that is the main source of human suffering.” —Thich Nhat Hanh June 15, 2020June 15, 2020 Rebecca TohLeave a comment"
