title = "blog – Page 4 – rebeccatoh.co"
full_description = "on being angry blog, mental health This fucking sore throat, please go away soon. This is one of those moments in life where I don’t want to accept my circumstances. I don’t want to accept this obscene pain in my throat. I don’t want to accept that I’m now sick in a very cold foreign country where I have to run a retreat in half a day’s time just because a few days before I had to fly off I decided to go hang out with my niece who turned out to be down with a virus. Sometimes you just want to be angry and petulant and unreasonable, even if you’re just reaping what you sowed 😉 These days I think it’s quite charming when people are honest about their feelings. Maybe a couple of years ago I thought it was wonderful when people worked hard to be at peace with their life’s circumstances and to only smile at life’s tribulations, but now I think a little bit of anger and annoyance is good. It’s more real. Life is shit sometimes and we do deserve to be angry. It’s even healthy to be angry, otherwise all the bad emotions just get repressed/suppressed. Then they get stuck inside of us and become bad energy. I have things in my life that I’m angry about. Some of these things go a long way back – ancient history with deep roots. Maybe these things are even the reason why I get angry about other more recent things. But I’m not very good with anger, as in I don’t really know how to express anger. I’m not good at shouting at other people. Instead I shut down and withdraw and bury that anger deep, which allows all the anger – past and present – to be compressed into such a small point that with time, it explodes. Learning how to be angry in a healthy way is one of my projects in 2023. March 19, 2023March 19, 2023 Rebecca Toh1 Comment noodles, NYC, snow blog “I think in terms of the day’s resolutions, not the years’.” – Henry Moore I really like this quote by Henry Moore because it reminds me that it’s better to live our life in days, not years. Also, it’s in line with my desire to not over-plan my life. I feel it’s enough to have a vague idea of which direction I want to travel in and to leave the path open for sneaky surprises. It’s too boring to plan one’s life out in meticulous detail. And the last thing I want is a boring life. Anyhow, writing this from Finland. It’s at least -10 degrees outside and the whole day it’s been snowing nonstop. I wonder why we aren’t buried under snow yet. I fell sick yesterday/today and had some time to think about why I haven’t been writing as much as I want to. I opened my blog (this wonderful place) and realised the last time I posted was in January. If only I’d written more. Then I’d have recorded a little more of my life. Then the memories wouldn’t have slipped away. Going to New York City next week and I’m looking forward to refreshing my impression of that place (change my mind, NYC), but mainly I just want to eat all kinds of deliriously good Chinese food there. All I think about is noodles these days. March 19, 2023 Rebecca TohLeave a comment"
