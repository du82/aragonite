["https://rebeccatoh.co/category/writing"]
title = "writing – rebeccatoh.co"
full_description = "I have feelings blog, writing Don’t write thoughts, write feelings. Feelings are easy to write. I hate her, I love her, I miss her, I’m waiting for her. That’s easier than thoughts. I have no thoughts, just feelings… I have a feeling and I write it down. That’s all there is to it. December 3, 2023December 3, 2023 Rebecca TohLeave a comment iain banks blog, writing Discovering Iain Banks feels almost like the first time I read Anthony Bourdain. It’s a feeling of pure electricity. It will forever be an honor to read words written by beings who’re born to write. People like these are not just writers, but conduits of forces that are spiritual or alien or out-of-this-world. They remind me that the world isn’t just so. There is definitely something beyond, but what? In the meantime art and writing and music and the countless results of inspired creativity will sustain us here, until we get there, whatever and wherever that is. As always, I’m a little late. Iain Banks is no longer with us. But I read a really beautiful obituary about him in The Guardian and I feel… satisfied. My satisfaction comes from knowing that he had lived a life filled with most of the things he wanted – books, writing, readers, the chance to live in his imagination, and the ability to warp the shape of this universe through his thoughts. I’m satisfied, and I hope Iain Banks was too. August 25, 2023December 9, 2023 Rebecca TohLeave a comment Dark to light blog, writing The silence at 5.30am is hynotizing. I love it. I’ve been waking up early these days and using the time to read and write and think through some conundrums in my life, and to organise the parts that feel out of place, misaligned. It’s been working surprisingly well. It’s not just the waking up early, but the reading and the writing. Especially the writing. I’ve been dumping all my thoughts on a page, asking myself questions and answering them, picking apart my own logic, organising and reorganising my thoughts. It’s funny. When I edit my sentences and paragraphs, I realise I’m also editing my thoughts. For me, thinking is writing—they’re one. I’ve gone long periods without thinking through writing. How did I manage to make the decisions I made? I have no idea. But here I am, thinking+writing again. And it works. I love it. When the day awakens, it turns from dark to light outside. Writing brings me through the same process—the dark confusion turns into clarity as I write and rewrite. I’m forced to see the fallacies and muddiness of my thoughts, forced to confront my pretensions, my insecurities, my tendencies to do what is easiest or most commonly accepted. It’s meditation in action. Hard but rewarding. July 31, 2020August 31, 2023 Rebecca TohLeave a comment"
