full_description = "A heap of boiled meat in broth blog, writing “Lying in bed and smoking my sixth or seventh cigarette of the morning, I’m wondering what the hell I’m going to do today. Oh yeah, I gotta write this thing. But that’s not work, really, is it? It feels somehow shifty and… dishonest, making a buck writing. Writing anything is a treason of sorts. Even the cold recitation of facts — which is hardly what I’ve been up to — is never the thing itself. And the events described are somehow diminished in the telling. A perfect bowl of bouillabaisse, that first, all-important oyster, plucked from the Bassin d’Arcachon, both are made cheaper, less distinct in my memory, once I’ve written about them. Whether I missed a few other things or described them inadequately, like the adventures of the amazing Steven Tempel or my Day in the Life, is less important. Our movements through time and space seem somehow trivial compared to a heap of boiled meat in broth, the smell of saffron, garlic, fish bones and Pernod.” — “Kitchen Confidential”, Anthony Bourdain April 16, 2020April 16, 2020 Rebecca Toh"
