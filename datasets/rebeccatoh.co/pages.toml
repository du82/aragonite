["https://rebeccatoh.co/loneliness"]
title = "Loneliness kills – rebeccatoh.co"
description = "I do believe loneliness kills. One year I was in Sapporo. I went there because I wanted to run away from myself, but at that time I didn’t know yet that you can’t outrun yourself. I ren…"
full_description = "Loneliness kills blog, life lessons I do believe loneliness kills. One year I was in Sapporo. I went there because I wanted to run away from myself, but at that time I didn’t know yet that you can’t outrun yourself. I rented a private room in a hostel. The first few days were hellish. I fell sick, suffered a few panic attacks, ate kombini food in my room, and walked through wind-swept downtown Sapporo alone, a lost soul. I didn’t know anyone in the city. Not a single person in the whole of Sapporo knew my name. One day I got talking with one of the owners of the hostel. I’d tried to avoid talking to anyone (I thought being alone would help me better run away from myself), but it was hard because my room was just right beside the hostel’s reception area. That was the day my trip changed from a slow-moving heavy-hearted indie film dripping with a kind of end-of-the-world emotional darkness to a light-hearted summer flick filled with friendship and laughter, I kid you not. I was promptly invited to join them for dinner the next day, during which we made some kind of Japanese wrap together and were joined by not only guests but the hostel owners’ friends from the neighbourhood. There were sake and stories shared. A good night. One morning I went with a bunch of them to the riverside for yoga. They held yoga sessions once in awhile for their guests and friends. My new Japanese friends had woken up early to make onigiri from scratch (still the best fucking onigiri I’ve ever had in my life) and brought tables and chairs to set up a coffee station. The sky was a soft but brilliant blue. After the yoga some of them sat around talking and eating, while others started kicking a ball around. The breeze was sharp and cold, but not painfully so. It was so damn idyllic. From then on I had friends. More than a few people knew my name now in Sapporo. I volunteered to photograph their hostel for their website, and I spent a short morning doing some portraits for the three owners of the hostel. Some afternoons we’d sit together in the living room and the owners’ friends would be there, playing guitar and goofing around. I befriended one of these guys, Shiraki, and spent one evening at his tiny apartment. He told me all about his dad and showed me his records. He chain-smoked all the way as we shared our life stories with each other. My time in Sapporo would have been very different without these people. Whenever I recall my time there, I don’t think quite so fondly of the nights I ate alone in my room. I think instead of the time I spent together with these new friends, and my heart feels all warm and fluffy. Not only that, I saw how beautiful the whole Waya Guesthouse community was (go to the landing page of their website and you will see the photo I took for them!). Started by three friends who had come home to Sapporo after some years of working in cities like Tokyo, the trio dreamed of bringing their community together. The hostel was built literally by hundreds of friends and neighbours who saw Waya’s Facebook posts and came out to help. Every bit of wood was drilled by a friend or a neighbour. I was inspired – and my heart warmed – by that. It planted a seed in me that took years to germinate, but now I am a firm believer in community. In my view, everyone has two tribes – one, your personal tribe made up of family and close friends with whom you can eat and laugh together; two, a bigger tribe made up of a group of like-minded people you genuinely enjoy being with and with whom you can collaborate, make things, work towards a cause together. I urge you to cultivate both tribes with equal commitment. After all, these are YOUR people who will journey with you through this life. June 25, 2018February 21, 2020 Rebecca Toh"
year_published = 2018
year_updated = 2020
