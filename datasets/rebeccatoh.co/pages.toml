full_description = "“Some days are terrible, some days are better.” blog “I have felt a tiny desire to reach out to some friends. I have felt a small urge to get myself exercising. I have felt a glimpse of comfort, peace, and perhaps even joy manifesting in the cracks. Alongside these glimmers of positivity were also the emergence of new existential troubles and life concerns that have been suppressed so far. The pain from losing and missing Mizah still sits firmly in me and I still have trouble sleeping at the end of my aimless days, but it seems that there is now a wider gamut of emotions all existing beside one another in me. Sometimes I go through an entire range of emotions in a single day, and sometimes they clash to exist together in a single moment. It’s a different kind of difficult and I am trying my best to hold space for it.” My dear friend Adib writes about the many faces of grief and his battle/co-existence with it. May 28, 2020May 28, 2020 Rebecca Toh"
