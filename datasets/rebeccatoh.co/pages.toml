title = "A better world – rebeccatoh.co"
description = "“Earlier this year, I was pretty much done with the internet. I debated about just walking away from it altogether. I felt like I was alone in wanting the internet to be fun. Then I decided t…"
full_description = "A better world blog “Earlier this year, I was pretty much done with the internet. I debated about just walking away from it altogether. I felt like I was alone in wanting the internet to be fun. Then I decided to empower myself and just bend the internet to my perspective. I closed accounts and re-directed my focus to reading personal blogs and avoiding all the mainstream stuff. I found other people frustrated with the internet world who just wanted a less stressful and happier place to hang out online. I started building up a huge catalog of personal blogs to take up my online browsing time instead of the news, social media, reddit, and the like. And for the first time in a very long time, I found the internet to be stimulating, fun, and relaxing.” Brandon, thank you for putting into words what I’ve been thinking about recently. There should be no shame in choosing not to be political or vocal about what’s going on in the world right now. There is no right or wrong way to be a human being, and there are a million ways to make this world better than it was yesterday. We get to choose how we want to show up. “Now these very people are having shame spill over into that more peaceful existence online and that really sucks. We can all do things to make the world a better place and people online or even society as a whole, shouldn’t make you feel like you aren’t doing enough. For some people just being nice is enough. For others donating time or money is enough.” In response to Brandon’s post, “Shame and Blogging”. June 12, 2020June 12, 2020 Rebecca Toh"
