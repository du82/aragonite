["https://rebeccatoh.co/about"]
title = "Hello, my name is Rebecca Toh. – rebeccatoh.co"
description = "I was born in Singapore in 1986 and these days I work as a photographer. I quit university when I was 20 to find my own way in the world. That was in 2006. In the years since, I have tried and fail…"
full_description = "Hello, my name is Rebecca Toh. I was born in Singapore in 1986 and these days I work as a photographer. I quit university when I was 20 to find my own way in the world. That was in 2006. In the years since, I have tried and failed at many things – at one point I was a cafe-owner, a marketing executive, a tuition teacher, a part-time radio DJ, an indie magazine publisher, a newspaper columnist, an aspiring freelance writer. All sorts of different things. In 2013 I began my journey of becoming a photographer and things began to fall into place. Life is short. It can end tomorrow for all we know. Knowing this acutely is the reason why I’m so interested in learning how to live a joyful and meaningful life — I don’t want to waste this precious life. Through my writing, I hope to give freely and spread a little more joy, peace, courage and healing in this world. This is what I’m doing now. Other things about me Aquarian. A student of meditation. I enjoy reading, writing and learning. I love old-school internet and am a proponent of the IndieWeb. Traveling is a big part of my life. I love music and make mixtapes of my favorite songs here. Currently living in Singapore."
