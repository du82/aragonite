full_description = "Maya Angelou blog Interviewer: “You seem to be fearless, that’s the other quality I’ve noticed about you.” Maya Angelous: “I’m afraid all the time but I’m not afraid of anything. I gave into that. Which was a great freeing production for me. Once I really admitted that I would die, that it is the one promise I can be sure would not be reneged upon. Once I understood that, then I could be present. And I’m totally present, all the time. I try. Now, I don’t make it all the time. But I try to bring all my stuff here in this studio. Everything I’ve got is here. And when I leave here, everything I’ve got will be in that cab, will be in the hotel.” Interviewer: “That could be a dangerous philosophy, if you think that you gotta live every single moment, cause you could be greedy. You’re not saying that, are you? You know, take everything I can now, now now. You don’t mean that…” Maya Angelous: “No, maybe just the opposite. Give everything I’ve got! Not take. I mean, what is that? Give everything. All the time. It’s great fun. And it is liberating. Absolutely liberating.” June 22, 2023 Rebecca Toh Kifa says: June 22, 2023 at 12:35 pm This resonates so much with me. Giving everything I’ve got is liberating. It’s 100% love. 100% focus. 100% presence. 100% immersed. Reply"
