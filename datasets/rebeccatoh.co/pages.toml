["https://rebeccatoh.co/good-day"]
title = "A good day’s work – rebeccatoh.co"
description = "I’m kind of a productivity geek. Life is short, and there is a lot I want to squeeze into this short life, so I am constantly thinking of how to optimize my days. (That also means I…"
full_description = "A good day’s work blog, creative work, happiness, productivity I’m kind of a productivity geek. Life is short, and there is a lot I want to squeeze into this short life, so I am constantly thinking of how to optimize my days. (That also means I am always trying different productivity systems on for size, which is very fun and extremely unproductive, I must say). But what, really, is productivity, and why does it matter? According to Jason Fried, CEO of Basecamp, at the end of the day we’re all just looking for progress in our lives – each of us wants to move further along the path towards realizing our potential or achieving our most important goals. That’s why we want to be “productive”. Note that it’s about having important goals, and not just any goal. Because being productive is not just about ticking off our to-do lists mindlessly. It’s not about doing busy work. It’s not about waking up and attacking our email inbox thoughtlessly, mechanically. Good productivity is about doing a good day’s work, and I think Jason Fried is right – it’s about progress, it’s about becoming better, it’s about evolving, and these things must be done towards the right goals. As Shawn Blanc – a writer and creative whom I admire very much – also said, “Meaningful productivity means consistently giving our time and attention to the things that matter most.” So even before thinking about how to optimize my days, I must first be honest with myself about what I want to fill my days with and be extremely mindful of whether these things are even important in the first place. So I’ve been thinking, what matters most to me? Personal peace and a sense of emotional well-being. This is the foundation of everything for me. Hence the tools to create personal peace – like meditation, like prayer – are things I must prioritize doing every day. There should be no question about whether I should meditate/pray or not, since my peace and my well-being are dependent on them. Starting my days with meditation, ending my nights with prayer – surely that is a good container for a good day’s work. My health and my fitness. I love feeling fit and healthy. But we are the stories we tell ourselves. All my life I have told myself – and have been told by others – that I am not a sporty person. So I spent many years of my life thinking exercising or sports isn’t for me, that I’m never going to be any good at it. But I slowly changed the narrative for myself, and have in the last few years enjoyed playing squash, running, rock-climbing and swimming. I love the after-glow of exercising and I love how the lessons I learn while running or swimming cross-over into the other parts of my life. For instance, when learning TI Swimming, I realize very quickly that it’s not about becoming a perfect swimmer overnight. During every practice session, the focus is often on a mini-skill, a small part of one skill. With mindfulness and careful attention and pleasure, you work on that mini-skill. The next day, you focus on another mini-skill. At no time do you fixate on your end goal. Instead, you enjoy every moment of your practice. By slowly progressing through all these mini-skills one at a time, you are promised that everything will converge eventually and you will suddenly find yourself becoming a good swimmer. Like a caterpillar slowly transforming into a butterfly. Isn’t that a beautiful analogy for life too? My relationships with people I love. This is extremely important to me. I am a recovering workaholic. Even though recovering, some of my workaholic tendencies have become firmly embedded in me. Sometimes I get really obsessed with doing work (because to me, work is actually fun) that I’d rather work than spend time hanging out with my friends or family. But because this is so important to me, my days would not be complete or meaningful if I didn’t also carve time out to be with my family and friends. My work as a photographer. I consider my work as a photographer a life-time vocation. Maybe, in 20 or 30 years, I will not be shooting for money anymore, but I don’t think that will ever stop me from thinking of myself as a photographer. But now, while I am a professional photographer, there are important goals associated to it that I must pursue. For instance, my goal as an advertising photographer is to create personal work good enough that I am hired not just for my style, but for my creative vision. As an editorial photographer, I want to move towards doing fewer lifestyle stories and more substantial documentary work, with an eye towards social issues. I want to do photography work that is increasingly meaningful and interesting. This means it’s important that I dedicate a portion of my days to working on advancing these goals (doing personal projects, studying photography and the work of photographers I admire, contacting photo editors who can help me further my goals), instead of simply firefighting and riding on any work that comes my way. It is important that I actively sculpt my path as a photographer instead of simply allowing the current to push me forward. My creative energy. There are a lot of other things I want to do besides photography. I am interested in books and writing and the mechanics of building a small business and technology and publishing and education. All of these things come with potential project ideas. It’s important that I spend time working on some of these things. That’s one of the reasons why I write this newsletter/blog – it’s an extremely important creative outlet for me. My desire to do meaningful things in this world. Life is not just about earning money and buying things and living the good life. All of that is great, but I want to do meaningful things with my time as well. What is “meaningful” differs from person to person. For me, meaning is an intangible feeling, a sense that I have lived a worthwhile life, one in which I have used my skills and talent to help bring something useful and beautiful to other people. I am currently in the midst of doing something (using photography) with a local foundation to help kids who have been touched by cancer. This is personally meaningful to me because my life has been touched by cancer as well – my aunt passed away from cancer when she was 40, a schoolmate of mine died from bone cancer when he was 14, and my good friend from Taiwan died last year at the age of 36 from metastatic breast cancer. Reading and learning. I don’t know what I would do without books. Every time I feel stuck, sad, or lost, it is books that I turn to first. There is always someone somewhere out there who has experienced exactly what I have, and who has written a book about it. Being able to read and learn makes me feel invincible, like nothing in this world is too difficult to be solved. So it’s very important that there is time in my schedule to read and go to the library, which is my personal happy place. That’s largely about it. At the moment, these are the things I want to consciously fill my days with. Knowing what truly matters also helps me to have some form of clarity about the shape my life should take, and what to be “productive” about. In the midst of life’s chaos, I guess this is my own way of finding some semblance of order. The question of what tools I use to effectively organize my life and fit all these into my days is an article for another day. But first, what is important to you? Have you ever given it any thought? – – – #mc_embed_signup{background:#fff; clear:left; font:14px Helvetica,Arial,sans-serif; }<br /> /* Add your own MailChimp form style overrides in your site stylesheet or in this style block.<br /> We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */<br /> Subscribe to my mailing list to get my new article + newsletter once a week! November 18, 2017July 20, 2020 Rebecca Toh"
