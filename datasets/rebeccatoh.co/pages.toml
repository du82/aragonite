["https://rebeccatoh.co/interesting"]
title = "interesting – rebeccatoh.co"
description = "I’m always looking for people who use interesting ways to say things or who use interesting ways to live life. In some weird way that keeps me alive. At my core I am interested in people and …"
full_description = "interesting blog I’m always looking for people who use interesting ways to say things or who use interesting ways to live life. In some weird way that keeps me alive. At my core I am interested in people and their stories, even though I know people’s stories can be completely made up. Recently I got interested in Fujii Kaze. I would use the word ‘interesting’ to describe him. When I dig deeper I think I’m attracted to him because he is okay with dancing badly on stage and posting ugly photos of himself on social media even though he is a great dancer and a good-looking guy. And also because he sings while playing the piano on the floor and eats a lot of vegetables and writes his own songs and once he said (and I paraphrase badly) “I am not perfect of course but I want you to know that there is a perfect being inside of you”. His charisma comes from his lack of aversion to showing his true self. He is comfortable with being ugly and dorky and weird and talented and spiritual. His comfort with himself translates into a sense of comfort that wraps the people who watch him in a warm cosy hug. It’s very healing. * I keep wanting to go watch “Perfect Days” in the cinema but I keep putting it off. Procrastination is a bitch. * I like the feeling of having a new thought. It’s not something that happens very often. Sometimes the same loops just repeat themselves until I get bored. But a new thought! It’s like a mini-firework going off in my head. The trouble is connecting that new thought to new actions. Maybe I’m a pragmatic person after all. When my thoughts are looping I know I’m only running on the spot, procrastinating or being stuck in my patterns. But when a new thought comes, it means there’s some breakage in the loop. This ability to consciously break the loop is the result of more awareness, I think. I hope. And now, to allow that new thought to take root and to become behaviour. That’s a different challenge. * These days I’m trying to write whenever I have the time. Instead of writing only when I make myself sit down to write and doing it for an hour, and thinking that is the right way to do it, I’m trying to write whenever and wherever. It’s actually not too different from what I’ve always been doing. The difference is now I am also allowing myself to see that these little notes I’m writing are not just discardable notes but smaller parts of a bigger piece of work. * Someone else’s thought that became mine: “It’s not about what we do but how we do things.” March 28, 2024March 29, 2024 Rebecca Toh"
