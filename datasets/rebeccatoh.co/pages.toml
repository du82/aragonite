title = "Rebecca Toh – Page 3 – rebeccatoh.co"
full_description = "22.11.23 AI, blog “We could have gone off and just built this in our building here for five more years,” he said, “and we would have had something jaw-dropping.” But the public wouldn’t have been able to prepare for the shock waves that followed, an outcome that he finds “deeply unpleasant to imagine.” Altman believes that people need time to reckon with the idea that we may soon share Earth with a powerful new intelligence, before it remakes everything from work to human relationships. ChatGPT was a way of serving notice.” From here. Quite possibly the scariest paragraph I’ve read in awhile. November 22, 2023November 22, 2023 Rebecca TohLeave a comment iain banks blog, writing Discovering Iain Banks feels almost like the first time I read Anthony Bourdain. It’s a feeling of pure electricity. It will forever be an honor to read words written by beings who’re born to write. People like these are not just writers, but conduits of forces that are spiritual or alien or out-of-this-world. They remind me that the world isn’t just so. There is definitely something beyond, but what? In the meantime art and writing and music and the countless results of inspired creativity will sustain us here, until we get there, whatever and wherever that is. As always, I’m a little late. Iain Banks is no longer with us. But I read a really beautiful obituary about him in The Guardian and I feel… satisfied. My satisfaction comes from knowing that he had lived a life filled with most of the things he wanted – books, writing, readers, the chance to live in his imagination, and the ability to warp the shape of this universe through his thoughts. I’m satisfied, and I hope Iain Banks was too. August 25, 2023December 9, 2023 Rebecca TohLeave a comment old iterations of my desks blog These are from about 2005 and 2012 respectively. PS: Don’t we just love a good desk. August 25, 2023August 25, 2023 Rebecca Toh1 Comment thank you for signing my guestbook blog I check my guestbook once in awhile and I’m always pleasantly surprised when I see new entries in them. I just wanted to take the opportunity to say, THANK YOU for signing my very old-school-relic of a guestbook. It might be me holding on desperately to the nostalgia-tinged days of the early web, but thank you for indulging me. And also, I lost my password to the guestbook so I can’t reply you guys. Yet. When I find some time, I will log in again and reply to each of you. In the meantime, if you have included your website/blog link, know that I’ve definitely checked you out and bookmarked you 😉 Stay close! August 25, 2023August 25, 2023 Rebecca TohLeave a comment"
