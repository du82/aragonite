full_description = "Living in the real world blog Life in the not-real world (books, the internet, your own head) is easy. You don’t need to make real effort or real progress, and even if you fail there is only you. The not-real world is safe and comforting, as long as you remain in it. But in the end you have to exit the not-real world and make a bid at living in the real world. Your friends and family are there. Your problems and responsibilities are there. You are absolutely needed in the real world. And in the end, it’s the real world that can give you the real good stuff. Escape when needed, but come back and live in the real world. You’re missed. December 8, 2020 Rebecca Toh"
