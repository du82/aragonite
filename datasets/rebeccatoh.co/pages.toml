title = "Wherever we go, there we are – rebeccatoh.co"
description = "The sun beats down in Denver, and yet the heat doesn’t feel oppressive. When evening comes around, the air cools and a comfortable, warm breeze envelops the Mile High City. In the distance – …"
full_description = "Wherever we go, there we are blog, travel The sun beats down in Denver, and yet the heat doesn’t feel oppressive. When evening comes around, the air cools and a comfortable, warm breeze envelops the Mile High City. In the distance – but not too far away – the majestic Colorado mountains rise up and frame the skyline. I never imagined I’d find myself in Denver, the city of Dean Moriarty’s ghost (fellow fans of Jack Kerouac’s “On the Road” will understand this reference), but yes, I’m officially 9,000 miles away from home. Our Lyft driver, upon finding out we’re Singaporeans, exclaimed, “You have come from so far away!” But nowhere is too far away. Nowadays everywhere is a flight or two away. Distance is no longer measured in miles but hinges more on how willing we are to go away. If we imprison ourselves with reasons as to why we shouldn’t go here or do that, then it’s true, everywhere is too far away and everything is too impossible. So why am I in Denver? The honest answer is, I’m here for no reason. We wanted to spend a month in the States, and since we were visiting our friends in Portland and our flight home to Singapore would depart from San Francisco, we figured we would visit a few cities along the way. So Denver it is, then Chicago and New Orleans after. Wherever we go, there we are. August 15, 2019February 21, 2020 Rebecca Toh"
