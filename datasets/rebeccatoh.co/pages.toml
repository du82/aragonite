full_description = "madness blog I appreciate the madness in you. Yes I’d actually prefer it if you were a little mad. This means we’re the same. Although sameness means nothing. It just means we’re not alone. September 17, 2024 Rebecca TohLeave a comment somewhere blog Still working on my little community library project and I’m still feeling stupidly happy about everything, even though there’re about 200 more things to do than I’d imagined. I do think I was led by life to this moment. Although I can say the same thing about every moment before this, this very moment just feels more comfortable, more right, more interesting, more filled with potential, more effortless, even though there is a lot of work involved. I’ve always loved libraries. They are a glimpse of the kind of ‘better world’ we all want to live in. That’s because by their very nature they are inclusive and welcoming. Anyone who walks through the doors of a library is reminded, just by inhaling the air of the library, just by being embraced by its atmosphere, to be a kinder and more caring person, and to forget, for a moment, the usual rules of our capitalistic society. A library is a good place. July 8, 2024August 15, 2024 Rebecca TohLeave a comment casual poet library blog Since my last post a month ago, I have fallen into a new adventure — I’m building a shared library in Singapore. It all started from this Instagram post. I found a shop space within three days of the post and now I’m waiting to confirm our design plans before starting renovations. We have 180 people on board with us as bookshelf-owners. You can read some of the updates on this crazy journey via my latest posts on Instagram. So what’s Casual Poet Library? It’s a shared library in the heartlands of Singapore run entirely by individuals in the community. Each individual pays a small amount of money every month to be a bookshelf-owner. On each shelf, bookshelf-owners share about themselves and their book recommendations via little note cards, and tend to their shelves like they are tending to a (book) garden. The library is open to everyone and all books are for people to browse and borrow. I went into this thinking it was about books. After all I’ve dreamed about opening a bookstore all my life. But the more I worked on the project the more I realised it’s about community, about building bridges between people, about the revitalisation of actual places and also actual hearts. Feeling really energised and excited about this and will share more updates along the way! June 8, 2024June 12, 2024 Rebecca Toh4 Comments"
