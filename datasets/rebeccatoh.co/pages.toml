description = "“There is a word in Buddhism that means ‘wishlessness’ or ‘aimlessness’. The idea is that you do not put something in front of you and run after it, because everything…"
full_description = "aimlessness blog, buddhism, meditation, mindfulness “There is a word in Buddhism that means ‘wishlessness’ or ‘aimlessness’. The idea is that you do not put something in front of you and run after it, because everything is already here, in yourself. While we practice walking meditation, we do not try to arrive anywhere. We only make peaceful, happy steps. If we keep thinking of the future, of what we want to realize, we will lose our steps. The same is true with sitting meditation. We sit just to enjoy our sitting; we do not sit to attain any goal. This is quite important. Each moment of sitting meditation brings us back to life, and we should sit in a way that we enjoy our sitting for the entire time we do it. Whether we are eating a tangerine, drinking a cup of tea, or walking in meditation, we should do it in a way that is ‘aimless’.” — “Peace is Every Step”, Thich Nhat Hanh July 28, 2020July 28, 2020 Rebecca Toh"
