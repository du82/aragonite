full_description = "a single blooming bulb blog Kathleen Fisher is one of my favourite writers on the internet. Everything she writes draws me in effortlessly. I don’t know how she does it. From her latest blog post “From That to This”: “During that awful time when Covid was ravaging the world, I watched a news report about a woman whose mother died, like most alone in a hospital ICU. The funeral was held in a parking lot and she sat on a folding chair underneath a canopy next to her mother’s casket where friends and family drove by to pay their respects. Such a contrast to Mark’s funeral, and I wondered how it is possible to survive the heartache of not only losing your mom, but then having to say your goodbyes on top of asphalt while people shouted condolences from car windows. And yet somehow, I, like so many others have survived the heartache of the unimaginable. I’ve learned, I’ve changed far more than anyone realizes, I have oh-so-delicately dipped my toes into the pool of life and tested the water. This go ’round, though, is different. Because I am too familiar with how fragile this all is, the best approach for me is to live smaller and quieter. Will it always be like this? I don’t know, but I do know it’s the reason the beauty of a single blooming bulb in the darkest time of the year made me yearn for more of that.” April 2, 2023June 22, 2023 Rebecca Toh"
