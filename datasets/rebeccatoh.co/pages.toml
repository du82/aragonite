["https://rebeccatoh.co/a-letter-by-georgia-okeeffe"]
title = "a letter by Georgia O’Keeffe – rebeccatoh.co"
description = "“To Anita Pollitzer Canyon, Texas 11 September 1916 Tonight I walked into the sunset — to mail some letters — the whole sky — and there is so much of it out here — was just blazing — and grey blue …"
full_description = "a letter by Georgia O’Keeffe blog “To Anita Pollitzer Canyon, Texas 11 September 1916 Tonight I walked into the sunset — to mail some letters — the whole sky — and there is so much of it out here — was just blazing — and grey blue clouds were rioting all through the hotness of it — and the ugly little buildings and windmills looked great against it. But some way or other I didn’t seem to like the redness much so after I mailed the letters I walked home — and kept on walking — The Eastern sky was all grey blue — bunches of clouds — different kinds of clouds — sticking around everywhere and the whole thing — lit up — first in one place — then in another with flashes of lightning — sometimes just sheet lightning — and sometimes sheet lightning with a sharp bright zigzag flashing across it —. I walked out past the last house — past the last locust tree — and sat on the fence for a long time — looking — just looking at the lightning — you see there was nothing but sky and flat prairie land — land that seems more like the ocean than anything else I know — There was a wonderful moon — Well I just sat there and had a great time all by myself — Not even many night noises — just the wind — I wondered what you are doing — It is absurd the way I love this country — Then when I came back — it was funny — roads just shoot across blocks anywhere — all the houses looked alike — and I almost got lost — I had to laugh at myself — I couldnt tell which house was home — I am loving the plains more than ever it seems — and the SKY — Anita you have never seen SKY — it is wonderful — Pat.” April 1, 2024 Rebecca Toh Steffen says: April 1, 2024 at 6:06 pm That’s a wonderful story to share, thanks very much! Kind regards from Frankfurt/Germany Reply"
