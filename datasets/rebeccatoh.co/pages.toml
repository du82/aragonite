title = "learning – rebeccatoh.co"
full_description = "learning and teaching blog, learning This talk really ignited something in me. Deserves repeated viewings – for people interested in learning and teaching, and especially for those who believe in the expansion of the human spirit and mind through learning and teaching. November 22, 2020 Rebecca TohLeave a comment new education blog, learning Watching Outlier with intense interest. Might even take one or two of their courses and earn some college credits in the process. Just for fun! November 21, 2020November 21, 2020 Rebecca TohLeave a comment 100 online courses blog, learning, self-education “After 73 days of self-paced learning, I’ve become a firm believer that learning, or more importantly, knowledge, should never be a privilege, it is a right. While we should all work towards a particular goal in our career (in my case, to become a doctor and find ways to improve our public healthcare systems), my insight from taking these courses has made me realise that we should not limit ourselves to just our career-centric fields alone. Because we are the sum of what we learn, in school, at work and in life.” The quote is from this interesting article about a girl who took 100 online courses during 73 days of COVID lockdown. Oddly inspiring! September 7, 2020September 7, 2020 Rebecca TohLeave a comment student blog, learning I have realised that I prefer to be a student rather than a teacher. There’s less pressure and I get to ask questions rather than provide answers. And I can fail as much as I want to—it’s almost the imperative of a student to fail, in order to stumble her way towards learning more. But in the end every student is a teacher and every teacher (if she wants to be effective) is a student. We must maintain an openness and a love and hunger for life-long learning. If we stop learning, we become birds whose wings are clipped. We cannot fly without our wings. July 27, 2020August 7, 2020 Rebecca TohLeave a comment A list of potential ultralearning projects blog, learning, ultralearning Here are some ideas on my own want-to-ultralearn backburner list: – Making my own electronic music (releasing an album of electronic music, a la Lullatone) – Editorial design (creating layouts for books and magazines) – Illustrating and writing a children’s book – Making a short film – Creating an online course – Creating an app – Writing a book – Building my blog from scratch I’ll update this whenever a new one comes to mind! July 7, 2020July 7, 2020 Rebecca Toh2 Comments"
