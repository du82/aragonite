["https://recon.cx/2014"]
title = "REcon - Home"
description = "REcon # Montreal Security Conference # Reverse Engineering Training"
full_description = '''REcon is a computer security conference with a focus on reverse engineering and advanced exploitation techniques. It is held annually in Montreal, Canada. The conference offers a single track of presentations over the span of three days along with technical training sessions held before the presentation dates. Technical training varies in length between two and four days. 2014/08/18 Recon 2015 will be held on 19-21 June 2015, with training sessions happening on 15-18 June 2015. It will be at the same venue, the Hyatt Regency Montreal. 2014/05/23 The Hyatt is currently sold-out on some conference dates, please visit our travel page to find alternatives nearby. 2014/05/19: Talk selection has been finalized: - Keynote by Eva Galperin from EFF - DRM obfuscation versus auxiliary attacks by Mougey Camille and Francis Gabriel - Exploring the feasability of a hard drive backdoor by Jonas Zaddach - Rewriting x86 Binaries: Many PEs, Such Secure, Wow. by Wartortell - Exploit tips and techniques by William Peteroy and Swamy Gangadhara - Reversing on the Edge: Traversing the paths for using GraphDBs in RE by Jasiel Spelman and Jason Jones - Glitching For n00bs - A Journey to Coax Out Chips' Inner Secrets by exide - Going gets tough: a tale of encounters with novel evasive malware by Marta Janus - Power Analysis and Clock Glitching with the Open-Source ChipWhisperer Platform by Colin O'Flynn - Memory Tracing: Forensic Reverse Engineering by Dominic Fischer and Endre Bangerter - PIN-Point Control for Analyzing Malware by Jason Jones - Performing Open Heart Surgery on a Furby by Michael Coppola - Fuzzing and Patch Analysis: SAGEly Advice by Richard Johnson - Shall we play a game? Lessons learned while playing CoreWars8086 by Elad Shapira ("Zest") - Reverse Engineering Flash Memory For Fun and Benefit by Matt Oh - Automatic Reverse Compilation & Semantic Comprehension by Christopher Abad (aempirei) - FunCap by Andrzej Dereszowski - How do I RE object oriented c