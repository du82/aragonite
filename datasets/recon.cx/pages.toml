["https://recon.cx/2025/travel.html"]
title = "REcon - Travel Info"
description = "REcon # Montreal Security Conference # Reverse Engineering Training"
full_description = "No proof of vaccination nor covid test are require to enter Canada (unless exemptions). See link below for details: As of last year many foreign travelers to Canada will require an Electronic Travel Authorization (eTA) prior to entering the country. Please check the following website to find out if this applies to you: By Air: Arriving at the YUL airport, you can decide to take the Bus or a Taxi to get to the Hotel. A Taxi will cost you a flat 41$(+tip) fee to the Montreal Downtown area, where the Hilton Double tree is located. A pass for the Airport Shuttle Bus 747 will cost you 10$, and should be bought at one of the STM stands nearby prior to taking the bus if you don't have exact change in coins, this pass will also be valid for unlimited metro area public transport for 24 hours. The shuttle bus stop the closest to the Hilton Double Tree is located on corner of Jeanne-Mance, and is referred to as stop number 7. It is about a one-minute walk to the hotel form there. By Rail: The Montreal Central Train Station is located 1km away from the Hilton Double Tree Montreal. The Hilton Double Tree Montreal is located downtown, in the heart of the Quartier des Spectacles. It is part of the Complexe Desjardins. Inside the Complexe Desjardins you will find a multitude of Shops, Kiosks and Snacks, including some Carriers (Rogers, Videotron, Fido), a grocery store, a liquor store, a food court, a small electronics store (The Source), etc. This year Recon is overlaping with Festival International de Jazz de Montreal. For more up to dates information please visit Things to do this week. Montreal is a French/English bilingual city. While the official language of the province is French, most people living in Montreal are bilingual."
