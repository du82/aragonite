full_description = "REcon is a computer security conference with a focus on reverse engineering and advanced exploitation techniques. It is held annually in Montreal, Canada since 2005. This year mark the 20th anniversary of Recon. We are the premier Reverse Engineering and Security conference. The conference offers a single track of presentations over the span of three days along with 4 days of technical training sessions held before the presentation dates. The registration fee includes an access pass to the conference as well as lunch, and coffee breaks for all three days of the conference, as well as Welcome cocktail on the Thursday and a party on Friday and on Saturday. Provincial and federal sales taxes will be applied to all registration fees. All registration fees are payable in Canadian dollars (CAD). Trainings will be held at Hilton Double Tree, at Maison du Development Durable , which is near the hotel (2 minute walk or 170m), as well as Hotel Monville (see below for the list of trainings held there). The food service for La Maison du Development Durable is also at the Hilton Double Tree, where students are suggested to stay. It is recommended that you book the hotel early. A special rate has been arranged for Recon attendees who wish to stay at the Hilton Double Tree Montreal. The cut-off date for the special Recon rate is May 23rd. You can also make a reservation by telephone: 1-514-379-2000 and mentioning the event code RECON0625."
