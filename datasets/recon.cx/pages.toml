full_description = '''We're pleased to announce our 2008 conference lineup. More talks will be added as they are confirmed. The conference will be composed of 30 and 60 minutes talks on a single track, and will have lightning talks during Recon Party. Nicolas Brulez - Polymorphic Virus Analysis updated Pierre-Marc Bureau - How I learned Reverse Engineering with Storm updated Tiller Beauchamp - RE:Trace - Applied Reverse Engineering on OS X updated Sharon Conheady and Alex Bayly - Social Engineering for the "Socially Inept" Bruce Dang - Methods for analyzing malicious Office documents updated Sébastien Doucet - 64-bit Imports Rebuilding and Unpacking updated Thomas Garnier - Windows privilege escalation through LPC & ALPC interfaces updated Cameron Hotchkies - Under the iHood updated Eric D. Laspe - The Deobfuscator updated Anthony de Almeida Lopes - Bypassing Security Protections by Backdooring libc updated Aaron Portnoy and Ali Rizvi-Santiago - Reverse Engineering Dynamic Languages, a Focus on Python updated Nicolas Pouvesle - NetWare kernel stack overflow exploitation updated Jason Raber - Helikaon Linux Debuger updated Gera - Two very small reverse engineering tools: a python disassembling engine and an iterative reverse engineering framework updated Craig Smith - Creating Code Obfuscation Virtual Machines updated Pablo Sole - RE over Adobe Acrobat Reader using Immunity Debugger updated Alexander Sotirov - Blackbox Reversing Of XSS Filters updated 09.00-10.30 : Breakfast / registration 10.30-11.30 : Pierre-Marc Bureau - How I learned Reverse Engineering with Storm 11.30-12.30 : Bruce Dang - Methods for analyzing malicious Office documents 12.30-14.00 : Lunch / IITAC Workshop Part 01 14.00-15.00 : Ilfak Guilfanov - Building plugins for IDA Pro 15.00-16.00 : Thomas Garnier - Windows privilege escalation through LPC & ALPC interfaces 16.00-16.30 : Break 16.30-17.30 : Nicolas Pouvesle - NetWare kernel stack overflow exploitation 17.30-18.30 : Cameron Hotchkies - Under the iHood 21.00-21.30 : Start of Recon Party - Lighting talks (5mn slots) 21.30-22.30 : Social Time 22.30-23.00 : Lighting talks (5mn slots) 23.00-03.00 : Party'''
