["https://recon.cx/2025/trainingRustDevelopmentforCyberSecurity.html"]
title = "Recon Training - Rust Development for Cyber Security by Tanguy Duhamel & Christophe Matthieu"
description = "REcon # Montreal Security Conference # Reverse Engineering Training"
full_description = "The Rust Development for Cyber Security training is a 4-day intensive program designed to equip participants with the skills to use Rust for building robust defensive and offensive security tools. Starting with Rust fundamentals, including memory safety, concurrency, and modular design, the course progresses into practical applications such as OSINT tools, in-memory forensics, port scanning, and Remote Access Tool (RAT) development. The training culminates in a hands-on project to build an antivirus and Endpoint Detection and Response (EDR) tool, integrating network traffic monitoring and advanced forensics. Combining theory with practical exercises, this course prepares participants to apply Rust effectively in real-world cybersecurity scenarios. Tanguy Duhamel is the Lead Developer on FuzzingLabs' distributed fuzzing platform, collaborating with Patrick Ventuzelo on code auditing, fuzzer development, and security research. His research focuses on advancing distributed fuzzing techniques to improve software security, with a strong foundation in Rust for building high-performance tools. Christophe Matthieu is a security engineer who studied Computer Science and Offensive Security, with experience in major companies across critical sectors such as energy, banking, and automotive. Now part of FuzzingLabs, he works as a security researcher specialising in hardware and network security."
