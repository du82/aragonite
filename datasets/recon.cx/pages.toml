full_description = "This fast-paced 4-day course will introduce students to reverse engineering Linux malware, starting off with a dense recap of x86-64 reverse engineering and Linux internals, leading through common and advanced Linux malware, Linux evasion tricks and packers, and closing off with a primer on analysis automation using scripting of a reverse engineering framework. Students will walk away with a deep understanding of Linux binary analysis techniques and knowledge of the Linux threat landscape, being able to dissect advanced Linux malware in their day to day operation. Prior knowledge of x86-64 reverse engineering and basic scripting skills ideal. Beginners are welcome, but learning curve will be steep. Environment set up before the class required, instructions will be sent out prior."
