["https://recon.cx/2025/trainingAutomatingReverseEngineeringwithMachineLearning.html"]
title = """
Recon Training - Automating Reverse Engineering with Machine Learning, Binary Analysis, and Natural Language
\t\tProcessing by Malachi Jones & Joe Mansour"""
description = "REcon # Montreal Security Conference # Reverse Engineering Training"
full_description = "This course enhances reverse engineering (RE) processes through automation, focusing on efficiency and scalability in malware and firmware analysis by integrating Neural Networks (NN), Natural Language Processing (NLP), and Large Language Models (LLMs). Participants will be introduced to Blackfyre, an open-source platform developed for the course, featuring a Ghidra plugin for initial data extraction of a binary into a Binary Context Container (BCC), and a Python library for advanced data parsing and lifting to VEX Intermediate Representation (IR). These features of Blackfyre are pivotal in facilitating the analysis and extraction of data and metadata, which are critical for effectively applying NN, NLP, and LLM techniques in RE tasks. The course's primary objective is to impart foundational knowledge and practical methodologies in RE automation, equipping learners with essential tools and skills. It emphasizes the application of these foundational elements, enabling learners to effectively utilize them in their independent projects, while not necessarily aiming to provide a complete end-to-end automation solution. As the course progresses, students delve deeply into Neural Networks (NN) and Natural Language Processing (NLP), crucial for addressing significant challenges in reverse engineering. NLP plays a pivotal role by converting textual elements into numerical 'embeddings,' making them compatible for analysis by NN models. In malware analysis, these technologies are instrumental for tasks like binary classification and anomaly detection, while in firmware analysis, they assist in predicting function and binary names and detecting similarities between binaries/functions. The course introduces the BinaryRank algorithm, inspired by PageRank but tailored for static analysis in reverse engineering. BinaryRank assigns a global ranking to basic blocks by analyzing a binary's call graph and function control flow graphs. This ranking system emphasizes the relevance/importance of textual elements in binaries, such as strings, import function names, and function names, which is crucial in NLP applications. Unlike PageRank's complex computational cost, BinaryRank operates more efficiently with a linear computational cost, making it highly suitable for binary analysis. This approach, combined with Contrastive Learning, enhances the accuracy and relevance of NLP techniques in analyzing and representing binaries. The course reinforces these concepts through hands-on labs. In the advanced module of the course, LLMs are presented to systematically distill and condense vital reverse engineering artifacts and data generated from static and dynamic analysis (e.g. sandbox detonation), enhancing their clarity and interpretability. The module begins by highlighting the capabilities of LLMs in function and whole-binary summarization, keeping in mind the token constraints of models like GPT-4o, GPT-3.5, and llama-2. To overcome these limitations, the module explores subsampling as a primary tool, allowing for targeted analysis while maintaining data relevance. Discussions also cover LLM-assisted malware analysis, aiming to generate malware signatures and comprehensive malware analysis reports that encapsulate vital details, streamlining information for reverse engineers. To ensure a practical grasp of these concepts, multiple labs are integrated throughout this module, specifically focusing on subsampling methods, function and whole-binary summarization techniques, and LLM-assisted malware analysis for malware signature and comprehensive report generation. This course is designed for reverse engineering practitioners with a strong foundation in reverse engineering concepts and proficiency in Python object-oriented programming for hands-on labs. Participants should also have a basic understanding of mathematical concepts (e.g., vectors, weighted averages, and Euclidean distance) and foundational Machine Learning (ML) knowledge, including supervised learning, feature extraction, and evaluation metrics (e.g., precision and recall). This background is essential for engaging with advanced ML topics such as transformers and fine-tuning Large Language Models (LLMs). By meeting these prerequisites, participants will gain practical skills in automating reverse engineering tasks using AI/ML, NLP, and LLMs."
