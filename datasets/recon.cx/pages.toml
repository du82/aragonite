["https://recon.cx/2025/trainingFuzzingWindowsUserlandApplications.html"]
title = "Recon Training - Fuzzing Windows Userland Applications by Patrick Ventuzelo & Kylian Boulard de Pouqueville"
description = "REcon # Montreal Security Conference # Reverse Engineering Training"
full_description = "Instructors: Patrick Ventuzelo & Kylian Boulard de Pouqueville Dates: June 23 to 26 2025 Capacity: 25 Seats This intensive 4-day training equips participants with cutting-edge fuzzing techniques and real-world applications, focusing on Windows environments, structured file fuzzing, and advanced vulnerability research. The training combines theoretical foundations, practical labs, and case studies to prepare participants for professional fuzzing and vulnerability discovery challenges. The first day of training introduces foundational fuzzing techniques, emphasizing the use of winAFL on the library. Participants will delve into core fuzzing concepts, including effective corpus generation and advanced techniques to enhance the fuzzing harness. Hands-on exercises will guide participants in creating a basic harness to handle various archive formats. A practical case study on code execution vulnerabilities in WinRAR illustrates real-world applications of fuzzing within Windows environments. On the second day, the training focuses on fuzzing IrfanView using tools such as winAFL, Jackalope, and Lighthouse to enhance the analysis and triaging process. Participants will learn essential triaging techniques, conduct coverage analysis, and apply debugging strategies to uncover vulnerabilities. In a hands-on lab, participants will rediscover a remote code execution (RCE) vulnerability in PSP files and expand their fuzzing skills by working with WEBP formats. A comprehensive ZDi report on fuzzing IrfanView provides insights into professional vulnerability research practices. Day three emphasizes grammar-based fuzzing techniques, focusing on applications that handle PDF files, such as PDF-XChange and IrfanView's PDF plugin. Participants will explore fuzzing methodologies for complex file structures and gain skills in reversing binaries without symbols—a critical technique in real-world vulnerability research. Key resources include the latest industry reports and an ICSE research paper contextualizing these fuzzing techniques within modern security research."
year_published = 2025
