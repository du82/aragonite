["https://recon.cx/2025/trainingBugHuntingInHypervisors.html"]
title = "Recon Training - Bug Hunting in Hypervisors by Corentin Bayet and Bruno Pujos"
description = "REcon # Montreal Security Conference # Reverse Engineering Training"
full_description = "Hypervisors are complex software that play a critical role in modern infrastructure, but like any software, they-re not immune to flaws which can be exploited by sophisticated attackers. This training dives into the technical depths of virtualization technologies and explores the flaws leading to virtual machine (VM) escapes. During this training, you will be able to sharpen your skills on multiple platforms from the initial analysis of a target to exploiting real world vulnerabilities. The course explores the attack surfaces hypervisors expose to their guests, both statically and dynamically. By breaking down how virtual machines communicate with hypervisors and their internal components, participants will learn to apply their existing vulnerability research and exploitation skills to any virtualization software. The training also provides detailed insights for each studied target, including their architectures, typical vulnerabilities, and guidance for effective bug hunting. This course is ideal for security researchers and vulnerability analysts who are already familiar with low-level systems programming and common exploitation techniques but are new to hypervisor internals. By the end of the training, participants will have a solid foundation in virtualization attack surfaces and vulnerability research as well as the ability to craft proof-of-concept exploits targeting hypervisors. Students will learn how virtual machines communicate with hypervisors and how to replicate these interactions for bug hunting: Participants will learn to effectively navigate both open-source and proprietary hypervisor codebases: Trainers will outline a structured approach to identifying and exploiting vulnerabilities in hypervisors: Assignments are divided into several steps and integrated throughout each day of training. Each day focuses on a different hypervisor to demonstrate the concepts covered. For each target, students will have the opportunity to analyze and exploit at least one real-world n-day vulnerability that impacted the hypervisor."
