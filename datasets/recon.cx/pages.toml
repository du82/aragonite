["https://recon.cx/2025/trainingPatchDiffingInTheDark.html"]
title = "Recon Training - Patch Diffing In The Dark: CVE guided VR by John McIntosh"
description = "REcon # Montreal Security Conference # Reverse Engineering Training"
full_description = "Every day, new vulnerabilities are disclosed through CVEs (Common Vulnerabilities and Exposures) or detailed in blog posts, often leaving individuals aware of the issue but uncertain about how to dive deeper into its root cause. This course is designed for those who want to move beyond surface-level understanding and develop the skills to dissect modern vulnerabilities systematically. By mastering binary patch diffing - an essential skill for reverse engineering, vulnerability research, and malware analysis - you'll gain the ability to identify security-relevant changes in closed-source binaries and uncover the underlying issues that make them exploitable. By honing these skills, you'll be equipped to embark on - or elevate - your journey in vulnerability research. This fast-paced course will teach you how to reverse engineer real-world CVEs on Windows using open-source tools. Starting from a simple description of a vulnerability, you'll progress to identifying its root cause through hands-on exercises. The training emphasizes practical application, focusing on analyzing recent CVEs and their corresponding binaries. You'll learn a step-by-step approach to modern patch diffing, including best practices, common pitfalls to avoid, and useful scripts to enhance your workflow. In addition to patch diffing, the course focuses on both static and dynamic vulnerability analysis, allowing you to develop exploits and exercise the vulnerabilities you identify (and even learn to use AI to kickstart your POCs!). With short topical lessons and practical exercises, you'll gain confidence in your ability to analyze and understand modern vulnerabilities. Don't let gaps in your knowledge keep you in the dark - take a step into the light. Sign up for this course and learn the skills needed to transition from knowing about a vulnerability to truly understanding it. The goal of this course is to teach participants how to use patch diffing techniques to analyze real-world vulnerabilities in Windows. Students will use open-source tools like the Ghidra SRE framework to reverse engineer the latest CVEs. The course will help you discover that you already have the information and tools needed to get started today. This course will help students develop the confidence and competence to reverse engineer and discover complex vulnerabilities.By honing these skills, you'll be equipped to embark on - or elevate—your journey in vulnerability research. This course focuses on the three fundamental pillars of vulnerability research via a CVE-guided approach: 1. Vulnerability Discovery 2. Vulnerability Analysis 3. Exploit Development By following a step-by-step (CVE) methodology, we uncover vulnerabilities and treat CVEs as north stars to navigate and understand security vulnerabilities. The best part about the training is that there is no secret ingredient. Using free tools (Ghidra SRE framework, BinDiff, and more) and leveraging readily available CVE information, you will learn how to discover and analyze complex vulnerabilities. The course, via hands-on exercises and lectures that cover real-world CVEs challenges, provides students with practical reverse engineering exercises to help them learn and practice the concepts and techniques. Participants will discover that you can leverage CVEs as a guide for reverse engineering and vulnerability research."
year_published = 2025
