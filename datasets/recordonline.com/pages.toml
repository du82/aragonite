["https://recordonline.com/picture-gallery/news/transportation/2024/01/17/port-authority-of-new-york-and-new-jersey-images/72060806007"]
title = "What Port Authority of New York and New Jersey does: Photos"
description = "The bi-state agency oversees two tunnels, four bridges, five airports, the World Trade Center and more, as seen in these photos dating to the 1920s"
full_description = '''TRANSPORTATIONEverything the Port Authority of NY and NJ does in photos... Teterboro Airport in Bergen County ...Tariq Zehawi/NorthJersey.com... John F. Kennedy International in Queens ...Courtesy Of The Port Authority Of NY And NJWhat does the Port Authority of New York and New Jersey do? It oversees five airports: Newark Liberty ...Tariq Zehawi/NorthJersey.com... LaGuardia Airport in Queens ...Courtesy Of The Port Authority Of NY And NJ... and Stewart International Airport in Orange County, New York.Courtesy Of The Port Authority Of NY And NJThe Port Authority operates four metro area bridges: The George Washington Bridge ...Danielle Parhizkaran/NorthJersey... the Goethals Bridge between Elizabeth, New Jersey and Staten Island ...Mike Dombrowski/Port Authority Of NY And NJ... the Outerbridge Crossing between Perth Amboy and Staten Island ...Courtesy Of The Port Authority Of NY And NJ... and the Bayonne Bridge between Bayonne and Staten Island.Mike Donmrowski/Port Authority Of NY And NJThe Port Authority operates the two tunnels beneath the Hudson River that link North Jersey to Manhattan -- the Holland, from Jersey City ...Mihai Andritoiu/Port Authority Of NY And NJ... and the Lincoln Tunnel from Weehawken, New Jersey.Courtesy Of The Port Authority Of NY And NJThe agency operates the Port Authority Midtown Bus Terminal in Manhattan, the largest bus station in the nation and the busiest in the world.Mitsu Yasukawa/NorthJersey.comIt also operates the George Washington Bridge Bus Station in Manhattan, seen here, and the Journal Square Transport Center in Jersey City.Courtesy Of The Port Authority Of NY And NJIt oversees the World Trade Center site in lower Manhattan, a 16-acre campus that’s home to the Freedom Tower…James M. O'Neill/NorthJersey.com..the Oculus Transportation Hub -- designed by Santiago Calatrava to look like a hand releasing a dove -- which has 12 subway lines, a PATH station, and dozens of retailers ...James M. O'Neill/NorthJersey.comthe 9/11 Memorial, with reflecting pools on the site of the Twin Towers, a 9/11 museum, several other office towers…James M. O'Neill/NorthJersey.com… the Ronald O. Perelman Performing Arts Center, seen here, and more than 80 different retailers.Courtesy Of The Port Authority Of NY And NJThe Port Authority also operates the PATH train service between Jersey City and lower Manhattan ...Tariq Zehawi/NorthJersey.comAnd it operates the largest East Coast container port along Newark Bay and Brooklyn.Nick Souza/Port Authority Of NY And NJIn the early 1900s, maritime activity was intense along the Hudson River, and there was little cooperation between New York and New Jersey.Courtesy Of The Port Authority Of NY And NJAfter political negotiation, a compact between the two states was signed in 1921 to create The Port of New York Authority. The agency was mandated to develop and modernize the port area.Courtesy Of The Port Authority Of NJ And NJIn 1948 the Port Authority assumed responsibility to operate Port Newark. By 1951, Port Newark had become a modern terminal with 21 berths and a deepened 35-foot channel able to accommodate the largest ships.Courtesy Of The Port Authority Of NY And NJIn 1962, the Port Authority opened the world’s first container port, Elizabeth-Port Authority Marine Terminal. Elizabeth became known as America’s Container Capital.Nick Souza/Port Authority Of NY And NJToday the ports include two passenger cruise ship terminals in Brooklyn and Bayonne, seen here.Tariq Zehawi/NorthJersey.comIn 2020 the Port of New York and New Jersey handled cargo containers valued at nearly $200 billion.Nick Souza/Port Authority Of NY And NJIt’s the largest container port on the East Coast, handling nearly 4.3 million containers annually.Nick Souza/Port Authority Of NY And NJIn 2020 the largest vessel ever to call at the port was the CMA CGM Brazil, a new, ultra-large container ship wider than a football field and the length of more than four New York City blocks.Nick Souza/Port Authority Of NY And NJThe ship has a capacity of 15,072 twenty-foot equivalent units -- a measurement that represents the volume of a standard-sized 20-foot-long intermodal container.Nick Souza/Port Authority Of NY And NJOn its stop at the Elizabeth-Port Authority Marine Terminal the CMA CGM Brazil carried everything from fall and winter clothing to pharmaceuticals and furniture bound for retailers in New Jersey, New York and beyond.Nick Souza/Port Authority Of NY And NJDuring its New Jersey stay, more than 2,600 containers of goods were unloaded from the CMA CGM Brazil for delivery to regional retailers by truck or freight rail and nearly the same amount of exports were loaded on.Courtesy Of The Port Authority Of NY And NJConstruction on the George Washington Bridge began in the late 1920s.Courtesy Of The Port Authority Of NY And NJThe bridge, opened in 1931, crosses the Hudson River between Fort Lee and Manhattan.Courtesy Of The Port Authority Of NY And NJThe GWB's lower level opened in 1962. Here, New York Gov. Nelson A. Rockefeller arrives in a 1931 Packard for the dedication of the lower level.Courtesy Of The Port Authority Of NY And NJToday the George Washington Bridge is the most traversed bridge in the world, with 100 million vehicles crossing each year.Danielle Parhizkaran/NorthJersey.comIn 2017 the Port Authority began a decade long, $2 billion “Restoring the George" program. The 11 projects include replacing all 592 suspender ropes and handrails and main cable rehabilitation.Danielle Parhizkaran/NorthJersey.comThe GWB restoration projects also include installing an acoustic monitoring system throughout the main cables to monitor potential wire breaks.Danielle Parhizkaran/NorthJersey.comIn 2023 improvements were completed on the pedestrian and cyclist path on the north side of the George Washington Bridge and reopened to the public.Tariq Zehawi/NorthJersey.comOn nine holidays each year, the biggest free-flying American flag in the world is suspended vertically from the New Jersey tower of the George Washington Bridge.Tariq Zehawi/NorthJersey.comThe bridge has been featured in popular culture many times, from “The Godfather” movie to Hildegarde Swift's 1942 children's book “The Little Red Lighthouse and the Great Gray Bridge.”Bill Tompkins/NorthJersey.comThe Little Red Lighthouse, at the foot of the bridge’s Manhattan tower, is officially named Jeffrey's Hook Light.Thomas E. Franklin/NorthJersey.comThe original Goethals Bridge was one of the first projects spearheaded by the Port Authority. It crosses the Arthur Kill between Elizabeth, New Jersey and Staten Island.Courtesy Of The Port Authority Of NY And NJThe Goethals opened in 1928 and was named for Major General George W. Goethals, builder of the Panama Canal and the Port Authority’s first consulting engineer.Courtesy Of The Port Authority Of NY And NJThe old Goethals Bridge was dismantled and replaced by the new bridge in 2018.Mike Dombrowski/Port Authority Of NY And NJToday, nearly 36 million vehicles cross the Goethals Bridge annually.Courtesy Of The Port Authority Of NY And NJThe Outerbridge Crossing crosses the Arthur Kill between Perth Amboy and Staten Island. The Outerbridge was built as part of a project to accommodate increased interstate car traffic following World War I.Courtesy Of The Port Authority Of NY And NJThe Outerbridge Crossing opened to traffic on June 29, 1928, the same day as the Goethals Bridge.Courtesy Of The Port Authority Of NY And NJOriginally called the Arthur Kill Bridge, it was later named in honor of Eugenius H. Outerbridge, the Port Authority's first chairman who signed the compact between New York and New Jersey that created the agency. The bridge handles nearly 30 million vehicles a year.FileConstruction on the Bayonne Bridge began in 1928 and finished in 1931, several months ahead of schedule and $3 million under budget. It crosses the Kill Van Kull between Bayonne and Staten Island.Courtesy Of The Port Authority Of NY And NJThe site selected for the Bayonne Bridge paralleled an existing ferry service between Bayonne and Port Richmond, New York. By building over the ferry route, the planners preserved the street patterns of both towns.Courtesy Of The Port Authority Of NY And NJBecause rail lines were planned, the bridge's chief designer, Othmar H. Ammann went with a single, innovative, arch-shaped truss. He worked on the design with architect Cass Gilbert.Courtesy Of The Port Authority Of NY And NJThe suspended roadway was originally 150 feet high to allow the U.S. Navy's tallest ships in the 1930s to pass beneath. Here, a cargo ship makes its way under the bridge.Chris Pedota/NorthJersey.comIn 2019, the Bayonne Bridge’s roadway was raised another 64 to enable today’s much larger container ships to pass underneath. The project retained the bridge’s iconic parabolic arch.Chris Pedota/NorthJersey.comToday nearly 8 million vehicles use the Bayonne Bridge each year.Nick Souza/Port Authority Of NY And NJThe 1.6-mile Holland Tunnel, joining lower Manhattan and Jersey City, opened in 1927. It operated under two state commissions until the Port Authority took over in 1930.Courtesy Of The Port Authority Of NY And NJThe Holland Tunnel is named after its first chief engineer, Clifford M. Holland, who died before the tunnel was finished.Courtesy Of The Port Authority Of NY And NJFour ventilation buildings, two on each side of the Hudson River, house 84 immense fans that provide a change of air every 90 seconds. This innovation made the Holland Tunnel the first mechanically ventilated underwater vehicular tunnel.Courtesy Of The Port Authority Of NY And NJThe Holland Tunnel entrance in Jersey City shortly after it first opened. The two tubes are 8,371 and 8,558 feet long.Courtesy Of The Port Authority Of NY And NJThe Holland Tunnel's two tubes are 8,371 and 8,558 feet long.Courtesy Of The Port Authority Of NY And NJThe maximum depth of the Holland Tunnel roadway to high water is 93 feet.Mike Dombrowski/Port Authority Of NY And NJThe Holland Tunnel is lined with 6 million ceiling and wall tiles, currently under renovation.NorthJersey.comEarly in the COVID pandemic in April of 2020, the approach to the Holland Tunnel in Jersey City resembled a ghost town.Danielle Parhizkaran And Tariq Zehawi/NorthJersey.comThe Holland Tunnel handles nearly 30 million vehicles a year.Danielle Parhizkaran/NorthJersey.comThe Lincoln Tunnel’s three tubes stretch from 7,500 to 8,200 feet beneath the Hudson River between Manhattan and Weehawken, New Jersey. The maximum depth from mean high water to the roadway is 97 feet – nearly the height of a 10-story building.Courtesy Of The Port Authority Of NY And NJTo build the tunnel’s lining, hundreds of huge iron rings, each weighing 21 tons, had to be assembled and bolstered together.Courtesy Of The Port Authority Of NY And NJCrews of sandhogs worked from both the New Jersey side and the Manhattan side. The two groups met August 3, 1935, when a hydraulic engineer in the New Jersey end was pushed by his feet through an opening to meet the New York crew.Courtesy Of The Port Authority Of NY And NJThe first tube of the Lincoln Tunnel - the center tube - opened to traffic in 1937. The north tube opened in 1945 ...Courtesy Of The Port Authority Of NY And NJHere the Lincoln Tunnel before the third tube opened. Today, the three tubes combined handle nearly 40 million vehicles a year.Courtesy Of The Port Authority Of NY And NJ... and the third, or south tube of the Lincoln Tunnel opened in 1957.Courtesy Of The Port Authority Of NY And NJA new gantry system was installed in 2021 at the Lincoln Tunnel entrance to house toll collection equipment. Today, The Lincoln's three tubes combined handle nearly 40 million vehicles a year.Courtesy Of The Port Authority Of NY And NJThe Port Authority is evaluating replacement of the Lincoln Tunnel Helix, the curved rampway that leads to the tunnel entrance. The project would replace the deteriorated structure with a new roadway that widens lanes and adds shoulders to handle traffic incidents.Courtesy Of The Port Authority Of NY And NJNewark was the first airport to open in the New York metropolitan area, predating LaGuardia Airport by over a decade. Newark Liberty was the first in the country to have a paved runway and the second in the world to have a terminal and an air traffic control center.Danielle Parhizkaran/NorthJersey.comIt first opened in 1928 as Newark Metropolitan Airport, on 68 acres of marshland. When World War II began, Newark Airport was taken over by the Army for logistics operations and closed to commercial flights.Courtesy Of The Port Authority Of NY And NJUnited Airlines Terminal C was nearly empty at Newark Liberty International Airport in early April of 2020 thanks to the COVID pandemic.Danielle Parhizkaran/NorthJersey.comHoliday travel at Newark Liberty International Airport's Terminal B on July 3, 2023, in Newark.Danielle Parhizkaran/NorthJersey.comThe arrivals level was filled with vehicles picking up passengers at Terminal C at Newark Liberty Airport on Tuesday Nov. 21, 2023. Thanksgiving week is one of the busiest travel days in the United States.Tariq Zehawi/NorthJersey.comJohn F. Kennedy International Airport, originally named New York International Airport but commonly known as Idlewild, began service in July 1948.Port Authority Of NY And NJBy 1961 JFK handled 10 million passengers a year.Port Authority Of NY And NJJFK Airport has four runways and covers nearly 5,000 acres.Port Authority Of NY And NJToday the airport handles nearly 62 million passengers a year, supports 280,000 jobs, and generates more than $51 billion in sales and $17.1 billion in wages.Port Authority Of NY And NJAmong JFK’s iconic early terminal buildings with a sleek modern design was the TWA terminal, named for now defunct Trans World Airlines. It was designed by architect Eero Saarinen. It opened in 1962 and closed in 2001. It has since been repurposed as a hotel.Provided By Port Authority Of NY And NJAnother memorable terminal design at JFK was the one for Pan Am – another now-defunct airline.Provided By Port Authority Of NY And NJJFK is expected to handle 75 million passengers yearly by 2030.Provided By Port Authority Of NY And NJA $19 billion JFK Vision Plan will result in a completely redesigned airport. Here. a rendering of a new terminal.Provided By The Port Authority Of NY And NJLaGuardia Airport opened in 1939 as New York Municipal Airport. In 1953 it was named LaGuardia Airport after New York Mayor Fiorello La Guardia. The Port Authority took control in 1947. Here it is in 1963.Carl Di Piazza/NorthJersey.comAn $8 billion transformation of LaGuardia Airport makes it the first new major airport built in the United States in the last 25 years.Provided By The Port Authority Of NY And NJLaGuardia Airport’s Terminal B was named the world’s best new terminal based on feedback from customers around the world surveyed on factors including check-in, shopping, security'''
