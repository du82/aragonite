["https://recurse.com/manual"]
title = "The Recurse Center User’s Manual - Recurse Center"
description = "The Recurse Center is a self-directed, community-driven educational retreat for programmers in New York City."
full_description = '''User’s Manual About this document This User's Manual was written for admitted Recursers to help them navigate and understand the Recurse Center. We've decided to publish it in the hope that it will give the outside world a clearer picture of what the Recurse Center is like. If you’re considering applying to RC, we recommend you check out this manual to get a sense of what to expect. Welcome to an unusual experiment The Recurse Center is unlike the rest of the world. This guide is designed to help you get settled in and get the most out of your time here, and is written for people who have been admitted to RC or are attending a batch. One of the things that makes the Recurse Center different is that it's largely self-directed. This means that while you’re here, you won't have someone telling you what to do or how to approach your time. We don’t have grades, exams, curricula, or even classes, because we believe that people learn best when they have the freedom to explore what most interests them. This doesn't mean the Recurse Center is a vacuum, just that the structure we provide is optional, not mandatory. We've been running the Recurse Center since the summer of 2011, and we've learned a good amount about what strategies have and have not worked for different types of people in the past. The structure we do provide is shared space and time: you’ll be doing a batch alongside other like-minded programmers from a tremendously diverse set of backgrounds, and in joining RC you’ll be joining a community of over 2,700 people who have done a retreat. We only ask that you commit to RC full time, and that you work on open source software while you're here (i.e., don't work on proprietary code or code that you couldn't pair on or share with others). You belong here Regardless of how much experience you have, we admitted you because we believed you would be a positive influence on the batch, and we think being at the Recurse Center can help you dramatically improve as a programmer. This is really important, so we'll say it again: Everyone is here because we want them to be here, so if you're reading this, don't worry about how much more or less other people in your batch know. You are here because we want you to be here and believe in you. Everyone has something to learn from their peers at RC, regardless of how much or how little experience they have. No matter how long you’ve been programming, you don’t know everything there is to know about it: people who are relatively new to programming have plenty to share with those with a decade or more of experience. And if you have decades of experience, sharing your knowledge and taking on ambitious work can be a transformative example for other people at RC. The environment Regardless of whether you attend online or in-person, the core of RC is the same. You should check out our About page to learn more about the experience. The self-directives What should you actually do while you're at RC in order to grow and learn the most? The answer to this question is summed up in three guiding principles called the self-directives. They are: Work at the edge of your abilities Build your volitional muscles Learn generously We recommend that you think about how to apply the self-directives to your time at RC before your batch begins. Doing the self-directives looks different for everyone, but here are some tips to get you started: If you’re tackling a big project that’s at the edge of your abilities, you might feel stuck sometimes. As one alum put it, try to have ‘brain work’ — bigger, challenging stuff that requires deep focus — and ‘finger work’ — smaller implementation work you can turn to when you need to rebuild momentum. When considering the big picture of what you want to work on at RC, pay attention to what makes you most excited. Do you get butterflies thinking about a specific project or avenue of inquiry? Go for that! And remember: it’s okay to change course if what you’re most excited to do changes. During your batch you’ll encounter lots of new people and ideas. Building your volitional muscles means building your capacity to make decisions about what you do based on your motivations, and it’s an ongoing process, not something you do once in your first week. Share what you’re stuck on. We have lots of ways for you to share what you're working on, and we encourage you to celebrate victories! But it’s also important to ask questions and express uncertainty in public: it’s highly likely someone else is struggling with the same thing you are, or struggled with something similar in the past. Posting on Zulip or sharing a bug that’s besting you in check-ins or presentations will help you get advice and new perspectives on your problem. Pair program. This is a great way to do all three of the self-directives. See the next section for more about that! When in doubt, program. The more code you write at RC, the more you’ll learn. Don’t worry about choosing the “perfect” project before you begin. It’s much better to just start programming something, anything, that you’re excited about. Even something that feels small can help you build momentum. Pair programming One of the most valuable ways to do all of the self-directives at RC is by pair programming. Most alums wish they'd spent more time pair programming during their batch. We learned this after the second batch, and have shared this fact with every batch since. Despite this, lots of people still tell us after their batch that they really wish they'd paired more. What is pair programming? Pairing means two people working on the same code using a single computer, either via screensharing on a video call or by sitting next to one another. Using only one computer is important, because pairing is about actively collaborating and not just two people working on the same project or sitting next to each other on their own computers. Pairing quickstart guide Finding someone to pair with The best way to do this is to share what you’re working on regularly! That will help people find you. Check out the checkins channel on Zulip to learn about what people are working on, and don’t be afraid to reach out if something sounds interesting. Check out more specific interest channels on Zulip, too, especially the pairing channel, where you can look for pairing buddies. In both the virtual and physical spaces we have designated pairing stations: you can use them to pair, or you can work at one by yourself to signal that you’re open to pairing. Finding someone to pair with It's good to make sure you have similar (or at least compatible) goals before you start pairing. If one person thinks the goal is to learn Python, and the other thinks the goal is to fix a bug as quickly as possible, you can run into friction. Make sure you're on the same page, or at least know where each other are coming from. A common way to pair is having a "driver" and a "navigator": the driver is the one actually typing the code. The navigator sits next to the driver and reads the same screen, and is there to talk through ideas, direct the driver, and think about how the code currently being written fits into the larger project. If you're pairing this way, try to switch it up sometimes: switching regularly helps with knowledge transfer, ensures that both people get to drive and know what's going on, and helps keep everyone energized. Getting through tough spots Pairing can be hard at first, especially if you haven’t done it before. You may not think you have any code that is pair-worthy, or any valuable experience to contribute. It might feel uncomfortable programming out loud. You might not be sure if anyone shares your specific interests. But if we can give one piece of advice most strongly from our own experience and that of the thousands of Recursers who came before you, it’s that it’s worth pushing through these challenges. Why we love pairing There are several advantages to pairing. One is that it keeps everyone focused on the task at hand. When you're working alone, it can be easy to get distracted (e.g., by email or a shiny new JavaScript framework), but it's much, much harder to switch to Gmail when someone's sitting by your side and also reading your screen. Successful pairing should yield a productive feedback loop where each person helps keep the other focused. Another advantage is that the navigator can catch a lot of small errors immediately (typos, missing semicolons, incorrect variable names, etc). It's faster and easier to fix bugs the moment they're introduced than at any subsequent time, so this ends up being a big win. Plus, as the saying goes, with many eyes, all bugs are shallow. Pairing can help with everything from learning a language to picking up editor or command line tricks. And it’s motivating: it can get you excited about your project, stay with a problem when you might otherwise get distracted, or allow you to take on projects of a bigger scope than you could alone. Working on something deeply together can be a rare and special way to connect with another person. Oh also, it's fun! For all these reasons and more, pairing is one of the best ways to practice all three of the self-directives. We think everyone should try it — at least a few times and a few different ways. The social rules We have a small set of lightweight social rules that make more explicit certain social norms that are normally implicit. Most of our social rules really boil down to "don't be a jerk" or "don't be annoying." Of course, almost nobody sets out to be a jerk or annoying, so telling people not to be jerks isn't a very productive strategy. That's why our social rules are designed to curtail specific behavior we've found to be destructive to a supportive, productive, and fun learning environment. The social rules are: No feigning surprise You shouldn't act surprised when people say they don't know something. This applies to both technical things ("What?! I can't believe you don't know what the stack is!") and non-technical things ("You don't know who RMS is?!"). No well-actuallys A well-actually happens when someone says something that's almost - but not entirely - correct, and you say, "well, actually…" and then give a minor correction. This can be very disruptive when the correction has no bearing on the crux of the conversation. No back-seat driving If you overhear, or read on Zulip, people working through a problem, you shouldn't give advice unless you’re actively participating in the conversation. No subtle -isms Our last social rule bans subtle racism, sexism, homophobia, transphobia, and other kinds of bias. Subtle -isms are small things that make others feel unwelcome, things that we all sometimes do by mistake. You should read more about the social rules here, including how to gracefully handle it when you unintentionally break them. These rules are designed to help all of us build a pleasant, productive, and fearless community. Code of conduct The social rules don't cover harassment or discrimination. For that, we have a code of conduct enforced by the RC faculty. All members of the RC community are expected to abide by our code of conduct. You can report code of conduct violations using our reporting form. Logistics The time commitment Our core hours are Monday through Friday, 11 am to 5 pm ET, with many additional events outside of those hours. We don't track attendance down to the hour, but we will check in if we don't see you for a day. Our expectation is that RC is your primary commitment while you're in batch, and that you're committing to joining us during our core hours for the entirety of your batch. RC doesn’t work well for people who aren’t ready to make a significant commitment to it. We say six hours a day, but that’s a proxy for the commitment we expect you to make rather than a strict requirement in itself. It’s difficult to impossible to do RC when you have a full-time or part-time job, or are going to school, and we expect that anyone attending a batch will not have any other significant commitments. We’ve seen people try to juggle classes and part-time work with RC, and they invariably end up getting less out of the experience than they want to — most wind up leaving their batches early. If you miss the first day's orientation events, we'll ask you to join a later batch. If we notice that you aren’t participating in your batch, we’ll reach out to you, and may ask you to end your batch early. If you're unable to continue doing RC full-time, see the ending your batch early section below. Batch length Regardless of the batch you apply for, if you’re admitted to RC you’ll be able to confirm for any open batch and will be able to choose to commit to six or 12 weeks. If you’re unsure of whether you’ll be able to attend for the full 12 weeks, confirm for a six-week half-batch: you have the option to extend to 12 weeks at any point during your batch if you let a faculty member know you’d like to. If you need to shorten your batch, that’s okay — again, let a faculty member know. We would much rather hear that you’re struggling to participate or need to end your time at RC early than notice you’ve stopped participating and have to track you down! Advice Before RC Taking time out of your usual routine to attend an RC retreat is an exciting and sometimes daunting prospect. The Recurse Center is as much a social hack as anything. You spend a few months on your own somewhere, programming solo for its own sake, and that's what many Recursers were doing right before RC. Here you'll have the accountability, momentum, and inspiration from a group of peers who care about building and learning as much as you do. (And you'll have an easy answer for your friends and family when they ask what the heck you're doing with your life.) Pre-batch onboarding focuses on helping you introduce yourself to the RC community and our tools, and meet your batchmates. You’ll get an invite to Zulip, our chat software, before your batch. You should introduce yourself there, and choose some channels to subscribe to. If you’d like to learn more about how Zulip works, you can read the docs. Look for the orange events on the RC calendar — those are your orientation events! You must attend the first day talks on the first day of your batch. You can come to as many of the other orientation events as look interesting to you (ideally all of them). Look at the Directory to see who's in your batch, and add a photo and bio on your settings page. After you check out who else is in your batch, think about what you might like to work on, and who you’d like to meet and pair with in your first few weeks. And finally, if you’re attending remotely, adjust your workspace a little bit to change your context: change where you sit, add a little plant to your desk, or rotate your workspace. During your batch Your first two weeks Your first day will kick off with a series of welcome talks and meet and greets. Th'''
