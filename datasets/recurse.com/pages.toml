["https://recurse.com"]
title = "The Recurse Center"
description = "The Recurse Center is a self-directed, community-driven educational retreat for programmers in New York City."
full_description = "Invest six or 12 weeks programming at the edge of your abilities alongside motivated peers. Do a programming retreat in NYC, hybrid, or remotely. Remind yourself why programming rocks with code that sparks your joy and curiosity. You pick the projects you work on, with no deadlines, grades, or OKRs. You’ll get to work with and learn from kind and curious programmers of all skill levels. Whether you’re an EM ready to code again, a self-taught hobbyist, a staff engineer, a recent grad, or a former founder, there’s a place for you at RC. Our optional recruiting services keep RC 100% free for everyone. If you want a new job, we can connect you with new opportunities. The Recurse Center gave me time, space, light and clarity I never knew was possible. Being here has been transformational as a programmer and a human being. I'm in awe that this place exists and it's ours. Attending the Recurse Center has been life-changing for me. Never before in my life have I had this experience of being surrounded by kind people, supporting each other and cooperating, focused on improvement and learning, avoiding competition. The lack of curriculum really hits! The Recurse Center is one of those rare things where you find a small group of dedicated people who believe in a cause and pour their heart and soul into it, and it shows. I would recommend this to anybody who wants to invest time in becoming a dramatically better programmer. RC is a magical place where you go to become a better programmer. The diversity and a super welcoming environment have made RC one of the best educational experiences I’ve ever had! With all the resources and distractions of the internet, it can be hard to know what to work on first—or even work up the motivation to start. RC gives you a clear beginning, end, purpose, and name for your time off—and friendly social accountability to keep you going. With our supportive facilitators, you’ll get better at directing your time, picking your projects, and meeting the goals you set for yourself."
