full_description = '''Apply to RC We review applications on a rolling basis. You should receive a confirmation email immediately after you apply, and we will review your application within three weeks. In general, clear and concise answers are better than long ones. Most answers have a 1,500 character max length, but you don't need to write that much. When writing your application, we encourage you to read about the self-directives and consider how you'll approach them at RC. We also strongly encourage you to read Applying to RC, About RC, and the FAQ before submitting your application. Choose your batch Please select the batch you hope to attend. If you're admitted, you'll have the option to confirm for a different batch if the one you applied to is full or you can no longer attend it. You can attend your retreat at our Brooklyn hub, online, or any combination of the two. Please do not submit multiple applications to different batches. Contact info Full name Please enter your first and last name Email Please enter a valid email address Pronouns The pronouns you use, e.g. “she/her”, “he/him”, “they/them.” Questions Links Please include any that you have: GitHub, LinkedIn, personal web site, etc. Please enter your GitHub, LinkedIn and other URLs. Code CracklePop Write a program that prints out the numbers 1 to 100 (inclusive). If the number is divisible by 3, print Crackle instead of the number. If it's divisible by 5, print Pop. If it's divisible by both 3 and 5, print CracklePop. You can use any language. Please solve CracklePop Please link to a program you've written from scratch. You can use something like GitHub's gist to host your code. It doesn't need to be long, but it should be something you've written yourself, and not using a framework (e.g., Rails). If you don't have anything to submit, code something small, like a game of tic-tac-toe. Please share a program you've written. What is the most fascinating thing you've learned in the past month? This doesn't have to be about programming. Please share a fascinating thing you've learned recently. What do you want to be doing in two years? Please tell us what you'd like to be doing in two years. It's ok to say, "I don't know." Why do you want to attend RC? How would attending RC be different than working on your own? Please tell us why you want to attend RC. What would you like to work on at RC? E.g., things you want to learn or understand better, projects you want to build or contribute to, etc. Consider where the edge of your abilities is, and where you’d like it to be at the end of your batch. Please tell us what you'd like to work on at RC. Do you plan to attend RC in-person, remotely, or some combination of the two? How will this affect your working style? If you'll be attending fully or partly remotely: have you worked remotely in the past? What was successful or challenging about that experience for you? Please tell us how you plan to attend RC. Background This information will not disqualify your application. We use it to better get to know our applicants and where they currently are. Describe your programming background in a few sentences. Please describe your programming background. Have you worked professionally as a programmer? If so, please describe your experience. Please tell us if you've worked as a programmer. Do you have a Computer Science degree or are you seeking one? Please tell us if you have or are seeking a CS degree. What other commitments (work, life, family) would you have during your batch? RC is a full-time commitment, and we ask that you plan to participate Monday-Friday during our core hours (11 am - 5 pm ET). Please tell us your other commitments. How did you first hear about RC? A friend/coworker who went to RC A friend/coworker who didn't go to RC Ladybug podcast Web search (for a bootcamp) Web search (for something else) Hacker News An ad Social media (Twitter, Facebook, Instagram) An RC alum's blog RC's blog A mention in the press or a news article An event run or hosted by RC (ex. Localhost talks) A conference A meetup, or other programming community A video online Came across the RC social rules Other Where specifically (e.g., which friend, conference, etc.)? How long ago did you first hear about RC? Less than one week ago Less than one month ago 1-3 months ago 4-6 months ago 7-12 months ago 1-2 years ago 3+ years ago What convinced you to apply today? I just learned about RC I was just reminded about RC I'm ready to switch careers I'm ready to switch programming jobs I'm ready to leave academia I'm ready for a professional sabbatical I lost my job I'm looking for a programming job and haven't found one yet It aligns with my family schedule (e.g., children off to college, partner's new job) It aligns with my academic schedule (e.g., summer break, graduation) It aligns with my work schedule (able to take time off) I've finally saved enough money to be able to go to RC I just learned enough programming to be qualified I was rejected in the past, and waited until I could reapply It was arbitrary Other (function () { var checkbox = document.querySelector("input#other_checkbox_1_6"); var textFieldDiv = document.querySelector("div#text_field_container_1_6"); var textField = document.querySelector("input#text_field_1_6"); checkbox.addEventListener('change', function (e) { if (e.target.checked) { textFieldDiv.style.display = "block"; } else { textFieldDiv.style.display = "none"; textField.value = ""; } }); })(); Alumni interviewers Recurse Center alumni interview most applicants. If you work with alumni and you don't want them to know you're applying, please enter their name(s) here. Please enter full names, separated by commas. Don't let these Recurse Center alumni see my application: Demographic info Have questions? Check our FAQ and email us if it's not answered there. You cannot submit your application until you've filled out all required fields. Want help applying? Sign up here to get an email with 