["https://recurse.com/hire"]
title = "Hire - Recurse Center"
full_description = "We have a proven track record of helping small teams hire strong programmers quickly, especially for their founding teams. You only pay for successful hires. The best employees are self-directed, endlessly curious, and are always building and learning. We run programming retreats where experienced, sharp, and creative programmers come to recharge and grow. We get to know our candidates over the course of months and years, which lets us get under the resume to find great matches you otherwise wouldn't for your open roles. We've operated since 2011 and have a candidate pool of more than 2,700 programmers — 35% identify as women, trans, and/or non-binary; 7% identify as black; and 7% identify as Latinx. We charge companies 25% of a candidate’s first year salary, excluding bonuses, due the day they begin working at your company. We have a 90-day guarantee, so if it doesn’t work out during that time, we’ll issue you a full refund. Recursers don’t pay us anything to help them find a role or to attend the Recurse Center. We send you engineers that are both interested in your company and that we believe would be a good fit. All the candidates we work with have attended our full-time programming retreat. During this time we get to know their technical capabilities and talk with them about their motivations, interests, and what they’re looking for in a company before making any introductions. We work in whatever way is most convenient for you, whether it's email referrals, directly adding candidates to your ATS, a private Slack channel, or something else. We welcome all companies looking for great programmers. Our current partner companies include small startups, mid-size tech companies, public companies, non-profits, and technology-focused hedge funds. We help companies hire for all programming roles and levels, including Founding, Senior, and Staff Engineer positions, and Backend, Frontend, Full-stack, Data Science, Data Engineering, DevOps, Android, iOS, Mobile, Quality Assurance, Security, UI/UX, Developer Relations, and Engineering Management. Experience levels vary from six months to 30 years of programming experience."
