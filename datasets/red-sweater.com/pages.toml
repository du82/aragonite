["https://red-sweater.com/support"]
title = "Red Sweater Support"
full_description = '''Getting Help From Us Contact Us Email us whenever you like. We usually respond within 24 hours. Not receiving a response? Check your email spam filter, or drop us a line on Twitter or Facebook. Support Articles We maintain a number of articles dedicated to documenting the functionality of our software, and workarounds to common problems. Visit the Red Sweater Help pages to learn more. Answers to Common Questions Where's my license? If you purchased directly from our store, please send us an email, including any names or emails you might have used when purchasing. We’ll find the license in our records and re-send it to you. If you purchased from Apple's Mac App Store, you can reinstall by finding our product in the "Purchased Items" list of the App Store application. Can I use the software on more than one Mac? As long as you’re the only person using the application, feel free to install it on all of your computers. If you’re sharing a computer with other people, each person must use their own license. Do you offer educational discounts? We do not offer special pricing for students. We hope our competitive prices make our products accessible to everybody who can benefit from them. What about bulk discounts? Please get in touch to learn more about our quantity discounts.'''
