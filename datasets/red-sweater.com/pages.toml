full_description = "Black Ink 2 Download, solve, and print puzzles on your Mac*. Free Download | Unlock Premium Features Requires macOS 10.15.4 or higher. Release Notes * Looking for Black Ink for iPhone, iPad, or Vision Pro? Download it on the App Store! Solve Crossword Puzzles With Style Black Ink 2 offers a deluxe crossword-solving interface on your Mac. It's packed with features that streamline the process for solvers of all skill levels, from beginners to world-class pros. Feature Overview Virtually Endless Puzzles Black Ink opens any puzzle file designed for the Across Lite puzzle format. You can download these puzzles from various sources on the internet including the world-famous New York Times puzzle, along with many, many others. Puzzles to Go Feel like solving with pen and paper? Not a problem. Black Ink's book-grade printing support lets you publish a personal copy of any puzzle you download. Print out a few to take on your next vacation. Stunning Visual Interface Puzzles have never looked so good. Finally, an app that cares as much about crosswords as you do. Live resizing, beautiful status markers, and a streamlined puzzle chooser make your puzzle solving experience a joy. A Mechanical Genius Black Ink's highly customizable solving options make it a snap to move through puzzles effortlessly. Jump to unsolved squares, easily switch directions, even jump directly to a clue by typing its number. More screenshots. Click to enlarge. Dark Mode Puzzle Printing Preferences"
