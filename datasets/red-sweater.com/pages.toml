full_description = "FastScripts 3 All your scripts at your fingertips. Free Download | Buy a License Requires macOS 10.15 or higher. Read the latest release notes. Beloved by Mac automation experts for nearly 20 years. All new features in 3.0: ScriptLight: Search Your Scripts Start typing to see a summary of matchings scripts. Select the one you want, or just press return to run the top result. Track Your Tasks Active scripts are listed in the script menu, so you can monitor their progress, or end them early if they've run amok. Massively Parallel Productivity Scripts get their own own high-performance execution process, so you won't get stuck waiting for long tasks before starting another. Incremental Improvements Little things that add up: keyboard shortcut conflict detection, improved message panels, and support for symbolic links! Time-honored core features: Powerful Keyboard Shortcuts Global or application-specific control at the tip of your fingers. You'll spend less time mousing and more time doing. Smart Context Switching Keep your focus on the current application, while time-saving scripts attract your attention only when necessary. And yet there is even more... Curious about what else FastScripts has to offer? Read more on the finer points page. Enhanced Script Menu An upgrade to the Apple Script Menu - a familiar design with many usability improvements and a refined UI. Scripting Language Agnostic AppleScript, Perl, Automator workflows, even whole applications and documents can be added to your Scripts folder and invoked by FastScripts."
