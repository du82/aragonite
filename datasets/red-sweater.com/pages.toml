["https://red-sweater.com/blog"]
title = ""
full_description = "FastScripts 3.3.6: Restore Launch-Time Progress and Fix a Crash February 26th, 2025 FastScripts 3.3.6 is now available on the FastScripts home page, or by selecting “Check for Update” from the FastScripts menu. This update restores the menu bar icon’s progress indicator while launching, when processing the script folder’s scripts takes a longer-than-instantaneous amount of time. This behavior was standard in FastScripts for years and I inadvertently broke it in 2022, and neglected to notice until now! This update also fixes a crashing bug that was introduced in version 3.3.5, which could affect users who deleted or renamed scripts while FastScripts was running. Complete list of changes for this release: Restore display of the progress indicator in menu bar while launching Fix a crash that could occur while adding or removing scripts to the scripts folder If you enjoy FastScripts, please consider spreading the word to your friends! Thanks for your support. Posted in FastScripts, Red Sweater News | Comments Off on FastScripts 3.3.6: Restore Launch-Time Progress and Fix a Crash FastScripts 3.3.5: Live Script Progress and Other Fixes February 21st, 2025 FastScripts 3.3.5 is now available on the FastScripts home page, or by selecting “Check for Update” from the FastScripts menu. This update restores the functionality of live visual updates for long-running scripts, whose progress is conveyed in the FastScripts menu. This was broken in the previous release: It also includes a bunch of other fixes, relatively great, and relatively small! Restore live updating of running script task progress information in the menu Fix a bug where long-running shell scripts were not properly terminated when canceled from the script menu Default environment variables are now passed to shell scripts for users who use zsh, bash, ksh, or fish Symlinks to shell scripts are now invoked directly so that the $0 variable points to the symlink and not the target Fix a hang that could occur if an alias to a large app is placed in the Scripts folder Prevent a crash that could occur while updating script running progress Fix a menu ordering issue with custom sorting tags that are non-UTF8 characters Fix a bug that caused scripts with certain unicode characters in the title to be treated as multiple scripts If you enjoy FastScripts, please consider spreading the word to friends! Thanks for your support. Posted in FastScripts, Red Sweater News | Comments Off on FastScripts 3.3.5: Live Script Progress and Other Fixes MarsEdit 5.3.2: Fixing a Couple Crashers February 2nd, 2025 MarsEdit 5.3.2 is now available on the MarsEdit site and has been submitted to the Mac App Store. This update fixes a couple crashing bugs that could occur when configuring a new blog in MarsEdit: Fix a crash that could occur when a bad URL is provided for a blog Fix a crash that could occur when adding a blog if auto-configuration failed If you enjoy MarsEdit, please consider writing a review or rating the app on the Mac App Store, spreading the word on social media, or of course, by writing about the app on your own blog! Thanks for your support. Posted in MarsEdit, Red Sweater News | Comments Off on MarsEdit 5.3.2: Fixing a Couple Crashers MarsEdit 5.3.1: Screenshot Uploads and Other Delights January 31st, 2025 MarsEdit 5.3.1 is now available on the MarsEdit site and on the Mac App Store. This update includes a number of bug fixes and minor enhancements, including a fix for an issue specifically with uploading Mac screenshot files to WordPress. At some point, Apple changed the naming convention for the screenshots so that the space between the timestamp and the “AM” or “PM” is a special, non-breaking space. This is great for aesthetics, but breaks some WordPress installs whose databases do not support the non-ASCII character in the title. Complete list of changes for this release: Prevent an image upload failure with Apple screenshots on some blog servers Fix a crash that could occur when downloading media items with invalid URLs Remove inapplicable tooltip text when hovering over the Rich Text editor Fix an inaccurancy in word counting when HTML comments are part of the post Restore functionality of the “Download Template” feature for Micro.blog Fix a printing bug in the rich editor that prevented un-uploaded images from appearing Custom XMLPC blogging APIs that supply custom_fields values to MarsEdit now work as expected If you enjoy MarsEdit, please consider writing a review or rating the app on the Mac App Store, spreading the word to friends, or of course, by writing about the app on your own blog! Thanks for your support. Posted in MarsEdit, Red Sweater News | Comments Off on MarsEdit 5.3.1: Screenshot Uploads and Other Delights « Previous Entries About The Red Sweater Blog features updates about our apps and articles about related topics. Try Our Mac Apps MarsEdit. Write, edit, and publish your blog from your Mac. FlexTime. Stick to your routines throughout the day. FastScripts. Attach keyboard shortcuts to your scripts. Black Ink. Solve crossword puzzles with style. Search the Blog Recent Entries FastScripts 3.3.6: Restore Launch-Time Progress and Fix a Crash FastScripts 3.3.5: Live Script Progress and Other Fixes MarsEdit 5.3.2: Fixing a Couple Crashers MarsEdit 5.3.1: Screenshot Uploads and Other Delights Black Ink 2.4 for Mac: Quick Look, Printing, and Pretty Text Subscribe RSS Feed"
