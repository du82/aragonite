["https://red-sweater.com/marsedit"]
title = "MarsEdit 5 - Powerful web publishing from your Mac."
description = "MarsEdit is a desktop blog editing application for the Mac. It provides an interface to most popular blogging systems. WordPress, Tumblr, Movable Type, and many other systems are supported."
full_description = "MarsEdit 5 Write, preview, and publish your blog. Free Download | Buy a License Requires macOS 10.15.4 or higher. Read the release notes. Think Outside The Browser! Browser-based interfaces are slow, clumsy, and require you to be online just to use them. Web browsers are wonderful for reading articles, but not for creating them. If you’re writing for the web, you need a desktop blog editor. And if you’re lucky enough to have a Mac, nothing is more powerful, or more elegant than MarsEdit. Feature Overview These exciting new abilities of MarsEdit 5… Streamlined Microposting The new Microposting feature makes it as easy to post to your blog as it is to post to Twitter. Share your thoughts effortlessly with a global keyboard shortcut that pops up a minimalist post editor. Just press send and you’re done! Markdown Syntax Highlighting Plain text lovers rejoice! MarsEdit now offers live, inline coloring and styling of Markdown-formatted text. Embrace the simplicity of plain text while enjoying the benefits of contextual styling. An All-new Rich Text Editor Built to last! The WYSIWYG rich text editor uses Apple’s latest WebKit technologies for a higher performance, more reliable editing interface that will gain advantages as Apple continues investing in the frameworks. Usability Enhancements Subtle improvements around every corner. Inline find & replace improves upon the old find panel. A new calendar-based date panel makes scheduling easier. And an iOS device can now be used to easily add a sketch or photo directly to a post. … are the latest additions to the massive list of existing features: Rich and Plain Text Editing MarsEdit’s editor switches easily from Plain to Rich Text, so you can work in whichever format you prefer. Love Markdown? MarsEdit can preview it and convert it to HTML if needed. Advanced WordPress Support MarsEdit knows about featured images, post formats, and multiple authors. It even supports adding custom fields that appear right in the post editor window. Focused on Writing With full support for Apple’s standard full-screen mode, and a custom “Typewriter Mode” to keep text centered vertically, you can work on your blog with minimal distraction. A Media Maven Browse your Apple Photos, drag images directly, or insert images into your blog post with the click of a button. MarsEdit uploads them all when you’re ready to publish. Enhanced Blog Archiving For most blog services, MarsEdit can download the entire history of published posts and pages, so a backup of all your writing is stored safely on your Mac. Automatic Preview Template Preview your posts as you write them, just as they’ll appear when published on the web. A baseline template can be easily downloaded from your blog, and fine-tuned by hand. Fast, Live Previews Native filters for Markdown, MultiMarkdown, and Convert Line Breaks run at lightning speed, creating an authentic preview of how your writing will look, as you type it. Dazzling System Integration MarsEdit Safari App Extension makes it easy to create new posts based on things you read on the web. Support for macOS standard autosave means never worrying about losing your work. Offline Freedom Write when and where you want to, with or without an internet connection. Fine-tune your next post on the boat, plane, or train, and publish it when you’re back online. Wildly Compatible Works with WordPress, Micro.blog, Tumblr, TypePad, Movable Type, and any blog that supports a standard MetaWeblog or AtomPub interface. More screenshots. Click to enlarge: HTML Editor & Macros Media Manager Rich Editor & Preview."
