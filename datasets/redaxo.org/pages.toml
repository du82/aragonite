["https://redaxo.org/cms/news/redaxo-ist-bereit-fuer-das-neue-php-8.2"]
title = "News / REDAXO Website"
full_description = "REDAXO ist bereit für das neue PHP 8.2 Veröffentlicht am 09.12.2022 Für REDAXO versuchen wir immer möglichst früh, unsere automatisierte Entwicklungsumgebung bei GitHub um neue PHP-Versionen zu ergänzen. Deshalb ist REDAXO auch schon seit einiger Zeit kompatibel mit PHP 8.2, das gestern veröffentlicht worden ist. Auch die gängigen AddOns der Community sollten kompatibel sein. Falls euch etwas auffällt, freuen wir uns über Hinweise! Hinweise zu neuen Features und Deprecations findet ihr hier: https://www.php.net/releases/8.2/ Auch die Docker-Images für REDAXO wurden bereits aktualisiert und liegen für PHP 8.2 vor. PHP 7.4 hat bereits im November den EOL-Status (End of Life) erreicht und ist damit obsolet. Es erhält keine Sicherheitsupdates mehr und soll in der Praxis nicht mehr eingesetzt werden. Unsere Empfehlung ist deshalb, REDAXO nur noch mit PHP 8 zu nutzen. REDAXO ist bereit für das neue PHP 8.2 Veröffentlicht am 09.12.2022 Für REDAXO versuchen wir immer möglichst früh, unsere automatisierte Entwicklungsumgebung bei GitHub um neue PHP-Versionen zu ergänzen. Deshalb ist REDAXO auch schon seit einiger Zeit kompatibel mit PHP 8.2, das gestern veröffentlicht worden ist. Auch die gängigen AddOns der Community sollten kompatibel sein. Falls euch etwas auffällt, freuen wir uns über Hinweise! Hinweise zu neuen Features und Deprecations findet ihr hier: https://www.php.net/releases/8.2/ Auch die Docker-Images für REDAXO wurden bereits aktualisiert und liegen für PHP 8.2 vor. PHP 7.4 hat bereits im November den EOL-Status (End of Life) erreicht und ist damit obsolet. Es erhält keine Sicherheitsupdates mehr und soll in der Praxis nicht mehr eingesetzt werden. Unsere Empfehlung ist deshalb, REDAXO nur noch mit PHP 8 zu nutzen."
