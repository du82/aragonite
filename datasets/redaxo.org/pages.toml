["https://redaxo.org/cms/news/die-neue-redaxo-4.6-version-ist-verfuegbar"]
title = "News / REDAXO Website"
full_description = 'Die neue REDAXO 4.6-Version ist verfügbar Veröffentlicht am 30.04.2014 Wir freuen uns, wieder mal eine neue Version präsentieren zu dürfen. Diesmal liegt der Schwerpunkt in der Updatefähigkeit der AddOns: Man kann, sofern die AddOns entsprechend vorbereitet wurden, diese live, aus dem Backend heraus, aktualisieren, aber auch neuere Versionen installieren. Zu diesem Zweck gibt es nun ein neues AddOn “Installer”, mit dem man einerseits die Updates einspielen kann und andererseits eigene AddOns auf redaxo.org hochladen sowie aktualisieren kann. Wir wollen damit einen flexibleren und einfacheren Umgang mit den AddOns ermöglichen. Außerdem haben wir einige Funktionen, die erst für die Version 5.0 angedacht waren, bereits jetzt implementiert. Die lange Verzögerung der Version 5.0 hat uns gezeigt, dass wir besser in kleineren Schritten vorankommen. Einige Ergänzungen konnten wir deshalb auch jetzt schon in die Version 4.6 übernehmen. Klassen wie rex_path erlauben es z.B., leichter auf bestimmte Ordner zu verweisen: rex_path::addon(“textile”,“config.inc.php”) anstatt $REX[\“INCLUDE_PATH\”].’/addons/textile/config.inc.php’; Weitere aktualisierte Klassen sind z.B. rex_dir, rex_file, rex_finder, rex_pager, rex_path, rex_socket, rex_string, rex_timer, rex_validator. Ein allgemeiner Data-Ordner hilft AddOns, bestimmte Informationen abzulegen, um z.B. Konfigurationen dort zu speichern. Erst dadurch werden diese AddOns updatefähig und beinhalten nur noch Funktionalitäten. Eine Konfiguration im AddOn-Ordner würde ansonsten bei einem Update überschrieben werden. Den TinyMCE Editor haben wir aus dem Core entfernt, er lässt sich aber leicht über den Installer nachinstallieren. Neben dem TinyMCE gibt es mittlerweile auch etliche andere Editoren, die wir in einer Übersicht bei den Tutorials vorgestellt haben. JQuery und Codemirror wurden aktualisiert. Beim Export kann man nun auch explizit entscheiden, welche Tabellen man mit aufnehmen möchte – oder eben nicht dabei haben möchte. Benutzer können nun dupliziert werden. Das erleichtert das Anlegen mehrere Redakteure mit ähnlichen Rechten. Der Image Manager kann, sofern es der Server erlaubt, weitere Formate, wie z.B. PDF, EPS oder PSD verarbeiten. Übrigens: Wir haben im Moment noch einen Kompatibilitätsmodus aktiviert, d.h. bestimmte Funktionen werden noch aus alten Version untersützt. (siehe class.compat.inc.php) Auch werden im Core hier und da noch die alte rex_resize-Funktionen unterstützt. Das werden wir in der nächsten Version bereinigen. Wir hoffen, dass wir Euch mit dieser Version wieder zu etwas mehr Freude bei der Entwicklung von REDAXO-Webseiten verhelfen konnten. Euer REDAXO Team REDAXO 4.6 zum Download: http://www.redaxo.org/media/redaxo4_6.zip Alle Neuerungen auf einen Blick: http://www.redaxo.org/de/download/changelog/redaxo-46/'
