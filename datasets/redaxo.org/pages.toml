["https://redaxo.org/download/website-demos"]
title = "Website-Demos / REDAXO Website"
full_description = "Website-DemosInnerhalb der Community haben wir mehrere Demo-Websites entwickelt, die typische Anwendungsfälle mit REDAXO zeigen. Zum Testen der Demos bereitest du dir am besten jeweils eine frische REDAXO-Installation vor, denn bestehende Inhalte werden dabei gelöscht. Die Demos installierst du am besten mittels Install-AddOn innerhalb REDAXOs: Benutze dessen Suche, um etwa die Basis-Demo zu finden, lade sie herunter und aktiviere sie. Anschließend kannst du auf der neu hinzugekommenen Demo-Seite in REDAXO die Installation der Demo per Klick auf den Button anstoßen. Tipp: Wer sich mit Docker auskennt, kann alle Demos auch damit installieren: Demo-Images im Docker Hub. Basis-Demo Ein umfangreiche Demo auf Deutsch und Englisch, die eher für Einsteiger gedacht ist. Sie zeigt einen möglichen Weg auf, eine Website mit REDAXO umzusetzen und liefert dabei viele hilfreiche Erklärungen. Wer sich erstmalig mit REDAXO beschäftigt, sollte diese Demo testen! Features: Zweisprachig Deutsch und Englisch Texteingabe mittels Textile oder WYSIWYG-Editor Ersetzung von Platzhaltern mittels Sprog Kleines Kontaktformular mit YForm Bezeichnung im Installer: demo_base Code bei GitHub: https://github.com/FriendsOfREDAXO/demo_base Docker-Image im Hub: friendsofredaxo/demo:base Community-Demo In dieser Demo kannst Du sehen, wie man mit dem Community-AddOn Loginbereiche erstellen kann, wo sich User registrieren und in geschützte Bereiche einloggen können. Features: User können sich registrieren (Double-Opt-In) User können Gruppen zugewiesen werden. Diese Gruppen dienen zur Steuerung der Zugriffsrechte bei Kategorien. Passwort vergessen-Funktion Authentifizierung mit Loginname oder E-Mail und verschlüsseltem Passwort Rechte für Seiten und Kategorien können (auch rekursiv vererbend) definiert werden Jeder User kann seine Profildaten verändern einfache Beispiele für die Anzeige der neuesten User Bezeichnung im Installer: demo_community Code bei GitHub: https://github.com/FriendsOfREDAXO/demo_community Docker-Image im Hub: friendsofredaxo/demo:community Onepage-Demo Die Demo zeigt drei Wege, wie man eine Onepage-Website aufbauen kann: mit Modulen mit Artikeln mit Kategorien und ggf. weiteren Artikeln Von der letzten Variante ist es nun ein kleiner Schritt, um die Onepage-Website in eine Multipage-Website umzuwandeln. Die Module haben relativ viele Optionen und Variationsmöglichkeiten und decken die typischen Fälle einer Website ab: Texte in Spalten und mit Bildern, Hintergrundbilder, Projekte, Kundenstimmen, Teamvorstellung, Bildergalerie, etc. Mittels Kategorie-Metafelder kann man globale Einstellungen vornehmen wie Navigationstyp, Grundfarbe oder die Anzeige eines Preloaders. Die Links zu den Social Media-Plattformen werden in Sprach-Metafeldern gepflegt. Bezeichnung im Installer: demo_onepage Code bei GitHub: https://github.com/FriendsOfREDAXO/demo_onepage Docker-Image im Hub: friendsofredaxo/demo:onepage"
