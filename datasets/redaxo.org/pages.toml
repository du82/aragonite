mands neu erstellt Ordner media bei Deinstallation leeren Ordner resources bei Deinstallation löschen Bugfixes Bei Modulen die Klasse markitupEditor-full durch markitupEditor-markdown_full ersetzt, da der Editor nicht angezeigt wurde (Update des markitup-Addons) herunterladen 3.0.2 Für REDAXO ^5.9.0 Veröffentlicht am 08.06.2023 Require / PHP >=7.4, <8.3 Version 3.0.2 – 08.06.2022 Neue Versionen der benötigten AddOns in package.setup.yml @aeberhard markitup 3.7.3 -> 3.7.4 sprog 1.4.0 -> 1.5.1 yform 4.0.4 - 4.1.1 PHP-Version in package.yml >=7.4, <8.3 Bugfixes Bei Deinstallation Backup-Daten aus dem Backup-Ordner löschen - https://github.com/FriendsOfREDAXO/demo_base/issues/87 @aeberhard Modul 30 . PHP - Output war fehlerhaft, PHP-Code wurde nicht ausgeführt/ausgegeben - https://github.com/FriendsOfREDAXO/demo_base/issues/84 @aeberhard Modul 08 . Akkordeon Tabs (Ausgabe) - Nach Ausgabe die Tabs initialisieren - https://github.com/FriendsOfREDAXO/demo_base/issues/85 @aeberhard herunterladen 3.0.1 Für REDAXO ^5.9.0 Veröffentlicht am 13.12.2022 Bugfixes Verwendete AddOns aktualisiert zwecks Kompatibilität mit PHP 8.2 herunterladen 3.0.0 Für REDAXO ^5.9.0 Veröffentlicht am 05.01.2022 Breaking changes Der Redactor-Editor wurde ausgewechselt: Es wird nun die aktuelle Version 3 mit der Bezeichnung redactor verwendet. Die vorherige Version redactor2 wird bereits seit einiger Zeit nicht weiterentwickelt. YForm auf Version 4 aktualisiert. Diese bringt ein paar Änderungen mit, die jedoch für die Demo nicht relevant sind. Features Verwendet die neuen Mediatypen, die mit REDAXO 5.13 eingeführt wurden (z. B. rex_media_small) Bugfixes Navigation korrigiert: Der Bereich »Templates« ist nun wieder vorhanden (#82) Diverse kleine Inhaltskorrekturen (#82) herunterladen 2.10.1 Für REDAXO ^5.9.0 Veröffentlicht am 06.10.2021 Bugfixes Fehler bei der Installation behoben, wenn zuvor das Developer-AddOn aktiviert war herunterladen 2.10.0 Für REDAXO ^5.9.0 Veröffentlicht am 29.09.2021 Features 