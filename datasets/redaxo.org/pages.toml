tion um aktuelles JQuery / Bootstrap 4 automatisiert in Template einzubinden. www.design-to-use.de Versionen 5.x Degas Automatische Bild-Beschreibung mit Azure Cognitive Services github.com/omphteliba/ff_degas Versionen 5.x Demo für REDAXO 5 Ein umfangreiche Demo auf Deutsch und Englisch, die eher für Einsteiger gedacht ist. Sie zeigt einen möglichen Weg auf, eine Website mit REDAXO umzusetzen und liefert dabei viele hilfreiche Erklärungen. Wer sich erstmalig mit REDAXO beschäftigt, sollte diese Demo testen! github.com/FriendsOfREDAXO/demo_base Versionen 5.x FriendsOfREDAXO Diff Detect Tool zum Monitoren von RSS Feeds und einzelnen HTML Seiten. github.com/FriendsOfREDAXO/diff_detect/issues Versionen 5.x FriendsOfREDAXO doform Ich bin zurück und ganz neu! 🎉 doForm ist jetzt cooler und flexibler als je zuvor. Dieses REDAXO AddOn macht das Erstellen und Verarbeiten von Formularen zum Kinderspiel - egal ob es um einfache Kontaktformulare oder komplexe Multipart-Formulare mit Datei-Uploads geht. github.com/KLXM/doform Versionen 5.x Download Dieses AddOn schickt eine beliebige Datei aus dem Medienpool als Force-Download in den Browser. Unterstützt PHP und X-SendFile / X-Accel-File github.com/FriendsOfREDAXO/download Versionen 5.x FriendsOfREDAXO DSGVO - Addon zur Datenschutz-Grundverordnung Dieses Addon bietet Unterstützung bei der DSGVO-konformen Umsetzung von ein oder mehreren REDAXO-Websites. Ein Rechtsanspruch besteht jedoch nicht. Für die DSGVO-konforme Umsetzung ist die ganzheitliche Betrachtung der auf einer Website anfallenden Daten und deren Nutzung unerlässlich. github.com/FriendsOfREDAXO/dsgvo Versionen 5.x FriendsOfREDAXO Ereignis Kalender Einfacher Kalender mit dem monatliche Termine verwaltet und mit Tags versehen werden können. Versionen 5.x Events: Veranstaltungen, Termine und Anmeldungen verwalten Events bietet Ein- und Ausgabe von Terminen und Veranstaltungen sowie vorgefertigte YForm-Tabellen für Anmeldungen und Teilnahmelisten. 📄 Exzellent dokumentiert. ⭐ Anpassbar und erweiterbar. 🚀 YForm-Fundament. 🔤 Mehrsprachigkeit. 🔗 URL2-Profile. 🔎 SEO (JSON+LD-Format) www.alexplus.de/redaxo-addons Versionen 5.x Feeds Importiert Feeds aus Quellen wie Facebook, Instagram, Twitter, Vimeo oder RSS (ehemals YFeed) github.com/FriendsOfREDAXO/feeds Versionen 5.x FriendsOfREDAXO flatpickr für REDAXO - Datums- und Zeitpicker, Kalender, Rangepicker Stellt den flatpickr Date-/Timepicker in REDAXO zur Verfügung. github.com/FriendsOfREDAXO/flatpickr Versionen 5.x FriendsOfREDAXO Font Awesome Icon Picker Font Awesome 5/6 Icon Picker github.com/FriendsOfREDAXO/fa_iconpicker Versionen 5.x FriendsOfREDAXO FOR calendar Das AddOn ist ein variabel einsetzbarer Kalender(-Generator), Skedule, Newssystem, Event- und Terminplaner für REDAXO 5.x. github.com/FriendsOfREDAXO/forcal Versionen 5.x FriendsOfREDAXO FOR Sa11y - Accessibility checker FOR sa11y adds "Sa11y" to the REDAXO frontend, when a user is logged in. Vendor: https://sa11y.netlify.app/ Sa11y visually highlights accessibilty content issues at the source with a simple tooltip on how to fix them. github.com/FriendsOfREDAXO/for_sa11y Versionen 5.x FriendsOfREDAXO ForHtml HTML-Generator für REDAXO github.com/FriendsOfREDAXO/forhtml Versionen 5.x FriendsOfREDAXO Formular-Download Dieses Modul ermöglicht es Ihnen, die Daten für allen Formularen von SQL-Servern intern runterzuladen. www.raumkontakt.de/ Versionen 5.x Fullpage-Demo für das REDAXO CMS Die Fullpage-Demo für REDAXO demonstriert eine sogenannte Onepage-Website oder auch Onepager mit fullPage.js. github.com/FriendsOfREDAXO/demo_fullpage Versionen 5.x FriendsOfREDAXO Geo- und Karten-Unterstützung für REDAXO 5.13+ Geo- und Karten-Unterstützung für REDAXO 5.13+ github.com/FriendsOfREDAXO/geolocation Versionen 5.x FriendsOfREDAXO Girocode™️ kompatible QR-Codes💸 Erstellt QR-Codes lokal oder über Google. Inkl. Vorlage für Links. 👶🏻 Kinderleicht einzurichten ✅ Im Produktiveinsatz www.alexplus.de/redaxo-addons Versionen 5.x Globale Einstellungen (Global Settings) Mit diesem Addon kann man globale MetaInfos setzen die für die gesamte Website gültig sind. Admins können Felder anlegen und bearbeiten, Nicht-Admins können nur bearbeiten github.com/FriendsOfREDAXO/global_settings Versionen 5.x FriendsOfREDAXO Google Places - Für Google-Bewertungen und Reviews etc. Das Google Places AddOn ermöglicht es, über die Google API Informationen zu einem bestimmten Google Place in GoogleMaps auszulesen (Adresse, Google-Bewertungen/Reviews, etc.) github.com/danspringer/mf_googleplaces Versionen 5.x FriendsOfREDAXO Gridblock - Multiple Inhaltsblöcke (Module) im Spaltenraster anlegen, kombinieren & sortieren Multiple Modulblöcke (Inhalte) innerhalb eines Redaxo-Blockes anlegen, kombinieren & sortieren und in einem selbst definierbaren Spaltenrasters (GRID) ausgeben. github.com/iceman-fx/gridblock Versionen 5.x GUI Navigation Navigationen per GUI erstellen github.com/ichbeigit/GUINavigation Versionen 5.x HTTP-Header Aktivierung verschiedener Webseiten-Header zur Einstellung von Sicherheitsmaßnahmen und Optimierungen. Einstellbare Header ------------------- - Connection: keep-alive - Vary: Accept-Encoding - Unterdrückung der Serverkennung - Unterdrückung der Kennung X-Powered-By - X-Content-Type-Options: nosniff - X-Frame-Options - X-XSS-Protection - Referrer-Policy - Strict-Transport-Security - Content-Security-Policy - Feature-/Permissions-Policy Versionen 5.x FriendsOfREDAXO InstaWidget InstaWidget - Das erste Redaxo Instagram Feed Widget instawidget.davud-music.de Versionen 5.x Kompakte Linklisten (Quicklinks) Dieses AddOn gestattet die Erzeugung und Darstellung kompakter Listen von Links, die den Zugriff auf wichtige Artikel mit nur einem einzigen Klick gestatten. Diese "Quicklinks" werden in Gruppen zusammengefasst. Deren zugehörige Linklisten werden erst beim Überfahren mit der Maus bzw. beim Antippen (Touchscreen) als PopUp-Menüs sichtbar. Auf Desktop-Displays sind die Gruppen in einer Zeile nebeneinander angeordnet. Auf Smartphones können sie über ein Menü-Icon angezeigt werden und sind dann übereinander angeordnet. Die Stylesheets zur Darstellung der Quicklinks sind konfigurierbar. busch-dettum.de/public/it/quicklinks.html Versionen 5.x Kundenstimmen, Rezensionen und Bewertungen verwalten Verwalte deine Bewertungen, Kundenstimmen und Rezensionen bequem mit YForm. www.alexplus.de/redaxo-addons Versionen 5.x Kundenverwaltung Einfache Verwaltung für Kunden- und Rechnungsdaten im Backend, mit PDF-Ausgabe für Rechnungen sowie Export/Import-Funktion greatif.de Versionen 5.x Link Checker Link Checker prüft in regelmäßigen Abständen, welche Hyperlinks auf der REDAXO-Seite in Anker-Tags verwendet werden und ob diese noch gültig / erreichbar sind, oder verwaist / fehlerhaft sind. github.com/alexplusde/link_checker Versionen 5.x FriendsOfREDAXO Lizenzgrabber AddOn um Lizenzen aus REDAXO in einer Übersicht anzuzeigen. Dabei werden die AddOn Lizenzen ausgelesen wie auch composer Komponenten und aufgelistet Versionen 5.x Lottie Das AddOn stellt den Lottie-Player für das Abspielen von Lottie-Animationen im .json-Format zur Verfügung. github.com/FriendsOfREDAXO/lottie Versionen 5.x FriendsOfREDAXO Maintenance-Mode Wartungsmodus / Maintenance-Mode / Wartungsarbeiten Versionen 5.x FriendsOfREDAXO MarkItUp-Editor Das Addon bindet den MarkItUp-Editor im Backend ein (Markdown und Textile). github.com/FriendsOfREDAXO/markitup Versionen 5.x FriendsOfREDAXO massif_usability Package für REDAXO CMS >= 5.10.0 temporäres Ersatz-Plugin für yform_usability für yform >=4 – bietet ähnliche Funktionalität wie yform usability Versionen 5.x Media Manager Responsive Erstelle Media Manager Profil-Gruppen und verwende sie mit Responsive-Techniken. (picture, srcset, device pixel ratio, u.v.m.), um die Ladezeit, Performance, Caching und den PageSpeed-Index zu verbessern. 📄 Exzellent dokumentiert. 💪🏻 Flexibel einsetzbar. 🚀 Ideale Ergänzung zum Addon "Speed Up". ✅ In aktiver Weiterentwicklung. www.alexplus.de/redaxo-addons Versionen 5.x Media Server (CDN) Einsatz von CDN wie zb. Cloudfront von AWS kollerdirect.ch Versionen 5.x Meilensteine (Firmengeschichte) Verwalte auf einfache Art und Weise Meilensteine einer Firma und gebe dieser super leicht danke passender YOrm-Klassen aus. www.alexplus.de/redaxo-addons Versionen 5.x Modul-Vorschau REDAXO 5 Addon um eine Vorschau (Screenshot) bei der Modulauswahl anzuzeigen github.com/FriendsOfREDAXO/module_preview Versionen 5.x FriendsOfREDAXO Modulsammlung Ziel diese Addons ist es einfach einige (Beispiel) Module für Redaxo 5.x installieren zu können. Versionen 5.x FriendsOfREDAXO Monitoring Simples Monitoring in Redaxo Versionen 5.x NavBuilder Redaxo 5 Addon für frei zusammenstellbare Navigationen. github.com/FriendsOfREDAXO/navbuilder Versionen 5.x FriendsOfREDAXO Navigation Array Helper function zur Generierung von REDAXO-Navigationen Das AddOn liefert eine Function zur Generierung eines Navigationsarrays. In YCOM definierte Rechte werden berücksichtigt github.com/FriendsOfREDAXO/navigation_array Versionen 5.x FriendsOfREDAXO News Installiert frei anpassbare YForm-Tabellen für News sowie Kategorien. ༼ つ ◕_◕ ༽つ Perfekt vorbereitet für SEO (Suchmaschinenoptimierung) und erweiterbar mit YOrm, RESTApi und eigenen URLs mit URL2. Auf Wunsch auch mehrsprachig. Auch als Ersatz für den News Manager (newsmanager) geeignet. github.com/alexplusde/neues Versionen 5.x FriendsOfREDAXO nvBeMails Redaxo 5 Addon ermöglicht das Erstellen und verschicken von E-Mails aus Vorlagen. github.com/novinet-git/nv_bemails Versionen 5.x nvRexHelper Hilfreiche Klassensammlung github.com/novinet-git/nv_rexhelper Versionen 5.x nvRexStructureManager Addon zum kopieren und rekursiven Löschen von Kategorien github.com/novinet-git/nv_rex_structuremanager Versionen 5.x og:image Vorschau-Bilder Generiert nützliche Vorschau-Bilder für Messenger, Soziale Medien, E-Mail-Clients, Suchmaschinen (og:image) anhand der Informationen, die in REDAXO hinterlegt sind (Artikelname, Servername, Domain, YRewrite-Konfiguration, favicon und SEO-Bilder sowie URL-Profile) www.alexplus.de/redaxo-addons Versionen 5.x Onepage-Demo für REDAXO 5 Eine relativ umfangreiche Demo mit verschiedenen Ansätzen, um Onepage-Websites aufzubauen. github.com/FriendsOfREDAXO/demo_onepage Versionen 5.x FriendsOfREDAXO Package Controller Mit diesem Addon können immer wieder verwendete Templates und Module aus einer eigenen (oder zur Verfügung gestellten) Demo-Repository geladen und mit einem Klick installiert werden. Dies erleichtert die Erstellung einer neuen REDAXO-Seite. www.novinet.de Versionen 5.x PDFout - PDF-Generator Generator und Viewer für PDF-Dokumente. Das AddOn vereint den PDF-Generator DOMpdf (http://dompdf.github.io) und den Viewer PDFjs. github.com/FriendsOfREDAXO/pdfout Versionen 5.x FriendsOfREDAXO PHPMailer Profile Profile für das 📧 PHPMailer Addon, um unterschiedliche Absende-Adressen und/oder SMTP-Postfächer zu verwenden. 👶🏻 Kinderleicht einzurichten. ✅ In aktiver Weiterentwicklung. 🔗 Mu'
