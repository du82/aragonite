["https://redaxo.org/download/addons/tags/sicherheit"]
title = "Tags / REDAXO Website"
full_description = 'AddOns Sicherheit Alle KategorienAuswertungen / Counter / Statistik 43Backendanpassungen 104Community / Multiuser 18Datenbanken 66Entwickler 94Ersetzungen 29Framework 23Multimedia 43Sicherheit 22Sonstiges 238Sprachen 12URL / SEO 41 suchen 14 Ergebnisse 2-Faktor-Authentifizierung mittels one-time-password (OTP) per APP oder E-Mail. Das AddOn ermöglicht es eine 2 Faktor-Authentifizierung für das REDAXO-Login bereitzustellen. Administratoren können die 2 Faktor Authentifizierung für die Benutzer erzwingen oder auch optional anbieten. Nutzer werden nach Eingabe der Benutzerdaten aufgefordert, den einmal generierten zeitlich begrenzten Code zur Verifikation einzugeben um in das System zu gelangen. Weitere Informationen zur Einrichtung und Links zu entsprechenden Apps finden sich in der Hilfe. github.com/FriendsOfREDAXO/2factor_auth Versionen 5.x FriendsOfREDAXO Accessdenied / Zugriff verweigert (Artikel offline + Frontendzugriff verbieten) Mit diesem AddOn werden Kategorien und Artikel um einen weiteren Status erweitert (kein Patch, sauber über EP). Es steht ein zusätzlicher Status "gesperrt" zur Verfügung. Damit kann der Artikel nicht im Frontend aufgerufen werden. (eines der häufigsten Kundenanfragen) Versionen 5.x FriendsOfREDAXO Automatisiertes Löschen von Datensätzen Unterstützung bei der DSGVO-konformen Umsetzung von Websites, indem Logs und Daten nach festgelegten Regeln gelöscht werden. 👶🏻 Kinderleicht einzurichten. ✅ Im Produktiveinsatz. www.alexplus.de/redaxo-addons Versionen 5.x Cryptor Das Cryptor Addon stellt Methoden zur bequemen Zweiweg-Verschlüsselung von Daten zur Verfügung. Das cryptor/yform Plugin ermöglicht es, yform-DB-Felder automatisch beim Insert zu verschlüsseln und nach einem definierten Zeitraum automatisch zu löschen. github.com/Marschl/redaxo-cryptor Versionen 5.x DSGVO - Addon zur Datenschutz-Grundverordnung Dieses Addon bietet Unterstützung bei der DSGVO-konformen Umsetzung von ein oder mehreren REDAXO-Websites. Ein Rechtsanspruch besteht jedoch nicht. Für die DSGVO-konforme Umsetzung ist die ganzheitliche Betrachtung der auf einer Website anfallenden Daten und deren Nutzung unerlässlich. github.com/FriendsOfREDAXO/dsgvo Versionen 5.x FriendsOfREDAXO Email-Obfuscator Verschlüsselung / Verschleierung von E-Mailadressen zum Schutz vor Spam. github.com/FriendsOfREDAXO/emailobfuscator Versionen 5.x FriendsOfREDAXO HTTP-Header Aktivierung verschiedener Webseiten-Header zur Einstellung von Sicherheitsmaßnahmen und Optimierungen. Einstellbare Header ------------------- - Connection: keep-alive - Vary: Accept-Encoding - Unterdrückung der Serverkennung - Unterdrückung der Kennung X-Powered-By - X-Content-Type-Options: nosniff - X-Frame-Options - X-XSS-Protection - Referrer-Policy - Strict-Transport-Security - Content-Security-Policy - Feature-/Permissions-Policy Versionen 5.x FriendsOfREDAXO Kontrolle des Zugriffs auf Artikel und Mediendateien Dieses AddOn ermöglicht eine Zugriffskontrolle für ausgewählte Bereiche von Artikeln und/oder Mediendateien. Damit ist gemeint, dass ein Besucher im Front-End eine Authentifizierung benötigt, um bestimmte Seiten oder Mediendateien sehen zu dürfen. Auf diese Weise werden Besuchergruppen eingerichtet, die von der allgemeinen Öffentlichkeit abgegrenzt sind. Der Zugriff wird über die Authentifizierung von Redaxo-Benutzern kontrolliert, denen über ihre Rollen die entsprechenden Bereiche zugeordnet sind. Die erfolgte Autorisierung wird Session-basiert gespeichert. Das AddOn ist komplett zweisprachig eingerichtet (deutsch, englisch). busch-dettum.de/public/it/access_control.html Versionen 5.x Maintenance-Mode Wartungsmodus / Maintenance-Mode / Wartungsarbeiten Versionen 5.x FriendsOfREDAXO nvCaptcha Generiert und validiert ein Captcha für yform github.com/novinet-git/nv_captcha Versionen 5.x Security Ein AddOn um Sicherheitsaspekte von REDAXO CMS zu ergänzen Versionen 5.x FriendsOfREDAXO Spamschutz für YForm Schluss mit Bots, die das Kontaktformular fluten und unerwünschte Mails an dich, Kunden oder Fremde versenden! Mit diesem Addon ist Spamschutz einfach, barrierefrei und ohne Captcha / zusätzliche Nutzereingabe. www.github.com/alexplusde/yform_spam_protection Versionen 5.x FriendsOfREDAXO Undo - Artikel und Kategorien wiederherstellen Mit diesem AddOn kann ein Pagereload lang ein gelöschter Artikel oder eine gelöschte Kategorie wiederhergestellt werden github.com/FriendsOfREDAXO/undo Versionen 5.x FriendsOfREDAXO WSM Consent-Manager - Clever und modern Einwilligungen und Auskunft von verwendeten Drittanbieter-Diensten. Die neue Alternative zum Consent Manager. Vorteile: 🛫 Unkomplizierte Verwendung und Einrichtung mit REX_VARs. 🚀 Basiert auf YForm - einfacher Import/Export 🌎 Kompatibel zu YRewrite - verwende bestehende Domains und Sprachen. 🎴 Kompatibel zu Sprog und Wildcard - verwende Übersetzungen wie gewohnt. 🪟 2-Klick-Lösung für iframes / externe Dienste wie YouTube, Google Maps. www.alexplus.de/redaxo-addons Versionen 5.x'
