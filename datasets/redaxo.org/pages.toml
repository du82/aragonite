title = "Tags / REDAXO Website"
full_description = 'AddOns Kategorie Alle KategorienAuswertungen / Counter / Statistik 43Backendanpassungen 104Community / Multiuser 18Datenbanken 66Entwickler 94Ersetzungen 29Framework 23Multimedia 43Sicherheit 22Sonstiges 238Sprachen 12URL / SEO 41 suchen 286 Ergebnisse 2-Faktor-Authentifizierung mittels one-time-password (OTP) per APP oder E-Mail. Das AddOn ermöglicht es eine 2 Faktor-Authentifizierung für das REDAXO-Login bereitzustellen. Administratoren können die 2 Faktor Authentifizierung für die Benutzer erzwingen oder auch optional anbieten. Nutzer werden nach Eingabe der Benutzerdaten aufgefordert, den einmal generierten zeitlich begrenzten Code zur Verifikation einzugeben um in das System zu gelangen. Weitere Informationen zur Einrichtung und Links zu entsprechenden Apps finden sich in der Hilfe. github.com/FriendsOfREDAXO/2factor_auth Versionen 5.x FriendsOfREDAXO Accessdenied / Zugriff verweigert (Artikel offline + Frontendzugriff verbieten) Mit diesem AddOn werden Kategorien und Artikel um einen weiteren Status erweitert (kein Patch, sauber über EP). Es steht ein zusätzlicher Status "gesperrt" zur Verfügung. Damit kann der Artikel nicht im Frontend aufgerufen werden. (eines der häufigsten Kundenanfragen) Versionen 5.x FriendsOfREDAXO AceEditor - The high performance code editor for REDAXO # AceEditor - The high performance code editor for **REDAXO** Dieses AddOn bindet den Code-Editor **AceEditor** v1.23.1 im Backend ein. github.com/FriendsOfREDAXO/aceeditor Versionen 5.x FriendsOfREDAXO Add-on für Neues (in der Struktur bearbeiten) Erweitert das Add-on "Neues" um die Möglichkeit, Beiträge an Artikel zu koppeln. github.com/FriendsOfREDAXO/neues_structure Versionen 5.x FriendsOfREDAXO AddOn Viewer Der Addon Viewer erlaubt einen Blick hunter die Kulissen bestehender AddOns github.com/gupi/addon_viewer Versionen 5.x AddonTemplate Die Grund-Struktur für ein Addon erzeugen Versionen 5.x Adminer Adminer, Datenbankverwaltung und rex_sql_table Code-Generator https://www.adminer.org) als REDAXO-Addon github.com/FriendsOfREDAXO/adminer Versionen 5.x FriendsOfREDAXO Aktivitätsprotokoll Eine einfache Möglichkeit um Aktivitäten zu loggen. github.com/FriendsOfREDAXO/activity_log Versionen 5.x FriendsOfREDAXO Analyticsverwaltung Das Addon bindet die Möglichkeit Googleanalytics im Frontend einzubinden und via Backend zu konfigurieren. Das Addon hat den Vorteil, dass evtl. anfallende Codeänderungen seitens Google automatisch geupdatet werden. Versionen 5.x FriendsOfREDAXO Animated LogIn Login-Screen animiert github.com/FriendsOfREDAXO/animated_login Versionen 5.x FriendsOfREDAXO API Docs Umfangreiche Linksammlung zu REDAXO 5 Entwickler Resourcen Versionen 5.x FriendsOfREDAXO Appointments Anbindung an das Easy!Appointments Buchungssystem. Versionen 5.x article_presets Artikelvorlagen automatisch einfügen anhand Templates oder Kategorien Versionen 5.x FriendsOfREDAXO ArticleHelper Ein paar Helferfunktionen zur Artikeldarstellung Versionen 5.x articletemplates Individuelles Hinzufügen vordefinierter Artikelvorlagen / Articlepresets in vorhandene (leere) CMS-Artikel. Versionen 5.x Asset Import Asset Import für REDAXO Ein AddOn zum Importieren von Medien aus verschiedenen Quellen (Pixabay, Unsplash etc.) direkt in den REDAXO Medienpool. github.com/FriendsOfREDAXO/asset_import Versionen 5.x FriendsOfREDAXO Aufgaben (ToDo) Eine einfache ToDo Verwaltung für das Redaxo Backend. github.com/FriendsOfREDAXO/aufgaben Versionen 5.x FriendsOfREDAXO Automatisiertes Löschen von Datensätzen Unterstützung bei der DSGVO-konformen Umsetzung von Websites, indem Logs und Daten nach festgelegten Regeln gelöscht werden. 👶🏻 Kinderleicht einzurichten. ✅ Im Produktiveinsatz. www.alexplus.de/redaxo-addons Versionen 5.x aw Translator Extrahiert alle Inhalte einer Sprache in eine Textdatei mit Marker. Die Textdatei kann dann übersetzt werden und wieder eingelesen werden. Zusätzlich können die Inhalte einer Sprache komplett in eine andere Sprache kopiert werden, wahlweise können die Inhalte der Zielsprache vorher komplett gelöscht werden. Versionen 5.x awnav Eine einfache ul - li Navigation für Redaxo 5 Versionen 5.x Backend Branding (inkl. Favicon Generator Frontend + Backend) Mit dem AddOn lässt sich das Backend von Redaxo branden, um dem Backend eine individuellere Note zu geben. Damit kann man, wenn man mehrere REDAXO-Projekte betreut, das Backend auf einen Blick schneller unterscheiden. github.com/medienfeuer/be_branding Versionen 5.x Backend Explorer Dateiexplorer für REDAXO Versionen 5.x FriendsOfREDAXO Backend Password Benutzer können ihr Passwort zurückzusetzen, wenn sie es vergessen haben. Versionen 5.x FriendsOfREDAXO Backend-Tools Zusatzfunktionen für das Backend, u.A. Baumstruktur, Minimierung Navigation & Sidebar, Addon-Nav einklappbar, Sortierung Medienpool & zeitgesteuerte Ausgabe von Modulblöcken github.com/iceman-fx/be_tools Versionen 5.x backup Backup-Addon (ehemals import_export) Versionen 5.x Base Quality Check Diese AddOn soll dabei helfen ein paar Dinge bei der Entwicklung oder der Onlinestellung einer Webseite zu berücksichtigen. github.com/FriendsOfREDAXO/base_quality_check Versionen 5.x FriendsOfREDAXO be_style Backend Styles Versionen 5.x be_videologin Video Hintergrund fürs Backend Login www.raumkontakt.de/ Versionen 5.x Beispiel-Addon für REDAXO 5 Demo-Addon für REDAXO 5. Zeigt den Aufbau und Basisfunktionalität von Addons. github.com/FriendsOfREDAXO/demo_addon Versionen 5.x FriendsOfREDAXO Beiträge, Kategorien, Taxonomien und Menüs Erweitert REDAXO um beliebte Funktionen eines bekannten Blogging-CMS: Taxonomien und Kategorien, Menüs und mehr. 🚧 Weiterentwicklung ungewiss. Beauftragung möglich. www.alexplus.de/redaxo-addons Versionen 5.x blÖcks Blöcke online/offline schalten, per Drag&Drop verschieben sowie kopieren/ausschneiden und einfügen. Versionen 5.x FriendsOfREDAXO Blog Das AddOn stellt ein einfaches Blog-System zur Verfügung. Es handelt sich dabei um die Überführung von ursprünglich zwei Modulen in ein Addon. Entsprechend werden überwiegend bereits bestehende REDAXO-AddOns und -ressourcen genutzt bzw. vorausgesetzt. github.com/greatif/Blog Versionen 5.x Blogger Blogger ist ein Blog AddOn für das erstellen und verwalten von Blogeinträgen in verschiedenen Sprachen und mit einfacher ausgabe API. github.com/AndyBitz/rex_blogger Versionen 5.x FriendsOfREDAXO Bootstrapper Installiert Addons, inklusive der Auflösung von Abhängigkeiten, auf einmal. Versionen 5.x Cache-Warmup Generiert den Cache vorab, so dass die Website bereits beim Erstaufruf performant läuft. github.com/FriendsOfREDAXO/cache_warmup Versionen 5.x FriendsOfREDAXO Cart - Warenkorb Cart ist eine einfache PHP-Klasse, die einen Warenkorb für REDAXO 5 zur Verfügung stellt. Versionen 5.x CKEditor Der CKEditor für REDAXO Versionen 5.x FriendsOfREDAXO CKEditor 5 CKEditor 5 für REDAXO inkl. mblock support github.com/FriendsOfREDAXO/cke5 Versionen 5.x FriendsOfREDAXO Clear-Content AddOn um REDAXO Inhalte zu löschen. github.com/FriendsOfREDAXO/clear_content Versionen 5.x FriendsOfREDAXO cntndTemplate Template editieren der assets Versionen 5.x Collaborate Collaborate ist ein REDAXO Addon, welches primär entwickelt wurde, um kollisionsfreie, parallele Zusammenarbeit im Backend zu ermöglichen. github.com/FriendsOfREDAXO/collaborate Versionen 5.x FriendsOfREDAXO Collect Rufe Daten beliebiger Quellen ab, bspw. RSS-Feeds, YouTube-Playlists, Vimeo-Playlists, Twitter Beiträge anhand Hash-Tags, Google Places und deren Rezensionen, u.v.a. Nutze alle Vorteile, die YForm und YOrm dabei zu bieten haben. 🚧 Unterstützung gesucht! www.alexplus.de/redaxo-addons Versionen 5.x Community-Demo für REDAXO 5 In dieser Demo kannst Du sehen, wie man mit dem Community-AddOn Loginbereiche erstellen kann, wo sich User registrieren und in geschützte Bereiche einloggen können. github.com/FriendsOfREDAXO/demo_community Versionen 5.x FriendsOfREDAXO Consent Manager Das Nachfolge-Addon von iwcc (Cookie-Gedöns). github.com/FriendsOfREDAXO/consent_manager Versionen 5.x FriendsOfREDAXO Cookie-Gedöns Cookie Opt-In Banner github.com/FriendsOfREDAXO/iwcc Versionen 5.x FriendsOfREDAXO Copy Tool Dieses AddOn kopiert Artikel und Medien zwischen REDAXO Installationen. github.com/omphteliba/ff_copy_tool Versionen 5.x Core-Benutzerverwaltung Die Core-Benutzerverwaltung Versionen 5.x Cronjob-Addon Ermöglicht es, Cronjobs in einem jeweils festgelegten Intervall ausführen zu lassen. Versionen 5.x Cropper Kleine Bildbearbeitung für den Medienpool github.com/FriendsOfREDAXO/cropper Versionen 5.x FriendsOfREDAXO Cryptor Das Cryptor Addon stellt Methoden zur bequemen Zweiweg-Verschlüsselung von Daten zur Verfügung. Das cryptor/yform Plugin ermöglicht es, yform-DB-Felder automatisch beim Insert zu verschlüsseln und nach einem definierten Zeitraum automatisch zu löschen. github.com/Marschl/redaxo-cryptor Versionen 5.x D2U Adressen - Verwaltung von Adressen und Vertriebskontakten Addon zur Verwaltung von Vertriebskontakten. Es können auch Kontakttypen wie z.B. Vertrieb und Service angelegt werden. www.kaltenbach.com/de/unternehmen/kontakt/persoenliche-beratung/ Versionen 5.x D2U Gästebuch Einfaches Gästebuch mit Bewertungsfunktion. NEU: Daten können aus Redaxo 4 TVS Gästebuch importiert werden. www.immobiliengaiser.de Versionen 5.x D2U Helper - Hilfsaddon für D2U Addons mit schönen Redaxo Gadgets Addon bietet Hilfsklassen die in mehreren Addons von design-to-use (Autor: Tobias Krais) verwendet werden, z.B. für die Installation und automatische Aktualisierung von Modulen. Außerdem werden Module und Templates zur 1-Click-Installation angeboten, die auf Wunsch auch automatisiert Updates erhalten. Und in den Einstellungen finden sich Optionen wie: - Optionen um Google Analytics, Google Maps oder WiredMinds eMetrics einfach hinzuzufügen. - Option um aktuelles JQuery / Bootstrap 4 automatisiert in Template einzubinden. www.design-to-use.de Versionen 5.x D2U Immobilien Addon - Immobilien verwalten und per OpenImmo Schnittstelle exportieren oder importieren Immobilienverwaltung mit OpenImmo Import- und Exportfunktion zu Immobilienportalen. test.design-to-use.de/de/addontests/d2u-immobilien/ Versionen 5.x D2U Jobs - Stellenmarkt Addon für Redaxo inkl. HR4You Import Plugin Bitte das Stellenmarkt (Addon Key: jobs) von FriendsOfRedaxo verwenden. Dieses Addon wurde an FOR übergeben. github.com/TobiasKrais/d2u_jobs Versionen 5.x D2U Linkbox - einfache Boxen mit Bild, Titel und optionalem Link auf die Seite zaubern Du brauchst ein paar Boxen mit Bild, Überschrift und optionalem Link in deinem Redaxo Artikel? Das ganze soll auch mehrsprachig und einfach zu verwalten sein? Dann probier dieses Addon. github.com/TobiasKrais/d2u_linkbox/ Versionen 5.x D2U Maschinen / Gebrauchtmaschinen Addon mit Exportfunktion zu Maschinenportalen Mehrsprachiges Addon zum Verwalten von Machinen und Gebrauchtmaschinen. Gebrauchtmaschinen können zu mascus.de, europemachinery.com, baupool.com, machinerypark.com, linkedin.com und facebook.com exportiert werden. www.kaltenbach.com/ Versionen 5.x D2U Mitarbeiter - Stell dein Team vor! Einfaches Addon um dein Team auf deiner Webseite vorzustellen. github.com/TobiasKrais/d2u_staff/ Versionen 5.x D2U News - Veröffentlicht eure News und in einem Plugin eure Messebeteiligungen Dieses Addon bietet einen einfache Möglichkeit News einheitlich zu verwalten. In einem Plugin können außerdem Messebeteiligungen verwaltet werden. www.kaltenbach.com/de/ Versionen 5.x D2U Referenzen - Verwalte Referenzen und ordne ihnen Tags zu! Einfach Darstellung von Referenzen. Referenzen können Tags als Filtern zugeordnet werden. www.design-to-use.de/ Versionen 5.x D2U Veranstaltungen Verwalte eure Kurse und Veranstaltungen. Diese können im JSON+LD Format für das Kurskarussell in der Google Suche oder für Events in Google Maps ausgegeben werden. Plugin für Synchronisation mit der Kufer SQL Software vorhanden. www.kaltenbach-stiftung.de/ Versionen 5.x D2U Videomanager - Mehrsprachige, suchmaschinenoptimierte Videoverwaltung Mehrsprachige Videoverwaltung für YouTube und Videos aus dem Medienpool. Methoden für die Google Videosuche stehen zur Verfügung. test.design-to-use.de/de/addontests/d2u-videomanager/ Versionen 5.x Dashboard Zusammenfassende Startseite fuer die Backend-Benutzer. Inhalte koennen ueber die Plugin-Infrastruktur erweitert werden. Versionen 5.x DefaultAddons Redaxo 5 Addon zum Installieren von häufig benötigten Addons Installiert und aktiviert in einem Durchgang alle gewünschten Addons github.com/FriendsOfREDAXO/defaultaddons/ Versionen 5.x FriendsOfREDAXO Degas Automatische Bild-Beschreibung mit Azure Cognitive Services github.com/omphteliba/ff_degas Versionen 5.x Demo für REDAXO 5 Ein umfangreiche Demo auf Deutsch und Englisch, die eher für Einsteiger gedacht ist. Sie zeigt einen möglichen Weg auf, eine Website mit REDAXO umzusetzen und liefert dabei viele hilfreiche Erklärungen. Wer sich erstmalig mit REDAXO beschäftigt, sollte diese Demo testen! github.com/FriendsOfREDAXO/demo_base Versionen 5.x FriendsOfREDAXO developer Module, Templates und Aktionen über das Dateisystem bearbeiten (mit beliebigen Editor). github.com/friendsofredaxo/developer Versionen 5.x FriendsOfREDAXO Diff Detect Tool zum Monitoren von RSS Feeds und einzelnen HTML Seiten. github.com/FriendsOfREDAXO/diff_detect/issues Versionen 5.x FriendsOfREDAXO doform Ich bin zurück und ganz neu! 🎉 doForm ist jetzt cooler und flexibler als je zuvor. Dieses REDAXO AddOn macht das Erstellen und Verarbeiten von Formularen zum Kinderspiel - egal ob es um einfache Kontaktformulare oder komplexe Multipart-Formulare mit Datei-Uploads geht. github.com/KLXM/doform Versionen 5.x Download Dieses AddOn schickt eine beliebige Datei aus dem Medienpool als Force-Download in den Browser. Unterstützt PHP und X-SendFile / X-Accel-File github.com/FriendsOfREDAXO/download Versionen 5.x FriendsOfREDAXO DSGVO - Addon zur Datenschutz-Grundverordnung Dieses Addon bietet Unterstützung bei der DSGVO-konformen Umsetzung von ein oder mehreren REDAXO-Websites. Ein Rechtsanspruch besteht jedoch nicht. Für die DSGVO-konforme Umsetzung ist die ganzheitliche Betrachtung der auf einer Website anfallenden Daten und deren Nutzung unerlässlich. github.com/FriendsOfREDAXO/dsgvo Versionen 5.x FriendsOfREDAXO Einfache Navigation für Redaxo 5 Dieses AddOn bietet ein System zur Erzeugung einer einfachen Navigation für Websites. Die Navigation wird in Form untereinander angeordneter Zeilen mit Links auf Nachbarseiten des aktuell angezeigten Artikels dargestellt. Das Design der Navigationszeilen ist responsiv. Auf Smartphone-Displays sind sie normalerweise ausgeblendet, können aber über einen Schalter ein- und ausgeblendet werden. Umfang und Layout der Navigationszeilen sind konfigurierbar. busch-dettum.de/public/it/simple_nav.html Versionen 5.x Einfacher Aufrufzähler für Redaxo 5 Dieses AddOn bietet eine einfache Möglichkeit, die Aufrufe von Artikeln durch Besucher der Website zu zählen. Die Zählung kann auf ausgesuchte '
