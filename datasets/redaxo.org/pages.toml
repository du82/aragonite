title = "News / REDAXO Website"
full_description = "Entwicklertreffen in Zorge Veröffentlicht am 04.11.2018 Am ersten November-Wochenende haben wir uns wieder einmal in einer kleinen Gruppe zusammengesetzt, um miteinander zu arbeiten. Wieder wurde viel diskutiert, gelacht und (gut) gegessen. Anfangs haben wir uns hauptsächlich darüber ausgetauscht, für welche Zielgruppe REDAXO eigentlich gedacht ist und wie man es schafft, einen möglichst leichten Einstieg zu ermöglichen – oder zumindest schnell zu vermitteln, wie viele Möglichkeiten das sehr flexible System bietet. Es wurde auch darüber diskutiert, wie sich REDAXO weiter entwickeln könnte/sollte (Stichworte: Composer / Core-Funktionalitäten, AddOns, Doku etc.). In einem kleinen Brainstorming haben wir die REDAXO-Pro und -Contras gesammelt. Natürlich haben wir an diesem Wochenende auch gearbeitet. Wir haben die Doku aktualisiert, neue Ideen entwickelt, neue Issues geschrieben, bestehende Issues bearbeitet, Probleme gelöst und neue geschaffen :-). Es bleibt spannend, und es gibt weiterhin viel zu tun. Falls Du mitmachen möchtest, gibt es ganz sicher vieles, was auch Du beitragen kannst. Jedes Erfahrungslevel, jeder Programmierer, jeder Grafiker oder auch jeder Anwender kann etwas dazu beitragen, das System weiter voran zu bringen. Melde Dich einfach bei uns. Wir freuen uns auf Dich! Mit dabei waren (A-Z): Peter Bickel, Thomas Blum, Wolfgang Bund, Tim Filler, Marco Hanke, Gregor Harlan, Oliver Kreischer, Jan Kristinus, Marcel Kuhmann, Thomas Skerbis, Markus Staab und Peter Thiel Entwicklertreffen in Zorge Veröffentlicht am 04.11.2018 Am ersten November-Wochenende haben wir uns wieder einmal in einer kleinen Gruppe zusammengesetzt, um miteinander zu arbeiten. Wieder wurde viel diskutiert, gelacht und (gut) gegessen. Anfangs haben wir uns hauptsächlich darüber ausgetauscht, für welche Zielgruppe REDAXO eigentlich gedacht ist und wie man es schafft, einen möglichst leichten Einstieg zu ermöglichen – oder zumindest schnell zu vermitteln, wie viele Möglichkeiten das sehr flexible System bietet. Es wurde auch darüber diskutiert, wie sich REDAXO weiter entwickeln könnte/sollte (Stichworte: Composer / Core-Funktionalitäten, AddOns, Doku etc.). In einem kleinen Brainstorming haben wir die REDAXO-Pro und -Contras gesammelt. Natürlich haben wir an diesem Wochenende auch gearbeitet. Wir haben die Doku aktualisiert, neue Ideen entwickelt, neue Issues geschrieben, bestehende Issues bearbeitet, Probleme gelöst und neue geschaffen :-). Es bleibt spannend, und es gibt weiterhin viel zu tun. Falls Du mitmachen möchtest, gibt es ganz sicher vieles, was auch Du beitragen kannst. Jedes Erfahrungslevel, jeder Programmierer, jeder Grafiker oder auch jeder Anwender kann etwas dazu beitragen, das System weiter voran zu bringen. Melde Dich einfach bei uns. Wir freuen uns auf Dich! Mit dabei waren (A-Z): Peter Bickel, Thomas Blum, Wolfgang Bund, Tim Filler, Marco Hanke, Gregor Harlan, Oliver Kreischer, Jan Kristinus, Marcel Kuhmann, Thomas Skerbis, Markus Staab und Peter Thiel"
