["https://redaxo.org/cms/news/redaxo-community-trifft-sich-in-bozen-austausch%2525252c-workshops-und-neue-tools-zur-verbesserung-von-code-qualitaet"]
title = "News / REDAXO Website"
full_description = "REDAXO-Community trifft sich in Bozen: Austausch, Workshops und neue Tools zur Verbesserung von Code-Qualität Veröffentlicht am 04.04.2023 Vom 23. bis 26. März 2023 fand in Bozen ein Community-Treffen für begeisterte Redaxo-Entwickler:innen statt. Das Ziel des Treffens war es, Ideen auszutauschen, Workshops zu halten und Best Practices zu diskutieren. Das Community-Treffen bot den Teilnehmer:innen eine einzigartige Gelegenheit, sich mit anderen REDAXO-Entwickler:innen zu vernetzen und voneinander zu lernen. Dabei lag ein besonderer Fokus auf dem YDeploy-Workshop, bei dem die Teilnehmer:innen lernten, wie man REDAXO-Projekte schnell und einfach auf Servern deployt. Neben den Workshops gab es auch eine Exkursion zum Messner Mountain Museum, wo die Teilnehmer:innen die atemberaubende Landschaft Südtirols genießen konnten. Ein Höhepunkt des Treffens war die Vorstellung von REXSTAN – einem praktischen Code-Analyse-Tool, das Produktivität und Code-Qualität verbessern hilft. Besonders interessant für Entwickler:innen war der Vortrag zur Nutzung von GraphQL über REDAXO für Headless-Endpoints. Hier konnten die Teilnehmer:innen lernen, wie sie Daten aus REDAXO-Projekten effektiv nutzen können. Eine Überraschung bot die Premiere des AddOns REXfactor von Markus Staab. Mit diesem Tool können Entwickler:innen den Code ihrer Projekte automatisch analysieren und verbessern lassen. Insgesamt war der REDAXO-Tag in Bozen ein großer Erfolg und bot eine einmalige Gelegenheit für die Community, sich zu vernetzen und voneinander zu lernen. Die Teilnehmer:innen konnten neue Ideen mit nach Hause nehmen und ihre REDAXO-Projekte weiter verbessern. Wir freuen uns bereits auf das nächste Community-Treffen! REDAXO-Community trifft sich in Bozen: Austausch, Workshops und neue Tools zur Verbesserung von Code-Qualität Veröffentlicht am 04.04.2023 Vom 23. bis 26. März 2023 fand in Bozen ein Community-Treffen für begeisterte Redaxo-Entwickler:innen statt. Das Ziel des Treffens war es, Ideen auszutauschen, Workshops zu halten und Best Practices zu diskutieren. Das Community-Treffen bot den Teilnehmer:innen eine einzigartige Gelegenheit, sich mit anderen REDAXO-Entwickler:innen zu vernetzen und voneinander zu lernen. Dabei lag ein besonderer Fokus auf dem YDeploy-Workshop, bei dem die Teilnehmer:innen lernten, wie man REDAXO-Projekte schnell und einfach auf Servern deployt. Neben den Workshops gab es auch eine Exkursion zum Messner Mountain Museum, wo die Teilnehmer:innen die atemberaubende Landschaft Südtirols genießen konnten. Ein Höhepunkt des Treffens war die Vorstellung von REXSTAN – einem praktischen Code-Analyse-Tool, das Produktivität und Code-Qualität verbessern hilft. Besonders interessant für Entwickler:innen war der Vortrag zur Nutzung von GraphQL über REDAXO für Headless-Endpoints. Hier konnten die Teilnehmer:innen lernen, wie sie Daten aus REDAXO-Projekten effektiv nutzen können. Eine Überraschung bot die Premiere des AddOns REXfactor von Markus Staab. Mit diesem Tool können Entwickler:innen den Code ihrer Projekte automatisch analysieren und verbessern lassen. Insgesamt war der REDAXO-Tag in Bozen ein großer Erfolg und bot eine einmalige Gelegenheit für die Community, sich zu vernetzen und voneinander zu lernen. Die Teilnehmer:innen konnten neue Ideen mit nach Hause nehmen und ihre REDAXO-Projekte weiter verbessern. Wir freuen uns bereits auf das nächste Community-Treffen!"
