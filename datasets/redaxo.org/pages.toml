cheren Anstrich. Zusätzlich lässt sich die "Hauptfarbe" des Layouts im REDAXO wählen. github.com/novinet-git/nv_betheme Versionen 5.x nvModulePresets Addon zum Speichern und Wiederverwenden von Modulvorlagen. Features -------- - Möglichkeit aus vorhandenen (ausgefüllten) Modulen Vorlagen zu erstellen - Möglichkeit aus den Vorlagen ein neues Inhaltselement anzulegen github.com/novinet-git/nv_modulepresets Versionen 5.x nvModulepreview Addon zur schöneren und übersichtlicheren Darstellung der Module in der Modulauswahl. Features -------- - Möglichkeit Vorschaubilder und Beschreibungen für Module zu hinterlegen - Möglichkeit Module in Kategorien zu sortieren - Möglichkeit Anzahl der Module je Zeile zu bestimmen - Möglichkeit Suche für Module zu aktivieren - Möglichkeit das Addon auch für das Addon Gridblock zu nutzen github.com/novinet-git/nv_modulepreview Versionen 5.x path-basiertes URL-Rewrite für Redaxo 5 Dieses AddOn ist eine Erweiterung des Standard-Rewriters und nutzt den Extension Point URL_REWRITE. Der Artikel-URL wird in der Form eines Kategorien-Pfades gebildet. Die Pfadanteile werden unabhängig von den Kategorien- und Artikelnamen gebildet. Auf diese Weise können die URLs kurz und lesbar gehalten werden. Jeder Artikel erhält diese zusätzlichen Parameter, die in der Artikel-Tabelle mitgeführt werden: einen Kurznamen, einen Kurznamen für die Kategorie und den vollständigen URL. Die zugehörigen Parameter werden als MetaInfos eingerichtet. Die Sprache einer Seite kann wahlweise im URL gekennzeichnet werden oder im Sinne eines "Sprach-Kontextes" durch eine Session-Variable definiert sein. Artikel können weiterhin auch über den Redaxo-Standard-URL index.php?article_id=ID&clang=CID aufgerufen werden. In der .htaccess-Datei sind keine besonderen RewriteRules erforderlich. busch-dettum.de/public/it/url_path_rewrite.html Versionen 5.x PHPMailer Profile Profile für das 📧 PHPMailer Addon, um unterschiedliche Absende-Adressen und/oder SMTP-Postfächer zu verwenden. 👶🏻 Kinderleicht einzurichten. ✅ In aktiver Weiterentwicklung. 🔗 Multidomain-Fähig. www.alexplus.de/redaxo-addons Versionen 5.x Quick Navigation Schnelle Navigation in Kategorien und zuletzt geänderte Artikel und Medien github.com/FriendsOfREDAXO/quick_navigation Versionen 5.x FriendsOfREDAXO Redactor Editor Integriert den Redactor WYSIWYG-Editor in aktueller Version 3. (Nachfolger des redactor2-AddOns) github.com/FriendsOfREDAXO/redactor Versionen 5.x FriendsOfREDAXO Responsive-Preview Stellt im Editiermodus eines Artikel eine Inline-Vorschau für verschiedene Devices/Auflösungen zur Verfügung. github.com/danspringer/mf_responsive_preview Versionen 5.x rokito Pexels Login Login Screen mit freien Bildern von Pexels rokito.de Versionen 5.x Schule - Branchenlösung für für weiterführende Schulen Verwalte mit diesem Addon * Lehrer:innen * Schulklasssen * Fächer * Organigramm WIP - Unterstützung und Kooperationspartner gesucht! github.com/alexplusde/school/ Versionen 5.x SEO Inspektor Ein SEO Ranking Tool fürs Backend. Dieses Addon erweitert die Seitenspalte im Backend um das Inspektor Panel. Hier wird der gesamte Artikel nach allgemeinen SEO Kriterien durchsucht und die Ergebnisse überischtlich aufgelistet. Darüber hinaus kann auf ein individuelles Fokus-Keyword geprüft werden. Der Inspektor ist damit eine Art interaktive SEO-Checkliste. rokito.de/ Versionen 5.x FriendsOfREDAXO SliceColumns Das REDAXO-AddOn erlaubt die Anordnung der Slices in Spalten und das Verschieben von Blöcken per Drag & Drop. github.com/FriendsOfREDAXO/slice_columns Versionen 5.x FriendsOfREDAXO Structure Tweaks Erweitert die Strukturübersicht um nützliche Funktionen zur Optimierung der Ansicht github.com/FriendsOfREDAXO/structure_tweaks Versionen 5.x FriendsOfREDAXO T-Racks - Module und Templates synchronisieren Keep Modules and Templates on track with T-Racks. Hilfsklasse zur Installation und Synchronisation von Templates und Modulen, die mit Add-ons mitgeliefert werden. Add-ons, die dieses System verwenden: Events, School, plus_bs5. Auch für eigene Addons einsetzbar! github.com/alexplusde/tracks Versionen 5.x Theme lock Mini-AddOn: Erzwingt das light theme ab REDAXO 5.13 github.com/FriendsOfREDAXO/theme_lock Versionen 5.x FriendsOfREDAXO Tiervermittlung für Tierschutzvereine Kommt mit einer vorgefertigten YForm-Oberfläche für die Verwaltung von Datensätzen www.alexplus.de/redaxo-addons Versionen 5.x TinyMCE TinyMCE: WYSIWYG-Editor für REDAXO github.com/FriendsOfREDAXO/tinymce/ Versionen 5.x FriendsOfREDAXO TreeStructure Ein AddOn um die Seitenstruktur als Baum darzustellen und anzupassen. Versionen 5.x FriendsOfREDAXO Uploader Upload mehrerer Dateien gleichzeitig in den Medienpool. Übergroße Bilder können vorher verkleinert werden. Versionen 5.x FriendsOfREDAXO Watson Suchagent für REDAXO Versionen 5.x YForm Adminer Berechtigte Benutzer - also Entwickler oder Admin - erhalten im YForm-Tablemanager kontext-bezogene Buttons, mit denen man direkt mittels Adminer Tabellen oder gefilterte Daten angezeigt bekommt. github.com/FriendsOfREDAXO/yform_adminer Versionen 5.x FriendsOfREDAXO YForm QuickEdit Mit QuickEdit lassen sich YForm-Datensätze ein wenig schneller, direkt aus der Datentabelle bearbeiten. Innerhalb der Datentabelle wird der eigentliche Datensatz in einer kompakteren Ansicht angezeigt und kann editiert werden ohne die Seite zu wechseln. github.com/FriendsOfREDAXO/yform_quick_edit Versionen 5.x FriendsOfREDAXO YForm Slug YForm Erweiterung zur Erzeugung eines Slugs aus dem Wert eines anderen Feldes. github.com/mizmiz/redaxo-yform_slug Versionen 5.x YForm UI Dieses Addon bietet eine einfache Möglichkeit yform-Felder mit einer Breite zu speichern. Dadurch spart man sich Zeit beim erstellen einer Tabelle und muss Felder nicht mit eigenen HTML-Feldern wrappen. github.com/FriendsOfREDAXO/yform_ui Versionen 5.x FriendsOfREDAXO Yform Usability Ergänzt YForm um nützliche Funktionen wie Drag & Drop und Status On/Off. github.com/FriendsOfREDAXO/yform_usability Version