["https://redaxo.org/cms/news/doku-zu-yform"]
title = "News / REDAXO Website"
full_description = "Doku zu YForm Veröffentlicht am 20.07.2016 “Wo ist die Dokumentation zum YForm-AddOn?” So hieß es schon öfters im REDAXO-Forum. Nun, sie ist zwar erst zu etwa drei Viertel fertig, aber der Großteil ist gemacht. In der neuen YForm-Version ist die Dokumentation als Plugin direkt im AddOn integriert. Am leichtesten kann man die neue Version über den Installer downloaden. Um die Dokumentation innerhalb von YForm sehen zu können, muss das Plugin “Docs” installiert werden. Außerdem: Die Technik, wie die Doku-Dateien im Markdown-Format ins AddOn integriert wurden, kann auch für andere AddOns mit einer ähnlich umfangreichen Hilfe/Anleitung genutzt werden. Beim Schreiben und Testen der Doku fielen uns natürlich auch einige Bugs in YForm auf, die wir bei der Gelegenheit gleich gefixt haben. Eventuelle Fehler zu YForm bitte hier melden: https://github.com/yakamara/redaxo_yform Eventuelle Fehler zur YForm-Doku bitte hier melden: https://github.com/yakamara/redaxo_yform_docs Doku zu YForm Veröffentlicht am 20.07.2016 “Wo ist die Dokumentation zum YForm-AddOn?” So hieß es schon öfters im REDAXO-Forum. Nun, sie ist zwar erst zu etwa drei Viertel fertig, aber der Großteil ist gemacht. In der neuen YForm-Version ist die Dokumentation als Plugin direkt im AddOn integriert. Am leichtesten kann man die neue Version über den Installer downloaden. Um die Dokumentation innerhalb von YForm sehen zu können, muss das Plugin “Docs” installiert werden. Außerdem: Die Technik, wie die Doku-Dateien im Markdown-Format ins AddOn integriert wurden, kann auch für andere AddOns mit einer ähnlich umfangreichen Hilfe/Anleitung genutzt werden. Beim Schreiben und Testen der Doku fielen uns natürlich auch einige Bugs in YForm auf, die wir bei der Gelegenheit gleich gefixt haben. Eventuelle Fehler zu YForm bitte hier melden: https://github.com/yakamara/redaxo_yform Eventuelle Fehler zur YForm-Doku bitte hier melden: https://github.com/yakamara/redaxo_yform_docs"
