on zum Verwalten von Stellenanzeigen in REDAXO mit sinnvollen Vorlagen für Bewerbungsformulare und einer Verwaltung von Bewerberdaten. #jobs #stellenangebote #bewerberformular #email #jsonld #alexplus www.alexplus.de/redaxo-addons Versionen 5.x Rk-Modulsammlung Modulsammlung www.raumkontakt.de/ Versionen 5.x Schule - Branchenlösung für für weiterführende Schulen Verwalte mit diesem Addon * Lehrer:innen * Schulklasssen * Fächer * Organigramm WIP - Unterstützung und Kooperationspartner gesucht! github.com/alexplusde/school/ Versionen 5.x Search It! Mit GPT Mit diesem Add-on können eigene GPTs über eine passende OpenAPI mit Antworten aus den Suchergebnissen von Search It ergänzt werden. www.alexplus.de/redaxo-addons Versionen 5.x Spreadsheet Export Spreadsheet Export stellt einfache Methoden und die PHP_XLSXWriter-Library zur Verfügung, um Daten als Spreadsheet (Excel / .xlsx) zur Verfügung zu stellen. www.alexplus.de/redaxo-addons Versionen 5.x Staff: Teamkollegen, Ansprechpartner*innen und Mitarbeitende Verwaltung von Personen für Team-Seiten, Mitarbeitenden und Ansprechpartner*innen. Mit sinnvollen Standardfeldern wie: Name, E-Mail, Abteilung, Beschreibung/Vita. 📄 Exzellent dokumentiert. ⭐ Anpassbar und erweiterbar. 🚀 YForm-Fundament. 🚧 Unterstützung gesucht: Zusätzliche Methoden für das direkte komfortable Erstellen von VCard-Dateien und QR-Codes www.alexplus.de/redaxo-addons Versionen 5.x Stellenmarkt Zur Verwaltung von Stellenanzeigen in Redaxo. Optional können Anzeigen aus dem XML Export der Firma HR4YOU importiert werden. github.com/friendsOfREDAXO/jobs Versionen 5.x FriendsOfREDAXO T-Racks - Module und Templates synchronisieren Keep Modules and Templates on track with T-Racks. Hilfsklasse zur Installation und Synchronisation von Templates und Modulen, die mit Add-ons mitgeliefert werden. Add-ons, die dieses System verwenden: Events, School, plus_bs5. Auch für eigene Addons einsetzbar! github.com/alexplusde/tracks Versionen 5.x Tiervermittlung für Tierschutzvereine Kommt mit einer vorgefertigten YForm-Oberfläche für die Verwaltung von Datensätzen www.alexplus.de/redaxo-addons Versionen 5.x Wildcard Übersetzungen und Ersetzungen 🎴 Wildcard - Ersetzungen von Sprach-Platzhaltern in REDAXO neu gedacht Wildcard lässt dich Platzhalter nutzen, die du in deinem Addon oder Theme definierst. Redakteure können dadurch deine Sprachübersetzungen nutzen oder mit eigenen überschreiben. Die Änderungen bleiben dann auch bei einem Update deines Addons erhalten. ## Features * Ersetzung von Platzhaltern in jeder Sprache * Einfache Verwaltung durch YForm: Exportieren und importieren von Sprachdateien * Synchronisation von Wildcard-Dateien von Addons in das Projekt * Einfaches Kopieren und Einfügen von Platzhaltern www.alexplus.de/redaxo-addons Versionen 5.x YDeploy Export Erzeugt beim Deployen automatisch ein Backup und auf Knopfdruck einen Export, den man lokal einspielen kann. Versionen 5.x YForm - Formularbuilder und Tabellenmanager YForm hilft beim Erstellen von Formularen sowohl im Frontend als auch im Backend. Im REDAXO-Backend kann man mit dem Formular-Manager von YForm beliebige Datenbank-Verwaltungen erstellen; hierzu stehen eine Vielzahl verschiedener Felder und Feldtypen bereit. Die Tabellen können auch verknüpft werden, und dank zahlreicher Validierungen lassen sich die Eingaben vielfältig überprüfen. Die Felder und Validierungen stehen auch im Frontend zur Verfügung – hier kann man sowohl eine durch Querstriche getrennte Pipe-Notation als auch die etwas flexiblere PHP-Schreibweise nutzen. Mittels Aktionen lassen sich die im Formular eingebenen Daten zum Beispiel per Mail versenden, in die Datenbank schreiben oder existierende Daten verändern. Die HTML-Code für das Frontend ist in Templates organisiert, so dass man flexibel eigene Templates für das Formular anlegen kann. github.com/yakamara/redaxo_yform/ Versionen 5.x YForm Adminer Berechtigte Benutzer - also Entwickler oder Admin - erhalten im YForm-Tablemanager kontext-bezogene Buttons, mit denen man direkt mittels Adminer Tabellen oder gefilterte Daten angezeigt bekommt. github.com/FriendsOfREDAXO/yform_adminer Versionen 5.x FriendsOfREDAXO YForm Field Erweitert YForm um weitere Feldtypen, Validierungen und Actions. Highlights: 🧩 datetime_local (HTML5-Datumsfeld) 🧩 choice_status (Statusschalter) 🧩 privacy_policy (Dataenschutz-Checkbox) 🧩 submit_once (Absenden-Button mit Doppelklick-Sperre) 🧩 attachment-Action (Anhänge hinzufügen) 🤖 OpenAI-Felder für Teaser und eigene Prompts (in Entwicklung) www.alexplus.de/redaxo-addons Versionen 5.x yForm Mediafile upload ‼️Veraltetes Medien-Upload-Feld für yForm >> 4. - Stellt das Feld wieder zur Verfügung. Dies ist eine Zwischenlösung, bis ein geeigneter Ersatz für YForm entwickelt wurde. github.com/FriendsOfREDAXO/yform_mediafile Versionen 5.x FriendsOfREDAXO YForm Slug YForm Erweiterung zur Erzeugung eines Slugs aus dem Wert eines anderen Feldes. github.com/mizmiz/redaxo-yform_slug Versionen 5.x YForm UI Dieses Addon bietet eine einfache Möglichkeit yform-Felder mit einer Breite zu speichern. Dadurch spart man sich Zeit beim erstellen einer Tabelle und muss Felder nicht mit eigenen HTML-Feldern wrappen. github.com/FriendsOfREDAXO/yform_ui Versionen 5.x FriendsOfREDAXO YOrm Model Class Accelerator (YMCA) Beschleunigt die Entwicklung YForm-basierter Projekte und Addons. Erstelle dein Tableset und erhalte: 🚀 Prototypische YOrm-Klassen inkl. Type Hinting und Kommentaren 🚀 Prototypische technische Dokumentation (Markdown) 🚀 Prototypische API-Route (für YForm REST-Plugin) 🚀 Prototypische Fragmente zur Ausgabe und PDF-Generierung Du möchtest daraus ein Addon machen? Schau dir die Addon-Vorlage Blaupause an, in das du die aus `ymca` erstellten Dokumente und Code einsetzen kannst. www.alexplus.de/redaxo-addons Versionen 5.x'''
