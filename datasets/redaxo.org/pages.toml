["https://redaxo.org/cms/news/rueckblick-redaxo-tag-2025-in-heilbronn"]
title = "News / REDAXO Website"
full_description = "Rückblick: REDAXO-Tag 2025 in Heilbronn Veröffentlicht am 25.02.2025 Der REDAXO-Tag 2025 führte uns ins schöne Ländle, nach Heilbronn. Knapp 50 Teilnehmer fanden sich in der Stadt zusammen, um sich auszutauschen! Bereits am Freitagabend trafen die ersten Teilnehmer ein. Daniel Nasse und sein engagiertes Team luden zu einer Agentur-Party ein, welche von circa 40 Teilnehmern besucht wurde, mit leckerem Essen, Unterhaltung und guter Laune inklusive sorgte die Party für eine tolle Stimmung. Danach ging es noch ins Restaurant Erntbar, wo ein köstliches Abendessen serviert wurde – auch wenn wir mit über 30 Personen die Kapazitäten sprengten. Der eigentliche REDAXO-Tag begann dann am Samstagvormittag. In den zwei Konferenzräumen des Parkhotels war genug Platz für alle, ausgestattet mit Präsentationsmöglichkeiten und – nicht zu vergessen – reichlich Kaffee. Der REDAXO-Tag 2025 startete mit einer Tradition: Ein großes Schere-Stein-Papier-Turnier, bei dem alle Teilnehmer gegeneinander antraten. Die Gewinner sammelten dabei fleißig Fans! Nachdem alle aufgelockert waren, übernahm Jan mit Bravour die Moderation des Tages. Themen wurden gesammelt, der Ablauf geplant. Dank des schönen Wetters konnte sogar eine zweite Runde Kaffee und Frühstückshäppchen auf der Terrasse des Parkhotels genossen werden. Nach dieser ersten Pause folgte ein Vortrag von Alexander und Thomas, der sicherlich für alle Teilnehmer relevant war: Es ging um das Thema Barrierefreiheit – was sie wirklich bedeutet und wie sie in REDAXO umgesetzt werden kann. Im Anschluss hielt Jan einen weiteren Vortrag zu einem Thema, das alle Entwickler beschäftigt: Künstliche Intelligenz. Auch wenn es nicht direkt um REDAXO ging, war der Vortrag für die Teilnehmer von großem Interesse. In einer intensiven Diskussion wurden Erfahrungen zur KI ausgetauscht: Was funktioniert zuverlässig, was nicht? Was ist sinnvoll, und wie kann uns KI das Leben erleichtern? Auch die rechtlichen Aspekte von KI-generierten Inhalten wurden thematisiert. Ein praktisches Entwicklungsbeispiel rundete den Vortrag ab. Nach diesem energiegeladenen Vormittag war es Zeit für die Mittagspause. Das Parkhotel hatte ein hervorragendes Buffet angerichtet, das zum Schlemmen und Genießen einlud. Am Nachmittag fanden traditionell Workshops und Vorträge in kleineren Gruppen statt. Hier hatte jeder die Möglichkeit, sich zu Themen einzubringen, die ihm besonders am Herzen lagen. Zum offiziellen Abschluss des REDAXO-Tages wurde das Thema KI erneut aufgegriffen: Was wird in Zukunft gebraucht? Was ist umsetzbar? Auch ein Blick in die Zukunft von REDAXO wurde geworfen. Es gibt einige spannende Visionen für die kommenden Jahre, auch ein REDAXO 6 wurde angeteasert. Für diejenigen, die Interesse hatten, bot sich die Gelegenheit, an einer Stadtführung durch Heilbronn teilzunehmen – natürlich geführt von Daniel Nasse persönlich. So hat ungefähr die Hälfte der Teilnehmer das aufstrebende Städtchen noch besser kennengelernt. Der Samstagabend fand seinen Ausklang bei einem gemeinsamen Abendessen im Braustübl, wo traditionell schwäbische Gerichte serviert wurden. Der ein oder andere Teilnehmer blieb sicherlich noch für ein kühles Getränk, das bis in die späten Stunden genossen wurde. Am Sonntagmorgen trafen sich einige Teilnehmer zu einem gemütlichen Frühstück bzw. Brunch bei einem lokalen Bäcker, andere trafen sich zum gemeinsamen Besuch der Experimenta, einer lokalen Attraktion zum Lernen und Entdecken, das Wochenende in Heilbronn fand langsam sein Ende. Der REDAXO-Tag in Heilbronn war ein voller Erfolg! Die Gastgeber bedanken sich herzlich bei allen Teilnehmern für das zahlreiche Erscheinen und das gesellige Beisammensein."
