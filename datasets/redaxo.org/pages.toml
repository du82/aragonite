["https://redaxo.org/cms/news/hackathon-in-hannover"]
title = "News / REDAXO Website"
full_description = "Hackathon in Hannover Veröffentlicht am 05.03.2020 Wir haben uns in einem großen Haus in Hannover-Linden getroffen, um an REDAXO zu arbeiten. Wir, das waren diesmal das Core-Team und einige aktive Menschen aus der Community. Das Haus war kalt, aber wir waren on fire! Die Heizung war ausgefallen, und es gab nur zwei mobile Heizlüfter für den großen Raum, in dem wir gearbeitet haben. Nichtsdestotrotz waren wir furchtbar produktiv und haben an zahlreichen Themen gearbeitet, etwa: Medienpool-Konzepte entwickelt Die aktuelle Situation der vielen Editoren analysiert (Textile vs. Markdown vs. WYSIWYG) Slice-Status online/offline für den Core besprochen (kommt mit R 5.10) Über ein neues Backend diskutiert Maßnahmen für die REDAXO-Website festgelegt Die Community-Demo aktualisiert und veröffentlicht (Peter!) Das Installer-AddOn aufgebohrt Die neuen Docker-Images getestet und erweitert Zahlreiche Pull Requests erstellt (vor allem Markus) Haufenweise GitHub-Issues geschlossen und manche neue angelegt Das Treffen in Hannover hat dazu geführt, dass REDAXO 5.10 vermutlich das schnellste Feature-Release von allen sein wird. Eine Beta-Version wurde bereits veröffentlicht. Viele Grüße! Alex, Claudia, Dirk, Gregor, Jan, Marcel, Markus, Norbert, Pascal, Peter und Thomas Hackathon in Hannover Veröffentlicht am 05.03.2020 Wir haben uns in einem großen Haus in Hannover-Linden getroffen, um an REDAXO zu arbeiten. Wir, das waren diesmal das Core-Team und einige aktive Menschen aus der Community. Das Haus war kalt, aber wir waren on fire! Die Heizung war ausgefallen, und es gab nur zwei mobile Heizlüfter für den großen Raum, in dem wir gearbeitet haben. Nichtsdestotrotz waren wir furchtbar produktiv und haben an zahlreichen Themen gearbeitet, etwa: Medienpool-Konzepte entwickelt Die aktuelle Situation der vielen Editoren analysiert (Textile vs. Markdown vs. WYSIWYG) Slice-Status online/offline für den Core besprochen (kommt mit R 5.10) Über ein neues Backend diskutiert Maßnahmen für die REDAXO-Website festgelegt Die Community-Demo aktualisiert und veröffentlicht (Peter!) Das Installer-AddOn aufgebohrt Die neuen Docker-Images getestet und erweitert Zahlreiche Pull Requests erstellt (vor allem Markus) Haufenweise GitHub-Issues geschlossen und manche neue angelegt Das Treffen in Hannover hat dazu geführt, dass REDAXO 5.10 vermutlich das schnellste Feature-Release von allen sein wird. Eine Beta-Version wurde bereits veröffentlicht. Viele Grüße! Alex, Claudia, Dirk, Gregor, Jan, Marcel, Markus, Norbert, Pascal, Peter und Thomas"
