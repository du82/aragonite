["https://redaxo.org/doku/5.15"]
title = "Dokumentation REDAXO 5.15 / Doku / REDAXO Website"
full_description = "Dokumentation REDAXO 5.15 Die REDAXO-Dokumentation ist der Startpunkt für die Installation und Redaktion einer REDAXO-Webpräsenz. Zudem finden Developer hier auch die erforderlichen Informationen zur Entwicklung eigener Lösungen. Wir freuen uns sehr über Mitarbeit bei der REDAXO-Dokumentation. Derzeit arbeiten Peter Bickel, Thomas Skerbis, Wolfgang Bund und Alexander Walther an der Dokumentation. Unterstützung wird immer benötigt; die Dokumentation wird in GitHub gepflegt und erweitert, sodass sich alle beteiligen können. Neue Artikel oder Verbesserungen können gerne per Pull-Request oder Issues eingereicht werden. Zur Dokumentation auf GitHub. Neues in dieser Doku REDAXO unterstützt den Login per passkey. Die Einrichtung erfolgt auf der Profilseite. Dumps können jetzt auch durchsucht werden, siehe Debugging. Übersicht der Kategorien Einleitung Grundlegende Informationen zur aktuellen Version, Aktualisierung, API Setup und Administration Installationsanleitung, erster Login, Passwort-Wiederherstellung Anwender Der Bereich für Anwender ist primär an Redakteurinnen und Redakteure gerichtet. Hier wird die Bedienung des Systems erläutert. Basis Grundlegende technische Informationen zum Aufbau einer REDAXO-Webpräsenz Service Informationen für Developer Weitere System AddOns / PlugIns Informationen zu System Addons AddOn-Entwicklung Entwicklung und Bereitstellung eigener AddOns Datenbank Datenbankabfragen, Tabellen ändern und Prioritäten Artikel bearbeiten"
