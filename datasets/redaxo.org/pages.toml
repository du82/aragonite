["https://redaxo.org/download/addons/tags/cache_warmup"]
title = "AddOns / REDAXO Website"
full_description = "AddOn Kategorie Alle KategorienAuswertungen / Counter / Statistik 43Backendanpassungen 104Community / Multiuser 18Datenbanken 66Entwickler 94Ersetzungen 29Framework 23Multimedia 43Sicherheit 22Sonstiges 238Sprachen 12URL / SEO 41 suchen Cache-Warmup Beschreibung Generiert den Cache vorab, so dass die Website bereits beim Erstaufruf performant läuft. Manchmal hinterlegt man eine Website zur Ansicht auf einem Testserver. Häufig wird davor oder danach der REDAXO-Cache gelöscht, um veraltete Inhalte zu entfernen, die vielleicht noch aus der Entwicklungszeit enthalten sind. Danach allerdings müssen alle Inhalte neu generiert werden. REDAXO übernimmt dies eigenständig beim Aufruf jeder Seite. Diese initialen Seitenaufrufe können leider recht langsam sein, vor allem, wenn der Cache für viele Bilder generiert werden muss. Nutzer*innen, denen die technischen Hintergründe nicht bekannt sind, und die erstmalig die Website anschauen, könnten nun (fälschlicherweise) annehmen, REDAXO sei nicht sonderlich schnell. Verständlich, denn sie erhalten im ersten Moment keine performante Website. Das Cache-Warmup-Addon kann alle verwendeten Inhalte der Website vorab generieren, so dass danach niemand mehr unnötig lange warten muss. github.com/FriendsOfREDAXO/cache_warmup Umsetzung FriendsOfREDAXO Versionen 4.0.0 Für REDAXO ^5.4 Veröffentlicht am 02.07.2022 Require / PHP >=7.4 Breaking changes Erfordert REDAXO 5.4 und PHP 7.4 als Mindestversionen Alter Code wurde entfernt, um die Komplexität zu verringern! :) 3.7.1...4.0.0 herunterladen 3.7.1 Für REDAXO ^5.2 Veröffentlicht am 12.06.2022 Require / PHP >=7.1 Bugfixes Externe Pakete aktualisiert Code aufgeräumt 3.7.0...3.7.1 herunterladen"
