title = "AddOns / REDAXO Website"
full_description = "AddOn Kategorie Alle KategorienAuswertungen / Counter / Statistik 43Backendanpassungen 104Community / Multiuser 18Datenbanken 66Entwickler 94Ersetzungen 29Framework 23Multimedia 43Sicherheit 22Sonstiges 238Sprachen 12URL / SEO 41 suchen 2-Faktor-Authentifizierung mittels one-time-password (OTP) per APP oder E-Mail. Beschreibung Das AddOn ermöglicht es eine 2 Faktor-Authentifizierung für das REDAXO-Login bereitzustellen. Administratoren können die 2 Faktor Authentifizierung für die Benutzer erzwingen oder auch optional anbieten. Nutzer werden nach Eingabe der Benutzerdaten aufgefordert, den einmal generierten zeitlich begrenzten Code zur Verifikation einzugeben um in das System zu gelangen. Weitere Informationen zur Einrichtung und Links zu entsprechenden Apps finden sich in der Hilfe. github.com/FriendsOfREDAXO/2factor_auth Umsetzung FriendsOfREDAXO Versionen 2.3 Für REDAXO ^5.14.0 Veröffentlicht am 14.09.2024 Require / PHP >=8.1 What's Changed Fehler im Installieren und Unstall behoben Exception bei Challenge wird abgefangen und ausgegeben. Z.B. wird angezeigt, wenn ein E-Mail Versand fehlschlägt. README angepasst und Infos ergänzt Full Changelog: https://github.com/FriendsOfREDAXO/2factor_auth/compare/2.0.0...2.3 herunterladen 2.2 Für REDAXO ^5.14.0 Veröffentlicht am 30.07.2024 Require / PHP >=8.1 What's Changed Vendorupdates Fehlversuche werden gesondert getrackt und mit Zeitblocker hinterlegt Übersicht über den Status der User. Auch als command aufrufbar E-Mal Zeitfenster funktionierte nicht richtig Full Changelog: https://github.com/FriendsOfREDAXO/2factor_auth/compare/2.0.0...2.2 herunterladen 2.1 Für REDAXO ^5.13.0 Veröffentlicht am 29.12.2023 Require / PHP >=7.2 What's Changed Text Korrekturen Passwortändernseite erschien zu früh, vor dem OTP REDAXO Version ist nun mindestens 5.13 E-Mail Intervall ist nun einstellbar Impersonatorprobleme behoben Full Changelog: https://github.com/FriendsOfREDAXO/2factor_auth/compare/2.0.0...2.1 herunterladen 2.0.6 Für REDAXO ^5.7.0 Veröffentlicht am 17.11.2022 Require / PHP >=7.2 What's Changed Text Corrections namespace to FriendsOfREDAXO Options for E-Mail and or TOPT Settings moved vom System to own SettingPage CodeStyle Full Changelog: https://github.com/FriendsOfREDAXO/2factor_auth/compare/2.0.0...2.0.6 herunterladen 2.0.5 Für REDAXO ^5.7.0 Veröffentlicht am 20.10.2022 Require / PHP >=7.2 What's Changed Text Corrections Implemented better understanding for users during 2fa process Full Changelog: https://github.com/FriendsOfREDAXO/2factor_auth/compare/2.0.3...2.0.5 herunterladen 2.0.4-dev Für REDAXO ^5.7.0 Veröffentlicht am 20.10.2022 Require / PHP >=7.2 What's Changed Text Corrections Implemented better understanding for users during 2fa process Full Changelog: https://github.com/FriendsOfREDAXO/2factor_auth/compare/2.0.3...2.0.4 herunterladen 2.0.3 Für REDAXO ^5.7.0 Veröffentlicht am 19.08.2022 Require / PHP >=7.2 What's Changed Console Enforcement by @dergel in https://github.com/FriendsOfREDAXO/2factor_auth/pull/68 Period email, E-Mail initial, Methodenupdate by @dergel in https://github.com/FriendsOfREDAXO/2factor_auth/pull/71 Adding missing Translations for Pages by @skerbis in https://github.com/FriendsOfREDAXO/2factor_auth/pull/72 New Contributors @dergel made their first contribution in https://github.com/FriendsOfREDAXO/2factor_auth/pull/68 Full Changelog: https://github.com/FriendsOfREDAXO/2factor_auth/compare/2.0.2...2.0.3 herunterladen 2.0.2 Für REDAXO ^5.7.0 Veröffentlicht am 17.07.2022 Require / PHP >=7.2 What's Changed prevent whoops on missing phpmailer addon by @staabm in https://github.com/FriendsOfREDAXO/2factor_auth/pull/65 Full Changelog: https://github.com/FriendsOfREDAXO/2factor_auth/compare/2.0.1...2.0.2 herunterladen 2.0.1 Für REDAXO ^5.7.0 Veröffentlicht am 16.07.2022 Require / PHP >=7.2 fixes für cannot re-declare rex_request function errors #64 Full Changelog: https://github.com/FriendsOfREDAXO/2factor_auth/compare/2.0...2.0.1 herunterladen 2.0.0 Für REDAXO ^5.7.0 Veröffentlicht am 14.07.2022 Require / PHP >=7.2 Neu in den System Einstellungen kann man konfigurieren ob 2fa pflicht ist und für wen (2fa optional vs. Pflicht für alle user vs Pflicht nur für Admins) Alternativ zum OTP 2 Faktor auth - der eine authenticator app benötigt - gibts jetzt auch eine Alternative: über E-Mail Darstellung ans default Theme angepasst / views in fragmente ausgelagert Hilfe Seite als Tab vendor updates PHP Mindestversion 7.3+ New Contributors @Geri2017 made their first contribution in https://github.com/FriendsOfREDAXO/2factor_auth/pull/30 @bloep made their first contribution in https://github.com/FriendsOfREDAXO/2factor_auth/pull/22 @slartibartfass made their first contribution in https://github.com/FriendsOfREDAXO/2factor_auth/pull/45 @skerbis made their first contribution in https://github.com/FriendsOfREDAXO/2factor_auth/pull/44 @ytraduko-bot made their first contribution in https://github.com/FriendsOfREDAXO/2factor_auth/pull/46 @eaCe made their first contribution in https://github.com/FriendsOfREDAXO/2factor_auth/pull/56 Full Changelog: https://github.com/FriendsOfREDAXO/2factor_auth/compare/1.0...2.0 herunterladen 1.0.0 Für REDAXO ^5.7.0 Veröffentlicht am 13.03.2019 Require / PHP ^7.1 Erstes Release - Erfordert Redaxo >=5.7.0 herunterladen"
