["https://redaxo.org/cms/news/redaxo-5.6-veroeffentlicht"]
title = "REDAXO 5.6 veröffentlicht / REDAXO Website"
full_description = "REDAXO 5.6 veröffentlichtBereits letzte Woche, am 5.6., wurde REDAXO 5.6 veröffentlicht. Es enthält neben Fehlerkorrekturen und weiteren Sicherheitsmerkmalen auch einige neue Funktionen für Redakteure und Entwicklende. Besonderheiten dieses Releases: Admins können in andere Benutzer wechseln, ohne deren Passwort zu kennen. HTTPS kann für Frontend und/oder Backend erzwungen werden. Lizenzen der verwendeten Pakete werden in Kurzform aufgelistet und enthalten Links zur vollständigen Lizenz. Mehrsprachigkeit im Backend: Fehlt eine Übersetzung, fällt das System automatisch auf Englisch und Deutsch zurück. Einige neue Konsolen-Befehle rex_form: Neue Klasse rex_config_form für Speicherung in rex_config rex_sql: utf8mb4, neue Methoden für Transactions, insertOrUpdate, addRecord Es wird nun keine Session mehr gestartet, wenn bereits der Session-Cookie nicht existiert. Backup-AddOn: Speicherbedarf beim Export reduziert Installer-AddOn: Addons können nach Veröffentlichungsdatum sortiert werden. Medienpool-AddOn: Neue EPs MEDIA_CATEGORY_IS_IN_USE und MEDIA_DETAIL_SIDEBAR phpmailer-AddOn: Hilfe und Dokumentation structure-AddOn: Neue EPs ART_MOVED und ART_COPIED, Verbesserungen der UI und der Benutzbarkeit Alle Infos bei Github Das vollständige Changelog auf GitHub Fehler melden und Verbesserungen einreichen auf GitHub Feature: Identität wechseln Admins haben nun die Möglichkeit, temporär und ohne Kenntnis des Passworts in andere Nutzer zu wechseln. Dies ist sehr nützlich, um Kunden und Anwendern Hilfe zu leisten und beispielsweise zu prüfen, welche Inhalte sie sehen und welche Funktionen sie benutzen können. Feature: Konsolenbefehle Die Bedienung von REDAXO über die Konsole wurde mit REDAXO 5.4 integriert. Anfangs noch für AddOns, dann auch für den Core. Mit REDAXO 5.6 gibt es inzwischen eine recht lange Liste von Konsolenbefehlen, die ihr unbedingt ausprobieren solltet! Feature: Mehrsprachigkeit mit Fallback Fehlt eine Übersetzung — wie im Screencast zu sehen etwa für Italienisch —, fällt das System automatisch auf Englisch und Deutsch zurück. In vorherigen REDAXO-Versionen wurden noch Platzhalter für Übersetzungen ausgegeben. Damit war das Backend benutzbar, allerdings nicht allzu nutzerfreundlich. Mit REDAXO 5.6 wird nun erst Englisch ausgegeben, falls eine Übersetzung in der ausgewählten Sprache nicht vorhanden ist, und in letzter Instanz Deutsch, falls auch Englisch fehlt. Wir hoffen, damit die Benutzbarkeit des Systems deutlich zu verbessern. Vor allem auch im Hinblick darauf, dass automatisierte Übersetzungshilfen kontinuierlich besser werden und immer tiefer in Betriebssysteme integriert werden."
author = ""
