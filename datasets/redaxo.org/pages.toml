["https://redaxo.org/download/addons/tags/be_branding"]
title = "AddOns / REDAXO Website"
full_description = 'AddOn Kategorie Alle KategorienAuswertungen / Counter / Statistik 43Backendanpassungen 104Community / Multiuser 18Datenbanken 66Entwickler 94Ersetzungen 29Framework 23Multimedia 43Sicherheit 22Sonstiges 238Sprachen 12URL / SEO 41 suchen Backend Branding (inkl. Favicon Generator Frontend + Backend) Beschreibung Mit dem AddOn lässt sich das Backend von Redaxo branden, um dem Backend eine individuellere Note zu geben. Damit kann man, wenn man mehrere REDAXO-Projekte betreut, das Backend auf einen Blick schneller unterscheiden. Features: Einfärben des Headers und REDAXO-Logos im Backend Anpassen des Login-Screens aus dem Backend heraus Generierung von Favicon-Sets für das Frontend (Imagemagick benötigt) Einfärben des Favicon im Backend (Imagemagick benötigt) Anzeigen eines Projektlogos im Login-Screen und in der Navigation des Backends Anzeigen eines (Agentur-) Logos und Anschrift o.ä. in den Credits Anzeigen eines (Agentur-) Namens im Footer des Backends Anzeigen einer zusätzlichen Hinweisleiste (border) im Backend github.com/medienfeuer/be_branding Umsetzung Medienfeuer zum Profil Königstraße 22 70173 Stuttgart www.medienfeuer.de Versionen 1.8.1 Für REDAXO >=5.13 Veröffentlicht am 29.01.2024 1.8.1 Letzte Version vor REDAXO 5.16 - Plugins werden entfernt (z.B. Customizer) - ggf. wird die Backendstruktur von Redaxo dann angepasst. Mit REDAXO 5.16 soll dann eine neue Version von be_branding kommen. Fixed: Splashscreen in Readme angepasst herunterladen 1.8.0-beta3 Für REDAXO >=5.13 Veröffentlicht am 13.10.2022 1.8.0-beta3 | 13.10.2022 1.8.0-beta3 Logopfad für Login-Screen bei Installation in Unterordner angepasst #31 Neu: Multidomainfähigkeit: Es können nun pro in YRewrite angelegter Domain verschiedene Profile für das Backend angelegt werden. Unterschiedliche Domains können nun also auch im Backend unterschiedlich aussehen. Beispiel: Wenn man als Redaxo-User*in im Backend unter domain1.de/redaxo eingeloggt ist, so kann dieses Backend ein anderes Branding bekommen als z.B. domain2.de/redaxo. Es werden auch die Backend-Favicons entsprechend des Profils gefärbt und der Frontend-Link im Header über be_style/customizer wird ebenfalls angepasst. Favicon-Einstellungen pro Domain werden nun übersichtlicher in Tabs dargestellt. Fixed: Logo des Projekts wird bei Installation im Unterordner jetzt korrekt angezeigt @aeberhard #31 herunterladen 1.7.1 Für REDAXO >=5.13 Veröffentlicht am 12.08.2022 Fixed: Scripts, die im pageHeader untergebracht sind, funktionieren nun wieder (z.B. Watson, Fontawesome-Picker oder Structure Tweaks, etc.) herunterladen 1.7 Für REDAXO >=5.13 Veröffentlicht am 07.01.2022 === 07.01.2022 === ACHTUNG - Breaking-Changes: Die Version 1.7 ist nur noch kompatibel mit REDAXO ab Version 5.13.0 YRewrite wird vorausgesetzt Die REX-Variable REX_BE_BRANDING[type=fe_favicon] wird in dieser Version nicht mehr berücksichtigt. Zur Ausgabe der Frontend-Favicons bitte den PHP-Code be_branding::getFrontendFavicons( rex_yrewrite::getCurrentDomain()->getId() ) nutzen. Fixed: Anpassungen an die neue REDAXO-Backend-Struktur ab Version 5.13 Neu: Frontend-Favicons nun auch für Multidomain-Installationen mit YRewrite Hilfedatei ergänzt herunterladen 1.6-beta2 Für REDAXO >=5.0 Veröffentlicht am 05.05.2021 === 05.05.2021 === Nach Update, Installation oder Reinstallation wird der Template-Cache geleert, damit die Ersetzung von REX_BE_BRANDING[type=fe_favicon] im Frontend korrekt funktioniert. herunterladen 1.6-beta Für REDAXO >=5.0 Veröffentlicht am 04.05.2021 === 04.05.2021 (beta)=== NEU: Mehr Optionen zur Einstellung des neuen REX-Loginscreens (Eigenes Hintergrundbild, REDAXO-Standard-HG-Bild, Primärfarbe, Sekundärfarbe oder Verlauf wählbar) Umstellung auf eigene Redaxo-Variable REX_BE_BRANDING[] anstatt str_replace() Auslagerung der Funktionen in der boot.php in die Klasse be_branding Redaxo-Cache wird nach Änderung des Frontend-Favicon gelöscht Fallback-Hintergrundbild im Loginscreen wird nun nur noch bei mobiler Ansicht angezeigt, nicht bei Desktop-Version, da es zu einem kurzen Zitter-Effekt gekommen ist herunterladen 1.5.1 Für REDAXO >=5.0 Veröffentlicht am 07.04.2021 === 07.04.2021 === Anpassung background-properties für #rex-page-login: Hintergrund-Bild für Login-Screen nun auch bei mobiler-Anicht Anpassung Screenshot-URL in README.md herunterladen 1.5 Für REDAXO >=5.0 Veröffentlicht am 26.03.2021 === 26.03.2021 === Anpassung an neuen Login-Screen ab REDAXO 5.12 Hintergrundbild des neuen Login-Screens (REX 5.12) kann nun bequem im AddOn eingestellt werden Media-Manager-Types für JPG und WebP werden bei Reinstall und Update in REX 5.12 angelegt. Credits wurden nicht mehr angezeigt => fixed Danke @helpy herunterladen 1.4.2 Für REDAXO >=5.0 Veröffentlicht am 28.09.2020 === 28.09.2020 === Bei einem Reinstall wurde versehentlich noch ein Ordner "favicon" im Root generiert. vendor/favicon/src/FaviconGenerator.php entfernt. Mögliches Überbleibsel im Root (favicon-Ordner) wir bei Reinstall und Update gelöscht. herunterladen 1.4.1 Für REDAXO >=5.0 Veröffentlicht am 28.09.2020 === 28.09.2020 === Umstellung auf Fragments, wo möglich. Frontend-Favicons werden nun nur noch beim Speichern auf der Einstellungsseite für die Frontend-Favicons generiert. herunterladen 1.3.4 Für REDAXO >=5.0 Veröffentlicht am 22.09.2020 === 22.09.2020 === Behebt die Warnings bzgl. array_key_exists() in FE_FaviconGenerator.php - Danke an Serhan Sidan @ Mattomedia.de Anpassung an Imageick-Version zur korrekten Generierung von Favicons. Anpassung des Settings-Array für richtige Farben via rgba2hex(). herunterladen 1.3.3 Für REDAXO >=5.0 Veröffentlicht am 13.03.2020 === 13.03.2020 === Behebt einen Fehler der Frontend-Favicons der Version 1.3.2. Korrigiert die Einbindung der Color-Pickers. herunterladen 1.3.1 Für REDAXO >=5.0 Veröffentlicht am 08.11.2019 Version 1.3.1 #### === 08.11.2019 === Backend-Favicon-Update für Rex 5.8.1. In der Redaxo Version 5.8.1 wurden die Favicons geändert und anders eingebunden. Diese Version korrigiert die Einbindung der gefärbten Icons im Backend und berücksichtigt die verschiedenen Einbindungsarten der Versionen 5.0-5.7, von 5.7-5.8, 5.8.0 und ab 5.8.1. herunterladen 1.3 Für REDAXO >=5.0 Veröffentlicht am 03.09.2019 === 03.09.2019 === Backend-Favicon-Update für Rex 5.8.0. In der Redaxo Version 5.8.0 wurden die Favicons geändert und anders eingebunden. Diese Verson korrigiert die Einbindung der gefärbten Icons im Backend und berücksichtigt die verschiedenen Einbindungsarten der Versionen 5.0-5.7, von 5.7-5.8 und ab 5.8. Fixed: SVG-Branding-Logo wurde nicht geladen, wenn Frontend durch maintenance-AddOn gesperrt war. Danke @helpy herunterladen 1.2 Für REDAXO >=5.0 Veröffentlicht am 28.06.2019 === 28.06.2019 === rex::isFrontend() entfernt, da die Funktion erst ab REDAXO 5.7 verfügbar ist und niedrigere Versionen beim Update des AddOns einen Whoops bekommen haben. Meldungen angepasst, wenn ImageMagick auf dem Server nicht verfügbar ist und man Favicons für das Frontend generieren wollte. SVG-Unterstützung für das Projekt-Logo im Backend herunterladen 1.1 Für REDAXO >=5.0 Veröffentlicht am 11.05.2019 === 11.05.2019 === NEU: Favicon-Generator fürs Frontend. Unter dem neuen Menüpunkt Frontend-Favicon kann eine Datei aus dem Medienpool ausgewählt werden, die dann automatisch in die jeweiligen Formate für Favicons generiert wird. Ebenfalls kann die Tile-Color für Android-Geräte und Windows-Tiles angegeben werden (Das Favicon wird dabei nicht gefärbt). Die Einbindung ins Frontend ist mittels dem Snippet REX_BE_BRANDING[type=fe_favicon] im Template im head-Bereich möglich. herunterladen 1.0.9 Für REDAXO >=5.0 Veröffentlicht am 19.03.2019 === 19.03.2019 === Wenn Redaxo in einem Unterordner installiert ist, gab es einen Fehler, wenn man die Option für das Färben der Favicons aktiviert hatte. Tile-Color für Android Endgeräte ergänzt. Pfade für Einbindung der Favicons gefixt. herunterladen 1.0.8 Für REDAXO >=5.0 Veröffentlicht am 13.03.2019 === 13.03.2019 === Favicon-Update für Rex 5.7.0. In der Redaxo Version 5.7.0 wurden die Favicons geändert und anders eingebunden. Diese Verson korrigiert die Einbindung der gefärbten Icons je nachdem, ob die Redaxo-Version größer oder kleiner als V 5.7.0 ist. herunterladen 1.0.7 Für REDAXO >=5.0 Veröffentlicht am 26.02.2019 === 26.02.2019 === Der Ordner assets/favicon und die Datei assets/favicon/.original wurden ergänzt. Ohne den Ordner bzw. die Datei gibt es einen Fehler, wenn man das Favicon färben möchte. herunterladen 1.0.6 Für REDAXO >=5.0 Veröffentlicht am 27.12.2018 === 19.10.2018 === Der Servername für FavIcons für Android wurde noch mit R4-Methoden angeben und wurde auf R5 korrigiert. herunterladen 1.0.5 Für REDAXO >=5.0 Veröffentlicht am 22.08.2018 === 22.08.2018 === Diverse Notices gefixt herunterladen 1.0.4 Für REDAXO >=5.0 Veröffentlicht am 20.08.2018 === 21.08.2018 === Favicon im Backend kann gefärbt werden (Imagemagick benötigt) Favicons werden für versch. Devices generiert Übersichtlichere Aufteilung in Konfiguration und Branding-Page Umgestellt auf includeCurrentPageSubPath jQuery Colorpicker ist keine Pflicht mehr. Wenn ui_tools/jquery-minicolors installiert ist, wird es verwendet, ansonsten normales input-Feld oder selbst mitglieferter jQuery-Colorpicker In der Konfiguration kann aus den installierten Editoren der bevorzugte festgelegt werden (zur Zeit: ckEditor, ckEditor 5, Markitup / Markdown o. Textile, redactor 2, tinymce4. herunterladen 1.0.3 Für REDAXO >=5.0 Veröffentlicht am 05.06.2018 === 05.06.2018 === Bugfix Kompatibilität mit Quick Navigation (danke @bepixeld) herunterladen 1.0.2 Für REDAXO >=5.0 Veröffentlicht am 19.05.2018 === 19.05.2018 === Requirements bei Installation angepasst CKEditor ist keine Pflicht mehr Pfeilspitze LoginPage farblich angepasst [translate:config] Überbleibsel entfernt herunterladen 1.0.1 Für REDAXO >=5.0 Veröffentlicht am 13.05.2018 Mit dem AddOn lässt sich das Backend von Redaxo branden. Damit kann man, wenn man mehrere REDAXO-Projekte betreut, das Backend auf einen Blick schneller unterscheiden. Auch für REDAXO-Dienstleister eignet sich das AddOn, um dem Backend einen individuelleren Anstrich zu verpassen und sich etwas stärker vom "Sie-nutzen-ja-nur-eine-fertige-out-of-the-Box-Software"-Argument zu entfernen. "border" stammt aus dem (mittlerweile nicht mehr weitergeführten AddOn "out5" von Oliver Kreischer / FOR). Vielen Dank! herunterladen 0.9 Für REDAXO >=5.0 Veröffentlicht am 13.07.2017 Require / PHP >=5.6 Require / PHP Extensions gd, xml herunterladen'
