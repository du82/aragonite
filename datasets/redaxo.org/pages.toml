["https://redaxo.org/cms/news"]
title = "News / REDAXO Website"
full_description = 'News Dienstag25Februar2025 Rückblick: REDAXO-Tag 2025 in Heilbronn Der REDAXO-Tag 2025 führte uns ins schöne Ländle, nach Heilbronn. Knapp 50 Teilnehmer fanden sich in der Stadt zusammen, um sich auszutauschen! Dienstag6August2024 Save the date für das REXCAMP 2025 in Heilbronn Wir waren schon mal in der Nähe, aber bisher nicht in der Stadt Heilbronn an sich. Jetzt ist es so weit. Das Heilbronner „REXCAMP 2025“ findet am 25. Januar 2025 im Parkhotel in Heilbronn statt. Wir befinden uns direkt an der Innenstadt mit Restaurants, Bars und Hotels in Fußreichweite. Montag20Mai2024 REDAXO-Tag 2024 in Hamburg Er war 2020 schon einmal geplant. Ihr wisst, was 2020 alles so durcheinander gekommen ist. Der REDAXO-Tag 2020 musste eine Woche vor seinem Termin abgesagt werden. Dann kam Bozen 2023. Und jetzt also endlich Hamburg! Trotz des tristen nordischen Winters haben sich ca. 35 Teilnehmer und 3 Teilnehmerinnen auf den Weg gemacht. Dienstag14November2023 Unterkünfte für den REDAXO-Tag: Schnell buchen Ihr sucht eine Unterkunft für den kommenden REDAXO-Tag in Hamburg? Wir heben einige Empfehlungen für Euch zusammengestellt. Mittwoch26Juli2023 Save the date für das REXCAMP 2024 in Hamburg Wir hatten 2020 schon mal ein REDAXO-Treffen in Hamburg geplant, das jedoch leider kurzfristig wegen Corona ausfallen musste. Nun holen wir es nach! Das Hamburger “REXCAMP 2024” findet am 20. Januar 2024 im betahaus statt, in der Sternschanze gelegen. Wir befinden uns dort in einem sehr schönen Szene-Viertel mit gemütlichen Restaurants, trendigen Cocktailbars und beliebten Musikclubs. Dienstag4April2023 REDAXO-Community trifft sich in Bozen: Austausch, Workshops und neue Tools zur Verbesserung von Code-Qualität Vom 23. bis 26. März 2023 fand in Bozen ein Community-Treffen für begeisterte Redaxo-Entwickler:innen statt. Das Ziel des Treffens war es, Ideen auszutauschen, Workshops zu halten und Best Practices zu diskutieren. Dienstag28Februar2023 REDAXO 5.15 veröffentlicht Mit diesem Release springt REDAXO hoch auf PHP 8.1 als Mindestversion und schafft damit eine aktuelle Entwicklungsumgebung. Einige neue Funktionen und viele Detailverbesserungen konnten direkt davon profitieren: Besonders hervorzuheben ist neben der Sessionverwaltung im Backend die Möglichkeit zum Login mittels Passkey/WebAuthn. Alle Infos findet ihr wie gewohnt im Changelog. Und wenn ihr den Austausch mit der Community sucht, besucht gerne unseren Slack-Chat! Dienstag20Dezember2022 Nächstes REDAXO-Treffen in in Bozen Das kommende REDAXO-Treffen wird ein ganz besonderes Event sein. Wir werden uns vom 23. – 26. März 2023 in Bozen/Italien treffen! Samstag10Dezember2022 Redaxo Tag September 2022 in Mainz Nach zwei Jahren Zwangspasue durch Corona war die Motivation riesig, sich endlich mal wieder live zu treffen. Das RexCamp 2022 fand diesmal in Mainz statt, und zwar am 17. September. Wie immer reisten die meisten Teilnehmer bereits am Freitag an und am Sonntag ab, um auch den ganzen Samstag dabei sein zu können. Freitag9Dezember2022 REDAXO ist bereit für das neue PHP 8.2 Für REDAXO versuchen wir immer möglichst früh, unsere automatisierte Entwicklungsumgebung bei GitHub um neue PHP-Versionen zu ergänzen. Deshalb ist REDAXO auch schon seit einiger Zeit kompatibel mit PHP 8.2, das gestern veröffentlicht worden ist. Auch die gängigen AddOns der Community sollten kompatibel sein. Falls euch etwas auffällt, freuen wir uns über Hinweise! Montag25Juli2022 REDAXO 5.14 veröffentlicht Das Release enthält zahlreiche Detailverbesserungen und nützliche neue Funktionen. Darunter sind immer wieder auch manche, die schon seit längerer Zeit innerhalb der Community gewünscht worden sind. Alle Infos findet ihr diesmal im Changelog. Und wenn ihr den Austausch mit der Community sucht, besucht gerne unsere Chat-Gruppen im Slack oder Discord! Sonntag12Juni2022 Hackathon in Runkel Hin und wieder trifft sich das Core-Team und die REDAXO-Community in kleiner Zahl, um zu arbeiten. Im Juni haben wir uns in Runkel an der Lahn getroffen, direkt neben Alex’ Burg in der Alten Färberei. Montag2Mai2022 Ihr könnt Euch zum REXCAMP 2022 in Mainz (17.09.2022) anmelden! Es ist wieder so weit. Unser eigentlich jährliches REDAXO-Treffen findet diesmal in Mainz am 17.09.2022 statt. Es wird Vorträge, Diskussionen und Workshops geben, und natürlich werden wir uns gegenseitig Tricks und sinnvolle Lösungen für die Arbeit mit REDAXO zeigen. Mittwoch17November2021 REDAXO 5.13 veröffentlicht REDAXO wird dunkler und immer besser: Mit 5.13 nutzt ihr automatisch den neuen Dark Mode, falls euer System darauf eingestellt ist. Wer es nicht mag, bleibt einfach im Hellen. Der Code wurde an zahlreichen Stellen optimiert, und immer wieder hilft uns dabei unsere automatisierte Entwicklungsumgebung bei GitHub. Danke an alle Beteiligten! Donnerstag18März2021 REDAXO 5.12 veröffentlicht Am 3. März wurde REDAXO 5.12 veröffentlicht. Es enthält zahlreiche Verbesserungen hinsichtlich des User Interfaces und der Bedienung des Systems, und wir wünschen uns, diese Themen in den kommenden Releases noch weiter voranzutreiben! Aber auch technisch wurde intensiv an der Funktionalität gearbeitet, so dass dieses Release sehr umfangreich geworden ist und viel Wert auf Qualität legt. Sonntag2August2020 REDAXO mit PHP 8 nutzen Das neue PHP 8 ist für Ende November geplant. Es sind aber bereits Alpha-Versionen zum Testen veröffentlicht worden, und hier beschreiben wir kurz, wie ihr diese schon jetzt für REDAXO nutzen könnt. Donnerstag2Juli2020 REDAXO 5.11 veröffentlicht Gestern wurde REDAXO 5.11 veröffentlicht und bringt viele nützliche Features vor allem für Entwickelnde mit: Neue Methoden, Extension Points, Admin-Werkzeuge — und als Besonderheit das neue Debug-AddOn! Samstag9Mai2020 Freitags um 10: REDAXO Hours Gestern haben wir ein neues Format ausprobiert und es REDAXO Hours genannt: Online-Treffen mittels Jitsi, bei denen Interessierte zusammenkommen, um sich über REDAXO-Themen auszutauschen. Und weil es offenbar sehr gut angekommen ist, wollen wir es regelmäßig stattfinden lassen: Jeden Freitag um 10:00 Uhr für 1–2 Stunden, je nach Zeit und Lust der Teilnehmenden. Freitag17April2020 REDAXO mit Docker In den letzten Monaten haben wir innerhalb der Community mehrere Docker-Projekte entwickelt: Ein REDAXO-Image, auf dem alles aufbaut, die drei beliebten Demo-Websites sowie eine lokale Entwicklungsumgebung, die zahlreiche Tools und eine ausführliche Anleitung beinhaltet. Donnerstag12März2020 Der REDAXO-Tag in Hamburg am 9.5.2020 findet nicht statt Aufgrund der aktuellen Coronavirus-Lage haben wir uns schweren Herzens entschieden, den REDAXO-Tag in Hamburg am 9. Mai 2020 abzusagen. Auch wenn es noch etwas Zeit ist bis dahin, so ist abzusehen, dass die Auflagen und Einschränkungen in den nächsten Wochen noch zunehmen werden und daher auch die Skepsis unserer Besucher gegenüber solchen Veranstaltungen steigen wird. Es kommt uns daher unverantwortlich vor, wenn wir diesen Schritt jetzt nicht täten. Dienstag10März2020 REDAXO 5.10 veröffentlicht Die aktuelle Version ist vom Februar, und trotzdem gibt es bereits eine neue: REDAXO 5.10 wurde heute veröffentlicht und ist damit das schnellste Feature-Release von allen! \o/ Donnerstag5März2020 Hackathon in Hannover Wir haben uns in einem großen Haus in Hannover-Linden getroffen, um an REDAXO zu arbeiten. Wir, das waren diesmal das Core-Team und einige aktive Menschen aus der Community. Das Haus war kalt, aber wir waren on fire! Sonntag2Februar2020 REDAXO 5.9 veröffentlicht Heute, am 02.02.2020, wurde REDAXO 5.9 veröffentlicht. Am Release haben 20 Personen mitgearbeitet — Rekord, Danke! <3 —, und die Liste der neuen Features, Verbesserungen und Korrekturen ist ziemlich lang geworden. Donnerstag26Dezember2019 Ihr könnt Euch zum Redaxo-Tag 2020 in Hamburg anmelden! Das “REXCAMP 2020” in Hamburg findet am 9. Mai 2020 im betahaus statt, in der Sternschanze gelegen. Wir befinden uns dort in einem sehr schönen Szene-Viertel mit gemütlichen Restaurants, trendigen Cocktailbars und beliebten Musikclubs. Freitag1November2019 REDAXO 5.8.1 veröffentlicht Wie 5.8, nur noch besser. Dieses Bugfix-Release behebt kleine Problemchen und weniger relevante Sicherheitslücken. Dienstag20August2019 REDAXO 5.8 veröffentlicht REDAXO beendet die „PHP 5-Ära”: Mit der Veröffentlichung von REDAXO 5.8 endet die Unterstützung für PHP 5. Die neue Version ist für PHP ab Version 7.1.3 optimiert. Zusätzlich wurden einige Bugfixes, Performance-Optimierungen und Detailverbesserungen durchgeführt. Freitag15März2019 REDAXO 5.7 veröffentlicht In dieser Version findet Ihr etliche neuen Funktionen für ambitionierte User: Die für Admins zugängliche System-Seite erhielt zusätzliche Möglichkeiten und Einstellungen für Logdateien und Fehlerseiten, außerdem kann man durch die Editor-Integration bei auftretenden Fehlern die Quellcode-Dateien direkt im eigenen Code-Editor öffnen. Freitag18Januar2019 REXCamp Mai 2019 in Landshut Der nächste REDAXO-Tag findet am 4. und 5. Mai in Landshut (Bayern) statt. Wie immer geht es vor allem ums gegenseitige Kennenlernen der wirklich tollen REDAXO-Community; es wird Vorträge, Diskussionen und Workshops geben, und natürlich werden wir uns gegenseitig Tricks und sinnvolle Lösungen für die Arbeit mit REDAXO zeigen. Auch wenn Ihr Einsteiger seid: Ihr werdet viele Inspirationen mitnehmen und interessante Leute kennenlernen, jede Wette. Mittwoch2Januar2019 "End Of Life" für REDAXO 4.x wird Dezember 2019 sein Für REDAXO 4.x wurde das ‘End-of-Life’ (EOL) auf Dezember 2019 festgelegt. Somit werden ab 2020 auch keine Security-Fixes mehr für die Version 4.x veröffentlicht. Donnerstag6Dezember2018 REDAXO 5.7 kommt noch in 2018 Zumindest die Betaversion. Versprochen. Ok. Wir sind dran und hoffen, dass es noch dieses Jahr funktioniert :-). Einige Neuerungen können wir schon stichpunktartig verraten … Sonntag18November2018 Die REDAXO-Doku hat jetzt eine Suche Endlich gibt es jetzt, dank Dirk Schürjohann und Thomas Blum, für die REDAXO-Dokumentation eine Suchfunktion. Sonntag4November2018 Entwicklertreffen in Zorge Am ersten November-Wochenende haben wir uns wieder einmal in einer kleinen Gruppe zusammengesetzt, um miteinander zu arbeiten. Wieder wurde viel diskutiert, gelacht und (gut) gegessen. Mittwoch26September2018 Sicherheitslücke und neue yForm-Version In REDAXO 5.6.2 wurde eine kritische Sicherheitslücke (SQL-Injection) entdeckt, und zwar in der rex_list-Klasse. Gefährdet war das Backend und das Frontend nur dann, wenn dort auch rex_list verwendet wurde. Mittwoch11Juli2018 Update für Sicherheitslücke im Media Manager Achtung, wir haben eine Schwachstelle im Media Manager von REDAXO 5 entdeckt. Bitte installiert umgehend das Update! Montag11Juni2018 REDAXO 5.6 veröffentlicht Bereits letzte Woche, am 5.6., wurde REDAXO 5.6 veröffentlicht. Es enthält neben Fehlerkorrekturen und weiteren Sicherheitsmerkmalen auch einige neue Funktionen für Redakteure und Entwicklende. Dienstag17April2018 REDAXO-TAG 2018 in Berlin Jedes REDAXO-Treffen ist anders. Berlin, Berlin … wir fahren nach Berlin. Zu Berlin hat jeder so seine eigene Beziehung und seine eigene Geschichte. Und dort sollte also das REDAXO-Treffen 2018 stattfinden. Die Organisatoren hatten sich für dieses Treffen was ganz besonderes ausgedacht: Das Treffen sollte zwei Tage lang sein – ein Novum. Außerdem: es war keine Anmeldung erforderlich, weil die entsprechenden Locations dies nicht erforderlich machten. Und die Teilnahme selbst war kostenlos! Das – so haben sich manche gedacht – wird vielleicht viel mehr Teilnehmer anziehen. Die offiziellen Veranstaltungszeiten waren von 10 bis 18 Uhr an beiden Tagen, aber darum herum entwickelten sich wie ganz von selbst größere und kleinere Gruppenaktivitäten. Samstag17Februar2018 REDAXO-Tag im April 2018 in Berlin Es wurde oft gewünscht, und nun treffen wir uns erstmalig an zwei Tagen: Am Samstag ist der eigentliche REDAXO-Tag mit Vorträgen und Diskussionen. Der Freitag davor steht für Workshops und Projektarbeit zur Verfügung. Beide Tage sind offen für alle und kostenlos. Schreibt uns, was Ihr für Ideen und Wünsche habt! Montag8Januar2018 Sicherheitslücke im Media Manager Achtung, wir haben eine Schwachstelle im Media Manager von REDAXO 5 entdeckt und einen Fix dafür bereitgestellt. Bitte installiert umgehend das Update! Freitag22Dezember2017 REDAXO-Tag in Berlin, REDAXO 5.5 veröffentlicht Weihnachts-News Liebe REDAXO-Freunde, nehmt zum Jahresende noch zwei große Neuigkeiten mit auf den Weg: REDAXO 5.5 steht als Download zur Verfügung, und der Termin für die kommenden REDAXO-Tage steht fest. Donnerstag16November2017 REDAXO 5.4 veröffentlicht Bereits auf dem REDAXO-Tag angekündigt und in den letzten Wochen als Beta von einigen Entwicklern getestet: Die aktuelle REDAXO-Version 5.4 bietet zahlreiche Neuerungen und Verbesserungen für Entwickler und Redakteure. Mittwoch8November2017 Weltkarte der REDAXO-Community Die Community wächst stetig, wir merken es an den inzwischen über 300 Mitgliedern im Slack-Chat, der Aktivität bei GitHub, Facebook und Twitter, und nicht zuletzt an den REDAXO-Tagen, bei denen neben bekannten Gesichtern immer wieder auch Neue auftauchen. Gerade bei den Treffen vor Ort wird immer gefragt: Woher kommt ihr? Wer hatte die weiteste Anreise? Montag18September2017 Redaxo-Tag in Fulda am 9. September 2017 REDAXO ist das, was Du draus machst: Das bewies auch wieder einmal unser zweiter Redaxotag 2017 in Fulda. Dieses Mal hat Marco Hanke in einem 4-Sterne-Hotel für uns die Wellness gleich mitgebucht. Im Esperanto in Fulda fanden wir uns denn also in einem modernen und durchaus luxuriösen Ambiente wieder. Etliche von uns waren schon am späten Nachmittag des Freitag da, und so machten wir uns gemeinsam auf den Weg in die Innenstadt zum Abendessen. Donnerstag1Juni2017 Die Dokumentation ... … wächst, aber ist noch nicht fertig. Dennoch haben wir uns mal wieder für ein paar Tage zusammengesetzt und die nächsten sechs Kapitel geschrieben … Montag24April2017 Mannhagen und die neue Website Der Termin steht schon seit ein paar Monaten. Monate, in denen der Schreibtisch voll ist mit Arbeit und Projekten. So wirklich haben wir keine Zeit, uns mit dem Thema zu beschäftigen, vorzubereiten, oder gar vorzuarbeiten. Welches Thema eigentlich? War da nicht was? REDAXO 5, Wackershofen. Also. Das Thema heißt: Dokumentation und in erster Linie die neue REDAXO-Website bauen. Donnerstag23März2017 REDAXO-Tag am 09. September 2017 in Fulda Ab sofort könnt Ihr Euch zum nächsten REDAXO-Tag in Fulda anmelden. Er wird am 9. September in Fulda im Hotel Esperanto stattfinden. Auch Übernachtungen haben wir bereits organisiert, die bei der Anmeldung mit dazu gebucht werden können, wahlweise für eine Nacht oder zwei Nächte. Optional könnt Ihr auch den Spa-Bereich dazubuchen und ein verbilligtes ICE-Ticket bekommen. Danke an Marco Hanke für die Organisation! Montag20Februar2017 REDAXO Version 5.3 Wir freuen uns sehr, auf die neue Redaxo Version 5.3 hinweisen zu können. '
