title = "AddOns / REDAXO Website"
full_description = "AddOn Kategorie Alle KategorienAuswertungen / Counter / Statistik 43Backendanpassungen 104Community / Multiuser 18Datenbanken 66Entwickler 94Ersetzungen 29Framework 23Multimedia 43Sicherheit 22Sonstiges 238Sprachen 12URL / SEO 41 suchen Onepage-Demo für REDAXO 5 Beschreibung Eine relativ umfangreiche Demo mit verschiedenen Ansätzen, um Onepage-Websites aufzubauen. Die Demo zeigt drei Wege, wie man eine Onepage-Website aufbauen kann: mit Modulen mit Artikeln mit Kategorien und ggf. weiteren Artikeln Von der letzten Variante ist es nun ein kleiner Schritt, um die Onepage-Website in eine Multipage-Website umzuwandeln. Die Module haben relativ viele Optionen und Variantionsmöglichkeiten und decken die typischen Fälle einer Website ab: Texte in Spalten und mit Bildern, Hintergrundbilder, Projekte, Kundenstimen, Teamvorstellung, Bildergalerie, etc. Mittels Kategorie-Metafelder kann man globale Einstellungen vornehmen wie Navigationstyp, Grundfarbe oder die Anzeige eines Preloaders. Die Links zu den Social Media-Plattformen werden in Sprach-Metafeldern gepflegt. github.com/FriendsOfREDAXO/demo_onepage Umsetzung FriendsOfREDAXO Versionen 1.8.0 Für REDAXO ^5.9.0 Veröffentlicht am 14.06.2023 Require / PHP >=7.4, <8.3 Version 1.8.0 – 14.06.2023 Neu Neue Console-Commands zur Erstellung der Demo-Exporte @aeberhard demo_onepage:dump_tables, erstellt Datenbank-Backup backups/demo_onepage.utf8.sql beim Datenbank-Backup werden nur die benötigten Tabellen exportiert demo_onepage:dump_files, erstellt Datei-Backup backups/demo_onepage.tar.gz Demo-Backups mit den Console-Commands neu erstellt Kleiner Typo auf der Startseite korrigiert Ordner media bei Deinstallation leeren Ordner resources bei Deinstallation löschen herunterladen 1.7.3 Für REDAXO ^5.9.0 Veröffentlicht am 10.06.2023 Require / PHP >=7.4, <8.3 Version 1.7.3 – 10.06.2023 Features Neue Versionen der benötigten AddOns in package.setup.yml @aeberhard markitup 3.7.3 -> 3.7.4 mblock 3.4.7 -> 3.4.12 PHP-Version in package.yml >=7.4, <8.3 Bugfixes Bei Deinstallation Backup-Daten aus dem Backup-Ordner löschen - https://github.com/FriendsOfREDAXO/demo_onepage/issues/38 @aeberhard Fontawesome war im Header-Template noch mit http verlinkt und es wurden unter https keine Fontawesome-Icons angezeigt, link geändert auf https herunterladen 1.7.2 Für REDAXO ^5.9.0 Veröffentlicht am 02.01.2023 Bugfixes Konfiguration angepasst und fehlende Einträge ergänzt herunterladen 1.7.1 Für REDAXO ^5.9.0 Veröffentlicht am 02.01.2023 Bugfixes Verwendete AddOns aktualisiert herunterladen 1.7.0 Für REDAXO ^5.9.0 Veröffentlicht am 13.12.2022 Features Anzeige der Dokumentation mit Inhaltsangabe Verwendete AddOns aktualisiert zwecks Kompatibilität mit PHP 8.2 herunterladen 1.6.0 Für REDAXO ^5.9.0 Veröffentlicht am 08.01.2022 Features Kompatibilität mit REDAXO 5.13 Verwendet die neuen Mediatypen, die mit REDAXO 5.13 eingeführt wurden (z. B. rex_media_small) AddOns aktualisiert (MarkItUp, MBlock) herunterladen 1.5.1 Für REDAXO ^5.9.0 Veröffentlicht am 06.10.2021 Bugfixes Fehler bei der Installation behoben, wenn zuvor das Developer-AddOn aktiviert war herunterladen 1.5.0 Für REDAXO ^5.9.0 Veröffentlicht am 27.02.2021 Features Hinweis auf die Demo-Seite nach Installation des AddOns (#32) Mehrsprachige Seitentitel Verwendete AddOns aktualisiert herunterladen 1.4.0 Für REDAXO ^5.9.0 Veröffentlicht am 18.03.2020 Features Installation über die Konsole mittels demo_onepage:install Bugfixes Anpassungen für REDAXO 5.10 herunterladen 1.3.0 Für REDAXO ^5.9.0 Veröffentlicht am 07.02.2020 Features Neue Importdatei mit vollständigem Unicode-Zeichensatz (utf8mb4) für REDAXO 5.9 hinzugefügt. Bestehende Importdatei (utf8) für REDAXO 5.9 aktualisiert. Importfunktion aktualisiert REDAXO-Mindestversion auf 5.9.0 angehoben READMEs nach Sprachen aufgeteilt Support für YRewrite (#31) Update auf MarkItUp 3.3.4 herunterladen 1.2.3 Für REDAXO ^5.7.1 Veröffentlicht am 03.05.2019 Diverse Bugfixes, insb. Fehlerabfragen: #27, #28, #29, #30 REDAXO und alle AddOns aktualisiert herunterladen 1.2.2 Für REDAXO ^5.6.4 Veröffentlicht am 20.12.2018 Bugfixes Packages in package.yml angepasst (#25) Information zum Umgang mit package.setup.yml ergänzt (#26) herunterladen 1.2.1 Für REDAXO ^5.6.4 Veröffentlicht am 04.11.2018 Dateirechte korrigiert Update -> Chandelog Mediamanager-Typ header Background-Image-Optimierung iOS Header-Input HTML-Entities herunterladen 1.0 Für REDAXO ^5.5.1 Veröffentlicht am 14.04.2018 Erste Version vom REDAXO-Tag in Berlin herunterladen"
