full_description = "REDAXO in der Zeitschrift Screenguide Veröffentlicht am 25.11.2014 “Freiheit und Verantwortung”, so lautet ein sechsseitiges Portrait in der aktuellen Screenguide-Ausgabe. Das Fazit der Fachzeitschrift: “Neben Potenz und Flexibilität gibt dieses CMS Entwicklern das, was sie sich am meisten wünschen: Einen guten Workflow beim Aufbau, Kontrolle über den ausgegebenen Quellcode und ein einfaches Redaktions-Interface. … Redaxo bietet Webentwicklern die Freiheit, eigenständig HTML- Templates zu entwickeln und die volle Kontrolle über und somit auch die Verantwortung für den ausgegebenen Quellcode zu behalten. Zusätzlich ist es durch seine Struktur und seinen Aufbau für den Redakteur schnell zu erlernen und einfach zu bedienen. Beherrscht der aufbauende Admin ein wenig PHP sind ihm vom System keinerlei Grenzen gesetzt, nach eigenen Wünschen Anpassungen und Erweiterungen flexibel vorzunehmen.” REDAXO in der Zeitschrift Screenguide Veröffentlicht am 25.11.2014 “Freiheit und Verantwortung”, so lautet ein sechsseitiges Portrait in der aktuellen Screenguide-Ausgabe. Das Fazit der Fachzeitschrift: “Neben Potenz und Flexibilität gibt dieses CMS Entwicklern das, was sie sich am meisten wünschen: Einen guten Workflow beim Aufbau, Kontrolle über den ausgegebenen Quellcode und ein einfaches Redaktions-Interface. … Redaxo bietet Webentwicklern die Freiheit, eigenständig HTML- Templates zu entwickeln und die volle Kontrolle über und somit auch die Verantwortung für den ausgegebenen Quellcode zu behalten. Zusätzlich ist es durch seine Struktur und seinen Aufbau für den Redakteur schnell zu erlernen und einfach zu bedienen. Beherrscht der aufbauende Admin ein wenig PHP sind ihm vom System keinerlei Grenzen gesetzt, nach eigenen Wünschen Anpassungen und Erweiterungen flexibel vorzunehmen.”"
