["https://redaxo.org/cms/news/save-the-date-fuer-das-rexcamp-2025-in-heilbronn"]
title = "News / REDAXO Website"
full_description = "Save the date für das REXCAMP 2025 in Heilbronn Veröffentlicht am 06.08.2024 Wir waren schon mal in der Nähe, aber bisher nicht in der Stadt Heilbronn an sich. Jetzt ist es so weit. Das Heilbronner „REXCAMP 2025“ findet am 25. Januar 2025 im Parkhotel in Heilbronn statt. Wir befinden uns direkt an der Innenstadt mit Restaurants, Bars und Hotels in Fußreichweite. Freitag Daniel Nasse mit seiner tollkühnen Crew veranstaltet in seiner Agentur ab 16 Uhr eine Hausparty und lädt alle die wollen gerne dazu ein. Für Getränke und ne Kleinigkeit zu Essen ist gesorgt. Nasse-Design KG / Programmierung BW3b GmbH Karlstr. 55, 74072 Heilbronn https://maps.app.goo.gl/BcYDzAwp362ZagGg6 Samstag Der eigentliche REDAXO-Tag ist der Samstag, 25. Januar 2025. Wir treffen uns um 8h beim Parkhotel. Es wird Kaffee geben und um 9h geht’s dann los. Die Adresse ist: Gartenstraße 1, 74072 Heilbronn https://maps.app.goo.gl/uqnsUXFkvqqhrjKZ8 Tiefgarage: Gymnasiumstraße 71, 74072 Heilbronn Aktuell wird noch an einem Programmablauf mit weiteren Punkten rund um Heilbronn geplant (z. B. einer Weinwanderung, …), dieser wird noch rechtzeitig veröffentlicht. Sonntag Am Sonntag werden wir vermutlich noch gemeinsam frühstücken und dann am Nachmittag abreisen. Anmeldung Aber wer jetzt schon weiß, dass er kommen will, dann gerne hier anmelden: Ticket buchen Unsere Hotelempfehlungen Parkhotel (unsere Veranstaltungs-Location): https://www.parkhotel-heilbronn.de/de zu Fuß innerhalb weniger Minuten erreichbar: Premier Inn https://www.premierinn.com/de/de/hotels/deutschland/baden-wuerttemberg/heilbronn/heilbronn-city-centre.html Hotel Newton https://www.hotel-newton.de/heilbronn/ Hotel zur Post (günstig und gut) https://www.hotel-zur-post-heilbronn.com/index.php/home.html Holiday INN express https://www.ihg.com/holidayinnexpress/hotels/gb/en/heilbronn/znjhb/hoteldetail City Hotel https://www.city-hotel.de/ Stadt Pension https://www.stadt-pension.de/preise hogh Hotel https://hogh-hotel-heilbronn.de/ B&B https://www.hotel-bb.com/de/hotel/heilbronn Es gibt natürlich noch jede Menge weitere Hotels, das sind meine Empfehlungen (Daniel Nasse)."
