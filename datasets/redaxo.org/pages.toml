full_description = "AddOns Ersetzungen Alle KategorienAuswertungen / Counter / Statistik 43Backendanpassungen 104Community / Multiuser 18Datenbanken 66Entwickler 94Ersetzungen 29Framework 23Multimedia 43Sicherheit 22Sonstiges 238Sprachen 12URL / SEO 41 suchen 18 Ergebnisse Beiträge, Kategorien, Taxonomien und Menüs Erweitert REDAXO um beliebte Funktionen eines bekannten Blogging-CMS: Taxonomien und Kategorien, Menüs und mehr. 🚧 Weiterentwicklung ungewiss. Beauftragung möglich. www.alexplus.de/redaxo-addons Versionen 5.x flatpickr für REDAXO - Datums- und Zeitpicker, Kalender, Rangepicker Stellt den flatpickr Date-/Timepicker in REDAXO zur Verfügung. github.com/FriendsOfREDAXO/flatpickr Versionen 5.x FriendsOfREDAXO gloebals AddOn um globale Variablen oder Übersetzungen einzufügen. Versionen 5.x FriendsOfREDAXO hyphenator Automatische Silbentrennung für Texte Versionen 5.x FriendsOfREDAXO massif_minify Package für REDAXO CMS >= 5.0 Mit diesem AddOn lassen sich mehreren JS/CSS/SCSS Dateien zu einer, pro Format, einzigen Datei zusammenschliessen um HTTP Request zu minimieren. Zusätzlich wird nach Wunsch der gesamte HTML Code komprimiert. Versionen 5.x Mediapool Rename AddOn zur Umbenennung von Dateinamen im Medienpool Versionen 5.x minify Dieses Addon ermöglicht das minimieren und bündeln von CSS und JS Dateien. Versionen 5.x FriendsOfREDAXO Multiglossar Mit dem Glossar AddOn Multiglossar können Glossarbegriffe mit Kurzbeschreibung und Langtext verwaltet werden. Das AddOn verlinkt dann das erste Vorkommen eines Glossarbegriffes in der HTML Ausgabe. Versionen 5.x FriendsOfREDAXO NavBuilder Redaxo 5 Addon für frei zusammenstellbare Navigationen. github.com/FriendsOfREDAXO/navbuilder Versionen 5.x FriendsOfREDAXO nvCategoryManager Addon zum Kopieren / Löschen einer Kategorie inklusive aller Artikel und Unterkategorien github.com/novinet-git/nv_categorymanager Versionen 5.x nvContentMigrator Mit dem nvContentMigrator können einzelne Artikel als json-Datei exportiert und in einem anderen System importiert werden. github.com/novinet-git/nv_contentmigrator Versionen 5.x REDAXO-Rechtstexte-Addon für erecht24 premium Dieses Addon ermöglicht die einfache Integration von Rechtstexten (Impressum, Datenschutzerklärung) aus dem eRecht24 Projekt Manager in REDAXO. Dieses Addon wurde nicht von eRecht24 entwickelt. github.com/FriendsOfREDAXO/erecht24 Versionen 5.x FriendsOfREDAXO Rk-Modulsammlung Modulsammlung www.raumkontakt.de/ Versionen 5.x Textile zu HTML-Migrator Konvertiert alle Markdown- und Textile-Inhalte nach HTML github.com/FriendsOfREDAXO/textile_migration Versionen 5.x FriendsOfREDAXO WSM Consent-Manager - Clever und modern Einwilligungen und Auskunft von verwendeten Drittanbieter-Diensten. Die neue Alternative zum Consent Manager. Vorteile: 🛫 Unkomplizierte Verwendung und Einrichtung mit REX_VARs. 🚀 Basiert auf YForm - einfacher Import/Export 🌎 Kompatibel zu YRewrite - verwende bestehende Domains und Sprachen. 🎴 Kompatibel zu Sprog und Wildcard - verwende Übersetzungen wie gewohnt. 🪟 2-Klick-Lösung für iframes / externe Dienste wie YouTube, Google Maps. www.alexplus.de/redaxo-addons Versionen 5.x YOrm Model Class Accelerator (YMCA) Beschleunigt die Entwicklung YForm-basierter Projekte und Addons. Erstelle dein Tableset und erhalte: 🚀 Prototypische YOrm-Klassen inkl. Type Hinting und Kommentaren 🚀 Prototypische technische Dokumentation (Markdown) 🚀 Prototypische API-Route (für YForm REST-Plugin) 🚀 Prototypische Fragmente zur Ausgabe und PDF-Generierung Du möchtest daraus ein Addon machen? Schau dir die Addon-Vorlage Blaupause an, in das du die aus `ymca` erstellten Dokumente und Code einsetzen kannst. www.alexplus.de/redaxo-addons Versionen 5.x YRewrite Domain Settings Redaxo 5 Addon zum Verwalten von zusätzlichen Informationen je Domain github.com/FriendsOfREDAXO/yrewrite_domain_settings Versionen 5.x FriendsOfREDAXO Ytils RexMd Ytils RexMd ist ein Vollbild-Editor zur ablenkungsfreien Artikel-Pflege im Markdown-Format. Ytils RexMd is a full screen editor that supports focussed work on articles in the Markdown format. www.ytils.com/rexmd Versionen 5.x"
