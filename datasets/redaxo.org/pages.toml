title = "AddOns / REDAXO Website"
full_description = "AddOn Kategorie Alle KategorienAuswertungen / Counter / Statistik 43Backendanpassungen 104Community / Multiuser 18Datenbanken 66Entwickler 94Ersetzungen 29Framework 23Multimedia 43Sicherheit 22Sonstiges 238Sprachen 12URL / SEO 41 suchen Aktivitätsprotokoll Beschreibung Eine einfache Möglichkeit um Aktivitäten zu loggen. Das Addon bietet die Möglichkeit eigene Aktivitäten oder diese von ausgewählten Extension Points zu loggen. Einträge regelmäßig löschen: Einträge können jederzeit manuell im Activity Log gelöscht werden. Weiter gibt es die Möglichkeit die Einträge über das Cronjob Addon automatisiert zu löschen. Es stehen verschiedene Zeiträume zur Auswahl. github.com/FriendsOfREDAXO/activity_log Umsetzung FriendsOfREDAXO Versionen 0.1.0 Für REDAXO ^5.12.0 Veröffentlicht am 19.05.2023 Require / PHP >=8.0 Methoden für user und media gefixt, diese funktionierten nicht korrekt. Console-Befehl activity:clear hinzugefügt. Danke an @AndiLeni für den Hinweis. herunterladen 0.0.2 Für REDAXO ^5.12.0 Veröffentlicht am 04.10.2022 Require / PHP >=7.1 Kleinere fixes: User Login statt Namen verwenden, wenn nicht vorhanden Gelöschte Kategorien korrekt darstellen Clang-ID überprüfen (wichtig bei mehreren Sprachen) Zugriff nur für Admins herunterladen 0.0.1 Für REDAXO ^5.12.0 Veröffentlicht am 13.05.2022 Require / PHP >=7.1 Das Addon bietet die Möglichkeit eigene Aktivitäten oder diese von ausgewählten Extension Points zu loggen. Einträge regelmäßig löschen: Einträge können jederzeit manuell im Activity Log gelöscht werden. Weiter gibt es die Möglichkeit die Einträge über das Cronjob Addon automatisiert zu löschen. Es stehen verschiedene Zeiträume zur Auswahl. herunterladen"
