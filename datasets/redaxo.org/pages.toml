["https://redaxo.org/cms/news/ihr-koennt-euch-zum-redaxo-tag-2020-in-hamburg-anmelden%25252521"]
title = "News / REDAXO Website"
full_description = "Ihr könnt Euch zum Redaxo-Tag 2020 in Hamburg anmelden! Veröffentlicht am 26.12.2019 Das “REXCAMP 2020” in Hamburg findet am 9. Mai 2020 im betahaus statt, in der Sternschanze gelegen. Wir befinden uns dort in einem sehr schönen Szene-Viertel mit gemütlichen Restaurants, trendigen Cocktailbars und beliebten Musikclubs. Wie immer geht es vor allem ums gegenseitige Kennenlernen der tollen REDAXO-Community; es wird Vorträge, Diskussionen und Workshops geben, und natürlich werden wir uns gegenseitig Tricks und sinnvolle Lösungen für die Arbeit mit REDAXO zeigen. Auch wenn Ihr Einsteiger seid: Ihr werdet viele Inspirationen mitnehmen und interessante Leute kennenlernen, jede Wette. Samstag Der eigentliche REDAXO-Tag ist der Samstag, 9. Mai 2020. Wir treffen uns um 9 Uhr beim Betahaus. Die Adresse ist: Eifflerstraße 43, 22769 Hamburg https://hamburg.betahaus.de/contact Sonntag Am Sonntag werden wir vermutlich noch gemeinsam frühstücken und dann am Nachmittag abreisen. Freitag Viele kommen bereits am Freitag im Lauf des Tages an. Bei Interesse finden am Freitag ein Hackathon oder kleine Workshops statt. Und ein gemeinsames Abendessen bietet sich für die ersten Diskussionen an. Wir haben am Freitag das Betahaus nicht exklusiv gemietet – jeder darf die Räumlichkeiten aber nutzen gegen den Kauf eines Tagestickets (17€) oder Halbtagestickets (9€). Im Preis enthalten ist das Catering für den Samstag inklusive einer Kaffee- und Tee-Flatrate. Hier könnt Ihr Euch zum REXCAMP anmelden: https://www.xing-events.com/rexcamp2020.html Ihr könnt Euch zum Redaxo-Tag 2020 in Hamburg anmelden! Veröffentlicht am 26.12.2019 Das “REXCAMP 2020” in Hamburg findet am 9. Mai 2020 im betahaus statt, in der Sternschanze gelegen. Wir befinden uns dort in einem sehr schönen Szene-Viertel mit gemütlichen Restaurants, trendigen Cocktailbars und beliebten Musikclubs. Wie immer geht es vor allem ums gegenseitige Kennenlernen der tollen REDAXO-Community; es wird Vorträge, Diskussionen und Workshops geben, und natürlich werden wir uns gegenseitig Tricks und sinnvolle Lösungen für die Arbeit mit REDAXO zeigen. Auch wenn Ihr Einsteiger seid: Ihr werdet viele Inspirationen mitnehmen und interessante Leute kennenlernen, jede Wette. Samstag Der eigentliche REDAXO-Tag ist der Samstag, 9. Mai 2020. Wir treffen uns um 9 Uhr beim Betahaus. Die Adresse ist: Eifflerstraße 43, 22769 Hamburg https://hamburg.betahaus.de/contact Sonntag Am Sonntag werden wir vermutlich noch gemeinsam frühstücken und dann am Nachmittag abreisen. Freitag Viele kommen bereits am Freitag im Lauf des Tages an. Bei Interesse finden am Freitag ein Hackathon oder kleine Workshops statt. Und ein gemeinsames Abendessen bietet sich für die ersten Diskussionen an. Wir haben am Freitag das Betahaus nicht exklusiv gemietet – jeder darf die Räumlichkeiten aber nutzen gegen den Kauf eines Tagestickets (17€) oder Halbtagestickets (9€). Im Preis enthalten ist das Catering für den Samstag inklusive einer Kaffee- und Tee-Flatrate. Hier könnt Ihr Euch zum REXCAMP anmelden: https://www.xing-events.com/rexcamp2020.html"
