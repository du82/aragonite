["https://redaxo.org/cms/news/redaxo-tag-2024-in-hamburg"]
title = "News / REDAXO Website"
full_description = "REDAXO-Tag 2024 in Hamburg Veröffentlicht am 20.05.2024 Er war 2020 schon einmal geplant. Ihr wisst, was 2020 alles so durcheinander gekommen ist. Der REDAXO-Tag 2020 musste eine Woche vor seinem Termin abgesagt werden. Dann kam Bozen 2023. Und jetzt also endlich Hamburg! Trotz des tristen nordischen Winters haben sich ca. 35 Teilnehmer und 3 Teilnehmerinnen auf den Weg gemacht. Traditionell trafen sich einige bereits am Freitag zu einer Ankunftsrunde. Peter hatte im Vorfeld alles organisiert. Wir fuhren zum Betahaus in der Schanze. Im Betahaus hatten wir dann keine Betreuung. Das gesamte Personal ging zur Demo gegen Rechts. Manche seriöse Quellen sagen, es wären über 100.000 Menschen dort gewesen. Und das am REDAXO-Tag! Wie immer, war’s ein freudiges Wiedersehen. Es ging vor allem ums Wiedersehen. So gingen die folgenden Stunden wieder um wie im Fluge. Jan versuchte noch Themenwünsche aus uns heraus zu kitzeln. Dann noch gemeinsames Abendessen, für einige bis in die frühen Morgenstunden … Morgens ging es dann wieder teilweise über altes graues Eis und zertretenen Schnee zum Betahaus. Auch hier wieder: freudiges Wiedersehen! Es hätte eigentlich keine Programmpunkte oder Sessions gebraucht. Nur allein um jeden zu begrüßen und ein paar Worte auszutauschen, wäre der Tag schon voll gewesen. Es sollte anders kommen. Da sorgte schon Jan dafür, der eine kleine hübsche Präsentation vorbereitet hatte, mit Bildern von „früher“ illustriert. Es stellte sich die Frage: Was machen wir heute? Gibt es Wunschthemen? Hat jemand Fragen? Möchte jemand etwas zeigen? Es wurden dann doch auch acht Sessions. Das Thema Composer wird uns in der Zukunft beschäftigen. Rex-Stan wurde nachgefragt. Die Frage, wie ein mehr oder weniger typisches Projekt abläuft. Jan hatte aber auch Visionäres im Gepäck: Was, wenn wir alle eine Firma wären? … War auch sehr beliebt. Los ging es allerdings erst einmal mit einem Spiel. Wir verwandelten uns alle in Amöben. Für alle, die nicht dabei waren: ja, ihr lest richtig. Alle Teilnehmer, auch die Teilnehmerinnen (2?) wurden Amöben. Aber nicht lang. Mit Schnick-Schnack-Schnuck durchliefen wir eine rasend schnelle Evolution, wurden Frösche, Affen und Menschen. Das Quartier Betahaus war für uns ideal! Wir hatten alle Präsentationsmöglichkeiten in drei Räumen. Die Versorgung mit Getränken und Essen war ausgezeichnet. Es gab genug Platz. Einzig und allein, dass wir nach neun Stunden schon wieder gehen mussten, trübte die Stimmung ein wenig. Die Pausen wurden dann wieder für Freundes- und Fachgespräche genutzt. Die Sessions waren vielseitig – für jeden war etwas dabei. Und ob wir doch noch eine Firma werden? Das bleibt ein Geheimnis. Vom Betahaus ging es dann noch zum Abschlussessen. Für einige auch wieder bis spät in die Nacht. Am Sonntag dann traditionelles Brunch, was sich dann nach und nach auflöste. Hamburg bleibt in bester Erinnerung."
