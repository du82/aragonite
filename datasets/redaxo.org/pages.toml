full_description = 'AddOns Multimedia Alle KategorienAuswertungen / Counter / Statistik 43Backendanpassungen 104Community / Multiuser 18Datenbanken 66Entwickler 94Ersetzungen 29Framework 23Multimedia 43Sicherheit 22Sonstiges 238Sprachen 12URL / SEO 41 suchen 32 Ergebnisse Asset Import Asset Import für REDAXO Ein AddOn zum Importieren von Medien aus verschiedenen Quellen (Pixabay, Unsplash etc.) direkt in den REDAXO Medienpool. github.com/FriendsOfREDAXO/asset_import Versionen 5.x FriendsOfREDAXO Beiträge, Kategorien, Taxonomien und Menüs Erweitert REDAXO um beliebte Funktionen eines bekannten Blogging-CMS: Taxonomien und Kategorien, Menüs und mehr. 🚧 Weiterentwicklung ungewiss. Beauftragung möglich. www.alexplus.de/redaxo-addons Versionen 5.x Blogger Blogger ist ein Blog AddOn für das erstellen und verwalten von Blogeinträgen in verschiedenen Sprachen und mit einfacher ausgabe API. github.com/AndyBitz/rex_blogger Versionen 5.x FriendsOfREDAXO Collect Rufe Daten beliebiger Quellen ab, bspw. RSS-Feeds, YouTube-Playlists, Vimeo-Playlists, Twitter Beiträge anhand Hash-Tags, Google Places und deren Rezensionen, u.v.a. Nutze alle Vorteile, die YForm und YOrm dabei zu bieten haben. 🚧 Unterstützung gesucht! www.alexplus.de/redaxo-addons Versionen 5.x Cropper Kleine Bildbearbeitung für den Medienpool github.com/FriendsOfREDAXO/cropper Versionen 5.x FriendsOfREDAXO D2U Videomanager - Mehrsprachige, suchmaschinenoptimierte Videoverwaltung Mehrsprachige Videoverwaltung für YouTube und Videos aus dem Medienpool. Methoden für die Google Videosuche stehen zur Verfügung. test.design-to-use.de/de/addontests/d2u-videomanager/ Versionen 5.x ffmpeg Video-Converter für REDAXO cms github.com/KLXM/ffmpeg Versionen 5.x FriendsOfREDAXO Filepond Uploader FilePond für REDAXO Versionen 5.x Focuspoint Dieses Addon erweitert den Medienpool um die Fähigkeit bei einem Bild einen Focuspoint zu setzten. Versionen 5.x FriendsOfREDAXO Gridblock - Multiple Inhaltsblöcke (Module) im Spaltenraster anlegen, kombinieren & sortieren Multiple Modulblöcke (Inhalte) innerhalb eines Redaxo-Blockes anlegen, kombinieren & sortieren und in einem selbst definierbaren Spaltenrasters (GRID) ausgeben. github.com/iceman-fx/gridblock Versionen 5.x Insert Text Dieses Addon erweitert den Media Manager um den Effekt „Bild: Insert Text“. Er fügt einen Text in ein Bild ein. github.com/FriendsOfREDAXO/insert_text Versionen 5.x FriendsOfREDAXO lightgallery LightGallery für Redaxo 5 Das Addon ergänzt die Möglichkeit Bilder in einer anpassbaren, erweiterbaren Galerie im Frontend mit Hilfe des jQuery-Plugins darzustellen. github.com/FriendsOfREDAXO/lightgallery Versionen 5.x FriendsOfREDAXO Lottie Das AddOn stellt den Lottie-Player für das Abspielen von Lottie-Animationen im .json-Format zur Verfügung. github.com/FriendsOfREDAXO/lottie Versionen 5.x FriendsOfREDAXO Media Manager Plus Ermöglicht das Gruppieren von Media-Manager-Typen und stellt eine Frontend-API (PictureTag) bereit. Das AddOn erweitert den Media Manager von Redaxo. Es ist mit dem Media Manager Plus möglich, verschiedene Breakpoints für ein Bild zu hinterlegen. Somit besteht die möglichkeit verschiedene Auflösungen von Bildern zur Verfügung zu stellen. github.com/FriendsOfREDAXO/media_manager_plus Versionen 5.x FriendsOfREDAXO Media Manager Responsive Erstelle Media Manager Profil-Gruppen und verwende sie mit Responsive-Techniken. (picture, srcset, device pixel ratio, u.v.m.), um die Ladezeit, Performance, Caching und den PageSpeed-Index zu verbessern. 📄 Exzellent dokumentiert. 💪🏻 Flexibel einsetzbar. 🚀 Ideale Ergänzung zum Addon "Speed Up". ✅ In aktiver Weiterentwicklung. www.alexplus.de/redaxo-addons Versionen 5.x Media Negotiator Ändert den Bildtyp des Media-Managers je nachdem, was der anfragende Browser akzeptiert. Versionen 5.x media_manager Media Manager Versionen 5.x media_srcset Addon das einen neuen Effekt namens SRCSET hinzufügt (basierend auf dem resize-Effekt) und zusätzlich die Angabe eines SRCSET-Attributs ermöglicht.Rewrite URLs von YRewrite werden unterstützt. Versionen 5.x FriendsOfREDAXO Mediapool . Versionen 5.x Mediapool Rename AddOn zur Umbenennung von Dateinamen im Medienpool Versionen 5.x mediapool_exif Das AddOn ersetzt fehlende Angaben aus den Dateidetails beim Upload. github.com/FriendsOfREDAXO/mediapool_exif/ Versionen 5.x FriendsOfREDAXO Medienpool Kategorieverwaltung Addon zur Umbenennung und Umsortierung von Medienpool-Kategorien. Versionen 5.x minify_images Optimiert Bilder mit Hilfe eines Mediamanager-Effektes github.com/FriendsOfREDAXO/minify_images Versionen 5.x FriendsOfREDAXO NextCLoud für REDAXO Nextcloud Medienpool Upload Versionen 5.x og:image Vorschau-Bilder Generiert nützliche Vorschau-Bilder für Messenger, Soziale Medien, E-Mail-Clients, Suchmaschinen (og:image) anhand der Informationen, die in REDAXO hinterlegt sind (Artikelname, Servername, Domain, YRewrite-Konfiguration, favicon und SEO-Bilder sowie URL-Profile) www.alexplus.de/redaxo-addons Versionen 5.x PDFout - PDF-Generator Generator und Viewer für PDF-Dokumente. Das AddOn vereint den PDF-Generator DOMpdf (http://dompdf.github.io) und den Viewer PDFjs. github.com/FriendsOfREDAXO/pdfout Versionen 5.x FriendsOfREDAXO Plyr Video / MP3 Das AddOn stellt den <b>Video-/Audio-Player</b> Plyr zur Verfügung. – Unterstützt: Lokale Videos, Externe Videos, Vimeo, YouTube und mp3. github.com/FriendsOfREDAXO/plyr Versionen 5.x FriendsOfREDAXO rokito Duplex Filter Dieses Addon erweitert den Media Manager um den Bildtyp "Duotone". Er tut, was der Name schon sagt. Heraus kommt dabei ein Bild aus nur zwei Farben. Dafür gibt es viele Begriffe zB, Verlaufsumsetzung, Color-Lookup-Table, Gradient Map, Duplexbild etcpp. rokito.de Versionen 5.x Teilweise Erweiterung des Medienpools zu einer Ordnerstruktur Dieses AddOn stellt Tools für HTML-Editoren zum Einfügen von Mediendateien in Redaxo-Artikel bereit. Die Dateien können in Unterordnern des Medienordners liegen. Die Editoren werden mit Buttons und Menüs zur Auswahl einer Mediendatei ausgestattet. Der generierte HTML-Code zur Darstellung der gewählten Datei wird an der Position des Cursors im Eingabefeld des Editors platziert. Entsprechende Plugins werden für CKEditor (Vers. 4), TinyMCE (Vers. 5) und Redactor (Vers. 3) angeboten, ebenso ein Auswahl-Button zur Ergänzung eines Quellcode-Editors. Das AddOn media_manager muss installiert sein. busch-dettum.de/public/it/media_directories.html Versionen 5.x VideoPreview MediaManager effects Dieses AddOn erweitert den REDAXO Media Manager um zwei neue Effekte zur automatischen Generierung von Vorschauen aus Videos. Die Effekte eignen sich ideal für Medienpools, Galerien oder überall dort, wo ein schneller Einblick in Videoinhalte benötigt wird. github.com/FriendsOfREDAXO/videopreview Versionen 5.x FriendsOfREDAXO Vidstack Videoplayer für REDAXO 🎬 Eine PHP-Klasse, die Videos auf Websites einbindet - mit Style! YouTube, Vimeo oder eigene Videos? Alles kein Problem. Und das Beste? Es ist so einfach zu benutzen. Versionen 5.x FriendsOfREDAXO WSM Consent-Manager - Clever und modern Einwilligungen und Auskunft von verwendeten Drittanbieter-Diensten. Die neue Alternative zum Consent Manager. Vorteile: 🛫 Unkomplizierte Verwendung und Einrichtung mit REX_VARs. 🚀 Basiert auf YForm - einfacher Import/Export 🌎 Kompatibel zu YRewrite - verwende bestehende Domains und Sprachen. 🎴 Kompatibel zu Sprog und Wildcard - verwende Übersetzungen wie gewohnt. 🪟 2-Klick-Lösung für iframes / externe Dienste wie YouTube, Google Maps. www.alexplus.de/redaxo-addons Versionen 5.x'
