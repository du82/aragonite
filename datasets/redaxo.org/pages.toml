edienpool Kategorieverwaltung Addon zur Umbenennung und Umsortierung von Medienpool-Kategorien. Versionen 5.x Minibar Die Minibar erweitert das Backend und Frontend um eine schwebende Leiste, die mit verschiedenen Elementen bestückt ist. github.com/FriendsOfREDAXO/minibar Versionen 5.x FriendsOfREDAXO nvCategoryManager Addon zum Kopieren / Löschen einer Kategorie inklusive aller Artikel und Unterkategorien github.com/novinet-git/nv_categorymanager Versionen 5.x nvDefaultAddons Redaxo 5 Addon zum Installieren von häufig benötigten Addons Installiert und aktiviert in einem Durchgang alle gewünschten Addons github.com/FriendsOfREDAXO/nv_defaultaddons/ Versionen 5.x FriendsOfREDAXO nvDomainSettings Redaxo 5 Addon zum Verwalten von zusätzlichen Informationen je Domain github.com/novinet-git/nv_domainsettings Versionen 5.x nvModulePresets Addon zum Speichern und Wiederverwenden von Modulvorlagen. Features -------- - Möglichkeit aus vorhandenen (ausgefüllten) Modulen Vorlagen zu erstellen - Möglichkeit aus den Vorlagen ein neues Inhaltselement anzulegen github.com/novinet-git/nv_modulepresets Versionen 5.x nvModulepreview Addon zur schöneren und übersichtlicheren Darstellung der Module in der Modulauswahl. Features -------- - Möglichkeit Vorschaubilder und Beschreibungen für Module zu hinterlegen - Möglichkeit Module in Kategorien zu sortieren - Möglichkeit Anzahl der Module je Zeile zu bestimmen - Möglichkeit Suche für Module zu aktivieren - Möglichkeit das Addon auch für das Addon Gridblock zu nutzen github.com/novinet-git/nv_modulepreview Versionen 5.x nvModuleSettings Ermöglicht es über eine Konfigurationsdatei zusätzliche Optionen für Module (Abstände, Textgrößen, etc.) mittels einer Konfigurationsdatei zu ergänzen github.com/novinet-git/nv_modulesettings Versionen 5.x og:image Vorschau-Bilder Generiert nützliche Vorschau-Bilder für Messenger, Soziale Medien, E-Mail-Clients, Suchmaschinen (og:image) anhand der Informationen, die in REDAXO hinterlegt sind (Artikelname, Servername, Domain, YRewrite-Konfiguration, favicon und SEO-Bilder sowie URL-Profile) www.alexplus.de/redaxo-addons Versionen 5.x Package Controller Mit diesem Addon können immer wieder verwendete Templates und Module aus einer eigenen (oder zur Verfügung gestellten) Demo-Repository geladen und mit einem Klick installiert werden. Dies erleichtert die Erstellung einer neuen REDAXO-Seite. www.novinet.de Versionen 5.x PHPMailer Profile Profile für das 📧 PHPMailer Addon, um unterschiedliche Absende-Adressen und/oder SMTP-Postfächer zu verwenden. 👶🏻 Kinderleicht einzurichten. ✅ In aktiver Weiterentwicklung. 🔗 Multidomain-Fähig. www.alexplus.de/redaxo-addons Versionen 5.x Produkte - Einfache Produktverwaltung mit YForm inkl. Varianten Mit diesem Addon können Produkte anhand von YForm und YOrm im Backend verwaltet und im Frontend ausgegeben werden. www.alexplus.de/redaxo-addons Versionen 5.x Projektmanager Dieses Addon bietet Unterstützung bei der Verwaltung und Überprüfung der eigenen REDAXO-Installationen. Versionen 5.x FriendsOfREDAXO Redaxo addon template This is a simple and easy to extend starter addon with table CRUD functionalities github.com/whatsitch/redaxo_addon_template Versionen 5.x REDAXO Cache Probleme Löscht in regelmäßigen Abständen den REDAXO-Cache. Für alle, die sich sicher sind, dass es daran liegen muss. 🚧 Addon archiviert. www.alexplus.de/redaxo-addons Versionen 5.x REDAXO Terminal Bitte beachte: Das ist kein voll funktionsfähiges Terminal. Interaktive Befehle können nicht ausgeführt werden. Dieses AddOn ist hauptsächlich dafür gedacht die REDAXO console oder rexstan in der shell ausführen zu können. github.com/KLXM/terminal Versionen 5.x REDAXO-Properties für Templates und Module REDAXO-Properties für Templates und Module github.com/FriendsOfREDAXO/properties Versionen 5.x FriendsOfREDAXO Rex Sync Together with [Rex-Sync Node](https://github.com/AndyBitz/rex-sync-node) this AddOn will allow you to live update Templates, Modules, AddOns and Assets on your Redaxo Website. github.com/AndyBitz/rex-sync-redaxo Versionen 5.x rexfactor Fügt REDAXO automatisierte Code-Upgrades hinzu, die die Produktivität bei der Entwicklung und die Codequalität verbessern. Adds automated code upgrades to REDAXO improving development productivity and code quality. github.com/FriendsOfREDAXO/rexfactor Versionen 5.x FriendsOfREDAXO rexstan Adds code analysis to REDAXO improving developer productivity and code quality. github.com/FriendsOfREDAXO/rexstan Versionen 5.x FriendsOfREDAXO Schule - Branchenlösung für für weiterführende Schulen Verwalte mit diesem Addon * Lehrer:innen * Schulklasssen * Fächer * Organigramm WIP - Unterstützung und Kooperationspartner gesucht! github.com/alexplusde/school/ Versionen 5.x Schwooops 🧪 Experimentelles Addon für REDAXO. Konzept für eine Rich Error- and Maintenance-Page, die Nutzer*innen und Website-Betreibern wirklich weiterhilft. Liefert vorgefertigte Fragmente für den Wartungsmodus und den Ooops-Fehlerfall, die Kontaktdaten beinhalten. 🪙 Unterfinanziertes Addon: Autor beauftragen - Wartung und Entwicklung fördern. www.alexplus.de/redaxo-addons Versionen 5.x Search It! Mit GPT Mit diesem Add-on können eigene GPTs über eine passende OpenAPI mit Antworten aus den Suchergebnissen von Search It ergänzt werden. www.alexplus.de/redaxo-addons Versionen 5.x Speed Up Verbessere die PageSpeed-Bewertung dank Prefetching und Preloading. 👶🏻 Kinderleicht eingerichtet. 📄 Exzellent dokumentiert. www.alexplus.de/redaxo-addons Versionen 5.x Symfony Mailer für REDAXO Symfony Mailer für REDAXO github.com/FriendsOfREDAXO/symfony_mailer Versionen 5.x FriendsOfREDAXO Sync Module/Template/Aktionen Sync für Redaxo 5 github.com/dev-train/redaxo_sync#sync-addon-für-redaxo-5 Versionen 5.x T-Racks - Module und Templates synchronisieren Keep Modules and Templates on track with T-Racks. Hilfsklasse zur Installation und Synchronisation von Templates und Modulen, die mit Add-ons mitgeliefert werden. Add-ons, die dieses System verwenden: Events, School, plus_bs5. Auch für eigene Addons einsetzbar! github.com/alexplusde/tracks Versionen 5.x Textile zu HTML-Migrator Konvertiert alle Markdown- und Textile-Inhalte nach HTML github.com/FriendsOfREDAXO/textile_migration Versionen 5.x FriendsOfREDAXO Theme Redaxo 5 Addon zum Verwalten aller Projektdateien für Frontend und Backend. github.com/FriendsOfREDAXO/theme Versionen 5.x FriendsOfREDAXO Theme-GitHub-Synchronizer für REDAXO Dieses AddOn ermöglicht es, REDAXO mit einem GitHub-Repository zu verbinden, um dann automatisch via GitHub-Webhook den theme-Ordner im Root zu aktualisieren. Somit aktualisiert sich REDAXO bzw. das Theme-Addon bei Commits oder gemergten Pull-Requests in das definierte Respository von GitHub automatisch. github.com/danspringer/theme_gh_synchronizer Versionen 5.x TinyMCE TinyMCE: WYSIWYG-Editor für REDAXO github.com/FriendsOfREDAXO/tinymce/ Versionen 5.x FriendsOfREDAXO twÖg Twig-Template-Sprache für Redaxo Versionen 5.x FriendsOfREDAXO WSM Consent-Manager - Clever und modern Einwilligungen und Auskunft von verwendeten Drittanbieter-Diensten. Die neue Alternative zum Consent Manager. Vorteile: 🛫 Unkomplizierte Verwendung und Einrichtung mit REX_VARs. 🚀 Basiert auf YForm - einfacher Import/Export 🌎 Kompatibel zu YRewrite - verwende bestehende Domains und Sprachen. 🎴 Kompatibel zu Sprog und Wildcard - verwende Übersetzungen wie gewohnt. 🪟 2-Klick-Lösung für iframes / externe Dienste wie YouTube, Google Maps. www.alexplus.de/redaxo-addons Versionen 5.x YCom Fast Forward 1-Klick-Einrichtung von YCom mit vorgefertigten Modulen und Fragmenten. 🪙 Unterfinanziertes Addon: Autor beauftragen - Wartung und Entwicklung fördern. github.com/alexplusde/ycom_fast_forward Versionen 5.x YDeploy Das Addon bietet Tools für die Datenbank-Migration während des Deployments von REDAXO-Projekten. Zusätzlich bietet es eine auf REDAXO abgestimmte Konfiguration für deployer: https://deployer.org github.com/yakamara/ydeploy Versionen 5.x YDeploy Export Erzeugt beim Deployen automatisch ein Backup und auf Knopfdruck einen Export, den man lokal einspielen kann. Versionen 5.x YForm Adminer Berechtigte Benutzer - also Entwickler oder Admin - erhalten im YForm-Tablemanager kontext-bezogene Buttons, mit denen man direkt mittels Adminer Tabellen oder gefilterte Daten angezeigt bekommt. github.com/FriendsOfREDAXO/yform_adminer Versionen 5.x FriendsOfREDAXO YForm Field Erweitert YForm um weitere Feldtypen, Validierungen und Actions. Highlights: 🧩 datetime_local (HTML5-Datumsfeld) 🧩 choice_status (Statusschalter) 🧩 privacy_policy (Dataenschutz-Checkbox) 🧩 submit_once (Absenden-Button mit Doppelklick-Sperre) 🧩 attachment-Action (Anhänge hinzufügen) 🤖 OpenAI-Felder für Teaser und eigene Prompts (in Entwicklung) www.alexplus.de/redaxo-addons Versionen 5.x YForm QuickEdit Mit QuickEdit lassen sich YForm-Datensätze ein wenig schneller, direkt aus der Datentabelle bearbeiten. Innerhalb der Datentabelle wird der eigentliche Datensatz in einer kompakteren Ansicht angezeigt u'
