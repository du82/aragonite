["https://redaxo.org/cms/news/redaxo-5.9-veroeffentlicht"]
title = "REDAXO 5.9 veröffentlicht / REDAXO Website"
full_description = 'REDAXO 5.9 veröffentlichtHeute, am 02.02.2020, wurde REDAXO 5.9 veröffentlicht. Am Release haben 20 Personen mitgearbeitet — Rekord, Danke! <3 —, und die Liste der neuen Features, Verbesserungen und Korrekturen ist ziemlich lang geworden. Besonderheiten dieses Releases: Unterstützung von PHP 7.4, MySQL 8 und utf8mb4 (vollständiger Unicode-Zeichensatz inkl. Emojis) Setup-Prozess überarbeitet. Zudem kann das Setup nun vollständig auch in der REDAXO-Konsole ausgeführt werden. Neuer zentraler Ordner für Logdateien: redaxo/data/log Neue Log-Funktionen im phpmailer-Addon Neue Benutzerrechte im structure-AddOn: addCategory[], editCategory[], deleteCategory[], addArticle[], editArticle[], deleteArticle[] Neuer Extension Point ART_CONTENT_UPDATED bei jeglichen Content-Änderungen Templates können über eindeutige Keys eingebunden werden: REX_TEMPLATE[key=my_key] Artikel-Metainfos können auf Templates beschränkt werden Überarbeitung der rex_navigation Version- und History-Plugins überarbeitet Code-Stabilität durch statische Code-Analyse verbessert Alle Infos bei Github Das vollständige Changelog auf GitHub Fehler melden und Verbesserungen einreichen auf GitHub Feature: Alle Unicodes dank utf8mb4! Mit REDAXO 5.9 kannst du nun den vollständigen Unicode-Zeichensatz benutzen. Endlich Emojis! \o/ Für das Feature benötigst du allerdings mindestens MySQL 5.7.7 oder MariaDB 10.2, und du kannst es innerhalb des Setup-Prozesses auswählen. In älteren Datenbanken wird wie bisher utf8 benutzt. Feature: Templates mittels Key einbinden Templates ließen sich bisher über ihre ID einbinden. Weil diese aber eine fortlaufende Zahl ist und sich in deinen Projekten unterscheiden kann, gibt es mit REDAXO 5.9 nun die Möglichkeit, eindeutige Keys für Templates festzulegen und sie darüber einzubinden. Wie im Screenshot zu sehen, kannst du damit deinen Header ganz einfach mittels REX_TEMPLATE[key=header] einbinden. In allen Projekten gleich. Feature: Setup in der Konsole REDAXO 5.9 lässt sich mittels setup:run nun vollständig über die Konsole installieren. Das ist sehr praktisch, um in einer Hosting-Umgebung in <10 Sekunden ein fertig eingerichtetes REDAXO an den Start zu bringen. Mit dem Feature haben wir außerdem die Voraussetzungen für die Community geschaffen, ein Docker-Image im Hub anzubieten. Dazu demnächst weitere Infos.'
