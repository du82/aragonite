full_description = "Nächstes REDAXO-Treffen in in Bozen Veröffentlicht am 20.12.2022 Das kommende REDAXO-Treffen wird ein ganz besonderes Event sein. Wir werden uns vom 23. – 26. März 2023 in Bozen/Italien treffen! Die Bozener Agentur Kreatif, die immer wieder zu unseren bisherigen Treffen in Deutschland angereist kam, sponsert den Raum und die Verpflegung tagsüber. Dafür sind wir sehr dankbar. Weiterhin Das bisher geplante Programm (aktualisiert am 20.3.2023): Mittwoch, 22.3.2023 Ankunft Donnerstag, 23.3.2023 Ausflug zum Messner Mountain Museum (wird exklusiv für uns aufgemacht) 11h – 13h Freitag, 24.3.2023. REDAXO-Workshops - REXSTAN mit und von Markus Staab - Bimmelbam(m) mit Marco Hanke - YDeploy-Workshop von Robert - Headless-Endpoints mit GraphQL über REDAXO Inhalte Artikel von Daniel Planötscher - rexfactor AddOn Premiere von Markus Staab Samstag, 25.3.2023 REDAXO-Tag - REXSTAN mit und von Markus Staab - rexfactor AddOn Premiere von Markus Staab - Headless-Endpoints mit GraphQL über REDAXO Inhalte Artikel von Daniel Planötscher Sessionwünsche: - Vortrag über Fragmente wäre wunderbar. Sonntag, 26.3.2023 (Gemeinsames) Frühstück und Abreise Hier geht es zur Anmeldung: https://www.dgtl-circus.bz.it/events/23-redaxo-treffen-bozen/ Folgendes Hotel wurde uns empfohlen: https://www.hotelraffl.com/ Nächstes REDAXO-Treffen in in Bozen Veröffentlicht am 20.12.2022 Das kommende REDAXO-Treffen wird ein ganz besonderes Event sein. Wir werden uns vom 23. – 26. März 2023 in Bozen/Italien treffen! Die Bozener Agentur Kreatif, die immer wieder zu unseren bisherigen Treffen in Deutschland angereist kam, sponsert den Raum und die Verpflegung tagsüber. Dafür sind wir sehr dankbar. Weiterhin Das bisher geplante Programm (aktualisiert am 20.3.2023): Mittwoch, 22.3.2023 Ankunft Donnerstag, 23.3.2023 Ausflug zum Messner Mountain Museum (wird exklusiv für uns aufgemacht) 11h – 13h Freitag, 24.3.2023. REDAXO-Workshops - REXSTAN mit und von Markus Staab - Bimmelbam(m) mit Marco Hanke - 