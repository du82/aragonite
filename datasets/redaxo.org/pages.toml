["https://redaxo.org/cms/news/mannhagen-und-die-neue-website"]
title = "News / REDAXO Website"
full_description = "Mannhagen und die neue Website Veröffentlicht am 24.04.2017 Der Termin steht schon seit ein paar Monaten. Monate, in denen der Schreibtisch voll ist mit Arbeit und Projekten. So wirklich haben wir keine Zeit, uns mit dem Thema zu beschäftigen, vorzubereiten, oder gar vorzuarbeiten. Welches Thema eigentlich? War da nicht was? REDAXO 5, Wackershofen. Also. Das Thema heißt: Dokumentation und in erster Linie die neue REDAXO-Website bauen. Wo ist eigentlich Mannhagen? In Schleswig-Holstein, im Nirgendwo. Wolfgang Bund und Peter Bickel müssen nur ein paar Kilometer „rüberfahren“. Jan Kristinus und Gregor Harlan kommen mit dem Zug aus Frankfurt, Oliver Kreischer und Thomas Skerbis aus dem Pott mit dem Auto und Thomas Blum aus Dresden – Anreisen aus verschiedenen Himmelsrichtungen. Der Treffpunkt: eine Reet gedeckte Bauernkate in Mannhagen, die sich als absolut ideale Location für unser Vorhaben herausstellt. Es gibt ausreichend Platz, das Flair ist einfach nur genial. Alles ist liebevoll und stilvoll gemacht und geschmackvoll eingerichtet. Das Scheunentor lassen wir oft offen stehen, die Schafe nebenan blöken. Den Kamin und die Sauna wollten wir eigentlich anfeuern, aber wir finden keine Zeit dafür, die Website ging vor. Wir gehen diesmal gar nicht essen, es ist zu schön hier, außerdem finden wir so mehr Zeit für die Arbeit. Wolfgang übernimmt die Betreuung der Küche und den Einkauf, auch Oliver bringt Lebensmittel mit. REDAXO, das merken wir immer wieder in solchen Momenten, ist einfach anders. Anders als alles, was wir sonst kennen. Oder anders ausgedrückt: REDAXO macht Spaß. Das Programm war ambitioniert. Die nicht ganz triviale Technik des Umzuges musste bewerkstelligt werden, die alte Website hatte ja ordentlich was zu bieten: das Forum, den interne Bereich, den Agenturbereich, die User. Jan und Gregor leisten ganze Arbeit. Es wird mit Sicherheit an der einen oder anderen Stelle Fragen geben: Warum gibt es dies nicht mehr und früher hat das doch so funktioniert? Wir tun uns bei einigen Entscheidungen nicht leicht, zum Beispiel beim Abschalten der Module und Template im Downloadbereich. Aber auch das gehört dazu: zu entscheiden, ob und wie eine neuer Template- und Modulbereich aussehen kann. Wir müssen Abstriche machen, wir werden an dem Wochenende nicht alles schaffen. Damit leben wir. Das ist dann aber auch der Anstoß, möglichst bald weiter zu bauen – an der neuen Seite, mit einem neuen Fundament. Und wie dies bei so einem Abriss ist: Es kann nicht alles recycelt werden. Und ein neuer Newsletter wird erstellt und aufgebaut, mit Inhalten gefüllt, und eine eigene Versandtechnik wird programmiert. Zum Abendessen gibt es Crepes. Schnell gemacht und fast für jeden Geschmack. Sieben Menschen arbeiten konzentriert an einer Sache, da muss es doch vorwärts gehen. Geht es auch, aber es tun sich dabei auch immer wieder neue Fragen, neue Aufgaben auf. Der erste Tag geht für die meisten erst so um zwei Uhr des Folgetages zu Ende. Noch ist nicht entschieden: Schaffen wir es? Eigentlich ist es nicht zu schaffen, aber am Samstag müssen wir entscheiden. Denn wenn die Datenmigration gemacht wird, gibt es kein Zurück mehr. So fällt die Entscheidung: Wir schaffen es. Oder besser: Wir machen es einfach. Das Forum geht offline. Wolfgang, Peter, Thomas Skerbis und Oliver arbeiten sich durch die Doku. Das macht auch Spaß und manchmal lernt man dabei mehr als auf einem 14-tägigen Seminar. Die Experten sitzen am gleichen Tisch oder im Raum nebenan. Wir fragen und bekommen Antworten und können weiter schreiben. Möglicherweise gibt es noch Löcher, so eine Dokumentation ist ja auch nicht irgendein trivialer Text. Für wen schreiben wir? Werden Einsteiger damit zurecht kommen? Haben wir selbst verstanden, was wir schreiben? Ständig testen wir und probieren aus. Auch der Samstag geht viel zu schnell vorbei. Zum Abendessen gibt es Raclette – das ist schnell gekocht und immer lustig. Überhaupt … die Verpflegung hier kann sich sehen lassen. Wie viele Kuchen haben wir? Drei, vier? Gregor hat ja schließlich auch Geburtstag. Nur so viel: Am Sonntagmorgen ist das Nutella-Glas tatsächlich noch geschlossen. Auch die Chipstüten bleiben zu. Wir lassen’s uns dennoch gut gehen und so soll es ja auch sein. Die Website? Die ist online, wie Ihr seht. Irgendwie haben wir es geschafft. Das ist eben auch immer wieder faszinierend an REDAXO: Gemeinsam erreichen wir eine ganze Menge."
