full_description = 'Nutzungsbedingungen Allg. Nutzungsbedingungen für die Nutzung des Online-Angebotes “MyREDAXO” Yakamara Media GmbH & Co. KG („yakamara“) bietet nach erfolgreicher Registrierung auf der Website www.redaxo.org die Teilnahme an dem Online-Dienst „MyREDAXO“ nach Maßgabe der folgenden Nutzungsbedingungen an: 1. Geltungsbereich (1.1) Die hier gelisteten Nutzungsbedingungen gelten ausschließlich für die Angebote des Online-Dienstes MyRedaxo unter https://redaxo.org/myredaxo/. (1.2) Die Nutzungsbedingungen können jederzeit unter https://redaxo.org/myredaxo/ eingesehen werden. 2. Teilnahme und Registrierung (2.1) Zur Teilnahme an MyREDAXO sind ausschließlich ordnungsgemäß registrierte Internetnutzer (nachfolgend „Nutzer“ genannt) berechtigt. (2.2) Die Registrierung der Nutzer erfolgt über eine Eingabemaske auf der MyREDAXO Website. Der Nutzer beantragt seine Registrierung, indem er zumindest die vorgesehenen Pflichtfelder ordnungsgemäß ausfüllt und das ausgefüllte Formular mit Betätigung des entsprechenden Buttons an Yakamara absendet („Registrierung“). Dabei besteht jederzeit bis zur Betätigung dieses Buttons die Möglichkeit, die vorgenommenen Eintragungen zu ändern oder zu löschen. Auch nach erfolgter Registrierung hat der Nutzer die Möglichkeit, die von ihm eingetragenen Daten über eine entsprechendende Eingabemaske mit Ausnahme der E-Mail-Adresse und des Logins zu verändern. Nach Eingang der Registrierungsanfrage bei Yakamara wird dem Nutzer eine Bestätigungsmeldung über die erfolgte Registrierung online angezeigt und an die von ihm angegebene E-Mail Adresse zugesandt. Eine Speicherung der Registrierungsanfrage unabhängig von den dort gemachten Angaben erfolgt nicht. (2.3) Zur Registrierung sind nur solche Personen zugelassen, die mindestens 13 Jahre alt und nicht geschäftsunfähig sind. Für die Registrierung Minderjähriger ist eine Einverständniserklärung eines gesetzlichen Vertreters erforderlich. (2.4) Für die Registrierung benötigt der Nutzer eine g