["https://redaxo.org/cms/news/redaxo-mit-php-8-nutzen"]
title = "REDAXO mit PHP 8 nutzen / REDAXO Website"
full_description = "REDAXO mit PHP 8 nutzenDas neue PHP 8 ist für Ende November geplant. Es sind aber bereits Alpha-Versionen zum Testen veröffentlicht worden, und hier beschreiben wir kurz, wie ihr diese schon jetzt für REDAXO nutzen könnt. Das REDAXO-Team hat PHP 8 schon eine Weile in der automatisierten Testumgebung laufen und konnte damit frühzeitig darauf achten, dass die Codebasis kompatibel ist. Aber wie könnt ihr auf eurem System PHP 8 installieren, um eure AddOns und Webseiten zu testen? Eine sehr schnelle und praktikable Möglichkeit dafür ist Docker. Wer sich bereits damit auskennt, kann in wenigen Minuten ein frisches REDAXO auf Basis von PHP 8 aufsetzen, denn wir haben bereits die Images im Docker Hub publiziert. Eine passende Konfiguration findet ihr im Bereich »Recipes« des zugehörigen Git-Repos: Konfiguration für REDAXO mit PHP 8 Anleitung für Docker? Allen denjenigen, die noch nicht viel Erfahrung mit Docker haben, es aber gerne mal ausprobieren möchten, empfehlen wir das Projekt »REDAXO mit Docker«. Dabei handelt es sich um ein Tutorial, das den Umgang mit Images und Containern erklärt, und dessen Ziel es ist, eine lokale Entwicklungsumgebung für REDAXO einzurichten. Wenn ihr das Tutorial durchgespielt habt, seid ihr vermutlich in der Lage, die oben genannte Konfiguration für REDAXO mit PHP 8 zu nutzen. Aber keine Sorge, falls es doch noch hakelt, wir helfen gerne im Slack-Chat weiter! Neues in PHP 8 PHP 8 ist zum Zeitpunkt dieser News-Meldung kurz vorm Feature Freeze, so dass es in den kommenden Wochen vor allem noch darum geht, Fehler zu finden und sie zu beheben. Welche neuen Features enthalten sind, erklärt Nikita Popov, einer der Core-Developer, im nachfolgenden Video. Und hey: Ein Feature wurde übrigens von Gregor (REDAXO) beigesteuert! :)"
