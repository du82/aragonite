["https://redaxo.org/cms/team"]
title = "Team / REDAXO Website"
full_description = '''Team Jan Kristinus Der Chef. Meckert gern. ;-) Aber ebenso gern diskutiert er und hat immer neue Visionen und Ideen im Kopf. Zuständig für Konzeption und Programmierung hält er die Zügel locker in der Hand, die Gruppe zusammen und immer ein Auge auf die Espressomaschine. Wer hat's erfunden? Der Jan. Thomas Blum Zuständig für das Backend von REDAXO, außerdem für zahlreiche Module und AddOns. Thomas ist als Front- und Backend-Entwickler stets aktiv im Forum unterwegs. Ruhig und mit viel Fachwissen schleicht Thomas immer wieder mit tollen Lösungen um die Ecke. Er sorgt sich um die REDAXO Webseite, entwickelt AddOns, schaut allen über die Finger und korrigiert deren Fehler. Wehe, man macht etwas halbherzig! Kaum jemand ist länger dabei und zeigt weiterhin die gleiche Leidenschaft. Markus Staab Hat den Grundstein gelegt zu früheren REDAXO-Versionen und ist noch immer als Supervisor dabei. Wenn man Markus zuhört, denkt man nach 10 Minuten, man ist doof; Markus ist programmiertechnisch nicht von dieser Welt ... aber der nötige und sinnvolle Perfektionismus, den er am REDAXO-Code ansetzt, kann einen auch verrückt machen. Gregor ist übrigens kaum anders ... deswegen ergänzen sich die beiden prächtig. Markus ist REDAXO-Entwickler der ersten Stunde und ist – kaum zu glauben – weiterhin leidenschaftlich dabei, obwohl er REDAXO nicht mal selbst nutzt. Wo wären wir ohne Dich? Dein Einsatz ist bemerkenswert! Gregor Harlan Gregor haben wir zu einem großen Teil REDAXO 5 zu verdanken. Als Core-Entwickler legt er eine bewundernswerte Zielstrebigkeit, gepaart mit Perfektionismus (siehe Markus) an den Tag. Gregor ist der nötige Ruhepol im Core-Team, dank seiner "political correctness" kann er stets vermitteln. Und Gregor hilft gerne mal im REDAXO-Slack Channel aus, wenn andere nicht mehr weiter kommen. (Anmerkung der Redaktion: Wenn Gregor etwas sagt: Zuhören! Mitschreiben! Es lohnt sich.) Ralph Zumkeller Der immer fröhliche Wuschelkopf ist für Konzeption und Gestaltung zuständig. Er hat zum Beispiel das Layout dieser Website sowie der REDAXO-Backends "verbrochen". Die Zusammenarbeit mit Ralph kann Nerven kosten, sofern man ein "80%-Typ" ist. Denn er ist bei der Realisierung der von ihm erstellten Designs erst bei 100% zufrieden. Peter Bickel Als "Mädchen für alles" betreut Peter die REDAXO-Website. Auch einen Großteil der Texte hat der gelernte Journalist geschrieben, der mittlerweile vor allem als Entwickler und Designer sein Geld verdient. Einmal im Jahr ist Peter einfach nicht zu erreichen. Die gewaltige Natur des hohen Nordens gibt ihm genug Kraft, um den Rest des Jahres Kundenwünsche zu realisieren. Die restliche Zeit ist Peter aber immer zu 100% da. Fokussiert und mit dem nötigen Biss kümmert er sich vor allem um Pressetexte, News, Forumspflege und die REDAXO-Demos, Doku und Tutorials. Oliver Kreischer Olli ist mit seinem Ruhrpott-Charme immer dabei, immer begeistert, und ohne ihn würde extrem viel fehlen. Wer sorgt sich um alle und schickt nebenbei noch seinen bekannten Eierlikör durch? Wer ist vielleicht kein Core-Entwicklungs-Experte, kriegt aber sonst alles perfekt hin, ist aktiv im Forum und im Slack-Channel, entwickelt AddOns und Module, kümmert sich um die REDAXO-Referenzen und unseren Newsletter? Der Olli. Und seinen Ruf als "Website-Maschine" hat er immer noch - auch wenn er, mittlerweile in einer Agentur angestellt, nicht auf seine 2-4 Relaunches die Woche kommt. Du darfst nie fehlen. Alexander Walther Darf's noch ein Issue mehr sein? Alex hat REDAXO noch als Schüler kennen gelernt und ist seit 2007 Teil der REDAXO-Community. Sein hilfsbereites Engagement richtet sich vor allem auf die technischen Dokumentationen zu REDAXO-Addons und dem Community-Management im Slack-Channel. Sein Talent zum Bugsfinden und Reproduzieren selbiger hat er bereits in der QS als Software-Spieletester unter Beweis gestellt. Kein Wunder also, dass Alex pflichbewusst alles in ein Github-Issue packt, was er zwischen die Finger bekommt. Marcel Kuhmann sudo -u bloep php redaxo/bin/console Marcel ist der Jüngling in der Runde. Während seines Schülerpraktikums hat er REDAXO kennen und lieben gelernt. Seit 2017 wirkt er aktiv im Core mit. Die REDAXO-Konsole hat es Marcel angetan, denn am liebsten entwickelt und zaubert er neue Features und Befehle für selbige Konsole. Seine Ruhe und Gelassenheit, auch in turbulenten Diskussionen, sind Gold wert. So behält er von der Konzeption bis zur finalen Umsetzung immer den Überblick. Thomas Skerbis Thomas ist ein REDAXO-Urgestein und schon seit vielen Jahren nicht nur Teil der REDAXO-Community, sondern auch treibende Kraft. Wer mit REDAXO arbeitet, kommt früher oder später mit seinen nützlichen AddOns in Berührung. Auch die Weiterentwicklung der offiziellen REDAXO-Doku liegt maßgeblich in seiner Hand. Thomas ist einfach ein herzensguter Mensch. Ob es am Namen liegt? Wir wissen es nicht. Aber wir wissen: Ohne ihn wäre das CMS und unsere Community nicht so gut, wie sie sind. Dank Einen herzlichen Dank für die Mithilfe an Core, Redaxo-Website, Slack, Dokumentation, Übersetzungen, Pressearbeit, Meldung von Sicherheitslücken etc. an: Andreas Eberhard, Carsten Eckelmann, Dagmar Uttich, Daniel Weitenauer, Dirk Schürjohann, Hirbod Mirjavadi, Jan Camrda, Joachim Dörr, Kai Kristinus, Marco Hanke, Thorben Jaworr, Michael Kaiser, Norbert Micheel, Peter Kalmar, Peter Thiel, Richard Laing, Andreas-Lenhardt, Rudi Heimann, Rüdiger Nitzsche, Sven Eichler, Taina Soares, Thomas Kägi, Wolfgang Bund, Wolfgang Huttegger, Yves Torres, Siamul Islam Weiterhin vielen Dank an alle, die sich an der Weiterentwicklung von REDAXO beteiligen: https://github.com/redaxo/redaxo/graphs/contributors'''
author = ""
year_published = 2025
clearnet = "https://redaxo.org/cms/team"
