["https://redaxo.org/cms/news/redaxo-5.2-ist-veroeffentlicht"]
title = "News / REDAXO Website"
full_description = 'REDAXO 5.2 ist veröffentlicht Veröffentlicht am 15.07.2016 Download der Version 5.2 In bestehende 5er-Versionen könnt Ihr das Update am leichtesten über den Installer laden und aktualisieren. Die Version 5.2 hat einige spannende Neuerungen zu bieten … Enthalten ist neues Plugin “history”: Damit können Änderungen an Artikelinhalten protokolliert werden, mit Möglichkeit zum Vergleich und zur Wiederherstellung. Ein Markdown-Parser wurde direkt in den Core intregriert, damit man Hilfetexte und Dokumentationen leichter ohne externe Abhängigkeiten formatieren kann. Standardmäßig enthalten ist nun ein neues leeres “project”-Addon, wo man projektspezifische Dinge (Klassen, Funktionen, etc.) ablegen kann. Folgende neue Extension Points stehen nun zur Verfügung: SLICE_CREATE, SLICE_EDIT, SLICE_DELETE, SLICE_MOVE, ART_SLICES_QUERY, ART_SLICES_COPY. Diese EPs wurden umbenannt (die alten Bezeichnungen funktionieren noch): STRUCTURE_CONTENT_CREATED/UPDATED/DELETED -> SLICE_CREATED/UPDATED/DELETED. Service-Klassen können auch aus dem Frontend heraus genutzt werden. “Block hinzufügen” wird auch beim Bearbeiten/Erstellen eines Slices angezeigt. Im Medienpool werden nun auch SVGs korrekt angezeigt. Im Image-Manager gibt es “colorize” und\“convert2image” als neue Effekte. Außerdem wurden die Effekte “insert_image”, “filter_blur” und “rounded_corners” repariert. Hinweis: Die PHP-Mindestversion wurden auf 5.5.9 gesetzt. Die Zahl der Änderungen und Bugfixes ist lang; die vollständige Liste könnt Ihr hier einsehen: https://github.com/redaxo/redaxo/releases/tag/5.2.0 REDAXO 5.2 ist veröffentlicht Veröffentlicht am 15.07.2016 Download der Version 5.2 In bestehende 5er-Versionen könnt Ihr das Update am leichtesten über den Installer laden und aktualisieren. Die Version 5.2 hat einige spannende Neuerungen zu bieten … Enthalten ist neues Plugin “history”: Damit können Änderungen an Artikelinhalten protokolliert werden, mit Möglichkeit zum Vergleich und zur Wiederherstellung. Ein Markdown-Parser wurde direkt in den Core intregriert, damit man Hilfetexte und Dokumentationen leichter ohne externe Abhängigkeiten formatieren kann. Standardmäßig enthalten ist nun ein neues leeres “project”-Addon, wo man projektspezifische Dinge (Klassen, Funktionen, etc.) ablegen kann. Folgende neue Extension Points stehen nun zur Verfügung: SLICE_CREATE, SLICE_EDIT, SLICE_DELETE, SLICE_MOVE, ART_SLICES_QUERY, ART_SLICES_COPY. Diese EPs wurden umbenannt (die alten Bezeichnungen funktionieren noch): STRUCTURE_CONTENT_CREATED/UPDATED/DELETED -> SLICE_CREATED/UPDATED/DELETED. Service-Klassen können auch aus dem Frontend heraus genutzt werden. “Block hinzufügen” wird auch beim Bearbeiten/Erstellen eines Slices angezeigt. Im Medienpool werden nun auch SVGs korrekt angezeigt. Im Image-Manager gibt es “colorize” und\“convert2image” als neue Effekte. Außerdem wurden die Effekte “insert_image”, “filter_blur” und “rounded_corners” repariert. Hinweis: Die PHP-Mindestversion wurden auf 5.5.9 gesetzt. Die Zahl der Änderungen und Bugfixes ist lang; die vollständige Liste könnt Ihr hier einsehen: https://github.com/redaxo/redaxo/releases/tag/5.2.0'
