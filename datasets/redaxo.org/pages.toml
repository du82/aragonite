["https://redaxo.org/doku/main/addons-list"]
title = "AddOns und Workflows / Doku / REDAXO Website"
full_description = "AddOns und Workflows Einführung Systemerweiterungen Backend Development Adminer Cheatsheat für Extensionpoints Demo-AddOn Developer - Module, Templates und Aktionen syncen ICEcoder Project - Schnell mal eine PHP-Class einbinden rexstan Theme - Verwalten aller Projektdateien für Frontend und Backend YConverter - Migration REDAXO 4.x zu 5.x YTraduko - Übersetzungshelfer ZIP-Install Workflows REDAXO mit Bimmelbam Docker Einführung AddOns erweiteren das REDAXO CMS um neue Funktionen. Sie können manuell über die REDAXO-Website installiert werden (<https://redaxo.org/download/addons/), > oder über das AddOn Installer direkt innerhalb des REDAXO CMS. Erst die zu einem Projekt passenden AddOns machen REDAXO zu dem mächtigen Werkzeug, das es wirklich ist. In der Vielzahl der AddOns ist es manchmal schwierig, den Überblick zu behalten. Nachfolgend stellen wir eine redaktionelle Auswahl beliebter AddOns vor. Du findest, hier fehlt ein exzellentes AddOn? Reiche deinen Vorschlag direkt ein: https://github.com/redaxo/docs/issues Systemerweiterungen YRewrite - sprechende URLs Eine multidomainfähige Lösung für schöne und suchmaschinenoptimierte URLs sowie weiterer Features. YForm - Formulare und tabellarische Daten verwalten Vom Kontaktformular bis zu komplexer Produktverwaltung: Mit YForm lassen sich Datentabellen anlegen und verwalten, Formulare aufbauen und verarbeiten, E-Mail Templates erstellen und einiges mehr. Backend AddOns AddOns, die für die Programmierung, und die Verwaltung im Backend hilfreich sind. MForm - Spielend leicht Moduleingabe-Formulare erstellen Mit MForm lassen sich mit wenigen Zeilen Eingabeformulare für Module erstellen. MBlock - Formular-Abschnitte in Modulen beliebig häufig nutzen Mit MBlock lassen sich Module erstellen, die mehrere gleichartige Inhaltselemente enthalten. Ideal für Galerien, Teamlisten, Akkordeons usw. Quick Navigation Das AddOn ermöglicht den schnellen Zugriff auf die ganze Struktur im Backend. Es sollte in keinem Projekt fehlen, mit einem Umfang von mehr als zwei Seiten. Watson Das AddOn ermöglicht den schnellen Zugriff auf Artikel und YForm-Datensätze, ähnlich wie MacOS Spotlight oder die Windows-Suche. Development Adminer Adminer für REDAXO. Seit Version 1.3.0 kann der rex_sql_table code für die ausgewählte Tabelle in der Tabellenstruktur generiert werden. Sehr hilfreich bei der AddOn-Erstellung für die install.php. Cheatsheet Das Cheatsheet-AddOn scant die REDAXO-Installation nach Extension-Points im Core und den installierten AddOns und listet deren Position im Quellcode auf. Installation aus Github-Repo: Demo-AddOn Das Demo-AddOn zeigt, wie AddOns entwickelt und dokumentiert werden. Gut kommentierter Quellcode, Hilfe und Tipps im AddOn selbst helfen beim Verständnis der AddOn-Programmierung und der Dokumentation. Es liefert auch ein Doku-Plugin, das den Aufbau einer Hilfe für das eigne AddOn ermöglicht. Github-Repo Developer Developer kopiert und synct Module, Templates und Aktionen zwischen Dateisystem und Datenbank, so können diese direkt über einen Dateieditor oder per FTP bearbeitet werden, statt über das REDAXO-Backend. ICEcoder Web-IDE ICEcoder ist ein Web-IDE / browserbasierter Code-Editor, der durch Plugins erweiterbar ist. Project In REDAXO bereits vorhanden, ist das Project-AddOn. Hier können einfach eigene PHP-Classes und Assets eingebunden werden, die nach einem Update nicht gelöscht werden. Man erspart sich so also die Entwicklung eines eigenen AddOns, wenn man das System einfach nur mit einer PHP-Class bereichern möchte. rexstan PHPStan CLI-Version und GUI für REDAXO. PHPStan ist ein statisches Analyse-Werkzeug für PHP-Code. Es versucht, mögliche Fehler und Probleme in PHP-Code zu finden, indem es den Code analysiert, ohne ihn tatsächlich auszuführen. PHPStan verwendet Typinformationen und andere Informationen, um mögliche Probleme im Code zu identifizieren und dem Entwickler mitzuteilen. Es kann bei der Entwicklung hilfreich sein, da es mögliche Fehler frühzeitig aufspüren kann, bevor sie zu größeren Problemen werden. Theme Das Theme-AddOn erleichtert die Verwaltung aller für das Projekt erforderlichen Prajektdateien in einem zusätzlichen /theme-Ordner im Web-Root. Theme erlaubt es auch das System oder die Website mit zusätzlichen CSS, JS und PHP-Classes zu breichern. Ist das Developer-AddOn installiert, synct es sich mit diesem um die Modul- und Template-Dateien an einer zugänglicheren Stelle bereitzustellen. YConverter Eine REDAXO 4.x - Datenbank kann mithilfe dieses AddOns für REDAXO 5.x vorbereitet werden und migriert werden. Hierbei werden bekannte Class- und Methodenaufrufe, REX_VARS für REDAXO 5.x vorbereitet und sogar xform-Tabellen nach yform konvertiert. Github-Repo YTraduko - Übersetzungshelfer Ytraduko hilft bei der Übersetzung der eigenen AddOns. Anstelle selbst für die weiteren Sprachen neue .lang - Dateien anzulegen, erledigt dieses AddOn es selbst. Die Übersetzungen können übersichtlich und schnell eingepflegt werden. Github-Repo ZIP-Install Das ZIP-Install ermöglicht es gezippte AddOns, ohne Umweg per FTP auf den Server zu laden und zu entpacken. Ganz praktisch vor allem, wenn es sich um AddOns handelt, die es nur als GitHub-Repo gibt und nicht im Installer zur Vefügung stehen. Workflows für Developer REDAXO mit Gulp, Browserify, PostCSS und Bimmelbam Ein Frontend-Workflow auch für REDAXO Frontendentwicklung wird immer aufwändiger, SCSS wollen kompiliert werden, Bilder komprimiert werden, JS schöner werden, HTML-Prototypen wollen erzeugt werden. REDAXO mit Bimmelbam zeigt hierfür einen ausbaufähigen Weg. GitHub-Repo Artikel bearbeiten"
