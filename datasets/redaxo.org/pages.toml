["https://redaxo.org/doku/main/installer"]
title = "Installer / Doku / REDAXO Website"
full_description = 'Installer Für die Aktualisierung von REDAXO, den Download und die Installation neuer AddOns ist der Installer die zentrale Anlaufstelle. Updates des Systems und der AddOns werden im Bereich Vorhandene aktualisieren angezeigt. Unter dem Reiter Neues herunterladen befindet sich eine Übersicht der verfügbaren AddOns. Dort werden die AddOns beschrieben und stehen zum Download zur Verfügung. Die Installation eines neu heruntergeladenen AddOns ist direkt nach dem Download möglich. Unter Einstellungen kann festgelegt werden, dass Backups erstellt werden. Bei einer Aktualisierung werden Backups der alten AddOn-Verzeichnisse bzw. bei einem Core-Update der entsprechenden Core-Verzeichnisse erstellt. Diese werden unter redaxo/data/addons/install/ abgelegt. Eine Sicherung der Datenbank wird aber nicht durchgeführt! Dies kann z.B. über das Backup-AddOn erfolgen. Vorhandene Aktualisieren Neue AddOns herunterladen AddOn installieren Eigene AddOns hochladen Vorhandene aktualisieren Im Bereich "Vorhandene aktualisieren" wird aufgelistet, welche AddOns und Bestandteile des Kernsystems (Core) aktualisiert werden können. Bevor ein Update durchgeführt wird, wird dringend empfohlen, die Release Notes (Versionshinweise) zu lesen. Durch Anklicken des Namens (Key) erhält man Informationen über die neuen Versionen. Manchmal ist es erforderlich, Anpassungen nach einem Update durchzuführen. Ist man sich hierbei nicht sicher, was zu tun ist, sollte man besser alles vorerst belassen wie es ist und das jeweilige Update besser nicht ausführen. Kontaktiere gegebenenfalls die Community, die Agentur oder den Entwickler die für Dich die Website erstellt haben. Neue AddOns herunterladen Neue AddOns lädt können über den Reiter Neue herunterladen heruntergeladen werden. Hier befindet sich eine Liste der AddOns und ein paar Informationen wie Autor, Kurzbeschreibung. Weiterführende Informationen zum AddOn und zu den Versionen, sind nach dem Klick auf Ansehen oder dem AddOn-Namen verfügbar. Um das AddOn herunterzuladen, muss bei der gewünschten Version herunterladen ausgewählt werden. Anschließend kann das AddOn unter "AddOns" installiert werden. AddOn installieren Bis Version 5.15 konnte ein AddOn nur in der AddOn-Verwaltung installiert werden. Seit 5.15 ist es möglich, das AddOn direkt nach dem Herunterladen zu installieren und zu aktivieren. Eigene AddOns hochladen Entwickler können eigene AddOns direkt aus der REDAXO-Installation heraus in den Downloadbereich von redaxo.org hochladen und zum Download bereitstellen. Die AddOns stehen danach im Installer und auf der Website redaxo.org zum Download bereit. Hierzu wird einen API-Key benötigt, der im eigenen myREDAXO-Account eingesehen werden kann. Weitere Informationen zur Erstellung und Bereitstellung eigener AddOns im Kapitel Veröffentlichung. Artikel bearbeiten'
