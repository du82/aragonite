il Versionen 5.x FriendsOfREDAXO FOR Sa11y - Accessibility checker FOR sa11y adds "Sa11y" to the REDAXO frontend, when a user is logged in. Vendor: https://sa11y.netlify.app/ Sa11y visually highlights accessibilty content issues at the source with a simple tooltip on how to fix them. github.com/FriendsOfREDAXO/for_sa11y Versionen 5.x FriendsOfREDAXO Formular-Download Dieses Modul ermöglicht es Ihnen, die Daten für allen Formularen von SQL-Servern intern runterzuladen. www.raumkontakt.de/ Versionen 5.x Link Checker Link Checker prüft in regelmäßigen Abständen, welche Hyperlinks auf der REDAXO-Seite in Anker-Tags verwendet werden und ob diese noch gültig / erreichbar sind, oder verwaist / fehlerhaft sind. github.com/alexplusde/link_checker Versionen 5.x FriendsOfREDAXO Matomo-Dashboard Matomo Dashboard github.com/FriendsOfREDAXO/matomo Versionen 5.x FriendsOfREDAXO PhpMailer . Versionen 5.x piwik Das Addon ergänzt die Möglichkeit der Einbindung der freien Trackingsoftware "Piwik". github.com/piwik/piwik Versionen 5.x FriendsOfREDAXO Projektmanager Dieses Addon bietet Unterstützung bei der Verwaltung und Überprüfung der eigenen REDAXO-Installationen. Versionen 5.x FriendsOfREDAXO rokito Capacity Ein Speicherplatz Analysetool fürs Backend. rokito.de Versionen 5.x SEO Inspektor Ein SEO Ranking Tool fürs Backend. Dieses Addon erweitert die Seitenspalte im Backend um das Inspektor Panel. Hier wird der gesamte Artikel nach allgemeinen SEO Kriterien durchsucht und die Ergebnisse überischtlich aufgelistet. Darüber hinaus kann auf ein individuelles Fokus-Keyword geprüft werden. Der Inspektor ist damit eine Art interaktive SEO-Checkliste. rokito.de/ Versionen 5.x FriendsOfREDAXO SEO-CheckUp SEO-Rankingtool (Suchmaschinenoptimierung) zur Analyse wichtiger SEO-Kriterien der Artikel-Livedaten github.com/iceman-fx/seocheckup Versionen 5.x Sprog Sprog - Sprachen AddOn Vereint das ehemalige opf_lang und language_copy Versionen 5.x Statistics Stellt eine Besucher Statistik zur Verfügung. github.com/AndiLeni/statistics Versionen 5.x Textile ACHTUNG: Das Addon wird nicht weiter entwickelt, stattdessen sollte das markitup-Addon verwendet werden, welches Textile mitliefert. Versionen 5.x Usage Check Addon, das nach Bildern, Module und Templates sucht, die nicht (mehr) verwendet werden. Versionen 5.x WSM Consent-Manager - Clever und modern Einwilligungen und Auskunft von verwendeten Drittanbieter-Diensten. Die neue Alternative zum Consent Manager. Vorteile: 🛫 Unkomplizierte Verwendung und Einrichtung mit REX_VARs. 🚀 Basiert auf YForm - einfacher Import/Export 🌎 Kompatibel zu YRewrite - verwende bestehende Domains und Sprachen. 🎴 Kompatibel zu Sprog und Wildcard - verwende Übersetzungen wie gewohnt. 🪟 2-Klick-Lösung für iframes / externe Dienste wie YouTube, Google Maps. www.alexplus.de/redaxo-addons Versionen 5.x YFeed - EInlesen von Stream (Twitter, RSS, Facebook) Mit YFeed kann man Twitter, RSS oder Facebook Nachrichten einlesen und dauerhaft sichern, um so z.B. seine eigenen sozialen Inhalte auf der eigenen Webseite zu nutzen Versionen 5.x Zuletzt geändert Letzte Artikeländerungen zusammenfassen. Versionen 5.x'
