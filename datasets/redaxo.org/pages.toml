["https://redaxo.org/cms/news/redaxo-5.4-veroeffentlicht"]
title = "News / REDAXO Website"
full_description = "REDAXO 5.4 veröffentlicht Veröffentlicht am 16.11.2017 Bereits auf dem REDAXO-Tag angekündigt und in den letzten Wochen als Beta von einigen Entwicklern getestet: Die aktuelle REDAXO-Version 5.4 bietet zahlreiche Neuerungen und Verbesserungen für Entwickler und Redakteure. Die Highlights neue Funktion rex_escape() um mögliche XSS-Attacken bei einer Ausgabe abzusichern neue Api-Klassen zum Erstellen / Bearbeiten und überprüfen von SQL-Tabellen und -Spalten neue Klasse rex_password_policy um bspw. eine Mindestlänge für Passwörter festzulegen Backup-Cronjob entfernt auf Wunsch alte Backups um Speicherplatz zu sparen überarbeiteter PHP-Mailer mit Testfunktion, Hilfe und Beispielen überarbeitetes History-Plugin mit Korrekturen und neuem Interface neue Parameter und Effekte für den Media Manager z.B. webp-Format, Qualitätsstufen, Helligkeit, u.a. und über 50 weitere Verbesserungen und Korrekturen… das vollständige Changelog auf GitHub Fehler melden und Verbesserungen einreichen auf GitHub REDAXO 5.4 veröffentlicht Veröffentlicht am 16.11.2017 Bereits auf dem REDAXO-Tag angekündigt und in den letzten Wochen als Beta von einigen Entwicklern getestet: Die aktuelle REDAXO-Version 5.4 bietet zahlreiche Neuerungen und Verbesserungen für Entwickler und Redakteure. Die Highlights neue Funktion rex_escape() um mögliche XSS-Attacken bei einer Ausgabe abzusichern neue Api-Klassen zum Erstellen / Bearbeiten und überprüfen von SQL-Tabellen und -Spalten neue Klasse rex_password_policy um bspw. eine Mindestlänge für Passwörter festzulegen Backup-Cronjob entfernt auf Wunsch alte Backups um Speicherplatz zu sparen überarbeiteter PHP-Mailer mit Testfunktion, Hilfe und Beispielen überarbeitetes History-Plugin mit Korrekturen und neuem Interface neue Parameter und Effekte für den Media Manager z.B. webp-Format, Qualitätsstufen, Helligkeit, u.a. und über 50 weitere Verbesserungen und Korrekturen… das vollständige Changelog auf GitHub Fehler melden und Verbesserungen einreichen auf GitHub"
