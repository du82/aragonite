["https://redaxo.org/cms/news/die-plaene-fuer-die-kommenden-monate"]
title = "News / REDAXO Website"
full_description = "Die Pläne für die kommenden Monate Veröffentlicht am 21.01.2014 Am vergangenen Wochenende traf sich das REDAXO-Team in Coburg, um die Pläne der nächsten Monate persönlich durchzusprechen. Da die kontinuierlich entwickelte Redaxo-Version 5 zwar bereits zu etwa 80% fertig gestellt ist, wir aber noch keinen verlässlichen Release-Termin nennen wollen, haben wir Ideen gesammelt für weitere Features der kommenden 4er-Version. An dieser haben wir auch mit der Weiterentwicklung begonnen. Da es anscheinend für manche so aussieht, als seien wir ein abgeschotteter Kreis, der keine weiteren Entwickler aufnehmen will, möchten wir an dieser Stelle noch einmal betonen: Das Gegenteil ist der Fall! Wir freuen uns IMMER über Mitarbeit; Coding-Hilfe auch an REDAXO selbst via Github ist sehr willkommen. Und natürlich wird man sich dann auch persönlich treffen ab einer gewissen regelmäßigen Mitarbeit. Nicht zuletzt gewinnt das Projekt “neue REDAXO-Website”, das in den letzten Monaten zu wenig Priorität bei uns hatte, nun an Fahrt. Das Frontend ist bereits recht weit fort geschritten, die Arbeiten am Backend haben begonnen. Beachtet bitte auch die neuen REDAXO-Lieblinge des ersten Quartals 2014. Wer Vorschläge hat für kommende Lieblinge: immer her damit! Bitte einreichen unter info[at]redaxo.org Die Pläne für die kommenden Monate Veröffentlicht am 21.01.2014 Am vergangenen Wochenende traf sich das REDAXO-Team in Coburg, um die Pläne der nächsten Monate persönlich durchzusprechen. Da die kontinuierlich entwickelte Redaxo-Version 5 zwar bereits zu etwa 80% fertig gestellt ist, wir aber noch keinen verlässlichen Release-Termin nennen wollen, haben wir Ideen gesammelt für weitere Features der kommenden 4er-Version. An dieser haben wir auch mit der Weiterentwicklung begonnen. Da es anscheinend für manche so aussieht, als seien wir ein abgeschotteter Kreis, der keine weiteren Entwickler aufnehmen will, möchten wir an dieser Stelle noch einmal betonen: Das Gegenteil ist der 