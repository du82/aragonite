title = "News / REDAXO Website"
full_description = "Demo-Website für REDAXO 5 Veröffentlicht am 15.01.2016 Wir hatten ja bereits angekündigt, zur neuen REDAXO-Version auch eine neue Demo-Website zu erstellen, die REDAXO-Neulingen den Einstieg und den eher REDAXO-Erfahrenen den Umstieg erleichtern soll. Diese Demo ist nun fertig. http://www.redaxo.org/de/download/addons/?addon_id=1290 Sie ist als AddOn realisiert, so dass Ihr sie direkt über den Installer auswählen und installieren könnt. Einige AddOns wie zwei Editoren oder Yform sind als Pflicht-AddOns definiert, um das Prinzip der Editoren oder ein Beispiel-Formular zu zeigen. Wie hoffen, dass die mit einer Handvoll typischer Module ausgestattete Demo-Website hilfreich ist und einen guten Startpunkt für eigene Projekte bieten kann. Die Demo soll von Zeit zu Zeit erweitert werden, und eventuelle Fehler werden wir gern korrigieren. Übrigens: Wir haben die Demo nicht nur deswegen vom REDAXO-Download-Paket entkoppelt, um CMS und Demo leichter unabhängig voneinander aktualisieren zu können, sondern auch, weil es nicht die einzige Demo bleiben soll. Zu gegebener Zeit wird also vielleicht noch eine weitere Demo mit einem anderen Schwerpunkt erscheinen … oder vielleicht hat ja auch jemand von Euch Lust, eine Demo anzubieten? Demo-Website für REDAXO 5 Veröffentlicht am 15.01.2016 Wir hatten ja bereits angekündigt, zur neuen REDAXO-Version auch eine neue Demo-Website zu erstellen, die REDAXO-Neulingen den Einstieg und den eher REDAXO-Erfahrenen den Umstieg erleichtern soll. Diese Demo ist nun fertig. http://www.redaxo.org/de/download/addons/?addon_id=1290 Sie ist als AddOn realisiert, so dass Ihr sie direkt über den Installer auswählen und installieren könnt. Einige AddOns wie zwei Editoren oder Yform sind als Pflicht-AddOns definiert, um das Prinzip der Editoren oder ein Beispiel-Formular zu zeigen. Wie hoffen, dass die mit einer Handvoll typischer Module ausgestattete Demo-Website hilfreich ist und einen guten Startpunkt für eigene Projekte bieten kann. Die Demo soll von Zeit zu Zeit erweitert werden, und eventuelle Fehler werden wir gern korrigieren. Übrigens: Wir haben die Demo nicht nur deswegen vom REDAXO-Download-Paket entkoppelt, um CMS und Demo leichter unabhängig voneinander aktualisieren zu können, sondern auch, weil es nicht die einzige Demo bleiben soll. Zu gegebener Zeit wird also vielleicht noch eine weitere Demo mit einem anderen Schwerpunkt erscheinen … oder vielleicht hat ja auch jemand von Euch Lust, eine Demo anzubieten?"
