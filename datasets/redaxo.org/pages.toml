["https://redaxo.org/cms/news/redaxo-5.11-veroeffentlicht"]
title = "REDAXO 5.11 veröffentlicht / REDAXO Website"
full_description = "REDAXO 5.11 veröffentlichtGestern wurde REDAXO 5.11 veröffentlicht und bringt viele nützliche Features vor allem für Entwickelnde mit: Neue Methoden, Extension Points, Admin-Werkzeuge — und als Besonderheit das neue Debug-AddOn! Besonderheiten dieses Releases: Neues Debug-AddOn, um Frontend-/Backend-/Console-Aufrufe besser analysieren zu können bzgl. Performance, Datenbankabfragen, Extension Points und mehr, basierend auf Clockwork Umgang mit Passwörtern verbessert: Passwortregeln erweitert, Admins können Passwortwechsel von Nutzern verlangen. Editoren: JSON-Schema-Dateien ergänzt zur Validierung und Autovervollständigung, Editor-Einstellungen können bei Bedarf im Client gespeichert werden. Konsole: Neuer Command package:list zur Auflistung von AddOns. Medienpool: Neuer Extension Point MEDIA_ADD, über den neue Medien vor dem Speichern weiter validiert werden können. PHPMailer: Es kann eine E-Mailadresse angegeben werden, an die der gesamte E-Mailversand umgeleitet wird. Structure: Neue Methoden getClosest und getClosestValue für Abfragen vom Element ausgehend den ParentTree aufwärts, sowie isOnlineIncludingParents. Performance-Optimierung, Code-Stabilität durch statische Code-Analyse verbessert. Alle Infos bei Github Das vollständige Changelog auf GitHub Fehler melden und Verbesserungen einreichen auf GitHub Feature: Das neue Debug-AddOn! Mit REDAXO 5.11 wird erstmalig das Debug-AddOn veröffentlicht. Es basiert auf Clockwork und ermöglicht Developern tiefe Einblicke in die Laufzeitumgebung des Systems. Was passiert also bei einer Anfrage aus dem Frontend oder aus dem Backend oder innerhalb der Konsole? Welche Requests an die Datenbank werden gestellt? Wie ist die Performance? Welche Extension Points werden aufgerufen? Das und vieles mehr ist sehr hilfreich, wenn es darum geht, das System zu verstehen und technisch zu optimieren. Marcel hat das Debug-AddOn innerhalb der REDAXO Hours vorgestellt, und ihr könnt euch das Video hier anschauen: Link zum Video bei YouTube. Es wurde allerdings noch nicht geschnitten und startet erst bei 9:50. Ab 9:50: Whoops und Ooops Ab 24:22: Vorstellung des Debug-AddOns Feature: Admins können Passwortwechsel von Nutzern verlangen In manchen Situationen wird es notwendig, dass registrierte Nutzer des Systems ihre Passwörter ändern. Etwa dann, wenn die Passwort-Regeln angepasst worden sind. Oder wenn du eine Migration aus einer anderen REDAXO-Installation vorgenommen hast und sicherstellen möchtest, dass die Zugangsdaten der Nutzer den neuen Anforderungen entsprechen. Aktivierst du die Checkbox »Passwort muss nach Login ausgetauscht werden«, passiert genau das: Meldet sich die zugehörige Person das nächste Mal im REDAXO an, wird zuerst die Profilseite aufgerufen, und die Person kann erst dann wieder im System arbeiten, wenn sie ein neues Passwort festgelegt hat, das den Regeln entspricht. Feature: E-Mailversand an eine Adresse umleiten Während der Entwicklung eines Projekts kann es sehr nützlich sein, alle ausgehenden Mails des Systems zur Kontrolle abzufangen oder an eine bestimmte E-Mailadresse umzuleiten. Letzteres ist nun auf einfache Weise und ohne zusätzliche Werkzeuge direkt in REDAXO möglich:"
