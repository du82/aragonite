title = "AddOns / REDAXO Website"
full_description = "AddOn Kategorie Alle KategorienAuswertungen / Counter / Statistik 43Backendanpassungen 104Community / Multiuser 18Datenbanken 66Entwickler 94Ersetzungen 29Framework 23Multimedia 43Sicherheit 22Sonstiges 238Sprachen 12URL / SEO 41 suchen Automatisiertes Löschen von Datensätzen Beschreibung Unterstützung bei der DSGVO-konformen Umsetzung von Websites, indem Logs und Daten nach festgelegten Regeln gelöscht werden. 👶🏻 Kinderleicht einzurichten. ✅ Im Produktiveinsatz. www.alexplus.de/redaxo-addons Umsetzung Alexander Walther - alex+ Digitales Marketing zum Profil Innsbrucker Str. 2 74072 Heilbronn www.alexplus.de/redaxo-addons Versionen 1.0.2 Für REDAXO ^5.13 Veröffentlicht am 11.02.2024 Require / PHP >7.3,<9 Nur eine Ergänzung der Feldbeschreibung im Table Manager in der Feldauswahl. Full Changelog: https://github.com/alexplusde/auto_delete/compare/1.0.1...1.0.2 Unterstützung bei der DSGVO-konformen Umsetzung von ein oder mehreren REDAXO-Websites, indem Logs und Daten nach festgelegten Regeln gelöscht werden. Features YForm-Feld datestamp_auto_delete Ein Feld für YForm, das wie datestamp beim Erstellen oder Updaten eines Datensatzes einen Zeitstempel in der Zukunft erzeugt, der als Referenz für den passenden Lösch-Cronjob herangezogen wird. Liste der möglichen Offset-Parameter in den PHP-Docs Cronjob yform_auto_delete Das passende Gegenstück zu datestamp_auto_delete für YForm. Durchsucht alle in YForm verwalteten Tabellen nach dem Feld datestamp_auto_delete und löscht den Datensatz auf Basis von YOrm unter Berücksichtigung der jeweiligen Extension Points. Cronjob folder_auto_delete Durchsucht ein angegebenes Verzeichnis nach Daten, die älterer sind als ein gewünschter Zeitpunkt und löscht diese. Vergleichbar mit dem von REDAXO mitgeliefertem Cronjob für PHPMailer-Logs oder Datenbank-Sicherungen, jedoch für ein frei wählbares Verzeichnis. Z.B. Ordner, in die der Nutzer über YForm im Frontend Daten hochlädt, denkbar bei Bewerberformularen. Vorsicht: Falsch angegebene Pfade können zu ungewolltem Datenverlust führen. Bitte die Pfadangaben vorher überprüfen. Cronjob table_auto_delete Hinweis: nur empfohlen für Tabellen, die nicht in YForm verwaltet werden. Ein Cronjob, der ein beliebiges Feld einer beliebigen Tabelle heranzieht (z.B. updatedate) und nach einem festgelegten Zeitabstand, z.B. + 3 months die Daten darin löscht. Full Changelog: https://github.com/alexplusde/auto_delete/compare/0.3-dev...1.0-alpha1 herunterladen"
