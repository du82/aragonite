["https://redaxo.org/cms/news/redaxo-5.8-veroeffentlicht"]
title = "News / REDAXO Website"
full_description = "REDAXO 5.8 veröffentlicht Veröffentlicht am 20.08.2019 REDAXO beendet die „PHP 5-Ära”: Mit der Veröffentlichung von REDAXO 5.8 endet die Unterstützung für PHP 5. Die neue Version ist für PHP ab Version 7.1.3 optimiert. Zusätzlich wurden einige Bugfixes, Performance-Optimierungen und Detailverbesserungen durchgeführt. Das Update erfolgt über den Installer. Das Release steht im Download-Bereich zur Verfügung. Für die aktuelle Version wird folgende Umgebung benötigt: - PHP min. Version: 7.1.3 - MySQL ab Version 5.5 oder MariaDB ab Version 10.0 Eine Übersicht der vollständigen Neuerungen findet Ihr hier: https://github.com/redaxo/redaxo/releases/tag/5.8.0 REDAXO 5.8 veröffentlicht Veröffentlicht am 20.08.2019 REDAXO beendet die „PHP 5-Ära”: Mit der Veröffentlichung von REDAXO 5.8 endet die Unterstützung für PHP 5. Die neue Version ist für PHP ab Version 7.1.3 optimiert. Zusätzlich wurden einige Bugfixes, Performance-Optimierungen und Detailverbesserungen durchgeführt. Das Update erfolgt über den Installer. Das Release steht im Download-Bereich zur Verfügung. Für die aktuelle Version wird folgende Umgebung benötigt: - PHP min. Version: 7.1.3 - MySQL ab Version 5.5 oder MariaDB ab Version 10.0 Eine Übersicht der vollständigen Neuerungen findet Ihr hier: https://github.com/redaxo/redaxo/releases/tag/5.8.0"
