title = "News / REDAXO Website"
full_description = "Die finale Version von Redaxo 5 ist veröffentlicht! Veröffentlicht am 12.01.2016 Lange musstest Ihr darauf warten, nun ist es soweit: Wir haben heute die finale Version von Redaxo 5 veröffentlicht. In Kürze die Neuerungen … http://www.redaxo.org/files/redaxo_5.0.0.zip In Kürze die Neuerungen: Der Quellcode wurde komplett auf eine moderne Technik umgebaut. REDAXO 5.0 wird daher nur ab PHP Version 5.5 und mit MySQL ab Version 5.0 laufen und ausschließlich mit dem utf8-Zeichensatz. Die Dateistruktur hat sich ebenfalls erheblich geändert., z.B. die Art der Benennung – dafür ist alles nun einheitlich und konstant. Viele der Optimierungen lassen sich schwer in Kürze benennen, werden sich aber bei der täglichen Arbeit mit REDAXO positiv bemerkbar machen. Um insgesamt einen besseren Überblick zu behalten und eine bessere Updatefähigkeit zu schaffen, haben wir alle Bereiche, die bisher im Core waren, aufgeschlüsselt. Es gibt nun also AddOns wie “structure”, (das auch die Funktionen “content” und “templates” enthält), “mediapool”, “user”, etc. Das heißt: Auch diese Teilbereiche wird man nun einzeln updaten können. Das wird auch deswegen besser funktionieren, weil Einstellungen, lokale Dateien und Quellcode eine Struktur von REDAXO bekommen. Hier noch einige weitere Stichpunkte: Die Mehrsprachigkeit wurde verbessert. Es wird nur noch ausschließlich UTF-8 verwendet. Die Benutzerverwaltung hat nun Rollen/Gruppen. Konfigurationen sind über .yml-Dateien steuerbar. Die Installation von AddOns und Plugins haben wir verbessert. Abhängigkeiten können geprüft und eingetragen werden. Beim Laden werden diese Abhängigkeiten beachtet. Man kann aus dem Backend heraus AddOn-Updates und -Installationen durchführen, ja sogar auch Core-Updates. Der Abgleich erfolgt über redaxo.org. Über das Installer-AddOn könnt Ihr auch eigene AddOns auf redaxo.org aktualisieren, nachdem der korrekte API-Key hinterlegt wurde. In Fehlermeldungen werden nun die betreffende Datei und Zeile geliefert, z.B.: “rex://template/5 – Fehler in Zeile 6” Die Dateistruktur wurde umgebaut, um einheitlich und updatefähig zu sein. Es gibt ein neues Backend-Design. Es kann sein, dass sich eingefleischte REDAXO-Kenner nicht sofort zurechtfinden. Insgesamt sind aber Benennungen und die Anwendung von Funktionen und Klassen einfacher und selbsterklärender. Hier findet Ihr eine Übersichtsliste der geänderten Benennungen und Aufrufe: https://github.com/redaxo/redaxo/wiki/Aenderungen-in-REDAXO-5 Die Dokumentation zu REDAXO 5 (an der kontinuierlich weiter gearbeitet wird und wo immer Hilfe benötigt wird), findet Ihr hier: http://book.redaxo.org/5.0/manual/ In Kürze wird auch eine Demo-Website für REDAXO 5 zum Download bereitstehen, wo Ihr sehen könnt, wie man mit der aktuellen Version arbeiten kann. Die grundlegende Arbeit (Erstellen von Modulen und Templates) ist im Wesentlichen gleich geblieben, bzw. diese Anpassungen können relativ rasch vorgenommen werden. Bei der Entwicklung von AddOns hat sich dagegen mehr verändert; hier müssen wir (auch wenn die wichtigsten AddOns wie z.B. Yform, Yrewrite und verschiedene Editoren schon für REDAXO bereitstehen) noch alle gemeinsam an weiteren AddOn-Updates arbeiten. Unsere nächsten Baustellen werden eine Überarbeitung und Erweiterung der Struktur und des Medienpools sein. Und natürlich arbeiten wir an einer Aktualisierung des Community-AddOns, das zum Erstellen von Loginbereichen und Community-Funktionen (Kommentare, Forum, Newsletter, etc.) dient. Dennoch kann man nun bereits mit Version 5 produktiv arbeiten, wir selbst bauen auch schon die ersten Websites mit REDAXO 5. Wie immer: Wir freuen uns über Kommentare und Anregungen, z.B. im Forum: http://www.redaxo.org/de/forum/ Bugs bitte am besten direkt in Github posten: https://github.com/redaxo/redaxo/issues Und nun lassen wir erstmal die Sektkorken knallen … Liebe Grüße, das REDAXO-Team."
