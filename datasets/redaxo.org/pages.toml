["https://redaxo.org/cms/news/redaxo-5.12-veroeffentlicht"]
title = "REDAXO 5.12 veröffentlicht / REDAXO Website"
full_description = "REDAXO 5.12 veröffentlichtAm 3. März wurde REDAXO 5.12 veröffentlicht. Es enthält zahlreiche Verbesserungen hinsichtlich des User Interfaces und der Bedienung des Systems, und wir wünschen uns, diese Themen in den kommenden Releases noch weiter voranzutreiben! Aber auch technisch wurde intensiv an der Funktionalität gearbeitet, so dass dieses Release sehr umfangreich geworden ist und viel Wert auf Qualität legt. Besonderheiten dieses Releases: UI- und UX-Optimierung an zahlreichen Stellen Neue Login-Seite, die individualisiert werden kann Der Setup-Prozess lässt sich nun im laufenden Betrieb ausführen, ohne die Website in den Wartungsmodus setzen zu müssen. Der Installer steht nun auch im Safe-Mode zur Verfügung, um Updates zu installieren. Das Changelog von AddOns kann eingesehen werden, sofern verfügbar. Formulare können aus Textfeldern heraus per Strg/Cmd + Enter abgesendet werden. Media Manager mit neuem Effekt image_format, über den das Bildformat geändert werden kann (JPG, PNG, GIF, WEBP) Mit dem neuen Button »Report a bug« kann auf der Whoops-Seite ein GitHub-Issue angelegt werden, das alle wichtigen Infos bereits vorausgefüllt enthält. Structure-AddOn mit neuem EP SLICE_MENU, Fehlerbehandlung mittels rex_article_not_found_exception, Paginierung mit rows_per_page und weiteren Verbesserungen Debug-AddOn aktualisiert (Clockwork 5) und verbessert Install-AddOn an vielen Stellen verbessert Backup-Prozess beim Export und Import verbessert, vor allem im Umgang mit großen Datenmengen Code-Stabilität durch statische Code-Analyse verbessert Neue PHP-Mindestversion 7.3 Alle Infos bei Github Das vollständige Changelog auf GitHub Fehler melden und Verbesserungen einreichen auf GitHub Aktuelle Dokumentation Dokumentation für REDAXO 5.12 Neue Login-Seite Die Login-Seite ist für viele Nutzer vermutlich die erste Begegnung mit REDAXO, deshalb haben wir uns Mühe gegeben, einen guten Eindruck zu hinterlassen. Im Hintergrund liegt nun ein vollflächiges Bild, und die Formularelemente im Login-Kasten wurden im Detail überarbeitet. Die Seite lässt sich zudem sehr einfach individualisieren, um z. B. in Kundenprojekten auf das Corporate Design einzugehen. Eine Anleitung dazu findet ihr in der bereits aktualisierten Dokumentation im Bereich Fragmente. UI- und UX-Optimierung REDAXO 5.12 enthält zahlreiche Verbesserungen hinsichtlich des User Interfaces und der Bedienung des Systems, unter anderem diese: Navigation und Typographie Die Navigation wurde neu gestaltet. Die Navigationselemente nehmen nun die gesamte Spaltenbreite ein und die Icons wurden sauber ausgerichtet. Statt der Lucida Grande, die etwas in die Jahre gekommen ist und typografisch nicht immer geschickt steht, wird nun die Systemschrift verwendet. Die steht zwar oftmals auch nicht perfekt, aber sie sorgt für ein »nativeres« Gefühl bei der Benutzung von REDAXO. Das Herz neben dem Logo zeigt an, wenn der Debug-Modus aktiv ist. Damit es zukünftig besser auffällt, pulsiert es nun! Große Klickflächen und visuelle Hinweise An hunderten Stellen innerhalb des Systems haben wir die Klickflächen von Links und Buttons um das 2- bis 3-fache vergrößert, so dass sie merklich einfacher zu treffen sind als vorher. Das fällt vermutlich kaum auf, fühlt sich aber besser an. Ordner-Symbole weisen darauf hin, wenn ein Ordner außer dem obligatorischen Startartikel noch weitere Inhalte enthält. Dann nämlich ist das Symbol ausgefüllt. Flaches Design An vielen Stellen ist REDAXO nun flacher geworden, oder auch: »flat«. Das zeigt sich zum Beispiel an den überarbeiteten Tabs. Wir wollen auch in den kommenden Releases immer mal wieder Komponenten überarbeiten und das Design des Systems weiterentwickeln. »Report a bug« Zu einer guten Nutzererfahrung gehört sicherlich auch, dass es im Falle eines Fehlers eine einfache Möglichkeit gibt, diesen zu melden. Zu diesem Zweck gibt es den neuen Button »Report a bug« oben rechts auf der Fehlerseite (Whoops), der beim Klick ein Issue bei GitHub öffnet. Dabei sind alle relevanten Informationen bereits vorausgefüllt. Sehr praktisch sowohl für Nutzer als auch für Entwickelnde!"
