["https://redaxo.org/cms/lieblinge"]
title = "Lieblinge / REDAXO Website"
full_description = 'Lieblinge Hast Du eine Website mit REDAXO erstellt, die sich als Liebling eignen würde? Sie sollte optisch erstklassig sein und auch möglichst technisch interessant. Dann schreibe uns gern eine Mail an lieblinge@redaxo.org 2024 ansehen Fertiggaragen aus Beton Ob Einzelgarage, Großraumgarage, Doppelgarage, Reihengarage oder individuell geplantes Raummodul - das Unternehmen begleiten Sie von der ersten Planung bis zur schlüsselfertigen Übergabe der Fertiggaragen. Technik: Tailwind.css, Alpine.js, REDAXO 5, Addons: Developer, Theme, Focuspoint, Gridblock, MForm und viele andere. ansehen hoerakustiker.jobs Ein Job- und Newsportal die Hörakustikbranche. Für diese Seite wurde eine recht umfangreiche Jobverwaltung entwickelt. Technik: Tailwind.css, Alpine.js, REDAXO 5, Addons: Selbst entwickelte Job- und Newsverwaltung, Developer, Theme, Focuspoint, Gridblock, MForm und viele andere. ansehen Nordland Tours Eine Reisevermittlung für West Kanada Reisen, Yukon & Alaska Reisen und Wohnmobile. Technik: Tailwind.css, Alpine.js, REDAXO 5, Addons: Selbst entwickelte Reise- und Wohnmobilverwaltung, Developer, Theme, Focuspoint, Gridblock, MForm, PDFout und viele andere. ansehen REDAXO AddOn: Hörtest Hier geht es einmal nicht um eine Webseite sondern um die Vorstellung eines AddOns. Für REDAXO wurde ein "Hörtest" AddOn entwickelt welches einfach in jede Seite eingebunden werden kann. Die selbstverständlich responsive Ausgabe ist komplett individuell einstellbar. Alle Texte, Bilder und Audiodateien lassen sich komfortabel im REDAXO Backend verwalten. Der Betreiber der Webseite erhält ausserdem aussagekräftige Statistiken über die Nutzung des Hörtests. Technik: Tailwind.css, Alpine.js, REDAXO 5, YForm, YOrm usw... ansehen neulandbuch Neulandbuch versteht sich als Spielwiese für eigene Projekte des Bremer Designers Arne Olsen. Kleine Bücher, eigentlich für Freunde und Geschäftspartner entwickelt, die dann aber doch den Weg in ausgewählte Buchhandlungen gefunden haben. Der 3D Slider sowie alle Bücher sind komplett mit yForm pflegbar. Der Slider baut aus dem Cover des Buches automatisch das 3D-Model. Die dominante Farbe für den jeweiligen Hintergrund wird beim Speichern eines Buches auch automatisch erkannt, so dass der Kunde möglichst wenig Aufwand hat. Technik: REDAXO 5, React, Three.js, individuell programmiertes Bestellsystem ansehen DESMA Schuhmaschinen GmbH DESMA liefert effiziente und ökonomische Fertigungssysteme für Schuhhersteller auf der ganzen Welt. Eine umfangreiche Seite in 3 Sprachen (deutsch/englisch/chinesisch), welche auf zwei Domains aufgeteilt sind. Technik: REDAXO 5, Vanilla JS, yForm, yOrm, mForm, mBlock uvm. ansehen Kosmos Arp digital Die Online-Sammlung »Kosmos Arp digital« erweitert das Angebot der digitalen Kunstvermittlung vom Arp Museum Bahnhof Rolandseck. Die Anwendung bietet Zugang zu den Werken von Hans Arp und Sophie Taeuber-Arp und ermöglicht so eine jederzeit und von überall aus zugängliche Teilhabe an diesem wertvollen Kulturgut. Aktuell 187 Werke umfasst die Online-Sammlung, zu denen Gemälde, Zeichnungen, Collagen, Reliefs, Skulpturen, Wandteppiche und Perlenwebarbeiten zählen, die bedarfsgerecht in den digitalen Raum überführt wurden — ein Prozess des Sichtbarmachens, der aufgrund der vielschichtigen Datenerfassung noch in die Zukunft reichen wird. Technik: REDAXO 5, UiKit3, Addons: AccessDenied, Bloecks, Developer, FocusPoint, MForm, MBlock, search_it, Sprog, Theme, YForm, YForm Usability, YRewrite ansehen Hessische Arbeitsgemeinschaft für Gesundheitsförderung e. V. Die HAGE – Hessische Arbeitsgemeinschaft für Gesundheitsförderung e. V. macht sich stark für die Gesundheitsförderung und Prävention in Hessen. Sie verbindet Akteur*innen und Aktivitäten aus allen Bereichen und Arbeitsfeldern, die sich mit Gesundheitsförderung und Prävention beschäftigen. Technik: Uikit3, REDAXO 5, Addons: for_sa11y, YForm, a11y_docs, plyr, filepond_uploader, Focuspoint, Gridblock, MForm und viele andere. ansehen Innovate-Hessen Die Plattform richtet den Blick auf Hessen als Innovations- und Forschungsstandort. Protagonisten sind kleine und mittelständische Unternehmen, die – mit Mut, Expertise und Leidenschaft – ihre Vision von einer besseren Zukunft „made in Hessen“ umsetzen. Durch multimediales Storytelling und abwechslungsreiche Formate werden zentrale und aktuelle Themen wie Künstliche Intelligenz, Nachhaltigkeit und digitale Transformation verständlich und inspirierend aufbereitet. Technik: REDAXO 5, UiKit3, Addons: AccessDenied, Bloecks, Cropper, Developer, FocusPoint, MForm, MBlock, Sprog, Theme, YForm, YForm Usability, YRewrite ansehen Florian Schroeder Seit mehr als 20 Jahren ist Florian Schroeder mit seinen Bühnenprogrammen auf Tour und steht als ARD-Moderator regelmäßig vor der Kamera. Er hat mehrere Bücher veröffentlicht, darunter den Bestseller ›Schluss mit der Meinungsfreiheit!‹ und sein aktuelles Buch ›Unter Wahnsinnigen – Warum wir das Böse brauchen‹. Er ist zu einem wichtigen Meinungsbildner geworden und ist ein gefragter Gast in Talkshows und Diskussionsrunden. Zudem hört man ihn mit seinen Kolumnen und Podcasts regelmäßig im Radio und sämtlichen Audio-Portalen. Technik: REDAXO 5, UiKit3, Addons: AccessDenied, Bloecks, Cropper, Developer, FocusPoint, MForm, MBlock, Sprog, Theme, YForm, YForm Usability, YRewrite ansehen Nachfolge-Check Der Nachfolge-Check des Landes Hessens ist ein kostenloser Selbsttest für potenzielle Übernehmer oder Übergeber eines Unternehmens. Der Check gibt einen Überblick über wichtige Themen, die bei einer Nachfolgeplanung zu berücksichtigen sind, und enthält wertvolle Handlungsempfehlungen für die nächsten Schritte. Technik: REDAXO 5, UiKit3, Addons: AccessDenied, Bloecks, Developer, FocusPoint, MForm, MBlock, pdfout, Sprog, Theme, YForm, YRewrite 2023 ansehen Moers Festival Das Moers Festival in Moers am Niederrhein wurde 1972 als New Jazz Festival aus der Taufe gehoben. Seitdem gehört das international angesehene Musikfest zum festen Programm in der Stadt. In Moers traten unter anderem Lester Bowie, Fred Frith, Jan Garbarek, Herbie Hancock, Abdullah Ibrahim, David Murray, Sun Ra, Archie Shepp und Cecil Taylor auf. Technik: REDAXO 5, ganz viel YORM, mehrsprachig ansehen Frank Schemmann Der weltweit aktive Visual Artist Frank Schemmann aus Berlin / Moers präsentiert seine Werke und Projekte aus den Bereichen Foto, Jazz und Moving Images. Videos und dazugehörige Vorschaubilder werden aus Vimeo lokal gezogen und so DSGVO-konform ausgeliefert. Technik: REDAXO 5, YForm, UiKit3, FFMPEG-Videoconverter-AddOn, KLXM Vimeo-Catch. ansehen LOST Architekten Firmen Webseite für LOST Architekten aus Basel. Intro SVG-Animation, Weichzeichnungseffekte und Scroll-Animationen, Projekt- und Werklistenverwaltung über yform und Table Manager, Projekte können im Backend über Drag&Drop sortiert und frei auf Spalten eingeteilt werden. Technik: REDAXO 5, Addons: Article Presets, Bloecks, Cropper, Developer, Focuspoint, Hyphenator, Massif Minify, Mblock, Mform, Plyr, Uploader, URL, Yform, Yrewrite ansehen Ökoplan Essen Das Umwelt-Planungsbüro präsentiert seine Projekte in einer für die Branche ungewöhnlichen Weise: Die Projekte werden aus der Projektdatenbank per Zufall immer wieder neu gemischt ausgegeben. Bei der Suche nach Stichwort werden nicht nur die zugehörigen Projekte, sondern auch die verknüpfenden Stichworte angezeigt. Technik: REDAXO 5, AddOns: developer, Search it, YForm, Yrewrite ansehen Selbsthilfebüro Karlsruhe Das Selbsthilfebüro Karlsruhe ist die zentrale Informations- und Beratungsstelle für Selbsthilfe im Stadt- und Landkreis Karlsruhe. Es ist aktuell zuständig für mehr als 150 Selbsthilfegruppen. Technik: REDAXO 5, YForm, YCom, YRewrite, URL, Addon zur Verwaltung der Selbsthilfegruppen und Themen auf Basis von YOrm, automatisierte E-Mails, YDeploy. ansehen Blasmusik4u – Infoportal für die Blasmusik in Bayern Blasmusik4u ist eine Initiative des Bayerischen Blasmusikverbandes e.V. und seiner Mitgliedsverbände. Bayernweit können die Musikvereine nach Angeboten, Veranstaltung und Instrumentalunterricht durchsucht werden (inkl. Umkreissuche). Als Datenquelle dient die API der Vereinsverwaltung des Nordbayerischer Musikbund e.V.. Außerdem wird für jeden Verein automatisch eine "Mini-Homepage" erzeugt, die bei Bedarf mit einer eigenen Domin verbunden werden kann. Die komplette Adminstration erfolgt dann über die Vereinsverwaltungs-Software des Nordbayerischer Musikbund e.V. Technik: REDAXO 5, Uikit 3, React JS, Addons: BlÖcks, Cache Warmup, MForm, MBlock, Plyr, SEO Checkup, Theme, YForm, YRewrite, YRewrite Domain-Settings ansehen Empathie-Werkstatt Die Empathie-Werkstatt hilft, mit Hilfe von Gewaltfreier Kommunikation nach Marshall B. Rosenberg Konflikte zu lösen und Brücken zu bauen. Rosenberg betonte die Dringlichkeit zum sozialen Wandel für unsere Gesellschaft. Über einen kleinen Shop werden eigene Produkte verkauft. Technik: Redaxo 5, AddOns u.a.: Flexshop, GlobalSettings, MForm, MBlock, YForm, YRewrite, Theme, Newsverwaltung und Blog auf YForm-Basis ansehen Diener Coach Webseite für den Führungs-Coach Fredy Diener. Handgezeichnete Illustrationen werden mit SVG Scroll-Animation über gesamte One-Page Webseite kombiniert. Redaxo-Artikel können als Modal geladen werden. Technik: REDAXO 5, Addons: Bloecks , Cropper, Developer, Focuspoint, Hyphenator, Massif Minify, Mblock, Mform, Sprog, Uploader, YRewrite ansehen Stadtmuseum & Stadtbibliothek Riesa Das Stadtmuseum Riesa ist der zentrale Anlaufpunkt für die Geschichte der Stadt Riesa. Im gleichen Haus ist auch die Stadtbibliothek zu finden, welche Treffpunkt für Groß und Klein ist, um dem Wissensdurst und der Kreativität einen Raum zu geben. Technik: REDAXO 5, Gridblock, YRewrite, forCal, MBlock, NavBuilder, Multi-Site-Installation, Inhalte mittels Gridblock ansehen Selbsthilfekoordination Bayern SeKo Bayern ist eine Einrichtung zur landesweiten Vernetzung und Unterstützung der Selbsthilfe im Gesundheits- und Sozialbereich. Sie richtet sich an Mitarbeiter*innen von Selbsthilfekontaktstellen und anderen selbsthilfeunterstützenden Einrichtungen in Bayern, so wie an Aktive in Selbsthilfeorganisationen und Professionelle aus dem Gesundheits- und Sozialbereich in Bayern. Selbsthilfekontaktstellen & Selbsthilfeunterstützer können nach Themen gesucht werden. Technik: REDAXO 5, Anbindung einer externen Datenbankanwendung, Uikit 3, Addons: BlÖcks, Access denied, MForm, MBlock, Plyr, Search it, Structure Tweaks, Theme, Xoutput Filter, YCom, YForm, YRewrite 2022 ansehen WBZ Ingelheim Das WBZ Ingelheim ist eine Einrichtung der Jugend- und Erwachsenenbildung mit vier verschiedenen Bereichen, die in einer Website vereint sind. Jeder Bereich hat eigene technisch-strukturelle Anforderungen. In der Musikschule müssen Lehrer/Dozenten mit Kursen/Instrumenten verknüpft werden, bei der Friedjof-Nansen-Akademie werden redaktionelle Inhalte mit externen Daten verknüpft, die VHS ist mit dem Verwaltungsprogramm Kufer verzahnt (Import der Kurse und Export der Anmeldungen). Technik: Frontend: UIkit | Backend: REDAXO 5, Consent-Manager, Developer, mForm, MBlock, Theme, TinyMce4, Sprog, Yrewrite, url, Search-it, rex_vhs ansehen DIGI-Check für Unternehmen Der DIGI-Check ist eine Applikation, mit der Unternehmen spezifische Fragen zum Stand ihrer Digitalisierung beantworten können. Ergebnis ist eine detaillierte Auswertung mit konkreten Handlungsempfehlungen, Praxistipps und individuellen Kontaktmöglichkeiten. Die Auswertung kann auch als PDF-Dokument heruntergeladen werden. Der DIGI-Check ist anonym und ohne Login nutzbar. Über einen für jeden Check generierten Schlüssel kann der DIGI-Check jederzeit auch auf einem anderen System fortgesetzt oder wieder aufgerufen werden. Im Backend steht eine umfangreiche statistische Auswertungsmöglichkeit mit Exportfunktionalität zur Verfügung. Der DIGI-Check ist ein Projekt der Hessen Trade & Invest GmbH. Umsetzung: yform zur redaktionellen Pflege der Fragen, Antworten und Auswertungen mit be_relation Tabellen über drei Ebenen. Technik: Frontend: UIkit | Backend: REDAXO 5, Consent-Manager, Developer, mForm, MBlock, Theme, TinyMce4, Sprog, Yrewrite, pdfout ansehen Sachspenden-Addon Das AddOn bietet über eine Liste die Möglichkeit Spendenzusagen für benötigte Spenden zu tätigen und diese nach Produkt-Kategorie, Einrichtung oder Ähnliches zu listen. Personen können einfach auswählen was sie spenden möchten. Ein Opt-In stellt sicher, dass die Person verifiziert wird. Angegebene Mengen werden dann in der Übersicht reduziert. Da es auf YForm aufbaut, ist es leicht an den eigenen Bedarf und gewünschte Funktion anpassbar. Realisiert von Wolfgang Bund und KLXM Crossmedia für den AWO Kreisverband Wesel und CSE e.V. Essen. 2021 ansehen Tsurikrufn! Bewegende Porträts und facettenreiche Lebenswege – ein Online-Portal zum Erinnern an jüdische Persönlichkeiten in Deutschland. »Tsurikrufn« ist jiddisch und bedeutet »erinnern«. Anlässlich des Festjahres »1.700 Jahre jüdisches Leben in Deutschland« haben die AsKI-Mitglieds-Institute ihre Archive geöffnet und erzählen beeindruckende Geschichten jüdischer Persönlichkeiten und deren Beitrag für Deutschland. Dank vielfältiger Einstellmöglichkeiten im CMS können alle Porträts multimedial präsentiert, individuell farblich gestaltet und auf die jeweiligen Eigenheiten angepasst werden. Technik: Frontend: UIkit | Backend: REDAXO 5, Consent-Manager, Developer, mForm, MBlock, plyr, Theme, TinyMce4, Sprog, YRewrite ansehen Wir sind intensiv Das Universitätsklinikum Heidelberg hat eine Kampage zur Erhöhung der Bewerberzahlen im Bereich Pflegefachkräfte begonnen. Die zugehörige Landing Page unter dem Kampagnen-Motto "wir sind intensiv" wurde komplett neu erstellt. Sie soll den Anspruch und die Wertschätzung für den Beruf abbilden und mit Berichten, Videos und einer Podcast-Rubrik einen stärkeren Einblick in die Arbeits- und Lebenswelt der "Pflegenden" bieten. Technik: YForm, YRewrite, MBlock, Sprog, Redactor, Focuspoint, Consent Manager ansehen Kaltenbach GmbH + Co KG Kaltenbach entwickelt, produziert und vertreibt ein Komplett-Programm für die Metallbearbeitung. Heute sind über 120 000 Maschinen des Weltmarktführers im Einsatz. Technik: Der Relaunch der Webseite basiert auf aktuellem REDAXO 5, Community Addon, URL2 und div. weiteren. In den selbst entwickelten Addons werden Maschinen, Produktionslinien, Standorte, Mitarbeiter, ... verwaltet. URLs der Maschinen automatisch verkürzt und von Search it indexiert. ansehen Faust-Kultur faustkultur.de ist ein Onlineforum auf Non-Profit-Basis von und für Autoren, Künstler und Journalisten. Die in die Jahre gekommene auf REDAXO 4.X basierende Website wurde komplett neu entwickelt. Ein Schwerpunkt lag auf der leichten Verwaltung der vielen Beiträge, der Autoren und einem pflegbaren Kommentarsystem. Die in YForm verwalteten Inhalte werden dynamisch auf der Webseite "verteilt". Technik: REDAXO: 5.x, Addons: YForm, Search it, URL. Das Frontend basiert auf dem UIkit Framewo'
