["https://redaxo.org/doku/main/installation"]
title = "Installation / Doku / REDAXO Website"
full_description = '''Installation Vorbereitung Betrieb unter Apache Betrieb unter Nginx Datenbank Installation per Zip-File Download Upload Installation per REDAXO Loader Installationsvorgang Installation per Kommandozeile Docker Vorbereitung Die Systemanforderungen zum aktuellen Release und vorheriger Releases sind unter https://redaxo.org/download/core/ einsehbar. Einige Ordner müssen vor dem Zugriff von außen geschützt sein. Diese lauten: /redaxo/src, /redaxo/data, /redaxo/cache und /redaxo/bin. Das Vorgehen unterscheidet sich je Webserver-Typ und wird nachfolgend erklärt. Betrieb unter Apache Für Apache liefert REDAXO in den zuvor genannten Ordnern .htaccess-Dateien aus. Damit diese greifen, sollte Apache die Verwendung der .htaccess-Dateien in den Einstellungen des Webspaces erlauben (AllowOverride All). Betrieb unter Nginx Bei der Nutzung von REDAXO mit Nginx ist eine eigene Sicherheitskonfiguration notwendig, da die in REDAXO mitgelieferten .htaccess-Dateien hier nicht funktionieren. Es müssen das Directory-Listing deaktiviert und die Zugriffsberechtigungen für sensible Verzeichnisse korrekt gesetzt werden. Folgende Direktiven sorgen für eine Sperrung der Ordner und verhindern das Directory-Listing: autoindex off; location ^~ /redaxo/src { deny all; } location ^~ /redaxo/data { deny all; } location ^~ /redaxo/cache { deny all; } location ^~ /redaxo/bin { deny all; } NGINX-Konfiguration für YRewrite Eine vollständige nginx config für YRewrite. Hinweis für PLESK-Websites: Die Direktiven können unter Einstellungen für Apache & nginx der gewünschten Domain im Abschnitt Zusätzliche nginx-Anweisungen hinterlegt werden. charset utf-8; autoindex off; location / { try_files $uri $uri/ /index.php$is_args$args; } rewrite ^/sitemap\.xml$ /index.php?rex_yrewrite_func=sitemap last; rewrite ^/robots\.txt$ /index.php?rex_yrewrite_func=robots last; rewrite ^/media[0-9]*/imagetypes/([^/]*)/([^/]*) /index.php?rex_media_type=$1&rex_media_file=$2&$args; rewrite ^/media/([^/]*)/([^/]*) /index.php?rex_media_type=$1&rex_media_file=$2&$args; rewrite ^/media/(.*) /index.php?rex_media_type=yrewrite_default&rex_media_file=$1&$query_string; rewrite ^/images/([^/]*)/([^/]*) /index.php?rex_media_type=$1&rex_media_file=$2&$args; rewrite ^/imagetypes/([^/]*)/([^/]*) /index.php?rex_media_type=$1&rex_media_file=$2; # !!! WICHTIG !!! Falls Let's Encrypt fehlschlägt, diese Zeile auskommentieren (sollte jedoch funktionieren) location ~ /\. { deny all; } # Zugriff auf diese Verzeichnisse verbieten location ^~ /redaxo/src { deny all; } location ^~ /redaxo/data { deny all; } location ^~ /redaxo/cache { deny all; } location ^~ /redaxo/bin { deny all; } # In einigen Fällen könnte folgende Anweisung zusätlich sinnvoll sein. location ~ /\.(ttf|eot|woff|woff2)$ { add_header Access-Control-Allow-Origin *; expires 604800s; } Datenbank REDAXO benötigt eine leere MySQL- oder MariaDB-Datenbank für den Betrieb. Für die Installation werden die Zugangsdaten (Datenbank-Name, Adresse des Servers, Datenbank-Benutzer und Passwort) für diese Datenbank benötigt. Installation per Zip-File Kurzanleitung Eine MySQL-Datenbank erstellen und die Zugangsdaten notieren. Die neueste Version unter https://redaxo.org/download/core/ herunterladen. Die ZIP-Datei auf dem eigenen Rechner entpacken. Die entpackten Dateien in das Webverzeichnis hochladen und die Installation unter der Adresse der Website mit angehängtem /redaxo/ (http://deinedomain.tld/redaxo/) ausführen. Alle Installationsschritte durchgehen. Download Als Erstes die aktuelle Version von REDAXO unter https://redaxo.org/download/core/ herunterladen. Informationen zum aktuellen Release gibt es unter https://github.com/redaxo/redaxo/releases. Upload Das heruntergeladene Zip-File wird entpackt und der Inhalt in den Webordner des lokalen Servers oder via FTP, SFTP, WebDAV auf einen öffentlichen Webserver kopiert. Meist lautet der Webordner httpdocs , htdocs oder html. Bei Upload per FTP/SFTP: Die Transfer-Einstellungen des FTP-Programms sollten auf binary/binär eingestellt sein. Ausführliche Informationen zum Upload und zu den Zugangsdaten liefert der Hostingpartner. Tipp: Einige Hoster bieten zur Verwaltung des Webspaces auch Oberflächen wie Plesk oder cPanel an. Hier enthalten ist auch ein Dateimanager, mit dem die Zip-Datei direkt hochgeladen und auf dem Server entpackt werden kann. Hinweis für Mac und Linux-User: Die versteckten .htaccess-Dateien müssen unbedingt mit übertragen werden. In einigen FTP-Programmen müssen diese erst eingeblendet werden. Jetzt kann man den Installationsvorgang/Setup starten. Installation per REDAXO Loader Der REDAXO-Loader bietet einen vereinfachten Weg REDAXO auf einen Webspace zu kopieren. Nach Auswahl der gewünschten REDAXO-Version wird diese bei GitHub heruntergeladen, entpackt und der Installationsvorgang gestartet. Der Loader wird bei Erfolg automatisch vom Server gelöscht. Abruf über der Kommandozeile curl -JLO https://redaxo.org/loader Download des Loader per Browser redaxo-loader.php Anwendung redaxo_loader.php in den Webspace laden redaxo_loader.php im Browser aufrufen REDAXO Version auswählen Die erforderlichen Dateien werden auf den Server gespielt und der Installationsvorgang gestartet. Installationsvorgang Nachdem REDAXO hochgeladen wurde, kann die Installation mit http://deinedomain.tld/redaxo/ aufgerufen werden. Die folgenden sieben Schritte führen durch die Installation. Schritt 1: Sprachauswahl Im ersten Schritt wird die Sprache für den Installationsvorgang und für das Backend festgelegt. Hinweis : Die Sprache kann später im Setup oder für den User geändert werden. Schritt 2: Systemcheck An dieser Stelle führt die Installationsroutine einen Systemcheck durch und gibt ggf. Warnungen aus. Wenn etwas nicht stimmt, müssen eventuell auch die Systemvoraussetzungen überprüft werden. Systemcheck Hinweis bei Fehlermeldungen zu nicht geschützten Ordnern Bitte den Abschnitt Vorbereitung beachten und die Rechte entsprechend setzen. Schritt 3: Konfiguration An dieser Stelle wird die grundlegende Konfiguration durchgeführt. URL der Website mit abschließendem / (Slash) Name der Website E-Mail-Adressse bei Fehlern Zeitzone Datenbankverbindung Befindet sich die Datenbank auf dem lokalen Server, kann hier localhost stehen gelassen werden. Bei einigen Hostern sind der Webspace und die Datenbank voneinander getrennt. In diesem Fall muss hier die Adresse des Datenbankservers eingeben werden. Besitzt der Datenbank-User das Recht auch neue Datenbanken zu erstellen, so kann hier direkt eine neue Datenbank mit der oben angegebenen Bezeichnung anlegt werden. Schritt 3: Systemcheck Schritt 4: Datenbank Es muss eine der vier Optionen gewählt werden. Unterstützt der Datenbankserver utf8mb4, wird eine entsprechende Option zur Auswahl angeboten. Hinweis : Eine Aktualisierung von REDAXO-Versionen kleiner als 5 ist aktuell nicht vorgesehen. Schritt 4: Datenbank Schritt 5: Administrator Nun muss ein Username und ein sicheres Passwort für den Administrator der REDAXO-Installation definiert werden. Sichere Passwörter bestehen aus mindestens 8 Zeichen und beinhalten Groß- und Kleinbuchstaben sowie Sonderzeichen. Die Mindestlänge, Anzahl an Groß- und Kleinschreibung sowie die Mindestanzahl an Ziffern können in der Datei redaxo/data/core/config.yml im Bereich password_policy festgelegt werden. Die maximale Länge von 4096 Zeichen sollte nur mit Bedacht geändert werden. Für weiterführende Erläuterungen zur Passwortlänge siehe CVE-2013-5750. Für allgemeine Hinweise zur Länge und Komplexität von Passwörtern bitte auch die Hinweise des BSI beachten. Es sollte möglichst vermieden werden gänige Benutzernamen wie Admin oder Administrator zu verwenden; diese sind zu leicht zu erraten. Schritt 5: Administrator Schritt 6: Heureka Die Installation ist erfolgreich. Beachte die weiteren Hinweise auf der Seite. Die erste Anmeldung kann nun direkt über den Button Zum Login erfolgen. Alternativ kann auch /redaxo/ hinter die URL der Installation im Browser eingeben werden, um in das Backend zu gelangen. (Zum Beispiel www.domain.xy/redaxo) Schritt 6: Ende Nach der Installation: Es ist durchaus möglich, dass nach einem Release noch Updates nachgereicht werden. Daher sollte nach der Installation im Installer geprüft werden, ob Aktualisierungen vorliegen. Installation über die Kommandozeile (console) REDAXO kann über die Konsole redaxo/bin/console installiert werden. Hinweis: Es könnte erforderlich sein, dass der Aufruf der console unter dem gleichen User oder Gruppe erfolgt die auch später die Website ausführt. Meist ist dies der Ordnereigentümer des Webs oder die Gruppe des Webservers. Bei Aufruf der consolewird dies überprüft und ggf. darauf hingwiesen. Download und Entpacken Beispiel für REDAXO 5.15.1. Download per Curl. Download curl -JLO https://redaxo.org/download/redaxo/5.15.1.zip Entpacken unzip redaxo_5.15.1.zip Setup starten Die Konsole befindet sich im Ordner redaxo/bin Der Befehl lautet php console setup:run für den interaktiven Modus. Die Hilfe per php console setup:run --help liefert mögliche Optionen und Modi. u.a.: --quiet für eine Unterdrückung aller Ausgaben --no-interaction für keine Interaktion Die Optionen können kombiniert und so automatische Installationen realisiert werden. Siehe: Konsole Mit der REDAXO Konsole können viele gängige Operationen durchführt werden, wie z. B. Installation, setzen von Config-Settings, Installation / Deinstallation von AddOns (packages) Docker REDAXO lässt sich auch über Docker installieren und testen. Im Docker Hub werden von Friends Of REDAXO (FOR) verschiedene Images angeboten: Das REDAXO-Image liefert ein fertig installiertes CMS, ganz frisch und ohne Inhalte. Es steht in drei Varianten (Apache, FPM, Alpine) und für mehrere PHP-Versionen bereit. Eine Anleitung zur Installation ist enthalten. REDAXO im Docker Hub: https://hub.docker.com/r/friendsofredaxo/redaxo Wer REDAXO nicht leer, sondern mit Beispiel-Inhalten installieren möchte, greift zu den drei beliebten Website-Demos, die innerhalb der Community entwickelt worden sind, um typische Anwendungsfälle für REDAXO aufzuzeigen: Die Basis-Demo für Einsteiger, die Community-Demo zur Einrichtung geschützter Nutzerbereiche und die Onepage-Demo mit drei Ansätzen zur Erstellung einer Website. Website-Demos im Docker Hub: https://hub.docker.com/r/friendsofredaxo/demo Zur Einrichtung einer kompletten Entwicklungsumgebung für REDAXO bieten wir bei GitHub das Projekt »REDAXO mit Docker« an. Es führt Schritt für Schritt durch die Installation und liefert dabei nützliche Informationen. Deshalb eignet es sich hervorragend auch für den Einstieg ins Thema Docker. Anleitung bei GitHub: REDAXO mit Docker Artikel bearbeiten'''
