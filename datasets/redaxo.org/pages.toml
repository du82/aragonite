n eingehalten werden (z.B. Lizenz beilegen) Die Veröffentlichung eines AddOns erfolgt auf eigene Verantwortung (4.2) Das REDAXO-Team behält sich eine Löschung des AddOns vor. Auslöser für die Löschung können unter anderem sein: Das AddOn wurde für eine nicht mehr supportete REDAXO-Version entwickelt Rechte Dritter werden verletzt (z.B. es handelt sich um eine Raubkopie) Das AddOn beschädigt das REDAXO CMS oder AddOns anderer Es stellt Funktionalitäten bereit, die in gleicher Weise bereits Bestandteil des REDAXO CMS sind Der AddOn-Name oder -key verstoßen gegen Markenrechte Dritter 5. Nutzungsbdingungen für "Mein API-Key" (5.1) Folgende Regeln müssen eingehalten werden: Der API-Key ist als geheim anzusehen und sollte nicht an Dritte weitergegeben werden (5.2) Yakamara behält sich das Recht vor den API-Key zu entziehen, sollte gegen die in diesem Dokument genannten Nutzungsbedungen ein Verstoß vorliegen. 6. Beendigung der Teilnahme an MyREDAXO Unbeschadet der in Ziff. 3 genannten besonderen Kündigungsgründe sind Yakamara und der Nutzer berechtigt, jederzeit die Teilnahme an dan MyREDAXO zu kündigen. Im Fall der Kündigung werden die Beiträge und personenbezogenen Daten des Nutzers gelöscht und der Nutzer von der weiteren Teilnahme an an MyREDAXO ausgeschlossen. 7. Haftung der Yakamara 7.1 Yakamara ist es aufgrund der Vielfalt in MyREDAXO nicht möglich, die eingestellten Beiträge auf ihre Rechtmäßigkeit hin zu prüfen. Sämtliche in MyREDAXO eingestellten Inhalte sind ausschließlich als Beiträge der sie einstellenden oder versendenden Nutzer anzusehen. Yakamara haftet nicht für die von den Nutzern eingestellten Inhalte. 7.2 Yakamara haftet insbesondere auch nicht für Schäden, die durch Fehler, Verzögerungen oder Unterbrechungen in der Übermittlung, bei Störungen der technischen Anlagen und der redaxo Foren, unrichtige Inhalte, Verlust oder Löschung von Daten, Viren, Würmer oder in sonstiger Weise bei Nutzern entstehen können, es sei denn, dass solche Schäden von Yakamara,