["https://redaxo.org/support/weitere-ressourcen"]
title = "Ressourcen / REDAXO Website"
full_description = 'Ressourcen Mitarbeit Referenzen Dokumentation Friends of REDAXO REDAXO Tricks REDAXO-Tag Fehler gefunden? Git Issues Pull requests Eigene AddOns REDAXO Entwickler REDAXO bei Facebook Mitarbeit an REDAXO Werde Teil der Community Egal ob Redakteur, Website-Entwickler oder Agentur, jeder kann sich mit seinem Wissen und seinen Fragen an REDAXO beteiligen. Hierzu gibt es mehrere Kanäle. Für Fragen oder Diskussionen stehen der Slack-Channel und die GitHub Discussions zur Verfügung. Für die aktive Beteiligung an der Weiterentwicklung und Fehlerbereinigung des Systems und der AddOns bietet sich GitHub an. Wir freuen uns auf Eure Mitarbeit. Fehlermeldungen und Verbesserungswünsche nehmen wir gerne im Forum oder als GitHub-Issue entgegen. Hast Du ein eigenes AddOn entwickelt oder möchtest Du deine Werke in der Referenzliste bei REDAXO.org veröffentlichen, kannst Du das in MyREDAXO erledigen. Möchtest Du gerne in einem Team an einem AddOn arbeiten oder hast Du ein AddOn, dass Du gerne mit anderen weiter entwickeln möchtest, schließe Dich Friends of Redaxo (FOR) an. Referenzen Mit REDAXO erstellte Seiten können im Bereich Referenzen eingestellt werden. Dokumentation Mitarbeit im Bereich Dokumentation ist ausdrücklich erwünscht. Auch hier gibt es viele verschiedene Möglichkeiten. Wer etwas findet, was in der Dokumentation fehlt oder ungenau beschrieben ist, darf gerne Ergänzungen beitragen, zum Beispiel im GitHub-Repository der Doku. Friends of Redaxo (FOR) Friends of Redaxo ist eine Initiative von und für Entwickler, die eine offenere Zusammenarbeit anstreben. AddOns in diesem Bereich können grundsätzlich von jedem anderen FOR-Mitglied bearbeitet werden. FOR-Code wird immer unter der MIT-Lizenz veröffentlicht. Dennoch bleibt der Ersteller hauptverantwortlich für das AddOn, sofern er seine Verantwortlichkeit nicht abgeben möchte. Somit kann ein AddOn auch dann weiter gepflegt werden, wenn der Hauptentwickler das AddOn nicht mehr weiter entwickelt. AddOns, die im FOR-Bereich veröffentlicht werden, kann man als vollständige Spende eines Entwicklers an die Community betrachten. FOR-Addons auf GitHub FOR-Website REDAXO Tricks Diese Website sammelt Lösungen und hilfreiche Code-Beispiele, die es aus verschiedenen Gründen nicht in die REDAXO-Dokumentation geschafft haben. Hier sind sie genau richtig, denn sie werden von der Community bearbeitet und ergänzt. REDAXO-Tricks REDAXO-Tag / REXCamp Lerne das Team und weitere Entwickler kennen Die immer wieder stattfindenden REDAXO-Tage (oder auch neuerdings: REXCamps) bieten Dir die unheimlich tolle Erfahrung, die Entwickler hinter REDAXO und weitere Webentwickler kennenzulernen. Tutorials, nettes Beisammensein, Problemlösungen an einem Tag. Wir freuen uns, Dich kennenzulernen. Fehler gefunden? Bei Fehlern ist zunächst zu prüfen, ob es sich um Implementierungsfehler oder Fehler im Code handelt. In jedem Falle ist eine möglichst aussagekräftige Beschreibung des Fehlers für den Entwickler hilfreich, um das Phänomen nachzustellen und darauf zu reagieren. In eine Fehlerbeschreibung gehören immer folgende Angaben: Welche Bedienungsschritte führen zu dem Fehler? In welcher Umgebung (PHP Version, Webserver, Provider, lokales System) tritt der Fehler auf? Unter welchem Browser und in welcher Version des Browsers tritt der Fehler auf? Was wurde zuletzt am System verändert (z.B. Installation von AddOns)? Wie macht sich der Fehler bemerkbar? Die Fehlerbeschreibung kann um Errorlog-Meldungen ergänzt werden. Git Issues Der Core von REDAXO und die meisten AddOns werden als Git-Repositories gepflegt. Dort lassen sich Fehler oder Wünsche in "Issues" eintragen. Bevor ein Issue eingetragen wird, empfiehlt sich folgendes Vorgehen: Zunächst prüft man, ob man die aktuellste Version des AddOns aus dem Git-Repository im Einsatz hat. Anschließend prüft man, ob das Issue bereits eingetragen oder bearbeitet wurde. Eine kurze Nachfrage im Slack-Channel, ob das gewünschte Feature oder der gefundene Fehler sinnvoll als Issue erfasst werden sollte, kann die Recherche ergänzen. Anschließend erstellt man im entsprechenden Repository das Issue. Pull Requests Bei konkreten Codevorschlägen empfehlen sich "Pull Requests". Der Entwickler hat dann die Möglichkeit, den Code zu prüfen und direkt zu übernehmen. Eigene AddOns Ein eigenes AddOn zu erstellen ist immer eine Möglichkeit, sich aktiv an der REDAXO-Entwicklung zu beteiligen. Ist das AddOn für eine größere Anzahl von Anwendern von Interesse, kann dieses gern in den Downloadbereich eingestellt werden. REDAXO Entwickler Im Loginbereich MyRedaxo von REDAXO kann man sich selbst als REDAXO-Entwickler eintragen und wird dann auf der REDAXO-Website als Entwickler/Agentur gelistet. REDAXO bei Facebook REDAXO auf Facebook.'
