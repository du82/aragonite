["https://redaxo.org/support/haeufige-fragen"]
title = "Häufige Fragen / REDAXO Website"
full_description = 'Häufige Fragen Was ist das Besondere an REDAXO? Für welchen Einsatzzweck ist REDAXO geeignet? Welche Vorraussetzungen gibt es um REDAXO einzusetzen? Wieviel kostet eine REDAXO Lizenz? Warum gibt es kein Buch über READXO? Ich habe einen Fehler gefunden, eine Frage oder einen Wunsch Kann ich mitmachen? Ist REDAXO zukunftssicher? Was ist das Besondere an REDAXO? 100% Kontrolle über den Ausgabecode Backend individuell für die unterschiedlichsten Ansprüche anpassbar Große Webseiten / Datenmengen kein Problem Gute Verwaltung von mehrsprachigen Webseiten Multidomainfähig Einfache individuelle Erweiterbarkeit eine lebendige Entwicklergemeinde persönlicher Austausch mit den Entwicklern an den REDAXO-Tagen Für welche Einsatzzwecke ist REDAXO geeignet? Durch die Flexibilität gibt es wirklich kaum Grenzen. Einen Überblick, für welche Präsenzen REDAXO geeignet ist, bieten die Lieblinge und die Referenzen. Welche Vorraussetzungen gibt es, um REDAXO einzusetzen? Technische Anforderungen finden sich in der Doku Standard Hosting-Angebote sind üblicherweise ausreichend Mit wenig Grundwissen in HTML, PHP und CSS und dem Tutorial "REDAXO in 15 Minuten" lässt sich eine einfache Website erstellen Mit zunehmender Kenntnis der Materie kann man komplexere Aufgaben lösen Die Community hilft auch mal Fertige Themes und Vorlagen gibt es eigentlich nicht Wieviel kostet eine REDAXO Lizenz? REDAXO und die meisten AddOns unterliegen der MIT-Lizenz, die eine kostenfreie Nutzung, auch für gewerbliche Zwecke erlaubt. Warum gibt es kein Buch über REDAXO? Es wurde noch keines geschrieben. Ich habe einen Fehler gefunden, eine Frage oder einen Wunsch Über eine aktive Mithilfe freuen wir uns sehr! Eine aktive Mithilfe ist vielfältig möglich. Github, Slack - zur Übersicht der Ressourcen. Kann ich mitmachen? Ja. Jeder kann bei REDAXO mitmachen und ist willkommen, egal ob Anfänger oder Profi, ob Texter, Frontendentwickler oder PHP Profi. Ist REDAXO zukunftssicher? Die Anzahl der REDAXO-Installationen liegt bei über 60.000 (Stand 2017). REDAXO existiert seit 1999 und ist ein quelloffenes System, an dem viele Entwickler und AddOn Entwickler seit mehr als zehn Jahren kontinuierlich arbeiten. Mit REDAXO sind namhafte Webpräsenzen umgesetzt, die eine maximale Verfügbarkeit erfordern. Wir empfehlen für hochverfügbare Lösungen eine unabhängige Expertise erstellen zu lassen und REDAXO in die Auswahl einzubeziehen.'
