full_description = "AddOn Kategorie Alle KategorienAuswertungen / Counter / Statistik 43Backendanpassungen 104Community / Multiuser 18Datenbanken 66Entwickler 94Ersetzungen 29Framework 23Multimedia 43Sicherheit 22Sonstiges 238Sprachen 12URL / SEO 41 suchen Community-Demo für REDAXO 5 Beschreibung In dieser Demo kannst Du sehen, wie man mit dem Community-AddOn Loginbereiche erstellen kann, wo sich User registrieren und in geschützte Bereiche einloggen können. Folgende Funktionen sind in der Demo enthalten: Registrierung User können sich registrieren (Double-Opt-In) User können Gruppen zugewiesen werden. Diese Gruppen dienen zur Steuerung der Zugriffsrechte bei Kategorien. Passwort vergessen-Funktion Loginbereich Authentifizierung mit Loginname oder E-Mail und verschlüsseltem Passwort Rechte für Seiten und Kategorien können (auch rekursiv vererbend) definiert werden Jeder User kann seine Profildaten verändern einfache Beispiele für die Anzeige der neuesten User github.com/FriendsOfREDAXO/demo_community Umsetzung FriendsOfREDAXO Versionen 4.1.3 Für REDAXO >=5.9.0 Veröffentlicht am 14.01.2025 Require / PHP >=7.4, <8.3 Fixes yform_mediafile herunterladen 4.1.2 Für REDAXO >=5.9.0 Veröffentlicht am 16.07.2023 Require / PHP >=7.4, <8.3 4.1.2 – 16.07.2023 Neu Hinweis auf YRewrite / .htaccess beim Setup @Koala #40 lang-Datei erweitert Button zum direkten Aufruf des YRewrite-Setup update.php hinzugefügt, für Updates aus dem Installer Bugfixes Im Export der Tabellen waren Test-User zur Behebung der Sicherheitslücke enthalten, diese wurden auf der Startseite angezeigt. Test-User entfernt. Das Registrierungsformular stand noch auf Debug, Debug entfernt EMail-Templates angepasst bei den Links fehlte die Domain, rex::getServer() hinzugefügt @ischfr #36 Table-Export bereinigt neu erstellt @aeberhard New Contributors @Koala made their first contribution in https://github.com/FriendsOfREDAXO/demo_community/pull/40 Full Changelog: https://github.com/FriendsOfREDAXO/demo_community/compa