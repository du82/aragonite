title = "Dokumentation REDAXO 5.12 / Doku / REDAXO Website"
full_description = "Dokumentation REDAXO 5.12 Die REDAXO-Dokumentation ist der Startpunkt für die Installation und Redaktion einer REDAXO-Webpräsenz. Zudem finden Developer hier auch die erforderlichen Informationen zur Entwicklung eigener Lösungen. Wir freuen uns sehr über Mitarbeit bei der REDAXO-Dokumentation. Derzeit arbeiten Peter Bickel, Thomas Skerbis, Wolfgang Bund und Alexander Walther an der Dokumentation. Unterstützung wird immer benötigt; die Dokumentation wird in GitHub gepflegt und erweitert, sodass sich alle beteiligen können. Neue Artikel oder Verbesserungen können gerne per Pull-Request oder Issues eingereicht werden. Zur Dokumentation auf GitHub. Neues in dieser Doku Der neue Login-Screen lässt sich customizen Mehr dazu im erweiterten Kapitel: Fragmente Neue Installationsanleitung für Zip, Loader und Docker Zum Kapitel Installation Neue Konsolen-Befehle z.B. package:list und install:list Mehr dazu im erweiterten Kapitel: Konsole Viele kleine Ergänzungen An vielen Stellen wurden Infos und Code ergänzt. Es lohnt sich also auch für die erfahrenen Nutzer*innen die Doku durchzustöbern. REDAXO wird fortwährend aktualisiert. Das Changelog zur aktuellen Version ist jederzeit im Download-Bereich verlinkt, direkt neben dem Download-Button. Changelogs und Releasenotes Changelogs aller Versionen, auch der jeweils aktuellen, findest du grundsätzlich auch bei GitHub: Alle Changelogs bei GitHub Dokumentationen zu weiteren Versionen erreicht man über das Versionsauswahlmenü. Übersicht der Kategorien Einleitung Grundlegende Informationenen zur aktuellen Version, Aktualisierung, API Setup Installationsanleitung, erster Login, Passwort-Wiederherstellung Anwendung Der Bereich zur Anwendung ist primär an Redakteurinnen und Redakteure gerichtet. Hier wird die Bedienung des Systems erläutert. Basis Grundlegende technische Informationen zum Aufbau einer REDAXO-Webpräsenz Service Informationen für Developer AddOns Entwicklung und Bereitstellung eigener AddOns Datenbank Datenbankabfragen, Tabellen ändern und Prioritäten Artikel bearbeiten"
