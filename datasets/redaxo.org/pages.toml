ngaben Updates Wording AceEditor -> Ace-Editor geändert README.md überarbeitet, HELP.md in README.md übernommen, die README wird unter AddOns und bei den AddOn-Einstellungen angezeigt Hinweise bei den AddOn-Einstellungen erweitert im Redonly-Modus alle Keybindings entfernen da sonst die Editor-Einstellungen verändert werden können CSS für Ace-Editor-Dialoge angepasst (aceeditor.css) Bugfixes Bei Fullscreen z-index auf 9989, da sonst die Ace-Dialoge im Fullscreen-Modus hinter dem Editor lagen bei vorhandenem Attribut aceeditor-theme wurde der Darkmode nicht richtig berücksichtigt herunterladen 1.0.3 Für REDAXO ^5.8 Veröffentlicht am 31.05.2023 Require / PHP >=7.4, <8.3 Version 1.0.3 - 31.05.2023 Features Der AceEditor kann jetzt auch einfach im Frontend eingebunden werden https://friendsofredaxo.github.io/tricks/snippets/aceeditor_im_frontend Readonly-Modus wenn die Textarea das readonly-Attribut hat (z.B. readonly oder readonly="readonly") Hinweise zur individuellen Verwendung in HELP.md ausgelagert. Anzeige am Seitenende der Einstellungen per Click. AceEditor kann jetzt in der Höhe geändert werden (Resize-Grabber unten rechts) Beim speichern der Einstellungen Refresh der Seite für die Darstellung der aktuellen Einstellungen neues Attribut aceeditor-themedark für den Dark-Mode JavaScript aceeditor.js Abhängigkeiten von jQuery eliminiert, jQuery wird nur noch für das Backend (rex:ready) verwendet wenn vorhanden Code für die Einbindung im Frontend angepasst Code besser kommentiert Check ob eine Textarea an die Function textAreaToAceEditor(textArea) übergeben wird Check ob Textarea bereits in AceEditor umgewandelt wurde Verbesserung um Breite/Höhe zu ermitteln bzw. zu setzen Fullscreen-Modus angepasst, auch Anpassung in aceeditor.css Update AceEditor Version src-min-noconflict v1.22.0 herunterladen 1.0.2 Für REDAXO ^5.8 Veröffentlicht am 23.05.2023 Require / PHP >=7.4, <8.3 Version 1.0.2 - 23.05.2023 Features Theme-Vorschau verbessert Mindesthöhe auf 200px falls Textar