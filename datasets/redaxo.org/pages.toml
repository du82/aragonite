["https://redaxo.org/download/addons/tags/awtranslator"]
title = "AddOns / REDAXO Website"
full_description = 'AddOn Kategorie Alle KategorienAuswertungen / Counter / Statistik 43Backendanpassungen 104Community / Multiuser 18Datenbanken 66Entwickler 94Ersetzungen 29Framework 23Multimedia 43Sicherheit 22Sonstiges 238Sprachen 12URL / SEO 41 suchen aw Translator Beschreibung Extrahiert alle Inhalte einer Sprache in eine Textdatei mit Marker. Die Textdatei kann dann übersetzt werden und wieder eingelesen werden. Zusätzlich können die Inhalte einer Sprache komplett in eine andere Sprache kopiert werden, wahlweise können die Inhalte der Zielsprache vorher komplett gelöscht werden. Das Addon dient dazu, Übersetzern eine komplette Textdatei zur Verfügung zu stellen. Übersetzer arbeiten erfahrungsgemäß ungern mit Content Management Systemen. Um sich die Arbeit zu sparen einzelne Artikelinhalte in eine Textdatei zu kopieren und später wieder einzeln in die Seiten einzufügen, wurde dieses Addon entwickelt. Im Addon kann man einstellen welche Slice Values in die Übersetzungsdatei übernommen werden sollen. Es macht ja zumeist keinen Sinn Links oder Referenzen auf Mediendateien in der Übersetzungsdatei zu haben. Man kann entweder die Inhalte der Quellsprache komplett in die Zielsprache kopieren oder die vorhandenen Inhalte der Zielsprache exportieren. Der exportierte Text sieht dann etwa so aus: <<< Artikel-Id: 1; Link: http://example.com/it/ich_bin_die_musterseite.html << Slice-id: 3244; Language-id: 3; Field: value1; Ctype: 1 Mein ein Textblock in Hauptspalte << Slice-id: 3245; Language-id: 3; Field: value1; Ctype: 1 h2. Die Muster GmbH Die Muster GmbH entwickelt, fertigt und vertreibt moderne Mustermaschinen für Mustertext lorem ipsum .... << Slice-id: 3246; Language-id: 3; Field: value1; Ctype: 1 "Schulung - Workshop(Schulung - Workshop)":/_system/_rss/ Wir möchten Ihnen Schulungen und Workshops anbieten ... lorem ipsum. .... Das Addon ist weniger geeignet für Inhalte, in denen übelst formatierte HTML Inhalte über Wysiwyg Editoren (TinyMCE, Redactor usw.) eingebaut sind, da der Inhaltscode nativ exportiert wird. Der Übersetzer muss in der Lage sein einfachste Anweisungen (Steuerzeichen erhalten) zu berücksichtigen. Während die Übersetzung in Arbeit ist, können Slices gelöscht, verschoben oder eingefügt werden. Wichtig: vor jeder Verwendung des Addons ist eine Datensicherung zu erstellen! Hier nochmal der Workflow bei Verwendung des Addons: Sprache im Backend von Redaxo anlegen zu übersetzende Inhalte aus der Quellsprache in die Zielsprache kopieren, entweder von Hand oder über die Sprachkopierfunktion des Addons Zu übertragende Modulinhalte in den Einstellungen definieren Sprache exportieren und zum Übersetzer schicken übersetztes File wieder einlesen Noch nicht realisiert: Metainfos werden noch nicht kopiert. Das Addon ist noch ausbaufähig. So könnte man über zusätzliche Felder im Slice prüfen, ob in der Quellsprache Änderungen seit dem letzten Export gemacht wurden. Anschließend könnte man nur die geänderten Inhalte exportieren und somit ein einfaches Sprachmanagement implementieren. Wenn Bedarf an so einer Erweiterung ist, bitte einfach mal melden. Umsetzung agile websites zum Profil Am Tressower See 1 23966 Tressow / NWM agile-websites.de Versionen 0.1 beta Für REDAXO >=5.0.0 Veröffentlicht am 21.04.2016 Erste Version herunterladen'
