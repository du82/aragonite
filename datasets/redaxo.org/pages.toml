["https://redaxo.org/cms/ueberblick"]
title = "Überblick / REDAXO Website"
full_description = 'Überblick Sechs wichtige Funktionen Weitere Funktionen Strukturverwaltung Medienpool Templates REDAXO CMS – einfach, flexibel, sinnvoll REDAXO ist mehr als nur ein Content-Management-System. Aufgrund des Leistungsumfangs und seiner offenen Architektur kann es auch für vielfältige Informations-Management-Lösungen eingesetzt werden. REDAXO steht unter der MIT-Lizenz und darf somit kostenlos und kommerziell frei verwendet werden. Das CMS ist weniger ein Out-Of-The-Box-System, wobei die verschiedenen Website-Demos wie die Standard-Demo oder die Community-Demo einen guten Start in eine eigene Website ermöglichen. REDAXO wurde jedoch vielmehr konzipiert als möglichst flexibles CMS für Agenturen, die vielfältige und auch sehr ungewöhnliche Webprojekte realisieren und den ausgegebenen Code zu 100% kontrollieren wollen. Da man in REDAXO – anders als in anderen CMS – nur die Funktionen und Module rasch hinzufügt, die man wirklich benötigt, ist das System für den Redakteur überraschend übersichtlich und leicht zu bedienen. Eine Redakteursschulung ist im Nu erledigt, und vor allem: Der Redakteur ist motiviert, an der Website zu arbeiten, wenn er rasch und ohne unnötige Umwege zum Ziel kommt. Die sechs wichtigsten Funktioneneinfache InstallationIn zehn Minuten ist das Grundgerüst fertigindividuelle Templatesfür die Trennung von Content und Layoutfrei definierbare Moduleum Inhalte flexibel und einfach einzupflegenKategorienbilden die Struktur für das Front- und BackendArtikeldienen zur Veröffentlichung der InhalteOutput100% Kontrolle über die HTML- und JS-Ausgabe Weitere Funktionen Verwaltung mehrsprachiger Websites völlig frei konfigurierbare Inhaltsmodule zahlreiche Funktionserweiterungen durch AddOns und Plugins Linkmanagement Import/Export für Projektsicherungen individuelle Rechteverwaltung von Benutzern Verwaltung von Multimedia-Inhalten und Dateien im Medienpool barrierefreies Webdesign problemlos möglich große und engagierte Community, die auch gemeinsam an AddOn-Erweiterungen arbeitet systemunabhängiges sowie plattformübergreifendes Arbeiten über einen Webbrowser und vieles mehr Der Administrationsbereich Interessiert an einem kleinen Blick in den Administrationsbereich von REDAXO? Wir stellen hier die wichtigsten Features des Systems vor und geben einen Überblick, wie einfach die Verwaltung einer Website mit Hilfe von REDAXO sein kann. Strukturverwaltung mit Kategorien Die Strukturverwaltung ist gleichzeitig die Startseite des Administrationsbereichs. Die verfügbaren Optionen hängen von den Rechten des jeweiligen Benutzers ab. Über die Strukturverwaltung legt man Kategorien an, die sowohl als Navigation im Backend dienen als auch (optional) als Navigationsmenü im Frontend verwendet werden können. Die Reihenfolge der einzelnen Kategorien erfolgt über die Prioritätenspalte. Ob die Inhalte im Frontend dargestellt werden sollen, lässt sich über die Funktion „online“ oder „offline“ bestimmen. Während die üblichen Inhalte mit Modulen eingepflegt werden (siehe nächster Abschnitt), können auch Artikel und Kategorien mit zusätzlichen "Metafeldern" beliebig erweitert werden. Diese Felder eigenen sich bestens dazu, allgemeine seitenspezifische Informationen zu speichern oder zum Beispiel Inhalte, die außerhalb des Contentbereichs liegen. Wegen der mannigfaltigen Erweiterungsmöglichkeiten gibt es oft nicht "einen" richtigen Weg in REDAXO, um ein Ziel zu erreichen, sondern etliche. Der Fantasie des Entwicklers, gute Lösungen für den Redakteur zu entwickeln, sind kaum Grenzen gesetzt. Modularer Aufbau der Inhalte Die Pflege der Inhalte in den einzelnen Artikeln erfolgt über Module. Nachdem der Admin diese in Modulverwaltung definiert hat, können sie auf der ganzen Webseite eingesetzt werden. Durch die modulare Strukturierung der Inhalte ist eine hohe Flexibilität garantiert: Der Redakteur kann so viele Bild-, Text-, Galerie-, Download-Module, etc. untereinander platzieren wie er möchte. In den Benutzerrechten kann der Admin definieren, wer mit welchen Modulen arbeiten darf. Das bietet somit die Möglichkeit, das System an den Wissensstand des Benutzers anzupassen und verschiedenen Redakteuren unterschiedliche Bereiche und Module freizuschalten. REDAXO beherrscht auch Rollen; so lassen sich Userrechte auch gruppenweise steuern. Verwaltung der Dateien im Medienpool Der Medienpool hilft beim Verwalten sämtlicher Dateien. Hier können alle Medien (z.B. Bildformate, Videodateien, PDF-Dokumente, usw.) strukturiert abgelegt und dokumentiert werden. Ebenso kann man – ohne ein extra FTP-Programm – die Dateien direkt auf den Webserver laden. Aus dem Medienpool heraus werden die Verknüpfungen zu den Inhaltsseiten erstellt, und Attribute wie Linktitel oder Alternativtext können auf einfache Art vergeben werden. Der Medienpool kann um beliebige Felder ergänzt werden, die dann bei allen Dateien zur Verfügung stehen. Ebenso kann man diese Felder aber auch nur auf bestimmte Medienkategorien beschränken. Trennung von Inhalt und Layout mit Templates Mit Hilfe der Templates wird das Layout der Webseite und der verschiedenen Artikel festgelegt, also zum Beispiel die Struktur und die Navigation definiert. Auch Metatags sowie Verknüpfungen zu CSS- und Javascript-Dateien kommen in die Templates. Durch die zentrale Verwaltung der Templates wird gewährleistet, dass alle Artikel ein einheitliches Layout erhalten. Änderungen in Templates wirken sich somit auf alle mit der Vorlage verknüpften Artikel aus. In den Templates kann man auch beliebig viele unabhängige Spalten - oder allgemeiner Contentbereiche - definieren. Templates in REDAXO können, müssen aber nicht als Seiten-Templates zur Verfügung stehen; sie können also auch als Container für Code-Snippets dienen. Seiten-Templates lassen sich zudem auf bestimmte Kategorien beschränken: So kann man sicherstellen, dass der Redakteur je nach Kategorie nur das Grundlayout nutzen kann, das der Designer/Entwickler auch dafür vorgesehen hat.'
