title = "REDAXO 5.13 veröffentlicht / REDAXO Website"
full_description = 'REDAXO 5.13 veröffentlichtREDAXO wird dunkler und immer besser: Mit 5.13 nutzt ihr automatisch den neuen Dark Mode, falls euer System darauf eingestellt ist. Wer es nicht mag, bleibt einfach im Hellen. Der Code wurde an zahlreichen Stellen optimiert, und immer wieder hilft uns dabei unsere automatisierte Entwicklungsumgebung bei GitHub. Danke an alle Beteiligten! Besonderheiten dieses Releases: Neuer Dark Mode, neue Login-Seite, überarbeitete Navigation und zahlreiche UI- und UX-Verbesserungen Statt Platzhaltern: Werte in Modulen können nun PHP-seitig ausgelesen werden PHPMailer: Archivierung im .eml-Format, automatische Bereinigung nach festgelegter Zeit, Konfiguration über neuen Extension Point Media Manager: Auf 3 generische Systemtypen reduziert (klein, mittel, groß) Medienpool: Suche nach Dateitypen, neue Methoden und Serviceklassen Debug-AddOn: Nun mit aktuellem Clockwork 5.1 und im gleichen Modus (light/dark) wie REDAXO Metainfos: Optimierungen im Ablauf Structure: Neue Array-Methoden für rex_article_slice Neue Methoden und Verbesserungen bei rex_list, rex_formatter, rex_select, rex_markdown, rex_pager, rex, rex_socket_proxy, rex_response und rex_factory_trait. Konsole: Neues Kommando package:run-update-script stößt das Update-Skript eines Addons an Die PHP-Extensions ctype, mbstring und intl werden nun vorausgesetzt Kompatibilität mit PHP 8.1 Code-Stabilität durch statische Code-Analyse und Tests verbessert Alle Infos bei Github Das vollständige Changelog auf GitHub Fehler melden und Verbesserungen einreichen auf GitHub Aktuelle Dokumentation Dokumentation für REDAXO 5.13 User Interface: Dark Mode und Navigation Wie schon beim letzten Release haben wir auch diesmal einige Anpassungen an der Benutzeroberfläche vorgenommen. Am auffälligsten ist dabei vermutlich der neue Dark Mode, den alle automatisch zu sehen bekommen, die ihr Betriebssystem dunkel eingestellt haben. Grundlegend überarbeitet wurde auch die Navigation. Die Leiste am oberen Bildschirmrand blendet nun automatisch ein- und aus, wenn gescrollt wird, und sie schafft dadurch zusätzlichen Platz vor allem auf kleinen Geräten. Die Hauptnavigation befindet sich am linken Rand und kann ebenso weggeklappt werden. Dies alles schafft die technische Basis für weitere Anpassungen in zukünftigen REDAXO-Versionen. Statt Platzhaltern: Inhalte aus Modulen PHP-seitig auslesen Die REDAXO-Variablen werden gerne eingesetzt, weil sie sehr schlicht und verständlich sind. So liefert REX_VALUE[1] etwa den Inhalt des ersten Eingabefelds eines Moduls. Technisch verhalten sie sich wie Platzhalter, die noch vor der Laufzeit in PHP ersetzt werden. Oftmals möchte man jedoch flexibler mit den Inhalten umgehen und sie zur Laufzeit verarbeiten. REDAXO 5.13 liefert sie nun direkt aus dem Cache ins Modul, wo sie mit PHP ausgelesen und verwendet werden können: // get current slice data from cache! \o/ $slice = $this->getCurrentSlice(); // get values, media, linklists… $slice->getValue(1); $slice->getMedia(3); $slice->getLinklist(2); New login page: meet the artist Thanks to artist Jr Korpa for his stunning picture. Much appreciated! Hopefully thousands of users will enjoy it when they log into REDAXO.'
