["https://redaxo.org/cms/news/redaxo-5-beta-steht-zum-download-bereit"]
title = "News / REDAXO Website"
full_description = "REDAXO 5 Beta steht zum Download bereit Veröffentlicht am 16.12.2015 Wir hatten es auf dem Redaxotag angekündigt, nun ist es soweit: Nach langer Entwicklungszeit steht die Beta-Version von REDAXO 5 zum Download bereit. Systemvoraussetzung ist die PHP-Version 5.5 aufwärts. Auch wenn das Grundprinzip von Redaxo und die Art und Weise, wie man Websites erstellt, im Wesentlichen gleich geblieben ist, so hat sich “unter der Haube” doch sehr viel geändert. Der moderne Core ermöglicht in Zukunft viele sinnvolle Erweiterungen. Doch zunächst geht es darum, die Beta-Version möglichst ausgiebig zu testen und die verbliebenen Bugs zu beseitigen. Dazu brauchen wir Eure Hilfe. Falls Euch Probleme auffallen, legt diese bitte direkt als Issues auf Github an: https://github.com/redaxo/redaxo/issues Wir gehen davon aus, dass wir dann in wenigen Wochen das erste Release veröffentlichen können. Hinweis: Die meisten AddOns werden mit der neuen REDAXO-Version nicht mehr funktionieren. AddOn-Entwickler werden also ihre AddOns für die neue Version anpassen müssen, bei den ersten ist dies bereits geschehen. Wir werden in Kürze eine Liste von AddOns zusammenstellen, die bereits mit der 5er-Version kompatibel sind. Downloadlink REDAXO 5 Beta steht zum Download bereit Veröffentlicht am 16.12.2015 Wir hatten es auf dem Redaxotag angekündigt, nun ist es soweit: Nach langer Entwicklungszeit steht die Beta-Version von REDAXO 5 zum Download bereit. Systemvoraussetzung ist die PHP-Version 5.5 aufwärts. Auch wenn das Grundprinzip von Redaxo und die Art und Weise, wie man Websites erstellt, im Wesentlichen gleich geblieben ist, so hat sich “unter der Haube” doch sehr viel geändert. Der moderne Core ermöglicht in Zukunft viele sinnvolle Erweiterungen. Doch zunächst geht es darum, die Beta-Version möglichst ausgiebig zu testen und die verbliebenen Bugs zu beseitigen. Dazu brauchen wir Eure Hilfe. Falls Euch Probleme auffallen, legt diese bitte direkt als Issues auf Github an: https://github.com/redaxo/redaxo/issues Wir gehen davon aus, dass wir dann in wenigen Wochen das erste Release veröffentlichen können. Hinweis: Die meisten AddOns werden mit der neuen REDAXO-Version nicht mehr funktionieren. AddOn-Entwickler werden also ihre AddOns für die neue Version anpassen müssen, bei den ersten ist dies bereits geschehen. Wir werden in Kürze eine Liste von AddOns zusammenstellen, die bereits mit der 5er-Version kompatibel sind. Downloadlink"
