title = "News / REDAXO Website"
full_description = "Der REDAXO-Tag in Hamburg am 9.5.2020 findet nicht statt Veröffentlicht am 12.03.2020 Aufgrund der aktuellen Coronavirus-Lage haben wir uns schweren Herzens entschieden, den REDAXO-Tag in Hamburg am 9. Mai 2020 abzusagen. Auch wenn es noch etwas Zeit ist bis dahin, so ist abzusehen, dass die Auflagen und Einschränkungen in den nächsten Wochen noch zunehmen werden und daher auch die Skepsis unserer Besucher gegenüber solchen Veranstaltungen steigen wird. Es kommt uns daher unverantwortlich vor, wenn wir diesen Schritt jetzt nicht täten. Wir sind gerade dabei, die bisherigen Reservierungen zu stornieren. Bisher gezahlte Ticketkosten werden zurückerstattet. Toll wäre es aber, wenn jeder seine Ticketnebenkosten (ca. 5%) selbst übernehmen könnte, diese werden uns nicht zurück erstattet. Alle Teilnehmer, die schon gebucht haben: Bitte schreibt eine Mail an info {ät} redaxo.org wegen der Rückerstattung der Ticketkosten. Alle Bahnreisende finden nähere Infos zur Rückerstattung der Bahntickets hier: https://community.bahn.de/questions/2249412-erstattung-bahnticket-wg-corona Sobald die Lage etwas klarer ist und mehr Planungssicherheit bietet, machen wir uns Gedanken über einen Termin für den nächsten REDAXO-Tag! Der REDAXO-Tag in Hamburg am 9.5.2020 findet nicht statt Veröffentlicht am 12.03.2020 Aufgrund der aktuellen Coronavirus-Lage haben wir uns schweren Herzens entschieden, den REDAXO-Tag in Hamburg am 9. Mai 2020 abzusagen. Auch wenn es noch etwas Zeit ist bis dahin, so ist abzusehen, dass die Auflagen und Einschränkungen in den nächsten Wochen noch zunehmen werden und daher auch die Skepsis unserer Besucher gegenüber solchen Veranstaltungen steigen wird. Es kommt uns daher unverantwortlich vor, wenn wir diesen Schritt jetzt nicht täten. Wir sind gerade dabei, die bisherigen Reservierungen zu stornieren. Bisher gezahlte Ticketkosten werden zurückerstattet. Toll wäre es aber, wenn jeder seine Ticketnebenkosten (ca. 5%) selbst übernehmen könnte, diese werden uns nicht zurück erstattet. Alle Teilnehmer, die schon gebucht haben: Bitte schreibt eine Mail an info {ät} redaxo.org wegen der Rückerstattung der Ticketkosten. Alle Bahnreisende finden nähere Infos zur Rückerstattung der Bahntickets hier: https://community.bahn.de/questions/2249412-erstattung-bahnticket-wg-corona Sobald die Lage etwas klarer ist und mehr Planungssicherheit bietet, machen wir uns Gedanken über einen Termin für den nächsten REDAXO-Tag!"
