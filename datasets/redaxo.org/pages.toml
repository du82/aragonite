["https://redaxo.org/cms/news/ihr-koennt-euch-zum-rexcamp-2022-in-mainz-%2525252817.09.2022%25252529-anmelden%25252521"]
title = "News / REDAXO Website"
full_description = "Ihr könnt Euch zum REXCAMP 2022 in Mainz (17.09.2022) anmelden! Veröffentlicht am 02.05.2022 Es ist wieder so weit. Unser eigentlich jährliches REDAXO-Treffen findet diesmal in Mainz am 17.09.2022 statt. Es wird Vorträge, Diskussionen und Workshops geben, und natürlich werden wir uns gegenseitig Tricks und sinnvolle Lösungen für die Arbeit mit REDAXO zeigen. Event-Info Es ist wieder so weit. Unser eigentlich jährliches REDAXO-Treffen findet diesmal in Mainz statt. Wir freuen uns auf Euch :) Vom blutigen Anfänger bis zum ausgewiesenen Experten sind alle herzlich willkommen, denn es geht wie immer vorwiegend ums gegenseitige Kennenlernen der tollen REDAXO-Community, Kontakte knüpfen und Wissen teilen. Ihr werdet viele Inspirationen mitnehmen und interessante Leute kennenlernen, jede Wette. Programm Der eigentliche REDAXO-Tag ist der Samstag, 17. September 2022 (Start um 9:00h) Am Sonntag werden wir vermutlich noch gemeinsam frühstücken und dann am Nachmittag abreisen. Viele kommen bereits am Freitag im Laufe des Tages an. Da wir den Raum schon ab Freitag Mittag nutzen können finden am Freitag – bei Interesse – Hackathons oder kleine Workshops statt. Zudem bieten sich beim gemeinsamen Abendessen erste Diskussionen an. Hier kannst du dich anmelden: https://www.xing.com/events/rexcamp-2022-mainz-17-9-2022-3937357 Ihr könnt Euch zum REXCAMP 2022 in Mainz (17.09.2022) anmelden! Veröffentlicht am 02.05.2022 Es ist wieder so weit. Unser eigentlich jährliches REDAXO-Treffen findet diesmal in Mainz am 17.09.2022 statt. Es wird Vorträge, Diskussionen und Workshops geben, und natürlich werden wir uns gegenseitig Tricks und sinnvolle Lösungen für die Arbeit mit REDAXO zeigen. Event-Info Es ist wieder so weit. Unser eigentlich jährliches REDAXO-Treffen findet diesmal in Mainz statt. Wir freuen uns auf Euch :) Vom blutigen Anfänger bis zum ausgewiesenen Experten sind alle herzlich willkommen, denn es geht wie immer vorwiegend ums gegenseitige Kennenlernen der to