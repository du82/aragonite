["https://redaxo.org/download/addons/tags/url-seo"]
title = "Tags / REDAXO Website"
full_description = 'AddOns URL / SEO Alle KategorienAuswertungen / Counter / Statistik 43Backendanpassungen 104Community / Multiuser 18Datenbanken 66Entwickler 94Ersetzungen 29Framework 23Multimedia 43Sicherheit 22Sonstiges 238Sprachen 12URL / SEO 41 suchen 27 Ergebnisse Beiträge, Kategorien, Taxonomien und Menüs Erweitert REDAXO um beliebte Funktionen eines bekannten Blogging-CMS: Taxonomien und Kategorien, Menüs und mehr. 🚧 Weiterentwicklung ungewiss. Beauftragung möglich. www.alexplus.de/redaxo-addons Versionen 5.x Diff Detect Tool zum Monitoren von RSS Feeds und einzelnen HTML Seiten. github.com/FriendsOfREDAXO/diff_detect/issues Versionen 5.x FriendsOfREDAXO Einfache Navigation für Redaxo 5 Dieses AddOn bietet ein System zur Erzeugung einer einfachen Navigation für Websites. Die Navigation wird in Form untereinander angeordneter Zeilen mit Links auf Nachbarseiten des aktuell angezeigten Artikels dargestellt. Das Design der Navigationszeilen ist responsiv. Auf Smartphone-Displays sind sie normalerweise ausgeblendet, können aber über einen Schalter ein- und ausgeblendet werden. Umfang und Layout der Navigationszeilen sind konfigurierbar. busch-dettum.de/public/it/simple_nav.html Versionen 5.x Einfaches URL-Rewrite für Redaxo 5 Dieses AddOn ist eine Erweiterung des Standard-Rewriters und nutzt den Extension Point URL_REWRITE. Es dient im Wesentlichen nur als exemplarische Einführung in die Funktionsweise des Rewriters. Der Artikel-URL wird hier in einer besonders einfachen Form aus Artikel-Id, Sprach-Code und Artikelname gebildet: ID-CODE-NAME.html. Seiten können aber auch über den Redaxo-Standard-URL aufgerufen werden. Es sind keine besonderen RewriteRules erforderlich. busch-dettum.de/public/it/url_simple_rewrite.html Versionen 5.x Events: Veranstaltungen, Termine und Anmeldungen verwalten Events bietet Ein- und Ausgabe von Terminen und Veranstaltungen sowie vorgefertigte YForm-Tabellen für Anmeldungen und Teilnahmelisten. 📄 Exzellent dokumentiert. ⭐ Anpassbar und erweiterbar. 🚀 YForm-Fundament. 🔤 Mehrsprachigkeit. 🔗 URL2-Profile. 🔎 SEO (JSON+LD-Format) www.alexplus.de/redaxo-addons Versionen 5.x FOR Sa11y - Accessibility checker FOR sa11y adds "Sa11y" to the REDAXO frontend, when a user is logged in. Vendor: https://sa11y.netlify.app/ Sa11y visually highlights accessibilty content issues at the source with a simple tooltip on how to fix them. github.com/FriendsOfREDAXO/for_sa11y Versionen 5.x FriendsOfREDAXO Headless API Erweitert REX API um Zugriff auf Artikel und Navigation. github.com/jelleschutter/redaxo_headless Versionen 5.x Kundenstimmen, Rezensionen und Bewertungen verwalten Verwalte deine Bewertungen, Kundenstimmen und Rezensionen bequem mit YForm. www.alexplus.de/redaxo-addons Versionen 5.x Link Checker Link Checker prüft in regelmäßigen Abständen, welche Hyperlinks auf der REDAXO-Seite in Anker-Tags verwendet werden und ob diese noch gültig / erreichbar sind, oder verwaist / fehlerhaft sind. github.com/alexplusde/link_checker Versionen 5.x FriendsOfREDAXO Media Manager Auto Rewrite Dieses AddOn macht automatisch aus deinen Media Manager URLs schöne URLs. github.com/FriendsOfREDAXO/media_manager_autorewrite Versionen 5.x FriendsOfREDAXO Media Manager Responsive Erstelle Media Manager Profil-Gruppen und verwende sie mit Responsive-Techniken. (picture, srcset, device pixel ratio, u.v.m.), um die Ladezeit, Performance, Caching und den PageSpeed-Index zu verbessern. 📄 Exzellent dokumentiert. 💪🏻 Flexibel einsetzbar. 🚀 Ideale Ergänzung zum Addon "Speed Up". ✅ In aktiver Weiterentwicklung. www.alexplus.de/redaxo-addons Versionen 5.x offlinehandler - offline seiten verstecken und nicht darstellen Mit diesen AddOn werden offline-markierte-Seiten nicht dargestellt und weitergeleitet zur "Fehlerseite"(404 Seite). github.com/giacomo/redaxo-offlinehandler Versionen 5.x og:image Vorschau-Bilder Generiert nützliche Vorschau-Bilder für Messenger, Soziale Medien, E-Mail-Clients, Suchmaschinen (og:image) anhand der Informationen, die in REDAXO hinterlegt sind (Artikelname, Servername, Domain, YRewrite-Konfiguration, favicon und SEO-Bilder sowie URL-Profile) www.alexplus.de/redaxo-addons Versionen 5.x parameter_rewrite Eigene Parameter-Trenner festlegen github.com/FriendsOfREDAXO/parameter_rewrite Versionen 5.x FriendsOfREDAXO redaxo_url_rewrite Dieses Addon schreibt die URLs neu und tauscht diese gegen SEO und menschenfreundliche Pfade aus. Dieses Addon ist kompatibel mit dem Apache Webserver. Nginx wird derzeit nicht unterstützt. github.com/BenJ1337 Versionen 5.x REDAXO-Addon für Stellenangebote. Ein Addon zum Verwalten von Stellenanzeigen in REDAXO mit sinnvollen Vorlagen für Bewerbungsformulare und einer Verwaltung von Bewerberdaten. #jobs #stellenangebote #bewerberformular #email #jsonld #alexplus www.alexplus.de/redaxo-addons Versionen 5.x SEO Inspektor Ein SEO Ranking Tool fürs Backend. Dieses Addon erweitert die Seitenspalte im Backend um das Inspektor Panel. Hier wird der gesamte Artikel nach allgemeinen SEO Kriterien durchsucht und die Ergebnisse überischtlich aufgelistet. Darüber hinaus kann auf ein individuelles Fokus-Keyword geprüft werden. Der Inspektor ist damit eine Art interaktive SEO-Checkliste. rokito.de/ Versionen 5.x FriendsOfREDAXO SEO-CheckUp SEO-Rankingtool (Suchmaschinenoptimierung) zur Analyse wichtiger SEO-Kriterien der Artikel-Livedaten github.com/iceman-fx/seocheckup Versionen 5.x Speed Up Verbessere die PageSpeed-Bewertung dank Prefetching und Preloading. 👶🏻 Kinderleicht eingerichtet. 📄 Exzellent dokumentiert. www.alexplus.de/redaxo-addons Versionen 5.x Staff: Teamkollegen, Ansprechpartner*innen und Mitarbeitende Verwaltung von Personen für Team-Seiten, Mitarbeitenden und Ansprechpartner*innen. Mit sinnvollen Standardfeldern wie: Name, E-Mail, Abteilung, Beschreibung/Vita. 📄 Exzellent dokumentiert. ⭐ Anpassbar und erweiterbar. 🚀 YForm-Fundament. 🚧 Unterstützung gesucht: Zusätzliche Methoden für das direkte komfortable Erstellen von VCard-Dateien und QR-Codes www