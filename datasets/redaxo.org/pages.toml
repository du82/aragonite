full_description = "REDAXO 5.1 verfügbar Veröffentlicht am 25.03.2016 Die REDAXO-Version 5.1. steht zum Download bereit. Da weitere Datenbankfelder hinzugekommen sind, sollte kein Import aus 5.0.x nach einem Update auf 5.1 importiert werden. Die REDAXO-Version 5.1. steht zum Download bereit: http://www.redaxo.org/de/download/file/?f=redaxo_5.1.0.zip Es gibt u.a. folgende Neuerungen: Core-Update wieder über Setup möglich, als Alternative zum Installer Status (online/offline) für Sprachen Neue REX_VAR: REX_CLANG[] Neue EPs: REX_FORM_GET und REX_LIST_GET Extension Points: Es können Extensions direkt für mehrere EPs (Array) registriert werden rex_context: Methoden fromGet() und fromPost() ergänzt rex_list: Methode getArrayValue() ergänzt rex_view: Bei doppelten CSS/JS-Dateien wird Exception geworfen Update jQuery (2.2.1), Bootstrap (3.3.6), Font-Awesome (4.5.0), symfony/yaml (3.0.3) Eine vollständige Liste der Neuheiten und Änderungen findet Ihr hier: https://github.com/redaxo/redaxo/releases REDAXO 5.1 verfügbar Veröffentlicht am 25.03.2016 Die REDAXO-Version 5.1. steht zum Download bereit. Da weitere Datenbankfelder hinzugekommen sind, sollte kein Import aus 5.0.x nach einem Update auf 5.1 importiert werden. Die REDAXO-Version 5.1. steht zum Download bereit: http://www.redaxo.org/de/download/file/?f=redaxo_5.1.0.zip Es gibt u.a. folgende Neuerungen: Core-Update wieder über Setup möglich, als Alternative zum Installer Status (online/offline) für Sprachen Neue REX_VAR: REX_CLANG[] Neue EPs: REX_FORM_GET und REX_LIST_GET Extension Points: Es können Extensions direkt für mehrere EPs (Array) registriert werden rex_context: Methoden fromGet() und fromPost() ergänzt rex_list: Methode getArrayValue() ergänzt rex_view: Bei doppelten CSS/JS-Dateien wird Exception geworfen Update jQuery (2.2.1), Bootstrap (3.3.6), Font-Awesome (4.5.0), symfony/yaml (3.0.3) Eine vollständige Liste der Neuheiten und Änderungen findet Ihr hier: https://github.com/redaxo/redaxo/releases"
