["https://redaxo.org/doku/main/extension-points"]
title = "Extension Points / Doku / REDAXO Website"
full_description = '''Extension Points Einsatz eines Extension Points Beispiel für den Einsatz eines Extension Points Eigene Extension Points definieren Liste der Extension Points Core Structure Structure Content Medienpool Backup Metainfo BE Style Media Manager Extension Points sind Stellen im REDAXO-Programmcode, an denen eigener Code eingeklinkt und ausgeführt werden kann. Dadurch lässt sich auch das Core-System erweitern und anpassen, ohne den Core selbst zu verändern. Extension Points ermöglichen die Manipulation eines bestimmten Wertes, der von der Funktion zurückgegeben wird, die man am Extension Point ausführen lässt. Extension Points stehen im Frontend und im Backend zur Verfügung. Die Funktion bekommt an der Stelle der Codeausführung relevante Parameter als Übergabewerte, die sich von Extension Point zu Extension Point unterscheiden. Im Rahmen einer REDAXOHour ist eine Video Einführung entstanden, die viele Punkte dieses Kapitels erklärt. Zum Video bei YouTube Einsatz eines Extension Points Zunächst sucht man sich den Extension Point, der für den eigenen Einsatz geeignet erscheint. Dann ordnet man dem Extension Point den Aufruf für die eigene Erweiterung zu. Diese Zuordnung muss an einer Stelle im Code erfolgen, an dem der Extension Point noch nicht durchlaufen wurde. Am einfachsten geschieht dies beispielsweise in der boot.php eines eigenen AddOns. Beispiele: Aufruf einer Methode einer Klasse rex_extension::register('SLICE_SHOW', array('myclass', 'myfunction'), rex_extension::LATE); Alternativ: Aufruf einer Funktion rex_extension::register('SLICE_SHOW', 'myfunction', rex_extension::LATE); Dies löst am Extension Point SLICE_SHOW die Methode myclass::myfunction aus. Die Funktion, die am Extension Point aufgerufen wird, bekommt ein Objekt vom Typ rex_extension_point übergeben, welches ausgewertet werden kann. Am Beispiel des Extension Point MEDIA_UPDATED: rex_extension::register('MEDIA_UPDATED', "meineUpdateFunction"); function meineUpdateFunction($ep) { # dump($ep); // auskommentieren, um alle Informationen des EP-Objekts zu erhalten $name = $ep->getName(); $subject = $ep->getSubject(); $params = $ep->getParams(); $filename = $ep->getParam('filename'); return $subject; } Methode Beschreibung Beispiel getName Liefert den Namen des Extensionpoints echo $ep->getName() ergibt z.B. "SLICE_SHOW" getSubject Liefert den Inhalt echo $ep->getSubject() liefert den Inhalt des aktuellen Extensionpoints, der bearbeitet und verändert wieder zurückgegeben werden kann. getParams Liefert zusätzliche Umgebungsparameter als Array, z.B. article_id, clang, ctype, module_id, slice_id, function, function_slice_id dump($ep->getParams()) getParam Liefert einen einzelnen Wert aus params. echo $ep->getParam('article_id') gibt die Artikel Id aus. Die Registrierung eines Extension Points mit der Methode rex_extension::register kann mit dem Parameter rex_extension::EARLY (-1), rex_extension::NORMAL (0) oder rex_extension::LATE (1) aufgerufen werden. Standard ist NORMAL (0). Dadurch kann die Reihenfolge gesteuert werden, in der die Erweiterungen abgearbeitet werden. Beispiel für den Einsatz eines Extension Points Im aktuellen Beispiel soll die Sidebar im Backend bei der Artikelbearbeitung um ein Infofeld erweitert werden. Hierfür kann der Extensionpoint STRUCTURE_CONTENT_SIDEBAR genutzt werden. In die Datei boot.php des AddOns kommt folgender Code: // Die Funktion wird nur im Backend aufgerufen, wenn ein User eingeloggt ist if (rex::isBackend() && rex::getUser()) { // Am Extensionpoint wird die Funktion be_helper::addfield aufgerufen. rex_extension::register('STRUCTURE_CONTENT_SIDEBAR', ['be_helper','addfield'], rex_extension::LATE); } Tipp: Füge diesen Code in die boot.php des project AddOns. Das ist der richtige Ort, um eigene Erweiterungen für REDAXO abzulegen, ohne ein eigenes AddOn programmieren zu müssen. Anschließend wird die aufzurufende Funktion im Verzeichnis lib des AddOns z.B. in der Datei be_helper.php definiert class be_helper { public static function addfield($ep) { // den aktuellen Inhalt auslesen $subject = $ep->getSubject(); // Beispielinhalt $text = '<p>In diesem Beispiel wird in der Sidebar des Backends ein zusätzliches Feld eingeblendet.</p>'; // den Inhalt in einem Fragment ausgeben $fragment = new rex_fragment(); $fragment->setVar('title', 'Beispiel', false); $fragment->setVar('body', $text, false); $fragment->setVar('collapse', true); // das Feld erhält eine Akkordeon-Funktion $fragment->setVar('collapsed', true); // das Feld ist erstmal zusammengeklappt, bei false ist es ausgeklappt $content = $fragment->parse('core/page/section.php'); // Der Inhalt des Fragmentes wird an der geeigneten Stelle eingesetzt return preg_replace('~</section>~','</section>'.$content,$subject,1); } } Tipp: Füge diesen Code in den /lib/-Ordner des project AddOns. Das ist der richtige Ort, um eigene Erweiterungen für REDAXO abzulegen, ohne ein eigenes AddOn programmieren zu müssen. Eigene Extension Points definieren Im eigenen Programmcode von AddOns lassen sich eigene Extension Points setzen, die dann wiederum von anderen Entwicklern genutzt werden können. Beispiel: $meine_var = rex_extension::registerPoint(new rex_extension_point( 'MEIN_EXTENSION_POINT', $meine_var, [$sinnvolle, $parameter, ... ] )); Liste der Extension Points Core CACHE_DELETED : Daten: rex_i18n::msg('delete_cache_message') : Parameter: keine CLANG_ADDED : Daten: keine : Parameter: ['id' => $clang->getId(), 'name' => $clang->getName(), 'clang' => $clang] CLANG_DELETED : Daten: keine : Parameter: ['id' => $clang->getId(), 'name' => $clang->getName(), 'clang' => $clang] CLANG_FORM_ADD : Daten: keine : Parameter: keine CLANG_FORM_BUTTONS : Daten: keine : Parameter: ['id' => $clang_id, 'sql' => $sql] CLANG_FORM_EDIT : Daten: keine : Parameter: ['id' => $clang_id, 'sql' => $sql] CLANG_UPDATED : Daten: keine : Parameter: ['id' => $clang->getId(), 'name' => $clang->getName(), 'clang' => $clang] COMPLEX_PERM_REMOVE_ITEM : Daten: keine : Parameter: ['key' => $key, 'item' => $item] COMPLEX_PERM_REPLACE_ITEM : Daten: keine : Parameter: ['key' => $key, 'item' => $item, 'new' => $new] FE_OUTPUT : Daten: $CONTENT : Parameter: keine I18N_MISSING_TRANSLATION : Daten: $msg : Parameter: ['key' => $key, 'args' => $args] META_NAVI : Daten: $list_items : Parameter: keine OUTPUT_FILTER : Daten: $content : Parameter: keine PACKAGES_INCLUDED : Daten: keine : Parameter: keine PAGES_PREPARED : Daten: rex_be_controller::getPages() : Parameter: keine PAGE_BODY_ATTR : Daten: $body_attr : Parameter: keine PAGE_CHECKED : Daten: $page : Parameter: ['pages' => $pages] : **Hinweis** der Wert ist schreibgeschützt PAGE_HEADER : Daten: keine : Parameter: keine PAGE_HEADER : Daten: keine : Parameter: keine PAGE_SIDEBAR : Daten: keine : Parameter: keine PAGE_TITLE : Daten: $head : Parameter: keine PAGE_TITLE_SHOWN : Daten: keine : Parameter: keine RESPONSE_SHUTDOWN : Daten: $content : Parameter: [] REX_FORM_CONTROL_FIELDS : Daten: $controlFields : Parameter: ['form' => $this] REX_FORM_DELETED : Daten: $deleted : Parameter: ['form' => $this, 'sql' => $deleteSql] REX_FORM_GET : Daten: $this : Parameter: [] REX_FORM_INPUT_ATTRIBUTES : Daten: [] : Parameter: ['inputType' => $inputType] REX_FORM_INPUT_CLASS : Daten: keine : Parameter: ['inputType' => $inputType] REX_FORM_INPUT_TAG : Daten: keine : Parameter: ['inputType' => $inputType] REX_FORM_SAVED : Daten: $saved : Parameter: ['form' => $this, 'sql' => $sql] REX_LIST_GET : Daten: $this : Parameter: [] Structure ART_ADDED : Daten: $message : Parameter: ['id' => $id, 'clang' => $key, 'status' => 0, 'name' => $data['name'], 'parent_id' => $data['category_id'], 'priority' => $data['priority'], 'path' => $path, 'template_id' => $data['template_id'], 'data' => $data] ART_DELETED : Daten: $message : Parameter: ['id' => $article_id, 'clang' => $clang, 'parent_id' => $parent_id, 'name' => $Art->getValue('name'), 'status' => $Art->getValue('status'), 'priority' => $Art->getValue('priority'), 'path' => 