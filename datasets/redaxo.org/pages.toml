title = "REDAXO 5.10 veröffentlicht / REDAXO Website"
full_description = 'REDAXO 5.10 veröffentlichtDie aktuelle Version ist vom Februar, und trotzdem gibt es bereits eine neue: REDAXO 5.10 wurde heute veröffentlicht und ist damit das schnellste Feature-Release von allen! \o/ Auslöser für dieses schnelle Release war sicherlich unser Hackathon in Hannover, bei dem viele Themen bearbeitet worden sind. Aber es haben sich auch wieder zahlreiche Menschen direkt und indirekt an der Entwicklung beteiligt — vielen Dank an euch alle! Besonderheiten dieses Releases Der Status (online/offline) von Slices wird nun direkt in REDAXO bereitgestellt (wurde vormals von blÖcks angeboten). Module können nun ebenso wie Templates (seit 5.9) über eindeutige Keys angesprochen werden. Für beide sind nun auch Platzhalter verfügbar: REX_TEMPLATE_KEY und REX_MODULE_KEY. Der Artikel- und Kategorie-Status wird nun per Dropdown umgeschaltet, wenn weitere Status hinzugefügt wurden, z. B. durch das beliebte AddOn accessdenied. Artikel-Metainfos werden nun direkt in der Seitenleiste rechts angezeigt und bearbeitet. Neue Extension Points im Medienpool: MEDIA_CATEGORY_ADDED, MEDIA_CATEGORY_UPDATED und MEDIA_CATEGORY_DELETED. Neuer Media-Manager-Effekt convert2img, wandelt auch SVGs in JPG/PNG um und unterstützt Transparenzen. Neue Konsolen-Kommandos: AddOns können installiert, aktualisiert und entfernt werden. Beta-/Entwicklungsversionen werden im System markiert, und es wird bei deren Installation ein Hinweis ausgegeben. Alle Infos bei Github Das vollständige Changelog auf GitHub Fehler melden und Verbesserungen einreichen auf GitHub Feature: Slice-Status (online/offline) nun direkt in REDAXO Nutzer des blÖcks-AddOns kennen die Möglichkeit, Inhaltsblöcke online und offline schalten zu können, um damit die Sichtbarkeit auf der Website zu steuern. Von nun an ist diese Funktion direkt in REDAXO integriert, damit der Online-Status zuverlässig gespeichert und an anderer Stelle weiterverwendet werden kann. Feature: Module und Templates mit Keys und Platzhaltern Bereits seit der letzten REDAXO-Version können Templates nicht mehr nur über ihre IDs, sondern auch über eindeutige Keys angesprochen werden. Mit dieser Version wird die Funktion nun auch für Module bereitgestellt. Weiterhin wurden für beide Komponenten Platzhalter implementiert: REX_TEMPLATE_KEY und REX_MODULE_KEY bringen jeweils den hinterlegten Key aus und ermöglichen einfache Abfragen. Feature: Artikel-Metainfos in der Seitenleiste Wir fanden Metainfos zu wichtig, um sie hinter einem Reiter zu verstecken. Stattdessen werden sie nun merklich prominenter in der Seitenleiste angebracht und können damit parallel zum Artikel bearbeitet werden.'
