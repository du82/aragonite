full_description = 'AddOns Entwickler Alle KategorienAuswertungen / Counter / Statistik 43Backendanpassungen 104Community / Multiuser 18Datenbanken 66Entwickler 94Ersetzungen 29Framework 23Multimedia 43Sicherheit 22Sonstiges 238Sprachen 12URL / SEO 41 suchen 74 Ergebnisse AceEditor - The high performance code editor for REDAXO # AceEditor - The high performance code editor for **REDAXO** Dieses AddOn bindet den Code-Editor **AceEditor** v1.23.1 im Backend ein. github.com/FriendsOfREDAXO/aceeditor Versionen 5.x FriendsOfREDAXO Add-on für Neues (in der Struktur bearbeiten) Erweitert das Add-on "Neues" um die Möglichkeit, Beiträge an Artikel zu koppeln. github.com/FriendsOfREDAXO/neues_structure Versionen 5.x FriendsOfREDAXO AddOn Viewer Der Addon Viewer erlaubt einen Blick hunter die Kulissen bestehender AddOns github.com/gupi/addon_viewer Versionen 5.x AddonTemplate Die Grund-Struktur für ein Addon erzeugen Versionen 5.x Adminer Adminer, Datenbankverwaltung und rex_sql_table Code-Generator https://www.adminer.org) als REDAXO-Addon github.com/FriendsOfREDAXO/adminer Versionen 5.x FriendsOfREDAXO Aktivitätsprotokoll Eine einfache Möglichkeit um Aktivitäten zu loggen. github.com/FriendsOfREDAXO/activity_log Versionen 5.x FriendsOfREDAXO Asset Import Asset Import für REDAXO Ein AddOn zum Importieren von Medien aus verschiedenen Quellen (Pixabay, Unsplash etc.) direkt in den REDAXO Medienpool. github.com/FriendsOfREDAXO/asset_import Versionen 5.x FriendsOfREDAXO Aufgaben (ToDo) Eine einfache ToDo Verwaltung für das Redaxo Backend. github.com/FriendsOfREDAXO/aufgaben Versionen 5.x FriendsOfREDAXO Automatisiertes Löschen von Datensätzen Unterstützung bei der DSGVO-konformen Umsetzung von Websites, indem Logs und Daten nach festgelegten Regeln gelöscht werden. 👶🏻 Kinderleicht einzurichten. ✅ Im Produktiveinsatz. www.alexplus.de/redaxo-addons Versionen 5.x Backend Explorer Dateiexplorer für REDAXO Versionen 5.x FriendsOfREDAXO Beispiel-Addon für REDAXO 5 Demo-Addon für REDAXO