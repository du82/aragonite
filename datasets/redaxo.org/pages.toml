["https://redaxo.org/cms/news/redaxo-mit-docker"]
title = "REDAXO mit Docker / REDAXO Website"
full_description = "REDAXO mit DockerIn den letzten Monaten haben wir innerhalb der Community mehrere Docker-Projekte entwickelt: Ein REDAXO-Image, auf dem alles aufbaut, die drei beliebten Demo-Websites sowie eine lokale Entwicklungsumgebung, die zahlreiche Tools und eine ausführliche Anleitung beinhaltet. Das REDAXO-Image Das REDAXO-Image liefert dir ein fertig installiertes REDAXO. Ganz frisch und ohne Inhalte. Es steht in verschiedenen Varianten bereit, so wie es bei Docker-Images üblich ist: Mit Apache-Webserver und den typischen PHP-Extensions, so wie es von den meisten Nutzenden benötigt wird. Als PHP FPM für die Verwendung mit einem bestehenden Webserver, der in der Praxis oftmals NGINX ist. Als PHP FPM auf Basis von Alpine Linux, das nur das Nötigste mitbringt und deshalb besonders schlank ist. Es stehen verschiedene PHP-Versionen bereit, aktuell sind es PHP 7.2, 7.3 und 7.4. Und auch REDAXO liegt in mehreren Versionen vor, wir sind mit 5.8.1 erstmalig gestartet und werden jede zukünftige Version nach Erscheinen zeitnah als Docker-Image anbieten. Images im Docker Hub: https://hub.docker.com/r/friendsofredaxo/redaxo Code bei GitHub: https://github.com/FriendsOfREDAXO/docker-redaxo Die Website-Demos Die drei Demos, die innerhalb der Community entwickelt worden sind, um typische Anwendungsfälle für REDAXO aufzuzeigen, liegen nun auch als Docker-Images vor. Das macht es möglich, mit wenig Aufwand und in kürzester Zeit fertige REDAXO-Websites zu starten, an denen du Funktionen testen oder dir abschauen kannst, wie verschiedene Anwendungen technisch implementiert werden können: Die Basis-Demo kommt auf Deutsch und Englisch und ist eher für Einsteiger gedacht. Sie zeigt einen möglichen Weg auf, eine Website mit REDAXO umzusetzen und liefert dabei viele hilfreiche Erklärungen. Wer sich erstmalig mit REDAXO beschäftigt, sollte diese Demo testen! In der Community-Demo kannst Du sehen, wie man mit dem Community-AddOn Loginbereiche erstellen kann, wo sich User registrieren und in geschützte Bereiche einloggen können. Die Onepage-Demo zeigt drei Wege, wie man eine Onepage-Website aufbauen kann: mit Modulen, mit Artikeln oder mit Kategorien und ggf. weiteren Artikeln. Von der letzten Variante ist es nun ein kleiner Schritt, um die Onepage-Website in eine Multipage-Website umzuwandeln. Informationen zu den Demos: https://redaxo.org/download/website-demos/ Images im Docker Hub: https://hub.docker.com/r/friendsofredaxo/demo Code bei GitHub: https://github.com/FriendsOfREDAXO/docker-demos Die Entwicklungsumgebung Dieses Projekt zielt vor allem auf den Einstieg in Docker ab, denn es erklärt sehr ausführlich alle Schritte, die du gehen musst, um am Ende eine sehr mächtige Entwicklungsumgebung für REDAXO zu erhalten. Aber auch erfahrene Docker-Anwendende profitieren von dem Setup, das zahlreiche Tools und Einstellungen enthält, um alleine oder im Team an REDAXO-Projekten zu arbeiten, z. B.: SSL zum lokalen Testen ImageMagick als Bildgenerator PhpMyAdmin zur Datenbank-Verwaltung Mailhog zum Testen des E-Mail-Versands Blackfire zur Performance-Analyse Projekt bei GitHub: https://github.com/FriendsOfREDAXO/redaxo-mit-docker"
