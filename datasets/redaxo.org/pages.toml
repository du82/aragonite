["https://redaxo.org/cms/news/neues-such-addon-fuer-redaxo-5.2"]
title = "News / REDAXO Website"
full_description = "Neues Such-Addon für Redaxo 5.2 Veröffentlicht am 10.10.2016 Endlich gibt es auch für Redaxo 5 ein Addon für eine Volltextsuche im Frontend: Search it. Wer bereits RexSearch für Redaxo 4 im Einsatz hatte, wird sich bei Search it gut zurecht finden. Die Struktur und wesentlichen Funktionen wurden beibehalten. Es werden Artikel, Medien, Dateien, PDF-Inhalte und Datenbank-Felder in einer DB-Tabelle des Addons gespeichert und ausgewertet. Suchanfragen können außerdem in einer Cache-Tabelle gespeichert werden. Das spart Serverrechenleistung und führt zur schnelleren Anzeige von Suchergebnissen. Die wichtigsten Änderungen zu RexSearch: Anpassung an Redaxo 5 Verbesserungen bei der Ähnlichkeitssuche Integration des search_highlighter- und des Reindex-Plugins Update verschiedener Komponenten (Kölner Phonetik, PHPLot) Aktualisierte Dokumentation (als Plugin) inklusive überarbeiteter Beispielmodule Cronjob zur regelmäßigen Reindexierung Veröffentlichung unter MIT-Lizenz weitere Bugfixes Im Moment kann der Release Candidate des Addons über den Redaxo 5-Installer heruntergeladen werden. Die aktuelle Entwickler-Version gibt es auf GitHub. Hilfe bei der Installation und Einrichtung befinden sich im beigefügten Doku-Addon. Fragen werden jedoch auch in Slack und im Forum beantwortet. Search it auf GitHub: https://github.com/tyrant88/search_it/ Redaxo-Forum für Fragen: http://redaxo.org/forum/ Redaxo Slack-Channel http://friendsofredaxo.slack.com/messages/redaxo/ Neues Such-Addon für Redaxo 5.2 Veröffentlicht am 10.10.2016 Endlich gibt es auch für Redaxo 5 ein Addon für eine Volltextsuche im Frontend: Search it. Wer bereits RexSearch für Redaxo 4 im Einsatz hatte, wird sich bei Search it gut zurecht finden. Die Struktur und wesentlichen Funktionen wurden beibehalten. Es werden Artikel, Medien, Dateien, PDF-Inhalte und Datenbank-Felder in einer DB-Tabelle des Addons gespeichert und ausgewertet. Suchanfragen können außerdem in einer Cache-Tabelle gespeichert werden. Das spart Serverrechenleistung und führt zur schnelleren Anzeige von Suchergebnissen. Die wichtigsten Änderungen zu RexSearch: Anpassung an Redaxo 5 Verbesserungen bei der Ähnlichkeitssuche Integration des search_highlighter- und des Reindex-Plugins Update verschiedener Komponenten (Kölner Phonetik, PHPLot) Aktualisierte Dokumentation (als Plugin) inklusive überarbeiteter Beispielmodule Cronjob zur regelmäßigen Reindexierung Veröffentlichung unter MIT-Lizenz weitere Bugfixes Im Moment kann der Release Candidate des Addons über den Redaxo 5-Installer heruntergeladen werden. Die aktuelle Entwickler-Version gibt es auf GitHub. Hilfe bei der Installation und Einrichtung befinden sich im beigefügten Doku-Addon. Fragen werden jedoch auch in Slack und im Forum beantwortet. Search it auf GitHub: https://github.com/tyrant88/search_it/ Redaxo-Forum für Fragen: http://redaxo.org/forum/ Redaxo Slack-Channel http://friendsofredaxo.slack.com/messages/redaxo/"
