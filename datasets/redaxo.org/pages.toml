title = "AddOns / REDAXO Website"
full_description = "AddOn Kategorie Alle KategorienAuswertungen / Counter / Statistik 43Backendanpassungen 104Community / Multiuser 18Datenbanken 66Entwickler 94Ersetzungen 29Framework 23Multimedia 43Sicherheit 22Sonstiges 238Sprachen 12URL / SEO 41 suchen blÖcks Beschreibung Blöcke online/offline schalten, per Drag&Drop verschieben sowie kopieren/ausschneiden und einfügen. Mit diesem Addon lassen sich einzelne Modulblöcke ein- und ausschalten (Plugin STATUS). Außerdem kann über das Plugin DRAG&DROP die Sortierung von Modulblöcken via Drag&Drop angeschaltet werden. Das Plugin CUT&COPY ermöglicht es, einzelne Module zu kopieren oder auszuschneiden und an anderer Stelle einzufügen. BLÖCKS bei GitHub: https://github.com/FriendsOfREDAXO/bloecks . Umsetzung FriendsOfREDAXO Versionen 4.0.2 Für REDAXO ^5.5.0 Veröffentlicht am 20.03.2024 Require / PHP >=7 IconFixed copy icon now weight 400 herunterladen 4.0.1 Für REDAXO ^5.5.0 Veröffentlicht am 03.03.2024 Require / PHP >=7 Fontawesome fix Redaxo 5.16 Status-Plugin entfernt herunterladen 3.1.1 Für REDAXO ^5.5.0 Veröffentlicht am 18.10.2021 Require / PHP >=7 Bugfixes Provides backward compatibility for Dark Mode in REDAXO 5.12 and earlier herunterladen 3.1.0 Für REDAXO ^5.5.0 Veröffentlicht am 02.10.2021 Require / PHP >=7 Features Dressed up for new dark mode (REDAXO 5.13) herunterladen 3.0.2 Für REDAXO ^5.5.0 Veröffentlicht am 11.02.2021 Require / PHP >=7 Release mit aktuellen Assets Installation nun auch unter PHP 8 möglich. herunterladen 3.0.0 Für REDAXO ^5.5.0 Veröffentlicht am 03.03.2020 Require / PHP ^7 Features This releases provides REDAXO 5.10 compatibility. Since online/offline status of slices is now implemented into the core system, blÖcks doesn’t need to provide this feature any more. Breaking changes Status plugIn has been disabled for REDAXO >=5.10. In case you’ve built custom functions on top of this plugIn, they will most likely break. herunterladen 2.1.2 Für REDAXO ^5.5.0 Veröffentlicht am 21.02.2020 Require / PHP >=5.6.0 Bugfixes Svensk översättning (#88, @interweave-media) Traducción en castellano (#89, @nandes2062) Show buttons only if users got permissions (#93, @tbaddade) Fix offline marker styles (#83) add PHP min version (#91) Update developer docs herunterladen 2.1.1 Für REDAXO ^5.5.0 Veröffentlicht am 31.10.2019 2.1.0 + 2.1.1 Features: Grunt: implement production workflow and use it for releases Bugfixes: Fix missing sourcemaps (#79) Fix sourcemaps flow: do NOT generate for production (messed this up before, sry) Fix release flow herunterladen 2.0.1 Für REDAXO ^5.5.0 Veröffentlicht am 27.09.2019 Bugfixes: Fix dropdown layer issues on hover (#80) herunterladen 2.0.0 Für REDAXO ^5.5.0 Veröffentlicht am 20.09.2019 Features: Offline blocks are now painted greyish and show a marker which makes them easier to distinguish from online blocks. (#73) No system message is displayed when the status of blocks has changed, since the visual feedback is now sufficient. (#73) Status icons no longer show the current status, but the target status: click on the crossed-out eye to set a block offline, and on the seeing eye to set it online. (#73) Scroll page to current block after drag and drop Improved drag and drop styles Revised the documentation Updated AddOn and PlugIn pages to show the documentation (#35) Used English as primary language Breaking changes: CSS styles have been changed and may not work as expected, if you are using a custom theme for your REDAXO backend! Without custom theme, there shouldn’t be any breaking changes. herunterladen 1.4.2 Für REDAXO ^5.5.0 Veröffentlicht am 15.07.2019 Bugfixes: Anfasser-Markierung (Handle) für Drag & Drop korrigiert (#71) herunterladen 1.4.1 Für REDAXO ^5.5.0 Veröffentlicht am 14.07.2019 Bugfixes: Positionierung der Blöcke bei Drag & Drop korrigiert (#68) Fehler beim Cut & Copy bei aktiviertem structure/version-Plugin korrigiert (#69) Fehler beim Drag & Drop bei aktiviertem structure/version-Plugin korrigiert (#70) herunterladen 1.4.0 Für REDAXO ^5.5.0 Veröffentlicht am 19.05.2019 Features Artikel aus der Zwischenablage werden innerhalb der Auswahl »Block hinzufügen« nun oben statt unten angezeigt (#56). Der Status eines Blocks wird beim Einfügen übernommen (#45). UI für Drag & Drop angepasst: Anfasser und Schatten (#34). Bugfixes Fehlendes visuelles Feedback bei ausgeblendeten Blöcken (#42) Drag & Drop plugin zeigt Move-Cursor auch dann, wenn Nutzerrechte fehlen (#60) Verschiedene kleine Bugfixes herunterladen 1.3.15 Für REDAXO ^5.5.0 Veröffentlicht am 30.06.2018 1.3.15 REDAXO Mindestversion auf 5.5 angehoben, da die in 566f2c7 verwendete klasse rex_csrf_token erst seit redsaxo 5.5.0 existiert Folgende Versionen wurden deshalb offline gestellt 1.3.14 5.x - Traducción en castellano (#5, @nandes2062) 1.3.13 5.x D'n'd: CSRF-Problematik gelöst Danke @gharlan herunterladen 1.3.12 Für REDAXO ^5.2.0 Veröffentlicht am 17.10.2017 Slice Status wird nun über neuen EP-param abgefragt sv_se.lang hinzugefügt herunterladen 1.3.11 Für REDAXO ^5.2.0 Veröffentlicht am 18.08.2017 package()-Aufruf in Fehlermeldung innerhalb rex_api_content_move_slice_to.php gefixt console.log()s in Produktivversion entfernt (Issue #30) aktualisierte englische Sprachdatei ynamite pt_br.lang hinzugefügt (Taina Soares) herunterladen"
