["https://redaxo.org/support/community"]
title = "Community / REDAXO Website"
full_description = 'CommunityBei REDAXO-Treffen zeigt sich immer wieder, wie wichtig die Community ist, und wieviel Motivation von ihr ausgeht! ❤️ Weltkarte der Community Friends Of REDAXO Slack-Chat Weltkarte der Community Um zu zeigen, wo überall auf der Welt Menschen mit REDAXO zu tun haben, gibt es die Community-Weltkarte, auf der sich alle eintragen können: Entwickelnde, Designerinnen, Texter, Administratorinnen, Anwender und alle, die REDAXO in irgendeiner Form verwenden oder unterstützen. Link zur Karte: friendsofredaxo.github.io/community/ ✋ Mitmachen: Deinen Eintrag hinzufügen Es gibt drei Möglichkeiten, einen Eintrag hinzuzufügen oder einen bestehenden Eintrag zu bearbeiten: Sende einen Pull Request bei GitHub Das ist die beste Möglichkeit für alle, die Erfahrung mit GitHub haben: Erstelle einen Fork des Repos, ergänze deinen Eintrag und gebe ihn mittels Pull Request zurück. Nachdem er gemerged wurde, erscheint er unmittelbar auf der Karte. Erstelle ein Ticket/Issue mit deinen Daten Diese Möglichkeit eignet sich für alle, die zwar einen GitHub-Account, aber wenig Erfahrung mit Forks und Pull Requests haben: Öffne ein Issue mit deinen Daten, dann wird sich jemand darum kümmern, den Eintrag auf die Karte zu bringen. Kontaktiere uns Wenn du keinen GitHub-Account hast oder dich mit den beiden vorher genannten Möglichkeiten unwohl fühlst, sende uns einfach eine E-Mail mit deinen Daten an friendsof [at] redaxo.org, und wir kümmern uns um deinen Eintrag! Um welche Daten geht es denn eigentlich? Neben deinem Namen und deinen Standortdaten kannst du noch eine Kurzbeschreibung und Links auf deine Websites angeben. Alle Infos findest du bei GitHub: How to add and manage your entry (Die Karte ist übrigens englischsprachig, weil sich REDAXO gerne etwas für Menschen öffnen möchte, die kein Deutsch sprechen. Solltest du deinen Eintrag lieber auf Deutsch oder in einer anderen Sprache verfassen wollen, ist das aber kein Problem.) Friends Of REDAXO Friends Of REDAXO ist eine Initiative von und für Entwickler_innen, die eine offene und gemeinschaftliche Zusammenarbeit anstreben. FOR-Code wird immer unter der MIT-Lizenz veröffentlicht. Projekte werden von allen interessierten FOR-Mitgliedern abgestimmt und gemeinsam bearbeitet. Diejenigen, die ein Projekt gestartet haben, bleiben dabei in besonderem Maße verantwortlich. Sollten sie sich mal nicht mehr beteiligen wollen, wird das Projekt von anderen FOR-Mitgliedern aufgefangen und weiterentwickelt. Die Arbeit von Friends Of REDAXO kann als Spende an die REDAXO-Community betrachtet werden. FOR-Website Übersicht der FOR-Projekte auf GitHub ✋ Mitmachen: Friend werden Es gibt kein Anmeldeformular, sondern es läuft einfach so: Mach’ dich irgendwie bemerkbar — im Slack-Chat, im Forum, bei Twitter oder per E-Mail an friendsof {at} redaxo.org —, dann holt dich jemand ins Team! Slack-Chat Der Chat ist die erste Anlaufstelle für Fragen rund um REDAXO, und er ist die beste Möglichkeit, die Community kennenzulernen. Inzwischen sind etwa 1.700 Nutzer*innen angemeldet. (Stand 01/2023) Chat Einladungsseite ✋ Mitmachen: Deine Einladung zum Slack anfordern Slack ist kostenlos und kann im Browser genutzt werden, es gibt aber auch Apps für alle wichtigen Systeme. Um dich anzumelden, benötigst du lediglich eine Einladung an deine E-Mailadresse, die du hier eingeben kannst: Einladung zum Slack-Chat: <a href="https://redaxo.org/slack/">https://redaxo.org/slack/</a>'
