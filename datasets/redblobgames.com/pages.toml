title = "Noise Functions and Map Generation"
full_description = '''31 Aug 2013 Table of Contents 1. Why is randomness useful? 2. What is noise? 3. Making noise 4. Ways to use noise 5. Frequency of noise 6. Colors of noise 7. Combining frequencies 8. Generating the rainbow 9. More shapes of noise 10. Other noise functions 11. More As I was studying audio signal processing, my brain started making connections back to procedural map generation. So here are some notes on how signal processing concepts relate to map generation. I don’t think any of this is new but some of it is new to me, so I wanted to write it down and share. I only cover simple topics (frequency, amplitude, colors of noise, uses of noise) and not related topics (discrete vs continuous functions, FIR/IIR filters, FFT, complex numbers). The math on this page is mostly sine waves. This page is about the concepts starting from the simplest ideas and working up. If you want to skip ahead to terrain generation using noise functions, see my other article. I’m going to start with the basics of using random numbers and work my way up to explaining how 1D landscapes work. The same concepts work for 2D (see demo) and 3D. Try moving this slider to see how a single parameter can describe many different styles of noise: 0 1 2 3 4 Exponent: = var offsets = [[5.305658970563565, 4.7623679680665845, 2.642529177293657, 1.6268219212234332, 3.2124338172355777, 2.544276222803882, 4.924751778411374, 1.9057700639797035, 2.994546979776625, 3.6654974587763136, 5.705841537519793, 3.171041037198489, 1.7708394029393855, 4.74885787066523, 3.885326994325826, 1.5739777634038004, 5.7161043087612855, 6.175023263149277, 5.090745032837427, 5.668475844439693, 1.948714650604693, 4.585668117381231, 5.647567524490951, 4.297597791358023, 2.966560172624361, 0.6327243509503904, 2.7279820973144067, 3.8383160558895004, 5.736617634996921], [0.8442354444173306, 5.324583204732311, 4.798937463950548, 1.602645954842546, 3.112910459877322, 2.8242356539891067, 4.094079392473133, 4.955694971284102, 0.5897371765578201, 0.17811244797868833, 5.251267021202746, 2.7191556824922216, 4.789547014055384, 0.013232723471835035, 2.7984502736910715, 4.533569729745489, 1.4373554275242735, 5.939310945611832, 5.6638357571527225, 0.1922025319432964, 0.15988105992264706, 3.401794894179865, 5.900848220819947, 2.395176865277171, 1.3609341495950262, 2.6522366656182905, 0.18246864979933375, 1.392929820250894, 2.7513288946214995], [6.0069404902946655, 5.955375740432253, 0.3553227228019942, 0.5332664729735533, 5.249594275227985, 4.624235821840466, 4.208040218100682, 1.9360784629304766, 3.807259478762108, 3.8126477371832137, 3.6518125407918904, 0.9951489232939251, 2.7059771561264165, 2.472633350622028, 4.542818885744579, 6.250635661220641, 5.9652276872422805, 3.4191652289122776, 2.795101302439578, 1.6854062867180135, 0.2257192186114827, 0.17244112283067747, 2.921014283727804, 2.000975412179294, 2.3877041737955493, 5.6032784185243445, 3.303402074307306, 3.521790464923623, 1.483607122266542], [1.495175848572241, 3.4194930721172536, 2.3244968667700685, 3.7945415132189377, 3.9315166211756676, 0.411729965571833, 0.08273693106265005, 5.261973431845652, 1.6295693321837814, 1.4723448514658746, 6.255821001648576, 2.9547527609677817, 5.2556423006693525, 2.9930154819275123, 4.015383550953657, 0.946350902444536, 3.988947160243856, 5.454089519808953, 3.287244494072791, 4.657422771804799, 4.218602717113993, 0.40232139186544674, 4.76410114292849, 3.713988214554036, 1.892920531797506, 0.1948525811846381, 5.438268018349855, 2.9703701278854004, 4.516503918139429], [1.483133889226057, 0.6482113104784197, 2.488507330758799, 0.9737194949259602, 0.41792667187964366, 2.5232707617079666, 5.767681639380159, 5.029390454015814, 4.807658421665465, 1.3944158527465735, 3.3720599420210084, 1.7384483200229284, 1.0848832334769094, 0.6671693028737434, 1.3471176478327955, 5.827501260155898, 5.208258271311151, 5.068346172801972, 5.029362098296823, 1.2153918330236917, 1.9468446991346642, 3.939403893042249, 4.598630081229241, 5.369914005736391, 5.5295219505250435, 0.5448668508200283, 3.806679654115824, 4.220424722395433, 3.1790013296557174]]; function random_ift(suffix) { var exponent = Number(document.getElementById('ift-input' + suffix).value) || 0.0; var rows = offsets.length; var mapsize = 60; var color = " (+2 = violet noise)"; if (exponent < +1.5) color = " (+1 = blue noise)"; if (exponent < +0.5) color = " (0 = white noise)"; if (exponent < -0.5) color = " (-1 = pink noise)"; if (exponent < -1.5) color = " (-2 = red noise)"; document.getElementById('ift-output' + suffix).textContent = exponent.toFixed(2) + color; function amplitude(f) { var power = Math.pow(f, exponent); return Math.sqrt(power); // power is amplitude squared } function noise(x, freq, offset, ampl) { return ampl * Math.sin(2*Math.PI * freq*x/mapsize + offset); } for (j = 0; j != rows; j++) { var array = []; for (var x = 0; x != mapsize; x++) { var y = 0.0; for (var k = 1; k != mapsize/2; k++) { y += noise(x, k, offsets[j][k-1], amplitude(k)); } array.push(y); } chart('ift-' + j + suffix, array); } } This article covers: how to generate landscapes like these in under 15 lines of code what red, pink, white, blue, and violet noise are how you can use noise functions for procedural map generation how midpoint displacement, Simplex/Perlin noise, and fBm fit in I also have some 2D noise experiments, including 3D visualization of a 2D heightmap. 1 Why is randomness useful?# What we're trying to do with procedural map generation is to generate a set of outputs that have some things in common and some things different each time. For example, all the maps in Minecraft have a lot of similarities: the set of biomes, the size of the grid, the average sizes of biomes, the heights, the average sizes of caves, the percentage of each type of rock, and so on. But they also have some differences: where the biomes are placed, the location and exact shapes of caves, the placement of gold, and so on. As a designer, you need to decide which aspects are the same and which aspects will vary, and how they will vary. For the parts that vary, you'll typically use a random number generator. Let's make an extremely simple map generator: it will generate a line of 20 blocks, and one of the blocks will contain a gold treasure chest. Let's write out some maps that we might like to see ("x" marks the treasure): map 1 ........x........... map 2 ...............x.... map 3 .x.................. map 4 ......x............. map 5 ..............x..... Note how much these maps have in common: they're all made of blocks, the blocks are in a line, the line is 20 blocks long, there are two types of blocks, there is exactly one gold treasure chest. But there is one thing that varies: where the block is. It can be anywhere from position 0 (leftmost) to position 19 (rightmost). We can use a random number to choose the location of that block. The simplest thing to do is to use a uniform random selection from 0 to 19. That means every location from 0 to 19 is equally likely to be chosen. Most languages will include some function to generate random numbers uniformly. In Python it's random.randint(0,19) but I'll write random(0,19) in these notes. Here's some Python code: def gen(): map = [0] * 20 # make an empty map pos = random.randint(0, 19) # pick a spot map[pos] = 1 # put the treasure there return map for i in range(5): # make 5 different maps print_chart(i, gen()) 01234But suppose we wanted maps that had the treasures more likely to be on the left than the right? To do this we would use a non-uniform random selection. There are lots of ways to do this. One way is to choose a random number uniformly, then move it towards the left. For example, we might try random(0,19)/2. Here's some Python code for that: def gen(): map = [0] * 20 pos = random.randint(0, 19) // 2 map[pos] = 1 return map for i in range(5): print_chart(i, gen()) 01234However, that's not quite what I want. I want treasures to sometimes be on the right, but more often on the left. Another way to move treasures to the left is to square the number, with something like sqr(random(0,19))/19. If it's 0, then 0 squared divided by 20 is 0. If it's 19, then 19 squared divided by 19 is 19. But in between, if it was 10, then 10 squared divided by 19 is 5. We've kept the range from 0 to 19, but we've moved the middle numbers like 10 over to the left. This kind of redistribution is a very useful technique on its own, and I've used square and square root and other functions in past projects. (This site[1] has some common reshaping functions used for animations; hover over a function to see the demo.) Here's Python code that uses squaring: def gen(): map = [0] * 20 pos = random.randint(0, 19) pos = int(pos * pos / 19) map[pos] = 1 return map for i in range(1, 6): print_chart(i, gen()) 12345Yet another way to move things to the left is to first randomly choose a range limit, then randomly choose a number from 0 to the range limit. If the range limit were 19 then we could get a number anywhere. If the range limit were 10 then we only get numbers on the left half. Here's some Python code: def gen(): map = [0] * 20 limit = random.randint(0, 19) pos = random.randint(0, limit) map[pos] = 1 return map for i in range(5): print_chart(i, gen()) 01234There are lots of tricks for taking uniform random numbers and turning them into non-uniform random numbers that have the properties you want. As the game designer you get to choose the distribution of the random numbers you want. I've written an article about how to use random numbers for damage in role-playing games[2] where I give a bunch of tricks like this. To review: For procedural generation we have to decide what will stay the same and what will change. Random numbers are useful for filling in the parts that change. Uniformly chosen random numbers are what most programming languages give us, but we often will want non-uniformly chosen numbers. There are many ways of getting them. 2 What is noise?# Noise is a series of random numbers, typically arranged in a line or a grid. In old TV sets, if you tuned to a channel that didn't have a station, you'd see random black and white dots on the screen. That's noise (from outer space!). On radios, if you tune to a channel that doesn't have a station, you hear noise (I'm not sure if this comes from space or elsewhere). In signal processing, noise is typically the unwanted aspect. In a noisy room it's harder to hear someone than in a quiet room. Audio noise is random numbers arranged in a line (1D). In a noisy image it's harder to see a pattern than in a clean image. Image noise is random numbers arranged in a grid (2D). You can also have noise in 3D, 4D, etc. Although in most applications you're trying to subtract the noise, a lot of natural systems look noisy, so if you're trying to procedurally generate something that looks natural, you typically want to add noise. Although real systems look noisy there's usually an underlying structure; the noise we add won't have that same structure, but it's much simpler than programming the simulation, so we use it and hope the end user doesn't notice. This is a tradeoff that I'll talk about later. Let's look at a simple example of where noise is useful. Let's say we have a 1D map as before, but instead of a single treasure chest, we want to create a landscape of valleys, hills, and mountains. Let's start by using a uniform random selection at each location. If random(1,3) is 1 we'll set it to a valley, if 2 set it to hills, and if 3 set it to mountains. I'm using random numbers to create a height map: at each location in the array, I store the height of the landscape. Here's Python code to create the landscape: for i in range(5): random.seed(i) # give the same results each run print_chart(i, [random.randint(1, 3) for i in range(mapsize)]) # note: I'm using Python's list comprehension syntax: # output = [abc for x in def] # is shorthand for: # output = [] # for x in def: # output.append(abc) 01234Hm, these maps look "too random" for our needs. Maybe we'd like larger areas of valleys or hills, and we'd also like mountains to be less common than valleys. Earlier we saw that uniform selection of random numbers may not be what we want; there are times we want non-uniform selection. Can that help here? We could use some random selection where valleys are more likely than mountains: for i in range(5): random.seed(i) print_chart(i, [random.randint(1, random.randint(1, 3)) for i in range(mapsize)]) 01234That decreases the number of mountains but doesn't really show any interesting patterns. The problem is that non-uniform random selections change what happens in each location in isolation but instead we want something where the random selection in one location is related to to the random selections in nearby locations. This is called "coherence". That's where noise functions come in. They give us a set of random numbers instead of one at a time. Here we want a 1D noise function to give us a sequence. Let's try a noise function that modifies a sequence of uniformly selected random numbers. There are lots of ways to do this but let's take the minimum of two adjacent numbers. If the original noise was 1, 5, 2, then the minimum of (1, 5) is 1, and the minimum of (5, 2) is 2. So the resulting noise will be 1, 2. Note that it removed the high point (5). Also note that the resulting noise has one fewer value than the original. That means when we generate 60 random numbers below we will only get 59 out. Let's apply this function to the first set of maps: def adjacent_min(noise): output = [] for i in range(len(noise) - 1): output.append(min(noise[i], noise[i+1])) return output for i in range(5): random.seed(i) noise = [random.randint(1, 3) for i in range(mapsize)] print_chart(i, adjacent_min(noise)) 01234Compared to the previous maps we made, these have larger areas of valleys, hills, or mountains. Mountains are often near hills. And because of the way we modified the noise (by taking the min), valleys are more common than mountains. If we had taken the max, mountains would be more common than valleys. If we had wanted neither valleys nor mountains more common, we could've taken the average instead of min or max. We now have a noise modification routine that can take some noise and make some new, smoother noise. Hey, let's run it again! def adjacent_min(noise): # same as before output = [] for i in range(len(noise) - 1): output.append(min(noise[i], noise[i+1])) return output for i in range(5): random.seed(i) noise = [random.randint(1, 3) for i in range(mapsize)] print_chart(i, adjacent_min(adjacent_min(noise))) 01234Now our maps are even smoother and there are even fewer mountains. I think we've smoothed too much, since we're not seeing mountains near hills very often. So maybe it's better go back to one level of smoothing in this example. This is a common process with procedural generation: you try something and see whether it looks right, and if'''
