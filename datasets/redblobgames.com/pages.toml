title = "Little Design Things"
full_description = '''21 Feb 2019 Here I have an unorganized collection of "little things" about my interactive diagram design. I am using this as a reference for myself, so that when I write a new page I can look through things I've done previously. I have previously listed a few of these in my interactive tutorial about how to make interactive tutorials[1]. Table of Contents 1. Visuals 1.1. Inline legend 1.2. Color in diagrams match text 1.3. Color in diagrams match code 1.4. Negative space 1.5. Yellow light and blue shadows 1.6. Custom controls 1.7. Arrows 2. Interactivity 2.1. Interaction feedback 2.2. Drag point 2.3. Expanded hit area 2.4. Transitions 2.5. Comparisons 2.6. Touch events 2.7. Sliders 2.8. SVG outside its container 2.9. Detect bad input 2.10. State machines 2.11. Canvas + SVG overlaid 2.12. Continuity 2.13. Islands of interactivity 3. General design 3.1. Color & size 3.2. HSL colors 3.3. Text shadow on header text 3.4. Two column layout 4. Site 4.1. Longevity 4.2. Links to sections 4.3. Reduce build steps 4.4. Add build steps 4.5. Freedom to experiment 4.6. Prerendering 4.7. Printing 4.8. OpenGraph meta tags 1 Visuals# 1.1 Inline legend# Text on the page might describe elements in a diagram. For example, I might write "the blue lines represent graph edges". For describing elements, we aren't limited to using text. We can draw those elements directly, like we do in hand-drawn notes. For example, I could write, "the blue lines represent graph edges". <SVG> is an inline element, like <img>. It can be placed in the text of a document. Here are examples where I connect the text and diagram by including elements of the diagram in the text. Inline legends: describe elements of the diagram in the textUse <svg width="3em" height="1em" viewBox="…"> to scale it to fit the text. The width and height are the size in the text and the view box is the coordinates of the diagram. Related: sparklines[2] show data inline in the text. What I'm doing here is showing the legend inline in the text. 1.2 Color in diagrams match text# I sometimes use colors in the text to match the color in the diagrams. Here's an example from the hexagon guide. Semantic colorization: use the same colors for code as used in the diagramUnfortunately because the text is x, y, z, the colors are not easy to see. I think the colors on the pathfinding pages worked better. 1.3 Color in diagrams match code# In this diagram on my breadth first search page, I use a red blob for a pathfinding node, blue for the set of nodes to be explored, green for the neighboring nodes, yellow for the current node, brown for visited nodes. In the code, instead of using standard colorizations for strings, keywords, etc., I use the same colors that I used in the diagram. I use the same colors in the text. Semantic colorization: use the same colors for text as used in the diagramI think I used too many colors. It would have been better to break this up into several steps, each focusing on one concept. In each step, I would use color only for the one concept I am trying to explain. Alternatively, this visualization[3] shows all the colors, and then hides all but the one concept the reader is focusing on. Color in code matches color in diagramI use both color and icons sometimes: Code can use icons to match the diagramsHere I colored the controls that correspond to the lines on the chart: Color in sliders matches the lines in the diagramRelated: Evan Brooks's article about semantic coloring of code[4] Oleksandr Kaleniuk's article about using color to mark identifiers that look similar[5]. My experiments with equation formatting My experiment coloring code in my editor[6] 1.4 Negative space# Negative space[7] is the space around the thing we draw. We can use this to our advantage, creating shapes in the mind without actually drawing them. A common example of this for page design is avoid drawing borders. We can often get the same effect by using background colors and leaving some space: Sidebar sidebar sidebar I guess I'm a little weird. I like to talk to trees and animals. That's okay though; I have more fun than most people. Let's do that again. There we are. Let's get wild today. You can do anything here - the only pre-requisite is that it makes you happy. The light is your friend. Preserve it. Maybe there was an old trapper that lived out here and maybe one day he went to check his beaver traps, and maybe he fell into the river and drowned. We don't have to be concerned about it. We just have to let it fall where it will. — Bob Ross text generator[8] Sidebar with border vs negative spaceThe first style focuses on the border; the second style focuses on the content. I use the same idea for diagrams. It's especially noticeable with grids: Grid with border vs negative spaceThe first style emphasizes the edges (which is what I want on a page about edges); the second style emphasizes the tiles (which is what I want most of the time). It's not always practical though in some color schemes. I occasionally use this with node-and-edge graphs: Circles with border vs negative spaceThe first one emphasizes the edges and the the second one emphasizes the nodes. Which works better depends on which I want the reader to focus on. 1.5 Yellow light and blue shadows# I had read somewhere that artists use yellowish tints for sunlight and bluish tints for shadows. I used this idea for my 2D visibility page: Yellow light and blue shadows look betterI don't know a lot about this though, and haven't used this idea much. I think what's going on is that light from sun+sky is white, and shadows have only the sky component but not the sun component so it's a bit bluish. Also see: The Muller Formula[9], which says lighter colors should be hue shifted towards yellow and darker colors should be hue shifted towards violet. 1.6 Custom controls# Web pages as documents have links that navigate to another page. Web pages as "apps" have buttons that perform actions. My pages tend to have a few controls that don't quite match either of these. I strongly prefer browser controls with styling than to build my own control. The problem with my own controls is that they don't follow platform conventions and are less accessible. For example, Discord has its own custom input box which supports arrow keys like ← and → for moving the cursor. But they don't fully support the Mac's alternate arrow keys Ctrl+B and Ctrl+F for moving the cursor (these are useful on keyboards without arrow keys or where arrow keys are inconvenient). By implementing their own key handler, they ended up missing the keys I use the most, which is quite frustrating. On my A* page I have some places where I want mouse hover or touch hold down to display an alternate view. I'm currently using a button for these, but I think they may be better displayed as an alternate type of link like show alternative. On my hexagon guide I have some places where I want mouse click or touch tap to toggle the state of a diagram. I'm currently using a button like toggle state for these. Distill.pub in their Visualizing memorization[10] article has some places where they want a mouse click or touch tap to change the state of a diagram. They're currently using links like removing the last two letters and only the first two characters as input for these. On the line drawing page I have some scrubbable (draggable) numbers. I ended up styling it like this: 47. I've experimented with using html5 number (<input type=number>) but then attaching styling and mouse event handlers to it so that it works as a scrubbable number normally, but if you click on it, it acts like a regular number control that you can type into. See this page about coordinate systems. Also see the :invalid and :out-of-range CSS selectors that can be used to style typed-in values that are out of range. This React component[11] uses <input type=text> instead of type=number, allowing for text input, but keeps an internal value to support partially typed values. Bret Victor's Tangle library[12] has scrubbable numbers using a link-like format 47 that shows instructions when you mouse over it. On my probability page I use a style similar to Tangle, but without instructions. Jeremy Apthorp's editor[13] also uses a style similar to Tangle, without the instructions. On my beta distribution page, I use mouse hover and touch drag to explore the parameter space. This is a custom control. I would like to use standard html controls when possible, since they should be better for accessibility. On my visibility page, I use an html5 slider (<input type=range>), but I style it to be bigger and easier to control when viewed on a phone. Stanko Tadić has a dual range slider[14] that uses existing two <input type=range> sliders next to each other Yuri Vishnevsky has a three-way slider[15], which is something I've wanted for some projects I'm clearly not consistent across pages. I think I should spend more time looking at what controls other interactive pages use, and see if I can be more consistent with them. 1.7 Arrows# I like arrows. I like arrows a lot. With static diagrams it's fairly easy to figure out where to put arrows. With interactive diagrams we need to calculate the arrow placement. Alexander Wang has a great reference page[16] on this topic, and has a Javascript library called curved-arrows[17] (0.85 kbytes[18] gzipped+minified). Steve Ruiz has some notes on arrows[19] too, and also has a Javascript library called perfect-arrows[20] (2.6 kbytes[21] gzipped+minified). Arrows are a little bit easier to implement in SVG than in Canvas. 1.7.1. SVG# In SVG, you have to create a marker inside <defs>, like this (my version modified slightly from the docs[22]): <defs> <marker id="arrowhead" viewBox="0 0 10 10" refX="7" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="3" orient="auto"> <path d="M 0 0 L 10 5 L 0 10 z"/> </marker> </defs> Then you can annotate any line/path with the marker, like <path d="M 20,10 l 10,80" marker-end="url(#arrowhead)" fill="none" stroke="black"/>. Let's see what it looks like: <path d="M 20,10 l 10,80" /> <path d="M 60,70 a 100,-30 0,0,0 100,0" /> <path d="M 210,40 c 50,20 -30,30 0,50 " /> <path d="M 270,70 c 0,-100 -100,-30 -200,-50 " /> Example of SVG arrowsThere are a few tricky things with SVG arrows. The marker contains the color. It's the fill color in the marker that draws the arrowhead, whereas it's the stroke color in the path that draws the tail. This has long been recognized as a problem, as seen in this discussion[23] suggesting that there might be a solution in svg 2. Also see this article[24] about styling <use> elements, although I don't think that solves the problem with arrowheads, because we both need fill to be none on the arrow and fill to be non-none on the arrowhead. Workaround: generate a new marker for each color :-( (Firefox has support for this SVG 2 feature but Chrome does not, so I don't use it) <path fill="none" stroke="red" marker-end="url(#arrowhead)" d="M 20,10 l 260,10" /> Example of SVG arrow line and head colors not matchingThe id is unique per page. If you have multiple <svg> elements, the id has to be unique across all of them. It's not per svg. Workaround: generate a new id for each svg :-( if you need them to be different in each diagram. To apply alpha, use opacity instead of fill-opacity! See this stackoverflow answer[25]. 1.7.2. Canvas# I wrote this function a long time ago, for Flash, and have continued using and tweaking it with my Canvas-based projects. function lerp(a, b, t) { return a * (1-t) + b * t; } function drawArrow(ctx, tail, head) { const stemLength = 0.5; const headLength = 0.5; const stemWidth = 0.15; const headWidth = 0.4; const tailLength = 0.1; let sx = lerp(tail[0], head[0], 0.2); let sy = lerp(tail[1], head[1], 0.2); let dx = (head[0] - tail[0]) * 0.7; let dy = (head[1] - tail[1]) * 0.7; ctx.beginPath(); ctx.moveTo(sx + dx*tailLength, sy + dy*tailLength); ctx.lineTo(sx - dy*stemWidth, sy + dx*stemWidth); ctx.lineTo(sx + dx*stemLength - dy*stemWidth, sy + dy*stemLength + dx*stemWidth); ctx.lineTo(sx + dx*(1-headLength) - dy*headWidth, sy + dy*(1-headLength) + dx*headWidth); ctx.lineTo(sx + dx, sy + dy); ctx.lineTo(sx + dx*(1-headLength) + dy*headWidth, sy + dy*(1-headLength) - dx*headWidth); ctx.lineTo(sx + dx*stemLength + dy*stemWidth, sy + dy*stemLength - dx*stemWidth); ctx.lineTo(sx + dy*stemWidth, sy - dx*stemWidth); ctx.lineTo(sx + dx*tailLength, sy + dy*tailLength); ctx.fill(); } It doesn't support curved paths like the SVG version, but it also doesn't have the fill vs stroke color problem like the SVG version. 1.7.3. Across elements# It turns out SVG elements default to overflow: hidden but you can change that CSS to overflow: visible to let the SVG exceed the containing box. I've written about this elsewhere on this page. The most unusual thing I've done with it is to have arrows extend far outside the <svg>. I haven't used this much, but here are some demos: initial proof of concept[26] this explanation of dungeon maps arrows pointing into code Interior arrows: arrows from text pointing inside a diagramI haven't written a full tutorial on this topic but you can look at my implementation, interior-arrow.js. I also found leader-line[27], a library that implements arrows like this (it also has a vue wrapper[28]). 2 Interactivity# 2.1 Interaction feedback# Highlighting optionsThese effects and others can be combined. Also the drag and hover effects can be different. For example, set the mouse pointer and fill color on hover, and then add a drop shadow and slight rotation on drag. Try dragging this shape: Interactive example: drag this shape 2.2 Drag point# The simplest way to deal with dragging is to set the object's position to the mouse position. This works fine for small shapes but it has a problem that's noticeable with larger shapes. Suppose we pick up the square from its corner and drag to the right. What should happen? If setting the square's position to the mouse position, it will "snap" down and to the right. Instead, we should remember where on the square we're dragging from, and position the square relative to that. Moving a shape to the mouse pointer: center vs offsetTry it yourself: Interactive example: try dragging the square from its cornerWhat does the code look like? When starting a drag operation, remember the offset between the object position and the mouse position. offset = {dx: pos.x - event.x, dy: pos.y - event.y}; When dragging, add the offset to the mouse position to get the object's position. pos.x = event.x + offset.dx; pos.y = event.y + offset.dy; There are other equivalent ways to implement this, and which way is easiest will depend on the API and what else I'm doing with the mouse coordinates. When I'm using d3, d3-drag[29] supports this feature by setting the "subject" for the drag operation. A different approach is each time mousemove is called, increment the object's position by the change '''
