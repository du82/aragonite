title = "Making of: Circle drawing tutorial"
full_description = '''28 Nov 2022 Table of Contents 1. Web page 2. Diagram 3. Detail: negative space 4. Algorithm 5. Interaction 6. Direct manipulation 7. Reusable drag handle 8. Radius handle 9. Distance diagram 10. Detail: appearance 11. Radius display 12. Coordinate systems 13. Bounding box diagram 14. Refactoring 15. Summary People sometimes ask me how I write my interactive tutorials. I can point at the HTML+CSS+JS but that doesn't show the process. On this page I'll recreate the first half of my circle drawing tutorial, showing an implementation using Vue.js v2[1]. The implementation style here will be similar if you use Vue v3 or React or Preact or Lit or Svelte etc. I also have another page showing an implementation using the D3.js/jQuery imperative style. In this tutorial I'm implementing diagrams using SVG instead of Canvas or WebGL. I usually choose SVG in part because DOM-manipulating libraries like D3 and Vue make HTML and SVG easier to work with. The goal is to implement interactive diagrams like this: The circle drawing tutorial was a medium sized project for me, with multiple diagrams, multiple layers in each diagram, and draggable handles. I'll include pointers to the code in each step. This is an interactive tutorial about making interactive tutorials. You should know some Javascript to follow the tutorial. It will help if you know some SVG and HTML. If you're interested in making your own interactive pages, I recommend trying to recreate the diagrams yourself while following the tutorial. 1 Web page# I usually start with a basic web page template that includes scripts, footers, and one blank SVG diagram: I attach an id= to an html element so that I can get to it from JavaScript. Sometimes I'll attach it to the <svg> and sometimes to a <div> or <figure> outside the diagram. For this page, I want interactive elements outside the SVG diagram so I'm putting the id on the <figure>. I use a viewBox on <svg> to tell it the coordinate system I want for drawing. I can use that to keep a consistent coordinate system even if the diagram is resized. I've hard-coded it for now but later on I'll show how to calculate it dynamically. I temporarily set CSS background or border on the new SVG so that I can see what space it occupies on the page. For the rest of the page I'll focus on the diagrams and won't show the header, footer, and text of the page. 2 Diagram# Sometimes I'll add a diagram first and then add some text; other times I'll start with the text and then figure out the diagrams. For this page I'll start with a diagram. The tutorial is about drawing circles on a square grid, so I need to draw a grid and also draw circles. I'll draw a grid with SVG. I start by making one grid cell. I can write out the SVG for it: That's plain HTML+SVG. I could've created that SVG with an interactive editor but in this case I wrote it by hand. But I want many grid cells. I want to repeat it, varying the position each time: How does this work? In Vue, v-for means to repeat an element. In this case, it will create one <rect> for each element in the positions array. The :x= syntax means it's setting x attribute by calculating the JavaScript expression q * scale. Let's look at the JavaScript powering the page: I first build that positions array. Here I'm using the variable names q for column and r for row. These are grid coordinates. I use variables x, y for the diagram (pixel) coordinates. I find that when I use x, y for both, I end up with more bugs. Once I have the positions array, I tell Vue to go to work on #diagram, the HTML <figure>. I have to export variables from JavaScript to the document by listing them in data. The v-for syntax is specific to Vue. In React, I'd use positions.map(…) to make an array of <rect>. In Svelte I'd use #{each … in positions}. In Lit I'd use ${repeat(positions, …)}. Each library has a way to loop over arrays, but the syntax differs. I'm showing Vue on this page but the concepts are similar across these libraries. Those of you who know SVG might choose to use viewBox or transform to change the coordinate system to place points at the center of each grid square instead of at the top left, and also to scale things so that each grid square is 1 unit across instead of scale pixels. On this page I start out with a conventional coordinate system with 22✕22 top-left positioned tiles, and later on show how 1✕1 centered tiles simplifies the code. 3 Detail: negative space# While working on a page, I'll sometimes work on the details during the process and sometimes towards the end. On this page I'll work on them during the process. For the grid, I sometimes use negative space. Drawing the edges in the foreground color leads the reader to focus on the edges. Instead, I'll draw the edges in the background color so they don't draw the focus, and then color the tile in gray or some other color. I don't do this for all pages. I use this on the A* pages, where the attention should be on the paths, but not on the hexagon pages, where the attention should be on the grid itself. Sometimes the color scheme doesn't allow for it. 4 Algorithm# The most obvious thing to do with an interactive diagram is to run the algorithm and display the results. In this case, the first algorithm I present on the page is a distance test in C++: bool inside_circle(Point center, Point tile, float radius) { float dx = center.x - tile.x, dy = center.y - tile.y; float distance = sqrt(dx*dx + dy*dy); return distance <= radius; } for (int y = 0; y < height; y++) { for (int x = 0; x < width; x++) { if (inside_circle(center, Point(x, y), radius)) { // do something with (x, y) } } } This returns a bool for each tile. In the diagram, I can use a color to show that boolean value. But the sample code is C++ and the diagram code is JavaScript, so I have to decide what to do here. I could compile the C++ to WASM so that I can directly call it from JavaScript, but in this case it is easier to reimplement it. The next question is where should it go. I could either call insideCircle and then choose the color in the HTML, or I could have the HTML call tileColor and have that function select the color in JavaScript. I decided to select the color in the HTML. In Vue, a function has to be exported to make it available in the HTML template, but that detail will vary in React, Svelte, etc. I also need to decide where to store the circle center and radius. I decided to put those into the Vue data, which stores the state for that diagram. I will later want to make these interactive. One thing to note is that I didn't implement the entire algorithm. The full algorithm has a loop over tiles, and then runs the test for each tile, and collects the results. But in the diagram, the loop is implicit. I don't actually need to collect the results. This happens a lot. The code for the diagram is not the same as the original algorithm. The point of the diagram is help the reader understand the concepts. It's not to demonstrate that I know how to implement the algorithm. For example, in this article about the quadratic formula[2], it would be easy to run the quadratic formula and give the answer. But the diagrams do something quite different, showing how completing a square relates to the quadratic formula. 5 Interaction# The diagram is now showing the output of the algorithm, but it's not yet interactive. The obvious thing to do is to allow the reader to change the inputs. In this case the inputs are the center and radius of the circle. Let's add sliders to control those three numbers: In libraries like Vue and React, the "source of truth" is a JavaScript variable. The HTML element mirrors it. The slider has a property (HTML) that gets the value from the variable (JavaScript). The slider then emits an event (HTML) to send a value to the variable (JavaScript). This pattern is called "two way binding" and is implemented using another pattern called "props down, events up". The syntax varies slightly across libraries: prop getter event setter Vue :value= "value" @input= "value = $event.target.value" Alpine :value= "value" @input= "value = $event.target.value" Svelte value= {value} on:input= "e => value = e.target.value" React value= {this.state.value} onChange= {e => this.setState({value: e.target.value})} Lit value= {this.value} @input= ${this.value = e => this.value = e.target.value} Binding is how we connect the HTML and JavaScript parts of the page. The prop+event get+set pattern is common enough that Vue has a convenient shorthand syntax[3]<input v-model="value" />. Alpine uses <input x-model="value" />. Svelte uses <input bind:value={value} />. React used to have valueLink[4] but now recommends writing them out separately. In Lit I also write them out separately. With the radius, I have two <input> elements, both set to the same variable. Sometimes it's useful to be able to edit the variable in multiple ways. The editable variables need to be exported in Vue's data section, but I already had them there so I didn't have to change the JavaScript in this step. 6 Direct manipulation# Sliders are easy to implement, since the browser already supports <input type=range>. When editing a geometric parameter like position, it's often better to directly manipulate the position by dragging it than to indirectly manipulate it by using a slider. The bad news: this is where things get trickier. The good news: once I figured this part out, I reused it across lots of projects. I'm going to start with the simpler implementation, but there are many more details that can be added. The first thing to do is add a handle. This is an object that represents the underlying variable, and is something the reader can drag around. The circle center is in grid coordinates, and I need to turn them into diagram coordinates. To do that, I add 1/2 so that the circle is centered inside a tile, then multiply by scale. So far it's in the SVG but there's no behavior. Let's add some behavior to it: Here's where it gets tricky. To go from the center in grid coordinates to a position in the diagram, I added 1/2 and then multiplied by scale. But that's in SVG coordinates. In almost all cases I can work in the SVG coordinates, but mouse events come in screen coordinates, so there's an extra step to convert that to SVG coordinates: Convert screen coordinates to SVG coordinates, using a helper function. Convert SVG coordinates to grid coordinates: I divide by scale and then subtract 1/2. For the first, I use a helper function from my drag event handler recipe. It's useful across projects. It doesn't handle all cases, and probably can't because of browser bugs[5], but it handles many of the cases I need it to handle. With an extension it can take into account SVG transforms. For the second, I use this event handler, which gets called by @pointermove="moveCenter": This kind of two-way mapping from data to diagram and back is common, and I occasionally go overboard and write a library to handle it. But in most cases I write it manually. If you try the demo you'll notice it doesn't work that well. There are three problems here: Mouse move hover events don't work well on most touch devices unless you're holding down a button or finger. The solution is to make it move while the mouse button / finger is held down. You can move the drag handle only while the mouse is on top of the drag handle. The solution is to use pointer capture[6], which directs all mouse move events to the drag handle while the button / finger is being held down. The drag handle isn't snapping to the grid tile, and it can also go off the edge of the grid. The solution is to use Math.round(), and then clamp(). Here's the version with dragging instead of mouseover: To implement this, I need a dragging flag and a pair of event handlers to update it: Details →Pointer events unify touch and mouse, but touch devices also let you scroll the page. I want to prevent touchstart on the drag handle from scrolling the page. Mouse devices also let you drag text, when text is selected. I want to prevent dragstart to prevent dragging text. Then pointerdown+pointerup let me track whether the mouse/finger is held down. I want to start drag only on the left mouse button so I use pointerdown.left. The pointercancel handler gets called for various reasons[7] and I use that to reset the dragging status.We're not done yet! I want to snap the drag handle to the nearest grid tile, using a reusable helper function clamp(): There are some other details to take care of. Touch events also scroll the browser view. I need to prevent the @touchstart event from its default action to stop the scrolling when dragging the handle. It works now. It could be better. Even though some of this code is reusable across projects, it's still a bit of work to make draggable handles. The JavaScript file went from around 40 lines to 100 lines. I often start with sliders and try out the diagram before implementing drag handles. 7 Reusable drag handle# Dragging the circle center around is nicer than setting the two sliders. It might also be nice to adjust the circle radius that way. The simplest thing to do is to write similar code for the radius as I did for the center. But this is usually the time when I start wanting to make the dragging functionality reusable. In Vue, React, etc., this can be a "component". This component will be reusable across projects. Any time I'm turning multiple instances of something into a reusable abstraction (class, function, module, component, etc.), the key question is: what parts are common and what parts are differing? The common part is that I'm going to have a <circle> with the pointer event handlers. The differing parts are going to be the size, color, and how the data maps to the position and back. The common parts go into the abstraction, and the differing parts go into the parameters. In the previous section I mentioned that it's common to have a two-way mapping, from original data to diagram position, and from diagram position back to data. With the circle center, that involved converting from grid coordinates to diagram coordinates by scaling and adding. But the radius will be converted differently. Vue offers a way to do this called computed values. Here I map center (grid coordinates) to centerPosition (diagram coordinates) using the getter, and map the other direction using the setter. It's the same code as in the previous section but now I've put the two mappings together in one place: I can then refactor the previous section's code into a component that takes the position, color, and size as parameters. It'll be similar in React, Svelte, etc.: The code is similar to what I wrote in the previous section, but the refactoring adds two things. The props are the parameters being passed down. The this.$emit is an update event being sent up. In Vue there's a shorthand syntax[8] I can use if the thing being changed is named value and the update event is named 'input': See '''
