["https://redblobgames.com/pathfinding/a-star/implementation.html"]
title = "Implementation of A*"
full_description = '''Table of Contents 1. Python Implementation 1.1. Breadth First Search 1.2. Early Exit 1.3. Dijkstra’s Algorithm 1.4. A* Search 2. C++ Implementation 2.1. Breadth First Search 2.2. Early Exit 2.3. Dijkstra’s Algorithm 2.4. A* Search 2.5. Production code 3. C# Implementation 4. Algorithm changes 5. Optimizations 5.1. Graph 5.2. Queue 5.3. Priority Queue 5.4. Search 5.5. Integer locations 6. Troubleshooting 6.1. Wrong paths 6.2. Ugly paths 7. Vocabulary 8. More reading Jul 2014, then Feb 2016, Nov 2018, Oct 2020, Feb 2022 This article is a companion guide to my introduction to A*, where I explain how the algorithms work. On this page I show how to implement Breadth-First Search, Dijkstra’s Algorithm, Greedy Best-First Search, and A*. I try to keep the code here simple. Graph search is a family of related algorithms. There are lots of variants of the algorithms, and lots of variants in implementation. Treat the code on this page as a starting point, not as a final version of the algorithm that works for all situations. 1 Python Implementation# I explain most of the code below. There are a few extra bits that you can find in implementation.py. These use Python 3 so if you use Python 2, you will need to remove type annotations, change the super() call, and change the print function to work with Python 2. 1.1 Breadth First Search# Let’s implement Breadth First Search in Python. The main article shows the Python code for the search algorithm, but we also need to define the graph it works on. These are the abstractions I’ll use: Graph a data structure that can tell me the neighbors for each graph location (see this tutorial). A weighted graph also gives a cost of moving along an edge. Locations a simple value (int, string, tuple, etc.) that labels locations in the graph. These are not necessarily locations on the map. They may include additional information such as direction, fuel, lane, or inventory, depending on the problem being solved. Search an algorithm that takes a graph, a starting graph location, and optionally a goal graph location, and calculates some useful information (reached, parent pointer, distance) for some or all graph locations. Queue a data structure used by the search algorithm to decide the order in which to process the graph locations. In the main article, I focused on search. On this page, I’ll fill in the rest of the details to make complete working programs. Let’s start with a graph. What does a graph look like? It’s a location type along with a class with a method to get neighboring locations: Location = TypeVar('Location') class Graph(Protocol): def neighbors(self, id: Location) -> list[Location]: pass I’m using Python’s type hints[1] to try to make it easier to understand which variables hold a list, a dict, a Location, etc. Graph is the interface that the search algorithms will want. Here’s an implementation go to with it: class SimpleGraph: def __init__(self): self.edges: dict[Location, list[Location]] = {} def neighbors(self, id: Location) -> list[Location]: return self.edges[id] Yes, that’s all we need! You may be asking, where’s the Node object? The answer is: I rarely use a node object. I find it simpler to use integers, strings, or tuples as the Location type, and then use arrays (Python lists) or hash tables (Python dicts) that use locations as an index. Note that the edges are directed: we can have an edge from A to B without also having an edge from B to A. In simple maps, edges are bidirectional, but game maps sometimes have one-way doors or jumps off cliffs, and road maps often have one-way roads or no-left-turn restrictions. The graph search algorithms work with these directional edges, and treat bidirectional edges as two one-way edges. Let’s start with an example map with both two-way and one-way edges: ABCDEFPart of turning a map into a graph is choosing which locations to mark. Here I decided to mark each horizontal platform as a location. We can represent this example in a graph where the Location type is a letter A, B, C, D, E, or F. For each location I need a list of which locations it leads to: example_graph = SimpleGraph() example_graph.edges = { 'A': ['B'], 'B': ['C'], 'C': ['B', 'D', 'F'], 'D': ['C', 'E'], 'E': ['F'], 'F': [], } Before we can use it with a search algorithm, we need to make a queue: import collections class Queue: def __init__(self): self.elements = collections.deque() def empty(self) -> bool: return not self.elements def put(self, x: T): self.elements.append(x) def get(self) -> T: return self.elements.popleft() This queue class is a wrapper around the built-in collections.deque class. Feel free to use deque directly in your own code. Let’s try the example graph with this queue and the breadth-first search algorithm code from the main article: from implementation import * def breadth_first_search(graph: Graph, start: Location): # print out what we find frontier = Queue() frontier.put(start) reached: set[Location] = set() reached.add(start) while not frontier.empty(): current: Location = frontier.get() print(" Visiting %s" % current) for next in graph.neighbors(current): if next not in reached: frontier.put(next) reached.add(next) print('Reachable from A:') breadth_first_search(example_graph, 'A') print('Reachable from E:') breadth_first_search(example_graph, 'E') Grids can be expressed as graphs too. I’ll now define a new graph called SquareGrid, with GridLocation being a tuple (x: int, y: int). In this map, the graph nodes (“states”) are the same as locations on the game map, but in many problems graph nodes are not the same as map locations. Instead of storing the edges explicitly, I’ll calculate them in the neighbors function. In many problems it’s better to store them explicitly. GridLocation = Tuple[int, int] class SquareGrid: def __init__(self, width: int, height: int): self.width = width self.height = height self.walls: list[GridLocation] = [] def in_bounds(self, id: GridLocation) -> bool: (x, y) = id return 0 <= x < self.width and 0 <= y < self.height def passable(self, id: GridLocation) -> bool: return id not in self.walls def neighbors(self, id: GridLocation) -> Iterator[GridLocation]: (x, y) = id neighbors = [(x+1, y), (x-1, y), (x, y-1), (x, y+1)] # E W N S # see "Ugly paths" section for an explanation: if (x + y) % 2 == 0: neighbors.reverse() # S N W E results = filter(self.in_bounds, neighbors) results = filter(self.passable, results) return results Let’s try it out with the first grid in the main article: from implementation import * g = SquareGrid(30, 15) g.walls = DIAGRAM1_WALLS # long list, [(21, 0), (21, 2), ...] draw_grid(g) __________________________________________________________________________________________ . . . . . . . . . . . . . . . . . . . . . ###### . . . . . . . . . . . . . . . . . . . . . . . . . . . . ###### . . . . . . . . . . . . . . . . . . . . . . . . . . . . ###### . . . . . . . . . . ###### . . . . . . . . . . . . . . . . ###### . . . . . . . . . . ###### . . . . . . . . ###### . . . . . . ###### . . . . . . . . . . ###### . . . . . . . . ###### . . . . . . ############### . . . . . . . ###### . . . . . . . . ###### . . . . . . ############### . . . . . . . ###### . . . . . . . . ###### . . . . . . . . . . . . . . . . . . ###### . . . . . . . . ###### . . . . . . . . . . . . . . . . . . ###### . . . . . . . . ###### . . . . . . . . . . . . . . . . . . ###### . . . . . . . . ###### . . . . . . . . . . . . . . . . . . ###### . . . . . . . . ###### . . . . . . . . . . . . . . . . . . . . . . . . . . . . ###### . . . . . . . . . . . . . . . . . . . . . . . . . . . . ###### . . . . . . . . . . . . . . . . . . . . . . . . . . . . ###### . . . . . . . . . . . . . . . ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ In order to reconstruct paths we need to store the location of where we came from, so I’ve renamed reached (True/False) to came_from (location): from implementation import * def breadth_first_search(graph: Graph, start: Location): frontier = Queue() frontier.put(start) came_from: dict[Location, Optional[Location]] = {} came_from[start] = None while not frontier.empty(): current: Location = frontier.get() for next in graph.neighbors(current): if next not in came_from: frontier.put(next) came_from[next] = current return came_from g = SquareGrid(30, 15) g.walls = DIAGRAM1_WALLS start = (8, 7) parents = breadth_first_search(g, start) draw_grid(g, point_to=parents, start=start) __________________________________________________________________________________________ > > > v v v v v v v v v v v v v < < < < < ###### v v v v v v v > > > > v v v v v v v v v v v < < < < < < ###### > v v v v v v > > > > > v v v v v v v v v < < < < < < < ###### > > v v v v v > > ^ ###### v v v v v v v v < < < < < < < < ###### > > > v v v v > ^ ^ ###### v v v v v v v < ###### ^ < < < < < ###### > > > v v v v ^ ^ ^ ###### > v v v v v < < ###### ^ ^ < < < < ############### v v v < ^ ^ ^ ###### > > v v v < < < ###### ^ ^ ^ < < < ############### v v < < v v v ###### > > > A < < < < ###### ^ ^ ^ ^ < < < < < < < < < < < v v v ###### > > ^ ^ ^ < < < ###### ^ ^ ^ ^ ^ < < < < < < < < < < v v v ###### > ^ ^ ^ ^ ^ < < ###### ^ ^ ^ ^ ^ ^ < < < < < < < < < > v v ###### ^ ^ ^ ^ ^ ^ ^ < ###### ^ ^ ^ ^ ^ ^ ^ < < < < < < < < > > v ###### ^ ^ ^ ^ ^ ^ ^ ^ ###### ^ ^ ^ ^ ^ ^ ^ ^ < < < < < < < > > > > > ^ ^ ^ ^ ^ ^ ^ ^ ###### ^ ^ ^ ^ ^ ^ ^ ^ ^ < < < < < < > > > > ^ ^ ^ ^ ^ ^ ^ ^ ^ ###### ^ ^ ^ ^ ^ ^ ^ ^ ^ ^ < < < < < > > > ^ ^ ^ ^ ^ ^ ^ ^ ^ ^ ###### ^ ^ ^ ^ ^ ^ ^ ^ ^ ^ ^ < < < < ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ Some implementations use internal storage, creating a Node object to hold came_from and other values for each graph node. I’ve instead chosen to use external storage, creating a single hash table to store the came_from for all graph nodes. If you know your map locations have integer indices, another option is to use an array to store came_from. 1.2 Early Exit# Following the code from the main article, we need to add an if statement to the main loop. This test is optional for Breadth First Search or Dijkstra’s Algorithm and effectively required for Greedy Best-First Search and A*: from implementation import * def breadth_first_search(graph: Graph, start: Location, goal: Location): frontier = Queue() frontier.put(start) came_from: dict[Location, Optional[Location]] = {} came_from[start] = None while not frontier.empty(): current: Location = frontier.get() if current == goal: # early exit break for next in graph.neighbors(current): if next not in came_from: frontier.put(next) came_from[next] = current return came_from g = SquareGrid(30, 15) g.walls = DIAGRAM1_WALLS start = (8, 7) goal = (17, 2) parents = breadth_first_search(g, start, goal) draw_grid(g, point_to=parents, start=start, goal=goal) __________________________________________________________________________________________ . > > v v v v v v v v v v v v v < . . . . ###### . . . . . . . > > > > v v v v v v v v v v v < < < . . . ###### . . . . . . . > > > > > v v v v v v v v v < < < Z . . . ###### . . . . . . . > > ^ ###### v v v v v v v v < < < < < < . . ###### . . . . . . . . ^ ^ ###### v v v v v v v < ###### ^ < < . . . ###### . . . . . . . . . ^ ###### > v v v v v < < ###### ^ ^ . . . . ############### . . . . . . . ###### > > v v v < < < ###### ^ . . . . . ############### . . . . . . . ###### > > > A < < < < ###### . . . . . . . . . . . . . . . . . . ###### > > ^ ^ ^ < < < ###### . . . . . . . . . . . . . . . . . v ###### > ^ ^ ^ ^ ^ < < ###### . . . . . . . . . . . . . . . . v v ###### ^ ^ ^ ^ ^ ^ ^ < ###### . . . . . . . . . . . . . . . > > v ###### ^ ^ ^ ^ ^ ^ ^ ^ ###### . . . . . . . . . . . . . . . > > > > > ^ ^ ^ ^ ^ ^ ^ ^ ###### . . . . . . . . . . . . . . . > > > > ^ ^ ^ ^ ^ ^ ^ ^ ^ ###### . . . . . . . . . . . . . . . . > > ^ ^ ^ ^ ^ ^ ^ ^ ^ ^ ###### . . . . . . . . . . . . . . . ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ You can see that the algorithm stops when it finds the goal Z. Early exit is also useful for problems other than standard pathfinding. 1.3 Dijkstra’s Algorithm# This is what adds complexity to graph search, because we’re going to start processing locations in a better order than “first in, first out”. What do we need to change? The graph needs to know cost of movement. The queue needs to return nodes in a different order. The search needs to keep track of these costs from the graph and give them to the queue. 1.3.1. Graph with weights# A regular graph tells me the neighbors of each node. A weighted graph also tells me the cost of moving along each edge. I’m going to add a cost(from_node, to_node) function that tells us the cost of moving from location from_node to its neighbor to_node. Here’s the interface: class WeightedGraph(Graph): def cost(self, from_id: Location, to_id: Location) -> float: pass Let’s implement the interface with a grid that uses grid locations and stores the weights in a dict: class GridWithWeights(SquareGrid): def __init__(self, width: int, height: int): super().__init__(width, height) self.weights: dict[GridLocation, float] = {} def cost(self, from_node: GridLocation, to_node: GridLocation) -> float: return self.weights.get(to_node, 1) In this forest map I chose to make movement depend only on to_node, but there are other types of movement that use both nodes[2]. An alternate implementation would be to include the movement costs in the value returned by the neighbors function. 1.3.2. Queue with priorities# A priority queue associates with each item a number called a “priority”. When returning an item, it picks the one with the lowest number. insert Add item to queue remove Remove item with the lowest number reprioritize (optional) Change an existing item’s priority to a lower number Here’s a reasonably fast priority queue that uses binary heaps, but does not support reprioritize. To get the right ordering, we’ll use tuples (priority, item). When an element is inserted that is already in the queue, we’ll have a duplicate; I’ll explain why that’s ok in the Optimization section. import heapq class PriorityQueue: def __init__(self): self.elements: list[tuple[float, T]] = [] def empty(self) -> bool: return not self.elements def put(self, item: T, priority: float): heapq.heappush(self.elements, (priority, item)) def get(self) -> T: return heapq.heappop(self.elements)[1] Note that Python now has a queue.PriorityQueue class you can use directly instead of this wrapper. The API is slightly different. 1.3.3. Search# Here’s a tricky bit about the implementation: once we add movement costs it’s possible to visit a location again, with a better cost_so_far. That means the line if next not in came_from won’t work. Instead, have to check if the cost has gone down since the last time we reached. (In the original version of the article I wasn’t checking this, but my code worked anyway; I wrote some notes about '''
