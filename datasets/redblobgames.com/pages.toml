title = "Making maps with noise functions"
description = "Interactive tutorial for using Simplex/Perlin noise to make terrain and biomes for a wilderness map"
full_description = "written Jul 2015, then updated in 2016, 2017, 2018, 2019, 2020, and 2022 Table of Contents Noise Elevation Biomes Climate Islands Ridges Terraces Trees Wraparound map Infinite map Implementation Demo Thoughts More One of the more popular pages on my site is about polygonal map generation[1]. Making those maps was a lot of work. I didn’t start there. I started with something much simpler, which I’ll describe here. The simpler technique can make maps like this in under 50 lines of code: I’m not going to explain how to draw these maps; that’s going to depend on your language, graphics library, platform, etc. I’m only going to explain how to fill an array with height and biome map data. Noise# A common way to generate 2D maps is to use a bandwidth-limited noise function, such as Simplex or Perlin noise, as a building block. This is what the noise function looks like: We assign each location on the map a number from 0.0 to 1.0. In this image, 0.0 is black and 1.0 is white. Here’s how to set the color at each grid location in C-like syntax: for (int y = 0; y < height; y++) { for (int x = 0; x < width; x++) { double nx = x/width - 0.5, ny = y/height - 0.5; value[y][x] = noise(nx, ny); } } The loop will work the same in Javascript, Python, Haxe, C++, C#, Java, and most other popular languages, so I’ll show it in C-like syntax and you can convert it to the language you’re using. In the rest of the tutorial, I’ll show how the loop body (the value[y][x]=… line) changes as we add more features. At the end, I’ll show a complete example. Depending on the library you use, you may have to shift or multiply the values you get back to fit into the 0.0 to 1.0 range. Some libraries return 0.0 to 1.0; some return -1.0 to +1.0; some return other ranges like -0.7 to +0.7. Some don’t say what they return, so you may have to look at the return values to figure out the range. Elevation# Noise by itself is just a bunch of numbers. We need to assign meaning to it. The first thing we might think of is to make the noise correspond to elevation (also called a “height map”). Let’s take the noise from earlier and draw it as elevation: The code is almost the same, except for what’s inside the inner loop; it now looks like this: elevation[y][x] = noise(nx, ny); Yes, that’s it. The map data is the same, but now I call it elevation instead of value. Lots of hills, but not much else. What’s wrong? Frequency# Noise can be generated at any frequency. I’ve only picked one frequency so far. Let’s look at the effect of frequency. Try moving the slider to see what happens at different frequencies: frequency=2It’s just zooming in and out. That doesn’t seem very useful at first glance, but it is. elevation[y][x] = noise(frequency * nx, frequency * ny); It’s sometimes useful to think of wavelength, which is the inverse of frequency. Frequency is measured in oscillations per distance. Doubling the frequency makes everything half the size. Wavelength is measured in distance per oscillation, measured in pixels or tiles or meters etc. Doubling the wavelength makes everything twice the size. Wavelength is related to frequency: wavelength = map_size / frequency. elevation[y][x] = noise(x / wavelength, y / wavelength); I have another tutorial that explains the concepts: frequency, wavelength, amplitude, octaves, pink and blue and white noise, etc. Octaves# To make the height map more interesting we’re going add noise at different frequencies: + + = elevation[y][x] = 1 * noise(1 * nx, 1 * ny); + 0.5 * noise(2 * nx, 2 * ny); + 0.25 * noise(4 * nx, 4 * ny); Let’s mix big low frequency hills and small high frequency hills into the same map. Move the slider to add smaller hills to the mix: 0.0 0.5 1.0Now that looks a lot more like the fractal terrain we want! We can now get hills and rugged mountains, but we still don’t get flat valleys. We need something else for that. There’s a potential problem though. Since noise can go from 0 to 1, the sum 1 * noise() + 0.5 * noise() + 0.25 * noise() can go from 0 to 1.75. The numbers [1, 0.5, 0.25] are called the amplitudes. The simplest thing to do is to divide by the sum of amplitudes: e = 1 * noise(1 * nx, 1 * ny); + 0.5 * noise(2 * nx, 2 * ny); + 0.25 * noise(4 * nx, 4 * ny); elevation[y][x] = e / (1 + 0.5 + 0.25); In practice, you may want to experiment to find the best divisor. Although the sum of amplitudes guarantees the elevation stays in the range 0–1, the elevation values may not be distributed the way you want. Amplitudes are commonly set to be an array [1, 1/2, 1/4, 1/8, 1/16, …], where each amplitude is ½ the previous one. This ratio is called gain or persistence. However we’re not limited to using a fixed ratio. I use amplitudes [1, 1/2, 1/3, 1/4, 1/5] for many examples on this page to bring out more fine detail than the conventional amplitudes would do. Amplitudes can also be calculated dynamically, either from previous noise values (e.g. octave 1’s noise can affect octave 2’s amplitude), or by using an independent noise field, or by using player/simulation data. Another possible issue: by using noise(1 * nx, 1 * ny) and noise(2 * nx, 2 * ny) and noise(4 * nx, 4 * ny), what happens when nx and ny are near 0? These noise values are correlated. To get the best results we want these to be independent. If your noise library allows seeding, you can use separate seeds for each of the octaves. If it does not allow seeding, you can add an offset to each of the octaves, such as noise(1 * nx, 1 * ny) and noise(2 * nx + 5.3, 2 * ny + 9.1) and noise(4 * nx + 17.8, 4 * ny + 23.5). That way each octave is sampling from different parts of the noise space and they will be independent instead of correlated. And yet another possible issue: these noise values may be aligned along the same directions, which can sometimes cause visible artifacts, especially when using Perlin noise. To reduce this, rotate the output of some of the octaves, or switch to Simplex noise. Redistribution# The noise function gives us values between 0 and 1. To make flat valleys, we can raise the elevation to a power. Move the slider to try different exponents. exp=1 3 5e = 1 * noise(1 * nx, 1 * ny); + 0.5 * noise(2 * nx, 2 * ny); + 0.25 * noise(4 * nx, 4 * ny); e = e / (1 + 0.5 + 0.25); elevation[y][x] = Math.pow(e, exponent); Higher values push middle elevations down into valleys and lower values pull middle elevations up towards mountain peaks. We want to push them down. I use power functions here because they’re simple, but you can use any curve you want; I have a fancier demo here. In practice it may work better to use Math.pow(e * fudge_factor, exponent), where the fudge factor is some number near 1. For the above demo I used 1.2. Try different values and see what works best for you. The pow() function is only one way to reshape the elevations. There are many other functions you can try. You aren’t limited to mathematical functions; consider drawing curves yourself, like the “curves” tool in a photo editor. Now that we have a reasonable elevation map, let’s add some biomes! Biomes# Noise gives us numbers but we want a map with forests, deserts, and oceans. The first thing to do is to make low elevations into water: water=0.0 0.2 0.5function biome(e) { // a threshold between 0.2 and 0.5 work well in the demo // but each generator will need its own parameter tuning if (e < waterlevel) return WATER; else return LAND; } Hey, that’s starting to look like a procedurally generated world! We have water, grass, and snow. What if we want more things? Let’s make the sequence water, beach, grassland, forest, savannah, desert, snow: Terrain based on elevation onlyfunction biome(e) { // these thresholds will need tuning to match your generator if (e < 0.1) return WATER; else if (e < 0.2) return BEACH; else if (e < 0.3) return FOREST; else if (e < 0.5) return JUNGLE; else if (e < 0.7) return SAVANNAH; else if (e < 0.9) return DESERT; else return SNOW; } Hey, looks cool! You’ll want to change the numbers and biomes for your game. Crysis will have more jungles; Skyrim will have more ice and snow. But no matter what you change the numbers to, this approach is a bit limited. The terrain types line up with the elevations, so they form bands. To make it more interesting, we need to choose biomes with something other than elevation. Let’s create a second noise map for “moisture”: Elevation noise on left; moisture noise on rightNow let’s use both elevation and moisture. In the diagram on the left below, the y-axis is the elevation (first diagram above) and the x-axis is the moisture (second diagram above). It produces a reasonable looking map: Terrain based on two noise valuesLow elevations are oceans and beaches. High elevations are rocky or snowy. In between we get a wide range of biomes. The code looks like this: function biome(e, m) { // these thresholds will need tuning to match your generator if (e < 0.1) return OCEAN; if (e < 0.12) return BEACH; if (e > 0.8) { if (m < 0.1) return SCORCHED; if (m < 0.2) return BARE; if (m < 0.5) return TUNDRA; return SNOW; } if (e > 0.6) { if (m < 0.33) return TEMPERATE_DESERT; if (m < 0.66) return SHRUBLAND; return TAIGA; } if (e > 0.3) { if (m < 0.16) return TEMPERATE_DESERT; if (m < 0.50) return GRASSLAND; if (m < 0.83) return TEMPERATE_DECIDUOUS_FOREST; return TEMPERATE_RAIN_FOREST; } if (m < 0.16) return SUBTROPICAL_DESERT; if (m < 0.33) return GRASSLAND; if (m < 0.66) return TROPICAL_SEASONAL_FOREST; return TROPICAL_RAIN_FOREST; } These are example threshold numbers. In every project I’ve worked on I’ve had to change them, not only for predominant biomes (Dagobah will have more swamp, Hoth will have more tundra, Tatooine will have more desert) but also because it depends on the noise library being used and how the octaves are mixed together. Plan to tweak these numbers! Alternatively if you don’t need biomes, smooth gradients (see cartographer Tom Patterson’s article[2]) can produce colors: With either biomes or gradients, one noise value doesn’t produce enough diversity, but two is pretty good. Two is what ecologist Robert Whittaker[3] used when he was studying biomes. Climate# In the previous section I used elevation as a proxy for temperature. Higher elevations have lower temperatures. However, latitude also affects temperatures. Let’s use both elevation and latitude to control temperature: equator: hot cold poles: hot coldNear the poles (high latitudes) the climate is colder, and on the tops of mountains (high elevations) the climate is also colder. Start with elevation e. Then modify it to an “equivalent” elevation. For this demo I used equivalent_elevation = 10*e*e + poles + (equator-poles) * sin(PI * (y / height)), and then I used equivalent_elevation instead of e to calculate biomes. I don’t think this is the best approach; I think you’ll need to experiment with formulas and tweak the parameters to make this work the way you want. There’s also a seasonal variation of climate. In summer and winter the northern and southern hemispheres get warmer and colder, but the equator doesn’t change as much. There’s lots more that can be done here, such as modeling prevailing wind and ocean currents and the biome’s effect on climate and the ocean’s moderating effect on temperatures. Islands# For some projects I want the boundaries of the map to be water. One way to do this is to generate a map as above and then reshape it. Looking from the side, what is stopping the map from being an island? The border areas that are on land need to be pushed down into water, and the center areas that are in water need to be pushed up to become land. Need this below waterNeed this above waterNeed this below waterHow does this work? There are two ingredients: A distance function assigns a distance to every position on the map, from 0 at the center to 1 at the border. A shaping function (as used in the Redistribution section) takes an elevation as input and chooses a new output elevation. At the center of the map (distance 0), we’ll use a shaping function that always outputs land. At the border of the map (distance 1), we’ll use a shaping function that always outputs water. In between, we’ll allow both land and water. For simplicity, I’ll assume the water level is 0.5, so ≥0.5 means land and <0.5 means water. Shaping function: linear conversionTo calculate the distance d, set nx = 2*x/width - 1 and ny = 2*y/height - 1. These will range from -1 to +1. Then choose one of these distance functions recommended by /u/KdotJPG[4]: Square Bump d = 1 - (1-nx²) * (1-ny²), when you have a square map and want to make the island fill as much of the space possible without reaching the borders. Euclidean² d = min(1, (nx² + ny²) / sqrt(2)), when you want the island to be round, and plan to embed it in a larger world. The simplest way to shape the elevation e is to linearly mix in 1-d. At the center of the map, d is 0, and we want the elevation to be high (1). At the edges of the map, d is 1, and we want the elevation to be low (0). Linear interpolation can do this: e = lerp(e, 1-d, mix), for some value of mix between 0 and 1. Move the mix slider to 0 to see the original map and move it to 1 to see the constraining shape. Linear shaping mix parameter:Distance function:0 for original, ½ for islands:New map 0.0 0.5 1.0Linear shaping function blends original noise and a fixed shapeThere are many more things to try. Try shifting the distance function up or down by adding a constant, or slope it more or less by multiplying by a constant, or change the exponent from 2 to 4 or 6. Try applying the elevation reshaping to only the lower frequency octaves of the noise generator, and allow the high frequencies to work equally across the map. Try choosing the amount of land area you want, and then push all elevations up or down until you get the desired island size. Try using noise to create the island shape but use some other approach to assign the elevation. Try using a lookup table to allow arbitrary (piecewise linear) reshaping or distance functions. It will take some experimentation to find a combination you like. Try non-linear shaping functions to mix e and 1-d. Ridged noise# Instead of raising the elevation to a power, we can use absolute value to create sharp ridges: function ridgenoise(nx, ny) { return 2 * (0.5 - abs(0.5 - noise(nx, ny))); } To add octaves, we can vary the amplitudes of the higher frequencies so that only the mountains get the added noise: e0 = 1 * ridgenoise(1 * nx, 1 * ny); e1 = 0.5 * ridgenoise(2 * nx, 2 * ny) * e0; e2 = 0.25 * ridgenoise(4 * nx, 4 * ny) * (e0+e1); e = (e0 + e1 + e2) / (1 + 0.5 + 0.25); elevation[y][x] = Math.pow(e, exponent); n=2 3 4 5 6 7I don’t have much experience with this technique and will have to play with it more to learn how to use it well. It might also be interesting to mix ridged low frequency noise with non-ridged high frequency noise. Terraces# If we round the elevation to the nearest of levels we get terraces: n=2 3 4 5 6 7"
