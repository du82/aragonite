title = "Making of: draggable handles"
full_description = "1 Sep 2014 For some of my projects I want the reader to drag something around on a diagram. I use the position to control some aspect of the diagram. The curved roads page[1] uses this. I want an easy way to constrain the ways you can drag something, and I also want a way to transform the variable being controlled into a position on the screen. I’m going to describe the implementation. Here’s an example of the kinds of things I want to be able to do: var model0 = {theta1: 0, radius2: 30, theta2: 0.2, slider1: 50, slider2: 3, x: 2, y: 1}; make_diagram(\"#begin\", polar(Model.constant(40), Model.ref(model0, 'theta1') .multiply(1/360) .multiply(9).rounded().multiply(1/9) .multiply(2*Math.PI) ) .offset([70, 50]), []); d3.select(\"#begin svg\").insert('circle', \":first-child\").attr('cx', 70).attr('cy', 50).attr('r', 40).attr('fill', \"none\").attr('stroke', \"#ddd\").attr('stroke-width', \"3px\"); for (var a = 0; a < 360; a += (360/9)) { d3.select(\"#begin svg\").insert('circle', \":first-child\").attr('cx', 70+40*Math.cos(a/180*Math.PI)).attr('cy', 50+40*Math.sin(a/180*Math.PI)).attr('r', 5).attr('fill', \"#ddd\"); } make_diagram(\"#begin\", polar(Model.ref(model0, 'radius2') .clamped(0, 90), Model.ref(model0, 'theta2') .clamped(-Math.PI/6, Math.PI/6)) .offset([500, 50]), []); d3.select(\"#begin svg\").insert('path', \":first-child\").attr('d', ['M', 500, 50, 'l', 90*Math.cos(-Math.PI/6), 90*Math.sin(-Math.PI/6), 'A', 90, 90, 0, 0, 1, 500+90*Math.cos(Math.PI/6), 50+90*Math.sin(Math.PI/6), 'z'].join(\" \")).attr('fill', \"#ddd\"); make_diagram(\"#begin\", cartesian(Model.constant(400), Model.ref(model0, 'slider1') .clamped(0, 80) .add(10)), []); d3.select(\"#begin svg\").insert('line', \":first-child\").attr('x1', 400).attr('y1', 10).attr('x2', 400).attr('y2', 90).attr('stroke', \"#ddd\").attr('stroke-width', \"3px\"); make_diagram(\"#begin\", cartesian(Model.constant(450), Model.ref(model0, 'slider2') .clamped(0, 4) .rounded() .multiply(20) .add(10)), []); d3.select(\"#begin svg\").insert('line', \":first-child\").attr('x1', 450).attr('y1', 10).attr('x2', 450).attr('y2', 90).attr('stroke', \"#ddd\").attr('stroke-width', \"3px\"); for (var y = 0; y <= 4; y++) { d3.select(\"#begin svg\").insert('line', \":first-child\").attr('x1', 440).attr('y1', 10 + 20*y).attr('x2', 460).attr('y2', 10 + 20*y).attr('stroke', \"#ddd\").attr('stroke-width', \"3px\"); } make_diagram(\"#begin\", cartesian(Model.ref(model0, 'x') .clamped(0, 4) .rounded() .multiply(30) .add(200), Model.ref(model0, 'y') .clamped(0, 2) .rounded() .multiply(30) .add(20)), []); for (var x = 0; x <= 4; x++) { for (var y = 0; y <= 2; y++) { d3.select(\"#begin svg\").insert('circle', \":first-child\").attr('cx', x*30+200).attr('cy', y*30+20).attr('r', 5).attr('fill', \"#ddd\"); } } I want to make things like this easy, with as little code as I can get away with. Let’s start at the beginning. The first thing that comes to mind is to have a function that takes the mouse position and sets an internal variable. I can have a separate function that takes the internal variable and sets the circle position. Let’s try this with a simple example: redraw(); d3.select(\"#handle\").call(d3.drag() .on('drag', on_drag_wrapper) .on('start', function() { d3.select(this).classed('dragging', true); }) .on('end', function() { d3.select(this).classed('dragging', false); })); function on_drag_wrapper() { on_drag(); var pre = d3.select(\"#intro + script + .org-src-container\"); pre.select(\".constant:nth-child(4)\").text(Math.round(model.position[0])); pre.select(\".constant:nth-child(5)\").text(Math.round(model.position[1])); } // TODO: the nth-child thing is very fragile as it depends on *emacs* font-locking but somehow it depends on the org-babel output which is different than what I see in the buffer; would be better to find the node with the initial value and then hold on to that node for updating. As of 2022 this hack fails entirely, and it's too bad, as it was a pretty cool effect. Maybe I should use a placeholder, and then I can grab the initial innerHTML (as emitted by emacs), then substitute the placeholder and update the innerHTML var position = [100, 50]; // internal variable function on_drag() { // set internal variable based on mouse position position = [d3.event.x, d3.event.y]; redraw(); } function redraw() { // set circle's position based on internal variable d3.select(\"#handle\") .attr(\"cx\", position[0]) .attr(\"cy\", position[1]); } d3.select(\"#handle\") // capture mouse drag event .call(d3.drag().on('drag', on_drag)); I used to use d3.js[2] for making my diagrams (v3 back in 2014 when I wrote this page, v4 later, then stopped using d3 in 2015), and it has a mouse drag api[3]. The code above is for d3 v4/v5. When you drag the mouse on an element, it’ll call the callback function. You can capture the mousedown, mousemove, and mouseup events (or better yet: pointer events[4]). In 2017 I made my own drag library so that I can use it outside of d3. In 2022 I greatly simplified it by using pointerevents, which got widespread support in 2020[5]. Once I pull out the ui-specific code, all I have left is a setter and getter function, which I put into an object: var model = { position: [100, 50], get: function() { return this.position; }, set: function(p) { this.position = p; } }; function on_drag() { model.set([d3.event.x, d3.event.y]); redraw(); } function redraw() { d3.select(\"#handle\") .attr('transform', \"translate(\" + model.get() + \")\"); } This seems like a trivial object. Why bother? Because I want to transform the position into something other than a simple internal variable. For example, I want to directly store the value in an object or array instead of always using the getter. Here’s a setter/getter pair that lets me do that: function ref(obj, prop) { return { get: function() { return obj[prop]; }, set: function(v) { obj[prop] = v; } }; }; // NOTE: I originally used the same code that I present to the reader, // but it didn't work well with the value display system I have, so I // ended up using this instead var model1 = {pos: [150, 25]}; make_diagram(\"#ref\", cartesian(ref(model1.pos, 0), ref(model1.pos, 1)), [['.constant:nth-child(5)', model1.pos, 0, '.0f'], ['.constant:nth-child(6)', model1.pos, 1, '.0f']]); var obj = {pos: [150, 25]}; var model = ref(obj, 'pos'); Sometimes I want to treat the x and y axes separately. Here’s a setter/getter pair that splits a point into x and y components: function cartesian(x, y) { return { get: function() { return [x.get(), y.get()]; }, set: function(p) { x.set(p[0]); y.set(p[1]); } }; }; var model2 = {x: 150, y: 25}; make_diagram(\"#cartesian\", cartesian(ref(model2, 'x'), ref(model2, 'y')), [[\".constant:nth-child(4)\", model2, 'x', '.0f'], [\".constant:nth-child(5)\", model2, 'y', '.0f']]); var obj = {x: 150, y: 25}; var model = cartesian(ref(obj, 'x'), ref(obj, 'y')); Once the components are split, I can transform them separately. Here’s a way to add bounds to a number, and a way to have a constant value: function clamped(m, lo, hi) { return { get: function() { return m.get(); }, set: function(v) { m.set(Math.min(hi, Math.max(lo, v))); } }; } function constant(v) { return { get: function() { return v; }, set: function(_) { } }; } I can combine these to make a horizontal slider. The x position stays within the range [0,200] and the y position is always 50: var model3 = {x: 25}; make_diagram(\"#hslider\", cartesian(clamped(ref(model3, 'x'), 0, 200), constant(50)), [[\".constant\", model3, 'x', '.0f']]); d3.select(\"#hslider svg\").insert('line', \":first-child\").attr('x1', 0).attr('y1', 50).attr('x2', 200).attr('y2', 50).attr('stroke', \"#ddd\").attr('stroke-width', \"3px\"); var obj = {x: 25}; var model = cartesian(clamped(ref(obj, 'x'), 0, 200), constant(50)); However, this isn’t really what I want. I want the handle’s position to start at 100 when the slider’s value is 0. To fix this, I can define something that lets me add 100 to the value: function add(m, a) { return { get: function() { return m.get() + a; }, set: function(v) { m.set(v - a); } }; } Let’s try it again: var model4 = {x: 25}; make_diagram(\"#hslider2\", cartesian(add(clamped(ref(model4, 'x'), 0, 200), 100), constant(50)), [[\".constant\", model4, 'x', '.0f']]); d3.select(\"#hslider2 svg\").insert('line', \":first-child\").attr('x1', 100).attr('y1', 50).attr('x2', 300).attr('y2', 50).attr('stroke', \"#ddd\").attr('stroke-width', \"3px\"); var obj = {x: 150}; var model = cartesian(add(clamped(ref(obj, 'x'), 0, 200), 100), constant(50)); The code is getting a little hard to read. Let’s turn these functions into methods that return new objects: function Model(init) { this.get = init.get; this.set = init.set; } Model.ref = /* static */ function(obj, prop) { return new Model({ get: function() { return obj[prop]; }, set: function(v) { obj[prop] = v; } }); }; Model.constant = /* static */ function(v) { return new Model({ get: function() { return v; }, set: function(_) { } }); }; Model.prototype.clamped = function(lo, hi) { var m = this; return new Model({ get: function() { return m.get(); }, set: function(v) { m.set(Math.min(hi, Math.max(lo, v))); } }); } Model.prototype.add = function(a) { var m = this; return new Model({ get: function() { return m.get() + a; }, set: function(v) { m.set(v - a); } }); } While I’m at it, I really want the value to go from 0 to 10 while the position goes from 100 to 300. I need a multiplier for that: Model.prototype.multiply = function(k) { var m = this; return new Model({ get: function() { return m.get() * k; }, set: function(v) { m.set(v / k); } }); } var model5 = {x: 5.00}; make_diagram(\"#hslider3\", cartesian(Model.ref(model5, 'x') .clamped(0, 10) .multiply(20) .add(100), Model.constant(50)), [[\".constant\", model5, 'x', '.2f']]); d3.select(\"#hslider3 svg\").insert('line', \":first-child\").attr('x1', 100).attr('y1', 50).attr('x2', 300).attr('y2', 50).attr('stroke', \"#ddd\").attr('stroke-width', \"3px\"); var obj = {x: 5}; var model = cartesian(Model.ref(model5, 'x') .clamped(0, 10) .multiply(20) .add(100), Model.constant(50)) That’s a bit easier to understand. Note that the order matters. If I had used add first and then clamped, it’d be different than using clamped and then add. Let’s make the x and y values sit on a grid by rounding the values to the nearest integer: Model.prototype.rounded = function() { var m = this; return new Model({ get: function() { return m.get(); }, set: function(v) { m.set(Math.round(v)); } }); } var model6 = {x: 2, y: 1}; make_diagram(\"#grid\", cartesian(Model.ref(model6, 'x') .clamped(0, 18) .rounded() .multiply(30) .add(30), Model.ref(model6, 'y') .clamped(0, 3) .rounded() .multiply(24) .add(15)), [[\".constant:nth-child(4)\", model6, 'x', '.0f'], [\".constant:nth-child(5)\", model6, 'y', '.0f']]); for (var x = 0; x <= 18; x++) { for (var y = 0; y <= 3; y++) { d3.select(\"#grid svg\").insert('circle', \":first-child\").attr('cx', x*30+30).attr('cy', y*24+15).attr('r', 5).attr('fill', \"#ddd\"); } } var obj = {x: 2, y: 1}; var model = cartesian(Model.ref(model6, 'x') .clamped(0, 18) .rounded() .multiply(30) .add(30), Model.ref(model6, 'y') .clamped(0, 3) .rounded() .multiply(20) .add(15)); How do I think about this code? The way I think of it is that I’m starting with the underlying value and transforming it into a pixel coordinate. I started with an x value and limited its range to 0…12. I multiply it by 30 and add 25 to it to scale and translate it to pixel coordinates. Alternatively, I could have first scaled and translated, then limited its range to the pixel range. I hope by now you see that there are lots of tiny modifiers that could be written to give a range of behaviors for these draggable handles. These objects go both directions. In the forwards direction, the getters transform the underlying value into a pixel coordinate, so that I can draw it. In the backwards direction, the setters transform pixel coordinates into the underlying values, so that I can handle mouse click/drag. Chaining simple things together can express many different patterns. Here’s one that makes a grid of polar coordinates. Can you imagine how it was made? var model7 = {radius: 1, angle: 0}; make_diagram(\"#end\", polar(Model.ref(model7, 'radius') .clamped(0, 4) .rounded() .multiply(15), Model.ref(model7, 'angle') .multiply(1/360) .multiply(5).rounded().multiply(1/5) .multiply(2*Math.PI) ) .offset([100, 50]), [[\".constant:nth-child(4)\", model7, 'radius', '.0f'], [\".constant:nth-child(5)\", model7, 'angle', '.0f']]); for (var r = 1; r <= 4; r++) { d3.select(\"#end svg\").insert('circle', \":first-child\").attr('cx', 100).attr('cy', 50).attr('r', r*15).attr('fill', \"none\").attr('stroke', \"#ddd\").attr('stroke-width', \"3px\"); } for (var a = 0; a < 360; a += (360/5)) { d3.select(\"#end svg\").insert('line', \":first-child\").attr('x1', 100).attr('y1', 50).attr('x2', 100+60*Math.cos(a/180*Math.PI)).attr('y2', 50+60*Math.sin(a/180*Math.PI)).attr('fill', \"none\").attr('stroke', \"#ddd\").attr('stroke-width', \"3px\"); } var model = {radius: 1, angle: 0}; I originally built some of this flexibility for a Flash demo that I never did much with, and I reused it for the curved roads page. I had add variable reference, constant, clamp, round, scalar, multiply scalar, add vector, scale vector, project along vector, cartesian decomposition, polar decomposition, and callback functions. It worked great for the Flash road demo, and it worked reasonably well but not perfectly for the curved roads article. Is there a name for this pattern? I don't know. I can't remember where I learned it. Maybe \"combinators\". There are some things that this system doesn't handle. There are several alternatives I could consider: An observer/observable system, so if I change the underlying value, it will automatically update. I'd be able to hook up multiple draggable handles to the same underlying values. (In 2018 I wrote more about this topic[6].) A separate constraint solver, instead of building object chains, so that I could specify the constraints separately in a declarative way. It's often better to specify things as data instead of code. Although the transformations are very generic, in practice most everything I do is a geometric transformation. It might be cleaner to separate geometric transformation from constraints. SVG transforms provide geometric transforms. Constraints are \"snap to nearest\" instead of rounding and bounding region instead of clamping. JQueryUI has snap/grid/range options[7] for drag and drop; MooTools does too[8]. Maybe that's a better model. <2025-01-14 Tue>Tom Larkworthy describes invertible functions for direct manipulation[9] using ObservableHQ. I'm always looking for things that let me get a lot of functionality for little code, and I think this fits the bill. I'm especially drawn to solutions (and games) where I combine several smaller pieces to produce complex behavior. I like this solution, but I'm also curious about other approaches, so I might try something else for a future project. However, in practice, I rarely use something general purpose like what'"
