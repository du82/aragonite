title = "Hexagonal Grids"
description = "Amit's guide to math, algorithms, and code for hexagonal grids"
full_description = '''Mar 2013, updated in Mar 2015, Apr 2018, Feb 2019, May 2020, Oct 2021, Dec 2022, Feb 2023, Oct 2024 This guide will cover various ways to make hexagonal grids, the relationships between different approaches, and common formulas and algorithms. I've been collecting hex grid resources[1] for over 25 years. I wrote this guide to the most elegant approaches that lead to the simplest code, starting from the guides by Charles Fu[2] and Clark Verbrugge[3]. Most parts of this page are interactive. To get an offline copy of this page, use your browser's File → Save As (preserves interactivity) or File → Print (loses interactivity). Geometry Coordinate systems Conversions Neighbors Distances Line drawing Range Rotation Reflection Rings and Spirals Field of view Hex to pixel Pixel to hex Rounding Map storage Wraparound maps Pathfinding More reading The code samples on this page are written in pseudo-code; they're meant to be easy to read and understand. The implementation guide has code in C++, Javascript, C#, Python, Java, Typescript, and more. This page includes interactive diagrams that require your browser to have SVG and Javascript enabled. Geometry# <div id="diagram-sizes" class="float-container"> <p>Hexagons are any 6-sided polygons. <em>Regular</em> hexagons have all the sides the same length. I'll assume all the hexagons we're working with here are regular.</p> <div class="float-right"><figure v-for="layout in layouts" style="display:inline-block;margin:0;width:20em;max-width:48%" v-bind:style="styleColors(layout)"><svg viewBox="-140 -125 250 255"><defs><radialGradient id="gradient-radial-gray"><stop offset="0%" stop-color="hsl(0,10%,95%)"></stop><stop offset="98%" stop-color="hsl(0,10%,97%)"></stop><stop offset="100%" stop-color="hsl(0,30%,93%)"></stop></radialGradient></defs><!-- title --><text y="-110" style="font-size:14px">{{layout.title}}</text><path transform="translate(-85,-120)" stroke="hsl(0,50%,50%)" stroke-width="2" stroke-endcap="round" fill="none" v-bind:d="layout.name === 'pointy'? 'M -8.6,5 L 0,0 L 8.6,5' : 'M -7.5,5.7 L -5,1.4 L 5,1.4 L 7.5,5.7'"></path><!-- hexagon with inner/outer circles --><g v-bind:transform="`rotate(${layout.rotation})`"><circle r="100" fill="url(#gradient-radial-gray)" stroke="none"></circle><a-hex style="stroke:hsl(0,10%,50%);fill:white"></a-hex><circle r="86" fill="url(#gradient-radial-gray)" stroke="none"></circle><circle v-if="show === 'circumradius'" r="100" fill="none" v-bind:stroke="colors.red" stroke-width="2"></circle><circle v-if="(show === 'height' &amp;&amp; layout.name === 'pointy') || (show === 'width' &amp;&amp; layout.name === 'flat')" r="100" fill="none" v-bind:stroke="colors.dark"></circle><circle v-if="show === 'inradius'" r="87" fill="none" v-bind:stroke="colors.red" stroke-width="2"></circle><circle v-if="(show === 'height' &amp;&amp; layout.name === 'flat') || (show === 'width' &amp;&amp; layout.name === 'pointy')" r="87" fill="none" v-bind:stroke="colors.dark"></circle></g><!-- height --><g class="measurement"><path class="axis" v-bind:d="`M 0,${-layout.height} l -125,0 M 0,${layout.height} l -125,0`" style="stroke:var(--heightColor)"></path><a-arrow v-bind:w="1.5" v-bind:skip="0" v-bind:A="{x:-110,y:0}" v-bind:b="{x:-110,y:-layout.height}" v-bind:withHead="true" style="stroke:var(--heightColor);fill:var(--heightColor)"></a-arrow><a-arrow v-bind:w="1.5" v-bind:skip="0" v-bind:A="{x:-110,y:0}" v-bind:b="{x:-110,y:layout.height}" v-bind:withHead="true" style="stroke:var(--heightColor);fill:var(--heightColor)"></a-arrow><text y="-118" text-anchor="middle" transform="rotate(-90)" style="font-size: 12px">{{heightLabel(layout)}}</text></g><!-- width --><g class="measurement"><path class="axis" v-bind:d="`M ${-layout.width},0 l 0,125 M ${layout.width},0 l 0,125`" style="stroke:var(--widthColor)"></path><a-arrow v-bind:w="1.5" v-bind:skip="0" v-bind:A="{x:0,y:110}" v-bind:b="{x:-layout.width,y:110}" v-bind:withHead="true" style="stroke:var(--widthColor);fill:var(--widthColor)"></a-arrow><a-arrow v-bind:w="1.5" v-bind:skip="0" v-bind:A="{x:0,y:110}" v-bind:b="{x:layout.width,y:110}" v-bind:withHead="true" style="stroke:var(--widthColor);fill:var(--widthColor)"></a-arrow><text y="126" text-anchor="middle" transform="rotate(0)" style="font-size: 12px">{{widthLabel(layout)}}</text></g><!-- circumradius --><g v-bind:transform="`rotate(${3*layout.rotation})`"><g fill="white" style="stroke:var(--circumradiusColor)" v-bind:stroke-width="1.5"><path d="M 0,0 l 100,0" v-bind:stroke-width="2.5"></path><circle cx="100" r="2"></circle></g><g fill="black" text-anchor="middle"><text x="42" v-bind:y="layout.name === 'flat'? 12 : -3" style="font-size:12px">{{show === 'circumradius'? show : "size"}}</text></g></g><!-- inradius --><g v-bind:transform="`rotate(${270-3*layout.rotation})`"><g fill="white" style="stroke:var(--inradiusColor)" v-bind:stroke-width="1.5"><path d="M 0,0 l 87,0" v-bind:stroke-width="2.5"></path><circle cx="87" r="2"></circle></g><g fill="black" text-anchor="middle"><text x="45" v-bind:y="layout.name === 'pointy'? 12 : -3" style="font-size:12px">{{show === 'inradius'? show : ""}}</text></g></g><!-- center --><a-circle-marker transform="scale(0.5)" style="fill:black"></a-circle-marker></svg></figure></div> <p>The size of a regular hexagon can be described by either the <hover-show show="inradius">inner circle</hover-show>, touching the edges, or the <hover-show show="circumradius">outer circle</hover-show>, touching the corners. On this page, I use the radius of the outer circle as the <b><code>size</code></b>. The <hover-show show="width">width</hover-show> and <hover-show show="height">height</hover-show> are defined in terms of the diameters of the two circles.</p> </div> Spacing# <div id="diagram-spacing" class="float-container"> <!-- legacy id: size-and-spacing --><div id="size-and-spacing"><p>Next we want to put several hexagons together.</p></div> <figure class="float-right"><svg viewBox="-300 -300 575 425"><g v-bind:class="$root.rotateClass" fill="white" stroke="black"><g v-for="hex in hexes" v-bind:transform="center(hex).transform"><a-hex></a-hex></g></g><g><line v-for="(line,index) in lines" v-bind:key="index" class="axis" v-bind:x1="line.x1" v-bind:y1="line.y1" v-bind:x2="line.x2" v-bind:y2="line.y2" v-bind:stroke-opacity="line.opacity"></line></g><g><text v-for="(line,index) in lines" v-bind:key="index" style="font-size:15px" dy="0.4em" v-bind:fill-opacity="line.opacity*line.opacity" v-bind:x="line.x1" v-bind:y="line.y1">{{line.label}}</text></g><g v-bind:class="$root.rotateClass"><g class="centers"><a-circle-marker v-for="(hex, index) in hexes" v-bind:key="index" v-bind:transform="center(hex).transform"></a-circle-marker></g><g class="corners"><a-circle-marker v-for="(hex, index) in corners" v-bind:key="index" v-bind:transform="center(hex).transform + 'scale(0.5)'"></a-circle-marker></g></g><g class="spacing"><a-measurement label="horizontal spacing" v-bind:awf="-3" v-bind:ahf="1" v-bind:bwf="0" v-bind:bhf="1" v-bind:awp="-4" v-bind:ahp="0.5" v-bind:bwp="0" v-bind:bhp="0.5"></a-measurement><a-measurement label="vertical spacing" v-bind:awf="3.5" v-bind:ahf="0" v-bind:bwf="3.5" v-bind:bhf="-4" v-bind:awp="3" v-bind:ahp="0" v-bind:bwp="3" v-bind:bhp="-3"></a-measurement></g><a-toggle-orientation transform="translate(275,125) scale(0.4)"></a-toggle-orientation></svg></figure><div> <p>In the <button v-bind:class="{highlight: orientation.layout === 'flat'}" v-on:click="orientation.layout = 'flat'">flat top</button> orientation, the horizontal distance between adjacent hexagons centers is <code><b>horiz</b> = 3/4 * width = 3/2 * size</code>. The vertical distance is <code><b>vert</b> = height = sqrt(3) * size</code>.</p> <p>In the <button v-bind:class="{highlight: orientation.layout === 'pointy'}" v-on:click="orientation.layout = 'pointy'">pointy top</button> orientation, the horizontal distance between adjacent hexagon centers is <code><b>horiz</b> = width = sqrt(3) * size</code>. The vertical distance is <code><b>vert</b> == 3/4 * height == 3/2 * size</code>.</p> <p>Some games use pixel art for hexagons that does not match an exactly regular polygon, and these formulas will have to be adjusted slightly. See the <a href="implementation.html">implementation guide</a> for details.</p> </div> </div> Angles# <div id="diagram-angles" class="float-container"> <div> <p>In a regular hexagon the interior angles are 120°. There are six “wedges”, each an equilateral triangle with 60° angles inside. Each corner is <code>size</code> units away from the <code>center</code>. In code:</p> <pre class="code">function {{orientation.layout}}_hex_corner(center, size, i): var angle_deg = 60 * i{{angleAdjust}} var angle_rad = PI / 180 * angle_deg return Point(center.x + size * cos(angle_rad), center.y + size * sin(angle_rad))</pre> </div> <figure class="float-right"><svg viewBox="-130 -120 255 245" style="max-width:19.1rem"><circle class="axis" r="100"></circle><g v-for="(corner, index) in cornerLabels" v-bind:key="'label'+index" v-bind:style="corner.style"><text dy="0.4em" style="font-size:10px">{{ corner.angle }}°</text></g><g v-bind:class="$root.rotateClass" fill="white" stroke="black"><a-hex></a-hex><path class="axis" v-bind:d="arcPath"></path><path class="axis" v-bind:d="dashedPath" style="fill: hsl(60,25%,90%)"></path><g transform="translate(85,8)"><a-text style="font-size:10px">60°</a-text></g><g transform="translate(52,65)"><a-text style="font-size:10px">60°</a-text></g><g transform="translate(18,8)"><a-text style="font-size:10px">60°</a-text></g><g transform="translate(-42,-75)"><a-text style="font-size:10px">120°</a-text></g><g v-for="(corner, index) in cornerMarkers" v-bind:key="'marker'+index" class="corners" v-bind:style="corner.style"><a-circle-marker transform="scale(0.5)"></a-circle-marker></g></g><a-toggle-orientation transform="translate(105,115) scale(0.2)"></a-toggle-orientation></svg></figure><div> <p>To fill a hexagon, gather the polygon vertices at <code>hex_corner(…, 0)</code> through <code>hex_corner(…, 5)</code>. To draw a hexagon outline, use those vertices, and then draw a line back to <code>hex_corner(…, 0)</code>.</p> <p>The difference between the two orientations is a rotation, and that causes the angles to change: <button v-bind:class="{highlight: orientation.layout === 'flat'}" v-on:click="orientation.layout = 'flat'">flat top</button> angles are 0°, 60°, 120°, 180°, 240°, 300° and <button v-bind:class="{highlight: orientation.layout === 'pointy'}" v-on:click="orientation.layout = 'pointy'">pointy top</button> angles are 30°, 90°, 150°, 210°, 270°, 330°. Note that the diagrams on this page use the y axis pointing <em>down</em> (angles increase clockwise); you may have to make some adjustments if your y axis points up (angles increase counterclockwise).</p> </div> </div> Coordinate Systems# Now let's assemble hexagons into a grid. With square grids, there's one obvious way to do it. With hexagons, there are multiple approaches. I like cube coordinates for algorithms and axial or doubled for storage. Offset coordinates# The most common approach is to offset every other column or row. Columns are named col (q). Rows are named row (r). You can either offset the odd or the even column/rows, so the horizontal and vertical hexagons each have two variants. <figure v-bind:id="id" class="offset-diagram"><a-svg><a-grid v-bind:hexes="grid" v-bind:setHighlight="setHighlight"><g slot-scope="props" v-bind:class="className(props.hex)"><a-hex></a-hex><a-text><tspan class="q-coord">{{props.hex.col}}</tspan>, <tspan class="r-coord">{{props.hex.row}}</tspan></a-text></g></a-grid></a-svg><figcaption v-html="caption"></figcaption></figure> Cube coordinates# Another way to look at hexagonal grids is to see that there are three primary axes, unlike the two we have for square grids. There's an elegant symmetry with these. Let's take a cube grid and slice out a diagonal plane at x + y + z = 0. This is a weird idea but it helps us with hex grid algorithms: 3D cartesian coordinates follow standard vector operations: we can add/subtract coordinates, multiply/divide by a scalar, etc. We can reuse these operations with hexagonal grids. Offset coordinates do not support these operations. 3D cartesian coordinates have existing algorithms like distances, rotation, reflection, line drawing, conversion to/from screen coordinates, etc. We can adapt these algorithms to work on hexagonal grids. <figure id="diagram-cube-to-hex" class="float-right" style="margin-bottom: 1em"><svg style="max-width:23.4rem;overflow:visible;contain:layout" viewBox="-420 -430 840 880"><g v-for="dir in 6" v-bind:key="'dir'+dir"><line v-bind:class="axis(dir).axis" v-bind:x2="axis(dir).x" v-bind:y2="axis(dir).y"></line><text dy="0.4em" v-bind:class="axis(dir).axis" v-bind:x="axis(dir).x2" v-bind:y="axis(dir).y2">{{axis(dir).label}}</text></g><g v-for="(cube, index) in cubes.filter(c =&gt; c.z === -3)" v-bind:key="'base'+index" v-bind:transform="position(cube)" fill="white" stroke="black"><polygon v-bind:points="hexagonPoints"></polygon></g><g v-for="(cube, index) in cubes" v-bind:key="index" v-bind:transform="position(cube)" v-bind:fill-opacity="opacity(cube)" v-bind:stroke-opacity="opacity(cube)" fill="white" stroke="black"><polygon class="top" v-bind:points="rhombusTop"></polygon><polygon class="left" v-bind:points="rhombusLeft"></polygon><polygon class="right" v-bind:points="rhombusRight"></polygon></g></svg><br><button class="sans-serif" v-on:click="phase = 1 - phase">{{['Switch to hexagons', 'Switch back to cubes'][phase]}}</button></figure> <div id="diagram-grid-cube" class="float-container"> <p>Study how the cube coordinates work on the hex grid. Selecting the hexes will highlight the cube coordinates corresponding to the three axes.</p> <figure class="float-right"><a-svg style="max-width:25.625rem" axes="-500,500,0.75"><a-grid v-bind:hexes="grid" v-bind:setHighlight="setHighlight"><g slot-scope="props" v-bind:class="className(props.hex)"><a-hex></a-hex><a-cube-label v-bind:labels="props.hex.len()===0? ['q','r','s']:[props.hex.q,props.hex.r,props.hex.s]"></a-cube-label></g></a-grid></a-svg></figure><ol> <li>Each direction on the cube grid corresponds to a <em>line</em> on the hex grid. Try highlighting a hex with <code class="r">r</code> at 0, 1, 2, 3 to see how these are related. The row is marked in blue. Try the same for <code class="q">q</code> (green) and <code class="s">s</code> (purple).</li> <li>Each direction on the hex grid is a combination of <em>two</em> directions on the cube grid. For example, <span class="orientation-northwest-north">{{layout === 'pointy'? "northwest" : "north"}}</span> on the hex grid lies between the <code class="s">+s</code> and <code class="r">-r</code>, so every step <span class="orientation-northwest-north">{{layout === 'pointy'? "northwest" : "north"}}</span> involves adding 1 to <code class="s">s</code> and subtracting 1 from <code class="r">r</code>. We'l'''
