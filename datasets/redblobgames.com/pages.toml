title = "Terrain shader experiments"
full_description = "28 Jul 2017 Table of Contents 1. Barycentric coordinates 2. Min and Max 3. Edges and stripes 4. Blended max 5. Corners 6. Noisy borders 7. Curved paths 7.1. Tiling 7.2. Properties 7.3. TODO Arcs and splines 8. Bonus: Prismatic colors 9. Conclusion Note: the /x/ series of posts on my site are mostly unpolished mini posts. I’m trying out a few different ideas for procedural map generation.For the polygon map generator[1] project back in 2010 I used Flash’s 2D vector graphics, which are similar in capability to HTML5’s Canvas vector graphics: lines of varying widths, polygons with fill and outline, bezier and arc curves. I wanted to explore what I might be able to do with GL shaders. With GL I primarily get triangles. There are lines, but line width other than 1 isn’t guaranteed to be supported in WebGL. There are no curves; I’d have to break things down into line segments, which I render as quads, which are rendered as two triangles. On the other hand, GL gives me three-point gradients and lots of other potentially useful features. In order to evaluate the capabilities for abstract map rendering (not 3d terrain), I tried some things, which I describe on this page. The main idea is to pass the barycentric coordinates into the fragment shader, along with the three vertex colors separately. I can then do something other than the standard three-point gradient. This idea seemed obvious to me so I checked forums, stackoverflow, etc., and found that many other people have had the same idea, often for making wireframes. So that’s a good sign that I’m not barking up the wrong tree. 1 Barycentric coordinates# Let’s start with the standard OpenGL triangle example: What’s going on here? If you pass in three colors at the three vertices, OpenGL will interpolate the colors smoothly. The barycentric coordinates[2] tell you how much of each color is being mixed at any position in the triangle. The red and magenta corners are (1, 0, 0); the green and yellow corners are (0, 1, 0); the blue and cyan corners are (0, 0, 1). The center of the triangle is (1/3, 1/3, 1/3). The midpoints are (1/2, 1/2, 0), (0, 1/2, 1/2), and (1/2, 0, 1/2). Here are the three separate coordinates: I want to use the barycentric coordinates to make other effects, which would be useful for my map generator’s renderer. 2 Min and Max# Instead of interpolating, I can color based on the min or max coordinate: I’m going to draw them as distance fields instead, because that’ll come in handy later when we want to make stripes: I can use them like this: The min diagram lets me put a color on the points closest to an edge. In my map generator, that’ll be mountain ridges. The max diagram lets me put a color on the points closest to a vertex. In my map generator, that’ll be biome colors. 3 Edges and stripes# If I test for the barycentric coordinate being between two values, I can make a stripe, sometimes at the edge of the triangle. A stripe in the middle of the triangle could be useful to draw borders around biomes. Some people use stripes of the min or max of the coordinates for wireframes. The sum of two coordinates looks the same an individual coordinate. The difference of two coordinates gives me stripes different from a single coordinate: The product of two coordinates does not look useful: The ratio of two coordinates might be useful: 4 Blended max# In between regular linear interpolation and max you can get other blends by raising the weight to a power. In the limit, at infinity, it’s the same as max. This will give some options for blended biome borders. However, high exponents don’t work well across platforms, probably because raising things to high exponents loses precision somewhere. There are probably lots of other useful blending approaches. I should look at all the functions from Inigo Quilez[3]. 5 Corners# I can use a biased max, max(r + w, g, b), to shift the red region in and out: Subtracting these, I can make any of these stripes: This seems potentially useful for rivers or roads, or borders between biomes. I also tried the weighted max, max(w * r, g, b), but the stripe wasn’t uniform width. (However the stripes won’t be uniform width anyway once the triangles aren’t equilateral, so maybe it doesn’t matter that much…) I think it may be simpler to build this by taking the union and intersection of stripes. I haven’t tried that yet. 6 Noisy borders# Use the biased max, but use a noise parameter for the bias for all three channels. This could produce more interesting biome boundaries. For this demo I’m using the GLSL noise functions from Morgan McGuire, BSD licensed, found in this shadertoy[4]. Another place you can get GLSL noise functions is the webgl-noise library[5], MIT licensed. 7 Curved paths# I’d like to have curved paths, especially for rivers. Let’s take two straight segments and blend them together in various ways: Cool patterns. Are they useful? 7.1 Tiling# The curved paths look interesting but they need to tile across triangles of various shapes and sizes. These don’t tile. 7.2 Properties# What do I need here? Approximately constant width Lines perpendicular to the edges Both are hard, but the harder problem is requirement (2). Here’s the third distance function drawn with several different triangle shapes: It’s perpendicular to the edges in the first shape but not the second or third. Making the line perpendicular to the edge depends on the triangle geometry so there isn’t going to be a single pattern here that works across all triangles. I’m going to move on, and return to this problem later. It’s possible I can find some other simpler approach and not deal with these in shaders. 7.3 TODO Arcs and splines I think I need to construct an arc or spline for each triangle, and write a shader that takes extra parameters that control the shape. GPU Gems chapter 25[6] is about splines in shaders. I should read that. 8 Bonus: Prismatic colors# The cool-looking prismatic color model[7] uses barycentric coordinates divided by the max of them: See the paper about the prismatic color space[8] (mirror). This isn’t related to my map generation project but I thought it looked cool and wanted to share. 9 Conclusion# Here are some triangles that might be in the delaunay triangulation for a map: If I assign a biome at each vertex, I can draw the biomes with smooth transitions… …but for some game maps I may want to make the transitions more pronounced, which I can do with soft transitions… …or with hard transitions… …or with noisy transitions… …and/or with border lines: It will be some more work to make the border lines have constant width. I need to re-read IQ’s page on voronoi lines[9]. Overall, this is kind of cool, and it works nicely for biomes. The noisy transitions in particular are much cheaper this way than inserting hundreds of vertices into each polygon. I’m not sure if I’ll end up using it though. It’s pretty early in our game’s development and we haven’t decided everything about the maps. In my code I had to make one copy of each vertex per triangle (instead of sharing as we normally would want to do) so that I could pass in a different barycentric value for each triangle. Newer GPUs have a feature called GL_EXT_fragment_shader_barycentric[10] that will include these without you having to duplicate vertices, but I don’t expect these will be available in WebGL anytime soon. Source code for making the diagrams: terrain-shader-experiments.js"
