full_description = "This IBM Redpaper publication is a comprehensive guide that covers the IBM Power E1050 (9043-MRX) server. The Power E1050 uses the latest IBM Power10 processor-based technology and supports IBM AIX® and Linux operating systems (OSs). The goal of this paper is to provide an analysis of the hardware architecture and highlight the changes, new technologies, and major features that are being introduced in this system, such as: The latest IBM Power10 processor design, including the dual-chip module (DCM) packaging, which is available in various configurations (12 - 24 cores per socket). Native Peripheral Component Interconnect Express (PCIe) 5th generation (Gen5) connectivity from the processor socket to deliver higher performance and bandwidth for connected adapters. Open Memory Interface (OMI) connected Differential Dual Inline Memory Module (DDIMM) memory cards delivering increased performance, resiliency, and security over industry-standard memory technologies, Transparent memory encryption that uses on-chip encryption acceleration to provide a high lever of security without a performance impact. Enhanced internal storage performance by using native PCIe-connected Non-volatile Memory Express (NVMe) devices in up to 10 internal storage slots to deliver up to 64 TB of high-performance, low-latency storage in a single 4-socket system. Consumption-based pricing in the IBM Power Private Cloud with Shared Utility Capacity commercial model enables customers to consume resources more flexibly and efficiently, including AIX, Red Hat Enterprise Linux (RHEL), SUSE Linux Enterprise Server, and Red Hat OpenShift Container Platform workloads. This publication is for professionals who want to acquire a better understanding of IBM Power products. The intended audience includes the following roles: This edition adds information about important new technology advancements that were introduced since the original announcement of the Power E1050: A new PCIe Gen4 I/O Expansion Drawer that provides improved throughput and performance for attached devices."
