title = "IBM Data Server Manager Overview and Performance Analysis"
description = """
IBM® Data Server Manager is a web-based, integrated database management tools platform that manages IBM DB2® for Linux, UNIX, Windows, and IBM z/OS® databases. With IBM Data Server Manager, you can monitor, analyze, tune, and administer DB2 databases.
  ..."""
full_description = "IBM® Data Server Manager is a web-based, integrated database management tools platform that manages IBM DB2® for Linux, UNIX, Windows, and IBM z/OS® databases. With IBM Data Server Manager, you can monitor, analyze, tune, and administer DB2 databases. This IBM Redbooks® Analytics Support web doc describes ways to do performance analysis that can be used to drill down into SQL performance to understand the underlying issues and take corrective measures to optimize the outcome. This document provides an overview of Data Server Manager and includes information that helps Data Server Manager administrators to troubleshoot SQL performance issues. Overview IBM® Data Server Manager is a simple and intuitive database administrator (DBA) tool for monitoring, analyzing, tuning, and administrating IBM DB2® for Linux, UNIX, Windows databases. It is easy to install (it can be installed as a non-root user) and can be running in few minutes. A web browser serves as the client to provide users insights into the databases. You can use IBM Data Server Manager to monitor both DB2 for IBM z/OS® databases and IBM BigInsights® by using the IBM Big SQL technology. Along with the cloud databases, this function makes IBM Data Server Manager one of the premiere tools to help manage and monitor many different IBM platforms. There are two editions that are available: The material included in this document is in DRAFT form and is provided 'as is' without warranty of any kind. IBM is not responsible for the accuracy or completeness of the material, and may update the document at any time. The final, published document may not include any, or all, of the material included herein. Client assumes all risks associated with Client's use of this document."
