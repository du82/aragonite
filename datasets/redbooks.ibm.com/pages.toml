["https://redbooks.ibm.com/Redbooks.nsf/pages/power9"]
title = "IBM Redbooks highlighting POWER9 processor-based technology | IBM Redbooks"
description = "IBM's new Power System E980 and E950 servers top off the POWER9 family with scalability of up to 64 TB of memory, up to 192 POWER9 technology based processor cores, and PCIe Gen4 I/O expandability. They are designed for industry leading reliability, scalability, serviceability, and manageability."
full_description = "IBM Redbooks highlighting POWER9 processor-based technology IBM's new Power System E980 and E950 servers top off the POWER9 family with scalability of up to 64 TB of memory, up to 192 POWER9 technology based processor cores, and PCIe Gen4 I/O expandability. They are designed for industry leading reliability, scalability, serviceability, and manageability. The following enterprise and scale-out Technical Overview and Introduction Redpapers provide more information about key IBM Power System server offerings: Enterprise servers: secure, available, and designed for your largest workloads IBM Power Systems E980 This IBM® Redpaper™ publication gives a broad understanding of a new architecture of the IBM Power System E980 server that support IBM AIX®, IBM i, and Linux operating systems. The objective of this paper is to introduce the major innovative Power E980 offerings and relevant functions: IBM Power System E980: Technical Overview and Introduction, Redpaper Show me more The IBM POWER9™ processor, which is available at frequencies of 3.55 to 4.0 GHz.Significantly strengthened cores and larger cachesSupports up to 64 TB memoryIntegrated I/O subsystem and hot-pluggable Peripheral Component Interconnect® Express (PCIe) Gen4 slots, double the bandwidth of Gen3 I/O slots.Supports EXP12SX, ESP24SX external disk drawers, which has 12Gb SAS interfaces and double the existing EXP24S drawer bandwidth.New IBM EnergyScale™ technology offers new variable processor frequency modes that provide a significant performance boost beyond the static nominal frequency. IBM Power System E950 The following IBM® Redpaper™ publication gives a broad understanding of a new architecture of the IBM Power System E950 server that support IBM AIX®, and Linux operating systems. The objective of this paper is to introduce the major innovative Power E950 offerings and relevant functions: IBM Power System E950: Technical Overview and Introduction, Redpaper Show me more The IBM POWER9™ processor, which is available at frequencies of 2.8 - 3.4 GHz. Significantly strengthened cores and larger caches. Supports up to 16 TB memory, which is 4 times more than the POWER8® E850.Integrated I/O subsystem and hot-pluggable Peripheral Component Interconnect® Express (PCIe) Gen4 slots, double the bandwidth of Gen3 I/O slots. Supports EXP12SX, ESP24SX external disk drawers, which has 12Gb SAS interfaces and double the existing EXP24S drawer bandwidth. New IBM EnergyScale™ technology offers new variable processor frequency modes that provide a significant performance boost beyond the static nominal frequency. Accelerated servers: The premier GPU acceleration platform IBM Power System IC922 Engineered for AI inference, the IBM Power System IC922 provides the compute-intensive and low-latency infrastructure you need to unlock business insights from trained AI models. The POWER9-based Power IC922 provides advanced interconnects (PCIe Gen4, OpenCAPI) to support faster data throughput and decreased latency. Accelerated, the Power IC922 supports up to six NVIDIA® T4 Tensor Core GPU accelerators. IBM Power System IC922 Technical Overview and Introduction, Redpaper Show me more The Power IC922 server is built to deliver powerful computing, scaling efficiency, and storage capacity in a cost-optimized design to meet the evolving data challenges of the AI era, and include the following features: High throughput and performance for high-value Linux workloads, such as inferencing data or storage rich workloads, or cloudPotentially low acquisition cost through system optimization such as utilizing industry standard memory and warrantyTwo IBM POWER9 processor single-chip module (SCM) devices that provide high performance with 24, 32, or 40 fully activated cores and maximum 2 TB of memoryUp to six NVIDIA T4 GPU acceleratorsUp to 24 2.5 inch SAS/SATA drivesOne dedicated and one shared 1 Gb Intelligent Platform Management Interface (IPMI) port. IBM Power System AC922 IBM Power System AC922 server (8335-GTH and 8335-GTX models) is the next generation of the IBM POWER® processor-based systems, which are designed for deep learning (DL) and artificial intelligence (AI), high-performance analytics, and high-performance computing (HPC). IBM Power System AC922 Technical Overview and Introduction, Redpaper This paper introduces the major innovative Power AC922 server features and their relevant functions: Show me more Powerful IBM POWER9™ processors that offer up to 22 cores at up to 2.80 GHz (3.10 GHz turbo) performance with up to 2 TB of memory.IBM Coherent Accelerator Processor Interface (CAPI) 2.0, IBM OpenCAPI™, and second-generation NVIDIA NVLink 2.0 technology for exceptional processor to accelerator intercommunication.Up to six dedicated NVIDIA Tesla V100 graphics processing units (GPUs). Scale-out servers: future-forward flexible infrastructure Scale-out AIX, IBM i and Linux servers Power Systems are focused on reliability and performance. The updated scale-out servers use IBM POWER9 processor-based technology, which is a technology that is designed for data-intensive workloads, such as operational databases, advanced analytics, and business applications. The new IBM Power Systems scale-out servers, which are powered by PCIe Gen4 switches, deliver seamless and lightspeed throughput I/O among multiple on-premises and public clouds applications, and cloud-like agility and economics by supporting IBM Power Enterprise Pools 2.0. IBM Power Systems S922, S914, and S924 Technical Overview and Introduction Featuring PCIe Gen 4 Technology, Redpaper Show me more Gain faster insights from your data with up to 4 TB of in-memory database capabilities for SAP HANA, IBM Db2(R), Oracle, and a variety of open-source databases in the Power S924 and Power S922 systems. Use this cloud-enabled server to build an agile, containerized cloud on a server platform that is optimized for data and cognitive services Has twice the bandwidth for seamless integration be