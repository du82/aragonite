full_description = "Authors: Simon Cambridge, Lakshmana Ekambaram, Stephen D Gawtry, Vasfi Gucer, Audrey Holloman, Frank Ketelaars, Darren King, Karen Medhat, Mark Moloney, Payal Patel, Neil Patterson, Deepak Rangarao, Mark Simmonds, Malcolm Singh, Tamara Tatian and Henry L Quach IBM Cloud Pak for Data platform is a unified, integrated and collaborative data and artificial intelligence (AI) platform that helps organizations collect, organize, and analyze data and infuse AI within and across business process and applications. Its ultimate goal is to deliver deeper business insights that enable smarter business outcomes. IBM Cloud Pak for Data delivers a set of capabilities core to a data fabric. A data fabric can help organizations improve productivity and reduce complexities when accessing, managing, and understanding disparate, siloed data that is distributed across a hybrid cloud landscape. The platform offers a wide selection of IBM and third-party services that span the entire data lifecycle. Deployment options include an on-premises software version that is built on the Red Hat OpenShift Container Platform, and a fully or partially managed version that can run on the IBM Cloud, and other hyper-scalers, such as Amazon Web Services (AWS) and Microsoft Azure. This IBM Redbooks publication provides a broad understanding of the IBM Cloud Pak for Data concepts and architecture, and the services that are available in the product. In addition, several common use cases and hands-on scenarios are included that help you better understand the capabilities of this product. This publication is for IBM Cloud Pak for Data customers who seek best practices and real-world examples of how to best implement their solutions while optimizing the value of their existing and future technology, data, and skills investments."
