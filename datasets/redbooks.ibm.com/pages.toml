full_description = "IBM® Data Server Manager is a web-based, integrated database management tools platform that manages IBM Db2® and IBM Db2 for z/OS® databases. With IBM Data Server Manager, you can manage and administer IBM Db2 Analytics Accelerator (Accelerator). This IBM Redbooks® Analytics Support web document describes the various functions that are available in Data Server Manager to manage the Accelerator server. This document is targeted at database administrators who work with IBM Db2 Analytics Accelerator. It applies to IBM Data Server Manager Version 2.1.5 and later. IBM® Data Server Manager is a web-based, integrated database management tools platform that manages IBM Db2® and IBM Db2 for z/OS® databases. With IBM Data Server Manager, you can manage and administer IBM Db2 Analytics Accelerator (Accelerator). This IBM Redbooks® Analytics Support web document describes the various functions that are available in IBM Data Server Manager to manage the Accelerator server. This document is targeted at database administrators who work with IBM Db2 Analytics Accelerator. It applies to IBM Data Server Manager Version 2.1.5 and later. Overview This document provides an overview of all Accelerator-related management and administration functions available in IBM Data Server Manager 2.1.5. IBM Data Server Manager is a simple and intuitive database administration (DBA) tool for monitoring, administering, and tuning IBM Db2 for z/OS databases. It can be installed easily in three clicks (as a non-root user), so IBM Data Server Manager can be up and running in a matter of seconds. A web browser serves as the client that gives users access to the databases. With the ability to also manage and monitor IBM Db2, IBM BigInsights®, and cloud databases, IBM Data Server Manager has become the core of the IBM database management platform. Unlike the existing Eclipse-based Data Studio and the Accelerator studio that need to be installed on every client workstation, IBM Data Server Manager is installed on a web server. One installation can be accessed by multiple users through a web browser. IBM Data Server Manager connects to Db2 for z/OS by using a JDBC connection through the DDF port. IBM Data Server Manager Base Edition can be downloaded at no charge and offers limited functionality for database administration, IBM Db2 Analytics Accelerator administration, and basic query tuning functionality. Full support for query tuning and configuration management can be added with product licenses for IBM Db2 Query Workload Tuner for z/OS V5.x and IBM DB2 Configuration Manager V4.1.x. Additional advanced capabilities for Db2 for z/OS users are available as one-time charge (OTC) offerings from various Db2 for z/OS tools and solutions. Summary The document provides an overview of these topics:"
