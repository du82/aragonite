description = "IBM® watsonx™ is IBM’s strategic AI and data platform. This book focuses on watsonx.ai, one of the three main components of the platform. IBM watsonx.ai is a next-generation enterprise studio that you can use to train, validate (test), tune, and deploy ..."
full_description = "Authors: Deepak Rangarao, Phillip Gerrard, Charley Beller, Carl Broker, Daniele Comi, Lakshmana Ekambaram, Shuvanker Ghosh, Karen Medhat, Payal Patel, Matthew Price, Shirley Shum and Mark Simmonds IBM® watsonx™ is IBM’s strategic AI and data platform. This book focuses on watsonx.ai, one of the three main components of the platform. IBM watsonx.ai is a next-generation enterprise studio that you can use to train, validate (test), tune, and deploy both traditional ML and new gen AI capabilities, which are powered by FMs through an open and intuitive user interface (UI). This AI studio provides a range of FMs, training and tuning tools, and a cost-effective infrastructure that facilitates the entire data and AI lifecycle, from data preparation through model development, deployment, and monitoring. The studio also includes an FM library that provides IBM® curated and trained FMs. FMs use a large, curated set of enterprise data that is backed by a robust filtering and cleansing process, and with an auditable data lineage. These models are trained on language and other modalities, such as code, time-series data, tabular data, geospatial data, and IT events data. fm.code: Models that automatically generate code for developers through a natural-language interface to boost developer productivity and enable the automation of many IT tasks. fm.NLP: A collection of large language models (LLMs) for specific or industry-specific domains that use curated data to help mitigate bias and quickly make domains customizable by using client data. fm.geospatial: Models that are built on climate and remote sensing data to help organizations understand and plan for changes in natural disaster patterns, biodiversity, land use, and other geophysical processes that might impact their businesses The watsonx.ai studio builds on Hugging Face open-source libraries, which offer thousands of Hugging Face open models and datasets. Users can leverage the power of IBM Granite LLMs, along with the latest Mistral, Llama, and other third-party LLMs. It is part of IBM's commitment to deliver an open ecosystem approach that enables users to leverage the best models and architecture for their unique business needs."
