title = "Developing a RESTful Web application for Liberty in CICS"
description = """
This course provides a step-by-step guide for creating a simple RESTful Java application, then deploying it into WebSphere Liberty running in IBM CICS Transaction Server. Topics covered include:
 
 Concepts and terms used in Java and RESTful ..."""
full_description = "This course provides a step-by-step guide for creating a simple RESTful Java application, then deploying it into WebSphere Liberty running in IBM CICS Transaction Server. Topics covered include: An overview of this course, with an introduction to the overall learning objectives and the application we will create in CICS. Lecture 1: Getting started with Java application development in a CICS Liberty environment (1 min 42 secs) This lecture provides an introduction to the course, explaining at a high-level the application we will be creating, and some important pre-requisites. This section covers the creation and configuration of a workstation development environment, suitable for the development of CICS Java applications. The IDE is also configured to remotely manage the CICS environment. An introduction to the Eclipse development environment and IBM Explorer for z/OS. Provides a high-level description of Eclipse, IBM Explorer for z/OS, and the CICS Explorer SDK, along with information on the installation options available. Provides a simple guide to configuring your Eclipse development environment. This includes the download, install, and configuration of the IDE in order to successfully compile CICS Java applications. A step-by-step guide for configuring your workstation CICS Explorer instance to connect to a remote z/OS system in order to deploy Java applications into CICS. This section provides a general overview of Liberty in CICS and how the JVM server sits within a CICS address space. We then look in more detail at configuring and managing a Liberty JVM server in CICS, suitable for deploying our simple application. This lecture provides an overview of the purpose of a Liberty JVM server, along with a demonstration of how the Liberty JVM server runs inside CICS. In this lecture, we create the CICS and zFS definitions required in order to create a Liberty JVM server. Step-by-step guides correctly configure the CICS SIT parameters, CICS resource definitions, and zFS configuration files, in order to successfully initialize a Liberty JVM server in CICS."
