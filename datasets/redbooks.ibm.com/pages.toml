title = "IBM TS7700 R5.4 Guide"
description = "This IBM® Redbooks® publication covers IBM TS7700 R5.4 and R5.4 PGA1. The IBM TS7700 is part of a family of IBM Enterprise tape products. This book is intended for system architects and storage administrators who want to integrate their storage systems ..."
full_description = "Authors: Larry Coyne, Yuki Asakura, Dave Brettell, Ramon A. Minjares Campos, Nielson Nino de Carvalho, Andrew Enriquez, Rin Fujiwara, Nobuhiko Furuya, Lourie Goodall, Joe Hew, Kousei Kawamura, Stefan Neff, Takeshi Nohta, Tomoaki Ogino, Shinya Ohri, Aderson Pacini, Daniel Riggins, Trinidad Armando Rangel Ruiz, Michael Scott. Taisei Takai, Nao Takemura, Erina Tatsumi, Takahiro Tsuda, Shinsuke Ueyama and Chen Zhu This IBM® Redbooks® publication covers IBM TS7700 R5.4 and R5.4 PGA1. The IBM TS7700 is part of a family of IBM Enterprise tape products. This book is intended for system architects and storage administrators who want to integrate their storage systems for optimal operation. Building on over 25 years of experience, the R5.4 release includes many features that enable improved performance, usability, and security. Highlights include the IBM TS7700 Advanced Object Store, an all flash TS7770, grid resiliency enhancements, and Logical WORM retention. By using the same hierarchical storage techniques, the TS7700 (TS7770 and TS7760) can also off load to object storage. Because object storage is cloud-based and accessible from different regions, the TS7700 Cloud Storage Tier support essentially allows the cloud to be an extension of the grid. As of this writing, the TS7700C supports the ability to off load to IBM Cloud® Object Storage, and Amazon S3. This publication explains features and concepts that are specific to the IBM TS7700 as of release R5.3. The R5.3 microcode level provides IBM TS7700 Cloud Storage Tier enhancements, IBM DS8000 Object Storage enhancements, Management Interface dual control security, and other smaller enhancements. The R5.3 microcode level can be installed on the IBM TS7770 and IBM TS7760 models only."
