full_description = "At IBM, we feel that it is important to recognize the commitment IBM Redbooks authors have made to increase their knowledge, enhance their skills, impress us with their creativity, or evangelize our solutions. Starting in 2017, successful completion of an IBM Redbooks residency that publishes either an IBM Redbooks or IBM Redpaper material you authored makes you eligible to earn an IBM Digital Badge. After you complete the requirements to earn a badge, we submit your data and begin badge processing. Note: If you are an author who had an IBM Redbooks or Redpaper material published prior to 2017, refer to the FAQ section for additional information to see if you are eligible for a badge. Silver is the first plateau in our badge program. To earn an IBM Redbooks Silver Author badge, successfully participate in and complete an IBM Redbooks Residency that publishes either an IBM Redbooks or IBM Redpaper publication. You must be listed as an author for the publication. The residency announcement contains any requirements and skills that are required for the project. Your project leader and residency coordinator can answer any questions that are specific to a project. The badge submission process is automatic with no additional steps that are required by you. Gold is the second plateau in our badge program. To earn an IBM Redbooks Gold Author badge, you must earn a Silver badge, and successfully participate in and complete an IBM Redbooks Residency that publishes your third IBM Redbooks or IBM Redpaper publication. You must be listed as an author for the publication. The residency announcement contains any requirements and skills that are required for the project. Your project leader and residency coordinator can answer any questions that are specific to a project. Remind your residency coordinator that the residency you are on makes you eligible for the Gold badge. Your prior contributions will be validated using our residency and publication data. Platinum is the third and highest plateau in our badge program. To earn an IBM Redbooks Platinum Author badge, you must earn a Gold badge, and successfully participate in and complete an IBM Redbooks Residency that publishes your sixth IBM Redbooks or IBM Redpaper publication. You must be listed as an author for the publication. The residency announcement contains any requirements and skills that are required for the project. Your project leader and residency coordinator can answer any questions that are specific to a project. Remind your residency coordinator that the residency you are on makes you eligible for the Platinum badge. Your prior contributions will be validated using our residency and publication data."
