["https://redbooks.ibm.com/abstracts/crse0303.html"]
title = "Introduction to CICS"
description = "Without knowing it, you’ve probably interacted with CICS already today. Perhaps you checked your bank balance or bought a bagel for breakfast? CICS is used by enterprises to provide the services that the world depends on, but you may have never even ..."
full_description = "Without knowing it, you’ve probably interacted with CICS already today. Perhaps you checked your bank balance or bought a bagel for breakfast? CICS is used by enterprises to provide the services that the world depends on, but you may have never even heard of it before. This course introduces CICS, an unparalleled mixed language application server. We explore what an application server is, what it provides to developers and what distinguishes CICS as a mixed language application server. Through the use of a illustrative application, we explain how CICS can provide shared programming contexts such as reliability, scalability, security and monitoring to applications written in a variety of programming languages - from Java Enterprise Edition to COBOL. This lecture provides an introduction to the course, explaining at a high-level the aims of the course. CICS can be described as a mixed language application server. This section explores what that actually means, the benefits it provides to business applications and CICS role in an enterprise. This lecture introduces the concept of a mixed language application server, and describes who uses CICS and why they use it. Describing CICS as a mixed language application server only makes sense if you understand what an application server is. This lecture discusses in more detail what an application server is by describing an example application and how that uses an application server to solve some common development concerns. Application servers like CICS provide a set of capabilities to the applications that they run. In this section we will describe some of these key services and explain how CICS differentiates itself from other single language application servers This lecture describes how an application server provides mechanisms allowing your applications to be accessed over many different integration technologies such as through RESTful JSON. Security is a major concern for enterprise applications. How are you going to ensure that you know who your users are and how are you going to keep their data away from prying eyes? This lecture looks at the capabilities provided by an application server that help you to secure your application."
year_published = 2025
