title = "IBM TS7700 R5.4 Cloud Storage Tier Guide"
description = "Building on 25 years of virtual tape experience, the IBM® TS7700 (IBM TS7760 and TS7770) now can store virtual tape volumes in object storage. This IBM Redpaper publication helps you set up and configure the cloud object storage support for IBM Cloud® ..."
