full_description = "When changing IBM® InfoSphere® Information Server to authenticate with Lightweight Directory Access Protocol (LDAP), consider several aspects before making the switch. This document discusses the two types of LDAP registries, what to consider when deciding which registry is best for your company, what information is needed for the configuration, and what else can be done to optimize the configuration. This IBM Rebooks® Analytics Support Web Doc applies to IBM InfoSphere Information Server versions 9.1 through 11.5. This document is intended for systems and InfoSphere Information Server administrators who are considering switching InfoSphere Information Server to authenticate with LDAP. Most companies today have one or more types of LDAP installed for authentication; IBM® Tivoli® Directory Server, Active Directory, OpenLDAP, and others. In many cases, having IBM InfoSphere® Information Server use that same LDAP domain for its authentication is beneficial. In this way, user administration becomes easier because there is a single set of users and passwords to maintain. As simple as this might sound, you must consider many questions before switching to LDAP with InfoSphere Information Server. The material included in this document is in DRAFT form and is provided 'as is' without warranty of any kind. IBM is not responsible for the accuracy or completeness of the material, and may update the document at any time. The final, published document may not include any, or all, of the material included herein. Client assumes all risks associated with Client's use of this document."
