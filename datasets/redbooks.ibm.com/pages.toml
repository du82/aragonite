title = "Creating OpenShift Multiple Architecture Clusters with IBM Power"
description = "The release of Red Hat OpenShift 4.14 brought the OpenShift Container Platform Multiple-Architecture Compute feature to IBM Power. Multi-Arch Compute provides a single heterogeneous cluster, enabling fit-for-purpose computing so clients can align tasks ..."
full_description = "Authors: Tim Simon, Sambasiva Andaluri, Ivaylo Bozhinov, Carlos Jorge Cabanas Aguero, Carlo Castillo, Paul Chapman, Mandar Dixit, Pete Dragovich, Gayathri Gopalakrishnan, Vikash Gupta, Munshi Hafizul Haque, Youssef Largou, Mikhail Nikitin, Gabriel Padilla, Vinay Rajagopal, Borislav Ivanov Stoymirski, Sundaragopal Venkatraman and Henry Vo The release of Red Hat OpenShift 4.14 brought the OpenShift Container Platform Multiple-Architecture Compute feature to IBM Power. Multi-Arch Compute provides a single heterogeneous cluster, enabling fit-for-purpose computing so clients can align tasks and applications to CPU strengths and software availability rather than one architecture. This support was expanded in Red Hat OpenShift 4.15 which enabled a Red Hat OpenShift cluster to support an IBM Power control plane and add x86 architecture worker nodes. Multi-Arch Compute for OpenShift Container Platform lets you use a pair of compute architectures, such as ppc64le and amd64, within a single cluster. This exciting feature opens new possibilities for versatility and optimization for composite solutions that span multiple architectures. This Redbook provides a high level overview of Red Hat OpenShift which can be run on many different architectures. We then present how IBM Power servers provide an extremely resilient and secure platform and how they can be an excellent platform for your cloud implementation using OpenShift. We then describe the benefits of using a multi-architecture cluster and provide implementation guidelines and advice to assist the reader in implementing a multi-architecture cluster using IBM Power control plane nodes and x86 or AMD based worker nodes. This Redbook is suitable for many levels including managers that need to understand how OpenShift on Power can help meet their business needs as well as supporting technical staff that are responsible for implementing those clusters."
