description = "This IBM Redpaper publication is a comprehensive guide that covers the IBM Power S1012 (9028-21B), IBM Power S1014 (9105-41B), IBM Power S1022s (9105-22B), IBM Power S1022 (9105-22A), and IBM Power S1024 (9105-42A) servers that use the latest IBM Power10 ..."
full_description = "This IBM Redpaper publication is a comprehensive guide that covers the IBM Power S1012 (9028-21B), IBM Power S1014 (9105-41B), IBM Power S1022s (9105-22B), IBM Power S1022 (9105-22A), and IBM Power S1024 (9105-42A) servers that use the latest IBM Power10 processor-based technology and support the IBM AIX®, IBM i, and Linux operating systems. The goal of this paper is to provide a hardware architecture analysis and highlight the changes, new technologies, and major features that are introduced in these systems, such as the following examples: The latest IBM Power10 processor design, including the Dual Chip Module (DCM) and Entry Single Chip Module (eSCM) packaging, which is available in various configurations of 1 - 24 cores per socket. Native Peripheral Component Interconnect Express (PCIe) 5th generation (Gen5) connectivity from the processor socket to deliver higher performance and bandwidth for connected adapters. Open Memory Interface (OMI) connected differential DIMM (DDIMM) memory cards that deliver increased performance, resilience, and security over industry-standard memory technologies, including the implementation of transparent memory encryption. Enhanced internal storage performance with the use of native PCIe connected Non-Volatile Memory Express (NVMe) devices in up to 16 internal storage slots to deliver up to 102.4 TB of high-performance, low-latency storage in a single, two-socket system. Consumption-based pricing in the Power Private Cloud with Shared Utility Capacity commercial model that allows customers to use resources more flexibly and efficiently, including IBM AIX, IBM i, Red Hat Enterprise Linux, SUSE Linux Enterprise Server, and Red Hat OpenShift Container Platform workloads. This publication is intended for the following professionals who want to acquire a better understanding of IBM Power server products: This paper expands the set of IBM Power documentation by providing a desktop reference that offers a detailed technical description of the Power10 processor-based Scale Out server models."
