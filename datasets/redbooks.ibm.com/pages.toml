full_description = 'Authors: Tim Simon, Dishant Doriwala, Hemantha Gunasinghe, Munshi Hafizul Haque, Santhosh Joshi, Adhish Kapoor, Pravin Kedia, Youssef Largou and Henry Vo High availability and business continuity continue to be focus themes for businesses as they work hard to provide infrastructure components to support the "always available" requirements for their critical business functions. In addition, many enterprises are starting to build critical business functions on Linux servers to take advantage of the openness and portability of those applications across both on-premises and cloud-based infrastructures. These combined requirements lead to the need for a solution that allows enterprises to support highly available Linux environments for critical business applications. This IBM Redbooks publication will help you install, tailor and configure a highly available cluster of IBM Power servers utilizing Pacemaker, which is an open source cluster manager that supports Linux environments. We describe basic concepts required for planning and designing an infrastructure to meet the requirements for high availability and business continuity and we compare and contrast different options and tools. While the publication is mostly targeted at skilled professionals who are designing and installing highly available Linux environments, it starts with a basic understanding of the technology to help less technical readers understand the concepts.'
