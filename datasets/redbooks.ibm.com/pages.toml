full_description = "This course presents the compelling reasons for developing Java applications in CICS Transaction Server. The course covers the various usage models of Java applications in CICS, along with an explanation of the technologies involved. An overview of this course, with an introduction to the requirements and overall learning objectives. This lecture provides an introduction to the course, explaining at a high-level the aims of the course. This lecture covers the unique capabilities of CICS as a mixed-language application server and how this enables Java applications to seamlessly integrate with CICS applications written in other languages. This lecture describes Java support in CICS including an overview of the OSGi and Liberty JVM servers, the unique functionality of the IBM Java SDK on z/OS and the exploitation of zIIP speciality processors by Java. This lecture explores the different Java APIs available in CICS including JCICS, Java SE and Java EE, and a description of how these APIs are supported through the CICS Explorer SDK. This lecture describes the most common scenarios for Java applications deployed into CICS, including: web applications, web services, new Java components and Java batch."
