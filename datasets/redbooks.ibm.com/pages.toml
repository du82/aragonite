title = "Using Ansible for Automation in IBM Power Environments"
description = "This IBM Redbooks® publication helps you install, tailor, and configure an automation environment by using Red Hat Ansible in an IBM Power server environment. Ansible is a versatile IT automation platform that you use to deploy and maintain your ..."
full_description = "Authors: Tim Simon, Jose Martin Abeleira, Shahid Ali, Vijaybabu Anaimuthu, Sambasiva Andaluri, Marcelo Avalos Del Carpio, Thomas Baumann, Ivaylo Bozhinov, Carlo Castillo, Rafael Cezario, Stuart Cunliffe, Nilabja Haldar, Munshi Hafizul Haque, Subha Hari, Andrey Klyachkin, Osman Omer, Rosana Ramos, Prashant Sharma, Stephen Tremain, Prerna Upmanyu and Sundaragopal Venkatraman This IBM Redbooks® publication helps you install, tailor, and configure an automation environment by using Red Hat Ansible in an IBM Power server environment. Ansible is a versatile IT automation platform that you use to deploy and maintain your applications and systems. With Ansible, you can automate almost anything: code deployment, network configuration, server infrastructure deployment, security and patch management, and cloud management. Ansible is implemented in a human-readable language (YAML) and uses Secure Shell (SSH) to connect to the managed systems, with no agents to install on remote systems. This IBM Redbooks publication shows you how to integrate Ansible to manage all aspects of your IBM Power infrastructure, including server hardware, the Hardware Management Console (HMC), IBM PowerVM®, IBM PowerVC, IBM AIX®, IBM i, and Linux on Power. We provide guidance about where to run your Ansible automation controller nodes, demonstrate how Ansible can be installed on any operating system (OS) that is supported on IBM Power, and show you how to set up your IBM Power infrastructure components to be managed by using Ansible. This publication is intended for use by anyone who is interested in automaton by using Ansible, whether they are getting started or they are experts on Ansible and want to understand how to integrate IBM Power into their existing environment."
