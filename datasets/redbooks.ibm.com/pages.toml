description = "IBM LinuxONE is a portfolio of hardware, software, and solutions for an enterprise-grade Linux environment. It is designed to run more transactions faster and with more security and reliability, specifically for the open-source community. It fully ..."
full_description = "IBM LinuxONE is a portfolio of hardware, software, and solutions for an enterprise-grade Linux environment. It is designed to run more transactions faster and with more security and reliability, specifically for the open-source community. It fully embraces open-source-based technology. The following LinuxONE servers are now available: IBM LinuxONE 4 LA1, IBM LinuxONE 4 LA2, IBM LinuxONE 4 AGL, and IBM LinuxONE Express. Aside from still running SUSE Linux Enterprise Server and Red Hat Enterprise Linux (RHEL) Servers, LinuxONE runs Ubuntu, which is popular on x86 hardware. Ubuntu, which runs the cloud, smartphones, a computer that can remote control a planetary rover for NASA, many market-leading companies, and the Internet of Things, is now available on IBM LinuxONE servers. Together, these two technology communities deliver the perfect environment for cloud and DevOps. Ubuntu 16.04 on LinuxONE offers developers, enterprises, and Cloud Service Providers a scalable and secure platform for next-generation applications that include OpenStack, Kernel-based Virtual Machine (KVM), Docker, and JuJu. The following reasons are why you would want to optimize your servers through virtualization by using LinuxONE: This IBM Redbooks® publication provides a technical planning reference for IT organizations that are considering migrating from their x86 distributed servers to LinuxONE. This book walks you through some of the important considerations and planning issues that you might encounter during a migration project. Within the context of a pre-existing UNIX based or x86 environment, it presents an end-to-end view of the technical challenges and methods necessary to complete a successful migration to LinuxONE."
