title = "How to Successfully Integrate IBM Content Navigator with Box"
description = "To successfully add a Box repository to an instance of IBM® Content Navigator there are many prerequisites that must be met, and some configuration steps that are not immediately obvious and currently not included in the IBM Content Navigator ..."
full_description = "To successfully add a Box repository to an instance of IBM® Content Navigator there are many prerequisites that must be met, and some configuration steps that are not immediately obvious and currently not included in the IBM Content Navigator documentation. This document contains the procedures for configuring a Box repository in IBM® Content Navigator and some other related Box product usage information when integrating with IBM Content Navigator. This document incorporates information from the IBM Support website (https://ibm.biz/Bdi3Lc) and additional important information to successfully configure Box integration with IBM Content Navigator. What is Box Box is a cloud platform that helps you securely store, share, and manage all your files. Whether you need to secure confidential business information, develop a custom mobile application, or simplify paper-based office processes, Box can help you do more with your content. Box provides easy internal and external file sharing so that you can stop sending insecure, large attachments through email. Use customized Box shared links with passwords, expiration dates, and controlled download access. You can collaborate externally and share with vendors, clients, or partners, no matter what computer phone or tablet they use. IBM Content Navigator Version 2.0.3.5 includes the ability to search, browse, and view files in Box. In addition, versions 2.0.3.6 and above include share, copy, and cross-repository search with Box. Version 3.0 IBM Content Navigator introduces OAuth2 with JWT security. Before adding a Box repository to IBM Content Navigator, ensure that you can connect to IBM Content Navigator by using HTTPS. Integration with Box requires an HTTPS connection URL to IBM Content Navigator. To validate your SSL configuration and HTTPS connectivity, use the web server administrative console to check that the server hosting IBM Content Navigator has a valid SSL server certificate, which is self-signed or signed by a recognized authority. Ensure that the desktop browser (Internet Explorer, Chrome, or Firefox) can establish a trusted HTTPS connection to the web server without any certificate errors or security risk warnings. Note: It is important that you are not presented with a certificate error. If you need to configure your browser for secure trusted connections, see Configuring your Browser for Trusted HTTPS connections to IBM Content Navigator and Box, TIPS1351, found at: http://www.redbooks.ibm.com/abstracts/tips1351.html Creating a Box application to integrate Box with IBM Content Navigator server To integrate IBM Content Navigator with Box, you must create a Box application. This application is used as the bridge between IBM Content Navigator and Box, and to a large degree is invisible to users. The only time the users are aware of this bridge is the first time that they access the Box repository from IBM Content Navigator. They are prompted for their Box credentials to authorize this application to access their Box environment. To create a Box application to integrate Box with the IBM Content Navigation server, complete the following steps:"
