description = """
This course provides Java application developers with a step-by-step guide to CICS Java development, demonstrating how to access common CICS resources using the JCICS API. Topics covered include:
 
 Fundamentals of using the JCICS API
 Using JZOS to map ..."""
full_description = "This course provides Java application developers with a step-by-step guide to CICS Java development, demonstrating how to access common CICS resources using the JCICS API. Topics covered include: Students should be familiar with the concepts and techniques discussed in Developing a RESTful Web application for Liberty in CICS before taking this course. This lecture introduces the course, explaining at a high-level the topics to be covered, along with a reference to the sample material and some important pre-requisites. This section describes at a high-level the record-based data structures used by non-Java languages and demonstrates how to efficiently pass data to COBOL or Assembler programs using the JZOS record generator. This lecture looks at the different approaches to accessing data from Java and non-Java languages. A sample COBOL copybook is introduced, which will be used throughout the course. Introduces the JZOS record generator and outlines the process used to generate Java source code from a COBOL copybook. This section covers the LINK command. Two scenarios are examined: using the JCICS API to call other CICS programs; and how to expose Java classes in a Liberty application as CICS programs. An overview of the LINK command, along with a basic example of achieving a LINK operation using the JCICS API. This is extended by passing a COMMAREA constructed using a generated Java bean, and further optimizations are examined. This lecture demonstrates how to annotate Java methods in a Liberty application, enabling CICS programs to LINK to Java components deployed in a Liberty JVM server. Several important CICS resource types are covered, with details on how to access them using the JCICS API. A brief overview of VSAM is provided, with a focus on accessing VSAM data from CICS. This lecture looks at the sample course materials, examining how to perform the basic operations of reading, writing, updating, and deleting records. A simple introduction to CICS temporary storage queues is provided, along with an introduction to the JCICS methods used when reading from and writing to queues."
