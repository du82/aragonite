num is the third and highest plateau in our badge program. To earn an IBM Redbooks Platinum Author badge, you must earn a Gold badge, and successfully participate in and complete an IBM Redbooks Residency that publishes your sixth IBM Redbooks or IBM Redpaper publication. You must be listed as an author for the publication. The residency announcement contains any requirements and skills that are required for the project. Your project leader and residency coordinator can answer any questions that are specific to a project. Remind your residency coordinator that the residency you are on makes you eligible for the Platinum badge. Your prior contributions will be validated using our residency and publication data."
