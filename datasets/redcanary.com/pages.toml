full_description = 'Respond quickly and precisely“With such a small window of response time, you need to have not just good detection but automated responses that you build very easily with Red Canary’s playbooks.”Dave CoughanourVP of Cybersecurity at ANSYS Read the Case Study > <img src="https://redcanary.com/wp-content/uploads/2023/04/CanariesInFlight_RedCanary-Transparent.png" alt="CanariesInFlight_RedCanary-Transparent" />Address prevalent threats faster with out-of-the-box playbooksStop threats before they cause harm with pre-built, customizable response tactics that operate alongside our 99.6% customer-validated threat accuracy.<img fetchpriority="high" decoding="async" class="alignnone wp-image-37209 size-full" src="https://redcanary.com/wp-content/uploads/2024/05/1_Automation_RedCanary-scaled.jpg" alt="Screenshot of Automation in Red Canary portal" width="2560" height="1221" srcset="https://redcanary.com/wp-content/uploads/2024/05/1_Automation_RedCanary-scaled.jpg 2048w, https://redcanary.com/wp-content/uploads/2024/05/1_Automation_RedCanary-300x143.jpg 300w, https://redcanary.com/wp-content/uploads/2024/05/1_Automation_RedCanary-1024x488.jpg 1024w, https://redcanary.com/wp-content/uploads/2024/05/1_Automation_RedCanary-768x366.jpg 768w, https://redcanary.com/wp-content/uploads/2024/05/1_Automation_RedCanary-1536x732.jpg 1536w" sizes="(max-width: 2560px) 100vw, 2560px" />KEY BENEFITS#boxlink-819899592 * { color: #fff; } #boxlink-819899592 svg { fill: #fff; .st3 { fill: #fff; } } #boxlink-819899592:hover:not(.no-link) svg .st3 { fill: #fff; }Dramatically reduce your MTTR Triggered actions contain threats within seconds of Red Canary confirming malicious activity.#boxlink-906338013 * { color: #fff; } #boxlink-906338013 svg { fill: #fff; .st3 { fill: #fff; } } #boxlink-906338013:hover:not(.no-link) svg .st3 { fill: #fff; }Automate at your own speed Require approval before automated playbooks run, and turn them on/off with one click.#boxlink-224403737 * { color: #fff; } #boxlink-224403737 svg { fill: #fff; .st3 { fill: #fff; } } #boxlink-224403737:hover:not(.no-link) svg .st3 { fill: #fff; }Orchestrate your critical security products SOAR playbooks use webhooks and integrate with EDR products, SIEM, identity platforms like Okta and Microsoft Entra ID, and more. How it worksPlaybooks are groups of actions to support a specific goal. Whether you want to isolate affected endpoints or simply email your security team, we got you. <img src="https://redcanary.com/wp-content/uploads/2024/05/Automation.2_RedCanary.png" alt="Automation.2_RedCanary" /> <img src="https://redcanary.com/wp-content/uploads/2024/05/Automation.3_RedCanary.png" alt="Automation.3_RedCanary" /> Triggers describe when automation should begin. Each trigger can be linked to multiple playbooks , scaling your ability to automate through reuse. Actions are specific activities taken by automation. Use our pre-built actions to do things like change a firewall rule or send an alert, and you can also create custom actions. <img src="https://redcanary.com/wp-content/uploads/2024/05/Automation.4_RedCanary.png" alt="Automation.4_RedCanary" /> <img src="https://redcanary.com/wp-content/uploads/2024/05/Automation.5_RedCanary.png" alt="Automation.5_RedCanary" /> Approvals give you even greater control over when playbooks are executed. Meaningful MTTR improvementStop adversaries in minutes and realize dramatic improvements to your response efficiency.<img decoding="async" class="alignnone wp-image-37215 size-full" src="https://redcanary.com/wp-content/uploads/2024/05/6.1_Automation_RedCanary.jpg" alt="Graph showing MTTR improvement" width="1651" height="706" srcset="https://redcanary.com/wp-content/uploads/2024/05/6.1_Automation_RedCanary.jpg 1651w, https://redcanary.com/wp-content/uploads/2024/05/6.1_Automation_RedCanary-300x128.jpg 300w, https://redcanary.com/wp-content/uploads/2024/05/6.1_Automation_RedCanary-1024x438.jpg 1024w, https://redcanary.com/wp-content/uploads/2024/05/6.1_Automation_RedCanary-768x328.jpg 768w, https://redcanary.com/wp-content/uploads/2024/05/6.1_Automation_RedCanary-1536x657.jpg 1536w" sizes="(max-width: 1651px) 100vw, 1651px" /> Automate responses with easeNo-code setup of automated playbooks make it easy to improve your communication and containment processes. Actions include SMS messaging, dialing a phone tree, killing processes, suspending users, sending alerts to your SIEM, and more.<img decoding="async" class="alignnone wp-image-37207 size-full" src="https://redcanary.com/wp-content/uploads/2024/05/Desktop_AutomationResponses.jpg" alt="Automated response examples" width="8171" height="1600" srcset="https://redcanary.com/wp-content/uploads/2024/05/Desktop_AutomationResponses.jpg 2048w, https://redcanary.com/wp-content/uploads/2024/05/Desktop_AutomationResponses-300x59.jpg 300w, https://redcanary.com/wp-content/uploads/2024/05/Desktop_AutomationResponses-1024x201.jpg 1024w, https://redcanary.com/wp-content/uploads/2024/05/Desktop_AutomationResponses-768x150.jpg 768w, https://redcanary.com/wp-content/uploads/2024/05/Desktop_AutomationResponses-1536x301.jpg 1536w" sizes="(max-width: 8171px) 100vw, 8171px" />Resources To Support Your Response and Remediation Strategy Incident Response and Readiness Guide Arm your security team with a blueprint for a modern and effective incident response plan. How it works See how simple it is to automate responses in Red Canary. Active Remediation Combine automated containment with expert-led remediation so you can focus on other priorities.'
