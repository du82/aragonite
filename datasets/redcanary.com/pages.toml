r mission resonates with you, let’s talk. What We Believe In - Do what’s right for the customer - Be kind and authentic - Deliver great quality - Be relentless Challenges You Will Solve Enterprise customers are unique. They have created a successful business at scale and need expertise into that business to help successfully guide their security solutions. The Enterprise Technical Account Manager understands enterprise customers’ technical requirements and works with security teams to implement and utilize Red Canary’s products to the fullest. Your success is measured by establishing Red Canary as a security ally to customer’s security operations teams, ensuring technical and product requirements are met, and operationalizing Red Canary’s products into the customer’s security operations processes. Revenue Customer Success Remote Sales Engineer - East Coast Challenges You Will Solve A Sales Engineer understands that while prospective customers share many characteristics, each is unique and requires a carefully constructed solution to help them achieve their specific security goals. We are looking for a sales engineer who is able to discern where a customer is on their security maturity journey and assess whether or not the Red Canary solution fits into their current project plans and organizational needs. You will be a great fit for this role if you are ecstatic about the opportunity to guide prospects through the customer journey and evangelize the Red Canary solution. In this position you will have the opportunity to creatively identify opportunities for improvement and take the reins on implementing solutions. Much of your day-to-day work consists of pre-sales interactions as you support a team of Account Executives during presentations and proof of concepts. While not directly supporting your team, your time will be focused on a variety of project work and ad-hoc requests. Project work may include performing product research-and-development, maturing current functional processes and writing and refactoring scripts. All Candidates must be located in the US Eastern Timezone to qualify. Revenue Sales Engineering Remote Senior Enterprise Account Executive - North Central Challenges You Will Solve We are searching for an experienced Enterprise Account Executive that has a real passion for technology and can deliver on bold targets. As we continue to break into bigger deals, and formalize our support for the larger enterprise segment, you will blaze the path for the organization's growth. You will be focused on new accounts within a rich territory, as well as nurturing others underway with their move to the cloud. Our sales team works with a best-of-breed product that solves real problems for our customers. Sellers follow a well-defined methodology that helps them identify the customer's individual needs and clearly convey the value of the product. Whether you're looking to learn from the best or be the best, the sales team is dedicated to furthering personal development and team success. Revenue Sales Minneapolis, MN Senior Mid-Market Account Executive - Southeast Challenges You Will Solve We are looking for a forward-thinking, coachable, and highly-motivated individual to join our sales team as a Senior Mid-Market Account Executive, supporting customers within an assigned geographic territory. You will be responsible for identifying customers, building relationships and guiding them through Red Canary’s solutions from introductory conversations all the way to contract execution. Through your persistence, determination, and creativity, you will help accomplish Red Canary’s mission to make security better for businesses of all sizes. The Red Canary sales team helps our future customers understand how we can make their security better. We work very closely with customers, so it is critical to lay strong foundations for relationships that last for many years. Our sales team discovers opportunities and works from start to finish to 