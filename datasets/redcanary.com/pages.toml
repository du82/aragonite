["https://redcanary.com/pricing"]
title = "Pricing and Packages | Red Canary"
description = "Choose the package that fits your need. We provide 24x7 Detection & Response and more to keep you protected. Contact us today!"
full_description = '''We got you. Unmatched MDR with a world-class experienceCore24x7 Detection & ResponseGet best-in-class MDR and inherit herd immunity from top threats Includes:Single domain MDR99% threat accuracyAutomated response playbooksExecutive dashboardsEmergency hotline access See it in actionMost popularCompleteIdentity, Endpoint & Cloud ProtectionImprove security outcomes with multi-domain MDR and threat intelligenceEverything in Core plus:Complete, multi-domain MDRThreat research & insightsFile integrity monitoringRed Canary CopilotRed Canary API accessConfigurable data exporterDetection & response advisory Get a demoEnterpriseStrategic SOC AugmentationAugment your team with our deep bench of cybersecurity and intelligence expertsEverything in Complete plus strategic support and advisory:Dedicated technical supportCustom intelligence briefingsThreat hunter collaborationTailored security discussionsUnlimited Integrations Contact salesAdd-ons Active RemediationMinimize impact with 24×7 expert-led remediation Learn More Training & TabletopsPrepare for cybersecurity incidents with interactive experiences Learn More Linux EDRBring visibility and protection to cloud runtime environments Learn More SIEM JumpstartOptimize Microsoft Sentinel for rapid ROI in this six-week engagement Learn More FAQsHow are these plans priced? +All plans feature resource-based pricing, which will vary depending on the number of endpoints, identities, and cloud resources you would like us to protect. We work with organizations of all sizes and are happy to work with you on a quote that fits your needs and budget.What products does Red Canary integrate with? +We integrate with a wide range of security, ticketing and collaboration solutions. For security data sources that enable high quality detection (e.g. EDR), we ingest both alerts & telemetry. For other sources that provide supportive, contextual data (e.g. firewall logs), our integration approach varies. The number and type of integrations available to you will be informed by the plan you select.Does Red Canary require an agent? +No. Red Canary runs agentless and relies on telemetry and/or alert data from your existing security investments to support our high quality detection, investigation and response.How long does it take to onboard and tune threats? +Unlike other security products, Red Canary does not require you to define your own detection rules and indicators of compromise in order to achieve results. As soon as we get integrated with your security stack, you’ll inherit the benefits of 10+ years of Red Canary detection engineering.Can I export data out of Red Canary? +Yes. Canary Exporter comes standard in the Complete plan and can be used to export data from Red Canary to the destination of your choice (e.g. S3 bucket, SIEM, local storage) in various standard formats.What is included in your advisory services? +Customers on the Complete plan are able to work with Red Canary experts on detection and response topics. We will provide review, insight, and guidance to ensure your security team is empowered to succeed.Customers on the Enterprise plan receive strategic advisory services through partnership with a deep bench of diverse experts in threat hunting, intelligence, detection, research, and more. We will act as an extension of your team and provide customized advice tailored for your organization. document.addEventListener("DOMContentLoaded", function() { var faqQuestions = document.querySelectorAll('.faq-question'); faqQuestions.forEach(function(question) { question.addEventListener('click', function() { var faqItem = this.parentElement; var faqAnswer = faqItem.querySelector('.faq-answer'); var isActive = faqItem.classList.contains('active'); document.querySelectorAll('.faq-item.active').forEach(function(item) { if (item !== faqItem) { item.classList.remove('active'); var answer = item.querySelector('.faq-answer'); answer.style.maxHeight = null; answer.style.padding = "0 15px"