["https://redcanary.com/products/new-features"]
title = "What's New | Red Canary"
description = "Learn about our new product features - multicloud coverage, identity threat detection and response, and faster response times using GenAI."
full_description = 'What’s NewFrom new identity and EDR integrations to SIEM security services and cost-effective data storage, Red Canary’s latest innovations help your team outsmart adversaries and optimize security operations. Get a demo <img fetchpriority="high" decoding="async" src="https://redcanary.com/wp-content/uploads/2024/12/SecurityOperations_975x975-cropped.png" alt="" width="975" height="975" class="alignnone size-full wp-image-38516" /> <h6>Not seeing the form?</h6><p>Email <a href="mailto:marketing@redcanary.com"><strong>marketing@redcanary.com</strong></a> and we’ll help you get registered. Or you can always <a href="/contact-us/"><strong>contact us</strong></a>.</p> <img decoding="async" src="https://redcanary.com/wp-content/uploads/2024/11/1_SecurityDataLake_RedCanary_Update.png" >REDUCE DATA STORAGE COSTSSecurity teams face budget constraints and are seeking ways to optimize their security operations. A common challenge is the high cost and complexity of traditional SIEM solutions, which often store large volumes of data that may not be actively monitored or frequently analyzed.Introducing the Red Canary Security Data Lake: a simple and cost-effective solution for long-term security data storage and querying. This solution provides a streamlined approach to storing and accessing critical security data, enabling organizations to reduce costs and improve efficiency. <img decoding="async" src="https://redcanary.com/wp-content/uploads/2024/11/1_SecurityDataLake_RedCanary_Update.png" style="margin:5px 0;box-shadow: rgb(0 0 0 / 80%) 0 0 20px -6px;border: 2px solid #4564ed;border-radius:20px;">REDUCE DATA STORAGE COSTSSecurity teams face budget constraints and are seeking ways to optimize their security operations. A common challenge is the high cost and complexity of traditional SIEM solutions, which often store large volumes of data that may not be actively monitored or frequently analyzed.Introducing the Red Canary Security Data Lake: a simple and cost-effective solution for long-term security data storage and querying. This solution provides a streamlined approach to storing and accessing critical security data, enabling organizations to reduce costs and improve efficiency. <img decoding="async" src="https://redcanary.com/wp-content/uploads/2024/11/1_SecurityDataLake_RedCanary_Update.png" >BETTER SECURE YOUR IDENTITIESRecent trends indicate a significant increase in account takeover and business email compromise attacks (read more in the midyear Threat Detection Report update). Among the top 10 techniques observed, three are cloud-native and directly target identity: Cloud Accounts, Email Forwarding Rules, and Email Hiding Rules. <img decoding="async" src="https://redcanary.com/wp-content/uploads/2024/11/RedCanaryUserProtection.png" alt="" width="100%" style="margin:5px 0;box-shadow: rgb(0 0 0 / 80%) 0 0 20px -6px;border: 2px solid #4564ed;border-radius:20px;"/>To proactively address these threats, Red Canary has expanded integrations with leading identity and email providers, including Microsoft Entra ID and Microsoft 365, Okta Workforce Identity Cloud, Google Workspace, and CrowdStrike Falcon Identity Protection. By leveraging these integrations, we are effectively detecting and mitigating account takeovers and identity compromises before adversaries can exploit them for malicious purposes.OPTIMIZE YOUR SECURITY OPERATIONSToday’s SOCs face significant challenges managing disconnected tools and fragmented data. At the same time, they’re inundated by an ever-growing volume of threats, making it difficult to respond effectively, remediate incidents quickly, and scale their defenses to match the pace of modern threats.To help organizations streamline operations and improve efficiency, Red Canary is expanding our SIEM and SIEM alternative offerings. Our new Co-managed Microsoft Sentinel Subscription offers continuous support and optimization beyond initial deployment, delivering sustained value throughout the year. Additionally, in early 2025, we’ll introduce a security service for Palo Alto Cortex® XSIAM®, combining the power of human expertise and advanced automation to dramatically improve security efficiency. <img decoding="async" src="https://redcanary.com/wp-content/uploads/2024/12/XSIAM_RedCanary_PaloAlto.png" alt="Red Canary x Palo Alto expertise and automation infographic" width="100%" style="margin:5px 0;box-shadow: rgb(0 0 0 / 80%) 0 0 20px -6px;border: 2px solid #4564ed;border-radius:20px;"/> <img decoding="async" src="https://redcanary.com/wp-content/uploads/2024/05/GenAI-Chart2_1400x900.png" alt="Red Canary Copilot Agent chart" width="100%" style="margin:5px 0;box-shadow: rgb(0 0 0 / 80%) 0 0 20px -6px;border: 2px solid #4564ed;border-radius:20px;" />UNLOCK BETTER CONTEXT WITH GENAIOur advanced models process vast quantities of security data to continuously learn and improve, resulting in faster, more accurate, and contextually rich investigations. This empowers your security team to more effectively respond to threats.Through the Red Canary portal, you’ll experience the benefits of GenAI firsthand. AI-powered features, including alert summarization, remediation guidance, and threat assessment explanations, streamline workflows and reduce response times. Furthermore, these advanced capabilities enhance our threat hunting efforts, enabling us to proactively identify and mitigate potential risks.The security landscape is evolving, and so are we.At Red Canary, we believe that a cohesive ecosystem of integrations is key to providing comprehensive protection. By expanding our partnerships and capabilities, we’re empowering our customers to better defend their organizations against cyber threats.<img decoding="async" src="https://redcanary.com/wp-content/uploads/2024/12/Crowdstrike_100x320.png" width="100%" style="margin:0 auto;margin-bottom:30px;max-width:300px;" alt="Crowdstrike Logo">Adversaries are increasingly targeting identities to gain unauthorized access to sensitive data and systems. Red Canary extends the value of CrowdStrike Falcon® Identity Protection with 24×7 monitoring and advanced analytics to detect anomalies and real-time threats such as suspicious login attempts and password changes. Learn More<img decoding="async" src="https://redcanary.com/wp-content/uploads/2024/12/MicrosoftSentinel_100x320.png" width="100%" style="margin:0 auto;margin-bottom:30px;max-width:300px;" alt="Microsoft Sentinel Logo">Many security teams place Microsoft Sentinel at the center of their security programs. We can help you achieve Sentinel success. Our Co-managed Microsoft Sentinel Subscription extends support beyond initial deployment, ensuring your Sentinel environment remains optimized, secure, and delivers maximum value all year long. Learn More<img decoding="async" src="https://redcanary.com/wp-content/uploads/2024/12/TrendMicro_100x320.png" width="100%" style="margin:0 auto;margin-bottom:30px;max-width:300px;" alt="Trend Micro Logo">Attack methods continue to grow more sophisticated, putting sensitive corporate data at risk. Our new integration with Trend Micro™ Vision One empowers us to proactively identify and respond to advanced threats 24/7, safeguarding your endpoints from malicious executables like ransomware and malware. Learn More Blog Explore some of Red Canary’s recent releases that enhance our integration ecosystem. <img decoding="async" src="https://redcanary.com/wp-content/uploads/2024/11/1_SecurityDataLake_RedCanary_Update.png" >'
