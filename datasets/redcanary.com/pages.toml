rom start to finish to ensure customers make outcome-focused decisions to fill their cyber security needs. We are growing exponentially and you can expect tremendous earning potential. Revenue Sales Atlanta, GA Director, Revenue Enablement Challenges You Will Solve We are looking for a successful, experienced, data-minded individual to lead our revenue enablement programs as our Director, Revenue Enablement. You will lead the vision, strategy and coordinate the execution of our go to market enablement programs to provide onboarding, training, and continuous learning to our internal revenue-driving teams, providing them with the outcomes they need to be successful and exceed full year bookings plans. The Director, Revenue Enablement reports to the Chief Revenue Officer, will be a member of the CRO’s senior staff and work closely with our sales, marketing, product marketing, and customer success teams. Through your persistence, determination, and creativity, you will help accomplish Red Canary’s mission to make security better for businesses of all sizes. The Director Revenue Enablement is results-focused, analytical yet empathic individual who loves being a servant leader to a growing sales organization. You live to see results from the enablement programs you’ve helped to put into place as well as the results from your team’s support and training of current and new sales and customer success team members. You possess a strong understanding of business and sales processes, and have an interest in distilling sophisticated ideas and information into easy-to-digest content and training. Revenue Sales Remote Enterprise Account Executive - Position Located in Bay Area Challenges You Will Solve We are searching for an experienced Enterprise Account Executive that has a real passion for technology and can deliver on bold targets. As we continue to break into bigger deals, and formalize our support for the larger enterprise segment, you will blaze the path for the organizati