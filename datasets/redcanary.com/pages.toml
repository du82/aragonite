["https://redcanary.com/blog/threat-detection/misbehaving-rats"]
title = "Remote access tool or trojan? How to detect misbehaving RATs"
description = "Ransomware operators frequently abuse RATs like NetSupport, Remote Utilities, ScreenConnect, and Anydesk. Here's what to look out for."
full_description = 'Red Canary’s Cyber Incident Response Team frequently observes adversaries abusing legitimate remote access utilities for lateral movement and execution of payloads. These tools perform reliably, as you may expect with most enterprise software, and allow operators to pivot and transfer data to and from victim machines.Adversarial abuse of remote monitoring & management (RMM) software is not new, but—given the rash of costly and destructive ransomware attacks in recent months and years—it’s particularly important that security teams develop robust security controls for detecting malicious use of RMM tooling. In fact, just last week AdvIntel reported on adversaries who—after gaining initial access—had installed an RMM tool called Atera and used it as a functional backdoor in the lead up to a Conti ransomware outbreak.Similar to how we detailed the various exfiltration tools used by adversaries during ransomware extortion, in this post we’ll discuss why it’s important to monitor RMM software in your enterprise, and we’ll offer detailed guidance on how to observe and detect it.RAT v. RATOnce an adversary gets their hands on it, a remote administration tool can become a remote access trojan. The primary difference between a “trojan” and a “tool” is whether or not your organization still has control over the software, but determining that can be tricky. With each of these tools, you’ll need to “know normal,” as SANS says, and ask behavioral questions of each tool. Start with simple questions like:Which directory does it normally execute from?Where does it normally establish connections to?What do these tools typically write to the filesystem?Should I expect child processes?Is this software approved in my environment?The goal of this admittedly non-comprehensive list of questions is to detect abnormalities in your telemetry. Basically, you will take a baseline of the application’s behavior and apply best efforts to writing detection logic on commonly observed techniques that adversaries employ. Detection engineers want to cut through the noise as much as possible and find anomalies in vast data sets. On top of this, each tool’s execution behaviors vary, which makes answering the questions above a time-consuming process for analysts.NetSupportIn the case of one remote administration tool, known as “NetSupport,” malicious usage can usually be distinguished by a few factors:connections to malicious domainsrenaming the primary NetSupport binary, client32, to something elseexecuting from directories outside of the usual “program files” folder In the below instance, we would qualify the copy of NetSupport as “suspect” based on the directory and process name.Note: ctfmon.exe is a renamed version of NetSupport binary. <img loading="lazy" decoding="async" class="alignnone size-full wp-image-28700" src="https://redcanary.com/wp-content/uploads/2021/08/image2-1.png" alt="remote access trojan detection" width="1804" height="746" srcset="https://redcanary.com/wp-content/uploads/2021/08/image2-1.png 1804w, https://redcanary.com/wp-content/uploads/2021/08/image2-1-300x124.png 300w, https://redcanary.com/wp-content/uploads/2021/08/image2-1-1024x423.png 1024w, https://redcanary.com/wp-content/uploads/2021/08/image2-1-768x318.png 768w, https://redcanary.com/wp-content/uploads/2021/08/image2-1-1536x635.png 1536w" sizes="auto, (max-width: 1804px) 100vw, 1804px" />Adversaries frequently rename binaries, as shown above, in an effort to evade overly specific detections. However, these binaries often depend on dynamic link libraries (DLL) that cannot be renamed, which make for useful indicators of the tool being abused. Analysts can search for the utility in question on a site like VirusTotal to get a list of associated DLLs the utility loads at run time, and these module loads may be reliable indicators that the utility is being used, even if it has been renamed and is running from an unusual path.In this example, ctfmon.exe is the renamed client32 NetSupport binary, which you can see by the hashes of the two binaries.<img loading="lazy" decoding="async" class="alignnone size-full wp-image-28740" src="https://redcanary.com/wp-content/uploads/2021/08/Renamed-NetSupport-Utilitiy.png" alt="" width="1368" height="527" srcset="https://redcanary.com/wp-content/uploads/2021/08/Renamed-NetSupport-Utilitiy.png 1368w, https://redcanary.com/wp-content/uploads/2021/08/Renamed-NetSupport-Utilitiy-300x116.png 300w, https://redcanary.com/wp-content/uploads/2021/08/Renamed-NetSupport-Utilitiy-1024x394.png 1024w, https://redcanary.com/wp-content/uploads/2021/08/Renamed-NetSupport-Utilitiy-768x296.png 768w" sizes="auto, (max-width: 1368px) 100vw, 1368px" />While from a defender’s perspective this all might seem obvious, you’ll have to remember that this is all happening in the background from a user’s perspective. And if a user runs a tool like Task Manager, all they’ll see is ctfmon without the path.Finally, this instance of NetSupport makes network connections to a couple domains: first to geo.netsupportsoftware.com, which is used by the client to report back the client’s location, and second to a randomly named domain being used for its command and control (C2).<img loading="lazy" decoding="async" class="alignnone size-full wp-image-28702" src="https://redcanary.com/wp-content/uploads/2021/08/image6-1.png" alt="remote access trojan detection" width="1842" height="832" srcset="https://redcanary.com/wp-content/uploads/2021/08/image6-1.png 1842w, https://redcanary.com/wp-content/uploads/2021/08/image6-1-300x136.png 300w, https://redcanary.com/wp-content/uploads/2021/08/image6-1-1024x463.png 1024w, https://redcanary.com/wp-content/uploads/2021/08/image6-1-768x347.png 768w, https://redcanary.com/wp-content/uploads/2021/08/image6-1-1536x694.png 1536w" sizes="auto, (max-width: 1842px) 100vw, 1842px" /> Detection opportunity 1We suggest writing, implementing, and testing the following rules within your EDR platform or SIEM:NetSupport executing from unexpected directories:description = ‘netsupport client application’ & process_path != “program files”NetSupport renamed:internal_name: client32.exe & process_name != client32.exe (the internal name used by the primary NetSupport executable)NetSupport making external network connections:Any external network connections to geo.netsupportsoftware.com (if you do not use NetSupport normally) Remote UtilitiesRemote Utilities is a remote desktop suite known to the security community as “RURAT” when used in a malicious context. Execution from folders outside of “program files”—such as appdata or programdata—often indicates malicious use of Remote Utilities. If you do not use Remote Utilities within your environment, alert on the execution of rutserv.exe or rfusclient.exe on all hosts within your environment. In the wild, it has been abused by various ransomware groups such as Epsilon Red, TA505, and even some suspected state-sponsored adversaries.From a network alerting perspective, look for connections on ports 5655 and 5650, since they’re not usually used for anything other than remote utilities. For alerting on host execution behavior, refer to the detections below.In this case, we saw the rutserv binary running from a folder in AppData\Roaming.<img loading="lazy" decoding="async" class="alignnone wp-image-28703 size-full" src="https://redcanary.com/wp-content/uploads/2021/08/image1-1.png" alt="remote access trojan detection" width="1802" height="1222" srcset="https://redcanary.com/wp-content/uploads/2021/08/image1-1.png 1802w, https://redcanary.com/wp-content/uploads/2021/08/image1-1-300x203.png 300w, https://redcanary.com/wp-content/uploads/2021/08/image1-1-1024x694.png 1024w, https://redcanary.com/wp-content/uploads/2021/08/image1-1-768x521.png 768w, https://redcanary.com/wp-content/uploads/2021/08/image1-1-1536x1042.png 1536w" sizes="auto, (max-width: 1802px) 100vw, 1802px" />In another case, we saw the remote utilities binary being renamed and using a maliciously created service named USBPrintManagerGrp for persistence.<img loading="lazy" decoding="async" class="alignnone size-full wp-image-28704" src="https://redcanary.com/wp-content/uploads/2021/08/image3-1.png" alt="remote access trojan detection" width="1840" height="994" srcset="https://redcanary.com/wp-content/uploads/2021/08/image3-1.png 1840w, https://redcanary.com/wp-content/uploads/2021/08/image3-1-300x162.png 300w, https://redcanary.com/wp-content/uploads/2021/08/image3-1-1024x553.png 1024w, https://redcanary.com/wp-content/uploads/2021/08/image3-1-768x415.png 768w, https://redcanary.com/wp-content/uploads/2021/08/image3-1-1536x830.png 1536w" sizes="auto, (max-width: 1840px) 100vw, 1840px" /> Detection opportunity 2We suggest writing, implementing, and testing the following rules within your EDR platform or SIEM:Rutserv suspicious directory:Process appears to be rutserv.exe or rfusclient.exe (or a renamed version of it) & path != program files\remote utilitiesRutserv renamed:description = Remote Utilities - Host & process_name != rutserv.exe or rfusclient.exeExternal network connection:Any external network connection to to remoteutilities.com or ports 5655/5650 (if Remote Utilities is not normally used) ScreenConnectThe ScreenConnect software (aka ConnectWise Control) has been leveraged in various cyber attacks since at least 2016. The application is feature-rich, allowing for remote management of hosts typically used for help desk support. Some notable features include drag-and-drop file transfers, screen recording, and access to the command line to execute custom commands.Typically, adversaries use ScreenConnect to deploy malicious payloads like Zeppelin and Sodinokibi ransomware to numerous hosts across victim environments. It has been linked to a sophisticated, suspected state-backed cyber espionage operation against foreign entities wherein the software was used to launch automated actions after installation. Additionally, ScreenConnect was pivotal in the attacks against Wipro back in 2019, when attackers used it to conduct gift card fraud.While we’re not fully aware of the technical aspects of these attacks, we can start to generate detection logic surrounding abnormal behavior. Start with a broad question: what can I expect from normal execution of ScreenConnect? This may be a tough question to answer in your environment, depending on whether or not the tool is approved for use. If it’s not approved, your pseudo-detection logic may be as simple as: Detect whenever ScreenConnect executes.Based on our own telemetry and intelligence gained from past incident response engagements, we’ve found that it is highly unusual for ScreenConnect or its child processes to write executable files to disk.We detected ScreenConnect deploying ransomware to endpoints by writing and executing them directly to the temp directory commonly used by the application:<img loading="lazy" decoding="async" class="alignnone size-full wp-image-28705" src="https://redcanary.com/wp-content/uploads/2021/08/image5-1.png" alt="remote access trojan detection" width="1420" height="420" srcset="https://redcanary.com/wp-content/uploads/2021/08/image5-1.png 1420w, https://redcanary.com/wp-content/uploads/2021/08/image5-1-300x89.png 300w, https://redcanary.com/wp-content/uploads/2021/08/image5-1-1024x303.png 1024w, https://redcanary.com/wp-content/uploads/2021/08/image5-1-768x227.png 768w" sizes="auto, (max-width: 1420px) 100vw, 1420px" />ScreenConnect allows users to enter custom commands to be executed within the context of a remote session. Whenever a user executes a command within the ScreenConnect command shell, it creates and executes a script file ending with run.cmd under the temp directory. An example of a commonly used file name and directory may look like the following:C:\WINDOWS\TEMP\ScreenConnect\6.9.22228.6977\1eb49efb-9375-4da2-a96c-5a935a1e2d42run.cmdMore information about this execution chain can be found in this blog by the Morphisec team. The script file is eventually executed via cmd.exe.A practical detection rule could be based on identifying the following:process command lines containing ScreenConnecta command line including run.cmda child process writing a binary file to disk We have observed initial payloads designed to drop ransomware families such as REvil/Sodinokibi via the following process chain:<img loading="lazy" decoding="async" class="alignnone size-full wp-image-28706" src="https://redcanary.com/wp-content/uploads/2021/08/image8-1.png" alt="remote access trojan detection" width="1874" height="1146" srcset="https://redcanary.com/wp-content/uploads/2021/08/image8-1.png 1874w, https://redcanary.com/wp-content/uploads/2021/08/image8-1-300x183.png 300w, https://redcanary.com/wp-content/uploads/2021/08/image8-1-1024x626.png 1024w, https://redcanary.com/wp-content/uploads/2021/08/image8-1-768x470.png 768w, https://redcanary.com/wp-content/uploads/2021/08/image8-1-1536x939.png 1536w" sizes="auto, (max-width: 1874px) 100vw, 1874px" /> Detection opportunity 3We suggest writing, implementing, and testing the following rules within your EDR platform or SIEM:ScreenConnect suspect child lineage:Parent_process = cmd.exeparent command line includes = run.cmd & screenconnectProcess = cmd.exeChildprocess = powershell.exeScreenConnect writing binaries:ScreenConnect writing binaries to C:\Windows\Temp\screenconnect\<Version Number>\*ScreenConnect spawning binaries:ScreenConnect spawning binaries from the following file path with many file modifications: C:\Windows\Temp\screenconnect\<Version Number>\* (This may indicate successful ransomware execution). AnydeskAnydesk markets itself as a cross-platform, fast, and secure remote desktop application capable of performing reliably under bandwidth constrained network connections. Due to its simplicity, Anydesk has recently become a de facto RMM tool used by attackers due to its lightweight footprint and ease of use for moving laterally.Anydesk is a popular tool for controlling victim machines and deploying ransomware payloads, more commonly seen with the following ransomware families: Blackheart, Sodinokibi/REvil, Netwalker, and Darkside. Attackers will typically drop instances of Anydesk to conspicuous paths not normally observed. Detecting abnormal Anydesk behavior can be fairly simple in most instances, since it has fairly predictable behavior when executed.Under normal circumstances, Anydesk typically executes from these paths:C:\Program Files (x86)\anydesk\anydesk.exeC:\Program Files\anydesk\anydesk.exeC:\Users\<User>\Downloads\anydesk.exeConversely, we’ve identified Anydesk being dropped in the following file paths during active ransomware incidents:C:\Windows\temp\anydesk.exeC:\ProgramData\anydesk.exeC:\ProgramData\Adobe\Setup\AnyDesk.exeOur first suggestion for defenders is to monitor your endpoints for relocated instances of Anydesk. Given that Anydesk may legitimately run from custom file paths, this may be an imperfect detect'
