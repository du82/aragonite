title = "Privacy Policy | Red Canary"
description = "We take your privacy seriously. Here's how we do it."
full_description = "Last updated: 5/22/2024California Notice at Collection: See the California Privacy Rights section below for important information about California residents’ rights.Notice to European Residents: See the Notice to European Users section below for individuals located in the European Union, European Economic Area, United Kingdom, and Switzerland (collectively, “Europe” or “European”)This “Privacy Policy” describes the privacy practices of Red Canary, Inc. and our subsidiaries and affiliates (collectively, “Red Canary”, “we”, “us” or “our”) in connection with the www.redcanary.com website and any other website that we own or control and which posts or links to this Privacy Policy (collectively, the “Services”), and the rights and choices available to individuals with respect to their information.Please note that this Privacy Policy does not apply to the information we process on behalf of our customers. We provide cutting-edge security solutions to our customers, including platform and cloud based security and intelligence subscription services and free community security tools. Our processing of personal information on behalf of our customers is governed by agreements between us and our customers. These agreements require our customers to comply with applicable privacy laws and, to the extent the customers are legally required, provide privacy notices to the individuals whose data our customers process using Red Canary’s offerings. Table of ContentsPersonal Information We CollectHow We Use Your Personal InformationHow We Share Your Personal InformationYour ChoicesOther Sites, Mobile Applications and ServicesSecurity PracticesCalifornia Privacy RightsInternational Data TransfersChildrenChanges to This Privacy PolicyHow to Contact UsNotice to European UsersCookie Policy Personal Information We CollectInformation you provide to us. Personal information you provide to us through the Services or otherwise includes:Business and personal contact information, such as your first and last name, email and mailing addresses, phone number, professional title and company name and information.Content you choose to upload to the Services, such as comments on our blog and survey responses.Feedback or correspondence, such as information you provide when you contact us with questions, feedback, or otherwise correspond with us online.Registration information, such as information that may be related to a service or an event you register for.Usage information, such as information about how you use the Service and interact with us, including information associated with any content you submit to us, and information you provide when you use any interactive features of the Service.Marketing information, such as your preferences for receiving communications about our activities, events, and publications, and details about how you engage with our communicationsOther information that we may collect which is not specifically listed here, but which we will use in accordance with this Privacy Policy or as otherwise disclosed at the time of collection.Information we obtain from social media platforms. We may maintain pages for our Company on social media platforms, such as Facebook, LinkedIn, Twitter, Google, YouTube, Instagram, and other third party platforms. When you visit or interact with our pages on those platforms, the platform provider’s privacy policy will apply to your interactions and their collection, use and processing of your personal information. You or the platforms may provide us with information through the platform, and we will treat such information in accordance with this Privacy Policy.Information we obtain from other third parties. We may receive personal information about you from third-party sources. For example, a business partner may share your contact information with us if you have expressed interest in learning specifically about our products or services, or the types of products or services we offer. Your contact information may be collected by a third party and provided to us in connection with your access to one of our resource materials (such as Red Canary reports or guides). We may obtain your personal information from other third parties, such as marketing partners, publicly-available sources and data providers.Cookies and Other Information Collected by Automated Means We, our service providers, and our business partners may automatically log information about you, your computer or mobile device, and activity occurring on or through the Service. The information that may be collected automatically includes your computer or mobile device operating system type and version number, manufacturer and model, device identifier (such as the Google Advertising ID or Apple ID for Advertising), browser type, IP address, general location information such as city, state or geographic area; and information about your use of and actions on the Services, such as pages or screens you viewed, how long you spent on a page or screen, navigation paths between pages or screens, information about your activity on a page or screen, access times, and length of access. Our service providers and business partners may collect this type of information over time and across third-party websites and mobile applications.On our webpages, this information is collected using cookies, browser web storage (also known as locally stored objects, or “LSOs”), web beacons, and similar technologies, and our emails may also contain web beacons. See our Cookie Policy for more information.How We Use Your Personal InformationWe use your personal information for the following purposes and as otherwise described in this Privacy Policy or at the time of collection:To operate the Services. We use your personal information to:provide, operate and improve the Servicesprovide information about our products and servicesestablish and maintain your user profile on the Servicesenable security features of the Services, such as by sending you security codes via email or SMS, and remembering devices from which you have previously logged incommunicate with you about the Services, including by sending you announcements, updates, security alerts, and support and administrative messagescommunicate with you about events or surveys in which you participateunderstand your needs and interests, and personalize your experience with the Services and our communicationsprovide support and maintenance for the Servicesto respond to your requests, questions and feedbackFor research and development. We analyze use of the Services to improve the Services and to develop new products and services, including by studying user demographics and use of the Services.To send you marketing and promotional communications. We may send you Red Canary-related marketing communications as permitted by law. You will have the ability to opt-out of our marketing and promotional communications as described in the Opt out of marketing section below.To display advertisements. We work with advertising partners to display advertisements elsewhere online. These advertisements are delivered by our advertising partners and may be targeted based on your use of the Service or your activity elsewhere online. To learn more about your choices in connection with advertisements, please see the section below titled “Targeted online advertising.”To comply with law. We use your personal information as we believe necessary or appropriate to comply with applicable laws, lawful requests, and legal process, such as to respond to subpoenas or requests from government authorities.For compliance, fraud prevention, and safety. We may use your personal information and disclose it to law enforcement, government authorities, and private parties as we believe necessary or appropriate to: (a) protect our, your or others’ rights, privacy, safety or property (including by making and defending legal claims); (b) enforce the terms and conditions that govern the Services; and (c) protect, investigate and deter against fraudulent, harmful, unauthorized, unethical or illegal activity.With your consent. In some cases we may specifically ask for your consent to collect, use or share your personal information, such as when required by law. To create anonymous, aggregated or de-identified data. We may create anonymous, aggregated or de-identified data from your personal information and other individuals whose personal information we collect. We make personal information into anonymous, aggregated or de-identified data by removing or not utilizing information that makes the data personally identifiable to you. We may use this anonymous, aggregated or de-identified data and share it with third parties for our lawful business purposes, including to analyze and improve the Service and promote our business.How We Share Your Personal InformationWe do not share your personal information with third parties without your consent, except in the following circumstances or as described in this Privacy Policy:Affiliates. We may share your personal information with our corporate parent, subsidiaries, and affiliates, for purposes consistent with this Privacy Policy.Service providers. We may share your personal information with third party companies and individuals that provide services on our behalf or help us operate the Services (such as customer support, hosting, analytics, email delivery, marketing, and database management services). These third parties may use your personal information only as directed or authorized by us and in a manner consistent with this Privacy Policy, and are prohibited from using or disclosing your information for any other purpose.Co-branded event partners. We may share your personal information with third party companies that partner with us on co-branded events (such as webinars we offer with a partner). These third parties may use your personal information consistent with their privacy policies. Professional advisors. We may disclose your personal information to professional advisors, such as lawyers, bankers, auditors and insurers, where necessary in the course of the professional services that they render to us.Authorities and others. We may share your personal information with law enforcement, government authorities, and private parties, as we believe in good faith to be necessary or appropriate for the compliance, fraud prevention, and safety purposes described above, or to meet national security or law enforcement requirements.Business transferees. Acquirers and other relevant participants in business transactions (or negotiations of or due diligence for such transactions) involving a corporate divestiture, merger, consolidation, acquisition, reorganization, sale or other disposition of all or any portion of the business or assets of, or equity interests in, Red Canary, our affiliates, or our subsidiaries (including, in connection with a bankruptcy or similar proceedings).Your ChoicesIn this section, we describe the rights and choices available to all users. Users who are located within Europe can find additional information about their rights below.Opt out of marketing communications. You may opt out of marketing-related emails by following the opt-out or unsubscribe instructions at the bottom of the email, or by contacting us at privacy@redcanary.com. You may continue to receive service-related and other non-marketing emails.Cookies & Browser Web Storage. We may allow service providers and other third parties to use cookies and similar technologies to track your browsing activity over time and across the Services and third party websites. For more details, see our Cookie Policy.Targeted online advertising. Some of the business partners that collect information about users’ activities on or through the Services may be members of organizations or programs that provide choices to individuals regarding the use of their browsing behavior or mobile application usage for purposes of targeted advertising.Users may opt out of receiving targeted advertising on websites through members of the Network Advertising Initiative by clicking here or the Digital Advertising Alliance by clicking here. European users may opt out of receiving targeted advertising on websites through members of the European Interactive Digital Advertising Alliance by clicking here, selecting the user’s country, and then clicking “Choices” (or similarly titled link). Please note that we also may work with companies that offer their own opt-out mechanisms and may not participate in the opt-out mechanisms that we linked above.In addition, your mobile device settings may provide functionality to limit our or our partners’ ability to engage in ad tracking or targeted advertising using the Google Advertising ID or Apple ID for Advertising associated with your mobile device.If you choose to opt-out of targeted advertisements, you will still see advertisements online but they may not be relevant to you. Even if you do choose to opt out, not all companies that serve online behavioral advertising are included in this list, so you may still receive some cookies and tailored advertisements from companies that are not listed.Do Not Track. Some Internet browsers may be configured to send “Do Not Track” signals to the online services that you visit. We currently do not respond to “Do Not Track” signals. To find out more about “Do Not Track,” please visit http://www.allaboutdnt.com.Choosing not to share your personal information. Where we are required by law to collect your personal information, or where we need your personal information in order to provide the Services to you, if you do not provide this information when requested (or you later ask to delete it), we may not be able to provide you with our services. We will tell you what information you must provide to receive the Services by designating it as required at the time of collection or through other appropriate means.Other Sites, Mobile Applications and ServicesThe Services may contain links to other websites, mobile applications, and other online services operated by third parties. These links are not an endorsement of, or representation that we are affiliated with, any third party. In addition, our content may be included on web pages or in mobile applications or online services that are not associated with us. We do not control third party websites, mobile applications or online services, and we are not responsible for their actions. Other websites and services follow different rules regarding the collection, use and sharing of your personal information. We encourage you to read the privacy policies of the other websites and mobile applications and online services you use.Security PracticesThe security of your personal information is important to us. We employ organizational, technical and physical safeguards designed to protect the personal information we collect. However, security risk is inherent in all Internet and"
