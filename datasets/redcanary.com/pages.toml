description = "Optimize your security data strategy. Avoid paying a premium for high volume, low fidelity security data storage. Click to learn more."
full_description = 'REDUCE THE COST OF LOG RETENTIONAvoid paying a premium for high volume, low fidelity security data storage. By sending that data to Red Canary, you’ll save money while maintaining accessibility for your team’s and Red Canary’s investigations.<img decoding="async" class="splitImage" src="https://redcanary.com/wp-content/uploads/2024/11/1_SecurityDataLake_RedCanary_Update.png" alt="Red Canary Security Data Lake Dashboard Example" width="100%" />KEY BENEFITSReduce SIEM costsPay a fraction of SIEM storage costs for high volume, low fidelity data sources like Firewall, DNS, and SASE logs.Meet retention requirementsProve to auditors that your data is retained and can be retrieved on-demand. If you need to export specific logs you can do so at any time.Investigate stored data*Ensure data availability for your team’s and Red Canary’s investigations, improving your security posture. *Targeting availability H12025The ChallengeOrganizations face frustrating tradeoffs when executing their security data strategies. Optimizing for threat detection results in storing all potentially security-relevant data in an expensive SIEM, even if most of that data isn’t valuable for detection. Optimizing for storage costs requires building an analytic platform on top of a data lake, requiring significant initial and ongoing investment to operationalize a threat detection program.Our SolutionFlexible and cost-efficient retentionStore raw data–JSON strings, syslog messages, anything that’s line delimited that you can write to an S3 bucket–for any length of time specified by you.Available now<img decoding="async" src="https://redcanary.com/wp-content/uploads/2024/11/3_SecurityDataLake_RedCanary.png" alt="Red Canary Data Lake By the Numbers Example Image" width="100%" /><img decoding="async" src="https://redcanary.com/wp-content/uploads/2024/11/2_SecurityDataLake_RedCanary_Update.png" alt="Red Canary Data Lake Json Integration Data" width="100%" />SQL search and analyticsUse SQL to search based on specific attributes–IPs, hostnames, URLs, date/time ranges–and run basic statistical analyses to support internal investigations.Target availability Feb. ‘25MDR enhancementRed Canary can leverage the Security Data Lake during our investigations, strengthening your detection and response coverage.Target availability Jun. ‘25<img decoding="async" class="splitImages" src="https://redcanary.com/wp-content/uploads/2024/05/demo53e58ef6.my_.redcanary.co_threats_20.png" alt="Screenshot of threat intelligence in Red Canary portal" width="100%" />'
