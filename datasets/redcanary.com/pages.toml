full_description = 'Integrated Apple-native solution for threat detection and responseRed Canary MDR delivers threat detection and response for macOS devices with Jamf Protect endpoint security. Jamf Protect blocks known threats and protects Apple devices from ransomware and other malware. Red Canary uses telemetry generated by Jamf Protect to analyze device and user activity for risky behavior. When a real threat is identified, Red Canary responds quickly to prevent harm and data loss.<img decoding="async" style="filter: blur(5px); height: 100%; object-fit: contain; width: 100%;" src="https://fast.wistia.com/embed/medias/kuenv0sxqm/swatch" alt="" aria-hidden="true" />How it works<img fetchpriority="high" decoding="async" class="alignnone size-full wp-image-29140" src="https://redcanary.com/wp-content/uploads/2021/10/Jamf_RC_desktop.jpg" alt="Diagram showing how Red Canary sends updates to Jamf based on detected threats" width="1920" height="548" srcset="https://redcanary.com/wp-content/uploads/2021/10/Jamf_RC_desktop.jpg 1920w, https://redcanary.com/wp-content/uploads/2021/10/Jamf_RC_desktop-300x86.jpg 300w, https://redcanary.com/wp-content/uploads/2021/10/Jamf_RC_desktop-1024x292.jpg 1024w, https://redcanary.com/wp-content/uploads/2021/10/Jamf_RC_desktop-768x219.jpg 768w, https://redcanary.com/wp-content/uploads/2021/10/Jamf_RC_desktop-1536x438.jpg 1536w" sizes="(max-width: 1920px) 100vw, 1920px" /> How it works<img decoding="async" class="alignnone size-full wp-image-29140" src="https://redcanary.com/wp-content/uploads/2021/10/Jamf_RC_desktop.jpg" alt="Diagram showing how Red Canary sends updates to Jamf based on detected threats" width="1920" height="548" srcset="https://redcanary.com/wp-content/uploads/2021/10/Jamf_RC_desktop.jpg 1920w, https://redcanary.com/wp-content/uploads/2021/10/Jamf_RC_desktop-300x86.jpg 300w, https://redcanary.com/wp-content/uploads/2021/10/Jamf_RC_desktop-1024x292.jpg 1024w, https://redcanary.com/wp-content/uploads/2021/10/Jamf_RC_desk