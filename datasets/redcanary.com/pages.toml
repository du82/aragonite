["https://redcanary.com/resources/webinars/cloud-security-strategies-bridging-gap-development-detection"]
title = "[Webinar] Cloud security strategies"
description = "A cloud architect and detection engineer provide insights into how they work together to improve cloud security. Register now!"
full_description = 'Resources • WebinarsCloud security strategies: Bridging the gap between development and detectionEnjoy a fireside chat between a cloud architect and a detection engineer as they provide insight into how they work together to improve analytics to separate malicious behavior from user activity.On-Demand25 mins.VirtualMktoForms2.loadForm("//resource.redcanary.com", "003-YRU-314", 1393);Enjoy a fireside chat between a cloud architect and a detection engineer as they provide insight into how they work together to improve analytics to separate malicious behavior from user activity. Join Brian Davis, Principal Software Engineer and cloud builder, and Thomas Gardner, Senior Detection Engineer, for an enlightening conversation on how their job roles can occasionally be at odds with each other and how they work together to help improve Red Canary’s behavioral analytics and detection capabilities.They’ll dive into the common and very real world issue of cloud architects and developers oftentimes performing actions at speed that can look like adversarial behavior.How do Detection Engineers like Thomas make sense of these activities, and how do Thomas and Brian work together to improve threat intelligence and activity analysis to ensure that the cloud environment is secure without hindering Brian’s day to day work?Get the inside scoop from two experts in the trenches and learn how to manage this relationship within your own organization.MEET THE SPEAKERS Brian DavisEnterprise Architect Brian has been designing and building complex systems for the past two decades. His career started in signal processing algorithm research but has morphed through the years into software engineering, QA, system integration, system design, and architecture. At Red Canary, Brian is focused on identifying scalability challenges within our system and working with our engineering teams to solve them before they become problems.Brian has been designing and building complex systems for the past two decades. His career started in signal processing algorithm research but has morphed through the years into software engineering, QA, system integration, system design, and architecture. At Red Canary, Brian is focused on identifying scalability challenges within our system and working with our engineering teams to solve them before they become problems. Thomas GardnerSenior Detection Engineer Thomas is a detection engineer at Red Canary, where he splits his time investigating threats to our customers and developing new methods of finding them. Prior to Red Canary, Thomas worked at CenturyLink in various roles spanning incident response, threat hunting, and threat intelligence. Outside work, he enjoys scaling rock walls with dainty rubber shoes and fistfuls of chalk.Thomas is a detection engineer at Red Canary, where he splits his time investigating threats to our customers and developing new methods of finding them. Prior to Red Canary, Thomas worked at CenturyLink in various roles spanning incident response, threat hunting, and threat intelligence. Outside work, he enjoys scaling rock walls with dainty rubber shoes and fistfuls of chalk.'
