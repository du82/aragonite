["https://redcanary.com/mac-threat-analysis-tool"]
title = "Red Canary Mac Monitor, a Mac Threat Analysis Tool"
description = "Download Red Canary Mac Monitor, a distribution package that enables quick high-resolution analysis of macOS security events."
full_description = 'In 2019, Apple deprecated kernel extensions and introduced their Endpoint Security (ES) framework. Because of this change many EDR companies had to adapt their tools to integrate and work with this new interface. At Red Canary, our threat research team is always looking to uncover the latest threats. However, we found that the modified EDR tools we had access to did not allow us to conduct quick high-resolution analysis of Mac security events. So, we created our own solution, Red Canary Mac Monitor, which we are also making available to the community.Mac Monitor is a distribution package available to download for free, and is designed to take advantage of the ES API to monitor and ingest process and event data that other tools are skipping. With Mac Monitor we can now collect ES events dynamically around a specific set of activities to provide targeted and dynamic macOS system event analysis. What does this mean? It means we can go deeper, analyzing data others aren’t to identify threats that others miss. Download Package @media (max-width: 767px) { #id-9633c71c672848007cc57f900fb4dbe6 { } }Overview <img class="icon" src="https://redcanary.com/wp-content/uploads/2019/02/icon_record_white-1.svg" alt="icon_record_white" />So what is Red Canary Mac Monitor looking at?32 high-impact endpoint security events we have modeled across:ProcessInterprocessCode signingFileFile metadataMemory mappingLoginBackground Task Management (BTM)XProtectAs new research is published, threats evolve, and Endpoint Security (ES) is updated (with new versions of macOS) we will add support for additional events. You can find a full list at our GitHub repo here. <img class="icon" src="https://redcanary.com/wp-content/uploads/2021/03/Icon_Alert-Center_Investigation.png" alt="Icon_Alert-Center_Investigation" />What does Mac Monitor help do?Mac Monitor will serve the macOS / Apple security research community by allowing users to produce cutting-edge, high-quality, and reproducible macOS threat research. ES knowledge within the public domain is extremely scarce, and we hope this will help to remedy that. Additionally, Mac Monitor will help the broader security community dig deeper into the telemetry generated on macOS allowing us to improve threat research within the Apple security space. Download package <img src="https://redcanary.com/wp-content/uploads/2023/04/Main-Event-Viewer-Black-Edit.jpg" alt="Main-Event-Viewer-Black-Edit" /> <img src="https://redcanary.com/wp-content/uploads/2023/04/ZSH-Event-Details-and-Metadata-Black-2.jpg" alt="ZSH-Event-Details-and-Metadata&#8211;Black" />overview <img src="https://redcanary.com/wp-content/uploads/2022/08/icon_record.svg" alt="So what is Red Canary Mac Monitor looking at?"> So what is Red Canary Mac Monitor looking at?18 high-impact endpoint security events we have modeled across:ProcessFileFile metadataFile systemIn-memory file mappingLoginBackground Task Management (BTM)As new research is published, threats evolve, and Endpoint Security (ES) is updated (with new versions of macOS) we will add support for additional events. You can find a full list at our GitHub repo here. <img src="https://redcanary.com/wp-content/uploads/2020/09/icon_alarm_deduplication.svg" alt="What does Mac Monitor help do?"> What does Mac Monitor help do?Mac Monitor will serve the macOS / Apple security research community by allowing users to produce cutting-edge, high-quality, and reproducible macOS threat research. ES knowledge within the public domain is extremely scarce, and we hope this will help to remedy that. Additionally, Mac Monitor will help the broader security community dig deeper into the telemetry generated on macOS allowing us to improve threat research within the Apple security space.features <img src="https://redcanary.com/wp-content/uploads/2023/03/icon_data_presentation-1.png" alt="">Easy-to-use UI that is quick to set up and configure <img src="https://redcanary.com/wp-content/uploads/2023/03/icon_tech_usability.png" alt="">Dynamically subscribe to the events you want to track <img src="https://redcanary.com/wp-content/uploads/2023/03/icon_tech_cms.png" alt="">Export your telemetry in JSON format <img src="https://redcanary.com/wp-content/uploads/2023/03/icon_tech_data-mining.png" alt="">Automatic correlation of events and grouping of processes to identify suspicious activity <img src="https://redcanary.com/wp-content/uploads/2023/03/icon_data_graphs-6.png" alt="">Customizable path muting and object filtering to adjust your view to focus only on the information you need <img src="https://redcanary.com/wp-content/uploads/2023/03/icon_tech_byte.png" alt="">Granular details across events, including the metadata, are directly reported by ES as is other relevant information (like code signing certificates for process execution events)'
