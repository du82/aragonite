["https://redcanary.com/blog/testing-and-validation/atomic-red-team-website"]
title = "Explore the new Atomic Red Team website | Red Canary"
description = "The redesigned Atomic Red Team website features a new browser interface, improved search capabilities, and easier test execution"
full_description = 'Since its public release in 2017, the Atomic Red Team project has evolved into a comprehensive suite of focused tests designed to emulate specific adversary behaviors. Mapped to the MITRE ATT&CK® framework, these tests allow defenders to ensure detection and response actions are effective, as well as providing red teams and penetration testers with a library of methods to ensure the completeness of their own capabilities. This open source project is the result of contributions of hundreds of practitioners from many cybersecurity disciplines and organizations across the globe.Today, we are excited to announce an entirely new website for Atomic Red Team, featuring a browsable interface to the numerous tests with tips on how to use them, documentation and other educational resources, information on how to contribute to the project, and more. The new site provides several long-requested feature additions such as an easier method to execute the sometimes complex command lines in your environment, more detailed searching and filtering capabilities, and a generally more streamlined interface. This convenient interface ensures that even a casual user can learn about and launch tests in their own environment to help improve their security posture. <img loading="lazy" decoding="async" class="size-full wp-image-38342 aligncenter" src="https://redcanary.com/wp-content/uploads/2024/11/atomicredteam.io-2024-newsite-1.gif" alt="" width="722" height="626" /> We’d like to thank Hare Sudhan, an Atomic Red Team maintainer and prolific contributor for his dedicated effort bringing the new site into existence, and assistance in the launch. As with all open source projects, an active and vibrant community is the cornerstone of growth and success.Please take a look at the updated site, consider how you can use Atomic Red Team to improve your security stack and procedures, and join the community to stay in touch with ongoing developments in the project. KEEP UP WITH ALL THINGS ATOMIC Subscribe to the Atomic newsletter to get a monthly round-up of new tests, research, and other resources for detection validation sent to your inbox. Related Articles Emu-lation: Validating detections for SocGholish with Atomic Red Team Testing and validationEmu-lation: Validating detections for SocGholish with Atomic Red Team Emu-lation: Validating detection for Gootloader with Atomic Red Team Testing and validationEmu-lation: Validating detection for Gootloader with Atomic Red Team Safely validate executable file attributes with Atomic Test Harnesses Testing and validationSafely validate executable file attributes with Atomic Test Harnesses Find security bugs in web application routes with route-detect Testing and validationFind security bugs in web application routes with route-detect Subscribe to our blog MktoForms2.loadForm("//resource.redcanary.com", "003-YRU-314", 1034);'
