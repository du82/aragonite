["https://redcanary.com/company"]
title = "About Us - Red Canary"
description = "As a company, Red Canary is relentless in our mission to improve security not just for our customers, but the entire cybersecurity community."
full_description = '''@media (max-width: 767px) { #id-1f23388afd7bda8e50dfdd1c6f16ee58 { } }<img fetchpriority="high" decoding="async" class="alignnone size-full wp-image-29714" src="https://redcanary.com/wp-content/uploads/2021/12/RC_Founders.png" alt="" width="2048" height="1366" srcset="https://redcanary.com/wp-content/uploads/2021/12/RC_Founders.png 2048w, https://redcanary.com/wp-content/uploads/2021/12/RC_Founders-300x200.png 300w, https://redcanary.com/wp-content/uploads/2021/12/RC_Founders-1024x683.png 1024w, https://redcanary.com/wp-content/uploads/2021/12/RC_Founders-768x512.png 768w, https://redcanary.com/wp-content/uploads/2021/12/RC_Founders-1536x1025.png 1536w" sizes="(max-width: 2048px) 100vw, 2048px" /> <h6>Not seeing the form?</h6><p>Email <a href="mailto:marketing@redcanary.com"><strong>marketing@redcanary.com</strong></a> and we’ll help you get registered. Or you can always <a href="/contact-us/"><strong>contact us</strong></a>.</p> jQuery(function($){setTimeout(function(){$('input[name="Last_Campaign_Interaction__c"]').val('');},1200);}); Back in 2013, after leaving the intelligence community, our founders were helping organizations respond to breaches. These were good security teams who did “all the right things”, bought the right products, had the right services, and yet they were still breached.They knew the system was broken, so they developed a different kind of security platform and service to truly protect organizations from cyber attacks. Since then, Red Canary has been a security ally to customers of all shapes and sizes—from the most sophisticated technology and finance companies, to healthcare and small businesses. And we haven’t looked back since. Our Origin Story Who we are<img decoding="async" class="alignnone size-full wp-image-29715" src="https://redcanary.com/wp-content/uploads/2021/12/RCatWork3-1.jpeg" alt="" width="1222" height="900" srcset="https://redcanary.com/wp-content/uploads/2021/12/RCatWork3-1.jpeg 1222w, https://redcanary.com/wp-content/uploads/2021/12/RCatWork3-1-300x221.jpeg 300w, https://redcanary.com/wp-content/uploads/2021/12/RCatWork3-1-1024x754.jpeg 1024w, https://redcanary.com/wp-content/uploads/2021/12/RCatWork3-1-768x566.jpeg 768w" sizes="(max-width: 1222px) 100vw, 1222px" />At Red Canary, we’re using everything we’ve got—our business resources, technology, expertise, and our heart—to keep organizations focused on their mission and everything it stands for.We are security practitioners who know the stress of defending an organization against a very human adversary. We know the typical experience of buying security products and services, the ridiculous marketing, and the broken promises.We’re passionate about how we can play our part in making the information security community more open and inviting to new members. Our education and open source programs make the entire community a better place. Sounds like you? Join us. @media (max-width: 767px) { #id-ccbbbe4606e30ed33c615bf92ac0d163 { } }Our values <img class="icon" src="https://redcanary.com/wp-content/uploads/2021/12/core-values_icon_relentless-01.svg" alt="core-values_icon_relentless-01" />We are relentlessOur adversary is very human and relentless in their crimes. We are equally relentless in finding and stopping those adversaries. Security teams we partner with have to be ready 24×7, and we are always there alongside them.Every time we ship code, respond to a support request, or coach our partners, we always push to go a little faster. <img class="icon" src="https://redcanary.com/wp-content/uploads/2021/12/core-values_icon_quality-01.svg" alt="core-values_icon_quality-01" />We always deliver qualityThe cybersecurity industry is littered with products that were well loved when they were small but lost their quality as they grew. We obsess over not being one of them.Our guiding principle is that we’ll try to grow as quickly as possible—while maintaining quality. <img class="icon" src="https://redcanary.com/wp-content/uploads/2021/12/core-values_icon_authentic-01.svg" alt="core-values_icon_authentic-01" />We are kind and authenticBeing kind is often a novelty in security and technology business. We’re changing that. We embrace our authenticity and show kindness to other Canaries, competitors, and the community. <img class="icon" src="https://redcanary.com/wp-content/uploads/2021/12/core-values_icon_right-01.svg" alt="core-values_icon_right-01" />We do what’s right for our customersOur hypergrowth forces us to make hundreds of important decisions each day. We never stop thinking about what’s best for our customers. That always guides us to the right choices—even if those choices are more challenging. Join our team <img src="https://redcanary.com/wp-content/uploads/2021/12/Red-Canary-Chicago-Event.jpeg" alt="Red-Canary-Chicago-Event" /> <img src="https://redcanary.com/wp-content/uploads/2021/12/RCatWork4-1.jpeg" alt="RCatWork4-1" />Red Canary by the numbers400+employees500+educational blog posts and webinars4000+security teams served Leadership Team Brian BeyerChief Executive Officer & Co-Founder Chris RotheCo-Founder Keith McCammonChief Security Officer & Co-Founder John RitchieChief Financial Officer Katie BullardPresident Todd ChronertChief Revenue Officer Joe MolesChief Technology Officer Melissa CzapigaChief Marketing Officer Mary WritzSVP, Product Management Jenny CampbellVP, Customer Success Dave FarrowVP, Chief Information Security Officer Matt SpohnGeneral CounselBoard of Directors Brian BeyerCo-founder & Chief Executive Officer Dean HagerFormer CEO, Jamf Andy CollinsManaging Director, Summit Partners Alan TaetleGeneral Partner, Noro-Moseley Partners Frank MendicinoCo-Founder and Managing Director, Access Venture Partners Colin MisteleManaging Director, Summit Partners Mike ViscusoCo-founder and fmr Chief Strategy Officer, Carbon Black Dan HallCo-founder & Chief Executive Officer, Kyrus'''
