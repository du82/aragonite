full_description = '''Challenges with tabletops#boxlink-221345264 * { color: #000; } #boxlink-221345264 svg { fill: #000; .st3 { fill: #000; } } #boxlink-221345264:hover:not(.no-link) svg .st3 { fill: #000; } <img src="https://redcanary.com/wp-content/uploads/2023/05/fingerprint.png" width="80">Frequency Due to lack of repetition, the lessons from cybersecurity tabletop exercises tend to be forgotten.#boxlink-535375631 * { color: #000; } #boxlink-535375631 svg { fill: #000; .st3 { fill: #000; } } #boxlink-535375631:hover:not(.no-link) svg .st3 { fill: #000; } <img src="https://redcanary.com/wp-content/uploads/2023/04/icon_email_alert.png" width="95">Unrealistic Tabletops are often unrelated to the threats that actually affect your organization and aren’t customized to your situation.#boxlink-796212142 * { color: #000; } #boxlink-796212142 svg { fill: #000; .st3 { fill: #000; } } #boxlink-796212142:hover:not(.no-link) svg .st3 { fill: #000; } <img src="https://redcanary.com/wp-content/uploads/2023/04/icon_tech_application.png" width="80">Engagement Trainings can often be dull, making it difficult to get team members to actively participate.Did you know?According to SANS, less than 50% of organizations conducted a tabletop at least once per year and less than 30% conducted at least two per year.KEY BENEFITSMore engaging and effective tabletops for the teamPractices occur on a frequent weekly or monthly basis instead of annually or ad-hoc, which captures the interest of participants and ensures lessons are retained. LEARN MORE Practice real-world scenarios updated regularlyContinuously practice and validate team preparedness against realistic scenarios based on trending adversary groups (like Scattered Spider), tools, MITRE ATT&CK® techniques, and our experience conducting millions of investigations. SEE HOW IT WORKS Get training, tabletop exercises, and atomic tests in one experienceBring together disparate learning tools and run them in your environment to maximize their relevance and impact. Exercises can be conducted internally or facilitated by us. Watch the Webinar "We've done three tabletop exercises now with a global firm, which took the majority of the day. We did a tabletop exercise with Red Canary, and just that single two-hour exercise blew those out of the water.”Joe YowellCybersecurity Engineer, Henny Penny <img src="https://redcanary.com/wp-content/uploads/2023/04/CanariesInFlight_RedCanary-Transparent.png" alt="CanariesInFlight_RedCanary-Transparent" />Improve your tabletops with Red CanaryWhether you want Red Canary to facilitate your tabletop exercise or you’re doing the facilitation, our Readiness Exercises platform enables engaging tabletops that get your team practicing for the real-world situations that matter.Exercises are tailored for your whole team including Incident Response, Security Leadership, Security Operations, Executive (CXO), Communications, Legal, Human Resources, and Finance.<img fetchpriority="high" decoding="async" class="alignnone size-full wp-image-34334" src="https://redcanary.com/wp-content/uploads/2023/04/Readiness-Scenarios.png" alt="" width="1500" height="971" srcset="https://redcanary.com/wp-content/uploads/2023/04/Readiness-Scenarios.png 1500w, https://redcanary.com/wp-content/uploads/2023/04/Readiness-Scenarios-300x194.png 300w, https://redcanary.com/wp-content/uploads/2023/04/Readiness-Scenarios-1024x663.png 1024w, https://redcanary.com/wp-content/uploads/2023/04/Readiness-Scenarios-768x497.png 768w" sizes="(max-width: 1500px) 100vw, 1500px" /> Readiness Exercises WebinarsRed Canary Readiness Exercises: Redefining incident response preparedness Red Canary Managed Detection and Response (MDR) Threat Detection Report: Introduction Guides & OverviewsIncident Response & Readiness Guide'''
