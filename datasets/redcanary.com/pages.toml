full_description = '''Add an ally. Strengthen your defenses.You don’t need time, expertise, or an army of security hires to build a 24/7 detection and response capability—you simply need Red Canary.As VMware Carbon Black specialists, we ensure you get immediate return on your product investments, along with the added peace of mind of knowing an industry-respected detection and response team is watching your environment at all times.10xyour detection coverage24/7detection and response99.9%fewer false positives Watch On-Demand Webinar Security Allies: Why Successful EDR Deployments Require a Team How it works Turnkey detection and responseRed Canary helps you deploy, configure, and update policies for VMware Carbon Black sensors. We ingest your product alerts and analyze your endpoint telemetry using our cloud-based detection engine composed of thousands of behavioral analytic use cases. <img src="https://redcanary.com/wp-content/uploads/2019/02/icon_empowered-response.svg" alt="Hunt adversaries and evolve detection"> Hunt adversaries and evolve detectionRed Canary researches new attacker behavior and continually combs your environment. We maintain industry-leading detection coverage by updating our library of behavioral analytic use cases hundreds of times per week in response to new attacker behavior. <img src="https://redcanary.com/wp-content/uploads/2019/02/icon_gears.svg" alt="Offload investigations and add automation"> Offload investigations and add automationWe perform full investigations using our proprietary analyst workbench and only alert you to confirmed threats. A detailed threat report is posted in your Red Canary portal where you can customize automated response actions and playbooks. <img src="https://redcanary.com/wp-content/uploads/2019/07/icon_saving_time80.png" alt="Active Remediation and Managed Response"> Active Remediation and Managed ResponseOur incident handlers can perform active or managed remediation and containment in your environment. learn more <img fetchpriority="high" decoding="async" class="alignnone size-full wp-image-29674" src="https://redcanary.com/wp-content/uploads/2021/12/HowItWorks_VMwareCB_RC-02.png" alt="" width="8043" height="2285" srcset="https://redcanary.com/wp-content/uploads/2021/12/HowItWorks_VMwareCB_RC-02.png 2048w, https://redcanary.com/wp-content/uploads/2021/12/HowItWorks_VMwareCB_RC-02-300x85.png 300w, https://redcanary.com/wp-content/uploads/2021/12/HowItWorks_VMwareCB_RC-02-1024x291.png 1024w, https://redcanary.com/wp-content/uploads/2021/12/HowItWorks_VMwareCB_RC-02-768x218.png 768w, https://redcanary.com/wp-content/uploads/2021/12/HowItWorks_VMwareCB_RC-02-1536x436.png 1536w" sizes="(max-width: 8043px) 100vw, 8043px" />What Customers Are SayingVMware Carbon Black products collect thousands of events every hour. Analyzing that volume of data would take massive time and effort from our team. Red Canary is a hands-off strategy. I deploy the sensor and Red Canary does the rest. I can meet with my incident handler at any time, or log into my Red Canary portal to see exactly what's happening.”Lead Infrastructure Security Engineer01 / 03Red Canary covers the gaps and gives us a set of eyes on our environment 24/7. Knowing they're looking for suspicious activity around the clock gives us peace of mind.”02 / 03If you don’t have the subject matter expertise to continuously monitor and improve VMware Carbon Black Cloud, look at Red Canary. They are the VMware Carbon Black experts.”Information Security Architect03 / 03 @media (max-width: 767px) { #id-b17aa258dc16facb0e7e9dfbeea7c778 { } } BenefitsExpand and evolve detection coverageAdd efficiency by eliminating false positivesReduce mean time to respond with automationSeamlessly integrate into existing workflowsAccess security advice & incident response supportMeasure and strengthen security Expand and evolve detection coverageExpand and evolve detection coverageOur industry veterans perform ongoing threat research and analyze intelligence to ensure your coverage for attacker behaviors evolves with new information. No watchlist maintenance required.Red Canary observes 85% of MITRE ATT&CK® techniques and counting. Plus, we make sure you can count on our detection logic by continually running 12,000+ unique tests. <img src="https://redcanary.com/wp-content/uploads/2020/06/1.expand.evolve.jpg" alt="1.expand.evolve" /> Add efficiency by eliminating false positivesAdd efficiency by eliminating false positivesStop wasting time chasing bad leads. Red Canary only alerts you to detailed, confirmed threats—with fewer than 1/1000 false positives—so you can stay focused on strategic security projects. <img src="https://redcanary.com/wp-content/uploads/2020/06/2.effiency.jpg" alt="2.effiency" /> Reduce mean time to respond with automationReduce mean time to respond with automationSet up custom, automated response actions to safely contain ransomware, tackle tedious unwanted software tasks, and stop threats in your sleep. Or with Active Remediation, our experts will set up your custom response playbooks and contain and remediate all threats across your managed endpoints on your behalf. <img src="https://redcanary.com/wp-content/uploads/2020/06/3.reduce-time.jpg" alt="3.reduce-time" /> Seamlessly integrate into existing workflowsSeamlessly integrate into existing workflowsRed Canary integrates with the tools and workflows you already have in place. You can access detailed threat data for use in ticketing systems, SIEMs, Slack, SMS, and more. <img src="https://redcanary.com/wp-content/uploads/2020/06/4.seamlessyintegrate.jpg" alt="4.seamlessyintegrate" /> Access security advice & incident response supportAccess security advice & incident response supportYour incident handler is here for on-demand IR support and ongoing security advice. Get proactive guidance on how to mature your security strategy. <img src="https://redcanary.com/wp-content/uploads/2020/06/5.2Access.jpg" alt="5.2Access" /> Measure and strengthen securityMeasure and strengthen securityRed Canary shows you where you’re covered and gives you advice on how to improve. We’ll help you track how your security program is trending and how it compares to similar organizations. <img src="https://redcanary.com/wp-content/uploads/2020/06/6.-MeasureStrengthen.jpg" alt="6.-MeasureStrengthen" /> Why Red CanaryDeep expertise rooted in shared lineageRed Canary and Carbon Black were both innovations started inside Kyrus Tech, a boutique cybersecurity defense contractor. Red Canary’s founders started working with Carbon Black on Day 1 to deliver expert incident response services. When the founding team realized Carbon Black EDR collected all the necessary data for proactive threat detection and response, the idea for Red Canary was born. CB's Co-Founder on Red Canary'''
