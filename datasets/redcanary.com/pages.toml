full_description = 'Red Canary Office Hours: Episode 1 – Intelligence Insights, Tangerine Turkey, DeepSeek and AI RiskWelcome to Red Canary Office Hours! In this inaugural episode, Keith and Dave discuss intelligence insights from the past month, a new threat called Tangerine Turkey, and the risks of AI, including DeepSeek.Resources mentioned in today’s episode:Blog: Intelligence Insights: January 2025Subscribe to the Red Canary BlogBlog: Tangerine Turkey mines cryptocurrency in global campaignBleeping Computer article: DeepSeek AI tools impersonated by infostealer malware on PyPIPodcast: Inside the DeepSeek AI existential crisis, Chinese ‘backdoor’ in medical devicesJoin us every Tuesday at 1PM ET for fresh insights from the front lines and unfiltered takes on the biggest cybersecurity news and trends. Sign up now. <img decoding="async" src="https://fast.wistia.com/embed/medias/g2nnhle79s/swatch" style="filter:blur(5px);height:100%;object-fit:contain;width:100%;" alt="" aria-hidden="true" onload="this.parentNode.style.opacity=1;" />Timestamps:0:05 – Welcome to Red Canary Office Hours2:21 – Highlighting Tangerine Turkey17:55 – Introduction to DeepSeek AI Model <h6>Not seeing the form?</h6><p>Email <a href="mailto:marketing@redcanary.com"><strong>marketing@redcanary.com</strong></a> and we’ll help you get registered. Or you can always <a href="/contact-us/"><strong>contact us</strong></a>.</p> Related Resources Intelligence Insights: January 2025 Articles| Threat intelligence Intelligence Insights: January 2025 Tangerine Turkey mines cryptocurrency in global campaign Articles| Threat intelligence Tangerine Turkey mines cryptocurrency in global campaign Intelligence Insights: December 2024 Articles| Threat intelligence Intelligence Insights: December 2024 Storm-1811 exploits RMM tools to drop Black Basta ransomware Articles| Threat intelligence Storm-1811 exploits RMM tools to drop Black Basta ransomware'
