full_description = '''Training challenges#boxlink-407707735 * { color: #000; } #boxlink-407707735 svg { fill: #000; .st3 { fill: #000; } } #boxlink-407707735:hover:not(.no-link) svg .st3 { fill: #000; } <img src="https://redcanary.com/wp-content/uploads/2023/05/icon_time_calendar.png" width="85">Infrequent and dull Training is only conducted annually or ad-hoc, and when training does occur, it is difficult to engage participants, leading to a lack of retention.#boxlink-771534009 * { color: #000; } #boxlink-771534009 svg { fill: #000; .st3 { fill: #000; } } #boxlink-771534009:hover:not(.no-link) svg .st3 { fill: #000; } <img src="https://redcanary.com/wp-content/uploads/2023/05/icon_project_target-goals.png" width="75">Focused on the wrong threats Scenarios are outdated or focused on threats that are less likely to impact your organization.#boxlink-888014578 * { color: #000; } #boxlink-888014578 svg { fill: #000; .st3 { fill: #000; } } #boxlink-888014578:hover:not(.no-link) svg .st3 { fill: #000; } <img src="https://redcanary.com/wp-content/uploads/2023/05/icon_project_building-blocks.png" width="65">One-size-fits-all Training can be overly academic, using labs and situations that have nothing to do with your real-world environment.KEY BENEFITSGet training, tabletop exercises, and atomic tests in one continuous learning experienceBring together disparate learning tools and practice on a frequent weekly or monthly basis instead of annually. Whether conducted internally or facilitated by Red Canary experts, they engage participants and ensure that lessons stick. Watch the Webinar Based on real-world scenariosContinuously practice and validate team preparedness against realistic scenarios based on trending adversary groups (like Scattered Spider), tools, MITRE ATT&CK® techniques, and our experience conducting millions of investigations. Threat Detection Report Run in your environmentRather than a generic approach to training, Readiness Exercises are run in your environment, contextualizing the lessons and making them more likely to be retained. Learn More "Now our team can continuously train and benchmark our progress, learning from the Red Canary team who respond to real-world threats daily. It gives me confidence knowing that we're better prepared for the next threat that comes our way.”MICHAEL STRONGCHIEF SECURITY OFFICER, GCI (NASDAQ: LBRDA) <img src="https://redcanary.com/wp-content/uploads/2023/04/CanariesInFlight_RedCanary-Transparent.png" alt="CanariesInFlight_RedCanary-Transparent" />Continuously train for real-world scenarios with Readiness ExercisesReadiness Exercises is a learning experience platform that enables teams to continuously train for real-world situations, so they can get ready and stay ready for today’s top cyber threats.<img fetchpriority="high" decoding="async" class="alignnone size-full wp-image-34334" src="https://redcanary.com/wp-content/uploads/2023/04/Readiness-Scenarios.png" alt="" width="1500" height="971" srcset="https://redcanary.com/wp-content/uploads/2023/04/Readiness-Scenarios.png 1500w, https://redcanary.com/wp-content/uploads/2023/04/Readiness-Scenarios-300x194.png 300w, https://redcanary.com/wp-content/uploads/2023/04/Readiness-Scenarios-1024x663.png 1024w, https://redcanary.com/wp-content/uploads/2023/04/Readiness-Scenarios-768x497.png 768w" sizes="(max-width: 1500px) 100vw, 1500px" />Select a scenario to exercise, add users to specific scenarios, or invite new users based on their roles. Real-world scenarios range from 20 minutes to full 120 minute tabletops.Team members participate in interactive on-demand exercises that test their knowledge response skills.Users are scored and receive a response maturity level.Built-in retrospectives assess your readiness and maturity and generate action items to improve preparedness.Reports can be exported and used as proof of completion.Run exercises internally or have Red Canary facilitate. Readiness Exercises WebinarsRed Canary Readiness Exercises: 