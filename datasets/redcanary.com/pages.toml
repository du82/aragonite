full_description = '''Forrester names Red Canary a LeaderFor the second consecutive year, Red Canary was named a Leader in the Forrester Wave for Managed Detection and Response (MDR). Read the report NEW ENDPOINT SECURITY TRENDSWe’ve condensed 10 years of EDR expertise into one actionable guide, so you can confidently compare vendors and find the right platform for your business. DOWNLOAD THE GUIDE Threat Detection Report: Midyear UpdateHalfway through 2024, one thing is clear: adversaries are exploiting identities. Get the insights you need to secure your identity perimeter. See the report Managed detection and response (MDR) across your enterprise@media (max-width: 767px) { #id-0790f83be4403a5d45f1d9bab2db4615 { } } <img class="icon" src="https://redcanary.com/wp-content/uploads/2020/09/Icon_Alert-Center_Investigation.svg" alt="Icon_Alert-Center_Investigation" />Trusted Detection & ResponseKnow that you’re prepared for modern threats, go beyond the alerts in your inbox, and automatically respond to and remediate the real threats. <img class="icon" src="https://redcanary.com/wp-content/uploads/2023/03/icon_data_presentation-1.png" alt="icon_data_presentation (1)" />Intelligence-Led OperationsThreat research, investigation and response from the experts who pioneered behavioral analytics, testing, and mapping to ATT&CK <img class="icon" src="https://redcanary.com/wp-content/uploads/2023/05/icon_time_high-speed.png" alt="icon_time_high-speed" />Immediate Time to ValueWe operationalize your security tools in minutes without complicated deployment, onboarding, or content creation programs. EXPLORE MANAGED DETECTION & RESPONSE <img src="https://redcanary.com/wp-content/uploads/2024/06/InitialAccess_RedCanary_Grey.jpg" alt="InitialAccess_RedCanary_Grey" /> <img src="https://redcanary.com/wp-content/uploads/2024/05/3000x2014_MDR_Laptop_RedCanary.png" alt="3000x2014_MDR_Laptop_RedCanary" />!function(i){"use strict";"function"==typeof define&&define.amd?define(["jquery"],i):