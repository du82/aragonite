["https://redcanary.com/blog/threat-detection/entra-id-service-principals"]
title = "Entra ID service principals in business email compromise schemes"
description = "The service principals in Microsoft's Entra ID can be a boon for business email compromise, but they’re also a key log source for detection."
full_description = '''Adversaries have started to abuse service principals in Microsoft’s Entra ID identity platform. As was openly discussed in CISA’s investigation of the Microsoft key-signing breach and another breach caused by the threat group called Midnight Blizzard, the use of service principals was a key mechanism for reading emails in victim organization mailboxes.After crafting valid tokens with newly obtained stolen signing keys, adversaries were able to read emails from their victims’ mailboxes using an unidentified application. The Microsoft breach was reportedly discovered from a customer’s detection analytic internally dubbed the “Big Yellow Taxi.” While the exact detection logic from “Big Yellow Taxi” is not publicly known at this time, we can glean some of its intent from public descriptions. CISA summarized the breach as follows:“[The detection logic] analyzes data from a log known as MailItemsAccessed, which tracks access to Microsoft Exchange Online mailboxes. State was able to access the MailItemsAccessed log to set up these particular Big Yellow Taxi alerts because it had purchased Microsoft’s government agency-focused G5 license that includes enhanced logging capabilities through a product called Microsoft Purview Audit (Premium)….State Department’s SOC designed custom alerting capabilities based on three years of experience dealing with anomalous access to mailboxes.In particular, State curated log events like the MailItemsAccessed data to enumerate all applications accessing mailboxes within its infrastructure, and to trigger alerts for any anomalous events. It also designed a rule to detect deviations in mailbox activity by comparing baseline interactions of applications with Exchange Online. These rules provided detailed information about application IDs touching mailboxes, specific application details, and context about particular mailboxes involved, thereby enhancing State’s ability to pinpoint potential issues quickly.” MailItemsAccessed is a very high volume record since it tracks users reading mail and accessing specific folders in the mailbox they own or have access to. As this is what users do in their mailboxes everyday, it only makes sense that this is such a high-volume record type from the “Premium” Unified Audit Log. Microsoft has since decided to release Premium logs for all customers, which we applaud because these logs are an invaluable resource for investigation and detection.We’ve discussed a few of the intricacies of the MailItemsAccessed log in a previous blog post, but we recently discovered a few new and interesting tidbits from this log and how it ties back to service principals. <img class="image" src="https://redcanary.com/wp-content/uploads/2024/05/EIDP_975x975.jpg" alt="EIDP_975x975" />Turn on high-powered security operations fueled by Microsoft data Learn moreQuick primer on applications and service principalsService principals can serve multiple purposes. Too many to exhaustively cover in this post, so instead we’ll briefly cover some of the overarching concepts that are crucial to understand during your hunting engagements.According to Microsoft’s documentation:“A service principal is the local representation, or application instance, of a global application object in a specific tenant. An application object is used as a template to create a service principal object in every tenant where the application is used. The service principal object defines what the app can actually do in a specific tenant, who can access the app, and what resources the app can access.”Therefore, application objects may or may not have been created in the tenant in which a corresponding service principal was created. In the case of service principals and application objects living in different tenants, these are typically referred to as “multi-tenant,” as opposed to “single-tenant” ones that live in the same tenant. An application has a lot of specific, customizable properties that define how it behaves. Specifically, we’ll focus on permissions and high-level attributes that can help uniquely identify the application.If the application object lives in a separate tenant (known as the “home tenant,” or “application’s owner organization ID”), then the object will be retrieved from that home tenant for the instantiation. This blueprint lives in what is called a “manifest file,” which is a JSON configuration file defining all of the properties of the application object.When the original application object is created in its home tenant, a GUID is automatically created. This GUID value is unique across all Entra ID tenants, and is referred to by many different names—especially in the logs. Here are just a few of the different ways to refer to an application’s GUID:Client IDClient Application IDApp IDApplication ID Applications can configure two types of permissions, which service principals then inherit during their creation. These types are delegated permissions (commonly referred to as “scopes”) and application permissions (known as “app roles”). At a high level, delegated permissions allow a service principal to take action against a single identity. It’s important to note that delegated permissions cannot supersede an identity’s current privilege level, which prevents privilege escalation. However, by design, application permissions pose more risk since they typically allow for actions to be taken against all users of a tenant.A delegated permission is one that is exposed by a resource. For example, a common resource would be Microsoft Graph. Resources only can understand the specific scopes that they expose. For example, Microsoft Graph exposes a delegated permission called Mail.Read that allows applications to read a specific user’s mail on that user’s behalf. Alternatively, it also exposes an application permission called Mail.Read, which permits an application to read all users’ mail.Each of these permissions are defined by an underlying GUID. For example, the Mail.Read scope has the unique value of 570282fd-fa5c-430d-a7fd-fc8dc98a9dca. The Mail.Read app role has a unique value of 810c84a8-4a9e-49e6-bf7d-12d183f40d01.MailItemsAccessed recordsThe format of a MailItemsAccessed record can vary depending on the scenario. There are two slightly different logs with corresponding formats for bind and sync events. The big difference between the two is that bind events typically record individual mail items being accessed, whereas sync events are more generalized in their content and make the assumption that all records of an entire folder are accessed and are generally indicative of a desktop application being used.Although Microsoft’s documentation states that sync events are indicative of a desktop application, we’ve personally seen instances where the macOS version of Microsoft Outlook only performed bind operations–contradicting that statement. We recommend you familiarize yourself with some of the other nuances between the sync and bind events in Microsoft’s documentation.bind operationThe following log is a sample event in which a service principal accessed mail from Microsoft Graph via application permissions such as Mail.Read. It is worth keeping an eye out for the values of the UserId and the MailboxOwnerUPN fields in this scenario. If another service principal reads mail on your behalf, you’d expect to find evidence of this in the logs, perhaps in the UserId field, but that is not always the case.{ "CreationTime": "2024-01-01T00:00:00", "Id": "XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXX", "Operation": "MailItemsAccessed", "OrganizationId": "XXXXXXXX", "RecordType": 50, "ResultStatus": "Succeeded", "UserKey": "1003111114C7B4B1", "UserType": 0, "Version": 1, "Workload": "Exchange", "UserId": "test@example.com", "AppId": "00000003-0000-0000-c000-000000000000", "ClientAppId": "3aa7b255-50b1-4445-91a9-c25a07779b4d", "ClientIPAddress": "40.126.23.162", "ClientInfoString": "Client=REST;Client=RESTSystem;;", "ExternalAccess": false, "InternalLogonType": 0, "LogonType": 0, "LogonUserSid": "S-1-5-21-XXXXXX", "MailboxGuid": "XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXX", "MailboxOwnerSid": "S-1-5-21-XXXXXXXXX-XXXXXXXXX-XXXXXXXXX-XXXXXXXXX", "MailboxOwnerUPN": "test@example.com", "OperationProperties": [ { "Name": "MailAccessType", "Value": "Bind" }, { "Name": "IsThrottled", "Value": "False" } ], "OrganizationName": "example.com", "OriginatingServer": "DM1P220MB0612 (15.20.4200.000)", "Folders": [ { "FolderItems": [ { "ClientRequestId": "XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX", "Id": "XXXXXXXX", "InternetMessageId": "XXXXXXXXX@example.com>", "SizeInBytes": 229740 }, { "ClientRequestId": "XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX", "Id": "XXXXXXXX", "InternetMessageId": "XXXXXXXXX@example.com>", "SizeInBytes": 126560 } "Id": "LgACT2ijox64k1qaankQWrr+7AQABk+relByrRYnSvu/GVieFAAAAAAEMAAAB", "Path": "\\Inbox" } ] } <link media='all' rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/highlight.js/10.6.0/styles/default.min.css"> hljs.highlightAll();AppIdThe AppId field, in this case specifically, is the resource or API in which our client retrieved mail. In this case, that AppId is 00000003-0000-0000-c000-000000000000, which is the global application object GUID for Microsoft Graph.ClientAppIdThe ClientAppId is the service principal’s application ID—not its local tenant object ID. Generally when we see a ClientAppID, it is from a legitimate first-party Microsoft application.An easy way to collect additional information about an application could be done through the Entra ID portal, or through the Graph API. An example method is using the Microsoft Graph PowerShell SDK as following:Connect-MgGraph -scopes application.read.all Get-MgServicePrincipalByAppId -AppId <CLIENT_APP_ID> <link media='all' rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/highlight.js/10.6.0/styles/default.min.css"> hljs.highlightAll();ClientIPAddressOne of our most interesting discoveries is that the value of the ClientIPAddress field varies depending on other conditions within the log entry.If ClientAppId is present, the ClientIPAddress is always a Microsoft-owned IP address.If ClientAppId is not present, the ClientIPAddress belongs to the user.According to the schema documentation for ClientIP, this is expected activity but there is no mention of this for the ClientIPAddress field. The documentation mentions when “trusted” applications are observed the IP will be from the source of the request. But, even when an unverified or third-party application is reading mail, the IP address will always be from a Microsoft-owned IP space regardless of where the service principal was being called from.As stated in the documentation:“For some services, the value displayed in this property might be the IP address for a trusted application (for example, Office on the web apps) calling into the service on behalf of a user and not the IP address of the device used by person who performed the activity.”sync operationBelow is a sample record of a Windows desktop Outlook application retrieving mail via a sync access type:{"CreationTime":"2024-01-01T00:00:00","Id":"XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXX","Operation":"MailItemsAccessed","OrganizationId":"XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXX","RecordType":2,"ResultStatus":"Succeeded","UserKey":"1003111114C7B4B1","UserType":0,"Version":1,"Workload":"Exchange","ClientIP":"X.X.X.X","UserId":"test@example.com","AppId":"d3590ed6-52b3-4102-aeff-aad2292ab01c","ClientIPAddress":"X.X.X.X","ClientInfoString":"Client=MSExchangeRPC","ClientProcessName":"OUTLOOK.EXE","ClientRequestId":"{XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXX}","ClientVersion":"16.0.425.2024","ExternalAccess":false,"InternalLogonType":0,"LogonType":0,"LogonUserSid":"S-1-5-21-XXXXXXXXX-XXXXXXXXX-XXXXXXXXX-XXXXXXXXX","MailboxGuid":"XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXX","MailboxOwnerSid":"S-1-5-21-XXXXXXXXX-XXXXXXXXX-XXXXXXXXX-XXXXXXXXX","MailboxOwnerUPN":"test@example.com","OperationProperties":[{"Name":"MailAccessType","Value":"Sync"},{"Name":"IsThrottled","Value":"False"}],"OrganizationName":"example.com","OriginatingServer":"DM1PR13MB1111 (15.00.0000.000)","SessionId":"XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXX","Item":{"Id":"LgACT1ijOx61k1qaankQWrr+7AQABk+relByrRYnSvu\/GVieFAAAAEMAAAB","ParentFolder":{"Id":"LgACT1ijOx61k1qaankQWrr+7AQABk+relByrRYnSvu\/GVieFAAAAEMAAAB","Name":"Inbox","Path":"Not Available"}}} <link media='all' rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/highlight.js/10.6.0/styles/default.min.css"> hljs.highlightAll();AppIdIn our data sets, when it exists, AppId is almost always d3590ed6-52b3-4102-aeff-aad2292ab01c, indicating an application of Microsoft Office. However, an AppId is non-existent for sync access types events in the vast majority of our records.ClientAppIdThe ClientAppId is never present, which leads us to believe that sync operations via service principals is not a valid way to read mail, but we have not confirmed this.ClientIP, ClientIPAddressNotice that there are two IP address fields. The ClientIPAddress field was observed previously, but a new one called ClientIP is now present. We have yet to determine why there may be two addresses here as they appear to always be the same.Interesting shared fields between bind and syncRecordTypeMailItemsAccessed records may be identified by two RecordType values to help you easily discern between log types:50 (bind) – Events related to the MailItemsAccessed mailbox auditing action2 (sync) – Events from an Exchange mailbox audit log for actions that are performed on a single item, such as creating or receiving an email messageClientInfoStringInformation about the email client that was used to perform the operation. This field can be useful in determining what API was used to access mail and how it was accessed. In some cases, it may also include the raw user agent from a request when this field includes OWA, WebServices, or OutlookService.An example of someone reading mail via the EWS API, we would see the following in this field:client=webservices;microsoft office/16.0 (windows nt 10.0; microsoft outlook 16.0.17425; pro); <link media='all' rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/highlight.js/10.6.0/styles/default.min.css"> hljs.highlightAll();Based on our data, the possible client values for a MailItemsAccessed record can contain one of the following:RESTRESTSystemOutlookServiceMSExchangeRPCActiveSyncOWAWebServicesPOP3/IMAP4MSExchangeRPCMessageServiceCoreStoreObjectsOperationPropertiesDenotes whether the operation is a sync or bind operation as well as if the log was throttled.MailboxOwnerUPNThe user principal name (UPN) of the owner of the mailbox that was accessed.MailboxGuidThe Entra ID object ID of the user who owns the mailbox.UserKeyAn interesting identifier of a user, which denotes the identity’s passport unique ID (PUID). It’s currently unknown why the UserKey is a PUID value instead of the user’s Entra ID object ID. We are currently unable to fully understand how to resolve a user’s PUID '''
