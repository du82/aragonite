full_description = '''jQuery(function(){ jQuery('.sidebar-menu').css('width', jQuery('.sidebar-menu').outerWidth()); var resizeTimer; jQuery(window).on('resize', function(e) { jQuery('.sidebar-menu').removeClass('stuck'); jQuery('.sidebar-menu').css('width', 'auto'); clearTimeout(resizeTimer); resizeTimer = setTimeout(function() { jQuery('.sidebar-menu').css('width', jQuery('.sidebar-menu').outerWidth()); }, 500); }); jQuery(window).scroll(function(){ if (jQuery('.seoarticle-sections').offset().top - jQuery(window).scrollTop() < 25 && jQuery('.seoarticle-sections').offset().top + jQuery('.seoarticle-sections').outerHeight() - jQuery('.sidebar-menu').outerHeight() - jQuery(window).scrollTop() > 250) { jQuery('.sidebar-menu').addClass('stuck'); } else { jQuery('.sidebar-menu').removeClass('stuck'); } jQuery('.sidebar-menu .item-link').each(function(){ if (jQuery(jQuery(this).attr('href')).offset().top - jQuery(window).scrollTop() < 25) { jQuery('.sidebar-menu .item-link').removeClass('active'); jQuery(this).addClass('active'); var $distance = $(this).offset().top - $('.sidebar-menu').offset().top; console.log($distance); jQuery('.sidebar-menu').animate({ scrollTop: $distance }, 0); } }); }); }); Threat detection and response What is threat detection? How does threat detection work? What is a threat response? What is detection engineering? What does detection engineering look like in practice? Why does threat detection and response matter? Red Canary threat detection and responseThreat detection and responseThe evolving threat landscape continues to burden businesses, requiring them to develop effective threat detection and response capabilities to counteract opportunistic adversaries leveraging commoditized malware to compromise and monetize whatever systems and data they can. The threat landscape is overwhelming, and determining an organization’s threat model within it is a complex exercise. Even when an organization understands the threats that pose a serious risk to them and the ways their IT infrastructure exposes them to those risks, there is still the monumental challenge of figuring out how to mitigate those risks with an ever-evolving array of security controls. Organizations may choose to build their own security infrastructure, an expensive option made more difficult by the well-established cybersecurity skills gap. Organizations may also choose to pay for services and products to help fortify their security, but the information security product landscape is every bit as complex as the threat landscape.As you consider your path forward and what makes the most sense for your organization, we hope to provide you greater insight into the concept of threat detection and how your teams can best design, implement, and maintain your systems to gain an advantage over adversaries. In this article, we’ll define threat detection and response—and provide an illustrative example of what it entails. Additionally, we will explain the importance of detection engineering as a critical component of threat detection and response and explore the MITRE ATT&CK® framework, an invaluable resource quantifying detection coverage and a common language for categorizing threats and the adversary techniques they leverage.What is threat detection?Threat detection is a broad concept that describes an organization’s ability to monitor events in its environment and to identify suspicious activity. It encompasses the tools, people, and procedures involved in uncovering threats. Effective threat detection depends on the maturity of your security operations center (SOC) and the tools at your disposal. Historically, prevention technologies like firewalls and antivirus were primarily responsible for protecting organizations against cyber attacks. However, as the IT landscape changed to support distributed, remote workforces that are more reliant on cloud infrastructure and less constrained by traditional network perimeters, threats changed too. And now, effective security demands advanced tools and processes that defend against the growing diversity of threats that target an ever-expanding attack surface.In response, a number of detection and response tools have emerged, including expansive threat detection and response platforms that can comprise varied detection and response capabilities, such as user and entity behavior analytics (UEBA), threat intelligence, threat hunting, detection engineering, security information and event management (SIEM), incident response, network traffic analysis (NTA), security orchestration, automation, and response (SOAR), and more. Some examples of detection and response platforms include:Endpoint detection and response (EDR)Network detection and response (NDR)Cloud detection and response (CDR)Identity threat detection and responseExtended detection and response (XDR)Managed detection and response (MDR)How does threat detection work?For illustrative purposes, let’s start with an example of a workflow that covers the entire process:<img fetchpriority="high" decoding="async" class="aligncenter wp-image-36817 size-full" src="https://redcanary.com/wp-content/uploads/2024/04/Screenshot-2024-04-11-at-9.27.47 AM.png" alt="threat detection" width="613" height="131" srcset="https://redcanary.com/wp-content/uploads/2024/04/Screenshot-2024-04-11-at-9.27.47 AM.png 613w, https://redcanary.com/wp-content/uploads/2024/04/Screenshot-2024-04-11-at-9.27.47 AM-300x64.png 300w" sizes="(max-width: 613px) 100vw, 613px" />Effective threat detection starts with data. This data originates from various sources like cloud systems, endpoints, network security tools, mobile devices, and countless other kinds of IT equipment. Oftentimes this data is forwarded to some kind of log or alert aggregation tool like a SIEM. At the risk of oversimplification, the data is generally available in two broad forms: raw security telemetry (logs and events) and pre-processed alerts generated by the tools themselves. You can leverage this data in combination to identify suspicious activity.Once collected and stored in a centralized location, this data is then analyzed for signs of suspicious or malicious activity. Automated threat detection tools and human experts often perform this analysis in a collaborative manner. The goal is twofold: identify known malicious activity that represents a clear and definite risk to an organization and uncover suspicious behaviors that deviate from normal user or system behavior and may represent a risk to an organization.When the investigative process identifies a threat, some kind of an alert is generated to inform the affected organization of the threat, and the detection or incident response process kicks off.What is a threat response?Threat response is the set of actions taken to contain, eradicate, and recover from a security incident. It’s often referred to as incident handling or incident response, and it’s the reactive phase that comes after an organization detects a threat.Once a threat is detected, incident responders or handlers investigate all of the relevant context available to them, typically based on priority, confirming that it’s a true positive (an actual threat) and not a false positive (a harmless event mistaken for a threat). If the investigation confirms the veracity of a threat, incident handlers or responders initiate a series of manual or automated actions to contain and remediate the threat and mitigate any potential future damage. This response might involve:isolating affected devices or user accountsblocking connections to IP addresses to limit the flow of malicious trafficblocking hashes associated with malicious tools or malwaredeploying security patches to address vulnerabilities that may have enabled malicious activityremoving malware or other malicious artifacts from affected systemswiping systems when defenders can’t confidently evict a given threatThe final stage is recovery. This includes restoring normal operations and recovering any lost data. Depending on the severity of the incident, recovery may look like restoring from backups, rebuilding systems, or implementing new security protocols to prevent similar incidents in the future.It’s important to note that threat detection and response is a cyclical process, thriving on lessons learned from past incidents for continuous improvement. In the next section, we’ll explore the critical role detection engineering plays in this ongoing process.What is detection engineering?Detection engineering is the practice of developing analytics or alerts that uncover suspicious or malicious activity, as well as the continuous process of tuning, suppressing, and otherwise nurturing a library of detective controls. Threat intelligence is a critical input for detection engineers to identify and prioritize relevant threats and then design, implement, and maintain automated systems for detecting and contextualizing those threats. Threat research is another key input into any detection engineering program that will provide additional context to threat intelligence, identify emerging threats that are looming on the horizon but may require proactive attention, assess blindspots, and ensure detective coverage is thorough and resilient. The primary output of a detection engineering team is detection analytics.So what is a detection analytic? Put simply, detection analytics are sets of rules or logic that continuously analyze data and alerts from tools like detection and response platforms, cloud infrastructure, identity providers, and other IT and security tools, looking for specific patterns of malicious or suspicious behavior. Detection analytics parse telemetry and alerts automatically, saving analysts from manually sifting through an endless stream of raw log data and alerts. In turn, detection engineers are constantly tuning detection analytics and suppressing alerts to help reduce false negatives and false positives, improving the fidelity of detections, and providing the actionable insights security teams need to effectively triage, investigate, remediate, and prevent threats in the future.What does detection engineering look like in practice?What does detection engineering look like in practice?Detecting engineering is cyclical by nature, meaning it’s a continuous process that repeats itself. While the discipline still isn’t well-defined, the cycle usually looks something like this: define detection priorities, assess visibility, collect data, develop detection analytics, monitor events, suppress or tune detection analytics, repeat. This never-ending loop helps ensure detection analytics continue to effectively catch threats, aren’t overly noisy, and expand coverage for unknown or novel threats.Here’s a more in-depth look at this cycle:Define detection prioritiesThreat intelligence and threat modeling are key prerequisites to defining an organization’s detection priorities. Organizations must be able to identify threats that are likely to target them based on their IT hygiene, the IT systems they use, the types of data they store, and the ways they store and access that data. They must strike a balance between threats that are highly prevalent and opportunistic and threats that are less prevalent, more targeted, and more risky. It’s a constant balancing act, weighing low-impact, high-volume threats against high-impact, low-volume threats.. Frameworks like MITRE ATT&CK (we’ll cover this below) can help security teams quantify and track relevant adversary techniques and perform gap analysis.Detection prioritization might involve proactively sitting down with your team and strategically assessing threat intelligence to develop detection hypotheses. Or it might be a reactive response to a recently missed detection. Ultimately, the goal here is to determine clear objectives for your detection engineering efforts based on business needs and risk exposure.The MITRE ATT&CK FrameworkAs previously mentioned, the MITRE ATT&CK framework is a valuable tool that can help you organize and track your detection objectives. But what exactly is MITRE ATT&CK?MITRE describes their framework as “a curated knowledge base and model for cyber adversary behavior, reflecting the various phases of an adversary’s lifecycle and the platforms they are known to target.” ATT&CK is open, community-supported, and comprehensive. Critically, it is provided by MITRE as a resource to the community and is not operated or sponsored by any vendor. Anyone is free to leverage it, and everyone is free to contribute as they discover new tactics and techniques.MITRE ATT&CK categorizes attacker tactics, techniques, and procedures (TTP). It takes what was once a nebulous, ill-defined threat landscape and organizes it into a largely agreed-upon set of TTPs communicated in a common language. By understanding this framework, you can gain a comprehensive understanding of the different ways adversaries might infiltrate, establish persistence, escalate privileges, steal data, and disrupt operations. Even so, not all ATT&CK techniques warrant detecting, so understanding your threat model in the context of ATT&CK is crucial for defining what kind of threats and techniques you ought to be most concerned about.Data collectionYour ability to detect threats relies heavily on the data that gives you visibility into the systems where threats manifest. And if you don’t have that data, then you’re not going to be able to detect threats. So once you’ve defined your detection objectives, you also have to assess your visibility via the logs and data sources available to you. Is there a log or data source missing but necessary for your use case? How can you collect that log or data source?The bigger variety of sources you have, the more ground your detectors can cover and the more threats you can detect. However, having more data isn’t always better. Organizations should strive to only collect data that is strategically useful and helps them accomplish their detection priorities.Detection analytic developmentNow that you’ve defined your objectives and you’re collecting the necessary logs and data, you can move forward with writing detection analytics. These can vary in breadth or depth. For example, they can be based on specific indicators of compromise (IOC) or on behavioral patterns. It’s important, however, to find a balance between overly broad detection analytics that generate tons of noise and overly precise analytics that are too specific. As we explained on the Red Canary blog, “a great detection engineering team works every day on objectives that are at odds with one another. First, don’t miss things. Build detection coverage that has both breadth and depth, looking for as many adversary techniques as you can, and looking for each in ways that are increasingly thorough and resistant to evasion. At the same time, don’t inundate the investigative team with low quality investigative leads, false positives, or a lead that lacks contex'''
