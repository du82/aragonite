description = "Red Canary puts your mental, physical, and financial health first. Because you deserve to love your job as much as the life you create outside of it."
full_description = '''careers at red canarySecure a better futureCome be a force for good. Together, we’ll create a world where every organization makes their greatest impact without being disrupted by a cyber attack. View open roles <h6>Not seeing the form?</h6><p>Email <a href="mailto:marketing@redcanary.com"><strong>marketing@redcanary.com</strong></a> and we’ll help you get registered. Or you can always <a href="/contact-us/"><strong>contact us</strong></a>.</p> About Us Culture Benefits More ResourcesA best place to workRed Canary monitors an enterprise’s environment to detect and respond to cybersecurity threats so they can focus on their mission. Our Managed Detection and Response (MDR) solution is a unique blend of human expertise and security, which protects organizations from modern adversaries as their teams work remotely, move to the cloud, and they adopt new cybersecurity and IT technologies.<img fetchpriority="high" decoding="async" class="alignnone size-full wp-image-31467" src="https://redcanary.com/wp-content/uploads/2022/05/328bcae4773e9ace7cf058e6798caaa1.jpg" alt="Deloitte Technology Fast 500 2021 North America" width="600" height="600" srcset="https://redcanary.com/wp-content/uploads/2022/05/328bcae4773e9ace7cf058e6798caaa1.jpg 500w, https://redcanary.com/wp-content/uploads/2022/05/328bcae4773e9ace7cf058e6798caaa1-300x300.jpg 300w, https://redcanary.com/wp-content/uploads/2022/05/328bcae4773e9ace7cf058e6798caaa1-150x150.jpg 150w" sizes="(max-width: 600px) 100vw, 600px" /><img decoding="async" class="alignnone size-full wp-image-32438" src="https://redcanary.com/wp-content/uploads/2025/01/2025BPTW_WinnerSocialPost-1080x1080-1.jpg" alt="Builtin 2025 Best Places to Work in Colorado" width="500" height="500" /><img decoding="async" class="alignnone size-full wp-image-32439" src="https://redcanary.com/wp-content/uploads/2022/09/Forbes2022_500x500b.jpg" alt="Forbes 2022 America's Best Startup Employers" width="500" height="500" srcset="https://redcanary.com/wp-content/uploads/2022/09/Forbes2022_500x500b.jpg 500w, https://redcanary.com/wp-content/uploads/2022/09/Forbes2022_500x500b-300x300.jpg 300w, https://redcanary.com/wp-content/uploads/2022/09/Forbes2022_500x500b-150x150.jpg 150w" sizes="(max-width: 500px) 100vw, 500px" /><img decoding="async" class="alignnone size-full wp-image-32363" src="https://redcanary.com/wp-content/uploads/2022/09/MSFT_award_500x500.jpg" alt="Microsoft Trailblazer Award 2022" width="500" height="500" srcset="https://redcanary.com/wp-content/uploads/2022/09/MSFT_award_500x500.jpg 500w, https://redcanary.com/wp-content/uploads/2022/09/MSFT_award_500x500-300x300.jpg 300w, https://redcanary.com/wp-content/uploads/2022/09/MSFT_award_500x500-150x150.jpg 150w" sizes="(max-width: 500px) 100vw, 500px" />Who we are & what we doRed Canary monitors an enterprise’s environment to detect and respond to cyber security threats so they can focus on their mission. Our Managed Detection and Response (MDR) solution is a unique blend of human expertise and security, which protects organizations from modern adversaries as their teams work remotely, move to the cloud, or they adopt new cybersecurity and IT technologies. How to describe Red Canary to your friends and familyRed Canary protects businesses from cyber attacks. We do it by offering a solution called Managed Detection and Response, or MDR. Our solution combines security software with human expertise to stop threats faster and more reliably, so organizations can keep running without any distractions.<img decoding="async" class="alignnone size-full wp-image-32441" src="https://redcanary.com/wp-content/uploads/2022/09/collage5.jpg" alt="Red Canary employees" width="1920" height="1080" srcset="https://redcanary.com/wp-content/uploads/2022/09/collage5.jpg 1920w, https://redcanary.com/wp-content/uploads/2022/09/collage5-300x169.jpg 300w, https://redcanary.com/wp-content/uploads/2022/09/collage5-1024x576.jpg 1024w, https://redcanary.com/wp-content/uploads/2022/09/collage5-768x432.jpg 768w, https://redcanary.com/wp-content/uploads/2022/09/collage5-1536x864.jpg 1536w" sizes="(max-width: 1920px) 100vw, 1920px" />red canary culture We take security seriously - but not ourselvesTaking a fresh approach to anti-phishing education drives the message home in a memorable way <img src="https://fast.wistia.com/embed/medias/uxb7cmfvhu/swatch" style="filter:blur(5px);height:100%;object-fit:contain;width:100%;" alt="" aria-hidden="true" onload="this.parentNode.style.opacity=1;" /> We go to extraordinary lengths for team buildingA co-founder in a bird costume around Denver provides important clues to a company team scavenger hunt <img src="https://fast.wistia.com/embed/medias/s8detkhg6m/swatch" style="filter:blur(5px);height:100%;object-fit:contain;width:100%;" alt="" aria-hidden="true" onload="this.parentNode.style.opacity=1;" />Red Canary Culture<img decoding="async" style="filter: blur(5px); height: 100%; object-fit: contain; width: 100%;" src="https://fast.wistia.com/embed/medias/6882ux2uex/swatch" alt="" aria-hidden="true" />Our core values We are relentlessOur adversary is very human and relentless in their crimes. We are equally relentless in finding and stopping those adversaries. Security teams we partner with have to be ready 24×7, and we are always there alongside them.Every time we ship code, respond to a support request, or coach our partners, we always push to go a little faster. We always deliver qualityThe cybersecurity industry is littered with products that were once well loved, but lost their quality as the company grew. We obsess over not being one of them.Our guiding principle is that we’ll try to grow as quickly as possible—while maintaining quality. We are kind and authenticBeing kind is often a novelty in security and technology business. We’re changing that. We embrace our authenticity and show kindness to other Canaries, competitors, and the community. We do what’s right for our customersOur hypergrowth forces us to make hundreds of important decisions each day. We never stop thinking about what’s best for our customers. That always guides us to the right choices—even if those choices are more challenging.Benefits <img src="https://redcanary.com/wp-content/uploads/2019/02/icon_verticals-healthcare.svg" alt="">100% paid premiumsRed Canary offers a 100% paid plan option for medical, dental and vision for you and your dependents. No waiting period. <img src="https://redcanary.com/wp-content/uploads/2022/09/icon_parent.svg" alt="">Fertility benefitsAll new hires are eligible for benefits as of their first day. <img src="https://redcanary.com/wp-content/uploads/2019/02/icon_verticals-transportation.svg" alt="">Flexible time offTake the time you need to recharge including vacation, sick, bereavement, jury duty, and holidays. <img src="https://redcanary.com/wp-content/uploads/2019/02/icon_verticals-banking-finance.svg" alt="">Pre-tax plansRed Canary offers a variety of plans to fit you and your dependent specific needs including FSA, HRA and HSA, with employer funding to offset out of pocket health care expenses. <img src="https://redcanary.com/wp-content/uploads/2019/02/icon_laptop.svg" alt="">Flexible work environmentWith 60% remote workforce, Canaries can work virtually from almost anywhere in the US. <img src="https://redcanary.com/wp-content/uploads/2022/09/icon_parent.svg" alt="">Paid parental leaveFull base pay to bond/care for your new child.view open roles Blog posts How to unlock the power of your people and your culture Articles| Life at Red Canary How to unlock the power of your people and your culture What software engineers should know before joining Red Canary Articles| Life at Red Canary What software engineers should know before joining Red Canary !function(i){"use strict";"function"==typeof define&&define.amd?define(["jquery"],i):"undefined"!=typeof exports?module.exports=i(require("jquery")):i(jQuery)}(function(i){"use strict";var e=window.Slick||{};(e=f