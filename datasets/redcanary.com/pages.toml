["https://redcanary.com/resources/case-studies/ansys-microsoft-defender-e5"]
title = "Red Canary MDR + Microsoft Defender Case Study: Ansys"
description = "Learn how adding Red Canary MDR enabled Ansys to operationalize their Microsoft Defender E5 investment and extend security coverage 24x7."
full_description = '''Business snapshot Ansys is a leader in engineering simulation that helps the world’s most innovative companies deliver radically better products to their customers. If you’ve ever seen a rocket launch, flown on an airplane, driven a car, used a computer, or put on wearable technology, chances are you’ve used a product where Ansys software played a critical role in its creation.the missionAdd 24×7 security coverage that delivers value from the Microsoft Defender suite.Ansys has an experienced, high-performing security team. They sought to maintain eyes-on-glass security coverage after business hours that met their high standards.They also wanted to supercharge the value they received from Microsoft’s security tools. Ansys is a Microsoft E5 license holder that uses Microsoft Defender for Endpoint, Microsoft Defender for Cloud Apps, Office 365, and other Microsoft tools that come with their E5 license. They wanted to derive even more security value from those investments.challengesScaling Ansys’ quality of defense to 24×7 coverage posed a few problems to Dave Coughanour, their VP of Cybersecurity. First, the cost of adding enough team members to deliver 24×7 coverage was prohibitively expensive. And second, even if Ansys did decide to staff its SOC 24×7, a markedly bigger team would just amplify the existing challenges he faced of finding and retaining staff with the necessary expertise.Ansys needed a partner it could trust to deliver quality detection and response across the breadth of its Microsoft tools and environment.solutionRed Canary impressed Ansys with its deep and comprehensive integration with the Microsoft Defender suite. Red Canary’s platform processes telemetry and alerts from Ansys’ Microsoft security tools, and its detection engineers investigate that data thoroughly. Red Canary’s ability to distill signal from noise across the Microsoft Defender tools helps streamline Ansys’ existing security operations program by reducing alert fatigue and allowing the team to focus on what really matters: “One of the ways that Red Canary helps is that it cuts down on alert fatigue. Red Canary acts as a filter for us: they bubble up the most pressing things to the top, and it’s very easy to collaborate with them within their portal. We get the most pressing alerts passed to our response team, and they get actioned first.”Dave CoughanourVP of Cybersecurity at Ansys <img src="https://redcanary.com/wp-content/uploads/2022/09/ansys_quote_1758x1434.jpg" alt="ansys_quote_1758x1434" />Red Canary’s focus on fast response stood out to Ansys. Dave knew that when attacks occur it is imperative to respond quickly and precisely. The extensive experience of Red Canary’s Threat Hunting Team, combined with the Red Canary platform’s automated response capabilities, gave Ansys confidence.“With such a small window of response time, you need to have not just good detection but automated responses that you build very easily with Red Canary’s playbooks.”And lastly, Dave appreciated Red Canary’s ability to translate learnings from one customer’s environment into protection for all of its customers. When Red Canary encounters a new threat, it rapidly builds detectors and applies them across all customer environments. Combine that with Microsoft’s visibility across its hundreds of thousands of customers, and Ansys knew it would benefit from Red Canary and Microsoft’s joint partnership.“We have the advantage of a global community with Red Canary and Microsoft. Our partnership gives us maximum visibility into cyber threat trends and remediations.”A Partnership Built On TrustRed Canary met Ansys’ criteria for a 24×7 security partner that could deliver value from their Microsoft security tools. But at the end of the day, the decision to partner with Red Canary came down to trust. Dave knew that his team would be working very closely with whichever MDR partner they chose, so just strong resumes and quality technology wouldn’t cut it. His team’s partner needed to be collegial, respectful, and perform at the highest level in the most stressful situations. Red Canary met the mark. “Cybersecurity is all about trust. You need to trust the people that are handling your most sensitive data; you need to trust their work ethic, their professionalism, and their ability to execute, typically in a time of crisis. We’ve worked with many of the members of the Red Canary team for years now, and we know that when it’s “go time”, they’re not going to panic. They’re going to execute in a very disciplined manner. That’s what you need on a response team.”Dave CoughanourVP of Cybersecurity at Ansys <img src="https://redcanary.com/wp-content/uploads/2022/09/ansys_quote_1050x896.jpg" alt="ansys_quote_1050x896" /> DownloadAccess the full case study pdf to save, print and share. @media (max-width: 767px) { #id-e8eece0e6ba93c58a7eb38474db6f7c7 { } }For more than 50 years, Ansys engineering simulation software has enabled innovators across industries to push boundaries using the predictive power of simulation.Ansys’ security team is experienced and talented, but they wanted a similarly skilled partner to extend their security coverage to 24×7—specifically, a partner that had expertise with Microsoft’s Security Product Portfolio.Download the case study to learn:Why Ansys trusts Red CanaryHow Ansys leverages Red Canary’s automated response playbooksHow Red Canary and Microsoft provide comprehensive threat visibility to Ansys <h6>Not seeing the form?</h6><p>Email <a href="mailto:marketing@redcanary.com"><strong>marketing@redcanary.com</strong></a> and we’ll help you get registered. Or you can always <a href="/contact-us/"><strong>contact us</strong></a>.</p> jQuery(function($){setTimeout(function(){$('input[name="Last_Campaign_Interaction__c"]').val('');},1200);}); <img fetchpriority="high" decoding="async" class="alignnone size-full wp-image-32419" src="https://redcanary.com/wp-content/uploads/2022/09/Ansys_CS-thumb_600x685.png" alt="Preview of the Ansys case study" width="600" height="685" srcset="https://redcanary.com/wp-content/uploads/2022/09/Ansys_CS-thumb_600x685.png 600w, https://redcanary.com/wp-content/uploads/2022/09/Ansys_CS-thumb_600x685-263x300.png 263w" sizes="(max-width: 600px) 100vw, 600px" /> Red Canary is a Microsoft Security TrailblazerMicrosoft’s security leaders and top partners recognized Red Canary for being an “outstanding leader in accelerating customers’ efforts to mitigate cybersecurity threats. ”The award reflects the depth of integration we have with Microsoft Security tools, and the quality of outcomes we provide to Microsoft E5 customers.Our growing list of integrations include: Microsoft Defender for Endpoint, Defender for Identity, Defender for Office 365, and Azure AD Identity Protection, and more. Learn more about this award'''
