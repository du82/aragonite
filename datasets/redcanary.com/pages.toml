full_description = '''Resources • WebinarsDefending the cloud: How to overcome security challengesEnhance your understanding of cloud security and learn how Red Canary can empower your organization to proactively address and mitigate potential risks within your cloud.On-Demand45 mins.VirtualMktoForms2.loadForm("//resource.redcanary.com", "003-YRU-314", 1393);Enhance your understanding of cloud security and learn how Red Canary can empower your organization to proactively address and mitigate potential risks within your cloud. While deploying in cloud infrastructures provides a host of benefits allowing organizations to innovate faster and add more efficiency to their development processes, it also introduces new challenges when addressing cybersecurity threats. In this webinar, we delve into the crucial aspects of cloud security, using the NIST Cybersecurity Framework as a foundation for our discussion.Highlighting the four key pillars – Identify, Protect, Detect, and Respond – outlined by the framework, we explore how organizations like yours must factor them in when looking to build a robust security operations platform. We highlight the importance of each pillar in addressing cloud security threats and how Red Canary aligns seamlessly with this framework, assisting you in achieving your cloud security goals.We also illustrate the importance of each pillar in addressing cloud security threats and how Red Canary aligns seamlessly with this framework, assisting you in achieving your cloud security goals.By attending, you will gain valuable insights into our threat intelligence capabilities and witness a live demonstration showcasing the effectiveness of our cloud threat detection solutions.MEET THE SPEAKERS Kevin GeeSenior Product Marketing Manager Kevin started his career working in the IT department of an accounting firm as a jack-of-all-trades system administrator. His next move was working for a CASB as a Technical Marketing Engineer. There he focused on administrative guide documentation, RFP management, and training/enablement for customers, partners, and internal. At Red Canary, Kevin leads product launches from a go-to-market perspective, helping to create content for both customers and internal enablement around the product as well as working closely with the Channel Partnership team. Kevin also focuses on product demos and associated video content.Kevin started his career working in the IT department of an accounting firm as a jack-of-all-trades system administrator. His next move was working for a CASB as a Technical Marketing Engineer. There he focused on administrative guide documentation, RFP management, and training/enablement for customers, partners, and internal. At Red Canary, Kevin leads product launches from a go-to-market perspective, helping to create content for both customers and internal enablement around the product as well as working closely with the Channel Partnership team. Kevin also focuses on product demos and associated video content. Ryan ShedrickSenior Sales Engineer Ryan is a Senior Sales Engineer at Red Canary living in the Space Coast area of Florida. He has worked in cyber security for over five and a half years and currently helps design security solutions for enterprises in the southeast encompassing all industries and skill sets. Prior to Red Canary, Ryan began his cyber security career with IBM Security where he served as the XDR Alignment Leader responsible for identifying customers' cybersecurity needs and ideal solution state.Ryan is a Senior Sales Engineer at Red Canary living in the Space Coast area of Florida. He has worked in cyber security for over five and a half years and currently helps design security solutions for enterprises in the southeast encompassing all industries and skill sets. Prior to Red Canary, Ryan began his cyber security career with IBM Security where he served as the XDR Alignment Leader responsible for identifying customers' cybersecurity needs and ideal 