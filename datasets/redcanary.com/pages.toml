["https://redcanary.com/blog/threat-detection/cloud-threat-detection"]
title = "Shrinking the haystack: The six phases of cloud threat detection"
description = "Red Canary parses through 6 billion telemetry records per day to detect threats in our customers’ cloud environments. Here’s how we do it."
full_description = 'Everyone in the industry is talking about how to secure the cloud. But what exactly are we securing the cloud against? When Red Canary talks about “threats in your cloud environment,” we’re talking specifically about threats that manifest within the cloud control plane itself, such as unauthorized Kubernetes pod access, credential use from unauthorized locations, API abuse, data exfiltration, and more.I recently presented on how Red Canary detects cloud threats in our customers’ environments at both CloudNativeSecurityCon and the SANS CloudSecNext Summit & Training, and I’d like to walk through our detection process in a two-part blog series. This is not to say this is necessarily the “right” way to find these threats, or even the only way to find them; it’s just the battle-hardened techniques that we have been using for years to chase down this kind of activity and find the needle buried in the haystack of petabytes of data.What is the cloud control plane?Before we get ahead of ourselves, let’s talk through what we mean when we say “cloud control plane.”<img loading="lazy" decoding="async" class="alignnone wp-image-38556 size-full" src="https://redcanary.com/wp-content/uploads/2025/01/SH-01.png" alt="Visualization of the cloud control plane vs. the cloud data plane" width="1800" height="1000" srcset="https://redcanary.com/wp-content/uploads/2025/01/SH-01.png 1800w, https://redcanary.com/wp-content/uploads/2025/01/SH-01-300x167.png 300w, https://redcanary.com/wp-content/uploads/2025/01/SH-01-1024x569.png 1024w, https://redcanary.com/wp-content/uploads/2025/01/SH-01-768x427.png 768w, https://redcanary.com/wp-content/uploads/2025/01/SH-01-1536x853.png 1536w" sizes="auto, (max-width: 1800px) 100vw, 1800px" /> Every cloud provider uses a different vocabulary, so let’s establish the terminology we’re going to use throughout this article.First, let’s start with the “stuff” you have deployed in your cloud. Maybe that’s some virtual machines, a few databases, storage buckets, serverless functions, and probably a handful of other cats and dogs (that hopefully you know about). All of these resources that are deployed within the cloud reside in what we’re calling the cloud data plane. We’re not going to focus on what’s inside this data plane in this article; in some cases (such as virtual machines), there are other technologies like endpoint detection and response (EDR) that directly apply to protecting these resources.Instead, we’re going to focus on the cloud control plane: this is the layer on top of all of your cloud resources that keeps track of all of the things in your data plane and allows users to create, destroy, or configure these resources within the data plane. This might be the cloud web user interface (UI), command-line interface (CLI), or application program interface (API) access.Every cloud provider’s cloud control plane is outputting a pile of audit logs, such as AWS CloudTrail, Azure Monitor Logs, GCP Audit Logs—logs that we’ll refer to as telemetry throughout this article. This telemetry captures the creation of every resource, every resource that’s been stopped, every change to a security group or firewall, every API call made to access a serverless resource, and hundreds (if not thousands) of additional records tracking everything that’s happening to your cloud resources, as visualized in this hyper-accurate illustration:<img loading="lazy" decoding="async" class="alignnone size-full wp-image-38557" src="https://redcanary.com/wp-content/uploads/2025/01/SH-02.png" alt="Obtaining telemetry from the cloud control plane" width="2100" height="800" srcset="https://redcanary.com/wp-content/uploads/2025/01/SH-02.png 2048w, https://redcanary.com/wp-content/uploads/2025/01/SH-02-300x114.png 300w, https://redcanary.com/wp-content/uploads/2025/01/SH-02-1024x390.png 1024w, https://redcanary.com/wp-content/uploads/2025/01/SH-02-768x293.png 768w, https://redcanary.com/wp-content/uploads/2025/01/SH-02-1536x585.png 1536w" sizes="auto, (max-width: 2100px) 100vw, 2100px" />If you’re not interested in cloud, but you’d rather look at Kubernetes logs, the same concept exists: the Kubernetes control plane outputs the same type of telemetry with the creation and termination of pods, access to pod resources, etc. The following approach applies just as well to Kubernetes telemetry as it does to cloud telemetry.At the end of the day, all of this telemetry creates a massive pile of data. How do you wade through that pile to find a single threat? As of this writing, Red Canary ingests about 6 billion cloud telemetry records per day—if we can do it, so can you!The six phases of cloud threat detectionTo tackle any problem, it’s best to break it down into smaller pieces. These smaller pieces make the problem much easier for a human to wrap their head around, and, ultimately, enables solutions that are simpler to manage.We’ve broken this problem down into six distinct phases. We’ll dive into each in detail below:IngestStandardizeCombineDetectSuppressRespond<img loading="lazy" decoding="async" class="alignnone wp-image-38558 size-full" src="https://redcanary.com/wp-content/uploads/2025/01/SH-03-e1735936224325.png" alt="The six phases of cloud threat detection: ingest, standardize, combine, detect, suppress, respond" width="2037" height="829" srcset="https://redcanary.com/wp-content/uploads/2025/01/SH-03-e1735936224325.png 2037w, https://redcanary.com/wp-content/uploads/2025/01/SH-03-e1735936224325-300x122.png 300w, https://redcanary.com/wp-content/uploads/2025/01/SH-03-e1735936224325-1024x417.png 1024w, https://redcanary.com/wp-content/uploads/2025/01/SH-03-e1735936224325-768x313.png 768w, https://redcanary.com/wp-content/uploads/2025/01/SH-03-e1735936224325-1536x625.png 1536w" sizes="auto, (max-width: 2037px) 100vw, 2037px" />From a technical implementation standpoint, we take these individual phases and develop individual software components to handle each one. This approach follows a general Unix philosophy, as quoted by Doug McIlroy, the inventor of Unix pipes:Write programs that do one thing and do it wellWrite programs that work togetherWrite programs to handle text streams, because that is a universal interface For each of these conceptual blocks of work, we create small and simple (but highly scalable) components that can be chained together to sort through the haystack. Each of these components is also an independent Kubernetes deployment (more on that topic a little later on).Phase one: IngestThe first phase to talk about here is getting data into your processing system: Ingest.Since we’re just starting to think about these phases, it’s easy to overcomplicate things here. Don’t. Remember the guiding Unix principles listed above.Ingest’s job is simply to move the data to where you want it to go next. That’s it.Now, there’s already some complexity embedded in that task. Depending on where the data (telemetry) is, moving it out of one cloud environment may be tricky and may even have cost implications. Also, remember to focus on “the data you want”; this is a good place to filter out any extraneous data that doesn’t provide much value to you (because the farther you push this data into your system, the more it will cost you to process it. Turning it away at the front gates is usually the most cost-effective option).First, you have to get the data:<img loading="lazy" decoding="async" class="alignnone wp-image-38559 size-full" src="https://redcanary.com/wp-content/uploads/2025/01/SH-05.png" alt="Ingesting data from the cloud control plane " width="2100" height="800" srcset="https://redcanary.com/wp-content/uploads/2025/01/SH-05.png 2048w, https://redcanary.com/wp-content/uploads/2025/01/SH-05-300x114.png 300w, https://redcanary.com/wp-content/uploads/2025/01/SH-05-1024x390.png 1024w, https://redcanary.com/wp-content/uploads/2025/01/SH-05-768x293.png 768w, https://redcanary.com/wp-content/uploads/2025/01/SH-05-1536x585.png 1536w" sizes="auto, (max-width: 2100px) 100vw, 2100px" />For us, an ingestor is typically just a file copier that grabs a file from the source, like an S3 bucket with a CloudTrail log file in it, and copies it to a place that we want it, like our ingest S3 bucket. If we have to, we’ll actually open up the file to discard telemetry records we’re not interested in, and our output file will have a filename with key metadata that follows a common internal convention (which makes moving the file around easier if no one has to actually open it to get basic metadata about the file).Red Canary has shared insights about some of these data transfer challenges in the past, and you can read this fantastic article by my colleague James Mason on the subject.Before we move on to the next phase, let’s revisit the concept of filtering out data. It’s tempting to say “all of this data is absolutely critical for me to detect threats in my environment.” I guarantee that’s not true. Cloud telemetry can be extremely voluminous and repetitive. Attempting to process all of it gets extremely expensive very quickly for certain telemetry-heavy operations.Cloud telemetry can be extremely voluminous and repetitive.As an example, when you query a large data lake (which is usually a collection of files sitting in cloud object storage like Azure Blob Storage), the cloud control plane captures log records of every file that the query engine (such as Amazon Athena) touches—which could be millions of files depending on the size and configuration of your data lake. If there are lots of data lake queries, each query will generate this volume of logs—none of which are pointing to a potential threat. Identifying these high-noise data sources is critical to keeping processing costs under control.Phase 2: StandardizeOnce the data is in your system, the next step is to normalize the data into a common format, a term we’ll call standardizing.But why? If you’re only ingesting data from one data source, can’t you just use their native format and call it a day? The answer is, “yes, you absolutely can,” however it won’t be long before you (or, more likely, your boss) wants to add another source of data.Let’s say, for example, that you start by ingesting AWS CloudTrail telemetry. But then your boss wants to start looking at your Azure Monitor Log telemetry as well. Or perhaps you’d like to combine in your organization’s Okta logs. These are all things that inevitably come as your capability to detect threats matures—but the catch is that if you don’t start with a standardized format, you’ll encounter a massive headache downstream every time you add a new data source (as opposed to a minor headache in one place, during the standardization phase).As an example, let’s look at a common and critical field you’d expect in telemetry: IP address.In the AWS CloudTrail telemetry format, this field is called sourceIPAddressIn Azure Monitor telemetry, it’s called IPAddressGCP Cloud Audit Logs call it callerIpOkta calls it ipAddressIn Kubernetes Audit Logs, it’s called sourceIPs And that’s just one field! When you start to include other fields (time stamps, location, event, etc.) the complexity skyrockets.If you carry this logic downstream (we haven’t really talked about this part yet) and think about how you’d detect bad behavior based on a known malicious IP address, you’d end up having to write a detection rule for IP addresses resembling something like:<img loading="lazy" decoding="async" class="alignnone size-full wp-image-38587" src="https://redcanary.com/wp-content/uploads/2025/01/image-2.png" alt="Building detectors from non-homogenous data field names" width="604" height="587" srcset="https://redcanary.com/wp-content/uploads/2025/01/image-2.png 604w, https://redcanary.com/wp-content/uploads/2025/01/image-2-300x292.png 300w" sizes="auto, (max-width: 604px) 100vw, 604px" />As an added downside, this trivial detector logic (and any others that included the IP address field) would need to be updated every time a new telemetry format was added to your pipeline.So what should you standardize to? <img loading="lazy" decoding="async" class="size-full wp-image-38561 aligncenter" src="https://redcanary.com/wp-content/uploads/2025/01/image6.png" alt="Comic about how standards proliferate " width="500" height="283" srcset="https://redcanary.com/wp-content/uploads/2025/01/image6.png 500w, https://redcanary.com/wp-content/uploads/2025/01/image6-300x170.png 300w" sizes="auto, (max-width: 500px) 100vw, 500px" /> Everyone wants to build a new standard (xkcd.com/927) Red Canary has an internal format that we call the “standardized activity model.” You too can develop your own standard but it always makes sense to survey the landscape and see if an established standard will meet your needs more easily. A current example is the Open Cybersecurity Schema Framework (OCSF), which seems to be gaining some momentum, and it’s just as good as any at this point.So, for the sake of example, let’s say you pick OCSF, then the IP address field simply becomes: src_ip. But—and here’s the real power—the detector logic we talked about before becomes: if record[‘src_ip’] = 192.0.2.1 <img loading="lazy" decoding="async" class="alignnone size-full wp-image-38588" src="https://redcanary.com/wp-content/uploads/2025/01/image-3.png" alt="Simplified detection logic after standardizing field names" width="1345" height="573" srcset="https://redcanary.com/wp-content/uploads/2025/01/image-3.png 1345w, https://redcanary.com/wp-content/uploads/2025/01/image-3-300x128.png 300w, https://redcanary.com/wp-content/uploads/2025/01/image-3-1024x436.png 1024w, https://redcanary.com/wp-content/uploads/2025/01/image-3-768x327.png 768w" sizes="auto, (max-width: 1345px) 100vw, 1345px" /> This vastly simplifies all of the downstream logic as there is only a single value to keep track of, not a different value for each telemetry-stream type.Phase 3: CombineAfter standardizing the data, the next phase in the processing pipeline is “Combine.”So far, we have disparate pieces of information flowing in, likely in an asynchronous fashion and not grouped with other related pieces of data; it’s just raw events streaming through the Ingest and Standardize steps. Every part of the pipeline so far has been completely stateless (which is the key to scalability): the component simply works on the piece of data that’s presented to it and moves on.Unfortunately, detecting malicious behavior isn’t about finding a single event; it’s about detecting a behavior trend over time that’s an indication of malicious activity. As a simple example, half the time I attempt to access the AWS CLI, I forget to auth and receive an auth error returned by the software development kit (that would absolutely generate an audit log entry). Or my web console session times out and so my command is rejected. Or I connect to the wrong Kubernetes cluster to act on a specific resource. All of these behaviors are completely normal and not an indication of malicious act'
