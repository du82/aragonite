["https://redcanary.com/company/origin-story"]
title = "The Red Canary Origin Story"
description = "Discover how Red Canary supports customers across diverse sectors, from tech giants to healthcare and small businesses, as their trusted security ally."
full_description = '''@media (max-width: 767px) { #id-b672d10e14b1c68e21e6672e475f6d96 { } }<img fetchpriority="high" decoding="async" class="alignnone size-full wp-image-29314" src="https://redcanary.com/wp-content/uploads/2021/12/RC_Founders.png" alt="Brian Beyer, Keith McCammon, and Chris Rothe" width="2048" height="1366" /><img decoding="async" class="alignnone size-full wp-image-29876" src="https://redcanary.com/wp-content/uploads/2022/01/Red-Canary-MSFT-Partners.jpeg" alt="" width="1200" height="758" srcset="https://redcanary.com/wp-content/uploads/2022/01/Red-Canary-MSFT-Partners.jpeg 1200w, https://redcanary.com/wp-content/uploads/2022/01/Red-Canary-MSFT-Partners-300x190.jpeg 300w, https://redcanary.com/wp-content/uploads/2022/01/Red-Canary-MSFT-Partners-1024x647.jpeg 1024w, https://redcanary.com/wp-content/uploads/2022/01/Red-Canary-MSFT-Partners-768x485.jpeg 768w" sizes="(max-width: 1200px) 100vw, 1200px" /> <h6>Not seeing the form?</h6><p>Email <a href="mailto:marketing@redcanary.com"><strong>marketing@redcanary.com</strong></a> and we’ll help you get registered. Or you can always <a href="/contact-us/"><strong>contact us</strong></a>.</p> jQuery(function($){setTimeout(function(){$('input[name="Last_Campaign_Interaction__c"]').val('');},1200);}); Keith McCammon, Chris Rothe, and Brian Beyer met in 2012 while supporting the intelligence community with offensive cybersecurity, research, and big data processing applications. Alongside that work, they began helping breached organizations respond and recover.These were good security teams who did “all the right things,” bought the right products, had the right services, and still were breached. If you’ve never been through a breach, it’s brutal—someone has come into your organization, rifled through the drawers, taken things, and now you have to tell your leadership, your board, and your customers that you failed to protect them.Our founders knew the system was broken, so they developed a different kind of security platform and service to truly protect organizations from cybersecurity attacks. It focused on the threats that were actually resulting in breaches. And with their data processing expertise, it hunted through the tremendous multitude of data that security teams and vendors weren’t capable of processing.Since then we have been a security ally to customers of all shapes and sizes—from the most sophisticated technology and finance companies, to healthcare and small businesses. And we haven’t looked back since.History in the making 2012Keith, Chris, and Brian meet at Kyrus2013Red Canary platform launches and we begin hunting for threats with our first customersFEBRUARY 2014Kyrus spins Red Canary out with $2.5m in seed fundingAPRIL 2014Red Canary convinces Carbon Black to provide streaming access to endpoint telemetry, an industry-firstMAY 2016Surveyor open source project released to help EDR users hunt for threatening applicationsJULY 2016$11.2m Series ADECEMBER 2016Crowdstrike debuts streaming access to their endpoint telemetry for Red CanaryOCTOBER 2017Atomic Red Team open source project released to help every organization test their defensesDECEMBER 2017Red Canary begins serving incident response firmsAUGUST 2018Red Canary adds orchestration and automation to lower organizations’ time to respondFEBRUARY 2019Red Canary launches our first Threat Detection Report to educate the communityAPRIL 2019$22.5m Series BMAY 2019100 CanariesJULY 2019Red Canary and Microsoft begin offering complete streaming access to Defender security telemetryJANUARY 2020Chain Reactor open source project released to help organizations test their detection and response coverage on LinuxMARCH 2020Launch of the 2020 Threat Detection Report and micrositeSEPTEMBER 2020Red Canary launches our Linux agent that prioritizes safety and stabilityNOVEMBER 2020Broad integrations released to help organizations make sense of their entire security stackJANUARY 2021250 CanariesFEBRUARY 2021$50m Series CMARCH 2021Launch of the 2021 Threat Detection Report, microsite, and open sourced analysisOCTOBER 2021Red Canary partners with Jamf to help organizations secure their Apple devicesNOVEMBER 2021400 Canaries'''
