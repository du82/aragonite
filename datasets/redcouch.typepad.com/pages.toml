title = "SM Global Report: Richard Edelman - Global Neighbourhoods"
description = "Edelman PR is the world's largest independent PR agency, but I'm not really one to be impressed by the largeness of an organization. PR Week has voted Edelman the best large PR agency in the world, three out of the last four years, but I hold trade rags commending industry luminaries suspiciously. What impresses me the most about Edelman PR is that it seems to be an agency of innovation and big ideas, more than other large agencies I have known. It was the first PR firm to conduct media tours. It set up the first-ever online crisis management service. It was the first Western PR firm in China, and perhaps most impressive to me, is it established trust as the key measurement for PR strategy. What also has impressed me is Richard Edelman and the thought leadership he has demonstrated in the complex and nuanced area of social media and its impact on the PR industry. He was early to the blogosphere, and he led his own staff to become among the most social media active of all agencies. He also has been an undoubted influence on the heads of large companies, NGOs and even small countries in understanding and embracing social media. I asked Richard his thoughts on social media and particularly the impact it is having on PR agencies and their images. 1. You recently posted a blog that disagreed with a NY Times piece about Silicon Valley PR practices in the social media era, saying that it used old, false stereotypes. Please summarize your bones of contention. The NY Times article had an important lesson for communicators, who must recognize that the winnowing of mainstream media will require a different approach to PR. But the idea that PR folks can circumvent both MSM reporters and key bloggers by whispering in the ears of influencers is patently false. So was the characterization of PR executives (especially females in PR) as reliant on relationships to achieve results for clients. Classic stereotypes of PR executives can be summarized as evil spin room denizens as in the movie “Wag the Dog” or superficial party people with megaphones. Both of these canards must be refuted and resisted. 2. It does bode a couple of interesting questions. Here’s PR, which can be defined in many ways, but usually image has something to do with it. Why do you think PR has so many problems with its own image? The PR industry has image issues because it allows itself to be defined by its least common denominators, from celebrity publicists to Silicon Valley relationship masters. In fact, what we do is more important than ever before. The dispersion of authority, lack of trust in institutions, rise of stakeholder society, need to connect to broader group of influencers are tectonic plates moving. We are pushing the concept of Public Engagement, with action tied to communication, to our corporate clients. 3. How do you feel social media has changed the role of the PR practitioner? Social media has allowed PR people to have more personal and more continuous connection to stakeholders. The mainstream media news hole has allowed only episodic coverage of companies and has been focused most often on the CEO. Now we can bring a more true-to-life picture of companies, with consumer-generated views of products, blog posts from corporate researchers, and discussions around important issues (ethically sourced product etc.) 4. Let’s go back a few years. You were, without dispute, the earliest prominent member of the PR community to whole-heartedly embrace social media. You started blogging in 2004 and you also started advocating that PR practitioners adapt to the changes that had started to occur. What did you see at that time that convinced you it would be wise to jump in? I must give all of the credit to my cousin, Linda Stone, / formerly of Microsoft, whose pioneering work on “continuous partial attention” best describes my teen-aged kids. She listened over lunch after my middle child’s Bat Mitzvah, where I carried on about the new role of civil society, the rise of empowered employees and consumers. She walked me over to the PC, sat me down, and pointed to early bloggers such as Dan Gillmor. In short, she pushed me to get into the game. It is my weekly appointment with the community; what will be new and interesting. 5. So you were early in incorporating social media into your personal brand. How did that impact the Edelman brand, and for that matter, the Edelman business practice? How often is social media a factor today in Edelman being selected, vs. 2004? My blog, and the 40 others that are featured at Edelman.com, have made us the most popular web site of any company in the communications sector (yes, ahead of Ogilvy, McCann and other giants). My blog is the leveling element in conversations with potential employees or when I visit companies on new business calls. We don’t have to talk about baseball or golf; we can make a connection on topics in my blog. Social media is a key reason why Edelman is selected by prospective clients; we have also persuaded our clients to be much more open in their communications with the world as control and credibility are at opposite ends of the spectrum. 6. What are the constants for the PR practitioner? What professional skills have remained the same since you started in PR? What's changed? A PR person must be more broadly knowledgeable and technically proficient. The opportunity to offer advice to the C-suite has never been greater, but we have to earn that position every day by being connected to new voices of employees, consumers, civil society and social influencers. There is a tendency to become narrow and deep, to know your industry top to bottom. That is not sufficient; it is not as if health care or technology exist in a vacuum. There will be pressures on privacy, IP, payment modality, fairness of compensation, green policy;..."
