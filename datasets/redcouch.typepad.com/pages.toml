["https://redcouch.typepad.com/weblog/2008/10/our-election-to.html"]
title = "Our Election: Toward a Common Ground - Global Neighbourhoods"
description = "As people who follow me on Twitter already know, I have long been an ardent supporter of Barack Obama. It is with joy and trepidation that I realize the very high likelihood that in less than three weeks, he will become the resident-elect of the United States.The joy is because of the hope I have for what he can achieve. The trepidation is because--like so many times in the past--the person elected does not do what the people who voted him in hope he will do. Four years ago, slightly over half this country voted for George Bush. They sincerely believed he would do better for us than he did. Their disappointment in what has happened to this country and the world during his tenure is probably no less than mine. I had great faith in Bill Clinton, the first time I voted for him, and some faith in him the second time around. But he did not conduct his personal life in a way that most American's had hoped he would. His sex life became a public issue and distracted from more important matters. My point is this. Having your guy beat the other guy is not like a sporting event. This is not about one side winning and the other side losing. It is about a process that is supposed to have friction in it. It is also about a process that works best when there is compromise involved. It is about a process where we are supposed to argue our cases with all our hearts and learn that there are other credible viewpoints being held by people of equal wisdom and integrity. In our passions we all get angry at times and in politics I find myself blowing my own top early and more often than I do in other areas. Electing a president is not about winning. It's about setting a course for the common good. It's about picking the perceived leader of the Western world. It's about finding a healthy level of governance. It's about finding peaceful solutions with other countries, many of whom have leaders who regard us with hostility or downright hatred. The media has come to treat political races as sports matches, perhaps boxing or live professional wrestling. That's why negative ads have been effective in recent elections. I see the paucity of media interest in complex issues as a major reason why these ads have worked--until this time and this election, which most people realize is just too important to decided by slur and innuendo. It is about finding common ground and respecting the views of others, no matter how boneheaded we regard those views--and they view ours. I hope I'm right about Barack Obama. If I am, our domestic situation will improve and our relationships with a great many countries of the world will improve and our realization how we all have come to interdepend on each other."
