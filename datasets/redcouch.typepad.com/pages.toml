["https://redcouch.typepad.com/weblog/2008/11/twitterville-wo.html"]
title = "My Twitterville Worksheet - Global Neighbourhoods"
description = "[Biz & Livia Stone at Blogo Espana. Photo by Shel] This is sort of an executive summary of Twitterville essential to my writing the book. It does not precisely follow my four-part TOC, but it is likely to be the order in which I write the book. I am looking for new content to cover in these areas. If you contribute, I will include you in the Acknowledgements. If you send me information, you should assume that I will treat it as my own under Copyright Laws. If you have a good idea that you thinks fits into Twitterville, please contact me by Tweets, Comments or--my preference--email. I will update this worksheet periodically. For those of you who are curious, it will show you my progress. It will also show you where I am hungriest for new content. 1 . Tweet heard round the world Have: • SXSW 07 Party anecdotes • Scott Beale Altavista Party (2008) (http://twitter.com/laughingsquid/statuses/768682462) • Techmeme pointer to attendee getting 3000 tweets • Chris Heuer [twitter.com/chrisheuer] post on lost intimacy • Francine Hardaway [twitter.com/hardaway]on changing view of using Twitter Looking for: More anecdotes of Twitter at SXSW 2. The Pinot that killed Odeo • Based on Video interview with Biz Stone in Feb • Based on talks with Biz Stone at Blogo Espana, 2006 Looking for: recollections of Odeo & early days of TWTTR 3. Dell Clears a shelf Have: • Dell's Ricardo Guerrero [twitter.com/ggroovin] at SxSW 07 & starting DellOutlet • Interview with Richard Binhammer [twitter.com/richardatdell] • Interview with Lionel Menchaca [twitter.com/lionelatdell] on how all Dell social media is centered around Direct2Dell blog Plan: • Brief interview w/Michael Dell on strategic importance of social media, particularly Twitter Looking for: Third-Party insights/anecdotes into Dell on social media & Twitter, perhaps a customer saved or gained through Twitter, perhaps a good service story. [NOTE: I've changed the order of the next three chapters.] . Global Companies Done: • Molson Ale Ferg Devins [molsonferg] and [twitter.com/toniahammer] • Starbucks, Matthew Guiste,[twitter.com/starbucks] promotions orientation, responds to user comments • Rubbermaid [twitter.com] Jim Deitzel • GraCo Twitter.com/lindsaybresco • Ford Motors twitter.com/scottmonty GM [twitter.com/GMBlogs] • Networksolutions KamiHuyse (starting point) [twitter.com/kamichat] • BestBuy CMO [twitter.com/BestBuyCMO Looking for: More companies, anecdotes & observations of large organizations using Twitter 4. Global Upstarts Have: Seesmic [twitter.com/seesmic] Laura Fitton [twitter.com/pistachio] Jim Long [twitter.com/newmediajim] Laurel Papworth [twitter.com/silkcharm] Home Repair Guy [twitter.com/CharlesENell] 5. Twitter as a support tool Have: ComcastCares [twitter.com/comcastcares] Francine Hardaway [twitter.com/comcastcares] Looking for: More stories/anecdotes of businesses using Twitter to support customers 6 Tweeting in a crisis Have: • The Home Depot [twitter.com/TheHomeDepot] • American Red Cross [Twitter.com/redcross] • Los Angeles Fire Department [Twitter.com/LAFD] • Andy Carvin (hurricanes) • San Diego Fires [twitter.com/crisiswire] Looking for: more stories of people & companies using Twitter for crisis intervention 7. Politics & Gov’t Have • Obama [Twitter.com/barackobama] • State of Utah CTO [twitter.com/dfletcher] • John Culberson, GOP Congressman, Texas [twitter.com/johnculberson] * Sen. James Demint, R-S Carolina)[twitter.com/jamesdemint] • Maxime Verhagen, Dutch Minister [twitter.com/maximeverhagen] • Office of Prime Minister Gordan Brown [twitter.com/10downing] • Office of David Cameron [twitter.com/davidcameron] • Chicago Transit, Caltrans, British Ferries • Twitter.com/tweeting politicians Looking for: Examples of politicians & govt using Twitter anywhere on any level 8. Humanity • Susan Reynolds/Connie Reece [twitter.com/susanreynolds twitter.com/conniereece] Looking for: Random and planned acts of kindness by indiviuals or organizations on Twitter. 9. Selling/Jobs/Marketplace Have: • NH House sought because of Twitter • Shower Hug • Tom Raftery Job offer offer [twitter.com/tomraftery] • Ryan Kuder [twitter.com/ryankuder] • Matthew Watson [www.m-p-w.co.uk] • Elliott Ng, Uptake [twitter.com/elliottng] • Jim Stroud [Twitter.com/JimStroud] • Twitpay [Twitter.com/twitpay] Looking for: More examples of a marketplace forming, recruiting, buy/sell 10. Twittering Around the world Looking for stories of Twitter in foreign language or international situations. Particular interest in China and Japan. 11. Oddball categories I am following some subjects that may or may not be included in the book but I am looking for more information that would make these topics useful or interesting to business readers Celebrity Tweeters Shaqille O'Neill MC Hammer Al Gore Britney Spear’s promoter Religion Blog Islam Causes Motrin Moms"
