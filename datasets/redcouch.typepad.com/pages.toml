["https://redcouch.typepad.com/weblog/2007/12/techcrunch-its.html"]
title = "TechCrunch Poll: It's a Ron Paul landslide  - Global Neighbourhoods"
description = "TechCrunch may have wanted to increase its influence when it asked readers to take a partisan vote for president based on the tech-related positions of each hopeful. Right now, Ron Paul is by far the top vote getter in either party with more than twice the votes of all Democrats combined. Among Democrats, Dennis Kucinich is snugly in the lead over Barack Obama. This may say more about the TechCrunch constituency than it does for the likely outcome of the upcoming election."
