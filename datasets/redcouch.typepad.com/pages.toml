ot call back. Alston text messaged the CEO again, and again Shoen did not call back, thus botching a second chance to offset the callousness of his rude employee in New Brunswick. Several people tweeted to Alston that he should consider Penske, U-Haul’s leading competitor. Each of them noted better service, better equipment and lower pricing. In the end, he followed the Twitterville recommendation, and would post a blog saying, “In a word, Penske rocks. From start to finish my experience with Penske was top notch.” The price of a truck rental? Variable. The cost to U-Haul of unhappy customers finding each other: priceless.'''
