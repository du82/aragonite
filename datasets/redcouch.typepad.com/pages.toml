["https://redcouch.typepad.com/weblog/2008/12/twitterville--2.html"]
title = "Twitterville Notebook: Next two chapters - Global Neighbourhoods"
description = "[New Media Jim on the Verge of a Global Practice. Photo by Shel] Well, last night I sent in my Introduction, Chapter 1 on Twitter's start, Chapter 2 on Dell learning to sell and listen, Chapter 3 on Companies using Twitter for Support and customer using it to get satisfaction. The total was about 13,500 words, making me just short of one-fifth of my way through Twitterville and that feels good. My toes are no longer at the base of the mountain, so that feels good. My thanks to the 50 Tweeters ho helped me get to this elevation. Now, it's time to start heading up the hill a little further. I am going to work on the next two chapters simultaneously and my hope is to get them done by New Year's we shall see. As always, I need all the help I can get. The next two chapters are book ends: On one side I'm looking at really big companies that are using Twitter to show greater humanity, intimacy and the ability to feel like a local shop--the way Frank Eliason does for Comcast which was covered in a previous chapter. Second, I'm looking at small businesses including home office folk, who are using Twitter to extend their reach internationally. Here is what I'm planning to cover so far: Chapter 4 Global Companies in Local Shops Zappos.com and all the other Zappos Tweeters. I'm interested in how they've essential opened up a well-staff retail store on Twitter. MolsonFerg I'm interested in how the Canadian Beer companies integrates Twitter into community service activities Jeremiah Owyang Jeremiah s knowledgeable on how enterprise organizations are using Twitter. I want his advice on who's doing it right--and wrong. Whole Foods This account is popular, but there is no actual person attached & not much conversation. I'll explore further Graco--LindasyLeBresco RubberMaid --Jim Dietzel If you can think of another company that should be added to this group, Please let me know. If you have some interesting insights or information regarding any of these companies, please let me know. Chapter 5 This chapter will talk about individuals or small companies who have extended their reach and market by using Twitter. So far, I am planning to look at: Seesmic . I hope to talk with Loic LeMeur who founded this hot startup almost exclusively through Twitter conversations. Laura Fitton (Pistachio). She used Twitter to transition from a stay-at-home mom to a globally recognized social media consultant & guru. Jim Long (New Media Jim)--NBC White House Cameraman is using Twitter to transition into his own start up, VergeNewMedia, a niche new media consulting and production company. Monkchips -James Governor is part of a five-person team of enterprise analysts and consultants located in at least three countries. I hope to talk to him about some extremely innovative ways in which the team is using Twitter. Home Repair Guy- CharlieENail . In Naked Conversations we searched in vain for a blogging plumber, but in Twitterville, I may have found the Tweeting home repair expert. I hope to land an interview and find out what this E-Nail guy is about. There's room in these chapters for a lot more. So please start getting those cards and letters in. I hope to start doing some interviews later today. A few notes: Most of the stories I plan to tell are success stories, amplified in that they are about people and businesses succeeding in tough times. I'm only covering negative stories, when the company or person has done something uniquely awful. There are a great number of mediocre business Twitter accounts. I do not plan to write much about them. I heavily favor Twitter accounts that show real people. As I keep writing: I prefer to talk to humans than Coke bottles."
full_description = "[New Media Jim on the Verge of a Global Practice. Photo by Shel] Well, last night I sent in my Introduction, Chapter 1 on Twitter's start, Chapter 2 on Dell learning to sell and listen, Chapter 3 on Companies using Twitter for Support and customer using it to get satisfaction. The total was about 13,500 words, making me just short of one-fifth of my way through Twitterville and that feels good. My toes are no longer at the base of the mountain, so that feels good. My thanks to the 50 Tweeters ho helped me get to this elevation. Now, it's time to start heading up the hill a little further. I am going to work on the next two chapters simultaneously and my hope is to get them done by New Year's we shall see. As always, I need all the help I can get. The next two chapters are book ends: On one side I'm looking at really big companies that are using Twitter to show greater humanity, intimacy and the ability to feel like a local shop--the way Frank Eliason does for Comcast which was covered in a previous chapter. Second, I'm looking at small businesses including home office folk, who are using Twitter to extend their reach internationally. Here is what I'm planning to cover so far: Chapter 4 Global Companies in Local Shops Zappos.com and all the other Zappos Tweeters. I'm interested in how they've essential opened up a well-staff retail store on Twitter. MolsonFerg I'm interested in how the Canadian Beer companies integrates Twitter into community service activities Jeremiah Owyang Jeremiah s knowledgeable on how enterprise organizations are using Twitter. I want his advice on who's doing it right--and wrong. Whole Foods This account is popular, but there is no actual person attached & not much conversation. I'll explore further Graco--LindasyLeBresco RubberMaid --Jim Dietzel If you can think of another company that should be added to this group, Please let me know. If you have some interesting insights or information regarding any of these companies, 