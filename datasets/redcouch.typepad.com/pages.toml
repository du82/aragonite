entation on how nonprofits were making more effective use of social media than were for-profit companies. She asserted that by getting closer with their communities, fund raisers were increasing revenues, while decreasing fund raising costs through social media. I learned a good deal more about this during my Social Media Global Survey interview with her. I keep hearing from corporate social media enthusiasts how slowly social media is growing, but in fact it is growing rapidly and it should be little surprise that private sector companies often intent on disrupting larger incumbents are using social media more aggressively. Fr those who cannot feel the momentum, I often advise people to picture themselves sitting on a porch in a tropical paradise on the Equator. They can feel no more motion than is caused by the gentlest of breezes. Yet, they are hurtling on an axis at the speed of 16,000 miles an hour.'''
