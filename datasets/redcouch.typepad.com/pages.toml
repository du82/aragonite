ned here and I would love to hear from you if you can point to evidence of convergence between traditional and citizen journalism in social media venues.I am always on the outlook for a next book possibility and Braided Journalism is among those that captures my personal passion. Bt whether it becomes a book or not, depends on what I find and to an almost equal degree, what people tell me here and on Twitter.'''
