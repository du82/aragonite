["https://redcouch.typepad.com/weblog/2009/03/wanted-a-good-government-twitter-constituent-story.html"]
title = "Wanted: A government Twitter-constituent story - Global Neighbourhoods"
description = "I think I've been frustrating people who are trying to help me this morning on Twitter. I have been asking for stories where someone in government--any government, any department, who helped a consituent through Twitter, something that could not have happened without Twitter. In nearly every chapter of Twitterville, I have had one or more stories that would not have occurred without Twitter. For example in the chapter that I've almost completed, I tell about Janis Krums who was on a Hudson River Ferry when US Airways Flight 1549 came to an emergency landing. He took a photo that went to the world--including the traditional media. I write also about Casper Oppenhuis de Jong who was in a China bookstore when a 7.9 Earthquake struck and he helped inform the workld through Twitter. Nearly very chapter has one or two stories that try to illustrate how Twitter makes the previously impossible easy. In my upcoming politics and government chapter, I have a ton of merican and British officials and agencies who are using Twitter and using it well. But it is all new. I have interesting stories (hopefully) about the Obama campaign and the British Prime Minister. But I do not have any magic stories, reportrs on how a citizen problem was fixed, or an injustice got righted because government was accessible via Twitter. It may be too soon. The avalanche of government activity in Twitterville is new. What I want to report on may not have yet happened--but I'm sure it will. The result will illustrate how Twitter can let government and constituents get closer together constructively. If you know of such a case, please share it with me. The best way may be to send me an email: shelisrael@gmail.com."
