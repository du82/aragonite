nther reporter to attach her or himself to the protesters, writing human interest pieces about them, where they were from, how they got to Pittsburgh and why as well as what they hoped to accomplish. I would have insisted the leaders be interviewed and their backgrounds checked out. I would have investigated where their money had come from. I would have had someone research both the protest movement against globalization as well as a brief history of US street protests and what they did or did not achieve. I would have had my art department draw maps showing the proximity or distance between protesters and the G20 Summit. I would have investigated the possible vulnerabilities caused by the protests. I would have spoken to local citizens and non participating eyewitnesses who could shed light on what they had seen. And so on. But I am in no position to do any of those things. Unfortunately, it appears that neither is the press whose coverage of this protest has been thin at best and apparently written without having been there or seen anything firsthand.This why I have become a proponent of what I call braided journalism, the coming together of tweeters like me with professional organizations like the New York Times. We have seen samples of this in the last 18 months; the Szechuan Earthquake, Mumbai, Gaza, Iran Elections, Station Fire and many other incidents. When citizen and traditional journalism braid together the pubic is better served. We come closer to getting the whole story. The information provided tends to be more balanced. Our right to know allows us to form opinions on sufficient information.G20 is now over. All parties will go home and share their thoughts with friends. Maybe some reflective commentary will appear online. But overall most people won't know what happened there because of a failure of braiding the information together and reporting on it.'''
