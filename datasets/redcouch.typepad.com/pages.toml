["https://redcouch.typepad.com/weblog/2008/10/sm-global-rep-2.html"]
title = "SM Global Report: China's Kaiser Kuo - Global Neighbourhoods"
description = '''Straddling 2 Worlds with Balance & Understanding [Photo by Guenevere, Kaiser Kuo's daughter, 4&1/2] I leave for my first visit to China in just 18 days, so this interview is particularly timely for me. For the 55 percent of my readers based in the US, I believe it is also timely for you. It seems to me that China is America's most important relationship. It is also among the most complex with apparent misconceptions on both sides of a very large ocean. That is why Kaiser Kuo, Ogilvy China Group Director for Digital Strategy, is an ideal subject of this 112th SM Global Report. Both charismatic and articulate, Kaiser seems to straddle the two worlds more comfortably than anyone else. Born in upstate New York and raised in Arizona with degrees from both UC Berkeley and the University of Arizona, Kaiser has lived full-time in Beijing since the early 1990s and his passion and understanding of his adopted country comes through clearly in this interview. Kaiser has had what one might call a quixotic career. It includes a good deal of professional writing including a stint as Red Herring magazine Asia bureau chief, where he covered the tech business in China and East Asia and as Editor-in-Chief for the now defunct ChinaNow.com multi-city online guide. He chronicles his life in Beijing in the popular back page column of English-language magazine The Beijinger—a column called "Ich Bin Ein Beijinger, which is also the name of his former personal blog." A collection of those columns will soon be published as a book. He also served previously in a couple of Internet companies, Mobile Internet Games and Linktone, where he created successful mobile game concepts and currently advises seven additional start ups. But before that, Kaiser was really a rock star and I mean that literally. Co-founder of China's first and most successful Heavy Metal band, Tang Dynasty, Kaiser remains active in the music scene, performing and recording with his band Chunqiu. [YouTube], which goes on tour the day after I meet up with him in China. 1. When and why did you decide to move to China? What is the single biggest change in your life because of that move? On trips to China with my family in the 1980s, it had become clear to me that the genie was out of the bottle, and that once unleashed, there wasn't any turning back. It was pretty obvious to anyone paying attention that the entrepreneurial talents of China's enormous population, once unleashed, were going to bring on changes of historic proportion. I realized that as someone with some facility in the language I'd be in an excellent position to watch how things transpired from up close, and perhaps hitch my wagon to any number of opportunities that would come up. I first intended to settle in China in 1988, right after finishing my undergrad studies at Cal Berkeley. I came to Beijing as planned, and very interesting things started happening for me--particularly in the world of rock music, in which I quickly became involved. But the political upheaval of the Spring of '89 cut my plans short and I wound up high-tailing it back to the States and enrolling in a graduate program in East Asian Studies at Arizona. I spent much of my time there trying to make sense of what I'd seen happen in Beijing. Once I realized that when the smoke cleared, the reform and the opening-up of the country was proceeding apace, I started coming back during summers. After my MA, I dropped out of a Ph.D. program and returned to Beijing in 1996, more or less for good. Initially the lure remained primarily music, but the nascent dynamism--social, economic, cultural--was a huge draw for me too. If I had to identify one single biggest change in my life, it's that by having spent so much time on both sides of the Pacific I've become something of a credible bridge individual: someone to whom many Americans looked to have China "explained" to them, and conversely, someone to whom Chinese looked to have certain aspects of the West demystified. I'm lucky that I've been able to serve in that capacity both as a rock musician and as an Internet commentator. I've learned, I hope, to see how each side views the other, and to empathize with the perspectives of both. 2. You have spoken and written--perhaps more than anyone else--about the misconceptions the US and Chinese social community members have about each other. You've described what's happening online as "when Worlds Collide." Can you give a quick summary of what we in the West misunderstand the most? First off, I want to make clear that there are many, many Westerners, whether academics, journalists, bloggers or pundits, who "get" China--who get it as well as anyone can, anyway. On balance I believe the media--especially journalists who live here in China and have taken the time to learn the language and cultivate excellent networks of contacts--do a laudable job reporting China. (I'm referring to Anglo-American media outlets; I don't read other Western languages). That said, their excellent work still can't overcome some deeply-rooted misconceptions. The sad truth about people is that they'll come away from the most balanced of news stories with their own misconceptions reinforced. Social media community members are no exception. Social media lets us choose our own communities and we tend to move in even more like-minded circles than we might in our offline lives. So the same misconceptions persist, are often amplified and continue to color and inform the western sides of citizen-to-citizen dialogs that happen between denizens of the Anglo and Chinese online worlds. Here are a few that I see crop up a lot: The monolithic myth. The assumption that Chinese political authority speaks with a single voice. China is a continent-sized country, and its enormous, parallel hierarchies of Party and state are not the perfect transmission lines that run from Beijing down to every village...'''
full_description = '''Straddling 2 Worlds with Balance & Understanding [Photo by Guenevere, Kaiser Kuo's daughter, 4&1/2] I leave for my first visit to China in just 18 days, so this interview is particularly timely for me. For the 55 percent of my readers based in the US, I believe it is also timely for you. It seems to me that China is America's most important relationship. It is also among the most complex with apparent misconceptions on both sides of a very large ocean. That is why Kaiser Kuo, Ogilvy China Group Director for Digital Strategy, is an ideal subject of this 112th SM Global Report. Both charismatic and articulate, Kaiser seems to straddle the two worlds more comfortably than anyone else. Born in upstate New York and raised in Arizona with degrees from both UC Berkeley and the University of Arizona, Kaiser has lived full-time in Beijing since the early 1990s and his passion and understanding of his adopted country comes through clearly in this interview. Kaiser has had what one might call a quixotic career. It includes a good deal of professional writing including a stint as Red Herring magazine Asia bureau chief, where he covered the tech business in China and East Asia and as Editor-in-Chief for the now defunct ChinaNow.com multi-city online guide. He chronicles his life in Beijing in the popular back page column of English-language magazine The Beijinger—a column called "Ich Bin Ein Beijinger, which is also the name of his former personal blog." A collection of those columns will soon be published as a book. He also served previously in a couple of Internet companies, Mobile Internet Games and Linktone, where he created successful mobile game concepts and currently advises seven additional start ups. But before that, Kaiser was really a rock star and I mean that literally. Co-founder of China's first and most successful Heavy Metal band, Tang Dynasty, Kaiser remains active in the music scene, performing and recording with his band Chunqiu. [YouTube], which goes on tour the day after I meet up with him in China. 1. When and why did you decide to move to China? What is the single biggest change in your life because of that move? On trips to China with my family in the 1980s, it had become clear to me that the genie was out of the bottle, and that once unleashed, there wasn't any turning back. It was pretty obvious to anyone paying attention that the entrepreneurial talents of China's enormous population, once unleashed, were going to bring on changes of historic proportion. I realized that as someone with some facility in the language I'd be in an excellent position to watch how things transpired from up close, and perhaps hitch my wagon to any number of opportunities that would come up. I first intended to settle in China in 1988, right after finishing my undergrad studies at Cal Berkeley. I came to Beijing as planned, and very interesting things started happening for me--particularly in the world of rock music, in which I quickly became involved. But the political upheaval of the Spring of '89 cut my plans short and I wound up high-tailing it back to the States and enrolling in a graduate program in East Asian Studies at Arizona. I spent much of my time there trying to make sense of what I'd seen happen in Beijing. Once I realized that when the smoke cleared, the reform and the opening-up of the country was proceeding apace, I started coming back during summers. After my MA, I dropped out of a Ph.D. program and returned to Beijing in 1996, more or less for good. Initially the lure remained primarily music, but the nascent dynamism--social, economic, cultural--was a huge draw for me too. If I had to identify one single biggest change in my life, it's that by having spent so much time on both sides of the Pacific I've become something of a credible bridge individual: someone to whom many Americans looked to have China "explained" to them, and conversely, someone to whom Chinese looked to have certain aspects of the West demystified. I'm lucky that I've been able to serve in that capacity both as a rock musician and as an Internet commentator. I've learned, I hope, to see how each side views the other, and to empathize with the perspectives of both. 2. You have spoken and written--perhaps more than anyone else--about the misconceptions the US and Chinese social community members have about each other. You've described what's happening online as "when Worlds Collide." Can you give a quick summary of what we in the West misunderstand the most? First off, I want to make clear that there are many, many Westerners, whether academics, journalists, bloggers or pundits, who "get" China--who get it as well as anyone can, anyway. On balance I believe the media--especially journalists who live here in China and have taken the time to learn the language and cultivate excellent networks of contacts--do a laudable job reporting China. (I'm referring to Anglo-American media outlets; I don't read other Western languages). That said, their excellent work still can't overcome some deeply-rooted misconceptions. The sad truth about people is that they'll come away from the most balanced of news stories with their own misconceptions reinforced. Social media community members are no exception. Social media lets us choose our own communities and we tend to move in even more like-minded circles than we might in our offline lives. So the same misconceptions persist, are often amplified and continue to color and inform the western sides of citizen-to-citizen dialogs that happen between denizens of the Anglo and Chinese online worlds. Here are a few that I see crop up a lot: The monolithic myth. The assumption that Chinese political authority speaks with a single voice. China is a continent-sized country, and its enormous, parallel hierarchies of Party and state are not the perfect transmission lines that run from Beijing down to every village that some people imagine. There's a lot that goes on at the sub-provincial level that has little or nothing to do with the Party line from on high. Even within the Party there are a wide range of viewpoints on the burning questions of the day, to include issues of personal freedoms. But there's this persistent notion that any time someone's rights are violated in a small town thousands of kilometers from Beijing, the order must have somehow come down from Hu Jintao himself.The myth of continuity. When someone like Jack Cafferty on CNN calls the Chinese leadership "the same goons and thugs they were 50 years ago," he's simply wrong. China underwent a momentous, revolutionary change 30 years ago when Deng Xiaoping inaugurated his reforms deliberately reshaping the leadership to create one of the most thoroughly technocratic regimes the world has ever seen. Jiang Zemin, his successor, continued to change the very nature of the leadership by embracing capitalists and entrepreneurs--the "most advanced forces of production"--who had had been excluded previously. And now the leadership under President Hu Jintao and Premier Wen Jiabao have shifted emphasis and are addressing many of the excesses of earlier freewheeling market-led development. They're genuinely focused on issues like sustainability, energy and the environment, and the terrible unevenness of development between the countryside and the cities and between the coastal provinces and the hinterland. Civil society and the public sphere have made major advances--the latter especially on the Internet--and while there have been lamentable setbacks at times, the general trend toward a more open society increasingly tolerant of criticism is undeniable.Historicism. There's a tendency by some westerners to discount or even dismiss China's claims that history still has a strong hold on China's political culture. You see this crop up in discussions online between Chinese and Westerners constantly. China's position is that long-entrenched habits of mind aren't so easily discarded and that leaping, for instance, to a more pluralistic, open society would be dangerous and destabilizing--that it could well reverse the gains in quality of life that 30 years of gradualist reform have built, that it would be bad for the world in ways Western critics of the Communist Party's monopoly on power haven't thought through. China's leadership, as well as private citizens, both play this card so often that I can see why Westerners might have gotten sick of hearing it, but among Chinese this notion that China's historical realities circumscribe the possible rate of change is widely--indeed, nearly universally--held. Americans in particular, are relatively free (blessedly so, some would say) of historic baggage, and there's a prevalent sentiment that change can happen overnight through collective will, a faith that things can turn on a dime. 3. And what do the Chinese most misunderstand about the West, in particular our social media community? As to Chinese misconceptions about the West's social media community, I think it's unfortunate but fair to say that the number of Chinese who've even bothered forming impressions of it are few and far between.The vast majority simply pay it no mind, just as the vast majority of western Internet users pay little mind to the Chinese social media community, except to convey pity for the oppressive yoke they assume it lives under. Those Chinese who do pay attention--generally, more tech-savvy, cosmopolitan urbanites who read English and may have spent some time abroad--are uniformly impressed with the ingenuity that social media entrepreneurs continue to display, impressed with the enthusiasm with which social media apps are adopted, and with the level of thought that and reflection one sees in the West about the impact of social media on everything from marketing to politics. But in the last year, especially after the riots in Tibet, the disruption of the Olympic Torch relay, the controversy over the Olympic Games and China's human rights record, many have been jolted into an awareness that China's image, even among the tech-savvy Americans they so admire, isn't a good one. From their online encounters this year, many--even among China's most Westernized young people--have come away with the impression that Americans and other Westerners are woefully ignorant of China. That's not, of course, uniformly true--and ignorance of the West among Chinese is also widespread and lamentable. 4. You've published a list of Forbidden cliches Western journalists should avoid saying about Beijing. I get there in 15 days. What advice do you have for me about what I should look at when I'm there? What stories should I go after that other Western journalists have missed? In terms of Internet stories, I don't think enough gets written about the specific ways in which the emerging Chinese Internet culture really differs from digital culture in the West, or Japan, or other developed markets. So many writers on this sector get all breathless with the huge numbers (and I'm still not invulnerable to that) that they miss the human dimension to ICT stories. Articles (and books) that address innovation here are too polemical: either China's doomed to copy Valley business models for eternity, or it's going to upend the whole world with some super-disruptive Next Big Thing. I'd love to see more stories that explore in a more nuanced way the balance of forces holding China back and propelling it ahead. Also, not enough gets written about the culture of tech entrepreneurship here--about this fascinating ecosystem that involves nerdy Tsinghua engineers with big ideas, worldly returnees with their Valley experience and their Harvard MBAs, silver-tongued lawyers and placement agents, and all those VCs--from the parachutist who comes to China and expects to be buried in business plans as soon as he lands, to the jaded, world-weary China veteran who's seen it all and knows every trick. I don't think anyone's written the definitive story--not one that's well-reported and addressed from all the right angles--about how China's tech industry is going to be impacted by the meltdown of the global financial system. That's what's really on my mind these days. So many moving parts--it's really a fascinating story. 5. One of the elephants in the room for Western journalists is the issue of censorship. Help me to understand why Western perceptions may be overblown? Is there no "Great Firewall of China?" First, I don't think Western journalists have been at all shy about the elephant, about covering the issue of censorship. It's actually rare for me to speak to someone who doesn't bring the topic up in some capacity. And I wouldn't by any means say that Western perceptions of censorship are uniformly overblown. I've seen some absolutely spot-on reporting by American mainstream media reporters, most notably James Fallows of The Atlantic. For me the most persistent problem, and one that creates real misunderstandings between the Chinese technorati and their counterparts in the West, is this myth of a blinkered netizenry. There's often an assumption by Westerners that China's Internet is much more closely regulated and tightly fettered than it in fact is. The Internet is censored, yes: Of that there's no doubt. But the parameters within which online discussion is allowed to take place is surprisingly large, and circumscribing walls are stretched daily. Not a day goes by when Internet forums aren't abuzz with some instance of official malfeasance, and criticisms are directed at anyone from the lowliest county cadres to the loftiest politburo members. The image that many westerners have of a benighted netizenry cowering behind a Great Firewall is a terribly misleading caricature, and one that causes fierce resentment among those Chinese aware of it. There's another problem with the west's understanding of censorship in China. They tend--and I think this is sadly western-centric--to think of Chinese Internet censorship mainly in terms of the blocking of external sites: The BBC, or Wikipedia, or CNN (none of which are currently blocked, by the way). The truth is, most Chinese aren't interested in looking at sites hosted outside of China, and by far the more significant form of censorship is that demanded of operating companies within China--the blog hosting companies, the Internet forums, the news portals and so on. That impacts on the lives of Chinese Internet users far, far more than say Typepad or Wordpress blogs outside of China being blocked. Besides, most tech-savvy Chinese interested in accessing that content easily find ways around the so-called Great Firewall, through VPNs, tools like Tor, or numerous proxy servers. 6. Do you think social media will help increase understanding between the two cultures over time, or do we just keep inscrutably bumping? How and why or why not? I think 2008 has been an unlucky year for cross-cultural misunderstandings in cyberspace: the pace and timing of event'''
year_published = 2020
clearnet = "https://redcouch.typepad.com/weblog/2008/10/sm-global-rep-2.html"
