["https://redcouch.typepad.com/weblog/2008/09/kd-quotei-tweet.html"]
title = "Home Sold, Job Found & Goods sold on Twitter. Should eBay & Craig's List Watch Out? - Global Neighbourhoods"
description = '''[ Masiero Family New Home, Berlin NH. Bought through Twitter.] In the last couple of weeks, I've learned about the first home to be sold on Twitter, a Canadian PR guy who found a job, and new invention to lessen pain in lactating moms. Along with these major items, there's an array, of people search for apartments, brokers getting listing, iPhones and used clothing that have changed hands in the real world through Twitterville encounters. The house is the biggest deal, and the price also makes it interesting to home buyers and perhaps scary for home owners. Tom Masiero is co-founder of YoParts.com , an online auto parts club, whose members get discounts on what they buy. He's been living in a rented condo in southern, New Hampshire, paying $1300 a month and figuring it would be some time before he could buy his own home in a place where he'd like to raise a family. Oh yeah, one other key point: He Twitters. Enter my ubiquitous pal KDPaine also of Southern NH, not far from where Tom resides in the tangible world. KD has been doing some consulting for Coos County, in the Northern portion of NH, a place that gets spectacular this time of year, but also an area where the housing market is stressed. For example, Berlin, a scenic town of about 10,000 people has 200 homes on the market, 80 of them foreclosures. Among the homes that has sat on the market with lawn sign gathering cobwebs since April is a little beauty owned by a 91-year-old widow who has lived in the 1200 square foot, three bedroom, two-story place all her life. The home is 102, and I'm told it has been well-maintained. KD hears about the house and tweets about it, mentioning in her 140-character post that the asking price is all of $75,000. Tom reads the post, makes connections, rides three hours north and closes a deal for $55,000, in time for the widow to move to Florida before winter and his family to celebrate Thanksgiving amid the breathtaking late autumn foliage. "There's great broadband in Berlin and I can do most of my work at home, driving south just when I really have to. It really was the deal of a lifetime. KD was so impressed with the prices and opportunities that she chipped in with an associate to buy an attractive vacation rental for a whopping $39,000. I have a hunch Paula & I will be staying in it next fall. People who hang out in Twitterville, can't help but notice there has been a steady influx of residential real estate people lately. Why? Because, like politicians, they tend to be quick to notice where people are heading. Gina Kay Landis is one of them. She runs a national listing service and reports that she just picked up her first listing reference through her Twitter account. Perhaps it was the first ever. I have little doubt it will be the last. John Carson reported to me that he got laid off from a PR job in Toronto, posted about it on Twitter and got rehired. I somehow managed to lose his email. John if you read this, contact me and I'll insert the links. The most unique item that I could find sold so far on Twitter is the Shower Hug. Sam Bhavnani, is director of NPD Group in San Diego, when he is not surfing. When he's not doing either, he's tweeting as SamirB. He told me, "A girl I was friends with in high school, who tweets as PockLock just had a baby and was complaining about her sore breasts. " It also happens that a good friend of mine in San Diego started a company based on an invention she had when she first became a mother and experienced the same problem. The Shower Hug is her product. It's a soft terri cloth type of thing women can wrap around their chest and wear in the shower, so they don't get hurt by the shower sprays. My friend back east went online and bought one. And she loves it." It just so happens I have a daughter who is breast-feeding two infants right now, so Sam's friend will wring up a new sale sometime in the near future. So what's going on here? Do I really mean to imply that these transactions could somehow threaten the mighty icons of eBay and Craig's List? Yes. Wherever people gather and converse, markets form. Both Craig's List & eBay have certain community characteristics. But they are not communities. Numeric rankings of credibility on technology is far from the same way people in real communities refer goods, service and each other. Twitterville is much more like a real community. We meet each other first and decide about each other in terms of reputation. We influence each other. Twitter was not built or intended to be a transactional marketplace. It lacks lots of functionality that you'll find at Craig or eBay. But it has something more valuable. It is an authentic community and it's members will make of that community whatever they want. I predict that there will be a great many more transactions that start with Twitter conversations, then move elsewhere to close the deal. Meanwhile if you like snow, mountains and fall foliage, I suggest you contact my pal KD. She seems to know where the deals are.'''
