title = "My New Book - Global Neighbourhoods"
description = "Twitterville, How Businesses Can Thrive in the New Global Neighborhoods [Portfolio, September 2009] is Israel’s newest book. It tells the stories of more than 100 people Israel has interviewed in all aspects of business ranging from home office to global enterprise. It tells you about accidental citizen journalists who happened to be present when a plane landed on the Hudson River; when an earthquake devastated Szechwan, China; and how people with causes have raised money from thousands of people, sometimes in just a few hours and how government is starting to use Twitter to be both more efficient and responsive. Twitterville is intended to tell you how so many people have succeeded with Twitter, so that others can get ideas on how it may help them as well. Purchase Pre-order at Amazon, BN.com, 800-CEO-READ, Borders.com, or IndieBound. Join Us at TBASH! TBASH, the Twitterville book launch party will be held 4-8 pm, Sunday, Aug. 23 in the Hiller Aviation Museum. Space is limited so sign up now. Book Details • Hardcover: 306 pages • Categories: Business, Social Media, Current Events, General Readership, Marketing • Publisher: Portfolio Hardcover (September 3, 2009) • Language: American English • ISBN-10: 1591842794 • ISBN-13: 978-1591842798 Related Blog Posts Click here to read all the Twitterville related blog posts on Shel Israel's blog, Global Neihbourhoods. About the Author Shel Israel is a social media storyteller. He is co-author of Naked Conversations, and The Conversational Corporation. Read more about him here. [Photo by @jowyang]"
