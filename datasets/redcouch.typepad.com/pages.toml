["https://redcouch.typepad.com/weblog/2008/10/china-notebook.html"]
title = "China Notebook #4: More thoughts and factoids - Global Neighbourhoods"
description = '''My trip to China is fast approaching. I leave Nov. 6, arriving Nov.7. I keep studying a few minutes everu day and have learned a great deal over the past six months, in part because of the bounty of great English language Chinese blogs. My great epoch failure is learning just a few Chinese language phrases. The characters absolutely befuddle me. The best of the three books I've read so far is Nixon and Mao by Margaret MacMillan, who is a great writer. This book gets you to see and understand the starting point f the modern relationship between the US and Chin. It also shows you how bad men accomplish great goods--from my perspective. I have no love of either of the two central players, but what they did in 1972 in one week has indeed changed the world as MacMillan argues in her book. A few interesting factoids I have picked up in the past few weeks: There are 56 different clans in China, the largest of them being the Hans. A great many Chinese people remain more loyal to their local people than to the national China. Most Americans miss this I think. WallMart is a larger trading partner with China than is Canada. In 2007, 900,000 Americans visited China. Because of the Olympics, well over a million Americans will visit China in 2008. One of Mao's greatest misgivings about making friends with the US was that Americans would come to giant and "mongrelize" their culture just by our presence. Despite immense poverty, the Chinese people have far greater personal savings than do Americans and perhaps all European countries. This was true before the events of the last few weeks wiped out so much of American savings.'''
