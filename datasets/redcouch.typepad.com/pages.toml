["https://redcouch.typepad.com/weblog/2009/04/about-me.html"]
title = "About me ... - Global Neighbourhoods"
description = "[That's me on the left. Brewster is the guy with the bone. Photo by Brian Solis] I write, speak and advise on social media. I'm co-author of Naked Conversations--how blogs are changing the way businesses talk with customers and Twitterville, how businesses can thrive in Global Neighborhoods [scheduled for release by Portfolio in September 2009]. I have contributed editorially to BusinessWeek, FastCompany.TV, and Dow Jones. Ad Age ranks this blog at #78 on the 2009 Power 150 business blogs. Since 2005,I've interviewed more than 350 people in 38 countries on social media’s impact on culture and business. The people I've talked with are quite diverse, ranging from Michael Dell, founder of Dell Computers to Wael Abbas, who posts hidden-camera videos of Egyptian police brutality on YouTube to Isaac Mao, China’s first blogger and GM Vice Chairperson Bob Lutz. I'm regularly interviewed by traditional and online media and have addressed audiences in eight countries on social media related topics. In November 2008, I was honored to become the first American to keynote at CNBloggercon, China’s largest social media conference. I am a senior fellow to the Society for New Media Research (SNCR) and serve on the advisory boards to the Social Media Club and SmartBrief on Social Media."
