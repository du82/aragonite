["https://redcouch.typepad.com/weblog/2007/12/parmets-4-tips.html"]
title = "Parmet's 4 tips on boosting blog readership - Global Neighbourhoods"
description = "If there's one thing bloggers like to talk about it's blogging. We just can't seem to get enough tips on how to get more recognition. Even those of us on a soapbox shouting that it's about the conversation not the recognition enjoy getting the recognition for having said that. In that light, David Parmet has four useful tips on how to boost recognition of your blog. This post is one example of what he's talking about."
