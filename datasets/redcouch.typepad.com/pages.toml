["https://redcouch.typepad.com/weblog/2008/12/twitterville--6.html"]
title = "Twitterville Notebook: HR Block's Paula Drum - Global Neighbourhoods"
description = "[Paula W. Drum, H&R Block] I interviewed Paula W. Drum back in April when taxes were on most people's minds. As VP Digital Marketing, she has been the driving force for H&R Block's extensive social media activities. That interview also covered how H&R Block first stepped into Twitterville and the early lessons they learned. I will incorporate that part into the Twitterville. I went back to Paula with a few additional questions as well. 1. Twitter is just one of many social media tools that H&R Block is using. How is Twitter unique from the other social media tools and how does it interact for HR Block with the others? The most unique aspect of Twitter is the one-to-one connection with customers. Our other social networking activities are community-based in which we may interact with a group (YouTube, Facebook, MySpace, etc). Twitter provides a more personal connection with an individual. 2. I noticed that you actually follow more people at HR Block than follow you. Did that just happen or is there a strategy involved? We do follow more people than follow us at the moment. We follow those individuals who have questions about taxes as it opens up the channel for direct messages (not everyone wants to ask tax questions publicly). We also follow people we find interesting in the sectors of technology, personal finance, social media, etc. The team we have manning our Twitter brand account also have their own personal Twitter accounts. We are a part of the community. 3. Is your Twitter traffic seasonal? Does it peak at tax time or is it year-round? We man the Twitter post all year, which is a change for H&R Block since we are such a seasonal business. We do see our activity in Twitter peak with tax season. However, we are finding there are consumer interactions that are appropriate all year - not just when people are thinking about getting their taxes done. We are connecting with customers, prospects, associates and potential employees. Twitter is not just about reaching potential new customers. It is about a dialog between the brand and many different audiences. 4. How do you think Twitter has changed HR Blocks marketplace position? Twitter and our other social media programs are about creating an approachable, innovative face to the brand. H&R Block has 99% brand recognition. However, many people only think of us as the retail tax preparation location on the corner. In fact, H&R Block is a multi-faceted brand with digital products as well as our well-known retail tax locations. By interacting through Twitter, it demonstrates that we are tech savvy and that we truly care about our customers. We answer questions. We solve problems and sometimes we just offer some moral support. In each of these interactions we are able to humanize the brand beyond just a corporation. For most, it is surprising to find H&R Block interacting through social media - it is causing them to think of the brand differently and this gives us the ability to demonstrate the digital aspects of our brand. 5. Is there an age factor? Are you speaking with younger tax bracket people on Twitter than elsewhere or is it pretty much the same? Many of our social media programs do reach a younger audience - Twitter is no exception. It is important for us to build connections with Gen Y and the Millennials. Gen Y members are the new tax entrants and these are our customers for the future. The interesting thing about the newer generations is that they are not technology adopters - they are technology expectants. They expect corporations to be technologically savvy. They want to interact with a company on their own terms. It is important for us to understand how to best serve the future generation of our customers. 6. What advice do you have to other service companies about Twitter? What about other seasonal businesses? First, don't cast judgment on the value of Twitter unless you have made the effort to experience Twitter for yourself. Second, realize that Twitter is not about broadcasting mass messages. You are never going to have the same reach as a television ad. What Twitter does offer is a golden opportunity to listen to people and find out how they perceive your brand and through deep individual interaction you can create brand advocates. 7. What are your biggest lessons learned? First, Twitter is not an avenue for marketers or public relations folks to broadcast messages. It is about listening and interacting. Second, the cost of Twitter is not a media cost, it is human capital. You need real people that can represent the brand. You need to have the ability to solve problems such as an escalation path for customer service issues. And last, you need to be authentic. Corporate shill is not welcome in the Twitterverse. This is especially important for corporations to realize the difference between talking AT and talking WITH people. 8. Additional Comments? Twitter is a great example of the changing face of marketing. It is a very interesting time when public relations, marketing and customer service are all converging. It is no longer about using advertising to create a brand's position. Mass advertising can still create awareness, but, the social aspects of the internet are creating the opportunity to engage with consumers on a much deeper level, before and after they are customers. Twitter creates a human face and voice for a brand."
