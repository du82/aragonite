["https://redcouch.typepad.com/weblog/2007/12/forbes-name-24.html"]
title = "Forbes name 24 celeb bloggers plus a staff member - Global Neighbourhoods"
description = '''The Web Celeb 25 - Forbes.com The 2nd Annual Forbes 25 list is out and there are several of the names--Arrington, Scoble and Om Malik for example and they should be pretty proud. But wait a minute, wasn't Forbes the Magazine that likened us bloggers to a lynch mob nt so very long ago? Hmm. The Forbes Page has some interesting sidebars, one an article about bloggers who were not real people. But then on the main list, there's this blog written by someone called The Fake Steve Jobs, who wasn't a person either, but a contrivance by none other than that same Forbes Editor who likened bloggers to a lynch mob in a Forbes cover story. But Forbes covers this with an indepth interview with--you guessed it--that same Forbes editor who likened bloggers to a lynch mob. What I really liked is that the Forbes teaser on the interview with the Forbes editor says he "breaks silence." Excuse me? This guy has been on every interview program and column this side of Oprah, which once again shows she knows where to draw the line. Now where did I put my torch? Anyone got a match? Technorati Tags: arrington, scoble, malik, forbes 25 Dan Lyons Powered by ScribeFire.'''
