["https://redcouch.typepad.com/weblog/2008/04/gntv-gms-bob-lu.html"]
title = "GNTV: GM's Bob Lutz talks social media & global warming - Global Neighbourhoods"
description = 'Bob Lutz, the controversial vice chairman of General Motors sat down with me to discuss social media at GM and for business in general. I was told it was the first time he had ever done an exclusive interview on the topic. As a board member at the Fortune 3 company, Lutz began blogging on GM FastLane in early 2005. FastLane has become one of a growing number of GM blogs and social media programs. FastLane has evolved into a team blog. Lutz talks about social media in general, but, halfway through the 17-minute clip, I got him to digress onto another subject. While one of the PR folk in the room winced and bit his lip, Lutz reviewed how he stepped into one of his periodic firestorms of controversy by speculating that "Global warming may be a crock..." I got him to expand on it, talking about how his blog post had fanned the flames what points he had meant to say and why environmental issue or not, Detroit must move away from fossile fuel dependency. I am always eager to get feedback, but in this particular case, I am more interested than ever to hear what you think.'
