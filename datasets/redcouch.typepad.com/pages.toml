["https://redcouch.typepad.com/weblog/2008/12/twitterville--7.html"]
title = "Twitterville Notebook Zappos CEO Tony Hsieh - Global Neighbourhoods"
description = "[Zappos CEO Tony Hsieh. Photo by Laughing Squid] Zappos is among the great retail stories of the past decade. It started in 1999, when the company's founder was unable to find a pair of shoes in a San Francisco mall. So he started his own online shoe shop offering huge selection, fast fulfillment and a consistent message of great service, which customers seem to universally confirm is the case. It came of age in the last recession, selling $1.6 million in the year 2000, then growing to $8.6 million in 2001, a year when many retailers dipped. It is on track to sell over $1 billion this year, up from $840 million last year, better than perhaps any US-based retailer for growth in these tough times. The company has expanded well beyond shoes, into accessories, watches, eyewear and just about any clothing category. But, as CEO Tony Hsieh, points out in this quick Q&A, by focusing on culture, all the other good stuff just sort of evolves. And perhaps more than anu other retail company, Twitter is significant--if not essential--to corporate culture. 1. When and how did you first get interested in Twitter? Were you the first person at at Zappos to start Tweeting? I first started using Twitter in March 2007 at the SXSW Interactive conference. While at the conference, I found it was a great way to find out what was going on during the day at the conference as well as figuring out what parties to go to at night. After the conference, I introduced it to my friends in Vegas (where I live now) as well as my friends in San Francisco (where I used to live). I found it was a great way to find out what was going on and for meeting up with friends in Vegas. I also found that it was a great way to keep in touch and feel connected to my friends in San Francisco. After using it with just my close friends for about a year, I realized how much Twitter had allowed me to form more personal connections with everyone, so we decided to introduce it to Zappos as a way of growing our company culture. We've found that it's been great for building more personal connections with both employees and customers. 2. Last I checked, Zappos had 435 Twittering employees. Best I can tell, that makes Zappos the tweetingest company on Earth. How did Twitter spread through Zappos? Did you inspire it, drive it or did it just evolve? New employees are introduced to Twitter during orientation, and we also offer Twitter classes to all employees. Employees aren't forced to use it, but when there are so many Zappos employees using it, many employees just gravitate naturally to it. We have several hundred employees on Twitter. You can find a list of them here: http://twitter.zappos.com/employees And we've aggregated all their tweets here: http://twitter.zappos.com/employee_tweets 3. Is there a Twitter strategy? How does Twitter fit into the overll Zappos business strategy? Our #1 priority as a company is our company culture. We believe that if we get the culture right, then most of the other stuff, like great customer service and building a great brand, will happen naturally on its own. Twitter allows us to both build and expose our company culture both internally to employees as well as to customers. Part of the Zappos brand is about forming personal connections, and that happens through the telephone as well as through Twitter. 4. Can you tell me one or two really good stories of things that happened on Twitter that might not otherwise have happened? There was an employee that Twittered out that she could really use a cheeseburger because she was hungry. She wasn't actually expecting a cheeseburger to magically show up, but it just so happened that another employee was on her way to work, so she decided to stop by McDonald's, and within 10 minutes the first employee had a cheeseburger on her desk. She was WOW'd by that experience and that definitely helped build our companyculture. 5. How do you think Twitter has changed Zappos? I think it's helped our culture in that employees have more of an opportunity to learn about each other personally. For customers, if you look at our employee twitter page, you can get a pretty good sense of what our culture is like: http://twitter.zappos.com/employee_tweets 6. Does Twitter impact revenue for Zappos? What is Twitter's primary value to Zappos? We don't really view Twitter as a way to drive direct revenue. Twitter is about forming a more personal connection with our customers, just like the telephone is."
