g and shadowing trailed off. After all, Isaac is a spearhead in China's effort to join the global tech community, something China-a country that needs to create millions of new jobs each year--wants desperately. Also, his VC activity brings foreign dollars into China, creating jobs for young, bright Chinese. He may cause them some discomfort, but one would think China wants Isaac to keep on doing what he is doing. What he says may make government officials nervous from time to time, but all things considered, they are likely to cut some slack to this highly visible, internationally respected member of the international social media community. Over lunch in San Francisco, one of the world's most tolerant cities, Isaac told me it's different for China's real human rights activists. "They are totally harassed. It's rarely about getting thrown in prison, although that remains possible. They usually remain free, but their lives are made totally miserable every day of their life." But he is convinced that the determination of his government to command and control over the country's 1.3 billion citizens is becoming about as effective as baling water from a boat with a lawn rake. We joked about movies such as the Bourne Identity that show government agents who are incredibly adept at listening, watching and eliminating citizens. In real life, neither China's government, nor America's are as good as Hollywood would have you believe, although both governments cause a fair share of unnecessary human suffering. But the numbers go against the governments. In the two years since we first talked, Isaac estimates the number of Chinese bloggers has exploded from 1.2 million to at least 20 million. Others estimate that number is as high as 60 million, but Isaac discounts "blogs" that are diaries without RSS or Comments. More and more these bloggers say whatever they damned please. "Years ago, we had to self-censor, but more-and-more people are becoming more than Chinese. We are more now a part of the world because of social media and global business." "This year," Isaac pointed out, "China had many problems [such as the lead paint in toys incident]. Government is more embarrassed by our own people, than from the outside, so they tried to tighten controls. In the blogosphere, the more government tries to squeeze, the more people fight back. More and more bloggers are daring to speak out." He said government wishes it could remove "loud bloggers so the can say China is a 'harmonious society.' " He smiles and pauses. "Bloggers go on the Internet and hack the word "harmony." In Chinese, you can change the word easily to mean 'River of Shit.' That's what we think of our government's 'harmonious society.' " "If you want to be harmonious society you should respect diversity and free speech. You cannot sing harmony if all the people sing the same note." [ Part 2 will examine how Isaac got started in social media, social media in China as well as it's amazing growth and strength in the last two years. We'll also have a bit more on how bloggers deal with censorship.]'''
