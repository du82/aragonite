title = "A Unique PR Experience - Global Neighbourhoods"
description = '''I just got an unsolicited, old-fashioned email from a PR operative who I don't think I ever met. But he had heard me speak, was familiar with my blog and the topics I covered. In less than 250 words, he told me who he was and why he thought I might be interested. I was. His name is Ted Weismann. He works for the Lois Paul Agency and his client is Lionbridge. I want to speak to them for the SAP Global Survey. Stay tuned. Ted did me a favor, bringing me a company that may solve part of the translation problem for social networks that I have written and spoken about. He has done me a favor and it is likely what I write will be helpful to his clients. As the media trained cliche goes: "It's really that simple." If this happened more often, I would not kvetch about practitioners in my former profession so often.'''
