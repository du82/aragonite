s. The catch is that those three readers were the President of the US, and the heads of China and Russia. Influence is extremely difficult to measure. First, there are different influencers by different topics. Second, as much as I cheerlead the power of the conversation, most content continues to be read, absorbed, shared and discussed by people using RSS who do not join our conversations where we can see and count them. Engagement is one way of assuming influence. If people come back every day and stay for long periods we assume it's engagement. It can also be that people just frgot to close a tab after reading you and walking away. I have a great deal of respect for a score of bloggers and perhaps two score of Tweeters. I refuse to share there names because, the names steadily change over time. Some of the names invariably are people with very few followers, who address matters such as hiking gardening or the environment. I talk little about them because these are topics that do not interest most of the people I am trying to influence on the topic of social media. When I start writing about something new, such as China, I gain some readers and hopefully influence them, but I also lose some who do not care to read what I have to say on that topic. So, what's my point? I think there are two: (1) You need to think, really think, about who you read and which of them truly influence you. Then cross check and see if they are the most popular. Smetimes there will be a direct correlation. Other times not, I would guess.(2) The best way to influence thers is not to try to be popular. It is to shae what you know and care about. Those who care about the same topics will find you. The best conversations do not need to be held with the largest crowds.'''
