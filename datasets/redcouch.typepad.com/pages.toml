["https://redcouch.typepad.com/weblog/2009/10/josh-bernoffs-tweetbased-interviewan-experiment-that-teetered.html"]
title = "Josh Bernoff's Tweet-based interview--an experiment that Teetered - Global Neighbourhoods"
description = "Groundswell co-author Josh Bernoff interviewed me on Twitter this morning. You can see his transcript of it here. For 30 minutes, he asked me questions & I answered, Then we opened it up for anyone to ask questions. It is the fourth such tweet-based experiment in which I participated and I think it will be my last for a while. There are certain aspects of it that I think have potential. In our talk prior to doing the interview, Josh likened it as a panel talk at a conference followed by a Q&A. For two college classrooms, it was a good way of demonstrating what can be accomplished in quick conversational tidbits. But for folks viewing my interchange with Josh this morning, there were too many moving parts. The latency between Q&A was some times painful. People did not know who to address questions to. Sometimes I forgot to add our #tville hashtag and so on. Maybe someone will find a way to refine how this sort of interchange could succeed. Maybe Twitter or a third-party will figure out a plug in or addition that will make it work. Until then, there are lots of other venues. Even for classrooms, I think Skype is a better social media tool. It still leaves a great many useful applications for my favorite tool."
