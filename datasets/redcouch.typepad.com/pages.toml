["https://redcouch.typepad.com/weblog/2009/09/note-this-is-the-second-of-a-two-part-interview-with-corporate-communications-guru-shel-holtz-you-can-read-part-1-here.html"]
title = "SM Global Report: Shel Holtz [Part 2] - Global Neighbourhoods"
description = 'NOTE: This is the second of a two-part interview with corporate communications guru Shel Holtz. You can read Part 1 here. Can you give me some insight into your views on how social media is changing the role of the professional communicator? One of the myths of social media is that the role of the communicator is completely changed. I would argue that some dimensions of the communicator’s role have changed, and they are significant. Other dimensions, though, continue just as they were. Social media is an addition to the business communication environment. It has NOT completely replaced the environment. For example, media relations continues to be important. Despite assertions that the media are irrelevant, research continues to demonstrate a considerable amount of trust placed in local news media, both print and electronic. The behind-the-scenes work of communicators that is never visible to the general public – like negotiation with activist groups, in-depth audience research, relationship- and alliance-building with strategic constituents – will continue as before. Now that we have the “in-addition-to-not-instead-of” argument out of the way, let’s talk about how the role of the communicator is changing thanks to social media. Or, perhaps I should say “should change,” since in many organizations, these new requirements for communications haven’t yet taken root. The most significant change is the notion that communication is the crafting of one-way top-down messages. While there is still a role for some of that, communicators must equally be prepared to facilitate conversation. Some of the skills required include community identification, building, and moderation; one-to-one engagement and message monitoring. Coordinating the organization’s social media efforts is another vital role for communicators, ensuring, for example, that employees all have accurate, timely information they can tap into when engaged in their own conversations with friends, families and online communities. Such coordination also ensures a rogue business unit doesn’t do something inappropriate in the social media space that colors the reputation of the entire organization. Communicators also need to know what new channels are emerging and be ready to monitor them and communicating through them should the evidence suggest they have become important. And communicators must be able to demonstrate the effectiveness of their efforts. While there are many points of view about the ability to measure social media, there is always a way to note how an effort has paid off, particularly if you knew what your goals were for that effort at the outset. Another communications industry issue is the continuing consolidation of traditional media. How does this impact the professional communicator? I don’t see this as a new issue. Media have always gone through consolidation and change. Television was a new medium. The changes in the magazine industry of 25 years ago – from general publications like Life and Look, to specialized, niche publications, like Ferret World – also required communicators to rethink their approaches. Email – nearly 20 years in the business world – introduced new marketing opportunities (both good and awful). But, how often do you see Burma Shave-like roadside promotions these days? Communications has always been about adaptation. Smart communicators have always watched the landscape to detect the shifts and tap into the channels to which audiences are paying attention. Anybody who keeps all their eggs in one basket (e.g., television) isn’t very good at his or her job. One reason marketers are embracing channels like YouTube and Twitter is that they recognize the declining influence of some traditional channels like newspaper and television advertising and the migration of attention from those media to newer ones. Concurrent with this, of course, is the need for communicators to embrace the practices that work in these new media. Simply transferring the same messages to the new media – like running press releases through corporate blogs or trying to deliver marketing messages through Facebook – won’t work. Solid professionals in the communication business know this intrinsically. Less professional communicators are surprised. Simultaneous to all this, is the relentless emergence of social media people. Where do these new “reporters” fit into the world of corporate communications? As with everything else, citizen journalists represent challenges and opportunities. The challenges include not necessarily getting a heads-up that someone is reporting on you, and not necessarily getting called for fact-checking or comment on a story about you. In short, citizen reporters don’t abide by a code of conduct that you could generally take for granted with "professional journalists," trained, to report through an hierarchy that includes seasoned editors, and getting paid for their work. With major events, the number of reporting outlets will exceed any organization’s ability to manage its interactions as they have in the past. While all reporters have some degree of bias, citizen journalists often don’t even strive for objectivity. Companies also need to watch for attacks on their brands. The recent viral blog displaying images of WalMart shoppers is a great example. Consequently, companies must broaden their monitoring and find ways to communicate that potentially reach these individuals as well as their audiences. However, if organizations see only the threat and not the benefits of citizen journalists, they’re missing huge opportunities to tell their stories. Blogger outreach is just the tip of the iceberg for engaging people and providing them with things to report that interest them and their readers/listeners/viewers. You and Neville Hobson have completed nearly 500 For Immediate Release podcasts. How has your content and audience emerged since you started back in January 2005? In addition to the 480 episodes we’ve produced of Hobson & Holtz, we’ve also released many interviews, book reviews, and speeches. Since Hobson & Holtz is a show that focuses on what’s happening now, the evolution tracks the changes to social and other new media. For example, we talked quite a bit about Second Life a few years ago; today, virtual worlds get mentioned far less frequently. Now, we spend a fair amount of time talking about Twitter, though. Another change: We spend less time making the case for businesses to...'
