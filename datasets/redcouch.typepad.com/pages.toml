["https://redcouch.typepad.com/weblog/2009/01/twitterville-notebook-gastronomers-danny-grabiner.html"]
title = "Twitterville Notebook:Gourmet Gastronomer's Danny Gabriner - Global Neighbourhoods"
description = '''The entire story of Gourmet Gastronomer, as of this writing spans about about six weeks. I am using it in the Twitterville chapter on small business because it displays how Twitter can help somebody turn a personal passion into an actual business. Such is the case--or will be the case--of Danny Gabriner, 23, whose day job is working as an analyst for CNET in San Francisco. But his heart belongs to a very large community known as "Foodies." He loves cooking, eating and sharing food. TastyBuds, Danny's personal blog was his food outlet on Dec 10, he announced he would start messing around with Twitter to see where it would take him and then made first actual Twitter post on Dec. 16 as Gastronomer. This would lead to his new, more professional food blog, Gourmet Gastronomer. With every intention of turning Gastronomer "into a real business" Gabriner explained that Gastronomer "has morphed rapidly, and continues to grow and change almost daily." But it got started on Twitter as Gabriner started using search tools to find people who shared his interest, or building a Global Neighborhood as I call it. He started with Twitter Search where he typed in such obscure terms as "bechemel" and "soffrito", two gourmet sauces, to find "people who were really into food. After I had around 10 or so of these people, I was able to see who they were talking to, and expand my community further," he told me. It was a start. Next he started exploring Tweetworks, a Twitter adjunct that lets you find groups on a multitude of subjects. There, he started finding a few dozen foodies at a time and he started following them on Twitter. Twubble and Mr. Tweet, two site designed to let you find new people on Twitter by shared interests. The lists of Twitterville Groupies started growing faster. Soon Gabriner had a few hundred followers, all sharing his interest in food and cooking. He had built a Global Neighborhood. Now, when he wanted to talk about food, there were people who cared what he had to say and who could contribute new insight and information into the conversation. This all took a few weeks. Next, Gabiner, used to Twitter to invite other foodies as guest bloggers to his Gourmet Gastronomer site. He received six enthusiastic responses.This small group of food enthusiasts decided to take the project yet another step forward. We decided that there would be a Macaroni and Cheese-Off, where everyone would post a picture and article about their recipe, and then there would be a giant vote. I once again asked on Twitter if anyone wanted to participate, and we ended up with 10 contestants. During our Mac and Cheese-Off my blog traffic skyrocketed to several thousand hits per day--up from a few dozen. Gabriner had learned of the virtues of using Twitter and a blog in conjunction. One is very fast but constrained to shallow content. The other is longer and deeper, but does not draw traffic as easily. In a short time, each of these projects had elevated Gabriner to a noted online food enthusiast. But there's just so much you can accomplish online talking about food and looking at pictures. Gabriner decided it was time to expand Gourmet Gastronomer into a real-life experience in the tangible world. He produced a giant party in the San Francisco area where he lives. "I smoked a ton of food (ribs, salmon, beef shoulder). We cooked a lot of pizzas, and I sent everyone home with Tupperware full of food." He is already planning events that combine the different activities. For example, there will be a "Soup Off," along the lines of the Mac and Cheese-off, promoted on Twitter, hosted on the blog, but this time, there will be a party where the Gastronomers will cook up batches of the three winning soups for a live tasting and final vote. "I have already locked in so many people from Twitter who want to participate that I have had to limit it to 20 entrants," he told me. Gourmet Gastronomer is now a thriving Global Neighborhood. Grabiner has signed up abut 15 people to contribute to his blog in various categories. All of the tangible activities are now in San Francisco, a recognized hub for food enthusiasts. You can see how a business model is forming. You can see how the activities in one city could be held in food hubs throughout the world. Through Twitter, the young entrepreneur recently signed up someone with a PhD in Food Sciences, who teaches at Italy'sL'Universita di Science Gastronomiche, who happens to frequently visit San Francisco.'''
