l media tools does LAFD use? For the most part, you name a popular tool and we are using it or at least experimenting with it. I have a self-imposed limit of 100 in the "LAFD Lab," which exists wholly in my laptop computer. I hover around that number, and sometimes have to scratch a marginally applicable tool for one that is showing greater promise. Q9. Do you think that Twitter has ever helped save lives? ' Yes. A recent situation with an overcrowded nightclub in Los Angeles was recently brought to my attention . It was a matter of moments later that we dispatched inspectors to close down a venue that could have resulted in a tragedy. It is only matter of time before Twitter plays a life-saving role during wildfires or floods. Q10. Do you have a great story for me regarding LAFD and Twitter? I have many. One of my favorites is the mention of the Starbuck's Barista contained in the post below, when my colleague Ron Myers and I were off-duty, out of uniform - and nearly sprayed our coffee across a local Starbuck's.'''
