title = "Telcos 10 Worst Moments of 2007 - Global Neighbourhoods"
description = '''Timothy Karr, writing in the Huffington Post reviews Telcos 10 worst moments of the year. It must have been a challenge for him to pick just 10 from so many, shabby, deceptive, greedy moments in any typical telco year. Like I've been saying, anything that has the word "carrier" in it's description should be mistrusted: airline, insurance, cable, typhoid, telco. Too bad, it's so difficult to avoid them. Very often, they get their powers, not by serving customers, but by legislation and litigation.'''
