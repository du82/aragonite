title = "Twitterville Notebook: Next 3 Chapters - Global Neighbourhoods"
description = "I've been laying out the next chapters for the book, covering business-to-business, small-to-medium business and individuals. For the most part, they will complete the business examples. The following are the companies and people I am considering for inclusion. About half have no idea that I've been looking at the and may decline for one reason or another. Others just may not pan out to be interesting or useful enough for the book. If you have suggested some content for these chapters, and do not see it, please ping me again. I may have overlooked it. But at this point I am looking for companies and people that have done something either remarkable or add useful practice or incite for business readers. The next few days would be a great time to suggest new content. I hope to start writing Ch. 6 this week end. Here's the outline: Ch. 7 Business to Business Tweeters IBM United Linen SoDexHo Careers Pitney Bowes Orange Business Services Breaking Point Technologies Ch. 8 Small Business. Long Reach The Twitter Plumber (@stoncray) Seesmic Stocktwits Crowdspring Home Repair Guy Ch 9 One Person. Big World Laura Fitton Jim Long Chris Brogan Jeremiah Owyang Please let me know what you think of my choices. Please advise me on who to add. BTW, over 60 percent of Twitterville's content comes from recommendations I have received from people on Twitter. If you are one of them, I will include you in the book's acknoledgements."
