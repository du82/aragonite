["https://redcouch.typepad.com/weblog/2009/10/an-tweetbased-interview-with-josh-bernoff-.html"]
title = "A Tweet-based interview with Josh Bernoff         - Global Neighbourhoods"
description = '''I am pleased and flattered that Forrester Principal Analyst Josh Bernoff, co-author [with Charlene Li] of Groundswell, the seminal corporate social media book has asked to interview me for his Groundswell blog. It is fitting that he suggested we do this on Twitter itself. We are set to go at 9 a.m. Pacific this Friday morning. Josh has the details here. A good way to follow will be to use our hashtag: #tville. So far, I've done one previous "twinterview" live on Twitter as well as two "tweach-ins" in which we used Twitter as the conversational venue. The first two went great, but a couple of weeks ago when I was talking to students in Mihaela Vorvorreanu's graduate student class at Purdue, a few people started to jump in with questions of their own. While I had posted that this was a chance for people to observe the conversation, it was apparently not sufficient to cause confusion. Using Twitter in this fashion is experimental. Both Josh and I--as well as students in two universities see some unique advantages and I hope this time it works better, so that the focus is our conversation--rather than our choice of venue. From 9-9:30 Pacific, Josh will interview me. If you ask questions Josh will keep them on hold until 9:30 am at which he will then open it up. As he says on his post--it's like a panel talk at a conference that gets opened up to the floor. I hope you join in. I hope that this experiment proves both useful and interesting. Either way, I hope that when it is completed you will give us your feedback.'''
