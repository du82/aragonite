["https://redhat.com/en/about/our-community-contributions"]
title = "How we contribute"
description = "Red Hat is a proud contributor to all aspects of the software stack, from the operating system and developer toolchain to middleware, the desktop, and the cloud."
full_description = "How we contribute Our work in open source communities Jump to section Jump to section What we do Red Hat is an enterprise software company with an open source development model. Communities power everything we do—the products we create, the culture we embrace, and the solutions we design with customers. We advocate for them every day. Because when they succeed, our customers do, too. Read the community blog How we do it Participate - Red Hat participates in and creates community powered upstream projects. We contribute code, collaborate on content, steward projects, mentor leaders, and sponsor events. Integrate - Red Hat integrates multiple upstream projects, fostering open source community platforms. And we work in multi-organizational projects, bringing industry-recognized standard technologies into our own projects. Stabilize - Red Hat commercializes these platforms and projects together with a rich ecosystem of services and certifications, while continuing to contribute back to the upstream projects of which we are a part. Ceph is an open source and freely available distributed object store and file system that relies upon the RADOS (Reliable Autonomic Distributed Object Store) foundation. Ceph Community Communities we contribute toWe ensure community health for Red Hat-sponsored and stewarded projects with active and participatory involvement that can include infrastructure, project management, communications, outreach, and onboarding Software communities We're a proud contributor to all aspects of the software stack, from the operating system and developer toolchain to middleware, desktop, and cloud. In addition, Red Hat financially supports a number of open source organizations who help us create and maintain better open source software. Standards communities We contribute to a wide range of open standardization efforts that define future interoperable technologies, both in software and hardware. Learn more about the standards and industry bodies in which we are active. See where we're involved Red Hat Research We nurture deep and long-term relationships with academics, researchers and students, so that we can help make open source a fundamental part of our partners' culture just as it is our own. Explore Red Hat Research Resources for youGet access to knowledge articles and resources to help guide you to better practices in free and open source software projects. FAQ Icon-Red_Hat-Documents-Paper_Lined_Copies-A-Black-RGB Open source software communities Get answers to some of the most common questions about open source software communities, including what they are, how they form, and how to get involved. Read more Overview Icon-Red_Hat-Documents-Paper_Blank_Stack-A-Black-RGB Open source participation guidelines This living document addresses various topics relating to participation in open source development. Read more Brief Icon-Red_Hat-Documents-Paper_Blank-A-Black-RGB Understanding the open source software life cycle Learn how Red Hat participates in the open source life cycle, creating customer value every step of the way. Read more See all related resources I want to know more More about our community involvement Blog post Real open source projects take mentoring seriously Blog post What does an open source program office do? Blog post Events: The life force of open source More about open source Red Hat is the largest open source company in the world. We build and support open source products from community projects. We give back to the community and defend open source—every step of the way. See what we mean"
