["https://redhat.com/en/about/privacy-policy"]
title = "Privacy Statement"
description = "Red Hat respects your privacy. Read more about how we collect and use information on redhat.com and other websites governed by this statement."
full_description = "Red Hat Privacy Statement Last Updated: July 1, 2024 Table of contentsScope of this Privacy StatementThe categories of personal data we collectHow we collect personal data (sources of data)How we use (process) your personal dataHow we disclose your personal dataCookies and other technologyYour rights and choicesVerificationSecuritySocial media, public forums and links to other websitesChildren’s online privacyData transfers and Data Privacy FrameworksChanges to this Privacy StatementEEA data protection authorityHow to contact usScope of this Privacy StatementRed Hat, Inc. and its affiliated companies and subsidiaries (collectively, “Red Hat”) respect your privacy. This Privacy Statement applies to personal data collected by Red Hat through the redhat.com website, and other websites which we operate and on which we post a direct link to this Privacy Statement. For some websites managed by Red Hat affiliates, the affiliate may act as a controller for data collected from the website. This Privacy Statement may not apply to open source project websites sponsored by Red Hat. Such project websites may have their own privacy statements, which we encourage you to review. In certain cases, this Privacy Statement applies to personal data collected by Red Hat when Red Hat makes this Privacy Statement or a link to the Privacy Statement available in a digital communication, paper form or in person (for example when attending an event).Please also note that co-branded websites (websites where Red Hat presents content together with one or more of our business partners) may be governed by additional or different privacy statements. Please refer to the privacy statement on those websites for more information about applicable privacy practices.Red Hat’s obligations with respect to personal data that may be held on behalf of customers in connection with cloud services Red Hat provides, such as personal data stored by customers using our OpenShift Online offering, are defined in our agreements with our customers and are not governed by this Privacy Statement.As used in this Privacy Statement, “personal data” means any information that relates to, is capable of being associated with, describes, or could be linked to, an identified or identifiable natural person (‘data subject’). An identifiable natural person is one who can be identified, directly or indirectly, in particular by reference to an identifier such as a name, an identification number, location data, an online identifier or to one or more factors specific to the physical, physiological, genetic, mental, economic, cultural or social identity of that natural person.Back to topThe Categories of Personal Data We Collect To the extent permitted by applicable law, the categories and types of personal data collected directly from you may include, without limitation:Contact information, including identifiers: Information used to communicate with you and verify your identity, such as first and last name, title, company name, email address, telephone number, and postal address;Account and commercial information: Information that Red Hat maintains in association with your account, such as your account number, username/user ID, password, payment information, purchase records, information about your use of the product or service, information about your registration or participation in a class, exam, certification, training, webcast or other event, your preferred language and other preferences, credit and billing status and support inquiries; Professional or employment-related information: Information collected during the recruitment, application and hiring process, such as information contained in your job inquiries or applications. Candidates are referred to the Red Hat Candidate Privacy Notice for more information;Internet or other similar network activity: Information collected when you visit a website, such as IP address, browsing history, information on your interaction with the website, browser type and language, operating system, location, date and time; Location information: Information about your physical location, such as if you provide your postal address or based on your IP address if you visit a website; andInferences: Information drawn from the personal data collected above, such as what topics you may be interested in based on the areas of the website you visit or what products you may be interested in based on purchase records.Red Hat generally does not collect sensitive personal data, which is data such as your religious or philosophical beliefs, racial or ethnic origin, health or medical information (other than for the purpose of responding to an accommodation request for an event), genetic or biometric data, bank account information (other than for the purpose of processing your order) or other similar sensitive personal data as such term is defined under applicable law. If Red Hat reasonably needs to collect any sensitive personal data from you, Red Hat will obtain your consent for the collection of such personal data as may be required under applicable law. For California consumers, please see the California Supplemental Privacy Statement to review the California required disclosures on sensitive personal information.How we collect personal data (sources of data)Red Hat collects personal data directly from you and from other categories of sources as described in more detail below. The categories of personal data collected directly from you by Red Hat include all of the categories identified above in “The categories of personal data we collect” section. Red Hat collects personal data directly from you when you interact with us through our websites, including, without limitation, when you:Create a user account (individual or corporate);Make online purchases or register products;Request support;Register for or participate in a class, exam, certification, training, webcast or other event;Request information or materials (e.g., whitepapers);Participate in surveys or evaluations;Participate in promotions, contests, or giveaways;Apply for employment;Submit questions or comments; orSubmit content or posts on our customer portal pages or other interactive webpages.Personal data we collect online may also be combined with personal data you provide to us through offline channels such as through a call center, during an interview or in conjunction with a Red Hat event you attend.We may also collect information indirectly from you relating to your use of our websites and response to our emails through the use of various technology. The categories of personal data collected in this manner are what we refer to above as Internet or other similar network activity and inferences. Collecting information in this manner allows us to analyze the effectiveness of our websites and our marketing efforts, personalize your experience and improve our interactions with you. For more information about the technology we employ for these purposes, see the “cookies and other technology” section below.We may also supplement the personal data we collect from you with additional personal data we receive from third parties, such as your employer, our customers, and our business partners where you purchase any of our products or services through such business partners. The categories of personal data we receive from this type of third party includes account and commercial information and professional or employment-related information. We do this to help us improve the overall accuracy of the information and its completeness and to help us better tailor our interactions with you. From time to time, we may collect contact information through other sources, such as list vendors. When we do so, we ask the vendors to confirm that the information was legally acquired by the third party and that we have the right to obtain it from them and use it.Back to topHow we use (process) your personal dataRed Hat may use personal data we collect about you to:Identify and Authenticate You. We use your personal data to verify your identity when you access and use our services and to ensure the security of your personal data. This includes your creation of an account that is associated with your personal data.The personal data that may be collected and processed for this purpose includes: name, title, company name, email address, telephone number, postal address, account number, username/user ID, password, preferred language and preferences. We process this information in order to comply with our contractual obligations to you. In other cases, it is in our legitimate business interests to be able to identify and authenticate you.Fulfill Your Requests. if you request something from Red Hat, such as a product or service, a call back, a newsletter subscription, or specific marketing or other materials, we use the personal data you provide to respond to your request. We or our representatives may also contact you as part of customer satisfaction surveys or for market research purposes. Where required by applicable law, we will obtain your consent before sending marketing messages.The personal data that may be collected and processed for this purpose includes: name, title, company name, email address, telephone number, postal address, account number, username/user ID, payment information, purchase records, information about your use of the product or service, information about your registration or participation in an event, your preferred language and other preferences, credit and billing status, and support inquiries. We process this information in order to comply with our contractual obligations to you when responding to your requests. In other cases it is in our legitimate business interests to be able to provide customers and prospective customers with information, goods, or services they request.Provide You with Information About Our Products, Services and Events. Red Hat may use your personal data to notify you about product and service offerings as well as events that we believe may be of interest to you. Red Hat also may use your personal data to respond directly to your requests for information, including registrations for newsletters or other specific requests.The personal data that may be collected and processed for this purpose includes: name, title, company name, email address, telephone number, postal address, account number, username/user ID, payment information, purchase records, information about your use of the product or service, information about your registration or participation in an event, your language and other preferences, credit and billing status, and support inquiries and location information and inferences. It is in our legitimate business interests to be able to provide customers, prospective customers, and the public with information about our products, services, and events.Provide Support and Customer Service. We use your personal data to provide support for products or services you have obtained from us and answer other questions. In the course of providing technical support to you, we may sometimes have incidental access to data that you have provided to us or data that is located on your systems. This data may contain information about you, or your organization’s business, employees, customers, partners, or suppliers. This Privacy Statement does not govern our access to or handling of this information. The conditions regarding the handling and processing of that data is covered by the applicable agreement between you and Red Hat, such as our Enterprise Agreement.The personal data that may be collected and processed for this purpose includes: name, title, company name, email address, telephone number, postal address, account number, username/user ID, payment information, purchase records, information about your use of the product or service, information about your registration or participation in an event, your language and other preferences, credit and billing status, and support inquiries. We process this information in order to comply with our contractual obligations to you.Enhance the Website Experience. When you use our websites and/or respond to our emails, we use the personal data you provide for the purpose of enhancing and customizing your experience on our websites and to deliver content and product and service offerings relevant to your interests, including targeted offers through our website, third-party sites or email (with your consent, where required by applicable law). We may also use this information to help us improve and further develop our websites, products and services.The personal data that may be collected, disclosed and/or processed for this purpose includes: name, title, company name, email address, telephone number, postal address, information about your use of the product or service, information about your registration or participation in an event, your preferred language and other preferences, location information, inferences, information collected when you visit a website, such as IP address, browsing history, information on your interaction with the website, browser type and language, operating system, location, date and time. It is in our legitimate business interests to improve the Red Hat websites, products and services and to enhance our users’ experience with the websites, products and services.Process Your Job Application. When you apply for a position at Red Hat, we use the personal data you provide for the purpose of assessing your application, considering you for future positions and carrying out human resources functions in accordance with applicable law. For more information about how Red Hat processes your personal data during the recruitment, job application and hiring process, please see the Red Hat Candidate Privacy Notice.If you are in the People’s Republic of China (PRC, for the purpose of this Privacy Statement only, excluding Hong Kong, Macau and Taiwan), the information necessary for entering into or performing a contract with Red Hat may be collected and processed by Red Hat without your express consent or the act of providing the information to Red Hat by you is deemed as consent.We will not use your personal data in a manner that is inconsistent with the purpose of its original collection, unless we have provided you additional notice and you have consented.Red Hat will retain your personal data for only as long as is required to fulfill the purposes for which the information is processed or for other valid reasons to retain your personal information (for example to comply with our legal and regulatory obligations, resolve disputes, enforce our agreements and for the establishment, exercise or defense of legal claims).Back to topHow we disclose your personal dataRed Hat discloses personal data for the following business purposes:Red Hat may disclose personal data to business partners and service providers in order to support our busines"
