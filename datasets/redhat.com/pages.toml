["https://redhat.com/en/about/company"]
title = "Company information - Red Hat"
description = "Red Hat is the world's leading provider of open source, enterprise IT solutions. Learn more about what we do and why we do it."
full_description = "@media (min-width: 1400px) { .company-hero { background-position: -340px top !important; } } @media (min-width: 1700px) { .company-hero { background-position: -220px top !important; } } @media (min-width: 2000px) { .company-hero { background-position: -120px top !important; } } @media (min-width: 2200px) { .company-hero { background-position: 30px top !important; } } Our Company Building better technology, the open source way Jump to section Jump to section We revolutionized the operating system with Red Hat® Enterprise Linux®. Now, we offer a broad portfolio of hybrid cloud platforms and open source technologies—including AI, virtualization, edge, app development, and automation solutions. Open technology built for change We deliver hybrid cloud solutions that are built to run anywhere our customers’ most important, most complex projects need to—from the datacenter to clouds to the edge. Our open ecosystem of partners and communities ensure existing investments stay protected, providing unmatched freedom and choices to change, flex, reinvent, or stay the course. Open source unlocks potentialAt Red Hat, we believe open source is more than a methodology. It’s an attitude. Start here From complex AI workloads to the operating system your IT runs on, there’s no challenge we can’t solve together.Build AI with confidenceMigrate VMs and modernize seamlesslyUnlock tech freedom Founded in 1993 More than 90% of U.S. Fortune 500 companies trust Red Hat1 More than 100 locations in more than 40 countries In 2012, Red Hat became the first open source technology company to surpass more than $1 billion in revenue In 2019, IBM acquired Red Hat for approximately US$34 billion, the largest software acquisition in history Joining forces with IBM empowers Red Hat to strengthen its existing partnerships to give customers freedom, choice, and flexibility See the full story to enterprise IT challenges Kubernetes Deliver cloud-native apps across hybrid environments We’ve worked within the open source Kubernetes project as one of the leading contributors to develop an understanding of the best cloud-native practices, tools, and integrations to support enterprise adoption of Kubernetes. See how we did it Edge computing Bring compute power to the network edge Solving problems at the source in real time requires multiple solutions working together across a wide ecosystem. Edge computing can help. We'll show you the way Open hybrid cloud Clarify your cloud vision Put open source flexibility to work for hybrid cloud. This approach empowers IT to bridge diverse environments and use each one to its fullest―without binding future resources. It enables you to respond to shifts in demand, industry changes, or your own IT priorities. See what it takes Open hybrid cloud We believe in the power of open hybrid cloud. Standalone cloud deployments based on proprietary technology inhibit clouds from interacting with one another. An open hybrid cloud strategy brings the interoperability, workload portability, and flexibility of open source software to hybrid enterprise environments. Explore open hybrid cloud Linux leadership Red Hat is one of the leading contributors to the Linux kernel. Red Hat engineers help improve features, reliability, and security to make sure your infrastructure performs and remains stable—no matter your use case and workload. Keep learning Digital transformation Open source values like meritocracy, community building, and transparency are changing the way the world approaches business and life. Red Hat offers tooling, principles, and standards that deliver a foundation for flexibility and innovation. Start where you are Red Hat Research From unikernels to privacy-preserving AI to usable security, Red Hat Research helps open source communities innovate and solve real industry problems. Explore research projects From the leaders in open source, for the leaders in ITOur open source solutions run through the stacks of the world’s most demanding datacenters and clouds. 100%of communication service providers in the Fortune Global 5002 100%of U.S. airlines in the Fortune 500 rely on Red Hat3 100%of U.S. Executive Departments rely on Red Hat4 CUSTOMER SUCCESS Red Hat customers benefit from open source innovation Our customers deliver innovations that affect their lines of business, organizations, industries, and the global community every day. By using open source technologies to create change, these organizations are proof that when we work in the open, extraordinary things can happen. Meet some of our customers See how we use our own products Let us help you tackle your business challenges Explore our solutions read: [1] Red Hat client data and Fortune 500 list, September 2022 [2] [3] [4] Red Hat client data and Fortune Global 500 list, September 2024"
