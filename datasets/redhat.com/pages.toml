["https://redhat.com/en/about/our-culture/diversity-equity-inclusion"]
title = "Red Hat - Diversity, Equity, and Inclusion"
description = "Red Hat aspires to create a culture of empathy and respect--for one another, our customers, and the communities in which we live and work."
full_description = "Diversity Equity & InclusionAn open inclusive culture A key part to the open culture framework at Red Hat is our open celebration of the contributions of our diverse teams across the globe. We thrive on connecting global Red Hatters to each other, under one mission—to embrace the new ideas that move our company forward and celebrate the diversity behind them. .b284a514-74e3-4814-977d-399a0e82e3fa { fill: #e00; }Icon-Red_Hat-Media_and_documents-Quotemark_Open-B-Red-RGB Red Hat aspires to create a culture of empathy and respect–for one another, our customers, and the communities in which we live and work. In this space of belonging and psychological safety, we can bring our authentic selves to take risks and deliver the innovation our customers and ecosystem need and expect. Shuchi Sharma Vice President and Chief Diversity, Equity & Inclusion Officer Sparking team innovation though inclusionRed Hat recognizes that our strength as a company is rooted in the diverse minds, backgrounds and relationships of our Red Hatters. Learn more about our mission and vision around diversity, equity, and inclusion. Our communities At Red Hat, we know we can do more as a community than as individuals. Our diversity, equity, and inclusion communities—also known as affinity groups or employee resource groups (ERGs)—celebrate our differences and shared experiences. Asian NetworkThe Asian Network is for Red Hat associates with heritage and identity from the countries in Asia Pacific and their allies. This community focuses on accelerating the advancement of Asian employees at Red Hat, as well as building community, advocating for greater representation, championing equity, and celebrating diversity. B.U.I.L.D.Blacks United in Leadership and Diversity (B.U.I.L.D.) exists to foster a connected community of Black Red Hatters and their allies. It supports Red Hat’s efforts to recruit, develop, engage, and retain Black associates through community outreach, social engagement, and professional development. Diverse AbilitiesThe Diverse Abilities community works to create a culture where differently abled people are welcomed, empowered, and supported in their contributions to the success of Red Hat. This group aims to increase awareness and better access to facilities, as well as improve recruitment and retention of associates with disabilities. Military VeteransThe Military Veterans community empowers the voices of veterans and their allies to amplify their contributions and opportunities within Red Hat’s collaborative culture by harnessing their leadership and experience. Native + Indigenous The Native and Indigenous community promotes awareness of indigenous populations and cultures worldwide through educational opportunities, and seeks to increase their presence throughout the technology field. NeurodiversityThe Neurodiversity community empowers Red Hatters by removing the stigma surrounding neurodiversity and mental health and by embracing a mission that celebrates, educates, develops, and creates a network of support for those with neurological differences. PridePride is a global community of empowered individuals bound by a common purpose: to unlock the potential of LGBTQ+ Red Hatters and partner with allies to foster a culture of inclusion. UnidosUnidos focuses on recruiting future Red Hatters from Latinx and Hispanic communities around the world, educating associates on the different cultures that exist and empowering future generations by promoting Latinx and Hispanic diversity within the technology industry. Women’s LeadershipThe Women’s Leadership community is a thriving global network of women from across Red Hat. From Raleigh to Pune, community members come together to share ideas, engage in discussions, and attend leadership and educational events. With 105+ offices in 40+ countries, plus many Red Hatters working remotely, we work collaboratively in globally distributed teams. Our projects benefit from having many different cultures and perspectives at work. It helps us refine our ideas and gives us a better understanding of our customers and the world. Red Hat Open Source for Education (ROSE)The Red Hat Open Source for Education (ROSE) project is a cross-community effort that brings students from Tira together with students from Ra'anana to the Red Hat® offices in Israel to learn about the Linux® operating system and Python programming. The students spent 6 months on a weekly basis working and learning together. The Red Hat Sponsorship ProgramThe Red Hat Sponsorship Program is a 10-month program that supports the career progression of Red Hat associates and builds the inclusive leadership skills of our senior leaders. Sponsors (senior leaders) are paired with a sponsee (a more junior associate) to collaborate on growth opportunities, expand networks, increase visibility, and advocate for future opportunities. Here are just a few examples of our diversity, equity, and inclusion outreach efforts:Red Hat also sponsors Outreachy, a nonprofit program offering internships with free and open source software projects to those facing marginalization, systemic bias, or discrimination in the technology industry of their country. Since 2010, Red Hatters have mentored more than 100 Outreachy interns.Red Hat’s DEI Community, Blacks United in Leadership and Diversity and the Global Engineering team at Red Hat have a strategic partnership with Shaw University, a HBCU (historically black college/university) located near Red Hat Headquarters in Raleigh, North Carolina. The purpose of this partnership is to identify opportunities to support Shaw’s growing Computer Science program through training, certification, internships, and the potential employment of Shaw University students and graduates. Employment demographicsBy the numbersAt Red Hat, we believe that the more diverse we are, the better we can innovate, serve customers, and contribute to the open source communities in which we participate. Every day, we’re working to be a more diverse and inclusive company. Red Hat Global headcount: 19,588Average age: 41.1Ethnicity(U.S. only) 13.5% - Asian5.7% - Black or African American5.4% - Hispanic/Latino0.4% - Indigenous2.4% - Two or more Races72.6% - WhiteSex(Global) 26.9% - Female73.1% - MaleLocation 24.3% - APAC29.9% - EMEA5.4% - LATAM40.4% - NAWork environment 54.1% - Remote40.2% - Hybrid5.7% - In Office Technical Average age of Red Hatters in technical roles: 40.3This data excludes those at or above the vice president levelEthnicity(U.S. only) 16.4% - Asian5.1% - Black or African American5.4% - Hispanic/Latine0.4% - Indigenous2.6% - Two or more races70.1% - WhiteSex(Global) 18.5% - Female81.5% - MaleLocation(Global) 24% - APAC32% - EMEA4.8% - LATAM39.2% - NAWork environment(Global) 61.2% - Remote33% - Hybrid5.9% - In Office Nontechnical Average age of Red Hatters in nontechnical roles: 42.8This data excludes those at or above the vice president levelEthnicity(U.S. only) 16.4% - Asian5.1% - Black or African American5.4% - Hispanic/Latine0.4% - Indigenous2.6% - Two or more races70.1% - WhiteSex(Global) 47% - Female53% - MaleLocation(Global) 25.3% - APAC25.1% - EMEA6.8% - LATAM42.7% - NAWork environment(Global) 37.4% - Remote57.9% - Hybrid4.7% - In Office Leadership Ethnicity(U.S. only) 11.9% - Asian0.0% - Black or African American6% - Hispanic/Latine82.1% - White0.0% - Indigenous0.0% - Two or more racesSex(Global) 20.9% - Female79.1% - MaleWork environment(Global) 35.6% - Remote29.8% - Hybrid34.6% - In Office Gender Equality Reports Red Hat encourages a creative, culturally diverse, respectful, and supportive work environment where individuals have an opportunity to build rewarding careers. This includes paying all associates equitably for comparable roles, skills, and experience. View our gender equality reports by country and learn what we're doing to support gender equality.UKRead the 2023 reportRead the 2022 reportRead the 2021 reportRead the 2020 reportRead the 2019 reportRead the 2018 reportRead the 2017 reportFranceRead the 2024 ReportRead the 2023 ReportRead the 2022 reportRead the 2021 reportRead the 2020 reportRead the 2019 reportRead the 2018 reportIrelandRead the 2024 ReportRead the 2023 ReportRead the 2022 Report * Data is from August 2024. Data for gender represents the global Red Hat population. Data for ethnicity represents only the U.S. Red Hat population, and terms reflect the U.S. government’s reporting requirements. Percentages may not add up to 100% due to rounding. Red Hat makes 100 Best Companies to Work For For the fourth year in a row, we’ve made the list of America’s best employers. See why we won Diverse perspectives welcome Search Red Hat jobs Recruitment fraud alertBe wary of scammers posing as recruiters online, especially on social media. Learn more"
