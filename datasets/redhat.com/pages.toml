["https://redhat.com/en/about/our-culture"]
title = "Fostering a culture of innovation - Red Hat"
description = "Red Hat’s culture as an open organization empowers employees to act, create, and debate, leading to better decisions for our business and our customers."
full_description = "@media (min-width: 1400px) { .culture-hero { background-position: -340px top !important; } } @media (min-width: 1700px) { .culture-hero { background-position: -220px top !important; } } @media (min-width: 2000px) { .culture-hero { background-position: -120px top !important; } } @media (min-width: 2200px) { .culture-hero { background-position: 30px top !important; } } Powered by open Culture isn’t a program. It’s our essence. As an open organization rooted in open source, Red Hat operates according to a specific cultural DNA. Collaboration and openness drive everything: how we work together, what we build, and the value we provide for our customers and the world. Jump to section Jump to section Open source principlesOur open source technologies are built on the principles of freedom, community, and sustainability. Explore our approach DIVERSE PERSPECTIVES WELCOMEOpen source unlocks potential At Red Hat, we believe open source is more than a methodology. It’s an attitude.From the trusted technologies we provide to the ideas that inspired them, we work the open source way.Good ideas can come from anywhere, and we can only identify them if we welcome diverse perspectives into our conversations. That’s why we collaborate by default, we share unsparingly, and ensure the best solutions to the most difficult problems endure as common knowledge.This is proven by our success: We are greater than the sum of our parts. .b284a514-74e3-4814-977d-399a0e82e3fa { fill: #e00; }Icon-Red_Hat-Media_and_documents-Quotemark_Open-B-Red-RGB Red Hat’s culture makes me feel empowered to learn about new technologies and businesses, reach out and collaborate with others across the company, and contribute new ideas and opinions. Jered F. Technology Strategist We believe our open culture empowers our people to bring their best ideas, and selves, to work. What does it take to be a Red Hatter? We come from all over the world and have done lots of different things, so we approach problems in a variety of ways. But all Red Hatters share one responsibility: to help one another keep our four values in balance.Freedom to contribute, no matter your job title Courage to do something differentlyCommitment to see it throughAccountability to customers, community, and each other Want to wear the red hat?Find out what it’s like to work with people who are passionate about making an impact in the world of open source. Check out our current jobs The best ideas winGreat ideas come from sharing diverse perspectives. Red Hat is dedicated to creating an inclusive environment for everyone, regardless of background. Why diversity works Doing good things—togetherBeing open means reaching beyond ourselves to help others. From local communities to global concerns, we have a responsibility to do what we can to make a difference. How we contribute Transform your cultureAny organization can be open. The first step is making the commitment to transform. Embracing open source values sets the stage for transformation into an open organization. Learn all about Red Hat Consulting's collaborative approach Connect with experts Get the emails you want Sign up for job alerts Choose your favorite topics Recruitment fraud alert Be wary of scammers posing as recruiters online, especially on social media. Learn more"
year_published = 2025
