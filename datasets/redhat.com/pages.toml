["https://redhat.com/en/about/press-releases/red-hat-unveils-red-hat-openshift-virtualization-engine"]
title = "Red Hat Unveils Red Hat OpenShift Virtualization Engine"
description = "Red Hat introduces Red Hat OpenShift Virtualization Engine, a new edition of Red Hat OpenShift that provides a dedicated way for organizations to access the proven virtualization functionality already available within Red Hat OpenShift."
full_description = '''RALEIGH, N.C. - January 15, 2025 —Red Hat, Inc., the world's leading provider of open source solutions, today announced the general availability of Red Hat OpenShift Virtualization Engine, a new edition of Red Hat OpenShift that provides a dedicated way for organizations to access the proven virtualization functionality already available within Red Hat OpenShift. Focused exclusively on virtualization workloads, Red Hat OpenShift Virtualization Engine provides a tailored option for deploying, managing and scaling virtual machines (VMs), removing features unrelated to VM management. This ensures organizations can maximize the value of OpenShift Virtualization while aligning with their specific infrastructure needs.While containerization may have shifted how virtual machines are used for certain applications, VMs remain a critical tool in IT infrastructure. However, with the virtualization market experiencing significant changes in recent years, many organizations face uncertainty and rising costs when it comes to managing their virtualization infrastructure..b284a514-74e3-4814-977d-399a0e82e3fa { fill: #e00; }Icon-Red_Hat-Media_and_documents-Quotemark_Open-B-Red-RGBEven as containers grow in adoption, virtualized infrastructure remains one of the backbones of modern computing for critical applications, driving a multibillion-dollar industry. With many organizations facing budget constraints, they are looking for streamlined options for managing virtual machines that reduce complexity and deliver scale, performance and security.Stephen Elliottgroup vice president, I&O, Cloud Operations, and DevOps, IDCRed Hat OpenShift Virtualization Engine delivers a cost-efficient virtualization-only solution for deploying, managing and scaling virtual machines.Redefined virtualization through a streamlined approachRed Hat OpenShift Virtualization Engine helps maximize the value of these investments by entitling only essential OpenShift features and components required for virtualization, delivering simplified operations and improved efficiency. Powered by Red Hat OpenShift Virtualization and the KVM hypervisor used across the enterprise datacenter and cloud, Red Hat OpenShift Virtualization Engine is able to run on on-premises hardware that supports Red Hat Enterprise Linux, and on supported bare metal cloud services including AWS bare metal instances. Red Hat OpenShift Virtualization Engine scales to meet workload demands while providing built-in security capabilities and more consistent performance across the hybrid cloud.To ease migration efforts, Red Hat OpenShift Virtualization Engine includes access to Red Hat’s intuitive migration tool - the migration toolkit for virtualization - that assists organizations in transitioning from other virtualization platforms, simplifying the migration workflow and helping to reduce downtime while driving greater operational continuity. Red Hat also offers a Virtualization Migration Assessment, an interactive workshop with Red Hat experts that will assess an organization’s business drivers, current state and the path to low risk VM migration. Additionally, Red Hat OpenShift Virtualization Engine integrates with Red Hat Ansible Automation Platform enabling IT teams to automate VM migrations at scale, along with day-to-day VM management tasks. With Red Hat Ansible Automation Platform, organizations can automate and orchestrate across their virtualized environments and other areas of IT for more efficient, resilient and consistent operations at scale.Additionally, the Red Hat partner ecosystem is well-positioned to support Red Hat OpenShift Virtualization Engine with capabilities like storage solutions, extensive backup and disaster recovery options and networking tools to streamline deployments and scale to modern IT needs.To unify virtual machine management at scale and limit sprawl, Red Hat is also introducing Red Hat Advanced Cluster Management for Virtualization. This new edition of Red Hat Advanced Cluster Management for Kubernetes provides focused access to Advanced Cluster Management’s existing features designed to centralize VM lifecycle management and streamline tasks such as VM provisioning, monitoring and day-to-day compliance, while maintaining greater consistency across an organization’s virtualized estate.AvailabilityRed Hat OpenShift Virtualization Engine and Red Hat Advanced Cluster Management for Virtualization are now available, more information on how to get started can be found here.Supporting QuotesMike Barrett, vice president and general manager, Hybrid Cloud Platforms, Red Hat“Virtualization solutions are in the bedrock of most private and public cloud environments. As organizations look to modernize their virtual environments to meet the demands of today’s IT climate, we have found that no two organizations are at the same point in their virtualization journey. This causes diversity in the approaches they want to take with the solutions Red Hat provides. Red Hat needed to change how we were offering our virtualization solution to accommodate organizations that wanted to use only the Red Hat OpenShift product features focused on virtualization. Red Hat OpenShift Virtualization Engine and Advanced Cluster Management for Virtualization allow Red Hat to significantly lower the price point of the solution to meet those users where they are in their modernization efforts.”Stephen Elliott, group vice president, I&O, Cloud Operations, and DevOps, IDC"Even as containers grow in adoption, virtualized infrastructure remains one of the backbones of modern computing for critical applications, driving a multibillion-dollar industry. With many organizations facing budget constraints, they are looking for streamlined options for managing virtual machines that reduce complexity and deliver scale, performance and security."Additional ResourcesLearn more about Red Hat OpenShift Virtualization EngineRead a blog post with more details about Red Hat OpenShift Virtualization EngineConnect with Red HatLearn more about Red HatGet more news in the Red Hat newsroomRead the Red Hat blogFollow Red Hat on TwitterJoin Red Hat on FacebookWatch Red Hat videos on YouTubeFollow Red Hat on LinkedIn In short Red Hat introduces Red Hat OpenShift Virtualization Engine, a new edition of Red Hat OpenShift that provides a dedicated way for organizations to access the proven virtualization functionality already available within Red Hat OpenShift. Mentioned in this article Red Hat OpenShift Virtualization Engine, Red Hat Advanced Cluster Management for Virtualization, Red Hat Ansible Automation Platform, Red Hat OpenShift Virtualization, Red Hat OpenShift For more information Learn more about Red Hat OpenShift Virtualization EngineRead a blog post with more details about Red Hat OpenShift Virtualization EngineContact Red Hat PRSubscribe to the feedABOUT RED HATRed Hat is the world’s leading provider of enterprise open source software solutions, using a community-powered approach to deliver reliable and high-performing Linux, hybrid cloud, container, and Kubernetes technologies. Red Hat helps customers integrate new and existing IT applications, develop cloud-native applications, standardize on our industry-leading operating system, and automate, secure, and manage complex environments. Award-winning support, training, and consulting services make Red Hat a trusted adviser to the Fortune 500. As a strategic partner to cloud providers, system integrators, application vendors, customers, and open source communities, Red Hat can help organizations prepare for the digital future.FORWARD-LOOKING STATEMENTSExcept for the historical information and discussions contained herein, statements contained in this press release may constitute forward-looking statements within the meaning of the Private Securities Litigation Reform Act of 1995. Forward-looking statements are based on the company’s current assumptions regarding future business and financial performance. These statements involve a number of risks, uncertainties and other factors that could cause actual results to differ materially. Any forward-looking statement in this press release speaks only as of the date on which it is made. Except as required by law, the company assumes no obligation to update or revise any forward-looking statements.###Red Hat, Red Hat Enterprise Linux, the Red Hat logo, JBoss, Ansible, Ceph, CloudForms, Gluster and OpenShift are trademarks or registered trademarks of Red Hat, Inc. or its subsidiaries in the U.S. and other countries. Linux® is the registered trademark of Linus Torvalds in the U.S. and other countries. The OpenStack Word Mark is either a registered trademark/service mark or trademark/service mark of the OpenStack Foundation, in the United States and other countries, and is used with the OpenStack Foundation's permission. Red Hat is not affiliated with, endorsed or sponsored by the OpenStack Foundation, or the OpenStack community.'''
