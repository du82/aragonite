["https://redhat.com/en/about/community-social-responsibility"]
title = "Red Hat | Community and Social Responsibility"
description = "Our deep commitment to the open source community extends beyond our technology and is key to our success. We do our best when we do good together."
full_description = "COMMUNITY AND SOCIAL RESPONSIBILITYOpen unlocks the world's potential Jump to section Jump to section Our deep commitment to the open source community is key to our success, and it extends beyond our technology. Through our collaborative open culture, Red Hatters connect with each other to support our local communities and the world at large. We do our best when we do good together. CORPORATE CITIZENSHIPStrengthening the communities where we live and workOur corporate citizenship efforts include donations to nonprofit organizations, gift matching, and global volunteer programs. We primarily focus our efforts in areas Red Hatters care about the most, including organizations that provide for basic human needs, STEM education in primary/secondary schools, higher education, environment and sustainability, and health.See our corporate citizenship initiatives Icon-Red_Hat-Money-A-Black-RGB We donated more than US$4.2 million to charitable and educational causes worldwide. Icon-Red_Hat-Diagrams-Community_People-A-Black-RGB We donated US$925,000 to 2,200+ nonprofits to match Red Hatters’ personal donations. Icon-Red_Hat-Objects-Beaker-A-Black-RGB Red Hatters contributed 4,000+ hours to open source science and education projects through our skills-based volunteering pilot, Red Hat Impact. PEOPLE AND CULTUREFostering innovation through an open organizationAt Red Hat, we have a unique culture rooted in open source principles. We collaborate and share ideas, create inclusive communities, and welcome diverse perspectives from all Red Hatters, no matter their role. We’re leaders in a movement larger than ourselves. We work to defend software freedom, connect people and ideas, and show the world the power of the open source way.Look inside our culture Icon-Red_Hat-Objects-Scales_Of_Justice-A-Black-RGB Red Hat closed the 1.8% global gender-pay equity gap. Icon-Red_Hat-Graduation_cap-A-Black-RGB Nearly 100 senior leaders took on a 10-month learning journey to examine and build the mindsets that foster inclusive behaviors and positive change. We embraced workplace flexibility, allowing associates to choose if they wanted to work from the office, from home, or in a hybrid environment. ENVIRONMENT AND SUSTAINABILITY Reducing environmental impact through sustainable practices With initiatives and associate engagement focused on reducing waste and power usage, recycling, and composting, we continue to think creatively to find new ways of bringing business and environmental responsibility together—whether working from home or in an office. Discover our sustainability efforts CHAMPIONS OF SOFTWARE FREEDOM Defending the open source ecosystem We’ve spent more than two decades collaborating on community projects—including protecting open source licenses—so we can continue to develop software that pushes the boundaries of technological ability. Learn about the software foundations and open source projects we support Icons-Red_Hat-Diagrams-Development_Model-A-Black-RGB Our Product Security team celebrated 20 years of providing our customers and the open source community with the guidance, stability, and security needed to confidently deploy enterprise solutions. Icon-Red_Hat-Instructor-A-Black-RGB We compiled and released years of our articles, blogs, and resources into a comprehensive whitepaper, An open approach to vulnerability management: Red Hat’s methodology. Icon-Red_Hat-Diagrams-Graph_Arrow_Up-A-Black-RGB Red Hat sponsored research to discover corporation and business leaders' rationale for contributing to open source projects. SOCIAL INNOVATION Empowering the nonprofit sector with open source technologies The Social Innovation Program uses open source for the greater good by leveraging Red Hatters' skills, Red Hat technologies, consulting, and training services to contribute to open source projects. By working with nonprofits and other sectors, we’re helping build shared open source solutions that are solving societal problems. Learn more about our social innovation initiatives Governance Red Hat’s culture is built on a strong foundation of ethics, transparency, and accountability to ensure we do business the right way. Our policies, processes, controls, and training are designed to foster an environment of trust both inside and outside of Red Hat in all communities in which we operate. Learn more about our governing policies Red Hat Research Red Hat Research fosters collaborative research efforts in key areas including AI/ML, security, cloud, hardware, the OS, and more. From large multi-partner collaborations to doctoral theses, we enable connections between Red Hat engineers, professors, researchers, and students to identify great research ideas and bring them into open source communities. Explore Red Hat Research See how we create better technology using open source Learn all about it Recruitment fraud alert Be wary of scammers posing as recruiters online, especially on social media. Learn more Read about India’s corporate and social responsibility activities Read about Spain’s corporate and social responsibility activities"
year_published = 2025
