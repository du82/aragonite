Anwendungsentwicklung und Automatisierung für die schnelle und kosteneffiziente Bereitstellung von IT-Services auf verschiedenen Infrastrukturen. Mehr als 90 % der U.S. Fortune 500-Unternehmen vertrauen auf Red Hat. Quelle: Red Hat® -Kundendaten und Fortune 500-Liste für 2024 Aufbau auf einer zuverlässigen Basis. Standortunabhängige Anwendungen. Red Hat Enterprise Linux Support für die Bereitstellung von Anwendungen – ob On-Premise, Cloud oder Edge – in einer flexiblen Betriebsumgebung. Zu den Produktdetails Verfügbar über Red Hat OpenShift Neue Anwendungen schnell und in großem Umfang entwickeln und bereitstellen. Bereits vorhandene Anwendungen modernisieren. Zu den Produktdetails Verfügbar über Red Hat Ansible Automation Platform Neue Version Automatisierung in Ihrem gesamten Unternehmen entwickeln, verwalten und dynamisch skalieren. Zu den Produktdetails Verfügbar über Alle Produkte anzeigen Vorgestelltes Produkt Red Hat OpenShift Virtualization Engine Eine kostengünstige Plattform, die die Virtualisierungsfunktionen von Red Hat OpenShift® für die Bereitstellung, Verwaltung und Skalierung virtueller Maschinen nutzt Zum Produkt Unternehmen, die dank Red Hat erfolgreich sind Zu den Success Stories unserer Kunden Open Source-Lösungen – optimiert für Unternehmen Wir sind davon überzeugt, dass ein Open Source-Entwicklungsmodell Technologien ermöglicht, die stabiler, sicherer und innovativer sind. In Zusammenarbeit mit Open Source Communities entwickeln wir Software, die neue Maßstäbe setzt. Warum wir auf Open Source setzen Technische Themen, die Ihre Aufmerksamkeit verdienen Alle Themen anzeigen KI Künstliche Intelligenz (KI) Künstliche Intelligenz (KI) bezieht sich auf Systeme, die Wissen erwerben und anwenden können und dann auf der Grundlage dieses Wissens ihr Verhalten anpassen. Weiterlesen ArtikelWas ist InstructLab? Was ist generative KI?Wie sehen die Basismodelle für KI aus?Was sind große Sprachmodelle (LLM)?Was ist Deep Learning?Was ist MLOps (Machine Learning Operations)?KI-InfrastrukturUse Cases für KI/MLWas ist maschinelles Lernde? Verwandte Blog-Beiträge durchsuchen Die Bank verkürzte die Überprüfungszeiten von Tagen auf Minuten mithilfe einer KI-basierten Lösung für Natural Language Processing. Mehr erfahren APIs APIs Mit APIs können Ihre Produkte und Services mit denen Dritter kommunizieren, ohne dass Sie jedes Mal eine neue Verbindungsinfrastruktur aufbauen müssen. Weiterlesen ArtikelWas ist eine API?Warum Red Hat für das API-Management?Was ist API-Design?Was ist API-Monetarisierung?Was ist API-Management?REST im Vergleich zu SOAPWas ist API-Sicherheit? Verwandte Blog-Beiträge durchsuchen Dank API-Management konnte Lufthansa Technik den Flugbetrieb optimieren. Mehr erfahren Automatisierung Automatisierung Automatisierung ist die Verwendung von Technologien, um Aufgaben ohne Unterstützung des Menschen durchzuführen. In der Technik findet man Automatisierung in IT-Systemen und Business Decision Software. Weiterlesen ArtikelWas ist IT-Automatisierung?Was ist Business-Automatisierung?Was ist Konfigurationsmanagement?Was ist Business Process Management? Verwandte Blog-Beiträge durchsuchen Die British Army konnte die Bereitstellung von Services durch ein automatisiertes Management beschleunigen. Mehr erfahren Cloud Cloud Computing Clouds sind IT-Umgebungen, in denen skalierbare Ressourcen in einem Netzwerk abstrahiert, in Pools zusammengefasst und verteilt werden. Weiterlesen ArtikelWas ist eine Private Cloud?Was ist eine Hybrid Cloud?Was ist eine Multi Cloud?Die wichtigsten Cloud-Modelle und Cloud-ServicesWarum Red Hat Technologien für die Cloud?Was ist Cloud Storage?Was ist eine Cloud-Infrastruktur?Was sind Cloud-Serviceanbieter? Verwandte Blog-Beiträge durchsuchen Die Fluggesellschaft konnte ihren Kundenservice durch die Implementierung einer modernen Hybrid Cloud erheblich verbessern. Mehr erfahren Cloud services Was sind Cloud Services? Bei Cloud Services handelt es sich um Infrastrukturen, Plattformen oder Software, die von einem Drittanbieter gehostet und Nutzenden über das Internet zur Verfügung gestellt werden. Weiterlesen ArtikelWas sind gemanagte IT-Services?Was ist Cloud Governance?Was ist ein Service Broker?Was ist ein Cloud Marketplace?Warum Linux® auf AWS ausführde?Warum Linux auf Google Cloud ausführde?Warum Linux auf IBM Cloud ausführde?Cloud-Services für die Finanzdienstleistungsbranche Verwandte Blog-Beiträge durchsuchen Das Softwareunternehmen konsolidierte seine Legacy-Basis auf einer einzigen Plattform mit Red Hat OpenShift Service on AWS. Mehr erfahren Container Linux-Container Mithilfe von Containern können Anwendungen zusammen mit der gesamten Laufzeitumgebung paketiert und isoliert werden, sodass containerisierte Apps leichter zwischen den Umgebungen verschoben werden können. Weiterlesen ArtikelWas ist ein Linux-Container?Warum Red Hat für Container?Was ist Docker?Was ist Kubernetes?Was ist Container-Sicherheit? Verwandte Blog-Beiträge durchsuchen Dieser Anbieter von Mitarbeiter-Unfallversicherungen konnte seinen Umsatz dank der Einführung von Containern und einer reaktionsfähigen Cloud-Umgebung um 40 % steigern. Mehr erfahren DevOps DevOps Das DevOps-Konzept umfasst die Aspekte Unternehmenskultur, Automatisierung und Plattformdesign und hat das Ziel, den geschäftlichen Mehrwert und die Reaktionsfähigkeit durch eine schnelle Bereitstellung von Services zu steigern. Weiterlesen ArtikelWas ist DevSecOps?Was ist CI/CD? Verwandte Blog-Beiträge durchsuchen BP hat eine Container-Plattform mit DevOps kombiniert, um Services noch schneller bereitstellen zu können. Mehr erfahren Edge computing Edge Computing Edge Computing stellt den Nutzenden Rechenressourcen direkt an oder in der Nähe von Datenquellen zur Verfügung, also außerhalb von traditionellen, zentralisierten Rechenzentren oder Clouds. Weiterlesen ArtikelWas ist Edge Computing?Cloud vs. Edge: Definitionen und UnterschiedeWas ist Multi-Access Edge Computing (MEC)?Warum Red Hat für Edge Computing?Was ist Edge-Architektur?Edge Computing in der TelekommunikationWas ist der Unterschied zwischen VNF und CNF?Was ist 5G? Verwandte Blog-Beiträge durchsuchen Der Telekommunikationsanbieter hat einen eigenständigen 5G-Core geschaffen, um eine stabile Verbindung zu ermöglichen und Edge Computing-Lösungen anzubieten. Mehr erfahren Integration Unternehmensintegration Unternehmensintegration hat sich von einem zentralisierten Modell mit ESB (Enterprise Service Bus) zu einer verteilten Architektur mit vielen wiederverwendbaren Endpunkten gewandelt. Weiterlesen ArtikelWas ist Integration?Was ist Apache Kafka?Warum Red Hat für eine agile Integration?REST im Vergleich zu SOAP Verwandte Blog-Beiträge durchsuchen Durch die Integration von Apps und Daten in eine Private Cloud konnte die Bank innovative Services anbieten. Mehr erfahren Linux Linux Linux® bietet eine stabile Basis für IT-Workloads und -Implementierungen, unabhängig davon, ob traditioneller oder innovativer Natur, von Bare Metal über virtuelle und Cloud-Umgebungen bis hin zu Containern. Weiterlesen ArtikelWas ist Linux?Was ist der Linux-Kernel?Welche Linux-Distribution ist am besten für Sie geeignet?Warum Red Hat für Linux?Was versteht man unter IT-Infrastruktur?Was ist SELinux? Verwandte Blog-Beiträge durchsuchen Elo konnte die Markteinführungszeiten durch eine agile On-Demand-Infrastruktur auf Basis von Red Hat Enterprise Linux deutlich verkürzen. Mehr erfahren Microservices Microservices Microservices stehen für eine Architektur und ein Softwarekonzept, bei dem Anwendungen in ihre kleinsten Komponenten zerlegt werden, die voneinander unabhängig sind. Weiterlesen ArtikelWas sind Microservices?Warum Red Hat für Microservices?Was ist ein Service Mesh?Was ist Serverless? Verwandte Blog-Beiträge durchsuchen Diese Bank konnte ihre IT-Umgebung mithilfe von Microservices modernisieren. Mehr erfahren Middleware Middleware Unter Middleware versteht man jede Art von Software zwischen dem Kernel und den Benutzeranwendungen, die Services für Anwendungen außerhalb dessen bereitstellt, was das Betriebssystem bietet. Weiterlesen ArtikelWas ist Middleware?Warum Red Hat bei Middleware?Was ist eine IDE? Verwandte Blog-Beiträge durchsuchen Mithilfe von Middleware kann der niederländische Flughafen seinen Kunden reibungslose Flugreisen ermöglichen. Mehr erfahren Sicherheit IT-Sicherheit Die IT-Sicherheit soll die Integrität der Informationstechnologien (also Computersysteme, Netzwerke und Daten) vor Angriffen, Beschädigungen oder unerlaubten Zugriffen schützen. Weiterlesen ArtikelDas Sicherheitskonzept von Red Hat für die Hybrid CloudWas ist Sicherheit in der Hybrid Cloud?Was ist Container-Sicherheit?Was ist API-Sicherheit?Was ist DevSecOps?Was ist Malware?Was bedeutet CVE? Verwandte Blog-Beiträge durchsuchen Die Behörde hat ein Ökosystem für die gemeinsame Nutzung von Daten geschaffen, das die Sicherheits- und Compliance-Anforderungen einhält. Mehr erfahren Virtualisierung Virtualisierung Mithilfe von Virtualisierung kann ein physischer Rechner als mehrere Maschinen agieren und die Kosten für mehrere Server und Workstations einsparen. Weiterlesen ArtikelWas ist Virtualisierung?Was ist Virtualisierungsmanagement?Was ist KVM?Warum Sie Ihre virtuelle Infrastruktur zu Red Hat migrieren solltenKVM im Vergleich zu VMwareCloud im Vergleich zu VirtualisierungWas ist NFV?Was ist eine virtuelle Maschine (VM)? Verwandte Blog-Beiträge durchsuchen Dieser Gesundheitsversorger konnte dank Virtualisierung die Bereitstellungszeiten von Wochen auf Stunden verkürzen. Mehr erfahren See all topics Willkommen, [Name] Zugang zu Ihren Testversionen, Support-Tickets, Empfehlungen für Training und Zertifizierung und mehr erhalten Sie in Ihrem Red Hat Dashboard. Weiter zum Dashboard Mehr von Red Hat Melden Sie sich an oder erstellen Sie ein Red Hat® Konto, um Produkte zu testen und Zugang zu Trainingskursen, Support und vielem mehr zu erhalten. Einige Services können eine Subskription erfordern. Anmeldung oder Registrierung'''
