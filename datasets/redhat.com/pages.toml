["https://redhat.com/en/about/digital-accessibility"]
title = "Red Hat | Digital Accessibility Statement"
description = "At Red Hat, we believe that an open source approach leads to better, more inclusive experiences for all people, including users with disabilities."
full_description = "Red Hat digital accessibility statementMaking Red Hat accessible Jump to section Jump to section At Red Hat, we believe that an open source approach leads to better, more inclusive experiences for all people, including users with disabilities. The user experience across Red Hat® properties, including our products, services, applications, and digital communications, are all held to a high standard of inclusivity. We strive to make them accessible for as many users and devices as possible. .b284a514-74e3-4814-977d-399a0e82e3fa { fill: #e00; }Icon-Red_Hat-Media_and_documents-Quotemark_Open-B-Red-RGB The power of the web is in its universality. Access by everyone regardless of disability is an essential aspect. Tim Berners-Lee Computer scientist and inventor of the World Wide Web Our goal Red Hat endeavors to materially comply with the Level AA Success Criteria of the Web Content Accessibility Guidelines 2.1 WCAG 2.1 AA. We recommend using the most up-to-date version of any assistive technology and web browser products, either the current major release or the prior release. This will help ensure that we can deliver dynamic, full-featured web content that is as compatible as possible with the latest assistive technology. VPATs and Red Hat products Voluntary Product Accessibility Templates (VPATs) for certain Red Hat products can be found in the Government Standards section of our Customer Portal. Making accessibility a key factor in development helps to drive our success, and we continue to stay informed so our efforts to improve accessibility across our software offerings remain relevant and effective. Browser support We also are committed to minimizing browser compatibility issues by following best practices, which include supporting recent versions of major browsers. PatternFly and PatternFly Elements We developed PatternFly, our open source user interface (UI) pattern library, to help our community of developers build better, more consistent, more accessible web experiences for many of our Red Hat web properties. These components are manually and automatically tested to meet WCAG 2.1 Level AA standards. For more information, visit PatternFly 4’s accessibility guide. We welcome your assistance in improving PatternFly through contributing code, filing issues, addressing bugs, and suggesting improvements. To learn more about how to participate in our community project, read our community guidelines. We want your feedbackTo report accessibility issues with our products, submit a support ticket on the Customer Portal."
year_published = 2025
