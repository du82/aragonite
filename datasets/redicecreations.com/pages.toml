["https://redicecreations.com/about"]
title = "About Red Ice"
full_description = "Red Ice Red Ice delivers videos, TV Show, online radio programs and news, including Red Ice Radio and Radio 3Fourteen. Founded by Henrik Palmgren in 2003, Red Ice reaches tens of thousands of people every month seeking an alternative to the mainstream, covering politics, entertainment and current events from a pro-European perspective. What you read in the mainstream media about us is not true. They lie about who we are and what we stand for. Tune in for yourself and you will find out. Our YouTube channel was banned October 17, 2019, without any forewarning or reason stated (find our archived YouTube channel on AltCensored.com). We had over 333K subscribers and we were getting roughly a million views monthly on YouTube alone. But fret not, we are on a number of other platforms, subscribe/follow us on Rumble, X (Twitter), BitChute, Odysee, VK, Telegram, Instagram. We have also been banned from Apple's podcast directory, SoundCloud, Stitcher, TuneIn + many other places. Why? Because we are right and they fear our pro-European/Pro-White message. We speak the truth and we are effective. We are a truly independent media outlet that cover topics you won't hear anywhere else. We are supported by our members. Red Ice remains commercial and ad free. We are based in Sweden and North America. If you want to support us you can sign up for a membership or join us on SubscribeStar or Locals. Are you new to Red Ice? Start here. Red Ice Interviews Headquartered in Sweden and North America, Red Ice Radio is a radio show hosted by Henrik Palmgren, predominately focusing on pro-European issues. Henrik interviews authors, researchers and commentators. The second part of the show is available to members. The show is independent, commercial free and supported by members, available on demand directly from redice.tv. Red Ice Interviews are both available in video format in the TV section and an audio only / podcast version for download in the Red Ice Radio section on the website. How do I listen?You can stream or download our shows directly from our website or subscribe to the RSS feed. Also listen at:BitChute, Odysee, VK, Rumble, Twitter/Periscope, YouTube (Banned us in October 2019 but you can find an archived version of our YouTube channel on AltCensored.com). You can also listen using iTunes, at Spreaker or connect our RSS feeds to your favorite podcast app. The Name Red Ice represents opposites: hot and cold, red and blue, north and south. The Norse creation myth of the void, Ginnungagap, tells how everything in the world came into existence in the gap between fire and ice (Red Ice). Red represents heat, urgency, danger and short-term. Ice represents cold, patience, stability, and long-term. Creation takes place in the zone between these two powerful forces. A perfect balance between these two extremes creates the conditions for life and consequently it's in this environment that we can thrive. The explosive power of the sun and the coldness of space creates the balance. We wouldn't exist if one overpowered the other. Radio 3Fourteen Established in 2012, Radio 3Fourteen is a talk radio program hosted by Lana, heavily focusing on European identity and culture. Lana speaks with various bloggers, authors and social commentators for one hour every other week. The show is commercial free, supported by listeners and is available on demand as part of the Red Ice network on Redice.tv. Red Ice members have access to a filmed version of selected interviews. How do I listen?You can stream or download our shows directly from our website or subscribe to the RSS feed. Also listen at:BitChute, Odysee, VK, Rumble, X (Twitter), YouTube (Banned us in October 2019 but you can find an archived version of our YouTube channel on AltCensored.com). You can also listen using iTunes, at Spreaker or connect our RSS feeds to your favorite podcast app. The Name Lana was born on March 14 (Pi Day 3/14), hence the name Radio 3Fourteen. Celebrated on 3/14 around the world, Pi (Greek letter “π”) is the symbol used in mathematics to represent a constant, the ratio of the circumference of a circle to its diameter, which is approximately 3.14159. Pi has been calculated to over one trillion digits beyond its decimal point. As an irrational and transcendental number, it will continue infinitely without repetition or pattern. Red Ice TV Tune in live to Flashback Friday every Friday at 5 pm EST / 23:00 Central European time. Join Henrik & Lana along with occasional special guests as they discuss the most important news of the week and give you an update on the culture war, politics, entertainment and more. No-Go Zone is live on Wednesdays at 5pm EST / 23:00 Central European time. We also do some of our interviews live and other special streams. Watch all of it at redice.tv/live, Rumble, Odysee, X (Twitter), Kick, Dlive (we will move to Trovo since Dlive demonetized the majority of their political streamers in January 2021). Weekend Warrior is a popular TV show recorded on the weekends, exclusively for Red Ice Members. Well produced and with a lot of different relevant segments, there is nothing like it on the dissident right. Join Henrik & Lana as they discuss breaking news, recent events, politics, culture and entertainment. If you're not a member, sign up to watch all of our shows and get access to uncensored and exclusive content. Select excerpts are made available on our YouTube channel (banned October 17, 2019) on our BitChute channel and in the TV section on this site. You can also find our videos and shows on Odysee, VK, Rumble, Twitter/Periscope. For all our other live streams, keep an eye on redice.tv/live to see what's upcoming. Live Streams Watch all our live streams at redice.tv/live, Rumble, Odysee, Entropy, X (Twitter), Kick, Dlive. Who We Are Henrik Henrik Palmgren was born in Götaland, Sweden, the land of the Goths. He founded Red Ice in 2003. Henrik is most known as the host of Red Ice TV and produces all the video content on Red Ice, including most of the graphics and animations. He is also the host of No-Go Zone and the co-host of Flashback Friday, and Western Warrior. Henrik is most concerned with the survival of the European people and exposing those who are destroying our civilization. Folk First! Lana Lana was born of Russian American ancestry. She is the host of Radio 3Fourteen and contributes with interviews and video commentary. Additionally, she is the co-host of Flashback Friday and Western Warrior. Lana also owns her own organic clothing line called Lana's Llama. She is passionate about European identity politics, ancestral traditions and health. Support Are you a member? Go to redicemembers.com and click on Contact to receive support. How to Listen Download You can download each radio show from the specific radio show page. Download buttons are found on the right side or below the player. Hour two of Red Ice Radio is available for members. Stream A player is available on each radio show page. RSS If you would like to subscribe to our radio programs using iTunes, a podcatcher or a podcast app, we have RSS feeds available. Why Can't I Listen to Older Shows? Shows prior to 2012 require a membership. Need to Contact Us? redice (at) protonmail (dot) com Copyright Notice We’re happy for you to share, upload and redistribute our public content available on redice.tv. However, please respect our efforts and help us continue by not redistributing our members' content to the public. Thanks for understanding. Support our work The best way to support us is to sign up for a membership at redicemembers.com. You'll get full access to our extensive archives. Stream or download over 1900 programs, including radio shows, videos, TV segments & our exclusive show Weekend Warrior. You get access to exclusive videos + all new videos are made available to members first. ❤️ You can also show us some love by donating and helping us to grow ⚡️ ⭐️ DONATE: Donorbox: donorbox.org/redice