d to a Bloom filter and detected as unique (items that caused at least one bit to be set in at least one sub-filter) (since RedisBloom 2.4.4) Required arguments key is key name for a Bloom filter. Return value Returns one of these replies: Integer reply - the number of items that were added to this Bloom filter and detected as unique (items that caused at least one bit to be set in at least one sub-filter), or 0 when key does not exist. [] on error (invalid arguments, wrong key type, etc.) Note: when key exists - return the same value as BF.INFO key ITEMS. Examples redis> BF.ADD bf1 item_foo (integer) 1 redis> BF.CARD bf1 (integer) 1 redis> BF.CARD bf_new (integer) 0 RATE THIS PAGE ★ ★ ★ ★ ★ Back to top ↑ Submit document.addEventListener("DOMContentLoaded", function() { const form = document.querySelector("#page-feedback"); form.addEventListener("submit", function(event) { event.preventDefault(); var xhr = new XMLHttpRequest(); var url = "\/docusight\/api\/rate"; var params = new URLSearchParams(new FormData(form)); xhr.open("POST", url, true); xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded"); xhr.onreadystatechange = function() { if (xhr.readyState === 4 && xhr.status === 200) { const responseData = JSON.parse(xhr.responseText); const responseMessage = responseData.response; const newText = document.createTextNode(responseMessage); form.parentNode.replaceChild(newText, form); } }; xhr.send(params); }); }); Edit this page Create an issue See also BF.ADD BF.CARD BF.EXISTS BF.INFO BF.INSERT BF.LOADCHUNK BF.MADD BF.MEXISTS BF.RESERVE BF.SCANDUMP'''
