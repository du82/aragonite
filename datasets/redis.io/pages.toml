["https://redis.io/blog/whats-new-in-two-december-edition"]
title = "What’s new in two - December edition - Redis"
description = "Redis releases you might have missed in the past month. We’re covering the latest developments from December"
full_description = "Welcome to “What’s new in two,” your quick hit of Redis releases you might have missed in the past month. We’re covering the latest developments from December, expanding on what I covered in our latest video—press play above if you’re more of a watcher than a reader. Let’s get started. The creator of Redis, Salvatore Sanfilippo, is back at Redis Inc. as of December 10. There’s a lot in his recent blog post about what he’s been up to, why he’s coming back, his opinion on the license change, AI trends, and more. I particularly enjoyed reading about the connecting points between the early days of Redis and the license change. Read his blog post here. Good news for our Cloud users—Redis 7.4 is now generally available in our Pro tier subscription, which also includes support for Active-Active, the ability to geo-replicate data in real-time across globally distributed regions. Here’s another update for our Cloud Pro users—support for Private Service Connect (PSC) is now supported for Active Active plans deployed to Google Cloud. The Cloud API now supports ad-hoc backups. This not only lets you programmatically trigger backups rather than depending on scheduled jobs, but also define custom backup destinations like incorporating a timestamp. Redis Cloud users can now run the API with reduced permissions by creating an API key for users with the “Viewer” or the newly introduced “Logs Viewer” roles. This makes it easier to meet security and compliance needs. Log Viewers can only use the Redis Cloud API and GET /logs endpoint. That wraps up this month’s “What’s new in two.” We’ve covered the latest Redis features and improvements from December. Whether you prefer watching or reading, catch more valuable updates in my next two-minute episode. And if you missed last month’s update, two minutes is all you need to catch up. Happy Holidays and we’ll see you in the New Year."
author = "donna.bentley@redis.com"
year_published = 2025
year_updated = 2025
