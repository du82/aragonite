["https://redis.io/blog/whats-new-in-two-october-edition"]
title = "What’s new in two - October edition - Redis"
description = "Great updates coming to Redis Insight. New buttons for Redis Data Integration (RDI) are now available, including ‘Reset Pipeline’ and ‘Start / Stop Pipeline’."
full_description = "Welcome to “What’s new in two,” the place to catch up on Redis releases you might have missed in the past month. Before we get started this month, I wanted to take a moment to celebrate our 12th edition. We’ve been putting together this monthly update now for a year and are grateful to everyone who’s helped put this update together, and to you for following along. We’re covering the latest developments from October, expanding on what I covered in our latest video—press play above if you prefer to watch a recap of this month’s updates. Let’s get started. New buttons for Redis Data Integration (RDI) are now available, including ‘Reset Pipeline’ and ‘Start / Stop Pipeline’. These buttons let you do a full sync reset, or stop and start your data pipeline again, without needing to switch over to the CLI. The latest Redis Insight update now lets you add multiple elements to list data types at once. Before this update, developers had to add elements one at a time using commands like RPUSH, LPUSH, or LINSERT, so this is a welcomed enhancement. The last update for Redis Insight is a cool one and one that I know will save us a lot of time developing with Redis! Redis Query Engine is getting syntax auto-completion with index names, fields, etc. in the workbench for Redis Insight. So now, along with auto-complete for Redis commands, like FT.CREATE and its associated parameters, you can also access existing indexes and fields. This is going to be huge for writing new queries for full-text, semantic, and vector search. Next, a new update for Redis Data Integration 1.4 brings support for helm charts for our Kubernetes customers, so if that’s you, make sure you download the latest version of RDI 1.4. Redis Cloud users, we’ve got an update for you! The cloud API now supports a new “viewer” role. Before this, the cloud API ran as an owner role, which added some governance challenges. This new role will be a useful addition, and more roles are coming to the cloud API soon."
author = "donna.bentley@redis.com"
