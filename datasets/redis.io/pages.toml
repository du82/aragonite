["https://redis.io/customers/ulta-beauty"]
title = "Redis Enterprise on Google Cloud Enables Ulta Beauty to Build a “Digital Store of the Future” - Redis"
description = "Ulta Beauty migrated to Redis Enterprise on Google Cloud to manage its rapid growth and to create a new digital presence powering cohesive customer experiences."
full_description = "Ulta Beauty, Inc. is the largest U.S. beauty retailer and the premier destination for cosmetics, fragrance, skincare products, hair care products, and salons. Today, Ulta Beauty operates more than 1,450 retail stores across the country and maintains a popular e-commerce website, which includes a collection of beauty tips, tutorials, and social content. Rapid online growth during COVID-19 motivated Ulta Beauty to renovate its e-commerce presence and adopt a more nimble, efficient cloud-based architecture. The company sought to deploy a more versatile, scalable, and powerful in-memory database within a microservices architecture that offered strong caching support. Ulta Beauty migrated to Redis Enterprise on Google Cloud to manage its rapid growth and to create a new digital presence powering cohesive customer experiences, both online and in its retail stores. Redis Cloud handles application layer caching via an in-memory database that requires zero storage. Redis reduced development efforts, simplified integration with third party technologies, and anchored a curbside pickup service that kept inventory moving during COVID-19. The Redis support team ensured a seamless migration from open source Redis to Redis Cloud. This new environment has allowed Ulta to automate development tasks that formerly consumed lots of cycles for Ulta Beauty’s innovation team, including designing a “digital store of the future” and refreshing the Ulta website with new personalization tools for shoppers. Today’s shoppers expect great digital experiences. We want to bring the physical and digital stores together — to make shopping even more seamless for our guests. Redis technology powers many of our features and we leverage it heavily in our omnichannel strategy as well as the new eCommerce platform we’re building. The retail world experienced a major shakeup in recent years, with momentous changes in operating models and shopper preferences, partly motivated by the reaction to COVID-19, as consumers embraced online shopping. Ulta Beauty’s CEO Dave Kimbell called 2020 an “incredibly disruptive year” noting “permanent shifts in consumer behavior.” However, at a time when e-commerce, consumer packaged goods, and supply chains saw tremendous upheaval, Ulta Beauty thrived, growing its 2021 revenue by about 40%."
