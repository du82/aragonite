["https://redis.io/json"]
title = "RedisJSON | NoSQL Document Database"
description = "A high-performance NoSQL document store for modern apps that supports indexing, querying, and full-text search on JSON documents both on-premises & in the cloud."
full_description = "Indexing, Querying, and Full-Text Search of JSON Documents with Redis Related Resource: Click to download RedisJSON module. RedisJSON and RediSearch are by far the most popular Redis modules in our cloud. (See Fig. 1) The docker images of… Learn more JSON is a high-performance NoSQL document store that allows devs to build modern apps. It provides native APIs to ingest, index, query, and run full-text search on JSON documents both on-prem and as a managed service in the cloud. Built with performance in mindusing in-memory data structures implemented in C, RediSearch supports fast indexing and ingestion. “At HackerRank we use Redis Pub/Sub as a pipeline to help all developers practicing on HackerRank to see the results of their code submission in near real-time. We use JSON heavily in this pipeline to detect the status of all submissions and inform our users so they can better compete in our programming challenges. This has worked very well for us for several years without any issues at an extremely large scale to meet our need to process thousands of code submissions per minute.” Store and process scheme-free JSON in-memory, supporting millions of operations per second with sub-millisecond response times. Allows atomic operations on JSON sub-elements in-memory. JSON allows you to quickly create indexes on JSON documents, and uses real-time indexing that allows you to instantly query documents that have been indexed. The indexes let you query your data at lightning speed, perform complex aggregations, and filter by properties, numeric ranges, and geographical distance. JSON supports full-text indexing and stemming-based query expansion in multiple languages. It provides a rich query language that can perform text searches, as well as complex structured queries. Furthermore, you can enrich search experiences by implementing auto-complete suggestions using ‘fuzzy’ searches. JSON’s Enterprise and Enterprise Cloud offering lets you effortlessly scale RedisJSON across an entire cluster, allowing you to grow your indexes to billions of documents on hundreds of servers."
