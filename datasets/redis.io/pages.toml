["https://redis.io/docs/latest/operate/rc/rc-quickstart"]
title = "Redis Cloud quick start | Docs"
description = """
If you're new to Redis Cloud, this quick start helps you get up and running.
You'll learn how to:
Create an account and a free database
Connect to your database
If you already have an account, see Create an Essentials database to create a Free 30 MB Essentials database. Free plans are a type of Essentials plans; this provides an easy upgrade path when you need it.
If you already have a database, see Manage databases."""
full_description = '''Develop with Redis Libraries and tools Redis products Redis Cloud Quick start Databases Subscriptions Logs & reports Accounts & settings Billing & payments Marketplace integrations Security REST API Develop highly available apps Redis Community Edition compatibility Supported regions Changelog Redis Software latest ▼ ▲ latest v7.4 Redis for Kubernetes latest ▼ ▲ latest v7.4.6 Redis Community Edition and Stack Redis Insight Commands document.addEventListener("DOMContentLoaded", function() { const sidebar = document.getElementById('sidebar'); const footer = document.querySelector('footer'); window.addEventListener('scroll', function() { const scrolledHeight = window.scrollY + window.innerHeight; if (scrolledHeight >= footer.offsetTop) { sidebar.style.maxHeight = `calc(100vh - 7rem - ${scrolledHeight - footer.offsetTop}px)`; } else { sidebar.style.maxHeight = 'calc(100vh - 7rem)'; } }); }) Docs Docs → Redis products → Redis Cloud → Redis Cloud quick start Redis Cloud quick start Redis Cloud If you're new to Redis Cloud, this quick start helps you get up and running. You'll learn how to: Create an account and a free database Connect to your database If you already have an account, see Create an Essentials database to create a Free 30 MB Essentials database. Free plans are a type of Essentials plans; this provides an easy upgrade path when you need it. If you already have a database, see Manage databases. Create an account To create a new account with a free database: Go to the Sign up page. There are two options available to get started with Redis Cloud: Enter your information in the form and select Get Started. Sign up with Google or Github. After you enter your information, you should receive an activation email from Redis. Select Activate account to go to the Get Started page in the Redis Cloud console. Choose your role from the Role drop-down. Choose your company size from the myself/company drop-down. If you are working on a personal project, select myself. Select your Redis use case from the use case drop-down. Choose your client language from the client drop-down. Click Create Free Database to move on. Select your preferred cloud vendor and region. Select Let's start free to create your database. Note: If you would rather customize your database, select Create a custom database to go to the New database page. From there, you can Create a database. The Database list appears with your new database in the list. Select the database name to view the Configuration tab for your new database. In the upper corner, an icon shows the current status of the database. If the icon shows an orange clock, this means your database is still being created and its status is pending. Once the database has been created, it becomes active and the status indicator switches to a green circle containing a checkmark. Redis Cloud console operations are asynchronous; they operate in the background. You can continue to use the Redis Cloud console for other tasks, but pending resources aren't available until they're active. When your new database becomes active, you're ready to connect to it. Connect to a database At this point, you're viewing the Configuration details for your new database. Go to the Security section of the page. To connect to your database, you need your username and password. Each database is protected by a Default user called default and a masked Default user password. Select the eye icon to show or hide the password. Once you have the username and password, select Connect to open the connection wizard. The connection wizard provides the following database connection methods: Redis Insight redis-cli utility Redis client for your preferred programming language Redis Insight Redis Insight is a free Redis GUI that is available for macOS, Windows, and Linux. In the connection wizard, under Redis Insight, select Download to download Redis Insight. Install Redis Insight. Once installed, select Open with Redis Insight. A pop-up asks if you wish to open the link with Redis Insight. Select Open Redis Insight to connect to your database with Redis Insight. See the Redis Insight docs for more info. Redis client A Redis client is a software library or tool that enables applications to interact with a Redis server. Each client has its own syntax and installation process. For help with a specific client, see the client's documentation. The connection wizard provides code snippets to connect to your database with the following programming languages: .NET using NRedisStack node.js using node-redis Python using redis-py Java using Jedis and Lettuce Go using go-redis PHP using Predis See Clients to learn how to connect with the official Redis clients. redis-cli The redis-cli utility is installed when you install Redis. It provides a command-line interface that lets you work with your database using core Redis commands. To run redis-cli, install Redis Stack on your machine. See Redis CLI to learn how to use redis-cli. More info Connect your application Import data Manage databases Data persistence Secure your Redis Cloud database Back-up databases Monitor Redis Cloud performance Continue learning with Redis University See the Get started with Redis Cloud learning path for courses. RATE THIS PAGE ★ ★ ★ ★ ★ Back to top ↑ Submit document.addEventListener("DOMContentLoaded", function() { const form = document.querySelector("#page-feedback"); form.addEventListener("submit", function(event) { event.preventDefault(); var xhr = new XMLHttpRequest(); var url = "\/docusight\/api\/rate"; var params = new URLSearchParams(new FormData(form)); xhr.open("POST", url, true); xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded"); xhr.onreadystatechange = function() { if (xhr.readyState === 4 && xhr.status === 200) { const responseData = JSON.parse(xhr.responseText); const responseMessage = responseData.response; const newText = document.createTextNode(responseMessage); form.parentNode.replaceChild(newText, form); } }; xhr.send(params); }); }); Edit this page Create an issue On this page Create an account Connect to a database Redis Insight Redis client redis-cli More info Continue learning with Redis University window.onload = function(){ var currentUrl = window.location.href const regex_kubernetes = new RegExp('/docs/(latest|staging\/.+)/operate/kubernetes/.*') const regex_rs = new RegExp('/docs/(latest|staging\/.+)/operate/rs/.*') if (regex_kubernetes.test(currentUrl)){ document.getElementById( 'versionSelectorKubernetes' ).style.display = ''; } else if (regex_rs.test(currentUrl)) { document.getElementById( 'versionSelectorRs' ).style.display = ''; } } function _setSelectedVersion(product, ver) { if (ver) { var i = document.getElementById(product + '-version-select-' + ver); if (i) { i.classList.toggle('selected-version'); } } } function _getVersion(product) { return document.getElementById("versionSelector" + product + "Value").innerText } function _openVersionSelector(product) { var productLowercase = product.toLowerCase() document.getElementById("versionSelector" + product).classList.toggle('open'); var currentVersion = _getVersion(product) if (currentVersion != "latest") { currentVersion = currentVersion.substring(1) } var currentUrl = window.location.href var versionsDropdown = document.getElementById("versionDropdown" + product).children var versionsDropdownLength = versionsDropdown.length const regex = new RegExp(String.raw`^.+\/operate\/${productLowercase}`,"g"); const versionRegex = /^(\/\d+\.\d+(?:\.\d+)?(?:\-\d+)?)?/g; for (var i= 0; i < versionsDropdownLength; i ++) { if (versionsDropdown[i].innerText == "latest") { url_start = versionsDropdown[i].href.match(regex) url_end = currentUrl.replace(regex,"").replace(versionRegex,"") versionsDropdown[i].href = url_start + url_end } else { var versionDropdown = versionsDropdown[i].innerText.substring(1) url_start = versionsDropdown[i].href.match(regex) url_end = currentUrl.replace(regex,"").rep