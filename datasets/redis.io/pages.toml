["https://redis.io/customers/axis-bank"]
title = "Axis Bank"
description = "Axis Bank’s mobile app revamp skyrockets UX satisfaction"
full_description = "Axis Bank’s mobile app was supposed to let users see all of their latest account info, including the changes in the products they use and people they authorize to access their account. But when customers were making these changes offline at the branch, they weren’t being reflected in the app—which had an infrastructure based on an outstanding traditional database at the time. As expected, this lack of reliable, real-time data led to customer complaints and dissatisfaction in UX. To fix this, Axis Bank created a new solution, known as Runtime Account Authorization. This innovative approach uses the capabilities of Redis, a real-time data platform, to deliver fast account visibility to more than six million daily users. By using Redis Axis’ mobile app can provide seamless, current information on customer relationships, accounts, and in-branch transactions. This slashes their response times, completely removes the need for manual intervention, and makes sure customers have access to accurate and timely account information. Axis used the Core Banking Table Replication feature to replicate the core banking tables to the local traditional database using Golden Gate Syncing. This is how they made sure the mobile banking channel had access to the most up-to-date customer relationship and product info. Then, they developed an innovative capability that uses Redis as a fast database for their mobile banking app to read from. But they still needed a simple way to sync the data from the previous database. With RDI, Axis was able to simply ingest relevant records into Redis without complex code or expensive ETL tools. RDI continuously monitors the source tables for any changes and captures the changed data records immediately. These records are then processed using RDI, where filter conditions are applied to reject unwanted change records. Only the accepted records are ingested in near real-time and transformed into the appropriate hash schema in the target Redis DB. To make sure customer service was seamless, Axis used RDI to implement a high availability failover mechanism using primary-replica nodes, managed by Pacemaker. So even in the event of a node failure, the mobile banking channel is accessible and operational."
