["https://redis.io/blog/migrate-from-elasticache-to-redis-enterprise"]
title = "3 Ways to Migrate From ElastiCache to Redis Cloud | Redis Enterprise"
description = "Migrating your data from AWS ElastiCache to Redis Enterprise Cloud? Consult this flow chart to identify the best migration methodology for your needs."
full_description = "There are lots of choices when you migrate data from one platform to another. Fortunately, the issues are so well-understood that they are suited for a simple flow chart. Data migration is an important, meaningful project, even if it isn’t one that brings practitioners a lot of glory. That is all the more reason to do it efficiently. There are three main migration paths for moving from ElasticCache into Redis. This flowchart helps you match your current environment to the appropriate process, with cautions to protect your data and make the migration a success. The primary decision point is whether you can tolerate a flush of all your Redis data. If you can, there’s no need to migrate the data at all. “Rip and Replace” is easy, but a flush results in slow performance while data is rehydrated. If you use Redis as more than a cache–for instance, you employ Redis as a session store–you can’t stomach the lost data and poor performance of a full data flush. We don’t blame you. All data is important. That’s why we offer a durable persistence option. The next question is whether you can tolerate downtime. How much downtime are we talking about? It could be as short as a few minutes. It depends on how long it takes to export and import your Redis data. If a short amount of downtime seems tolerable, It might be worthwhile to do a few experiments in your test environment to get a more accurate estimate of downtime. Be careful of memory usage as it is a common issue with ElastiCache deployments. If the estimated downtime is acceptable, we recommend offline data migration. This option is easy to accomplish but it results in downtime as data is exported from ElastiCache and imported into Redis Cloud. There’s one more option. Live data migration can be executed without any downtime or lost data. However, it is more operationally complicated (a polite way of saying, “You may do a lot of cursing”), and you should think through the tradeoffs. This option relies on an external tool developed by our in-house Redis experts called RIOT. Its documentation details operational guidance in migrating from ElastiCache to Redis Enterprise. If you’re choosing this option, you may be grateful for the opportunity to contact one of our experts for guidance."
author = "James Tessier"
year_published = 2023
year_updated = 2023
