title = "Introducing Azure Managed Redis - Redis"
description = "Today Microsoft announced Azure Managed Redis, a new fully-managed, first-party Redis offering in Microsoft Azure. Azure Managed Redis is available today in public preview. Microsoft Azure is the first major cloud service provider to offer its customers a licensed, multi-tiered Redis service. This is a major milestone in our collaboration with Microsoft Azure, and a […]"
full_description = "Today Microsoft announced Azure Managed Redis, a new fully-managed, first-party Redis offering in Microsoft Azure. Azure Managed Redis is available today in public preview. Microsoft Azure is the first major cloud service provider to offer its customers a licensed, multi-tiered Redis service. This is a major milestone in our collaboration with Microsoft Azure, and a huge step forward for Azure customers already using the predecessor Azure Cache for Redis. Every customer that migrates from any Azure Cache for Redis tier to Azure Managed Redis will gain access to years of Redis innovation. This builds on our existing integration with Microsoft Azure on the Enterprise and Enterprise Flash tiers for Azure Cache for Redis. With the introduction of Azure Managed Redis, users on Azure Cache for Redis can now access features that were previously found only on the Azure Cache for Redis Enterprise and Enterprise Flash tiers. Azure Managed Redis users will gain access to Redis 7.4, and soon gain access to Redis 8.0, which will be available from redis.io and can be hosted on any hyperscale cloud. This builds on our decade-plus long commitment to delivering new features and advancements while ensuring full compatibility with previous versions of Redis. Azure Managed Redis gives developers the flexibility they need whether they have transaction, memory, or storage-heavy workloads. It covers the entire gamut of use cases from devs trying Redis for the first time, to expert engineers scaling hundreds of Redis instances. Azure Managed Redis introduces eight new data structures—JSON, vector, time series, and five probabilistic types—along with the fastest and most scalable Redis Query Engine to date. And with the introduction of new built-in advanced capabilities such as vector search, secondary indexing for full-text search, exact matching, geospatial queries, numeric data handling, and fast data processing, Azure Managed Redis delivers as a true multi-model real-time platform. Devs that use Azure Managed Redis can more simply build better apps that deliver on real-time sub-millisecond latency. The built-in Redis Query Engine ensures apps get the specific data they need faster by aggregating, transforming, and filtering data straight in Redis. Devs won’t need to juggle where to store their various pieces of data to speed them up since the most common data types can now all be stored and accessed fast straight from Redis."
