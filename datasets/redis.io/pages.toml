full_description = "Redis Ltd. and/or their applicable affiliates (“Redis”, “us”, or “we”) are committed to protecting your privacy. This Privacy Policy (“Policy”) informs you of our policies and procedures regarding the collection, use and disclosure of data relating to identified or identifiable natural persons (“Personal Data”), such as when you: (i) visit www.redis.io (including any subdomains of this website or other websites owned by us or operated on our behalf) (the “Site”); and (ii) trial, purchase download and/or subscribe to our cloud services or software (the “Services” or “Software”, respectively). This Policy applies to Personal Data that you provide us through the Site, Services, or Software (collectively the “Products”) or when you access or use any content appearing on the Site or made available through the Products, that we collect on your behalf as part of the Products’ use, or that we process to market the Products to prospective and current customers. As a condition to your use of the Products, we will ask you to provide us with certain Personal Data that we can use to contact or identify you and administer your account. We may be required by law to collect Personal Data, or as a consequence of any contractual relationship we may have. Failure to provide this Personal Data may prevent or delay the fulfillment of these obligations. The Personal Data that we collect includes your name, company name, job title, email address, telephone number, contact person details and financial information such as your credit/debit card details, your bank account details and/or your mailing address. As a paying user of the Service, we will receive your payment transaction details from the payment service provider that processed your payment. When you contact us, or when we contact you, we will receive and process any Personal Data that you provide us. When you fill out forms on our Site, we will receive and process any Personal Data that you provide us."
