["https://redis.io/blog/you-need-more-than-a-vector-database"]
title = "You need more than a vector database - Redis"
description = "As the GenAI market matures, users will demand platforms that cover the full gamut full-text search, vectors, caching, and beyond."
full_description = "Unless you’ve been off the grid the past two years, you’ve likely come across the term “vector database” in conversations about GenAI. I joined Redis in 2022, pre-ChatGPT, when vectors were largely unknown to most software developers. Back then, my team advocated use cases for vectors and vector search, but the story was hard to sell until the rise of Large Language Models (LLMs). Just look at how the Google search trends for the term have exploded over time: In 2024, vector databases became the go-to for building retrieval-augmented generation (RAG) systems. Why? Because vectors power semantic search between user questions and document chunks. But it’s not quite that simple. Reflecting on our customers’ success, lessons learned, and the rapidly shifting AI landscape, there’s still an elephant in the room that needs addressing—one that might be news to some and obvious to others: you need more than a vector database. Long before the hype around LLMs and vector search, the information retrieval (IR) community spent decades making sense of vast amounts of text and unstructured data. Algorithms like TF-IDF and BM25 still power world-class search engines. These methods generate scores based on how often words appear in a document and how rare they are across the entire corpus, highlighting terms that best characterize a document. Though the spotlight shifted to vectors, vector database offerings are scrambling to catch up with lexical search—like it’s 1990 all over again. Why? The most effective retrieval solutions don’t choose one over the other. Instead, they often implement some form of hybrid search that combines signals from both vector and lexical search. Vectors might be the hot topic today, but they’re building on decades of innovation—standing on the shoulders of giants. In the field, I’ve seen non-technical leaders get wide-eyed hearing about the power of vectors and semantic search. But vectors aren’t magic; they’re just numerical fingerprints of data."
