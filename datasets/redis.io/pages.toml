["https://redis.io/blog/whats-new-in-two-january-edition"]
title = "What’s new in two - January edition - Redis"
description = "Redis releases you might have missed in the past month. We’re covering the latest developments from January"
full_description = "Welcome to “What’s new in two,” your quick hit of Redis releases you might have missed in the past month. We’re covering the latest developments from January and expanding on what I covered in our latest video. Press play above if you’d rather watch than read. Let’s get started. I’m excited to announce the public preview of Redis Flex on Redis Cloud Essentials, our new tiered memory option that lets you cache five times more data at the same price. Think of Redis Flex as the next generation of our SSD flash memory solution, Auto Tiering. Redis Flex introduces some impressive updates. Thanks to our recent acquisition of Speedb Redis Flex is ready to use from the start, maintains low single-digit millisecond latency, and improves end-to-end response times. Plus, you can now get a 5GB cache for the price of 1GB, making it faster and more cost-effective. Log in to your Redis Cloud account to try it out. First, you can now hide or show the key size and TTL columns in the keys browser, optimizing space usage. We improved how you navigate between Redis databases and RDI, making it faster and easier to switch between your databases and RDI instances. We enhanced the UI for adding database connections. The connection details are organized in tabs for better clarity and usability An update I’m personally excited about is being able to test a connection to a source database while setting up an RDI pipeline. That wraps up this month’s “What’s new in two.” We’ve covered the latest Redis features and improvements from January. Whether you prefer watching or reading, catch more valuable updates in my next two-minute episode. And if you missed last month’s update, two minutes is all you need to catch up. See you next time."
