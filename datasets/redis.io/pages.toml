full_description = '''Develop with Redis Libraries and tools Redis products Redis Cloud Redis Software latest ▼ ▲ latest v7.4 Install and upgrade Quickstarts Quickstart Docker quickstart Install Upgrade Uninstall Additional configuration Product lifecycle Create support package Clusters Databases Networking Security Reference Release notes Archive Redis for Kubernetes latest ▼ ▲ latest v7.4.6 Redis Community Edition and Stack Redis Insight Commands document.addEventListener("DOMContentLoaded", function() { const sidebar = document.getElementById('sidebar'); const footer = document.querySelector('footer'); window.addEventListener('scroll', function() { const scrolledHeight = window.scrollY + window.innerHeight; if (scrolledHeight >= footer.offsetTop) { sidebar.style.maxHeight = `calc(100vh - 7rem - ${scrolledHeight - footer.offsetTop}px)`; } else { sidebar.style.maxHeight = 'calc(100vh - 7rem)'; } }); }) Docs Docs → Redis products → Redis Enterprise Software → Install, set up, and upgrade Redis Enterprise Software → Redis Enterprise Software quickstarts → Redis Enterprise Software quickstart Redis Enterprise Software quickstart Set up a test deployment of Redis Enterprise Software for Linux. Redis Enterprise Software This guide helps you install Redis Enterprise Software on a Linux host to test its capabilities. When finished, you'll have a simple cluster with a single node: Ensure port availability Install Redis Enterprise Software Set up a Redis Enterprise Software cluster Create a new Redis database Connect to your Redis database Note: This quickstart is designed for local testing only. For production environments, see the install and setup guide for deployment options and instructions. Ensure port availability If ports that Redis assigns to the database are being used by the operating system or other processes, the installation fails. Follow the relevant sections to configure required ports. For recommended and optional port configuration, see Network port configurations. Update sysctl.conf to avoid port collisions To avoid port collision, update /etc/sysctl.conf to include: net.ipv4.ip_local_port_range = 30000 65535 OS conflicts with port 53 If port 53 is in use, the installation fails. This issue can occur in default installations of certain operating systems in which systemd-resolved (DNS server) is running. To prevent this issue, change the system configuration to make this port available before installation. Edit /etc/systemd/resolved.conf: sudo vi /etc/systemd/resolved.conf Add DNSStubListener=no as the last line in the file and save the file. Rename the current /etc/resolv.conf file: sudo mv /etc/resolv.conf /etc/resolv.conf.orig Create a symbolic link for /etc/resolv.conf: sudo ln -s /run/systemd/resolve/resolv.conf /etc/resolv.conf Note: You might encounter a temporary name resolution error (sudo: unable to resolve host {hostname}: Temporary failure in name resolution), which should be fixed when you restart systemd-resolved in the next step. Restart the DNS service: sudo service systemd-resolved restart Configuration for AWS and GCP For detailed configuration instructions, see your cloud provider's documentation. Create a VPC that you can use with regional subnets. Within this VPC, create firewall rules that allow external and internal access for Redis Enterprise Software. Ingress/Egress Source Protocol Ports Other protocols Ingress 0.0.0.0/0 TCP 21, 22, 53, 8001, 8443, 9443, 8070, 10000-19999 ICMP Ingress 0.0.0.0/0 UDP 53, 5353 Ingress 10.0.0.0/8 (if subnets use 10. ranges) all all Install Redis Enterprise Software To install Redis Enterprise Software: Download the installation files from the Redis Enterprise Download Center and copy the download package to a machine with a Linux-based OS. Note: You are required to create a free account to access the download center. Extract the installation files: tar vxf <downloaded tar file name> Run the install.sh script in the current directory: sudo ./install.sh -y Set up a cluster To set up your machine as a Redis Enterprise Software cluster: In the web browser on the host machine, go to https://localhost:8443 to see the new Redis Enterprise Software Cluster Manager UI. The cluster generates self-signed TLS certificates to secure the connection. These self-signed certificates are unknown to the browser and must be accepted before you proceed. To use the legacy UI for this quickstart instead, see the 6.4 version of the quickstarts. Note: If the server does not show the login screen, try again after a few minutes. Select Create new cluster. Enter an email and password for the administrator account, then select Next to proceed to cluster setup. You can also use these credentials to connect to the REST API. Enter your cluster license key if you have one. Otherwise, a trial version is installed. In the Configuration section, enter a cluster FQDN such as cluster.local, then select Next. Warning: If the FQDN is cluster.local, you cannot configure DNS. You cannot change the FQDN after cluster creation. On the node setup screen, select Create cluster to accept the defaults. Select OK to acknowledge the replacement of the HTTPS TLS certificate on the node. If you receive a browser warning, you can proceed safely. Create a database On the Databases screen, select Quick database. Enter 12000 for the Port. If port 12000 is not available, enter any available port number between 10000 to 19999 or leave it blank to let the cluster assign a port number for you. You will use this port number to connect to the database. Select Create to create your database. When you see Database active appear on the database configuration screen, the database is activated and ready for you to use. You now have a Redis database! Connect to your database After you create the Redis database, you can connect to it and store data. See Test client connection for connection options and examples. Supported web browsers To use the Redis Enterprise Software Cluster Manager UI, you need a modern browser with JavaScript enabled. The Cluster Manager UI is officially supported for the latest version of Google Chrome, as well as the three previous and three subsequent versions. Continue learning with Redis University See the Get started with Redis Software learning path for courses. RATE THIS PAGE ★ ★ ★ ★ ★ Back to top ↑ Submit document.addEventListener("DOMContentLoaded", function() { const form = document.querySelector("#page-feedback"); form.addEventListener("submit", function(event) { event.preventDefault(); var xhr = new XMLHttpRequest(); var url = "\/docusight\/api\/rate"; var params = new URLSearchParams(new FormData(form)); xhr.open("POST", url, true); xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded"); xhr.onreadystatechange = function() { if (xhr.readyState === 4 && xhr.status === 200) { const responseData = JSON.parse(xhr.responseText); const responseMessage = responseData.response; const newText = document.createTextNode(responseMessage); form.parentNode.replaceChild(newText, form); } }; xhr.send(params); }); }); Edit this page Create an issue On this page Ensure port availability Update sysctl.conf to avoid port collisions OS conflicts with port 53 Configuration for AWS and GCP Install Redis Enterprise Software Set up a cluster Create a database Connect to your database Supported web browsers Continue learning with Redis University window.onload = function(){ var currentUrl = window.location.href const regex_kubernetes = new RegExp('/docs/(latest|staging\/.+)/operate/kubernetes/.*') const regex_rs = new RegExp('/docs/(latest|staging\/.+)/operate/rs/.*') if (regex_kubernetes.test(currentUrl)){ document.getElementById( 'versionSelectorKubernetes' ).style.display = ''; } else if (regex_rs.test(currentUrl)) { document.getElementById( 'versionSelectorRs' ).style.display = ''; } } function _setSelectedVersion(product, ver) { if (ver) { var i = document.getElementById(product + '-version-select-' + ver); if (i) { i