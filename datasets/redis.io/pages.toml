title = "Redis as a document database quick start guide | Docs"
description = "Understand how to use Redis as a document database"
full_description = '''Develop with Redis What's new? Quick starts Data structure store Document database Vector database RAG with Redis GenAI apps FAQ Client tools Client APIs Understand data types Interact with data Redis for AI Use Redis Reference Libraries and tools Redis products Commands document.addEventListener("DOMContentLoaded", function() { const sidebar = document.getElementById('sidebar'); const footer = document.querySelector('footer'); window.addEventListener('scroll', function() { const scrolledHeight = window.scrollY + window.innerHeight; if (scrolledHeight >= footer.offsetTop) { sidebar.style.maxHeight = `calc(100vh - 7rem - ${scrolledHeight - footer.offsetTop}px)`; } else { sidebar.style.maxHeight = 'calc(100vh - 7rem)'; } }); }) Docs Docs → Develop with Redis → Quick starts → Redis as a document database quick start guide Redis as a document database quick start guide Understand how to use Redis as a document database This quick start guide shows you how to: Create a secondary index Add JSON documents Search and query your data The examples in this article refer to a simple bicycle inventory that contains JSON documents with the following structure: { "brand": "brand name", "condition": "new | used | refurbished", "description": "description", "model": "model", "price": 0 } Setup The easiest way to get started with Redis Stack is to use Redis Cloud: Create a free account. Follow the instructions to create a free database. This free Redis Cloud database comes out of the box with all the Redis Stack features. You can alternatively use the installation guides to install Redis Stack on your local machine. Connect The first step is to connect to your Redis Stack database. You can find further details about the connection options in this documentation site's Tools section. The following example shows how to connect to a Redis Stack server that runs on localhost (-h 127.0.0.1) and listens on the default port (-p 6379): >_ Redis CLI > redis-cli -h 127.0.0.1 -p 6379 Copied! Are you tired of using redis-cli? Try Redis Insight - the developer GUI for Redis. Get Redis Insight Python """ Code samples for document database quickstart pages: https://redis.io/docs/latest/develop/get-started/document-database/ """ import redis import redis.commands.search.aggregation as aggregations import redis.commands.search.reducers as reducers from redis.commands.json.path import Path from redis.commands.search.field import NumericField, TagField, TextField from redis.commands.search.indexDefinition import IndexDefinition, IndexType from redis.commands.search.query import Query r = redis.Redis(host="localhost", port=6379, db=0, decode_responses=True) bicycle = { "brand": "Velorim", "model": "Jigger", "price": 270, "description": ( "Small and powerful, the Jigger is the best ride " "for the smallest of tikes! This is the tiniest " "kids’ pedal bike on the market available without" " a coaster brake, the Jigger is the vehicle of " "choice for the rare tenacious little rider " "raring to go." ), "condition": "new", } bicycles = [ bicycle, { "brand": "Bicyk", "model": "Hillcraft", "price": 1200, "description": ( "Kids want to ride with as little weight as possible." " Especially on an incline! They may be at the age " 'when a 27.5" wheel bike is just too clumsy coming ' 'off a 24" bike. The Hillcraft 26 is just the solution' " they need!" ), "condition": "used", }, { "brand": "Nord", "model": "Chook air 5", "price": 815, "description": ( "The Chook Air 5 gives kids aged six years and older " "a durable and uberlight mountain bike for their first" " experience on tracks and easy cruising through forests" " and fields. The lower top tube makes it easy to mount" " and dismount in any situation, giving your kids greater" " safety on the trails." ), "condition": "used", }, { "brand": "Eva", "model": "Eva 291", "price": 3400, "description": ( "The sister company to Nord, Eva launched in 2005 as the" " first and only women-dedicated bicycle brand. Designed" " by women for women, allEva bikes are optimized for the" " feminine physique using analytics from a body metrics" " database. If you like 29ers, try the Eva 291. It’s a " "brand new bike for 2022.. This full-suspension, " "cross-country ride has been designed for velocity. The" " 291 has 100mm of front and rear travel, a superlight " "aluminum frame and fast-rolling 29-inch wheels. Yippee!" ), "condition": "used", }, { "brand": "Noka Bikes", "model": "Kahuna", "price": 3200, "description": ( "Whether you want to try your hand at XC racing or are " "looking for a lively trail bike that's just as inspiring" " on the climbs as it is over rougher ground, the Wilder" " is one heck of a bike built specifically for short women." " Both the frames and components have been tweaked to " "include a women’s saddle, different bars and unique " "colourway." ), "condition": "used", }, { "brand": "Breakout", "model": "XBN 2.1 Alloy", "price": 810, "description": ( "The XBN 2.1 Alloy is our entry-level road bike – but that’s" " not to say that it’s a basic machine. With an internal " "weld aluminium frame, a full carbon fork, and the slick-shifting" " Claris gears from Shimano’s, this is a bike which doesn’t" " break the bank and delivers craved performance." ), "condition": "new", }, { "brand": "ScramBikes", "model": "WattBike", "price": 2300, "description": ( "The WattBike is the best e-bike for people who still feel young" " at heart. It has a Bafang 1000W mid-drive system and a 48V" " 17.5AH Samsung Lithium-Ion battery, allowing you to ride for" " more than 60 miles on one charge. It’s great for tackling hilly" " terrain or if you just fancy a more leisurely ride. With three" " working modes, you can choose between E-bike, assisted bicycle," " and normal bike modes." ), "condition": "new", }, { "brand": "Peaknetic", "model": "Secto", "price": 430, "description": ( "If you struggle with stiff fingers or a kinked neck or back after" " a few minutes on the road, this lightweight, aluminum bike" " alleviates those issues and allows you to enjoy the ride. From" " the ergonomic grips to the lumbar-supporting seat position, the" " Roll Low-Entry offers incredible comfort. The rear-inclined seat" " tube facilitates stability by allowing you to put a foot on the" " ground to balance at a stop, and the low step-over frame makes it" " accessible for all ability and mobility levels. The saddle is" " very soft, with a wide back to support your hip joints and a" " cutout in the center to redistribute that pressure. Rim brakes" " deliver satisfactory braking control, and the wide tires provide" " a smooth, stable ride on paved roads and gravel. Rack and fender" " mounts facilitate setting up the Roll Low-Entry as your preferred" " commuter, and the BMX-like handlebar offers space for mounting a" " flashlight, bell, or phone holder." ), "condition": "new", }, { "brand": "nHill", "model": "Summit", "price": 1200, "description": ( "This budget mountain bike from nHill performs well both on bike" " paths and on the trail. The fork with 100mm of travel absorbs" " rough terrain. Fat Kenda Booster tires give you grip in corners" " and on wet trails. The Shimano Tourney drivetrain offered enough" " gears for finding a comfortable pace to ride uphill, and the" " Tektro hydraulic disc brakes break smoothly. Whether you want an" " affordable bike that you can take to work, but also take trail in" " mountains on the weekends or you’re just after a stable," " comfortable ride for the bike path, the Summit gives a good value" " for money." ), "condition": "new", }, { "model": "ThrillCycle", "brand": "BikeShind", "price": 815, "description": ( "An artsy, retro-inspired bicycle that’s as functional as it is" " pretty: The ThrillCycle steel frame offers a smooth ride. A" " 9-speed drivetrain has enough gears for coasting in the city, but" " we wouldn’t suggest taking it to the mountains. Fenders protect" " you from mud, and a rear basket lets you transport groceries," " flowers and books. The ThrillCycle comes with a limited lifetime" " warranty, so this little guy will last you long past graduation." ), "condition": "refurbished", }, ] schema = ( TextField("$.brand", as_name="brand"), TextField("$.model", as_name="model"), TextField("$.description", as_name="description"), NumericField("$.price", as_name="price"), TagField("$.condition", as_name="condition"), ) index = r.ft("idx:bicycle") index.create_index( schema, definition=IndexDefinition(prefix=["bicycle:"], index_type=IndexType.JSON), ) for bid, bicycle in enumerate(bicycles): r.json().set(f"bicycle:{bid}", Path.root_path(), bicycle) res = index.search(Query("*")) print("Documents found:", res.total) # >>> Documents found: 10 res = index.search(Query("@model:Jigger")) print(res) # >>> Result{1 total, docs: [ # Document { # 'id': 'bicycle:0', # 'payload': None, # 'json': '{ # "brand":"Velorim", # "model":"Jigger", # "price":270, # ... # "condition":"new" # }' # }]} res = index.search(Query("@model:Jigger").return_field("$.price", as_field="price")) print(res) # >>> [Document {'id': 'bicycle:0', 'payload': None, 'price': '270'}] res = index.search(Query("basic @price:[500 1000]")) print(res) # >>> Result{1 total, docs: [ # Document { # 'id': 'bicycle:5', # 'payload': None, # 'json': '{ # "brand":"Breakout", # "model":"XBN 2.1 Alloy", # "price":810, # ... # "condition":"new" # }' # }]} res = index.search(Query('@brand:"Noka Bikes"')) print(res) # >>> Result{1 total, docs: [ # Document { # 'id': 'bicycle:4', # 'payload': None, # 'json': '{ # "brand":"Noka Bikes", # "model":"Kahuna", # "price":3200, # ... # "condition":"used" # }' # }]} res = index.search( Query("@description:%analitics%").dialect( # Note the typo in the word "analytics" 2 ) ) print(res) # >>> Result{1 total, docs: [ # Document { # 'id': 'bicycle:3', # 'payload': None, # 'json': '{ # "brand":"Eva", # "model":"Eva 291", # "price":3400, # "description":"...using analytics from a body metrics database...", # "condition":"used" # }' # }]} res = index.search( Query("@description:%%analitycs%%").dialect( # Note 2 typos in the word "analytics" 2 ) ) print(res) # >>> Result{1 total, docs: [ # Document { # 'id': 'bicycle:3', # 'payload': None, # 'json': '{ # "brand":"Eva", # "model":"Eva 291", # "price":3400, # "description":"...using analytics from a body metrics database...", # "condition":"used" # }' # }]} res = index.search(Query("@model:hill*")) print(res) # >>> Result{1 total, docs: [ # Document { # 'id': 'bicycle:1', # 'payload': None, # 'json': '{ # "brand":"Bicyk", # "model":"Hillcraft", # "price":1200, # ... # "condition":"used" # }' # }]} res = index.search(Query("@model:*bike")) print(res) # >>> Result{1 total, docs: [ # Document { # 'id': 'bicycle:6', # 'payload': None, # 'json': '{ # "brand":"ScramBikes", # "model":"WattBike", # "price":2300, # ... # "condition":"new" # }' # }]} res = index.search(Query("w'H?*craft'").dialect(2)) print(res.docs[0].json) # >>> { # "brand":"Bicyk", # "model":"Hillcraft", # "price":1200, # ... # "condition":"used" # } res = index.search(Query("mountain").with_scores()) for sr in res.docs: print(f"{sr.id}: score={sr.score}") res = index.search(Query("mountain").with_scores().scorer("BM25")) for sr in res.docs: print(f"{sr.id}: score={sr.score}") req = aggregations.AggregateRequest("*").group_by( "@condition", reducers.count().alias("count") ) res = index.aggregate(req).rows print(res) # >>> [['condition', 'refurbished', 'count', '1'], # ['condition', 'used', 'count', '4'], # ['condition', 'new', 'count', '5']] Copied! Python Quick-Start Node.js import { AggregateGroupByReducers, AggregateSteps, createClient, SchemaFieldTypes } from 'redis'; const client = createClient(); client.on('error', err => console.log('Redis Client Error', err)); await client.connect(); const bicycle1 = { brand: 'Velorim', model: 'Jigger', price: 270, description: 'Small and powerful, the Jigger is the best ' + 'ride for the smallest of tikes! This is the tiniest kids\u2019 ' + 'pedal bike on the market available without a coaster brake, the ' + 'Jigger is the vehicle of choice for the rare tenacious little' + 'rider raring to go.', condition: 'new' }; const bicycles = [ bicycle1, { brand: 'Bicyk', model: 'Hillcraft', price: 1200, description: 'Kids want to ride with as little weight as possible. Especially on an incline! They may be at the age when a 27.5\" wheel bike is just too clumsy coming off a 24\" bike. The Hillcraft 26 is just the solution they need!', condition: 'used' }, { brand: 'Nord', model: 'Chook air 5', price: 815, description: 'The Chook Air 5 gives kids aged six years and older a durable and uberlight mountain bike for their first experience on tracks and easy cruising through forests and fields. The lower top tube makes it easy to mount and dismount in any situation, giving your kids greater safety on the trails.', condition: 'used' }, { brand: 'Eva', model: 'Eva 291', price: 3400, description: 'The sister company to Nord, Eva launched in 2005 as the first and only women-dedicated bicycle brand. Designed by women for women, allEva bikes are optimized for the feminine physique using analytics from a body metrics database. If you like 29ers, try the Eva 291. It\u2019s a brand new bike for 2022.. This full-suspension, cross-country ride has been designed for velocity. The 291 has 100mm of front and rear travel, a superlight aluminum frame and fast-rolling 29-inch wheels. Yippee!', condition: 'used' }, { brand: 'Noka Bikes', model: 'Kahuna', price: 3200, description: 'Whether you want to try your hand at XC racing or are looking for a lively trail bike that\'s just as inspiring on the climbs as it is over rougher ground, the Wilder is one heck of a bike built specifically for short women. Both the frames and components have been tweaked to include a women\u2019s saddle, different bars and unique colourway.', condition: 'used' }, { brand: 'Breakout', model: 'XBN 2.1 Alloy', price: 810, description: 'The XBN 2.1 Alloy is our entry-level road bike \u2013 but that\u2019s not to say that it\u2019s a basic machine. With an internal weld aluminium frame, a full carbon fork, and the slick-shifting Claris gears from Shimano\u2019s, this is a bike which doesn\u2019t break the bank and delivers craved performance.', condition: 'new' }, { brand: 'ScramBikes', model: 'WattBike', price: 2300, description: 'The WattBike is the best e-bike for people who still feel young at heart. It has a Bafang 1000W mid-drive system and a 48V 17.5AH Samsung Lithium-Ion battery, allowing you to ride for more than 60 miles on one charge. It\u2019s great for tackling hilly terrain or if you just fancy a more leisurely ride. With three working modes, you can choose between E-bike, assisted bicycle, and normal bike modes.', condition: 'new' }, { brand: 'Peaknetic', model: 'Secto', price: 430, description: 'If you struggle with stiff fingers or a kinked neck or back after a few minutes on the road, this lightweight, aluminum bike allevi'''
