["https://redis.io/fr/solutions/cas-dutilisation/feature-stores"]
title = "Les Feature Stores au service du Machine Learning - Redis Enterprise"
description = "Surmontez les défis posés par les bases de données traditionnelles et créez des magasins de fonctionnalités en ligne évolutifs et à faible latence pour le Machine Learning avec Redis Enterprise."
full_description = "Video Bringing Feature Store to Azure – from Microsoft Azure, Redis, and Feast Community Learn more Construisez des feature store évolutives et à faible latence pour l'apprentissage automatique avec Redis Enterprise Alors que les cas d’utilisation basés sur l’IA/apprentissage automatique (Le Machine Learning) en temps réel sont présents dans toutes les facettes de notre vie, il devient de plus en plus difficile de fournir des cas d’utilisation basés sur l’apprentissage machine en utilisant des données en temps réel avec une faible latence. Conçu pour gérer les scores à haut débit et à faible latence pour les grands ensembles de données, Redis Enterprise est la solution idéale pour les boutiques de fonctionnalités en ligne évolutives et abordables qui permettent de fournir des fonctionnalités en temps réel à grande échelle. Une partie croissante des cas d’utilisation de l’apprentissage automatique s’appuie sur leurs magasins de fonctionnalités en ligne pour les prévisions en ligne tout en utilisant de nouvelles fonctionnalités. Il est très difficile de fournir ces fonctionnalités avec une faible latence de manière constante et fiable. Procéder ainsi à grande échelle est un défi que les bases de données traditionnelles ne peuvent pas relever. Les cas d’utilisation basés sur l’apprentissage automatique, livrés en temps réel à l’aide de nouvelles données en direct, ont un impact direct sur l’expérienceclient ou améliorent les résultats commerciaux. Cependant, fournir ces prédictions en ligne de manière fiable lorsque l’utilisateur interagit avec l’application, tout en utilisant des fonctionnalités en temps réel à partir de sources de streaming est très difficile. Avec l’essor de la transformation numérique, les applications basées sur l’apprentissage automatique s’appuient sur des ensembles de données énormes et toujours croissants avec des centaines à des milliers de fonctionnalités alimentant les systèmes d’apprentissage automatique à une échelle massive. Cela ajoute plus de complexité et de coût à la tâche consistant à fournir des fonctionnalités de manière cohérente et abordable en temps réel."
