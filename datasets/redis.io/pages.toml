["https://redis.io/company/team/daniel-docter"]
title = "Daniel Docter (Observer) - Redis"
description = "Meet Daniel Docter: Learn about the Redis Labs team member. Visit Redis.com for more information."
full_description = "Daniel Docter is Managing Director at Dell Technologies Capital, where he leads investments related to Pivotal, Virtustream, and the Dell-EMC Enterprise Hybrid and Cloud Native Solutions Group. Daniel’s investment focus includes AI and ML/DL, big/fast data and data analytics, cloud management and orchestration, CI/CD, and serverless architecture. Prior to joining Dell Technologies, Daniel was Director at Intel Capital where he led investment initiatives in Cloud (Open Data Center), Software Defined Networking, Data Center Services, and High Performance Computing. His investments covered services, infrastructure, management software, compute and storage systems, and ICs, such as Switch SuperNap, Tier 3 (acquired by CenturyLink), Passave (acquired by PMCS), E2O Communications (acquired by JDSU), Stratalight Communications (acquired by Opnext), Cortina Systems (acquired by InPhi), Fulcrum Microsystems (acquired by Intel), Virident (acquired by Western Digital), and Aspeed (IPO on Taiwan Stock Exchange). Dan also played a key role in several Intel acquisitions (including Fulcrum, New Focus, Stratos LightWave) and divestitures (including the Optical Products Group). Before Intel Capital, Daniel was with Merrill Lynch as an adviser for technology company clients involved in IPOs and M&A transactions. Before Merrill Lynch, Daniel spent 11 years at AT&T Bell Labs and Hughes Research Labs working on optical and RF communications applications. He has more than 50 journal publications and 10 patents. Daniel holds a PhD from the University of Bradford, United Kingdom and a BS in electrical engineering from the University of Minnesota. He is based in Palo Alto, California. Daniel represents Dell Technologies Capital on the board of directors of the following companies: BlueData, MongoDB, Cloud66, Packet Host, GraphCore, Redis, Iguazio Systems, Striim, Intigua, and OpsMx."
