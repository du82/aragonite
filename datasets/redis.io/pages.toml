["https://redis.io/customers/superlinked"]
title = "With Redis Enterprise’s Vector Database, Superlinked is Revolutionizing Personalization | Redis"
description = "Redis Enterprise provides a highly responsive, scalable vector database and index that powers Superlinked’s Vector Ops platform."
full_description = "Superlinked is a London-based technology company that develops software infrastructure that makes it easier for developers to build products that understand users and deliver personalized and engaging experiences. Today’s software developers are tasked with creating applications that understand user behavior so they can surface relevant content, match users with each other, detect malicious bots, and segment users by behavior. Redis Cloud provides a highly responsive, scalable vector database and index that powers Superlinked’s management of the process to represent users and content with vector embeddings. Superlinked makes machine learning technology more accessible and easier to embed in popular applications. Developers can launch personalized experiences in hours, without the need for advanced machine learning, MLOps, or data science expertise. Since deploying Redis Cloud, Superlinked has sustained periods of non-stop heavy usage (100+ vector search queries per second) with 95 percentile latency at 30ms. Our real-time recommender infrastructure needs to search and update vector embeddings in milliseconds to deliver a blazing fast experience for our marketplace, e-commerce and social customers. We benchmarked all the leading vector databases on the market, and Redis Cloud came out on top. To engage today’s discerning users, software applications must be intelligent enough to immediately adapt to individual needs, including delivering custom content and recommendations. A growing number of organizations use machine learning (ML) technology to create these adaptive, personalized experiences. However, while personalization shows tremendous potential, the vast majority of corporate ML initiatives are struggling to move beyond the test stages.1 According to a recent Gartner survey, nearly two-thirds of digital marketing leaders have difficulty offering personalized experiences to their customers. Meanwhile, those organizations that succeed in putting machine learning into production typically see a 3 to 15 percent increase in profit margins.2"
