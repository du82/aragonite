title = "Redis Strings | Docs"
description = "Introduction to Redis strings"
full_description = '''Develop with Redis What's new? Quick starts Client tools Client APIs Understand data types Strings JSON Lists Sets Hashes Sorted sets Streams Geospatial Bitmaps Bitfields Probabilistic Time series Interact with data Redis for AI Use Redis Reference Libraries and tools Redis products Commands document.addEventListener("DOMContentLoaded", function() { const sidebar = document.getElementById('sidebar'); const footer = document.querySelector('footer'); window.addEventListener('scroll', function() { const scrolledHeight = window.scrollY + window.innerHeight; if (scrolledHeight >= footer.offsetTop) { sidebar.style.maxHeight = `calc(100vh - 7rem - ${scrolledHeight - footer.offsetTop}px)`; } else { sidebar.style.maxHeight = 'calc(100vh - 7rem)'; } }); }) Docs Docs → Develop with Redis → Understand Redis data types → Redis Strings Redis Strings Introduction to Redis strings Redis strings store sequences of bytes, including text, serialized objects, and binary arrays. As such, strings are the simplest type of value you can associate with a Redis key. They're often used for caching, but they support additional functionality that lets you implement counters and perform bitwise operations, too. Since Redis keys are strings, when we use the string type as a value too, we are mapping a string to another string. The string data type is useful for a number of use cases, like caching HTML fragments or pages. >_ Redis CLI > SET bike:1 Deimos OK > GET bike:1 "Deimos" Copied! Are you tired of using redis-cli? Try Redis Insight - the developer GUI for Redis. Get Redis Insight Python """ Code samples for String doc pages: https://redis.io/docs/latest/develop/data-types/strings/ """ import redis r = redis.Redis(decode_responses=True) res1 = r.set("bike:1", "Deimos") print(res1) # True res2 = r.get("bike:1") print(res2) # Deimos res3 = r.set("bike:1", "bike", nx=True) print(res3) # None print(r.get("bike:1")) # Deimos res4 = r.set("bike:1", "bike", xx=True) print(res4) # True res5 = r.mset({"bike:1": "Deimos", "bike:2": "Ares", "bike:3": "Vanth"}) print(res5) # True res6 = r.mget(["bike:1", "bike:2", "bike:3"]) print(res6) # ['Deimos', 'Ares', 'Vanth'] r.set("total_crashes", 0) res7 = r.incr("total_crashes") print(res7) # 1 res8 = r.incrby("total_crashes", 10) print(res8) # 11 Copied! Python Quick-Start Node.js import assert from 'assert'; import { createClient } from 'redis'; const client = await createClient(); await client.connect(); const res1 = await client.set("bike:1", "Deimos"); console.log(res1); // OK const res2 = await client.get("bike:1"); console.log(res2); // Deimos const res3 = await client.set("bike:1", "bike", {'NX': true}); console.log(res3); // null console.log(await client.get("bike:1")); // Deimos const res4 = await client.set("bike:1", "bike", {'XX': true}); console.log(res4); // OK const res5 = await client.mSet([ ["bike:1", "Deimos"], ["bike:2", "Ares"], ["bike:3", "Vanth"] ]); console.log(res5); // OK const res6 = await client.mGet(["bike:1", "bike:2", "bike:3"]); console.log(res6); // ['Deimos', 'Ares', 'Vanth'] await client.set("total_crashes", 0); const res7 = await client.incr("total_crashes"); console.log(res7); // 1 const res8 = await client.incrBy("total_crashes", 10); console.log(res8); // 11 Copied! Node.js Quick-Start Java-Sync package io.redis.examples; import redis.clients.jedis.UnifiedJedis; import redis.clients.jedis.params.SetParams; import java.util.ArrayList; import java.util.Arrays; import java.util.List; public class StringExample { public void run() { try (UnifiedJedis jedis = new UnifiedJedis("redis://localhost:6379")) { String res1 = jedis.set("bike:1", "Deimos"); System.out.println(res1); // OK String res2 = jedis.get("bike:1"); System.out.println(res2); // Deimos Long res3 = jedis.setnx("bike:1", "bike"); System.out.println(res3); // 0 (because key already exists) System.out.println(jedis.get("bike:1")); // Deimos (value is unchanged) String res4 = jedis.set("bike:1", "bike", SetParams.setParams().xx()); // set the value to "bike" if it // already // exists System.out.println(res4); // OK String res5 = jedis.mset("bike:1", "Deimos", "bike:2", "Ares", "bike:3", "Vanth"); System.out.println(res5); // OK List<String> res6 = jedis.mget("bike:1", "bike:2", "bike:3"); System.out.println(res6); // [Deimos, Ares, Vanth] jedis.set("total_crashes", "0"); Long res7 = jedis.incr("total_crashes"); System.out.println(res7); // 1 Long res8 = jedis.incrBy("total_crashes", 10); System.out.println(res8); // 11 } } } Copied! Java-Sync Quick-Start Java-Async package io.redis.examples.async; import io.lettuce.core.*; import io.lettuce.core.api.async.RedisAsyncCommands; import io.lettuce.core.api.StatefulRedisConnection; import java.util.*; import java.util.concurrent.CompletableFuture; public class StringExample { public void run() { RedisClient redisClient = RedisClient.create("redis://localhost:6379"); try (StatefulRedisConnection<String, String> connection = redisClient.connect()) { RedisAsyncCommands<String, String> asyncCommands = connection.async(); CompletableFuture<Void> setAndGet = asyncCommands.set("bike:1", "Deimos").thenCompose(v -> { System.out.println(v); // >>> OK return asyncCommands.get("bike:1"); }) .thenAccept(System.out::println) // >>> Deimos .toCompletableFuture(); setAndGet.join(); CompletableFuture<Void> setnx = asyncCommands.setnx("bike:1", "bike").thenCompose(v -> { System.out.println(v); // >>> false (because key already exists) return asyncCommands.get("bike:1"); }) .thenAccept(System.out::println) // >>> Deimos (value is unchanged) .toCompletableFuture(); setnx.join(); // set the value to "bike" if it already exists CompletableFuture<Void> setxx = asyncCommands.set("bike:1", "bike", SetArgs.Builder.xx()) .thenAccept(System.out::println) // >>> OK .toCompletableFuture(); setxx.join(); Map<String, String> bikeMap = new HashMap<>(); bikeMap.put("bike:1", "Deimos"); bikeMap.put("bike:2", "Ares"); bikeMap.put("bike:3", "Vanth"); CompletableFuture<Void> mset = asyncCommands.mset(bikeMap).thenCompose(v -> { System.out.println(v); // >>> OK return asyncCommands.mget("bike:1", "bike:2", "bike:3"); }) .thenAccept(System.out::println) // >>> [KeyValue[bike:1, Deimos], KeyValue[bike:2, Ares], KeyValue[bike:3, // Vanth]] .toCompletableFuture(); mset.join(); CompletableFuture<Void> incrby = asyncCommands.set("total_crashes", "0") .thenCompose(v -> asyncCommands.incr("total_crashes")).thenCompose(v -> { System.out.println(v); // >>> 1 return asyncCommands.incrby("total_crashes", 10); }) .thenAccept(System.out::println) // >>> 11 .toCompletableFuture(); incrby.join(); } finally { redisClient.shutdown(); } } } Copied! Java-Async Quick-Start Java-Reactive package io.redis.examples.reactive; import io.lettuce.core.*; import io.lettuce.core.api.reactive.RedisReactiveCommands; import io.lettuce.core.api.StatefulRedisConnection; import reactor.core.publisher.Mono; import java.util.*; public class StringExample { public void run() { RedisClient redisClient = RedisClient.create("redis://localhost:6379"); try (StatefulRedisConnection<String, String> connection = redisClient.connect()) { RedisReactiveCommands<String, String> reactiveCommands = connection.reactive(); Mono<Void> setAndGet = reactiveCommands.set("bike:1", "Deimos").doOnNext(v -> { System.out.println(v); // OK }).flatMap(v -> reactiveCommands.get("bike:1")).doOnNext(res -> { System.out.println(res); // Deimos }).then(); Mono<Void> setnx = reactiveCommands.setnx("bike:1", "bike").doOnNext(v -> { System.out.println(v); // false (because key already exists) }).flatMap(v -> reactiveCommands.get("bike:1")).doOnNext(res -> { System.out.println(res); // Deimos (value is unchanged) }).then(); Mono<Void> setxx = reactiveCommands.set("bike:1", "bike", SetArgs.Builder.xx()).doOnNext(res -> { System.out.println(res); // OK }).then(); Map<String, String> bikeMap = new HashMap<>(); bikeMap.put("bike:1", "Deimos"); bikeMap.put("bike:2", "Ares"); bikeMap.put("bike:3", "Vanth"); Mono<Void> mset = reactiveCommands.mset(bikeMap).doOnNext(System.out::println) // OK .flatMap(v -> reactiveCommands.mget("bike:1", "bike:2", "bike:3").collectList()).doOnNext(res -> { List<KeyValue<String, String>> expected = new ArrayList<>( Arrays.asList(KeyValue.just("bike:1", "Deimos"), KeyValue.just("bike:2", "Ares"), KeyValue.just("bike:3", "Vanth"))); System.out.println(res); // [KeyValue[bike:1, Deimos], KeyValue[bike:2, Ares], KeyValue[bike:3, Vanth]] }).then(); Mono<Void> incrby = reactiveCommands.set("total_crashes", "0").flatMap(v -> reactiveCommands.incr("total_crashes")) .doOnNext(v -> { System.out.println(v); // 1 }).flatMap(v -> reactiveCommands.incrby("total_crashes", 10)).doOnNext(res -> { System.out.println(res); // 11 }).then(); Mono.when(setAndGet, setnx, setxx, mset, incrby).block(); } finally { redisClient.shutdown(); } } } Copied! Java-Reactive Quick-Start Go package example_commands_test import ( "context" "fmt" "github.com/redis/go-redis/v9" ) func ExampleClient_set_get() { ctx := context.Background() rdb := redis.NewClient(&redis.Options{ Addr: "localhost:6379", Password: "", // no password docs DB: 0, // use default DB }) res1, err := rdb.Set(ctx, "bike:1", "Deimos", 0).Result() if err != nil { panic(err) } fmt.Println(res1) // >>> OK res2, err := rdb.Get(ctx, "bike:1").Result() if err != nil { panic(err) } fmt.Println(res2) // >>> Deimos } func ExampleClient_setnx_xx() { ctx := context.Background() rdb := redis.NewClient(&redis.Options{ Addr: "localhost:6379", Password: "", // no password docs DB: 0, // use default DB }) res3, err := rdb.SetNX(ctx, "bike:1", "bike", 0).Result() if err != nil { panic(err) } fmt.Println(res3) // >>> false res4, err := rdb.Get(ctx, "bike:1").Result() if err != nil { panic(err) } fmt.Println(res4) // >>> Deimos res5, err := rdb.SetXX(ctx, "bike:1", "bike", 0).Result() if err != nil { panic(err) } fmt.Println(res5) // >>> OK } func ExampleClient_mset() { ctx := context.Background() rdb := redis.NewClient(&redis.Options{ Addr: "localhost:6379", Password: "", // no password docs DB: 0, // use default DB }) res6, err := rdb.MSet(ctx, "bike:1", "Deimos", "bike:2", "Ares", "bike:3", "Vanth").Result() if err != nil { panic(err) } fmt.Println(res6) // >>> OK res7, err := rdb.MGet(ctx, "bike:1", "bike:2", "bike:3").Result() if err != nil { panic(err) } fmt.Println(res7) // >>> [Deimos Ares Vanth] } func ExampleClient_incr() { ctx := context.Background() rdb := redis.NewClient(&redis.Options{ Addr: "localhost:6379", Password: "", // no password docs DB: 0, // use default DB }) res8, err := rdb.Set(ctx, "total_crashes", "0", 0).Result() if err != nil { panic(err) } fmt.Println(res8) // >>> OK res9, err := rdb.Incr(ctx, "total_crashes").Result() if err != nil { panic(err) } fmt.Println(res9) // >>> 1 res10, err := rdb.IncrBy(ctx, "total_crashes", 10).Result() if err != nil { panic(err) } fmt.Println(res10) // >>> 11 } Copied! Go Quick-Start C# public class StringSnippets { public void run() { var muxer = ConnectionMultiplexer.Connect("localhost:6379"); var db = muxer.GetDatabase(); var res1 = db.StringSet("bike:1", "Deimos"); Console.WriteLine(res1); // true var res2 = db.StringGet("bike:1"); Console.WriteLine(res2); // Deimos var res3 = db.StringSet("bike:1", "bike", when: When.NotExists); Console.WriteLine(res3); // false Console.WriteLine(db.StringGet("bike:1")); var res4 = db.StringSet("bike:1", "bike", when: When.Exists); Console.WriteLine(res4); // true var res5 = db.StringSet(new KeyValuePair<RedisKey, RedisValue>[] { new ("bike:1", "Deimos"), new("bike:2", "Ares"), new("bike:3", "Vanth") }); Console.WriteLine(res5); var res6 = db.StringGet(new RedisKey[] { "bike:1", "bike:2", "bike:3" }); Console.WriteLine(res6); db.StringSet("total_crashes", 0); var res7 = db.StringIncrement("total_crashes"); Console.WriteLine(res7); // 1 var res8 = db.StringIncrement("total_crashes", 10); Console.WriteLine(res8); } } Copied! C# Quick-Start As you can see using the SET and the GET commands are the way we set and retrieve a string value. Note that SET will replace any existing value already stored into the key, in the case that the key already exists, even if the key is associated with a non-string value. So SET performs an assignment. Values can be strings (including binary data) of every kind, for instance you can store a jpeg image inside a value. A value can't be bigger than 512 MB. The SET command has interesting options, that are provided as additional arguments. For example, I may ask SET to fail if the key already exists, or the opposite, that it only succeed if the key already exists: >_ Redis CLI > set bike:1 bike nx (nil) > set bike:1 bike xx OK Copied! Are you tired of using redis-cli? Try Redis Insight - the developer GUI for Redis. Get Redis Insight Python """ Code samples for String doc pages: https://redis.io/docs/latest/develop/data-types/strings/ """ import redis r = redis.Redis(decode_responses=True) res1 = r.set("bike:1", "Deimos") print(res1) # True res2 = r.get("bike:1") print(res2) # Deimos res3 = r.set("bike:1", "bike", nx=True) print(res3) # None print(r.get("bike:1")) # Deimos res4 = r.set("bike:1", "bike", xx=True) print(res4) # True res5 = r.mset({"bike:1": "Deimos", "bike:2": "Ares", "bike:3": "Vanth"}) print(res5) # True res6 = r.mget(["bike:1", "bike:2", "bike:3"]) print(res6) # ['Deimos', 'Ares', 'Vanth'] r.set("total_crashes", 0) res7 = r.incr("total_crashes") print(res7) # 1 res8 = r.incrby("total_crashes", 10) print(res8) # 11 Copied! Python Quick-Start Node.js import assert from 'assert'; import { createClient } from 'redis'; const client = await createClient(); await client.connect(); const res1 = await client.set("bike:1", "Deimos"); console.log(res1); // OK const res2 = await client.get("bike:1"); console.log(res2); // Deimos const res3 = await client.set("bike:1", "bike", {'NX': true}); console.log(res3); // null console.log(await client.get("bike:1")); // Deimos const res4 = await client.set("bike:1", "bike", {'XX': true}); console.log(res4); // OK const res5 = await client.mSet([ ["bike:1", "Deimos"], ["bike:2", "Ares"], ["bike:3", "Vanth"] ]); console.log(res5); // OK const res6 = await client.mGet(["bike:1", "bike:2", "bike:3"]); console.log(res6); // ['Deimos', 'Ares', 'Vanth'] await client.set("total_crashes", 0); const res7 = await client.incr("total_crashes"); console.log(res7); // 1 const res8 = await client.incrBy("total_crashes", 10); console.log(res8); // 11 Copied! Node.js Quick-Start Java-Sync package io.redis.examples; import redis.clients.jedis.UnifiedJedis; import redis.clients.jedis.params.SetParams; import java.util.ArrayList; import java.util.Arrays; import java.util.List; public class StringExample { public void run() { try (UnifiedJedis jedis = new UnifiedJedis("redis://localhost:6379")) { String res1 = jedis.set("bike:1", "Deimos"); System.out.println(res1); // OK String res2 = jedis.get("bike:1"); System.out.println(res2); // Deimos Long res3 = jedis.setnx("bike:1", "bike"); System.ou'''
