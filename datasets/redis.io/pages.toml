title = "Kimberly Alexy - Redis"
description = "Meet Kimberly Alexy: Learn about the Redis Labs team member. Visit Redis.com for more information."
full_description = "Kimberly Alexy is a finance professional and corporate board member and has served on over a dozen pre-IPO and public company boards. She has over 25 years of experience in finance, accounting, capital markets, M&A and investments. She was a sell-side equity research analyst on Wall Street for nearly a decade specializing in technology stocks. Since then, she has been an active investor and board director, helping public and pre-IPO companies with their board needs. She has chaired Audit, Compensation, Nominating and Governance Committees as well as a series of Special Committees. She resides in California with her husband and two sons, is passionate about disruptive edtech and plant-based nutrition and enjoys horseback riding and sunsets at the beach. Alexy is a Chartered Financial Analyst (CFA), completed her undergraduate studies at Emory University, and received her MBA from the College of William and Mary."
