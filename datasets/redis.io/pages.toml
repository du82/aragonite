full_description = "Eran Gorev joined Francisco Partners Consulting as an Operating Partner in 2014 with a primary focus on the EMEA region. In 2019 Eran was promoted to Senior Operating Partner. Prior to joining Francisco Partners Consulting, Eran was the President and CEO of Alvarion. Previously, he held a number of executive leadership positions at NICE Systems, where, as Chief Business Officer and President and CEO of NICE Systems Inc., Eran led the transformation of the company from its original HW-orientation to a provider of software-based business and analytics solutions, more than doubling the global business and the bottom line. Prior to NICE Systems, Eran held a number of senior leadership roles at Amdocs, a global telecom software provider, where he oversaw global sales, and ran a division addressing the needs of some of North America’s major telecommunications carriers. Earlier in his career, Eran’s experience spanned a number of sales leadership roles at Digital Equipment Corporation, as well as software engineering and program management. Eran holds an LL.B. degree in law from Tel-Aviv University, and a joint MBA degree from the Kellogg School of Management, Northwestern University, and the Recanati Graduate School of Business Administration, Tel-Aviv University."
