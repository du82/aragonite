["https://redis.io/blog/what-is-valkey"]
title = "What is Valkey? - Redis"
description = "Valkey is an open-source fork of Redis version 7.2.4. As time goes on, the two codebases will only diverge further."
full_description = "Companies like Niantic, HackerRank, Airbnb, Hulu, and OpenAI have used Redis to improve performance and reliability during high-traffic events, build and consolidate unified data platforms, and support scalable microservices environments. In 2024, Redis shifted its licensing plans to offer Redis Community Edition for free and offer the Redis source code through dual-source-available licensing. In reaction, some corporate contributors, such as Amazon AWS and Google Cloud, forked Redis and created Valkey, an open-source alternative to Redis. Though there’s currently significant overlap between Redis and Valkey, the two organizations have different teams and customer bases. And though they were both once based on the same code, they’ve begun to diverge in feature sets, functionality, capabilities, contributors, and more. Over time, the divergence is only likely to increase. Companies comparing the two need to consider each product offering as it stands today and examine the precedent and trajectory each product has established so far. Valkey is an open-source fork of Redis version 7.2.4. Redis and Valkey are fundamentally similar: Both offer an in-memory data store and cache that developers can use to store data as key-value pairs in RAM, allowing for processing speeds that far exceed the speeds of databases that access data via a disk or solid-state drive. In March 2024, Valkey launched with the support of The Linux Foundation, and in September 2024, Valkey announced Valkey 8.0, its biggest departure yet from the forked Redis code. As time goes on, the two codebases will only diverge further. As Kyle Davis, a maintainer for Valkey, said in April 2024, “From this point forward, Redis and Valkey are two different pieces of software.” Valkey, like Redis, provides an in-memory cache that provides high-performance queries with low data latency. As a result, Valkey provides some of the same features and suits some of the same use cases. Valkey, however, lacks all the features that Redis provides—features that help developers use Redis as an operational database."
author = "donna.bentley@redis.com"
