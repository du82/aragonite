["https://redis.io/compare/elasticache"]
title = "Redis Enterprise vs. AWS ElastiCache - Learn the Differences"
description = "Learn the differences between Elasticache vs Redis Enterprise: High Availability & resilience, performance and scalability, data models etc."
full_description = "ElastiCache is not Redis. Following the release of Redis 7.2, ElastiCache is no longer built on Redis—which means you won’t get support or product innovations from the original Redis experts with ElastiCache. Support offered for official Redis clients (Jedis, node-redis, redis-py, Redis Stack, Go Redis, Lettuce) Active-Active Geo Replication for simultaneous reads and writes to multiple geographically distributed nodes with data consistency Deploy multiple primary Redis nodes across the globe with seamless, two-way (read and write) global data distribution. Enhance data durability and enable precise recovery from failures by logging every write operation using an AOF. We offer full support for Redis clients, including Jedis, node-redis, redis-py, NRedisStack, Go-Redis, Lettuce, and more. Redis, an acronym for Remote Dictionary Server, is an in-memory data structure store. It can function as a database, key-value store, cache, session store and message broker. Originating in 2009 and developed by Salvatore Sanfilippo, Redis has since gained popularity for its performance, flexibility, reliability, and broad support for various data structures. The versatility of Redis has led to its adoption in a wide range of applications, from accelerating databases to acting as a message broker in real-time communication systems. Amazon ElastiCache is a web service offered by Amazon Web Services (AWS) to deploy a Redis alternative caching service in AWS. It is fully managed by Amazon and commonly used for basic caching and session storage. No, ElastiCache is not Redis. While Amazon ElastiCache provides a managed service based on open-source Redis 7.2, Amazon has chosen not to license future versions of Redis. Redis Cloud is the only service on AWS that offers future versions of Redis. In addition to all the functionality of Redis 7.2, Redis Cloud also includes the Redis Query Engine, active-active geo-replication, and many other advanced features. Both Redis and Amazon ElastiCache are caching solutions designed to optimize the performance of applications. However, their features and offerings differ in several key areas. While both solutions cater to similar use cases, Redis Cloud has enhanced capabilities around developer experience, deployment, management, performance and scalability plus advanced features like built-in query and search with the Redis Query Engine."
