["https://redis.io/customers/flowdesk"]
title = "Active-Active Redis Delivers Resiliency and High-Availability for Flowdesk - Redis"
description = "With Redis Enterprise on Google Cloud, Flowdesk’s global financial infrastructure executes more than 1M orders per day with <1ms latency and zero downtime."
full_description = "Flowdesk is an all-in-one cryptocurrency financial services platform for digital asset issuers. It has developed a trading infrastructure that connects more than a 100 centralized and decentralized exchanges. It provides market making, custody, brokerage, and treasury management services. Flowdesk needs to facilitate sub-second access to order books that store financial data across the globe. This requires a high-availability, low-maintenance database service that integrates with the Google Cloud ecosystem, supports Terraform, and enables VPC peering. Redis Enterprise on Google Cloud maintains client trading sessions by caching data about orders, prices, and market movements while Active-Active Redis simplifies data storing and sharing across geographic regions. Using Redis Enterprise on Google Cloud, Flowdesk’s global financial infrastructure executes more than 1 million orders per day with sub-millisecond latency and zero downtime. Flowdesk chose Redis Cloud because of its potential to sustain our growth. We haven’t been disappointed because we’ve been able to scale our services very economically. Founded in 2020, Flowdesk is a financial technology (fintech) company that combines significant experience in traditional markets with acute knowledge of algorithmic trading and cryptocurrencies. Flowdesk’s global trading network integrates more than 100 centralized and decentralized exchanges into an advanced technology infrastructure that brings cutting-edge crypto services to a worldwide client base. This proprietary technology platform, based on Redis Cloud, allows clients to trade and actively manage their own liquidity—a valuable capability for digital asset issuers who want to retain control of their assets. Flowdesk’s initial financial services setup was based on a database infrastructure from Cockroach Labs, together with Google Cloud Memorystore. However, as its trading service grew, the Flowdesk infrastructure team realized they needed a more robust database and cache system to support real-time trading and market-making activity. They wanted a cloud-based database with a global footprint that could easily synchronize data among multiple international regions."
