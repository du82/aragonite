["https://redis.io/cloud-partners/azure"]
title = "Redis on Azure - Cloud Partnership"
description = "Deploy, manage, and scale Redis in the cloud with this partnership between Redis & Azure."
full_description = "Microsoft is the first cloud service provider to license Redis as a first-party service to provide the Redis community with the continuity and consistency they’ve come to expect. Azure Managed Redis is the only fully-managed, co-engineered Redis designed for hyperscale cloud environments. With industry-leading 99.999% availability and customized performance and memory offerings—all backed by Microsoft’s trusted cloud—you’re getting the full stack of Redis capabilities across all Azure tiers. Get faster data infrastructure, including semantic caching, session caching, NoSQL database, vector database, and more. With Azure Managed Redis, you can build your own AI-powered apps to generate embeddings, process text queries, and provide natural language responses. Used as a vector database, Azure Cache for Redis functions as an external knowledge repository for generative models offering real-time updates. Redis stores vector embeddings and computes vector similarity with high performance and low latency. The Azure OpenAI integration makes building faster than ever. Whether you’re just starting out, experimenting, or scaling to enterprise workloads, Redis on Azure offers competitive total cost of ownership with pricing tailored to your performance and memory needs.​ Every tier of Azure Managed Redis is estimated to provide savings of more than 30% versus comparable offerings from Azure Cache for Redis. Azure Managed Redis introduces eight new data structures—JSON, vector, time series, and five probabilistic types—along with built-in advanced capabilities, such as vector search, secondary indexing for full-text search, exact matching, geospatial queries, numeric data handling, and fast data processing. Devs also have access to client libraries for .NET, Python, Java, Go, and Node. The built-in Redis Query Engine ensures apps get the specific data they need faster by aggregating, transforming, and filtering data straight in Redis. There’s no need to juggle where to store various pieces of data to speed them up since the most common data types can now all be stored and accessed fast straight from Redis."
