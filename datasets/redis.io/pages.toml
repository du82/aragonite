["https://redis.io/redis-vs-memorystore"]
title = "Redis vs. Memorystore"
description = "Redis offers more than Memorystore. See why we're the first choice for building fast apps fast."
full_description = "“Google Cloud Memorystore had drawbacks, and adding more Google Cloud servers to handle Raid groups is expensive. Adding Redis clusters is less expensive than deploying additional Google Cloud servers. We can deploy a large-scale cluster at a reasonable price.” Da Xing Staff Software Engineer, Niantic Memorystore is not Redis. Following the release of Redis 7.2, Memorystore is no longer built on Redis—which means you won’t get support or product innovations from the original Redis experts with Memorystore. “Google Cloud Memorystore had drawbacks, and adding more Google Cloud servers to handle Raid groups is expensive. Adding Redis clusters is less expensive than deploying additional Google Cloud servers. We can deploy a large-scale cluster at a reasonable price.” Deploy multiple primary Redis nodes across the globe with seamless, two-way (read and write) global data distribution. We offer full support for Redis clients, including Jedis, node-redis, redis-py, NRedisStack, Go-Redis, Lettuce, and more. Redis Enterprise was the former name for the enterprise-grade version of Redis. It offers superior capabilities compared to Redis Community Edition, source available Redis, open source Redis, Redis OSS, Redis core, Redis forks, and Redis substitutes like KeyDB, Valkey, and Dragonfly DB making it the ideal choice for developers seeking advanced performance, security, and scalability. With automated operations, a built-in proxy, and robust query & search features, Redis Enterprise enables faster and more reliable apps. Optimize your data management with Redis Enterprise for enhanced efficiency and innovation. Explore the benefits of Redis Enterprise over source available and open source Redis. Redis Community Edition is the next evolution of the open source Redis project. It is completely source available and will merge features and functionality from the Redis Stack project such as JSON, query and search, time series, probabilistic functions (i.e. Bloom, Cuckoo, top-k) and vector search."
