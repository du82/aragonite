["https://redis.io/nosql/what-is-nosql"]
title = "What Is NoSQL - Redis"
description = "A NoSQL database is designed for large-scale data storage and processing. See why developers love them, how they differ from SQL databases, and more."
full_description = "A NoSQL database (also known as “no SQL” or “not only SQL”) is a distributed, non-relational database designed for large-scale data storage and massively parallel, high-performance data processing across many commodity systems. Unlike the traditional relational database approach, NoSQL gives you a way to work with data closer to the application. It is a modern data storage paradigm that provides data persistence for environments where high performance is the primary requirement. Within a NoSQL database, data is stored so that both writing and reading are fast, even under heavy load. NoSQL databases are typically distributed systems where several machines work together in clusters. Each piece of data is replicated over those machines to deliver redundancy and high availability. The ability to store vast amounts of data in a distributed manner makes NoSQL databases faster to develop and deploy. NoSQL databases are built for specific data models and have flexible schemas, allowing programmers to create and manage modern applications. A NoSQL datastore is non-relational, distributed, flexible, and scalable. Additionally, some common features of NoSQL database management systems include data clustering, flexible schema, replication support, and eventual consistency, which compares to traditional SQL database systems’ usual ACID transaction capability ensuring data integrity. Unlike SQL databases, NoSQL database systems were initially developed as open source, with almost all of them now having an enterprise option available. Open source allows for a large community of supporters who contribute to the database, which increases innovation and the variety of solutions it addresses. Having an open source option means that developers can quickly and easily try new NoSQL databases at no cost. Redis is an open source, in-memory key-value data structure store, which can be used as a database, cache, or message broker. Redis Enterprise is based on Redis open source and is a NoSQL database but also includes vital functionality to make it enterprise-hardened, with the inclusion of Redis support. Redis Enterprise is infinitely and linearly scalable, has 5-9s high availability, and can be easily geo-distributed. Redis open source is entirely compatible with Redis Enterprise."
