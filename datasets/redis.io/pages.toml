["https://redis.io/blog/redis-2021-gartner-magic-quadrant-cloud-database-management-systems"]
title = "Redis Recognized in 2021 Gartner® Magic Quadrant™ for Cloud Database Management Systems - Redis"
description = "Redis has been recognized in the 2021 Gartner® Magic Quadrant™ for Cloud Database Management Systems report. Read more in the Redis blog."
full_description = "Over the past two years, the database market has transformed dramatically. As we started 2020 we were still in the early stages of moving data processing and analytics to the cloud. Within a few months, businesses have accelerated from the crawl and walk phase with cloud initiatives to running and sprinting in modernizing their existing apps and launching new greenfield apps. To quantify this shift, Gartner reports, “By 2022, cloud database management system (DBMS) revenue will account for 50% of the total DBMS market revenue.” This has been pushed up a year earlier than Gartner forecasted in the inaugural “Magic Quadrant for Cloud Database Management Systems.” With this as a backdrop, we’re honored Redis has been recognized by Gartner for the second consecutive year as a Challenger in the December 2021 “Magic Quadrant for Cloud Database Management Systems.” Subscribed members can access the report here. We believe this acknowledgment is a reflection of our “One Redis” vision––to deliver a platform that can provide our customers not only with the speed, but also the ability to build their apps seamlessly, flexibly across cloud providers, and scale them across the globe. We’ve designed Redis Enterprise Cloud to be a true real-time data platform that allows developers, cloud architects, and DevOps practitioners to deploy both enterprise caching and primary database capabilities as a single solution that can address a myriad of use cases. As Gartner states, “The initial move by vendors to the cloud is now nearly over, with developments now more about exploiting the cloud. The cloud-native vendors began by offering simple cloud offerings and are now expanding them by providing more-sophisticated features.” Gartner delves into greater detail in the accompanying December 2021 report “Critical Capabilities for Cloud Database Management Systems for Operational Use Cases.” It evaluates vendors for traditional transactions, augmented transactions processing, stream/event processing, and operation intelligence use cases. These use cases capture usage scenarios for end users for operational needs."
author = "Steve Naventi"
year_published = 2022
year_updated = 2023
