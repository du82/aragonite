full_description = "BioCatch is the global leader in behavioral biometrics. Its game-changing technology is designed to identify users in a wide variety of use cases via characteristics as subtle as the way they hold their phones or scroll across a screen. With 70 million users and up to 40,000 operations per second, BioCatch’s database needed to be incredibly responsive, highly available, and easy to scale. BioCatch relies on Redis Cloud, a fully managed Database-as-a-Service, which serves an average of 3TB of data and 200 million keys at any given moment to the many microservices that power the company’s applications architecture. Because Redis Cloud is a fully managed service, the BioCatch team’s time and resources have been freed up to work on strategic projects. Plus, since deploying Redis Cloud, BioCatch has had zero downtime and realizes an average latency of less than 0.96 milliseconds, even at peak traffic. Most of our data now resides in Redis Cloud because it’s always available and it’s always highly responsive, no matter how you query it. James typically texts using his index finger. One day, he’s driving in his car with his daughter and gets a message from his wife. He asks his daughter to respond, and like most teenagers, she uses her thumbs to rapidly type out the message. James’ wife never notices the difference, which doesn’t matter in this case. But BioCatch, the global leader in behavioral biometrics, uses its game-changing technology to note differences in the way users handle their phones for fraud detection and mitigation. BioCatch can track subtle differences in how users hold their phones or scroll across a screen to identify users in a wide variety of use cases. As BioCatch’s unique technology attracted more customers, however, its existing stack could not keep pace with the 5 billion transactions per month the company was processing. Plus, scaling concerns consumed the technology team’s attention, leaving few resources to focus on new product features."
