full_description = '''Develop with Redis What's new? Quick starts Client tools Client APIs Understand data types Interact with data Redis Query Engine Basic constructs Indexing Query Use cases Advanced concepts Best practices Administration Deprecated Programmability Transactions Pub/sub Redis for AI Use Redis Reference Libraries and tools Redis products Commands document.addEventListener("DOMContentLoaded", function() { const sidebar = document.getElementById('sidebar'); const footer = document.querySelector('footer'); window.addEventListener('scroll', function() { const scrolledHeight = window.scrollY + window.innerHeight; if (scrolledHeight >= footer.offsetTop) { sidebar.style.maxHeight = `calc(100vh - 7rem - ${scrolledHeight - footer.offsetTop}px)`; } else { sidebar.style.maxHeight = 'calc(100vh - 7rem)'; } }); }) Docs Docs → Develop with Redis → Interact with data in Redis → Redis Query Engine Redis Query Engine Searching and querying Redis data using the Redis Query Engine The Redis Query Engine offers an enhanced Redis experience via the following search and query features: A rich query language Incremental indexing on JSON and hash documents Vector search Full-text search Geospatial queries Aggregations You can find a complete list of features in the reference documentation. The Redis Query Engine features allow you to use Redis as a: Document database Vector database Secondary index Search engine Here are the next steps to get you started: Follow our quick start guide to get some initial hands-on experience. Learn how to create an index. Learn how to query your data. Install Redis Insight, connect it to your Redis database, and then use Redis Copilot to help you learn how to execute complex queries against your own data using simple, plain language prompts. Enable the Redis Query Engine The Redis Query Engine is not available by default in the basic Redis server, so you should install Redis Stack or Redis Enterprise, both of which include Redis search and other useful modules. See Install Redis Stack or Install Redis Enterprise for full installation instructions. License and source code The Redis Query Engine features of Redis Stack are available under the Source Available License 2.0 (RSALv2) or the Server Side Public License v1 (SSPLv1). Please read the license file for further details. The source code and the detailed release notes are available on GitHub. Do you have questions? Feel free to ask at the RediSearch forum. Redis Ltd. provides commercial support for Redis Stack. Please see the Redis Ltd. website for more details and contact information. Basic constructs Basic constructs for searching and querying Redis data Indexing How to index and search JSON documents Query data Understand how to query, search, and aggregate Redis data Use cases Redis Query Engine use cases Advanced concepts Details about query syntax, aggregation, scoring, and other search and query options Best practices Redis Query Engine best practices Administration Redis Query Engine Administration Deprecated Deprecated features RATE THIS PAGE ★ ★ ★ ★ ★ Back to top ↑ Submit document.addEventListener("DOMContentLoaded", function() { const form = document.querySelector("#page-feedback"); form.addEventListener("submit", function(event) { event.preventDefault(); var xhr = new XMLHttpRequest(); var url = "\/docusight\/api\/rate"; var params = new URLSearchParams(new FormData(form)); xhr.open("POST", url, true); xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded"); xhr.onreadystatechange = function() { if (xhr.readyState === 4 && xhr.status === 200) { const responseData = JSON.parse(xhr.responseText); const responseMessage = responseData.response; const newText = document.createTextNode(responseMessage); form.parentNode.replaceChild(newText, form); } }; xhr.send(params); }); }); Edit this page Create an issue On this page Enable the Redis Query Engine License and source code'''
