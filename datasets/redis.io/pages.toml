description = "Experience Redis Enterprise Cloud's power with a 14-day free trial on AWS Marketplace. Test advanced features for caching, analytics, messaging, and more."
full_description = "For two full weeks, you can explore the full power of Redis Cloud with no upfront costs or commitments. That gives you an opportunity to try Redis for a variety of use cases. Among them: caching, real-time analytics, publish/subscribe messaging, geo-location support, vector database analysis, and a whole lot more. Redis Cloud is the only option on AWS that delivers sub-millisecond speeds, provides 99.999% uptime, and saves up to 80% on infrastructure costs (compared to other Redis-compatible managed services). Our partnership helps existing AWS users access Redis Cloud’s simplified and automated database provisioning, billed directly from their AWS accounts. Redis Cloud is the most performant, reliable, and easy to use version of Redis, and getting started on AWS is easy and efficient. No matter where you are in your cloud journey, there’s an option to meet your needs. Hybrid? Multi-cloud? No problem. The free trial lasts for a 14-day period, OR when you use up to $500 in database subscriptions, whichever comes first. During the free trial, you can access Redis Cloud with full features, including product support access. Consult the step-by-step instructions to learn what’s involved, and sign up through the AWS Marketplace. At the end of the trial period, you will automatically be subscribed as a Redis Cloud pay-as-you-go customer, unless you cancel your subscription first. If you have any questions during the trial or need sign-up assistance, email [email protected] to connect with a Redis expert. If you are currently a Redis Cloud customer, you may qualify for a Marketplace credit or proof of concept program. Fill out the form to get assistance from a Redis expert to learn about your options."
