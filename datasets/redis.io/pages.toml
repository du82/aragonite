["https://redis.io/customers/liftoff"]
title = "Liftoff’s Ad Exchange Soars with Redis Cloud’s Low Latency - Redis"
description = "Liftoff’s popular ad tech services depend on Redis Enterprise Cloud to complete more than 1 million operations per second."
full_description = "Liftoff needed a high-availability, low-latency database that could meet the demands of thousands of app publishers and advertisers. The database had to be able to support a multi-cloud architecture and cache an immense volume of data for fast, low-latency access. Liftoff uses Redis Cloud to maintain data generated from billions of events and devices. This rapidly growing cache of key-value data allows Liftoff to deliver accurate, pertinent ad impressions. Liftoff’s popular ad tech services depend on Redis Cloud to complete more than 1 million operations per second. Redis technologies such as the Cuckoo Filter allow Liftoff to improve ad relevance and quality, improving ROI. Reliability is very crucial for us! We maintain data on billions of devices and thousands of advertisers. Redis Cloud reduces the overhead required to deploy a database at scale and enables us to achieve stability within a short period of time. Today’s mobile application developers face huge challenges due to the huge and incredibly diverse ecosystems. The challenge is further compounded by the ever-evolving privacy laws. Ultimately, the key to overcoming these challenges is to have effective ways to collect feedback from relevant customers and prospects, presenting them with ads that are most relevant and likely to resonate. Liftoff has been at the forefront of changing how brands think about growing their app businesses. From being the first to develop an ROI-focused approach to optimizing users to finding new ways of helping mobile businesses get more from their apps, Liftoff’s goal has always been to help mobile app companies connect to their audiences. Redis Cloud lies at the heart of Liftoff’s popular suite of ad tech solutions, where it maintains a cache of data generated from billions of events and devices. The cache stored in Redis serves as foundational data that allows Liftoff to improve ad relevance and quality which eventually lead to optimal ROI. “Liftoff helps app owners and app publishers connect to their audiences by fueling the entire mobile app growth cycle across user acquisition, engagement, monetization, and analytics,” explains Surya Dharma, director of production engineering team for Liftoff’s Direct Monetize and Vungle Exchange (DMX). “Our goal is to connect people to the mobile apps and tools they love.”"
