["https://redis.io/blog/whats-the-best-embedding-model-for-semantic-caching"]
title = "What’s the best embedding model for semantic caching? - Redis"
description = "Semantic caching is changing how we optimize systems reliant on large language models. By using vector embeddings, it enables faster queries."
full_description = "Semantic caching is changing how we optimize systems reliant on large language models (LLMs). By using vector embeddings, it enables faster, cost-effective responses for similar queries. But to get it right, developers need to tackle three main challenges: Like a traditional cache, a semantic cache serves as an in-memory layer that delivers pre-calculated responses, avoiding the need to repeat lengthy computations. But unlike a traditional cache that retrieves data based on exact key matches, a semantic cache retrieves matches based on similarity. It uses vector embeddings to represent queries, and a cache hit occurs when the distance between two query vectors is below a set threshold. This lets the system serve pre-calculated responses for similar queries, even if they aren’t identical. Why is this important? Invoking LLMs is often the most expensive, slow, and repetitive (Gill et al., 2024) part of RAG/Agentic systems. Semantic caching helps by: Semantic caching works well for many use cases, but it can also lead to false positives and false negatives. In a traditional cache, a key is either present or absent, resulting in a binary outcome. With semantic caching, a cached response could be returned for a query that is semantically similar but requires a different answer. This makes it crucial to set the right distance threshold and use effective embedding models to ensure accuracy. To evaluate embedding models for semantic caching, we started with this dataset structured as pairs of questions labeled as duplicates or not. For example: We evaluated the results using confusion matrices to track true positives, false positives, true negatives, and false negatives across various distance thresholds. From these matrices, we derived key metrics including precision, recall, and F1 score to assess model performance. We then recorded average latency for each model and measured embedding dimensions as a proxy for memory usage. Finally, we compiled the metrics, visualized the results, and identified the best-performing model for semantic caching applications."
author = "kevin.wiley@redis.com"
