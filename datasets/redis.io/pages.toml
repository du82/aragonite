["https://redis.io/blog/redis-8-0-m03-is-out-even-more-performance-new-features"]
title = "Redis 8.0-M03 is out. Even more performance & new features. - Redis"
description = "Redis 8.0 Community Edition Milestone 3 reduces command latency by up to 87%, deliver 100% more throughput, reduces replication time by 18%, and is available now."
full_description = "We’re happy to announce the third milestone of Redis 8.0, our most advanced and performant offering yet. As we progress toward the general availability (GA) release, we’re committed to continuing to roll out new features and improve existing ones. In the previous milestones, we introduced new data structures: JSON, time series, and 5 probabilistic data structures (previously available as separate Redis modules). We also introduced significant performance improvements and added the capability to scale the Redis Query Engine both vertically and horizontally. To showcase this new achievement, we created a vector search benchmark with 1 billion 768-dimensions vectors running on a Redis Community Edition cluster. Now, in CE 8.0 M03 (Milestone 3 pre-release), we’re introducing new additional performance improvements for both single-core and multi-core environments by using a new asynchronous I/O threading implementation along with an improved replication mechanism, delivering better performance and robustness than any previous Redis release. In Milestone 3, we introduce additional latency improvements to PFCOUNT, PFMERGE, GET, EXISTS, LRANGE, HSET, LRANGE, and HGETALL. We also improved the performance of CRC64 calculations and commands with a large argument count. That makes Redis 8.0 the Redis release with both the most number of improvements and the absolute most performance increases compared to any previous Redis release. We have further reduced the latency per command for an even wider set of commands compared to Redis 7.2.5. In our benchmark of 149 tests, 90 delivered latency reduction. The latency reduction ranges from 5.4% to 87.4% with a median of 16.7%. For the complete list of performance improvements, please take a look at the “Performance and resource utilization improvements” sections in the 7.4 RC1, 8.0 M01, 8.0-M02, and 8.0-M03 release notes. Since 6.0, Redis has been able to use I/O threads to handle client requests, including socket reads, socket writes, and command parsing. However, the implementation didn’t capture the full performance benefits."
author = "donna.bentley@redis.com"
