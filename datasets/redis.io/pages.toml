number of items Adds one or more items to a Bloom filter. This command is similar to BF.ADD, except that you can add more than one item. This command is similar to BF.INSERT, except that the error rate, capacity, and expansion cannot be specified. Required arguments key is key name for a Bloom filter to add the items to. If key does not exist - a new Bloom filter is created with default error rate, capacity, and expansion (see BF.RESERVE). item... One or more items to add. Return value Returns one of these replies: Array reply where each element is either Integer reply - where "1" means that the item has been added successfully, and "0" means that such item was already added to the filter (which could be wrong) [] when the item cannot be added because the filter is full [] on error (invalid arguments, wrong key type, etc.) Examples redis> BF.MADD bf item1 item2 item2 1) (integer) 1 2) (integer) 1 3) (integer) 0 RATE THIS PAGE ★ ★ ★ ★ ★ Back to top ↑ Submit document.addEventListener("DOMContentLoaded", function() { const form = document.querySelector("#page-feedback"); form.addEventListener("submit", function(event) { event.preventDefault(); var xhr = new XMLHttpRequest(); var url = "\/docusight\/api\/rate"; var params = new URLSearchParams(new FormData(form)); xhr.open("POST", url, true); xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded"); xhr.onreadystatechange = function() { if (xhr.readyState === 4 && xhr.status === 200) { const responseData = JSON.parse(xhr.responseText); const responseMessage = responseData.response; const newText = document.createTextNode(responseMessage); form.parentNode.replaceChild(newText, form); } }; xhr.send(params); }); }); Edit this page Create an issue See also BF.ADD BF.CARD BF.EXISTS BF.INFO BF.INSERT BF.LOADCHUNK BF.MADD BF.MEXISTS BF.RESERVE BF.SCANDUMP'''
