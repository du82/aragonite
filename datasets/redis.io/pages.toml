s an item to a Bloom filter. This command is similar to BF.MADD, except that only one item can be added. Required arguments key is key name for a Bloom filter to add the item to. If key does not exist - a new Bloom filter is created with default error rate, capacity, and expansion (see BF.RESERVE). item is an item to add. Return value Returns one of these replies: Integer reply - where "1" means that the item has been added successfully, and "0" means that such item was already added to the filter (which could be wrong) [] on error (invalid arguments, wrong key type, etc.) and also when the filter is full Examples redis> BF.ADD bf item1 (integer) 1 redis> BF.ADD bf item1 (integer) 0 RATE THIS PAGE ★ ★ ★ ★ ★ Back to top ↑ Submit document.addEventListener("DOMContentLoaded", function() { const form = document.querySelector("#page-feedback"); form.addEventListener("submit", function(event) { event.preventDefault(); var xhr = new XMLHttpRequest(); var url = "\/docusight\/api\/rate"; var params = new URLSearchParams(new FormData(form)); xhr.open("POST", url, true); xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded"); xhr.onreadystatechange = function() { if (xhr.readyState === 4 && xhr.status === 200) { const responseData = JSON.parse(xhr.responseText); const responseMessage = responseData.response; const newText = document.createTextNode(responseMessage); form.parentNode.replaceChild(newText, form); } }; xhr.send(params); }); }); Edit this page Create an issue See also BF.ADD BF.CARD BF.EXISTS BF.INFO BF.INSERT BF.LOADCHUNK BF.MADD BF.MEXISTS BF.RESERVE BF.SCANDUMP'''
