title = "NoSQL Database for Game Development | Redis Enterprise"
description = "Build and scale great player experiences with the world’s most-loved database. Level up now!"
full_description = "RedisConf 2021: Lessons learned operating Redis Clusters at Roblox Roblox relies heavily on its Redis and Memcached caching layers to support the experiences of its 150 million monthly active users. Early in 2020, the company experienced reliability and infrastructure management bottlenecks with its caching deployments and decided to invest in building a fully automated way to operate open-source Redis Clusters via Docker on top of Hashicorp's Nomad scheduler. Watch now How Unity is using Redis Enterprise and Google GKE to remove friction from their gaming platform Unity DevOps manager, Alex Curtin, discusses how the platform's migration to a Redis Enterprise GKE architecture allowed the gaming company to scale its user base with enhanced resiliency, decreased load management overhead, and high-availability. Watch now HOW ROBLOX USES PUB/SUB Roblox is the world’s largest social platform for play. Every month, over 48 million players imagine, build, and play together within immersive 3D worlds. Roblox uses both the open source Redis as well as Redis Labs Enterprise Cluster extensively, with over 400 Redis server instances in production use. Watch now Not Playing Around: Redis Enterprise for Gaming Redis Enteprise’s low latency and real-time response helps you create better games. Learn more Level Up Your Gametech With a Real-Time Database In player-vs.-player games, choosing opponents is critical. Consider these three factors. Learn more The Game Developer’s Guide to Matchmaking In player-vs.-player games, choosing opponents is critical. Consider these three factors. Learn more Meet industry experts Personalization is critical to driving player engagement, but this comes with real-time performance and scalability challenges. Statistics show that highly-engaged players have an increased customer lifetime value which places even more emphasis on gaming companies to master personalization. Watch now 4 Ways to Improve Player Engagement with Real-Time Data Player engagement is the number one priority for game companies. The gaming industry is fiercely competitive and it’s sink or swim. To keep your head above the water… Learn more"
