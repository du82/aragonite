["https://redis.io/blog/welcome-back-to-redis-antirez"]
title = "Welcome back to Redis, antirez - Redis"
description = "We’re beyond excited to welcome Salvatore Sanfilippo – you probably know him as “antirez” – back to Redis. Salvatore built Redis in 2009, and the project until 2020 when he took a break to focus on his family and other projects. In this post, he explains what brought him back to Redis after an extended […]"
full_description = "We’re beyond excited to welcome Salvatore Sanfilippo – you probably know him as “antirez” – back to Redis. Salvatore built Redis in 2009, and the project until 2020 when he took a break to focus on his family and other projects. In this post, he explains what brought him back to Redis after an extended break. We’re thrilled to have him back in his new role as a Redis evangelist, and look forward to him helping us continue to build our community. This post originally appeared under the title “From where I left” on Salvatore’s personal blog. We’re republishing it with permission. I’m not the kind of person that develops a strong attachment to their own work. When I decided to leave Redis, about 1620 days ago (~ 4.44 years), I never looked at the source code, commit messages, or anything related to Redis again. From time to time, when I needed Redis, I just downloaded it and compiled it. I just typed “make” and I was very happy to see that, after many years, building Redis was still so simple. My detachment was not the result of me hating my past work. While in the long run my creative work was less and less important and the “handling the project” activities became more and more substantial — a shift that many programmers are able to do, but that’s not my bread and butter — well, I still enjoyed doing Redis stuff when I left. However, I don’t share the vision that most people at my age (I’m 47 now) have: that they are still young. I wanted to do new stuff, especially writing. I wanted to stay more with my family and help my relatives. I definitely needed a break. However, during the “writing years” (I’m still writing, by the way), I often returned to coding, as a way to take breaks from intense writing sessions (writing is the only mental activity I found to be a great deal more taxing than coding): I did a few embedded projects; played more with neural networks; built Telegram bots: a bit of everything. Hacking randomly was cool but, in the long run, my feeling was that I was lacking a real purpose, and every day I started to feel a bigger urgency to be part of the tech world again. At the same time, I saw the Redis community fragmenting, something that was a bit concerning to me, even as an outsider."
author = "donna.bentley@redis.com"
