["https://redis.io/blog/visit-redis-at-reinvent-2023"]
title = "Visit Redis at re:Invent 2023 - Redis"
description = "AI has suddenly arisen as a tremendous opportunity for businesses and society as a whole."
full_description = "Last November, only the most astute followers of technology trends would have questioned if this blog – or any blog – was generated by AI. Given the recent emergence of large language models (LLMs) like ChatGPT, that is now a legitimate question we all frequently ask about content we consume. Dystopian nightmares or ethical concerns aside, AI has suddenly arisen as a tremendous opportunity for businesses and society as a whole. Teams are investing heavily into this technology because it promises to make them far more agile and efficient. AI can be used to automate repetitive tasks, reduce human error, interact with customers, and even aid with innovation (developing software) or make smart and high stakes decisions (detecting cancer). If you’re like the majority of technology teams today, you’re abruptly faced with the challenges associated with your company’s clamor to realize these benefits and incorporate AI into your technology stack. Just as Redis was at the forefront of a new generation of real-time applications over a decade ago, it’s also emerged as a preferred technology for the coming generation of AI-driven apps. Redis is now an essential component of many AI-based Q&A chatbots, recommendation systems, document search and retrieval systems, and fraud detection applications. Find us at re:Invent and we’d be happy to dive deeper into how Redis can make it easier for you to build Large Language Model (LLM)-powered AI apps. Discover how we can make your AI apps faster, more accurate, easier to build, and less expensive, with: Retrieval Augmented Generation (RAG), semantic caching, and semantic search. If you’re interested in learning more about retrieval augmented generation, come see our session: “Real-time RAG: How to Augment LLMs with Redis and Amazon Bedrock” as our very own AI expert, Sam Partee, presents on November 29 at 12:00PM at the Lightning Theater – Data Zone. The need for cost savings has been another major focus area over the many months since last re:Invent as headlines have been replete with stories of missed revenue projections. This has furthered the need for businesses to tighten their belts, and technology budgets have been no exception. As a result, teams running workloads in AWS must do more with less."
