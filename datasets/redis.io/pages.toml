title = "Tom Rabaut - Redis"
description = "Tom is an experienced go-to-market and product executive with over 20 years experience growing successful software and technology companies. Prior to Redis, Tom was the Senior Vice President of Customer Engagement at Zscaler where he was responsible for Customer Success, Solution Consulting, Professional Services and Renewals. Tom was part of the go-to-market leadership team that […]"
full_description = "Tom is an experienced go-to-market and product executive with over 20 years experience growing successful software and technology companies. Prior to Redis, Tom was the Senior Vice President of Customer Engagement at Zscaler where he was responsible for Customer Success, Solution Consulting, Professional Services and Renewals. Tom was part of the go-to-market leadership team that successfully grew Zscaler from $400 million to over $2 billion in annual reoccurring revenue. Previously Tom spent 8 years at AppDynamics in Sales Engineering and Product executive roles. As one of the first 50 employees, Tom helped grow AppDynamics from $12M to over $800M in revenue and a $3.8 billion acquisition by Cisco."
