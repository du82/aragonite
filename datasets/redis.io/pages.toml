n is the number of items Determines whether one or more items were added to a Bloom filter. This command is similar to BF.EXISTS, except that more than one item can be checked. Required arguments key is key name for a Bloom filter. item... One or more items to check. Return value Returns one of these replies: Array reply of Integer reply - where "1" means that, with high probability, item was already added to the filter, and "0" means that key does not exist or that item was definitely not added to the filter. [] on error (invalid arguments, wrong key type, etc.) Examples redis> BF.MADD bf item1 item2 1) (integer) 1 2) (integer) 1 redis> BF.MEXISTS bf item1 item2 item3 1) (integer) 1 2) (integer) 1 3) (integer) 0 RATE THIS PAGE ★ ★ ★ ★ ★ Back to top ↑ Submit document.addEventListener("DOMContentLoaded", function() { const form = document.querySelector("#page-feedback"); form.addEventListener("submit", function(event) { event.preventDefault(); var xhr = new XMLHttpRequest(); var url = "\/docusight\/api\/rate"; var params = new URLSearchParams(new FormData(form)); xhr.open("POST", url, true); xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded"); xhr.onreadystatechange = function() { if (xhr.readyState === 4 && xhr.status === 200) { const responseData = JSON.parse(xhr.responseText); const responseMessage = responseData.response; const newText = document.createTextNode(responseMessage); form.parentNode.replaceChild(newText, form); } }; xhr.send(params); }); }); Edit this page Create an issue See also BF.ADD BF.CARD BF.EXISTS BF.INFO BF.INSERT BF.LOADCHUNK BF.MADD BF.MEXISTS BF.RESERVE BF.SCANDUMP'''
