description = "Learn how to build a Retrieval Augmented Generation (RAG) pipeline using the Redis Vector Library (RedisVL). Explore vector embeddings, data preprocessing, and AI-driven retrieval techniques to create intelligent apps."
full_description = "You know that mix of excitement and uncertainty when you’re starting something new? That’s exactly how I felt when I set out to build a Retrieval Augmented Generation (RAG) pipeline using the Redis Vector Library. RAG might sound like just another buzzword, but it’s really about using the power of semantic search and large language models to create smarter, more efficient ways of finding and using information. For someone like me, who’s constantly searching for ways to sharpen my technical skills, this was the perfect challenge.What followed was a rollercoaster of wins, setbacks, and “aha!” moments. From understanding how to preprocess data for semantic search to learning about vector embeddings and schema design, this project was as much about discovery as it was about building. This is my way of sharing the full experience—wins, challenges, and everything in between. If you’re interested in Redis, RedisVL, RAG, or just curious about tackling technical projects, this is for you. I’m Rini, and my journey into tech has been anything but straightforward. I started out as a backend software engineer, burying myself in code and solving tricky technical problems. But over time, I found myself drawn to a different kind of problem-solving: understanding the needs of developers and bringing technical products to life in ways that truly resonate with users. That is what led me to my current role as a Product Marketing Manager (PMM) for AI at Redis. Even though I’ve traded daily coding for marketing strategies, my curiosity for the technical side hasn’t faded. As a PMM, understanding our products inside out is key to helping users get the most out of them. That is why I rolled up my sleeves and built out my first RAG pipeline.This Redis Vector Library felt like a great starting point. It’s at the forefront of intelligent search and AI-driven apps, and it gave me a chance to explore RAG—a technology I’ve been hearing so much about. The main focus of my project was to build a RAG pipeline from scratch using the Redis Vector Library. I worked my way through this Redis tutorial to get started with RedisVL. RAG is an exciting technology that pairs semantic search with large language models (LLMs) to retrieve relevant information and generate accurate, context-aware answers. By tackling this project, I aimed to understand both the fundamentals of RAG and how Redis can power such applications.The Redis Vector Library was an essential tool for this project. It simplifies working with vector embeddings, making fast and precise semantic search possible, which is key to building a functional RAG pipeline. RedisVL makes it easy to store, search, and get important data."
