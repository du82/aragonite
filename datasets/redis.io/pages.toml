["https://redis.io/data-integration"]
title = "Redis Data Integration (RDI)"
description = "Use RDI and Redis Enterprise to deliver real-time speeds without refactoring, writing new code, or exhausting integration efforts."
full_description = "Redis Data Integration (RDI) is a powerful tool that synchronizes data from your existing database into Redis in near real time. We do the heavy lifting, so you can make slow data fast, scale limitlessly, and stop wasting money on excessive database costs—all without writing code. Improve customer experiences by ensuring data is always in sync. Eliminate cache misses and stale data and overcome the limitations of traditional cache-aside. Quickly launch real-time apps at any scale. Stop wasting resources with multiple teams manually building data pipelines to sync data. Easily manage data and keep it in sync with configuration–not code. Forget the days of spending dev time building a data pipeline or spending money on commercial data integration tools. Instead of paying for expensive read-replicas, offload reads to Redis. We cover a lot of databases: Oracle, PostgreSQL, MySQL, MariaDB, Percona XtraDB, Microsoft SQL Server, MongoDB, Cassandra, Google Cloud SQL, and more. Identify, transform, and instantly ingest data from your database into Redis to keep your database and Redis in sync—without writing code. With our RDI integration, you can create, validate, deploy, and visualize your data pipelines seamlessly from within Redis Insight. RDI is built for high-availability, is self-healing, and provides a delivery guarantee of at-least-once so you can integrate your data with confidence. RDI supports popular ops tools, like RDI CLI and Grafana dashboard, with metrics via Prometheus exporter. Because RDI prefetches your full dataset in the format your app needs, you can query your data directly in Redis in real time."
