["https://redis.io/customers/docugami"]
title = "Redis Enterprise Powers Docugami’s LLM Transforming Documents into Actionable Data- Redis"
description = "Redis Enterprise streamlines the generative AI project lifecycle, from caching Apache Spark data to enabling vector similarity search on Docugami's knowledge base."
full_description = "Docugami uses generative AI technology to transform how businesses create and manage documents. Its proprietary Business Document Foundation Model turns business documents into data. Docugami is cross-segment, with customers across many industries from commercial insurance to health care to real estate to professional services and more. After experiencing performance and latency challenges with its Apache Spark data processing environment, Docugami sought a solution to store checkpoint data in a database cache to speed up processing. Docugami also needed a vector database that could accelerate essential generative AI tasks such as retrieval-augmented generation (RAG), in-context learning (ICL), and vector search. Redis Enterprise provides a comprehensive data management platform that helps streamline key aspects of the generative AI project lifecycle, from caching Apache Spark checkpoint data to enabling VSS on the document knowledge base. Redis also provides a vector store for Docugami’s ML pipelines, in conjunction with Auto Tiering to extend databases beyond DRAM, document indexing, and AI-powered search capabilities. Redis Enterprise makes it easy to store, search, and update vector embeddings at scale, improving the user experience by ensuring that Docugami’s foundation model receives the most timely, relevant and up-to-date context. Redis also mitigated the bottlenecks in Docugami’s Apache Spark processing pipeline, which was stymied due to high I/O. Redis Enterprise is a game-changer and a wonderful partner. It is a fast, high-performance database that has improved our Apache Spark document processing pipeline and enabled more accurate hybrid semantic search for our document chunk embeddings. According to an August 2023 report from McKinsey & Company, nearly 22 percent of today’s knowledge workers use generative AI systems for their work.1 Docugami is on the crest of this rising wave with a unique family of large language models (LLMs) that can be applied to corporate business documents."
