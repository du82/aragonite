["https://redis.io/enterprise"]
title = "Enterprise Adoption Fuels Redis Labs’ Rising Momentum - Redis"
description = "Enterprise adoption fuels Redis Labs' rising momentum. Read the press release at Redis.com."
full_description = "Redis is the preferred database foundation for mission-critical real-time applications across an expanding range of use cases and industries Mountain View, February 21, 2017—Redis, the home of Redis and provider of Redis Enterprise, today announced continued growth in 2016 and reported a substantial increase in enterprise customers year over year. In the past year, more than 1,300 enterprises adopted the Redis Enterprise (Redise) platform including Fortune 100 companies across many industries, two of the top three telecommunications companies and five of the top ten U.S technology companies. With organizations facing increasingly complex data challenges, Redis enables enterprises to efficiently meet their real-time data needs. The Redise platform serves over 61,000 accounts globally, including 7,000 enterprise customers, deployed on-premises or in public, private and hybrid clouds. Redis’ entire portfolio enhances open source Redis with automated, seamless scaling and always-on availability while fully supporting all its commands, data structures, and modules. In the last year, Redis has added new enterprise customers including Vodafone, Dell, TD Bank, Verizon, Atlassian, DBS, Menards, RingCentral, TaxAct, EverBank, KPMG, Shutterfly, Staples and Amdocs. In 2016, the Redise platform powered a multitude of solutions including mobile applications, e-commerce, customer engagement applications and real-time analytics. Enterprises rely on Redise to power high-speed transactions, streamline job, queue and user session management, increase application scalability, achieve real-time analytics and handle high-speed data ingest. Additionally, over 70 percent of Redis’ customers use Redise as a primary database and plan to move more of their business-critical data from other data stores such as RDBMS-es as well as NoSQLs like MongoDB, Cassandra, and others. “The NoSQL market is quickly evolving beyond developer-led projects and moving toward enterprise-wide deployments to support real-time business applications,” said Ofer Bengal, CEO at Redis. “As a result, global organizations in a variety of verticals are increasingly embracing Redise as their number one deployment choice for new applications that require enterprise-class high availability, effortless scaling, and reduced operational overhead.”"
