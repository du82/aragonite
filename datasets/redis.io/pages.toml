["https://redis.io/customers/apna"]
title = "Apna Empowers India's Job Seekers with Redis Cloud’s Resiliency and Low Latency - Redis"
description = "Redis Cloud fuels Apna’s professional networking platform, from caching data on millions of jobs, to improving query performance with cache prefetching."
full_description = "Apna is India’s largest professional networking and job opportunities platform. Its popular data-driven app uses AI algorithms to revolutionize the way job seekers connect with opportunities. To manage billions of rows of data and 50,000 read/write operations per second, Apna needed a high-performance database caching solution that could handle an escalating volume of traffic, mitigating issues with latency that were causing customer churn. Redis Cloud caches data on millions of jobs, and cache prefetching improves query performance by anticipating what each Apna user wants to see from moment-to-moment. By boosting response time and delivering pertinent details about relevant jobs, Redis fills a critical gap between employers and individuals searching for work. Redis Cloud allows us to pre-fetch pertinent details about relevant jobs, so it’s super-fast. The user experience is seamless. There is no lag time. Amidst the COVID-19 pandemic, which led to a loss of over 10 million jobs in India, Apna rose to the occasion, creating a go to platform for job search and professional networking. Apna now offers a unified platform for job seekers to explore opportunities, showcase their skills, and connect with diverse local communities across various industries. Established in 2019, Apna has risen to prominence as India’s premier professional networking and comprehensive job search platform, empowering countless job seekers across diverse industries. With a presence spanning 70+ Indian cities, Apna boasts an impressive user base of 51 million citizens and partners with 500,000 employers, facilitating a multitude of job opportunities and fostering a thriving community through its robust platform. Apna means “one’s own” in Hindi, which gives rise to the company’s forward-looking slogan: “Our time will come.” It’s an encouraging mantra to the site’s rapidly growing user base, many of whom are first-time internet users who need an easy way to access professional opportunities, collaborate with others, gain new skills, and join like-minded communities that can help motivate them to find jobs. Redis Enterprise is at the heart of Apna’s ability to deliver opportunities for these individuals."
