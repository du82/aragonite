["https://redis.io/blog/security-advisory-cve-2024-46981-cve-2024-51737-cve-2024-51480-cve-2024-55656"]
title = "Security Advisory: CVE-2024-46981, CVE-2024-51737, CVE-2024-51480, CVE-2024-55656 - Redis"
description = "What happened? As part of our ongoing effort to maintain the safety, security, and compliance posture of Redis, four security vulnerabilities in Redis and Redis Modules/Stack have been identified and remediated in the versions indicated below. What are the vulnerabilities? [CVE-2024-46981] Lua Use-After-Free Remote Code Execution Vulnerability.  CVSS Score: 7.0  (High) A specially crafted Lua […]"
full_description = "As part of our ongoing effort to maintain the safety, security, and compliance posture of Redis, four security vulnerabilities in Redis and Redis Modules/Stack have been identified and remediated in the versions indicated below. A specially crafted Lua script executing within Redis may be able to manipulate the Lua VM garbage collector, potentially leading to a Remote Code Execution (RCE). This problem affects all versions of Redis that support Lua scripts, and can only be exploited by a valid, authenticated user with appropriate network connectivity and permission to run Lua scripts. [CVE-2024-51737] RediSearch – Integer Overflow with LIMIT or KNN Arguments Can Lead to RCE. CVSS: 7.0 (High) An authenticated Redis user executing FT.SEARCH or FT.AGGREGATE with a specially crafted LIMITcommand argument, or FT.SEARCH with a specially crafted KNN command argument, can trigger an integer overflow, leading to heap overflow and potential remote code execution. [CVE-2024-51480] RedisTimeSeries – Integer Overflow Remote Code Execution Vulnerability. CVSS: 7.0 (High) Executing one of these commands TS.QUERYINDEX, TS.MGET, TS.MRAGE, TS.MREVRANGE by an authenticated user, using specially crafted command arguments may cause an integer overflow, a subsequent heap overflow, and potentially lead to remote code execution. [CVE-2024-55656] RedisBloom – Integer Overflow Remote Code Execution Vulnerability. CVSS: 8.8 (High) Executing this command `CMS.INITBYDIM` by an authenticated user, using big enough WIDTH and DEPTH command arguments, may cause an integer overflow, a subsequent heap overflow, and potentially lead to remote code execution. Exploitation of these vulnerabilities requires an attacker to first gain authenticated access to your Redis instance. There are several steps you can take to protect your Redis from being accessed by a malicious actor. To minimize the risk of exploitation, it’s important to follow these best practices: For more details on how to securely configure, deploy, and use Redis, visit the Community Edition and Enterprise Software documentation sites."
author = "corey.lewis@redis.com"
