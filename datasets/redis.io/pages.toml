["https://redis.io/docs/latest/integrate/redis-data-integration"]
title = "Redis Data Integration | Docs"
description = """
This is the first General Availability version of Redis Data Integration (RDI).
RDI's purpose is to help Redis customers sync Redis Enterprise with …"""
full_description = '''Develop with Redis Libraries and tools Redis Data Integration Quickstart Install/upgrade Architecture Data pipelines Observability FAQ Troubleshooting Reference Release notes Preview redis-py RedisVL RIOT jedis lettuce node-redis NRedisStack Write-behind (preview) Amazon Bedrock Pulumi provider for Redis Cloud Terraform provider for Redis Cloud Prometheus & Grafana with Redis Software Prometheus & Grafana with Redis Cloud Datadog with Redis Cloud Datadog with Redis Enterprise Dynatrace with Redis Cloud Dynatrace with Redis Enterprise Nagios with Redis Enterprise New Relic with Redis Cloud New Relic with Redis Enterprise Uptrace with Redis Enterprise Confluent with Redis Cloud Spring Data Redis RedisOM for .NET RedisOM for Java RedisOM for Node.js RedisOM for Python Redis products Commands document.addEventListener("DOMContentLoaded", function() { const sidebar = document.getElementById('sidebar'); const footer = document.querySelector('footer'); window.addEventListener('scroll', function() { const scrolledHeight = window.scrollY + window.innerHeight; if (scrolledHeight >= footer.offsetTop) { sidebar.style.maxHeight = `calc(100vh - 7rem - ${scrolledHeight - footer.offsetTop}px)`; } else { sidebar.style.maxHeight = 'calc(100vh - 7rem)'; } }); }) Docs Docs → Libraries and tools → Redis Data Integration Redis Data Integration This is the first General Availability version of Redis Data Integration (RDI). RDI's purpose is to help Redis customers sync Redis Enterprise with live data from their slow disk based databases in order to: Meet the required speed and scale of read queries and provide an excellent and predictable user experience. Save resources and time when building pipelines and coding data transformations. Reduce the total cost of ownership by saving money on expensive database read replicas. If you use a relational database as the system of record for your app, you may eventually find that its performance doesn't scale well as your userbase grows. It may be acceptable for a few thousand users but for a few million, it can become a major problem. If you don't have the option of abandoning the relational database, you should consider using a fast database, such as Redis, to cache data from read queries. Since read queries are typically many times more common than writes, the cache will greatly improve performance and let your app scale without a major redesign. RDI keeps a Redis cache up to date with changes in the primary database, using a Change Data Capture (CDC) mechanism. It also lets you transform the data from relational tables into convenient and fast data structures that match your app's requirements. You specify the transformations using a configuration system, so no coding is necessary. Note: RDI is supported with Redis database or CRDB (Active Active Replication) targets. Features RDI provides enterprise-grade streaming data pipelines with the following features: Near realtime pipeline - The CDC system captures changes in very short time intervals, then ships and processes them in micro-batches to provide near real time updates to Redis. At least once guarantee - RDI will deliver any change to the selected data set at least once to the target Redis database. Data integrity - RDI keeps the data change order per source table or unique key. High availability - All stateless components have hot failover or quick automatic recovery. RDI state is always highly available using Redis Enterprise replication. Easy to install and operate - Use a self-documenting command line interface (CLI) for all installation and day-two operations. No coding needed - Create and test your pipelines using Redis Insight. Data-in-transit encryption - RDI never persists data to disk. All data in-flight is protected using TLS or mTLS connections. Observability - Metrics - RDI collects data processing counters at source table granularity along with data processing performance metrics. These are available via GUI, CLI and Prometheus endpoints. Observability - logs - RDI saves rotating logs to a single folder. They are in a JSON format, so you can collect and process them with your favorite observability tool. Backpressure mechanism - RDI is designed to backoff writing data when the cache gets disconnected, which prevents cascading failure. Since the change data is persisted in the source database and Redis is very fast, RDI can easily catch up with missed changes after a short period of disconnection. See Backpressure mechanism for more information. Recovering from full failure - If the cache fails or gets disconnected for a long time, RDI can reconstruct the cache data in Redis using a full snapshot of the defined dataset. High throughput - Because RDI uses Redis for staging and writes to Redis as a target, it has very high throughput. With a single processor core and records of about 1KB in size, RDI processes around 10,000 records per second. While taking the initial full snapshot of the source database, RDI automatically scales to a configurable number of processing units, to fill the cache as fast as possible. When to use RDI RDI is designed to support apps that must use a disk based database as the system of record but must also be fast and scalable. This is a common requirement for mobile and web apps with a rapidly-growing number of users; the performance of the main database is fine at first but it will soon struggle to handle the increasing demand without a cache. You should use RDI when: You must use a slow database as the system of record for the app . The app must always write its data to the slow database. You already intend to use Redis for the app cache. The data changes frequently in small increments. Your app can tolerate eventual consistency of data in the Redis cache. You should not use RDI when: You are migrating an existing data set into Redis only once. The data is updated infrequently and in big batches. Your app needs immediate cache consistency rather than eventual consistency. The data is ingested from two replicas of Active-Active at the same time. The app must write data to the Redis cache, which then updates the source database. Your data set will only ever be small. Supported source databases RDI can capture data from any of the following sources: Database Versions AWS RDS Versions GCP SQL Versions Oracle 12c, 19c, 21c 19c, 21c - MariaDB 10.5, 11.4.3 10.4 to 10.11, 11.4.3 - MySQL 5.7, 8.0.x, 8.2 8.0.x 8.0 PostgreSQL 10, 11, 12, 13, 14, 15, 16 11, 12, 13, 14, 15, 16 15 SQL Server 2017, 2019, 2022 2016, 2017, 2019, 2022 2019 AlloyDB for PostgreSQL 14.2, 15.7 - 14.2, 15.7 AWS Aurora/PostgreSQL 15 15 - Documentation Learn more about RDI from the other pages in this section: Quickstart Get started with a simple pipeline example Install and upgrade Learn how to install and upgrade RDI Architecture Discover the main components of RDI Data pipelines Learn how an RDI pipeline can transform source data before writing Observability Learn how to monitor RDI FAQ Find answers to common questions about RDI Troubleshooting Solve and report simple problems with RDI Reference View reference material for Redis Data Integration Release notes Preview version Describes where to view the preview version for RDI products RATE THIS PAGE ★ ★ ★ ★ ★ Back to top ↑ Submit document.addEventListener("DOMContentLoaded", function() { const form = document.querySelector("#page-feedback"); form.addEventListener("submit", function(event) { event.preventDefault(); var xhr = new XMLHttpRequest(); var url = "\/docusight\/api\/rate"; var params = new URLSearchParams(new FormData(form)); xhr.open("POST", url, true); xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded"); xhr.onreadystatechange = function() { if (xhr.readyState === 4 && xhr.status === 200) { const responseData = JSON.parse(xhr.responseText); const responseMessage = responseData.response; const newText = document.createTextNode(responseMessage); form.parentNode.replaceChild(newText, form); } }; xhr.send(params); }); }); Edit this page Create an issue On this page Features When to use RDI Supported source databases Documentation'''
