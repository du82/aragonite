full_description = "Who we areWe’re Redis. We built the product that runs the fast apps our world runs on. (If you checked the weather, used your credit card, or looked at your flight status online today, you’re welcome.) At Redis, you’ll work with the fastest, simplest technology in the business—whether you’re building it, telling its story, or selling it to our 10,000+ worldwide customers. We’re creating a faster world with simpler experiences. You in? The Enterprise Account Executive at Redis focuses on formulating and executing a sales strategy within an assigned territory, resulting in revenue growth and new customer acquisition. The ideal candidate will represent the entire range of Redis products and services to assigned customers while leading the customer account planning cycle and ensuring assigned customers’ needs and expectations are met by the company. This Regional Account Executive position reports to the Regional Sales Director. Redis hires for this and similar roles on an ongoing basis, so your application will be collected and kept on file as needs arise, subject to and in accordance with applicable law. Redis may not contact you immediately following receipt of your application. Our culture is what makes Redis a fun and rewarding place to work. To support you at work and beyond, we offer all our US team members fantastic benefits and perks: The estimated gross base annual salary range for this role is $110,000– $125,000 per year in New York, California, Washington, Colorado, and Rhode Island. Actual compensation may vary and is dependent on various factors, including a candidate’s work location, qualifications, experience, and competencies. Base annual salary is one component of Redis’ total compensation and competitive benefits package, which may include 401(k), unlimited time off, learning and development opportunities, and comprehensive health and wellness benefits. This role may include discretionary bonuses, stock options, commuter benefits based on location, or a commission plan. Salary history is not used in compensation package decisions. Redis utilizes market pay data to determine compensation, so posted compensation ranges are subject to change as new market data becomes available."
