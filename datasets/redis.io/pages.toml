full_description = "ACL DRYRUN Simulates the execution of a command by a user, without executing the command. Learn more → Read more ACL GENPASS Generates a pseudorandom, secure password that can be used to identify ACL users. Learn more → Read more APPEND Appends a string to the value of a key. Creates the key if it doesn't exist. Learn more → Read more BF.INSERT Adds one or more items to a Bloom Filter. A filter will be created if it does not exist Learn more → Read more BF.MADD Adds one or more items to a Bloom Filter. A filter will be created if it does not exist Learn more → Read more BITFIELD_RO Performs arbitrary read-only bitfield integer operations on strings. Learn more → Read more BITOP Performs bitwise operations on multiple strings, and stores the result. Learn more → Read more BLMOVE Pops an element from a list, pushes it to another list and returns it. Blocks until an element is available otherwise. Deletes the list if the last element was moved. Learn more → Read more BLMPOP Pops the first element from one of multiple lists. Blocks until an element is available otherwise. Deletes the list if the last element was popped. Learn more → Read more BLPOP Removes and returns the first element in a list. Blocks until an element is available otherwise. Deletes the list if the last element was popped. Learn more → Read more BRPOP Removes and returns the last element in a list. Blocks until an element is available otherwise. Deletes the list if the last element was popped. Learn more → Read more BRPOPLPUSH Pops an element from a list, pushes it to another list and returns it. Block until an element is available otherwise. Deletes the list if the last element was popped. Learn more → Read more BZMPOP Removes and returns a member by score from one or more sorted sets. Blocks until a member is available otherwise. Deletes the sorted set if the last element was popped. Learn more → Read more BZPOPMAX Removes and returns the member with the highest score from one or more sorted sets. Blocks until a member available otherwise. Deletes the sorted set if the last element was popped. Learn more → Read more"
