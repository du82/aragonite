description = "Enjoy simple setup, high availability, and seamless Google Cloud integration. Get started today for as low as $5 a month."
full_description = "Starting today, Redis Cloud Essentials is available on Google Cloud Marketplace. It’s never been easier to deploy and manage Redis in the cloud while billing through the Google Cloud Marketplace. Redis Cloud Essentials is a managed Redis service that makes getting started with Redis on Google Cloud simple and affordable. Whether you’re new to Redis or need a lightweight Redis solution, it’s perfect for developers of all levels working on small apps or development environments. Redis Cloud Essentials is available on Google Cloud Marketplace in select regions around the world. Start for free with the 30 MB plan. Paid plans begin at just $5 per month for 250 MB of storage with no replication, and $7 per month for 250 MB of storage with single zone replication. Redis Cloud Essentials gets you up and running fast. Visit the Redis Cloud listing on the Google Cloud Marketplace and hit the Subscribe button to launch a new Redis instance. Redis Cloud Essentials is a powerful and affordable managed Redis service that makes it easy to deploy and manage Redis on Google Cloud. With its simple setup, cost-effective pricing, and high availability features, Redis Cloud Essentials is the perfect solution for developers of all levels."
