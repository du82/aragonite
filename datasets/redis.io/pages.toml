full_description = "Who we areWe’re Redis. We built the product that runs the fast apps our world runs on. (If you checked the weather, used your credit card, or looked at your flight status online today, you’re welcome.) At Redis, you’ll work with the fastest, simplest technology in the business—whether you’re building it, telling its story, or selling it to our 10,000+ worldwide customers. We’re creating a faster world with simpler experiences. You in? As a member of the Cloud Native development group, you will be responsible for the software behind the fastest NoSQL clusters on earth, supporting over 200 million ops/sec at sub-millisecond latency with true linear scalability. The Cloud native team creates components that integrate with modern orchestration systems such as Kubernetes and Cloud Foundry, making the adoption of Redis Enterprise simple and easy. Our ideal candidate is a strong individual that loves to work with a diverse team of bright and ambitious people. You are passionate about technology in general and specifically the challenges around cloud, performance, and distributed computing. You are a quick learner, always eager to learn and improve. If you’re all that, fun to work with, and want to make an impact while contributing to a wildly successful startup, then this is the right challenge for you Our culture is what makes Redis a fun and rewarding place to work. To support you at work and beyond, we offer all our Israel team members fantastic benefits and perks:"
