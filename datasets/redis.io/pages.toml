["https://redis.io/blog/whats-new-in-two-november-edition"]
title = "What’s new in two - November edition - Redis"
description = "We’re happy to announce Redis 8.0-M02. Now available in Community Edition, our second milestone builds on the new data structures introduced in M01"
full_description = "Welcome to “What’s new in two,” the place to catch up on Redis releases you might have missed in the past month. We’re covering the latest developments from November, expanding on what I covered in our latest video—press play above if you prefer to watch a recap of this month’s updates. Let’s get started. We’re happy to announce Redis 8.0-M02. Now available in Community Edition, our second milestone builds on the new data structures introduced in M01 (JSON, time series, and probabilistic types) by delivering major performance gains and advanced scaling features. Commands like ZADD, SMEMBERS, and HGETALL show up to 36% lower latency, benefiting over 70% of Redis users. Redis CE 8.0 now supports horizontal and vertical scaling for the Redis Query Engine. It powers high-throughput search and vector operations for datasets up to a billion vectors, with configurations fine-tuned for both precision and speed. Try Redis 8.0-M02 as a Docker image on Alpine or Debian. Introducing the general availability of Redis Software 7.8.2! This new version comes with many new features and updates, like support for Redis Community Edition 7.4 with hash field expiration, significant memory reduction for the Redis Query Engine for vector use cases, and client-side caching. For administrators, this release comes with new compliance enhancements, new database management APIs, improved observability, expanded cluster manager UI functionality, and much more. Check out the release notes to get started. On November 19, we announced Azure Managed Redis, a new, fully managed Redis solution developed in close collaboration with Microsoft Azure. Now available in public preview, Azure Managed Redis (AMR) provides Microsoft Azure customers with a licensed, multi-tiered Redis service—the first major cloud service provider to do so. AMR now brings Redis 7.4, the latest and fastest version of Redis to Microsoft Azure. AMR includes all the powerful features of Redis Enterprise, such as 99.999% availability, top-tier security, and seamless integration with Azure AI and the Redis Vector Library, featuring 30+ ecosystem integrations like LlamaIndex and Langchain. It also offers the Redis Query Engine for full-text and vector search, Redis Insight for optimal management, and more than 30% cost savings over the previous Azure Cache for Redis option."
