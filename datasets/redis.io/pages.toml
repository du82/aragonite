full_description = '''Develop with Redis Libraries and tools Redis products Redis Cloud Quick start Databases Subscriptions Logs & reports Accounts & settings Billing & payments Marketplace integrations AWS Marketplace Google Cloud Marketplace AWS cloud accounts Vercel Marketplace Security REST API Develop highly available apps Redis Community Edition compatibility Supported regions Changelog Redis Software latest ▼ ▲ latest v7.4 Redis for Kubernetes latest ▼ ▲ latest v7.4.6 Redis Community Edition and Stack Redis Insight Commands document.addEventListener("DOMContentLoaded", function() { const sidebar = document.getElementById('sidebar'); const footer = document.querySelector('footer'); window.addEventListener('scroll', function() { const scrolledHeight = window.scrollY + window.innerHeight; if (scrolledHeight >= footer.offsetTop) { sidebar.style.maxHeight = `calc(100vh - 7rem - ${scrolledHeight - footer.offsetTop}px)`; } else { sidebar.style.maxHeight = 'calc(100vh - 7rem)'; } }); }) Docs Docs → Redis products → Redis Cloud → Manage marketplace integrations → Sign up for Redis Cloud with AWS Marketplace Sign up for Redis Cloud with AWS Marketplace Shows how to subscribe to Redis Cloud using AWS Marketplace Redis Cloud You can use AWS Marketplace to subscribe to Redis Cloud through AWS Marketplace. This lets you provision according to your needs and pay using your AWS account. Here's how to subscribe to Redis Cloud with AWS Marketplace: Sign in to the AWS console. Search AWS Marketplace for Redis Cloud (Pay-As-You-Go with 14-day FREE TRIAL) and subscribe to the listing. Or, click on the URL provided by your Redis seller for a private offer for Redis Cloud - Annual Commits and accept the private offer. Locate the Set Up Your Account button, and then select it to begin mapping your Redis Cloud account with your AWS Marketplace account. Sign in to the Redis Cloud console. If you do not yet have an account, you will need to create one. You must have the Account Owner role. Select the Redis account to be mapped to your AWS Marketplace account and confirm that your Marketplace account will pay for your Redis Cloud resources going forward. Use the Connect account button to confirm your choice. Note: You must complete this step to bill your Redis Cloud resources to your AWS Marketplace account. Once your Redis account is mapped to your AWS Marketplace account, a message appears in the upper, left corner of the account panel. In addition, AWS Marketplace is reported as the selected payment method. At this point, you can create a new database using the standard workflow, with one important change. You don't need to enter a payment method, as it's automatically assigned to your AWS Marketplace account. To confirm this, review the payment method associated with your subscription. If your AWS Marketplace account is deactivated or otherwise unavailable, you won't be able to use your databases until the billing method is updated. For help, contact support. RATE THIS PAGE ★ ★ ★ ★ ★ Back to top ↑ Submit document.addEventListener("DOMContentLoaded", function() { const form = document.querySelector("#page-feedback"); form.addEventListener("submit", function(event) { event.preventDefault(); var xhr = new XMLHttpRequest(); var url = "\/docusight\/api\/rate"; var params = new URLSearchParams(new FormData(form)); xhr.open("POST", url, true); xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded"); xhr.onreadystatechange = function() { if (xhr.readyState === 4 && xhr.status === 200) { const responseData = JSON.parse(xhr.responseText); const responseMessage = responseData.response; const newText = document.createTextNode(responseMessage); form.parentNode.replaceChild(newText, form); } }; xhr.send(params); }); }); Edit this page Create an issue window.onload = function(){ var currentUrl = window.location.href const regex_kubernetes = new RegExp('/docs/(latest|staging\/.+)/operate/kubernetes/.*') const regex_rs = new RegExp('/docs/(la