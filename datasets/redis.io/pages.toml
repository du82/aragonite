full_description = '''Develop with Redis Libraries and tools Redis products Commands document.addEventListener("DOMContentLoaded", function() { const sidebar = document.getElementById('sidebar'); const footer = document.querySelector('footer'); window.addEventListener('scroll', function() { const scrolledHeight = window.scrollY + window.innerHeight; if (scrolledHeight >= footer.offsetTop) { sidebar.style.maxHeight = `calc(100vh - 7rem - ${scrolledHeight - footer.offsetTop}px)`; } else { sidebar.style.maxHeight = 'calc(100vh - 7rem)'; } }); }) Docs Docs → Community Edition Community Edition Get started with Redis Community Edition Redis is an in-memory data store used by millions of developers as a cache, vector database, document database, streaming engine, and message broker. Redis has built-in replication and different levels of on-disk persistence. It supports complex data types (for example, strings, hashes, lists, sets, sorted sets, and JSON), with atomic operations defined on those data types. You can install Redis from source, from an executable for your OS, or bundled with Redis Stack and Redis Insight which include popular features and monitoring. Install Redis on Linux Install Redis on macOS Install Redis on Windows Install Redis with Redis Stack and Redis Insight Run Redis Stack on Docker Install Redis from Source Use cases The following quick start guides will show you how to use Redis for the following specific purposes: Data structure store Document database Vector database AI agents and chatbots Retrieval Augmented Generation (RAG) with Redis Data integration tools, libraries, and frameworks Client API libraries Redis Data Integration Redis vector library for Python Redis Cloud with Amazon Bedrock Object-mapping for .NET Spring Data Redis for Java You can find a complete list of integrations on the integrations and frameworks hub. To learn more, refer to the develop with Redis documentation. Deployment options You can deploy Redis with the following methods: As a service by using Redis Cloud, the fastest way to deploy Redis on your preferred cloud platform. By installing Redis Enterprise Software in an on-premises data center or on Cloud infrastructure. On a variety Kubernetes distributions by using the Redis Enterprise operator for Kubernetes. The following guides will help you to get started with your preferred deployment method. Get started with Redis Cloud by creating a database: The Redis Cloud quick start helps you create a free database. (Start here if you're new.) Create an Essentials database with a memory limit up to 12 GB. Create a Pro database that suits your workload and offers seamless scaling. Install a Redis Enterprise Software cluster: Redis Enterprise on Linux quick start Redis Enterprise on Docker quick start Get started with Redis Enterprise's Active-Active feature Install and upgrade Redis Enterprise Leverage Redis Enterprise for Kubernetes to simply deploy a Redis Enterprise cluster on Kubernetes: Deploy Redis Enterprise for Kubernetes Deploy Redis Enterprise for Kubernetes with OpenShift To learn more, refer to the Redis products documentation. Provisioning and observability tools Pulumi provider for Redis Cloud Terraform provider for Redis Cloud Prometheus and Grafana with Redis Cloud Prometheus and Grafana with Redis Enterprise You can find a complete list of integrations on the libraries and tools hub. RATE THIS PAGE ★ ★ ★ ★ ★ Back to top ↑ Submit document.addEventListener("DOMContentLoaded", function() { const form = document.querySelector("#page-feedback"); form.addEventListener("submit", function(event) { event.preventDefault(); var xhr = new XMLHttpRequest(); var url = "\/docusight\/api\/rate"; var params = new URLSearchParams(new FormData(form)); xhr.open("POST", url, true); xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded"); xhr.onreadystatechange = function() { if (xhr.readyState === 4 && xhr.status === 200) { const responseData = JSON.parse(xhr.responseTex