["https://redis.io/customers/deutsche-borse"]
title = "Deutsche Börse - Redis"
description = "Redis Enterprise has optimized Deutsche Börse’s application framework as an intelligent cache to generate required regulatory reporting data."
full_description = "As an international exchange organisation and innovative market infrastructure provider, Deutsche Börse Group offers its customers a wide range of products, services and technologies covering the entire value chain of financial markets. With around 6,000 employees, the company has its headquarters in the financial centre of Frankfurt/Rhine-Main, as well as a strong global presence in Europe, Asia and the United States. In order to offer its customers a reporting solution, Deutsche Börse relies on rapid data reporting and processing. Deutsche Börse turned to Redis Enterprise as an intelligent cache to rapidly process and organize data in order to fulfill this new requirement. As a result, Redis Enterprise has enabled Deutsche Börse to scale with anticipated quote and trade data volume growth. Redis Enterprise supports the throughput and latency requirements Deutsche Börse is required to guarantee to its regulator and the customers. Deutsche Börse initially adopted Redis Enterprise in January 2018, during a previous collaboration with a vertically focused system integration partner. At that time, Deutsche Börse and its system integrator required Redis Enterprise’s ability to process data in real time and ensure high throughput and minimal latency, and that’s precisely what Redis Enterprise guaranteed. Initially chosen by the system integrator, Redis Enterprise was the natural fit to accommodate Deutsche Börse’s needs. After the system integrator contacted Deutsche Börse, the integrator started to build a publication solution with Redis Open Source as the caching layer, while Deutsche Börse contributed a vital piece of stack infrastructure. Deutsche Börse currently uses Redis Enterprise as an intelligent cache to power a data warehouse that is then used for regulatory compliance purposes. For example, Deutsche Börse’s data workflow entails every quote and trade which is subject to compliance requirements being captured into Kafka, which subsequently collates the data sources and passes them over to Redis. Redis then cleans, aggregates and processes the data, which is stored in an Oracle DWH until it is ready to be deployed in order to generate the required regulatory reporting data."
