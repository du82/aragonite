["https://redis.io/blog/redis-8-0-m02-the-fastest-redis-ever"]
title = "Try Redis 8.0-M02 today. The fastest Redis ever. - Redis"
description = "We’re happy to announce the second milestone of Redis 8, our most advanced and performant offering available in Community Edition (CE) today."
full_description = "We’re happy to announce the second milestone of Redis 8, our most advanced and performant offering yet, available for you to try in Community Edition (CE) today. In CE 8.0 M01 (Milestone 1 pre-release), we introduced new data structures: JSON, time series, and 5 probabilistic data structures (previously available as separate Redis modules). Today, in CE 8.0 M02, we’re introducing major performance improvements. The latency of many commonly used Redis commands has been significantly reduced. For example, up to 36% reduction in latency for ZADD, up to 28% for SMEMBERS, and up to 10% for HGETALL—compared to Redis 7.2.5. In this version, we also made two significant improvements available to our community that previously were only available in Redis Cloud and Redis Software. We added the ability to scale the Redis Query Engine vertically as well as horizontally. To showcase what can be achieved with this, we created a vector search benchmark with 1 billion 768-dimensions vectors—running on a Redis Community cluster. You can now also download Community Edition 8.0-M02 now as either an Alpine or a Debian Docker image. More distributions will become available as we progress to the 8.0 CE GA release. We continuously monitor how tens of thousands of customers and community members are using our Redis managed service. Anonymised statistics collected provide us with a very accurate understanding of how Redis is being used. Based on this, we optimize our ongoing investment in performance improvements.Since Redis 7.2.5, we introduced significant latency reduction and throughput increment for many common commands and usage patterns. For the complete list of performance optimizations, please take a look at the “Performance and resource utilization improvements” sections in the 7.4 RC1, 8.0 M01, and 8.0 M02 release notes. There are 18 performance optimizations on M01 and M02 that strictly focus on reducing CPU cycles, reducing memory allocations, and optimizing data access patterns of commonly used code—including replies handling, data structures improvements and deduplication. In short, Redis is now more CPU efficient and cache friendly."
author = "donna.bentley@redis.com"
