["https://redteamvillage.io"]
title = "Red Team Village - Cybersecurity Training and Briefings"
description = "The DEF CON Red Team Village is a community driven village. The Red Team Village was created to bridge the gap between penetration testers and offensive team functions.  Join thousands of cybersecurity professionals and participate in free training, technical briefings, workshops, and capture the flag (CTF) events."
full_description = "RTV Overflow is a full-day virtual event packed with some of your favorite workshops from DEFCON 32!Starting at 10:00 AM ET, the event features hands-on workshops, including sessions on breaching Kubernetes clusters, physical red teaming strategies, and advanced cloud exploitation techniques. Get a behind-the-scenes look at RTV’s mission, learn how our CTF comes to life, and discover opportunities to contribute to the village at the upcoming DEF CON 33. With sessions led by top professionals this event is your gateway to mastering real-world red team techniques and connecting with the global offensive security community. The Red Team Village is focused on training the art of critical thinking, collaboration, and strategy in offensive security. The RTV brings together information security professionals to share new tactics and techniques in offensive security. Attendees may spend all three days engaged in introductory workshops or challenge themselves in an immersive Capture the Flag competition to put their newly obtained skills to the test."
year_published = 2025
clearnet = "https://redteamvillage.io"
tags = ["10:00", "32!starting", "8th10", "advanced", "behind-the-scenes", "breaching", "cloud", "clusters,", "comes", "community."]
language = "en"
internal-references = ["none"]
external-references = ["discord.gg", "mobiri.se", "mobirise.com", "twitch.tv", "twitter.com", "volunteer.redteamvillage.io", "youtube.com"]

