full_description = '''PredictableRedux helps you write applications that behave consistently, run in different environments (client, server, and native), and are easy to test.CentralizedCentralizing your application's state and logic enables powerful capabilities like undo/redo, state persistence, and much more.DebuggableThe Redux DevTools make it easy to trace when, where, why, and how your application's state changed. Redux's architecture lets you log changes, use "time-travel debugging", and even send complete error reports to a server.FlexibleRedux works with any UI layer, and has a large ecosystem of addons to fit your needs.Other Libraries from the Redux TeamReact-ReduxOfficial React bindings for ReduxRedux ToolkitThe official, opinionated, batteries-included toolset for efficient Redux development'''
