["https://redux.js.org/faq/miscellaneous"]
title = "Miscellaneous | Redux"
description = "Table of Contents"
full_description = "FAQMiscellaneousOn this pageRedux FAQ: MiscellaneousTable of Contents​Are there any larger, “real” Redux projects?How can I implement authentication in Redux?Miscellaneous​Are there any larger, “real” Redux projects?​Yes, lots of them! To name just a few:Twitter's mobile siteWordpress's new admin pageFirefox's new debuggerThe HyperTerm terminal applicationAnd many, many more! The Redux Addons Catalog has a list of Redux-based applications and examples that points to a variety of actual applications, large and small.Further information​DocumentationIntroduction: ExamplesDiscussionsReddit: Large open source react/redux projects?HN: Is there any huge web application built using Redux?How can I implement authentication in Redux?​Authentication is essential to any real application. When going about authentication you must keep in mind that nothing changes with how you should organize your application and you should implement authentication in the same way you would any other feature. It is relatively straightforward:Create action constants for LOGIN_SUCCESS, LOGIN_FAILURE, etc.Create action creators that take in credentials, a flag that signifies whether authentication succeeded, a token, or an error message as the payload.Create an async action creator with Redux Thunk middleware or any middleware you see fit to fire a network request to an API that returns a token if the credentials are valid. Then save the token in the local storage or show a response to the user if it failed. You can perform these side effects from the action creators you wrote in the previous step.Create a reducer that returns the next state for each possible authentication case (LOGIN_SUCCESS, LOGIN_FAILURE, etc).Further information​ArticlesAuthentication with JWT by Auth0Tips to Handle Authentication in ReduxExamplesreact-redux-jwt-auth-exampleLibrariesRedux Addons Catalog: Use Cases - AuthenticationEdit this pageLast updated on Jun 25, 2021"
