title = "Redux Fundamentals, Part 7: Standard Redux Patterns | Redux"
description = "The official Fundamentals tutorial for Redux: learn the standard patterns used in real-world Redux apps"
full_description = '''TutorialsRedux FundamentalsStandard Redux PatternsOn this pageRedux Fundamentals, Part 7: Standard Redux PatternsWhat You'll LearnStandard patterns used in real-world Redux apps, and why those patterns exist:Action creators for encapsulating action objectsMemoized selectors for improving performanceTracking request status via loading enumsNormalizing state for managing collections of itemsWorking with promises and thunksPrerequisitesUnderstanding the topics in all previous sectionsIn Part 6: Async Logic and Data Fetching, we saw how to use Redux middleware to write async logic that can talk to the store. In particular, we used the Redux "thunk" middleware to write functions that can contain reusable async logic, without knowing what Redux store they'll be talking to ahead of time.So far, we've covered the basics of how Redux actually works. However, real world Redux applications use some additional patterns on top of those basics.It's important to note that none of these patterns are required to use Redux! But, there are very good reasons why each of these patterns exists, and you'll see some or all of them in almost every Redux codebase.In this section, we'll rework our existing todo app code to use some of these patterns, and talk about why they're commonly used in Redux apps. Then, in Part 8, we'll talk about "modern Redux", including how to use our official Redux Toolkit package to simplify all the Redux logic we've written "by hand" in our app, and why we recommend using Redux Toolkit as the standard approach for writing Redux apps.cautionNote that this tutorial intentionally shows older-style Redux logic patterns that require more code than the "modern Redux" patterns with Redux Toolkit we teach as the right approach for building apps with Redux today, in order to explain the principles and concepts behind Redux. It's not meant to be a production-ready project.See these pages to learn how to use "modern Redux" with Redux Toolkit:The full "Redux Essentials" tutorial, which teaches "how to use Redux, the right way" with Redux Toolkit for real-world apps. We recommend that all Redux learners should read the "Essentials" tutorial!Redux Fundamentals, Part 8: Modern Redux with Redux Toolkit, which shows how to convert the low-level examples from earlier sections into modern Redux Toolkit equivalentsAction Creators​In our app, we've been writing action objects directly in the code, where they're being dispatched:dispatch({ type: 'todos/todoAdded', payload: trimmedText })However, in practice, well-written Redux apps don't actually write those action objects inline when we dispatch them. Instead, we use "action creator" functions.An action creator is a function that creates and returns an action object. We typically use these so we don't have to write the action object by hand every time:const todoAdded = text => { return { type: 'todos/todoAdded', payload: text }}We then use them by calling the action creator, and then passing the resulting action object directly to dispatch:store.dispatch(todoAdded('Buy milk'))console.log(store.getState().todos)// [ {id: 0, text: 'Buy milk', completed: false}]Detailed Explanation: Why use Action Creators?In our small example todo app, writing action objects by hand every time isn't too difficult. In fact, by switching to using action creators, we've added more work - now we have to write a function and the action object.But, what if we needed to dispatch the same action from many parts of the application? Or what if there's some additional logic that we have to do every time we dispatch an action, like creating a unique ID? We'd end up having to copy-paste the additional setup logic every time we need to dispatch that action.Action creators have two primary purposes:They prepare and format the contents of action objectsThey encapsulate any additional work needed whenever we create those actionsThat way, we have a consistent approach for creating actions, whether or not there's any extra work that needs to be done. The same goes for thunks as well.Using Action Creators​Let's update our todos slice file to use action creators for a couple of our action types.We'll start with the two main actions we've been using so far: loading the list of todos from the server, and adding a new todo after saving it to the server.Right now, todosSlice.js is dispatching an action object directly, like this:dispatch({ type: 'todos/todosLoaded', payload: response.todos })We'll create a function that creates and returns that same kind of action object, but accepts the array of todos as its argument and puts it into the action as action.payload. Then, we can dispatch the action using that new action creator inside of our fetchTodos thunk:src/features/todos/todosSlice.jsexport const todosLoaded = todos => { return { type: 'todos/todosLoaded', payload: todos }}export async function fetchTodos(dispatch, getState) { const response = await client.get('/fakeApi/todos') dispatch(todosLoaded(response.todos))}We can also do the same thing for the "todo added" action:src/features/todos/todosSlice.jsexport const todoAdded = todo => { return { type: 'todos/todoAdded', payload: todo }}export function saveNewTodo(text) { return async function saveNewTodoThunk(dispatch, getState) { const initialTodo = { text } const response = await client.post('/fakeApi/todos', { todo: initialTodo }) dispatch(todoAdded(response.todo)) }}While we're at it, let's do the same thing for the "color filter changed" action:src/features/filters/filtersSlice.jsexport const colorFilterChanged = (color, changeType) => { return { type: 'filters/colorFilterChanged', payload: { color, changeType } }}And since this action was being dispatched from the <Footer> component, we'll need to import the colorFilterChanged action creator over there and use it:src/features/footer/Footer.jsimport React from 'react'import { useSelector, useDispatch } from 'react-redux'import { availableColors, capitalize } from '../filters/colors'import { StatusFilters, colorFilterChanged } from '../filters/filtersSlice'// omit child componentsconst Footer = () => { const dispatch = useDispatch() const todosRemaining = useSelector(state => { const uncompletedTodos = state.todos.filter(todo => !todo.completed) return uncompletedTodos.length }) const { status, colors } = useSelector(state => state.filters) const onMarkCompletedClicked = () => dispatch({ type: 'todos/allCompleted' }) const onClearCompletedClicked = () => dispatch({ type: 'todos/completedCleared' }) const onColorChange = (color, changeType) => dispatch(colorFilterChanged(color, changeType)) const onStatusChange = status => dispatch({ type: 'filters/statusFilterChanged', payload: status }) // omit rendering output}export default FooterNotice that the colorFilterChanged action creator actually accepts two different arguments, and then combines them together to form the right action.payload field.This doesn't change anything about how the application works, or how the Redux data flow behaves - we're still creating action objects, and dispatching them. But, instead of writing action objects directly in our code all the time, we're now using action creators to prepare those action objects before they're dispatched.We can also use action creators with thunk functions, and in fact we wrapped a thunk in an action creator in the previous section . We specifically wrapped saveNewTodo in a "thunk action creator" function so that we could pass in a text parameter. While fetchTodos doesn't take any parameters, we could still wrap it in an action creator as well:src/features/todos/todosSlice.jsexport function fetchTodos() { return async function fetchTodosThunk(dispatch, getState) { const response = await client.get('/fakeApi/todos') dispatch(todosLoaded(response.todos)) }}And that means we have to change the place it's dispatched in index.js to call the outer thunk action creator function, and pass the returned inner thunk function to dispatch:src/index.jsimport store from './store'import { fetchTodos } from './features/todos/todosSlice'store.dispatch(fetchTodos())We've written thunks using the function keyword so far to make it clear what they're doing. However, we can also write them using arrow function syntax instead. Using implicit returns can shorten the code, although it may make it a bit harder to read as well if you're not familiar with arrow functions:src/features/todos/todosSlice.js// Same thing as the above example!export const fetchTodos = () => async dispatch => { const response = await client.get('/fakeApi/todos') dispatch(todosLoaded(response.todos))}Similarly, we could shorten the plain action creators if we wanted to:src/features/todos/todosSlice.jsexport const todoAdded = todo => ({ type: 'todos/todoAdded', payload: todo })It's up to you to decide whether using arrow functions this way is better or not.infoFor more details on why action creators are useful, see:Idiomatic Redux: Why Use Action Creators?Memoized Selectors​We've already seen that we can write "selector" functions, which accept the Redux state object as an argument, and return a value:const selectTodos = state => state.todosWhat if we need to derive some data? For example, maybe we want to have an array of only the todo IDs:const selectTodoIds = state => state.todos.map(todo => todo.id)However, array.map() always returns a new array reference. We know that the React-Redux useSelector hook will re-run its selector function after every dispatched action, and if the selector result changes, it will force the component to re-render.In this example, calling useSelector(selectTodoIds) will always cause the component to re-render after every action, because it's returning a new array reference!In Part 5, we saw that we can pass shallowEqual as an argument to useSelector. There's another option here, though: we could use "memoized" selectors.Memoization is a kind of caching - specifically, saving the results of an expensive calculation, and reusing those results if we see the same inputs later.Memoized selector functions are selectors that save the most recent result value, and if you call them multiple times with the same inputs, will return the same result value. If you call them with different inputs than last time, they will recalculate a new result value, cache it, and return the new result.Memoizing Selectors with createSelector​The Reselect library provides a createSelector API that will generate memoized selector functions. createSelector accepts one or more "input selector" functions as arguments, plus an "output selector", and returns the new selector function. Every time you call the selector:All "input selectors" are called with all of the argumentsIf any of the input selector return values have changed, the "output selector" will re-runAll of the input selector results become arguments to the output selectorThe final result of the output selector is cached for next timeLet's create a memoized version of selectTodoIds and use that with our <TodoList>.First, we need to install Reselect:npm install reselectThen, we can import and call createSelector. Our original selectTodoIds function was defined over in TodoList.js, but it's more common for selector functions to be written in the relevant slice file. So, let's add this to the todos slice:src/features/todos/todosSlice.jsimport { createSelector } from 'reselect'// omit reducer// omit action creatorsexport const selectTodoIds = createSelector( // First, pass one or more "input selector" functions: state => state.todos, // Then, an "output selector" that receives all the input results as arguments // and returns a final result value todos => todos.map(todo => todo.id))Then, let's use it in <TodoList>:src/features/todos/TodoList.jsimport React from 'react'import { useSelector, shallowEqual } from 'react-redux'import { selectTodoIds } from './todosSlice'import TodoListItem from './TodoListItem'const TodoList = () => { const todoIds = useSelector(selectTodoIds) const renderedListItems = todoIds.map(todoId => { return <TodoListItem key={todoId} id={todoId} /> }) return <ul className="todo-list">{renderedListItems}</ul>}This actually behaves a bit differently than the shallowEqual comparison function does. Any time the state.todos array changes, we're going to create a new todo IDs array as a result. That includes any immutable updates to todo items like toggling their completed field, since we have to create a new array for the immutable update.tipMemoized selectors are only helpful when you actually derive additional values from the original data. If you are only looking up and returning an existing value, you can keep the selector as a plain function.Selectors with Multiple Arguments​Our todo app is supposed to have the ability to filter the visible todos based on their completed status. Let's write a memoized selector that returns that filtered list of todos.We know we need the entire todos array as one argument to our output selector. We also need to pass in the current completion status filter value as well. We'll add a separate "input selector" to extract each value, and pass the results to the "output selector".src/features/todos/todosSlice.jsimport { createSelector } from 'reselect'import { StatusFilters } from '../filters/filtersSlice'// omit other codeexport const selectFilteredTodos = createSelector( // First input selector: all todos state => state.todos, // Second input selector: current status filter state => state.filters.status, // Output selector: receives both values (todos, status) => { if (status === StatusFilters.All) { return todos } const completedStatus = status === StatusFilters.Completed // Return either active or completed todos based on filter return todos.filter(todo => todo.completed === completedStatus) })cautionNote that we've now added an import dependency between two slices - the todosSlice is importing a value from the filtersSlice. This is legal, but be careful. If two slices both try to import something from each other, you can end up with a "cyclic import dependency" problem that can cause your code to crash. If that happens, try moving some common code to its own file and import from that file instead.Now we can use this new "filtered todos" selector as an input to another selector that returns the IDs of those todos:src/features/todos/todosSlice.jsexport const selectFilteredTodoIds = createSelector( // Pass our other memoized selector as an input selectFilteredTodos, // And derive data in the output selector filteredTodos => filteredTodos.map(todo => todo.id))If we switch <TodoList> to use selectFilteredTodoIds, we should then be able to mark a couple todo items as completed:and then filter the list to only show completed todos:We can then expand our selectFilteredTodos to also include color filtering in the selection as well:src/features/todos/todosSlice.jsexport const selectFilteredTodos = createSelector( // First input selector: all todos selectTodos, // S'''
