["https://redux.js.org/tutorials/fundamentals/part-3-state-actions-reducers"]
title = "Redux Fundamentals, Part 3: State, Actions, and Reducers | Redux"
description = "The official Redux Fundamentals tutorial: learn how reducers update state in response to actions"
full_description = '''TutorialsRedux FundamentalsState, Actions, and ReducersOn this pageRedux Fundamentals, Part 3: State, Actions, and ReducersWhat You'll LearnHow to define state values that contain your app's dataHow to define action objects that describe what happens in your appHow to write reducer functions that calculate updated state based on existing state and actionsPrerequisitesFamiliarity with key Redux terms and concepts like "actions", "reducers", "store", and "dispatching". (See Part 2: Redux Concepts and Data Flow for explanations of these terms.)Introduction​In Part 2: Redux Concepts and Data Flow, we looked at how Redux can help us build maintainable apps by giving us a single central place to put global app state. We also talked about core Redux concepts like dispatching action objects and using reducer functions that return new state values.Now that you have some idea of what these pieces are, it's time to put that knowledge into practice. We're going to build a small example app to see how these pieces actually work together.cautionNote that this tutorial intentionally shows older-style Redux logic patterns that require more code than the "modern Redux" patterns with Redux Toolkit we teach as the right approach for building apps with Redux today, in order to explain the principles and concepts behind Redux. It's not meant to be a production-ready project.See these pages to learn how to use "modern Redux" with Redux Toolkit:The full "Redux Essentials" tutorial, which teaches "how to use Redux, the right way" with Redux Toolkit for real-world apps. We recommend that all Redux learners should read the "Essentials" tutorial!Redux Fundamentals, Part 8: Modern Redux with Redux Toolkit, which shows how to convert the low-level examples from earlier sections into modern Redux Toolkit equivalentsProject Setup​For this tutorial, we've created a pre-configured starter project that already has React set up, includes some default styling, and has a fake REST API that will allow us to write actual API requests in our app. You'll use this as the basis for writing the actual application code.To get started, you can open and fork this CodeSandbox:You can also clone the same project from this Github repo. After cloning the repo, you can install the tools for the project with npm install, and start it with npm start.If you'd like to see the final version of what we're going to build, you can check out the tutorial-steps branch, or look at the final version in this CodeSandbox.Creating a New Redux + React Project​Once you've finished this tutorial, you'll probably want to try working on your own projects. We recommend using the Redux templates for Create-React-App as the fastest way to create a new Redux + React project. It comes with Redux Toolkit and React-Redux already configured, using a modernized version of the "counter" app example you saw in Part 1. This lets you jump right into writing your actual application code without having to add the Redux packages and set up the store.If you want to know specific details on how to add Redux to a project, see this explanation:Detailed Explanation: Adding Redux to a React ProjectThe Redux template for CRA comes with Redux Toolkit and React-Redux already configured. If you're setting up a new project from scratch without that template, follow these steps:Add the @reduxjs/toolkit and react-redux packagesCreate a Redux store using RTK's configureStore API, and pass in at least one reducer functionImport the Redux store into your application's entry point file (such as src/index.js)Wrap your root React component with the <Provider> component from React-Redux, like:root.render( <Provider store={store}> <App /> </Provider>, document.getElementById('root'))Exploring the Initial Project​This initial project is based on the standard Vite project template, with some modifications.Let's take a quick look at what the initial project contains:/srcindex.js: the entry point file for the application. It renders the main <App> component.App.js: the main application component.index.css: styles for the complete application/apiclient.js: a small fetch wrapper client that allows us to make HTTP GET and POST requestsserver.js: provides a fake REST API for our data. Our app will fetch data from these fake endpoints later./exampleAddons: contains some additional Redux addons that we'll use later in the tutorial to show how things workIf you load the app now, you should see a welcome message, but the rest of the app is otherwise empty.With that, let's get started!Starting the Todo Example App​Our example application will be a small "todo" application. You've probably seen todo app examples before - they make good examples because they let us show how to do things like tracking a list of items, handling user input, and updating the UI when that data changes, which are all things that happen in a normal application.Defining Requirements​Let's start by figuring out the initial business requirements for this application:The UI should consist of three main sections:An input box to let the user type in the text of a new todo itemA list of all the existing todo itemsA footer section that shows the number of non-completed todos, and shows filtering optionsTodo list items should have a checkbox that toggles their "completed" status. We should also be able to add a color-coded category tag for a predefined list of colors, and delete todo items.The counter should pluralize the number of active todos: "0 items", "1 item", "3 items", etcThere should be buttons to mark all todos as completed, and to clear all completed todos by removing themThere should be two ways to filter the displayed todos in the list:Filtering based on showing "All", "Active", and "Completed" todosFiltering based on selecting one or more colors, and showing any todos whose tag that match those colorsWe'll add some more requirements later on, but this is enough to get us started.The end goal is an app that should look like this:Designing the State Values​One of the core principles of React and Redux is that your UI should be based on your state. So, one approach to designing an application is to first think of all the state needed to describe how the application works. It's also a good idea to try to describe your UI with as few values in the state as possible, so there's less data you need to keep track of and update.Conceptually, there are two main aspects of this application:The actual list of current todo itemsThe current filtering optionsWe'll also need to keep track of the data the user is typing into the "Add Todo" input box, but that's less important and we'll handle that later.For each todo item, we need to store a few pieces of information:The text the user enteredThe boolean flag saying if it's completed or notA unique ID valueA color category, if selectedOur filtering behavior can probably be described with some enumerated values:Completed status: "All", "Active", and "Completed"Colors: "Red", "Yellow", "Green", "Blue", "Orange", "Purple"Looking at these values, we can also say that the todos are "app state" (the core data that the application works with), while the filtering values are "UI state" (state that describes what the app is doing right now). It can be helpful to think about these different kinds of categories to help understand how the different pieces of state are being used.Designing the State Structure​With Redux, our application state is always kept in plain JavaScript objects and arrays. That means you may not put other things into the Redux state - no class instances, built-in JS types like Map / Set / Promise / Date, functions, or anything else that is not plain JS data.The root Redux state value is almost always a plain JS object, with other data nested inside of it.Based on this information, we should now be able to describe the kinds of values we need to have inside our Redux state:First, we need an array of todo item objects. Each item should have these fields:id: a unique numbertext: the text the user typed incompleted: a boolean flagcolor: An optional color categoryThen, we need to describe our filtering options. We need to have:The current "completed" filter valueAn array of the currently selected color categoriesSo, here's what an example of our app's state might look like:const todoAppState = { todos: [ { id: 0, text: 'Learn React', completed: true }, { id: 1, text: 'Learn Redux', completed: false, color: 'purple' }, { id: 2, text: 'Build something fun!', completed: false, color: 'blue' } ], filters: { status: 'Active', colors: ['red', 'blue'] }}It's important to note that it's okay to have other state values outside of Redux! This example is small enough so far that we actually do have all our state in the Redux store, but as we'll see later, some data really doesn't need to be kept in Redux (like "is this dropdown open?" or "current value of a form input").Designing Actions​Actions are plain JavaScript objects that have a type field. As mentioned earlier, you can think of an action as an event that describes something that happened in the application.In the same way that we designed the state structure based on the app's requirements, we should also be able to come up with a list of some of the actions that describe what's happening:Add a new todo entry based on the text the user enteredToggle the completed status of a todoSelect a color category for a todoDelete a todoMark all todos as completedClear all completed todosChoose a different "completed" filter valueAdd a new color filterRemove a color filterWe normally put any extra data needed to describe what's happening into the action.payload field. This could be a number, a string, or an object with multiple fields inside.The Redux store doesn't care what the actual text of the action.type field is. However, your own code will look at action.type to see if an update is needed. Also, you will frequently look at action type strings in the Redux DevTools Extension while debugging to see what's going on in your app. So, try to choose action types that are readable and clearly describe what's happening - it'll be much easier to understand things when you look at them later!Based on that list of things that can happen, we can create a list of actions that our application will use:{type: 'todos/todoAdded', payload: todoText}{type: 'todos/todoToggled', payload: todoId}{type: 'todos/colorSelected', payload: {todoId, color}}{type: 'todos/todoDeleted', payload: todoId}{type: 'todos/allCompleted'}{type: 'todos/completedCleared'}{type: 'filters/statusFilterChanged', payload: filterValue}{type: 'filters/colorFilterChanged', payload: {color, changeType}}In this case, the actions primarily have a single extra piece of data, so we can put that directly in the action.payload field. We could have split the color filter behavior into two actions, one for "added" and one for "removed", but in this case we'll do it as one action with an extra field inside specifically to show that we can have objects as an action payload.Like the state data, actions should contain the smallest amount of information needed to describe what happened.Writing Reducers​Now that we know what our state structure and our actions look like, it's time to write our first reducer.Reducers are functions that take the current state and an action as arguments, and return a new state result. In other words, (state, action) => newState.Creating the Root Reducer​A Redux app really only has one reducer function: the "root reducer" function that you will pass to createStore later on. That one root reducer function is responsible for handling all of the actions that are dispatched, and calculating what the entire new state result should be every time.Let's start by creating a reducer.js file in the src folder, alongside index.js and App.js.Every reducer needs some initial state, so we'll add some fake todo entries to get us started. Then, we can write an outline for the logic inside the reducer function:src/reducer.jsconst initialState = { todos: [ { id: 0, text: 'Learn React', completed: true }, { id: 1, text: 'Learn Redux', completed: false, color: 'purple' }, { id: 2, text: 'Build something fun!', completed: false, color: 'blue' } ], filters: { status: 'All', colors: [] }}// Use the initialState as a default valueexport default function appReducer(state = initialState, action) { // The reducer normally looks at the action type field to decide what happens switch (action.type) { // Do something here based on the different types of actions default: // If this reducer doesn't recognize the action type, or doesn't // care about this specific action, return the existing state unchanged return state }}A reducer may be called with undefined as the state value when the application is being initialized. If that happens, we need to provide an initial state value so the rest of the reducer code has something to work with. Reducers normally use default argument syntax to provide initial state: (state = initialState, action).Next, let's add the logic to handle the 'todos/todoAdded' action.We first need to check if the current action's type matches that specific string. Then, we need to return a new object containing all of the state, even for the fields that didn't change.src/reducer.jsfunction nextTodoId(todos) { const maxId = todos.reduce((maxId, todo) => Math.max(todo.id, maxId), -1) return maxId + 1}// Use the initialState as a default valueexport default function appReducer(state = initialState, action) { // The reducer normally looks at the action type field to decide what happens switch (action.type) { // Do something here based on the different types of actions case 'todos/todoAdded': { // We need to return a new state object return { // that has all the existing state data ...state, // but has a new array for the `todos` field todos: [ // with all of the old todos ...state.todos, // and the new todo object { // Use an auto-incrementing numeric ID for this example id: nextTodoId(state.todos), text: action.payload, completed: false } ] } } default: // If this reducer doesn't recognize the action type, or doesn't // care about this specific action, return the existing state unchanged return state }}That's... an awful lot of work to add one todo item to the state. Why is all this extra work necessary?Rules of Reducers​We said earlier that reducers must always follow some special rules:They should only calculate the new state value based on the state and action argumentsThey are not allowed to modify the existing state. Instead, they must make immutable updates, by copying the existing state and making changes to the copied values.They must not do any asynchronous logic or other "side effects"tipA "side effect" is any change to state or behavior that can be seen outside of returning a value from a function. Some common kinds of side effects are things like:Logging a value to the consoleSaving a fileSetting an async timerMak'''
