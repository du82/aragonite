["https://redux.js.org/tutorials/fundamentals/part-5-ui-react"]
title = "Redux Fundamentals, Part 5: UI and React | Redux"
description = "The official Redux Fundamentals tutorial: learn how to use Redux with React"
full_description = '''TutorialsRedux FundamentalsUI and ReactOn this pageRedux Fundamentals, Part 5: UI and ReactWhat You'll LearnHow a Redux store works with a UIHow to use Redux with ReactIntroduction​In Part 4: Store, we saw how to create a Redux store, dispatch actions, and read the current state. We also looked at how a store works inside, how enhancers and middleware let us customize the store with additional abilities, and how to add the Redux DevTools to let us see what's happening inside our app as actions are dispatched.In this section, we'll add a User Interface for our todo app. We'll see how Redux works with a UI layer overall, and we'll specifically cover how Redux works together with React.cautionNote that this page and all of the "Essentials" tutorial teach how to use our modern React-Redux hooks API. The old-style connect API still works, but today we want all Redux users using the hooks API.Also, the other pages in this tutorial intentionally show older-style Redux logic patterns that require more code than the "modern Redux" patterns with Redux Toolkit we teach as the right approach for building apps with Redux today, in order to explain the principles and concepts behind Redux.See the "Redux Essentials" tutorial for full examples of "how to use Redux, the right way" with Redux Toolkit and React-Redux hooks for real-world apps.Integrating Redux with a UI​Redux is a standalone JS library. As we've already seen, you can create and use a Redux store even if you don't have a user interface set up. This also means that you can use Redux with any UI framework (or even without any UI framework), and use it on both client and server. You can write Redux apps with React, Vue, Angular, Ember, jQuery, or vanilla JavaScript.That said, Redux was specifically designed to work well with React. React lets you describe your UI as a function of your state, and Redux contains state and updates it in response to actions.Because of that, we'll use React for this tutorial as we build our todo app, and cover the basics of how to use React with Redux.Before we get to that part, let's take a quick look at how Redux interacts with a UI layer in general.Basic Redux and UI Integration​Using Redux with any UI layer requires a few consistent steps:Create a Redux storeSubscribe to updatesInside the subscription callback:Get the current store stateExtract the data needed by this piece of UIUpdate the UI with the dataIf necessary, render the UI with initial stateRespond to UI inputs by dispatching Redux actionsLet's go back to the the counter app example we saw in Part 1 and see how it follows those steps:// 1) Create a new Redux store with the `createStore` functionconst store = Redux.createStore(counterReducer)// 2) Subscribe to redraw whenever the data changes in the futurestore.subscribe(render)// Our "user interface" is some text in a single HTML elementconst valueEl = document.getElementById('value')// 3) When the subscription callback runs:function render() { // 3.1) Get the current store state const state = store.getState() // 3.2) Extract the data you want const newValue = state.value.toString() // 3.3) Update the UI with the new value valueEl.innerHTML = newValue}// 4) Display the UI with the initial store staterender()// 5) Dispatch actions based on UI inputsdocument.getElementById('increment').addEventListener('click', function () { store.dispatch({ type: 'counter/incremented' })})No matter what UI layer you're using, Redux works this same way with every UI. The actual implementations are typically a bit more complicated to help optimize performance, but it's the same steps each time.Since Redux is a separate library, there are different "binding" libraries to help you use Redux with a given UI framework. Those UI binding libraries handle the details of subscribing to the store and efficiently updating the UI as state changes, so that you don't have to write that code yourself.Using Redux with React​The official React-Redux UI bindings library is a separate package from the Redux core. You'll need to install that in addition:npm install react-reduxFor this tutorial, we'll cover the most important patterns and examples you need to use React and Redux together, and see how they work in practice as part of our todo app.infoSee the official React-Redux docs at https://react-redux.js.org for a complete guide on how to use Redux and React together, and reference documentation on the React-Redux APIs.Designing the Component Tree​Much like we designed the state structure based on requirements, we can also design the overall set of UI components and how they relate to each other in the application.Based on the list of business requirements for the app, at a minimum we're going to need this set of components:<App>: the root component that renders everything else.<Header>: contains the "new todo" text input and the "complete all todos" checkbox<TodoList>: a list of all currently visible todo items, based on the filtered results<TodoListItem>: a single todo list item, with a checkbox that can be clicked to toggle the todo's completed status, and a color category selector<Footer>: Shows the number of active todos and controls for filtering the list based on completed status and color categoryBeyond this basic component structure, we could potentially divide the components up in several different ways. For example, the <Footer> component could be one larger component, or it could have multiple smaller components inside like <CompletedTodos>, <StatusFilter>, and <ColorFilters>. There's no single right way to divide these, and you'll find that it may be better to write larger components or split things into many smaller components depending on your situation.For now, we'll start with this small list of components to keep things easier to follow. On that note, since we assume that you already know React, we're going to skip past the details of how to write the layout code for these components and focus on how to actually use the React-Redux library in your React components.Here's the initial React UI of this app before we start adding any Redux-related logic:Reading State from the Store with useSelector​We know that we need to be able to show a list of todo items. Let's start by creating a <TodoList> component that can read the list of todos from the store, loop over them, and show one <TodoListItem> component for each todo entry.You should be familiar with React hooks like useState, which can be called in React function components to give them access to React state values. React also lets us write custom hooks, which let us extract reusable hooks to add our own behavior on top of React's built-in hooks.Like many other libraries, React-Redux includes its own custom hooks, which you can use in your own components. The React-Redux hooks give your React component the ability to talk to the Redux store by reading state and dispatching actions.The first React-Redux hook that we'll look at is the useSelector hook, which lets your React components read data from the Redux store.useSelector accepts a single function, which we call a selector function. A selector is a function that takes the entire Redux store state as its argument, reads some value from the state, and returns that result.For example, we know that our todo app's Redux state keeps the array of todo items as state.todos. We can write a small selector function that returns that todos array:const selectTodos = state => state.todosOr, maybe we want to find out how many todos are currently marked as "completed":const selectTotalCompletedTodos = state => { const completedTodos = state.todos.filter(todo => todo.completed) return completedTodos.length}So, selectors can return values from the Redux store state, and also return derived values based on that state as well.Let's read the array of todos into our <TodoList> component. First, we'll import the useSelector hook from the react-redux library, then call it with a selector function as its argument:src/features/todos/TodoList.jsimport React from 'react'import { useSelector } from 'react-redux'import TodoListItem from './TodoListItem'const selectTodos = state => state.todosconst TodoList = () => { const todos = useSelector(selectTodos) // since `todos` is an array, we can loop over it const renderedListItems = todos.map(todo => { return <TodoListItem key={todo.id} todo={todo} /> }) return <ul className="todo-list">{renderedListItems}</ul>}export default TodoListThe first time the <TodoList> component renders, the useSelector hook will call selectTodos and pass in the entire Redux state object. Whatever the selector returns will be returned by the hook to your component. So, the const todos in our component will end up holding the same state.todos array inside our Redux store state.But, what happens if we dispatch an action like {type: 'todos/todoAdded'}? The Redux state will be updated by the reducer, but our component needs to know that something has changed so that it can re-render with the new list of todos.We know that we can call store.subscribe() to listen for changes to the store, so we could try writing the code to subscribe to the store in every component. But, that would quickly get very repetitive and hard to handle.Fortunately, useSelector automatically subscribes to the Redux store for us! That way, any time an action is dispatched, it will call its selector function again right away. If the value returned by the selector changes from the last time it ran, useSelector will force our component to re-render with the new data. All we have to do is call useSelector() once in our component, and it does the rest of the work for us.However, there's a very important thing to remember here:cautionuseSelector compares its results using strict === reference comparisons, so the component will re-render any time the selector result is a new reference! This means that if you create a new reference in your selector and return it, your component could re-render every time an action has been dispatched, even if the data really isn't different.For example, passing this selector to useSelector will cause the component to always re-render, because array.map() always returns a new array reference:// Bad: always returning a new referenceconst selectTodoDescriptions = state => { // This creates a new array reference! return state.todos.map(todo => todo.text)}tipWe'll talk about one way to fix this issue later in this section. We'll also talk about how you can improve performance and avoid unnecessary re-renders using "memoized" selector function in Part 7: Standard Redux Patterns.It's also worth noting that we don't have to write a selector function as a separate variable. You can write a selector function directly inside the call to useSelector, like this:const todos = useSelector(state => state.todos)Dispatching Actions with useDispatch​We now know how to read data from the Redux store into our components. But, how can we dispatch actions to the store from a component? We know that outside of React, we can call store.dispatch(action). Since we don't have access to the store in a component file, we need some way to get access to the dispatch function by itself inside our components.The React-Redux useDispatch hook gives us the store's dispatch method as its result. (In fact, the implementation of the hook really is return store.dispatch.)So, we can call const dispatch = useDispatch() in any component that needs to dispatch actions, and then call dispatch(someAction) as needed.Let's try that in our <Header> component. We know that we need to let the user type in some text for a new todo item, and then dispatch a {type: 'todos/todoAdded'} action containing that text.We'll write a typical React form component that uses "controlled inputs" to let the user type in the form text. Then, when the user presses the Enter key specifically, we'll dispatch that action.src/features/header/Header.jsimport React, { useState } from 'react'import { useDispatch } from 'react-redux'const Header = () => { const [text, setText] = useState('') const dispatch = useDispatch() const handleChange = e => setText(e.target.value) const handleKeyDown = e => { const trimmedText = e.target.value.trim() // If the user pressed the Enter key: if (e.key === 'Enter' && trimmedText) { // Dispatch the "todo added" action with this text dispatch({ type: 'todos/todoAdded', payload: trimmedText }) // And clear out the text input setText('') } } return ( <input type="text" placeholder="What needs to be done?" autoFocus={true} value={text} onChange={handleChange} onKeyDown={handleKeyDown} /> )}export default HeaderPassing the Store with Provider​Our components can now read state from the store, and dispatch actions to the store. However, we're still missing something. Where and how are the React-Redux hooks finding the right Redux store? A hook is a JS function, so it can't automatically import a store from store.js by itself.Instead, we have to specifically tell React-Redux what store we want to use in our components. We do this by rendering a <Provider> component around our entire <App>, and passing the Redux store as a prop to <Provider>. After we do this once, every component in the application will be able to access the Redux store if it needs to.Let's add that to our main index.js file:src/index.jsimport React from 'react'import { createRoot } from 'react-dom/client'import { Provider } from 'react-redux'import App from './App'import store from './store'const root = createRoot(document.getElementById('root'))root.render( // Render a `<Provider>` around the entire `<App>`, // and pass the Redux store to it as a prop <React.StrictMode> <Provider store={store}> <App /> </Provider> </React.StrictMode>)That covers the key parts of using React-Redux with React:Call the useSelector hook to read data in React componentsCall the useDispatch hook to dispatch actions in React componentsPut <Provider store={store}> around your entire <App> component so that other components can talk to the storeWe should now be able to actually interact with the app! Here's the working UI so far:Now, let's look at a couple more ways we can use these together in our todo app.React-Redux Patterns​Global State, Component State, and Forms​By now you might be wondering, "Do I always have to put all my app's state into the Redux store?"The answer is NO. Global state that is needed across the app should go in the Redux store. State that's only needed in one place should be kept in component state.A good example of this is the <Header> component we wrote earlier. We could keep the current text input string in the Redux store, by dispatching an action in the input's onChange handler and keeping it in our reducer. But, that doesn't give us any benefit. The only place that text string is used is here, in the <Header> component.So, it makes sense to keep that value in a useState hook here in the <Header> component.Similarly, if we had a bo'''
