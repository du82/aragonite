full_description = '''IntroductionEcosystemOn this pageEcosystemRedux is a tiny library, but its contracts and APIs are carefully chosen to spawn an ecosystem of tools and extensions, and the community has created a wide variety of helpful addons, libraries, and tools. You don't need to use any of these addons to use Redux, but they can help make it easier to implement features and solve problems in your application.For an extensive catalog of libraries, addons, and tools related to Redux, check out the Redux Ecosystem Links list. Also, the React/Redux Links list contains tutorials and other useful resources for anyone learning React or Redux.This page lists some of the Redux-related addons that the Redux maintainers have vetted personally, or that have shown widespread adoption in the community. Don't let this discourage you from trying the rest of them! The ecosystem is growing too fast, and we have a limited time to look at everything. Consider these the “staff picks”, and don't hesitate to submit a PR if you've built something wonderful with Redux.Table of Contents​EcosystemTable of ContentsLibrary Integration and BindingsReducersReducer CombinationReducer CompositionHigher-Order ReducersActionsUtilitiesStoreChange SubscriptionsBatchingPersistenceImmutable DataData StructuresImmutable Update UtilitiesImmutable/Redux InteropSide EffectsWidely UsedPromisesMiddlewareNetworks and SocketsAsync BehaviorAnalyticsEntities and CollectionsComponent State and EncapsulationDev ToolsDebuggers and ViewersDevTools MonitorsLoggingMutation DetectionTestingRoutingFormsHigher-Level AbstractionsCommunity ConventionsLibrary Integration and Bindings​reduxjs/react-redux The official React bindings for Redux, maintained by the Redux teamangular-redux/ng-redux Angular 1 bindings for Reduxember-redux/ember-redux Ember bindings for Reduxglimmer-redux/glimmer-redux Redux bindings for Ember's Glimmer component enginetur-nr/polymer-redux Redux bindings for Polymerlastmjs/redux-store-element Redux bindings for custom elementsReducers​Reducer Combination​ryo33/combineSectionReducers An expanded version of combineReducers, which allows passing state as a third argument to all slice reducers.KodersLab/topologically-combine-reducers A combineReducers variation that allows defining cross-slice dependencies for ordering and data passingvar masterReducer = topologicallyCombineReducers( { auth, users, todos }, // define the dependency tree { auth: ['users'], todos: ['auth'] })Reducer Composition​acdlite/reduce-reducers Provides sequential composition of reducers at the same levelconst combinedReducer = combineReducers({ users, posts, comments })const rootReducer = reduceReducers(combinedReducer, otherTopLevelFeatureReducer)mhelmer/redux-xforms A collection of composable reducer transformersconst createByFilter = (predicate, mapActionToKey) => compose( withInitialState({}), // inject initial state as {} withFilter(predicate), // let through if action has filterName updateSlice(mapActionToKey), // update a single key in the state isolateSlice(mapActionToKey) // run the reducer on a single state slice )adrienjt/redux-data-structures Reducer factory functions for common data structures: counters, maps, lists (queues, stacks), setsconst myCounter = counter({ incrementActionTypes: ['INCREMENT'], decrementActionTypes: ['DECREMENT']})Higher-Order Reducers​omnidan/redux-undo Effortless undo/redo and action history for your reducersomnidan/redux-ignore Ignore redux actions by array or filter functionomnidan/redux-recycle Reset the redux state on certain actionsForbesLindesay/redux-optimist A reducer enhancer to enable type-agnostic optimistic updatesUtilities​reduxjs/reselect Creates composable memoized selector functions for efficiently deriving data from the store stateconst taxSelector = createSelector( [subtotalSelector, taxPercentSelector], (subtotal, taxPercent) => subtotal * (taxPercent / 100))paularmstrong/normalizr Normalizes nested JSON according to a schemaconst user = new schema.Entity('users')const comment = new schema.Entity('comments', { commenter: user })const article = new schema.Entity('articles', { author: user, comments: [comment]})const normalizedData = normalize(originalData, article)planttheidea/selectorator Abstractions over Reselect for common selector use casesconst getBarBaz = createSelector( ['foo.bar', 'baz'], (bar, baz) => `${bar} ${baz}`)getBarBaz({ foo: { bar: 'a' }, baz: 'b' }) // "a b"Store​Change Subscriptions​jprichardson/redux-watch Watch for state changes based on key paths or selectorslet w = watch(() => mySelector(store.getState()))store.subscribe( w((newVal, oldVal) => { console.log(newval, oldVal) }))ashaffer/redux-subscribe Centralized subscriptions to state changes based on pathsstore.dispatch( subscribe("users.byId.abcd", "subscription1", () => {} );Batching​tappleby/redux-batched-subscribe Store enhancer that can debounce subscription notificationsconst debounceNotify = _.debounce(notify => notify())const store = configureStore({ reducer, enhancers: [batchedSubscribe(debounceNotify)]})manaflair/redux-batch Store enhancer that allows dispatching arrays of actionsconst store = configureStore({ reducer, enhancers: existingEnhancersArray => [ reduxBatch, ...existingEnhancersArray, reduxBatch ]})store.dispatch([{ type: 'INCREMENT' }, { type: 'INCREMENT' }])laysent/redux-batch-actions-enhancer Store enhancer that accepts batched actionsconst store = configureStore({ reducer, enhancers: [batch().enhancer] })store.dispatch(createAction({ type: 'INCREMENT' }, { type: 'INCREMENT' }))tshelburne/redux-batched-actions Higher-order reducer that handles batched actionsconst store = configureStore({ reducer: enableBatching(rootReducer) })store.dispatch(batchActions([{ type: 'INCREMENT' }, { type: 'INCREMENT' }]))Persistence​rt2zz/redux-persist Persist and rehydrate a Redux store, with many extensible optionsconst persistConfig = { key: 'root', version: 1, storage }const persistedReducer = persistReducer(persistConfig, rootReducer)export const store = configureStore({ reducer: persistedReducer, middleware: getDefaultMiddleware => getDefaultMiddleware({ serializableCheck: { ignoredActions: [FLUSH, REHYDRATE, PAUSE, PERSIST, PURGE, REGISTER] } })})export const persistor = persistStore(store)react-stack/redux-storage Persistence layer for Redux with flexible backendsconst reducer = storage.reducer(combineReducers(reducers))const engine = createEngineLocalStorage('my-save-key')const storageMiddleware = storage.createMiddleware(engine)const store = configureStore({ reducer, middleware: getDefaultMiddleware => getDefaultMiddleware.concat(storageMiddleware)})redux-offline/redux-offline Persistent store for Offline-First apps, with support for optimistic UIsconst store = configureStore({ reducer, enhancer: [offline(offlineConfig)] })store.dispatch({ type: 'FOLLOW_USER_REQUEST', meta: { offline: { effect: {}, commit: {}, rollback: {} } }})Immutable Data​ImmerJS/immer Immutable updates with normal mutative code, using Proxiesconst nextState = produce(baseState, draftState => { draftState.push({ todo: 'Tweet about it' }) draftState[1].done = true})Side Effects​Widely Used​reduxjs/redux-thunk Dispatch functions, which are called and given dispatch and getState as parameters. This acts as a loophole for AJAX calls and other async behavior.Best for: getting started, simple async and complex synchronous logic.function fetchData(someValue) { return (dispatch, getState) => { dispatch({type : "REQUEST_STARTED"}); myAjaxLib.post("/someEndpoint", {data : someValue}) .then(response => dispatch({type : "REQUEST_SUCCEEDED", payload : response}) .catch(error => dispatch({type : "REQUEST_FAILED", error : error}); };}function addTodosIfAllowed(todoText) { return (dispatch, getState) => { const state = getState(); if(state.todos.length < MAX_TODOS) { dispatch({type : "ADD_TODO", text : todoText}); } }}listenerMiddleware (Redux Toolkit) listenerMiddleware is intended to be a lightweight alternative to more widely used Redux async middleware like sagas and observables. While similar to thunks in level of complexity and concept, it can be used to replicate some common saga usage patterns.listenerMiddleware.startListening({ matcher: isAnyOf(action1, action2, action3), effect: (action, listenerApi) => { const user = selectUserDetails(listenerApi.getState()) const { specialData } = action.meta analyticsApi.trackUsage(action.type, user, specialData) }})redux-saga/redux-saga Handle async logic using synchronous-looking generator functions. Sagas return descriptions of effects, which are executed by the saga middleware, and act like "background threads" for JS applications.Best for: complex async logic, decoupled workflowsfunction* fetchData(action) { const { someValue } = action try { const response = yield call(myAjaxLib.post, '/someEndpoint', { data: someValue }) yield put({ type: 'REQUEST_SUCCEEDED', payload: response }) } catch (error) { yield put({ type: 'REQUEST_FAILED', error: error }) }}function* addTodosIfAllowed(action) { const { todoText } = action const todos = yield select(state => state.todos) if (todos.length < MAX_TODOS) { yield put({ type: 'ADD_TODO', text: todoText }) }}redux-observable/redux-observableHandle async logic using RxJS observable chains called "epics". Compose and cancel async actions to create side effects and more.Best for: complex async logic, decoupled workflowsconst loginRequestEpic = action$ => action$ .ofType(LOGIN_REQUEST) .mergeMap(({ payload: { username, password } }) => Observable.from(postLogin(username, password)) .map(loginSuccess) .catch(loginFailure) )const loginSuccessfulEpic = action$ => action$ .ofType(LOGIN_SUCCESS) .delay(2000) .mergeMap(({ payload: { msg } }) => showMessage(msg))const rootEpic = combineEpics(loginRequestEpic, loginSuccessfulEpic)redux-loop/redux-loopA port of the Elm Architecture to Redux that allows you to sequence your effects naturally and purely by returning them from your reducers. Reducers now return both a state value and a side effect description.Best for: trying to be as much like Elm as possible in Redux+JSexport const reducer = (state = {}, action) => { switch (action.type) { case ActionType.LOGIN_REQUEST: const { username, password } = action.payload return loop( { pending: true }, Effect.promise(loginPromise, username, password) ) case ActionType.LOGIN_SUCCESS: const { user, msg } = action.payload return loop( { pending: false, user }, Effect.promise(delayMessagePromise, msg, 2000) ) case ActionType.LOGIN_FAILURE: return { pending: false, err: action.payload } default: return state }}jeffbski/redux-logicSide effects lib built with observables, but allows use of callbacks, promises, async/await, or observables. Provides declarative processing of actions.Best for: very decoupled async logicconst loginLogic = createLogic({ type: Actions.LOGIN_REQUEST, process({ getState, action }, dispatch, done) { const { username, password } = action.payload postLogin(username, password) .then( ({ user, msg }) => { dispatch(loginSucceeded(user)) setTimeout(() => dispatch(showMessage(msg)), 2000) }, err => dispatch(loginFailure(err)) ) .then(done) }})Promises​acdlite/redux-promise Dispatch promises as action payloads, and have FSA-compliant actions dispatched as the promise resolves or rejects.dispatch({ type: 'FETCH_DATA', payload: myAjaxLib.get('/data') })// will dispatch either {type : "FETCH_DATA", payload : response} if resolved,// or dispatch {type : "FETCH_DATA", payload : error, error : true} if rejectedlelandrichardson/redux-pack Sensible, declarative, convention-based promise handling that guides users in a good direction without exposing the full power of dispatch.dispatch({type : "FETCH_DATA", payload : myAjaxLib.get("/data") });// in a reducer: case "FETCH_DATA": = return handle(state, action, { start: prevState => ({ ...prevState, isLoading: true, fooError: null }), finish: prevState => ({ ...prevState, isLoading: false }), failure: prevState => ({ ...prevState, fooError: payload }), success: prevState => ({ ...prevState, foo: payload }), });Middleware​Networks and Sockets​svrcekmichal/redux-axios-middleware Fetches data with Axios and dispatches start/success/fail actionsexport const loadCategories() => ({ type: 'LOAD', payload: { request : { url: '/categories'} } });agraboso/redux-api-middleware Reads API call actions, fetches, and dispatches FSAsconst fetchUsers = () => ({ [CALL_API]: { endpoint: 'http://www.example.com/api/users', method: 'GET', types: ['REQUEST', 'SUCCESS', 'FAILURE'] }})itaylor/redux-socket.io An opinionated connector between socket.io and redux.const store = configureStore({ reducer, middleware: getDefaultMiddleware => getDefaultMiddleware.concat(socketIoMiddleware)})store.dispatch({ type: 'server/hello', data: 'Hello!' })tiberiuc/redux-react-firebase Integration between Firebase, React, and ReduxAsync Behavior​rt2zz/redux-action-buffer Buffers all actions into a queue until a breaker condition is met, at which point the queue is releasedwyze/redux-debounce FSA-compliant middleware for Redux to debounce actions.mathieudutour/redux-queue-offline Queue actions when offline and dispatch them when getting back online.Analytics​rangle/redux-beacon Integrates with any analytics services, can track while offline, and decouples analytics logic from app logicmarkdalgleish/redux-analytics Watches for Flux Standard Actions with meta analytics values and processes themEntities and Collections​tommikaikkonen/redux-orm A simple immutable ORM to manage relational data in your Redux store.Versent/redux-crud Convention-based actions and reducers for CRUD logickwelch/entities-reducer A higher-order reducer that handles data from Normalizramplitude/redux-query Declare colocated data dependencies with your components, run queries when components mount, perform optimistic updates, and trigger server changes with Redux actions.cantierecreativo/redux-bees Declarative JSON-API interaction that normalizes data, with a React HOC that can run queriesGetAmbassador/redux-clerk Async CRUD handling with normalization, optimistic updates, sync/async action creators, selectors, and an extendable reducer.shoutem/redux-io JSON-API abstraction with async CRUD, normalization, optimistic updates, caching, data status, and error handling.jmeas/redux-resource A tiny but powerful system for managing 'resources': data that is persisted to remote servers.Component State and Encapsulation​threepointone/redux-react-local Local component state in Redux, with handling for component actions@local({ ident: 'counter', initial: 0, reducer : (state, action) => action.me ? state + 1 : state }})class Counter extends React.Component {epeli/lean-redux Makes component state in Redux as easy as setStateconst DynamicCounters = connectLean( scope: "dynamicCounters", getInitialState() => ({counterCount : 1}), addCounter, removeCounter)(CounterList);DataDog/redux-doghouse Aims to make reusable components easier to build with Redux by scoping a'''
