title = "Usage With TypeScript | Redux"
description = "- Standard patterns for setting up a Redux app with TypeScript"
full_description = '''Using ReduxCode QualityUsage With TypeScriptOn this pageUsage with TypeScriptWhat You'll LearnStandard patterns for setting up a Redux app with TypeScriptTechniques for correctly typing portions of Redux logicPrerequisitesUnderstanding of TypeScript syntax and termsFamiliarity with TypeScript concepts like generics and utility typesKnowledge of React HooksOverview​TypeScript is a typed superset of JavaScript that provides compile-time checking of source code. When used with Redux, TypeScript can help provide:Type safety for reducers, state and action creators, and UI componentsEasy refactoring of typed codeA superior developer experience in a team environmentWe strongly recommend using TypeScript in Redux applications. However, like all tools, TypeScript has tradeoffs. It adds complexity in terms of writing additional code, understanding TS syntax, and building the application. At the same time, it provides value by catching errors earlier in development, enabling safer and more efficient refactoring, and acting as documentation for existing source code.We believe that pragmatic use of TypeScript provides more than enough value and benefit to justify the added overhead, especially in larger codebases, but you should take time to evaluate the tradeoffs and decide whether it's worth using TS in your own application.There are multiple possible approaches to type checking Redux code. This page shows our standard recommended patterns for using Redux and TypeScript together, and is not an exhaustive guide. Following these patterns should result in a good TS usage experience, with the best tradeoffs between type safety and amount of type declarations you have to add to your codebase.Standard Redux Toolkit Project Setup with TypeScript​We assume that a typical Redux project is using Redux Toolkit and React Redux together.Redux Toolkit (RTK) is the standard approach for writing modern Redux logic. RTK is already written in TypeScript, and its API is designed to provide a good experience for TypeScript usage.React Redux has its type definitions in a separate @types/react-redux typedefs package on NPM. In addition to typing the library functions, the types also export some helpers to make it easier to write typesafe interfaces between your Redux store and your React components.As of React Redux v7.2.3, the react-redux package has a dependency on @types/react-redux, so the type definitions will be automatically installed with the library. Otherwise, you'll need to manually install them yourself (typically npm install @types/react-redux ).The Redux+TS template for Create-React-App comes with a working example of these patterns already configured.Define Root State and Dispatch Types​Using configureStore should not need any additional typings. You will, however, want to extract the RootState type and the Dispatch type so that they can be referenced as needed. Inferring these types from the store itself means that they correctly update as you add more state slices or modify middleware settings.Since those are types, it's safe to export them directly from your store setup file such as app/store.ts and import them directly into other files.app/store.tsimport { configureStore } from '@reduxjs/toolkit'// ...export const store = configureStore({ reducer: { posts: postsReducer, comments: commentsReducer, users: usersReducer }})// Get the type of our store variableexport type AppStore = typeof store// Infer the `RootState` and `AppDispatch` types from the store itselfexport type RootState = ReturnType<AppStore['getState']>// Inferred type: {posts: PostsState, comments: CommentsState, users: UsersState}export type AppDispatch = AppStore['dispatch']Define Typed Hooks​While it's possible to import the RootState and AppDispatch types into each component, it's better to create pre-typed versions of the useDispatch and useSelector hooks for usage in your application. This is important for a couple reasons:For useSelector, it saves you the need to type (state: RootState) every timeFor useDispatch, the default Dispatch type does not know about thunks or other middleware. In order to correctly dispatch thunks, you need to use the specific customized AppDispatch type from the store that includes the thunk middleware types, and use that with useDispatch. Adding a pre-typed useDispatch hook keeps you from forgetting to import AppDispatch where it's needed.Since these are actual variables, not types, it's important to define them in a separate file such as app/hooks.ts, not the store setup file. This allows you to import them into any component file that needs to use the hooks, and avoids potential circular import dependency issues..withTypes()​Previously, the approach for "pre-typing" hooks with your app setting was a little varied. The result would look something like the snippet below:app/hooks.tsimport type { TypedUseSelectorHook } from 'react-redux'import { useDispatch, useSelector, useStore } from 'react-redux'import type { AppDispatch, AppStore, RootState } from './store'// Use throughout your app instead of plain `useDispatch` and `useSelector`export const useAppDispatch: () => AppDispatch = useDispatchexport const useAppSelector: TypedUseSelectorHook<RootState> = useSelectorexport const useAppStore: () => AppStore = useStoreReact Redux v9.1.0 adds a new .withTypes method to each of these hooks, analogous to the .withTypes method found on Redux Toolkit's createAsyncThunk.The setup now becomes:app/hooks.tsimport { useDispatch, useSelector, useStore } from 'react-redux'import type { AppDispatch, AppStore, RootState } from './store'// Use throughout your app instead of plain `useDispatch` and `useSelector`export const useAppDispatch = useDispatch.withTypes<AppDispatch>()export const useAppSelector = useSelector.withTypes<RootState>()export const useAppStore = useStore.withTypes<AppStore>()Application Usage​Define Slice State and Action Types​Each slice file should define a type for its initial state value, so that createSlice can correctly infer the type of state in each case reducer.All generated actions should be defined using the PayloadAction<T> type from Redux Toolkit, which takes the type of the action.payload field as its generic argument.You can safely import the RootState type from the store file here. It's a circular import, but the TypeScript compiler can correctly handle that for types. This may be needed for use cases like writing selector functions.features/counter/counterSlice.tsimport { createSlice, PayloadAction } from '@reduxjs/toolkit'import type { RootState } from '../../app/store'// Define a type for the slice stateinterface CounterState { value: number}// Define the initial state using that typeconst initialState: CounterState = { value: 0}export const counterSlice = createSlice({ name: 'counter', // `createSlice` will infer the state type from the `initialState` argument initialState, reducers: { increment: state => { state.value += 1 }, decrement: state => { state.value -= 1 }, // Use the PayloadAction type to declare the contents of `action.payload` incrementByAmount: (state, action: PayloadAction<number>) => { state.value += action.payload } }})export const { increment, decrement, incrementByAmount } = counterSlice.actions// Other code such as selectors can use the imported `RootState` typeexport const selectCount = (state: RootState) => state.counter.valueexport default counterSlice.reducerThe generated action creators will be correctly typed to accept a payload argument based on the PayloadAction<T> type you provided for the reducer. For example, incrementByAmount requires a number as its argument.In some cases, TypeScript may unnecessarily tighten the type of the initial state. If that happens, you can work around it by casting the initial state using as, instead of declaring the type of the variable:// Workaround: cast state instead of declaring variable typeconst initialState = { value: 0} as CounterStateUse Typed Hooks in Components​In component files, import the pre-typed hooks instead of the standard hooks from React Redux.features/counter/Counter.tsximport React, { useState } from 'react'import { useAppSelector, useAppDispatch } from 'app/hooks'import { decrement, increment } from './counterSlice'export function Counter() { // The `state` arg is correctly typed as `RootState` already const count = useAppSelector(state => state.counter.value) const dispatch = useAppDispatch() // omit rendering logic}Warn about wrong importsESLint can help your team import the right hooks easily. The typescript-eslint/no-restricted-imports rule can show a warning when the wrong import is used accidentally.You could add this to your ESLint config as an example:"no-restricted-imports": "off","@typescript-eslint/no-restricted-imports": [ "warn", { "name": "react-redux", "importNames": ["useSelector", "useDispatch"], "message": "Use typed hooks `useAppDispatch` and `useAppSelector` instead." }],Typing Additional Redux Logic​Type Checking Reducers​Reducers are pure functions that receive the current state and incoming action as arguments, and return a new state.If you are using Redux Toolkit's createSlice, you should rarely need to specifically type a reducer separately. If you do actually write a standalone reducer, it's typically sufficient to declare the type of the initialState value, and type the action as UnknownAction:import { UnknownAction } from 'redux'interface CounterState { value: number}const initialState: CounterState = { value: 0}export default function counterReducer( state = initialState, action: UnknownAction) { // logic here}However, the Redux core does export a Reducer<State, Action> type you can use as well.Type Checking Middleware​Middleware are an extension mechanism for the Redux store. Middleware are composed into a pipeline that wrap the store's dispatch method, and have access to the store's dispatch and getState methods.The Redux core exports a Middleware type that can be used to correctly type a middleware function:export interface Middleware< DispatchExt = {}, // optional override return behavior of `dispatch` S = any, // type of the Redux store state D extends Dispatch = Dispatch // type of the dispatch method>A custom middleware should use the Middleware type, and pass the generic args for S (state) and D (dispatch) if needed:import { Middleware } from 'redux'import { RootState } from '../store'export const exampleMiddleware: Middleware< {}, // Most middleware do not modify the dispatch return value RootState> = storeApi => next => action => { const state = storeApi.getState() // correctly typed as RootState}cautionIf you are using typescript-eslint, the @typescript-eslint/ban-types rule might report an error if you use {} for the dispatch value. The recommended changes it makes are incorrect and will break your Redux store types, you should disable the rule for this line and keep using {}.The dispatch generic should likely only be needed if you are dispatching additional thunks within the middleware.In cases where type RootState = ReturnType<typeof store.getState> is used, a circular type reference between the middleware and store definitions can be avoided by switching the type definition of RootState to:const rootReducer = combineReducers({ ... });type RootState = ReturnType<typeof rootReducer>;Switching the type definition of RootState with Redux Toolkit example:// instead of defining the reducers in the reducer field of configureStore, combine them here:const rootReducer = combineReducers({ counter: counterReducer })// then set rootReducer as the reducer object of configureStoreconst store = configureStore({ reducer: rootReducer, middleware: getDefaultMiddleware => getDefaultMiddleware().concat(yourMiddleware)})type RootState = ReturnType<typeof rootReducer>Type Checking Redux Thunks​Redux Thunk is the standard middleware for writing sync and async logic that interacts with the Redux store. A thunk function receives dispatch and getState as its parameters. Redux Thunk has a built in ThunkAction type which we can use to define types for those arguments:export type ThunkAction< R, // Return type of the thunk function S, // state type used by getState E, // any "extra argument" injected into the thunk A extends Action // known types of actions that can be dispatched> = (dispatch: ThunkDispatch<S, E, A>, getState: () => S, extraArgument: E) => RYou will typically want to provide the R (return type) and S (state) generic arguments. Unfortunately, TS does not allow only providing some generic arguments, so the usual values for the other arguments are unknown for E and UnknownAction for A:import { UnknownAction } from 'redux'import { sendMessage } from './store/chat/actions'import { RootState } from './store'import { ThunkAction } from 'redux-thunk'export const thunkSendMessage = (message: string): ThunkAction<void, RootState, unknown, UnknownAction> => async dispatch => { const asyncResp = await exampleAPI() dispatch( sendMessage({ message, user: asyncResp, timestamp: new Date().getTime() }) ) }function exampleAPI() { return Promise.resolve('Async Chat Bot')}To reduce repetition, you might want to define a reusable AppThunk type once, in your store file, and then use that type whenever you write a thunk:export type AppThunk<ReturnType = void> = ThunkAction< ReturnType, RootState, unknown, UnknownAction>Note that this assumes that there is no meaningful return value from the thunk. If your thunk returns a promise and you want to use the returned promise after dispatching the thunk, you'd want to use this as AppThunk<Promise<SomeReturnType>>.cautionDon't forget that the default useDispatch hook does not know about thunks, and so dispatching a thunk will cause a type error. Be sure to use an updated form of Dispatch in your components that recognizes thunks as an acceptable type to dispatch.Usage with React Redux​While React Redux is a separate library from Redux itself, it is commonly used with React.For a complete guide on how to correctly use React Redux with TypeScript, see the "Static Typing" page in the React Redux docs. This section will highlight the standard patterns.If you are using TypeScript, the React Redux types are maintained separately in DefinitelyTyped, but included as a dependency of the react-redux package, so they should be installed automatically. If you still need to install them manually, run:npm install @types/react-reduxTyping the useSelector hook​Declare the type of the state parameter in the selector function, and the return type of useSelector will be inferred to match the return type of the selector:interface RootState { isOn: boolean}// TS infers type: (state: RootState) => booleanconst selectIsOn = (state: RootState) => state.isOn// TS infers `isOn` is booleanconst isOn = useSelector(selectIsOn)This can also be done inline as well:const isOn = useSelector((state: RootState) => state.isOn)However, prefer creating a pre-typed useAppSelector hook with the correct type of sta'''
