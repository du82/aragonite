title = "Migrating to Modern Redux | Redux"
description = "Usage > Setup > Migrating to Modern Redux: how to modernize legacy Redux code"
full_description = '''Using ReduxMigrationsMigrating to Modern ReduxOn this pageMigrating to Modern ReduxWhat You'll LearnHow to modernize legacy "hand-written" Redux logic to use Redux ToolkitHow to modernize legacy React-Redux connect components to use the hooks APIHow to modernize Redux logic and React-Redux components that use TypeScriptOverview​Redux has been around since 2015, and our recommended patterns for writing Redux code have changed significantly over the years. In the same way that React has evolved from createClass to React.Component to function components with hooks, Redux has evolved from manual store setup + hand-written reducers with object spreads + React-Redux's connect, to Redux Toolkit's configureStore + createSlice + React-Redux's hooks API.Many users are working on older Redux codebases that have been around since before these "modern Redux" patterns existed. Migrating those codebases to today's recommended modern Redux patterns will result in codebases that are much smaller and easier to maintain.The good news is that you can migrate your code to modern Redux incrementally, piece by piece, with old and new Redux code coexisting and working together!This page covers the general approaches and techniques you can use to modernize an existing legacy Redux codebase.infoFor more details on how "modern Redux" with Redux Toolkit + React-Redux hooks simplifies using Redux, see these additional resources:Why Redux Toolkit is How to use Redux TodayRedux Essentials: Redux Toolkit App StructureRedux Fundamentals: Modern Redux with Redux ToolkitPresentation: Modern Redux with Redux ToolkitModernizing Redux Logic with Redux Toolkit​The general approach to migrating Redux logic is:Replace the existing manual Redux store setup with Redux Toolkit's configureStorePick an existing slice reducer and its associated actions. Replace those with RTK's createSlice. Repeat for one reducer at a time.As needed, replace existing data fetching logic with RTK Query or createAsyncThunkUse RTK's other APIs like createListenerMiddleware or createEntityAdapter as neededYou should always start by replacing the legacy createStore call with configureStore. This is a one-time step, and all of the existing reducers and middleware will continue to work as-is. configureStore includes development-mode checks for common mistakes like accidental mutations and non-serializable values, so having those in place will help identify any areas of the codebase where those mistakes are happening.infoYou can see this general approach in action in Redux Fundamentals, Part 8: Modern Redux with Redux Toolkit.Store Setup with configureStore​A typical legacy Redux store setup file does several different steps:Combining the slice reducers into the root reducerCreating the middleware enhancer, usually with the thunk middleware, and possibly other middleware in development mode such as redux-loggerAdding the Redux DevTools enhancer, and composing the enhancers togetherCalling createStoreHere's what those steps might look like in an existing application:src/app/store.jsimport { createStore, applyMiddleware, combineReducers, compose } from 'redux'import { thunk } from 'redux-thunk'import postsReducer from '../reducers/postsReducer'import usersReducer from '../reducers/usersReducer'const rootReducer = combineReducers({ posts: postsReducer, users: usersReducer})const middlewareEnhancer = applyMiddleware(thunk)const composeWithDevTools = window.__REDUX_DEVTOOLS_EXTENSION_COMPOSE__ || composeconst composedEnhancers = composeWithDevTools(middlewareEnhancer)const store = createStore(rootReducer, composedEnhancers)All of those steps can be replaced with a single call to Redux Toolkit's configureStore API.RTK's configureStore wraps around the original createStore method, and handles most of the store setup for us automatically. In fact, we can cut it down to effectively one step:Basic Store Setup: src/app/store.jsimport { configureStore } from '@reduxjs/toolkit'import postsReducer from '../reducers/postsReducer'import usersReducer from '../reducers/usersReducer'// Automatically adds the thunk middleware and the Redux DevTools extensionconst store = configureStore({ // Automatically calls `combineReducers` reducer: { posts: postsReducer, users: usersReducer }})That one call to configureStore did all the work for us:It called combineReducers to combine postsReducer and usersReducer into the root reducer function, which will handle a root state that looks like {posts, users}It called createStore to create a Redux store using that root reducerIt automatically added the thunk middleware and called applyMiddlewareIt automatically added more middleware to check for common mistakes like accidentally mutating the stateIt automatically set up the Redux DevTools Extension connectionIf your store setup requires additional steps, such as adding additional middleware, passing in an extra argument to the thunk middleware, or creating a persisted root reducer, you can do that as well. Here's a larger example that shows customizing the built-in middleware and turning on Redux-Persist, which demonstrates some of the options for working with configureStore:Detailed Example: Custom Store Setup with Persistence and MiddlewareThis example shows several possible common tasks when setting up a Redux store:Combining the reducers separately (sometimes needed due to other architectural constraints)Adding additional middleware, both conditionally and unconditionallyPassing an "extra argument" into the thunk middleware, such as an API service layerUsing the Redux-Persist library, which requires special handling for its non-serializable action typesTurning the devtools off in prod, and setting additional devtools options in developmentNone of these are required, but they do show up frequently in real-world codebases.Custom Store Setup: src/app/store.jsimport { configureStore, combineReducers } from '@reduxjs/toolkit'import { persistStore, persistReducer, FLUSH, REHYDRATE, PAUSE, PERSIST, PURGE, REGISTER} from 'redux-persist'import storage from 'redux-persist/lib/storage'import { PersistGate } from 'redux-persist/integration/react'import logger from 'redux-logger'import postsReducer from '../features/posts/postsSlice'import usersReducer from '../features/users/usersSlice'import { api } from '../features/api/apiSlice'import { serviceLayer } from '../features/api/serviceLayer'import stateSanitizerForDevtools from './devtools'import customMiddleware from './someCustomMiddleware'// Can call `combineReducers` yourself if neededconst rootReducer = combineReducers({ posts: postsReducer, users: usersReducer, [api.reducerPath]: api.reducer})const persistConfig = { key: 'root', version: 1, storage}const persistedReducer = persistReducer(persistConfig, rootReducer)const store = configureStore({ // Pass previously created persisted reducer reducer: persistedReducer, middleware: getDefaultMiddleware => { const middleware = getDefaultMiddleware({ // Pass in a custom `extra` argument to the thunk middleware thunk: { extraArgument: { serviceLayer } }, // Customize the built-in serializability dev check serializableCheck: { ignoredActions: [FLUSH, REHYDRATE, PAUSE, PERSIST, PURGE, REGISTER] } }).concat(customMiddleware, api.middleware) // Conditionally add another middleware in dev if (process.env.NODE_ENV !== 'production') { middleware.push(logger) } return middleware }, // Turn off devtools in prod, or pass options in dev devTools: process.env.NODE_ENV === 'production' ? false : { stateSanitizer: stateSanitizerForDevtools }})Reducers and Actions with createSlice​A typical legacy Redux codebase has its reducer logic, action creators, and action types spread across separate files, and those files are often in separate folders by type. The reducer logic is written using switch statements and hand-written immutable update logic with object spreads and array mapping:src/constants/todos.jsexport const ADD_TODO = 'ADD_TODO'export const TOGGLE_TODO = 'TOGGLE_TODO'src/actions/todos.jsimport { ADD_TODO, TOGGLE_TODO } from '../constants/todos'export const addTodo = (id, text) => ({ type: ADD_TODO, text, id})export const toggleTodo = id => ({ type: TOGGLE_TODO, id})src/reducers/todos.jsimport { ADD_TODO, TOGGLE_TODO } from '../constants/todos'const initialState = []export default function todosReducer(state = initialState, action) { switch (action.type) { case ADD_TODO: { return state.concat({ id: action.id, text: action.text, completed: false }) } case TOGGLE_TODO: { return state.map(todo => { if (todo.id !== action.id) { return todo } return { ...todo, completed: !todo.completed } }) } default: return state }}Redux Toolkit's createSlice API was designed to eliminate all the "boilerplate" with writing reducers, actions, and immutable updates!With Redux Toolkit, there's multiple changes to that legacy code:createSlice will eliminate the hand-written action creators and action types entirelyAll of the uniquely-named fields like action.text and action.id get replaced by action.payload, either as an individual value or an object containing those fieldsThe hand-written immutable updates are replaced by "mutating" logic in reducers thanks to ImmerThere's no need for separate files for each type of codeWe teach having all logic for a given reducer in a single "slice" fileInstead of having separate folders by "type of code", we recommend organizing files by "features", with related code living in the same folderIdeally, the naming of the reducers and actions should use the past tense and describe "a thing that happened", rather than an imperative "do this thing now", such as todoAdded instead of ADD_TODOThose separate files for constants, actions, and reducers, would all be replaced by a single "slice" file. The modernized slice file would look like this:src/features/todos/todosSlice.jsimport { createSlice } from '@reduxjs/toolkit'const initialState = []const todosSlice = createSlice({ name: 'todos', initialState, reducers: { // Give case reducers meaningful past-tense "event"-style names todoAdded(state, action) { const { id, text } = action.payload // "Mutating" update syntax thanks to Immer, and no `return` needed state.todos.push({ id, text, completed: false }) }, todoToggled(state, action) { // Look for the specific nested object to update. // In this case, `action.payload` is the default field in the action, // and can hold the `id` value - no need for `action.id` separately const matchingTodo = state.todos.find(todo => todo.id === action.payload) if (matchingTodo) { // Can directly "mutate" the nested object matchingTodo.completed = !matchingTodo.completed } } }})// `createSlice` automatically generated action creators with these names.// export them as named exports from this "slice" fileexport const { todoAdded, todoToggled } = todosSlice.actions// Export the slice reducer as the default exportexport default todosSlice.reducerWhen you call dispatch(todoAdded('Buy milk')), whatever single value you pass to the todoAdded action creator will automatically get used as the action.payload field. If you need to pass in multiple values, do so as an object, like dispatch(todoAdded({id, text})). Alternately, you can use the "prepare" notation inside of a createSlice reducer to accept multiple separate arguments and create the payload field. The prepare notation is also useful for cases where the action creators were doing additional work, such as generating unique IDs for each item.While Redux Toolkit does not specifically care about your folder and file structures or action naming, these are the best practices we recommend because we've found they lead to more maintainable and understandable code.Data Fetching with RTK Query​Typical legacy data fetching in a React+Redux app requires many moving pieces and types of code:Action creators and action types that represent "request starting", "request succeeded", and "request failed" actionsThunks to dispatch the actions and make the async requestReducers that track loading status and store the cached dataSelectors to read those values from the storeDispatching the thunk in a component after mounting, either via componentDidMount in a class component or useEffect in a function componentThese typically would be split across many different files:src/constants/todos.jsexport const FETCH_TODOS_STARTED = 'FETCH_TODOS_STARTED'export const FETCH_TODOS_SUCCEEDED = 'FETCH_TODOS_SUCCEEDED'export const FETCH_TODOS_FAILED = 'FETCH_TODOS_FAILED'src/actions/todos.jsimport axios from 'axios'import { FETCH_TODOS_STARTED, FETCH_TODOS_SUCCEEDED, FETCH_TODOS_FAILED} from '../constants/todos'export const fetchTodosStarted = () => ({ type: FETCH_TODOS_STARTED})export const fetchTodosSucceeded = todos => ({ type: FETCH_TODOS_SUCCEEDED, todos})export const fetchTodosFailed = error => ({ type: FETCH_TODOS_FAILED, error})export const fetchTodos = () => { return async dispatch => { dispatch(fetchTodosStarted()) try { // Axios is common, but also `fetch`, or your own "API service" layer const res = await axios.get('/todos') dispatch(fetchTodosSucceeded(res.data)) } catch (err) { dispatch(fetchTodosFailed(err)) } }}src/reducers/todos.jsimport { FETCH_TODOS_STARTED, FETCH_TODOS_SUCCEEDED, FETCH_TODOS_FAILED} from '../constants/todos'const initialState = { status: 'uninitialized', todos: [], error: null}export default function todosReducer(state = initialState, action) { switch (action.type) { case FETCH_TODOS_STARTED: { return { ...state, status: 'loading' } } case FETCH_TODOS_SUCCEEDED: { return { ...state, status: 'succeeded', todos: action.todos } } case FETCH_TODOS_FAILED: { return { ...state, status: 'failed', todos: [], error: action.error } } default: return state }}src/selectors/todos.jsexport const selectTodosStatus = state => state.todos.statusexport const selectTodos = state => state.todos.todossrc/components/TodosList.jsimport { useEffect } from 'react'import { useSelector, useDispatch } from 'react-redux'import { fetchTodos } from '../actions/todos'import { selectTodosStatus, selectTodos } from '../selectors/todos'export function TodosList() { const dispatch = useDispatch() const status = useSelector(selectTodosStatus) const todos = useSelector(selectTodos) useEffect(() => { dispatch(fetchTodos()) }, [dispatch]) // omit rendering logic here}Many users may be using the redux-saga library to manage data fetching, in which case they might have additional "signal" action types used to trigger the sagas, and this saga file instead of thunks:src/sagas/todos.jsimport { put, takeEvery, call } from 'redux-saga/effects'import { FETCH_TODOS_BEGIN, fetchTodosStarted, fetchTodosSucceeded, fetchTodosFailed} from '../actions/todos'// Saga to actually fetch dataexport function* fetchTodos() { yield put(fetchTodosStarted()) try { const res = yield call(axios.get, '/todos') yield put(fetchTodosSucceeded(res.data)) } catch (err) { yield put(fetchTodosFailed(err)) }}// "Watcher" saga that waits for a "signal" action, which is// dispat'''
