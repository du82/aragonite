title = "Redux - A JS library for predictable and maintainable global state management | Redux"
description = "A JS library for predictable and maintainable global state management"
full_description = '''Production Error CodesWhen Redux is built and running in production, error text is replaced by indexed error codes to save on bundle size. These errors will provide a link to this page with more information about the error below.All Error CodesCodeMessage0It looks like you are passing several store enhancers to createStore(). This is not supported. Instead, compose them together to a single function. See https://redux.js.org/tutorials/fundamentals/part-4-store#creating-a-store-with-enhancers for an example.1Expected the enhancer to be a function. Instead, received: ''2Expected the root reducer to be a function. Instead, received: ''3You may not call store.getState() while the reducer is executing. The reducer has already received the state as an argument. Pass it down from the top reducer instead of reading it from the store.4Expected the listener to be a function. Instead, received: ''5You may not call store.subscribe() while the reducer is executing. If you would like to be notified after the store has been updated, subscribe from a component and invoke store.getState() in the callback to access the latest state. See https://redux.js.org/api/store#subscribelistener for more details.6You may not unsubscribe from a store listener while the reducer is executing. See https://redux.js.org/api/store#subscribelistener for more details.7Actions must be plain objects. Instead, the actual type was: ''. You may need to add middleware to your store setup to handle dispatching other values, such as 'redux-thunk' to handle dispatching functions. See https://redux.js.org/tutorials/fundamentals/part-4-store#middleware and https://redux.js.org/tutorials/fundamentals/part-6-async-logic#using-the-redux-thunk-middleware for examples.8Actions may not have an undefined "type" property. You may have misspelled an action type string constant.9Reducers may not dispatch actions.10Expected the nextReducer to be a function. Instead, received: '11Expected the observer to be an object. Instead, received: ''12The slice reducer for key "" returned undefined during initialization. If the state passed to the reducer is undefined, you must explicitly return the initial state. The initial state may not be undefined. If you don't want to set a value for this reducer, you can use null instead of undefined.13The slice reducer for key "" returned undefined when probed with a random type. Don't try to handle '' or other actions in "redux/*" namespace. They are considered private. Instead, you must return the current state for any unknown actions, unless it is undefined, in which case you must return the initial state, regardless of the action type. The initial state may not be undefined, but can be null.14When called with an action of type , the slice reducer for key "" returned undefined. To ignore an action, you must explicitly return the previous state. If you want this reducer to hold no value, you can return null instead of undefined.15Dispatching while constructing your middleware is not allowed. Other middleware would not be applied to this dispatch.16bindActionCreators expected an object or a function, but instead received: ''. Did you write "import ActionCreators from" instead of "import * as ActionCreators from"?17Action "type" property must be a string. Instead, the actual type was: ''. Value was: '' (stringified)'''
