["https://redux.js.org/usage/side-effects-approaches"]
title = "Side Effects Approaches | Redux"
description = "Usage > Redux Logic > Side Effects Approaches: tools and recommendations for managing side effects"
full_description = '''Using ReduxRedux Logic and PatternsSide Effects ApproachesOn this pageSide Effects ApproachesWhat You'll LearnWhat "side effects" are and how they fit into ReduxCommon tools for managing side effects with ReduxOur recommendations for which tools to use for different use casesRedux and Side Effects​Side Effects Overview​By itself, a Redux store doesn't know anything about async logic. It only knows how to synchronously dispatch actions, update the state by calling the root reducer function, and notify the UI that something has changed. Any asynchronicity has to happen outside the store.Redux reducers must never contain "side effects". A "side effect" is any change to state or behavior that can be seen outside of returning a value from a function. Some common kinds of side effects are things like:Logging a value to the consoleSaving a fileSetting an async timerMaking an AJAX HTTP requestModifying some state that exists outside of a function, or mutating arguments to a functionGenerating random numbers or unique random IDs (such as Math.random() or Date.now())However, any real app will need to do these kinds of things somewhere. So, if we can't put side effects in reducers, where can we put them?Middleware and Side Effects​Redux middleware were designed to enable writing logic that has side effects.A Redux middleware can do anything when it sees a dispatched action: log something, modify the action, delay the action, make an async call, and more. Also, since middleware form a pipeline around the real store.dispatch function, this also means that we could actually pass something that isn't a plain action object to dispatch, as long as a middleware intercepts that value and doesn't let it reach the reducers.Middleware also have access to dispatch and getState. That means you could write some async logic in a middleware, and still have the ability to interact with the Redux store by dispatching actions.Because of this, Redux side effects and async logic are normally implemented through middleware.Side Effects Use Cases​In practice, the single most common use case for side effects in a typical Redux app is fetching and caching data from the server.Another use case more specific to Redux is writing logic that responds to a dispatched action or state change by executing additional logic, such as dispatching more actions.Recommendations​We recommend using the tools that best fit each use case (see below for the reasons for our recommendations, as well as further details on each tool):tipData Fetching​Use RTK Query as the default approach for data fetching and cachingIf RTKQ doesn't fully fit for some reason, use createAsyncThunkOnly fall back to handwritten thunks if nothing else worksDon't use sagas or observables for data fetching!Reacting to Actions / State Changes, Async Workflows​Use RTK listeners as the default for responding to store updates and writing long-running async workflowsOnly use sagas / observables if listeners don't solve your use case well enoughLogic with State Access​Use thunks for complex sync and moderate async logic, including access to getState and dispatching multiple actionsWhy RTK Query for Data Fetching​Per the React docs section on "alternatives for data fetching in Effects", you should use either data fetching approaches that are built into a server-side framework, or a client-side cache. You should not write data fetching and cache management code yourself.RTK Query was specifically designed to be a complete data fetching and caching layer for Redux-based applications. It manages all the fetching, caching, and loading status logic for you, and covers many edge cases that are typically forgotten or hard to handle if you write data fetching code yourself, as well as having cache lifecycle management built-in. It also makes it simple to fetch and use data via the auto-generated React hooks.We specifically recommend against sagas for data fetching because the complexity of sagas is not helpful, and you would still have to write all of the caching + loading status management logic yourself.Why Listeners for Reactive Logic​We've intentionally designed the RTK listener middleware to be straightforward to use. It uses standard async/await syntax, covers most common reactive use cases (responding to actions or state changes, debouncing, delays), and even several advanced cases (launching child tasks). It has a small bundle size (~3K), is included with Redux Toolkit, and works great with TypeScript.We specifically recommend against sagas or observables for most reactive logic for multiple reasons:Sagas: require understanding generator function syntax as well as the saga effects behaviors; add multiple levels of indirection due to needing extra actions dispatched; have poor TypeScript support; and the power and complexity is simply not needed for most Redux use cases.Observables: require understanding the RxJS API and mental model; can be difficult to debug; can add significant bundle sizeCommon Side Effects Approaches​The lowest-level technique for managing side effects with Redux is to write your own custom middleware that listens for specific actions and runs logic. However, that's rarely used. Instead, most apps have historically used one of the common pre-built Redux side effects middleware available in the ecosystem: thunks, sagas, or observables. Each of these has its own different use cases and tradeoffs.More recently, our official Redux Toolkit package has added two new APIs for managing side effects: the "listener" middleware for writing reactive logic, and RTK Query for fetching and caching server state.Thunks​The Redux "thunk" middleware has traditionally been the most widely used middleware for writing async logic.Thunks work by passing a function into dispatch. The thunk middleware intercepts the function, calls it, and passes in theThunkFunction(dispatch, getState). The thunk function can now do any sync/async logic and interact with the store.Thunk Use Cases​Thunks are best used for complex sync logic that needs access to dispatch and getState, or moderate async logic such as one-shot "fetch some async data and dispatch an action with the result" requests.We have traditionally recommended thunks as the default approach, and Redux Toolkit specifically includes the createAsyncThunk API for the "request and dispatch" use case. For other use cases, you can write your own thunk functions.Thunk Tradeoffs​👍: Just write functions; may contain any logic👎: Can't respond to dispatched actions; imperative; can't be cancelledThunk Examplesconst thunkMiddleware = ({ dispatch, getState }) => next => action => { if (typeof action === 'function') { return action(dispatch, getState) } return next(action) }// Original "hand-written" thunk fetch request patternconst fetchUserById = userId => { return async (dispatch, getState) => { // Dispatch "pending" action to help track loading state dispatch(fetchUserStarted()) // Need to pull this out to have correct error handling let lastAction try { const user = await userApi.getUserById(userId) // Dispatch "fulfilled" action on success lastAction = fetchUserSucceeded(user) } catch (err) { // Dispatch "rejected" action on failure lastAction = fetchUserFailed(err.message) } dispatch(lastAction) }}// Similar request with `createAsyncThunk`const fetchUserById2 = createAsyncThunk('fetchUserById', async userId => { const user = await userApi.getUserById(userId) return user})Sagas​The Redux-Saga middleware has traditionally been the second most common tool for side effects, after thunks. It's inspired by the backend "saga" pattern, where long-running workflows can respond to events triggered throughout the system.Conceptually, you can think of sagas as "background threads" inside the Redux app, which have the ability to listen to dispatched actions and run additional logic.Sagas are written using generator functions. Saga functions return descriptions of side effects and pause themselves, and the saga middleware is responsible for executing the side effect and resuming the saga function with the result. The redux-saga library includes a variety of effects definitions such as:call: executes an async function and returns the result when the promise resolves:put: dispatches a Redux actionfork: spawns a "child saga", like an additional thread that can do more worktakeLatest: listens for a given Redux action, triggers a saga function to execute, and cancels previous running copies of the saga if it's dispatched againSaga Use Cases​Sagas are extremely powerful, and are best used for highly complex async workflows that require "background thread"-type behavior or debouncing/cancelling.Saga users have often pointed to the fact that saga functions only return descriptions of the desired effects as a major positive that makes them more testable.Saga Tradeoffs​👍: Sagas are testable because they only return descriptions of effects; powerful effects model; pause/cancel capabilities👎: generator functions are complex; unique saga effects API; saga tests often only test implementation results and need to be rewritten every time the saga is touched, making them a lot less valuable; do not work well with TypeScript;Saga Examplesimport { call, put, takeEvery } from 'redux-saga/effects'// "Worker" saga: will be fired on USER_FETCH_REQUESTED actionsfunction* fetchUser(action) { yield put(fetchUserStarted()) try { const user = yield call(userApi.getUserById, action.payload.userId) yield put(fetchUserSucceeded(user)) } catch (err) { yield put(fetchUserFailed(err.message)) }}// "Watcher" saga: starts fetchUser on each `USER_FETCH_REQUESTED` actionfunction* fetchUserWatcher() { yield takeEvery('USER_FETCH_REQUESTED', fetchUser)}// Can use also use sagas for complex async workflows with "child tasks":function* fetchAll() { const task1 = yield fork(fetchResource, 'users') const task2 = yield fork(fetchResource, 'comments') yield delay(1000)}function* fetchResource(resource) { const { data } = yield call(api.fetch, resource) yield put(receiveData(data))}Observables​The Redux-Observable middleware lets you use RxJS observables to create processing pipelines called "epics".Since RxJS is a framework-agnostic library, observable users point to the fact that you can reuse knowledge of how to use it across different platforms as a major selling point. In addition, RxJS lets you construct declarative pipelines that handle timing cases like cancellation or debouncing.Observable Use Cases​Similar to sagas, observables are powerful and best used for highly complex async workflows that require "background thread"-type behavior or debouncing/cancelling.Observable Tradeoffs​👍: Observables are a highly powerful data flow model; RxJS knowledge can be used separate from Redux; declarative syntax👎: RxJS API is complex; mental model; can be hard to debug; bundle sizeObservable Examples// Typical AJAX example:const fetchUserEpic = action$ => action$.pipe( filter(fetchUser.match), mergeMap(action => ajax .getJSON(`https://api.github.com/users/${action.payload}`) .pipe(map(response => fetchUserFulfilled(response))) ) )// Can write highly complex async pipelines, including delays,// cancellation, debouncing, and error handling:const fetchReposEpic = action$ => action$.pipe( filter(fetchReposInput.match), debounceTime(300), switchMap(action => of(fetchReposStart()).pipe( concat( searchRepos(action.payload).pipe( map(payload => fetchReposSuccess(payload.items)), catchError(error => of(fetchReposError(error))) ) ) ) ) )Listeners​Redux Toolkit includes the createListenerMiddleware API to handle "reactive" logic. It's specifically intended to be a lighter-weight alternative to sagas and observables that handles 90% of the same use cases, with a smaller bundle size, simpler API, and better TypeScript support.Conceptually, this is similar to React's useEffect hook, but for Redux store updates.The listener middleware lets you add entries that match against actions to determine when to run the effect callback. Similar to thunks, an effect callback can be sync or async, and have access to dispatch and getState. They also receive a listenerApi object with several primitives for building async workflows, such as:condition(): pauses until a certain action is dispatched or state change occurscancelActiveListeners(): cancel existing in-progress instances of the effectfork(): creates a "child task" that can do additional workThese primitives allow listeners to replicate almost all of the effects behaviors from Redux-Saga.Listener Use Cases​Listeners can be used for a wide variety of tasks, such as lightweight store persistence, triggering additional logic when an action is dispatched, watching for state changes, and complex long-running "background thread"-style async workflows.In addition, listener entries can be added and removed dynamically at runtime by dispatching special add/removeListener actions. This integrates nicely with React's useEffect hook, and can be used for adding additional behavior that corresponds to a component's lifetime.Listener Tradeoffs​👍: Built into Redux Toolkit; async/await is more familiar syntax; similar to thunks; lightweight concepts and size; works great with TypeScript👎: Relatively new and not as "battle-tested" yet; not quite as flexible as sagas/observablesListener Examples// Create the middleware instance and methodsconst listenerMiddleware = createListenerMiddleware()// Add one or more listener entries that look for specific actions.// They may contain any sync or async logic, similar to thunks.listenerMiddleware.startListening({ actionCreator: todoAdded, effect: async (action, listenerApi) => { // Run whatever additional side-effect-y logic you want here console.log('Todo added: ', action.payload.text) // Can cancel other running instances listenerApi.cancelActiveListeners() // Run async logic const data = await fetchData() // Use the listener API methods to dispatch, get state, // unsubscribe the listener, start child tasks, and more listenerApi.dispatch(todoAdded('Buy pet food')) }})listenerMiddleware.startListening({ // Can match against actions _or_ state changes/contents predicate: (action, currentState, previousState) => { return currentState.counter.value !== previousState.counter.value }, // Listeners can have long-running async workflows effect: async (action, listenerApi) => { // Pause until action dispatched or state changed if (await listenerApi.condition(matchSomeAction)) { // Spawn "child tasks" that can do more work and return results const task = listenerApi.fork(async forkApi => { // Can pause execution await forkApi.delay(5) // Complete the child by returning a value return 42 }) // Unwrap the child result in the listener const result = await task.result if (result.status === 'ok') { console.log('Child succeeded: ', result.value) } } }})RTK Query​Redux Toolkit includes RTK Query, a purpose-built data fetching and caching solution for Redux apps. It's designed to simplify com'''
