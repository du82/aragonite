title = "General | Redux"
description = "When should I learn Redux?"
full_description = '''FAQGeneralOn this pageRedux FAQ: GeneralWhen should I learn Redux?​What to learn can be an overwhelming question for a JavaScript developer. It helps to narrow the range of options by learning one thing at a time and focusing on problems you find in your work. Redux is a pattern for managing application state. If you do not have problems with state management, you might find the benefits of Redux harder to understand. Some UI libraries (like React) have their own state management system. If you are using one of these libraries, especially if you are just learning to use them, we encourage you to learn the capabilities of that built-in system first. It might be all you need to build your application. If your application becomes so complex that you are confused about where state is stored or how state changes, then it is a good time to learn Redux.tipWe recommend that most new learners should focus on learning React first, and wait to learn Redux until after you're already comfortable with React. That way, there's fewer new concepts to learn at once, and it's more clear what concepts are part of React and what concepts are part of Redux. You'll also have a better understanding of how using Redux fits into a React app, and why Redux can be useful.Further information​ArticlesDeciding What Not To LearnHow to learn web frameworksRedux vs MobX vs Flux vs... Do you even need that?DiscussionsAsk HN: Overwhelmed with learning front-end, how do I proceed?Twitter: If you want to teach someone to use an abstraction...Twitter: it was never intended to be learned before...Twitter: Learning Redux before React?Twitter: This was my experience with Redux...Dev.to: When is it time to use Redux?When should I use Redux?​Not all apps need Redux. It's important to understand the kind of application you're building, the kinds of problems that you need to solve, and what tools can best solve the problems you're facing.Redux helps you deal with shared state management, but like any tool, it has tradeoffs. It's not designed to be the shortest or fastest way to write code. It's intended to help answer the question "When did a certain slice of state change, and where did the data come from?", with predictable behavior. There are more concepts to learn, and more code to write. It also adds some indirection to your code, and asks you to follow certain restrictions. It's a trade-off between short term and long term productivity.As Pete Hunt, one of the early contributors to React, says:You'll know when you need Flux. If you aren't sure if you need it, you don't need it.Similarly, Dan Abramov, one of the creators of Redux, says:I would like to amend this: don't use Redux until you have problems with vanilla React.Redux is most useful in cases when:You have large amounts of application state that are needed in many places in the appThe app state is updated frequentlyThe logic to update that state may be complexThe app has a medium or large-sized codebase, and might be worked on by many peopleYou need to see how that state is being updated over timeThere are also many other tools available that can help solve some of the same problems Redux does: state management, caching fetched server data, and passing data through the UI.infoIf you're not sure whether Redux is a good choice for your app, these resources give some more guidance:When (and when not) to reach for ReduxThe Tao of Redux, Part 1 - Implementation and IntentYou Might Not Need ReduxIn the end, Redux is just a tool. It's a great tool, and there are some great reasons to use it, but there are also reasons you might not want to use it. Make informed decisions about your tools, and understand the tradeoffs involved in each decision.Further information​DocumentationThinking in Redux: MotivationArticlesWhen (and when not) to reach for ReduxThe Tao of Redux, Part 1 - Implementation and IntentYou Might Not Need ReduxThe Case for FluxDiscussionsTwitter: Don't use Redux until...Twitter: Redux is designed to be predictable, not conciseTwitter: Redux is useful to eliminate deep prop passingTwitter: Don't use Redux unless you're unhappy with local component stateTwitter: You don't need Redux if your data never changesTwitter: If your reducer looks boring, don't use reduxReddit: You don't need Redux if your app just fetches something on a single pageStack Overflow: Why use Redux over Facebook Flux?Stack Overflow: Why should I use Redux in this example?Stack Overflow: What could be the downsides of using Redux instead of Flux?Stack Overflow: When should I add Redux to a React app?Stack Overflow: Redux vs plain React?Twitter: Redux is a platform for developers to build customized state management with reusable thingsCan Redux only be used with React?​Redux can be used as a data store for any UI layer. The most common usage is with React and React Native, but there are bindings available for Angular, Angular 2, Vue, Mithril, and more. Redux simply provides a subscription mechanism which can be used by any other code. That said, it is most useful when combined with a declarative view implementation that can infer the UI updates from the state changes, such as React or one of the similar libraries available.Do I need to have a particular build tool to use Redux?​Redux is written using modern JS syntax (ES2020), but the code is fairly simple.If you need to target older browsers, please transpile it yourself.The counter-vanilla example demonstrates basic ES5 usage with Redux included as a <script> tag. As the relevant pull request says:The new Counter Vanilla example is aimed to dispel the myth that Redux requires Webpack, React, hot reloading, sagas, action creators, constants, Babel, npm, CSS modules, decorators, fluent Latin, an Egghead subscription, a PhD, or an Exceeds Expectations O.W.L. level.Nope, it's just HTML, some artisanal <script> tags, and plain old DOM manipulation. Enjoy!Edit this pageLast updated on Nov 25, 2023'''
