["https://redux.js.org/tutorials/fundamentals/part-8-modern-redux"]
title = "Redux Fundamentals, Part 8: Modern Redux with Redux Toolkit | Redux"
description = "The official Fundamentals tutorial for Redux: learn the modern way to write Redux logic"
full_description = '''TutorialsRedux FundamentalsModern Redux with Redux ToolkitOn this pageRedux Fundamentals, Part 8: Modern Redux with Redux ToolkitWhat You'll LearnHow to simplify your Redux logic using Redux ToolkitNext steps for learning and using ReduxCongratulations, you've made it to the last section of this tutorial! We've got one more topic to cover before we're done.If you'd like a reminder of what we've covered so far, take a look at this summary:infoRecap: What You've LearnedPart 1: Overview:what Redux is, when/why to use it, and the basic pieces of a Redux appPart 2: Concepts and Data Flow:How Redux uses a "one-way data flow" patternPart 3: State, Actions, and Reducers:Redux state is made of plain JS dataActions are objects that describe "what happened" events in an appReducers take current state and an action, and calculate a new stateReducers must follow rules like "immutable updates" and "no side effects"Part 4: Store:The createStore API creates a Redux store with a root reducer functionStores can be customized using "enhancers" and "middleware"The Redux DevTools extension lets you see how your state changes over timePart 5: UI and React:Redux is separate from any UI, but frequently used with ReactReact-Redux provides APIs to let React components talk to Redux storesuseSelector reads values from Redux state and subscribes to updatesuseDispatch lets components dispatch actions<Provider> wraps your app and lets components access the storePart 6: Async Logic and Data Fetching:Redux middleware allow writing logic that has side effectsMiddleware add an extra step to the Redux data flow, enabling async logicRedux "thunk" functions are the standard way to write basic async logicPart 7: Standard Redux Patterns:Action creators encapsulate preparing action objects and thunksMemoized selectors optimize calculating transformed dataRequest status should be tracked with loading state enum valuesNormalized state makes it easier to look up items by IDsAs you've seen, many aspects of Redux involve writing some code that can be verbose, such as immutable updates, action types and action creators, and normalizing state. There's good reasons why these patterns exist, but writing that code "by hand" can be difficult. In addition, the process for setting up a Redux store takes several steps, and we've had to come up with our own logic for things like dispatching "loading" actions in thunks or processing normalized data. Finally, many times users aren't sure what "the right way" is to write Redux logic.That's why the Redux team created Redux Toolkit: our official, opinionated, "batteries included" toolset for efficient Redux development.Redux Toolkit contains packages and functions that we think are essential for building a Redux app. Redux Toolkit builds in our suggested best practices, simplifies most Redux tasks, prevents common mistakes, and makes it easier to write Redux applications.Because of this, Redux Toolkit is the standard way to write Redux application logic. The "hand-written" Redux logic you've written so far in this tutorial is actual working code, but you shouldn't write Redux logic by hand - we've covered those approaches in this tutorial so that you understand how Redux works. However, for real applications, you should use Redux Toolkit to write your Redux logic.When you use Redux Toolkit, all the concepts that we've covered so far (actions, reducers, store setup, action creators, thunks, etc) still exist, but Redux Toolkit provides easier ways to write that code.tipRedux Toolkit only covers the Redux logic - we still use React-Redux to let our React components talk to the Redux store, including useSelector and useDispatch.So, let's see how we can use Redux Toolkit to simplify the code we've already written in our example todo application. We'll primarily be rewriting our "slice" files, but we should be able to keep all the UI code the same.Before we continue, add the Redux Toolkit package to your app:npm install @reduxjs/toolkitStore Setup​We've gone through a few iterations of setup logic for our Redux store. Currently, it looks like this:src/rootReducer.jsimport { combineReducers } from 'redux'import todosReducer from './features/todos/todosSlice'import filtersReducer from './features/filters/filtersSlice'const rootReducer = combineReducers({ // Define a top-level state field named `todos`, handled by `todosReducer` todos: todosReducer, filters: filtersReducer})export default rootReducersrc/store.jsimport { createStore, applyMiddleware } from 'redux'import { thunk } from 'redux-thunk'import { composeWithDevTools } from 'redux-devtools-extension'import rootReducer from './reducer'const composedEnhancer = composeWithDevTools(applyMiddleware(thunk))const store = createStore(rootReducer, composedEnhancer)export default storeNotice that the setup process takes several steps. We have to:Combine the slice reducers together to form the root reducerImport the root reducer into the store fileImport the thunk middleware, applyMiddleware, and composeWithDevTools APIsCreate a store enhancer with the middleware and devtoolsCreate the store with the root reducerIt would be nice if we could cut down the number of steps here.Using configureStore​Redux Toolkit has a configureStore API that simplifies the store setup process. configureStore wraps around the Redux core createStore API, and handles most of the store setup for us automatically. In fact, we can cut it down to effectively one step:src/store.jsimport { configureStore } from '@reduxjs/toolkit'import todosReducer from './features/todos/todosSlice'import filtersReducer from './features/filters/filtersSlice'const store = configureStore({ reducer: { // Define a top-level state field named `todos`, handled by `todosReducer` todos: todosReducer, filters: filtersReducer }})export default storeThat one call to configureStore did all the work for us:It combined todosReducer and filtersReducer into the root reducer function, which will handle a root state that looks like {todos, filters}It created a Redux store using that root reducerIt automatically added the thunk middlewareIt automatically added more middleware to check for common mistakes like accidentally mutating the stateIt automatically set up the Redux DevTools Extension connectionWe can confirm this works by opening up our example todo application and using it. All of our existing feature code works fine! Since we're dispatching actions, dispatching thunks, reading state in the UI, and looking at the action history in the DevTools, all those pieces must be working correctly. All we've done is switched out the store setup code.Let's see what happens now if we accidentally mutate some of the state. What if we change the "todos loading" reducer so that it directly changes the state field, instead of immutably making a copy?src/features/todos/todosSliceexport default function todosReducer(state = initialState, action) { switch (action.type) { // omit other cases case 'todos/todosLoading': { // ❌ WARNING: example only - don't do this in a normal reducer! state.status = 'loading' return state } default: return state }}Uh-oh. Our whole app just crashed! What happened?This error message is a good thing - we caught a bug in our app! configureStore specifically added an extra middleware that automatically throws an error whenever it sees an accidental mutation of our state (in development mode only). That helps catch mistakes we might make while writing our code.Package Cleanup​Redux Toolkit already includes several of the packages we're using, like redux, redux-thunk, and reselect, and re-exports those APIs. So, we can clean up our project a bit.First, we can switch our createSelector import to be from '@reduxjs/toolkit' instead of 'reselect'. Then, we can remove the separate packages we have listed in our package.json:npm uninstall redux redux-thunk reselectTo be clear, we're still using these packages and need to have them installed. However, because Redux Toolkit depends on them, they'll be installed automatically when we install @reduxjs/toolkit, so we don't need to have the other packages specifically listed in our package.json file.Writing Slices​As we've added new features to our app, the slice files have gotten bigger and more complicated. In particular, the todosReducer has gotten harder to read because of all the nested object spreads for immutable updates, and we've written multiple action creator functions.Redux Toolkit has a createSlice API that will help us simplify our Redux reducer logic and actions. createSlice does several important things for us:We can write the case reducers as functions inside of an object, instead of having to write a switch/case statementThe reducers will be able to write shorter immutable update logicAll the action creators will be generated automatically based on the reducer functions we've providedUsing createSlice​createSlice takes an object with three main options fields:name: a string that will be used as the prefix for generated action typesinitialState: the initial state of the reducerreducers: an object where the keys are strings, and the values are "case reducer" functions that will handle specific actionsLet's look at a small standalone example first.createSlice exampleimport { createSlice } from '@reduxjs/toolkit'const initialState = { entities: [], status: null}const todosSlice = createSlice({ name: 'todos', initialState, reducers: { todoAdded(state, action) { // ✅ This "mutating" code is okay inside of createSlice! state.entities.push(action.payload) }, todoToggled(state, action) { const todo = state.entities.find(todo => todo.id === action.payload) todo.completed = !todo.completed }, todosLoading(state, action) { return { ...state, status: 'loading' } } }})export const { todoAdded, todoToggled, todosLoading } = todosSlice.actionsexport default todosSlice.reducerThere's several things to see in this example:We write case reducer functions inside the reducers object, and give them readable namescreateSlice will automatically generate action creators that correspond to each case reducer function we providecreateSlice automatically returns the existing state in the default casecreateSlice allows us to safely "mutate" our state!But, we can also make immutable copies like before if we want toThe generated action creators will be available as slice.actions.todoAdded, and we typically destructure and export those individually like we did with the action creators we wrote earlier. The complete reducer function is available as slice.reducer, and we typically export default slice.reducer, again the same as before.So what do these auto-generated action objects look like? Let's try calling one of them and logging the action to see:console.log(todoToggled(42))// {type: 'todos/todoToggled', payload: 42}createSlice generated the action type string for us, by combining the slice's name field with the todoToggled name of the reducer function we wrote. By default, the action creator accepts one argument, which it puts into the action object as action.payload.Inside of the generated reducer function, createSlice will check to see if a dispatched action's action.type matches one of the names it generated. If so, it will run that case reducer function. This is exactly the same pattern that we wrote ourselves using a switch/case statement, but createSlice does it for us automatically.It's also worth talking about the "mutation" aspect in more detail.Immutable Updates with Immer​Earlier, we talked about "mutation" (modifying existing object/array values) and "immutability" (treating values as something that cannot be changed).dangerIn Redux, our reducers are never allowed to mutate the original / current state values!// ❌ Illegal - by default, this will mutate the state!state.value = 123So if we can't change the originals, how do we return an updated state?tipReducers can only make copies of the original values, and then they can mutate the copies.// This is safe, because we made a copyreturn { ...state, value: 123}As you've seen throughout this tutorial, we can write immutable updates by hand by using JavaScript's array / object spread operators and other functions that return copies of the original values. However, writing immutable update logic by hand is hard, and accidentally mutating state in reducers is the single most common mistake Redux users make.That's why Redux Toolkit's createSlice function lets you write immutable updates an easier way!createSlice uses a library called Immer inside. Immer uses a special JS tool called a Proxy to wrap the data you provide, and lets you write code that "mutates" that wrapped data. But, Immer tracks all the changes you've tried to make, and then uses that list of changes to return a safely immutably updated value, as if you'd written all the immutable update logic by hand.So, instead of this:function handwrittenReducer(state, action) { return { ...state, first: { ...state.first, second: { ...state.first.second, [action.someId]: { ...state.first.second[action.someId], fourth: action.someValue } } } }}You can write code that looks like this:function reducerWithImmer(state, action) { state.first.second[action.someId].fourth = action.someValue}That's a lot easier to read!But, here's something very important to remember:dangerYou can only write "mutating" logic in Redux Toolkit's createSlice and createReducer because they use Immer inside! If you write mutating logic in reducers without Immer, it will mutate the state and cause bugs!Immer still lets us write immutable updates by hand and return the new value ourselves if we want to. You can even mix and match. For example, removing an item from an array is often easier to do with array.filter(), so you could call that and then assign the result to state to "mutate" it:// can mix "mutating" and "immutable" code inside of Immer:state.todos = state.todos.filter(todo => todo.id !== action.payload)Converting the Todos Reducer​Let's start converting our todos slice file to use createSlice instead. We'll pick a couple specific cases from our switch statement first to show how the process works.src/features/todos/todosSlice.jsimport { createSlice } from '@reduxjs/toolkit'const initialState = { status: 'idle', entities: {}}const todosSlice = createSlice({ name: 'todos', initialState, reducers: { todoAdded(state, action) { const todo = action.payload state.entities[todo.id] = todo }, todoToggled(state, action) { const todoId = action.payload const todo = state.entities[todoId] todo.completed = !todo.completed } }})export const { todoAdded, todoToggled } = todosSlice.actionsexport default todosSlice.reducerThe todos reducer in our example app is still using normalized state that is nested in a parent object, so the code here is a bit different than the miniature createSlice example we just looked at. Remember how we had to write a lot of nested spread operators to toggle that todo earlier? Now that same code is a lot shorte'''
