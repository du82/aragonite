title = "Videos | Redux"
description = 'Here are some excellent video tutorials that we can recommend. These videos show the same "modern Redux" approaches that we teach in our docs.'
full_description = '''TutorialsVideosOn this pageRecommended VideosHere are some excellent video tutorials that we can recommend. These videos show the same "modern Redux" approaches that we teach in our docs.Learn Modern Redux Livestream​Redux maintainer Mark Erikson appeared on the "Learn with Jason" show to explain how we recommend using Redux today. The show includes a live-coded example app that shows how to use Redux Toolkit and React-Redux hooks with TypeScript, as well as the new RTK Query data fetching APIs:RTK Query Basics: Query Endpoints, Data Flow and TypeScript​A video course on RTK Query basics by Lenz Weber-Tronic, the creator of RTK Query.You can watch this RTK Query video course for free at Egghead or take a look at the first lesson right here:Redux Toolkit Complete Tutorial with Dave Gray​This 4-hour tutorial video teaches how to use Redux Toolkit by showing how to build the same example app that's covered in the "Redux Essentials" tutorial, and walks through how each piece of the app works.Egghead Courses with Jamund Ferguson​Jamund Ferguson has created several excellent "modern Redux" courses on Egghead.Modern Redux with Redux Toolkit (RTK) and TypeScript​Egghead course: Modern Redux with Redux Toolkit and TypeScriptThis course takes a basic shopping cart application built with React and fully power it with Redux and RTK using TypeScript. It covers how Redux Toolkit simplifies the process of setting up your Redux application, including building slices, reducers, selectors and thunks, and all typed with TypeScript.Modernizing a Legacy Redux Application with React Hooks​Egghead course: Modernizing a Legacy Redux Application with React HooksA course that covers how to modernize existing React+Redux applications from older-style patterns like React class components and the React-Redux connect API, to modern patterns with React function components and the React-Redux useSelector/useDispatch hooks.Confidently Testing Redux Applications with Jest & TypeScript​Egghead course: Confidently Testing Redux Applications with Jest & TypeScriptBest practices for building & testing Redux applications have changed dramatically over time. This course aims to be a comprehensive and up-to-date resource for those seeking to confidently test their Redux apps.Edit this pageLast updated on Nov 16, 2023'''
