["https://redux.js.org/tutorials/essentials/part-7-rtk-query-basics"]
title = "Redux Essentials, Part 7: RTK Query Basics | Redux"
description = "The official Redux Essentials tutorial: learn how to use RTK Query for data fetching"
full_description = '''TutorialsRedux EssentialsRTK Query BasicsOn this pageRedux Essentials, Part 7: RTK Query BasicsWhat You'll LearnHow RTK Query simplifies data fetching for Redux appsHow to set up RTK QueryHow to use RTK Query for basic data fetching and update requestsPrerequisitesCompletion of the previous sections of this tutorial to understand Redux Toolkit usage patternsPrefer a video course?If you prefer a video course, you can watch this RTK Query video course by Lenz Weber-Tronic, the creator of RTK Query, for free at Egghead or take a look at the first lesson right here:Introduction​in Part 5: Async Logic and Data Fetching and Part 6: Performance and Normalization, we saw the standard patterns used for data fetching and caching with Redux. Those patterns include using async thunks to fetch data, dispatching actions with the results, managing request loading state in the store, and normalizing the cached data to enable easier lookups and updates of individual items by ID.In this section, we'll look at how to use RTK Query, a data fetching and caching solution designed for Redux applications, and see how it simplifies the process of fetching data and using it in our components.RTK Query Overview​RTK Query is a powerful data fetching and caching tool. It is designed to simplify common cases for loading data in a web application, eliminating the need to hand-write data fetching & caching logic yourself.RTK Query is included in the Redux Toolkit package, and its functionality is built on top of the other APIs in Redux Toolkit. We recommend RTK Query as the default approach for data fetching in Redux apps.Motivation​Web applications normally need to fetch data from a server in order to display it. They also usually need to make updates to that data, send those updates to the server, and keep the cached data on the client in sync with the data on the server. This is made more complicated by the need to implement other behaviors used in today's applications:Tracking loading state in order to show UI spinnersAvoiding duplicate requests for the same dataOptimistic updates to make the UI feel fasterManaging cache lifetimes as the user interacts with the UIWe've already seen how we can implement these behaviors using Redux Toolkit.However, originally Redux didn't include anything built in to help completely solve these use cases. Even when we use createAsyncThunk together with createSlice, there's still a fair amount of manual work involved in making requests and managing loading state. We have to create the async thunk, make the actual request, pull relevant fields out of the response, add loading state fields, add handlers in extraReducers to handle the pending/fulfilled/rejected cases, and actually write the proper state updates.Over time, the React community has come to realize that "data fetching and caching" is really a different set of concerns than "state management". While you can use a state management library like Redux to cache data, the use cases are different enough that it's worth using tools that are purpose-built for the data fetching use case.Server State Challenges​It's worth quoting the great explanation from the React Query "Motivation" docs page:While most traditional state management libraries are great for working with client state, they are not so great at working with async or server state. This is because server state is totally different. For starters, server state:Is persisted remotely in a location you may not control or ownRequires asynchronous APIs for fetching and updatingImplies shared ownership and can be changed by other people without your knowledgeCan potentially become "out of date" in your applications if you're not carefulOnce you grasp the nature of server state in your application, even more challenges will arise as you go, for example:Caching... (possibly the hardest thing to do in programming)Deduping multiple requests for the same data into a single requestUpdating "out of date" data in the backgroundKnowing when data is "out of date"Reflecting updates to data as quickly as possiblePerformance optimizations like pagination and lazy loading dataManaging memory and garbage collection of server stateMemoizing query results with structural sharingRTK Query Differences​RTK Query takes inspiration from other tools that have pioneered solutions for data fetching, like Apollo Client, React Query, Urql, and SWR, but adds a unique approach to its API design:The data fetching and caching logic is built on top of Redux Toolkit's createSlice and createAsyncThunk APIsBecause Redux Toolkit is UI-agnostic, RTK Query's functionality can be used with any UI layer like Angular, Vue, or vanilla JS, not just with ReactAPI endpoints are defined ahead of time, including how to generate query parameters from arguments and transform responses for cachingRTK Query can also generate React hooks that encapsulate the entire data fetching process, provide data and isFetching fields to components, and manage the lifetime of cached data as components mount and unmountRTK Query provides "cache entry lifecycle" options that enable use cases like streaming cache updates via websocket messages after fetching the initial dataWe have a code generator to generate RTK Query API definitions from OpenAPI schemasFinally, RTK Query is completely written in TypeScript, and is designed to provide an excellent TS usage experienceWhat's included​APIs​RTK Query is included within the installation of the core Redux Toolkit package. It is available via either of the two entry points below:// UI-agnostic entry point with the core logicimport { createApi } from '@reduxjs/toolkit/query'// React-specific entry point that automatically generates// hooks corresponding to the defined endpointsimport { createApi } from '@reduxjs/toolkit/query/react'RTK Query primarily consists of two APIs:createApi(): The core of RTK Query's functionality. It allows you to define a set of endpoints describe how to retrieve data from a series of endpoints, including configuration of how to fetch and transform that data. In most cases, you should use this once per app, with "one API slice per base URL" as a rule of thumb.fetchBaseQuery(): A small wrapper around fetch that aims to simplify HTTP requests. RTK Query can be used to cache the result of any async request, but since HTTP requests are the most common use case, fetchBaseQuery provides HTTP support out of the box.Bundle Size​RTK Query adds a fixed one-time amount to your app's bundle size. Since RTK Query builds on top of Redux Toolkit and React-Redux, the added size varies depending on whether you are already using those in your app. The estimated min+gzip bundle sizes are:If you are using RTK already: ~9kb for RTK Query and ~2kb for the hooks.If you are not using RTK already:Without React: 17 kB for RTK+dependencies+RTK QueryWith React: 19kB + React-Redux, which is a peer dependencyAdding additional endpoint definitions should only increase size based on the actual code inside the endpoints definitions, which will typically be just a few bytes.The functionality included in RTK Query quickly pays for the added bundle size, and the elimination of hand-written data fetching logic should be a net improvement in size for most meaningful applications.Thinking in RTK Query Caching​Redux has always had an emphasis on predictability and explicit behavior. There's no "magic" involved in Redux - you should be able to understand what's happening in the application because all Redux logic follows the same basic patterns of dispatching actions and updating state via reducers. This does mean that sometimes you have to write more code to make things happen, but the tradeoff is that should be very clear what the data flow and behavior is.The Redux Toolkit core APIs do not change any of the basic data flow in a Redux app You're still dispatching actions and writing reducers, just with less code than writing all of that logic by hand. RTK Query is the same way. It's an additional level of abstraction, but internally it's still doing the exact same steps we've already seen for managing async requests and their responses - using thunks to run async requests, dispatching actions with the results, and handling the actions in reducers to cache the data.However, when you use RTK Query, there is a mindset shift that happens. We're no longer thinking about "managing state" per se. Instead, we now think about "managing cached data". Rather than trying to write reducers ourselves, we're now going to focus on defining "where is this data coming from?", "how should this update be sent?", "when should this cached data be re-fetched?", and "how should the cached data be updated?". How that data gets fetched, stored, and retrieved becomes implementation details we no longer have to worry about.We'll see how this mindset shift applies as we continue.Setting Up RTK Query​Our example application already works, but now it's time to migrate all of the async logic over to use RTK Query. As we go through, we'll see how to use all the major features of RTK Query, as well as how to migrate existing uses of createAsyncThunk and createSlice over to use the RTK Query APIs.Defining an API Slice​Previously, we've defined separate "slices" for each of our different data types like Posts, Users, and Notifications. Each slice had its own reducer, defined its own actions and thunks, and cached the entries for that data type separately.With RTK Query, the logic for managing cached data is centralized into a single "API slice" per application. In much the same way that you have a single Redux store per app, we now have a single slice for all our cached data.We'll start by defining a new apiSlice.ts file. Since this isn't specific to any of the other "features" we've already written, we'll add a new features/api/ folder and put apiSlice.ts in there. Let's fill out the API slice file, and then break down the code inside to see what it's doing:features/api/apiSlice.ts// Import the RTK Query methods from the React-specific entry pointimport { createApi, fetchBaseQuery } from '@reduxjs/toolkit/query/react'// Use the `Post` type we've already defined in `postsSlice`,// and then re-export it for ease of useimport type { Post } from '@/features/posts/postsSlice'export type { Post }// Define our single API slice objectexport const apiSlice = createApi({ // The cache reducer expects to be added at `state.api` (already default - this is optional) reducerPath: 'api', // All of our requests will have URLs starting with '/fakeApi' baseQuery: fetchBaseQuery({ baseUrl: '/fakeApi' }), // The "endpoints" represent operations and requests for this server endpoints: builder => ({ // The `getPosts` endpoint is a "query" operation that returns data. // The return value is a `Post[]` array, and it takes no arguments. getPosts: builder.query<Post[], void>({ // The URL for the request is '/fakeApi/posts' query: () => '/posts' }) })})// Export the auto-generated hook for the `getPosts` query endpointexport const { useGetPostsQuery } = apiSliceRTK Query's functionality is based on a single method, called createApi. All of the Redux Toolkit APIs we've seen so far are UI-agnostic, and could be used with any UI layer. The RTK Query core logic is the same way. However, RTK Query also includes a React-specific version of createApi, and since we're using RTK and React together, we need to use that to take advantage of RTK's React integration. So, we import from '@reduxjs/toolkit/query/react' specifically.tipYour application is expected to have only one createApi call in it. This one API slice should contain all endpoint definitions that talk to the same base URL. For example, endpoints /api/posts and /api/users are both fetching data from the same server, so they would go in the same API slice. If your app does fetch data from multiple servers, you can either specify full URLs in each endpoint, or if absolutely necessary create separate API slices for each server.Endpoints are normally defined directly inside the createApi call. If you're looking to split up your endpoints between multiple files, see the "Injecting Endpoints" section in Part 8 section of the docs!API Slice Parameters​When we call createApi, there are two fields that are required:baseQuery: a function that knows how to fetch data from the server. RTK Query includes fetchBaseQuery, a small wrapper around the standard fetch() function that handles typical processing of HTTP requests and responses. When we create a fetchBaseQuery instance, we can pass in the base URL of all future requests, as well as override behavior such as modifying request headers. You can create custom base queries to customize behavior like error handling and auth.endpoints: a set of operations that we've defined for interacting with this server. Endpoints can be queries, which return data for caching, or mutations, which send an update to the server. The endpoints are defined using a callback function that accepts a builder parameter and returns an object containing endpoint definitions created with builder.query() and builder.mutation().createApi also accepts a reducerPath field, which defines the expected top-level state slice field for the generated reducer. For our other slices like postsSlice, there's no guarantee that it will be used to update state.posts - we could have attached the reducer anywhere in the root state, like someOtherField: postsReducer. Here, createApi expects us to tell it where the cache state will exist when we add the cache reducer to the store. If you don't provide a reducerPath option, it defaults to 'api', so all your RTKQ cache data will be stored under state.api.If you forget to add the reducer to the store, or attach it at a different key than what is specified in reducerPath, RTKQ will log an error to let you know this needs to be fixed.Defining Endpoints​The first part of the URL for all requests is defined as '/fakeApi' in the fetchBaseQuery definition.For our first step, we want to add an endpoint that will return the entire list of posts from the fake API server. We'll include an endpoint called getPosts, and define it as a query endpoint using builder.query(). This method accepts many options for configuring how to make the request and process the response. For now, all we need to do is supply the remaining piece of the URL path by defining a query option, with a callback that returns the URL string: () => '/posts'.By default, query endpoints will use a GET HTTP request, but you can override that by returning an object like {url: '/posts', method: 'POST', body: newPost} instead of just the URL string itself. You can also define several other options for the request this way, such as setting headers.For TypeScript usage, the builder.query() and builder.mutation() endpoint definition functions accept two generic arguments: <ReturnType, ArgumentType>. For example, an endpoint to fetch a Pokemon by name might look lik'''
