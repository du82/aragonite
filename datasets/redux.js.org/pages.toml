["https://redux.js.org/tutorials/fundamentals/part-4-store"]
title = "Redux Fundamentals, Part 4: Store | Redux"
description = "The official Redux Fundamentals tutorial: learn how to create and use a Redux store"
full_description = '''TutorialsRedux FundamentalsStoreOn this pageRedux Fundamentals, Part 4: StoreWhat You'll LearnHow to create a Redux storeHow to use the store to update state and listen for updatesHow to configure the store to extend its capabilitiesHow to set up the Redux DevTools Extension to debug your appIntroduction​In Part 3: State, Actions, and Reducers, we started writing our example todo app. We listed business requirements, defined the state structure we need to make the app work, and created a series of action types to describe "what happened" and match the kinds of events that can happen as a user interacts with our app. We also wrote reducer functions that can handle updating our state.todos and state.filters sections, and saw how we can use the Redux combineReducers function to create a "root reducer" based on the different "slice reducers" for each feature in our app.Now, it's time to pull those pieces together, with the central piece of a Redux app: the store.cautionNote that this tutorial intentionally shows older-style Redux logic patterns that require more code than the "modern Redux" patterns with Redux Toolkit we teach as the right approach for building apps with Redux today, in order to explain the principles and concepts behind Redux. It's not meant to be a production-ready project.See these pages to learn how to use "modern Redux" with Redux Toolkit:The full "Redux Essentials" tutorial, which teaches "how to use Redux, the right way" with Redux Toolkit for real-world apps. We recommend that all Redux learners should read the "Essentials" tutorial!Redux Fundamentals, Part 8: Modern Redux with Redux Toolkit, which shows how to convert the low-level examples from earlier sections into modern Redux Toolkit equivalentsRedux Store​The Redux store brings together the state, actions, and reducers that make up your app. The store has several responsibilities:Holds the current application state insideAllows access to the current state via store.getState();Allows state to be updated via store.dispatch(action);Registers listener callbacks via store.subscribe(listener);Handles unregistering of listeners via the unsubscribe function returned by store.subscribe(listener).It's important to note that you'll only have a single store in a Redux application. When you want to split your data handling logic, you'll use reducer composition and create multiple reducers that can be combined together, instead of creating separate stores.Creating a Store​Every Redux store has a single root reducer function. In the previous section, we created a root reducer function using combineReducers. That root reducer is currently defined in src/reducer.js in our example app. Let's import that root reducer and create our first store.The Redux core library has a createStore API that will create the store. Add a new file called store.js, and import createStore and the root reducer. Then, call createStore and pass in the root reducer:src/store.jsimport { createStore } from 'redux'import rootReducer from './reducer'const store = createStore(rootReducer)export default storeLoading Initial State​createStore can also accept a preloadedState value as its second argument. You could use this to add initial data when the store is created, such as values that were included in an HTML page sent from the server, or persisted in localStorage and read back when the user visits the page again, like this:storeStatePersistenceExample.jsimport { createStore } from 'redux'import rootReducer from './reducer'let preloadedStateconst persistedTodosString = localStorage.getItem('todos')if (persistedTodosString) { preloadedState = { todos: JSON.parse(persistedTodosString) }}const store = createStore(rootReducer, preloadedState)Dispatching Actions​Now that we have created a store, let's verify our program works! Even without any UI, we can already test the update logic.tipBefore you run this code, try going back to src/features/todos/todosSlice.js, and remove all the example todo objects from the initialState so that it's an empty array. That will make the output from this example a bit easier to read.src/index.js// Omit existing React importsimport store from './store'// Log the initial stateconsole.log('Initial state: ', store.getState())// {todos: [....], filters: {status, colors}}// Every time the state changes, log it// Note that subscribe() returns a function for unregistering the listenerconst unsubscribe = store.subscribe(() => console.log('State after dispatch: ', store.getState()))// Now, dispatch some actionsstore.dispatch({ type: 'todos/todoAdded', payload: 'Learn about actions' })store.dispatch({ type: 'todos/todoAdded', payload: 'Learn about reducers' })store.dispatch({ type: 'todos/todoAdded', payload: 'Learn about stores' })store.dispatch({ type: 'todos/todoToggled', payload: 0 })store.dispatch({ type: 'todos/todoToggled', payload: 1 })store.dispatch({ type: 'filters/statusFilterChanged', payload: 'Active' })store.dispatch({ type: 'filters/colorFilterChanged', payload: { color: 'red', changeType: 'added' }})// Stop listening to state updatesunsubscribe()// Dispatch one more action to see what happensstore.dispatch({ type: 'todos/todoAdded', payload: 'Try creating a store' })// Omit existing React rendering logicRemember, every time we call store.dispatch(action):The store calls rootReducer(state, action)That root reducer may call other slice reducers inside of itself, like todosReducer(state.todos, action)The store saves the new state value insideThe store calls all the listener subscription callbacksIf a listener has access to the store, it can now call store.getState() to read the latest state valueIf we look at the console log output from that example, you can see how the Redux state changes as each action was dispatched:Notice that our app did not log anything from the last action. That's because we removed the listener callback when we called unsubscribe(), so nothing else ran after the action was dispatched.We specified the behavior of our app before we even started writing the UI. That helps give us confidence that the app will work as intended.infoIf you want, you can now try writing tests for your reducers. Because they're pure functions, it should be straightforward to test them. Call them with an example state and action, take the result, and check to see if it matches what you expect:todosSlice.spec.jsimport todosReducer from './todosSlice'test('Toggles a todo based on id', () => { const initialState = [{ id: 0, text: 'Test text', completed: false }] const action = { type: 'todos/todoToggled', payload: 0 } const result = todosReducer(initialState, action) expect(result[0].completed).toBe(true)})Inside a Redux Store​It might be helpful to take a peek inside a Redux store to see how it works. Here's a miniature example of a working Redux store, in about 25 lines of code:miniReduxStoreExample.jsfunction createStore(reducer, preloadedState) { let state = preloadedState const listeners = [] function getState() { return state } function subscribe(listener) { listeners.push(listener) return function unsubscribe() { const index = listeners.indexOf(listener) listeners.splice(index, 1) } } function dispatch(action) { state = reducer(state, action) listeners.forEach(listener => listener()) } dispatch({ type: '@@redux/INIT' }) return { dispatch, subscribe, getState }}This small version of a Redux store works well enough that you could use it to replace the actual Redux createStore function you've been using in your app so far. (Try it and see for yourself!) The actual Redux store implementation is longer and a bit more complicated, but most of that is comments, warning messages, and handling some edge cases.As you can see, the actual logic here is fairly short:The store has the current state value and reducer function inside of itselfgetState returns the current state valuesubscribe keeps an array of listener callbacks and returns a function to remove the new callbackdispatch calls the reducer, saves the state, and runs the listenersThe store dispatches one action on startup to initialize the reducers with their stateThe store API is an object with {dispatch, subscribe, getState} insideTo emphasize one of those in particular: notice that getState just returns whatever the current state value is. That means that by default, nothing prevents you from accidentally mutating the current state value! This code will run without any errors, but it's incorrect:const state = store.getState()// ❌ Don't do this - it mutates the current state!state.filters.status = 'Active'In other words:The Redux store doesn't make an extra copy of the state value when you call getState(). It's exactly the same reference that was returned from the root reducer functionThe Redux store doesn't do anything else to prevent accidental mutations. It is possible to mutate the state, either inside a reducer or outside the store, and you must always be careful to avoid mutations.One common cause of accidental mutations is sorting arrays. Calling array.sort() actually mutates the existing array. If we called const sortedTodos = state.todos.sort(), we'd end up mutating the real store state unintentionally.tipIn Part 8: Modern Redux, we'll see how Redux Toolkit helps avoid mutations in reducers, and detects and warns about accidental mutations outside of reducers.Configuring the Store​We've already seen that we can pass rootReducer and preloadedState arguments to createStore. However, createStore can also take one more argument, which is used to customize the store's abilities and give it new powers.Redux stores are customized using something called a store enhancer. A store enhancer is like a special version of createStore that adds another layer wrapping around the original Redux store. An enhanced store can then change how the store behaves, by supplying its own versions of the store's dispatch, getState, and subscribe functions instead of the originals.For this tutorial, we won't go into details about how store enhancers actually work - we'll focus on how to use them.Creating a Store with Enhancers​Our project has two small example store enhancers available, in the src/exampleAddons/enhancers.js file:sayHiOnDispatch: an enhancer that always logs 'Hi'! to the console every time an action is dispatchedincludeMeaningOfLife: an enhancer that always adds the field meaningOfLife: 42 to the value returned from getState()Let's start by using sayHiOnDispatch. First, we'll import it, and pass it to createStore:src/store.jsimport { createStore } from 'redux'import rootReducer from './reducer'import { sayHiOnDispatch } from './exampleAddons/enhancers'const store = createStore(rootReducer, undefined, sayHiOnDispatch)export default storeWe don't have a preloadedState value here, so we'll pass undefined as the second argument instead.Next, let's try dispatching an action:src/index.jsimport store from './store'console.log('Dispatching action')store.dispatch({ type: 'todos/todoAdded', payload: 'Learn about actions' })console.log('Dispatch complete')Now look at the console. You should see 'Hi!' logged there, in between the other two log statements:The sayHiOnDispatch enhancer wrapped the original store.dispatch function with its own specialized version of dispatch. When we called store.dispatch(), we were actually calling the wrapper function from sayHiOnDispatch, which called the original and then printed 'Hi'.Now, let's try adding a second enhancer. We can import includeMeaningOfLife from that same file... but we have a problem. createStore only accepts one enhancer as its third argument! How can we pass two enhancers at the same time?What we really need is some way to merge both the sayHiOnDispatch enhancer and the includeMeaningOfLife enhancer into a single combined enhancer, and then pass that instead.Fortunately, the Redux core includes a compose function that can be used to merge multiple enhancers together. Let's use that here:src/store.jsimport { createStore, compose } from 'redux'import rootReducer from './reducer'import { sayHiOnDispatch, includeMeaningOfLife} from './exampleAddons/enhancers'const composedEnhancer = compose(sayHiOnDispatch, includeMeaningOfLife)const store = createStore(rootReducer, undefined, composedEnhancer)export default storeNow we can see what happens if we use the store:src/index.jsimport store from './store'store.dispatch({ type: 'todos/todoAdded', payload: 'Learn about actions' })// log: 'Hi!'console.log('State after dispatch: ', store.getState())// log: {todos: [...], filters: {status, colors}, meaningOfLife: 42}And the logged output looks like this:So, we can see that both enhancers are modifying the behavior of the store at the same time. sayHiOnDispatch has changed how dispatch works, and includeMeaningOfLife has changed how getState works.Store enhancers are a very powerful way to modify the store, and almost all Redux apps will include at least one enhancer when setting up the store.tipIf you don't have any preloadedState to pass in, you can pass the enhancer as the second argument instead:const store = createStore(rootReducer, storeEnhancer)Middleware​Enhancers are powerful because they can override or replace any of the store's methods: dispatch, getState, and subscribe.But, much of the time, we only need to customize how dispatch behaves. It would be nice if there was a way to add some customized behavior when dispatch runs.Redux uses a special kind of addon called middleware to let us customize the dispatch function.If you've ever used a library like Express or Koa, you might already be familiar with the idea of adding middleware to customize behavior. In these frameworks, middleware is some code you can put between the framework receiving a request, and the framework generating a response. For example, Express or Koa middleware may add CORS headers, logging, compression, and more. The best feature of middleware is that it's composable in a chain. You can use multiple independent third-party middleware in a single project.Redux middleware solves different problems than Express or Koa middleware, but in a conceptually similar way. Redux middleware provides a third-party extension point between dispatching an action, and the moment it reaches the reducer. People use Redux middleware for logging, crash reporting, talking to an asynchronous API, routing, and more.First, we'll look at how to add middleware to the store, then we'll show how you can write your own.Using Middleware​We already saw that you can customize a Redux store using store enhancers. Redux middleware are actually implemented on top of a very special store enhancer that comes built in with Redux, called applyMiddleware.Since we already know how to add enhancers to our store, we should be able to do that now. We'll start with applyMiddleware by itself, and we'll add three example middleware that have been included in this project.src/store.jsimport { createStore, applyMiddleware } from 'redux'import '''
