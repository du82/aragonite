description = "- How to set up and use Redux Toolkit with React-Redux"
full_description = '''TutorialsQuick StartOn this pageRedux Toolkit Quick StartWhat You'll LearnHow to set up and use Redux Toolkit with React-ReduxPrerequisitesFamiliarity with ES6 syntax and featuresKnowledge of React terminology: JSX, State, Function Components, Props, and HooksUnderstanding of Redux terms and conceptsIntroduction​Welcome to the Redux Toolkit Quick Start tutorial! This tutorial will briefly introduce you to Redux Toolkit and teach you how to start using it correctly.How to Read This Tutorial​This page will focus on just how to set up a Redux application with Redux Toolkit and the main APIs you'll use. For explanations of what Redux is, how it works, and full examples of how to use Redux Toolkit, see the tutorials linked in the "Tutorials Index" page.For this tutorial, we assume that you're using Redux Toolkit with React, but you can also use it with other UI layers as well. The examples are based on a typical Create-React-App folder structure where all the application code is in a src folder, but the patterns can be adapted to whatever project or folder setup you're using.The Redux+JS template for Create-React-App comes with this same project setup already configured.Usage Summary​Install Redux Toolkit and React-Redux​Add the Redux Toolkit and React-Redux packages to your project:npm install @reduxjs/toolkit react-reduxCreate a Redux Store​Create a file named src/app/store.js. Import the configureStore API from Redux Toolkit. We'll start by creating an empty Redux store, and exporting it:app/store.jsimport { configureStore } from '@reduxjs/toolkit'export default configureStore({ reducer: {}})This creates a Redux store, and also automatically configure the Redux DevTools extension so that you can inspect the store while developing.Provide the Redux Store to React​Once the store is created, we can make it available to our React components by putting a React-Redux <Provider> around our application in src/index.js. Import the Redux store we just created, put a <Provider> around your <App>, and pass the store as a prop:index.jsimport React from 'react'import { createRoot } from 'react-dom/client'import './index.css'import App from './App'import store from './app/store'import { Provider } from 'react-redux'const root = createRoot(document.getElementById('root')!)root.render( <React.StrictMode> <Provider store={store}> <App /> </Provider> </React.StrictMode>,)Create a Redux State Slice​Add a new file named src/features/counter/counterSlice.js. In that file, import the createSlice API from Redux Toolkit.Creating a slice requires a string name to identify the slice, an initial state value, and one or more reducer functions to define how the state can be updated. Once a slice is created, we can export the generated Redux action creators and the reducer function for the whole slice.Redux requires that we write all state updates immutably, by making copies of data and updating the copies. However, Redux Toolkit's createSlice and createReducer APIs use Immer inside to allow us to write "mutating" update logic that becomes correct immutable updates.features/counter/counterSlice.jsimport { createSlice } from '@reduxjs/toolkit'export const counterSlice = createSlice({ name: 'counter', initialState: { value: 0 }, reducers: { increment: state => { // Redux Toolkit allows us to write "mutating" logic in reducers. It // doesn't actually mutate the state because it uses the Immer library, // which detects changes to a "draft state" and produces a brand new // immutable state based off those changes state.value += 1 }, decrement: state => { state.value -= 1 }, incrementByAmount: (state, action) => { state.value += action.payload } }})// Action creators are generated for each case reducer functionexport const { increment, decrement, incrementByAmount } = counterSlice.actionsexport default counterSlice.reducerAdd Slice Reducers to the Store​Next, we need to import the reducer function from the counter slice and add it to our store. By defining a field inside the reducer parameter, we tell the store to use this slice reducer function to handle all updates to that state.app/store.jsimport { configureStore } from '@reduxjs/toolkit'import counterReducer from '../features/counter/counterSlice'export default configureStore({ reducer: { counter: counterReducer }})Use Redux State and Actions in React Components​Now we can use the React-Redux hooks to let React components interact with the Redux store. We can read data from the store with useSelector, and dispatch actions using useDispatch. Create a src/features/counter/Counter.js file with a <Counter> component inside, then import that component into App.js and render it inside of <App>.features/counter/Counter.jsimport React from 'react'import { useSelector, useDispatch } from 'react-redux'import { decrement, increment } from './counterSlice'import styles from './Counter.module.css'export function Counter() { const count = useSelector(state => state.counter.value) const dispatch = useDispatch() return ( <div> <div> <button aria-label="Increment value" onClick={() => dispatch(increment())} > Increment </button> <span>{count}</span> <button aria-label="Decrement value" onClick={() => dispatch(decrement())} > Decrement </button> </div> </div> )}Now, any time you click the "Increment" and "Decrement" buttons:The corresponding Redux action will be dispatched to the storeThe counter slice reducer will see the actions and update its stateThe <Counter> component will see the new state value from the store and re-render itself with the new dataWhat You've Learned​That was a brief overview of how to set up and use Redux Toolkit with React. Recapping the details:SummaryCreate a Redux store with configureStoreconfigureStore accepts a reducer function as a named argumentconfigureStore automatically sets up the store with good default settingsProvide the Redux store to the React application componentsPut a React-Redux <Provider> component around your <App />Pass the Redux store as <Provider store={store}>Create a Redux "slice" reducer with createSliceCall createSlice with a string name, an initial state, and named reducer functionsReducer functions may "mutate" the state using ImmerExport the generated slice reducer and action creatorsUse the React-Redux useSelector/useDispatch hooks in React componentsRead data from the store with the useSelector hookGet the dispatch function with the useDispatch hook, and dispatch actions as neededFull Counter App Example​Here's the complete counter application as a running CodeSandbox:What's Next?​We recommend going through the full "Redux Essentials" tutorial, which covers all of the key pieces included in Redux Toolkit, what problems they solve, and how to use them to build real-world applications.You may also want to read through the "Redux Fundamentals" tutorial, which will give you a complete understanding of how Redux works, what Redux Toolkit does, and how to use it correctly.Edit this pageLast updated on Jul 28, 2024'''
