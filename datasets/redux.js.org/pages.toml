["https://redux.js.org/tutorials/essentials/part-6-performance-normalization"]
title = "Redux Essentials, Part 6: Performance, Normalizing Data, and Reactive Logic | Redux"
description = "The official Redux Essentials tutorial: learn how to improve app performance and structure data correctly"
full_description = '''TutorialsRedux EssentialsPerformance, Normalizing Data, and Reactive LogicOn this pageRedux Essentials, Part 6: Performance, Normalizing Data, and Reactive LogicWhat You'll LearnHow to create memoized selector functions with createSelectorPatterns for optimizing component rendering performanceHow to use createEntityAdapter to store and update normalized dataHow to use createListenerMiddleware for reactive logicPrerequisitesCompletion of Part 5 to understand data fetching flowIntroduction​In Part 5: Async Logic and Data Fetching, we saw how to write async thunks to fetch data from a server API, and patterns for handling async request loading state.In this section, we'll look at optimized patterns for ensuring good performance in our application, and techniques for automatically handling common updates of data in the store. We'll also look at how to write reactive logic that responds to dispatched actions.So far, most of our functionality has been centered around the posts feature. We're going to add a couple new sections of the app. After those are added, we'll look at some specific details of how we've built things, and talk about some weaknesses with what we've built so far and how we can improve the implementation.Adding More User Features​Adding User Pages​We're fetching a list of users from our fake API, and we can choose a user as the author when we add a new post. But, a social media app needs the ability to look at the page for a specific user and see all the posts they've made. Let's add a page to show the list of all users, and another to show all posts by a specific user.We'll start by adding a new <UsersList> component. It follows the usual pattern of reading some data from the store with useSelector, and mapping over the array to show a list of users with links to their individual pages:features/users/UsersList.tsximport { Link } from 'react-router-dom'import { useAppSelector } from '@/app/hooks'import { selectAllUsers } from './usersSlice'export const UsersList = () => { const users = useAppSelector(selectAllUsers) const renderedUsers = users.map(user => ( <li key={user.id}> <Link to={`/users/${user.id}`}>{user.name}</Link> </li> )) return ( <section> <h2>Users</h2> <ul>{renderedUsers}</ul> </section> )}And we'll add a <UserPage>, which is similar to our <SinglePostPage> in taking a userId parameter from the router. It then renders a list of all of the posts for that particular user. Following our usual pattern, we'll first add a selectPostsByUser selector in postsSlice.ts:features/posts/postsSlice.ts// omit rest of the fileexport const selectPostById = (state: RootState, postId: string) => state.posts.posts.find(post => post.id === postId)export const selectPostsByUser = (state: RootState, userId: string) => { const allPosts = selectAllPosts(state) // ❌ This seems suspicious! See more details below return allPosts.filter(post => post.user === userId)}export const selectPostsStatus = (state: RootState) => state.posts.statusexport const selectPostsError = (state: RootState) => state.posts.errorfeatures/users/UserPage.tsximport { Link, useParams } from 'react-router-dom'import { useAppSelector } from '@/app/hooks'import { selectPostsByUser } from '@/features/posts/postsSlice'import { selectUserById } from './usersSlice'export const UserPage = () => { const { userId } = useParams() const user = useAppSelector(state => selectUserById(state, userId!)) const postsForUser = useAppSelector(state => selectPostsByUser(state, userId!) ) if (!user) { return ( <section> <h2>User not found!</h2> </section> ) } const postTitles = postsForUser.map(post => ( <li key={post.id}> <Link to={`/posts/${post.id}`}>{post.title}</Link> </li> )) return ( <section> <h2>{user.name}</h2> <ul>{postTitles}</ul> </section> )}cautionNote that we're using allPosts.filter() inside of selectPostsByUser. This is actually a broken pattern! We'll see why in just a minute.We already have the selectAllUsers and selectUserById selectors available in our usersSlice, so we can just import and use those in the components.As we've seen before, we can take data from one useSelector call, or from props, and use that to help decide what to read from the store in another useSelector call.As usual, we will add routes for these components in <App>:App.tsx <Route path="/posts/:postId" element={<SinglePostPage />} /> <Route path="/editPost/:postId" element={<EditPostForm />} /> <Route path="/users" element={<UsersList />} /> <Route path="/users/:userId" element={<UserPage />} /> <Redirect to="/" />We'll also add another tab in <Navbar> that links to /users so that we can click and go to <UsersList>:app/Navbar.tsxexport const Navbar = () => { // omit other logic navContent = ( <div className="navContent"> <div className="navLinks"> <Link to="/posts">Posts</Link> <Link to="/users">Users</Link> </div> <div className="userDetails"> <UserIcon size={32} /> {user.name} <button className="button small" onClick={onLogoutClicked}> Log Out </button> </div> </div> ) // omit other rendering}Now we can actually browse to each user's page and see a list of just their posts.Sending Login Requests to the Server​Right now our <LoginPage> and authSlice are just dispatching client-side Redux actions to track the current username. In practice, we really need to send a login request to the server. Like we've done with posts and users, we'll convert the login and logout handling to async thunks instead.features/auth/authSlice.tsimport { createSlice, createAsyncThunk } from '@reduxjs/toolkit'import { client } from '@/api/client'import type { RootState } from '@/app/store'import { createAppAsyncThunk } from '@/app/withTypes'interface AuthState { username: string | null}export const login = createAppAsyncThunk( 'auth/login', async (username: string) => { await client.post('/fakeApi/login', { username }) return username })export const logout = createAppAsyncThunk('auth/logout', async () => { await client.post('/fakeApi/logout', {})})const initialState: AuthState = { // Note: a real app would probably have more complex auth state, // but for this example we'll keep things simple username: null}const authSlice = createSlice({ name: 'auth', initialState, // Remove the reducer definitions reducers: {}, extraReducers: builder => { // and handle the thunk actions instead builder .addCase(login.fulfilled, (state, action) => { state.username = action.payload }) .addCase(logout.fulfilled, state => { state.username = null }) }})// Removed the exported actionsexport default authSlice.reducerAlong with that, we'll update <Navbar> and <LoginPage> to import and dispatch the new thunks instead of the previous action creators:components/Navbar.tsximport { Link } from 'react-router-dom'import { useAppDispatch, useAppSelector } from '@/app/hooks'import { logout } from '@/features/auth/authSlice'import { selectCurrentUser } from '@/features/users/usersSlice'import { UserIcon } from './UserIcon'export const Navbar = () => { const dispatch = useAppDispatch() const user = useAppSelector(selectCurrentUser) const isLoggedIn = !!user let navContent: React.ReactNode = null if (isLoggedIn) { const onLogoutClicked = () => { dispatch(logout()) }features/auth/LoginPage.tsximport React from 'react'import { useNavigate } from 'react-router-dom'import { useAppDispatch, useAppSelector } from '@/app/hooks'import { selectAllUsers } from '@/features/users/usersSlice'import { login } from './authSlice'// omit typesexport const LoginPage = () => { const dispatch = useAppDispatch() const users = useAppSelector(selectAllUsers) const navigate = useNavigate() const handleSubmit = async (e: React.FormEvent<LoginPageFormElements>) => { e.preventDefault() const username = e.currentTarget.elements.username.value await dispatch(login(username)) navigate('/posts') }Since the userLoggedOut action creator was being used by the postsSlice, we can update that to listen to logout.fulfilled instead:features/posts/postsSlice.tsimport { createAsyncThunk, createSlice, PayloadAction } from '@reduxjs/toolkit'import { client } from '@/api/client'import type { RootState } from '@/app/store'// Import this thunk insteadimport { logout } from '@/features/auth/authSlice'// omit types and setupconst postsSlice = createSlice({ name, initialState, reducers: { /* omitted */ }, extraReducers: builder => { builder // switch to handle the thunk fulfilled action .addCase(logout.fulfilled, state => { // Clear out the list of posts whenever the user logs out return initialState }) // omit other cases }})Adding Notifications​No social media app would be complete without some notifications popping up to tell us that someone has sent a message, left a comment, or reacted to one of our posts.In a real application, our app client would be in constant communication with the backend server, and the server would push an update to the client every time something happens. Since this is a small example app, we're going to mimic that process by adding a button to actually fetch some notification entries from our fake API. We also don't have any other real users sending messages or reacting to posts, so the fake API will just create some random notification entries every time we make a request. (Remember, the goal here is to see how to use Redux itself.)Notifications Slice​Since this is a new part of our app, the first step is to create a new slice for our notifications, and an async thunk to fetch some notification entries from the API. In order to create some realistic notifications, we'll include the timestamp of the latest notification we have in state. That will let our mock server generate notifications newer than that timestamp.features/notifications/notificationsSlice.tsimport { createSlice } from '@reduxjs/toolkit'import { client } from '@/api/client'import type { RootState } from '@/app/store'import { createAppAsyncThunk } from '@/app/withTypes'export interface ServerNotification { id: string date: string message: string user: string}export const fetchNotifications = createAppAsyncThunk( 'notifications/fetchNotifications', async (_unused, thunkApi) => { const allNotifications = selectAllNotifications(thunkApi.getState()) const [latestNotification] = allNotifications const latestTimestamp = latestNotification ? latestNotification.date : '' const response = await client.get<ServerNotification[]>( `/fakeApi/notifications?since=${latestTimestamp}` ) return response.data })const initialState: ServerNotification[] = []const notificationsSlice = createSlice({ name: 'notifications', initialState, reducers: {}, extraReducers(builder) { builder.addCase(fetchNotifications.fulfilled, (state, action) => { state.push(...action.payload) // Sort with newest first state.sort((a, b) => b.date.localeCompare(a.date)) }) }})export default notificationsSlice.reducerexport const selectAllNotifications = (state: RootState) => state.notificationsAs with the other slices, we then import notificationsReducer into store.ts and add it to the configureStore() call.We've written an async thunk called fetchNotifications, which will retrieve a list of new notifications from the server. As part of that, we want to use the creation timestamp of the most recent notification as part of our request, so that the server knows it should only send back notifications that are actually new.We know that we will be getting back an array of notifications, so we can pass them as separate arguments to state.push(), and the array will add each item. We also want to make sure that they're sorted so that the most recent notification is first in the array, just in case the server were to send them out of order. (As a reminder, array.sort() always mutates the existing array - this is only safe because we're using createSlice and Immer inside.)Thunk Arguments​If you look at our fetchNotifications thunk, it has something new that we haven't seen before. Let's talk about thunk arguments for a minute.We've already seen that we can pass an argument into a thunk action creator when we dispatch it, like dispatch(addPost(newPost)). For createAsyncThunk specifically, you can only pass in one argument, and whatever we pass in becomes the first argument of the payload creation callback. If we don't actually pass anything in, then that argument becomes undefined.The second argument to our payload creator is a thunkAPI object containing several useful functions and pieces of information:dispatch and getState: the actual dispatch and getState methods from our Redux store. You can use these inside the thunk to dispatch more actions, or get the latest Redux store state (such as reading an updated value after another action is dispatched).extra: the "extra argument" that can be passed into the thunk middleware when creating the store. This is typically some kind of API wrapper, such as a set of functions that know how to make API calls to your application's server and return data, so that your thunks don't have to have all the URLs and query logic directly inside.requestId: a unique random ID value for this thunk call. Useful for tracking status of an individual request.signal: An AbortController.signal function that can be used to cancel an in-progress request.rejectWithValue: a utility that helps customize the contents of a rejected action if the thunk receives an error.(If you're writing a thunk by hand instead of using createAsyncThunk, the thunk function will get(dispatch, getState) as separate arguments, instead of putting them together in one object.)infoFor more details on these arguments and how to handle canceling thunks and requests, see the createAsyncThunk API reference page.In this case, we need access to the thunkApi argument, which is always the second argument. That means we need to provide some variable name for the first argument, even though we don't pass anything in when we dispatch the thunk, and we don't need to use it inside the payload callback. So, we'll just give it a name of _unused.From there, we know that the list of notifications is in our Redux store state, and that the latest notification should be first in the array. We can call thunkApi.getState() to read the state value, and use the selectAllNotifications selector to give us just the array of notifications. Since the array of notifications is sorted newest first, we can grab the latest one using array destructuring.Adding the Notifications List​Now that we've got the notificationsSlice created, we can add a <NotificationsList> component. It needs to read the list of notifications from the store and format them, including showing how recent each notification was, and who sent it. We already have the <PostAuthor> and <TimeAgo> components that can do that formatting, so we can reuse them here. That said, <PostAuthor> includes a "by " prefix which doesn't make sense here - we'll modify it to add a showPrefix prop that defaults to true, and specifically not show prefixes here.features/posts/PostAuthor.tsxinterface PostAuthorProps { userId: strin'''
