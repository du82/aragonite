title = "Redux Essentials, Part 2: Redux Toolkit App Structure | Redux"
description = "The official Redux Essentials tutorial: learn the structure of a typical React + Redux Toolkit app"
full_description = '''TutorialsRedux EssentialsRedux Toolkit App StructureOn this pageRedux Essentials, Part 2: Redux Toolkit App StructureWhat You'll LearnThe structure of a typical React + Redux Toolkit appHow to view state changes in the Redux DevTools ExtensionIntroduction​In Part 1: Redux Overview and Concepts, we looked at why Redux is useful, the terms and concepts used to describe different parts of Redux code, and how data flows through a Redux app.Now, let's look at a real working example to see how these pieces fit together.The Counter Example App​The sample project we'll look at is a small counter application that lets us add or subtract from a number as we click buttons. It may not be very exciting, but it shows all the important pieces of a React+Redux application in action.The project has been created using a smaller version of the official Redux Toolkit template for Vite. Out of the box, it has already been configured with a standard Redux application structure, using Redux Toolkit to create the Redux store and logic, and React-Redux to connect together the Redux store and the React components.Here's the live version of the project. You can play around with it by clicking the buttons in the app preview on the right, and browse through the source files on the left.If you'd like to set up this project on your own computer, you can create a local copy with this command:npx degit reduxjs/redux-templates/packages/rtk-app-structure-example my-appYou can also create a new project using the full Redux Toolkit template for Vite:npx degit reduxjs/redux-templates/packages/vite-template-redux my-appUsing the Counter App​The counter app has already been set up to let us watch what happens inside as we use it.Open up your browser's DevTools. Then, choose the "Redux" tab in the DevTools, and click the "State" button in the upper-right toolbar. You should see something that looks like this:On the right, we can see that our Redux store is starting off with an app state value that looks like this:{ counter: { value: 0 status: 'idle' }}The DevTools will show us how the store state changes as we use the app.Let's play with the app first to see what it does. Click the "+" button in the app, then look at the "Diff" tab in the Redux DevTools:We can see two important things here:When we clicked the "+" button, an action with a type of "counter/increment" was dispatched to the storeWhen that action was dispatched, the state.counter.value field changed from 0 to 1Now try these steps:Click the "+" button again. The displayed value should now be 2.Click the "-" button once. The displayed value should now be 1.Click the "Add Amount" button. The displayed value should now be 3.Change the number "2" in the textbox to a "3"Click the "Add Async" button. You should see a progress bar fill the button, and after a couple seconds, the displayed value should change to 6.Go back to the Redux DevTools. You should see a total of five actions dispatched, one for each time we clicked a button . Now select the last "counter/incrementByAmount" entry from the list on the left, and click the "Action" tab on the right side:We can see that this action object looked like this:{ type: 'counter/incrementByAmount', payload: 3}And if you click the "Diff" tab, you can see that the state.counter.value field changed from a 3 to a 6 in response to that action.The ability to see what is happening inside of our app and how our state is changing over time is very powerful!The DevTools have several more commands and options to help you debug your app. Try clicking the "Trace" tab in the upper right. You should see a JavaScript function stack trace in the panel, with several sections of source code showing the lines that were executing when the action reached the store. One line in particular should be highlighted: the line of code where we dispatched this action from the <Counter> component:This makes it easier to trace what part of the code dispatched a specific action.Application Contents​Now that you know what the app does, let's look at how it works.Here are the key files that make up this application:/srcmain.tsx: the starting point for the appApp.tsx: the top-level React component/appstore.ts: creates the Redux store instancehooks.ts: exports pre-typed React-Redux hooks/features/counterCounter.tsx: a React component that shows the UI for the counter featurecounterSlice.ts: the Redux logic for the counter featureLet's start by looking at how the Redux store is created.Creating the Redux Store​Open up app/store.ts, which should look like this:app/store.tsimport type { Action, ThunkAction } from '@reduxjs/toolkit'import { configureStore } from '@reduxjs/toolkit'import counterReducer from '@/features/counter/counterSlice'export const store = configureStore({ reducer: { counter: counterReducer }})// Infer the type of `store`export type AppStore = typeof storeexport type RootState = ReturnType<AppStore['getState']>// Infer the `AppDispatch` type from the store itselfexport type AppDispatch = AppStore['dispatch']// Define a reusable type describing thunk functionsexport type AppThunk<ThunkReturnType = void> = ThunkAction< ThunkReturnType, RootState, unknown, Action>The Redux store is created using the configureStore function from Redux Toolkit. configureStore requires that we pass in a reducer argument.Our application might be made up of many different features, and each of those features might have its own reducer function. When we call configureStore, we can pass in all of the different reducers in an object. The key names in the object will define the keys in our final state value.We have a file named features/counter/counterSlice.ts that exports a reducer function for the counter logic as the ESM "default" export. We can import that function into this file. Since it's a default export, we can give that variable any name we want when we import it into this file. In this case, we call it counterReducer here, and include it when we create the store. (Note that the import/export behavior here is standard ES Module syntax, and not specific to Redux.)When we pass in an object like {counter: counterReducer}, that says that we want to have a state.counter section of our Redux state object, and that we want the counterReducer function to be in charge of deciding if and how to update the state.counter section whenever an action is dispatched.Redux allows store setup to be customized with different kinds of plugins ("middleware" and "enhancers"). configureStore automatically adds several middleware to the store setup by default to provide a good developer experience, and also sets up the store so that the Redux DevTools Extension can inspect its contents.For TypeScript usage, we also want to export some reusable types based on the Store, such as the RootState and AppDispatch types. We'll see how those get used later.Redux Slices​A "slice" is a collection of Redux reducer logic and actions for a single feature in your app, typically defined together in a single file. The name comes from splitting up the root Redux state object into multiple "slices" of state.For example, in a blogging app, our store setup might look like:import { configureStore } from '@reduxjs/toolkit'import usersReducer from '../features/users/usersSlice'import postsReducer from '../features/posts/postsSlice'import commentsReducer from '../features/comments/commentsSlice'export const store = configureStore({ reducer: { users: usersReducer, posts: postsReducer, comments: commentsReducer }})In that example, state.users, state.posts, and state.comments are each a separate "slice" of the Redux state. Since usersReducer is responsible for updating the state.users slice, we refer to it as a "slice reducer" function.Detailed Explanation: Reducers and State StructureA Redux store needs to have a single "root reducer" function passed in when it's created. So if we have many different slice reducer functions, how do we get a single root reducer instead, and how does this define the contents of the Redux store state?If we tried calling all of the slice reducers by hand, it might look like this:function rootReducer(state = {}, action) { return { users: usersReducer(state.users, action), posts: postsReducer(state.posts, action), comments: commentsReducer(state.comments, action) }}That calls each slice reducer individually, passes in the specific slice of the Redux state, and includes each return value in the final new Redux state object.Redux has a function called combineReducers that does this for us automatically. It accepts an object full of slice reducers as its argument, and returns a function that calls each slice reducer whenever an action is dispatched. The result from each slice reducer are all combined together into a single object as the final result. We can do the same thing as the previous example using combineReducers:const rootReducer = combineReducers({ users: usersReducer, posts: postsReducer, comments: commentsReducer})When we pass an object of slice reducers to configureStore, it passes those to combineReducers for us to generate the root reducer.As we saw earlier, you can also pass a reducer function directly as the reducer argument:const store = configureStore({ reducer: rootReducer})Creating Slice Reducers and Actions​Since we know that the counterReducer function is coming from features/counter/counterSlice.ts, let's see what's in that file, piece by piece.features/counter/counterSlice.tsimport { createAsyncThunk, createSlice } from '@reduxjs/toolkit'import type { PayloadAction } from '@reduxjs/toolkit'// Define the TS type for the counter slice's stateexport interface CounterState { value: number status: 'idle' | 'loading' | 'failed'}// Define the initial value for the slice stateconst initialState: CounterState = { value: 0, status: 'idle'}// Slices contain Redux reducer logic for updating state, and// generate actions that can be dispatched to trigger those updates.export const counterSlice = createSlice({ name: 'counter', initialState, // The `reducers` field lets us define reducers and generate associated actions reducers: { increment: state => { // Redux Toolkit allows us to write "mutating" logic in reducers. It // doesn't actually mutate the state because it uses the Immer library, // which detects changes to a "draft state" and produces a brand new // immutable state based off those changes state.value += 1 }, decrement: state => { state.value -= 1 }, // Use the PayloadAction type to declare the contents of `action.payload` incrementByAmount: (state, action: PayloadAction<number>) => { state.value += action.payload } }})// Export the generated action creators for use in componentsexport const { increment, decrement, incrementByAmount } = counterSlice.actions// Export the slice reducer for use in the store configurationexport default counterSlice.reducerEarlier, we saw that clicking the different buttons in the UI dispatched three different Redux action types:{type: "counter/increment"}{type: "counter/decrement"}{type: "counter/incrementByAmount"}We know that actions are plain objects with a type field, the type field is always a string, and we typically have "action creator" functions that create and return the action objects. So where are those action objects, type strings, and action creators defined?We could write those all by hand, every time. But, that would be tedious. Besides, what's really important in Redux is the reducer functions, and the logic they have for calculating new state.Redux Toolkit has a function called createSlice, which takes care of the work of generating action type strings, action creator functions, and action objects. All you have to do is define a name for this slice, write an object that has some reducer functions in it, and it generates the corresponding action code automatically. The string from the name option is used as the first part of each action type, and the key name of each reducer function is used as the second part. So, the "counter" name + the "increment" reducer function generated an action type of {type: "counter/increment"}. (After all, why write this by hand if the computer can do it for us!)In addition to the name field, createSlice needs us to pass in the initial state value for the reducers, so that there is a state the first time it gets called. In this case, we're providing an object with a value field that starts off at 0, and a status field that starts off with 'idle'.We can see here that there are three reducer functions, and that corresponds to the three different action types that were dispatched by clicking the different buttons.createSlice automatically generates action creators with the same names as the reducer functions we wrote. We can check that by calling one of them and seeing what it returns:console.log(counterSlice.actions.increment())// {type: "counter/increment"}It also generates the slice reducer function that knows how to respond to all these action types:const newState = counterSlice.reducer( { value: 10 }, counterSlice.actions.increment())console.log(newState)// {value: 11}Rules of Reducers​We said earlier that reducers must always follow some special rules:They should only calculate the new state value based on the state and action argumentsThey are not allowed to modify the existing state. Instead, they must make immutable updates, by copying the existing state and making changes to the copied values.They must be "pure" - they cannot do any asynchronous logic or other "side effects"But why are these rules important? There are a few different reasons:One of the goals of Redux is to make your code predictable. When a function's output is only calculated from the input arguments, it's easier to understand how that code works, and to test it.On the other hand, if a function depends on variables outside itself, or behaves randomly, you never know what will happen when you run it.If a function modifies other values, including its arguments, that can change the way the application works unexpectedly. This can be a common source of bugs, such as "I updated my state, but now my UI isn't updating when it should!"Some of the Redux DevTools capabilities depend on having your reducers follow these rules correctlyThe rule about "immutable updates" is particularly important, and worth talking about further.Reducers and Immutable Updates​Earlier, we talked about "mutation" (modifying existing object/array values) and "immutability" (treating values as something that cannot be changed).In Redux, our reducers are never allowed to mutate the original / current state values!danger// ❌ Illegal - by default, this will mutate the state!state.value = 123There are several reasons why you must not mutate state in Redux:It causes bugs, such as the UI not updating properly to show the latest valuesIt makes it harder to understand why and how the state has been updatedIt makes it harder to write testsIt breaks the ability to use "time-travel debugging"'''
