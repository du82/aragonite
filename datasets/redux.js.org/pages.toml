title = "Redux Essentials, Part 8: RTK Query Advanced Patterns | Redux"
description = "The official Redux Essentials tutorial: learn advanced patterns for fetching data with RTK Query"
full_description = '''TutorialsRedux EssentialsRTK Query Advanced PatternsOn this pageRedux Essentials, Part 8: RTK Query Advanced PatternsWhat You'll LearnHow to use tags with IDs to manage cache invalidation and refetchingHow to work with the RTK Query cache outside of ReactTechniques for manipulating response dataImplementing optimistic updates and streaming updatesPrerequisitesCompletion of Part 7 to understand RTK Query setup and basic usageIntroduction​In Part 7: RTK Query Basics, we saw how to set up and use the RTK Query API to handle data fetching and caching in our application. We added an "API slice" to our Redux store, defined "query" endpoints to fetch posts data, and a "mutation" endpoint to add a new post.In this section, we'll continue migrating our example app to use RTK Query for the other data types, and see how to use some of its advanced features to simplify the codebase and improve user experience.infoSome of the changes in this section aren't strictly necessary - they're included to demonstrate RTK Query's features and show some of the things you can do, so you can see how to use these features if you need them.Editing Posts​We've already added a mutation endpoint to save new Post entries to the server, and used that in our <AddPostForm>. Next, we need to handle updating the <EditPostForm> to let us edit an existing post.Updating the Edit Post Form​As with adding posts, the first step is to define a new mutation endpoint in our API slice. This will look much like the mutation for adding a post, but the endpoint needs to include the post ID in the URL and use an HTTP PATCH request to indicate that it's updating some of the fields.features/api/apiSlice.tsexport const apiSlice = createApi({ reducerPath: 'api', baseQuery: fetchBaseQuery({ baseUrl: '/fakeApi' }), tagTypes: ['Post'], endpoints: builder => ({ getPosts: builder.query<Post[], void>({ query: () => '/posts', providesTags: ['Post'] }), getPost: builder.query<Post, string>({ query: postId => `/posts/${postId}` }), addNewPost: builder.mutation<Post, NewPost>({ query: initialPost => ({ url: '/posts', method: 'POST', body: initialPost }), invalidatesTags: ['Post'] }), editPost: builder.mutation<Post, PostUpdate>({ query: post => ({ url: `posts/${post.id}`, method: 'PATCH', body: post }) }) })})export const { useGetPostsQuery, useGetPostQuery, useAddNewPostMutation, useEditPostMutation} = apiSliceOnce that's added, we can update the <EditPostForm>. It needs to read the original Post entry from the store, use that to initialize the component state to edit the fields, and then send the updated changes to the server. Currently, we're reading the Post entry with selectPostById, and manually dispatching a postUpdated thunk for the request.We can use the same useGetPostQuery hook that we used in <SinglePostPage> to read the Post entry from the cache in the store, and we'll use the new useEditPostMutation hook to handle saving the changes. If desired, we can also add a spinner and disable the form inputs while the update is in progress as well.features/posts/EditPostForm.tsximport React from 'react'import { useNavigate, useParams } from 'react-router-dom'import { Spinner } from '@/components/Spinner'import { useGetPostQuery, useEditPostMutation } from '@/features/api/apiSlice'// omit form typesexport const EditPostForm = () => { const { postId } = useParams() const navigate = useNavigate() const { data: post } = useGetPostQuery(postId!) const [updatePost, { isLoading }] = useEditPostMutation() if (!post) { return ( <section> <h2>Post not found!</h2> </section> ) } const onSavePostClicked = async ( e: React.FormEvent<EditPostFormElements> ) => { // Prevent server submission e.preventDefault() const { elements } = e.currentTarget const title = elements.postTitle.value const content = elements.postContent.value if (title && content) { await updatePost({ id: post.id, title, content }) navigate(`/posts/${postId}`) } } // omit rendering}Cache Data Subscription Lifetimes​Let's try this out and see what happens. Open up your browser's DevTools, go to the Network tab, refresh the page, clear the network tab, then login. You should see a GET request to /posts as we fetch the initial data. When you click on a "View Post" button, you should see a second request to /posts/:postId that returns that single post entry.Now click "Edit Post" inside the single post page. The UI switches over to show <EditPostForm>, but this time there's no network request for the individual post. Why not?RTK Query allows multiple components to subscribe to the same data, and will ensure that each unique set of data is only fetched once. Internally, RTK Query keeps a reference counter of active "subscriptions" to each endpoint + cache key combination. If Component A calls useGetPostQuery(42), that data will be fetched. If Component B then mounts and also calls useGetPostQuery(42), it's asking for the same data. We already have an existing cache entry, so there's no need for a request. The two hook usages will return the exact same results, including fetched data and loading status flags.When the number of active subscriptions goes down to 0, RTK Query starts an internal timer. If the timer expires before any new subscriptions for the data are added, RTK Query will remove that data from the cache automatically, because the app no longer needs the data. However, if a new subscription is added before the timer expires, the timer is canceled, and the already-cached data is used without needing to refetch it.In this case, our <SinglePostPage> mounted and requested that individual Post by ID. When we clicked on "Edit Post", the <SinglePostPage> component was unmounted by the router, and the active subscription was removed due to unmounting. RTK Query immediately started a "remove this post data" timer. But, the <EditPostPage> component mounted right away and subscribed to the same Post data with the same cache key. So, RTK Query canceled the timer and kept using the same cached data instead of fetching it from the server.By default, unused data is removed from the cache after 60 seconds, but this can be configured in either the root API slice definition or overridden in the individual endpoint definitions using the keepUnusedDataFor flag, which specifies a cache lifetime in seconds.Invalidating Specific Items​Our <EditPostForm> component can now save the edited post to the server, but we have a problem. If we click "Save Post" while editing, it returns us to the <SinglePostPage>, but it's still showing the old data without the edits. The <SinglePostPage> is still using the cached Post entry that was fetched earlier. For that matter, if we return to the main page and look at the <PostsList>, it's also showing the old data. We need a way to force a refetch of both the individual Post entry, and the entire list of posts.Earlier, we saw how we can use "tags" to invalidate parts of our cached data. We declared that the getPosts query endpoint provides a 'Post' tag, and that the addNewPost mutation endpoint invalidates that same 'Post' tag. That way, every time we add a new post, we force RTK Query to refetch the entire list of posts from the getQuery endpoint.We could add a 'Post' tag to both the getPost query and the editPost mutation, but that would force all the other individual posts to be refetched as well. Fortunately, RTK Query lets us define specific tags, which let us be more selective in invalidating data. These specific tags look like {type: 'Post', id: 123}.Our getPosts query defines a providesTags field that is an array of strings. The providesTags field can also accept a callback function that receives the result and arg, and returns an array. This allows us to create tag entries based on IDs of data that is being fetched. Similarly, invalidatesTags can be a callback as well.In order to get the right behavior, we need to set up each endpoint with the right tags:getPosts: provides a general 'Post' tag for the whole list, as well as a specific {type: 'Post', id} tag for each received post objectgetPost: provides a specific {type: 'Post', id} object for the individual post objectaddNewPost: invalidates the general 'Post' tag, to refetch the whole listeditPost: invalidates the specific {type: 'Post', id} tag. This will force a refetch of both the individual post from getPost, as well as the entire list of posts from getPosts, because they both provide a tag that matches that {type, id} value.features/api/apiSlice.tsexport const apiSlice = createApi({ reducerPath: 'api', baseQuery: fetchBaseQuery({ baseUrl: '/fakeApi' }), tagTypes: ['Post'], endpoints: builder => ({ getPosts: builder.query<Post[], void>({ query: () => '/posts', providesTags: (result = [], error, arg) => [ 'Post', ...result.map(({ id }) => ({ type: 'Post', id }) as const) ] }), getPost: builder.query<Post, string>({ query: postId => `/posts/${postId}`, providesTags: (result, error, arg) => [{ type: 'Post', id: arg }] }), addNewPost: builder.mutation<Post, NewPost>({ query: initialPost => ({ url: '/posts', method: 'POST', body: initialPost }), invalidatesTags: ['Post'] }), editPost: builder.mutation<Post, PostUpdate>({ query: post => ({ url: `posts/${post.id}`, method: 'PATCH', body: post }), invalidatesTags: (result, error, arg) => [{ type: 'Post', id: arg.id }] }) })})It's possible for the result argument in these callbacks to be undefined if the response has no data or there's an error, so we have to handle that safely. For getPosts we can do that by using a default argument array value to map over, and for getPost we're already returning a single-item array based on the argument ID. For editPost, we know the ID of the post from the partial post object that was passed into the trigger function, so we can read it from there.With those changes in place, let's go back and try editing a post again, with the Network tab open in the browser DevTools.When we save the edited post this time, we should see two requests happen back-to-back:The PATCH /posts/:postId from the editPost mutationA GET /posts/:postId as the getPost query is refetchedThen, if we click back to the main "Posts" tab, we should also see:A GET /posts as the getPosts query is refetchedBecause we provided the relationships between the endpoints using tags, RTK Query knew that it needed to refetch the individual post and the list of posts when we made that edit and the specific tag with that ID was invalidated - no further changes needed! Meanwhile, as we were editing the post, the cache removal timer for the getPosts data expired, so it was removed from the cache. When we opened the <PostsList> component again, RTK Query saw that it did not have the data in cache and refetched it.There is one caveat here. By specifying a plain 'Post' tag in getPosts and invalidating it in addNewPost, we actually end up forcing a refetch of all individual posts as well. If we really want to just refetch the list of posts for the getPosts endpoint, you can include an additional tag with an arbitrary ID, like {type: 'Post', id: 'LIST'}, and invalidate that tag instead. The RTK Query docs have a table that describes what will happen if certain general/specific tag combinations are invalidated.infoRTK Query has many other options for controlling when and how to refetch data, including "conditional fetching", "lazy queries", and "prefetching", and query definitions can be customized in a variety of ways. See the RTK Query usage guide docs for more details on using these features:RTK Query: Automated Re-FetchingRTK Query: Conditional FetchingRTK Query: PrefetchingRTK Query: Customizing QueriesRTK Query: useLazyQueryUpdating Toast Display​When we switched from dispatching thunks for adding posts to using an RTK Query mutation, we accidentally broke the "New post added" toast message behavior, because the addNewPost.fulfilled action is no longer getting dispatched.Fortunately, this is simple to fix. RTK Query actually uses createAsyncThunk internally, and we've already seen that it dispatches Redux actions as the requests are made. We can update the toast listener to watch for RTKQ's internal actions being dispatched, and show the toast message when that happens.createApi automatically generates thunks internally for each endpoint. It also automatically generates RTK "matcher" functions, which accept an action object and return true if the action matches some condition. These matchers can be used in any place that needs to check if an action matches a given condition, such as inside startAppListening. They also act as TypeScript type guards, narrowing the TS type of the action object so that you can safely access its fields.Currently, the toast listener is watching for the single specific action type with actionCreator: addNewPost.fulfilled. We'll update it to watch for the posts being added with matcher: apiSlice.endpoints.addNewPost.matchFulfilled:features/posts/postsSlice.tsimport { createEntityAdapter, createSelector, createSlice, EntityState, PayloadAction } from '@reduxjs/toolkit'import { client } from '@/api/client'import type { RootState } from '@/app/store'import { AppStartListening } from '@/app/listenerMiddleware'import { createAppAsyncThunk } from '@/app/withTypes'import { apiSlice } from '@/features/api/apiSlice'import { logout } from '@/features/auth/authSlice'// omit types, posts slice, and selectorsexport const addPostsListeners = (startAppListening: AppStartListening) => { startAppListening({ matcher: apiSlice.endpoints.addNewPost.matchFulfilled, effect: async (action, listenerApi) => {Now the toast should show correctly again when we add a post.Managing Users Data​We've finished converting our posts data management over to use RTK Query. Next up, we'll convert the list of users.Since we've already seen how to use the RTK Query hooks for fetching and reading data, for this section we're going to try a different approach. Like the rest of Redux Toolkit, RTK Query's core logic is UI-agnostic and can be used with any UI layer, not just React.Normally you should use the React hooks that createApi generates, since they do a lot of work for you. But, for sake of illustration, here we're going to work with the user data using just the RTK Query core API so you can see how to use it.Fetching Users Manually​We're currently defining a fetchUsers async thunk in usersSlice.ts, and dispatching that thunk manually in main.tsx so that the list of users is available as soon as possible. We can do that same process using RTK Query.We'll start by defining a getUsers query endpoint in apiSlice.ts, similar to our existing endpoints. We'll export the useGetUsersQuery hook just for consistency, but for now we're not going to use it.features/api/apiSlice.tsimport { createApi, fetchBaseQuery } from '@reduxjs/toolkit/query/react'import type { Post, NewPost, PostUpdate } from '@/features/posts/postsSlice'import type { User } from '@/features/users/usersSlice'export type { Post }export const apiSlice = createApi({ '''
