title = "Code Splitting | Redux"
description = "In large web applications, it is often desirable to split up the app code into multiple JS bundles that can be loaded on-demand. This strategy, called 'code splitting', helps to increase performance of your application by reducing the size of the initial JS payload that must be fetched."
full_description = '''Using ReduxSetup and OrganizationCode SplittingOn this pageCode SplittingIn large web applications, it is often desirable to split up the app code into multiple JS bundles that can be loaded on-demand. This strategy, called 'code splitting', helps to increase performance of your application by reducing the size of the initial JS payload that must be fetched.To code split with Redux, we want to be able to dynamically add reducers to the store. However, Redux really only has a single root reducer function. This root reducer is normally generated by calling combineReducers() or a similar function when the application is initialized. In order to dynamically add more reducers, we need to call that function again to re-generate the root reducer. Below, we discuss some approaches to solving this problem and reference two libraries that provide this functionality.Basic Principle​Using replaceReducer​The Redux store exposes a replaceReducer function, which replaces the current active root reducer function with a new root reducer function. Calling it will swap the internal reducer function reference, and dispatch an action to help any newly-added slice reducers initialize themselves:const newRootReducer = combineReducers({ existingSlice: existingSliceReducer, newSlice: newSliceReducer})store.replaceReducer(newRootReducer)Reducer Injection Approaches​This section will cover some handwritten recipes used to inject reducers.Defining an injectReducer function​We will likely want to call store.replaceReducer() from anywhere in the application. Because of that, it's helpful to define a reusable injectReducer() function that keeps references to all of the existing slice reducers, and attach that to the store instance.import { createStore } from 'redux'// Define the Reducers that will always be present in the applicationconst staticReducers = { users: usersReducer, posts: postsReducer}// Configure the storeexport default function configureStore(initialState) { const store = createStore(createReducer(), initialState) // Add a dictionary to keep track of the registered async reducers store.asyncReducers = {} // Create an inject reducer function // This function adds the async reducer, and creates a new combined reducer store.injectReducer = (key, asyncReducer) => { store.asyncReducers[key] = asyncReducer store.replaceReducer(createReducer(store.asyncReducers)) } // Return the modified store return store}function createReducer(asyncReducers) { return combineReducers({ ...staticReducers, ...asyncReducers })}Now, one just needs to call store.injectReducer to add a new reducer to the store.Using a 'Reducer Manager'​Another approach is to create a 'Reducer Manager' object, which keeps track of all the registered reducers and exposes a reduce() function. Consider the following example:export function createReducerManager(initialReducers) { // Create an object which maps keys to reducers const reducers = { ...initialReducers } // Create the initial combinedReducer let combinedReducer = combineReducers(reducers) // An array which is used to delete state keys when reducers are removed let keysToRemove = [] return { getReducerMap: () => reducers, // The root reducer function exposed by this object // This will be passed to the store reduce: (state, action) => { // If any reducers have been removed, clean up their state first if (keysToRemove.length > 0) { state = { ...state } for (let key of keysToRemove) { delete state[key] } keysToRemove = [] } // Delegate to the combined reducer return combinedReducer(state, action) }, // Adds a new reducer with the specified key add: (key, reducer) => { if (!key || reducers[key]) { return } // Add the reducer to the reducer mapping reducers[key] = reducer // Generate a new combined reducer combinedReducer = combineReducers(reducers) }, // Removes a reducer with the specified key remove: key => { if (!key || !reducers[key]) { return } // Remove it from the reducer mapping delete reducers[key] // Add the key to the list of keys to clean up keysToRemove.push(key) // Generate a new combined reducer combinedReducer = combineReducers(reducers) } }}const staticReducers = { users: usersReducer, posts: postsReducer}export function configureStore(initialState) { const reducerManager = createReducerManager(staticReducers) // Create a store with the root reducer function being the one exposed by the manager. const store = createStore(reducerManager.reduce, initialState) // Optional: Put the reducer manager on the store so it is easily accessible store.reducerManager = reducerManager}To add a new reducer, one can now call store.reducerManager.add("asyncState", asyncReducer).To remove a reducer, one can now call store.reducerManager.remove("asyncState")Redux Toolkit​Redux Toolkit 2.0 includes some utilities designed to simplify code splitting with reducers and middleware, including solid Typescript support (a common challenge with lazy loaded reducers and middleware).combineSlices​The combineSlices utility is designed to allow for easy reducer injection. It also supercedes combineReducers, in that it can be used to combine multiple slices and reducers into one root reducer.At setup it accepts a set of slices and reducer maps, and returns a reducer instance with attached methods for injection.noteA "slice" for combineSlices is typically created with createSlice, but can be any "slice-like" object with reducerPath and reducer properties (meaning RTK Query API instances are also compatible).const withUserReducer = rootReducer.inject({ reducerPath: 'user', reducer: userReducer})const withApiReducer = rootReducer.inject(fooApi)For simplicity, this { reducerPath, reducer } shape will be described in these docs as a "slice".Slices will be mounted at their reducerPath, and items from reducer map objects will be mounted under their respective key.const rootReducer = combineSlices(counterSlice, baseApi, { user: userSlice.reducer, auth: authSlice.reducer})// is likeconst rootReducer = combineReducers({ [counterSlice.reducerPath]: counterSlice.reducer, [baseApi.reducerPath]: baseApi.reducer, user: userSlice.reducer, auth: authSlice.reducer})cautionBe careful to avoid naming collision - later keys will overwrite earlier ones, but Typescript won't be able to account for this.Slice injection​To inject a slice, you should call rootReducer.inject(slice) on the reducer instance returned from combineSlices. This will inject the slice under its reducerPath into the set of reducers, and return an instance of the combined reducer typed to know that the slice has been injected.Alternatively, you can call slice.injectInto(rootReducer), which returns an instance of the slice which is aware it's been injected. You may even want to do both, as each call returns something useful, and combineSlices allows injection of the same reducer instance at the same reducerPath without issue.const withCounterSlice = rootReducer.inject(counterSlice)const injectedCounterSlice = counterSlice.injectInto(rootReducer)One key difference between typical reducer injection and combineSlice's "meta-reducer" approach is that replaceReducer is never called for combineSlice. The reducer instance passed to the store doesn't change.A consequence of this is that no action is dispatched when a slice is injected, and therefore the injected slice's state doesn't show in state immediately. The state will only show in the store's state when an action is dispatched.However, to avoid selectors having to account for possibly undefined state, combineSlices includes some useful selector utilities.Declaring lazy loaded slices​In order for lazy loaded slices to show up in the inferred state type, a withLazyLoadedSlices helper is provided. This allows you to declare slices you intend to later inject, so they can show up as optional in the state type.To completely avoid importing the lazy slice into the combined reducer's file, module augmentation can be used.// file: reducer.tsimport { combineSlices } from '@reduxjs/toolkit'import { staticSlice } from './staticSlice'export interface LazyLoadedSlices {}export const rootReducer = combineSlices(staticSlice).withLazyLoadedSlices<LazyLoadedSlices>()// file: counterSlice.tsimport type { WithSlice } from '@reduxjs/toolkit'import { createSlice } from '@reduxjs/toolkit'import { rootReducer } from './reducer'interface CounterState { value: number}const counterSlice = createSlice({ name: 'counter', initialState: { value: 0 } as CounterState, reducers: { increment: state => void state.value++ }, selectors: { selectValue: state => state.value }})declare module './reducer' { // WithSlice utility assumes reducer is under slice.reducerPath export interface LazyLoadedSlices extends WithSlice<typeof counterSlice> {} // if it's not, just use a normal key export interface LazyLoadedSlices { aCounter: CounterState }}const injectedCounterSlice = counterSlice.injectInto(rootReducer)const injectedACounterSlice = counterSlice.injectInto(rootReducer, { reducerPath: 'aCounter'})Selector utilities​As well as inject, the combined reducer instance has a .selector method which can be used to wrap selectors. It wraps the state object in a Proxy, and provides an initial state for any reducers which have been injected but haven't appeared in state yet.The result of calling inject is typed to know that the injected slice will always be defined when the selector is called.const selectCounterValue = (state: RootState) => state.counter?.value // number | undefinedconst withCounterSlice = rootReducer.inject(counterSlice)const selectCounterValue = withCounterSlice.selector( state => state.counter.value // number - initial state used if not in store)An "injected" instance of a slice will do the same thing for slice selectors - initial state will be provided if not present in the state passed.const injectedCounterSlice = counterSlice.injectInto(rootReducer)console.log(counterSlice.selectors.selectValue({})) // runtime errorconsole.log(injectedCounterSlice.selectors.selectValue({})) // 0Typical usage​combineSlices is designed so that the slice is injected as soon as it's needed (i.e. a selector or action is imported from a component that's been loaded in).This means that the typical usage will look something along the lines of the below.// file: reducer.tsimport { combineSlices } from '@reduxjs/toolkit'import { staticSlice } from './staticSlice'export interface LazyLoadedSlices {}export const rootReducer = combineSlices(staticSlice).withLazyLoadedSlices<LazyLoadedSlices>()// file: store.tsimport { configureStore } from '@reduxjs/toolkit'import { rootReducer } from './reducer'export const store = configureStore({ reducer: rootReducer })// file: counterSlice.tsimport type { WithSlice } from '@reduxjs/toolkit'import { createSlice } from '@reduxjs/toolkit'import { rootReducer } from './reducer'const counterSlice = createSlice({ name: 'counter', initialState: { value: 0 }, reducers: { increment: state => void state.value++ }, selectors: { selectValue: state => state.value }})export const { increment } = counterSlice.actionsdeclare module './reducer' { export interface LazyLoadedSlices extends WithSlice<typeof counterSlice> {}}const injectedCounterSlice = counterSlice.injectInto(rootReducer)export const { selectValue } = injectedCounterSlice.selectors// file: Counter.tsx// by importing from counterSlice we guarantee// the injection happens before this component is definedimport { increment, selectValue } from './counterSlice'import { useAppDispatch, useAppSelector } from './hooks'export default function Counter() { const dispatch = usAppDispatch() const value = useAppSelector(selectValue) return ( <> <p>{value}</p> <button onClick={() => dispatch(increment())}>Increment</button> </> )}// file: App.tsximport { Provider } from 'react-redux'import { store } from './store'// lazily importing the component means that the code// doesn't actually get pulled in and executed until the component is rendered.// this means that the inject call only happens once Counter rendersconst Counter = React.lazy(() => import('./Counter'))function App() { return ( <Provider store={store}> <Counter /> </Provider> )}createDynamicMiddleware​The createDynamicMiddleware utility creates a "meta-middleware" which allows for injection of middleware after store initialisation.import { createDynamicMiddleware, configureStore } from '@reduxjs/toolkit'import logger from 'redux-logger'import reducer from './reducer'const dynamicMiddleware = createDynamicMiddleware()const store = configureStore({ reducer, middleware: getDefaultMiddleware => getDefaultMiddleware().concat(dynamicMiddleware.middleware)})dynamicMiddleware.addMiddleware(logger)addMiddleware​addMiddleware appends the middleware instance to the chain of middlewares handled by the dynamic middleware instance. Middleware is applied in injection order, and stored by function reference (so the same middleware is only applied once regardless of how many times it's injected).noteIt's important to remember that all middlewares injected will be contained within the original dynamic middleware instance.import { createDynamicMiddleware, configureStore } from '@reduxjs/toolkit'import logger from 'redux-logger'import reducer from './reducer'const dynamicMiddleware = createDynamicMiddleware()const store = configureStore({ reducer, middleware: getDefaultMiddleware => getDefaultMiddleware().concat(dynamicMiddleware.middleware)})dynamicMiddleware.addMiddleware(logger)// middleware chain is now [thunk, logger]If it's desired to have more control over the order, multiple instances can be used.import { createDynamicMiddleware, configureStore } from '@reduxjs/toolkit'import logger from 'redux-logger'import reducer from './reducer'const beforeMiddleware = createDynamicMiddleware()const afterMiddleware = createDynamicMiddleware()const store = configureStore({ reducer, middleware: getDefaultMiddleware => getDefaultMiddleware() .prepend(beforeMiddleware.middleware) .concat(afterMiddleware.middleware)})beforeMiddleware.addMiddleware(logger)afterMiddleware.addMiddleware(logger)// middleware chain is now [logger, thunk, logger]withMiddleware​withMiddleware is an action creator which, when dispatched, causes the middleware to add any middlewares included and returns a pre-typed version of dispatch with any added extensions.const listenerDispatch = store.dispatch( withMiddleware(listenerMiddleware.middleware))const unsubscribe = listenerDispatch(addListener({ actionCreator, effect }))// ^? () => voidThis is mainly useful in a non-React context. With React it's more useful to use the react integration.React integration​When imported from the @reduxjs/toolkit/react entry point, the instance of dynamic middleware will have a couple of additional methods attached.createDispatchWithMiddlewareHook​This method calls addMiddleware and returns a version of useDispatch typed to know about the injected middleware.import { createDynamicMiddleware } from '@reduxjs/toolkit/react'const dynamicMiddleware'''
