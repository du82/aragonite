full_description = '''IntroductionLearning ResourcesOn this pageLearning ResourcesThe Redux docs are intended to teach the basic concepts of Redux, as well as explain key concepts for use in real-world applications. However, the docs can't cover everything. Happily, there are many other great resources available for learning Redux. We encourage you to check them out. Many of them cover topics that are beyond the scope of the docs, or describe the same topics in other ways that may work better for your learning style.This page includes our recommendations for some of the best external resources available to learn Redux. For an additional extensive list of tutorials, articles, and other resources on React, Redux, Javascript, and related topics, see the React/Redux Links list.Basic Introductions​Tutorials that teach the basic concepts of Redux and how to use itIntro to React, Redux, and TypeScript https://blog.isquaredsoftware.com/2020/12/presentations-react-redux-ts-intro/ Redux maintainer Mark Erikson's slideset that covers the basics of React, Redux, and TypeScript. Redux topics include stores, reducers, middleware, React-Redux, and Redux Toolkit.Learn Modern Redux - Redux Toolkit, React-Redux Hooks, and RTK Query https://www.learnwithjason.dev/let-s-learn-modern-redux An episode of the "Learn with Jason" show, with Redux maintainer Mark Erikson as guest. The episode features a live-coded app, and shows how to create a new React+TS project, add the Redux packages, and set up Redux Toolkit and React-Redux from scratch (including our recommended TS hooks configuration). It also shows how to use the upcoming RTK Query data fetching API and display that data in a UI.Redux Tutorial: An Overview and Walkthrough https://www.taniarascia.com/redux-react-guide/ A well-written tutorial from Tania Rascia that quickly explains key Redux concepts, and shows how to put together a basic Redux + React app using vanilla Redux and Redux Toolkit.Redux for Beginners - The Brain-Friendly Guide to Learning Redux https://www.freecodecamp.org/news/redux-for-beginners-the-brain-friendly-guide-to-redux/ An easy-to-follow tutorial that builds a small todo app with Redux Toolkit and React-Redux, including data fetching.Redux made easy with Redux Toolkit and TypeScript https://www.mattbutton.com/redux-made-easy-with-redux-toolkit-and-typescript/ A helpful tutorial that shows how to use Redux Toolkit and TypeScript together to write Redux applications, and how RTK simplifies typical Redux usage.Redux: From Twitter Hype to Production https://slides.com/jenyaterpil/redux-from-twitter-hype-to-production#/ A well-produced slideshow that visually steps through core Redux concepts, usage with React, project organization, and side effects with thunks and sagas. Has some good animated diagrams demonstrating how data flows through a React+Redux architecture.Using Redux With React​Explanations of the React-Redux bindings libraryModernizing a Legacy Redux Application with React-Redux Hooks https://app.egghead.io/playlists/modernizing-a-legacy-redux-application-with-react-hooks-c528 A video series that shows the differences between the earlier connect API and the newer React-Redux hooks API, and how to use those hooks in your components.Why Redux is Useful in React Apps https://www.fullstackreact.com/articles/redux-with-mark-erikson/ An explanation of some of the benefits of using Redux with React, including sharing data between components and hot module reloading.Project-Based Tutorials​Tutorials that teach Redux concepts by building projects, including larger "real-world"-type applicationsPractical Redux https://blog.isquaredsoftware.com/2016/10/practical-redux-part-0-introduction/ https://blog.isquaredsoftware.com/series/practical-redux/ An ongoing series of posts intended to demonstrate a number of specific Redux techniques by building a sample application, based on the MekHQ application for managing Battletech campaigns. Written by Redux co-maintainer Mark Erikson. Covers topics like managing relational data, connecting multiple components and lists, complex reducer logic for features, handling forms, showing modal dialogs, and much more. (Note: this is an older series, and today we recommend newer patterns for writing Redux code. However, many of the principles in this series are still valuable.)Redux Implementation​Explanations of how Redux works internally, by writing miniature reimplementationsGetting Started with Redux - Video Series https://egghead.io/courses/fundamentals-of-redux-course-from-dan-abramov-bd5cc867 https://github.com/tayiorbeii/egghead.io_redux_course_notes Dan Abramov, the creator of Redux, demonstrates various concepts in 30 short (2-5 minute) videos. The linked Github repo contains notes and transcriptions of the videos.Building React Applications with Idiomatic Redux - Video Series https://egghead.io/courses/building-react-applications-with-idiomatic-redux https://github.com/tayiorbeii/egghead.io_idiomatic_redux_course_notes Dan Abramov's second video tutorial series, continuing directly after the first. Includes lessons on store initial state, using Redux with React Router, using "selector" functions, normalizing state, use of Redux middleware, async action creators, and more. The linked Github repo contains notes and transcriptions of the videos.Live React: Hot Reloading and Time Travel https://youtube.com/watch?v=xsSnOQynTHs Dan Abramov's original conference talk that introduced Redux. See how constraints enforced by Redux make hot reloading with time travel easyBuild Yourself a Redux https://zapier.com/engineering/how-to-build-redux/ An excellent in-depth "build a mini-Redux" article, which covers not only Redux's core, but also connect and middleware as well.Connect.js explained https://gist.github.com/gaearon/1d19088790e70ac32ea636c025ba424e A very simplified version of React Redux's connect() function that illustrates the basic implementationLet's Write Redux! https://www.jamasoftware.com/blog/lets-write-redux/ Walks through writing a miniature version of Redux step-by-step, to help explain the concepts and implementation.Reducers​Articles discussing ways to write reducer functionsTaking Advantage of combineReducers https://randycoulman.com/blog/2016/11/22/taking-advantage-of-combinereducers/ Examples of using combineReducers multiple times to produce a state tree, and some thoughts on tradeoffs in various approaches to reducer logic.The Power of Higher-Order Reducers https://slides.com/omnidan/hor#/ A slideshow from the author of redux-undo and other libraries, explaining the concept of higher-order reducers and how they can be usedReducer composition with Higher Order Reducers https://medium.com/@mange_vibration/reducer-composition-with-higher-order-reducers-35c3977ed08f Some great examples of writing small functions that can be composed together to perform larger specific reducer tasks, such as providing initial state, filtering, updating specific keys, and more.Higher Order Reducers - It just sounds scary https://medium.com/@danielkagan/high-order-reducers-it-just-sounds-scary-2b9e5dbfc705 Explains how reducers can be composed like Lego bricks to create reusable and testable reducer logic.Selectors​Explanations of how and why to use selector functions to read values from stateIdiomatic Redux: Using Reselect Selectors for Encapsulation and Performance https://blog.isquaredsoftware.com/2017/12/idiomatic-redux-using-reselect-selectors/ A complete guide to why you should use selector functions with Redux, how to use the Reselect library to write optimized selectors, and advanced tips for improving performance.ReactCasts #8: Selectors in Redux https://www.youtube.com/watch?v=frT3to2ACCw A great overview of why and how to use selector functions to retrieve data from the store, and derive additional data from store valuesOptimizing React Redux Application Development with Reselect https://codebrahma.com/reselect-tutorial-optimizing-react-redux-application-development-with-reselect/ A good tutorial on Reselect. Covers the concept of "selector functions", how to use Reselect's API, and how to use memoized selectors to improve performance.Usage of Reselect in a React-Redux Application https://dashbouquet.com/blog/frontend-development/usage-of-reselect-in-a-react-redux-application Discusses the importance of memoized selectors for performance, and good practices for using Reselect.React, Reselect, and Redux https://medium.com/@parkerdan/react-reselect-and-redux-b34017f8194c An explanation of how Reselect's memoized selector functions are useful in Redux apps, and how to create unique selector instances for each component instance.Normalization​How to structure the Redux store like a database for best performanceQuerying a Redux Store https://medium.com/@adamrackis/querying-a-redux-store-37db8c7f3b0f A look at best practices for organizing and storing data in Redux, including normalizing data and use of selector functions.Normalizing Redux Stores for Maximum Code Reuse https://medium.com/@adamrackis/normalizing-redux-stores-for-maximum-code-reuse-ae6e3844ae95 Thoughts on how normalized Redux stores enable some useful data handling approaches, with examples of using selector functions to denormalize hierarchical data.Advanced Redux Entity Normalization https://medium.com/@dcousineau/advanced-redux-entity-normalization-f5f1fe2aefc5 Describes a "keyWindow" concept for tracking subsets of entities in state, similar to an SQL "view". A useful extension to the idea of normalized data.Middleware​Explanations and examples of how middleware work and how to write themExploring Redux Middlewares https://blog.krawaller.se/posts/exploring-redux-middleware/ Understanding middlewares through a series of small experimentsRedux Middleware Tutorial https://github.com/pshrmn/notes/blob/master/redux/redux-middleware.md An overview of what middleware is, how applyMiddleware works, and how to write middleware.ReactCasts #6: Redux Middleware https://www.youtube.com/watch?v=T-qtHI1qHIg A screencast that describes how middleware fit into Redux, their uses, and how to implement a custom middlewareA Beginner's Guide to Redux Middleware https://www.codementor.io/reactjs/tutorial/beginner-s-guide-to-redux-middleware A useful explanation of middleware use cases, with numerous examplesFunctional Composition in Javascript https://joecortopassi.com/articles/functional-composition-in-javascript/ Breaking down how the compose function worksSide Effects - Basics​Introductions to handling async behavior in ReduxStack Overflow: Dispatching Redux Actions with a Timeout https://stackoverflow.com/questions/35411423/how-to-dispatch-a-redux-action-with-a-timeout/35415559#35415559 Dan Abramov explains the basics of managing async behavior in Redux, walking through a progressive series of approaches (inline async calls, async action creators, thunk middleware).Stack Overflow: Why do we need middleware for async flow in Redux? https://stackoverflow.com/questions/34570758/why-do-we-need-middleware-for-async-flow-in-redux/34599594#34599594 Dan Abramov gives reasons for using thunks and async middleware, and some useful patterns for using thunks.What the heck is a "thunk"? https://daveceddia.com/what-is-a-thunk/ A quick explanation for what the word "thunk" means in general, and for Redux specifically.Thunks in Redux: The Basics https://medium.com/fullstack-academy/thunks-in-redux-the-basics-85e538a3fe60 A detailed look at what thunks are, what they solve, and how to use them.Side Effects - Advanced​Advanced tools and techniques for managing async behaviorWhat is the right way to do asynchronous operations in Redux? https://decembersoft.com/posts/what-is-the-right-way-to-do-asynchronous-operations-in-redux/ An excellent look at the most popular libraries for Redux side effects, with comparisons of how each one works.Redux 4 Ways https://medium.com/react-native-training/redux-4-ways-95a130da0cdc Side-by-side comparisons of implementing some basic data fetching using thunks, sagas, observables, and a promise middlewareIdiomatic Redux: Thoughts on Thunks, Sagas, Abstractions, and Reusability https://blog.isquaredsoftware.com/2017/01/idiomatic-redux-thoughts-on-thunks-sagas-abstraction-and-reusability/ A response to several "thunks are bad" concerns, arguing that thunks (and sagas) are still a valid approach for managing complex sync logic and async side effects.Javascript Power Tools: Redux-Saga https://formidable.com/blog/2017/javascript-power-tools-redux-saga/ https://formidable.com/blog/2017/composition-patterns-in-redux-saga/ https://formidable.com/blog/2017/real-world-redux-saga-patterns/ A fantastic series that teaches the concepts, implementation, and benefits behind Redux-Saga, including how ES6 generators are used to control function flow, how sagas can be composed together to accomplish concurrency, and practical use cases for sagas.Exploring Redux Sagas https://medium.com/onfido-tech/exploring-redux-sagas-cc1fca2015ee An excellent article that explores how to use sagas to provide a glue layer to implement decoupled business logic in a Redux application.Taming Redux with Sagas https://objectpartners.com/2017/11/20/taming-redux-with-sagas/ A good overview of Redux-Saga, including info on generator functions, use cases for sagas, using sagas to deal with promises, and testing sagas.Reactive Redux State with RxJS https://ivanjov.com/reactive-redux-state-with-rxjs/ Describes the concept of "Reactive Programming" and the RxJS library, and shows how to use redux-observable to fetch data, along with examples of testing.Using redux-observable to handle asynchronous logic in Redux https://medium.com/dailyjs/using-redux-observable-to-handle-asynchronous-logic-in-redux-d49194742522 An extended post that compares a thunk-based implementation of handling a line-drawing example vs an observable-based implementation.Thinking in Redux​Deeper looks at how Redux is meant to be used, and why it works the way it doesWhen (and when not) to reach for Redux https://changelog.com/posts/when-and-when-not-to-reach-for-redux Redux maintainer Mark Erikson describes the problems Redux was created to solve, and how it compares to other commonly used tools.You Might Not Need Redux https://medium.com/@dan_abramov/you-might-not-need-redux-be46360cf367 Dan Abramov discusses the tradeoffs involved in using Redux.Idiomatic Redux: The Tao of Redux, Part 1 - Implementation and Intent https://blog.isquaredsoftware.com/2017/05/idiomatic-redux-tao-of-redux-part-1/ A deep dive into how Redux actually works, the constraints it asks you to follow, and the intent behind its design and usage.Idiomatic Redux: The Tao of Redux, Part 2 - Practice and Philosophy https://blog.isquaredsoftware.com/2017/05/idiomatic-redux-tao-of-redux-part-2/ A follow-up look at why common Redux usage patterns exist, other ways that Redux can be used, and thoughts on the pros and cons of those different patterns and approaches.What's So Great About Redux? '''
