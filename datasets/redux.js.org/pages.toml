title = "Migrating to RTK 2.0 and Redux 5.0 | Redux"
full_description = '''Using ReduxMigrationsMigrating to RTK 2.0 and Redux 5.0On this pageMigrating to RTK 2.0 and Redux 5.0What You'll LearnWhat's changed in Redux Toolkit 2.0, Redux core 5.0, Reselect 5.0, and Redux Thunk 3.0, including breaking changes and new featuresIntroduction​Redux Toolkit has been available since 2019, and today it's the standard way to write Redux apps. We've gone 4+ years without any breaking changes. Now, RTK 2.0 gives us a chance to modernize the packaging, clean up deprecated options, and tighten up some edge cases.Redux Toolkit 2.0 is accompanied by major versions of all the other Redux packages: Redux core 5.0, React-Redux 9.0, Reselect 5.0, and Redux Thunk 3.0.This page lists known potentially breaking changes in each of those packages, as well as new features in Redux Toolkit 2.0. As a reminder, you should not need to actually install or use the core redux package directly - RTK wraps that, and re-exports all methods and types.In practice, most of the "breaking" changes should not have an actual effect on end users, and we expect that many projects can just update the package versions with very few code changes needed.The changes most likely to need app code updates are:Object syntax removed for createReducer and createSlice.extraReducersconfigureStore.middleware must be a callbackMiddleware type changed - Middleware action and next are typed as unknownPackaging Changes (all)​We've made updates to the build packaging for all of the Redux-related libraries. These are technically "breaking", but should be transparent to end users, and actually enable better support for scenarios such as using Redux via ESM files under Node.Addition of exports field in package.json​We've migrated the package definitions to include the exports field for defining which artifacts to load, with a modern ESM build as the primary artifact (with CJS still included for compatibility purposes).We've done local testing of the package, but we ask the community to try out this in your own projects and report any breakages you find!Build Artifact Modernization​We've updated the build output in several ways:Build output is no longer transpiled! Instead we target modern JS syntax (ES2020)Moved all build artifacts to live under ./dist/, instead of separate top-level foldersThe lowest Typescript version we test against is now TS 4.7.Dropping UMD builds​Redux has always shipped with UMD build artifacts. These are primarily meant for direct import as script tags, such as in a CodePen or a no-bundler build environment.For now, we're dropping those build artifacts from the published package, on the grounds that the use cases seem pretty rare today.We do have a browser-ready ESM build artifact included at dist/$PACKAGE_NAME.browser.mjs, which can be loaded via a script tag that points to that file on Unpkg.If you have strong use cases for us continuing to include UMD build artifacts, please let us know!Breaking Changes​Core​Action types must be strings​We've always specifically told our users that actions and state must be serializable, and that action.type should be a string. This is both to ensure that actions are serializable, and to help provide a readable action history in the Redux DevTools.store.dispatch(action) now specifically enforces that action.type must be a string and will throw an error if not, in the same way it throws an error if the action is not a plain object.In practice, this was already true 99.99% of the time and shouldn't have any effect on users (especially those using Redux Toolkit and createSlice), but there may be some legacy Redux codebases that opted to use Symbols as action types.createStore Deprecation​In Redux 4.2.0, we marked the original createStore method as @deprecated. Strictly speaking, this is not a breaking change, nor is it new in 5.0, but we're documenting it here for completeness.This deprecation is solely a visual indicator that is meant to encourage users to migrate their apps from legacy Redux patterns to use the modern Redux Toolkit APIs.The deprecation results in a visual strikethrough when imported and used, like createStore, but with no runtime errors or warnings.createStore will continue to work indefinitely, and will not ever be removed. But, today we want all Redux users to be using Redux Toolkit for all of their Redux logic.To fix this, there are three options:Follow our strong suggestion to switch over to Redux Toolkit and configureStoreDo nothing. It's just a visual strikethrough, and it doesn't affect how your code behaves. Ignore it.Switch to using the legacy_createStore API that is now exported, which is the exact same function but with no @deprecated tag. The simplest option is to do an aliased import rename, like import { legacy_createStore as createStore } from 'redux'Typescript rewrite​In 2019, we began a community-powered conversion of the Redux codebase to TypeScript. The original effort was discussed in #3500: Port to TypeScript, and the work was integrated in PR #3536: Convert to TypeScript.However, the TS-converted code sat around in the repo for several years, unused and unpublished, due to concerns about possible compatibility issues with the existing ecosystem (as well as general inertia on our part).Redux core v5 is now built from that TS-converted source code. In theory, this should be almost identical in both runtime behavior and types to the 4.x build, but it's very likely that some of the changes may cause types issues.Please report any unexpected compatibility issues on Github!AnyAction deprecated in favour of UnknownAction​The Redux TS types have always exported an AnyAction type, which is defined to have {type: string} and treat any other field as any. This makes it easy to write uses like console.log(action.whatever), but unfortunately does not provide any meaningful type safety.We now export an UnknownAction type, which treats all fields other than action.type as unknown. This encourages users to write type guards that check the action object and assert its specific TS type. Inside of those checks, you can access a field with better type safety.UnknownAction is now the default any place in the Redux source that expects an action object.AnyAction still exists for compatibility, but has been marked as deprecated.Note that Redux Toolkit's action creators have a .match() method that acts as a useful type guard:if (todoAdded.match(someUnknownAction)) { // action is now typed as a PayloadAction<Todo>}You can also use the new isAction util to check if an unknown value is some kind of action object.Middleware type changed - Middleware action and next are typed as unknown​Previously, the next parameter is typed as the D type parameter passed, and action is typed as the Action extracted from the dispatch type. Neither of these are a safe assumption:next would be typed to have all of the dispatch extensions, including the ones earlier in the chain that would no longer apply.Technically it would be mostly safe to type next as the default Dispatch implemented by the base redux store, however this would cause next(action) to error (as we cannot promise action is actually an Action) - and it wouldn't account for any following middlewares that return anything other than the action they're given when they see a specific action.action is not necessarily a known action, it can be literally anything - for example a thunk would be a function with no .type property (so AnyAction would be inaccurate)We've changed next to be (action: unknown) => unknown (which is accurate, we have no idea what next expects or will return), and changed the action parameter to be unknown (which as above, is accurate).In order to safely interact with values or access fields inside of the action argument, you must first do a type guard check to narrow the type, such as isAction(action) or someActionCreator.match(action).This new type is incompatible with the v4 Middleware type, so if a package's middleware is saying it's incompatible, check which version of Redux it's getting its types from! (See overriding dependencies later in this page.)PreloadedState type removed in favour of Reducer generic​We've made tweaks to the TS types to improve type safety and behavior.First, the Reducer type now has a PreloadedState possible generic:type Reducer<S, A extends Action, PreloadedState = S> = ( state: S | PreloadedState | undefined, action: A) => SPer the explanation in #4491:Why the need for this change? When the store is first created by createStore/configureStore, the initial state is set to whatever is passed as the preloadedState argument (or undefined if nothing is passed). That means that the first time that the reducer is called, it is called with the preloadedState. After the first call, the reducer is always passed the current state (which is S).For most normal reducers, S | undefined accurately describes what can be passed in for the preloadedState. However the combineReducers function allows for a preloaded state of Partial<S> | undefined.The solution is to have a separate generic that represents what the reducer accepts for its preloaded state. That way createStore can then use that generic for its preloadedState argument.Previously, this was handled by a $CombinedState type, but that complicated things and led to some user-reported issues. This removes the need for $CombinedState altogether.This change does include some breaking changes, but overall should not have a huge impact on users upgrading in user-land:The Reducer, ReducersMapObject, and createStore/configureStore types/function take an additional PreloadedState generic which defaults to S.The overloads for combineReducers are removed in favor of a single function definition that takes the ReducersMapObject as its generic parameter. Removing the overloads was necessary with these changes, since sometimes it was choosing the wrong overload.Enhancers that explicitly list the generics for the reducer will need to add the third generic.Toolkit only​Object syntax for createSlice.extraReducers and createReducer removed​RTK's createReducer API was originally designed to accept a lookup table of action type strings to case reducers, like { "ADD_TODO": (state, action) => {} }. We later added the "builder callback" form to allow more flexibility in adding "matchers" and a default handler, and did the same for createSlice.extraReducers.We have removed the "object" form for both createReducer and createSlice.extraReducers in RTK 2.0, as the builder callback form is effectively the same number of lines of code, and works much better with TypeScript.As an example, this:const todoAdded = createAction('todos/todoAdded')createReducer(initialState, { [todoAdded]: (state, action) => {}})createSlice({ name, initialState, reducers: { /* case reducers here */ }, extraReducers: { [todoAdded]: (state, action) => {} }})should be migrated to:createReducer(initialState, builder => { builder.addCase(todoAdded, (state, action) => {})})createSlice({ name, initialState, reducers: { /* case reducers here */ }, extraReducers: builder => { builder.addCase(todoAdded, (state, action) => {}) }})Codemods​To simplify upgrading codebases, we've published a set of codemods that will automatically transform the deprecated "object" syntax into the equivalent "builder" syntax.The codemods package is available on NPM as @reduxjs/rtk-codemods. More details are available here.To run the codemods against your codebase, run npx @reduxjs/rtk-codemods <TRANSFORM NAME> path/of/files/ or/some**/*glob.js.Examples:npx @reduxjs/rtk-codemods createReducerBuilder ./srcnpx @reduxjs/rtk-codemods createSliceBuilder ./packages/my-app/**/*.tsWe also recommend re-running Prettier on the codebase before committing the changes.These codemods should work, but we would greatly appreciate feedback from more real-world codebases!configureStore.middleware must be a callback​Since the beginning, configureStore has accepted a direct array value as the middleware option. However, providing an array directly prevents configureStore from calling getDefaultMiddleware(). So, middleware: [myMiddleware] means there is no thunk middleware added (or any of the dev-mode checks).This is a footgun, and we've had numerous users accidentally do this and cause their apps to fail because the default middleware never got configured.As a result, we've now made the middleware only accept the callback form. If for some reason you still want to replace all of the built-in middleware, do so by returning an array from the callback:const store = configureStore({ reducer, middleware: getDefaultMiddleware => { // WARNING: this means that _none_ of the default middleware are added! return [myMiddleware] // or for TS users, use: // return new Tuple(myMiddleware) }})But note that we consistently recommend not replacing the default middleware entirely, and that you should use return getDefaultMiddleware().concat(myMiddleware).configureStore.enhancers must be a callback​Similarly to configureStore.middleware, the enhancers field must also be a callback, for the same reasons.The callback will receive a getDefaultEnhancers function that can be used to customise the batching enhancer that's now included by default.For example:const store = configureStore({ reducer, enhancers: getDefaultEnhancers => { return getDefaultEnhancers({ autoBatch: { type: 'tick' } }).concat(myEnhancer) }})It's important to note that the result of getDefaultEnhancers will also contain the middleware enhancer created with any configured/default middleware. To help prevent mistakes, configureStore will log an error to console if middleware was provided and the middleware enhancer wasn't included in the callback result.const store = configureStore({ reducer, enhancers: getDefaultEnhancers => { return [myEnhancer] // we've lost the middleware here // instead: return getDefaultEnhancers().concat(myEnhancer) }})Standalone getDefaultMiddleware and getType removed​The standalone version of getDefaultMiddleware has been deprecated since v1.6.1, and has now been removed. Use the function passed to the middleware callback instead, which has the correct types.We have also removed the getType export, which was used to extract a type string from action creators made with createAction. Instead, use the static property actionCreator.type.RTK Query behaviour changes​We've had a number of reports where RTK Query had issues around usage of dispatch(endpoint.initiate(arg, {subscription: false})). There were also reports that multiple triggered lazy queries were resolving the promises at the wrong time. Both of these had the same underlying issue, which was that RTKQ wasn't tracking cache entries in these cases (intentionally). We've reworked the logic to always track cache entries (and remove them as needed), which should resolve those behavior issues.We also have had issues raised about trying to run multiple mutations in a row and how tag invalidation behaves. RTKQ now has internal logic t'''
