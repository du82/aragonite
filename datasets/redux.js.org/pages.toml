title = "Writing Tests | Redux"
description = "Usage > Writing Tests: recommended practices and setup for testing Redux apps"
full_description = "Using ReduxCode QualityWriting TestsOn this pageWriting TestsWhat You'll LearnRecommended practices for testing apps using ReduxExamples of test configuration and setupGuiding Principles​The guiding principles for testing Redux logic closely follow that of React Testing Library:The more your tests resemble the way your software is used, the more confidence they can give you. - Kent C. DoddsBecause most of the Redux code you write are functions, and many of them are pure, they are easy to test without mocking. However, you should consider whether each piece of your Redux code needs its own dedicated tests. In the majority of scenarios, the end-user does not know, and does not care whether Redux is used within the application at all. As such, the Redux code can be treated as an implementation detail of the app, without requiring explicit tests for the Redux code in many circumstances.Our general advice for testing an app using Redux is:Prefer writing integration tests with everything working together. For a React app using Redux, render a <Provider> with a real store instance wrapping the components being tested. Interactions with the page being tested should use real Redux logic, with API calls mocked out so app code doesn't have to change, and assert that the UI is updated appropriately.If needed, use basic unit tests for pure functions such as particularly complex reducers or selectors. However, in many cases, these are just implementation details that are covered by integration tests instead.Do not try to mock selector functions or the React-Redux hooks! Mocking imports from libraries is fragile, and doesn't give you confidence that your actual app code is working.infoFor background on why we recommend integration-style tests, see:Kent C Dodds: Testing Implementation Details: thoughts on why he recommends avoiding testing implementation details.Mark Erikson: Blogged Answers: The Evolution of Redux Testing Approaches: thoughts on how Redux testing has evolved from 'isolation' to 'integration' over time.Setting Up a Test Environment​Test Runners​Redux can be tested with any test runner, since it's just plain JavaScript. One common option is Jest, a widely used test runner that comes with Create-React-App, and is used by the Redux library repos. If you're using Vite to build your project, you may be using Vitest as your test runner.Typically, your test runner needs to be configured to compile JavaScript/TypeScript syntax. If you're going to be testing UI components, you will likely need to configure the test runner to use JSDOM to provide a mock DOM environment.The examples in this page will assume you're using Jest, but the same patterns apply no matter what test runner you're using.See these resources for typical test runner configuration instructions:Jest:Jest: Getting StartedJest: Configuration - Test EnvironmentVitestVitest: Getting StartedVitest: Configuration - Test EnvironmentUI and Network Testing Tools​The Redux team recommends using React Testing Library (RTL) to test React components that connect to Redux. React Testing Library is a simple and complete React DOM testing utility that encourages good testing practices. It uses ReactDOM's render function and act from react-dom/tests-utils. (The Testing Library family of tools also includes adapters for many other popular frameworks as well.)We also recommend using Mock Service Worker (MSW) to mock network requests, as this means your application logic does not need to be changed or mocked when writing tests.DOM/React Testing LibraryDOM Testing Library: SetupReact Testing Library: SetupTesting Library Jest-DOM MatchersMock Service WorkerMSW: InstallationMSW: Setting up mock requestsMSW: Mock server configuration for NodeIntegration Testing Connected Components and Redux Logic​Our recommendation for testing Redux-connected React components is via integration tests that include everything working together, with assertions aimed at verifying that the app behaves the way you expect when the user interacts with it in a given manner.Example App Code​Consider the following userSlice slice, store, and App component:TypeScriptJavaScriptfeatures/users/usersSlice.tsimport { createSlice, createAsyncThunk } from '@reduxjs/toolkit'import { userAPI } from './userAPI'import type { RootState } from '../../app/store'export const fetchUser = createAsyncThunk('user/fetchUser', async () => { const response = await userAPI.fetchUser() return response.data})interface UserState { name: string status: 'idle' | 'loading' | 'complete'}const initialState: UserState = { name: 'No user', status: 'idle'}const userSlice = createSlice({ name: 'user', initialState, reducers: {}, extraReducers: builder => { builder.addCase(fetchUser.pending, (state, action) => { state.status = 'loading' }) builder.addCase(fetchUser.fulfilled, (state, action) => { state.status = 'complete' state.name = action.payload }) }})export const selectUserName = (state: RootState) => state.user.nameexport const selectUserFetchStatus = (state: RootState) => state.user.statusexport default userSlice.reducerfeatures/users/usersSlice.jsimport { createSlice, createAsyncThunk } from '@reduxjs/toolkit'import { userAPI } from './userAPI'export const fetchUser = createAsyncThunk('user/fetchUser', async () => { const response = await userAPI.fetchUser() return response.data})const initialState = { name: 'No user', status: 'idle'}const userSlice = createSlice({ name: 'user', initialState, reducers: {}, extraReducers: builder => { builder.addCase(fetchUser.pending, (state, action) => { state.status = 'loading' }) builder.addCase(fetchUser.fulfilled, (state, action) => { state.status = 'complete' state.name = action.payload }) }})export const selectUserName = state => state.user.nameexport const selectUserFetchStatus = state => state.user.statusexport default userSlice.reducerTypeScriptJavaScriptapp/store.tsimport { combineReducers, configureStore } from '@reduxjs/toolkit'import userReducer from '../features/users/userSlice'// Create the root reducer independently to obtain the RootState typeconst rootReducer = combineReducers({ user: userReducer})export function setupStore(preloadedState?: Partial<RootState>) { return configureStore({ reducer: rootReducer, preloadedState })}export type RootState = ReturnType<typeof rootReducer>export type AppStore = ReturnType<typeof setupStore>export type AppDispatch = AppStore['dispatch']app/store.jsimport { combineReducers, configureStore } from '@reduxjs/toolkit'import userReducer from '../features/users/userSlice'// Create the root reducer independently to obtain the RootState typeconst rootReducer = combineReducers({ user: userReducer})export function setupStore(preloadedState) { return configureStore({ reducer: rootReducer, preloadedState })}TypeScriptJavaScriptapp/hooks.tsimport { useDispatch, useSelector } from 'react-redux'import type { AppDispatch, RootState } from './store'// Use throughout your app instead of plain `useDispatch` and `useSelector`export const useAppDispatch = useDispatch.withTypes<AppDispatch>()export const useAppSelector = useSelector.withTypes<RootState>()app/hooks.jsimport { useDispatch, useSelector } from 'react-redux'// Use throughout your app instead of plain `useDispatch` and `useSelector`export const useAppDispatch = useDispatch.withTypes()export const useAppSelector = useSelector.withTypes()TypeScriptJavaScriptfeatures/users/UserDisplay.tsximport React from 'react'import { useAppDispatch, useAppSelector } from '../../app/hooks'import { fetchUser, selectUserName, selectUserFetchStatus } from './userSlice'export default function UserDisplay() { const dispatch = useAppDispatch() const userName = useAppSelector(selectUserName) const userFetchStatus = useAppSelector(selectUserFetchStatus) return ( <div> {/* Display the current user name */} <div>{userName}</div> {/* On button click, dispatch a thunk action to fetch a user */} <button onClick={() => dispatch(fetchUser())}>Fetch user</button> {/* At any point if we're fetching a user, display that on the UI */} {userFetchStatus === 'loading' && <div>Fetching user...</div>} </div> )}features/users/UserDisplay.jsximport React from 'react'import { useAppDispatch, useAppSelector } from '../../app/hooks'import { fetchUser, selectUserName, selectUserFetchStatus } from './userSlice'export default function UserDisplay() { const dispatch = useAppDispatch() const userName = useAppSelector(selectUserName) const userFetchStatus = useAppSelector(selectUserFetchStatus) return ( <div> {/* Display the current user name */} <div>{userName}</div> {/* On button click, dispatch a thunk action to fetch a user */} <button onClick={() => dispatch(fetchUser())}>Fetch user</button> {/* At any point if we're fetching a user, display that on the UI */} {userFetchStatus === 'loading' && <div>Fetching user...</div>} </div> )}This app involves thunks, reducers and selectors. All of these can be tested by writing an integration test with the following in mind:Upon first loading the app, there should be no user yet - we should see 'No user' on the screen.After clicking the button that says 'Fetch user', we expect it to start fetching the user. We should see 'Fetching user...' displayed on the screen.After some time, the user should be received. We should no longer see 'Fetching user...', but instead should see the expected user's name based on the response from our API.Writing our tests to focus on the above as a whole, we can avoid mocking as much of the app as possible. We will also have confidence that the critical behavior of our app does what we expect it to when interacted with in the way we expect the user to use the app.To test the component, we render it into the DOM, and assert that the app responds to interactions in the way we expect the user to use the app.Setting Up a Reusable Test Render Function​React Testing Library's render function accepts a tree of React elements and renders those components. Just like in a real app, any Redux-connected components will need a React-Redux <Provider> component wrapped around them, with a real Redux store set up and provided.Additionally, the test code should create a separate Redux store instance for every test, rather than reusing the same store instance and resetting its state. That ensures no values accidentally leak between tests.Instead of copy-pasting the same store creation and Provider setup in every test, we can use the wrapper option in the render function and export our own customized renderWithProviders function that creates a new Redux store and renders a <Provider>, as explained in React Testing Library's setup docs.The custom render function should let us:Create a new Redux store instance every time it's called, with an optional preloadedState value that can be used for an initial valueAlternately pass in an already-created Redux store instancePass through additional options to RTL's original render functionAutomatically wrap the component being tested with a <Provider store={store}>Return the store instance in case the test needs to dispatch more actions or check stateA typical custom render function setup could look like this:TypeScriptJavaScriptutils/test-utils.tsximport React, { PropsWithChildren } from 'react'import { render } from '@testing-library/react'import type { RenderOptions } from '@testing-library/react'import { configureStore } from '@reduxjs/toolkit'import { Provider } from 'react-redux'import type { AppStore, RootState } from '../app/store'import { setupStore } from '../app/store'// As a basic setup, import your same slice reducersimport userReducer from '../features/users/userSlice'// This type interface extends the default options for render from RTL, as well// as allows the user to specify other things such as initialState, store.interface ExtendedRenderOptions extends Omit<RenderOptions, 'queries'> { preloadedState?: Partial<RootState> store?: AppStore}export function renderWithProviders( ui: React.ReactElement, extendedRenderOptions: ExtendedRenderOptions = {}) { const { preloadedState = {}, // Automatically create a store instance if no store was passed in store = setupStore(preloadedState), ...renderOptions } = extendedRenderOptions const Wrapper = ({ children }: PropsWithChildren) => ( <Provider store={store}>{children}</Provider> ) // Return an object with the store and all of RTL's query functions return { store, ...render(ui, { wrapper: Wrapper, ...renderOptions }) }}utils/test-utils.jsximport React from 'react'import { render } from '@testing-library/react'import { Provider } from 'react-redux'import { setupStore } from '../app/store'export function renderWithProviders(ui, extendedRenderOptions = {}) { const { preloadedState = {}, // Automatically create a store instance if no store was passed in store = setupStore(preloadedState), ...renderOptions } = extendedRenderOptions const Wrapper = ({ children }) => ( <Provider store={store}>{children}</Provider> ) // Return an object with the store and all of RTL's query functions return { store, ...render(ui, { wrapper: Wrapper, ...renderOptions }) }}In this example, we're directly importing the same slice reducers that the real app uses to create the store. It may be helpful to create a reusable setupStore function that does the actual store creation with the right options and configuration, and use that in the custom render function instead.TypeScriptJavaScriptapp/store.tsimport { combineReducers, configureStore } from '@reduxjs/toolkit'import userReducer from '../features/users/userSlice'// Create the root reducer separately so we can extract the RootState typeconst rootReducer = combineReducers({ user: userReducer})export const setupStore = (preloadedState?: Partial<RootState>) => { return configureStore({ reducer: rootReducer, preloadedState })}export type RootState = ReturnType<typeof rootReducer>export type AppStore = ReturnType<typeof setupStore>export type AppDispatch = AppStore['dispatch']app/store.jsimport { combineReducers, configureStore } from '@reduxjs/toolkit'import userReducer from '../features/users/userSlice'// Create the root reducer separately so we can extract the RootState typeconst rootReducer = combineReducers({ user: userReducer})export const setupStore = preloadedState => { return configureStore({ reducer: rootReducer, preloadedState })}Then, use setupStore in the test utils file instead of calling configureStore again:TypeScriptJavaScriptimport React, { PropsWithChildren } from 'react'import { render } from '@testing-library/react'import type { RenderOptions } from '@testing-library/react'import { Provider } from 'react-redux'import { setupStore } from '../app/store'import type { AppStore, RootState } from '../app/store'// This type interface extends the default options for render from RTL, as well// as allows the user to specify other things such as initialState, store.interface ExtendedRenderOptions extends Omit<RenderOptions, 'queries'> { preloadedState?: Partial<RootState> st"
