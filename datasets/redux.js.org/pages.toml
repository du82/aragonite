["https://redux.js.org/usage/writing-logic-thunks"]
title = "Writing Logic with Thunks | Redux"
description = "Usage > Redux Logic > Thunks: writing logic that interacts with the store"
full_description = '''Using ReduxRedux Logic and PatternsWriting Logic with ThunksOn this pageWriting Logic with ThunksWhat You'll LearnWhat "thunks" are, and why they're used for writing Redux logicHow the thunk middleware worksTechniques for writing sync and async logic in thunksCommon thunk usage patternsThunk Overview​What is a "thunk"?​The word "thunk" is a programming term that means "a piece of code that does some delayed work". Rather than execute some logic now, we can write a function body or code that can be used to perform the work later.For Redux specifically, "thunks" are a pattern of writing functions with logic inside that can interact with a Redux store's dispatch and getState methods.Using thunks requires the redux-thunk middleware to be added to the Redux store as part of its configuration.Thunks are a standard approach for writing async logic in Redux apps, and are commonly used for data fetching. However, they can be used for a variety of tasks, and can contain both synchronous and asynchronous logic.Writing Thunks​A thunk function is a function that accepts two arguments: the Redux store dispatch method, and the Redux store getState method. Thunk functions are not directly called by application code. Instead, they are passed to store.dispatch():Dispatching thunk functionsconst thunkFunction = (dispatch, getState) => { // logic here that can dispatch actions or read state}store.dispatch(thunkFunction)A thunk function may contain any arbitrary logic, sync or async, and can call dispatch or getState at any time.In the same way that Redux code normally uses action creators to generate action objects for dispatching instead of writing action objects by hand, we normally use thunk action creators to generate the thunk functions that are dispatched. A thunk action creator is a function that may have some arguments, and returns a new thunk function. The thunk typically closes over any arguments passed to the action creator, so they can be used in the logic:Thunk action creators and thunk functions// fetchTodoById is the "thunk action creator"export function fetchTodoById(todoId) { // fetchTodoByIdThunk is the "thunk function" return async function fetchTodoByIdThunk(dispatch, getState) { const response = await client.get(`/fakeApi/todo/${todoId}`) dispatch(todosLoaded(response.todos)) }}Thunk functions and action creators can be written using either the function keyword or arrow functions - there's no meaningful difference here. The same fetchTodoById thunk could also be written using arrow functions, like this:Writing thunks using arrow functionsexport const fetchTodoById = todoId => async dispatch => { const response = await client.get(`/fakeApi/todo/${todoId}`) dispatch(todosLoaded(response.todos))}In either case, the thunk is dispatched by calling the action creator, in the same way as you'd dispatch any other Redux action:function TodoComponent({ todoId }) { const dispatch = useDispatch() const onFetchClicked = () => { // Calls the thunk action creator, and passes the thunk function to dispatch dispatch(fetchTodoById(todoId)) }}Why Use Thunks?​Thunks allow us to write additional Redux-related logic separate from a UI layer. This logic can include side effects, such as async requests or generating random values, as well as logic that requires dispatching multiple actions or access to the Redux store state.Redux reducers must not contain side effects, but real applications require logic that has side effects. Some of that may live inside components, but some may need to live outside the UI layer. Thunks (and other Redux middleware) give us a place to put those side effects.It's common to have logic directly in components, such as making an async request in a click handler or a useEffect hook and then processing the results. However, it's often necessary to move as much of that logic as possible outside the UI layer. This may be done to improve testability of the logic, to keep the UI layer as thin and "presentational" as possible, or to improve code reuse and sharing.In a sense, a thunk is a loophole where you can write any code that needs to interact with the Redux store, ahead of time, without needing to know which Redux store will be used. This keeps the logic from being bound to any specific Redux store instance and keeps it reusable.Detailed Explanation: Thunks, Connect, and "Container Components"Historically, another reason to use thunks was to help keep React components "unaware of Redux". The connect API allowed passing action creators and "binding" them to automatically dispatch actions when called. Since components typically did not have access to dispatch internally, passing thunks to connect made it possible for components to just call this.props.doSomething(), without needing to know if it was a callback from a parent, dispatching a plain Redux action, dispatching a thunk performing sync or async logic, or a mock function in a test.With the arrival of the React-Redux hooks API, that situation has changed. The community has switched away from the "container/presentational" pattern in general, and components now have access to dispatch directly via the useDispatch hook. This does mean that it's possible to have more logic directly inside of a component, such as an async fetch + dispatch of the results. However, thunks have access to getState, which components do not, and there's still value in moving that logic outside of components.Thunk Use Cases​Because thunks are a general-purpose tool that can contain arbitrary logic, they can be used for a wide variety of purposes. The most common use cases are:Moving complex logic out of componentsMaking async requests or other async logicWriting logic that needs to dispatch multiple actions in a row or over timeWriting logic that needs access to getState to make decisions or include other state values in an actionThunks are "one-shot" functions, with no sense of a lifecycle. They also cannot see other dispatched actions. So, they should not generally be used for initializing persistent connections like websockets, and you can't use them to respond to other actions.Thunks are best used for complex synchronous logic, and simple to moderate async logic such as making a standard AJAX request and dispatching actions based on the request results.Redux Thunk Middleware​Dispatching thunk functions requires that the redux-thunk middleware has been added to the Redux store as part of its configuration.Adding the Middleware​The Redux Toolkit configureStore API automatically adds the thunk middleware during store creation, so it should typically be available with no extra configuration needed.If you need to add the thunk middleware to a store manually, that can be done by passing the thunk middleware to applyMiddleware() as part of the setup process.How Does the Middleware Work?​To start, let's review how Redux middleware work in general.Redux middleware are all written as a series of 3 nested functions:The outer function receives a "store API" object with {dispatch, getState}The middle function receives the next middleware in the chain (or the actual store.dispatch method)The inner function will be called with each action as it's passed through the middleware chainIt's important to note that middleware can be used to allow passing values that are not action objects into store.dispatch(), as long as the middleware intercepts those values and does not let them reach the reducers.With that in mind, we can look at the specifics of the thunk middleware.The actual implementation of the thunk middleware is very short - only about 10 lines. Here's the source, with additional added comments:Redux thunk middleware implementation, annotated// standard middleware definition, with 3 nested functions:// 1) Accepts `{dispatch, getState}`// 2) Accepts `next`// 3) Accepts `action`const thunkMiddleware = ({ dispatch, getState }) => next => action => { // If the "action" is actually a function instead... if (typeof action === 'function') { // then call the function and pass `dispatch` and `getState` as arguments return action(dispatch, getState) } // Otherwise, it's a normal action - send it onwards return next(action) }In other words:If you pass a function into dispatch, the thunk middleware sees that it's a function instead of an action object, intercepts it, and calls that function with (dispatch, getState) as its argumentsIf it's a normal action object (or anything else), it's forwarded to the next middleware in the chainInjecting Config Values Into Thunks​The thunk middleware does have one customization option. You can create a custom instance of the thunk middleware at setup time, and inject an "extra argument" into the middleware. The middleware will then inject that extra value as the third argument of every thunk function. This is most commonly used for injecting an API service layer into thunk functions, so that they don't have hardcoded dependencies on the API methods:Thunk setup with an extra argumentimport { withExtraArgument } from 'redux-thunk'const serviceApi = createServiceApi('/some/url')const thunkMiddlewareWithArg = withExtraArgument({ serviceApi })Redux Toolkit's configureStore supports this as part of its middleware customization in getDefaultMiddleware:Thunk extra argument with configureStoreconst store = configureStore({ reducer: rootReducer, middleware: getDefaultMiddleware => getDefaultMiddleware({ thunk: { extraArgument: { serviceApi } } })})There can only be one extra argument value. If you need to pass in multiple values, pass in an object containing those.The thunk function will then receive that extra value as its third argument:Thunk function with extra argumentexport const fetchTodoById = todoId => async (dispatch, getState, extraArgument) => { // In this example, the extra arg is an object with an API service inside const { serviceApi } = extraArgument const response = await serviceApi.getTodo(todoId) dispatch(todosLoaded(response.todos)) }Thunk Usage Patterns​Dispatching Actions​Thunks have access to the dispatch method. This can be used to dispatch actions, or even other thunks. This can be useful for dispatching multiple actions in a row (although this is a pattern that should be minimized), or orchestrating complex logic that needs to dispatch at multiple points in the process.Example: thunks dispatching actions and thunks// An example of a thunk dispatching other action creators,// which may or may not be thunks themselves. No async code, just// orchestration of higher-level synchronous logic.function complexSynchronousThunk(someValue) { return (dispatch, getState) => { dispatch(someBasicActionCreator(someValue)) dispatch(someThunkActionCreator()) }}Accessing State​Unlike components, thunks also have access to getState. This can be called at any time to retrieve the current root Redux state value. This can be useful for running conditional logic based on the current state. It's common to use selector functions when reading state inside of thunks rather than accessing nested state fields directly, but either approach is fine.Example: Conditional dispatching based on stateconst MAX_TODOS = 5function addTodosIfAllowed(todoText) { return (dispatch, getState) => { const state = getState() // Could also check `state.todos.length < MAX_TODOS` if (selectCanAddNewTodo(state, MAX_TODOS)) { dispatch(todoAdded(todoText)) } }}It's preferable to put as much logic as possible in reducers, but it's fine for thunks to also have additional logic inside as well.Since the state is synchronously updated as soon as the reducers process an action, you can call getState after a dispatch to get the updated state.Example: checking state after dispatchfunction checkStateAfterDispatch() { return (dispatch, getState) => { const firstState = getState() dispatch(firstAction()) const secondState = getState() if (secondState.someField != firstState.someField) { dispatch(secondAction()) } }}One other reason to consider accessing state in a thunk is to fill out an action with additional info. Sometimes a slice reducer really needs to read a value that isn't in its own slice of state. A possible workaround to that is to dispatch a thunk, extract the needed values from state, and then dispatch a plain action containing the additional info.Example: actions containing cross-slice data// One solution to the "cross-slice state in reducers" problem:// read the current state in a thunk, and include all the necessary// data in the actionfunction crossSliceActionThunk() { return (dispatch, getState) => { const state = getState() // Read both slices out of state const { a, b } = state // Include data from both slices in the action dispatch(actionThatNeedsMoreData(a, b)) }}Async Logic and Side Effects​Thunks may contain async logic, as well as side effects such as updating localStorage. That logic may use Promise chaining such as someResponsePromise.then(), although the async/await syntax is usually preferable for readability.When making async requests, it's standard to dispatch actions before and after a request to help track loading state. Typically, a "pending" action before the request and a loading state enum is marked as "in progress". If the request succeeds, a "fulfilled" action is dispatched with the result data, or a "rejected" action is dispatched containing the error info.Error handling here can be trickier than most people think. If you chain resPromise.then(dispatchFulfilled).catch(dispatchRejected) together, you may end up dispatching a "rejected" action if some non-network error occurs during the process of handling the "fulfilled" action. It's better to use the second argument of .then() to ensure you only handle errors related to the request itself:Example: async request with promise chainingfunction fetchData(someValue) { return (dispatch, getState) => { dispatch(requestStarted()) myAjaxLib.post('/someEndpoint', { data: someValue }).then( response => dispatch(requestSucceeded(response.data)), error => dispatch(requestFailed(error.message)) ) }}With async/await, this can be even trickier, because of how try/catch logic is usually organized. In order to ensure that the catch block only handles errors from the network level, it may be necessary to reorganize the logic so that the thunk returns early if there's an error, and "fulfilled" action only happens at the end:Example: error handling with async/awaitfunction fetchData(someValue) { return async (dispatch, getState) => { dispatch(requestStarted()) // Have to declare the response variable outside the try block let response try { response = await myAjaxLib.post('/someEndpoint', { data: someValue }) } catch (error) { // Ensure we only catch network errors dispatch(requestFailed(error.message)) // Bail out early on failure return } // We now have the result and there's no error. Dispatch "fulfilled". dispatch(requestSucceeded(response.data)) }}Note that this issue isn't exclusive to Redux or thunks - it can apply even if you're only wo'''
