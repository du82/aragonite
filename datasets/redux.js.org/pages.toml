title = "Redux Essentials, Part 3: Basic Redux Data Flow | Redux"
description = "The official Redux Essentials tutorial: learn how data flows in a React + Redux app"
full_description = '''TutorialsRedux EssentialsBasic Redux Data FlowOn this pageRedux Essentials, Part 3: Basic Redux Data FlowWhat You'll LearnHow to set up a Redux store in a React applicationHow to add "slices" of reducer logic to the Redux store with createSliceReading Redux data in components with the useSelector hookDispatching actions in components with the useDispatch hookPrerequisitesFamiliarity with key Redux terms and concepts like "actions", "reducers", "store", and "dispatching". (See Part 1: Redux Overview and Concepts for explanations of these terms.)Basic understanding of TypeScript syntax and usageIntroduction​In Part 1: Redux Overview and Concepts, we looked at how Redux can help us build maintainable apps by giving us a single central place to put global app state. We also talked about core Redux concepts like dispatching action objects, using reducer functions that return new state values, and writing async logic using thunks. In Part 2: Redux Toolkit App Structure, we saw how APIs like configureStore and createSlice from Redux Toolkit and Provider and useSelector from React-Redux work together to let us write Redux logic and interact with that logic from our React components.Now that you have some idea of what these pieces are, it's time to put that knowledge into practice. We're going to build a small social media feed app, which will include a number of features that demonstrate some real-world use cases. This will help you understand how to use Redux in your own applications.We'll be using TypeScript syntax to write our code. You can use Redux with plain JavaScript, but using TypeScript helps prevent many common mistakes, provides built-in documentation for your code, and lets your editor show you what variable types are needed in places like React components and Redux reducers. We strongly recommend using TypeScript for all Redux applications.cautionThe example app is not meant as a complete production-ready project. The goal is to help you learn the Redux APIs and typical usage patterns, and point you in the right direction using some limited examples. Also, some of the early pieces we build will be updated later on to show better ways to do things. Please read through the whole tutorial to see all the concepts in use.Project Setup​For this tutorial, we've created a pre-configured starter project that already has React and Redux set up, includes some default styling, and has a fake REST API that will allow us to write actual API requests in our app. You'll use this as the basis for writing the actual application code.To get started, you can open and fork this CodeSandbox:You can also clone the same project from this Github repo. The project is configured to use Yarn 4 as the package manager, but you can use any package manager (NPM, PNPM, or Bun) as you prefer. After installing packages, you can start the local dev server with the yarn dev command.If you'd like to see the final version of what we're going to build, you can check out the tutorial-steps-ts branch, or look at the final version in this CodeSandbox.We'd like to thank Tania Rascia, whose Using Redux with React tutorial helped inspire the example in this page. It also uses her Primitive UI CSS starter for styling.Creating a New Redux + React Project​Once you've finished this tutorial, you'll probably want to try working on your own projects. We recommend using the Redux templates for Vite and Next.js as the fastest way to create a new Redux + React project. The templates come with Redux Toolkit and React-Redux already configured, using the same "counter" app example you saw in Part 1. This lets you jump right into writing your actual application code without having to add the Redux packages and set up the store.Exploring the Initial Project​Let's take a quick look at what the initial project contains:/public: base CSS styles and other static files like icons/srcmain.tsx: the entry point file for the application, which renders the <App> component. In this example, it also sets up the fake REST API on page load.App.tsx: the main application component. Renders the top navbar and handles client-side routing for the other content.index.css: styles for the complete application/apiclient.ts: a small fetch wrapper client that allows us to make HTTP GET and POST requestsserver.ts: provides a fake REST API for our data. Our app will fetch data from these fake endpoints later./appNavbar.tsx: renders the top header and nav contentIf you load the app now, you should see the header and a welcome message, but no functionality.With that, let's get started!Setting Up the Redux Store​Right now the project is empty, so we'll need to start by doing the one-time setup for the Redux pieces.Adding the Redux Packages​If you look at package.json, you'll see that we've already installed the two packages needed to use Redux:@reduxjs/toolkit: the modern Redux package, which includes all the Redux functions we'll be using to build the appreact-redux: the functions needed to let your React components talk to a Redux storeIf you're setting up a project from scratch, start by adding those packages to the project yourself.Creating the Store​The first step is to create an actual Redux store. One of the principles of Redux is that there should only be one store instance for an entire application.We typically create and export the Redux store instance in its own file. The actual folder structure for the application is up to you, but it's standard to have application-wide setup and configuration in a src/app/ folder.We'll start by adding a src/app/store.ts file and creating the store.Redux Toolkit includes a method called configureStore. This function creates a new Redux store instance. It has several options that you can pass in to change the store's behavior. It also applies the most common and useful configuration settings automatically, including checking for typical mistakes, and enabling the Redux DevTools extension so that you can view the state contents and action history.src/app/store.tsimport { configureStore } from '@reduxjs/toolkit'import type { Action } from '@reduxjs/toolkit'interface CounterState { value: number}// An example slice reducer function that shows how a Redux reducer works inside.// We'll replace this soon with real app logic.function counterReducer(state: CounterState = { value: 0 }, action: Action) { switch (action.type) { // Handle actions here default: { return state } }}export const store = configureStore({ // Pass in the root reducer setup as the `reducer` argument reducer: { // Declare that `state.counter` will be updated by the `counterReducer` function counter: counterReducer }})configureStore always requires a reducer option. This should typically be an object containing the individual "slice reducers" for the different parts of the application. (If necessary, you can also create the root reducer function separately and pass that as the reducer argument.)For this first step, we're passing in a mock slice reducer function for the counter slice, to show what the setup looks like. We'll replace this with a real slice reducer for the actual app we want to build in just a minute.Setup with Next.jsIf you're using Next.js, the setup process takes a few more steps. See the Setup with Next.js page for details on how to set up Redux with Next.js.Providing the Store​Redux by itself is a plain JS library, and can work with any UI layer. In this app, we're using React, so we need a way to let our React components interact with the Redux store.To make this work, we need to use the React-Redux library and pass the Redux store into a <Provider> component. This uses React's Context API to make the Redux store accessible to all of the React components in our application.tipIt's important that we should not try to directly import the Redux store into other application code files! Because there's only one store file, directly importing the store can accidentally cause circular import issues (where file A imports B imports C imports A), which lead to hard-to-track bugs. Additionally, we want to be able to write tests for the components and Redux logic, and those tests will need to create their own Redux store instances. Providing the store to the components via Context keeps this flexible and avoids import problems.To do this, we'll import the store into the main.tsx entry point file, wrap a <Provider> with the store around the <App> component:src/main.tsximport { createRoot } from 'react-dom/client'import { Provider } from 'react-redux'import App from './App'import { store } from './app/store'// skip mock API setupconst root = createRoot(document.getElementById('root')!)root.render( <React.StrictMode> <Provider store={store}> <App /> </Provider> </React.StrictMode>)Inspecting the Redux State​Now that we have a store, we can use the Redux DevTools extension to view the current Redux state.If you open up your browser's DevTools view (such as by right-clicking anywhere in the page and choosing "Inspect"), you can click on the "Redux" tab. This will show the history of dispatched actions and the current state value:The current state value should be an object that looks like this:{ counter: { value: 0 }}That shape was defined by the reducer option we passed into configureStore: an object, with a field named counter, and the slice reducer for the counter field returns an object like {value} as its state.Exporting Store Types​Since we're using TypeScript, we're going to frequently refer to TS types for "the type of the Redux state" and "the type of the Redux store dispatch function".We need to export those types from the store.ts file. We'll define the types by using the TS typeof operator to ask TS to infer the types based on the Redux store definition:src/app/store.tsimport { configureStore } from '@reduxjs/toolkit'// omit counter slice setupexport const store = configureStore({ reducer: { counter: counterReducer }})// Infer the type of `store`export type AppStore = typeof store// Infer the `AppDispatch` type from the store itselfexport type AppDispatch = typeof store.dispatch// Same for the `RootState` typeexport type RootState = ReturnType<typeof store.getState>If you hover over the RootState type in your editor, you should see type RootState = { counter: CounterState; }. Since this type is automatically derived from the store definition, all the future changes to the reducer setup will automatically be reflected in the RootState type as well. This way we only need to define it once, and it will always be accurate.Exporting Typed Hooks​We're going to be using React-Redux's useSelector and useDispatch hooks extensively in our components. Those need to reference the RootState and AppDispatch types each time we use the hooks.We can simplify the usage and avoid repeating the types if we set up "pre-typed" versions of those hooks that have the right types already built in.React-Redux 9.1 includes .withTypes() methods that apply the right types to those hooks. We can export these pre-typed hooks, then use them in the rest of the application:src/app/hooks.ts// This file serves as a central hub for re-exporting pre-typed Redux hooks.import { useDispatch, useSelector } from 'react-redux'import type { AppDispatch, RootState } from './store'// Use throughout your app instead of plain `useDispatch` and `useSelector`export const useAppDispatch = useDispatch.withTypes<AppDispatch>()export const useAppSelector = useSelector.withTypes<RootState>()That completes the setup process. Let's start building the app!Main Posts Feed​The main feature for our social media feed app will be a list of posts. We'll add several more pieces to this feature as we go along, but to start off, our first goal is to only show the list of post entries on screen.Creating the Posts Slice​The first step is to create a new Redux "slice" that will contain the data for our posts.A "slice" is a collection of Redux reducer logic and actions for a single feature in your app, typically defined together in a single file. The name comes from splitting up the root Redux state object into multiple "slices" of state.Once we have the posts data in the Redux store, we can create the React components to show that data on the page.Inside of src, create a new features folder, put a posts folder inside of features, and add a new file named postsSlice.ts.We're going to use the Redux Toolkit createSlice function to make a reducer function that knows how to handle our posts data. Reducer functions need to have some initial data included so that the Redux store has those values loaded when the app starts up.For now, we'll create an array with some fake post objects inside so that we can begin adding the UI.We'll import createSlice, define our initial posts array, pass that to createSlice, and export the posts reducer function that createSlice generated for us:features/posts/postsSlice.tsimport { createSlice } from '@reduxjs/toolkit'// Define a TS type for the data we'll be usingexport interface Post { id: string title: string content: string}// Create an initial state value for the reducer, with that typeconst initialState: Post[] = [ { id: '1', title: 'First Post!', content: 'Hello!' }, { id: '2', title: 'Second Post', content: 'More text' }]// Create the slice and pass in the initial stateconst postsSlice = createSlice({ name: 'posts', initialState, reducers: {}})// Export the generated reducer functionexport default postsSlice.reducerEvery time we create a new slice, we need to add its reducer function to our Redux store. We already have a Redux store being created, but right now it doesn't have any data inside. Open up app/store.ts, import the postsReducer function, remove all of the counter code, and update the call to configureStore so that the postsReducer is being passed as a reducer field named posts:app/store.tsimport { configureStore } from '@reduxjs/toolkit'// Removed the `counterReducer` function, `CounterState` type, and `Action` importimport postsReducer from '@/features/posts/postsSlice'export const store = configureStore({ reducer: { posts: postsReducer }})This tells Redux that we want our top-level state object to have a field named posts inside, and all the data for state.posts will be updated by the postsReducer function when actions are dispatched.We can confirm that this works by opening the Redux DevTools Extension and looking at the current state contents:Showing the Posts List​Now that we have some posts data in our store, we can create a React component that shows the list of posts. All of the code related to our feed posts feature should go in the posts folder, so go ahead and create a new file named PostsList.tsx in there. (Note that since this is a React component written in TypeScript and using JSX syntax, it needs a .tsx file extension for TypeScript to compile it properly)If we're going to render a list of posts, we need to get the data from somewhere. React components can read data from the Redux stor'''
