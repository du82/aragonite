title = "Redux Essentials, Part 4: Using Redux Data | Redux"
description = "The official Redux Essentials tutorial: learn how to work with complex Redux state in React components"
full_description = '''TutorialsRedux EssentialsUsing Redux DataOn this pageRedux Essentials, Part 4: Using Redux DataWhat You'll LearnUsing Redux data in multiple React componentsOrganizing logic that dispatches actionsUsing selectors to look up state valuesWriting more complex update logic in reducersHow to think about Redux actionsPrerequisitesUnderstanding the Redux data flow and React-Redux APIs from Part 3Familiarity with the React Router <Link> and <Route> components for page routingIntroduction​In Part 3: Basic Redux Data Flow, we saw how to start from an empty Redux+React project setup, add a new slice of state, and create React components that can read data from the Redux store and dispatch actions to update that data. We also looked at how data flows through the application, with components dispatching actions, reducers processing actions and returning new state, and components reading the new state and rerendering the UI. We also saw how to create "pre-typed" versions of the useSelector and useDispatch hooks that have the correct store types applied automatically.Now that you know the core steps to write Redux logic, we're going to use those same steps to add some new features to our social media feed that will make it more useful: viewing a single post, editing existing posts, showing post author details, post timestamps, reaction buttons, and auth.infoAs a reminder, the code examples focus on the key concepts and changes for each section. See the CodeSandbox projects and the tutorial-steps branch in the project repo for the complete changes in the application.Showing Single Posts​Since we have the ability to add new posts to the Redux store, we can add some more features that use the post data in different ways.Currently, our post entries are being shown in the main feed page, but if the text is too long, we only show an excerpt of the content. It would be helpful to have the ability to view a single post entry on its own page.Creating a Single Post Page​First, we need to add a new SinglePostPage component to our posts feature folder. We'll use React Router to show this component when the page URL looks like /posts/123, where the 123 part should be the ID of the post we want to show.features/posts/SinglePostPage.tsximport { useParams } from 'react-router-dom'import { useAppSelector } from '@/app/hooks'export const SinglePostPage = () => { const { postId } = useParams() const post = useAppSelector(state => state.posts.find(post => post.id === postId) ) if (!post) { return ( <section> <h2>Post not found!</h2> </section> ) } return ( <section> <article className="post"> <h2>{post.title}</h2> <p className="post-content">{post.content}</p> </article> </section> )}When we set up the route to render this component, we're going to tell it to parse the second part of the URL as a variable named postId, and we can read that value from the useParams hook.Once we have that postId value, we can use it inside a selector function to find the right post object from the Redux store. We know that state.posts should be an array of all post objects, so we can use the Array.find() function to loop through the array and return the post entry with the ID we're looking for.It's important to note that the component will re-render any time the value returned from useAppSelector changes to a new reference. Components should always try to select the smallest possible amount of data they need from the store, which will help ensure that it only renders when it actually needs to.It's possible that we might not have a matching post entry in the store - maybe the user tried to type in the URL directly, or we don't have the right data loaded. If that happens, the find() function will return undefined instead of an actual post object. Our component needs to check for that and handle it by showing a "Post not found!" message in the page.Assuming we do have the right post object in the store, useAppSelector will return that, and we can use it to render the title and content of the post in the page.You might notice that this looks fairly similar to the logic we have in the body of our <PostsList> component, where we loop over the whole posts array to show post excerpts on the main feed. We could try to extract a Post component that could be used in both places, but there are already some differences in how we're showing a post excerpt and the whole post. It's usually better to keep writing things separately for a while even if there's some duplication, and then we can decide later if the different sections of code are similar enough that we can really extract a reusable component.Adding the Single Post Route​Now that we have a <SinglePostPage> component, we can define a route to show it, and add links to each post in the front page feed.While we're at it, it's also worth extracting the "main page" content into a separate <PostsMainPage> component as well, just for readability.We'll import PostsMainPage and SinglePostPage in App.tsx, and add the route:App.tsximport { BrowserRouter as Router, Route, Routes } from 'react-router-dom'import { Navbar } from './components/Navbar'import { PostsMainPage } from './features/posts/PostsMainPage'import { SinglePostPage } from './features/posts/SinglePostPage'function App() { return ( <Router> <Navbar /> <div className="App"> <Routes> <Route path="/" element={<PostsMainPage />}></Route> <Route path="/posts/:postId" element={<SinglePostPage />} /> </Routes> </div> </Router> )}export default AppThen, in <PostsList>, we'll update the list rendering logic to include a <Link> that routes to that specific post:features/posts/PostsList.tsximport { Link } from 'react-router-dom'import { useAppSelector } from '@/app/hooks'export const PostsList = () => { const posts = useAppSelector(state => state.posts) const renderedPosts = posts.map(post => ( <article className="post-excerpt" key={post.id}> <h3> <Link to={`/posts/${post.id}`}>{post.title}</Link> </h3> <p className="post-content">{post.content.substring(0, 100)}</p> </article> )) return ( <section className="posts-list"> <h2>Posts</h2> {renderedPosts} </section> )}And since we can now click through to a different page, it would also be helpful to have a link back to the main posts page in the <Navbar> component as well:app/Navbar.tsximport { Link } from 'react-router-dom'export const Navbar = () => { return ( <nav> <section> <h1>Redux Essentials Example</h1> <div className="navContent"> <div className="navLinks"> <Link to="/">Posts</Link> </div> </div> </section> </nav> )}Editing Posts​As a user, it's really annoying to finish writing a post, save it, and realize you made a mistake somewhere. Having the ability to edit a post after we created it would be useful.Let's add a new <EditPostForm> component that has the ability to take an existing post ID, read that post from the store, lets the user edit the title and post content, and then save the changes to update the post in the store.Updating Post Entries​First, we need to update our postsSlice to create a new reducer function and an action so that the store knows how to actually update posts.Inside of the createSlice() call, we should add a new function into the reducers object. Remember that the name of this reducer should be a good description of what's happening, because we're going to see the reducer name show up as part of the action type string in the Redux DevTools whenever this action is dispatched. Our first reducer was called postAdded, so let's call this one postUpdated.tipRedux itself doesn't care what name you use for these reducer functions - it'll run the same if it's named postAdded, addPost, POST_ADDED, or someRandomName.That said, we encourage naming reducers as past-tense "this happened" names like postAdded, because we're describing "an event that occurred in the application".In order to update a post object, we need to know:The ID of the post being updated, so that we can find the right post object in the stateThe new title and content fields that the user typed inRedux action objects are required to have a type field, which is normally a descriptive string, and may also contain other fields with more information about what happened. By convention, we normally put the additional info in a field called action.payload, but it's up to us to decide what the payload field contains - it could be a string, a number, an object, an array, or something else. In this case, since we have three pieces of information we need, let's plan on having the payload field be an object with the three fields inside of it. That means the action object will look like {type: 'posts/postUpdated', payload: {id, title, content}}.By default, the action creators generated by createSlice expect you to pass in one argument, and that value will be put into the action object as action.payload. So, we can pass an object containing those fields as the argument to the postUpdated action creator. As with postAdded, this is an entire Post object, so we declare that the reducer argument is action: PayloadAction<Post>.We also know that the reducer is responsible for determining how the state should actually be updated when an action is dispatched. Given that, we should have the reducer find the right post object based on the ID, and specifically update the title and content fields in that post.Finally, we'll need to export the action creator function that createSlice generated for us, so that the UI can dispatch the new postUpdated action when the user saves the post.Given all those requirements, here's how our postsSlice definition should look after we're done:features/posts/postsSlice.tsimport { createSlice, PayloadAction } from '@reduxjs/toolkit'// omit state typesconst postsSlice = createSlice({ name: 'posts', initialState, reducers: { postAdded(state, action: PayloadAction<Post>) { state.push(action.payload) }, postUpdated(state, action: PayloadAction<Post>) { const { id, title, content } = action.payload const existingPost = state.find(post => post.id === id) if (existingPost) { existingPost.title = title existingPost.content = content } } }})export const { postAdded, postUpdated } = postsSlice.actionsexport default postsSlice.reducerCreating an Edit Post Form​Our new <EditPostForm> component will look similar to both the the <AddPostForm> and <SinglePostPage>, but the logic needs to be a bit different. We need to retrieve the right post object from the store based on the postId in the URL, then use that to initialize the input fields in the component so the user can make changes. We'll save the changed title and content values back to the store when the user submits the form. We'll also use React Router's useNavigate hook to switch over to the single post page and show that post after they save the changes.features/posts/EditPostForm.tsximport React from 'react'import { useNavigate, useParams } from 'react-router-dom'import { useAppSelector, useAppDispatch } from '@/app/hooks'import { postUpdated } from './postsSlice'// omit form element typesexport const EditPostForm = () => { const { postId } = useParams() const post = useAppSelector(state => state.posts.find(post => post.id === postId) ) const dispatch = useAppDispatch() const navigate = useNavigate() if (!post) { return ( <section> <h2>Post not found!</h2> </section> ) } const onSavePostClicked = (e: React.FormEvent<EditPostFormElements>) => { // Prevent server submission e.preventDefault() const { elements } = e.currentTarget const title = elements.postTitle.value const content = elements.postContent.value if (title && content) { dispatch(postUpdated({ id: post.id, title, content })) navigate(`/posts/${postId}`) } } return ( <section> <h2>Edit Post</h2> <form onSubmit={onSavePostClicked}> <label htmlFor="postTitle">Post Title:</label> <input type="text" id="postTitle" name="postTitle" defaultValue={post.title} required /> <label htmlFor="postContent">Content:</label> <textarea id="postContent" name="postContent" defaultValue={post.content} required /> <button>Save Post</button> </form> </section> )}Note that the Redux-specific code here is relatively minimal. Once again, we read a value from the Redux store via useAppSelector, and then dispatch an action via useAppDispatch when the user interacts with the UI.Like with SinglePostPage, we'll need to import it into App.tsx and add a route that will render this component with the postId as a route parameter.App.tsximport { BrowserRouter as Router, Route, Routes } from 'react-router-dom'import { Navbar } from './components/Navbar'import { PostsMainPage } from './features/posts/PostsMainPage'import { SinglePostPage } from './features/posts/SinglePostPage'import { EditPostForm } from './features/posts/EditPostForm'function App() { return ( <Router> <Navbar /> <div className="App"> <Routes> <Route path="/" element={<PostsMainPage />}></Route> <Route path="/posts/:postId" element={<SinglePostPage />} /> <Route path="/editPost/:postId" element={<EditPostForm />} /> </Routes> </div> </Router> )}export default AppWe should also add a new link to our SinglePostPage that will route to EditPostForm, like:features/post/SinglePostPage.tsximport { Link, useParams } from 'react-router-dom'export const SinglePostPage = () => { // omit other contents <p className="post-content">{post.content}</p> <Link to={`/editPost/${post.id}`} className="button"> Edit Post </Link>Preparing Action Payloads​We just saw that the action creators from createSlice normally expect one argument, which becomes action.payload. This simplifies the most common usage pattern, but sometimes we need to do more work to prepare the contents of an action object. In the case of our postAdded action, we need to generate a unique ID for the new post, and we also need to make sure that the payload is an object that looks like {id, title, content}.Right now, we're generating the ID and creating the payload object in our React component, and passing the payload object into postAdded. But, what if we needed to dispatch the same action from different components, or the logic for preparing the payload is complicated? We'd have to duplicate that logic every time we wanted to dispatch the action, and we're forcing the component to know exactly what the payload for this action should look like.cautionIf an action needs to contain a unique ID or some other random value, always generate that first and put it in the action object. Reducers should never calculate random values, because that makes the results unpredictable.If we were writing the postAdded action creator by hand, we could have put the setup logic inside of it ourselves:// hand-written action creatorfunction postAdded(title: string, content: string) { const id = nanoid() return { type: 'posts/postAdded', payload: { id, title, content } }}But, Redux Toolkit's createSlice is generating these action creators for us. That makes the code shorter because we don't have to write them ourselves, but we still need a way to customize the contents of a'''
