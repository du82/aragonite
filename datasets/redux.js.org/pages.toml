["https://redux.js.org/usage/structuring-reducers/structuring-reducers"]
title = "Structuring Reducers | Redux"
description = "Structuring Reducers > Intro: overview and contents"
full_description = '''Using ReduxRedux Logic and PatternsStructuring ReducersStructuring ReducersOn this pageStructuring ReducersAt its core, Redux is really a fairly simple design pattern: all your "write" logic goes into a single function, and the only way to run that logic is to give Redux a plain object that describes something that has happened. The Redux store calls that write logic function and passes in the current state tree and the descriptive object, the write logic function returns some new state tree, and the Redux store notifies any subscribers that the state tree has changed.Redux puts some basic constraints on how that write logic function should work. As described in "Redux Fundamentals" Part 3: State, Actions, and Reducers, it has to have a signature of (previousState, action) => newState, is known as a reducer function, and must be pure and predictable.Beyond that, Redux does not really care how you actually structure your logic inside that reducer function, as long as it obeys those basic rules. This is both a source of freedom and a source of confusion. However, there are a number of common patterns that are widely used when writing reducers, as well as a number of related topics and concepts to be aware of. As an application grows, these patterns play a crucial role in managing reducer code complexity, handling real-world data, and optimizing UI performance.Prerequisite Concepts for Writing Reducers​Some of these concepts are already described elsewhere in the Redux documentation. Others are generic and applicable outside of Redux itself, and there are numerous existing articles that cover these concepts in detail. These concepts and techniques form the foundation of writing solid Redux reducer logic.It is vital that these Prerequisite Concepts are thoroughly understood before moving on to more advanced and Redux-specific techniques. A recommended reading list is available at:Prerequisite Concepts​Standard Redux architecture relies on using plain JS objects and arrays for your state. If you're using an alternate approach for some reason, the details may differ based on your approach, but many of the principles will still apply.Reducer Concepts and Techniques​Basic Reducer StructureSplitting Reducer LogicRefactoring Reducers ExampleUsing combineReducersBeyond combineReducersNormalizing State ShapeUpdating Normalized DataReusing Reducer LogicImmutable Update PatternsInitializing StateEdit this pageLast updated on Jun 26, 2021'''
