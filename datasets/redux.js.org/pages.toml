["https://redux.js.org/usage/deriving-data-selectors"]
title = "Deriving Data with Selectors | Redux"
description = "Usage > Redux Logic > Selectors: deriving data from the Redux state"
full_description = '''Using ReduxRedux Logic and PatternsDeriving Data with SelectorsOn this pageDeriving Data with SelectorsWhat You'll LearnWhy good Redux architecture keeps state minimal and derives additional dataPrinciples of using selector functions to derive data and encapsulate lookupsHow to use the Reselect library to write memoized selectors for optimizationAdvanced techniques for using ReselectAdditional tools and libraries for creating selectorsBest practices for writing selectorsDeriving Data​We specifically recommend that Redux apps should keep the Redux state minimal, and derive additional values from that state whenever possible.This includes things like calculating filtered lists or summing up values. As an example, a todo app would keep an original list of todo objects in state, but derive a filtered list of todos outside the state whenever the state is updated. Similarly, a check for whether all todos have been completed, or number of todos remaining, can be calculated outside the store as well.This has several benefits:The actual state is easier to readLess logic is needed to calculate those additional values and keep them in sync with the rest of the dataThe original state is still there as a reference and isn't being replacedtipThis is also a good principle for React state as well! Many times users tried to define a useEffect hook that waits for a state value to change, and then sets state with some derived value like setAllCompleted(allCompleted). Instead, that value can be derived during the rendering process and used directly, without having to save the value into state at all:function TodoList() { const [todos, setTodos] = useState([]) // Derive the data while rendering const allTodosCompleted = todos.every(todo => todo.completed) // render with this value}Calculating Derived Data with Selectors​In a typical Redux application, the logic for deriving data is usually written as functions we call selectors.Selectors are primarily used to encapsulate logic for looking up specific values from state, logic for actually deriving values, and improving performance by avoiding unnecessary recalculations.You are not required to use selectors for all state lookups, but they are a standard pattern and widely used.Basic Selector Concepts​A "selector function" is any function that accepts the Redux store state (or part of the state) as an argument, and returns data that is based on that state.Selectors don't have to be written using a special library, and it doesn't matter whether you write them as arrow functions or the function keyword. For example, all of these are valid selector functions:// Arrow function, direct lookupconst selectEntities = state => state.entities// Function declaration, mapping over an array to derive valuesfunction selectItemIds(state) { return state.items.map(item => item.id)}// Function declaration, encapsulating a deep lookupfunction selectSomeSpecificField(state) { return state.some.deeply.nested.field}// Arrow function, deriving values from an arrayconst selectItemsWhoseNamesStartWith = (items, namePrefix) => items.filter(item => item.name.startsWith(namePrefix))A selector function can have any name you want. However, we recommend prefixing selector function names with the word select combined with a description of the value being selected. Typical examples of this would look like selectTodoById, selectFilteredTodos, and selectVisibleTodos.If you've used the useSelector hook from React-Redux, you're probably already familiar with the basic idea of a selector function - the functions that we pass to useSelector must be selectors:function TodoList() { // This anonymous arrow function is a selector! const todos = useSelector(state => state.todos)}Selector functions are typically defined in two different parts of a Redux application:In slice files, alongside the reducer logicIn component files, either outside the component, or inline in useSelector callsA selector function can be used anywhere you have access to the entire Redux root state value. This includes the useSelector hook, the mapState function for connect, middleware, thunks, and sagas. For example, thunks and middleware have access to the getState argument, so you can call a selector there:function addTodosIfAllowed(todoText) { return (dispatch, getState) => { const state = getState() const canAddTodos = selectCanAddTodos(state) if (canAddTodos) { dispatch(todoAdded(todoText)) } }}It's not typically possible to use selectors inside of reducers, because a slice reducer only has access to its own slice of the Redux state, and most selectors expect to be given the entire Redux root state as an argument.Encapsulating State Shape with Selectors​The first reason to use selector functions is for encapsulation and reusability when dealing with your Redux state shape.Let's say that one of your useSelector hooks makes a very specific lookup into part of your Redux state:const data = useSelector(state => state.some.deeply.nested.field)That is legal code, and will run fine. But, it might not be the best idea architecturally. Imagine that you've got several components that need to access that field. What happens if you need to make a change to where that piece of state lives? You would now have to go change every useSelector hook that references that value. So, in the same way that we recommend using action creators to encapsulate details of creating actions, we recommend defining reusable selectors to encapsulate the knowledge of where a given piece of state lives. Then, you can use a given selector function many times in the codebase, anywhere that your app needs to retrieve that particular data.Ideally, only your reducer functions and selectors should know the exact state structure, so if you change where some state lives, you would only need to update those two pieces of logic.Because of this, it's often a good idea to define reusable selectors directly inside slice files, rather than always defining them inside of a component.One common description of selectors is that they're like "queries into your state". You don't care about exactly how the query came up with the data you needed, just that you asked for the data and got back a result.Optimizing Selectors with Memoization​Selector functions often need to perform relatively "expensive" calculations, or create derived values that are new object and array references. This can be a concern for application performance, for several reasons:Selectors used with useSelector or mapState will be re-run after every dispatched action, regardless of what section of the Redux root state was actually updated. Re-running expensive calculations when the input state sections didn't change is a waste of CPU time, and it's very likely that the inputs won't have changed most of the time anyway.useSelector and mapState rely on === reference equality checks of the return values to determine if the component needs to re-render. If a selector always returns new references, it will force the component to re-render even if the derived data is effectively the same as last time. This is especially common with array operations like map() and filter(), which return new array references.As an example, this component is written badly, because its useSelector call always returns a new array reference. That means the component will re-render after every dispatched action, even if the input state.todos slice hasn't changed:function TodoList() { // ❌ WARNING: this _always_ returns a new reference, so it will _always_ re-render! const completedTodos = useSelector(state => state.todos.map(todo => todo.completed) )}Another example is a component that needs to do some "expensive" work to transform data:function ExampleComplexComponent() { const data = useSelector(state => { const initialData = state.data const filteredData = expensiveFiltering(initialData) const sortedData = expensiveSorting(filteredData) const transformedData = expensiveTransformation(sortedData) return transformedData })}Similarly, this "expensive" logic will re-run after every dispatched action. Not only will it probably create new references, but it's work that doesn't need to be done unless state.data actually changes.Because of this, we need a way to write optimized selectors that can avoid recalculating results if the same inputs are passed in. This is where the idea of memoization comes in.Memoization is a form of caching. It involves tracking inputs to a function, and storing the inputs and the results for later reference. If a function is called with the same inputs as before, the function can skip doing the actual work, and return the same result it generated the last time it received those input values. This optimizes performance by only doing work if inputs have changed, and consistently returning the same result references if the inputs are the same.Next, we'll look at some options for writing memoized selectors.Writing Memoized Selectors with Reselect​The Redux ecosystem has traditionally used a library called Reselect to create memoized selector functions. There also are other similar libraries, as well as multiple variations and wrappers around Reselect - we'll look at those later.createSelector Overview​Reselect provides a function called createSelector to generate memoized selectors. createSelector accepts one or more "input selector" functions, plus an "output selector" function, and returns a new selector function for you to use.createSelector is included as part of our official Redux Toolkit package, and is re-exported for ease of use.createSelector can accept multiple input selectors, which can be provided as separate arguments or as an array. The results from all the input selectors are provided as separate arguments to the output selector:const selectA = state => state.aconst selectB = state => state.bconst selectC = state => state.cconst selectABC = createSelector([selectA, selectB, selectC], (a, b, c) => { // do something with a, b, and c, and return a result return a + b + c})// Call the selector function and get a resultconst abc = selectABC(state)// could also be written as separate arguments, and works exactly the sameconst selectABC2 = createSelector(selectA, selectB, selectC, (a, b, c) => { // do something with a, b, and c, and return a result return a + b + c})When you call the selector, Reselect will run your input selectors with all of the arguments you gave, and looks at the returned values. If any of the results are === different than before, it will re-run the output selector, and pass in those results as the arguments. If all of the results are the same as the last time, it will skip re-running the output selector, and just return the cached final result from before.This means that "input selectors" should usually just extract and return values, and the "output selector" should do the transformation work.cautionA somewhat common mistake is to write an "input selector" that extracts a value or does some derivation, and an "output selector" that just returns its result:// ❌ BROKEN: this will not memoize correctly, and does nothing useful!const brokenSelector = createSelector( state => state.todos, todos => todos)Any "output selector" that just returns its inputs is incorrect! The output selector should always have the transformation logic.Similarly, a memoized selector should never use state => state as an input! That will force the selector to always recalculate.In typical Reselect usage, you write your top-level "input selectors" as plain functions, and use createSelector to create memoized selectors that look up nested values:const state = { a: { first: 5 }, b: 10}const selectA = state => state.aconst selectB = state => state.bconst selectA1 = createSelector([selectA], a => a.first)const selectResult = createSelector([selectA1, selectB], (a1, b) => { console.log('Output selector running') return a1 + b})const result = selectResult(state)// Log: "Output selector running"console.log(result)// 15const secondResult = selectResult(state)// No log outputconsole.log(secondResult)// 15Note that the second time we called selectResult, the "output selector" didn't execute. Because the results of selectA1 and selectB were the same as the first call, selectResult was able to return the memoized result from the first call.createSelector Behavior​It's important to note that by default, createSelector only memoizes the most recent set of parameters. That means that if you call a selector repeatedly with different inputs, it will still return a result, but it will have to keep re-running the output selector to produce the result:const a = someSelector(state, 1) // first call, not memoizedconst b = someSelector(state, 1) // same inputs, memoizedconst c = someSelector(state, 2) // different inputs, not memoizedconst d = someSelector(state, 1) // different inputs from last time, not memoizedAlso, you can pass multiple arguments into a selector. Reselect will call all of the input selectors with those exact inputs:const selectItems = state => state.itemsconst selectItemId = (state, itemId) => itemIdconst selectItemById = createSelector( [selectItems, selectItemId], (items, itemId) => items[itemId])const item = selectItemById(state, 42)/*Internally, Reselect does something like this:const firstArg = selectItems(state, 42); const secondArg = selectItemId(state, 42); const result = outputSelector(firstArg, secondArg); return result; */Because of this, it's important that all of the "input selectors" you provide should accept the same types of parameters. Otherwise, the selectors will break.const selectItems = state => state.items// expects a number as the second argumentconst selectItemId = (state, itemId) => itemId// expects an object as the second argumentconst selectOtherField = (state, someObject) => someObject.someFieldconst selectItemById = createSelector( [selectItems, selectItemId, selectOtherField], (items, itemId, someField) => items[itemId])In this example, selectItemId expects that its second argument will be some simple value, while selectOtherField expects that the second argument is an object. If you call selectItemById(state, 42), selectOtherField will break because it's trying to access 42.someField.Reselect Usage Patterns and Limitations​Nesting Selectors​It's possible to take selectors generated with createSelector, and use them as inputs for other selectors as well. In this example, the selectCompletedTodos selector is used as an input to selectCompletedTodoDescriptions:const selectTodos = state => state.todosconst selectCompletedTodos = createSelector([selectTodos], todos => todos.filter(todo => todo.completed))const selectCompletedTodoDescriptions = createSelector( [selectCompletedTodos], completedTodos => completedTodos.map(todo => todo.text))Passing Input Parameters​A Reselect-generated selector function can be called with as many arguments as you want: selectThings(a, b, c, d, e). However, what matters for re-running the o'''
