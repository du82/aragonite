title = "Redux Essentials, Part 5: Async Logic and Data Fetching | Redux"
description = "The official Redux Essentials tutorial: learn how async logic works in Redux apps"
full_description = '''TutorialsRedux EssentialsAsync Logic and Data FetchingOn this pageRedux Essentials, Part 5: Async Logic and Data FetchingWhat You'll LearnHow to use the Redux "thunk" middleware for async logicPatterns for handling async request stateHow to use the Redux Toolkit createAsyncThunk API to manage async callsPrerequisitesFamiliarity with using HTTP requests to fetch and update data from a server REST APIIntroduction​In Part 4: Using Redux Data, we saw how to use multiple pieces of data from the Redux store inside of React components, customize the contents of action objects before they're dispatched, and handle more complex update logic in our reducers.So far, all the data we've worked with has been directly inside of our React client application. However, most real applications need to work with data from a server, by making HTTP API calls to fetch and save items.In this section, we'll convert our social media app to fetch the posts and users data from an API, and add new posts by saving them to the API.tipRedux Toolkit includes the RTK Query data fetching and caching API. RTK Query is a purpose built data fetching and caching solution for Redux apps, and can eliminate the need to write any additional Redux logic like thunks or reducers to manage data fetching. We specifically teach RTK Query as the default approach for data fetching.RTK Query is built on the same patterns shown in this page, so this section will help you understand the underlying mechanics of how data fetching works with Redux.We'll cover how to use RTK Query starting in Part 7: RTK Query Basics.Example REST API and Client​To keep the example project isolated but realistic, the initial project setup already includes a fake in-memory REST API for our data (configured using the Mock Service Worker mock API tool). The API uses /fakeApi as the base URL for the endpoints, and supports the typical GET/POST/PUT/DELETE HTTP methods for /fakeApi/posts, /fakeApi/users, and fakeApi/notifications. It's defined in src/api/server.ts.The project also includes a small HTTP API client object that exposes client.get() and client.post() methods, similar to popular HTTP libraries like axios. It's defined in src/api/client.ts.We'll use the client object to make HTTP calls to our in-memory fake REST API for this section.Also, the mock server has been set up to reuse the same random seed each time the page is loaded, so that it will generate the same list of fake users and fake posts. If you want to reset that, delete the 'randomTimestampSeed' value in your browser's Local Storage and reload the page, or you can turn that off by editing src/api/server.ts and setting useSeededRNG to false.infoAs a reminder, the code examples focus on the key concepts and changes for each section. See the CodeSandbox projects and the tutorial-steps branch in the project repo for the complete changes in the application.Using Middleware to Enable Async Logic​By itself, a Redux store doesn't know anything about async logic. It only knows how to synchronously dispatch actions, update the state by calling the root reducer function, and notify the UI that something has changed. Any asynchronicity has to happen outside the store.But, what if you want to have async logic interact with the store by dispatching actions, checking the current store state, or some kind of side effect? That's where Redux middleware come in. They extend the store to add additional capabilities, and allow you to:Execute extra logic when any action is dispatched (such as logging the action and state)Pause, modify, delay, replace, or halt dispatched actionsWrite extra code that has access to dispatch and getStateTeach dispatch how to accept other values besides plain action objects, such as functions and promises, by intercepting them and dispatching real action objects insteadWrite code that uses async logic or other side effectsThe most common reason to use middleware is to allow different kinds of async logic to interact with the store. This allows you to write code that can dispatch actions and check the store state, while keeping that logic separate from your UI.Middleware and the Redux StoreFor more details on how middleware let you customize the Redux store, see:Redux Fundamentals, Part 4: Store > MiddlewareMiddleware and Redux Data Flow​Earlier, we saw what the synchronous data flow for Redux looks like.Middleware update the Redux data flow by adding an extra step at the start of dispatch. That way, middleware can run logic like HTTP requests, then dispatch actions. That makes the async data flow look like this:Thunks and Async Logic​There are many kinds of async middleware for Redux, and each lets you write your logic using different syntax. The most common async middleware is redux-thunk, which lets you write plain functions that may contain async logic directly. Redux Toolkit's configureStore function automatically sets up the thunk middleware by default, and we recommend using thunks as a standard approach for writing async logic with Redux.What is a "Thunk"?The word "thunk" is a programming term that means "a piece of code that does some delayed work".For more details on how to use Redux thunks, see the thunk usage guide page:Using Redux: Writing Logic with Thunksas well as these posts:What the heck is a thunk?Thunks in Redux: the basicsThunk Functions​Once the thunk middleware has been added to the Redux store, it allows you to pass thunk functions directly to store.dispatch. A thunk function will always be called with (dispatch, getState) as its arguments, and you can use them inside the thunk as needed.A thunk function can contain any logic, sync or async.Thunks typically dispatch plain actions using action creators, like dispatch(increment()):const store = configureStore({ reducer: counterReducer })const exampleThunkFunction = ( dispatch: AppDispatch, getState: () => RootState) => { const stateBefore = getState() console.log(`Counter before: ${stateBefore.counter}`) dispatch(increment()) const stateAfter = getState() console.log(`Counter after: ${stateAfter.counter}`)}store.dispatch(exampleThunkFunction)For consistency with dispatching normal action objects, we typically write these as thunk action creators, which return the thunk function. These action creators can take arguments that can be used inside the thunk.const logAndAdd = (amount: number) => { return (dispatch: AppDispatch, getState: () => RootState) => { const stateBefore = getState() console.log(`Counter before: ${stateBefore.counter}`) dispatch(incrementByAmount(amount)) const stateAfter = getState() console.log(`Counter after: ${stateAfter.counter}`) }}store.dispatch(logAndAdd(5))Thunks are typically written in "slice" files, since the thunk data fetching is usually conceptually related to a particular slice's update logic. We'll look at a couple different ways to define thunks as we go through this section.Writing Async Thunks​Thunks may have async logic inside of them, such as setTimeout, Promises, and async/await. This makes them a good place to put HTTP calls to a server API.Data fetching logic for Redux typically follows a predictable pattern:A "start" action is dispatched before the request, to indicate that the request is in progress. This may be used to track loading state to allow skipping duplicate requests or show loading indicators in the UI.The async request is made with fetch or a wrapper library, with a promise for the resultWhen the request promise resolves, the async logic dispatches either a "success" action containing the result data, or a "failure" action containing error details. The reducer logic clears the loading state in both cases, and either processes the result data from the success case, or stores the error value for potential display.These steps are not required, but are commonly used. (If all you care about is a successful result, you can just dispatch a single "success" action when the request finishes, and skip the "start" and "failure" actions.)Redux Toolkit provides a createAsyncThunk API to implement the creation and dispatching of actions describing an async request.Basic createAsyncThunk usage looks like this:createAsyncThunk exampleimport { createAsyncThunk } from '@reduxjs/toolkit'export const fetchItemById = createAsyncThunk( 'items/fetchItemById', async (itemId: string) => { const item = await someHttpRequest(itemId) return item })See this details section for more info on how createAsyncThunk simplifies the code for dispatching actions for async requests. We'll see how it gets used in practice shortly.Detailed Explanation: Dispatching Request Status Actions in ThunksIf we were to write out the code for a typical async thunk by hand, it might look like this:const getRepoDetailsStarted = () => ({ type: 'repoDetails/fetchStarted'})const getRepoDetailsSuccess = (repoDetails: RepoDetails) => ({ type: 'repoDetails/fetchSucceeded', payload: repoDetails})const getRepoDetailsFailed = (error: any) => ({ type: 'repoDetails/fetchFailed', error})const fetchIssuesCount = (org: string, repo: string) => { return async (dispatch: AppDispatch) => { dispatch(getRepoDetailsStarted()) try { const repoDetails = await getRepoDetails(org, repo) dispatch(getRepoDetailsSuccess(repoDetails)) } catch (err) { dispatch(getRepoDetailsFailed(err.toString())) } }}However, writing code using this approach is tedious. Each separate type of request needs repeated similar implementation:Unique action types need to be defined for the three different casesEach of those action types usually has a corresponding action creator functionA thunk has to be written that dispatches the correct actions in the right sequencecreateAsyncThunk abstracts this pattern by generating the action types and action creators, and generating a thunk that dispatches those actions automatically. You provide a callback function that makes the async call and returns a Promise with the result.It's also easy to make mistakes with error handling when writing thunk logic yourself. In this case, the try block will actually catch errors from both a failed request, and any errors while dispatching. Handling this correctly would require restructuring the logic to separate those. createAsyncThunk already handles errors correctly for you internally.Typing Redux Thunks​Typing Handwritten Thunks​If you're writing a thunk by hand, you can declare explicitly type the thunk arguments as (dispatch: AppDispatch, getState: () => RootState). Since this is common, you can also define a reusable AppThunk type and use that instead:app/store.tsimport { Action, ThunkAction, configureStore } from '@reduxjs/toolkit'// omit actual store setup// Infer the type of `store`export type AppStore = typeof store// Infer the `AppDispatch` type from the store itselfexport type AppDispatch = typeof store.dispatch// Same for the `RootState` typeexport type RootState = ReturnType<typeof store.getState>// Export a reusable type for handwritten thunksexport type AppThunk = ThunkAction<void, RootState, unknown, Action>Then you can use that to describe the thunk functions you're writing:Example typed thunk// Use `AppThunk` as the return type, since we return a thunk functionconst logAndAdd = (amount: number): AppThunk => { return (dispatch, getState) => { const stateBefore = getState() console.log(`Counter before: ${stateBefore.counter}`) dispatch(incrementByAmount(amount)) const stateAfter = getState() console.log(`Counter after: ${stateAfter.counter}`) }}Typing createAsyncThunk​For createAsyncThunk specifically: if your payload function accepts an argument, provide a type for that argument, like async (userId: string). You do not need to provide a return type by default - TS will infer the return type automatically.If you need to access dispatch or getState inside of createAsyncThunk, RTK provides a way to define a "pre-typed" version that has the correct dispatch and getStatetypes built in by calling createAsyncThunk.withTypes(), equivalent to how we defined pre-typed versions of useSelector and useDispatch. We'll create a new src/app/withTypes files, and export it from there:app/withTypes.tsimport { createAsyncThunk } from '@reduxjs/toolkit'import type { RootState, AppDispatch } from './store'export const createAppAsyncThunk = createAsyncThunk.withTypes<{ state: RootState dispatch: AppDispatch}>()Typing ThunksFor more details on defining thunks with TypeScript, see:Type Checking Redux ThunksLoading Posts​So far, our postsSlice has used some hardcoded sample data as its initial state. We're going to switch that to start with an empty array of posts instead, and then fetch a list of posts from the server.In order to do that, we're going to have to change the structure of the state in our postsSlice, so that we can keep track of the current state of the API request.Loading State for Requests​When we make an API call, we can view its progress as a small state machine that can be in one of four possible states:The request hasn't started yetThe request is in progressThe request succeeded, and we now have the data we needThe request failed, and there's probably an error messageWe could track that information using some booleans, like isLoading: true, but it's better to track these states as a single enum value. A good pattern for this is to have a state section that looks like this (using TypeScript type notation):{ // Multiple possible status enum values status: 'idle' | 'pending' | 'succeeded' | 'failed', error: string | null}These fields would exist alongside whatever actual data is being stored. These specific string state names aren't required - feel free to use other names if you want, like 'loading' instead of 'pending', or 'completed' instead of 'succeeded'.We can use this information to decide what to show in our UI as the request progresses, and also add logic in our reducers to prevent cases like loading data twice.Let's update our postsSlice to use this pattern to track loading state for a "fetch posts" request. We'll switch our state from being an array of posts by itself, to look like {posts, status, error}. We'll also remove the old sample post entries from our initial state, and add a couple new selectors for the loading and error fields:features/posts/postsSlice.tsimport { createSlice, nanoid } from '@reduxjs/toolkit'// omit reactions and other typesinterface PostsState { posts: Post[] status: 'idle' | 'pending' | 'succeeded' | 'failed' error: string | null}const initialState: PostsState = { posts: [], status: 'idle', error: null}const postsSlice = createSlice({ name: 'posts', initialState, reducers: { postAdded: { reducer(state, action: PayloadAction<Post>) { state.posts.push(action.payload) }, prepare(title: string, content: string, userId: string) { // omit prepare logic } }, postUpdated(state, action: PayloadAction<PostUpdate>) { const { id, title, content } = action.payload const existingPost = state.posts.find(post => post.id === id) if (existingPost) { existingPost.title = title existingPo'''
