["https://redux.js.org/usage/structuring-reducers/reusing-reducer-logic"]
title = "Reusing Reducer Logic | Redux"
description = "Structuring Reducers > Reusing Reducer Logic: Patterns for creating reusable reducers"
full_description = '''Using ReduxRedux Logic and PatternsStructuring ReducersReusing Reducer LogicOn this pageReusing Reducer LogicAs an application grows, common patterns in reducer logic will start to emerge. You may find several parts of your reducer logic doing the same kinds of work for different types of data, and want to reduce duplication by reusing the same common logic for each data type. Or, you may want to have multiple "instances" of a certain type of data being handled in the store. However, the global structure of a Redux store comes with some trade-offs: it makes it easy to track the overall state of an application, but can also make it harder to "target" actions that need to update a specific piece of state, particularly if you are using combineReducers.As an example, let's say that we want to track multiple counters in our application, named A, B, and C. We define our initial counter reducer, and we use combineReducers to set up our state:function counter(state = 0, action) { switch (action.type) { case 'INCREMENT': return state + 1 case 'DECREMENT': return state - 1 default: return state }}const rootReducer = combineReducers({ counterA: counter, counterB: counter, counterC: counter})Unfortunately, this setup has a problem. Because combineReducers will call each slice reducer with the same action, dispatching {type : 'INCREMENT'} will actually cause all three counter values to be incremented, not just one of them. We need some way to wrap the counter logic so that we can ensure that only the counter we care about is updated.Customizing Behavior with Higher-Order Reducers​As defined in Splitting Reducer Logic, a higher-order reducer is a function that takes a reducer function as an argument, and/or returns a new reducer function as a result. It can also be viewed as a "reducer factory". combineReducers is one example of a higher-order reducer. We can use this pattern to create specialized versions of our own reducer functions, with each version only responding to specific actions.The two most common ways to specialize a reducer are to generate new action constants with a given prefix or suffix, or to attach additional info inside the action object. Here's what those might look like:function createCounterWithNamedType(counterName = '') { return function counter(state = 0, action) { switch (action.type) { case `INCREMENT_${counterName}`: return state + 1 case `DECREMENT_${counterName}`: return state - 1 default: return state } }}function createCounterWithNameData(counterName = '') { return function counter(state = 0, action) { const { name } = action if (name !== counterName) return state switch (action.type) { case `INCREMENT`: return state + 1 case `DECREMENT`: return state - 1 default: return state } }}We should now be able to use either of these to generate our specialized counter reducers, and then dispatch actions that will affect the portion of the state that we care about:const rootReducer = combineReducers({ counterA: createCounterWithNamedType('A'), counterB: createCounterWithNamedType('B'), counterC: createCounterWithNamedType('C')})store.dispatch({ type: 'INCREMENT_B' })console.log(store.getState())// {counterA : 0, counterB : 1, counterC : 0}function incrementCounter(type = 'A') { return { type: `INCREMENT_${type}` }}store.dispatch(incrementCounter('C'))console.log(store.getState())// {counterA : 0, counterB : 1, counterC : 1}We could also vary the approach somewhat, and create a more generic higher-order reducer that accepts both a given reducer function and a name or identifier:function counter(state = 0, action) { switch (action.type) { case 'INCREMENT': return state + 1 case 'DECREMENT': return state - 1 default: return state }}function createNamedWrapperReducer(reducerFunction, reducerName) { return (state, action) => { const { name } = action const isInitializationCall = state === undefined if (name !== reducerName && !isInitializationCall) return state return reducerFunction(state, action) }}const rootReducer = combineReducers({ counterA: createNamedWrapperReducer(counter, 'A'), counterB: createNamedWrapperReducer(counter, 'B'), counterC: createNamedWrapperReducer(counter, 'C')})You could even go as far as to make a generic filtering higher-order reducer:function createFilteredReducer(reducerFunction, reducerPredicate) { return (state, action) => { const isInitializationCall = state === undefined; const shouldRunWrappedReducer = reducerPredicate(action) || isInitializationCall; return shouldRunWrappedReducer ? reducerFunction(state, action) : state; }}const rootReducer = combineReducers({ // check for suffixed strings counterA : createFilteredReducer(counter, action => action.type.endsWith('_A')), // check for extra data in the action counterB : createFilteredReducer(counter, action => action.name === 'B'), // respond to all 'INCREMENT' actions, but never 'DECREMENT' counterC : createFilteredReducer(counter, action => action.type === 'INCREMENT')};These basic patterns allow you to do things like having multiple instances of a smart connected component within the UI, or reuse common logic for generic capabilities such as pagination or sorting.In addition to generating reducers this way, you might also want to generate action creators using the same approach, and could generate them both at the same time with helper functions. See Action/Reducer Generators and Reducers libraries for action/reducer utilities.Collection / Item Reducer Pattern​This pattern allows you to have multiple states and use a common reducer to update each state based on an additional parameter inside the action object.function counterReducer(state, action) { switch(action.type) { case "INCREMENT" : return state + 1; case "DECREMENT" : return state - 1; }}function countersArrayReducer(state, action) { switch(action.type) { case "INCREMENT": case "DECREMENT": return state.map( (counter, index) => { if(index !== action.index) return counter; return counterReducer(counter, action); }); default: return state; }}function countersMapReducer(state, action) { switch(action.type) { case "INCREMENT": case "DECREMENT": return { ...state, state[action.name] : counterReducer(state[action.name], action) }; default: return state; }}Edit this pageLast updated on Apr 16, 2022'''
