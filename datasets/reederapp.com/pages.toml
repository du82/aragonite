title = "Reeder Help"
full_description = "Configuration Synced Scroll Positions Shared Feeds Filters Folders Built-in Tags Saved Links Automatic Reader View Your Data URL Scheme FAQ What's Next Privacy Policy Configuration ↑ Feed and tag optionsIn addition to the in-app Settings, Reeder offers various feed and tag-specific settings. To access these, right-click or long-press (iOS) an entry in the source list. For tags, you can optionally display an item count by enabling the Show Item Counts option in Settings → General. Display & LayoutReeder provides a variety of display and layout options, which you can find under Display & Layout in the settings. Additionally, on Mac and iPad, you can adjust the column sizes by dragging the column dividers. Default AppsChoose the app Reeder should use to open links externally. Based on the content type, Reeder will automatically open the link in your selected app. I’m sure I’ve missed some apps, so if you don’t see an app listed, feel free to send a feature request. Please note that I can only add apps that support opening specific content via a link or URL scheme. Synced Scroll Positions ↑ Tracking what you’ve read is based on your scroll position, rather than traditional read/unread states. Scroll positions are synced at every level — not just for your Home timeline, but also for filters, folders, groups and individual feeds. The idea is to also let you read by content type, so you don’t have to rely solely on scrolling through your Home timeline to track what you’ve read. Shared Feeds ↑ This feature is only available to subscribers. Shared Feeds let you to turn any tag (including Links, Favorites, Later and Bookmarks) into a public, auto-updating JSON feed that you can share with anyone. This can be enabled on a per-tag basis. To access the settings, right-click or long-press (iOS) a tag entry in the source list. Once enabled, you will get a link to view the collection in a browser, as well as a JSON feed link that can be added to any RSS reader that supports JSON feeds. These feeds are hosted on reederapp.net Note: A shared feed currently includes a maximum of the last 50 items added to the tag. Filters ↑ Filters let you create custom timelines by including or excluding posts based on keywords, media types or feed types. The Audio and Video timelines under Home are examples of filters. To create a new filter, click or tap the + icon in the toolbar. To edit a filter, right-click or long-press (iOS) its entry in the source list. Filters also save and sync your scroll position (see Synced Scroll Positions). Folders ↑ Reeder automatically creates groups for your feeds based on content type. In addition to these automatic groups, you can create your own custom folders, allowing you to mix feeds of different types. To create a folder, click or tap the + icon in the toolbar. To add a feed to a folder, right-click or long-press a feed entry in the source list and select the desired folder. Folders also save and sync your scroll position (see Synced Scroll Positions). Built-in Tags ↑ Reeder comes with three built-in tags: Later Bookmarks and Favorites While these tags don’t offer additional functionality compared to regular tags, they appear in toolbars for quick access and have dedicated keyboard shortcuts:L B and F Customizing Built-in TagsYou can personalize these tags by renaming them or assigning custom icons, making them better suited to your workflow. Saved Links ↑ All your saved links are stored in the Links folder within the Saved section. This folder exists because links usually don’t belong to a specific feed and are excluded from your Home Timeline. The Links folder ensures that you can always easily access and find all your saved links. Important Note: Deleting a link will remove it from Reeder entirely, including from the Links folder and any tags where it is saved. SavingYou can save links from outside of Reeder using the Add to Reeder share extension. Please note that iCloud for Reeder must be enabled for this feature to work. On macOS: You may also need to enable the extension by going toSystem Settings → Privacy & Security → Extensions → Sharing. Reading By default, saved links open in the in-app browser. Similar to feeds, there’s also an option to open Saved Links with Reader View by default (see Automatic Reader View). Automatic Reader View ↑ You can enable Automatic Reader View for the Links collection or on a per-feed basis. Just right-click or long-press (iOS) an entry in the source list to access its settings. Your Data ↑ Saved ItemsSaved items from any tag can be exported as a JSON file, which is compatible with the JSON Feed format. To export, simply right-click or long-press (iOS) on any tag entry in the source list. URL Scheme ↑ reed://Opens Reeder. reed://feed-url.comOpens Reeder and automatically searches for a feed at the specified URL (feed-url.com). This works like the feed URL scheme, but it doesn’t require Reeder to be set as the default handler. FAQ ↑ I can’t add my Bluesky account with 2FA enabled. Currently, Reeder does not support 2FA for Bluesky accounts. To connect your account, you’ll need to create an “App Password.” You can do this by going to bsky.app → Settings → Privacy and Security. Use the app password you just created to sign in and make sure you’re using your email or full Bluesky username (e.g., user.bsky.social) as the login. Why is refreshing feeds slower? Reeder Classic with iCloud sync shows new items instantly. Refreshing feeds shouldn’t be slower. The new Reeder waits until the refresh is fully complete before displaying new items. This prevents your scroll position from jumping ahead if you scroll while older items are still being fetched. You can use the diagnostics tool to track down feeds that take longer to fetch, which may slow down the overall refresh (see Settings → Diagnostics). Is the old version of Reeder being discontinued? No, the old version of Reeder is not being discontinued. It will remain available as Reeder Classic for users who prefer a more traditional RSS reader experience and it will, of course, continue to receive updates. Reeder Classic will also remain a one-time purchase with no subscription required. Changing the business model for this existing app wouldn't feel right and I have no plans to do so. Why keep the name Reeder for a brand new app? I rebuilt it to make it the Reeder I enjoy using myself. I understand it may not meet everyone's needs just yet, but this new app will continue to improve over the coming months with new features and enhancements based on user feedback. Why is the new Reeder a subscription instead of a one-time purchase? As a solo developer, a subscription model allows me to continuously improve Reeder without the challenges of delivering major paid updates every few years. With a paid update model, I need to balance maintaining the existing app while also working on a large update to justify a new purchase. By using a subscription, I can focus on providing regular, incremental updates and enhancements, ensuring you always have access to the latest features and improvements. For pricing, I’ve tried to set a rate that’s fair to subscribers and sustainable for me. At $1 per month or $10 per year, I think this strikes the right balance. One subscription covers all your devices — iPhone, iPad, and Mac. What features are included in the free version? The free version of Reeder includes nearly all of its features, with a few limitations: No Shared FeedsThe ability to create shared feeds is not available. No Home timelinesYou can't add your Home timelines from Mastodon, Bluesky or Micro.blog. Limited to 10 feedsYou can subscribe to a maximum of 10 feeds, which also means OPML Import is not available to prevent exceeding this limit. Why doesn't Reeder sync everything? Reeder syncs only what's essential — your subscriptions, timeline position and tagged items — to ensure faster and more efficient syncing. Uploading every item fetched by Reeder to iCloud would unnecessarily slow down the process. This is also one of the reasons why there are no unread counts or read/unread states, as maintaining accurate counts across all devices would require full syncing. Why doesn't this version of Reeder support third-party sync services? With the new Reeder, tracking what you've read is based on your scroll position rather than traditional read/unread states. This design makes integration with most third-party sync services non-trivial, so support for these services is not currently planned. Why are items sometimes missing or appear in a different order on my devices? While this shouldn't happen often, it can occur because Reeder fetches content directly from the source feed. There are a few reasons why items may appear differently: Published Dates: Sometimes, the published date of an item in a feed is older than the actual date it was added to the feed. If a new item's published date is earlier than your current timeline position, Reeder may adjust its position (without changing the published date) to ensure you don't miss it. Feed Changes: Occasionally, an item might be present in a feed when refreshing on one device, but removed from the feed before refreshing on another device. This can cause discrepancies between devices. What's Next ↑ With this app being rebuilt from the ground up, I’d like to try something new by sharing what I have planned for future updates. Please note that the order of items doesn’t reflect priority. Notes for items → Shared Feeds More display & layout options More keyboard shortcuts Export of your feed list → See Settings → Your Data in Reeder 2025.2.1 Smart feeds → See Filters in Reeder 2025.2 Privacy Policy ↑ Except for data collected by Apple, such as when you have enabled Share with Developers, Reeder does not collect any data. No personal information, usage data or any other information is collected — nothing. iCloudReeder uses iCloud for syncing, with all synced data securely stored in your iCloud account. Shared FeedsShared feeds are hosted on reederapp.net and are publicly accessible, which is the intended purpose of this feature. Third-party services This policy does not apply to third-party services you use with Reeder. You can consult the relevant privacy policies on the websites of any services you are using with Reeder."
