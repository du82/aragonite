full_description = '''Can You Spot the Passive Voice?This exercise tests your ability to recognize the passive voice in the context of developing software.For each sentence, click:Active ⚡ if the sentence has no passive voice (active voice only)Passive 😴 if the sentence contains passive voice StartDoes this sentence contain passive voice? Passive 😴 Active ⚡ Next QuestionAccuracy: 0%Your ResultsCorrect answers: 0 ✅Incorrect answers: 0 ❌A score of 0% was achieved on this passive voice quiz (by you)..card{box-shadow:0 4px 8px rgba(0,0,0,.1)}.btn-lg{font-size:1.5rem;transition:transform .15s ease-in-out}.btn-lg:hover{transform:scale(1.05)}.sample-text{background-color:#f8f9fa;border:1px solid rgba(0,0,0,.1);transition:background-color .15s ease-in-out}.sample-text:hover{background-color:#f0f1f2}.alert{font-size:1.1rem;line-height:1.6}progress{height:10px;border-radius:5px;overflow:hidden}progress::-webkit-progress-bar{background-color:#f0f0f0;border-radius:5px}progress::-webkit-progress-value{background-color:#198754;transition:width .5s ease-in-out}progress::-moz-progress-bar{background-color:#198754;border-radius:5px;transition:width .5s ease-in-out}const questions=[{sentence:"Steve downloaded the file.",containsPassiveVoice:!1,explanation:`This sentence is classic active voice because it has the form actor -> verb -> object.`},{sentence:"The file was downloaded.",containsPassiveVoice:!0,explanation:`This sentence is in the passive voice because. "was downloaded" is the verb "to be" ("was") followed by a verb ("downloaded"). Also, there's no actor, as the sentence doesn't say who downloaded the file.`},{sentence:"We haven't compiled that library in two years.",containsPassiveVoice:!1,explanation:`It's active voice. Even though "compiled" is the past participle of a verb, it doesn't follow a form of the verb "to be." Note also that the actor "we" appears before the verb, which is more common in active voice.`},{sentence:"Who reviewed this code?",containsPassiveVoice:!1,explanation:`It's active voice. The word "reviewed" can be a past participle, but in this case, it's simple past tense. It also doesn't follow a form of the verb "to be". Even though the sentence takes the form of a question, "Who" is the actor for the verb "reviewed."`},{sentence:"This function is called whenever the program runs out of memory.",containsPassiveVoice:!0,explanation:`It contains both passive voice and active voice. "is called" is passive voice. "the program runs out of memory" is active voice.`},{sentence:"It's been six days since we received a reply from the dev ops team.",containsPassiveVoice:!1,explanation:`This sentence only contains active voice. The phrase, "It's been" sounds a bit like passive voice, but passive voice requires a form of the verb "to be" and a past participle. In the sentence above, there's only a form of the verb to be as "it's been" is a contraction of "it has been." In the second half of the sentence, "we" is the actor, "received" is the verb, and "a reply from the dev ops team" is the object, so that part is active voice as well.`},{sentence:"The server only receives requests that are sent from our private network.",containsPassiveVoice:!0,explanation:`The sentence contains both passive voice and active voice. "The server only receives requests" is active voice. "are sent from our private network" is passive voice because it's a form of "to be" ("are") followed by the past participle of a verb ("sent"). The phrase is also missing an actor, as the sentence doesn't identify who sends the requests.`},{sentence:"What is the earliest date that results will be available from our user study?",containsPassiveVoice:!1,explanation:`The sentence is in active voice. "What is the earliest date" is active voice. "results will be available" is active voice, though you might mistake it for passive because "from our user study" follows the verb. But in the sentence, "results" is the actor and "be available" is the verb.`}];let currentQuestion=0,correctAnswers=0,totalAnswered=0;function showElement(e){document.getElementById(e).classList.remove("d-none")}function hideElement(e){document.getElementById(e).classList.add("d-none")}function isQuizComplete(){return currentQuestion>=questions.length}function isLastQuestion(){return currentQuestion===questions.length-1}function updateProgress(){const e=totalAnswered/questions.length*100,t=document.getElementById("progress-bar");t.value=e}function celebrate(){const e=3e3,s=Date.now()+e,t={startVelocity:30,spread:360,ticks:60,zIndex:0};function n(e,t){return Math.random()*(t-e)+e}const o=setInterval(function(){const i=s-Date.now();if(i<=0)return clearInterval(o);const a=50*(i/e);confetti({...t,particleCount:a,origin:{x:n(.1,.3),y:Math.random()-.2}}),confetti({...t,particleCount:a,origin:{x:n(.7,.9),y:Math.random()-.2}})},250)}function startGame(){hideElement("intro-screen"),showElement("game-screen"),showQuestion(),initTooltips()}function initTooltips(){const e=document.querySelectorAll('[data-bs-toggle="tooltip"]'),t=[...e].map(e=>new bootstrap.Tooltip(e))}function updateScore(){const e=totalAnswered===0?0:Math.round(correctAnswers/totalAnswered*100);document.getElementById("score").textContent=e}function showQuestion(){if(isQuizComplete())return;document.getElementById("sentence").textContent=questions[currentQuestion].sentence,hideElement("feedback-container");const e=document.getElementById("answer-buttons");e.classList.remove("d-none");const t=e.querySelectorAll("button");t.forEach(e=>{e.disabled=!1;const t=e.textContent.includes("Active");e.classList.remove("btn-success","btn-danger","btn-primary"),e.classList.add(t?"btn-success":"btn-danger")})}function checkAnswer(e){const s=questions[currentQuestion],t=e==="passive"===s.containsPassiveVoice,i=document.getElementById("feedback-container"),n=i.querySelector(".alert"),a=document.getElementById("next-button"),r=document.getElementById("answer-buttons");totalAnswered++,t&&correctAnswers++,updateScore(),updateProgress(),r.classList.add("d-none");const o=s.explanation.split(/\n\s*\n/).map(e=>e.trim()).map(e=>e.replace(/^\s+/gm,"")),c=t?"Correct!":"Incorrect!",l=` <p class="fw-bold mb-4">${c}</p> ${o.map((e,t)=>`<p class="${t===o.length-1?"mb-0":""}">${e}</p>`).join("")} `;n.classList.remove("alert-success","alert-danger"),n.classList.add(t?"alert-success":"alert-danger"),n.innerHTML=l,isLastQuestion()&&(a.textContent="See final score"),showElement("feedback-container")}function nextQuestion(){if(currentQuestion++,isQuizComplete()){hideElement("game-screen"),showElement("final-screen"),showElement("exercise-comments"),document.getElementById("final-correct").textContent=correctAnswers,document.getElementById("final-incorrect").textContent=questions.length-correctAnswers;const e=Math.round(correctAnswers/questions.length*100);document.getElementById("final-percentage").textContent=e,e>=75&&celebrate();return}showQuestion()}'''
