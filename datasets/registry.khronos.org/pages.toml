["https://registry.khronos.org"]
title = "Khronos Registry - The Khronos Group Inc"
full_description = "The Khronos registry contains specifications, header files, extension specifications, enumerant and function registries, and other related documentation for Khronos APIs, Languages, and related products. The Khronos API Implementers Guide, available in HTML and PDF versions, provides guidelines for implementers of OpenGL ES, OpenVG and other API standards specified by the Khronos Group. The aim of these hints is to provide commonality between implementations to ease the logistical problems faced by developers using multiple different implementations of an API. One of the primary goals is to allow an application binary to run on top of multiple different OpenGL ES / OpenVG / EGL implementations on the same platform. Implementers are strongly urged to comply with these guidelines. WebGL™ Registry (Note: the related TypedArray Registry defined functionality that is now part of the ECMAScript 2015 Language Specification, and has been removed from the Khronos website. Links to that registry now redirect to the corresponding section of the ECMAScript Specification.) Khronos APIs publish header files in their respective registry pages and/or in github repositories linked from those pages. Header files are often shipped as part of packages provided by operating system vendors, hardware vendors, or SDK suppliers. Note that if you download individual header files, several of the APIs depend on the shared header file <KHR/khrplatform.h> , which defines common datatypes and calling convention macros. Khronos welcomes comments and bug reports. To provide feedback on individual API registries, see the index pages for those APIs. To provide feedback on the top-level registry (which is just this index page and the Khronos Implementer's Guide), file an issue in the Registry-Root Github project."
year_published = 2025
clearnet = "https://registry.khronos.org"
