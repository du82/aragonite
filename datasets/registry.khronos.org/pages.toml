["https://registry.khronos.org/OpenCL"]
title = "Khronos OpenCL Registry - The Khronos Group Inc"
full_description = "The OpenCL registry contains formatted specifications of the OpenCL API, OpenCL C programming language, OpenCL SPIR-V environment, and OpenCL extensions. The OpenCL registry also includes header files, links to reference pages, reference cards, and other related documentation. The asciidoctor source for the specifications in this registry is available in the OpenCL-Docs GitHub repository. The OpenCL specifications are now unified so they describe OpenCL 3.0 and all previous versions of OpenCL, and include khr extensions integrated into the core API and C specification language. Khronos welcomes comments and bug reports. To provide feedback on the OpenCL reference pages, or on the OpenCL registry itself (such as reporting missing content, bad links, etc.), file an issue in the OpenCL-Registry GitHub repository. The extension template for writing an OpenCL extension specification shows the structure of vendor extension specifications in the registry (listed below) and serves as a guide for writing new extension specifications. The template describes the purpose of each section in an extension specification. cl.xml is the registry of reserved OpenCL API enumerant ranges. (Note that following this link will probably not render sensibly in browsers, since the file is not entirely valid XML, simply a manually updated placeholder.) Khronos khr extensions are now integrated into the core API and C language Specifications. These links are to the appropriate extension appendix of the OpenCL API Specification. khr extensions have been removed from the OpenCL Extensions specification, and that document will eventually be retired once its remaining content is integrated elsewhere."
year_published = 2025
clearnet = "https://registry.khronos.org/OpenCL"
