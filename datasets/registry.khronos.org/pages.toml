["https://registry.khronos.org/OpenGL"]
title = "Khronos Combined OpenGL Registry - The Khronos Group Inc"
full_description = "This site contains the API and Extension registries for the OpenGL family APIs - OpenGL, OpenGL ES, and OpenGL SC. It includes API specifications; specifications of Khronos- and vendor-approved extensions; header files corresponding to the specifications; the XML API Registry definining each API; and related tools and scripts. The web registry is backed by a github repository. Changes committed to the main branch of the repository are reflected on the website. The repository includes everything visible on the registry website - specifications, extensions, headers, XML, and the index pages such as this one - as well as additional documentation and scripts. Problems with the registry or with the underlying specifications may be reported as github Issues. In particular, the registry repository includes formal XML documents defining the APIs and enumerants used in OpenGL, OpenGL ES, OpenGL SC, GLX, and WGL. Changes to these files can be proposed to reserved enumerant ranges to vendors for future use, as well as to add interfaces for new extension APIs. A set of Python scripts are provided to load the XML files and process them into header files. See xml/README.adoc for more details of the API XML registry, how to obtain enumerant allocations, create extension specifications and register them, and other related topics."
year_published = 2025
clearnet = "https://registry.khronos.org/OpenGL"
