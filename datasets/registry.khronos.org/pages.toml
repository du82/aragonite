["https://registry.khronos.org/EGL"]
title = "Khronos EGL Registry - The Khronos Group Inc"
full_description = "The EGL registry contains specifications of the core API; specifications of Khronos- and vendor-approved EGL extensions; header files corresponding to the specifications; an enumerant and function registry; and other related documentation. The database from which EGL enumerant ranges are reserved and the EGL/egl.h and EGL/eglext.h headers are built is called egl.xml . It uses an XML schema and processing scripts shared with the OpenGL and OpenGL ES registries. If you need to generate modified headers or modify egl.xml, clone the EGL-Registry git repository and see the README.md file to get started. Khronos welcomes comments and bug reports. To provide feedback on the EGL registry itself (such as reporting missing content, bad links, etc.), or on the EGL API, extensions, and headers, file an issue in the EGL-Registry Github project."
year_published = 2025
