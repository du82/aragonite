["https://regular-expressions.info/tools.html"]
title = "Popular Tools, Utilities and Programming Languages That Support Regular Expressions"
description = "A list of popular tools, utilities and programming languages that provide support for regular expressions, and tips for using them"
full_description = "RegexBuddy - Learn, create, understand, test, use and save regular expressions. RegexBuddy makes working with regular expressions easier than ever before. RegexMagic - Generate regular expressions using RegexMagic’s powerful patterns instead of the cryptic regular expression syntax. There are a lot of applications these days that support regular expressions in one way or another, enhancing certain part of their functionality. But certain applications stand out from the crowd by implementing a full-featured Perl-style regular expression flavor and allowing regular expressions to be used instead of literal search terms throughout the application. EditPad Lite - Basic text editor that has all the essential features for text editing, including powerful regex-based search and replace. EditPad Pro - Convenient text editor with a powerful regex-based search and replace feature, as well as regex-based customizable syntax coloring and file navigation. If you are a programmer, you can save a lot of coding time by using regular expressions. With a regular expression, you can do powerful string parsing in only a handful lines of code, or maybe even just a single line. A regex is faster to write and easier to debug and maintain than dozens or hundreds of lines of code to achieve the same by hand. Boost - Free C++ source libraries with comprehensive regex support that was later standardized by C++11. But there are significant differences in Boost’s regex flavors and the flavors in std::regex implementations. Delphi - Delphi XE and later ship with RegularExpressions and RegularExpressionsCore units that wrap the PCRE library. For older Delphi versions, you can use the TPerlRegEx component, which is the unit that the RegularExpressionsCore unit is based on. Gnulib - Gnulib or the GNU Portability Library includes many modules, including a regex module. It implements both POSIX flavors, as well as these two flavors with added GNU extensions. Groovy - Groovy uses Java’s java.util.regex package for regular expressions support. Groovy adds only a few language enhancements that allow you to instantiate the Pattern and Matcher classes with far fewer keystrokes."
