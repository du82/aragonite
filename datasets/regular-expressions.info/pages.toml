full_description = "The simplest replacement text consists of only literal characters. Certain characters have special meanings in replacement strings and have to be escaped. Escaping rules may get a bit complicated when using replacement strings in software source code. Non-printable characters such as control characters and special spacing or line break characters are easier to enter using control character escapes or hexadecimal escapes. Reinserting the entire regex match into the replacement text allows a search-and-replace to insert text before and after regular expression matches without really replacing anything. Backreferences to named and numbered capturing groups in the regular expression allow the replacement text to reuse parts of the text matched by the regular expression. Some applications support special tokens in replacement strings that allow you to insert the subject string or the part of the subject string before or after the regex match. This can be useful when the replacement text syntax is used to collect search matches and their context instead of making replacements in the subject string. Some applications can insert the text matched by the regex or by capturing groups converted to uppercase or lowercase. Some applications can use one replacement or another replacement depending on whether a capturing group participated in the match. This allows you to use different replacements for different matches of the regular expression. | Introduction | Table of Contents | Characters | Matched Text & Backreferences | Context & Case Conversion | Conditionals | Regular Expressions Reference | Page URL: https://www.regular-expressions.info/refreplace.html Page last updated: 29 August 2024 Site last updated: 06 November 2024 Copyright © 2003-2024 Jan Goyvaerts. All rights reserved."
