["https://regular-expressions.info/bookrecipeswin.html"]
title = "Book Review: Regular Expression Recipes for Windows Developers by Nathan Good"
full_description = "When I saw the title of this book, I was excited at the prospect of a book filled with detailed regular expression examples. Unfortunately, it didn’t pan out that way. Spread over a whopping 359 pages, the book lists exactly 100 tasks that you can accomplish with a regular expression. As the solution, the author not only gives a regular expression, but also a complete source code snippet in C#, VB.NET, JavaScript and VBScript. Not all solutions have snippets in all languages. Some solutions also have a snippet for ASP.NET. Obviously, the examples have a heavy bias towards Windows and .NET. If you’re using open source languages, you may want to look at this book’s precursor Regular Expression Recipes instead. It’s essentially the same book, with almost the same list of recipes, but with examples in Perl, PHP and Python. Each recipe also has a “how it works” section, essentially transcribing the regular expression in English, similar in approach to RegexBuddy’s plain English regex trees, though the book uses a flat description rather than a tree. The descriptions are brief though. While all the source code snippets easily take up two or more pages per recipe, the explanation is often barely half a page long. The book does suffer from some sloppy editing. The regular expression in the source code snippets isn’t always identical to the one in the description. E.g. in recipe 6-21, the JavaScript snippet uses named capture. The explanation then proceeds to explain a regex without named capture. JavaScript does not support named capture. Most of these issues are trivial, but it isn’t good for a book that’s obviously aimed at beginners. Most of the recipes solve rather basic problems, organized in six chapters. The first, “Words and Text”, deals with finding blank lines, repeated words, words at the start or end of a line, etc. The “URLs and Paths” chapter has examples for finding URLs and file paths, and extracting bits from them. The “CSV and tab-delimited files” has a few recipes for converting between the two and extracting fields."
