["https://regular-expressions.info/vbscript.html"]
title = "VBScript RegExp Object - Using Regular Expressions with Client Side Scripting"
description = "Detailed description of the capabilities of the VBScript RegExp Object"
full_description = "VBScript has built-in support for regular expressions. If you use VBScript to validate user input on a web page at the client side, using VBScript’s regular expression support will greatly reduce the amount of code you need to write. Microsoft made some significant enhancements to VBScript’s regular expression support in version 5.5 of Internet Explorer. Version 5.5 implements quite a few essential regex features that were missing in previous versions of VBScript. Whenever this website mentions VBScript, the statements refer to VBScript’s version 5.5 regular expression support. Basically, Internet Explorer 5.5 implements the JavaScript regular expression flavor. But IE 5.5 did not score very high on web standards. There are quite a few differences between its implementation of JavaScript regular expressions and the actual standard. Fortunately, most are corner cases that are not likely to affect you. Therefore, everything said about JavaScript’s regular expression flavor on this website also applies to VBScript. Modern versions of IE still use the IE 5.5 implementation when rendering web pages in quirks mode. In standards mode, modern versions of IE follow the JavaScript standard very closely. VBScript regular expressions also still use the IE 5.5 implementation, even when a modern version of IE is installed. JavaScript and VBScript implement Perl-style regular expressions. However, they lack quite a number of advanced features available in Perl and other modern regular expression flavors: Version 1.0 of the RegExp object even lacks basic features like lazy quantifiers. This is the main reason this website does not discuss VBScript RegExp 1.0. All versions of Internet Explorer prior to 5.5 include version 1.0 of the RegExp object. There are no other versions than 1.0 and 5.5. You can use regular expressions in VBScript by creating one or more instances of the RegExp object. This object allows you to find regular expression matches in strings, and replace regex matches in strings with other strings. The functionality offered by VBScript’s RegExp object is pretty much bare bones. However, it’s more than enough for simple input validation and output formatting tasks typically done in VBScript."
