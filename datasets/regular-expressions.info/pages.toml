["https://regular-expressions.info/groovy.html"]
title = "Using Regular Expressions in Groovy"
description = "Learn how to use Groovy’s special syntax for regular expressions"
full_description = 'Because Groovy is based on Java, you can use Java’s regular expression package with Groovy. Simply put import java.util.regex.* at the top of your Groovy source code. Any Java code using regular expressions will then automatically work in your Groovy code too. Using verbose Java code to work with regular expressions in Groovy wouldn’t be very groovy. Groovy has a bunch of language features that make code using regular expressions a lot more concise. You can mix the Groovy-specific syntax with regular Java code. It’s all based in the java.util.regex package, which you’ll need to import regardless. Java has only one string style. Strings are placed between double quotes. Double quotes and backslashes in strings must be escaped with backslashes. That yields a forest of backslashes in literal regular expressions. Groovy has five string styles. Strings can be placed between single quotes, double quotes, triple single quotes, and triple double quotes. Using triple single or double quotes allows the string to span multiple lines, which is handy for free-spacing regular expressions. Unfortunately, all four of these string styles require backslashes to be escaped. The fifth string style is provided specifically for regular expressions. The string is placed between forward slashes, and only forward slashes (not backslashes) in the string need to be escaped. This is indeed a string style. Both /hello/ and "hello" are literal instances of java.lang.String. Unfortunately, strings delimited with forward slashes cannot span across lines, so you can’t use them for free-spacing regular expressions. To actually use a string as a regular expression, you need to instantiate the java.util.regex.Pattern class. To actually use that pattern on a string, you need to instantiate the java.util.regex.Matcher class. You use these classes in Groovy just like you do in Java. But Groovy does provide some special syntax that allows you to create those instances with much less typing. To create a Pattern instance, simply place a tilde before the string with your regular expression. The string can use any of Groovy’s five string styles. When assigning this pattern to a variable, make sure to leave a space between the assignment operator and the tilde.'
author = "Jan Goyvaerts"
year_published = 2025
clearnet = "https://regular-expressions.info/groovy.html"
