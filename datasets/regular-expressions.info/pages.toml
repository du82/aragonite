["https://regular-expressions.info/jgsoft.html"]
title = "The Just Great Software Regular Expression Engine"
description = "The Just Great Software regular expression engine provides a powerful blend of the most popular regular expression flavors"
full_description = "The Just Great Software (JGsoft) regular expression engine is designed and developed by Jan Goyvaerts, who is also the author of this regular expressions tutorial. This engine is the core of the Just Great Software products PowerGREP (version 3 and later), RegexBuddy (version 2 and later), and RegexMagic (all versions). It also powers the regular expression search functions in EditPad Pro (version 6 and later), EditPad Lite (version 7 and later), and AceText (version 2 and later). This engine and its regular expression flavor were specifically developed for PowerGREP, RegexBuddy, and RegexMagic. The JGsoft flavor offers a blend of all the features found in the most popular regular expression flavors. It fully supports Unicode and a wide range of legacy code pages. The engine in PowerGREP (version 3 and later) and EditPad Pro (version 7 and later) can process files larger than 4GB without splitting the files in arbitrary chunks. RegexBuddy and RegexMagic have a special version of the Just Great Software engine that can simulate the limitations and flavor-specific features of many other regular expression flavors. When you select a regex flavor in RegexBuddy or RegexMagic, all of their features use that flavor. Even the built-in grep. The Just Great Software engine is not available as a component that can be embedded into other applications. It was specifically designed to work within Just Great Software products, rather than as a general-purpose engine. Unless you’re developing a tool like PowerGREP or RegexBuddy in which regular expressions are the core functionality, the regex flavor already provided by your development environment will be more than sufficient. Just do your users a favor and state very clearly which regex flavor your application uses. Then they can easily look up the specifics on this site. PowerGREP 5 introduces a major new version of the JGsoft regex flavor, which we’ll call JGsoft V2. This flavor is also available in RegexBuddy 4 and RegexMagic 2 when you select PowerGREP 5 as your application. JGsoft V2 brings some significant new features. It also brings a few breaking changes."
