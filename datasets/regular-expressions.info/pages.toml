["https://regular-expressions.info/ruby.html"]
title = "Ruby Regexp Class - Regular Expressions in Ruby"
description = "Learn how to use regular expressions with Ruby and the Ruby Regexp class"
full_description = 'Ruby supports regular expressions as a language feature. In Ruby, a regular expression is written in the form of /pattern/modifiers where “pattern” is the regular expression itself, and “modifiers” are a series of characters indicating various options. The “modifiers” part is optional. This syntax is borrowed from Perl. Ruby supports the following modifiers: In Ruby, the caret and dollar always match before and after newlines. Ruby does not have a modifier to change this. Use \A and \Z to match at the start or the end of the string. Since forward slashes delimit the regular expression, any forward slashes that appear in the regex need to be escaped. E.g. the regex 1/2 is written as /1\/2/ in Ruby. /regex/ creates a new object of the class Regexp. You can assign it to a variable to repeatedly use the same regular expression, or use the literal regex directly. Ruby provides several different ways to test whether a particular regexp matches (part of) a string. The === method allows you to compare a regexp to a string. It returns true if the regexp matches (part of) the string or false if it does not. This allows regular expressions to be used in case statements. Do not confuse === (3 equals signs) with == (2 equals signs). == allows you to compare one regexp to another regexp to see if the two regexes are identical and use the same matching modes. The =~ method returns the character position in the string of the start of the match or nil if no match was found. In a boolean test, the character position evaluates to true and nil evaluates to false. So you can use =~ instead of === to make your code a little more easier to read as =~ is more obviously a regex matching operator. Ruby borrowed the =~ syntax from Perl. print(/\w+/ =~ "test") prints “0”. The first character in the string has index zero. Switching the order of the =~ operator’s operands makes no difference. The match() method returns a MatchData object when a match is found, or nil if no matches was found. In a boolean context, the MatchData object evaluates to true. In a string context, the MatchData object evaluates to the text that was matched. So print(/\w+/.match("test")) prints “test”.'
