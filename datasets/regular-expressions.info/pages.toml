["https://regular-expressions.info/xregexp.html"]
title = "XRegExp Regular Expression Library for JavaScript"
full_description = "XRegExp is an open source JavaScript library developed by Steven Levithan. It supports all modern browsers, as well as many older and even ancient browser versions. It can also be used on the server with Node.js. You can download XRegExp at xregexp.com. Using the XRegExp object instead of JavaScript’s built-in RegExp object provides you with an regular expression syntax with more features and fewer cross-browser inconsistencies. Notable added features include free-spacing, named capture, mode modifiers, and Unicode categories, blocks, and scripts. It also treats invalid escapes and non-existent backreferences as errors. XRegExp also provides its own replace() method with a replacement text syntax that is enhanced with named backreferences and no cross-browser inconsistencies. It also provides a split() method that is fully compliant with the JavaScript standard. To use XRegExp, first create a regular expression object with var myre = XRegExp('regex', 'flags') where flags is a combination of the letters g (global), i (case insensitive), m (anchors match at line breaks), s (dot matches line breaks), x (free-spacing), and n (explicit capture). XRegExp 3 adds the A (astral) flag which includes Unicode characters beyond U+FFFF when matching Unicode properties and blocks. The ECMAScript 6 flags y (sticky) and u (Unicode) can also be used in modern browsers that support them natively, but they’ll throw errors in browsers that don’t have built-in support for these flags. You can then pass the XRegExp instance you constructed to various XRegExp methods. It’s important to make the calls as shown below to get the full XRegExp functionality. The object returned by the XRegExp constructor is a native JavaScript RegExp object. That object’s methods are the browser’s built-in RegExp methods. You can replace the built-in RegExp methods with XRegExp’s methods by calling XRegExp.install('natives'). Doing so also affects RegExp objects constructed by the normal RegExp constructor or double-slashed regex literals."
