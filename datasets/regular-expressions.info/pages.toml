title = "EditPad Pro - Convenient Text Editor with Complete Support for Regular Expressions"
description = "EditPad Pro is a convenient text editor which supports regular expressions in its powerful search and replace functionality.  You can also create custom syntax coloring or highlighting schemes using regular expressions."
full_description = "EditPad Pro is one of the most powerful and convenient text editors available on the Microsoft Windows platform. You can use EditPad Pro all day long without it getting into the way of what you are trying to do. When you use search & replace and the spell checker functionality, for example, you do not get a nasty popup window blocking your view of the document you are working on, but a small, extra pane just below the text. If you often work with many files at the same time, you will save time with the tabbed interface and the Project functionality for opening and saving sets of related files. EditPad Pro doesn’t use a limited and outdated regular expression engine like so many other text editors do. EditPad Pro uses the same full-featured regular expression engine used by PowerGREP. EditPad Pro’s regex flavor is highly compatible with the flavors used by Perl, Java, .NET and many other modern Perl-style regular expression flavors. EditPad Pro integrates with RegexBuddy. You can instantly fire up RegexBuddy to edit the regex you want to use in EditPad Pro, select one from a RegexBuddy library, or generate one using RegexMagic. Pressing Ctrl+F in EditPad Pro will make the search and replace pane appear. Mark the box labeled “regular expressions” to enable regex mode. Type in the regex you want to search for, and hit the Find First or Find Next button. EditPad Pro will then highlight search match. If the search pane takes up too much space, simply close it after entering the regular expression. Press Ctrl+F3 to find the first match, or F3 to find the next one. When there are no further regex matches, EditPad Pro doesn’t interrupt you with a popup message that you have to OK. The text cursor and selection will simply stay where they were, and the find button that you clicked will flash briefly. This may seem a little subtle at first, but you’ll quickly appreciate EditPad Pro staying out of your way and keeping you productive. Replacing text is just as easy. First, type the replacement text, using backreferences if you want, in the Replace box. Search for the match you want to replace as above. To replace the current match, click the Replace button. To replace it and immediately search for the next match, click the Replace Next button. Or, click Replace All to get it over with."
