["https://regular-expressions.info/hipowls.html"]
title = "Book Review: Mastering Regular Expressions by Jeffrey Friedl"
full_description = "The first six chapters of the book (283 pages) deal with regular expressions in general. Don’t expect an easy-going tutorial here. While you could read “Mastering Regular Expressions” without prior knowledge on the subject, the book is really intended for people who already know the basics, and are ready to get the most out of regular expressions. You’ll get more out of the book if you read through the regular expressions tutorial on this website first to get some experience. The book doesn’t focus on teaching you how to use regular expressions at all. It focuses on how to use them efficiently. Expect lots of detailed information on how the regular expression engine works on the inside, and how to take advantage of this knowledge. The book also compares various regular expression flavors, and their subtle differences. Don’t expect any handy reference tables or examples ready for copy-and-paste. This book (certainly the first six chapters) is definitely meant to be read (or should I say: studied) cover to cover. If you need a quick fix, this book is not for you. If you want lots of practical real-world examples, buy Regular Expressions Cookbook from the same publisher instead. The final four chapters in this book each cover one of the four regex flavors that are probably the most widely used ones today. Though general programming books on these languages usually have a chapter devoted to regular expressions, you can’t compare those with the chapters in this books. Other books give you an incomplete introduction to the regular expression syntax (which Mastering Regular Expressions covers in the first 6 chapters), and explain which functions and classes to use for common regex functions. The four language chapters in Mastering Regular Expressions, however, focus on the pitfalls and special features of each of the languages. They’re too dense for programmers inexperienced with regular expressions or the programming language in question. But if you’re ready to master your programming language, they offer a wealth of information."
