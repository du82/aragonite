["https://regular-expressions.info/redos.html"]
title = "Preventing Regular Expression Denial of Service (ReDoS)"
description = "Make sure regular expressions don’t bring down your server or web application."
full_description = "The previous topic explains catastrophic backtracking with practical examples from the perspective of somebody trying to get their regular expressions to work and perform well on their own PC. You should understand those examples before reading this topic. It’s annoying when catastrophic backtracking happens on your PC. But when it happens in a server application with multiple concurrent users, it can really be catastrophic. Too many users running regexes that exhibit catastrophic backtracking will bring down the whole server. And “too many” need only be as few as the number of CPU cores in the server. If the server accepts regexes from the user, then the user can easily provide one that exhibits catastrophic backtracking on any subject. If the server accepts subject data from the user, then the user may be able to provide subjects that trigger catastrophic backtracking in regexes used by the server, if those regexes are predisposed to catastrophic backtracking. When the user can do either of those things, the server is susceptible to regular expression denial of service (ReDoS). When enough users (or one actor masquerading as many users) provide malicious regexes and/or subjects to match against, the server will be spending nearly all its CPU cycles on trying to match those regexes. If your application allows the user to provide their own regexes, then your only real defense is to use a text-directed regex engine. Those engines don’t backtrack. Their performance depends on the length of the subject string, not the complexity of the regular expression. But they also don’t support features like backreferences that depend on backtracking and that many users expect. If your application uses a backtracking engine with user-provided regexes, then you can only mitigate the consequences of catastrophic backtracking. And you’ll really need to do so. It’s very easy for people with limited regex skills to accidentally craft one that degenerates into catastrophic backtracking."
author = "Jan Goyvaerts"
year_published = 2025
clearnet = "https://regular-expressions.info/redos.html"
tags = ["all?", "alternation", "application", "defensive", "denial", "expression", "handling", "nested", "preventing", "provided"]
