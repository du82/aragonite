["https://reinventalbany.org/2025/02/support-for-eight-bills-building-a-stronger-democracy"]
title = "Support for Eight Bills Building a Stronger Democracy - Reinvent Albany"
description = "Same-day voter registration, ERIC, and more!"
full_description = "Support for Eight Bills Building a Stronger Democracy February 28, 2025 As part of our advocacy for a strong democracy, Reinvent Albany reissued memos of support for the following election-related bills: A2162 (Carroll R) – Amends NYS Constitution to allow same-day voter registration. S843 (May) / A6069 (Hunter) – Establishes minimum staffing levels for local boards of elections. S2541 (Myrie) – Requires images of cast vote records be made publicly available. S4364 (Comrie) / A2635 (Cunningham) – Requires better notice to voters who are purged or put on inactive status. S1356 (Skoufis) / A3649-A (Taylor) – Authorizes NY to share voter roll data with other states. S2050 (Webb) – Increases election commissioner terms from two to four years. S1087 (Mayer) / A5056 (Jacobson) – Makes local elections commissioners full-time employees of the board. This was reintroduced in the Assembly by AM Jacobson. S1035 (Myrie) / A1228 (Seawright) – Mandates training for NY local elections commissioners and key staff. This bill passed the Senate and is now in the Assembly Election Law committee. We urge the Legislature to pass these bills, and the Governor to sign them."
