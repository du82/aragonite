title = "Gov. Hochul Should Remove Mayor Adams From Office Immediately - Reinvent Albany"
description = "A shocking deal means Adams is beholden to Trump, and cannot put duty to the people and laws of NYC first."
full_description = "Gov. Hochul Should Remove Mayor Adams From Office Immediately February 14, 2025 Shocking Deal Means Adams Beholden to Trump to Avoid Prosecution, Cannot Put Duty to the People and Laws of NYC First We call on Governor Hochul to immediately remove Mayor Eric Adams from office, and we urge Senate Leader Stewart-Cousins and Assembly Speaker Heastie to publicly support the Governor’s action. Mayor Adams has made an explicit agreement with the Trump administration in which Adams agreed to provide political and policy assistance to Donald Trump in exchange for dropping the criminal charges against him. The existence of this deal is not speculation. In the last day, the U.S. Attorney for the Southern District of New York and at least four top career managers of the Public Integrity Division of the U.S. Justice Department have resigned rather than drop the federal charges against Adams. This deal is a fundamental threat to the rule of law and the right of New York City voters to have a mayor who can act independently and in their best interest – rather than obeying President Trump’s wishes or risk going to jail. The Governor has a responsibility to the people of New York City to restore the rule of law and democratic governance and must remove Mayor Adams from office immediately."
