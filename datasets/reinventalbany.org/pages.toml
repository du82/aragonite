["https://reinventalbany.org/2025/02/groups-applaud-court-of-appeals-decision-upholding-state-ethics-commission"]
title = "Groups Applaud Court of Appeals Decision Upholding State Ethics Commission - Reinvent Albany"
description = "The decision is a bright spot amidst recent ethics turmoil."
full_description = "Groups Applaud Court of Appeals Decision Upholding State Ethics Commission February 18, 2025 NYS Court of Appeals Upholds Constitutionality of State Ethics Commission Groups Applaud Decision as a Victory for State Ethics Oversight Decision a Bright Spot Amidst Ethics Turmoil Watchdog and legal groups applauded today’s thoroughly-researched and argued decision by the NYS Court of Appeals that solidifies the constitutionality of the Commission on Ethics and Lobbying in Government (COELIG). This victory for state ethics oversight will help ensure that the governor does not have undue control over the very body that ensures their conduct is ethical. It is essential for public confidence in state government that there is accountability for ethical misconduct, and that those who are regulated by the state’s ethics watchdog do not have “unfettered powers of appointment and removal,” as stated by the majority in its 4-3 decision. This decision is a bright spot amidst national and local ethics turmoil, particularly given the U.S. Department of Justice’s recent actions to erode the Southern District’s independence.The ruling supports the arguments made by watchdog and legal experts in our amicus brief submitted to the court supporting the constitutionality of the New York State Commission on Ethics and Lobbying in Government. Click here to view our statement as a PDF."
author = "Stephanie Jala-Thorne"
year_published = 2025
