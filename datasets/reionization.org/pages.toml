["https://reionization.org/manual_uploads/HERA069_IDR2.2_Memo_v3.html"]
title = "IDR2.2_Memo"
full_description = "H1C IDR 2.2 is a re-release of 18 days of calibrated data products from late 2017, part of HERA's first science observing season. It follows up on IDR 2.1, our first internal data release. That release was described in this memo at reionization.org. This memo builds on that memo, and though the overlap is substantial, ID2.2 has a number of improvements: This jupyter notebook memo is designed to be run when logged into NRAO. It is available as a .ipynb via github. In addition to the standard python libraries, it requires pyuvdata, hera_cal, and hera_qm. For more information on access, see the HERA wiki. For ongoing discussions, join the #hera-analysis Slack channel or our telecons on Wednesdays at 10am Pacific in the HERA Zoom room. The day-by-day data, along with the pipeline settings file used (makeflow/idr2_2.toml), and the LST-binned data can be found in: H1C IDR 2.2 includes 18 nearly-consecutive nights of data. All data products are sorted by JD into the following folders on the NRAO servers, which also contain softlinks to raw H1C IDR 2 data in the .uvh5 format and antenna metrics released by the commissioning team. Each night has 73 raw visibility files. Each file has 4 polarizations, 1024 frequency channels and (usually) 60 integrations, each 10.7374 seconds. More information about the data products blessed by the commissioning team team are on the HERA wiki. The HERA collaboration uses pyuvdata (for more, see pyuvdata's documentation) as a standard pythonic interface between data and calibration file formats and in-memory objects. The HERA Analysis team uses subclasses of pyuvdata objects with a number of extra capabilities, namely HERAData and HERACal objects. For a more complete demonstration of the capabilities of the hera_cal.io module, refer to this example notebook. Raw HERA visibility files for IDR2 blessed by the commissioning team have the format zen.2458098.43124.HH.uvh5 which can be interpreted as: HERAData objects (when initialized with uvh5 files) automatically load relevant metadata and store in the object, including times, freqs, antpos, bls, pols, and lsts."
