full_description = "Hiring Open Positions Postdoctoral Researcher, Radio Astronomy Lab, UC Berkeley (rolling deadline, last reviewed 6 Sept 2023) Postbaccalaureate Researcher: The Radio Astronomy Laboratory at the University of California, Berkeley seeks applications for a Junior Specialist in radio astronomy instrumentation and data analysis, directed by Professor Aaron Parsons or Dr. David DeBoer. Research in the lab addresses the electromagnetic and radio frequency (RF) system design and analysis, modeling for the design, optimization, use and data analysis of radio telescopes and the resultant data. The junior specialist will be expected to work collaboratively with a research team to design and model radio frequency systems that meet the specifications to conduct sensitive radio astronomical observations. The candidate will also be assisting with experiment design, data analyses, and the preparation of research for publication. The position may require travel to remote telescopes as well as working in a RF lab with sensitive equipment. Responsibilities: Will aid in designing and optimizing RF systems appropriate for sensitive radio astronomical observations.Will be assisting with using RF systems and conducting data analysis and the preparation of research for publicationWill be working in a team environment to deploy and conduct observations and analyze data. https://aprecruit.berkeley.edu/JPF04108"
