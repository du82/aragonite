["https://reionization.org/manual_uploads/HERA086_H1C_IDR2_power_spectrum_notes.html"]
title = "IDR2_power_spectrum_memo"
full_description = '''In this memo, we present an overview of the power spectrum analysis applied to HERA Phase I (H1C) data from the Internal Data Release 2, working on the output of the main IDR2.2 HERA reduction pipeline (see Dillon2019). This memo highlights some of the additional pre-processing steps that occur before power spectrum estimation, and gives an overview of the power spectrum analysis behind HERA's first upper limit paper (HERA Collaboration in prep). Note: Due to HERA policy, all power spectra in this memo are intentionally censored such that they are cast into normalized, dimensionless units. This memo starts with the calibrated, RFI flagged and LST binned data products from the IDR2.2 dataset (see Dillon2019 for details). A number of important steps remain to be appied to the data, which we discuss here, and have internally called the "pre-processing" pipeline (pre-power spectrum, but post-main analysis). Throughout the memo, we will highlight some of the major plots that have motivated the analysis choices, and discuss the number of revisions made to the analysis and why they were made. Additionally, we will briefly discuss some of the pipeline validation work that also informs some of these choices. Note to internal members: More in-depth discussion on many of these aspects can be found in notebooks in the H1C_IDR2 GitHub repository. Note on the pipeline: The second stage "pre-processing" pipeline can be found in the HERA-Team H1C_IDR2 repo under pipeline/preprocess_data.py, and the batch power spectrum pipeline is similarly under pipeline/pspec_pipe.py. Please direct questions to Nick. Note on the data: The data discussed are currently (as of July, 2020) located on the NRAO's lustre filesystem, at /lustre/aoc/projects/hera/H1C_IDR2/IDR2_pspec/v2. The v2 stands for the second version of the pre-processing pipeline, which is less about algorithm tweaking and more about conforming to different data standards between IDR2.1 and IDR2.2 (i.e. UVH5), in addition to including the reflection calibration and cross-talk subtraction steps. The 4-pol UVH5 data files that are output from these steps are located in the data directory, and have the following file extensions'''
year_published = 2025
clearnet = "https://reionization.org/manual_uploads/HERA086_H1C_IDR2_power_spectrum_notes.html"
