["https://reionization.org/science/public-data-release-1"]
title = "Public Data Release 1 – reionization.org"
full_description = "Public Data Release 1 The page summarizes the results of Phase 1 operation of HERA with an index of the papers supporting the result, data files containing the power spectrum limits, and example code for reading them. HERA Collaboration et al 2021a (H21a) – Summary paper describing data and methods. The paper has been accepted to ApJ and is currently in press. HERA Collaboration et al 2021b (H21b) – Companion paper evaluating theory implications. This paper has been submitted to ApJ Supporting papers Aguirre et al 2021(arxiv) – Pipeline validation using independent simulators Kern et al. 2020b – Absolute Calibration Dillon et al 2020 – Redundant calibration Tan et al 2020 – Error bar estimation used in H21a The Phase 1 75Ohm RF system has a known reflection systematic. Kern et al 2019 – A method for filtering systematic Kern et al 2020a – Application to HERA data Dillon et al 2019 – Memo detailing description of the processing used in this release (eg flagging, calibration, binning) The Instrument HERA has been observing during construction. In 2017-2018 the first phase of construction used the feeds, 75 Ohm cables, and correlator from the PAPER experiment. The first stage amplifiers, however, were replaced as a test preparatory to the cosmic dawn upgrade currently under way. This system is described in more detail by H21a and Kern et al 2019. See also: HERA memo series describing work in progress Photo Stream documenting build List of HERA papers The data The power spectra are provided in HDF5 format, using the UVPSpec object in the hera_pspec library. python jupyter notebook demonstrating how to read the data. data files and executable notebook. Summary Figures A comparison of recent 21cm power spectra with redshift indicated by color. (made using eor_limits) A comparison of recent power spectrum organized by redshift."
year_published = 2025
