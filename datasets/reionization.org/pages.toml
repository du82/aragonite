full_description = '''About HERA var metaslider_169 = function($) { $('#metaslider_169').nivoSlider({ boxCols:7, boxRows:5, pauseTime:7000, effect:"slideInRight", controlNav:true, directionNav:true, pauseOnHover:true, animSpeed:200, prevText:"&lt;", nextText:"&gt;", slices:15, manualAdvance:false }); }; var timer_metaslider_169 = function() { var slider = !window.jQuery ? window.setTimeout(timer_metaslider_169, 100) : !jQuery.isReady ? window.setTimeout(timer_metaslider_169, 1) : metaslider_169(window.jQuery); }; timer_metaslider_169(); The Hydrogen Epoch of Reionization Array (HERA) is a radio telescope dedicated to observing large scale structure during and prior to the epoch of reionization. HERA is a second generation instrument which combines efforts and lessons learned from the Murchison Widefield Array (MWA) and the Donald C. Backer Precision Array for Probing the Epoch of Reionization (PAPER). The array is a large grid of 14 meter (42 ft) diameter non-tracking dishes packed into a hexagonal grid 300 m (900ft) across. This substantial collecting area increase gives an order of magnitude more sensitivity than first generation instruments and be capable of robust statistical characterization and has the sensitivity to enable first images of large scale HI structure.'''
