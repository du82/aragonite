title = "CHAMP Camp 2019 – reionization.org"
full_description = "CHAMP Camp 2019 Third annual HERA summer student boot camp and parallel busy week. Located again in beautiful Santa Fe NM. Signup here – Last day to sign up April 19 2019 Payment here – Last day to pay June 7 2019 Venue The workshop will be held at St. John’s College, a pleasant and prestigious campus situated in the hills east of downtown Santa Fe. (For help with St. John’s information regarding this meeting go to the St. John’s Conference Services webpage.) Room and board have been arranged through St John’s. Off campus hotels and airbnb are also possible in Santa Fe if desired. When June 2-7 Housing is available for checkin on Sunday June 2. Formal schedule will begin Monday June 3, ending Friday June 7 at noon. Housing Housing is available at the St. John’s campus. Units for family groups (on a first come first served basis) as well as single participants are available. The housing agreement with St. John’s includes breakfast/lunch/dinner. “Board only” registration is also available. There are three types of housing available at St. John’s: Suite (shared accommodation / 5 rooms + common room / 5 people per suite), Apartment (2 bedroom with kitchen, appropriate for families), and Dorms (single/double, largely for students). Occasionally Asked Questions Costs?: Housing costs for the participants are subsidized by the CHAMP program. Estimates are listed on the signup sheet. Final costs will depend on the total number of participants. Non CHAMP Students?: Non-champ students are welcome at the boot camp at the regular HERA attendance rate. They’ll need to provide their own laptop. Anaconda and CASA should be setup before coming!"
