["https://reionization.org/manual_uploads/HERA085_hera_sim_validation_Marsden.html"]
title = "accuracy_comparison"
full_description = "We are using hera_sim for simulations of HERA beam perturbations, as the hera_sim interface is fairly simple, hera_sim is fast, and it has GPU support. Apart from pyuvsim, we have not evaluated other simulators like RIMEz/PRISim. We implemented a beam based on the Fagnoni beam for use in our work, and ran simulations using hera_sim and pyuvsim. Since pyuvsim was developed as a reference against which other simulators could be validated, we wanted to check that the hera_sim output matched pyuvsim, and found that it didn't. We could switch to pyuvsim, but found that is slower and more memory-intensive compared to hera_sim. Looking at the pyuvsim code, we could see that is far more sophisticated than hera_sim (hence why it is a reference), and that the difference in output is largely due to more accurate source positions calculated using Astropy. The issue then was whether we could include some of this Astropy code in hera_sim. That negates some of the simplicity of hera_sim, but perhaps we can strike a happy medium. After some reverse engineering of Astropy, we worked out how to enhance hera_sim so that it matches the pyuvsim output, but still has better performance. Section 3 runs small simulations and compares the hera_sim and pyuvsim output values and simulation times. It's divided into two parts: Section 5 has results of scaling tests, showing how simulation time and memory use change as simulations increase in size. The enhanced hera_sim is >100 times faster than pyuvsim, and the output visibilities match pyuvsim to many decimal places. As an example, compare the autocorrelation of antenna 0, and cross-correlation between antennas 0,1, for a particular simulation: hera_sim uses less memory than pyuvsim. This is a plot of hera_sim and pyuvsim memory usage, by number of frequency channels in the simulation: There are other plots that compare the performance of pyuvsim and hera_sim as simulation size increases. The enhanced hera_sim contains Astropy code, and some parts of that code have been hardwired for HERA. Therefore, if Astropy changes, enhanced hera_sim will need updating, and it can only be used for HERA."
year_published = 2025
clearnet = "https://reionization.org/manual_uploads/HERA085_hera_sim_validation_Marsden.html"
