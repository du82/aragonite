["https://releases.llvm.org/1.5/docs/ReleaseNotes.html"]
title = "LLVM 1.5 Release Notes"
full_description = '''This document contains the release notes for the LLVM compiler infrastructure, release 1.5. Here we describe the status of LLVM, including any known problems and major improvements from the previous release. The most up-to-date version of this document can be found on the LLVM 1.5 web site. If you are not reading this on the LLVM web pages, you should probably go there because this document may be updated after the release. For more information about LLVM, including information about the latest release, please check out the main LLVM web site. If you have questions or comments, the LLVM developer's mailing list is a good place to send them. Note that if you are reading this file from CVS or the main LLVM web page, this document applies to the next release, not the current one. To see the release notes for the current or previous releases, see the releases page. LLVM 1.5 is known to correctly compile a wide range of C and C++ programs, includes bug fixes for those problems found since the 1.4 release, and includes a large number of new features and enhancements, described below. This release includes new native code generators for Alpha, IA-64, and SPARC-V8 (32-bit SPARC). These code generators are still beta quality, but are progressing rapidly. The Alpha backend is implemented with an eye towards being compatible with the widely used SimpleScalar simulator. This release includes a new framework for building instruction selectors, which has long been the hardest part of building a new LLVM target. This framework handles a lot of the mundane (but easy to get wrong) details of writing the instruction selector, such as generating efficient code for getelementptr instructions, promoting small integer types to larger types (e.g. for RISC targets with one size of integer registers), expanding 64-bit integer operations for 32-bit targets, etc. Currently, the X86, PowerPC, Alpha, and IA-64 backends use this framework. The SPARC backends will be migrated when time permits. LLVM 1.5 adds supports for per-function calling conventions. Traditionally, the LLVM code generators match the native C calling conventions for a target. This is important for compatibility, but is not very flexible. This release allows custom calling conventions to be established for functions, and defines three target-independent conventions (C call, fast call, and cold call) which may be supported by code generators. When possible, the LLVM optimizer promotes C functions to use the "fastcc" convention, allowing the use of more efficient calling sequences (e.g., parameters are passed in registers in the X86 target).'''
year_published = 2025
clearnet = "https://releases.llvm.org/1.5/docs/ReleaseNotes.html"
