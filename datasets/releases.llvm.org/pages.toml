["https://releases.llvm.org/1.2/docs/TableGenFundamentals.html"]
title = "TableGen Fundamentals"
full_description = '''TableGen's purpose is to help a human develop and maintain records of domain-specific information. Because there may be a large number of these records, it is specifically designed to allow writing flexible descriptions and for common features of these records to be factored out. This reduces the amount of duplication in the description, reduces the chance of error, and makes it easier to structure domain specific information. The core part of TableGen parses a file, instantiates the declarations, and hands the result off to a domain-specific "TableGen backend" for processing. The current major user of TableGen is the LLVM code generator. Note that if you work on TableGen much, and use emacs or vim, that you can find an emacs "TableGen mode" and a vim language file in llvm/utils/emacs and llvm/utils/vim directory of your LLVM distribution, respectively. TableGen files consist of two key parts: 'classes' and 'definitions', both of which are considered 'records'. TableGen records have a unique name, a list of values, and a list of superclasses. The list of values is main data that TableGen builds for each record, it is this that holds the domain specific information for the application. The interpretation of this data is left to a specific TableGen backend, but the structure and format rules are taken care of and fixed by TableGen. TableGen definitions are the concrete form of 'records'. These generally do not have any undefined values, and are marked with the 'def' keyword. TableGen classes are abstract records that are used to build and describe other records. These 'classes' allow the end-user to build abstractions for either the domain they are targetting (such as "Register", "RegisterClass", and "Instruction" in the LLVM code generator) or for the implementor to help factor out common properties of records (such as "FPInst", which is used to represent floating point instructions in the X86 backend). TableGen keeps track of all of the classes that are used to build up a definition, so the backend can find all definitions of a particular class, such as "Instruction".'''
year_published = 2025
clearnet = "https://releases.llvm.org/1.2/docs/TableGenFundamentals.html"
