["https://releases.llvm.org/1.3/docs/ReleaseNotes.html"]
title = "LLVM 1.3 Release Notes"
full_description = "This document contains the release notes for the LLVM compiler infrastructure, release 1.3. Here we describe the status of LLVM, including any known problems and bug fixes from the previous release. The most up-to-date version of this document can be found on the LLVM 1.3 web site. If you are not reading this on the LLVM web pages, you should probably go there because this document may be updated after the release. For more information about LLVM, including information about potentially more current releases, please check out the main web site. If you have questions or comments, the LLVM developer's mailing list is a good place to send them. Note that if you are reading this file from CVS, this document applies to the next release, not the current one. To see the release notes for the current or previous releases, see the releases page. This is the fourth public release of the LLVM compiler infrastructure. This release primarily improves the performance of the code produced by all aspects of the LLVM compiler, adds many new features, fixes a few bugs, speeds up the compiler, and introduces a new (experimental) PowerPC code generator. At this time, LLVM is known to correctly compile and run all C & C++ SPEC CPU95 & 2000 benchmarks, the Olden benchmarks, and the Ptrdist benchmarks, and many other programs. LLVM now also works with a broad variety of C++ programs. The core LLVM infrastructure uses GNU autoconf to adapt itself to the machine and operating system on which it is built. However, minor porting may be required to get LLVM to work on new platforms. We welcome your portability patches and reports of successful builds or error messages. Note that the LLVM build system does not currently support directories with spaces on them when running on Win32/cygwin. We strongly recommend running LLVM and the C frontend out of a top-level directory without spaces (e.g., /cygdrive/c/llvm). Also, make sure to install all of the cygwin packages. By default, many important tools are not installed that are needed by the LLVM build process or test suite (e.g., /bin/time). Finally, please make sure that there are no directories with spaces in them in your PATH environment variable."
year_published = 2025
clearnet = "https://releases.llvm.org/1.3/docs/ReleaseNotes.html"
