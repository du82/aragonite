["https://releases.llvm.org/1.4/docs/ReleaseNotes.html"]
title = "LLVM 1.4 Release Notes"
full_description = "This document contains the release notes for the LLVM compiler infrastructure, release 1.4. Here we describe the status of LLVM, including any known problems and improvements from the previous release. The most up-to-date version of this document can be found on the LLVM 1.4 web site. If you are not reading this on the LLVM web pages, you should probably go there because this document may be updated after the release. For more information about LLVM, including information about the latest release, please check out the main LLVM web site. If you have questions or comments, the LLVM developer's mailing list is a good place to send them. Note that if you are reading this file from CVS, this document applies to the next release, not the current one. To see the release notes for the current or previous releases, see the releases page. At this time, LLVM is known to correctly compile a broad range of C and C++ programs, including the SPEC CPU95 & 2000 suite. This release includes several major enhancements to the LLVM system, including a new PowerPC JIT, enhancements to the C/C++ front-end to provide source line number information in LLVM, a new compiler driver, and several other enhancements listed below. It also includes bug fixes for those problems found since the 1.3 release. Note that this release seperates the LLVM Program Testsuite out of the main LLVM distribution into a seperate CVS repository and tarball. This reduces the size of the main LLVM distribution. Also note that LLVM now builds tools into llvm/Debug/bin by default instead of llvm/tools/Debug. The core LLVM infrastructure uses GNU autoconf to adapt itself to the machine and operating system on which it is built. However, minor porting may be required to get LLVM to work on new platforms. We welcome your portability patches and reports of successful builds or error messages. This section contains all known problems with the LLVM system, listed by component. As new problems are discovered, they will be added to these sections. If you run into a problem, please check the LLVM bug database and submit a bug if there isn't already one."
year_published = 2025
