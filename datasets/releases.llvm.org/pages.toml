["https://releases.llvm.org/1.2/docs/SourceLevelDebugging.html"]
title = "Source Level Debugging with LLVM"
full_description = '''This document is the central repository for all information pertaining to debug information in LLVM. It describes the user interface for the llvm-db tool, which provides a powerful source-level debugger to users of LLVM-based compilers. It then describes the various components that make up the debugger and the libraries which future clients may use. Finally, it describes the actual format that the LLVM debug information takes, which is useful for those interested in creating front-ends or dealing directly with the information. The idea of the LLVM debugging information is to capture how the important pieces of the source-language's Abstract Syntax Tree map onto LLVM code. Several design aspects have shaped the solution that appears here. The important ones are: The approach used by the LLVM implementation is to use a small set of intrinsic functions to define a mapping between LLVM program objects and the source-level objects. The description of the source-level program is maintained in LLVM global variables in an implementation-defined format (the C/C++ front-end currently uses working draft 7 of the Dwarf 3 standard). When a program is debugged, the debugger interacts with the user and turns the stored debug information into source-language specific information. As such, the debugger must be aware of the source-language, and is thus tied to a specific language of family of languages. The LLVM debugger is designed to be modular in its support for source-languages. An extremely high priority of LLVM debugging information is to make it interact well with optimizations and analysis. In particular, the LLVM debug information provides the following guarantees: Basically, the debug information allows you to compile a program with "-O0 -g" and get full debug information, allowing you to arbitrarily modify the program as it executes from the debugger. Compiling a program with "-O3 -g" gives you full debug information that is always available and accurate for reading (e.g., you get accurate stack traces despite tail call elimination and inlining), but you might lose the ability to modify the program and call functions where were optimized out of the program, or inlined away completely.'''
year_published = 2025
clearnet = "https://releases.llvm.org/1.2/docs/SourceLevelDebugging.html"
