["https://releases.llvm.org/1.6/docs/ReleaseNotes.html"]
title = "LLVM 1.6 Release Notes"
full_description = "This document contains the release notes for the LLVM compiler infrastructure, release 1.6. Here we describe the status of LLVM, including any known problems and major improvements from the previous release. The most up-to-date version of this document can be found on the LLVM 1.6 web site. If you are not reading this on the LLVM web pages, you should probably go there because this document may be updated after the release. For more information about LLVM, including information about the latest release, please check out the main LLVM web site. If you have questions or comments, the LLVM developer's mailing list is a good place to send them. Note that if you are reading this file from CVS or the main LLVM web page, this document applies to the next release, not the current one. To see the release notes for the current or previous releases, see the releases page. This is the seventh public release of the LLVM Compiler Infrastructure. This release incorporates a large number of enhancements and additions (primarily in the code generator), which combine to improve the quality of the code generated by LLVM by up to 30% in some cases. This release is also the first release to have first-class support for Mac OS X: all of the major bugs have been shaken out and it is now as well supported as Linux on X86. LLVM now includes support for auto-generating large portions of the instruction selectors from target descriptions. This allows us to write patterns in the target .td file, instead of writing lots of nasty C++ code. Most of the PowerPC instruction selector is now generated from the PowerPC target description files and other targets are adding support that will be live for LLVM 1.7. For example, here are some patterns used by the PowerPC backend. A floating-point multiply then subtract instruction (FMSUBS): With these definitions, we teach the code generator how to combine these two instructions to xor an abitrary 32-bit immediate with the following definition. The first line specifies what to match (a xor with an arbitrary immediate) the second line specifies what to produce:"
