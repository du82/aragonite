["https://releases.llvm.org/1.2/docs/FAQ.html"]
title = "LLVM: Frequently Asked Questions"
full_description = "The C/C++ front-ends are based on GCC and must be distributed under the GPL. Our aim is to distribute LLVM source code under a much less restrictive license, in particular one that does not compel users who distribute tools based on modifying the source to redistribute the modified source code as well. Yes. The modified source distribution must retain the copyright notice and follow the three bulletted conditions listed in the LLVM license. Can I modify LLVM source code and redistribute binaries or other tools based on it, without redistributing the source? Yes, this is why we distribute LLVM under a less restrictive license than GPL, as explained in the first question above. The LLVM source code should be portable to most modern UNIX-like operating systems. Most of the code is written in standard C++ with operating system services abstracted to a support library. The tools required to build and test LLVM have been ported to a plethora of platforms. The configure script attempts to locate first gcc and then cc, unless it finds compiler paths set in CC and CXX for the C and C++ compiler, respectively. If configure finds the wrong compiler, either adjust your PATH environment variable or set CC and CXX explicitly. There are several possible causes for this. The first is that you didn't set a pathname properly when using configure, and it defaulted to a pathname that we use on our research machines. Another possibility is that we hardcoded a path in our Makefiles. If you see this, please email the LLVM bug mailing list with the name of the offending Makefile and a description of what is wrong with it. The configure script finds the right C compiler, but it uses the LLVM linker from a previous build. What do I do? The configure script uses the PATH to find executables, so if it's grabbing the wrong linker/assembler/etc, there are two ways to fix it: Adjust your PATH environment variable so that the correct program appears first in the PATH. This may work, but may not be convenient when you want them first in your path for other work."
