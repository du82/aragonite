["https://releases.llvm.org/1.3/docs/CommandGuide/html/llvm-bcanalyzer.html"]
title = "llvm-bcanalyzer - LLVM bytecode analyzer"
full_description = "The llvm-bcanalyzer command is a small utility for analyzing bytecode files. The tool reads a bytecode file (such as generated with the llvm-as tool) and produces a statistical report on the contents of the byteocde file. The tool will also dump a low level but human readable version of the bytecode file. This tool is probably not of much interest or utility except for those working directly with the bytecode file format. Most LLVM users can just ignore this tool. If filename is omitted or is -, then llvm-bcanalyzer reads its input from standard input. This is useful for combining the tool into a pipeline. If llvm-bcanalyzer succeeds, it will exit with 0. Otherwise, if an error occurs, it will exit with a non-zero value, usually 1."
