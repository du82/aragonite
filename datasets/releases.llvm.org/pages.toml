["https://releases.llvm.org/1.4/docs/CommandGuide/html/llvm-ld.html"]
title = "llvm-ld"
full_description = "The llvm-ld command is similar to the common Unix utility, ld. It links together bytecode modules to produce an executable program. If llvm-ld succeeds, it will exit with 0 return code. If an error occurs, it will exit with a non-zero return code. The LLVM_LIB_SEARCH_PATH environment variable is used to find bytecode libraries. Any paths specified in this variable will be searched after the -L options."
