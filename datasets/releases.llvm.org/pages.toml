["https://releases.llvm.org/1.1/docs/ReleaseNotes.html"]
title = "LLVM 1.1 Release Notes"
full_description = "This document contains the release notes for the LLVM compiler infrastructure, release 1.1. Here we describe the status of LLVM, including any known problems and bug fixes from the previous release. The most up-to-date version of this document can be found on the LLVM 1.1 web site. If you are not reading this on the LLVM web pages, you should probably go there because this document may be updated after the release. For more information about LLVM, including information about potentially more current releases, please check out the main web site. If you have questions or comments, the LLVM developer's mailing list is a good place to send them. Note that if you are reading this file from CVS, this document applies to the next release, not the current one. To see the release notes for the current or previous releases, see the releases page. This is the second public release of the LLVM compiler infrastructure. This release is primarily a bugfix release, dramatically improving the C/C++ front-end and improving support for C++ in the LLVM core. This release also includes a few new features, such as a simple profiler, support for Mac OS X, better interoperability with external source bases, a new example language front-end, and improvements in a few optimizations. The performance of several LLVM components has been improved, and several gratuitous type-safety issues in the C front-end have been fixed. At this time, LLVM is known to correctly compile and run all non-unwinding C & C++ SPEC CPU2000 benchmarks, the Olden benchmarks, and the Ptrdist benchmarks. It has also been used to compile many other programs. LLVM now also works with a broad variety of C++ programs, though it has still received much less testing than the C front-end. The LLVM native code generators are very stable but do not currently support unwinding (exception throwing or longjmping), which prevent them from working with programs like the 253.perlbmk in SPEC CPU2000. The C backend and the rest of LLVM supports these programs, so you can still use LLVM with them. Support for unwinding will be added in a future release."
year_published = 2025
clearnet = "https://releases.llvm.org/1.1/docs/ReleaseNotes.html"
