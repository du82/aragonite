["https://releases.llvm.org/1.2/docs/ReleaseNotes.html"]
title = "LLVM 1.2 Release Notes"
full_description = '''This document contains the release notes for the LLVM compiler infrastructure, release 1.2. Here we describe the status of LLVM, including any known problems and bug fixes from the previous release. The most up-to-date version of this document can be found on the LLVM 1.2 web site. If you are not reading this on the LLVM web pages, you should probably go there because this document may be updated after the release. For more information about LLVM, including information about potentially more current releases, please check out the main web site. If you have questions or comments, the LLVM developer's mailing list is a good place to send them. Note that if you are reading this file from CVS, this document applies to the next release, not the current one. To see the release notes for the current or previous releases, see the releases page. This is the third public release of the LLVM compiler infrastructure. This release incorporates several new features (including exception handling support for the native code generators, the start of a source-level debugger, and profile guided optimizer components), many speedups and code quality improvements, documentation improvements, and a small collection of important bug fixes. Overall, this is our highest quality release to date, and we encourage you to upgrade if you are using LLVM 1.0 or 1.1. At this time, LLVM is known to correctly compile and run all C & C++ SPEC CPU2000 benchmarks, the Olden benchmarks, and the Ptrdist benchmarks. It has also been used to compile many other programs. LLVM now also works with a broad variety of C++ programs, though it has still received less testing than the C front-end. LLVM has been extensively tested on Intel and AMD machines running Red Hat Linux and FreeBSD. It has also been tested on Sun UltraSPARC workstations running Solaris 8. Additionally, LLVM works on Mac OS X 10.3 and above, but only with the C backend or interpreter (no native backend for the PowerPC is available yet). The core LLVM infrastructure uses "autoconf" for portability, so hopefully we work on more platforms than that. However, it is likely that we missed something and that minor porting is required to get LLVM to work on new platforms. We welcome portability patches and error messages.'''
