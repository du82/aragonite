["https://releases.llvm.org/1.3/docs/WritingAnLLVMPass.html"]
title = "Writing an LLVM Pass"
full_description = '''The LLVM Pass Framework is an important part of the LLVM system, because LLVM passes are where the interesting parts of the compiler exist. Passes perform the transformations and optimizations that make up the compiler, they build the analysis results that are used by these transformations, and they are, above all, a structuring technique for compiler code. All LLVM passes are subclasses of the Pass class, which implement functionality by overriding virtual methods inherited from Pass. Depending on how your pass works, you may be able to inherit from the FunctionPass or BasicBlockPass, which gives the system more information about what your pass does, and how it can be combined with other passes. One of the main features of the LLVM Pass Framework is that it schedules passes to run in an efficient way based on the constraints that your pass has. We start by showing you how to construct a pass, everything from setting up the code, to compiling, loading, and executing it. After the basics are down, more advanced features are discussed. Here we describe how to write the "hello world" of passes. The "Hello" pass is designed to simply print out the name of non-external functions that exist in the program being compiled. It does not modify the program at all, just inspects it. The source code and files for this pass are available in the LLVM source tree in the lib/Transforms/Hello directory. First thing you need to do is create a new directory somewhere in the LLVM source base. For this example, we'll assume that you made "lib/Transforms/Hello". The first thing you must do is set up a build script (Makefile) that will compile the source code for the new pass. To do this, copy this into "Makefile": This makefile specifies that all of the .cpp files in the current directory are to be compiled and linked together into a lib/Debug/libhello.so shared object that can be dynamically loaded by the opt or analyze tools. If your operating system uses a suffix other than .so (such as windows of Mac OS/X), the appropriate extension will be used.'''
year_published = 2025
