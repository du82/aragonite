["https://releases.llvm.org/1.2/docs/CFEBuildInstrs.html"]
title = "Bootstrapping the LLVM C/C++ Front-End"
full_description = 'This document is intended to explain the process of building the LLVM C/C++ front-end, based on GCC 3.4, from its source code. You would have to do this, for example, if you are porting LLVM to a new architecture or operating system. NOTE: This is currently a somewhat fragile, error-prone process, and you should only try to do it if: The use of the non-default target "tools-only" means that the LLVM tools and libraries will build, and the binaries will be deposited in llvm/tools/Debug, but the runtime (bytecode) libraries will not build. Edit src/configure. Change the first line (starting w/ #!) to contain the correct full pathname of sh. For Solaris/SPARC, LLVM only supports the SPARC V9. Therefore, the configure command line should specify sparcv9, as shown below. Also, note that Solaris has trouble with various wide (multibyte) character functions from C as referenced from C++, so we typically configure with --disable-c-mbchar (cf. Bug 206). Common Problem: You may get error messages regarding the fact that LLVM does not support inline assembly. Here are two common fixes: Fix 1: If you have system header files that include inline assembly, you may have to modify them to remove the inline assembly, and install the modified versions in $CFEINSTALL/target-triplet/sys-include. Porting to a new architecture: If you are porting the new front-end to a new architecture, or compiling in a different configuration that we have previously, there are probably several changes you will have to make to the GCC target to get it to work correctly. These include: Go back into the LLVM source tree proper. Edit Makefile.config to redefine LLVMGCCDIR to the full pathname of the $CFEINSTALL directory, which is the directory you just installed the C front-end into. (The ./configure script is likely to have set this to a directory which does not exist on your system.) If you edited header files during the C/C++ front-end build as described in "Fix 1" above, you must now copy those header files from $CFEINSTALL/target-triplet/sys-include to $CFEINSTALL/lib/gcc/target-triplet/3.4-llvm/include. (This should be the "include" directory in the same directory as the libgcc.a library, which you can find by running $CFEINSTALL/bin/gcc --print-libgcc-file-name.)'
