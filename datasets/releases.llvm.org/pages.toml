["https://releases.llvm.org/1.5/docs/GettingStartedVS.html"]
title = "Getting Started with LLVM System for Microsoft Visual Studio"
full_description = "The Visual Studio port at this time is experimental. It is suitable for use only if you are writing your own compiler front end or otherwise have a need to dynamically generate machine code. The JIT and interpreter are functional, but it is currently not possible to generate assembly code which is then assembled into an executable. You can indirectly create executables by using the C back end. To emphasize, there is no C/C++ front end currently available. llvm-gcc is based on GCC, which cannot be bootstrapped using VC++. Eventually there should be a llvm-gcc based on Cygwin or MinGW that is usable. There is also the option of generating bytecode files on Unix and copying them over to Windows. But be aware the odds of linking C++ code compiled with llvm-gcc with code compiled with VC++ is essentially zero. Most of the tools build and work. llvm-db does not build at this time. bugpoint does build, but does not work. Additional information about the LLVM directory structure and tool chain can be found on the main Getting Started page. It is strongly encouraged that you get the latest version from CVS. Much progress has been made since the 1.4 release. Before you begin to use the LLVM system, review the requirements given below. This may save you some trouble by knowing ahead of time what hardware and software you will need. Any system that can adequately run Visual Studio .NET 2003 is fine. The LLVM source tree and object files, libraries and executables will consume approximately 3GB. You will need Visual Studio .NET 2003. Earlier versions cannot open the solution/project files. The VS 2005 beta can, but will migrate these files to its own format in the process. While it should work with the VS 2005 beta, there are no guarantees and there is no support for it at this time. It has been reported that VC++ Express also works. You will also need several open source packages: bison, flex, and sed. These must be installed in llvm/win32/tools. These can be found at http://gnuwin32.sourceforge.net or http://unxutils.sourceforge.net. Bison prefers that m4 be in the path. You must add it to the Visual Studio configuration under the menu Options -> Projects -> VC++ Directories. Alternatively, you can set the environment variable M4 to point to m4 executable."
year_published = 2025
