["https://releases.llvm.org/1.4/docs/GettingStarted.html"]
title = "Getting Started with LLVM System"
full_description = "First, LLVM comes in two pieces. The first piece is the LLVM suite. This contains all of the tools, libraries, and header files needed to use the low level virtual machine. It contains an assembler, disassembler, bytecode analyzer, and bytecode optimizer. It also contains a test suite that can be used to test the LLVM tools and the GCC front end. The second piece is the GCC front end. This component provides a version of GCC that compiles C and C++ code into LLVM bytecode. Currently, the GCC front end is a modified version of GCC 3.4 (we track the GCC 3.4 development). Once compiled into LLVM bytecode, a program can be manipulated with the LLVM tools from the LLVM suite. There is a third, optional piece called llvm-test. It is a suite of programs with a testing harness that can be used to further test LLVM's functionality and performance. Enable the SPEC2000 benchmarks for testing. The SPEC2000 benchmarks should be available in directory. Consult the Getting Started with LLVM section for detailed information on configuring and compiling LLVM. See Setting Up Your Environment for tips that simplify working with the GCC front end and LLVM tools. Go to Program Layout to learn about the layout of the source code tree. Before you begin to use the LLVM system, review the requirements given below. This may save you some trouble by knowing ahead of time what hardware and software you will need. Notes: 1 Code generation supported for Pentium processors and up 2 Code generation supported for 32-bit ABI only 3 No native code generation 4 Build is not complete: one or more tools don't link 5 The GCC-based C/C++ frontend does not build Note that you will need about 1-3 GB of space for a full LLVM build in Debug mode, depending on the system (because of all the debug info), and the libraries appear in more than one of the tools that get linked, so there is some duplication. If you do not need many of the tools and you are space-conscious, you can disable them individually in llvm/tools/Makefile. The Release build requires considerably less space."
