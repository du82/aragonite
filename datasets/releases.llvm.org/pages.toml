["https://releases.llvm.org/1.3/docs/BytecodeFormat.html"]
title = "LLVM Bytecode File Format"
full_description = "This document describes the LLVM bytecode file format. It specifies the binary encoding rules of the bytecode file format so that equivalent systems can encode bytecode files correctly. The LLVM bytecode representation is used to store the intermediate representation on disk in compacted form. The LLVM bytecode format may change in the future, but LLVM will always be backwards compatible with older formats. This document will only describe the most current version of the bytecode format. See Version Differences for the details on how the current version is different from previous versions. This section describes the general concepts of the bytecode file format without getting into specific layout details. It is recommended that you read this section thoroughly before interpreting the detailed descriptions. LLVM bytecode files consist simply of a sequence of blocks of bytes using a binary encoding Each block begins with an header of two unsigned integers. The first value identifies the type of block and the second value provides the size of the block in bytes. The block identifier is used because it is possible for entire blocks to be omitted from the file if they are empty. The block identifier helps the reader determine which kind of block is next in the file. Note that blocks can be nested within other blocks. All blocks are variable length, and the block header specifies the size of the block. All blocks begin on a byte index that is aligned to an even 32-bit boundary. That is, the first block is 32-bit aligned because it starts at offset 0. Each block is padded with zero fill bytes to ensure that the next block also starts on a 32-bit boundary. LLVM Bytecode blocks often contain lists of things of a similar type. For example, a function contains a list of instructions and a function type contains a list of argument types. There are two basic types of lists: length lists (llist), and null terminated lists (zlist), as described below in the Encoding Primitives. Fields are units of information that LLVM knows how to write atomically. Most fields have a uniform length or some kind of length indication built into their encoding. For example, a constant string (array of bytes) is written simply as the length followed by the characters. Although this is similar to a list, constant strings are treated atomically and are thus fields."
year_published = 2025
clearnet = "https://releases.llvm.org/1.3/docs/BytecodeFormat.html"
