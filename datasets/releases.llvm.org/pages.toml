["https://releases.llvm.org/1.4/docs/CommandGuide/html/llvmc.html"]
title = "llvmc"
full_description = "The llvmc command is a configurable driver for invoking other LLVM (and non-LLVM) tools in order to compile, optimize and link software for multiple languages. For those familiar with the GNU Compiler Collection's gcc tool, it is very similar. This tool has the following main goals or purposes: The tool itself does nothing with a user's program. It merely invokes other tools to get the compilation tasks done. The options supported by llvmc generalize the compilation process and provide a consistent and simple interface for multiple programming languages. This makes it easier for developers to get their software compiled with LLVM. Without llvmc, developers would need to understand how to invoke the front-end compiler, optimizer, assembler, and linker in order to compile their programs. llvmc's sole mission is to trivialize that process. Optimization with llvmc is based on goals and specified with the following -O options. The specific details of which optimizations run is controlled by the configuration files because each source language will have different needs. You better know what you're doing if you use these options. Improper use of these options can produce drastically wrong results. If llvmc succeeds, it will exit with 0. Otherwise, if an error occurs, it will exit with a non-zero value and no compilation actions will be taken. If one of the compilation tools returns a non-zero status, pending actions will be discarded and llvmc will return the same result code as the failing compilation tool."
