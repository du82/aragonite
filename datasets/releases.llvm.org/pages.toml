["https://releases.llvm.org/1.4/docs/CommandGuide/html/llvm-ar.html"]
title = "llvm-ar"
full_description = "The llvm-ar command is similar to the common Unix utility, ar. It archives several files together into a single file. The intent for this is to produce archive libraries by LLVM bytecode that can be linked into an LLVM program. However, the archive can contain any kind of file. By default, llvm-ar generates a symbol table that makes linking faster because only the symbol table needs to be consulted, not each individual file member of the archive. The llvm-ar command can be used to read both SVR4 and BSD style archive files. However, it cannot be used to write them. While the llvm-ar command produces files that are almost identical to the format used by other ar implementations, it has two significant departures in order to make the archive appropriate for LLVM. The first departure is that llvm-ar only uses BSD4.4 style long path names (stored immediately after the header) and never contains a string table for long names. The second departure is that the symbol table is formated for efficient construction of an in-memory data structure that permits rapid (red-black tree) lookups. Consequently, archives produced with llvm-ar usually won't be readable or editable with any ar implementation or useful for linking. Using the f modifier to flatten file names will make the archive readable by other ar implementations but not for linking because the symbol table format for LLVM is unique. If an SVR4 or BSD style archive is used with the r (replace) or q (quick update) operations, the archive will be reconstructed in LLVM format. This means that the string table will be dropped (in deference to BSD 4.4 long names) and an LLVM symbol table will be added (by default). The system symbol table will be retained. The options to llvm-ar are compatible with other ar implementations. However, there are a few modifiers (zR) that are not found in other ars. The options to llvm-ar specify a single basic operation to perform on the archive, a variety of modifiers for that operation, the name of the archive file, and an optional list of file names. These options are used to determine how llvm-ar should process the archive file."
year_published = 2025
