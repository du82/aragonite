["https://releases.llvm.org/1.1/docs/Stacker.html"]
title = "Stacker: An Example Of Using LLVM"
full_description = '''This document is another way to learn about LLVM. Unlike the LLVM Reference Manual or LLVM Programmer's Manual, we learn about LLVM through the experience of creating a simple programming language named Stacker. Stacker was invented specifically as a demonstration of LLVM. The emphasis in this document is not on describing the intricacies of LLVM itself but on how to use it to build your own compiler system. Amongst other things, LLVM is a platform for compiler writers. Because of its exceptionally clean and small IR (intermediate representation), compiler writing with LLVM is much easier than with other systems. As proof, the author of Stacker wrote the entire compiler (language definition, lexer, parser, code generator, etc.) in about four days! That's important to know because it shows how quickly you can get a new language up when using LLVM. Furthermore, this was the first language the author ever created using LLVM. The learning curve is included in that four days. The language described here, Stacker, is Forth-like. Programs are simple collections of word definitions, and the only thing definitions can do is manipulate a stack or generate I/O. Stacker is not a "real" programming language; it's very simple. Although it is computationally complete, you wouldn't use it for your next big project. However, the fact that it is complete, it's simple, and it doesn't have a C-like syntax make it useful for demonstration purposes. It shows that LLVM could be applied to a wide variety of languages. The basic notions behind stacker is very simple. There's a stack of integers (or character pointers) that the program manipulates. Pretty much the only thing the program can do is manipulate the stack and do some limited I/O operations. The language provides you with several built-in words that manipulate the stack in interesting ways. To get your feet wet, here's how you write the traditional "Hello, World" program in Stacker: This has two "definitions" (Stacker manipulates words, not functions and words have definitions): MAIN and hello_world. The MAIN definition is standard; it tells Stacker where to start. Here, MAIN is defined to simply invoke the word hello_world. The hello_world definition tells stacker to push the "Hello, World!" string on to the stack, print it out (>s), pop it off the stack (DROP), and finally print a carriage return (CR). Although hello_world uses the stack, its net effect is null. Well written Stacker definitions have that characteristic.'''
year_published = 2025
clearnet = "https://releases.llvm.org/1.1/docs/Stacker.html"
