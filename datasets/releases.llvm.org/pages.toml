["https://releases.llvm.org/1.2/docs/HowToSubmitABug.html"]
title = "How to submit an LLVM bug report"
full_description = "If you're working with LLVM and run into a bug, we definitely want to know about it. This document describes what you can do to increase the odds of getting it fixed quickly. Basically you have to do two things at a minimum. First, decide whether the bug crashes the compiler (or an LLVM pass), or if the compiler is miscompiling the program. Based on what type of bug it is, follow the instructions in the linked section to narrow down the bug so that the person who fixes it will be able to find the problem more easily. Once you have a reduced test-case, go to the LLVM Bug Tracking System, select the category in which the bug falls, and fill out the form with the necessary details. The bug description should contain the following information: More often than not, bugs in the compiler cause it to crash - often due to an assertion failure of some sort. If you are running opt or analyze directly, and something crashes, jump to the section on bugs in LLVM passes. Otherwise, the most important piece of the puzzle is to figure out if it is the GCC-based front-end that is buggy or if it's one of the LLVM tools that has problems. To figure out which program is crashing (the front-end, gccas, or gccld), run the llvm-gcc command line as you were when the crash occurred, but add a -v option to the command line. The compiler will print out a bunch of stuff, and should end with telling you that one of cc1/cc1plus, gccas, or gccld crashed. If the problem is in the front-end, you should re-run the same llvm-gcc command that resulted in the crash, but add the -save-temps option. The compiler will crash again, but it will leave behind a foo.i file (containing preprocessed C source code) and possibly foo.s (containing LLVM assembly code), for each compiled foo.c file. Send us the foo.i file, along with a brief description of the error it caused. If you find that a bug crashes in the gccas stage of compilation, compile your test-case to a .s file with the -save-temps option to llvm-gcc. Then run:"
year_published = 2025
