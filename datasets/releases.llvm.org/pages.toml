title = "LLVM 1.0 Release Notes"
full_description = "For more information about LLVM, including information about potentially more current releases, please check out the main web site. If you have questions or comments, the LLVM developer's mailing list is a good place to send them. At this time, LLVM is known to work properly with SPEC CPU 2000, the Olden benchmarks, and the Ptrdist benchmarks among many other programs. Note however that the Sparc and X86 backends do not currently support exception throwing or long jumping (including 253.perlbmk in SPEC). For these programs you must use the C backend. The following GCC extensions are partially supported. An ignored attribute means that the LLVM compiler ignores the presence of the attribute, but the code should still work. An unsupported attribute is one which is ignored by the LLVM compiler, which will cause a different interpretation of the program. If you run into GCC extensions which have not been included in any of these lists, please let us know (also including whether or not they work). If you have any questions or comments about LLVM, please feel free to contact us via the mailing lists."
