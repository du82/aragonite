full_description = '''When you use <Form method="post"> in Remix, as opposed to using the native HTML <form method="post">, Remix does not adhere to the default browser behavior for resubmitting forms during navigation events like clicking back, forward, or refreshing. In a standard browser environment, form submissions are navigation events. This means that when a user clicks the back button, the browser will typically resubmit the form. For example: In this situation, the browser resubmits the form data, which could lead to issues such as charging a credit card twice. A common practice to avoid this issue is to issue a redirect after the POST request. This removes the POST action from the browser's history. The history stack would then look like this: While accidental resubmissions generally don't happen in Remix, there are specific scenarios where they might.'''
