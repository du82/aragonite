title = "React Router v7 | Remix"
description = "React Router v7 brings all the great things you love from Remix back to React Router"
full_description = '''React Router v7 brings everything you love about Remix back into React Router proper. We encourage all Remix v2 users to upgrade to React Router v7. For the majority of the React ecosystem that has been around for the last 10 years, we believe React Router v7 will be the smoothest way to bridge the gap between React 18 and 19. For React Router v6 users, this release brings a wealth of features from Remix back into React Router in the form of "framework mode". In addition to the handful of components and hooks that you already use, you now have access to a compiler with broad support for dependencies (based on Vite), server rendering, bundle splitting and optimization, vastly improved type safety, a world-class development environment with HMR, and much more. Read the React Router v6 upgrade guide for more information on how we've made the upgrade path as smooth as possible for you, and what you have to look forward to in v7. For Remix v2 users, this release brings a host of improvements to the type safety in Remix, as well as support for improved routing via routes.ts and pre-rendering static pages. Check out the Remix v2 upgrade guide for more information on how you can upgrade to React Router v7. If you're starting a new app today with React Router, you have a choice: do you want to use React Router as just a library and bring the rest of the pieces yourself? Or do you want a full framework, ala Remix? It really depends on how much of your stack you'd like to invent yourself, and how much leverage you'd like to get out of React Router. If you'd like to get a head start in framework mode, we have a number of templates you can choose from that include: All of our templates come with built-in deployment pipelines as well, whether you're using Docker and hosting on a VPS or deploying to a cloud solution like Cloudflare Workers.'''
