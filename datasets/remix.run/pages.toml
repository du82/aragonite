["https://remix.run/docs/en/main/guides/streaming"]
title = "Streaming | Remix"
full_description = "Streaming allows you to enhance user experience by delivering content as soon as it's available, rather than waiting for the entire content of a page to be ready. Ensure your hosting provider supports streaming, not all of them do. If your responses don't seem to stream, this might be the cause. Manual Setup Needed?: If your project began from scratch or used an older template, verify entry.server.tsx and entry.client.tsx have streaming support. If you don't see these files then you are using the defaults and streaming is supported. If you have created your own entries, the following are the template defaults for your reference: In order to render streamed data, you need to use <Suspense> from React and <Await> from Remix. It's a bit of boilerplate, but straightforward: This code will continue to work even before we start deferring data. It's a good idea to do the component code first. If you run into issues, it's easier to track down where the problem lies. Now that our project and route component are set up stream data, we can start deferring data in our loaders. We'll use the defer utility from Remix to do this. Instead of awaiting the reviews promise, we pass it to defer. This tells Remix to stream that promise over the network to the browser. It's important to initiate promises for deferred data before you await any other promises, otherwise you won't get the full benefit of streaming. Note the difference with this less efficient code example: When using defer for streaming, you can tell Remix how long to wait for deferred data to resolve before timing out via the <RemixServer abortDelay> prop (which defaults to 5 seconds) in your entry.server.tsx file. If you don't currently have an entry.server.tsx file you can expose it via npx remix reveal entry.server. You can also use this value to abort the React renderToPipeableStream method via a setTimeout. Streaming works by inserting script tags into the DOM as deferred promises resolve. If your page includes a Content Security Policy for scripts, you'll either need to weaken your security policy by including script-src 'self' 'unsafe-inline' in your Content-Security-Policy header, or add nonces to all of your script tags."
