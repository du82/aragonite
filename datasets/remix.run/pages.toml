["https://remix.run/docs/en/2.16.0/file-conventions/-server"]
title = ".server modules | Remix"
full_description = "While not strictly necessary, .server modules are a good way to explicitly mark entire modules as server-only. The build will fail if any code in a .server file or .server directory accidentally ends up in the client module graph. .server directories are only supported when using Remix Vite. The Classic Remix Compiler only supports .server files. When using the Classic Remix Compiler, .server modules are replaced with empty modules and will not result in a compilation error. Note that this can result in runtime errors."
