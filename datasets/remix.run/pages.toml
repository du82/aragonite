["https://remix.run/docs/en/main/guides/manual-mode"]
title = "Manual Dev Server | Remix"
full_description = '''By default, remix dev drives like an automatic. It keeps your app server up-to-date with the latest code changes by automatically restarting the app server whenever file changes are detected in your app code. This is a simple approach that stays out of your way, and we think will work well for most apps. But if app server restarts are slowing you down, you can take the wheel and drive remix dev like a manual: That means learning how to use the clutch to shift gears. It also means you might stall while your getting your bearings. It takes a bit more time to learn and its more code for you to maintain. We don't think its worth it unless you're feeling some pain with the default automatic mode. But if you are, Remix has got you covered. Before you start drag racing, it helps to understand how Remix works under the hood. It's especially important to understand that remix dev spins up not one, but two processes: the Remix compiler and your app server. Previously, we referred to the Remix compiler as the "new dev server" or the "v2 dev server". Technically, remix dev is a thin layer around the Remix compiler that does include a tiny server with a single endpoint (/ping) for coordinating hot updates. But thinking of remix dev as a "dev server" is unhelpful and wrongly implies that it is replacing your app server in dev. Rather than replacing your app server, remix dev runs your app server alongside the Remix compiler, so you get the best of both worlds: If you are running remix dev without the -c flag, then you are implicitly using remix-serve as your app server. No need to learn to drive stick, since remix-serve has a built-in sports mode that automatically shifts gears for you more aggressively at higher RPMs. Ok, I think we're stretching this car metaphor. 😅 In other words, remix-serve knows how to reimport server code changes without needing to restart itself. But if you are using -c to run your own app server, read on. You need some way to bust the import cache when you want to re-import modules with code changes. Also importing modules is different between CommonJS (require) and ESM (import) which makes things even more complicated.'''
