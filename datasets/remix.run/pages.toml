["https://remix.run/docs/en/2.16.0/discussion/react-router"]
title = "React Router | Remix"
full_description = "While Remix works as a multipage app, when JavaScript is loaded, it uses client side routing for a full Single Page App user experience, with all the speed and network efficiency that comes along with it. Remix is built on top of React Router and maintained by the same team. This means that you can use all the features of React Router in your Remix app. This also means that the 90% of Remix is really just React Router: a very old, very stable library that is perhaps the largest dependency in the React ecosystem. Remix simply adds a server behind it. Remix re-exports all the components and hooks from React Router DOM, so you don't need to install React Router yourself. Some of the components and hooks have been extended to work with Remix's server-rendering and data fetching features. For example, Link can prefetch data and resources in Remix, where the React Router version cannot."
year_published = 2025
