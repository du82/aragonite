["https://remix.run/docs/en/1.19.3/guides/data-loading"]
title = "Data Loading (v1.19.3) | Remix"
full_description = "One of the primary features of Remix is simplifying interactions with the server to get data into components. When you follow these conventions, Remix can automatically: Each route module can export a component and a loader. useLoaderData will provide the loader's data to your component: The component renders on the server and in the browser. The loader only runs on the server. That means our hard-coded products array doesn't get included in the browser bundles, and it's safe to use server-only for APIs and SDKs for things like database, payment processing, content management systems, etc. If your server-side modules end up in client bundles, move the imports for those modules to a file named {something}.server.ts with the .server.ts suffix to ensure they are excluded. When you name a file with $ like routes/users/$userId.tsx and routes/users/$userId/projects/$projectId.tsx the dynamic segments (the ones starting with $) will be parsed from the URL and passed to your loader on a params object. Because these params come from the URL and not your source code, you can't know for sure if they will be defined. That's why the types on the param's keys are string | undefined. It's good practice to validate before using them, especially in TypeScript to get type safety. Using invariant makes it easy. While you may be uncomfortable throwing errors like this with invariant when it fails, remember that in Remix you know the user will end up in the error boundary where they can recover from the problem instead of a broken UI. Remix polyfills the fetch API on your server, so it's very easy to fetch data from existing JSON APIs. Instead of managing state, errors, race conditions, and more yourself, you can do the fetch from your loader (on the server) and let Remix handle the rest. This is great when you already have an API to work with and don't care or need to connect directly to your data source in your Remix app. Since Remix runs on your server, you can connect directly to a database in your route modules. For example, you could connect to a Postgres database with Prisma."
year_published = 2025
clearnet = "https://remix.run/docs/en/1.19.3/guides/data-loading"
