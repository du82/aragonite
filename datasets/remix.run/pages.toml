["https://remix.run/docs/en/main/future/vite"]
title = "Vite | Remix"
full_description = '''Vite is a powerful, performant and extensible development environment for JavaScript projects. In order to improve and extend Remix's bundling capabilities, we now support Vite as an alternative compiler. In the future, Vite will become the default compiler for Remix. The existing Remix compiler, accessed via the remix build and remix dev CLI commands and configured via remix.config.js, is now referred to as the "Classic Remix Compiler". The Remix Vite plugin and the remix vite:build and remix vite:dev CLI commands are collectively referred to as "Remix Vite". The Remix Vite plugin is configured via a vite.config.ts file at the root of your project. For more information, see our Vite config documentation. While Vite provides a better development experience, Wrangler provides closer emulation of the Cloudflare environment by running your server code in Cloudflare's workerd runtime instead of Node. To simulate the Cloudflare environment in Vite, Wrangler provides Node proxies to local workerd bindings. Remix's Cloudflare Proxy plugin sets up these proxies for you: Whenever you change your wrangler.toml file, you'll need to run wrangler types to regenerate your bindings. Then, you can access your bindings via context.cloudflare.env. For example, with a KV namespace bound as MY_KV: If you'd like to add additional properties to the load context, you should export a getLoadContext function from a shared module so that load context in Vite, Wrangler, and Cloudflare Pages are all augmented in the same way: You must pass in getLoadContext to both the Cloudflare Proxy plugin and the request handler in functions/[[path]].ts, otherwise you'll get inconsistent load context augmentation depending on how you run your app. First, pass in getLoadContext to the Cloudflare Proxy plugin in your Vite config to augment load context when running Vite: Next, pass in getLoadContext to the request handler in your functions/[[path]].ts file to augment load context when running Wrangler or when deploying to Cloudflare Pages:'''
