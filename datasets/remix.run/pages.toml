["https://remix.run/docs/en/1.19.3/components/link"]
title = "Link (v1.19.3) | Remix"
full_description = '''This component renders an anchor tag and is the primary way the user will navigate around your website. Anywhere you would have used <a href="..."> you should now use <Link to="..."/> to get all the performance benefits of client-side routing in Remix. In the effort to remove all loading states from your UI, Link can automatically prefetch all the resources the next page needs: JavaScript modules, stylesheets, and data. This prop controls if and when that happens. You may need to use the :last-of-type selector instead of :last-child when styling child elements inside of your links Remix uses the browser's cache for prefetching with HTML <link rel="prefetch"/> tags, which provides a lot of subtle benefits (like respecting HTTP cache headers, doing the work in browser idle time, using a different thread than your app, etc.) but the implementation might mess with your CSS since the link tags are rendered inside of your anchor tag. This means a *:last-child {} style selectors won't work. You'll need to change them to a *:last-of-type {} and you should be good. We will eventually get rid of this limitation. This component is a wrapper around React Router <Link/>. It has the same API except for Remix's prefetch addition. For more information and advanced usage, refer to the React Router docs.'''
year_published = 2025
