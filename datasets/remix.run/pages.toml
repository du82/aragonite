["https://remix.run/resources/remix-auth-webauthn-strategy"]
title = "Remix Auth WebAuthn Strategy | Remix Resources"
description = "A Remix Auth strategy for signing in with Web Authentication passkeys."
full_description = '''alexanderson1993/remix-auth-webauthnA Remix Auth strategy for signing in with Web Authentication passkeys.Star 87npm install remix-auth remix-auth-webauthnCopy code to clipboardWebAuthn Strategy - Remix Auth Authenticate users with Web Authentication passkeys and physical tokens. It is implemented using SimpleWebAuthn and supports user authentication and user registration using passkeys. This package should be considered unstable. It works in my limited testing, but I haven't covered every case or written automated tests. Caveat emptor. Supported runtimes Runtime Has Support Node.js ✅ Cloudflare ❓ I haven't tested it in a Cloudflare environment. If you do, let me know how it goes! This package also only supports ESM, because package.json is scary and I'm not certain how to set up the necessary build steps. You might need to add this to your serverDependenciesToBundle in your remix.config.js file. About Web Authentication Web Authentication lets a user register a device as a passkey. The device could be a USB device, like a Yubikey, the computer running the webpage, or a separate Bluetooth connected device like a smartphone. This page has a good summary of the benefits, and you can try it firsthand here. WebAuthn follows a two-step process. First, a device is registered as a passkey. The browser generates a private/public key pair, associates it with a user ID and username, and sends the public key to the server to be verified. At this point the server could create a new user with that passkey, or if the user is already signed in the server could associate that passkey with the existing user. In the authentication step, the browser uses the passkey's private key to sign a challenge sent by the server, which the server checks with its stored public key in the verification step. This strategy handles generating the challenge, storing it in session storage, passing the WebAuthn options to the client, generating the passkeys, and verifying the passkeys. Since this strategy requires database persistence and browser-based APIs, it requires a bit more work to set up. Note: This strategy also requires generating string user IDs on the browser. If your setup requires generating IDs, you might have to work around this limitation by creating a mapping of the authenticator userIds and your actual userIds. Setup Install This project depends on remix-auth. Install it and follow the setup instructions. npm install remix-auth remix-auth-webauthn Session storage You'll need to store the Passkey challenge in some kind of session storage to avoid replay attacks. You can use the same session storage which stores your user object. import { createCookieSessionStorage } from "react-router"; import { User } from "~/utils/db.server"; type SessionData = { user: User; challenge?: string; }; type SessionFlashData = { error: string; }; export const userSession = createCookieSessionStorage< SessionData, SessionFlashData >({ cookie: { name: "__session", httpOnly: true, maxAge: 60 * 60 * 24 * 30, // One month path: "/", sameSite: "lax", secrets: ["s3cret1"], secure: process.env.NODE_ENV === "production", }, }); Database This strategy requires database access to store user Authenticators. The kind of database doesn't matter, but the strategy expects authenticators to match this interface (as provided by @simplewebauthn/server): interface Authenticator { // SQL: Encode to base64url then store as `TEXT` or a large `VARCHAR(511)`. Index this column credentialID: string; // Some reference to the user object. Consider indexing this column too userId: string; // SQL: Encode to base64url and store as `TEXT` credentialPublicKey: string; // SQL: Consider `BIGINT` since some authenticators return atomic timestamps as counters counter: number; // SQL: `VARCHAR(32)` or similar, longest possible value is currently 12 characters // Ex: 'singleDevice' | 'multiDevice' credentialDeviceType: string; // SQL: `BOOL` or whatever similar type is supported credentialBackedUp: boolean; // SQL: `VARCHAR(255)` and store string array or a CSV string // Ex: ['usb' | 'ble' | 'nfc' | 'internal'] transports: string; // SQL: `VARCHAR(36)` or similar, since AAGUIDs are 36 characters in length aaguid: string; } If you're just playing around, you can use this stub in-memory database. Show Code // /app/db.server.ts import { type Authenticator } from "remix-auth-webauthn/server"; export type User = { id: string; username: string }; const authenticators = new Map<string, Authenticator>(); const users = new Map<string, User>(); export async function getAuthenticatorById(id: string) { return authenticators.get(id) || null; } export async function getAuthenticators(user: User | null | undefined) { if (!user) return []; const userAuthenticators: Authenticator[] = []; authenticators.forEach((authenticator) => { if (authenticator.userId === user.id) { userAuthenticators.push(authenticator); } }); return userAuthenticators; } export async function getUserByUsername(username: string) { users.forEach((user) => { if (user.username === username) { return user; } }); return null; } export async function getUserById(id: string) { return users.get(id) || null; } export async function createAuthenticator( authenticator: Omit<Authenticator, "userId">, userId: string ) { authenticators.set(authenticator.id, { ...authenticator, userId }); } export async function createUser(username: string) { const user = { id: Math.random().toString(36), username }; users.set(user.id, user); return user; } Note that this database will reset every time your server restarts, but any passkeys you generate will still be present on your device. You'll have to manually delete them. Create the strategy instance This strategy tries not to make assumptions about your database structure, so it requires several configuration options. Also, to give you access to the methods on the WebAuthnStrategy instance, create and export it before passing it to authenticator.use. // /app/authenticator.server.ts import { Authenticator } from "remix-auth"; import { WebAuthnStrategy, Authenticator as WebAuthnAuthenticator, } from "remix-auth-webauthn"; import { createAuthenticator, createUser, getAuthenticatorById, getAuthenticators, getUserById, getUserByUsername, User, } from "~/utils/db.server"; export let authenticator = new Authenticator<User>(); export const webAuthnStrategy = new WebAuthnStrategy<User>( { // The React Router session storage where the "challenge" key is stored sessionStorage: userSession, // The human-readable name of your app // Type: string | (response:Response) => Promise<string> | string rpName: "Remix Auth WebAuthn", // The hostname of the website, determines where passkeys can be used // See https://www.w3.org/TR/webauthn-2/#relying-party-identifier // Type: string | (response:Response) => Promise<string> | string rpID: (request) => new URL(request.url).hostname, // Website URL (or array of URLs) where the registration can occur origin: (request) => new URL(request.url).origin, // Return the list of authenticators associated with this user. You might // need to transform a CSV string into a list of strings at this step. getUserAuthenticators: async (user) => { const authenticators = await getAuthenticators(user); return authenticators.map((authenticator) => ({ ...authenticator, transports: authenticator.transports.split(","), })); }, // Transform the user object into the shape expected by the strategy. // You can use a regular username, the users email address, or something else. getUserDetails: (user) => user ? { id: user.id, username: user.username } : null, // Find a user in the database with their username/email. getUserByUsername: (username) => getUserByUsername(username), getAuthenticatorById: (id) => getAuthenticatorById(id), }, async function verify({ authenticator, type, username }) { // ...Implement later } ); authenticator.use(webAuthnStrategy); Write your verify function The verify function handles both the registration and authentication steps, and expects you to return a user object or throw an error if verification fails. The verify function will receive an Authenticator object (without the userId), the provided username, and the type of verification - either registration or authentication. Note: It should be possible to expand this to support giving a single user multiple passkeys by checking to see if the user is already logged in. const webAuthnStrategy = new WebAuthnStrategy( { // Options here... }, async function verify({ authenticator, type, username }) { let user: User | null = null; const savedAuthenticator = await getAuthenticatorById(authenticator.id); if (type === "registration") { // Check if the authenticator exists in the database if (savedAuthenticator) { throw new Error("Authenticator has already been registered."); } else { // Username is null for authentication verification, // but required for registration verification. // It is unlikely this error will ever be thrown, // but it helps with the TypeScript checking if (!username) throw new Error("Username is required."); user = await getUserByUsername(username); // Don't allow someone to register a passkey for // someone elses account. if (user) throw new Error("User already exists."); // Create a new user and authenticator user = await createUser(username); await createAuthenticator(authenticator, user.id); } } else if (type === "authentication") { if (!savedAuthenticator) throw new Error("Authenticator not found"); user = await getUserById(savedAuthenticator.userId); } if (!user) throw new Error("User not found"); return user; } ); Set up your login page loader and action The login page will need a loader to supply the WebAuthn options from the server, and an action to deliver the passkey back to the server. // /app/routes/_auth.login.ts import type { Route } from "./+types/home"; export async function loader({ request }: Route.LoaderArgs) { const session = await userSession.getSession(request.headers.get("cookie")); const user = session.get("user"); const options = await webAuthnStrategy.generateOptions(request, user); // Set the challenge in a session cookie so it can be accessed later. session.set("challenge", options.challenge); // Update the cookie return data( { options, user }, { headers: { "Set-Cookie": await userSession.commitSession(session), "Cache-Control": "no-store", }, } ); } export async function action({ request }: Route.ActionArgs) { const session = await userSession.getSession(request.headers.get("cookie")); try { const user = await authenticator.authenticate("webauthn", request); session.set("user", user); // Redirect to the logged-in page. throw redirect("/", { headers: { "Set-Cookie": await userSession.commitSession(session), }, }); } catch (error) { // This allows us to return errors to the page without triggering the error boundary. if (error instanceof Error) { return { error, user: null }; } // Throw other errors, such as responses that need to redirect the browser. throw error; } } Make sure the session storage that you use to set your challenge is the same storage you passed to the WebAuthnStrategy class Set up the form For ease-of-use, this strategy provides an onSubmit handler which performs the necessary browser-side actions to generate passkeys. The onSubmit handler is generated by passing in the options object from the loader above. Depending on your setup, you might need to implement separate forms for registration and authentication. When registering, the process follows a few steps: When first visiting the login page, the server will provide an options object which can be used for both registration and authentication. The user requests registration by entering their desired username and pressing the "Check Username" button, which submits a GET request to get updated options. The server responds with whether the username is taken and if the user already has registered a passkey so the browser doesn't produce duplicates. The form must be submitted a second time, as POST this time, with the actual passkey for registration. The server verifies the passkey, creates the new user, and logs the user in. Your registration form should include a required username field and <button name="intent" value="registration"> for triggering registration. You can use formMethod="GET" on a submit button to submit the value of the username field to the loader to check if the username is available. The registration button should change state and behavior based on whether the options from the loader indicate that the username is available. This is demonstrated below. Authentication is a simpler process and only requires one button press: The user requests authentication, and the browser shows the available passkeys for the domain. The user picks a passkey, and the form is generated and submitted to the server. The server verifies the passkey by checking it against the database, and logs the user in. Since the username is stored with the passkey in the browser, the username field is not required for the authentication form, but you should include a submit button like so: <button name="intent" value="authentication"> to trigger the authentication flow. Here's what the forms might look like in practice: // /app/routes/_auth.login.ts import { handleFormSubmit } from "remix-auth-webauthn/browser"; export default function Home({ loaderData, actionData }: Route.ComponentProps) { return ( <Form onSubmit={handleFormSubmit(loaderData.options)} method="POST" className="flex flex-col gap-2 m-8 w-64" > <label>Username</label> <input type="text" name="username" placeholder="alexanderson1993" className="p-2 rounded" /> <button formMethod="GET" className="px-2 py-1 bg-blue-500 rounded"> Check Username </button> <button name="intent" value="registration" disabled={loaderData.options.usernameAvailable !== true} className="px-2 py-1 bg-orange-500 rounded disabled:opacity-50" > Register </button> <button name="intent" value="authentication" className="px-2 py-1 bg-green-500 rounded" > Authenticate </button> {actionData?.error ? <div>{actionData.error.message}</div> : null} </Form> ) } You can set the attestationType in the second parameter of handleFormSubmit. If omitted, it defaults to none: onSubmit={handleFormSubmit(options, { attestationType: "direct" })} Displaying passkeys to the user An important part of supporting passkeys in your app is allowing your users to manage their passkeys on a settings page or similar. Users should be able to see a list of their passkeys, delete passkeys from your database, and register new passkeys. You can use the getUserAuthenticators function on the strategy instance to get a list of passkeys associated with the user: // /app/routes/settings.tsx export async function loader({ request }: LoaderFunctionArgs) { const user = await authenticator.isAuthenticated(request); if (!user) { return redirect("/login"); } const authenticators = await webAuthnStrategy.getUserAuthenticators(user); return json({ authent'''
