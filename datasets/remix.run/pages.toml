["https://remix.run/docs/en/1.19.3/components/nav-link"]
title = "NavLink (v1.19.3) | Remix"
full_description = '''A <NavLink> is a special kind of <Link> that knows whether or not it is "active" or "pending". This is useful when building a navigation menu, such as a breadcrumb or a set of tabs where you'd like to show which of them is currently selected. It also provides useful context for assistive technology like screen readers. By default, an active class is added to a <NavLink> component when it is active so you can use CSS to style it. The className prop works like a normal className, but you can also pass it a function to customize the classNames applied based on the active and pending state of the link. The style prop works like a normal style prop, but you can also pass it a function to customize the styles applied based on the active and pending state of the link. You can pass a render prop as children to customize the content of the <NavLink> based on the active and pending state, which is useful to change styles on internal elements. The end prop changes the matching logic for the active and pending states to only match to the "end" of the NavLinks's to path. If the URL is longer than to, it will no longer be considered active. <NavLink to="/"> is an exceptional case because every URL matches /. To avoid this matching every single route by default, it effectively ignores the end prop and only matches when you're at the root route. When a NavLink is active it will automatically apply <a aria-current="page"> to the underlying anchor tag. See aria-current on MDN.'''
