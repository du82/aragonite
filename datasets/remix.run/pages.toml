["https://remix.run/blog/remix-vite-stable"]
title = "Remix Vite is Now Stable | Remix"
description = "Support for Vite is now stable in Remix v2.7."
full_description = "Today we’re excited to announce that support for Vite is now stable in Remix v2.7.0! After the initial unstable release of Remix Vite, we’ve been hard at work refining and extending it over the past few months with help from all of our early adopters and community contributors. The most significant change we’ve made is so important that we’ll reserve discussing its impact on the React ecosystem for a later post. The short version is that Remix now supports building purely static sites that don’t require a JavaScript server in production, all while keeping the benefits of Remix’s file based route conventions, automatic code splitting, route module prefetching, head tag management and more. This unlocks an entirely new migration path for React Router consumers to move to Remix without having to switch to a server-rendered architecture — which for many people isn’t even an option. And for anyone that wants to introduce a server to their Remix app in the future, the migration path is now much more straightforward. React Router supports setting a basename for your app, allowing you to nest your entire application within a subpath — but this feature was notably absent in Remix. While it was possible to work around this by manually prefixing routes and links, it obviously wasn’t as convenient as setting a single config value. With the move to Vite, the lack of basename support became more apparent since Vite exposes its own “base” option. Many consumers mistakenly assumed that this would work with Remix, but this option is really the same as Remix’s “publicPath” option. In order to avoid this confusion, there is no longer a publicPath option (you should use Vite’s base option instead), and the Remix Vite plugin now has a brand new basename option. As a result, it’s never been easier to nest your Remix application within a subpath of your site, without having to touch your application code. With our initial unstable release of Remix Vite, Cloudflare Pages support wasn’t quite ready yet. Cloudflare’s workerd runtime is completely separate from Vite’s Node environment so we needed to figure out the best way to bridge this gap."
year_published = 2025
