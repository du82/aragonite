title = "Remix Stacks | Remix"
description = "Introducing the easiest way to create a ready-to-deploy, production grade, fast web application with Remix."
full_description = "When you're building a web application, in addition to the web framework you're using and all the tooling associated with that (which Remix is happy to provide), you typically need a CI/CD pipeline, a database, and a hosting platform. Lots of our early adopters are frontend developers who aren't accustomed to deploying app and database servers. And frankly even folks who are accustomed to it often don't enjoy the process of getting things set up. When lightning has struck 🌩 and you're ready to start coding your new mind blowing idea 🤯, the last thing you want is the tedious process of setup to get in between your inspiration and deploying your app. And when that idea turns out to be a great one, nobody wants to deploy that rushed setup to production. That's why we're excited to announce the release of Remix Stacks: the easiest way to get your Remix application started and ready to deploy! 🥞 In just a few minutes, we can get your app off the ground and ready to deploy all wired up with a CI/CD pipeline, connected database with a basic data model (via prisma), and even user authentication! It also has tools setup for development like Tailwind, TypeScript, Prettier, ESLint, Cypress, MSW, Docker, vitest, Testing Library, and more! For all of these stacks, all you do is run the normal npx create-remix@latest and choose them from the CLI. This will generate your project for you and then just pop open the README.md to get things running! In all cases, you get a full app that's ready to develop locally and deploy to production with automated GitHub actions. It even supports a staging environment for your dev branch! We even have all layers of the testing trophy setup for you! With TypeScript/Prettier/ESLint handling the static portion of testing, Vitest handling the unit bit, and Cypress/Testing Library/MSW handling the integration/E2E bit! In fact, we even have a custom cy.login() command that allows you to hit the ground running with tests requiring authentication. And there's already a test in place for testing user registration and authentication. Get started on the right foot and code your ideas with confidence!"
