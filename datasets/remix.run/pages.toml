["https://remix.run/docs/en/2.16.0/components/nav-link"]
title = "NavLink | Remix"
full_description = '''When a NavLink is active it will automatically apply <a aria-current="page"> to the underlying anchor tag. See aria-current on MDN. A pending class is added to a <NavLink> component when it is pending during a navigation, so you can use CSS to style it. A transitioning class is added to a <NavLink viewTransition> component when it is transitioning during a navigation, so you can use CSS to style it. The end prop changes the matching logic for the active and pending states to only match to the "end" of the NavLinks's to path. If the URL is longer than to, it will no longer be considered active. <NavLink to="/"> is an exceptional case because every URL matches /. To avoid this matching every single route by default, it effectively ignores the end prop and only matches when you're at the root route. The viewTransition prop enables a View Transition for this navigation by wrapping the final state update in document.startViewTransition(). By default, during the transition a transitioning class will be added to the <a> element that you can use to customize the view transition. You may also use the className/style props or the render props passed to children to further customize based on the isTransitioning value.'''
