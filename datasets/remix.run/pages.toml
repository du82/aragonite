["https://remix.run/docs/en/2.16.0/guides/contributing"]
title = "Contributing | Remix"
full_description = '''Our goal is for Remix development to be steady, stable, and open. We can't do that without our wonderful community of users! This document will familiarize you with our development process as well as how to get your environment set up. To ensure your work has the best chance of being accepted, please read this before contributing anything! All contributors sending a Pull Request need to sign the Contributor License Agreement (CLA) that explicitly assigns ownership of the contribution to us. When you start a pull request, the remix-cla-bot will prompt you to review the CLA and sign it by adding your name to contributors.yml If you have an idea for a new feature, please don't send a Pull Request, but follow this process instead: Bug fix PRs without a test case might be closed immediately (some things are hard to test, we’ll use discretion here) If you think you've found a bug but don't have the time to send a PR, please follow these guidelines: Create a minimal reproduction of the issue somewhere like Stackblitz, Replit, CodeSandbox, etc. that we can visit and observe the bug: If this is not possible (related to some hosting setup, etc.) please create a GitHub repo that we can run with clear instructions in the README to observe the bug. If a Roadmap Issue is expected to be large (involving multiple tasks, authors, PRs, etc.) a temporary project board will be created by the Admin team. Before you can contribute to the codebase, you will need to fork the repo. This will look a bit different depending on what type of contribution you are making: Install dependencies by running pnpm. If you install using npm, unnecessary package-lock.json files will be generated. Install Playwright to be able to run tests properly by running npx playwright install, or use the Visual Studio Code plugin. You can set the base in GitHub when authoring the PR with the dropdown below the "Compare changes" heading: We use a mix of jest and playwright for our testing in this project. We have a suite of integration tests in the integration folder and packages have their own jest configuration, which are then referenced by the primary jest config in the root of the project.'''
