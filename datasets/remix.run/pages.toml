title = "Disabling JavaScript (v1.19.3) | Remix"
full_description = '''Do you ever look at a page on your site and think "why are we loading all of this JavaScript? There's nothing on this page but links!" This may seem a little odd for a JavaScript framework, but you can easily turn off JavaScript with a boolean and your data loading, links, and even forms will still work. Open up each route module you want to include JavaScript for and add a "handle". This is a way for you to provide any kind of meta information about a route to the parent route (as you'll see in a moment). All of your data loading will still work on the server render, and all of your <Link>s render normal <a> underneath, so they will continue to work.'''
