title = "vite.config.ts | Remix"
full_description = '''If your project is still using the Classic Remix Compiler, you should refer to the remix.config.js documentation instead. Remix uses Vite to compile your application. You'll need to provide a Vite config file with the Remix Vite plugin. Here's the minimum configuration you'll need: Vite supports using a .js file for your config, but we recommend using TypeScript to help ensure your configuration is valid. This is an array of globs (via minimatch) that Remix will match to files while reading your app/routes directory. If a file matches, it will be ignored rather than treated like a route module. This is useful for ignoring CSS/test files you wish to colocate. A function for defining custom routes, in addition to those already defined using the filesystem convention in app/routes. Both sets of routes will be merged. An optional basename for your route paths, passed through to the React Router "basename" option. Please note that this is different from your asset paths. You can can configure the base public path for your assets via the Vite "base" option. You may also want to enable the manifest option since, when server bundles are enabled, it contains mappings between routes and server bundles.'''
