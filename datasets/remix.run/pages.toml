["https://remix.run/resources/remix-supa-fly-stack"]
title = "Remix Supa Fly Stack | Remix Resources"
description = "The Remix Stack for deploying to Fly with Supabase, authentication, testing, linting, formatting, etc."
full_description = '''rphlmr/supa-fly-stackThe Remix Stack for deploying to Fly with Supabase, authentication, testing, linting, formatting, etc.Star 319Sponsornpx create-remix template rphlmr/supa-fly-stackCopy code to clipboardaddflydotiotagaddsupabasetagRemix Supa Fly Stack This Readme will be re-written soon Learn more about Remix Stacks. npx create-remix --template rphlmr/supa-fly-stack What's in the stack Fly app deployment with Docker Production-ready Supabase Database Healthcheck endpoint for Fly backups region fallbacks GitHub Actions to deploy on merge to production and staging environments Email/Password Authentication / Magic Link, with cookie-based sessions Database ORM with Prisma Forms Schema (client and server sides !) validation with Remix Params Helper Styling with Tailwind End-to-end testing with Cypress Local third party request mocking with MSW Unit testing with Vitest and Testing Library Code formatting with Prettier Linting with ESLint Static Types with TypeScript Not a fan of bits of the stack? Fork it, change it, and use npx create-remix --template your/repo! Make it your own. Development Create a Supabase Database (free tier gives you 2 databases) Note: Only one for playing around with Supabase or 2 for staging and production Note: Used all your free tiers ? Also works with Supabase CLI and local self-hosting Note: Create a strong database password, but prefer a passphrase, it'll be more easy to use in connection string (no need to escape special char) example : my_strong_passphrase Go to https://app.supabase.io/project/{PROJECT}/settings/api to find your secrets "Project API keys" Add your SUPABASE_URL, SERVER_URL, SUPABASE_SERVICE_ROLE (aka service_role secret), SUPABASE_ANON_PUBLIC (aka anon public) and DATABASE_URL in the .env file Note: SERVER_URL is your localhost on dev. It'll work for magic link login DATABASE_URL="postgres://postgres:{STAGING_POSTGRES_PASSWORD}@db.{STAGING_YOUR_INSTANCE_NAME}.supabase.co:5432/postgres" SUPABASE_ANON_PUBLIC="{ANON_PUBLIC}" SUPABASE_SERVICE_ROLE="{SERVICE_ROLE}" SUPABASE_URL="https://{STAGING_YOUR_INSTANCE_NAME}.supabase.co" SESSION_SECRET="super-duper-s3cret" SERVER_URL="http://localhost:3000" This step only applies if you've opted out of having the CLI install dependencies for you: npx remix init Initial setup: npm run setup Start dev server: npm run dev This starts your app in development mode, rebuilding assets on file changes. The database seed script creates a new user with some data you can use to get started: Email: hello@supabase.com Password: supabase Relevant code: This is a pretty simple note-taking app, but it's a good example of how you can build a full-stack app with Prisma, Supabase, and Remix. The main functionality is creating users, logging in and out (handling access and refresh tokens + refresh on expiration), and creating and deleting notes. auth / session ./app/modules/auth creating, and deleting notes ./app/modules/note Deployment Do what you know if you are a Fly.io expert. This Remix Stack comes with two GitHub Actions that handle automatically deploying your app to production and staging environments. Prior to your first deployment, you'll need to do a few things: Install Fly Sign up and log in to Fly fly auth signup Note: If you have more than one Fly account, ensure that you are signed into the same account in the Fly CLI as you are in the browser. In your terminal, run fly auth whoami and ensure the email matches the Fly account signed into the browser. Create two apps on Fly, one for staging and one for production: fly apps create supa-fly-stack-template fly apps create supa-fly-stack-template-staging # ** not mandatory if you don't want a staging environnement ** Note: For production app, make sure this name matches the app set in your fly.toml file. Otherwise, you will not be able to deploy. Initialize Git. git init Create a new GitHub Repository, and then add it as the remote for your project. Do not push your app yet! git remote add origin <ORIGIN_URL> Add a FLY_API_TOKEN to your GitHub repo. To do this, go to your user settings on Fly and create a new token, then add it to your repo secrets with the name FLY_API_TOKEN. Add a SESSION_SECRET, SUPABASE_URL, SUPABASE_SERVICE_ROLE,SUPABASE_ANON_PUBLIC, SERVER_URL and DATABASE_URL to your fly app secrets Note: To find your SERVER_URL, go to your fly.io dashboard To do this you can run the following commands: # production (--app name is resolved from fly.toml) fly secrets set SESSION_SECRET=$(openssl rand -hex 32) fly secrets set SUPABASE_URL="https://{YOUR_INSTANCE_NAME}.supabase.co" fly secrets set SUPABASE_SERVICE_ROLE="{SUPABASE_SERVICE_ROLE}" fly secrets set SUPABASE_ANON_PUBLIC="{SUPABASE_ANON_PUBLIC}" fly secrets set DATABASE_URL="postgres://postgres:{POSTGRES_PASSWORD}@db.{YOUR_INSTANCE_NAME}.supabase.co:5432/postgres" fly secrets set SERVER_URL="https://{YOUR_STAGING_SERVEUR_URL}" # staging (specify --app name) ** not mandatory if you don't want a staging environnement ** fly secrets set SESSION_SECRET=$(openssl rand -hex 32) --app supa-fly-stack-template-staging fly secrets set SUPABASE_URL="https://{YOUR_STAGING_INSTANCE_NAME}.supabase.co" --app supa-fly-stack-template-staging fly secrets set SUPABASE_SERVICE_ROLE="{STAGING_SUPABASE_SERVICE_ROLE}" --app supa-fly-stack-template-staging fly secrets set SUPABASE_ANON_PUBLIC="{STAGING_SUPABASE_ANON_PUBLIC}" --app supa-fly-stack-template-staging fly secrets set DATABASE_URL="postgres://postgres:{STAGING_POSTGRES_PASSWORD}@db.{STAGING_YOUR_INSTANCE_NAME}.supabase.co:5432/postgres" --app supa-fly-stack-template-staging fly secrets set SERVER_URL="https://{YOUR_STAGING_SERVEUR_URL}" --app supa-fly-stack-template-staging If you don't have openssl installed, you can also use 1password to generate a random secret, just replace $(openssl rand -hex 32) with the generated secret. Now that everything is set up you can commit and push your changes to your repo. Every commit to your main branch will trigger a deployment to your production environment, and every commit to your dev branch will trigger a deployment to your staging environment. Note: To deploy manually, just run fly deploy (It'll deploy app defined in fly.toml) GitHub Actions DISCLAIMER : Github actions ==> I'm not an expert about that. Read carefully before using it We use GitHub Actions for continuous integration and deployment. Anything that gets into the main branch will be deployed to production after running tests/build/etc. Anything in the dev branch will be deployed to staging. 👉 You have to add some env secrets for cypress. 👈 Add a SESSION_SECRET, SUPABASE_URL, SUPABASE_SERVICE_ROLE,SUPABASE_ANON_PUBLIC, SERVER_URL and DATABASE_URL to your repo secrets Testing Cypress We use Cypress for our End-to-End tests in this project. You'll find those in the cypress directory. As you make changes, add to an existing file or create a new file in the cypress/e2e directory to test your changes. We use @testing-library/cypress for selecting elements on the page semantically. To run these tests in development, complete your .env and run npm run test:e2e:dev which will start the dev server for the app as well as the Cypress client. Make sure the database is running in docker as described above. We also have a utility to auto-delete the user at the end of your test. Just make sure to add this in each test file: afterEach(() => { cy.cleanupUser(); }); That way, we can keep your test db clean and keep your tests isolated from one another. Vitest For lower level tests of utilities and individual components, we use vitest. We have DOM-specific assertion helpers via @testing-library/jest-dom. Type Checking This project uses TypeScript. It's recommended to get TypeScript set up for your editor to get a great in-editor experience with type checking and auto-complete. To run type checking across the whole project, run npm run typecheck. Linting This project uses ESLint for linting. That is configured in .eslintrc.js. Formatting We use Prettier for auto-formatting in this project. It's recommended to install an editor plugin (like the VSCode Prettier plugin) to get auto-formatting on save. There's also a npm run format script you can run to format all files in the project. Start working with Supabase You are now ready to go further, congrats! To extend your Prisma schema and apply changes on your supabase database : Make your changes in ./app/database/schema.prisma Prepare your schema migration npm run db:prepare-migration Check your migration in ./app/database/migrations Apply this migration to production npm run db:deploy-migration If your token expires in less than 1 hour (3600 seconds in Supabase Dashboard) If you have a lower token lifetime than me (1 hour), you should take a look at REFRESH_ACCESS_TOKEN_THRESHOLD in ./app/modules/auth/session.server.ts and set what you think is the best value for your use case. Supabase RLS You may ask "can I use RLS with Remix". The answer is "Yes" but It has a cost. Using Supabase SDK server side to query your database (for those using RLS features) adds an extra delay due to calling a Gotrue rest API instead of directly calling the Postgres database (and this is fine because at first Supabase SDK is for those who don't have/want backend). In my benchmark, it makes my pages twice slower. (~+200ms compared to a direct query with Prisma) Supabase login with magic link In order to make the register/login with magic link work, you will need to add some configuration to your Supabase. You need to add the site url as well as the redirect urls of your local, test and live app that will be used for oauth To do that navigate to Authentication > URL configiration and add the folowing values: https://localhost:3000/oauth/callback https://localhost:3000/reset-password https://staging-domain.com/oauth/callback https://staging-domain.com/reset-password https://live-domain.com/oauth/callback https://live-domain.com/reset-password'''
