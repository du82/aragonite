["https://remix.run/docs/en/2.16.0/guides/bff"]
title = "Backend For Frontend | Remix"
full_description = '''While Remix can serve as your fullstack application, it also fits perfectly into the "Backend for your Frontend" architecture. The BFF strategy employs a web server with a job scoped to serving the frontend web app and connecting it to the services it needs: your database, mailer, job queues, existing backend APIs (REST, GraphQL), etc. Instead of your UI integrating directly from the browser to these services, it connects to the BFF and the BFF connects to your services. Mature apps already have a lot of backend application code in Ruby, Elixir, PHP, etc. and there's no reason to justify migrating it all to a server-side JavaScript runtime just to get the benefits of Remix. Instead, you can use your Remix app as a backend for your frontend. Because Remix polyfills the Web Fetch API, you can use fetch right from your loaders and actions to your backend. There are several benefits of this approach vs. fetching directly from the browser. The highlighted lines above show how you can: Again, Remix can be used as your only server by talking directly to the database and other services with server-side JavaScript APIs, but it also works perfectly as a backend for your frontend. Go ahead and keep your existing API server for application logic and let Remix connect the UI to it.'''
year_published = 2025
clearnet = "https://remix.run/docs/en/2.16.0/guides/bff"
tags = ["backend", "frontend"]
