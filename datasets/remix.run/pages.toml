["https://remix.run/blog/react-router-v6"]
title = "React Router v6 | Remix"
description = "After years of work and millions of monthly downloads, React Router v6 is finally here."
full_description = '''This release has been a long time coming. The last time we released a major breaking API change was over four years ago in March 2017 when we released version 4. Some of you probably weren't even born then. Needless to say, a LOT has happened since that time: I could easily write at least a few pages about each of the bullet points above and its significance to both our business and the open source project we've been managing since 2014. But I don't want to bore you with the past. We've all been through a lot over the last few years. Some of it has been rough, but hopefully you've experienced some new growth as well. We sure have. In fact, we completely changed our business model! Today I want to focus on the future and how we are drawing on our experiences from the past to build the strongest possible future for the React Router project and the incredible React community. There will be code. But we are also going to talk about business and what you can expect from us (hint: it's very colorful). Easily the single biggest reason for a new router release is the advent of React hooks. You may remember Ryan's talk introducing hooks to the world at React Conf 2018 and how a lot of the code that we were all used to writing with React's "lifecycle methods" just sort of melts away as you refactor class-based React code to hooks. If you don't remember that talk, you should probably just stop here and go watch it. I'll wait. Although we bolted a few hooks onto v5 in 5.1, React Router v6 was built from scratch using React hooks. They are such an efficient low-level primitive that we were able to eliminate a lot of the boilerplate code by providing hooks that do the job instead. This means your v6 code will be much more compact and elegant than your v5 code. Also, it's not just your code that's getting smaller and more efficient... it's ours too! Our minified gzipped bundle size dropped by more than 50% in v6! React Router now adds less than 4kb to your total app bundle, and your actual results will be even smaller once you run it through your bundler with tree-shaking turned on.'''
year_published = 2025
clearnet = "https://remix.run/blog/react-router-v6"
