["https://remix.run/docs/en/dev/discussion/progressive-enhancement"]
title = "Progressive Enhancement (dev branch) | Remix"
full_description = '''Progressive enhancement is a strategy in web design that puts emphasis on web content first, allowing everyone to access the basic content and functionality of a web page, whilst users with additional browser features or faster Internet access receive the enhanced version instead. Coined in 2003 by Steven Champeon & Nick Finck, the phrase emerged during a time of varied CSS and JavaScript support across different browsers, with many users actually browsing the web with JavaScript disabled. Today, we are fortunate to develop for a much more consistent web and where the majority of users have JavaScript enabled. However, we still believe in the core principles of progressive enhancement in Remix. It leads to fast and resilient apps with simple development workflows. Performance: While it's easy to think that only 5% of your users have slow connections, the reality is that 100% of your users have slow connections 5% of the time. Simplicity: Building your apps in a progressively enhanced way with Remix is actually simpler than building a traditional SPA. Sending HTML from the server allows your app to do more things in parallel than a typical Single Page App (SPA), making the initial loading experience and subsequent navigations faster. A Remix app can start doing work the moment the request hits the server and stream the response so that the browser can start downloading JavaScript, other assets, and data in parallel. While your users probably don't browse the web with JavaScript disabled, everybody has JavaScript disabled until it has finished loading. As soon as you begin server rendering your UI, you need to account for what happens when they try to interact with your app before JavaScript has loaded. Remix embraces progressive enhancement by building its abstraction on top of HTML. This means that you can build your app in a way that works without JavaScript, and then layer on JavaScript to enhance the experience. The simplest case is a <Link to="/account">. These render an <a href="/account"> tag that works without JavaScript. When JavaScript loads, Remix will intercept clicks and handle the navigation with client side routing. This gives you more control over the UX instead of just spinning favicons in the browser tab--but it works either way.'''
year_published = 2025
clearnet = "https://remix.run/docs/en/dev/discussion/progressive-enhancement"
