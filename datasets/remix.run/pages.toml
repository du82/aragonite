["https://remix.run/docs/en/dev/discussion/data-flow"]
title = "Fullstack Data Flow (dev branch) | Remix"
full_description = "One of the primary features of Remix is the way it automatically keeps your UI in sync with persistent server state. It happens in three steps: Let's consider a user account edit route. The route module has three exports that we'll fill in and talk about: Route files can export a loader function that provides data to the route component. When the user navigates to a matching route, the data is first loaded and then the page is rendered. The default export of the route file is the component that renders. It reads the loader data with useLoaderData: Finally, the action on the route matching the form's action attribute is called when the form is submitted. In this example it's the same route. The values in the form fields will be available on the standard request.formData() API. Note the name attribute on the inputs is coupled to the formData.get(fieldName) getter. In this way, the UI is kept in sync with server state without writing any code for that synchronization. There are various ways to submit a form besides an HTML form element (like in response to drag and drop, or an onChange event). There is also a lot more to talk about around form validation, error handling, pending states, etc. We'll get to all of that later, but this is the gist of data flow in Remix. When you send HTML from the server, it's best to have it work even before JavaScript loads. Typical data flows in Remix do this automatically. The flow is the same, but the browser does some of the work."
year_published = 2025
