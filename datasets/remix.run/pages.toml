["https://remix.run/docs/styling/css"]
title = "Regular CSS | Remix"
full_description = '''Remix alleviates these issues with route-based stylesheets. Nested routes can each add their own stylesheets to the page and Remix will automatically prefetch, load, and unload them with the route. When the scope of concern is limited to just the active routes, the risks of these problems are reduced significantly. The only chances for conflicts are with the parent routes' styles (and even then, you will likely see the conflict since the parent route is also rendering). If you're using the Classic Remix Compiler rather than Remix Vite, you should remove ?url from the end of your CSS import paths. It's subtle, but this little feature removes a lot of the difficulty when styling your app with plain stylesheets. Websites large and small usually have a set of shared components used throughout the rest of the app: buttons, form elements, layouts, etc. When using plain style sheets in Remix there are two approaches we recommend. The first approach is very simple. Put them all in a shared.css file included in app/root.tsx. That makes it easy for the components themselves to share CSS code (and your editor to provide intellisense for things like custom properties), and each component already needs a unique module name in JavaScript anyway, so you can scope the styles to a unique class name or data attribute: While this file may become large, it'll be at a single URL that will be shared by all routes in the app. This also makes it easy for routes to adjust the styles of a component without needing to add an official new variant to the API of that component. You know it won't affect the component anywhere but the /accounts routes. A second approach is to write individual css files per component and then "surface" the styles up to the routes that use them. Perhaps you have a <Button> in app/components/button/index.tsx with styles at app/components/button/styles.css as well as a <PrimaryButton> that extends it. Note that these are not routes, but they export links functions as if they were. We'll use this to surface their styles to the routes that use them.'''
year_published = 2025
