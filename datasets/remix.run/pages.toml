["https://remix.run/resources/trance-stack"]
title = "TRANCE STACK | Remix Resources"
description = "A production-ready Remix stack built for AWS Lambda. Authentication. Security, Internationalization, Feature Flags, Analytics, Tests, Storybook, Ephemeral and Production CI/CD and more."
full_description = "meza/trance-stackA production-ready Remix stack built for AWS Lambda. Authentication. Security, Internationalization, Feature Flags, Analytics, Tests, Storybook, Ephemeral and Production CI/CD and more.Star 268Sponsornpx create-remix@latest template meza/trance-stack my-appCopy code to clipboardTRANCE STACK Warning This stack is typescript and NPM only for now. The NPM requirement comes from the GitHub actions scripts. I will make it possible to use both pnpm and yarn soon, but it requires a bit more time and I would love to get feedback on the stack until then. What's included This is a Remix stack that offers a way to ship production ready remix applications. It is constructed in an opinionated way and is meant to be used as a starting point for your own remix projects. You can modify it to your liking and use it as a base for your own remix projects. 📦 Click to see a list of included technologies Good security practices with CSP and sensible auth processes i18n with i18next and its remix integration remix-i18next Auth0 for authentication PostHog for feature flags Sentry for Client Side error tracking (server side soon) Custom-built cookie consent banner to maximise security read more Analytics Integrations PostHog Hotjar Google Analytics v4 Static Types with TypeScript Linting with ESLint Unit testing with Vitest and Testing Library End-to-End testing with Playwright Conventional Commits for commit messages to enable automated versioning semantic-release for automatic release management Storybook v7 for component development NPM for package management (for now. Will have support for yarn and pnpm soon) GitHub Actions for a full CI setup AWS deployment with CDK via GitHub Actions Using AWS Lambda + Api Gateway + Cloud Front for production builds Using AWS Lambda + Api Gateway for ephemeral builds (for feature branches, pull requests, etc) Automatic dependency updates with Renovate Using the stack Create your project with the stack npx create-remix@latest --template meza/trance-stack my-app The setup process will ask you for a GitHub repository name. If you don't have one, don't worry, you can create it after the setup process. Warning Read this documentation in your own project's directory from this point onwards. It will contain links relevant to you as the init script will replace the links in this README with the ones customized to your project. Now start the dev server npm run dev This has set you up with a default remix application. It won't function well until you complete the setup process. You can find the instructions for that here Quickstart Install the dependencies npm install Start the dev server npm run dev Go through the Getting Started section to set up the local and deployment environments Notable npm scripts npm run ci - run the same verification scripts that are run on CI npm run clean - removes all generated files npm run clean:all - removes all generated files and all the node_modules directories npm run dev - Starts the dev server npm run deploy:dev - Deploys the application to an ephemeral environment npm run deploy:prod - Deploys the application to production (you probably should never use this one locally) npm run int - Runs the Playwright integration tests npm run report - Runs all the things that generate reports for you (coverage, cpd, loc, etc) npm run storybook - Starts the storybook server npm run validate - Runs both the CI tests and the integration tests Table Of Contents What's included Using the stack Quickstart Notable npm scripts Table Of Contents Getting Started Environment GitHub Settings Workflow permissions Branch Protection Pages Environments Variables vs. Secrets GitHub Token - Do This First! Setup for continuous deployment Authentication with Auth0 Adding the Auth0 variables to GitHub Enabling the Auth0 integration for feature branch/PR deployments Removing the Auth0 integration from the application Google Analytics 4 integration Removing the Google Analytics 4 integration from the application Hotjar integration Removing the Hotjar integration from the application PostHog integration Removing the PostHog integration from the application Renovate bot setup Sentry integration How to find the DSN Removing the Sentry integration from the application Split integration Removing the Split integration from the application How to use ...? Authentication Automated Semantic Versioning Branching Strategy with Semantic Versioning Linting Which version am I running? Cookie Consent Using the consent provider Dependency Version Updates Runtime dependencies Development dependencies Deployment Ephemeral Environments Manual Ephemeral Deployment Pull Request Ephemeral Deployment Production-like Environments GitHub Actions CDK Environment Variables Local Environments The deployment directory The context variables Deploying from your local machine The githubActionSupport.ts file Testing the GitHub support locally Environment variables Adding a new environment variable checklist: Bundling environment variables Feature Flags Production The features.ts file Local development I18N - Internationalization Using translations Adding a new locale Removing i18n from your project Lefthook NPMIgnore - automated Playwright - End-to-end testing Installing Playwright dependencies Configuring Playwright Running the tests Playwright on GitHub Actions Playwright locally Storybook Running Storybook Publishing Storybook Accessing the published Storybook Styling / CSS Shared Component Styles Surfacing Styling PostCSS Typescript Paths Issues with Typescript Paths Vitest Storybook Unit Testing Globals: true Test reporters Setup files Threads Coverage Development of the stack itself Getting Started In order to get this project to work, you will need to have a few things set up first. The stack is designed in a way that makes it relatively simple to remove the parts you don't need. You will be able to find removal instructions at every step so don't worry if you're not a fan of a particular service. But... why? Note We've been using Architecture Decision Records throughout the development of the project so if you ever find yourself wondering why we've chosen a particular service or implementation, you can check the ADR page for more information. We highly encourage you to keep on adding your own decisions. It's a great way to document the historical context of your project, and it's a great way to share your knowledge with the rest of the team. We use adr-tools to manage our ADRs. It is installed as part of the dependencies, so you should be able to use it right away. Environment Check the project root directory for a .env file. If it's not there, copy the .env.example file to .env cp .env.example .env This file contains all the variables you will need to set for the project to function as is. The APP_DOMAIN should generally stay the same. It's the domain that your application will be served from. This variable will also be set by the deployment scripts, so you don't need to worry about it. During local development it will be set to http://localhost:3000. The NODE_ENV variable is used to determine which environment you're running the application in. It seems like ARC has a hard time figuring it out on its own, so we've set it up to be set manually. If all goes well, it won't be needed for long. The SESSION_SECRET variable is used to encrypt the session cookies. It should be a long, random string. GitHub Settings Note The project uses GitHub Actions. If you're not familiar with GitHub Actions, you can read more about it here. You need to do a few things to make sure GitHub Actions can work with your project. Workflow permissions First, head over to https://github.com/meza/trance-stack/settings/actions and under the Workflow permissions section, make sure it's on the Read and write permissions option. Without this, the deployment scripts won't be able to create the necessary GitHub releases. Branch Protection Next, head over to https://github.com/meza/trance-stack/settings/branches and add a few branch protection rules. main alpha beta These are the branches that will be used for the different stages of the application. You can set the settings of these branches however you like, but there's one setting that you need to make sure is unchecked: Allow deletions. We use this later in the Deployment section to prevent named environments from being deleted. Pages Next, head over to https://github.com/meza/trance-stack/settings/pages and make sure the Source is set to GitHub Actions. This will allow us to deploy the project's storybook to GitHub Pages. Environments Note We use GitHub environments to manage the different stages of our application. You can read more about them here. GitHub environments are great to control the environment variables that are used in your workflows. For now, go to https://github.com/meza/trance-stack/settings/environments and create the following environments: Production Staging Ephemeral These are referred to in the deployment workflow for example with the environment key. The Ephemeral environment is used for feature branches and pull requests and is referenced in the ephemeral workflow. Variables vs. Secrets Some configuration values are sensitive while others are not. For example, the COOKIEYES_TOKEN is not sensitive, but the AUTH0_CLIENT_SECRET is. This mainly comes from the fact that some of these values will be embedded into the html of your application and be visible to everyone. Warning Please double-check the documentation of the services to ensure you're setting them up correctly. The application won't work properly if you add a secret as a variable or a variable as a secret. GitHub Token - Do This First! For the releases to work properly, you will need to create a Personal Access Token. It needs the following settings: Expiration: never Scopes repo for private repositories public_repo for public repositories Once you've created the token, go to the secrets settings and add it as GH_TOKEN Setup for continuous deployment The deployment processes are described in the Deployment section but to get you started, please create the environment variables and secrets defined in the environment variables section. Authentication with Auth0 We use Auth0 for authentication. You will need to create an account with them and set up an application. When creating your new application, make sure to set the following settings: The application type should be Regular Web Applications Ignore the Quick Start section Go to Settings and copy the Domain and Client ID and Client Secret and paste them in the .env file Set the Token Endpoint Authentication Method to Post Go to the Allowed Callback URLs section and add http://localhost:3000/auth/callback Go to the Allowed Logout URLs section and add http://localhost:3000 Go to the Allowed Web Origins section and add http://localhost:3000 Go to the Allowed Origins (CORS) section and add http://localhost:3000 Go to the Refresh Token Rotation section and enable it and with that, you also have to enable the Absolute Expiration option. Adding the Auth0 variables to GitHub Now that you have your Auth0 variables, you will need to add them to the GitHub environments you created above. Go to the secrets settings and add the Auth0 secrets with the same name as the variables in the .env file. You can set custom values for every environment if you want to. For example, you can set the AUTH0_DOMAIN to dev-123456.eu.auth0.com for the Staging environment and prod-123456.eu.auth0.com for the Production environment. But for the sake of simplicity, you can just set the same values only once in the main Actions secrets page, and it will be used for all environments. Enabling the Auth0 integration for feature branch/PR deployments If you want to enable the Auth0 integration for feature branch/PR deployments, you will need to do a few extra steps. Since the feature branch/PR deployments are ephemeral, they will have a different domain name every time they are deployed. This means that you will need to add the domain name to the Allowed Callback URLs and Allowed Logout URLs To make this painless, we can use the * wildcard in the domain name. This will allow any domain name to be used. During the initial setup above, you have added http://localhost:3000 in a few places. You will need to add ,https://*.execute-api.us-east-1.amazonaws.com to the same places. (Note the comma at the beginning. Domains need to be separated by commas) Note You will need to replace the us-east-1 part with the region you're using. For example, the Allowed Callback URLs section should look like this: http://localhost:3000/auth/callback,https://*.execute-api.us-east-1.amazonaws.com/auth/callback Warning The * wildcard will allow you to use as wide of a domain name as you would like to. This however comes at the cost of security. We would highly recommend creating an alternative tenant on Auth0 for your feature branch/PR deployments. Removing the Auth0 integration from the application Delete the AUTH0_DOMAIN, AUTH0_CLIENT_ID and AUTH0_CLIENT_SECRET variables from the .env file and GitHub secrets. Delete the src/auth.server.ts and the src/auth.server.test.ts files. Delete the auth0-remix-server dependency from the package.json file. Follow the compilation and test errors to remove all the code that uses the auth0-remix-server dependency. Google Analytics 4 integration We use Google Analytics v4 for analytics. You will need to create an account with them and set up a property. When you are done setting up your property, you will need to copy the Measurement ID of your Data Stream and paste set the GOOGLE_ANALYTICS_ID variable in the .env file. You will also have to go to the variables settings and add the same variable name as the one in the .env file. Warning The GOOGLE_ANALYTICS_ID is set as a variable for the actions. Removing the Google Analytics 4 integration from the application Delete the GOOGLE_ANALYTICS_ID variable from the .env file and GitHub variables. Delete the src/components/GoogleAnalytics directory. Delete the relevant types off the appConfig type in the src/types/global.d.ts file. Delete the <GoogleAnalytics ... /> component and its import from the src/root.tsx file. Run vitest --run --update to update the snapshots. Hotjar integration We use Hotjar for heatmaps and user recordings. You will need to create an account with them and set up a new site. When you have your site set up, head to https://insights.hotjar.com/site/list and copy the ID of your site and paste set the HOTJAR_ID variable in the .env file. You will also have to go to the variables settings and add the same variable name as the one in the .env file. Warning The HOTJAR_ID is set as a variable for the actions. Removing the Hotjar integration from the application Delete the HOTJAR_ID variable from the .env file and GitHub variables. Delete the src/components/Hotjar directory. Delete the relevant types off the appConfig type in the"
