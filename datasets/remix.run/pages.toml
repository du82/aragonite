["https://remix.run/docs/en/1.19.3/file-conventions/remix-config"]
title = "remix.config.js (v1.19.3) | Remix"
full_description = '''This file has a few build and development configuration options, but does not actually run on your server. The path to the browser build, relative to remix.config.js. Defaults to "public/build". Should be deployed to static hosting. The path to a directory Remix can use for caching things in development, relative to remix.config.js. Defaults to ".cache". This option is deprecated and will likely be removed in a future stable release. Enable v2_dev to eliminate the race conditions that necessitated this option. The delay, in milliseconds, before the dev server broadcasts a reload event. There is no delay by default. This option is deprecated and will likely be removed in a future stable release. Enable v2_dev and use --port / v2_dev.port option instead. This is an array of globs (via minimatch) that Remix will match to files while reading your app/routes directory. If a file matches, it will be ignored rather than treated like a route module. This is useful for ignoring dotfiles (like .DS_Store files) or CSS/test files you wish to colocate. The URL prefix of the browser build with a trailing slash. Defaults to "/build/". This is the path the browser will use to find assets. A function for defining custom routes, in addition to those already defined using the filesystem convention in app/routes. Both sets of routes will be merged. A server entrypoint, relative to the root directory that becomes your server's main module. If specified, Remix will compile this file along with your application into a single file to be deployed to your server. This file can use either a .js or .ts file extension. This option is deprecated and will likely be removed in a future stable release. Use serverBuildPath instead. The path to the server build, relative to remix.config.js. Defaults to "build". This needs to be deployed to your server. The path to the server build file, relative to remix.config.js. This file should end in a .js extension and should be deployed to your server. Defaults to "build/index.js".'''
