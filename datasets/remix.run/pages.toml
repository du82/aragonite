["https://remix.run/pages/stacks"]
title = "Templates | Remix"
full_description = '''Just getting started with Remix? The latest version of Remix is now React Router v7. If you want to use the latest framework features, you should create your project using a React Router template. When using create-remix to generate a new project, you can choose a Template or a Stack to quickly get up and running. Templates are minimal starting points to get you up and running. "Stacks" are templates that are more-complete and closer to production ready architectures (potentially including aspects such as testing, database, CI, and deployment configurations). If you run create-remix without providing the --template option, you'll get a basic template using the Remix App Server. If you are not interested in using TypeScript, you can install the simpler Javascript template instead: This is a great place to start if you're just looking to try out Remix for the first time. You can always extend this starting point yourself or migrate to a more advanced template later. If you want more control over your server or wish to deploy to a non-node runtime—such as Arc, Cloudflare, or Deno—then you can try one of our official templates from the Remix repository: Some hosting providers maintain their own Remix templates. For more information, see their official integration guides listed below. We also provide a community-driven examples repository, with each example showcasing different Remix features, patterns, tools, hosting providers, etc. You can use these in a similar manner to install the working example: When a template is closer to being a production-ready application, to the point that it provides opinions about the CI/CD pipeline, database and hosting platform, the Remix community refers to these templates as "stacks". What you're left with is everything completely set up for you to just get to work building whatever amazing web experience you want to build with Remix. Here are the official stacks: Community stacks can be used by passing the GitHub username/repo combo to the --template option when running create-remix, for example:'''
