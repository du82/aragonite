["https://remix.run/resources/remix-utils"]
title = "Remix Utils | Remix Resources"
description = "A set of utility functions and types to use with Remix.run"
full_description = '''sergiodxa/remix-utilsA set of utility functions and types to use with Remix.runStar 2.2kSponsornpm install remix-utilsCopy code to clipboardRemix Utils This package contains simple utility functions to use with React Router. Installation npm install remix-utils Additional optional dependencies may be needed, all optional dependencies are: react-router @oslojs/crypto @oslojs/encoding is-ip intl-parse-accept-language react zod The utils that require an extra optional dependency mention it in their documentation. If you want to install them all run: npm add @oslojs/crypto @oslojs/encoding is-ip intl-parse-accept-language zod React and React Router packages should be already installed in your project. Upgrade from Remix Utils v6 Check the v6 to v7 upgrade guide. API Reference promiseHash The promiseHash function is not directly related to Remix but it's a useful function when working with loaders and actions. This function is an object version of Promise.all which lets you pass an object with promises and get an object with the same keys with the resolved values. import { promiseHash } from "remix-utils/promise"; export async function loader({ request }: LoaderFunctionArgs) { return json( await promiseHash({ user: getUser(request), posts: getPosts(request), }) ); } You can use nested promiseHash to get a nested object with resolved values. import { promiseHash } from "remix-utils/promise"; export async function loader({ request }: LoaderFunctionArgs) { return json( await promiseHash({ user: getUser(request), posts: promiseHash({ list: getPosts(request), comments: promiseHash({ list: getComments(request), likes: getLikes(request), }), }), }) ); } timeout The timeout function lets you attach a timeout to any promise, if the promise doesn't resolve or reject before the timeout, it will reject with a TimeoutError. import { timeout } from "remix-utils/promise"; try { let result = await timeout(fetch("https://example.com"), { ms: 100 }); } catch (error) { if (error instanceof TimeoutError) { // Handle timeout } } Here the fetch needs to happen in less than 100ms, otherwise it will throw a TimeoutError. If the promise is cancellable with an AbortSignal you can pass the AbortController to the timeout function. import { timeout } from "remix-utils/promise"; try { let controller = new AbortController(); let result = await timeout( fetch("https://example.com", { signal: controller.signal }), { ms: 100, controller } ); } catch (error) { if (error instanceof TimeoutError) { // Handle timeout } } Here after 100ms, timeout will call controller.abort() which will mark the controller.signal as aborted. cacheAssets Note This can only be run inside entry.client. This function lets you easily cache inside the browser's Cache Storage every JS file built by Remix. To use it, open your entry.client file and add this: import { cacheAssets } from "remix-utils/cache-assets"; cacheAssets().catch((error) => { // do something with the error, or not }); The function receives an optional options object with two options: cacheName is the name of the Cache object to use, the default value is assets. buildPath is the pathname prefix for all Remix built assets, the default value is /build/ which is the default build path of Remix itself. It's important that if you changed your build path in remix.config.js you pass the same value to cacheAssets or it will not find your JS files. The cacheName can be left as is unless you're adding a Service Worker to your app and want to share the cache. import { cacheAssets } from "remix-utils/cache-assets"; cacheAssests({ cacheName: "assets", buildPath: "/build/" }).catch((error) => { // do something with the error, or not }); ClientOnly Note This depends on react. The ClientOnly component lets you render the children element only on the client-side, avoiding rendering it the server-side. You can provide a fallback component to be used on SSR, and while optional, it's highly recommended to provide one to avoid content layout shift issues. import { ClientOnly } from "remix-utils/client-only"; export default function Component() { return ( <ClientOnly fallback={<SimplerStaticVersion />}> {() => <ComplexComponentNeedingBrowserEnvironment />} </ClientOnly> ); } This component is handy when you have some complex component that needs a browser environment to work, like a chart or a map. This way, you can avoid rendering it server-side and instead use a simpler static version like an SVG or even a loading UI. The rendering flow will be: SSR: Always render the fallback. CSR First Render: Always render the fallback. CSR Update: Update to render the actual component. CSR Future Renders: Always render the actual component, don't bother to render the fallback. This component uses the useHydrated hook internally. ServerOnly Note This depends on react. The ServerOnly component is the opposite of the ClientOnly component, it lets you render the children element only on the server-side, avoiding rendering it the client-side. You can provide a fallback component to be used on CSR, and while optional, it's highly recommended to provide one to avoid content layout shift issues, unless you only render visually hidden elements. import { ServerOnly } from "remix-utils/server-only"; export default function Component() { return ( <ServerOnly fallback={<ComplexComponentNeedingBrowserEnvironment />}> {() => <SimplerStaticVersion />} </ServerOnly> ); } This component is handy to render some content only on the server-side, like a hidden input you can later use to know if JS has loaded. Consider it like the <noscript> HTML tag but it can work even if JS failed to load but it's enabled on the browser. The rendering flow will be: SSR: Always render the children. CSR First Render: Always render the children. CSR Update: Update to render the fallback component (if defined). CSR Future Renders: Always render the fallback component, don't bother to render the children. This component uses the useHydrated hook internally. CORS The CORS function let you implement CORS headers on your loaders and actions so you can use them as an API for other client-side applications. There are two main ways to use the cors function. Use it on each loader/action where you want to enable it. Use it globally on entry.server handleRequest and handleDataRequest export. If you want to use it on every loader/action, you can do it like this: import { cors } from "remix-utils/cors"; export async function loader({ request }: LoaderFunctionArgs) { let data = await getData(request); let response = json<LoaderData>(data); return await cors(request, response); } You could also do the json and cors call in one line. import { cors } from "remix-utils/cors"; export async function loader({ request }: LoaderFunctionArgs) { let data = await getData(request); return await cors(request, json<LoaderData>(data)); } And because cors mutates the response, you can also call it and later return. import { cors } from "remix-utils/cors"; export async function loader({ request }: LoaderFunctionArgs) { let data = await getData(request); let response = json<LoaderData>(data); await cors(request, response); // this mutates the Response object return response; // so you can return it here } If you want to setup it globally once, you can do it like this in entry.server import { cors } from "remix-utils/cors"; const ABORT_DELAY = 5000; export default function handleRequest( request: Request, responseStatusCode: number, responseHeaders: Headers, remixContext: EntryContext ) { let callbackName = isbot(request.headers.get("user-agent")) ? "onAllReady" : "onShellReady"; return new Promise((resolve, reject) => { let didError = false; let { pipe, abort } = renderToPipeableStream( <RemixServer context={remixContext} url={request.url} />, { [callbackName]: () => { let body = new PassThrough(); responseHeaders.set("Content-Type", "text/html"); cors( request, new Response(body, { headers: responseHeaders, status: didError ? 500 : responseStatusCode, }) ).then((response) => { resolve(response); }); pipe(body); }, onShellError: (err: unknown) => { reject(err); }, onError: (error: unknown) => { didError = true; console.error(error); }, } ); setTimeout(abort, ABORT_DELAY); }); } export let handleDataRequest: HandleDataRequestFunction = async ( response, { request } ) => { return await cors(request, response); }; Options Additionally, the cors function accepts a options object as a third optional argument. These are the options. origin: Configures the Access-Control-Allow-Origin CORS header. Possible values are: true: Enable CORS for any origin (same as "*") false: Don't setup CORS string: Set to a specific origin, if set to "*" it will allow any origin RegExp: Set to a RegExp to match against the origin Array<string | RegExp>: Set to an array of origins to match against the string or RegExp Function: Set to a function that will be called with the request origin and should return a boolean indicating if the origin is allowed or not. The default value is true. methods: Configures the Access-Control-Allow-Methods CORS header. The default value is ["GET", "HEAD", "PUT", "PATCH", "POST", "DELETE"]. allowedHeaders: Configures the Access-Control-Allow-Headers CORS header. exposedHeaders: Configures the Access-Control-Expose-Headers CORS header. credentials: Configures the Access-Control-Allow-Credentials CORS header. maxAge: Configures the Access-Control-Max-Age CORS header. CSRF Note This depends on react, @oslojs/crypto, @oslojs/encoding, and React Router. The CSRF related functions let you implement CSRF protection on your application. This part of Remix Utils needs React and server-side code. First create a new CSRF instance. // app/utils/csrf.server.ts import { CSRF } from "remix-utils/csrf/server"; import { createCookie } from "react-router"; // or cloudflare/deno export const cookie = createCookie("csrf", { path: "/", httpOnly: true, secure: process.env.NODE_ENV === "production", sameSite: "lax", secrets: ["s3cr3t"], }); export const csrf = new CSRF({ cookie, // what key in FormData objects will be used for the token, defaults to `csrf` formDataKey: "csrf", // an optional secret used to sign the token, recommended for extra safety secret: "s3cr3t", }); Then you can use csrf to generate a new token. import { csrf } from "~/utils/csrf.server"; export async function loader({ request }: LoaderFunctionArgs) { let token = csrf.generate(); } You can customize the token size by passing the byte size, the default one is 32 bytes which will give you a string with a length of 43 after encoding. let token = csrf.generate(64); // customize token length You will need to save this token in a cookie and also return it from the loader. For convenience, you can use the CSRF#commitToken helper. import { csrf } from "~/utils/csrf.server"; export async function loader({ request }: LoaderFunctionArgs) { let [token, cookieHeader] = await csrf.commitToken(); return json({ token }, { headers: { "set-cookie": cookieHeader } }); } Note You could do this on any route, but I recommend you to do it on the root loader. Now that you returned the token and set it in a cookie, you can use the AuthenticityTokenProvider component to provide the token to your React components. import { AuthenticityTokenProvider } from "remix-utils/csrf/react"; let { csrf } = useLoaderData<LoaderData>(); return ( <AuthenticityTokenProvider token={csrf}> <Outlet /> </AuthenticityTokenProvider> ); Render it in your root component and wrap the Outlet with it. When you create a form in some route, you can use the AuthenticityTokenInput component to add the authenticity token to the form. import { Form } from "react-router"; import { AuthenticityTokenInput } from "remix-utils/csrf/react"; export default function Component() { return ( <Form method="post"> <AuthenticityTokenInput /> <input type="text" name="something" /> </Form> ); } Note that the authenticity token is only really needed for a form that mutates the data somehow. If you have a search form making a GET request, you don't need to add the authenticity token there. This AuthenticityTokenInput will get the authenticity token from the AuthenticityTokenProvider component and add it to the form as the value of a hidden input with the name csrf. You can customize the field name using the name prop. <AuthenticityTokenInput name="customName" /> You should only customize the name if you also changed it on createAuthenticityToken. If you need to use useFetcher (or useSubmit) instead of Form you can also get the authenticity token with the useAuthenticityToken hook. import { useFetcher } from "react-router"; import { useAuthenticityToken } from "remix-utils/csrf/react"; export function useMarkAsRead() { let fetcher = useFetcher(); let csrf = useAuthenticityToken(); return function submit(data) { fetcher.submit( { csrf, ...data }, { action: "/api/mark-as-read", method: "post" } ); }; } Finally, you need to validate the authenticity token in the action that received the request. import { CSRFError } from "remix-utils/csrf/server"; import { redirectBack } from "remix-utils/redirect-back"; import { csrf } from "~/utils/csrf.server"; export async function action({ request }: ActionFunctionArgs) { try { await csrf.validate(request); } catch (error) { if (error instanceof CSRFError) { // handle CSRF errors } // handle other possible errors } // here you know the request is valid return redirectBack(request, { fallback: "/fallback" }); } If you need to parse the body as FormData yourself (e.g. to support file uploads) you can also call CSRF#validate with the FormData and Headers objects. let formData = await parseMultiPartFormData(request); try { await csrf.validate(formData, request.headers); } catch (error) { // handle errors } Warning If you call CSRF#validate with the request instance, but you already read its body, it will throw an error. In case the CSRF validation fails, it will throw a CSRFError which can be used to correctly identify it against other possible errors that may get thrown. The list of possible error messages are: missing_token_in_cookie: The request is missing the CSRF token in the cookie. invalid_token_in_cookie: The CSRF token is not valid (is not a string). tampered_token_in_cookie: The CSRF token doesn't match the signature. missing_token_in_body: The request is missing the CSRF token in the body (FormData). mismatched_token: The CSRF token in the cookie and the body don't match. You can use error.code to check one of the error codes above, and error.message to get a human friendly description. Warning Don't send those error messages to the end-user, they are meant to be used for debugging purposes only. Existing Search Params import { ExistingSearchParams } from "remix-utils/existing-search-params"; Note This depends on react and react-router When you submit a GET form, the browser will replace all of the search params in the URL with your form data. This component copies existing search params into hid'''
