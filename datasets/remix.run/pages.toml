["https://remix.run/blog/remix-heart-vite"]
title = "Remix ❤️ Vite | Remix"
description = "Today we’re announcing that unstable support for Vite is available in Remix v2.2.0!"
full_description = "Today we’re excited to announce that unstable support for Vite is available in Remix v2.2.0! Now you get all the benefits of Vite’s lightning fast DX ⚡️ out-of-the-box when using Remix. So how fast is lightning fast ⚡️? Well, we did some quick testing on the Indie Stack with a M1 Max MacBook Pro and here’s what we found: But we didn’t switch to Vite just for the speed. Unlike traditional build tools, Vite is specifically designed for building frameworks. With this you’ll also get access to the entire ecosystem of Vite plugins. This lets us focus on making the core of Remix the best that it can be while letting Vite plugins handle the rest. Want to import SVGs as React components? There’s a Vite plugin for that. Using tsconfig path aliases? Vite plugin. Prefer to use Vanilla Extract? Vite plugin. Want to use MDX? Vite-compatible Rollup plugin. Need something custom? Write your own plugin! Let’s start at the beginning. Why didn’t Remix start off using Vite? The short answer is that a stable release of Vite didn’t exist yet! Remix development began in July 2020, but Vite’s first stable release wasn’t until February 2021. Even then, there were three blockers for adopting Vite: In July 2022, Vite stabilized SSR support and just a few months later in September 2022 Deno became Vite-compatible. Making progress, but Vite was still missing Cloudflare support and server-aware HMR. Meanwhile at the end of 2022, we were focused on helping users migrate from Create React App and Webpack to Remix. Then in March 2023, React stopped recommending CRA and officially recommended fullstack frameworks, including Remix. We began 2023, ready to tackle server-aware HMR and in May 2023 we finally cracked it with Hot Data Revalidation. At this point, half of the Remix team was heads down working on compiler improvements for polyfills and optimizing rebuilds. For many users, the main bottleneck was reprocessing large component libraries like Material UI and AntD, so we started looking into pre-bundling dependencies. When prototyping a solution, we realized we would need to reimplement module caching, dependency tracking, and transformation pipelining from scratch on top of esbuild’s low-level plugin system. In short, we’d effectively be building a worse version of Vite. So in June 2023, we started prototyping a Vite plugin for Remix."
year_published = 2025
clearnet = "https://remix.run/blog/remix-heart-vite"
tags = ["automatic", "better", "browser", "building", "compatibility", "dependencies.", "designed", "during", "feedback", "files."]
