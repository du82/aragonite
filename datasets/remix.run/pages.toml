["https://remix.run/blog/shop-case-study"]
title = "Case Study: Building Shop with Remix | Remix"
description = "A case study on how Shopify rapidly built a web version of their popular iOS/Android app Shop with Remix"
full_description = "Building good software is largely about understanding your constraints and then picking the right tools. When Shopify decided to build a web version of Shop, it was important to: We on the Remix team sat down with our colleagues Sebastian Ekström and Dominic Lind from the Shop team to discuss why they chose Remix for this project and how it went. This is the story about how Shop.app was built with Remix. Shop is an application that allows buyers to discover merchants and products, make purchases, and track orders. Shop automatically aggregates shipping information across various delivery services. Whether its through UPS, FedEx, or any other delivery method or company, Shop will automatically track all of your deliveries in one spot. Shop's native app has millions of downloads from the Google Play and Apple App store. While Shop has served the needs of many customers for years, the website has only been used as marketing pages to redirect users to the native app. For a long time Shop.app consisted of a few simple landing pages encouraging users to download the iOS or Android app. There was no functionality — no way to browse categories or products, no way to add items to your cart, and certainly no way to purchase anything. The initial goal was to achieve feature parity with the native apps. However, it became clear that merely recreating the Shop experience on web for existing users was not thinking big enough. The web has unique advantages that would complement the native apps. Even with limited functionality, the Shop marketing pages drew substantial traffic. While some of these visitors would proceed to download the app, many would not. With Shop.app users would have the option to sign up on the web, widening the net for acquiring new users. New versions of the website can be shipped multiple times a day, whereas the native applications have a much longer waiting period due to the nature of mobile development. Adding Shop.app would open up new possibilities. It would enable Shopify to run short-term ad campaigns and conduct daily experiments. The valuable user feedback gathered from these activities could then be utilized to enhance future versions of Shop's native and web clients."
