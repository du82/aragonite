title = "root (v1.19.3) | Remix"
full_description = "These components are to be used once inside your root route (root.tsx). They include everything Remix figured out or built in order for your page to render properly. You can pass extra props to <Scripts /> like <Scripts crossOrigin /> for hosting your static assets on a different server than your app. The example above renders several <script /> tags into the resulting HTML. While this usually just works, you might have configured a content security policy for scripts that prevents these <script /> tags from being executed. In particular, to support content security policies with nonce-sources for scripts, the <Scripts />, <LiveReload /> and <ScrollRestoration /> components support a nonce property, e.g.<Script nonce={nonce}/>. The provided nonce is subsequently passed to the <script /> tag rendered into the HTML by these components, allowing the scripts to be executed in accordance with your CSP policy."
