title = "Presets | Remix"
full_description = "The Remix Vite plugin supports a presets option to ease integration with other tools and hosting providers. The config returned by each preset is merged in the order they were defined. Any config directly passed to the Remix Vite plugin will be merged last. This means that user config will always take precedence over any presets. It's important to remember that other presets and user config can still override the values returned from your preset. In our example preset, the serverBundles function could be overridden with a different, conflicting implementation. If we want to validate that the final resolved config contains the serverBundles function from our preset, we can do this with the remixConfigResolved hook: The remixConfigResolved hook should only be used in cases where it would be an error to merge or override your preset's config."
