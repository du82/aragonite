["https://remix.run/docs/future/server-bundles"]
title = "Server Bundles | Remix"
full_description = "This is an advanced feature designed for hosting provider integrations. When compiling your app into multiple server bundles, there will need to be a custom routing layer in front of your app directing requests to the correct bundle. Remix typically builds your server code into a bundle that exposes a single request handler function. However, there are some scenarios where you might want to split your route tree into multiple server bundles that expose a request handler function for a subset of routes. To provide this level of flexibility, the Remix Vite plugin supports an serverBundles option which is a function for assigning routes to different server bundles. The provided serverBundles function is called for each route in the tree (except for routes that aren't addressable, e.g. pathless layout routes) and returns a server bundle ID that you'd like to assign it to. These bundle IDs will be used as directory names in your server build directory. For each route, this function is passed an array of routes leading to and including that route, referred to as the route branch. This allows you to create server bundles for different portions of the route tree. For example, you could use this to create a separate server bundle containing all routes within a particular layout route: When the build is complete, Remix will call the Vite plugin's buildEnd hook passing a buildManifest object. This is useful if you need to inspect the build manifest to determine how to route requests to the correct server bundle. Alternatively, you can enable the manifest option on the Vite plugin to write this build manifest object to disk as .remix/manifest.json in your build directory."
