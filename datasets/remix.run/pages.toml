["https://remix.run/blog/react-router-v6.4"]
title = "React Router 6.4 Release | Remix"
description = "React Router 6.4 was released today, adding all of data loading, data mutation, pending navigation, and error handling APIs from Remix to every React Router app."
full_description = "The web is a wonderful place where highly dynamic shopping experiences, creative productivity software, and super basic but excellent classified ads are all possible on the same platform. While these websites are all wildly different, they all have one thing in common: data coupled to URLs. It's not just about data loading either. They all have data mutations, too! React Router 6.4 embraces this reality with new conventions, APIs, and automatic behaviors for: Most people realize that <Link> renders <a href> underneath, preventing the default browser behavior (sending a document request to the server) and instead changes the URL with JavaScript. It's kinda like this: Just like <a href>, <form action> also creates a request and sends it to the server when the user submits it. The only difference is a form can send along some data and usually means you want to update your database. It's hard to explain just how much simpler and more capable your code becomes when your router understands the full data lifecycle with data loading (<a href>) and mutations (<form action>). You kind of have to experience it yourself, so take it for a spin today:"
