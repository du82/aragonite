["https://remix.run/tutorials/blog"]
title = "Blog Tutorial (short) | Remix"
full_description = '''We're going to be short on words and quick on code in this quickstart. If you're looking to see what Remix is all about in 15 minutes, this is it. This tutorial uses TypeScript. Remix can definitely be used without TypeScript. We feel most productive when writing TypeScript, but if you'd prefer to skip the TypeScript syntax, feel free to write your code in JavaScript. 💿 Hey I'm Derrick the Remix Compact Disc 👋 Whenever you're supposed to do something you'll see me Click this button to create a Gitpod workspace with the project set up and ready to run in VS Code or JetBrains either directly in the browser or on the desktop. If you want to follow this tutorial locally on your own computer, it is important for you to have these things installed: 💿 Initialize a new Remix project. We'll call ours "blog-tutorial" but you can call it something else if you'd like. We're using the Indie stack, which is a full application ready to deploy to fly.io. This includes development tools as well as production-ready authentication and persistence. Don't worry if you're unfamiliar with the tools used, we'll walk you through things as we go. Note, you can definitely start with "Just the basics" instead by running npx create-remix@latest without the --template flag. The generated project is much more minimal that way. However, some bits of the tutorial will be different for you and you'll have to configure things for deployment manually. 💿 Now, open the project that was generated in your preferred editor and check the instructions in the README.md file. Feel free to read over this. We'll get to the deployment bit later in the tutorial. If you want, take a minute and poke around the UI a bit. Feel free to create an account and create/delete some notes to get an idea of what's available in the UI out of the box. You can put it anywhere you like. I stuck it right above the icons of all the technologies used in the stack: The Remix Indie stack has Tailwind CSS support pre-configured. If you'd prefer to not use Tailwind CSS, you're welcome to remove it and use something else. Learn more about your styling options with Remix in the styling guide.'''
