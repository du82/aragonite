["https://remix.run/docs/en/1.19.3/guides/mdx"]
title = "MDX (v1.19.3) | Remix"
full_description = '''While we believe that a strong separation of data and display is important, we understand that formats that mix the two such as MDX (Markdown with embedded JSX components) have become a popular and powerful authoring format for developers. Rather than compiling your content at build-time like this document demonstrates, it's typically better UX and DX if you do this at runtime via something like mdx-bundler. It's also much more customizable and powerful. However, if you prefer to do this compilation at build-time, continue reading. The simplest way to get started with MDX in Remix is to create a route module. Just like .js and .ts files in your app/routes directory, .mdx (and .md) files will participate in automatic file system based routing. The lines in the document above between the --- are called "frontmatter". You can think of them like metadata for your document, formatted as YAML. You can even export all the other things in this module that you can in regular route modules in your mdx files like loader, action, and handle: Besides just route level MDX, you can also import these files anywhere yourself as if it were a regular JavaScript module. The following example demonstrates how you might build a simple blog with MDX, including individual pages for the posts themselves and an index page that shows all posts. Clearly this is not a scalable solution for a blog with thousands of posts. Realistically speaking, writing is hard, so if your blog starts to suffer from too much content, that's an awesome problem to have. If you get to 100 posts (congratulations!), we suggest you rethink your strategy and turn your posts into data stored in a database so that you don't have to rebuild and redeploy your blog every time you fix a typo. You can even keep using MDX with MDX Bundler. If you wish to configure your own remark plugins you can do so through the remix.config.js's mdx export:'''
