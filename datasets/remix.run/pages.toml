["https://remix.run/blog/oss-remix-dot-run"]
title = "Open Sourcing the Remix Website | Remix"
description = "The Remix website is now open source, let the Pull Requests flow."
full_description = "Today, we're thrilled to announce that this very website is now open source! We invite you to explore and learn from the source code and maybe even consider contributing. Over 2 years ago Remix the framework went open source. For 10 years now Ryan and Michael have been working on open source software. Even reactrouter.com is a public repo. Needless to say, we're big believers in open source. We believe the pros outweigh the cons. Open sourcing our website allows us to provide a real-world Remix site to learn from. It also gives us an opportunity to more easily get feedback and contributions from kind-hearted devs in the community (thanks Ryan Leichty for polishing our docs). Plus, while our website is mostly pretty straightforward, there are some pretty cool things we're doing. Ryan Florence wrote it and now you can read the 1500 line ScrollExperience component source code. Or you can just scroll through it multiple times to see all the cool animations like I do. One of the unique features of our website is that we Server-Side Render our docs at request time, instead of using the more common strategy of Static Site Generation (prerendering the HTML during build). The main reason we do this is so we don't have to rebuild our entire site every time we fix a typo. In fact, the Remix docs don't exist in this repo at all. You can find them in the Remix codebase right next to the Remix source code. We keep the docs here: This last point is the other main reason we SSR our docs instead of SSG-ing them. We are able to keep the docs for each version of Remix forever. We can even render the most up-to-date version of the dev docs without redeploying. Imagine rebuilding every single doc for every single Remix version every time someone commits a change. That would be a lot. We're able to accomplish this by fetching the markdown from GitHub in the loader and server rendering the requested doc page in the route. Since this content doesn't change frequently, we leverage a LRU cache to cache the results on the server for 5 minutes. We also send a Cache-Control header with the stale-while-revalidate directive along with the response, that way when there is a fresh doc, the old one will be served while the new one renders and populates in the CDN for the next request."
year_published = 2025
clearnet = "https://remix.run/blog/oss-remix-dot-run"
