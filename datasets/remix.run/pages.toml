["https://remix.run/blog/fog-of-war"]
title = "Fog of War | Remix"
description = "Introducing Fog of War: infinitely scalable Remix and React Router applications"
full_description = '''Remix is designed to make your application performant by default. Our latest feature, Fog of War1 (a.k.a. "Lazy Route Discovery")2, helps your application stay performant no matter how large it grows. Remix has primarily been a compiler and server-runtime on top of React Router aimed at giving you the idiomatic and performant way we would have written a React Router SSR app. Could you build your own React Router SSR application without using Remix? Absolutely! However, to get the same kind of performance optimizations, you'd very likely end up writing your own compiler and server-runtime, mimicking a lot of the optimizations Remix has built-in. In order to avoid "render then fetch" waterfalls, Remix decouples rendering from fetching (see also: Remixing React Router). In order to do this, Remix needs to know your route tree up front so it can kick off the data fetches and download the route modules in parallel whenever a link is clicked. This results in the inverted and more performant approach of "fetch then render" (or "fetch while render" if you're streaming data). In a "render then fetch" world, your application downloads the route implementation, then kicks off the data fetches while rendering the component—causing a waterfall: You can take this one step further in Remix via <Link prefetch>, which allows you to prefetch the route data and components before a user even clicks a link. That way, when the link is clicked the navigation can be instantaneous: In order to implement optimizations mentioned in the previous section, Remix needs to know all of your route definitions in the client so that it can match routes based on nothing more than a <Link to>. Once a link is clicked and routes are matched, Remix can fetch data and download the route implementations in parallel. To do this, Remix ships a Route Manifest to the client that contains all of your route definitions plus a small amount of metadata. This manifest allows Remix to build a client-side route tree without including the underlying route implementations. Those implementations are loaded via route.lazy when a route is navigated to.'''
year_published = 2025
clearnet = "https://remix.run/blog/fog-of-war"
tags = ["1.9kb", "10mb", "definition", "discovery", "eager", "explanation", "footnotes", "happen", "implementation", "latest"]
