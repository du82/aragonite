["https://remix.run/docs/en/main"]
title = "Remix Docs Home | Remix"
full_description = '''Just getting started with Remix? The latest version of Remix is now React Router v7. If you want to use the latest framework features, you should use the React Router docs to get started. Start with the Technical Explanation. Remix is a new kind of web framework that we like to call "centerstack". It blends old and new web development models in a unique way that deserves some explanation! Spend your first few minutes with Remix in the Tutorial. It introduces the core features as quickly as possible building a little contact management app. You'll see data loading, actions, form validation, search, redirects, and more. The Discussions will help you get a deep understanding of Remix. Get yourself a drink and some snacks then dive deep into building better web apps with Remix. Need help? Want to contribute? Remix is developed in the open with a helpful community. Come and see where to find us on the Community page, follow along with Remix development, get help, and contribute back!'''
