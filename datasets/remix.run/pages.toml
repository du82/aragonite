["https://remix.run/docs/en/1.19.3/guides/not-found"]
title = "Not Found Handling (v1.19.3) | Remix"
full_description = '''When a document isn't found on a web server, it should send a 404 status code. This indicates to machines that the document is not there: search engines won't index it, CDNs won't cache it, etc. Most SPAs today just serve everything as 200 whether the page exists or not, but for you that stops today! The first case is already handled by Remix, you don't have to throw a response yourself. It knows your routes so it knows if nothing matched (consider using a Splat Route to handle this case). The second case is up to you, but it's really easy. Remix will catch the response and send your app down the Catch Boundary path. It's actually exactly like Remix's automatic error handling, but instead of exporting an ErrorBoundary, you export a CatchBoundary. What's nice about throwing a response is that code in your loader stops executing. The rest of your code doesn't have to deal with the chance that the page is defined or not (this is especially handy for TypeScript). Throwing also ensures that your route component doesn't render if the loader wasn't successful. Your route components only have to consider the "happy path". They don't need pending states, error states, or in our case here, not-found states. You probably already have one at the root of your app. This will handle all thrown responses that weren't handled in a nested route (more on that in a sec). Here's a sample: Just like errors, nested routes can export their own catch boundary to handle the 404 UI without taking down all of the parent layouts around it, and add some nice UX touches right in context. Bots are happy, SEO is happy, CDNs are happy, users are happy, and your code stays in context, so it seems like everybody involved is happy with this. As you can probably tell, this mechanism isn't just limited to 404s. You can throw any response from a loader or action to send your app down the catch boundary path. For more information, check out the Catch Boundary docs.'''
year_published = 2025
clearnet = "https://remix.run/docs/en/1.19.3/guides/not-found"
