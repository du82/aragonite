["https://remix.run/docs/en/2.16.0/discussion/server-vs-client"]
title = "Server vs. Client Code Execution | Remix"
full_description = "Remix runs your app on the server as well as in the browser. However, it doesn't run all of your code in both places. During the build step, the compiler creates both a server build and a client build. The server build bundles up everything into a single module (or multiple modules when using server bundles), but the client build splits your app up into multiple bundles to optimize loading in the browser. It also removes server code from the bundles. The server build will contain the entire module in the final bundle. However, the client build will remove the action, headers and loader, along with the dependencies, resulting in this: Out of the box, Vite doesn't support mixing server-only code with client-safe code in the same module. Remix is able to make an exception for routes because we know which exports are server-only and can remove them from the client. There are a few ways to isolate server-only code in Remix. The simplest approach is to use .server and .client modules. While not strictly necessary, .server modules are a good way to explicitly mark entire modules as server-only. The build will fail if any code in a .server file or .server directory accidentally ends up in the client module graph. .server directories are only supported when using Remix Vite. The Classic Remix Compiler only supports .server files. You may depend on client libraries that are unsafe to even bundle on the server — maybe it tries to access window by simply being imported. You can remove the contents of these modules from the server build by appending *.client.ts to the file name or nesting them within a .client directory. .client directories are only supported when using Remix Vite. The Classic Remix Compiler only supports .client files. If you want to mix server-only code and client-safe code in the same module, you can use vite-env-only. This Vite plugin allows you to explicitly mark any expression as server-only so that it gets replaced with undefined in the client. For example, once you've added the plugin to your Vite config, you can wrap any server-only exports with serverOnly$:"
year_published = 2025
clearnet = "https://remix.run/docs/en/2.16.0/discussion/server-vs-client"
