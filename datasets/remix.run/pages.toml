["https://remix.run/docs/en/1.19.3/guides/routing"]
title = "Routing (v1.19.3) | Remix"
full_description = '''Routing is possibly the most important concept to understand in Remix. Everything starts with your routes: the compiler, the initial request, and almost every user interaction afterward. Here's some vocabulary this document will be using regularly. They may not all make sense to you at first, but as you read the document they are here for your reference. Nested Routes - The general idea of routes mapping to segments of the URL allowing the full URL to map to a hierarchy of route components and data dependencies that can be known before rendering. URL - The full path in the address bar of the user's web browser. A single URL can match multiple routes. It's common in other frameworks to use the words "route" and "url" interchangeably, but they are different things in Remix. Route or Route Module - A JavaScript module with conventional exports (loader, action, default component, etc.) that is coupled to one or many URL segments. Because a Route module maps to only a segment of the URL, multiple routes can be rendered at a single URL. The component hierarchy will map to the URL segment hierarchy. Path or Route Path - The segment of the URL an individual route maps to, defined by the conventional file name in the app/routes directory. Parent Layout Route or Parent Route - A route that renders its component as the layout above a set of child routes through <Outlet>. Pathless Layout Route or Pathless Route - A route that does not add segments to the URL but does add component layout hierarchy when its child routes match. Index Route - A route that shares the same URL as the parent route but renders as the default child route inside of <Outlet>. Dynamic Segment - A segment of the route path that is parsed from the URL and its value provided to the app, like the ID of a record or slug for a post. Splat - A trailing wildcard on a route path that will match anything (including subsequent /) and provided to the app. Outlet - A component rendered inside a parent route that shows where to render the matching child route'''
year_published = 2025
