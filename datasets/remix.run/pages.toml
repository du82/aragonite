["https://remix.run/blog/not-another-framework"]
title = "Not Another Framework! | Remix"
description = "The web ecosystem can feel like it moves too fast sometimes. We're sensitive to that at Remix so we've designed it with your future in mind. Get good at Remix, get better at the web."
full_description = '''I'm certain there are a lot of you out there who are seeing the excitement around Remix and thinking: I get it! Learning how to solve the same problems but with a different API is exhausting. The worst part is feeling like all the deep knowledge I have with my current tools is now obsolete, and I'm a beginner all over again. That is exhausting. I hope not! When you work in Remix, you're mostly working with standard web APIs. You're either already familiar with them, or you'll learn them for the first time. This knowledge will not just help you build great user experiences in Remix, but it will help you outside of Remix today and in the future. That's why I think Remix is worth your time in this wild, ever changing web development world. I used to lead the Frontend Infrastructure team at a previous job. While talking to a co-worker who was leaving for a new job, they said something to me that has kind of haunted my thoughts ever since: They don't use [the framework we're using], so everything I learned the last two years here doesn't even matter! That hit me hard. I hated it. Even though it was a JavaScript framework, the one we used had its own way of doing almost everything, even adding items to arrays was different. My co-worker felt like the time with us was mostly wasted! Of course, all programming experience is still experience. But when it comes to frameworks, there is often a lot of knowledge that doesn't transfer to the next thing. Throughout my career, I've worked with a few that had huge amounts of API I had to memorize, many of which the web platform already had a solution for. That knowledge is mostly useless now. When we design Remix APIs, this is something we think about. We want your experience with Remix to transfer to web development generally. While I started web development before JavaScript was even created, I didn't really get into JavaScript until the great framework wars between Prototype.js, MooTools, and jQuery. One day I added a jQuery plugin to my page and everything blew up on me. I already had a MooTools plugin and the two were incompatible! After some googling, I learned what a "JavaScript Framework" was, that there was a war being waged, and that I had to pick a side 😲.'''
year_published = 2025
clearnet = "https://remix.run/blog/not-another-framework"
tags = ["accidentally", "another", "framework!", "javascript", "knowledge", "latest", "learn", "learned", "mootools,", "news"]
