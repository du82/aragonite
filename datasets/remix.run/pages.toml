["https://remix.run/docs/en/1.19.3/file-conventions/route-files-v2"]
title = "Route File Naming (v2) (v1.19.3) | Remix"
full_description = '''While you can configure routes in remix.config.js, most routes are created with this file system convention. Add a file, get a route. Please note that you can use either .js, .jsx, .ts or .tsx file extensions. We'll stick with .tsx in the examples to avoid duplication. The file in app/root.tsx is your root layout, or "root route" (very sorry for those of you who pronounce those words the same way!). It works just like all other routes, so you can export a loader, action, etc. The root route typically looks something like this. It serves as the root layout of the entire app, all other routes will render inside the <Outlet />. Any JavaScript or TypeScript files in the app/routes/ directory will become routes in your application. The filename maps to the route's URL pathname, except for _index.tsx which is the index route for the root route. Usually your URLs aren't static but data-driven. Dynamic segments allow you to match segments of the URL and use that value in your code. You create them with the $ prefix. Remix will parse the value from the URL and pass it to various APIs. We call these values "URL Parameters". The most useful places to access the URL params are in loaders and actions. You'll note the property name on the params object maps directly to the name of your file: $city.tsx becomes params.city. Routes can have multiple dynamic segments, like concerts.$city.$date, both are accessed on the params object by name: Nested Routing is the general idea of coupling segments of the URL to component hierarchy and data. You can read more about it in the Routing Guide. You create nested routes with dot delimiters. If the filename before the . matches another route filename, it automatically becomes a child route to the matching parent. Consider these routes: All the routes that start with concerts. will be child routes of concerts.tsx and render inside the parent route's outlet. Note you typically want to add an index route when you add nested routes so that something renders inside the parent's outlet when users visit the parent URL directly.'''
year_published = 2025
