title = "Link (dev branch) | Remix"
full_description = "Please see the Splat Paths section on the useResolvedPath docs for a note on the behavior of the future.v3_relativeSplatPath future flag for relative <Link to> behavior within splat routes Because of this, if you are using nav :last-child you will need to use nav :last-of-type so the styles don't conditionally fall off your last link (and any other similar selectors). If you are using <ScrollRestoration>, this lets you prevent the scroll position from being reset to the top of the window when the link is clicked. This does not prevent the scroll position from being restored when the user comes back to the location with the back/forward buttons, it just prevents the reset when the user clicks the link. An example when you might want this behavior is a list of tabs that manipulate the url search params that aren't at the top of the page. You wouldn't want the scroll position to jump up to the top because it might scroll the toggled content out of the viewport! Will use document navigation instead of client side routing when the link is clicked, the browser will handle the transition normally (as if it were an <a href>). The replace prop will replace the current entry in the history stack instead of pushing a new one onto it. The viewTransition prop enables a View Transition for this navigation by wrapping the final state update in document.startViewTransition(): If you need to apply specific styles for this view transition, you will also need to leverage the useViewTransitionState():"
