["https://remix.run/docs/en/main/file-conventions/remix-config"]
title = "remix.config.js | Remix"
full_description = '''remix.config.js is only relevant when using the Classic Remix Compiler. When using Remix Vite, this file should not be present in your project. Instead, Remix configuration should be provided to the Remix plugin in your Vite config. This file has a few build and development configuration options, but does not actually run on your server. The path to the browser build, relative to remix.config.js. Defaults to "public/build". Should be deployed to static hosting. The Node.js polyfills to include in the browser build. Polyfills are provided by JSPM and configured via esbuild-plugins-node-modules-polyfill. When using this option and targeting non-Node.js server platforms, you may also want to configure Node.js polyfills for the server via serverNodeBuiltinsPolyfill. The path to a directory Remix can use for caching things in development, relative to remix.config.js. Defaults to ".cache". The future config lets you opt-into future breaking changes via Future Flags. Please see the Current Future Flags section for a list of all available Future Flags. This is an array of globs (via minimatch) that Remix will match to files while reading your app/routes directory. If a file matches, it will be ignored rather than treated like a route module. This is useful for ignoring CSS/test files you wish to colocate. The URL prefix of the browser build with a trailing slash. Defaults to "/build/". This is the path the browser will use to find assets. A function for defining custom routes, in addition to those already defined using the filesystem convention in app/routes. Both sets of routes will be merged. A server entrypoint, relative to the root directory that becomes your server's main module. If specified, Remix will compile this file along with your application into a single file to be deployed to your server. This file can use either a .js or .ts file extension. The path to the server build file, relative to remix.config.js. This file should end in a .js extension and should be deployed to your server. Defaults to "build/index.js".'''
