["https://remix.run/docs/en/1.19.3/file-conventions/routes-files"]
title = "Route File Naming (v1.19.3) | Remix"
full_description = '''The route file convention is changing in v2. You can prepare for this change at your convenience with the v2_routeConvention future flag. For instructions on making this change see the v2 guide. Setting up routes in Remix is as simple as creating files in your app directory. These are the conventions you should know to understand how routing in Remix works. Please note that you can use either .js, .jsx, .ts or .tsx file extensions. We'll stick with .tsx in the examples to avoid duplication. The file in app/root.tsx is your root layout, or "root route" (very sorry for those of you who pronounce those words the same way!). It works just like all other routes: Any JavaScript or TypeScript files in the app/routes/ directory will become routes in your application. The filename maps to the route's URL pathname, except for index.tsx which maps to the root pathname. The default export in this file is the component that is rendered at that route and will render within the <Outlet /> rendered by the root route. Routes that begin with a $ character indicate the name of a dynamic segment of the URL. It will be parsed and passed to your loader and action data as a value on the param object. On each of these pages, the dynamic segment of the URL path is the value of the parameter. There can be multiple parameters active at any time (as in /dashboard/:client/invoices/:invoiceId view example app) and all parameters can be accessed within components via useParams and within loaders/actions via the argument's params property: Nested routes can also contain dynamic segments by using the $ character in the parent's directory name. For example, app/routes/blog/$postId/edit.tsx might represent the editor page for blog entries. In the example above, the blog.tsx is a "layout route" for everything within the blog directory (blog/index.tsx and blog/categories.tsx). When a route has the same name as its directory (routes/blog.tsx and routes/blog/), it becomes a layout route for all the routes inside that directory ("child routes"). Similar to your root route, the parent route should render an <Outlet /> where the child routes should appear. This is how you can create multiple levels of persistent layout nesting associated with URLs.'''
