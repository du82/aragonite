["https://remix.run/docs/en/dev/guides/css-files"]
title = "CSS Files (dev branch) | Remix"
full_description = "This guide covers the pros and cons of each approach, and provides some recommendations based on your project's specific needs. CSS bundling is the most common approach for managing CSS files in the React community. In this model, styles are treated as module side effects and are bundled into one or more CSS files at the discretion of the bundler. It's simpler to use, requires less boilerplate, and gives the bundler more power to optimize the output. When consuming this component, you don't have to worry about managing individual CSS files. CSS is treated as private implementation detail of the component. This is a common pattern in many component libraries and design systems and scales quite nicely. For example, CSS Modules is built on the assumption that CSS is bundled. Even though you're explicitly importing the CSS file's class names as a JavaScript object, the styles themselves are still treated as a side effect and automatically bundled into the output. You have no access to the underlying URL of the CSS file. Another common use case where CSS bundling is required is when you're using a third-party component library that imports CSS files as side effects and relies on your bundler to handle them for you, such as React Spectrum. CSS bundling comes with a notable trade-off when combined with Vite's approach to on-demand compilation. Using the Button.css example presented earlier, this CSS file will be transformed into the following JavaScript code during development: It's worth stressing that this transformation only happens in development. Production builds won't look like this since static CSS files are generated. Vite does this so that CSS can be compiled lazily when imported and then hot reloaded during development. As soon as this file is imported, the CSS file's contents are injected into the page as a side effect. The downside of this approach is that these styles are not tied to the route lifecycle. This means that styles won't be unmounted when navigating away from the route, leading to a build-up of old styles in the document while navigating around the app. This can result in CSS rule order differing between development and production."
year_published = 2025
