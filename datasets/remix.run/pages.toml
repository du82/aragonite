["https://remix.run/docs/en/2.16.0/guides/constraints"]
title = "Module Constraints | Remix"
full_description = '''In order for Remix to run your app in both the server and browser environments, your application modules and third-party dependencies need to be careful about module side effects. The Remix compiler will automatically remove server code from the browser bundles. Our strategy is actually pretty straightforward, but requires you to follow some rules. The server needs everything in this file but the browser only needs the component and meta. In fact, it'll be completely broken if it includes the prisma module in the browser bundle. That thing is full of node-only APIs! To remove the server code from the browser bundles, the Remix compiler creates a proxy module in front of your route and bundles that instead. The proxy for this route would look like: The compiler will now analyze the code in app/routes/posts.tsx and only keep code that's inside of meta and the component. The result is something like this: Simply put, a side effect is any code that might do something. A module side effect is any code that might do something when a module is loaded. Taking our code from earlier, we saw how the compiler can remove the exports and their imports that aren't used. But if we add this seemingly harmless line of code your app will break! That console.log does something. The module is imported and then immediately logs to the console. The compiler won't remove it because it has to run when the module is imported. It will bundle something like this: The loader is gone but the prisma dependency stayed! Had we logged something harmless like console.log("hello!") it would be fine. But we logged the prisma module so the browser's going to have a hard time with that. This is no longer a module side effect (runs when the module is imported), but rather a side effect of the loader (runs when the loader is called). The compiler will now remove both the loader and the prisma import because it isn't used anywhere else in the module. Occasionally, the build may have trouble tree-shaking code that should only run on the server. If this happens, you can use the convention of naming a file with the extension .server before the file type, for example db.server.ts. Adding .server to the filename is a hint to the compiler to not worry about this module or its imports when bundling for the browser.'''
year_published = 2025
clearnet = "https://remix.run/docs/en/2.16.0/guides/constraints"
