["https://remix.run/docs/en/1.19.3/guides/manual-mode"]
title = "Manual mode (v1.19.3) | Remix"
full_description = '''By default, remix dev drives like an automatic. It keeps your app server up-to-date with the latest code changes by automatically restarting the app server whenever file changes are detected in your app code. This is a simple approach that stays out of your way and we think will work well for most apps. But if app server restarts are slowing you down, you can take the wheel and drive remix dev like a manual: That means learning how to use the clutch to shift gears. It also means you might stall while your getting your bearings. It takes a bit more time to learn and its more code for you to maintain. We don't think its worth it unless you're feeling some pain with the default automatic mode. But if you are, Remix has got you covered. Before you start drag racing, it helps to understand how Remix works under the hood. It's especially important to understand that remix dev spins up not one, but two processes: the Remix compiler and your app server. Previously, we referred to the Remix compiler as the "new dev server" or the "v2 dev server". Technically, remix dev is a thin layer around the Remix compiler that does include a tiny server with a single endpoint (/ping) for coordinating hot updates. But thinking of remix dev as a "dev server" is unhelpful and wrongly implies that it is replacing your app server in dev. Rather than replacing your app server, remix dev runs your app server alongside the Remix compiler so you get the best of both worlds: You need some way to bust the import cache when you want to re-import modules with code changes. Also importing modules is different between CommonJS (require) and ESM (import) which makes things even more complicated. If you are using tsx or ts-node to run your server.ts, those tools may be transpiling your ESM Typescript code to CJS Javascript code. In this case, you'll need to use CJS cache busting in your server.ts even though the rest of your server code uses imports. CommonJS uses require for imports, giving you direct access to the require cache. That lets you bust the cache for just the server code when rebuilds occur.'''
year_published = 2025
clearnet = "https://remix.run/docs/en/1.19.3/guides/manual-mode"
