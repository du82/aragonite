full_description = '''PROJECTS MENU GANGSTAGRASS RENCH LIQUID LTD DAN WHITENER SAMANTHA MARTIN B STAR MYSTERY TRAIL RECORDED & REMIXED Official Website DAN WHITENER: CROSSOVERCrazy talented multi-instrumentalist Dan Whitener breaks out the roots folk blues americana mix on this awesome EP. After hearing the Rench-produced album "Send the Nightingale" by Samantha Martin & Delta Sugar, Dan fleshed out an idea that involved the same team as the foundation of the sound - Rench producing, with Samantha and Delta Sugar doing harmonies and some instrumentation, recorded with Peter J Moore (producer of Cowboy Junkies' Trinity Sessions) and brought to Rench Audio in Brooklyn for further development. Dan sang, played guitar, piano, and organ, and brought in some other awesome players to fill it out. He also let Rench add some special sauce. Enjoy! Produced by Rench, 2017'''
