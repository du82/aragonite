description = """
Lightning On The Strings, Thunder On The Mic (2010) From the makers of the 
theme song for the FX series Justified, a full length album of serious 
bluegrass picking and sick flow on the mic like you won’t hear anywhere 
else. The album also includes a track featuring Brooklyn underground emcee 
Tomasia and a track featuring the incredible voice of bluegrass singer Jen 
Larson.

