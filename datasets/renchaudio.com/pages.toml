banjo, fiddle, and resonator guitar the rhymes are hard and heavy.

Featuring the fine talents of: T.O.N.E-Z (vocals), Rench (vocals, beats, 
guitar), Matt Check (vocals, banjo), Todd Livingston (resonator guitar), 
Jason Cade (fiddle), Roy Shimmyo (bass), PREPMODE (turntables), Jen Larson 
