["https://renchaudio.com/gangstagrass"]
title = "GANGSTAGRASS — Rench Audio"
full_description = 'PROJECTS MENU GANGSTAGRASS RENCH LIQUID LTD DAN WHITENER SAMANTHA MARTIN B STAR MYSTERY TRAIL RECORDED & REMIXED Official Website ALBUMS <img src="https://images.squarespace-cdn.com/content/v1/500d6f0ce4b0a738c57ea319/1620408911472-06BV2SFNAW278M22ZDKS/NTFE+cover+digital.png" alt="NTFE cover digital.png" /> <img src="https://images.squarespace-cdn.com/content/v1/500d6f0ce4b0a738c57ea319/1572009928582-C6SYHN6ZAXPGYW0V1R0A/Pocket+Full+Of+Fire.jpg" alt="Pocket Full Of Fire.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/500d6f0ce4b0a738c57ea319/1487025752303-OJZ4482Y3QOUEVFO0K6V/GG+American+music.jpeg" alt="GG American music.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/500d6f0ce4b0a738c57ea319/1487025752317-OQR9SIQNT1ZW831QUX6O/broken%2Bhearts.jpg" alt="broken+hearts.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/500d6f0ce4b0a738c57ea319/1487025752721-SD95TAYJ8SM7AB7BMJQR/rappalachia.jpeg" alt="rappalachia.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/500d6f0ce4b0a738c57ea319/1487025752566-UH25CN3JXO3KY58PPTLF/lightening+on+the+strings.jpeg" alt="lightening on the strings.jpeg" /> #block-0747e6d3414d8ebc2b0e .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -8px; } #block-0747e6d3414d8ebc2b0e .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 8px; margin-bottom: 8px; } GANGSTAGRASS“There are a lot more people out there with Jay-Z and Johnny Cash on their ipod playlists than you think.” says Rench, mastermind behind the genre breaking sensation Gangstagrass.He should know. He’s spent the last couple years travelling the country, performing for them with a groundbreaking band that gives them the best of both.Rench produced honky-tonk hip-hop recordings on his Rench Audio imprint for the last decade, while making beasts for local NYC rappers and hosting country music nights in popular NYC venues. In 2007 Rench had a musical itch that needed to be scratched – he was listening to 1970s recordings of Ralph Stanley and the Clinch Mountain Boys and couldn’t help imagining what classic bluegrass would sound like with rap vocals and beats. The result was a genre-demolishing blitz called Rench Presents: Gangstagrass. He put it up for free download and people took notice. Hundreds of thousands of downloads followed creating an intense underground buzz.FX Network soon came to Rench looking for the Gangstagrass sound for the theme song to their new series Justified. The result was Long Hard Times To Come, garnering an Emmy nomination in 2010. Four studio albums and a live album later, Gangstagrass tours the world and blows minds with an incredible stage show. Get familiar with their extensive catalog and see them live if you can.'
