dtimes.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/500d6f0ce4b0a738c57ea319/1490131752897-D72BSCBY10YHGO007ERU/deathofthefresh.jpg" alt="deathofthefresh.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/500d6f0ce4b0a738c57ea319/1490131747419-8D0E5UDYEPRF61Z0D9V0/botw.jpg" alt="botw.jpg" /> #block-yui_3_17_2_5_1490128416486_50766 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -8px; } #block-yui_3_17_2_5_1490128416486_50766 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 8px; margin-bottom: 8px; } Official Website ALBUMS <img src="https://images.squarespace-cdn.com/content/v1/500d6f0ce4b0a738c57ea319/1620408911472-06BV2SFNAW278M22ZDKS/NTFE+cover+digital.png" alt="NTFE cover digital.png" /> <img src="https://images.squarespace-cdn.com/content/v1/500d6f0ce4b0a738c57ea319/1572009928582-C6SYHN6ZAXPGYW0V1R0A/Pocket+Full+Of+Fire.jpg" alt="Pocket Full Of Fire.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/500d6f0ce4b0a738c57ea319/1487025752303-OJZ4482Y3QOUEVFO0K6V/GG+American+music.jpeg" alt="GG American music.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/500d6f0ce4b0a738c57ea319/1487025752317-OQR9SIQNT1ZW831QUX6O/broken%2Bhearts.jpg" alt="broken+hearts.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/500d6f0ce4b0a738c57ea319/1487025752721-SD95TAYJ8SM7AB7BMJQR/rappalachia.jpeg" alt="rappalachia.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/500d6f0ce4b0a738c57ea319/1487025752566-UH25CN3JXO3KY58PPTLF/lightening+on+the+strings.jpeg" alt="lightening on the strings.jpeg" /> #block-0747e6d3414d8ebc2b0e .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -8px; } #block-0747e6d3414d8ebc2b0e .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 8px; margin-bottom: 8px; } GANGSTAGRASS“There are a lot more people out there with Jay-Z and Johnny Cash on their ipod playlists than you think.” says Rench, mastermind behind the genre breaking sensation Gangstagrass.He should know. He’s spent the last couple years travelling the country, performing for them with a groundbreaking band that gives them the best of both.Rench produced honky-tonk hip-hop recordings on his Rench Audio imprint for the last decade, while making beasts for local NYC rappers and hosting country music nights in popular NYC venues. In 2007 Rench had a musical itch that needed to be scratched – he was listening to 1970s recordings of Ralph Stanley and the Clinch Mountain Boys and couldn’t help imagining what classic bluegrass would sound like with rap vocals and beats. The result was a genre-demolishing blitz called Rench Presents: Gangstagrass. He put it up for free download and people took notice. Hundreds of thousands of downloads followed creating an intense underground buzz.FX Network soon came to Rench looking for the Gangstagrass sound for the theme song to their new series Justified. The result was Long Hard Times To Come, garnering an Emmy nomination in 2010. Four studio albums and a live album later, Gangstagrass tours the world and blows minds with an incredible stage show. Get familiar with their extensive catalog and see them live if you can. ALBUMS <img src="https://images.squarespace-cdn.com/content/v1/500d6f0ce4b0a738c57ea319/1487025230162-JFYH5TAHFT2R3SW26PEK/thems+the+breaks+cover.jpg" alt="thems the breaks cover.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/500d6f0ce4b0a738c57ea319/1487025229745-Z4R88USJR3BP7H8SPIF5/rench+worn+down+low.jpeg" alt="rench worn down low.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/500d6f0ce4b0a738c57ea319/1487025228715-YNM779DK6Q97M550B725/rench+elkforn+riders.jpeg" alt="rench elkforn riders.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/500d6f0ce4b0a738c57ea319/1487025228824-V22URDGGG7UKGQ78LIWQ/rench+life+in+mean+season.jpeg" alt="rench life in mean season.jpeg" /> #block-yui_3_17_2_4_1487024548247_6962 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -8px; } #block-yui_3_17_2_4_1487024548247_6962 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 8px; margin-bottom: 8px; } RENCHIt’s a hard thing when you contemplate digging your own grave and jumping in. But Rench figured it may be easier than what was in store. After all, most people run away when they see Bigfoot. They don’t challenge him to an arm wrestling match. And they certainly don’t win. That is to say they don’t cheat, because nobody beats Bigfoot at arm wrestling fair and square. Fate had other things in store for Rench, and before he could look for a shovel, he felt the lick of the flames from the raging forest fire advancing. “This isn’t over!” yelled Bigfoot as they ran from the fire, but Rench could not hear Bigfoot’s last words over the beating of the wings of mighty eagles, talons clutching at his Panhandle Slim original western wear shirt as they lifted him to safety. And so it was that Rench dedicated himself to make music awesometacular enough to pay adequate tribute to the majestic creature that had once threatened him so, and who so little deserved to die a fiery death. He succeeded with the help of his friends like the Lonesome Sisters andGangstagrass. Whether its a Rench block rockin' honky-tonk show or a full blown Gangstagrass party, they blow minds from coast to coast. But as each amazing performance draws to an end, Rench takes a quick look at the exits, knowing that Bigfoot’s remains were never found, and preparing for the night he sees the bouncer out cold at the enormous hairy feet of an angry sasquatch.So tonight as you sit comfortably at home, not a care in the world about meeting your untimely end at the hands of Bigfoot, put on some of Rench's low down dirty honky-tonk with mad beats and appreciate the cruel ironies of this lonely dust storm we call life. Official Website LIQUID LTD: HARD LABORRench has teamed up with Liquid, founding member of the Juno award-winning collective Bran Van 3000 to create a new solo sound that reflects Liquids working class Canadian roots. Liquid pitched a demo to Rench as “campfire soul” and Rench said “I’m in.” - from there the collaboration blossomed into a full album of Urban Americana under production with the trademark Bang and Twang sound of a Rench project. The first single from this project is “HARD LABOR” and it slaps hard. Produced by Rench, 2019The first single “Hard Labor” is available now! Stream Hard Labor on Spotify Official Website DAN WHITENER: CROSSOVERCrazy talented multi-instrumentalist Dan Whitener breaks out the roots folk blues americana mix on this awesome EP. After hearing the Rench-produced album "Send the Nightingale" by Samantha Martin & Delta Sugar, Dan fleshed out an idea that involved the same team as the foundation of the sound - Rench producing, with Samantha and Delta Sugar doing harmonies and some instrumentation, recorded with Peter J Moore (producer of Cowboy Junkies' Trinity Sessions) and brought to Rench Audio in Brooklyn for further development. Dan sang, played guitar, piano, and organ, and brought in some other awesome players to fill it out. He also let Rench add some special sauce. Enjoy! Produced by Rench, 2017 Official website Samantha Martin: Send the NightingaleSoul Gospel Roots music with amazing vocal harmonies and sparse instrumentation. Rench met Samantha and her group Delta Sugar at the Folk Alliance conference and immediately asked to work with her. Recording was done with Peter Moore (producer of the Cowboy Junkies' Trinity Sessions) in Toronto, then the files were brought back to Rench Audio for further development. This album is awesome. Check it out now! Produced by Rench, 2015 ALBUMS <img src="https://images.squarespace-cdn.com/content/v1/500d6f0ce4b0a738c57ea319/1487026314506-NBXBNBGEBJXV99EI2KKJ/bstar1.jpg" alt="bstar1.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/500d6f0ce4b0a738c57ea319/1487026314644-26PCZE6P34SIA97ULDV9/bstar2.jpg" alt="bstar2.jpg" /> #block-0bd4763771639c0fda53 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -10px; } #block-0bd4763771639c0fda53 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 10px; margin-bottom: 10px; } B STARB-Star, A.K.A. Battlestar America, A.K.A. Battlestar was a seven piece honky-tonk hip-hop band in Brooklyn that kicked ass. Members included Rench, Veronica Dougherty, Brian "Po-Dawg" Pocius, Michi "Ten Fingers" Wiancko, gOAt, Dolio The Sleuth, and Danny "Danny Miami" Invuoldstadt."Battlestar America's departure from a traditional country sound goes beyond pairing laconic rappers and energetic turntablists with background harmonies and fiddling: on its album Above Marke Value, the front man, Rench, sings with a slow drawl about job losses, striving, union organizing, and other socialist concerns." - The New Yorker Magazine---"Adding hip-hop beats, raps and turntables to the plaintive wail of Hank Williams, This is a band as comfortable with Cypress Hill's 'How I Could Just Kill a Man' as with Dolly Parton's '9 to 5.'" - Isaac Guzman, New York Daily News--- "Rocking two turntables and a fiddle, Battlestar America will get you bobbing your head until your neck turns red." - Vibe Magazine, December2004 The mystery trail of Astonishing. What is this about? You'll have to join the search to find out. RECORDED, PRODUCED, OR REMIXED BY RENCH THE BERGER SISTERS: MAYBE SOLilting old-time harmonies and etherial modern folk with these actual sisters, fiddle guitar and rhodes, sometimes bass. Traditional yet current.Recorded and mixed at Rench Audio 2016 Official Website THE WEAL AND WOE: THE ONE TO BLAMEHonky-Tonk harmonies from Brooklyn.Recorded at Rench Audio 2011. OFFICIAL WEBSITE APOCALYPSE FIVE & DIME: BALLADS FOR THE END TIMESMayhem mish-mash circus punk old time rock - banjo, ukulele, saxophone, fiddle, tuba, trombone, marching drums.Recorded at Rench Audio 2010. FISHEYE: DEATH OF THE FRESHExperimental Hip-Hop album featuring Tomasia.Recorded at Rench Audio 2006. JASON DOWNS: BITCH OF THE WEEKRench recording and remix at Rench Audio 2005'''
