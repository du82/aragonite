["http://renchaudio.com/store/rench-elkhorn-riders"]
title = "Rench - Elkhorn Riders (stock limited!) — Rench Audio"
description = """
Elkhorn Riders (2005) is a unique country-trip-hop creation that blends 
traditional country with deep beats and gritty loops in an intimate and 
powerful style. Starting with beautiful and sparse duets released on two 
CDs by the Lonesome Sisters in 2004, Rench chopped, spliced, looped, and 
tweaked the raw recordings into sync with richly layered beats and creative 
sampling to achieve a transformation of traditional country into something 
louder and funkier while retaining the purity and soulfulness of the 
appalachian harmonies at the center of the mix.

The remixes are anchored in thumping kicks and crisp snares that keep a 
steady hip-hop undercurrent, while above them samples, voices, and 
instruments mingle, float, and whirl.

The freedom of studio production in these remixes is fully explored, with 
tracks ranging from the simplicity of voices and drums to sprawling waves 
of loops and effects. A great CD of flavorful country-hip-hop."""
