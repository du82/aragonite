title = "B STAR — Rench Audio"
full_description = '''PROJECTS MENU GANGSTAGRASS RENCH LIQUID LTD DAN WHITENER SAMANTHA MARTIN B STAR MYSTERY TRAIL RECORDED & REMIXED ALBUMS <img src="https://images.squarespace-cdn.com/content/v1/500d6f0ce4b0a738c57ea319/1487026314506-NBXBNBGEBJXV99EI2KKJ/bstar1.jpg" alt="bstar1.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/500d6f0ce4b0a738c57ea319/1487026314644-26PCZE6P34SIA97ULDV9/bstar2.jpg" alt="bstar2.jpg" /> #block-0bd4763771639c0fda53 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -10px; } #block-0bd4763771639c0fda53 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 10px; margin-bottom: 10px; } B STARB-Star, A.K.A. Battlestar America, A.K.A. Battlestar was a seven piece honky-tonk hip-hop band in Brooklyn that kicked ass. Members included Rench, Veronica Dougherty, Brian "Po-Dawg" Pocius, Michi "Ten Fingers" Wiancko, gOAt, Dolio The Sleuth, and Danny "Danny Miami" Invuoldstadt."Battlestar America's departure from a traditional country sound goes beyond pairing laconic rappers and energetic turntablists with background harmonies and fiddling: on its album Above Marke Value, the front man, Rench, sings with a slow drawl about job losses, striving, union organizing, and other socialist concerns." - The New Yorker Magazine---"Adding hip-hop beats, raps and turntables to the plaintive wail of Hank Williams, This is a band as comfortable with Cypress Hill's 'How I Could Just Kill a Man' as with Dolly Parton's '9 to 5.'" - Isaac Guzman, New York Daily News--- "Rocking two turntables and a fiddle, Battlestar America will get you bobbing your head until your neck turns red." - Vibe Magazine, December2004'''
