["https://renchaudio.com/about"]
title = "ABOUT — Rench Audio"
full_description = '''#block-yui_3_17_2_11_1510240241269_23607 .social-icons-style-border .sqs-svg-icon--wrapper { box-shadow: 0 0 0 2px inset; border: none; } THIS IS RENCH AUDIOBased out of Brooklyn, Rench is an Emmy nominated, billboard charting musician and producer. He has been combining Country and Hip-Hop sounds for more than a decade, including solo material and projects like Gangstagrass.Rench Audio has licensed music to MTV, ESPN, FX network, History Channel, A&E network, and many film and tv programs, including the Emmy nominated theme music to the FX network series "Justified"“Rench and his friends have done nothing short of creating a new form of music. Gangstagrass takes two types of music that are opposites and mixes them together brilliantly in a way that is natural and enjoyable.” - Elmore LeonardRench also produces a variety of styles out of his Rench Audio production company - everything from pop to soul to folk to hip-hop. He produced the Maple Blues Award winning blues-gospel album “Send the Nightingale” by Samantha Martin and Delta Sugar. He produced the folk-soul album “Crossover” By Dan Whitener, which had a track placed in Spike Lee’s film “Black KKKlansman.”"Rench’s vision has a toehold on a racy, improbable hybrid." -No DepressionRench has created source music used in advertising for Target, Dove, Truvia, Unilever, Tempurpedic, and many other brands. His production studio is able to turn custom scores around quickly, and his broad network of talented NYC musicians of many genres is a huge asset to anyone looking for real music for their project.“Gangstagrass adeptly layers rap lyrics over strong emotional accents from the instruments, something most DJs can't take advantage of when sampling electronica music. You can hear it in "Nobody Gonna Miss Me;" the skillful slide on the guitar and winsome lines from the fiddle fill in the background of the rap with a bluesy, remorseful tone.” - Mother Jones MagazineRench likes music with soul and music that makes you feel and he brings two decades worth of production experience, plus his weird brain, to bear in his mission to innovate in music.“A mixture of bluegrass and hip-hop that might repel some purists on either side of the country-and-rap divide, but will knock the socks off just about everybody else.” - Wall Street Journal Rench produces music and it sounds cool.His stuff has been nominated for an Emmy and made the Billboard charts. More importantly, it has won the hearts of fans around the world. He likes to go into his studio and make more. Maybe he will produce your next album. Rolling stone:"Stone cold proof that country and rap can get along just fine""The Brooklyn-based artist and leader of the band Gangstagrass – known for the Emmy-nominated theme to FX's Justified, "Long Hard Times to Come" – has discovered the sweet spot where string music and MC beats coexist. The 15 tracks on Them's the Breaks, his excellent new solo album, marry the progressive-country vibe of Gram Parsons with the gritty street sense of Jay Z. Influenced equally by George Jones and Cypress Hill, Rench – real name Oscar Owens – often uses his music to effect societal change."' medium: "Rench continues his fearless musical journey with Them’s The Breaks""In a music world programmed to put everything into neat little boxes, Rench reminds us that very rarely do you find a listener who only listens to one thing. So why not give something new a shot?" noisey:"Gangstagrass is Good 'Ole Southern Hick Hop""Marrying beats, banjos, and bars, this Brooklyn act is pioneering "bang and twang." <img src="https://images.squarespace-cdn.com/content/v1/500d6f0ce4b0a738c57ea319/1462033898510-GFCI5ZM0RDDCQ5VNIHEV/IMG_3384.jpg" alt="IMG_3384.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/500d6f0ce4b0a738c57ea319/1462118336156-TJA7UMD6GE269I4ORR19/deerheads.jpg" alt="deerheads.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/500d6f0ce4b0a738c57ea319/1462033892346