title = "Gangstagrass - Rappalachia CD — Rench Audio"
description = """
Rappalachia takes bluegrass and hip-hop into several new directions, 
anchored by Rench's trademark thumping beats and twangy instrumentation. 
Bluegrass pickers Todd Livingston, Jason Cade, and Ellery Marshall lend 
their chops to complement a host of emcees across 15 tracks that include 
appearances by Dead Prez, Kool Keith,T.O.N.E-z, Nitty Scott MC, David E 
Beats, R-SON, Dolio The Sleuth, Brooklyn35 Collective, Aint No Love, plus 
bluegrass singing from Brandi Hart and Jen Larson. Gangstagrass once again 
expands the boundaries of American music and pioneers new territory that 
shows how seamlessly the block rocking beats and the barn burning twang can 
flow together.

   1. Gunslinging Rambler (feat. R-Son)

   2. Honey Babe (feat. Dolio The Sleuth & Brandi Hart)

   3. Shoot Dem (feat. T.O.N.E-z)

   4. Our Life (feat. Ain't No Love)

   5. Red Sky Morning (feat. Nitty Scott, MC)

   6. Rappalachia 6

   7. Ain't No Stopping (feat. Dolio The Sleuth)

   8. Down by the River, Down by the Sea (feat. David E Beats)

   9. Country Blues (feat. Brandi Hart & Nitty Scott, MC)

  10. Western (feat. Kool Keith)

  11. Bound to Ride (feat. R-Son & Dolio The Sleuth)

  12. No Going Back (feat. BROOKLYN35 Collective)

  13. CrossbowDollar Boss (feat. Dead Prez & Kamara Thomas)

  14. Till My Last Shot (feat. T.O.N.E-z & Jen Larson)"""
