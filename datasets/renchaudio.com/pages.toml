   3. Trouble Everywhere I Go (feat. T.O.N.E-z)

   4. Click Ol' GunI Go Hard (feat. T.O.N.E-z)

   5. Nobody Gonna Miss Me (feat. T.O.N.E-z)

   6. Big Branch (feat. TOMASIA)

   7. In My Aching Heart Shadows Linger (feat. T.O.N.E-z)

   8. My Enemies Lay Beneath the PrairiePut Your Hands up High (feat.  T.O.N.E-z)"""
