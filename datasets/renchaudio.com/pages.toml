title = "Rench - Life In Mean Season — Rench Audio"
description = """
Life In Mean Season is a full (literally as much as a CD will hold) length 
CD of soulful, gritty, block-rockin’ honky-tonk like only Rench delivers. 
The tracks on this disc are comprised of thumping sampled beats covered by 
a smooth velvet layer of live bass, fiddle, acoustic and pedal steel guitar 
and topped with raw, mournful country styled singing. Imagine Gram Parsons 
produced by Dan The Automator, or Bobby Bare collaborating with 
Outkast. From the heart of Brooklyn, this collection may define the 
Brooklyn Twang sound like never before."""
