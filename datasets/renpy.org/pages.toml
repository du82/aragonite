["http://www.renpy.org/doc/html/cds.html"]
title = "Creator-Defined Statements — Ren'Py Documentation"
full_description = '''Creator-Defined Statements link Creator-Defined Statements (CDS) allow you to add your own statements to Ren'Py's scripting language. This makes it possible to add functionality that is not supported by the current syntax. CDS can be more flexible than the direct Python code equivalent. For example, picking a line of dialogue at random: label introduction: python: greetings = ['Hello.', 'Welcome.', 'Can I help you?'] greeting = renpy.random.choice(greetings) "[greeting]" Ren'Py's parser does not know ahead of time what happens in the python block or how it should be executed. It does not do anything with this code until execution and triggers an error if an exception occurs. Using a CDS allows you to: Check the correctness of the parsed syntax (For example, check that the items in the list sent to renpy.random.choice have valid text) Ignore incorrect data at execution (For non-critical functions, it is often better to skip the execution than to throw an exception) Predict Displayables (If the function uses them) Give you addition information during Lint (If at runtime an error was ignored you can have a report here). For example, the above behaviour, but written as a CDS: python early: def parse_random(lexer): subblock_lexer = lexer.subblock_lexer() choices = [] while subblock_lexer.advance(): with subblock_lexer.catch_error(): statement = subblock_lexer.renpy_statement() choices.append(statement) return choices def next_random(choices): return renpy.random.choice(choices) def lint_random(parsed_object): for i in parsed_object: check = renpy.check_text_tags(i.block[0].what) if check: renpy.error(check) renpy.register_statement( name="random", block=True, parse=parse_random, next=next_random, lint=lint_random, ) random is now available as a statement: label introduction: random: "Hello." "Welcome." "Can I help you?" Using a CDS does not guarantee that the execution will be successful, but the better you code your statement, the better Ren'Py can "understand" what you expect from it. Usage link Creator-Defined Statements (CDS) must conform to the following rules: They must be defined in a python early block. They cannot be used in the same file in which they are defined. The file containing the CDS must be loaded earlier than any file that uses it. (Since Ren'Py loads files in the Unicode sort order of their path, it generally makes sense to prefix the name of any file containing a CDS with 01 or some other small number.) Creator-Defined Statements are registered using the renpy.register_statement() function. This functions takes other functions that perform operations on the content of the CDS. For example, a new statement named line that allows lines of text to be specified without quotes. line e "These quotes will show up," Eileen said, "and don't need to be backslashed." The parse function will be sent the lexed content for parsing. The execute function should run an operation on the parsed content. The lint function should report any errors in the parsed content. python early: def parse_smartline(lexer): who = lexer.simple_expression() what = lexer.rest() return (who, what) def execute_smartline(parsed_object): who, what = parsed_object renpy.say(eval(who), what) def lint_smartline(parsed_object): who, what = parsed_object try: eval(who) except Exception: renpy.error("Character not defined: {}".format(who)) tte = renpy.check_text_tags(what) if tte: renpy.error(tte) renpy.register_statement( "line", parse=parse_smartline, execute=execute_smartline, lint=lint_smartline, ) API Reference link renpy.register_statement(name, parse=None, lint=None, execute=None, predict=None, next=None, scry=None, block=False, init=False, translatable=False, execute_init=None, init_priority=0, label=None, warp=None, translation_strings=None, force_begin_rollback=False, post_execute=None, post_label=None, predict_all=True, predict_next=None, execute_default=None, reachable=None) link This registers a user-defined statement. nameThis is either a space-separated list of names that begin the statement, or the empty string to define a new default statement (the default statement will replace the say statement). blockThis may be one of: False, to indicate that the satement does not expect a block. True, to indicate that the statement expects a block and will parse that block. "possible", to indicate that the statement may or may not take a block. "script" to indicate that the block shopuld be interpreted as a block of Ren'Py script language statements. See next for how to implement control flow using this. "script-possible" is treated like "script" if a block is present, and False otherwise. "atl" to indicate that the block should be interpreted as an ATL transsform. This is passed as an additional argument to execute. "atl-possible" is treated like "atl" if a block is present, and and False otherwise. parseThis is a function that takes a Lexer object. This function should parse the statement, and return an object. This object is passed as an argument to all the other functions. lintThis is called to check the statement. It is passed a single argument, the object returned from parse. It should call renpy.error to report errors. executeThis is a function that is called when the statement executes. It is passed a single argument, the object returned from parse. If there is an ATL block, the keyword argument atl is passed with an ATL transform. execute_initThis is a function that is called at init time, at priority 0. It is passed a single argument, the object returned from parse. predictThis is a function that is called to predict the images used by the statement. It is passed a single argument, the object returned from parse. It should return a list of displayables used by the statement. nextThis is a function that is called to determine the next statement. If block is not "script", this is passed a single argument, the object returned from the parse function. If block is "script", an additional argument is passed, an object that names the first statement in the block. The function should return either a string giving a label to jump to, the second argument to transfer control into the block, or None to continue to the statement after this one. It can also return the result of Lexer.renpy_statement() or Lexer.renpy_block() when called in the parse function. labelThis is a function that is called to determine the label of this statement. If it returns a string, that string is used as the statement label, which can be called and jumped to like any other label. warpThis is a function that is called to determine if this statement should execute during warping. If the function exists and returns true, it's run during warp, otherwise the statement is not run during warp. scryUsed internally by Ren'Py. initTrue if this statement should be run at init-time. (If the statement is not already inside an init block, it's automatically placed inside an init block.) You probably don't want this if you have an execute_init function, as wrapping the statement in an init block will cause the execute_init and execute functions to be called at the same time. translatableIf set to true, the statement will be included in a translation block, generally the block containing the succeding say statement. This may only be set to true for one-line statements. It's used for statements like nvl clear and voice, which may need to be changed with dialogue. init_priorityAn integer that determines the priority of initialization of the init block created by init and execute_init function. translation_stringsA function that is called with the parsed block. It's expected to return a list of strings, which are then reported as being available to be translated. force_begin_rollbackThis should be set to true on statements that are likely to cause the end of a fast skip, similar to menu or call screen. post_executeA function that is executed as part the next statement after this one. (Adding a post_execute function changes the contents of the RPYC file, meaning a Force Compile is necessary.) post_labelThis is a function that is called to determine the label of this the post execute statement. If it returns a string, that string is used as the statement label, which can be called and jumped to like any other label. This can be used to create a unique return point. predict_allIf True, then this predicts all sub-parses of this statement and the statement after this statement. predict_nextThis is called with a single argument, the label of the statement that would run after this statement. This should be called to predict the statements that can run after this one. It's expected to return a list of of labels or SubParse objects. This is not called if predict_all is true. execute_defaultThis is a function that is called at the same time the default statements are run - after the init phase, but before the game starts; when the a save is loaded; after rollback; before lint; and potentially at other times. This is called with a single argument, the object returned from parse. reachableThis is a function that is called to allow this statement to customize how it participates in lint's reachability analysis. By default, a statement's custom block, sub-parse blocks created with Lexer.renpy_block(), and the statement after the statement are reachable if the statement itself is reachable. The statement is also reachable if it has a label function. This can be customized by providing a reachable function. This is a function that takes five arguments (in the following, a "label" may be a string or an opaque object): The object returned by the parse function. A boolean that is true if the statement is reachable. The label of the statement. The label of the next statement, or None if there is no next statement. If block is set to "script", the label of the first statement in the block, or None if there is no block. It's expected to return a set that may contain: A label or subparse object of a statement that is reachable. True, to indicate that this statement should not be reported by lint, but is not intrinsically reachable. (It will become reachable if it is reported reachable by another statement.) None, which is ignored. This function may be called multiple times with both value of is_reachable, to allow the statement to customize its behavior based on whether it's reachable or not. (For example, the next statement may only be reachable if this statement is.) Warning Using the empty string as the name to redefine the say statement is usually a bad idea. That is because when replacing a Ren'Py native statement, its behavior depends on the Statement Equivalents. In the case of the say statement, these equivalents do not support the id and translation systems. As a result, a game redefining the default statement will not be able to use these features (short of reimplementing them entirely). Lexer object link A custom statement's parse function takes an instance of a Lexer object. class Lexer link error(msg) link Parameters msg (str) -- Message to add to the list of detected parsing errors. Add msg (with the current position) to the list of detected parsing errors. This interrupts the parsing of the current statement, but does not prevent further parsing. require(thing, name=None) link Try to parse thing and report an error if it cannot be done. If thing is a string, try to parse it using match(). Otherwise, thing must be another method on this lexer object which is called without arguments. If name is not specified, the name of the method will be used in the message (or thing if it's a string), otherwise name will be used. eol() link Returns True if the lexer is at the end of the line, else False. Return type bool expect_eol() link If not at the end of the line, raise an error. expect_noblock(stmt) link Called to indicate this statement does not expect a block. If a block is found, raise an error. stmt should be a string, it will be added to the message with an error. expect_block(stmt) link Called to indicate that the statement requires that a non-empty block is present. stmt should be a string, it will be added to the message with an error. has_block() link Returns True if the current line has a non-empty block, else False. Return type bool match(re) link Match an arbitrary regexp string. All of the statements in the lexer that match things are implemented in terms of this function. They first skip whitespace, then attempt to match against the line. If the match succeeds, the matched text is returned. Otherwise, None is returned, and the state of the lexer is unchanged. keyword(s) link Match s as a keyword. name() link Match a name. This does not match built-in keywords. word() link Returns The text of the matched word. Return type str Match any word, including keywords. image_name_component() link Match an image name component. Unlike a word, an image name component can begin with a number. string() link Match a Ren'Py string. integer() link Returns String containing the found integer. Return type str Match an integer. float() link Returns String containing the found floating point number. Return type str Match a floating point number. label_name(declare=False) link Match a label name, either absolute or relative. If declare is true, then the global label name is set. (Note that this does not actually declare the label - the statement is required to do that by returning it from the label function.) simple_expression() link Match a simple Python expression, returns it as a string. This is often used when you expect a variable name. It is not recommended to change the result. The correct action is to evaluate the result in the future. delimited_python(delim) link Match a Python expression that ends in a delim, for example ':'. This is often used when you expect a condition until the delimiter. It is not recommended to change the result. The correct action is to evaluate the result in the future. This raises an error if end of line is reached before the delimiter. arguments() link This must be called before the parentheses with the arguments list, if they are not specified returns None, otherwise returns an object representing the arguments to a function call. This object has an evaluate method on it that takes an optional scope dictionary, and returns a tuple in which the first component is a tuple of positional arguments, and the second component is a dictionary of keyword arguments. rest() link Skip whitespace, then return the rest of the line. checkpoint() link Return an opaque object representing the current state of the lexer. revert(o) link When o is the object returned from checkpoint(), reverts the state of the lexer to what it was when checkpoint() was called. (This is used for backtracking.) subblock_lexer() link Returns A Lexer for the block associated with the current line. advance() link In a subblock lexer, advance to the next line. This must be called before the first line, so '''
