["http://www.renpy.org/doc/html/config.html"]
title = "Configuration Variables — Ren'Py Documentation"
description = "config.name"
full_description = '''Configuration Variables link Configuration variables control the behavior of Ren'Py's implementation, allowing Ren'Py itself to be customized in a myriad of ways. These range from the common (such as changing the screen size) to the obscure (adding new kinds of archive files). Ren'Py's implementation makes the assumption that, once the GUI system has initialized, configuration variables will not change. Changing configuration variables outside of init blocks can lead to undefined behavior. Configuration variables are not part of the save data. Most configuration variables are easily set using a define statement: define config.rollback_enabled = False Dict and list variables can be populated using define or in an init python block: define config.preload_fonts += ["OrthodoxHerbertarian.ttf"] define config.adjust_attributes["eileen"] = eileen_adjust_function init python hide: def inter_cbk(): # this is a terrible callback renpy.notify("Interacting !") config.interact_callbacks.append(inter_cbk) Project Info link define config.name = "" link This should be a string giving the name of the game. This is included as part of tracebacks and other log files, helping to identify the version of the game being used. define config.version = "" link This should be a string giving the version of the game. This is included as part of tracebacks and other log files, helping to identify the version of the game being used. define config.window_icon = None link If not None, this is expected to be the filename of an image giving an icon that is used for the game's main window. This does not set the icon used by windows executables and mac apps, as those are controlled by Special Files. define config.window_title = None link The static portion of the title of the window containing the Ren'Py game. _window_subtitle is appended to this to get the full title of the window. If None, the default, this defaults to the value of config.name. Auto-Forward Mode link define config.afm_bonus = 25 link The number of bonus characters added to every string when auto-forward mode is in effect. define config.afm_callback = None link If not None, a Python function that is called to determine if it is safe to auto-forward. The intent is that this can be used by a voice system to disable auto-forwarding when a voice is playing. define config.afm_characters = 250 link The number of characters in a string it takes to cause the amount of time specified in the auto forward mode preference to be delayed before auto-forward mode takes effect. define config.afm_voice_delay = .5 link The number of seconds after a voice file finishes playing before AFM can advance text. Callbacks link These take functions that are called when certain events occur. These are not the only callbacks - ones corresponding to more specific features are listed in the section on that feature. define config.after_default_callbacks = [ ... ] link A list of functions that are called (with no arguments) whenever default statements are processed. The default statements are run after the init phase, but before the game starts; when the a save is loaded; after rollback; before lint; and potentially at other times. Similar to the default statement, these callbacks are a good place to add data to the game that does not exist, but needs to. define config.context_callback = None link This is a callback that is called with no arguments when Ren'Py enters a new context, such as a menu context. define config.interact_callbacks = [ ... ] link A list of functions that are called (without any arguments) when an interaction is started or restarted. define config.label_callbacks = [ ] link This is a list of callbacks that are called whenever a labels is reached. The callbacks are called with two arguments. The first is the name of the label. The second is True if the label was reached through jumping, calling, or creating a new context, and False otherwise. define config.periodic_callbacks = [ ... ] link This is a list of functions that are called, with no arguments, at around 20Hz. define config.python_callbacks = [ ... ] link A list of functions. The functions in this list are called, without any arguments, whenever a Python block is run outside of the init phase. One possible use of this would be to have a function limit a variable to within a range each time it is adjusted. The functions may be called while Ren'Py is starting up, before the start of the game proper, and potentially before the variables the function depends on are initialized. The functions are required to deal with this, perhaps by using hasattr(store, 'varname') to check if a variable is defined. define config.python_exit_callbacks = [ ] link A list of functions that are called when Ren'Py is about to exit to the operating system. This is intended to be used to deinitalize python modules. Much of Ren'Py is deinitalized before these functions are called, so it's not safe to use Ren'Py functions in these callbacks. define config.scene_callbacks = [ ... ] link A list of functions that are called when the scene statement runs, or renpy.scene() is called. The functions are called with a single argument, the layer that the scene statement is called on. These functions are called after the layer is cleared, but before the optional image is added, if present. Ren'Py may call renpy.scene for its own purposes, so it's recommended to check the layer name before acting on these callbacks. define config.start_callbacks = [ ... ] link A list of callbacks functions that are called with no arguments after the init phase, but before the game (including the splashscreen) starts. This is intended to be used by frameworks to initialize variables that will be saved. The default value of this variable includes callbacks that Ren'Py uses internally to implement features such as nvl-mode. New callbacks can be appended to this list, but the existing callbacks should not be removed. define config.start_interact_callbacks = [ ... ] link A list of functions that are called (without any arguments) when an interaction is started. These callbacks are not called when an interaction is restarted. define config.statement_callbacks = [ ... ] link A list of functions that are called when a statement is executed. These functions are generally called with the name of the statement in question. However, there are some special statement names. "say"Normal say statements. "say-bubble"Say statements in bubble mode. "say-nvl"Say statements in NVL mode. "say-bubble"Say statements in bubble mode. "say-centered"Say statments using the centered character. "menu":Normal menu statements. "menu-nvl"Menu statements in NVL mode. "menu-with-caption"Menu statements with a caption. "menu-nvl-with-caption"Menu statements with a caption in NVL mode. There is a default callback in this list that is used to implement window auto. define config.with_callback = None link If not None, this should be a function that is called when a with statement occurs. This function can be responsible for putting up transient things on the screen during the transition. The function is called with two arguments: the transition that is occurring, and the transition it is paired with. The latter is None except in the case of the implicit None transition produced by an inline with statement, in which case it is the inline transition that produced the with None. It is expected to return a transition, which may or may not be the transition supplied as its argument. Characters and Dialogue link define config.all_character_callbacks = [ ... ] link A list of callbacks that are called by all characters. This list is prepended to the list of character-specific callbacks. Ren'Py includes its own callbacks at the start of this list. define config.character_callback = None link The default value of the callback parameter of Character. define config.character_id_prefixes = [ ... ] link This specifies a list of style property prefixes that can be given to a Character(). When a style prefixed with one of the given prefix is given, it is applied to the displayable with that prefix as its ID. For example, the default GUI adds "namebox" to this. When a Character is given the namebox_background property, it sets background on the displayable in the say screen with the id "namebox". define config.say_allow_dismiss = None link If not None, this should be a function. The function is called with no arguments when the user attempts to dismiss a say statement. If this function returns True, the dismissal is allowed, otherwise it is ignored. define config.say_arguments_callback = None link If not None, this should be a function that takes the speaking character, followed by positional and keyword arguments. It's called whenever a say statement occurs, even when the statement doesn't explicitly pass arguments. The arguments passed to the callback always include an interact argument, and include the others provided in the say statement (if any). This should return a pair, containing a tuple of positional arguments (almost always empty), and a dictionary of keyword arguments (almost always with at least interact in it). Those will replace the arguments passed to the callback. For example: def say_arguments_callback(who, interact=True, color="#fff"): return (), { "interact" : interact, "what_color" : color } config.say_arguments_callback = say_arguments_callback define config.say_sustain_callbacks = [ ... ] link A list of functions that are called, without arguments, before the second and later interactions caused by a line of dialogue with pauses in it. Used to sustain voice through pauses. Choice Menus link define config.auto_choice_delay = None link If not None, this variable gives a number of seconds that Ren'Py will pause at an in-game menu before picking a random choice from that menu. We'd expect this variable to always be set to None in released games, but setting it to a number will allow for automated demonstrations of games without much human interaction. define config.menu_arguments_callback = None link If not None, this should be a function that takes positional and/or keyword arguments. It's called whenever a menu statement runs, with the arguments to that menu statement. This should return a pair, containing a tuple of positional arguments (almost always empty), and a dictionary of keyword arguments. define config.menu_include_disabled = False link When this variable is set, choices disables with the if statement are included as disabled buttons. define config.menu_window_subtitle = "" link The _window_subtitle variable is set to this value when entering the main or game menus. define config.narrator_menu = True link If true, narration inside a menu is displayed using the narrator character. Otherwise, narration is displayed as captions within the menu itself. Display link define config.adjust_view_size = None link If not None, this should be a function taking two arguments, the width and height of the physical window. It is expected to return a tuple giving the width and height of the OpenGL viewport, the portion of the screen that Ren'Py will draw pictures to. This can be used to configure Ren'Py to only allow certain sizes of screen. For example, the following allows only integer multiples of the original screen size: init python: def force_integer_multiplier(width, height): multiplier = min(width / config.screen_width, height / config.screen_height) multiplier = max(int(multiplier), 1) return (multiplier * config.screen_width, multiplier * config.screen_height) config.adjust_view_size = force_integer_multiplier define config.display_start_callbacks = [ ] link This contains a list of functions that are called after Ren'Py displays a window, but before the first frame is rendered. The main use of this is to allow libraries to gain access to resources that need an initializd gui, like OpenGL functions. define config.gl_clear_color = "#000" link The color that the window is cleared to before images are drawn. This is mainly seen as the color of the letterbox or pillarbox edges drawn when aspect ratio of the window (or monitor in fullscreen mode) does not match the aspect ratio of the game. define config.gl_lod_bias = -0.5 link The default value of the u_lod_bias uniform, which controls the mipmap level Ren'Py uses. define config.gl_resize = True link Determines if the user is allowed to resize an OpenGL-drawn window. define config.gl_test_image = "black" link The name of the image that is used when running the OpenGL performance test. This image will be shown for 5 frames or .25 seconds, on startup. It will then be automatically hidden. define config.minimum_presplash_time = 0.0 link The minimum amount of time, in seconds, a presplash, Android presplash, or iOS LaunchImage is displayed for. If Ren'Py initializes before this amount of time has been reached, it will sleep to ensure the image is shown for at least this amount of time. The image may be shown longer if Ren'Py takes longer to start up. define config.nearest_neighbor = False link Uses nearest-neighbor filtering by default, to support pixel art or melting players' eyes. define config.physical_height = None link If set, this is the default height of the window containing the Ren'Py game, in pixels. If not set, the height of the window defaults to config.screen_height. define config.physical_width = None link If set, this is the default height of the window containing the Ren'Py game, in pixels. If not set, the height of the window defaults to config.screen_width. define config.screen_height = 600 link The virtual height of the game, in pixels. If config.physical_height is not set, this is also the default size of the window containing the game. Usually set by gui.init() to a much larger size. define config.screen_width = 800 link The virtual width of the game, in pixels. If config.physical_width is not set, this is also the default size of the window containing the game. Usually set by gui.init() to a much larger size. define config.shader_part_filter = None link If not None, this is a function that is called with a tuple of shader part names. It should return a new tuple of shader parts that will be used. File I/O link define config.file_open_callback = None link If not None, this is a function that is called with the file name when a file needs to be opened. It should return a file-like object, or None to load the file using the usual Ren'Py mechanisms. Your file-like object must implement at least the read, seek, tell, and close methods. One may want to also define a config.loadable_callback that matches this. define config.open_file_encoding = False link If not False, this is the encoding that renpy.open_file() uses when its encoding parameter is none. This is mostly used when porting Python 2 games that used renpy.file() extensively to Python 3, to have those files open as text by default. This gets its default value from the RENPY_OPEN_FILE_ENCODING environment '''
