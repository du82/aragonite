["http://www.renpy.org/doc/html/changelog.html"]
title = "Changelog (Ren'Py 7.x-) — Ren'Py Documentation"
full_description = '''Changelog (Ren'Py 7.x-) link There is also a list of incompatible changes 8.3.4 / 7.8.4 link Fixes link Python Builtins (like len) are now always available during string interpolation. Animated presplash images now take precedence over static presplash images, matching the documentation. There have been a number of fixes related to dragging of viewports and drag displayables. Movies are stopped when returning to a channel from a context. An issue where autosave could hurt performance by causing interaction restarts has been fixed. Ren'Py now uses the previous window type when running the nvl hide statement. A displayable that does not support keyboard focus will now be ignored during keyboard focus computations. An issue that could cause Input to not be masked properly when the contents of the input was a space was fixed. An issue preventing Android and iOS keyboards from being shown when the window was empty has been fixed. An issue that could cause the image cache to be managed incorrectly has been fixed. An incorrect build prevented the web version of Ren'Py from working properly, on Ren'Py 7.8.3. This has been fixed. Other Changes link Displayables rendered for imagemaps are offered (config.screen_width, config.screen_height) pixels of space, rather than an arbitrary size. This shouldn't matter for images, but makes non-image displayables behave more consistently. The ATL "update" event, which was issued in rare circumstances, has been removed. The new renpy.get_statement_name() function returns the name of the currently executing Ren'Py statement, the same name given to config.statement_callbacks. SpriteManager has been modernized, and now can be saved. 8.3.3 / 7.8.3 link Fixes link Empty masked inputs no longer show a single mask glyph. If a Movie has a transform as its image or show_image, that transform is reset each time the movie is shown. The config.nvl_adv_transition no longer forces the dialogue window to be hidden. Screens that are used by another screen are now updated properly if the interaction restarts before the screen is first rendered. The achievement.steam.get_session_ticket() function now works as documented. Changes to audio filters take place immediately after reload. config.skip_sounds now works as documented. Model now creates meshes as described in the documentation when no textures are supplied. The image attributes screen now quotes image and displayable names. An issue with rollback not restarting music has been fixed. Underlines and strikethroughs will not be broken when drawn using harfbuzz-based text shaping. Ren'Py now ensures that IMEs are activated on the primary window when the game starts, rather than on a presplash window. Bars no longer lose the selected_hover prefix when adjusted using keyboard or game controller. Rounding errors during pixel perfect text positioning have been fixed. These errors could cause text to jump 1 pixel during dissolves. The rarely-used gl_anisotropic transform property now works. The keyboard_focus_insets property now works as documented. A rounding issue that could cause bar_invert to stop working has been fixed. Ren'Py will render a displayable a second time if box_wrap is True, to ensure that the displayable is offered the correct amount of space when wrapped to a second line. In rare cases, this could change layout. Controller events can now cause Ren'Py to focus a displayable with default_focus set. Previously, these events weren't considered inputs by the focus system. There have been a number of fixes to the way Ren'Py handles dragging a viewport filled with buttons. A drag may now contain a draggable viewport, allowing a window to be more directly emulated. Other Changes link Android bundles now use install-time assets packs, rather than fast-follow packs, to ensure that all assets are available when the game is run. An AlphaMask will now cause mask transformations to restart each time it is shown. Displayables zoomed down to 0 pixels big will no longer get focus. The "always" option to _renpysteam.keyboard_mode is no longer supported. If given, the "once" mode is used, requiring the player to explicitly request the Steam Deck keyboard when required. The number of frames that Ren'Py passes through the rendering pipeline before switching to powersave mode has been increased to 12, to ensure that frames make it through compositors in a timely manner. Ren'Py locks the image cache less, which should prevent some frame drops when loading images. Synchronized start of audio/video no longer occurs on movie channels unless explicitly requested. When rolling back to a point where a looping Movie was showing, the looping movie will be played again if it had been stopped. A Movie will only stop movies that it has played, rather than any movie on the associated channel. When renpy.set_audio_filter() is called with immediate false, the filter will be applied when the queued file is played, rather than at some indeterminate time in the future. The Frame displayable is no longer adjusted to be pixel perfect, preventing visual glitches. When using text shaders to display text with outlines, Ren'Py will create pseudo-glyphs. These pseudo-glyphs cover the start and end of each line, and are used to ensure the outlines will be shown. 8.3.2 / 7.8.2 link Fixes link Fixed a build issue with 8.3.1 and 7.8.1 that prevented the Android version of Ren'Py from starting properly, making games unplayable. 8.3.1 / 7.8.1 link Fixes link Image keywords (zorder, behind, at, onlayer, and transform) may not occur in an expression, like a list after at. Using local shader variables by name in {shader} tags now works. Textshaders now work with very large sizes and numbers of characters. Lint avoids checking non-files as files. The show_done character callback is now called and documented. The web version of Ren'Py now saves persistent data when the screen is idle for .33 seconds. The path to game.zip in a web build can now be configured by editing the generated index.html. The web version of Ren'Py now defers calls to FS.syncfs, preventing errors that could be caused by files being rapidly renamed. By default, synchronized start of audio now only occurs on looping channels, like music channels. The default can be changed on a channel-by-channel basis by supplying synchro_start to renpy.music.register_channel(). Other Changes link The new renpy.stop_skipping() cancels slow and fast skip. Fast-skipping when slow-skipping (or vice versa) now cancels skipping. On PC, Ren'Py will disable fullscreen when opening a URL. Ren'Py now correctly clips displayables that are positioned at negative offsets to the parent, provided the displayable does not exit the clip rectangle. AudioData now explicitly supports video, and supports properties inside angles (like <from 1.0 to 6.0>). config.font_transforms is now documented. This allows you to define new font transforms for accessibility purposes. The multiple argument to Character is now supplied to Character Callbacks. 8.3.0 / 7.8.0 link Audio Filters link This release adds an audio filter system to Ren'Py, providing a way of processing the sound coming out of audio channels. The audio filter system is based on webaudio, and includes the following filters: Biquad, a way of implementing Lowpass, Highpass, Notch, Peaking, Lowshelf, Highshelf, and Allpass filters. Comb, a delay line with filtering and feedback. Delay, a delay line without the feedback. Mix, a way of mixing two audio streams. Sequence, a way of applying more than one filter to audio. WetDry, a way of filtering a stream with a wet and dry control. Reverb, a way of applying artificial reverb to the audio. Text Shaders link This release adds support for text shaders, which are OpenGL shaders that are applied to text, using information that is provided by the rendering system. The big advantage of this is it now becomes possible to change the way Ren'Py shows slow text to something else. For example, the dissolve text shader causes characters to dissolve in from left to right, rather than showing all at once. Text shaders are able to process the color of the text, including the alpha channel. Text shaders can also adjust the position of the text - for example, the jitter shader causes text to bounce around. Text shaders can be introduced using the {shader} text tag, using the textshader style, or using the config.default_textshader variable. A text block should either use text shaders or not - mixing is not supported. Custom text shaders are supported using the renpy.register_text_shader() function. These have access to new uniforms and attributes that are appropriate to text display. Other Shader Changes link Shaders part can now access shader part local variables to prevent conflicts between variables used by different shader parts. While used mostly with text shaders, shader part local variables are available for all shaders to use. The new config.shader_part_filter variable can be used to filter the shader parts that are used. This makes it possible to implement preferences that turn on and off shader parts as required. Two new model uniforms have been added, u_drawable_size and u_virtual_size, making it easier to project gl_Positions in shaders to coordinates that are used elsewhere in Ren'Py. Visual Studio Code link The Ren'Py Language Visual Studio Code extension is now maintained by the Ren'Py project. As part of this, if you have a Visual Studio Code installed, the launcher will prompt you to install the new extension. Launcher Changes link Under Navigate Script, the TODOs button now has a count of TODOs next to it. Under Navigate Script, the files view now has a checkbox that allows a creator to filter out translation files. Window Statement Changes link There have been changes to the window statement: window show and window hide no longer disable the automatic window management that Ren'Py does. Instead, these statements will immediately show or hide the window, without changing automatic window management. The new window auto False statement will disable automatic window management, and the new window auto True statement will re-enable it. (The existing window auto statement will also work, but window auto True is preferred.) The intent behind this is to make window hide more useful, as it can be used to hide the window for effects without disabling automatic window management. When a window show occurs after window hide, Ren'Py will look forward to the next say statement to determine the type of the window to show. Previously, it looked back to the last say statement. Screenshots and Paper Dolls link Taking a screenshot now hides the notify screen, so multiple screenshots do not leak the path to the previous one. This controlled by config.pre_screenshot_actions. The new renpy.render_to_file() and renpy.render_to_surface() functions make it possible to capture displayables (including trees of displayables, like layered images) and save that to a file or a pygame_sdl2 Surface. Steam link Ren'Py's Steam support has been updated to use the latest version of the Steam DLL. There is now support for the Steam Timeline, part of the Steam Game Recording system. This support is controlled by the config.automatic_steam_timeline variable. When true, the default, save_name is mirrored to the steam Timeline, as is the menu/laying state. It's possible to add additional events to the timeline using achievement.steamapi.add_timeline_event. (Remember to check that achievement.steam is not None before calling this function.) Wrapped methods of the Steamworks API are documented on the Achievements page. Android link Ren'Py now targets Android 15 (API level 35), though versions down to Android 5 may still work. Features link The new anymod keysym prefix makes it possible to bind to a key while ignoring the meta, alt, and ctrl key modifiers. The translation identifier screen (accessed through shift+D) is now the translation info screen, and now includes information about the line being executed. If a language is selected, the screen will also show the line being translated, and the text of the say statement being translated. Creator-Defined Statements can now take an ATL block, which is supplied to the execute function as a keyword argument giving an ATL transform. It's also possible to define a creator-defined statement that optionally takes an ATL block, or a block of script statements. It is now possible to supply menu arguments to renpy.display_menu(), and the new renpy.Choice class makes it possible to supply arguments to each item in the menu. The layer that bubbles appear on is now controlled by bubble.layer and bubble.retained_layer. Retained speech bubbles are now automatically cleared away when other say, menu, or call screen statements are invoked. This is controlled by the bubble.clear_retain_statements variable. The renpy.get_ongoing_transition() function has been added. This returns the transition that is currently being applied to the top level or a layer. The config.translate_ignore_who variable makes it possible to ignore certain characters for the purpose of translations. The Hide action and renpy.hide_screen() actions now take an immediately keyword argument, which prevents 'on hide' handlers in the screens from running. Character Callbacks are now given information about the line of dialogue and the segment of the line that is being shown. The renpy.call_in_new_context() and renpy.invoke_in_new_context() functions take an option _clear_layers keyword argument. When given, this controls which layers will be cleared when changing to the new context. The default volumes of mixers are now set by using the default statement with preferences.volume.<mixer>. For example, the default volume of the music mixer can be set with default preferences.volume.music = 0.5. This also supports creator-defined mixers. Please see Mixer Defaults for more information. The ui.adjustment class now takes a new raw_changed property, which takes the adjustment and the new value, before it's clamped. This can be used to perform actions when the adjustment scrolls out of range. The SplineMatrix class has been added, which makes it possible to transform matrices in a non-linear way. The Input displayable now takes an action property, which is an action that runs when the user presses enter with the text input active. Ruby/Furigana text can now inherit its color from the parent text, by setting color to None. Transform now supports the fps property, which quantizes time inside the transform to a particular number of frames per second. Where appropriate, Bar Values now take min and max parameters, which can be used to define a range that is not zero-based. Other Changes link The notification screen is now hidden before a screenshot is taken. The crop transform property now always takes the size of the crop box, even if bigger than what is being cropped. The hspace and vspace text tags now respect wi'''
year_published = 2025
clearnet = "http://www.renpy.org/doc/html/changelog.html"
