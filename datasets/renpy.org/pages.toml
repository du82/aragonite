["http://www.renpy.org/doc/html/gui.html"]
title = "GUI Customization Guide — Ren'Py Documentation"
description = "gui.text_color"
full_description = '''GUI Customization Guide link Ren'Py features a GUI system that (we hope) looks attractive out of the box, can be customized somewhat, and can be replaced entirely if necessary. This page explains how to do simple and intermediate levels of GUI customization. For more advanced customization, please take a look at the documentation for styles (including the list of style properties) and screens (including screen actions and special screens). This assumes that you're using a new-style Ren'Py GUI (contained in the gui.rpy file). Older GUIs (that use the screens.rpy file) should be treated as advanced GUI customization for the purposes of this guide. Simple GUI Customization link There are a few simple pieces of GUI customization that make sense for all but the simplest visual novels. What these customizations have in common is that they do not require editing gui.rpy. These customizations change the GUI somewhat, but do not drastically change the look of the GUI. Change Size and Colors link The easiest thing to change about the GUI is to change the size and color of the GUI. Ren'Py will prompt you to make these choices when you first create a project, but choosing "Change/Update GUI" in the launcher will let you change your choice. When changing the GUI through the launcher, Ren'Py will prompt if you want to simply change the launcher, or update gui.rpy. Both choices will overwrite most image files, and overwriting gui.rpy will get rid of changes to that file. As a result, you probably want to do this before any other customization. Ren'Py will prompt for the default resolution of the project, and then also for the color scheme to use. Once you select those, it will update the GUI to match your choices. Options.rpy link There are a couple of variables in options.rpy that are used by the GUI. config.nameA string giving a human-readable name for the game. This is used as the window title, and throughout the GUI wherever the title of the game is needed. gui.show_nameThis should be set to False to hide the title and version number from the main menu. (Say, because the title is "baked into" the main menu image.) config.versionA string giving the version of the game. This is presented to the user in various places in the default GUI. It has other uses apart from that, such as error messages or tracebacks. gui.aboutAdditional text that is added to the about screen. If you want multiple paragraphs of credits, \n\n can be used to separate the paragraphs. Here's an example of these defines: define config.name = _('Old School High School') define gui.show_name = True define config.version = "1.0" define gui.about = _("Created by PyTom.\n\nHigh school backgrounds by Mugenjohncel.") For convenience, it might make sense to define gui.about using a triple-quoted string, in which case line endings are respected. define gui.about = _("""\ Created by PyTom. High school backgrounds by Mugenjohncel.""") Game and Main Menu Background Images link The images used by the GUI can be found in the game/gui directory, which can be opened by choosing "Open Directory: gui" from the launcher. The relevant files are: gui/main_menu.pngA file that contains an image that is used in the background of all screens of the main menu. gui/game_menu.pngA file that contains an image that is used in the background of all screens of the game menu. The main menu, with only gui/main_menu.png replaced. link The about screen can be part of the game menu (using gui/game_menu.png as the background) or the main menu (using gui/main_menu.png as the background). Both can be set to the same image. link Window Icon link The window icon is the icon that is displayed (in places like the Windows task bar and Macintosh dock) by a running application. The window icon can be changed by replacing gui/window_icon.png. Note that this only changes the icon used by the running game. To change the icon used by Windows .exe files and Macintosh applications, see the build documentation. Intermediate GUI Customization link Next, we will demonstrate the intermediate level of GUI customization. At the intermediate level, it's possible to change the colors, fonts, and images used by the game. In general, intermediate customization keeps the screens mostly the same, with buttons and bars in the same places, although modifying the screens to add new functionality is certainly possible. Many of these changes involve editing variables in gui.rpy. For example, to increase the dialogue font size, find the line that reads: define gui.text_size = 22 and increase or decrease it, for example, to: define gui.text_size = 20 Note that the default values are often different than what's found in this documentation. The default values can changed based on size and colors selected for the game, and the values in this file are an example of extensive GUI customization. It's best to search gui.rpy for define and the variable in question – for example, define gui.text_size. Some of the adjustments below either partially or completely effect image files. As a result, the changes only take effect when the image files themselves are updated, which can be done by choosing "Change GUI" in the launcher, and telling it to regenerate image files. (But note that doing so will overwrite any image files you have already modified.) You may want to consider waiting until your game is nearly complete before customizing gui.rpy in this way. While old gui.rpy files will work in newer Ren'Py versions, newer gui.rpy files may have features and fixes that older versions lack. Customizing the GUI early may make it harder to take advantage of such improvements. Dialogue link There are a number of relatively easy customizations that can be performed to change how dialogue is displayed to the player. The first is changing the textbox. gui/textbox.pngThis file contains the background of the text window, displayed as part of the say screen. While this should be the full width of the game, text is only displayed in the central 60% of the screen, with a 20% border on either side. In addition, there are a number of variables that can be customized to change dialogue. define gui.text_color = "#402000" link This sets the color of the dialogue text. define gui.text_font = "ArchitectsDaughter.ttf" link This sets the font that is used for dialogue text, menus, inputs, and other in-game text. The font file should exist in the game directory. define gui.text_size = 33 link Sets the size of the dialogue text. This may need to be increased or decreased to fit the selected font in the space allotted. define gui.name_text_size = 45 link Sets the size of character names. By default, the character name label uses the accent color. The color can be easily changed when defining a character: define e = Character("Eileen", who_color="#104010") An example textbox image. link Dialogue customized using the textbox image and the variable settings given above. link Choice Menus link The choice screen is used by the menu statement to display choices to the player. Again, there are some relatively easy customizations that can be performed on the choice screen. The first are the two image files: gui/button/choice_idle_background.pngThis image is used as the background of choice buttons that are not focused. gui/button/choice_hover_background.pngThis image is used as the background of choice buttons that are focused. By default, text is placed in the central 75% of these images. There are also a couple of variables that control the color of the text in choice buttons. define gui.choice_button_text_idle_color = '#888888' link The color used for the text of unfocused choice buttons. define gui.choice_button_text_hover_color = '#0066cc' link The color used for the text of focused choice buttons. These should suffice for simple customization, where the size of the images does not need to be changed. For more complex customizations, check out the section on buttons, below. An example gui/button/idle_background.png image. link An example gui/button/choice_hover_background.png image. link An example of the choice screen, as customized using the images and variable settings given above. link Overlay Images link There are also a pair of overlay images. These are used to darken or lighten the background image to make buttons and other user interface components more readable. These images are in the overlay directory: gui/overlay/main_menu.pngThe overlay used by the main menu screen. gui/overlay/game_menu.pngThe overlay used by game-menu-like screens, including load, save, preferences, about, help, etc. This overlay is selected by the screen in question, and is used even when at the main menu. gui/overlay/confirm.pngThe overlay used in the confirm screen to darken the background. Here are a pair of example overlay images, and what the game looks like with the overlay images added. An example gui/overlay/main_menu.png image. link An example gui/overlay/game_menu.png image. link The main menu after changing the overlays. link The game menu after changing the overlays. link Colors, Fonts, and Font Sizes link There are a number of GUI variables that can be used to change the color, font, and size of text. These variables should generally be set to hexadecimal color codes, which are are strings of the form "#rrggbb" (or "#rrggbbaa" to specify an alpha component), similar to color codes used by web browsers. For example, "#663399" is the code for a shade of purple. There are many tools online that let you create HTML color codes, such as this one.In addition to gui.text_color, gui.choice_idle_color, and gui.choice_hover_color, documented above, the following variables exist: define gui.accent_color = '#000060' link The accent color is used in many places in the GUI, including titles and labels. define gui.idle_color = '#606060' link The color used for most buttons when not focused or selected. define gui.idle_small_color = '#404040' link The color used for small text (like the date and name of a save slot, and quick menu buttons) when not hovered. This color often needs to be a bit lighter or darker than idle_color to compensate for the smaller size of the font. define gui.hover_color = '#3284d6' link The color used by focused items in the GUI, including the text of of buttons and the thumbs (movable areas) of sliders and scrollbars. define gui.selected_color = '#555555' link The color used by the text of selected buttons. (This takes priority over the hover and idle colors.) define gui.insensitive_color = '#8888887f' link The color used by the text of buttons that are insensitive to user input. (For example, the rollback button when no rollback is possible.) define gui.interface_text_color = '#404040' link The color used by static text in the game interface, such as text on the help and about screens. define gui.muted_color = '#6080d0' link define gui.hover_muted_color = '#8080f0' link Muted colors, used for the sections of bars, scrollbars, and sliders that do not represent the value or visible area. (These are only used when generating images, and will not take effect until images are regenerated in the launcher.) In additional to gui.text_font, the following variables selects the fonts used for text. These fonts should also be placed in the game directory. define gui.interface_text_font = "ArchitectsDaughter.ttf" link The font used for text for user interface elements, like the main and game menus, buttons, and so on. define gui.system_font = "DejaVuSans.ttf" link The font used for system text, like exception messages and the shift+A accessibility menu. This should be able to handle both ASCII and the game's translated language. define gui.glyph_font = "DejaVuSans.ttf" link A font used for certain glyphs, such as the arrow glyphs used by the skip indicator. DejaVuSans is a reasonable default for these glyphs, and is automatically included with every Ren'Py game. In addition to gui.text_size and gui.name_text_size, the following variables control text sizes. define gui.interface_text_size = 36 link The size of static text in the game's user interface, and the default size of button text in the game's interface. define gui.label_text_size = 45 link The size of section labels in the game's user interface. define gui.notify_text_size = 24 link The size of notification text. define gui.title_text_size = 75 link The size of the game's title. The game menu after customizing text colors, fonts, and sizes. link Borders link There are a number of GUI components – such as buttons and bars – that use scalable backgrounds configured using Border objects. Before discussing, how to customize buttons and bars, we'll first describe how this works. Borders are given to the Frame() displayable. A Frame takes an image, and divides it into nine parts – the four corners, the four sides, and the center. The corners always remain the same size, the left and right sides are stretched vertically, the top and bottom sides are stretched horizontally, and the center is stretched in both directions. A Borders object gives the size of each of the borders, in left, top, right, bottom order. So if the following border image is used: along with the following borders: Borders(40, 40, 40, 40) one possible result is this: As the child changes size, so will the background. A Border object can also be given padding, including negative padding that causes the child to overlap the borders. For example, these borders: Borders(40, 40, 40, 40, -20, -20, -20, -20) allow the child to overlap the sides. Note that due to this overlap, the result is smaller, since the borders themselves now take up less space. Borders can also be tiled, rather than scaled. This is invoked by variables, and produces this result. These example images are a bit ugly, since we need to show what's going on. In practice, this system can produce quite pleasing results. This is the case when a Frame displayable is used as the background of a frame window holding user interface components. These frame windows can be customized in two ways. The first is by changing the background image file: gui/frame.pngThe image used as the background of frames windows. And the second is by customizing variables. define gui.frame_borders = Borders(15, 15, 15, 15) link The borders applied to frame windows. define gui.confirm_frame_borders = Borders(60, 60, 60, 60) link The borders applied to the fame used in the confirm screen. define gui.frame_tile = True link If true, the sides and center of the confirm screen are tiled. If false, they are scaled. An example gui/frame.png image. link The confirm screen after applying the customizations given above. link Buttons link The Ren'Py user interface includes a large number of buttons, buttons that come in different sizes and that are used for different purposes. The various kinds of buttons are: buttonA basic button. Used for navigation within the user interface. choice_buttonA button used for choices in the in-game me'''
