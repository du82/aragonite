["http://www.renpy.org/doc/html/dialogue.html"]
title = "Dialogue and Narration — Ren'Py Documentation"
full_description = '''Dialogue and Narration link Text is fundamental to visual novels, and generally quite important to storytelling-based games. This text may consist of dialogue labeled with the character that is saying it, and narration, which does not have a speaker. (For convenience, we will lump both dialogue and narration together as dialogue, except where the differences are important.) It's also important that the user be able to customize the look of dialogue to suit their game. In Ren'Py, most dialogue is written using say statements. The look of dialogue may be customized on a per-character basis by using Character objects. Say Statement link The say statement is used for dialogue and narration. Since it's almost always the most frequently used statement in Ren'Py scripts, the say statement has a syntax that minimizes the overhead in writing it. Some example say statements are: "This is narration." "Eileen" "This is dialogue, with an explicit character name." e "This is dialogue, using a character object instead." "Bam!!" with vpunch The first form of the say statement consists of a string by itself. This form is used for narration, with the narration being the contents of the string. The second form consists of two strings. The first string is the name of the character who is speaking, and the second is the dialogue being spoken. The third form consists of a simple expression followed by a string. The simple expression should evaluate to either a string giving a character name, or a Character object. In the latter case, the character object is used to control how the dialogue is shown. The final form consists of a string and a with clause which has a transition. In this case, the string is shown and a screen is shaken at the same time. Although the precise details of what a say statement does is controlled by the character object used, the usual effect of a say statement is to display dialogue on the screen until the user clicks to dismiss it, then to remove that dialogue on the screen. Certain characters have special meaning to Ren'Py, and so can't be used in dialogue strings. The { character begins a text tag, and the [ character begins a substitution. To use them in dialogue, double them. It may also be necessary to precede a quote with a backslash to prevent it from closing the string. For example: "I walked past a sign saying, \"Let's give it 100%%!\"" It's also possible to use a proxy function instead of a character object. More details about this in this section. Defining Character Objects link By creating a Character object and using it in a say statement, you can customize the look (and to some extent, the behavior) of dialogue. Characters are created by using the define statement to assign a Character to a variable. For example: define e = Character("Eileen", who_color="#c8ffc8") Once this is done, the character can be used in a say statement: e "Hello, world." Character is a Python function that takes a large number of keyword arguments. These keyword arguments control the behavior of the character. Character(name=..., kind=adv, **args) link Creates and returns a Character object, which controls the look and feel of dialogue and narration. nameIf a string, the name of the character for dialogue. When name is None, display of the name is omitted, as for narration. If no name is given, the name is taken from kind, and otherwise defaults to None. kindThe Character to base this Character off of. When used, the default value of any argument not supplied to this Character is the value of that argument supplied to kind. This can be used to define a template character, and then copy that character with changes. This can also be a namespace, in which case the 'character' variable in the namespace is used as the kind. Linked Image. An image tag may be associated with a Character. This allows a say statement involving this character to display an image with the tag, and also allows Ren'Py to automatically select a side image to show when this character speaks. imageA string giving the image tag that is linked with this character. Voice Tag. If a voice tag is assign to a Character, the voice files that are associated with it, can be muted or played in the preference screen. voice_tagA String that enables the voice file associated with the Character to be muted or played in the 'voice' channel. Prefixes and Suffixes. These allow a prefix and suffix to be applied to the name of the character, and to the text being shown. This can be used, for example, to add quotes before and after each line of dialogue. what_prefixA string that is prepended to the dialogue being spoken before it is shown. what_suffixA string that is appended to the dialogue being spoken before it is shown. who_prefixA string that is prepended to the name of the character before it is shown. who_suffixA string that is appended to the name of the character before it is shown. Changing Name Display. These options help to control the display of the name. dynamicIf true, then name should either be a string containing a Python expression, a function, or a callable object. If it's a string, That string will be evaluated before each line of dialogue, and the result used as the name of the character. Otherwise, the function or callable object will be called with no arguments before each line of dialogue, and the return value of the call will be used as the name of the character. Controlling Interactions. These options control if the dialogue is displayed, if an interaction occurs, and the mode that is entered upon display. conditionIf given, this should be a string containing a Python expression. If the expression is false, the dialogue does not occur, as if the say statement did not happen. interactIf true, the default, an interaction occurs whenever the dialogue is shown. If false, an interaction will not occur, and additional elements can be added to the screen. advanceIf true, the default, the player can click to advance through the statement, and other means of advancing (such as skip and auto-forward mode) will also work. If false, the player will be unable to move past the say statement unless an alternate means (such as a jump hyperlink or screen) is provided. callbackA function that is called when events occur while the character is speaking. See the section on Character Callbacks for more information. Click-to-continue. A click-to-continue indicator is displayed once all the text has finished displaying, to prompt the user to advance. ctcA displayable to use as the click-to-continue indicator, unless a more specific indicator is used. ctc_pauseA displayable to use a the click-to-continue indicator when the display of text is paused by the {p} or {w} text tags. ctc_timedpauseA displayable to use a the click-to-continue indicator when the display of text is paused by the {p=} or {w=} text tags. When None, this takes its default from ctc_pause, use Null() when you want a ctc_pause but no ctc_timedpause. ctc_positionControls the location of the click-to-continue indicator. If "nestled", the indicator is displayed as part of the text being shown, immediately after the last character. "nestled-close" is similar, except a break is not allowed between the text and the CTC indicator. If "fixed", a new screen containing the CTC indicator is shown, and the position style properties of the CTC displayable are used to position the CTC indicator. Screens. The display of dialogue uses a screen. These arguments allow you to select that screen, and to provide arguments to it. screenThe name of the screen that is used to display the dialogue. retainIf not true, an unused tag is generated for each line of dialogue, and the screens are shown non-transiently. Call renpy.clear_retain() to remove all retaint screens. This is almost always used with Speech Bubbles. Keyword arguments beginning with show_ have the prefix stripped off, and are passed to the screen as arguments. For example, the value of show_myflag will become the value of the myflag variable in the screen. (The myflag variable isn't used by default, but can be used by a custom say screen.) One show variable is, for historical reasons, handled by Ren'Py itself: show_layerIf given, this should be a string giving the name of the layer to show the say screen on. Styling Text and Windows. Keyword arguments beginning with who_, what_, and window_ have their prefix stripped, and are used to style the character name, the spoken text, and the window containing both, respectively. For example, if a character is given the keyword argument who_color="#c8ffc8", the color of the character's name is changed, in this case to green. window_background="frame.png" sets the background of the window containing this character's dialogue. The style applied to the character name, spoken text, and window can also be set this way, using the who_style, what_style, and window_style arguments, respectively. Setting config.character_id_prefixes makes it possible to style other displayables as well. For example, when the default GUI is used, styles prefixed with namebox_ are used to style the name of the speaking character. Say with Image Attributes link When a character is defined with an associated image tag, say statement involving that character may have image attributes placed between the character name and the second string. In this form, if an image with the given tag is showing, Ren'Py will issue a show command involving the character tag and the attributes. If the image is not shown, Ren'Py will store the attributes for use by side images, but will not show an image. For example: define e = Character("Eileen", image="eileen") label start: show eileen concerned e "I'm a little upset at you." e happy "But it's just a passing thing." is equivalent to: define e = Character("Eileen") label start: show eileen concerned e "I'm a little upset at you." show eileen happy e "But it's just a passing thing." In the above example, the concerned and happy replace one another. But it is possible to revert to a happy-less eileen without specifying the concerned attribute. An attribute name prepended with the minus sign ( - ) has that effect, just as it does with the show statement. For example: define e = Character("Eileen") label start: show eileen e concerned "I'm a little upset at you." e happy "That's funny." e -happy "I'm not sure what to think now." When an @ is included in the list of attributes, any element placed after it has an only temporary effect, and is reverted at the end of the line of dialogue. For example, the following code is equivalent to the previous example: define e = Character("Eileen", image="eileen") label start: show eileen concerned e "I'm a little upset at you." e @ happy "That's funny." e "I'm not sure what to think now." A single line can combine permanent changes coming before the @, and temporary ones coming after. e happy @ vhappy "Really! That changes everything." The minus sign can also be used after the @ sign: e @ right -concerned "My anger is temporarily suspended..." e "HOWEVER !" To cause a transition to occur whenever the images are changed in this way, set config.say_attribute_transition to a transition. For more control, use config.say_attribute_transition_callback. Example Characters link Here are a few example characters: # A character that has its dialogue enclosed in parenthesis. define e = Character("Eileen", what_prefix='(', what_suffix=')') # A character that pulls its name from a variable. define p = Character("player_name", dynamic=True) Special Characters link A few character names are defined by default, and are used automatically in certain situations. Intentionally redefining these characters can change the behavior of Ren'Py, but accidentally using them can be a problem. advThe default kind of character used by Character. This sets up a character such that one line is displayed on the screen at a time. nvlA kind of Character that causes dialogue to be displayed in NVL-Mode Tutorial, with multiple lines of text on the screen at once. narratorThe character that's used to display narration, by say statements without a character name. name_onlyA character that is used for dialogue in which the character name is given as a string. This character is copied to a new character with the given name, and then that new character is used to display the dialogue. centeredA character that causes what it says to be displayed centered, in the middle of the screen, outside of any window. vcenteredA character that causes what it says to be displayed centered in vertically oriented text, in the middle of the screen, outside of any window. extendA character that causes the last character to speak to say a line of dialogue consisting of the last line of dialogue spoken, "{fast}", and the dialogue given to extend. This can be used to have the screen change over the course of dialogue. Extend is aware of NVL-mode and treats it correctly. Extend does not work properly if the language preference changes between the initial say and the extend. For example: # Show the first line of dialogue, wait for a click, change expression, and show # the rest. show eileen concerned e "Sometimes, I feel sad." show eileen happy extend " But I usually quickly get over it!" # Similar, but automatically changes the expression when the first line is finished # showing. This only makes sense when the user doesn't have text speed set all the # way up. show eileen concerned e "Sometimes, I feel sad.{nw}" show eileen happy extend " But I usually quickly get over it!" Dialogue Window Management link Ren'Py includes several statements that allow for management of the dialogue window. As dialogue window is always shown during dialogue, these statements control the presence or absence of the window during non-dialogue interactions. window showThe window show statement causes the window to be shown. It takes as an argument an optional transition, which is used to show the window. If the transition is omitted, config.window_show_transition is used. window hideThe window hide statement causes the window to be hidden. It takes as an argument an optional transition, which is used to hide the window. If the transition is omitted, config.window_hide_transition is used. window auto TrueThis enables automatic management of the window. The window is shown before statements listed in config.window_auto_show – by default, say statements. The window is hidden before statements listed in config.window_auto_hide – by default, scene and call screen statements, and menu statements without a caption. Only statements are considered, not statement equivalent functions. window auto FalseThis disables automatic management of the window. The window is not shown or hidden automatically. The window auto statement uses config.window_show_transition and config.window_hide_transition to show and hide the window, respectively. window auto is cancelled by window show and win'''
year_published = 2025
