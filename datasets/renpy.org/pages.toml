["http://www.renpy.org/doc/html/incompatible.html"]
title = "Incompatible Changes — Ren'Py Documentation"
full_description = '''Incompatible Changes link This is a list of changes that may require intervention in the form of changes to scripts or your development environment. Our intent is that all other changes should not affect existing scripts. Note that setting config.script_version will cause many of these changes to be reverted, at the cost of losing access to recent features. Incompatible changes to the GUI are documented at Incompatible GUI Changes, as such changes only take effect when the GUI is regenerated. Pending Deprecations link Ren'Py 7.8 is the last release to support Python 2. Ren'Py 8.4 will drop support for the original OpenGL renderer (gl1), and for Windows 7, 8, and 8.1. 8.3.4 / 7.8.4 link Dissolving Different-Sized Displayables, part two. When ImageDissolving or AlphaDissolving between displayables of different sizes, Ren'Py will give the result the size of the largest displayable, in each access. To revert to the pre-8.1.2 behavior (the smallest size on each axis), add to your game: define config.dissolve_shrinks = True Removal of the ATL 'update' event. Previous versions of Ren'Py could deliver and "update" event to ATL inside screens when the screen was changed in major ways, such as when changing translations. This event was not delivered reliably, and is unlikely to have been used, so it has been removed. 8.3.0 / 7.8.0 link Box_reverse and Box_align The box_reverse property now no longer adjusts the box alignment. To adjust the box alignment, set the box_align property to 1.0, or use: define config.box_reverse_align = true To get the 8.2 behavior. Retained speech bubbles are now automatically cleared away when other say, menu, or call screen statements are invoked. This is controlled by the bubble.clear_retain_statements variable. To disable this, add to your game: define bubble.clear_retain_statements = [ ] How ATL sets the child from parameters The rules as for how and when ATL transforms get their child set, based upon the parameters they accept and the arguments they are passed, has slightly changed. It is unlikely to have any impact on existing games, especially if you were only using documented features. The old_widget parameter taking a value from a positional argument does not set the child anymore. That was an undocumented misuse of ATL Transitions. transform t(old_widget): ... t("eileen") # will no longer have a child set to the "eileen" image A child keyword argument being passed to a transform having a child parameter now sets the child, just as it would in a transform with no child parameter, or if the child parameter got a value from a positional argument. The documentation was ambiguous about this. transform t1(child): ... transform t2(delay=1.0): ... t1(child="eileen happy") # will now have a child set to the "eileen happy" image, but previously didn't. t2(child="eileen happy") # the child is set, as before. t1("eileen happy") # the child is set, as before. Character Callbacks have been changed to take a large number of additional arguments, as documented at Character Callbacks. This should not require changes as character callbacks should have been written to ignore unknown keyword arguments, but if not the character callbacks may need to be updated. Window Statement The window show annd window hide statements no longer disable the window auto flag. If you'd like to do this, then either use the new window auto False statement, or change your game to include: define config.window_functions_set_auto = True When a window show occurs after window hide, Ren'Py will look forward to the next say statement to determine the type of thr window to show. Previously, it looked back to the last say statement. To revert this change, include: define config.window_next = False String Munging Munging of names beginning with __ but not containing a second instance of __ will now occur inside a string just like it does in the rest of a script. What this means is that: $ __foo = 1 "Add one and __foo and you get [1 + __foo]." will be rewritten to: $ _m1_script__foo = 1 "Add one and _m1_script__foo and you get [1 + _m1_script__foo]." To disable this, in a file named 01nomunge.rpy in your game directory, write: define config.munge_in_strings = False Cropping Outside the Bounds of a Displayable The behavior of cropping a displayable with a box larger than the displayable has changed. As of this release, values passed to Crop(), crop, corner1 and corner2 are not bound by the original boundaries of the displayable. In 8.2.x and 7.7.x releases of Ren'Py, the behavior was to crop the right/bottom of the displayable, but unconstrain the left/top. This behavior can be restored by adding to your game: define config.limit_transform_crop = True Before 8.2 and 7.7, the behavior was to crop the right/bottom of the displayable if the value was a float, and leave left/top unconstrained. This behavior can be restored by adding to your game: define config.limit_transform_crop = "only_float" 8.2.2 / 7.7.2 link Fill and Frames In certain cases in 8.2.1 and earlier, the xfill and yfill style properties could cause Frames, Windows, and Buttons to shrink in size. Now, only expansion in size is allowed. To revert this, add: define config.fill_shrinks_frame = True 8.2.1 / 7.7.1 link *Vertical Text Vertical text had been improved in the harfbuzz shaper, with the text now being rendered in the correct place. This may cause position changes, but since the previous version was wildly incorrect, no compatibility define is provided. 8.2.0 / 7.7.0 link Stringified annotations and the aborted future of PEP 563 Since Ren'Py version 8.0.2, Python code in Ren'Py 8 was always compiled using the from __future__ import annotations directive, with no possible opt-out for creators. Given that this change will most likely not be implemented by default in future versions of Python, we rolled that change back. In order to keep using the annotations future for stringified annotations, you can add the following line at the top of your files: rpy python annotations Text Changes Ren'Py uses harfbuzz for shaping, which may produce different glyphs than would have been produced differently, and may change the spacing of text. The positioning of vertical text has also been changed by harfbuzz rendering. To revert this changes, include in your game: style default: shaper "freetype" Ren'Py will automatically use an Emoji font when required. To disable this, add: style default: emoji_font None Interpolation Changes Interpolations in strings are now treated as Python expressions, this results in mostly equivelent behaviour when interpreting fields except when item getters are in use. For example: # Previously e "[player[money]]" #=> player['money'] # But now e "[player[money]]" #=> player[money] To revert this behaviour, add the following to your game: define config.interpolate_exprs = False To help other developers work while you're migrating your game to the new behavior, there is a fallback mode that will first try the new behavior, and then fall back to the old behavior if the new behavior fails. To enable this, add the following to your game: define config.interpolate_exprs = "fallback" Polar Coordinate Changes Ren'Py now enforces that the angles given to the angle and anchorangle properties are in the range 0 to 360 degrees, inclusive of 0 but not of 360. Previously, angles outside this range gave undefined behavior, now the angles will be clamped to this range. A 360 degree change will no longer cause motion, but will instead be treated as a 0 degree change. When animating angle and anchorangle with ATL, if a direction is not supplied, the shortest arc will be used, even if it passes through 0. There is not a compatibility define for these changes, as they are unlikely to affect the visible behavior of games in practice. Empty ATL Blocks Forbidden Previously, Ren'Py would allow an empty ATL block. Now it will report that a block is required. You'll need to change: show eileen happy: "..." to: show eileen happy "..." In the unlikely case that you have an empty ATL block. Box Reverse The box_reverse style property has changed its behavior in two ways: Space is offered to displayables in the order the displayables are presented in the screen, where previously the space was offered in reverse order when box_reverse was enabled. This can change the sizes of some displayables. A hbox that has box_wrap set will wrap from top to bottom, rather than bottom to top. A vbox with box_wrap set will wrap from left to right, rather than right to left. The goal of these changes is to make the behavior of box_reverse more useful for laying out interfaces in right-to-left languages. To revert these changes, add to your game: define config.simple_box_reverse = True build.itch_channels That variable was always documented as a dict but was mistakenly implemented as a list of tuples. It's now truly a dict. If you were using list operations on it, you'll need to change your code: # formerly $ build.itch_channels.append(("pattern", "channel")) $ build.itch_channels.extend([("pattern", "channel")]) define build.itch_channels += [("pattern", "channel")] # now $ build.itch_channels["pattern"] = "channel" $ build.itch_channels.update({"pattern": "channel"}) define build.itch_channels["pattern"] = "channel" define build.itch_channels |= {"pattern": "channel"} New position type The new position() type has been added to the list of position types. As a result, it can be returned by the renpy.get_placement() function at any time, even in cases when it previously returned another type or if you don't use the new type anywhere in your game. To prevent this, add to your game: define config.mixed_position = False Drag Group Add Changes Adding a displayable to a DragGroup now adds it above the other displayables in the group, rather than below them. To change this, add to your game: define config.drag_group_add_top = False Translate Statements and config.statement_callbacks Translate statements (including internal statements that Ren'Py automatically generates) will no longer cause config.statement_callbacks to be called. Transitions Use Child Placements If the child of a transitions provides placement information, that will be used by the transition itself. This only makes sense when the transition is used by an ATL transition, and both the old and new children provide the same placement information. To disable this, add to your game: define config.transitions_use_child_placement = False Containers Pass Transform Events Containers (including fixed, hbox, vbox, side, grid, viewport, and vpgrid) now pass some transform events (hover, idle, insensitive, selected_hover, and selected_idle) to their children, meaning that children of a button can have their own transforms to respond to those events. To disable this, add to your game: define config.containers_pass_transform_events = set() Say Screens Are Supplied the Replace Event. Say screens are now supplied the "replace" (rather than "show") transform event for the second and subsequent pauses. To disable this, add to your game: define config.say_replace_event = False Re-showing A Screen No Longer Cancels a Hide Event Previously, if a screen was hidden and re-shown, a hide or replace transform event associated with the same screen would be cancelled, and the hiding or replaced screen would instantly disappear. Now, the event will be allowed to run to completion. To disable this, add to your game: define config.screens_never_cancel_hide = False 8.1.2 / 7.6.2 link Dissolving Different-Sized Displayables When dissolving between two displayables of different sizes, Ren'Py will give the result the size of the largest displayable, in each access. To revert to the previous behavior (the smallest size on each axis), add to your game: define config.dissolve_shrinks = True 8.1.1 / 7.6.1 link Android Key Migration We've received reports of games uploaded to the Google Play as bundles having their APKs rejected for having different keys. This was caused by an old release of Ren'Py that used the APK key for bundles. In the Play Console, this produced an error message like: You uploaded an APK that is not signed with the upload certificate. You must use the same certificate. The upload certificate has fingerprint: SHA1: ... and the certificate used to sign the APK you uploaded has fingerprint: SHA1: ... While this can be cause by other problems (like simply using entirely incorrect keys), one potential fix is: In your project's base directory, rename bundle.keystore to bundle.keystore.bak. In your project's base directory, copy android.keystore to bundle.keystore. Then rebuild and re-upload your bundle. 8.1.0 / 7.6.0 link Conflicting properties The former default input screen, which may have found its way into your game, contains conflicting style properties. The fix for that is as follows: +define config.check_conflicting_properties = True screen input(prompt): style_prefix "input" window: vbox: - xalign gui.dialogue_text_xalign + xanchor gui.dialogue_text_xalign xpos gui.dialogue_xpos xsize gui.dialogue_width ypos gui.dialogue_ypos text prompt style "input_prompt" input id "input" Speech Bubbles Adding bubble support to an existing game requires adding files and script to the game. The Speech Bubbles documentation includes the required changes. Live2D Ren'Py now requires Live2D Cubism 4 SDK for Native R6_2 or later. It may refuse to run if an older version is used. Texture Memory Ren'Py now accounts for texture memory more precisely. In general, games can raise config.image_cache_size_mb by 33%, and use the same amount of memory. Audio Fadeout When audio is stopped or changed using play, there is now a default fadeout of 0.016 seconds, to prevent pops. This is controlled by the config.fadeout_audio variable. To disable the fadeout: define config.fadeout_audio = 0.0 Fading is now logarithmic, which sounds smoother to the human ear as it matches the way ears perceive sound. To revert to the old linear fades: define config.linear_fades = True Translate None Ren'Py will now produce an error when encountering an explicit translate None statement that does not translate strings, styles, or python. These should be rare, in practice. The recommended change is to replace: translate None start_abcd1234: e "This is a test" with: e "This is a test" id start_abcd1234 This change can also be reverted with: define config.check_translate_none = False Keymap The keymap has changed substantially, which means that if your game changes the default keymap - usually a bad idea - it will need to be updated to reflect the new keysyms. File Search Ren'Py will now only look for image files in game/images, rather than all files. To look for all files in game/images, use: define config.search_prefixes += [ "images/" ] The paths that are searched consider the purpose of the file, rather than the type or extensions. So renpy.loadable("dlc.jpg") won't look for game/images/dlc.jpg. If you'd lik'''
