["https://renpy.org"]
title = "The Ren'Py Visual Novel Engine"
full_description = '''What is Ren'Py? Ren'Py is a visual novel engine – used by thousands of creators from around the world – that helps you use words, images, and sounds to tell interactive stories that run on computers and mobile devices. These can be both visual novels and life simulation games. The easy to learn script language allows anyone to efficiently write large visual novels, while its Python scripting is enough for complex simulation games. Ren'Py is open source and free for commercial use. Why Ren'Py? Where does it run? Android 5.0+ HTML5/Web Assembly (Beta) Linux x86_64/Arm Windows 7+ Mac OS X 10.10+ iOS 11+ Where do I get it? The latest official release of Ren'Py 8 is 8.3.4 "Second Star to the Right", released on December 8, 2024. Ren'Py 8 is recommended for all projects. The nightly fix version of Ren'Py is built every night, and contains fixes to the latest stable version. It isn't tested as well as the official release, but often has fixes that haven't made it through the release process. Download Ren'Py 8.3.4 Download Ren'Py 8 Nightly Fix Ren'Py 7 is the legacy version of Ren'Py, to support ongoing projects that will be released in 2024. The latest version of Ren'Py 7 is 7.8.4 "Straight on Till Morning", released on December 8, 2024. Download Ren'Py 7.8.4 Where do I start? The quickstart walks you through the process of creating a simple game. Ren'Py comes with a comprehensive, if complex, reference manual, also available in Japanese, Simplified Chinese, and Traditional Chinese. If you think you've found a bug in Ren'Py, report it to our GitHub issue tracker. If you'd like to contribute to Ren'Py development, please visit our GitHub project page. How do I keep in touch? The best places to ask questions about Ren'Py are the Lemma Soft Forums, the Ren'Py Discord, and the #renpy IRC channel. We make news about Ren'Py available on a number of social platforms: Twitter: You can follow Ren'Py's lead developer @renpytom for release announcements, development news, and general commentary on life. Facebook: We announce new releases on our Facebook page. Who is it sponsored by? Brad Whitesell (EchoFrost) Chekhov's Ghost Estate : Dominate David Yingling JeongPyo Lee a friendly pigeon Cherry Kiss Games Little Napoleon ... and 870 more sponsors. Become a Sponsor! To ask questions that aren't appropriate for a public forum, or to find a speaker for your visual novel-related conference or con, please contact us via email. Featured Games Ren'Py has been used to create over 4,000 visual novels, games, and other works. You can find Ren'Py visual novels at the Visual Novel Database, and games made with Ren'Py on Itch.io and Steam. Here are just a few of the games made with Ren'Py. Highway Blossoms, the tale of two girls' epic road trip through the American southwest. King of the Cul-De-Sac makes great uses of Ren'Py's animation language and interactivity. SC2VN, set in the South Korean professional StarCraft 2 gaming scene. Over the Hills and Far Away the story of a redcoat and a Shawnee girl, on the run through the colonial-era Northwest Territory. The Still Dancer tells the story of a family heirloom trying to regain her memory.'''
