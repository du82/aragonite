title = "Changelog (Ren'Py 6.11 - 6.99) — Ren'Py Documentation"
full_description = '''Changelog (Ren'Py 6.11 - 6.99) link 6.99.14.3 link Changes link The AlphaMask() displayable now places its mask inside the child displayable, in the same way that AlphaDissolve always has. This allows the mask to be created using ATL or other transforms. Several obsolete image manipulators have been deprecated, and removed from the documentation. These are image manipulators that have been completely replaced by Transform(). Several functions have been renamed, to remove a pointless Live prefix. LiveComposite is now Composite() LiveCrop is now Crop() LiveTile is now Tile() The old names have been retained as compatibility alias. Fixes link This release fixes an issue where children of for statements in screens would not get their data propagated through screen update cycles. This manifested in complicated ways, such as transitions repeating and slow text refusing to work. This release displays the newest save slot in the selected color, as intended. This applies to newly created games, older projects can update by adding to the bottom of gui.rpy: define gui.slot_button_text_selected_idle_color = gui.selected_color define gui.slot_button_text_selected_hover_color = gui.hover_color A problem introduced in 6.99.14.2 with the default statement not working after a rollback has been fixed. This should only ever have affected games that were updated after a save was first created. 6.99.14.2 link Features and Changes link The Atom text editor is now supported in Ren'Py. When it is selected, Ren'Py will download Atom, and will create a new profile with the language-renpy, renpy-dark-syntax, and renpy-light-syntax Atom plugins installed, along with a few default setting to make Ren'Py programming easier. It is now possible to supply a baseline to image-based fonts. When a screen in the default gui scrolls, the pageup and pagedown keys will now work to scroll it. (This only works with newly-created projects.) The Movie() displayable now takes a play_callback argument, which specifies a function that is called to play a movie. This function can do things like queue up a transition movie before queuing the usual loop, making for smooth transitions. The new renpy.get_say_image_tag() function makes it possible to retrieve the name of the speaking character. ATL interpolation can now interpolate from a transform with multiple lines in it, provided none of the lines takes time to complete. Adding the from statement to a call no longer changes the translation identifier. (Which is also used by the automatic voice code.) Since this would be a breaking change, Ren'Py also computes the old-style translation identifier and uses that if it exists. The _choose_attributes method is called when only a single displayable can be located. This supports the AttributeImage beta (https://github.com/renpy/ai). The new gui.button_image_extension variable allows button images to be .webps without changing Ren'Py itself. Self-Voicing link Ren'Py's self-voicing mode, which provides accessibility for blind users, has been improved: Selected buttons say the word "selected" after them. Bars say the world "bar" after them. Some actions have had their self-voicing information changed to better reflect how the action is used in the new GUI. Alt text built into Ren'Py can be translated. While this can change some of the self-voicing output, the changes should not affect any translations that already exist. Fixes link An issue where a save or auto-save could rarely cause data corruption in the non-saved game has been fixed. Python hide statements are now run in a Python function context, which makes certain constructs (like generator expressions) compile and run correctly. Global labels now behave as described in the documentation, even when indented. A regression with custom mouse cursors that could cause the mouse to jump around wildly has been fixed. An issue with side images persisting after a menu was shown has been fixed. Ren'Py no longer stores the state of displayables that are not being shown in a screen that has been replaced. (This was an issue when the first screen is re-show, and the displayables took their old state.) The show and replace events are now always delivered to a transform in a screen. While this behavior was always intended and could occur whenever a screen was shown, previously caching could prevent some show events from being delivered. Characters that require the alt key can be typed. (The alt key is necessary to type particular characters in European languages.) When the Android build system fails to rename a file or directory, it will retry for 60 seconds before giving up. This is an attempt to work around antivirus software breaking Windows semantics. 6.99.14.1 link Image Prediction and Caching link Ren'Py now searches for the bounding box of non-transparent pixels when converting an image into a texture. When the config.optimize_texture_bounds variable is true (as it is by default), only the non-transparent pixels are stored in the image cache. This can massively reduce the in-memory size of certain images, such as images that correspond to mostly-transparent layers. The config.cache_surfaces variable is now False by default. This halves the amount of memory required for the image cache, but may slow down multiple image manipulators applied to the same image. The size of the image cache is now controlled by the config.image_cache_size_mb variable, which defaults to 300 megabytes. With the new default settings, each pixel inside the images non-transparent bounding box takes up 4 bytes of memory. The result of these three changes is that images take up less memory in cache, meaning Ren'Py can store far more predicted images. Ren'Py now refuses to call functions that read from disk (such as renpy.image_size()) when predicting images and screens, rather than risking these slow calls leading to drops in framerate. The ConditionSwitch() and ShowingSwitch() displayables have a new predict_all parameter. When True, this causes all displayables to be predicted, not just the currently selected one. This could be used to have Ren'Py preload all emotions of a sprite. The renpy.start_predict() and renpy.stop_predict() functions now take wildcard patterns. For example: $ renpy.start_predict("eileen *") Starts predicting all images beginning with the tag eileen, while: $ renpy.start_predict("* beach*") matches all images that include a beach attribute. The F4 key now displays the image load log. Other Improvements link Transforms now have a new maxsize property, which scales images down until they fit into a bounding box. The Python expression cache is kept when Ren'Py is reloaded, providing a slight increase in performance compared to unmarshalling it on each reload. The traceback.txt and errors.txt files now include a date at the bottom, making it easier to determine if a file is stale. The new renpy.list_images() function returns a list of all the images that have been defined. Drag displayables now take the mouse_drop property. When true, this causes the location of the mouse pointer to be used to select a drag to drop on, rather than the drag with the maximum overlap. The Spanish translation has been updated. Other Fixes link Fixes a bug where the ATL "on hide" clause didn't work. Release the GIL when waiting for a screen flip, making tasks that run in background threads (music playback, image preloading, autosave, etc.) run much faster. Ren'Py 6.99.14 link Performance link Quite a bit of work has been done to improve performance, both absolute performance and apparent framerate stability. When connected to a device with AC power, Ren'Py will attempt to draw the screen at a constant framerate. When the device is on battery, several frame will be drawn before reverting to the 5fps framerate, to ensure updates to the screen are pushed through display buffering. Ren'Py has a number of options that control display performance, accessed through the Shift+G menu. In addition to the GL performance change described above, this allows the player to lock the framerate and accept tearing when a frame is late. A player on a slow machine might choose to prefer 30fps to an unstable framerate. If the developer expects many players will be on slow devices, a default can be chosen with: default preferences.gl_framerate = 30 When a frame takes too long to render (say, because an unpredicted image has to be loaded from disk), Ren'Py will attempt to use the time the frame was presented as the base time for transitions and displayables. Effectively, this means that if Ren'Py has to skip frames, it'll skip them before the first frame in a sequence, rather than between the first and second frame. Ren'Py itself triggers garbage collection immediately after a frame is drawn, if enough objects have been created. Outside of this collection, the number of objects required to trigger the garbage collector has been raised. The thresholds are high enough that collection should not be required if the game does not create circular object references. (That is, objects that refer to each other in a loop.) Ren'Py has been changed to eliminate common sources of circular object references. For most games, Ren'Py managed garbage collection should reduce or even eliminate frame drops caused by the garbage collector. However, it is possible to revert to the previous tuning by setting config.manage_gc to False. By default, Ren'Py will remove transient screens (like say and choice) and displayables without triggering on "hide" event handlers. The process of checking for such handlers was relatively expensive, while the use of those handlers is rare. This change can be reverted by setting config.zap_transients to False. Ren'Py will now cache compiled Python expressions the first time it encounters them, rather than compiling an expression each time it is encountered. This speeds up the overused ConditionSwitch displayable, along with other parts of Ren'Py. Because of this change, a game will open slowly the first time it's run under Ren'Py 6.99.14, as all of the expressions need to be compiled. This release both increases the speed of maintaining the information required by rollback, and does so less often. This may be visible to players by Ren'Py now allowing them to roll back farther than before. There have also been many other performance improvements that will only be visible by the increased speed. This release just includes the first round of performance improvements, while a new performance profiling framework included will allow Ren'Py developers to further improve things. Multiple Character Dialogue link Ren'Py now includes a system that allows multiple characters to speak dialogue at the same time. It's accessed by giving the multiple argument to consecutive say statements. For example: e "Ren'Py now supports multiple character dialogue." (multiple=2) l "About time! I've been wanting this for years!" (multiple=2) As there is more than one way to show dialogue from multiple characters (side-by-side? top-and-bottom? one or two textboxes?), Ren'Py doesn't include support for this out of the box yet. Please see the Multiple Character Dialogue section of the documentation for the styles you'll need to define. GUI Preferences link Ren'Py supports a new GUI preference system that replaces the old style preference system, as it allows preferences to apply to variables in the new GUI that can be referenced from multiple styles. This makes it possible to write: define gui.text_font = gui.preference("font", "DejaVuSans.ttf") To access the preference, and: vbox: style_prefix "radio" label _("Font") textbutton _("DejaVu") action gui.SetPreference("font", "DejaVuSans.ttf") textbutton _("Dyslexic") action gui.SetPreference("font", "OpenDyslexic-Regular.otf") to set it. See the section on GUI Preferences for more details. Tooltips link A new tooltip system has been added to Ren'Py, to replaced the one that already existed. While in the previous system, one had to write: default tt = Tooltip("No button selected.") textbutton "One.": action Return(1) hovered tt.Action("The loneliest number.") text tt.value It's now possible to write: textbutton "One.": action Return(1) tooltip "The loneliest number." text GetTooltip() This is intended to save boilerplate and make screens more readable. For more information, see the Tooltips section. Changes link SSL and TLS support has been added to all platforms. This allows Ren'Py games to make requests to secure web servers, perhaps in conjunction with a Python library such as requests. This support is only included in built distributions if imported at init time. The new im.Data() image manipulator creates an image from compressed binary data, as might be downloaded from a web server. The config.loadable_callback lets scripts inform Ren'Py about additional loadable files. Ren'Py will attempt to diagnose problems with pickling objects during a save, and report an object that caused a pickling problem. (This is best-effort, but tends to catch common problems.) When a viewport is given scrollbars, Ren'Py will now offer its child a large amount of space in the given direction. This prevents problems with displayables drawn at or below the visible area of a viewport. Ren'Py now resolves the ambiguity between the xpos and xalign style properties in favor of xpos, and similarly for other cases where both more and less specific style properties are given to the same style. Custom statements now take a label function that can return a custom label for the statement. This allows the custom statements to be jumped to or called. The new config.gl_clear_color variable allows a creator to set the color of the letterboxes and pillarboxes used when the screen is not filled. Drag displayables (part of the drag and drop system) now support a bottom method, that can be used to lower the drag to the bottom of its drg group. The config.cache_surfaces variable, added in the last release, has been documented. Setting this variable to False can reduce Ren'Py's memory consumption, at the cost of of slowing down images used by multiple image manipulators. (Which should be a rare case in modern Ren'Py.) Variable and field munging (which change the name of a variable that begins with __ to a file-specific value) now work inside string substitutions. Viewports and vpgrids now support the pagekeys property, which allows one to use the pageup and pagedown keys to scroll the viewport. The arrowkeys property is now documented. RAPT now compiles Java code using a source and target version of 1.6, which allows it to be built on modern JDKs. Fixes link An issue where screens could display incorrectly when compiled at different times has been fixed. This could only show up under certain circumstances. The project has screens in multiple files. The files were compiled at different times. (This can never be the case for a released game, since all files are recompiled at the same time'''
