["https://repl.it/careers"]
title = "Careers - Replit"
description = "We are always looking for new talent and welcome individuals of all levels of experience, from interns to full-time employees."
full_description = "Careers RepWe’re on a mission to empower the next billion software developers. Join us!See open positionsReplit has raised over $200 million in funding, with our most recent round valuing us at $1.16 billion. We're using the new funds to enhance the core development experience, expand cloud services for developers, optimize for enterprise and core engineering organizations to improve developer productivity, and drive innovation in AI through AI for All, our generative AI for software development.Who we areWe’ve reduced the time it takes to develop and deploy software by orders of magnitude, collaboratively and in the cloud. Replit has enabled millions of software developers globally to go from idea to product faster than ever before. Reinventing and constantly improving how people develop and deploy software is hard, and that’s why we need the best people to join us in advancing our mission.To read more about who we are, check out our operating principles, or read about reasons not to join Replit.Our workOn any given day, we tackle some of the most challenging problems in computing (AI, sandboxing, distributed systems) and the most interesting problems in design and HCI. We love demos, brainstorming, and bringing research ideas to life that impact millions of people.Read more about what we build and how on our blog.How we hireWe look for people who are excellent at their craft and want to share that expertise with others. Whether you're an engineer, designer, marketer, or a wildcard, we want to see that your fundamentals are nailed down, you're resourceful, responsive to feedback, and able to think on your toes!That means that we won't be testing you with brain teasers that are unrelated to the real world. We ask you questions related to real challenges at Replit.We are always looking for new talent and welcome individuals of all levels of experience, from interns to full-time employees. To get an idea of our technical interviews, check out our initial engineering challenge.General interview process1Recruiter interviewChat with our recruiter to tell us about your career journey and professional goals, and we will share more about the opportunity, Replit, our mission and our operating principles.2Hiring manager interviewYou will meet with the Hiring Manager to do a deep dive about your experience and technical abilities. This interview is to assess skills based on expectations for this role.3Technical interviewYou will complete a live or take home exercise and meet with an individual from the team to review it together. These can be done in a variety of ways depending on the role: a project walkthrough, a coding challenge, or a take-home assignment.4Virtual onsiteYou will meet with members from the team and stakeholders that you would directly partner with to assess technical, problem solving, and behavioral skills needed to be successful in the role.Offer!What we offerAutonomous working environmentFlexible work hoursCompetitive salary and equityHome office set-up stipendHealth, dental, vision and life insuranceShort term and long term disabilityCommuter benefitsPaid parental, media, and caregiver leaveFlexible PTO + holidays401(k) programAnnual company/team offsites (4/year)Learning and development stipendReady to join us?See open positionsReplitMobile AppDesktop AppBlogCareersAboutPricingGuidesFeaturesReplit AICollaborationCDEDeploymentsTeamsLegalTerms of serviceTeams agreementPrivacySubprocessorsDPAReport abuseConnectX / TwitterTiktokFacebookInstagramLinkedinLanguagesPythonJavascriptTypeScriptNode.jsNix (Beta)HTML, CSS, JSC++GoLangHandy LinksLanguagesDocsHelpForumStatusImport from GlitchImport from HerokuCopilot alternativeBrand kitPartnershipsScroll to topAll rights reserved. Copyright © 2024 Replit, Inc."
