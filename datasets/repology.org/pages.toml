["https://repology.org/project/bash/badges"]
title = "bash packaging badges - Repology"
description = "SVG badges with packaging information for project bash"
full_description = '''Vertical badge This badge shows versions and up to date status of this project in all known repositories. Markdown code: [![Packaging status](https://repology.org/badge/vertical-allrepos/bash.svg)](https://repology.org/project/bash/versions) HTML code: <a href="https://repology.org/project/bash/versions"> <img src="https://repology.org/badge/vertical-allrepos/bash.svg" alt="Packaging status"> </a> HTML code for right-aligned badge (most useful for README.md as it allows other content to flow around it not leading to space waste): <a href="https://repology.org/project/bash/versions"> <img src="https://repology.org/badge/vertical-allrepos/bash.svg" alt="Packaging status" align="right"> </a> May be tweaked with header, minversion, and allow_ignored parameters (see below). It's also possible to specify number of columns with columns=<N> parameter. You may exclude specific kinds of sources (repository, modules, site) with exclude_sources parameter. E.g. use exclude_sources=modules,site to exclude e.g. PyPI and Wikidata. You may also exclude old and no longer supported repositories with exclude_unsupported=1 parameter. Note however that this will only work for repositories which have end of life date (valid_till) set in the configs. Feel free to submit PRs with missing dates. Tiny badge with number of repositories This shows total number of repository families featuring this package. Repository family is an aggregation of related repositories, e.g. Debian Stable, Testing, Unstable and Experimental all belong to a single family and are thus only counted once. Markdown code: [![Packaging status](https://repology.org/badge/tiny-repos/bash.svg)](https://repology.org/project/bash/versions) HTML code: <a href="https://repology.org/project/bash/versions"> <img src="https://repology.org/badge/tiny-repos/bash.svg" alt="Packaging status"> </a> May be tweaked with header parameter (see below). Tiny badge with latest packaged version(s) This shows latest version(s) known to repology. There may be multiple versions, for example devel and newest, or multiple variations of the same version encountered in some repositories (e.g.1.0.0 and 1.0). These badges also support minversion= parameter. Markdown code: [![latest packaged version(s)](https://repology.org/badge/latest-versions/bash.svg)](https://repology.org/project/bash/versions) HTML code: <a href="https://repology.org/project/bash/versions"> <img src="https://repology.org/badge/latest-versions/bash.svg" alt="latest packaged version(s)"> </a> May be tweaked with header parameter (see below). Tiny per-repository badges with version These show version in specific repository. Pick as many as you want! You may add ?header= to the URL to leave only the version. SampleMarkdown codeHTML code [![Adélie Linux current package](https://repology.org/badge/version-for-repo/adelie_current/bash.svg)](https://repology.org/project/bash/versions) <a href="https://repology.org/project/bash/versions"> <img src="https://repology.org/badge/version-for-repo/adelie_current/bash.svg" alt="Adélie Linux current package"></a> [![AIX Open Source Packages package](https://repology.org/badge/version-for-repo/aix_osp/bash.svg)](https://repology.org/project/bash/versions) <a href="https://repology.org/project/bash/versions"> <img src="https://repology.org/badge/version-for-repo/aix_osp/bash.svg" alt="AIX Open Source Packages package"></a> [![AIX Toolbox package](https://repology.org/badge/version-for-repo/aixtoolbox/bash.svg)](https://repology.org/project/bash/versions) <a href="https://repology.org/project/bash/versions"> <img src="https://repology.org/badge/version-for-repo/aixtoolbox/bash.svg" alt="AIX Toolbox package"></a> [![AlmaLinux 8 package](https://repology.org/badge/version-for-repo/almalinux_8/bash.svg)](https://repology.org/project/bash/versions) <a href="https://repology.org/project/bash/versions"> <img src="https://repology.org/badge/version-for-repo/almalinux_8/bash.svg" alt="AlmaLinux 8 p