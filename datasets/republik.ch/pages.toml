full_description = "MetaGenossenschaftsratFolgenMerkenTeilenDie 30 Mitglieder des Genossenschaftsrats. Der Genossenschafts­rat repräsentiert die Mitglieder der Project R Genossenschaft und vertritt deren Interessen. Er ist ein Bindeglied zwischen den Mitgliedern und dem Vorstand von Project R. In dieser Funktion unterstützt er die Kommunikation, begleitet partizipative Prozesse wie die Urabstimmungen und fördert Debatten. Der Genossenschaftsrat ist zudem ein beratendes Gremium. Er begleitet und unterstützt die Entwicklung der Republik, generiert Ideen zur Stärkung des Mediums oder der Genossenschaft und setzt diese nach Möglichkeit selbst um. Auf die Inhalte der Republik nimmt der Rat keinen direkten Einfluss, es gilt die Redaktionsfreiheit. Die heutigen Räte wurden im November 2024 von den Verlegerinnen gewählt. Spätestens nach drei Jahren sind jeweils Neuwahlen. Der Rat trifft sich zu mindestens zwei Sitzungen im Jahr und berichtet jeweils darüber. Sie wollen es ganz genau wissen? Lesen Sie mehr zum Genossenschafts­rat in den Statuten der Project R Genossenschaft.Präsidium Genossenschaftsrat:Alexandra FischerDie Genossenschaftsrätinnen:Aline TelekAndré AepliAndrea KramerBianka LichtenbergerClau DermontDominik WaserEliane R. SchmidEsther BlunschiGabriel ZülligGaby BelzGerard BottazzoliIngrid BachmannIsabelle BaduraJan BurckhardtJan HoltkampJessica LardonLuca RigoniMagdalena SeebauerMartha GebhardtMartin BaderMartina StraubMichael MeierMilena BrasiSandra MancaSibylle Omlin VockenhuberSina BucherSusanne MosbacherTobias BockstallerValentin Iseli"
