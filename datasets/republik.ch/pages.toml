title = "Republik – das digitale Magazin von Project R"
description = "Das war unser Crowdfunding."
full_description = "Die Republik ist eine kleine Rebellion. Für den Journalismus. Und gegen die Medienkonzerne. Denn die grossen Verlage verlassen die Publizistik: Sie bauen sich in hohem Tempo in Internet-Handelshäuser um. Das ist eine schlechte Nachricht für den Journalismus. Aber auch für die Demokratie. Denn ohne vernünftige Informationen fällt man schlechte Entscheidungen. Eine funktionierende Demokratie braucht funktionierende Medien. Und dafür braucht es nicht nur Journalistinnen und Journalisten, sondern auch Sie. Als Leserinnen. Als Bürger. Als Menschen, die bereit sind, etwas Geld in unabhängigen Journalismus zu investieren. Damit das digitale Magazin Republik an den Start gehen kann, haben wir 3000 Abonnentinnen und Abonnenten sowie 750’000 Franken gesucht. Dieses Ziel haben wir zusammen mit Ihnen am ersten Tag des Crowdfundings nach sieben Stunden und 49 Minuten erreicht. Herzlichen Dank! Es ist Zeit, selbst Verantwortung zu übernehmen. Unsere Aufgabe dabei ist, eine zeitgemässe Form für den Journalismus zu entwickeln. Die Republik wird ein schlankes, schlagkräftiges Magazin im Netz. Mit dem Ziel, bei den grossen Themen, Fragen und Debatten Klarheit und Überblick zu bieten. Und das aufrichtig, ohne Schnörkel, mit grossem Herzen. Unser Ziel dabei ist, gemeinsam mit Ihnen ein neues Modell im Medienmarkt zu etablieren: kompromisslos in der Qualität, ohne Werbung, finanziert von den Leserinnen und Lesern. Es ist Zeit für Journalismus ohne Bullshit. Bis jetzt haben Investorinnen und Spender rund 3,5 Millionen Franken zugesagt. Die Zahlung der Gelder ist aber an eine Bedingung geknüpft: den Test, ob das Publikum das neue Magazin auch will. Dazu dient dieses Crowdfunding. Wir brauchen mindestens 3000 zukünftige Leserinnen und Leser, die bereit sind, Republik zu abonnieren. Und wir müssen mindestens 750 000 Franken zusammenbekommen. Schaffen wir beide Ziele, zahlen die Investoren. Und die Entwicklung der Republik ist für fast zwei Jahre gesichert. Scheitern wir, fliesst kein Franken. Wir schliessen unser Unternehmen. Und Sie erhalten Ihren Beitrag zurück."
