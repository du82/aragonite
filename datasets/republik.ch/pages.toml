["https://republik.ch/2025/02/01/demokratie-unter-druck-aufstieg-der-autokraten-im-demokratischen-maentelchen"]
title = "Der Aufstieg der Autokraten im demokratischen Mäntelchen – Republik"
description = "Erleben wir gerade das Ende der liberalen Weltordnung? Folge 1 der Serie «Demokratie unter Druck»."
full_description = "Der Aufstieg der Autokraten im demokratischen MäntelchenIn Europa drängen rechtsradikale Parteien an die Macht, weltweit bröckeln die demokratischen Normen. Erleben wir gerade das Ende der liberalen Weltordnung? Serie «Demokratie unter Druck», Folge 1.Von Bettina Hamilton-Irvine (Text) und Philotheus Nisch (Bild), 01.02.2025FolgenMerkenTeilen186 Beiträge18614 Minuten14'Diesen Beitrag anhören0:00 / 22:42Erstaunlich war weniger, was Viktor Orbán an einem heissen Sommertag vor gut zehn Jahren in einer mittlerweile berüchtigten Rede sagte. Erstaunlich war vielmehr, wie er es sagte. Der neue Staat, den er aufbauen werde, erklärte der ungarische Minister­präsident im Juli 2014, sei «ein illiberaler Staat, ein nicht liberaler Staat».Orbán war vier Jahre zuvor an die Macht zurück­gekehrt und hatte seither nicht den Hauch eines Zweifels daran gelassen, dass er bei der Entwicklung Ungarns auf die Grund­prinzipien des Liberalismus pfeifen würde. Der inhaltliche Teil seiner Rede war also nicht neu.Überraschend war hingegen, wie explizit Orbán sein illiberales politisches System als ein solches bezeichnete. Welcher Führer eines demokratisch organisierten Staates gibt schon offen zu, dass er die Freiheit seiner Bürger einschränken und sein Land auf den Weg Richtung Autokratie schicken wird? Selbst für Orbán waren das neue Töne.Seine Rede sorgte weit über Ungarn hinaus für Irritation. Aber damals ahnte die Welt noch nicht, dass dieser Moment eine Wende markieren und die darauf­folgende demokratische Erosion rund um den Globus bis heute andauern würde.Nach Ungarn folgten Polen und die Türkei, und bald begannen auch in den USA die demokratischen Normen zu bröckeln. In Deutschland, Frankreich und Österreich drängen rechtsradikale Parteien mit populistischer und nationalistischer Rhetorik an die Macht. Und Chinas Modell des autoritären Kapitalismus fordert die liberale Demokratie weltweit zunehmend heraus.Heute kommen wir deshalb um die Frage nicht mehr herum: Erleben wir gerade das Ende der liberalen Weltordnung?Alle Macht der ExekutiveDoch bevor wir uns mit dieser düsteren Frage auseinander­setzen können, müssen wir eine andere Frage klären: Was ist eigentlich eine illiberale Demokratie? Ist das nicht ein Wider­spruch in sich selbst?Die Antwort auf die zweite Frage lautet: Jein. Fareed Zakaria, der den Begriff der «illiberalen Demokratie» 1997 mit einem Artikel im Magazin «Foreign Affairs» geprägt hat, meint damit Regimes, die zwar demokratisch gewählt sind, aber «systematisch verfassungs­mässige Beschränkungen ihrer Macht ignorieren und ihren Bürgerinnen grund­legende Rechte und Freiheiten vorenthalten».Demokratie unter DruckWie bedroht ist die Demokratie wirklich? Was sind die grössten Gefahren? Wie können wir weiterhin zuversichtlich und hoffnungsvoll bleiben? Eine Bestandsaufnahme zum Zustand und zur Zukunft der Demokratie. Zur Übersicht.Sie lesen: Folge 1Der Aufstieg der Autokraten im de­mo­kra­ti­schen MäntelchenFolge 224 (heikle) Fragen zur DemokratieFolge 3Wie können Wörter die liberale Demokratie gefährden?Folge 4Warum Hoffnung politisch istFolge 5Die Schweizer Drei-Viertel-DemokratieIn illiberalen Demokratien konzentriert sich sehr viel Macht in der Exekutive – die gleichzeitig alles dafür tut, um die anderen Gewalten zu schwächen oder für sich zu gewinnen: das Parlament, die Justiz, aber auch die vierte Gewalt, die Medien. An der Spitze illiberaler Demokratien steht oft ein charismatischer Anführer, der behauptet, den Willen des Volkes zu verkörpern – und der gleichzeitig alle ihm zur Verfügung stehenden Hebel benutzt, um seine eigene Macht zu festigen und die Opposition zu schwächen. Die Rechte von Minderheiten werden eingeschränkt, Rechts­staatlichkeit und Menschen­rechte missachtet. Demokratische Institutionen werden Schritt für Schritt von innen heraus zerlegt.Illiberale Demokratien sind im Grunde verkappte Autokratien im demokratischen Mäntelchen.Ungarn, der Posterboy des IlliberalismusSo viel zur Theorie. In der Praxis treten illiberale Demokratien in unterschiedlicher Ausprägung auf, von «beinahe liberal» bis «unverkennbar autokratisch».Ungarn ist zweifellos der Posterboy des Illiberalismus – ein Parade­beispiel für eine Demokratie, die de facto an Autokratie grenzt. Orbáns Regierung hat in den letzten 15 Jahren an allen Grund­pfeilern des liberalen Verfassungs­staates gesägt. Hier sind einige Schritte, die sie zu diesem Zweck unternommen hat:Orbáns Fidesz-Partei nutzte ihre absolute Mehrheit, um die ungarische Verfassung neu zu schreiben und die Gewalten­teilung zu schwächen.Sie schränkte die Unabhängigkeit der Justiz ein und besetzte das Verfassungs­gericht mit Fidesz-Anhängerinnen.Fidesz änderte die Wahlgesetze, sodass die Partei selbst davon profitierte, und zog die Wahlbezirke neu.Orbán machte die staatlichen Medien zum Propaganda­instrument der Regierung.Kritische Medien werden mit Geldstrafen in den Ruin getrieben, unabhängige Medien zum Schliessen gezwungen oder von Fidesz-Verbündeten übernommen.Gender-Studies-Programme an Universitäten sind verboten.Ein Gesetz schränkt die Verbreitung von «LGBTQIA+-Inhalten» in Medien und Bildung ein.Dabei hat die Orbán-Regierung in klassisch populistischer Manier versprochen, die Macht an das Volk zurück­zugeben. Getan hat sie das Gegenteil: Sie hat die Bürger zu Statisten gemacht, die sie mit Propaganda, Fake News und Lügen auf Kurs bringt. Dieser Mechanismus – die Umwandlung von Bürgerinnen in Zuschauerinnen – ist ein zentraler Bestandteil des sogenannten democratic backsliding: Indem illiberale Politik jegliche Widerstands­kräfte zunehmend unterminiert, erleichtert sie den Übergang zur Autokratie.Während Orbán den Menschen im Land eine Freiheit nach der anderen entzieht, gönnt er sich gerne selber etwas. Zum Beispiel ein riesiges Fussball­stadion, das aussieht wie eine Kathedrale. Es steht auf der anderen Seite der Strasse bei seinem Landhaus in Felcsút, dem Dorf, in dem er aufgewachsen ist. Dass das Stadion mit seinen 3800 Sitzplätzen mehr als doppelt so viele Personen fassen kann, wie Felcsút Einwohnerinnen hat, wirkt dabei nur auf den ersten Blick seltsam. Schliesslich wurde es auch nicht für die Dorf­bewohner errichtet. Sondern für Orbáns reiche Freunde, für die feste Parkplätze reserviert sind.Gebaut hat das Stadion: der Bürger­meister von Felcsút, ein Jugend­freund von Orbán. Dieser war früher Gasinstallateur, wurde aber dank staatlicher Aufträge innerhalb von wenigen Jahren zum heute reichsten Ungarn.Er ist nicht der Einzige, der von Orbáns Vettern­wirtschaft profitiert. Der Minister­präsident hat um sich herum einen Kreis von wohlhabenden Geschäfts­leuten aufgebaut – das, was die «Financial Times» «im Wesentlichen eine Gruppe loyaler Oligarchen» nennt. Es ist ein Modell, bei dem – wie in Russland – geschäftlicher Erfolg und politische Macht eng verflochten sind. Mit dem Unterschied, dass die ungarischen Oligarchen massiv von EU-Subventionen profitieren: Die staatlichen Aufträge, die ihnen Orbán zuschanzt, sind zu rund 60 Prozent von der EU finanziert.Längst nicht alle Regimes, die illiberale Tendenzen zeigen, gehen so offensiv vor wie Orbáns Regierung.Am anderen Ende des Spektrums sind Länder wie die Slowakei. Seit der Wieder­wahl von Präsident Robert Fico 2023 erlebt das Land zwar gewissen illiberalen Druck und ist stark polarisiert. Zugleich hat es sich bis heute aber viele Merkmale einer liberalen Demokratie bewahrt.Einen demokratischen Rückschritt gemacht hat auch Israel, das seit kurzem zum ersten Mal in 50 Jahren nicht mehr als liberale Demokratie gilt. Auf dem V-Dem-Index, der die Regierungs­systeme eines Landes bewertet, wurde das Land zu einer «Wahl­demokratie» herab­gestuft und befindet sich damit in der gleichen Kategorie wie Polen oder Brasilien. Schuld daran sind vor allem die Justiz­reform der Regierung und weitere Angriffe auf die Unabhängigkeit der Justiz.Irgendwo dazwischen liegt Indien. Das Land wird zwar gern als «grösste Demokratie der Welt» bezeichnet, doch unter Premier­minister Narendra Modi zeigt es zunehmend illiberale Tendenzen – die Einschränkung der Medien- und Meinungs­freiheit, der Druck auf die Zivil­gesellschaft und die Aushöhlung der Minderheiten­rechte sind nur ein paar Beispiele dafür.Eine kleine Geschichte des IlliberalismusWer den Aufstieg des Illiberalismus nachzeichnen will, muss gar nicht allzu weit zurück­gehen. Auch wenn der Begriff schon Ende der 1990er-Jahre populär wurde: So richtig seinen Platz schuf er sich erst Anfang dieses Jahrhunderts.Dazu trugen die Anschläge vom 11. September 2001 bei, nach denen es zu einer Verschiebung in der Welt­politik kam: Der globale war on terror diente vielen westlichen Demokratien als Anlass, ihre Sicherheits­massnahmen zu verschärfen, aber auch als Vorwand, Menschen­rechte nicht mehr einzuhalten (was teilweise dasselbe war).Die globale Finanzkrise von 2008 gab illiberaler Politik und populistischen Bewegungen zusätzlichen Aufschwung: Dies vor allem, weil die wirtschaftliche Instabilität und die zunehmende Ungleichheit zu wachsender Skepsis gegenüber traditionellen liberalen Institutionen führten.Ein idealer Mix für populistische Anführer wie Orbán, die in den 2010er-Jahren die Chance zu wittern begannen, ihre (nicht immer so) geheimen Fantasien von illiberalen Staaten ungehemmt auszuleben.Auch die polnische Regierung schloss sich dem Club illiberaler Demokratien an. Die Partei Recht und Gerechtigkeit (PIS) gewann 2015 einigermassen überraschend die Parlaments­mehrheit und begann sofort, ihre Macht zu konsolidieren – mit bewährten Mitteln: Sie schwächte die Gewalten­teilung, schränkte die Unabhängigkeit der Justiz massiv ein, machte die öffentlichen Medien zu Propaganda­maschinen und ging gegen kritische Journalistinnen vor.Und dann, 2016: Donald Trump wurde zum ersten Mal zum Präsidenten der Vereinigten Staaten gewählt. Schon damals bedeutete dies einen Wandel hin zu einer illiberalen Rhetorik und Politik, die etablierte Normen und Institutionen infrage stellten – auch wenn noch niemand ahnen konnte, welch erbarmungslose Angriffe auf die liberale Demokratie Trump in der Folge lancieren würde. Viele Beobachterinnen trösteten sich zu dieser Zeit noch damit, dass Trump ein chaotischer Amateur war, der sich nicht genug lange auf etwas konzentrieren konnte, um wirklich gefährlich zu werden.Dennoch: Trump griff von Beginn weg die Medien an, bezeichnete sie als «Feind des Volkes» und drohte, gegen kritische Titel wegen Landesverrat vorzugehen.Auch sprachlich erinnerte er oft an Autokraten: Er entmenschlichte seine Gegnerinnen und schürte Ängste vor Einwanderern und Minderheiten – beispielsweise als er während seiner ersten Kampagne sagte, Mexiko schicke systematisch Drogen, Kriminalität und Vergewaltiger über die Grenze.Klargemacht, dass er sich nicht an die demokratischen Regeln halten wird, hatte er ebenfalls schon vor der Wahl, als er sagte, er verspreche allen seinen Wählern, dass er das Ergebnis der Präsidentschafts­wahl «voll und ganz akzeptieren» werde – falls er gewinne. Auf die Frage, ob er die Wahl anerkennen würde, falls er verlieren sollte, antwortete er, das werde er zu gegebener Zeit entscheiden.Dass Trump nicht nur damit kokettierte, die Legitimität von Wahlen zu untergraben, wissen wir spätestens seit dem 6. Januar 2021, als Trumps Weigerung, seine verlorene Wahl anzuerkennen, darin gipfelte, dass er einen wütenden Mob aufs US-Capitol losliess. Es war einer der physisch brutalsten Angriffe auf die Demokratie, den die USA je gesehen hatten.Spätestens an diesem Punkt waren wir gezwungen, einer unbequemen Wahrheit ins Auge zu blicken: Selbst die etabliertesten Demokratien sind nicht geschützt vor der steigenden Flut des Illiberalismus.Wie schön wäre es, man könnte diesen schwarzen Tag als einen freak event abtun, als einen Ausrutscher, schockierend zwar, aber längst vorbei – und vielleicht sogar als Warnung dienlich, damit so etwas nie mehr geschehe: Lest we forget.Leider ist das Gegenteil wahr. Der Mann, der versucht hat, die Demokratie mit eigenen Händen zu erwürgen, ist seit wenigen Tagen zurück in der Kommando­zentrale. Und hat schon in den ersten zwei Tagen klargestellt, welcher Wind dort nun weht: Donald Trump begnadigt die Randalierer vom 6. Januar, kuschelt mit Tech-Moguln, geht massiv gegen Migrantinnen vor, ordnet den Austritt der USA aus dem Pariser Klima­abkommen an, hebt die Schutz­massnahmen für LGBTQIA+-Personen auf, die Joe Biden eingeführt hat, und weist den General­staatsanwalt an, gegen angeblich «politisch motivierte» Strafverfolgungs­massnahmen verschiedener Bundes­behörden vorzugehen.Die Zeichen stehen auf Sturm: Das alles deutet auf einen äusserst autokratischen Führungs­stil hin.Doch was heisst das für uns, wenn eine der ältesten und stabilsten Demokratien der Welt derart angeschlagen ist? Sind wir nun alle verloren?Oder, um zu unserer Ausgangs­frage zurück­zukommen: Erleben wir wirklich gerade das Ende der liberalen Weltordnung?Was sich messen lässtTatsächlich lässt sich das weltweite Erstarken des Illiberalismus anhand mehrerer Schlüssel­indikatoren beobachten:Die Erosion demokratischer Normen in Ländern wie Ungarn, Polen, der Türkei, aber auch den USA: Kontroll­instanzen wie Gerichte und Medien werden geschwächt.Eine Zentralisierung der Macht in der Exekutive, oft auf Kosten anderer Regierungs­institutionen.Die zunehmend populistische und nationalistische Rhetorik.Die wirtschaftliche Unzufriedenheit und die Ungleichheit, die insbesondere seit der Finanzkrise von 2008 illiberale Bewegungen stärken.Die Abkehr von supranationalen Institutionen wie der Europäischen Union: Illiberale Regierungen argumentieren, dass diese die nationale Souveränität untergraben.Der Rückzug aus globalen Engagements und eine Fokussierung auf nationalistische Interessen.Der Aufstieg rechtsextremer Parteien, besonders in Europa – von Marine Le Pens Rassemblement National in Frankreich über Alice Weidels AfD in Deutschland bis zu Herbert Kickls FPÖ in Österreich.So weit, so beunruhigend. Aber lässt sich das auch irgendwie messen? Oder ist der Aufstieg des Illiberalismus vielleicht doch einfach ein Schreck­gespenst, das uns umso bedrohlicher vorkommt, je länger wir darauf starren?Die ernüchternde Antwort darauf ist: Nein, er ist kein Gespenst, sondern sehr real. Und ja, er lässt sich messen. Die Zahlen, so viel vorweg, machen keine Freude.Eine der ältesten Organisationen, die untersuchen, in welchem Zustand sich Freiheit und Demokratie weltweit befinden, ist Freedom House. Sie wurde 1941 unter anderem von Eleanor Roosevelt gegründet und veröffentlicht seit den Siebziger­jahren jährlich den Bericht «Freedom in the World».Gemäss der aktuellsten Analyse von 2024 hat die globale Freiheit in den letzten 18 Jahren kontinuierlich abgenommen.2023 hat sich die Lage in Bezug auf politische und bürgerliche Rechte in 52 Ländern verschlechtert, während es in nur 21 Ländern zu Verbesserungen kam.Zu einem ähnlich deprimierenden Schluss kommt das Institut Varieties of Democracy (V-Dem).Gem"
