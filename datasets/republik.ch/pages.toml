title = "🚀 Republik Cockpit"
description = "Alles, was Sie zur finanziellen Lage der Republik wissen müssen."
full_description = "Die Aufgabe der Republik ist, brauchbaren Journalismus zu machen. Einen, der die Köpfe klarer, das Handeln mutiger, die Entscheidungen klüger macht. Und der das Gemeinsame stärkt: die Freiheit, den Rechtsstaat, die Demokratie. Die Grundlage dafür ist ein Geschäftsmodell für werbefreien, unabhängigen, leserfinanzierten Journalismus. Um am Markt zu bestehen und einen entscheidenden Unterschied im Mediensystem zu machen, braucht die Republik eine starke Community. An dieser Stelle machen wir, anders als in unserer finanziellen Planung, keinen Unterschied zwischen weniger und mehr zahlenden Verlegerinnen. Jeder Verleger, egal wie viel er zahlen kann, unterstützt uns und leistet einen Beitrag. Es gibt Menschen in unserer Community, die sich eine Jahresmitgliedschaft nicht leisten können und deshalb einen vergünstigten Preis zahlen; es gibt aber auch Mitglieder, die als Gönner mehr bezahlen. Der strategische Fokus liegt auf Stabilität: Zu- und Abgänge bei Mitgliedschaften und Abonnements müssen sich dafür über das Jahr die Waage halten. Der beste Journalismus nützt nichts, wenn ihn niemand sieht. Für ein gesundes Unternehmen braucht es eine aktive und interessierte Verlegerschaft."
