title = "Datenschutz - Republik – Republik"
description = "Datenschutzbestimmungen der Republik"
full_description = "DatenschutzStand Juni 2024Die Project R Genossenschaft und die Republik AG («die Verantwortlichen»), beide an der Sihlhallenstrasse 1, 8004 Zürich, erfassen, verarbeiten, speichern und schützen die Daten von Personen, die auf die Seiten www.republik.ch und www.project-r.construction zugreifen («betroffene Person»). Mittels dieser Datenschutz­erklärung möchten die Verantwortlichen die Öffentlichkeit über Art, Umfang und Zweck der erhobenen, genutzten und verarbeiteten personen­bezogenen Daten informieren. Ferner werden betroffene Personen mittels dieser Datenschutz­erklärung über die ihnen zustehenden Rechte aufgeklärt.Eine Nutzung der Websites www.republik.ch und www.project-r.construction der Verantwortlichen ist grundsätzlich ohne jede Angabe personen­bezogener Daten möglich. Sofern eine betroffene Person besondere Dienstleistungen über die Websites www.republik.ch und www.project-r.construction in Anspruch nehmen möchte, könnte jedoch eine Verarbeitung personen­bezogener Daten erforderlich werden. Ist die Verarbeitung personen­bezogener Daten erforderlich und besteht für eine solche Verarbeitung keine gesetzliche Grundlage, wird generell eine Einwilligung der betroffenen Person eingeholt.Die Verarbeitung personen­bezogener Daten (zum Beispiel Name, E-Mail-Adresse) einer betroffenen Person erfolgt stets im Einklang mit den gesetzlichen Vorgaben. Die Verantwortlichen unterliegen dem schweizerischen Datenschutz­gesetz.Werden jedoch personenbezogene Daten von Unionsbürgern/-innen bearbeitet, kommt die europäische Datenschutz­grundverordnung DSGVO (EU/2016/679) zur Anwendung. Da Letztere zum Teil weitreichendere Rechte und Pflichten zugunsten der betroffenen Person festhält, werden diese auch auf betroffene Personen, die in der Schweiz wohnhaft sind, angewendet.1. Integrierender BestandteilDie Datenschutz­erklärung ist integrierender Bestandteil der allgemeinen Geschäfts­bedingungen der Verantwortlichen und wird auf den Websites www.republik.ch und www.project-r.construction publiziert.Mit dem Anklicken der Checkbox erklären die betroffenen Personen ihr Einverständnis mit der vorliegenden Datenschutz­erklärung.2. Name und Anschrift des für die Verarbeitung Verantwortlichen und dessen Vertreter.Die Verantwortlichen der Websites www.republik.ch und www.project-r.construction sind die Republik AG und die Project R Genossenschaft mit den folgenden Kontaktdaten:Republik AGSihlhallenstrasse 18004 ZürichSchweizTel.: +41 44 505 67 80E-Mail: kontakt@republik.chWebsite: www.republik.ch Project R GenossenschaftSihlhallenstrasse 18004 ZürichSchweizTel.: +41 44 505 67 80E-Mail: office@project-r.constructionWebsite: www.project-r.construction In sämtlichen Belangen betreffend Datenschutz werden die Verantwortlichen innerhalb der Europäischen Union vertreten durch:VGS Datenschutzpartner GmbHAm Kaiserkai 6920457 HamburgDeutschlandE-Mail: info@datenschutzpartner.eu 3. CookiesDie Websites www.republik.ch und www.project-r.construction verwenden Cookies. Cookies sind Text­dateien, welche über einen Internet­browser auf einem Computer­system abgelegt und gespeichert werden. Zahlreiche Internet­seiten und Server verwenden Cookies. Mittels eines Cookies können die Informationen und Angebote auf unserer Internetseite im Sinne der Benutzer optimiert werden. Cookies ermöglichen uns, die Benutzer/-innen unserer Internetseite wieder­zuerkennen. Zweck dieser Wieder­erkennung ist, den Nutzern/-innen die Verwendung unserer Internet­seite zu erleichtern.Wer darauf verzichtet, die Cookies auszuschalten, erklärt sich damit einverstanden, dass www.republik.ch und www.project-r.construction Cookies nutzen.Die betroffene Person kann die Setzung von Cookies durch unsere Internet­seite jederzeit mittels einer entsprechenden Einstellung des genutzten Internet­browsers verhindern und damit der Setzung von Cookies dauerhaft wider­sprechen. Ferner können bereits gesetzte Cookies jederzeit über einen Internet­browser oder andere Software­programme gelöscht werden.Es ist möglich, dass die Website www.republik.ch ohne Cookies nicht korrekt funktioniert.4. Erfassung von allgemeinen Daten und InformationenDie Websites www.republik.ch und www.project-r.construction der Verantwortlichen erfassen mit jedem Aufruf der Internet­seiten durch eine betroffene Person oder ein automatisiertes System eine Reihe von allgemeinen Daten und Informationen. Diese allgemeinen Daten und Informationen werden in den Logfiles des Servers gespeichert. Erfasst werden können die verwendeten Browser­typen und Versionen,das vom zugreifenden System verwendete Betriebs­system,die Internetseite, von welcher ein zugreifendes System auf unsere Internet­seite gelangt,die Unterwebseiten, welche über ein zugreifendes System auf unserer Internet­seite angesteuert werden,das Datum und die Uhrzeit eines Zugriffs auf die Internet­seite, eine Internet-Protokoll-Adresse (IP-Adresse),der Internet-Service-Provider (ISP) des zugreifenden Systems und sonstige ähnliche Daten und Informationen, die der Gefahren­abwehr im Falle von Angriffen auf unsere informations­technologischen Systeme dienen.Allgemeine Zugriffsdaten und Informationen werden ausschliesslich an folgende Drittparteien weitergegeben:Plausible ist ein Open-Source-Analytics-Tool, das von Plausible Insights OÜ in Tartu, Estland, betrieben wird. Es ermöglicht, die Besucherzahlen unserer Seiten zu messen und statistische Analysen durchzuführen. Plausible ist ein «Privacy first»-Analytics-Tool, das keine Cookies verwendet und das Verfolgen von Individuen über Webseiten und Geräte hinweg verunmöglicht. Die anonymen Zugriffsdaten werden auf europäischen Servern gehostet und bleiben im Besitz der Republik AG. Plausible Insights OÜ hat keinen Zugriff auf die von der Republik AG erhobenen Daten.Die Zugriffs­zählung für die Verwertungs­gesellschaft Pro Litteris. Dabei werden Datum und Uhrzeit des Zugriffs und ein Teil der IP-Adresse an die von Pro Litteris für die Zählung beauftragte Firma Kantar Media übermittelt. Eingeloggte Besucher/-innen können die Zugriffs­zählung in den Einstellungen unterbinden.Fehlermonitoring mit der Software «Sentry». Um Fehler­quellen zu analysieren und einen angemessenen Support für technische Probleme von betroffenen Personen zu garantieren, werden bei technischen Fehlern (z. B. Abstürze, Bugs) unserer Web-Applikationen allgemeine Daten und Informationen an Server von Functional Software, Inc. (45 Fremont Street, 8th Floor, San Francisco, CA 94105) übermittelt.Bei der Nutzung dieser allgemeinen Daten und Informationen ziehen die Verantwortlichen keine Rückschlüsse auf die betroffene Person. Diese Informationen werden vielmehr benötigt, umdie Inhalte der Internet­seite korrekt auszuliefern,die Inhalte der Internet­seite sowie die Werbung für diese zu optimieren,die dauerhafte Funktions­fähigkeit der informations­technologischen Systeme und der Technik der Internet­seite zu gewährleisten sowie um Strafverfolgungs­behörden im Falle eines Cyber­angriffes die zur Strafverfolgung notwendigen Informationen bereitzustellen.Diese anonym erhobenen Daten und Informationen werden durch die Verantwortlichen daher einerseits statistisch und ferner mit dem Ziel ausgewertet, den Datenschutz und die Daten­sicherheit in der Unternehmung der Verantwortlichen zu erhöhen, um letztlich ein optimales Schutz­niveau für die von den Verantwortlichen verarbeiteten personenbezogenen Daten sicher­zustellen. Die anonymen Daten der Server-Logfiles werden getrennt von allen durch eine betroffene Person angegebenen personen­bezogenen Daten gespeichert.Wenn Besucher/-innen «do not track» eingeschaltet haben, werden nur Daten in der Session getrackt, wenn Besucher/-innen sich einloggen.5. Registrierung auf den Websites www.republik.ch und www.project-r.constructionDie betroffene Person hat die Möglichkeit, sich auf der Internet­seite der Verantwortlichen unter Angabe von personen­bezogenen Daten zu registrieren. Eine Registrierung ist unter anderem notwendig, um ein Abonnement des digitalen Magazins «Republik» zu kaufen, Newsletters zu abonnieren, Mitglied bei der Project R Genossenschaft zu werden oder durch eine Spende Unterstützer/-in der Project R Genossenschaft zu werden.Welche personenbezogenen Daten dabei an die Verantwortlichen übermittelt werden, ergibt sich aus der jeweiligen Eingabemaske, die für die Registrierung verwendet wird. Für den Kauf eines Abonnements bei der Republik AG werden Vor- und Nachname, E-Mail-Adresse und die Zahlungs­daten der Besucher/-innen benötigt. Für den Erwerb der Mitgliedschaft oder eine Spende bei der Project R Genossenschaft werden Vor- und Nachname, E-Mail-Adresse, Anschrift und die Zahlungs­daten der Besucher/-innen benötigt.Die von der betroffenen Person eingegebenen personen­bezogenen Daten werden ausschliesslich für die interne Verwendung bei den Verantwortlichen und für eigene Zwecke erhoben und gespeichert.Mit der Registrierung erklären die Besucher/-innen die Richtigkeit ihrer persönlichen Daten.Durch eine Registrierung auf den Websites der Verantwortlichen werden ferner die vom Internet-Service-Provider (ISP) der betroffenen Person vergebene IP-Adresse, das Datum sowie die Uhrzeit der Registrierung gespeichert. Die Speicherung dieser Daten erfolgt vor dem Hintergrund, dass nur so der Missbrauch der Dienste verhindert werden kann und diese Daten im Bedarfsfall ermöglichen, begangene Straftaten aufzuklären. Eine Weitergabe dieser Daten an Dritte erfolgt grundsätzlich nicht, sofern keine gesetzliche Pflicht zur Weitergabe besteht oder die Weitergabe der Strafverfolgung dient.Die Registrierung der betroffenen Person unter freiwilliger Angabe personen­bezogener Daten dient den Verantwortlichen dazu, der betroffenen Person Inhalte oder Leistungen anzubieten, die aufgrund der Natur der Sache nur registrierten Benutzern angeboten werden können. Registrierten Personen steht die Möglichkeit frei, die bei der Registrierung angegebenen personen­bezogenen Daten jederzeit abzuändern oder vollständig aus dem Datenbestand der Verantwortlichen löschen zu lassen.6. Einsatz von AuftragsverarbeiternFür die Verarbeitung können die Verantwortlichen die Weitergabe an einen oder mehrere Auftrags­verarbeiter (z. B. MailChimp, Stripe, PayPal, PostFinance) veranlassen, der oder die die personen­bezogenen Daten ebenfalls ausschliesslich für eine interne Verwendung, die den Verantwortlichen zuzurechnen ist, nutzen.Folgende unserer Auftrags­verarbeiter verarbeiten personen­bezogene Daten in Drittländern (ausserhalb der Schweiz und ausserhalb der Europäischen Union):a) Einsatz von MailChimpDer Versand der Newsletter erfolgt mittels MailChimp, einer Newsletterversand-Plattform des US-Anbieters Rocket Science Group, LLC, 675 Ponce de Leon Ave NE #5000, Atlanta, GA 30308, USA. Die E-Mail-Adressen der Abonnenten/-innen unserer Newsletter als auch deren weitere, im Rahmen der vorliegenden Datenschutz­erklärung beschriebenen Daten werden auf den Servern von MailChimp in den USA gespeichert.MailChimp verwendet diese Informationen zum Versand und zur Auswertung der Newsletter im Auftrag der Verantwortlichen. Des Weiteren kann MailChimp nach eigenen Informationen diese Daten zur Optimierung oder Verbesserung der eigenen Services nutzen. MailChimp nutzt die Daten der Empfänger/-innen unserer Newsletter jedoch nicht, um diese selbst anzuschreiben oder an Dritte weiterzugeben. Weitere Informationen zu MailChimp und der DSGVO-Konformität finden Sie hier.b) Einsatz von PayPalSollten Sie sich im Rahmen Ihres Bestell­vorgangs für eine Bezahlung mit dem Online-Zahlungs­dienstleister PayPal entscheiden, werden im Rahmen der so ausgelösten Bestellung Ihre Kontakt­daten an PayPal übermittelt. PayPal ist ein Angebot der PayPal (Europe) S.à.r.l. & Cie. S.C.A., 22-24 Boulevard Royal, L-2449 Luxembourg.Bei den an PayPal übermittelten personen­bezogenen Daten handelt es sich zumeist um Vorname, Nachname, Adresse, Telefon­nummer, IP-Adresse, E-Mail-Adresse oder andere Daten, die zur Bestell­abwicklung erforderlich sind, wie auch Daten, die im Zusammenhang mit der Bestellung stehen. Diese Übermittlung ist zur Abwicklung Ihrer Bestellung mit der von Ihnen ausgewählten Zahlungsart notwendig, insbesondere zur Bestätigung Ihrer Identität, zur Administration Ihrer Zahlung und der Kunden­beziehung.Bitte beachten Sie jedoch, dass PayPal personen­bezogene Daten auch an weitere Auftrags­verarbeiter weitergeben wird, soweit dies zur Erfüllung der vertraglichen Verpflichtungen aus Ihrer Bestellung erforderlich ist.Abhängig von der über PayPal ausgewählten Zahlungsart, z. B. Rechnung oder Lastschrift, werden die an PayPal übermittelten personenbezogenen Daten von PayPal an Wirtschafts­auskunfteien übermittelt. Diese Übermittlung dient der Identitäts- und Bonitäts­prüfung in Bezug auf die von Ihnen getätigte Bestellung. Weitere Informationen zu PayPal erhalten Sie hier.7. Kontaktmöglichkeit über die InternetseiteDie Websites der Verantwortlichen enthalten eine schnelle elektronische Kontakt­aufnahme. Sofern eine betroffene Person per E-Mail oder über ein Kontakt­formular den Kontakt mit den Verantwortlichen aufnimmt, werden die von der betroffenen Person übermittelten personen­bezogenen Daten automatisch gespeichert.Solche auf freiwilliger Basis von einer betroffenen Person an die Verantwortlichen übermittelten personen­bezogenen Daten werden für Zwecke der Bearbeitung oder der Kontaktaufnahme mit der betroffenen Person gespeichert. Es erfolgt keine Weitergabe dieser personen­bezogenen Daten an Dritte.8. Kommentar- und Debattierfunktion auf der InternetseiteDie Verantwortlichen bieten den Besucher/-innen der Internetseite www.republik.ch die Möglichkeit, individuelle Kommentare zu einzelnen Magazin­beiträgen zu hinterlassen sowie Debatten zu bestimmten Themen zu führen. Diese Kommentare können in der Regel von Dritten kommentiert werden.Hinterlässt eine betroffene Person einen Kommentar in dem auf dieser Internetseite veröffentlichten Artikel, werden neben dem von der betroffenen Person hinterlassenen Kommentar auch Angaben zum Zeitpunkt der Kommentar­eingabe sowie der Name (Klarnamen-Pflicht) der betroffenen Person gespeichert und veröffentlicht. Ferner wird die vom Internet-Service-Provider (ISP) der betroffenen Person vergebene IP-Adresse mitprotokolliert. Diese Speicherung der IP-Adresse erfolgt aus Sicherheits­gründen und für den Fall, dass die betroffene Person durch einen abgegebenen Kommentar die Rechte Dritter verletzt oder rechtswidrige Inhalte postet. Es erfolgt keine Weitergabe dieser erhobenen personen­bezogenen Daten an Dritte, sofern eine solche Weitergabe nicht gesetzlich vorgeschrieben ist oder der Verteidigung der Rechte der Verantwortlichen dient.9. Routinemässige Löschung und Sperrung von personenbezogenen DatenDie Verantwortlichen verarbeiten und speichern personen­bezogene Daten der betroffenen Person nur für den Zeitraum, der zur Erreichung des Speicherungs­zwecks erforderlich ist, oder sofern dies durch gesetzliche Vorgaben, welchen die Verantwortliche"
