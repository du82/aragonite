title = "Das Spiel mit der Demokratie – Republik"
description = "Ein starkes Lehrstück von Maximilian Steinbeis und mit Fabian Hinrichs: Wie Populisten Schwachstellen in Verfassung und Gesetzen ausnutzen."
full_description = "Eine gewisse Ähnlichkeit mit Björn Höcke und die gleiche Buchstabenzahl beim Nachnamen. Alles Zufall? DA-Chef Dominik Arndt (Fabian Hinrichs). Oliver ProskeDas Spiel mit der DemokratieAutoritäre Populisten nutzen die Schwach­stellen der Verfassungen und Gesetze, um die Demokratie zu schwächen. Davor warnt der Jurist Maximilian Steinbeis mit einem dramatischen Lehrstück direkt im Herzen des deutschen Regierungs­systems.Von Valeria Heintges, 15.10.2024FolgenMerkenTeilen14 Beiträge1410 Minuten10'Diesen Beitrag anhören0:00 / 15:00Gleich wird er erscheinen, der Sieger des heutigen Wahlabends. Gerade erst hat seine Partei, die Demokratische Allianz – kurz DA –, im Freistaat einen Erdrutsch­sieg eingefahren und die absolute Mehrheit errungen. Zwar wäre es üblich, vor Ort den Sieg zu feiern und Statements abzugeben, aber Dominik Arndt – auch hier: DA – kommt direkt nach Berlin, in das Haus der Bundes­presse­konferenz, das Herzstück des deutschen Hauptstadt­journalismus.Denn Dominik Arndt hat Grosses vor. Er sagt: «Ich bin DA» und kapert den Polit­betrieb. Denn DA ist gekommen, um zu bleiben. Und um das System zu verändern – ganz nach seinem Sinn und seiner Gesinnung.Die blaue Hintergrund­wand im Haus der Bundes­presse­konferenz in Berlin ist beinahe täglich in deutschen Nachrichten­sendungen zu sehen. Der Verein der Journalisten hat sich Regeln gegeben, die einen fairen Umgang zwischen Medien und Politik garantieren sollen. Aber Dominik Arndt schert sich einen Dreck um alle Regeln. Das macht er gleich mit seinem ersten Auftritt klar: Er reisst das Gespräch an sich und lässt die Moderatorin nicht einmal zu Wort kommen. Ein Mann wie Dominik Arndt befolgt Regeln, wenn sie ihm nützen. Und bricht sie, wenn sie ihm nicht passen.Dominik Arndt ist der «Volksbürger» in Maximilian Steinbeis’ gleich­namigem Theater­stück. Darin spielt Steinbeis, der nur im Nebenberuf Dramatiker, im Haupt­beruf aber Jurist und Betreiber des viel beachteten «Verfassungsblogs» ist, ein Gedanken­experiment durch: Was könnte passieren, wenn eine populistische Partei in einem deutschen Bundesland die absolute Mehrheit erränge? Welche Möglichkeiten hätte sie, das System zu unter­wandern oder es zu ändern?Die freie Theatergruppe Nico and the Navigators um Regisseurin Nicola Hümpel hat das Stück vor Ort inszeniert – in dem Saal, in dem die Medien­treffen stattfinden. Vier Mal wurde es im Haus der Bundes­presse­konferenz gezeigt und ist jetzt als Mitschnitt in der Arte-Mediathek zu sehen.Steinbeis’ Gedanken­experiment ist atemberaubend nah an der Realität, das Bild einer möglichen Zukunft, das er dabei zeichnet, so bedrohlich, dass man die gute Nachricht des Abends fast vergessen könnte. Die lautet: Wer die Gefahr kennt, kann sich wappnen. Genau das macht diese aufrüttelnde Intervention so dringlich.Dabei besteht das Stück im Wesentlichen aus einer Abfolge fingierter Presse­konferenzen; das Publikum sitzt auf den Stühlen, auf denen sonst die Journalisten Platz nehmen, einige Schau­spielerinnen als Fragen stellende Medien­schaffende mitten unter ihnen. Zeit der Handlung: die Gegenwart. Dauer der Handlung: genau ein Jahr. Länger braucht es nicht, bis sich die Ereignisse überschlagen und die Bundes­regierung sich gezwungen sieht, zu äussersten Mitteln zu greifen.Das Ziel: Den Rechts­staat aushebelnDominik Arndt wird Demokratie spielen und mit der Demokratie spielen. Und dabei immer sein Ziel verfolgen, einen autoritären Populismus zu etablieren; erst verdeckt, dann immer unverhohlener.Wie er das anstellt? Indem er die Ausländer­behörden im Freistaat anweist, anstehende Entscheidungen nicht zu treffen oder auf die ganz, ganz lange Bank zu schieben. Migrantinnen erhalten keine Bewilligungen mehr und keine Unterstützung. Weil sie nicht arbeiten dürfen, können sie ihre Miete nicht mehr bezahlen; sie verlieren ihre Wohnungen, landen obdachlos auf der Strasse.Als die ersten Fälle publik werden, ist von «bedauerlichen Einzel­fällen» die Rede. Dann von «Überlastung der Behörden». Das sei «passive Abschiebung», sagen Menschenrechts­gruppen. Wer sich nicht eingliedern wolle, könne sicherlich andere Orte finden, befindet der Landes­politiker. Das Vorgehen kennt man, die ungarischen und die polnischen Regierungen agieren seit Jahren genauso.Dann sagt Dominik Arndt: «Freistaat first». Da lässt sich nicht mehr leugnen: Das Vorgehen ist kein Zufall. Es hat Methode.Es gibt viel zu erklären und zu schreiben: Drei Journalisten unterwegs zur Pressekonferenz (Ted Schmitz, Matthias Zera und Martin Clausen, von links). Falk Wenzel«Wir müssen mehr miteinander reden – aber das funktioniert nicht, wenn man immer nur einen Balken hat»: Dominik Arndt kritisiert im Wahlkampf die Bundesregierung. Unter dem kritischen Blick der Leiterin der Bundes­presse­konferenz (Klara Pfeiffer). Falk WenzelDie Sprecherin der Bundes­regierung hält die Regeln ein, bleibt höflich. Man werde das Gespräch suchen, «mit Hochdruck an einer Lösung arbeiten» und setze auf ein «konstruktives Miteinander».Aber wenn der eine nicht will, kann der andere nicht konstruktiv sein. Und von einem Miteinander nicht mehr gesprochen werden.Die Bundesregierung dringt darauf, dass auch im Freistaat der Rechtsstaat nicht verhandelbar ist und Gesetze befolgt werden müssen. Die Juristen suchen nach Möglichkeiten, um den Minister­präsidenten auf den Pfad der Demokratie zurückzuholen. Sie finden Artikel 84 des Grundgesetzes. Absatz 3 gestattet es der Bundes­regierung, die Landes­regierungen zu überwachen und «Beauftragte zu den obersten Landes­behörden zu entsenden». «Ich bin doch kein Pudel», sagt Minister­präsident Arndt.Volkstribun, Operetten­held, EgoshooterFabian Hinrichs, Starschauspieler und «Tatort»-Kommissar, spielt diesen Arndt so, dass er an einen autoritären Rechts­extremen und Radikal­populisten wie Björn Höcke erinnert (dem er frappierend zu ähneln scheint); er gibt ihm die Züge eines Volks­tribuns, irgendwo zwischen schmierigem Oper(ette)n-Helden und unsympathischem Egoshooter. Arndt sagt mit Haifisch­grinsen: «Ich bin mit mir identisch. Ich spiele hier doch keine Rolle.»«Ein Volksbürger», im Untertitel als «politische Farce» bezeichnet, ist auch spitzfindig, derbkomisch. Es lässt zuweilen laut und erschrocken auflachen. Weil man die Phrasen kennt, die Wendungen schon so oft gehört hat. Und weil das Theater­spiel so erschütternd nahe an der Gegenwart ist.Aber das Lachen vergeht einem schnell. Denn das Erleben an diesem Ort, mitten zwischen Bundeskanzler­amt und Reichstag, im Herzen der Berliner Politik, mit den Politikerinnen als Handelnden direkt vor der Nase, macht die vermeintlich trockene juristische Materie konkret und fassbar. Man schaudert, wie scheinbar höflich das Aushöhlen der demokratischen Institutionen vor sich gehen kann – und wie schnell! Kunst, in dem Fall Theater, macht diese Gefahr plastisch. Politisch wie selten wird Kunst zum Möglichkeits­raum für die Wirklichkeit, zeigt aufklärerisch im besten Sinne, wie akut die Gefahr einer Bedrohung der Demokratie ist. Zudem kann das Erlebnis Theater auch ganz simpel die Resonanz, den Kreis der Adressaten vergrössern.Das Stück hatte Premiere am 27. September. Am Tag also, nachdem die konstituierende Sitzung des Thüringer Landtags abgebrochen werden musste. Der AfD-Politiker Jürgen Treutler, der traditionell als ältester Parlamentarier die erste Sitzung leitete, hatte sich vier Stunden lang geweigert, über eine neue Geschäfts­ordnung abstimmen zu lassen, sodass kein neuer Landtags­präsident gewählt werden konnte.Zwanzig Minuten nach Ende der Aufführung leuchtet die Pushmeldung auf dem Handy auf: «Thüringer Verfassungs­gericht gibt CDU-Antrag statt» –jenem Eilantrag, mit dem die CDU als letzter Ausweg das Landes­verfassungs­gericht anrief, um die Blockade im neuen Landtag zu beenden. Einen Tag nach der Theater­premiere, am 28. September, lässt AfD-Mann Treutler im Landtag gezwungener­massen die Abstimmung zu; CDU-Mann Thadäus König wird zum Landtags­präsidenten gewählt.Eine Formalie? Ein Betriebs­unfall? Mitnichten.«Das mag alles sehr kleinteilig verfahrens­technisch wirken», erklärt Frank Bräutigam, der Rechts­experte der ARD, am Abend des Thüringer Chaos in der deutschen «Tagesschau». «Aber man muss sich bewusst machen: Dahinter stecken grosse, wichtige Abläufe und Grundsatz­fragen der Demokratie in einem Bundesland.»Viele Expertinnen hatten gewarntWar die offenkundig strategische Aktion der AfD überraschend? Nein. «Viele juristische Expertinnen und Experten hatten schon vor vielen Monaten darauf hingewiesen, dass es so einen ersten Tag geben könnte», sagt Bräutigam. Einige Verfahrens­regeln in der Geschäfts­ordnung seien nicht eindeutig. Es gab Vorschläge der Thüringer Grünen, diese Regeln klarer zu fassen, aber die CDU stoppte eine Lösung, die das böse Spiel hätte verhindern können.Eine Woche vor der chaotischen Sitzung schreibt Maximilian Steinbeis auf seinem Forum «Verfassungsblog»: So kann, und ich wage mal die Prognose: wird die AfD diese erste Sitzung des neuen Thüringer Landtags nach allen Regeln der Kunst in ein Spektakel verwandeln, das den Zuschauer*innen einmal mehr den Eindruck vermittelt, den sie ihrem Publikum die ganze Zeit vermitteln will: Demokratie ist Quatsch, korrupt und kaputt, solange und soweit das «wahre Volk» nicht permanent in ihr sein Spiegel­bild erkennt. Das ist das schaurige Theater, das die AfD aufzuführen gedenkt in den nächsten fünf Jahren, beginnend diesen Donnerstag.Steinbeis betreibt seinen Verfassungs­blog seit 25 Jahren. Es ist ein Diskussions­ort für verfassungs­rechtliche Fragen in «Deutschland, dem entstehenden gemeinsamen europäischen Verfassungs­raum und darüber hinaus». Das Portal sucht die Lücken in den Verfassungen, die autoritäre Populisten als Einfalls­tore nutzen könnten, um die Demokratie auszuhebeln. Die Juristinnen wollen die Länder Europas resilienter gegen Demokratie­feinde machen.Aus demselben Antrieb hat Steinbeis vor kurzem auch ein Sachbuch zum Thema veröffentlicht: «Die verwundbare Demokratie». Darin heisst es:Wer den Möglichkeits­raum, als den die autoritären Populisten die demokratische Verfassung betrachten, überblickt, wird sich rechtzeitig zu Protest und Widerstand wappnen können, bevor aus Möglichkeiten Wirklichkeiten geworden sind und es für Gegenwehr zu spät ist.Die Aufgabe ist weniger kompliziert, als man denken könnte. Denn die Vorgänge in Deutschland sind nicht präzedenzlos. Im Gegenteil, leider. Speziell das Vorgehen von Viktor Orbán in Ungarn und der PIS in Polen dient den Juristen – und wohl auch den Populistinnen – als Blaupause für die Vorgänge.In manchen Ländern, schreibt Steinbeis, seien Populisten an der Regierung (etwa Ungarn, Indien, Italien, Venezuela, Türkei), in anderen stünde ihre Macht­beteiligung an (etwa Frankreich, Spanien, Niederlande, Österreich), in einigen wenigen wurden sie abgewählt, zumindest vorerst (etwa Polen, USA, Brasilien). Und auch wenn der Populismus in unter­schiedlicher Gestalt auftrete, verfolge er doch überall die gleiche Strategie: Er wolle, so Steinbeis, die Institutionen der liberalen Verfassung missbrauchen «zur Errichtung eines autoritären Regimes».«All’alba vincerò!», er weiss, dass er bei Sonnenaufgang siegen wird: Mit der Arie «Nessun dorma» aus Giacomo Puccinis «Turandot» endet das Stück. Dieter HartwigSteinbeis’ Buch fasst die Ergebnisse seines «Thüringen-Projekts» zusammen, das der Verfassungs­blog vor den Landtags­wahlen in Sachsen, Thüringen und Brandenburg initiiert hatte. In über hundert Gesprächen mit Politikerinnen, Beamten, Richterinnen, Wissenschaftlern und Vertreterinnen der Zivil­gesellschaft wurde durchgespielt, «welche Spielräume eine autoritär-populistische Partei auf Landes­ebene hätte, um ihre Macht zum Schaden der Demokratie einzusetzen» und ihre Regierung abzuschotten gegen rechts­staatliche Kontrolle, demokratischen Wettbewerb und öffentliche Kritik.Das Ergebnis der Untersuchung, kurz gesagt: Die Spielräume für dieses Vorgehen wären gross.Die juristischen Expertinnen wissen, wo die Lücken in den Gesetzen sind. Sie können auch Vorschläge machen, wie sie gestopft werden können. Aber dafür zuständig ist die Legislative, die Politik. Und wenn Politiker die eigenen Macht­ambitionen über den Schutz der Institutionen stellen und die Öffentlichkeit die Gefahr nicht realisiert, bleibt der Schutz unzureichend und die Institutionen nehmen Schaden – wie sich in Thüringen gezeigt hat.Vor fünf Jahren hatte Steinbeis schon einmal ein ähnliches Gedanken­experiment durchgespielt wie jetzt mit dem «Volksbürger»-Stück. Das Szenario damals: Ein populistischer Bundes­kanzler, ausgestattet mit der absoluten Mehrheit, hebelt das für Deutschland so wichtige Bundes­verfassungs­gericht aus. Der Text wurde damals zuerst als Essay in der «Süddeutschen Zeitung» veröffentlicht, dann auf dem Verfassungsblog. Schliesslich verwandelte Steinbeis auch diesen Essay in ein Theater­stück, das 2020 für das asphalt Festival Düsseldorf inszeniert wurde (hier ist ein Mitschnitt abrufbar).Der Schrecken, den die Überlegungen auslösten, reichte tief. So tief, dass sich Ende Juli dieses Jahres die Ampel­parteien und CDU/CSU zusammen­schlossen und sich auf ein Massnahmen­paket einigten, mit dem sie mit ihrer Zweidrittel­mehrheit die Lücken schliessen und die Institution Bundes­verfassungs­gericht besser schützen wollen.Demokratien sind nicht wehrlos.Aber, sagt ZDF-Rechts­expertin Sarah Tacke, «auch das muss man ganz klar sagen: Wenn mal Verfassungs­feinde in der Mehrheit sind, dann nützt das alles nichts. Eine Demokratie kann nur geschützt werden von einer Mehrheit von Menschen, die hinter ihr und ihren Institutionen stehen.»Zum Stück und zum Buch«Ein Volksbürger». Eine politische Farce im Haus der Bundes­pressekonferenz. Inszenierung von Nico and the Navigators, Regie: Nicola Hümpel. Abrufbar in der Arte-Mediathek.Maximilian Steinbeis: «Die verwundbare Demokratie. Strategien gegen die populistische Übernahme». Hanser, München 2024. 304 Seiten. ca. 39 Franken."
