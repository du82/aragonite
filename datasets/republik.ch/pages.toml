["https://republik.ch/2025/02/20/demokratie-unter-druck-warum-hoffnung-politisch-ist"]
title = "Warum Hoffnung politisch ist – Republik"
description = "Die Lage ist aussichtslos. Also hoffen wir. Serie «Demokratie unter Druck», Folge 4."
full_description = "Warum Hoffnung politisch istDie Lage ist aussichtslos. Also hoffen wir. Serie «Demokratie unter Druck», Folge 4.Von Daniel Graf (Text) und Maria Contreras (Illustration), 20.02.2025FolgenMerkenTeilen165 Beiträge16519 Minuten19'Diesen Beitrag anhören0:00 / 26:301. Pandoras ErbenNichts leichter momentan, als zu verzweifeln. Donald Trump betreibt genau den Brachial­abbau von Demokratie und internationaler Ordnung, der zu erwarten war. Der russische Angriff gegen das gesamte Territorium der Ukraine geht in sein viertes Jahr, und Putin kriegt Schützen­hilfe aus dem Weissen Haus. In Nahost: fragile Waffenruhe, aber noch keinerlei Perspektive für dauer­haften Frieden. Der Sudan noch immer im toten Winkel der öffentlichen Wahrnehmung. Derweil kommen aus dem Kongo schon die nächsten Schreckens­meldungen.Im unmittelbaren Nahbereich: Italien sogenannt «post­faschistisch», Frankreich und Österreich immer kurz vor dem Dammbruch. Und in Deutschland folgt auf einen düsteren Januar/Februar wohl der Merz. Also die personifizierte Erschütterung des Vertrauens, dass die Konservativen mithelfen, ein Bollwerk gegen Rechts­aussen zu bilden.So weit die Lage, kleine Auswahl. Vom Versagen bei der grössten politischen Heraus­forderung, der Klimakrise, war da noch gar nicht die Rede.Es lässt sich jedenfalls auch im Westen schwer übersehen: Die demokratischen Kräfte sind in der Defensive, die autoritären auf dem Vormarsch. Und für ein tiefes Doomscrolling-Gefühl reicht die «Tagesschau».Kein Wunder, herrscht im Buchmarkt seit zwei, drei Jahren ein regelrechter Boom ums Thema Hoffnung – die Sachbuch­regale sind seit jeher ein guter Indikator für das, was im kollektiven Seelen­haushalt gerade Mangel­ware ist. Und deshalb umso heftiger ersehnt wird.«Hoffnung hat in der Polykrise der Gegenwart Hoch­konjunktur», schreibt Jonas Grethlein in seiner Kultur­geschichte der Zuversicht, einem der wirklich empfehlens­werten Bücher in einem, sagen wir, qualitativ recht heterogenen Feld. Grethlein ist Altphilologe und Spezialist für das antike Griechenland, was erstens darauf hindeutet, dass das Thema Hoffnung schon ein paar Menschen vor uns umgetrieben hat. Zweitens, und das ist für reine Gegenwarts­menschen vielleicht überraschender: Die Hoffnung hat in der Geistes­geschichte keineswegs nur einen positiven Ruf.Beim antiken Dichter Hesiod ist der Mythos von der «Büchse der Pandora» überliefert. Pandora hat von den Göttern ein Gefäss anvertraut bekommen, das unbedingt verschlossen bleiben soll. Als sie es dennoch öffnet (man merkt den misogynen Drall des Narrativs), entweichen der Büchse alle Übel der Welt, verteilen sich um die Erde, und der Mensch ist fortan mit Tod, Krankheit, Hass und Krieg geschlagen. In der Dose zurück bleibt einzig und allein: die Hoffnung.Seither streiten die Gelehrten: Ist die Hoffnung nun das heilende Gegen­gewicht zu all den Lastern der Welt? Oder selbst das schwer­wiegendste Übel von allen, weil sie den Menschen träge macht und vom Kampf gegen die Missstände abhält?Seit Hesiod ist in unzähligen Variationen für die eine oder andere Zuschreibung gestritten worden. Das Team der Hoffnungs-Anwälte (Immanuel Kant, Ernst Bloch, Martha Nussbaum …) setzt auf Zuversicht als Treiber der Veränderung zum Guten. Die Hoffnungs-Verächter (ganz vorne: Arthur Schopenhauer und Friedrich Nietzsche) zeihen die Hoffnungs­vollen der Selbst­täuschung. Und weil der Volksmund gerne Hoffnung und Optimismus gleichsetzt, wiederholt sich auf dieser Ebene das Spiel: Das Pro-Optimismus-Lager erstellt lange Listen darüber, was in der Welt alles hell und gut ist. Team Pessimismus ebenso lange Mängel­listen voller Missstände und Miseren.Wenn aber auch die klügsten Köpfe nach Tausenden von Jahren keinen Konsens darüber erzielt haben, ob die Hoffnung nun etwas Gutes oder Schlechtes ist, liegt es vermutlich daran, dass dieses Einteilungs­spiel ein bisschen zu simpel ist. Dass es eben auf Kontext ankommt. Dass es eine entscheidende Rolle spielt, wer wann worauf mit welchen Gründen hofft.Das gilt umso mehr für die Hoffnung als politisches Phänomen. Denn zwischen der gegenwärtigen Krise der Demokratie und der aktuellen Hoffnungs­bedürftigkeit besteht ein direkter Zusammen­hang. Weil Demokratien von der Mitwirkung ihrer Bürgerinnen und der Gestaltbarkeit der Zukunft leben, sind sie dringend auf kollektive Hoffnung angewiesen. Hoffnung «eröffnet eine Politik des Möglichen», schreibt die französisch-israelische Soziologin Eva Illouz, die sich in den letzten Jahrzehnten so intensiv wie kaum jemand sonst mit der politischen Dimension von Emotionen beschäftigt hat, und fügt hinzu: «Hoffnung ist somit ein zentrales Merkmal der Demokratie.» Oder wie es der Norweger Lars Svendsen in seiner ausgezeichneten «Philosophie der Hoffnung» formuliert: «Ohne Hoffnung gibt es nur politische Apathie.»In diesen Sätzen kommt eine bemerkenswerte Verschiebung zum Ausdruck, die Wissenschaftler gerne einen Paradigmen­wechsel nennen: War die Hoffnung jahrhunderte­lang in der Domäne von Religion und Metaphysik verortet, gilt sie heute, wie Jonas Grethlein ausführt, primär als «politische Tugend». Nur, siehe oben: Eine allzu selbst­verständliche Verortung der Hoffnung auf der Tugendseite übersieht die Ambivalenzen politischer Gefühls­dynamiken. Anders gesagt: Auch fanatische Trumpisten hoffen. Ob aus Hoffnung eine Tugend wird, hängt also von den Werten und Handlungen ab, die mit ihr verbunden werden.Für die Verteidigung der Demokratie und die Abwehr faschistischer Tendenzen lauten die Fragen deshalb: Wie lässt sich in Zeiten von Horror­meldungen und Demokratie­krise eine genuin demokratische Hoffnung kultivieren? Wie gelingt es, sich weder von den ständigen Negativ-News nieder­drücken zu lassen noch in naiven Optimismus zu verfallen? Wie sieht eine aufgeklärte, zeitgemässe Form von Hoffnung aus? Aber auch: Was sind die grossen Hoffnungs­killer – und wie kann man ihnen entgegen­wirken?Gerade für Letzteres lohnt sich, wohl oder übel, noch einmal der Blick auf den Wahnsinn im Weissen Haus.2. HoffnungskillerDer Prototyp des Donald-Trump-Textes ist die Liste. Abertausende von Artikeln sind in den letzten Jahren erschienen, deren Grund­modus die Aufzählung ist: Trumps Lügen, seine Verbrechen, seine Skandale, Pleiten, Provokationen und Ruchlosigkeiten – man kommt nicht mal beim Aufzählen der Kategorien hinterher. Trotzdem haben Medien­schaffende und Intellektuelle in den letzten Jahren ganze Kataloge an triftigen Gründen dafür zusammen­getragen, weshalb man diesen Mann niemals nur auch in die Nähe eines politischen Amtes, geschweige denn ins Weisse Haus lassen sollte. Nur: Genau da hockt er jetzt wieder, feuert von Tag eins an regelrechte Salven des Irrsinns in die Welt. Und was macht die Welt­öffentlichkeit? Neue Listen erstellen.Um nicht missverstanden zu werden: Natürlich muss all das dokumentiert und jede seiner Taten und Ankündigungen sehr, sehr ernst genommen werden. Vor allem tun der Rechtsstaat, die Institutionen und die Zivil­gesellschaft gut daran, sich Trump mit aller Macht in den Weg zu stellen. Es fragt sich bloss, wie sinnvoll es dafür ist, permanent Trumps Agenda­setting hinterher­zuhecheln und die mediale Aufmerksamkeits­ökonomie an der Frequenz seiner Selbst­inszenierungen auszurichten.Jede dieser Listen, emsig erstellt und schon im selben Moment wieder veraltet, ist für Trump-Fans ja nichts anderes als ein Leistungs­ausweis ihres Helden, eine Art Diskurs gewordenes Phallus­symbol – je länger, desto besser. Man kann einem Hardcore-Narzissten keinen grösseren Gefallen tun, als seinen zur Schau getragenen Tatendrang in ständig neuen Eilmeldungen zu protokollieren.Doch was viel wichtiger ist: die Auswirkungen, die das Ganze auf Trumps politische Gegnerinnen hat. Diese durch medialen Dauer­beschuss beschäftigt zu halten, abzulenken, ständig neu zu überrumpeln und vom Wesentlichen abzuhalten, entspricht nämlich genau jener «Flood the zone»-Strategie, die Steve Bannon der Neuen Rechten weltweit schon vor Jahren ins Stammbuch geschrieben hat.Der Journalist Ezra Klein hat kürzlich eindrucksvoll beschrieben, was der kalkulierte Effekt dieser Hochfrequenz-Aufregung ist: Verwirrung und Über­forderung beim politischen Gegner stiften. Angst verbreiten. Aber auch: sich aufplustern und die Illusion von Allmacht hervorrufen, wie sie – bei allem tatsächlich entstehenden Schaden – weit über Trumps Macht­befugnisse und Einfluss­sphären hinausgeht.Es ist die Überrumpelungs­taktik von einem, der genau weiss, dass er an Substanz, Sachkenntnis, Kompetenz und menschlichen Werten nichts anzubieten hat – und deshalb schon immer bloss mit Einschüchterung und hemmungsloser Selbst­vergrösserung weiter­kommt. (Letzteres – darauf weist die Polit­ökonomin Maja Göpel in ihrem neuesten Buch nachdrücklich hin – ist übrigens eine Strategie aller autoritären Populisten, die behaupten, den Mehrheits­willen zu repräsentieren, selbst wenn sie noch irgendwo bei zehn Prozent dümpeln. Wenn sie es damit aber schaffen, den Diskurs zu kapern, weil die Öffentlichkeit und die anderen Parteien, wie jüngst wieder in Deutschland, sich die Themen und die Strategie der Diskurs­zerstörung aufdrücken lassen, dann haben die Rechts­extremen damit leider mächtige menschliche Herdentier­effekte auf ihrer Seite – und am Ende tatsächlich wachsende Zustimmungswerte.)Trumps erste Amtstage 2025 und die sorgfältig inszenierte Show um seine Dekrete sollen nichts anderes vermitteln als: So kommt es, weil ich es verkünde – Widerstand zwecklos.Es kommt aber nur so, wenn alle anderen ihn gewähren lassen. Und weil von seinen Vasallinnen genau das zu erwarten ist und sich mit ihnen eine wachsende Zahl von Radikal­opportunisten aus Wirtschaft und Plattform­kapitalismus einstweilen für voraus­eilenden Gehorsam entschieden hat, kommt es umso mehr auf all die anderen an. Auf Richterinnen, die Trumps Allmachts­fantasien rechtsstaatliche Grenzen setzen; auf Politiker weltweit, die Trumps Erpresser­spielchen selbstbewusst entgegen­treten; auf die Wehrhaftigkeit der Institutionen, auf die es Trump und sein Demokratie­zertrümmerungs-Beauftragter Elon Musk besonders abgesehen haben; aber auch und gerade auf die Zivilgesellschaft, die langsam aus der Schock­starre aufzuwachen beginnt.Der Jurist David Cole hat bereits kurz nach der Wahl luzide dargelegt, welche gesellschaftlichen Kräfte nun im Einzelnen gefragt sind. Denn «checks and balances» ist nichts, was einfach so besteht – es ist ein System, das im Zusammen­spiel der gesellschaftlichen Akteurinnen immer wieder neu gestärkt und wirksam gemacht werden muss. Genau diesen Prozess wollen Trump und Co. mit ihrer Strategie der Überrumpelung aushebeln. Es soll aussichtslos erscheinen, sich ihnen zu widersetzen. Und aussichtslos ist es ganz sicher – wenn man das Spiel nach Trumps Regeln mitspielt. Das tun die Gerichte bislang keineswegs, wie David Cole soeben in einer Bilanz der ersten Amtstage aufgezeigt hat. Doch werden Trumps Angriffe auf die Verfassung weitergehen und am Ende vielfach vor dem Supreme Court landen.Und die Öffentlichkeit?Versteht man, mit Eva Illouz, Hoffnung als demokratie­relevante Emotion, weil «sie unseren Möglichkeits­sinn entwickelt und schärft und damit unser Gefühl der Selbst­ermächtigung beeinflusst», dann wird deutlich: Trumps «Flood the zone»-Prinzip zielt darauf ab, jegliche Opposition schon im Vornherein zu entmutigen und zu lähmen. Sie ist vor allem eine Strategie der Hoffnungs­zerstörung.Warum das ein entscheidender Punkt ist?Weil die Grund­voraussetzung dafür, dass Hoffnung erhalten werden, wachsen und zu aktivem Handeln führen kann, darin besteht, dass man sie sich nicht kaputt­machen lässt. Jedes Nachdenken darüber, wie sich auch in diesen Zeiten Hoffnung finden und stärken lässt, muss damit anfangen, den Hoffnungs­killern und Entmutigungs­strategien entgegen­zuwirken.Für den öffentlichen Diskurs, die Medien und ihren Konsum heisst das: Reflexion statt Reflexe. Sich nicht permanent von Trump und Konsorten die Agenda vorgeben lassen. Statt ständig neuer Geschichten, in denen er der einzige Protagonist und aktiv Handelnde ist: mehr Aufmerksamkeit für die, die sich ihm entgegenstellen. Anstatt jede seiner Botschaften samt ihrer kalkulierten Emotions-Eskalation in Echtzeit zu verstärken: entschleunigen, filtern. Nüchtern seine Strategien analysieren. Statt sein Framing zu übernehmen, den Fokus neu ausrichten – zum Beispiel auf die Kritik und den Widerstand gegen Trump.Das gilt für den Umgang mit der radikalen Rechten generell. Trump ist nur das grellste und erfolgreichste Exempel für die Kommunikations­strategie der Autoritären, denen es am Ende immer um zwei Dinge geht: die Setzung der Themen im Erregungs­diskurs. Und die Verbreitung von Angst.Autoritäre Politik ist Angstpolitik – weshalb Hoffnung darin nur in Form einer messianischen Erlösungs­sehnsucht vorgesehen ist. Trumps einzige endlos variierte Wahlkampf­botschaft lautete entsprechend: Alles geht den Bach runter, «but I will fix it» – ich allein werde es richten. Unnötig zu betonen, dass er mit seinen dystopischen Beschreibungen nicht etwa den Klima­kollaps, den Vormarsch des Faschismus, eklatante soziale Ungleichheit oder irgendein anderes reales Problem der Gegenwart meinte, sondern ein Phantasma vom Untergang der USA aufgrund von «Wokeismus» und allem, was irgendwie links von ihm selbst steht.Das Ineinander von Aggression und Rührseligkeit auf den Trump-Rallys, der Ergriffenheits­kitsch der Trump-Jünger, ihr unbedingter Wille zur Vergottung ihres Idols – all das ist die pervertierte, autoritäre Form von Hoffnung, die nur noch die blinde Gefolgschaft und die Unter­werfung unter eine religiös verbrämte Erlöser­figur kennt. Hoffnung als Extrem­form der selbst gewählten Unmündigkeit – was für eine zynische Pointe.Demgegenüber kann demokratische Hoffnung nur konsequent aufklärerisch sein – mit gedanklicher und gesellschaftlicher Aktivität verbunden, und das heisst eben auch: mit Arbeit. Mit der Bereitschaft, Verantwortung zu übernehmen. Der Bereitschaft, selber zu denken, aber nie nur an sich.Das Lied der Autoritären klingt in allen Sprachen gleich: Das System ist kaputt, du kannst niemandem trauen (ausser uns), alles läuft falsch und wir kennen die Schuldigen. Die populistische und rechts­extreme Politik der Spaltung und des Ressentiments braucht als Grund­raunen die Stimmung absoluter Negativität.Schon deshalb lohnt es sich, die Soziologin Franziska Schutzbach ausführlich zu zitieren, wenn sie in ihrem Buch «Revolution der Verbundenheit» die Voraus­setzungen für eine Kultur der Solidarität benennt – und nebenbei den Beweis erbringt, dass manche der inspirierendsten neuen Hoffnungs-Bücher das Wort nicht unbedingt im Titel tragen:Die radikale Kritik des Bestehenden allein bewirkt keinen Wärmestrom und keine Hoffnung. Nur zu kritisieren, zu negieren ist deprimierend und nieder­schmetternd, es wiederholt jene Erfahrungen in unserer Gesellschaft, die ohnehin verbreitet sind: Ohnmacht, Mut- und Ratlosigkeit, Angst und Abscheu. Wenn wi"
