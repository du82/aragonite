["https://republik.ch/2025/01/13/wie-viele-menschen-sollen-in-der-schweiz-leben"]
title = "Wie viele Menschen sollen in der Schweiz leben? – Republik"
description = "Aktuelle Zahlen zeigen: Die Schweiz wird 2025 weiter wachsen. Aber nur zu einem sehr geringen Teil wegen Asyl- und Schutz­suchenden."
full_description = "Wann wird es zu eng in der Schweiz, zum Beispiel hier am Bahnhof Zürich? Beat StreuliWie viele Menschen sollen in der Schweiz leben?Die Schweiz wird 2025 weiter wachsen. Jetzt zeigen Zahlen erstmals: Das geschieht nur zu einem sehr kleinen Teil wegen der Asyl- und Schutz­suchenden. Zu einem sehr grossen aber wegen der Zuzüger aus der Europäischen Union.Von Lukas Häuptli, 13.01.2025FolgenMerkenTeilen141 Beiträge14112 Minuten12'Diesen Beitrag anhören0:00 / 19:07Wann ist viel zu viel?1970 lebten in der Schweiz rund 6 Millionen Menschen. Heute sind es 9 Millionen. Und 2050 werden es um die 10 Millionen sein. Mindestens.Die Zahl hat das Bundesamt für Statistik errechnet. Allerdings war das vor vier Jahren, und seither ist die Welt bekanntlich eine andere geworden. Russland hat die Ukraine angegriffen und Millionen von Menschen aus der Heimat nach Europa vertrieben. Die SVP zündete die nächste Stufe ihrer Anti-Ausländer-Politik und lancierte ein Volks­begehren mit dem irre­führenden Namen Nachhaltigkeits­initiative. Und spätestens seit letztem Jahr steht fest, dass nicht nur die selbst ernannte Volks­partei die Zuwanderung begrenzen will. Auch die Präsidenten von FDP und Mitte, ja selbst SP-Bundesrat Beat Jans ist für eine griffige Schutz­klausel, mit der die Schweiz bei Bedarf die Einwanderung aus der EU einschränken kann. Deshalb dürften die Szenarien des Bundesamts bereits jetzt überholt sein.Fest steht, dass die Frage der Zuwanderung die politische Debatte in der Schweiz 2025 prägen wird. Schon im Frühling will der Bundesrat seine Botschaft zur Nachhaltigkeits­initiative verabschieden, über die anschliessend das Parlament und dessen Kommissionen befinden müssen. Und im Sommer sollen die Gesetzes­änderungen in die Vernehmlassung gehen, die für eine neue Schutzklausel nötig werden.Hinter alledem wird die Frage stehen: Wann ist viel zu viel?Die SVP verlangt mit ihrer Initiative, dass bis 2050 höchstens 10 Millionen Menschen in der Schweiz leben. Das soll, so die Partei, eine «nachhaltige Bevölkerungs­entwicklung» sichern, angeblich «zum Schutz der Umwelt und im Interesse der dauerhaften Erhaltung der natürlichen Lebens­grundlagen, der Leistungs­fähigkeit der Infra­strukturen, der Gesundheits­versorgung und der schweizerischen Sozial­versicherungen».Die SP sagt, auch 12 Millionen wären vertretbar. Partei­präsident Cédric Wermuth erklärt aber, er wünsche sich weder 10, 12 noch 16 Millionen. Sondern: «Ich wünsche mir, dass es jenen Menschen gut geht, die hier sind.»Sibylle Wälty wiederum, eine Wissenschaftlerin der ETH, sagt, dass es selbst 16 Millionen sein könnten. Dafür müsste die Schweiz aber die Konzepte der 10-Minuten-Nachbarschaften umsetzen. Wälty erklärt: «In 10 Minuten muss zu Fuss alles erreichbar sein, was man im Alltag braucht: Bäckerei, Super­markt, Coiffeur, Bahnhof, Café, Restaurants, Park und Kinder­garten. Und im Idealfall auch die Arbeit.»«Nicht mehr erträglich»Doch das alles zählt gerade nicht.Was die SVP schon vor Jahrzehnten zum Kern ihrer Politik gemacht hat, ist nämlich längst in die Programme der FDP und der Mitte gesickert: Es kommen zu viele. Und es kommen die falschen Ausländer.Zu viele Ausländerinnen – und erst noch die, die die Schweiz weder will noch braucht.Was die Rechte meint (und mit ihr mittler­weile selbst der Wirtschafts­dachverband Economie­suisse): Wenn die Schweiz die Zuwanderung bremsen will, muss sie in erster Linie die Zuwanderung der Asyl­suchenden bremsen.Das tönte letztes Jahr so:«Die Asylpolitik hat ein Ausmass erreicht, das nicht mehr erträglich ist.» (SVP-Präsident Marcel Dettling am 5. August 2024)«Wir müssen bei der ganz grossen Mehrheit, die ohne Asylgrund illegal in die Schweiz einreist, viel härter durchgreifen.»(FDP-Präsident Thierry Burkart am 2. September 2024)«Wer kein Recht auf Asyl hat, soll schneller in die Herkunfts­länder zurück­geführt werden können.»(Mitte-Präsident Gerhard Pfister am 24. Februar 2024)«Ein wichtiger Grund für die Ängste (…) liegt meiner Meinung nach bei der Asylmigration. Die Probleme im Vollzug des Asyl­wesens belasten die Zuwanderungs­diskussion.»(Economiesuisse-Präsident Christoph Mäder am 18. Dezember 2024)Die Botschaft der Rechten (und der Wirtschaft): Die Einwanderung über das Asyl­system in die Schweiz ist viel zu hoch.Lediglich 12 Prozent sind Asyl­einwanderungNur: Wie gross diese Einwanderung genau ist, weiss bis jetzt gar niemand. Das hat einen einfachen Grund: Das Staats­sekretariat für Migration weist zwar regelmässig den sogenannten Wanderungs­saldo der Schweiz aus – und dieser findet ebenso regelmässig Eingang in die Medien. In den ersten sechs Monaten des letzten Jahres beispiels­weise betrug er rund 40’000 Menschen, und zwischen 2014 und 2023 lag er bei rund 680’000 Menschen. Dabei berücksichtigt das Staats­sekretariat aber lediglich diejenigen Ausländer, die mit einer Niederlassungs­bewilligung, einer Aufenthalts­bewilligung oder einer Kurzaufenthalts­bewilligung von mehr als einem Jahr in der Schweiz leben.Anders das Bundesamt für Statistik. Es rechnet neben diesen Gruppen auch alle Asyl­suchenden, Schutz­suchenden und vorläufig Aufgenommenen, die sich seit mindestens einem Jahr in der Schweiz aufhalten, zur ständigen ausländischen Wohn­bevölkerung.Jetzt hat das Bundesamt auch erstmals ausgewertet, wie stark die Asyl-Migration im Vergleich zur übrigen Migration in den letzten zehn Jahren zum Bevölkerungs­wachstum der Schweiz beigetragen hat. Grundlage für die Auswertung bildeten Längs­schnitt­daten aus der Demografischen Verlaufsstatistik des Amts.Ich will es genauer wissen: Wie die Zahlen zustande kamenDas Bundesamt für Statistik errechnete konkret die Zahl derjenigen Menschen, die zwischen 2014 und 2023 als Asyl­suchende, Schutz­suchende aus der Ukraine oder Angehörige von vorläufig Aufgenommenen in die Schweiz gelangten und sich am Ende des Beobachtungs­zeitraums, also Ende 2023, noch hier aufhielten. Die gleiche Berechnung machte das Amt mit denjenigen Personen, die in derselben Zeit im Rahmen von Personen­freizügigkeit oder Drittstaaten­kontingenten als Erwerbs­tätige, als Studierende oder als deren Familien­angehörige in die Schweiz einwanderten und Ende 2023 noch hier waren. Diese Personen reisten im Wesentlichen mit Aufenthalts- oder Niederlassungs­bewilligungen in die Schweiz ein und stammen vor allem aus der EU.In Zahlen: Zwischen 2014 und 2023 wanderten rund 260’000 Menschen als Asyl-Migranten in die Schweiz ein; Ende 2023 hielten sich von ihnen noch rund 120’000 hier auf. Bei den übrigen Migranten (vor allem aus der EU) wanderten im Beobachtungs­zeitraum rund 1’590’000 Personen ein, von denen Ende 2023 noch rund 920’000 hier waren. Familien­angehörige von anerkannten Flüchtlingen, die mit einer Aufenthalts­bewilligung in die Schweiz einwandern, sind in diesem Zusammenhang praktisch vernachlässigbar; sie machten beispiels­weise 2023 lediglich 0,8 Prozent aller Zuwanderer in die Schweiz aus.Das Ergebnis der Auswertung, das der Republik exklusiv vorliegt, ist erstaunlich: Die Einwanderung von Asyl- und Schutz­suchenden machte zwischen 2014 und 2023 lediglich rund 12 Prozent des gesamten einwanderungs­bedingten Bevölkerungs­wachstums der Schweiz aus. Ohne die Schutzsuchenden aus der Ukraine (die bekanntlich erst seit 2022 einwandern) läge die Zahl sogar noch tiefer, nämlich bei rund 7 Prozent.Aber auch 12 Prozent sind deutlich weniger, als diejenigen vermuten lassen, die in der Schweiz immer schärfere Massnahmen gegen Asyl­suchende, Schutz­suchende und Geflüchtete fordern.Stellt sich die Frage: Warum stehen Asyl- und Schutz­suchende trotzdem derart im Fokus der rechten Parteien sowie weiter Kreise von Medien und Bevölkerung? Der grüne Nationalrat Balthasar Glättli, der eben eine Schrift zur Schweizer Asylpolitik veröffentlicht hat, sagt zur Republik: «In der EU-Zuwanderungs­debatte missbrauchen FDP, Mitte und Wirtschafts­kreise Asyl­suchende politisch gezielt.» Im Asylbereich liege die nationale Schutz­quote faktisch seit Jahren bei etwa 75 Prozent; das zeige, dass die meisten Gesuch­steller, deren Gesuche in der Schweiz inhaltlich beurteilt würden, auch tatsächlich schutz­bedürftig seien. «Statt für den Schutz dieser Menschen einzustehen und gleichzeitig mit positiven Argumenten für die bilateralen Verträge und die Personen­freizügigkeit zu kämpfen, machen die Bürgerlichen aus Angst vor der SVP eine Sündenbock­politik gegen Asyl­suchende. Sie meinen, so der Zuwanderungs­debatte aus dem Weg gehen zu können.»Dass das überhaupt funktioniere, sei auch der selektiven medialen Aufmerksamkeit geschuldet: «In den Medien werden oft nur steigende Gesuchs­zahlen dramatisiert», sagt Glättli. «Sinken dagegen die Gesuchs­zahlen oder verlassen Geflüchtete unser Land oder werden abgeschoben, so macht das keine Schlagzeilen.»Der Fokus auf die Gesuchs­zahlen verhindere auch den Blick darauf, dass viele abgewiesene Asyl­suchende nach einem negativen Entscheid kontrolliert ausreisen würden. Auch mehr als 30’000 anerkannte Schutz­suchende aus der Ukraine hätten die Schweiz in der Zwischen­zeit wieder verlassen. Fast 90 Prozent stammen aus der EUDie übrige Einwanderung dagegen machte zwischen 2014 und 2023 rund 88 Prozent des einwanderungs­bedingten Bevölkerungs­wachstums der Schweiz aus. Dabei handelte es sich wie erwähnt in erster Linie um Zuzügerinnen aus der EU.Rechtliche Grundlage für die Zuwanderung dieser Menschen ist das Freizügigkeits­abkommen zwischen der Schweiz und der EU. Dieses ist seit 2002 in Kraft und baut im Kern auf einem einfachen Grundsatz auf: Wer arbeitet, erhält eine Aufenthalts­bewilligung, und zwar sowohl für sich als auch für seine Angehörigen.Das Abkommen steht immer wieder in der Kritik – jetzt und in der Vergangenheit. So nahmen die Schweizer Stimm­berechtigten 2014 die sogenannte Massen­einwanderungs­initiative der SVP mit einem Ja-Stimmen-Anteil von 50,3 Prozent an. Diese forderte, die Zuwanderung aus der EU mit Kontingenten zu begrenzen. Allerdings setzte der Bund die Verfassungs­änderung nicht wortgetreu um, sondern lediglich mit einem sogenannten Inländer­vorrang light. Damit sollten inländische Arbeit­nehmende in bestimmten Branchen gezielt gefördert werden.Beat StreuliDas Freizügigkeits­abkommen hatte in der Vergangenheit stets eine vehemente Fürsprecherin: die Schweizer Wirtschaft. Ihr Dach­verband Economie­suisse verteidigte die Personen­freizügigkeit immer wieder durch alle Böden und wehrte sich gegen Zuwanderungs­beschränkungen aller Art.Doch das änderte sich jetzt plötzlich: Zwar hat der Bundesrat Ende letzten Jahres und nach Abschluss der Verhandlungen mit der EU betont, die Zuwanderung aus der Europäischen Union müsse «weiterhin auf die Bedürfnisse der Wirtschaft» ausgerichtet werden. Und auch einzelne Vertreter des liberalen Freisinns sowie der Export­branchen verteidigten die Personen­freizügigkeit vehement.Christoph Mäder, der Präsident von Economie­suisse, sagte aber Ende 2024 in einem bemerkenswerten Interview: «Die Schweiz muss die Möglichkeit haben, die Zuwanderung selber zu steuern, wenn diese die erträglichen Grenzen überschreitet. (…) Die Zuwanderung, wie wir sie in den vergangenen Jahren gesehen haben, ist zu stark.»Das sind für einen Economiesuisse-Präsidenten ziemlich neue Töne. Töne, die die Öffentlichkeit in den letzten Jahren fast ausschliesslich aus der SVP vernommen hatte. (Dass Economie­suisse-Präsident Mäder von 2019 bis 2023 im Verwaltungsrat von Martullo-Blochers Ems-Chemie sass, sei hier nur am Rand erwähnt.)Noch weiter als der Economiesuisse-Präsident gehen andere Vertreter der Schweizer Wirtschaft, allen voran diejenigen, die sich rund um die Private-Equity-Gesellschaft Partners Group in der Bewegung «Kompass» zusammen­getan haben. Sie verlangen mit einer Volks­initiative, dass nicht nur die Mehrheit der Schweizer Bevölkerung zu allen künftigen Verträgen mit der EU Ja sagen muss, sondern auch die Mehrheit der Schweizer Kantone. Das erhöht die Möglichkeit, dass die Verträge an der Urne scheitern – und damit stünde auch das Freizügigkeits­abkommen als Ganzes zur Disposition.Plötzlich gibt sich die SVP wachstums­kritischBemerkenswert ist aber nicht nur, dass die Gegner des freien Personen­verkehrs immer zahlreicher und immer lauter werden. Bemerkenswert sind auch ihre – ziemlich neuen und ziemlich überraschenden – Argumente. In deren Kern steht nichts Geringeres als eine Kritik am ungehemmten Wirtschafts­wachstum. Und sie stammen ausgerechnet aus jenen Kreisen, die in der Vergangenheit die Wirtschafts- und Gewerbe­freiheit kaum je infrage gestellt hatten. Und auch das Wirtschafts­wachstum nicht.Heute tönt es da aber plötzlich so:«Der Fachkräftemangel – ein Wort, das die Schweiz vor der EU-Personen­freizügigkeit gar nicht kannte – hat sich seither ständig noch mehr verschärft. Es ist ein Teufelskreis, aus dem wir nicht herauskommen. Denn die Zugewanderten müssen stets aufs Neue durch zugewanderte Fach­kräfte betreut, gepflegt, administriert und verpflegt werden.» (Argumentarium der SVP-Nachhaltigkeits-Initiative)«Irgendetwas stimmt hier nicht. Wir befinden uns in einer Endlos­spirale. Der neue Arzt aus dem Ausland mit Kindern und Frau braucht eine Lehrerin, eine Wohnung, die gebaut werden muss. Dafür braucht es wieder Bauarbeiter, der Bauarbeiter holt seine Familie nach. Es braucht neue Schul­räumlichkeiten … dafür holt man wieder Leute aus dem Ausland usw. Die Spirale dreht sich ungebrochen.» (SVP-Nationalrat Manuel Strupler)«Für mich steht fest, dass es Grenzen des Wachstums gibt. Wo sie sind, hängt davon ab, welche Vorstellungen von der Schweiz man hat.» (SVP-Bundesrat Albert Rösti)Wirtschaftswachstum ist plötzlich eine «Endlos­spirale», ja ein «Teufels­kreis», der der Schweiz nur Probleme bringt.Den wirtschafts­wissenschaftlichen Nährboden für diese Art der Wachstums­kritik hat der Fribourger Wirtschafts­professor Reiner Eichenberger bereitet, der der SVP nahesteht. Die Personen­freizügigkeit, so Eichenberger, habe in der Schweiz zwar zu einem stattlichen Wachstum des Brutto­inlandprodukts geführt, kaum aber zu einem Wachstum des Brutto­inlandprodukts pro Kopf. Dieses verharre seit Jahren praktisch an Ort. Dafür bringe die Zuwanderung sogenannte «Füllungs­effekte» mit sich, etwa die Verknappung von Boden, Wohnraum oder Infrastruktur.Wo Eichenberger recht hat: Zuwanderung führt zu Problemen, zum Beispiel im Wohnungs­wesen und in den Schulen, bei der Verkehrs­infrastruktur und bei der Entwicklung des öffentlichen Raums oder beim Zugang zu staatlichen Leistungen.Nur, und da irrt Eichenberger, sind das nicht Probleme einer Einwanderungs­gesellschaft, sondern diejenigen einer Wachstums­gesellschaft – jeder Wachstums­gesellschaft.Es sind Verteil­probleme, und die entscheidende Frage lautet: Wie werden rare Güter verteilt, wenn immer mehr Menschen nach ihnen nachfragen?Die Antworten auf diese Frage muss die Schweiz in den nächsten Jahren finden. Nicht auf die Frage, wie sie die Zuwanderung begrenzen kann.Der Fribourger Wirtschafts­professor irrt nämlich in einem weiteren "
