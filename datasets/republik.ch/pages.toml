description = "Die Klimakrise ist hier. Die Lage ist ernst. Wir richten den Blick auf Menschen, die die Herausforderung annehmen. Mit Artikeln, Debatten, Veranstaltungen."
full_description = "Der Newsletter für alle, die sich der Klimakrise stellen. Und gemeinsam Wege aus der Krise finden wollen. Neugierig, kritisch, konstruktiv. «Etwas vom weitsichtigsten, hoffnungsvollsten und klügsten, was man derzeit zur Klimakrise lesen kann.» – Julian S. Wie kommen wir aus der Klimakrise? Forschende beantworten die Fragen von vier Menschen – vom Kind bis zur Expertin. Sieben Videos, sieben Lösungs­ansätze, ein Ziel: Komplexes so erklären, dass alle es verstehen. Bloss wie? Wir zeigen Ihnen, wo Sie anfangen können (ohne gleich Ihr ganzes Leben auf den Kopf zu stellen). Jetzt für den E-Mail-Kurs anmelden. Die Klimakrise erfordert systemische Lösungen. Aber Politik und Wirtschaft ändern sich nur, wenn alle als Einzel­personen mitziehen. Mit Familie und Bekannten über die Klimakrise zu sprechen, ist vielen unangenehm. Aber kein Gespräch ist auch keine Lösung. Wir haben einen Vorschlag für Sie. Die Klimabewegung mobilisiert längst nicht mehr so viele Menschen wie früher. Wer setzt sich heute noch für das Klima ein? Und mit welchen Mitteln? Wir haben Aktivistinnen begleitet. «Challenge Accepted» ist das erste Angebot, das aus dem Klimalabor der Republik hervorgeht. Das Klimalabor ist unser Ort für Austausch und Experimente. Gemeinsam wollen wir heraus­finden, wie Journalismus in der Klimakrise seiner Rolle gerecht werden kann. Ein besonderer Dank gilt den Tausenden Menschen, die mit Anregungen und Rückmeldungen die Grundlage geschaffen haben, auf der «Challenge Accepted» nun aufbaut. Mit Ihrer Anmeldung zum Newsletter stimmen Sie den Datenschutzbestimmungen der Republik zu und erlauben uns, Sie gelegentlich auf andere Angebote der Republik hinzuweisen. Die Republik ist ein digitales Magazin für Politik, Wirtschaft, Gesellschaft und Kultur. Finanziert von seinen Leserinnen und Lesern. Mehr über die Republik erfahren. Idee und Umsetzung: David Bauer, Olivier Baumann, Elia Blülle, Annette Keller, Luciana Kolbeck, Marie-José Kolly, Vivienne Kuster, Theresa Leisgang, Tobias Maier, Felix Michel, Jeremy Stucki, Sabrina Weiss."
