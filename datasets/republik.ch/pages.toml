["https://republik.ch/2025/02/12/newsletter-challenge-accepted-sie-bieten-trump-die-stirn"]
title = "Was von den Schweizer Klima­versprechen an die Uno zu halten ist – Republik"
description = "Zudem: Eine Buchempfehlung zur gescheiterten Umwelt­verantwortungsinitiative."
full_description = "«Challenge Accepted»-NewsletterSie bieten Trump die Stirn12.02.2025FolgenTeilen6 Minuten6'Diesen Beitrag anhören0:00 / 8:04Liebe alleHeute im Newsletter für Sie: das Nachtzug-Dilemma; was von den Schweizer Klima­versprechen an die Uno zu halten ist; und eine Buchempfehlung zur gescheiterten Umwelt­verantwortungsinitiative.Zunächst aber: Im letzten Newsletter haben wir aufgezeigt, welch verheerende Folgen für die Umwelt die zweite Trump-Amtszeit haben dürfte. Und auch wenn sich vieles noch genauer zeigen muss, so fällt es gerade nicht leicht, hoffnungsvoll in die USA zu blicken.Darum wollen wir diesmal den Blick auf jene richten, die Trump die Stirn bieten. Menschen und Organisationen, die seine Rücksichts­losigkeit ausbremsen. Die ihm zum Trotz die grüne Transformation voranbringen. Jene, die Trump ein trotzig-beherztes «Challenge accepted!» entgegen­schleudern.Manish Bapna, Michelle Roos, Kate Gallego, Michael Bloomberg, Gina McCarthy, Emily Atkin. (V. l. n. r.) Collage: Souri ThalongManish Bapna. «Die Regierung Trump ist besser vorbereitet als noch vor acht Jahren», sagt der Präsident des Natural Resources Defense Council. «Wir auch.» Die einflussreiche Umwelt­organisation kennt sich mit juristischen Auseinandersetzungen gegen Trumps Klimapolitik bestens aus. Während Trumps erster Präsidentschaft hatte die Organisation 163 Klagen gegen Regierung und Verwaltung geführt – und fast 90 Prozent der Fälle gewonnen. Michelle Roos. Trump hat erneut einen Klimaleugner an die Spitze der Umweltschutz­behörde gesetzt und ihren Zweck ins Gegenteil verkehrt. Dagegen haben sich unter der Leitung von Michelle Roos über 600 ehemalige Mitarbeiterinnen der Behörde zum Environmental Protection Network zusammen­geschlossen. Mit der geballten Expertise tausender Jahre in der Behörde schauen sie ihren Nachfolgern genau auf die Finger und können die Öffentlichkeit über Entwicklungen alarmieren, die sonst übersehen würden. Kate Gallego. Als Bürgermeisterin von Phoenix kennt sie die Auswirkungen der Klimakrise nur zu gut. Vergangenes Jahr war es in der Millionen­stadt an mehr als 100 Tagen am Stück über 37 Grad heiss. Sie steht den Climate Mayors vor, einem Zusammenschluss von 350 Bürger­meisterinnen, die Trump zum Trotz aktive Klimapolitik vorantreiben. Mehr als 60 Millionen Menschen leben in US-Städten, die von Climate Mayors regiert werden.Michael Bloomberg. Während andere Milliardäre sich schamlos Donald Trump andienen, geht der Medien­unternehmer und ehemalige Bürgermeister von New York einen anderen Weg. Er hat angekündigt, dass er mit seiner Stiftung die Finanzierungs­lücke schliessen werde, die sich auftut, wenn die USA wieder aus dem Pariser Klima­abkommen aussteigen.Gina McCarthy. Sie beriet Joe Biden in Klimafragen und war entscheidend daran beteiligt, dass sein monumentales Klimagesetz «Inflation Reduction Act» (IRA) 2022 Realität wurde. Heute leitet sie die Organisation America Is All In, die unter anderem Unternehmen dabei unterstützt, Subventionen und Steuer­gutschriften im Rahmen des IRA zu nutzen, um die Transformation zu einer klima­freundlichen Wirtschaft voranzubringen. Emily Atkin. Die Investigativ­journalistin ist eine der einfluss­reichsten Stimmen ausserhalb der grossen Medienverlage. In ihrem Newsletter hat sie angekündigt, dass sie ein besonderes Augenmerk legen wird auf den direkten Einfluss der Fossil­industrie auf Trumps Klimapolitik.Dies ist selbstverständlich nur eine kleine Auswahl, stellvertretend für die vielen Menschen, die in den USA und darüber hinaus alles tun, um den Schaden der zweiten Trump-Amtszeit zu begrenzen.Wer ist Ihnen besonders aufgefallen? Wen sollten wir auf dem Radar haben? Antworten Sie gern direkt auf diese E-Mail.Das Nachtzug-Dilemma Ambroise TézenasWenn Europa seine Klimaziele einhalten will, müssen Menschen weniger fliegen. Dafür braucht es attraktive Alternativen. Hallo Nachtzug!Auch dank der Klima­bewegung erlebte der ausser Mode gekommene Nachtzug in den vergangenen Jahren ein Comeback. Als Gegenentwurf zu Ryanair und Easyjet, als Sinnbild für entschleunigtes, umweltbewusstes Reisen.Nun droht das Comeback auf halber Strecke stehenzubleiben. Ingwar Perowanowitsch hat für uns das Nachtzug-Dilemma analysiert.Jetzt lesen oder anhörenLesenswert, bei der Republik und anderswoJedes Land, welches das Pariser Klima­abkommen unterzeichnet hat, muss alle fünf Jahre bekannt geben, wie sein Beitrag zur Einhaltung der Klimaziele aussehen wird. Dieses Jahr ist es wieder so weit. Die Schweiz ist als eines der ersten Länder Ende Januar dieser Pflicht nach­gekommen. Was ist von den Versprechen der Schweiz zu halten? Klimapolitik­expertin Alex Tiefenbacher ordnet ein.Das wissenschaftliche Konsortium Climate Action Tracker bietet eine laufend aktualisierte Übersicht über die Versprechen aller Länder, jeweils mit einer Einschätzung, was sie taugen. Die Schweiz erhält das Prädikat «ungenügend». Das Konsortium kritisiert, dass die Lücke zu dem, was die Schweiz zu den Pariser Reduktions­zielen beitragen müsste, grösser statt kleiner wird. «Ernsthafte Zweifel an der Ambition der neuen Versprechen» seien angebracht.Die Schweiz erwärmt sich etwa doppelt so stark wie das globale Mittel. 2024 war rund 2,9 Grad wärmer als der Durchschnitt aus vorindustrieller Zeit. Dies geht aus der aktualisierten Übersicht von Meteo Schweiz hervor, dem Bundesamt für Meteorologie und Klimatologie.Wir befinden uns mitten in existenziellen Krisen. Warum sind wir nicht in der Lage, uns den Ernst der Lage einzugestehen? Daniel Strassberg befasst sich in seiner aktuellen Philosophie-Kolumne mit unserer Unfähigkeit zu trauern.Falls Sie es noch nicht gesehen haben – unser Video: Können wir mit «künstlichen Wolken» die Klima­erwärmung bremsen? Und wenn ja, wäre das klug?Machen Sie es wie wir: Investieren Sie in KlimajournalismusMit einem Jahresabo der Republik sichern Sie sich Zugang zu Journalismus, der sich um die wirklich wichtigen Themen kümmert. Und Sie tragen Ihren Teil dazu bei, dass «Challenge Accepted» noch lange weiter­bestehen kann.Jetzt Abo zum Einstiegspreis sichernDas gute BuchDie Umweltverantwortungs­initiative blieb am Sonntag wie erwartet chancenlos. Die Frage geht aber natürlich nicht weg: Wie können wir künftig so leben, dass wir nicht unsere Lebens­grundlagen und die unserer Nachkommen zerstören? Die britische Ökonomin Kate Raworth hat 2017 eines der einfluss­reichsten Bücher zu dieser Frage geschrieben. In «Die Donut-Ökonomie» skizziert sie ein wirtschaftliches Modell, das ökologische Grenzen nicht überschreitet und gleichzeitig in allen Belangen einen Minimal­standard als «gesellschaftliche Grundlagen» erreicht. Lesenswert als Denkanstoss, auch und gerade wenn man der Begrenzung der Wirtschaft erst mal nicht viel abgewinnen kann.Liebe GrüsseDavid BauerPS: Kennen Sie schon unseren wöchentlichen Newsletter «Was diese Woche wichtig war»? Wir beobachten für Sie das Welt­geschehen, filtern das Wichtigste heraus, ordnen es ein – und schicken es Ihnen jeden Freitag ansprechend verpackt in Ihre Inbox. Hier kostenlos anmelden.Die Klimakrise ist hier. Die Lage ist ernst. Challenge accepted.Frühere Ausgaben des NewslettersNewsletter abonnierenVeranstaltungenKurs: In der Klimakrise einen Unterschied machenKartenspiel: 36 Fragen für ein gutes Gespräch über die KlimakriseZum KlimalaborZur RepublikUnterstützen und Mitglied werden"
