["https://republik.ch/2025/02/07/die-goldene-zeit-des-donald-trump"]
title = "Die goldene Zeit des Donald Trump – Republik"
description = "Der neue US-Präsident baut im Eiltempo den Staats­apparat um. Er zerstört Institutionen, Wissenschaft, die eigene Zukunft."
full_description = "«Età dell’oro» – das goldene Zeitalter, ein Fresko aus dem Jahr 1637. Pietro da Cortona/Palazzo Pitti FlorenzDie goldene Zeit des Donald TrumpDer neue US-Präsident baut im Eiltempo den Staats­apparat um. Er zerstört Institutionen, Wissenschaft, die eigene Zukunft.Von Constantin Seibt, 07.02.2025FolgenMerkenTeilen322 Beiträge32226 Minuten26'Diesen Beitrag anhören0:00 / 37:59Die grosse Frage ist: Werden die Vereinigten Staaten unter der zweiten Trump-Präsidentschaft zur Autokratie? Wenn ja, leben wir seit bald drei Wochen in einer neuen Epoche. Die 80 Jahre Nachkriegs­zeit der liberalen Demokratie sind zu Ende. Und das Zeitalter der Autokratie beginnt.Schlicht, weil dann mit den USA, China und Russland die drei dominierenden Atom­mächte alles Autokratien sind.Also: Kippen die Vereinigten Staaten? Noch kann niemand sagen, ob das passiert. Die Zukunft besteht auch in Zukunft aus Überraschungen.Was sich aber klar sagen lässt: Der Versuch dazu wird sehr ernsthaft gemacht.Die letzten Wochen vor Trumps Amts­übernahme und die Tage danach rollten ab, als wäre die Autokratie bereits Tatsache:Mit Donald Trump wurde ein Präsident wieder­gewählt, der bereits einen Putsch­versuch hinter sich hatte.In seiner Antrittsrede sagte er, dass ab sofort «ein goldenes Zeitalter» begänne, und prophezeite, dass der Tag seines zweiten Amts­antritts von den Amerikanerinnen zukünftig als «Tag der Befreiung» gefeiert werden würde.Als fast erste Amtshandlung begnadigte er knapp 1600 Teilnehmer des Mobs, der 2021 das Parlament gestürmt hatte, um für Trump die Wahl zu kippen. Unter den Begnadigten waren auch solche, die auf Polizisten eingeprügelt hatten, offene Neonazis und die Planerinnen des Sturms. Trump begründete seine Begnadigung mit der Bemerkung, dass diese Leute «nichts falsch» gemacht hätten.Strafverfolger halten es nicht für unplausibel, dass Trump sich damit inoffizielle Terror­milizen gezüchtet hat. Der Führer der Proud Boys, Enrique Tarrio, verurteilt zu 22 Jahren, sagte nach seiner Begnadigung, es sei nun die Zeit der Rache gekommen.Die republikanischen Abgeordneten, von denen viele dem Mob beim Sturm auf das Capitol nur knapp entkamen und sich über Stunden im Keller verstecken mussten, hatten sich zuvor energisch gegen eine kollektive Begnadigung ausgesprochen. Nachdem Trump diese aber vollzogen hatte, protestierten nur wenige von ihnen. Und fast alle diplomatisch. Der Rest schwieg. So wie so viele Male zuvor. Kein US-Präsident hatte je seine Partei so im Griff wie Trump. Sie wird absegnen, was immer er tut.Schon am Tag darauf kündigte Mike Johnson, der republikanische Sprecher des Repräsentanten­hauses, an, eine Kommission einzusetzen, die den Capitol-Sturm neu untersuchen soll, um «falsche Erzählungen zu korrigieren». Als Vorsitzenden wählte er den Abgeordneten Barry Loudermilk, der bereits verkündete, an der Erstürmung des Capitol sei nicht Trump schuld, sondern die Demokratin Nancy Pelosi.Zu den ersten Massnahmen gehörte auch, dass Trump den Ausnahme­zustand für die südliche Grenze ausrief. Was ihm etwas gestattet, was bisher ausser bei Natur­katastrophen ein Tabu war: den Einsatz der amerikanischen Armee im Inland.Gleichzeitig wurden grosse, landesweite Razzien angekündigt, um illegal Eingewanderte aus dem Land zu werfen. Fast alle Einheiten der Polizei, vom Zoll bis zu den Anti-Terror-Spezialisten, bekamen dazu neue Prioritäten.Unwilligen Beamtinnen wird vorsorglich mit Sanktionen gedroht, sollten sie die Operationen behindern. Auch in Kirchen, Schulen oder Spitälern darf nun gefahndet werden. Für das Ausfliegen der Verhafteten wurde die teuerste Variante gewählt: Militär­maschinen. Trump bemerkte zu den versprochenen Massen­deportationen, dass das für die Amerikaner «eine amüsante Woche vor dem Fernseher» ergebe.Sämtliche Gleichstellungs­ämter wurden gestrichen. Plus entsprechende Gesetze. Darunter einer der wichtigsten Erfolge der Bürgerrechts­bewegung: die Verfügung von 1965, dass die Regierung divers einstellen müsse.Halb im Scherz schlug Trump vor, Kanada zum 51. Bundes­staat der USA zu machen. Nicht im Scherz wurde Dänemark aufgefordert, den USA Grönland zu verkaufen – weil die USA es «für die nationale Sicherheit» brauche. Und in seiner Antritts­rede kündigte Trump an, den Panama­kanal wieder unter die Herrschaft der USA zu stellen. Trump ergänzte in einem Interview, in allen drei Fällen militärische Gewalt nicht auszuschliessen.Kurz nach Mitternacht, nachdem er von der Inaugurations­feier ins Weisse Haus zurück­gekehrt war, verkündigte Trump, dass seine Leute bereits tausend von der Biden-Regierung angestellte Beamte und Beraterinnen identifiziert hätten. Vier davon nannte er namentlich auf seinem eigenen sozialen Netzwerk, darunter seinen ehemaligen Chef der Armee, Mark Milley. Und schrieb dazu: «IHR SEID GEFEUERT!»Ein paar Stunden früher hatte er mit einem Feder­strich den Kündigungs­schutz von Zehn­tausenden Beamten aufgehoben.Letzteres ist die Massnahme, die die USA vielleicht am wesentlichsten verändern wird: Bisher ernannte zwar jeder Präsident die politischen Köpfe der Ämter – aber das Rückgrat des Staats­apparats in Diplomatie, Justiz, Gesundheit, Geheim­diensten, Steuer­wesen, Polizei bestand aus professionellen Beamtinnen.Nicht zuletzt die unpolitischen Profis waren es, die Trump in seiner ersten Amtszeit in Schranken hielten. Und den Präsidenten regelmässig bremsten, wenn er unmögliche oder illegale Dinge anordnete. Viele der Beamten taten das mit der Begründung, sie hätten den Eid auf die Verfassung abgelegt, nicht auf den Präsidenten.Trump sah es als grössten Fehler seiner ersten Amtszeit, dass er Leute in Macht­positionen beliess, die nicht loyal waren. Und lastete seine Wahl­niederlage der Sabotage durch den Staats­apparat an. Rechte Verschwörungs­theoretikerinnen, dazu Fox News und republikanische Partei­strategen tauften die unabhängige US-Verwaltung darauf «deep state».Diesmal soll das anders werden: Konservative Thinktanks haben die Ablauf­pläne und Formulare für die Über­prüfung kompletter Ministerien ausgearbeitet. Plus schwarze Listen von nicht linien­treuen Beamten. Und von 100 Prozent überzeugten Trump-Leuten, die ihre Arbeit übernehmen sollen, nur diesmal «loyal gegenüber der Sache, loyal gegenüber dem Mann». Erste Prüfungen laufen bereits: Trumps Sicherheits­berater Michael Waltz, dann auch Aussen­minister Marco Rubio liessen die geopolitischen Expertinnen befragen, für wen sie in den letzten Wahlen gestimmt, wem sie Geld gespendet, was sie auf Social Media gepostet hätten. Oder «was ihr persönlicher Trump-Erweckungs­moment» gewesen sei. Das genügte, um eine Menge Profis die Kündigung einreichen zu lassen. Doch das war nur das Handsieb.Kurz darauf startete das Dynamit­fischen: Zwei Millionen staatliche Angestellte bekamen eine Mail mit dem Betreff «Weggabelung». Mit der Nachricht, dass sämtliche Behörden drastisch reduziert würden. Und dass sie die Möglichkeit hätten, bis September Gehalt zu beziehen, wenn sie sofort gingen. Dafür genüge eine Mail mit dem Wort «Kündige».Selbst wenn Trump – was immer unwahrscheinlicher erscheint – in vier Jahren friedlich einer Demokratin Platz machen würde, das System der Gesinnungs­beamten wird ihn überdauern: weil es gar nicht so leicht wieder abzuschaffen ist.Loyalität = LegalitätDamit waren bereits nach 24 Stunden – zumindest im Ansatz – alle Spiel­regeln einer Autokratie installiert:Loyalität ist der oberste Wert. Für das Kabinett. Für die Partei. Für Beamtinnen. Für Experten. Für Richterinnen. Für Kriminelle. Für politische Gewalt­täter. Für ganze Bundesstaaten.Für den Präsidenten hingegen gelten weder Grenzen noch Gesetze. Nicht das Völker­recht. Nicht die Urteile der Justiz. Und auch nicht die grund­legenden Regeln. Zum Beispiel, dass das Militär nicht im Inland operiert. Oder dass der Staats­apparat unpolitisch ist. Oder dass jedes in den USA geborene Kind den amerikanischen Pass erhält.Die Geschichte wird nach den Präferenzen des Staats­chefs umgeschrieben: Das Porträt von General Milley wurde schon Stunden nach Trumps Amts­übernahme aus dem Pentagon entfernt. Und um eine genehme Erzählung von Trumps versuchtem Staats­streich kümmert sich nun eine republikanische Parlaments­kommission.Legalität wird zu einer Frage des Datums. Trumps Regierung will auch die über eine Million Immigrantinnen ausschaffen, die mit einem Biden-Programm aus Haiti und Venezuela legal in die USA kamen, nicht zuletzt, um die entvölkerten Klein­städte wieder lebensfähig zu machen. Sämtliche FBI-Beamtinnen, die gegen Trump ermittelten, wurden fristlos gefeuert. Und nicht nur sie: Der interimistische FBI-Chef verlangte eine Liste mit sämtlichen FBI-Beamten, die an den Ermittlungen gegen die Capitol-Stürmer beteiligt waren – mit genauer Beschreibung des jeweiligen Beitrags. Und im Pentagon war eine der ersten Amts­handlungen des neuen Verteidigungs­ministers, gegen den Ex-Oberkomman­dierenden Milley eine Untersuchung einzuleiten.Das zentrale Produkt autoritärer Politik ist: die Verbreitung von Angst. Schon nach wenigen Stunden des neuen Präsidenten im Amt hatten sehr verschiedene Leute gute Gründe, sich zu fürchten. 11 Millionen illegal Eingewanderte, die nicht selten Job, Familie, ein ganzes Leben in den USA aufgebaut haben und denen nun jeden Moment die Verhaftung droht. Zigtausende Beamtinnen, die in Kürze vor der Wahl stehen werden: Job oder Integrität. Alle queeren Menschen – und ihre Familien. Dazu Unternehmen mit Staats­aufträgen, die weiter Nicht-Diskriminierungs-Programme fahren. Die Regierungen in Dänemark und Panama. Polizisten, Staats­anwälte, FBI-Leute, die gegen Trump oder einen von Trumps Verbündeten ermittelt haben. Und Trumps politische Gegnerinnen: Am letzten Tag im Amt erliess Präsident Biden vorsorglich Begnadigungen für die Abgeordneten, die Trumps gescheiterten Staats­streich untersucht hatten. Aber auch für seine eigenen engsten Familien­mitglieder. (Trump kommentierte: «Joe Biden hat sich verrechnet. Er hat sich selbst keine Begnadigung ausgestellt.»)Der Präsident kassiert – und seine Familie auch. Am Vorabend der Amts­einführung gab Trump gleich zwei Krypto­währungen frei zum Kauf: eine «$Trump»-Währung und darauf für seine Frau eine «$Melania»-Währung. Die Euphorie jagte den Preis hoch und spülte den Eheleuten Dutzende Millionen Dollar in die Kasse. (Falls das tatsächlich Euphorie war – eine persönliche Krypto­währung ist ein grossartiges Vehikel für verdeckte Zahlungen.)Wenn der Boss abkassiert, dürfen seine Gehilfen dasselbe tun. Wieder kurz vor Mitternacht feuerte Trump im «Freitag-Nacht-Massaker» mehr als 15 General­inspektoren – also die Leute, die in den einzelnen Ämtern für die Einhaltung des Rechts­standards und die Bekämpfung von Korruption verantwortlich sind. (Ironischerweise tat das Trump bereits ohne Einhaltung des Rechts­standards, weil die Inspektorinnen vom Kongress angestellt werden.)Autokratie ist jedoch keine Allein­herrschaft, sondern ein System. Jeder Autokrat braucht zwei Sorten Leute: Gehilfen und Oligarchen. Für das Tages­geschäft eine so loyale wie skrupellose Bande. Für den sozialen Status eine Elite auf Augenhöhe, die ihm huldigt.Trumps Kabinett ist eine gute Wahl – für einen zukünftigen Diktator: Seine Anwältin übernimmt das Justiz­ministerium. Mehrere Fox-News-Moderatoren werden Minister. Tech-Milliardäre überwachen die Geld­verteilung und Tech-Investitionen. Die Schwieger­väter der beiden Töchter werden Nahostberater und Botschafter in Frankreich. Eine im russischen Fernsehen als «unsere Freundin» bezeichnete Ex-Demokratin soll Geheimdienst­koordinatorin werden. Der neue Grenz­verantwortliche ist ein Mensch gewordener Pitbull. Die neue Heimatschutz­sekretärin rühmte sich in einem Buch, ihren unfolgsamen Hund erschossen zu haben. Die beiden entscheidenden Gesundheits­politiker sind ein Vitamine verkaufender Fernseharzt und ein missionarischer Impfgegner. Der nächste FBI-Direktor schrieb nicht nur drei Kinderbücher mit sich selbst und König Donald als Helden, sondern führt auch Listen von politischen Feinden, denen er das Leben zur Hölle machen will.Sie alle sind Trump ergeben – und werden es auch bleiben. Niemand hat die Kompetenz, genug Renommee oder irgendein Interesse, ihm zu wider­sprechen. Nicht wenige haben Vorwürfe wegen finanzieller oder sexueller Verfehlungen am Hals, müssen dankbar dafür sein, dass die Karriere trotzdem weitergeht. Keiner wird Trump gefährlich werden, dafür aber – so wie alle inkompetenten Chefinnen – den eigenen Ämtern. Streit und Empörung sind für alle programmiert. Der Boss wird ohne Störung regieren können, während die Medien mit seinem Hofstaat beschäftigt sind.Auch weil er die Finanz­elite buchstäblich an seiner Seite hat: 26 der Kandidaten für Spitzen­positionen besitzen privat mehr als 100 Millionen Dollar, 12 davon über 1 Milliarde. Trumps Kabinett ist die reichste demokratisch gewählte Regierung der menschlichen Geschichte.Und das mit dem wichtigsten Geldgeber in der Joker­rolle: Der mehrhundert­fache Milliardär Elon Musk bekam ein inoffizielles «Department of Government Efficiency», benannt nach Musks Krypto­währung Doge.Nominell nur Berater, bekam er in den letzten Tagen mehr Macht als je ein amerikanischer Minister. Seine Leute – oft frisch aus der Universität – bekamen den Zugang zum kompletten Zahlungs­system der amerikanischen Regierung. Und zu allen Jobfiles sämtlicher Regierungs­angestellten: Sozial­versicherung, Löhne, Krankheiten, Beurteilungen, alles.Musk macht kein Geheimnis daraus, was er mit den Daten vorhat: Gründe für Entlassungen finden. «DOGE arbeitet 120 Stunden in der Woche», schrieb er auf X. «Unsere bürokratischen Gegner arbeiten, optimistisch gesehen, 40 Stunden die Woche. Kein Wunder, verlieren sie so schnell.»Das vergangene Wochenende verbrachte er damit, die amerikanische Entwicklungshilfe-Behörde zu überprüfen. Mit der auf X verkündeten Botschaft: «USAID ist eine kriminelle Organisation. Zeit, dass sie stirbt.» In einem Talk ergänzte er: Als wir die Entwicklungs­hilfe untersuchten, stellten wir fest, dass wir nicht einen Wurm im Apfel hatten, sondern nur einen Ball aus Würmern.Die Versenkung der mit Abstand grössten Entwicklungshilfe-Behörde der Welt kostete ihn nur ein langes Wochenende: Daneben fand Musk genug Zeit, den Rücktritt der britischen Regierung zu fordern, für die AfD Wahlkampf zu machen, den Plan zu befördern, die Bank­einlage­sicherung abzuschaffen, den libertären Diktator Nayib Bukele zu loben, der den USA vorschlug, amerikanische Häftlinge in die berüchtigten Gefängnisse von El Salvador auszulagern, etc.Trump stimmte Musks Schnell­recherche zu. «Ich habe ihn ein paar Mal gefragt: ‹Bist du sicher?›», sagte Musk. «Und er sagte ‹Ja›. Also schliessen wir es.»Die Orgie der OligarchenNoch im Sommer vor der Wahl wollte sich kein einziger CEO eines Top-100-Unternehmens mit Trump blicken lassen. Was in der Geschichte der Republikanischen Partei einzigartig war.Nach Trumps Sieg jedoch explodierte in der Milliardärs­welt eine Orgie an Opportunismus. Auf "
