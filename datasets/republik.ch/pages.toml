["https://republik.ch/2021/06/25/diese-unternehmen-existieren-um-maerkte-zu-zerstoeren-nicht-um-sie-zu-beliefern"]
title = "«Diese Unternehmen existieren, um Märkte zu zerstören, nicht um sie zu beliefern» – Republik"
description = "Der Internetkapitalismus als gigantischer Markt der Ressentiments: Ein Gespräch über die Macht von Big Tech, die Metamorphosen des Kapitalismus und die Urteilssucht auf Social Media."
full_description = "Besteht die Zukunft des Kapitalismus ausschliesslich in der Herstellung von Monopolen? Das ist der Traum von Amazon (hier das Vertriebszentrum in Rugeley, England). Ben Roberts/Panos Pictures«Diese Unternehmen existieren, um Märkte zu zerstören, nicht um sie zu beliefern»Der Internetkapitalismus als gigantischer Markt der Ressentiments: Philosoph Joseph Vogl unterzieht im neuesten Buch die Plattformökonomie einer Fundamentalkritik. Ein Gespräch über die Macht von Big Tech, die Metamorphosen des Kapitalismus und die Urteilssucht auf Social Media.Von Daniel Graf, 25.06.2021FolgenMerkenTeilen75 Beiträge7520 Minuten20'Herr Vogl, Ihr neues Buch heisst «Kapital und Ressentiment». Sie hätten es auch «Kapital durch Ressentiment» nennen können, oder?Ich habe mit dem Titel tatsächlich auf eine unbestimmte Kausalität gesetzt, denn man muss sich bei der Analyse und der Geschichte von wirtschaftlichen Sach­verhalten von streng kausalen, determinierten Entwicklungen lösen. Es gibt immer einen grossen Kontingenz­spielraum bei der Entstehung und der Durchsetzung bestimmter Wirtschafts­systeme. Und der Titel soll mit diesem eigentümlichen Bindewort «und» zumindest festhalten, dass die Entstehung moderner Markt­gesellschaften nicht ohne die Produktiv­kraft von bestimmten Affekten auskommt.Um ein komplexes und dichtes Buch auf eine schlichte Formel zu bringen: Die Plattform­ökonomie in ihrer heutigen Form führt zu einer Aushöhlung der Demokratie, lautet der Grund­befund.Das sind Formulierungen, die gut in den Klappen­text passen würden, die aber im Buch selbst etwas anders gewendet werden. Was mich interessiert hat, ist eine Untersuchung mit einem längeren historischen Atem, die Entstehung dessen, was ich Finanz­regime nenne und was in seiner Genese auf die Frühe Neuzeit zurück­zudatieren ist. Verbunden damit ist die These, dass so etwas wie das Finanz­wesen nicht einfach ein ökonomischer Sachverhalt ist, sondern in einer engen Austausch­konstellation zwischen Staats­apparaten und privaten Financiers entstanden ist. Seit der Frühen Neuzeit ist das Finanz­wesen eng verwoben mit regierungs­technischen Fragen, in jüngerer Zeit mit dem Ausbau von Governance-Strukturen. Es geht also um privat-öffentliche Osmosen. Da hat sich eine Dynamik entwickelt, die das Finanz­regime mehr und mehr aus der Überprüf­barkeit durch rechts­staatliche demokratische Ordnungen heraus­gelöst hat.Hin zu einem parastaatlichen Gebilde?Auf die Finanzmärkte bezogen hat sich etwas eingestellt, was ich die vierte Gewalt oder die «Monetative» nenne – spätestens dort, wo sich diese Konstellationen auch einen festen institutionellen Rahmen gegeben haben, beispiels­weise in der Entstehung von Zentral- und National­banken. Diese Banken erfüllen auf der einen Seite eine Regierungs­aufgabe, nämlich Geld- und Währungs­politik, auf der anderen Seite sind sie in fast allen westlichen Ländern dezidiert von der Exekutive und von der Legislative abgetrennt und damit auch deren Zugriff entzogen. Oder umgekehrt: Sie müssen keine Rechenschaft gegenüber Parlamenten und gewählten Regierungen abgeben. Und nun gibt es jüngere Bewegungen, die dieses ältere, regierungs­gesteuerte Finanz- oder Währungs­system bereits überbieten und zu einem markt­gesteuerten Finanz­system übergehen.Das heisst?Der Einfluss der Zentral­banken, etwa auf die Geld­schöpfung und auf das Kredit­verhalten, ist in den letzten Jahrzehnten geschwunden. Die Märkte sind selbst die grössten Produzenten von Liquidität. Zudem lösen sich internationale Verträge auf dem Gebiet der Finanz­wirtschaft mehr und mehr vom national­staatlichen öffentlichen Recht. Man gibt sich eine eigene «Lex Mercatoria», eine Art privatisiertes Privat­recht mit eigenen, privaten Schiedsgerichten.Zur PersonJoseph Vogl ist eigentlich Literatur- und Kultur­wissenschaftler. Nach der Finanzkrise 2007/2008 ist er jedoch zu einem der profiliertesten Kritiker der Finanz­ökonomie und zu einem public intellectual geworden. Sein Buch «Das Gespenst des Kapitals» (2010) hat es zum Bestseller gebracht, obwohl Vogl aus seiner Vorliebe für anspruchs­volle Theorie nie den geringsten Hehl macht. Mit «Der Souveränitäts­effekt» legte er 2015 nach: Das moderne Finanz­wesen, so Vogl, habe sich von der Volks­souveränität entkoppelt und sei zu einer «Ausnahme­macht» geworden, die die eigenen Risiken in Gefahren für die Allgemeinheit verwandle. Nun hat er sein neues Buch mit dem Titel «Kapital und Ressentiment» vorgelegt, eine kultur­geschichtlich fundierte Analyse des Plattform­kapitalismus von Amazon, Facebook, Uber und Co.Sie haben die Zentral­banken angesprochen. Wie sehen Sie die geldpolitischen Veränderungen durch Krypto­währungen?Im Augenblick gibt es wohl circa 10’000 verschiedene Krypto­währungen, und die Hoffnung dahinter war einmal, den Geldtransfer sowohl von Staaten und deren Dominanz in nationalen Währungen als auch von inter­nationalen Banken zu lösen. Das ist eigentlich ein altes liberalistisches Ideal, das man beispiels­weise bei Ökonomen wie Friedrich von Hayek oder Milton Friedman findet: Auch das Geld muss radikal privatisiert werden, jedem politischen Zugriff entzogen. Aber gerade dadurch – an Bitcoin ist das am deutlichsten erkennbar – ist das private Geld zu einem aberwitzigen Spekulations­objekt geworden.Derzeit ist Facebooks Währung «Diem» in aller Munde.Die Idee hat natürlich etwas Schlagendes, einen Konzern mit einem Nutzer­stamm von knapp drei Milliarden Leuten in einen Finanz­konzern zu verwandeln und die Nutzer im Grunde in Konto­inhaber zu transformieren. Dadurch kann eine letzte Bastion staatlicher Hegemonie, nämlich das Währungs­monopol, unterlaufen werden. Und aus der Perspektive von Facebook ist es eine überaus interessante Angelegenheit, Geld­schöpfungs­privilegien, also das, was man früher Seigniorage oder Schlag­schatz genannt hat, zu privatisieren. Man baut den Konzern zu einer Art Investment­gesellschaft um, die ihr Geld mit der Ausgabe von Geld verdient.Nun gibt es neben dem Finanz­wesen einen weiteren zentralen Strang in Ihrem Buch, der sich speziell um Plattform­ökonomie und Social-Media-Unternehmen dreht. Ihre These ist, dass bei diesen Platt­formen die ständige Zirkulation von Ressentiments zum Geschäfts­modell wird. Wie hängt das mit dem ersten Aspekt zusammen, dem Finanzwesen?Da muss ich verschiedene Zwischen­schritte vornehmen. Ein erster wichtiger Schritt besteht in der Feststellung, dass die Plattform­unternehmen, deren Entstehung in den Neunziger­jahren zu beobachten und deren grosser Take-off nach der Dotcom-Blase zu verzeichnen ist, aufgrund verschiedener geschäftlicher Vorteile eine hohe Attraktivität für Finanz­investoren haben. Beispiels­weise haben diese Konzerne wenig Fixkapital zu pflegen: Uber besitzt keine Autos, Airbnb keine Wohnungen.Sie lösen sich im Grunde von den Produktionsmitteln.Genauer: Ihre Produktionsmittel sind vor allem Hard- und Software. Zugleich können sie eine rabiate Externalisierung von Arbeits­kosten betreiben, etwa durch Wegwerf­arbeiter oder Tagelöhner, die überall unterwegs sind in unseren Städten. Wie Finanz­unternehmen auch sind die Plattformen zudem überaus artistisch in der Steuer­vermeidung, weil lizenzierte Daten­produkte recht leicht über die Grenzen zu transportieren sind, anders als Fabrik­anlagen. Und was diese Unternehmen, aber auch die Finanz­investoren besonders lieben: Sie folgen dem power law, also dem exponentiellen Wachstum, das durch Netzwerk­effekte generiert wird. Das prägt eine gleichsam natur­wüchsige Tendenz zur Monopol­bildung und dazu, bestehende Märkte zu zerstören.«Netzwerkeffekte» meint die Potenzierung von Nutzerzahlen – Nutzerinnen generieren Nutzerinnen?Ja, bei einem linearen Wachstum von Knoten im Netz zeichnen sich die möglichen Beziehungen, die zwischen den Knoten existieren, durch nicht-lineare oder konvexe Wachstumskurven aus. Nutzer verzinsen sich gewisser­massen mit Nutzern. Damit können die sogenannten Grenzkosten radikal gesenkt werden. Für den Ausbau der Unter­nehmen muss man dann nicht etwa zusätzlich Immobilien bauen, sondern nur die Rechner­kapazitäten erweitern.Wenn man die Veränderungen berücksichtigt, die Sie eben beschrieben haben, was passiert dann mit klassischen kapitalismus­kritischen Kategorien wie Ausbeutung, Entfremdung, Mehrwert? Taugen die noch zur Beschreibung?Eine Sache ist entscheidend: Diese Unternehmen haben mit Gütern zu tun, die Ökonomen nicht-rivalisierende Güter nennen, also Güter, die sich durch Unknappheit auszeichnen. Information wird durch den Gebrauch nicht weniger, anders als der Wein in der Flasche oder das Benzin im Tank. Aus diesem Grund, und das ist so simpel wie clever, müssen diese Unternehmen den Zugang zur Information asymmetrieren. Diejenigen, die Daten produzieren – also das, was man User oder sogar «Produser» nennt –, müssen vom Zugang zu dem, was sie selbst in diesen Netzwerken produzieren, konsequent ausgeschlossen werden.«Nachdem der Sturm auf das Kapitol gescheitert war, hat man den noch amtierenden Präsidenten auf Twitter und Facebook schlicht abgesetzt – öffentlich entmachtet und kastriert»: Joseph Vogl. Julia Baier/laifDer «Produser» unterliegt einer anderen Art der Entfremdung von dem Produkt, das er herstellt – gar nicht mit dem Willen, ein Produkt herzustellen?«Produser» sind ja Nutzer oder User, die gar nicht merken, wie und wo sie mit beliebigen Netzaktivitäten Daten­rohstoffe produzieren. Allerdings würden die Geschäfte der Daten­raffinerien nicht funktionieren, wenn sie den Nutzern nicht auch Spass machen würden. Und Spass lässt sich nicht unbedingt als krasse Entfremdungs­erfahrung fassen. Also werden dort bestimmte Verträge geschlossen, bewusst oder unbewusst, und ich würde diese Verträge Kontroll­verträge nennen. Man nutzt das Privileg kostengünstiger oder kostenloser Angebote – die Nutzung von Apps, Maps, Navigations­hilfen, Wörter­büchern, Such­maschinen, was auch immer – unter der Bedingung, dass man die damit produzierten Daten abtritt. Dabei, und das ist das Entscheidende, findet so etwas wie digitale Enteignung statt. Deswegen entwickeln diese Unter­nehmen auch einen so hohen advokatorischen Grimm, um den Zugriff auf diese Daten durch die Nutzer zu verhindern.Wenn man das User-Verhalten auf die digitale Öffentlichkeit hin befragt: Sie sprechen bei diesen Plattformen, speziell den Social Media, von einer Ausbeutung der Urteils­lust. Was ist damit gemeint?Ich muss vielleicht noch etwas über den Zusammen­hang von Finanz­ökonomie und Plattformen vorweg­schicken. Eine meiner Thesen ist, dass die proto­typischen Plattformen entstanden sind, bevor eigentlich die digitale Netzwerk­architektur zur Verfügung stand. Und zwar sind das privatisierte Börsen­schauplätze gewesen wie etwa Nasdaq. Over-the-counter-Geschäfte; die Loslösung der Finanz­geschäfte von reglementierten Börsen­schauplätzen in private Handels­plätze hat sich dort vollzogen. Und spätestens mit der Privatisierung des Internets 1996 und der Freigabe des Netzes für Finanz­transaktionen ist das Netz zu einem der grössten Umschlag­plätze für Finanz­transaktionen überhaupt geworden. Schon im Jahr 2000 flossen täglich knapp zwei Billionen Dollar durch die elektronischen Netze von New York.Mit der Privatisierung des Internets 1996 meinen Sie den Telecommunications Act in den USA?Ja. Das Gesetz, mit dem die Netzwerk­architektur – die ja öffentlich war, zwischen Universitäten und Militär­institutionen hervor­gebracht wurde, die lange Zeit eine Art Ladenhüter war und nicht wirklich Gross­investoren angezogen hat – radikal privatisiert wurde.Jetzt haben Sie beiläufig das gängige Narrativ aus dem Silicon Valley über den Haufen geworfen. Das lebt ja vom Erfinder­geist im Garagen-Start-up, die Erzählung beginnt mit der genialen Einzel­person. Bei Ihnen ist das eher ein Endpunkt der geschichtlichen Entwicklung.Völlig richtig. Die italienisch-amerikanische Ökonomin Mariana Mazzucato beispiels­weise hat nachgewiesen, dass dieser Mythos vom kühnen Erfinder­geist die Lage nur partiell trifft. Die wichtigsten Produkte etwa für die Funktions­tüchtigkeit des Internets – einheitliche Daten­formate und Protokolle, Mikro­prozessoren, Betriebs­systeme oder E-Mail-Programme – wurden zunächst mit grossen staatlichen Mitteln gefördert, um dann aus gewisser Distanz privat und profitabel verwertet zu werden. Für Mazzucato war das ein weiterer Beweis dafür, dass man Kosten sozialisiert und Gewinne privatisiert. Und es kommt mit dem Telecommunications Act von 1996 ein Zusatz­gesetz hinzu, das etwas erzeugt hat, was man Internet-Exzeptiona­lismus nennt, nämlich das sogenannte Haftungs­privileg. Mit Paragraf 230 des Communications Decency Act, dieses Zusatz­gesetzes, werden Internet­provider von der Verantwortung gegenüber den eingestellten Inhalten befreit. Dadurch entstand eine Situation, die man mit einem Paradox formulieren kann, das bis heute gilt: Wer veröffentlicht, ist nicht verant­wortlich. Wer aber Content verantwortet, betreibt keine Veröffentlichung.Ist das ein weiteres Beispiel für Privatisierung von Gewinnen, Sozialisierung von «Kosten»?Es ist eine meiner Thesen, dass die Privilegien, die das Finanz­kapital historisch immer ausgezeichnet haben, sich mit dem Internet-Exzeptionalismus kombinieren, also mit einem einzigartigen Geschäfts­modell: Wir haben es heute mit Unternehmen zu tun, die für ihre Produkte keinerlei Verantwortung übernehmen müssen. Selbst ein Konzern wie Monsanto beziehungs­weise Bayer kann irgendwann mal Ärger mit Glyphosat bekommen. Aber die Konzerne der Plattform­industrie kriegen mit keinem Algorithmus und keinem vertriebenen Produkt Schwierigkeiten. Im Gegenteil, sie haben inzwischen so etwas wie normative Enklaven hergestellt. Wie wir alle wissen, entscheiden in letzter Konsequenz die Unter­nehmen selbst, welche Inhalte sie einstellen oder löschen. Sie können vielleicht angefleht werden, nachträglich zu löschen, aber sie werden nicht dafür verantwortlich gemacht, was einmal eingestellt worden ist.Heisst das, Social Media sollten Ihrer Meinung nach als Medien­unternehmen behandelt werden – wie klassische Medien?In der besten aller publizistischen Welten: ja. Hier gibt es ein Loch an Verantwortlichkeit, an Haftung, an Legitimation. Und natürlich würde sich das Geschäfts­modell radikal ändern, wenn man solche Medien­unternehmen direkt verantwortlich machen könnte und nicht bloss nachträglich darum bitten müsste, sich selbst ein paar Regeln zu geben. Private Schieds­gerichte ersetzen den Rechtsweg.Deswegen bleibt ja das Dilemma: Wenn de facto Firmen die Rolle von Gerichten übernehmen, also beispiels­weise über Löschung entscheiden, dann ist das ein grund­sätzliches Problem für den Rechts­staat. Wenn aber umgekehrt vielleicht staatliche Stellen die Aber­millionen Tweets in Echtzeit kontrollieren sollten: Wie soll das gehen?Gar nicht. Aber dabei wird deutlich, wie technologisch-ökonomischer Druck eine rechtliche Zwangs­lage erzeugt. 6000 Tweets pro Sekunde oder 3 Millionen Posts pro Minute sind eben nicht mehr oder nur maschinell"
