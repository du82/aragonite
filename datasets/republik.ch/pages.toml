title = "Werden Sie Komplizin! – Republik"
description = "Hier erfahren Sie, wie Sie die «Republik» am besten unterstützen können."
full_description = '''Komplizen treffen sich in einem Garten in Zürich, um das publizistische Konzept zu schärfen.An die VerlagsetageWerden Sie Komplizin!Denn: ohne Komplizen keine Republik. Hier erfahren Sie, wie Sie uns am besten unterstützen können.Von Ihrem Expeditionsteam, 31.03.2020, letztes Update 04.02.2025FolgenMerkenTeilen2 Minuten2'Als werbefreies Magazin ist die Republik unabhängig von Konzernen und Werbekunden – dank der Unterstützung ihrer Mitglieder und den grosszügigen Beiträgen von Spendern und Investorinnen. Das grösste Kapital der Republik sind aber die engagierten Komplizen, die mitdenken und anpacken.Helfen Sie mit, damit die Republik besser und bekannter wird.Möchten Sie die Zukunft der Republik mitgestalten und sich für Medienvielfalt engagieren? Gerne informieren wir Sie über Möglichkeiten des Mitwirkens. Tragen Sie sich in unseren Komplizen-Newsletter ein! Als Republik-Komplizin bekommen Sie Einladungen an Veranstaltungen und wir halten Sie über Neuigkeiten aus der Republik-Crew auf dem Laufenden. An dieser Stelle vielen Dank den über 1500 bestehenden Komplizinnen und Komplizen für die wertvolle Unterstützung.Als Komplizin bekommen Sie rund 4 bis 6 Mal pro Jahr einen Newsletter. Sie können sich jederzeit wieder aus der Liste austragen.Unsere Komplizinnen und Komplizen testen Neuerungen in unserer App, verteilen in der ganzen Schweiz Flyer und Sticker, legen in Lokalen und Arztpraxen die Papierausgabe aus oder hängen Plakate und Banner auf und sorgen so dafür, dass die Republik besser und bekannter wird. Komplizinnen spielen bereits seit dem Beginn des Projekts eine tragende Rolle. So wurden beispielsweise das Geschäftsmodell, die publizistischen Leitlinien oder auch der Name des Magazins in Workshops mit zahlreichen Komplizen erarbeitet.So können Sie die Republik jederzeit unterstützen:Verbreiten Sie die Artikel und Inhalte, die Ihnen gefallen – jeder Artikel lässt sich frei teilen, in den sozialen Medien, per Whatsapp, Telegram oder E-Mail. So kommen neue Kreise in den Kontakt mit der Republik.Teilen Sie Ihr Abo mit Interessierten: Als Mitglied können Sie jederzeit einen Probezugriff mit einer unbegrenzten Zahl Menschen teilen. Machen Sie davon Gebrauch!Erstellen Sie ein Republik-Profil und tauschen Sie sich in den Debatten mit Ihren Mitverlegerinnen aus.Folgen Sie uns in den sozialen Medien, auf Bluesky, Mastodon, Facebook, Instagram.Wir freuen uns auch immer über Besuch von Komplizen an unseren Veranstaltungen.Empfehlen Sie die Republik weiter! Dafür liefern wir Ihnen gerne Textbausteine und Argumente.Auf der Suche nach einem Geschenk für Ihre Freunde oder Feinde? Verschenken Sie die Republik!Zeigen Sie Grosszügigkeit: Unterstützen Sie uns durch eine Spende oder werden Sie Gönnerin.Aktivieren Sie die automatische Erneuerung und Abbuchung des Mitgliederbeitrags. Das hilft uns sehr, unsere Liquidität besser planen zu können. Danke für Ihr Vertrauen!Komplizen im Einsatz8 BilderKomplizen debattieren in der Rothaus-Bar in Zürich.<figure data-css-11z8okf=""><div data-css-13azwyo="" style="cursor:zoom-in"><span data-css-fisw11="" style="max-width:2128px"><img loading="eager" data-css-1k1sbns="" style="aspect-ratio:1.502824858757062" src="https://cdn.repub.ch/s3/republik-assets/repos/republik/article-komplizenseite/images/491edc405f30026727ba24b83069ce2e03ba1afe.jpeg?size=2128x1416&amp;format=auto&amp;resize=665x" srcSet="https://cdn.repub.ch/s3/republik-assets/repos/republik/article-komplizenseite/images/491edc405f30026727ba24b83069ce2e03ba1afe.jpeg?size=2128x1416&amp;format=auto&amp;resize=333x 333w,https://cdn.repub.ch/s3/republik-assets/repos/republik/article-komplizenseite/images/491edc405f30026727ba24b83069ce2e03ba1afe.jpeg?size=2128x1416&amp;format=auto&amp;resize=665x 665w,https://cdn.repub.ch/s3/republik-assets/repos/republik/article-komplizenseite/images/491edc405f30026727ba24b83069ce2e03ba1afe.jpeg?size=2128x1416&amp;format=auto&amp;resize=1330x 1330w" data-css-fisw11=""/></span></div><figcaption data-css-1qi1ipm="" data-css-181td0w="">Komplizentreffen in Bern.</figcaption></figure><figure data-css-11z8okf=""><div data-css-13azwyo="" style="cursor:zoom-in"><span data-css-fisw11="" style="max-width:6048px"><img loading="eager" data-css-1k1sbns="" style="aspect-ratio:1.502982107355865" src="https://cdn.repub.ch/s3/republik-assets/repos/republik/article-komplizenseite/images/44c9f3a7f8ec21f177b0a7c0778a06d72d5a82ee.jpeg?size=6048x4024&amp;format=auto&amp;resize=665x" srcSet="https://cdn.repub.ch/s3/republik-assets/repos/republik/article-komplizenseite/images/44c9f3a7f8ec21f177b0a7c0778a06d72d5a82ee.jpeg?size=6048x4024&amp;format=auto&amp;resize=333x 333w,https://cdn.repub.ch/s3/republik-assets/repos/republik/article-komplizenseite/images/44c9f3a7f8ec21f177b0a7c0778a06d72d5a82ee.jpeg?size=6048x4024&amp;format=auto&amp;resize=665x 665w,https://cdn.repub.ch/s3/republik-assets/repos/republik/article-komplizenseite/images/44c9f3a7f8ec21f177b0a7c0778a06d72d5a82ee.jpeg?size=6048x4024&amp;format=auto&amp;resize=1330x 1330w" data-css-fisw11=""/></span></div><figcaption data-css-1qi1ipm="" data-css-181td0w="">Komplizentreffen in St. Gallen.</figcaption></figure><figure data-css-11z8okf=""><div data-css-13azwyo="" style="cursor:zoom-in"><span data-css-fisw11="" style="max-width:6048px"><img loading="eager" data-css-1k1sbns="" style="aspect-ratio:1.502982107355865" src="https://cdn.repub.ch/s3/republik-assets/repos/republik/article-komplizenseite/images/6d3260e8645a276e5dddff957e5eb3bef8b5e556.jpeg?size=6048x4024&amp;format=auto&amp;resize=665x" srcSet="https://cdn.repub.ch/s3/republik-assets/repos/republik/article-komplizenseite/images/6d3260e8645a276e5dddff957e5eb3bef8b5e556.jpeg?size=6048x4024&amp;format=auto&amp;resize=333x 333w,https://cdn.repub.ch/s3/republik-assets/repos/republik/article-komplizenseite/images/6d3260e8645a276e5dddff957e5eb3bef8b5e556.jpeg?size=6048x4024&amp;format=auto&amp;resize=665x 665w,https://cdn.repub.ch/s3/republik-assets/repos/republik/artic