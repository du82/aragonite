["https://republik.ch/about"]
title = "Das sind wir – Republik"
description = "Die Republik ist ein digitales Magazin für Politik, Wirtschaft, Gesellschaft und Kultur. Finanziert von seinen Leserinnen und Lesern."
full_description = "0:00 / –:–– Die Republik ist ein digitales Magazin für Politik, Wirtschaft, Gesellschaft und Kultur. Finanziert von seinen Leserinnen und Lesern. Gemeinsam sind wir eine Rebellion gegen die Medienkonzerne, für die Medienvielfalt. Unabhängiger Journalismus ohne Bullshit: Willkommen bei der Republik.Damit Sie uns vertrauen können, machen wir ein paar Dinge anders. Zum Beispiel sind wir komplett werbefrei. Vollkommen transparent. Und kompromisslos in der Qualität.Unser Ziel: Journalismus, der die Köpfe klarer, das Handeln mutiger, die Entscheidungen klüger macht. Und der das Gemeinsame stärkt: die Freiheit, den Rechts­staat, die Demokratie.Wir bedanken uns an dieser Stelle auch bei unseren über 28’000 Mitgliedern und Abonnentinnen, die unsere Arbeit möglich machen und das Überleben der Republik sichern.Ohne Journalismus keine Demokratie.Und ohne Demokratie keine Freiheit. Wenn der Journalismus stirbt, stirbt auch die offene Gesellschaft, das freie Wort, der Wettbewerb der besten Argumente. Freier Journalismus war die erste Forderung der liberalen Revolution. Und das Erste, was jede Diktatur wieder abschafft. Journalismus ist ein Kind der Aufklärung. Seine Aufgabe ist die Kritik der Macht. Deshalb ist Journalismus mehr als nur ein Geschäft für irgendwelche Konzerne. Wer Journalismus macht, übernimmt Verantwortung für die Öffentlichkeit. Denn in der Demokratie gilt das Gleiche wie überall im Leben: Menschen brauchen vernünftige Informationen, um vernünftige Entscheidungen zu treffen. Guter Journalismus schickt Expeditionsteams in die Wirklichkeit. Seine Aufgabe ist, den Bürgerinnen und Bürgern die Fakten und Zusammenhänge zu liefern, pur, unabhängig, nach bestem Gewissen, ohne Furcht vor niemandem als der Langweile. Journalismus strebt nach Klarheit, er ist der Feind der uralten Angst vor dem Neuen. Journalismus braucht Leidenschaft, Können und Ernsthaftigkeit. Und ein aufmerksames, neugieriges, furchtloses Publikum. Sie!Was ist die Republik?Die Republik ist eine Dienst­leistung für interessierte Menschen in einer grossen, faszinierenden und komplexen Welt.Wir recherchieren, fragen nach, ordnen ein und decken auf. Und liefern Ihnen Fakten und Zusammen­hänge als Grundlage für Ihre eigenen Über­legungen und Entscheidungen.Das ist eine heikle Aufgabe. Denn Journalismus ist alles andere als harmlos: Es ist entscheidend, welche Geschichten erzählt werden.Weil Vertrauen im Journalismus die härteste Währung ist, haben wir die Republik so aufgestellt, dass wir diese Aufgabe für Sie bestmöglich erledigen können:Wir sind unabhängig. Und komplett werbefrei. So können wir uns auf unseren einzigen Kunden konzentrieren: Sie. Und müssen weder möglichst viele Klicks generieren noch Sie mit nervigen Anzeigen belästigen. Und wir verkaufen Ihre persönlichen Daten niemals weiter.Wir sind das transparenteste Medien­unternehmen (das wir kennen). Wir legen alles offen: unsere Finanzen, Besitz­verhältnisse, Arbeits­weisen, Fehler, Löhne – weil wir überzeugt sind, dass es wichtig ist, zu zeigen, unter welchen Bedingungen Journalismus hergestellt wird.Wir gehören niemandem – aber Ihnen ein bisschen. Mit einer Mitgliedschaft werden Sie auch Genossenschafter und damit Verlegerin der Republik. Das ist für Sie ohne Risiko, dafür mit Einblick und Einfluss verbunden: Wir erklären, was wir tun – und Sie können mitentscheiden.Wir sind kompromisslos in der Qualität. Unsere Reporter und Journalistinnen haben die Zeit, ein Thema mit der angebrachten Sorgfalt und Hartnäckigkeit zu recherchieren. Und es gibt drei Dinge, an denen uns besonders viel liegt: gute Sprache. Gute Bilder. Und gutes Design.Wir stehen mit Ihnen im Dialog. Und lieben es! Das Internet ermöglicht nicht nur viele neue Formen, wie wir Geschichten erzählen können, sondern auch den direkten Dialog mit Ihnen. Damit die Republik mit Ihrer Stimme vielfältiger, interessanter und reflektierter wird.Wer macht die Republik?Unsere Crew besteht aus kompetenten Profis. Den besten, die wir finden konnten.Alle ansehenWarum das alles wichtig istBei der Republik und beim Journalismus überhaupt geht es nicht nur um den individuellen Nutzen. Es geht auch darum, eine wichtige Funktion in einer Demokratie auszuüben: den Mächtigen auf die Finger zu schauen, unabhängig zu recherchieren und Missstände aufzudecken.Traditionelle Medien haben das Problem, dass mit dem Internet ihr Geschäftsmodell zusammen­gebrochen ist. Sie haben ihre Monopol­stellung verloren, fast alles ist gratis im Netz verfügbar. Die Bereitschaft, für Journalismus zu bezahlen, ist gesunken. Parallel dazu wanderten die Werbe­einnahmen fast vollständig zu Google, Facebook und Co. ab.Die Folgen davon sind unübersehbar: ein massiver Abbau bei Redaktionen auf Kosten der Qualität und Vielfalt. Seit 2011 sind in der Schweiz unter dem Strich mehr als 3000 Stellen im Journalismus verschwunden. (Das ist viel: damit könnte man 100 Republiken machen.)Zeitungen fusionieren, Redaktionen werden zusammengelegt, es gibt immer weniger Vielfalt im Schweizer Medien­markt. In der Deutsch­schweiz verfügen Tamedia, Ringier und die NZZ mit ihren Zeitungen bereits über 80 Prozent Marktanteil.Und als neueste Entwicklung, um den sinkenden Werbe­einnahmen entgegen­zuwirken, gehen die Verlage immer dreistere Deals mit Werbekunden ein. Die Grenze zwischen redaktionellen Beiträgen und Werbung verwischt. Der Presserat kritisiert in einem Leiturteil diese Grenz­überschreitungen der Verlage. Damit werde das Publikum getäuscht und irregeführt. Die Medien schaden so ihrer eigenen Glaubwürdigkeit als unabhängige Berichterstatter.Kurz: Es steht nicht unbedingt gut um die Medien­branche und die Zukunft des Journalismus.Als Antwort auf diese Entwicklungen – und aus Leidenschaft für guten Journalismus – bauen wir die Republik auf.Einerseits als konkreten Beitrag zur Vielfalt. Mit einem Medium, das Unabhängigkeit konsequent ernst nimmt. Andererseits auch als Labor für den Journalismus des 21. Jahrhunderts. Dafür ist es notwendig, ein funktionierendes Geschäfts­modell zu entwickeln.Eine Republik baut niemand alleine, sondern nur viele gemeinsam. Wir mit Ihnen?Alle ansehenAuszeichnungen und NominierungenSchweizer Medienqualitätsranking 2024: 3. Platz in der Kategorie «Tages- und Onlinezeitungen»Swiss Press Award 2021 (2. Platz) für «Sag, wie hast du's mit der Frist?»Schweizer Reporterpreis 2020 für die Serie «Die gefährlichste Frau der Schweiz?»Swiss Press Award 2020 für den fünfteiligen Podcast «Zündstoff»Nominierung für «Grimme Online Award», Kategorie InformationEuropean Publishing Award: European Start-up of the Year 2019Schweizer Reporterpreis 2019 für die Serie «Das Kartell»Was bisher geschahSeit dem Start schreiben wir regelmässig über die wichtigsten Entwicklungen in unserem Unternehmen.April 2017: Initiales CrowdfundingJanuar 2018: Launch MagazinOktober 2018: 1. GeschäftsberichtJanuar 2019: Liquiditätsplanung für 2019November 2019: 2. GeschäftsberichtDezember 2019: Das alte CockpitMärz 2020: MärzkampagneJuni 2020: 25’000 MitgliederNovember 2020: 3. GeschäftsberichtApril 2021: Die Republik schreibt schwarze ZahlenNovember 2021: 4. GeschäftsberichtNovember 2022: 5. GeschäftsberichtNovember 2023: 6. GeschäftsberichtNovember 2024: 7. GeschäftsberichtSie können alle Texte nachlesen, im Archiv der Project-R-Newsletter und in der Rubrik «An die Verlagsetage»."
