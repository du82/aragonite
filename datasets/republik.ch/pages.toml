["https://republik.ch/2021/10/14/der-laermigste-professor-des-landes"]
title = "Der lärmigste Professor der Schweiz – Republik"
description = "Politökonom Reiner Eichenberger forderte vor einem Jahr eine gelenkte Corona-Durchseuchung und zimmert jetzt an der Seite der SVP am Stadt-Land-Graben. Wieso ist der Freiburger Wirtschafts­professor mit seinen Provokationen so erfolgreich?"
full_description = "Keiner versteht die Gesetze der Aufmerksamkeits­ökonomie so gut wie Reiner Eichenberger.Der lärmigste Professor der SchweizPolitökonom Reiner Eichenberger forderte vor einem Jahr eine gelenkte Corona-Durch­seuchung. Jetzt schaufelt er an der Seite der SVP am Stadt-Land-Graben. Wieso ist der Freiburger Wirtschafts­professor mit seinen Provokationen so erfolgreich?Von Elia Blülle (Text) und Philip Frowein (Bilder), 14.10.2021FolgenMerkenTeilen123 Beiträge12317 Minuten17'Reiner Eichenberger fürchtet um seine Ruhe. An sonnigen Wochen­enden erobern immer mehr Boote den Zürich­see, Feste am anderen Ufer jagen laute Bässe über das Wasser und stören an der Goldküste die gepflegte Stille. Besonders ärgerlich seien die Party­schiffe der hoch subventionierten Schiff­fahrts­gesellschaft, sagt Eichenberger. «Der Bürger bezahlt seine eigene Beschallung.»Der Professor für Theorie der Finanz- und Wirtschafts­politik wohnt in Feldmeilen mit seiner Familie. Hier ist er aufgewachsen, umgeben von prächtigen Anwesen, deren meterhohe Thuja­hecken die Sicht auf den Reichtum dahinter verbergen. An der Gold­küste zahlen die Bewohnerinnen Millionen für Diskretion und Ruhe.«Es braucht dringend Regeln», sagt Eichen­berger. Keine Verbote, aber Kosten­wahrheit: «Müssten Lärm­verursacher am und auf dem See einen Teil ihrer Lärm­schäden bezahlen, würden sie den See nicht mehr so unverfroren beschallen.»Ob Lärm, Klima­erwärmung, Energie­wende, Migration, Medien­förderung oder Pandemie­bekämpfung: Eichenberger redet mit. Am liebsten zuvorderst. Als Experte für alles. Seine Meinungen: quälend pragmatisch, stramm neoliberal und selbst dann noch konträr zur Mehrheits­position.Viele seiner Fans sehen in ihm einen «Professor Unbequem» («Weltwoche»), der mit unkonventionellen Vorschlägen miefige Schweizer Politik­diskurse aufmischt und vormacht, wie sich Wissenschaftler Gehör verschaffen könnten, wenn sie denn wollten.Einigen seiner akademischen Mitstreiterinnen hingegen geht sein Gebaren gehörig auf den Wecker. Muss jetzt ausgerechnet die Republik auch noch über Eichen­berger schreiben, fragt ein bekannter Professor, der öffentlich nicht über seinen Kollegen sprechen will, am Telefon. Unbestritten ist: Reiner Eichen­berger versteht die Gesetze der Aufmerksamkeits­ökonomie wie kaum ein anderer. Auch weil er Ökonomie, Politik und Ideologie bis zur Unkenntlichkeit vermischt. Die Durch­seuchung wird zu seinem Erfolgs­schlagerEichenberger wuchs als Sohn eines Biologen und einer Physikerin auf. Der Grossvater erbte jung eine Tabak­fabrik und verkaufte sie. Mit dem Vermögen reiste er nach Paris und eröffnete da eine anfänglich florierende Galerie, die vor dem Krieg an der Wirtschafts­krise zerbrach. Die Überreste zieren heute das Haus von Eichen­berger: Büsten, Gemälde, Skulpturen. Auf vielen Pressefotos, die Eichenberger in seinem Arbeits­zimmer oder seiner Stube zeigen, stehen die Werke im Hinter­grund. Viel kann er mit der Kunst jedoch nicht anfangen. «Ein schöner Schmuck», sagt er. «Aber ich verstand noch nie, wieso Menschen für Kunst Millionen ausgeben und ihr eine so grosse gesellschaftliche Bedeutung beimessen.» Als Kind putzte Eichen­berger Schildkröten in einer Tier­handlung. Er wollte Zoodirektor werden. Doch statt für Elefanten und Tiger entschied er sich schliesslich – auch aus Interesse an Umwelt­krisen – für ein Wirtschafts­studium. Er sagte sich: Wer über Ökologie nachdenken will, muss nicht Umwelt­wissenschaft studieren, sondern Ökonomie.Von seinem Grossvater hat Eichenberger Kunst geerbt – etwa diese Büste seines Grossvaters.Auch Katze Lila wohnt im Anwesen des Professors.Eichenberger promovierte in der Volks­wirtschafts­lehre in Zürich und wurde 1998 von der Universität Freiburg mit jungen 37 Jahren zum Professor berufen. Während seine Mitstreiter eine Karriere an den grossen Hoch­schulen anstrebten, gab sich Eichen­berger mit der international unbedeutenden Universität Freiburg zufrieden. «In Zürich müssen Forscher in wichtigen akademischen Fach­zeitschriften publizieren», sagt er. «In Freiburg tun wir das auch, aber der Druck ist weniger gross. Deshalb gibt es hier auch Wissenschaftler, die anders sind. Unkonventioneller. Die sich in ihrer Forschung auch auf lokale Fragen und Themen konzentrieren.»Eichenberger hat nie länger im Ausland gearbeitet, bisher keine wichtigen Preise gewonnen und selten für renommierte Fach­zeitschriften geschrieben. Wer verstehen will, wie er es dennoch immer wieder schafft, das ganze Land in Aufregung zu versetzen, muss sich mit seinem jüngsten, mittler­weile wohl bekanntesten Erfolgs­schlager befassen: der gelenkten Durchseuchung.Es war ein Sonntag­abend im März 2020, als ein Wirtschafts­redaktor der Gratis­zeitung «20 Minuten» in Feldmeilen anrief. Der Bundesrat stand kurz davor, einen Shutdown auszurufen, und der Journalist fragte, wie Eichen­berger die drohenden Massnahmen beurteile. Er antwortete, die Regierung müsse die Daten in den Griff bekommen, und bemängelte den «katastrophalen Umgang mit der Statistik». Wenige Stunden später erschien das Interview auf der meist­frequentierten Schweizer Medien­seite und flutete noch am Montag­morgen vor dem ersten Kaffee alle sozialen Netzwerke. Der Titel stach heraus: «Ziel könnte eine gelenkte Durch­seuchung sein.» Damit schaffte es Eichenberger einmal mehr. Aufregung. Das Internet drehte durch: Wie kann er es wagen? Jetzt plustert er sich auch noch zum Mediziner auf! Obwohl die Pandemie damals erst ein paar Monate alt und die Verunsicherung über das richtige Vorgehen selbst unter Epidemiologinnen gross war, präsentierte Eichen­berger für die Gratis­zeitung eine komplette Lösung: Risiko­gruppen sollten sich schützen, während sich gesunde Menschen gezielt infizieren müssten. So könne die Schweiz möglichst rasch die Herden­immunität erreichen und die Massnahmen aufheben.Weder in diesem Interview noch im später erschienenen NZZ-Aufsatz zu diesem Thema stützte sich Eichen­berger auf eigene Modellierungen, Forschungen oder Studien, wie das seine Kollegen aus der Epidemiologie getan hätten. Das «20 Minuten»-Interview schlug trotzdem ein.Hunderttausende klickten, und das Bundes­amt für Gesundheit musste zu Presse­anfragen dazu Stellung beziehen.NZZ-Chefredaktor Eric Gujer wollte von Eichen­berger in seiner Fernseh­sendung wissen, ob er auch die Verantwortung für negative Folgen seines «gigantischen Sozial­experiments» tragen würde.«Natürlich», antwortete Eichen­berger ohne Zögern. Er hafte mit seiner Reputation, die Regierung mit gar nichts. «Auf eine gelenkte Immunisierung zu verzichten, ist das viel dramatischere Experiment.»Unabhängig von Eichenbergers Vorschlag strebten die Niederlande, Gross­britannien und Schweden damals tatsächlich eine gelenkte Durch­seuchung an. Als aber ihre Fall- und Todes­zahlen in die Höhe schnellten, brachen sie das Experiment rasch wieder ab. Es wurde deutlich, dass man Risiko­gruppen unmöglich vollständig vor einer Ansteckung schützen kann.Die Idee einer gelenkten Durch­seuchung war damit gestorben. Fast.In der Schweiz – aber auch anderswo – schleppten ein paar wenige Wissenschaftler die Idee weiter durch die Medien. So auch Eichen­berger. Drei Monate nach seinem Interview mit «20 Minuten» relativierte er zwar in den Tamedia-Zeitungen, man habe damals, als er den Vorschlag zur Durch­seuchung gemacht habe, noch nicht gewusst, dass sich die Verbreitung des Virus durch Hygiene­massnahmen, Social Distancing und Lockdown so stark einschränken lasse. Er versicherte aber, er stehe nach wie vor zu seiner Idee einer «kontrollierten Durch­seuchung»: «Ich habe Hunderte Mails von Leuten bekommen, die bereit sind, auf diese Weise Immunität zu erlangen.»Und heute? Würde Eichen­berger dem «20 Minuten»-Journalisten mehr als ein Jahr später noch einmal dieselben Worte ins Telefon diktieren? «Befänden wir uns in derselben unsicheren Situation wie damals, würde ich zur Problem­lösung erneut die intelligent gelenkte Durch­seuchung vorschlagen», sagt er. In einem trivialen Punkt habe er aber tatsächlich versagt und eine falsche Annahme getroffen, gesteht Eichen­berger: «Die Impfung kam viel schneller als erwartet. Das war gut. Schlecht war, dass ich nicht voraus­gesehen habe, wie unwürdig Politiker die Ungeimpften behandeln, wenn die Hälfte der Wähler geimpft ist. Wenn die Impfung ein Jahr später gekommen wäre, hätte man wählen müssen: wilde Durch­seuchung oder klug gelenkte Durch­seuchung?»Klar ist: Die gelenkte Durch­seuchung, so wie sie Eichenberger im März 2020 vorschlug, hätte wohl Tausende von Menschen das Leben gekostet. Doch obschon die wissenschaftliche Taskforce des Bundes und die Mehrheit aller Virologinnen und Epidemiologen den Vorschlag als unethisch, gefährlich und nicht machbar verurteilten, hat er Eichen­bergers Popularität kaum geschadet.Der Ökonom bleibt weiterhin auf Dauer­sendung. Gemäss der Schweizer Medien­datenbank erschien sein Name in den letzten eineinhalb Jahren in über 590 Presse­beiträgen. Der Vorschlag zur gelenkten Durch­seuchung und die damit verbundene Medien­präsenz brachten ihm 2020 erneut eine Zweit­platzierung im Ökonomen-Ranking der NZZ – wie bereits in den Jahren zuvor. Und auch 2021 hiess es wenig überraschend: Eichen­berger ist der zweit­einflussreichste Ökonom der Schweiz. Medienpräsenz als Parade­disziplinDas NZZ-Ranking habe für ihn persönlich eine grosse Bedeutung, sagt Eichenberger. Die Wissenschafts­karriere sei eine irre akademische Wett­fahrt, selbst­bezogen, und viele würden nur darauf achten, bei ihrer Peergroup anzukommen. «Das Ranking berücksichtigt glücklicher­weise auch, wer sich in gesellschaftlich und politisch relevanten Fragen engagiert.»Viele andere Ökonominnen spielen das Gewicht der Rangliste herunter. Die Rankings würden einzig der Eitelkeit dienen, sagt einer, der immer wieder auf der Liste steht. «Unwichtig», findet ein anderer. Stimmt das? Die Universitäten publizieren die Resultate auf ihren Websites und gratulieren den Gewinnern. Wer wie Eichen­berger auf den oberen Plätzen rangiert, erhält schnell einmal das Prädikat «einfluss­reich» oder wird in Talkshows als «Top-Ökonom» vorgestellt. «Das Ranking findet in der Szene viel Beachtung», sagt NZZ-Journalist Matthias Benz, der die Liste betreut. «Seit sie existiert, beobachten wir, dass sich Ökonominnen stärker in Debatten einbringen.»Das «Ökonomen-Einfluss-Ranking» erstellt die NZZ in Kooperation mit der «Frankfurter Allgemeinen Zeitung» und der österreichischen «Presse» mit dem Ziel, Wissenschaftler zu honorieren, die sich ausserhalb ihres Arbeits­zimmers engagieren. Dabei werten die Journalistinnen seit 2014 vier unterschiedlich gewichtete Kategorien aus. Neben der Forschung zählen für eine gute Platzierung vorwiegend der Einfluss auf die Politik und die Medienpräsenz. Beides sind unangefochtene Parade­disziplinen von Reiner Eichen­berger. In solchen Rankings zählt nicht, was jemand sagt, sondern, von wie vielen es gesehen und wiederholt wurde. Und kein anderer Schweizer Ökonom kommt in den deutsch­sprachigen Wirtschafts- und Print­medien so häufig zu Wort wie Eichenberger. Zwischen ihm, den Journalistinnen und diversen Zeitungs­titeln hat sich in den letzten Jahren eine innige Zweck­beziehung entwickelt, die während der Corona-Pandemie ihren Höhepunkt erreichte. «Wenn Journalisten im Zweifels­fall nicht wissen, wen sie anrufen sollen, kontaktieren sie zuweilen mich», sagt Eichen­berger. Die Medien wüssten, dass sie von ihm eine halbwegs vernünftige ökonomische Antwort erhielten. «Ich gestehe den Journalisten gegenüber auch ein, wenn ich nichts Gescheites oder Originelles beitragen kann – zum Beispiel, wenn es sich um Fragen rund um Wirtschafts­skandale handelt. Aber ich will meinen Geschäfts­partnern – in dem Fall dem Journalisten – immer einen Mehrwert bieten und nehme mir Zeit. Der Anruf soll sich lohnen, denn nur dann kommen sie später wieder zu mir.»Neben den Interviews hat sich Eichen­berger hauptsächlich mit Zeitungs­aufsätzen und markigen Kolumnen in die Debatten geschrieben. Für NZZ, FAZ, «Basler Zeitung», «Handels­zeitung», «Sonntags­Zeitung», «Finanz und Wirtschaft», «Weltwoche» und den «Schweizer Monat» verfasste er in den vergangenen Jahren Hunderte von Meinungs­beiträgen. Hinter vielen, aber nicht allen seiner Beiträge stecke ernsthafte wissenschaftliche Arbeit, die er in den Artikeln nicht immer heraus­streiche, sagt Eichen­berger: «Die anderen beruhen auf diszipliniertem Nach­denken. Bei den Artikeln zur Corona-Pandemie habe ich intensiv mit meinem ehemaligen Mitarbeiter David Stadelmann – heute Professor an der Universität Bayreuth – zusammen­gearbeitet, und wir haben uns in die natur­wissenschaftliche Literatur eingelesen und mit Spezialisten diskutiert.»Eichenberger sagt, von ihm würden Exklusiv­beiträge erwartet. Das sei nicht immer einfach, erzeuge viel Druck, treibe ihn aber an, immer wieder neue Gedanken einzubringen. Eine gute Sache, findet er: «Wenn man Bedeutung haben will, dann sollte man nicht dasselbe sagen wie alle anderen.»Seine Suche nach «dem neuen Gedanken» treibt zuweilen kuriose Blüten. So behauptete Eichenberger 2018 etwa in einer Kolumne, der Velo­verkehr würde pro Personen­kilometer weit höhere externe Kosten als das Auto verursachen, und er bezichtigte das Bundes­amt für Raum­entwicklung des Schwindels, weil es dem Velofahren einen «beträchtlichen Gesundheits­nutzen für die Allgemeinheit» attestierte.Thomas Götschi, Statistiker an der Universität Zürich und Mitautor der Berechnung, sprach darauf in einem Leserbrief von «Falsch­aussagen» und «schwindel­erregender Zahlen­akrobatik». Der Vizedirektor des Bundes­amtes für Raum­entwicklung schrieb, es sei Tatsache, dass der Velo­verkehr mit 3,7 Rappen pro Personen­kilometer tiefere externe Kosten verursache als der Auto­verkehr mit 5,6 Rappen. Und ein aufgebrachter Leser schrieb: «Wer mit ‹Lüge› und ‹Schwindel› hausiert, sollte mit der Materie vertraut sein.» Trotzdem: Diesen März wiederholte Eichen­berger seine Behauptung, der öffentliche Verkehr und der Veloverkehr führten zu hohen gesellschaftlichen Kosten. Darauf schaltete sich Litra ein, ein Verein, der sich für den öffentlichen Verkehr einsetzt und dessen 50-köpfiger Vorstand zur Hälfte aus National- und Stände­räten aller Parteien besteht. Eichen­berger vertrete Ideen, die schon lange und deutlich widerlegt worden seien, heisst es in einer Replik. Die Berechnungen von Eichen­berger seien «akademische Sandkastenspiele».«Je steiler die These, desto höher die Beweis­last», sagt Marius Brülhart, Ökonomie­professor an der Universität Lausanne. «Ich schätze Reiner Eichen­berger als originellen Denker und begabten Kommunikator, er untermauert aber seine Zeitungs­kommentare bisweilen nur mit bruchstück­haften Aussagen, die nicht auf überprüfbaren Analysen beruhen.»Die Kritik teilen auch andere Ökonominnen, mit denen die Republik gesprochen hat. Brülhart ist aber der einzige, der öffentlich darüber spricht. Er hält es für wichtig, dass sich Ökonomen in die öffentliche Debatte einmischen. «Schwierig wird es a"
