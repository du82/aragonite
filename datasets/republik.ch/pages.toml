title = "Die Etikette – Republik"
description = "Wie wir in der Republik debattieren."
full_description = "Die EtiketteBetreten Sie unseren Dialog, betreten Sie unser Wohnzimmer. Machen Sie es sich gemütlich. Damit wir miteinander reden können, möchten wir Sie auf ein paar Spielregeln hinweisen. Update: 25.11.2022TeilenDiesen Beitrag anhören0:00 / 4:36Herzlich willkommen im Dialog! Hier fragen wir nach, wundern wir uns, beglückwünschen oder widersprechen wir uns: Wir kommen miteinander ins Gespräch.Als Gastgeberinnen setzen wir uns für ein angenehmes und offenes Gesprächs­klima ein. Aber am Ende ist jede Diskussion nur so gut wie ihre einzelnen Teilnehmerinnen. Wir bitten Sie deshalb, folgende vier Grundsätze zu beachten:Das bleibt draussen: Nichts verloren haben im Wohn­zimmer der Republik Sexismus, Rassismus und das Kokettieren damit. Ebenso wenig sämtliche Beiträge, die gegen das Gesetz verstossen, oder Kommentare, die für jemanden oder für etwas Werbung machen – schliesslich sind wir ein werbefreies Magazin. Bitte respektieren Sie die Privat­sphäre aller Nutzer. Posten Sie keine Adressen, Telefon­nummern oder ähnliche private Informationen. Spielen Sie mit offenen Karten: Uns ist es wichtig, dass alle Teilnehmerinnen der Diskussion nachvollziehen können, worum es in Ihrem Kommentar geht und aus welcher Position Sie sprechen. Wenn Sie zum Beispiel externe Links posten, dann erklären Sie, worum es sich dabei handelt. Nennen Sie Ihre Quellen und prüfen Sie sie vorab. Ähnliches gilt für Sie selbst: Verwenden Sie Ihren eigenen und keinen erfundenen oder falschen Namen. Definieren Sie Ihre «Rolle» und zeigen Sie damit, aus welcher Perspektive Sie in der jeweiligen Debatte schreiben: als Grossvater, als Lehrperson, als Rechts­expertin? Diese Rolle ist umso wichtiger, wenn Sie aus Gründen der Privatsphäre (berufliche Stellung, besonders persönliche Schilderungen o. Ä.) oder im Falle von vertraulichen Informationen lieber anonym kommentieren. Der Ton macht die Musik: Vergessen Sie nie, dass auf der anderen Seite Menschen sitzen. Bleiben Sie beim Inhalt des Artikels oder bei der Leitfrage der Debatte und beleidigen Sie niemanden. Auch nicht, wenn das Gegenüber diese Regel schon gebrochen hat. Im Zweifels­fall: Schreiben Sie nichts, was Sie Ihrem Gegenüber nicht auch ins Gesicht sagen würden. Und falls Sie sich einmal in Rage gebracht sehen sollten: durchatmen! Nehmen Sie sich Zeit zum Antworten. Sie müssen nicht sofort reagieren. Eine bestehende Wortmeldung können Sie auch einfach mit einem Klick positiv oder negativ bewerten.Miteinander statt neben­einander: Der Dialog der Republik soll für alle Verlegerinnen zugänglich sein. Es geht nicht darum, möglichst laut und dominant aufzutreten, sondern darum, einen inhaltlichen Austausch voran­zubringen. Wir wünschen uns eine Vielfalt an Stimmen und Perspektiven. Denken Sie deshalb daran, auch anderen Personen Raum zu geben, und akzeptieren Sie es, wenn nicht alle Anwesenden Ihre Meinung teilen.Beiträge, die gegen diese Grundsätze verstossen, können gelöscht werden. Fällt ein Profil mehrfach negativ auf, behalten wir uns das Recht vor, Nutzer von der Teilnahme am Dialog auszuschliessen.Falls Ihnen beim Debattieren ein bestimmter Kommentar negativ auffällt und Sie ihn melden oder die Moderation herbeirufen wollen, dann markieren Sie ihn mit einer «Flagge» (über das Drei-Punkte-Menü oben rechts am Eingabefeld). Sie haben immer auch die Möglichkeit, sich mit Ihrem Anliegen direkt an uns zu wenden (kontakt@republik.ch).Neben alledem darf natürlich das Wichtigste nicht vergessen gehen: Schön, sind Sie da. Wir freuen uns auf Ihre Perspektiven, Ansichten und Erfahrungen und danken Ihnen, dass Sie diese mit uns teilen.Ihre Crew der RepublikPS: Haben wir etwas übersehen? Lassen Sie es uns wissen: kontakt@republik.ch"
