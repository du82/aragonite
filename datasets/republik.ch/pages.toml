title = "Man hätte es wissen können – Republik"
description = "Die Anti-AfD-Demos in Deutschland sind ein schönes Zeichen. Aber wird die Bedrohung von rechts wirklich ausreichend verstanden?"
full_description = "«Kulturfremden» Menschen droht AfD-Politiker Björn Höcke gerne mit «wohltemperierter Grausamkeit» (eine Aufnahme aus dem Jahr 2017). Hannes Jung/laifMan hätte es wissen könnenDie Enthüllungen um die Deportations­pläne von AfD-Politikern und rechts­extremen Ideologen haben die deutsche Gesellschaft wach­gerüttelt. Die Bedrohung von rechts wird aber immer noch nicht ausreichend verstanden.Eine Analyse von Wilhelm Heitmeyer, 26.01.2024FolgenMerkenTeilen141 Beiträge14114 Minuten14'Vorgelesen von Jonas Rüegg Caputo0:00 / 21:28Viele hunderttausend Menschen sind in den letzten Tagen in ganz Deutschland gegen Rechts­extremismus und speziell gegen die AfD auf die Strasse gegangen. Sechsstellige Teilnehmer­zahlen gab es allein bei Demos in München und Berlin. In Hamburg und München mussten die Demonstrationen gar abgebrochen werden – nicht weil es zu Ausschreitungen gekommen wäre, sondern weil sich derart viele Teilnehmerinnen versammelten, dass die Innen­städte überfüllt waren. Die Proteste werden keineswegs nur von den grösseren Städten getragen und sie beschränken sich nicht auf das vergangene Wochenende. Vielmehr gingen die Demonstrationen unvermindert weiter, zuletzt waren es etwa bei einer Kundgebung in Darmstadt 17’000 Menschen – mehr als ein Zehntel der Einwohnerzahl.Es ist unverkennbar: Seit das Recherche­netzwerk «Correctiv» enthüllte, dass bei einem Potsdamer Geheim­treffen hochrangige AfD-Funktionäre gemeinsam mit Neonazis und Unter­nehmern an Plänen zur Vertreibung von Millionen Menschen aus Deutschland arbeiteten, ist der Protest gegen rechtsextreme Ideologie und Menschen­feindlichkeit deutlich lauter und sichtbarer geworden. Es scheint, als habe das Bewusstsein dafür deutlich zugenommen, dass die AfD und ihre Verbündeten eine fundamentale Bedrohung für die freiheitlich-demokratische Grund­ordnung und für Millionen Menschen im Land darstellen. Die «Correctiv»-Recherche hat offenkundig eine Menge Leute aufgeweckt.Zugleich aber folgt das Potsdamer Geheim­treffen nur einem längst bekannten Muster. Was durch die «Correctiv»-Recherche aufgedeckt wurde, ist geradezu ein Parade­beispiel für «rechte Bedrohungs­allianzen», also die Vernetzungs­arbeit der extremen Rechten, die immer auch in die Mitte der Gesellschaft hineinzielt. Man muss daran erinnern: Am Potsdamer Geheim­treffen haben auch unterschiedliche Akteure aus demokratischen Parteien teilgenommen.Zum AutorWilhelm Heitmeyer (78) ist Soziologe. Seine Buchreihe «Deutsche Zustände» und viele weitere Publikationen sind zu Standard­werken geworden. Er gründete 1996 das Institut für inter­disziplinäre Konflikt- und Gewalt­forschung der Universität Bielefeld. Bis zu seinem altersbedingten Ausscheiden 2013 war er Direktor des Instituts. Seitdem ist er Senior­professor in Bielefeld. Neben der Leitung zahlreicher Forschungs­projekte, die von der Deutschen Forschungs­gemeinschaft (DFG) gefördert wurden, war er von 2008 bis 2013 editor-in-chief des von ihm gegründeten «International Journal of Conflict and Violence» (IJCV). Seine Haupt­forschungs­gebiete sind Gewalt, Rechts­extremismus, soziale Desintegration und Gruppen­bezogene Menschen­feindlichkeit.Jetzt zu Beginn des Wahljahres 2024, in dem die AfD laut Meinungs­umfragen bundesweit bei etwa 20 bis 22 Prozent liegt, ist diese Bedrohung greifbarer denn je. In einigen ostdeutschen Bundes­ländern, wo im Herbst 2024 Landtags­wahlen stattfinden werden, kommt die AfD sogar auf rund 30 Prozent und mehr. Sollten sich diese Meinungs­umfragen in Wahl­stimmen umsetzen, dann stehen konkrete Macht­fragen an – und damit auch Bedrohungen der offenen, pluralistischen Gesellschaft und der liberalen Demokratie.Die Fragen, die sich alle dringlich stellen, lauten also: Wie funktionieren rechte Bedrohungs­allianzen und was ist die Strategie der rechtsautoritären Vernetzungs­arbeit? Was steckt hinter dem Wort «Remigration», das beim Potsdamer Treffen der Schlüssel­begriff war – und deshalb in Deutschland erst kürzlich zum Unwort des Jahres gekürt wurde?Bevor ich darauf eine Antwort gebe, möchte ich zunächst einen genaueren Blick auf das ideologische Angebot der AfD werfen – und auf die Frage, warum es bei vielen verfängt.Die Attraktivität der AfD in KrisenzeitenBei der Einordnung der AfD im Parteien­spektrum und der Frage nach den Gründen für die hohen Zustimmungs­werte wird immer noch und immer wieder darauf verwiesen, dass sie «rechts­populistisch» sei oder nach Einschätzung verschiedener Verfassungs­schutz­ämter als «rechts­extremistisch» gelten muss. Aus meiner Sicht sind beide Einordnungen nicht präzise genug, denn die AfD ist eine Partei «neuen Typs». Ihr ideologisches Angebot lässt sich meines Erachtens am besten mit dem Begriff «Autoritärer National­radikalismus» fassen.Das Autoritäre bestimmt das Gesellschafts­modell und zeigt sich in der Propagierung traditioneller Lebens­weisen, der Abwehr und Ausgrenzung von sexueller Vielfalt, der starken Orientierung an Hierarchien und Kontroll­verlangen, aber auch in der Vorstellung von «reiner» ethnischer Homogenität.Das Nationale zeigt sich in den Überlegenheits­ansprüchen der deutschen Kultur. Deshalb ist die Politik der AfD auch vor allem ein Kultur­kampf. Hinzu kommt eine nationalistische Identitäts­politik als Ausgrenzung und eine Fixierung auf das «Deutschsein» als Identitäts­anker. In diesen Kontext gehört dann auch der Geschichts­revisionismus der Partei: Sie strebt nicht weniger als eine Umdeutung deutscher Geschichte an. Schliesslich wird der Nationalismus der Partei wirtschafts­politisch komplettiert durch die Leitlinie «Deutschland zuerst».Das Radikale der AfD wird sichtbar im aggressiven Kommunikations- und Mobilisierungsstil, durchzogen von gruppen­bezogener Menschen­feindlichkeit, also die gezielte Abwertung, Diskriminierung und Ausgrenzung von markierten Gruppen. Eine ausgeprägte Orientierung an Feind­bildern ist hier das zentrale Moment.Dieses Politik­angebot ist offensichtlich in Teilen der Bevölkerung (nicht nur in Ostdeutschland) attraktiv, insbesondere in Krisen­zeiten, wie sie seit 2000 immer häufiger auftreten: zunächst als sektorale Krisen, bei denen nur Teile der Gesellschaft direkt betroffen sind. Die Corona-Pandemie war dann erstmals eine systemische Krise, in der gleichsam alle Facetten der Gesellschaft «infiziert» waren. Aktuell dominiert eine multiple Krise, in der zahlreiche Konflikte und Krisen gleichzeitig auftreten.Gesellschaftliche, ökonomische und politische Problem­lagen sind dann als Krisen zu klassifizieren, wenn die Routinen bisher eingesetzter Instrumente zur Behebung der Problem­lagen nicht mehr sofort, schnell und kostenlos wirken – und wenn die gewohnten, eingelebten und Sicherheit gebenden Zustände vor den Krisen nicht wieder herstellbar sind. Dies erzeugt in Teilen der Gesellschaft tatsächliche oder auch nur befürchtete Verluste der Kontrolle über den eigenen Wohlstand, den eigenen Status und die Zukunfts­planungen.An diesem Kontroll­verlust setzt die AfD mit ihrem beschriebenen Politik­angebot an. Zum einen, indem sie eine Emotionalisierung der Problem­lagen vorantreibt; zum anderen, indem sie die Wieder­herstellung der Kontrolle mittels ihrer autoritären, nationalistischen und radikalen Politik verspricht: «Wir holen uns unser Land und unser Volk zurück», lautete 2017 die berüchtigte Ansage von Alexander Gauland. Wie die jüngsten Enthüllungen nun noch einmal vor Augen geführt haben, soll das offenbar auch heissen: Kontrolle durch millionenfache Vertreibung.«Remigration»: Ein Deportations­konzeptIm Zuge dieser Krisen­entwicklungen und angekurbelt durch die Zustimmungs­werte von beträchtlichen Teilen der Bevölkerung haben sich immer radikalere Macht­fantasien entwickelt, denen die AfD vor allem in der Migrations-, Asyl- und Flüchtlings­frage freien Lauf lässt. Diese Strategie hat sich für sie schon 2015/2016 bei der grossen Flüchtlings­bewegung und den durch Kanzlerin Merkel geöffneten Grenzen bewährt, als der Aufschwung der damals hoch zerstrittenen Partei begann, die durch diesen Kultur­kampf immer mehr homogenisiert und radikalisiert wurde.Seitdem wird intensiv an einer Diskurs­verschiebung gearbeitet, konkret: Das sogenannte Overton-Fenster des öffentlich Sagbaren wird immer weiter nach rechts verschoben, indem Begriffe, die bisher ausserhalb der öffentlichen Debatten lagen, umgedeutet und zunächst über die sozialen Netzwerke normalisiert worden sind. So ist das bereits in der Vergangenheit mit Begriffen wie «Bevölkerungs­austausch» oder «Umvolkung» geschehen, die immer mit dem Schüren der Angst vor Kontroll­verlust und dem Untergang des deutschen Volkes verbunden wurden.In diesem Zusammenhang ist auch die Begriffs­umdeutung von «Remigration» zu platzieren. Ursprünglich handelt es sich um einen Begriff aus der Migrations­forschung, der die freiwillige Rück­wanderung von Migrantinnen in ihre Herkunfts­länder meint. Im Kontext des rechten bis rechts­extremistischen Spektrums wird dieser rein analytische soziologische Begriff jedoch gekapert und mit neuem Inhalt versehen. Hinter dem so wissenschaftlich klingenden Begriff werden nun Deportations­fantasien verharmlost. Er meint im rechten Diskurs nichts anderes als die Vertreibung oder gar Deportation von Asyl­bewerberinnen, Flüchtlingen und sogenannten «nicht assimilierten Staats­bürgern».Diese Begrifflichkeit ist in AfD-Kreisen keineswegs erst seit dem Potsdamer Treffen in Gebrauch. Auf dem Europawahl-Parteitag der AfD im August 2023 wurde vielfach die millionen­fache «Remigration» gefordert, über die Bericht­erstattung in den Medien popularisiert und damit im Sinne der AfD auch normalisiert.Wenn nun also aufgedeckt wurde, dass im November 2023 in einer Villa in Potsdam eine Versammlung stattgefunden hat, bei der Martin Sellner, der österreichische Rechts­extremist und führende Kopf der Identitären Bewegung, einen Masterplan zur millionenfachen «Remigration» vorgestellt hat – und zwar in Anwesenheit unter anderem von AfD-Politikern und Mitgliedern der CDU-Werteunion –, dann ist zu sagen: Man hätte es schon länger wissen können. Bereits 2018 hat der höchst einfluss­reiche AfD-Politiker Björn Höcke, der auch Fraktions­vorsitzender im Thüringer Landtag ist, in seinem Buch «Nie zweimal in denselben Fluss» gross angelegte Remigrations­massnahmen «kulturfremder» Menschen angekündigt, wenn die AfD an der Macht sei. Für diese Massnahmen, so heisst es im Buch, müsste wohl mit «wohl­temperierter Grausamkeit» vorgegangen werden, wobei auch mit Opfern in den eigenen Reihen zu rechnen sei. Auch nach der Aufdeckung durch das «Correctiv»-Recherche­netzwerk schrieb der AfD-Bundestags­abgeordnete René Springer auf der Plattform X: «Wir werden Ausländer in ihre Heimat zurückführen. Millionen­fach. Das ist kein Geheimplan. Das ist ein Versprechen.»Die gefährlichen Bedrohungs­allianzenUm das Ausmass der Bedrohung der pluralistischen Gesellschaft und der liberalen Demokratie begreifbar zu machen, habe ich zusammen mit Kollegen 2012 ein Konzept eines Eskalations­kontinuums veröffentlicht, das 2020 dann auf den aktuellen Entwicklungs­stand gebracht wurde. Dieses Modell soll deutlich machen, welche Akteure an dem Prozess der Bedrohung beteiligt sind, mit welchen Eskalationen zu rechnen ist und welche Mechanismen wirksam sind.Entgegen der landläufigen Sichtweise mit der Fokussierung auf die AfD setzt sich unser Konzept der «rechten Bedrohungs­allianzen» aus fünf Bestand­teilen zusammen. Bildlich lässt sich dieses Konzept mit einer Zwiebel und deren Schalen veranschaulichen.Die äussere, grösste Schale bildet die Bevölkerung mit ihren Einstellungs­mustern. Unsere Langzeit­untersuchungen zur «Gruppenbezogenen Menschen­feindlichkeit» seit 2002 ergeben, dass innerhalb der Bevölkerung ein erhebliches Potenzial der Abwertung, Diskriminierung und Ausgrenzung markierter Gruppen vorliegt. Dieses richtet sich unter anderem gegen Geflüchtete, Juden, Muslime, Schwarze, Roma, Homo­sexuelle, Behinderte, Obdachlose. In der Bevölkerung hat sich eine Ideologie der Ungleichwertigkeit verbreitet. Durch diese Einstellungs­muster werden Legitimationen für politische Aktionen bereit­gestellt, die die AfD dankbar aufgreift.Der Autoritäre National­radikalismus der AfD selbst stellt – bildlich gesprochen – die nächste, kleinere Schale dar. Die Partei setzt an den Einstellungs­mustern in der Bevölkerung an, radikalisiert sie und formt daraus politische Parolen für die mediale und parlamentarische Öffentlichkeit. Sie arbeitet dabei mit einer Taktik der «Gewalt­membrane». Gemeint ist damit, dass Begriffe im Kontext der Migration wie etwa «Bevölkerungs­austausch» oder «Umvolkung» immer mit dem Zusatz des angeblich drohenden Untergangs des deutschen Volkes, der deutschen Kultur und der deutschen Identität verbunden werden. Im Endeffekt bedeutet dies, dass die AfD zwar nicht direkt zur Gewalt aufruft, aber die Legitimation für verfassungs­feindliche Kräfte liefert – die nächste, wiederum kleinere Schale in unserem Zwiebel­bild.Sie besteht aus dem system­feindlichen Milieu des bewegungs­förmigen Rechts­extremismus, zu dem auch neonazistische Kameradschaften, die Identitäre Bewegung und die Reichsbürger­szene zählen. In diesem Milieu gibt es auf der Basis der von der AfD ideologisch und medial vorbereiteten Untergangs­fantasien die Tendenz, sich ein «Notwehr­recht» zu konstruieren, das auch Gewalt legitimiert. Mit anderen Worten: Es geht um eine Legitimierung von Gewalt gegen die markierten Gruppen, gegen Vertreterinnen des Staates, Politikerinnen und feindliche Personen, die die offene Gesellschaft und die liberale Demokratie befürworten und stützen. So bahnen sich im rechts­extremistischen Milieu Fantasien zum Umsturz und zur Zerstörung des demokratischen Systems an. Dies wiederum kommt der nächsten Zwiebel­schale zugute: dem klandestinen rechts­terroristischen Planungs- und Unterstützungs­milieu.Es handelt sich dabei um konspirativ agierende Gruppen, die sich teilweise auch aus dem system­feindlichen, aber noch öffentlich agierenden Milieu rekrutieren. Hier dominieren dann nicht mehr nur autoritäre Veränderungs­strategien wie in der AfD, sondern Umsturz­fantasien und -planungen, die auch mit Waffen­gewalt durchgeführt werden sollen. Inzwischen sind zahlreiche solche Organisationen aufgedeckt worden, von denen die Gruppe um den Adligen Heinrich XIII. Prinz Reuss nach Einschätzung der Sicherheits­behörden die bisher grösste und gefährlichste darstellt. Zu ihr gehören Polizisten, Soldaten und auch eine ehemalige AfD-Bundestags­abgeordnete, die als Richterin tätig war. Ihnen wird demnächst der Prozess gemacht.Den kleinsten und gefährlichsten Kern des Eskalations­kontinuums bilden schliesslich rechts­terroristische Klein­gruppen wie der National­sozialistische Untergrund (NSU), der zwischen 2000 und 2007 insgesamt 10 Morde begangen hat. Auch jene rechts­terroristischen Täter, die in Halle (2019) und Hanau (2020) Morde begangen haben (und gleichzeitig in reale oder virtuelle Bezugs­gruppen eingebunden waren), gehören hierher.Mit diesem Konzept kann ver"
