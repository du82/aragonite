title = "Eine Sprache für den Schmerz – Republik"
description = "Jahrelang trennte das Saisonnierstatut Nazmi Kadriu von seiner Familie. Erst heute finden sie Worte, um darüber zu sprechen."
full_description = "Eine Sprache für den SchmerzNazmi Kadriu arbeitete in den 90ern in der Schweiz, Frau und Kinder mussten in Kosovo bleiben. So bestimmte es das Saisonnier­statut. Erst heute finden sie Worte dafür, was die jahrelange Trennung mit ihrer Familie gemacht hat. Und auch heute ist das Grundrecht auf Familien­nachzug wieder bedroht. Von Tuğba Ayaz (Text) und Florian Kalotay (Bilder), 15.02.2025MerkenTeilen34 Beiträge3422 Minuten22'Diesen Beitrag anhören0:00 / 30:22In den 1990ern arbeitete Nazmi Kadriu als Saisonnier in der Schweiz. Entspannte Momente wie auf diesen Bildern waren dabei rar. PrivatSchuss, Schnitt, Haut abziehen. Ein Kaninchen zu schlachten, weckt bei Nazmi Kadriu anfangs Unbehagen. Doch nach den ersten Versuchen findet er seine Technik: Schuss, Schnitt, Haut abziehen. In wenigen Minuten ist das Tier erledigt. Dutzende Kaninchen schlachtet er. Danach sind die Hühner an der Reihe. Das Schlachten ist 1992 Nazmi Kadrius Aufgabe als Saisonnier auf einem Bauernhof im Kanton Jura. Davor hat er zwei Jahre auf einem anderen Hof geschuftet: Tiere füttern, Ställe misten und putzen. Beim Schlachten merkt er, dass die Arbeit im Stall körperlich härter war. Denn dort musste er hungern. Die Mahlzeiten, die der Bauer auftischte, sättigten ihn nicht. Der Bauer beschwerte sich ohnehin: Er esse zu viel, wie die anderen Jugoslawen, Italiener oder Spanier. In der Not stillte Nazmi Kadriu seinen Hunger mit unreifen Äpfeln vom Feld. Erst als ein Schweizer Lehrling auf den Hof kam, der grosse Mengen verspeiste, bekam auch Kadriu mehr zu essen.Das Schwierigste bleiben die Nächte. Er liegt wach, grübelt, in Sorge um seine Frau, seine drei Kinder, die in Pristina leben. Manchmal steht er auf, geht zur nächsten Telefon­kabine, um sie anzurufen. Zwei, drei Minuten Gewissheit für knapp zehn Franken.Es sind die Jahre vor dem Kosovokrieg. Zu jener Zeit greift das serbische Regime mit eiserner Hand durch. Ersetzt kosovo-albanische Staats­angestellte mit serbischen, diktiert den Schulen einen serbischen Lehrplan. Auch Nazmi Kadriu, Kosovo-Albaner, verliert seine Stelle als Minen­arbeiter. Er ahnt, was auf das Land zukommt. Und weiss: Unter diesen Umständen kann er seine Familie nicht länger versorgen.So bricht er 1990 mit 41 Jahren auf in die Schweiz, wo sein Bruder bereits seit fünf Jahren als Saisonnier arbeitet. Kadriu selbst ahnt nicht, dass er des Bauers Knecht sein wird. Dass er bis zu zwölf Stunden am Tag, manchmal sieben Tage die Woche, schuften sollte, um 1200 Franken zu verdienen, die seiner Familie in Kosovo ein besseres Leben ermöglichen sollten.Nazmi Kadriu ist in den 1990er-Jahren einer von unzähligen Saisonniers aus dem ehemaligen Jugoslawien, die neun Monate arbeiten und danach für drei Monate ausreisen müssen. Das regelt das damalige Saisonnier­statut, das seit 1934 auf dem Bundesgesetz «Aufenthalt und Niederlassung von Ausländern» fusst. Eine unbefristete Nieder­lassung in der Schweiz ist für Saisonniers nicht vorgesehen, ihre sogenannte Integration unerwünscht. Das verhindert das Gesetz auch, indem es den Familien­nachzug ausdrücklich verbietet. Erst 2002 wird dies abgeschafft, als das bilaterale Abkommen über die Personen­freizügigkeit mit der EU in Kraft tritt.Knapp siebzig Jahre lang reisst das Saisonnier­statut Familien auseinander. Beutet Arbeitskräfte aus. Ebnet den Weg für den rechts­konservativen Diskurs um die sogenannte Überfremdung, der bis in die Gegenwart andauert.Bis heute ist der Familien­nachzug einer der ersten Angriffs­punkte, um die Grund­rechte von Menschen mit Migrations­geschichte zu beschneiden. Vor wenigen Wochen erst lehnte der Ständerat mit einer knappen Mehrheit – 20 zu 18 Stimmen – eine Motion ab, die vorläufig aufgenommenen Menschen verbieten wollte, ihre Familie nachzuholen.Im Nationalrat hatte die Motion in der Herbst­session eine Mehrheit gefunden. Neunzig Jahre nachdem das Saisonnier­statut in Kraft getreten war.Die Debatte um den Familien­nachzug steht für eine Konstante in der Schweiz, die ein Grundrecht immer wieder von neuem hinterfragt. Und damit die strukturelle Gewalt des Saisonnier­statuts fortschreibt, das Menschen über Generationen traumatisiert hat.Männer, Frauen, Kinder ehemaliger Saisonniers prägt der Schmerz der Trennung, der Verlust der gemeinsamen Zeit, wie ihn die Familie Kadriu durchlebte. Viele von ihnen suchen bis heute nach einer Sprache für diesen Schmerz. Und die Geschichte droht sich zu wiederholen.SchuftenAn einem Winter­nachmittag bedeckt der erste Schnee die Strassen. Nazmi Kadriu, inzwischen 75, betritt mit seinem Sohn Lulzim Kadriu, 46, ein Café beim Bahnhof Delémont. Der Vater hält einen Notiz­block in der Hand.Nazmi Kadriu ist ein feingliedriger Mann mit einer ruhigen Wesensart. Seine breiten Hände sind gezeichnet von Arbeit. Er wirkt bedrückt. Ich frage, ob ihn das Gespräch belastet. Seine Frau sei nicht bei guter Gesundheit, sagt er, heute habe sie einen schlechten Tag gehabt. Er spricht Französisch, und wenn er nicht weiterkommt, übersetzt der Sohn aus dem Albanischen ins Schweizer­deutsche. Nazmi Kadriu beginnt sofort zu erzählen.«Als ich in die Schweiz kam, lebte ich die ersten Tage bei meinem Bruder. Ein Arzt untersuchte mich, ob ich gesund genug bin, um zu arbeiten. Danach zog ich auf den Bauernhof, wo ich Arbeit gefunden hatte. Ich verstand kein Wort Französisch. Fühlte mich verloren. Doch nickte ich immer, wollte keine Probleme machen. In fünf Jahren hatte ich zwei Patrons. Die Patrons hatten wenig Respekt vor uns Saisonniers. Beide zahlten keine Beiträge an die Sozial­versicherungen. Erst Jahre später wurde mir klar, dass ich auf beiden Höfen schwarz­gearbeitet hatte. Nach jeder Saison war ungewiss, ob ich für eine weitere zurück­kommen darf. Hatte der Patron Arbeit, beantragte er eine Bewilligung. Diese holte ich dann in der Schweizer Botschaft in Belgrad.»Saisonniers verdienten bis zu 10 Prozent weniger als Personen mit Schweizer Niederlassung. Allein die Land­wirtschaft beschäftigte 1990 bis zu 180’000 Schwarzarbeiter, die behördlich toleriert waren. Saisonniers lebten unter prekären Bedingungen in Baracken oder Mansarden­zimmern, durften weder den Arbeit­geber noch die Wohn­gemeinde wechseln. Bei einem Unfall mussten sie in ihr Herkunfts­land zurück­kehren und für die Heilungs­kosten selbst aufkommen.Mit dem Saisonnier­statut holte die Schweiz Arbeits­kräfte nach Bedarf, deren sie sich im Falle einer schwächelnden Wirtschaft entledigen konnte. Diese Handhabung sollte eine Massen­arbeitslosigkeit verhindern, wie sie die Schweiz in den 1930er-Jahren erlebt hatte. Doch besonders in den Jahren nach dem Zweiten Weltkrieg brauchte die Schweiz Arbeitskräfte, die Brücken, Gebäude, Strassen bauten. Viele von ihnen, auch Paare, kamen damals aus Italien, Spanien oder Portugal.Niederlassung und Familien­nachzug so restriktiv zu regulieren, sollte als Instrument gegen die sogenannte Überfremdung dienen. Besonders prägten diesen Diskurs die fremden­feindliche «Anti-Italiener-Partei» der 1960er-Jahre und die Schwarzenbach-Initiative 1970, die beide den Anteil der sogenannten Ausländerinnen beschränken wollten. Der Schwarzenbach-Initiative stimmten 46 Prozent der Bevölkerung zu. Im Falle einer Annahme hätten Hundert­tausende Menschen die Schweiz verlassen müssen.«Pas facile, madame», sagt Nazmi Kadriu, bevor er wieder zum Erzählen ansetzt. Ein Satz, den er immer wieder sagen wird, wenn er innehält, nach Worten sucht oder dem Gesagten Nachdruck verleihen will.«Ich litt sehr darunter, dass ich ohne meine Familie hier leben musste. In Gedanken war ich laufend bei meiner Frau, meinen Kindern.Meine Frau hatte in Pristina oft Probleme mit der serbischen Polizei. Sie setzten uns Kosovo-Albaner unter Druck, respektierten unsere Kultur nicht.Nachts lag ich besorgt wach.Ich konnte nicht schlafen.Und konnte nicht schlafen.Meine Frau, meine drei Kinder waren weit weg.»Die Saisonniers mussten ihre Kinder, oft auch ihre Frauen im Herkunfts­land zurück­lassen. Kamen sie als Paar in die Schweiz, gaben sie die Kinder in die Obhut von Verwandten im Herkunfts­land. Andere brachten sie in Heimen nahe der Schweizer Grenze unter, um sie mehr als einmal im Jahr zu sehen.Manche Eltern wiederum brachten ihre Kinder ohne Aufenthalts­bewilligung über die Schweizer Grenze. Die Kinder mussten dann still in Wohnungen verharren, während die Eltern arbeiteten. Sie konnten nicht zur Schule, waren nicht kranken­versichert. Entdeckten die Behörden sie, oftmals durch Verrat in der Nachbarschaft, verwiesen sie die Kinder des Landes. Nach einer Geburt stellten die Behörden sicher, dass das Neugeborene möglichst bald das Land verliess – mit oder ohne Mutter.«Für eine Familie ist beides gleich traumatisch: ob sie die Kinder verstecken oder bei Verwandten zurück­lassen müssen», sagt Marina Frigerio. Die Psychologin befasst sich bereits ihr ganzes Berufs­leben lang mit dem Leid ehemaliger Saisonnier­familien.Auf ihre Geschichten stiess Frigerio erstmals als Studentin Ende der Siebziger­jahre. Sie gab Kurse am Institut einer Gewerkschaft, wo italienische Saisonniers ihren Schul­abschluss nachholen konnten. Einer schlief während der Stunde immer ein. Sie fragte ihn, ob sie ihn so langweile. Er verneinte. Er sei erschöpft, weil er morgens vor fünf aufstehe, auf die Baustelle müsse, abends rasch esse, in den Unterricht eile. Zurück in der Baracke schlucke er Schlafmittel, ohne könne er nicht schlafen, weil er seine Frau, seine Kinder so vermisse.Als Frigerio nach ihrem Studium bei Beratungs­stellen arbeitet und in italienischen Vereinen aktiv ist, vertrauen sich ihr zunehmend ehemalige Saisonnier­familien an. Sie erzählen von Schuld­gefühlen. Fragen sie nach Rat, weil ihre Kinder, die endlich eine Aufenthalts­bewilligung bekommen haben, in der Schule hadern. «Die Kinder hatten Angstzustände, verhielten sich unsicher oder aggressiv, sprachen leise oder gar nicht. Die Traumata der Trennung äusserten sich unterschiedlich», sagt Frigerio. «Die Eltern wiederum kämpfen bis heute mit Schuld­gefühlen, auch wenn sie in den aller­meisten Fällen keine Wahl hatten.»Frigerio denkt damals: Es darf nicht sein, dass diese Geschichten verborgen bleiben. In «Versteckte Kinder» (1992) veröffentlicht sie Berichte aus erster Hand, weitere folgen in «Verbotene Kinder» (2014). Die Bücher sind auch ein Grund, warum Frigerio bis heute Betroffene therapiert. Häufig kommen nach der Lektüre Kinder ehemaliger Saisonniers, jetzt Erwachsene, in ihre Praxis, um ihre Erfahrungen aufzuarbeiten. «Fast jede Woche höre ich, dass sich Patienten mit ihrer Geschichte versöhnen, auch mit ihren Eltern. Sie stellen ihre Schicksale in den Kontext. Erkennen, dass auch ihre Eltern Opfer dieses Gesetzes waren. Dieser Prozess ist sehr schwer, sehr traurig, sehr schmerzhaft.»Bis heute gibt es keine offiziellen Statistiken dazu, wie viele Familien das Saisonnier­statut trennte. Saisonniers zählten nicht zur ständigen Wohn­bevölkerung, ihre Zahl schwankte jährlich. Der Migrations­historiker Toni Ricciardi von der Universität Genf eruierte anhand diverser Forschungs­daten, dass alleine zwischen 1949 und 1975 rund fünfzig­tausend Kinder von Saisonniers versteckt in der Schweiz lebten. Und bis zu einer halben Million Familien von der Trennung durch das Saisonnier­statut betroffen waren.ErinnernLulzim Kadriu hat Feierabend, als wir uns zum ersten Gespräch in Winterthur treffen, zwei Wochen bevor wir gemeinsam seinen Vater sehen. Er ist ein zugewandter Mensch, mit dem man mühelos plaudert. Er erzählt von seiner Arbeit als Bauleiter. Rasch landet er bei seinem Arbeitsethos: Respekt, Teamgeist, Pflicht­bewusstsein. Er klingt unerschütterlich in seinen Überzeugungen.Die Abwesenheit des Vaters umgibt Lulzim Kadriu zwischen seinem zwölften und siebzehnten Lebens­jahr immerzu wie ein Schatten. Erinnern kann er sich an die Zeit nur noch bruchstück­haft. Nur gewisse Fragmente haben sich ihm scharf eingeprägt.Die Wohnung mit eineinhalb Zimmern, wo das Bett der Mutter in der Küche stand.Wie er als Ältester von drei Kindern putzte, einkaufte, organisierte.Das Unbehagen, nachdem in ihrem Zuhause eingebrochen worden war.Wie ihn die Polizei beim Geld­wechseln verhaftete.Jetzt als Erwachsener will er seine Familien­geschichte verstehen, «Erinnerungen, die pausieren» nachgehen.Lulzim Kadriu kommt mit siebzehn in die Schweiz. Lernt Hochbau­zeichner im Kanton Jura. Dort werden auch seine zwei Töchter geboren, die inzwischen erwachsen sind. Später zieht die Familie in den Kanton Zürich.Zu Beginn des Gesprächs wiederholt er, was er am Telefon sagte: Er will auch erzählen, um seiner Eltern­generation eine Stimme zu geben. Und vielleicht bricht beim Erzählen auch bei ihm etwas auf, «eine Art verborgene Trauer, von der ich nicht wusste».Erinnert er sich noch an den Tag, als sein Vater zum ersten Mal in die Schweiz ging?«Nein, ich war zwölf, mein Bruder zehn und meine Schwester acht. Aber ich erinnere mich genau, wenn er nach einer Saison zurückkehrte. Es gab Schokolade, Geschenke, Geld. Er brachte Wärme in die Familie. Wir unternahmen viel, besuchten Verwandte im Dorf meines Vaters, Hajvali. Wir waren glücklich an diesen Tagen.»Das Glück verflüchtigte sich zu rasch, wenn nach drei Monaten der Tag des Abschieds bevorstand. «Plötzlich war er wieder weg. Wir verstanden nicht, warum; warum ohne uns. Er sagte immer: Wir brauchen Geld. Ich dachte, es sei üblich, dass Väter weggehen.»War der Vater weg, musste Lulzim Kadrius Mutter den Alltag mit ihren Kindern wieder alleine meistern. Sie litt damals an einer Krankheit, die sie häufig in das Bett zwang. Die Eineinhalb-Zimmer-Wohnung hatte Nazmi Kadriu als Staats­angestellter bei den Minen zu guten Konditionen bekommen. Damals hatte das Paar ein Kind. Als zwei weitere Kinder dazu­gekommen waren, fanden sie keine grössere Wohnung mehr.Als Ältester half Lulzim Kadriu seiner Mutter, wo er konnte, übernahm «alles, was Eltern gemeinsam machen». Als Erwachsener wurde ihm bewusst, wie viel Selbst­ständigkeit von ihm verlangt worden war. Seine Mutter war überfordert mit drei Kindern, ihrer Krankheit. «Sie musste viel alleine entscheiden. Der Staat war unstabil. Die Angst vor dem Krieg lag in der Luft.»Der Vater fehlte. Er fehlte bei der Bewältigung des Alltags. Er fehlte als Stütze, wenn sich etwa die Schule wegen Raufereien bei der Mutter meldete. Er fehlte als Hüter, als sie von Verwandten zurück­kehrten und in die Wohnung eingebrochen worden war. «Meine Eltern konnten sich nur kurz telefonisch beraten. Wäre er bei uns gewesen, hätten wir uns wohl weniger hilflos gefühlt.» Der Vater liess daraufhin die Fenster vergittern, Schlösser an der Türe anbringen. «Es sah aus wie im Gefängnis, aber mein Vater wollte uns schützen.»Hilflos fühlte sich Lulzim Kadriu auch, als ihn einmal die Polizei verhaftete. In den Neunzigern war in Kosovo die D-Mark als Zweit­währung verbreitet. In einer der illegalen Wechsel­stuben, wo er die Schweizer Franken, die der Vater schickte, in D-Mark wechseln wollte, nahm ihn die Polizei mit. Als Kosovo-Albaner mied er aus pol"
