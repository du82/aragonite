title = "Veranstaltungen – Republik"
full_description = "Vor einem guten Jahr ist Beat Jans als Bundesrat gestartet, seither steht er unter Dauer­beschuss. Und zwar von links wie von rechts. Die SP und die Grünen kritisieren ihn, weil er eine harte Abschiebe­politik verfolgt: Jans lässt abgewiesene Asyl­suchende sogar nach Afghanistan und in den Irak ausschaffen, wo ihnen Folter und Todes­strafe drohen. Die SVP wiederum lässt kein gutes Haar am SP-Bundesrat, weil die Dauer­kritik an der Asyl- und Zuwanderungs­politik zum Marken­kern ihres Partei­programms gehört. Inzwischen fordern aber auch grosse Teile von FDP und Mitte-Partei Verschärfungen der Asylpraxis. In diesem Jahr kommt für Jans eine weitere schwierige Aufgabe hinzu: Der 60-jährige Basler ist für die Ausgestaltung der Schutz­klausel verantwortlich, mit der die Schweiz die Zuwanderung aus der EU beschränken will, wenn diese unerwünschte Folgen mit sich bringt. Wie die Klausel konkret aussehen wird, ist offen – Jans soll der Landes­regierung bis Ende Februar Vorschläge unterbreiten. Absehbar ist aber bereits jetzt, dass ihm auch dieses Geschäft Ärger einbringen wird. Was sagt Beat Jans zur Kritik von allen Seiten? Wie blickt er auf die anstehenden Auseinander­setzungen rund um die Bilateralen III? Und was sagt er zur Frage, ob künftig 10, 12 oder gar 16 Millionen Menschen in der Schweiz leben sollen? Am 17. Februar wird Beat Jans auf Einladung der Republik zu diesen (und noch zu viel mehr) Fragen Rede und Antwort stehen. Programm18.30 Uhr Türöffnung19.00 Uhr Podiums­gespräch, inklusive Fragen aus dem Publikumca. 20.30 Uhr Abschluss und offene Bar EinlassDie Veranstaltung ist kosten­pflichtig. Republik-Verlegerinnen bezahlen den reduzierten Preis (CHF 15). In ihrem aktuellen Buch fragen die Historikerin Hedwig Richter und der «Zeit»-Journalist Bernd Ulrich, wie eine Revolution zur Erhaltung unserer Lebens­grundlagen mit der Verteidigung der Demokratie einher­gehen kann. Wie schafft es die Demokratie, die Klima­krise zu bewältigen? Was bedeutet das für Europa? Und wieso sind ökologische Rück­schritte derzeit so erfolgreich?"
year_published = 2025
