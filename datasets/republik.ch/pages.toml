["https://republik.ch/2019/05/17/bauch-first-brain-second"]
title = "Bauch first, Brain second – Republik"
description = "Wir sind dem Elefanten unserer Emotionen hilflos ausgeliefert: So lautet eine beliebte These der Psychologie. Aber stimmt sie?"
full_description = "Bauch first, Brain secondWir sind dem Elefanten unserer Emotionen hilflos ausgeliefert: So lautet eine beliebte These der Moralpsychologie. Aber stimmt sie?Von Daniel Graf (Text) und Kwennie Cheng (Illustration), 17.05.2019FolgenMerkenTeilen67 Beiträge6714 Minuten14'Wer noch nie dem Elefanten von Jonathan Haidt begegnet ist, hat derzeit wieder alle Chancen. Denn das mächtige Bild, das der amerikanische Psychologe in den Nuller­jahren von der menschlichen Moral gezeichnet und 2012 in seinem Bestseller «The Righteous Mind» popularisiert hat, scheint wie für die unmittelbare Gegenwart entworfen. Der Aufstieg des Populismus samt Fake News und alternative facts; die störrische Macht gefühlter Wahrheiten gegenüber Tatsachen; das Auseinander­driften der Gesellschaft; die Empörungs­debatten in den Arenen der Social Media – für all diese Themen, die uns heute umtreiben, scheint Haidts Theorie der «moralischen Fundamente» des Menschen schon vor ein paar Jahren wichtige Erklärungs­ansätze bereitgestellt zu haben. Kein Wunder also, dass sie in aktuellen Sach­büchern wieder besondere Aufmerksamkeit erfährt. Und aus der Demokratie-Debatte ohnehin nie verschwunden war.Was hat es auf sich mit Jonathan Haidt und dem Elefanten?Unsere Vernunft, sagt Haidt, ist nur der kleine, hilflose Reiter auf dem grossen Elefanten unserer Bauch­gefühle. Das gilt, wenn wir moralische Urteile fällen, wenn wir Personen oder ihre Handlungen bewerten. Aber auch, wenn es um unsere politischen Präferenzen geht. Unser Reiter der Vernunft, so Haidt, tut nur so, als gebe er die Richtung vor. Wo es langgeht, bestimme in Wirklichkeit einzig und allein der Elefant. (Ein Befund, der Leserinnen von Sigmund Freud oder David Hume weniger überrascht haben dürfte; Letzterer hatte die «Vernunft» schon 1739 eine «Sklavin der Leidenschaften» genannt.)Ob wir also für Abtreibung sind oder dagegen; Migration als Chance sehen oder als Bedrohung; die Ehe für alle bejahen oder bekämpfen; es uns aufs Land zieht oder in die Stadt – all das, so legt die moral­psychologische Forschung nahe, entscheidet nicht die Vernunft durch langes Abwägen von Argumenten. Sondern der Bauch binnen kürzester Zeit. In der Metaphorik von Haidt: Es regiert der Elefant, der intuitiv alles, was ihm vors Auge tritt, sofort in Gut und Schlecht, in Like und Dislike einteilt. So bestimmten Gefühle wie Angst, Scham oder Ekel unsere Entscheidung, die Vernunft liefere nur die nachträgliche Recht­fertigung, notfalls stur und hartnäckig wider jede bessere Einsicht. Ist also das die deprimierende Formel des Menschseins, die nicht zufällig an Trump erinnert: Bauch first, Brain second? Die menschliche Vernunft – völlig abgemeldet, wenn die Entscheidungen gefällt werden? Nur dazu da, längst getroffene Bauch­entscheidungen im Nachhinein bis aufs Blut zu verteidigen? Sind die überhitzten Debatten, die allenthalben geführt werden, von vornherein aussichtslos, weil die Argumentations­schlacht der Reiter auf die unterschiedlichen Neigungen der Elefanten sowieso kaum Einfluss hat? Oder sind sie gar destruktiv, ein Treiber der Polarisierung, weil sie das Abgrenzungs­bedürfnis nur verstärken? Und wenn uns, andererseits, die Thesen der Moral­psychologen unplausibel oder zumindest unterkomplex erscheinen, unterliegen wir dann auch nur einem wishful thinking, das sich mit der untergeordneten Rolle des Reiters nicht abfinden will?Das sind Fragen, denen sich die aktuelle Sachbuch­produktion mit besonderer Aufmerksamkeit widmet. Und mit durchaus unterschiedlichen Resultaten. Wenn sich der englische Polit­ökonom William Davies der angeblichen Ablösung der Argumente durch die Gefühle widmet, streift er so ziemlich jedes thematische Buzzword der vergangenen Jahre. So erscheint sein Buch auch selbst als Symptom jener «nervösen Zeiten», die ihm den Titel geben. Sebastian Herrmann, renommierter Wissenschafts­journalist und aus der aktuellen Autoren­riege offenbar der grösste Jonathan-Haidt-Fan, ist da fokussierter. Seine Sichtung der wichtigsten moral­psychologischen Forschungs­ergebnisse mit dem Titel «Gefühlte Wahrheit» hat allerdings das Problem, dass ein kurz zuvor erschienenes Buch von Philipp Hübl («Die aufgeregte Gesellschaft») grossenteils dieselben Geschichten erzählt – sie aber gedanklich wie geistes­geschichtlich tiefer durchdringt. Was umso bemerkenswerter ist, als Hübl erst vor einem halben Jahr ein substanzielles Buch veröffentlicht hat (hier unsere Besprechung).Komplementär zu solchen Überblicks­darstellungen haben die Philosophin Martha Nussbaum und der Historiker Frank Biess umfassende Studien zum derzeit meist­diskutierten Gefühl vorgelegt: der Angst. Ihr Interesse gilt nicht Ängsten als individuellen Pathologien, sondern als Faktor im öffentlichen Diskurs: «politische Ängste», wie Biess sie nennt. Nimmt man all diese unterschiedlichen Perspektiven zusammen, lässt sich Haidts berühmte Metapher von Elefant und Reiter präziser fassen. Denn wie jedes Sinnbild ist auch dieses verkürzend, anfällig für Miss­verständnisse und in vielerlei Hinsicht irreführend.Vier Anmerkungen zu Elefant und Reiter und zur vermeintlichen Herrschaft der Emotionen.1. Es gibt keinen Grund zum FatalismusDie zentrale Botschaft der moral­psychologischen Forschung lautet: Pure Vernunft wird Anders­denkende niemals überzeugen. Egal, wie stark man die Wahrheit auf seiner Seite hat: Nüchterne Fakten allein aktivieren bei moralischen und welt­anschaulichen Fragen nur die Abwehr­reflexe – auch die der Vernunft. Die nämlich mutiert dann zur Rabulistik, das heisst, sie zieht, wenns hart auf hart kommt, lieber Gründe an den Haaren herbei, als sich umstimmen zu lassen. Wer die entgegen­gesetzte Meinung für sich gewinnen will, darf deshalb beim Gegenüber nicht nur an den inneren Reiter appellieren; er muss auch dem fremden Elefanten etwas anbieten. Es braucht, wie Haidt sagt, irgendeine Art von common ground, einen gemeinsamen Boden, auf den sich beide Elefanten trauen.Das moral­psychologische Narrativ zielt also im Grunde gerade nicht auf Defätismus und Resignation. Aber man muss die Grössen­verhältnisse zurechtrücken. Das suggestive Bild vom riesigen, übermächtigen Elefanten hat vor allem dann einen Sinn, wenn man darin einen Appell sieht, sich die Schwierigkeiten der Ausgangs­lage klarzumachen. Was es nicht erklären kann: die gesamte Geschichte des moralischen Fortschritts. Denn wären wir unseren Emotionen hilflos ausgeliefert, schreibt Philipp Hübl zu Recht, würden wir «immer noch so denken und handeln wie in der Steinzeit». Heute aber hat beispielsweise die Sklaverei selbst unter hartgesottenen Hillbillys keine Fürsprecher mehr. Und auch wenn beim Frauen­wahl­recht in der Schweiz die Stein­zeit etwas länger angedauert hat: Man muss sich nur einmal die gesellschaftliche Entwicklung der vergangenen Jahr­zehnte vor Augen führen, um zu sehen, dass sich Moral­vorstellungen auch milieu-, parteien- und alters­übergreifend ändern. Wie will man solche Veränderungen erklären, wenn nicht auch mit der Macht des Reiters und seinem Langzeit­einfluss auf den Elefanten?Bauch first, Brain second: Zeitlich aufgefasst, liegt gerade hierin die Chance zum Korrektiv. Gefühle sind ohnehin nicht einfach da – sie werden immer auch gemacht. Das zeigt etwa Frank Biess in seinem Buch «Republik der Angst». Darin erzählt er die Geschichte der Bundes­republik Deutschland als eine Abfolge von Angst­diskursen. Was Biess materialreich und detailliert an einem spezifischen Beispiel durchdekliniert, verweist zugleich eindrucksvoll auf Grundsätzliches: Emotionen entstehen immer in spezifischen historischen und sozialen Kontexten. Und sie werden massiv durch Gefühls­politik beeinflusst. Was Haidts Bild also unterschlägt: Der Elefant ist immer schon auf bestimmte Weise gefüttert worden – und was er in Zukunft abbekommt, liegt auch an uns. Fatalismus als Ausrede gilt nicht.2. Zyniker springen zu kurzDie Diskussion ist allerdings so fixiert auf die dämonische Macht der Emotionen, dass es viel zu wenig um Gegen­strategien geht. Konkrete Lösungs­ansätze erhalten – mit Ausnahmen – auch in den genannten Büchern wenig Raum. Diese Schieflage verstärkt sich, wenn dann noch der Befund einseitig dargestellt wird und reisserisches Marketing hinzukommt. Verlage, die mit dem Slogan werben «Warum Fakten, Experten­meinungen und Statistik nicht mehr zählen», betreiben jedenfalls eher eine Apologie der gefühlten Wahrheit, als dass sie ihr entgegenwirken. So wird ein wissenschaftlicher Befund bis zur Karikatur verkürzt und dann verabsolutiert. Muss man sich derart bereitwillig dem Zynismus der Aufmerksamkeits­ökonomie unterwerfen?Der angebliche Total­triumph der Emotionen deckt sich ohnehin nur schwer mit der Alltags­empirie. Vielleicht muss man, bei allem Problem­bewusstsein, doch einmal betonen, dass vor Gericht und in der Wissenschaft die gefühlte Wahrheit auch heute eher nicht so hoch im Kurs steht. Dass der Grossteil der Gesellschaft noch nicht zu Fundamentalisten und Verschwörungs­theoretikern geworden ist. Aber auch, dass individuelle Gefühle durchaus mit einer überindividuellen Vernunft Hand in Hand gehen können, etwa wenn Menschen mit Abscheu auf antisemitische Hetze oder den jüngsten Nazi-Aufmarsch in Plauen reagieren. Hier zeigt sich in emotionalen Reaktionen ein intakter, mit der Vernunft vollkommen im Einklang befindlicher moralischer Kompass.Und abgesehen davon, dass bei der Debatte um Emotionen meist die positiv konnotierten wie Liebe, Hoffnung und Vertrauen unterbelichtet bleiben: Nicht einmal die Angst ist per se negativ. Auch das kann man bei Frank Biess und Martha Nussbaum nachlesen. «Mehr als andere Gefühle», schreibt Nussbaum, «bedarf die Angst sorgfältiger Prüfung und Eindämmung, wenn sie nicht giftig werden soll.» Aber wo der Aufstieg des Populismus genau auf diese Vergiftung des öffentlichen Diskurses aus ist, gilt es, «demokratische Ängste», wie Biess mit schönem Doppel­sinn schreibt, gegen den «Verlust der liberalen Demokratie und pluralistischen Gesellschaft zu mobilisieren».Emotionen sind grundsätzlich ambivalent. Deshalb ist die Front­stellung von Gefühl und Vernunft ein Zerrbild. Vernunft zielt nicht auf das Abschaffen von Emotionen, sondern auf das Eindämmen ihrer destruktiven Kraft.3. Elefanten sind Herdentiere – Reiter auchHaidts Metapher fasst Elefant und Reiter als Einzel­wesen. Aber wir sind Herden­tiere, im Positiven wie im Negativen. Das verschärft die Problematik – und beinhaltet zugleich eine mögliche Lösung. Die Ergebnisse der Moral­psychologinnen zeigen erstens: Jede und jeder Einzelne von uns läuft Gefahr, die eigene Vernunft so umzupolen, dass sie zu unseren Neigungen passt. Moral ist so eng mit unserem Selbst­bild verknüpft, dass wir zu «identitäts­schützenden Denk­fehlern» (Hübl) neigen, wenn die Wahrheit mit unseren Werten in Konflikt gerät. Zweitens: Am anfälligsten für diesen Effekt sind homogene Gruppen, weil sich hier die Einzelnen wechselseitig in ihren Ansichten bestätigen – und die mitunter aggressive Abschottung nach aussen potenzieren.Damit ist klar, was das wichtigste Mittel gegen Herden­starrsinn sein muss (und immer war): Diversität. Auf der persönlichen Ebene verlangt das, möglichst viel Hetero­genität zuzulassen. Konkret: Gegen­argumente ernsthaft abwägen; nie aufhören, sich mit den Positionen von Anders­denkenden auseinanderzusetzen; immer wieder prüfen, ob die eigene Position noch standhält. Weil das anstrengend und komplex ist, stellt der innere Elefant erst mal auf stur. Aber der Herden­instinkt bedeutet auch: Wir alle sind auf gesellschaftliche Anerkennung aus. Und ob wir gute, anerkennungs­fähige Gründe für unser Handeln haben, ob unsere persönliche angewandte Alltags­moral auch zu einer verallgemeinerbaren Ethik passt, darüber entscheidet weder der Elefant noch der Reiter in uns – sondern die anderen.Hier wird es noch einmal kompliziert. Denn «die anderen», das können ja auch ausschliesslich «die Gleichen» sein, eben jene homogene Gruppe, die sich gegen alle anderen stellt. Auf der gesellschaftlichen Ebene verlangt Diversität also eine pluralistische Öffentlichkeit, die alles daransetzt, abgeschottete Gegen­öffentlichkeiten zu verhindern. Wo solche Gegen­öffentlichkeiten trotzdem entstehen und sich gegen grundlegende Werte der Verfassung richten, ist der Rechts­staat gefordert. Wo sie sich im Rahmen des Legalen bewegen, sollte man die politische Auseinander­setzung nicht scheuen – und sie so führen, dass die eigene Diskussions­kultur für die, die schwanken, die attraktivere Option ist. Allerdings sollten wir den Blick nicht nur auf die Fundamentalisten der Debatte lenken, sondern auch auf die sanfteren, punktuellen Formen, sich gegen Kritik abzudichten. Denn in dieser Gefahr stehen wir alle. Und hier kommt ein letztes Mal Martha Nussbaum ins Spiel.4. «Praktiken der Hoffnung» oder: Der Elefant lässt sich zähmenNussbaums Buch heisst «Das König­reich der Angst», weil Angst die ursprünglichste und mächtigste aller Emotionen sei (mehr zu dem Buch auch hier von Daniel Binswanger). Gefährlich und destruktiv wird sie, wenn sie sich mit anderen Gefühlen wie Zorn, Ekel und Neid verbindet. Mit Blick auf diese «Familie der Angst» gelingt Nussbaum eine eindringliche Beschreibung der Funktions­weise etwa von Rassismus und Misogynie. Die Pointe aber besteht darin, dass ihr Buch in Wirklichkeit eine Philosophie der Hoffnung ist. Hoffnung ist für Nussbaum die positive Schwester der Angst: Beide sind auf eine ungewisse Zukunft gerichtet, auf das mögliche Eintreten eines Ereignisses. Und beide sind in der Hinsicht irrational, dass sie die Wahrscheinlichkeit dieses Eintretens nicht zum Kriterium machen – für die Intensität des Gefühls sind Wahrscheinlichkeiten in der Regel komplett irrelevant.Wie also lässt sich laut Nussbaum mehr Hoffnung erlangen, als Gegenspielerin der Angst? Durch ganz konkretes Handeln. «Hoffnung ist nicht träge, kann es nicht sein. Sie verlangt tätiges Engagement.»Nussbaum beschreibt deshalb sogenannte «Praktiken der Hoffnung», gesellschaftliche Institutionen also, in denen sich Hoffnung lernen und leben lässt. Darunter sind fünf existierende und eine letzte, die Nussbaum als Vorschlag unterbreitet: die Künste (als Schule der Empathie und Praxis gemeinsamen Schaffens);das kritische Denken in Schulen, Universitäten, Diskussionsforen;undogmatische religiöse Gruppen;gewaltfreie Protestbewegungen;Theorien der Gerechtigkeit (um Visionen konkret zu durchdenken);und schliesslich: ein soziales Jahr für alle beziehungsweise eine geschlechter­neutrale Dienst­pflicht, wie sie derzeit auch in der Schweiz diskutiert wird.Über diese Punkte im Einzelnen wird jede und jeder unterschiedlich denken. Aber soziales Engagement gewissermassen als Hoffnungs­maschine – diese Grund­idee hat eine frappierende Evidenz. Weil sich so das Elefanten­gedächtnis mit Erfahrungen von gelebter Solidarität anfüllen lässt. Wem das zu blumig ist: Die Idee der Praktiken ist auch ganz konkret auf die Auseinandersetzungen des Alltags übertragbar. Denn aus dem moral­psychologi"
