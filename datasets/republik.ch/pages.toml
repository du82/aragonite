full_description = "StatutenProject R Genossenschaft, ZürichRevidierte Statuten, angenommen an der Urabstimmung vom 22. November 2020TeilenFirma, Sitz und ZweckArt. 1 – Firma und SitzArt. 2 – ZweckMitgliedschaftArt. 3 – VoraussetzungenArt. 4 – MitgliederbeiträgeArt. 5 – Aufnahme und BeitrittArt. 6 – Mitgliederregister (Genossenschafterverzeichnis)Art. 7 – MitgliedschaftsdauerArt. 8 – Rechte der MitgliederArt. 9 – Erlöschen der MitgliedschaftArt. 10 – AusschlussOrganisationArt. 11 – OrganeGesamtheit der Mitglieder (Urabstimmung)Art. 12 – Oberstes OrganArt. 13 – Ansetzung von UrabstimmungenArt. 14 – AufgabenArt. 15 – Mitgliederinitiativen und PetitionenArt. 16 – BeschlussfassungGenossenschaftsratArt. 17 – Zusammensetzung und AmtsdauerArt. 18 – AufgabenArt. 19 – Konstituierung, Einberufung und BeschlussfassungVorstandArt. 20 – Zusammensetzung, Konstituierung und AmtsdauerArt. 21 – AufgabenArt. 22 – EinberufungArt. 23 – BeschlussfassungRevisionsstelleArt. 24 – Anforderungen und AufgabenGeschäftsjahr und GewinnverwendungArt. 25 – Geschäftsjahr, Buchführung und GewinnverwendungAuflösung und LiquidationArt. 26 – Auflösungsbeschluss und LiquidationSchlussbestimmungenArt. 27 – Mitteilungen und Bekanntmachungen; PartizipationArt. 28 – Mediationsvorbehalt und GerichtsstandPDF herunterladenFirma, Sitz und ZweckArt. 1 – Firma und SitzUnter der Firma Project R Genossenschaft (Project R Cooperative; Project R Société Coopérative; Project R società cooperativa; Project R Societad Cooperativa) besteht mit Sitz in Zürich auf unbestimmte Dauer eine konfessionell und parteipolitisch unabhängige Genossenschaft gemäss Art. 828 ff. OR.Art. 2 – ZweckDie gemeinnützige Genossenschaft bezweckt die Förderung der Demokratie durch Stärkung, Erhalt und Weiterentwicklung des Journalismus als vierte Gewalt. Sie setzt sich ein für die Vermittlung aller relevanter Informationen, die Bürgerinnen und Bürgern eine kritische Wissens- und Meinungsbildung und fundierte Entscheidungen ermöglichen. Sie fördert zur Stärkung des gegenseitigen Verständnisses diskriminierungsfrei und vielfältig die Teilnahme am konstruktiven Diskurs.Sie sucht ihren Zweck insbesondere zu erreichen durch:a) Trägerschaft der Republik AG und ihres unabhängigen digitalen Magazins «Republik»;b) Entwicklung und Lancierung von weiteren neuen journalistischen Formaten;c) Entwicklung von neuen Verbreitungskanälen für journalistische Inhalte, sei dies als Eigenentwicklung (bevorzugt Open Source) oder durch Unterstützen von Drittentwicklungen;d) Vernetzung ihrer Mitglieder;e) Durchführung von Ausbildungs-, Informations- und Debattenveranstaltungen;f) Promotion eines unabhängigen Journalismus in Öffentlichkeit und Politik;g) Unterstützung von Projekten, die dem Genossenschaftszweck entsprechen;h) Förderung von journalistischem Nachwuchs;i) Unterstützung journalistischer Projekte, insbesondere investigativer Recherchen.Die Genossenschaft kann alle Massnahmen ergreifen, die geeignet sind, ihren Zweck direkt oder indirekt umzusetzen. Sie kann insbesondere Zweigniederlassungen und Tochtergesellschaften errichten und sich an anderen Unternehmen beteiligen.MitgliedschaftArt. 3 – Voraussetzungen Die Mitgliedschaft bei der Genossenschaft ist persönlich und nicht übertragbar. Sie steht jeder natürlichen oder juristischen Person offen, die den Zweck der Genossenschaft unterstützt; ein Anspruch zur Aufnahme besteht nicht.Art. 4 – Mitgliederbeiträge Die Urabstimmung legt die Höhe der Mitgliederbeiträge fest.Der Vorstand ist befugt, aufgrund von individuellen wirtschaftlichen Rahmenbedingungen der Mitglieder Ausnahmen bei der Höhe und den Modalitäten der Begleichung der Mitgliederbeiträge einzelner Mitglieder oder von bestimmten Gruppen von Mitgliedern zu machen.Erklärt ein Mitglied während des Jahres seinen Austritt (Art. 7 Abs. 3), besteht keinerlei Anspruch auf Rückzahlung des bereits bezahlten Mitgliederbeitrags.Art. 5 – Aufnahme und BeitrittVoraussetzung für die Aufnahme als Mitglied ist die Abgabe einer Beitrittserklärung auf elektronischem oder schriftlichem Weg an den Vorstand und die gleichzeitige Bezahlung des Mitgliederbeitrags. Unter Vorbehalt von Abs. 2 erfolgt auf diesen Zeitpunkt der Beitritt (Beitrittszeitpunkt).Der Vorstand kann die Aufnahme eines Mitglieds innert sechzig Tagen nach erfolgter Beitrittserklärung ohne Angabe von Gründen rückwirkend auf den Beitrittszeitpunkt für ungültig erklären. Dies erfolgt durch E-Mail (bei elektronisch erklärtem Beitritt) oder durch Brief mit Zustellbestätigung (bei schriftlichem Beitritt). Ein bereits geleisteter Mitgliederbeitrag wird vollumfänglich zurückerstattet.Art. 6 – Mitgliederregister (Genossenschafterverzeichnis)Der Vorstand führt ein Mitgliederregister, das nebst den in Art. 837 OR erwähnten Tatsachen zwingend eine für Zustellungen im Rahmen des Mitgliedschaftsverhältnisses gültige E-Mail-Adresse des Mitglieds enthalten muss. Als Mitglied der Genossenschaft wird nur anerkannt, wer im Mitgliederregister eingetragen ist.Das Mitgliederregister ist nicht öffentlich, und es besteht für die Mitglieder und Dritte, mit Ausnahme des Einsichtsrechts in die eigenen Daten, kein Einsichtsrecht. Der Vorstand trifft alle für den Schutz dieser Daten erforderlichen Vorkehrungen. Die Mitglieder können allerdings jederzeit erklären, dass ihre Mitgliedschaft in einem öffentlich einsehbaren Auszug aus dem Register der Mitglieder auf der Website der Genossenschaft aufgeführt wird. Diese Zustimmung kann jederzeit widerrufen werden.Art. 7 – Mitgliedschaftsdauer Die Mitgliedschaft dauert ein Jahr ab dem Beitrittszeitpunkt (Art. 5 Abs. 1), unter Vorbehalt von Abs. 3 und 4. Sie verlängert sich jeweils um ein weiteres Jahr. Voraussetzung dafür ist die Bezahlung des Mitgliederbeitrags.Soll die Mitgliedschaft nicht fortgesetzt werden, muss das vom betreffenden Mitglied gegenüber der Genossenschaft spätestens zwei Arbeitstage vor Verlängerung ausdrücklich erklärt werden (per E-Mail, schriftlich oder über das Mitgliedschaftsportal).Ein Mitglied kann jederzeit elektronisch (per E-Mail oder über das Mitgliedschaftsportal) den Austritt erklären. Die Mitgliedschaft ist bis zum Ende der Mitgliedschaftsdauer gültig, sofern das Mitglied nicht explizit einen sofortigen Austritt wünscht.Der Vorstand kann Mitglieder aus dem Mitgliederregister streichen, wenn die Korrespondenz der Genossenschaft an deren im Mitgliederregister verzeichnete E-Mail-Adresse mehrmals nicht zugestellt und deren Adresse mit vernünftigem Aufwand nicht ermittelt werden kann. Die Streichung fällt ohne weiteres dahin, wenn die neue E-Mail-Adresse des Mitglieds bekannt wird.Art. 8 – Rechte der MitgliederDie Mitglieder erwerben mit der Mitgliedschaft die ihnen als Genossenschafter und Genossenschafterinnen nach Gesetz (Art. 855 ff. OR) und Statuten zustehenden Rechte.Art. 9 – Erlöschen der Mitgliedschaft Die Mitgliedschaft erlischt:a) durch Nichterneuerung der Mitgliedschaft (Art. 7 Abs. 2);b) durch Austritt des Mitglieds (Art. 7 Abs. 3);c) durch Streichung aus dem Mitgliederregister (Art. 7 Abs. 4);d) durch Widerruf der Mitgliedschaft durch den Vorstand bei Neueintritt (Art. 5 Abs. 2);e) durch Ausschluss (Art. 10);f) durch Auflösung oder Umwandlung der Genossenschaft;g) durch Liquidation oder Konkurs (anwendbar bei Mitgliedern, die juristische Personen sind); oderh) durch Tod (anwendbar bei Mitgliedern, die natürliche Personen sind).Ausser in Fällen von Abs. 1 Bst. d. besteht keinerlei Anspruch auf Rückzahlung des Mitgliederbeitrags.Art. 10 – AusschlussDer Vorstand kann ein Mitglied mit sofortiger Wirkung aus der Genossenschaft ausschliessen, wenn vom betreffenden Mitglied oder von dessen Organen gegen die Genossenschaftsinteressen oder die Statuten verstossen wird. Dasselbe gilt beim Wegfall der Mitgliedschaftsvoraussetzungen (Art. 3) oder beim Nichterbringen der Beitragsverpflichtungen (Art. 4). Der Mitteilung über den Ausschluss ist der Hinweis auf das Recht zum Rekurs beizufügen. Der Vorstand wahrt das rechtliche Gehör.Gegen den Ausschluss kann das betroffene Mitglied innert dreissig Kalendertagen an die nächste Sitzung des Genossenschaftsrats rekurrieren. Der Genossenschaftsrat entscheidet endgültig.Ein Rekurs ist schriftlich mit Begründung dem Vorstand zuhanden des Genossenschaftsrats einzureichen. Er hat aufschiebende Wirkung.OrganisationArt. 11 – Organe Die Organe der Genossenschaft sind: a. die Gesamtheit der Mitglieder (Urabstimmung); b. der Genossenschaftsrat; c. der Vorstand (Verwaltung); und d. die Revisionsstelle.Gesamtheit der Mitglieder (Urabstimmung)Art. 12 – Oberstes OrganDie Gesamtheit der Mitglieder ist das oberste Organ der Genossenschaft. Sie übt durch schriftliche Stimmabgabe (Urabstimmung) sämtliche Kompetenzen der Generalversammlung im Sinne von Art. 880 OR aus, sofern und soweit nicht Gesetz oder Statuten eine Aufgabe einem anderen Organ zuordnen.Die elektronische Stimmabgabe gemäss Art. 27 Abs. 2 ist der schriftlichen gleichgestellt.Das Recht zur Stimmabgabe besitzen alle Mitglieder, die am Tag der Einladung (Art. 13) im Mitgliederregister eingetragen sind.Jedes Mitglied hat eine Stimme.Art. 13 – Ansetzung von UrabstimmungenUrabstimmungen finden einmal im Jahr sowie bei Bedarf statt.Urabstimmungen können durch den Vorstand, den Genossenschaftsrat, die Revisionsstelle oder die Liquidatoren und Liquidatorinnen angesetzt werden.Die Einladung zur Stimmabgabe erfolgt gemäss Art. 27 Abs. 1 bzw. 2 unter Angabe der Frist, der Abstimmungstraktanden und der gestellten Anträge mindestens zehn Tage vor dem Datum des Beginns der Urabstimmung.Der Vorstand ist für die ordnungsgemässe Durchführung der Urabstimmung verantwortlich.Art. 14 – AufgabenDer Gesamtheit aller Mitglieder stehen mittels der Urabstimmung folgende unübertragbaren Aufgaben zu:a) Auflösung der Genossenschaft;b) Beschluss über Fusionen und Abspaltungen;c) Festsetzung und Änderung der Statuten;d) Wahl und Abberufung der Mitglieder des Genossenschaftsrats und dessen Präsidentin oder Präsidenten;e) Wahl und Abberufung der Mitglieder des Vorstands;f) Wahl und Abberufung der Revisionsstelle;g) Festlegung des jährlichen Mitgliederbeitrags;h) Abnahme von Lagebericht und Jahresrechnung unter Kenntnisnahme des Revisionsberichts;i) Entlastung des Vorstands;j) Beschlussfassung über Mitgliederinitiativen (Art. 15);k) Beschlussfassung über alle Gegenstände, die durch das Gesetz oder die Statuten der Gesamtheit aller Mitglieder vorbehalten sind.Überdies fasst die Gesamtheit aller Mitglieder mittels Urabstimmung Beschluss über alle sonstigen Gegenstände, die der Vorstand, der Genossenschaftsrat, die Revisionsstelle oder die Liquidatoren und Liquidatorinnen ihr unterbreiten.Der Gesamtheit der Mitglieder können auch konsultative Fragen unterbereitet werden (konsultative Urabstimmung).Art. 15 – Mitgliederinitiativen und PetitionenZwei Prozent der Mitglieder können die Einberufung einer Urabstimmung zu einem in deren Kompetenz fallenden Gegenstand oder eine konsultative Fragestellung («Mitgliederinitiative») verlangen.Ein Prozent der Mitglieder können gemeinsam dem Vorstand ein Anliegen vortragen mit dem Ersuchen, dieses zu prüfen und darüber allen Mitgliedern Bericht zu erstatten («Petition»). Sofern Petitionen die Aufgaben des Genossenschaftsrats betreffen, hört der Vorstand dazu den Genossenschaftsrat an. Petitionen sind durch den Vorstand innerhalb von drei Monaten zu behandeln.Ist eine Mitgliederinitiative gültig zustande gekommen, hat der Vorstand innert sechs Monaten darüber eine Urabstimmung durchzuführen. Vorstand und Genossenschaftsrat können dazu Stellung nehmen und/oder einen eigenen Gegenvorschlag formulieren. Kommen beide zur Abstimmung und erreichen diese das notwendige Mehr, gilt diejenige Vorlage, die die meisten Ja-Stimmen erhält.Art. 16 – BeschlussfassungBei der Urabstimmung ist das Wahrnehmen von Stimmrechten für andere Mitglieder ausgeschlossen.Eine Urabstimmung ist unabhängig von der Anzahl der abgegebenen Mitgliederstimmen gültig.Beschlüsse werden durch die absolute Stimmenmehrheit der stimmenden Mitglieder gefasst; leere Stimmabgaben werden nicht mitgezählt.Beschlüsse über eine Änderung der Statuten sind mit zwei Dritteln der abgegebenen Stimmen zu fassen.Bei Wahlen kann jedes Mitglied für so viele Kandidaten und Kandidatinnen stimmen, als Mandate zu vergeben sind; Kumulation ist nicht zulässig.Bei Wahlen gilt das relative Mehr.Der Vorstand dokumentiert die Durchführung einer Urabstimmung so, dass eine Überprüfung des Einhaltens der gesetzlichen und statutarischen Bestimmungen bei deren Durchführung durch die Revisionsstelle möglich ist.GenossenschaftsratArt. 17 – Zusammensetzung und AmtsdauerDer Genossenschaftsrat setzt sich aus dreissig Abgeordneten aus dem Kreis der Mitglieder zusammen, die mittels Urabstimmung gewählt werden.Der Vorstand ist für eine faire und transparente Durchführung der Wahlen verantwortlich.Bei der Zusammensetzung des Genossenschaftsrats sind die Geschlechter, Altersgruppen und Regionen zu berücksichtigen. Der Vorstand kann eine dementsprechende Wahlempfehlung abgeben.Abgeordnete dürfen nicht zugleich Mitglied des Vorstands sein.Die Amtsdauer der Abgeordneten beträgt drei Jahre. Scheiden im Laufe der ersten beiden Amtsjahre Abgeordnete aus, so rücken diejenigen Personen nach, die bei den Wahlen die nächstbesten Wahlresultate erreicht hatten und das Amt annehmen.Ein Abgeordneter oder eine Abgeordnete scheidet aus dem Genossenschaftsrat aus, wenn er oder sie die Mitgliedschaft in der Genossenschaft verliert.Abgeordnete sind für maximal drei aufeinanderfolgende Amtsdauern wählbar.Der Vorstand kann der Präsidentin bzw. dem Präsidenten des Genossenschaftsrats für ihre/seine Tätigkeit eine angemessene Aufwandentschädigung ausrichten. Die übrigen Abgeordneten erhalten ausschliesslich Sitzungsgelder und eine Spesenentschädigung, die ebenfalls vom Vorstand festgelegt werden.Art. 18 – AufgabenDer Genossenschaftsrat übt eine Aufsichts- und Beratungsfunktion gegenüber dem Vorstand aus.Er berät alle Geschäfte vor, die der Urabstimmung unterliegen, und gibt Stellungnahmen dazu ab.Er kann der Gesamtheit aller Mitglieder zuhanden einer Urabstimmung Anträge unterbreiten, insbesondere bezüglich:a) Wahlvorschlägen für den Vorstand, die Revisionsstelle sowie das Präsidium des Genossenschaftsrats oder deren Abberufung. Zur Sicherung der notwenigen Fachkompetenz des Vorstands kann er eine Findungskommission einsetzen;b) Fusionen und Abspaltungen;c) Statutenänderungen.Anträge und Stellungnahmen zu Geschäften, die der Urabstimmung (Abs. 2 und 3) unterliegen, sind mit dem Vorstand abzusprechen und ein Konsens muss angestrebt werden. Können sich Genossenschaftsrat und Vorstand bei Traktanden oder Wahlvorschlägen nicht einigen, ist die Abstimmung gemäss den Weisungen des Vorstands anzusetzen. Bei der Einladung zur Stimmabgabe (Art. 13 Abs. 3) ist auf die Differenz in der Auffassung zwischen Genossenschaftsrat und Vorstand ausdrücklich hinzuweisen, und jedem dieser Organe ist angemessen Gelegenheit zur schriftlichen Stellungnahme zu geben.Der G"
