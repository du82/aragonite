["https://republik.ch/2025/02/06/demokratie-unter-druck-24-heikle-fragen-zur-demokratie"]
title = "24 (heikle) Fragen zur Demokratie – Republik"
description = "Ein Fragebogen über grössere und kleinere Grundsatz­fragen der Schweizer Demokratie."
full_description = "24 (heikle) Fragen zur DemokratieBrauchen Ausländerinnen ein Stimm- und Wahlrecht? Sollen wir den Bundesrat direkt wählen? Und was wäre Ihr Werbe­slogan für ein Produkt namens Demokratie? Ein Fragebogen über Grundsatz­fragen der Schweizer Demokratie. Serie «Demokratie unter Druck», Folge 2.Von Vivienne Kuster und Gregory Gilbert-Lodge (Illustration), 06.02.2025FolgenMerkenTeilen9 Beiträge9Die Demokratie ist weltweit unter Beschuss. Doch wie steht es um unsere eigene Demokratie? Mit unserem Fragebogen wollen wir zum Nach­denken anregen über das politische System, das unsere Freiheit garantiert. Füllen Sie den Fragebogen aus und erfahren Sie am Ende, wie andere geantwortet haben.Zur Serie «Demokratie unter Druck»Ohne Journalismus keine Demokratie. Und ohne Demokratie keine Freiheit. So beginnt das Manifest der Republik. Und deswegen ist die Republik 2018 angetreten: um ihren Beitrag zu leisten zu einer Demokratie, die diesen Namen verdient. Um überall dort besonders genau hinzuschauen, wo sie unter Druck kommt.Das war nie nötiger als jetzt, wo demokratische Normen weltweit bröckeln – nicht nur in Ländern wie Ungarn oder der Türkei, sondern auch in den USA oder in Israel. Wir machen deshalb eine grosse Bestands­aufnahme und widmen uns in den kommenden Wochen mit einer Serie den drängenden Fragen, die sich zurzeit stellen: Wie bedroht ist die Demokratie wirklich? Was sind die grössten Gefahren? Wie steht es um die Medien? Wie sieht es eigentlich aus in der Schweiz? Und natürlich wollen wir nach vorn blicken: Wie können wir weiterhin zuversichtlich und hoffnungsvoll bleiben? Wie steht es um die Zukunft der Demokratie?Lesen Sie den ersten Teil «Der Aufstieg der Autokraten im demokratischen Mäntelchen».Sie brauchen etwas Inspiration, bevor Sie selbst loslegen? Hier finden Sie die Antworten anderer Menschen."
