blik/article-komplizenseite/images/62ec0a384a2a6c25cb4a69d6e597bb5f7929bd45.jpeg?size=2000x1050&amp;format=auto&amp;resize=665x 665w,https://cdn.repub.ch/s3/republik-assets/repos/republik/article-komplizenseite/images/62ec0a384a2a6c25cb4a69d6e597bb5f7929bd45.jpeg?size=2000x1050&amp;format=auto&amp;resize=1330x 1330w" data-css-fisw11=""/></span></div><figcaption data-css-1qi1ipm="" data-css-181td0w="">Blattkritik-Veranstaltung mit der Redaktion.</figcaption></figure><figure data-css-11z8okf=""><div data-css-13azwyo="" style="cursor:zoom-in"><span data-css-fisw11="" style="max-width:2209px"><img loading="eager" data-css-1k1sbns="" style="aspect-ratio:1.502721088435374" src="https://cdn.repub.ch/s3/republik-assets/repos/republik/article-komplizenseite/images/79820998cb3a22c14c56c56ea5c562a76d655690.jpeg?size=2209x1470&amp;format=auto&amp;resize=665x" srcSet="https://cdn.repub.ch/s3/republik-assets/repos/republik/article-komplizenseite/images/79820998cb3a22c14c56c56ea5c562a76d655690.jpeg?size=2209x1470&amp;format=auto&amp;resize=333x 333w,https://cdn.repub.ch/s3/republik-assets/repos/republik/article-komplizenseite/images/79820998cb3a22c14c56c56ea5c562a76d655690.jpeg?size=2209x1470&amp;format=auto&amp;resize=665x 665w,https://cdn.repub.ch/s3/republik-assets/repos/republik/article-komplizenseite/images/79820998cb3a22c14c56c56ea5c562a76d655690.jpeg?size=2209x1470&amp;format=auto&amp;resize=1330x 1330w" data-css-fisw11=""/></span></div><figcaption data-css-1qi1ipm="" data-css-181td0w="">Komplizen zeigen Flagge.</figcaption></figure><figure data-css-11z8okf=""><div data-css-13azwyo="" style="cursor:zoom-in"><span data-css-fisw11="" style="max-width:4032px"><img loading="eager" data-css-1k1sbns="" style="aspect-ratio:1.3333333333333333" src="https://cdn.repub.ch/s3/republik-assets/repos/republik/article-komplizenseite/images/e58d82c8f25177a2232bd6bfdde90776f437ea0e.jpeg?size=4032x3024&amp;format=auto&amp;resize=665x" srcSet="https://cdn.repub.ch/s3/republik-assets/repos/republik/article-komplizenseite/images/e58d82c8f25177a2232bd6bfdde90776f437ea0e.jpeg?size=4032x3024&amp;format=auto&amp;resize=333x 333w,https://cdn.repub.ch/s3/republik-assets/repos/republik/article-komplizenseite/images/e58d82c8f25177a2232bd6bfdde90776f437ea0e.jpeg?size=4032x3024&amp;format=auto&amp;resize=665x 665w,https://cdn.repub.ch/s3/republik-assets/repos/republik/article-komplizenseite/images/e58d82c8f25177a2232bd6bfdde90776f437ea0e.jpeg?size=4032x3024&amp;format=auto&amp;resize=1330x 1330w" data-css-fisw11=""/></span></div><figcaption data-css-1qi1ipm="" data-css-181td0w="">Komplizen-Umtrunk.</figcaption></figure>'''
