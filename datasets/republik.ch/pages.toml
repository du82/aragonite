["https://republik.ch/2023/09/09/die-schweiz-hat-nicht-zu-viele-auslaender-sondern-zu-wenige"]
title = "Die Schweiz hat nicht zu viele Ausländer. Sondern zu wenige – Republik"
description = "Die SVP dominiert mit ihrer Zuwanderungskritik seit Jahren die politische und mediale Debatte der Schweiz. Eine Richtigstellung."
full_description = "Arbeiten in der Schweiz, zur Wahl gehts zurück in die Heimat: Italienerinnen warten im Mai 1958 am Hauptbahnhof Zürich auf einen Extrazug. Keystone/Photopress Archive/VogtDie Schweiz hat nicht zu viele Ausländer. Sondern zu wenigeDie SVP dominiert mit ihrer Zuwanderungs­kritik seit Jahren die politische und mediale Debatte der Schweiz. Doch die Partei gibt falsche Antworten – auf die falschen Fragen.Von Lukas Häuptli, 09.09.2023FolgenMerkenTeilen200 Beiträge20014 Minuten14'Vorgelesen von Dominique Barth0:00 / 21:58Zu viele Ausländer. Und die falschen.Denn Ausländer, selbst die richtigen, schaffen Probleme. Kriminalität? Ist Ausländer­kriminalität. Steigende Sozial­ausgaben? Sind Ausgaben für Asyl- und Schutz­suchende. Wohnungsnot? Zersiedlung der Landschaft? Stau auf den Strassen? Sind Folgen der Zuwanderung.Sagt die SVP.Seit Monaten schallt ihr Mantra durch das Land, und weil es so einfach, laut und unnachgiebig tönt, wird sein Echo­raum immer grösser: bei den rechten Parteien, in den Medien, bei der ganzen Bevölkerung.Das ist das Resultat einer unnachgiebigen SVP-Propaganda. Seit dreissig Jahren zählt latente Fremden­feindlichkeit zum Kern der selbst ernannten Schweizer Volks­partei. Auch zum Kern ihrer Sach­politik.Zum Beispiel:Als SVP-Nationalrat Christoph Blocher Anfang der 1990er-Jahre gegen den EWR-Beitritt der Schweiz kämpfte, kämpfte er in erster Linie gegen das europäische Ausland.Als die Partei in den 2000er-Jahren ihre Kampagne gegen «Schein­invalide» lostrat, ergänzte sie ihren politischen Kampf­begriff rasch mit «ausländischen»: «Ausländische Scheininvalide» seien das wahre Problem.Weiter gings: 2010 gewann die SVP die Abstimmung über ihre Ausschaffungs­initiative (gegen kriminelle Ausländer), 2014 die Abstimmung über ihre Masseneinwanderungs­initiative (gegen den ausländer­gemachten Dichtestress). 2015 gewann sie die nationalen Wahlen (mit einer Kampagne gegen den Asyl­missbrauch).Und jetzt, im Wahlkampf 2023?Zu viele Ausländer.Jetzt konzentriert die SVP ihren Kampf auf die Zuwanderer, die die Schweiz angeblich zur «Zehn-Millionen-Schweiz» machen. Dafür hat die Partei im letzten Juli ihre Nachhaltigkeits­initiative lanciert und im August ein 45-seitiges Positions­papier zur Migrations­politik publiziert.So viel Text wäre nicht nötig gewesen. Die Botschaft war von Anfang an klar: Ob «explodierende Land­preise und Mieten», «verstopfte Strassen und überfüllte Züge» oder «sinkendes Niveau in den Schulen», ob «ein überfordertes Gesundheits­wesen», «soziale Spannungen» oder «Ghettoisierung». An allem ist die «verfehlte Migrations­politik» der Schweiz schuld.Der grösser werdende Echo­raum in Politik und Medien trägt dieses Mantra immer weiter.Heute fordert auch die FDP eine «harte, aber faire» Einwanderungs­politik. Der Staat müsse den Missbräuchen und negativen Auswirkungen entschieden begegnen.Die Mitte steht ihr in nichts nach: Mehrere Vertreter der Partei haben sich im Ständerat für einen FDP-Vorstoss ausgesprochen, gemäss dem die Schweiz abgewiesene Asyl­suchende aus Eritrea in einen Dritt­staat abschieben muss. Völkerrechtlich ist das hoch­problematisch; im Juni erst entschied ein britisches Gericht, dass solche Abschiebungen rechtswidrig seien.Aber auch immer mehr Medien verbreiten das SVP-Mantra willfährig.Die NZZ schrieb bereits im letzten September: «In keinem anderen europäischen Land ausser Luxemburg ist die Zuwanderung so gross wie hier. Doch die Politik schweigt.» Und fragte rhetorisch: «Wie lange noch?» Drei Monate später durfte SVP-Fraktions­chef Thomas Aeschi ebenfalls in der NZZ seine Antwort darauf geben. Er kündigte die SVP-Initiative gegen die Zuwanderung an (die heute Nachhaltigkeits­initiative heisst).Anfang 2023 dann und pünktlich zum Auftakt des Wahl­jahres veröffentlichte die «SonntagsZeitung» einen grossen Report zur Zuwanderung und zur Neun-Millionen-Schweiz. Der erste Satz: «Die Bevölkerungs­zahl steigt weiterhin rasant.»Wiederum die NZZ bot Ende August dem 82-jährigen Alt-Bundesrat Christoph Blocher Gelegenheit, das Mantra seiner SVP gleich selbst zu verbreiten. Er durfte einen «Gast­kommentar» schreiben, dessen Kernsatz lautete: «Wo immer es ungelöste Probleme gibt: Die Ursachen stehen in engstem Zusammenhang mit der ungebremsten Zuwanderung in unser kleines Land.»So erstaunt es nicht, dass der Kern der SVP-Politik auch in weiten Teilen der Bevölkerung angekommen ist. Im Wahl­barometer der SRG vom letzten Mittwoch gaben mehr als 30 Prozent der Befragten an, dass sie die «Zuwanderung» zu den «wichtigsten politischen Heraus­forderungen» der Schweiz zählten.Wie verteilt man rare Güter?Nun gilt es, drei Dinge klarzustellen:Erstens: Die Zuwanderung in die Schweiz ist kleiner als von der SVP behauptet.Zweitens: Die Zuwanderung in die Schweiz führt zu Problemen. Nur sind das nicht Zuwanderungs­probleme, sondern, wie in jeder wachsenden Gesellschaft, Verteil­probleme.Drittens: Wegen der demografischen Entwicklung braucht die Schweiz nicht weniger Zuwanderung, sondern bald mehr.Zuerst zu den Zahlen: Die SVP erklärt seit Monaten, 2022 seien 180’000 Personen in die Schweiz gezogen. Das ist zumindest irreführend, weil die Partei auch 25’000 Asyl­suchende und 75’000 Schutz­suchende aus der Ukraine zu den Zuzügern zählt, die hier lediglich ein vorüber­gehendes Bleibe­recht erhalten.Gemäss etablierter Statistik lag die Zuwanderung im letzten Jahr aber bei knapp 80’000 Personen. Damit lag die Zuwanderung 2022 zwar über dem Schnitt der letzten zwanzig Jahre, seit das Personenfreizügigkeits­abkommen mit der EU in Kraft ist. Der Durchschnitts­wert in diesem Zeitraum beträgt rund 66’000 Zuwanderer im Jahr. In mehreren vergangenen Jahren war der Wert aber deutlich höher als der Durchschnitt.Die Zuwanderung der letzten zwanzig JahreZunahme der ständigen ausländischen Wohnbevölkerung der Schweiz durch Migration pro Jahr, von 2002 bis 2022. 200220072012201720220125’000 2008103’363201389’541Durchschnitt66’000Durchschnitt ist der Wert der letzten zwanzig Jahre. Quelle: Bundesamt für Statistik.Wie kommen die Zahlen zustande?Der Wanderungssaldo der Schweiz ist die Differenz zwischen der Zuwanderung in die und der Auswanderung aus der ständigen ausländischen Wohn­bevölkerung. Dazu zählen alle Ausländer mit einer Aufenthalts­bewilligung von mindestens einem Jahr, einem sogenannten B-Ausweis. Einen solchen erhalten beispielsweise alle Arbeit­nehmerinnen und ihre Angehörigen aus der EU, aber auch alle anerkannten Flüchtlinge.Nicht zur ständigen ausländischen Wohn­bevölkerung gehören dagegen alle Asyl- und Schutz­suchenden, etwa aus Syrien, Afghanistan, Eritrea oder der Ukraine, sowie alle vorläufig in der Schweiz aufgenommenen Menschen. Das deshalb, weil sie hier nur ein vorläufiges Bleiberecht erhalten. Personen mit Schutzstatus S aus der Ukraine werden in der Schweiz nach einem Aufenthalt von einem Jahr zur ständigen ausländischen Wohn­bevölkerung gezählt.Zum zweiten Punkt, zu den Problemen, die die Zuwanderung mit sich bringt. In deren Zentrum stehen Verteil­fragen, zum Beispiel:Wie müssen in einer wachsenden Bevölkerung rare Güter verteilt werden?Der Raum fürs Wohnen? Der Raum für den Verkehr? Der Raum in der Natur?Wen soll der Staat finanziell unterstützen? Wie sehr werden ungleiche Einkommen und Vermögen ausgeglichen? Wer muss welchen Beitrag an den Klima­schutz leisten?Es soll an dieser Stelle bei den Fragen bleiben; die Antworten darauf würden den Rahmen dieses Artikels sprengen. Unbestritten aber ist: Die Schweiz muss diese Probleme – klassische Verteil­probleme – früher oder später lösen.Und damit zum dritten Punkt: Die Schweiz hat nicht zu viele Zuwanderer. Sondern bald zu wenige.Der Grund dafür ist einfach: Die Schweizer Bevölkerung wird älter und älter. Und der Teil davon, der Erwerbs­arbeit leistet, wird kleiner und kleiner.Ein Kipp­punkt dieser Entwicklung war das Jahr 2020. Damals lag die Zahl der 65-Jährigen erstmals in der Geschichte des Landes höher als diejenige der 20-Jährigen. Mit anderen Worten: Erstmals schieden mehr Menschen aus der Erwerbs­arbeit aus, als dass Menschen in die Erwerbs­arbeit einstiegen. (20 gilt in der Statistik als Durchschnitts­alter für den Einstieg in die Erwerbs­arbeit.)Wie die Schweiz altertDie voraussichtliche Zahl der 65-Jährigen und der 20-Jährigen im Vergleich.Achse gekürzt2020203020402050 65 Jahre 20 Jahre80’000110’000140’000 PersonenQuelle: Referenz­szenario des Bundesamts für Statistik.Die demografische Entwicklung der Schweiz wird dieses Ungleich­gewicht weiter vergrössern. Bis 2030 und ab 2040 wächst die Zahl der neuen Rentnerinnen nämlich voraussichtlich deutlich stärker als die Zahl der neuen Erwerbstätigen. Diese Überalterung stellt Staat, Wirtschaft und Gesellschaft vor tiefgreifende Probleme. Das wichtigste: Es gibt zu wenig Menschen, die arbeiten.Zur Schliessung dieser demografischen Lücke ist die Schweiz in den nächsten Jahren und Jahrzehnten auf erwerbs­tätige Zuwanderer angewiesen. Dabei handelt es sich nicht mehr nur um hoch und mittel qualifizierte Fachkräfte, sondern um Arbeits­kräfte überhaupt.Was das Problem zusätzlich verschärft: Zahlreiche andere Länder in Europa, Amerika und Asien kämpfen gegen das gleiche Problem: Sie überaltern – und deshalb gehen die Arbeits­kräfte aus. Eindrücklich zeigt das eine breit angelegte Studie des deutschen Instituts für Bevölkerungs­forschung.In der Propaganda der SVP und in derjenigen anderer europäischer Rechtsaussen­parteien ist vom demografischen Problem aber nie die Rede. Sondern nur von einem anderen:Zu viele Ausländer.«Da läuft etwas grundsätzlich falsch»«Das ist das grosse Paradox Europas», sagt Franck Düvell im Gespräch mit der Republik. «Die Regierungen verhindern Zuwanderung unter dem Druck der Rechtsaussen­parteien. Und die gleichen Regierungen fördern Zuwanderung wegen der demografischen Lücken auf dem Arbeits­markt.»Düvell ist Wissenschaftler am Institut für Migrations­forschung und interkulturelle Studien der deutschen Universität Osnabrück und einer der wenigen, die sich beruflich mit Themen an der Schnitt­stelle zwischen sogenannter Flucht­migration und Arbeits­migration beschäftigen.«Die beiden Phänomene werden viel zu oft getrennt betrachtet», sagt er, «von der Wissenschaft, mehr noch aber von den staatlichen Institutionen.» Es sei kein Zufall, dass in den meisten europäischen Staaten die Innen-, Justiz- oder Sicherheits­ministerien für Migration zuständig seien, die Wirtschafts­ministerien dagegen für Arbeitsmarkt­fragen. «Das verschärft das Paradox zusätzlich. Nötig wäre ein ganzheitlicher Blick auf Migration.»Düvell weist auch darauf hin, dass die Behörden an den europäischen Aussen­grenzen allein im letzten Jahr rund 330’000 sogenannt illegale Grenz­übertritte registrierten. Viele der Registrierten wurden mit Pushbacks umgehend in ihr Herkunfts­land oder aufs offene Meer zurück­geschickt. Das geschah auch mit dem Ziel, andere Flüchtende abzuschrecken. Und hatte zur Folge, dass im Mittel­meer allein in den letzten acht Monaten mehr als 2300 Menschen starben.Gleichzeitig, so Düvell, fehlten in Europa zurzeit rund 5 Millionen Arbeits­kräfte. «Da läuft etwas grundsätzlich falsch.»In der Schweiz ist das nicht anders.Allerdings wagt kaum jemand, auf die Überalterung des Landes und auf das Ausmass des künftigen Arbeitskräfte­mangels hinzuweisen. Zu gross ist die Angst, dass dies Wasser auf die Mühlen der SVP sein könnte.Der Bund hat das Problem, dass die Schweiz auf zusätzliche Ausländerinnen angewiesen ist, in seinem alljährlich erscheinenden Observatoriums­bericht zur Personen­freizügigkeit versteckt. Für diesen ist das Staats­sekretariat für Wirtschaft verantwortlich, dem SVP-Wirtschafts­minister Guy Parmelin vorsteht.Im letzten Bericht vom Juli 2023 schreibt das Staats­sekretariat: «Gemäss den Szenarien zur demografischen Entwicklung des Bundesamts für Statistik wird ein weiteres Wachstum der Bevölkerung im Erwerbs­alter in Zukunft noch stärker als bisher von der Zuwanderung abhängen.» Und: «Durch die bevor­stehenden Abgänge der geburten­starken Jahrgänge aus dem Erwerbs­prozess wird sich die demografische Lücke am Schweizer Arbeits­markt weiter öffnen.»Ein bisschen expliziter wird der Schweizer Wirtschafts­dachverband Economie­suisse. In einem im Juni veröffentlichten Bericht hält er fest: «Die demografische Entwicklung bedroht den Schweizer Wohl­stand. Weil die Erwerbs­bevölkerung nur leicht zunimmt, wird sich der Arbeitskräfte­mangel in den nächsten Jahren verschärfen. (...) Zudem werden Spitäler und Pflegeheime durch die grössere Zahl von Alten stärker belastet, was den Arbeitskräfte­mangel zusätzlich verschärft.»Was heisst das in Zahlen?Das Bundesamt für Statistik arbeitet mit verschiedenen demografischen Zukunfts­szenarien. Das wahrscheinlichste, das Referenz­szenario, sieht so aus: Die Bevölkerungs­zahl der Schweiz wächst von heute rund 8,8 Millionen auf 9,4 Millionen Menschen im Jahr 2030 und auf 10,0 Millionen im Jahr 2040.Wegen der Überalterung steigt das Angebot an Arbeits­kräften in diesem Zeitraum aber nicht im gleichen Mass wie der Bedarf.«Gemäss unseren Berechnungen werden in der Schweiz bis 2030 rund 250’000 Arbeits­kräfte fehlen», sagt Alessandro Bee, Ökonom bei der UBS. «Wir gehen davon aus, dass die Nachfrage bis dann um rund 440’000 Arbeitskräfte steigt, das Angebot aber nur um 190’000.»Die UBS hat das Referenz­szenario des Bundes verfeinert und auf den Arbeitsmarkt umgerechnet. Gemäss ihren Berechnungen fehlen in der Schweiz bis 2040 sogar mehr als 500’000 Arbeitskräfte.Allerdings, so Bee, könnte diese Zahl durch die Erhöhung des Frauen­rentenalters wieder um 20’000 bis 50’000 Arbeitskräfte sinken.Was zu tun wäreTrotzdem: 450’000 fehlende Arbeits­kräfte bis in knapp zwanzig Jahren. Wo sollen die herkommen?Aus der Schweiz?Eher nicht. Eine Erhöhung des allgemeinen Renten­alters (was zu einem grösseren Arbeitskräfte­markt führen würde) dürfte am politischen Widerstand scheitern, eine Erhöhung der allgemeinen Erwerbs­quote daran, dass diese bereits jetzt verhältnismässig hoch ist.Was helfen könnte?Die Erwerbsquote der Frauen liesse sich durch Massnahmen für die bessere Vereinbarkeit von Beruf und Familie weiter erhöhen, etwa durch attraktivere Kita-Angebote.Auch die Arbeits­integration von anerkannten Flüchtlingen, vorläufig aufgenommenen Asyl­suchenden und Schutz­suchenden müsste man vorantreiben. Dafür bräuchte es zusätzliche Integrations­programme von Bund und Kantonen, aber auch Anpassungen im Asyl- und Ausländer­recht. Zum Beispiel: Heute sieht das Ausländer- und Integrations­gesetz vor, dass vorläufig Aufgenommene nach fünf Jahren eine Aufenthalts­bewilligung erhalten können. Eine bezahlte Arbeit ist Voraussetzung dafür. Angesichts des absehbaren Arbeitskräfte­mangels sollte der Bund diese Sperr­frist von fünf Jahren verkürzen oder gleich ganz aufheben. Das würde heissen, dass alle vorläufig Aufgenommenen eine Aufenthalts­bewilligung erhalten, sobald sie arbeiten.Werden die fehlenden Arbeits­kräfte in den nächsten Jahren aus der EU in die Schweiz einwandern ("
