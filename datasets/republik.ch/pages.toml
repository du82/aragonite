["https://republik.ch/2023/12/28/es-geht-bei-europa-auch-um-eine-gemeinschaft-der-werte"]
title = "«Es geht bei Europa auch um eine Gemeinschaft der Werte» – Republik"
description = "Die neu gewählte Ständerätin Tiana Moser über das Verhältnis der Schweiz zur EU und Gräben in der GLP. Ein Gespräch zum Jahreswechsel."
full_description = "«Es geht bei Europa auch um eine Gemeinschaft der Werte»Die neu gewählte Ständerätin Tiana Moser über das Verhältnis der Schweiz zur EU, über Schweigen im Parlament und über Gräben in der GLP. Ein Gespräch zum Jahres­wechsel.Von Lukas Häuptli (Text) und Luis Mazón (Illustration), 28.12.2023FolgenMerkenTeilen38 Beiträge388 Minuten8'Vorgelesen von Egon Fässler0:00 / 13:30Nach sechzehn Jahren im Nationalrat haben Sie jetzt Ihre ersten drei Wochen im Ständerat erlebt. Wie war es?Es herrscht im Ständerat eine andere Kultur als im Nationalrat, eine weniger konfrontative. Die Debatten entwickeln sich eher. Im Nationalrat dagegen werden die eigenen Positionen stärker präsentiert.Sie haben sich in den drei Wochen allerdings nie in die Debatten eingebracht.Das stimmt. Es gibt im Ständerat ein ungeschriebenes Gesetz, dass sich Neugewählte in ihrer ersten Session nicht zu Wort melden dürfen. Daran habe ich mich gehalten.Uff …So schlimm war es nicht, ich kann damit umgehen.Was hätten Sie gerne gesagt?In der Budget­debatte hätte ich mich gern gemeldet. Da geht es immer um viele umstrittene Sachfragen. Für mich als Zürcher Ständerätin war zum Beispiel die Finanzierung der Regional­politik wichtig. Aber wie gesagt: Es war kein Weltuntergang, dass ich nicht in die Debatten eingreifen durfte. Ich werde mich noch oft zu Wort melden können.Wenn nicht im Ständerat, dann in diesem Interview … Welche Probleme muss die Schweiz in den nächsten vier Jahren lösen?Die Schweiz steht, ich sage es einmal so, vor formalen und inhaltlichen Heraus­forderungen. In der letzten Legislatur hat die Polarisierung im Parlament und in der Politik ganz generell noch einmal stark zugenommen. Gleichzeitig ist die Bereitschaft gesunken, Kompromisse einzugehen, sich auf einen gemeinsamen Nenner zu verständigen und Lösungen zu finden. Das ist mit ein Grund, weshalb die Schweiz an einem Reformstau leidet. Dabei ist unser politisches System mit dem Kollegial­prinzip im Bundesrat, den zwei Kammern im Parlament und den weitreichenden Volks­rechten genau auf das angelegt: auf den Ausgleich, auf die Verständigung und auf die Konsens­findung. So entsteht konstruktive Politik. Und konstruktive Politik ist vor allem aus dem politischen Zentrum heraus möglich.Welche anderen Probleme stehen an?Nach Jahren des Stillstands müssen wir endlich die Europa­frage klären. Daneben bleibt der Klima- und Umwelt­schutz eine grosse Heraus­forderung. Im Klimaschutz kommen wir nur langsam vorwärts, und bei der Arten­vielfalt macht die Schweiz viel zu wenig. Deshalb bin ich der Meinung, dass wir die Biodiversitäts­initiative unbedingt annehmen müssen. Schliesslich haben wir die Alters­vorsorge zu reformieren. Dazu braucht es ein Ja für die hängige Reform der beruflichen Vorsorge. Sie ist für die jüngere Generation und für die Frauen zentral.Zur PersonTiana Moser ist in Weisslingen ZH aufgewachsen und hat in Zürich und Barcelona Politik- und Umwelt­wissenschaften sowie Staatsrecht studiert. Sie sass von 2007 bis 2023 für die GLP im Nationalrat; im letzten November wurde sie in den Ständerat gewählt. Tiana Moser wohnt in Zürich und lebt in einer Partnerschaft mit SP-Nationalrat Matthias Aebischer.Zur Klärung der Europa­frage hat der Bundesrat eben einen ersten Schritt gemacht. Er verabschiedete einen Entwurf für das EU-Verhandlungs­mandat.Ja, dieser Schritt war überfällig. Nach dem Abbruch der letzten Verhandlungen mit der EU im Jahr 2021 hat der Bundesrat viel zu lange zugewartet. Erfreulich ist jetzt, dass er den Entwurf nicht nur verabschiedete, sondern auch eine relativ grosse Transparenz schaffte. Ich bin zuversichtlich, dass die Verhandlungen zwischen der Schweiz und der EU rasch abgeschlossen werden – mit den Bilateralen III.Dann aber folgen schon die nächsten Stolper­steine. Sowohl das Parlament als auch die Stimm­berechtigten müssen den Abkommen mit der EU zustimmen. Droht da das grosse Scheitern?Ich bin überzeugt, dass die Mehrheit der Bevölkerung geregelte Beziehungen mit der EU möchte. Und deshalb bin ich zuversichtlich, dass sich auch im Parlament und im Stimmvolk entsprechende Mehrheiten finden lassen. Wir stehen an einem anderen Punkt als vor ein paar Jahren.Nämlich?Immer mehr Menschen sehen ein, wie wichtig geregelte Beziehungen der Schweiz zur EU sind. Ich nehme die Bevölkerung gerade bei den institutionellen Fragen als pragmatischer wahr als gewisse Politiker in den Debatten. Viele Menschen verstehen nicht, warum wir hier noch immer keine Lösung haben.Zur Lösung der institutionellen Fragen gehört, dass wir EU-Recht übernehmen und den Europäischen Gerichtshof als Instanz zur Streit­beilegung anerkennen. Für die SVP höhlt das Erste die direkte Demokratie aus und kommt das Zweite einem Gericht aus fremden Richtern gleich.Die SVP betreibt in der Europa­politik seit Jahren Fundamental­opposition. Das ist und bleibt wohl so. Aber bei den anderen Parteien und bei den Gewerkschaften wächst die Bereitschaft, die institutionellen Fragen mit der EU zu klären. Das ist erfreulich. Ich bin überzeugt, dass die Schweiz damit nicht an Souveränität verliert, sondern an Souveränität gewinnt. Schliesslich wird sie nach dieser Klärung wieder vermehrt am Tisch mit der EU sitzen.Warum eigentlich ist die Annäherung der Schweiz an die EU so wichtig? Weite Teile der Bevölkerung sind der Meinung, sie würden mit der Änderung des Status quo verlieren.Das Gegenteil ist der Fall. Das Festhalten am Status quo ist ein Brexit auf Raten. Was das heisst, sieht man in Gross­britannien. Das Land befindet sich in einer schweren Krise. Europa ist unser wichtigster Partner – in wirtschaftlicher Beziehung, aber auch in vielen anderen Bereichen. Dank der EU wächst die Schweizer Wirtschaft, und zwar sowohl insgesamt als auch pro Kopf. Wir verdanken unseren Wohlstand nicht dem Alleingang und dem damit verbundenen Mythos des Sonderfalls. Wir verdanken unseren Wohlstand – auch – Europa.Das wirtschaftliche Argument verfängt allerdings immer weniger. Viele Menschen sagen sich: Was nützt Wirtschafts­wachstum, wenn ich davon nichts habe? Und: Was nützt Wirtschafts­wachstum, wenn es die ökologischen Grundlagen zerstört?Es ist anders: Die meisten Menschen haben etwas vom Wirtschafts­wachstum, sei es direkt, sei es indirekt. Und es gibt eben ein Wirtschafts­wachstum, das Umwelt und Klima nicht zerstört.Sie haben auch andere Gründe erwähnt, die für eine Annäherung der Schweiz an die EU sprechen. Welche?Die meisten Staaten in Europa vertreten die gleichen Werte und stehen vor den gleichen Heraus­forderungen wie die Schweiz. Nehmen Sie den Klima- und Umwelt­schutz, nehmen Sie die demografische Entwicklung, nehmen Sie die Unter­stützung der Ukraine: Die meisten europäischen Staaten versuchen ähnliche Probleme auf ähnliche Weise zu lösen. Es geht bei Europa auch um eine Gemeinschaft der Werte, zum Beispiel um eine Gemeinschaft der demokratischen Grund- und Menschen­rechte. Wegen unserer geografischen Lage und unserer gemeinsamen Werte sind die europäischen Länder unsere engsten Verbündeten. Oder wollen Sie, dass sich die Schweiz Russland und China annähert?Ich nicht, aber es gibt politische Kreise, die das wollen. Nochmals: Woher rührt Ihre Zuversicht, dass eine Mehrheit des Parlaments und der Schweizer Stimm­berechtigten die EU-Frage gleich wie Sie sehen?Eine Europa-Abstimmung ist nie ein Spaziergang. Aber die Ergebnisse von Umfragen und meine Erfahrungen aus dem Wahlkampf stimmen mich zuversichtlich. Meine klare europa­politische Haltung hat die Menschen im Kanton Zürich offensichtlich nicht davon abgehalten, mir ihre Stimme zu geben.Offensichtlich. Sie haben im zweiten Ständerats­wahlgang über 200’000 Stimmen geholt, fast 50’000 Stimmen mehr als SVP-Kandidat Gregor Rutz. Allein an der EU-Frage kann das aber nicht gelegen haben.Ich denke, viele Wählende haben mir die Stimme gegeben, weil sie meine Politik und meine Art des Politisierens schätzen. Sie wissen, dass ich für Anliegen des Umwelt- und Klima­schutzes einstehe, aber auch für Anliegen der Wirtschaft. Und dass ich auf Lösungen aus bin.Das war jetzt ein Werbespot für die nächste Wahl. Bei der letzten haben Sie auch von einem Anti-SVP-Reflex profitiert. Und davon, dass Sie eine Frau sind.Das mag auch eine Rolle gespielt haben.Neben Ihrem Sieg stand die Niederlage Ihrer Partei bei den Nationalrats­wahlen. Was waren die Gründe?Die GLP verlor zwar Sitze, aber kaum Wähler­anteile. Wegen der Listen­verbindungen der anderen Parteien hatten wir ein wenig Pech. Aber es stimmt schon: Wir konnten unsere Stärken im Wahlkampf zu wenig einbringen.Man hat den Eindruck, es gebe Gräben in der GLP. So sagte Partei­präsident Jürg Grossen, die Schweiz habe ein Problem mit der Arbeits­migration. Die Arbeits­migration stammt aber hauptsächlich aus der EU, für die Sie sich seit Jahren starkmachen.Es gibt keine Gräben in der GLP. In den letzten Jahren ist nicht nur die Partei gewachsen, sondern auch die Bandbreite der Meinungen ihrer Mitglieder. Aber die GLP ist sich in den Grund­fragen einig. Auch in denjenigen der EU und der Migration.Die Zuwanderung ist für Sie kein Problem?Die Zuwanderung bringt Heraus­forderungen mit sich, ist aber kein grundsätzliches Problem. Wir können sie dämpfen, wenn wir Massnahmen zur Erhöhung der Erwerbs­quote im Inland treffen. Wir müssen die Vereinbarkeit von Familie und Arbeit verbessern, das Rentenalter flexibilisieren und mehr Asyl­suchende und Geflüchtete in die Erwerbs­arbeit integrieren.Im Ständerat haben Sie sich der Gruppe der Grünen angeschlossen. Warum eigentlich?Ich bin Mitglied der Grünliberalen Fraktion, im Ständerat aber die einzige Vertreterin der GLP. Auch wegen des Einsitzes in den Kommissionen ist es wichtig, Mitglied einer Gruppe zu sein.Es gibt das Gerücht, Sie hätten sich am liebsten der Gruppe der Mitte angeschlossen. Diese habe Sie aber abgewiesen.Ich habe in dieser Sache mit den Grünen, der Mitte und der FDP Gespräche geführt. Jetzt bin ich mit den Grünen in einer Gruppe. Mehr gibt es dazu nicht zu sagen.Die Frage ist auch deshalb interessant, weil GLP-Mitglied Georges Kern vorschlägt, Ihre Partei solle sich der Mitte anschliessen. Kern ist Chef der Luxus­uhren­marke Breitling und ein Gross­spender der GLP. Was halten Sie von seiner Idee?Es stimmt zwar, dass wir in einigen politischen Fragen der Mitte nahestehen und wir uns wie sie um politische Lösungen bemühen. Daneben gibt es aber zahlreiche Differenzen. Die GLP ist eine eigenständige Partei im politischen Zentrum. Und sie wird eine bleiben. Eine engere Kooperation mit der Mitte ist deshalb sinnvoll. Aus dem politischen Zentrum heraus lassen sich Lösungen finden und Reformen angehen. Und das ist, ich habe es gesagt, in den nächsten Jahren eine der grossen Heraus­forderungen der Schweiz."
