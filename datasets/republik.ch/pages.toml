["https://republik.ch/2024/07/22/elif-shafak-literatur-ist-noch-einer-der-wenigen-demokratischen-raeume"]
title = "Nichts dringt zur Wahrheit vor wie die literarische Fiktion – Republik"
description = "Die Pflicht einer Schriftstellerin – die türkische Autorin Elif Shafak und ihr neuer Roman «Am Himmel die Flüsse». Eine Begegnung."
full_description = "«Literatur ist noch einer der wenigen demokratischen Räume»Seit acht Jahren reist die Autorin Elif Shafak nicht mehr in ihre Heimat, die Türkei. Sie fürchtet Repressalien durch die Regierung Erdoğan. Und doch erhebt sie ihre Stimme, auch mit dem neuen Roman «Am Himmel die Flüsse». Von Tuğba Ayaz (Text) und Aline Zalko (Illustration), 22.07.2024FolgenMerkenTeilen5 Beiträge514 Minuten14'Vorgelesen von Danny Exnar0:00 / 21:30«Frauen müssen sich stärker verbünden, andernfalls stärkt es das Patriarchat», findet Elif Shafak.Elif Shafak hörte das Wort «Exil», sürgün auf Türkisch, zum ersten Mal in der Primar­schule. Sie war Links­händerin, die Lehrerin zwang sie, mit der rechten Hand schreiben zu lernen. In den späten Siebziger­jahren der Türkei galt der Gebrauch der linken Hand als frevelhaft, wie an vielen Orten. Die Lehrerin befahl: Die linke Hand geht ins Exil unter das Pult!Das Exil sollte sich später in verschiedenen Formen durch Elif Shafaks Leben ziehen.Nicht nur in ihrer Kindheit, in der sie erst bei ihrer Grossmutter in Ankara aufwuchs und dann mit ihrer Mutter, einer Diplomatin, in Amman, Boston, Köln, Madrid und Istanbul lebte.Als «selbst auferlegtes Exil» bezeichnet die heute 52-jährige Shafak, deren Werk in mehr als 50 Sprachen übersetzt wurde, die Wanderschaft ihrer Kindheit. Ein Gefühl, das sie auch 2009 einholte, als sie mit zwei Kindern und ihrem Mann, einem Journalisten, nach London zog, wo sie bis heute lebt. Einige Jahre pendelte sie zwischen London und Istanbul. Bis der Bruch kam.Mit dem versuchten Militär­putsch 2016 begann in der Türkei eine neue Zeitrechnung: Ausnahme­zustand, Überwachung, Massen­verhaftungen durch die Regierung von Recep Tayyip Erdoğan. Per Referendum wurde dies 2017 zum Normal­zustand: Der Präsident erhielt allumfassende Vollmachten. Seither werden immer wieder Medien­schaffende, Forscher, Schrift­stellerinnen aufgrund von haltlosen Vorwürfen verhaftet. Auch Shafak fürchtet um ihre Freiheit. Gerade weil sie sich als viel beachtete Denkerin in Essays, Reden und auf Social Media pointiert zu Fragen um Gleichstellung und Meinungs­freiheit positioniert.Die Willkür des türkischen Staates bekommt die Schrift­stellerin lange davor schon zu spüren. Für ihren Roman «Der Bastard von Istanbul», der den Völkermord an den Armeniern thematisiert, wird sie 2006 wegen «Beleidigung des Türkentums» angeklagt. Ein Gesetzes­artikel, dessen Auslegung selbst viele Juristen nicht verstehen. Ihr Anwalt muss vor Gericht eine armenische Roman­figur verteidigen, die von «türkischen Schlächtern» spricht. Auf der Strasse verbrennen Menschen Fotos der Autorin, sie wird bespuckt, bedroht, bekommt Hassbriefe. Elif Shafak ist damals hochschwanger. Aus Mangel an Beweisen wird sie schliesslich freigesprochen.Das Unbehagen wächst 2016. In einem Essay für das Magazin «The New Yorker» berichtet Shafak, wie sie mit ihrer Mutter in London die Putsch­nacht in den Nachrichten verfolgt. Shafak schreibt, was viele demokratische Kräfte in dieser Nacht schmerzlich erkennen: dass diese Zäsur den Beginn einer dunklen Phase bedeutet. Eine der Wut, der Autorität, die auch jene mit voller Wucht treffen würde, die nichts mit dem Putsch­versuch zu tun haben und ihn verurteilen.Dem Druck durch die türkische Justiz ist sie 2019 erneut ausgesetzt. Wegen ihres für den Booker Prize nominierten Romans «Unerhörte Stimmen», in dem sie sexualisierte Gewalt an Mädchen und Zwangs­prostitution thematisiert, bekommt sie in der Türkei ein Verfahren wegen angeblicher «Verbrechen der Obszönität». Darüber hinaus wird Elif Shafak nun Anfang dieses Jahres von einem Istanbuler Gericht dafür verurteilt, in ihrem ersten Roman «Der Bonbonpalast» plagiiert zu haben. Elif Shafak bestreitet den Vorwurf. Das Gutachten, auf das sich das Urteil stützt, löst eine heftige Debatte unter türkischen Autoren aus. Namhafte Kollegen wie Orhan Pamuk oder Zülfü Livaneli stellen sich bei einem Aufruf mit rund 130 Unterschriften hinter Shafak.Seit acht Jahren war Elif Shafak nun nicht mehr in der Türkei. Sie erfährt das Exil in seiner tatsächlichen Bedeutung, die Schwermut, das Unfreiwillige. Zugleich widerstrebt ihr das Wort, weil sie sich neben der Türkei auch anderen Orten verbunden fühlt. Dennoch sagt sie: «Ich muss dieses Wort anerkennen, mein Exil akzeptieren.»Der Zustand der WeltEin Tag im Juli im legendären Londoner Stadtteil Notting Hill, Ort der wohlhabenden Kosmopoliten. Graue Wolken, Nieselregen – mehr London geht nicht. Mehr Klischee auch nicht.Elif Shafak tritt in das Café, wo wir verabredet sind. Sie ist in Schwarz gekleidet, wie meistens. Unter ihrer Jacke blitzt ein grünes Langarm­shirt hervor, die Haare sind locker zusammen­gebunden. Sie lächelt, als ich auf sie zugehe, und umarmt mich herzlich. Es ist unsere dritte Begegnung, das letzte Gespräch liegt fünf Jahre zurück. Sie sagt: «Das Wieder­sehen freut mich sehr.»Es ist allerdings so laut, dass wir uns kaum verstehen und schliesslich in ein anderes Café auf der Strassen­seite gegenüber wechseln. Shafak plaudert mit der Barista, fragt mich zuvor­kommend, ob ich sicher nichts frühstücken will. Auf bunten Sofas mit grossen quadratischen Kissen sitzen Grossstadt­menschen mit Kopfhörern an ihren Laptops.Wir wollen über den Zustand der Welt sprechen und über ihren neuen Roman «Am Himmel die Flüsse», der einige Krisen unserer Zeit beleuchtet: die Klima­katastrophe, Vertreibung von Völkern, Terror und was es bedeutet, in diesen Zeiten Schrift­stellerin zu sein.«Bei unserer ersten Begegnung 2016 sprachen Sie von einem Einschnitt. Viele nannten es ‹Jahr der Populisten›, das Brexit-Referendum war angenommen worden, Donald Trump wurde Präsident. Wo stehen wir heute?», frage ich.«In einer neuen Weltordnung, die wir erst noch begreifen müssen.»«Wie sieht diese aus?»«Voll politischer Instabilität, mit zunehmender Ungleichheit, auf einem brennenden Planeten. Jetzt, wo wir zusammen­halten müssten, erstarkt der Nationalismus. Europas Rechtsruck besorgt mich sehr. Wir lernen nicht aus der Geschichte. Die Rechts­populisten kreieren einen imaginären ‹Anderen›, der für alles herhalten muss. Wir leben in ‹flüssigen Zeiten›, wie es der polnische Soziologe Zygmunt Bauman beschrieb. In Zeiten, in denen es keine Beständigkeit gibt.»Davon zeugt für Elif Shafak, dass sich Europa nicht länger einer vermeintlichen Stabilität gewiss sein kann. Bis in die Nullerjahre, so beobachtete sie, war unter Forscherinnen und Medien die «arrogante Haltung» verbreitet gewesen, dass sogenannte westliche Staaten als «solide Länder» die demokratischen Werte auf sicher hätten. Während sogenannte «flüssige Länder» wie die Türkei noch dafür kämpfen müssten. Als Elif Shafak vor vielen Jahren an der Universität arbeitete, wo sie in Politik­wissenschaften promovierte, habe eine amerikanische Kollegin zu ihr gesagt: Es sei verständlich, dass sie Feministin sei. Schliesslich existierten in ihrem Herkunfts­land, der Türkei, kaum Frauenrechte.«Ich staunte, dass sie als Amerikanerin offenbar glaubte, patriarchale Strukturen würden sie in einem vermeintlich ‹soliden Land› nicht betreffen.» Elif Shafak hält im Gespräch Blick­kontakt. Sie spricht gerne, hört aber auch aufmerksam zu.«Eine ähnliche Haltung herrscht in der Schweiz, wenn es um Europas Rechtsruck geht. Als Nicht­mitglied der Union glaubt man sich verschont», sage ich.«Die Schweiz hat mich bei jedem meiner Besuche beeindruckt. Doch besonders in intellektuellen Kreisen habe ich eine Bequemlichkeit, ja Selbst­gefälligkeit bemerkt, mit der man auf Europas Probleme blickt, als würden sie einen nicht betreffen. Das irritierte mich. Wenn vor Ihrem Haus ein Sturm tobt, ist es naiv, zu glauben, dass er Sie nicht erwischt. Wir sehen jetzt 2024: Wir alle müssen für Demokratie, Gleichheit, Grundrechte einstehen.»Die Pflicht der Schrift­stellerinEntscheidend ist für Shafak der Zusammenhalt unter Feministinnen. Ist die Demokratie fragil, drohe den Frauen als Erstes die Beschneidung ihrer Rechte. Sie hat Mühe damit, dass sich Feministinnen über die Anerkennung von Transfrauen und LGBTQIA+-Rechten zerstreiten – eine Debatte, die besonders in Gross­britannien hitzig geführt wird. Für Shafak gehören Rechte für Frauen und die LGBTQIA+-Gemeinschaft zusammen, auch weil sie sich selbst als queer versteht. In einem TED-Talk offenbarte sie 2017 ihre Bisexualität.«Frauen müssen sich stärker verbünden, andernfalls stärkt es das Patriarchat», sagt sie. «Mich hat die Schwesterlichkeit zwischen meiner Mutter und Grossmutter sehr geprägt. Meine Grossmutter half meiner Mutter, eine starke Frau zu werden. Ohne ihre Unterstützung wäre auch ich ein anderer Mensch geworden. Zusammenhalt unter Frauen wirkt über Generationen hinweg.»Elif Shafak verbrachte einen Teil ihrer Kindheit bei ihrer Grossmutter in Ankara. Dorthin war sie mit ihrer Mutter gezogen, nachdem sich ihre Eltern, kurz nach ihrer Geburt in Strassburg, getrennt hatten. Shafaks Mutter stand allein­erziehend ohne Ausbildung da. Ihre Grossmutter hatte eine bescheidene Schulbildung, bestärkte aber Shafaks Mutter, ihren Studien­abschluss nachzuholen. Sie würde für ihre Enkelin sorgen.Elif Shafaks Kindheit war geprägt von Ritualen ihrer Grossmutter wie dem Bleigiessen gegen den bösen Blick. Zugleich vermittelte ihr die Mutter, die schliesslich Diplomatin wurde, Werte wie Gleich­stellung, Fleiss, Mut. Mit ihrem Vater war der Kontakt brüchig. In ihrer Jugend tauschte sie seinen Nachnamen gegen «Shafak», den Vornamen ihrer Mutter.Als Schriftstellerin sieht sich Elif Shafak in der Pflicht, zu debattieren – auch mit Rechts­populisten. «Das fordert mich als introvertierten Menschen heraus.» Wie viele Kolleginnen würde sie sich am liebsten einzig in das Lesen und Schreiben zurückziehen, «doch das können wir uns heute nicht leisten. Wir Schrift­stellerinnen müssen uns mit den grossen Krisen befassen, um nach der Wahrheit suchen zu können.»Wie findet sie Wahrheit in der Fiktion?In ihren Augen dringt nichts so zur Wahrheit vor wie die literarische Fiktion, weil sie Unscheinbares sichtbar macht. Literatur konserviert für sie Geschehnisse in einer Welt, die vergisst. Vermenschlicht Menschen, die entmenschlicht wurden. Gleicht Gräben zwischen «Wir» und «Sie» aus.«Literatur zu erschaffen, erfordert genaues Beobachten, nuanciertes Denken, emotionale Intelligenz. So wird Annäherung an die Wahrheit erst möglich. Literatur ist noch einer der wenigen demokratischen Räume», sagt Shafak.«Doch Literatur erreicht oft nur bestimmte Kreise, etwa solche, die in diesem Café sitzen», sage ich.«Das sehe ich anders. Mich hat kürzlich ein Ereignis sehr bewegt. In Afghanistan verübte ein Selbstmord­attentäter einen Anschlag in einer Schule mit Hazara-Mädchen. Eines der getöteten Mädchen hiess Marzia. Ich erfuhr von ihrer Geschichte, weil Angehörige Auszüge aus ihrem Tagebuch auf Social Media teilten. Darin stand, dass sie mich eines Tages persönlich treffen wolle. Sie hatte meine Romane «Die vierzig Geheimnisse der Liebe», «Der Architekt des Sultans» und «Ehre» gelesen, sich dazu Notizen gemacht, die sie mit mir teilen wollte. Das hat mich bestärkt, weiterhin an die verbindende Kraft der Literatur zu glauben.»Es sind auch die Vulnerablen; jene, die schwer gehört werden, denen Shafak in ihren Romanen eine Stimme gibt. In «Unerhörte Stimmen» (2019) sind es Prostituierte, Mittellose, Transgender­menschen. In «Das Flüstern der Feigenbäume» (2021) sind es Betroffene des zypriotischen Bürgerkriegs. In ihrem neuen Roman «Am Himmel die Flüsse» sind es die Jesiden, eine kurdisch­sprachige religiöse Minderheit, die im Irak, in Syrien und der Türkei lebt.Realität in der FiktionEine der drei Protagonistinnen ist die 9-jährige Narin. Ihr Dorf im Südosten der Türkei weicht 2014 dem umstrittenen Staudamm­projekt Ilısu, das tatsächlich gebaut wurde. Shafak greift damit, wie bereits in früheren Werken, ein Ereignis von Brisanz auf. Man könnte diesen Staudamm als Metapher verstehen dafür, wie die Türkei mit Minderheiten, Kultur­gütern im Südosten und Umwelt­fragen umgeht.Die Türkei leide unter «kollektiver Amnesie», sagte Shafak bei unseren beiden letzten Gesprächen. Die türkische Gesellschaft hat verinnerlicht, die dunklen Kapitel der Geschichte zu verdrängen. Sie hat nie gelernt, ihre Vergangenheit kritisch zu reflektieren – unabhängig von der politischen Couleur. Sie wollte diesen «vergrabenen Wahrheiten», wie Shafak sie auch nennt, im neuen Roman weiter auf den Grund gehen.Shafak fiktionalisiert in «Am Himmel die Flüsse» reale Ereignisse und macht gerade dadurch das Geschehene greifbar. Vertrieben aus ihrem Dorf reist Narin mit ihrer Grossmutter in den Irak, wird dabei Zeugin und Überlebende des Genozids am jesidischen Volk durch IS-Terroristen. Wir lesen von grausamen Gräueltaten, von versklavten Mädchen, die auf wahren Berichten beruhen.«Es war hart, die Gewalt­zeugnisse zu lesen. Doch genauso hart war die Erkenntnis: Dieser Genozid wurde 2014 vor den Augen der Welt begangen. Wir haben das zugelassen.»«Was sagt das über die Menschen der heutigen Zeit aus?», frage ich.«Dass wir gefühlstaub werden. Das macht mir Angst. Mich beunruhigt, dass wir den Ereignissen im Sudan, in Gaza, in Afghanistan, in der Ukraine zunehmend apathisch begegnen. Wir müssen hinschauen. Grauen, Schrecken, Trauer benennen, um empfindungs­fähig zu bleiben.»Shafak hat die Geschichte der Jesiden auch durch Gespräche mit jesidischen Zeitzeugen, Aktivistinnen und Forschern ergründet. Das war essenziell, weil die jesidische Kultur vorwiegend mündlich in Form von Liedern, Geschichten, Gedichten überliefert ist. Bei der Recherche fragte sie sich immer wieder: Wie werde ich diesem Schmerz mit meinem Schreiben gerecht?Shafak erzählt in diesem epischen Roman mit der Geschichte der Jesiden auch vom kulturellen Reichtum der Region Mesopotamien, deren zivilisatorischen Errungenschaften, etwa in der Literatur. So rahmt das Gilgamesch-Epos den Roman, das zur ältesten schriftlich überlieferten Dichtung zählt. Eingebettet ist all das wiederum in die Geschichten von zwei weiteren Protagonisten. Da ist Arthur, der sich im 19. Jahrhundert in London durch die Niederungen der Klassen­hierarchie kämpft, Assyrologe wird und schliesslich in Mesopotamien forscht. Und da ist die Hydrologin Zaleekah, die 2018 in London zu den Veränderungen des Wassers in der Klimakrise forscht.Die drei Figuren verbindet – so viel sei verraten – ein einziger Wasser­tropfen. Shafak zeigt eindrücklich, wie Klimakrise, die Vertreibung eines Volks, ein Genozid, kultur­geschichtliche sowie natur­wissenschaftliche Begebenheiten ineinander­greifen. Und welche zentrale Rolle in diesen «flüssigen Zeiten» das Wasser in seinen Aggregat­zuständen spielt.«Am Himmel die Flüsse» ist ein Mosaik aus Erzähl­kunst, Wissenschaft, dokumentarischer Recherche und politischem Scharfsinn. Shafak verwebt Historisches mit der Gegenwart, ohne dabei zeitgemässe Debatten ausser Acht zu lassen, etwa jene über die Geschichte der Einwanderung nach Grossbritannien.So steht die Hydrologin Zaleekah auch für die zweite Generati"
