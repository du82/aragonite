["https://www.republik.ch/2019/01/07/unser-plan-ihr-plan"]
title = "Unser Plan – Ihr Plan – Republik"
description = "Alles zur Zukunft der Republik: Warum wir keine haben, wenn wir nichts ändern. Was wir vorhaben. Und was passiert, wenn Sie steuern."
full_description = "An die VerlagsetageUnser Plan – Ihr PlanAlles zur Zukunft der Republik: Warum wir im schlimmsten Fall keine haben, wenn wir nichts ändern. Was wir vorhaben. Und was passiert, wenn Sie das Steuer in die Hand nehmen.Von Ihrem Expeditionsteam, 07.01.2019FolgenMerkenTeilen288 Beiträge2887 Minuten7'Wir haben Ihnen beim Start vor einem Jahr versprochen, dass wir Sie so präzis wie möglich über unser gemeinsames Unternehmen informieren.Dieses Versprechen wollen wir jetzt halten. Das nicht zuletzt, weil die Republik nur dank Ihnen existiert. Als Medium ohne Werbung haben wir nur eine Kundin, also nur einen Chef: Sie.Sie (plus Ihre rund 22’000 Kolleginnen aus der Verlagsetage) besitzen deshalb auch 47,4 Prozent der Aktien der Republik AG. Nur nützt Ihnen die Verantwortung wenig, wenn Sie im Nebel stecken. Deshalb haben wir für Sie ein möglichst brauchbares Management­instrument entwickelt – eines, das nicht nur den Stand der Dinge zeigt. Sondern Ihnen auch die Möglichkeit gibt, verschiedene Varianten für die Zukunft durchzuspielen. Denn anders als im Journalismus geht es in einem Journalismus-Unternehmen nicht um die dramatische Beschreibung der Lage. Sondern um ihre pragmatische Veränderung.LiquiditätskurveEine Prognose unseres Kontostands über die nächsten vier Jahre201920212023−6,6 Mio. Worst Case1,9 Mio. Unser Plan−703,8 Mio. Schweizer Franken 1,0 Mio. Die Republik benötigt Liquiditätsreserven von mindestens 1 Mio. Franken, um allen offenen Verpflichtungen nachzukommen.Sie sehen zwei Kurven. Das «Worst Case»-Szenario (in Violett) zeigt, was passiert, falls alles unverändert bleibt: gleich bleibende Ausgaben, mässiges Wachstum, eine vorsichtig gerechnete Erneuerungsrate. Die Kurve in Blau zeigt, was wir mit unserem Plan vorhaben, den wir weiter unten skizzieren.Und: Sobald Sie in unserem interaktiven Tool weiter unten einen der Parameter verändern, werden Sie eine Kurve (in Grün) sehen können – das, was passiert, wenn Sie das Steuer in die Hand nehmen.WachstumDie Republik ist im vergangenen Jahr schnell gewachsen.Bei ihren Mitgliedern tat sie das erstaunlich solid, erstaunlich nach Plan. Mit einer Ausnahme: dem Sommer. Hier brachen die Neuzugänge ein. Am Strand, wenn sich der Himmel im Wasser und ihr Gesicht im Display spiegelt, hat ein digitales Magazin einen klaren Nachteil.Neue Jahresmitgliedschaften pro Monat seit Januar 2018Jan 2018Mai 2018Nov 20180100020003000 Verkaufte JahresmitgliedschaftenLaunch2339Ø Februar bis Dezember430Zur Errechnung des Durchschnittswerts haben wir den ausserordentlichen Startmonat Januar ausgeklammert.Nur ist beim Aufbau der Republik nicht nur die Zahl der Verlegerinnen gewachsen, sondern auch das Budget. Auf dem Papier liegt es bei 6,9 Millionen Franken pro Jahr.Erfreulicherweise nur auf dem Papier: Nach laufender Rechnung kostet die Republik 6,5 Millionen Franken.Das entspricht den Einnahmen bei rund 27’000 Verlegerinnen. Zwar sind wir mit 22’000 nicht weit weg davon – aber das trügt. Wir sind es nur genau eine Woche lang – bis Mitte Januar.Denn bis dann müssen auf einen Schlag über 16’000 unserer Verleger und Verlegerinnen ihr Engagement erneuern – alle, die beim Crowdfunding und beim Start der Republik an Bord kamen. Bis jetzt haben das ca. 43 Prozent bereits getan.Und das ändert die Lage.Worst Case: CrashHandeln wir nicht unternehmerisch, sind nach den bisherigen Erfahrungen folgende Annahmen realistisch:50 Prozent Erneuerung bei den Unterstützern im Crowdfunding (die die Katze im Sack gekauft haben)65 Prozent Erneuerung bei den Neuverlegern nach Publikationsstart430 neue Jahresmitgliedschaften pro Monat30’000 Franken Zusatzeinnahmen pro Monat aus Monatsabos, Gönnermitgliedschaften und SpendenWas hiesse: Wir wären im Dezember 2019 pleite.Das klingt zwar auf den ersten Blick dramatisch. Auf den zweiten hingegen weniger. Aus zwei Gründen:Die Republik ist ein neues Medienmodell in einem kleinen, schrumpfenden Markt. Sie war von Geburt an ein Projekt gegen die Wahrscheinlichkeit.Bis Dezember sind elf Monate Zeit. Und im Geschäft gilt dasselbe wie im Verkehr: Dass ein Zusammenstoss droht, ist kein Grund dafür, dass der Zusammenstoss stattfindet. Man kann auch den Kurs korrigieren.Die für uns interessante Frage ist: Wie?Was zähltWollen Sie über eine Zukunft mit Zukunft nachdenken, sind im Fall der Republik drei Dinge interessant:1 – Das BudgetDie Republik und Project R beschäftigen derzeit rund 50 Personen. Bei etwa 36 Vollzeitstellen. Rund zwei Drittel des Budgets sind Personalkosten. Ein Drittel Sach- und Dienstleistungskosten – etwa für die Honorare der freien Journalistinnen, das Marketing, den Etat für Recherchen oder die Bildrechte.2 – Die LiquiditätSoll Ihr Plan realistisch sein, muss er eine tückische Klippe umschiffen. Denn pleite ist die Republik lange vor dem letzten ausgegebenen Franken. Haben wir weniger als 1 Million Franken auf dem Konto, müssen wir den Betrieb schliessen, um allen offenen Verpflichtungen nachzukommen.3 – Die ParameterDamit es nicht so weit kommt, müssen wir unser Unternehmen für das dritte Geschäftsjahr in Form bringen.Dabei gibt es vier mögliche Hebel:Die Erneuerungsraten der MitgliedschaftenNeue MitgliedschaftenDie KostenZusätzliche InvestorinnenWobei Punkt 4 zwar wichtig ist, aber keine Alternative dazu, die Punkte 1 bis 3 anzugehen.Mit frischem Geld kauft man sich nicht Gesundheit, sondern nur zusätzliche Zeit vor dem Tod.Unser PlanWir glauben nicht, dass eine einzelne Massnahme Erfolg verspricht, um zu etwas Vernünftigem zu kommen, sondern nur ein Gesamtpaket. Man muss an allen Parametern schrauben:Die Erneuerungsrate – diese kontrollieren letztlich Sie. Jede Person, die an Bord bleibt, zählt. Wir gehen in diesem Szenario von 50 Prozent bei den Crowdfundern und von 65 Prozent bei den Neuverlegern aus.Neue Jahresmitgliedschaften – unser Ziel für 2019 ist hier: durch gezieltes Marketing monatlich im Durchschnitt 675 neue Verlegerinnen und Verleger zu gewinnen.Die Kosten – wir wollen diese um rund 10 Prozent senken und ab Frühsommer höchstens rund 490’000 Franken pro Monat ausgeben.Neue Investoren – wir suchen ein einmaliges 1-Million-Franken-Investment (oder eine Spende) von neuen Geldgebern bis Sommer 2019.Mit diesem Szenario könnten wir in vier Jahren selbsttragend sein. Es beruht nicht zuletzt darauf, dass die turbulente Zeit des Starts vorbei ist. Wir kennen nun das eigene Produkt, die Organisation steht, Kapazitäten werden frei, weil sich die Augen weniger nach innen, auf die Firma, richten, sondern nach aussen, auf die Welt.Das heisst, mehr Leute können sich auf den eigentlichen Zweck konzentrieren: auf das Produkt statt auf dessen Aufbau. Wir können Projekte anpacken, für die bis jetzt schlicht nicht die Zeit war: etwa ein Marketing, das über das Verbreiten der eigenen Artikel hinausgeht.Kurz: Wir setzen darauf, dass wir im nächsten Jahr ein fokussierteres Produkt mit weniger Aufwand machen können.Das Investment brauchen wir als Liquiditätsspritze zur Absicherung, falls wir uns bei Obigem irren: Diese gibt uns Zeit, bei schlechten Zahlen neu zu reagieren.Ihr PlanDamit zu Ihnen: Was ist Ihre Prognose? Ihr Plan?Spielen Sie mit der Idee, das Budget zu halbieren? Die Erneuerungsrate auf 80 Prozent zu treiben? 20 Millionen Franken Risikokapital zu verfeuern?Hier können Sie jetzt ans Steuer der Republik. Und die Zukunft des Unternehmens durchspielen: Überlebt die Republik? Geht sie pleite? Was braucht es, bis sie Profit macht?Probieren Sie es selbst!Nur noch zwei Tipps:Falls Sie realistisch sein wollen, schrauben Sie nicht zu wild. (Beispielsweise sind bereits die 10 Prozent Einsparungen in unserem Szenario keine völlig harmlose Sache. Denn das hiesse: pro Jahr rund 650’000 Franken weniger auszugeben – also beispielsweise 360 Stellenprozente und 10 Prozent des Sachbudgets.)Wo Sie vorsichtig optimistisch sein können: bei der Erneuerungsrate. Bis jetzt haben bereits 43 Prozent der Crowdfunderinnen ihre Mitgliedschaft erneuert. Unser (ehrgeiziges) Ziel sind 66 Prozent. (Den aktuellen Stand finden Sie hier.)Ihre MöglichkeitNatürlich haben Sie auch die Möglichkeit, die Zukunft zwar nicht zu kennen, aber zu machen.Dies deshalb, weil in unserem noch jungen Unternehmen jede einzelne Verlegerin, jeder einzelne Verleger zählt. Sie können die obigen Parameter persönlich verschieben: indem Sie Ihr Engagement verlängern, neu an Bord kommen – oder indem Sie wie einst Napoleon Ihren Liebsten eine Republik schenken.Damit genug Verlagsetagenarbeit für heute.Wir wünschen Ihnen für 2019 Tatkraft, guten Wind, steife Segel, klaren Kurs und interessante Irrtümer.Ihre Crew von Project R und der RepublikPS: Unsere Rechtsabteilung sagt uns, dass wir Ihnen sagen sollen, dass alle obigen Zahlen nicht notwendigerweise perfekt mit der später gemessenen Wirklichkeit übereinstimmen müssen. Es sind aber die besten Zahlen, die wir haben. Und die, mit denen auch wir arbeiten.PPS: Zwar ist der Erneuerungstag vom 15. Januar der wichtigste in der Geschichte der Republik – aber seien Sie am 16. nicht zu gespannt. Einen wirklichen Überblick über die Erneuerung haben wir erst Ende Monat.PPPS: Unser Lieblingszitat zum Thema ist von Hannah Arendt: «Die einzige Möglichkeit, die Zukunft vorherzusagen, ist: Gib ein Versprechen und halte es.»"
