["https://republik.ch/faq"]
title = "Republik"
full_description = "Bei allen technischen Problemen helfen wir Ihnen gerne so schnell wie möglich per Mail: kontakt@republik.ch Sie benötigen dazu kein Passwort. Sie loggen sich mit Ihrer E-Mail-Adresse bei uns ein. (Auf Ihre E-Mail-Adresse muss eine gültige Mitgliedschaft oder ein Monatsabo laufen.) Doch Schritt für Schritt: Warten Sie. Wir schicken Ihnen umgehend eine E-Mail mit dem Betreff «Zugriff bestätigen». Die Zustellung dauert jedoch manchmal einige Minuten. In der E-Mail finden Sie einen grünen Button mit dem Text «Zugriff bestätigen». Klicken Sie diesen an. Sie loggen sich mit Ihrer E-Mail-Adresse bei uns ein (auf diese E-Mail-Adresse muss eine gültige Mitgliedschaft oder ein Monatsabo laufen). Dazu benötigen Sie kein Passwort. Klicken Sie auf unserer Website auf Anmelden. Geben Sie Ihre E-Mail-Adresse ein Mal ein und klicken Sie auf den Button «Anmelden». Warten Sie. Wir schicken Ihnen umgehend eine E-Mail mit dem Betreff «Zugriff bestätigen». Die Zustellung dauert jedoch manchmal einige Minuten. In der E-Mail finden Sie einen grünen Button mit dem Text «Zugriff bestätigen». Klicken Sie diesen an. Der Browser merkt sich die Bestätigung, Sie sind bei einem erneuten Besuch also automatisch angemeldet. Dafür muss Ihr Browser Cookies akzeptieren, und Sie dürfen nicht im Privatmodus (Firefox und Safari) oder im Inkognitomodus (Chrome) surfen. Wir finden, Passwörter sind zu unsicher. Dies aufgrund der häufigen Leaks und weil proaktives Sperren zu aufwendig ist. Deshalb haben wir ein System gebaut, das von zeit.co inspiriert ist und kein Passwort benötigt. Anfangs hatten viele Verleger Schwierigkeiten damit: Einige E-Mails kamen nicht an, nicht alle bekamen die E-Mail innerhalb von 60 Sekunden, Passwortmanager werden häufiger verwendet als gedacht, und viele waren verwirrt, weil das Login anders ist. Das hatten wir zu wenig bedacht und unterschätzt. Das «Rolling-Cookie» hält nun ein Jahr, und die App steht als Login-Alternative zur Verfügung, seither erhalten wir weniger Fragen und Problemmeldungen. Falls Sie Schwierigkeiten haben, schreiben Sie unserer Erste-Hilfe-Abteilung: kontakt@republik.ch."
year_published = 2025
clearnet = "https://republik.ch/faq"
