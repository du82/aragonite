["https://republik.ch/2024/04/24/die-demokratie-muss-sich-verbessern-oder-sie-wird-sterben"]
title = "Marina Weisband: «Die Demokratie muss sich verbessern» – Republik"
description = "Warum die Schule entscheidend ist für eine Offensive der Demokratie. Ein Gespräch mit Marina Weisband, Psychologin und Publizistin."
full_description = "«Die Demokratie muss sich verbessern oder sie wird sterben»Die Psychologin und Publizistin Marina Weisband plädiert für eine Demokratie­offensive an Schulen. Ein Gespräch über die politische Kultur – und darüber, was sich den Krisen der Gegenwart entgegen­setzen lässt.Von Daniel Graf, 24.04.2024 FolgenMerkenTeilen76 Beiträge7622 Minuten22'Vorgelesen von Miriam Japp0:00 / 33:07Funktioniert das politische Ganze in der Schweiz besser als in Deutschland? Ja, sagt Marina Weisband, und sie erklärt auch, warum. Maximilian Mann/laifFrau Weisband, Sie fordern eine neue Schule der Demokratie. Warum braucht es die?Wir sehen weltweit, dass mehr und mehr Demokratien fallen. Das Konzept von Demokratie ist an einem Scheide­punkt: Sie muss sich entweder verbessern oder sie wird sterben. Und eine der Schwächen der aktuellen Demokratie besteht darin, dass wir Demokratie nie wirklich lernen während unserer Sozialisation. Man erwartet von uns, dass wir wählen. Aber wo ist der Raum, wo wir uns, während wir aufwachsen und unsere Rolle in der Gesellschaft finden, fragen können: Wer bin ich eigentlich, was sind meine Bedürfnisse? Was sind die Bedürfnisse meines Nächsten? Welche Verantwortung trage ich für diese Gesellschaft? Wenn wir in einem Schul­system leben, in dem wir wenig Macht und wenig Verantwortung darüber haben, wie unsere Umwelt aussieht, lernen wir diese grund­legenden Fähigkeiten nicht. Und sind dann viel schlechter darin, sie anzuwenden, wenn die Gesellschaft einmal wirklich auf unseren Schultern liegt.Die Demokratie ist doch aber fester Bestandteil etwa des Geschichts- und Politik­unterrichts. Was fehlt?Hier ist, wie ich in Deutschland Demokratie gelernt habe: in der 8. Klasse, per Organi­gramm. Bundestag, Bundesrat, Bundes­präsident und so weiter. Das hatte so gar nichts mit meinem Leben zu tun. Es war ein rein theoretisches Konstrukt, irgendwo da oben. Demokratie beginnt für mich nicht bei diesem Organi­gramm. Sondern mit einem Selbst­verständnis, dass ich verantwortlich bin für meine Gesellschaft. Dass ich nicht Konsumentin bin, sondern Gestalterin. Diese Rolle kann man nicht in einer Politik­stunde lernen. Demokratie ist also nicht einfach Lerninhalt, sondern muss eingeübt werden?Genau. Und wie lernen wir Menschen etwas? Indem wir es leben. Demokratie muss gelebt werden.Zur PersonMarina Weisband, 1987 in Kiew geboren und 1994 mit ihrer ukrainisch-jüdischen Familie nach Wuppertal gekommen, ist Diplom­psychologin und Publizistin. Deutschlandweit bekannt wurde sie als Vorstands­mitglied der Piratenpartei, deren politische Geschäfts­führerin sie von Mai 2011 bis April 2012 war. Nach ihrem Parteiaustritt 2015 trat sie 2018 den Grünen bei und engagiert sich dort in den Themen­feldern Digitalisierung und Bildung. Seit 2014 leitet sie hauptberuflich das Schüler-Beteiligungs­konzept «Aula». Unter Mitwirkung von Doris Mendlewitsch entstand ihr Buch «Die neue Schule der Demokratie. Wilder denken, wirksam handeln», das diese Woche bei S. Fischer erscheint. Sie lebt mit ihrer Familie in Münster (Nordrhein-Westfalen, D).Warum ist für Sie die Schule der zentrale Ort dieser Einübung?Würde man stattdessen auf Sommer­akademien oder Nachmittags­veranstaltungen setzen, kämen immer die gleichen Jugendlichen. Und zwar diejenigen, die sowieso schon selbstwirksam sind und ein Gefühl der Verantwortung spüren. Sagen wir so: Ich wäre da als Jugendliche nicht hingegangen. Als migrantische, völlig apolitische Jugendliche habe ich immer gedacht, Politik ist etwas, das die Deutschen unter sich ausmachen.Sie eine apolitische Jugendliche? Das wird viele überraschen!Ich war absolut apolitisch! Es hat bis zum Moment meiner ersten Wahl gedauert, dass ich angefangen habe, mich für Politik zu interessieren. Und am selben Tag bin ich dann auch gleich in eine Partei eingetreten [die Piratenpartei; Anm. d. Red.], weil ich keinerlei Impuls­kontrolle habe. Und weil ich geflasht war von dem Vertrauen, das die Gesellschaft mir jetzt plötzlich entgegenbringt. Der Punkt ist: Diese Momente gehören in die Schule, weil in der Schule alle sind. In der Schule erwische ich die, die nicht an sich glauben. Die, an die überhaupt niemand glaubt. Deswegen bin ich mit meinem Demokratie­projekt «Aula» auch besonders gern an sogenannten Brennpunkt­schulen. Weil es dort den grössten Unterschied macht.Der Name «Aula» ist eine Abkürzung. Er steht für «ausdiskutieren und live abstimmen».Trotzdem ist «Aula» eben auch die Abbildung der physischen Aula, also der Versammlungs­halle in der Schule. Mithilfe eines digitalen Werkzeugs erreichen wir, dass sich die ganze Schule über ein Thema unterhalten kann, was im Schul­alltag normalerweise gar nicht so möglich ist. Es geht aber weit über die App hinaus. Wir wollen einen Kultur­wandel in die Schulen tragen, durch ein dauerhaftes Beteiligungs­konzept, dessen Entscheidungen verbindlich sind, weil die Regeln zuvor in einem Vertrag so festgehalten werden. Wir haben keine Pseudo­partizipation, wie es sehr oft leider gerade bei Jugendlichen passiert; dass man sagt, beteiligt euch, gebt uns eure Ideen, aber die Schul­leitung entscheidet darüber. Dagegen haben wir Mechanismen. Worüber diskutiert und abgestimmt wurde, das soll auch umgesetzt werden.Die Schule soll selbst eine kleine Republik werden?Im Prinzip ja. Kinder lernen Selbst­wirksamkeit ja eigentlich von klein auf. Kleinkinder werfen Türme aus Bau­klötzen um, weil sie selbst noch keine bauen können, aber etwas an ihrer Umwelt verändern wollen. Sie merken: Ah, wenn ich hier mit der Hand winke, dann verändert sich die Form. Das sind die ersten Erfahrungen, die wir machen. Wir sollten Kindern solche Selbstwirksamkeits­erfahrungen in ihrer Kita geben und dann später in der Schule. Und je grösser Kinder werden, desto grösser sollte ihr Einfluss­bereich werden.Aber wenn man demokratische Prozesse in der Schule durchspielt, greifen doch vermutlich wieder genau die Mechanismen, die Sie vorhin beschrieben haben: Die Engagiertesten machen mit, die Aussen­seiterinnen bleiben fern?Das ist am Anfang so, auf jeden Fall. Aber wenn man ein Beteiligungs­konzept hat, das die gesamte Schule umfasst und auch im Unterricht diskutiert wird, atmen alle, auch die, die zunächst nur am Rand stehen, den Geist der Demokratie. Sie hören, was für Ideen im Raum stehen. Sie hören die Argumente dafür und dagegen. Sie merken, da passiert was. Sie beobachten, dass jemand eine Idee hat, eine Mehrheit dafür findet und sich etwas physisch an der Schule verändert.Sie machen die Erfahrung passiv.Ja, aber wenn dann mal eine Debatte aufkommt, die sie betrifft, zum Beispiel darüber, ob die Fussball­tore abgebaut werden sollen, dann reicht ihnen ein einziger Klick auf der Plattform, um dagegenzu­stimmen. Es ist extrem niedrig­schwellig. Wenn sie sich schon mal eingeloggt und schon mal geklickt haben, dann wächst die Wahrscheinlichkeit, dass sie auch über eine zweite Idee abstimmen. Und wenn sie schon mal abgestimmt haben, wächst die Wahrscheinlichkeit, dass sie mal einen Verbesserungs­vorschlag liken. Und irgendwann machen sie vielleicht selber einen Vorschlag. Sie werden also in den demokratischen Prozess hineingezogen. Man sagt immer, Selbst­wirksamkeit sei eine individuelle Eigenschaft. Daran glaube ich nicht.Sondern?Selbstwirksamkeit ist ein soziales Konstrukt. Ich erwerbe die Erfahrung von Wirksamkeit auch, wenn ich sehe, dass meine Mitschülerinnen etwas machen. So lerne ich: Es gibt nicht «wir hier unten» und «die da oben», sondern wir sind wirkmächtig.Können Sie ein Beispiel geben?Als wir einmal an einer sogenannten Brennpunkt­schule das Projekt gestartet haben, sagte eine Schülerin zu mir: Frau Weisband, das klingt nach einem tollen Projekt, aber wir sind hier an der Schule leider zu dumm dafür. Das hat die Schülerin selbst gesagt! Und tatsächlich ist in ihrer Stufe das Projekt zuerst zwei Jahre lang so ein bisschen vor sich hin gedümpelt. Dann haben sich zwei Mädchen auf den Weg gemacht und vorgeschlagen, ein Tanzfest zu machen und ein Stufen­frühstück. Sie haben einfach gesagt, lass uns das mal ausprobieren, und sie haben es durchgezogen. Sie sind mit einem Wagen voller iPads durch die Klassen gegangen und haben die Leute abstimmen lassen. Schliesslich wurden die Ideen umgesetzt und die Schülerinnen meinten, sie hätten zum ersten Mal so was wie einen Stufen­zusammenhalt gespürt. Das hing massiv damit zusammen, wie sie begleitet wurden. Denn am Anfang hatten sie einen Lehrer, der nicht sehr an sie geglaubt hat. Und als sie später eine Begleitung hatten, die sie ermutigt hat, sind auch Schülerinnen förmlich aufgeblüht, von denen das vorher keiner erwartet hatte.Wie muss man sich die Abstimmungen vorstellen?Das Projekt findet immer analog und digital statt. Das Digitale ist nur ein Hilfsmittel, um das, was im Analogen passiert, zu strukturieren, zu protokollieren und allen verfügbar zu machen. Die Schüler können zu jeder Zeit, von ihrem Handy aus, von zu Hause oder aus der Schule, eine Idee einstellen. Eben zum Beispiel ein internationales Tanzfest. Dann können andere Schülerinnen diese zunächst wilde Ideen­sammlung anschauen und sagen, hey, das klingt nach einer guten Idee, das möchte ich mir merken und da gebe ich ein Like. Hat eine gewisse Anzahl Schülerinnen eine Idee gelikt, kommt sie in eine ernsthafte Ausarbeitungs­phase. Es folgt eine regelmässige «Aula»-Schulstunde, analog im Klassenraum. Dort wird besprochen: Welche neuen Ideen sind schon in der Ausarbeitungs­phase? Möchtest du deine Idee vorstellen? Was sind die Vorteile deiner Idee? Wer könnte Nachteile daraus haben? Gibt es ähnliche Ideen, mit denen du Kompromisse schliessen könntest? Dann wird das Ganze diskutiert und debattiert.Also eine moderierte Diskussion – und der Lehrer moderiert?Am Anfang ja, später dann immer öfter die Schüler­moderatoren. Wir geben das möglichst weit in Schüler­verantwortung. Parallel zur analogen Debatte kann man digital Verbesserungs­vorschläge an die Idee formulieren. Also zum Beispiel: Ja, gerne ein internationales Tanzfest, aber legt doch bitte fest, wann, am besten im Mai. So konkretisiert sich die Idee, bis ein richtiger Projekt­plan steht. Der kommt dann auf den Tisch der Schul­leitung.Und die muss Ja sagen?Sie muss erst einmal prüfen: Ist diese Idee mit unserem Vertrag vereinbar? Kann sie überhaupt umgesetzt werden oder verstösst sie gegen irgendwelche Gesetze oder Regeln? Ist das der Fall, muss die Schul­leitung eine entsprechende Begründung geben, sodass man die Idee noch mal anpassen kann. Für die Ideen, die umsetzbar sind, gibt die Schul­leitung grünes Licht für die Abstimmungs­phase. Und nach zwei Wochen Online-Abstimmung sieht man, welche Ideen die beliebtesten sind und umgesetzt werden dürfen. Verantwortlich für die Umsetzung sind ebenfalls die Schülerinnen, sie sind die Autoren dieser Idee. Sie können um Hilfe bitten, sie können jemanden beauftragen. Aber wenn Schüler eine tolle Idee haben, Mehrheiten dafür finden und dann keine Arbeit in die Umsetzung investieren, kriegen sie auch kein Ergebnis. Auch das ist durchaus ein pädagogisch erwünschter Effekt.Aber ist es nicht so, dass sich meist die Idee durchsetzt, die von den Coolsten, den Beliebtesten, den Rede­gewandtesten kommt? Und wenn diejenigen, die ohnehin schon Aussen­seiter sind, mit ihren Initiativen scheitern, was wird dann aus deren Motivation für das demokratische Prinzip?Das ist das Wunderschöne daran: Es bildet das Leben ab. Und zwar in einem Rahmen, in dem wir es reflektieren können. Wie habe ich abgestimmt und warum? Was hat mich dazu bewegt? In dem Moment, wo man reflektiert, ich habe abgestimmt für jemanden, weil er mir eine Tüte Gummi­bärchen angeboten hat oder weil ich mit dem befreundet bin, kann man sehr gut die Frage diskutieren, was ist eigentlich meine Stimme in einer Demokratie wert? Demokratie an der Schule einzuüben, hat nicht das Ziel, eine künstliche, optimale Welt zu schaffen, in der diese sozialen Mechanismen ausgesetzt sind. Sondern einen realistischen Übungs­raum, in dem ich diese Mechanismen diskutieren und verstehen kann.Sie schreiben in Ihrem diese Woche erscheinenden Buch, Demokratie sei die anstrengendste Staatsform, die man sich vorstellen kann. Wenn man sich ausmalt, dass Schülerinnen manchmal ohnehin keine Lust haben, neben dem Schul­stoff noch zusätzlichen Aufwand zu betreiben: Wie begeistert man sie für die anstrengendste Staatsform der Welt?Eine unserer Beobachtungen ist, dass anfangs die Motivation bei den jüngeren Schülerinnen tendenziell deutlich grösser ist als bei den älteren. Als wir nachgeforscht haben, woran das liegt, haben wir häufig von den Älteren gehört: Ja, warum soll ich mich denn beteiligen? Die Lehrer machen doch eh, was sie wollen. Das ist erlernte Hilflosigkeit! Etwas, das die Schüler in ihrer Laufbahn gelernt haben, nämlich: Ich kann sowieso nicht viel ausrichten. Das heisst, die Motivation, an dem Projekt teilzunehmen, ist direkt geknüpft an die Erwartung, dass sich durch die Teilnahme etwas verändert.Wenn die reale Umsetzung so wichtig ist: Was passiert mit der Motivations­kurve, wenn jemand wahnsinnig viel Herzblut investiert hat in eine Idee, und am Ende geht die Abstimmung knapp oder krachend verloren?Das kann frustrieren. Es ist aber ein völlig anderer Frust, als wenn man von oben von der Schul­leitung abgeschmettert wird. Denn ich werde zumindest die Erfahrung machen, dass, wenn ich verloren habe, ja ein Mitschüler gewonnen hat.Haben Sie mit «Aula» auch Erfahrungen in der Schweiz?Ja, wir kooperieren zum Beispiel mit Voty.ch, um das Konzept auch an Schweizer Schulen zu bringen. Und dort ist es ja übrigens viel ähnlicher zu dem, wie auch das politische Ganze funktioniert. Das Gefühl, ich bin irgendwie verantwortlich für meine Umgebung, das ist in der Schweiz viel verbreiteter als in Deutschland.Sie würden sagen, die niedrige administrative Ebene, angefangen bei der Kommune oder beim Quartier, ist das Entscheidende?Ja, ich glaube tatsächlich, je niedriger die administrative Ebene, desto leichter kann ich Selbst­wirksamkeit vermitteln. In Deutschland geben wir unsere Steuern direkt an den Bund und von dort aus werden die runterverteilt. Das ist ein völlig anderes Gefühl. Kommunal­politik wird in Deutschland ständig stief­mütterlich behandelt. Ich bin viel in der Schweiz und sehe, was für riesige Vorteile es bietet, wenn ich mich so stark mit meiner eigenen Kommune identifiziere.Beim «Aula»-Prinzip in der Schule gilt: Jede Person hat eine Stimme. Wenn man jetzt zum Beispiel auf die politische Realität der Schweiz schaut, da sieht es etwas anders aus. Ein Viertel der hier lebenden Menschen hat keinen Schweizer Pass und damit keine Möglichkeit, in der grossen politischen Aula der Schweiz dabei zu sein. Ist dieser Ausschluss nicht ein viel grund­sätzlicheres Problem als fehlendes Demokratie­training?Zunächst: Ich lebe in einem Land, wo sehr, sehr viele Menschen wählen dürfen und nichts damit anfangen können. Oder wo es für bestimmte Ziele buchstäblich keine Partei gibt, die ich wählen kann, um sie zu err"
