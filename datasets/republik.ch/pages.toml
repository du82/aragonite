["https://republik.ch/2021/09/30/an-dem-tag-als-mein-vater-starb-wurde-ich-eine-andere"]
title = "«An dem Tag, als mein Vater starb, wurde ich eine andere» – Republik"
description = "Die nigerianische Autorin Chimamanda Ngozi Adichie hat den Tod ihres Vaters in einem Buch verarbeitet. Kurz darauf verlor sie auch ihre Mutter. Ein Gespräch über das Trauern."
full_description = "«An dem Tag, als mein Vater starb, wurde ich eine andere»Die nigerianische Autorin Chimamanda Ngozi Adichie hat den Tod ihres Vaters in einem Buch verarbeitet. Kurz darauf verlor sie auch ihre Mutter. Ein Gespräch über Verlust, die Kraft von Ritualen, über Wut und Trost und die besonderen Zumutungen der Trauer in Zeiten der Pandemie.Von Daniel Graf (Text) und Julia Sellmann (Bilder), 30.09.2021FolgenMerkenTeilen11 Beiträge1124 Minuten24'«Der Tod ist immer mit einem Gefühl der Ungläubigkeit verbunden»: Chimamanda Ngozi Adichie.«Notes on Grief», Notizen über die Trauer, hiess der Essay, den Chimamanda Ngozi Adichie vergangenen Herbst im «New Yorker» veröffentlichte. Es war der bislang persönlichste Text der Autorin, deren Romane in Dutzende Sprachen übersetzt sind und die mit ihren Ted-Talks «The danger of a single story» und «We should all be feminists» ein Millionen-Publikum weltweit inspiriert.In «Notes on Grief» beschrieb Adichie ihre Trauer nach dem Tod ihres Vaters. Aus dem Essay wurde ein Buch, und während die Original­ausgabe gerade für den Druck vorbereitet wurde, starb auch Adichies Mutter.Soeben ist die deutsche Ausgabe von «Notes on Grief» in der Übersetzung von Anette Grube erschienen. Der Titel lautet «Trauer ist das Glück, geliebt zu haben». Die Republik hat Chimamanda Ngozi Adichie in Düsseldorf zum Gespräch getroffen, wo sie für eine Veranstaltung mit Angela Merkel ans Schauspiel­haus gekommen war.Frau Adichie, letzten Sommer haben Sie Ihren Vater verloren, und es ist jetzt ein Jahr her, seit Sie Ihre «Notes on Grief» im «New Yorker» veröffentlicht haben. Was empfinden Sie heute, wenn Sie an Ihren Vater denken?(einige Sekunden Stille) Er fehlt mir. Er fehlt mir schrecklich.Dieses Jahr haben Sie auch Ihre Mutter verloren, am 1. März, dem Geburts­tag Ihres Vaters. Wäre das in einem Roman so gewesen, hätte man gesagt: Das ist jetzt ein wenig arg konstruiert. Aber hier war es die Realität. Fühlte es sich auch real an?Nein, es war vollkommen unwirklich. Und es fühlte sich genau so an: als befände ich mich in einem sehr schlechten Roman. Es war das eingetreten, womit ich am aller­wenigsten gerechnet hatte. Der Tod meines Vaters kam unerwartet, aber der meiner Mutter hat mich vollkommen geschockt, und ich bin fast daran zerbrochen. Es fühlte sich einfach so unwirklich an. Nicht nur, dass sie so bald nach meinem Vater stirbt. Sondern dass sie an seinem Geburtstag stirbt …Einige Wochen später posteten Sie ein Foto von sich und Ihrer Mutter auf Instagram und schrieben dazu: «How does a heart break twice?» Wenn man einen geliebten Menschen verloren hat, bereitet einen die Trauer, die man durchlitten hat, in irgendeiner Weise vor auf einen zweiten Verlust?Das ist eine wunderbare Frage. Ich glaube, nein. In praktischer Hinsicht, ja. Aber emotional: Nein. Man weiss jetzt, wie man eine Beisetzung plant, man hat ja gerade erst eine organisiert. Und du weisst jetzt, in welche Druckerei du gehst, um die Danksagungs­karten zu drucken. Aber emotional ist man in keiner Weise vorbereitet. Denn jede Trauer ist einzigartig, und die Gefühle über den Verlust meines Vaters waren andere als beim Verlust meiner Mutter.Auch wenn es womöglich bedeutet, nach dem Unsagbaren zu fragen: Können Sie den Unterschied zwischen den beiden Trauer­zuständen zu fassen versuchen?Oh, ich wüsste nicht, dass ich dazu in der Lage wäre. (überlegt einige Sekunden) Vielleicht ist das Einzige, was ich sagen kann, dass es sich fast so anfühlte, als müsse ich nun die Trauer um meinen Vater verkürzen, um auf einmal diesen neuen Schmerz anzunehmen. Doch diesen neuen Schmerz konnte ich noch gar nicht vollständig akzeptieren. Da ist also ein Gefühl des Unabgeschlossenen in beiden Fällen, aber auf ganz unterschiedliche Weise. Die eine Trauer hatte ich begonnen, aber war an kein Ende gekommen. Den anderen Verlust, scheint mir, konnte ich noch nicht einmal anerkennen. Es ist also … ja, es ist sehr seltsam.Einer der Schlüssel­sätze in Ihrem Buch über den Verlust Ihres Vaters lautet: «Trauer ist ein grausamer Unterricht.» Was waren die Lektionen, die Sie die Trauer gelehrt hat?Oh, Gott! (lacht) Wie viel Schmerz das menschliche Herz ertragen kann … Es war eine ganze Reihe von Dingen, die mich die Trauer gelehrt hat. Ich war überrascht, wie sehr sich das Trauern von dem unterschied, was ich mir, immer sehr vage, darunter vorgestellt hatte. Denn die Furcht vor dem Sterben meines Vaters hat mich schon lange begleitet. Ich habe meinen Vater so sehr verehrt, dass der Gedanke an eine Zeit in meinem Leben, wenn er nicht mehr da sein würde, für mich kaum auszuhalten war. Irgendwie hatte ich also immer schon Angst vor dem Moment, wo es passiert. Ich dachte immer, ich würde dann einfach in eine endlose Daddy-Traurigkeit verfallen. Aber als es dann tatsächlich passierte, war ich schockiert, wie viel Wut ich in mir spürte, wie sehr es ein emotionales Auf und Ab war. Wie physisch der Schmerz war. Dass sich mein Körper beim Aufwachen unendlich schwer anfühlte. Wie schwer mein Herz war und wie sehr mein Magen schmerzte. Aber genauso hat es mich überrascht, wie viel ich zusammen mit meinen Geschwistern lachen konnte. Wir lachten gemeinsam, wenn wir uns an Dinge erinnerten, die mein Vater gesagt hatte, und urplötzlich brachen wir in Weinen aus, und dann lachten wir wieder. Und ich dachte, meine Güte, das alles gehört dazu, das alles ist ein Teil davon. Auch zu lernen, dass man ein anderer Mensch wird.War das so bei Ihnen?An dem Tag, als mein Vater starb, wurde ich eine andere. Trauern bedeutet nicht nur, den eigenen Verlust zu begreifen, sondern auch die neue Person, die man geworden ist. Auch das ist eine der Lehren. Aber das Brutale an der Trauer besteht darin, dass du Träume hast, in denen du denkst, er sei noch am Leben. Das ist Teil des Trauer­prozesses, aber es ist so brutal, weil die Träume sich manchmal so real anfühlen. Nach dem Aufwachen kommt dann der markanteste Schmerz von allen, und du denkst: Mein Gott, warum? Warum lässt die Natur so was überhaupt zu? Eine weitere Lehre ist: Man beginnt viel ernsthafter nachzudenken über … Wissen Sie, ich habe Momente erlebt – und in gewisser Weise erlebe ich sie noch immer –, die zugleich fatalistisch und existenziell waren: Warum zur Hölle sind wir hier? Was hat das alles für einen Sinn? Was soll das Ganze? Dann wiederum denke ich, das Leben ist so wertvoll, man muss dankbar sein für jeden Augenblick. Und schliesslich wieder: Warum lieben wir überhaupt, wenn klar ist, dass wir irgendwann diese Liebe verlieren? All diese Fragen, auf die es keine Antworten gibt. All das ist Teil des Trauerprozesses.Sie erwähnten eben das Gefühl der Wut. Es mag vielleicht in manchen Ohren überraschend klingen, dass Trauer so eng verknüpft ist mit Wut. Können Sie das ein wenig ausführen?Als ich erfuhr, dass mein Vater gestorben ist, war meine Reaktion zuerst Ungläubigkeit und dann Zorn. Ich war dermassen wütend, und es ist interessant zu fragen, was eigentlich das Objekt meiner Wut war. Es gab Tage, da war ich auf alles wütend, auf die ganze Welt. Weil ich das Gefühl hatte, das Universum hat mir diesen verehrten Menschen weggenommen. Es gab Zeiten, da war ich wütend auf Menschen, die ich liebte, auf meine Familie oder Freunde. Und oft war ich wütend auf Menschen, die es eigentlich gut meinten. Leute, die zum Beispiel sagten: «Es tut mir leid, dass dein Vater tot ist, aber er war auch schon 88.» Das hat mich furchtbar wütend gemacht, weil ich dachte, das ist das Unsensibelste überhaupt, was du zu mir sagen kannst.Weil das Alter keine Rolle spielt?Es spielt keine Rolle! Liebe! Liebe ist es, was eine Rolle spielt. Ja, mein Vater war 88. Aber für mich bedeutete das, was passiert ist: Die Person, die der Anker meines Lebens war, ist nicht mehr da. Und wenn es dann heisst: «Mit 88 hat er ein langes Leben gehabt», dachte ich: Nein, da ist ein Loch in meinem Herzen! Und diese Wut spüre ich immer noch. Vielleicht ist sie eine Art Widerstand. Dass man bei der Bewältigung eines Verlustes versucht, ein Gleichgewicht zu finden zwischen der Akzeptanz, dass der Verlust eingetreten ist, und diesem anderen, dem widerstrebenden Teil in dir, der sagt: Nein, ich kann nicht loslassen.Sie leben das Leben einer Kosmopolitin, halten zugleich Ihre familiäre Verbindung zur Tradition der Igbo lebendig und sprechen von sich selbst als einer «zweifelnden Katholikin». Welches waren die Rituale, die Ihnen und Ihrer Familie halfen, den Schmerz zu bewältigen?Die Igbo-Tradition und der Katholizismus schliessen einander keineswegs aus, die meisten Angehörigen der Igbo sind Katholiken. Aber natürlich hat unser Katholizismus Igbo-Einflüsse. Die Bestattungs­feier für meinen Vater war sowohl katholisch als auch nach Igbo-Tradition. Wir hatten eine Messe, eine Begräbnis­messe, die ich überraschender­weise als sehr tröstlich empfand. Der Grund war sicher, dass der katholische Glaube meinem Vater so viel bedeutete, ein so wesentlicher Teil seines Lebens war. Mein Dad hatte immer seinen Rosen­kranz in der Tasche und ging jeden Sonntag zur Messe. Er liebte die katholische Kirche, sie war sinnstiftend für ihn. Deshalb war seine Begräbnis­messe für mich sehr bewegend, weil ich wusste, das war, was mein Vater gewollt hätte. Danach hatten wir eine Bestattungs­feier auf Igbo-Weise, mit viel Tanz. Denn die traditionelle Igbo-Art zu trauern besteht zu einem grossen Teil aus Tanz.Eine performativere Form als das, was wir aus der europäisch-katholischen Tradition kennen.Verglichen mit der westlich-christlichen – nicht allein katholischen – Vorstellung von feierlicher Andacht, ist die der Igbo das genaue Gegenteil. Man gibt der Trauer eine Stimme, das heisst, man singt und tanzt. Und was ich als tröstlich empfunden habe: Eine der Traditionen ist, dass bei einer verheirateten Witwe die Freunde und Bekannten des Mannes kommen, der Familie Geschenke bringen, und dann tanzt du mit ihnen und hältst ein Bild von der geliebten Person in den Händen, die du verloren hast. Und das Foto meines Vaters hochzuhalten, zu tanzen und seinen Namen zu rufen, ich fand das wunderschön. Das hätte ich nie geglaubt. Ich erinnere mich noch genau, wie ich im Vorfeld, als wir die Trauer­feier planten, einfach keine Geduld dafür hatte und nur dachte, das sei alles Unsinn. Ich dachte: Soll ich etwa eine Party schmeissen, weil gerade mein Vater gestorben ist? Denn Igbo-Begräbnisse sind im Grunde Feste. Gerade wenn ein älterer Mensch stirbt, ist die Idee, dass man dessen Leben feiert. Es ist also tatsächlich eine Party. Eine Menge Menschen kommen, und es wird erwartet, dass du dir Gedanken darüber machst, was du den Gästen anbietest und so weiter. Anfangs war ich nur genervt davon. Aber als es dann so weit war, begann ich zu begreifen, wie schön es sein kann, wenn Trauer als etwas Gemeinsames und Geteiltes angesehen wird.Können Sie beschreiben, wie die Zeremonie bei Ihnen auf Körper und Geist wirkte? Die performativere Art der Trauer hat ja vermutlich einen sehr unmittelbaren Effekt.Man fühlt sich leichter dadurch. Trauer hat eine unmittelbar körperliche Dimension, die wir als Menschen nicht leugnen sollten. Selbst­verständlich ist Trauer zutiefst emotional. Sie ist etwas Spirituelles und Mentales, aber sie ist eben auch physisch. Das sage ich als jemand, der schockiert war davon, wie körperlich das alles war. Manchmal kam ich morgens kaum aus dem Bett, und das war körperlich schwierig, nicht emotional. Ich war so schwer. Mein Gewicht war das Vierfache, und mein Herz schmerzte. Und wenn man das auf irgendeine Art über die Stimme zum Ausdruck bringt, hat es, glaube ich, eine ähnliche Funktion wie im Westen die Gesprächs­therapie. Die Trauer hörbar zu machen, heisst, du lässt es raus. Denn wir sind nicht nur geistige, sondern auch körperliche Wesen. Und ich bin sehr froh, dass wir beide Zeremonien hatten. Das wäre der Wunsch meines Vaters gewesen. Und es war auch der meiner Mutter.Ein schwieriges Thema, das Sie schon berührt haben, ist das Kondolieren. Welche Art von Beileids­bekundungen haben für Sie am ehesten Trost bedeutet?Ein einfaches «Es tut mir so leid». Je einfacher die Worte waren, desto geringer die Gefahr, dass mich etwas daran störte. (lacht) Denn Trauer macht uns auch irrational. Dass ich mich über Menschen geärgert habe oder noch immer ärgere, ist natürlich in gewisser Weise irrational, denn sie meinten es ja gut. Sie sind ja nicht gekommen, um mich wütend zu machen, aber am Ende haben sie mich zutiefst verärgert. Etwa wenn jemand sagte: «Nun, er ist tot, feiere einfach sein Leben», dachte ich nur: What the fuck? Hingegen fand ich es sehr tröstlich, wenn Leute etwas sagten wie: «Ich kann natürlich nicht ausdrücken, wie du dich fühlst, aber ich weiss, wie schwierig es für dich sein muss.» Oder eine Freundin, von der ich lange nichts gehört hatte, meinte: «Ich weiss gar nicht, was ich dir sagen soll. Als ich es erfuhr, hatte ich so Angst und fühlte mich schrecklich, weil ich weiss, was deine Eltern dir bedeuteten.» Das hat mich sehr berührt, eben weil sie selbst mit der Ungeheuerlichkeit dieser Sache zu kämpfen hatte. Menschen, die mich seit Jahren kennen, wissen, wie eng wir als Familie sind. Ich war so ein Daddy’s Girl, habe meinen Vater so sehr verehrt. Als tröstlich empfand ich es auch, wenn Menschen aufrichtig von eigenen Verlusten sprachen. Eine Frau hat mir erzählt, die Leute hätten nach dem Tod ihres Mannes zu ihr gesagt: «Oh, er ist aus dem Leben geschieden.» Und sie habe dann angefangen, sie anzuschreien: «Er ist tot, er ist tot, er ist tot!» Als sie mir das erzählte, war das für mich ein grosser Trost.Inwiefern?Für mich bedeutete ihre Reaktion einen Einspruch gegen diese Tendenz, schön­färberisch über den Tod zu sprechen, anstatt ihm ins Gesicht zu sehen. Wir sagen dann Dinge wie «Er ist unterwegs zu einem besseren Ort». Und sie sagte eben: «Nein, er ist tot!» Und als ich diese Geschichte hörte, dachte ich, es tut so gut zu wissen, dass ich nicht allein bin.«Trauer hat eine unmittelbar körperliche Dimension, die wir als Menschen nicht leugnen sollten.»Noch einmal etwas anderes ist es, über Verlust und Trauer zu schreiben. Wie fanden Sie die Form für Ihren zutiefst persönlichen Essay?Ich glaube nicht, dass ich die Form «gefunden» habe, ich habe einfach geschrieben. Ich bin ein Mensch, der sich immer dem Schreiben zugewandt hat, ich schätze, das ist einfach das, wovon ich glaube, dass ich es kann. Wenn ich glücklich bin, schreibe ich. Wenn ich traurig bin, schreibe ich. Wenn ich zweifle, schreibe ich. Manchmal schreibe ich nur für mich. Also habe ich schon, ich weiss nicht, Tage oder Wochen nach dem Tod meines Vaters, Notizen in mein Handy geschrieben. Und irgendwann, ich weiss nicht … Manchmal habe ich das Gefühl, ich schaue zurück und denke mir Dinge aus, denn ganz ehrlich, ich weiss nicht, wie bewusst ich überhaupt über Fragen von Form, Struktur und Stil nachgedacht habe. Ich habe einfach geschrieben. Selbst die Nummerierungen im Text: Ich weiss nicht mal mehr, wie es eigentlich dazu kam. (lacht)Die ursprün"
