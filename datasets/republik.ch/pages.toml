title = "AfD: Alles auf Rechtsaussen – Republik"
description = "Wie Alice Weidel die AfD radikal einte, statt sie zu mässigen."
full_description = "Habitus der Unbedingtheit: Alice Weidel bei einer Rede im August 2024.Clemens Bilan/epa/KeystoneAlles auf RechtsaussenWie Alice Weidel die AfD radikal einte, statt sie zu mässigen.Von Volker Weiss, 11.02.2025MerkenTeilen58 Beiträge5810 Minuten10'Diesen Beitrag anhören0:00 / 14:24Die Alternative für Deutschland (AfD) und ihre Kanzler­kandidatin Alice Weidel haben eines gemeinsam: Sie radikalisierten sich über die Jahre ungebremst.Als die Partei 2013 aus Protest gegen die europäische Währungs­politik von einem Kreis national­liberaler Ökonomen und CDU-Abtrünniger ins Leben gerufen wurde, war noch ungewiss, ob sie dem üblichen Schicksal deutscher Rechtsaussen-Parteien entgehen würde, in der Bedeutungslosigkeit zu verharren. Sie zeigte sich als ein merkwürdiger Hybrid aus national­liberalen und national­konservativen, christlich-fundamentalistischen sowie rechts­extremen Einflüssen. Aufgrund dieser Mischung galt die Partei als schwer berechenbar, sie sei ein «gäriger Haufen», der sich erst finden müsse, sagte der Partei­gründer und Ehren­vorsitzende Alexander Gauland einmal.Zwar verdrängten das Thema Migration und aggressive Kultur­kämpfe gegen die «links-grün-versiffte 68er-Bundes­republik» schon sehr früh das Gründungs­motiv, den Protest gegen die europäische Währungs­politik, doch konkurrierten weiter mehrere Strömungen um die Vorherrschaft innerhalb der Partei. Angesichts der Binnen­dynamik war es für Aussen­stehende nicht immer leicht, den Überblick zu behalten.Als 2015 nach heftigen Macht­kämpfen der Partei­gründer Bernd Lucke ausschied, festigte sich das rechts­populistische Profil. Als die sächsische Unternehmerin Frauke Petry, Luckes vorherige Kontrahentin, als Partei­sprecherin jedoch selbst auf einen «realpolitischen» Kurs drängte, wurde sie wiederum von noch weiter rechts stehenden Kräften aus Amt und Partei gedrängt.Dennoch gab es weiter Fragmentierungen: zwischen markt­radikalen Kräften, die den Sozial­staat beseitigen wollten, und jenen, die ihn exklusiv auf Deutsche ohne Migrations­hintergrund zuschneiden wollten; zwischen Landes­verbänden in Ost- und West­deutschland; oder zuletzt vor dem Hintergrund des Russland-Ukraine-Krieges, zwischen Putin-Anhängerinnen und «Atlantikern». Diese relative Pluralität war 2020 bereits der Grund für die behördliche Einschätzung der AfD als «in Teilen rechtsextrem», der Verfassungs­schutz fand die Gegen­kräfte damals noch relevant. In seinem Fokus stand zu dieser Zeit vor allem der sogenannte Flügel um den Thüringer AfD-Politiker Björn Höcke.Eine Spirale der RadikalisierungMittlerweile ist der «Flügel» offiziell aufgelöst, doch von anderen Strömungen ist in der Partei immer weniger zu sehen. Wo in den turbulenten Anfangs­jahren noch die Möglichkeit aufschien, der politische Alltag und die Konkurrenz unterschiedlicher Strömungen werde – ähnlich wie bei den Grünen in ihren Anfangs­jahren – die scharfen Kanten schleifen und die Partei zu Kompromissen zwingen, bietet sie jetzt nicht nur ein Bild der Geschlossenheit, sie verzichtet auch auf jede Mässigung.Im Gegenteil, je fester sie sich etablierte und je mehr sie wuchs, desto radikaler wurde sie. Und je radikaler sie wurde, umso mehr Anhängerinnen fand sie.Spätestens mit der Corona-Krise hatte die AfD die Formel für die rechts­extreme Volks­partei gefunden, deren Strömungen intern zwar noch existieren, sich aber erfolgreich miteinander arrangiert haben. Es lässt sich eben gut getrennt marschieren, wenn man gemeinsam schlagen kann.In diesem Einigungs­prozess spielte ausgerechnet eine Frau eine Schlüssel­rolle, von der etwas ganz anderes erwartet worden war: Alice Weidel. Die bis damals unbekannte Unternehmens­beraterin war zunächst aus Ablehnung der europäischen Währungs­politik 2013 zur gerade gegründeten AfD gestossen.Die Motivation passte zu ihrem beruflichen Werde­gang in der freien Wirtschaft und sie galt schnell als beispielhafte Vertreterin des national­liberalen Lagers um Bernd Lucke. Porträts beschrieben sie damals als Gegengewicht zu den lautstarken Rechts­extremen, die in der Partei von Beginn an für Unruhe sorgten. Aufgrund ihrer beruflichen Erfahrung in China mitsamt Mandarin-Sprach­kenntnissen und einem Schweizer Wohnort galt Weidel insbesondere konservativen Medien als weltgewandte Versicherung gegen den provinziellen Muff, der deutschen Rechtsaussen­strömungen immer anhaftete.Als dann noch publik wurde, dass sie mit einer in Sri Lanka geborenen Frau verheiratet ist, wollten viele glauben, dass sie die Dämonen des Rechts­extremismus in der Partei bannen könnte. Zwar waren früh Mails von ihr in rechts­extremem Jargon aufgetaucht, und sie pflegte selbst auch öffentlich eine scharfe Rhetorik, doch der Newcomerin wurde etwa im «Manager Magazin» trotzdem seriöses und professionelles Auftreten attestiert.Die Reihen schliessen sichWeidels Aufstieg begann 2017 als Vorsitzende der AfD-Fraktion im Deutschen Bundestag. Sie teilte sich den Posten mit dem ehemaligen CDU-Funktionär Alexander Gauland, der sich bereits als sehr findig darin erwiesen hatte, rechts­extremes Personal und Inhalte in der Partei zu verankern. Tatsächlich geriet Weidel anfangs noch mit Vertretern des völkischen Partei­flügels in Konflikt. So sprach sie sich zunächst für einen Partei­ausschluss Björn Höckes aus, ehe sie die tragende Rolle dieser Kreise für die AfD akzeptierte. Danach handelte sie getreu dem Motto «If you can‘t beat them, join them» und söhnte sich mit Höcke und seiner Gefolgschaft öffentlich aus.Heute hat die Mittvierzigerin gemeinsam mit dem ostdeutschen Maler­meister Tino Chrupalla den Partei­vorsitz inne. Doch während Chrupalla stets etwas passiv und latent beleidigt wirkte und wenig Führungs­stärke ausstrahlte, etablierte Weidel einen schneidenden Stil. Den Vorwurf mangelnder Basisnähe glich sie mit offensiver Aggressivität aus. Meist wird ihr das Attribut «bürgerlich» zugeordnet, wer sie reden hört, wird jedoch Zeugin einer sehr rohen Bürgerlichkeit. In ihrer Partei fand gerade diese Kombination aus Business­look und ideologischer Härte mit der Zeit bei allen Unterströmungen Zustimmung. Ihre Leistung bestand also nicht darin, besonders virtuos mit den Widersprüchen der AfD zu jonglieren, sondern die Partei zu ordnen.Wie fest sich die Reihen mittlerweile hinter Weidel geschlossen haben, zeigte sich im Januar auf dem AfD-Parteitag im sächsischen Riesa. Sie wurde dort per Akklamation zur AfD-Kanzler­kandidatin gekürt und liess sich mit «Alice für Deutschland»-Rufen feiern. Die Partei hatte extra Papp­herzen mit diesem Slogan drucken lassen. Der Spruch ist ein typisches AfD-Statement, denn er erinnert klanglich an eine verbotene SA-Parole, für deren Verwendung der ehemalige Geschichts­lehrer Björn Höcke im letzten Jahr verurteilt wurde.Weidel selbst hatte zuvor im Online-Talk mit US-Tech-Milliardär Elon Musk, der die Partei mittlerweile öffentlich unterstützt, eine geschichts­revisionistische Provokation lanciert, indem sie behauptete, Hitler sei «Kommunist» gewesen. In ihrer Parteitags­rede brachte sie wiederum genüsslich das Vokabular der extremen Rechten zur Geltung. In dieser Praxis hat sie längst Routine, ob «Umerziehung», «Schuldkult», «Kultur­marxismus» oder die angebliche Missachtung deutscher Opfer des Krieges: Weidel hat in den letzten Jahren kaum einen Topos rechts­extremer Geschichts­politik ausgelassen.Rechtsaussen wird zur «Mitte»Von Berührungsängsten oder gar Distanzierungen gegenüber dem völkisch-nationalistischen Milieu der Partei fehlt bei der Spitzen­kandidatin also jede Spur. Sie personifiziert längst die AfD-typische Mischung der Extreme, sei es in wirtschafts-, migrations- oder geschichts­politischen Fragen.Grosse Überwindung scheint diese Entwicklung weder sie noch ihre Partei gekostet zu haben. Es hatte sich schon früh gezeigt, dass kaum jemand in der AfD ein tatsächliches Interesse an der Mässigung der Ultra­rechten hatte.Im Gegenteil, die national­konservativen, fundamental­christlichen und markt­radikalen Unterströme arbeiteten bei der Radikalisierung Hand in Hand mit dem völkischen Rand. Als Konrad Adam, konservativer Journalist und Exponent der AfD-Gründungs­generation, Ende 2020 aufgrund des zunehmenden Einflusses der extremen Rechten resigniert aus der Partei austrat, fasste er das Zusammen­spiel der sogenannten bürgerlichen und der radikalen Kräfte mit Blick auf den damals in der Partei aufgestiegenen, lange Jahre bis in die Neonazi-Szene vernetzten Andreas Kalbitz in ein passendes Bild: «Während Gauland auf dem Balkon stand und die Annehmlichkeiten des englischen Land­lebens pries, versorgte Kalbitz im Souterrain die Hunde.» Gauland fand auch die bis heute angewandte Lösung, rechts­aussen einfach zur «Mitte» zu erklären. Damit war das neue «Normal» geschaffen, mit dem die AfD dann auf ihren Plakaten warb.Dafür steht auch Weidel. Während Akteure wie Lucke, Adam und auch der Wirtschafts­professor Jörg Meuthen irgendwann das Handtuch warfen, war sie geblieben. Sie harmonierte vielleicht nicht mit den völkischen Kräften und deren Basis in der ostdeutschen Provinz, stellte sich aber auch nicht gegen sie und verwendete ohne Zögern deren Begriffe. Schliesslich ist die Partei mittlerweile in einigen Gemeinden und Kommunen so fest verankert, dass es ohne «Volksnähe» und Stamm­tische nicht gehen wird, mit denen Weidel bis heute fremdelt. Höcke hat im Gegenzug als Führer des ultra­rechten Flügels verstanden, dass er es kaum aus seinem Bundes­land Thüringen nach Berlin schaffen wird. So kommt man sich nicht mehr in die Quere und bedient gemeinsam seine Klientel.Mediale UnterstützungWirklich unter Druck geraten ist Weidel bislang nur durch eine Spenden­affäre. Nachdem in verschleierten und somit illegalen Spenden mehr als 130’000 Euro über die Konten zweier Schweizer Pharma­unternehmen geflossen waren, wurde die AfD schliesslich 2023 zu einer Straf­zahlung verurteilt. Aktuell hat Weidel wieder ausländische Zuwendungen erhalten, diesmal korrekt deklariert aus Österreich. Der ehemalige Vorarlberger FPÖ-Landesgeschäftsführer Gerhard Dingler finanziert Wahl­plakate im Wert von über 2,3 Millionen Euro, angesichts der Vorbildfunktion der öster­reichischen Rechtspartei für die AfD eine passende Geste. Doch letztlich hat ihr auch das bisher nicht geschadet, vielmehr weht inzwischen aus dem Springer-Verlag ein günstiger Wind für sie.Nachdem Konzern­chef Mathias Döpfner bereits Elon Musk die Möglichkeit gegeben hatte, warme Worte über die AfD zu publizieren, wird auch Weidel von den Springer-Medien zunehmend in einem wohlwollenden Licht betrachtet. Hier gilt sie nach wie vor als Exponentin des «bürgerlichen» Teils der AfD. Die Hilfe von Figuren wie Musk und Döpfner wird in der AfD gerne angenommen, obwohl die Partei in der Vergangenheit auch gegen Milliardäre als verkappte «Sozialisten» agitierte. Allerdings galt der Vorwurf nur den liberalen Vertreterinnen dieser Gruppe, Oligarchen des eigenen Lagers sind stets willkommen.Für diese Sphäre ist vor allem Weidels Glaube an das «agonale Prinzip» attraktiv, an den Wettbewerb der High Performer, zu denen sie sich zweifellos selbst zählt. «Der Leistungs­gedanke war immer da», liess sie sich kürzlich in einer freundlichen Homestory der NZZ zitieren. Eine Woche später servierte Springers «Bild»-Zeitung ihrem Publikum eine auf die Kern­aussagen reduzierte Fassung der Geschichte.Weidels Leistungs­denken bildet auch eine stabile Brücke zum völkischen Lager, wo es sich vor allem gegen «fremde» Nutzniesserinnen des Sozial­systems richtet. Trotz aller Übernahmen der rechten Rede spart Weidel allerdings bislang die soziale Rhetorik nach Vorbild der NS-Volks­gemeinschaft aus, die bei Höcke und Co. so geschätzt wird. Während Teile der Basis sich von der AfD die Rekonstruktion eines schützenden National­staats erhoffen, orientiert Weidel sich am gegenteiligen Prinzip der «Disruption». Ihre Vorbilder heissen Thatcher, Hayek und Milei, von ihrer Herab­lassung und offensiven Kälte werden auch die Bedürftigen einer autochthonen Unter­schicht nicht verschont bleiben. Doch mit dem Kurs gegen die Migration und für Massen­abschiebungen lassen sich solche Wider­sprüche vorerst überdecken.Zugleich steht Weidel für einen europäischen Trend, denn die Modernisierung des rechten Randes geht mit einer Verweiblichung der Führungs­spitzen einher. Georgia Meloni in Italien und Marine Le Pen in Frankreich haben vorgemacht, wie erfolgreich Parteien der extremen Rechten sein können, wenn sie von Frauen geführt werden.Allerdings gibt es einen bemerkenswerten Unterschied. Denn während Meloni und Le Pen bemüht sind, ihren Parteien einen zivilisierteren Anstrich zu geben und den Eindruck der Domestizierung vermitteln, bewegte sich Weidel in die umgekehrte Richtung. «Melonisierung» gilt in der äussersten deutschen Rechten als Gefahr, nicht als Vorbild. Doch ist dieser Weg von Alice Weidel kaum zu erwarten, da sie die Erfahrung gemacht hat, nur mit dem Habitus der Unbedingtheit voran­zukommen. Die Rolle der Bändigerin hat sie gerade nicht gespielt. Statt als wirtschafts­liberales Gegen­gewicht die Kräfte der extremen Rechten an den Rand zu drängen, passte Weidel sich ihnen an. Am Ende schuf sie die Synthese, mit der in der AfD alle leben können.Zum AutorVolker Weiss ist Historiker und forscht zu Geschichte und Gegenwart der extremen Rechten. Derzeit schreibt er vor allem für die «Süddeutsche Zeitung». Gerade erschien sein Buch «Das Deutsche Demokratische Reich» über die Geschichts­politik der extremen Rechten vor dem Hintergrund des russischen Krieges gegen die Ukraine."
