title = "Friedrich Merz – der, der übrig blieb – Republik"
description = "Wie der wahrscheinlich nächste Kanzler Deutschland in Schock versetzte. Und warum das nicht überrascht."
full_description = "Friedrich Merz – der, der übrig bliebWie der wahrscheinlich nächste Kanzler Deutschland in Schock versetzte. Und warum das nicht überrascht.Von Angelika Hardegger (Text) und Andrea Ventura (Illustration), 08.02.2025FolgenMerkenTeilen52 Beiträge5212 Minuten12'Diesen Beitrag anhören0:00 / 17:24Friedrich Merz sah im Bundestag aus, als würde er trotzig im Stuhl versinken, als er den «unverzeihlichen Fehler» beging. Er wurde gewarnt, er gehe in die Geschichte ein, man meinte: als tragische Figur. Journalisten im Bundestag würden von den Geschehnissen mit einem «Gefühl von Zeitzeugen­schaft» berichten. Sie waren schon auf Sendung, als sie selber noch sortierten, wie schlimm das alles war.Was hatte Friedrich Merz getan?!Montag vor einer Woche war Friedrich Merz fast sicher der nächste Kanzler Deutschlands gewesen. Am Freitag schien er das nur noch vielleicht. Dazwischen brach Friedrich Merz ein Tabu, das in Deutschland seit der Nachkriegs­zeit gilt. Und: Er brach sein eigenes Wort.Noch vor acht Wochen hatte Merz im Bundestag «ausdrücklich» darauf bestanden: Die demokratischen Parteien dürften keinesfalls riskieren, dass auch nur «ein einziges Mal» eine «Mehrheit mit denen da von der AfD zustande kommt». Jetzt führte Merz selbst so eine Mehrheit herbei. «Sehenden Auges», urteilte Angela Merkel.Merz liess zu, dass die AfD im Bundestag einem Vorstoss gegen Migration die Mehrheit verschaffte. Ungarns Minister­präsident Viktor Orbán frohlockte auf der Plattform X: «Guten Morgen, Deutschland! Welcome to the club.»Es waren verrückte Tage.Ein Holocaust-Überlebender kündigte an, er gebe sein Bundesverdienst­kreuz zurück. Ein prominentes CDU-Mitglied jüdischen Glaubens trat aus der Partei aus – nach mehr als 40 Jahren. Am Samstag protestierten Zehntausende gegen Merz und seine CDU. Am Sonntag waren es schon Hundert­tausende. Die halbe Republik war in Aufruhr ob der Frage: War dies der wahre, der echte Friedrich Merz?Wie könnte so einer Kanzler sein?Überhaupt ist es sehr schwierig, Friedrich Merz zu ergründen. Denn so seltsam das klingt: Er tritt in seinen eigenen Biografien bloss als Nebenfigur auf. Über 800 Seiten wurden kürzlich erst gedruckt. Drei Bücher, die versprechen, den «Mythos Merz» zu entnebeln: Wo kommt er her? Was treibt ihn an? Doch die meiste Zeit erzählen die Bücher von Angela Merkel.Auch über Markus Söder erfährt man viel, den Chef der Schwester­partei CSU. Dazu seitenweise Auftritte von anderem Personal der Union, zum Ende hin auch: Ampelkoalition und AfD.Friedrich Merz’ Karriere, das versteht man irgendwann, war eine Karriere im Umkehrschluss. Er war nicht die anderen.Nicht Angela MerkelMerz war der «Merkel-Rivale», ihr Widersacher, Antipode, und das kam so:Vor 25 Jahren sass Friedrich Merz im Vorsitz der CDU. Angela Merkel war Vorsitzende der Partei. Und beide wollten Kanzler werden.Merz war 44 Jahre alt, die CDU in der Opposition. Sie war sein Ding. Schon in der Schule war Friedrich Merz derart aufmüpfig gewesen, dass er irgendwann flog. Als Politiker sah er den Sinn nicht in der Einigkeit, sondern in der Debatte, im Streit. Er war viel wert­konservativer als Merkel. Zum Beispiel schlug er vor, sich über «Leitkultur» zu unterhalten oder Asyl­bewerberinnen politische Aktivitäten zu verbieten. Als der «Spiegel» im Jahr 2000 auf der Titelseite fragte: «Was bedeutet es heute, konservativ zu sein?», schaute Angela Merkel nach links und Friedrich Merz nach rechts.So würde das immer bleiben.Im Jahr 2002 sah Merkel die Zeit gekommen für eine Klärung der Frage, wer Chef sei in der CDU. Sie entzog ihm den Fraktions­vorsitz und vereinte beide Funktionen bei sich. Friedrich Merz, erzählt sie in ihren Memoiren sachlich, war «tief getroffen».Er hätte sich Merkel unterordnen können. Wäre vielleicht Minister geworden in ihrem Kabinett. Doch Merz war ein Politiker des «Alles oder nichts», schrieb in jenen Jahren ein Journalist. Ein Freund aus frühen politischen Tagen sagte im Artikel: «War Friedrich dabei, gingen wir in der Regel im grossen Streit auseinander. Er war schonungslos rigoros.» Der Journalist beschrieb Merz als Talent, das alles mitbrachte für die Politik: Mut, Selbst­bewusstsein, Rede­gewandtheit, Konsequenz. Aber von allem auch zu viel.Merz gab die Posten in der Partei auf. Im Jahr 2009 zog er sich auch aus dem Bundestag zurück. In der Konsens­maschine CDU waren viele froh, als er ging. Er war eine inner­parteiliche Opposition geworden, ein ständiger Störer. Er warf Merkel vor, sie ziehe die Partei zu weit nach links.Merz nahm ein lukratives Angebot einer US-Wirtschafts­kanzlei an. Daneben war er Verwaltungs­rat von Beruf, am umstrittensten beim Finanz­giganten Blackrock. Ein Vermögen machte Friedrich Merz in der Schweiz: Als die Firma Stadler Rail des SVP-Unternehmers Peter Spuhler vor einigen Jahren an die Börse ging, war Merz Verwaltungs­rat. Er wurde in Aktien­depots entlöhnt und über Nacht zum mehrfachen Millionär.Das Wirtschaftsmilieu ermunterte ihn, erneut einzusteigen in die Politik. «Man traf sich zum Grillen im Garten oder auch auf dem nächstgelegenen Golfplatz, immer wieder kam das Gespräch auf das Thema», schreibt ein Biograf von Merz. Zwischen Golf und Tennis brauchte Merz nie mehr zu sein als nicht Angela Merkel.Nicht ihr Ausstieg aus der Atomkraft. Nicht ihr Staats­defizit. Nicht ihre Migrations­politik.Der Wirtschaftsrat der CDU räumte Merz sofort ein Büro und einen Sprecher frei, als Merkel im Jahr 2018 ankündigte, sie ziehe sich zurück. «Innerhalb von Minuten» hatte Merz durchgestochen, er stehe zur Verfügung für den Parteivorsitz. Er wurde der Kandidat des konservativen Flügels. Dort betrachtete man die CDU nach 16 Jahren Merkel als programmatisch entleert. Der liberale Flügel hingegen, die Merkel-CDU, erinnerte im Richtungs­kampf an Merz’ alte Schwächen: Ob er die nötige Geduld haben würde, die Selbst­kontrolle für den Posten als Chef?Merz verlor die Wahl um den Parteivorsitz im ersten Anlauf. Er verlor sie auch im zweiten.Erst nach dem Wahldebakel der Union von 2021, dem Jahr, als Angela Merkel ging, liess die CDU Friedrich Merz an ihre Spitze vor. Unter Armin Laschet, einem Merkel-Erben, war die Union um 8,5 Prozent­punkte eingebrochen. Das war das schlechteste Ergebnis in der Partei­geschichte. Und Friedrich Merz? Er war der, der übrig blieb.Nicht die AmpelMerkel hatte in 16 Jahren Kanzlerschaft höchstens eine Handvoll Sätze gesagt, die haften blieben. Merz sagte in eineinhalb Jahren so viele, dass CDU-intern gefragt wurde: Muss er wieder weg?Er warf Geflüchteten aus der Ukraine «Sozial­tourismus» vor. Nannte Grund­schüler mit Migrations­hintergrund «kleine Paschas». Er fantasierte auf Sendung, Flüchtlinge nähmen Deutschen die Termine beim Zahnarzt weg. Er liess das Rot im Schriftzug der CDU durch die Farbe Schwarz ersetzen. «Schwarz ist verbindlich für alle», erklärte Merz’ General­sekretär. Der Begriff «Leitkultur» kam im Partei­programm nun prominent vor. Asylverfahren: auslagern in Drittstaaten. Atomkraft: vielleicht wieder zurück. Bürgergeld und Heizgesetz, die unter der Ampelregierung eingeführt wurden: rückgängig machen.Unter Merz wurde die CDU die CDU der 90er-Jahre. Sie schien so vorbei wie der Parteichef selbst.Friedrich Merz schnäuzt sich die Nase mit Stoff­tüchern, lässt seine Initialen in Anzüge sticken und betrachtet die Rasur als Frage des Respekts. Er hat eine Freude am Fliegen, dass man meint, die Technologie sei gerade erst erfunden worden. Sein grosses Karriere­glück war, dass die Jüngeren versagten.Die Ampelregierung – als «Fortschritts­koalition» gestartet, verkündet per Selfie – schien bald nur noch pubertär. Als die Koalition vergangenen Herbst implodierte, war die deutsche Wirtschaft das zweite Jahr in Folge in Rezession. 82 Prozent der Menschen stimmten zu, der Staat müsse die Zuwanderung einschränken. Darunter 3 von 4 Wählerinnen der SPD. Und eine Mehrheit von den Grünen.Joachim-Friedrich Martin Josef Merz, der Boomer aus der CDU, blieb übrig.Er brauchte bloss zu sagen: «Das hört jetzt auf.»Überbordende Bürokratie? «Das hört jetzt auf.»Energiepolitik allein mit Sonne, Wind und Wasser? «Das kann so nicht weitergehen.»Mit Work-Life-Balance und Viertagewoche aus der Wirtschaftskrise? «Damit geht es nicht.»Er versprach, es anders zu machen. Er war die Alternative der ernsthaften Art.Nicht Markus SöderEr war nicht die Discokugel der deutschen Politik – nicht Markus Söder, der auch gern Kanzler­kandidat wäre. Der CSU-Chef war in Umfragen immer beliebter als Merz. Aber Söder umarmt am einen Tag Bäume und am nächsten hasst er die Grünen. Er hält im Grunde keine Reden mehr, er amtet vollberuflich als Entertainer. (Den «unverzeihlichen Fehler», den Merz beging, nannte Söder einen «steilen Move».)Söder ist ein Menschen­fänger, man könnte auch sagen: ein Populist. Anders als Friedrich Merz. Der, schrieb die «Süddeutsche Zeitung» fast gerührt, glaubt noch immer, er beeinflusse mit einem Kommentar in der FAZ die politische Debatte. Ein ehemaliger CSU-Chef sagt in jenem Artikel über Merz: «Er hat die Ernsthaftigkeit, die die Zeit verlangt.»Nicht die AfDFriedrich Merz ist tief überzeugter Europäer. Er macht sogar Wahlkampf mit der Klage, Robert Habeck schwänze Sitzungen im europäischen Binnen­ministerrat.Er nennt Robert Habeck einen «Sonnyboy».Nein, das hört jetzt auf.«Regelmässig persönlich präsent» werde sein Kabinett in Brüssel sein.Die Nato? Westbindung? Die Merz-Biografin Mariam Lau sagt: «Damit wacht er nachts um drei auf.» Zehn Jahre lang sass Merz der Atlantik­brücke vor, einem Netzwerk, das einflussreiche Persönlichkeiten aus der Bundes­republik um die trans­atlantischen Beziehungen vereint. Er wiederholt sehr oft, wie sehr die AfD gegen alles steht, was er an der Bundes­republik konservieren will. Freiheit. Sicherheit. Europa. Die liberale westliche Demokratie.Es heisst, er grüsse Alice Weidel nicht. Nicht einmal, wenn sie im Bundestag zusammen im Aufzug stünden.Die linksliberale «Zeit» fragte Anfang Jahr vorsichtig: Könnte er jener Konservative sein, den das Land nun braucht?Merz sagte doch am Fernsehen: «Einmal ’33 in Deutschland reicht.» Als in Österreich die konservative Traditions­partei ÖVP einbrach und tat, was sie so einen Wahlkampf lang versprochen hatte, nicht zu tun, nämlich mit Rechts­extremen zu koalieren? Merz stand glaubhaft drüber. «Wenn man sich eine solche Natter an den Hals holt», sagte er, «dann wird man von dieser Natter erwürgt.»«Ich wiederhole es hier zum Mitschreiben», wiederholte er: «Eine Zusammen­arbeit unter meiner Führung wird es mit der CDU in Deutschland nicht geben.»Er klang so staatsmännisch. So nicht wie die AfD.Aber dann wurde in Aschaffenburg ein zweijähriger Bub von einem ausreise­pflichtigen Afghanen erstochen. Und Friedrich Merz war wieder alles oder nichts. Und schonungslos rigoros.Merz und die CDU hatten bis dahin Wirtschafts­wahlkampf gemacht. Die CDU lag in den Umfragen stabil bei 30 Prozent, die AfD bei 20. Was Merz’ Umfeld nervös machte: Die Kurve der CDU zeigte nach unten, jene der AfD nach oben. Der «Spiegel» und der «Stern» haben die CDU-internen Ereignisse rekonstruiert.In der CDU setzte sich die Lesart durch, der Haupt­gegner sei nicht länger die SPD, sondern die AfD. Merz, der sieben Enkel hat, sei sehr betroffen gewesen von der Tat. Seinem engsten Umfeld, das allein aus Männern besteht, hatte zudem imponiert, wie Donald Trump am ersten Tag im Amt mit einem schwarzen Filzstift Executive Order um Executive Order signierte. Das war am Tag, bevor der Bub in Aschaffenburg erstochen wurde.So was brauchte die CDU jetzt, oder nicht?Merz kündigte im Bundestag vor Journalisten an, er werde im Fall seiner Wahl «am ersten Tag» Anweisung geben, die Grenzen zu schliessen. Wem gültige Einreise­papiere fehlten, komme nicht mehr rein. Das gelte «ausdrücklich auch für Personen mit Schutz­anspruch», sagte er. Merz kündigte weiter Haft an für Personen, die ausreise­pflichtig sind. Tägliche Abschiebungen. Auch das Aufenthalts­recht für Straftäter und Gefährder werde verschärft.Zu diesem Zeitpunkt schaute die SPD noch neidisch zur CDU. Ein guter Auftritt von Merz, befand man. Er wirkte wie der junge Friedrich Merz: mutig, selbstbewusst, redegewandt, konsequent.Aber dann wurde er wieder von allem viel zu viel.Er kündigte an, die Union werde in der Folge­woche Anträge in den Bundestag einbringen – «unabhängig davon, wer ihnen zustimmt».Er verschickte die Anträge an Grüne, Sozial­demokraten und FDP. So, als glaubte er wirklich, er könnte die Parteien für ein Einreise­verbot gewinnen. Merz liess in die Anträge schreiben, die AfD bringe Verschwörungs­theorien in Umlauf, schüre Fremden­feindlichkeit und gefährde Deutschlands Sicherheit, Stabilität und Wohlstand. In der naiven Hoffnung, die AfD stimme dieser Sätze wegen nicht zu.So mündete das Manöver von Friedrich Merz in eine Woche, die wurde wie ein Schlund. «Sündenfall», «Tor zur Hölle», «neue Epoche», sagten andere. Und Friedrich Merz? Er sagte seiner CDU laut dem «Stern» irgendwann: «Wer in ein Wespen­nest sticht, muss richtig zugreifen.»Ein irres Zitat.Eine höchst unvernünftige Strategie. (Schlimmsten­falls tödlich.)Ein wahrer Merz.Jetzt fragt sich Deutschland, was wird, wenn Friedrich Merz trotzdem Kanzler wird. Und: mit wem? Mit den Grünen, die ihm den «Sündenfall» vorwarfen? Mit der SPD, der zufolge er «das Tor zur Hölle» geöffnet hat? Koaliert er sicher nicht mit der AfD, die eine «neue Epoche» gekommen sieht?Merz’ bekräftigt das, er sagt: «Wir arbeiten nicht mit einer Partei zusammen, die rauswill aus der Nato, rauswill aus dem Euro und rauswill aus der EU.» Offen ist, wie viele ihm noch glauben.Diesem Friedrich Merz, der derjenige war, der übrig blieb. Sogar in seiner eigenen Biografie.Das muss man bedenken, bei aller Sorge und Empörung über Merz: Wie es kam, oder eher: kommen konnte, dass Merz überhaupt der Kanzler in spe wurde. Derjenige, der ein Land führen würde, in dem 20 Prozent der Menschen für die AfD gestimmt haben. Derjenige, an dem «es» nun anscheinend hing. Das Land. Europa. Das Fortbestehen der Demokratie.Friedrich Merz war nicht die erste Wahl der CDU. Auch nicht die zweite, nicht die dritte, sondern erst die vierte. Er war eine politische Karriere lang nicht die anderen gewesen. Nicht Merkel, die versprach: «Wir schaffen das.» Nicht die Ampel, unter der sich die Wählerschaft der AfD verdoppelte.Merz’ Biograf Volker Resing schreibt: «Einer wie Friedrich Merz wird nicht bei Schönwetter Kanzler.» Wurde Merz schöner geredet, als er war? Ja. Vielleicht aus Verzweiflung über das eigene Scheitern."
