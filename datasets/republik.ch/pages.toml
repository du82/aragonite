["https://www.republik.ch/2025/03/04/vier-frauenleben-ein-ganzer-kosmos"]
title = "Vier Frauenleben, ein ganzer Kosmos – Republik"
description = "Erfüllt der neue Roman «Dream Count» von Welt­literatin und Feministin Chimamanda Ngozi Adichie die hohen Erwartungen?"
full_description = "Vier Frauenleben, ein ganzer KosmosNach zwölf Jahren veröffentlicht die Welt­literatin und Feministin Chimamanda Ngozi Adichie wieder einen Roman, der am Dienstag gleichzeitig im Original und in deutscher Übersetzung erscheint. Erfüllt das Buch die hohen Erwartungen?Von Daniel Graf, 04.03.2025FolgenMerkenTeilen8 Beiträge812 Minuten12'Diesen Beitrag anhören0:00 / 18:03Eine der wichtigsten Identifikations­figuren der «Black Pride»: Chimamanda Ngozi Adichie. Julia SellmannMan kann sicher ohne Über­treibung sagen: Dieser Roman ist einer der meist­erwarteten der letzten Zeit.Seit die nigerianisch-amerikanische Schrift­stellerin Chimamanda Ngozi Adichie mit ihrem letzten Roman «Americanah» einen Welt­erfolg gelandet hat, sind zwölf Jahre vergangen, vor zehn Jahren erschien die deutsche Übersetzung.An diesem Dienstag kommt nun «Dream Count» weltweit in den Handel, Adichies neuer, von ihren Fans seit Jahren ersehnter Roman, der auf Deutsch denselben Titel trägt wie das zeitgleich auf Englisch erscheinende Original.So viel vorweg: «Dream Count» schliesst mit seinen 530 Seiten nicht nur im Umfang an den Vorgänger­roman an. Sondern auch mit all dem, was Adichies Schreiben auszeichnet: das Leben ihrer Charaktere zwischen den Kontinenten und Kulturen, das Bewusstsein für die politische Dimension von Lebens­welten, die Verbindung aus Komplexität und feder­leichter Lesbarkeit. Nur bei wenigen Büchern ist der Begriff «kosmo­politisch» so sehr am Platz wie in Adichies Literatur.Nun ist es nicht so, als hätte Adichie zwischen dem Erscheinen von «Americanah» und heute einfach «nur» am nächsten grossen Roman geschrieben.Mit ihrem TED-Talk «We Should All Be Feminists», der 2014 als Buch herauskam, hat sie dem Feminismus einen enormen pop­kulturellen Schub verliehen. Spätestens ab da prägte ihre Rolle als inter­nationale Botschafterin für Frauenrechte und eine der wichtigsten Identifikations­figuren der Black Pride ebenso stark die öffentliche Wahrnehmung wie ihre Arbeit als Schriftstellerin.Ausgehend von einem Facebook-Post entstand das Buch «Liebe Ijeawele …», ein Manifest in 15 Ratschlägen zur feministischen Erziehung. Während der Pandemie verlor Adichie innerhalb kurzer Zeit beide Eltern: zuerst ihren Vater, dessen Verlust sie in dem schmalen, grossen Buch «Trauer ist das Glück, geliebt zu haben» (2021) verarbeitete. Es war gerade erst im Druck, da starb auch ihre Mutter, just am 1. März, dem Geburtstag des Vaters. Eine Pointe wie aus einem Groschenheft – und genau so, «als befände ich mich in einem sehr schlechten Roman», habe sie sich auch gefühlt, erzählte sie 2021 im Gespräch mit der Republik.Dann ist da noch etwas, was bei Schrift­stellerinnen allzu oft übersehen wird, wenn die Öffentlichkeit nur auf Bücher und Erscheinungs­daten schaut: Adichie ist im letzten Jahrzehnt dreifache Mutter geworden. Mutter zu werden, sei ein grosses Geschenk, sagte sie 2023 dem Radiosender BBC 4 mit Blick auf ihre heute neunjährige Tochter und fügte hinzu: doch hätte sie andern­falls in dieser Zeit wohl zwei Romane geschrieben. Inzwischen sind Adichie und ihr Mann auch Eltern von zwei nun knapp einjährigen Söhnen, Zwillingen. Nicht nur in der Welt da draussen ist seit «Americanah» sehr viel passiert.Ein weltumspannendes EposUnd nun ist er eben doch da, der neue Roman, die Gattung, die der Autorin bei aller Affinität zu den kleineren Formen noch immer unbestritten die wichtigste ist.Chimamanda Ngozi Adichie hat «Dream Count» ihrer Mutter gewidmet. Das Buch erzählt von vier miteinander verbundenen Frauen­leben, von ihren Sehn­süchten und ihrem Kampf um Selbst­bestimmung. Es ist eine Art erweiterter Familien­roman und dabei zugleich ein welt­umspannendes Epos, bei dem es auch auf den Lese­prozess selbst ankommt; darauf, wie sich die Geschichten nach und nach entfalten.Es beginnt mit einer Szenerie, fast exakt so, wie Adichie sie in ihrem auto­biografischen Trauer-Buch beschrieben hat: Die Mitglieder einer nigerianischen Igbo-Familie, die inzwischen über verschiedene Kontinente verstreut sind, versammeln sich regelmässig auf Zoom, weil die Pandemie jede persönliche Begegnung verunmöglicht.Erzählt wird hier aus der Ich-Perspektive der Tochter, der Reise­schriftstellerin Chiamaka, die von Freunden und Familie nur Chia genannt wird. Und weil sie mit der Autorin etwa das Schreiben, das Alter, das Leben zwischen Nigeria und den USA und überhaupt das viele Unterwegs­sein gemeinsam hat, wirkt der Text anfangs fast wie eine verfremdete Autofiktion, ehe Adichie diese Lesart wieder elegant durchkreuzt. Auch der Blick­winkel verschiebt sich bald: weg von der Familien­gegenwart während der Pandemie hin zur bewegten Lebens- und Liebes­geschichte von Chia, die zwischen ihren romantischen Liebes­idealen, der Wirkmacht patriarchaler Strukturen und den Unvereinbarkeiten verschiedener Liebes­konzepte zu navigieren versucht.Dann wechselt die Erzähl­stimme, und nach und nach rücken die anderen drei Protagonistinnen, die allesamt schon im ersten Teil auftauchen, in den Fokus: Da ist Zikora, Chias beste Freundin, auch sie aus einer Igbo-Familie stammend und in die USA ausgewandert, wo sie als Anwältin in Washington D. C. arbeitet.Da ist Omelogor, Chias Cousine, die mit ihrer intellektuellen Brillanz, ihrer rhetorischen Schärfe und ihrem selbst­bewussten Auftreten immer das leuchtende Vorbild von Chia war und zugleich zur grossen Rivalin Zikoras wurde – und die in ihrem Studentinnen­leben in den USA plötzlich in eine tiefe Lebens­krise gerät. Und da ist Kadiatou, die aus Guinea in die Vereinigten Staaten kam, mit ebenso grossen Hoffnungen, doch mit einer völlig anderen finanziellen Ausgangs­lage als Chia, die schon zu Studien­zeiten über Personal verfügt, wie sie es von zu Hause kennt, wo die Familie eine ganze Entourage an Bediensteten hat. Kadiatou arbeitet als Chias Haushalts­hilfe und als Reinigungs­kraft in einem Luxushotel, wo sie Opfer sexualisierter Gewalt durch einen prominenten Gast werden wird.Adichie erzählt diese vier ganz unter­schiedlichen und doch von grossen gemeinsamen Fragen bestimmten Lebens­geschichten immer zugleich mit einer individuellen und einer allgemein­gültigen Perspektive.Alles in diesem Roman ist durchdrungen von den Gross­themen class, race und gender und den komplexen Wechsel­wirkungen zwischen ihnen, aber alles Theoretische ist hier in konkrete Geschichten übersetzt. Erst wenn man ein wenig hilflos versucht, die Fülle an Themen zu benennen, die dieses Buch weniger versammelt als vielmehr enthält, weil sie in der Realität ja immer schon aufs Engste miteinander verwoben sind, dann ist umso frappierender, wie leicht sich dieses von grossen Gegenwarts­diskursen angefüllte Buch lesen lässt.Die Männer sind alle zum Davon­laufen«Dream Count» ist ein universelles Buch und doch unverkennbar von weiblichen Erfahrungen in ihren unter­schiedlichsten Facetten her geschrieben.Es geht um Geburt und Mutterschaft, um Fehl­geburten, um Abtreibung, um künstliche Befruchtung und um all die Meinungen zum Thema biologische Uhr. Es geht um arrangierte Ehen und, in schonungslos drastischen Szenen, um Genital­verstümmelung. Darum, wie im Patriarchat toxische Männlichkeit und weibliche Mitwirkung zusammen­spielen, um Religion, Aberglauben, Bildungs­verweigerung und Tradition als Unterdrückungs­instrumente. Es geht um sexualisierte Gewalt. Um gesellschaftliche Rollen­erwartungen und den Druck durch Schönheits­ideale auf Social Media. Um das Verhältnis zum eigenen Körper und um haar­sträubende anatomische Unkenntnis unter Männern. Um die Unter­minierung des Zusammenhalts unter Frauen in der neoliberalen Konkurrenz­gesellschaft, aber ebenso um die Kraft der Solidarität.Dazu ist der Roman voll mit den plot lines der romantischen Komödie, allerdings nahezu ausschliesslich auf die klassisch binäre Hetero-Perspektive beschränkt. Alle vier Frauen­geschichten enthalten unzählige Varianten von boy meets girl, wobei endlos viele Männer auftreten, die allesamt auf ihre je eigene Art zum Davon­laufen sind oder, falls halbwegs liebenswert, zu feige, um Verantwortung zu übernehmen.Daraus erklärt sich dann auch der Romantitel – ein durchaus riskantes Wortspiel, das sich nicht mit deutschem Vokabular wiedergeben lässt: Chia, so wirft ihre Freundin Zikora ihr halb scherzhaft vor, habe während des Lockdowns ja eher mit Luxus­sorgen zu tun gehabt und nun keinen Bedarf für eine Therapie:«Weil du, während normale Menschen im Lockdown unter Angst­zuständen litten, damit beschäftigt warst, deinen Verflossenen hinterher­zurecherchieren und deinen Body Count durchzugehen.»«Meinen Dream Count», sagte ich.«Mit wie vielen Dreams bist du denn schon zusammen gewesen?»Der «Dream Count» als lange Liste der erloschenen Beziehungs­träume – auch diese Art von eher parlando­haften Dialogen prägt das Buch. Doch gehört es zu den Stärken von Adichies Roman, dass die Autorin meist dann, wenn sich das Ganze scheinbar ganz im Konventionellen bewegt, eine unerwartete Volte vornimmt.Das Verhältnis der einzelnen Erzähl­perspektiven zueinander ist davon nicht ausgenommen. Zuschreibungen, Charakter­zeichnungen, ja Bewertungen von Menschen werden in den verschiedenen Blick­winkeln der Protagonistinnen auf unter­schiedliche Weise getätigt. Was Adichie in einem frühen TED-Talk unter dem Titel «The Danger of a Single Story» als geschichts- und medien­theoretische These ausformuliert hat, spiegelt sich hier auch ganz konkret erzählerisch: Narrative sind immer Welt­deutungen – und anstatt sie kritiklos für bare Münze zu nehmen, müssen sie mit anderen Perspektiven abgeglichen, höher aufgelöst und mitunter radikal korrigiert werden.Auch die vier Haupt­figuren haben unter­schiedliche Sicht­weisen aufeinander, sodass die Anlage des Romans insgesamt schon auf dieser grund­sätzlichen Ebene einen Einspruch gegen vorschnelles Urteilen vornimmt.Die Allgegenwart des RassismusDamit ist man bei der grössten Stärke dieses von Asal Dardan und Jan Schönherr souverän übersetzten Buches: Es stellt jeder manichäischen Weltsicht, jeder vereinfachenden Empörung das Beharren auf Komplexität entgegen. Das gilt auch – und hier wird es durchaus knifflig – im Sinne einer solidarischen Kritik an identitäts­politischen Diskursen, für die sich die Autorin selbst starkmacht.Auch und gerade in aufgeklärten westlichen Kreisen lässt sich von «Dream Count» ein Skeptizismus gegenüber allzu grob­schlächtigen Analyse­rastern lernen. Ohne den klaren Blick für die grossen Linien der historischen und gegenwärtigen Macht­verhältnisse zu verlieren, besteht Adichie auf einem möglichst kenntnis­reichen, hoch aufgelösten Bild – nicht zuletzt von den Menschen und ihren Herkunfts­ländern, die in den weissen Mehrheits­gesellschaften des Westens Minderheiten­status haben.So erzählt «Dream Count» (das auch ein Buch über den body count des American Dream ist) schonungslos von der Allgegenwart des Rassismus in den USA – zugleich aber auch von Gruppen­diskriminierung und ethnischen Konflikten innerhalb afrikanischer Gesellschaften. Adichie schildert die gnadenlose Konkurrenz­gesellschaft der Vereinigten Staaten – und lässt zugleich, etwa im Oberschichts­dünkel von Chias Mutter, die eklatante soziale Ungleichheit in afrikanischen Ländern plastisch werden. Es geht in diesem Buch auch um Kontroversen und geschichts­politische Kämpfe innerhalb der Black Communities, und zwar in der Diaspora ebenso wie innerhalb der multi­ethnischen Gesellschaften afrikanischer Länder. Der Roman führt vor Augen, wie elementar Bildung für jede Form der emanzipatorischen Kämpfe ist – und zeigt ebenso eindrücklich, wie zerstörerisch ein reiner Intellektualismus sein kann, der sich von Empathie und dem werte­basierten Handeln im konkreten zwischen­menschlichen Alltag entkoppelt.Nun muss man betonen: Adichie argumentiert nicht, sie erzählt. «Dream Count» ist kein Debatten­buch, sondern Literatur. Trotzdem sind Passagen ihres Buches unmissverständlich als Einspruch gegen allzu dogmatische Vertreterinnen linker Gesellschafts­kritik zu lesen. So heisst es einmal über Darnell, eine von Chias ersten und besonders unglücklichen Lieben, auf einer gemeinsamen Reise:Vielleicht war seine schlechte Laune ein Akt der Busse: Es war problematisch, Gefallen an einer luxuriösen Reise zu finden, und nun war das Mindeste, das er tun konnte, sie nicht zu geniessen.Und Omelogor erzählt von einer Kommilitonin im Uni-Seminar:«Das ist total rechts!», rief eine Frau namens Eve. Sie nannte alles rechts, dem sie nicht zustimmte. Es war rechts und damit basta. Fall erledigt.Es ist nicht zuletzt der Humor, den die Autorin in die oft besonders hart umkämpften Moral­diskussionen der Gegenwart einspeist. Einzelnen Passagen lässt sich womöglich auch ablesen, wie sehr Adichie noch die heftig geführte Debatte beschäftigt, die sich vor einigen Jahren um als transfeindlich kritisierte Äusserungen von ihr entspann.In den schwächeren Passagen ihrer Uni-Milieu-Skizzen droht ihr manche Figuren­zeichnung dann auch zur Karikatur zu werden – womit sie zumindest momenthaft hinter den eigenen Anspruch zurückfällt. Lesenswert und erkenntnis­reich, auch für eine innerlinke Selbst­reflexion, ist dieser Erzähl­strang trotzdem. Und Adichie ist viel zu klar emanzipatorisch positioniert, als dass die Anti-Wokeness-Polemiker bei ihr viel zu holen hätten.Warum das Buch auf jeden Fall zu reden geben wirdAm meisten Diskussions­stoff liefern dürfte jedoch der Schluss des Romans und der Erzähl­strang um die Hotel­angestellte Kadiatou, auf den die Autorin in einer längeren Anmerkung am Ende gesondert eingeht. Wie Adichie ausführt, hat sie hier den Fall Dominique Strauss-Kahn fiktionalisiert: Die Figur der Kadiatou ist angelehnt an Nafissatou Diallo, die 2011 weltweit in die Schlag­zeilen geriet, weil sie den damaligen Direktor des Internationalen Währungs­fonds der sexuellen Nötigung beschuldigte – worauf dessen Verteidiger darauf abzielten, Diallos Glaubwürdigkeit generell in Zweifel zu ziehen.Kadiatous Geschichte in Adichies Roman handelt nicht zuletzt davon, wie die Anwälte des mutmasslichen Täters im Verbund mit den Medien eine gnadenlose Diffamierungs­kampagne gegen die Hotel­angestellte lostreten. Wie Adichie das zerstörerische Zusammen­spiel aus Gewalt, Voyeurismus und victim blaming beschreibt; wie sie das eklatante Macht­gefälle zwischen dem Direktor und der Schwarzen, mittellosen Einwanderin mit mangelhaften Sprach­kenntnissen und permanenter Angst vor Abschiebung erzählerisch fassbar macht; wie sie die entwürdigende, retraumatisierende Tortur der immer neuen Befragungen und Kreuz­verhöre vor Augen führt, die mutmassliche Opfer sexualisierter Gewalt über sich ergehen lassen müssen – all das gehört zu den emotional heraus­forderndsten, aber auch dringlichsten und beeindruckendsten Passagen dieses Romans.«Class», «race», «gender»: Die aktuellen Grossthemen sind vertreten im neuen Roman von Adichie. Julia SellmannDann folgt – Achtung, Spoilerwarnung! – auf den allerletzten zwei Seiten noch einmal eine unerwartete Wendung.Hat sich Adichie, wie "
