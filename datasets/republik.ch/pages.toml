title = "Republik – das digitale Magazin"
description = "Kommen Sie jetzt an Bord."
full_description = "Wir beobachten für Sie das Weltgeschehen, filtern das Wichtigste heraus, ordnen es ein – und schicken es Ihnen jeden Freitag ansprechend verpackt in Ihre Inbox. Die Republik ist komplett werbefrei. So können wir uns auf unseren einzigen Kunden konzentrieren: Sie. Wir legen alles offen: unsere Finanzen, Arbeitsweisen, Fehler, Löhne – weil wir überzeugt sind, dass Transparenz wichtig ist. Die Republik wird finanziert durch ihre rund 28’000 Abonnentinnen. Wir gehören niemandem – aber jedem unserer Mitglieder ein bisschen. Der Newsletter für alle, die sich der Klimakrise stellen. Und gemeinsam Wege aus der Krise finden wollen. Neugierig, kritisch, konstruktiv. Die Republik ist eine Dienstleistung für interessierte Menschen in einer komplexen Welt. Wir recherchieren, fragen nach, ordnen ein und decken auf. Und liefern Ihnen Fakten und Zusammenhänge als Grundlage für Ihre eigenen Überlegungen und Entscheidungen. Wenn Sie gerade keine Hand frei haben – die Republik ist Journalismus fürs Ohr. Alle Beiträge können Sie sich im Audioplayer vorlesen lassen. Durch die Woche mit der Republik: das Justizbriefing «Am Gericht» am Mittwoch, das «Briefing aus Bern» am Donnerstag und «Was diese Woche wichtig war» am Freitag. Regelmässig eine Kolumne: am Dienstag von Gerhard Pfister, Daniel Strassberg, Kia Vahland oder Anna Rosenwasser. Jeden Samstag von Daniel Binswanger. Die ganz grossen Geschichten der Republik lassen sich nicht in einem Stück erzählen. Dazu brauchts Platz – und mehrere Folgen. Unsere Crew besteht aus kompetenten Profis. Den besten, die wir finden konnten. Uns eint die Leidenschaft für guten Journalismus. «Danke für diesen Artikel, der mir erstens noch mehr Lust aufs Buch macht, und mir zweitens sicher auch helfen wird, mich in der Fülle der von Ihnen beschriebenen Themen zurechtzufinden. (...)» Bei der Republik und beim Journalismus überhaupt geht es nicht nur um den individuellen Nutzen. Es geht auch darum, eine wichtige Funktion in einer Demokratie auszuüben: den Mächtigen auf die Finger zu schauen, unabhängig zu recherchieren und Missstände aufzudecken."
