["https://repvue.com/community-guidelines"]
title = "Community Guidelines | RepVue"
description = "View the details of the RepVue Community Guidelines."
full_description = "RepVue Community GuidelinesLast Updated: February 28th, 2025Sales professionals rely on RepVue’s sales organization profile pages and content to understand and evaluate sales organizations. These guidelines are designed to ensure that all users are able to view a fair and accurate representation of those sales organizations. Please follow the below guidelines when submitting reviews, questions, responses, forum posts, and other content on the site.All users are able to post questions and respond to questions about published sales organizations. Only users who have rated a sales organization are able to provide a review of that sales organization.. Additionally, we may choose not to publish content that we deem to be in violation of the content guidelines below.Your content should represent your personal opinion and experience with a current or former sales employer. We don’t take sides when it comes to factual disputes.Each user is allowed one review per sales organization every 4 months. We do not allow users to edit their reviews but will allow them to rewrite a review if necessary. We welcome and encourage users to write additional reviews after writing an initial review, as the employer’s environment evolves.When writing your review, we encourage users to write about both positives and negatives related to their experience. While we do not require this, we believe that balanced reviews provide better insights to our community.We don’t approve content that names individuals in a company or otherwise eludes to an individual in identifiable ways, however, we do allow reviews that name individuals in the highest positions in a company that have broad influence over the work culture. Individuals in this category might include (C-Suite, Executive Director, President, Owner, Founder, etc.)We don’t approve content that includes excessive profanities, threats of violence, or discriminatory language targeted at an individual or group.We may allow content that mentions race, religion, nationality, gender, and/or sexual orientation if we believe it is used to describe a workplace situation. General discussions of workplace misconduct are allowed, including most discussions of illegal activities, discrimination, and sexual harassment.We don’t approve content that is believed to reveal confidential, non-public company information. This includes: source code, customer lists, manufacturing techniques, R&D activities, budgets, detailed financial results and technical know-how.We don’t allow you to identify yourself or include any contact information (about yourself or others) in your content. Please remain aware of the potential implications of providing overly specific details about your experiences that may inadvertently lead to your identification.RepVue is about sharing information that helps the sales community. We will reject any content that contains unsolicited or irrelevant messages, advertisements, web links or promotional content. Ensure that all contributions are pertinent to the sales community and foster constructive dialogue.All content should be original – no substantial quoted material from other sources, including (but not limited to) websites, e-mail correspondence, etc. If content is believed to be written by AI we may reject it.Your writing doesn’t have to be perfect, but users need to be able to understand it. We may reject content if the message may not be understood by the community.Our guidelines and moderation policies take into consideration applicable laws in the different international markets in which RepVue operates.We don’t approve content that includes ad hominem attacks or personal insults.Refrain from posting the same or substantially similar content multiple times. This includes duplicate reviews, comments, or discussions that do not add new value.Repeated violations of these policies may result in the discretionary removal of content and/or suspension of your account. Content decisions are within our sole discretion and not influenced by any party outside of RepVue. Our goal is to maintain a respectful and valuable community for all members."
year_published = 2025
clearnet = "https://repvue.com/community-guidelines"
