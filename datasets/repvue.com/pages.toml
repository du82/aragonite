nter;align-items:center;-webkit-align-self:stretch;-ms-flex-item-align:stretch;align-self:stretch;display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;box-sizing:border-box;}.css-1xc3v61-indicatorContainer{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-transition:color 150ms;transition:color 150ms;color:hsl(0, 0%, 80%);padding:8px;box-sizing:border-box;}.css-1xc3v61-indicatorContainer:hover{color:hsl(0, 0%, 60%);}.css-8mmkcg{display:inline-block;fill:currentColor;line-height:1;stroke:currentColor;stroke-width:0;}Reppy Winners ListTop Rated for OverallChange ListSCORING CATEGORIESOverallProfessional DevelopmentCulture & LeadershipProduct-Market FitIncentive Comp StructureInbound Lead / Opportunity FlowDiversity & InclusionCITIESAtlantaAustinBostonCharlotteChicagoCincinnatiDallasDenverDublinHelsinkiHoustonIndianapolisLondonLos AngelesMelbourneMiamiMinneapolisNew YorkParisPhiladelphiaPhoenixPortlandRaleigh-DurhamSalt Lake CitySan DiegoSan FranciscoSan JoseSanta BarbaraSeattleSt. LouisSydneyTampaTel AvivTorontoVancouverWashington DCFUNDING TYPEBootstrappedPrivate EquityPublicVenture Capital BackedCOMPANY SIZESmallMid-SizedLargeTop Overall Sales OrgsWe’ve awarded these sales organizations for being exceptional across all rating categories. According to sales reps, these companies excel in product-market fit, culture, inbound lead flow, and compensation, creating an ideal environment for sales professionals to thrive and succeed. Companies must have a minimum of 25 ratings to qualify.BuildiumBuildium is the only property management solution that helps real estate professionals win new business from property owners and community associations seeking services. Backed by expert advice and relentless support, Buildium enables you to outperform across all facets of your business with intuitive software that balances power, simplicity, and ease of use. Buildium services customers in more than 50 countries, totaling over 2 million residential units under management.BuildOpsFor modern commercial specialty contractors, BuildOps is the ultimate all-in-one management software, providing a comprehensive solution that streamlines service, project management, and more. With a focus on trade contractors, BuildOps simplifies invoicing, billing, scheduling, estimates, proposals, payments, workflows, custom forms, financial reporting, and other critical functions in one convenient SaaS platform. By utilizing BuildOps, commercial service contractors can boost their profit margins, increase cash flow, and impress customers with ease. Founded in 2018 and backed by world-class institutional investors, including Founders Fund, Next47 (Siemens), and Global Founders Capital, BuildOps is privately held and veteran-owned. Visit BuildOps.com to learn more about how this platform can help you take your career to the next level.Carolina HandlingCarolina Handling is the exclusive Raymond Solutions & Support Center in the Southeast. We deliver automation and optimization services that empower businesses with the flexibility to grow with real-time monitoring of fleets and warehouses. Constructor.io​​Constructor is the only AI product discovery platform designed explicitly for ecommerce retailers. Unlike other product search and discovery platforms, machine learning is in Constructor’s DNA, bringing dynamic personalization to the customer experience. Constructor's cloud-based solutions use natural language processing, machine learning, and collaborative personalization to deliver powerful user experiences across all facets of product discovery—from search to browse, recommendations, collections, and autosuggest.EliseAIEliseAI is a machine learning tech firm headquartered in New York City. Our goal is to develop conversational artificial intelligence that revolutionizes vital industries like housing and healthcare. Through robust and flexible AI solutions, we enable businesses to achieve significant operational efficiencies, expanding their capacity to reach and assist more individuals.GatekeeperGatekeeper is a cloud-based contract and supplier management platform that operates on any device, focusing on collaboration and ease of use. With a zero-training mantra, the platform prioritizes usability, ensuring that both internal stakeholders and suppliers can effortlessly use the platform to track obligations and compliance, receive email alerts, and access clear actionable data. This focus on usability and collaboration makes Gatekeeper a key player in advancing careers in the supplier management field.IdealsIdeals offers a comprehensive Virtual Data Room (VDR) solution that simplifies secure sharing of confidential documents and streamlines corporate deal management, particularly during M&A and similar transactions. Established in 2008, we've built our company on the pillars of service excellence and technological innovation. Trusted by over 1,000,000 users from 175,000 companies globally, we are on a mission to create more prosperity in the world by accelerating high-stake business decisions.MaintainXMaintainX is the world-leading mobile-first workflow management platform for industrial and frontline workers. We are a modern IoT-enabled cloud-based tool for maintenance, safety, and operations on equipment and facilities. MaintainX helps businesses track reactive and preventive maintenance and control the daily operations, such as safety inspections, quality inspections, and operating checklists—all with a digital audit trail Here's what we digitize and take away from the clipboard: - Safety Procedures - Environmental Checklists - Tooling & Gauge Reporting - Maintenance Procedures - Auditing/Inspection Workflows - Training Checklists We allow plant managers to become more efficient operators by delivering real-time business insights from the field. Monte Carlo DataMonte Carlo is a data observability platform that ensures your team is the first to know and solve data breaks, reducing data downtime and improving business value. With hundreds of data teams experiencing broken dashboards, poorly trained ML models, and inaccurate analytics, Monte Carlo's end-to-end data observability empowers data teams to focus on what matters most by eliminating time-wasting fire-drills and outdated data governance software. Join the data reliability movement and accelerate the world's adoption of data with Monte Carlo's commitment to making data reliable, customers' lives easier, and working with the broader data community to realize the full potential of data. Aspiring tech professionals looking for a rewarding career in the data industry can consider joining Monte Carlo's mission to reduce data downtime and promote reliable data.NooksNooks is an intelligent virtual salesfloor and dialer designed to elevate the performance of SDR and BDR teams, leading to a 2-3x increase in their pipeline. The platform facilitates team training, enhances conversion rates, and multiplies connect rates, all within an engaging and enjoyable environment. Owner.comOwner is the comprehensive platform designed to streamline the management of a restaurant's digital presence. We empower restaurant owners to regain full control over their establishments on the web. Our product serves as a strategic tool, enabling owners to reclaim authority from large corporations that may compromise customer relationships and impose unfair fees. With Owner, restaurant owners can truly own their digital presence and navigate the online landscape with confidence.PigmentPigment is dedicated to facilitating business teams in planning, decision-making, and adapting to change. Our mission involves integrating people, data, and processes into an intuitive platform, enabling teams to swiftly construct reliable strategic and operational business plans. With Pigment, businesses can proactively drive growth, respond to changes, and ensure the future resilience of their operations. Placer.aiPlacer.ai provides instant access to location analytics derived from the foot traffic of millions of consumers, delivering visibility into offline behavior. We shed light into churn, trade areas, untapped audiences, out-of-store behavior, and competitive benchmarking.PostmanPostman is the world’s leading API platform. Postman's features simplify each step of building an API and streamline collaboration to help create better APIs—faster. More than 20 million developers and 500,000 organizations across the globe use Postman today. Postscript.ioPostscript is a powerful, easy-to-use SMS platform for Shopify stores. Send campaigns, create automations, and drive new revenue with texts, gifs, and more. Postscript customers see more than a 10x ROI with personalized, targeted text messagesPure StoragePure Storage helps innovators build a better world with data. Pure's data solutions enable SaaS companies, cloud service providers, and enterprise and public sector customers to deliver real-time, secure data to power their mission-critical production, DevOps, and modern analytics environments in a multi-cloud environment. One of the fastest growing enterprise IT companies in history, Pure Storage enables customers to quickly adopt next-generation technologies, including artificial intelligence and machine learning, to help maximize the value of their data for competitive advantage. And with a Satmetrix-certified NPS customer satisfaction score in the top one percent of B2B companies, Pure's ever-expanding list of customers are among the happiest in the world.RechargeRecharge is simplifying retention and growth optimizing revenue for innovative ecommerce brands. As the #1 subscription platform, Recharge is dedicated to empowering brands to easily set up and manage subscriptions, create dynamic experiences at every customer touchpoint, and continuously evaluate business performance. Powering a seamless experience for customers with everything from no-code customer portals, personalized offers, and dynamic bundles, Recharge helps merchants seamlessly manage, grow, and delight their subscribers while reducing operating costs and churn. Today, Recharge powers more than 20,000 merchants serving 100 million subscribers, including brands such as Blueland, Hello Bello, LOLA, Chamberlain Coffee, and Bobbie—Recharge doesn’t just help you sell products, we help build buyer routines that last.ServiceNowServiceNow (NYSE: NOW) makes the world work better for everyone. Our cloud-based platform and solutions help digitize and unify organizations so that they can find smarter, faster, better ways to make work flow. So employees and customers can be more connected, more innovative, and more agile. And we can all create the future we imagine. The world works with ServiceNow. Triple WhaleAll your data in one easy-to-use dashboard. We’re building the operating system for eCom. UserGemsUserGems helps you identify your biggest champions by tracking user job changes and automating everything it takes to turn past contacts into new pipeline. For sales, UserGems delivers warm leads every month that help reps book more calls, find warmer introductions, and close deals faster. For marketing, UserGems provides valuable contact data to reach and convert ICP leads so you can hit your pipeline target sooner.'''
