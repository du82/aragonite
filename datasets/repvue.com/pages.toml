["https://repvue.com/faq"]
title = "Frequently Asked Questions | FAQ | RepVue"
description = "What’s a RepVue score? Is my rating anonymous? Find out the answers to common questions about RepVue here."
full_description = '''{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Is my RepVue rating anonymous?","acceptedAnswer":{"@type":"Answer","text":"Yes, your RepVue rating is completely anonymous. No individual ratings are ever published on our website. Please refer to our privacy policy for additional questions or concerns."}},{"@type":"Question","name":"How does RepVue make money?","acceptedAnswer":{"@type":"Answer","text":"RepVue will always be free for our users, and it will always be fully anonymous. We collect and aggregate data related to the health and performance of sales organizations. This data serves three segments: Our users who are able to leverage RepVue to advance their careers, negotiate salaries, find and research great opportunities, and more. Second, employers or corporate customers who leverage RepVue for recruiting and talent acquisition and gaining an understanding of the health of their sales organization. Third, research and financial institutions who leverage RepVue to understand if sales organizations are well run, and how they are trending."}},{"@type":"Question","name":"Can I get hired through RepVue?","acceptedAnswer":{"@type":"Answer","text":"YES. We are constantly adding sales roles for some of the highest ranked and rated orgs on RepVue. Please check out our job board to search and filter through jobs that might be a fit for you. Users are getting hired through RepVue every week."}},{"@type":"Question","name":"Why do I have to rate a sales org every 120 days?","acceptedAnswer":{"@type":"Answer","text":"Sales organizations are constantly changing and evolving. Our users rate their sales organization every 120 days so that the RepVue community has access to the most up-to-date, accurate information possible. You should be rating your current sales organization each time you submit a rating, or roughly every 120 days."}},{"@type":"Question","name":"How do I understand RepVue scores?","acceptedAnswer":{"@type":"Answer","text":"The RepVue scores represent how each sales organization has been rated, relative to it's peers, with each score being amplified (or not) based on how important that category is to sales professionals. For example if a sales organization is performing particularly well AND it's a category that sales professionals care a lot about, that will benefit that sales organization's scores. RepVue sales org scores max out at ~100."}},{"@type":"Question","name":"I rated a company but the environment has changed - can I adjust my rating?","acceptedAnswer":{"@type":"Answer","text":"We hope that RepVue will help push sales organizations to evolve for the better. If things have changed, simply enter a new rating - it will help us track the organization over time. If what’s important to you has changed you can adjust that at any time in your profile."}},{"@type":"Question","name":"How can I sign up for RepVue?","acceptedAnswer":{"@type":"Answer","text":"To sign up for RepVue you simply need to rate a sales organization where you work. Once you submit your rating you will have completed the registration process. It only takes a ~3 minutes to complete."}},{"@type":"Question","name":"How can I get one of those RepVue T-shirts?","acceptedAnswer":{"@type":"Answer","text":"Once you add your fourth rating (assuming they are your current organization, not a former organization), have your user profile filled out, and are based in the US, you’ll be eligible for one of our super soft RepVue t-shirts. Note that all your ratings must be verified, which means that we’ve confirmed you worked in the role that you are rating. Trust us, you’ll love the RepVue t-shirt."}}]}Frequently Asked QuestionsHave questions? We're here to help. Here's everything you need to know about our product, your data, and your privacy.Is my RepVue rating anonymous?Yes, your RepVue rating is completely anonymous. No individual ratings are ever published on our website. Please refer to our privacy policy for additional questions or concerns.How does RepVue make money? RepVue will always be free for our users, and it will always be anonymous. We collect and aggregate data related to the health and performance of sales organizations. This data serves our users via this website, and we have two commercial offerings: We sell to employers who leverage RepVue for recruiting and talent acquisition as well as competitive and compensation benchmarking. Employers do not have access to personal information (unless you apply for a job and engage with a hiring organization) nor can they tie any rating data back to a user. We launched this product in 2021. If you're an employer looking to grow your sales organization, please contact us. We sell to financial institutions and research firms who leverage RepVue to understand if sales orgs are well run, and how they are trending. This includes hedge funds and private equity firms who are looking for investment research. We launched this product in 2023. Like our employer offering, we never share any personal information. If you're a financial institution looking for investment research, please contact us. Can I get hired through RepVue?YES. We are constantly adding sales roles for some of the highest ranked and rated orgs on RepVue. Please check out our job board to search and filter through jobs that might be a fit for you. Users are getting hired through RepVue every week.Why do I have to rate a sales org every 120 days?Sales organizations are constantly changing and evolving. Our users rate their sales organization every 120 days so that the RepVue community has access to the most up-to-date, accurate information possible. You should be rating your current sales organization each time you submit a rating, or roughly every 120 days.How do I understand RepVue scores?The RepVue scores represent how each sales organization has been rated, relative to it's peers, with each score being amplified (or not) based on how important that category is to sales professionals. For example if a sales organization is performing particularly well AND it's a category that sales professionals care a lot about, that will benefit that sales organization's scores. RepVue sales org scores max out at ~100.I rated a company but the environment has changed - can I adjust my rating?We hope that RepVue will help push sales organizations to evolve for the better. If things have changed, simply enter a new rating - it will help us track the organization over time. If what's important to you has changed you can adjust that at any time in your profile.How can I sign up for RepVue?To sign up for RepVue you simply need to rate a sales organization where you work. Once you submit your rating you will have completed the registration process. It only takes a ~3 minutes to complete.How can I get one of those RepVue T-shirts?Once you add your fourth rating (assuming they are your current organization, not a former organization), have your user profile filled out, and are based in the US, you'll be eligible for one of our super soft RepVue t-shirts. Note that all your ratings must be verified, which means that we've confirmed you worked in the role that you are rating. Trust us, you'll love the RepVue t-shirt.RepVue Help CenterHaving trouble with your account or have a question for our team? Submit your response below!First Name *Last Name *Email *Submit'''
