full_description = "Privacy PolicyLast Updated: August 10th, 2023IntroductionWe at RepVue, Inc. (“we” or “us”) respect your privacy and are committed to protecting it through our compliance with this Privacy Policy (this “Policy”). This Policy describes the types of information we may collect from users or that users may provide when they visit the website www.repvue.com (our “Website”) and our practices for collecting, using, maintaining, protecting and disclosing that information. Users may include Sales Professionals (as defined in our Sales Professional Terms of Use), individual representatives of employers accessing and contacting us in regards to our employer-focused Website content, or other visitors to our Website. “You” are the user visiting our Website.This Policy applies to any information that we collect on the Website, including any information in any emails, posts, texts and other electronic messages between you and the Website and any information about you transferred to the Website from other websites. This Policy also applies to any related information that we collect about you offline but that will be processed by automated means using the Website. This Policy does not apply to any other information that we collect by any means.Please read this Policy carefully to understand our policies and practices regarding your information and how we will treat it. If you do not agree with our policies and practices, you can choose not to use our Website. By accessing or using our Website, you agree to this Policy. This Policy may change from time to time. When we make changes to this Policy, we will post the updated Policy on our Website and update the Policy’s “last modified” date. We will also provide notice of any material changes as explained in the section below titled “Changes to Our Privacy Policy.” Except as provided in the section below titled “European Users: Your E.U. Privacy Rights,” your continued use of the Website after we make changes is deemed to be acceptance of those changes, so please check the Policy periodically for updates.Information We Collect About You and How We Collect ItWe may collect several types of information from and about users of our Website, or our third party service providers may collect information from and about users of our Website on our behalf. This may include information by which you may be personally identified, such as your name, postal/physical address and email address, or other information about a user to the extent maintained in personally-identifiable form, such as a specific user’s company name and job title (collectively, “Personal Information”).The information we collect on or through our Website may include information that you provide by registering to use our Website, using our services, posting material, requesting further services or reporting a problem with our Website. We will also retain records and copies of your correspondence (including email addresses), if you contact us.If you choose to submit a rating of an employer through our Website, we may, through manual or automated means, also view and collect information from one or more of your publicly-available social media profiles on the Internet to verify the rating information you submit or to otherwise personalize your Website experience and/or our communications to you, as described in further detail below in the sectile titled “How We Use Your Information.”Submission of Anonymous Reviews to the WebsiteIf you choose to submit a review of an employer through our Website, please be advised that such reviews are intended by us to be anonymous, and therefore our Terms of Use expressly prohibit you from including Personal Information (yours or another's)—and, in particular, expressly prohibit you from including any Sensitive Information (yours or another's)—within the content or text of your review submission. If you nevertheless choose to include any Personal Information or Sensitive Information in your review submission, you understand, acknowledge and agree that this Personal Information and Sensitive Information will be collected, used and disclosed by us for the purposes of processing, posting and displaying your review on the Website, in a manner that is viewable and accessible by us, by other users of the Website, and each of the other parties described below in the section titled “Disclosure of Your Information.” As indicated in our Terms of Use, we do not undertake to review the content or text of any reviews before such reviews are posted on the Website. Please see the section below titled “Your Rights and Choices” for information on any requests to access, change and/or request the deletion of any Personal Information included in your reviews.Traffic, Usage and Computer/Device Information; Use of CookiesAdditionally, as you navigate through and interact with our Website or interact with the e-mails and other electronic messages we send to you, we (or our third party service providers acting on our behalf) may automatically collect certain traffic data, usage information, and information about your computer equipment or mobile device, such as your browser and operating system, your wireless carrier, configuration data, clickstream analytics and your actions and patterns when you use our Website (“Technical Information”). The technologies we use for this automatic data collection may include cookies that are stored on the browser of your computer or mobile device, small embedded electronic files known as web beacons (also referred to as clear gifs, pixel tags and single-pixel gifs) and other types of embedded code. We collect this information to manage our content and improve users’ use of our Website; count and review the number of users of our Website and their usage patterns; to track key performance indicators such as pages accessed, frequency of access, conversions (e.g., the number of users who click on our advertisements and then go on to submit a rating of an employer) and other statistical information related to our Website (for example, recording the popularity of certain content and verifying system and server integrity); to identify the portion of users who accesses our Website via different web browsers; to recognize if a user is a return user of our Website; to store information about a user’s visits; to remember a user’s preferences; and for similar purposes in connection with monitoring, operating, maintaining and improving our Website. As one example of a use of Technical Information: if you are a Sales Professional who chooses to submit an employer rating, we use a cookie to store data that you provide as you complete the ratings process. These cookies are functionally necessary cookies—we are unable to effectively process your employer ratings without this use of cookies. Third parties may also use cookies or otherwise collect Technical Information and other information on our behalf as further described in the sections below titled “Use of Google Analytics” and “Tracking and ‘DO NOT TRACK’.”.How We Use Your InformationGenerallyWe use information that we collect about you or that you provide to us, including any Personal Information, to:Present our Website, its contents and our services to you.Provide you with information or services that you request from us.Create, maintain, customize, and secure your account with us.Authenticate or otherwise verify your identity in connection with your actions or requests via the Website or otherwise.Verify information you have submitted to our Website when you choose to submit ratings of one or more employers through our Website.Personalize your Website experience and/or the informational or promotional communications we send to you.Provide you with support and to respond to your inquiries and customer service and support requests, including to investigate and address your concerns and to monitor and improve our responses.Provide you with informational and promotional content and materials regarding the Website and our services offered through the Website.Provide you with informational and promotional content and materials regarding the products and services of affiliates or third parties with whom we have partnered that we believe may be of interest to you.Help maintain the safety, security, and integrity of our Website, databases and other technology assets and our business.Update and maintain customer, subscription or e-mail lists.Notify you about changes to our Website, products and services.With respect to Technical Information, fulfill the purposes described in the section above titled “Traffic, Usage and Computer/Device Information.”Respond to lawful requests for information through court orders, subpoenas, warrants and other legal processes or obligations.Enforce any contracts between you and us, including for billing and collection, or for the establishment, exercise or defense of legal claims.Evaluate or conduct a merger, divestiture, restructuring, reorganization, dissolution, or other sale or transfer of some or all of our assets, whether as a going concern or as part of a bankruptcy, liquidation, or similar proceeding, in which Personal Information held by us is among the assets transferred.Fulfill any other purpose for which you provide the information.Serve any other purpose that we describe when you provide the information and for any other purpose with your consent.Other uses of your information (including your Personal Information) may include:Allowing participation in interactive features of the Website;If you are an individual representative of an employer, contacting you, at your request, about our Website and services;If you are a Sales Professional, allowing you to share your Sales Professional profile with Employers, which Employers may then use your information to contact you regarding interviews; andProviding you with important e-mail communications from us, including, if you are a Sales Professional, information about educational or career development resources that may be of interest to you (for information about how you can opt out of receiving certain e-mails from us, see the section below titled “Your Rights and Choices: Generally”).Please also review the section below titled “Use and Disclosure of Pseudonymized, Aggregated or De-Identified Data” for important information on how we might use those types of information in our business.Use of Google AnalyticsWe use Google Analytics to track and analyze certain traffic and usage statistics regarding the use of our Website, such as the number of visitors to our Website, how visitors are navigating to our Website, visitors’ general geographic region information, how long individuals are visiting our Website, and information about the equipment individuals are using to access our Website (e.g., browser version and operating system). Google Analytics may use a Google Analytics cookie as part of this service, and we may share certain Personal Information with Google Analytics as part of this service. We use this traffic and usage information to gauge, internally, the effectiveness of our advertising efforts and to make improvements to our Website and our marketing and promotional efforts.In addition, we may use the following Google Analytics Advertising Features:Allowing participation in interactive features of the Website; Google Display Network Impression ReportingGoogle Analytics Demographics and Interest ReportingGoogle Ads (as an integrated service with Google Analytics)By enabling these features, we and certain third-party vendors use first-party cookies (such as the Google Analytics cookie) or other first-party identifiers, and third-party cookies (such as Google advertising cookies) or other third-party identifiers together for various purposes. The information collected includes demographic information about our Website visitors and general information about our visitors’ interests. We use the information collected through our use of the Google Analytics Advertising Features to track Website behavior, segment our audience and to better target our advertising and marketing efforts (for our own and others’ products and services) and allow third-party vendors to do the same, for example to (1) display targeted advertisements to individuals who viewed a product but did not add that product to their cart, (2) target visitors from a certain geographic region with certain ads in Google search results that have previously shown a high degree of success for consumers in that region, (3) advertise our products and services across other websites that you may visit, or (4) allow Google or other third-party vendors to show you ads on websites that you visit after using our Website or clicking on an offer or ad in one of our e-mails or in our Website.For more information, please review the following:Information about Google’s use of cookies:https://policies.google.com/technologies/cookies?hl=en-USInformation about Google’s use of information from sites or apps that use Google’s services:https://policies.google.com/technologies/partner-sitesYou can opt out of our use of certain Google Analytics features by updating the “Ads Settings” in your browser (https://adssettings.google.com/authenticated) or mobile device (https://support.google.com/ads/answer/1660762#mob), by enabling the Google Analytics Opt-out Browser Add-on in your browser (https://tools.google.com/dlpage/gaoptout), or by visiting the Network Advertising Initiative’s Consumer Opt-Out page (https://optout.networkadvertising.org/). Because those opt-out and preference control pages are specific to the individual browser used to visit it, and because those pages are not operated by us, we are unable to perform the opt-outs on your behalf.Disclosure of Your InformationIf you are a Sales Professional, by using certain interactive features of the Website you may choose to display your Sales Professional profile to Employers, including any Personal Information you have chosen to display in such profile, which Employers may then use your information to contact you regarding interviews.We may disclose Personal Information to our subsidiaries and affiliates and to any contractors, service providers and other third parties who need to know such information (or such subsidiaries, affiliates, contractors, service providers or other third parties may collect Personal Information directly from you on our behalf while you use our Website) in order to provide services to us that support our hosting, maintenance, operation and promotion of our Website, our Services and our business and our permitted uses of Personal Information under this Policy. For example, we may use a third party cloud-hosting infrastructure service provider (e.g., Amazon Web Services, Google Cloud or Microsoft Azure) and we may use a customer relationship management or an e-mail marketing software platform offered by a third party service provider.We may disclose "
