["https://repvue.com/cloud-index/2024/Q4"]
title = "RepVue Cloud Sales Index | Q4 2024"
description = "RepVue  Cloud Sales Indexq4 2024"
full_description = "2024 concluded with 43.14% quota attainment, with a second consecutive quarter of incremental progress bouncing off the Q2-24 low of 42.00%. 200K+ average deal size sellers, as well as the Data & AI vertical bouyed the Index, both cohorts saw quota attainment in the 47% range which lead across both different ACV and Vertical dimensions.The RepVue Cloud Sales Index (comprising 238 companies with ~42,000 quota carrying sales professional ratings and over 1 million data points), enables us to provide a clear breakdown of where sales professionals are succeeding, which organizations are outperforming their peers, and other deep insights into the B2B sales landscape. 01A New Normal?Sales professionals in the RepVue Cloud Sales Index finished the year with quota attainment at 43.14%. 8 consecutive quarters of middling performance on this measure, a long cry from the 53% quota attainment observed in Q1-22.While early results of Q1-25 do show continued progress thus far - it will take several more Qs of continued progress and sustained momentum into the high 40% range before we can confidently declare 'we're so back'.02Sales Tools Lead the Way5 of the 9 sub-industries show y/y improvement - with Sales Tools leading, up 7.82%46.22%Q4 2347.04%Q4 241.8%Data & AI42.12%Q4 2341.17%Q4 242.3%Finance & ERP46.46%Q4 2342.35%Q4 248.8%Marketing Tools45.97%Q4 2346.44%Q4 241%HR Tools40.55%Q4 2342.19%Q4 244%DevOps & Developer Tools40.47%Q4 2343.12%Q4 246.5%Productivity & Collaboration Tools38.74%Q4 2338.17%Q4 241.5%Cybersecurity39.2%Q4 2340.54%Q4 243.4%Vertical Industry Software39.89%Q4 2343.01%Q4 247.8%Sales ToolsIn absolute terms, Data & AI and HR Tools are the only two verticals with greater than 45% quota attainment while Cybersecurity lags and remains the only vertical seeing sub-40% quota attainment. On a relative basis, Sales Tools made the biggest improvement year over year, rising 7.82%. In theory, Sales Tools seeing more success is a bullish leading indicator for the entire industry signalling some additional investment in GTM across verticals, we'll be watching to see if this narrative plays out further into 2025.03Mid-Market ACVs RiseSellers with 50K-100K ACVs see marked improvementWith quota attainment improving from 41.9% to 44.58% year over year, the Mid-Market ACV range of 50K - 100K, which captures of majority of sellers in our panel, lead the way in terms of quota attainment by ACV. Deals over 200K continue to show consistent performance, and lead all others with quota attainment north of 47%. Lagging in both absolute and relative terms this quarter where the smallest SMB/Commercial deals with ACVs less than 10K and sellers only meeting or exceeding quota 41.34% Deals under $10k6.23%Deals $10k - $50k3.09%Deals $50k - $100k6.41%Deals $100k - $200k0.59%Deals $200k+0.67%04Largest Deals Sales Cycle LengthenExpect 6-9 months for most deals over 100KWhile no material changes in Sales Cycle lengths were detected across any ACV ranges, we did observe a lengthening in Sales Cycle Lengths on the largest deal sizes, those 100K and above. Interestingly deals representing the smallest deal sizes, those under 50K saw some modest improvements in their Sales Cycle lengths.Deals under $10k3.25%Deals $10k - $50k1.82%Deals $50k - $100k0.32%Deals $100k - $200k1.61%Deals $200k+3.01%05Enterprise Deals Show Pricing PowerEnterprise Sellers see ACV expansion to 194K on averageSMB deals are stuck in a tight 20K-30K range - and saw a material year over year contraction in Q4-24 down to 25K. In contrast, and perhaps of function of the higher barrier to entry and less pricing pressure, Enterprise deals marked a new high with their ACV expanding to the highest reported level over the prior 8 quarters to 194K on average, establishing a clear positive trend.06Included CompaniesWe created the RepVue Cloud Sales Index by aggregating ratings data from 238 companies and categorizing them into SaaS sub-industries. This report comprises ~42,000 ratings from quota-carrying sales professionals who worked at these organizations."
