nter;align-items:center;-webkit-align-self:stretch;-ms-flex-item-align:stretch;align-self:stretch;display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;box-sizing:border-box;}.css-1xc3v61-indicatorContainer{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-transition:color 150ms;transition:color 150ms;color:hsl(0, 0%, 80%);padding:8px;box-sizing:border-box;}.css-1xc3v61-indicatorContainer:hover{color:hsl(0, 0%, 60%);}.css-8mmkcg{display:inline-block;fill:currentColor;line-height:1;stroke:currentColor;stroke-width:0;}Reppy Winners ListTop Rated for Professional DevelopmentChange ListSCORING CATEGORIESOverallProfessional DevelopmentCulture & LeadershipProduct-Market FitIncentive Comp StructureInbound Lead / Opportunity FlowDiversity & InclusionCITIESAtlantaAustinBostonCharlotteChicagoCincinnatiDallasDenverDublinHelsinkiHoustonIndianapolisLondonLos AngelesMelbourneMiamiMinneapolisNew YorkParisPhiladelphiaPhoenixPortlandRaleigh-DurhamSalt Lake CitySan DiegoSan FranciscoSan JoseSanta BarbaraSeattleSt. LouisSydneyTampaTel AvivTorontoVancouverWashington DCFUNDING TYPEBootstrappedPrivate EquityPublicVenture Capital BackedCOMPANY SIZESmallMid-SizedLargeTop Rated Professional Development CompaniesWe’ve awarded these sales organizations for having exceptional professional development. According to sales reps, these companies support employees in career advancement, and help them achieve personal and professional goals. Companies must have a minimum of 20 ratings in the last 12 months to qualify.AlphaSenseAlphaSense is a market intelligence platform used by the world’s leading companies and financial institutions. Since 2011, our AI-based technology has helped professionals make smarter business decisions by delivering insights from an extensive universe of public and private content—including company filings, event transcripts, news, trade journals, and equity research. Our platform is trusted by over 2,000 enterprise customers, including a majority of the S&P 100. Headquartered in New York City, AlphaSense employs over 1,000 people across offices in the U.S., U.K., Finland, and India. For more information, please visit www.alpha-sense.com.Boston ScientificAt Boston Scientific, we work collaboratively to solve healthcare’s toughest problems by developing solutions that matter most to those suffering from debilitating and life threatening conditions and the healthcare professionals who provide their care. Across 100+ countries, we help providers deliver care more effectively by reducing costs, increasing efficiencies and expanding access to care in order to help more people in more places live longer, healthier lives.Eli LillyFor more than a century, we have stayed true to a core set of values – excellence, integrity, and respect for people – that guide us in all we do: discovering medicines that meet real needs, improving the understanding and management of disease, and giving back to communities through philanthropy and volunteerism. eXp RealtyeXp Realty, The Real Estate Cloud Brokerage, is the fastest-growing, global residential real estate company. As a subsidiary of a publicly traded company, eXp Realty uniquely offers real estate professionals within its ranks opportunities to earn eXp World Holdings stock for production and contributions to overall company growth.GatekeeperGatekeeper is a cloud-based contract and supplier management platform that operates on any device, focusing on collaboration and ease of use. With a zero-training mantra, the platform prioritizes usability, ensuring that both internal stakeholders and suppliers can effortlessly use the platform to track obligations and compliance, receive email alerts, and access clear actionable data. This focus on usability and collaboration makes Gatekeeper a key player in advancing careers in the supplier management field.IdealsIdeals offers a comprehensive Virtual Data Room (VDR) solution that simplifies secure sharing of confidential documents and streamlines corporate deal management, particularly during M&A and similar transactions. Established in 2008, we've built our company on the pillars of service excellence and technological innovation. Trusted by over 1,000,000 users from 175,000 companies globally, we are on a mission to create more prosperity in the world by accelerating high-stake business decisions.Impact NetworkingToday, Impact specializes in the conception, development and execution of customized strategies and solutions that improve technical, financial, operational and creative aspects of a business. The Impact suite of services includes Managed IT & Cloud Services, Cybersecurity, Digital Innovation, Print & Document Management and Branding & Marketing. Recognized for rapid growth, continued innovation and company culture, Impact has been listed as Inc. 5000 “America’s Fastest Growing Private Companies” eleven years in a row, CRN Triple Crown winner and Chicago Tribune “Top Places to Work.”JobberAward-winning job tracking and customer management software for home service businesses. Jobber’s 160K+ home service professionals have served over 12 million households in more than 47 countries, and invoiced for over $15 billion in services. We continually rank as one of Canada’s fastest-growing and most innovative companies by Canadian Business and Macleans, The Globe and Mail, Fast Company, and Deloitte.Keller Williams RealtyAustin, Texas-based Keller Williams, the world’s largest real estate technology franchise by agent count, has more than 1,100 offices and 200,000 associates. The franchise is also No. 1 in units and sales volume in the United States. kwx is the holding company of Keller Williams. In 2020, Keller Williams initially began the formation of kwx. kwx is composed of Keller Williams, Keller Williams Worldwide and Keller Home Financial Services, consisting of Keller Mortgage, Keller Offers, Keller Covered, Keller Title and The Partnership Program.MaintainXMaintainX is the world-leading mobile-first workflow management platform for industrial and frontline workers. We are a modern IoT-enabled cloud-based tool for maintenance, safety, and operations on equipment and facilities. MaintainX helps businesses track reactive and preventive maintenance and control the daily operations, such as safety inspections, quality inspections, and operating checklists—all with a digital audit trail Here's what we digitize and take away from the clipboard: - Safety Procedures - Environmental Checklists - Tooling & Gauge Reporting - Maintenance Procedures - Auditing/Inspection Workflows - Training Checklists We allow plant managers to become more efficient operators by delivering real-time business insights from the field. MongoDBMongoDB is the leading modern, general purpose database platform, designed to unleash the power of software and data for developers and the applications they build. Headquartered in New York, MongoDB has more than 33,000 customers in over 100 countries. The MongoDB database platform has been downloaded over 240 million times and there have been more than 1.5 million registrations for MongoDB University courses.NooksNooks is an intelligent virtual salesfloor and dialer designed to elevate the performance of SDR and BDR teams, leading to a 2-3x increase in their pipeline. The platform facilitates team training, enhances conversion rates, and multiplies connect rates, all within an engaging and enjoyable environment. Owner.comOwner is the comprehensive platform designed to streamline the management of a restaurant's digital presence. We empower restaurant owners to regain full control over their establishments on the web. Our product serves as a strategic tool, enabling owners to reclaim authority from large corporations that may compromise customer relationships and impose unfair fees. With Owner, restaurant owners can truly own their digital presence and navigate the online landscape with confidence.Placer.aiPlacer.ai provides instant access to location analytics derived from the foot traffic of millions of consumers, delivering visibility into offline behavior. We shed light into churn, trade areas, untapped audiences, out-of-store behavior, and competitive benchmarking.Power Home RemodelingWhat makes Power one of the highest-rated workplaces in the country? Is it being the largest and most sustainable residential remodeler in the nation? Is it our unlimited growth opportunities and earning potential? Is it our award-winning experiences and perks? While those certainly contribute to our success, Power’s X-factor is an unwavering commitment to prioritize employee happiness above profit. REVGENWe work with our clients to apply a proven system in a way that represents our customers through unique and enjoyable interactions. Which, in turn, results in additional sales-qualified-leads. Our mission is to develop skilled sales individuals who represent our customers through unique and enjoyable interactions. Rocket MortgageRocket Mortgage® is the home loan experience designed for you. #RocketCanSBI, The Growth AdvisorySBI Growth is a dynamic and forward-thinking company that holds a prominent position in the world of business and technology consulting. As an organization deeply committed to driving growth and success for its clients, SBI Growth offers a compelling environment for prospective employees to thrive and make a significant impact. With a strong emphasis on innovation, collaboration, and expertise, SBI Growth fosters a culture that values and nurtures talent, empowering individuals to unleash their full potential. By providing comprehensive and cutting-edge solutions tailored to meet the unique needs of each client, SBI Growth enables its employees to be at the forefront of transformative change in industries ranging from finance and healthcare to technology and beyond. Joining SBI Growth means joining a team of passionate professionals dedicated to driving excellence and delivering exceptional results, making it an exciting opportunity for those seeking a challenging and rewarding career in the consulting industry.SPS CommerceSPS Commerce is the world’s leading retail network, connecting trading partners around the globe to optimize supply chain operations for all retail partners. We support data-driven partnerships with innovative cloud technology, customer-obsessed service, and accessible experts so our customers can focus on what they do best. To date, more than 105,000 companies in retail, distribution, grocery, and e-commerce have chosen SPS as their retail network. SPS has achieved 85 consecutive quarters of revenue growth and is headquartered in Minneapolis. For additional information, contact SPS at 866-245-8100 or visit www.spscommerce.com.YipitdataYipitData is the leading market research firm for the disruptive economy. We analyze billions of data points every day to provide accurate, detailed insights on ridesharing, e-commerce marketplaces, payments and more. Our on-demand insights team uses proprietary technology to identify, license, clean and analyze the data many of the world’s largest investment funds and corporations depend on.'''
