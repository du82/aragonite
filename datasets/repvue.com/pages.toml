full_description = "Copyright PolicyLast Updated: May 25th, 2023Reporting Claims of Copyright InfringementWe take claims of copyright infringement seriously. We will respond to notices of alleged copyright infringement that comply with applicable law. If you believe any content or materials accessible on or from any RepVue website (collectively, the“Website”) infringe your copyright, you may request removal of those materials (or access to them) from the Website by submitting written notification to our Copyright Agent (designated below). In accordance with the Online Copyright Infringement Liability Limitation Act of the Digital Millennium Copyright Act (17 U.S.C. § 512) (“DMCA”), the written notice (the “DMCA Notice”) must include substantially the following:Your physical or electronic signature.Identification of the copyrighted work you believe to have been infringed or, if the claim involves multiple works on the Website, a representative list of such works.Identification of the material you believe to be infringing in a sufficiently precise manner to allow us to locate that material.Adequate information by which we can contact you (including your name, postal address, telephone number and, if available, e-mail address).A statement that you have a good faith belief that use of the copyrighted material is not authorized by the copyright owner, its agent or the law.A statement that the information in the written notice is accurate.A statement, under penalty of perjury, that you are authorized to act on behalf of the copyright owner.Our designated Copyright Agent to receive DMCA Notices is:RepVue, Inc.Legal Department510 Meadowmont Village Circle #228Chapel Hill, NC 27517(919) 302-7025info@repvue.comCounter-Notification ProceduresIf you believe that material you posted on the Website was removed or access to it was disabled by mistake or misidentification, you may file a counter-notification with us (a “Counter-Notice”) by submitting written notification to our copyright agent (identified below). Pursuant to the DMCA, the Counter-Notice must include substantially the following:Your physical or electronic signature.An identification of the material that has been removed or to which access has been disabled and the location at which the material appeared before it was removed or access disabled.Adequate information by which we can contact you (including your name, postal address, telephone number and, if available, e-mail address).A statement under penalty of perjury by you that you have a good faith belief that the material identified above was removed or disabled as a result of a mistake or misidentification of the material to be removed or disabled.A statement that you will consent to the jurisdiction of the Federal District Court for the judicial district in which your address is located (or if you reside outside the United States for any judicial district in which the Website may be found) and that you will accept service from the person (or an agent of that person) who provided the Website with the complaint at issue.Completed Counter-Notices should be sent to:RepVue, Inc.Legal Department510 Meadowmont Village Circle #228Chapel Hill, NC 27517(919) 302-7025info@repvue.comThe DMCA allows us to restore the removed content if the party filing the original DMCA Notice does not file a court action against you within ten business days of receiving the copy of your Counter-Notice. Please be aware that if you knowingly materially misrepresent that material or activity on the Website was removed or disabled by mistake or misidentification, you may be held liable for damages (including costs and attorneys’ fees) under Section 512(f) of the DMCA.Repeat InfringersIt is our policy in appropriate circumstances to disable and/or terminate the accounts of users who are repeat infringers. We generally will treat a user as a repeat infringer if the user has been notified of infringing activity more than twice and/or has had a user submission removed from the Website more than twice."
