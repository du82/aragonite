ng the deaths of two high school friends who were gunned down in an act of road rage. This tragedy sparked a passion in Rick to seek new technologies that would enable people to protect themselves without deploying lethal force. Our connected body-worn camera technology and evidence-management cloud are designed to help police officers work efficiently actively and transparently. Axon’s mission from the start has been to make the bullet obsolete, reduce social conflict and ensure criminal justice systems are fair and effective. BuildOpsFor modern commercial specialty contractors, BuildOps is the ultimate all-in-one management software, providing a comprehensive solution that streamlines service, project management, and more. With a focus on trade contractors, BuildOps simplifies invoicing, billing, scheduling, estimates, proposals, payments, workflows, custom forms, financial reporting, and other critical functions in one convenient SaaS platform. By utilizing BuildOps, commercial service contractors can boost their profit margins, increase cash flow, and impress customers with ease. Founded in 2018 and backed by world-class institutional investors, including Founders Fund, Next47 (Siemens), and Global Founders Capital, BuildOps is privately held and veteran-owned. Visit BuildOps.com to learn more about how this platform can help you take your career to the next level.BullhornBullhorn is the global leader in software for the recruitment industry. More than 10,000 companies rely on Bullhorn’s cloud-based platform to power their recruitment processes from start to finish. Headquartered in Boston, with offices around the world, Bullhorn is founder-led and employs more than 1200 people globally. To learn more, visit www.bullhorn.com or follow @Bullhorn on Twitter.Constructor.io​​Constructor is the only AI product discovery platform designed explicitly for ecommerce retailers. Unlike other product search and discovery platforms, machine learning is in Constructor’s DNA, bringing dynamic personalization to the customer experience. Constructor's cloud-based solutions use natural language processing, machine learning, and collaborative personalization to deliver powerful user experiences across all facets of product discovery—from search to browse, recommendations, collections, and autosuggest.CrowdStrikeCrowdStrike, a global cybersecurity leader, has redefined modern security with one of the world’s most advanced cloud-native platforms for protecting critical areas of enterprise risk – endpoints and cloud workloads, identity and data. Powered by the CrowdStrike Security Cloud, the CrowdStrike Falcon® platform leverages real-time indicators of attack, threat intelligence, evolving adversary tradecraft and enriched telemetry from across the enterprise to deliver hyper-accurate detections, automated protection and remediation, elite threat hunting and prioritized observability of vulnerabilities. Purpose-built in the cloud with a single lightweight-agent architecture, the Falcon platform enables customers to benefit from rapid and scalable deployment, superior protection and performance, reduced complexity and immediate time-to-value.EliseAIEliseAI is a machine learning tech firm headquartered in New York City. Our goal is to develop conversational artificial intelligence that revolutionizes vital industries like housing and healthcare. Through robust and flexible AI solutions, we enable businesses to achieve significant operational efficiencies, expanding their capacity to reach and assist more individuals.EpicorWe’re here for the hard-working businesses that keep the world turning. They’re the companies who make, move, and sell the things we all need. They trust Epicor to help them do business better. Their industries are our industries, and we understand them better than anyone. By working hand-in-hand with our customers, we get to know their business almost as well as they do. Our innovative solution sets are carefully curated to fit their needs, and built to respond flexibly to their fast-changing reality. We accelerate every customer’s ambitions, whether to grow and transform, or simply become more productive and effective. That’s what makes us the essential partners for the world’s most essential businesses.FieldPulseIf you're looking to streamline your field service business, FieldPulse is an all-in-one application that can help you cut down on administrative tasks and paperwork. With features such as job scheduling, itemized estimates and invoices, and mobile payment processing, FieldPulse can help you improve your team's efficiency and keep them on-track. Additionally, you can manage customer information, track assigned tasks, and keep detailed records of past jobs and invoices. With FieldPulse, you can focus on growing your career while knowing your customers better than ever before.FigmaFigma is a design platform for teams who build products together. Born on the Web, Figma helps teams create, share, test, and ship better designs from start to finish. Whether it’s consolidating tools, simplifying workflows, or collaborating across teams and time zones, Figma makes the design process faster, more efficient, and fun while keeping everyone on the same page.GitHubGitHub is the best place to share code with friends, co-workers, classmates, and complete strangers. Over 83 million people use GitHub to build amazing things together across 200+ million repositories. With all the collaborative features of GitHub, it has never been easier for individuals and teams to write faster, better code.HudlHudl is an industry leader in performance analysis software and hardware, empowering more than 200K teams in 40+ sports worldwide to achieve their goals with best-in-class video and data technology. A complete suite of video and data products ensures coaches have the insights they need and athletes get the shot they deserve.IntuitiveIntuitive (Nasdaq: ISRG), headquartered in Sunnyvale, Calif., is a global technology leader in minimally invasive care and the pioneer of robotic-assisted surgery. At Intuitive, we believe that minimally invasive care is life-enhancing care. Through ingenuity and intelligent technology, we expand the potential of physicians to heal without constraints. Intuitive brings more than two decades of leadership in robotic-assisted surgical technology and solutions to its offerings, and develops, manufactures, and markets the da Vinci surgical system and the Ion endoluminal system.KlaviyoKlaviyo (NYSE: KVYO) is the only CRM built for B2C brands. Powered by its built-in data platform and AI insights, Klaviyo combines marketing automation, analytics, and customer service into one unified solution, making it easy for businesses to know their customers and grow faster. Klaviyo (CLAY-vee-oh) helps relationship-driven brands like Mattel, Glossier, Core Power Yoga, Daily Harvest and 167,000+ others deliver 1:1 experiences at scale, improve efficiency, and drive revenue.MaintainXMaintainX is the world-leading mobile-first workflow management platform for industrial and frontline workers. We are a modern IoT-enabled cloud-based tool for maintenance, safety, and operations on equipment and facilities. MaintainX helps businesses track reactive and preventive maintenance and control the daily operations, such as safety inspections, quality inspections, and operating checklists—all with a digital audit trail Here's what we digitize and take away from the clipboard: - Safety Procedures - Environmental Checklists - Tooling & Gauge Reporting - Maintenance Procedures - Auditing/Inspection Workflows - Training Checklists We allow plant managers to become more efficient operators by delivering real-time business insights from the field. MathWorksMathWorks is the leading developer of mathematical computing software. Engineers and scientists worldwide rely on its products to accelerate the pace of discovery, innovation, and development. MATLAB, the language of technical computing, is a programming environment for algorithm development, data analysis, visualization, and numeric computation. Simulink is a graphical environment for simulation and Model-Based Design for multidomain dynamic and embedded systems. MATLAB and Simulink are also fundamental teaching and research tools in the world's universities and learning institutions.NooksNooks is an intelligent virtual salesfloor and dialer designed to elevate the performance of SDR and BDR teams, leading to a 2-3x increase in their pipeline. The platform facilitates team training, enhances conversion rates, and multiplies connect rates, all within an engaging and enjoyable environment. PigmentPigment is dedicated to facilitating business teams in planning, decision-making, and adapting to change. Our mission involves integrating people, data, and processes into an intuitive platform, enabling teams to swiftly construct reliable strategic and operational business plans. With Pigment, businesses can proactively drive growth, respond to changes, and ensure the future resilience of their operations. PostmanPostman is the world’s leading API platform. Postman's features simplify each step of building an API and streamline collaboration to help create better APIs—faster. More than 20 million developers and 500,000 organizations across the globe use Postman today. VantaOur mission at Vanta is to be a layer of trust on top of cloud services, to secure the internet, increase trust in software companies, and keep consumer data safe. Think of us as your automated security and compliance expert. WizOrganizations of all sizes and industries use Wiz to rapidly identify and remove the most critical risks in AWS, Azure, GCP, OCI, Alibaba Cloud and Kubernetes so they can build faster and more securely.'''
