nter;align-items:center;-webkit-align-self:stretch;-ms-flex-item-align:stretch;align-self:stretch;display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;box-sizing:border-box;}.css-1xc3v61-indicatorContainer{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-transition:color 150ms;transition:color 150ms;color:hsl(0, 0%, 80%);padding:8px;box-sizing:border-box;}.css-1xc3v61-indicatorContainer:hover{color:hsl(0, 0%, 60%);}.css-8mmkcg{display:inline-block;fill:currentColor;line-height:1;stroke:currentColor;stroke-width:0;}Reppy Winners ListTop Rated for Inbound Lead / Opportunity FlowChange ListSCORING CATEGORIESOverallProfessional DevelopmentCulture & LeadershipProduct-Market FitIncentive Comp StructureInbound Lead / Opportunity FlowDiversity & InclusionCITIESAtlantaAustinBostonCharlotteChicagoCincinnatiDallasDenverDublinHelsinkiHoustonIndianapolisLondonLos AngelesMelbourneMiamiMinneapolisNew YorkParisPhiladelphiaPhoenixPortlandRaleigh-DurhamSalt Lake CitySan DiegoSan FranciscoSan JoseSanta BarbaraSeattleSt. LouisSydneyTampaTel AvivTorontoVancouverWashington DCFUNDING TYPEBootstrappedPrivate EquityPublicVenture Capital BackedCOMPANY SIZESmallMid-SizedLargeTop Rated Inbound Lead / Opportunity Flow CompaniesWe’ve awarded these sales organizations for having outstanding inbound lead flow. According to sales reps, these companies generate a consistent stream of high-quality leads, enabling their sales teams to focus on closing deals and driving revenue. Companies must have a minimum of 20 ratings in the last 12 months to qualify.AlphaSightsAlphaSights is the global leader in knowledge on-demand. We connect investment and business leaders with a dynamic network of industry professionals whose informed perspectives help our clients make superior investment and business decisions. With 1,500+ employees and nine offices across the US, Europe, Middle East, and Asia, AlphaSights regularly ranks as one of the fastest-growing companies in the world. Our leading knowledge-on-demand platform combines human intelligence, cutting-edge technology, rigorous compliance, and an end-to-end service spectrum. We work with our clients to identify their research needs and recommend expert interviews, bespoke projects, B2B surveys, and instant-access content to fill their precise knowledge gaps.BuildiumBuildium is the only property management solution that helps real estate professionals win new business from property owners and community associations seeking services. Backed by expert advice and relentless support, Buildium enables you to outperform across all facets of your business with intuitive software that balances power, simplicity, and ease of use. Buildium services customers in more than 50 countries, totaling over 2 million residential units under management.BuildOpsFor modern commercial specialty contractors, BuildOps is the ultimate all-in-one management software, providing a comprehensive solution that streamlines service, project management, and more. With a focus on trade contractors, BuildOps simplifies invoicing, billing, scheduling, estimates, proposals, payments, workflows, custom forms, financial reporting, and other critical functions in one convenient SaaS platform. By utilizing BuildOps, commercial service contractors can boost their profit margins, increase cash flow, and impress customers with ease. Founded in 2018 and backed by world-class institutional investors, including Founders Fund, Next47 (Siemens), and Global Founders Capital, BuildOps is privately held and veteran-owned. Visit BuildOps.com to learn more about how this platform can help you take your career to the next level.Eli LillyFor more than a century, we have stayed true to a core set of values – excellence, integrity, and respect for people – that guide us in all we do: discovering medicines that meet real needs, improving the understanding and management of disease, and giving back to communities through philanthropy and volunteerism. GatekeeperGatekeeper is a cloud-based contract and supplier management platform that operates on any device, focusing on collaboration and ease of use. With a zero-training mantra, the platform prioritizes usability, ensuring that both internal stakeholders and suppliers can effortlessly use the platform to track obligations and compliance, receive email alerts, and access clear actionable data. This focus on usability and collaboration makes Gatekeeper a key player in advancing careers in the supplier management field.GoDaddyGoDaddy helps the world easily start, confidently grow, and successfully run an online presence. GoDaddy was born to give people an easy, affordable way to get their ideas online. Today, we have millions of customers around the world, but our goal hasn't changed. We’re here to help people easily start, confidently grow and successfully run their own ventures - online and off!Goldman Sachs GroupAt Goldman Sachs, we believe progress is everyone’s business. That’s why we commit our people, capital and ideas to help our clients, shareholders and the communities we serve to grow. Founded in 1869, Goldman Sachs is a leading global investment banking, securities and investment management firm. Headquartered in New York, we maintain offices in all major financial centers around the world. GustoOur customers come from all walks of life and so do we. We hire great people from a wide variety of backgrounds, not just because it's the right thing to do, but because it makes our company stronger. If you share our values and our enthusiasm for small businesses, you will find a home at Gusto. Gusto is a modern, online people platform that helps small businesses take care of their teams. On top of full-service payroll, Gusto offers health insurance, 401(k)s, expert HR, and team management tools. Today, Gusto offices in Denver, San Francisco, and New York serve more than 200,000 businesses. HeadwayHeadway is building a new mental healthcare system that everyone can access. We make it easy for people to find quality in-network mental health care by removing historic barriers faced by mental health providers, payers, and patients. 1 in 4 people in the US have a treatable mental health condition, but the vast majority do not get the care they need. The primary reason is cost: the majority of therapists do not accept insurance, meaning paying for therapy is prohibitively expensive for prospective patients. This is where we got our start – Headway has built the first software-enabled network of therapists who accept health insurance, making it easy for therapists to grow their practices, and possible for patients to find quality care they can afford. IdealsIdeals offers a comprehensive Virtual Data Room (VDR) solution that simplifies secure sharing of confidential documents and streamlines corporate deal management, particularly during M&A and similar transactions. Established in 2008, we've built our company on the pillars of service excellence and technological innovation. Trusted by over 1,000,000 users from 175,000 companies globally, we are on a mission to create more prosperity in the world by accelerating high-stake business decisions.JobberAward-winning job tracking and customer management software for home service businesses. Jobber’s 160K+ home service professionals have served over 12 million households in more than 47 countries, and invoiced for over $15 billion in services. We continually rank as one of Canada’s fastest-growing and most innovative companies by Canadian Business and Macleans, The Globe and Mail, Fast Company, and Deloitte.MaintainXMaintainX is the world-leading mobile-first workflow management platform for industrial and frontline workers. We are a modern IoT-enabled cloud-based tool for maintenance, safety, and operations on equipment and facilities. MaintainX helps businesses track reactive and preventive maintenance and control the daily operations, such as safety inspections, quality inspections, and operating checklists—all with a digital audit trail Here's what we digitize and take away from the clipboard: - Safety Procedures - Environmental Checklists - Tooling & Gauge Reporting - Maintenance Procedures - Auditing/Inspection Workflows - Training Checklists We allow plant managers to become more efficient operators by delivering real-time business insights from the field. MathWorksMathWorks is the leading developer of mathematical computing software. Engineers and scientists worldwide rely on its products to accelerate the pace of discovery, innovation, and development. MATLAB, the language of technical computing, is a programming environment for algorithm development, data analysis, visualization, and numeric computation. Simulink is a graphical environment for simulation and Model-Based Design for multidomain dynamic and embedded systems. MATLAB and Simulink are also fundamental teaching and research tools in the world's universities and learning institutions.monday.comThe monday.com Work OS is an open platform that democratizes the power of software so organizations can easily build work management tools and software applications to fit their every need. The platform intuitively connects people to processes and systems, empowering teams to excel in every aspect of their work while creating an environment of transparency in business. monday.com has teams in Tel Aviv, New York, San Francisco, Miami, Chicago, London, Kiev, Sydney, São Paulo, and Tokyo. The platform is fully customizable to suit any business vertical and is currently used by over 152,000 customers across over 200 industries in 200 countries.Monte Carlo DataMonte Carlo is a data observability platform that ensures your team is the first to know and solve data breaks, reducing data downtime and improving business value. With hundreds of data teams experiencing broken dashboards, poorly trained ML models, and inaccurate analytics, Monte Carlo's end-to-end data observability empowers data teams to focus on what matters most by eliminating time-wasting fire-drills and outdated data governance software. Join the data reliability movement and accelerate the world's adoption of data with Monte Carlo's commitment to making data reliable, customers' lives easier, and working with the broader data community to realize the full potential of data. Aspiring tech professionals looking for a rewarding career in the data industry can consider joining Monte Carlo's mission to reduce data downtime and promote reliable data.NooksNooks is an intelligent virtual salesfloor and dialer designed to elevate the performance of SDR and BDR teams, leading to a 2-3x increase in their pipeline. The platform facilitates team training, enhances conversion rates, and multiplies connect rates, all within an engaging and enjoyable environment. Owner.comOwner is the comprehensive platform designed to streamline the management of a restaurant's digital presence. We empower restaurant owners to regain full control over their establishments on the web. Our product serves as a strategic tool, enabling owners to reclaim authority from large corporations that may compromise customer relationships and impose unfair fees. With Owner, restaurant owners can truly own their digital presence and navigate the online landscape with confidence.RampRamp is building the next generation of finance tools – from corporate cards and expense management, to bill payments and accounting integrations – designed to save businesses time and money with every click. Thousands of companies are spending an average of 3.3% less and closing their books 86% faster by switching to Ramp's finance automation platform. Founded in 2019, Ramp powers the fastest-growing corporate card in America and enables billions of dollars of purchases each year on the heels of nearly 10x year-over-year growth. Triple WhaleAll your data in one easy-to-use dashboard. We’re building the operating system for eCom. WorkableAt Workable, we know that when you make a great hire, you’re really making it possible for your company to do greater things. So we help you hire the greatest, every time. How? To start, Workable helps you get more qualified candidates by sharing your job with everyone who’s right for it. With one-click posting to 200+ job sites, AI-powered sourcing, employee referrals and more, you’ll reach those best-fit candidates actively looking for work, those who may not be looking and even those your other successful hires already know.'''
