title = "Nomadic Labs - TPS evaluation for Tezos"
description = "An analysis of Tezos throughput"
full_description = "In this post we are going to try to answer the question “what is the throughput of Tezos on the Mainnet” by examining the subject from different angles. First, we must note that there is no standard methodology for measuring the throughput of a blockchain. In general, people want to know the number of transactions per second (TPS) that a blockchain can process. There are, however, a few questions that need to be answered first: The last point is an important one because, all things being equal, TPS of a blockchain can change over time depending on the transactions users tend to perform. Let’s take a closer look. In the first case the cost (both in gas and in terms of processing power) is constant no matter the amount being transferred and other parameters. In the second case, however, the cost and the performance of such a transaction is going to depend on the code of the smart contract in question. It follows, that in order to determine the TPS, one needs to know the proportions of different kinds of transactions in the typical block. The best way to achieve that is to analyze the history of performed transactions. We choose to use the Tezos indexer to do that. The tool stores Tezos’s transaction history in a Postgresql database, which we can query and analyze. The result is a JSON file such as this one: Here, we can see that in the first two months of 2022 there were 5026035 transactions that had an implicit contract as their destination and the most popular smart contract at the time was KT1RJ6PbjHpwc3M5rw5s2Nbmefwbuwbdxton (Hic et Nunc NFTs) with 1611069 calls. For now, we include only smart contracts that are involved in at least 10% of all transactions, but this threshold can be changed. Having this data, we can run gas estimations for regular transfers and smart contracts calls in order to calculate the average transaction cost. It is possible to perform a TPS estimation based on the maximal allowed gas consumption per block. Transactions in a block cannot exceed hard_gas_limit_per_block, which is a protocol parameter; its value (on the master branch) is 5200000. With Tenderbake, in the best case scenario a block will be decided at round 0, therefore, according to the current value of minimal_block_delay, the maximal block production rate is 1 block per 30 seconds. Next, we can use the average transaction cost that we have obtained through analysis of transaction data to determine TPS as:"
