["https://research-development.nomadic-labs.com/a-tale-of-two-reductions-in-gas-consumption-in-tezos.html"]
title = "Nomadic Labs - A tale of two reductions in gas consumption in Tezos"
full_description = "This is normal: incremental development separates concerns so we can properly deal with each of them. We’d like to share with you two tales of making Tezos faster in Granada by following the motto above:1 Both tales are set after the “make it right” stage and during the “make it fast” stage. The code was clean (and we wanted to keep it that way); we just wanted to increase performance. With these two optimizations, Granada — the latest, and recently-accepted, amendment proposal of Tezos economic protocol — executes smart contracts with much better gas consumption.2 For example, a typical call to Dexter entrypoint XtzToToken consumes roughly Tezos executes smart contracts in Michelson, a strongly-typed low-level language.4 Roughly speaking, when provided with Monads are how functional programmers deal with effectful computation, meaning programs that may compute a return value and also have side-effects on the ambient world as they do so (input/output, token transfers, etc). The impatient reader is welcome to skip forward to our toy MichelBaby interpreter and return to this subsection for reference if required, especially when the reader sees us mention bind later. A monad is a type-constructor, meaning that given a type t and a monad monad, we have a type t monad. There are many different monads — e.g. the error monad, the state monad, and the Lwt (lightweight threads) monad — but for the purposes of this blog post, these all just represent actions on some state machine.5 Thus t monad is a type for computations that compute a t while exerting side-effects on a state monad monad. return : 'a -> 'a monad This inputs a value of type 'a and returns that same value, in an empty (or initial) state. bind : 'a monad -> ('a -> 'b monad) -> 'b monad This binds a stateful computation from 'a to 'b, to an input 'a-in-state, thus obtaining an output 'b-in-state. C, Java, or Python have monads, or more precisely one monad: a single “global state monad” which represents how the actual state of the computer changes as it executes instructions. Since in these languages the global state monad permeates all computation, it need not be mentioned explicitly — but it is still there, as you can check: just run a virtual machine, take a snapshot, et voilà your global state is saved to disk as a datum."
