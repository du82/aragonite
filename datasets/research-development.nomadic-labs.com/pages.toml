["https://research-development.nomadic-labs.com/from-jakarta-to-kathmandu-non-stop.html"]
title = "Nomadic Labs - From Jakarta to Kathmandu non-stop"
description = 'A preview to our upcoming protocol proposal "Kathmandu"'
full_description = "This is a joint post from Nomadic Labs, Marigold, TriliTech, Oxhead Alpha, Tarides, DaiLambda, Functori & Tweag. The Tezos community is preparing for exciting new developments in the coming days: the activation of the Jakarta protocol upgrade will be the first step towards massive scalability, with the introduction of the first Tezos Layer 2 solution: Transaction Optimistic Rollups, or TORUs. Today we look a bit further ahead. However beautiful and lively a port Jakarta is, the Tezos protocol’s path to scalability doesn’t stop there. After mending our sails and reloading our batteries, we are eager to present to the community what’s next in our pipeline. We hope you brought your mountain gear with you – next stop is Kathmandu. In this article we give you a preview of the different projects that have kept us busy in the last months. We will describe the features which, after some stabilization in the coming weeks, are likely to be part of Kathmandu, Tezos’ 11th protocol upgrade proposal. But, first we will focus on Smart Contract Optimistic RollUps (aka SCORUs), our next Layer 2 scalability solution, and how big new features like this one require us to rethink the development process for protocol upgrades. As we hinted in an earlier scalability preview, SCORUs provide a generic infrastructure to implement any computational device, as long as its semantics can be described as a Proof-producing Virtual Machine (PVM), in the Tezos protocol. This design allows us to continuously develop and deploy new supported PVMs, and thereby new execution environments, via protocol amendments. In our upcoming protocol proposal, we plan to introduce a first PVM supporting WebAssembly (WASM) — although only available via bleeding-edge test networks. WebAssembly-based rollups come with a native token bridge based on Tickets, similar to the one used for TORUs, and with a bare-bones execution environment supporting token exchanges between Layer 1 and Layer 2, gas monitoring, and self-governance. On top of this infrastructure, users can write custom rollup kernels, ranging from application-specific rollups to full-scale “parachains”."
year_published = 2022
