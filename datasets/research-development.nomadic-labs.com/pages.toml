["https://research-development.nomadic-labs.com/smarter-contracts-thanks-to-delphi-part-12.html"]
title = "Nomadic Labs - Smarter contracts thanks to Delphi (part 1/2)"
full_description = "Delphi is the successor to the Carthage protocol. Delphi’s main difference from Carthage is that gas costs are lower, so that smart contracts can compute more before hitting the Delphi/Carthage per-operation gas limit of 1,040,000 gas units (gu). To recap: gas limits guarantee that block validators only need a fraction of the time interval between blocks to validate a new block. The exact fraction depends on the speed of the node’s hardware. Tezos tries to be inclusive, so we want even slow hardware to be able to sync the chain in real time. overestimating gas costs prevents developers from writing more interesting contracts, while underestimating these costs leads to possible attacks. It is important to get this right. A transfer calls a smart contract by invoking it along with a parameter. The Tezos protocol then executes1 the smart contract code, passing it two inputs: The Tezos protocol uses three distinct formats to represent Michelson scripts and values, listed here in increasingly higher levels of abstraction: When a Tezos smart contract is called — either due to some initial call to it, or as a consequence of working through a queue of accumulated operations e.g. from step 8 below — the Tezos protocol performs the following steps: Each of the execution steps above could take arbitrary time, so to guarantee that nodes can check the validity of operations in reasonable time, the protocol imposes a hard limit on computation and considers as invalid any operations that exceed it. This limit cannot just be a timeout: then fast nodes would have different valid operations than slower ones — and the network would not reach consensus. Instead, we rely on gas; a hardware-independent abstraction of the time needed to validate operations that is built in to the Tezos protocol. Here are the usual reasons we consume gas (relative weights depend on the smart contract being executed): Gas prevents overlong operations, so the chain’s security depends on good estimates of how long each task above will take:"
