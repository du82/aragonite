["https://research-development.nomadic-labs.com/edo-the-latest-tezos-upgrade-is-live.html"]
title = "Nomadic Labs - Edo, the latest Tezos upgrade, is LIVE"
full_description = "On 13 February 2021, the Tezos blockchain successfully upgraded by adopting Edo at block 1,343,489. Jointly developed by Nomadic Labs, Marigold, DaiLambda, and Metastate, Edo is the fifth Tezos upgrade in the span of two years, and follows the Delphi upgrade of three months ago. The Tezos blockchain currently allows protocol upgrades every several months, and we intend for the foreseeable future to take advantage of every such opportunity, rapidly incorporating the best available technology into Tezos. Most cryptocurrency networks lack a mechanism to decide on the content of technical upgrades. By contrast, Tezos’ on-chain self-governance and self-amendment mechanisms allow it to evolve in a way that respects the expressed preferences of its users. A full list of the changes in Edo can be found on this documentation page. To summarize, however, the upgrade contains some minor bug fixes, some improvements to performance and gas consumption, the addition of a new period (named the “Adoption Period”) to the upgrade process, and two important new features that we have been working on for some time: Sapling, and Tickets. Sapling is a protocol originally developed by the Electric Coin Company. Edo allows smart contract developers to easily integrate Sapling in their smart contracts, enabling new types of applications such as voting or supporting asset transactions with selective disclosures. Tickets are another substantial improvement in Tezos. Tickets are currently experimental and should not be used in mission-critical contracts until we have completed our ongoing audit of its implementation. Tickets are a convenient mechanism for smart contracts to grant portable permissions to other smart contracts or to issue tokens. While it’s possible to achieve this with existing programming patterns, tickets make it much easier for developers to write secure and composable contracts, and we expect to see extensive use of tickets after the feature has stabilized. Just like any other feature of the protocol, Tezos protocol amendments may make changes to the amendment process itself. The “Adoption Period” (sometimes referred to as the “Fifth Period”) is an important improvement to the governance mechanism we have wanted to make for some time."
year_published = 2021
