["https://research-development.nomadic-labs.com/files/cryptography.html"]
title = "Cryptography Projects at Nomadic Labs / Tezos"
description = "Cryptography Projects at Nomadic Labs / Tezos"
full_description = "Cryptography projects at Nomadic Labs focus on the design and implementation of new cryptography and its integration in the Tezos blockchain. Epoxy is a validity rollup framework integrated as a first class citizen in the Tezos economic protocol that allows the origination of a large class of applications. Thanks to aPlonK, Epoxy can reach high tps by aggregating multiple proofs. Furthermore, the content of rollup operations can be kept private with respect to the blockchain - only the operator processing the L2 operations knows their content. aPlonK is a PlonK-inspired proving system which focuses on proof-aggregation and distributed proof generation. It's an OCaml implementation from scratch of the PlonK proving system based on the bls12-381 curve, which eases the integration of new custom gates and lookup tables. Instead of the classic KZG commitment scheme, our custom aggregation protocol can verify multiple proofs in logarithmic time. Plompiler is a monadic Domain Specific Language embedded in OCaml that can be used to build circuits for aPlonK. Programs written in Plompiler are typed to increase safety and can be compiled to their circuit representations or interpreted directly in OCaml for testing. Together with the circuit, Plompiler also returns an efficient one-pass solver that given an input finds a valid assignment for the wires of the circuit. Additionally, Plompiler contains a generic optimizer capable of significantly reducing the size of commonly developed circuits. Flamegraphs can be generated to inspect the generated circuits and guide the optimization of each primitives. The library also features a highly performant set of primitives for hashing (Poseidon and Anemoi) and signing. In 2022, Tezos' protocol Kathmandu improved the randomness generation based on its RANDAO scheme by integrating an additional VDF phase. This work was built on top of Chia's VDF library which implements Wesolowski's scheme. Sapling is a protocol enabling privacy preserving transactions of fungible tokens in a decentralized environment. It was designed and implemented by the Electric Coin Company building on the seminal Zerocoin paper. In 2019, Tezos protocol Edo integrated the Sapling protocol by extending the Michelson smart contract language, allowing for the exchange of digital assets in a privacy preserving way."
year_published = 2025
