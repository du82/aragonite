["https://research-development.nomadic-labs.com/improving-the-implementation-of-cryptography-in-tezos-octez.html"]
title = "Nomadic Labs - Improving the implementation of cryptography in Tezos Octez"
full_description = "A safety-critical program is only as trustworthy as the libraries it relies on, so we at Nomadic Labs pay close attention to our tools and dependencies — i.e. to our toolchain. Our toolchain is based on HACL*; a verified library of cryptographic primitives, which include the hash functions which are the backbone of blockchain technology (principally: Blake2), and the digital signatures which we use to assure transaction authenticity (Ed25519, P-256, and secp256k1 2). In this blog post, we’ll discuss recent improvements to our cryptography toolchain, and how we integrated them into practical OCaml programming of the Tezos Octez implementation. Namely: HACL* is a cryptographic library1 offering a comprehensive collection of cryptographic primitives (we give three examples below). HACL* is complex, safety-critical code. Accordingly, it is written in and formally verified using the F* language, and then extracted (compiled) to correct and efficient C using KreMLin, a tool which translates a subset of F* to C. KreMLin also facilitates using the generated C code in OCaml projects — such as the Tezos Octez implementation — by automatically building the scaffolding that developers would otherwise write themselves. The point of this toolstack is that it gives us three important properties which it is far from trivial to reconcile: The Tezos Octez implementation has been using HACL* since before its launch, and Nomadic Labs has been actively supporting the continued development of HACL*: via grants to the Prosecco team at Inria Paris; and through the work of engineers at Nomadic. HACL* offers implementations for all but one2 of the core crytographic primitives used by the Nomadic Labs Octez implementation of Tezos. Let’s survey three examples, which are cryptographic primitives recently introduced into HACL* and relevant to the Tezos implementation: P-256 (also called secp256r1) is an elliptic curve signature algorithm and one of the three signature schemes supported in Tezos: P-256; Ed25519; and secp256k1. P-256 is a NIST standard with wide industry support. It allows interoperability with HSMs (hardware security modules), including hardware wallets and Apple’s Secure Enclave."
year_published = 2021
clearnet = "https://research-development.nomadic-labs.com/improving-the-implementation-of-cryptography-in-tezos-octez.html"
