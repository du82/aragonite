["https://research-development.nomadic-labs.com/oxford2-announcement.html"]
title = "Nomadic Labs - Announcing Oxford 2: a revised 15th protocol upgrade proposal"
description = "Refined Tezos PoS, new Timelocks and more!"
full_description = "This is a joint post from Nomadic Labs, Marigold, TriliTech, Oxhead Alpha, Tarides, DaiLambda & Functori. After the Oxford protocol upgrade proposal did not gather the required supermajority of affirmative votes in its promotion period vote, we presented an action plan centered around improving staking UX for bakers and furthering the continuous development of Smart Rollups and other features of the Tezos protocol, e.g. Timelocks. We thank bakers, infrastructure and application developers, and the Tezos ecosystem at large for their feedback, in particular towards the proposed changes in slashing and automated staked funds management for bakers. Today, we are pleased to announce that this revised Oxford 2 protocol proposal is ready to be submitted to the Tezos governance mechanism. The proposal’s hash is ProxfordYmVfjWnRcgjWH36fW6PArwqykTFzotUxRs6gmTcZDuH. In the sequel, we provide further detail on the main features of the Oxford 2 protocol upgrade proposal, and highlight key changes with respect to its predecessor, Oxford. First and foremost, the Oxford 2 proposal does not enable the activation of Adaptive Issuance, nor allows delegators to become stakers. A disabled feature flag has been introduced, which would prevent these features from activating in the protocol’s lifetime. The disabled feature flags signal our position that the feature is not yet mature enough to be activated on Tezos Mainnet, and we will continue working together with infrastructure builders to ensure that both the feature and the required ecosystem tooling support are ready soon. However, the feature activation vote introduced in the original Oxford proposal is still available to bakers: participation is still recorded by the Tezos protocol, but it does not take effect and can never activate the feature. We will reset the associated EMA to 0 in any future protocol proposal developed by us that enables the feature flag. The rationale behind this choice is twofold: first, bakers can manifest their attitude towards Adaptive Issuance and the new Staking mechanism in an informal manner, which is a useful signal. Second, this is a conservative approach which causes less friction to ongoing efforts to develop and test support for these features."
year_published = 2023
