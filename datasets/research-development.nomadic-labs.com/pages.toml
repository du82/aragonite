["https://research-development.nomadic-labs.com/kathmandu-is-live.html"]
title = "Nomadic Labs - Kathmandu, the latest Tezos upgrade, is LIVE!"
description = "Tezos has activated its eleventh protocol upgrade, Kathmandu."
full_description = "On September 23 2022 20:36:44 UTC, the Tezos blockchain successfully upgraded by activating the Kathmandu proposal at block #2,736,129. This 11th Tezos protocol upgrade was jointly developed by Nomadic Labs, Marigold, TriliTech, Oxhead Alpha, Tarides, DaiLambda, Functori, Tweag, and G.-B. Fefe (an anonymous contributor). A deeper technical description can be found in the protocol proposal’s technical documentation, and a complete list of changes is provided in Kathmandu’s changelog. As the Tezos network evolves, and new exciting features boost adoption, broad testing becomes increasingly important. Therefore, it is paramount to have as many bakers, builders and users as possible in our public test networks. By running nodes, producing blocks, and deploying apps and infrastructure as early as possible, the community can gain significant foresight into the integration of new features. In addition, protocol developers can learn valuable insights from feedback, and adjust the design and implementation of features while protocols are still being developed. In particular, extensive testing of next-generation optimistic rollups, currently available on Mondaynet and Dailynet, is of paramount importance, as these form the backbone of Tezos’ scaling strategy. Read more about Tezos testnets here, and don’t hesitate to reach out in the Tezos Developer Slack or in the Tezos Discord if you need help getting started."
