["https://research-development.nomadic-labs.com/next-generation-rollups.html"]
title = "Nomadic Labs - Why the next generation of optimistic rollups are a game-changer for Tezos"
description = "It’s not just about smart contracts and scaling. The next generation of optimistic rollups are a plug’n’play solution for running any software on Tezos"
full_description = "TL;DR: It’s not just about smart contracts and scaling. The next generation of optimistic rollups are a plug’n’play solution for running any software on Tezos. With the Jakarta upgrade and Transactions Optimistic Rollups successfully activated, it’s time to look ahead to the next major step in Tezos protocol development: Smart Contract Optimistic Rollups (SCORUs). These next-generation optimistic rollups don’t just enable smart contracts. They are a platform for running any type of software, including emulating the Ethereum Virtual Machine (EVM), and having all computation made verifiable on the Tezos blockchain. That is a game changer for Tezos functionality. As explained in the recent preview of the upcoming ‘Kathmandu’ protocol upgrade proposal, they will hit test networks soon, while mainnet activation is expected to be included in ‘L’ protocol upgrade proposal. For a general understanding of optimistic rollups and the rationale behind them as a scaling solution for Tezos, check out our blog post on this topic. See also our blog post on Transaction Optimistic Rollups (TORUs). Where TORUs have a fixed design focused on enabling higher transaction throughput while being highly decentralized, SCORUs can do whatever they are programmed to. Executing smart contracts is just one of many use cases. In fact, general computation optimistic rollups might have been a better description, but here we are. TORUs are limited to transactions due to a simpler design of this mechanism. If a commitment published by a node operator is wrong, an honest operator can neutralize it by broadcasting a single L1 operation containing proof. This one-step procedure means the proof must be small enough to be included in a single L1 operation, putting a limitation on the number and complexity of operations you can do between two commitments. Smart contract rollups remove this limitation by using a different, more advanced dispute mechanism. Rather than being settled in one operation, it works as an interactive process between two rollup node operators."
year_published = 2022
year_updated = 2022
