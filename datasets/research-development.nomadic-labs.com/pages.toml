["https://research-development.nomadic-labs.com/michelson-updates-in-005.html"]
title = "Nomadic Labs - Michelson updates in 005"
full_description = "As hinted at in a previous blog post, we’ve been working on improving different parts of the protocol, including our favourite smart contract language: Michelson. The changes made to Michelson in this proposal intend to simplify smart contract development by making the code of complex contracts simpler and cleaner. In particular: Some new instructions have been added in order to make Michelson a better compilation target for high level languages: Finally, a series of changes implement the new, cleaner, distinction between accounts and smart contracts as described in Cryptium Labs’ blog: We’re going to go through these in more details, but before we continue, you should know that some of these will introduce BREAKING CHANGES for application developers. The changes should NOT break or radically change the semantics of existing contracts. It may ONLY change the interface that they expose. As a consequence, shallow changes to the rest of your stack may be needed. If you maintain a tool relying on RPCs or binary formats, or are a contract writer, please test your tools. We tried to keep the changes as local and manageable as possible. More details are provided throughout this article and we will make forthcoming communications to aid this transition. Lightweight multiple entrypoints are one of the most important new features of this proposal, as they let you define extensible standard interfaces for smart contracts. Concretely, entrypoints leverage the annotation mechanism to call specific parts of the target smart contract code in an easy way. Entrypoints correspond to annotations in the input type of a Michelson contract, such as parameter (or (int %set_age) (string %set_name)). Entrypoints allow a contract to be seen as a collection of independent functions sharing a storage, and thus to call explicitly one of these functions. We call them lightweight because we’ve taken care of making very few changes to the language to preserve the semantics of existing contracts: an entrypoint is simply an annotation, in the parameter type of the contract, on the branch of interest in a tree of or types."
year_published = 2019
year_updated = 2019
