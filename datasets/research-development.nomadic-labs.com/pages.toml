title = "Nomadic Labs - Granada, the latest Tezos upgrade, is LIVE"
full_description = "On 6 August 2021, the Tezos blockchain successfully upgraded by adopting Granada at block #1,589,248. Granada was jointly developed by Nomadic Labs, Marigold, Oxhead Alpha, Tarides and DaiLambda. It follows the Florence protocol upgrade three months ago, and will be the seventh Tezos upgrade since Athens’ activation in May 2019 (overviews here and here). Granada includes several bug fixes and small improvements and includes the following substantive changes: Congratulations to everyone involved in the development of this amendment and welcome to the Tezos blockchain, Granada! We intend to inject our next proposal “H” before the end of September. It has yet more interesting features, large and small. Stay tuned, and happy baking!"
