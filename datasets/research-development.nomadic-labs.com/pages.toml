["https://research-development.nomadic-labs.com/fixing-the-sapling-protocol-integration.html"]
title = "Nomadic Labs - We Discovered a Flaw in the Sapling Protocol Integration — a fix is ready for J."
description = "A summary on the Sapling integration vulnerability and how it has been redesigned for Jakarta."
full_description = "Summary: A design flaw in the SAPLING_VERIFY_UPDATE Michelson opcode renders unshielding transactions from the shielded pools implemented in sapling_contract.tz malleable. This affects any deployment of this sample contract on the Tezos mainnet, and could potentially extend to other contracts following a similar pattern. We have implemented a new, strengthened, version of this primitive which should become the required opcode for safer integration of Sapling transactions in Michelson smart contracts. This new version will be available as a part of the upcoming J protocol proposal. In the meantime, we advise against originating new Sapling contracts on mainnet, and to avoid interacting with the existing contracts. This blog post follows a discussion in Tezos Agora, where a vulnerability is revealed in sapling_contract.tz, a sample Michelson smart contract distributed as a part of the test suite of the Tezos protocol. This flaw could potentially apply to other contracts implementing a similar pattern. The bug in the contracts arises from a design flaw in one of the Michelson opcodes provided to integrate Sapling transactions to Tezos smart contracts, SAPLING_VERIFY_UPDATE. That is, this is not a vulnerability in the Sapling protocol, its implementation, or even the implementation of the Michelson opcode per se. Instead, it is rather the result of its specification, and the provided interface, not being sufficiently strong to write safe smart contracts. Over the last few days, we have implemented a patch addressing this issue on tezos!4589, which will be included with the next protocol proposal for protocol J, strengthening the support for shielded transactions. In the meantime we advise the Tezos community to avoid originating new contracts creating shielded pools, and to avoid interacting with the deployed contracts. Even if we have not observed any exploit of this vulnerability, we are confident an attack is indeed plausible. A recent inspection of deployed contracts on the Tezos mainnet at level 2155024, reveals only 2 contracts originated using a copy of the vulnerable shielded pool implemented by sapling_contract.tz: KT1BUZy6x and KT1E3kx2W1. At the time of writing, the outstanding balance in the two shielded pools is under 6 tez. We recommend users to avoid interacting with them."
year_published = 2022
