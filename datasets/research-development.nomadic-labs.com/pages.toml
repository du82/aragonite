["https://research-development.nomadic-labs.com/three-questions-to-nomadic-labs-interns-julien-coolen.html"]
title = "Nomadic Labs - Three questions to Nomadic Labs interns — Julien Coolen"
full_description = "Each year we host around half-a-dozen interns (stagiaires), for periods of two to six months. These young men and women are usually studying or have just finished studying for undergraduate or Master’s degrees, and are eager to gain experience in the blockchain industry. Each has a unique story to tell about their individual interest in this technology. In this blogpost, we will ask three questions of one of our current interns: Julien Coolen (and a couple of questions of his mentors at Nomadic Labs). Julien — so happy to have you with us! We hope you’re having a wonderful and educational period with Nomadic Labs. We’d love to hear a bit about you and your activities chez nous … I am a first-year master’s student in cryptology (double master Mathématiques, Informatique de la cryptologie et sécurité) at the Université de Paris. I graduated in 2020 with bachelor’s degrees in Mathematics and Computer Science. Being fond of open research, open source, and formal verification, I tried to gain experience in these areas. In 2019 I worked as a system administrator intern to configure and deploy a digital library for my mathematics faculty. Then in 2020 a friend and I attempted to program and prove the correctness of an LL(1) parser using the Coq proof assistant. We thank Yann Régis-Gianas for this learning opportunity. Also in 2020, I developed features for an OCaml bot to simplify collaborative software development, under the supervision of Théo Zimmermann at Inria. I am developing a distributed hash table (DHT) for file sharing during a three-month internship from June to August 2021, under the supervision and mentorship of research engineers Vivien Pelletier and Julien Tesson at Nomadic Labs. A hash table is a key-value store; you need a key to retrieve each piece of stored information. However as your store grows you become limited by computer memory. The distributed nature of DHTs addresses this issue: the data is distributed around different computers on the internet. An example of a DHT is the IPFS distributed web."
year_published = 2021
