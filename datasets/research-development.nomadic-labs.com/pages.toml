["https://research-development.nomadic-labs.com/mumbai-preview.html"]
title = "Nomadic Labs - A faster and more scalable Tezos: A sneak peak at the Mumbai proposal"
description = "A joint post from Nomadic Labs, Marigold, TriliTech, Oxhead Alpha, Tarides, DaiLambda & Functori."
full_description = "This is a joint post from Nomadic Labs, Marigold, TriliTech, Oxhead Alpha, Tarides, DaiLambda & Functori. With the Lima upgrade set to activate on Dec 19, at block 2,981,889, let’s look ahead to what’s next for Tezos. For our 13th upgrade proposal to come in 2023, we will journey from Lima in the Pacific to the gateway of India in the Arabian Sea: Mumbai. There are 3 major innovations coming in the Mumbai upgrade proposal, in addition to other improvements. We recently wrote about how smart rollups are coming to Tezos, and with Mumbai they officially arrive. With the capabilities that Smart Rollups provide, the rails to reach 1 million TPS are in place. In addition, we are introducing Epoxy—our validity rollup (aka ZK-rollup) solution — on testnets. And lastly, Tezos is getting faster: we are reducing the block time to 15 seconds! The activation of smart rollups in Mumbai is the result of an intense year-long undertaking. Smart rollups offer a powerful scaling solution for Tezos, allowing anyone to deploy decentralized WebAssembly applications with dedicated computational and networking resources. Smart rollups have been available on the Mondaynet testnet since the Lima proposal, but have undergone a number of significant improvements in their design and implementation during the development of Mumbai. First, while in Lima each rollup had a dedicated inbox, in Mumbai there is only one global inbox shared by all rollups, which enables more use cases. Second, decentralized applications running on rollups can now retrieve information from a “reveal-data channel”, enabling access to data sources external to the inbox or even external to the Tezos blockchain. And third, smart rollups are forward compatible with the Data-Availability Layer (DAL), a data sharding feature that is in the works for improving scalability. Validity rollups (also known as ZK-rollups) are coming to Tezos starting with Mumbai (in addition to Smart Rollups). This will be introduced gradually over multiple upgrades. Our implementation of validity rollups is named Epoxy, and allows for instant finality due to SNARK’s proof-of-validity, as opposed to the “refutation game” used by Optimistic Rollups. Epoxy allows for applications to be built on Tezos which do not necessarily need to rely on Tezos’ Layer 1 to publish and distribute data, but rather can implement their own data availability layers. This will enable building privacy-preserving solutions which require keeping sensitive information (reified as part of their state or transactions) private from the public Layer 1."
