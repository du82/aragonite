["https://research-development.nomadic-labs.com/adaptive-maximum.html"]
title = "Nomadic Labs - On Adaptive Maximum vs. Adjusting The Staking Target"
description = "Incentivizing a secure network, while keeping inflation at a minimum."
full_description = "TL;DR: Adaptive Maximum makes the Tezos protocol able to better adapt staking rewards to changing network conditions without governance intervention. It’s a long-term sustainable solution for keeping Tezos’ L1 both secure and economically sound. Designing a Proof-of-Stake blockchain requires carefully balancing network security with healthy economics. The staking mechanism must provide enough rewards to incentivize stakers to secure the network against consensus attacks, but rewards mustn’t be so high that they negatively impact the economics of the system. Staking rewards are newly created tokens, or, in other words: inflation. As many people have personally experienced in recent years, high inflation can negatively impact economic systems. Prices increase, not because the value of things go up, but because the value of money goes down. Savings are eroded, borrowing costs increase, and there’s more uncertainty about the future. Blockchains are no different. Excessive inflation dilutes the value of all tokens. It can also dry up liquidity, because the opportunity cost of not staking to compensate for inflation becomes high, which interferes with DeFi applications and layer 2 solutions. It can also create tax inefficiencies. For these reasons, staking rewards should be balanced with the need for security on the network, and be no higher than that. Adaptive Issuance is designed to incentivize staking to ensure a secure network, while minimizing tez issuance. In Paris, the target for staking is 50% of all tez supply (we’ll get back to why it’s a desirable target). When below the target, the protocol increases rewards issuance to encourage more staking. When above the target, the protocol reduces issuance to avoid excessive inflation. However, the Paris protocol’s implementation of Adaptive Issuance treats the 50% target as a goal to be achieved no matter the inflationary cost. This can lead to disproportionately high inflation rates in some scenarios. For example, if the staking ratio stabilizes around 40%, tez issuance could stabilize at 5.5% per year. This is very high tez issuance for a staking ratio that is relatively close to the target, and it fundamentally goes against the intention of Adaptive Issuance. Furthermore, if the staked amount oscillates above or below the target at 50%, we could observe large variations in issuance."
year_published = 2024
