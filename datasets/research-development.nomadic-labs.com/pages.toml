["https://research-development.nomadic-labs.com/delphi-official-release.html"]
title = "Nomadic Labs - Delphi: official release"
full_description = "We’re happy to announce that we have compiled a Tezos protocol proposal we’re dubbing “Delphi”, with hash PsDELPH1Kxsxt8f9eWbxQeRxkjfbxoqM52jvs5Y5fBxWWh4ifpo. Delphi contains a number of small bug fixes, but, more importantly, it makes substantial improvements to the performance of the Michelson interpreter and to the gas model, and thus dramatically improves gas costs. In addition, it reduces storage costs by a factor of 4 to reflect improvements in the underlying storage layer. Many of you have probably been playing with the Dalphanet test network, which includes support for Sapling, baking accounts, and more. The teams contributing to that code have projected that testing and tuning will be done in several months. During the online town hall meeting on August 19th, it was asked whether an interim protocol proposal could be made that introduces gas improvements sooner, as this would be of substantial help to people developing smart contracts on Tezos. The motivation for such an interim proposal is straightforward. The size and complexity of smart contracts is limited by gas constraints, and so people attempting to build contracts with rich functionality have needed improvements to those constraints for some time. Thus, such improvements are crucial to enable novel applications on Tezos that target areas like DeFi (“Decentralized Finance”), collectibles, and gaming. Luckily, in August, we finalized some long-standing work on improving the performance of the Michelson type checker and interpreter, and on refining the cost model, thus mitigating the gas problem. We carefully considered the idea of an interim proposal, and realized that the suggestion was practical. A small protocol proposal is simpler to create and evaluate than a large one, and there is currently an opportunity to inject an interim protocol proposal focused on improving gas constraints without significantly changing the expected proposal date for the code in Dalphanet. Because it is a very limited set of changes, it was feasible to assemble a proposal in time."
year_published = 2020
