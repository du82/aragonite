["https://research-development.nomadic-labs.com/adaptive-issuance-paris.html"]
title = "Nomadic Labs - Adaptive Issuance in Paris"
description = "A major overhaul of Proof-of-Stake in Tezos."
full_description = "TL;DR: Adaptive Issuance has been revised in close cooperation with Tezos ecosystem stakeholders. This post recaps what Adaptive Issuance means for Tezos staking, and what’s different in the Paris proposal. Since its launch in 2018, the Tezos protocol has emitted a fixed number of tez, roughly 5% of the total supply per year, as rewards to those securing the network, bakers. 5% of the total supply is more than enough to incentivize a secure network, and as a result most rewards received by bakers are re-distributed to tez holders through the delegation system. However, over time this approach has been seen to cause friction with real-world use of Tezos, as we’ll expand on below. Adaptive Issuance is a mechanism for letting the network automatically set the rate to the minimal level necessary to secure the network, thereby minimizing inefficiencies that arise from the re-distribution of rewards. The mechanism continuously adjusts the rewards based on a target ratio for tez staked out of the total supply. When the ratio is below the target, the protocol increases rewards to encourage more staking. When it’s above the target, the protocol reduces rewards to minimize dilution. This way, the Tezos protocol emits only as much new tez as needed to achieve a desired security level – no more, no less. Below we look into why it matters. A more in-depth discussion of arguments for (and against) can be found in this Tezos Agora post. The market for delegation suggests that the reward required to incentivize a secure network, the security budget, is notably lower than the current 5% rate. The delegation system essentially lets tez holders 1) contribute to staking and governance, and 2) minimize dilution by being refunded any “excess inflation” beyond what bakers require to secure the network. Bakers typically share 80-90% of rewards with delegators, indicating that current rewards are somewhat higher than what’s required. With Adaptive Issuance, rewards adjust towards a ‘minimal viable level’ to avoid excess inflation. It has the important effect of greatly reducing the opportunity cost of undelegated tez, which makes Tezos better adapted to real-world use:"
year_published = 2024
year_updated = 2024
