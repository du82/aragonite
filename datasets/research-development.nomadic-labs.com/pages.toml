["https://research-development.nomadic-labs.com/delphi-changelog.html"]
title = "Nomadic Labs - Delphi: changelog"
full_description = "The source code of this proposal is available in this tar archive: https://research-development.nomadic-labs.com/files/delphi_007_PsDELPH1.tar. To compute the hash, you can use the tezos-protocol-compiler as follows. The result should be PsDELPH1Kxsxt8f9eWbxQeRxkjfbxoqM52jvs5Y5fBxWWh4ifpo. If you want to directly investigate how Delphi differs from the current protocol, you can use diff against folder proto_006_PsCARTHA of the mainnet source code. All the changes should be the ones detailed in the changes section. Any active baker can inject the proposal by simply downloading the code, injecting it in a running mainnet node with tezos-admin-client and using the submit command of tezos-client. Some effort was directed to streamline the Michelson interpreter and improve its performance. This mostly consisted in factoring gas consumption, simplifying logging and removing some calls to Lwt (cf. the dedicated section on that last point). Gas accounting has seen a significant update. Even though gas limits are the same as in Carthage, the amount of computation per unit of gas should see a significant increase in Delphi. More precisely, the following parts of the gas subsystem have been updated. - Following the optimization work on the interpreter, gas costs for all instructions have been recomputed. - The cost model for IOs has been updated and should account better for performances of modern storage hardware. - The typechecking system has an entirely new cost model. - Finally, the base gas cost of manager operations has been reduced from 10000 to 1000 units of gas. The protocol now internally handles milligas but exposes gas to the user. - Protocol constants such as per-block and per-operation gas limits are still specified in gas. - On the input side of the protocol, the gas_limit field in manager operations is still specified in gas, as before. - On the output side, receipts contain both the consumed_gas (as before) and a new field consumed_milligas. The relationship between this two fields is the following:"
