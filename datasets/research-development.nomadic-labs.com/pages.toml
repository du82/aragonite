["https://research-development.nomadic-labs.com/announcing-tezt.html"]
title = "Nomadic Labs - Announcing Tezt"
description = "Tezt is a test framework for OCaml that has been developed and used by Nomadic Labs."
full_description = 'Tezt (pronounced /tɛzti/) is a test framework for OCaml that has been developed and used at Nomadic Labs to test Octez, an OCaml implementation of the Tezos blockchain. It has become quite mature and we feel it would benefit the OCaml community at large, so we are releasing it publicly as a standalone product. Additionally, substantial effort was put into the user experience. Many small details that may not seem like much individually, but add up to significantly improve everyday use. These include: In particular, you can try the --list option, which gives you the list of registered tests and their tags. Don’t forget to use -- to separate Dune arguments and Tezt arguments: An integration test is just a test that runs external processes. It often also manipulates temporary files. Here is a simple example: Temp.file "test.txt" returns a filename of the form /tmp/tezt-1234/1/test.txt. This file will be automatically removed at the end of the test unless you use --keep-temp, or --delete-temp-if-success and the test fails. with_open_out opens a file for writing, gives you the out_channel, and ensures the file is closed after. Then it uses the Process module to execute cat on the temporary file and check its output. The Process module will log all output from cat in verbose mode. This is particularly convenient for debugging. Finally, this test uses =~!, which means: check that the left-hand-side does not match the regular expression at the right-hand-side. Regular expressions are often convenient to use with integration tests, so some easy-to-use regular expression operators are provided by Tezt.Base. You can run this test like any other test. One option that may be useful is --commands (or -c): it tells Tezt to print commands that it runs. It quotes them using shell syntax so that you can copy-paste them into your terminal to easily reproduce. Regression tests are tests that produce a string which should never change. This string is stored in a file that you can commit in your repository. When you run your test, the string that it produces will be compared with the contents of this file, and the test will fail if it differs.'
year_published = 2022
