["https://research-development.nomadic-labs.com/popl-2021-retrospective.html"]
title = "Nomadic Labs - POPL 2021 retrospective"
full_description = "POPL 2021 — the 48th ACM SIGPLAN Symposium on Principles of Programming Languages — is a premier annual conference event of the Programming Languages research community. POPL consists of a main conference, and many colocated events, which together present the latest and greatest research in (amongst other topics): — all subjects which are dear to Tezos community, and which are the bread-and-butter of the daily work at Nomadic Labs of writing some of the most complex and safety-critical code in commercial practice. POPL took place from 17th to 22nd January 2021. It was supposed to be in Copenhagen Denmark, but due to the pandemic it was virtualised with a semi-synchronous program catering for multiple time zones. See the full symposium events page online and the schedule. On Monday 18 Jan, Arvid Jakobsson, one of our experts in formal verification of smart contracts, presented the formalisation of the Dexter decentralised exchange contract in the Mi-Cho-Coq framework. at CPP’s 2021 Lightning Talks session3. On Wednesday 20 Jan, Michel Mauny, Nomadic Labs’ CEO, made a short presentation of our company at POPL’s Sponsor Reception, which also featured a contributed video presenting a general overview of Tezos by Arthur Breitman. On Friday 22 Jan, Germán Delbianco, one of our software verification experts, together with our collaborators from IMDEA Software Institute and UCM, presented an article presenting new developments on the algebraic foundations of Concurrent Separation logics. at POPL4. We were also pleased to find further research works backed by Tezos Foundation grants in the programs: Xuanrui Qi and Jacques Garrigue from Nagoya University, in Japan, presented advances towards specifying OCaml GADTs in Coq, a work funded through the Certifiable OCaml Type Inference (COCTI) grant1. We at Nomadic Labs are pleased and proud to have sponsored the colocated CPP 2021 (Conference on Certified Programs and Proofs), for the second consecutive year. The POPL program ranges from theoretical foundations of programming languages (e.g. semantics and type systems), to the development and application of formal tools and techniques for creating and verifying reliable and correct systems."
