["https://research-development.nomadic-labs.com/athens-second-voting-period.html"]
title = "Nomadic Labs - Athens: Second Voting Period"
full_description = "As we approach the completion of the first active voting period, the proposal period, we would like to describe what’s to come during the second voting period. The first voting period saw the Athens protocols injection and bakers upvoted Athens A and/or Athens B, with Athens A, the most popular proposal, promoted for the second voting phase: the test voting period. In this new period, participants are asked to vote on whether to advance Athens A to the next stage: the testing period. Similarly as the first period, all participants will have 8 cycles, or just over 3 weeks, to submit their voting operation on the Tezos blockchain. In this post, we will provide the instructions for participants to vote for the promotion of the current proposal to the testing period. We also wish to remind Tezos participants that real-life amendment testing is currently happening on the Zeronet test network. We still encourage volunteers to actively participate using the instructions described in Nomadic’s previous blogpost. In the first period, participants could upvote Athens A, Athens B or even submit an entirely new protocol proposal themselves. Athens A received the greater number of votes and has been promoted to the next period. This second period is called the test voting period. Its role is to determine if the protocol is considered worthy enough to enter the testing period which will be used to test the protocol in a side-chain. In the following example, we show the different commands you may use to vote. As a reminder, Athens A hash is Pt24m4xiPbLDhVgVfABUjirbmda3yohdN82Sp9FeuAXJ4eV9otd and its content is available in this tar archive. If you wish to vote for the promotion of this protocol, you can enter : $ tezos-client submit ballot for <delegate> Pt24m4xiPbLDhVgVfABUjirbmda3yohdN82Sp9FeuAXJ4eV9otd yay If you wish to vote against the promotion of this protocol, you can enter : $ tezos-client submit ballot for <delegate> Pt24m4xiPbLDhVgVfABUjirbmda3yohdN82Sp9FeuAXJ4eV9otd nay"
year_published = 2020
