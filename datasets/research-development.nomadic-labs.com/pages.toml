["https://research-development.nomadic-labs.com/updates-granada.html"]
title = "Nomadic Labs - Network Updates from the Granada Protocol Amendment"
full_description = "The Granada protocol amendment was activated at block 1589248 on Friday 6 August 2021 at 11:36 AM CEST. Nomadic Labs would like to thank the community, bakers, and development partners for their diligent assistence in developing and adopting this proposal. On May 31st, Nomadic Labs proposed together with Marigold, Oxhead Alpha, Tarides, and DaiLambda an amendment to the Tezos protocol named Granada. Tezos’ on-chain governance procedure enabled the adoption of the proposal by the community and the subssequent activation of Granada. Since August 10, 2021 23:19 CEST, the Granada protocol has run on Tezos mainnet for a complete cycle (8192 blocks). Below, Nomadic Labs is pleased to share data from the first complete cycle and an analysis of the impact of these three features. Liquidity baking is a primary example of the utility of Tezos’ on-chain governance to provide for public goods that go beyond securing the network. The liquidity baking proposal is an experiment to see if a decentralised protocol can use incentives to create liquidity around them. As of publication, over 980,000 tez and 72.3 tzBTC (about $6.8M worth) were deposited in the liquidity baking contract, demonstrating a successful deployment of the contract and concept. During the first cycle of Granada, total value locked in the liquidity baking contract steadily increased. In the first few hours after going live, over 2 million USD worth of coins (24.19 tzBTC + 331,000 tez) were deposited. Community members can track live statistics on liquidity baking on the statistics page developed by Tessellated Geometry — liquidity-baking.com. Emmy consensus algorithm is one of the most important changes to the core protocol of Tezos in Granada. Emmy tweaked the block delay formula to allow blocks to be produced more frequently. Emmy* is the culmination of multiple updates to the consensus algorithm. In a recent survey we have detailed the various flavours of the Emmy family of consensus algorithms. Before Granada, the minimum delay between blocks on Tezos mainnet was set to 60 seconds. When the network was perfectly healthy (with all bakers and endorsers online and able to quickly produce, validate, and transmit blocks and endorsements), the chain advanced at the speed of one block every minute. When network health dropped however, the chain reacted to maintain consensus. This works based on the number of endorsements that a baker includes in a given block; each block contained 32 endorsement slots and if less than 2/3 of these slots were filled, the baker had to wait before publishing its block (the fewer slots are filled, the longer the delay)."
