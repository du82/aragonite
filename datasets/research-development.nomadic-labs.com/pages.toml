["https://research-development.nomadic-labs.com/dal-testers.html"]
title = "Nomadic Labs - The Data-Availability Layer is Coming to Tezos – Now on Testnet"
description = "Test the DAL on Tezos' Weeklynet."
full_description = "TL;DR: The Data-Availability Layer is live on Tezos’ Weeklynet, and we call on bakers and rollup operators to help us test this groundbreaking “rollup booster”. This blog post shows you how to get started. In a previous blog post, we introduced the Data-Availability Layer (DAL) as a game-changing “rollup booster” for Tezos. If you’re new to the DAL concept, we highly recommend starting with this blog post. For a more technical walk-through, see this presentation from the TezDev 2023 conference. In a nutshell, the DAL is a permissionless peer-to-peer (P2P) network which is part of the Tezos protocol and runs in parallel with Layer 1. It allows for rollup transaction data (Layer 2) to be published outside of the confines of Layer 1 blocks. Layer 1 bakers continuously monitor the DAL and attest on Layer 1 whether a given piece of data is available on the DAL. We expect the DAL to go live on Mainnet in 2024, which is why we are now publishing this call for testers on Weeklynet. Once the DAL goes live on Mainnet, bakers will have to set up a DAL node in addition to the baker daemon. It’s important to test this step ahead of Mainnet activation, as DAL participants will be launching a new P2P network. To be clear: testing distributed networks is hard, and nothing can compete with a live, realistic testnet. Additionally, we need feedback from rollup operators. The DAL offers rollup operators a permissionless, out-of-the-box data availability solution, enabling them to publish large amounts of data for a rollup at a very low cost and without sacrificing decentralization. Of course, success for such a system is contingent upon a great developer experience. We will need fresh eyes on this process and feedback to help us make it the best possible experience. These documents should be enough to get you started. Afterward, the sky is the limit: you decide which data will be published on the DAL and for what purposes. The DAL is a cornerstone for the future of Tezos, including innovations such as Etherlink and Tezos 2.0. That is why your feedback is very important. We encourage anyone involved with testing these features to share their feedback in a comment on this Tezos Agora post."
year_published = 2024
