["https://research-development.nomadic-labs.com/introducing-mockup-mode-for-tezos-client.html"]
title = "Nomadic Labs - Introducing mockup mode for tezos-client"
full_description = "We are pleased to announce that the tezos-client binary has a new feature aimed at contract and tool developers alike: the mockup mode. Mockup mode allows easy prototyping of Tezos applications and smart contracts locally. By local we mean: If a single sandboxed node were an apricot then mockup mode would be the apricot kernel, and we could write: Our motivation in building mockup mode was to give our developers, who are building and testing Tezos smart contracts, an easy local environment offering a fast development cycle which needs only lightweight local state files, and which does not require a running blockchain. Now, we’d like to share the joy of this new tool with you. The features described below are available on the master branch, and will be included in version 8.0.1 This post is a practical guide to mockup mode’s features (see also the documentation). Be prepared for lots of command-line snippets, which you are welcome to run for yourself! tezos-client can prepare transactions; evaluate, typecheck and originate contracts; and encode/decode data when interacting with nodes. It also acts as a wallet, allowing to sign arbitrary data — including, of course, transactions. The mockup mode of tezos-client supports these operations (with slight limitations2), with the convenience that it does not need to be connected to a live Tezos node. All operations are local, in the sense above. tezos-client in mockup mode does two things to compensate for not communicating with the live network: In practice we find it simplest to just use state and remember to delete it between sessions — but your needs may vary and the tool will accomodate them. The mockup mode can typecheck and evaluate scripts. Let’s try this on a script hardlimit.tz, which you can download from Tezos master branch or create locally as follows: As this article went to print (so to speak), this command returns three protocol identifiers (ignoring any Warnings): A word on the protocol for naming protocols: The Tezos protocol IDs above are based on hashes, but the start of each ID hints at the release name of the corresponding protocol. The three items above correspond to protocols called alpha (a development version of the Tezos protocol), Delphi, and Carthage."
