["https://research-development.nomadic-labs.com/meanwhile-at-nomadic-labs-1.html"]
title = "Nomadic Labs - Meanwhile at Nomadic Labs #1"
full_description = "This post is the first of a series covering the on-going work at Nomadic Labs. In these posts, we focus on our current top priorities, but of course we have many more projects in the works. Tezos is capable, by design, of automatically amending its economic protocol without the need for a manual update or hard-fork. The current protocol is designed to amend itself only after a successful voting procedure, ensuring that there is awareness and consensus in the community about the new features. Nomadic Labs is currently preparing to submit its first protocol amendment proposals for a vote. Of course, it means selecting and implementing the contents of our proposals, but also monitoring that the process behaves as intended. Specifically, this includes making sure that the voting and test chain mechanisms work as expected, and rehearsing the procedure. It also means collaborating with our fellow Tezos core contributors to make sure that everything is in place, including the new voting feature in Obsidian Systems’ Ledger app. More posts in the next weeks will prepare the ground for our proposal. For the time being, bakers should familiarise themselves with the voting procedure, fully described in this post. We hope to organise a rehearsal via the Alphanet in coming weeks. We encourage bakers to join to test their setup is ready for the potential upgrade. We intend to propose two competing amendments. The first one increases the current gas limit, the second one also increases the gas limit and, in addition, it also reduces the roll size. This lets us, the community, test the approval voting phase. Since one of these amendments may be the first to activate on the Tezos network, we felt it important to propose simple changes. The main goal is to prove that Tezos can carry out a successful update both technically and as a community. After all, we are all novices to the Tezos governance procedure and this aims to be a first step towards more substantial amendments. Rolls, the unit of stake used to assign rights to bakers, are currently set at 10k ꜩ. Because roll size can significantly influence node performance, both in terms of storage and computation time, we developed a specific set of benchmarks to evaluate it. These benchmarks test the reassignment of the rolls during the protocol upgrade as well as the evolution of the network for several cycles afterwards. Changing the roll size is not just a matter of changing a constant in one line of code!"
