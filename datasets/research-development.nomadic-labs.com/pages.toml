["https://research-development.nomadic-labs.com/announcing-tezos-9th-protocol-upgrade-proposal-ithaca.html"]
title = "Nomadic Labs - Announcing Tezos’ 9th protocol upgrade proposal “Ithaca”"
full_description = "This is a joint post from TriliTech, Nomadic Labs, Marigold, Oxhead Alpha, Tarides, DaiLambda, Functori & Tweag. We were proud to see Hangzhou go live on chain on December 4th, 2021. In keeping with our policy of proposing upgrades on a regularly scheduled basis, we’re happy to announce our latest Tezos protocol proposal, Ithaca. (As is usual, Ithaca’s “true name” is its hash, which is PsiThaCaT47Zboaw71QWScM8sXeMM7bbQFncK9FLqYc6EKdpjVP). Ithaca contains two major updates to the protocol, as well as numerous minor improvements. Below we discuss some of the most interesting and important changes. Tenderbake is a major update to the Tezos consensus algorithm. Like Tendermint, Tenderbake brings fast deterministic finality to the Tezos protocol. The protocol moves away from a roll-based model to an optimized stake-based model to allocate rewards: bakers will receive rewards depending on their current stake instead of the number of rolls they own. A reduction in the minimal number of tokens required to be selected as a validator would be implemented: from 8,000 tez to 6,000 tez. This minimal stake of 6,000 tez remains necessary for performance reasons. The baking and endorsement rewards mechanism has been reworked (c.f. rewards documentation). In particular, baking rewards will be credited instantaneously, and not frozen for 5 cycles as is the case with Emmy*. Furthermore, there will no longer be a variance for endorsement rewards. The total sum of endorsement rewards for a cycle will be fully distributed at the end of the same cycle, provided delegates have at least 2/3 of their endorsement slots included in blocks. A new security deposit mechanism is introduced: delegates are required to freeze, at minimum, 10% of their stake in advance in order to obtain baking and endorsement rights. A new operation Set_deposit_limit is also introduced to manually manage this limit. The number of endorsement slots per block has been bumped from 256 to 7,000: this means that a delegate with the minimum amount of tokens will participate every 10 blocks on average. The node’s storage layer and prevalidator have been optimized to handle the charge, with the precheck feature also contributing to the increase in performance. The number of endorsement operations, which will continue to endorse multiple slots, will be proportional to the number of validators in the network, i.e. around 500."
