["https://research-development.nomadic-labs.com/bakers-dal.html"]
title = "Nomadic Labs - Tezos Bakers: It’s Time to Activate the Rollup Booster"
description = "Run a DAL node to activate the next step in Tezos scaling."
full_description = "TL;DR: The Data Availability Layer is industry-leading scaling technology for rollups. It requires participation by 67% of the Tezos stake, and we call on bakers to begin running DAL nodes. Recent Octez releases have greatly improved the user experience. The Paris protocol upgrade in June enabled a key component in future-proofing the Tezos network: the Data Availability Layer (DAL). The DAL provides game-changing scaling for rollups by enabling verifiable publication of transaction data outside the confines of layer 1 blocks. The DAL’s integrity remains secured by Tezos bakers, who verify the publication and availability of DAL data and post attestations on layer 1, just like they already do for L1 blocks. This however requires participation by at least 67% of the total Tezos stake. Therefore we call on bakers to begin running DAL nodes. The DAL is a cornerstone of Tezos X, a proposed roadmap and vision for the Tezos blockchain that enables a cloud-like developer experience, with industry-leading performance, composability, and interoperability. More concretely, the DAL scales bandwidth, i.e., how much data can be transmitted through the network per second. While layer 1 blocks currently offer a bandwidth of around 0.025 MB/s, the DAL delivers 0.5MB/s for layer 2 out of the box, and the target is 100MB/s within two years. In other words, the Tezos X journey has already begun, and running the DAL brings benefits for Tezos users from day one. Etherlink scaling. The Smart Rollup-powered EVM environment on Tezos, Etherlink, is designed to be “fast, fair and (nearly) free”. The DAL makes it possible to cut the cost of publishing Etherlink transactions, and unlocks scaling that rivals that of much more centralized EVM platforms, but without compromising on decentralization. Unique offering. The DAL is an industry-leading technology that puts Tezos at the forefront of blockchain innovation. Having a protocol-native solution for data-availability that is fully decentralized, scalable, and secured by layer 1 is a strong competitive edge. This approach enables seamless integration with Smart Rollups, Tezos’ enshrined layer 2 solutions."
