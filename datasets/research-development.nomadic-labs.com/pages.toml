["https://research-development.nomadic-labs.com"]
title = "Nomadic Labs"
full_description = "At Nomadic Labs we live and breathe the bleeding edge of distributed, decentralized and formally verified software. We help to build Tezos, the self-amendable blockchain, applying computer science research to a real-world industrial context. Our R&D team is composed of more than 50 people, mixing industrial and academic skills in a collegiate and collaborative working environment. Tezos is an open-source platform for assets and applications that can evolve by upgrading itself. The core developers at Nomadic Labs are working on the Tezos amendments to propose new features to the Tezos community. At Nomadic Labs, we contribute to the evolution of Tezos through collaborative development and formal verification of amendments that improve consensus algorithms, smart contracts languages such as Michelson, and privacy components. Octez is an implementation of a suite of Tezos-related software. Nomadic Labs is working on generic libraries used in the Octez codebase, such as ones for error handling, data encoding and concurrency. Our mission is to develop various tools which are not directly part of the node but which are useful both for users and developers, including continuous integration (CI), test tools and release management to give users access to Tezos. At Nomadic Labs, we are testing each release, maintaining them, and helping users and developers alike to build and use them through extensive technical documentation. Cryptography Projects at Nomadic Labs focus on the design and implementation of new cryptography and its integration in the Tezos blockchain."
