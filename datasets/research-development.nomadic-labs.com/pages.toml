["https://research-development.nomadic-labs.com/announcing-octez.html"]
title = "Nomadic Labs - Announcing Octez"
full_description = "There’s a powerful scene in the film the Gladiator where the Emperor Marcus Aurelius explains that Rome is both a physical installation of bricks and mortar, and also it is the idea of Rome — an ecosystem of standards and laws by which the people lived and a city was built. When you download Tezos, you are actually downloading code that runs on a machine and in so doing embodies the idea of Tezos. We at Nomadic Labs are proud to have played a role in the coalition of programmers that wrote a Tezos implementation which is now widely used in the community. Historically, this was the first complete implementation of Tezos, which was used to activate Tezos Mainnet (the live blockchain) back in 2018. You can download this implementation from the open source repository https://gitlab.com/tezos/tezos/, where it is actively maintained today. However, we were so excited by this at the time that — much like the Romans — we neglected to distinguish linguistically between the ideal, and the implementation of that ideal. This may be forgivable for world-spanning preindustrial empires, but we modern software developers should be more precise. So … We are happy to announce that the bundle of concrete code files maintained at https://gitlab.com/tezos/tezos/ now has a name: Octez. ‘Octez’ is a portmanteau of octopus and Tezos, a pun which draws inspiration from this big picture of Tezos.1 ‘Octez’ is also a portmanteau of OCaml and Tezos (OCaml being the main programming language used in Octez), and a pun on ‘octet’. Octez is an implementation of a suite of Tezos-related software. It lives in this GitLab repo: https://gitlab.com/tezos/tezos/. Octez was created by a coalition of teams including Nomadic Labs, Tarides, Tocqueville Group, Obsidian Systems, Tweag, and Metastate (non-exclusive list). The work is coordinated by the merge team (list of members here), and the name Octez was proposed to and approved by them. This reflects the decentralized nature of Tezos: Octez is a decentralized implementation, and the name itself was chosen in collaboration."
