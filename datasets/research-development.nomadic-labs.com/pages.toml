["https://research-development.nomadic-labs.com/mainnet-release-to-patch-babylon.html"]
title = "Nomadic Labs - Mainnet release to patch Babylon"
full_description = "During the testing phase of protocol Babylon 005_PsBABY5H, we discovered a bug affecting bigmaps in Michelson smart contracts. The bug is corrected in a new version of Babylon, 005_PsBabyM1. The bug is not critical but causes a significant performance degradation for newly created smart contracts and an incorrect behavior for existing ones using big maps. More details on the nature and effects of the bug can be found in the protocol documentation page. During the upcoming promotion vote period, we propose two options. The first obvious possibility is to vote Nay so that the current Athens protocol will proceed to a new proposal period. Protocol 005_PsBabyM1 will then be proposed and we will continue with a normal voting procedure. As usual the voting procedure will last 3 months if each voting period is successful. The second option is for users to download a new version of the Tezos node that, in case of a positive promotion vote, will activate the corrected protocol Babylon 005_PsBabyM1, instead of the defective 005_PsBABY5H. Note that in case of a negative vote this new release of the Tezos node will simply continue to run Athens as expected. The advantage of the second option is to save the time of a full voting procedure to simply fix a bug. However it is up to the community to decide which option to take. We do our best to prevent bugs from slipping inside our releases but unfortunately, as with any complex software, there is always a small chance of missing something. This episode proves once again the importance of having a thorough voting and testing procedure. As with any protocol release it is important to inspect the sources behind a hash. In this case the diff with respect to 005_PsBABY5H consists of two lines, one to fix the bigmap bug described above and one to fix an unrelated problem in an RPC call. The source of the new Babylon can be found in this tar archive and as usual you can recompute the hash using"
year_published = 2020
