["https://research-development.nomadic-labs.com/sapling-integration-in-tezos-tech-preview.html"]
title = "Nomadic Labs - Sapling integration in Tezos - Tech Preview"
full_description = "We are happy to announce a first technology preview of our integration in Tezos of the core of the Sapling protocol developed by the ZCash project. By extending the Michelson smart contract language, this work allows for the exchange of digital assets in a privacy preserving way. In recent years, we’ve seen much progress towards enabling privacy-preserving payments on public ledgers, both in academic research and in the real world deployement with projects such as Zcash, Monero, or Aztec. In our opinion the Zcash project and in particular the Sapling protocol developed by the Electric Coin Company represents the state of the art to enable privacy-preserving transactions that’s available, in production, today. As a result we have been working to integrate the Sapling protocol into Tezos as an instruction into the Michelson smart contract language for the past year. Sapling is a protocol enabling privacy preserving transactions of fungible tokens in a decentralised environment. It was designed and implemented by the Electric Coin Company as the last iteration over a series of previous protocols and academic works starting with the Zerocoin seminal paper. Thanks to significant performance improvements of Sapling, privacy preserving transactions are finally practical, with approximately ~0.5s needed to craft a transaction and ~10 ms to verify it on a regular laptop. Note that the verification time is particularly important in a blockchain environment. Sapling provides a slightly different set of keys from the ones existing today in Tezos. Each user generates a spending key which allows to perform payments (the equivalent of a secret key in Tezos) and a viewing key which allows to see the payments received or emitted. The viewing key can for example be shared with an auditor for regulatory compliance purposes without having to give the spending key. In order to receive a payment a user can generate an address from their viewing key and communicate it to the payer, much like a tz address today. Sapling addresses are diversified, meaning that from the same viewing key it is possible to derive new addresses which are not correlated to the previous one. This avoids the inherent leak of privacy happening with one public key where your different payers collude to realise that they are paying the same person."
year_published = 2019
year_updated = 2019
