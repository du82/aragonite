["https://research-development.nomadic-labs.com/smart-rollups-are-coming.html"]
title = "Nomadic Labs - The road to a million TPS (and beyond): Smart rollups are coming"
description = "A new reference manual is out, and we are looking to onboard early adopters with relevant use cases."
full_description = "TL;DR: Smart rollups are feature complete, a reference manual is ready, and we are looking to onboard early adopters with relevant use cases. The next generation of optimistic rollups on Tezos are nearing their inclusion in a protocol upgrade proposal, and we have interesting news to share. If you haven’t read our introduction to smart rollups, the elevator pitch is that they are more than just smart contract-enabled optimistic rollups with high scalability. They allow anyone to program and deploy their own interoperable Layer 2 solution in a number of popular programming languages, using a general-purpose infrastructure built for decentralization and security. Fancy an EVM-compatible “sidechain” in the Tezos ecosystem? This can be implemented using the new rollup infrastructure. We are already exploring this and will ramp up our work once smart rollups are live on Tezos Mainnet. Smart rollups also enable an entirely new way to write decentralized applications on Tezos. In addition to using smart contracts on Layer 1, developers will be able to implement a dapp as a rollup, though this is mostly relevant for users requiring high throughput and/or intense computation. Doing so effectively makes the smart rollup work like an app-chain – a blockchain dedicated to a single application – but one that draws on the time-tested security model of the Tezos network. Finally, let’s not forget scaling: smart rollups play a central role in our mission to reach one million transactions per second (TPS) on Tezos, as announced at the TezDev Paris conference earlier this year. Note that the million TPS goal is one we have set for ourselves for the short term. In the long term, due to the combination of horizontal and vertical scaling, there is virtually no limit to the scaling potential of Tezos rollups. The key to the flexibility, decentralization, and security of these next-generation rollups is that they are implemented at the protocol level, making them a type of enshrined rollups."
year_published = 2022
