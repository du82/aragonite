["https://research-development.nomadic-labs.com/nairobi-smart-rollups.html"]
title = "Nomadic Labs - What’s Cooking for Smart Rollups in Nairobi?"
description = "An upgrade that makes life easier for Smart Rollup developers."
full_description = "TL;DR: The Nairobi protocol upgrade brings new features and improvements to Smart Rollups that will make life easier for developers. Mumbai has only just found its way to Mainnet, and a new protocol amendment is already being proposed to the community: Nairobi. As mentioned in the Nairobi announcement, the upgrade brings several quality of life improvements for developers of Smart Rollups. This blog post is an introduction to these new features. It is aimed at developers who are already familiar with Smart Rollups, but includes context and links to existing documentation for less versed readers. First and foremost, it is important to understand that every new feature covered by this blogpost will benefit every Smart Rollup on Mainnet, including those deployed prior to activation of Nairobi. Hence you can already deploy your Smart Rollup today, and benefit from the new features once Nairobi reaches Mainnet (though you will need to upgrade your kernel for some of them). This “free upgrade” in Nairobi is a good example of the advantages that come with Smart Rollups being enshrined – i.e. part of the Tezos protocol itself. It is also a first re-affirmation of Tezos core developers’ commitment to continuously maintain and improve Smart Rollups. Internal messages are a particular kind of message sent to the Smart Rollups shared inbox by the Tezos protocol itself. In Mumbai, there are four kinds of internal messages: Nairobi introduces a new kind of internal message, called Protocol_migration. This message will be injected by the protocol after Info_per_level for the very first block of a given Layer 1 protocol. This way, Smart Rollup kernels can be made aware of new protocol activations. This opens new possibilities, like a kernel taking advantage of new features as soon as they are available. In Mumbai, Smart Rollup kernels can interact with Layer 1 thanks to their outbox. More precisely, they can send operation batches which can be executed in the Layer 1 as soon as the commitment containing them is cemented, i.e. can no longer be refuted."
