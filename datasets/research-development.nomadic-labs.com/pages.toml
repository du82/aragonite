title = "Nomadic Labs - PoS refinements and Private Rollups: Oxford 2 upgrade is live!"
description = "Tezos has activated its 15th upgrade."
full_description = "On February 9 2024 13:23:45 UTC, the Tezos blockchain successfully activated the Oxford 2 protocol upgrade at block #5,070,849. This 15th upgrade was jointly developed by Nomadic Labs, Marigold, TriliTech, Oxhead Alpha, Tarides, DaiLambda & Functori. A deeper technical description can be found in the protocol proposal’s technical documentation, and a complete list of changes is provided in Oxford 2’s changelog. The activation of Oxford 2 is just the beginning of a big 2024 for Tezos. We are excited to be part of the ongoing work to evolve Tezos – and the blockchain space. Data-Availability Layer (DAL) on testnet. The DAL is currently live on Tezos’ Weeklynet, and we encourage bakers and rollup operators to help us test this cornerstone of Tezos’ future. To understand what it does, and what it means for Tezos, see our introduction to the DAL. Get ready for the launch of Etherlink. Etherlink will be an EVM-compatible optimistic rollup with high throughput, a decentralized sequencer, low gas fees, and MEV protection, powered by Tezos Smart Rollups. Check out etherlink.com to learn more and get involved."
