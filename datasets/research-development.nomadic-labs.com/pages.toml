["https://research-development.nomadic-labs.com/oxford-announcement.html"]
title = "Nomadic Labs - Announcing Oxford, Tezos’ 15th protocol upgrade proposal"
description = "Adaptive Issuance and Staking, new Timelocks and more!"
full_description = "This is a joint post from Nomadic Labs, Marigold, TriliTech, Oxhead Alpha, Tarides, DaiLambda, & Functori. Following the smooth activation of the Nairobi protocol upgrade on June 24 — and a successful TezDev conference on July 21 — we are happy to unveil our latest Tezos protocol proposal. For our 15th upgrade proposal, we head to Oxford, home to the world’s second-oldest university in continuous operation, with evidence of teaching happening as early as 1096. As usual, the proposal’s “true” name is its hash, ProxfordSW2S7fvchT1Zgj2avb5UES194neRyYVXoaDGvF9egt8. The Oxford proposal first and foremost contains two major changes to the staking economics of Tezos. Note that these changes will not be automatically enabled upon activation, if the Oxford proposal is adopted. Instead, bakers will be able to signal their position in a separate vote. The changes in question are: In this post we provide an overview of the functionality. For a deeper and more technical description, see the specification document. The protocol proposal also includes other minor changes and improvements which can be found in Oxford’s changelog. Adaptive Issuance, originally introduced as “Adaptive Inflation”, is an evolution of the staking mechanism, adapting the economics of tez to fit better with real-world usage, as argued in the Tezos Agora post “Why adaptive inflation matters for Tezos”. The proposed mechanism ties the Tezos protocol’s regular issuance of tez (from participation rewards and the Liquidity Baking subsidy), to the ratio of staked tez over the total supply. At the end of each blockchain cycle, the nominal issuance rate is recomputed to nudge the staked funds ratio towards a protocol-defined target of 50%. When the ratio of staked funds decreases and diverges from the target, emission rates will increase, incentivizing participants to stake funds to re-approach the target, and vice versa. Consequently, the value of participation rewards and the Liquidity Baking subsidy are no longer fixed values determined by protocol constants – they rather change automatically as the mechanism encourages (or discourages) staking of funds."
year_published = 2023
