["https://research-development.nomadic-labs.com/activating-tenderbake.html"]
title = "Nomadic Labs - Activating Tenderbake — a story in data"
description = "We take a look at the first cycle of Tenderbake to evaluate the performance of the network, and how it affected the bakers rewards"
full_description = "On April 1st, 2022, the Tezos blockchain successfully executed its most ambitious protocol upgrade to date. At block #2,244,609, the Ithaca2 protocol upgrade was activated on Tezos mainnet, moving the Tezos network away from the Emmy family of consensus algorithms to Tenderbake. It is not the first time we have made changes to the consensus algorithm via the on-chain amendment process, but this time we have collectively gone where nobody in this space has gone before: hot-swapping to a completely different consensus algorithm on a live network without a hard-fork in just 1815 seconds. Yes, it took only ~30 minutes for a majority of the network participants to surf the migration waters, get the first block endorsed by 2/3 of the network, and deliver Odysseus home to Ithaca. We have been monitoring the network closely since then, and we are glad to see that the transition from Emmy* to Tenderbake was generally frictionless, and that the new consensus algorithm is running without interruptions since the first block of the cycle. In this article, we present some early observations and reflections on the behavior of the network during cycle 468 - that is, the first 8192 blocks of the Ithaca2 protocol, between Friday evening and Monday evening (Paris time). The following table discriminates the first 8192 blocks of cycle 468, from the activation of Ithaca2 on block #2,244,609 until block #2,260,992 on CEST Monday, April 4th. Consensus on the head of the chain was both safe and fast: the average time between blocks was 32.058s, close to the theoretical minimum of 30 seconds. This is a direct consequence of having an overwhelming majority of blocks proposed and agreed upon in round 0: 7936 blocks out of 8192 – around 97% of them. The round number for a block denotes the number of attempts (minus one) that were necessary to reach a consensus on a block at a given level. Lower is better, and a high number of rounds indicates a slow or unreliable network. Under normal network conditions, the chain should reach a consensus about the next block in round 0 – that is, on the first attempt."
year_published = 2022
