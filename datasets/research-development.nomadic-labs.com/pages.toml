["https://research-development.nomadic-labs.com/three-questions-to-nomadic-labs-interns-valentin-chaboche.html"]
title = "Nomadic Labs - Three questions to Nomadic Labs interns — Valentin Chaboche"
full_description = "Each year we host around half-a-dozen interns (stagiaires), for periods of two to six months. These young men and women are usually studying or have just finished studying for undergraduate or Master’s degrees, and are eager to gain experience in the blockchain industry. Each has a unique story to tell about their individual interest in this technology. In this blogpost, we will ask three questions of one of our current interns: Valentin Chaboche (and a couple of questions of his mentors at Nomadic Labs). Valentin — so happy to have you with us! We hope you’re having a wonderful and educational period with Nomadic Labs. We’d love to hear a bit about you and your activities chez nous … In 2019 I graduated from the Université Paris Diderot 7 with a bachelor’s degree in Computer Science, then I stayed for a master’s degree in Language et Programmation, graduating in 2021. The course content includes algorithms and programming, distributed systems, and formal verification. I am doing an internship at Nomadic Labs with the verification team under the supervision of Arvid Jakobsson and Zaynah Dargaye, from March to September 2021. Nomadic labs is always working to improve the quality of the Tezos codebase and assure its correct behaviour — in particular through mass testing of the codebase and reduction of boilerplate code. My internship aims to contribute as follows: My internship has exposed me to many new ideas, including formal verification of programs, blockchains and distributed systems, and metaprogramming. This is also my first experience in a collaborative open-source project. During my internship I have had the opportunity to develop and release libraries, create and review merge requests in Tezos, and participate in open-source projects used in Tezos. I had to learn to communicate and transfer knowledge about my work at Nomadic Labs within development teams, through meetings in small groups, documents, and team presentations. During the three months of my internship so far, I have been surprised and delighted by the kindness and goodwill of people at Nomadic Labs and in the OCaml ecosystem. They have always taken the time to help me with technical and theoretical questions. I’ve found it to be a welcoming environment for a newcomer like me and I am grateful to have had an opportunity to be part of such a great community."
year_published = 2021
