["https://research-development.nomadic-labs.com/announcing-tezos-12th-protocol-upgrade-proposal-lima.html"]
title = "Nomadic Labs - Announcing Tezos’ 12th protocol upgrade proposal, “Lima”"
description = "A joint post from Nomadic Labs, Marigold, TriliTech, Oxhead Alpha, Tarides, DaiLambda& Functori."
full_description = "This is a joint post from Nomadic Labs, Marigold, TriliTech, Oxhead Alpha, Tarides, DaiLambda, & Functori. We’re happy to announce that Lima, our next Tezos protocol proposal, is ready. As usual, Lima’s ‘true’ name is its hash, which is PtLimaPtLMwfNinJi9rCfDPWea8dFgTZ1MeJ9f1m2SRic6ayiwW. The changelog provides a detailed list of changes, and a general technical overview of Lima can be found in the protocol proposal’s technical documentation. Note that, if Lima is voted in by the community, upgrading to Octez v15.0 (or later) will be necessary for participating in consensus. A release candidate for Octez v15.0 will be published in the coming days, and a dedicated protocol test network Limanet is also scheduled to begin soon – more information about the latter test network will be available on https://teztnets.xyz/. Development of next-generation enshrined optimistic rollups on Tezos is progressing steadily. Functioning rollups implemented in Rust are currently running in our test-suite. However, these rollups are not part of the Lima protocol upgrade proposal, as more time needs to be spent on validation, testing, and integration with ecosystem tools before they can be activated on Mainnet. We highly encourage ecosystem participants to start experimenting with these rollups on the Mondaynet testnet, where they are already activated. Broad testing and feedback from the ecosystem is invaluable in our efforts to minimize the risk of undetected issues upon Mainnet activation. Read more about how to get started."
