["https://research-development.nomadic-labs.com/athens-our-proposals-for-the-first-voted-amendment.html"]
title = "Nomadic Labs - Athens: Our Proposals for the First Voted Amendment"
full_description = "This blog post is a preview of Athens: our protocol proposal for the first voted upgrade of Tezos. As announced in the last meanwhile at Nomadic, we shall propose two upgrades: one lowers the roll size to 8,000 tez, the other leaves it unchanged at 10,000 tez. Both alternatives will include an increase of the gas limit. The hashes of both versions will be proposed on mainnet later this week, now that a new proposal period has begun. Later this week, we will publish a blog post which provides the hashes and instructions for voting, as well as optional instructions for bakers and enthusiasts who want to participate in the tests. The same day we will also propose the same protocols on our experimental Zeronet, where one voting period lasts 56 hours and the whole voting procedure can be carried out in 9 days. This gives us the opportunity to test the whole procedure and to analyze the activation of a new protocol in Zeronet. The actual Athens proposal is a self-contained set of OCaml sources. To make it more readable, we have split it into a clean series of patches on top of the current protocol. This article will describe each of these patches. We recommend that users take the time to read the actual code and make sure that it correctly reflects the advertised behavior. For this first update, we decided to include an example of invoicing, an on-chain way to fund the development of protocol proposals. During the migration, the account of the authors of a proposal can be funded by creating a certain amount of tez. In this case, we chose a symbolic value of 100ꜩ, enough to buy a round of drinks for the devs who worked on these proposals. In the future, we hope this mechanism can be used to fund the work of new teams and help increase decentralization. The next section presents a set of benchmarks for the gas and the migration from protocol Alpha_003 to Athens_004. Tezos has a built-in system to try new protocols: it can fork a test chain from the main chain. The test chain has the advantage of forking from an actual context of mainnet, complete with all the accounts and contracts, thus giving a realistic trial of what could happen at activation."
