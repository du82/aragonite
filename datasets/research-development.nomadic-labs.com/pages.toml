["https://research-development.nomadic-labs.com/important-critical-patch-to-tickets-in-edo.html"]
title = "Nomadic Labs - IMPORTANT: Critical Patch to Tickets in Edo"
full_description = "Several mechanisms were considered to mitigate this problem; none were ultimately found to be satisfactory. We have therefore taken the step of producing and releasing version 8.2 of the Tezos node that includes a patched version of the Edo protocol that differs by only a few lines of code. Nodes running 8.2 will automatically adopt the patched version rather than the original version of Edo when it activates on February 13th, 2021, around 19:30 GMT. We ask all bakers and node operators to please update immediately to 8.2, rather than 8.1 which most are currently running. Nodes running version 8.1 or earlier will not be able to communicate with the new chain. We appreciate that this is coming at a very late stage in the Edo upgrade process, but we believe that this is the best choice available. It is safer to have the upgrade occur at a time when every bakeries already updating their software and planning to pay close attention to their node because of the impending adoption of Edo. We do our best to prevent bugs from slipping inside our releases but unfortunately, as with any complex software, there is always a small chance of missing something. We intend to adopt several new quality control mechanisms to reduce the probability of similar bugs going undetected in the future. The Git tag for this release is v8.2 and the corresponding commit hash is 6102c808a21b32e732ab9bb1825761cd056f3e86."
year_published = 2021
