["https://research-development.nomadic-labs.com/announcing-granada.html"]
title = "Nomadic Labs - Announcing Granada"
full_description = "We were proud to see Florence go live on the chain on 11th May 2021. In keeping with our policy of proposing upgrades on a regularly scheduled basis, we’re happy to announce our latest Tezos protocol proposal, Granada. (As is usual, Granada’s “true name” is its hash, which is PtGRANADsDU8R9daYKAgWnQYAJ64omN1o3KMGVCykShA97vQbvV). Granada contains several major improvements to the protocol, as well as numerous bug fixes and minor improvements. Below we discuss some of the most interesting and important changes: Emmy*: The current Tezos consensus algorithm is Emmy+ and we propose to replace it with Emmy*. As described in this blog post, if Granada is adopted, Emmy* will generally halve the time between blocks, from 60 seconds to 30 seconds, and allow transactions to achieve significantly faster finality than under the current consensus algorithm. (We expect several significant further improvements to our consensus algorithm and reductions in block times in coming proposals.) Liquidity Baking: The availability of low-slippage exchange of tez into other currencies and vice-versa is key to allow the widespread use of Tezos. Liquidity Baking addresses this directly by piggybacking off the liquidity and global availability of Bitcoin, and incentivizing large amounts of decentralized liquidity provision between tez and wrapped bitcoins. Gas improvements: A number of substantial improvements to performance have been made, which in turn result in dramatic reductions in gas consumption. We have generally observed a decrease of a factor of three to six in the gas consumed in the execution of already deployed contracts. For some contracts, the improvement has been almost a factor of eight. This reduction in gas consumption, the latest in a series we began with Delphi, will enable developers to deploy richer, more complicated, and more interesting applications on Tezos at reasonable real-world cost. Granada contains numerous other bug fixes and small improvements, and we encourage you to look at the changelog for a full description of the contents of the proposal."
year_published = 2021
