["https://research-development.nomadic-labs.com/paris-announcement.html"]
title = "Nomadic Labs - Faster, Higher, Stronger: introducing the Paris protocol upgrade proposals!"
description = "10s block times, enabling the DAL to boost Smart Rollups throughput, and stronger PoS foundations."
full_description = "Following the successful activation of the Oxford 2 protocol on February 9th, we are pleased to announce that the Paris protocol proposals, Paris A and Paris B, are ready! As usual their “true names” are given by their hash: PtParisA6ruu136piHaBC7cQLDP87JEqtczJWP2pLa5QCELGBH5 for Paris A and, respectively, PtParisBQscdCm6Cfow6ndeU6wKJyA3aV1j4D3gQBQMsTQyJCrz for Paris B. Either proposal, if adopted, would bring the following major updates and improvements to the Tezos protocol, notably: The two proposals differ regarding Adaptive Issuance, Staking, and Adaptive Slashing, a major overhaul of the fundamentals of Proof-of-Stake in Tezos: Paris B includes Adaptive Issuance, Staking, and Adaptive Slashing. That is, these features would be immediately enabled upon protocol activation. Paris A does not include these features. It offers bakers instead the possibility to vote for activating them later, via a a dedicated on-chain signaling mechanism. In this article, we give a preview of the improvements described above and expand on the choices provided by both alternatives. Both proposals also include further minor improvements and other changes. A complete list of changes is provided in the Changelog. As recently announced, the Paris protocol proposals reduce block time to 10 seconds, lowering latency and enabling faster finality, without compromising on decentralization. This work builds upon previous foundations, like the adoption of the Tenderbake consensus algorithm and validation Pipelining, which led to halving block time to 15 seconds with Mumbai. In order to reduce block time further, the challenge was to identify and resolve remaining performance bottlenecks without compromising network safety and without forcing Tezos bakers to invest in expensive hardware. It has always been our core belief that bakers should be able to participate in Tezos consensus with affordable, lower-end infrastructure. This is a core strength of Tezos that inherently impacts safety and decentralization, so we want to preserve it as Tezos evolves."
