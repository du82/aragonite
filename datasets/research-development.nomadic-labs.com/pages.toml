["https://research-development.nomadic-labs.com/nairobi-announcement.html"]
title = "Nomadic Labs - Announcing Nairobi, Tezos’ 14th protocol upgrade proposal"
description = "Nairobi brings higher Layer 1 TPS, improved consensus broadcast, and new features for Smart Rollups."
full_description = "This is a joint post from Nomadic Labs, Marigold, TriliTech, Oxhead Alpha, Tarides, DaiLambda, & Functori. Following the successful activation of the Mumbai protocol upgrade on March 29th, we are happy to unveil our latest Tezos protocol proposal, Nairobi. As usual, Nairobi’s “true name” is its hash, PtNairobiyssHuh87hEhfVBGCVrK3WnS8Z2FT4ymB5tAa4r1nQf. The Nairobi protocol proposal contains several updates and improvements to the Tezos economic protocol, the most prominent being: In this article, we give a preview into the improvements described above. More in-depth descriptions can be found in Nairobi’s technical documentation. This protocol proposal includes further minor improvements and other changes – a complete list is provided in the protocol proposal’s Changelog. Currently, the gas cost of signature verification for manager operations is a flat-tax constant, which over-approximates the required resources. With Nairobi, their cost depends on the cryptographic curve used and the size of the payload. For instance, the gas cost of checking the signature of a tz1 or implicit account will be significantly smaller than those for a tz3, in order to better reflect the difference in computational costs associated with signature verification when using the ed25519 (tz1) and p256 (tz3) cryptographic curves. See this entry in Nairobi’s Changelog for further detail (including breaking changes). Thanks to this finer-grained accounting of the gas costs for signature verification, the maximum number of manager operations (transactions, smart contract calls, Smart Rollups maintenance operations, etc.) that can be included in a block has increased by a factor of about 8. Consequently, we observe a similar 8x increase in performance for certain common operations, such as basic tez transactions between tz1 or tz2 accounts1. For smart contract calls the number will be lower, and operations involving ‘tz3’ accounts will see no increase due to their more computationally demanding signature scheme."
year_published = 2023
