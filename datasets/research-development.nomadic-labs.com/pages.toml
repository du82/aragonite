["https://research-development.nomadic-labs.com/toru-introduction.html"]
title = "Nomadic Labs - Transaction Optimistic Rollups – a stepping stone for Tezos"
description = "The hows and whys of the first, experimental implementation of optimistic rollups in the Tezos protocol."
full_description = "TL;DR: Transaction optimistic rollups are an experimental solution meant for short-term scaling and for adapting ecosystem infrastructure to work with rollups, while smart contracts rollups are under development. With the Jakarta protocol proposal, the first step on the road towards scaling Tezos with optimistic rollups has been taken. To quickly recap: Optimistic rollups enable higher throughput by moving the computationally demanding validation of transactions away from the main chain, Layer 1, to dedicated nodes, Layer 2. This approach is far from new, but optimistic rollups do so while delegating consensus – the authority to determine the true state of the Layer 2 ledger – to Layer 1. All data necessary to verify correctness of rollup activity remains available on Layer 1, along with an on-chain dispute mechanism for automatically correcting dishonest behavior by rollup nodes. This way, optimistic rollups enable the use of powerful, centralized systems for validation of Layer 2 activity, while integrity is ultimately ensured by the security and censorship resistance of the Layer 1 protocol that hosts the rollup. For a broader understanding of optimistic rollups and the rationale behind them as a scaling solution, we recommend our recent blog post on the topic. Transaction Optimistic Rollups, TORUs, are the first implementation of optimistic rollups in the Tezos protocol. As the name implies, they allow for exchanges of assets, but not execution of smart contracts. TORUs should be treated as a short-term and experimental scaling solution. For this reason, they are introduced with a sunset of 1 year. This can be changed in future protocol upgrades, should the community desire it. The rollup holds assets that are deposited from – and that can be withdrawn back to – the main chain, Layer 1. These assets can be transferred across rollup-native Layer 2 addresses at a higher throughput than what is possible on Layer 1. Deposited assets are represented as Michelson tickets in the rollup. These are a special type of tokens that were introduced in the Edo upgrade in 2021."
year_published = 2022
year_updated = 2022
