["https://research-development.nomadic-labs.com/announcing-tezos-10th-protocol-upgrade-proposal-jakarta.html"]
title = "Nomadic Labs - Announcing Tezos’ 10th protocol upgrade proposal “Jakarta”"
description = "Announcing our next Tezos protocol proposal upgrade: Jakarta."
full_description = "This is a joint post from Nomadic Labs, Marigold, TriliTech, Oxhead Alpha, Tarides, DaiLambda, Functori & Tweag. Update: A revised prootocol proposal, Jakarta 2, has been released. Jakarta 2 adresses two critical bugs in the implementation of Transaction Optimistic Rollups. We were proud to see Ithaca 2 go live on April 1st. In keeping with our policy of proposing upgrades on a regularly scheduled basis, we are happy to announce our latest Tezos protocol proposal, Jakarta. The Jakarta protocol proposal contains major updates to the Tezos economic protocol, as well as numerous minor improvements. In this article, we preview its most relevant features. A more thorough description can be read in the protocol proposal’s technical documentation entry, and a complete list of changes is provided in its changelog. We are pleased to announce that Transaction Optimistic Rollups (or TORUs) have found their way into this protocol proposal, as a first and experimental implementation of optimistic rollups on Tezos. As the name implies, TORUs allow for exchanges of assets, but not execution of smart contracts. ‍Optimistic rollups enable higher throughput (TPS) by moving the validation of transactions away from the main chain, to ‘Layer 2’. They are called optimistic, because they work on the assumption that this validation is correct until explicitly proven otherwise. One consequence of this approach is longer finality when withdrawing from the rollup, currently set to 40,000 blocks (about 2 weeks). With our proposal, Tezos rollups will not be implemented as smart contracts (like, e.g., Arbitrum on Ethereum), but rather natively in the economic protocol — making them enshrined rollups. Leveraging Tezos’ unique self-amendment feature this way allows us to implement more efficient, expressive, and scalable solutions. For a broader understanding of optimistic rollups, and the rationale behind them, we recommend checking out our blog post outlining a scaling strategy for Tezos."
