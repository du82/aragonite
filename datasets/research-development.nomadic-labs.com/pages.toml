["https://research-development.nomadic-labs.com/lima-preview.html"]
title = "Nomadic Labs - What to expect in Lima — our 12th protocol upgrade proposal for Tezos"
description = "A joint post from Nomadic Labs, Marigold, TriliTech, Oxhead Alpha, Tarides, DaiLambda & Functori."
full_description = "This is a joint post from Nomadic Labs, Marigold, TriliTech, Oxhead Alpha, Tarides, DaiLambda & Functori. For our 12th upgrade proposal, we are leaving the Himalayan mountains behind and heading to the coastal climate of Lima, capital of Peru and one of the largest cities in the Americas. Development of next-generation enshrined optimistic rollups on Tezos is progressing steadily. Functioning rollups implemented in Rust are currently running in our test suite. These rollups will however not be part of the Lima protocol upgrade proposal, as more time needs to be spent on validation, testing, and integration with ecosystem tools before they can be activated on Mainnet. We highly encourage ecosystem participants to start experimenting with these rollups on the Mondaynet testnet, where they are already activated. Broad testing and feedback from the ecosystem is invaluable in our efforts to minimize the risk of undetected issues upon Mainnet activation. More on this further below. Now, let’s look at the series of improvements to Tezos functionality contained in the Lima upgrade proposal. Our pipelining work continues to separate validation from application of operations and blocks in order to speed up their processing. It may not sound sexy, but this is an important part of increasing Layer 1 throughput on Tezos. The Kathmandu upgrade reduced the number of times manager operations are applied by a node before it is propagated through the network. This minimizes the delay introduced with each node, as blocks and operations are gossiped through the peer-to-peer network. The Lima protocol proposal extends pipelined validation to all remaining classes of operations, and to blocks themselves. When receiving a new block from its peers, a node will only check the validity of the block before forwarding it to other peers, speeding up block propagation on the network. Afterwards, the node will then apply the block. The upcoming step will be to extend pipelined validation to block production itself, reducing the effort (and hence time) required for bakers to propose new blocks. Along with further upcoming optimizations, this opens the door to reduced block times."
year_published = 2022
