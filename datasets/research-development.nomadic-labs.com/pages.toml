["https://research-development.nomadic-labs.com/tenderbake-has-been-injected.html"]
title = "Nomadic Labs - Tenderbake has been injected"
description = "Outline of what the Tenderbake upgrade means for you, and what benefits it will bring"
full_description = "You may recall from earlier this year our in-depth discussion of Tenderbake, our new classic-style consensus algorithm that offers quick and deterministic finality and safety under asynchrony. Since then, and in collaboration with Functori, we have prepared Tenderbake for inclusion in the next Tezos protocol upgrade proposal Ithaca. A big thank you to the incredible and amazing Functori for their incredibly amazing collaboration! In this post, we will complement our previous discussion of Tenderbake with a recap of some practical aspects of the new consensus algorithm: what does Tenderbake mean for you, how can you use it, and what benefits will it bring? We will overview the most important points here, and you can find further details in Recall that when determining which block to add to the blockchain, Tenderbake proceeds in rounds, starting from round 0: Provided that at least two thirds of the total active stake participates honestly in consensus, then a decision is eventually taken.2 In the current implementation of Tenderbake the duration of each round increments by 15 seconds, starting from 30 seconds: thus the deadline for participation in round 0 is 30 seconds, that for round 1 is 45 seconds after that, and so on. So in normal conditions, when consensus is reached promptly at round 0 every time, we can expect Tenderbake to add one block every 30 seconds. Speaking of bakers — baker daemons now endorse as well. Indeed, Tenderbake bids farewell to the concept of endorser daemon from the Emmy family of consensus algorithms which Tezos has used to date. Goodbye endorser daemon; thank you for the years of service! Aside from the new kind of consensus operations, there are changes to the block metadata and RPCs, so Tezos tool developers — for example, developers of block explorers and indexers — are invited to check the metadata and RPC changes so that their tools can be seamlessly updated. In Emmy*, each time a delegate wants to bake or endorse, it must put down a deposit as a guarantee of honest behaviour. That is: in Emmy* there is a deposit for each individual baking and endorsement action, which is computed such that security deposits are around 10% of the total stake.4 Double signing in Emmy* is penalised by forfeiting the entirety of the deposits made by the delegate during the cycle when the double signing was made.5"
