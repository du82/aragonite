["https://research-development.nomadic-labs.com/million-tps-demo.html"]
title = "Nomadic Labs - We’re doing 1 million TPS on Tezos! Here’s how"
description = "Unleashing the power of Smart Rollups in a public demonstration."
full_description = "TL;DR: In the spirit of “show, don’t tell”, we are proud to present a demonstration of Tezos’ ability to process one million TPS, using Smart Rollups and a data-availability solution built for Tezos. With Smart Rollups live on Mainnet since March, it’s time to demonstrate the power of this technology to the world! Smart Rollups represent a groundbreaking design philosophy in that they enable custom rollup solutions to be built using any programming language that compiles to WASM. See this page for a quick introduction, or the Tezos documentation for a more technical walk-through. But Smart Rollups also play another crucial role: scaling the Tezos network to serve billions of users engaging in high-throughput activities, enabling gas intensive computation, and keeping fees low. This is done with a combination of horizontal and vertical scaling, as described in our blog post on how to scale Tezos from early 2022. Now we are happy to be able to show the outlined approach in action, with a public demo showcasing a throughput of 1 million transactions per second (TPS). To show the throughput achieved in the demo as more than a few metrics on a dashboard, the setup includes a visual representation of the transactions as they happen. The visualization consists of a series of 5-megapixel images being displayed one by one on a webpage. Each transaction in the demo contains information about one RGB color component in one pixel, meaning that three transactions are required to update a pixel. Hence, the display of each 5-megapixel image represents 15 million transactions. As the transactions are executed, the image changes progressively, showing a full change of image for each 15-second block. 15 million transactions executed in each 15-second block: one million transactions per second. The demo runs for two minutes, and a total of eight images are displayed. We should perhaps emphasize that displaying these images serves purely to create a more tangible experience of the throughput achieved. The transactions can represent any type of blockchain operation."
year_published = 2023
clearnet = "https://research-development.nomadic-labs.com/million-tps-demo.html"
