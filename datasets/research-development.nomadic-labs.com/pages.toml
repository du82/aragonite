["https://research-development.nomadic-labs.com/evm-tezos-testnet.html"]
title = "Nomadic Labs - EVM Rollups Are Coming to Tezos – Now on Testnet"
description = "Run Solidity smart contracts on a Tezos rollup."
full_description = "TL;DR: An EVM-compatible Smart Rollup is available on Ghostnet, Tezos’ permanent testnet. This blog post shows you how to get started with it. Connect your Metamask wallet, deploy Solidity contracts with Remix, build dApps using Ethereum JSON-RPCs, and still benefit from the latest Tezos innovations! We are happy to present EVM-compatibility on Tezos via an open source EVM Smart Rollup developed by Trilitech, Marigold, Functori and Nomadic Labs. As the next step towards Mainnet-readiness, an instance of this rollup has been deployed on the Ghostnet test network at block level 3289331. This deployment is a community rollup, meaning it is an EVM-compatible execution environment where all interested community members and project developers can explore and experiment with EVM-development on Tezos. With that goal in mind, this blog post provides instructions on how to interact with the deployed rollup using the Octez software suite. The Ethereum Virtual Machine (EVM) is the execution environment in which all Ethereum accounts and smart contracts live. An EVM-compatible Smart Rollup is a rollup whose kernel implements an EVM-compatible execution environment. This enables Ethereum smart contracts to be frictionlessly deployed and executed on Tezos. Because Smart Rollups allow developers to write applications written in any programming language that compiles to WASM, we were able to develop an open source kernel using an established implementation of the EVM in Rust, SputnikVM. This kernel creates a separate blockchain running in Tezos’ Layer 2, producing its own blocks and processing its own transactions. Currently, there is one EVM block per Tezos block, but Smart Rollups are upgradable, and nothing prevents us from having different block times from Layer 1 in the future. We retrieve the list of transactions to include in EVM-rollup blocks by reading the Smart Rollups’ shared inbox. Thus, we use the Tezos network as our consensus layer, as it provides a sequence of transactions to include in Layer 2 blocks."
year_published = 2023
