["https://research-development.nomadic-labs.com/Mumbai-is-live.html"]
title = "Nomadic Labs - Smart Rollups and 15 second blocks: Mumbai upgrade is live!"
description = "Tezos has activated its thirteenth protocol upgrade, Mumbai."
full_description = "On March 29 2023 16:40:29 UTC, the Tezos blockchain successfully upgraded by activating the Mumbai proposal at block #3,268,609 This 13th Tezos protocol upgrade was jointly developed by Nomadic Labs, Marigold, TriliTech, Oxhead Alpha, Tarides, DaiLambda & Functori. Smart Rollups are live on Mainnet: With Smart Rollups, anyone can deploy decentralized WebAssembly applications with dedicated computational and networking resources. Block time reduced to 15 seconds: With improved pipelining validation fully deployed, block propagation times are significantly reduced, allowing for minimal block time to be halved to 15 seconds. Ticket transfers between user accounts: In Mumbai, Tezos tickets can be transferred between user accounts (aka. implicit accounts) and not just to/from smart contracts and rollups. RPCs for ticket balances: Two new RPC endpoints were added to improve the visibility of ticket ownership. all_ticket_balances returns a complete list of tickets owned by a given contract. And ticket_balance returns the given-contract’s balance of the ticket with specified ticketer, content type, and content. New Michelson operations: Michelson opcodes AND, OR, XOR, NOT, LSL and LSR were extended to support logical operations on bytes, similar to those on nat. And an opcode was added to convert between bytes and nat values. A peek at validity rollups: Our exploration into validity rollup (aka zk-rollup) technology, Epoxy, arrives on the Mondaynet testnet. A deeper technical description can be found in the protocol proposal’s technical documentation, and a complete list of changes is provided in Mumbai’s changelog. Smart Rollups are the backbone of Tezos’ scaling strategy and hence instrumental in reaching our goal of 1 million transactions per second in 2023. But Smart Rollups are much more than that. They enable entirely news way of building decentralized applications on Tezos, using any programming language that compiles to WASM, such as Rust, C/C++, Go and Python."
