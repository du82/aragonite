["https://research-development.nomadic-labs.com/ithaca-is-live.html"]
title = "Nomadic Labs - Ithaca 2, the latest Tezos upgrade, is LIVE!"
description = "Tezos has activated the ninth upgrade to the protocol, Ithaca 2. It replaces the current consensus algorithm (Emmy*) with Tenderbake – a revolutionary upgrade that sets the stage for a new era of innovation for the Tezos protocol."
full_description = "On 1 April 2022, the Tezos blockchain successfully upgraded by adopting the Ithaca 2 proposal at block #2,244,609. It is the ninth Tezos protocol upgrade and was jointly developed by Nomadic Labs, Marigold, TriliTech, Oxhead Alpha, Tarides, DaiLambda, Functori & Tweag. Ithaca 2 introduces Tenderbake, a new consensus algorithm for Tezos. A comprehensive introduction can be found here, but the headlines are: Fast, deterministic finality: A block can be trusted to be final after two blocks, regardless of delays in network communication. Under normal circumstances this is one minute. Choosing a safe network over a live network: As long as 2/3 of the stake is honest, Tenderbake allows no parallel block production that can potentially revert transactions. Any small fork stops producing blocks, and if more than 1/3 of the total stake is isolated, the entire network will halt and await reconnection. The road to faster blocks: While block time is kept at 30 seconds in Ithaca 2, Tenderbake makes it safe to introduce lower block times in future protocol upgrades. Lower minimum stake: The minimum amount of tez required to receive baking/endorsement rights is reduced from 8,000 to 6,000. Instant rewards: Baking/endorsement rewards will no longer be frozen for 5 cycles as has been the case up until now. Fewer problems with overdelegation: Instead of making a deposit with each baked/endorsed block, bakers freeze 10% of their stake upfront in each cycle. Bakers can set a limit for how much of their stake will be used. This prevents missed slots from overdelegation. Total stake is used: Rolls are no longer used for assigning baking/endorsement rights. Bakers will receive slots in proportion to their actual stake, which should benefit small bakers in particular. More endorsements, steady participation: Endorsement slots per block are increased from 256 to 7,000. This means a baker with the minimum amount of tokens will participate every 10 blocks on average. Precheck of manager operations: The new version of the protocol allows any Tezos shell (e.g., Octez and TezEdge) to avoid fully executing manager operations (those created by end users, e.g. transfers and smart contract calls) before gossiping them through the network. This lets operations reach bakers faster, and is a prequel to further optimizations that can increase throughput."
year_published = 2022
