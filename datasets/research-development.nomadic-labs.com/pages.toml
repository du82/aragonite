["https://research-development.nomadic-labs.com/a-popl-2022-retrospective.html"]
title = "Nomadic Labs - A POPL 2022 Retrospective"
full_description = "A few weeks ago, we physically attended POPL 2022 — the 49th ACM SIGPLAN Symposium on Principles of Programming Languages — which took place in Philadelphia, PA and also virtually everywhere on Earth via Airmeet. POPL is a1 premier annual conference event of the programming languages research community showcasing, together with several colocated events, the latest cutting edge results in programming languages, especially in functional programming and formal verification. The latter topics are very dear to the Tezos community, as they enable us to build safety-critical, complex-yet-beautiful software — such as the Tezos protocol and the Octez suite — on sound technical foundations. Moreover, research presented in conferences like POPL have immediate impact on our daily work at Nomadic Labs. We at Nomadic Labs are pleased and proud to have sponsored the colocated CPP 2022 (Conference on Certified Programs and Proofs), for the third consecutive year. After almost two years of virtual events, and debugging audio and video connections across different virtualization platforms, we were eager to return to in-person POPL-ing2 and real-life hallway tracks. Our on-site team consisted of: Michel Mauny, Nomadic Labs’ CEO; Germán Delbianco, Research Engineer at Nomadic Labs; and Michael Holey, Blokhaus’ community manager3. They were present throughout the week at the Tezos booth, eager and ready to answer questions about Tezos. It was an amazing opportunity to promote our interest in these research fields, and also to advertise possible collaborations, openings in the Tezos ecosystem and at Nomadic Labs, as well as research funding opportunities. We are happy to have had the chance to catch up with the PL community, and we hope that we have planted the seeds for fruitful collaborations which will benefit the Tezos community. There was also plenty of interesting, high-quality talks, and below we bring you a few (biased) highlights of this year’s program4. Each year, the ACM SIGPLAN Symposium on Programming Languages — POPL in short — features novel research contributions ranging from theoretical foundations of programming languages (e.g. semantics and type systems), to the development and application of formal tools for crafting, and verifying, reliable and correct systems."
year_published = 2022
