["https://research-development.nomadic-labs.com/jakarta-is-live.html"]
title = "Nomadic Labs - Jakarta, the latest Tezos upgrade, is LIVE!"
description = "Tezos has activated its tenth upgrade to the protocol, Jakarta."
full_description = "On 28 June 2022 23:31 CET, the Tezos blockchain successfully upgraded by activating the Jakarta proposal (technically Jakarta 2) at block #2490369. This tenth Tezos protocol upgrade was jointly developed by Nomadic Labs, Marigold, TriliTech, Oxhead Alpha, Tarides, DaiLambda, Functori & Tweag. We were happy to observe 2/3 of the total stake having performed the required upgrade to Octez v13 or TezEdge v3 a day before activation. Still, we encourage bakers to upgrade to new required node versions at the earliest possible time. This minimizes the risk of the network getting stuck (or advancing slowly) due to the consensus requirements introduced with Tenderbake. Further updates to the protocol environment, and hence mandatory node and baker upgrades, will be necessary for features in upcoming upgrade proposals, such as Smart Contract Optimistic Rollups. We greatly appreciate the community’s help and efforts in keeping Tezos at the forefront of blockchain innovation. Now, let’s celebrate the new features and improvements included in the Jakarta protocol! Not least the first scaling solution on Tezos, and one of few truly decentralized Layer 2 solutions out there: Transaction Optimistic Rollups (TORUs). For more on rollups, see our blog posts introducing TORUs and outlining the rollup-based scaling strategy. Those interested in running a rollup node can check out this rollup tutorial. Tickets hardening: The protocol now explicitly tracks ownership of Michelson tickets (see also ‘Tickets for Dummies’) by checking ticket creation and ownership changes against a global balance table. This adds extra protection against attempts to forge tickets and increases security for Layer 2 solutions that use tickets to represent Layer 1 assets (e.g., TORUs). With this change, tickets are no longer considered experimental and are believed safe for use on mainnet. A safer Sapling integration: The integration of Sapling transactions into Michelson smart contracts has been changed to a new, safer design. With Jakarta’s activation it is now only possible to originate Sapling smart contracts which conform to the new version."
year_published = 2022
clearnet = "https://research-development.nomadic-labs.com/jakarta-is-live.html"
