["https://research-development.nomadic-labs.com/paris-is-live.html"]
title = "Nomadic Labs - Faster Finality, Higher Scalability, Stronger PoS: Paris is Live!"
description = "Tezos has activated its 16th protocol upgrade."
full_description = "On June 4 2024 21:29:25 UTC, the Tezos blockchain successfully activated the Paris protocol upgrade proposal at block #5,726,209. This 16th upgrade was jointly developed by Nomadic Labs, TriliTech, Functori, & Marigold. It contains the following changes: The Data-Availability Layer (DAL) is an important step for Tezos’ long-term scalability and provides a massive throughput boost for Smart Rollups, including Etherlink. An important component of the DAL is that Tezos bakers attest on Layer 1 about which data are available. Baker participation is optional but highly encouraged. Note that requirements for hardware and bandwidth are different for DAL participation than for Layer 1 baking. See our recommendations in this Agora post. Adaptive Issuance means that staking rewards are no longer issued at a fixed rate, but instead will adjust depending on the share of total tez supply involved in staking. This change takes effect 5 cycles (14 days) after protocol activation, around June 19. The Adaptive Issuance rate will initially stay between 4.5% and 5.5%. The span gradually increases over the next 6 months, eventually allowing the rate to fluctuate between 0.25% and 10%. Everyone currently delegating to a baker is encouraged to familiarize themself with the new staker role which complements delegation: Bakers are highly recommended to review their current setup based on points mentioned in this Agora post. See also Tezos Commons’ guide to baking under Adaptive Issuance. Some highlights: We greatly appreciate the wider ecosystem’s involvement in shaping the above features. The feedback has been highly valuable. We look forward to continuing the close collaboration as we turn our attention to the upcoming ‘Q’ proposal. We also hope to see you at this year’s edition of TezDev, the annual flagship Tezos conference. This year’s edition takes place on July 11 in Brussels – just a stone’s throw from EthCC. For now, if you have questions or feedback about DAL participation, staking, or something else, don’t hesitate to reach out."
