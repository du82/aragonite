["https://research-development.nomadic-labs.com/introducing-snapshots-and-history-modes-for-the-tezos-node.html"]
title = "Nomadic Labs - Introducing Snapshots and History Modes for the Tezos Node"
full_description = "A snapshot is a file that contains everything necessary to restore the state of a node at a given block. A node restored via a snapshot can synchronise and help other nodes synchronise in the existing network. The only difference is that you cannot query the chain context (balances, baking rights, etc.) before the restoration point, but you can still get the full chain history. In conjunction, we also introduce history modes, which represent different policies for determining which past data a node should maintain. We propose three modes: archive (the current mode which keeps everything), full (the new default) and rolling. For now, snapshots can fire up a node in either full or rolling mode. These new features allow a user to spawn and synchronise a Tezos node in a few minutes, from a single, untrusted file of about 150MB compressed with a truncated history, or 800MB with a full history. You can test all of that by using the mainnet-snapshots branch on Nomadic Labs’ Gitlab. Be aware that this is not yet production ready, it would not be wise to replace your current infrastructure with nodes from this branch at this date. However, you are very welcome to experiment with it, and all reports will be useful if we want this feature to be merged in mainnet as soon as possible. Full nodes will be the new default, as they are sufficient for almost everyone. We plan to introduce new modes in the future. An important thing to note is that running a full node is enough to maintain the full chain history. Indeed, archive nodes do not need to use archive peers to bootstrap their archive, but only full peers, as the chain data is enough to apply the chain and construct the context archives. In other words, the network does not lose any security by switching to full as the default. To understand the technical details of history modes, let us first recall what checkpoints are in Tezos. In the current protocol, an automatic checkpoint is cemented by the node to the block at position 0 of the 5th previous cycle."
year_published = 2019
year_updated = 2019
