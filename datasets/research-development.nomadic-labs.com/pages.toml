["https://research-development.nomadic-labs.com/lima-is-live.html"]
title = "Nomadic Labs - Lima, the latest Tezos upgrade, is LIVE!"
description = "Tezos has activated its twelfth protocol upgrade, Lima."
full_description = "On December 19 2022 01:57:59 UTC, the Tezos blockchain successfully upgraded by activating the Lima proposal at block #2,981,889. This 12th Tezos protocol upgrade was jointly developed by Nomadic Labs, Marigold, TriliTech, Oxhead Alpha, Tarides, DaiLambda, & Functori. More pipelining: Speeding up propagation of operations and blocks to enable higher Layer 1 throughput on Tezos. This work is also the foundation for reducing block time to 15 seconds in the upcoming Mumbai proposal. Consensus keys: This much requested feature lets bakers change their key for signing blocks and consensus operations without changing the baker’s public address. Improvements to Tickets: Ticket ownership updates are now part of transaction receipts, which helps indexers keep track of tickets. Also, zero-amount tickets will be deprecated. Ghostnet fixes: Lima fixes two problems that arose during the migration from Jakarta to Kathmandu on the permanent ‘Ghostnet’ test network. Liquidity Baking sunset removed: The subsidy can be turned off with the moving-average toggle introduced with the Jakarta upgrade. Temporary Timelock deprecation: Due to a discovered vulnerability, origination of new contracts using Timelock are disabled while a safer mechanism is developed. The changelog provides a detailed list of changes, and a general technical overview of Lima can be found in the protocol proposal’s technical documentation. With Lima activated, we highly recommend upgrading to Octez v15.1, as this version fixes a bug in the bootstrap pipeline that would make v15.0 nodes apply blocks without prechecking them first. As always, we encourage the ecosystem to participate in testnets. Read more about Tezos testnets here, and don’t hesitate to reach out in the Tezos Developer Slack or in the Tezos Discord if you need help getting started."
