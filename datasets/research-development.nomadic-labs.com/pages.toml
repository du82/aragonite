["https://research-development.nomadic-labs.com/academic.html"]
title = "Nomadic Labs"
full_description = "We have established scientific partnerships with some of the best research organizations, such as Inria, CEA-LIST and IMDEA software institute in Madrid (Spain). We also collaborate closely with researchers from Marigold, DaiLambda, Tarides, the OCaml Labs, Cryptonomic, Runtime Verification, Viable Systems, Segfault Systems and many developers from the Tezos ecosystem. The core community of Tezos was built from the start in close relationship to research on blockchains and related areas. As a result, the number of research works on Tezos has kept increasing ever since. This page lists research papers, where Tezos is either part of the proposed contribution or an object of research. Papers where Tezos is just discussed as related work have not been included. Write us at communication@nomadic-labs.com about any new paper corresponding to the above criteria, so we can share it! Victor Allombert, Mathias Bourgoin, and Julien Tesson. Introduction to the Tezos Blockchain. In 5th IEEE International Conference on High Christopher Goes. Compiling Quantitative Type Theory to Michelson for Compile-Time Verification and Run-time Efficiency in Juvix. In 9th International Symposium on Leveraging Applications of Formal Methods (ISoLA‘20), October 20–30 2020. Bruno Bernardo, Raphaël Cauderlier, Guillaume Claret, Arvid Jakobsson, Basile Pesin, and Julien Tesson. Making Tezos Smart Contracts More Reliable with Coq. In 9th International Symposium on Leveraging Applications of Formal Methods (ISoLA‘20), October 20–30 2020. Bruno Bernardo, Raphaël Cauderlier, Basile Pesin, and Julien Tesson. Albert, an intermediate smart-contract language for the Tezos blockchain. In 4th Workshop on Trusted Smart Contracts, February 2020. Bruno Bernardo, Raphaël Cauderlier, Zhenlei Hu, Basile Pesin, and Julien Tesson. Mi-Cho-Coq, a framework for certifying Tezos Smart Contracts. In 1st Workshop on Formal Methods for Blockchains (FMBC‘19), October 2019. Luís Pedro Arrojado da Horta, J