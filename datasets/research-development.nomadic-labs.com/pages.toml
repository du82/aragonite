["https://research-development.nomadic-labs.com/a-review-of-nomadic-labs-in-2020.html"]
title = "Nomadic Labs - A review of Nomadic Labs in 2020"
full_description = "2020 is over and in spite of the difficulties which the year presented, we at Nomadic Labs got a lot done. So here’s who we are, and what we accomplished in 2020: Nomadic Labs is an international technical company dedicated to evolving the Tezos ecosystem. Tezos is a community-driven proof-of-stake self-evolving blockchain platform that adapts and adopts new features and enables borderless global cooperation. So Nomadic Labs contributes to a broad ecosystem dedicated to creating a resilient and global blockchain platform with associated tools. We aim to serve science, society — and the dignity and privacy of productive work in a new technological age. At the start of 2020 we had an office-based culture, based in beautifully-situated offices in the heart of Paris. Then, like everybody else, we adapted to social distancing and — as necessary — to working from home until the pandemic is over. That this adaptation was handled smoothly, was due to some genuinely hard work by administrative staff, and due to a cohesive and friendly company culture1, and we are thankful that we were able to flourish and grow throughout 2020: It’s also worth mentioning how well the Tezos blockchain itself withstood the 2020 stress-test. There were no hiccoughs and no stalls. Nomadic Labs — and the blockchain which is its raison d’être — have been stable in a time of crisis. The technology worked, and the community continued to grow. We held the Tezos Developers Day (shortly before the first lockdown on 17 March). You can enjoy the videos here. We co-organised a Journée Scientifique (a one-day research workshop) with INRIA on 21 September 2020. See the full programme with slides. We started a series of Nomadic Labs research seminars. Topics so far have included practical proofs using Juvix, verifying smart contracts using Mi-Cho-Coq, efficient data storage on the blockchain using Plebeia, and adding multicore programming to OCaml. More to come in 2021! We ran a four-day immersive Tezos training course in Feburary 2020. Topics included the Tezos blockchain architecture; consensus/privacy fundamentals; smart contract languages; indexers; and hands-on dapp (distributed application) building. Speakers were from Nomadic Labs, LIGOlang, Blockwatch Data Inc., ECAD Labs Inc., and Tezos Ukraine, presented to approximately fifty participants with backgrounds ranging from software development to the financial sector. Write to training@nomadic-labs.com to learn how Nomadic Labs could help train you."
