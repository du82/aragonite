["https://research-development.nomadic-labs.com/mumbai-announcement.html"]
title = "Nomadic Labs - Announcing Tezos’ 13th protocol upgrade proposal, Mumbai"
description = "A joint post from Nomadic Labs, Marigold, TriliTech, Oxhead Alpha, Tarides, DaiLambda & Functori."
full_description = "This is a joint post from Nomadic Labs, Marigold, TriliTech, Oxhead Alpha, Tarides, DaiLambda & Functori. We’re happy to announce that Mumbai, our next Tezos protocol proposal, is ready. As usual, Mumbai’s ‘true’ name is its hash, which is PtMumbaiiFFEGbew1rRjzSPyzRbA51Tm3RVZL5suHPxSZYDhCEc. Smart rollups are activated: Smart rollups are fully operational on Mainnet offering a powerful scaling solution. Anyone can deploy decentralized WebAssembly applications with dedicated computational and networking resources. Epoxy makes its first appearance: Validity Rollups (aka ZK-rollups) arrive on the Mondaynet testnet. Epoxy allows for instant finality due to SNARK’s proof-of-validity. Block time reduced to 15 seconds: With improved pipelining fully deployed, block propagation times are significantly reduced – this allows for the minimal block time to be cut in half to 15 seconds! Ticket transfers between accounts: In Mumbai, tickets can be transferred between user accounts (aka. implicit accounts) and not just to/from smart contracts and rollups. RPCs for ticket balances: Two new RPC endpoints were added to improve the visibility of ticket ownership. /all_ticket_balances returns a complete list of tickets owned by a given contract. And /ticket_balance returns the given-contract’s balance of the ticket with specified ticketer, content type, and content. New Michelson operations: Michelson opcodes AND, OR, XOR, NOT, LSL and LSR were extended to support logical operations on bytes, similar to those on nat. And an opcode was added to convert between bytes and nat. In addition to these exciting new features and steady progress, the Mumbai proposal disables Transaction Optimistic Rollups (TORUs) on Mainnet. TORUs were the first optimistic rollup implementation on Mainnet enabled with Jakarta mid 2022, and the first step of the scalability roadmap presented last March. Transaction rollups were always intended to be an temporary solution, as clearly indicated by the sunset they were released with. Now that smart rollups are reaching Tezos Mainnet, it makes little sense to keep transaction rollups enabled, as this functionality can easily be implemented through Smart Rollups. It is important to understand that, if Mumbai is voted in by the community, the transaction rollup subsystem will be completely disabled as soon as the protocol becomes activate on Mainnet. This means tickets deposited on transaction rollups will be lost forever, and operators will not be able to reclaim their ꜩ 10,000 bond. Currently, no transaction rollups have been originated on Mainnet."
