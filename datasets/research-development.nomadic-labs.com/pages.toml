["https://research-development.nomadic-labs.com/tezos-is-scaling.html"]
title = "Nomadic Labs - Get ready to roll. Tezos is scaling"
description = "How optimistic rollups can scale the network, preserve decentralization, and expand smart contract functionality."
full_description = "TL;DR: A series of Tezos protocol proposals in 2022 will focus on paving the way for further adoption, high-throughput use cases and expanded smart contract functionality. The new Tenderbake consensus mechanism enables lower block times, which will improve latency and finality – how quickly a transaction is included and made irreversible by the network. For the user it means faster transactions and smoother running dapps. But Tenderbake doesn’t significantly change how many transactions can be processed per second, throughput. And that is the essence of scaling: enabling more people to do more on the network at the same time. As increased adoption brings more projects, companies, and institutions into the Tezos ecosystem, it’s time to prepare the network for more activity and high-throughput applications. However, there are natural limits to how much we can increase throughput on the main chain, Layer 1. We are pursuing every possible avenue to push the limits but going beyond them has a cost. Any blockchain doing so sacrifices either decentralization, latency, stability, security, censorship resistance, or a mix of these. If we want to avoid this for Tezos, we need a different approach. To support very high-throughput use cases and prepare Tezos for long-term growth, we therefore turn to optimistic rollups, a Layer 2 solution. It’s a solution that can be implemented now to fulfill Tezos’ short-term scaling needs. We expect optimistic rollups to initially offer a 10-100x increase in throughput. And with further upgrades already in the making, it’s a step towards scaling on a whole new level. You can use more powerful computers able to process and store more transactions, vertical scaling, or you can split the workload across a higher number of computers, horizontal scaling. Both have benefits and drawbacks for blockchains. Pure vertical scaling – requiring powerful hardware to participate on the main chain – is a straightforward solution, but it means fewer people are able to participate. The security and censorship resistance of the main chain depends on an honest majority of block producers along with other nodes validating the chain, so it’s important to have low barriers for participation."
year_published = 2022
