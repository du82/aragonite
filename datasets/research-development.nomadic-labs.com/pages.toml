["https://research-development.nomadic-labs.com/introducing-teztale.html"]
title = "Nomadic Labs - Introducing Teztale – a Dashboard for Tezos Consensus"
description = "Monitor the Tezos consensus algorithm and analyze baker performance."
full_description = "TL;DR: Teztale is a new consensus-inspection tool for Tezos, developed by Nomadic Labs. This post shows you how to use it. Consensus algorithms play a central role in maintaining the integrity and security of blockchain networks. They define the rules for how nodes reach agreement on the state of the network and how new valid blocks are added. However, due to changing network conditions, it is not always a straightforward process. To monitor the behavior of Tezos’ consensus algorithm, Tenderbake, we have developed a monitoring tool called Teztale. Initially built for our Incident Response Team, we are now making Teztale available for anyone to use. Tip: If you are not already familiar with Tenderbake, we suggest first taking a look at the following resources: In Tenderbake, a block level (also known as “block height”) is made up of rounds, starting with round 0. Each round consists of three successive phases: A quorum of votes (amounting to over 2/3 of the total active stake) must be gathered for the proposed block at the end of each voting step. Ideally, whenever consensus is reached for a proposal at some level (i.e., attestation quorum is observed), each participant adds the proposed block to their local copy of the blockchain. Then a new instance of the algorithm is started for the next level. However, things may go wrong for many reasons in practice. For instance, messages such as block proposals or (pre-)attestations could be lost or delayed, or some bakers could be desynchronized or offline. Consequently, in some situations, participants may only reach a consensus after multiple rounds. At the top right corner of the Teztale page, you see the head of the chain ( #3797158 in the example shown below) and the address of the Teztale server providing data. If you use the data visualization page with your own Teztale server, it can be / (the default value for data visualization distribution), but any publicly accessible Teztale server can be used. You can also use a Teztale server with a data visualization page hosted somewhere else or running locally."
year_published = 2023
clearnet = "https://research-development.nomadic-labs.com/introducing-teztale.html"
