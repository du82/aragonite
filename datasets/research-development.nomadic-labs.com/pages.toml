["https://research-development.nomadic-labs.com/delphi-the-latest-tezos-upgrade-is-live.html"]
title = "Nomadic Labs - Delphi, the Latest Tezos upgrade, is live!"
full_description = "We’re very happy to announce that the vote on the “Delphi” upgrade to the Tezos network passed a few hours ago (around 13:00 GMT on 12 November 2020.) The upgrade went live immediately afterwards at block 1,212,417. An informal blog post describing Delphi is here, and a changelog of everything that went into Delphi is here. Most prominently, Delphi makes substantial improvements to the performance of the Michelson interpreter and to the gas model, and also reduces storage costs by a factor of four to reflect improvements in the underlying storage layer. We are very pleased that Delphi has gone live; it will dramatically loosen the gas constraints currently experienced by the creators of sophisticated smart contracts operating on Tezos, enabling ever more interesting applications of the system. As described in this other blog post, we intend to continue producing a regular cadence of upgrade proposals to the Tezos network over time; the next, which will likely be named “Edo”, should appear very soon. We are very excited about the features being proposed in Edo, and hope to announce them in the near future."
