["https://research-development.nomadic-labs.com/all-hands-on-deck-for-tenderbake.html"]
title = "Nomadic Labs - All Hands on Deck for Tenderbake"
full_description = "A successful transition to the Tenderbake consensus mechanism relies on the Tezos ecosystem making sure the infrastructure is prepared for the changes. Here is a checklist of the necessary steps. The Ithaca2 protocol proposal contains the perhaps most significant upgrade of the Tezos protocol to date. It introduces a new consensus mechanism, Tenderbake, which brings several improvements including deterministic finality, i.e. absolute certainty that transactions cannot be reversed after two blocks. Replacing the consensus mechanism is in itself a major undertaking, as it defines the rules by which Tezos bakers decide the state of the ledger – a core function of a blockchain. Performing such an upgrade on a live, global blockchain network further complicates things. It is essentially like replacing the engine of a car while it is running, and it is important to note that for certain types of existing infrastructure Tenderbake introduces breaking changes. A decentralized network is dependent on its constituent actors doing their part, and in the Tezos ecosystem that means keeping on top of necessary changes as the protocol evolves. After the Granada upgrade in August, the network experienced longer block times and many missed endorsements, temporarily lowering network “health”. After the Hangzhou upgrade in November, context flattening caused some low-spec nodes to run out of memory. In both cases the network stayed online and the issues were resolved, but there is no denying that protocol upgrades can get bumpy. Despite increased testing efforts on our part, it is not possible to fully model the complexities of the mainnet, and this is where preparation becomes important. To increase the likelihood of a smooth transition, we call on all ecosystem participants to make sure they are prepared for Ithaca2 activation, which will happen around March 31st, provided that the upgrade is voted in by the community. This includes bakers, block explorers, wallet providers, exchanges, indexing service providers, node-as-a-service providers, dapp maintainers, and everyone else involved in providing tooling or services in the Tezos ecosystem."
