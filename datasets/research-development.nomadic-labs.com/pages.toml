["https://research-development.nomadic-labs.com/athens-proposals-injected.html"]
title = "Nomadic Labs - Athens: Proposals Injected!"
full_description = "Today marks an important milestone for Tezos. We just triggered the beginning of the first on-chain vote for self amendment. This process could end in the successful migration from current protocol alpha to Athens in about three months, if the participants decide so. As advertised in the last meanwhile at Nomadic and as detailed in our previous post, we injected the hashes of two proposals. Both include the same enhancements except for one: the decreased amount in the number of tokens needed to be your own baker (the roll size). This post includes instructions to download and observe the code, to recompute the hash of each proposal by yourself, and to examine the differences between the two, and with the current protocol. It then presents the method we recommend to bakers if they wish to upvote either of the two proposals, and a quick reminder of what they will have to do next to confirm their choice in the next voting phases. Finally, it gives instructions for people who want to volunteer in a live test on the Zeronet test network. We just published the source code of both proposals for Athens: A, the one that includes the change in roll size from 10,000 to 8,000 tez and B the one without the roll size change. This code is exactly what we documented in our previous blog post. B simply does not include the change to roll size. To compute the hash, you can use the tezos-protocol-compiler as follows. The result should be Pt24m4xiPbLDhVgVfABUjirbmda3yohdN82Sp9FeuAXJ4eV9otd. Similarly a tar archive for proposal B is located here. Its hash should be Psd1ynUBhMZAeajwcZJAeq5NrxorM6UCU4GJqxZ7Bx2e9vUWB6z. You can observe the differences between the two by using the standard Unix tool diff proposal_A proposal_B. It should only mention the roll size change. If you want to observe the changes with the current protocol, you can use diff against folder proto_003_PsddFKi3 of the mainnet source code. All the changes should be the ones detailed in our previous blog post, except for the removal of the single use migration code from the previous upgrade (from 002_PsYLVpVv to 003_PsddFKi3)."
