["https://research-development.nomadic-labs.com/mumbai2-announcement.html"]
title = "Nomadic Labs - Liveness vulnerability found: A patched Mumbai proposal is available"
description = "We are proposing a patched Mumbai protocol upgrade to address a liveness vulnerability."
full_description = "We have discovered a vulnerability which could affect the Tezos network’s liveness but not its safety. In other words, the vulnerability could slow or halt the network, but not put funds at risk. We have investigated various ways of mitigating the problem via an Octez shell update (everything but the protocol), but none were found to be satisfactory, and a patch for the protocol itself is required. We have taken the step of producing a patched version of the Mumbai protocol upgrade proposal that addresses this vulnerability. The hash of Mumbai 2, the patched version of Mumbai, is: PtMumbai2TmsJHNGRkD8v8YDbtao7BLUC3wjASn1inAKLFCjaH1. As the Mumbai proposal is currently in the Promotion period of the governance cycle, there are two scenarios going forward: User activated protocol override: The community votes Yay to Mumbai in the current voting period. All nodes running v16.0 of Octez will activate the patched version, PtMumbai2, instead of PtMumbaii. This is what happened with the patched Babylon, Edo, and Hangzhou proposals. Restarting the governance cycle: The community votes Nay to Mumbai in the current voting period, and the governance process “reverts” to a new proposal period. A patched Mumbai protocol will then be proposed and must undergo a full governance cycle. This should last about 2.5 months assuming approval in every voting period. A new release candidate, Octez v16.0~rc3, has just been published, and v16.0 is expected shortly after. In addition to the Mumbai 2 protocol, this release candidate also includes performance improvements in the baker that we consider necessary for the block time reduction coming with Mumbai. As stated in a previous blogpost, upgrading to v16.0 (or later) is necessary to participate in consensus once Mumbai is activated, independent from the discussion above. We remind the community that bakers representing at least 2/3 of the total stake must be running the same protocol version for the chain to stay live, due to the requirements of the Tenderbake consensus algorithm."
year_published = 2023
