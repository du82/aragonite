full_description = "Approaches to Preventing and Managing Conflicts in Digital Spaces Waehlisch, M. (Speaker) Political Science and International Studies Activity: Academic and Industrial events › Guest lecture or Invited talk DescriptionThis talk at the Peace Workshop of the Evangelical Church in Germany (EKD) covered approaches to preventing and managing conflicts in digital spaces, focusing on strategies and methods for conducting digital dialogues and other ways to prevent conflict and build peace. It also discussed ethical and practical dilemmas, the dual use of technology, and the challenges of human-machine interaction in the field of peacebuilding.Period19 Feb 2025Event titleEKD-FriedenswerkstattEvent typeWorkshopLocationGermanyShow on mapDegree of RecognitionNational KeywordsPeacePeacebuildingTechnology Documents & Links https://www.evangelische-friedensarbeit.de/ X $(document).ready(function () { runToolTips(); });"
