full_description = "This website is run by University of Birmingham, powered by Elsevier B.V.. We want as many people as possible to be able to use this website. For example, that means you should be able to: We’re always looking to improve the accessibility of this website. If you find any problems not listed on this page or think we’re not meeting accessibility requirements, contact Elsevier’s Support Team via [email protected]. In the United Kingdom, the Equality and Human Rights Commission (EHRC) is responsible for enforcing the Public Sector Bodies (Websites and Mobile Applications) (No. 2) Accessibility Regulations 2018 (the ‘accessibility regulations’). If you’re not happy with how we respond to your complaint, contact the Equality Advisory and Support Service (EASS). For complaints about institutions based in Northern Ireland, contact the Equalities Commission for Northern Ireland (ECNI). This website is partially compliant with the Web Content Accessibility Guidelines version 2.1 AA standard, due to the non-compliances listed below. We are aware of specific accessibility issues with the current version of the Portal interface. Full details of these known issues can be found in our Voluntary Product Accessibility Template (VPAT) report. Elsevier B.V. has no control over the accessibility of uploaded content linked to from pages, for instance datasets or pdf documents associated with research output. As such, we cannot be held liable for their adherence to accessibility criteria. Often, these documents are provided in the format required by the respective publisher. Providing an accessibility solution for these documents would, in our view represent a disproportionate burden within the meaning of the United Kingdom accessibility regulations. This website was last tested on 25 July 2022. The test was carried out by the Elsevier Digital Accessibility team. As Elsevier B.V. powers websites for multiple clients on our platform, we tested accessibility on a sample client, judged to be largely representative. The sample of pages we tested on is based on the most visited pages and those most essential to navigation of our website. For further details on what we tested, and the results, you can read the full accessibility test report Voluntary Product Accessibility Template (VPAT) report."
