full_description = '''Arts and Law The University of Birmingham Websitehttps://www.birmingham.ac.uk/research/artslaw/index.aspx Postal addressShow on mapThe University of BirminghamBirmingham BH15 2TTUnited Kingdom Overview Fingerprint Network Profiles (579) Research output (21338) Projects (2339) Activities (4828) Datasets (75) Prizes (443) Press/Media (585) Organisation profile Organisation profileThe College of Arts and Law is home to outstanding teachers, researchers and professionals at the University of Birmingham. From the secrets of the Dead Sea Scrolls, through the origins of language, to regulating AI, our staff produce distinctive and world-leading research that matters. Through words, music and images, our students engage with the fundamental means of human expression, exploring how people around the world think, write and speak – and share their ideas, beliefs and emotions. In our teaching we discuss challenging and complex issues, such as global challenges in relation to sustainability and climate change, gender issues and international prevention of terrorism and human trafficking. We enhance our students’ experience by offering a wide range of student mobility schemes in 42 countries around the world. UN Sustainable Development Goals In 2015, UN member states agreed to 17 global Sustainable Development Goals (SDGs) to end poverty, protect the planet and ensure prosperity for all. Our work contributes towards the following SDG(s): Fingerprint Dive into the research topics where Arts and Law is active. These topic labels come from the works of this organisation's members. Together they form a unique fingerprint. Law Keyphrases 100% English Arts and Humanities 90% Authors Arts and Humanities 66% Discourse Arts and Humanities 63% Literature Arts and Humanities 62% Politics Keyphrases 53% Corpus Arts and Humanities 50% Case Study Arts and Humanities 50% View full fingerprint Collaborations and top research areas from the last five years Recent external co