full_description = "AI for Peace Waehlisch, M. (Speaker) Political Science and International Studies Activity: Engagement and Public events › Engagement event DescriptionThis workshop focused on the role that artificial intelligence can play in peacebuilding and mediation. The event aimed to provide a comprehensive introduction to AI for non-governmental organizations (NGOs) working in conflict resolution. The session addressed common misconceptions, explored potential applications, and discussed how AI can be a valuable tool in peacebuilding efforts. The overall goal was to establish a shared understanding of AI's capabilities and limitations, empowering organizations to make informed decisions about its use in peacebuilding work.Period13 Jan 2025Event typeWorkshopLocationLondon, United KingdomShow on mapDegree of RecognitionNational KeywordstechnologyPeacebuilding Documents & Links https://aws-experience.com/emea/uki/e/77865/ai-for-peace-101-for-transforming-peacebuilding-through-technology X $(document).ready(function () { runToolTips(); });"
