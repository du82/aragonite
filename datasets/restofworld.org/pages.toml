title = "From the Arab Spring to Russian censorship: a decade of internet blackouts and repression - Rest of World"
description = "In recent years, there have been 935 internet shutdowns worldwide, and censorship has worsened. Here’s how authoritarian regimes found an off switch for dissent, using deep packet inspection, DDoS and total blackouts."
full_description = "Internet Blackouts In the dark Seven years, 60 countries, 935 internet shutdowns: How authoritarian regimes found an off switch for dissent. By Peter Guest 26 April 2022 PROLOGUE Special operation and peace On February 27, a few days after Russia invaded Ukraine, radio journalist Valerii Nechay returned to St. Petersburg from a trip to the North Caucasus to find three men in his apartment. Wearing masks to disguise their features, they told him that if he wanted his mother to be left unharmed, he should leave the country. They needn’t have bothered. Nechay already had a one-way ticket booked to Yerevan, the capital of Armenia. “It actually just helped me to pack my bags much quicker,” he said. From Armenia, he traveled on to Georgia and then on again. Rest of World agreed not to disclose his current location, out of concern for his safety. For nearly two decades, Nechay has worked for the radio station Echo of Moscow, which has broadcast political talk shows and news since 1990. Soon after the invasion of Ukraine began, the station was told, like all media in Russia, to stop calling the war a war. “It led to some kind of jokes we used when we were on air, that Leo Tolstoy once published his novel called Special Operation and Peace,” Nechay said. “But we usually were trying to find a way to convey the real meaning of the word … so saying something like, ‘the war in Ukraine, which the Russian government calls the special operation.’” The evasions weren’t enough. On March 1, Echo of Moscow was shut down by Roskomnadzor, the state media supervision authority. It was the first time it had been off the air since 1991. Its website was taken offline for a time, and its social media accounts soon went dark. The following week, Sputnik Radio, a government-funded radio station, announced it would now broadcast on Echo’s radio frequency. On March 4, a law was rushed through the State Duma, one of Russia’s chambers of parliament, banning “public dissemination of deliberately false information about the use of the Armed Forces of the Russian Federation.” Using anything other than the approved terminology “special military operation” is punishable by up to 15 years in prison. Intimidating journalists and seizing the airwaves are timeworn methods of censorship. But to more comprehensively restrict alternative voices, the Russian government had to use more-sophisticated tools. Many journalists from closed-down publications and channels switched to publishing on social media. Internet users downloaded virtual private networks (VPNs) to get around blocks on overseas news outlets. Just a few years ago, the wholesale blocking of social media and messaging platforms would have been almost impossible in Russia, where the internet infrastructure is sprawling and complex, with hundreds of internet service providers and many points of contact with global networks. But over the past five years, the government of Vladimir Putin has created a sophisticated infrastructure of internet control, built partly with commercially available tools, that has allowed the state to block social media, including Twitter, Instagram and Facebook, inside Russia and to disrupt circumvention tools like VPNs, Tor, and the web proxy software Psiphon. Russia is a pioneer in the use of these tools but not an outlier. The technologies it uses are proliferating, creeping into internet infrastructure all over the world, helped by multinational companies that have turned censorship into an off-the-shelf product. Censored Planet, an internet observatory in the U.S., has tracked more than 100 countries where internet censorship has worsened in the past few years. And even as technically sophisticated methods for information control become easily available, more and more governments are turning to blunt-force tactics, shutting down the internet entirely in response to political opposition or social pressure. Over the last six months, Rest of World spoke to more than 70 technologists, telecomms experts, activists, and journalists from around the world to track how governments’ control over the internet has grown and evolved during the past decade. Their testimony shows that the free, open, global internet is under severe threat. Telecomms blackouts and mass censorship risk fragmenting the internet and even undermining its physical integrity. These threats come in many forms, but most of the experts we spoke to trace them back to a watershed moment, 11 years ago in Cairo, when, facing a mass protest movement that was evolving and growing online, the Egyptian government turned off the internet. PART 1 Kill switch Few people have experienced the full arc of censorship and control in Egypt as comprehensively as Nora Younis. Younis started out as a political blogger in 2005, one of the first generation of Egyptian citizen journalists to report firsthand on protests and human rights violations and to publish online. She filmed protests and documented sexual assaults by the police and posted them to her blog and to social media, animated by a belief that she’d be able to kick-start change in her country. “I was sure in my naïvety [that] it’s just that nobody was brave enough to do this [before],” she told Rest of World. “Nobody has the technology. Nobody has the evidence.” She started reporting for the Washington Post, and, in August 2008, she was appointed digital managing editor of Al-Masry Al-Youm, a Cairo-based daily newspaper. She would soon help to lead the paper’s coverage of the most significant event in Egypt’s modern history, a massive popular uprising against the government that began in January 2011. The beginning of the revolution was, she said, a “magical moment. I was in the right position at the right time, in the right place.” It was the kind of change that she’d imagined years before, although, as a journalist, she insisted on keeping a professional distance. “We tried to be reporting the revolution, not making the revolution,” she said. Social media wasn’t the cause of the uprising, but it played a huge role. On Twitter, protesters posted images and eyewitness accounts; on Facebook, they set up event pages to coordinate the movement, telling their comrades to come to the squares, to dress in black, to congregate by riversides to protest. “It made people feel the sense of ‘usness,’” Younis said. “There is a togetherness: it’s not me alone; there are others. I will go alone, but I will find others.” There is a togetherness: it’s not me alone; there are others. I will go alone, but I will find others. On January 25, 2011, an estimated 50,000 protesters flooded into Tahrir Square, a circular road junction that is the focal point of the city’s downtown district. Called to action at mosques, universities and colleges, and online, the protesters represented a coalescence of interests, from supporters of political Islam to liberal pro-democracy groups, feminists, and trade unionists, each with their own grievances against the regime of then-president Hosni Mubarak. Tahrir Square — “Tahrir” means “liberation” in English — became the revolution’s epicenter, occupied day and night: at times a celebration, at others a battleground. As Egyptian security forces responded with violence and the death toll mounted, it served as a place of collective mourning. Caught off guard by the scale of the uprising, the security forces tried to shut down the protesters’ tools of communication. Twitter was essentially blocked from the evening of January 25 onward, and Facebook was blocked the following day. The restrictions weren’t wholly successful; information kept leaking out, and people still found ways to organize online. In the early hours of January 28, the government pulled the plug. Internet service providers (ISPs) and mobile operators were ordered to suspend their services, and power was cut to the main internet exchange point — the physical meeting point of ISPs’ traffic — in Cairo. For five days, Egypt was almost completely disconnected from the global internet. Thousands of demonstrators demand the ouster of President Hosni Mubarak and political reforms in Cairo, Egypt on January 25, 2011. Mohammed Abed/AFP/Getty Images On the streets, protesters struggled to communicate with each other and with the world. Banks shut, payments bounced. The stock exchange closed. The country’s huge services sector was left reeling as it lost contact with international clients. The Organization for Economic Cooperation and Development, a think tank, estimated that the shutdown cost the Egyptian economy at least $18 million per day. However, it wasn’t as total a blackout as the government hoped. There were still places that had managed to stay connected, via private corporate networks or satellites. On January 28, Younis checked into the InterContinental Cairo Semiramis Hotel, a five-star resort on Cairo’s corniche. Somehow, the hotel’s business center was still connected, as were the rooms, so Al-Masry Al-Youm moved its online operation to a suite there, later occupying three other rooms so editors and reporters could sleep on site. The western-facing suite Younis and her team occupied featured a balcony overlooking the Nile and the Kasr El-Nil Bridge, one of the main river crossings leading to Tahrir Square. From the balcony, Younis filmed as protesters moving across the bridge were confronted by riot police. She recorded for six hours as the clashes turned into a bloody, attritional melée. The protestors would get halfway across the bridge and be beaten back with tear gas, batons, and, sometimes, live rounds; then they’d regroup and fight their way forward again. Younis recorded people being shot, people being run down by armored cars. She cut the video together and published it on Al-Masry Al-Youm’s website, which was still accessible overseas. “Egyptians could not see it,” she said. “But while we were still in that room, we found the video all over, on the BBC and CNN newscasts. They took it from our website abroad, and they streamed it on TV on international networks … and the Egyptians were able to see it on TV.” The protests continued. The internet was largely restored on February 2. On February 11, Mubarak left office. Egypt wasn’t the first large country to shut down the internet in response to protests; during the “Green Movement” uprising in 2009, Iranian authorities throttled networks. But the Egyptian uprising coincided with the global explosion in popularity of social media. The shutdown made the physical vulnerabilities of the web apparent at the moment when belief in its liberating power was at an apogee. “[The internet] had become already so much part of contemporary life, for many anyway, that it was kind of inconceivable that a government would turn it off, or even had the power to turn it off,” Brett Solomon, executive director and co-founder of Access Now, a human rights organization that campaigns against internet restrictions, told Rest of World. Doug Madory, now director of internet analysis at internet monitoring company Kentik, was one of the first people to raise the alarm on Egypt’s sudden loss of connectivity in 2011. He has since become a kind of herald of impending disaster on the internet, identifying sudden outages and disruptions. Before Egypt, the idea of blackouts “wasn’t part of the public narrative,” he told Rest of World. But the sudden shutdown crystallized in the minds of people watching that the internet wasn’t invulnerable, that it could blink off. “The Arab Spring was the top story of the day, globally. … You already had everyone’s attention,” Madory said. “It captured the imaginations for a lot of people, to have a country of that size just completely go lights out for days, in response to massive civil unrest.” For the protesters themselves, it was a sobering moment. “We were very hopeful that now we had the tools to change the world. We were telling ourselves… that you cannot really suppress people [who have the] internet,” Abdelrahman Ayyash, an activist who was part of the movement — and spent the first three days of the January protest in police cells, emerging into the blackout — told Rest of World. “I think we were a bit naïve.” The internet was designed to have no single point of failure. It’s a decentralized network of networks that is hosted on hundreds of thousands of machines spread around the world, connected at a software level by shared protocols that allow it to heal around a breach. That resilience was coded in as part of the U.S. government’s Cold War planning — many of the core mechanisms of the internet having been designed by that country’s military. If part of the network went out due to sabotage or a nuclear strike, the rest would continue to function. This supposed invulnerability is embedded in the internet’s mythology, later meshing with the freedoms felt by pioneers on the World Wide Web, who found they could build and organize out of the shadow of the old gatekeepers in business, politics, and media: The internet would be empowering, democratizing, and self-organizing; information wanted to be free. But the internet isn’t just software. It’s a physical thing with its own geography: massive data centers on the Eastern Seaboard of the U.S., each consuming as much power as a town; roughly 1.3 million kilometers of inch-thick, fiber-optic cabling laid on seabeds; exchange points crammed into tower blocks in city suburbs; cell towers; and copper wiring. It’s not coherent or homogenous but an agglomeration of each generation of technology, often jury-rigged together — “a reliable system built of unreliable parts,” according to Andrew Sullivan, CEO of the Internet Society, a nonprofit organization that advocates for an open web. It’s a public good, run in large part on private systems and through private companies, and a global infrastructure that is subject to local laws and local norms. It’s often in its IRL manifestations, where the digital pokes through into meatspace, that the internet is vulnerable to accident or attack. These are more common than the average Western user, whose networks are relatively robust, might think. Egypt’s first internet blackout — this one unintentional — took place in 2008, when several undersea cables were damaged, one reportedly by a discarded anchor, knocking out services across the Middle East and North Africa. This year, in the month of January alone, Gambia lost access to the internet for eight hours, after a fault on the submarine cable that serves West Africa; Tonga, which is served by a single undersea cable, was almost entirely offline for weeks after an undersea earthquake severed its physical link; and Yemen’s connection was cut by an airstrike. But while these blackouts were the result of accidents or collateral damage, deliberate shutdowns have become increasingly frequent. The Mubarak regime’s shutdown seemed to open a valve. Access Now has recorded at least 935 total or partial i"
