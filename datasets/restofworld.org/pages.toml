["https://restofworld.org/2024/bjp-whatsapp-modi"]
title = "In India, the BJP’s WhatsApp strategy powers the political party - Rest of World"
description = """
As millions of Indians vote, there’s one platform most of them will turn to for information: WhatsApp. And no one controls the political narrative on WhatsApp like the BJP, the ruling party helmed by Prime Minister Modi.
In partnership with the Pulitzer Center on Crisis Reporting and Digital Witness Lab, Rest of World spent several months in northern India to explore how the BJP turned its WhatsApp strategy into an election-winning machine. Just in Mandi, a tiny Indian town with a population of 26,000, party volunteers run a network of more than 400 WhatsApp groups. Our analysis of thousands of messages sent in these groups shows how India’s ruling party is able to maintain a sophisticated operation on WhatsApp, and optimize its political campaign on the platform far away from public scrutiny.
Written by Srishti Jaswal. Narrated by Mithila Phadke. 
Original story: https://restofworld.org/2024/bjp-whatsapp-modi/"""
full_description = '''Features Inside the BJP’s WhatsApp machine An analysis of thousands of messages reveals how India’s ruling party uses the app to campaign free from public scrutiny. By Srishti Jaswal 15 May 2024 • Mandi, India This story is published in partnership with the Pulitzer Center’s AI Accountability Network and Princeton University’s Digital Witness Lab. On January 22, India’s prime minister, Narendra Modi, inaugurated the Ram Mandir, a Hindu temple in the northern city of Ayodhya. Dressed head to toe in cream and gold, Modi led prayers and rituals at an event that dominated national news and effectively kicked off his 2024 reelection campaign. The inauguration held great significance for many Hindus, but it also invited controversy. The temple is built on the ruins of a razed Mughal-era mosque and has become a flashpoint of tension between Hindus and Muslims, exacerbated by the Hindu nationalist views promoted by Modi’s Bharatiya Janata Party (BJP). Three days after the event, Kanav Sharma, an electrician who lives in the Himalayan town of Mandi, saw a video on Facebook that showed police in riot gear violently detaining several young men, dragging them away as sirens blared in the background. Hindi captions claimed the men had attacked a religious procession in Mumbai following the inauguration. Inside the BJP’s WhatsApp machine As millions of Indians vote, there’s one platform most of them will turn to for information: WhatsApp. And no one controls the political narrative on WhatsApp like the BJP, the ruling party helmed by Prime Minister Modi. In partnership with the Pulitzer Center on Crisis Reporting and Digital Witness Lab, Rest of World spent several months in northern India to explore how the BJP turned its WhatsApp strategy into an election-winning machine. Just in Mandi, a tiny Indian town with a population of 26,000, party volunteers run a network of more than 400 WhatsApp groups. Our analysis of thousands of messages sent in these groups shows how India’s ruling party is able to maintain a sophisticated operation on WhatsApp, and optimize its political campaign on the platform far away from public scrutiny. Written by Srishti Jaswal. Narrated by Mithila Phadke. Original story: https://restofworld.org/2024/bjp-whatsapp-modi/ Listen to this story 28 minutes 0:00/28:18 1x Long Reads by Explore more episodes >> Sharma went to share the video, dropping it in a WhatsApp group designed for residents to seek and offer assistance with odd jobs. The video spread around other Mandi WhatsApp groups. Within 10 minutes, it had reached groups containing over 1,700 Mandi residents. Group members reacted with a thumbs-up. There was one problem: The viral video was neither shot in January nor was it related to the Ram Temple inauguration. It was an old video of police detaining people following a 2022 protest in Hyderabad, hundreds of miles away from Mumbai. Abhishek Kumar, a senior fact-checker at the Indian nonprofit Alt News, told Rest of World that “the information spread with this particular video is not only false, but it also glorifies police brutality and is being shared praising it.” Asked by Rest of World, Sharma said he hadn’t realized the video was old, or inaccurate. “We thought it might be from there [Mumbai],” he said. A portion of a viral video shared on WhatsApp showing police detaining people at a protest in Hyderabad in 2022. India’s ongoing elections are the world’s largest in history, with almost 1 billion people eligible to vote. They are so big that voting is being conducted in waves from April 19 to June 1. The BJP, which has been in power for 10 years, is widely expected to win. But in the process, both Modi’s administration and his electoral campaign have been criticized for stirring hate against Muslims and increasing polarization. As millions of Indians vote, many of them will turn to WhatsApp for information. India is the Meta-owned app’s largest market, with 400 million active users — more than a quarter of the country’s population. India’s last general elections, in 2019, were labeled the “WhatsApp elections” because of the platform’s prevalence and influence. In 2024, politicians are redoubling their focus on the app. Kiran Garimella, an assistant professor at Rutgers University who researches WhatsApp in India, told Rest of World the app reaches people that other platforms don’t, including remote communities. “There are a number of people in India who only use WhatsApp,” he said. 400 million The number of active WhatsApp users in India. The scale of the BJP’s WhatsApp operations is incomparable to that of any other political party in the country. Over the past decade, the BJP has grown a vast network of WhatsApp groups that attempts to influence voters by spreading campaign messaging and propaganda. According to a report in the Deccan Herald, there are now at least 5 million WhatsApp groups operated by the BJP in India. Unnamed party leaders told the Herald the BJP’s WhatsApp infrastructure is so powerful that it can disseminate information from Delhi to any location in the country within 12 minutes. Just in Mandi, a town in the northern state of Himachal Pradesh — with a population of 26,000 according to the last census in 2011 — administrators affiliated with the BJP run a network of more than 400 WhatsApp groups. That includes the local assistance group, where Sharma first posted his video. Shivam Shankar Singh, a political consultant who previously worked with the BJP, told Rest of World the party’s dominance on WhatsApp gives it an electoral advantage. “Distribution matters more than narrative,” he said. “WhatsApp provides India’s largest distribution platform [for political messaging].” !function(){"use strict";window.addEventListener("message",(function(a){if(void 0!==a.data["datawrapper-height"]){var e=document.querySelectorAll("iframe");for(var t in a.data["datawrapper-height"])for(var r=0;r<e.length;r++)if(e[r].contentWindow===a.source){var i=a.data["datawrapper-height"][t]+"px";e[r].style.height=i}}}))}(); Garimella, the Rutgers researcher, said the BJP’s “extreme coordination” and prowess on WhatsApp could benefit them. The closed nature of WhatsApp — only people in a group can see the content shared there — is also a concern. Unlike social media platforms such as X or Facebook, conversation in WhatsApp groups is usually hidden from public view, and largely goes unmoderated and unscrutinized. “It is concerning that such a huge ‘hidden’ infrastructure plays a huge role in how the public consumes information,” Garimella said. “Only the creators of these groups know the extent to which the tentacles of this WhatsApp infrastructure are spread.” WhatsApp provides India’s largest distribution platform [for political messaging]. Over the past five months, Rest of World, in collaboration with Digital Witness Lab — a research group at Princeton University that builds tools to investigate social media platforms — analyzed activity across BJP-affiliated WhatsApp groups in Mandi in order to understand the app’s role in the BJP’s 2024 election campaign. Rest of World joined five WhatsApp “communities” — groups of groups which act more like announcement channels. Admins can add both groups and individuals into communities and share messages with them en masse. These communities were created by the BJP, and included more than 142 groups — of which Rest of World joined 18 groups. In addition, Rest of World joined five local groups operated by religious institutions, one group set up by Mandi’s governance bodies, and three community-led groups to see how election-related messaging spreads in “non-political” groups. In two of these groups, a BJP member was an admin but the groups were not identified as BJP groups. All groups observed had more than six members, and were created for the purpose of broadcasting messages to a community or discussing public events. Based on our analysis of activity in the groups, as well as interviews with BJP workers, volunteers, and voters, Rest of World was able to map out the BJP’s extensive WhatsApp campaigning machine in one small town. That machine depends on an army of volunteers who run groups targeting voters based on their location, profession, age, religion, gender, caste, and tribe. Our findings show how a cast of hundreds of BJP members has set the narrative on WhatsApp about what gets discussed in the elections, and how. We also documented how the closed nature of WhatsApp and the ease with which messages can travel from group to group results in a blurring of lines between political and personal speech, making it hard for voters to know which messages have come directly from the BJP and which have emerged organically. BJP workers appear to take advantage of this ambiguity to push the party’s messaging. The meticulous operation shows just how far ahead of the opposition the BJP is in understanding how WhatsApp works and using the platform to promote its campaigning. The party has built a distribution mechanism on WhatsApp that is so large in scale, it creates a clear imbalance as the elections approach. The town of Mandi sits in the Himalayan mountains in northern India. The town of Mandi is located in the northern Indian state of Himachal Pradesh, amid the Himalayan mountains. Like many Indian towns, it has a majority Hindu population with Sikh and Muslim minorities. Mandi goes to the polls in the last wave of voting, on June 1. As that date nears, local BJP leaders have gone all-in on WhatsApp campaigning. The BJP is fielding Bollywood celebrity Kangana Ranaut as its candidate, while the Indian National Congress — the main opposition party — is putting forward Vikramaditya Singh, a royal from Himachal. In Mandi, the BJP has a WhatsApp group for everyone. There is a hierarchy of groups organized from the national level down to state, district, sub-district, and so on — all the way to individual “booths,” which represent the community of people who vote at the same polling booth. Then there are groups targeted to different demographics and interests: In Mandi, farmers can join at least two farming-focused WhatsApp groups. There are also groups for youth, doctors, ex-servicemen, traders, and intellectuals. Women have the option to join the group “Mahila Morcha,” Hindi for “women’s wing.” There are groups for official caste classifications and tribe classifications. Some groups are intended only for BJP workers or members; others are open to the general public. There are also BJP-linked groups that aren’t explicitly political. One such group is dedicated to keeping Mandi clean and tidy — but a BJP member is still an admin. A video satirizing Congress leader Rahul Gandhi circulated in Mandi WhatsApp groups at the start of 2024. The video depicted Gandhi as Ravana, the demon king with 10 heads who was defeated by Hindu lord Ram. Rest of World first saw the video forwarded by someone in one of the official BJP WhatsApp groups for Mandi on January 11. The message had a Forwarded tag. Rest of World first saw the video forwarded by someone in one of the official BJP WhatsApp groups for Mandi on January 11. The message had a Forwarded tag. The next day, the same message was shared in a different local WhatsApp group — a fan club for Anil Sharma, Mandi’s member of the Himachal Pradesh Legislative Assembly. This time, it had a Forwarded many times tag. The next day, the same message was shared in a different local WhatsApp group — a fan club for Anil Sharma, Mandi’s member of the Himachal Pradesh Legislative Assembly. This time, it had a Forwarded many times tag. One hour later, the same message was once again forwarded in the same group, by another member. One hour later, the same message was once again forwarded in the same group, by another member. On February 9, nearly a month later, the video resurfaced and was shared yet again in the same fan-club group — suggesting it had likely been spreading elsewhere before making it back into the Mandi WhatsApp ecosystem. On February 9, nearly a month later, the video resurfaced and was shared yet again in the same fan-club group — suggesting it had likely been spreading elsewhere before making it back into the Mandi WhatsApp ecosystem. “This shows how easily and quickly disinformation spreads throughout India using WhatsApp,” said Abhishek Kumar, a senior fact-checker at the Indian nonprofit Alt News. All of this requires a dedicated workforce: A BJP worker told Rest of World he had a volunteer team of 500 members running social media operations in Mandi, including overseeing around 400 WhatsApp groups and preparing to oversee around 600 groups by the time of the elections. As polling day in Mandi nears, Rest of World has seen new groups being added to the network. BJP workers said this WhatsApp arrangement is not unique to Mandi, and that almost all districts in India follow a similar model. Chetan Singh Bragta, who is in charge of the BJP’s social media and information technology operations in the state of Himachal Pradesh, told Rest of World the party started building its WhatsApp presence there in 2014; ahead of state elections in 2017, the WhatsApp group infrastructure was complete. It has been growing ever since. There are now around 8,000 groups across the state — at least one for each polling booth. In Mandi, BJP volunteers began augmenting their WhatsApp campaigning strategy in the fall of 2023, nearly six months before the election dates were announced. One of the people involved in the process was an unpaid BJP leader who agreed to speak on condition of anonymity, as he was concerned about backlash from the community. Rest of World met him in his office, a room under construction in a building next to the river Beas, which flows through the town. A certificate of appreciation from the BJP hung on the wall. Two young volunteers were also working in the office. Using a desktop computer and a phone, the leader showed Rest of World five BJP communities he had created on WhatsApp, containing hundreds of groups. He said he used three WhatsApp accounts to avoid spam detection. He explained that he works alongside 12 other volunteers in the local BJP IT department, where his job includes creating WhatsApp groups and adding members to them. His other colleagues in the social media department, also volunteers, are then tasked with sharing content in those WhatsApp groups. A campaign poster featuring prominent Congress leaders on display in Mandi in May 2024. There is a strict hierarchy to the BJP’s operations. Every day, the party’s offices in New Delhi send messages to be shared across groups at regional and local levels. Bragta, who is based in Himachal Pradesh's capital city Shimla, said he religiously looks at updates from Delhi in the morning to understand what narrative-building is supposed to be done for the day. He also hosts daily half-hour meetings with workers across the state. “We discuss issues and get fe'''
