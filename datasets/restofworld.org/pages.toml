title = "How governments use facial recognition for protest surveillance - Rest of World"
description = """
Mass protests used to offer a degree of safety in numbers. Facial recognition technology changes the equation.
This story explores how thanks to new facial recognition technology, protesters’ safety in numbers is becoming a thing of the past. We take a look at three case studies — in Russia, India, and Iran — to show the proliferation of facial recognition as a tool to control and curtail protest.
Written by Darren Loucaides. Narrated by Jane Seidel. 
Original story: https://restofworld.org/2024/facial-recognition-government-protest-surveillance/"""
full_description = "Features The changing face of protest Mass protests used to offer a degree of safety in numbers. Facial recognition technology changes the equation. From the Arab Spring to the Umbrella Revolution, mass protests have shaken governments around the world. From the Arab Spring to the Umbrella Revolution, mass protests have shaken governments around the world. But over the past decade, facial recognition technology has increased the risks around expressing dissent. But over the past decade, facial recognition technology has increased the risks around expressing dissent. Demonstrators can be picked out of a crowd, arrested, or even preemptively detained. Demonstrators can be picked out of a crowd, arrested, or even preemptively detained. Illustrations by Matt Huynh for Rest of World By Darren Loucaides 27 March 2024 Intro An end to privacy On March 13, 2022, 34-year-old English teacher Yulia Zhivtsova left her Moscow apartment to meet her friends at the mall. Bundled up against the freezing cold, she entered the metro at the CSKA station on the Bolshaya Koltsevaya line, passing through station barriers that let travelers pay by scanning their faces. But when she went down to the platform, two police officers plucked her out of the crowd. “Hey!” said one, and then addressed her by her full name, including the Russian patronymic. “Yulia Maksimovna. Come with us.” The officers looked back and forth between Zhivtsova and an image on their smartphones. They seemed unsure if they had the right person. Catching a glimpse of the screen, Zhivtsova recognized a photo of herself taken the month before, when she was detained for protesting Russia’s war in Ukraine. Her hair looked different: In the photo it was faded blue, but that day it was back to a gleaming teal. “I do tend to change my hair color a lot,” Zhivtsova told Rest of World. After a while, the officers decided to trust the image on their smartphones. Another anti-war demonstration was taking place in Moscow that day, and even though Zhivtsova didn’t plan to attend, they detained her preventively, holding her for a few hours. The changing face of protest Mass protests used to offer a degree of safety in numbers. Facial recognition technology changes the equation. This story explores how thanks to new facial recognition technology, protesters’ safety in numbers is becoming a thing of the past. We take a look at three case studies — in Russia, India, and Iran — to show the proliferation of facial recognition as a tool to control and curtail protest. Written by Darren Loucaides. Narrated by Jane Seidel. Original story: https://restofworld.org/2024/facial-recognition-government-protest-surveillance/ Listen to this story 33 minutes 0:00/33:10 1x Long Reads by Explore more episodes >> Over the past decade, there has been a steep rise globally in law enforcement using facial recognition technology. Data gathered by Steven Feldstein, a researcher with the Carnegie Endowment for International Peace, found that government agencies in 78 countries now use public facial recognition systems. The public is often supportive of the use of such tech: 59% of U.K. adults told a survey they “somewhat” or “strongly” support police use of facial recognition technology in public spaces, and a Pew Research study found 46% of U.S. adults said they thought it was a good idea for society. In China, one study found that 51% of respondents approved of facial recognition tech in the public sphere, while in India, 69% of people said in a 2023 report that they supported its use by the police. But while authorities generally pitch facial recognition as a tool to capture terrorists or wanted murderers, the technology has also emerged as a critical instrument in a very particular context: punishing protesters. The last 20 years have shown that mass demonstrations can have real impacts. Starting in 2010, a wave of protests across the Middle East and North Africa, known as the Arab Spring, toppled regimes in Tunisia, Libya, Egypt, and Yemen, and spurred revolts in many other countries. In 2014, protesters in Hong Kong took to the streets for universal suffrage, sometimes called the Umbrella Revolution owing to protesters’ use of umbrellas to shield against pepper spray. While authorities did not make any concessions at the time, the protests drew global attention, and when Hong Kongers took to the streets with new demands in 2019, the government withdrew a controversial bill that would have allowed suspects to be extradited to mainland China. In 2020, the #EndSARS movement against police brutality in Nigeria resulted in the disbanding of the Special Anti-Robbery Squad, the police force at the center of the controversy, while mass protests in Chile led to a cabinet reshuffle and a referendum to rewrite the country’s constitution. So far, 2024 has been marked by several large-scale protest events, including farmers’ protests in India and Europe, and protests in many countries against the war in Gaza. In countries where demonstrating can come with physical or political risk, large-scale protests have historically offered a degree of anonymity, and, with it, a level of protection. Mass protests are a way for citizens to express dissent as a collective — often under the assumption that “they can’t arrest us all.” But in the last decade, the spread of facial recognition technology has changed that equation: A lone face in a crowd is no longer anonymous; facial recognition allows authorities to capture people’s identities en masse. It’s no coincidence that the widespread adoption of the technology has evolved in parallel with increasingly draconian laws against protest. As part of its “Protect the Protest” project, Amnesty International tracks repressive legislation that imposes illegitimate restrictions on protests, with examples across five regions. Facial recognition tech helps enable this repression by offering a way to enforce such regulation on a sweeping scale. In the U.S., law enforcement used facial recognition at Black Lives Matter protests in 2020, resulting in at least one activist being targeted at their home. In the U.K., the London Metropolitan Police admitted to using facial recognition technology on tens of thousands of people attending King Charles III’s coronation in May 2023. Often, facial recognition is used to disproportionately target people belonging to a racial, ethnic, or religious minority. “Again and again we see that it’s people who are already targeted by police or subject to severe movement restrictions, or have already been subject within their communities to police brutality, that are most targeted by these tools,” Matt Mahmoudi, a researcher at Amnesty International who specializes in facial recognition, told Rest of World. Mass demonstrations have become opportunities for authorities to net thousands of faces via CCTV, van-mounted cameras, and police mobile devices, which can then be added to facial recognition databases. In the past month, Indian authorities used the technology to identify people who participated in farmers’ protests, threatening to cancel their passports. A Russian civil society group believes Moscow police used the technology to track down people who attended opposition leader Alexei Navalny’s funeral. Law enforcement walk past crowds gathered for the funeral service of Alexei Navalny in Moscow, Russia, on March 1, 2024. Alexander Nemenov/AFP/Getty Images The result is a fundamental shift in the power balance between authorities and the general public that is changing the nature of protest. The most obvious outcome is a chilling effect: Facial recognition technology puts demonstrators at greater risk of persecution, often stymieing efforts to protest before they even occur. Meanwhile, those still brave enough to take to the streets are finding ways to try to mitigate the threat. Protests in Chile and Argentina saw people donning face masks and balaclavas. Activists in London have painted their faces with so-called dazzle makeup, developed by artist Adam Harvey and designed to confuse algorithms (although experts warn that this may not be effective against newer facial recognition systems). In Hong Kong, during the pro-democracy protests that started in 2019, demonstrators again employed umbrellas, which helped conceal their faces from police surveillance, fired lasers to blind cameras, and felled surveillance towers. In mainland China, protesters demonstrated against the government in November 2022 by holding blank pieces of paper in the air and in front of their masked faces. Authorities are often secretive about their use of facial recognition at protests. Often, the people arrested are not told whether the technology has played a role in their detention, even if they suspect it. Over six months, Rest of World spoke to researchers, activists, and people targeted by facial recognition systems around the world to track how this technology is upending protest as we know it. We found evidence of facial recognition tools being used at major protests worldwide, often in a way that clashes with civil liberties. The context may vary by location, but the overall outcome is shared: Facial recognition technology is making the act of protest riskier than ever, putting demonstrators at greater risk of persecution, exacerbating the targeting of minority groups, and changing the way people express dissent. Combined with a rise in authoritarianism in many countries, some activists and civil groups even fear that the increased use of facial recognition could mean an end to protest as we know it. “I don’t see [almost] any protest anywhere,” Shivangi Narayan, a sociologist in India who studies digital policing, told Rest of World. “Even a person like me who’s working on government surveillance and policing — I’m wary of who I’m talking to.” Now, if she knows there will be CCTV surveillance at a particular location, Narayan avoids the area, or covers her face. Russia The rise of pre-crime Six months after being detained at CSKA station, Yulia Zhivtsova was back on the Moscow Metro. It was September 30, 2022, and the government was holding a concert rally next to the red-brick walls surrounding the Kremlin to celebrate the “new territories” annexed from Ukraine. Zhivtsova hadn’t attended protests since her last detention; she was heading home from a dance class. But when she entered the metro at Tverskaya station, two officers stopped her. Again, they took a while to compare the image on their screens with the woman in front of them — who now had shorter hair — before taking her in. Zhivtsova expected to be detained for a couple of hours and let go like last time. But at the police station, officers noticed a tattoo on her hand. After her previous detention, she’d gotten the words “No to war” inked. The officers charged Zhivtsova with “discrediting the military” under draconian new legislation that carries a possible five-year prison sentence. Yulia Zhivtsova was charged with “discrediting the military” for a tattoo on her hand that reads “No to war.” Yulia Zhivtsova In August 2023, she was convicted and fined 50,000 rubles ($540). Shortly after, she left Russia, fearful that she would be sent to prison if she were caught with the tattoo again. Zhivtsova now lives in Montenegro. “I’m not going back anytime soon,” she said. Other anti-war protesters in Russia have similar stories. After the invasion of Ukraine, Andrei Markov put up anti-war posters in public spaces. He also wrote snippets of anti-war graffiti on the Moscow Metro. One Thursday afternoon in July, he boarded a quiet carriage and scrawled the words “no war” on the corner of a subway map in permanent marker. The following Sunday, police knocked at his apartment. “That was a bad surprise,” he told Rest of World. “I didn’t open the door.” But when he entered the metro for his commute on Monday morning, police stopped him. Markov asked to be identified by a pseudonym because he currently lives in Russia and fears authorities could target him further for speaking out. He said he spent 40 hours in a 3-square-meter cell between interviews. “It was a very bad experience. I could not call relatives, lawyers or anybody else, and it made me really nervous. They even did not give any drink or food,” Markov said. Finally, officers told him he was accused of discrediting the military. They showed him a video of him writing the graffiti. They also told him that he had appeared in Sfera, a facial recognition system used in Moscow’s metro. He was released with a fine. But the next time Markov went to take the metro, a police officer immediately stopped him. Markov explained he’d already been arrested and paid the fine. The officer shrugged. “This is not my problem,” he said. Markov doesn’t take the metro any more, and has changed his apartment and phone number. “But I’m sure they can still find me very easily,” he said. “Not just me, but everybody. They’re using modern systems that are really good to find any person.” Rest Of World spoke to five Russians who had attended protests in the past and were later tracked down by law enforcement using facial recognition technology. OVD-Info, a Russian human rights and media group dedicated to fighting political persecution, has documented 595 cases in which facial recognition technology was used against dissenters since 2021. Of those, 141 were cases of activists being detained preventively on the metro — all since the invasion of Ukraine. OVD-Info defines preventive detentions and arrests as stopping people who have not been charged with anything, as a way of preventing them from attending political protests. Protesters march in support of Alexei Navalny in Moscow on January 23, 2021. Kirill Kudryavtsev/AFP/Getty Images But while many detainees report police officers verbally stating that they have been caught by facial recognition technology, or even showing them the Sfera system on their devices, the tech rarely appears in court documents. “The authorities are still hiding the facts,” Stanislav Seleznev, a lawyer working for Net Freedoms Project, which defends Russian digital rights, told Rest of World. Russia’s use of facial recognition has coincided with a general clampdown on protest following mass demonstrations in December 2011 around elections to the State Duma, the lower house of Russia’s parliament. The next year, authorities installed 60,000 new cameras in Moscow alone. In subsequent years, several Russian companies emerged offering facial recognition tech to the authorities. In 2017, the Moscow Department of Information Technologies announced that 3,000 of the city’s now 160,000 cameras were being connected to a facial recognition system by software company NtechLab. Authorities also started to regularly deploy the tech at protests, rallies, and private events. In 2018, it was connected to the Moscow Metro; in 2019, the Ministry of Internal Affairs claimed it had identified"
