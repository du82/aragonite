["https://restofworld.org/2021/gig-workers-around-the-world-are-finally-organizing"]
title = "‘We’re all fighting the giant’: Gig workers around the world are finally organizing - Rest of World"
description = "Faced with fragility and uncertainty, gig workers are connecting across borders to challenge platforms’ power and policies, and to organize into unions and stage strikes."
full_description = "The Global Gig Workers “We’re all fighting the giant”: Gig workers around the world are finally organizing Faced with fragility and uncertainty, gig workers are connecting across borders to challenge platforms’ power and policies. By Peter Guest 21 September 2021 • Singapore The Global Gig Workers This project examines, through the experience of gig workers, how digitization is reshaping working patterns, lifestyles and livelihoods. The Global Gig Workers This project examines, through the experience of gig workers, how digitization is reshaping working patterns, lifestyles and livelihoods. This past July, Singh was on a midnight run, biking a chocolate mousse cake 7 kilometers across Mumbai, when he was rammed by a drunk driver on a scooter from behind. He got off with a few scratches and sprains, but his bike was badly smashed up. The cost of fixing it — 14,000 rupees ($189) — is about what he takes home in a month working for Zomato, the Indian food and grocery delivery app. So for the last month, he’s been fixing it up a bit at a time whenever he can get the money together. Singh, in his 40s, speaks in long, flowing sentences peppered with literary references and fatalistic humor. He began riding for ZomatoiZomatoZomato is a popular food delivery platform in India that started as a restaurant aggregator site in 2008.READ MORE in 2020 after struggling to find work in India’s shrinking job market. “I googled ‘jobs I can find today,’” he told Rest of World. “And food delivery popped up. … It was the easiest job I’ve ever gotten in my life.” Within an hour of signing up, he was delivering meals. For the first couple of weeks, it felt like easy money — he was on target to earn roughly $350 in a month, within the range the app had promised, around twice the average monthly salary in India. But then the orders started drying up. Riders would be directed to “red zones” — areas where there was supposed to be a glut of orders — but there’d be no work there. They’d be sent onto another red zone, burning uncompensated time and fuel. He had to work longer and longer to make enough money, often riding for 12 hours or more a day, and the technology that directed him from gig to gig felt ever more intrusive. Whenever the app decided he was behind schedule, his phone would ring, and an automated voice would tell him to speed up or face a penalty. To make up the time, he’d take risks, darting up a one-way street or jumping a red light. During idle moments, the app would serve up videos telling him how to please customers by smiling and bowing. Sometimes, those videos would remind drivers not to speak to the media, which is why Singh asked to be identified only by his surname, for fear of being banned from the app. “You are a number, whether you like it or not,” Singh said, describing the exhaustion and anxiety that come from working for an algorithm whose decisions — who gets what gig, who gets suspended, who gets fined or rewarded — often feel arbitrary. “You are a number, you are an ID, you are a scooter icon that moves around a map. … The app does not know you. The app does not listen to you.” Zomato didn’t respond to a request for comment. A Zomato driver is seen on the streets of Bengaluru, India in August, 2021. Kisha Ravi for Rest of World With his bike currently in disrepair, Singh has been on the sidelines for the last month. It’s given him time to muse on his situation and that of his colleagues. He’d already created a Twitter account, @DeliveryBhoy, to chart his experiences on the road. Starting in August, he began sharing screenshots from within the Zomato app, showing the tiny payouts, unattainable targets, and arbitrary deductions that riders struggle with. His message — that platform work is hard, insecure, underpaid, and unappreciated — has resonated, not just among fellow riders in India, but with platform workers across the globe. His account has only around 4,600 followers, but it’s already been cited by newspapers, academics, and activists worldwide. In August, Singh linked up with the Gig Workers Collective, which campaigns for rights for platform workers, primarily in the United States. Through the collective, Singh spoke over the phone with Willy Solis, a Texas-based “shopper” for the grocery delivery company Shipt and a leading figure in the U.S. platform workers’ movement. “In speaking to him, I heard our story,” Solis told Rest of World. To understand how platform work is experienced worldwide, Rest of World, in partnership with the research company Premise, surveyed more than 4,900 gig workers across 15 countries. We combined their responses with data compiled by global labor bodies and academic researchers, along with in-depth interviews with gig workers in Africa, Latin America, Asia, and Eastern Europe. We also approached six of the largest platform companies operating globally, none of which agreed to be interviewed. The data shows that, while the experience of platform work is very local and takes on features of the societies and economies in which it operates, it’s also universal. Platform workers, whether they’re based in the U.S. or Nigeria, Indonesia or Ethiopia, are all struggling with a shared set of challenges: insecurity, anxiety, low wages, and high costs. While the nature of platform work means that workforces are atomized and divided — and platform companies have often refused to recognize workers’ groups and unions — the common experience of precarious and often dangerous work has helped to create a genuine, global movement that is taking the fight to the tech companies. “There is just so much commonality. And it transcends cultures and transcends languages,” Solis said. “We’re all trying to figure out a way to fight back together collectively.” To understand how platform work is experienced worldwide, Rest of World, in partnership with the research company Premise, surveyed more than 4,900 gig workers across 15 countries. Muhammad Fadli for Rest of World The data shows that, while the experience of platform work is very local and takes on features of the societies and economies in which it operates, it’s also universal. Brendan Hoffman for Rest of World Platform workers, whether they’re based in the U.S. or Nigeria, Indonesia or Ethiopia, are all struggling with a shared set of challenges: insecurity, anxiety, low wages, and high costs. After he left the Ukrainian army in 2019, Pavlo, who asked to be identified by only his first name, spent the winter months in Poland, working in warehouses and delivering for Uber Eats in his spare time. As the pandemic worsened, he returned home, but struggled to find work. He ended up in the capital, Kyiv, in need of money, so he signed up with Uber Eats again. After all, he reasoned, he’d already paid for the branded delivery bag. When Uber Eats suddenly withdrew from the Ukrainian market in June 2020, he went to work for its rival service, Bolt, instead. A lot of former Ukrainian soldiers end up delivering for the platforms, Pavlo told Rest of World, because they get free public transport. That means they can sign up to deliver on foot, without having to buy or rent a bike, and then ride on the buses instead. And because most of the platform companies don’t report back to the authorities on who’s working for them, veterans can also keep claiming their unemployment benefits. Delivery platforms have thrived in the pay-to-play informality of the Ukrainian economy. When Pavlo needed to get a health certificate to work for Bolt, the health centers were shut due to the pandemic, so he bought one online. The platforms, he said, rarely ask for documentation, and if they do, it’s easy enough to get hold of fakes. Some riders don’t have driver’s licenses, and Rest of World heard from several drivers that it’s common for accounts to be traded around, so that people — those without documentation, underage users, and riders previously banned from the platforms — can keep working. It should be against the law, Pavlo said. “But with our terrible economic situation, people are basically surviving by working for this platform, so what can you do?” A Bolt spokesperson said, “Bolt checks the identification and legal ability to drive for all Bolt drivers. Any confirmed case of a driver letting other persons use their account will lead to a permanent block of the drivers’ account and may involve legal action.” Gig work, which has often been characterized as part-time, flexible labor, is increasingly filling the gaps left by more stable work. Of the gig workers surveyed globally by Rest of World, more than half said that working for platforms makes up the majority, or all, of their income. “With our terrible economic situation, people are basically surviving by working for this platform, so what can you do?” The work can be demanding. In Ukraine, Pavlo, who uses a bicycle rather than a motorbike, has to contend with Kyiv’s steep hills. Bolt compensates riders for the distances they travel, unlike its competitors, but it doesn’t take inclines into account. “The app thinks that you are always fresh to go, not tired,” he said. Eleven- or twelve-hour shifts are common, and some drivers have been found using amphetamines, possibly to stay awake. Road accidents involving couriers are common, and there have been several deaths. During Ukraine’s first wave of Covid-19, riders were offered masks by the platforms. But they had to go to the companies’ headquarters to pick them up, and there were few other health checks. Pavlo caught the virus in the summer of 2020 and spent two weeks holed up in self-imposed isolation. Others kept riding. “The only thing that was saving them was a mask and maybe cough syrup,” he said. The Ukrainian government has struggled to regulate platform companies. Since 2014, political unrest, Russia’s annexation of Crimea, an ongoing war with Russian-backed separatists in the east, and the pandemic have battered Ukraine’s economy. Despite the precarity that’s built into platform work, it’s seen as a way for thousands of people to get at least some income at a point where traditional employers aren’t hiring. “I would say that those companies really banked on this vulnerability, and this instability that has been part of the labor market in Ukraine, especially as the pandemic hit,” said Svitlana Iukhymovych, a workers’ rights campaigner at the Ukrainian advocacy group Labor Initiatives. Delivery drivers from Glovo and Rocket pass each other in Kyiv, Ukraine in August, 2021. Globally, ride-hailing and food and grocery delivery platforms are well adapted to social stress. Once they’ve established themselves in a market, their model allows them to almost infinitely grow their workforce without dramatically increasing their costs. Workers pay for their vehicles, data, fuel, and often their insurance too. When they aren’t actively carrying a passenger or package, they’re typically not compensated. While the companies have invested billions in their technology and in subsidies to bring users onto their platforms, it’s actually their riders and drivers who are paying to scale them on the street — and carrying a lot of the risk if demand doesn’t match supply. It’s also in the platform companies’ interest to create an oversupply of riders or drivers. Having more riders gives the platform more pricing power, pushing down costs for consumers. With a glut of workers, platforms can manipulate supply and demand at a granular level, flooding an area — the red zones that Singh talked about in India — with riders or drivers, engineering scarcity for their partners, who are compelled to take unprofitable gigs by algorithms that penalize them for not doing so. It’s this oversupply that allows the platforms to make increasingly ambitious promises to customers. In India, for example, the major grocery delivery services are engaged in a race to the bottom on delivery times, with the major platforms now promising essentials to consumers’ doors in under 30 minutes. That’s partly enabled by their tech — their data allows them to anticipate demand and put popular products into fulfillment centers close to the customer — but it’s possible only with a large idle workforce who can be positioned in advance and compelled to take whatever gigs come. RedSeer, an Indian internet economy research company, forecasts that the country’s “quick commerce” market could grow by 15 times to reach $5 billion by 2025. “The app thinks that you are always fresh to go, not tired.” This dynamic also explains why, in the early days after a platform enters a market, it seems good for everyone. A small number of workers have the pick of the jobs. Fares and fees are subsidized by the companies, which are willing to burn investors’ capital to seed the market and build their user base. But as it absorbs more and more labor, the algorithm has more pieces to move around the board. It can become more demanding of its workers. Wait times between orders grow. Because many drivers and riders rent their vehicles, or have taken out loans to buy them, they have to work longer and longer shifts. Rest of World spoke to riders and drivers in Ukraine, South Africa, Nigeria, Singapore, and India who all said the same: they had to be online for upward of 12 hours a day, simply to service the debt they’d taken on to work for the platforms. They weren’t in the majority — our survey shows that many workers do work less than eight hours per day — but on an hourly basis, 42% of the workers surveyed earned less than the statutory local minimum wage. Workers have often found it hard to challenge platform companies on their pay. The earnings that platforms promise are theoretically achievable if workers can hit specific conditions — a certain number of gigs, for example — but those targets are often contingent on factors outside of the workers’ control. It’s hard to know if the algorithm’s decisions are unfair or not, but it’s easy for the platform to say that a worker’s low earnings are their own fault because they’ve failed to achieve arbitrary targets, or because customers haven’t rewarded them through higher ratings or tips. (Fifty-one percent of respondents to Rest of World’s survey said that they make more than half their earnings from gratuities — tip your rider.) Rest of World did find one Ukrainian delivery rider, Serhii, who was a vocal supporter of algorithmic management and was adamant that those who couldn’t cut it on the platforms were simply lazy. He rides in Kyiv for 12 hours a day on a rented motorbike, which he drives without a license. Everyone Pavlo knew who complained to the platforms about their pay and conditions was told the same thing, he said, “You have to be grateful that you have the job when other people lost theirs because of the pandemic and be happy for what you have.” A delivery driver from Glovo in Kyiv, Ukraine in August, 2021. Rest of World’s survey shows that workers’ feelings about the platfo"
