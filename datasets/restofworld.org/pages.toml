full_description = "Marcelo Pérez del Carpio for Rest of World Support Award-Winning Global Journalism Nearly four billion internet users live outside the West, building and using tech products & platforms with major implications on their daily lives. Yet few Westerners know about them. Rest of World is a solution to that information gap. We publish human-centered stories from over 100 countries, covering everything from Big Tech’s influence abroad, e-commerce, and cryptocurrency to corporate accountability and the impact of war on tech talent. Our reporting elevates more voices whose stories about life in the digital age deserve to be told and simply cannot be found elsewhere. Your gift makes you a Rest of World member, joining a global community of readers who care about our stories. More Information Where is the money going? Your donation goes to support our entire global nonprofit news operation across six continents, including core reporting infrastructure, digital outreach, fact checking, and freelance journalist, photographer, and artist compensation. What do Rest of World members receive? As a Rest of World member, you become part of a global community of readers, whose donations help sustain and grow our coverage – and to keep our stories free to read everywhere from Silicon Valley to Sumatra. Members receive a special edition of our annual Impact Report each spring and are invited to join special events throughout the year. Is my donation tax deductible? Rest of World is a 501(c)(3) private operating foundation. All U.S. donations to the publication are tax deductible as prescribed by law. To understand how this fits into your charitable giving, we recommend that you consult with your accountant or tax advisor. Please keep your email donation receipt as your official record for tax purposes. Rest of World’s EIN is 83-4475862. What’s Rest of World’s gift acceptance policy? Please see our policy for accepting charitable gifts here. What are the various ways I can give? We accept digital payments in the following ways: Credit/Debit via Stripe PayPal and Venmo Bank transfer (ACH, Bacs, and SEPA) Stock or publicly traded securities Donor-advised fund (DAF) gifts through Fidelity Please make checks payable to Rest of World Media, Inc. and mail them to:Rest of World Media, Inc.1010 Alma St.Suite 200Menlo Park, CA 94025 How can I manage my recurring donation? To manage a recurring donation, sign into your Donor Portal or email us at donate@restofworld.org. What’s the best way to reach you? Contact us at donate@restofworld.org. We'd love to hear from you!"
