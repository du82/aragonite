["https://restofworld.org/2023/foxconn-india-iphone-factory"]
title = "Inside Foxconn’s India iPhone factory expansion - Rest of World"
description = """
Foxconn is flying engineers from China to India to train the next generation of iPhone builders. But both the Chinese engineers and Indian assembly line workers describe a serious culture clash.

In this episode, Rest of World follows the development and expansion of a new iPhone factory in India, as Foxconn manufactures the iPhone 15 outside of China for the first time. We spoke with two dozen assembly line workers, technicians, engineers, and managers to get the inside story of how Foxconn achieved this feat.
Written by Viola Zhou and Nilesh Christopher. Narrated by Mithila Phadke.

Original Story: https://restofworld.org/2023/foxconn-india-iphone-factory/"""
full_description = 'Features Inside Foxconn’s struggle to make iPhones in India Chinese engineers are flying to India to train the next generation of iPhone builders. Photography by Saumya Khandelwal for Rest of World Photography by Saumya Khandelwal for Rest of World By Viola Zhou and Nilesh Christopher 28 November 2023 • Sunguvarchatram, India When Chinese engineer Li Hai left the wintry cold of northern China and flew into the humid heat of Tamil Nadu in southern India, he had little idea what to expect. It was early 2023. Months before the trip, a manager at the Foxconn iPhone factory where he worked had asked for volunteers to go on a temporary assignment to India. Li didn’t think long. He’d never traveled much, but was eager to. “I just wanted to go out and take a look,” Li told Rest of World, using a pseudonym because he was not authorized to speak to the media. Inside Foxconn’s struggle to manufacture iPhones in India Foxconn is flying engineers from China to India to train the next generation of iPhone builders. But both the Chinese engineers and Indian assembly line workers describe a serious culture clash. In this episode, Rest of World follows the development and expansion of a new iPhone factory in India, as Foxconn manufactures the iPhone 15 outside of China for the first time. We spoke with two dozen assembly line workers, technicians, engineers, and managers to get the inside story of how Foxconn achieved this feat. Written by Viola Zhou and Nilesh Christopher. Narrated by Mithila Phadke. Original Story: https://restofworld.org/2023/foxconn-india-iphone-factory/ Listen to this story 37 minutes 0:00/37:15 1x Long Reads by Explore more episodes >> Li is soft-spoken, sincere, and unassuming. He grew up in a rural part of China known for its steel mill industry, and had never strayed far. But what he lacked in his knowledge of the wider world, he made up for with curiosity. Foxconn organized a brief training session on cultural sensitivity before his trip. There, Li was taught not to mention religion or politics, and to say “please” when speaking with his new Indian colleagues. “People from China might talk in a blunt way,” he said. “But when we talk with Indians, we should be more polite.” Li worried most about food. On the eve of his departure, he packed his suitcase with diarrhea medication, packets of soup base to make his own Chinese hot pot, and — because he’d heard people in India ate with their hands — chopsticks. Nervous but excited, Li carried his first passport on his first flight for his first trip abroad. The flight was a series of surprises: Turbulence, the diverse crowds in the Singapore airport where he had a layover, the cabin crew who addressed him in English. His final destination was Sunguvarchatram, an industrial center on the outskirts of the state capital Chennai. The town sits at the heart of a global shift in electronics manufacturing currently underway. Like many of its competitors, Apple has relied on China for assembling its products for years. But political and economic factors have forced the company, as well as the broader tech sector, to rethink that approach by seeking partners from across the region. Foxconn — also known as Hon Hai Precision Industry — has been investing heavily in its iPhone factory in Sunguvarchatram. But with the factory’s higher material costs and a greater percentage of defective phones, the company has struggled to replicate the cutthroat efficiency it is known for, according to people familiar with the matter. As a result, the iPhones produced by Foxconn in Sunguvarchatram have always been less profitable than those made in China, two people close to the company told Rest of World. Foxconn did not respond to requests for comment. Early this year, in an effort to improve production and ready the plant to manufacture Apple’s upcoming flagship iPhone 15, Foxconn dispatched more Chinese workers to Sunguvarchatram. Engineers like Li would get the India plant up to China speed. Manufacturing an entire iPhone 15 within India — that is going to be projected as a big moment not just for Apple, but for India. Using language apps, half-remembered classroom English, and gestures, Li and hundreds of his Chinese colleagues were tasked with translating the Foxconn formula for an Indian workforce largely unfamiliar with the intensity and intricacies of 21st-century electronics manufacturing. It would be a serious challenge. In late August, Rest of World visited Sunguvarchatram, where Foxconn and other Apple suppliers were working at full throttle ahead of the iPhone 15 launch. We spoke with more than two dozen assembly line workers, technicians, engineers, and managers, all of whom requested anonymity or pseudonyms to avoid being identified by their employers. They detailed the successes, struggles, and cultural clashes that, over the past year or so, have played out on one of the world’s most consequential factory floors. In China, Foxconn demands long days, high targets, and minimal delays and mistakes — all of which proved difficult, if not impossible, to replicate in India. The stress clearly took a toll on the company’s local workforce. The ultimate goal — a successful production run of the iPhone 15 — would be a high-profile marker of India’s budding manufacturing prowess. “The government’s message is that India has arrived on the scene, and is moving towards becoming a manufacturing powerhouse,” Anand P. Krishnan, a fellow with the Centre of Excellence for Himalayan Studies at Shiv Nadar University, who studies manufacturing labor in China and India, told Rest of World. “Manufacturing an entire iPhone 15 within India — that is going to be projected as a big moment not just for Apple, but [also] for India.” Signage at the entrance to SIPCOT Industrial Park, where Foxconn’s iPhone plant is located in Sunguvarchatram. Every eight hours, the streets of Sunguvarchatram come alive with buses emblazoned with the names of multinational tech giants — Samsung, Yamaha, or FHH, for Foxconn Hon Hai. Tired workers are ferried between factories and their apartments or dormitories — known as hostels in India. Others hop onto motorcycles or climb into three-wheeled auto rickshaws. Sunguvarchatram is part of a budding industrial corridor between Chennai and Bengaluru, southern India’s biggest cities. Foreign carmakers opened factories here first. Starting in the 2000s, Taiwanese tech manufacturers set up operations. Among them were Foxconn and its competitor Wistron, which was the first company to make iPhones in India in 2017 — the lower-end iPhone SE. The area is still in transition from an agricultural town to a global manufacturing hub. Fallow fields are interspersed with high-tech factory campuses and brand-new hostels built to accommodate thousands of assembly line workers. Sunguvarchatram’s evolution is a dream come true for Prime Minister Narendra Modi. In 2014, at a Delhi landmark during his first Independence Day address, he unveiled what would become his signature “Make in India” initiative. “​I want to appeal to people all over the world, from the ramparts of the Red Fort, ‘Come, make in India,’ ‘Come, manufacture in India,’” Modi said. During most of the second half of the 20th century, India was home to a thriving industry of national electronics manufacturers. But in 1991, import taxes were lowered, and foreign competitors flooded and dominated the market. Indian brands folded, and the country’s tech manufacturing sector collapsed. It is one of the reasons why India has had a persistent problem with anemic job creation for its young and quickly growing population over the past three decades. !function(){"use strict";window.addEventListener("message",(function(a){if(void 0!==a.data["datawrapper-height"]){var e=document.querySelectorAll("iframe");for(var t in a.data["datawrapper-height"])for(var r=0;r<e.length;r++)if(e[r].contentWindow===a.source){var i=a.data["datawrapper-height"][t]+"px";e[r].style.height=i}}}))}(); Annual foreign investment has doubled since the announcement of Make in India, according to the government, but critics say the initiative is a work in progress at best. The manufacturing sector slightly outpaced India’s economy overall between 2003 and 2018, but — despite Make in India — has since fallen behind. Its output grew by just 1.3% over the past year. Tech manufacturing, however, has once again become a bright spot. Companies like Foxconn, Samsung, and the Chinese-owned Salcomp have all announced new or expanded facilities since last year. A primary driver of investment in India is the continuing U.S.-China trade war. Chinese workers are also no longer the cheapest option for some manufacturing: The country’s workforce is shrinking, better educated than ever, and not that interested in factory jobs anymore. Political posters with photos of Indian Prime Minister Narendra Modi and other BJP politicians (left) alongside an image of popular Tamil actor Vijay (right) on a wall in Sunguvarchatram. Late last year, a series of crises at the world’s biggest iPhone factory — a Foxconn facility in Zhengzhou, central China — underscored Apple’s need to diversify its manufacturing partners. According to one estimate, the factory’s delays cost Apple $1 billion a week. Apple has since sped up plans to expand in India. Foxconn is in the middle of doubling its workforce in the country. Company chairman Young Liu has met with Modi three times over the past 18 months to discuss expansion plans. Many other companies in the iPhone supply chain are also scouting locations for factories, Jules Shih, director of the Chennai branch of Taipei World Trade Center, a Taiwanese government-funded trade promotion group, told Rest of World. Some of China’s manufacturing strengths will be hard for India to match. China’s one-party system goes to great lengths on Foxconn’s behalf, investing billions of dollars to help set up factories, subsidize energy and shipping, and recruit and bus in workers during labor shortages. Independent unions are banned in China. In India, Apple’s suppliers have to contend with local policymakers, landowners, and labor groups. The country lacks China’s vast network of material and equipment makers, who compete for Apple orders by cutting their own margins. “Apple has been spoiled in China,” a senior manager at an Apple supplier, who was recently deployed from China to India, told Rest of World. “Here, except labor, everything else is expensive.” People pass a bus stop at a busy intersection in Sunguvarchatram. Foxconn began manufacturing iPhones at Sunguvarchatram in 2019, starting with the iPhone XR. At that point, the model was more than a year old. When Li arrived at Foxconn Sunguvarchatram in early 2023, the factory was making iPhone 14s, for which production in India had begun two months after its launch. This year, the goal was to have a shipment of made-in-India iPhone 15s ready to go as soon as the model was announced. The iPhone plant is part of a sprawling 60-hectare campus where Foxconn also makes phones for other brands. About 35,000 employees go to work inside half a dozen white, three-story factory buildings. Li may as well have been walking back into the Chinese plant he was familiar with at home: the same advanced equipment, the same rows of tables with workers repeating tasks thousands of times a day, the same final product. But there was one obvious difference. Unlike in China, the assembly line was staffed almost exclusively by young women. When electronics manufacturing took off in China in the 1980s, rural women who had just begun moving to the cities made up the majority of the factory workforce. They didn’t have many other options. Managers at companies like Foxconn preferred to hire women because they believed them to be more obedient, Jenny Chan, a sociologist at Hong Kong Polytechnic University who studies labor issues at Foxconn, told Rest of World. [If] they go out and not return by a specific time, their parents would be informed. Over the past 30 years, that’s changed. Today, most of China’s iPhone workers are men; women have moved into less arduous service sector jobs. But in India, Foxconn and other electronics manufacturers are once again recruiting from a female workforce beginning to migrate for better jobs. Hiring a young, female workforce in India comes with its own requirements — which include reassuring doting parents about the safety of their daughters. The company offers workers free food, lodging, and buses to ensure a safe commute at all hours of the day. On days off, women who live in Foxconn hostels have a 6 p.m. curfew; permission is required to spend the night elsewhere. “[If] they go out and not return by a specific time, their parents would be informed,” a former Foxconn HR manager told Rest of World. “[That’s how] they offer trust to their parents.” Buses transporting workers leave the Foxconn plant in Sunguvarchatram at the end of the day. Foxconn also had to find a workaround for employing married women. The company typically requires workers to pass through metal detectors when entering and exiting its factories in order to prevent leaks about upcoming products, according to reports. But in India, married women wear a mangalsutra, a metal pendant; and a metti, a metal toe ring. These workers are searched manually and have their jewelry logged in a notebook. Padmini grew up as one of five siblings in the countryside near the ancient city of Tirunelveli — a nine-hour drive south of Chennai. The 26-year-old has a nursing degree, but felt “trapped” being on call 24/7 as a stay-at-home nurse. Padmini got an assembly line job at Foxconn in 2021. Initially, she felt overwhelmed — the protective clothing, the machinery, the ominous “please cooperate with us” slogan on the wall. Having lived her whole life in inescapable tropical heat, she struggled to adjust to what felt to her like freezing cold air-conditioning. “I didn’t even know what a tweezer was,” she told Rest of World. “I didn’t know the name. I didn’t know how to hold it.” Padmini now shares a modest one-bedroom apartment in Sunguvarchatram with eight other women — five sleep in the hall, and four in the bedroom. They each pay 1,250 rupees ($15) in rent. “It is a little difficult,” Padmini said. She rarely sees her roommates, who all rotate through different shifts once a week — 6 a.m. to 2 p.m., 2 p.m. to 10 p.m., or 10 p.m. to 6 a.m. — and only have Sundays off. Every workday, Padmini rides a Foxconn shuttle bus to the factory, passes a metal detector, puts on an anti-static gown over her kurta, and sits down at the assembly line, where, every hour, she’ll stitch together at least 495 volume control parts. A man walks past a billboard advertising a ladies’ hostel in Sriperumbudur. When they first got to India, Li and his peers struggled to communicate with their new coworkers. They’d learned English in high school and university but had barely used it'
