full_description = "iStock/Google Maps Tech Giants Gulf of Mexico vs. Gulf of America: How digital maps display disputed names Governments frequently disagree over the names of places. Here’s how mapping apps have dealt with various feuds. By Viola Zhou and Khadija Alam Rest of World Tech Giants Nigerians are building affordable alternatives to AWS and Google Cloud Local cloud startups offer data sovereignty at a time when the debate about who has access to a country’s data is heating up. By Damilare Dosunmu Global Support Our Global Journalism Nearly four billion Internet users live outside the West, building and using tech products & platforms that most Americans have never heard of. By Rest of World Staff Daniel Zender for Rest of World Innovation China wants tech companies to monetize data, but few are buying in A first-of-its-kind policy allows Chinese firms to treat data as an asset, but compliance hurdles are keeping many companies on the sidelines. By Lizzi C. Lee Christian Charisius/Getty Images Q & A Why one of the world’s major AI pioneers is betting big on Saudi Arabia Jürgen Schmidhuber says the whole world can benefit from the kingdom’s funding of futuristic AI initiatives, and lead to a new golden age for science. By Anup Kaphle Rest of World Innovation Africa’s startup funding crisis deepens as Mastercard Foundation exits top VC firm The withdrawal leaves a gap in support for early-stage startups, as Africa’s tech funding has been declining since 2022. By Damilare Dosunmu Is Google Maps fatally misleading drivers in India? It’s complicated Maintaining accurate maps is a daunting task in a country where road names and addresses are not standardized. By Ananya Bhattacharya India’s open arms approach to AI The Modi government has dedicated $1.2 billion to building the country’s AI capabilities, and U.S. firms are receiving a warm welcome. By Rest of World Staff Uber’s big plan for India: buses Uber Shuttle, a shared bus ride service, is available in two Indian cities. The company plans to launch in three more cities soon. By Anisha Sircar"
