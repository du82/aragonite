full_description = "Contact us Contact us About us Ethics & Editorial Standards Conflict of Interest Policy Our Impact Our Board Our Team Labor x Tech Network Our Supporters Our Financials Awards & Recognition Licensing Guidelines Visual Style Guide Write for us Contact us Advertise with us Working at Rest of World We’d love to hear from you. For all inquiries or feedback, drop us a note at hello@restofworld.org or share your thoughts below. For opportunities at Rest of World, take a look at our current job openings. And remember to sign up for our newsletter here 🤙🏻. Have a confidential tip? At Rest of World we are committed to providing journalism that is fair, accurate, transparent, and honest. If you have a confidential tip, we’d love to hear from you. Rest of World welcomes tips about issues and events impacting business and tech communities around the world. Good tips are typically narrow in scope and come with corroborating evidence and documentation. These can range in subject matter from workplace malfeasance to unreported trends. We’ll do our best to get back to you in a timely manner but can’t guarantee a response on every tip. How to submit tips If you have a tip that you would like to share, we’ve outlined some methods below that will help you securely share information with us. Please carefully read the terms and conditions to find a method that works best for your situation. For general queries, please use our contact page. Signal Signal is a free messaging service that uses an open-source protocol for end-to-end encryption, allowing the transfer of text, images, videos, and audio. A phone number is required on setup. We recommend using Signal to contact us above all other options. Add us on Signal: +1 347-947-0568 Download Signal View Instructions View Security Page WhatsApp WhatsApp is a free messaging service that offers end-to-end encryption, allowing you to share text, documents, images, video, and audio. Some metadata is retained by Meta (former