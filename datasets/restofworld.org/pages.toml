title = "40 global technology companies beating their Western rivals - Rest of World"
description = "We profiled companies in emerging markets who are outperforming Silicon Valley giants in areas like telecommunications, AI, social networks, electric vehicles, and e-commerce."
full_description = "Global 40 companies that are beating the West Faster, smarter, more adaptable: These emerging market pioneers are outmaneuvering Silicon Valley for global domination. By Rest of World Staff 5 October 2023 What is the world’s biggest digital bank? No, not HSBC — it’s Brazil’s Nubank, which reported close to $5 billion in revenue last year. What is the most widely used social media platform in Vietnam? Not Facebook or TikTok — it’s Zalo, with an impressive 87% adoption rate. And what was one of the earliest online food delivery platforms? That would be Talabat, launched by a group of Kuwaiti students in Cairo, in 2004. That’s three years before the iPhone came to market. If these names surprise you, they shouldn’t. Startup ecosystems outside the West have been churning out billion-dollar tech companies and radically innovative products for years. But their achievements are rarely celebrated or known here in the U.S. Today, not only are entrepreneurs in Buenos Aires, Lagos, and Jakarta building businesses that create huge economic opportunity and value, they’re also competing directly with Silicon Valley for users and growth in these markets. And they’re winning. Our 2023 annual list is devoted to 40 trailblazing companies that, in their own ways, beat the West. Some of them won by market combat: Years of bruising competition led to lucrative acquisitions by their Western rivals, or acquisitions of the Westerner’s local assets. A few just dominate their sector outright. Others beat the West by paying attention. They saw what foreign entrants missed, and tailored their products and platforms to local user needs with surgical precision. Or they proved a certain model could work in developing economies written off by outsiders. By seeing and seizing opportunity — and not waiting for Silicon Valley to meet local needs — these 40 companies lead the pack. They’ve already inspired a generation of new startups, founders, engineers, and problem-solvers across emerging markets, whose inventions will come to define the future of everyone’s technology experience. TikTok may have been the first international tech platform to spark a major crisis around American competitiveness, but it won’t be the last. — Anup Kaphle (Editor-in-Chief) Money PhonePe India 🇮🇳 India’s 1.4 billion citizens have many payment apps to choose from. PhonePe, a transaction platform that uses the homegrown unified payments interface (UPI), leads the pack. PhonePe’s success against Google Pay and WhatsApp Pay led to a lucrative acquisition by e-commerce giant Flipkart in 2016. Two years later, American retailer Walmart acquired Flipkart for a whopping $16 billion, with PhonePe as the deal’s crown jewel. PhonePe’s unique offering makes it particularly attractive: It’s a one-stop destination for all your daily transactions — from transferring money between different bank accounts to making purchases without ever leaving the app. Fact boxTotal fundraised$2.5 billionNo. of registered users480 million M-Pesa Kenya 🇰🇪 Ask an American what they know about African tech, and you’re likely to hear one name: M-Pesa. The Kenyan peer-to-peer payments pioneer was so groundbreaking in the 2000s that it featured on TED Talks, and its story is taught in U.S. business schools today. M-Pesa enabled Kenyans to send money securely via text messages, unlocking financial inclusion for millions. It has inspired look-alike platforms in nearly every non-Western country, and is still going strong at home, too: M-Pesa is used by a whopping 84% of Kenya’s population and processes transactions that amount to roughly half of the country’s GDP. Fact boxRevenue$786 million in 2022No. of users52.4 million monthly active usersMarket share99% in Kenya NPCI India 🇮🇳 India is covered in QR codes — from iPhone stores to roadside tea stalls — and they’re compatible with practically all of the country’s payment apps. The backbone of this infrastructure is the National Payments Corporation of India (NPCI), a nonprofit owned by a consortium of banks, which functions under India’s central bank. NPCI’s UPI is so well-integrated into Indian life that it processed over $1 trillion in transactions last year. Meanwhile, its homegrown card network, RuPay, has been on such a rise that both Visa and Mastercard have grumbled to the U.S. government about its unfair advantage. Fact boxNo. of transactions45 billion, as of March 2022No. of users 250 million UPI users Nubank Brazil 🇧🇷 The São Paulo-based Nubank is currently the largest digital bank in the world. It seized on Latin American banks’ inability to quickly digitize, and snagged a big investment from Warren Buffett’s Berkshire Hathaway. Nubank has also smartly aligned itself with local pop culture, recruiting Brazilian pop star Anitta to be its global brand ambassador. Fact boxTotal fundraised$4.1 billion, as of January 2023 Revenue$4.8 billion in 2022No. of account holders85 million, as of April 2023 Bitso Mexico 🇲🇽 Mexican crypto-exchange Bitso may have actually found the smartest use for cryptocurrency: remittances. The company processes 4% of the remittances sent between the U.S. and Mexico, which adds up to billions of dollars each year. One trick Bitso has used to compete with established players like Western Union and MoneyGram: reducing the commissions on transactions. Fact boxTotal fundraised$314.5 million, as of 2021No. of users6 million individuals and 1,500 institutional customers Binance UAE 🇦🇪 Dubai-based Binance was founded by Changpeng Zhao, universally known as CZ, who was born in China and grew up in Canada. While U.S. crypto players like Coinbase were treating alt-coins like an embarrassment, Binance reveled in the chaos. It became the biggest and noisiest crypto exchange for anyone interested in the weirder, more speculative side of crypto — which was a bigger part of the boom than anyone wanted to admit. No one knows how long Binance’s glory days might last: The SEC recently charged it with lying to regulators and mishandling U.S. funds, and sought to broadly freeze the assets of its U.S. trading platform. In June, Binance reached a compromise to continue its operations while it defends itself. Changpeng Zhao, the co-founder and CEO of Binance. Fact boxRevenue$20 billion, as of January 2022Daily transaction valueOver $10 billion Mobility Grab Singapore 🇸🇬 It’s good to have friends with deep pockets. In 2018, after a lengthy price war with Uber, the SoftBank-backed Grab went on to, well, grab the Southeast Asian assets of its biggest rival, in a deal valued at several billion dollars. Grab saw what Uber had failed to grasp about Southeast Asia: a preference for mopeds and cash transactions. Fact boxTotal fundraised$16.5 billion, as of 2021Revenue$1.43 billion in 2022No. of users32.7 million users in 2022 Getir Turkey 🇹🇷 When the Turkish delivery company launched its London operations two years ago, co-founder Tuncay Tütek said he wanted to teach the world to pronounce Getir — GET-EER — which means “to bring.” That shouldn’t be hard, as global investors have flocked to the startup in recent years, shooting its valuation to almost $12 billion. Getir has pioneered ultrafast delivery by shortening delivery times to 10 minutes, which continues to give it a competitive advantage amid a sea of players. But to invent 10-minute delivery, Getir first had to create its own network of maps in Istanbul: A five-person core team built the app’s geographic information system, and then paired it with government data on migration patterns to decide how to deploy drivers and where to build warehouses. Even as Getir continues its takeover of the competition in Europe, it has reportedly pulled out of several European countries, including Spain and France, citing weak sales and an inability to raise adequate funds. Fact boxTotal fundraised$1.8 billion, as of April 2023No. of users3.5 million active users in 2021 Careem UAE 🇦🇪 For years, Uber and its UAE-based rival Careem were locked in a costly price war for ride-sharing customers in the Middle East. When Uber acquired Careem in 2019 for $3.1 billion, it was the biggest payday ever for the blossoming tech sector in the Middle East and North Africa. The ride-hailing company’s early growth came down to understanding its local users better: It enabled cash-on-delivery years before Uber did, built call centers (so that less-app-literate users could book cars over the phone), and solved for technical gaps in Google Maps that had led to fewer reliable pickups and routing. Today, it operates in 90 cities — all the way from Pakistan to Morocco. Careem scored a major victory in 2018 when Saudi Arabia made it legal for women to drive. The company became closely associated with the policy change, giving it both a PR win and a new supply of drivers. Fact boxNo. of users48 million registered users No. of employeesAround 5,000Total fundraised$771 million, as of 2018 Pathao Bangladesh 🇧🇩 Few startups in South Asia have managed to expand regionally, let alone also lead those markets. Pathao is the biggest ride-hailing company in Bangladesh and Nepal — both markets with half a dozen local and international players, including Uber (in Bangladesh) and inDrive (in Nepal). And it’s the only profitable food-delivery business in Bangladesh. Pathao recently got the green light to launch its own payment wallet, PathaoPay. We’ll see if it does as well as the rest of the company. Fact boxRevenue$14 million in 2022 No. of usersOver 8 million Kitopi UAE 🇦🇪 Kitopi takes the ghost kitchen idea and supercharges it. Founded in Dubai in 2018, the kitchen-as-a-service platform currently operates over 60 kitchens across the Gulf states. When a restaurant brand joins Kitopi, they hand the company their recipes and train its workers on how to prepare their food. The entire process — from setting up to launching deliveries — takes no more than 14 days. Its services have grown so rapidly in the region that Kitopi has already helped Shake Shack and Papa John’s to establish virtual restaurants in the Middle East. Fact boxNo. of employees5,000Total fundraised$804 million, as of May 2022 Cornershop Chile 🇨🇱 This e-grocery startup exploded out of the gate in 2015, launching simultaneously in Chile and Mexico. Cornershop’s ease of navigation, seamless search function, and a novel customer-shopper messaging interface supercharged its growth. Its success was quickly noticed up north, and in 2021, Uber bought the company for $1.4 billion. Notably, it also had a fully employed delivery force, with union representatives regularly meeting with the company’s C-suite. Fact boxTotal fundraised$31.7 million, as of 2020Revenue$200 million annually inDrive Russia 🇷🇺 The second most-downloaded ride-hailing app in the world started in Siberia. But after Russia invaded Ukraine, inDrive left the country and relocated its employees and their families elsewhere. One of inDrive’s key features was inspired by local taxi price-gouging during the region’s cold winters. The app allows users to negotiate a price with drivers. It now also supports couriers and freight delivery. You can haggle with them, too. Fact boxTotal fundraised$387 million, as of 2023No. of downloads175 million Talabat UAE 🇦🇪 Talabat, which is Arabic for “request,” was founded by Kuwaitis in 2004. Back then, the company took online orders over a modem connection, which it would then disconnect to call the restaurant, place the customer’s order, and reconnect to the internet. It has since expanded across the Middle East and North Africa, and in 2015, was acquired by Germany-based Rocket Internet for $170 million. Talabat’s recipe for success includes a focus on exclusive deals, lower commission rates for restaurants that sign up only on its platform, and locally tailored promotional campaigns, including during Ramadan. As of last year, it had nearly 80% of the market share in the UAE’s food delivery market by order volumes. Talabat also signed Cristiano Ronaldo as a brand ambassador. The company certainly takes goals very seriously. Fact boxNumber of registered users2 million BYD China 🇨🇳 BYD, which stands for “build your dreams,” sits at the top of China’s electric vehicle market. It’s expanding beyond China, starting with commercial vehicles like taxis and buses, and could possibly overtake Tesla soon as the biggest EV company in the world. And they didn’t even have to buy Twitter to do it. Makes you think. Fact boxTotal fundraised$6.6 billion, as of 2021Revenue$63 billion in 2022 No. of units sold1.86 million EVs in 2022 Communication Naver South Korea 🇰🇷 Everyone in the world is trying to create the “everything app,” but the closest you’ll come to finding one outside of China is probably Naver. It’s not just South Korea’s Google, it’s South Korea’s entire internet. Its flagship products are Line, a supercharged messaging app that practically runs Japan and is the No. 1 messenger in several other countries in Asia; and Weverse (integrated with V Live in 2021), the platform that drives the K-pop industry. And whoever runs K-pop pretty much runs the world. Fact boxRevenue$6.1 billion in 2022No. of users38 million monthly active users in January 2023 Tencent China 🇨🇳 It might not grab headlines as often as ByteDance or Shein, but Tencent is one of China’s most valuable companies. It produces some of the world’s most popular video games, like PUBG and Honor of Kings, but its real powerhouse is WeChat: the “everything app” that is the envy of the global tech industry. Although every would-be super-app aspires to be the next WeChat, no platform in China or elsewhere comes close to the company’s utter domination. It’s so deeply integrated into daily life in the country that if the app vanished one day, the majority of China would be unable to function. Fact boxRevenue$79.6 billion in 2022No. of users1.3 billion for WeChat, as of 2022 Telegram Messenger UAE 🇦🇪 Pavel Durov, the founder of VK and Telegram Messenger. Telegram was founded by Pavel Durov, who is sometimes called “Russia’s Mark Zuckerberg” because he created VK, which is sometimes called “Russia’s Facebook.” Telegram Messenger has given WhatsApp a run for its money, thanks to a combination of private messaging and large group channels. A group on Telegram can have up to 200,000 active members, and its channels can be followed by an unlimited number of people. Unlike Facebook and Twitter, its feed can be ad-free and not run by an algorithm. Telegram is so popular that it has become the go-to platform for following Russia’s invasion of Ukraine. Even President Zelenskyy uses it for his broadcasts. In 2019, Telegram raised a $1.7 billion initial coin offering (ICO) in an effort to launch a blockchain platform. After the U.S. Securities and Exchange Commission filed an emergency action order, Telegram eventually agreed to return $1.2 billion to investors. Fact boxTotal fundraised$2.9 billion, as of 2023No. of usersOver 700 million monthly active users"
