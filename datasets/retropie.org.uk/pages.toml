full_description = "Happy Pi Day – RetroPie 4.8 is released 14th March 2022 14th March 2022News, Releases Happy Pi Day! After a long wait, we are pleased to announce the release of RetroPie 4.8. The RetroPie 4.8 images are built on the latest version of the Raspberry Pi OS Lite Buster (which is now their legacy release). This image supports the latest Raspberry Pi Zero 2 W… Continue reading Vilros sponsorship 3rd September 2021 3rd September 2021News Thanks very much to Vilros who are generously making a donation to the RetroPie project for every Raspberry Pi gaming kit they sell. Vilros was founded in 2010 with the goal of helping to create a more technological society. They are passionate about promoting STEM education and making it easily… Continue reading More Power and USB-C for the ControlBlock 15th January 2021 15th January 2021News TL;DR The ControlBlock provides a soft power switch and status indication functionality, as well as an easy-to-use interface for original and arcade game controllers. It has been updated now with a dedicated power switch IC to provide all the power that you need for your retro project. Also, it comes… Continue reading RetroPie 4.7.1 update 4th November 2020 7th March 2022News, Releases RetroPie 4.7.1 images are now available from the Download Page. Unfortunately a couple of bugs crept into the EmulationStation front-end for the 4.7 release. A performance issue causing EmulationStation to have a poor frame rate and a bug affecting its built in scrapers. The performance issue affected Raspberry Pi 0/1/2/3… Continue reading"
