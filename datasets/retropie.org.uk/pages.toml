full_description = '''Recent Tags Popular Home Docs Search Register Login const rect = document.getElementById('header-menu').getBoundingClientRect(); const offset = Math.max(0, rect.bottom); document.documentElement.style.setProperty('--panel-offset', offset + `px`); <div class="alert alert-danger"> <p> Your browser does not seem to support JavaScript. As a result, your viewing experience will be diminished, and you have been placed in <strong>read-only mode</strong>. </p> <p> Please download a browser that supports JavaScript, or enable it if it's disabled (i.e. NoScript). </p> </div> Categories Help and Support Get help and support from other RetroPie users 27k Topics 182k Posts C Hello there I am not able to reset my hotkeys. I would ask the person who set it up but it was a gift and the developer who gave it to me is no longer with us. So following the most common instructions I can only guess I'm using an old version on the retropi and an old version of Emulation Station. I attached 4 images of what my setup menus look like . I've written code in like Microsoft Access for searchable databases and such so I'm not a complete lodite but very green when it comes to most issues like this. Any help is appreciated. I'm not scared to backup the disk and Install a new script version but I would appreciate any instruction that helpse keep all my existing roms and emulators. Thank you in advance. https://photos.app.goo.gl/JcYqiMiJAPzid87S6 General Discussion and Gaming General discussion relating to using RetroPie and gaming. Please do not use for help/support requests. MAME Random Of the Week 3k Topics 41k Posts N Hello, Is this ok in 2025 ? I want to buy a Dualsense for my Retropie-4.8.9 Bookworm Lite on Pi5 and I want to know if it works today, or if tricks are needed to connect a dualsense in bluetooth. Thanks Projects and Themes Show off your custom builds, themes, and splashscreens 2k Topics 35k Posts S @ExarKunIv Thanks! I forgot to give permissions to everyone who has the link. Fixed. Ideas and Development Share your ideas and suggestions for RetroPie. You can also use this area for development discussion. 2k Topics 35k Posts L @Chef-Otis, have you followed the steps in the README? Were you able to start the service, or what issue are you facing exactly? I usually respond faster when the error is reported through this channel: GitHub Issues. ControlBlock, PowerBlock & Co. Get help and support for PetRockBlock's hardware 386 Topics 2k Posts N Ok... made some progress and want to share my insights. If you want to use different than the default pins to connect the powerblock to the rpi you should NOT use the range of GPIO1 to GPIO8 for the status pin. These are per default driven HIGH. The others (including the defaults used by power block) are driven LOW. I tried to change that behaviour using the gpio=... and gpio_poweroff=... commands in config.txt without full success. After switching now to GPIO9 and GPIO25 the power block works (I disables SPI just to be sure because GPIO25 belongs to SPI per default). Announcements Announcements regarding our community 34 Topics 48 Posts B There has been a fair amount of forum spam in recent months. I will look to strengthen our anti spam measures, but I just wanted to thank everyone that flags it for us as it does help with deletion. Cheers! 1 / 1 Contributions to the project are always appreciated, so if you would like to support us with a donation you can do so here. Hosting provided by Mythic-Beasts. See the Hosting Information page for more information. {"title":"[[pages:home]]","selectCategoryLabel":"[[pages:categories]]","categories":[{"cid":8,"name":"Help and Support","description":"Get help and support from other RetroPie users","icon":"fa-support","bgColor":"#e32e34","color":"#ffffff","slug":"8/help-and-support","parentCid":0,"topic_count":26522,"post_count":181659,"disabled":0,"order":1,"link":"","numRecentReplies":1,"class":"col-md-3 col-xs-6","imageClass":"cover","descripti