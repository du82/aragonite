["https://retropie.org.uk/about/building"]
title = "Building your own RetroPie machine - RetroPie"
description = "Contents1 Getting the hardware2 Special Hardware & Kits3 Some Reputable Sellers Getting the hardware RetroPie is provided free of charge. There are people offering pre-made kits for sale, with significant mark-ups, using RetroPie as a selling point. Please be careful who you give your money to. It is quite simple… Continue reading"
full_description = "Building your own RetroPie machine Contents1 Getting the hardware2 Special Hardware & Kits3 Some Reputable Sellers Getting the hardware RetroPie is provided free of charge. There are people offering pre-made kits for sale, with significant mark-ups, using RetroPie as a selling point. Please be careful who you give your money to. It is quite simple to put together the hardware you need to get RetroPie up and running. You can buy the parts separately or can buy affordable kits that contain the various components you need – e.g. the Canakit, or a kit from The Pi Hut, or Pimoroni (see below). We currently recommend getting a Raspberry Pi 4 – as it is the best performing board for running RetroPie on. A Raspberry Pi 3 also works well, but we support all version of the hardware. Hardware: Raspberry Pi 3 Raspberry Pi (A, A+, B, B+, Zero, 2, 3, 4)5V 2.5A Power supply8GB Micro SD Card MinimumHDMI or RCA 4 Pole CablesGamepads and/or KeyboardEthernet or Wifi dongle (built in on the pi 3)Raspberry Pi Case (optional but recommended)Micro SD Card Reader Special Hardware & Kits The PowerBlock provides a soft power switch functionality that lets you safely switch on and off your Raspberry in a controlled and safe way with an arbitrary switch and LED indicator. The ControlBlock is a piece of hardware created by the founder of the RetroPie Project, petrockblog. With the ControlBlock you can connect arcade buttons, original SNES controllers and even an On/Off switch. The Picade is a kit by Pimoroni that enables you to set up a bartop arcade with your Raspberry Pi. Some Reputable Sellers The Pi Hut (UK) Pimoroni (UK) CanaKit (Canada / USA) Vilros (USA) – who also contribute to RetroPie for every Raspberry Pi gaming kit they sell. Comments are closed."
year_published = 2025
clearnet = "https://retropie.org.uk/about/building"
