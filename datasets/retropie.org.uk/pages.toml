full_description = '''Recent Tags Popular Home Docs Search Register Login const rect = document.getElementById('header-menu').getBoundingClientRect(); const offset = Math.max(0, rect.bottom); document.documentElement.style.setProperty('--panel-offset', offset + `px`); <div class="alert alert-danger"> <p> Your browser does not seem to support JavaScript. As a result, your viewing experience will be diminished, and you have been placed in <strong>read-only mode</strong>. </p> <p> Please download a browser that supports JavaScript, or enable it if it's disabled (i.e. NoScript). </p> </div> Please do not post a support request without first reading and following the advice in https://retropie.org.uk/forum/topic/3/read-this-first Delete Wifi network Scheduled Pinned Locked Moved Help and Support wifi configwifi network 3 Posts 3 Posters 71 Views Loading More Posts Oldest to Newest Newest to Oldest Most Votes Reply Reply as topic Log in to reply This topic has been deleted. Only users with topic management privileges can see it. D DerDammerl last edited by Hi, i have two WIFI networks here at home. When I first installed Retropie i used network #2. Now I need to change it to network #1. But it is still connecting all the time to network #2. How can I delete this network? I tried Disconnect/configure WIFI config, but without success. It disconnects, but as soon as I try to connect to the other one, it connects immediately to the wrong one again. Anyone any idea? I don't wanna block the Rasberry completely from the router, I just want it only connects if the the real one is not available Thanks M 1 Reply Last reply Reply Quote 0 M mitu Global Moderator last edited by Please add more info about your setup - what Pi model/RetroPie version/etc - as asked in https://retropie.org.uk/forum/topic/3/read-this-first. 1 Reply Last reply Reply Quote 0 M marstr @DerDammerl last edited by @DerDammerl said in Delete Wifi network: Hi, i have two WIFI networks here at home. When I first installed Retropie i used network #2. Now I need to change it to network #1. But it is still connecting all the time to network #2. How can I delete this network? I tried Disconnect/configure WIFI config, but without success. It disconnects, but as soon as I try to connect to the other one, it connects immediately to the wrong one again. Anyone any idea? I don't wanna block the Rasberry completely from the router, I just want it only connects if the the real one is not available Thanks I would Try deleting the file /var/lib/dhcpcd5/dhcpcd_*.lease. Sometimes it retains old settings. After deleting, reboot the system and try to connect to network #1. 1 Reply Last reply Reply Quote 0 First post Last post Go to my next post Contributions to the project are always appreciated, so if you would like to support us with a donation you can do so here. Hosting provided by Mythic-Beasts. See the Hosting Information page for more information. <nav component="pagination" class="pagination-container hidden" aria-label="Pagination"> <ul class="pagination hidden-xs justify-content-center"> <li class="page-item previous float-start disabled"> <a class="page-link" href="?" data-page="1" aria-label="Previous Page"><i class="fa fa-chevron-left"></i> </a> </li> <li class="page-item next float-end disabled"> <a class="page-link" href="?" data-page="1" aria-label="Next Page"><i class="fa fa-chevron-right"></i></a> </li> </ul> <ul class="pagination hidden-sm hidden-md hidden-lg justify-content-center"> <li class="page-item first disabled"> <a class="page-link" href="?" data-page="1" aria-label="First Page"><i class="fa fa-fast-backward"></i> </a> </li> <li class="page-item previous disabled"> <a class="page-link" href="?" data-page="1" aria-label="Previous Page"><i class="fa fa-chevron-left"></i> </a> </li> <li component="pagination/select-page" class="page-item page select-page"> <a class="page-link" href="#" aria-label="Go to page">1 / 1</a> </li> <li class="page-item next disabled"> <a cla