["https://retropie.org.uk/category/releases/page/2"]
title = "Releases Archives - Page 2 of 14 - RetroPie"
full_description = "RetroPie 4.5.1 update 30th July 2019 28th April 2020News, Releases As detailed in the last post – https://retropie.org.uk/2019/07/composite-out-broken-on-retropie-4-5/ – there were some issues in the last image due to the updated Kernel. A newer Kernel has been released for Raspbian Stretch that resolves the composite output issue, but we also had problems reported with overscan settings and decided to implement a workaround. As the previous 4.14 Kernel was well tested, we decided to switch back to it for now, and also created a new image (this was actually uploaded on the 17th July, but due to some testing and time constraints is only being announced now). If you have a 4.5 version of RetroPie for the Raspberry Pi you can choose the update option in RetroPie-Setup and then choose to “Update System Packages” when prompted. This will downgrade the Kernel to the one in this 4.5.1 image. The Kernel will only be downgraded if choosing to update System Packages from the RetroPie-Setup interface. You can download a 4.5.1 image from https://retropie.org.uk/download/. For first installs please follow the Installation Instructions. We are still working on Raspberry Pi 4 support. You may have seen some unofficial images from other people with some emulators working – but please bear with us. We also have some emulators working, but don’t want to release anything until we are able to realistically support it. Changes since 4.5 Downgraded to 4.14 kernel to resolve some 4.19 kernel/firmware issues(other rpi4/fkms changes which will be announced in a future post) RetroPie 4.5 is released 3rd July 2019 28th April 2020News, Releases After some delays due to recent issues we are pleased to announce RetroPie 4.5. This version does NOT work on the recently released Raspberry Pi 4. We are currently working on support for this. IMPORTANT UPDATE: It has come to our attention that composite out is broken on this release. See https://retropie.org.uk/2019/07/composite-out-broken-on-retropie-4-5/ for further details. RetroPie 4.5 for the Raspberry Pi is based on Raspbian Stretch. This may be our last image based on Stretch as it looks as though the Raspberry Pi foundation are now concentrating their efforts on the recently released Raspbian Buster. Some parts of RetroPie already work on Buster on the Raspberry Pi 1/2 and 3 but it’s not officially supported yet. We held off on making this release due to a Raspbian kernel update which broke pairing of Sony Bluetooth devices. We have worked around this on the Raspberry Pi images by installing more recent firmware/kernel packages from the Buster distribution. Please see the changelog below for more information on the changes since RetroPie 4.4. You can download a 4.5 image from https://retropie.org.uk/download/. For first installs please follow the Installation Instructions. You can also install RetroPie on top of an existing Raspbian Stretch set up, or on top of Ubuntu on a PC/Odroid-C1/C2/XU3/XU4. Links to the relevant instructions can be found on the Download area. If you want to support the project, donations are always appreciated and can be made on our Donation Page. The main developer Jools Wills also has a Patreon page up at https://www.patreon.com/retropie. Changes since 4.4 Dropped Raspbian/Debian Jessie supportRaspberry Pi 3 A+ support (via Stretch firmware update)Many new es themes addedAdded Skyscraper (Scraper for Emulation Station game lists) RetroArch updated to v1.7.6Amiberry (Amiga emulator) updated to v2.25, including support for launching whdload and CD32 titles from ES.Jzintv (Intellivision emulator) updated to 20181225 releaseatari800 – updated to v4.0.0Mupen64plus – updated to latest version (GlideN64 stability and compatibility improved), as well as other changes.Fuse (ZX Spectrum emulator) updated to v1.5.7ZEsarUX (ZX Spectrum emulator) updated to v7advmame (Advance MAME arcade emulator) – updated to v3.9Fixed building of quake3 for RPI.Added love-0.10.2 (2d Game Engine) for compatibility with older games.Dosbox updated to SVN r4194 including joystick fix for 360 controllers.CGenius – updated to v2.3.1 lr-flycast (libretro Dreamcast emulator) – renamed from lr-reicast and enabled for arm platforms including the RPI. reicast – Switched to updated upstream repository – the latest code includes bugfixes and improvements including better game compatibility as well as our RPI fixes.lr-ppsspp – switched to upstream repository for latest versionlr-fbneo (Arcade and console emulator) – renamed from lr-fblpha – lots of improvements including neo geo cd support, and optional cyclone 68k core for better performance on slower devices for some games.The emulator can now be selected as an alternate emulator for Sega Genesis/Mastersystem/SG-1000, PC-Engine, MSX, ColecoVision and ZXSpectrum.Fixes and updates to many libretro coresKodi updated to the 18 “Leia” release (only available in Raspbian Stretch)Improvements/fixes to joystick control in runcommand launch menuFixes / Improvements to bluetooth pairingAdded sixaxis driver – better DualShock 3 controller support with full bluetooth coexistenceThird-party (Shanwan/Gasia) controller support via customhidsony & custombluez driverslr-mame2014 renamed to lr-mame2015Emulationstation – updated to v2.8.4 which includes:2 new scrapers added for the TheGamesDB and ScreenScraper. Also many bugfixes and improvements including:Gridview support now in main versionHide MAME bios files by defaultGraphical / rendering fixesLoading progressAllow using analog sticks for navigationMore flexible audio configurationLots of code refactoring, bugfixes and performance improvements, including removing boost libraries making compilation faster (and code smaller).Search and load artwork based on ROM name (image and video)Experimental scripting support, triggered by events. Added new experimental modulesmoonlight – NVIDIA GameStream clientsteamlink – Steam Link streaming client for Raspberry Pi 3jumpnbump – multiplayer platform gamemysticmine – open source indie gamebombermaaan – Classic bomberman gamelr-superflappybirds – Multiplayer Flappy Bird Clonelr-scummvm – libretro version of scummvm (Allows playing of many classic point and click adventures)lr-x1 – Sharp X1 libretro corelr-redream – Dreamcast emulatorlr-pokemini – Pokemon Mini emulatorlr-81 – Sinclair ZX81 emulatorlr-quasi88 – NEC PC-8801 emulatorsplitwolf – 2-4 player split-screen Wolfenstein 3D / Spear of Destiny portlr-mupen64plus-next – a new WIP Libretro core which aims to improve upon the existing lr-mupen64plus core."
