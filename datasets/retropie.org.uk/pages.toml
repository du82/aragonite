y other key and things worked, I learnt how to get in and out of menus etc now.<\/li>\n<li>one annoying thing is that on reboot to get to the RetroPie or EmulationStation Gui I have to keep resetting up the Keyboard each time. (I haven't found a way to get around that yet).<br />\nI could finally use emulation station menus.<\/li>\n<li>along the way I also turned on Retro Pie Menu and now just have that. instead of emulation Station.<\/li>\n<li>Next I went looking on how to install Games. This wasn't easy either.<\/li>\n<li>I looked on both the RPI Forums and mainly the RetroPie website and forums. I searched for How to install Games, Free Games, games etc. and couldn't find a list of free games easily.<\/li>\n<li>Then I looked up videos on YouTube and stumbled across this video.<br />\n<div class=\"container\">\n<div class=\"row\">\n <div class=\"col-md-8\">\n<div class=\"ratio ratio-16x9\">\n <iframe src=\"//www.youtube-nocookie.com/embed/1I2KqkIvHYc\" allowfullscreen><\/iframe>\n <\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/li>\n<li>Video (9 years old at this time, it would be great to have a more updated video though), shows how to use the RetroPie Setup Script(Currently looking into this and will install some games etc soon).<\/li>\n<\/ol>\n<p dir=\"auto\">So from this process I have some Ideas that I feel would help make things easier for New users.<br />\nso from this page of the setup guide <a href=\"https://retropie.org.uk/docs/First-Installation/\" target=\"_blank\" rel=\"noopener noreferrer nofollow ugc\">click here <\/a> under the section <strong>Additional Setup Options<\/strong> having san option similar to<br />\n\"for setup options like installing the built in game emulators and free game packages etc, see the guide on how to use the Setup Script here\" (takes you to information on using the setup script).<\/p>\n<p dir=\"auto\">Thanks for listening to my rant etc. and I patriciate any help or clarifications you have on these ideas.<\/p>\n","pid":303058,"ti