full_description = '''Recent Tags Popular Home Docs Search Register Login const rect = document.getElementById('header-menu').getBoundingClientRect(); const offset = Math.max(0, rect.bottom); document.documentElement.style.setProperty('--panel-offset', offset + `px`); <div class="alert alert-danger"> <p> Your browser does not seem to support JavaScript. As a result, your viewing experience will be diminished, and you have been placed in <strong>read-only mode</strong>. </p> <p> Please download a browser that supports JavaScript, or enable it if it's disabled (i.e. NoScript). </p> </div> dbar4gun: new Wii remote userspace driver as lightgun Scheduled Pinned Locked Moved Ideas and Development driverlightgunwiimotedolphinbar 19 Posts 5 Posters 808 Views Loading More Posts Oldest to Newest Newest to Oldest Most Votes Reply Reply as topic Log in to reply This topic has been deleted. Only users with topic management privileges can see it. L lowlevel1989 last edited by lowlevel1989 dbar4gun Introducing dbar4gun, a Wiimote driver designed to function as a light gun for shooting games and graphic adventures. The key focus is achieving the best accuracy with a standard setup for multiplayer gaming. Furthermore, this driver offers the utmost precision possible based on its configuration. I encourage you to try it out and share your feedback! Now available for direct installation from RetroPie Setup! Feature support Bluetooth Only DolphinBar in mode 4 wiimote with individual buttons nunchuck calibration Standard configuration for Wii sensor auto key RetroPie-Setup Install Manage packages ~ driver ~ dbar4gun ~ Install Run Manage packages ~ driver ~ dbar4gun ~ Configuration ~ Enable/Restart dbar4gun Stop Manage packages ~ driver ~ dbar4gun ~ Configuration ~ Disable dbar4gun repository and docs https://github.com/lowlevel-1989/dbar4gun List of No-Crosshair I am looking for people who can help me test and try out games to complete the following list: List of No-Crosshair Games: Perfect Performance with Wiimote (tested) R 1 Reply Last reply Reply Quote 2 R RynoRoe @lowlevel1989 last edited by @lowlevel1989 this no longer seems to install from the retropie script module. How can I get this to install on my retropie setup? M 1 Reply Last reply Reply Quote 0 M mitu Global Moderator @RynoRoe last edited by @RynoRoe What errors do you get when installing the package ? R 1 Reply Last reply Reply Quote 0 R RynoRoe @mitu last edited by @mitu it gives me this error: Could not successfully install dbargun - dbargun is a Linux userspace driver for the wiimote with DolphinBar support. (opt/retropie/supplementary/dbar4gun/bin/dbar4gun not found). M 1 Reply Last reply Reply Quote 0 M mitu Global Moderator @RynoRoe last edited by @RynoRoe said in dbar4gun: new Wii remote userspace driver as lightgun: Could not successfully install dbargun - dbargun is a Linux userspace driver for the wiimote with DolphinBar support. The previous messages are showing the actual error. Try to post them also, along with the your setup info as requested in https://retropie.org.uk/forum/topic/3/read-this-first. R 1 Reply Last reply Reply Quote 0 R RynoRoe @mitu last edited by @mitu ok I’m running the newest install of retropie on a pi3 while running usb rom service with all my roms on an external drive. Here is the log file text: Log started at: Sun 12 Jan 21:46:24 GMT 2025 RetroPie-Setup version: 4.8.9 (86607a2c) System: rpi3 (armv7l) - Raspbian GNU/Linux 10 (buster) - Linux retropie 5.10.103-v7+ #1529 SMP Tue Mar 8 12:21:37 GMT 2022 armv7l GNU/Linux = = = = = = = = = = = = = = = = = = = = = Installing dependencies for 'dbar4gun' : dbar4gun is a Linux userspace driver for the wiimote with DolphinBar support. = = = = = = = = = = = = = = = = = = = = = /home/pi/RetroPie-Setup/tmp/build/dbar4gun /home/pi = = = = = = = = = = = = = = = = = = = = = Getting sources for 'dbar4gun' : dbar4gun is a Linux userspace driver for the wiimote with DolphinBar support. = = = = = = = = = = = = = = 