full_description = "Legal & Contact Contents1 Licenses2 Privacy Policy3 Contact Licenses RetroPie is a system to install/configure emulators on an existing OS – The RetroPie Setup Script is released under the GPL. The image we provide is Raspbian Lite with RetroPie pre-installed. Much of the software included in the RetroPie image have non-commercial licences. Because of this selling a pre-installed RetroPie image is not legal – this includes “giving away” a pre-installed RetroPie with your commercial product. Including copyrighted games with RetroPie is also not allowed. If you are selling hardware that supports RetroPie you should provide a link to our site for your customers rather than including a RetroPie image with your product. RetroPie does not ship with any copyrighted ROMs or games and does not condone illegal activity. Privacy Policy We use cookies around the entire site for use with Google Analytics, and on the forum for managing your login/session. Contact We do not use email for support – please use the RetroPie Forum for getting help, or discussing development. For other concerns (don’t email us about advertising / sponsored posts – you will be ignored) please email us at retropieproject [at] gmail.com. Comments are closed."
