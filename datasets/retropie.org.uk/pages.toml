full_description = '''Recent Tags Popular Home Docs Search Register Login const rect = document.getElementById('header-menu').getBoundingClientRect(); const offset = Math.max(0, rect.bottom); document.documentElement.style.setProperty('--panel-offset', offset + `px`); <div class="alert alert-danger"> <p> Your browser does not seem to support JavaScript. As a result, your viewing experience will be diminished, and you have been placed in <strong>read-only mode</strong>. </p> <p> Please download a browser that supports JavaScript, or enable it if it's disabled (i.e. NoScript). </p> </div> Please do not post a support request without first reading and following the advice in https://retropie.org.uk/forum/topic/3/read-this-first Confusing to find how to install Free Games Scheduled Pinned Locked Moved Help and Support confusingwebsite updatesideas 1 Posts 1 Posters 4 Views Loading More Posts Oldest to Newest Newest to Oldest Most Votes Reply Reply as topic Log in to reply This topic has been deleted. Only users with topic management privileges can see it. M mickeyj4j last edited by Hi all I am a New User to RetroPie I have a setup On my RPI 4 B+ 8Gb. I have a dual boot setup Running the latest Pinn/Noobs installer and use that to install RetroPie 4 4.8. My main os on the Pi is Raspbian/Raspberry Pi OS) I though RetorPie was Based On Raspbian/Debian. On first boot (dont have a gamepad etc yet). I went through the Keyboard setup ok When it got to the OK button I couldn't get it to move on for ages. I pressed all keys on the Keyboard and emulation station would eventually crash. So I had to reboot my Pi again. I also watched several videos that said to setup keyboard but not showing the full process. This took me days even several reinstalls. At this stage all I could do is press F4 to bypass keyboard setup. The Only tool I knew of was raspi-config so I booted that. Raspi-Config doesen't have a package manager and I didn't remember any of the games install packages to try so I thought It would be easy to install LightDM so I could at least use the Package manager there to install arcade games I know work With Keyboard. So I installed that but had trouble even finding how to start a GUI from the terminal trying many things. I couldn't find much help on the RPI or RetroPie Forums either. Finally after several weeks of trying and failing so many things. I happened to press the A/South button (chose keyboard c key for this) before any other key and things worked, I learnt how to get in and out of menus etc now. one annoying thing is that on reboot to get to the RetroPie or EmulationStation Gui I have to keep resetting up the Keyboard each time. (I haven't found a way to get around that yet). I could finally use emulation station menus. along the way I also turned on Retro Pie Menu and now just have that. instead of emulation Station. Next I went looking on how to install Games. This wasn't easy either. I looked on both the RPI Forums and mainly the RetroPie website and forums. I searched for How to install Games, Free Games, games etc. and couldn't find a list of free games easily. Then I looked up videos on YouTube and stumbled across this video. Video (9 years old at this time, it would be great to have a more updated video though), shows how to use the RetroPie Setup Script(Currently looking into this and will install some games etc soon). So from this process I have some Ideas that I feel would help make things easier for New users. so from this page of the setup guide click here under the section Additional Setup Options having san option similar to "for setup options like installing the built in game emulators and free game packages etc, see the guide on how to use the Setup Script here" (takes you to information on using the setup script). Thanks for listening to my rant etc. and I patriciate any help or clarifications you have on these ideas. 1 Reply Last reply Reply Quote 0 M mitu moved this topic from General Discussion and Gam