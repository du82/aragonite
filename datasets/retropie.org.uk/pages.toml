["https://retropie.org.uk/2020/11/retropie-4-7-1-update"]
title = "RetroPie 4.7.1 update - RetroPie"
description = "RetroPie 4.7.1 images are now available from the Download Page. Unfortunately a couple of bugs crept into the EmulationStation front-end for the 4.7 release. A performance issue causing EmulationStation to have a poor frame rate and a bug affecting its built in scrapers. The performance issue affected Raspberry Pi 0/1/2/3… Continue reading"
full_description = "RetroPie 4.7.1 update 4th November 2020 7th March 2022News, Releases RetroPie 4.7.1 images are now available from the Download Page. Unfortunately a couple of bugs crept into the EmulationStation front-end for the 4.7 release. A performance issue causing EmulationStation to have a poor frame rate and a bug affecting its built in scrapers. The performance issue affected Raspberry Pi 0/1/2/3 users and is related to a problem with the EmulationStation GLESv2 renderer on the legacy broadcom drivers (we have switched to the previous GLESv1 renderer for now). The scraper issue affected all systems, and was a problem introduced recently in the development branch that we missed. These issues are resolved in the 4.7.1 image. If you have already installed the 4.7 image you don’t need to re-download. Just choose the “update” option from the main menu in RetroPie-Setup. Raspberry Pi 400 is released More Power and USB-C for the ControlBlock Comments are closed."
author = "BuZz"
year_published = 2020
year_updated = 2022
clearnet = "https://retropie.org.uk/2020/11/retropie-4-7-1-update"
tags = ["4.7.1", "archives", "categories", "forum", "news", "posts", "recent", "releases", "retropie", "update"]
