["https://retropie.org.uk/category/news/page/7"]
title = "News Archives - Page 7 of 7 - RetroPie"
full_description = "Power Switch for your Arcade Machine? The PowerBlock got an Upgrade 29th May 2016 29th May 2016News Do you need a power switch for your arcade project? The PowerBlock is a power switch solution for the Raspberry Pi that lets you safely switch on and off your machine such that you do not have to worry about data loss or corrupt file systems. And the PowerBlock recently got an upgrade. Continue reading New website 6th April 2016 9th April 2016News RetroPie has a brand new website – https://retropie.org.uk. Although the old site living under http://blog.petrockblock.com has served us well over the last years, the forum was becoming increasingly slow, and the project really needed its own presence. Hopefully you will like what we have come up with – a simple site with general info, and a new forum running off nodebb – which is not only fast, but also works much better on mobile devices. The old forum posts have not been moved, as we decided it would be better to start with a fresh layout, and it would have made the migration far more complicated. You can however access the old forum via http://blog.petrockblock.com/forums/forum/retropie-project-forum/. Thanks to our excellent hosting company Mythic-Beasts who have sponsored us by providing additional resources and bandwidth. You can find out a bit more on our Hosting Information page."
