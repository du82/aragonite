full_description = "RetroPie 4.5.1 update 30th July 2019 28th April 2020News, Releases As detailed in the last post – https://retropie.org.uk/2019/07/composite-out-broken-on-retropie-4-5/ – there were some issues in the last image due to the updated Kernel. A newer Kernel has been released for Raspbian Stretch that resolves the composite output issue, but we also had problems reported with overscan settings and decided to implement… Continue reading Composite out broken on RetroPie 4.5 4th July 2019 4th July 2019News It has come to our attention that composite video out is broken on the 4.5 image due to a firmware bug. We updated the firmware/kernel to one from Raspbian Buster as the latest Raspbian Stretch kernel had an issue breaking Sony Bluetooth devices. However it seems that the more recent… Continue reading RetroPie 4.5 is released 3rd July 2019 28th April 2020News, Releases After some delays due to recent issues we are pleased to announce RetroPie 4.5. This version does NOT work on the recently released Raspberry Pi 4. We are currently working on support for this. IMPORTANT UPDATE: It has come to our attention that composite out is broken on this release.… Continue reading Interview with RetroPie on the digitalSoup podcast 26th March 2019 26th March 2019News On the 22nd March, RetroPie developer Jools Wills was interviewed on the excellent digitalSoup podcast. Big thanks to digitalSoup for inviting us on the show. If you like geeky banter including retro gaming, their podcast is definitely worth a listen. Interview is here: https://digitalsouppodcast.com/2019/03/22/117-retropie-interview-with-jools-wills/ Continue reading"
