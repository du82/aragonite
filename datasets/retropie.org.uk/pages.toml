full_description = '''Recent Tags Popular Home Docs Search Register Login const rect = document.getElementById('header-menu').getBoundingClientRect(); const offset = Math.max(0, rect.bottom); document.documentElement.style.setProperty('--panel-offset', offset + `px`); <div class="alert alert-danger"> <p> Your browser does not seem to support JavaScript. As a result, your viewing experience will be diminished, and you have been placed in <strong>read-only mode</strong>. </p> <p> Please download a browser that supports JavaScript, or enable it if it's disabled (i.e. NoScript). </p> </div> Home Recent Log in to post Load new posts All Topics All Topics New Topics Watched Topics Unreplied Topics All categories All categories All tags All tags C Problems with HotKeys Watching Ignoring Scheduled Pinned Locked Moved Help and Support controller 1 0 Votes 1 Posts 3 Views No one has replied M Confusing to find how to install Free Games Watching Ignoring Scheduled Pinned Locked Moved Help and Support confusing website updates ideas 1 0 Votes 1 Posts 4 Views No one has replied A Mario Kart Wii Error “Save File Corrupted” Watching Ignoring Scheduled Pinned Locked Moved Help and Support lr-dolphin mario kart wii 1 0 Votes 1 Posts 3 Views No one has replied D Delete Wifi network Watching Ignoring Scheduled Pinned Locked Moved Help and Support wifi config wifi network 3 0 Votes 3 Posts 71 Views M @DerDammerl said in Delete Wifi network: Hi, i have two WIFI networks here at home. When I first installed Retropie i used network #2. Now I need to change it to network #1. But it is still connecting all the time to network #2. How can I delete this network? I tried Disconnect/configure WIFI config, but without success. It disconnects, but as soon as I try to connect to the other one, it connects immediately to the wrong one again. Anyone any idea? I don't wanna block the Rasberry completely from the router, I just want it only connects if the the real one is not available Thanks I would Try deleting the file /var/lib/dhcpcd5/dhcpcd_*.lease. Sometimes it retains old settings. After deleting, reboot the system and try to connect to network #1. L dbar4gun: new Wii remote userspace driver as lightgun Watching Ignoring Scheduled Pinned Locked Moved Ideas and Development driver lightgun wiimote dolphinbar 19 2 Votes 19 Posts 808 Views L @Chef-Otis, have you followed the steps in the README? Were you able to start the service, or what issue are you facing exactly? I usually respond faster when the error is reported through this channel: GitHub Issues. K New SD card, same ROMs....language in Japanese now? Watching Ignoring Scheduled Pinned Locked Moved Help and Support dreamcast crazy taxi flycast 10 0 Votes 10 Posts 206 Views K Problem solved! I was able to get into the actual Quick Menu then into Core Options. Changed language. Thank all of you very much for the help! I really appreciate it! M Which controllers? Watching Ignoring Scheduled Pinned Locked Moved Help and Support pi4 xbox controllers 3 0 Votes 3 Posts 172 Views A @mem-com in my experience the old Xbox 360 controller, wired, has the same button config as a Xbox one controller, wired. I find Xbox controllers, wired and wireless, generally easy to install and, as lots of other platforms are using if too, much preferred. I have PS4 and 8BitDo modkits too, nice but not very compatible. P How can I add custom games made on gdevelop onto retropie Watching Ignoring Scheduled Pinned Locked Moved Help and Support help & support custom 2 0 Votes 2 Posts 139 Views S @Plantor07 does it run from command-line, or only desktop? What's the content of your .sh file? Of the errors? I have already installed Retropie on top of Raspbian and I have made the proper .sh files so that the game shows up on the menu but whenever I try to play it it doesn't work and it has one error or another. D Citra-Nightly-2104 on Pi5 (screen issue) - Nintendo 3DS Watching Ignoring Scheduled Pinned Locked Moved Help and Support nintendo 3ds vulkan script github 14 0 Votes 14 Posts 621 Views D @gvx64 said in Citra-Nightly-2104 on Pi5 (screen issue) - Nintendo 3DS: I can try building the Borked3DS build and seeing if I can figure out what the problem might by hacking around the old fashioned way. I can probably only fix something simple, but if nothing else I can probably at least tell you and the dev you are working with where the code is getting hung up. Yes please. I'm running MESA 24.3/Vulkan 1.3 (Debian testing) and it's pretty stable on Pi and all the emulators work well including your dolphin-rpi version. I'm not an expert but I think the problem with Borked3DS is not only a Vulkan problem. I think it doesn't handheld something else. See the last comment in this thread. F Development of module-script generator for lr-mess, lr-mame and mame standalone Watching Ignoring Scheduled Pinned Locked Moved Ideas and Development development lr-mess mame lr-mame scripts 2k 9 Votes 2k Posts 4m Views F I dropped the new aarch64 275 mame binary for rpi3,4,5. R Odroid XU4 SDL Problem Emulationstation Watching Ignoring Scheduled Pinned Locked Moved Help and Support odroid xu4 retropie ubuntu 67 0 Votes 67 Posts 4k Views M @aaronouthier said in Odroid XU4 SDL Problem Emulationstation: There is no retropie.cfg file in that location. You can create the file and add own_sdl2=0 in it, so RetroPie-Setup will use the distro's SDL packages instead of trying to build its own. T Compatibility of multiple Sony PS5 DualSense wireless controllers Watching Ignoring Scheduled Pinned Locked Moved General Discussion and Gaming ps5 dualsense compatibility bluetooth controller 4 0 Votes 4 Posts 7k Views N Hello, Is this ok in 2025 ? I want to buy a Dualsense for my Retropie-4.8.9 Bookworm Lite on Pi5 and I want to know if it works today, or if tricks are needed to connect a dualsense in bluetooth. Thanks M DOBE controller is recognized but can't configure input - RPI 4 Model B Watching Ignoring Scheduled Pinned Locked Moved Help and Support raspberry 4 b input device input issue input mapping 4 0 Votes 4 Posts 61 Views M @Murciano said in DOBE controller is recognized but can't configure input - RPI 4 Model B: Seems like installing joycond generated a virtual Nintendo Pro controller device that now also appears. I think the device is recognized by the driver as a Switch compatible controller and thus the name is also changed. The 'IMU' device is the accelerometer/gyroscope device created by the driver. If it's still not working, then I guess it's not compatible with Linux - you should get a PC/Linux compatible gamepad instead. D help with the TMNT Shredder’s Revenge Port Watching Ignoring Scheduled Pinned Locked Moved Help and Support ports 2 0 Votes 2 Posts 93 Views E @DeSanta dropping the link and what you tried will help. What's in your .sh files. Ect R Splash Video Audio and Game Snap Audio playing at same time Watching Ignoring Scheduled Pinned Locked Moved Help and Support splash video 5 0 Votes 5 Posts 128 Views R @sleve_mcdichael Thanks for the suggestions! I will give it a try. S Unofficial RPi5 RetroPie image. Watching Ignoring Scheduled Pinned Locked Moved Projects and Themes unofficial pi5 rpi5 image 35 4 Votes 35 Posts 8k Views S @ExarKunIv Thanks! I forgot to give permissions to everyone who has the link. Fixed. R Using kmsgrab and triggerhappy for full-screen screenshots Watching Ignoring Scheduled Pinned Locked Moved Help and Support kmsgrab triggerhappy sudo frame buffer 2 0 Votes 2 Posts 71 Views L You may succeed with giving the kmsgrab system admin capabilities, it does no longer require explicit sudo then. sudo setcap cap_sys_admin+ep /path/to/kmsgrab https://linux.die.net/man/8/setcap https://linux.die.net/man/3/cap_from_text https://man7.org/linux/man-pages/man7/capabilities.7.html I did not debug to the end, but I strongly assume at some point DRM hits this method, which bails out with -EACCES ("Operation not permitted") when privileges are not met. N Wine Explorer and Wine command line Watching Ignoring Scheduled Pinned Locked Moved Help and Support wine wine explorer wine librairies shader 15 0 Votes 15 Posts 722 Views N @ecto xinit: unable to connect to X server: Connection refused I failed to debug this on Pi5. That's why I use runcommand now. Can you show me how do you initialize display in your shell script please ? EDIT : Ok, I just understand that you run your script with runcommand. I tried this, but not starting. RE-EDIT : Ok it's working, somes stupid errors from me. Thank you for your help ! This is working too : #!/bin/bash cd "/home/pi/RetroPie/roms/ports/Trials 2 Second Edition" wine trials2.exe C Pi 4 4GB & 4k 60 Watching Ignoring Scheduled Pinned Locked Moved Help and Support pi 4 4k660 1343214 6 0 Votes 6 Posts 153 Views C @mitu I set hdmi_enable_4kp60=1 and made the VRAM 512mb as i have 4gb and that should be plenty to play with Now the menu is slightly choppy but not too terrible and games up to PS1 are playing fine at 4k60 N64 i expect would be the limit but honestly I only want to get to PS1 and it's doing that so this is awesome :D E Suggestions for ports #4 Watching Ignoring Scheduled Pinned Locked Moved General Discussion and Gaming retropie extras ports 48 0 Votes 48 Posts 3k Views E @ecto said in Suggestions for ports #4: sstse: I can't get this one to run. It starts and I have a menu, but as soon as I start a new game it crashes to a black screen. Hmmm. i can confirm the same thing. definitely something on the engine end. since SSTFE works just fine im going to open a issue and see what we can figure out on the SeriousSam github {"nextStart":20,"topicCount":196,"topics":[{"cid":8,"lastposttime":1740889809542,"mainPid":303056,"postcount":1,"slug":"36949/problems-with-hotkeys","tags":[{"value":"controller","valueEscaped":"controller","valueEncoded":"controller","class":"controller"}],"tid":36949,"timestamp":1740889809542,"title":"Problems with HotKeys","uid":49651,"viewcount":3,"postercount":1,"