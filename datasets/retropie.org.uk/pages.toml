title = "News Archives - Page 3 of 7 - RetroPie"
full_description = "RetroPie 4.5.1 update 30th July 2019 28th April 2020News, Releases As detailed in the last post – https://retropie.org.uk/2019/07/composite-out-broken-on-retropie-4-5/ – there were some issues in the last image due to the updated Kernel. A newer Kernel has been released for Raspbian Stretch that resolves the composite output issue, but we also had problems reported with overscan settings and decided to implement a workaround. As the previous 4.14 Kernel was well tested, we decided to switch back to it for now, and also created a new image (this was actually uploaded on the 17th July, but due to some testing and time constraints is only being announced now). If you have a 4.5 version of RetroPie for the Raspberry Pi you can choose the update option in RetroPie-Setup and then choose to “Update System Packages” when prompted. This will downgrade the Kernel to the one in this 4.5.1 image. The Kernel will only be downgraded if choosing to update System Packages from the RetroPie-Setup interface. You can download a 4.5.1 image from https://retropie.org.uk/download/. For first installs please follow the Installation Instructions. We are still working on Raspberry Pi 4 support. You may have seen some unofficial images from other people with some emulators working – but please bear with us. We also have some emulators working, but don’t want to release anything until we are able to realistically support it. Changes since 4.5 Downgraded to 4.14 kernel to resolve some 4.19 kernel/firmware issues(other rpi4/fkms changes which will be announced in a future post) Composite out broken on RetroPie 4.5 4th July 2019 4th July 2019News It has come to our attention that composite video out is broken on the 4.5 image due to a firmware bug. We updated the firmware/kernel to one from Raspbian Buster as the latest Raspbian Stretch kernel had an issue breaking Sony Bluetooth devices. However it seems that the more recent firmware has stopped composite output from working. This is the upstream issue. It has been fixed, but it isn’t yet available as a Raspbian update. https://github.com/raspberrypi/firmware/issues/1166. If you have already installed 4.5 – you can fix this by downgrading the Kernel. You can do this via SSH if you have no display output. You can enable SSH by making a file called ssh in the /boot folder using another system. See https://retropie.org.uk/docs/SSH/#enable-ssh. Once you have access to the command line you can manually downgrade the Kernel with the following command (after running this reboot, and you should be on the older firmware and kernel). sudo ~/RetroPie-Setup/retropie_packages.sh raspbiantools install_firmware 1.20190401-1 This older version also works with Sony Bluetooth devices. RetroPie-Setup will only try and update the kernel again if you choose to update system packages. Sorry for the inconvenience. We will update to a newer kernel as soon as one is available."
