["https://retropie.org.uk/2020/11/retropie-4-7-is-now-available"]
title = "RetroPie 4.7 is now available - RetroPie"
description = "RetroPie 4.7 images are now available, and include a variety of changes and improvements. We marked RetroPie 4.6 as having beta support for the Raspberry Pi 4. We now believe it to work well enough to remove the beta label. RetroPie 4.7 supports the new Raspberry Pi 400. Please see… Continue reading"
full_description = "RetroPie 4.7 is now available 2nd November 2020 2nd November 2020News, Releases RetroPie 4.7 images are now available, and include a variety of changes and improvements. We marked RetroPie 4.6 as having beta support for the Raspberry Pi 4. We now believe it to work well enough to remove the beta label. RetroPie 4.7 supports the new Raspberry Pi 400. Please see below for more information on what’s changed since RetroPie 4.6. You can download a 4.7 image from https://retropie.org.uk/download/. For first installs please follow the Installation Instructions. You can also install RetroPie on top of an existing Raspberry Pi OS (Formerly Raspbian) set up, or on top of Ubuntu on a PC/Odroid-C1/C2/XU3/XU4. Links to the relevant instructions can be found on the Download Page. Please note that our pre-built binary packages for Raspbian Stretch are no longer updated, and support is being dropped for this version. If you are still running a Raspbian Stretch based image you will get a warning when launching RetroPie-Setup. We recommend people update to the latest image which is currently based on Raspberry Pi OS (Buster). If you want to support the project, donations are always appreciated and can be made on our Donation Page. The lead developer Jools Wills also has a Patreon page up at https://www.patreon.com/retropie. Thanks to everyone who has contributed to this release. Changes since 4.6 Updated to the latest Raspberry Pi OS Buster image, with support for USB boot on the Pi4. The RetroPie 4.7 image can be flashed directly to an USB drive and booted directly, the Pi4 boot EEPROM should be updated first using Raspberry Pi Imager as detailed in https://github.com/raspberrypi/documentation/blob/master/hardware/raspberrypi/booteeprom.md.Added xpadneo – linux driver for xbox one wireless gamepad.retroArch – updated to v1.8.8.Added mame – standalone MAME emulator building from latest code.srb2 (Sonic Robo Blast 2) – updated to v2.2.2.cgenius – updated to 2.4.4.1.hatari (Atari ST emulator) – updated to v2.2.1.amiberry (Amiga emulator) – updated to v3.3.scummvm – updated to 2.2.0xroar (Dragon 32 / CoCo emulator) – updated to v0.36ti99sim – update to version 0.16.0 and switch to SDL2.Added ti99sim-sdl1 for older distros as new code requires GCC 8sdltrs – switch to the SDL2 version, enable for KMSattractmode – now supports RPI4/KMS.lr-vecx – now includes GPU rendering support for smooth vector output.sdl1 / runcommand – fix aspect ratio using the dispmanx backend with sdl1 on fkms (this affects various sdl1 emulators such as dosbox, daphne, openbor and others).lr-gpsp – fixed crash on RaspberryPi OS Buster.opentyrian – updated to latest code which now uses SDL2 backend.darkplaces-quake – added optional gles version for RPI4 with better performance.gemrb – updated to v0.8.6 and switched to SDL2 backend.lr-bnses – updated to the current BSNES version of the libretro fork.vice – updated to latest version, and re-enable fastsid which got disabled by default upstream.Improved Aarch64 support (64bit Arm) – can be manually installed on the beta 64bit Raspberry Pi OS, but is not officially supported.lzdoom – update to 3.86a (This was announced as the final lzdoom release to support GL2 rendering.)mupen64plus – reworking of module logic – now enabled on mali targets.Added recognition for Jetson Nano and Tegra X1Added gpg signing for pre-built binaries.Improvements to runcommand and RPI4 videomode detection.Updates to Skyscraper (Metadata scraper).usbromservice – fixed bug with mounting ext3/ext4 partitions.audiosettings – updates for Pi4 and support for discrete internal ALSA devices.New esthemes added.Various other bug fixes and improvements.Added new experimental modules:lr-mesen – Mesen NES/Famicom emulator.lr-theodore – Thomson MO/TO system emulator.lr-smsplus-gx – Sega Master System/Game Gear emulator.lr-gearsystem – Sega Master System/Game Gear/SG-1000 emulator. RetroPie 4.6 released with Raspberry Pi 4 support. Raspberry Pi 400 is released Comments are closed."
author = "BuZz"
year_published = 2020
year_updated = 2020
