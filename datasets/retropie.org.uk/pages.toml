["https://retropie.org.uk/docs/First-Installation"]
title = "First Installation - RetroPie Docs"
description = "RetroPie Project Documentation"
full_description = '''First Installation Version 4.8 Congratulations! You have discovered the wonderful world of RetroPie- your entire childhood is within reach! RetroPie is a combination of multiple projects including RetroArch, EmulationStation, and many others. This page is for people just getting started on RetroPie. The easiest way to install RetroPie is the SD image which is a ready to go system built upon top of the Raspberry Pi OS - this is the method described in the following guide. Alternatively, advanced users can install RetroPie manually. This guide will give you the very basics to get you up and running from a blank MicroSD card to first boot into EmulationStation. The following video will also walk you through the installation process. Otherwise read on! Hardware The simplest way to get most of these components is through an all-in-one kit such as the Canakit. Required Computer (or laptop) Raspberry Pi MicroSD card (see compatible SD cards) MicroSD card reader - a way to plug the MicroSD card into your computer or laptop Some laptops have this functionality in the form of an SD card slot (example #1, example #2). A USB MicroSD card reader can be plugged into any USB port Screen (TV, computer monitor, projector, etc) - anything with HDMI or RCA Video cable Pi 4 will need a Micro HDMI to HDMI cable Pi 1, 2, and 3 will need a full-size HDMI cable Pi Zero will need a Mini HDMI to HDMI cable 4-Pole RCA to 3.5mm is also an option for older screens Power supply View the official Raspberry Pi Power documentation for each model Game controller of your choice Can be USB-wired, wireless (with a dongle), or Bluetooth (with or without a dongle. Pi 3 and later models have built-in Bluetooth and won't need a dongle) The Control Block can use original SNES controllers Optional Raspberry Pi case - highly recommended Wifi dongle or ethernet cable to connect to the internet for Updating and Transferring ROMs (see wifi dongle compatible list. Wifi is built-in for the Pi 3 and later models and will not need a dongle.) USB Keyboard - to help with some configuration that cannot be done with a game controller, or you can use SSH Installation First, insert the MicroSD card into into your computer Download the RetroPie .img.gz image from the official website for your Raspberry Pi model. If you use Raspberry Pi Imager (recommended), you can omit this step and simply choose RetroPie from the list of included images (example). If needed, official instructions for using the Raspberry Pi Imager are here Select the image for the model of Raspberry Pi (RPI) that you have. For example, if you have a Raspberry Pi 4, select the RPI 4/400 image If you don't know which model Raspberry Pi you have, the Raspberry Pi Wikipedia page has user-friendly graphics to help determine model by looking at the board itself. If you have SSH/commandline access, run cat /proc/device-tree/model and it will output your Pi's model Download a program to write the RetroPie .img.gz image to your MicroSD card For Windows: Raspberry Pi Imager, Etcher, or Win32DiskImager Win32DiskImager requires an .img file extracted from the .img.gz image downloaded in step #2. You can use a program like 7zip to do this For macOS: Raspberry Pi Imager, Etcher, Apple Pi Baker, or the dd command For Linux: Raspberry Pi Imager, Etcher, or the dd command MacOS/Linux users can optionally extract the .img image from the downloaded .img.gz by using gunzip (macOS users can also simply double-click it) Once the program's image/OS and SD card have been chosen, write it to the SD card and wait until the operation completes Remove the MicroSD card from your computer, slide it back into the slot on your Raspberry Pi, and turn it on Configure Controllers On first boot you will be welcomed with the screen below. This menu will configure your controls for EmulationStation, all RetroArch emulators, and select standalone emulators: Hold down any button on your controller or keyboard. While holding, its name will appear at the bottom of the window for a few seconds and then open up into a configuration menu: Follow the onscreen instructions to configure your gamepad. If your controller doesn't have a button that you're being asked to define, just hold down any button to skip it. See the following diagrams for reference: SNES Controller XBox 360 Controller PS3 Controller More info at RetroArch Controller Configuration Hotkey The Hotkey Enable button enables you to press it in combination with another button to access functions such as saving states, loading states, opening the RetroArch GUI (RGUI), and exiting back to EmulationStation. It is recommended to define an unused button or key as your Hotkey Enable button. For example, the Home button on some controllers such as the center "X" on Xbox controllers. If your controller doesn't have an unused button, the Select button is a good alternative. The following chart shows the default hotkey combinations. Note Hotkeys are specific to the RetroArch/Libretro based emulators and may not work on other emulators. Hotkey Combination Action Hotkey+Start Exit Hotkey+Right Shoulder Save Hotkey+Left Shoulder Load Hotkey+Right Input State Slot Increase Hotkey+Left Input State Slot Decrease Hotkey+X RGUI Menu Hotkey+B Reset For more information, see Hotkeys When you get to "OK" at the end, press the button you have configured as "A" (East) to complete this step. EmulationStation Where are the systems? When you first see EmulationStation you may wonder why you don't see systems like the SNES or Game Boy. Worry not - the emulators are installed on the system, but ROMs will need to be added to their respective rom folders before they will become visible Transferring ROMs You will not see any game systems (NES, n64, Playstation, etc) on the system list until you add ROMs! Visit the Transferring ROMs page to learn how to transfer ROMs to RetroPie. Audio In general RetroPie audio will work out-of-the-box without any tweaking if using HDMI, but if you have audio issues you should follow the instructions on the Sound Issues Page to fix them. You will most likely need to visit this page if you are using a USB audio device, or if you are using an aftermarket RPi HAT add-on audio device (such as a Justboom sound card). PLAY! After you've transferred your ROMs, you need to restart EmulationStation in order for them to show up. You can restart EmulationStation by pressing Start > Quit > Restart EmulationStation, or with SSH access by rebooting your pi with sudo reboot. Once rebooted, you should see the game systems appear on the system list. Additional Setup Options Configure WiFi Enable SSH Configure more controllers. This can be done after plugging in the new controller and pressing Start on your controller and selecting Configure Input In RetroPie, not everything is installed by default. The pre-made images contain the best-working emulators for the more common systems supported by the hardware. This should cover typical use, but if you want to install additional emulators or ports, the Updating RetroPie page has this information. Cheat codes! See the rest of the RetroPie documentation for more detailed information on individual emulators, advanced settings, etc. If you're having trouble, you may find answers in the FAQ. Also, the RetroPie community is very helpful on the RetroPie forum. One more thing... The RetroPie Project is primarily maintained by a few enthusiasts who develop the project in their free time. If you have found the RetroPie project useful please consider donating to the project here. As you become more familiar with RetroPie, pay it forward by helping others on the forum, by contributing to this documentation, by reporting bugs (start in the forum) or providing fixes for bugs. More than ten years after its founding, the RetroPie Project is what it is today because of the many contributions of the community. THANK YOU!'''
author = "The RetroPie Project"
year_published = 2025
clearnet = "https://retropie.org.uk/docs/First-Installation"
