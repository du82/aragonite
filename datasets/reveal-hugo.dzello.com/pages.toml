title = "Custom theme example presentation"
full_description = "This presentation uses a custom Reveal.js theme written in SCSS that is compiled by Hugo, using Hugo pipes. No separate build process is required, which means you can iterate on your theme and your content at the same time. Note: to use a custom theme that doesn’t need compilation, put it in the static directory and do not set the custom_theme_compile parameter. It will be served to the browser directly."
