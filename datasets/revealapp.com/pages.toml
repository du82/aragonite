["https://revealapp.com/updates/30"]
title = "Version 30 - Reveal"
description = "Reveal v30 adds support for UIKit v15, inspecting system fonts, and brings back multi-colour outline icons"
full_description = "Reveal 30Released August 3, 2021macOS 10.15.4+iOS 10.3+tvOS 10.2+Xcode 12.5+AddedSupport for an initial batch of UIKit v15 propertiesSupport for inspecting and changing text style fonts using the UIFont.preferredFont APIAn option to hide alignment rects when the view frame differs, which should make inspecting SwiftUI views easier to understandA preference to switch between monochromatic and a new set of multi-coloured icons for the OutlineImprovedSupport for UITableView and its new properties introduced in UIKit v15Support for UIView’s new content size category propertiesSupport for UICollectionView’s allowsFocus and allowsFocusDuringEditing propertiesSupport for UIScene’s new subtitle propertySupport for UIWindow’s new canBecomeKeyWindow propertySupport for UILabel’s new showsExpansionTextWhenTruncated propertySupport for UISlider’s new behaviouralStyle and preferredBehaviouralStyle propertiesSupport for UIControl’s new toolTip propertySupport for UIDatePicker’s new roundsToMinuteInterval propertyOutline sidebar, with support for recursively expanding and collapsing items by Option-clicking the disclosure arrowConnection list, which no longer prevents users from quitting the appInspector, with steppers that now increment by 0.1 and input fields now support arbitrary precisionFixediOS, iPadOS and tvOS 15 all introduce changes to the way applications startup that caused our existing integration methods to deadlock when injecting RevealServer. This release fixes those issues, but if you use the breakpoint integration method, you will need to update your existing breakpoint on UIApplicationMain to be -[UIApplication _run] to avoid this. More information is available in our support article, My app is hanging on launch under Xcode 13 and iOS/tvOS 15Fixed an issue where views with massive frames were causing crashes and incorrect drawing in Reveal’s canvas. As of this release, we clamp the frames of views being presented in the canvas to reasonable values. The inspectors and all visible information will continue to show the correct unclamped valuesFixed an issue where the Outline’s selection would remain after the canvas and inspector selection had been clearedFixed an issue where the Outline would display truncated widths for some rowsFixed an issue in the LLDB integration script that was causing a TypeErrorDownload Reveal 30Requires a full or trial license to use."
