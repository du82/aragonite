["https://revealapp.com/news/layout-guides-and-the-touch-bar"]
title = "Layout Guides and the Touch Bar - Reveal"
description = "Reveal 7 brings support for Auto Layout guides, as well as Touch Bar support on Apple's new MacBook Pro."
full_description = "Layout Guides and the Touch BarFebruary 22, 2017A new release of Reveal (v7) is available to all users with a current license, and as a 14-day trial.You thought that after the huge set of new features we released last month we’d slow down and take a breather? No, Sir! We’ve got two great, chunky new features and a light dusting of bug fixes ready to go:Reveal 7 adds support for inspecting Auto Layout guides, as well supporting dynamic, context-specific keyboard shortcuts on the Touch Bar of Apple’s new MacBook Pro.Auto Layout GuidesNew in this month’s release of Reveal is support for Auto Layout guides.Being able to inspect layout guides is useful when debugging layout issues in views like UIStackView which use UILayoutGuide to implement their internal layout. For example, if a constraint attached to a layout guide gets broken by Auto Layout, inspecting your app in Reveal will highlight that constraint with a layout error, and now Reveal will also show which layout guide the constraint is related to, and visualize it in the Canvas.You can read about this feature in-depth in Vlas’ introductory blog post.Touch Bar SupportIf you’re lucky enough to have one of Apple’s new MacBook Pro notebooks, we now support dynamic, context-specific hotkeys in the Touch Bar for:Connecting to your iOS and tvOS appsControlling the canvas and outline view, including:Filtering the view hierarchyRefreshing the currently focused appToggling auto layout, system windows and hidden view displayZooming the canvasControlling the display options of the canvas, including perspective (2D/3D) and the render mode (“Frames”, “Content” or “Frames and Content”)We’d love your feedback on this feature!Bug FixesFixed: The position and size of the frontmost document window is remembered across launches.Fixed: RevealServer.framework’s CFBundleShortVersionString is now the same as the version of Reveal that bundles it.Minimum System RequirementsmacOS 10.11iOS 8tvOS 9Xcode 7.3Note: The RevealServer.framework has changed. Please remember to update your projects to link to the new framework version.SupportIf you have a question, or would like to give us feedback, you can do so from within Reveal (see “Help → Submit Feedback”), or via our support forum.Tony ArnoldDeveloper"
author = "Itty Bitty Apps"
