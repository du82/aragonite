full_description = "How Reveal HelpsImprove your app’s accessibilityAccording to the World Health Organization, an estimated 1.3 billion people - or 1 in 6 people worldwide - experience significant disability.Do you know how well your app is meeting their needs? Reveal does. Accelerated accessibility testingReveal shows your app’s VoiceOver and Voice Control interfaces all at once, so you can check and improve your user’s experience faster than ever before!See your app through different eyesExperience your app as your users do using Reveal’s best-in-class simulations of common genetic color vision deficiencies. Accessibility FeaturesEverything everywhere all at onceReveal’s accessibility workspace loads instantly. But that’s not the best part: all the data you need is available to you, all at once.A wealth of dataThe Accessibility Workspace shows you everything: spoken approximations, attributed string properties, public/private traits, custom content and actions, and more.Our decade of experience extracting and making sense of the data that apps provide, all at your fingertips.Understand the big pictureUse Reveal’s powerful VoiceOver mode to instantly have a complete list of the on-screen elements’ full descriptions — in the order they will be spoken.Use the narrative flow to gauge the user experience, and use the canvas overlay to crosscheck their spoken order against their on-screen locations.Rich, composable overlaysExperience your app as your users would using Reveal’s best-in-class color vision deficiency overlays.Combine these with any of the contrast checks to discover any edge cases.Contrast checksReveal uses machine learning combined with deep knowledge of each on-screen element’s type and contents to provide powerful contrast checks.Test against WCAG 2.2 or the new APCA algorithm that is being evaluated for WCAG 3.0.FeaturesSupport for Xcode 15 & UIKit SDK 17Support for SwiftUI accessibilityVoiceOver modeVoice Control modeWCAG 2.2 color contrast checkingA