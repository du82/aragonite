["https://revealapp.com/updates/27"]
title = "Version 27 - Reveal"
description = "This version of Reveal brings support for inspecting new views and attributes introduced in UIKit v14, and a change to how we intergrate with your UIKit apps."
full_description = "Reveal 27Released November 1, 2020macOS 10.14+iOS 8+Xcode 12+This version of Reveal brings new features and enhancements for inspecting views and attributes recently introduced in UIKit v14.This release brings a major change to how we integrate with your UIKit apps: we’re shipping our SDK as an XCFramework. This will allow Reveal to seamlessly support new frameworks, such as Mac Catalyst, and new platforms and architectures, such as the upcoming Apple Silicon Macs. We’ve done our best to make this a seamless switchover, and the bundled integration documentation has been reviewed and updated. As always, we’re on hand to support you if you have any questions about this change.Additionally, there are big changes to Reveal’s supported macOS, iOS and tvOS versions coming in the next release:This release (v27) will be the last to support macOS 10.14. Future releases of Reveal will require macOS 10.15 or newer.This release (v27) will be the last to support iOS 8. Future releases of the Reveal SDK will require iOS 10.3 or newer.This release (v27) will be the last to support tvOS 9. Future releases of the Reveal SDK will require tvOS 10.2 or newer.AddedSupport for UIKit v14’s new Context Menu properties for UIControlSupport for WKWebView’s new mediaType and pageZoom propertiesSupport for UIView’s focusGroupIdentifier propertySupport for UITableView’s selectionFollowsFocus propertySupport for UISegementedControl’s selectedSegmentTintColor propertySupport for UIRefreshControl’s tintColor propertySupport for UIButton’s UIAccessibilityContentSizeCategoryImageAdjusting conformancesSupport for SKView’s disableDepthStencilBuffer propertySupport for MKCompassButton’s mapView object reference propertySupport for MKAnnotationView’s z-priority propertiesSupport for Mac Catalyst layout guide propertiesSupport for AVSampleBufferDisplayLayer’s requiresFlushToResumeDecoding propertySupport for UITapGestureRecognizer’s buttonMaskRequired propertySupport for UIPanGestureRecognizer’s allowedScrollTypesMask propertyImprovedSupport for UICollectionView and its new propertiesSupport for UIDatePicker’s style propertiesSupport for UIButton and its new propertiesSupport for UISwitch and its new propertiesSupport for UIPageControl and its new propertiesSupport for MKMapView and its new propertiesSupport for capturing layout constraint errors in UIKit v14Support for UIKit v13.4’s UIGestureRecognizerFixedFixed an issue with UISearchTextField that caused a crash when accessing an undefined keyDownload Reveal 27Requires a full or trial license to use."
