title = "Features - Reveal"
description = "View your app from a new perspective. Find and fix layout issues. Make live edits. Reveal features pro tools for app developers."
full_description = "Pro tools for app developersDon't waste time guessingA Beautiful PerspectiveReveal uses Scene Kit to show your application's view hierarchy in a whole new light. Rotate, zoom and navigate your application to solve difficult problems in seconds.Live EditsEdit and modify views in your running application to see the effect immediately. No more recompiling to test simple visual changes.Comprehensive InspectorsWith detailed custom inspectors for a wide range of UIKit classes you'll be able to see and edit more properties than any other tool.See RelationshipsGet your head around unfamiliar code. Reveal helps you to easily identify which classes implement which views.Find and fix layout problemsVisualize ConstraintsFind and discover relationships between views and constraints directly on the canvas.Auto Layout warnings & errorsReveal highlights views and constraints affected by common Auto Layout issues, helping you to fix layout problems faster.Participating ConstraintsQuickly edit or navigate to constraints that affect a view's layout.Constraint OwnershipSee constraints owned by a view in the outline, and identify those created by the system.Focus on what's importantSimplifyMake complex applications easier to understand by collapsing parts of the view hierarchy.IsolateView hierarchies can get complex. Double click a view to focus on it, and all its subviews.RefineTailor the amount of information displayed for the task at hand. Toggle the display of hidden views, constraints, wireframes and content.FilterFilter your view hierarchy for specific attributes such as classes, accessibility information, memory addresses and more.And much more...Inspect tvOS AppsSeamlessly inspect tvOS apps using the same powerful tools you use for iOS apps.App ExtensionsInspect your App's Extensions, and debug issues that even Xcode can't see.Layout InspectorView and edit detailed layout properties in the dedicated layout inspector.Create and Share SnapshotsShare snapshots with your team or use them as point-in-time reference during development.by Itty Bitty AppsTry for Free Buy Now"
