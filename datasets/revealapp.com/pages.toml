["https://revealapp.com/updates/48"]
title = "Version 48 - Reveal"
description = "Reveal v48 allows configuration of the Screen Structure mode in the Accessibility Workspace."
full_description = "Reveal 48Released July 15, 2024macOS 13.3+iOS 13+iPadOS 13+tvOS 13+Xcode 15+Configuring the Screen Structure accessibility mode.New in this release is the ability to control what values are displayed in the Accessibility Workspace Navigator when using the Screen Structure mode. This feature is great for debugging values that your accessibility hierarchy may be missing, or that might be set incorrectly.The only difference between this release and v47 is that this release does not include the Sentry SDK in Reveal Server. This was unintentional, and could cause issues with your app if you are already using Sentry. We use Sentry in Reveal.app (not Reveal Server) for crash and performance reporting — you can find out more about this in our privacy policy.AddedThe row labels in the Accessibility Workspace’s Screen Structure mode can be configured to show a combination of accessibility properties.Saved snapshots now take up significantly less space on disk. We’re de-duplicating images saved into the bundle, which can result in file size savings of up to 70%.ImprovedWe’re no longer round-tripping many image types to UIImage/NSImage, which should result in faster performance, as well as a (small) potential improvement in memory use.FixedThe Sentry SDK was unintentionally bundled with Reveal Server in version 47. It is no longer bundled in this release.Fixed a number of potential memory leaks in the document and window controller.Fixed a potential data race when running contrast checks.The buttons on our document connection window were truncating their subtitles. Yes, it annoyed us too.Download Reveal 48Requires a full or trial license to use."
