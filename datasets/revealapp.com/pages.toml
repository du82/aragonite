["https://revealapp.com/updates/17"]
title = "Version 17 - Reveal"
description = "Reveal helps you to review, fix and improve your app’s accessible and visual user experiences."
full_description = "Reveal 17Released August 7, 2018macOS 10.13.4+iOS 8+Xcode 8+AddedAttributes Inspector for Core Animation layers now supports 32 new properties across several classesAttributes Inspector now displays properties of MapKit views when inspecting tvOS appsAttributes Inspector for UITextField, UITextView and UISearchBar classes now supports textContentType propertyOutline and Participating Constraints inspector now display descriptions for autoresizing mask layout constraintsNavigate menu now includes Select Next Issue and Select Previous Issue commands for quick navigation to the Outline items with detected layout issues (i.e. views with ambiguous layout and broken layout constraints)Clicking a warning icon that appears next to broken constraints in the Participating Constraints inspector now displays the description of the warning in a popoverReveal can now describe the purpose of many system-managed layout constraintsImprovedSeveral layer properties with string enum types (e.g. CAShapeLayer.lineCap) are now displayed correctly in the inspectors and can be modifiedHierarchy navigation commands in the Navigate menu (e.g. Select Parent) have been updated to better support layout constraints, layout guides and layersEdit → Copy command now allows copying a debugger expression corresponding to the currently selected itemOutline items for CATextLayer objects now include the text displayed by those layersSeveral commands and options in the Canvas and Navigate menus have been renamed to better reflect their current functionality, e.g. layer inspection supportViews from Google Maps SDK (GMSMapView and GMSPanoramaView) are now collapsed in the Outline and Canvas by default, similarly to MKMapViewSeveral under-the-hood changes in preparation for Dark Mode support on macOS 10.14 MojaveFixedCollapsing some items containing layout guides is now animated correctly in the CanvasCanvas now correctly positions items with miniscule intersection, instead of needlessly separating them. This mainly affected inspecting apps displayed on 3× screensInspectors of option set (bitmask) properties no longer include a superfluous checkbox for ‘None’ (zero) optionView hierarchies that contain objects overriding isEqual: method (e.g. layers from Google Maps SDK) can now be inspected correctlyFixed the Layout Report inspector not appearing if a change to a view’s or constraint’s attribute introduced a layout issueLaunching Soundstagram should now succeed if DEVELOPER_DIR environment variable points to the root of Xcode app bundle instead of the Developer directory inside itLaunching Soundstagram should no longer fail to create a new Simulator instance if an appropriate one does not exist yetDownload Reveal 17 View AnnouncementRequires a full or trial license to use."
