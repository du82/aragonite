["https://revealapp.com/updates/32"]
title = "Version 32 - Reveal"
description = "Reveal v32 fixes a number of reported issues, and continues to significantly improve performance over previous releases."
full_description = "Reveal 32Released November 10, 2021macOS 10.15.4+iOS 10.3+tvOS 10.2+Xcode 13+This release of Reveal is focused on foundational improvements to our UIKit serialization to support upcoming features, as well as general quality of life improvements.Additionally, this release (v32) will be the last to support macOS 10.15. Future releases of Reveal will require macOS 11 or newer.AddedRight-clicking any view or layer node in the outline now allows you to export an image of that view to disk. Hold down the Option Key (⌅) to copy the image to the clipboard.ImprovedPerformance should (once again) be significantly improved in a number of areas of the app.Significantly reduced idle CPU use.Added better errors for issues we expect users might encounter in normal use, including the ability to open a new bug report on our support site directly from the error dialog.Improved the size and loading performance of our bundled documentation.Improved the display names of system constraints in the outline.FixedFixed an issue that prevented our bundled documentation from loading in Safari.When inspecting a view that has a layout warning, the warning badge on the layout tab was displayed incorrectly - this has been fixed.Fixed a crash due to a non-main thread access of the document’s isEditable property.Fixed a bug in RevealServer that was logging warnings about unsupported font accesses.Fixed MKMarkerAnnotationView showing properties for it’s parent class, MKAnnotationView.Fixed a number of minor inconsistencies in our view hierarchy serializer.Restored the ability to see NSObject identity information in the inspectors.Fixed layout animations in the UUID inspector.Download Reveal 32Requires a full or trial license to use."
