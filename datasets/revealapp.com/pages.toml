full_description = "Reveal 45Released December 11, 2023macOS 13+iOS 12+iPadOS 12+tvOS 12+Xcode 15+This release of Reveal improves accessibility support — particularly around contrast checking — for apps built with cross-platform frameworks such as React Native and Flutter.It also addresses crashes caused by threading issues, and a handful of minor bugs.Happy holidays!ImprovedContrast checking support for apps built using cross-platform frameworks.The Layout workspace color inspectors will now display user-defined named colors where available.FixedFixed two threading issues that were causing crashes.Fixed inconsistencies in Insights workspace rules working with ambiguous or broken layout constraints.Accessibility elements with the .notEnabled trait will now be fully excluded from WCAG contrast checks.A bug affecting how detected colors were correlated with available text color information.Download Reveal 45Requires a full or trial license to use."
