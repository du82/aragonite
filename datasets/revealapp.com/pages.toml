["https://revealapp.com/updates"]
title = "Updates and changelog - Reveal"
description = "There's always a new version of Reveal around the corner. Browse all versions to see what's changed."
full_description = 'Updates and changelogReveal 52Released December 12, 2024macOS 13.3+iOS 13+iPadOS 13+tvOS 13+Xcode 15+Reveal v52 improves the user experience of the breakpoint integration method. As Xcode has changed, there have been a few new and exciting ways that integration can fail. These should now all be addressed. Additionally, we have gone through with a fine-tooth comb to improve the reporting and user feedback during this process so it no longer fails silently; when integration does fail, it will provide a useful error.But the most important improvement to the user experience here is resolving long-standing bugs that were negatively affecting the performance of the breakpoint integration. It should now happen in a quarter of the time when deploying to a device, and nearly instantly when building against a simulator.The Accessibility workspace’s Voice Control mode has been updated to reflect the single-word label behaviour new with iOS 18. Additionally, we now also display the custom actions associated with each element in the navigator.Elsewhere, there are the usual bug fixes and performance improvements.AddedIt’s now possible to control which types of views collapse by default in the Layout workspace via a context menu in the navigatorThe Accessibility Workspace will now display the new UIAccessibility.ExpandedStatus of each element, where supportedImprovedThe Voice Control mode in the Accessibility workspace has been updated to match iOS 18 behaviour. The navigator will now also display a list of custom actions on each element that can be accessed by the user via the Show actions for… commandReveal Server will now be injected into apps running on physical devices in a quarter of the time it took previously, and nearly instantly for simulator buildsReveal Server will now provide warnings and assistance in debugging integration and connectivity problemsReveal Server will no longer re-disable accessibility services when they have been explicitly enabled on load. This was causing long load times for some usersReveal now traverses the view hierarchy by starting at an application’s scenes, rather than screens, as screens do not exist on visionOS, and screens are deprecated as a source of this information on Apple’s other platformsIt is now possible to access most of the functionality of Reveal’s Help toolbar menu without an active license or trialFixedFix macOS 15 related regressions in the performance and function of the Insights workspace affecting appearance, scrolling and rule selectionReveal will no longer leave behind an unused breakpoint when using the breakpoint integration method with Xcode 16Add missing .menuItem trait to two of our Accessibility Best Practices rulesSaving snapshots from apps with a missing or non-existent app icon will no longer cause a crashFixed a bug in two of our Human Interface Guideline rules that caused evaluation of two rules to stop earlyDownload Reveal 52Requires a full or trial license to use.Note that older versions of Reveal are not supported.Looking for a specific version?Quick Find52 December 12 202451 October 8 202450 September 4 202449 July 25 202448 July 15 202447 July 12 202446 February 27 202445 December 11 202344 November 16 202343 October 25 202342 October 16 202341 November 14 202240 November 3 202239a October 4 202238 June 29 202237 June 16 202236 May 25 202235 March 10 202234 February 17 202233 December 8 202132 November 10 202131 August 16 202130 August 3 202129 June 2 202128 February 15 202127 November 1 202026 May 19 202025 May 12 202024 August 5 201923 June 5 201922 April 30 201921 February 20 201920 November 19 201819 October 31 201818 September 20 201817 August 7 201816 June 25 201815 May 30 201814 April 9 201813 December 5 201712 November 21 201711 September 12 201710 August 16 20179 July 11 20178 April 5 20177 February 22 20176 January 18 20175 November 15 20164 November 14 20163 November 2 20162 September 14 20161.6.3 February 2 20161.5.1 February 18 2015f