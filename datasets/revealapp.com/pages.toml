full_description = "This one goes all the way to elevenSeptember 18, 2017A new release of Reveal (v11) is available to all users with a current license, and as a 14-day trial.We’ve turned the dials to eleven with this release - just in time for Apple’s big round of releases: Reveal now supports tvOS 11, iOS 11 and Xcode 9.We’ve gone through and added support for over 35 new inspectable properties, including:CALayermaskedCornersMKMapViewregioncenterCoordinatevisibleMapRectshowsCompassshowsScaleshowsTrafficUIAccessibilityContentSizeCategoryImageAdjusting (conformed to by UIButton, UIImageView)adjustsImageSizeForAccessibilityContentSizeCategoryUIApplicationalternateIconNamesupportsAlternateIconsUIBarPositioning (conformed to by UINavigationBar, UISearchBar, UIToolbar)barPositionUICollectionViewdragInteractionEnabledhasUncommittedUpdatesreorderingCadenceUIContentSizeCategoryAdjusting (conformed to by UITextField, UITextLabel, UITextView)adjustsFontForContentSizeCategoryUIImageViewmasksFocusEffectToContentsUIScreenmaximumFramesPerSecondUISegmentedControlspringLoadedUIScrollViewcontentInsetAdjustmentBehavioradjustedContentInsetindexDisplayModeUISpringLoadedInteractionSupporting (conformed to by UIButton, UISegmentedControl, UICollectionView)isSpringLoadedUITableViewseparatorInsetReferenceinsetsContentViewsToSafeAreaUITextDraggable (conformed to by UITextField, UITextView)textDragActivetextDropActivetextDragOptionsUITextInputTraits (conformed to by UISearchBar, UITextField, UITextView)smartQuotesTypesmartDashesTypesmartInsertDeleteTypeUIViewaccessibilityContainerTypeaccessibilityIgnoresInvertColorsdirectionalLayoutMarginsinsetsLayoutMarginsFromSafeAreasafeAreaInsetsWe’ve also improved a couple of the property inspectors:Bit mask options are now presented as checkboxes for types such as UIViewAutoresizing.An improved representation for CGAffineTransform properties.I hope you enjoy the improvements we’ve made! If there are any additional properties that you’d like to see us support, please start a discussion about it in our support forum.Minimum System RequirementsmacOS 10.11iOS 8tvOS 9Xcode 7.3SupportPlease report any problems you experience or give us feedback from within Reveal (see “Help → Submit Feedback”), or via our support forum.Tony ArnoldDeveloper"
