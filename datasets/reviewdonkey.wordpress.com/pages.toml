["https://reviewdonkey.wordpress.com/2016/12"]
title = "December | 2016 | The London Lark!"
description = "My personal recommendations of things to do and see in London"
full_description = "Red (dir. Robert Schwentke) 2010 December 1, 2016December 1, 2016 nicknicklambert Film Review 2010s, action, Bruce Willis, cinema, comedy, film, Helen Mirren, hollywood, John Malkovich, movie, netflix Red is available on Netflix. It is an action, comedy, thriller mash-up that does not take itself too seriously. It has a very famous cast headed by Bruce Willis, Mary Louise Parker and Morgan Freeman. For me John Malkovich and Helen Mirren steal the show though with great off the wall characters, brilliantly portrayed. Right through the cast are big names and they all look like they are enjoying themselves immensely. The movie is an over-the-top version of the over-the-top 1990s action films, where it more about the guns, the explosions, the car chases and the banter than the story. The story is particularly ridiculous here and it really does not matter because it has the all of the other elements in spades. Reds is very knowing, in that it pokes fun at all the clichés of the time, while blatantly using them to its advantage. It has likeable, if a bit two dimensional, characters and the direction is clever and camp. Watch this if you want a lot of bullets, a lot of bangs and some good laughs but avoid it you want any great philosophical insights. Personally, I thoroughly enjoyed it. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed090f1ce', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Leave a comment"
