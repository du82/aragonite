["https://reviewdonkey.wordpress.com/2018/12"]
title = "December | 2018 | The London Lark!"
description = "My personal recommendations of things to do and see in London"
full_description = "Handel & Hendrix in London, Brook Street, London W1 December 28, 2018November 30, 2018 nicknicklambert Attractions 1700s, 1960s, Carnaby Street, classical, Handel, history, London, museum, music, Oxford Street, photo, photography, psychedelia, rock, tourism, tourist attractions, Tourist London, travel, west end London has a number of small and quirky museums. This one dedicated to life and works of George Frederic Handel and Jimi Hendrix is certainly an unexpected combination. Handel lived at 25 Brook Street for 36 years in the 18th Century and Hendrix lived at number 23 for short time in the 1960s. Bach’s house is decorated in the slightly austere Georgian style that was fashionable when he lived there. It does contain some beautiful musical instruments, including a wonderful harpsichord and a chamber organ. The bedroom has a four poster bed and there are some good paintings and a bust of Handel too. There are recitals held in the music room at least once a week and the staff are knowledgeable and helpful. The Hendrix flat is laid out somewhat differently. The bedroom/living room is decorated as it would have been when Hendrix and his girlfriend lived here, this is borne out by the many photos of the room published during this time. The rest of the apartment is done in a more traditional museum style, with guitars and jackets in glass cases and commemorative posters on the walls. The bedroom is interesting, the fact that it is so classically psychedelic Carnaby Street 1960s in style probably reflects the huge effect that he had on the fashion of the time. Unlike many museums in London, this one is not free unless you have a National Art Pass. It is small but it does contain a number of curious items. It is striking to compare what the height of fashion was in the centre of London two hundred years apart – and there is something apt in the fact that it doesn’t open until 11am on any day. Half an hour or forty minutes will adequately see you round this exhibition, but if you are a fan of either rock or baroque, I think there will be something here to please you. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed2498133', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Leave a comment"
