full_description = "Park Hotel Clarke Quay, Singapore December 24, 2015November 10, 2018 nicknicklambert Hotel reviewhotel, review, singapore, TOTastemaker, tourism, travel We stayed here for 4 nights. The room was compact but well laid out, so it did not feel too restricted. I particularly liked the wardrobe that could be opened from the bathroom as well as the bedroom. It was a good base from which to sightsee Singapore. It is modern and had good facilities. The bathroom and shower were great. The wifi was good quality. It has a nice pool and sunbathing area. There are many restaurants and shops close by and it is walking distance (but hot and humid, so we did get taxis sometimes!) along the river to Singapore’s must see venues. I would stay here again. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3ed517a9be', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed517a9eb', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Share this:TwitterFacebookLike Loading..."
