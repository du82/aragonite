["https://reviewdonkey.wordpress.com/2016/08"]
title = "August | 2016 | The London Lark!"
description = "My personal recommendations of things to do and see in London"
full_description = "The Royal Academy of Arts, Piccadilly, London August 24, 2016August 24, 2016 nicknicklambert Attractions, Exhibition Ai Wei Wei, art, attraction, David Hockney, Exhibition, Gallery, Kandinsky, London, review, show, Summer Exhibition, TOTastemaker, travel, west end The Royal Academy of Arts’ gallery is on Piccadilly, it is directly across the road from Fortnum & Mason. The Academy was founded in 1768 by King George III. They have many varied exhibitions throughout the year. These include single artist exhibitions, for example, Hockney and Ai Wei Wei have been on so far this year. There are also themed shows containing many different artists. “Painting the Modern Garden” included works by Kandinsky, Monet and Matisse. Next years “Revolution: Russian Art 1917-1932” will have Chagall, Rodchenko and Eisenstein among others. The highlight of their year is the Summer Exhibition, on open submission exhibition, to showcase the talent of emerging and established artists. The first one was in 1769 and it has run every one of the 248 years since. This is a huge and wide ranging exhibition usually holding over 1000 pieces, of every shape, size and medium. Most of the works are for sale differing in price from a hundred pounds to hundreds of thousands. The gallery is nominally free, but most of the exhibitions are charged, so choose what you wish to see. The Summer Exhibition is good value, although I take off the voluntary donation and only buy one list of works for the whole party, the cost of these is automatically added unless you ask for them to be removed. The Royal Academy is self funded so do as your conscience sees fit! Personally, I don’t feel too guilty as they charge 30% commission on any work sold. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed069a859', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Leave a comment"
