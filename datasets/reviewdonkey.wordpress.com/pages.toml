["https://reviewdonkey.wordpress.com/2016/07"]
title = "July | 2016 | The London Lark!"
description = "My personal recommendations of things to do and see in London"
full_description = "The Gallery, Fortnum & Mason, Piccadilly, London July 26, 2016July 26, 2016 nicknicklambert Restaurant review British, foodie, London, lunch, piccadilly, Restaurant, review, shop, shopping, TOTastemaker, tourist, travel, west end This restaurant is quite modest in terms of décor, with its unvarnished tables and plain wooden floor, which in Fortnum and Mason terms is definitely understated. I have seen this listed as a low cost restaurant, but I couldn’t say that I agree with that description. I suspect that you could get away with £25 per person if you were to choose the absolute cheapest starter and main course, but you couldn’t have a dessert or wine and you could certainly not drink tea. I noticed that tea was £8 and while I have no doubt that it is lovely tea and will come in a pretty teapot, it is hardly economical. However, the restaurant is attractive with a view over Jermyn Street out through the window and a view over the sweet displays when you look in towards the shop. Everything is very high quality, as you would expect; pretty menu, nice napkins, good cutlery and crockery. The service is excellent. The food is lovely too, the ingredients are top notch and each dish is beautifully prepared and presented. The beef was perfectly cooked and the gravy was rich and indulgent. So, although this is not somewhere to go if you are on a tight budget, it does serve a great lunch and I recommend it if you feel like a treat. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed054098f', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); 1 Comment 82 portraits and 1 still life, David Hockney, Royal Academy, 2016 London July 24, 2016 nicknicklambert Exhibition 2010s, art, David Hockney, Exhibition, London, Painting, portrait, review, Royal Academy, show, TOTastemaker, travel, west end This exhibition is like a scientific experiment into the nature of portrait painting. All the portraits are exactly the same size and shape. They are all full body portraits of a subject sitting in the same, yellow cushioned, wooden chair. They all have roughly the same, green and blue, background and each one was painted over the course of 3 days. They are all very recent – some only painted in February and March this year. There are 83 paintings crammed together in 3 small rooms, the walls painted in a matt magenta. A couple of people are pictured twice and one person three times over the course of the exhibition. The individual portraits themselves are very good; Hockney is a fine portrait artist, but this is a single piece of work and it is seeing the whole exhibition as a unit that transforms this into an exceptional show. The uniformity of the portraits in terms of size, colour, and time, makes one notice the differences between them; the pose, the clothes, the gaze. I don’t think of it as 83 individual pictures, I see it as one portrait of 83 individual sittings. This is David Hockney at his best; confident, relaxed, colourful, witty and experimental. I left very happy. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3ed0542a1a', { sectionId: '370373', format: 'inread' }); }); 4 Comments"
