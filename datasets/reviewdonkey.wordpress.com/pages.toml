title = "The Hill Club, Nuwara Eliya, Sri Lanka | The London Lark!"
description = "The hotel was built over a hundred years ago and even today is run to give you the experience of how it was to stay in smart hotels in days gone by. It does have modern conveniences, the bathroom and shower was hot and efficient, the wifi worked well, and there is TVs and DVD players…"
full_description = "The Hill Club, Nuwara Eliya, Sri Lanka December 10, 2015January 25, 2017 nicknicklambert Hotel reviewhotel, nuwara eliya, review, sri lanka, TOTastemaker, tourism, travel The hotel was built over a hundred years ago and even today is run to give you the experience of how it was to stay in smart hotels in days gone by. It does have modern conveniences, the bathroom and shower was hot and efficient, the wifi worked well, and there is TVs and DVD players in the room. The overall experience of the hotel, right from turning in through the entrance gates is that of arriving at a colonial country house in days of yore. You are greeted in reception, told of the dress options for dinner, shown to your room – past the billiard rooms and magazine and book filled drawing room and library. When we arrived back in our room from dinner there was even a hot water bottle in our bed! Don’t come here if you want a sleek modern 21st century hotel, but if you would like a short break to step back in time, the Hill Club will give you an experience that will be difficult to match anywhere else. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3ed4a96c0f', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed4a96c4f', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Share this:TwitterFacebookLike Loading... Daal says: January 25, 2017 at 8:05 pm a hot water bottle! wow – indeed a wonderful step back in time 🙂 LikeLiked by 2 people Reply"
