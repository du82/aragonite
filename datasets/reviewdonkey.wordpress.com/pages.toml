title = "September | 2018 | The London Lark!"
description = "My personal recommendations of things to do and see in London"
full_description = "Pinter 2, Pinter at the Pinter Season, Pinter Theatre, London WC1 September 28, 2018September 26, 2018 nicknicklambert Theatre review 1960s, act, comedy, dark, David Suchet, drama, Harold Pinter, Hayley Squires, Jamie Lloyd, John MacMillan, London, Pinter, Pinter Theatre, play, review, revival, Russell Tovey, show, theatre, TOTastemaker, Tourist London, travel, TV, west end In December 2018 it will be 10 years since the death of Harold Pinter. In celebration of his legacy, the Jamie Lloyd Company is producing a season of all 19 of his one act plays at the Pinter Theatre. There will be 7 different programmes each containing either 2, 3 or 4 of his pieces. The cast list for the season has to be seen to be believed, stellar is no over-estimate of their quality. Pinter 2 contains two plays, The Lovers and The Collection, both comedies and both written in the early 1960s. The Lovers has John MacMillan, Hayley Squires and Russell Tovey. The Collection has these three and David Suchet. The Lovers is a one room play set over a couple of days in the living room of a married couple. The dialogue is, in true Pinter fashion, bright and stilted. The set and conversation are pastiche early TV sitcom. This works really well, it makes the subject matter funnier, darker and pinpoints it in time perfectly. John MacMillan and Hayley Squires are the husband and wife, Richard and Sarah. Their comic timing is impeccable. The piece lasts about 50 minutes, it starts off light an funny. The story is inventive and the writing witty. In short, this is classic Pinter done well. The Collection is a four hander, this time about 2 couples, set in 2 living rooms. This one is more sinister, right from the start. It is still very funny though. David Suchet and Russell Tovey, play Harry and Bill, the other couple are Stella and James, played by Hayley Squires and John MacMillan. Although there is nothing explicit anywhere in this play, it must have been quite shocking when it was first performed in 1961, and I can imagine that the censor would have taken an interest in how it was produced. It is beautifully written, in that, there is nothing overt in the manner of their relationships, however we are in no doubt as to what is going on. For it to work this well, the actors have to be well attuned to the writing. All four of them are wonderful. David Suchet gives an acting masterclass in this play, he knows perfectly when to be larger than life and when to rein it in. Russell Tovey too, gave a nicely nuanced performance delivering funny double-entendres with an ominous undertone. The set is simple and clever, spot lit areas move us from one scene to another. Jamie Lloyd directs both plays sympathetically, he allows the writing and acting to shine. This play is also just about an hour long. I am beginning to think this might be Pinter’s perfect length. This pair of plays are pure joy to watch and now I am left with the quandary of how to get hold of tickets for the other 6 in the season. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed2097640', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); 3 Comments"
