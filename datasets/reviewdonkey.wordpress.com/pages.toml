["https://reviewdonkey.wordpress.com/2017/02"]
title = "February | 2017 | The London Lark!"
description = "My personal recommendations of things to do and see in London"
full_description = "Pride and Prejudice, Jane Austen, 1813 February 26, 2017 nicknicklambert Books 1700s, 1800s, book, comedy, England, English Heritage, historical, Jane Austen, literature, novel, romantic, story “It is a truth universally acknowledged, that a man in possession of a good fortune must be in want of a wife” is probably the most famous opening line to a novel in the whole of the English language. Pride and Prejudice is one of the most loved books as well, it recently came second in a BBC poll of Britain’s best loved books and first in a major Australian poll of theirs. It was the second of Jane Austen’s novels to be completed and it is even wittier than Sense and Sensibility, her first. Jane Austen gives a great idea of what it was like to be middle class in England in the late 18th century. She manages to portray the hopes and aspirations of the time, while gently poking fun at them. She has a fantastic talent for writing characters and, even though every one of them is slightly caricatured, we care about them despite their faults. She has a wonderful art of showing how people fool themselves into believing what they wish to believe, and this has a timeless quality, just as true today as it was over 300 years ago. First and foremost, Pride and Prejudice is a romantic novel and there are 4 wonderfully different romances going on here, from the quite inappropriate, through the mildly shocking, to the wildly romantic and we have insight, as it also a comedy of formal manners, into how polite society looks upon them all. The language is relatively concise, less of the longwinded descriptive prose that was fashionable at the time and more of the pithy epigram. It is easy to read, the story pulls you along, each chapter leaves you wanting to know what will happen next. The ending is wonderful and I’m sure this novel is at least partly responsible for the popularity of costume drama even today. There are many good reasons why this is still one the most popular books written in English and, if you wish to become acquainted with classic English Literature, there is no better place to start. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed0b83a51', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); 7 Comments"
