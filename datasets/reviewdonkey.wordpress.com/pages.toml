["https://reviewdonkey.wordpress.com/2018/03"]
title = "March | 2018 | The London Lark!"
description = "My personal recommendations of things to do and see in London"
full_description = "Fanny and Alexander, The Old Vic, London SE1 March 6, 2018March 7, 2018 nicknicklambert Theatre review acting, art, Bergman, London, Old Vic, Penelope Wilton, show, theatre, TOTastemaker, west end Fanny and Alexander is a play to luxuriate in. Sit back, relax – and let three and a half hours of rich storyline, beautifully performed, draw you away into another world. Don’t feel guilty about it, for – as the moral of this tale has it – it is good for the soul to give in to pure pleasure occasionally. The acting in this show is a wonder to behold, it is full of larger than life characters, but there is never a hint of pantomime or showboating. The play (and the audience too, on the day I attended) is crammed with the best actors that London has to offer. Penelope Wilton is amazing as the matriarch with a past, holding the family together. Jonathan Slinger is excellent as a slightly sleazy but unapologetic sybarite. Kevin Doyle brings out the best (and worst) in the ascetic bishop. Michael Pennington is fabulous as Isaac, the puppet master bringing the action together, seemingly from the periphery, but not as detached as he appears. Guillermo Bedward played Alexander in the show I watched and he was very good, both funny and serious. Much of this play is set around various dinner tables, often accompanied by a list of the food on the menu. Fanny and Alexander itself is a feast of all the best that London theatre has to offer. You will be transported, indulged and you can wallow in an evening of rich extravagant entertainment. The set is simple but clear, I really liked the austerity of the room in the second act. The choreography is clever, just organising the many scene changes with such a large cast must have taken careful organising. It was a pleasure to watch great theatre unfold before your very eyes. I loved this show and the time flew, it was one of the most rewarding afternoons that I have ever wasted! __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed19eb155', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); 2 Comments"
