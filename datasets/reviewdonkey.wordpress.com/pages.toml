["https://reviewdonkey.wordpress.com/2018/05"]
title = "May | 2018 | The London Lark!"
description = "My personal recommendations of things to do and see in London"
full_description = "Circolombia, Underbelly Festival, Southbank, London May 31, 2018May 31, 2018 nicknicklambert Theatre review circus, Colombia, concert, London, music, performance, review, show, South Bank, South London, theatre, tourist attractions, Tourist London, travel, Underbelly Festival This photo is courtesy of @tcspr. Let’s start with the Underbelly Festival itself. Over the past 10 years this has become a symbol of summer on the Southbank. Each year it seems to get bigger and last longer. It started as an event around a giant inflatable purple cow in a coach park on Belvedere Road and used to be called Udderbelly. Now the cow appears to have gone (surely I didn’t miss it?!) but it has two covered performance spaces, at least four bars, street food stalls, plenty of outdoor seating and it lasts half the year – from early April until late September. The shows consist of comedy, circus, music and cabaret, usually with a couple of silent discos thrown in through the season. The content varies from full on family entertainment to risqué burlesque. The tickets are generally pretty cheap for central London although many of the shows get booked up very quickly. You can just go in to use the bars and seating for free though, so its a nice place to meet friends even if you are not seeing a show – think Box Park without the claustrophobia of the box! Circolombia are a fourteen strong circus/dance/music troupe from Colombia and the show they present is part concert, part circus. They sing, they dance, they rap and they display awesome tumbling skills and wonderful aerial work. It all works very well together and you can see why they have built a big international reputation from their global tours. The music enhances the atmosphere for the circus work and you can feel the tension rise when the place quietens for a particularly daring routine. The routines are jaw dropping. The tumbling skills are immense, from rolling under and over a see-saw as it rocks, to throwing a performer onto the shoulders of another person who is already balanced on the shoulders of a third. There is one where one performer does acrobatics inside a circular frame, while that frame is balanced on the forehead of a man below. The aerial feats are equally amazing, varying from solo high rope tumbling to double acrobatics with both people suspended by just a rope around the neck of one of them. At one point a performer is lifted high into the air by a ribbon held in his teeth, the person lifting him is suspended by her legs and carrying that ribbon by her teeth. One cannot help but be moved by both their strength and their trust. The show is short, at only an hour long, and the quality is of the highest order, there is no filler here, there were audible gasps from the audience throughout the show. I hope the acts are not actually as risky as they make them appear, because there is a sense of jeopardy, watching them in such a small space, you are aware that these are real people, taking real risks and this adds to the intensity of the performance. Circolombia at the Underbelly Festival is a fantastic, exciting evening out and they have a number of dates here before moving on to the Edinburgh Festival in August. If you are unable to catch them here – or there, I urge you to look out for them, in case they come to a venue near you. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed1c82d76', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); 4 Comments"
