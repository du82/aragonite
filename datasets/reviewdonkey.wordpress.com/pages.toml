["https://reviewdonkey.wordpress.com/2017/05"]
title = "May | 2017 | The London Lark!"
description = "My personal recommendations of things to do and see in London"
full_description = "City of Glass, Lyric Hammersmith, London May 20, 2017 nicknicklambert Theatre review 59 Productions, drama, Hammersmith, London, Lyric, off west end, play, review, show, theatre, TOTastemaker City of Glass gets you into the theatre by pretending to be a type of film noir story, but after you have been watching for about ten minutes, you realise that it is attempting to be something deeper and more challenging. This is a problem, because when you go in expecting a nice murder mystery, you may not be in the right frame of mind to consider the slipperiness of language and people or how the slow descent into madness might feel. This is a stage production of a 1980s book and, perhaps, it is easier to follow if you have read this first; however, I found the dialogue too oblique, and the way the characters morphed into each other was confusing. I felt like each person was speaking in a vacuum. I did not feel empathy towards any of them or from any of them towards other characters in the play. This was a shame because the set design, direction and cinematography was among the best I have seen on a theatre stage. I loved the way the same stage moved between places and times so seamlessly, and I enjoyed the way the changing set was able to propel the story onwards all by itself at times. Although I don’t feel able to recommend this particular show wholeheartedly; when 59 Productions pick a less tortuous and more coherent story to put on, I think they have the potential to deliver an amazing show. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed10ec294', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); 4 Comments City of Glass gets you into the theatre by pretending to be a type of film noir story, but after you have been watching for about ten minutes, you realise that it is attempting to be something deeper and more challenging. This is a problem, because when you go in expecting a nice murder mystery, you may not be in the right frame of mind to consider the slipperiness of language and people or how the slow descent into madness might feel. This is a stage production of a 1980s book and, perhaps, it is easier to follow if you have read this first; however, I found the dialogue too oblique, and the way the characters morphed into each other was confusing. I felt like each person was speaking in a vacuum. I did not feel empathy towards any of them or from any of them towards other characters in the play. This was a shame because the set design, direction and cinematography was among the best I have seen on a theatre stage. I loved the way the same stage moved between places and times so seamlessly, and I enjoyed the way the changing set was able to propel the story onwards all by itself at times. Although I don’t feel able to recommend this particular show wholeheartedly; when 59 Productions pick a less tortuous and more coherent story to put on, I think they have the potential to deliver an amazing show."
