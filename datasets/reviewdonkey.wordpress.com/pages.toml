["https://reviewdonkey.wordpress.com/2018/04"]
title = "April | 2018 | The London Lark!"
description = "My personal recommendations of things to do and see in London"
full_description = "The Prudes, Jerwood Theatre Upstairs, Royal Court, Sloane Square, London SW1 April 30, 2018April 30, 2018 nicknicklambert Theatre review #metoo, act, Jerwood, London, off west end, play, Royal Court, sexual politics, show, theatre, TOTastemaker, Tourist London, travel, west end The Jerwood Theatre Upstairs holds less than 100 people and every seat has a good view of the stage. It is a small intimate theatre, although perhaps not intimate enough for the act that Jimmy and Jess assure us that they intend to carry out on stage during the play this evening. The set is pink, soft and fluffy, apart from the “Blind Date” style tall stools. Indeed, if Channel 5 were planning to have a competitive sex therapy show, they could come here for ideas. The Prudes is a two hander about, Jess and Jimmy, a couple who have been together for nearly 10 years but who have not had sex for over a year. They are worried about the effect that this is having on their relationship and have come to the decision that they only thing they can do prevent their breakup is to have sex in front of us on stage tonight. We are not told how come they have reached this conclusion, but we are here now, let’s run with it. What follows is a discussion about sexual politics, and how the #metoo movement has changed how we look at sex and power in sex. Jonjo O’Neill and Sophie Russell are excellent as Jimmy and Jess, they interact with the audience, they ask for affirmation of their most embarrassing confessions, they are funny and likeable and we can feel their warmth for each other through their difficulties. The play is witty, it certainly captures the zeitgeist and it poses many questions that are brought to mind by the sexual harassment cases that have been in the news over the past months. I think we are still too close to the events to have a good perspective on how they will change our attitudes, and writer Anthony Neilson doesn’t even attempt to look for answers. This leads to a play that is enjoyable to watch but lacks a little punch in the consummation. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed1b21986', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Leave a comment"
