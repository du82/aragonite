["https://reviewdonkey.wordpress.com/2017/03"]
title = "March | 2017 | The London Lark!"
description = "My personal recommendations of things to do and see in London"
full_description = "Tower Block (dir. James Nunn, Ronnie Thompson) 2012 March 30, 2017April 4, 2017 nicknicklambert Film Review British, cinema, film, horror, movie, review, Russell Tovey, Sheridan Smith, thriller, TV This is a no nonsense, horror/thriller movie. It is set on the top floor of a tower block that is about to be demolished. It is a British film and has an excellent British cast. It moves along exactly as you would expect, but the action is taut and interaction between characters manage to keep good tension going throughout he film. Sheridan Smith, Russell Tovey, Ralph Brown and Jack O’Connell are all very good as the resourceful tower block inhabitants attempting to escape their situation, while quarrelling amongst themselves. The set is excellent, the block is scuzzy, the area urban, the setting is as bleak as the position the tenants find themselves in. The characters are flawed, but real, and there is not much pretense of politeness between them. The script is good and we grow to know, even if we don’t necessarily like, the protagonists. We want them succeed and applaud their increasingly desperate ingenuity. This type of film generally follows a set narrative arc and the denouement is much as you would expect. There aren’t many surprises here, but it is a likeable film and very good at what it does. Recommended. <a href=”https://www.bloglovin.com/blog/18829065/?claim=xcqdqsv9rnx”>Follow my blog with Bloglovin</a> __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed0cdb945', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Leave a comment The Nice Guys (dir. Shane Black) 2016 March 28, 2017March 28, 2017 nicknicklambert Film Review 1970s, cinema, comedy, film, movie, music, netflix, review, Russell Crowe, Ryan Gosling This is a curate’s egg of a film – good in parts. It’s sets out to be a pastiche of a corny 1970s Blaxploitation movie, and it succeeds almost too well for its own good. The plot is very ’70s, a light, far fetched, political conspiracy theory. The characters are caricatures. Ryan Gosling as Holland March is quite knowing about it and carries it off very well, we get to like him and he is actually very funny. Russell Crowe seems to be just walking through the film saying his lines, so his character is two dimensional. Angourie Rice is great as Holland’s daughter and also has some of the best lines of the show. This movie contains violence, sex references, nudity, bad language and drug use; all gratuitous, all characteristic of the time. Not so funny in itself but funny because in the 70s they were only recently able to put these into films, so they did, even if it was unnecessary. The humour is broad, bordering on slapstick, but it works, mostly The sets are perfect and costumes are right on. I particularly enjoyed the soundtrack, apparently some of the songs were too late for the time in which it was set, but they felt right to me. On balance, Shane Black has done an excellent job directing “The Nice Guys” in that, from slight material, he has made a little go a long way. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3ed0cdd9ba', { sectionId: '370373', format: 'inread' }); }); 2 Comments"
