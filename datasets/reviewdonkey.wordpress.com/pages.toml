["https://reviewdonkey.wordpress.com/2019/02"]
title = "February | 2019 | The London Lark!"
description = "My personal recommendations of things to do and see in London"
full_description = "The First Modern Man, Hen & Chickens Theatre, London N1 February 25, 2019February 25, 2019 nicknicklambert Theatre review 1500s, actor, biography, drama, historical, Islington, London, Michel de Montaigne, North London, philosophy, play, theatre Michel de Montaigne is an interesting figure, and this is a well written and beautifully delivered play about the 16th Century French essayist. Much like the essays of the man himself, it is not easy to define. It is not quite a biography because it really only touches incidentally on his life and times, it is an imagined hour long conversation with the man, where you are introduced to a selection of his ideas and preoccupations in a seemingly disordered manner. However, this is where the cleverness of the writing comes in, the rambling way in which the conversation takes place, is very similar in composition to the way his essays were actually written, with detours, diversions and asides taking you around many different ideas before bringing you back to the original, titular point of the piece. In this play, it serves to capture what you could think of as the personality of de Montaigne. The Hen & Chickens theatre is a good venue to see this play, because it is intimate enough to give the feeling of a personal conversation. Jonathan Hansler takes full advantage and engages members of the audience individually – he makes Michel de Montagne chatty and affable. The author, Michael Barry, and actor have worked together well, both obviously care for the man they are displaying onstage, and their combination of talents makes him a likeable figure full of interesting concepts, some deep and insightful, some weird, but all entertaining in a quirky and engaging way. I particularly enjoyed this play, possibly helped by knowing a little of his work before I attended. The quality of the writing and the delivery of the words ensure that there is much to enjoy here whether you have heard of Michel de Montaigne or not. The First Modern Man has that elusive and winning blend, it is a play that manages to be both enjoyable and informative. Recommended. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed2746590', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Leave a comment"
