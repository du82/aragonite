["https://reviewdonkey.wordpress.com/2017/09"]
title = "September | 2017 | The London Lark!"
description = "My personal recommendations of things to do and see in London"
full_description = "Browns, Cardinal Walk, London Victoria September 27, 2017September 27, 2017 nicknicklambert Restaurant review bar, Central London, dinner, eating out, food, foodie, London, Restaurant, review, tourism, travel, Victoria Victoria Station and its surroundings have changed dramatically in the last couple of years. It is now full of pedestrian areas and buildings made of glass and steel. Cardinal walk is probably one of the oldest of these but still fits nicely into this environment. The décor and the ambience of Browns matches this well too, it is set over two floors, all glass. The restaurant is on the first floor so if you get a table by the window you can watch the world go by as you eat. Their Pinot Grigio is good, although at over £8 for a large glass, it needs to be. They have a reasonable selection of beers and the cocktail list looks impressive although we did not try any. The service was good, our waiter was friendly and helpful, but he wasn’t really that busy, so maybe he should have picked up on our indifferent response when he enquired how the food was. The thing that let them down was the food. The fish pie was ok, but I expect better than that when I pay over £15 for it. The only way to tell the difference between the different fish was texture, the overall effect was bland and the potato topping was runny. The steak sandwich was also all right, no butter on the bread – just mayo, but the chips were only slightly hotter than luke warm and they didn’t have any English mustard. The side order of onion rings contained four rings! I wanted to like this place because I have enjoyed other restaurants in this chain in the past. With such a large choice of places to eat around Victoria now, average food will not get repeat business. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed161324e', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); 5 Comments"
