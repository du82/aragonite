full_description = "Meriton Serviced Apartments, Campbell Street, Sydney December 31, 2015November 10, 2018 nicknicklambert Hotel review apartment, australia, CBD, hotel, Meriton, review, sydney, TOTastemaker, travel Sydney hotels are pretty pricey if you choose not to go down the backpacker route. However, if you are staying more than a single night, serviced apartments offer a great alternative. Meriton do them well. We stayed 5 nights in these ones in Campbell Street and were impressed. The position was great; just on the edge of Chinatown and the CBD. It is possible to walk almost anywhere in Central Sydney from here and if you don’t like to walk, it is only a couple of minutes from Central Station. The rooms are huge, the bathrooms modern, and the water hot and plentiful. There is loads of cupboard space and the aircon is efficient. There was a washing machine and dryer in the room too, they even supplied a little tube of washing powder! The 1GB limit on wifi use per day was enough even for our data hungry devices. We shall be looking up Meriton Serviced Apartments for future stays in Australian cities. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ecfc8804c', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Leave a comment Park Hotel Clarke Quay, Singapore December 24, 2015November 10, 2018 nicknicklambert Hotel review hotel, review, singapore, TOTastemaker, tourism, travel We stayed here for 4 nights. The room was compact but well laid out, so it did not feel too restricted. I particularly liked the wardrobe that could be opened from the bathroom as well as the bedroom. It was a good base from which to sightsee Singapore. It is modern and had good facilities. The bathroom and shower were great. The wifi was good quality. It has a nice pool and sunbathing area. There are many restaurants and shops close by and it is walking distance (but hot and humid, so we did get taxis sometimes!) along the river to Singapore’s must see venues. I would stay here again. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3ecfc88eae', { sectionId: '370373', format: 'inread' }); }); Leave a comment"
