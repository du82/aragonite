title = "Campbell House Hotel, Georgetown, Penang | The London Lark!"
description = "This hotel was recently chosen as a global winner in the Luxury Guest House Awards, and it easy to see why. We loved the attention to detail and the friendly staff made our stay personal and memorable. We enjoyed the theatricality of our luggage being lifted to our room by rope and little touches like a…"
full_description = "Campbell House Hotel, Georgetown, Penang December 13, 2015April 16, 2016 nicknicklambert Hotel reviewCampbellHouse, Georgetown, hotel, Malaysia, Penang, photography, review, TOTastemaker, travel This hotel was recently chosen as a global winner in the Luxury Guest House Awards, and it easy to see why. We loved the attention to detail and the friendly staff made our stay personal and memorable. We enjoyed the theatricality of our luggage being lifted to our room by rope and little touches like a surprise desert being left in our fridge or on our table at night made our stay exceptional. The rooms that we saw were all lovingly restored and the communal areas are also beautiful. The bathrooms are lovely and the showers hot. The wifi in the room was fast. Georgetown is famous for its street food and restaurants and this is close to many of them. Its in-house Italian restaurant is also great, as was the breakfast. All in all, we had a perfect 4 days in Penang and Campbell House greatly contributed to this __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3ed4f19fcb', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed4f1a001', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Share this:TwitterFacebookLike Loading... Moritz says: December 14, 2015 at 11:23 pm Looks like a very nice property. Thanks for the little review 🙂 LikeLike Reply"
