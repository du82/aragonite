title = "April | 2017 | The London Lark!"
description = "My personal recommendations of things to do and see in London"
full_description = "Bar Americain, Sherwood Street, London April 30, 2017 nicknicklambert Bar Review 1940s, architecture, Art Deco, bar, cocktail, drink, foodie, hidden London, London, photography, piccadilly, Restaurant, review, speakeasy, theatre, tourism, travel, west end This is a bar hidden beneath Piccadilly Circus. It is through a quite unassuming entrance in Sherwood Street. There is a café with some tables outside called Zedel, if you go through this café, down two flights of stairs, you will come to a surprising bright French looking foyer with a cloakroom, a French restaurant called Brasserie Zedel and Bar Americain. It is a beautiful, low lit, late art deco decorated room. It has lots of dark wood, the marquetry columns are particularly attractive. It has light jazz playing in the background, just audible but not intrusive. The atmosphere is that of a set of a 1940s film noir. The waiters are in suits or formal white jackets. The cocktails are very good, the list is classic. The martini was perfect and the whiskey sour was both tart and had a nice kick. They have a good wine list and also a nice selection served by the glass. The tariffs aren’t low, but the price is around what you would expect for somewhere this attractive so central and it is good value for the experience that you receive. Its the perfect place to meet if you are eating in Brasserie Zedel as the waiters will come to fetch you and carry your drinks when your table is ready. It is also very handy to meet if you are attending the theatre in Shaftsbury Avenue or Haymarket as it within a three minute walk from either. A beautiful quiet cocktail bar in a very central position, a lovely place to meet for a quiet catch up or for a quick drink before or after an evening out. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed0f98dc6', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); 3 Comments"
