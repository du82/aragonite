full_description = "Great London Songs December 16, 2022November 30, 2022 nicknicklambert songs2000s, band, Biblecode Sundays, Celtic, Celtic Rock, folk, Ireland, Irish, live music, London, London lists, London Songs, music, pub, rock, Ronan MacManus, song, spotify 13. Maybe It’s because I’m an Irish Londoner – Biblecode Sundays This is a great London song for those of us who grew up in London with Irish parents, or those who have moved from Ireland to London. It celebrates both London and Irish culture. This song was released in 2007 by the Celtic Rock band The BibleCode Sundays. They are still together today and still play live around London. If you get the chance, you should go see them or their lead singer from the time this was released, Ronan MacManus. They both do great sets of rock/folk/Irish songs in pubs and small clubs. In terms of local live gigs in London, it is hard to get better than Ronan or the Biblecodes. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3ed46c4ff2', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed46c502d', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Share this:TwitterFacebookLike Loading... bronlima says: December 16, 2022 at 4:33 pm Still enjoying newly discovered Strormzy, thanks to your posts. LikeLiked by 1 person Reply nicknicklambert says: December 16, 2022 at 6:31 pm Pleased you like him, his lyrics are good aren’t they? LikeLiked by 1 person Reply"
