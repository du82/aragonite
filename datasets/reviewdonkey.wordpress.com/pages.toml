full_description = "Streatham Common, London, SW16 July 23, 2017 nicknicklambert Days Out, gardens attraction, Capital Ring, Day out, garden, London, park, South London, Streatham, tourist, Tourist London, travel, walk Streatham Common is an attractive green space in South London. The grass on the Northern and Western section is maintained and dotted with trees. It looks very pretty sloping upwards towards the rookery from the A23. On summer weekends it is quite busy with people, flying kites, having picnics or just chilling out. This area of the park often has events running when the weather is warm. An interesting one booked for September is “A Midsummer Night’s Dream” performed by the world first cycling theatre company! The eastern side is left in a more natural state. It has been designated a local nature reserve and it has many oak trees and some beautiful old cedars. Where the western part meets the east there is beautiful formal garden called The Rookery. A mineral spring was discovered here in the 1650s and was visited by royalty to take the waters. Streatham was a very fashionable out of town location in the 19th century and the Rookery Gardens are kept as they would have been in those days. There is a rockery with a pond, lovely herbaceous borders, and it has an ornamental stream running through it. The Rookery Café is outside the wall of The Rookery just on the border between the maintained and more natural parts of the common. It is a well run café, serving hot and cold food. There are seats outside with big views to the west and south. The Common is surprisingly large – over two kilometres along the perimeter from its northwestern corner to the northeastern one. As you head farther east, the park becomes part of the borough of Croydon and is known as Norwood Grove, although historically, it has always been part of the Great Streatham Common. There is a nice 19th century house here, inside the park, Norwood Grove House, although it is known locally as the White House. This also has nicely laid out gardens and pretty, if urban, views out over Croydon. Streatham Common is a well used park, surrounded on all sides by houses. There are joggers, dog walkers, parents with buggies, yet it is big enough to avoid feeling crowded. It is on the Capital Ring, which is a 120 kilometre walk around London, broken up into 15 smaller sections. This is a surprisingly green and traffic light walk for such a large metropolis. The park itself is a varied and interesting area with lots of different types of scenery, I would say that it is certainly worth a visit if you are in South London on a sunny day. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed13c4311', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); 11 Comments"
