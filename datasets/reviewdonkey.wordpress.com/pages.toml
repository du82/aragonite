["https://reviewdonkey.wordpress.com/2017/11"]
title = "November | 2017 | The London Lark!"
description = "My personal recommendations of things to do and see in London"
full_description = "Everybody’s Talking about Jamie, Apollo Theatre, London November 25, 2017 nicknicklambert Theatre review Apollo Theatre, drag, drama, LGBT, LGBTQ+, London, musical, political, religion, show, songs, theatre, Tourist London, travel, west end All the publicity that goes with “Everybody’s talking about Jamie” mentions what an uplifting feel good story line it has, and that it taps into the current zeitgeist, and to be fair they are right but, really it has so much more than just that. The songs are brilliant, “It means beautiful” will surely win an award for best new song in a musical. “He’s my boy”, “Work of Art” and “If I met myself again” are also wonderful, I think Dan Gillespie Sells is going to be a huge success as a songwriter for musicals. The lyrics are lovely too and are written by Tom Macrae, so perhaps this is a new partnership to look out for. The whole cast is great. Obviously John McCrea is excellent as Jamie, a strong voice and a big stage presence. There are also outstanding performances from Josie Walker as his Mum, who has two big songs and a spectacular voice with which to deliver them, and from Lucie Shorthouse, who has an endearing part as his BFF, Pritti. I enjoyed Phil Nichol’s portrayal of Hugo Battersby too. I also really liked the choreography, it is vibrant and up to date, break dancing with a hint of Justin Beiber video. The set design is good as well, a great mixture of simple, clever and efficient. She show finishes very well, the audience loved it and left the theatre wanting more. I thoroughly enjoyed this show and I hope it is a huge success! __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed18c4701', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); 5 Comments Antigone, Greenwich Theatre, London November 6, 2017 nicknicklambert Theatre review act, Ancient Greek, Antigone, AOD, classic, drama, Greek tragedy, Greenwich, historical, off west end, philosophy, play, sci-fi, Sophocles, South London, theatre The Actors of Dionysus are touring the UK at the moment with this, a sci-fi tinged modern adaptation of Sophocles’ two and a half thousand year old play. Antigone, a Greek tragedy, has never really been an easy watch, but this adaptation has definitely made it more accessible. Christopher Adams has written, a well thought out, updating of the play. I enjoyed the conceit of making the chorus of the original into the hive mind of linked computers. I thought the idea of making the soul into a chip that needed to be removed and uploaded worked well and gave us a good insight into Antigone’s motivation and into Creon’s harshness at refusing to allow it. The stage setting is interesting, I guess touring made the set need to be as simple as it was, and I liked the current touches, the surveillance drones are particularly clever and fitted very well with the story and setting. The simplicity of the set did emphasise the universal themes of the play. I found the acting good and I enjoyed the way each character pushed their agenda. I particularly liked the change in Creon from harsh dictator to broken soul. The well intentioned but misguided leader delivering tough love for the good of the populace can be a hard sell at times, but he brought it off well. It is a Greek tragedy, so we cannot expect a happy or wholesome outcome, however it is a tribute to Antigone’s universal themes that it is still being performed over two millennia after it was written and this is as enjoyable and accessible a production as you are likely to see anywhere. Thoroughly recommended.the __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3ed18c6a69', { sectionId: '370373', format: 'inread' }); }); 1 Comment"
