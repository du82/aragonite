["https://reviewdonkey.wordpress.com/2017/03/25/the-wild-party-the-other-palace-victoria-london"]
title = "The Wild Party, The Other Palace, Victoria, London. | The London Lark!"
description = 'Andrew Lloyd Webber has bought the theatre that used to be known as The St. James Theatre and changed its name to The Other Palace. He wishes it to become the place where writers and producers can try out and refine new work. The first show here is "The Wild Party". This musical has a lot…'
full_description = "The Wild Party, The Other Palace, Victoria, London. March 25, 2017March 24, 2017 nicknicklambert Theatre reviewAndrew Lloyd Webber, comedy, London, music, musical, off west end, play, review, show, The Other Palace, theatre Andrew Lloyd Webber has bought the theatre that used to be known as The St. James Theatre and changed its name to The Other Palace. He wishes it to become the place where writers and producers can try out and refine new work. The first show here is “The Wild Party”. This musical has a lot of good things going for it. The ensemble are fantastic, the songs are good, the comedy songs are very funny. The dancing and choreography are fast and good, the characters are interesting and flawed. For me, the music is too loud for the size of the theatre, it took me about three songs for my hearing to adjust enough to understand the lyrics. This is a shame because the lyrics that I did hear were acerbic and funny. The ending is a bit of an anti-climax, if ever a show needs an encore routine, this is one. This is such a disappointment because so much of the rest of the show is wonderful. The songs are a nice mixture of vibrant, funny and bitter. The dialogue is sharp. The choreography is dynamic and energetic. The atmosphere is decadent and sexy. The closing series of songs in the first act is amazing and if they were to somehow make this the finale of the whole show, it would run forever. It is hard to pick out individual performances, not only because everyone is very good, but also because everyone in the show has their own part to play. There is no chorus here. Frances Ruffelle and John Owen-Jones have beautiful emotive voices. Donna McKechnie and Bronte Barbe are both funny and have a great song each, showing off their range. Steven Serlin and Sebastien Torkia are a clever comedy double act. Gloria Obianyo and Genesis Lynea are excellent at joining the show together. Victoria Hamilton-Barritt arrives late and threatens to steal the show. The dancing is uniformly outstanding. This show truly is a wild party, bringing with it all that this entails. It is an exhilarating rollercoaster ride, and like all the best parties – although I may have some regrets the next day, I wouldn’t miss it for the world. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3ed0e4d9a0', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed0e4d9e8', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Share this:TwitterFacebookLike Loading..."
