title = "October | 2022 | The London Lark!"
description = "My personal recommendations of things to do and see in London"
full_description = "Great London Songs October 28, 2022October 27, 2022 nicknicklambert songs 1960s, 1970s, charts, croydon, folk, homelessness, London, music, musical, playlist, single, songs, spotify 7 Streets of London – Ralph McTell Originally released in 1969 as a track on his second album – Spiral Staircase – Ralph McTell says that the market he refers to in the song is Surrey Street Market in Croydon. As an album track it was covered by many artists, Roger Whittaker and Val Doonican among them, in the early 1970s before his record company released the song as a single in 1974, when it reached No.2 in the British chart. It was kept from being the Christmas No.1 by Lonely this Christmas by Mud. It was No.1 in Ireland and other countries. Ralph McTell is a well-respected song writer, Streets of London is his most famous song by some margin, although “Clare to Here” which he wrote in 1963, is well known in Ireland. Streets of London is a good example of the 60/70s folk revival, and I am led to believe that it is taught as poetry in some German schools, it is also one of the most covered songs in the world. One of my favorite versions is by Sinead O’Connor, the sweetness of her voice highlights the sadness of the lyrics. In 2017, it was released as a charity single as a duet with Ralph McTell and Annie Lennox with the proceeds going to Crisis, the homeless charity. The Anti-Nowhere League did a punk version in 1982, it sounds like it should be terrible, but it actually works surprisingly well as an angry punk song, with a “London Bridge is Falling Down” intro. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed2c4d14a', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); 7 Comments Capital Ring Section 3 October 25, 2022September 28, 2022 nicknicklambert walks cafe, Capital Ring, Crystal Palace, Dinosaur, hidden London, history, London, park, South London, view, walk, Walk London, walks Grove Park to Crystal Palace – section 3 – is the longest on the Capital Ring. Starting at Grove Park Station we soon reach Railway Children Walk which commemorates the fact that the author E. Nesbitt lived nearby. There was very successful British film of the book in 1970, starring Jenny Agutter, and there have been many other adaptations since it was first serialized in “The London Magazine” in 1905. 14.8km Station to Station Soon after this we arrive at Downham Woodland Walk, a narrow strip of woodland, which was once part of the Great North Wood. This itself was once part of the prehistoric forest that covered most of England, so many of the trees here are direct descendants of that forest. It does actually feel like a very old forest as you walk through it, although I guess that could be because I read about it before the walk. Great North Wood Just before you leave the wood there is a marker to let you know that you are crossing the Greenwich meridian line. Soon after, we come to Beckenham Place Park, crossing the Ravensbourne River by means of a humpbacked bridge. Legend has it that the river got its name because Roman soldiers were led to the spring at its source by a raven. This is a large park; we walk alongside a golf course and cross a railway track before we come to Beckenham Place Park Lake, which appears to be a popular spot for wild swimming. Swimmers in Beckenham Place Park Lake Up the hill from the lake is Beckenham Place Mansion. It was a fine house in its day, it is grade II listed. Now it belongs to Lewisham Council, who appear to be renovating it, although I have to say that it seems to be going on for years with little change. I have a similar picture from the 2010 walk, and it looks very much the same except that the scaffolding is in a different place on the building. Beckenham Place Mansion There is a section of residential streets before you reach a small but pretty park, Cator Park. It has two small rivers running through it, The Chaffinch and The Beck, tributaries of the Ravensbourne. It has a busy cafe, a playing field and nicely tended flower beds. Fir trees Cator Park The final section of the walk is through Crystal Palace Park. This is packed full of interest. It was built to hold The Crystal Palace, of the Great Exhibition of 1851, when it needed to be moved from Hyde Park. When it was built it was London’s most spectacular pleasure garden. It hosted firework displays, circuses, concerts and shows. It had fountains, cascades, statues, a maze and a miniature railway. The Crystal Palace itself was destroyed by fire in 1936 and was never replaced. Now it has a National Sports Centre with first class athletics and swimming facilities. Crystal Palace Dinosaurs The Dinosaur Court was built in 1854 and contained the first ever dinosaur sculptures in the world. Having spent most of the 20th Century out of favour, in 1973 they were made Grade II listed and following renovation early in the 21st Century they became Grade I listed in 2007, putting them in an exalted list with St. Paul’s Cathedral, Monument, The Bank of England and others. One of E. Nesbitt’s books, written in 1907, has a storyline where the Crystal Palace Dinosaurs come to life. Brown and Green café The Park has two very nice cafés too, both called Brown and Green, one at the Penge end of the park and one at the entrance to Crystal Palace railway station. The one at the lower end of the park was very busy with parents and children in buggies on the day I was there, but the one in the station had plenty of space and quick service. Crystal Palace station is the end of a long but satisfying walk full of interesting sights. Mural on the wall of the Park Tavern Pub near Penge East Station __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3ed2c5677a', { sectionId: '370373', format: 'inread' }); }); 3 Comments"
