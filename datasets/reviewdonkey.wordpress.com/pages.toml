["https://reviewdonkey.wordpress.com/2016/06"]
title = "June | 2016 | The London Lark!"
description = "My personal recommendations of things to do and see in London"
full_description = "Maleficent (dir. Robert Stromberg) 2014 June 27, 2016June 27, 2016 nicknicklambert Film Review 2010s, academy award, Angelina Jolie, cinema, dark, disney, drama, fairytale, fantasy, film, movie, netflix, review, TOTastemaker This movie has earned over $750million so it is a huge success by many standards and it certainly has a lot going for it. It looks spectacular – this is obviously what Disney were aiming for when they hired Robert Stromberg, whose previous experience was in special effects, as director. They took a risk by giving him the largest ever budget for a first time director and it paid off. The style of the film is individual and the worlds he created are lush and beautiful. Angelina Jolie is perfect for the part, always visually striking. As Maleficent, she is cold and polished, yet she is compassionate and composed when necessary and she makes us believe these changes in temperament. She needs to be strong as this film is all about her, every other role is almost a cameo. It was nominated for an Academy Award for Costume Design and this was deserved. It is darker than expected for a Disney film, but this adds a little depth and probably reflects the slightly older audience they were aiming for. Overall, although it does not really go any where new, it is a high quality, enjoyable Disney telling of a classic fairytale. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed03eb83f', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); 2 Comments Defiance (dir. Edward Zwick) 2008 June 26, 2016June 26, 2016 nicknicklambert Film Review 2000s, academy award, cinema, Daniel Craig, drama, film, movie, netflix, review, thriller, TOTastemaker, world war A the start of the movie we are told this is a true story. Edward Zwick is the director and he made the decision to sacrifice realism for action and character development. I am sure that this has made it more interesting and exciting to watch, for it is both of these things, but it is a Hollywood version of a true story. Defiance is an apt title given that the movie depicts a large group of Jewish refugees surviving harsh winters in the forests of Belorussia, despite the attempts of the Nazis to annihilate them. Daniel Craig, Liev Schreiber and Jamie Bell are all excellent as the brothers who led the group, and the story told is both gripping and inspiring. It was nominated for an Academy Award for the best Original Score. The script is rough and the point of view fixed, this makes some of the characters seem a little two dimensional. However, in terms of action and tension, the film works well and it held my interest right to the closing credits. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3ed03ed587', { sectionId: '370373', format: 'inread' }); }); 2 Comments"
