["https://reviewdonkey.wordpress.com/2022/12/06/great-london-songs-12"]
title = "Great London Songs | The London Lark!"
description = '''12 Lazy Sunday - Small Faces https://open.spotify.com/track/4wElJpVuDuCo2NpvCVa6a3?si=0db8638462194a6c This was originally a track on the 1968 album "Ogdens' Nut Gone Flake". The song was released as a single in April that year without the band's knowledge and reached No.2 in the UK singles chart. They weren't happy with its' release, because they felt that many other…'''
full_description = "Great London Songs December 6, 2022December 6, 2022 nicknicklambert songs1960s, 1970s, charts, London, London Playlist, London Songs, music, musical, power pop, psychedelia, Ronnie Laine, Small Faces, songs, spotify, Steve Marriott 12 Lazy Sunday – Small Faces This was originally a track on the 1968 album “Ogdens’ Nut Gone Flake”. The song was released as a single in April that year without the band’s knowledge and reached No.2 in the UK singles chart. They weren’t happy with its’ release, because they felt that many other tracks on the album better represented their musical direction, they were trying to ditch their pop image. The success of the song eventually led to Marriott leaving the band. He formed the rockier sounding Humble Pie with Peter Frampton. Frampton was another ’60s pop star looking to present a “heavier” sound in the 1970s, having had hits with “The Herd” and voted “The face of 1968” by the teen magazine “Rave. The band thought “Afterglow” would be the lead single, but although it is a good song in its own right, you can’t imagine that it would have been the big hit that Lazy Sunday was. “Gor Blimey, ‘ello Mrs. Jones – How’s yer Bert’s lumbago” Steve Marriott sings in a cod cockney accent. In 1960 he played the Artful Dodger in Lionel Bart’s “Oliver!” and this east end music hall delivery harks back to that. The song was recorded as a jokey album track, but it has clever lyrics, a unique delivery, and it remains a London psychedelic era pop classic. Cover versions include the Toy Dolls (remember the punk “Nellie the Elephant”?) on their cleverly titled CD “Orcastrated”. The Libertines used to include a version in their live set. I feel like I can hear echoes of this son in Blur’s “Parklife” too. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3ed41b79a9', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed41b79ec', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Share this:TwitterFacebookLike Loading..."
