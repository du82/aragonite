["https://reviewdonkey.wordpress.com/2016/05"]
title = "May | 2016 | The London Lark!"
description = "My personal recommendations of things to do and see in London"
full_description = "Money Monster (dir. Jodie Foster) 2016 May 31, 2016May 31, 2016 nicknicklambert Film Review cinema, film, George Clooney, hostage, Jack O'Connell, Jodie Foster, Julia Roberts, movie, review, thriller, TOTastemaker, TV Show, west end Money Monster is a gripping thriller that will keep you entertained for an hour and a half. It is a Hollywood hostage movie set in a New York television studio. It has a big name cast; George Clooney and Julia Roberts are both on top form, as an irritating TV show host and his producer. Jack O’Connell is also excellent as the hostage taker. It is directed by Jodie Foster, who does a good job subverting expectations in a genre that the audience will know well. The script and character development are fantastic, because although all the main protagonists have flawed personalities, over the course of the film, we are given an insight to their humanity and motivation. This means that we have sympathy with all of them to some degree. Money Monster is funny, surprising and knowing. It is also nicely subversive from Jodi Foster because all the men in the film are the brash, sensationalist types getting all the attention and the women are the ones who quietly get things done. Don’t go to this movie expecting insights into the world of financial markets, or the effects of the 24 hour news cycle on society. Go expecting pure light entertainment, for that is what it delivers __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed0290216', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); 3 Comments The Mothman Prophecies (dir.Mark Pellington) 2002 May 30, 2016March 20, 2017 nicknicklambert Film Review Alan Bates, film, Gere, horror, movie, mystery, netflix, review, TOTastemaker This film is supposedly based on true events that happened in Point Pleasant in 1966 and 1967. Although it is said that truth can be stranger than fiction, I have seen Disney talking animal movies that required less suspension of disbelief. I guess that this film was aimed at the part of the market that thought the X Files was a documentary. As a horror film, it misses the mark because, although the storyline is quite dark, there aren’t really any scary moments in the film. The acting is pretty good, Richard Gere, David Eigenberg and Will Patton all cope well in contending with a meandering storyline and their character’s unusual decision making. Will Patton goes from holding Richard Gere at gunpoint in the bath to trusting him, overnight, without much convincing. I’m not going to say avoid this film at all costs, it was well paced and it held my attention throughout but, for me, there are better things to watch on Netflix. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3ed0292de0', { sectionId: '370373', format: 'inread' }); }); 1 Comment"
