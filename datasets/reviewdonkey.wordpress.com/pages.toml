full_description = "The Elephas Resort, Haberana, Sri Lanka December 12, 2015January 25, 2017 nicknicklambert Hotel reviewhaberana, hotel, review, sri lanka, TOTastemaker, tourism, travel Of the 7 hotels, in which we stayed in Sri Lanka, this was the newest and the one we liked the least. It felt like an army barracks, the bathroom was bare concrete, the bed plinth was concrete, the seat outside the room was concrete. There was no wifi in the rooms and the wifi in the communal areas was intermittent. There was no hot water in the shower in the morning. The restaurant is open to outside and there were mosquitos in the evening. The food was mediocre. Be careful if booking at the weekend, they do special offers for office parties to fill the rooms – it was quite raucous on the night we spent there. We sleep well, so it did not disturb us, but worth knowing if you plan to be there on a Friday or Saturday night. It is within half an hour of Minneriya, Sigirya and Dembulla – all of which are amazing, but I do suspect there are other hotels in the vicinity which would have suited us better. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3ed4bd1f70', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed4bd1fb5', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Share this:TwitterFacebookLike Loading..."
