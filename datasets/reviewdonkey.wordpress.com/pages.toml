["https://reviewdonkey.wordpress.com/2018/06"]
title = "June | 2018 | The London Lark!"
description = "My personal recommendations of things to do and see in London"
full_description = "Pity at the Royal Court Theatre, July and August June 30, 2018June 30, 2018 nicknicklambert theatre art, culture, drama, London, off west end, offer, play, Royal Court, show, Sloane Square, special offer, theatre, theatre tickets, tickets, Time Out, TOTastemaker, travel, writing https://checkout.timeout.com/london/pity-at-royal-court-theatre-56938?cid=~affiliate~tastemaker~Nick Time Out offered me this special deal on tickets to see Pity at the Royal Court. They asked me to share the deal on my blog, as an experiment to see whether anyone clicked on the deal or if anyone takes up the offer. The play looks quite interesting and the offer seems good, so I have agreed to do it as a one off experiment. I am away on holiday in July, so I’m going close to the end of the run in August. I bought the £12 tickets because the Royal Court is small and the view is good from every seat. I hope you don’t mind this different type of post and I promise that this is a single time only, I am not suddenly going to be a site that bombards you with deals and special offers. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed1de44ef', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); 4 Comments Kiss Me Kate, Opera North, London Coliseum, London WC2 June 28, 2018June 28, 2018 nicknicklambert Theatre review 1940s, acting, Broadway, Cole Porter, Coliseum, comedy, dance, dancing, historical, literature, London, music, musical, opera, Opera North, play, Shakepeare, show, singing, songs, theatre, travel, west end Cole Porter’s 1948 musical, Kiss Me Kate is a complex show, some of its numbers are classic Broadway showtunes, while others have a light opera edge. It has complicated, full company dance routines as well as individual virtuoso displays. It also has a couple of good comedy roles that require great timing and delivery. On top of this, the Coliseum itself, has a big stage that needs a large company to fill. All in all, this is a show, in a venue, which will test every part of the company putting it on, to the fullest degree. I have to say that Opera North have passed this test with honours. The two operatic leads, Quirijn de Lang and Stephanie Corley, as Fred/Petruchio and Lilli/Kate both have splendid voices, suited to their roles. Zoe Rainey and Alan Burkitt, as Lois and Billy, carry the more standard musical numbers perfectly. Each of the four of them has at least one great song to show of their respective talent. Lois has possibly the most famous songs in “Always true to you in my fashion” and “Tom, Dick or Harry” but Kate’s “I hate men” and Petruchio’s “Where is the life that I led” are really great songs that show of their vocal abilities. The show’s biggest song, of course, “Too Darn Hot” is sung by the chorus, and the dancers, particularly Aiesha Pease and Stephane Anelli, deliver a truly show stopping performance to this number. Joseph Shovelton and John Savournin play the comedy roles of first and second Gunman. They work very well together, their interaction is excellent and they make the most of their comedy duet “Brush up your Shakespeare” – a song more full of puns than I had previously realised. The company as a whole is excellent and you realise that this is going to be a show full of movement and vigour, right from the first song of “Another Op’nin’, Another Show”. Kiss Me Kate is a big show, and this is a big full-on production of it. The costumes are bright and lavish. The choreographer has a tough job, with so many people on stage at once, however the dance routines are vivacious and have lovely shape. The set design needs ingenuity too, and is very clever at swapping from front of stage to back of house in seconds. The director, Jo Davies, has taken the bold decision not to update the show in any obvious way. At times, it felt like you were actually watching a show made in the 1940s, giving the show an interesting post-war period feel. The tap routine, in particular, had a dated, black and white movie quality, which suited the production very nicely. This is a lush and exuberant production of a distinguished show and it fully deserved the love it received from the packed audience at curtain down. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3ed1de6e32', { sectionId: '370373', format: 'inread' }); }); 2 Comments"
