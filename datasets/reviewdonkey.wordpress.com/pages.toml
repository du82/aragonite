["https://reviewdonkey.wordpress.com/2022/08"]
title = "August | 2022 | The London Lark!"
description = "My personal recommendations of things to do and see in London"
full_description = "Great London Songs August 30, 2022August 29, 2022 nicknicklambert songs cockney, dance, Ian Dury, List, London, London lists, London Songs, music, musical, show, songs, South London, Tourist London, war, WWII As I intend this blog to be a celebration of all things London. This is the first in a series of songs that I associate with London. There are many, if you have suggestions for ones that you would like included, leave a comment and I will give them a listen and look up their links to London! 1 The Lambeth Walk – originally Lupino Lane The Lambeth Walk is a song from the 1937 musical “Me and My Girl”, a musical about a working class London boy discovering that he is in line to inherit an earldom in Hampshire. Originally sung by Lupino Lane, a popular pre-war comedian, the song became a dance craze and was popular around the world, leading to covers by many of the big bands popular at the time, including Duke Ellington’s and Russ Mogan. In 1940 The Ministry of Information made a short film of Nazi goose-stepping set to the tune of the Lambeth walk. This was shown in many cinemas, before the main feature, in Allied countries and was hugely popular at the time. The stage musical was made into a film called The Lambeth Walk in 1939 and this was big hit too. The song was a genuine dance craze in Europe and America, through the Second World War. I recently found a YouTube video demonstrating how to do it. Lambeth Walk is an actual street just south of the Thames, in Lambeth near Vauxhall. It used to host a street market during the week and there used to be a pub on the corner of the street called The Lambeth Walk, but this is now closed. There are still council houses around the area and a small park called Doorstep Green, although it would be regarded as a very posh place to live now. It is where Charlie Chaplin lived as a child. Ian Dury also mentions this street in one of his songs “This is what we find”. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed29a128a', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); 2 Comments"
