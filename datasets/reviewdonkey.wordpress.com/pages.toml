["https://reviewdonkey.wordpress.com/2018/10"]
title = "October | 2018 | The London Lark!"
description = "My personal recommendations of things to do and see in London"
full_description = "Dein Perry’s Tap Dogs, The Peacock Theatre, London WC2 October 30, 2018October 27, 2018 nicknicklambert Theatre review Central London, concert, covent garden, culture, dance, entertainment, London, music, Peacock Theatre, review, show, tap, tap dance, theatre, TOTastemaker, travel, west end, World, world tour Dein Perry’s Tap Dogs was first performed twenty three years ago in Sydney and has been constantly touring the world since then. The reason for its success is that, in the words of a DIY product advertisement, “it does what it says on the tin”. The workman analogy is apt here. The dancers in this show are at pains to demonstrate that they are workmen, in work clothes and work boots, tap dancing on various parts of a construction site. They are rugged, rough and laddish as well as very talented tap dancers. This show has much in common with a rock concert and that is only partly because of how loud it is. Most of the show they operate as a group but each routine has the opportunity for one of them to show off their skills in a solo performance. It has the energy and individual showmanship of a rock show. The set is a construction site, with ladders and scaffolding, that they build and dismantle as they work through their routines. The show is high energy throughout, there is hardly a moment in the hour and a half when there is not at least one of them dancing at full tilt. They manage to keep the routines different and interesting with humour, competition and clever props. Torches, blowtorches, basketballs and water trays are all used to great effect and I would be surprised if the front rows don’t leave a lot damper than when they arrived. There are two drummers who perform for part of the show but mostly the percussion is provided by the tap dancing. A particularly clever routine is one where they dance on drum machines, with each making a different percussive resonance. The dancers are all very talented and all of the routines are either very fast or technically difficult. Both their skill and their stamina is admirable, they do not let up for a minute during the entire show. You won’t be surprised to hear that this show is loud. I think it is the loudest performance that I have ever seen – and I saw Status Quo and Simple Minds in the 1980s. If you like tap dancing, you will be hard pushed to find a show with a better demonstration of the skill. Dein Perry’s Tap Dogs has a winning formula and I would not be surprised to see it still touring in another twenty three years. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed21efb43', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); 8 Comments"
