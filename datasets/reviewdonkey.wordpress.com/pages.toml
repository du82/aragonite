["https://reviewdonkey.wordpress.com/2016/01"]
title = "January | 2016 | The London Lark!"
description = "My personal recommendations of things to do and see in London"
full_description = "Whale Watch, Kaikoura January 31, 2016March 20, 2017 nicknicklambert travel boat, dolphins, kaikoura, new zealand, photo, photography, review, south island, travel, trip, whales This isn’t the cheapest of the many tours in Kaikoura, but we enjoyed it and found it to be good value for money. We liked the fact that if you don’t see a whale, they will refund 80% of the ticket. We reckoned that meant they must be pretty confident and indeed it turned out be the case. We saw a sperm whale very close, and many many dolphins, also albatross. The guides were witty and informative. They do warn about seasickness and there were some who were but I recommend this trip heartily. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ecfdc1bba', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); 7 Comments Royal Botanic Gardens, Melbourne January 28, 2016March 20, 2017 nicknicklambert travel australia, botanic, cactus, flower, garden, Melbourne, photo, photography, plant, RBG_Victoria, review, TOTastemaker, travel, Victoria This is a big varied garden just across the road from the river. It has grassy knolls overlooking lotus filled lakes, tree filled areas and nice views over the city. It is beautifully maintained and it is possible to take a gondola ride around the lake. (They don’t sing opera, though!) Make sure you walk up the hill to Guilfoyle’s Volcano, which has a fantastic collection of succulents and cacti around it. A nice day out from city sight-seeing. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3ecfdc29c7', { sectionId: '370373', format: 'inread' }); }); Leave a comment Chinese garden of friendship, Sydney. January 28, 2016March 20, 2017 nicknicklambert travel australia, calm, Chinese, garden, new south wales, nomad, photo, photography, review, sydney, TOTastemaker, travel These gardens are right between Chinatown and Darling Harbour. There is a small entry fee but with this you are allowed to enter as many times as you like during the day. It is a lovely, calm garden with, carp, birds, waterfalls and statues. Right in the midst of the the hectic city of Sydney. As such, it add a nice new dimension to this vibrant city. Take a step away and enjoy some moments of calm in the Chinese garden of friendship while visiting Sydney. Leave a comment"
