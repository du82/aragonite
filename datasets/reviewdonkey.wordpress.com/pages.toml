["https://reviewdonkey.wordpress.com/2016/04"]
title = "April | 2016 | The London Lark!"
description = "My personal recommendations of things to do and see in London"
full_description = "Joanna’s, Crystal Palace, London April 26, 2016 nicknicklambert Restaurant review breakfast, brunch, Crystal Palace, foodie, London, Restaurant, review, TOTastemaker, view This is a great place for a smart leisurely brunch. Joanna’s is an institution in Crystal Palace. Since the 1970s, everyone local knows that it is good for an evening meal, but fewer people realise that it opens at 10am to serve brunch. The full English is high quality and their smoked salmon and scrambled eggs are lovely, my personal favourite is the poached egg and Canadian bacon served on an English muffin. The tables near the window have a beautiful view over the city of London, which looks particularly good on a cold sunny morning. It isn’t quite caff prices – but it has lots of papers, great coffee and you are never rushed. A lovely weekend treat. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed014d4af', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); 2 Comments The Suicide, National Theatre, London April 25, 2016 nicknicklambert Theatre review comedy, erdman, London, Lyttelton, national theatre, play, review, russian, theatre, TOTastemaker This is an update of a play for which, Nikolai Erdman, the original author spent time in Siberia, in the 1930s. This version is set in current UK with social media, local politics and hip-hop slam rap being lampooned. On the day I saw it Adrian Richards, the understudy, played Sam and was excellent. It is funny and the characters are well written and recognisable. There are bits that could go, I’m not sure what seeing Maggie Thatcher in the afterlife added to the proceedings. I will look out for Suhayla El-Bushra’s writing in the future. The set was great too, it cleverly moved back and forth between the inside and outside of an authentic looking tower block flat. While the state here is not going to feel threatened by this play, it was entertaining, interesting and showed promise. Recommended. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3ed014f592', { sectionId: '370373', format: 'inread' }); }); 2 Comments"
