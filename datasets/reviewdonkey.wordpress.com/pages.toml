["https://reviewdonkey.wordpress.com/2017/01"]
title = "January | 2017 | The London Lark!"
description = "My personal recommendations of things to do and see in London"
full_description = "Blue & Orange, Thornton Heath, London January 31, 2017 nicknicklambert Restaurant review croydon, eating out, food, foodie, London, Restaurant, review, South London, Thornton Heath, TOTastemaker Every area should have its local great restaurant, and for Thornton Heath, this is Blue & Orange. I live in Thornton Heath, so I have visited this restaurant many times. For me, it is the best and most reliably good restaurant in South London. The food is always excellent, we have eaten from all parts of the menu and it is consistently very good. The menu is varied with an Eastern Mediterranean inclination. The Borek is excellent as a starter and the Kulbasti is a fantastic main course. They also do pasta (the chicken liver tagliatelle is delicious), pizza and various hamburgers. The chilli sauce is made on the premises and is really good – it is worth the trip for the chilli sauce alone! Blue and Orange is fully licensed, the house beer is Efes. I have noticed recently that they are serving lots of cocktails with dinner, although to be fair, I haven’t tried one yet. It is open all afternoon as well as at night, so it is handy if you are looking to eat early or to have a late lunch. It is probably worth ringing ahead to book if you are intending to go at peak times as it is usually pretty busy at night. Heartily recommended! Try the homemade chilli sauce! __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed0a3c469', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); 1 Comment Manchester Museum, Manchester January 30, 2017 nicknicklambert Attractions England, history, Manchester, mueum, natural history, nature, travel Manchester Museum has got such a wide variety of exhibits that any visitor is likely to find something that they find fascinating. It is particularly good at providing a story behind the items it has on display. It contains the skeleton of the elephant that walked from Edinburgh to Manchester. It has a, stuffed and mounted, Tigon that lived in Manchester zoo. It has a beautiful, live, Panther Chameleon. It even has some gilded bees! It is free to enter, with plenty of helpful staff. It is surprisingly large and did not feel crowded even though there were many people there on the Friday morning that I visited. There is a very good and interesting Egyptology section with various mummies and a granite head of Rameses II. It is well worth a visit if you have a couple of hours to spare when you are in Manchester. I really enjoyed it. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3ed0a3f041', { sectionId: '370373', format: 'inread' }); }); 5 Comments"
