["https://reviewdonkey.wordpress.com/2017/10"]
title = "October | 2017 | The London Lark!"
description = "My personal recommendations of things to do and see in London"
full_description = "Shoreditch Takeover, Shoreditch Town Hall, London October 27, 2017 nicknicklambert Gigs architecture, art, culture, dance, Dance festival, Dance Umbrella, DUFest17, East London, film, hip, London, music, nightlife, poetry, Shoreditch, theatre Shoreditch is the centre of cool in London at the moment, so you would expect its contribution to the Dance Umbrella Festival 2017 to be cutting edge and innovative. On both these counts it certainly delivers. Shoreditch Takeover is made up of four very different pieces, happening in separate spaces within the beautiful old building that is Shoreditch Town Hall. Twenty first century art within nineteenth century architecture. First is Rays, Sparks and Beating Glows. This is choreographed by Julie Cunningham and is an intense piece, about gender and feminism, for four dancers. It is performed without music, although there is some spoken word towards the end. Next is Vanessa Kinsuule, who is a wonderful poet. She is, witty, insightful, nostalgic and honest. She has a winning personality, who can really involve an audience and the introductions to the poems are almost as good as the poems themselves. Her whole set is great and the poem about an evening, dancing at a nightclub, is a highlight. The third set is Lizbeth Gruwez dances Bob Dylan, a personal interpretation, exploring the edges of dance. For “Knockin’ on Heavens Door”, Lizbeth stands with her back to the audience at the front of the stage and walks, slowly and beautifully, to the back. You haven’t seen minimalism in dance until you have watched this. The Bob Dylan tracks are played on vinyl and are quite scratchy at times, invoking images of drunk and stoned nights in 70’s bedsits. The final work is a film, The Shadow Drone Project, cleverly filmed from above, where the actual bodies of the dancers can hardly be seen, but instead we watch their shadows interact with each other. Some of this appears choreographed and some not, blurring the line between formal dance and how our brains make patterns. All in all, a varied and interesting night in a lovely venue, a good addition to the Dance Umbrella Festival 2017. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed1787832', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Leave a comment"
