["https://reviewdonkey.wordpress.com/2016/03"]
title = "March | 2016 | The London Lark!"
description = "My personal recommendations of things to do and see in London"
full_description = "Reflected in glory March 11, 2016March 20, 2017 nicknicklambert travel architecture, argentina, art, Buenos Aires, cemetery, d3300, Nikon, photo, photography, Recoleta, religion, review, stained glass, TOTastemaker, travel Yesterday we visited the Recoleta Cemetery where for 200 years the great and the good of Buenos Aires have competed to build the most ornate mausoleums in stone and marble. I loved the way that with a little care it’s possible to capture a brief vignette of the architecture and stained glass reflected in the glass of doorways used by relatives to visit their ancestors. These are my favourite photos of the day. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed001d1f4', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); 2 Comments Hosteria La Estepa, El Calafate, Argentina March 10, 2016April 16, 2016 nicknicklambert Hotel review argentina, El Calafate, glacier, hosteria, hotel, Night sky, Perito Moreno, review, TOTastemaker This hotel is 1.5k outside town so about a 30 minute walk but also only about £3 in a taxi. It also has the advantage that if you book a tour there’s a good chance that you will be picked up last and dropped off first.The view over the lake is beautiful especially from the upstairs lounge. The staff were wonderful and did everything they could to help. We actually liked being a little out of town as on a clear night the there was less light noise and the stars appeared brighter. The room was great and the shower very good, if there was one thing that I missed it was the ability to make tea or coffee in the room. Having said that Hosteria La Estepa would be my first choice if I returned to El Calafate. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3ed001f447', { sectionId: '370373', format: 'inread' }); }); Leave a comment"
