["https://reviewdonkey.wordpress.com/2019/01"]
title = "January | 2019 | The London Lark!"
description = "My personal recommendations of things to do and see in London"
full_description = "Brinkley’s Kitchen, Bellevue Road, Wandsworth, London SW17 January 18, 2019January 8, 2019 nicknicklambert Restaurant review eat, eating out, food, foodie, London, meat, Restaurant, roast, South London, steak, Sunday Lunch, TOTastemaker, Tourist London, travel, Wandsworth Wandsworth is a suburb of South London that is well served with places to eat. Bellevue Road in particular is an attractive road with the broad expanse of Wandsworth Common along one side, and an array of restaurants, pubs, artisan tea rooms and independent shops along the other. Brinkley’s Kitchen is near the top of this road, we chose it for a late lunch on a Sunday afternoon. The restaurant is decorated in a smart contemporary manner. The photos on its website show it as very bright and airy, but the blinds were all drawn on the afternoon we were there. There was no tablecloth on our table for three, but it does have linen napkins, nice cutlery and glasses. The brunch menu has good choice, we opted for roast beef and a steak. The wines by the glass had a more limited selection, for example they only had one rose. When I asked the waiter what it was like – as I didn’t know it – he told me it was very good. I said I was hoping for a more descriptive reply, he just said “you will love it”. So, I asked to taste before I chose and it was fine, although I suspect the whole bottle cost a fraction of what they charged for the glass. The food was good but unremarkable. The beef was overcooked for my taste but the gravy was nice. When I pay top end prices for a Sunday roast, I would expect the Yorkshire pudding to be freshly prepared. These had clearly been made earlier and reheated. The ribeye was okay and the chips were hot and fresh. When my friend asked for tomato sauce for her chips, they brought a bottle of ketchup to the table, at least it was Heinz. It came without the lid, so much hitting the bottom of the bottle was required to get any out. The service was entertaining, every different waiter who came to the table enquired “How is your day going?” which became a little Stepford Wives creepy after the sixth time of asking, especially after the busboy asked it twice in five minutes without waiting for a reply. I didn’t like the fact that they brought us the bill without us asking for it, I felt they were rushing us to finish our drinks. Overall, Brinkley’s Kitchen served us reasonable quality pub food, but charged high end restaurant prices. In an area, indeed even a street, where there are so many fine places to eat, it will not be difficult to find somewhere that gives far better value for money. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed26035e2', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); 3 Comments"
