full_description = "Tek Sen, Georgetown, Penang December 20, 2015November 10, 2018 nicknicklambert Restaurant reviewChinese, eating out, food, foodie, Malaysia, Penang, Peranakan, Restaurant, review, TOTastemaker, travel, world food Georgetown in Penang has many great restaurants, this particular one was recommended as the best Chinese one. The menu is different to the usual Chinese fare as it is Peranakan Chinese, so it is difficult to know what to order. However there were 4 of us,we ordered 6 dishes and every one of them was full of flavour and delicious. We particularly liked the double cooked pork and the tofu was the nicest that I have ever tasted. It was busy, buzzy, loud and a great experience. It was also excellent value! __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3ed5058481', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed50584aa', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Share this:TwitterFacebookLike Loading..."
