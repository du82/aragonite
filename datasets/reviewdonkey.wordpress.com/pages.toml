["https://reviewdonkey.wordpress.com/2017/06"]
title = "June | 2017 | The London Lark!"
description = "My personal recommendations of things to do and see in London"
full_description = "Angels In America, National Theatre, Southbank, London. June 30, 2017 nicknicklambert Theatre review 1980s, AIDS, Andrew Garfield, drama, gay, HIV, LGBT, literature, London, Nathan Lane, national theatre, religion, review, Russell Tovey, show, theatre, travel, USA Angels in America is operatic in its scale. It has huge universal themes, it takes on religion, politics and the future of the planet. At its core though, are three individual small stories that investigate the meaning of love and abandonment. It can be at times; grandiose, bombastic, histrionic and at others; tender, bitchy or warm. The show is set in 1985 New York at the start of the AIDS crisis, with Ronald Reagan just having been elected for his second term. It is an awe inspiringly big production. The set is amazing. There are not many theatres in the world with stages large enough to contain the more expansive pieces, but there are also intimate scenes set in small a room or around a single hospital bed. I will be surprised if Ian MacNeil does not win an award for his set design. The direction is very clever, the angel is astonishingly large, when it arrives, yet the scene involving a small puppetry diorama is equally compelling. The cast is astounding and their performances are excellent. Every single person in the production is at the top of their game, so it almost seems unfair to pick out favourites but…. Andrew Garfield is a revelation, I’d only seen him as Spider-Man before, and this is quite different! Nathan Stewart-Jarrett is fab-u-lous (three full syllables) as Belize, he is given some of the best lines in the show, and he delivers them well. Nathan Lane plays Roy Cohn and manages to make him cruel, contemptible and charismatic. This show is a marathon at over seven and a half hours for both parts, but it passes surprisingly quickly. I did not feel the time going at all. I commend its ambition, I admire its uncompromising stance and I revere its wonderful production values. Angels in America one-off theatrical experience. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3ed124f2d6', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); 6 Comments"
