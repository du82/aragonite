title = "RFC Errata Report » RFC Editor"
full_description = '''RFC Errata Errata Search RFC Number: Errata ID: Source of RFC Status: All/Any Verified+Reported Verified Reported Held for Document Update Rejected Area Acronym: All/Any app art gen int ops rai rtg sec tsv wit Type: All/Any Editorial Technical WG Acronym: Submitter Name: Other: All/Any IAB INDEPENDENT IRTF Legacy Editorial Date Submitted: Summary Table Full Records <!-- document.forms.query.rfc.focus(); //--> Found 2 records. Status: Verified (2) RFC 4288, "Media Type Specifications and Registration Procedures", December 2005 Note: This RFC has been obsoleted by RFC 6838 Source of RFC: IETF - NON WORKING GROUP Errata ID: 141 Status: Verified Type: Editorial Publication Format(s) : TEXT Reported By: Alfred Hoenes Date Reported: 2005-12-18 Section 4.2.2 says: A Media type of "image" indicates that the content specifies or more separate images that require appropriate hardware to display. ... It should say: A Media type of "image" indicates that the content specifies one or more separate images that require appropriate hardware to display. ... Errata ID: 818 Status: Verified Type: Editorial Publication Format(s) : TEXT Reported By: Alfred Hoenes Date Reported: 2005-12-18 Two small editorial issues: - Perhaps as an artifact of the conversion of text from an existing RFC to a revised memo in I-D format and finally back to RFC format, along with repeated re-pagination, it can be observed from time to time that there appear unexpected blank lines in RFC text which visually break sentences apart. This recurring arifact has hit RFC 4288 near the top of its pages #8 and #10. It should say: [not submitted] Notes: I assume you're referring to the break between "linear" and "sequence". I agree it should not have been there. from pending Report New Errata'''
