["https://www.rfc-editor.org/info/rfc9710"]
title = "Information on RFC 9710 » RFC Editor"
full_description = 'RFC 9710 Simple Fixes to the IP Flow Information Export (IPFIX) Entities IANA Registry, February 2025 File formats: Also available: XML file for editing Status:PROPOSED STANDARD Authors:M. BoucadairB. Claise Stream:IETF Source:opsawg (ops) Cite this RFC: TXT | XML | BibTeX DOI: https://doi.org/10.17487/RFC9710 Discuss this RFC: Send questions or comments to the mailing list opsawg@ietf.org Other actions: Submit Errata | Find IPR Disclosures from the IETF | View History of RFC 9710 Abstract This document provides simple fixes to the IANA "IP Flow Information Export (IPFIX) Entities" registry. Specifically, this document provides updates to fix shortcomings in the description of some Information Elements (IEs), to ensure a consistent structure when citing an existing IANA registry, and to fix broken pointers, orphaned section references, etc. The updates are also meant to bring some consistency among the entries of the registry. For the definition of Status, see RFC 2026. For the definition of Stream, see RFC 8729.'
