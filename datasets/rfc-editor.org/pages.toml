["https://rfc-editor.org/info/rfc9720"]
title = "Information on RFC 9720 » RFC Editor"
full_description = "RFC 9720 RFC Formats and Versions, January 2025 File formats: Also available: XML file for editing Status:INFORMATIONAL Obsoletes:RFC 7990 Updates:RFC 9280 Authors:P. HoffmanH. Flanagan Stream:Editorial Cite this RFC: TXT | XML | BibTeX DOI: https://doi.org/10.17487/RFC9720 Discuss this RFC: Send questions or comments to the mailing list rswg@rfc-editor.org Other actions: Submit Errata | Find IPR Disclosures from the IETF | View History of RFC 9720 Abstract In order to improve the readability of RFCs while supporting their archivability, the definitive version of the RFC Series transitioned from plain-text ASCII to XML using the RFCXML vocabulary; different publication versions are rendered from that base document. This document describes how RFCs are published.This document obsoletes RFC 7990. This document also updates the stability policy in RFC 9280. For the definition of Status, see RFC 2026. For the definition of Stream, see RFC 8729."
