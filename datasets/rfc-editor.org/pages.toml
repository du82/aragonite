full_description = "AUTH48 status page for C507 Cluster Detailsdraft-ietf-dnssd-update-lease-08.txt (RFC-to-be 9664) AUTH48draft-ietf-dnssd-srp-25.txt (RFC-to-be 9665) AUTH48*RAUTH48 status of draft-ietf-dnssd-update-lease-08 (RFC-to-be 9664) This document is in AUTH48 state as of 2024-09-30. It has not yet been published as an RFC. The RFC Editor is awaiting approvals from the author(s) as shown below (and anyone else listed) before continuing the publication process. Name Approved? Date of Approval S. Cheshire N T. Lemon N ** This document is part of Cluster C507, so may have additional holds before publication. Notes: 2024-09-30: questions and cluster-wide questions sent to authors. AUTH48 status of draft-ietf-dnssd-srp-25 (RFC-to-be 9665) This document is in AUTH48 state as of 2024-09-30. It has not yet been published as an RFC. The RFC Editor is awaiting approvals from the author(s) as shown below (and anyone else listed) before continuing the publication process. Name Approved? Date of Approval T. Lemon N S. Cheshire N ** This document is part of Cluster C507, so may have additional holds before publication. Notes: 2024-09-30: questions and cluster-wide questions sent to authors. Instructions to author(s): Please see the AUTH48 notification email from the RFC Editor that contains links to the edited files and other information. To send your approval of or changes for a specific document, please Reply All to the message for the given RFC-to-be in question. If cluster-wide questions were received, please Reply All to that email so each of the relevant parties may partake in the decision process. See information below for the status of documents within the cluster that are in AUTH48.When all approvals for a given document have been received, publication will continue once its normative references have completed the AUTH48 process as well. Upon publication of the cluster, this AUTH48 status page will no longer be available."
