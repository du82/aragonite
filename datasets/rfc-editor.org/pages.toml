["https://rfc-editor.org/old/Dec2014"]
title = "RFC Editor Report"
full_description = "This page contains useful information regarding the performance of the RFC Production Center (RPC). It includes news items (updated as needed) and stats about production that are updated on a monthly basis. The RFC Editor strives to provide excellent and timely editorial service. To ensure the RFC Editor is providing the best possible service, the RPC regularly reviews its processes and liaises with the communities served. In addition, the rfc-interest mailing list is dedicated to discussing topics related to the RFC Editor. The Service Level Agreement indicates that 67% of the documents should be published with an RFC-Editor time (RET) of 6 weeks or less. The following table indicates whether we are meeting this goal. It also includes a running 12-month average. Note that pre-2014 SLA monthly reports are available in the reports archive. December 2014: Having met the SLA in December, the RPC had a successful Q4. The table shows the impact of the increased number of documents entering the queue (both newly approved and those released from MISSREF) earlier in the year, and the RPC's recovery throughout the remainder of the year. November 2014: November was a slow month in terms of submissions and publications. We expect this is largely due to IETF 91, which took place in early November. The RPC invested a significant amount of time preparing to host the Experimental Writing Lab and reviewing the individual documents to be discussed with the authors that requested a session. October 2014: The RFC Editor is gearing up for IETF 91 in Honolulu, Hawaii. As part of this preparation, we have built the framework for hosting Experimental Writing Lab sessions at IETF 91. September 2014: The RFC Editor published the new RFC Style Guide (RFC 7322) and the Web Portion of the Style Guide. We have successfully transitioned documents in the queue to meet the recommendations defined therein (see the announcement for detailed information). The RFC Editor also released an updated Style Guide page, which includes additional information and guidance to authors."
