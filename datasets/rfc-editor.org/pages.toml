full_description = 'RFC Errata Errata Search RFC Number: Errata ID: Source of RFC Status: All/Any Verified+Reported Verified Reported Held for Document Update Rejected Area Acronym: All/Any app art gen int ops rai rtg sec tsv wit Type: All/Any Editorial Technical WG Acronym: Submitter Name: Other: All/Any IAB INDEPENDENT IRTF Legacy Editorial Date Submitted: Summary Table Full Records <!-- document.forms.query.rfc.focus(); //--> Found 1 record. Status: Held for Document Update (1) RFC 3935, "A Mission Statement for the IETF", October 2004 Source of RFC: IETF - NON WORKING GROUP Errata ID: 7616 Status: Held for Document Update Type: Editorial Publication Format(s) : TEXT Reported By: Brian Carpenter Date Reported: 2023-08-25 Held for Document Update by: RFC Editor Date Held: 2024-04-09 Section 1 says: Technical competence - the issues on which the IETF produces its documents are issues where the IETF has the competence needed to speak to them, and that the IETF is willing to listen to technically competent input from any source. It should say: Technical competence - the issues on which the IETF produces its documents are issues where the IETF has the competence needed to speak to them, and where the IETF is willing to listen to technically competent input from any source. Notes: The word "that" was the wrong part of speech and referred to nothing. (I am reporting this now because this clause has been quoted at https://www.ietf.org/about/introduction/ where it jumped out at me.) ===RFC Editor Notes=== Another possible way to update: Technical competence - the IETF produces its documents on issues for which it has the competence needed to speak to them and the willingness to listen to technically competent input from any source. Report New Errata'
