title = "RFC Errata Report » RFC Editor"
full_description = '''RFC Errata Errata Search RFC Number: Errata ID: Source of RFC Status: All/Any Verified+Reported Verified Reported Held for Document Update Rejected Area Acronym: All/Any app art gen int ops rai rtg sec tsv wit Type: All/Any Editorial Technical WG Acronym: Submitter Name: Other: All/Any IAB INDEPENDENT IRTF Legacy Editorial Date Submitted: Summary Table Full Records <!-- document.forms.query.rfc.focus(); //--> Found 4 records. Status: Verified (3) RFC 2418, "IETF Working Group Guidelines and Procedures", September 1998 Note: This RFC has been updated by RFC 3934, RFC 7475, RFC 7776, RFC 8717, RFC 9141 Source of RFC: Poisson (gen) Errata ID: 3752 Status: Verified Type: Editorial Publication Format(s) : TEXT Reported By: RFC Editor Date Reported: 2013-10-15 Verifier Name: Lars Eggert Date Verified: 2021-03-11 Section 2.2 says: In order to take advantage of this service, working group mailing lists MUST include the address "wg_acronym-archive@lists.ietf.org" (where "wg_acronym" is the working group acronym) in the mailing list in order that a copy of all mailing list messages be recorded in the Secretariat's archive. It should say: In order to take advantage of this service, working group mailing lists MUST include the address "wg_acronym-archive@ietf.org" (where "wg_acronym" is the working group acronym) in the mailing list in order that a copy of all mailing list messages be recorded in the Secretariat's archive. Notes: '@lists.ietf.org' was changed to '@ietf.org' in the year 2005. Although the RFC errata system is not typically used to update email addresses that were correct at the time of publication, this report results from discussion with Russ Housley and Jari Arkko. Errata ID: 6787 Status: Verified Type: Editorial Publication Format(s) : TEXT Reported By: Sky Lian Date Reported: 2021-12-18 Verifier Name: Lars Eggert Date Verified: 2023-08-11 Section Appendix says: The primary purpose of this working group is to develop two such supportive protocols and a frameword document. It should say: The primary purpose of this working group is to develop two such supportive protocols and a framework document. Notes: From "frameword" to "framework" Errata ID: 7408 Status: Verified Type: Editorial Publication Format(s) : TEXT Reported By: Ian Williams Date Reported: 2023-03-29 Verifier Name: RFC Editor Date Verified: 2023-04-27 Section 2.3 says: The working group is announced to the IETF-announce a by the IETF Secretariat. It should say: The working group is announced to the IETF-announce mailing list by the IETF Secretariat. Notes: "a" appears to have been used in place of "mailing list." Status: Held for Document Update (1) RFC 2418, "IETF Working Group Guidelines and Procedures", September 1998 Note: This RFC has been updated by RFC 3934, RFC 7475, RFC 7776, RFC 8717, RFC 9141 Source of RFC: Poisson (gen) Errata ID: 6130 Status: Held for Document Update Type: Editorial Publication Format(s) : TEXT Reported By: Alvaro Retana Date Reported: 2020-04-27 Held for Document Update by: Lars Eggert Date Held: 2021-03-11 Section 3.3 says: [4th paragraph in §3.3] ... level of consensus. The most common method used is for the working group chair to state what he or she believes to be the consensus view and. at the same time, requests comments from the list about the stated conclusion. It should say: ... level of consensus. The most common method used is for the working group chair to state what he or she believes to be the consensus view and, at the same time, requests comments from the list about the stated conclusion. s/and./and, Notes: Nit related to a misplaced "." instead of a ",". Report New Errata'''
