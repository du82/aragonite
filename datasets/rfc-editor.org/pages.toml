st for the discussion of CSIRTs and their tasks are available from the CERT Coordination Center and ENISA - https://www.cert.org/incident-management/csirt-development/index.cfm A collection of documents by the CERT Coordination Center on CSIRT Development. - http://www.enisa.europa.eu/activities/cert/support This page contains practice material that aims at helping EU Member States, but also other stakeholders, to smoothly establish and operate CERTs / CSIRTs. Notes: The previously referenced resources do not exist anymore. They should be either removed or replaced by references to the available resources from CERT and ENISA. Errata ID: 3903 Status: Held for Document Update Type: Editorial Publication Format(s) : TEXT Reported By: Christian Keil Date Reported: 2014-02-26 Held for Document Update by: Benoit Claise Date Held: 2014-04-15 Section Appendix C says: [...] Many of the European teams, regardless of whether they are members of FIRST or not, are listed by countries on a page maintained by the German CSIRT: - http://www.cert.dfn.de/eng/csir/europe/certs.html It should say: [...] Many of the European teams, regardless of whether they are members of FIRST or not, are listed by countries on a page maintained by the Trusted Introducer Service (TI): - http://www.trusted-introducer.org/directory/index.html Notes: The list of European teams is no longer maintained by DFN-CERT but by TI. Report New Errata'''
