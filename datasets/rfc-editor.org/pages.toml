["https://rfc-editor.org/info/rfc8730"]
title = "Information on RFC 8730 » RFC Editor"
full_description = "RFC 8730 Independent Submission Editor Model, February 2020 File formats: Also available: XML file for editing Status:INFORMATIONAL Obsoletes:RFC 6548 Updated by:RFC 9280 Authors:N. Brownlee, Ed.B. Hinden, Ed. Stream:IAB Cite this RFC: TXT | XML | BibTeX DOI: https://doi.org/10.17487/RFC8730 Discuss this RFC: Send questions or comments to the mailing list iab@iab.org Other actions: Submit Errata | Find IPR Disclosures from the IETF | View History of RFC 8730 Abstract This document describes the function and responsibilities of the RFC Independent Submission Editor (ISE). The Independent Submission stream is one of the stream producers that create draft RFCs, with the ISE as its stream approver. The ISE is overall responsible for activities within the Independent Submission stream, working with draft editors and reviewers, and interacts with the RFC Production Center and Publisher, and the RFC Series Editor (RSE). The ISE is appointed by the IAB, and also interacts with the IETF Administration Limited Liability Company (LLC).This version obsoletes RFC 6548 to replace all references to the Internet Administrative Support Activity (IASA) and related structures with those defined by the IASA 2.0 structure. For the definition of Status, see RFC 2026. For the definition of Stream, see RFC 8729."
