title = "Information on RFC 7841 » RFC Editor"
full_description = "RFC 7841 RFC Streams, Headers, and Boilerplates, May 2016 File formats: Status:INFORMATIONAL Obsoletes:RFC 5741 Updated by:RFC 9280 Authors:J. Halpern, Ed.L. Daigle, Ed.O. Kolkman, Ed. Stream:IAB Cite this RFC: TXT | XML | BibTeX DOI: https://doi.org/10.17487/RFC7841 Discuss this RFC: Send questions or comments to the mailing list iab@iab.org Other actions: View Errata | Submit Errata | Find IPR Disclosures from the IETF | View History of RFC 7841 Abstract RFC documents contain a number of fixed elements such as the title page header, standard boilerplates, and copyright/IPR statements. This document describes them and introduces some updates to reflect current usage and requirements of RFC publication. In particular, this updated structure is intended to communicate clearly the source of RFC creation and review. This document obsoletes RFC 5741, moving detailed content to an IAB web page and preparing for more flexible output formats. For the definition of Status, see RFC 2026. For the definition of Stream, see RFC 8729."
