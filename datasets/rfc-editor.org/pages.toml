title = "Information on RFC 9609 » RFC Editor"
full_description = "BCP 209 RFC 9609 Initializing a DNS Resolver with Priming Queries, February 2025 File formats: Also available: XML file for editing Status:BEST CURRENT PRACTICE Obsoletes:RFC 8109 Authors:P. KochM. LarsonP. Hoffman Stream:IETF Source:dnsop (ops) Cite this RFC: TXT | XML | BibTeX DOI: https://doi.org/10.17487/RFC9609 Discuss this RFC: Send questions or comments to the mailing list dnsop@ietf.org Other actions: Submit Errata | Find IPR Disclosures from the IETF | View History of RFC 9609 Abstract This document describes the queries that a DNS resolver should emit to initialize its cache. The result is that the resolver gets both a current NS resource record set (RRset) for the root zone and the necessary address information for reaching the root servers.This document obsoletes RFC 8109. For the definition of Status, see RFC 2026. For the definition of Stream, see RFC 8729."
