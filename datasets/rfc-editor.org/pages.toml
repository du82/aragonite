["https://www.rfc-editor.org/errata/rfc2182"]
title = "RFC Errata Report » RFC Editor"
full_description = '''RFC Errata Errata Search RFC Number: Errata ID: Source of RFC Status: All/Any Verified+Reported Verified Reported Held for Document Update Rejected Area Acronym: All/Any app art gen int ops rai rtg sec tsv wit Type: All/Any Editorial Technical WG Acronym: Submitter Name: Other: All/Any IAB INDEPENDENT IRTF Legacy Editorial Date Submitted: Summary Table Full Records <!-- document.forms.query.rfc.focus(); //--> Found 1 record. Status: Held for Document Update (1) RFC 2182, "Selection and Operation of Secondary DNS Servers", July 1997 Source of RFC: dnsind (int) Errata ID: 4631 Status: Held for Document Update Type: Editorial Publication Format(s) : TEXT Reported By: Andrew Boling Date Reported: 2016-03-02 Held for Document Update by: Terry Manderson Date Held: 2016-05-12 Section 3.3 says: + While positive DNS results are usually cached, the lack of a result is not cached. Thus, unnecessary inability to resolve creates an undesirable load on the net. It should say: + While positive DNS results are usually cached, the lack of a result will either be cached with less frequency or not at all, depending on a server's caching behaviours and the operator's local configuration. Thus, unnecessary inability to resolve creates an undesirable load on the net. Notes: BCP 16 predates RFC 2308 (Negative Caching of DNS Queries), and the blanket statement that "lack of a result is not cached" is inaccurate by modern standards. AD Note: 1) The errata has been moved to editorial, as the outcome "undesirable load on the net" is the same. 2) The errata itself has been moved to hold for update. Change in deployment and technology over time will always affect documents already published. The Errata text is not spurious, and does add clarification but does not impact interoperability. Report New Errata'''
year_published = 2025
