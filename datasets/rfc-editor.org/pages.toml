["https://www.rfc-editor.org/other"]
title = "Other Information » RFC Editor"
full_description = "Other Information RFCs in Translation Spanish: www.rfc-es.org French: abcdrfc.free.fr Japanese: JPNIC JP-RFC rfc-jp.nic.ad.jp/ Tutorials How to Use XML to Create an Internet-Draft (video | PDF) This tutorial shows how to use an XML source file to generate an I-D using xml2rfc and highlights the changes to the XML vocabulary, which is referred to as “v3”. (March 2019) How to Use Markdown to Create an Internet-Draft (video | PDF) This tutorial shows how to use a markdown file to generate an I-D. (March 2019) Document Lifecycle (PDF) Description: This tutorial offers an overview of producing documents in the IETF from version 00 of an Internet-Draft to publication as an RFC. We will cover the working group process and the required and suggested contents of an Internet-Draft, including information from IANA staff about writing IANA Considerations sections. We will walk through the lifecycle of an Internet-Draft, including authorship, WG draft, IETF Last Call, IESG evaluation, and what to expect during the RFC publication process. We will provide a set of helpful hints to authors about formatting rules and editorial policies that often improve the quality of the resulting documents. We will summarize the states of the RFC publication process and provide an opportunity to ask questions of RFC Editor staff. RFCs and the RFC Editor (PDF) Description: This tutorial covers the basics that are required to understand the metadata related to an RFC (e.g., updates/obsoletes relationships, status changes, and errata). This session also describes the publication process and provides some tips for writing good RFCs. Here is a list of past tutorials that were offered by the IETF EDU team."
