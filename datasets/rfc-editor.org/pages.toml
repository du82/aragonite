["https://rfc-editor.org/rfc/rfc9446"]
title = "RFC 9446: Reflections on Ten Years Past the Snowden Revelations"
description = """
This memo contains the thoughts and recountings of events that
transpired during and after the release of information about the United States National Security Agency (NSA)
by Edward Snowden in 2013.  There are four perspectives: that of someone 
who was involved with sifting through the information to responsibly 
inform the public, that of a security area director of the IETF, that of a human 
rights expert, and that of a computer science and affiliate law professor. The purpose 
of this memo is to provide some historical perspective, while at the 
same time offering a view as to what security and privacy challenges 
the technical community should consider.  These essays do not represent a consensus view, but that of the individual authors."""
full_description = '''This memo contains the thoughts and recountings of events that transpired during and after the release of information about the United States National Security Agency (NSA) by Edward Snowden in 2013. There are four perspectives: that of someone who was involved with sifting through the information to responsibly inform the public, that of a security area director of the IETF, that of a human rights expert, and that of a computer science and affiliate law professor. The purpose of this memo is to provide some historical perspective, while at the same time offering a view as to what security and privacy challenges the technical community should consider. These essays do not represent a consensus view, but that of the individual authors.¶ This document is not an Internet Standards Track specification; it is published for informational purposes.¶ This is a contribution to the RFC Series, independently of any other RFC stream. The RFC Editor has chosen to publish this document at its discretion and makes no statement about its value for implementation or deployment. Documents approved for publication by the RFC Editor are not candidates for any level of Internet Standard; see Section 2 of RFC 7841.¶ Information about the current status of this document, any errata, and how to provide feedback on it may be obtained at https://www.rfc-editor.org/info/rfc9446.¶ Copyright (c) 2023 IETF Trust and the persons identified as the document authors. All rights reserved.¶ This document is subject to BCP 78 and the IETF Trust's Legal Provisions Relating to IETF Documents (https://trustee.ietf.org/license-info) in effect on the date of publication of this document. Please review these documents carefully, as they describe your rights and restrictions with respect to this document.¶ On June 6th, 2013, an article appeared in The Guardian [Guard2013] that was the beginning of a series of what have come to be known as the Snowden revelations, describing certain activities of the United States National Security Agency (NSA). These activities included, amongst others: secret court orders; secret agreements for the receipt of so-called "meta-information" that includes source, destination, and timing of communications; and tapping of communications lines. The breathtaking scope of the operations shocked the Internet technical community and resulted in a sea change within the IETF, IAB, and other standards organizations.¶'''
author = "Stephen Farrell"
year_published = 2023
year_updated = 2023
clearnet = "https://rfc-editor.org/rfc/rfc9446"
