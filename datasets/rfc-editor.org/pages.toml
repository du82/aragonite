title = "Information on RFC 9734 » RFC Editor"
full_description = "RFC 9734 X.509 Certificate Extended Key Usage (EKU) for Instant Messaging URIs, February 2025 File formats: Also available: XML file for editing Status:PROPOSED STANDARD Author:R. Mahy Stream:IETF Source:lamps (sec) Cite this RFC: TXT | XML | BibTeX DOI: https://doi.org/10.17487/RFC9734 Discuss this RFC: Send questions or comments to the mailing list spasm@ietf.org Other actions: Submit Errata | Find IPR Disclosures from the IETF | View History of RFC 9734 Abstract RFC 5280 specifies several extended key purpose identifiers (KeyPurposeIds) for X.509 certificates. This document defines an Instant Messaging (IM) identity KeyPurposeId for inclusion in the Extended Key Usage (EKU) extension of X.509 v3 public key certificates For the definition of Status, see RFC 2026. For the definition of Stream, see RFC 8729."
