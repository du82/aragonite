full_description = 'RFC Errata Errata Search RFC Number: Errata ID: Source of RFC Status: All/Any Verified+Reported Verified Reported Held for Document Update Rejected Area Acronym: All/Any app art gen int ops rai rtg sec tsv wit Type: All/Any Editorial Technical WG Acronym: Submitter Name: Other: All/Any IAB INDEPENDENT IRTF Legacy Editorial Date Submitted: Summary Table Full Records <!-- document.forms.query.rfc.focus(); //--> Found 1 record. Status: Verified (1) RFC 3171, "IANA Guidelines for IPv4 Multicast Address Assignments", August 2001 Note: This RFC has been obsoleted by RFC 5771 Source of RFC: mboned (ops) Errata ID: 1794 Status: Verified Type: Technical Publication Format(s) : TEXT Reported By: Simon Perreault Date Reported: 2009-06-17 Verifier Name: Ron Bonica Date Verified: 2009-10-06 Section 2 says: 224.0.2.0 - 224.0.255.0 AD-HOC Block It should say: 224.0.2.0 - 224.0.255.255 AD-HOC Block Notes: Section 5 mentions the AD-HOC block as being 224.0.2.0/24 - 224.0.255.0/24, which fits with the corrected text. Furthermore, IANA has already assigned 224.0.255.0 - 224.0.255.255 for an AD-HOC usage. Report New Errata'
