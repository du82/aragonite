title = "AUTH48 Status: RFC-to-be 9678 » RFC Editor"
full_description = "AUTH48 status of draft-ietf-emu-aka-pfs-12 (RFC-to-be 9678) This document is in AUTH48 state as of 2024-10-11. It has not yet been published as an RFC. The RFC Editor is awaiting approvals from the author(s) as shown below (and anyone else listed) before continuing the publication process. Name Approved? Date of Approval J. Arkko Y 2025-02-16 K. Norrman Y 2025-01-09 J. Preuß Mattsson Y 2025-01-09 Notes: 2024-10-11: questions sent to authors. 2024-12-20: responses to questions incorporated and follow up questions asked; note that document contains SVG and updates have been made to the corresponding artwork (authors will re-render SVG once AUTH48 approvals are otherwise complete). 2025-01-18: authors submit re-rendered SVG, files adopted. 2025-02-28: publication pending resolution to issues with SVG in the PDF file. See . Instructions to author(s): Please see the AUTH48 notification email from the RFC Editor that contains a link to the edited document and other information. To send your approval or changes, please Reply All to that message. When all approvals have been received, publication is imminent. Upon publication as an RFC, this AUTH48 status page will no longer be available."
