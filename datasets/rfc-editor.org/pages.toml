full_description = "Independent Submissions Editorial Board The Independent Submissions Editorial Board (ISEB) provides reviews of independent submissions and offers advice to the Independent Submissions Editor (ISE). The volunteer ISEB exists at the pleasure of the ISE, and the members serve at the pleasure of the ISE. This group meets at IETF meetings, but most business is conducted by email. The present composition of the board (in alphabetical order) is: Harald Alvestrand Scott Bradner Nevil Brownlee Richard Clayton Aaron Falk Adrian Farrel Stephen Farrell Sharon Goldberg Joel Halpern Sue Hares John Klensin Subramanian Moonesamy (SM) Kathleen Moriarty Craig Partridge Martin Thomson The ISEB can be reached at rfc-ed-board@rfc-editor.org. For background, the RFC Editorial Board was originally formed in September 2003 to provide a broad range of editorial advice on RFC Editor operations, and in particular, to provide substantial help with the task of reviewing independent submissions."
