title = "RFC Errata Report » RFC Editor"
full_description = 'RFC Errata Errata Search RFC Number: Errata ID: Source of RFC Status: All/Any Verified+Reported Verified Reported Held for Document Update Rejected Area Acronym: All/Any app art gen int ops rai rtg sec tsv wit Type: All/Any Editorial Technical WG Acronym: Submitter Name: Other: All/Any IAB INDEPENDENT IRTF Legacy Editorial Date Submitted: Summary Table Full Records <!-- document.forms.query.rfc.focus(); //--> Found 2 records. Status: Verified (1) RFC 3372, "Session Initiation Protocol for Telephones (SIP-T): Context and Architectures", September 2002 Source of RFC: sipping (rai) Errata ID: 288 Status: Verified Type: Technical Publication Format(s) : TEXT Reported By: Feng Zhang Date Reported: 2002-09-22 Report Text: References to Figures 3, 5, and 7 should refer to Figures 2, 3, and 4, respectively. Status: Held for Document Update (1) RFC 3372, "Session Initiation Protocol for Telephones (SIP-T): Context and Architectures", September 2002 Source of RFC: sipping (rai) Errata ID: 4719 Status: Held for Document Update Type: Editorial Publication Format(s) : TEXT Reported By: Victor Gabriel Lopez Loyda Date Reported: 2016-06-24 Held for Document Update by: Ben Campbell Date Held: 2016-07-27 Throughout the document, when it says: In Figure 2 a VoIP cloud serves as a transit network for telephone calls originating in a pair of LECs, where SIP is employed as the VoIP protocol used to set up and tear down these VoIP calls. It should say: In Figure 1 a VoIP cloud serves as a transit network for telephone calls originating in a pair of LECs, where SIP is employed as the VoIP protocol used to set up and tear down these VoIP calls. Notes: References to Figure 2; should refer to Figure 1 instead as Figure 2 depicts a different scenario. Report New Errata'
