full_description = '''RFC Errata Errata Search RFC Number: Errata ID: Source of RFC Status: All/Any Verified+Reported Verified Reported Held for Document Update Rejected Area Acronym: All/Any app art gen int ops rai rtg sec tsv wit Type: All/Any Editorial Technical WG Acronym: Submitter Name: Other: All/Any IAB INDEPENDENT IRTF Legacy Editorial Date Submitted: Summary Table Full Records <!-- document.forms.query.rfc.focus(); //--> Found 2 records. Status: Held for Document Update (1) RFC 2317, "Classless IN-ADDR.ARPA delegation", March 1998 Source of RFC: dnsind (int) Errata ID: 1474 Status: Held for Document Update Type: Editorial Publication Format(s) : TEXT Reported By: Justin Pryzby Date Reported: 2008-07-17 Held for Document Update by: Brian Haberman Section 4 says: the the first component It should say: the first component Status: Rejected (1) RFC 2317, "Classless IN-ADDR.ARPA delegation", March 1998 Source of RFC: dnsind (int) Errata ID: 5688 Status: Rejected Type: Technical Publication Format(s) : TEXT Reported By: Dominik Date Reported: 2019-04-11 Rejected by: Eric Vyncke Date Rejected: 2023-08-03 Section [Page 2] says: Let us assume we have assigned the address spaces to three different parties as follows: 192.0.2.0/25 to organization A 192.0.2.128/26 to organization B 192.0.2.192/26 to organization C It should say: Let us assume we have assigned the address spaces to three different parties as follows: 192.0.2.0/25 to organization A 192.0.2.128/26 to organization B 192.0.2.192/27 to organization C Notes: Ip mask 27 ? --VERIFIER NOTES-- Actually, the last octet of 192.0.2.128 is b'1000 0000 and 192.0.2.192 is n'1100 0000 and the latter is *not* a subnet of the former in this RFC. I.e., both are /26 Report New Errata'''
