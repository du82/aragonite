title = "Information on RFC 5744 » RFC Editor"
full_description = 'RFC 5744 Procedures for Rights Handling in the RFC Independent Submission Stream, December 2009 File formats: Status:INFORMATIONAL Updates:RFC 4846 Authors:R. BradenJ. Halpern Stream:INDEPENDENT Cite this RFC: TXT | XML | BibTeX DOI: https://doi.org/10.17487/RFC5744 Discuss this RFC: Send questions or comments to the mailing list rfc-ise@rfc-editor.org Other actions: Submit Errata | Find IPR Disclosures from the IETF | View History of RFC 5744 Abstract This document specifies the procedures by which authors of RFC Independent Submission documents grant the community "incoming" rights for copying and using the text. It also specifies the "outgoing" rights the community grants to readers and users of those documents, and it requests that the IETF Trust manage the outgoing rights to effect this result. This memo provides information for the Internet community. For the definition of Status, see RFC 2026. For the definition of Stream, see RFC 8729.'
