itecture Board (IAB). Notes: from pending Errata ID: 2727 Status: Verified Type: Editorial Publication Format(s) : TEXT Reported By: Mykyta Yevstifeyev Date Reported: 2011-02-22 Verifier Name: Russ Housley Date Verified: 2011-06-07 Section 5 says: [H] IRTF Charter, RFC 2014, October 1996. It should say: [H] Weinrib, A. and J. Postel, "IRTF Research Group Guidelines and Procedures", BCP 8, RFC 2014, October 1996. Status: Rejected (1) RFC 2028, "The Organizations Involved in the IETF Standards Process", October 1996 Note: This RFC has been obsoleted by RFC 9281 Note: This RFC has been updated by RFC 3668, RFC 3979, RFC 8717 Source of RFC: poised95 (gen) Errata ID: 2742 Status: Rejected Type: Editorial Publication Format(s) : TEXT Reported By: Mykyta Yevstifeyev Date Reported: 2011-03-05 Rejected by: Russ Housley Date Rejected: 2011-06-07 Section 5 says: [F] IANA Charter, Work in Progress. [G] RFC Editor Charter, Work in Progress. It should say: [F] Carpenter, B., Baker, F., and M. Roberts, "Memorandum of Understanding Concerning the Technical Work of the Internet Assigned Numbers Authority", RFC 2860, June 2000. [G] Daigle, L., Ed., and Internet Architecture Board, "The RFC Series and RFC Editor", RFC 4844, July 2007. Notes: --VERIFIER NOTES-- These documents were not yet complete at the time RFC 2028 was written. Report New Errata'
