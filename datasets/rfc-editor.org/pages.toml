["https://www.rfc-editor.org/info/rfc9690"]
title = "Information on RFC 9690 » RFC Editor"
full_description = "RFC 9690 Use of the RSA-KEM Algorithm in the Cryptographic Message Syntax (CMS), February 2025 File formats: Also available: XML file for editing Status:PROPOSED STANDARD Obsoletes:RFC 5990 Authors:R. HousleyS. Turner Stream:IETF Source:lamps (sec) Cite this RFC: TXT | XML | BibTeX DOI: https://doi.org/10.17487/RFC9690 Discuss this RFC: Send questions or comments to the mailing list spasm@ietf.org Other actions: Submit Errata | Find IPR Disclosures from the IETF | View History of RFC 9690 Abstract The RSA Key Encapsulation Mechanism (RSA-KEM) algorithm is a one-pass (store-and-forward) cryptographic mechanism for an originator to securely send keying material to a recipient using the recipient's RSA public key. The RSA-KEM algorithm is specified in Clause 11.5 of ISO/IEC: 18033-2:2006. This document specifies the conventions for using the RSA-KEM algorithm as a standalone KEM algorithm and the conventions for using the RSA-KEM algorithm with the Cryptographic Message Syntax (CMS) using KEMRecipientInfo as specified in RFC 9629. This document obsoletes RFC 5990. For the definition of Status, see RFC 2026. For the definition of Stream, see RFC 8729."
