full_description = 'RFC Errata Published RFCs never change. Although every published RFC has been submitted to careful proofreading by the RFC Editor and the author(s), errors do sometimes go undetected. Use the form on this page to query the errata database for entries related to an RFC. Errata are for the RFCs as available from rfc-editor.org. Search results from the RFC search page will include hyperlinks to any corresponding errata entries. Errata Search RFC Number: Errata ID: Source of RFC Status: All/Any Verified+Reported Verified Reported Held for Document Update Rejected Area Acronym: All/Any app art gen int ops rai rtg sec tsv wit Type: All/Any Editorial Technical WG Acronym: Submitter Name: Other: All/Any IAB INDEPENDENT IRTF Legacy Editorial Date Submitted: Summary Table Full Records <!-- document.forms.query.rfc.focus(); //--> Report New Errata If you have new errata to report, use this form to first check that a report is not already in the system. If your issue is not listed, you will be able to submit a new report from that screen. [Note: To report an error in an existing erratum, please contact the RFC Editor.] The HTML files for RFCs 1 through 8649 were generated from the text file using rfc2html; errors may be reported to the maintainer of rfc2html or RFC Editor Enter RFC Number: More Information Status and Type Descriptions for RFC Errata How to report errata For verifiers: How to verify errata IESG Statement on "IESG Processing of RFC Errata for the IETF Stream" Current Process for Handling RFC Errata'
