full_description = "BCP 9 RFC 2026 The Internet Standards Process -- Revision 3, October 1996 File formats: Status:BEST CURRENT PRACTICE Obsoletes:RFC 1602, RFC 1871 Updated by:RFC 3667, RFC 3668, RFC 3932, RFC 3978, RFC 3979, RFC 5378, RFC 5657, RFC 5742, RFC 6410, RFC 7100, RFC 7127, RFC 7475, RFC 8179, RFC 8789, RFC 9282 Author:S. Bradner Stream:IETF Source:poised95 (gen) Cite this RFC: TXT | XML | BibTeX DOI: https://doi.org/10.17487/RFC2026 Discuss this RFC: Send questions or comments to the mailing list iesg@ietf.org Other actions: View Errata | Submit Errata | Find IPR Disclosures from the IETF | View History of RFC 2026 Abstract This memo documents the process used by the Internet community for the standardization of protocols and procedures. It defines the stages in the standardization process, the requirements for moving a document between stages and the types of documents used during this process. This document specifies an Internet Best Current Practices for the Internet Community, and requests discussion and suggestions for improvements. For the definition of Status, see RFC 2026. For the definition of Stream, see RFC 8729."
