["https://www.rfc-editor.org/info/rfc9707"]
title = "Information on RFC 9707 » RFC Editor"
full_description = '''RFC 9707 Report from the IAB Workshop on Barriers to Internet Access of Services (BIAS), February 2025 File formats: Also available: XML file for editing Status:INFORMATIONAL Authors:M. KühlewindD. DhodyM. Knodel Stream:IAB Cite this RFC: TXT | XML | BibTeX DOI: https://doi.org/10.17487/RFC9707 Discuss this RFC: Send questions or comments to the mailing list iab@iab.org Other actions: Submit Errata | Find IPR Disclosures from the IETF | View History of RFC 9707 Abstract The "Barriers to Internet Access of Services (BIAS)" workshop was convened by the Internet Architecture Board (IAB) from January 15-17, 2024 as a three-day online meeting. Based on the submitted position papers, the workshop covered three areas of interest: the role of Community Networks in Internet access of services, reports and comments on the observed digital divide, and measurements of censorship and censorship circumvention. This report summarizes the workshop's discussions and serves as a reference for reports on the current barriers to Internet access.Note that this document is a report on the proceedings of the workshop. The views and positions documented in this report were expressed during the workshop by participants and do not necessarily reflect the IAB's views and positions. For the definition of Status, see RFC 2026. For the definition of Stream, see RFC 8729.'''
