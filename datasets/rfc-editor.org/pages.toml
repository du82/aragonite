title = "Information on RFC 9280 » RFC Editor"
full_description = "RFC 9280 RFC Editor Model (Version 3), June 2022 File formats: Also available: XML file for editing Status:INFORMATIONAL Obsoletes:RFC 8728 Updates:RFC 7841, RFC 8729, RFC 8730 Updated by:RFC 9720 Author:P. Saint-Andre, Ed. Stream:IAB Cite this RFC: TXT | XML | BibTeX DOI: https://doi.org/10.17487/RFC9280 Discuss this RFC: Send questions or comments to the mailing list iab@iab.org Other actions: View Errata | Submit Errata | Find IPR Disclosures from the IETF | View History of RFC 9280 Abstract This document specifies version 3 of the RFC Editor Model. The model defines two high-level tasks related to the RFC Series. First, policy definition is the joint responsibility of the RFC Series Working Group (RSWG), which produces policy proposals, and the RFC Series Approval Board (RSAB), which approves such proposals. Second, policy implementation is primarily the responsibility of the RFC Production Center (RPC) as contractually overseen by the IETF Administration Limited Liability Company (IETF LLC). In addition, various responsibilities of the RFC Editor function are now performed alone or in combination by the RSWG, RSAB, RPC, RFC Series Consulting Editor (RSCE), and IETF LLC. Finally, this document establishes the Editorial Stream for publication of future policy definition documents produced through the processes defined herein.This document obsoletes RFC 8728. This document updates RFCs 7841, 8729, and 8730. For the definition of Status, see RFC 2026. For the definition of Stream, see RFC 8729."
