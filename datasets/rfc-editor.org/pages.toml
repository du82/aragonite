["https://rfc-editor.org/info/rfc8728"]
title = "Information on RFC 8728 » RFC Editor"
full_description = 'RFC 8728 RFC Editor Model (Version 2), February 2020 File formats: Also available: XML file for editing Status:INFORMATIONAL Obsoletes:RFC 6635 Obsoleted by:RFC 9280 Authors:O. Kolkman, Ed.J. Halpern, Ed.R. Hinden, Ed. Stream:IAB Cite this RFC: TXT | XML | BibTeX DOI: https://doi.org/10.17487/RFC8728 Discuss this RFC: Send questions or comments to the mailing list iab@iab.org Other actions: Submit Errata | Find IPR Disclosures from the IETF | View History of RFC 8728 Abstract The RFC Editor model described in this document divides the responsibilities for the RFC Series into three functions: the RFC Series Editor, the RFC Production Center, and the RFC Publisher. Internet Architecture Board (IAB) oversight via the RFC Series Oversight Committee (RSOC) is described, as is the relationship between the IETF Administration Limited Liability Company and the RSOC. This document reflects the experience gained with "RFC Editor Model (Version 1)", documented in RFC 5620; and obsoletes RFC 6635 to replace all references to the IETF Administrative Support Activity (IASA) and related structures with those defined by the IASA 2.0 Model. For the definition of Status, see RFC 2026. For the definition of Stream, see RFC 8729.'
