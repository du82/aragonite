["https://www.rfc-editor.org/errata/rfc3205"]
title = "RFC Errata Report » RFC Editor"
full_description = '''RFC Errata Errata Search RFC Number: Errata ID: Source of RFC Status: All/Any Verified+Reported Verified Reported Held for Document Update Rejected Area Acronym: All/Any app art gen int ops rai rtg sec tsv wit Type: All/Any Editorial Technical WG Acronym: Submitter Name: Other: All/Any IAB INDEPENDENT IRTF Legacy Editorial Date Submitted: Summary Table Full Records <!-- document.forms.query.rfc.focus(); //--> Found 1 record. Status: Rejected (1) RFC 3205, "On the use of HTTP as a Substrate", February 2002 Note: This RFC has been obsoleted by RFC 9205 Source of RFC: Legacy Errata ID: 4299 Status: Rejected Type: Editorial Publication Format(s) : TEXT Reported By: Anthony Yu Date Reported: 2015-03-12 Rejected by: Barry Leiba Date Rejected: 2015-03-12 Section 2.3 says: This further requires that each client know the secret to be used with each server, but it does not provide any means of securely transmitting such secrets between the parties. It should say: This further requires that each client knows the secret to be used with each server, but it does not provide any means of securely transmitting such secrets between the parties. Notes: Grammatical mistake: each client knowS --VERIFIER NOTES-- Actually, it is not a grammatical error, but is grammatically correct. It's using the subjunctive mood, which is appropriate with "requires" (and other verbs, such as "insists", "hopes", and so on). Subjunctive mood is fading in English, with a few notable exceptions ("So be it," "If I were king," and the like), but it's still around here and there. In most cases, as here, the subjunctive form is only distinctive in the third person: "This requires that he know the secret." Report New Errata'''
