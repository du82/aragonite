title = "Information on RFC 9748 » RFC Editor"
full_description = "RFC 9748 Updating the NTP Registries, February 2025 File formats: Also available: XML file for editing Status:PROPOSED STANDARD Updates:RFC 5905, RFC 5906, RFC 7821, RFC 7822, RFC 8573 Author:R. Salz Stream:IETF Source:ntp (int) Cite this RFC: TXT | XML | BibTeX DOI: https://doi.org/10.17487/RFC9748 Discuss this RFC: Send questions or comments to the mailing list ntp@ietf.org Other actions: Submit Errata | Find IPR Disclosures from the IETF | View History of RFC 9748 Abstract The Network Time Protocol (NTP) and Network Time Security (NTS) documents define a number of registries, collectively called the NTP registries.Some registries are correct, but some include incorrect assignments and some don't follow common practice. For the sake of completeness, this document reviews all NTP and NTS registries, and corrects the registries where necessary.This document updates RFCs 5905, 5906, 7821, 7822, and 8573. For the definition of Status, see RFC 2026. For the definition of Stream, see RFC 8729."
