["https://rfc-editor.org/info/rfc6322"]
title = "Information on RFC 6322 » RFC Editor"
full_description = "RFC 6322 Datatracker States and Annotations for the IAB, IRTF, and Independent Submission Streams, July 2011 File formats: Status:INFORMATIONAL Author:P. Hoffman Stream:IETF Source:NON WORKING GROUP Cite this RFC: TXT | XML | BibTeX DOI: https://doi.org/10.17487/RFC6322 Discuss this RFC: Send questions or comments to the mailing list iesg@ietf.org Other actions: Submit Errata | Find IPR Disclosures from the IETF | View History of RFC 6322 Abstract This document describes extending the IETF Datatracker to capture and display the progression of Internet-Drafts that are intended to be published as RFCs by the IAB, IRTF, or Independent Submissions Editor. The states and annotations that are to be added to the Datatracker will be applied to Internet-Drafts as soon as any of these streams identify the Internet-Draft as a potential eventual RFC, and will continue through the lifetime of the Internet-Draft. The goal of adding this information to the Datatracker is to give the whole Internet community more information about the status of these Internet-Drafts and the streams from which they originate. This document is not an Internet Standards Track specification; it is published for informational purposes. For the definition of Status, see RFC 2026. For the definition of Stream, see RFC 8729."
