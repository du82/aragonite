title = "RFC Errata Report » RFC Editor"
full_description = '''RFC Errata Errata Search RFC Number: Errata ID: Source of RFC Status: All/Any Verified+Reported Verified Reported Held for Document Update Rejected Area Acronym: All/Any app art gen int ops rai rtg sec tsv wit Type: All/Any Editorial Technical WG Acronym: Submitter Name: Other: All/Any IAB INDEPENDENT IRTF Legacy Editorial Date Submitted: Summary Table Full Records <!-- document.forms.query.rfc.focus(); //--> Found 4 records. Status: Verified (2) RFC 3405, "Dynamic Delegation Discovery System (DDDS) Part Five: URI.ARPA Assignment Procedures", October 2002 Note: This RFC has been updated by RFC 8958 Source of RFC: urn (app) Errata ID: 2687 Status: Verified Type: Technical Publication Format(s) : TEXT Reported By: Joe Abley Date Reported: 2011-01-20 Verifier Name: Alexey Melnikov Date Verified: 2011-01-20 Section 8 says: To: register@URI.ARPA From: The IETF URN Working Group Key: urn Authority: RFC2141 Record: urn IN NAPTR 0 0 "" "" "/^urn:([^:]+)/\\2/i" . It should say: To: register@URI.ARPA From: The IETF URN Working Group Key: urn Authority: RFC2141 Record: urn IN NAPTR 0 0 "" "" "/^urn:([^:]+)/\\1/i" . Notes: The uncorrected, original text contains a regular expression which is invalid -- it includes a back-reference \2 with no corresponding second enclosure. The correction is to make the back-reference \1, i.e. a reference to the single enclosure present in the regular expression. Errata ID: 2688 Status: Verified Type: Technical Publication Format(s) : TEXT Reported By: Joe Abley Date Reported: 2011-01-20 Verifier Name: Alexey Melnikov Date Verified: 2011-01-20 Section 4 says: http IN NAPTR 100 100 "" "" "/http:\\/\\/([^\\/:]+)/\\2/i" . It should say: http IN NAPTR 100 100 "" "" "/http:\\/\\/([^\\/:]+)/\\1/i" . Notes: The uncorrected, original text contains a regular expression which is invalid -- it includes a back-reference (\2) with no corresponding second enclosure. The correction is to make the back-reference \1, i.e. a reference to the single enclosure present in the regular expression. Status: Rejected (2) RFC 3405, "Dynamic Delegation Discovery System (DDDS) Part Five: URI.ARPA Assignment Procedures", October 2002 Note: This RFC has been updated by RFC 8958 Source of RFC: urn (app) Errata ID: 2842 Status: Rejected Type: Technical Publication Format(s) : TEXT Reported By: Mykyta Yevstifeyev Date Reported: 2011-06-23 Rejected by: Peter Saint-Andre Date Rejected: 2011-06-23 Section 3; 12 says: 3. Registration Policies The creation of a given URI scheme or URN namespace id (NID) follows the appropriate registration documents for those spaces. URI schemes follow "Registration Procedures for URL Scheme Names" (RFC 2717) [10]. URN namespace ids follow "URN Namespace Definition Mechanisms" (RFC 2611) (or updates thereto) [9]. 3.1 URI.ARPA Registration 3.1.1 Only Schemes in the IETF Tree Allowed In order to be inserted into the URI.ARPA zone, the subsequent URI scheme MUST be registered under the IETF URI tree. The requirements for this tree are specified in [10]. [ . . . ] [9] Faltstrom, P., Iannella, R., Daigle, L. and D. van Gulik, "URN Namespace Definition Mechanisms", BCP 33, RFC 2611, October 1998. [10] Petke, R. and I. King, "Registration Procedures for URL Scheme Names", BCP 35, RFC 2717, January 1999. It should say: 3. Registration Policies The creation of a given URI scheme or URN namespace id (NID) follows the appropriate registration documents for those spaces. URI schemes follow "Guidelines and Registration Procedures for New URI Schemes" (RFC 4395) [10]. URN namespace ids follow "Uniform Resource Names (URN) Namespace Definition Mechanisms" (RFC 3406) (or updates thereto) [9]. 3.1 URI.ARPA Registration 3.1.1 Only Schemes in the IETF Tree Allowed In order to be inserted into the URI.ARPA zone, the subsequent URI scheme's specification MUST be first approved by IESG (formerly known as IETF Tree URI schemes, per [11]). [ . . . ] [9] Daigle, L., van Gulik, D., Iannella, R., and P. Faltstrom, "Uniform Resource Names (URN) Namespace Definition Mechanisms", BCP 66, RFC 3406, October 2002. [10] Hansen, T., Hardie, T., and L. Masinter, "Guidelines and Registration Procedures for New URI Schemes", BCP 35, RFC 4395, February 2006. [11] Petke, R. and I. King, "Registration Procedures for URL Scheme Names", BCP 35, RFC 2717, January 1999. Notes: RFC 4395 eliminated URI schemes trees; this erratum is to incorporate this change. Moreover, references are updated. --VERIFIER NOTES-- This erratum is rejected in accordance with <http://www.ietf.org/iesg/statement/errata-processing.html>. In particular, this erratum "proposes a change to the RFC that should be done by publishing a new RFC that replaces the current RFC". Therefore, "if the change is to be considered for future updates of the document, it should be proposed using channels other than the errata process, such as a WG mailing list". Errata ID: 2971 Status: Rejected Type: Editorial Publication Format(s) : TEXT Reported By: Mykyta Yevstifeyev Date Reported: 2011-09-15 Rejected by: Peter Saint-Andre Date Rejected: 2011-09-15 Section n/a says: N/A It should say: N/A Notes: This erratum report is to let the readers of RFC 3405 know that after register-uri and register-urn lists were restored in September 2011, new list archives may be found at <http://mm.icann.org/pipermail/register-uri/> and <http://mm.icann.org/pipermail/register-urn/> rather than IANA site. --VERIFIER NOTES-- This report does not consist of an erratum against the specification. Report New Errata'''
