title = "RFC Errata Report » RFC Editor"
full_description = '''RFC Errata Errata Search RFC Number: Errata ID: Source of RFC Status: All/Any Verified+Reported Verified Reported Held for Document Update Rejected Area Acronym: All/Any app art gen int ops rai rtg sec tsv wit Type: All/Any Editorial Technical WG Acronym: Submitter Name: Other: All/Any IAB INDEPENDENT IRTF Legacy Editorial Date Submitted: Summary Table Full Records <!-- document.forms.query.rfc.focus(); //--> Found 1 record. Status: Held for Document Update (1) RFC 1918, "Address Allocation for Private Internets", February 1996 Note: This RFC has been updated by RFC 6761 Source of RFC: cidrd () Errata ID: 1419 Status: Held for Document Update Type: Editorial Publication Format(s) : TEXT Reported By: Jack Parker Date Reported: 2008-05-07 Held for Document Update by: Pete Resnick Section 3 says: An enterprise that decides to use IP addresses out of the address space defined in this document can do so without any coordination with IANA or an Internet registry. It should say: An enterprise that decides to use IP addresses within the address space defined in this document can do so without any coordination with IANA or an Internet registry. Notes: There appears to be a slight difference in interpretation with the existing phrase, "out of the address space." This 'could' be interpreted to mean "outside of the address space," hence changing the meaning of the entire statement, if the section's context is not considered. In the interest of clarification, would it be possible to rephrase this particular section to "within the address space?" I'm aware of one case in particular where attorneys argued over this issue ad nauseum, regardless of the network architects attempting to intervene. Report New Errata'''
