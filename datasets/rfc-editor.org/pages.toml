title = "Information on RFC 5742 » RFC Editor"
full_description = "BCP 92 RFC 5742 IESG Procedures for Handling of Independent and IRTF Stream Submissions, December 2009 File formats: Status:BEST CURRENT PRACTICE Obsoletes:RFC 3932 Updates:RFC 2026, RFC 3710 Authors:H. AlvestrandR. Housley Stream:IETF Source:NON WORKING GROUP Cite this RFC: TXT | XML | BibTeX DOI: https://doi.org/10.17487/RFC5742 Discuss this RFC: Send questions or comments to the mailing list iesg@ietf.org Other actions: Submit Errata | Find IPR Disclosures from the IETF | View History of RFC 5742 Abstract This document describes the procedures used by the IESG for handling documents submitted for RFC publication from the Independent Submission and IRTF streams. This document updates procedures described in RFC 2026 and RFC 3710. This memo documents an Internet Best Current Practice. For the definition of Status, see RFC 2026. For the definition of Stream, see RFC 8729."
