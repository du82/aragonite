["https://rfc-editor.org/info/rfc8726"]
title = "Information on RFC 8726 » RFC Editor"
full_description = "RFC 8726 How Requests for IANA Action Will Be Handled on the Independent Stream, November 2020 File formats: Also available: XML file for editing Status:INFORMATIONAL Author:A. Farrel Stream:INDEPENDENT Cite this RFC: TXT | XML | BibTeX DOI: https://doi.org/10.17487/RFC8726 Discuss this RFC: Send questions or comments to the mailing list rfc-ise@rfc-editor.org Other actions: Submit Errata | Find IPR Disclosures from the IETF | View History of RFC 8726 Abstract The Internet Assigned Numbers Authority (IANA) maintains registries to track code points used by protocols such as those defined by the IETF and documented in RFCs developed on the IETF Stream.The Independent Submission Stream is another source of documents that can be published as RFCs. This stream is under the care of the Independent Submissions Editor (ISE).This document complements RFC 4846 by providing a description of how the ISE currently handles documents in the Independent Submission Stream that request actions from IANA. Nothing in this document changes existing IANA registries or their allocation policies, nor does it change any previously documented processes. For the definition of Status, see RFC 2026. For the definition of Stream, see RFC 8729."
