title = "Information on RFC 8729 » RFC Editor"
full_description = "RFC 8729 The RFC Series and RFC Editor, February 2020 File formats: Also available: XML file for editing Status:INFORMATIONAL Obsoletes:RFC 4844 Updated by:RFC 9280 Authors:R. Housley, Ed.L. Daigle, Ed. Stream:IAB Cite this RFC: TXT | XML | BibTeX DOI: https://doi.org/10.17487/RFC8729 Discuss this RFC: Send questions or comments to the mailing list iab@iab.org Other actions: Submit Errata | Find IPR Disclosures from the IETF | View History of RFC 8729 Abstract This document describes the framework for an RFC Series and an RFC Editor function that incorporate the principles of organized community involvement and accountability that has become necessary as the Internet technical community has grown, thereby enabling the RFC Series to continue to fulfill its mandate. This document obsoletes RFC 4844. For the definition of Status, see RFC 2026. For the definition of Stream, see RFC 8729."
