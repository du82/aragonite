["https://rfc-editor.org/info/rfc4846"]
title = "Information on RFC 4846 » RFC Editor"
full_description = 'RFC 4846 Independent Submissions to the RFC Editor, July 2007 File formats: Status:INFORMATIONAL Updated by:RFC 5744 Authors:J. Klensin, Ed.D. Thaler, Ed. Stream:IAB Cite this RFC: TXT | XML | BibTeX DOI: https://doi.org/10.17487/RFC4846 Discuss this RFC: Send questions or comments to the mailing list iab@iab.org Other actions: Submit Errata | Find IPR Disclosures from the IETF | View History of RFC 4846 Abstract There is a long-standing tradition in the Internet community, predating the Internet Engineering Task Force (IETF) by many years, of use of the RFC Series to publish materials that are not rooted in the IETF standards process and its review and approval mechanisms. These documents, known as "Independent Submissions", serve a number of important functions for the Internet community, both inside and outside of the community of active IETF participants. This document discusses the Independent Submission model and some reasons why it is important. It then describes editorial and processing norms that can be used for Independent Submissions as the community goes forward into new relationships between the IETF community and its primary technical publisher. This memo provides information for the Internet community. For the definition of Status, see RFC 2026. For the definition of Stream, see RFC 8729.'
