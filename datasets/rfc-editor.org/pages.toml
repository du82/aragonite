["https://www.rfc-editor.org/info/rfc9716"]
title = "Information on RFC 9716 » RFC Editor"
full_description = "RFC 9716 Mechanisms for MPLS Ping and Traceroute Procedures in Inter-Domain Segment Routing Networks, February 2025 File formats: Also available: XML file for editing Status:PROPOSED STANDARD Authors:S. HegdeK. AroraM. SrivastavaS. NinanN. Kumar Stream:IETF Source:mpls (rtg) Cite this RFC: TXT | XML | BibTeX DOI: https://doi.org/10.17487/RFC9716 Discuss this RFC: Send questions or comments to the mailing list mpls@ietf.org Other actions: Submit Errata | Find IPR Disclosures from the IETF | View History of RFC 9716 Abstract The Segment Routing (SR) architecture leverages source routing and can be directly applied to the use of an MPLS data plane. A Segment Routing over MPLS (SR-MPLS) network may consist of multiple IGP domains or multiple Autonomous Systems (ASes) under the control of the same organization. It is useful to have the Label Switched Path (LSP) ping and traceroute procedures when an SR end-to-end path traverses multiple ASes or IGP domains. This document outlines mechanisms to enable efficient LSP ping and traceroute procedures in inter-AS and inter-domain SR-MPLS networks. This is achieved through a straightforward extension to the Operations, Administration, and Maintenance (OAM) protocol, relying solely on data plane forwarding for handling echo replies on transit nodes. For the definition of Status, see RFC 2026. For the definition of Stream, see RFC 8729."
