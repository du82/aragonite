title = "RGBDS v0.3.9 notice | RGBDS"
description = "Caution: RGBDS 0.3.9 does not define the version symbols (RGBDS_MAJOR, RGBDS_MINOR, RGBDS_PATCH); this mistake was quickly fixed in 0.3.10, which is actually the only difference between these two versions."
full_description = "Version: v0.3.9RGBDS v0.3.9 notice Caution: RGBDS 0.3.9 does not define the version symbols (__RGBDS_MAJOR__, __RGBDS_MINOR__, __RGBDS_PATCH__); this mistake was quickly fixed in 0.3.10, which is actually the only difference between these two versions. Since 0.3.10 behaves otherwise identically to 0.3.9, we recommend you use 0.3.10 and its documentation instead. Thank you!Edit this page This is documentation for RGBDS v0.3.9, which is no longer actively maintained.For up-to-date documentation, see the latest version (v0.9.1).Version: v0.3.9RGBDS v0.3.9 notice Caution: RGBDS 0.3.9 does not define the version symbols (__RGBDS_MAJOR__, __RGBDS_MINOR__, __RGBDS_PATCH__); this mistake was quickly fixed in 0.3.10, which is actually the only difference between these two versions. Since 0.3.10 behaves otherwise identically to 0.3.9, we recommend you use 0.3.10 and its documentation instead. Thank you!Edit this page"
