["https://rgbds.gbdev.io/install"]
title = "Install RGBDS | RGBDS"
description = "Learn how to install RGBDS on your system obtaining ready binaries or compiling from source"
full_description = "Available install methodsOn this pageInstalling RGBDS Most people will want to use a stable release (the more recent the better). These are the operating systems for which pre-built executables of recent releases of RGBDS are available: Linux macOS Windows If none of these options fit your needs, you can build from source. Docker​ We distribute an official container image for RGBDS. It contains the built executables and the build dependencies, in case you want to compile from source. docker pull ghcr.io/gbdev/rgbds:latest Each released version has a corresponding tag, while the master tag reflects the latest Git commit. Installing a development version​ If you are willing to help us test new features, consider using a development version. Managing multiple versions​ If you need to frequently switch between different versions of RGBDS, consider using rgbenv, the RGBDS version manager."
