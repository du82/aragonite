["https://rgd.ca/articles/volunteer-of-the-month-genevi%C3%A8ve-metropolis-rgd"]
title = "RGD | Volunteer of the month: Geneviève Metropolis RGD"
description = "Geneviève is a strategic design leader with hands-on product and service design expertise and 10+ years of experience empowering creative teams in fast-paced tech environments.She helps companies thrive by understanding their service ecosystem and identifying growth opportunities that balance value to people and deliver on business intent.She is passionate about shaping ways of working in organizations to foster human-centricity, systems thinking and evidence-based product practice. And she's known for nurturing a team culture where growth and inclusion flourish.From robotics to healthcare and consumer services, Geneviève has been entrusted with the digital experiences of some of the most recognized brands in Canada. At Shopify, her team designed the inbound logistics workflows, helping the business meet critical scale targets. Her work on the Canada Post website, mobile app and illustration system has brought lasting value to millions of Canadians. And she is proud to have shaped digital and physical services for patients and families at SickKids Hospital.Geneviève has actively supported the design community throughout her career and has been a proud RGD member since 2006."
full_description = "Home Articles InterviewAug 06, 2024 Volunteer of the Month: Geneviève Metropolis RGD Interview with Geneviève Metropolis RGD This August, we thank Geneviève Metropolis RGD for her contribution to the RGD community. “Genevieve has done exceptional work for both our organization and the UX/UI design community at large. She identified an opportunity to connect with a newer subset of designers and then rolled up her sleeves and got to work. Her organizational skills are unparalleled, and her thoughtfulness and inclusivity reflect a deep commitment to elevating the field. The UX/UI community is lucky to have someone like her advocating for them and I'm grateful she's chosen RGD to donate her efforts to.” Nicola Hamilton RGD Q: How long have you been volunteering with the RGD, and in what capacity?I've been a Member since 2008. Initially, my involvement was minimal, but over the years, I've taken on increasingly active roles. Becoming a mentor was an amazing experience. Additionally, I've served as a judge for the RGD Student Awards and hosted discussions at events. Recently, I've joined the Board with a focus on enhancing digital representation within the RGD, and I'm enthusiastic about the years ahead.Q: What contribution are you most proud of / What experience/memory stands out for you?I'm particularly proud of two contributions: First, nurturing a mentorship relationship that began about 10 years ago. We’re still in touch, and it’s been incredible to watch this person grow in their career. Second, I am proud of my recent work developing recommendations to enhance UX/XD representation within the RGD's programs. Working with an amazing group of peers and receiving support from Hilary, Heidi, Nicola, RGD staff and now the Board, has been incredibly rewarding. Q: What is the most surprising/unexpected thing to come out of volunteering with the RGD?The most surprising thing is realizing how much the organization is shaped by volunteer efforts. Before my intentional involvement with the UX/XD work, I didn’t fully understand how RGD relies on its volunteers to drive change and support its initiatives. It’s truly a case of getting out what you put in.Q. What have you learned about the industry since volunteering for the RGD?I’ve learned that the industry is changing rapidly, especially with the rise of digital. The RGD provides a unique space to form professional relationships outside of work and think critically about design’s evolving role. It offers a platform to discuss challenges, share experiences and advocate for the importance of design in shaping technology. “Geneviève has been an instrumental force within the newly formed RGD UX Advisory Group, adeptly bringing people together and driving momentum. Her leadership ensures that everyone feels included and valued, making her a cornerstone of our community’s progress. Geneviève’s ability to navigate complex discussions and foster collaboration is truly commendable, reflecting her deep commitment to the UX field and her exceptional skills as a leader.” Magued Hanna RGD Q: Based on your experience volunteering with the RGD, how would you describe the role of the organization in the industry?The RGD plays a crucial role in uniting designers, advocating for the profession and setting standards. The sense of belonging and community within the RGD is unique. It offers a safe space to share and celebrate each other’s work. As the industry evolves, the need for a united voice and strong professional standards remains essential.Q: What have you gained from being an RGD volunteer, and why would you recommend it to other Members who might be thinking of getting involved?Volunteering has enriched my experience as a Member. I’ve built meaningful relationships, shared ideas and helped shape the future of the RGD. The programs and initiatives we benefit from today exist because of past volunteers. By getting involved, you can contribute to this legacy and gain a deeper connection to the design community. I’d encourage anyone, whether new to the profession or experienced, to start a conversation and get involved. Q. Do you have thoughts on what you might like to do as a volunteer with the RGD in the future?In the future, I want to ensure our programs and initiatives represent a diverse range of disciplines within design. By fostering cross-disciplinary knowledge sharing, we can inspire and learn from each other under the RGD’s umbrella. My goal is to contribute to our strong, inclusive and collaborative design community. Geneviève Metropolis RGD Geneviève is a strategic design leader with hands-on product and service design expertise and 10+ years of experience empowering creative teams in fast-paced tech environments.She helps companies thrive by understanding their service ecosystem and identifying growth opportunities that balance value to people and deliver on business intent.She is passionate about shaping ways of working in organizations to foster human-centricity, systems thinking and evidence-based product practice. And she's known for nurturing a team culture where growth and inclusion flourish.From robotics to healthcare and consumer services, Geneviève has been entrusted with the digital experiences of some of the most recognized brands in Canada. At Shopify, her team designed the inbound logistics workflows, helping the business meet critical scale targets. Her work on the Canada Post website, mobile app and illustration system has brought lasting value to millions of Canadians. And she is proud to have shaped digital and physical services for patients and families at SickKids Hospital.Geneviève has actively supported the design community throughout her career and has been a proud RGD member since 2006. Mentioned in this article UX Managers & Designers Virtual Community Related Articles News Get involved with the RGD Interview Volunteer of the Month: Wendy Tabor RGD Interview Volunteer of the Month: Vanessa Eckstein RGD Interview Volunteer of the Month: Maggie Ostler RGD Interview Volunteer of the Month: Ashley Tomlinson Associate RGD Sponsored Sponsor WeirFoulds LLP is one of Canada’s oldest and most prestigious law firms. RGD Partner Sponsor User Experience Design! Learn More York University School of Continuing Studies Sponsor Is a career in advertising for you?"
