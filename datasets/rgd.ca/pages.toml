["https://rgd.ca/about/staff"]
title = "RGD | RGD Staff"
description = "Executive Director, Hilary Ashworth. Chief Operating Officer & Director of Membership, Heidi Veri. Creative Director, Karin Heinsch RGD."
full_description = "Home About Staff Staff Executive Director: Hilary Ashworth As the senior staff person appointed by RGD’s Board of Directors, Hilary oversees the operation, administration and management of the Association. Hilary directs the Association’s overall strategy, direction, policies and programming with the guidance of the Board and working committees in the areas of communications, ethics, education and more. Hilary spearheads RGD’s advocacy role, actively striving to improve standards and increase professionalism in the industry. Questions and concerns related to strategic direction and governance of the Association should be directed to Hilary. Chief Operating Officer & Director of Membership: Heidi Veri Heidi oversees the Association's membership, operations and financial management. She is RGD’s primary contact for obtaining RGD Certification. She manages all aspects of the RGD's Certification process, from the eligibility and application process to the portfolio presentation and providing results. Heidi ensures the Association remains in a healthy economic position and is using all of its resources as effectively and efficiently as possible. She works closely with the Executive Director, RGD Board and the Membership Committee to develop and implement member growth strategies and policies for the administration of the organization. Questions related to membership and operations should be directed to Heidi. Creative Director: Karin Heinsch RGD A Registered Graphic Designer herself, Karin oversees the brand image of the Association and provides graphic design services in support of our operations and activities. She is responsible for the creative direction of RGD marketing, promotion, publications and communications. Karin is also responsible for the design and management of RGD’s online presence, the pro bono participation of external designers on major initiatives such as DesignThinkers. Director of Communications & Development: Michelle Pereira Hampton Michelle manages RGD's relationships with industry partners and generates support for programs such as DesignThinkers and CreativeEarners. Companies interested in reaching the graphic design community in Toronto, Vancouver and across Canada are invited to contact Michelle. Communications Coordinator: Vanshika AnandVanshika edits and posts content for the RGD's email newsletter, website and Job Board. This includes information about the RGD’s events, programs and services, as well as the work and achievements of our Members.Members and related organizations are invited to contact Vanshika to find about sharing work, news, events and jobs with our audience. Community Engagement & PR Manager: Rebecca Dudgeon Rebecca works to engage and inform the RGD’s Membership and the larger graphic design community through social media, media outreach and a variety of program and advocacy initiatives. Rebecca also coordinates the activities of RGD’s Diversity & Inclusion Committee. Contact Rebecca about social media, media inquiries or RGD’s advocacy in support of industry best practices. Programs Manager: Abdul Omar Abdul coordinates speaker participation and programming for Canada's largest annual graphic design conference, DesignThinkers, held in Vancouver in May and Toronto in November. Abdul coordinates the activities of RGD's Programs Committee and facilitates local programming initiatives such as documentary screenings and portfolio review events. Questions related to our DesignThinkers Conferences, Webinars and other programs should be directed to Abdul. Graphic Designer: Isabella Marchena Isabella contributes to the brand image of the Association and provides graphic design services in support of our operations and activities. She designs RGD marketing and promotion, in particular RGD’s online presence including the RGD website, email newsletter and social media. Membership Manager: Zaria Pucknell Zaria is RGD’s primary contact for Provisional RGD & Affiliate Membership questions. If you are unsure of what category you are eligible for, Zaria is the person to contact. If you are already a Member, Zaria helps with dues payments, as well as questions about member benefits, member listings, ‘members only’ online access, job postings, Goodlife Fitness membership and more. Communications Manager: Rushika Shah Rushika develops and shares information about RGD’s programs and services as well as the work and achievements of our Members in RGD's email newsletter and website. Members and related organizations are invited to contact Rushika about sharing work, news and events with our audience. Sponsored Sponsor Putting Passion to Work: Your Partners For Digital, Marketing & Creative Staffing Sponsor Paper Trails: Finding the Perfect Line RGD Partner Sponsor Explore Domtar.com / Inspiration today! RGD Partner"
