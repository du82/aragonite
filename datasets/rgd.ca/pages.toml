["https://rgd.ca/articles/rebranding-by-eye-candy-design-for-herb-infused-coffee"]
title = "RGD | Rebranding by Eye Candy Design for Herb-infused Coffee"
description = "Amanda DeVries is the principal and creative director of Eye Candy Design, a boutique branding and packaging design firm that creates fresh, iconic work for food and beverage companies. She has nearly 20 years experience as a brand consultant, art director and graphic designer. Amanda spent the first 10 years of her career in Ottawa, where governmental agencies kept her busy but not terribly inspired. In 2010, her family moved to southwestern Ontario to start an organic vegetable farm and this presented her with the opportunity to work directly with entrepreneurs and business owners. She also enjoys sharing her knowledge through various teaching gigs and mentoring younger designers. She is the mother of 3 children who share her love of good food, vintage shopping and travel."
full_description = "Home Articles Case StudyJan 13, 2023 Rebranding by Eye Candy Design for Herb-infused Coffee Written by Amanda DeVries RGD, Eye Candy Design ContextCafézia offers a unique version of coffee that has been infused with tasteless herbs, giving it the abiility to reduce stomach upset and the “jitters” that sometimes come with drinking coffee. Such a coffee has a very specific positioning in this category and requires some degree of education to help consumers understand its benefits.The existing consumer confusion was around the idea of the herbs infused in the coffee: Was this coffee or an herbal substitute? Does it still contain caffeine? Does it taste different? We knew addressing these concerns would be the priority and took this into account during the exploration phase. Methodology We combined a leaf and coffee bean to represent the brand as an icon and created a series of packaging that clearly illustrates what you can expect to find within each bag. The project involved branding, standard coffee bags as well as sampler and wholesale sizes, shelf talkers and website mock-ups. The colour palette has been the most mentioned part of the project and is created to allow many variations in marketing materials and brand assets while still remaining true to the original aesthetic. Result We took full advantage of the real estate on the packaging to clearly illustrate the combination of herbs and coffee. The packaging received wide appreciation and gave the client confidence to expand the reach of the product beyond the current regional borders. The client was happy to share the following quantifiable results from the first 7 months: 25 additional cities in Ontario are carrying the product in retailer spaces11% growth in new and existing spaces and our favourite: 4 new retailers purchased the product based solely on the packaging and brand elements (did not try the coffee first) Credits: Website Development: Erika Blažejová Amanda DeVries RGD Eye Candy Design Amanda DeVries is the principal and creative director of Eye Candy Design, a boutique branding and packaging design firm that creates fresh, iconic work for food and beverage companies. She has nearly 20 years experience as a brand consultant, art director and graphic designer. Amanda spent the first 10 years of her career in Ottawa, where governmental agencies kept her busy but not terribly inspired. In 2010, her family moved to southwestern Ontario to start an organic vegetable farm and this presented her with the opportunity to work directly with entrepreneurs and business owners. She also enjoys sharing her knowledge through various teaching gigs and mentoring younger designers. She is the mother of 3 children who share her love of good food, vintage shopping and travel. Tag Brand & Packaging design Related Articles News The RGD unveils branding by Arcadis for our 2024 In-House Design Awards Case Study Contemporary identity for a traditional Japanese restaurant by Blok Vanessa Eckstein RGD Insight What are the signs that a company should start a rebranding process? Kyle Schruder RGD, Elana Rudick RGD Sponsored Sponsor Get your message delivered, the AFIX way! Sponsor Explore Domtar.com / Inspiration today! RGD Partner Sponsor We Tell Compelling Stories. Let’s Make Something Great Together! RGD Partner"
