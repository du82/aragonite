title = "RGD | Contemporary identity for a traditional Japanese restaurant by Blok"
full_description = "Home Articles Case StudyJul 13, 2023 Contemporary identity for a traditional Japanese restaurant by Blok Written by Vanessa Eckstein RGD By Vanessa Eckstein RGD, Founder and Creative Director at Blok design Ryuko is a new Japanese kitchen and bar restaurant in Calgary offering a space to connect through the value and love for food. Blok was commissioned to design the identity. One of the most important considerations was ensuring the design did not fall into visual cultural cliches, leading Blok to develop new ways to celebrate the richness of Japanese tradition in the visual language. Blok designed a flexible system that takes a contemporary approach to traditional Japanese sensibility, textures and imagery. In the research phase, the team explored historical iconography, a plethora of traditional Japanese woodcuts and designs highlighting simplicity, balance and harmony forming a base for the typography, colour palette and visual language. Ryuko in Japanese means both dragon and tiger, which captured perfectly the strong yet complementary personalities of the restaurant owners. Blok incorporated a tiger/dragon icon which enriched and graphically balanced, in the most simplified, minimalistic way, these two animals that carry so much meaning in Japanese culture. Blok also designed a custom stamp that was produced in Japan and used rice paper for the omakase menu that changes daily. Interested in submitting a project to be featured here? The RGD invites professional Members of the RGD to submit projects for consideration to be showcased across RGD channels. Fill out this form Vanessa Eckstein RGD Tags Brand & Packaging design Case Study Related Articles Insight Branding in Motion: 5 Identities given Life through Movement John Naboye Associate RGD Insight View our 10 Most Popular Webinars of 2020 Inspiration Looking Back: DesignThinkers 2010 Branding by Juniper Park Barry Quinn RGD Case Study Photography Gear labels inspire Subplot in rebrand for 