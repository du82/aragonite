full_description = "Home Membership Membership Join our community of like-minded professionals today Become a Member What our Members say “ I took advantage of all that the RGD offered when I was a student and grad. I now enjoy sharing my experiences with and being inspired by this thriving community. Gigi Lau RGD, Tundra Book Group, Penguin Random House Canada “ I admire that the RGD is continually working to elevate design and designers. Fostering a community of creators. Facilitating the exchange of knowledge and ideas. Caroline Toth RGD, Chartered Professional Accountants of British Columbia “ The RGD Slack has helped me find trusted freelancers and vendors that other Members have used. Rather than search Google and hope for the best, I've found people to work with who I trust. Kyle Schruder RGD, Creative Currency Exclusive access From webinars to resources to discounts, Members get access to a range of tangible benefits. Video Library Slack Community 2024 In-House Design Awards Get your Membership covered by your employer We’re here to help your employer see the value of an RGD Membership. Send them this outline of RGD benefits Discounts Take your design career to the next level with special perks, promotional benefits and essential resources. Perkopolis 5,000+ exclusive perks through Perkopolis Akran Marketing 40% off branded merchandise GoodLife Fitness 30% off regular rates for gym membership See all discounts Be part of a robust community Network, share insights and make career-long connections Whether it's attending DesignThinkers, volunteering on a Committee or asking a question on Slack, the RGD offers multiple ways for you to connect to the RGD community. Learn More Conferences Attend Canada's largest conference for visual designers DesignThinkers takes place in Vancouver in the spring and in Toronto in the fall with over 3,000 attending both events annually. Learn more Become a Member Want to take your membership to the next level? Distinguish yourself