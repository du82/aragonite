["https://rgd.ca/articles/rgds-year-in-review-2024"]
title = "RGD | RGD’s Year in Review: 2024"
full_description = "Home Articles NewsDec 10, 2024 RGD’s Year in Review: 2024 Photo by Katie Rainbow, pexels.com This year, saw the culmination of several exciting long-term initiatives, particularly with the launch of a new RGD website and media coverage resulting from a media strategy developed in 2023.RGD’s 2024 in Numbers Membership4,508 total Members47 new Certified RGDs115 Committee and Board Members10 Virtual Communities with 458 members48,000 interactions in the RGD's Slack Community with 1,849 participating MembersCommunications24 RGD Word e-newsletters sent to 24,107 subscribers43,849 followers across Instagram, LinkedIn and YouTube87 jobs posted to the RGD Job Board17,400 downloads of our new DesignThinkers Podcast19 presentations to school groups across Canada and 11 presentations on RGD CertificationEvents1,492 attendees at 36 webinars2,875 attendees at DesignThinkers conferences (2,175 in Toronto; 700 in Vancouver)540 attendees at 24 local events in Calgary, Charlottetown, Edmonton, Halifax, Kingston, London, Markham, Moncton, Ottawa, Toronto and Vancouver271 attendees at an In-House Design Conference (in-person and streaming)50 attendees at a Design Educators Conference$12,500 in cash scholarships and free passes to assist 19 Members to attend RGD conferencesAwards54 In-House Design Awards given21 Student Award Winners and 101 Honourable Mentions 8 Trailblazer Award Winners$24,000 raised from industry partners to support the Student & Trailblazer AwardsMentorship106 Mentee/Mentor matches made as part of the RGD’s various Mentorship Programs212 one-on-one portfolio reviews as part of three Virtual Career WeeksRGD’s 2024 Highlights Perhaps more importantly, the RGD continued to advocate on behalf of the profession and raise the profile of graphic design across Canada. In 2024, the RGD:Launched a new RGD website.Changed the Provisional RGD category name/designation to Associate RGD to better reflect the purpose of this category of Membership.Advocated against FIFA World Cup venue poster contest in Vancouver, in collaboration with DesCan, resulting in changes that allowed RGD Members to participate and in Seattle and Toronto’s FIFA contests being more ethical at launch.Launched a new XD Advisory Working Group to collaborate with existing RGD Committees to drive initiatives that enhance awareness, learning and connection opportunities for experience design professionals.Received media coverage from CTV News Vancouver, Vancouver Sun, Little Black Book and The Dialog. Ratified a new section for the Code of Ethics focused on cultural appropriation.Launched a new Project-based Mentorship Program.Launched a new DesignThinkers Podcast in celebration of 25 years of the conference, is featured in PRINT’s podcast studio. Organically grew the RGD’s Instagram following by 17% and LinkedIn by 16%.Launched a new Creative Earners Survey.Developed a new Career Workbook to help Members meet their career goals.Resumed more regular local in-person events, including with a series of Design Trivia Nights.Launched a new workshop series presented by Eleni Beveratou in 6 cities across Canada.Developed a new Career Workbook to help Members meet their career goals.Launched a newly-designed DesignThinkers website.Received design/branding support from Arcadis (In-House Design Awards), Context Creative (RGD website), Creative Currency (Creative Earners), Elana Rudick RGD (Certification Sticker), Forge Media (DesignThinkers website), Hambly + Woolley (Student Awards), Whitman Emorson (DesignThinkers), Vancouver Community College Students with creative direction by Sigrid Albert RGD (Design Educators Conference),Initiatives to look forward to in 2025Two new seasons of the DesignThinkers Podcast featuring interviews with 2025 and past speakers.Overhaul of the RGD’s Certification Process.Celebration of the 25th anniversary of DesignThinkers with the publication of a DesignThinkers book designed by Gilbert Li RGD. Return of the Design Educators Conference to Toronto, hosted by George Brown College.Increased useful, relatable and inspiring content across the RGD’s social media channels.Launch of the results of our 2024 Creative Earners Survey.Increased local events in more cities across Canada.Launch of the second edition of our Branding Awards.Continuation of the RGD’s media strategy to secure coverage about the Association, its initiatives and the value of the graphic design profession in Canada.Reprint of the RGD Handbook bringing the total printed to 23,000.2025 In-person events (add RGD events to your calendar)DesignThinkers Vancouver*, May 13–14DesignThinkers Toronto*, October 1–2In-House Design Conference* in Toronto and live streaming, June 19Design Educators Conference in partnership with George Brown School of Design in Toronto, October 32025 virtual events (sign up to receive weekly updates)Webinars, beginning January 9Virtual Career Weeks, February 5–10, June 17–22 & September 23–28Great Canadian Studio Crawl, March 22* Live-streaming of both DesignThinkers Conferences & the In-House Design Conference2025 awards programs Student Awards (Entry deadline: May 23)Trailblazer Awards (Entry deadline: May 23)Branding Awards (Final entry deadline: June 6) Related Articles News RGD’s Year in Review: 2023 Sponsored Sponsor Putting Passion to Work: Your Partners For Digital, Marketing & Creative Staffing Sponsor At Moveable, we’re ready to do whatever it takes to get your message out effectively. RGD Partner Sponsor Paper With A Plan: What Will You Make Today?"
