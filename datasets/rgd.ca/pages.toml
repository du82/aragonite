["https://rgd.ca/articles/intent-creates-a-detailed-easy-to-follow-visually-captivating-report-for-the-canadian-astronomical-society"]
title = "RGD | Intent creates a detailed, easy-to-follow, visually-captivating Report for the Canadian Astronomical Society"
description = "Every 10 years, the Canadian Astronomical Society (CASCA) lays out its vision for the ways in which Canada should invest in the future of astronomy— from small-scale ground-based facilities to large-scale investments in space astronomy. Intent was charged with making a document that spoke clearly and confidently to scientists and astronomers but that could also capture the attention of those not directly involved in the field. We were asked to make a document that was enticing to the viewer no matter where they opened it — a document that was composed of technical information that could still be visually pleasing."
full_description = 'Home Articles Case StudyJun 18, 2021 Intent creates a detailed, easy-to-follow, visually-captivating Report for the Canadian Astronomical Society Written by Ben Hagon RGD CONTEXTEvery 10 years, the Canadian Astronomical Society (CASCA) lays out its vision for the ways in which Canada should invest in the future of astronomy— from small-scale ground-based facilities to large-scale investments in space astronomy. Intent was charged with making a document that spoke clearly and confidently to scientists and astronomers, but that could also capture the attention of those not directly involved in the field. We were asked to make a document that was enticing to the viewer no matter where they opened it — a document that was composed of technical information that could still be visually pleasing.METHODOLOGY Our main takeaway from this project was just how important Canada’s role is in researching, investigating and uncovering the world beyond the stars. The recommendations put forth in this report all aim to answer fundamental questions about the origins of life on earth and throughout the cosmos, whether or not we’re alone in the universe and how we can keep pushing the boundaries of what is possible within the field of space exploration. PROJECT DETAILThis document is packed full of hyperlinks and interactive features, which proved challenging, educational and interesting for our team. There are literally hundreds of hyperlinks throughout this long document that all needed to be linked up in InDesign and thoroughly checked by the client. A lesson in focus and discipline! RESULTWe worked extensively with the CASCA project team to develop a report that not only fulfilled the need to layout a great deal of information, but that is visually appealing, tidy and easy to follow. While there certainly were challenges in finding the right balance between pure information and appealing visuals, we were able to develop a design language that made the sometimes dense material light and digestible. The result is a beautiful, informative roadmap for the next 10 years of space exploration in Canada. B Ben Hagon RGD Tag Case Study Related Articles Case Study Vibrant Signage System by Entro brings Unity to the Ingenium Centre Udo Schliemann RGD, Entro Case Study Inspired by the Architecture, Entro develops youthful Wayfinding and Environmental Graphics for McMaster Student Residence Entro Case Study Photography Gear labels inspire Subplot in rebrand for Clinton Hussey Photography Subplot Design Inc., Matthew Clark RGD, Roy White RGD Case Study An immersive Website by DDB featuring a tiny Cyclist taking you through Edmonton’s 2021 City Plan TBWA\Canada, Howard Poon RGD Case Study B3 and Clear Space engage community with a new name and identity for Oak Valley Health Clear Space Design, John Furneaux RGD Sponsored Sponsor Paper Trails: Finding the Perfect Line RGD Partner Sponsor Linda Mackie Creative: Breathing Life Into Your Image Sponsor Explore Domtar.com / Inspiration today! RGD Partner'
