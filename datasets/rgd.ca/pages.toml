full_description = "Home Articles NewsFeb 14, 2025 Enter the RGD's 2025 Branding Awards The wait is finally over! The RGD's 2025 Branding Awards are now open for entries, recognizing and celebrating the best in branding and identity design from around the world. These awards accept submissions from large and small studios, firms, in-house teams and students, providing an opportunity for designers at all levels to showcase their work and gain recognition within the industry. 2025 Branding Awards We’re excited to launch our Branding Awards 2025! Learn more about eligibility and how to apply now. Click on the button to start your entry form! Apply now If your work is selected by the judges as a Branding Award winner, you and your work will receive:Recognition on the RGD website and across RGD’s other communication channels, reaching over 70,000 in the creative community.Recognition in a physical exhibit presented at the DesignThinkers 2025 Conference taking place in Toronto (Oct 1-2).Opportunity to attend an awards presentation during DesignThinkers 2025 and receive a printed Certificate.Opportunity to purchase a physical award.A 20% discount to attend DesignThinkers 2025 in Toronto.Winners are contacted about opportunities to judge future RGD Awards, speak at events like DesignThinkers and contribute to the RGD newsletter, website and social media content. With categories spanning Integrated Awards, Element Awards and Best of Show, there are multiple opportunities to get recognized.Early bird entry fees are available until May 1, 2025. Regular submissions close on June 9, 2025.For full details on categories, entry fees, deadlines and how to submit, visit the RGD Branding Awards Page. Tag Awards Related Articles News ZAK is the Design Partner for the 2025 RGD Branding Awards News The RGD announces design partner for new RGD Branding Awards Case Study 2024 National Magazine Awards’ brand identity by Made by Emblem News The RGD unveils branding by Arcadis for our 2024 In