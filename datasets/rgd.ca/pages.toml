["https://rgd.ca/certification/preparation-support/case-studies-2"]
title = "RGD | Tips for building your Case Studies"
full_description = "Home Certification Preparation Support Tips for building your Case Studies Tips for building your Case Studies Things to keep in mind before you submitCarefully review and edit your case studiesBe concise; remove unnecessary words and phrasesCheck spellingCheck grammarAsk someone else to proofreadConsistency: All case studies should have a consistent writing style.Collaboration: If one of your projects was a collaborative effort, clearly explain your role and responsibilities.Assumptions: While the certification reviewers are all designers, they are looking for you to demonstrate your knowledge, approach and workflow of the project. Don't make assumptions about what designers will know about a typical design process.Design Principles: Ensure design principles are exemplified throughout the case studies (and also referenced in your portfolio presentation).Solution: If possible, use quantitative and/or qualitative metrics to demonstrate how the project successfully solved the design problem, ultimately meeting the client's goals (i.e. client growth, website analytics, client quotes, and/or any details that help explain)Business: When possible, demonstrate and discuss how the design solved the business need. For In-House Candidates, if working with brand guidelines, when possible, please include them with your submission and reference how they were used during your presentation. Sponsored Sponsor Paper Trails: Finding the Perfect Line RGD Partner Sponsor Linda Mackie Creative: Breathing Life Into Your Image Sponsor Paper With A Plan: What Will You Make Today?"
