title = "RGD | Branding Awards Categories"
full_description = "Home Connecting & Learning Community Awards 2025 Branding Awards Branding Awards Categories Branding Awards Categories Integrated Awards (must include multiple branding elements)Branding Programs: A combination of multiple branded material/channels into a cohesive program (e.g. collateral, signage, website, social media and more). This award includes a sweeping design system for a given brand identity.Brand Identity — New Brand: Identities for brands that did not previously exist (e.g. Identity guides or brand strategy guides). This award goes to brands designed from scratch: a fresh company or a completely fresh identity.Brand Identity — Rebrand/Refresh: New or updated identities for existing brands. This category includes entries that reflect on a brand’s present identity and push it forward with a new take on the design. (Images of the original brand may be provided but are not required.Branded Campaign: Advertising and marketing campaigns with a unique and memorable brand and cohesive visual approach across a variety of material/channels.Element Awards (single branded elements)Logo/wordmark: Any graphic mark, emblem, symbol or abstract/figurative representing an organization, product, event and beyond.Packaging: Functional design that holds any product or allows for that product to be travelled with/protected/contained.Environmental / Experiential: Designs that address our surroundings. It can include branded spaces such as events, hospitality, pop-up environments, retail and workspaces.Digital: Any design that uses technology, data and digital platforms to communicate a brand identity. It can include websites, apps, social media, XR and more.Print: Any printed initiative that communicates a brand identity. It can include stationary, catalogues, calendars, collateral material and more.Motion: Any design that uses animation or filmmaking to enhance a brand identity. It can include commercials, explainer videos and more.Other: Any elements of a brand that live outside the present categories. This might include clothing, typeface, award and more.Best of Show(Awards will be given to top submissions based on the following categorizations)Large Creative Agency/Business: Work by and/or for a for-profit company where either the creative agency and/or the client comprises more than 25 employees.Medium Creative Agency/Business: Work by and/or for a for-profit company where either the creative agency and/or the client comprises 6–25 employees.Small Creative Agency/Business: Work by and/or for a for-profit company where either the creative agency and/or the client comprises less than 6 employees.Large Non-Profit/Institution/Government: Work by or for a non-profit organization, or governmental body, agency or department that comprises more than 25 employees.Medium Non-Profit/Institution/Government: Work by or for a non-profit organization, or governmental body, agency or department that comprises 6–24 employees.Small Non-Profit/Institution/Government: Work by or for a non-profit organization, or governmental body, agency or department that comprises less than 6 employees.Solo: Work by solo business owners and freelance designers.Student: Work by individuals currently enrolled in a recognized post-secondary educational institution. Sponsored Sponsor Get your message delivered, the AFIX way! Sponsor Paper Trails: Finding the Perfect Line RGD Partner Sponsor Realize your potential at the York University School of Continuing Studies RGD Partner"
