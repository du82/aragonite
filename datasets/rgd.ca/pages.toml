title = "RGD | Online Event Code of Conduct"
full_description = "Home About Policies & Positions Online Event Code of Conduct Online Event Code of Conduct At its events, the RGD seeks to create harassment-free experiences for everyone regardless of gender, gender identity and expression, sexual orientation, disability, physical appearance, body size, race, age or religion. All participants, including speakers, sponsors and volunteers, are expected to comply with this code of conduct to ensure a safe and welcoming environment for all in attendance. Harassment is understood as any behaviour that threatens another person or group, or produces an unsafe environment including: deliberate intimidation, stalking, harassing photography or recording, sustained disruption of sessions, panels or roundtable discussions, using racist, homophobic or perjorative language and unwelcome sexual attention. Participants asked to stop any harassing behaviour are expected to comply immediately or risk expulsion from the conference without warning or refund. If a participant feels this code of conduct has been breached, please report it and contact us at info@rgd.ca. Thank you for helping us make our event as enjoyable as possible. Sponsored Sponsor Is a career in advertising for you? Sponsor Linda Mackie Creative: Breathing Life Into Your Image Sponsor Get your message delivered, the AFIX way!"
