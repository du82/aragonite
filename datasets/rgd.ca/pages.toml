["https://rgd.ca/articles/top-5-innovative-beauty-packaging-designs-from-bygone-eras"]
title = "RGD | Top 5 innovative beauty packaging designs from Bygone Eras"
description = "Cosmetic packaging design has always been about more than function—it reflects the times. The aisles of a beauty store act as a mirror to society, showcasing our evolving attitudes toward women’s self-expression and highlighting contemporary design trends. Exploring the evolution of beauty packaging provides a unique lens into women's lives throughout history while offering inspiration for solving today’s design problems."
full_description = "Home Articles InsightJan 23, 2025 Top 5 Innovative beauty packaging designs from bygone eras Written by Crystal Carter RGD, Western University Cosmetic packaging has always been about more than function—the designs reflect the aesthetics and styles of the time when they were created. The beauty aisles in any store are a mirror on society, showcasing our evolving attitudes towards women’s self-expression and highlighting contemporary design trends. Exploring the evolution of beauty packaging provides a unique lens into women's lives through history while offering inspiration for solving today’s design problems.As a makeup artist-turned-creative director, here are my top five favourite beauty packaging designs from the past, along with design prompts to spark inspiration for your current projects. 1920s: Gilded Compacts In the wake of the Victorian era, women embraced makeup as a tool for self-expression. The 1920s popularized ornate compacts, allowing women to carry their beauty essentials tucked inside miniature works of art, perfect for on-the-go touch-ups.Design Prompt: Where can you add a touch of bespoke flair, just for the sake of it? 1960s: Revlon Couturine Lipstick Reviving the trend of packaging as objets d’art, in the 1960s, Revlon elevated lipstick to collectible status with their Couturine line—tiny dolls styled in fashionable outfits with lipstick inside. Yes, that’s real fur.Design prompt: How can you approach a current design challenge through a more playful lens? 1970s: Avon Lip Balms Avon’s lip balm packaging captured the carefree spirit of the 70s, drawing inspiration from pop art and American iconography. Bold colours and playful shapes turned everyday beauty products into eye-catching statements.Design prompt: Is there an opportunity to amplify impact through bold colour choices? 2000s: Dior Makeup Jewelry Dior reimagined makeup as a wearable luxury in the 2000s, introducing compacts disguised as jewelry. Lip gloss, blush and eyeshadow were cleverly tucked into embellished, portable accessories.Design prompt: Can you take something familiar and reimagine it for a new purpose? 1920s: Chanel No. 5 Perfume No list of iconic packaging is complete without Chanel No. 5. Its minimalist bottle was a bold departure from the ornate designs of its era, redefining luxury and becoming a cultural icon—canonized by Andy Warhol in his 1985 Ads series.Design prompt: Inspired by Coco Chanel’s advice—“Before you leave the house, look in the mirror and take at least one thing off”—what can you simplify to let your design breathe? Interested in contributing content for the RGD website and e-newsletter? The RGD invites Members to share projects, resources lists, case studies, top 5s and more to be featured on our website and in our bi-weekly newsletter Email us now! Crystal Carter RGD Western University Crystal Carter is a creative director and designer with nearly 20 years experience transmuting the stories behind brands into compelling, award-winning work. She is currently the Brand Designer at Western University, where she is responsible for the stewardship of the institution’s brand identity and its most strategic creative priorities. Tag Brand & Packaging design Related Articles Inspiration Top 5 Packaging Designs of 2021 Yurko Gutsulyak RGD Case Study Rebranding by Eye Candy Design for Herb-infused Coffee Amanda DeVries RGD Inspiration Top 10 tasty new restaurant brands from across Canada Vida Jurcic RGD Inspiration Awake Studio brings 70s nostalgia to Revival Records branding David Taylor RGD Sponsored Sponsor WeirFoulds LLP is one of Canada’s oldest and most prestigious law firms. RGD Partner Sponsor Paper With A Plan: What Will You Make Today? Sponsor At Moveable, we’re ready to do whatever it takes to get your message out effectively. RGD Partner Opportunities for Certified RGDs: Mentor, Judge and Grow Become a Certified RGD, and get an opportunity to sign up to do a virtual portfolio review, be a mentor or judge the student awards. Sharing your valuable knowledge and insights not only benefits these aspiring designers but also contributes to your own growth and to the design profession as a whole. Details on Certified RGD Membership"
