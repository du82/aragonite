["https://rgd.ca/articles/one23west-creates-campaign-with-underwater-visuals-for-aquamar-to-make-seafood-approachable"]
title = "RGD | ONE23WEST creates campaign with underwater visuals for Aquamar to make seafood approachable"
description = "Aquamar aims to break down the barriers to enjoying high-quality seafood at home and understand that many people don’t want to handle raw seafood or know how to prepare it. It can be intimidating. Thankfully, there’s a solution that isn’t frozen: use some plain fish sticks."
full_description = "Home Articles Case StudyDec 11, 2024 One23West creates campaign for Aquamar to make seafood more approachable ContextAquamar aims to break down the barriers to enjoying high-quality seafood at home, recognizing that many people don’t want to handle raw seafood or know how to prepare it. It can be intimidating. A disruptive product line like this needed a disruptive campaign to help it stand out from what people are used to seeing in the seafood category. This campaign celebrates seafood as an approachable, convenient option but also helps redefine the versatility of seafood for today’s busy consumer. MethodologyFor Aquamar’s ready-to-heat seafood products, One23West addressed a key challenge: many people find cooking seafood intimidating. Research revealed that consumers often see seafood as complicated and hard to fit into everyday meals. That insight inspired the concept of “Casual Seafood”—making seafood feel approachable, versatile and perfect for any occasion at home. This vision came to life through vibrant underwater visuals featuring people casually enjoying their meals in the ocean depths, surrounded by coral and fish. The imagery captivates and inspires, creating moments that would stop shoppers in their tracks. Emphasizing ease, Aquamar launched its new product line in grocery stores across Chicago, making seafood an exciting and effortless choice. ProcessThe One23West team collaborated with L’Éloi and Les Garçons to create underwater visuals that were realistic, bold and vibrant. The idea was to present people going about their everyday routine—eating dinner in the kitchen, having lunch while working from home, relaxing in the living room—as if it’s totally normal to be in the middle of the ocean! To keep the photography as authentic as possible, they focused on shooting in-camera and building everything in the studio: sand, water reflection and even floating hair and clothes, which were done practically. These details made the scenes feel alive and believable. Finally, we combined it by compositing the shots with an infinite water backdrop. The whole project was such a blast. Our clients at Aquamar and production partners were just as excited as we were to create something fresh and unexpected. ResultsIt's still early, but the initial media and sales results have been very strong. Aquamar has exceeded sales targets by 25% so far, and this campaign created a halo effect–seeing a 52% sales lift in existing products merchandised alongside this new line-up. Anecdotally the campaign has been very well received by consumers. Demo sampling in stores attracted large numbers of shoppers and resulted in sales lifts. Retailers have also gravitated towards this work, helping Aquamar with new listings in additional grocery stores.We also had exceptionally high click through rates on our ads across all channels, which is great to see because one of our goals was to drive people to the store locator. We over-doubled the expected CTR in channels like Google Discovery, Performance Max and Paid Search, specifically. Credits:Agency: ONE23WESTCreative Directors: Jordan Hamer, Spencer RyanArt Director: Marie CermakovaWriter: Rob TarryProducer: Aliya TamroAccount team: Matt McGarva, Tiana Pazdirek, Amelie RoyProduction Company: L'ÉLOIProducer team: Sebastien Hotte, Kristina Kirilyuk, Margaux ArnalArt/Set Design team: Jean-François Clément, Sébastien Kelly, Brian GrayFood Stylists: Heidi Bronstein, Ian MousseauHair/Makeup team: Thomas Rousseau, Nicolas Côté, Jay Forest, Cristina MendizabalPhotographer & Director: Les GarçonsPhotographers: David Rollins, Rob LeeLighting & Digi Tech: Tom DiSandolo, Kalden Dhatsenpa, Frederik RobitaillePost Production: Visual Box, BaillatRetouching (Visual Box): Gabriel Carbonneau, Lucas BayzelonAnimation (Baillat): Charles Spina, Jean-Sébastien Baillat, Luce Ruissy, Véronique Meloche Interested in contributing content for the RGD website and e-newsletter? The RGD invites Members to share projects, resources lists, case studies, top 5s and more to be featured on our website and in our bi-weekly newsletter Email us now! Tag Case Study Related Articles Case Study Font redesigns help The Globe and Mail adapt to changing news landscape Nick Shinn RGD Emeritus Case Study Make It Kitchener Identity by Intent Ben Hagon RGD Case Study Motion design for Screen Nova Scotia incorporates classic film iconography John deWolf RGD Case Study Q30 Design Inc. creates digital infrastructure to Map Ontario's Black Archives Tejashri Kapure RGD Case Study Jacknife rebrands Chair-man Mills, unifying nine companies under a single brand Michael Richardson RGD, Michael Kelar RGD Sponsored Sponsor We Tell Compelling Stories. Let’s Make Something Great Together! RGD Partner Sponsor User Experience Design! Learn More York University School of Continuing Studies Sponsor Paper Trails: Finding the Perfect Line RGD Partner Interested in submitting a project to be featured here? The RGD invites professional Members of the RGD to submit projects for consideration to be showcased across RGD channels. Fill out this form"
