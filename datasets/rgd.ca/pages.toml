["https://rgd.ca/articles/focus-on-benefits-the-rgd-directory-lets-you-showcase-your-work-and-unlock-opportunities"]
title = "RGD | Focus on Benefits: the RGD Directory lets you showcase your work"
description = "Ruth uses her creative talents to inform and delight at the City of Côte Saint-Luc (a municipality in the West End of Montreal), where she has worked for over 20 years as their in-house graphic designer with a special passion for print design. Fishtank Communications, her independent studio, focuses on clients within the arts and non-profit sectors. She is co-chair of RGD’s Membership Committee—where she helped to kick-start the Virtual Communities initiative, serves on the RGD Board, and has been a member of the Events Committee and judged student competitions."
full_description = "Home Articles NewsOct 31, 2024 Focus on Benefits: The RGD Directory lets you showcase your work and unlock opportunities Written by Ruth Farrugia RGD, City of Côte Saint-Luc RGD Membership has its privileges! As co-chair of the Membership Committee, I want to share some of the amazing resources and benefits that Membership provides and encourage all RGD Members to take advantage of them. If you’re not an RGD Member yet, now’s the time to join! Those three letters, RGD, convey know-how, professionalism and ethics. A potential employer or client has a stack of possible designers they can work with, but the RGD designation assures employers that they’re making an informed decision. There’s more to finding someone to work with than just their education, work experience and Certification. The RGD Directory is an invaluable tool to help you present your background, showcase examples of your work and explain why you do what you do so that potential clients and employers can find you. It’s time to complete your RGD profile! “My best repeat and most compelling clients found me via the RGD Directory and referred me to additional clients. The Directory is a great place to showcase the highlights of your skill and personality and position yourself as a professional designer.” Michelle Hopgood RGD Using the Find a Designer feature on the RGD website, clients and employers can search by name, keyword, skillset and location. They can also filter for Certified RGDs, Associate RGDs and others who are open to taking on freelance work. The Directory can display your portfolio pieces, with Associate RGDs having the option to post 6 pieces. Certified RGDs can post up to 12 pieces, accompanied by your supporting copy (project or campaign details, results, client feedback, awards, etc.). Instead of playing SEO roulette and hoping potential clients and employers find your website, your work is part of a centralized resource with the RGD stamp of approval. A resource that you and your clients can trust.If you have a gorgeous website, you can link to it in your RGD directory listing. If you’re killing it on social media, you can include links to your Instagram and LinkedIn. More eyes on your website and social media never hurt! You choose what to share. A prominent contact button clicks through to your email when your employer, or client-to-be, is ready to discuss a possible business relationship. An exciting new feature of the RGD Directory is the links to your RGD contributions. Have you contributed an article, been a Mentor or participated in another RGD program? Chances are it's highlighted on your profile. (If you're aware of a contribution you've made that's not listed, or you'd like to know the options for taking advantage of this feature, email vanshika@rgd.ca.)Your professional online presence is sometimes the only way a potential client or employer will find you. An RGD Directory listing can help you find matches with fruitful, long-term success. (Unlike some of those dating apps.) Search our database of RGD Members Search a comprehensive list of Canadian design professionals Browse Members Ruth Farrugia RGD City of Côte Saint-Luc Ruth uses her creative talents to inform and delight at the City of Côte Saint-Luc (a municipality in the West End of Montreal), where she has worked for over 20 years as their in-house graphic designer with a special passion for print design. Fishtank Communications, her independent studio, focuses on clients within the arts and non-profit sectors. She is co-chair of RGD’s Membership Committee—where she helped to kick-start the Virtual Communities initiative, serves on the RGD Board, and has been a member of the Events Committee and judged student competitions. Tag Membership Related Articles News Focus on Benefits: Virtual Communities bring designers together Ruth Farrugia RGD News Focus on Benefits: Access to the RGD video library anytime Ruth Farrugia RGD Insight Members share experiences in the Firm Owners' Virtual Community News Introducing the RGD Project-Based Mentorship Program Insight Members share experiences in Municipal Designers' Virtual Community Sponsored Sponsor WeirFoulds LLP is one of Canada’s oldest and most prestigious law firms. RGD Partner Sponsor User Experience Design! Learn More York University School of Continuing Studies Sponsor Paper Trails: Finding the Perfect Line RGD Partner"
