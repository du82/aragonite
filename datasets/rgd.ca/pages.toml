full_description = '''Home Articles NewsJan 24, 2024 View our 10 most popular webinars of 2023 From freelancing 101 to running an agency to designing for accessibility to wayfinding and signage, this list of our most attended webinars of 2023 has something for everyone. The RGD hosts 3-4 professional development webinars per month (free for all RGD Members) covering a range of topics. Stay tuned for more great presentations coming in 2024. Video library Members can view over 700 recorded presentations including DesignThinkers, past webinars and more Watch videos 10. Freelance without the free fall: Proposals Presented by Faron Dawe RGD In this webinar, Faron Dawe RGD shares how he approaches proposal-writing by walking through the general structure of a proposal, citing important information to include and how to present it to increase your chances for landing your next project. 9. How to start, run, grow and close an agency Presented by Stuart Thursby This webinar is for those thinking about starting their own thing—the wins, the losses, the things learned, the best resources and the "two big questions" Stuart kept asking himself at every key juncture: why am I doing this? And how/how else could that be accomplished? 8. Freelance without the free fall: Money management Presented by Faron Dawe RGD In this webinar, Faron Dawe RGD shares his formula for successfully managing administrative and financial tasks while doing the work you love stress-free. 7. Designing for voice: Learning from the disability community Presented by Samuel Proulx How can you allow for complex interactions without a screen? How can you allow users to express complex intentions without using a keyboard? In this webinar, you'll learn tips and techniques that will make sure you’re ready for the exciting future of voice-based design! 6. Design systems in practice: A step-by-step guide using figma Presented by Michael Carrick and Philippe Gommes In this webinar, learn how to use design systems in practice, using Figma as an example. You will learn how to create and customize different elements of a design system, including design components, styles and responsive layouts. 5. City wayfinding in toronto Presented by Juan Rioseco RGD, Associate Director at Steer In this presentation, Juan recollects the 'soup to nuts' story of the TO360 Wayfinding Strategy complex program and how each milestone contributed to a robust design solution reflective of Toronto's character and urban assets, supported by a sustainable governance and delivery model. 4. RGD in-House perspectives webinar Presented by Lisa Parkyn RGD and Simon Clancy In this webinar Lisa shows us how by harnessing the power of in-house branding, companies can generate excitement and create a strong connection between their brand and their target audience and Simon takes us through Canadian Tire’s Brand Design System presenting the operational and cultural change required to implement a design system. 3. Strategic typography for branding Presented by Leila Singleton In this webinar, you will understand the importance of weighting costs and utility as heavily as they do aesthetics when choosing corporate typefaces for employers and/or clients. You will also leave with ideas for typographic details that can help "brand" their typesetting. 2. Dreaming of better: A product designer's responsibility in accessibility Presented by Mohammad Owainati Product designers are positioned to play a vital role in pushing teams to think beyond compliance. In this webinar, Senior Product Designer Mohammad Owainati touches on his growth as a designer in relation to making better accessible experiences at Fable. 1. Design and accessibility: A powerful combination Presented by Emmanuelle Goodier and Wendy Lockyer In this webinar, learn about designing with accessibility in mind and efficient tagging in InDesign vs PDF. Hear tips for exporting correctly to PDF. Emmanuelle and Wendy will share practical lessons from their experience and help answer a common question “I followed the training, so why isn’t the PDF passing accessibility testing tools?”. Submit a proposal to present an RGD webinar Subscribe Stay in the know with RGD Word weekly news and events. Your email Please check your spam for the activation email after subscribing. (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[4]='FIRSTNAME';ftypes[4]='text';fnames[5]='LASTNAME';ftypes[5]='text';fnames[1]='MMERGE1';ftypes[1]='text';fnames[2]='MMERGE2';ftypes[2]='text';fnames[3]='MMERGE3';ftypes[3]='text';fnames[6]='SCHOOL';ftypes[6]='text';}(jQuery));var $mcj = jQuery.noConflict(true); Tags Business Education In-House Accessibility Related Articles Inspiration Business of Design: Common Client Onboarding Questions (& How to Respond) Katie Wilhelm RGD Interview Volunteer of the Month: Wendy Tabor RGD Insight A beginner's guide to exhibit design Stefan Canuel RGD Insight Accessibility in Canada: Manitoba Andrew Boardman RGD Interview Design+ passion projects Interviewed by Renee Taillon, Interviewed by Renee Taillon Sponsored Sponsor Get your message delivered, the AFIX way! Sponsor We are a different type of printing company. We like it that way and think you will too. RGD Partner Sponsor Is a career in advertising for you?'''
