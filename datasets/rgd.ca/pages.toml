["https://rgd.ca/articles/awake-studio-designs-the-website-to-launch-arcaniums-260-hybrid-table"]
title = "RGD | Awake Studio creates the brand to launch Arcanium’s 260 Hybrid Table"
description = "David has been working in the industry for 20+ years, having originally been bitten by the creative bug at Queen’s University where he studied visual arts and art history. He has been fortunate to name some of Canada’s top advertising and branding agencies as former employers, which include TBWA/Toronto, Cossette, TAXI, and Interbrand. His work on various major brands has been recognized by Cannes, Communications Arts, the National Advertising Awards, the Art Directors Club of Canada, Lotus, Coupe, and Applied Arts, amongst others. His work spans graphic design to creative direction and every type of project from brand identity to advertising campaigns and everything in between. It is his mandate to create a unique and strategically sound visual manifestation of each brand he works with in order to create consumer impact with each and every communication. In addition to working in the industry David has also helped to mold the next generation of creative minds. He worked as an Associate Professor at OCAD University from 2009 to 2012. He is currently the Principal/Creative Director at Awake Studio."
full_description = '''Home Articles Case StudyJan 23, 2025 Awake Studio creates the brand to launch Arcanium’s 260 Hybrid Table Written by David Taylor RGD, Awake Studio ContextArcanium is a team of passionate designers, makers and nerds (their words) on a quest to make innovative, beautiful furniture and accessories for the hobbyist in all of us. They make thoughtfully designed, sustainably crafted, long-lasting pieces that allow your passions to complement–not compete with–your space. They approached Awake as they were preparing to launch their debut flagship product: the 260 Hybrid Table, which transforms effortlessly between a sleek dining table and a versatile gaming centre. MethodologyPart of Arcanium’s self-proclaimed “nerd” status includes a strong connection to Dungeons and Dragons gaming. The lengthy nature of a D&D game led to the creation of the debut table, allowing the players to continue to use the dining tabletop without disrupting the play that is stored intact within. Since my design team and I are not "gamers", we spent a lot of time familiarizing ourselves with the gaming world and investigating the competitive set. Kevin and Ben from the team are very marketing and design-savvy clients, and because of this, the process was very iterative and felt like a true partnership. Through the process of establishing a verbal identity, we landed on the tagline “Design on a different plane,” which so clearly speaks to what Arcanium is establishing in terms of its product designs, as well as referencing the transformative panels of the 260 Hybrid Table.The core elements of the visual identity were all created with specific strategic intent. The Arcanium symbol, which depicts an abstracted “A,” showcases fluidity intended to convey their products' transformative and versatile attributes. The wordmark was created with an extended typeface to create a parallel with the extendable leaves of the transformative launch table. The lead colour of the brand palette is a modern, eye-catching green, which is intended to telegraph the sustainability mandate of the brand’s vision. ResultsThere are already gaming tables on the market that allow for continuous play, created by brands that have tapped into the gaming community. However, these brands leverage visual languages that employ tropes from the gaming world. The intent of Arcanium’s brand identity was to elevate the idea of play and not sink into gaming stereotypes. With this in mind, it was of the utmost importance to create a brand that felt like it could be embraced not only by the gaming community but by design-focused buyers as well. The trick was to straddle a line between not alienating the gaming world but also appealing to a mass market, one that prioritizes design, utility and sustainability.Over the last year and a half, we have worked with Arcanium to create a brand identity that marries their love of mid-century modern (which inspired the aesthetics of the 260 Hybrid Table design) with board games of all kinds. The identity is a little bit of 50s, a little shake of 80s nostalgia and a lot of modern impact, along with a colour palette that’s as flexible and impactful as the 260 Hybrid Table. Credits:Mark Ralph: Website design & developmentMike Tjioe: Photography Interested in submitting a project to be featured here? The RGD invites professional Members of the RGD to submit projects for consideration to be showcased across RGD channels. Fill out this form David Taylor RGD Awake Studio David has been working in the industry for 20+ years, having originally been bitten by the creative bug at Queen’s University where he studied visual arts and art history. He has been fortunate to name some of Canada’s top advertising and branding agencies as former employers, which include TBWA/Toronto, Cossette, TAXI, and Interbrand. His work on various major brands has been recognized by Cannes, Communications Arts, the National Advertising Awards, the Art Directors Club of Canada, Lotus, Coupe, and Applied Arts, amongst others. His work spans graphic design to creative direction and every type of project from brand identity to advertising campaigns and everything in between. It is his mandate to create a unique and strategically sound visual manifestation of each brand he works with in order to create consumer impact with each and every communication. In addition to working in the industry David has also helped to mold the next generation of creative minds. He worked as an Associate Professor at OCAD University from 2009 to 2012. He is currently the Principal/Creative Director at Awake Studio. Tag Case Study Related Articles Case Study Briteweb designs WCAG-Level AAA website for The Chicago Lighthouse Jay Wall RGD Case Study An immersive Website by DDB featuring a tiny Cyclist taking you through Edmonton’s 2021 City Plan TBWA\Canada, Howard Poon RGD Case Study Identity design for a theatre by ION reflects its new offerings David Coates RGD Case Study Motion design for Screen Nova Scotia incorporates classic film iconography John deWolf RGD Case Study Q30 Design Inc. creates digital infrastructure to Map Ontario's Black Archives Tejashri Kapure RGD Sponsored Sponsor Paper With A Plan: What Will You Make Today? Sponsor Is a career in advertising for you? Sponsor At Moveable, we’re ready to do whatever it takes to get your message out effectively. RGD Partner'''
