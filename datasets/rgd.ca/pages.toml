title = "RGD | Get involved with the RGD"
full_description = '''Home Articles NewsFeb 07, 2024 Get involved with the RGD One of the most effective ways to make the most of your RGD Membership is by volunteering. We offer a wide array of opportunities to our Members to connect, give back, support each other and lead initiatives that not only benefit our industry, but also help you grow as a person. Some of the way you can get involved are: Serve on an RGD CommitteeJoin or lead a Virtual CommunityAct as a Mentor to a Certification candidateAct as a MentorSponsor an RGD Student AwardConduct Virtual Portfolio Reviews for grads applying for Provisional RGD MembershipPresent at an RGD webinar or RGD conferenceContribute editorial content to the RGD website & e-newsletterSubmit a project to be featured on the RGD's social media channels, including on Instagram and LinkedInJudge Awards (Certified RGDs/Prov RGDs only)Help to organize events Designers Supporting Designers: Get Involved Tell us how they would like to contribute to our initiatives and support the design community. Fill out this form Below, past volunteers share their experience:"[By volunteering with the RGD] I’ve gained opportunities, I’ve gained experience and I’ve gained friends in the process." — Diana Varma RGD"The Association has provided several opportunities to volunteer at different capacities at different times, so as bad as I felt saying no to some things thinking they'll never ask me again, that wasn't true. That's my recommendation to other Members who might be thinking of getting involved—do what you can when you can. Like anything, the more you contribute, the more you get out of it." — Victor Szeto RGD"By being an RGD volunteer, I have gained friendships, mentorships and opportunities to give back and make a difference in the industry. So if you have time to spare, just take the plunge – get involved. Try something different, meet new friends, show up, contribute your thoughts and ideas, get ready to be inspired by others along the way." — Xandr Sutjiadi RGD"Volunteering with the RGD really helped me connect with people who gave me great advice and took a genuine interest in my career." — Rupsha Mutsuddi Provisional RGD Mentioned in this article Find out more about RGD Committees Related Articles Interview Volunteer of the Month: Dominic Ayre RGD Insight Members share experiences in the Firm Owners' Virtual Community Sponsored Sponsor Realize your potential at the York University School of Continuing Studies RGD Partner Sponsor Paper With A Plan: What Will You Make Today? Sponsor Linda Mackie Creative: Breathing Life Into Your Image'''
