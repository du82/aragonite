["https://rgd.ca/articles/posters-by-two-of-our-ukrainian-members"]
title = "RGD | Posters by two of our Ukrainian Members"
description = "Yurko Gutsulyak is an accomplished design wizard with over 20 years of mastery in the field. He is the Creative Director and Co-Founder of the award-winning Gutsulyak.Studio, globally known for its exquisite design, focused on identity and packaging. Yurko Gutsulyak's expertise and success led him to launch the studio in North America and Europe, operating between New York, Toronto, and Kyiv. Gifted with an inventive mind, Yurko Gutsulyak has taken part in creating hundreds of unique projects that have earned over 150 reputable awards, including Red Dot, European Design Awards, Epica Awards, Pentawards, Dieline Awards, Communication Arts, and Graphis. He is also a passionate advocate for pushing the art world's boundaries, sharing his insights and inspirations through articles, talks, and workshops. His interviews have been published in leading print design magazines, including Novum (Germany), idPure (Switzerland), +design (Greece), idN (Hong Kong), telegraf (Ukraine), Font (Czech Republic), and Brand (China). Countless others have appeared in digital media. His expertise and achievements have earned him a place as a respected design judge in the United States, Canada, Ukraine, Poland, Slovenia, South Korea, Taiwan, and other countries. Additionally, several of his iconic works have been exhibited in museums around the globe."
full_description = '''Home Articles InspirationMar 22, 2022 Posters by two of our Ukrainian Members Written by Yurko Gutsulyak RGD, Gutsulyak.Studio and Alexey Makhinko RGD, Altan Design The violence perpetrated by Russia in Ukraine has been devastating for Ukrainians all over the world. Yurko Gutsulyak RGD and Alexey Makhinko RGD share posters they've designed to raise awareness about the Russian invasion and garner support. Yurko Gutsulyak RGD Posters designed by Yurko Gutsulyak RGD"On February 24, 2022, Russia has started a full-scale war against Ukraine. There is nothing new about Russian aggression towards its neighbouring countries, especially Ukraine. For centuries Russia killed Ukrainians and tried to obliterate the Ukrainian culture. Numerous generations of Russians supported that hostility silently or actively. According to recent research, more than half the population of Russia openly supports the war against Ukraine. Wholeheartedly, I stand with Ukraine. As a designer, I see my mission to raise awareness about this evil crime, explain the origin of shameful Russian hatred and encourage people around the globe to help Ukraine in all possible ways. We, the designers, are proud of our talents, we have the power to change the world and we keep mentioning that constantly during peaceful times. Now is the time to act and show what we are worth in practice. Show that you care, raise your voice and support Ukraine." Alexey Makhinko RGD"This war already took so many lives of innocent people, kids, women, seniors—the total destruction of small towns and devastating bombardment of large cities such Kharkiv and Mariupol. Bombs and rockets fall on the Theatres, Art Centres, Museums and many apartment buildings. "UWC & #NoFlyZone" Social Media Posts designed by Alexey Makhinko RGDI have family in many corners of Ukraine. Relatives from Kharkiv fleed the city under the constant shelling and are now scattered around Ukraine and Europe. It is tough to watch and hear the news each day. It feels like one long day; sometimes, I can't even tell if that is Monday or Saturday today. My wife and I donated to the charities, participated in the fundraising Art auction and provided food and medical supplies for humanitarian cargo. We also created posters to communicate the anti-war messages. We are doing what we can to help our community in Canada and back home. "Shelter our Sky" and "Russian Peace Poster" by Tatiana Rusanovska, Illustrator.I was genuinely touched when some of my fellow RGD colleagues emailed me, offered help and asked how my relatives were doing. Thank you! As communicators, I am sure our association can be united and help spread the messages that support the Ukrainian people in this historic fight for their right to be an independent, democratic and free society." "Now you know the name of these Ukrainian towns" Posters designed by Alexey Makhinko RGDTo share your work created to support the people of Ukraine, email Vanshika Anand at vanshika@rgd.ca Yurko Gutsulyak RGD Gutsulyak.Studio Yurko Gutsulyak is an accomplished design wizard with over 20 years of mastery in the field. He is the Creative Director and Co-Founder of the award-winning Gutsulyak.Studio, globally known for its exquisite design, focused on identity and packaging. Yurko Gutsulyak's expertise and success led him to launch the studio in North America and Europe, operating between New York, Toronto, and Kyiv. Gifted with an inventive mind, Yurko Gutsulyak has taken part in creating hundreds of unique projects that have earned over 150 reputable awards, including Red Dot, European Design Awards, Epica Awards, Pentawards, Dieline Awards, Communication Arts, and Graphis. He is also a passionate advocate for pushing the art world's boundaries, sharing his insights and inspirations through articles, talks, and workshops. His interviews have been published in leading print design magazines, including Novum (Germany), idPure (Switzerland), +design (Greece), idN (Hong Kong), telegraf (Ukraine), Font (Czech Republic), and Brand (China). Countless others have appeared in digital media. His expertise and achievements have earned him a place as a respected design judge in the United States, Canada, Ukraine, Poland, Slovenia, South Korea, Taiwan, and other countries. Additionally, several of his iconic works have been exhibited in museums around the globe. Alexey Makhinko RGD Altan Design Alexey is an internationally acclaimed multidisciplinary designer and art director with over two decades of experience collaborating with retail, broadcasting, publishing, arts, food and service businesses. Raised in Ukraine and inspired by his father, an engineer and designer, Alexey completed his studies in Industrial Design in Kyiv, which has provided him with the strategic problem-solving capabilities of combining art, business and engineering to help drive his innovative designs. After starting a successful career in the creative field back home, Alexey moved to Canada in 2003 and has since worked for retail chains such as Toys”R”Us, Carlton Cards, and Staples; become a certified member of the Association of Registered Graphic Designers of Ontario and has completed a Marketing Certificate Program from the University of Toronto to broaden his knowledge of strategic marketing, brand development and customer loyalty. Recently, Alexey became a part-time professor at the Seneca Polytechnic. With his industry knowledge, breadth of expertise and vast network of suppliers, Alexey co-founded Altan Design—a boutique branding and creative studio where he purposefully combines design aesthetics with a crystal-clear understanding of what your business stands for and whom your customers expect you to be. Related Articles Insight Resources for designers' self development Yurko Gutsulyak RGD Inspiration Top 5 Packaging Designs of 2021 Yurko Gutsulyak RGD Insight Six Ukrainian designers and their contribution to Canadian design Yurko Gutsulyak RGD Inspiration Top 5 Movie Posters of the Decade John Godfrey Case Study Chargefield wins at SXSW Film & TV Festival for 7 Beats Per Minute poster design John Godfrey Sponsored Sponsor Explore Domtar.com / Inspiration today! RGD Partner Sponsor Linda Mackie Creative: Breathing Life Into Your Image Sponsor Is a career in advertising for you?'''
