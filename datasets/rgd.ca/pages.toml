["https://rgd.ca/articles/q30-design-inc-creates-digital-infrastructure-to-map-ontarios-black-archives"]
title = "RGD | Q30 Design Inc. creates digital infrastructure to Map Ontario's Black Archives"
full_description = "Home Articles Case StudyOct 19, 2024 Q30 Design Inc. creates digital infrastructure to Map Ontario's Black Archives Written by Tejashri Kapure RGD, Q30 Design Inc. ContextMOBA’s goal was to build digital infrastructure to enhance the visibility and discoverability of Black archives in Ontario. This involved creating a comprehensive inventory of Black Ontarian archival collections and using storytelling to demonstrate how archives are utilized by creative communities. Over a five-year period, the project seeks to evaluate how to bridge the knowledge gap between Black archival collections and Black history in the province.The MOBA website and branding had two strategic objectives. The first was to introduce the organization, give people a taste of what kinds of materials are available in Ontario, and encourage people to use them and share them in their research and creative projects. The client will be able to expand listings and have a fully searchable database of the archives and the collections within them. The second objective flows from the first. The site is a tool that successfully builds interest and directly supports securing ongoing funding. MethodologyFrom the outset, we all agreed that this shouldn’t be about displaying old artifacts in a straightforward, muted and sombre way; rather, we wanted it to be more celebratory, energetic and inspiring. In short, we didn’t want it to look like a traditional archive or library site. We took inspiration from 50s and 60s album covers and entertainment and activist posters from the time. A bit of DIY ‘zine culture’ aesthetics also crept in. We balanced the looser feel with a restrained colour palette using only two colours set off of deep charcoal. ProcessWe all worked together as a team. First, we learned about the existing materials, which were a large spreadsheet of archive locations and links. We then collaborated to establish a reasonable scope and a system for users to search and access archive content. We created wireframes and interactive prototypes to showcase how everything would work. Simultaneously, we developed style tiles and mood boards to gain approval for the visual direction. Our designers contributed numerous ideas, all of which were viable and exciting. After selecting one idea, we combined the visual style with the framework we established through our UX work and designed all the pages for mobile and desktop views. ResultsWe delivered the site on time with full WordPress editing capabilities. They can now independently add as many archives as they want. We launched with 13 locations, but they have over 50 more waiting to be added. This will make the site very useful as a comprehensive survey of Black archives in the province. Since the launch, the organization has secured five years of funding to build the site archives further and add other relevant stories. Other CreditsTejashri Kapure RGD, Creative DirectorShweta Sharma: DesignerK Andrews: UX DesignerJustin Hope: Developer Tejashri Kapure RGD Q30 Design Inc. Tag Case Study Related Articles Case Study 2024 National Magazine Awards’ brand identity by Made by Emblem Case Study Chargefield wins at SXSW Film & TV Festival for 7 Beats Per Minute poster design John Godfrey Case Study Font redesigns help The Globe and Mail adapt to changing news landscape Nick Shinn RGD Emeritus Case Study Make It Kitchener Identity by Intent Ben Hagon RGD Case Study Motion design for Screen Nova Scotia incorporates classic film iconography John deWolf RGD Sponsored Sponsor Explore Domtar.com / Inspiration today! RGD Partner Sponsor Realize your potential at the York University School of Continuing Studies RGD Partner Sponsor Paper Trails: Finding the Perfect Line RGD Partner"
