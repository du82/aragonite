["https://rgd.ca/about/partner-with-us/partner-organizations"]
title = "RGD | Association Partners"
full_description = "Home About Partner With Us Association Partners Association Partners ADCC : ﻿Advertising and Design Club of Canada With humble beginnings in 1948, the Advertising Design Club of Canada has grown from a small outfit in Toronto to being an internationally recognized organization that is dedicated to encouraging excellence in Canadian advertising and design. CAPIC: Canadian Association of Professional Image Creators L'Association Canadienne des Créateurs Professionnels de L'Image CAPIC is the collective voice and advocate for professional photographers, illustrators and digital artists in Canada. They work hard to maintain industry standards, create a community, fight for copyright protection, and much more. Their work helps all the professionals in the industry, but only members benefit fully. DIAC: Design Industry Advisory Committee RGD is a member of DIAC, a think tank and cross-disciplinary research group. The activities of DIAC promote the strategic value of design and the contribution of designers from all disciplines to economic, social and environmental goals. Utilizing a holistic perspective, DIAC emphasizes the positive impact that can be achieved through cross-disciplinary collaboration among designers from various disciplines. DIAC Board Members include senior representatives from a variety of professional associations in Ontario. Rod Nash RGD and Jean-Pierre Lacroix RGD represent our Association on the DIAC Board. Editors Canada Editors Canada promotes professional editing as key in producing effective communication. Their 1,500 members, both salaried and freelance, work with individuals in the corporate, technical, government, not-for-profit and publishing sectors. The association is incorporated federally as a not-for-profit organization and is governed at the national level by an executive council. DesCan: Design Professionals of Canada The Design Professionals of Canada (DesCan) is committed to leading, supporting, and advancing professional design communications in Canada. We are a nationwide, membership-based community and have been establishing standards for design professionals since 1956. Community by Design. IABC Calgary IABC Calgary is the largest professional association for Calgary-based communications professionals, public relations practitioners and students. Boasting more than 500 local members, IABC/Calgary is also one of the largest chapters in the world. IABC London The London chapter of the International Association of Business Communicators (IABC) empowers communications professionals to reach their full potential. From professional development to networking opportunities, our members benefit from belonging to a global community dedicated to advancing the profession. Founded in 1979, IABC London represents those in the fields of communications, marketing and creative services. Our members are experienced leaders, junior and mid-career professionals and students spanning across southwestern Ontario, including London, Middlesex County, Windsor-Essex, Chatham-Kent, Sarnia-Lambton and beyond. ICA: Institute of Communication Agencies ICA is the not-for-profit association for Canadian communication agencies, representing 75%+ of all national advertising. Their mission is to champion commercial creativity, amplify the industry’s economic impact, and to embrace and drive change. ICA promotes higher standards and best practices, and serves as the largest source of information, advice and training for the industry. SDGQ: Société des designers graphiques du Québec Founded in 1974, the Society of Graphic Designers of Quebec (SDGQ) defends and promotes the interests of the profession to political authorities, business leaders and the public in general. SDS: Sudbury Design Society The Sudbury Design Society is a member-based non-profit organization working to raise the value and visibility of design in Greater Sudbury. SDS works to provide networking, professional development, and advocacy for everyone with an interest in the Sudbury design industry. Questions? Email: Hilary@rgd.ca Sponsored Sponsor WeirFoulds LLP is one of Canada’s oldest and most prestigious law firms. RGD Partner Sponsor We Tell Compelling Stories. Let’s Make Something Great Together! RGD Partner Sponsor At Moveable, we’re ready to do whatever it takes to get your message out effectively. RGD Partner"
