["https://rgd.ca/articles/focus-on-benefits-access-to-the-rgd-video-library-anytime"]
title = "RGD | Benefits of RGD"
description = "Ruth uses her creative talents to inform and delight at the City of Côte Saint-Luc (a municipality in the West End of Montreal), where she has worked for over 20 years as their in-house graphic designer with a special passion for print design. Fishtank Communications, her independent studio, focuses on clients within the arts and non-profit sectors. She is co-chair of RGD’s Membership Committee—where she helped to kick-start the Virtual Communities initiative, serves on the RGD Board, and has been a member of the Events Committee and judged student competitions."
full_description = "Home Articles NewsSept 21, 2024 Focus on Benefits: Access to the RGD video library anytime Written by Ruth Farrugia RGD, City of Côte Saint-Luc The RGD Membership has its privileges! As co-chair of the Membership Committee, I want to share some of the amazing resources and benefits that Membership provides and encourage all RGD Members to take advantage of them. If you’re not an RGD Member yet, now’s the time to join! Even for those who have been outside the school environment for a while, September feels like back-to-school time. It evokes the scent of fallen leaves, memories of choosing new markers, visions of customizing a new pencil case with doodles and that familiar feeling of simultaneous excitement and anxiety. Lifelong learning and inspiration are vital for designers. Our field constantly evolves, and we do our best to keep up. Did you know that the RGD has a vast archive of videos from various conferences, including DesignThinkers, and so many valuable webinars? As a Member, you have unlimited access to this treasure trove.Get inspired and entertained by DesignThinker royalty like Paula Scher, Cey Adams, Matteo Bologna, Eleni Beveratou, Dori Tunstall, Michael Bierut, Tina Roth Eisenberg, Debbie Millman, Stefan Sagmeister…and that’s just the tip of the iceberg. Get valuable, practical advice and learn from panel discussions and archived webinars on topics such as accessibility, career building, dealing with clients, in-house design, UX and so much more. Check out the featured video, or just browse and choose something that piques your interest. If you are specifically looking for a particular subject or theme? The filtered video search is there for you.The video library is constantly being updated with fresh content. You’ll find presentations from all of the RGD’s events and conferences three months after they take place, as well as the latest webinars. This month, the RGD added recordings of the presentations from DesignThinkers 2024 in Vancouver and the 2024 Design Educators Conference, which took place in May. “After 27 years of being a designer, I was flooded with love for our industry again. I felt like a fresh designer, finding inspiration in everything I watched. It was creatively rejuvenating.” Carolyn Harman RGD Once you’ve watched some selections from the vast video library and have had a taste of all that inspiration and education, add some personal connection to the mix and register for the next DesignThinkers Conference in November. This year marks 25 years of DT! RGD Members get special rates on registration (yup, another benefit)! Ruth Farrugia RGD City of Côte Saint-Luc Ruth uses her creative talents to inform and delight at the City of Côte Saint-Luc (a municipality in the West End of Montreal), where she has worked for over 20 years as their in-house graphic designer with a special passion for print design. Fishtank Communications, her independent studio, focuses on clients within the arts and non-profit sectors. She is co-chair of RGD’s Membership Committee—where she helped to kick-start the Virtual Communities initiative, serves on the RGD Board, and has been a member of the Events Committee and judged student competitions. Tag Membership Related Articles News Members are invited to apply for a Virtual Mentor Insight Members share experiences in the Firm Owners' Virtual Community News DTVAN 2023 recordings now available for RGD Members News Amanda DeVries RGD selected to design RGD Membership Sticker for 2025 Amanda DeVries RGD News The RGD welcomes 51 new Members, including 17 Certified RGDs Sponsored Sponsor WeirFoulds LLP is one of Canada’s oldest and most prestigious law firms. RGD Partner Sponsor At Moveable, we’re ready to do whatever it takes to get your message out effectively. RGD Partner Sponsor We Tell Compelling Stories. Let’s Make Something Great Together! RGD Partner Become an RGD Member Gain access to RGD benefits Discounts & special offers Discounts to annual DesignThinkers conferences Connect with a supportive community to share insights, experiences & knowledge Raise your profile by writing, presenting, judging & mentoring Present your portfolio in our searchable directory Participate in inspirational and educational programming Expand your network through volunteering, mentorship & events Access a video library of 700+ recorded presentations Learn about becoming a member"
