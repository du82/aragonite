["https://rgd.ca/certification"]
title = "RGD | Certification"
description = "Certified RGDs have a demonstrated understanding of business best practices, accessible design principles, research methods and ethics and the application ..."
full_description = "Home Certification Certification Certified RGDs have a demonstrated understanding of business best practices, accessible design principles, research methods and ethics and the application of strategic design principles to marketing and communications challenges. Need another reason to get RGD Certified? Apply for your RGD Certification by March 7 (and successfully complete by April 11) to receive free registration to both DesignThinkers Conferences in 2025: Vancouver and Toronto (virtual or in-person) (Limited to the first 30 successful candidates). Apply now EligibilitySeven years of relevant work experience and education (may include one to four year post-secondary diploma or degree in graphic design or related field). Four Certification PathwaysVisual Designers - Designers working in disciplines that are visually focused, such as communication, motion, environmental etc.Experience Designers - Designers working in disciplines that are experientially focused, such as UX, product, service etc.Design Managers - Anyone managing the design process in any design discipline.Design Educators - Anyone teaching in any design discipline.These pathways recognize the diverse expertise within our field, allowing you to showcase your specific skills and expertise during the certification process. All Certified RGDs share the same designation. However, we offer guidelines and application forms tailored to specific disciplines to accommodate and reflect the differences in practice. This approach ensures that while maintaining a unified professional standard, we recognize and support the diverse areas of specialization within the field of design. Choose the pathway that feels most relevant to your work.Learn more about discipline pathways within the “Getting Certified” pages below. Getting Certified Application Preparation of Case Studies Online Test Virtual Presentation of Case Studies Certification Results “ 100 times a day I see the red RGD rectangle with white type on my certificate hanging in my office; 100 times a day I feel a sense of pride. The RGD designation reminds me that I am part of something bigger; I’m a seasoned professional with a responsibility to be an advocate for this industry. Terence McGuire RGD, Intertek Catalyst Certification Resources Preparation Support Tips for building your Case Studies FAQs Certification Oversight Certification Evaluators Certification Committee XD Advisory Group Sponsored Sponsor Paper Trails: Finding the Perfect Line RGD Partner Sponsor Putting Passion to Work: Your Partners For Digital, Marketing & Creative Staffing Sponsor Is a career in advertising for you?"
