full_description = "Home About Bylaws Code of Ethics Code of Ethics Illustration: Sam Island for The Business of Graphic Design Handbook Registered Graphic Designers (RGDs) are committed to the highest professional and ethical standards when working for clients, as employees and in service to the public. RGD has collaborated with Design Professionals of Canada (DesCan) and Société des designers graphiques du Québec (SDGQ) to create a unified Code of Ethics. RGD, DesCan and SDGQ Members are required to abide by the Rules set out in the Code. The RGD’s By-laws outline the procedures for Members, clients, employers, employees, students and the public to address a situation where it is felt that a Member has not lived up to their ethical obligations as outlined in the Code of Ethics. If you have questions or concerns about anything outlined in the Code, contact RGD’s Executive Director, Hilary Ashworth, by email at execdir@rgd.ca. Download the Code of Ethics (English) Download the Code of Ethics (French) Sponsored Sponsor Explore Domtar.com / Inspiration today! RGD Partner Sponsor Linda Mackie Creative: Breathing Life Into Your Image Sponsor Is a career in advertising for you?"
