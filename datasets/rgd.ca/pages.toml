["https://rgd.ca/articles/design-your-future-introducing-the-rgd-career-planning-workbook"]
title = "RGD | Design your future: Introducing the RGD Career Planning Workbook"
description = "Amelia is a Canadian expat, now living in New York City, and wearer of many hats — designer, strategist, illustrator, storyteller, brand builder — showcasing her multidisciplinary creativity. As each pixel meets purpose under her deft touch, Amelia seeks to ignite change through creative cross-pollination, inviting you to explore the extraordinary in every detail. Amid her diverse creative ventures, catch her captivated by colour swatches or on a quest for the finest G&T."
full_description = '''Home Articles NewsJul 08, 2024 Design your future: Introducing the RGD Career Planning Workbook Written by Amelia Nash RGD, School of Visual Arts — Masters in Branding In the constantly changing field of graphic design, planning a career can often feel like navigating uncharted shark-infested waters. That's why the RGD is excited to introduce a new initiative from the Career Planning Subcommittee: the RGD Career Planning Workbook. This resource is designed to support both new and experienced professionals, offering practical tools, advice and insights to help you succeed in your career. Click here to Download the RGD Career Planning Workbook for Designers Why did we create this workbook?We know that planning your career in the design industry can be challenging. Our goal with this workbook is to provide you with a clear roadmap, whether you're just starting out, looking to advance or exploring freelance opportunities. "Our aim is to empower designers with the tools and knowledge they need to succeed," says Amelia Nash Associate RGD, Career Planning Subcommittee. "We want this workbook to be a valuable resource for every stage of your career journey."What's inside the workbook?The RGD Career Planning Workbook is packed with helpful information and resources designed to guide you through different career stages. We’ve built out the first section, ‘Looking for a Job,’ as a beta to gather feedback so that we can make the entire workbook as helpful as possible.Looking for a Job: Find strategies for job searching, tips on crafting standout resumes and cover letters and advice on building a compelling portfolio.The following sections are in development to be completed by the end of 2024 with the goal of incorporating user feedback from the first section in order to craft the best workbook possible:Starting a New Job: Learn how to make a great first impression, understand workplace dynamics and set yourself up for success in a new role.Career Transitions: Discover how to level up your skills, network effectively and navigate career changes with confidence.Freelance Work: Get insights on managing clients, pricing projects and sustaining a successful freelance business. What makes this workbook special?We’ve included several features to make this workbook both practical and engaging, including:Resources: To reinforce and help with the learning, pages include helpful tips, RGD professional handbook page references and links to external assets.Templates and Examples: Access a variety of templates along with real-world examples to guide you.Interactive Exercises: Each section includes exercises to help you apply the concepts and reflect on your career goals.Digital Tools: Use linked resources and digital tools to enhance your work and presentations.How can this guide help new professionals?If you're just starting out, this workbook is your go-to guide. It breaks down the job search process into easy steps, helping you create a standout resume, prepare for interviews and build a portfolio that showcases your skills. The workbook also offers advice on navigating the early stages of a new job, so you can quickly integrate into your team and start making an impact.Benefits for Seasoned Professionals : Even if you’ve been in the industry for years, there’s something for you in this workbook. As the design world evolves, staying updated and growing your skills is crucial. Information on current tools and job-searching tactics can help you stay up to date with industry standards. The future sections to be developed on career transitions and freelance work will be particularly helpful for experienced designers looking to expand their horizons.How to Access the Guide: The RGD Career Planning Workbook and accompanying digital assets are available to all and can be accessed here. We wanted to create a versatile and accessible document, so the PDF workbook can be filled digitally or printed and filled out by hand, the choice is yours!We Want Your Feedback! We’re eager to hear your thoughts on the workbook as we continue to refine and improve it. Please share your comments and suggestions with us by utilizing this feedback form. Your feedback is crucial to making this an even more effective tool for designers across Canada. The RGD Career Planning Workbook is here to support you at every stage of your design career. By using the tools, resources and expert advice within its pages, you can navigate your career journey with confidence and clarity. We hope this workbook becomes a trusted companion on your path to professional success! A huge thank you from the RGD Career Planning Subcommittee; Amelia Nash Associate RGD, Elyssa Biringer Associate RGD, Preet Soni Associate RGD and Mostafa Zohdy RGD. Click here to Download the RGD Career Planning Workbook for Designers Amelia Nash RGD School of Visual Arts — Masters in Branding Amelia is a Canadian expat, now living in New York City, and wearer of many hats — designer, strategist, illustrator, storyteller, brand builder — showcasing her multidisciplinary creativity. As each pixel meets purpose under her deft touch, Amelia seeks to ignite change through creative cross-pollination, inviting you to explore the extraordinary in every detail. Amid her diverse creative ventures, catch her captivated by colour swatches or on a quest for the finest G&T. Tag Careers Related Articles News Resources to grow your design career Insight Building your Career as a Unicorn Designer Kyle Schruder RGD News RGD’s Year in Review: 2023 Insight Inky hands and backwards typography Derwyn Goodall RGD Insight Meet Three Women Leaders Shaping the Future of the Design Industry Rina Alfonso RGD, Claire Dawson RGD Sponsored Sponsor User Experience Design! Learn More York University School of Continuing Studies Sponsor Is a career in advertising for you? Sponsor We are a different type of printing company. We like it that way and think you will too. RGD Partner'''
