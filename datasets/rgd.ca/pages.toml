["https://rgd.ca/articles/business-perspectives-how-are-design-firms-adapting-to-tariff-tensions-and-economic-uncertainty"]
title = "RGD | Business Perspective: How will U.S.Trade uncertainty impact your business"
full_description = '''Home Articles InsightFeb 12, 2025 Business Perspectives: How are design firms adapting to tariff tensions and economic uncertainty? Trade tensions with the United States continue to create uncertainty for Canadian businesses. While design services may not be directly affected by tariffs, the broader economic impact can influence client spending, business growth and long-term stability.We asked RGD firm owners how these uncertainties could impact their businesses and what strategies they have in place to adapt. "Thankfully, as designers, we are a service-based business not subject to tariffs. As a firm with long-standing US clients who we bill in US dollars, the tariffs actually work in our favour–driving the dollar down and, in turn, the value of our fees up. As we have already seen, the threat of tariffs has brought our country together. We can expect to see inter-provincial trade barriers fall, or at least be loosened and trade with other countries expand, limiting our exposure with the US. At a grassroots level, the Buy Canadian movement will serve to uplift Canadian brands and products. These are all good outcomes for the long-term, and worth the short-term pain. David Coates RGD Advertising Brand Strategy Wayfinding View Profile "Trump’s threats are hard to predict, but tariffs have primarily targeted physical goods, with no specific mention of design services that I'm aware of. As part of a network with offices in Canada, the US and Panama, we are closely monitoring the situation. The immediate impact is more nuanced, creating anxiety all around, particularly for businesses with clients and staff on both sides of the border. I remain hopeful for our business and clients—design is a powerful tool for communication and problem-solving, so let's do our best to stay strong and carry on." Lionel Gadoury RGD View Profile "Market uncertainty, whether due to tariffs or shifting DEI policies, always brings turbulence. However, at Design de Plume, we see these moments as opportunities to evolve. We started our business during a major recession, so navigating rough waters isn't new to us. While Canada and the US remain key markets for us, we're actively exploring opportunities beyond these borders to diversify our trade options and ensure long-term resilience. Despite potential barriers, we firmly believe that the value we provide (design rooted in accessibility, inclusion and cultural sensitivity) remains essential across Turtle Island (North America). Our work continues to support organizations that drive meaningful change, and we are committed to championing our IIDEAS (Indigeneity, Inclusivity, Diversity, Equity, Accessibility and Sustainability) lenses in everything we do. We will continue to collaborate with change-makers who share our vision, ensuring that our work not only weathers these uncertainties but also helps create a more inclusive and accessible future." Meggan van Harten RGD Accessibility Creative Direction Design Management Meggan Van Harten, RGD is Co-CEO for Design de Plume, an Indigenous and women-owned creative agency that designs inclusive and accessible solutions that resonate. She brings equity and accessibility to the... View Profile "Tariffs, irrespective of the size or which category is targeted, have a significant impact on businesses and, in the long-term, on design firms. The uncertainty of the impact on business creates a reluctance to invest in the future and puts greater focus on immediate operational and logistics needs. This, in turn, shifts the focus inwardly in companies, delaying decisions due to a lack of resources or capabilities which are now assigned to resolving challenges such as sourcing, margins and sales. Design and branding firms' current projects will not be significantly affected, but future revenue opportunities are at risk and firms are advised to explore contingency plans that leverage scenario planning." Jean-Pierre Lacroix RGD View Profile "Uncertainty in the marketplace always creates hesitation, making clear storytelling, beautiful branding and strategic marketing more valuable than ever. When markets tighten, businesses must clearly communicate their value—why they’re worth choosing. That’s exactly what we help our clients do. As brand marketers, we help businesses position themselves to thrive, no matter the economic climate. Tariffs may impact costs and maybe decrease demand slightly, but regular folks still need goods and services. In times like this, the businesses that tell their story well and reinforce their value are the ones that come out stronger. For us, that means doubling down on what works: sharpening our clients’ messaging, refining their positioning and ensuring their story gets in front of the right audience. Our focus extends beyond weathering the storm." Diego Lopez RGD With experience in research, brand strategy, copywriting and marketing, Diego Lopez RGD has spent the last decade helping brands of all sizes (from Porter Airlines, Manulife, Costco tobeloved local brands)... View Profile "The uncertainty around tariffs is top of mind for many business leaders right now. While many of our clients—local, service-based organizations—won’t feel the impact directly, we may see shifts in new business. A lot of companies are focused inward, prioritizing operations, supply chains and key relationships. In uncertain times, marketing budgets are often the first to be paused. But uncertainty also creates opportunity. This is a pivotal moment for Canadian brands to strengthen their presence and connect with consumers. More than ever, Canadians want to support home-grown businesses, but too often, we don’t realize which brands are Canadian. Now is the time to own that story. Brands that invest in their positioning today will come out stronger. Rather than pulling back, Canadian companies should lean into their identity, tell their story and remind consumers why they matter. The businesses that step up now will be the ones that thrive long after the uncertainty fades." Carolyn Shaw Advertising Branding Creative Direction Carolyn has over 20 years of advertising, design, and branding experience working with local and global brands. Through her leadership and creative thinking, Carolyn has guided Humanity to redefine the way... View Profile Interested in Sharing Your Perspectives? We invite you to contribute your unique perspectives to our community. We'd love to hear from you if you’re passionate about sharing your insights!Reach out to Vanshika@rgd.ca to learn more about how you can get involved. Learn more Tag Business Related Articles Insight Business Perspectives: Social media strategies Insight Business Perspectives: Securing your first client Andrea Rodriguez RGD, Ashe Green RGD, Andrew Edgecombe RGD, Gillian Hickie RGD Insight Business Perspectives: Surprising aspects of running a business John deWolf RGD, Paddy Harrington RGD, Elia Kanaki RGD, Elana Rudick RGD, Chris Reyes RGD, Carolyn Shaw, Lauralee Sheehan Insight Business Perspectives: Positioning your business with potential clients Mario Mercier, Carolyn Shaw, Lauralee Sheehan, Chris Wharton RGD, Mike Gioffre Insight Employer Perspectives: Essential soft skills Erika Hamilton-Piercy RGD, John deWolf RGD, Vida Jurcic RGD, Cecilia Mok, Elana Rudick RGD, Nelson Silva Sponsored Sponsor At Moveable, we’re ready to do whatever it takes to get your message out effectively. RGD Partner Sponsor Paper Trails: Finding the Perfect Line RGD Partner Sponsor Explore Domtar.com / Inspiration today! RGD Partner'''
