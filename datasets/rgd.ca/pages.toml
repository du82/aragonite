["https://rgd.ca/certification/faqs"]
title = "RGD | FAQs"
full_description = "Home Certification FAQs FAQs Q: I don't have time to go through the Certification Process. Is there a way for me to get involved in the RGD otherwise? A: If you have more than 8 years of education and work experience combined, you may become an Affiliate Member. If you have less than this, you may be eligible for Associate Membership.Q: How long will the process take?A: That's entirely up to you and how quickly you would like to move through the steps. Typically, the Process takes four to six weeks from the time you submit your application.Q: What does it cost?A: Eligible applicants (fee is only required after you are deemed eligible to go through the Process) are required to pay a one-time admin fee of CDN $150 (seniority applicants); this fee is waived for Associate RGDs and Affiliate Members. Once you have successfully completed the Process, the annual fee for Certified RGD Membership is CDN $375 plus applicable taxes. Q: I am based outside of Canada. Can I still get Certified? A: Yes, the Test is completed online and the Presentation of your Case Studies is conducted virtually so anyone, anywhere in the world, may go through the process. The Association has many Certified RGD Members practising across Canada and even in the US and beyond. We encourage you to review the benefits of RGD Membership to see if you are interested in taking advantage of all we offer.Q: I have a design degree and over 15 years experience as a Senior Graphic Designer. Do I still have to go through the Certification process if I want to become a Certified RGD?A: No one may become a Certified RGD without going the Certification Process. All applicants must successfully complete the Presentation and the Online Test.Q: I have worked for 10 years as a graphic designer but completed a diploma or degree in something other than graphic design. Can I become a Certified RGD?A: Anyone with seven years of relevant work experience is eligible to apply. An Eligibility Review Committee reviews all applications to determine eligibility to move to the next stages of completing the Process, which are the Online Test and Virtual Presentation.Q: What happens if I fail?A: Online TestEach of the two sections of the Online Test has a passing mark, based on marks from past successful candidates.If you do not achieve the passing mark for a section, you will be required to take that section again. If you fail a section three times, you must wait six months before you can take a section again.A: Portfolio PresentationIf you fail to meet the evaluation criteria for the Portfolio Presentation, you will receive suggestions for how to improve and an opportunity to join the RGD in another category. Candidates who do not pass have the opportunity to re-apply in 2 years. Candidates can also appeal the decision and redo the Portfolio Presentation with 3 new Reviewers who have no knowledge of past results. The same three case studies submitted as part of the initial application must be presented during the second presentation. Sponsored Sponsor Get your message delivered, the AFIX way! Sponsor Putting Passion to Work: Your Partners For Digital, Marketing & Creative Staffing Sponsor User Experience Design! Learn More York University School of Continuing Studies"
year_published = 2025
