["https://rgd.ca/articles/the-rgd-has-introduced-two-new-virtual-communities"]
title = "RGD | The RGD introduces new Virtual Communities for BIPOC & Post-secondary designers"
description = """
Become a part of two new Virtual Communities, BIPOC Designers and another for Post-secondary designers.

The RGD's Virtual Communities Program brings professional RGD Members together to share knowledge, discuss experiences and support each other. This initiative reinforces the idea that we are not alone. We are a part of a rich community of RGD Members working to improve our careers, communities and work."""
full_description = "Home Articles NewsMar 02, 2025 Virtual Communities for BIPOC & Designers working in Post-Secondary Education The RGD's Virtual Communities bring professional RGD Members together to share knowledge, discuss experiences and support each other. This initiative reinforces the idea that we are not alone. We are part of a rich community of RGD Members working to improve our careers, communities and work. Members of each Virtual Community are invited to join a special Slack Channel as part of the RGD’s Slack Community and are invited to virtual meetings scheduled by the Community Leaders.BIPOC Designers Virtual CommunityA vibrant and inclusive community for RGD Members who identify as Black, Indigenous and/or People of Colour (BIPOC) to connect, share experiences and access valuable resources. This space is dedicated to fostering belonging, amplifying underrepresented voices and championing equity within the design industry. We strive to create a brave and affirming environment where Members can support one another, challenge systemic barriers and reimagine more inclusive creative spaces. Join this virtual community to share knowledge, exchange resources and uplift one another.Post-Secondary Designers Virtual CommunityJoin a welcoming and inclusive Virtual Community for graphic designers working in post-secondary institutions! Whether you’re part of an in-house team, freelancing or collaborating with colleges and universities, this space is for you. Connect with peers who are passionate about designing for diverse student communities, promoting accessibility and navigating the unique challenges of higher education. We’ll discuss strategies for effective communication, equity-driven design and working within institutional frameworks. Join us in exchanging insights, sharing resources and supporting one another. “RGD’s BIPOC and Post-Secondary Designers Virtual Communities are back with fresh energy and a renewed focus on connection and support! Whether you’re a BIPOC creative seeking a brave space to amplify your voice or a designer in a post-secondary institution navigating the complexities of higher education, these inclusive Virtual Communities are here for you. Join us on Slack to exchange insights, share resources and build meaningful connections in these newly revitalized spaces!” Alan Joson RGD To sign up for either of these new Virtual Communities or any of the others, including those for Firm Owners, UX Managers & Senior Designers, Municipal Designers, Illustrators, In-house Design Managers, Solo Designers, Experiential Graphic Designers and 2SLGBTQIA+ Designers, complete this online application form.If none of these Virtual Communities speaks to your background or interests, there's also the opportunity to lead a new one!Virtual Communities are open to Certified RGD, Associate RGD and Affiliate Members. “RGD's virtual communities offer a fantastic way to connect with designers across Canada, share advice and receive feedback tailored to your specific interests. My Virtual Community for Solo Designers has allowed me to meet others who truly understand the freelance experience. We meet once a month to support one another by sharing experiences and offering advice. It's been an invaluable opportunity to make connections with like-minded designers that would otherwise be hard to come by!” Sheree Stephenson RGD Start a new group Have an idea for a new Virtual Community? If you wish to start a community or propose a new group, email us at Info@rgd.ca. Details Tags Membership Diversity & Inclusion In-House Related Articles News Focus on Benefits: Virtual Communities bring designers together Ruth Farrugia RGD News Introducing two new Virtual Communities News Members share management tips & tools in RGD Virtual Community for In-House design managers Kyle Schruder RGD Insight Members share experiences in the Firm Owners' Virtual Community Insight Members share experiences in Municipal Designers' Virtual Community Sponsored Sponsor Realize your potential at the York University School of Continuing Studies RGD Partner Sponsor Paper With A Plan: What Will You Make Today? Sponsor Explore Domtar.com / Inspiration today! RGD Partner"
