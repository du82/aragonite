["https://rgd.ca/certification/how-to-apply-2"]
title = "RGD | Preparation of Case Studies"
full_description = "Home Certification Preparation of Case Studies Preparation of Case Studies Considerations for selecting projectsDesigners (both visual and experience) should demonstrate an ability to develop and implement solutions to complex problems encountered in all phases of the design process.Managers may submit Implementation of Best Practices & Processes, Articles & Speaking Engagements and Managed Design Work. These should demonstrate an ability to develop and implement effective design management strategies.Educators may submit: Academic & Research Papers, Course Design, Curriculum Planning or Publishing/Conference Documentation. These should focus on teaching and research, demonstrating an ability to develop and implement effective teaching strategies. Candidates are asked to provide the following information for each project:Visual Designers (within the context of Evaluation Criteria): Your role on the projectContext (Describe the client needs / project brief, including project goals and objectives.)Design Process (Outline the process from concept exploration to presentation and acceptance by the client; include research, analysis and other investigations that contributed to the solution.)Solution (Describe your solution/deliverables and how project goals and objectives were achieved.)Supporting material (PDF, DOC, DOCX, PNG, JPG, JPEG or GIF files)Experience Designers (within the context of Evaluation Criteria):Your role on the projectContext (Describe the user problem, project goals and objectives. Identify key stakeholders involved, their roles and how their insights influenced the project’s direction.)Process (Outline your design process, including user research, development of personas or archetypes, journey mapping, usability testing and collaboration with stakeholders. Detail how business objectives were integrated into the design strategy.)Solution (Detail the deliverables (e.g., wireframes, prototypes or final designs) and explain how they align with project goals, stakeholder expectations and business objectives. Include metrics or qualitative evidence of the impact (e.g., task completion rates, accessibility improvements) and discuss feedback from stakeholders. Highlight how the outcomes supported the overarching business goals.)Supporting material (PDF, DOC, DOCX, PNG, JPG, JPEG or GIF files)Design Educators (within the context of Evaluation Criteria):Your role on the projectContext (Describe the project goals and objectives, audience and any restrictions or special considerations directly related to the project goals.)Process (Describe the process for the development of this project. Outline any research, analysis or other information gathering and investigation that contributed to the final results.)Solution (Describe your deliverables and how they achieved project goals and objectives, engaged or served their audiences as intended and addressed and foreseen or unexpected challenges.)Supporting material (PDF, DOC, DOCX, PNG, JPG, JPEG or GIF files)Design Managers (within the context of Evaluation Criteria):Your role on the projectContext (Describe the project goals and objectives, audience and any restrictions or special considerations directly related to the project goals.)Process (Describe the process for the development of this project. Outline any research, analysis or other information gathering and investigation that contributed to the final results.)Solution (Describe your deliverables and how they achieved project goals and objectives, engaged or served their audiences as intended and addressed and foreseen or unexpected challenges.)Supporting material (PDF, DOC, DOCX, PNG, JPG, JPEG or GIF files) “ I am an RGD Member because I believe that design has the power to create meaningful impact. With that power comes a deep responsibility of doing it in an ethical way. I love this community and the desire to continuously improve ourselves to contribute towards a more equitable world. Meggan van 