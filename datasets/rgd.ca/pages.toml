["https://rgd.ca/articles/make-it-kitchener-identity-by-intent"]
title = "RGD | Make It Kitchener Identity by Intent"
full_description = "Home Articles Case StudyJun 13, 2018 Make It Kitchener Identity by Intent Written by Ben Hagon RGD CreditsClient: City of KitchenerCreative Director: Ben Hagon RGDSenior Art Director: James BischSenior Designer: Lindsay PasichnykPhotographers: Jesse Senko, Joe MartzDescriptionThe City of Kitchener wanted a new brand for their economic development strategy with a youthful, more authentic feel, appealing to all audiences. As a result, Intent designed an oversize, unbound document on uncoated paper with the logo rubber stamped, by hand, on the cover of the document. This communicates an authentic, handmade feel and conveys the grassroots, maker-culture that is thriving in Kitchener. Intent also designed a website that focuses on real, authentic stories from the people who are ‘making it’ in Kitchener. Judge's CommentsThis project demonstrates a clever application of both visual treatments and typographic solutions. Authentic photography is used to entice readers to engage with the creative. Additionally, the slogan, ‘Make It Kitchener,’ speaks to the audience with a catchy hook. Overall, this economic development project paints an appealing picture of Kitchener as a place to work and live.- Kim Pickett CGD B Ben Hagon RGD Tag Case Study Related Articles Case Study Contemporary identity for a traditional Japanese restaurant by Blok Vanessa Eckstein RGD Case Study Branding for a BC retreat Robin Miller RGD Case Study Signage & wayfinding by Steer for Toronto's parks and trails Juan Rioseco RGD Case Study DDP designs online platform for Indigenous stories and resources Design de Plume Inc. Case Study Rebranding by Eye Candy Design for Herb-infused Coffee Amanda DeVries RGD Sponsored Sponsor Paper With A Plan: What Will You Make Today? Sponsor Putting Passion to Work: Your Partners For Digital, Marketing & Creative Staffing Sponsor WeirFoulds LLP is one of Canada’s oldest and most prestigious law firms. RGD Partner"
