["https://rgd.ca/articles/jacknife-rebranding"]
title = "RGD | Jacknife rebrands Chair-man Mills, unifying nine companies under a single brand"
description = "Michael is a product of Ontario College of Art & Design’s respected graphic design program. He co-founded the experimental design studio AmoebaCorp in 1996 and, in 2013, came together with other highly respected industry contemporaries to create a refreshing new multi-tooled design-led agency, Jacknife. Throughout his professional career, Mike has brought his unique brand of creative craftsmanship and leadership to major projects for the likes of Nike, Molson Coors, Arterra Wines, Maple Leaf Sports & Entertainment, Red Bull, Second Cup, Hudson’s Bay, Weston and Nestlé. Mike believes that design is more of a way of life than simply an occupation. His near-obsessive approach to design has seen his professional and personal work published in numerous international publications in Canada, the US, Japan, Germany, Finland and the UK. An advocate of designing with purpose, Mike often shares his thinking on the need for design with integrity; he believes that good design is the meaningful bridge between functionality and human experience, intuition with inarguable reason. He thanks his Finnish/Polish extraction for giving him an early start to what would become a lifelong passion for Art & Design culture and counts cutting two albums, seeing Johnny Cash perform live and holding the studio's longest hair award as major milestones worth posting on the family fridge. Mike is also a co-member of the Gentlemen of Canada, a distinguished Toronto-based art collective that works to collect, combine, decontextualize and celebrate the rich cultural fabric of the North."
full_description = "Home Articles Case StudyNov 27, 2024 Jacknife rebrands Chair-man Mills, unifying nine companies under a single brand Written by Michael Richardson RGD, Jacknife and Michael Kelar RGD, Jacknife Project ContextChair-man Mills Corp., a trusted name in Canada’s event industry for over a century, has officially rebranded as Element Event Solutions, with help from the creative leadership of Toronto-based branding agency Jacknife. This rebranding marks the unification of nine prominent event rental companies under one powerful national brand platform, setting a new gold standard for event solutions across Canada. The transition from Chair-man Mills to Element Event Solutions goes beyond a simple name change. It represents a strategic shift towards becoming Canada’s first truly national event solutions partner, offering everything from tents and décor to comprehensive project management services. Partnering with Jacknife, Element has modernized its look and repositioned itself as the go-to for nationwide venues, planners and caterers. “Jacknife’s team understood the essence of our legacy and where we wanted to go as a company,” says Allison Freeman, CEO of Element Event Solutions. “Their strategic creative was instrumental in shaping the new identity of Element. They didn’t just create a new look—they captured the heart of our business, making it modern, relevant and aligned with our goal to create Canada’s premier event solutions platform.” Design MethodologyAs part of the rebrand, Jacknife developed the brand strategy and positioning, including crafting the brand architecture that unified the nine companies. With this new strategy, we created a new name that solidified the Element’s brand identity. The reimagined complete visual identity system features a refined, modern logo, an elegant colour palette and robust brand guidelines. The newly designed website effectively brings the brand to life online, providing a visually compelling experience that aligns with Element’s refreshed identity. Jacknife's work extends beyond digital and print branding, influencing every touchpoint, including uniforms, vehicle fleet branding and environmental design. “Our goal was to maintain the trust and legacy of Chair-man Mills while crafting a brand that could lead the industry into the future,” says Kim Norwich, Creative Director at Jacknife. Element Event Solutions isn’t just a new name—it symbolizes the essential foundation of the event industry. The company, its people, and its offerings combine like the core elements needed to create unforgettable experiences. Every aspect of the brand was designed to reflect this harmony of essential components, from the uniforms to the vehicle fleet, with growth, innovation and customer satisfaction at the forefront. ResultsSince the rebrand, Element has seen a surge in customer engagement across its digital platforms, with an increase in event inquiries and brand awareness. The newly designed fleet, uniforms and cohesive branding strategy have strengthened Element’s presence, making it a visible and trusted partner in the event industry. Interested in submitting a project to be featured here? The RGD invites professional Members of the RGD to submit projects for consideration to be showcased across RGD channels. Fill out this form Michael Richardson RGD Jacknife Michael Kelar RGD Jacknife Michael is a product of Ontario College of Art & Design’s respected graphic design program. He co-founded the experimental design studio AmoebaCorp in 1996 and, in 2013, came together with other highly respected industry contemporaries to create a refreshing new multi-tooled design-led agency, Jacknife. Throughout his professional career, Mike has brought his unique brand of creative craftsmanship and leadership to major projects for the likes of Nike, Molson Coors, Arterra Wines, Maple Leaf Sports & Entertainment, Red Bull, Second Cup, Hudson’s Bay, Weston and Nestlé. Mike believes that design is more of a way of life than simply an occupation. His near-obsessive approach to design has seen his professional and personal work published in numerous international publications in Canada, the US, Japan, Germany, Finland and the UK. An advocate of designing with purpose, Mike often shares his thinking on the need for design with integrity; he believes that good design is the meaningful bridge between functionality and human experience, intuition with inarguable reason. He thanks his Finnish/Polish extraction for giving him an early start to what would become a lifelong passion for Art & Design culture and counts cutting two albums, seeing Johnny Cash perform live and holding the studio's longest hair award as major milestones worth posting on the family fridge. Mike is also a co-member of the Gentlemen of Canada, a distinguished Toronto-based art collective that works to collect, combine, decontextualize and celebrate the rich cultural fabric of the North. Tag Case Study Related Articles Case Study Jacknife reinvents Second Cup with overhaul of brand experience Michael Richardson RGD Case Study Kira's In-House Team develops a new brand system to apply the revamped Identity by Jacknife Kevin Moran RGD Case Study Q30 Design Inc. creates digital infrastructure to Map Ontario's Black Archives Tejashri Kapure RGD Case Study Contemporary identity for a traditional Japanese restaurant by Blok Vanessa Eckstein RGD Case Study 2024 National Magazine Awards’ brand identity by Made by Emblem Sponsored Sponsor WeirFoulds LLP is one of Canada’s oldest and most prestigious law firms. RGD Partner Sponsor Get your message delivered, the AFIX way! Sponsor Paper With A Plan: What Will You Make Today? Interested in submitting a project to be featured here? The RGD invites professional Members of the RGD to submit projects for consideration to be showcased across RGD channels. Fill out this form"
