["https://rgd.ca/articles/made-by-emblem"]
title = "RGD | 2024 National Magazine Awards’ brand identity by Made by Emblem"
full_description = "Home Articles Case StudyJan 18, 2024 2024 National Magazine Awards’ brand identity by Made by Emblem Made by Emblem elevates National Magazine Awards' brand identity using the asterisk and typeface by PangramPangram foundry. Context The National Magazine Awards (coupled with the B2B and digital publishing offshoots) represents one of Canada's most prestigious awards in the fields of journalism and editorial design. The National Media Awards Foundation was interested in elevating the look and feel of the NMA’s to encourage more engagement by potential entrants, judges and participants in the foundation’s programming. Since the Awards are a primary mode of engagement for the foundation, they commissioned Made by Emblem to help define the foundation's identity to be as design-savvy as the work they honour. Methodology Made by Emblem used typography to create a visual identity that focuses on a single symbol that is a marker of special significance: the asterisk. The term 'asterisk' comes from the Greek word asteriskos, meaning little star. The asterisk is used to call attention to additional information related to existing text. The National Magazine Awards do the same—they award both the individuals and institutions deserving recognition for their achievements in the editorial world. Using the Editorial Old typeface by PangramPangram, the identity for the 2024 National Magazine Awards gives personality and star-power to editorial design through the asterisk while keeping one referential foot in the world of typesetting and print. Made by Emblem delivered two libraries of templates and assets in French and English for promotion of the awards and for business reach-outs, keeping every touch point cohesive and considered. Result Through the play on the asterisk, Made by Emblem elevated the National Magazine Awards' identity to effectively hold its place as the benchmark of Canadian journalism. The asterisk, a marker of special significance, embodies the foundation's dedication to promoting excellence in both journalism and editorial design. The new brand identity was very well received by the foundation and its stakeholders. Credits: Art Director and Designer: Christina KimAssociate Creative Director: Joshua Duchesne Video Editor: Sean Kung Type: PangramPangram Foundry Mentioned in this article PangramPangram National Magazine Awards Tag Case Study Related Articles Insight Bruce Mau Design: Re-branding a branding studio Laura Stein RGD Insight Top nine identity design systems of 2023 Chris Reyes RGD News The RGD unveils branding by Arcadis for our 2024 In-House Design Awards Case Study Motion design for Screen Nova Scotia incorporates classic film iconography John deWolf RGD Sponsored Sponsor Linda Mackie Creative: Breathing Life Into Your Image Sponsor User Experience Design! Learn More York University School of Continuing Studies Sponsor We Tell Compelling Stories. Let’s Make Something Great Together! RGD Partner"
