["https://rgd.ca/connecting-learning/community/awards/sogood-awards"]
title = "RGD | SoGood Awards"
description = "An international design competition, the So(cial) Good Design Awards celebrate design’s undeniable power to incite meaningful action and make positive chan..."
full_description = "Home Connecting & Learning Community Awards SoGood Awards SoGood Awards An international design competition, the So(cial) Good Design Awards celebrate design’s undeniable power to incite meaningful action and make positive change. The So(cial) Good Design Awards as a stand-alone program are on hold. The RGD's 2025 Branding Awards will now incorporate categories specific to those normally covered in the SoGood Awards. If you have any questions, email sogood@rgd.ca. Categories:Arts & CultureThis category recognizes design projects that aid in the promotion of art and artists from sound, stage, and screen, from exhibition halls to public spaces.Examples include, but are not limited to, work done for museums or other cultural institutions, artists, artwork and work that inspires or celebrates artistic creation.Civil & Human RightsThis category recognizes design projects that aim to protect, defend and advance all people’s political and social freedoms and equality, especially among groups that have been historically under-represented and underserved.Examples include, but are not limited to, projects that promote and protect the rights and freedoms of individuals and groups or projects address systemic structural and interpersonal inequities. This may include democracy, civic engagement, freedom of the press, religion and equal justice under the law.Diversity, Equity & InclusionThis category recognizes design projects that support, protect, represent and uplift underrepresented groups of people. Examples include, but are not limited to, initiatives that promote inclusivity, accessibility and equity for people with different backgrounds, experiences, and perspectives and create collaborative, supportive and respectful environments. Can also include ways we use design to reach the broadest possible audience, particularly those with disabilities.EducationThis category recognizes design projects that support learning and self-improvement.Examples include, but are not limited to, projects supporting the work of schools, organizations, families and communities to improve educational success inside and outside the classroom and work that helps make learning more effective and accessible to students of all backgrounds including adult education, early childhood programs and first-generation students.Health, Well-being & SafetyThis category recognizes design projects that raise awareness, fundraise, and/or research for particular health risks, diseases, or conditions and/or promote fitness and health. Examples include, but are not limited to, efforts that promote exercise, nutrition, mindfulness, mental health, public health, reproductive health, etc. and work done for organizations or programs in the healthcare field.Humanitarian Action & ServicesThis category recognizes design projects that focus on the prevention and relief of human suffering.Examples include, but are not limited to, work that addresses ongoing systemic issues that hinder economic, institutional and social development in any given society, or programs designed to save lives and alleviate suffering.Sustainability, Ecology & ClimateThis category recognizes design projects that focus on environmental conservation, improvement of the state of the environment and the conditions of all living things.Examples include, but are not limited to, projects that support the research, development or implementation of new technology, projects that reduce negative impacts on the environment, help support the energy and climate needs of future generations and/or raise awareness of the protection and rights of animals and plants.Cross-CategoryThis category recognizes design projects with broad impact that bridge multiple realms of social good.Examples include, but are not limited to, projects that support a wide range of non-profit organizations rather than clients in a single industry. 2022 SoGood Award Winners Sponsored Sponsor Explore Domtar.com / Inspiration today! RGD Partner Sponsor Linda Mackie Creative: Breathing Life Into Your Image Sponsor Is a career in advertising for you?"
