["https://rgd.ca/about/policies-positions/spec-work-policy"]
title = "RGD | Spec Work Policy"
full_description = "Home About Policies & Positions Spec Work Policy Spec Work Policy Illustration: Sam Island for The Business of Graphic Design Handbook Objectives The RGD Code of Ethics prohibits its Members from engaging in speculative (spec) work. What is spec work? Doing work on spec amounts to providing design work for free (or for a nominal fee) as part of a pitch for new business. Some people mistakenly believe that requiring spec work as part of their search and selection process for a designer or design firm is a good business practice. However spec work is universally condemned by responsible designers and design organizations around the world as being an unethical business practice. Why is spec work harmful? Spec work: is exploitative and unethical, a demand for free design work without guarantee of compensation,offers no future for economic potential,can lead to infringement of intellectual property rights (copyright and moral rights),devalues the profession of graphic design and leads to negative competitive practices,is also discouraged by allied professions such as the advertising industry, andis unlikely to meet a client’s marketing and communication objectives. Spec work threatens the integrity and work ethic of the graphic design profession. Neither the designer nor the guarantee of remuneration, designers who work on spec cannot do justice to the design brief and are unlikely to engage in the normal full design process and conduct the research and analysis needed to produce their best work. Because spec work often means that there is no provision of act as professional consultants, partners or members of the client’s strategic communications team are not used. Recommended guidelines for selecting a graphic designer or design firm Develop and advertise a Request for Proposal (RFP) to include information about the project background, your objectives, the scope of the work, time requirements, and proposal mandates. The respondents should be asked to provide information about the design process and tasks, the deliverables, the designated team members, timing and budget details, examples of similar or relevant work or experience and client references.If you are certain you require a presentation of creative ideas in order to make your selection from one or more pay a fee to each competitor. The amount paid should be equivalent to what a reasonable design fee and expenses would be for a similar project under normal circumstances. Such payments do not entitle you as potential client to the right to use any of the creative ideas presented unless separate agreements are reached.If such payments cannot be justified for your project, or if you do not wish to go through an RFP process, then choose reviewing portfolios and checking client references.The selection guidelines apply to both for-profit and non-profit entities, and for both paid and pro bono projects. Spec Resources Sponsored Sponsor At Moveable, we’re ready to do whatever it takes to get your message out effectively. RGD Partner Sponsor Paper With A Plan: What Will You Make Today? Sponsor Realize your potential at the York University School of Continuing Studies RGD Partner Need a designer for a communications or branding project? The RGD can assist you in your search for a designer or design firm through our searchable Directory or posting an RFP to the RGD website. Post an RFP"
