["https://rgd.ca/connecting-learning/community/mentorship"]
title = "RGD | Mentorship"
description = "Get paired with a Mentor who has knowledge and experience to help you grow your design career..."
full_description = "Home Connecting & Learning Community Mentorship Mentorship Get paired with a Mentor who has knowledge and experience to help you grow your design career The program provides a chance to connect with an industry professional and benefit from their unique insight. The Structure of the Program Over a period of 9 months, you have 6-8 sessions with your Mentor, each about 1 hour in length. Once the pairing has been finalized, you and your Mentor are ready to start the program! RGD will provide a list of discussion topics for each session, however, it is completely up to you and your Mentor what you'll want to cover in each session. TimingThe next mentorship round for Associate RGDs will be in Spring 2024. An application form will be available then. Subscribe to the RGD Newsletter to get notified of when the next round is open!Associate RGD Members (formerly Provisional RGD) are invited to apply to participate in this Program that runs two to three times a year. Each time, a new group of Mentors are available, all of whom are senior professionals working in the industry, offering unique perspectives and advice to their Mentees. Student RGDs are invited to apply to participate 2 times a year to be mentored by an Associate RGD.After the deadline, RGD reviews all applications with our Mentors to create pairings. Then we will be in touch to connect you with your Mentor. Over 9 months, mentees schedule up to 6 one-hour sessions with their Mentors. Sessions can be in-person or virtual depending on the location of your Mentor. RGD provides suggested discussion topics but you and your Mentor can decide what to discuss in each session. Any applicant not paired with one of our Mentors will be given the opportunity to participate in the Program with a different Mentor in the industry with similar qualifications.If you have any questions about the program or you would like to be a Mentor, email zaria@rgd.ca. “ The mentorship and guidance I received through the RGD gave me confidence to run my own studio! Now I am happy to share my knowledge and excited by future possibilities. Jenn Taback RGD, Partner, Design de Plume Become a Member Sponsored Sponsor Get your message delivered, the AFIX way! Sponsor Realize your potential at the York University School of Continuing Studies RGD Partner Sponsor Paper Trails: Finding the Perfect Line RGD Partner"
