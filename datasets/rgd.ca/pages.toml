full_description = "Home About About The Association of Registered Graphic Designers (RGD) is Canada’s largest professional association for graphic designers. The association’s membership of more than 4,000 people includes firm owners, freelancers, managers, in-house designers, educators and students. Who we are What is RGD? Staff Board of Directors Partner With Us Partner with us The RGD can help you reach a broad audience of creative communications professionals through advertising, sponsorship and other promotional opportunities Partner With Us Learn about our Policies and Positions Code of Ethics Spec Work Policy EDI + Anti-Violence, Harassment & Discrimination Policy Governance Bylaws Speaker Guidelines Online Event Code of Conduct Privacy Policy Looking to hire? Post a job on our job board to reach qualified professionals in the RGD’s network of over 50k Post a job “ Becoming an RGD Member was one of the best moves I could have made, especially when making the switch back to being a freelancer. Initially, the transition seemed a bit daunting but having the RGD designation and connecting to the design community was comforting and empowering. Minal Kharkar RGD, MK Branding + Design Sponsored Sponsor We are a different type of printing company. We like it that way and think you will too. RGD Partner Sponsor Explore Domtar.com / Inspiration today! RGD Partner Sponsor Linda Mackie Creative: Breathing Life Into Your Image"
