["https://rgd.ca/articles/ps-co-brand-studio-rebranded-grey-bruce-with-a-vision-for-a-unified-healthcare-system"]
title = "RGD | Rebranded Grey Bruce with a vision for a unified healthcare system"
description = "John Furneaux RGD is the Managing Director for the Toronto office of PS&Co Brand Studio, working with good organizations, to unify brand, people and purpose. For over 30 years, John has worked closely with organizations of all sizes — from entrepreneurial start-ups to global leaders. His award-winning experience spans a broad range of brand image and identity programs, as well as the communications and marketing initiatives that bring brands to life. John also teaches at George Brown College in their Design Management Program. He is a Past President of RGD and is an active speaker and contributor in the design industry."
full_description = "Home Articles Case StudyAug 01, 2024 PS&Co Brand Studio rebranded Grey Bruce with a vision for a unified healthcare system Written by John Furneaux RGD ContextThe integrated multi-site acute care public hospital organization, formerly known as Grey Bruce Health Services, annually serves over 2 million patients. With significant growth anticipated in the Grey and Bruce counties over the next decade and a new hospital scheduled to open in Fall 2023, the organization retained our team for a complete branding overhaul. Despite its modern facilities and forward-thinking approach, the hospital was perceived as disjointed and rural, which hindered its ability to secure funding and grants. One of the major aims of the rebranding was to address this perception, ensuring a cohesive and connected healthcare system. Design MethodologyThrough a workshop organized in collaboration with the hospital, we helped them refine their vision, mission and values to align with their new strategic plan. The next step was to select a new name that would reflect the organization’s vision for the future and present it as a unified system. After discussions with stakeholders, educating them on the importance of a new name, “Brightshores Health System” was selected. Throughout our engagement sessions, everyone we talked with agreed that a new, more inclusive visual representation of the community was desperately needed. So a key part of our task was to develop a logo system that would be extremely simple given the range of places and mediums in which it needed to appear, while at the same time telling the story of brighter tomorrows. For the colour palette, we started with their existing blue as it had already been implemented via their wayfinding strategy, adding warm tones for a less institutional feel. The bold graphic elements and new visuals reflect and represent the new name and the cohesive strategic plan for the organization. ResultCareful planning and quick turnarounds ensured the brand launched together with the opening of two new hospitals within the network to maximize brand impact and reduce any expenses associated with the name change. Within our publicly funded healthcare system, branding and design is often looked at as a “frill” that is a poor use of money. Considerable work needs to be done all through the process to bring along all the stakeholder groups from staff to patients to community leaders to explain the value that a well-developed healthcare brand can generate for the organization. With the time and effort well spent to educate and allay fears when the brand launched, stakeholders were able to see how the new branding positions Brightshores Health System as a modern organization with a unified team and a bright future for healthcare in the region. Credits:John Furneaux RGD - Project DirectorSarah Longwill - Project ManagerJames Bateman - Creative DirectorChloe Lan - Senior DesignerCorien Kershey - Brand Strategy J John Furneaux RGD John Furneaux RGD is the Managing Director for the Toronto office of PS&Co Brand Studio, working with good organizations, to unify brand, people and purpose. For over 30 years, John has worked closely with organizations of all sizes — from entrepreneurial start-ups to global leaders. His award-winning experience spans a broad range of brand image and identity programs, as well as the communications and marketing initiatives that bring brands to life. John also teaches at George Brown College in their Design Management Program. He is a Past President of RGD and is an active speaker and contributor in the design industry. Tag Digital design Related Articles Case Study Rebranding by Eye Candy Design for Herb-infused Coffee Amanda DeVries RGD Insight What are the signs that a company should start a rebranding process? Kyle Schruder RGD, Elana Rudick RGD Inspiration Campaign designed by Intent reflects Women’s College Hospital’s unique approach to healthcare equity Ben Hagon RGD Case Study B3 and Clear Space engage community with a new name and identity for Oak Valley Health Clear Space Design, John Furneaux RGD Inspiration Top 5 Notable Canadian Rebrands in 2021 John Furneaux RGD Sponsored Sponsor We Tell Compelling Stories. Let’s Make Something Great Together! RGD Partner Sponsor Putting Passion to Work: Your Partners For Digital, Marketing & Creative Staffing Sponsor At Moveable, we’re ready to do whatever it takes to get your message out effectively. RGD Partner Interested in submitting a project to be featured here? The RGD invites professional Members of the RGD to submit projects for consideration to be showcased across RGD channels. Fill out this form"
