full_description = '''Home Articles NewsAug 20, 2020 Xandr Sutjiadi RGD selected to design RGD Membership Sticker for 2021 Written by Xandr Sutjiadi RGD, ARToverMATTER Studio After careful consideration, the RGD Communications Committee has selected Xandr Sutjiadi to design the RGD Certification Sticker for 2021. The Sticker will be distributed to Certified RGD Members across Canada to be added to their RGD Certificates and Membership cards, representing another year of commitment to professional standards, ethical conduct and industry best practices. “The annual refresh of the RGD Certification sticker is a fascinating way to track the change and growth of the Association and all of our design sensibilities," explains Julian Brown RGD, VP & Chair of the RGD Communications Committee. "I love the work Xandr has done, specifically posters over the years for the Vancouver Queer Film Festival. It’s going to be great to see where they will take the design in 2021."About Xandr Sutjiadi RGDXandr is a QTBIPOC creative director, graphic designer, illustrator, web developer and educator who believes in using their creative power for social good. They founded Artovermatter in 2007 and have helped clients with a variety of projects including brand development, campaign and event-based design, custom illustrations, UX and UI design, print and digital designs, as well as custom WordPress sites.Mel loves working on projects that have a social impact and are passionate about social justice, diversity and inclusion. They have worked with organizations such as Calgary Pride, Out On Screen's Vancouver Queer Film Festival, Stratagem D&I Conference, the Centre for Gender & Sexual Health Equity, and MOSAIC BC. They are currently a co-organizer of CreativeMornings Calgary, TechSoup Canada’s NetSquared Calgary and a member of the RGD Diversity and Inclusion Committee.To explore other ways to contribute to RGD's upcoming and ongoing programs, fill out our online form and receive details on how you can get involved. Xandr Sutjiadi RGD ARToverMATTER Studio Xandr is a multi-hyphenated queer trans creative director, designer, illustrator, front-end developer, travelling speaker and educator. His design firm, ARToverMATTER, is a creative studio that gives a damn and specializes in helping changemakers make a positive impact in their communities. He is also a co-founder of Ripple of Change Magazine.Outside of AOM, you might find Xandr as a guest speaker sharing stories about his entrepreneurial immigrant life journey or advocating for inclusive and accessible design. Xandr sits on the Board of the Association of Graphic Designers (RGD) Canada and chairs the Diversity & Inclusion Committee. Mentioned in this article Related Articles News Elana Rudick RGD designs the 2024 Certification Sticker Elana Rudick RGD News Raj Grainger RGD designs a typographic 2023 Certification Sticker raj grainger RGD News Amanda DeVries RGD selected to design RGD Membership Sticker for 2025 Amanda DeVries RGD News Volunteer of the Month: Xandr Sutjiadi RGD Xandr Sutjiadi RGD Sponsored Sponsor Paper With A Plan: What Will You Make Today? Sponsor We are a different type of printing company. We like it that way and think you will too. RGD Partner Sponsor At Moveable, we’re ready to do whatever it takes to get your message out effectively. RGD Partner'''
