["https://rgd.ca/articles/elana-rudick-rgd-designs-the-2024-certification-sticker"]
title = "RGD | Elana Rudick RGD designs the 2024 Certification Sticker"
description = "Elana is the Founder and Creative Director of Design Is Yummy, an award-winning design studio with an appetite for crafting bold, purposeful designs. For the past 15 years, Elana and her team have been collaborating with brands that bring people together, drive change, and make an impact in the communities they serve. Their diverse projects span the arts and culture, education, healthcare, government, and nonprofit sectors. Elana is also a mom, mentor, and speaker on design and the business of it."
full_description = "Home Articles NewsJan 24, 2024 Elana Rudick RGD designs the 2024 Certification Sticker Written by Elana Rudick RGD, Design Is Yummy 2024 RGD Certification Sticker. Image: Elana Rudick RGD A new year means a new Certification Sticker for Certified RGDs. Elana Rudick RGD shares the concept and process behind her design for the 2024 Sticker. My design for the 2024 Certification Sticker celebrates the RGD as a central hub where designers can learn, share and grow as a community. Created by weaving shapes together, the symbol represents the synergy and collective strength formed when people come together and connect. Once the theme of ‘connection’ was approved, I got to work sketching. You'd think working within the constraints of a small sticker (less than 1”) and a limited colour palette would make the brief feel restrictive. I let myself flow and had fun exploring a multitude of ideas—some great, some awful and some just okay. As I filled pages in my sketchbook and dozens of post-its, the possibilities began to seem endless. Eventually I knew I'd have to commit to a direction. It wasn’t until a conversation with fellow RGD Member Paul Twa Provisional RGD called me a “maker” that something clicked (thanks Paul!). It led me to thinking about traditional makers and craft. As one of the oldest crafts and an early means of artistic expression, weaving as a visual representation emerged. As I explored weaving geometric shapes together, things started to fall into place. The RGD's Design Committee loved the concept and selected this design because of its energy. My hope is the design will resonate with RGD Members and make them feel #RGDProud. This initiative has welcomed designs from RGD Members across Canada over the past nine years, including: 2013: Phil Mondor RGD in Kitchener2015: Design de Plume in Sudbury2016: Goodall Integrated Design in Toronto2017: Michael Zavacky RGD in Ottawa2018: Kyle Greenwood RGD in Toronto2019: Jennifer Weaymouth RGD in Toronto2020: Rod McDonald RGD in Halifax2021: Xandr Sutjiadi RGD in Calgary2022: Matthew Clark RGD in Vancouver2023: Raj Grainger RGD in Toronto Elana Rudick RGD Design Is Yummy Elana is the Founder and Creative Director of Design Is Yummy, an award-winning design studio with an appetite for crafting bold, purposeful designs. For the past 15 years, Elana and her team have been collaborating with brands that bring people together, drive change, and make an impact in the communities they serve. Their diverse projects span the arts and culture, education, healthcare, government, and nonprofit sectors. Elana is also a mom, mentor, and speaker on design and the business of it. Related Articles News Focus on Benefits: Member discounts Ruth Farrugia RGD Inspiration ON THE CHASE! creates Motion Graphics using Pop Culture to raise Political Awareness among Youth Julian Brown RGD Insight Graphic Design Professionals Discuss Ownership of Rejected Designs Inspiration Looking Back: DesignThinkers 2002 Branding by Blok Design Vanessa Eckstein RGD Insight Budgeting for Accessibility Sponsored Sponsor User Experience Design! Learn More York University School of Continuing Studies Sponsor Putting Passion to Work: Your Partners For Digital, Marketing & Creative Staffing Sponsor Is a career in advertising for you?"
