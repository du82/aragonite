["https://rgd.ca/articles/volunteer-of-the-month-ashe-green-rgd"]
title = "RGD | Volunteer of the Month: Ashe Green RGD"
description = "For 13+ years my aesthetic has resonated with a wide range of clients, from local pillars like the City of Charlottetown, Music PEI, Volume 18, and Pride PEI, to thriving small and medium-sized businesses across Prince Edward Island. My influence extends far beyond the island, with collaborations with national brands like Shoppers Drug Mart and Purolator."
full_description = "Home Articles NewsOct 31, 2024 Volunteer of the Month: Ashe Green RGD Written by Ashe Green RGD, Hijinks Branding + Design Agency Inc. This November, we thank Ashe Green RGD for her contribution to the RGD community.How long have you been volunteering with the RGD, and in what capacity?Ever since I joined in April 2023, I’ve accepted every chance to volunteer. I’ve contributed to four articles, hosted an RGD Trivia Night and judged the Student Awards twice! I love being a part of the community, writing articles and having the opportunity to support students. These experiences have been really lovely and welcoming.What contribution are you most proud of / What experience/memory stands out for you?I loved hosting the RGD Trivia for my local design community. It was really neat being able to bring something new to the Island and teaching my fellow designers about the RGD in that process. We take a lot of pride in what we do, and you can really feel that joy; it’s almost tangible when you’re in a room with 20+ other creators. My favourite part about the experience was that a team of students ended up taking the top prize and really swooped in during the final round to snatch it. The energy in the room was insane, and I have no doubt there were many new connections made that night!What is the most surprising/unexpected thing about volunteering with the RGD?One surprising aspect of the RGD is the many opportunities available! I've learned not to worry when I can't do something because another opportunity will come along. Beyond what I’ve been doing, there are so many options for participating on Committees and maybe even joining the Board. I believe anyone can find a way to meaningfully contribute in a way that suits their needs and availability. “I have the great pleasure of working with Ashe Green RGD to engage with designers on a local level. Her enthusiasm to coordinate and host events in her city is what will help build recognition of the RGD here in the Maritimes. We feel very fortunate to benefit from her contributions.” Faron Dawe RGD What have you learned about the industry since volunteering for the RGD?It's much more connected than I anticipated. I think the mixture of it being the top design industry certification option in Canada and the rise of design communities online have really brought the industry closer together. We really are only a connection or three away from some of our design idols. Based on your experience volunteering with the RGD, how would you describe the organization's role in the industry?I would describe the RGD's role in our industry as integral. More designers need to join the organization. The sheer impact of DesignThinkers alone is enough reason to want to be a part of this, but the support, community, recognition and skill-building are phenomenal.What have you gained from being an RGD volunteer, and why would you recommend it to other members who might be thinking of getting involved?I feel like I belong and contribute to something much larger than myself. I get to put information out into the world via this impressive vessel, and I just never know who’s going to read those words and how they will resonate with them. Whatever I do, I try to do it with love and leadership in mind.Do you have thoughts on what you might like to do as a volunteer with the RGD in the future?I’d love to bring more events to the island and eventually be part of a Committee or the Board someday! But for now I am networking, learning and contributing as often as I can manage. However, I foresee my involvement with the RGD spanning my whole career. My only regret is that I didn’t have the confidence to join sooner. Details on Certified RGD Membership Find out about the fees and requirements. Ashe Green RGD Hijinks Branding + Design Agency Inc. For 13+ years my aesthetic has resonated with a wide range of clients, from local pillars like the City of Charlottetown, Music PEI, Volume 18, and Pride PEI, to thriving small and medium-sized businesses across Prince Edward Island. My influence extends far beyond the island, with collaborations with national brands like Shoppers Drug Mart and Purolator. Related Articles Insight City Design Tour: Charlottetown Ashe Green RGD Insight Accessibility in Canada: Quebec & PEI Ashe Green RGD, Ruth Farrugia RGD Interview Volunteer of the Month: Vanessa Eckstein RGD Interview Volunteer of the Month: Maggie Ostler RGD Interview Volunteer of the Month: Wendy Tabor RGD Sponsored Sponsor Get your message delivered, the AFIX way! Sponsor We Tell Compelling Stories. Let’s Make Something Great Together! RGD Partner Sponsor User Experience Design! Learn More York University School of Continuing Studies"
