["https://rgd.ca/articles/emerging-designers-and-students-design-mock-projects-with-help-of-rgd-mentors"]
title = "RGD | Emerging designers design mock projects with help of RGD Mentors — Part 2"
description = "Rupsha is a Designer specializing in Human-Centered Design, an Emerging Design Educator, and an Emerging Design Researcher. Rupsha is pursuing her Master of Design at York. Her work involves looking at the intersection of design, accessibility, and everyday health management. Her research focuses on designing interventions in augmented reality to assist with everyday activities for people living with early-stage dementia aiming to enhance their quality of life through the integration of rituals and habits. Supported by the Government of Canada Social Sciences and Humanities Research Council grant, she is working with people with dementia, their care partners, and community organizations across Ontario to design better ways to support people living with dementia in everyday life."
full_description = '''Home Articles NewsJul 08, 2024 Emerging designers design mock projects with help of RGD Mentors — Part 2 Written by Rupsha Mutsuddi Associate RGD, Rupsha Mutsuddi, Emma Hodgson Associate RGD, Elyse Maxwell RGD, Patch Design and Roxanne Hammond Associate RGD The RGD Project-Based Mentorship Program connects emerging designers and students with seasoned RGDs to enhance networking and portfolio development.Here are the results from some of the teams who collaborated for eight weeks on mock projects, guided by the Project-Based Mentorship Committee. IKEA Website RedesignThe project involved a redesign of IKEA Canada’s website focusing on redesigning the Home and Product page for BILLY bookcases, using UX research and design methodologies including considerations for information architecture principles, accessibility standards and IKEA's brand standards. The team was asked to observe, analyze and address usability issues in the current website, redesigning process involved both UX and visual design applied in an iterative manner with feedback and guidance provided along the way and giving the team opportunity to consider the core user experience of IKEA Canada, while assessing and improving the components and brand elements of which the design system is composed.For more details in regard to this project, visit the mentees' project pages:Deepti Banerjee Juyeop OhCherry Wu Mentor: “Guiding talented designers through the RGD Project-Based Mentorship Program for the hypothetical redesign of IKEA Canada's website has been an enriching experience. Given the opportunity to lead a team to solve real-world design challenges under realistic constraints showcased the intersection of UX and visual design. Emphasizing restraint in the design process ensured solutions were feasible and enhanced user experience without alienating IKEA’s customer base. It's been a pleasure mentoring a committed team that successfully delivered a high-quality solution within a tight timeframe.” Jennifer Eustace RGD Art Director: “The RGD Mentorship Program allowed me to lead IKEA's website redesign as Art Director and Project Manager. I faced challenges in team coordination, creative alignment and tight deadlines, which honed my leadership and creative skills. This project underscored the power of teamwork and prepared me for future industry challenges. I’m grateful for the support from Creative Director Jennifer and the dedication of my teammates Cherry, Juyeop and Andras.” Deepti Banerjee Associate RGD Designers: “I joined the RGD Mentorship Program because I wanted to connect with fellow Canadian designers. While I’m a recent graduate, I have more than 25 years of experience in Europe. Trying to fit into a team of young and talented people was a challenge at first, but I hope I could enrich the project with valuable insights during the process.” Andras Gyenes “The RGD Mentorship Program offered an unforgettable experience. Working in a team environment taught me how to collaborate with others and improved my understanding of what a good design should look like. Seeing the design evolve through feedback was enlightening. Collaborating with our mentor, the art director and other designers was incredibly valuable. I highly recommend this program to others.” “The RGD Project-Based Mentorship Program has been an invaluable experience, bridging my academic knowledge with real-world application. I have refined my skills, honed my problem-solving abilities and gained valuable insights into collaborative design thinking by working alongside seasoned professionals. This program has helped prepare me for my transition into product design, and I'm grateful for the mentorship and support.” Cherry Wu Associate RGD Nova Harbour Transit AppFor this project, the team set out to develop a design concept for a transit app for a fictional small town. The goal was to make an app that was accessible and solved common pain points that users identified while using alternative services and apps. Focused on improving the user experience, the team conducted research and an ideation workshop and built a design system to create the app. ResearchHi-fidelity DesignsPrototypes Mentor: Josh Skinner RGDArt Directors: Mackenzie Martin Associate RGD, Ria Chopra Associate RGD Designers “I enjoyed this experience and had a great time working with my team, gaining practical experience and design insights. This was my first time creating a transit app, which allowed me to rethink my route planning process and notice many small details that current transit apps use to make this process easier. I also identified several design decision-related problems that I encountered in previous UX projects, and I was able to get valuable inspiration and help from my mentors. Brainstorming ideas and collaborating with my fellow designer was also incredibly rewarding. We shared our diverse perspectives with each other and took and provided valuable feedback for refining our designs. I really wish I could work with everyone on my team again.” Siyu Wang Student RGD “It has been a great pleasure working with Josh, MacKenzie, Ria and Siyu! Josh's guidance definitely made the UX research process less daunting. I had a lot of fun and learned a great deal about the UI/UX pipeline, design systems and decision-making through the weekly critiques and design jam sessions.” Lucy Chen Associate RGD Safe-Transit AppOur project, initially focused on redesigning the SafeTTC app, aims to enhance transit safety. Collaborating with colleagues across multiple cities, we developed a white-label application integrating transit safety and cross-functional features into a unified platform. This multifunctional app allows users to report incidents via their mobile devices, with the option of anonymity. It also facilitates user connections, provides access to reports submitted through Transit Watch and delivers real-time updates on submitted incidents.Check out our process slide deck here! Our SafeTTC HiFi prototype is here! Mentor: “It was an absolute privilege to mentor such a bright and talented team—Olivia, Eloise, Khaosara and Camille. Their proactive approach to feedback propelled the development of the Safe-Transit App, a versatile platform designed to boost transit safety. This white-label application not only enables incident reporting with optional anonymity but also fosters community connectivity by providing real-time updates on reports and Transit Watch activities. Their dedication and innovative spirit were instrumental in evolving the initial SafeTTC app concept into a robust urban transit system.” Magued Hanna RGD Designers: “Magued was a great mentor who cultivated an environment for us to grow as designers. Our ideas were challenged in order to deliver better user experiences in a seamless manner that improve their interaction on the mobile app. His knowledge of UX was useful to expand our group's initial idea of a safety transit app to a white label app. We appreciated his supportive mentorship, which encouraged us to cultivate new ideas and enrich our knowledge base.” Khaosara Animashaun Student RGD “I loved getting to connect with professionals outside my workspace who all wished to develop their careers and skill sets together. The skills, insights and professional development I’ve gained from this program have been invaluable; the real-world tutelage of an experienced and expert professional like Magued was truly a privilege.” Olivia Baker-Sullivan Associate RGD “This program provided me with the opportunity to delve into a design field that I was eager to explore. I developed my skills in user experience design, including user research, interviews, testing and more. Additionally, I applied my visual skills to lead the user interface design phase of the process. Being part of Magued's team has significantly contributed to my growth as a graphic designer.” Camille Clores Associate RGD “Working with Magued and the team has been a delight. Throughout this program, I've had the opportunity to build confidence in my work and skills, as well as develop some serious leadership chops. This has proven invaluable in my development as a designer. My only regret is I wished I had done it sooner!” Eloïse Tassy-Bunyan Ngwiri STEM Explorers Brand IdentitySTEM Explorers is a summer camp designed to ignite curiosity and cultivate a passion for science, technology, engineering and mathematics (STEM) in children aged 5 to 13. Our team created a cohesive brand identity that captures the camp’s interactive experience, with sub-brand identities and branded character illustrations to emphasize the specific focus areas within STEM. This brand identity was thoroughly explored and applied across a comprehensive set of brand guidelines and various marketing materials.For more about the project, check out the link! Mentor: “Through brainstorming and feedback sessions, we created a collaborative environment to push creativity and learn from one another. Each designer brought unique strengths and capabilities to the project. As a mentor, this experience was not only about guiding the project to success, but also about nurturing the professional growth and creative confidence of each team member.” Meg Lynch RGD Art Directors: “Participating in the RGD Project-Based Mentorship Program as an art director was invaluable. This project offered a safe space to enhance my technical and soft skills. Our efforts produced a well-integrated and engaging brand identity, showcasing our creative energy. We went beyond the assignment requirements, as much as time allowed us, to further develop our skills and leveraged Meg's excellent guidance. Our work is the result of professional collaboration, adaptability and continuous learning, showcasing our commitment to delivering effective design solutions.” Rayhaneh Haghgoo RGD “In the RGD Mentorship Program, my role as Art Director involved collaborating closely. Together, we navigated the creative process while ensuring our vision was aligned. Throughout the project, I enhanced my leadership and mentoring skills by balancing creative direction with practical design considerations, learning to integrate feedback thoughtfully and adaptively. The result is a cohesive and vibrant brand identity that truly reflects our team's expertise and innovative spirit.” Preet Soni Associate RGD Designers: “This program allowed me to improve my character development skills and use my artistic abilities to add a whimsical, illustrative element to the project. It helped me grasp a better understanding of the style I’d like to adopt as a designer and illustrator. Personally, the best part of this project was working with other Members who I had never met, but who all dedicated themselves to the project. Many long nights were spent by each member of the team, and it all came together better than any of us could have hoped.” Yomna Ismail Student RGD “In the RGD Mentorship program, I enhanced my technical skills and received guidance on creating thoughtful design solutions. I assisted in the ideation phase, along with providing typography and creating a website that represents the brand. As a team, we were able to create a cohesive style guide that is dynamic and professional. Participating in this program was an invaluable experience; working with the team of was an enjoyable and engaging experience that helped me grow my skills and knowledge.” Jenna Shemmans Associate RGD Stay Lit, Stay Creative CampaignThis project challenges the stereotype that Gen Z graphic designers’ emphasis on work-life balance signifies a lack of work ethics. It questions the traditional notion that overwork and unpaid overtime are necessary for producing high-quality design work, and that junior designers must endure these conditions to succeed. By asking, "Why is Gen Z committed to work-life balance?" we aim to highlight the benefits of a healthy work-life balance for fostering creativity and reducing burnout. It seeks to start a conversation with hiring managers in the design industry about the value of professional boundaries and the importance of recognizing Gen Z's commitment to their work and well-being. We invite hiring managers to consider the value of professional boundaries and recognize Gen Z’s dedication to both their work and well-being.Join the conversation and share your views on work-life balance by participating in our online poll. Take the poll here. Mentor: “The project I proposed to the RGD had several key components—it had to be a real-world initiative from conception to public deployment, not just a mock-up; the team needed to select a relevant topic, identify the audience and develop engagement strategies; it had to be developed collaboratively, minimizing hierarchy; Finally, the project was to incorporate a novel use of the poster format as a design object in the public commons, aiming to animate and engage the target audience. I believe real-world projects often present unforeseen challenges and obstacles that mock-up exercises tend to sanitize. Public-facing projects, especially those aimed at industry audiences, are high-stakes. Working effectively in such settings demands discussion, consensus, compromise and cooperation—key skills for any designer. In my experience, building strong relationships with team members, client and vendors is crucial for the success of design projects, regardless of their scale. When relationships are not well-maintained, the quality of the design often suffers. I hope this project has shown participants that their design skills can be a powerful way to communicate in the public sphere. Engaging with both their community and industry, both online and offline, can be a meaningful and impactful way to use their craft.” Michael Barker RGD Art Director: “The RGD Mentorship Program provided a unique opportunity to collaborate with emerging designers on a real-world project. I learned about the challenges of creating a campaign from scratch, the intricacies of managing a team and the importance of adapting to real-world expectations. Working as an art director, I appreciated and was intrigued by my team's diverse perspectives and creativity. Together, we navigated the complexities of real-world projects, discovering that many unexpected issues can arise. With team members spread across three cities, we struggled with time zone differences and coordinating schedules. We used a Trello board for organization, FigJam for design and communicated via WhatsApp and email to manage these issues. This experience proved invaluable experiences, enhancing our skills and challenging industry stereotypes.” Olivier Schild Associate RGD Designers: “The RGD Mentorship Program offered a unique platform that allowed our team to experience the workflow of a real-world design project while also allowing room for trial and error. Throughout the project, our team faced numerous challenges: from ideation—such as consolidati'''
