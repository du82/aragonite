full_description = "Home About Partner With Us Education Partners Education Partners RGD works with post-secondary institutions across Canada to offer automatic Student Membership and other programs and services to students enrolled in graphic design and related programs. Below is a list of institutions currently working with RGD. Questions?Email Heidi@rgd.ca Algonquin College in Ottawa, ON 3 Year Graphic Design Diploma WebsiteContact: Alain Paradis RGD, Program CoordinatorEmail: paradia@algonquincollege.com Cambrian College in Sudbury, ON3 Year Graphic Design Diploma WebsiteContact: Sean Grant RGD, CoordinatorEmail: sean.grant@cambriancollege.ca Canadore College in North Bay, ON3 Year Graphic Design Diploma WebsiteContact: Shirley Mondoux RGD, CoordinatorEmail: shirley.mondoux@canadorecollege.ca Capilano University in North Vancouver, BC4 Year Bachelor of Design in Visual Communication WebsiteContact: Christina Lee Kim Koon, Co-Coordinator, Bachelor of Design & Interaction Design DiplomaEmail: christinapaone@capilanou.ca2 year Interaction Design Diploma WebsiteContact: Christina Lee Kim Koon, Co-Coordinator, Bachelor of Design & Interaction Design DiplomaEmail: christinapaone@capilanou.ca Centennial College in Toronto, ON3 Year Graphic Design DiplomaWebsiteContact: Lisa Rebnord, CoordinatorEmail: lrebnord@centennialcollege.ca Conestoga College, Kitchener, ON3 Year Graphic Design DiplomaThe Graphic Design advanced diploma program has an exceptional reputation for graduating talented designers and is recognized as one of the top design programs in the province. Industry professionals consistently acknowledge the excellence of Conestoga's graphic design students for their creative and practical design skills. Many students win regional, national, and international awards for their design work including RGD regional awards and category awards, ADCC, Applied Arts, Print, HOW and many others.Conestoga's graphic design students are prepared to assume junior-level positions and related responsibilities in the graphic design industry. They will use their knowledge of design industry trends to plan and create purposeful visual communications, in collaboration with colleagues, supervisors, art or creative directors, project managers, and clients.WebsiteContact: Mike Powell, RGD, Interim Coordinator Email: Mapowell@conestogac.on.ca4 Year Bachelor of DesignThe Bachelor of Design is a four-year degree in graphic design with a complement of courses in entrepreneurship, marketing and management. The program will ensure graduates have both the creative and visual acuity and the knowledge of business strategy, that are necessary to create design solutions for current market needs.Conestoga's graphic design students are prepared to assume junior-level positions and related responsibilities in the graphic design industry. They will use their knowledge of design industry trends to plan and create purposeful visual communications, in collaboration with colleagues, supervisors, art or creative directors, project managers and clients.Phone: 519.748.5220WebsiteContact: Josh Peressotti, CoordinatorEmail: Jperessotti@conestogac.on.ca Fanshawe College of Applied Arts & Technology in London, ON3 Year Graphic Design DiplomaWebsiteContact: Lee-Ann Sandford, Program CoordinatorEmail: LSandford@fanshawec.ca George Brown College in Toronto, ON3 Year Graphic Design Diploma WebsiteContact: Nicole Dimson RGD, CoordinatorEmail: ndimson@georgebrown.ca3 Year Interaction Design and Development Diploma WebsiteContact: Nastaran Dadashi & Toni Allen, CoordinatorsEmail: Nastaran.Dadashi@georgebrown.ca, Toni.Allen@georgebrown.ca4 Year Honours Bachelor of Digital Experience Design WebsiteContact: Nastaran Dadashi, Co-ordinatorEmail: digitalexperience@georgebrown.ca4 Year Honours Bachelor of Brand Design WebsiteContact: Ana Rita MoraisEmail: AnaRita.Morais@georgebrown.ca Georgian College in Barrie, ON3 Year Graphic Design Diploma WebsiteContact: Tristan Quesnelle RGD, CoordinatorEmail: tristan.quesnelle@georgiancollege.ca2 Year Graphic Design Production Diploma WebsiteContact: Tristan Quesnelle RGD, CoordinatorEmail: tristan.quesnelle@georgiancollege.ca Holland College in Charlottetown, PE2 Year Graphic Design Diploma WebsiteContact: April Condon, Graphic Design InstructorEmail: ajcondon@hollandcollege.comPhone: 9022132370 Humber College in Toronto, ON4 Year Bachelor of Design WebsiteContact: Ahmed (Am) Sagarwala, Associate Design, Interactive DesignEmail: Ahmed.Sagarwala@humber.ca3 Year Graphic Design Diploma WebsiteContact: Ahmed (Am) Sagarwala, Associate Design, Interactive DesignEmail: Ahmed.Sagarwala@humber.ca2 Year Multimedia Design & Development Diploma WebsiteContact: Ahmed (Am) Sagarwala, Associate Design, Interactive DesignEmail: Ahmed.Sagarwala@humber.ca Mount Royal University in Calgary, AB4 Year Bachelor of Communication Website: mtroyal.caContact: Dr. Milena Radzikowska RGD, Program ChairEmail: mradzikowska@mroyal.ca Niagara College in Welland, ON3 Year Graphic Design DiplomaWebsiteContact: Jessie Demone, CoordinatorEmail: jdemone@niagaracollege.ca Sault College in Sault Ste. Marie, ON3 Year Graphic Design Diploma (accelerated 2-year timeframe) WebsiteContact: Frank SalituriEmail: Frank.Salituri@saultcollege.ca Seneca College in Toronto, ON3 Year Graphic Design Diploma WebsiteContact: Kinmond Smith, Program CoordinatorEmail: kinmond.smith@senecacollege.ca St. Lawrence College in Kingston, ON3 Year Graphic Design Diploma WebsiteContact: Erin Boye RGD & Andrea Ruskin RGD, Program Co-CoordinatorsEmail: graphicdesign@sl.on.ca University of the Fraser Valley, Mission, BC2 Year Graphic & Digital Design Diploma WebsiteContact: Jennifer Deon, Department HeadEmail: Jennifer.Deon@ufv.ca Vancouver Island University, Nanaimo, BC4 Year Bachelor of Design in Graphic Design WebsiteContact: Nancy Page, Chair, Graphic DesignEmail: graphicdesign@viu.ca York University in Toronto, ON4 Year Bachelor of Design WebsiteContact: Angela Norwood