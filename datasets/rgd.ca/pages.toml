["https://rgd.ca/articles/city-design-tour-charlottetown"]
title = "RGD | City Design Tour: Charlottetown"
description = "For 13+ years my aesthetic has resonated with a wide range of clients, from local pillars like the City of Charlottetown, Music PEI, Volume 18, and Pride PEI, to thriving small and medium-sized businesses across Prince Edward Island. My influence extends far beyond the island, with collaborations with national brands like Shoppers Drug Mart and Purolator."
full_description = "Home Articles InsightOct 18, 2024 City Design Tour: Charlottetown Written by Ashe Green RGD, Hijinks Branding + Design Agency Inc. Ashe Green RGD, Designer & Creative Director at Hijinks Design Agency, shares the design experience for her city, Charlottetown, Prince Edward Island. What makes your city’s design scene special/unique? We’re a small city with an excellent graphic design program offered at Holland College. The program attracts students internationally, so we have a beautiful showcase of design cultures every year. Local industry professionals are quite involved with curriculum, portfolio reviews, speaking engagements and advisory boards at the College, so students get a lot of one-on-one time and opportunities to build relationships before they graduate. The College also holds an annual Art and Design Conference called DotGain. The community is incredibly connected for this reason, which is really special. Is there a place/landmark in your city that helps inspire you as a designer? I would be remiss if I didn’t give a nod to our world-class theatre and art gallery, the Confederation Centre of the Arts. Right now, we have this brilliant Erica Rutherford exhibit. She was a real trailblazer as a Transgender British-Canadian artist, filmmaker, and writer. Her artwork features bold colour blocking and contrasting colours. It’s a visual feast for a graphic designer. The Centre itself is also a design landmark due to its brutalist architecture. And, if you lack creative energy, a walk through Charlottetown's downtown area is bound to get your mind racing with new ideas. Are there any challenges that designers in your city face?There are challenges being a designer on a small island of approximately 180,000 people. It can be difficult to break into business since many relationships are formed over years of shared experiences and family connections. However, since we’re more connected globally than ever, there’s a lot of opportunity to work with clients or sell products off-Island. Many local designers have online stores, sell design assets on platforms like Creative Market and find clients through online platforms. With COVID came the normalization of remote work, which has always worked well for freelance designers and that’s helped address this local challenge. Ashe Green RGD Hijinks Branding + Design Agency Inc. For 13+ years my aesthetic has resonated with a wide range of clients, from local pillars like the City of Charlottetown, Music PEI, Volume 18, and Pride PEI, to thriving small and medium-sized businesses across Prince Edward Island. My influence extends far beyond the island, with collaborations with national brands like Shoppers Drug Mart and Purolator. Related Articles Insight City Design Tour: Portland Caitlin Wharton RGD Inspiration City Design Tour: Montpellier Anda Lupascu RGD Insight City Design Tour: Vancouver Maria Sinisterra RGD Inspiration City Design Tour: Halifax Greg Dubeau RGD Inspiration City Design Tour: Calgary Tara O'Reilly Sponsored Sponsor We are a different type of printing company. We like it that way and think you will too. RGD Partner Sponsor Putting Passion to Work: Your Partners For Digital, Marketing & Creative Staffing Sponsor Realize your potential at the York University School of Continuing Studies RGD Partner"
