["https://rgd.ca/connecting-learning/events-training/storytelling-in-ux-building-compelling-case-studies"]
title = "RGD | Storytelling in UX: Building Compelling Case Studies"
description = "Presented by Samiksha Makhijani RGD..."
full_description = "Home Connecting & Learning Events & Training Webinar Storytelling in UX: Building Compelling Case Studies Presented by Samiksha Makhijani RGD Storytelling in UX: Building Compelling Case Studies virtual Thursday March 06 @ 2 pm ET Register Are you a Member? I am a Member Email Password Login Forgot password I am not a Member Once you have paid for the webinar, you will be sent the link to register on Zoom.Members receive free Guest Passes to share with colleagues and friends. Guests can fill out this form: https://rgdhub.wufoo.com/forms... Non-members Pay Here Free for MembersNon-Members:$35 Storytelling in UX: Building Compelling Case Studies virtual Thursday March 06 @ 2 pm ET Register Are you a Member? I am a Member Email Password Login Forgot password I am not a Member Once you have paid for the webinar, you will be sent the link to register on Zoom.Members receive free Guest Passes to share with colleagues and friends. Guests can fill out this form: https://rgdhub.wufoo.com/forms... Non-members Pay Here Dive into the art of storytelling within UX design in our upcoming webinar. This webinar will teach you how to transform your UX projects into engaging narratives that clearly showcase the impact and innovation of your designs. Learn key strategies for crafting narratives that captivate and communicate effectively, including structuring case studies, employing engaging storytelling techniques and enhancing your narrative with visuals. The webinar will also include a hands-on workshop to apply these concepts in real-time, perfecting your approach to creating memorable and persuasive UX case studies. This webinar is perfect for UX professionals, designers and anyone interested in enhancing their storytelling skills to better showcase their projects and influence their stakeholders. Whether you’re working on your portfolio, preparing for a client presentation or just looking to make your work stand out, this session will provide you with valuable tools and techniques to make your case studies shine. About Samiksha Makhijani RGDSamiksha is a multidisciplinary designer with over 10 years of experience spanning interior design, graphic design, UX and product design. Her professional journey includes impactful roles at leading companies such as Shutterstock, TD Bank and Circle, where she has been at the forefront of integrating Fintech, AI and Cryptocurrency into user-centered design solutions that simplify complex systems. Samiksha’s work is driven by a passion for emerging technologies, aiming to create digital experiences that are both accessible and transformative. An advocate for continuous learning, Samiksha has enhanced her skills in AI through a specialized course from Stanford University, further enriching her design approach. As an Advisory Group Member at RGD XD, VP of AIGA Miami and an Advisory Committee member for Graphic Design program at Georgian College, she actively contributes to the design community through mentorship, speaking and industry leadership. In addition, she has served as a judge at multiple hackathons, including her current role at AIVA and recently as a portfolio reviewer for RGD. Samiksha also extends her expertise to mentoring up-and-coming designers through ADPList, where she guides them in refining their portfolios and career strategies. Register Are you a Member? I am a Member Email Password Login Forgot password I am not a Member Once you have paid for the webinar, you will be sent the link to register on Zoom.Members receive free Guest Passes to share with colleagues and friends. Guests can fill out this form: https://rgdhub.wufoo.com/forms... Non-members Pay Here Related Videos Video Inclusion, Equality, Progress: Dignified Representation in Visual Culture Andy Chen Video AMA with Liz Gilmore Liz Gilmore Video Design Reset Aaris Sherin Video Webinar: The Hard Sell of Design Video Stepping into Consistency by Naveesha Maharaj and Phillip Fernandez Naveesha Maharaj, Phillip Fernandez Sponsored Sponsor Paper Trails: Finding the Perfect Line RGD Partner Sponsor WeirFoulds LLP is one of Canada’s oldest and most prestigious law firms. RGD Partner Sponsor Linda Mackie Creative: Breathing Life Into Your Image"
