["https://rgd.ca/connecting-learning/community/awards/in-house-awards"]
title = "RGD | 2024 In-House Design Awards"
description = "The RGD In-House Design Awards celebrate outstanding projects by creatives working in-house in Canada and around the world."
full_description = "Home Connecting & Learning Community Awards 2024 In-House Design Awards 2024 In-House Design Awards Celebrating work done by creatives working internally in Canada and around the world.The In-House Design Awards will be presented again in 2026. If you have a project that you would like to be considered for showcasing across RGD channels, complete this form. Click to see the results “ I thoroughly enjoyed the experience of judging the In-House awards. With my extensive background working in-house for many years, I hold a deep passion for the exceptional quality of work that in-house teams can deliver. And let me tell you, the submissions this time around were truly impressive! Christine Goucher RGD View Christine's profile Eligibility Anyone working in Canada or internationally as part of an internal creative team whether within a company, government, non-profit, charity, institution or other type of organization where graphic design is not the main service offered by the organization.In-house designers/teams may submit work done in partnership with external design studios where the bulk of the work was done in-house and/or supporting elements were completed by the external studio. What to submit Internal creative teams are invited to submit examples of work into any of the following areas: branding (incl. logo, letterhead, brand standards, identity program) interactive (incl. websites, apps, user interface) promotion (incl. social media, advertising, posters, invitations, direct mail) print & digital publications (incl. newsletters, reports, brochures, books, e-books, e-newsletters)packaging environmental (incl. signs, wayfinding, tradeshow booths, vehicle wraps, exhibits) film & video (incl. presentations, motion graphics) misc (incl. infographics, apparel, labels)cross-media campaign/program Any work launched after January 1, 2019 and before February 16, 2024 may be entered. Submission specifications Entrants may submit up to 6 files per entry (10 MB per file).Image file formats should be .jpg or .pdf no smaller than 3” for the shortest dimension at 300 dpi.Website/related interactive entries should include screen captures based on above specs and/or the URL where the site/work is live.Video entry formats are: .mov or .mp4. Include screen captures or still images based on above specs. Additional requirements Entrants must describe: What were the primary objectives of the project and how these were met through the design? (200 or less)Describe any challenges (ie. lack of resources, limited budget, accessibility requirements) and how your team was able to solve them. (250 words or less)Describe how this project was a success. Outline any measurable results that were achieved for your organization. (250 words or less) Why enterDemonstrate to your employer the value of the work you doCompete against other in-house designers who face the same challenges and constraintsBe judged by in-house design managers who understand what it takes to work in-house and do great workDemonstrate that great design (and ultimately design effectiveness) is often the result of deep brand knowledge and continuous client collaboration, both vital strengths of in-house designersHelp the RGD to celebrate the amazing work being done in-house (which will in turn help us understand your challenges better and program events and content relevant to your experiences.)What winners receiveBe featured in an exhibit presented at DesignThinkers in Vancouver (May 28–29) and Toronto (November 8–9);Have the opportunity to purchase a physical award and attend a ceremony held in conjunction with DesignThinkers 2024 in Vancouver;Be profiled on the RGD website and across RGD communication channels; Receive a certificate;Receive 25% off registration to DesignThinkers 2024 in Vancouver and Toronto; andBe entered to win prizes, including $500 in training from Accessibility Canada and a free RGD Team Membership ($1,425 CAD value).Who may enter?Anyone working in Canada or internationally as part of an internal creative team whether within a company, government, non-profit, charity, institution or other type of organization where graphic design is not the main service offered by the organization.In-house designers/teams may submit work done in partnership with external design studios where the bulk of the work was done in-house and/or supporting elements were completed by the external studio.FeesEarly Bird Fees (to January 26, 2024)Student RGD* & Provisional RGD Members: 1–2 entries: $50 each; 3 or more entries: $40Certified RGD & Affiliate Members: 1–2 entries: $80 each; 3 or more entries: $65 eachNon-members: 1–2 entries: $95 each; 3 or more entries: $80*Students can submit work done in-house as part of an internship or as an employee before or during schoolRegular Fees (January 27–February 23, 2024)Student RGD* & Provisional RGD Members: 1–2 entries: $70 each; 3 or more entries: $50Certified RGD & Affiliate Members: 1–2 entries: $95 each; 3 or more entries: $80 eachNon-members: 1–2 entries: $120 each; 3 or more entries: $105Enter for freeTeam Members of RGD can enter three entries free; additional entries: $50 eachCertified RGDs who complete their RGD Certification in 2024 (prior to the entry deadline) can enter any eligible projects from their portfolio presentation free.The RGD is Canada's largest non-profit, professional Association dedicated to advocating for the value of design in communication. This means that the fees from your entry are put back into supporting the RGD's programming and initiatives such as our Accessibility Guidelines, Mentorship Programs and Trailblazer Awards.SponsorsArcadis, AFIX, Domtar, Mitchell Sandham, Moveable, Porchlight Press, Accessibility Canada FAQsCan I submit a collage of images of my newsletter/catalogue etc., or can I submit the whole file?Entrants may submit the file in its entirety as long as it does not exceed our 10 MB per file limit. If the file exceeds the 10 MB limit, entrants can upload a ZIP file, upload via Dropbox or link to a downloadable file.If my team is submitting screen grabs of an interactive project, does each photo count as one of the six entries? If submitted as jpegs, each photo would count as one of the six file submissions. If this poses an issue, you can create a PDF document of screen grabs and submit up to six of these.Can I submit entries for my design team, or do we need to submit everything individually?Design teams are encouraged to submit their work! If a team has one or more RGD Members, the project(s) were worked on by the RGD Member(s) and they're listed in the credits, the project can be submitted under the RGD fee. If not, the project(s) fall under the Non-Member category. Questions? Email inhouse@rgd.ca 2024 Sponsors AFIX | Arcadis | Domtar | Moveable | Porchlight Press | Accessibility Canada 2021 In-House Design Award Winners 2016 In-House Design Award Winners 2024 In-House Design Awards Judges Sponsored Sponsor Putting Passion to Work: Your Partners For Digital, Marketing & Creative Staffing Sponsor User Experience Design! Learn More York University School of Continuing Studies Sponsor We are a different type of printing company. We like it that way and think you will too. RGD Partner"
