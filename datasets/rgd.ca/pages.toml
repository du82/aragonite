["https://rgd.ca/articles/rgd-updates-certification-process-with-new-pathways-and-exclusive-incentive"]
title = "RGD | The RGD updates our Certification Process"
full_description = "Home Articles NewsMar 03, 2025 The RGD updates our Certification Process We are excited to announce significant changes to our Certification Process, reflecting our commitment to inclusivity and our understanding of the diversity of design career paths.We now offer four distinct Certification pathways:Visual Designers: Designers working in disciplines that are visually focused, such as communication, motion, environmental, etc.Experience Designers: Designers working in disciplines that are experientially focused, such as UX, product, service, etc.Design Managers: Anyone managing the design process in any design discipline.Design Educators: Anyone teaching in any design discipline.These pathways acknowledge the diverse expertise within our field, allowing candidates to showcase their specific skills during the Certification Process. All Certified RGDs share the same designation, but we offer guidelines and application forms tailored to specific disciplines to accommodate and reflect the differences in practice. This approach ensures that while maintaining a unified professional standard, we recognize and support the different areas of specialization within the design field. Candidates are encouraged to choose the most relevant pathway for their work. “RGD Certification is an opportunity to receive recognition of your skills and experience and enhance your credibility across industries. These developments help remove barriers, make the process more inclusive and allow us to support a whole new world of specialization. The benefits of Certification remain; most importantly, confirmation that you practice the profession of design ethically and professionally.” Nicola Hamilton RGD Enhanced application and presentation requirementsThe application and presentation now require three case studies. The goal is to have you submit case studies of your best work and provide an in-depth analysis of your process in the 30-minute presentation. (There are no date requirements for the three case studies, although their relevance to today's market will be assessed in both the eligibility stage (when applications are reviewed) and as part of the presentation evaluation.Streamlined Online Test focused on core principlesThe open book, multiple-choice Online Test now consists of two sections (Ethics & Accessibility) for all candidates. Design Research, Business and Principles are assessed in other ways, while Ethics and Accessibility are cornerstones of the RGD and what it means to be a Certified RGD.PathwaysEach pathway has a customized application and evaluation criteria representative of the field and allows for different types of submissions. Design Managers, for instance, may submit articles or presentations that they have given, while Design Educators can submit course curriculum or papers. “We're excited about the updates to the Certification process. RGD has streamlined the process while maintaining our commitment to Ethics and Accessibility. We hope that it will help reduce barriers and entice more talented designers to join the RGD network!” Michelle Hopgood RGD If you are a successful Certification candidate who completes the Certification by the Branding Awards entry deadline, you can enter your submitted case studies for free. Need another reason to get RGD Certified? Apply for your RGD Certification by March 7 (and successfully complete by April 11) to receive free registration to both DesignThinkers Conferences in 2025: Vancouver and Toronto (virtual or in-person) (Limited to the first 30 successful candidates). Apply now Sign up for the RGD Certification Mentorship ProgramGet paired with a mentor who will support you on your journey to becoming a Certified RGD. This program connects aspiring Certified RGDs with experienced mentors who can answer questions, share their Certification experiences and provide guidance throughout the process based on your background or areas of focus.Associate RGDs, Affiliate Members and designers with at least seven years of combined education and work experience are invited to apply. Tag Membership Related Articles News Elana Rudick RGD designs the 2024 Certification Sticker Elana Rudick RGD News Matthew Clark RGD designs 2022 Certification Sticker with brighter days in mind Matthew Clark RGD News Amanda DeVries RGD designs the 2025 Certification Sticker with the concept of learn the rules, then break them Amanda DeVries RGD News Xandr Sutjiadi RGD selected to design RGD Membership Sticker for 2021 Xandr Sutjiadi RGD Sponsored Sponsor Linda Mackie Creative: Breathing Life Into Your Image Sponsor We Tell Compelling Stories. Let’s Make Something Great Together! RGD Partner Sponsor Paper Trails: Finding the Perfect Line RGD Partner"
