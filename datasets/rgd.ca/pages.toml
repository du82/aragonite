["https://rgd.ca/articles/watch-designthinkers-presentations-from-black-industry-leaders"]
title = "RGD | Watch DesignThinkers presentations from Black industry leaders"
full_description = '''Home Articles InsightJul 10, 2024 Watch DesignThinkers presentations from Black industry leaders The RGD shares 10 presentations from the RGD's Video Library by Black creatives who have spoken at DesignThinkers in recent years. These include Chief Design Officer at Stellantis, Ralph Gilles, who participated back in 2017 and will join us once again this November for DesignThinkers 2024 in Toronto.Recordings of DesignThinkers presentations going back to 2011 are available for free to RGD Members. Non-Members will have access to these presentations until August 1. Cey AdamsTalk: Departure – 40 Years of Art & DesignDesignThinkers 2023 VancouverIn this talk, Cey chronicles his career of more than 40 years. Beginning in the early ‘80s in New York City as a subway graffiti writer, he described his time as the creative director for Def Jam Recordings, designing album covers and brand identities for Run DMC, Beastie Boys, LLCoolJ, Public Enemy and many more. He also highlighted work from (present day) brand partnerships with The Smithsonian, Levi’s, Mattel, Footlocker and Google.Cey emerged from the downtown graffiti movement to exhibit alongside artists Jean-Michel Basquiat and Keith Haring. Currently working as a freelance Creative Director out of New York City, he served as Creative Director for Def Jam Recordings, where he co-founded the label’s in-house design firm, creating identities, album covers, logos and campaigns for Run DMC, Beastie Boys, LL Cool J, Notorious B.I.G., Maroon 5, Jay-Z and more. He co-authored DEFinition: The Art and Design of Hip-Hop and designed the book Def Jam Recordings: The First 25 Years of the Last Great Record Label. Forest YoungTalk: Outside InsideDesignThinkers 2023 in TorontoJoin Forest as he shares a unique perspective, moving from the agency world to in-house at Rivian—an early stage company. He reflects on significant projects from a new lens, and the unique opportunities of working inside at a transformational company.Forest is former Global Head of Brand at Rivian, where he was responsible for the expression of the Rivian brand across its people, products and services. Previous to this, Forest was the Chief Creative Officer at Wolff Olins. Forest is a Senior Critic in graphic design at the Yale School of Art, where he is also a distinguished MFA alumnus. He is a founding advisor for Miller-Knoll’s Diversity in Design collaborative. Forest’s work has been exhibited at MoMA, the ROM, the Royal College of Art and at numerous international biennials. He is a recipient of the Gold Design Lion at Cannes and the Art Directors Club Black Cube. Maurice CherryTalk: 10 Years of Revision PathDesignThinkers 2022 in TorontoIn this talk, Maurice, shares the story of Revision Path from the very beginning. He joined the DesignThinkers audience for the first time ever to share what it took to build and sustain a project of this scale. Maurice talked about what he had learned over the years, the ups and downs, and the previously unknown history. He also previewed what he had in store for the podcast's milestone 10th year.Maurice is an award-winning Creative Producer, Designer and Podcaster known for founding Lunch, a multidisciplinary creative studio established in 2008. His renowned podcast, Revision Path™, highlights Black designers and digital creators globally and is part of the Smithsonian National Museum of African American History and Culture's permanent collection. Maurice's impactful projects also include the Black Weblog Awards, 28 Days of the Web, and the design anthology RECOGNIZE. He received the 2018 Steven Heller Prize for Cultural Commentary, was named one of GDUSA's "People to Watch in 2018," and featured in The Root 100 in 2018. Angela BainsTalk: I Never Knew Black People Could DesignDesignThinkers 2020 VirtualIn this talk, Angela goes deep and real into her design journey. Are you listening, questioning, inquiring or self-reflecting about the design industry and its struggle with diversity? If so, you will walk away from Angela's talk with a fuller understanding of this ongoing struggle.With over 30 years of experience in the design industry, Angela is the Co-Founder and Strategic Director of TransformExp, an award-winning design firm with clients like BBC Television, BC Liquor Stores, Swatch Canada and The Ritz-Carlton. She has also spent many years designing for social change, including the Free Nelson Mandela Campaign and the first World Aid Day concert. As an Educator, Angela has been nominated for seven local and national teaching awards of excellence in Canada and has won Teaching Excellence Award at BCIT. She has also developed several creative industry career events with the British Columbia Institute of Technology Student Association and has organized events to participate in Vancouver Design Week, as well as, her very own BainsExtraBold UK TYPE TOUR 2018 David Nuff RGDTalk: The Artful Designer: Creating for Commerce and CultureDesignThinkers 2019 in TorontoWith one foot in both the art and design worlds, in this talk David shares his experiences from across the divide and through recent projects. Designer and Principal at Nuff, David designs brand identities, apps, interactive installations and murals. His commercial clients include the Royal Conservatory, Nestlé and the Museum of Jewish Montreal. His artistic practice has produced work for Ontario Place, Museum of Contemporary Art Toronto, Ontario Science Centre and Artist Project. He lives in Toronto with thirty-one houseplants. Jessica BellamyTalk: Equity in Information & Experience DesignDesignThinkers 2019 in TorontoIn this talk, Jessica shares her experiences as a creative operating at the intersection of community organizing, information design, research and experience design. As she walks us through impact design case studies, you'll learn her six principles of conscious and responsible design, develop an understanding of data for equity and pick up the tools necessary to be successful in the social change sector.Jessica is an award-winning international speaker, workshop facilitator, motion infographic designer and research analyst. She and her colleague Josh Poe are the founders of the Root Cause Research Center which is a grassroots-led institution that collects data, creates data visuals and trains impacted community Members in research and data storytelling. She has been featured in: Communication Arts, Thrive Global, Forbes, The Great Discontent, Creative Mornings, Project 1324 (Facebook mobile experience), Slack Blog, Create Magazine, The Dieline, Revision Path, etc. Ralph Gilles In Conversation with Scott DadichDesignThinkers 2017Ralph offers insights into this unique world where design is paramount and shares his experiences designing some of the greatest automotive designs of our era.As the global head of design at Fiat Chrysler Automobiles (FCA), Ralph Gilles oversees design for the company's iconic brands - Chrysler, Dodge, Jeep®, Ram Trucks, Alfa Romeo and Maserati. Since joining Chrysler in 1992, he has served as Senior Vice President - Product Design and President and CEO - Motorsports, FCA - North America; President and CEO - SRT Brand; and President and CEO - Dodge brand for FCA US LLC. Ralph has been sketching cars since he was 7 years old. He draws design inspiration from pop culture and experiences from traveling the world. Ralph believes that ensuring a vehicle has a soul is the key to great design. Ashleigh AxiosTalk: #ThanksObamaDesignThinkers 2016Get a behind-the-scenes look at how innovative design and digital strategy happen in-house at 1600 Pennsylvania Avenue. Ashleigh showsand-tells how her small design team transformed daunting challenges into successful digital campaigns as part of the Obama administration. Hear her team tactics for tackling limited resources, overcoming impossibly quick timelines, experimenting while in the public spotlight, and not just taking criticism, but intentionally seeking it out. Have fun counting the animated GIFs while you collect all sorts of tips from the former White House creative director.Ashleigh is an international speaker, strategic creative and an advocate for design's ability to break barriers and create positive social and cultural change. She is the Chief Experience Officer and a Partner at Coforma (formerly &Partners), a digital consultancy and design studio and a chair of the national board of directors for AIGA. In the past, Ashleigh served as the creative director and a digital strategist for the Obama White House, bridging two presidential terms in the Office of Digital Strategy. She was named one of GDUSA’s People to Watch, featured in Essence Magazine as one of the 29 most powerful black women in the Obama administration and received the DCFemTech Award for being a powerful woman designer. Darhil Crooks Talk: Print in the Digital Age DesignThinkers 2013 in TorontoIn this talk, Darhil discusses the process of redesigning the magazine as well as the challenges and opportunities for a media brand to design a sustainable business model that supports storytelling.Darhil is the Creative Director at Apple Inc. Formerly Creative Director of The Atlantic, he oversaw the art direction of the magazine across print, online and on mobile and tablet devices. His work has graced the covers of some of the world’s most popular magazines, including Esquire, Ebony and The Source. You might also want to check out! On-demand recording of the Indigenous Design webinar by Mark Rutledge RGD, focusing on the proper use of Indigenous culture and spirituality in design and communication projects, particularly in logos and brands. Members can watch for free, and non-members can rent the video for 30 days for US$7. Watch now! Tag Conferences Related Articles Insight Elevating Design Voices: Sharon Lockwood RGD Sharon Lockwood RGD Insight Elevating Design Voices: Patrick White RGD Patrick White RGD News Discovering Ghana's Kente cloth Derrick Oduro Associate RGD Inspiration Designers inspiring designers Riane Ayoung Associate RGD, Brittany Russell, Kathy-Ann Scantlebury Associate RGD, Ashley Tomlinson Associate RGD, Donica Willis RGD Insight Learning list: Anti-Black racism and graphic design Sponsored Sponsor Get your message delivered, the AFIX way! Sponsor At Moveable, we’re ready to do whatever it takes to get your message out effectively. RGD Partner Sponsor Realize your potential at the York University School of Continuing Studies RGD Partner Join Diversity and Inclusion Committee Members are invited to join the Diversity & Inclusion Committee to support and contribute to the RGD's initiatives. To know more about getting involved, contact rebecca@rgd.ca Diversity & Inclusion Committee'''
