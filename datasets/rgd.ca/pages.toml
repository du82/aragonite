["https://rgd.ca/articles/project-based-mentorship"]
title = "RGD | Emerging designers and students design mock projects with help of RGD Mentors"
description = "Rupsha is a Designer specializing in Human-Centered Design, an Emerging Design Educator, and an Emerging Design Researcher. Rupsha is pursuing her Master of Design at York. Her work involves looking at the intersection of design, accessibility, and everyday health management. Her research focuses on designing interventions in augmented reality to assist with everyday activities for people living with early-stage dementia aiming to enhance their quality of life through the integration of rituals and habits. Supported by the Government of Canada Social Sciences and Humanities Research Council grant, she is working with people with dementia, their care partners, and community organizations across Ontario to design better ways to support people living with dementia in everyday life."
full_description = "Home Articles NewsJul 01, 2024 Emerging designers and students design mock projects with help of RGD Mentors Written by Rupsha Mutsuddi Associate RGD, Rupsha Mutsuddi, Emma Hodgson Associate RGD, Roxanne Hammond Associate RGD and Elyse Maxwell RGD, Patch Design The RGD Project-Based Mentorship Program connects emerging designers and students with seasoned RGDs to enhance networking and portfolio development. Teams collaborated for eight weeks on mock projects, guided by the Project-Based Mentorship Committee. For our inaugural round of Project-Based Mentorship, there were 13 projects developed by 13 teams with 12 mentors and 45 team members. Here are the results from some of the teams. Stay tuned for more to be published in August. GTA Trails App The project goal was to develop an app for the Toronto and Region Conservation Authority (TRCA), which oversees Toronto's extensive ravine system and conservation areas. Despite the city's vast network of nature trails, many residents are unaware of their locations or how to access them safely. Jay addressed this by creating a user persona, researching existing apps and conceptualizing an application. This app not only helps users navigate ravine trails but also allows them to report issues for maintenance. Mentor (2 projects): “It’s been a very rewarding experience meeting these budding designers and showing them the magic of empathy in UX design. Walking them through a “make believe” project is a unique way to explore the methodology of User Experience Design in a space that allows for experimentation and learning. This program also reminded me of the importance of play in the process of balancing research and design with a deliberate approach to creating meaningful outcomes.” Iffat Jokhio RGD Mentee: “I found this mentorship mock project very informative and really beneficial. UX Design has so many moving parts and Iffat broke them down week by week; She helped us create beautiful and functional mockups. I enjoyed my time learning and want to pursue UX design in the future.” Jay Ginsherman Associate RGD Derma AppJersey created a mobile and desktop application to enhance the experience of patients and healthcare providers who deal with Isotretinoin, a dermatology drug used to treat severe acne when other treatments have been exhausted. For a patient, the mobile app allows them to track their progress by taking photos and logging symptoms, access resources, receive reminders and easily communicate with their dermatologist. For healthcare providers, such as the dermatologists, the desktop app streamlines patient tracking and management, facilitating supervision of treatment. The entire application is fictitiously designed as an extension of the Canadian Dermatology and Plastic Surgery Centre, aligning with its brand standards. Mentee: “With mentorship from Iffat, working on this project has been an incredibly rewarding and wonderful experience. Not only is she very knowledgeable, she was also very understanding and encouraging when we encountered roadblocks. Iffat consistently pushed us to refine and expand our ideas, making the entire process both challenging and fulfilling. I highly recommend this Program!” Jersey Louise Stuart Student RGD Meals For GrowthThe “Meals for Growth” project aimed to create a brand identity for a non-profit addressing food insecurity for young parents in the Greater Toronto Area. It highlights the organization’s weekly Community Table events, focusing on immediate relief and sustainable solutions. Emphasizing community support and educational resources, the design addresses the urgent question of food availability while enhancing engagement among young parents, donors and stakeholders.Click here to view additional details and visuals from the Meals for Growth project Mentor: “This project focused on my area of interest: non-profit branding. I led four talented designers through the brand development process, identifying each Member’s strengths and growth opportunities. Together, we understood the simulated non-profit’s audience and goals, collaborating to create an approachable and compelling brand. This team-based approach allowed designers in the group to adapt to each other's working styles. I was thrilled to see our designers, including one from the other side of the country, communicate and inspire each other to design an effective brand and bring this pretend organization to life. Overall, everyone embraced the group structure, utilized collaboration tools and created something they're proud to share with the RGD community.” Marin Hudson RGD Project Manager, Art Director & Designers: “Working on this project was incredibly rewarding. Working with Sebastian, Rebecca and Hina, we combined our diverse skills and perspectives to create a cohesive brand identity. Marin's expertise and vision kept us focused and inspired throughout. Marin’s leadership was instrumental in elevating every aspect of our project, ensuring both an impactful design and professional communication. We're grateful to the RGD for this opportunity to collaborate with and learn from fellow professionals firsthand.” Jessica Acevedo Castaneda Associate RGD “Although I had participated in the RGD Mentorship Program before, I immediately signed up for the new project-based format after reading about it in the RGD's e-newsletter. What appealed to me most was the opportunity to collaborate as a team without the pressure of client expectations, allowing us to push the boundaries of our design work. In my current job, with only two designers, I'm eager to engage in more collaboration. Working with like-minded people on this project was stimulating and enriching. Thanks to the incredible work of the RGD Committee and the hardworking Members on it who put this program together. I look forward to participating again in the future!” Sebastian Gonzalez Associate RGD “As a first year graphic design student, participating in this program has given me invaluable real-world experience. I learned what it's like to work with professional designers, and I learned how design projects are executed by a team! This experience has allowed me to get to know some amazing designers who have fuelled my passion for design even more!” Hina Amjad Student RGD “Participating in the RGD's Project-Based Mentorship Program was a transformative journey. This experience not only sharpened my skills in art direction and project execution but also deepened my understanding of the design process, from concept to completion. Through this program, I enriched my portfolio with real-world applications and gained invaluable insights into teamwork and creative feedback.” Rebecca Parvaneh Student RGD Legal Aid Ontario Website Re-Design The project focused on Legal Aid Ontario, an independent non-profit organization accountable to the Government of Ontario. The goal was to design a responsive user experience for clients and lawyers to easily navigate and access resources. This included a brand refresh to create a cohesive system appealing to their target audience. The project emphasized support for low-income clients facing legal issues and provided lawyers with opportunities for meaningful employment in social justice. Final deliverables included a digital style guide and high-fidelity mockups.Final digital style guide mockupFinal high-fidelity mockups Mentor: “As mentor and creative director, I guided my team to integrate brand and UX design thinking into their workflow as a continuous iterative process. I encouraged ideation through mood boards and low-fidelity wireframes, with regular check-ins, reviews, feedback and direction to reinforce and improve brand and user experience. Taking on mentorship, I aimed to inspire their design journey with knowledge sharing, problem-solving and fostering continuous learning and experimentation.” Susan Yang RGD Art Director & Designer: “Acting as art director allowed me to gain new abilities I wouldn't have had the chance to develop in my agency role as a young designer. It was fulfilling to glimpse into the future of mentoring designers. Sharing my knowledge about accessible web practices with students was a great accomplishment, demonstrating my ability to pass on knowledge and share my values.” Elyssa Biringer Associate RGD “Participating in this program exceeded my expectations. With exceptional guidance from Susan, I immersed myself in UI/UX intricacies. Regular feedback and direction were invaluable for my design growth and decision-making confidence. The mock project was challenging yet enlightening, equipping me with skills and insights for future projects.” Aman Ranjit Student RGD INNOVIVA Branding Our team was tasked with creating a brand for a new full-service advertising agency called INNOVIVA. The goal was to develop a brand that supported creative work, stood out in the competitive market and aligned with the agency's values while being professional and appealing to the target audience. From initial discovery to moodboards, logo design, brand elements, brand design applications and a comprehensive brand guideline, our team worked to create a complete visual identity system. Mentor: “As Creative Director, I led a talented team to create INNOVIVA's visual identity. Our goal: a standout brand aligning with agency values and appealing to our audience. From discovery to vibrant moodboards, logos, cohesive brand elements, practical applications and guidelines, each step brimmed with enthusiasm and creativity. Beyond delivering great work, it was an opportunity to explore ideas, share insights and grow through feedback. Proud of the team's dedication, we crafted 3 stunning brand systems for INNOVIVA in just 8 weeks.” Taralyn Carver RGD Art director & Designers: “Congratulations on finishing your projects! They all look so amazing. All of your hard work really shows! Thank you for being so receptive to my feedback every week. It helped me improve as a designer as well.” Danzel Carrasco Associate RGD “It was such a pleasure working with you over the past 8 weeks! I learned an incredible amount from both you and Danzel, and I hope to keep in touch.” Yasmine Channa Student RGD “I’m really glad to have worked with all of you. These past 8 weeks have been incredibly valuable and have taught me a lot. I loved Namra's final work; it looks very detailed and clearly shows her thought process. Nice job!” Aathmaja Ananth 2025 Excellence in Canadian News Media Gala Event BrandingThe project involved branding the (fictionalized) 2025 Excellence in Canadian News Media Gala. It’s a non-profit organization celebrating journalists, media organizations and sponsors supporting Canadian news reporting. The designers were tasked with conceptualizing the brand identity and implementing four deliverables that demonstrated the identity across various analogue and digital touchpoints. These included a program book, web page, social media posts and a sponsor activation.Check out additional details and visuals of the project Mentor: “This project, based on my previous work, aimed to empower designers to create something original within real-world parameters. Leading a team of 4 designers weekly from April to May, we transformed a hypothetical event into cohesive deliverables that they could proudly showcase in their portfolios. Working with a newly formed group posed challenges but through collaborative efforts, we addressed agency-level design challenges unfamiliar in academic settings. Our process included sharing strengths, refining ideas through constructive critiques, resulting in a robust case study suitable for any portfolio review.” Victor Szeto RGD Art Director & Designers: “I joined the RGD Mentorship program to learn and lead. I got that chance when appointed Art Director. I’m a recent graduate, but with my Creative Director’s support, the transition felt natural. I started slow, made early mistakes, but achieved my objectives by the end. If I could improve one thing, it would be producing finished assets and visual guidelines earlier. Overall, I enjoyed working on the 2024 RGD mentorship program and look forward to more opportunities.” Alexander Weitzel “As a design student, I spent a lot of my time working on my own with no external structure, and I feel this mentorship program helped me a lot with working in a team, coming together dividing tasks, creating cohesion between our different designs and learning to take and receive feedback. Victor was a great lead understanding that we are all different kinds of designers and adapting to make the team work well together. Overall I had an amazing experience.” Rubiat Fusigboye Student RGD “Through this program, I had a profoundly meaningful experience beyond traditional academia and solitary work. Collaborating with Victor and our team, each bringing unique perspectives, allowed us to develop concepts aligned with my core design value: creating universally resonant designs. This reinforced the crucial importance of communication in graphic design. I'm deeply grateful to my team for their honest feedback and support.” Suyoung Joung Associate RGD “The RGD mentorship program was a great experience and would highly recommend it to other students. It provided a great opportunity to build my portfolio and gain experience with the creative process while working in a team. Victor and Alex provided great feedback about our work and pointed us in the right direction to produce a number of deliverables that function as a cohesive whole. In comparison to an academic setting, I found this mentorship program to be more dense in terms of the feedback you receive and ideation and design insight. You get a lot more 1 on 1 time than you would in a classroom with numerous students. Great for the resume, great for the portfolio.” Vine Co Summer Sun SeriesDevelop a summer wine series design including boxes and wine labels for an existing wine kit brand, using their look and existing design as a guide. The goal is to be met while including imagery that is engaging and promotes the concept that “home-made” wine can be just as good, if not better, than the wine you can buy at stores. The group was also tasked to create a promotional campaign for the wine set being launched for summer and get customers to sign up for the waitlist for when kits arrive in-store. Mentor: “Participating in this program was an experience that made me grow as a mentor and reinforced the importance of clear direction and communication. Seeing the amazing skill and ideas come out of my team was truly inspiring. Guiding them through new communication platforms across four time zones challenged me to lead effectively in a rapidly evolving, colossal project for 8 weeks, but crucial to learn given how the industry is moving into the future. I have been truly changed as a designer through this experience and have become a better verbal and written communicator. I am grateful to the RGD for org"
