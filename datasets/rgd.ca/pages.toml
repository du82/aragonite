["https://rgd.ca/certification/how-to-apply"]
title = "RGD | Application"
full_description = "Home Certification Application Application Go to the application RequirementsOn the application, you are asked to provide the following:Personal contact informationPost-secondary education including scans or photos of transcripts or diplomas (if applicable)Relevant professional experience (including employer names; positions/titles; date employment started and ended and duration of employment)Case studies for three examples of your professional work, which you will present in your Case Study Virtual Presentation Case studiesAll projects must have been completed as a professional (not as a student) and cannot include work created for academic credit.All projects should demonstrate your highest level of professional work.All projects must align with the RGD Code of Ethics. In particular, no projects can have been created as spec work.All work submitted will b shared only with select members of the RGD's Eligibility Review Committee and the RGD's Evaluation Committee who observe strict confidentiality and conflict of interest guidelines.More information for preparing your case studies. Application reviewAfter your application is received, Members of our Evaluation Committee will conduct a preliminary survey of the images and text you have submitted to ensure that our Evaluators have the material they need to make an effective assessment of your knowledge and skills.After this review, you will be informed if you are eligible to move to the next stage of Certification within 10 business days.Eligible applicants are then required to pay an admin fee of $150 CAD plus applicable taxes (FREE for Associate RGDs and Affiliate Members).Next stepsWe then work with you to schedule sessions for your Online Test and Portfolio Presentation. The entire process can take as little as two weeks from application to RGD Membership, but you can take up to six months after applying to go through the process. QuestionsIf you have any questions, contact Director of Membership, Heidi Veri, by email at heidi@rgd.ca. “ Becoming an RGD Member was one of the best moves I could have made, especially when making the switch back to being a freelancer. Initially, the transition seemed a bit daunting but having the RGD designation and connecting to the design community was comforting and empowering. Minal Kharkar RGD, MK Branding + Design Online Test Preparation of Case Studies Virtual Presentation of Case Studies Certification Results Preparation Support Sponsored Sponsor WeirFoulds LLP is one of Canada’s oldest and most prestigious law firms. RGD Partner Sponsor Get your message delivered, the AFIX way! Sponsor Paper Trails: Finding the Perfect Line RGD Partner"
