["https://rgd.ca/articles/focus-on-benefits-the-rgd-job-board"]
title = "RGD | Focus on Benefits: The RGD Job Board"
description = "Ruth uses her creative talents to inform and delight at the City of Côte Saint-Luc (a municipality in the West End of Montreal), where she has worked for over 20 years as their in-house graphic designer with a special passion for print design. Fishtank Communications, her independent studio, focuses on clients within the arts and non-profit sectors. She is co-chair of RGD’s Membership Committee—where she helped to kick-start the Virtual Communities initiative, serves on the RGD Board, and has been a member of the Events Committee and judged student competitions."
full_description = "Home Articles InsightJan 09, 2025 Focus on Benefits: The RGD Job Board Written by Ruth Farrugia RGD, City of Côte Saint-Luc The RGD Membership has its privileges! As co-chair of the Membership Committee, I want to share some of the amazing resources and benefits that Membership provides and encourage all RGD Members to take advantage of them. If you’re not an RGD Member yet, now’s the time to join! The RGD Job Board is a fantastic resource for job seekers looking for a new employment opportunity and for employers looking to hire someone from the amazing pool of talented RGD Members.Looking for your next great employer? It’s tough out there, but in the sea of fake employment opportunities and unsolicited headhunting texts, it’s good to have a more trustworthy resource with quality listings. Many of the positions currently listed on the RGD Job Board are hybrid, so you can skip that commute once in a while. Working with good people makes all the difference to your career and, to be frank, your life outside of work.Looking for talent? Certified RGD Members and Team Members can post unlimited positions for free! Associate RGD and Affiliate Members get two posts per year at no cost. For non-members, it’s $250 per posting. Prospective employees will see your job posting on the RGD website, the e-newsletter and the RGD’s LinkedIn page. “RGD has made the recruitment process much easier for us. Our recent posting for a senior designer led to multiple high-calibre candidates. It's the first place we post when looking to fill a design-related position.” Dave Hurds RGD There are some truly amazing emerging designers entering the workforce. Giving them an opportunity to enter the field in a position that mentors them and spurs them onto great things is a boon to our industry…and your company or agency! If you need someone more senior, maybe someone will see your posting and realize that your new opportunity is something that they didn’t know they wanted but is a perfect match for both of you.Do you need to fill a non-design role, like a project manager, marketing coordinator or executive assistant? The RGD Job Board isn’t just for posting design-related positions. If someone receiving the RGD Word newsletter or browsing on LinkedIn sees a position that someone they know would be amazing for, they’ll forward it along.Find your next employer or team member on the RGD Job Board. Think of it as a tailor-made resource for talent…whether you’re seeking out talent or you are the talent seeking a place to thrive. Become an RGD Member Gain access to RGD benefits Discounts & special offers Discounts to annual DesignThinkers conferences Connect with a supportive community to share insights, experiences & knowledge Raise your profile by writing, presenting, judging & mentoring Present your portfolio in our searchable directory Participate in inspirational and educational programming Expand your network through volunteering, mentorship & events Access a video library of 700+ recorded presentations Learn about becoming a member Ruth Farrugia RGD City of Côte Saint-Luc Ruth uses her creative talents to inform and delight at the City of Côte Saint-Luc (a municipality in the West End of Montreal), where she has worked for over 20 years as their in-house graphic designer with a special passion for print design. Fishtank Communications, her independent studio, focuses on clients within the arts and non-profit sectors. She is co-chair of RGD’s Membership Committee—where she helped to kick-start the Virtual Communities initiative, serves on the RGD Board, and has been a member of the Events Committee and judged student competitions. Tag Membership Related Articles Insight Should salaries be stated in job postings? We asked top-level execs for their insights Lionel Gadoury RGD, Wendy Gray RGD News Focus on Benefits: Virtual Communities bring designers together Ruth Farrugia RGD Insight Focus on Benefits: Opportunities to support emerging designers Ruth Farrugia RGD News Focus on Benefits: Access to the RGD video library anytime Ruth Farrugia RGD News Focus on Benefits: The RGD Directory lets you showcase your work and unlock opportunities Ruth Farrugia RGD Sponsored Sponsor We Tell Compelling Stories. Let’s Make Something Great Together! RGD Partner Sponsor We are a different type of printing company. We like it that way and think you will too. RGD Partner Sponsor Realize your potential at the York University School of Continuing Studies RGD Partner Savings on car and home insurance Score special insurance deals tailored just for your needs by belairdirect. Get help with their simplifying insurance to make your life easier. Enjoy enhanced home coverage and the option for great car insurance add-ons with their Affinity Plus endorsement. Plus, there is a suite of helpful digital tools that make managing your insurance a breeze! Find out how to access discounts"
