title = "THE CLIMATE CRISIS | Richard Dawkins Foundation for Reason and Science"
description = "This thread has been created as a central point for discussion about anthropogenic (human-caused) climate change so that as much information as possible can ..."
full_description = "THE CLIMATE CRISIS Featured Special Topic Oct 29, 2021 This thread has been created as a central point for discussion about anthropogenic (human-caused) climate change so that as much information as possible can be held in one, easily accessible place. There will of course sometimes also be other climate change threads on specific new developments, and we’d encourage you to post on those too. But for everything else to do with climate change, please post here rather than the Open Discussion threads. It’s also a place where people are welcome to ask questions about climate change but please note we will not provide a platform for anthropogenic climate change denial. Share Comment Write a Reply 542 Comments 542 Oct 29, 2021 at 9:52 am offg says: and it’s only right that offgshould be the first one here you see Oct 29, 2021 at 11:22 am Marco says: It certainly is, offg! 🙂 Back to the climate: there’s a link I’ve been meaning to share for several days now, and actually, I think it’s also my answer to your final comment on this subject in the Book Club (https://richarddawkins.net/2020/11/book-club/#comment-209490) where you wrote: what about the idea of anarchy as alternative to f word? anarchy as in shelley’s turning it on its head anarchy as a sub for libertarian neo liberal elitist earth destroying tyranny My concern is that by using any word other than “capitalism”, we risk deflecting from the real cause of the problem. Anarchy implies a break-down in order – whereas actually, the relentless pursuit of profit, in this case through the ruthless exploitation of fossil fuels, is the very definition of order in a capitalist system, especially in its neoliberal form. And I don’t think I’ve ever seen the link between the climate crisis and the basic workings of capitalism spelled out as clearly as it is in this brilliant article: https://www.opendemocracy.net/en/opendemocracyuk/ignore-world-leaders-spin-at-cop26-heres-whats-really-at-stake/ I think you’ll like it – see what you think."
