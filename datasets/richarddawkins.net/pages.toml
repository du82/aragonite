coming: The Repeated Evolution of Flightlessness in Birds Tuesday, March 25, 2025 - 6:00pm Many would define a bird, in part, by its ability to fly. Yet, contrarily, while flight may seem to be a beneficial and successful adaptation, some species cannot fly, and many flightless birds existed until relatively recently. This talk will explore the evolution of the permanent inability to fly in birds, why this evolutionary trend … RSVP on Zoom Now! Upcoming: Collaborating to Conserve Madagascar’s Extraordinary Biodiversity Tuesday, April 8, 2025 - 6:00pm Timothy Eppley is the Chief Conservation Officer at Wildlife Madagascar, an organization dedicated to collaborating with local communities in Madagascar to protect the country’s unique and threatened biodiversity through sustainable practices and livelihood support initiatives. Wildlife Madagascar works with communities to conserve Madagascar’s extraordinary wildlife and ecosystems. RSVP on Zoom Now! Featured: Friendship: The Evolution, Biology, and Extraordinary Power of Life’s Fundamental January 7, 2021 The phenomenon of friendship is universal and elemental. Friends, after all, are the family we choose. But what makes these bonds not just pleasant but essential, and how do they affect our bodies and our minds? In Friendship, science journalist Lydia Denworth takes us in search of friendship’s biological, psychological, and evolutionary foundations. She finds friendship … Featured: One Under the Sun: The Biology of Human Skin Color July 27, 2020 Dr. Leslie S Jones of Valdosta State University will present the evidence that the different shades of human skin color—from light pink to dark brown—are evolutionary adaptations to the varying intensity of ultraviolet radiation in different parts of the world. Topics such as types of selection, the bottleneck effect, and the founder’s effect will be … Featured: Maddening Evolution Misconceptions with Stephanie Keep August 1, 2018 Everyone knows that the United States is not 