full_description = "BOOK CLUB 2022 Uncategorized Jan 1, 2022 This is the 2022 follow-on from the original BOOK CLUB thread, which is now closed, though you can easily refer back to earlier discussions by clicking on the link. BOOK CLUB 2022 has been created to provide a dedicated space for the discussion of books. Pretty much any kind of book – it doesn’t have to be about atheism or religion or science or politics. It doesn’t even have to be non-fiction. All we ask is that, whatever the topic or genre, the books are stimulating, intelligent and thoughtful, so that they are actually worth discussing, and that you post any recommendations along with a commentary giving a bit of background and explaining why you’re recommending it. Clearly “worth discussing” is open to interpretation, but hopefully you get the idea. Books originally in a language other than English are fine too, provided an English translation is available. The only real restriction is that, in keeping with our Comment Policy, users should not use this thread to promote any books they may have written themselves or have any other kind of personal stake in. Happy reading, and happy discussing! Or … if film/video/tv or the arts in general are more your thing, there’s a link for that below. NB. For anything to do with climate, climate science, climate change etc., please post on our dedicated Climate thread rather than here: Discussion ThreadThe Climate Crisis Discussion ThreadFilm, Video, TV & Arts Club Share Comment Write a Reply 300 Comments 300 Jan 8, 2022 at 12:21 am kaveinthran says: HI, when will be the genetic book of dead by richard dawkins hit the store? Jan 8, 2022 at 11:05 am Michael 100 says: Kaveinthran #1: On January 1, Prof. Dawkins tweeted that his goal for 2022 was to finish writing The Genetic Book of the Dead. About that time he also recommended Blueprint by Nicholas Christakis, and Cuckoo, by Nick Davies, both of which are on my short list to read. Jan 22, 2022 at 2:17 pm Michael 100 says: Darwin’s Dangerous Idea by Daniel Dennett In the preface, Dennett writes: “This book is about why Darwin’s idea is so powerful, and why it promises — not threatens — to put our most cherished visions of life on a new foundation.” Dennett compared Darwin’s idea to “universal acid” a mythical substance which once created cannot be contained. Rather than dropping down like dew from heavens above, as it were, Darwin’s universal acid suggests that we abandon superstition and look for excellence, worth and purpose, that can emerge, bubbling up out of mindless, purposeless forces. Dennett begins with a comparison of Darwin and Copernicus. It took approximately a hundred years of further study before each theory was fully appreciated. In Copernicus’ case, it was not until Kepler discovered the laws of planetary motion and Galileo began using the telescope that the heliocentric model of the cosmos was accepted. In Darwin’s case it was not until the 1930s and 40s and the “new synthesis” that the theory of evolution by natural selection was accepted. There were things that both Copernicus and Darwin could not know, but when discovered only strengthened their work. In Copernicus’ case it was impossible to know why the planets appeared to stop in their orbits and reverse course. In Darwin’s case, he did not know about the role genes play. Darwin published in 1859. In 1865, Gregor Mendel discovered what came to be known as Mendel’s Laws of Inheritance. Mendel’s work lay unnoticed until its importance was appreciated (at first dimly) around 1900. The “Modern Synthesis” is the synthesis of Mendel and Darwin formulated in the 1940s, thanks to the work of Theodosius Dobzhansky, Julian Huxley, Ernst Mayr, and others. It has taken another half-century to iron out most of the wrinkles of that new fabric”. Darwin’s fundamental idea of natural selection has been articulated, expanded, clarified, quantified, and deepened in many ways, becoming stronger every time it overcame a challenge.” Does the process of evolution work using skyhooks (miracles) or cranes (algorithms)? A skyhook is an imaginary contrivance for attachment to the sky. Sad to say, they are impossible. Cranes, on the other hand, have the decided advantage of being real. Throughout the book, the crane is synonymous with the algorithmic process of evolution by natural selection. Algorithms are recipes that always work — the algorithm for doing long division is an example. Another example is the algorithm for an elimination tournament. We all know that when you toss a coin, there is a 50/50 chance it will come up heads. Is it possible for someone to win a coin toss tournament? The short answer is that someone will win such a tournament if there is a sufficient number of contestants — not because of skill, but merely by chance. Any elimination tournament produces a winner, sometimes skill is the deciding factor and other times its chance. More often, skill and luck intermingle naturally and inevitably. To describe the tremendous number possibilities that are available to natural selection, two imaginary libraries are described in detail: The library of Babel, and the library of Mendel. The library of Babel is a vast storehouse of books — all books, those which have been written; those which have never been written; those which have been copied with no errors; those which have been copied with minor errors; those which have been copied with major errors; &c, &c. The set of all possible books is vast. What difference would a minor error such as a misplaced comma make in the the great scheme of things? “Call me, Ishmael.” Like the library of Babel, the Library of Mendel contains “all possible genomes”—DNA sequences. Dennett writes that Richard Dawkins describes a similar space, which he calls “Biomorph Land,” in The Blind Watchmaker. His discussion is the inspiration for mine, and our two accounts are entirely compatible…”. Quoting Dawkins, Dennett writes: “The one thing that makes evolution such a neat theory is that it explains how organized complexity can arise out of primeval simplicity.” I could go on and on, that is what the first part of the book is about — the algorithm of natural selection. The process is explained by cranes rather than skyhooks, and the explanation is supported by evidence at every turn. No Intelligent Agency is in the process at all. “That is indeed a thing of beauty, as mathematicians are forever exclaiming, but it is not itself something intelligent but, wonder of wonders, something intelligible.” Or, as Darwin concluded: “there is grandeur…” Part two of the book is entitled Darwinian Thinking in Biology. how could the process get started? Was a skyhook necessary? Maybe the creator doesn’t control the day-to-day process of evolution, but “but he did set up the original machinery of replication?” Quoting the Blind Watchmaker, ““This is a transparently feeble argument, indeed it is obviously self-defeating. …”. But how did the process begin? Dennett cites Manfred Eigen’s Steps Towards Life (1992) which showed how the macros gradually built up what he calls the “molecular tool-kit” that living cells use to re-create themselves, while also building around themselves the sorts of structures that became, in due course, the protective membranes of the first prokaryotic cells.” Another book on this very topic that was written recently is Andres Wagner’s Arrival of the Fittest. Remember the coin tossing tournament. Somebody has to win, but the winner wins in virtue of no virtue, but simply in virtue of historical accident. Darwinism, “Unlike the Christian version … provides an explanation that makes sense; it does not proclaim itself to be a mysterious fact that one has to take on faith, and it has testable implications.” “That is what a mind is— not a miracle-machine, but a huge, semi-designed, self-redesigning amalgam of smaller machines, each with its own design history, each playing its own role in the economy of the soul.’ *** Not only are you descended from macros; you are composed of them. Your hemoglobin molecules, your antibodies, your neurons, your vestibular-ocular reflex machinery—at every level of analysis we find machinery that dumbly does a wonderful, elegantly designed job.” Is there no room here for god? No room for skyhooks? One who tried to find room was “the … Jesuit paleontologist Teilhard de Chardin [who tried] to reconcile his religion with his belief in evolution. He proposed a version of evolution that put humanity at the center of the universe, and discovered Christianity to be an expression of the goal—‘the Omegapoint’ *** To his dismay, the Church viewed this as heresy, and forbade him to teach it in Paris.” Citing Sir Peter Medawar, to whom Richard Dawkins’ book, Books Do Furnish a Live, is dedicated, Dennett writes: The problem with Teilhard’s vision is simple. He emphatically denied the fundamental idea: that evolution is a mindless, purposeless, algorithmic process. This was no constructive compromise; this was a betrayal of the central insight that had permitted Darwin to overthrow Locke’s Mind-first vision.” Part three of the book discusses human culture and artificial intelligence as they relate to Darwinism. Dennett argues that those who deplore Artificial Intelligence are also those who deplore evolutionary accounts of human mentality. We are descended from macros and made of macros, and nothing we can do is anything beyond the power of huge assemblies of macros (assembled in space and time). Again, cranes rather than skyhooks are the key. Dennett writes about culture, the unit of reproduction is memes — a word first coined by Professor Dawkins. Human culture is a crane-making crane which has turned us into creatures with an entirely different outlook on life from that of any other species. A new kind of replicator has recently emerged on this very planet. It is still in its infancy, still drifting clumsily about in its primeval soup, but already it is achieving evolutionary change at a rate which leaves the old gene panting far behind. These new replicators are ideas. “A scholar is just a library’s way of making another library.” Human language, first spoken and then, very recently, written, is surely the principal medium of cultural transmission, creating the infosphere in which cultural evolution occurs. Dennett examines the work of scholars such as BF Skinner, Noam Chomsky, Steven Pinker, and Friedrich Nietzsche, among many others. When reading about Thomas Hobbes, I couldn’t help wondering what Dennett’s take on The Dawn of Everything would be, and vice-versa. What about religion. Dennett writes: “Religions have brought the comfort of belonging and companionship to many who would otherwise have passed through this life all alone, without glory or adventure. … Another thing religions have accomplished, without this being thereby their raison d’être, is that they have kept Homo sapiens civilized enough, for long enough, for us to have learned how to reflect more systematically and accurately on our position in the universe.” In conclusion, Dennett wrote: “We now have a much better sense of what a Darwinian algorithm is than Darwin ever dreamt of. … The “miracles” of life and consciousness turn out to be even better than we imagined back when we were sure they were inexplicable. … The truly dangerous aspect of Darwin’s idea is its seductiveness. … There is no denying, at this point, that Darwin’s idea is a universal solvent, capable of cutting right to the heart of everything in sight. The question is: what does it leave behind? I have tried to show that once it passes through everything, we are left with stronger, sounder versions of our most important ideas. Some of the traditional details perish, and some of these are losses to be regretted, but good riddance to the rest of them. What remains is more than enough to build on.”"
