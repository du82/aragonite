full_description = '''Teaching the Value of Science and Advancing Secularism Founded in 2006 by Richard Dawkins, the foundation’s mission is to realize Richard’s vision to remove the influence of religion in science education and public policy, and eliminate the stigma that surrounds atheism and non-belief. About RDF The Foundation’s Work The Translations Project There are too many places in the world where it‘s difficult to obtain books that explain and celebrate science written in the local language, particularly within more restrictive Islamic regimes. The Translations Project produces professionally translated versions of landmark books on science and nature for free, beginning with the works of Richard Dawkins himself. Learn More Teachers Helping Teachers A good teacher can teach any subject as long as they have high-quality resources. TIES provides middle school and elementary teachers the tools they need to effectively teach evolution and answer its critics based on new Next Generation Science Standards. Learn More Richard Dawkins News The Genetic Book of the Dead The Genetic Book of the Dead: A Darwinian Reverie is a 2024 book by Richard Dawkins which explores the idea that every organism may eventually be read as if it were a “book” by a future biologist with an advanced technology and understanding of the fossil record Learn More Join Richard Dawkins New Scientist Arctic Expedition Cruise Twelve Days in the Beautiful ArcticWith Richard DawkinsJune 22, 2025 New Scientist are excited to launch a brand-new expedition experience with evolutionary biologist and highly regarded author Richard Dawkins!Full details at: newscientist.com/dawkins Explore the northernmost region of Earth, the realm of the polar bear and the midnight sun, while travelling aboard the Greg Mortimer, which is at the cutting edge of nautical technology. This cruise will be a truly enriching trip of a lifetime. Learn More Exclusive Sea of Homer Cruise Join Richard Dawkins on a Voyage From Athens to Istanbul Exploring the Fabled Greek Islands on This Fantastic Cruise of a LifetimeSeptember 7 – 17, 2025 Dear Friends, this distinctive cruise through the heart of the Aegean is the perfect introduction to everything this fabled sea has to offer, famously described by Homer as “wine-dark.” Early September is an ideal time of year to visit. Ancient sites and monuments—including the Parthenon, Minoan Knossos, and medieval Rhodes, all UNESCO World Heritage Sites—share the landscape with the homes of present-day farmers in the villages of Naxos and Chios. Learn More Join the Conversation OPEN DISCUSSION MARCH 2025 Mar 1, 2025 This thread has been created for thoughtful, rational discussion on subjects for which there are not currently any dedicated threads. Please note that our Comment Policy applies as usual. There is a link to this at the foot of the page. DISCLAIMER: All comments posted throughout this website are the personal views of…Read More BOOK CLUB 2025 Jan 1, 2025 This is the 2025 follow-on from the 2024 BOOK CLUB thread, which is now closed, though you can easily refer back to earlier discussions by clicking on the link. BOOK CLUB 2025 has been created to provide a dedicated space for the discussion of books. Pretty much any kind of book – it…Read More THE CLIMATE CRISIS Oct 29, 2021 This thread has been created as a central point for discussion about anthropogenic (human-caused) climate change so that as much information as possible can be held in one, easily accessible place. There will of course sometimes also be other climate change threads on specific new developments, and we’d encourage you to post on…Read More Stay Updated Sign up today for the Richard Dawkins Foundation Newsletter Sign Up Recent Comments Michael 100 on OPEN DISCUSSION MARCH 2025Mar 1, 2025Marco: It’s only too clear that NATO is now dead in terms of offering real security to Europe. And the… Marco on OPEN DISCUSSION MARCH 2025Mar 1, 2025Michael Thank you for listening to it, and I’ve very glad you found it as worthwhile as I did. I… Michael 100 on OPEN DISCUSSION MARCH 2025Mar 1, 2025Marco: I just listened to The Rest is Politics podcast. The first words that come to mind are “high quality”.… Marco on OPEN DISCUSSION MARCH 2025Mar 1, 2025Strato I’d suggest that Trump’s noisy, combative, surprising and totally unwarranted tirade against the honest, heroic and noble statesman Volodymyr… Strato on OPEN DISCUSSION MARCH 2025Mar 1, 2025I’d suggest that Trump’s noisy, combative, surprising and totally unwarranted tirade against the honest, heroic and noble statesman Volodymyr Zelensky,… Social Tweets by @rdfrs !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+"://platform.twitter.com/widgets.js";fjs.parentNode.insertBefore(js,fjs);}}(document,"script","twitter-wjs");'''
