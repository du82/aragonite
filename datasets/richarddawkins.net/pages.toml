["https://richarddawkins.net/websitefaq"]
title = "Website FAQ | Richard Dawkins Foundation for Reason and Science"
description = "Known Issues From time to time, technology fails us and we need to fix things.  Below will be a constantly updated list of issues/errors that we know about  ..."
full_description = "Website FAQ Known Issues From time to time, technology fails us and we need to fix things. Below will be a constantly updated list of issues/errors that we know about and are actively working to fix. If you notice any issues on the site, do not hesitate to send us feedback. FAQ Q: Why can’t I login after becoming a member?/What is the difference between RDFRS membership and having an account on the site? A: Becoming a member and registering for an account on our website are two different things. A membership is making a yearly or monthly donation at varying tiers with different benefits, while registering for an account only allows individuals to participate in discussions on the website. Our plan is to make having an account come with membership, but there are technical aspects that we need to work out before implementation. If you would like to become a member, you can do so here. If you are only interested in creating an account to comment on articles and join in on discussions, you can do so here. Q: ‘I’m having trouble logging into my account!’ A: If you have signed up for an account and cannot login it is likely that you haven’t yet activated your account. Check for an email titled “[Richard Dawkins Foundation] Activate Your Account” from [email protected]. Please note this email may be in your spam folder. Otherwise try resetting your account password. Q: Can I edit my comments? A: Comments can be edited; however, edits can only be made within 5 minutes of posting. A countdown timer with an “edit” link will appear to show you how much time you have left. Q: What happened to the RSS feeds? A: The RSS Feed is available here: http://www.richarddawkins.net/feed/ Q: What happened to user-submitted News articles? A: We have opted for an internal method of news gathering for the new site. The material coming through user submissions was too often incomplete, inaccurate or used poor sourcing practices. If you have any feedback on the news sources, please don’t hesitate to send us feedback."
