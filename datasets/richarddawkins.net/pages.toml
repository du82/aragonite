full_description = "Donate At the heart of what we do at CFI is our ongoing commitment to work tirelessly for a secular society based on reason, science, freedom of inquiry, and humanist values. Your membership gift of $60 or more, or $5 or more monthly, will help fuel this fight for one full year. When you join this exclusive group of insiders, you’ll gain access to members-only communication, private event invitations, special donor recognition, and other great benefits. Already a CFI member? Thank you! We’ll extend your membership for a year with your gift today. Membership Benefits Members receive special insider access and perks. It’s our way of thanking you for what you mean to CFI. Your gift of at least $60 or $5/month includes the following for one year: Advance invitations to events Presale tickets and special discounts Quarterly Freethought in Action newsletter Your gift of at least $120 or $10/month includes the following for one year: All of the benefits above Choice of either Skeptical Inquirer or Free Inquiry Magazine Print and Digital Subscription Skeptical Inquirer Since 1976, the Magazine committed to science, skepticism, and investigation. Free Inquiry Since 1980, the Magazine for Humanism, Atheism, and all those living without religion. View frequently asked questions about CFI membership and magazines. What should I do if I’m a current subscriber? Extending our magazines to our donors is intended to be a bonus and thank you for those who support us most. Current subscribers who are also members will continue to receive only one magazine each issue. If you are already subscribed to one of our magazines we encourage you to choose the other to receive thought-provoking material from us each month. My magazine subscription is going to expire soon, should I renew? If you would like to make a donation of $120 or $10/month or more you can let your magazine subscription expire and you’ll continue to receive the magazine for one year from the date of your donation or for the duration of your monthly donations. You can also choose to continue subscribing to the magazine separately and enjoy the other membership benefits. I would rather not receive a magazine, is that okay? Of course! We appreciate being able to apply the full value of your donation to the work that we do. Choose the amount you’d like to donate on this page and you have the option to decline a magazine subscription on the next. I just want to donate, not become a member formally We never publish the list of our members and all membership benefits (aside from the Freethought in Action newsletter and magazine) are delivered via email and your secure CFI online account. Taking advantage of your membership is completely optional. If you have any other concerns about this, please contact us at [email protected] ."
