title = "Convert's Corner | Richard Dawkins Foundation for Reason and Science"
full_description = '''Convert’s Corner Stories of Deconversion The Rollercoaster of Faith that led to Atheism (twice) Sep 7, 2021 · 7 Mine is not a terrible, bloodshed, or torturing example of the evil side of religion, but rather a story of how logic got me in and out of religious thinking. It is interesting, to say the least, so please stick to me until the end. I was born and raised a Roman Catholic, as most … I was told that I was demon-possessed Aug 17, 2021 · 7 Since entering this world as a conscious autonomous human being I feel I have experienced a somewhat well-rounded experience of Christianity, suffering both at the hands of Christians as well as experiencing some kindness and love. I began my journey as a child under a thunderous pulpit preacher in Edinburgh where the women wore hats … After 3 minutes I was completely convinced God didn’t exist Jul 31, 2021 · I was all my life a bit doubtful about the existence of God. However, for my Catholic background, I pushed myself and my family to attend church and follow the religion. One night I decided to watch on TV the Richard Dawkins series The Enemy of Reason. I can honestly say that after exactly 3 … Yesterday I decided to become an Atheist Jul 7, 2021 · Hi, Yesterday I decided to become an Atheist. So this is me coming out as an Atheist. Yay me! I decided that I don’t want to be a Catholic, I don’t believe in God or Jesus or the bible and I don’t support religion. It took me about two weeks to make the decision. This … Before, I loved my invisible friend with all my heart Jun 7, 2021 · Dear Professor Dawkins, In my previous life, I was deeply religious. I was the guy you would find playing the guitar at church, talking to strangers in the streets, or meditating with monks in a monastery. I experienced miracles and loved my invisible friend with all my heart. Then, one day, I read a piece … God monitors your moves, even in the bathroom May 19, 2021 · Born and raised in the most suppressed and religiously fanatic Pashtun society of Pakistan. I’ve always questioned my religious beliefs that I acquired from my parents and society; however, I have paid a heavy price for this socially unacceptable stance in the form of social isolation. As a doctoral student in the UK, I became … Become Openly Secular Openly Secular is the joint project of the Richard Dawkins Foundation in partnership with the Secular Coalition for America, Secular Student Alliance and Stiefel Freethought Foundation. It’s mission is to eliminate discrimination and increase acceptance by getting secular people – including atheists, freethinkers, agnostics, humanists and nonreligious people – to be open about their beliefs. Learn More Tell Us Your Story! Notice: JavaScript is required for this content. var formDisplay=1;var nfForms=nfForms||[];var form=[];form.id='2';form.settings={"objectType":"Form Setting","editActive":"1","title":"Convert&#039;s Corner","created_at":"2018-05-11 17:23:18","form_title":"Convert's Corner","default_label_pos":"above","show_title":"0","clear_complete":"1","hide_complete":"1","logged_in":"0","wrapper_class":"","element_class":"","key":"","add_submit":"1","currency":"","unique_field_error":"A form with this value has already been submitted.","not_logged_in_msg":"","sub_limit_msg":"The form has reached its submission limit.","calculations":[],"formContentData":[{"order":0,"cells":[{"order":0,"fields":["firstname_1523909155772"],"width":"100"}]},{"order":1,"cells":[{"order":0,"fields":["lastname_1523909157368"],"width":"100"}]},{"order":2,"cells":[{"order":0,"fields":["alias_1526074313734"],"width":"100"}]},{"order":3,"cells":[{"order":0,"fields":["email_1523909158972"],"width":"100"}]},{"order":4,"cells":[{"order":0,"fields":["tell_us_your_story_1526074364326"],"width":"100"}]},{"order":5,"cells":[{"order":0,"fields":["submit_1523909373360"],"width":"100"}]}],"drawerDisabled":"","changeEmailErrorMsg":"Please enter a valid email address!","changeDateErrorMsg":"Please enter a va