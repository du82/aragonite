["https://richarddawkins.net/2025/01/the-outrageous-act-of-teaching-evolution"]
title = "‘The Outrageous Act of Teaching Evolution’ | Richard Dawkins Foundation for Reason and Science"
description = "From the Richard Dawkins Foundation Newsletter. Subscribe here. Hello! This year will mark the 100th anniversary of the famous Scopes “Monkey Trial,” i ..."
full_description = "‘The Outrageous Act of Teaching Evolution’ Atheism Education Original Politics Religion Science Jan 30, 2025 From the Richard Dawkins Foundation Newsletter. Subscribe here. Hello! This year will mark the 100th anniversary of the famous Scopes “Monkey Trial,” in which Tennessee high school teacher John Scopes was prosecuted for the outrageous act of … teaching the theory of human evolution. Out of the state’s own authorized textbook! Still, this violated the Butler Act, which prohibited public schools from teaching “any theory that denies the story of the Divine Creation of man as taught in the Bible, and to teach instead that man descended from a lower order of animals.” The case pitted evidence-based science against religious fundamentalism, and it ultimately helped shape how that conflict would be addressed in American classrooms for generations to come. I am very excited that the Center for Inquiry and the Freedom From Religion Foundation will be hosting a three-day conference to commemorate the Scopes Trial Centennial this July in Chattanooga. Of course, no conference celebrating the importance of teaching evolution would be complete without the presence of the world’s best-known evolutionary biologist. I’m very pleased that Richard Dawkins will be joining us in Chattanooga and presenting the 2025 Richard Dawkins Award to linguistics professor and courageous truth-speaker John McWhorter as part of the weekend’s activities. A century later, the conflict between evidence-based science and belief-based policymaking continues to play out on a variety of fronts, including multiple state legislatures and in the halls of Congress. Unfortunately, a recent Pew analysis finds atheists and nonbelievers remain significantly underrepresented in Congress. Still, despite attacks on science and the proliferation of pseudoscience and misinformation across all forms of media, the majority of people around the world still trust scientists and welcome their input when it comes to policymaking. That makes it more important than ever that organizations like the Richard Dawkins Foundation for Reason & Science and communities like ours continue to promote the value of evidence-based science. If we don’t, we know the fundamentalists and religious ideologues will be more than happy to fill the void. Finally, I’m excited to invite you to participate in a breathtaking tour of the Greek Islands in September on a trip dubbed the Sea of Homer Cruise. Joining the trip is Richard Dawkins himself, who will lecture on board ship and socialize with us all. It is a great way to support the Richard Dawkins Foundation and have an amazing time in the process. Thank you for your support, and I hope to see you at the Scopes Trial Centennial conference in July! Robyn E. Blumner,CEO and President, Center for InquiryExecutive Director, Richard Dawkins Foundation for Reason & Science Subscribe to the Newsletter Share Comment Write a Reply 0"
