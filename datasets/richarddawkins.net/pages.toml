title = "BOOK CLUB | Richard Dawkins Foundation for Reason and Science"
description = "We have created this thread to provide a dedicated space for the discussion of books. Pretty much any kind of book - it doesn't have to be about atheis ..."
full_description = "BOOK CLUB Discussion Special Topic Jan 1, 2021 We have created this thread to provide a dedicated space for the discussion of books. Pretty much any kind of book – it doesn’t have to be about atheism or religion or science or politics. It doesn’t even have to be non-fiction. All we ask is that, whatever the topic or genre, the books are stimulating, intelligent and thoughtful, so that they are actually worth discussing, and that you post any recommendations along with a commentary giving a bit of background and explaining why you’re recommending it. Clearly “worth discussing” is open to interpretation, but hopefully you get the idea. Books originally in a language other than English are fine too, provided an English translation is available. The only real restriction is that, in keeping with our Comment Policy, users should not use this thread to promote any books they may have written themselves or have any other kind of personal stake in. We hope you enjoy this new thread. NB. As from the end of October 2021, for anything to do with climate, climate science, climate change etc., please post on our dedicated Climate thread: THE CLIMATE CRISIS Share Comment Write a Reply 658 Comments 658 May 1, 2019 at 11:16 am phil rimmer says: I’ll be back here after work to post a fuller review of Saini “Inferior” a book I’ve come to like a lot. Quite a few others to catch up on too… Econocracy Utopia for Realists The Goodness Paradox Creating Freedom May 1, 2019 at 2:58 pm Steven007 says: Currently revisiting Sam Harris ‘Waking Up’. I never finished it but enjoyed re-reading the first chapter, which for me was more engaging than some of what followed. He goes into an early teen experience with solitude during a summer camp and how he wasn’t able to fully appreciate it and wondered about the transcendence noted by some of his older peers. He then segues into an experience a few years later with a male friend where he tries MDMA for the first time and how that was absolutely transcendent for him. An interesting juxtaposition of experiences just a few years apart."
