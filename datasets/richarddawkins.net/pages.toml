["https://richarddawkins.net/advisory-board"]
title = "Board | Richard Dawkins Foundation for Reason and Science"
description = "The Richard Dawkins Foundation is now a division of the Center for Inquiry and shares a board of directors. View the Center for Inquiry board of directors.  ..."
full_description = "Board The Richard Dawkins Foundation is now a division of the Center for Inquiry and shares a board of directors. View the Center for Inquiry board of directors. Advisory Board Baris Karadogan – Advisor Baris is the CEO of Endless Solutions, which is on a mission to create a computer for the four billion people in the world who have never used one. Prior to Endless, Baris was the CEO of Hip Digital Media, a venture backed, online marketing platform. Baris grew Hip from zero revenues to profitability, and ultimately Hip was acquired in 2015 by Snipp Interactive, a public online marketing platform company trading in the Toronto stock exchange. Prior to Hip Digital Media, Baris was a venture capitalist for ten years, at U.S. Venture Partners, a leading Silicon Valley based venture capital firm and at Fuse Capital. As a VC, Baris invested in a wide variety of industries including digital media, telecommunications and semiconductors. Before becoming a venture capitalist, Baris worked in both engineering and marketing at 3Com/U.S. Robotics, where he developed software for the company’s networking and cable modem products. His efforts at U.S. Robotics resulted in a number of U.S. patents. Passionate about science and nature, Baris is an active participant and leader in a number of non-profits. Baris is also on the Board of Directors of the California Audubon Society. Baris holds a BS in Electrical Engineering from Lafayette College, where he graduated summa cum laude. He is a member of Phi Beta Kappa, Tau Beta Pi and Eta Kappa Nu. Baris also holds an MS in Electrical Engineering from Stanford University and an MBA from the Stanford University Graduate School of Business, where he was an Arjay Miller Scholar. Bill Nye – Advisor Bill’s show, “Bill Nye, the Science Guy,” taught science to preteens. Over its five-year run, the show won 18 Emmy Awards. Today, Nye remains vocal in the science community. His latest book is Undeniable: Evolution and the Science of Creation. Nye famously debated creationist Ken Ham in 2014. Carolyn Porco- Advisor Carolyn leads the imaging science team on the Cassini mission presently in orbit around Saturn. She has co-authored over 115 scientific papers on a variety of subjects in astronomy and planetary science. In 2010 she was awarded the Carl Sagan Medal, presented by the American Astronomical Society for Excellence in the Communication of Science to the Public. Todd Stiefel- Advisor Todd Is founder and president of the Stiefel Freethought Foundation. He is the Chair of Openly Secular and the co-host of the Humanist Hour podcast. Todd worked for Stiefel Laboratories and co-led the teams that sold equity to Blackstone and Stiefel Laboratories to GlaxoSmithKline. During 2012 and 2013, Todd led the Foundation Beyond Belief international team that raised $930,000 for The Leukemia & Lymphoma Society. Greg Stikeleather- Advisor Greg is an entrepreneur who invests in both for-proﬁt and nonproﬁt ventures. He was CEO of aha! software which produced and patented digital-ink processing technology – aha! was acquired by Microsoft. Greg led Portola Communications which was acquired by Netscape. He co-founded and was President and CEO of Headsprout — its award-winning early reading program has taught millions of children how to read and continues to be used in schools and homes across the United States."
