title = "Richard Dawkins | Richard Dawkins Foundation for Reason and Science"
description = "Bio One of the most respected scientists in the world and the biggest draw in secularism, Richard Dawkins always generates impressive crowds when visiting N ..."
full_description = "Richard Dawkins Bio One of the most respected scientists in the world and the biggest draw in secularism, Richard Dawkins always generates impressive crowds when visiting North America. Secularism is sweeping America as a movement, and Richard Dawkins is the catalyst who galvanizes it. From 1995 to 2008 Richard Dawkins was the Charles Simonyi Professor of the Public Understanding of Science at Oxford University. He is an internationally best-selling author. Among his books are The Ancestor’s Tale, The Selfish Gene, The Blind Watchmaker, Climbing Mount Improbable, Unweaving the Rainbow, A Devil’s Chaplain, The God Delusion, The Greatest Show on Earth and The Magic of Reality. His most recent books are his two-part autobiography. Part 1 An Appetite for Wonder, released in 2013 and A Brief Candle in the Dark released in 2015. He is a Fellow of the Royal Society and of the Royal Society of Literature. His around-the-world speaking tour is the focus of a recent documentary “The Unbelievers” which also features appearances by Woody Allen, Stephen Colbert, Cameron Diaz, Ian McEwan, Ricky Gervais, Stephen Hawking, Eddie Izzard, Bill Pullman, and Sarah Silverman. Visit the ‘Ultimate Collection’ of Richard Dawkins where you can find all the important articles, video and more by or about Richard Dawkins. Scholarly Publications Extended Phenotype – But Not Too Extended. A Reply to Laland, Turner and Jablonka Biology and Philosophy 19: 377–396, 2004. Download Parasites, Desiderata Lists and the Paradox of the Organism Dawkins utilizes parasites to prove his argument that the most basic unit in the hierarchy of life is the organism itelf. S63-S73, 1990 Download The Evolution of Evolvability Dawkins discusses the model (or environment and conditions) that he created to allow evolution to take place. Artificial Life, SFI Studies in the Sciences of Complexity, 1988, pp. 201-220 Download Replicators and Vehicles This article asserts that the principles of evolution allow DNA to protect itself and DNA in turn has a greater purpose to our existence. Current Problems in Sociobiology, Cambridge University Press, pp. 45-64, 1982 Download Do digger wasps commit the concorde fallacy? Richard Dawkins, H. Jane Brockmannt Animal Behaviour, Volume 28, Issue 3, August 1980, Pages 892–896 Download Twelve Misunderstandings of Kin Selection This article addresses the 12 common misunderstandings in kin selection theory and denies them. Z. Tierphyschol, 1979, 51: pp. 184-200 12 Misunderstandings (1979) Joint Nesting in a Digger Wasp as as Evolutionarily Stable Preadaptation to Social Life Behaviour, Vol. 71, No. 3/4 (1979), pp. 203-245 Download Evolutionarily Stable Nesting Strategy in a Digger Wasp Brockmann, Grafen, and Dawkins examine the nesting behaviors of digger wasps and concludes that their strategy is evolutionarily stable. J. theor. Biol. 1979, 77: pp. 473-496 Download Replicator Selection & the Extended Phenotype This is a modified version of a lecture given in the plenary session on “Sociobiology: at the 15th International Ethological Conference, Bielefeld, 1977. Zeitschrift für Tierpsychologie, 47: 61–76Download Hierarchical Organization: A Candidate Principle for Ethology Growing Points in Ethology, 1976. Download Hierarchical Organization and Postural Facilitation: Rules for Groom in Flies Richard and Marian Dawkins examine the parameters of grooming sequences in blowflies. Animal Behavior, 1976, 24: pp. 739-755 Download Decisions and the Uncertainty of Behaviour Richard and Marian Dawkins assert that behavior can be described through changing uncertainty or through a structural behavior pattern. Rec. 1972, Vol. 20, No. 4: pp. 83-103 Download The Hunting Behaviour of Individual Great Tits in Relation to Spacial Variation in their Food Density James N. M. Smith and Dawkins respond to data collected in variations of food density and spacial changes present when testing great tit birds. Animal Behavior, 1971, 19: pp.695-706 Download A Threshold Model of Choice Behaviour This article suggests a model for the underlying mechanisms of making choices from an evolutionary standpoint. Animal Behavior, 1969, 17: pp. 120-133 Download The “Peck/No-Peck Decision-Maker’ in the Black-Headed Gull Chick Using the Choice Threshold Model, Dawkins and Impekoven determine the absolute number of responses to stimuli in black-headed gull chicks. Animal Behavior, 1969, 17: pp. 243-251 Download The Attention Threshold Model This article utilizes selective attention theory to validate Dawkins’ Choice Threshold Model. Animal Behavior, 1969, 17: pp. 134-141 Download University of Nebraska State Museum Exhibit During Richard Dawkins’ 2009 American tour, he visited the “Explore Evolution” exhibit at the University of Nebraska State Museum in Lincoln. While visiting he filmed a collection of short unrehearsed and unscripted videos inspired by the “Explore Evolution” exhibit. See all the videos here. The Richard Dawkins Foundation for Reason and Science would like to thank the University of Nebraska State Museum for providing this resource to the public to help further the understanding of evolution. A Taste of ‘The God Delusion’ Since its publication in 2006, The God Delusion has been a life-changing book for many. It has become a staple of our movement by outlining, in brilliant fashion, the arguments against theism and an emphatic plea for us to embrace reason and science. As a special gift, we are making available the beginning and end, the Alpha and Omega as it were, of The God Delusion available to you for free. Click the cover below to download or get it here."
