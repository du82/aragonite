ot agree with each other on all issues, nor should we. Atheism is simply the absence of … Life Driven Purpose, pg 42 Jul 31, 2017 · 11 By the way, Christians believe that when they get to heaven there will be no more struggle, pain, or sorrow. This means there will be no problems to solve during an eternity of praising the Master. Since purpose comes from solving problems, heaven will be Ultimate Purposelessness! Most believers think the mere material world can’t … 123…7»"
