full_description = "BOOK CLUB 2025 Special Topic Jan 1, 2025 This is the 2025 follow-on from the 2024 BOOK CLUB thread, which is now closed, though you can easily refer back to earlier discussions by clicking on the link. BOOK CLUB 2025 has been created to provide a dedicated space for the discussion of books. Pretty much any kind of book – it doesn’t have to be about atheism or religion or science or politics. It doesn’t even have to be non-fiction. All we ask is that, whatever the topic or genre, the books are stimulating, intelligent and thoughtful, so that they are actually worth discussing, and that you post any recommendations along with a commentary giving a bit of background and explaining why you’re recommending it. Clearly “worth discussing” is open to interpretation, but hopefully you get the idea. Books originally in a language other than English are fine too, provided an English translation is available. The only real restriction is that, in keeping with our Comment Policy, users should not use this thread to promote any books they may have written themselves or have any other kind of personal stake in. Happy reading, and happy discussing! Or … if film/video/tv or the arts in general are more your thing, there’s a link for that below. NB. For anything to do with climate, climate science, climate change etc., please post on our dedicated Climate thread rather than here: Discussion ThreadThe Climate Crisis Discussion ThreadFilm, Video, TV & Arts Club Share Comment Write a Reply 38 Comments 38 Jan 4, 2025 at 2:05 pm Michael 100 says: I’m about to post my first review of this year. Before I do, however, I thought I’d set out some reading goals I’ve set for myself for 2025. in a video I saw recently, I think it was Douglas Murray who noted Christopher Hitchens’ love of Evelyn Waugh. I’ve vowed to read as many of his novels as I can, I’ve actually begun with Decline and Fall I want very much to finish the 12 book series by George Orwell’s friend, Anthony Powel. The series is called A Dance to the Music of Time. I think it’s the 11th book that’s entitled Books do Furnish a Room a title that should ring a bell. New books have been published about President Lincoln and the civil war era. I”ve started with Erik Larson’s Demon of Unrest I must read David W. Bright’s Frederick Douglass, Prophet of Freedom, Matthew Stewart’s An Emancipation of The Mind, Radical Philosophy, the War over Slavery, and the Refounding of America and Heather Cox Richardson’s To Make Men Free, a History of the Republican Party I must read Third Millennium Thinking, Creating Sense in a World of Nonsense by Saul Perlmutter, John Campbell and Robert MacCoun. And, I know that Lawrence Krauss is in the process of editing a book of essays by prominent scientists. Those are my goals. at the end of the year, I’ll see how well I’ve done."
