full_description = "BOOK CLUB 2024 Discussion Jan 1, 2024 This is the 2024 follow-on from the 2023 BOOK CLUB thread, which is now closed, though you can easily refer back to earlier discussions by clicking on the link. BOOK CLUB 2024 has been created to provide a dedicated space for the discussion of books. Pretty much any kind of book – it doesn’t have to be about atheism or religion or science or politics. It doesn’t even have to be non-fiction. All we ask is that, whatever the topic or genre, the books are stimulating, intelligent and thoughtful, so that they are actually worth discussing, and that you post any recommendations along with a commentary giving a bit of background and explaining why you’re recommending it. Clearly “worth discussing” is open to interpretation, but hopefully you get the idea. Books originally in a language other than English are fine too, provided an English translation is available. The only real restriction is that, in keeping with our Comment Policy, users should not use this thread to promote any books they may have written themselves or have any other kind of personal stake in. Happy reading, and happy discussing! Or … if film/video/tv or the arts in general are more your thing, there’s a link for that below. NB. For anything to do with climate, climate science, climate change etc., please post on our dedicated Climate thread rather than here: Discussion ThreadThe Climate Crisis Discussion ThreadFilm, Video, TV & Arts Club Share Comment Write a Reply 162 Comments 162 Jan 18, 2024 at 9:14 pm Michael 100 says: The Road To Reality by Roger Penrose I give up. I read about 80 pages, but I can see no reason to continue. The book would have made a great companion to the study of mathematics especially college algebra where we studied complex numbers. While they seemed very interesting, they have no practical application in my day-to-day life. How often is one called upon to understand the square root of negative two. Penrose does a marvelous job talking about these concepts, but he did not write a text book. A text book teaches how to calculate. Penrose explains the magic. Both together would make a wonderful pair, but trying to appreciate Penrose’s work with just a tiny memory of the actual subject matter is just too frustrating for me. I found Penrose’s discussion of Platonic math and geometry interesting — “the Platonic world of mathematical forms.” Penrose wrote: “Platonic existence, as I see it, refers to the existence of an objective external standard that is not dependent upon our individual opinions nor upon our particular culture.” In other words, two plus two equals four whether or not any one is aware of it or not. I think that concept is consistent across all of science. For those who have the time and inclination, the world of mathematics is beautiful beyond description, and this book only adds to the appreciation of that beauty. If life were not so short, I’d reenroll in math classes and again study these magical concepts, but alas the bird of time has not far to flutter, and lo the bird is on the wing."
