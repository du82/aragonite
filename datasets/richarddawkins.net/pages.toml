title = "BOOK CLUB 2023 | Richard Dawkins Foundation for Reason and Science"
description = "This is the 2023 follow-on from the 2022 BOOK CLUB thread, which is now closed, though you can easily refer back to earlier discussions by clicking on the l ..."
full_description = "BOOK CLUB 2023 Uncategorized Jan 1, 2023 This is the 2023 follow-on from the 2022 BOOK CLUB thread, which is now closed, though you can easily refer back to earlier discussions by clicking on the link. BOOK CLUB 2023 has been created to provide a dedicated space for the discussion of books. Pretty much any kind of book – it doesn’t have to be about atheism or religion or science or politics. It doesn’t even have to be non-fiction. All we ask is that, whatever the topic or genre, the books are stimulating, intelligent and thoughtful, so that they are actually worth discussing, and that you post any recommendations along with a commentary giving a bit of background and explaining why you’re recommending it. Clearly “worth discussing” is open to interpretation, but hopefully you get the idea. Books originally in a language other than English are fine too, provided an English translation is available. The only real restriction is that, in keeping with our Comment Policy, users should not use this thread to promote any books they may have written themselves or have any other kind of personal stake in. Happy reading, and happy discussing! Or … if film/video/tv or the arts in general are more your thing, there’s a link for that below. NB. For anything to do with climate, climate science, climate change etc., please post on our dedicated Climate thread rather than here: Discussion ThreadThe Climate Crisis Discussion ThreadFilm, Video, TV & Arts Club Share Comment Write a Reply 134 Comments 134 Jan 1, 2023 at 5:52 am Moderator says: Welcome to Book Club 2023! Who’s going to kick things off? 🙂 The mods Jan 3, 2023 at 3:33 pm Michael 100 says: First, to The Mods, thanks for the Book Club 2023. I’ll kick things off. I’ve read the first section (chapters 1-4) of Dan Jones’ Powers and Thrones. If the rest of the book is as interesting as those chapters, it’s going to be hard to put the book down. Not only is the subject matter interesting, but Jones is a very good writer. About the only thing I remember from my elementary and high school history classes about the fall of the Roman Empire was that the City of Rome was sacked by a band of barbarians — as though it happened one afternoon. I also found the chapter on the rise of Islam interesting. We tend to think of all the events described in the book as being ancient history which is now irrelevant but history is not a series of isolated events, it’s a never-ending story. While 2,000 years is a long time, in the great scheme of things it’s the blink of an eye. So much of what Jones writes about explains things that go on today. In any event, I’m really looking forward to the remaining sections of the book. I’m really grateful for the recommendations from people who read the book and posted about it in last year’s book club."
