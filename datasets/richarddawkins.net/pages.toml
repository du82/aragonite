title = "‘Secular Versions of Blasphemy Laws’ | Richard Dawkins Foundation for Reason and Science"
description = "From the Richard Dawkins Foundation Newsletter. Subscribe here. Hello! One of the key differences between religion and science is in how each one deter ..."
full_description = "Image: Adobe Stock ‘Secular Versions of Blasphemy Laws’ Education Original Politics Religion Science Feb 25, 2025 From the Richard Dawkins Foundation Newsletter. Subscribe here. Hello! One of the key differences between religion and science is in how each one determines “truth.” Religious “truth” requires nothing more than one’s belief. If God, the Pope, or the Imam says it, it must be so. Case closed. Science, on the other hand, is based on facts. It draws its strength from observable reality—demonstrable, repeatable, and universal. That’s what makes science so much more powerful and useful to humanity. Unfortunately, worldviews predicated on mere belief—whether they be theological or simply ideological—do not like to be confronted with facts, especially when they directly contradict those beliefs. And, as we see time and again, those belief-based systems will push back, hard, to defend themselves. As we’ll see, that can come in many forms. It can include the extension of laws intended to punish hate crimes to causing religious believers “alarm or distress,” creating what columnist Kenan Malik calls “secular versions of blasphemy laws.” It can include the simple dismissal of scientific reality as merely a “social construct,” as Richard Dawkins warned against in a recent essay. And, at its most dangerous, it can include installing anti-science misinformation peddlers in key positions of public trust, allowing them free rein to undermine important scientific research and public health programs. Fortunately, facts and science can still prevail. For example, in the deep red state of North Dakota, legislators just this week voted down a bill that would have required teaching “intelligent design” alongside evolution in public schools. The Richard Dawkins Foundation for Reason & Science will continue to advocate for sound, science-based approaches to society’s problems. We will never stop fighting for science education based on provable fact, rather than religious belief. And we will always be grateful to have you standing alongside us. Robyn E. Blumner,CEO and President, Center for InquiryExecutive Director, Richard Dawkins Foundation for Reason & Science Subscribe to the Newsletter Share Comment Write a Reply 0"
