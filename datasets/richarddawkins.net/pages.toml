full_description = "Subtitles Project Non-English speakers don’t have enough access to quality science content or information on secularism in their own language. In addition, many English speakers may be hard of hearing or may need subtitles. Our team of translators is changing that! We are transcribing and translating the videos on our YouTube channel in order to bring science and reason to viewers worldwide, in languages as diverse as Portuguese, Arabic, and Russian. If you want to become a translator, please fill out this form to join the RDF Volunteer Corps, and our volunteer coordinator will be in touch with you soon! We are not currently taking applications at this time. Thank you"
