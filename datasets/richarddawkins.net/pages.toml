full_description = "FILM, VIDEO, TV & ARTS CLUB Discussion Special Topic Dec 31, 2020 We have created this thread to provide a dedicated space for the discussion of films, videos, TV and the arts. All we ask is that, whatever the topic or genre, the works discussed are stimulating, intelligent and thoughtful, so that they are actually worth discussing, and that you post any recommendations along with a commentary giving a bit of background and explaining why you’re recommending it. Clearly “worth discussing” is open to interpretation, but hopefully you get the idea. Films and other media originally in a language other than English are fine too, provided they come with English subtitles. The only real restriction is that, in keeping with our Comment Policy, users should not use this thread to promote any films or other media they have any kind of personal stake in, and the films discussed should not risk bringing the site into disrepute. We hope you enjoy this new thread. THE BOOK CLUB CAN BE FOUND AT: https://www.richarddawkins.net/2019/05/book-club/ Share Comment Write a Reply 153 Comments 153 Dec 11, 2020 at 12:54 pm LaurieB says: Film club. Hmm. Phil Portrait…sounds great. Also, while over at your link I noticed that Netflix has a film – Effie Gray. The long suffering Effie Ruskin of course! This I can’t resist. The Ruskin-Effie-Millais fascinating triangle. I hope the film does the story justice. I’ll be incensed if it doesn’t! Every time I stand in front of a bland, white streamlined statue of a human female I think of…Ruskin. What a piece of work. Dec 11, 2020 at 2:49 pm phil rimmer says: Just awesome, mods. Perhaps you might put “book-club link” in brackets on the front page, so its visible there? I must get weaving. Laurie, I found the Effie Gray film somewhat undercooked. But definitely worth a look for those of us interested. If I haven’t mentioned it before, there is a 15 hour study in five parts of women directors and their product from the earliest days of cinema. “Women Make Film”. Though compiled by a man, Mark Cousins, I think the analysis is astute. What delights me about his style is the open-handed way he can simply annunciate what is on the screen, and by annunciating you see it and his point is made."
