hael Gibbs, Pat Metheny and Herb Pomeroy) PhD: Brunel University (U.K.) (1994) Dr. Niles has given Masterclasses at (U.K.) The Academy of Contemporary Music - Vocal Tech - Brunel University - Leeds College of Music - The Royal Northern College of Music -Rose Buford College (2010–2011) Consultant to the Associated Board of the Royal Schools of Music (U.S.A.) The Berklee College of Music- The Musician’s Institute - USC – UCLA - CalState (Northridge) - Saddleback College – Orange County School of the Arts .p-5jt8402{text-align: center} .p-5jt8402 .pagelayer-btn-holder{-webkit-transition: all 400ms !important; transition: all 400ms !important} .p-5jt8402 .pagelayer-btn-icon{padding: 0 5px} Contact Richard .p-8sv3808 .pagelayer-col-holder{padding: 10px} .p-8sv3808 > .pagelayer-background-overlay{-webkit-transition: all 400ms !important; transition: all 400ms !important} .p-8sv3808 .pagelayer-svg-top .pagelayer-shape-fill{fill:#227bc3} .p-8sv3808 .pagelayer-row-svg .pagelayer-svg-top{width:100%;height:100px} .p-8sv3808 .pagelayer-svg-bottom .pagelayer-shape-fill{fill:#e44993} .p-8sv3808 .pagelayer-row-svg .pagelayer-svg-bottom{width:100%;height:100px} TESTIMONIALS .p-9bp4203 .pagelayer-quote-holder{background-color: #eeeeee;position: relative;text-align: left;border-left-width: 5px; border-left-style: solid;border-left-color: #6200ea;padding-left: 30px; padding-right: 10px;padding-top: 20px; padding-bottom: 20px} .p-9bp4203 .pagelayer-quote-content{color:#050505;margin-top:3px;margin-bottom:3px;font-family: ; font-size: 20px !important; font-style: !important; font-weight: !important; font-variant: !important; text-decoration-line: !important; text-decoration-style: !important; line-height: em !important; text-transform: !important; letter-spacing: px !important; word-spacing: px !important;position: relative; z-index:1} .p-9bp4203 .pagelayer-quote-cite{position: relative; z-index:1;text-align: left;font-family: ; font-size: 16px !important; font-style: italic !important;