r Cat Stevens - Arranged for Cat Stevens, David Essex, Gloria Jones, and Maxine Nightingale. 1977 Musical Director - The David Essex Show, arranged for Twiggy, Kate Bush. Musical Director – It’s Friday – Leo Sayer, arranged for The Real Thing, Denny Laine.1978 ‘Discovered’ Sarah Brightman dancing with Hot Gossip Recommended her to Producer Steve Rowland for the hit I Lost My Heart To A Starship Trooper, arranged by Niles. Produced, co-wrote album Somethin’ Else for Graham Dee Co-produced/arranged Standard Time for Wings guitarist Laurence Juber. Co-wrote Sunset on Sunset for Tina Turner. 1979 Co-produced American Garage for The Pat Metheny Group. Arranged The Mitchell/Coe Mysteries/Exiled ft. Miles Away - Colin Blunstone .p-vax8964{margin-top: 10px; margin-right: 0px; margin-bottom: 0px; margin-left: 0px} .p-vax8964 .pagelayer-text-holder p{font-family:noto sans; font-weight:400;line-height:2; color:#ffffff;} 1980 Co-wrote songs with Spike Milligan for Songs From A Chicken’s Laundry 1981 Co-writer, arranger Heart Control – Leslie McKeown. Producer/Arranger The Disco Sound of Music ft. Sara Brightman and Sharon Campbell Composer/producer 1981 – The Richard Niles Quintet ft. Mitch Dalton, Peter Van Hooke, Dill Katz, Chris Hunter. Produced and arranged Hubbard’s Cubbard ft. Guy Barker, Chris Hunter 1982 Arranger Life & Rhymes - Gilbert O’Sullivan - prod. Randy Edleman. Arranger Randy Edleman On Time In the same year he p Producer 24 Hours from Tulsa for Claire Hammil. Arranger Life In The Slim Lane Judy Mazel. Producer, arranger, composer It’s About Time - Morrissey-Mullen, ft. Jim Mullen, Dick Morrisey Producer/arranger Thumbs Up - Jim Mullen ft. Guy Barker and Chris Hunter. Co-producer/arranger/Co-writer The Warriors - Bluey Maunick ft. Guy Barker and Chris Hunter. Arranger Date Stamp - ABC, The Lexicon of Love, Producer Trevor Horn. 1983 Producer, arranger, composer It’s About Time Morrissey-MullenJim Mullen, Dick Morrisey 1985 Arranger Grace Jones - Slave to the Rhythm, Producer Trevor Horn. Producer Dusty Springfield - Just Like Butterflies Arranger Why Does It Have to Be This Way? - Anne Pigalle, Prod. Trevor Horn Arranger Famous People - Bill Sharpe 1986 Arranger The Foolish Thing to Do Heaven 17 feat. Jimmy Ruffin Arranger Americanos - Holly Johnson Arranger Sex Me, Talk Me – Berlin Ordinary Day - Curiosity Killed The Cat 1987 Arranger Breaking Away - Jaki Graham Arranger Could It Be I’m Falling in Love - Jaki Graham & David Grant Arranger Watching The Wildlife - Frankie Goes to Hollywood Prod. Trevor Horn Arranger Like Giving Love - Five Star Arranger Take Me Home – Roger Daltrey Prod. Alan Shacklock Arranger There When I Needed You - Sheena Easton Arranger When Smokey Sings – ABC prod. Bernard Edwards Arranger It’s Better to Travel by Swing Out Sister, ft. #1 Breakout 1988 Composer Ear Trumpet – Orchestral piece for Guy Barker Arranger Like Giving Love - Five Star Arranger Rules – Anita Baker Arranger Homelands -Ellis Beggs & Howard Arranger Spy In The House of Love – Was Not Was Arranger Left to My Own Devices - Pet Shop Boys Producer/Arranger Prove To Me – Perri – ft. in the Spike Lee film Do The Right Thing Composer The Strike, film for Channel 4 (winner, Golden Rose of Montreaux, Honorable Mention for music 1989 ‘Discovered’ Clive Griffin - Produced/Arranged/co-wrote 1st album Step By Step. Arranger Sowing the Seeds of Love, Advice for The Young at Heart – Tears For Fears ArrangerArranger album Rich and Poor – Randy Crawford Arranger Rules – Anita Baker Producer/Arranger Sleepwalking – Workshy Musical Director, bandleader Don’t Miss Wax (Channel 4) ft. Ruby Wax BANDZILLA performed every show and for guests Meat Loaf, Pee Wee Herman Formed Lifetime Records with Graeme Perkins Blue Movies Richard Niles’ BANDZILLA .p-rbs1199{margin-top: 10px; margin-right: 0px; margin-bottom: 0px; margin-left: 0px} .p-rbs1199 .pagelayer-text-holder p{font-family:noto sans; font-weight:400;line-height:2; color:#ffffff;} 1990 Co-writer/Arranger Inside Out – Clive Griffin Arranger The Hit Collection – Gloria Gaynor Producer/Arranger/Co-Writer album Tell Me Where You’re Going – Silje Nergaard Producer/Arranger/Co-Writer Tell Me Where You’re Going – Silje Nergaard & Pat Metheny (#1 in Japan) Producer/Arranger/Co-Writer album Silje – Silje Nergaard Producer/Arranger/Co-Writer Where You Are – Morten Harkett & Silje Nergaard Producer/Arranger Glade Jul - Silje Nergaard 1991 Producer/Arranger Overture to Performance - Pet Shop Boys used on their Performance World Tour. Released on EP DJ Culture Arranger World in Union – Kiri Te Kanawa – theme for the Olympics Lyricist/Co-Producer - the Taiga Symphony – singer Valeria & Moscow State Symphony 1992 Producer/Arranger/Co-Writer album Cow on the Highway – Silje Nergaard Producer – Wild Thing – The Troggs ft. Oliver Reed Producer/Arranger/Co-Writer End Of The Line – Osny Melo. Arranger I’m On My Way – Betty Boo Producer/Arranger The Michael Ruff Band ft. Nils Landgren Arranger album - Through The Years '''
