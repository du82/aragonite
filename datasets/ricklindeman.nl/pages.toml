["https://ricklindeman.nl/van-fiets-en-vis"]
title = "Van Fiets en Vis – Rick Lindeman"
full_description = "Van Fiets en Vis admin | July 6, 2021 | Publicaties | No Comments Samen met Luna van der Loos schreef ik een stuk over de parallellen tussen het verzamelen van data over fietsers en vissen. Dit was bijdrage aan de bundel van het Colloquium Vervoersplanologisch Speurwerk, Corona Editie 2020, namens RWS. Aanleiding De verkeers- en vervoersector heeft net als andere sectoren de nijging vooral binnen de eigen sector te kijken. In dit paper willen we kijken wat de aanpak voor fietsdata kan leren van het onderzoek naar de visstanden in Nederland en vice versa. Juist in tijden waar de natuur ons dwingt tot ander gedrag, is het interessant om naar de natuur zelf te kijken. De natuur kan op vele manieren inspiratie dienen voor de mens. Soms gaat het over het ontwerp, soms over sociaal gedrag, maar in dit geval hoe de mensen haar onderzoekt. Immers fietsers zijn net als vissen zo glad als een aal, en bewegen zich soms net als sardines in een school volgens de regels van attractie, ontwijking en uitlijning. Methoden Als je kijkt naar de uitdagingen van de verzameling van beleidsdata kan je kijken naar de technische vragen, de organisatievragen en de standaardisatie vragen. Stichting Anemoon gebruikt de waarnemingen van duikers om de visstand (en ook krabben, mosselen en andere ongewervelden) in de Zeeuwse delta en het Noordzee bij te houden. Technisch regelt zij een platform waarin de duikers hun waarnemingen in kunnen bijhouden. De NDW beheert voor de fiets een platform. Hierin kunnen gemeenten hun lusdata neerzetten. Daarnaast zijn er de technische uitdagingen (GPS, Telefoon) voor het waarnemen van de fiets zelf. Stichting Anemoon gebruikt vrijwilligers (de duikers). Na een dip van een aantal jaren lijkt het aantal metende duikers weer toe te nemen. In het verleden gebruikte de fietstelweek ook vrijwilligers. Dit bleek echter op de lange duur niet te hanteren. De vrijwilligers waren het eerste jaar intrinsiek gemotiveerd. In latere bleken ze een ‘incentive’ nodig te hebben om door te gaan. Hierdoor is besloten om te kiezen voor afgeleide data in de aanbesteding voor ‘Talking bikes’. Dit betekent dat data wordt gebruikt die eigenlijk voor andere doeleinden toch al werd verzameld. Dit heeft echter wel effect op de privacy. Vissen hebben hier minder moeite mee. Standaarden zijn in de wereld van data essentieel. Zeker als de data in een ‘vijver’ wordt gegooid als die van de NDW. Waar het verkeerssysteem een combinatie van verkeersdata, ov-data (Bison) en fietsdata is, zijn er naast visdata ook gegevens van overige flora en fauna. Er worden ook gegevens verzameld in andere projecten in het getijdengebied, met korren en strandaanspoelsels. Daarnaast zijn er – zeker voor de vissen – natuurlijk ook nog gegevens uit onderzoeksbureaus en instellingen (o.a. IMARES en Wageningen Marine Research) Alle gegevens die worden ingevoerd door vrijwilligers (via Stichting ANEMOON, maar ook waarneming.nl, Telmee.nl en andere platforms) worden verzameld in de Nationale Databank Flora en Fauna. Deze zijn toegankelijk via het Natuurloket Het uitzetten van 10.000 jonge snoekjes in het paaigebied snoek in de Dintelse gorzen-West.(Krammer-Volkerak-Zoommeer). Foto Beeldbank RWS Om significante uitspraken te kunnen doen heeft Anemoon ook juist metingen nodig waar en wanneer geen vis is aangetroffen. Immers, dan weet je pas of het aantal vissen achteruit gaat. Dat is belangrijk les voor de verkeerssector. Hier wordt immers ook meestal geteld waar wel een auto, fiets of trein is. Niet waar deze niet is. Dit betekent dat ook in tijden van allerlei geavanceerde meet methoden ook ruimte moet blijven voor de klassieke lusmeting. Deze telt immers ook als er niks is. Conclusie Het werken met data kent ook in heel andere sectoren eigenlijk best vergelijkbare uitdagingen. Elke sector tackelt deze weer op zijn eigen manier. Door te kijken over de grenzen van onze sector heen, kunnen reflecteren op de manier waarop wij naar uitdagingen kijken. Via de Tour de Force werkt de overheid nu structureel aan meer en betrouwbare fietsdata. Juist door aansluiting te zoeken bij andere data, via bijvoorbeeld het landelijke dataketenoverleg wordt getracht om die uitdagingen te overwinnen Volgende keer als je een vis in de ogen kijkt, bedenk dan dat hij je aankijkt met begrip, want hij weet dat krabben tellen even lastig als fietsen. jQuery(document).ready(function($) { $.post('https://ricklindeman.nl/wp-admin/admin-ajax.php', {action: 'wpt_view_count', id: '189'}); }); Related Posts Kumasi No Comments | Oct 5, 2017 Smart biking: droom of het einde van de fiets? No Comments | Dec 9, 2016 Ab Urban Condita No Comments | May 27, 2001 Het NatuurCanvas – Duurzaam Innoveren voor een Robuust Businessmodel No Comments | Sep 11, 2023 About The Author rickthuis"
