["http://www.ricklindeman.nl/files/archive-dec-2007.html"]
title = "Rick filosofeert"
full_description = "Dec 2007 Rick filosofeert | Jan 2008 | Nov 2007 Schaatsen21/12/07 10:43 Opgeslagen in: SportSchaatsen op natuurijs, voor het eerst in 7 jaar ofzo. En sinds de verhuizing, kan dat gewoon voor de deur!Het mag dan niet echt een elfstedentocht zijn, maar toch, hier de Franz LehàrsingelTags: TerwijdeMerry Christmas21/12/07 09:45 Opgeslagen in: OpmerkelijkTop Elfen!Martin Ros21/12/07 09:44 Opgeslagen in: OpmerkelijkGeachte Tros,U heeft mij helaas van de reden beroofd ooit nog naar uw nieuwsshow te luisteren. Waar de rest van de uitzending voor gebrabbel over ditjes en datjes bestaat, met onderwerpen waar de presentatoren niet altijd even goed van op de hoogte te zijn, was de performance van de heer Ros elke keer weer een hoogtepunt in radioland.Nog één keer zullen wij morgen genieten van de begeisterung, van de kennis, van de spirit van Ros. Welke weeë dieren u hiervoor in de plaats gaat zetten weet ik niet precies, maar de kans dat zij een dergelijk monument overtreffen lijkt mij gering. Natuurlijk Ros kon doordraven, maar zoals juist de oude opa zijn kleinzoon kan inspireren met verhalen van vroeger, zo kon Ros ons inspireren tot de aankoop van boeken die wij anders in het grote aanbod geen blik waardig zouden kunnen.Deze analogie gebruik ik natuurlijk niet voor niks. Ros is actief sinds ik bewust radio luister. Hij heeft mijn hele jeugd mede een literaire stem gegeven. En hoewel het enerzijds passend lijkt om, nu mijn smaak op mijn dertigste volgroeid is, afscheid te nemen van een inspirator, is dat niet zo. Want juist nu was ik instaat hem te nuanceren, hem te relativeren, en hem te corrigeren.Mijn vader, levenslang Ros-adept, viert morgen zijn 35ste trouwdag. Op die dag zal ook helaas een stukje van hem sterven. Ik hoop dat Ros net als zijn grote held Coppi zal geniet van zijn tijd met zijn eigen Dame Bianca.Onze laatste hoop is dus nu blijkbaar Interpolis, hoe irritant die reclames ook mogen zijn Hoogachtend,Rick Lindeman Club Raw07/12/07 09:15 Opgeslagen in: PartyIn plaats van Awakenings gingen we dit keer naar Club Raw in de Amsterdamse P60, gezellig, maar beetje te hard voor mijn oren. Met nog een afscheidsbezoek aan Syl's kot in Uilenstede, en ene laatste groet aan de dakdekker.Meer foto's"
