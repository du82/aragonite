title = "Managementboek – Rick Lindeman"
full_description = "Managementboek admin | October 1, 2017 | Publicaties | No Comments Onlangs werd ik gevraagd om ook boekrecensies voor de site van Managementboek te schrijven. Goede deal, gratis boek. Ze gaan meestal over service design, of filosofie, maar soms ook iets heel anders. Zie mijn pagina op het boekenblog voor het overzicht This is Service Design Doing – ‘Een geweldig rijk boek’ Vandaag, 09:00 | Rick Lindeman | Recensie In 2011 ver­scheen This is Ser­vi­ce De­sign Thin­king van Stick­dorn en Schnei­der. Het was een boek vol met voor­beel­den, me­tho­den en de prin­ci­pes van Ser­vi­ce De­sign. RECENSIES Da’s gek – ‘Je wordt een beetje antropoloog’ 20 april 2018 | Rick Lindeman | Recensie Drie jaar ge­le­den al­weer ver­scheen van Da­niel­le Braun, sa­men met Jits­ke Kra­mer het ge­wel­di­ge boek De Cor­po­ra­te Tri­be. Een rij­ke uit­ga­ve, vol mooie fo­to’s van ri­tes in Afri­ka en to­tem­pa­len in Ame­ri­ka. Lees het volledige artikel… Handboek voor de heerser – ‘Voor managers met oog voor klassieke wijsheid’ 22 februari 2018 | Rick Lindeman | Recensie Chi­na is de­zer da­gen in trek. Me­de om­dat de eco­no­mi­sche draak is ont­waakt. Ook de (tech­no­cra­tisch) ‘ge­lei­de volks­re­pu­bliek’ als be­stuurs­prin­ci­pe wordt in de­ze tijden door som­mi­gen ge­waar­deerd. Lees het volledige artikel… Alles is onderhandelen – Volledig en helder 1 augustus 2017 | Rick Lindeman | Recensie Al­les is on­der­han­de­len is vol­gens Geurt-Jan de Heus het man­tra, in de­ze on­ze­ke­re tijd. Niet is meer ze­ker, en daar­door moet el­ke pro­fes­si­o­nal in staat zijn goed on­der­han­de­len. Hij leidt je aan de hand van 7 prin­ci­pes door het on­der­werp. Lees het volledige artikel… jQuery(document).ready(function($) { $.post('https://ricklindeman.nl/wp-admin/admin-ajax.php', {action: 'wpt_view_count', id: '160'}); }); Related Posts Het NatuurCanvas – Duurzaam Innoveren voor een Robuust Businessmodel No Comments | Sep 11, 2023 Hollandsche Steden in de Republiek No Comments | Oct 5, 2017 Succesroute voor uw mobiliteitsproject No Comments | May 22, 2010 Van Fiets en Vis No Comments | Jul 6, 2021 About The Author rickthuis"
