["http://www.ricklindeman.nl/files/7fede487ecfb3a6bc75398b7e3f45a9c-399.html"]
title = "Tineke | Reizen, Party | rick filosofeert"
full_description = "Tineke17/07/00 17:01 Opgeslagen in: Reizen : PartyEen huis-, tuin- en keuken naam eigenlijk.Zelf was ze wat specialer.Rick zag haar praten met zijn buurman. Hij mengde zich even in het gesprek.Toen ging hij dansen, met een Poolse blondine.Ze brachten de dansvloer in vervoering.Toen werden de Polen weggeroepen door hun secretaris-generaal.Rick keek om zich heen, en zag haar weer staan.In een hoekje, dansend, alleen voor zichzelf.Britney klonk uit de luidsprekers.Tineke keek hem uitdagend aan.Hun lijven bewogen al snel in hetzelfde ritme.De chemie bracht hun nader tot elkaar.Ze verkenden elkaar zoals een vis een nieuwe kom onderzoekt,Vrij, Dartelend, in een nieuwe speelruimte,Rick miste de bus, maar dat vond hij al niet meer erg.Met haar liep hij lachend door de plassen.Veel later lag hij pas in zijn bedje, verhalend over de dagen en nachten."
