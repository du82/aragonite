["http://www.ricklindeman.nl/files/25a31ebd3efaec04868751ab3bcae9e8-280.html"]
title = "Vrouwen & Amerika | rick filosofeert"
full_description = "Vrouwen & Amerika02/02/01 16:35 Deze column schrijf ik een beetje in opdracht van een vriend van me. Laten we hem Peter noemen (nee Peter K., jij bent het niet!). Hij vroeg zich af waarom vrouwen toch vaak complexere problemen hebben waar mannen niet zo stil bij blijven staan. Laten we onze gedachten eens hierover laten gaan.Deze Peter heeft een blonde vriendin. Erg aardig meisje. Nu haat ze mij blijkbaar, aangezien ik samen met de ex van die Peter hem ging opzoeken in een grote Amerikaanse stad. Laten we zeggen Boston. Die ex is erg nuchter Noord-Hollands, dus die betrekken we er nog maar even niet in, maar de blonde vriendin is een verhaal apart.Nu gingen we met een vreemd gezelschap naar Amerika. Er liepen nog al wat interne lijntjes in de groep. Iedereen had wel eens iets met iemand in het gezelschap gehad. De mannen gingen cynisch met die situatie om, hoewel ook in het begin wat ongemakkelijk was.. De blonde vriendin had er wat meer moeite mee. In het reisje kwam er nog een intern lijntje bij. Beide partners hadden ook al wat met iemand anders in de groep gehad. Ook hier werd er door beide geslachten heel anders gereageerd. De verlate vrouw raakte in paniek, haar mannelijke variant vatte het slechts lollig op.De vraag die ik eigenlijk aan de lezer wil stellen is dan ook de volgende: waarom lijkt het of mannen dit soort onhandige situaties het gewoon verstandelijk uitpraten en een beetje scherp met elkaar omgaan, terwijl het andere geslacht het lijkt op te kroppen, waardoor het allemaal weer complexer wordt? Nu sta ik bekend als iemand die zich makkelijk in de situatie van vriendinnen van mij kan verplaatsen, maar toch blijft dit waarom knagen….."
