["https://ricklindeman.nl/cycling-data-as-change-agent-for-sustainable-mobility"]
title = "Cycling data as change agent for Sustainable Mobility – Rick Lindeman"
full_description = "Cycling data as change agent for Sustainable Mobility admin | June 3, 2019 | Publicaties | No Comments Samen met Joost de Kruijff van de BUAS schreef ik een Paper voor het ITS Congres in het Evoluon. The Netherlands is known for its high cycling shares and great cycling infrastructure. What many people less realize is the challenge to increase those shares even more to enhance cycling in the sustainability smart cities objectives. To push cycling to the next level a national collaboration has been set up to join forces in the field of cycling data collection, storage, visualisation and analyses. Next, cycling knowledge sharing between a variety of stakeholders, ranging from academic to highly applied level, is essential. This paper not only covers an overview of challenges of the national organisation and the development of a cycling data platform but also shows how European award winning best practises add to the smart city objectives in the Netherlands. Combining mobile phone data, GPS/GNSS data, traffic light data, national survey data, traffic forecast model data and virtual and augmented reality results in a joint approach to smart cycling cities and ITS cycling developments. Als Presentatie Cycling Data as a change agent for Sustainable Mobility from Rick Lindeman jQuery(document).ready(function($) { $.post('https://ricklindeman.nl/wp-admin/admin-ajax.php', {action: 'wpt_view_count', id: '177'}); }); Related Posts Managementboek No Comments | Oct 1, 2017 Games in the Favela No Comments | Oct 27, 2017 Effectief innoveren in voor- en natransport met oog voor de reiziger No Comments | Oct 26, 2013 Ab Urban Condita No Comments | May 27, 2001 About The Author rickthuis"
