["http://www.ricklindeman.nl/files/583fe245427013431987c56b0e10520f-500.html"]
title = "World of Goo | Games, English | rick filosofeert"
full_description = "World of Goo02/02/09 13:13 Opgeslagen in: Games : English2D Boy Games, 1500 Wii points (€15)When Tim Burton realised “The Nightmare before christmas” at the end of 1993. He succeeded in many ways. One of the most peculiar was people loving and even adoring a macrable black gothic vision.Fifteen years later a video game achieves this same feat, but it is only one of the reasons World of Goo just might just be the perfect video game.In World of Goo you are essentially making bridges out of Goo. A concept earlier explored in games like Pontifex or Bridge it (and in 2D Boy’s own Tower of Goo). What it makes it stand out is that the Goos themselves are part of the bridges, and you should minimise the number you use, to save more. At first you start with simple bridges over canyons, but it gets more and more complex, as you try to connect to different Goo sorts, with different capabilities.At this point, the reader might be thinking that it might just be a good puzzle game, but then it evolves into something much bigger. The presentation is perfect, and the love it is made with makes you love your little Gooies. The music helps too, and is made freely downloadable by the developer And then you discover Co-op play, It the middle of the level, somebody just presses his Wiimote, and joins in. Together you’ll make even more beautiful Goo-constructions. But watch out, as you’ll too soo see your Goo’s slaughtered by horrible machines and enemies. You need to be tough to not start crying by level 20.It offers something to show off too. The Goos you saved beyond the minimum are saved, and you enter the mini-game of the Goo-corporation. Here you can use them to build the highestower you can, and you see towers of others too. in the background, meaning that not only the high score is important, also how you deal with the results those score give you.The game was made by two people sensible enough to leave a mammoth corporation (EA) and be creative. Those two people made one of the best game of the year. A game which shows downloading games really gives small developers a chance. For iPhone owners who want to taste it, a clone called Tiki Towers is available at the Appstore for just €0.79.S-Rank"
year_published = 2020
