["https://ricklindeman.nl/leren-over-de-fiets-in-disruptieve-tijden"]
title = "Leren over de fiets in disruptieve tijden – Rick Lindeman"
full_description = "Leren over de fiets in disruptieve tijden admin | November 24, 2017 | Publicaties | No Comments Bijdrage aan het CVS 2017 in Gent. Gepresenteerd samen met Denise Hilster (met dank aan haar voor de afbeelding) Leren over de fiets was altijd zo simpel. We wisten aan de hand van CROW-richtlijnen hoe een goede rotonde in elkaar zat. De ideeën van duurzaam veilig waren wijd verspreidt. En waar een fietspad hoorde bedachten we op ons fingerspitzengefühl. Net zoals een Gazelle uit 1950 er niet heel veel anders uitziet als een Gazelle uit 2007, was de kennis die nodig was voor de fietsambtenaar redelijk constant. Het leek zelfs een beetje op voetbal: iedereen dacht er verstand van te hebben. Ineens is die situatie veranderd. We weten veel meer. Dat komt door een aantal zaken • Sinds het programma Beter Benutten weten we steeds meer over welke elementen het gedrag van de fietser beïnvloeden. • Met de fietstelweek (en tal van andere initiatieven zoals B-riders) is er steeds meer data beschikbaar: Snelheid, Volume, Stallingscapaciteit, Vertraging, Locatie, herkomst-bestemming. • De fiets wordt door veel beleidsvelden gezien als Haarlemmerolie: gezondheid, economie, bereikbaarheid, duurzaamheid. De capaciteit en organisatie van het veld is nog niet in staat hiermee om te gaan. • De toegenomen drukte en diversiteit op het fietspad vraagt om nieuwe ontwerpprincipes. • Voor het eerst sinds jaren is er veel Wetenschappelijk onderzoek naar de fiets. Hier komen in de komende jaren veel nieuwe inzichten uit. • Traditioneel werd naar de fietser gekeken alsof hij een automobilist is, nieuw onderzoek van onder meer Te Brömmelstoet (2017) geeft het beeld van een fietser als onderdeel van een zwerm. Ook wordt steeds meer waardering gegeven aan de reistijd zelf (I&M 2017b) Het gebruik van deze inzichten is echter nog in de beperkt. Bovendien is bijvoorbeeld data interessant, maar wordt pas relevant als het leidt tot nieuwe inzichten. De discussievraag voor het kampvuur is dan ook: Welke kennis hebben we nodig als fietsgemeenschap van de toekomst, en wat gaat er eigenlijk mis, als we deze kennis niet hebben. We zijn immers fietsland nummer 1, maar is het mogelijk je ogen te sluiten voor deze ontwikkelingen? Discussievraag In dit paper staat dus vraag centraal: Welke kennis hebben we nodig als fietsgemeenschap van de toekomst, en wat gaat er eigenlijk mis, als we deze kennis niet hebben. We zijn immers fietsland nummer 1, maar is het mogelijk je ogen te sluiten voor deze ontwikkelingen? Een aantal elementen werken we hieronder iets verder uit: nieuwe gedragsinzichten, de ontwikkelingen rond data en de effecten van autonome ontwikkelingen in de fietswereld. jQuery(document).ready(function($) { $.post('https://ricklindeman.nl/wp-admin/admin-ajax.php', {action: 'wpt_view_count', id: '149'}); }); Related Posts Van Fiets en Vis No Comments | Jul 6, 2021 Ab Urban Condita No Comments | May 27, 2001 Hollandsche Steden in de Republiek No Comments | Oct 5, 2017 Kumasi No Comments | Oct 5, 2017 About The Author rickthuis"
