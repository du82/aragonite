["http://www.ricklindeman.nl/files/archive-aug-2004.html"]
title = "Rick filosofeert"
full_description = "Aug 2004 Rick filosofeert | Sep 2004 | Jul 2004 Forum statement23/08/04 17:53 RomanistaThis page is made to clarify my position in some forum threads. I felt it became necessary after this thread, where I was attacked and insulted.Forum are places where opinions are shouted. a) This is often done without looking at perspective of the person who is being talked too. b)¬Ýoften there is a communication problem, as people of different languages meet. Even when people think they speak a foreign language well, they often miss subtilities. c) People often use personal insults if they don't understand a message or don't have a good answer left. d) Fora*, like all internet communication doesn't give the visual or aural clues normal communication does e) the fact that people can communicate anonymous gives them a perceived freedom to talk in a way they wouldn't do normallyIn case of Romanista,a) Position: Dutch, Left-Liberal thinker, Lover of ancient games, Fan of Ajax and Roma, Catholic raised, still appreciating the cultural heritage, but currently between Nietzsche and Buddha. The C64 was better than the Spectrum b) Native: Dutch. Fluent (meaning that normal communication will be without any hiccup, although some things will inevitaby go wrong): English, Italian. Able to have a conversation without problems: French, German. Holiday level: Spanish, Portuguese, Greek. a few words: Polish, Fulani, Wolof, Bulgarian, Japanese. Understands: Classic texts in Latin or Ancient greeks. c) I will never make a personal insult d) C'est la ton qui fait la musique. I will try to reread my posts if they can be understood differently, and will change them if necessary and i'm not too lazy. I will use smileys if applicable. e) Romanista means 'tifoso' (fan) of AS Roma, the soccer club of the Italian capital where I lived. More info about me at www.rick.filosofeert.nl (in dutch), and on a limited basis on www.macretro.tk (in English)The hague, August 23rd, 2004 Romanista (AKA R.J. Lindeman MA)Fastforward 200411/08/04 09:12 Opgeslagen in: Party ￼ Aangestoken door het enthousiaste verhaal der Toppers besloten Celine en Rick ook de tocht naar de stad van de vijand te maken. Bilderberg-heldin Danielle had een arrangement bij het Bilderberg Parkhotel geregeld zodat onze helden voluit konden gaan. Ondanks dat de parade in naam de eer van wijlen Freddy hooghield kon Rick slechts gade slaan hoe menigeen door de Rotterdamse sterke hand van blik of fles werd beroofd. Burgemeester Opstelten wilde blijkbaar laten zien dat hij wel degelijk iets deed om de orde te handhaven. Dat dit waarschijnlijk tot Wodka in colaflessen om versterkt pillen gebruik zou leiden, was blijkbaar niet tot hem doorgedrongen. ￼ Dat mocht de pret echter niet drukken, en onze helden vertrokken door een onverwachts zonnig Rotterdam, waar achter Twentse en ID&T trucks kon worden aangelopen. Genietend van Wederopbouwarchitectuur en god op de knieen danken niet woonachtig te zijn in dit Inferno, tripten onze helden verder. Het hoogtepunt van de Parade zelf kwam echter op de Erasmusbrug, die heerlijk meeswingde met de Q-dance truck. Wat vooral opviel ten opzichte van onze eerdere trips naar Berlijn, was het gebrek aan creativiteit dat het Plebs van de havenstad kenmerkte. Zowel de aankleding van de Arbeiders als die van de Trucks was niet inspirerend. ￼ Toen kwam echter nog het eindfeest, waar alle helden zich verzamelden om op muziek van gastheer Michel de Hey en zijn vrienden nog een paar uur door te gaan. De sfeer was heerlijk, en ook oude bekenden als Jossie werden weer getroffen. Het grote voordeel van een dag programma, is dat je niet zo laat terug bent, en dus kon er nog uren lang genoten worden van de heerlijke baden die het Bilderberg bood..... Partyscene Report over de FFWD met te downloaden tunes"
