["http://www.ricklindeman.nl/files/1fadb705f1488b06ac9aa0d1a8d2cd8e-314.html"]
title = "Istat | Rome | rick filosofeert"
full_description = "Istat09/12/99 10:01 Opgeslagen in: RomeOm 8 uur wist Rick zich aan zijn lakens te ontworstelen, want hij moest al om tien uur bij het Istat zijn. Wonderwel bleek ook Bas de energie te hebben om een toeristische dag in zijn eentje te ondernemen. Na een busrit vol zakkenrollers arriveerde Rick bij Orbis; dit was het afspreekpunt, vlakbij de Santa Maria Maggiore, waar hij heel toevallig ook de kaartjes voor het voetbal van dinsdag had gehaald.Het Istat is het Italiaanse CBS. We gingen er heen om cijfers over scholen en de economisch activiteiten van onze vijf gemeentes te verkrijgen. Het Istat had niet echt een handig zoeksysteem, maar toch werden bijna alle gegevens via volkstellingen verkregen. Het enige wat we nog misten waren de gegevens over forenzen. Half Latina werkt namelijk in Rome. Hierna werd nog even de Mensa aangedaan voor een interessante Aardappelkroket/Noedel variatie, waarna onze held zijn E-mail kon gaan bij werken. In een rap tempo werden bijna veertig e-mailtjes geschreven. De meeste kerstkaarten bleken al aangekomen te zijn; die Italiaanse post toch.De resterende tijd tot de Italiaanse les werd gevuld door onze veelschrijver met het bijwerken van dit dagboek. Ook Renata en Mireia deden van zich spreken tijdens hun pauze. De les zelf bleek te bestaan uit het lezen van gedichten van Sandro Penna, de dichter waarover we dinsdags die fijne documentaire hadden gezien. Hierna kregen we traktaat over de doodstraf van Monica, waarna wij ons als Europeanen gezamenlijk afzetten tegen de barbaarsheid van gli Stati uniti Om kwart voor zeven stond Bas, die de Sixtijnse kapel had bezocht, op Castro Pretorio. De Go-ers gingen naar Cavour, om een pizza’tje te scoren alvorens hun denksport te beoefenen. Tijdens het eten kregen we de meest walgelijke nepzeemeermin met rode lichtjes op de seni aangeboden. De Go-avond was een aanzienlijk succesvollere expeditie dan de vorige keer. Het publiek, dat naast op Roma-Newcastle natuurlijk ook was afgekomen op het Go, kon in een overvol café zien hoe de Amstelveense delegatie 3 van de 5 partijen wist te winnen. Ook Roma behaalde trouwens succes. Tegen half twaalf verlieten ze het café pm naar het feest af te reizen. Rick was spontaan vergeten dat de metro’s hier links rijden,waardoor ze de laatste metro misten; dit was gelukkig niet zo erg, omdat de bus werd gepakt die eigenlijk nog dichter bij het feest kwam. Op het feest in de Akab was net een coverband begonnen die een Meander-achtig sfeertje wist te creëren. Het patroon van de afgelopen weken herhaalde zich. Er werd gedanst met Catalanen en Renates, gezoend en gesproken met Mireia, die ook nog een serieus gesprek probeerde te beginnen, hoewel het daar niet echt de plaats voor was, en de Italiaanse eigenaardigheden werden besproken met de aanwezige Nederlanders. Zelfs de Fransen waren er."
