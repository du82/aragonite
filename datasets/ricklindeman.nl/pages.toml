["http://www.ricklindeman.nl/files/76e500904fc2ecd309cd17c3fb17a8a3-320.html"]
title = "De ragebol | Rome | rick filosofeert"
full_description = "De ragebol14/12/99 10:15 Opgeslagen in: RomeNadat we tegen twaalven waren opgestaan werd een ontbijt genoten van Toast met Spaanse ham. Ondertussen werden artikelen uit de Volkskrant integraal in het Italiaans vertaald voor de nieuwsgierige Spanjaarden. Om halfdrie vertrok het gezelschap in de Mensa waar ook Judith, Renate en Adria waren. Nadat een ietwat koude Pizza was genuttigd werd het meertalig publiek wat Nederlands onderwezen. Ook bleek tijdens het updaten van adres en e-mail gegevens dat Rick ook vandaag moest feesten. Hij zuchtte om zijn zware bestaan.Thuisgekomen waren Antonio en Beppe er. Laatstgenoemde vertrok al weer snel. Samen met Aurelien maakten de huisgenoten een schoonmaakrooster op de laptop van de Fransen. Antonio bleek naast een oversexte Italiaan ook erg gesteld op hygiëne; hij was dan ook verpleger. Telkenmale herhaalde hij de frase: ‘Tu devi Pulire’. Rick zou vanaf nu trouw zijn schoonmaak diensten volbrengen.De foto-shoot van twee weken geleden had ook nog wat opgeleverd; ons model stond vanaf nu op de guest-list van de Jam. Dit bericht was bij hem thuis achtergelaten. Niet dat hij eerder ooit hoefde te betalen, maar toch. De Jam stond deze avond in het teken van het laatste Erasmusfeest van het millennium. Judith en Mireia werden opgepikt bij het Colosseo. Carolina nam haar huisgenote mee, bekend als ‘La Pelusa’, de ragebol. Het gratis bier smaakte goed, en Rick kreeg ook nog een T-shirt van de Associazione Erasmus, hoewel hij daar niet eens lid van was. Als een beroepssjacheraar, Tim Diehl waardig, gebruikte hij vervalste ID’s om het shirt te bemachtigen. Hij kan nu ook in de kleuren van La Sapienza de straten bewandelen, een uniform een Amsterdam intellectueel waardig."
