["http://www.ricklindeman.nl/files/afb12607c24281a5127cdba8a9d22072-17.html"]
title = "Innercity | rick filosofeert"
full_description = '''Innercity22/12/01 17:04 Nadat we binnen waren, Na eindeloos te zijn gefouilleerd, Begon het. De muziek was in ons. Of het nu Picotto was, of Sven V. We genoten. Rick werd wel wat emotioneel, en miste zijn schatje, Maar hij kreeg een knuffel van een schone dame, En toen was hij weer vrolijk. Toen hij om 8.08 de tram naar huis had, Was hij doodmoe, Maar hij wist: dit was een mooie nacht geweest. © 2005 Rick Lindeman Contact Mevar _rwObsfuscatedHref0 = "mai";var _rwObsfuscatedHref1 = "lto";var _rwObsfuscatedHref2 = ":li";var _rwObsfuscatedHref3 = "nde";var _rwObsfuscatedHref4 = "man";var _rwObsfuscatedHref5 = "@gm";var _rwObsfuscatedHref6 = "ail";var _rwObsfuscatedHref7 = ".co";var _rwObsfuscatedHref8 = "m";var _rwObsfuscatedHref = _rwObsfuscatedHref0+_rwObsfuscatedHref1+_rwObsfuscatedHref2+_rwObsfuscatedHref3+_rwObsfuscatedHref4+_rwObsfuscatedHref5+_rwObsfuscatedHref6+_rwObsfuscatedHref7+_rwObsfuscatedHref8; document.getElementById('rw_email_contact').href = _rwObsfuscatedHref;'''
