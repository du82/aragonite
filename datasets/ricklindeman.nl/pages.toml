title = "Duiken & De Oceaan – Rick Lindeman"
full_description = "Duiken & De Oceaan admin | August 18, 2018 | interesses | No Comments Voor mij is duiken een manier om even te leven in een andere wereld, om even deel te zijn van de natuur. In 2005 heb ik mijn Padi OWD gehaald, in 2016 daarnaast een Shore-Diver en een Turtle Awareness specialty. In 2018 werd ik Advanced Open Water Diver in Egypte. Ook heb ik inmiddels het brevet voor Science of Diving van SSI. Ook ben ik sinds 2023 gecertificeerd onderwater archeoloog. Ik heb gedoken van Indonesië tot Bonaire, het liefste wil ik nu naar het Great Barrier Reef. De Zee Tweederde van onze wereld ligt onderwater. Die hele ontgonnen wereld kennen we nog nauwelijks. Natuurlijk zien we steeds meer, dankzij geweldige series als Blue Planet II. Toen ik meer ging duiken wilde ik er meer van weten, en heb een MOOC in Marine en Antarctische wetenschappen gevolgd aan de universiteit van Tasmanië. Hier leerde ik alles over het Zeeleven, het systeem van de oceaan, de gevolgen van klimaatverandering en welke maatregelen we kunnen nemen. Ik vond het een enorme eyeopener om te zien hoe het dwars door de voedselketen heen vissen soms bizarre resultaten had. Vissen die ineens helemaal geen vijanden meer hadden. Zeeëgels die ineens ruimte kregen om het koraal op te vreten, totdat de Otters steun kregen. Ook de uitwisseling tussen plankton en zooplankton die zorgt voor veel CO2-berging en voedsel onderaan de keten is fascinerend. Zeker omdat die door opwarming en verzuring bedreigd kan worden. Ook leerde ik de wereld van de kwallen kennen in Spineless, een boek over iemand die zichzelf opnieuw uitvond door het bestuderen van ongewervelden. Op Bonaire werkte ik mee met het project van STCB voor het tellen van de diverse schildpadden. Hiervoor haalde ik mijn Schildpadspecialiteit. Bonaire is een soort hangplek voor puberschildpadden uit het noorden van de Caraïben (Cuba, Dominica). Door het project en de gegevens die het oplevert is effectiever conserveren mogelijk. Duiken Hieronder vind je mijn duikavonturen. Op Diviac heb ik een duik-logboek, op Flickr staan mijn duikfoto’s 1. Brazilie Op mijn tweede reis naar Brazilie werd ik warm gemaakt voor duiken door Bart Rikker, een gewaardeerde collega. Het was een tijd van optimisme, de eerste jaren onder president Lula. Na een bezoek aan Nederlandse bedrijven in Sao Paolo en Rio, gingen we zelf op reis. Vanaf Angra dos Reis, bekend van de werf van Verolme, namen we de boot naar Ilha Grande. Hier werd voor het eerst het ruime sop gekozen. Samen met Argentijnse schonen werd genoten van honderden maanvissen 2. Opleiding. Hierdoor geïnspireerd, ben ik mijn zg. Padi gaan halen bij Duikcentrum Mobydick (Nu Pacific Diving) te Nieuwegein. Na vijf duiken en een theorie-examen was ik Open Water Diver. Buiten zwommen we in Vinkeveen. Daar ligt een Bus in het Water. 3. Portugal Hierna kon het grote werk beginnen. Op mijn huwelijksreis werd er een dag gedoken in Portugal, samen een Australiër die Advanced open water diver werd. Vanuit Lagos vertrokken richting Atlantische Oceaan. Centrum Divetime bracht ons onder water. 4. Indonesië De eerste echte tropische duikervaring was in Indonesië. ik heb gedoken bij Lombok (via www.dive-zone.com) en Bali (Bali dive safari). Hieronder een foto van het schitterende wrak van Tulamben. Dit was een wrak, dat jaren op het strand van Bali lag. Bij een uitbarsting van de vultaan Agung werd het in zee gerold door de lava. Hierdoor was het extra vruchtbaar. 5. Menorca De babyvakantie in Menorca werd even onderbroken door een duiksessie, prachtige helder water en een grotduik in de “Swiss Cheese” , met de helden van Son Bou diving 6. Kos Inmiddels een dreumes vakantie, we gingen duiken op de Appolon, de boot van het Liamis duikcentrum. Veel mooie scherfresten en octopussen. 7. Tenerife Een stukje Europees Afrika, was de bestemming van onze vakantie in 2009 . Dat het Afrika was, bleek bij het Wrak van El Condesito, op 17 meter onder de Atlantische Oceaan spiegel. Trompetvissen en Papagaaivissen hadden het in 1970 veroverd. Wannadive was hier het gezellige duikcentrum. 8. Algarve Terug in de Algarve dook ik in een woeste oceaan. Vanaf het stadion van Olhão gingen we met een speedboot de Oceaan op. 9. Madeira In Madeira duik je ook in de oceaan. Geweldig.Ik was er toevallig voor een Civitas Congres. Het ligt ook op de grens van Europese, Afrikaanse en Atlantische platen. Bovendien werd het door zijn plek in de route van Spaanse en Portugese conquistadores een belangrijke punt in de columbian exchange, het uitwisselen van flora en fauna door de ontdekkingsreizen. 10 Bonaire Ik bezocht in 2016 mijn moeder op Bonaire, een van de duikparadijzen van de wereld. Bonaire zo uniek omdat je op veel plekken gewoon zo het water in kan stappen. Ook is het eiland al in de jaren 60 begonnen met het beschermen van het rif. Hier heb ik een opleiding tot Shore Diver (Hoe daal je af, Hoe navigeer je) en tot Schilpad Specialist gedaan. Voor dat laatste moesten we de verschillende typen schilpadden (Groene schildpadden, Hawksbill) tellen, om zo te helpen bij het beschermen van de Schildpadden, bij de STCB. Ik dook via Divefriends Bonaire, aanrader. 11. Egypte Eindelijk had ik eens tijd om een hele week te gaan duiken. Bij Oonas diveclub heb ik daar mijn gevorderdenbrevet gehaald. Ik heb me meer bekwaamd in Navigeren, Fotograferen, Diepduiken, Drijfvermogen en Drift Duiken. Zo leerde ik weer veel over de Zee en haar eigenaardigheden (Waarom stroomt hij zoals hij stroomt). Het mooie van zo’n compacte duikclub is dat je meteen vrienden hebt, het Egyptische bier stroomde vrolijk. Geweldige mensen daar. Vervolgens ging ik 4 dagen op pad op de King Snefro V. Hierdoor konden we dieper de zee in. We doken bij wrakken als de Kingston en de ongelooflijke Thistlegorm. Dit is een soort tweede wereld oorlogmuseum onderwater, vol motorfietsen en auto. En overal was leven. Bovendien kwam deze dolfijn ons opzoeken. 12. Zeeland Door de Corona Crisis ging duiken in Thailand in 2020 helaas niet door. Dus werd het de Grevelingen, het grootste Zoutwatermeer van West-Europa. Ook Zeeland is een waar duikparadijs, zeker nu. Duikschool De Grevelingen leidde me rond in de onderwereld bij Den Osse. We zagen krabben vechten met garnalen. Gigantische mosselsen en Zeenaalden. 13. Aruba In 2020 kon ik gelukkig wel nog even naar Aruba. Waar Bonaire bekend staat om haar ongerepte riffen, is Aruba beroemd vanwege een aantal Wrakken. Daar genoten we van samen met South East Aruba Fly & Drive. 14. Snorkelen in IJsland Wel niet echt duiken, maar toch te mooi om onvermeld te laten. In Silfra kan je snorkelen en duikelen in een rift, vlak bij het oudste parlement ter wereld (Þingvellir) .Met je ene hand kan je dan de Amerikaanse Tektonische plaat aanraken, en met de andere hand de Europese… Een unieke ‘intercontinentale ervaring’ 15. Sint Florianus Jaarlijks wordt een duik gehouden ter ere van Sint Florianus, de patroonheilige van duikers (en brandweermannen en brouwers). Dit is op 4 mei. In 2021 was dit bij het Engelenmeeer, bij Den Bosch. Dramatisch weer en zicht, maar er was wel een speciaal biertje gebrouwen. 16. Lissabon In Lissabon voor een congres kon ik ‘s ochtends duiken in het natuurpark bij Sesimbra. Heftige zee, maar toch even in het water met leuke Marokkaanse mededuikers bij duikclub Cipreia 17. Thailand Hier ging een droom in vervulling. In mijn duik 52 zag ik een Walvishaai. Onwijs indruk wekkend hoe er een hele stad komt aanzwemmen. Dit was op Sailrock, een van de beroemdste duikplekken van Azië 18. Spakenburg. Hier volgde ik de cursus Onderwaterarcheologie en doken we op Botters. Samen met een team van 4 maten we het op, maakten een vlaktekening en probeerden conclusies te trekken. jQuery(document).ready(function($) { $.post('https://ricklindeman.nl/wp-admin/admin-ajax.php', {action: 'wpt_view_count', id: '16'}); }); Related Posts (Retro) Videogames No Comments | Jun 25, 2015 Lindeman & Drank No Comments | Feb 22, 2017 Go No Comments | Apr 15, 2016 Familie No Comments | Jul 19, 2015 About The Author rickthuis"
