["http://www.ricklindeman.nl/files/5ca7dee6f8007c768d41ba01dc466da7-324.html"]
title = "Firenze | Rome | rick filosofeert"
full_description = "Firenze18/12/99 10:21 Opgeslagen in: RomeOm 5.45 ging de wekker om aan de bedevaart naar de stad van Dante te beginnen. Antonio was ook al op en kon dus mooi onze pelgrim naar de metro brengen. Hierdoor was hij wel erg vroeg op Termini. Aldaar realiseerde onze verstrooide professor zich dat hij zijn paspoort op de Via Jenner achtergelaten had. Dit zou later nog gevolgen hebben. Na een Cappucino met Carolina te hebben genuttigd verschenen ook wonderwel Judtih, Israel, en Jorge, allen notoire laatkomers, op tijd, zodat om 8.12 de teein naar de stad van de Medici kon worden genomen.Aangezien het gezelschap geheel bestond uit armlastige studenten, werd niet de Eurostar maar een boemeltje genomen. De trein stopte op vele plekken waar onze hoofdstedelingen geen huis konden ontdekken. Toen Carolina en Rick even voor een Gauloise overwipten naar de rokerscoupé zagen ze bovendien iets heel engs. Aveviamo Paura! Een jongen en een meisje, klaarblijkelijk een koppeltje hadden exact hetzelfde Tommy Hilfigger truitje aan. Ze hadden exact dezelfde bril op; daarnaast bewogen ze ook exact hetzelfde. Bulderend van het lachen zochten onze helden hun eigen coupé weer op.Om twaalf uur kwam de trein aan in Florence om te ontdekken dat de jeugdherberg, dichterbij diegene waar Rick tot ontsteltenis van de aanwezige Engelsen, in 1994 had bewezen dat Groot-Brittannië en Somalië beiden derde wereldlanden waren, tot halfdrie gesloten was. Dus werd de stad ingetrokken. Iedereen viel het op hoeveel schoner Florence was dan Rome. De lucht herinnerde de longen voor het eerst sinds lange tijd eraan hoe zuivere lucht smaakte.Als voorzitter van de Buitenlandse Excursiecommisie van het Groene Hart in 1997 kende Rick de stad al. Masr na twee maanden Rome scheen de stad hem heel anders toe. Florence leek een moderne, bijna West-Europese stad in vergelijking met de Città Eterna. Het Palazzo Vecchio en Brunelleschi’s koeppel van de Duomo waren natuurlijk schitterende als altijd. Toen Rick op de Ponte Vecchio naar de Arno tuurde moest hij denken aan de woorden die Macchiavelli geïnspireerd door deze rivier in ‘Il Principe’ schreef over hoe zelfs grote heerser de omstandigheden niet altijd kunnen beheersen.‘Et assigmiglio quella una di questi fiumi rovinosi che quando si adirano allagna e piani, rovinano gli alberi e gli edilizi. Lievano da questa parte terreno, pongono da quella altra: ciascuno fugge loro dinanz, ognono cede all’impeto, loro sanza potera in alcune parte obstare. E benché sleno così fatti, non resta però che gli uomini, quando sono tempi questi. Non vi potessino fare provedimento e con ripari e con argini.’ (Macchiavelli, Il Principe, Hoofstuk 25) Toen de reizigers na de lunch op de Piazza della Signoria tegen drieën terugkeerden naar de jeugdherberg terugkeerden, troffen ze een vrouw die het woord bureaucratie op haar voorhoofd geschreven had. Ze wilde de Spanjaarden en Holanders zonder paspoort geen onderdak verschaffen. Zou het zo aflopen als n 1997 toen Rick zijn paspoort was vergeten en uiteindelijk bleef slapen bij de lokale mafiabaas van Plovdiv? Deze herbergier wees Rick-Jozef de deur, zoals bijna precies 2000 jaar daarvoor met Jozef en Maria was gebeurt in Bethlehem. Geluk bleek de stroom van het fortuin de Romeinen gunstig gezind. Buiten het Hostel deelde een Pools meisje flyers uit voor een ander Hostel, de Keiko Inn, genoemd naar de Japanse vrouw van de eigenaar. Hier zou het paspoort geen probleem zijn. Dit Ostello was gelegen op het Piazza San Giovanni. Dit bleek het voorplein van de Dom! Het voelde als een huis met twee kamers. Het had geen receptie, maar was goedkoop. We besloten het te vertrouwen, want we zouden meteen de sleutel krijgen. Hierna vertrokken we weer de stad in.Uw schrijver gaat hier niet beschrijven hoe mooi Florence is. Ik kan alleen maar zeggen dat de lezer er heen moet. En dan nog een keer. Dit bezoek was Florence, mede door het jaargetij, weer heel anders. De reizigers liepen langs het Uffizi en het huis van Dante. Ze bewonderden zijn beeld en citeerden zijn werk. Van een Australiër kregen onze hongerige toeristen een tip voor een Pizzeria, die erg lekker en goedkoop was. Ze misten nu wel de beroemde Toscaanse biefstuk. Tegenover het restaurant lag een Ierse pub. Hier werd de avond besloten. Tegen half drie gingen ze slapen. Behalve Israel. Rick merkte om halfdrie ineens op dat het ijzeren hek van het bed boven hem in zijn bed lag. De volgende dag trof hij in dat bed niet alleen Israel aan, maar ook een Australische."
