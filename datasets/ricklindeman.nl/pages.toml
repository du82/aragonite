full_description = "Loveparade 200211/08/02 09:22 Opgeslagen in: Party : ReizenLoveparade 2002 - We were ThereHet meest beroemde house Event ter wereld: De Loveparade. Dit jaar zouden wij er eindelijk heen gaan. Vrienden werden omgetrommeld, en met Jochem, Peter en Wai-Hong vertrokken onze held met zijn gade Celine naar de Duitse hoofdstadAldaar namens zij de intrek in pension Purwins, in het oosten van de stad. Verzorgd door een echte Duitse mama, was dit het bastion waaruit de stad en de parade werden verkend. 's Avonds ondekten ze culinaire genoegens van Mitte. Een van de spannendste stadsdelen na de herenigingDe volgende dag was de dag van de parade. Vanaf de Brandenburger Tor vertrokken zij, om ergens in de avond bij Zoo aan te komen. Heerlijk dansend op DJ Motte en al zijn vrienden, tussen 500.000 man. Access Peace!!!!De volgende dag was meer voor bezinning: een bezoek aan het heiligdom voor Marlène Diettrich: het filmmuseum van Berlijn. Het ligt in het 'neue mitte': de Potsdamer Platz. Dit pelin lag midden in het sperrgebiet van de muur, Erg commercieel, maar best stoer...Tags: Festivals"
