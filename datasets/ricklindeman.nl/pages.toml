["https://ricklindeman.nl/succesroute-voor-uw-mobiliteitsproject"]
title = "Succesroute voor uw mobiliteitsproject – Rick Lindeman"
full_description = "Succesroute voor uw mobiliteitsproject admin | May 22, 2010 | Publicaties | No Comments Dit Artikel verscheen in het mei 2010 nummer van Netwerk Magazine Tien jaar geleden startte het ministerie van Verkeer en Waterstaat met het subsidiëren van mobiliteitsinitiatieven. De laatste jaren gebeurde dat via het programma Mobiliteitsmanagement. Agentschap NL (voorheen SenterNovem), heeft de uitvoering van de subsidies verzorgd. Sinds die tijd is er met de ingediende projecten veel in beweging gezet en veel informatie vergaard. Het programma Mobiliteitsmanagement is inmiddels afgelopen. Maar de opgedane kennis mag natuurlijk niet verloren gaan! In dit artikel schetsen de auteurs daarom tien lessen uit de praktijk. Waar moet u op letten bij het uitvoeren van uw mobiliteitsproject? En wat moet u per se wél en wat beslist niet doen om uw mobiliteitsproject te laten slagen? Les 1: Combineer en vul aan De OV-fiets is eigenlijk niet meer dan een honderd jaar oud vervoersmiddel in een nieuw jasje. Maar gekoppeld aan een laagdrempelig verhuursysteem en een aanbod op de goede plaats voor de goede prijs, is de OV-fiets ineens een essentiële vernieuwing in ons natransport. De beste innovaties in de afgelopen tien jaar gingen vaak niet om vervoersvernieuwingen, maar om het op een slimme manier koppelen of op een andere manier inzetten van bestaande vervoersmiddelen. De kansrijkste innovaties betreffen een nieuwe organisatie of een andere combinatie of inzet van vervoersmiddelen. Zo combineert het Lange Land Ziekenhuis in Zoetermeer het maken van een elektronische doktersafspraak met het regelen van het vervoer. Patiënten die via internet een afspraak maken, kunnen meteen het vervoer ernaar toe regelen. Dit voorkomt drukte op de parkeerplaats en het te laat komen op afspraken. Het ziekenhuis is beter bereikbaar en loopt zo minder vertraging in afspraken op. Les 2: Vergeet uw aanbod, kijk naar de vraag Veel leaserijders willen ook wel eens met de trein, maar mogen niet omdat ze al een leaseauto hebben. Werkgevers vinden het vaak te ingewikkeld en te duur om ook andere vervoerswijzen aan te bieden. Mobility Mixx zag het gat in de markt en sprong erin door voor de werkgever als ‘service provider’ op te treden. De innovatie slaagde, omdat er duidelijk een behoefte aan was. De reiziger wil op een betrouwbare en gemakkelijke manier van A naar B komen. Op welk punt komt hij dan uw innovatie tegen? En wat is op dat moment eigenlijk zijn of haar behoefte? Sluit deze behoefte niet aan bij uw idee? Denk dan nog eens goed over het project na. Carpooldaten bijvoorbeeld is nooit van de grond gekomen, omdat veel innovators onvoldoende weten wat er in de mensen omgaat: angst voor sociale onveiligheid, het bezwaar van de relatief hoge omrijfactor in Nederland en het plezierige gevoel dat mensen beleven aan alleen in de auto zitten. Les 3: Kijk naar het totaal aan activiteiten Het bedrijf Besite bracht het regelen van evenementenkaartjes en het vervoer ernaartoe samen op één website, Tripticket. De reiziger denkt daardoor eerder over zijn vervoer na en regelt dat ook eerder. Het combineren van kaartje, informatie en vervoer levert Besite succes op. U heeft misschien een heel mooi systeem bedacht, maar daarmee bent u er nog niet. Uw project of idee is namelijk maar een klein onderdeel van het geheel. Er is meer nodig om uw project of idee bij de reiziger te brengen. Neem bijvoorbeeld de reisinformatiesystemen. De informatie moet ook verzameld, bewerkt en verspreid worden. In al die processen spelen verschillende partijen een rol. Een goede samenwerking en invulling van al die activiteiten vermeerderen de waarde van uw project en leveren u concurrentievoordeel. Kijk maar naar het voorbeeld van Tripticket. Het omgekeerde is ook waar. Zonder bijvoorbeeld een goed voor- en natransport wordt uw innovatieve OV-project geen succes. Bekijk dus het totaal aan activiteiten dat nodig is om uw project te laten slagen. Waar staat uw project in dit geheel? Wat maakt het zo uniek? Van welke andere zaken is uw project afhankelijk? Hoe kunt u door een goede samenwerking uw product nog waardevoller maken? Zorg voor een goede sterkte-zwakteanalyse. Dan komt u later niet voor verrassingen te staan. Les 4: De openbaarvervoerwereld kent concessies Veel bedrijven hebben ideeën voor mooie OV-diensten. Bij Agentschap NL hebben we vliegende bussen voorbij zien komen en talloze mixen tussen individueel en collectief vervoer. Kennelijk was niet iedereen zich er bewust van dat de OV-wereld werkt met concessies. In Nederland geldt de Wet Personenvervoer 2000. Vervoersautoriteiten geven op basis van een bestek een concessie uit aan een vervoerder voor het verzorgen van het openbaar vervoer in hun regio. Een nieuwe dienst moet daar binnen passen. Los van de vraag of sommige projecten technisch mogelijk zijn en of er een doelgroep voor is, moet gekeken worden naar hoe een nieuw openbaarvervoeridee in de concessiesystematiek past. Als u een nieuw OV-idee heeft, is het dan ook van belang na te gaan of het zou passen in het bestek dat wordt uitgegeven. Het beste is om hierover vroeg met de vervoersautoriteit (provincie/stadsregio) in gesprek te gaan. Les 5: Concessies lopen af Hermes ontwikkelde het busstopinformatiesysteem Infotin (wanneer arriveert de volgende bus) en voerde dit succesvol in in Limburg. Ook in Almere, Eindhoven en Leeuwarden wordt het gewaardeerd. In andere regio’s werden echter net andere eisen gesteld, en kwamen deze Infotins niet goed van de grond. Toen in Limburg een andere vervoerder kwam, verdween ook hier het Infotin. In Nederland worden regionale concessies voor het openbaar vervoer elke vier of vijf jaar aanbesteed. Elk nieuw te ontwikkelen mobiliteitsproject moet binnen de gestelde wettelijke kaders van een concessie voor openbaar vervoer of doelgroepenvervoer passen. En daar zit regelmatig de crux. Innovaties gaan vaak niet door als concessies overgaan naar een andere vervoerder. Een nieuwe aanbesteding kan bijvoorbeeld uitmonden in een andere vervoerder en andere prioriteiten. Vervoerders investeren niet snel in ideeën als de resultaten pas zichtbaar zijn na afloop van de lopende concessie. Ze weten dan immers niet zeker of zij daarvan nog de vruchten kunnen plukken. Bovendien, een project dat in één regio succesvol is, past wellicht niet of moeilijk in een vervoersconcessie elders in het land. Gelukkig wordt bij concessies steeds vaker rekening gehouden met mobiliteitsvernieuwingen. Niettemin blijft het belangrijk aan te sluiten op de (bestaande) standaarden. Zo voorkomt u dat uw innovatieve mobiliteitsproject strandt op de duur van de concessies. Les 6: Weet welke afspraken er zijn en hoe het geld stroomt Millennium Transport International ontwikkelde samen met de bewoners van middelgrote steden als Weert en Hoogeveen een flexibel bussysteem. Deze busjes reden volgens vaste routes zonder haltes. Het project mislukte. De bus-cao bleek niet te passen bij de werkschema’s van de chauffeurs van deze busjes. Ook kon met de bestaande telmethode niet duidelijk worden gemaakt hoeveel extra reizigers deze flexibele stadsbus naast de bestaande stadsbus opleverde. Zo ging een veelbelovend initiatief verloren. Uw openbaarvervoerssysteem kan nog zo fantastisch werken, u heeft een probleem als niet van tevoren duidelijk is of uw systeem past binnen bestaande structuren (naast de cao bijvoorbeeld ook de afspraken tussen provincie en vervoerder). Zorg er dus voor dat uw mobiliteitsproject binnen de bestaande afspraken past en dat uw project ook zonder subsidie kan blijven bestaan. Het maken van zo’n business case vraagt vaak meer creativiteit dan u denkt. Maar er liggen ook veel kansen. Een werkgever kan bijvoorbeeld heel flexibel met de kilometervergoeding omgaan en zelf bedenken hoe hij die besteedt. Het project Trappers speelde hierop in en kwam met een uniek fietsstimulering- en beloningssysteem om het woon- werkverkeer per fiets te bevorderen. Ook op andere vlakken is meer mogelijk. Mensen betalen niet graag voor alleen reisinformatie. Maar als u deze informatie kunt verwerken in een aantrekkelijk aanbod voor evenementenvervoer, wordt deze ‘gratis informatie’ betaalbaar. Zo heeft Tripticket het ook gedaan. Les 7: Verdubbel uw planning Een fietsenstalling als de Velominck werd al in 2001 ontworpen. Maar de eerste werd pas in 2005 geopend. Er moesten namelijk veel vergunningen worden aangevraagd. Ook bleek het proces ingewikkelder dan verwacht. Veel innovators komen uit het bedrijfsleven en zijn gewend snel een idee te ontwikkelen. Maar realisatie en zeker ook het verkrijgen van eventueel benodigde vergunningen kosten tijd. Houd daarom in uw planning rekening met een langere invoertijd. Dit zorgt voor een soepele invoer. Onze ervaring is dat 90% van de planningen te optimistisch is. Maak dan ook een realistische planning. Les 8: Ken uw doelgroep Ontwerpers maken veel mooie hippe fietsen. Vaak zijn deze erg duur. Raptobike werd opgericht door een fervente ligfietser. Hij zag dat de barrière voor anderen om een ligfiets aan te schaffen vaak de prijs en de lange leverduur was. Hij ontwierp een succesvolle, veel goedkopere ligfiets die zich richt op de essentiële onderdelen, comfort en een lage prijs. Deze kon ook nog eens in een week geleverd worden. Dit voorbeeld laat zien dat je goed naar de uiteindelijke gebruikers moet kijken. Ook is het belangrijk dat de partijen die een beslissing moeten nemen om verder te gaan met het project, weten wat ze kunnen verwachten. Dat tonen de vele onderzoeken begin deze eeuw naar de Peoplemovers aan. Iedereen was voor, totdat er betaald moest worden. Het project ging dus niet door. Wat is nu eigenlijk de markt die u aanboort? Weet u wie op uw fietsenstalling of informatiesysteem zitten te wachten? Kunt u dat ook duidelijk maken aan degenen die hiervoor moeten investeren? Kortom, het is heel belangrijk om inzicht te krijgen in wie nu eigenlijk verder moet met uw project, nadat het is ontwikkeld. Les 9: Zorg voor een goede timing! Dertig jaar (!) na het wittefietsenplan ontstonden de OV-fiets en diverse bike sharing-projecten. Zorg dat u op het juiste moment met uw project komt. Ken uw markt, uw doelgroep. Kijk ook naar de technische ontwikkelingen. Ideeën die in het verleden niet zijn aangeslagen, kunnen later wel degelijk succes hebben. Kijk maar naar de publieke fiets. Een idee kan nog zo goed zijn, de tijd of de markt moet er wel rijp voor zijn. Dus speel in op de marktvraag en benut nieuwe technische mogelijkheden zoals locatiebepaling via gsm voor reisinformatiediensten. Les 10: Kijk verder dan de directeur! De gemeente Haarlem ging samen met Bedrijvenpark Waarderpolder de bereikbaarheid van dit terrein aanpakken. Alles leek geregeld, maar er werd weinig gebruikgemaakt van de collectieve vervoersoplossingen die Zero Friction Mobility aanbood. De werknemers stapten niet in. Elk mobiliteitsinitiatief mislukt zonder maatschappelijk of politiek draagvlak. Dat geldt zowel voor de overheid, als het bedrijfsleven. Al is een directeur nog zo enthousiast over bedrijfsvervoer, zijn werknemers kunnen daar heel anders over denken. Staan zij er niet achter, dan mislukt het plan. En al is een afdeling V&V binnen een gemeente nog zo enthousiast over een mobiliteitsoplossing, dan betekent dat nog niet dat er politiek en maatschappelijk draagvlak voor is. Is hier sprake van treinhobbyisme, of heeft de betrokken afdeling echt de macht om iets door te voeren? Kijk dus welke gedragsverandering gewenst is en waarom. Met alleen een plan om kosten te besparen, bent u er niet. Om echt iets te veranderen, heeft u een pakket aan honing- en azijnmaatregelen nodig. jQuery(document).ready(function($) { $.post('https://ricklindeman.nl/wp-admin/admin-ajax.php', {action: 'wpt_view_count', id: '98'}); }); Related Posts Managementboek No Comments | Oct 1, 2017 De Betekenis van Reizen No Comments | Nov 29, 2021 Hollandsche Steden in de Republiek No Comments | Oct 5, 2017 Het NatuurCanvas – Duurzaam Innoveren voor een Robuust Businessmodel No Comments | Sep 11, 2023 About The Author rickthuis"
year_published = 2010
