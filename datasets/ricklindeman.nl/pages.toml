title = "Genitori | Rome, Famiglia | rick filosofeert"
full_description = "Genitori23/12/99 11:36 Opgeslagen in: Rome : FamigliaVandaag zouden mijn ouders aankomen. Na een rustige dag waarin slechts email werd geschreven, spullen aan ex-bewoners werden afgegeven en een echte Italiaanse kersttaart, Pannettone, werd gekocht vertrok onze familie man naar Station Trastevere om daar de trein naar Fiumicino te pakken. Hij ging wat vroeg, omdat hij wist dat er geen treinen gingen 's nachts en hij wilde uitzoeken hoe laat de eerste bus ging. Dat was kwart over één.Iets voor middernacht zag onze Romein zijn Nederlandse familieleden op de bagage staan wachten. Toen dat om half één nog zo was begreep hij dat er iets mis was. Om kwart voor één kwamen i suoi genitori dan ook met het verwachte bericht: de bagage was er niet, maar we konden morgen terugkomen. De bus ging keurig op tijd, maar de chauffeur werkte niet echt mee. Eerst zeuren over de kaartjes. Dan niet willen stoppen op Piramide. Daar kon Rick immers via de tram snel naar huis. Nu moesten we naar Termini, op vervolgens daar de 78 naar Piazza Venezia en daar op nachtbus 44 wachten. Een eerste Cappuccino voor Guustaaf was daar wel mogelijk. dus dat was genieten."
