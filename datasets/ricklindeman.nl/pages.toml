["http://www.ricklindeman.nl/files/3e7d7b24c499d6d066c5fd9e463f3e96-477.html"]
title = "Craxi | Rome | rick filosofeert"
full_description = "Craxi19/01/00 09:19 Opgeslagen in: RomeHet was de dag dat Bettino Craxi StierfDe meest corrupte politicus uit de eerste republiek mocht nu zijn eigen plek in de achtste cirkel van de hel opzoeken. Het was ook de dag dat Rick bij het verlaten van zijn condominium een nieuwe brief uit Barcelona aantrof.Mireia schreef onze engel dat men haar tegenwoordig met een 'brillantezza speciale negli occhi' aantrof en dat ze Ricks twijfels na een relatie 'cosi intensa' wel begreep. Rick nam hierdoor in gedachten verzonken de bus. Aangekomen in la città unìvèrsìtaria schreef hij zijn brieven richting Moskou en 's-Hertogenbosch, waarna hij richting de mensa vertrok. Het verwelkomen van oude bekenden ging verder, daar ook Adria en Chiaro uit het land der stieren warnew treruggekeerd. De les Italiaans bestond voor uit huishoudelijke mededelingen en een verhaal over zigeuners, gekken, forenzen en het vuil van de romeinse metro. Mensen uit Lima, Mexico of Cairo zouden het kunnen begrijpen. Nadat ieder zijn weg had gevonden nam, onze Amsterdammer vervolgens dezelfde metro om thuis op de bank ineen te zakken en het Telegiornale over Craxi uit een te zijn wijden.Tags: Politiek"
