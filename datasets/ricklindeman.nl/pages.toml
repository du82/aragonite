["http://www.ricklindeman.nl/files/9da2ec731f8719140d02dcab29e1083f-422.html"]
title = "Martin Ros | Opmerkelijk | rick filosofeert"
full_description = "Martin Ros21/12/07 09:44 Opgeslagen in: OpmerkelijkGeachte Tros,U heeft mij helaas van de reden beroofd ooit nog naar uw nieuwsshow te luisteren. Waar de rest van de uitzending voor gebrabbel over ditjes en datjes bestaat, met onderwerpen waar de presentatoren niet altijd even goed van op de hoogte te zijn, was de performance van de heer Ros elke keer weer een hoogtepunt in radioland.Nog één keer zullen wij morgen genieten van de begeisterung, van de kennis, van de spirit van Ros. Welke weeë dieren u hiervoor in de plaats gaat zetten weet ik niet precies, maar de kans dat zij een dergelijk monument overtreffen lijkt mij gering. Natuurlijk Ros kon doordraven, maar zoals juist de oude opa zijn kleinzoon kan inspireren met verhalen van vroeger, zo kon Ros ons inspireren tot de aankoop van boeken die wij anders in het grote aanbod geen blik waardig zouden kunnen.Deze analogie gebruik ik natuurlijk niet voor niks. Ros is actief sinds ik bewust radio luister. Hij heeft mijn hele jeugd mede een literaire stem gegeven. En hoewel het enerzijds passend lijkt om, nu mijn smaak op mijn dertigste volgroeid is, afscheid te nemen van een inspirator, is dat niet zo. Want juist nu was ik instaat hem te nuanceren, hem te relativeren, en hem te corrigeren.Mijn vader, levenslang Ros-adept, viert morgen zijn 35ste trouwdag. Op die dag zal ook helaas een stukje van hem sterven. Ik hoop dat Ros net als zijn grote held Coppi zal geniet van zijn tijd met zijn eigen Dame Bianca.Onze laatste hoop is dus nu blijkbaar Interpolis, hoe irritant die reclames ook mogen zijn Hoogachtend,Rick Lindeman"
