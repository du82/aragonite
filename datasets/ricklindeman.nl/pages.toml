["https://ricklindeman.nl/smart-biking-droom-of-het-einde-van-de-fiets"]
title = "Smart biking: droom of het einde van de fiets? – Rick Lindeman"
full_description = "Smart biking: droom of het einde van de fiets? admin | December 9, 2016 | Publicaties | No Comments Dit is de bijdrage die ik publiceerde voor het Colloquium Vervoerplanologisch Speurwerk (CVS) in 2016 De Smart City heeft de afgelopen jaren veel van het discours beheerst. Ondanks dat velen niet de gevolgen kunnen overzien, werden ze enthousiast van visoenen van gelukkige verbonden mensen in een schone stad. Maar wat betekent deze ‘Brave New World’ nu echt? En hoe kunnen we zorgen dat de verworvenheden van het huidige systeem niet verloren gaan in een wereld gedomineerd door Über en Google. Voorbeeld is hiervan natuurlijk de fiets, die als geen ander staat voor de autonomie, voor gezondheid en voor duurzaamheid in deze tijd. Dit roept een aantal prikkelende vragen op.  Hoe past de fiets eigenlijk in de Smart City? Wordt hij vergeten, of zijn er ontwikkelingen te bedenken (Tags, data, apps) die zorgen dat hij juist essentieel is?  Wat is er eigenlijk Smart in de Smart city: het systeem, de reizigers, de verschillende modaliteiten, de informatie? En wat betekenen deze verschillende invalshoeken voor de rol van de fiets?  Ontwikkelingen als zelfrijdende auto’s zorgen straks voor een andere indeling en een andere claim op de openbare ruimte dan nu. Bovendien zullen de verschillende modaliteiten anders op elkaar reageren. (Wat doet een zelfrijdende Über straks op de kruising Van Woustraat/Ceintuurbaan met 300 Amsterdamse fietsers?) Wat voor gevolgen heeft de zelfrijdende auto voor de ontwikkeling van de fiets? In onze – kampvuursessie – bijdrage worden deze vragen onderzocht om de dieper gaande discussie die achter al het technische Smart geweld zit eens verder te onderzoeken. jQuery(document).ready(function($) { $.post('https://ricklindeman.nl/wp-admin/admin-ajax.php', {action: 'wpt_view_count', id: '85'}); }); Related Posts Experimenteren in de keten No Comments | Oct 27, 2013 Hollandsche Steden in de Republiek No Comments | Oct 5, 2017 Leren over de fiets in disruptieve tijden No Comments | Nov 24, 2017 Effectief innoveren in voor- en natransport met oog voor de reiziger No Comments | Oct 26, 2013 About The Author rickthuis"
