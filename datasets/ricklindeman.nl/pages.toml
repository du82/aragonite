["http://www.ricklindeman.nl/files/archive-dec-1999.html"]
title = "Rick filosofeert"
full_description = '''Dec 1999 Rick filosofeert | Jan 2000 | Nov 1999 Capodanno31/12/99 15:10 Opgeslagen in: RomeOp deze laatste dag van het jaar pakte La Repubblica groot uit met een stuk dat Bart het Nederlandse programma "Grande Fratello" had gewonnen. Ze wist nog niet dat ook Italië hierdoor geteisterd zou gaan worden. We bleven op de Nederlandse tour omdat we inkopen gingen doen voor Oliebollen. We waren even de olie vergeten, maar toen kon het grote bakfeest beginnen.Zonder frituurpan is het meten van de temperatuur van kokende olie toch wat lastig, zodat de eerste exemplaren enigszins zwart uit de pan kwamen. De exemplaren daarna konden wel door de beugel, hoewel het natuurlijk de vraag was, wat de traditionele AD oliebollentest er van zou vinden.Ondertussen was Marco met Antonella binnengekomen met een grote hoeveelheid boodschappen. Ook in dit huis zou namelijk een Capodannofeest worden gegeven. Onze gastarbeiders hiewlpen natuurlijk een beetje het huis op orde te brengen. Tegen acht begon dit feestje. De door de gasten meegebrachte dranken smaakten onze helden goed en over de oliebollen wist een Italiaanse kunstenaar uit te roepen dat ze smaakten "Come un Orgasmo" De aanwezige Fransen en Nederlanders waren inmiddels begonnen met dansen en gaven de aanwezige Italo's een lesje in dansen. Vooral de beroemde dans uit Pulp Fiction, waar de vertolking van Travolta en Thurman bleek bij afstak, oogsdte respect. Toen de klok elf uur sloeg vetrokken onze hollanders. naar de Beurs van Rome. Hier zou hun Techno capo danno plaatsvinden. Aangezien het OV toch iets eerder was gestopt dan beloofd bracht de taxi hun vlak voor 12 op de dansplek.De massa begon te tellen en op het moment Suprème bevond Rick zich tussen twee mooie vrouwen die hem een gelukkig millennium zoenden. Het feest kende twee zalen. een hele volle met commerciële muziek en een waar via Satteliet Jeff Mills en Carl Cox speelden. Drank was bizar duur, maar de fles water leidde tot vele ontmoetingen met mooie vrouwen (en helaas ook onhandige Italianen) Na vierwen trok RJ het minder, en werd het kouder en dus werd - na nog een gabber intermezzo- terugreis aanvaard. De 7 kilometer moest nu helemaal per voet worden afgelegd,vanuit het EUR, via Piazza della Radio terug naar Monteverde. Hier zou je normaal nooit komen, maar taxi's waren overbezet, terugrijdend van het volksfeest op Piazza del Popolo. Jasper vond het minder, want hij had niet echt loopschoenen aan. Toen we uiteindelijk thuis kwamen voelde de Twent zich ook minder, met voorspelbare gevolgen. Het was half zeven.Zelfde plaats, ook Jeff Mills, 8 jaar later exact.Shoppen en Trappen30/12/99 14:43 Opgeslagen in: RomeDe ambities om vroeg op te staan werden ietwat gesmoord door de aanwezige Fransen, welk aantal gestegen was tot 6. Steeds wanneer de Twentse midas de douchedeur aanraakte, bleek een Fransman hem aan in onbruikbaar goud veranderd. Ondertussen had de gek nog wel een Athletische prestatie verricht door te gaan hardlopen in Villa Pamphili (9 jaar later een plek waar Khadaffi zijn tenten opsloeg). Hoewel ook daar, zoals hij zelf zei, niet de ware Pantani in hem bovenkwam, doordat hij zich niet gespaard had op het vlakke.Hierna werd een nioeuwe touristische route opgezet. Onze helden konden door de ervaring van dinsdag nu gratis de Domus Aurea in. Nu kon met licht van de schitterende octagonaal genoten worden. Na deze ideale plek voor champignons,deden ze een rondje Thermen van Caracalla, het Lateraan met de hjeilige trappen. Onze helden gingen keurig op de knieën omhoog, al waren ze Quinten uit Mulish 'Ontdekking van de Hemel' zelf. Het laatste stuk was niet te doen, niet door vermoeidheid, maar door de massa pelgrims. De top werd dus maar bereikt via de trappen ernaast.Metro A werd genomen naar de piazza del Popolo, om vanaf daar de Via Corso in te lopen. De creditcard brandde in de zak bij de ex-BEC-penningmeester het zien al dat Valentino en Versace. Thuis was Marco eindelijk gearriveerd met de sleutel van de brievenbus, zodat na zes dagen eindelijk kon bekeken worden welke kerstkaarten zich hadden opgestapeld. De fransen hadden een flesje Pastis geopend, zodat de herinneringen aan Marseille 1997 boven kwamen.Dit was de opmaat tot een filosofische avond, mdie twee café's verder zou eindigen met een wetenschappelijke analyse van de correlatie tussen de hogere condoomprijs in Italië en het aantal keren dat de gemiddelde Mario het deed.Boerenkool en Botten29/12/99 12:55 Opgeslagen in: RomeOnze vakantievrienden sliepen natuurlijk wel uit. Hierna moest onze romein natuurlijk weer het toeristische rondje maken: St Pieter, Spaanse Trappen enzo. Wel zorgde hij ervoor dat er nieuwe elementen in de route werden opgenomen. Naast een excursie over de Via Veneto, werd de crypte der Capucijners bezocht. Deze orde had toen zij naar haar huidige kerk dichtbij Piazza Barberini verhuisden hun doden meegenomen. Dit resulteerde in zalen vol kunst gecreëerd met beenderen. De symbolen en skeletten deden onze helden vol respect rillen. 's avonds werd de Hollandse dis genoten. De boerenkool met worst deed onze studenten eraan herinneren hoe zij drie jaar tevoren de helden op het IJs met een Beerenburg in de hand de helden een hart onder de riem stakenNoodweer en Nero28/12/99 11:53 Opgeslagen in: Rome : FamigliaDe koppen in La Repubblica bevestigden wat wij de hele nacht om ons heen hadden gehoord. Heel Europa werd geteisterd door Noodweer en Rome bleef niet achter. Toch vertrokken we onder een schraal zonnetje richting policlinico om de familie de universiteit te laten zien. Bij het standbeeld van Minerva brak echter de hagel los.Toen we iets voor één bij de rondleiding bij het Domus Aurea, het gouden huisje van Nero, waren gearriveerd leek het echter mee te vallen. Nadat we een aantal zalen waren afgedaald en de eerste fesco's hadden bewonderd sloeg echter het noodlot toe. Het licht viel uit. We voelden de geest van Nero om ons heen waaien. we kregen nog wel nieuwe kaartjes voor overmorgen.De ouders werden na een lichte lunch op de trein naar het vliegveld gezet, waarna onze avonturier eindelijk weer even alleen was. Maar niet voor lang. Ook Rick vertrok naar Fiumicino om daar onze Twentse held op te wachten Zijn vliegtuig arriveerde op dezelfde tijd als het lufthansaluchtschip van zijn ouders een week eerder. toen het beeldscherm steeds positievere tijden aangaf kreeg onze naiëveling hoop dat ze de laatste trein zouden kunnen redden. Tuurlijk - om de Twent te citeren - misten ze de laatste trein op 2 minuten. Ze waren veroordeeld tot een Peroni, om nog enige tijd op een donker Fiumicino te wachten, alvorens de reis naar Monteverde aan te kunnen vangen.Maria Maggiore27/12/99 13:16 Opgeslagen in: Rome : FamigliaHet kerstgebeuren was eindelijk voorbij, dus alles was weer open. We vertrokken aan het einde van de ochtend om - na een collosseum en forumommetje - kaartjes voor het Domus Aurea te kopen. Deze dag was vol, maar voor morgen kon het. De beklimming van de Esquilijn werd als ware Pantani's voortgezet naar de Santa Maria Maggiore, de enige basiliek die Rick nog niet had gezien.Ze was al gesticht in 432 door Sixtus III en vormde Bernini's laatste rustplaats. Na de koffie op het Piazza della Repubblica gingen we naar Flaminio. Hier werd via het DPTU en het Instituto Olandese een wandeling gemaakt door de heerlijke villa Borghese naar de tweelingkerken op het plein van het Volk. De avond werd besloten in een pizzeria met een schitterende klassieke pasta deeg kneed en snijmachine, en schonk een koppige wijn.Lido26/12/99 13:09 Opgeslagen in: Rome : FamigliaOok deze dag zou onze Romein voor gids mogen spelen. Guus kon eindelijk een serieuze opgraving gaan bekijken, We gingen richting Ostia. Eerst werd de San Paolo buiten de muren nog even bezocht, waar onder het toeziend oog van 224 pausen de illussie dat dit multi-purpose tripje vlekkeloos zou verlopen de grond werd ingeboord. We misten de trein. In het schalks opkomende zonnetje werd toen maar een koffie genuttigd, hoewel ook hier weer het principe moest worden uitgelegd, waarom tijdens/na het pranzo nooit Cappuccino mag worden genuttigd. Ostia bleek de afgelopen maand niet veel veranderd, maar er werd natuurlijk een nieuwe dimensie aangegeven nu we dicht bij het huis van Mireia waren. Ook werd onze held toen hij vredig een trekje van zijn Gauloise nam, bovenop een Romeinse ruïni, wreed weggestuurd door een fanatieke beheerder. Het park ging sluiten. De treinreis werd voortgezien naar het nieuwe - Lido di - Ostia, waar we droevig moesten constateren dat de Adriatische kust haar mooiste stranden had moeten afgeven aan de commercia. We konden slechts terecht op een kiezelstrand. Na een broodje vertrokken we van de woonplaats van Rick's toekomstige getuige, naar zijn overheerlijke pasta in Monteverde. Popijopi25/12/99 13:02 Opgeslagen in: Rome : FamigliaDe wekker ging al vroeg, omdat we vandaag de paus wilden zien. We namen het risico van een hele drukke tram door met het openbaar vervoer te gaan, maar gelukkig kende onze planoloog Rome al goed genoeg om een bus te pakken die net iets verder van het vaticaan stopte, maar wel leeg was. Voor de Sint-Pieter werd nog Universiteits en Michelangelo's infectiepreventie kleding aangeschaft, waarna het wachten op de nonnen begon. Om 12.05 was het zover. De paus verscheen op het podium. Na een inleidng over het Giubeleo kwam het Urbi et Orbi. Nederlands kwam al als vijfde taal. Onze kleine delegatie uit het vaderland deed zich zo luid mogelijk gelden, waarna de paus zich kon storten op minder belangrijke talen. Om één uur was hij klaar, waarna Rick - na lunch en geworstel met een telefoonkaart - voor gids kon gaan spelen. Nadat we via de heilige poort de Sinter-Pieter waren binnen getreden, en via de Brug van Hadrianus het Piazza Navona bezochten kwamen we aan bij het Pantheon. Hier wilden de net uit Nederland overgekomen barbaren - slechts een paar meter verwijderd van de officieel lekkerste koffie van Rome bij Sant' Eustachio, koffie gaan drinken bij de MacDonalds. Hierna vertrokken we naar Bernini's Spaanse trappen met als doel vandaar huiswaarts te keren. Op eerste kerstdag reden er echter geen bussen aldaar na het begin van de pomeriggio. Na een bezoek aan Dolce Vita land werd dus maar de taxi naar huis genomen. We zouden bij een Pizzeria in de buurt eten, maar deze was gesloten. In Italië hoort eerste kerstdag echt bij la famiglia. Er werd uiteindelijk als kerst diner Chinees genuttigd - Zij trokken zich niets aan van dergelijke traditiesHeilige Deuren24/12/99 13:47 Opgeslagen in: Rome : FamigliaHet begin van het Anno Santo. Vandaag zouden de Heilige deuren in de Sint-Pieter opengaan. De Lindemannetjes konden zich er echter voorlopig niet mee bezig houden. Na het ontbijt, een staande Cappucho met een Cornetto, en de markt vertrokken ze naar het vliegveld om daar de koffers op te halen. De Lufthansa bleek ditmaal wel in staat het goede te doen en al snel konden we een kopje koffie met koffers gaan drinken. Na de bureaucratie vertrokken we naar de Via Appia. In deze oude buurt was Rick nog niet geweest. Na een wandeling over de muur van Hadrianus, over de oude Via Appia en waar Petrus het "Domine, quo Vadis?" uitriep arriveerden we bij de beroemde catacomben van San Callisto. Deze waren helaas al dicht, maar een 70 jarig pater bleek nog bij de tijd te zijn door ons te wijzen op de site.Nadat we thuis enigszins van deze inspanningen bekomen waren vertrokken we naar Trastevere. Hier had Rick een restaurant gereserveerd voor de maaltijd op kerstavond, en wat voor een. We begonnen met zalm om via een traditionele Spagghetti Carbonara en delicate scampi op een godellijke coupe met likeur uit te komen. Sdit alles begeleid met een heerlijke wijn een een ober die met Mama flirtte.Vlakbij restaurant "Carlo", lag de Santa Maria in Trastevere. Volgens mij de mooiste kerk van Rome, in ieder geval na de 4 basilieken. Hier was de dienst. Een Amerikaan naast ons werd onwel, van de combinatie van kerst in Rome en de wierook. Zijn gezellin schreeuwde het uit. Tegen half twee vertrokken ze naar huis, voor een mooi stukje kerstbrood.Genitori23/12/99 11:36 Opgeslagen in: Rome : FamigliaVandaag zouden mijn ouders aankomen. Na een rustige dag waarin slechts email werd geschreven, spullen aan ex-bewoners werden afgegeven en een echte Italiaanse kersttaart, Pannettone, werd gekocht vertrok onze familie man naar Station Trastevere om daar de trein naar Fiumicino te pakken. Hij ging wat vroeg, omdat hij wist dat er geen treinen gingen 's nachts en hij wilde uitzoeken hoe laat de eerste bus ging. Dat was kwart over één.Iets voor middernacht zag onze Romein zijn Nederlandse familieleden op de bagage staan wachten. Toen dat om half één nog zo was begreep hij dat er iets mis was. Om kwart voor één kwamen i suoi genitori dan ook met het verwachte bericht: de bagage was er niet, maar we konden morgen terugkomen. De bus ging keurig op tijd, maar de chauffeur werkte niet echt mee. Eerst zeuren over de kaartjes. Dan niet willen stoppen op Piramide. Daar kon Rick immers via de tram snel naar huis. Nu moesten we naar Termini, op vervolgens daar de 78 naar Piazza Venezia en daar op nachtbus 44 wachten. Een eerste Cappuccino voor Guustaaf was daar wel mogelijk. dus dat was genieten.Reserveren22/12/99 11:22 Opgeslagen in: RomeOp de zeventwintigste trouwdag van zijn ouders bestond het werk van onze modelzoon vooral uit het voorbereiden voor hun bezoek. Het huis werd goed gestofzuigd, de kamer opgeruimd, de was gedaan.Hierna vertrok hij naar de stad, naar zijn email. Hieruit bleek dat Jasper hoteldebotel verliefd was. Hij zette zich daarna aan een Queeste voor een kado. Het werd uiteindelijk een kalender. Ze hangen zelf immers meestal de meest vreselijke kalenders op het toilet. De gedachte aan de 'spaarpottenkalender' doen bij Rick nog steeds de haren ten berge rijzen.Vervolgens werd Trastevere binnengetrokken om een restaurant voor eerste kerstdag te reserveren. Trastevere is hierin echt de Pijp van Rome dus al snel werd een leuk uitziend restaurant gevonden. We zullen zien of het ook lekker is.De avond werd voor de tweede keer op rij gevuld met telefoon uit Spanje. Was het gisteren Carolina die van alles vergeten was in Rome. Vandaag was het Mireia. Het blijft een mooi gevoel: als Nederlander in Italië gebeld worden door een Spaanse.Inverno e Inferno21/12/99 10:29 Opgeslagen in: RomeHet begin van de winter betekende ook in Rome een koude dag. Het is dan ook niet verwonderlijk dat er in het Italiaans maar één letter verschil zit tussen Inverno (winter) en Inferno (hel). Rick had al dagen de correspondentie met het vaderland verwaarloosd, dus hij trok naar de stad om daar wat aan te doen. De tram voor hem ontspoorde echter, waardoor onze Vvi’er zich plotseling in een File eterna in Trastevere bevond. Rick herinnerde zich wel dat er dichtbij deze plek zich ook een internet café bevond. Het internetcafé was ergens diep in de kelder van een boekhandel. Het was een Linux-systeem, dus R'''
