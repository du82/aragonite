title = "A song about Rick | Opmerkelijk, English | rick filosofeert"
full_description = "A song about Rick01/02/12 13:15 Opgeslagen in: Opmerkelijk : EnglishDineke (@dinadineke)Somebody I probably met only once.In one of the furthest outpostsOf the Go subcultureI was once part of.Or maybe still am.But, as one knows.Social Networks have that strange habit.Of joining up people,Who don’t really know each other.And thus when I saw a tweet.By Pool legend @jtvanderlindeI couldn’t help but press follow.And fresh from Austin, Texas.Or indeed Amsterdam-WestA singer songer-writer appeared.Social-Liberal?Shoe-addict? Phonecover thief?No one knows.But she made this.And that made me feel special.And in these woeful times.That’s just about the best one can hope for…."
