["http://www.ricklindeman.nl/files/archive-dec-2001.html"]
title = "Rick filosofeert"
full_description = "Dec 2001 Rick filosofeert | Jan 2002 | Nov 2001 Innercity22/12/01 17:04 Nadat we binnen waren, Na eindeloos te zijn gefouilleerd, Begon het. De muziek was in ons. Of het nu Picotto was, of Sven V. We genoten. Rick werd wel wat emotioneel, en miste zijn schatje, Maar hij kreeg een knuffel van een schone dame, En toen was hij weer vrolijk. Toen hij om 8.08 de tram naar huis had, Was hij doodmoe, Maar hij wist: dit was een mooie nacht geweest.Oops17/12/01 23:38 Daar stond ze dan, In de Arena. Dansend met haar vriendin in een zwart topje. Ze heette Bernice. Ze deed haar best om de Twent aan die vriendin te koppelen. De vriendin wilde echter niet. Toen ging ze maar dansen, met die Romein. Zij zou lijken op zijn Barcelonese ex. Ja dat zal wel, dacht ze. Maar hij was toch wel grappig. En toen ze weg ging. Gaf ze hem een zoen. 'Oops, dat was op de mond' Fuerteventura12/12/01 17:23 Opgeslagen in: ReizenHet eiland lag rustig in de oceaan. De wind was niet zo hard als de naam deed vermoeden. Rick durde zelfs een dappere fietspoging aan, maar op dat vals plat was de wind toch hard. Sommigen typeerden het als een groot centerparcs. Dat was wel een beetje waar, in die dorpen, gevuld met Engels plebs, maar als je even wegreed, Door het vulkaanlandschap, over de bergen, kwam je in lieflijke dorpjes, als Betancuria en Plajeral, En daar proefde je de wijn en de kaas, en wat nog belangrijker was: de zon scheen! Rosé09/12/01 18:00 Opgeslagen in: ReizenWe zaten aan de kade Hier was het tenminste wel echt We dronken onze rosé En keken uit over een zwemwedstrijd. We wisten nog niet Dat het de volgende dag ging regenen. Ik keek Celine in de ogen. En glimlachte."
