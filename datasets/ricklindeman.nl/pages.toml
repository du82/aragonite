["http://www.ricklindeman.nl/files/archive-feb-2001.html"]
title = "Rick filosofeert"
full_description = "Feb 2001 Rick filosofeert | Mar 2001 | Jan 2001 Bloesjesdag 28/02/01 17:15 Vanochtend was ik trouw vroeg naar de universiteit gegaan. Snel ging mijn Ericsson echter al weer af. Of ik in het zonnetje een kopje koffie kwam drinken. Dat sloeg ik natuurlijk niet af. Het zijn deze dagen weer de bloesjesdagen. De meisjes steken hun nog net iets te witte, doch frisse, ledematen uit korte bloesjes en mijn hormonen spelen weer op. Natuurlijk, ik zal me netjes gedragen, maar oh-oh, het uitzicht is toch eigenlijk te mooi. Zo zaten we net weer schandelijk elk voorbijlopend 'veulen' te beoordelen. Zo word je als nette intellectueel toch ineens weer die puber. Ineens is te begrijpen hoe men in Victoriaanse tijden al opgewonden werd van een ontbloot dijbeen. Als je een hele winter lang niets hebt gezien dan smelt je hart toch? Ik ben wel hard voor mezelf geweest. Ik zit tenslotte nu (2.04 PM) alweer even achter de computer. Alleen god weet hoelang ik het hier nog vol zal houden en weer lekker aan het bier zal gaan. Het is tè mooi weer. Ach, denk ik maar, ik heb een excuus: ik doe inspiratie buiten op voor deze stukjes?.Column gepubliceerd op campusbar.comOvergeleverd aan gekken28/02/01 16:34 Vandaag mocht ik op audiëntie komen. Helaas niet bij de paus, maar bij mijn huisbaas. Het is een echte huisjesmelker in de Rivierenbuurt. Hij is de eigenaar van een aantal panden in de Roerstraat en omgeving. Dus ik ging er op af door de sneeuw.De man deed open. Hij was nog niet helemaal wakker. Het is de zoon van de eigenlijk huisbaas. De man weet ook niet wat hij met zijn geërfde positie moet doen. Hij was gekleed in een jogging pak en was nog niet hersteld van de weedlucht die we af en toe uit zijn huisje ruiken.Er wordt verbouwd bij mij. We denken dat hij ons er eigenlijk het liefst er uit zou willen hebben om de panden te verkopen. Dan kan hij al het geld verbrassen en hoeft hij helemaal niet meer te werken. Voorlopig lijkt hij echter geaccepteerd te hebben dat wij er nog even zitten.Wel moet de ruimte brandveilig gemaakt worden. Na Volendam kan hij zich al helemaal niet veroorloven de aanschrijvingen van het stadsdeel te negeren. En dus stond de man dinsdagochtend ineens met een dikke en een oude bouwvakker voor onze deur. Of ze de keuken er even mochten uithalen.Nu zijn we allemaal bijna afgestudeerd en zullen dan eens in een echt huis gaan wonen. Voorlopig studeren we echter nog en moeten we nog met de grillen van de huisbaas rekening houden. En met zijn bouwvakkers die vanochtend hun simpele wereldbeeld tot vervelens toe aan mij aan het vertellen waren.Beter dan Rome22/02/01 16:44 Opgeslagen in: OpmerkelijkVandaag bleek uit een onderzoek van de Duitse ANWB dat het GVB het op één na slechtste OV bedrijf van Europa is. Alleen Rome is nog slechter. We kunnen dus weer blij zijn met André Testa. Vijf jaar lang krijgt de jonkheer al een megasalaris om ons een op tijd ergens af te leveren.De ADAC, de Duitse zusterorganisatie van onze autolobbyclub, vond dat Amsterdam het laagst scoorde als men keek naar overstapmogelijkheden, informatievoorziening, prijs en frequentie. Dit zijn dus eigenlijk net alle voorwaarden waar een vervoerbedrijf aan moet voldoen lijkt mij. Barcelona won. Toen ik daar was vond ik de metro ook fantastisch. Het hele netwerk is gigantisch uitgebreid toen de Catalaanse hoofdstad de spelen van 1992 toegewezen kreeg. Amsterdam liep deze spelen nou net mis. Dit kwam onder andere omdat men ‘compacte spelen’ presenteerde die maar weinig aan de stad zou veranderen. Wat nu, compacte spelen? Barcelona is nog steeds blij dat ze het anders hebben aangepakt.Rome zou nog slechter zijn dan Amsterdam. Nu heb ik daar een tijdje gewoond. Er waren wel eens wat stakingen, maar meestal bracht Tram 8 me daar keurig op tijd op de Universiteit. Daarmee wil ik eigenlijk Amsterdam uitroepen tot het allerslechtste OV-Netwerk. Laat nu die overbetaalde Bommelfan er maar eens wat aan doen!Alles is weer open19/02/01 16:37 Ik ging net even lunchen op de Dam. Erg leuk hoor. Een lichte maaltijd in een fijne Ierse pub bij de Dam. Om daar te komen was een ander verhaal. Het begon al thuis.Mijn huis ligt al weken overhoop. De muur tussen de gang en de badkamer was gisterenavond ineens weg. Douchen gebeurt ergens op zolder. Je bent blij als je weg mag. Dan is je band natuurlijk lek. Op naar de fietsenmaker. Het eerste rode plastic was al snel zichtbaar. Zand lag overal en ook het geluid van de boor was overal te horen. De Amsterdamse tongval van de fietsenmaker verraadde ook een lichte irritatie, ondanks zijn gebruikelijk cynisme. Dit was slechts het begin. Ik stapte daarna namelijk in lijn 25.Deze reed over de Ferdinand Bol; deze lag open en was half afgesloten. Bovendien reed tram 5 nu ook over deze straat, aangezien de Leidsestraat open ligt. We reden verder over de Vijzelgracht. Deze ligt open. Het Rokin. Het ligt open. Ik stapte uit op de Dam. Mijn gepoetste schoenen zaten meteen weer onder het zand. De Dam ligt namelijk helemaal open! Dit is slechts het begin, want het zijn pas de ‘voorbereidende’ werkzaamheden op de Noordzuidlijn!Er zijn niet elke dag sardientjes08/02/01 16:36 Ik ga eens proberen een aardig stukje te schrijven over de NS. Theoretisch moet dit best kunnen. Ze zijn dat wel uitgeroepen tot slechtste bedrijf van Nederland, maar als ik met ze mee reis, valt het toch meestal mee. Of hebben de criticasters toch gelijk?Vanochtend acht uur. Ik sta op station Zuid-WTC. Ik heb een kop koffie in de hand. De trein in de richting Den Haag wordt mijn plek voor de volgende paar uur. Hij heeft tien minuten vertraging. Ik had een half uur als marge genomen, dus dit viel eigenlijk best wel mee.Toen de trein aankwam, zag de mensen al weer in elkaar gedrukt staan. Gelukkig stapten er een boel uit, maar ik kon natuurlijk nog niet staan. Na Schiphol gebeurde dit wonder wel. Tot Den Haag heb ik gezeten! De trein stond nog wel tien minuten voor het station stil, maar zo als ik al zei: ik had een marge.Zo valt het dus eigenlijk best wel mee met die NS. Natuurlijk, je moet je standaarden vrij laag houden. Luxe en Comfort zul je niet treffen, zeker niet geschreven met een hoofdletter. Een regelmatige reiziger treft wel eens wat ongeluk, maar daar is wel rekening mee te houden. Behalve als je naar Amersfoort en verder moet. Die treinen reden vandaag weer eens helemaal niet. ‘K*T NS’ hoorde ik mensen op schiphol al weer uitroepen…..Vrouwen & Amerika02/02/01 16:35 Deze column schrijf ik een beetje in opdracht van een vriend van me. Laten we hem Peter noemen (nee Peter K., jij bent het niet!). Hij vroeg zich af waarom vrouwen toch vaak complexere problemen hebben waar mannen niet zo stil bij blijven staan. Laten we onze gedachten eens hierover laten gaan.Deze Peter heeft een blonde vriendin. Erg aardig meisje. Nu haat ze mij blijkbaar, aangezien ik samen met de ex van die Peter hem ging opzoeken in een grote Amerikaanse stad. Laten we zeggen Boston. Die ex is erg nuchter Noord-Hollands, dus die betrekken we er nog maar even niet in, maar de blonde vriendin is een verhaal apart.Nu gingen we met een vreemd gezelschap naar Amerika. Er liepen nog al wat interne lijntjes in de groep. Iedereen had wel eens iets met iemand in het gezelschap gehad. De mannen gingen cynisch met die situatie om, hoewel ook in het begin wat ongemakkelijk was.. De blonde vriendin had er wat meer moeite mee. In het reisje kwam er nog een intern lijntje bij. Beide partners hadden ook al wat met iemand anders in de groep gehad. Ook hier werd er door beide geslachten heel anders gereageerd. De verlate vrouw raakte in paniek, haar mannelijke variant vatte het slechts lollig op.De vraag die ik eigenlijk aan de lezer wil stellen is dan ook de volgende: waarom lijkt het of mannen dit soort onhandige situaties het gewoon verstandelijk uitpraten en een beetje scherp met elkaar omgaan, terwijl het andere geslacht het lijkt op te kroppen, waardoor het allemaal weer complexer wordt? Nu sta ik bekend als iemand die zich makkelijk in de situatie van vriendinnen van mij kan verplaatsen, maar toch blijft dit waarom knagen….."
year_published = 2011
