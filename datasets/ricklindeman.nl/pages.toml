title = "Tiesto gangers weerstaan dwerg | Party | rick filosofeert"
full_description = "Tiesto gangers weerstaan dwerg13/12/03 18:06 Opgeslagen in: PartyPhilips P530 Tiesto launch party in the powerzoneOnze dappere helden hadden veel moeite gedaan om de Powerzone te bereiken. Weken lang was er via internet en andere moderniteiten getracht aan kaartjes te komen voor ene Tijs uit Breda. De toppers M. en R. hadden dit uiteindelijk voor elkaar weten te krijgen.Aangekomen op een gezellig industrie terrein bij de spaklerweg moesten onze helden, 16 in getal, toch nog in ene rij staan. Gelukkig klonken al snel de klanken van onze DJ, en nadat we een folder voor een potentiˆ´le flop van Philips in ontvangst hadden genomen, mochten we naar binnen.En daar aangekomen maakte hij het helemaal waar. Hij begon rustig, er was immers ook minder party-ig publiek binnen, om vervolgens de gasten geniepig binnen te leiden in een wereld vol harde Trance.Toen hij klaar was verwachtten onze dappere helden niet dat er veel meer zou komen, maar toen kwam er een dikke dwerg op het podium: Cor Fijneman. Hij draaide verder waar Tiˆ´sto ophield en bezorgde de toppers nog mooie uren."
