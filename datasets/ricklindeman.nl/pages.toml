["http://www.ricklindeman.nl/files/5f6018b4d6daf5a511c841f8fa567f20-313.html"]
title = "Cuba | Rome | rick filosofeert"
full_description = "Cuba07/12/99 10:00 Opgeslagen in: RomeTegen twaalven stonden onze uitgeslapen helden op. Na een mooi ontbijt van gevulde speculaas vetrokken onze bestuursleden naar de stad. Eerst werd de heuvel van het Capitool aangedaan; de trappen van Michelangelo, het beeld van keizer-filosoof Marcus-Aurelius en de Santa Maria d'Aracoeli streden allen om genoemd te worden. We gingen hierna naar het Forum waar een Hawaiiaan, genaamd Will binnen vijf minuten een rondleiding aanbood. Dat werd een half uur in het zonnetje zitten. Op zich ook erg prettig. Hierna begon de tour, waat het leven Ceasar werd gebruikt als leidraad om de gebouwen te beschrijven.Helaas konden ze niet de hele rondleiding afmaken, want Rick moest om half vier bij een Theater Piacenza zijn voor Italiaans. Onze helden kregen een opgeleukte diashow te zien over de dichter Sandro Penna. De Catalaanse helden waren er ook en zo'n donker theater is een aardige plaats om een beetje te spelen met Mireia. Adria nodigde onze Nederlanders intussen uit om mee te gaan naar Lazio Roma - Chelsea. Het was natuurlijk de vijand, maar toch. De provicialen legden uiteindelijk een kleurloze 0-0 op de mat. Forza Roma!Na de wedstrijd gingen onze voetbalfans naar San Callisto, waar afgesproken was met de Catalanen. Rick, Bas en Adria zaten gelukkig met hun Peroni, maar Jorge was moe en vertrok tegen enen. Ook Rick en Bas dachten er tegen enen even over om maar de laatste acht naar huis te pakken, maar op dat moment verschenen Judith, Mireia en Carolina. Aangezien de waard spoedig het publiek maande om maar te gaan slapen, vertrok ons gezelschap, aangevuld met de Madrilenen Manuel en Miguel naar Testaccio. Hier werd een Salsa-pub gevonden. Onze Enrique Iglesias bevond zich al spoedig in een prettige dans met zijn favoriete Catalaanse. Ook Bas bleek een mooi dansgezelschap te hebben gevonden en er zelfs een beetje mee te kunnen communiceren. Om vijf uur was het afgelopen Catalonië sprong in diverse nachtbussen en onze Hollandse jongens aanvaardden de reis te voet. Tegen zessen werd de bedstee bereikt. Tijdens onze tocht brak er een gevecht uit tussen de aanwezige hoeren; er werd gegooid met flessen en gescholden in het Cubaans, wat een glimlach op onze gezichten bracht."
