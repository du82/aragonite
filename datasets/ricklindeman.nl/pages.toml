title = "Awakenings jubilieum | Party | rick filosofeert"
full_description = "Awakenings jubilieum08/04/07 13:58 Opgeslagen in: Party10 jaar Awakenings moest gevierd worden en dus trokken de helden er weer op uit. Rick was erg rustig, door een zware week. Hij genoot vooral van Dave Clarke. Dit was net wat hij nodig had. Als vanouds was de avond begonnen in de Staatsman, na een diner conform Sonja aan de Stichtstraat. Een divers gezelschap weer, Techno-veteranen, verse voorraad uit Limburg en natuurlijk de helden, de vrienden van de schrijver dezes. Goede doelen namen ons op de foto. kijk goed naar Sylvester. Hij zou vlak hierna enigszins tevergeefs of zoek gaan naar de ideale vrouw.De avond was wel zwaar voor sommigen. Zie hier een Twentse en een Limburgse held om een uur of zes.Toch genoot iedereen. Om zeven uur vertrokken ze weer, door mistige boomgaarden, op weg naar een bed...Tags: Awakenings"
