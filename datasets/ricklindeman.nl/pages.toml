["http://www.ricklindeman.nl/files/a25cd95269bf20f531c230bb50c3c6ea-329.html"]
title = "Inverno e Inferno | Rome | rick filosofeert"
full_description = "Inverno e Inferno21/12/99 10:29 Opgeslagen in: RomeHet begin van de winter betekende ook in Rome een koude dag. Het is dan ook niet verwonderlijk dat er in het Italiaans maar één letter verschil zit tussen Inverno (winter) en Inferno (hel). Rick had al dagen de correspondentie met het vaderland verwaarloosd, dus hij trok naar de stad om daar wat aan te doen. De tram voor hem ontspoorde echter, waardoor onze Vvi’er zich plotseling in een File eterna in Trastevere bevond. Rick herinnerde zich wel dat er dichtbij deze plek zich ook een internet café bevond. Het internetcafé was ergens diep in de kelder van een boekhandel. Het was een Linux-systeem, dus Rick mailde dat maar even aan zijn nerd-vriendjes. De avonturen van de afgelopen dagen konden zo in ieder geval worden verspreid naar het verre Noorden. Na teruggekeerd te zijn in het Monteverdiaanse vroeg Antonio of onze vreemdeling niet mee wilde naar de bibliotheek, waar de man uit Foggia iets moest opzoeken voor een rechtszaak waarin hij verwikkeld was. Zoals Virgilius aan Dante zei (Inferno, IV). ‘Andiamo, ché la via longa ne sos pigne’. We reden door de periferia. Hier was al jaren geen planoloog geweest. Het was een jungle van afgesloten straatjes, en filevorming op de raarste plaatsen.’s Avonds kwam Francisco en Charo eten. En aangezien er ook een vriendin van de Fransen was besloot onze Pugliaanse chef maar flink te gaan koken. Antonio maakte een weergaloze maaltijd voor 8 personen. Met veel wijn werd ook dit een mooie avond, vooral ook voor Marco, die ineens met een nieuwe vriendin op de proppen kwam."
