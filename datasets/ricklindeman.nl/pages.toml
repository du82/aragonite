["http://www.ricklindeman.nl/files/archive-jan-2002.html"]
title = "Rick filosofeert"
full_description = "Jan 2002 Rick filosofeert | Feb 2002 | Dec 2001 Triviant07/01/02 17:50 Silvia keek gespannen toe.Paul vroeg zich af of hij nog iets kon manipuleren.Celine bedacht dat die Lambrusco toch eigenlijk wel bocht was.Rick had al drie vragen goed.Nog één goed antwoord, en de prijs was binnen.Celine hield zijn hand vast.Silvia schonk zich nog eens in.En toen klonk het verlossende antwoord.Vier goed, de buit was binnen!Rick kreeg een zoentje van zijn geliefde.Het bleef die avond nog lang gezellig op de Lorrainelaan,met nog wat wijn en wat bier.Paul en Silvia wonnen nog een keer het rummikub.En toen gingen Celine & Rick en Paul & Silvia naar boven.Daar was het vast ook héél gezellig. Zoveel gratie...07/01/02 17:50 Cafe M, diep in de nacht.Al scannende kwam de mooie jonge vrouw binnen zijn bereik.Haar opgestoken lange, kastanjebruine haar, het grijze rokje en het gestreepte topje,gaven haar een gracieus voorkomen.Ook de manier waarop ze zich op de dansvloer etaleerde, had een elegantie die hem kon boeien.En dan die diepe, mysterieuze blik..Toen stond ze ineens voor hem. Kwetsbaar met haar ontblote schouders.De Twent die wist wat hem te doen stond, kon het plots niet meer.De 6e stapavond van de laatste 8 avonden leek hem op te breken.Hij had geen energie meer.Teleurgesteld schoven de twee vriendinnen een paar plaatsen op.Een paar mannen werden nog door het tweetal op hun plek gewezen.Zelfs het laatste nummer voor het licht werd, kon ze niet meer bij elkaar brengen..Ach..het was wel een mooie avond geweest.. Door Jasper T.Nieuwjaar02/01/02 17:05 We reden over een glibberig fietspad, Glad, door IJzel en Sneeuw. Ontweken zoenende Japanners, maar uit eindelijk kwamen we uit waar we heen wilden. Op het tropisch zandstrand werden we nieuwjaar gekust. Rick dronk tevreden een passoa-jus, en wat bacardi, voor dat caraïbische gevoel. Hij zoende zijn Hawaiiaanse prinses, terwijl hij en passant, Nog samen met de ploegleider een twent koppelde aan een paars truitje."
