["http://www.ricklindeman.nl/files/archive-apr-2001.html"]
title = "Rick filosofeert"
full_description = "Apr 2001 Rick filosofeert | May 2001 | Mar 2001 Tegen het vergeten…..25/04/01 17:19 Het is vandaag op de kop af vijftien jaar geleden dat in Wit-Rusland de kerncentrale van Tsjernobyl ontplofte. Nog tientallen jaren zal het gebied er omheen er last van houden..En dat terwijl kernenergie weer Salonfähig dreigt te worden.Het begint langzaam weer te kunnen: vóór kernenergie zijn. De Westerse techniek zou zo veilig zijn. Het gevaar zou miniem zijn. Er worden weer nieuwe centrales gebouwd, bijvoorbeeld in België. De sluitingsdatum van de Nederlandse centrales wordt keer op keer uitgesteld. In Tsjechië wordt een nieuwe kerncentrale gebouwd van bijna hetzelfde type als die in Tsjernobyl.Leren we dan nooit? In een land geteisterd door MKZ en wateroverlast blijven we de kracht van de natuur ontkennen. Ons vertrouwen is zo groot dat we economische belangen bijna altijd laten prevaleren. Het duurde maar een paar jaar voordat de ramp eigenlijk al weer vergeten werd, zoals zich iedereen ook nu veilig waant voor het water…..Vandaag stond in de Belgische krant ‘De Standaard’ het volgende: ‘Oekraïne, Rusland en Wit-Rusland zitten nog eeuwen met de nasleep van de grootste kernramp ooit. Er zijn meer kankers te verwachten. Bij kinderen heeft schildklierkanker zich verrassend snel gemanifesteerd. Vandaag is er voor de opruiming en sanering nog niet één echte oplossing op grote schaal operationeel. Het worden zwarte eeuwen.’Opdat we het maar niet vergeten………………Rick LindemanGepubliceerd op campusbar.comAmerikaanse Ambities 21/04/01 17:12 Volgende week wordt in de Arena de World Bowl finale gespeeld. De Arena zal halfleeg zijn. Het definitieve bewijs dat Europa toch nog niet zo heel warmloopt voor de sport. En dat terwijl de organisatie alles deed om de Admirals in de finale te krijgen. De Admirals zijn het enige team dat al tien jaar meedoet en nog nooit de hoofdprijs heeft gewonnen. Toch zijn ze vrij populair. Er zijn meestal meer dan tienduizend mensen op de tribune. Dat zeggen de Admirals tenminste. Dit jaar wilde de organisatie een sfeervolle finale. Ze plaatsten de finale in Amsterdam en wilden het locale team in de finale. De Admirals mochten als eerste hun spelers kiezen en waren daarom torenhoog favoriet. Ondanks deze beïnvloeding van het spel lijken de Admirals het niet te redden. Zelfs als ze dit weekend winnen zijn ze afhankelijk van het resultaat van andere. Gelukkig kan de NFL Europe dus nog niet de uitslag bepalen. Maar nu zal de Arena slechts gevuld zijn met een paar duizend Spaanse en Duitse fans. De commercie verliest een keertje!Stem toch maar….19/04/01 16:49 Opgeslagen in: AmsterdamHet wordt waarschijnlijk niks aanstaande woensdag. De kans dat er 132.000 Amsterdammers opkomen dagen lijkt miniem. Toch wil ik vanuit mijn kleine hoekje van waaruit ik iets kan zeggen mensen toch oproepen om tegen een stadsdeel binnenstad te stemmen op 25 april.Denk aan het museumplein! Stadsdeel (oud) Zuid en haar amateur-politici waren in staat het nieuwe museumplein op te leveren met gigantisch veel gebreken. Zo konden bussen niet eens in de parkeergarage parkeren en was het gras van Arenakwaliteit. Een stadsdeel is gewoon niet in staat om zo een groot project te organiseren. In de binnenstad zijn er nog veel grotere projecten (NZL, Dam)Denk aan wat bewoners willen! In je eigen hofje wil je rust en dat er niks gebeurt. Een stadsdeel binnenstad zal ervoor zorgen dan het centrum een stuk dorpser wordt. Grote evenementen zullen niet meer plaatsvinden omdat het de rust van de bewoners verstoort.De binnenstad is van ons allemaal. Zij is niet slechts van die paar yuppen die grachtenpandjes hebben. We moeten er allemaal wonen, werken en uitgaan. Het stadsdeelsysteem werkt goed, maar juist niet in de binnenstad. Stem daarom alsjeblieft tegen, omdat we toch allemaal van ons Mokum houden!Rick Lindeman"
