["http://www.ricklindeman.nl/files/00dd1c9a4e9e254082d22f3d7dfd2520-310.html"]
title = "Termini.. | Rome | rick filosofeert"
full_description = "Termini..05/12/99 09:53 Opgeslagen in: RomeOm kwart voor tien was onze vroege vogel al op Termini. Om vijf over zou Bas namelijk aankomen, Rick's eerste gast in het Romeinse. De trein uit Gare de Lyon was een kwartier te vroeg, dus het was maar goed dat Bus H Rick in de zondagse luwte snel naar het station had gebracht. Een echte gast verhoogde het woon-gevoel bij onze Romein. Terwijl Rick toch ook juist weer meer toerist werd, doordat hij nu weer alle hoogtepunten van Rome zou afgaan. Nadat Bas door zijn eerste Cappuccino tot leven was gewekt wilden onze helden naar de Via Jenner gaan om de koffers van de Apeldoorner af te leveren. Onze helden stuitten echter op Piazza della Repubblica op een demonstratie van aanhangers van de Lega Nord, die Padania, het noorden van Italië tot onafhankelijke staat willen uitroepen. Het schoot dus niet op.Mama bleek twee volle tassen aan Bas voor Rick te hebben meegegeven en ook Sinterklaas had aan Rick gedacht. Omlijst door schitterende gedichten werden Rick een Horloge, erg handig in het chaotische Rome en een geschiedenis kalender aangeboden. Rick smikkelde tevreden van zijn Pepernoten. Na de verkorte pakjesavond vertrokken onze Goërs naar de stad. De tram liet ze natuurlijk in de steek zodat ze iets eerder moesten uitstappen. Onze toeristen trokken vervolgens langs la Bocca della Verità, (de mond van de waarheid), over het parcours van het Circus Maximus naar het Collosseum.Hier gingen ze mee met een gratis toer door een Amerikaanse Ed. Deze verhaalde van de overkapping en van keizer Comodus, die maar wat graag zelf voor Gladiator speelde in dit Flavisch Amphitheater. Hierna vertrokken de AI'er en de planoloog naar Piazza Bologna, waar een espresso met tramezzino werd genoten. huis troffen ze een gespannen Miriam, de vriendin van Nicholas die gespannen de score van Roma-Lecce volgde, met op zijn tijd enige vreugdekreetje. Terwijl onze drinkebroeders de eerste fles wijn soldaat maakte wonnen de geelroden uiteindelijk met 3-2.'s avonds trokken de hongerige hollanders naar de pizzeria op de hoek, waar kon worden genoten van een schitterende chocolademousse, die over de tong gleed en terwijl ze daar op lag allerlei spannende dingen uitvoerde met de smaakpupillen. Het leven kan soms zo mooi zijn door hele simpele dingen. Nog vol hiervan werd de dag afgesloten met een discussie over MacBeth met Marco, terwijl een laatste Tuborg naar binnen werd gegoten."
