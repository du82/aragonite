["http://www.ricklindeman.nl/files/archive-apr-2009.html"]
title = "Rick filosofeert"
full_description = '''Apr 2009 Rick filosofeert | May 2009 | Mar 2009 Bril29/04/09 14:05 Bij het verscheiden van iemand die mij heeft leren kijken.. Martin Bril (1959-2009)Dat stukje in de krantDat stond daar ineensIn 1997Ik was net in Amsterdam gaan wonen.Zo vlak bij, maar toch ook zo ver van mijn ouderlijk huis.Ik vond mijn nieuwe thuis in het Parool.Daar rechts, over de hele kolom.Een ware column dus.Een broodjeszaak hier.Een fietstocht daar.Het was mijn levenNet als het uwe.Het was zijn AmsterdamHet was ons Amsterdam.Tags: dode_heldenVulkanen en Trams22/04/09 11:37 Opgeslagen in: ReizenAlle tenerife foto'sEen bericht uit een stukje Europees Afrika, Tenerife. Dat het Afrika was, bleek gisteren bij het Wrak van El Condesito, op 17 meter onder de Atlantische Oceaan spiegel. Trompetvissen en Papagaaivissen hadden het in 1970 veroverd. Duikfoto'sEuropees bleek het ook, maandag in Santa Cruz. Tot grote vreugde van Jens bleek er sinds vorig jaar een tram te rijden. Hij wilde er steeds in "Trein!, trein". Nog even komen er nieuwe projecten op gang. De economische crisis slaat ook hier toe, en de Europese kraan gaat dicht.Verder is het hier Derby dag zaterdag. CD Tenerife is vorig jaar gedegradeed en staat nu voor het eerst sinds jaren tegen UD Las Palmas van het naburige Gran Canaria. De locale kranten staan er vol mee. Tenerife zou de derby met 2-0 winnen.Het resort en het plaatsje er om heen is niet echt iets voor ons (en men probeert ons Timeshare te verkopen), en vandaag -oi- hebben we het ziekenhuis van Los Cristianos mogen verkennen, want Jens was op zijn hoofd gevallen, gelukkig was hij weer heel dapper, en bleek uit de Rontgen dat het goed was. Nog ff zonnen en dan zijn we er weer...(dat laatste is Jens´ nieuwste zinnetje). De laatste dagen was het weer gelukkig super!Vliegtuig Vliegtuig!'''
