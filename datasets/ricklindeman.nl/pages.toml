["http://www.ricklindeman.nl/files/6de3e887d056e61ba27727051b77c7a1-432.html"]
title = "De Straten van Serrekunda | Reizen, Sport | rick filosofeert"
full_description = "De Straten van Serrekunda12/12/02 17:52 Opgeslagen in: Reizen : SportGepubliceerd op de site van het nieuwste schavot van de VolkskrantRick Lindeman, een van de vele talentvolle leden van Club HNS, heeft veel kennisgebieden. Het Gambiaanse voetbal is er een van. Dat hoor je ook niet elke dag!Mooi!Club HNS presenteert:De supercup van GambiaHet was in december 2002.Het stadion doemde op in Bakau, even buiten SerrekundaDe Chinezen hadden voor het stadion betaald,In ruil voor eeuwige visrechten.Gambianen die zelf in hun primitieve bootjes de oceaan opvoeren waren dus eigenlijk in overtreding.De grote trailers in de verder straalden dan ook dreiging uit.Vandaag was dat echter niet belangrijk.Er stond een belangrijke derby op het programma.Wallidan FC speelde tegen Real Banjul om de supercup van Gambia.Beiden kwamen uit de hoofdstad Banjul, het vroegere Bathurst.Wallidan kwam als dubbelwinnaar de wedstrijd binnen en was dan ook huizenhoog favoriet.Onze gids was Wallidan supporter, dus wij automatisch ook.Het Gambiaanse voetbal is niet zo bekendBuurland Senegal stuntte op het WK in 2002,Maar het Gambiaanse voetbal is nog niet zoverWij kennen alleen Ceesay,Held der Tricolores uit TilburgHet stadion was aan één kant uitverkocht.Aan de andere kant leeg.De zon stond hier vol op, 40 gradenEén dag later arriveerden we op Schiphol, bij -10De wedstrijd was bar slecht,Wallidan kwam snel op voorsprongOok door bizarre eigen doelpuntenReal kwam nog gelijkToch was Wallidan onverbiddelijk, 3-2.De pret op de tribune was er niet minder om.Misschien niet even uitbundig als wanneer de nationale Leeuwen spelen,Doch klonk het Wolof ons nooit zo hevig in de oren als toen.De straten van Serrekunda waren nog lang vol van vreugde......"
