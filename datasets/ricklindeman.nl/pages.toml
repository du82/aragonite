["http://www.ricklindeman.nl/files/534d9fb942f0a9f2bba8b0d04967d686-291.html"]
title = "Stem toch maar…. | Amsterdam | rick filosofeert"
full_description = "Stem toch maar….19/04/01 16:49 Opgeslagen in: AmsterdamHet wordt waarschijnlijk niks aanstaande woensdag. De kans dat er 132.000 Amsterdammers opkomen dagen lijkt miniem. Toch wil ik vanuit mijn kleine hoekje van waaruit ik iets kan zeggen mensen toch oproepen om tegen een stadsdeel binnenstad te stemmen op 25 april.Denk aan het museumplein! Stadsdeel (oud) Zuid en haar amateur-politici waren in staat het nieuwe museumplein op te leveren met gigantisch veel gebreken. Zo konden bussen niet eens in de parkeergarage parkeren en was het gras van Arenakwaliteit. Een stadsdeel is gewoon niet in staat om zo een groot project te organiseren. In de binnenstad zijn er nog veel grotere projecten (NZL, Dam)Denk aan wat bewoners willen! In je eigen hofje wil je rust en dat er niks gebeurt. Een stadsdeel binnenstad zal ervoor zorgen dan het centrum een stuk dorpser wordt. Grote evenementen zullen niet meer plaatsvinden omdat het de rust van de bewoners verstoort.De binnenstad is van ons allemaal. Zij is niet slechts van die paar yuppen die grachtenpandjes hebben. We moeten er allemaal wonen, werken en uitgaan. Het stadsdeelsysteem werkt goed, maar juist niet in de binnenstad. Stem daarom alsjeblieft tegen, omdat we toch allemaal van ons Mokum houden!Rick Lindeman"
year_published = 2025
