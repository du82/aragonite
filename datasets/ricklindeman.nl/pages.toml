["http://www.ricklindeman.nl/files/0c9c9608304829e78981d919b6e99a07-308.html"]
title = "Kilkenny | Rome | rick filosofeert"
full_description = "Kilkenny03/12/99 09:45 Opgeslagen in: RomeOp een dag als die donderdag hoort een rustige te volgen en dat gebeurde dan ook. Tegen enen stond Rick op om vervolgens in badjas neer te ploffen tussen het iets actievere franse element van het huis dat hem gelukkig spoedig voorzag van cafeïne en nicotine. Hij knapte wat op door de douche, stuurde een kaartje aan zijn favoriete tante en at wat door de fransen gemaakte pasta. Hierna reisde onze nu weer goedgevulde student naar de universiteit om daar te constateren dat hij de enige was die de moeite had genomen om de les van Garano te volgen. Dit was misschien een keertje goed, want nu was alle aandacht op onze Amsterdammer gericht en kon Rick uitgebreid vragen wat nu eigenlijk de bedoeling van het vak was. Het onderwerp van de dag was de vraag waarom Italië niet in staat is de 40 miljard Euro EU subsidie te besteden. Niet toevallig gebeurde dit op de dag dat de waarde van de eenheidsmunt voor het eerst onder die van de Dollar daalde.Thuisgekomen had Rick niet echt veel energie meer en was van plan de avond rustig door te brengen. Beppe vertrok definitief naar Foggia. Hij zou gemist worden. Tegen tienen vroegen de Fransen of onze held meewilde naar hun Ierse pub. Deze pub heette Finneghan’s en lag bij de Via Cavour. Deze leek nog redelijk op een echte dwz. Amsterdamse Ierse pub, hoewel ook hier het licht veel te fel was.O’ Lindeman bestelde zijn vertrouwde Kilkenny en begon met wat Engelsen te praten over het failliet van het Verenigd Koninkrijk. Nicholas en Aurelio, Frankrijks’ glorie, waren ondertussen begonnen aan een partij pool tegen een aantal Italianen. Deze konden er gelukkig nog minder van dan de mannen uit het land van Anquetil en een overwinning was dan ook het gevolg. Tegen tweeën verlieten de bewoners van de Via Jenner de pub, om na het ontwijken van een dronken Engelsman de laatste 8 te pakken."
year_published = 2025
