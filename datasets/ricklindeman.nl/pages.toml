full_description = "Jan 2008 Rick filosofeert | Feb 2008 | Dec 2007 The love of football26/01/08 17:26 Opgeslagen in: Sport : EnglishThere is obviously no greater game in the world than football. The passion, the bitter rivalries, the hate, the plain dumbness, the eternal discussions.. and what better way to go into a stadium. So who still does this? And even further has gone to strange matches, lets talk about it in this.. Read More...Tags: AjaxBla Bla21/01/08 08:50 Opgeslagen in: PartyEen mooi alternatieverig house feestje verraste ons. Na indrinken in de Feijoa op de Vijzelstraat/Reguliersdwars lieten we ons verrassen. Een aanrader.Alle foto'sBlaBla pagina op PartyflockVerzamelde toppersMooie DamesXbox 36021/01/08 08:36 Opgeslagen in: GamesOké, ik kon me niet beheersen en heb toch een Xbox gekocht, vooral op Sensible World of Soccer te kunnen spelen, waar ik ooit nog eens een NK voor heb georganiseerd. Gieronder mijn gamertags, meer Friendcodes voor Wii en DS hier RomanistaCeline is Taart21/01/08 08:33 Opgeslagen in: OpmerkelijkCeline nam afscheid van haar werk, en werd vereeuwigd in taart!Suske en Wiske16/01/08 10:59 Opgeslagen in: WerkEen nieuwe uitvinding van het team van de Zuinigste Rijder, Het gouden Gaspedaal. Dat is echt net een Suske en Wiske titel, dus: Read More...Nieuwjaarsborrel 200716/01/08 10:58 Opgeslagen in: WerkNet als twee jaar geleden leverde de nieuwjaarsborrel van SenterNovem weer vrolijke foto's op Read More...Tweede van heel Amsterdam16/01/08 10:55 Opgeslagen in: SportOke, het is maar voor een week, maar jee! Tweede plek in het algemeen week klassement van het Parool voetbalspel Dreamteam. En natuurlijk een plek om hulde te brengen aan dreamteamkoningin Karina, die ons wekelijks de uitslag bezorgd. Read More...Vakantietje in Renesse13/01/08 11:06 Opgeslagen in: ReizenMet de Schoonouders naar de Soeten Haert in Renesse, (foto's) Read More..."
