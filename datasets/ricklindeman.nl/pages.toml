["http://www.ricklindeman.nl/files/57d7f6b2b5da68c205acb9d6692732cc-1.html"]
title = "Dancevalley | Party | rick filosofeert"
full_description = '''Dancevalley15/08/05 17:19 Opgeslagen in: PartyDancevalley 2005Dancevalley 2005 was een modderig maar heerlijk feest. Juist omdat het weer zo wisselvalligwas ontstond er een "I survived dancevalley'05 sfeertje. 's Avonds zijn we nog naar een afterparty geweest. Deze rare column werd daar over geschreven.Ook was de recensie van het feest nogal eenzijdig, vandaar deze gepubliceerd ingezonden brief in de volkskrant.Geachte Volkskrant, Hoewel ik met genoegen uw recensie van Dancevalley las, vond ik toch dat de regen wel heel erg de nadruk kreeg. Juist doordat die er was was het net iets minder druk, en ontstond er een 'we survived Dancevalley'05' gevoel, wat bij de meesterlijke optredens van JP en Carl Cox tot een uitzinnige sfeer leidde. Er wordt wel verwezen naar de witheid van het hardstyle-publiek, maar niet naar het feit dat house juist meer en meer een kleurrijk publiek lijkt aan te spreken; waar anders in Nederland zie je zoveel Marokkanen en Nederlanders een grote duim naar elkaar opsteken? De commercialiteit werd genoemd, maar er waren juist weer goedkopere biertjes, en het hele busstation dat gebouwd werd voor een goede doorstroming maakte zelfs op mij als planoloog een grote indruk. Het was een heerlijke dag en dat mijn wasmachine overuren moest draaien, dat mocht de pret niet drukken.Rick Lindeman'''
year_published = 2025
