["http://www.ricklindeman.nl/files/61eb91bbc8945c6238b503105437a1ca-129.html"]
title = "Amerikaanse Ambities   | rick filosofeert"
full_description = "Amerikaanse Ambities 21/04/01 17:12 Volgende week wordt in de Arena de World Bowl finale gespeeld. De Arena zal halfleeg zijn. Het definitieve bewijs dat Europa toch nog niet zo heel warmloopt voor de sport. En dat terwijl de organisatie alles deed om de Admirals in de finale te krijgen. De Admirals zijn het enige team dat al tien jaar meedoet en nog nooit de hoofdprijs heeft gewonnen. Toch zijn ze vrij populair. Er zijn meestal meer dan tienduizend mensen op de tribune. Dat zeggen de Admirals tenminste. Dit jaar wilde de organisatie een sfeervolle finale. Ze plaatsten de finale in Amsterdam en wilden het locale team in de finale. De Admirals mochten als eerste hun spelers kiezen en waren daarom torenhoog favoriet. Ondanks deze beïnvloeding van het spel lijken de Admirals het niet te redden. Zelfs als ze dit weekend winnen zijn ze afhankelijk van het resultaat van andere. Gelukkig kan de NFL Europe dus nog niet de uitslag bepalen. Maar nu zal de Arena slechts gevuld zijn met een paar duizend Spaanse en Duitse fans. De commercie verliest een keertje!"
