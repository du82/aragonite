title = "Alea Iacta Est | Sport | rick filosofeert"
full_description = '''Alea Iacta Est06/08/09 10:02 Opgeslagen in: Sport"Cesar triomfeert in Romeins bad"Het was de kop in de sport die me brak,In de ooit zo roomse VolkskrantMeer nog dan de hommage aan Michaël zelf, enige pagina's ervoorWant juist daar vlakbij, op het forum van Mussolini.Zette ik mijn eerste stappen, in mijn toekomstige woonplaats.Hoewel een lauwerkrans bij de vorm van zijn hoofd paste.Krijg ik meer een van hem, als iemand die woekeraars wegjaagt uit de tempel.Wat was ik blij dat juist hij correspondent werd in mijn geliefde Rome.Wie anders kon verslag doen van de kwetsbaarheid, van de diepe ziel van de eeuwige stad,Maar die toch ook de moderne cultuur van de straten wist op te vangen. Ooit zag ik in het theater op het Largo ArgentinaEen opvoering van Macchiavellis MandragolaOver de beperkingen van de mensheid.Ik dacht even dat hem de hoofdrol zag spelen,Als vertolker van een eeuwenoude boodschap.Tags: dode_helden, Rome'''
