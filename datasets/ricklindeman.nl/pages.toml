["https://ricklindeman.nl/rome-en-as-roma"]
title = "Rome en AS Roma – Rick Lindeman"
full_description = "Rome en AS Roma admin | February 22, 2017 | interesses | No Comments Op mijn 22ste vertrok naar Rome om daar de studeren aan de Architectuur faculteit van de Università la Sapienzà. Hij woonde daar in Monteverde , aan Lijn 8. Ik ontdekte naar de Eeuwige stad, en eigenlijk ook mijzelf. Rome zat vanaf toen in mijn hart. En die liefde is nooit gestopt. Ik ben momenteel voorzitter van de Nederlandse AS Roma fan club “Romanisti Olandesi” De Universiteit Dante (1265-1327) haatte Paus Bonifatius VIII (1295-1303). Dat is altijd een goed teken. Het was dan een grote paus. Natuurlijk, hij was corrupt, deed aan vriendjespolitiek en hij heeft zijn voorganger, Celestinus V, heel subtiel tot aftreden gedwongen. Zijn plaats in de 8ste cirkel van het Inferno was dan ook wel verdiend. Hij stichtte echter ook de Università degli studi di Roma ‘La Sapienza’ in 1303. Het was niet de eerste universiteit in Europa; Bologna bestond al ruim honderd jaar en ook de Sorbonne was al beroemd, noch de beroemdste, maar in het pauselijke Rome wist het toch zijn plaats af te dwingen. Toen Rome na de hereniging van Italië (1871) weer tot de grootste stad van het land uitgroeide, groeide de Studium Urbis ook uit tot de grootste Universiteit. Op dit moment heeft de grootste universiteit van West-Europa 162.000 studenten en is een staat in een staat, met zijn eigen pers, zijn eigen mafia en zijn eigen moorden. Lasciate ogne speranze, voi ch’intrate, laat alle hoop varen, u die binnentreedt, liet Dante op de poort van zijn hel spijkeren en dat geldt zeker voor deze Universiteit. Bureaucratie en Chaos zijn de toverwoorden. Toch blijkt zoals in heel Italië de toestand hopeloos, maar niet zorgwekkend. Goed, de gemiddelde leeftijd van de afgestudeerden, als ze het al afmaken, is dertig en veel interactief onderwijs is ook niet waar te nemen. Toch functioneert de universiteit, tegenwoordig opgejaagd door twee kleinere Romeinse universiteiten, de Politecnico en Rome Tre, al zevenhonderd jaar. En ergens in die poel des verderfs heeft ook de Architectuurfaculteit zijn plek gevonden en binnen deze facoltà is ook een klein instituut dat Planning onderwijst. Voorgezeten door de Sigaren kauwende tweeling Maurizio en Stafano Garano is het Dipartimento di Pianificazione Territoriale e Urbanistica een bescheiden instituut op de oude uitvalsweg de Via Flaminia. AS Roma In Rome groeide ook zijn liefde voor AS Roma. Toen hij net binnen was bezocht hij Roma-Cagliari, een stadion ervaring die hij niet meer zou vergeten. La Roma, non si discuti, si ami! De meeste van zijn Romeinse vrienden waren ook voor AS Roma. Ook in Monteverde leefde Roma, uitwedstrijden werden met de hele buurt in het café van Maurizio en zijn broer in de Via Jenner gekeken. Emoties liepen hoog op. Sindsdien kom ik om de zoveel tijd terug voor wedstrijd, Roma-Sampdoria in ’04, Roma – Palermo in ’11 en Recent Roma-Lazio, de stadsderby van de hoofdstad. Luigi, mijn enige Lazio vriend lokte me nog (via mijn liefde voor metro-lijnen, het was bij het nieuwe station Libia) naar een Lazio-kroeg, maar niets weerhield ons de twee geweldige goals van Totti te zien en daarna zijn Selfie. In 2016, bij PSV-Roma in the Uefa Youth Series, ontmoette ik een nieuwe groep Nederlandse Roma fans. Dit groeide uit tot een officiële fanclub van meer dan 40 leden , waar ik nu voorzitter ben. Feed has no items. jQuery(document).ready(function($) { $.post('https://ricklindeman.nl/wp-admin/admin-ajax.php', {action: 'wpt_view_count', id: '96'}); }); Related Posts Lindeman & Drank No Comments | Feb 22, 2017 Het is Koers! No Comments | Aug 18, 2015 Go No Comments | Apr 15, 2016 Familie No Comments | Jul 19, 2015 About The Author rickthuis"
