["http://www.ricklindeman.nl/files/97e4a18833e894ab3314c4a358c20b5f-529.html"]
title = "Pompei | Rome | rick filosofeert"
full_description = "Pompei03/01/00 13:20 Opgeslagen in: RomeGewekt door de Japanners die nog voor het rijzen der zon zon opstonden vertrokken onze helden alvroeg om naar Pompei te gaan. Op Napoli Mergellina, een oude Rococo station, dat omgebouwd was tot station in een van de weinige metrolijnen die in Napels wel voor de voor de Eeuwisseling gebouwd werden. De metro bracht ons door een oude tunnel naar Piazza Garibaldi. Hier stapten we in de Circumvesuvio, de regionale trein naar Pompei. Samen met de Aanwezige Argentijnse Aristocratie ontdekten we dat de opgravingen toch een overstap nodig hadden.Even later slenterden we door de straatjes van Pompei/. op sommige momenten kon je de angst van de mensen die uit de slagerijen renden, van het Forum vluchtten of uit de Tempel schreeuwden voelen. Op andere momenten verbaasde je je over de pornografische fresco's."
