title = "WK Sensible Soccer – Rick Lindeman"
full_description = "WK Sensible Soccer admin | November 2, 2016 | Projecten | No Comments In 2016 organiseerde ik met Colin Roll het WK Sensible Soccer. Sensible Soccer is een voetbalspel voor de Commodore Amiga uit 1992. Er is nog steeds een actieve internationale community die het spel speelt en jaarlijks ergens in Europa een WK speelt. Zij nemen dit heel serieus en dus werd dit uiteindelijk een groot project. In augustus 2016 kwamen uiteindelijk zo’n 70 topspelers vanuit heel Europa naar het WK in Twente. Er waren 4 toernooien, een programma boek, veel bier en nog veel meer. We haalden er de locale pers mee, als Tubantia, maar ook internationale pers als Vice wist ons te vinden. Niet is mooier dan mensen van hun passie te zien genieten. En door zo’n groot toernooi te organiseren, maakten we dat mogelijk. Op http://ss16.streeksoft.nl is nog de site te vinden. De finale is hieronder te bekijken jQuery(document).ready(function($) { $.post('https://ricklindeman.nl/wp-admin/admin-ajax.php', {action: 'wpt_view_count', id: '171'}); }); Related Posts Faciliteren No Comments | Aug 18, 2015 Duurzaamheid en Beter Benutten No Comments | Aug 15, 2017 Fietsen bij RWS No Comments | Aug 12, 2017 Presentaties No Comments | Jan 2, 2017 About The Author rickthuis"
