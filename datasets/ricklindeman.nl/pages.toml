["http://www.ricklindeman.nl/files/86bcd408359cada3af681d8d13dc529f-531.html"]
title = "Shoppen en Trappen | Rome | rick filosofeert"
full_description = "Shoppen en Trappen30/12/99 14:43 Opgeslagen in: RomeDe ambities om vroeg op te staan werden ietwat gesmoord door de aanwezige Fransen, welk aantal gestegen was tot 6. Steeds wanneer de Twentse midas de douchedeur aanraakte, bleek een Fransman hem aan in onbruikbaar goud veranderd. Ondertussen had de gek nog wel een Athletische prestatie verricht door te gaan hardlopen in Villa Pamphili (9 jaar later een plek waar Khadaffi zijn tenten opsloeg). Hoewel ook daar, zoals hij zelf zei, niet de ware Pantani in hem bovenkwam, doordat hij zich niet gespaard had op het vlakke.Hierna werd een nioeuwe touristische route opgezet. Onze helden konden door de ervaring van dinsdag nu gratis de Domus Aurea in. Nu kon met licht van de schitterende octagonaal genoten worden. Na deze ideale plek voor champignons,deden ze een rondje Thermen van Caracalla, het Lateraan met de hjeilige trappen. Onze helden gingen keurig op de knieën omhoog, al waren ze Quinten uit Mulish 'Ontdekking van de Hemel' zelf. Het laatste stuk was niet te doen, niet door vermoeidheid, maar door de massa pelgrims. De top werd dus maar bereikt via de trappen ernaast.Metro A werd genomen naar de piazza del Popolo, om vanaf daar de Via Corso in te lopen. De creditcard brandde in de zak bij de ex-BEC-penningmeester het zien al dat Valentino en Versace. Thuis was Marco eindelijk gearriveerd met de sleutel van de brievenbus, zodat na zes dagen eindelijk kon bekeken worden welke kerstkaarten zich hadden opgestapeld. De fransen hadden een flesje Pastis geopend, zodat de herinneringen aan Marseille 1997 boven kwamen.Dit was de opmaat tot een filosofische avond, mdie twee café's verder zou eindigen met een wetenschappelijke analyse van de correlatie tussen de hogere condoomprijs in Italië en het aantal keren dat de gemiddelde Mario het deed."
