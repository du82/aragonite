title = "Twitter volgers | Opmerkelijk | rick filosofeert"
full_description = "Twitter volgers10/02/12 20:18 Opgeslagen in: OpmerkelijkIn navolging van @dinadinekeEen versje over mijn 256ste volger.Daar ik niet kan zingenEen gedichtje….----2^8 volgers...Eerst was er BriannaEen Amerikaanse schoneDie toch niet echt bleek.Ze verdween zo snel uit twitterDat ik niet eensHaar foto kon reddenUit de vergetelheid.Maar toen was er Martin Duits.Een collega.Die ik al lang ken,Maar toch ook weer niet zo goed.Het MKB is zijn passie.Innoveren zijn missie.En om dat te doen.Maakt zijn Gijs een tekeningMaxime retweet hij vaak.Is de jezuïet zijn messias.Of zorgt hij voor de bitterballenIn zijn groep op Linked in.En na als dit werkIs het misschien niet zo gekDat volger 2^8+1Een boodschap in zich had.„@neemonslag volgt uw op twitter”Was het begin van mijn werkweek."
