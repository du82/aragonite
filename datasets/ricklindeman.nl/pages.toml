["http://www.ricklindeman.nl/files/8f716aa4dee54eef6e1dde1ff6a90b57-537.html"]
title = "Lido | Rome, Famiglia | rick filosofeert"
full_description = "Lido26/12/99 13:09 Opgeslagen in: Rome : FamigliaOok deze dag zou onze Romein voor gids mogen spelen. Guus kon eindelijk een serieuze opgraving gaan bekijken, We gingen richting Ostia. Eerst werd de San Paolo buiten de muren nog even bezocht, waar onder het toeziend oog van 224 pausen de illussie dat dit multi-purpose tripje vlekkeloos zou verlopen de grond werd ingeboord. We misten de trein. In het schalks opkomende zonnetje werd toen maar een koffie genuttigd, hoewel ook hier weer het principe moest worden uitgelegd, waarom tijdens/na het pranzo nooit Cappuccino mag worden genuttigd. Ostia bleek de afgelopen maand niet veel veranderd, maar er werd natuurlijk een nieuwe dimensie aangegeven nu we dicht bij het huis van Mireia waren. Ook werd onze held toen hij vredig een trekje van zijn Gauloise nam, bovenop een Romeinse ruïni, wreed weggestuurd door een fanatieke beheerder. Het park ging sluiten. De treinreis werd voortgezien naar het nieuwe - Lido di - Ostia, waar we droevig moesten constateren dat de Adriatische kust haar mooiste stranden had moeten afgeven aan de commercia. We konden slechts terecht op een kiezelstrand. Na een broodje vertrokken we van de woonplaats van Rick's toekomstige getuige, naar zijn overheerlijke pasta in Monteverde."
