["http://www.ricklindeman.nl/files/archive-apr-2000.html"]
title = "Rick filosofeert"
full_description = "Apr 2000 Rick filosofeert | May 2000 | Mar 2000 Het ros is waarlijk opgestaan07/04/00 09:05 Opgeslagen in: OpmerkelijkHet was in die dagen dat ze in Jeruzalem het heilig jaar vierden. De gezalfde zette zijn fiets neer aan het plein van de ontzetting om een Bossche schone te ontmoeten. Hij ging weder, maar trof zijn gewielde ros aan met een ietwat bochtige voorkant. Later in dat jaar was hij op het feest dat de Zeeuwen vierden op de geboortedag van de heilige Joyce. Ze zat er zelf, met een stralenkrans rondom haar hoofd. Ze trokken de stad in. In het beloofde land der Zeeuwen was het wiel echter nog maar net uitgevonden en zowel St. Joyce als het ros van de gezalfde waren aan het einde van de avond, toen de pelgrims naar huis trokken uit de afgekoelde plek in het hart van Mokum er niet goed aan toe. St Joyce stond tijdelijk bekend als de blinde heilige en het ros van Hem als de gebochelde.Iets na het feest van de heilige Nicolaas, maar nog voor het feest van die andere messias, trok Hij met zijn apostelen wederom er op uit. Hij was niet zo snel, aangezien het ros langzaam maar zeker tot op de velg afgestorven was.En op de berg Golgotha, bij de Kruising van het bergpad dat als een ceintuur om die heilige berg heen loopt en de weg die schilders en snacks verenigd kwam het einde voor het Ros, midden in een winternacht.Een paar dag later liepen de apostelen naar Emaus. Zij zagen daar ineens de messias weer op zijn ros. Zij herkenden het ros eerst niet, daar zij meenden dat het gestorven was. Wat bleek echter, het had wat sestertiën en zelfs een gouden darius gekost, misschien wel een meier, zoals het in die oude Joodse taal heet. Maar..het Ros was Waarlijk opgestaan!"
