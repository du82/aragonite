["http://www.ricklindeman.nl/files/21c8e8a9dd7390f76b4664e8778bc7bf-281.html"]
title = "Er zijn niet elke dag sardientjes | rick filosofeert"
full_description = "Er zijn niet elke dag sardientjes08/02/01 16:36 Ik ga eens proberen een aardig stukje te schrijven over de NS. Theoretisch moet dit best kunnen. Ze zijn dat wel uitgeroepen tot slechtste bedrijf van Nederland, maar als ik met ze mee reis, valt het toch meestal mee. Of hebben de criticasters toch gelijk?Vanochtend acht uur. Ik sta op station Zuid-WTC. Ik heb een kop koffie in de hand. De trein in de richting Den Haag wordt mijn plek voor de volgende paar uur. Hij heeft tien minuten vertraging. Ik had een half uur als marge genomen, dus dit viel eigenlijk best wel mee.Toen de trein aankwam, zag de mensen al weer in elkaar gedrukt staan. Gelukkig stapten er een boel uit, maar ik kon natuurlijk nog niet staan. Na Schiphol gebeurde dit wonder wel. Tot Den Haag heb ik gezeten! De trein stond nog wel tien minuten voor het station stil, maar zo als ik al zei: ik had een marge.Zo valt het dus eigenlijk best wel mee met die NS. Natuurlijk, je moet je standaarden vrij laag houden. Luxe en Comfort zul je niet treffen, zeker niet geschreven met een hoofdletter. Een regelmatige reiziger treft wel eens wat ongeluk, maar daar is wel rekening mee te houden. Behalve als je naar Amersfoort en verder moet. Die treinen reden vandaag weer eens helemaal niet. ‘K*T NS’ hoorde ik mensen op schiphol al weer uitroepen….."
year_published = 2011
