["https://ricklindeman.nl/ab-urban-condita"]
title = "Ab Urban Condita – Rick Lindeman"
full_description = "Ab Urban Condita admin | May 27, 2001 | Publicaties | No Comments In 2001 studeerde ik af aan de Universiteit van Amsterdam in de Planologie. Ik deed onderzoek naar de impact van Europese stimuleringsfondsen op stedelijke vernieuwingsprojecten in Nederland en Italië. Ik kon dit mede doen door mijn tijd op de Architectuurfaculteit van de Università la Sapienza in Rome. Hier is zijn geheel de publicatie te lezen In deze studie hebben we in het begin de volgende vraag gesteld: wat is de Europese rol in het Urban stedelijke vernieuwingsprogramma? Nadat we dat hadden gedaan hebben we in hoofdstuk II de ‘case study’ geselecteerd om deze vragen te onderzoeken. We kozen als ‘cases’, Utrecht en Salerno, omdat deze het beste te vergelijken waren. In hoofdstuk III hebben we gekeken naar de instrumenten de Europese Unie heeft in de stedelijke planning en in hoofdstuk IV hebben we gekeken naar de nationale stelsels. Dit was de basis voor ons onderzoeken. In hoofdstuk V en VI konden we vervolgens onze cases grondig bekijken. Utrecht heeft een wijk die Lombok heet. De wijk was bekend om de criminaliteit die er plaatsvond en dat er veel immigranten wonen. Het is nu een populaire wijk. Urban speelde een rol, aangezien het de wijk in staat stelde zichzelf te regenereren. Niet alles was goed; voor een deel van de inwoners werd de wijk te duur. Salerno heeft een centrum, dat meer een buitenwijk was dan een echt centrum. Urban probeerde dit door gebouwen verbeteren en er nieuwe functies neer te zetten. De eerste resultaten zijn nu zichtbaar. Er zal echter meer nodig zijn dan het Urban programma om er weer een echt centrum van te maken. De stad is nu wel zo georganiseerd dat ze effectief beleid kunnen voeren. Urban is een succes geweest. Het programma maakte een verschil, hoewel het af en toe de grenzen van de Europese bureaucratie ontmoette. Het was wel een duidelijk idee over hoe stedelijke politiek kan werken. De toekomst van Europese planning is echter onzeker, daar de uitbreiding van de unie druk zal leggen op alle EU-fondsen en ‘visies’, zoals de stedelijke ‘Blauwe Banaan’ vanaf Londen naar Milaan op politieke tegenstand zullen blijven stuiten. jQuery(document).ready(function($) { $.post('https://ricklindeman.nl/wp-admin/admin-ajax.php', {action: 'wpt_view_count', id: '68'}); }); Related Posts Archeologie onder water No Comments | Jun 14, 2023 Leren over de fiets in disruptieve tijden No Comments | Nov 24, 2017 Games in the Favela No Comments | Oct 27, 2017 Het voorkomen van een braindrain No Comments | Jun 18, 2013 About The Author rickthuis"
