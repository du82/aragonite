title = "Fuerteventura | Reizen | rick filosofeert"
full_description = "Fuerteventura12/12/01 17:23 Opgeslagen in: ReizenHet eiland lag rustig in de oceaan. De wind was niet zo hard als de naam deed vermoeden. Rick durde zelfs een dappere fietspoging aan, maar op dat vals plat was de wind toch hard. Sommigen typeerden het als een groot centerparcs. Dat was wel een beetje waar, in die dorpen, gevuld met Engels plebs, maar als je even wegreed, Door het vulkaanlandschap, over de bergen, kwam je in lieflijke dorpjes, als Betancuria en Plajeral, En daar proefde je de wijn en de kaas, en wat nog belangrijker was: de zon scheen!"
