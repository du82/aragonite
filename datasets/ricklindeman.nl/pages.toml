full_description = "Familie admin | July 19, 2015 | interesses | No Comments Ik ben geboren in Amsterdam in 1977. Mijn ouders woonden op de Van Eeghenstraat en de Prinsengracht. Opgegroeid ben ik Amstelveen. Ik studeerde planologie aan de universiteiten van Amsterdam en Rome. Samen met mijn zoontje Jens en mijn dochter Loïs woon ik in Terwijde. Dat is een deel van Leidsche Rijn, de Vinex locatie bij Utrecht. Jens (8) is een stoere verdediger van DESTO. Loïs gaat net naar groep 3. jQuery(document).ready(function($) { $.post('https://ricklindeman.nl/wp-admin/admin-ajax.php', {action: 'wpt_view_count', id: '44'}); }); Related Posts Het is Koers! No Comments | Aug 18, 2015 Duiken & De Oceaan No Comments | Aug 18, 2018 Lindeman & Drank No Comments | Feb 22, 2017 Bijen No Comments | Aug 18, 2015 About The Author rickthuis"
