["http://www.ricklindeman.nl/files/a6cb2a13bd908e37d81959cb7350d212-286.html"]
title = "Beter dan Rome | Opmerkelijk | rick filosofeert"
full_description = "Beter dan Rome22/02/01 16:44 Opgeslagen in: OpmerkelijkVandaag bleek uit een onderzoek van de Duitse ANWB dat het GVB het op één na slechtste OV bedrijf van Europa is. Alleen Rome is nog slechter. We kunnen dus weer blij zijn met André Testa. Vijf jaar lang krijgt de jonkheer al een megasalaris om ons een op tijd ergens af te leveren.De ADAC, de Duitse zusterorganisatie van onze autolobbyclub, vond dat Amsterdam het laagst scoorde als men keek naar overstapmogelijkheden, informatievoorziening, prijs en frequentie. Dit zijn dus eigenlijk net alle voorwaarden waar een vervoerbedrijf aan moet voldoen lijkt mij. Barcelona won. Toen ik daar was vond ik de metro ook fantastisch. Het hele netwerk is gigantisch uitgebreid toen de Catalaanse hoofdstad de spelen van 1992 toegewezen kreeg. Amsterdam liep deze spelen nou net mis. Dit kwam onder andere omdat men ‘compacte spelen’ presenteerde die maar weinig aan de stad zou veranderen. Wat nu, compacte spelen? Barcelona is nog steeds blij dat ze het anders hebben aangepakt.Rome zou nog slechter zijn dan Amsterdam. Nu heb ik daar een tijdje gewoond. Er waren wel eens wat stakingen, maar meestal bracht Tram 8 me daar keurig op tijd op de Universiteit. Daarmee wil ik eigenlijk Amsterdam uitroepen tot het allerslechtste OV-Netwerk. Laat nu die overbetaalde Bommelfan er maar eens wat aan doen!"
year_published = 2020
