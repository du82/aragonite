["http://www.ricklindeman.nl/files/archive-dec-2008.html"]
title = "Rick filosofeert"
full_description = "Dec 2008 Rick filosofeert | Feb 2009 | Nov 2008 Krezip20/12/08 14:56 Opgeslagen in: PartyHet laatste clubconcert van Krezip. Was natuurlijk helemaal mooi toen ze nog niet hadden besloten om toch ook in de HMH op te treden, maar toch. Paradiso is toch beter.Meer foto'sFrankfurt08/12/08 10:22 Opgeslagen in: Werk : EnglishAll frankfurt photosI've been to Frankfurt am Main for Link.Well to the airport, famous for its integration with high-speed rail.Although at night we went into the city, with the S-BahnExperience Local Cuisine.Sachsenhäuser WursteplatteAnd the second day, i got to experience the Skytrain.Skyline from Rick Lindeman on Vimeo.Gladheid in Vleuten08/12/08 10:17 Opgeslagen in: OpmerkelijkWijkwethouder Tymon de WegerPostbus 162003500 CE UtrechtNederlandUtrecht, maandag, december 8, 2008Geacht College, Beste VroedschapU weet, dat ondanks de ongemakkelijke waarheid die op ons allen afkomt, de Hollandsche winter, zo mooi beschilderd door Avercamp, soms nog hard kan toeslaan. Zo fietste ik met mijn zoon, langs voormalige ridderhofsteden als Ter Weijde en Den Engh naar het fraaie dorp Vleuten, precies zoals in de visioenen van Riek Bakker voor het gebied waar de Rijn ons verlaat voor de Sleutelstad, was vorm gegeven. Op deze winterse 24ste van de nevelmaand, november, lag het dorp, waarvan u de schepen mag zijn, met een laagje wit over de boomgaarden waaraan het zijn roem ontleent.Mijn zoon zat voorop, babbelend als zijn leeftijd (Bijna 2) betaamt. We fietsten naar de kinderopvang “Hotoldebotol.” Net toen we van het fietspad dat de tol ontsluit afgingen, om de laatste bocht naar het Leiwerk te nemen, waren we kansloos, en gingen we onderuit. Mijn zoon lag hevig bloedend op de grond.“Vervelend”, zult u zeggen, “maar dat is overmacht. Immers, die luisterrijke winters, die u beschrijft, eisen immers af en toe hun tol. Ik hoop dat hij snel hersteld.” Uw politieke afkomst kennende, zult u misschien zelfs om zegen hebben gevraagd, waarvoor dank. Het gaat inmiddels ook weer beter met hem.Toch is het daarmee niet afgesloten. Er is immers, zoals u weet, een moment waarom de verantwoordelijkheid van de gemeenschap wel ter sprake komt. Het moment waarop overmacht verandert in nalatigheid. En dat, geachte vroedschap, is in dit geval zo.Het kindercentrum, waarover ik zoëven sprak, heeft immers telkenmale contact met u gezocht om het strooibeleid rond het Leiwerk, waar naast kinderopvang ook een lagere school ligt, aan te passen. De morgen van de 24ste heb ik zelf 4 mensen onderuit zien gaan, voor en nadat ik mijn zoon naar de huisarts meenam.Uw college koketteert graag met de bloem der natie in haar campagne voor het nieuwe hart van onze Domstad. In taal die men SMS placht te noemen wordt zij welkom geheten in 2030. Om dat welkom met gezonde jonge mensen te vieren, verzoek u uw verantwoordelijkheid te nemen en iets aan deze nalatigheid te doen. Er is bovendien iets dat volgt uit nalatigheid, en dat is aansprakelijkheid.In afwachting van uw antwoord verblijf ik.Hoogachtend,Rick LindemanTags: Terwijde"
