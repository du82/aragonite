["http://www.ricklindeman.nl/files/0667067deb8425ec6f1a3312947f1643-330.html"]
title = "Ouders | Rome, Famiglia | rick filosofeert"
full_description = "Ouders05/01/00 10:30 Opgeslagen in: Rome : FamigliaCaro figlio,Vanuit de Nederlanden kwamen jij en wij naar Rome. Vanuit die wetenschap zingen wij niet van oorlog, maar wel van Rick die door het lot van het leven verjaagd naar Italie kwam aan het Lavinische strand, veel over landen en zeeen geslingerd door de wil van de wetenschappers,waaronder hijzelf, door de hartstocht naar kennis en avontuur gekweld, totdat hij zijn stad zou bereiken en zijn gedachten tot in Latium zou brengen - de oorsprong van het geslacht der Latijnen, van de vaders van Alba, van de hoge muren van Rome. Muze, zeg mij waarom, waardoor gekwetst of bedroefd, Rick, even uitblinkend door vroomheid als Aeneas, zulk een reeks van gevaren, zoveel leed wilde verduren. De vroomheid zou zich juist rond Natale 1999 uiten, aan de vooravond van het nieuwe millennium Aan het begin daarvan kende de regerende paus, de bisschop van Rome, zo’n grote betekenis toe. Wij waren met jouw hulp daarbij. Mede aan de hand van Vergilius werden wij, eveals Dante en Beatrice, langs onverwachte paden geleid.Op het vliegveld haalde je ons op. We moesten heel lang op de koffers wachten, maar die verschenen niet. Dat zou de volgende dag gebeuren. Het wachten bleek alleen maar een kwelling om ons op de proef te stellen. Vanuit de hemel werd ons dit duidelijk gemaakt. Want daarna kwamen, als genezende tegenstelling, heerlijke dagen vol gezonde beweging (ik zag dat niet altijd zo, want ik wilde al het schoons in alle rust bewonderen, maar dat ligt geheel aan mijn tempo-gevoel), vol prachtige kunstwerken, en vol gezelligheid. Jeugdjaren en jaren van ouder worden kwamen op natuurlijke wijze samen in de uitdrukkelijke oudheid der klassieke kultuur. Ook de Griekse invloed ondervonden we, zowel tot uiting komend in de Romeinse kunstwerken, als in onze eigen beleving toen we in Ostia na veel inspanning de zee bereikten. We riepen immers op het moment dat we de zee bereikten, in onze eigen bewoordingen, “Thalassa! Thalassa!”Je hebt ons een onvergetelijke impressie gegeven van de aspecten van het Rome met als uitgangspunten lijn 8 en de “oude” Piramidevorm. Aspecten, want bij ieder bezoek wisselt de indruk van Rome. Hoe je Rome ziet, hangt ook sterk af van degene die je ontvangt en met wie je reist. Wellicht kan ik je hartelijke gastvrijheid niet beter omschrijven, want we hebben genoten. We sliepen heerlijk op het matras, en koesterden ons eten en onze dranken in het verscholen licht van de huiskamer. De lichte schemering deed ons eerbiedig beseffen dat we het Licht van Rome nooit geheel zullen begrijpen. Alles deden we onder het oog van Johannes XXIII en met de zegen van Johannes Paulus II.Onze dank, en wij wensen je toe dat je je verblijf in Rome als een vruchtbare ervaring met je meedraagt.Il Tuo Padre"
