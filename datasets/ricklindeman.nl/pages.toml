["http://www.ricklindeman.nl/files/476d8ff4fb77bb7abce4dc9f30c4f0c2-157.html"]
title = "Zoveel gratie... | rick filosofeert"
full_description = "Zoveel gratie...07/01/02 17:50 Cafe M, diep in de nacht.Al scannende kwam de mooie jonge vrouw binnen zijn bereik.Haar opgestoken lange, kastanjebruine haar, het grijze rokje en het gestreepte topje,gaven haar een gracieus voorkomen.Ook de manier waarop ze zich op de dansvloer etaleerde, had een elegantie die hem kon boeien.En dan die diepe, mysterieuze blik..Toen stond ze ineens voor hem. Kwetsbaar met haar ontblote schouders.De Twent die wist wat hem te doen stond, kon het plots niet meer.De 6e stapavond van de laatste 8 avonden leek hem op te breken.Hij had geen energie meer.Teleurgesteld schoven de twee vriendinnen een paar plaatsen op.Een paar mannen werden nog door het tweetal op hun plek gewezen.Zelfs het laatste nummer voor het licht werd, kon ze niet meer bij elkaar brengen..Ach..het was wel een mooie avond geweest.. Door Jasper T."
