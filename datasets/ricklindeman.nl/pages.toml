title = "Faciliteren – Rick Lindeman"
full_description = "Faciliteren admin | August 18, 2015 | Projecten | No Comments Ik faciliteer veranderingen. Dit doe ik bijvoorbeeld in workshops. Hiervoor heb ik heb het bedrijf ‘het Faciliteer Atelier” opgericht Dit is een jong bedrijf dat u kan helpen met het ontvouwen van uw strategie, het ontwikkelen van uw business model of werken aan uw team. We doen dit door middel van uitgekiende en effectieve workshops die u helpen een doorbraak te bewerkstelligen. We zijn gevestigd in Utrecht en proberen de creativiteit van die regio te benutten en versterken. Een facilitator (van Latijn facilitare – vergemakkelijken, vereenvoudigen) is een persoon die de (rand)voorwaarden schept en onderhoudt waaronder zowel collectieve als individuele helings- enveranderingsprocessen op gang kunnen komen. De functie van facilitator wordt wel vergeleken met die van de vroedvrouw, omdat ook de bijstand van deze weliswaar een essentiële rol vervult bij het tot stand brengen van een – al dan niet voorlopig – eindresultaat, maar desondanks op zichzelf niet voor het concrete resultaat zèlf verantwoordelijk is. Naast de benodigde intellectuele bagage en een ruime praktische ervaring in de omgang met mensen en groepsprocessen, vergt de rol van facilitator vooral een sterk ontwikkelde intuïtie en empathisch vermogen. jQuery(document).ready(function($) { $.post('https://ricklindeman.nl/wp-admin/admin-ajax.php', {action: 'wpt_view_count', id: '4'}); }); Related Posts Fietsen bij RWS No Comments | Aug 12, 2017 Presentaties No Comments | Jan 2, 2017 WK Sensible Soccer No Comments | Nov 2, 2016 Duurzaamheid en Beter Benutten No Comments | Aug 15, 2017 About The Author rickthuis"
