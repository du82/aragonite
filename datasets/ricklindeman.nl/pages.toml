["http://www.ricklindeman.nl/files/archive-dec-2005.html"]
title = "Rick filosofeert"
full_description = '''Dec 2005 Rick filosofeert | Jan 2006 | Nov 2005 Rick in Way of the Rodent, deel 323/12/05 12:16 Opgeslagen in: GamesEr is weer een artikel van mij verschenen in Way of the Rodent.Trains have held a fascination to me ever since I was a child. As my parents didn’t have a car, the train was our main form of transportation. When I was small, places like Groningen or Maastricht seemed to be exotic locations from the other end of the universe. Later we found ourselves in the great Termini of Europe: Paris Gare du Nord, Budapest Keleti or Milano Centrale. My dreams of travelling have always been connected to trains.Lees verder op de site van Way of the Rodent of gewoon hier.3x Tijgers!18/12/05 12:20 Opgeslagen in: SportOm 8u kwamen de helden in de Jaap Eden hal.Sommigen waren in Woerden blijven steken.Maar dat mocht de pret niet drukken.Bij Sjaak Swart werd geproost op het nadere succes van de Amstel Tijgers.De hal van de eerste wereldkampioen schaatsen vulde zich langzaam.Ze gingen er eens goed klaar voor zittenTilburg begon iets sterker. Toen het onvermijdelijke eerste doelpunt viel.Bleken we midden tussen de trapperstifosi te zitten,die ondanks de slechte competitiestart,Met een gevulde bus waren gekomen.De tweede periode klonk het "Let's go Tigers!" steeds vaker.Onze jongens, bevrijd van een sponsor die hun naam vervuilde,Vielen krachtig aan.En Schutte wist in een chaotische situatie de puk over de lijn te krijgen.In de derde periode wilden de trappers wel,Maar langzaam voelden de tijgers fans aanDat we het zouden winnen. en dus volgde de 2-1, door Kalousek.Een laatste wanhoopsoffensief der Brabanders werd geneutraliseerdEn de empty netter bekroonde het werk.Veel bier van Sjaak volgde nog.De Trappers verdronken hun puntloze status.Wij namen een voorschot op het kampioenschap.De avond was echter nog niet over.Een snel toegezwinde tram 9Bracht ons tot de Meander.Alwaar een Damesjaarclub op ons wachtteDeze Groningsen heetten niet toevallig Tigre,En de avond werd volgedansd,Zeker toen vers uit haar bed de nieuwe geliefde ener topper kwam opdagen.De volgende ochtend was zwaar voor de schrijver dezes.De derde groep tijgers wachtte namelijk op hemZe waren uit tour uit de stad der kakkerlakken,En brachten een middag voor Argentijns Cinema genot met zich mee.Meer foto's van deze avond vind je hierDe discussie op het ijshockey forum over deze wedstrijd vind je hierTags: IcehockeySint14/12/05 22:07 Op 3 december deed Rick mee als piet aan SenterNovemklaas!De vereniging van geheel onthouders11/12/05 18:02 Opgeslagen in: SportEn zo kwamen wij aan bij de Apeldoornse geheel onthouders vereniging..De Trein had vertraging, zo konden wij het Apeldoornse pubiek reeds hun helden horen toezingen.Het uitvak was buitengewoon schattig, en met zo'n 80 man van MVV goed gevuld.Voortdurend werd het Zoepen in ons thuisstadion bewiekrookt..Over de wedstrijd moet maar kort gesproken worden.MVV had zeker een punt of meer verdient.Het voordeel van het kleine stadion was wel dat Brncic vanaf nabij bezongen kon worden,Na de enige Goal van us MVV.De supporters van AGOVV hadden ook iets bedacht.Ze vonden het zelf op hun forum zeer geslaagd.Ze hadden namelijk Sleutelhangers....... met blauwe lampjes..Wat verlangden wij toen naar de Angelside..Na afloop deelden we de bus terug.Met een speler van AGOVV.Hij had niet gespeeld.Maar de leasebak was nog niet ingevoerd.Wij gingen terug naar onze hoofdstad,Waar we omschakelden op weg naar het trendy Barca..Na een Dansje in de Quinto en de GieterSloten we de avond af in New Orleans..Hier was Bourbonstreet gelukkig niet ondergelopenEn dansten we met drie schone dames.Meer foto's hier en zo als slideshowOfficiële foto's09/12/05 12:20 Opgeslagen in: FamigliaOok de officiele trouwfoto's staan nu online, klik hier voor meer. Ze zijn gemaakt door Ad Snelderwaard. Klik hier voor een slideshow.Er is geboren....02/12/05 09:21 Opgeslagen in: Famigliaeen nieuwe Lindeman. Romi Lindeman werd op 28 november om half drie geboren in het UMC te Utrecht. Rick en Celine zijn nu niet alleen man en vrouw, maar ook oom en tante!Drums please.....02/12/05 09:20 Opgeslagen in: PartyWederom een Topawakenings is de Westergasfabriek. Helden waren nu vooral Adam Beyer en Cari Lekebush van Drumcode. Dit is een Zweeds Technocollectief.Ook het vermelden waard was de ontdekking van het Café de Staatsman. Dit ligt aan de Van Limburg Stirumstraat. In dit café, genoemd naar éen der Patriotten die Souverein Vorst Willem I in 1813 binnenhaalden, zonden de vrouwen van de Jordaan dat het een lieve lust was. Het feest was zelf weer een klassieke. Veel gevarieerde muziek en ook veel meer vrouwen dan op die vrijdag in oktober. De echte bombshells bleven echter uit. Toch dansden de helden voor uren, voordat ze de ochtendlijke kou binnen traden. Maar nog was de nacht niet over, aangezien ze voor een laatste biertje, de TWSTD binnen traden. Hier werd onder genot van een lichte beat, nog nagenoten van de avond.Op ontdekkingstocht door Duurzaamheid & Samenleving02/12/05 09:17 Opgeslagen in: Werk"Het lijkt dan wel of in dit taakveld een samengeraapt zooitje is, maar dat is het zeker niet" opent taakmanager Roel Salden zijn vlammende betoog over de unieke positie die het taakveld Duurzaamheid en Samenleving binnen onze directie inneemt. Na zijn tocht in het Haagse in de fascinerende omgeving van Bodem+ was Rick Lindeman op zijn nieuwe expeditie in een heel andere wereld terecht gekomen, dat was meteen duidelijk. Het taakveld D&L is samen met Mobiliteit en Ruimte één van de twee taakvelden van Milieu & Leefomgeving die niet aan één grote opdracht werken, maar voor een scala aan opdrachten en opdrachtgevers. Verdeeld over Zwolle, Utrecht en in toenemende mate Den Haag werken zo’n 60 mensen met een breed palet van beschikbare instrumenten en een zeer gevarieerde doelgroep aan het bevorderen van duurzame maatschappelijke veranderingsprocessen.Roel en opdrachtmanager Duurzame Ontwikkeling Herry Nijhuis vertelden hoe ze bij het opzetten van hun taakveld blij verrast waren om te ontdekken dat er een sterke samenhang binnen het taakveld lag. "Er zijn drie pilaren waar we aan het werken" tekent Roel voor me. Aan de ene kant werken we aan de ‘harde kant’: we geven subsidie voor het ontwikkelen van milieutechnologie (M&T) en bedrijven kunnen via ons hun investering in milieuvriendelijke technologieën aftrekken (MIA/Vamil) om zo een grootschalige toepassing te bevorderen. Aan de andere kant zijn we sinds dit jaar steeds actiever aan de ‘zachte kant’: we zoeken voorlopers in de transitie (CCT), en helpen ambtenaren, en burgers een duurzame afweging te maken (LVDO). De derde poot zijn we nog aan het ontwikkelen: externe veiligheid wordt een nieuw component van ons werk in de toekomst. Al deze opdrachten werken samen op duurzame maatschappelijke veranderingsprocessen voor elkaar te krijgen. "Het mooie van ons taakveld" schetst Roel "is de diversiteit van deskundigheid en de instrumenten die we in zetten." We hebben fiscalisten, techneuten en organisatiedeskundigen. Op onze gezamenlijke dag in het dierenpark van Apeldoorn bleek hoeveel die gemeen hadden. Ze benaderen de problematiek vanuit een andere hoek en dat leverde interessante nieuwe benaderingen op. Ook richting de opdrachtgever kunnen we nu goed verkopen wat onze toegevoegde waarde is." Binnen de directie komen ook steeds meer verbindingen naar boven. D&S trekt samen met Mobiliteit & Ruimte op in de problematiek van de fijnstof. Aangezien dit een hot-item is, verwachten de heren dat hier kansen liggen.Het Competentie Centrum Transities leert veel van de benaderingen die zijn ontwikkeld in de verschillende transitieprogramma’s en krijgt daardoor een steeds sterkere band met de Energietransitie. Het centrum is opgezet om de voorlopers op het gebied van transitie uit te rusten met de vaardigheden die ze nodig hebben. Transities zijn langdurige veranderingen met een grote impact, zoals bijvoorbeeld de grote veranderingen die hebben plaatsgevonden ten aanzien van de mobiliteit van mensen in de 19e en 20e eeuw.. "Eigenlijk zoeken we de kwajongens (en kwameisjes)!" grapt Herry, "We zoeken de sleutelfiguren die niet bang zijn om een ontwikkeling te trekken. Vervolgens kunnen we ze helpen en faciliteren om een transitie op gang te brengen en te houden". Naast deze voorlopers is zijn team ook bezig met het verankeren van duurzaamheid in de samenleving. In het programma Leren voor Duurzame ontwikkeling gebeurt dit door aan te haken op de doelen in het reguliere onderwijs, ambtenaren te leren duurzame afwegingen te maken en burgers te betrekken in maatschappelijke besluitvormingstrajecten.'''
