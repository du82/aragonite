["https://ricklindeman.nl/retro-videogames"]
title = "(Retro) Videogames – Rick Lindeman"
full_description = "(Retro) Videogames admin | June 25, 2015 | interesses | No Comments Sinds 1986 ben ik een gamer. Ooit begonnen op een Commodore 64/128, werkte ik me via de Commodore Amiga, en Gameboy, naar een verzameling consoles en emulators. mijn favoriete spel is Sensible World of Soccer. Een puur, intuïtief voetbalspel uit begin jaren ’90. Zelfs in 2015 ben ik hiervoor nog naar Polen gegaan om mee te doen aan wereldkampioenschap. Ik ben co-organisator van het WK in 2016. Kijk op Sensidays Daarnaast geniet ik erg van Japanse shoot’em ups als Dodonpachi (via Mame op de iPad op een Icade, voor de liefhebber), en ben ik fenomenaal in Mario Kart. Online ben ik bekend als Romanista. Ik schrijf ook wel eens artikelen over games, zoals een stuk over games in de favelas van Rio de Janeiro. Friendcodes NintendoNetwork: Romanista77Switch: 5098 6135 13253DS 0318 8943 647PS4: Romanista345Xbox 360: RomanistaiOS: Romanista345Steam: Romanista345Wii: 7214 8673 0486 1521NN: Romanista77 jQuery(document).ready(function($) { $.post('https://ricklindeman.nl/wp-admin/admin-ajax.php', {action: 'wpt_view_count', id: '56'}); }); Related Posts Lindeman & Drank No Comments | Feb 22, 2017 Wielrennen No Comments | Sep 12, 2017 Go No Comments | Apr 15, 2016 Bijen No Comments | Aug 18, 2015 About The Author rickthuis"
