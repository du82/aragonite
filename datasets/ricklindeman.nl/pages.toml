["https://ricklindeman.nl/duurzaamheid-en-beter-benutten"]
title = "Duurzaamheid en Beter Benutten – Rick Lindeman"
full_description = "Duurzaamheid en Beter Benutten admin | August 15, 2017 | Projecten | No Comments Als thematrekker Duurzaamheid binnen Beter Benutten verbind ik regionale bereikbaarheid met doelstellingen rond duurzaamheid. Onderstaande tekst is afkomstig van BeterBenutten.nl Uit onderzoek blijkt dat er met Beter Benutten maatregelen milieuwinst te behalen is. Ook wanneer maatregelen in eerste instantie gericht zijn op betere bereikbaarheid. Dit zogenaamde positieve bijeffect vergroot voor bedrijven en regio’s het draagvlak om Beter Benutten maatregelen door te voeren. Maatschappelijk verantwoord ondernemen of duurzaam ondernemen zijn voor veel bedrijven immers strategisch interessant en soms eerder nog een reden mee te doen aan Beter Benutten maatregelen dan bereikbaarheidsdoelen op zich. Verder is voor regio’s een efficiëntere inzet van middelen interessant, gezien de effecten op meerdere beleidsdoelen en de mogelijke bundeling van diverse geldstromen. Conclusie: De maatregelen uit het programma Beter Benutten hebben een positief effect op de uitstoot van CO2 (kooldioxide), NOx (stikstof) en PM10 (fijnstof). De reductie van CO2, NOx en PM10 betekent ongeveer 1% minder uitstoot door wegverkeer in de BB-regio’s. Dit effect is berekend op basis van de ex ante (vooraf) inschattingen van de bereikbaarheidseffecten en bijgesteld op basis van het gerealiseerde aantal spitsmijdingen in de BB-regio’s. Vanuit Beter Benutten is het inzetten op duurzaamheid relevant, aangezien dit zorgt voor: een stevigere uitvoering van Beter Benutten maatregelen door verbreding van draagvlak en motivatie voor deelname van partijen (denk bijvoorbeeld aan items als gezonde verstedelijking); het vergroten van maatschappelijke meerwaarde en bijvangst op milieugebied van het programma Beter Benutten; een opmaat voor meer verbindingen tussen verschillende disciplines zodat meer structureel de synergie benut wordt tussen bereikbaarheids- en milieubeleid op het gebied van verkeer en vervoer. Onderzoek In opdracht van Rijkswaterstaat, onderdeel Water, Verkeer en Leefomgeving (WVL), is eind 2013 op basis van Beter Benutten projectplannen (inschattingen vooraf) gemeten wat het effect is van maatregelen op duurzaamheid. Met duurzaamheid bedoelen we hier de vermindering van de uitstoot van CO2, PM10 en NOx. Wat blijkt is dat in het vervolgprogramma van Beter Benutten de gebruiker nog meer centraal staat dan in de eerste fase van programma. Dit is direct terug te zien in de verdeling van de maatregelen over verschillende categorieën. Waar in het eerste deel van het programma een kwart van de maatregelen bestond uit weginfrastructuurprojecten (aanbodgericht), zijn in het vervolgprogramma bijna alle maatregelen direct gericht op het verminderen van het aantal auto- en vrachtkilometers in de spits. Deze maatregelen hebben direct een positief effect op de uitstoot van CO2, NOx en PM10. De reductie van CO2 en NOx betekent ongeveer 1% minder uitstoot ten opzichte van de totale uitstoot door wegverkeer in de regio’s. Voor PM10 is de bijdrage ruim 1,5%. Alleen de goedgekeurde plannen van aanpak, met een inschatting van het bereikbaarheidseffect, zijn meegenomen in de berekening van de duurzaamheidseffecten. Verder zijn de landelijke trajecten, zoals I-CTS, buiten beschouwing gelaten. In absolute zin is de reductie in uitstoot lager in vergelijking tot het eerste programma. Dit komt vooral doordat het eerste programma groter was qua omvang (aantal maatregelen, totale kosten). De reductie van CO2, NOx en PM10 ten opzichte van de totale uitstoot door wegverkeer is voor beide programma’s vergelijkbaar of zelfs hoger (PM10). Dat met minder maatregelen een vergelijkbaar neveneffect op het gebied van duurzaamheid wordt bereikt, komt vooral doordat het vervolgprogramma nog meer gericht is op vraagbeïnvloeding (mensen stimuleren de spits te mijden) dan in het eerste deel van het programma. Logistieke maatregelen scoren hoog op kosteneffectiviteit. Dit houdt rechtstreeks verband met de hogere emissiefactoren voor vrachtverkeer, waardoor een vrachtspitsmijding een groter effect heeft dan een autospitsmijding. De categorieën Werkgeversaanpak, Spitsmijden en P+R en Parkeren scoren ook goed op kosteneffectiviteit. Deze maatregelen leveren een grote bijdrage aan de vermindering in uitstoot (veel spitsmijdingen) en zijn naar verhouding minder duur. Het effect van het programma Beter Benutten op luchtkwaliteitsknelpunten (concentraties) is in deze studie niet gekwantificeerd. Belangrijke conclusies zijn wel: Indien huidige (of toekomstig) luchtkwaliteitsknelpunten overeenkomen met afwikkelingsknelpunten is een positief effect op de reductie van de concentraties te verwachten; De meest winst valt te behalen op locaties waar de verkeersbijdrage in de totale concentratie hoog is, dit zijn in het algemeen locaties met relatief veel (vracht)verkeer. Wat kunnen we met deze resultaten? Positieve effecten op duurzaamheid vergroten voor bedrijven, en ook in regio’s, veelal het draagvlak voor Beter Benutten maatregelen. Maatschappelijk verantwoord ondernemen is namelijk strategisch interessant voor veel bedrijven, en soms eerder een reden mee te doen aan Beter Benutten maatregelen dan bereikbaarheidsdoelen. Verder is voor regio’s ook een efficiëntere inzet van middelen interessant, gezien de effecten op meerdere beleidsdoelen en mogelijke bundeling van diverse geldstromen. Vanuit Beter Benutten is het inzetten op duurzaamheid relevant, aangezien dit zorgt voor: een stevigere uitvoering van Beter Benutten maatregelen door verbreding van draagvlak en motivatie voor deelname van partijen (denk bijvoorbeeld aan items als gezonde verstedelijking); het vergroten van maatschappelijke meerwaarde en bijvangst op milieugebied van het programma Beter Benutten; een opmaat voor meer verbindingen tussen verschillende disciplines zodat meer structureel de synergie benut wordt tussen bereikbaarheids- en milieubeleid op het gebied van verkeer en vervoer. jQuery(document).ready(function($) { $.post('https://ricklindeman.nl/wp-admin/admin-ajax.php', {action: 'wpt_view_count', id: '119'}); }); Related Posts WK Sensible Soccer No Comments | Nov 2, 2016 Presentaties No Comments | Jan 2, 2017 Fietsen bij RWS No Comments | Aug 12, 2017 Faciliteren No Comments | Aug 18, 2015 About The Author rickthuis"
