full_description = "Feb 2008 Rick filosofeert | Mar 2008 | Jan 2008 Brussel again18/02/08 09:13 Opgeslagen in: Reizen : WerkGe en ik moesten weer naar Brussel voor Link. Dit keer verwelkomde Polis ons. Alles per voet, vanaf Bruxelles Midi, in een aparte omgeving. Van Schotelvillage, het arme St. Gilles, thuisland van het legendarische Royale Union Saint Gilloise, door het trendy Ixelles naar Rue du Trône. Na een heerlijk diner op/bij Place de Londres, stappen met Freek op Place de Luxembourg, en ontmoetingen met Nissan lobbyistes. Meer foto'sTags: Link, BrusselAjax - Feyenoord 3-011/02/08 10:53 Opgeslagen in: SportHet was misschien niet echt een wedstrijd.Waardoor de overwinningsroes iets minder was.Maar toch erg lekker.Het smaakte zoet.Helden in de gangHet grote spandoekEn dus is het nu 68-51 in de klassiekerRest foto'sTags: Ajax"
