["http://www.ricklindeman.nl/files/896b9ecde9c0406f7f6db081780f80bf-188.html"]
title = "Zeilen in Frysl�n | Reizen | rick filosofeert"
full_description = "Zeilen in Fryslân01/08/02 20:02 Opgeslagen in: ReizenWanneer je nu echt ontspannen op vakantie wil gaan,ga je gewoon zeilen over de Friese Meren. Het windje duwt je voort,je neemt een biertje en je gsm heeft geen bereik....Rick ging mee met een groepje Goërs bij Hoora in Heeg, te zien op de kaart links. Ze stopten de Valk (foto rechts) vol en trokken er op uit. Vervolgens zeilden ze het Heegermeer op. Ons bootje miste ergens een afslag, dus we kwamen pas laat aan het Schone Woudsend. Het werd windstil, dus het was bomen in de rakken...De volgende dag begon rustig. We zeilden naar Langweer, alwaar Yorin die avond een Sail-in Movie zou draaien. (foto rechts). Die avond kwamen we aan in Joure. Hier werd gekookt bij een beginnend regenbuitje, waarna het Jouster nachtleven werd ontdekt. Na café Herman volgden de Stam (met het wereld beroemde striptoilet) en het Tolhuis.Voor alle fans: Elwin bijna naakt in het water op zoek naar zijn Zonnebril in JoureAkkrumDe volgende dagen werd het heftiger, zondag kwamen we niet verder dan Goingaryp, waar wel een heerlijk restaurant, waar met heerlijke wijn en een goede Cognac het leed van die dag werd weggedronken.Vervolgens op weg naar Grou, waar een BBQ de aanwezige mannen vol op gelegenheid gaf hun mannelijkheid te bbewijzen, wat de ene beter lukte dan de anderen, ik noem geen namen........Bas & JeroenIn LangweerTags: Go"
