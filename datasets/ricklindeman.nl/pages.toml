["http://www.ricklindeman.nl/files/5bc34c88c97d27c92fcf1a646644ceb1-306.html"]
title = "Francoforte | Rome | rick filosofeert"
full_description = "Francoforte01/12/99 09:41 Opgeslagen in: RomeHet begin van een nieuwe maand brengt altijd leuke zaken met zich mee. Zo mag naast een nieuw tramabonnement de huur en de verwarming worden betaald. De rest van de eerste dag van de laatste (?) maand verliep rustig. Tegen twaalven werd opnieuw voor statistiek student gespeeld om de post te lezen. De Italiaanse les bleek te bestaan uit een lang argumento van Andreas over zijn geboortestad Frankfurt. Dit relaas behandelde de hele geschiedenis van Francoforte vanaf Goethe tot technoheld Sven Väth. Om te herstellen van deze aubade aan de stad aan de Main besloten de Hollandse en Catalaanse afvaardiging maar wat te gaan drinken na de les. Om toch nog wat aan Italiaanse te doen werd er besloten een Wettkampf te houden met aan de ene kant Judith, Caroline en Israel, de Sqaudra Dragone, en andere kant de Lupini met Mireia, Adria en Rick. Het doel was zoveel mogelijk Italiaanse woorden correct uit het Spaans/Engels te vertalen. Het spreekt voor zichzelf dat de Wolven met 6-5 wonnen.Na het idee om met Jorge naar AS Roma te gaan te hebben laten varen, wat maar goed ook was, want Roma zou verliezen, ging Rick op huis aan. Daar trof Rick Agostino en Marco aan die in het gevecht maren met rekeningen en uiteindelijk konden uitrekenen hoeveel onze arme student mocht betalen aan spese. De avond werd bovendien gekenmerkt door verhuizingen. Niet alleen was Agostino nog steeds spullen uit de kamer van Marco te halen, ook was Antonio, de opvolger van Beppe er en was Fiaminia bezig haar spullen te pakken. Ook kwamen de drie Franse Musketiers aan om het eerste deel van hun spullen af te leveren. Ze trekken er donderdag in."
