["http://www.ricklindeman.nl/files/40d4f35367df863a30892dc4a710d3a6-322.html"]
title = "Sciopero | Rome | rick filosofeert"
full_description = "Sciopero16/12/99 10:18 Opgeslagen in: RomeStaken. Een nationale hobby van de Italianen. Het OV lag weer eens plat, zodat Rick de enige van zijn werkgroepje was die ondanks de ‘sciopero’ de universiteit kon bereiken. Na enige Carla-geknuffel nam onze held toen maar plaats op terrasje op de Piazza San Lorenzo, waar onder het genot van een Cappuccino hij deze pauselijke geschiedenis verder optekende.Op weg naar de Città Universitaria bleek pas echt wat de staking tot gevolg had. De overvolle bus passeerde de stakers die droevig voor zich uitkeken op de largo Santa Susanna in de stromende regen. Een carabiniere hield uit medelijden zijn paraplu maar boven een aantal stakers, die hij eigenlijk in toom moest houden. Toen de bus even later stilstond op Termini brak een volksopstand uit die Italië niet meer gezien had sinds de dagen van Giuseppe Garibaldi. De drukte van Rome had Dante ook al eens vergeleken met een deel van de hel. Terecht zoals nu bleek.‘Come i Romani per l’essercito molto,l’anno del giubeleo,su per lo pontehanno passar la gente modo colto, che dal’un lato tutti hanno la fronte verso il casllo en vanno a San. Pietroda l’altro sponda verso le monte’De laatste les Italiaans voor de vakantie kreeg door de staking ook een heel eigen karakter. Er kwamen maar vijf mensen opdagen. Alessandra besloot dat we in plaats van naar Maria’s praatje over het neo-realisme in de Italiaanse cinema, met Visconti als haar voornaamste vertolker, te luisteren, te vertrekken naar een afstudeeropdracht van musicologie. De tijd die we hier doorbrachtten, onder begeleiding van een doedelzak, besteedden Rick en Silvia vooral aan een hevige strijd op het slachtveld dat men kamertje verhuren noemt.Tegen zevenen vertrok Rick met Jorge richting het huis van Judith, waar een diner zou worden gegeven. Onze medegenodigden troffen we op Termini, met enige vertraging, die Renate heette, vertrokken we naar de Valle Aurelia, het tijdelijke einde van Metro A. In Casa Judith troffen we Sangria en de huisgenotes van Judith. Zodoende werd het weer een mooie avond, met als hoogtepunt de masseersessies door Rossie, een der huisgenotes. Rick kreeg ook noh een kerstcadeautje van Mirieia, Cesare Pavese’s ‘La luna e il falo’, de maan en het vagevuur. Een naam die aangaf hoever Rick nu van Dante’s purgatorio af was.Tegen half twee vertrokken de helden naar de stad om daar nog een feestje te bouwen. Het feest werd georganiseerd door Roma Tre, een andere Romeinse Uni. Het was zich echter niet te vergelijken met La Sapienza, zodat Rick al snel werd meegelokt richting Vitinia, waar het nog laat werd."
