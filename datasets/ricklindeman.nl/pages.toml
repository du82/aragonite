["http://www.ricklindeman.nl/files/80129fc4b886f8e6ae4c5c352cfd9bc5-545.html"]
title = "Er is een renner getrouwd | Party | rick filosofeert"
full_description = "Er is een renner getrouwd17/08/09 13:05 Opgeslagen in: PartyLieve Jasper,Altijd ben je vol verwachting,Kijkend naar je apparaat,Dat één met je is geworden.Jaren geleden al,Had je een Zuid-Afrikaanse site ontdekt.Die gratis berichten kon versturen.En dus bereikten je stapverhalen ons.In brokjes van 164 tekens.Vaak door elkaar.Op koers met Hanneke, Met Maud de Cauberg op,Het uitzicht op Ballon d’Alsace met Sanne..En recenter nog, de onbereikbare sogno van de Côte de JulietteOp een feest zien we hem staan.Na een lange kleipartij.Genietend van de muziek,Maar ook wachtend op een boodschap van zijn grote liefde. Want, lieve Jacq,Alleen dan, wanneer hij leest dat alles goed gaat met jou,Dan, kan hij pas echt genieten.Hij zocht altijd naar een Mont Ventoux om te beklimmen.Kijkend naar de helden in de gele trui.Schaatsend, lopend, roeiend.Met stapels Mens Health onder zijn bed.Hopend dat die hem konden helpen.Stapels Folia’s. Stapels krantenartikelen.En huis vol snuisterijen ……Die allemaal, ja zelfs de derde TV en de vierde stofzuiger, moesten meeverhuizen.Jaren geleden zagen we je onverstaanbaar onze Amstelstad binnen fietsen.Die eerste avond, in Amstelveen, ondertekende je reeds met jouw persoonlijk markering. Jaren nog voordat bij Voltt een bijzondere, bij Martijn niet zo geliefde, traditie haar intrede deed ….Daar was hij dan, een Twent in Amsterdam.Genietend van ’t klootschieten, maar nooit in het oude Diekman geweest.Wel bij de bekerfinale, maar juichend voor Wit-Rood-Wit. Ben je nu een echte Twent of vind je vooral dat je een echte Twent moet zijn? Meer en meer werd Mokum deel van jou.Geniet je van ’t Jordaanfestival en huil je om Koning Dré.Op YouTube “Ik leid m’n eigen leven” en “Bloed, Zweet en Tranen” in de Godentempel.En zelfs, heb je nu een gedeelde seizoenkaart van Ons Aller Ajax, Onze Vreugd en Trots Bezit! Stukje bij beetje wist Jasper zijn eigen plek te veroveren.Nooit echt de geboren student.Langzaam ontdekkend welke onderdelen van het studentenleven hem bevielen.Van roeipogingen in het begin, naar zweven op de techno,Om de volgende dag gezellig naar Bataviastad te gaan…Loyaal tot in het uiterste.Altijd op bezoek bij vrienden in ’t verre.Ook niet af te brengen van een bestemming.En schattig gefrustreerd als alleen hij daar heen wilde.Om zijn ellende vervolgens in epistels oeverloos te analyseren.Wat hebben we van je genoten in Barcelona en Lombardije.Beroofd werd je, door hoeren ,op de Ramblas, van geld, en erger, je telefoon.En Mart Smeets aansprekend op het vliegveld van Bergamo. De grote Mart, die diep geroerd was omdat je iets moois voor Bogey ging doen! En uiteindelijk maakte hij het af. En vond hij een baan die hij wilde.Van de planologische speeltuin op IJburg via de maxisbrug naar Muiden.En dat heeft je rust gegeven.De rust om deze stap te zetten.Klaar om verder te gaan, zeilend naar de toekomst.Lieve Jasper,Geniet van je Jacq, geniet van ’t leven en deel dat leven met ons!Gefeliciteerd!"
year_published = 2025
