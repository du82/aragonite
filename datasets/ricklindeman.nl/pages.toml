title = "Rick filosofeert"
full_description = "Feb 2011 Rick filosofeert | Mar 2011 | Jan 2011 Bomberman26/02/11 12:40 Opgeslagen in: Games : EnglishI was playing Bomberman yesterday.With @katakashin and some Egyptians.And I wanted to make a little monument for it.I played it on the AmigaIt was called DynablasterI killed my brothersTime and Time again.I made even a little hardware 4 player adapterClumsy as I am.I played it on the gameboyI played it on the gamecubeAnd why?Because it is one of the purist games there is.Just jou, your opponents and bombsOn a 2D plane.When people are playing call of Duty 45: Cyan OpsThey find themselves hip and hardcoreBut aren’t they playing this game.Only less pure?I won’t mention Bomberman 3DA few games are the baseline.Mario, Sensi and Bomberman.And Shin & Zaphod, i’ll get you next time!"
