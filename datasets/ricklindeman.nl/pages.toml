["http://www.ricklindeman.nl/files/073d5440cb1e24e3c70d9293f7b220ca-56.html"]
title = "Het Tentamen | Rome | rick filosofeert"
full_description = "Het Tentamen11/02/00 19:54 Opgeslagen in: RomeNog wat vermoeid, omdat hij het toch niet had kunnen nalaten om naar het feest de dag tevoren stond hij op op de 11de februari, op de kop af drie jaar na zijn rare avonturen in het limburgse land. At pius Aeneas (Verg, IV) , maar de plichtsgetrouwe held vertrok toch naar de universiteit waar op deze dag, misschien wel het werkelijke begin van de Primavera, zijn eerste tentamen in den vreemden zou volbrengen. Hij kwam tegen tienen aan, klaar om de intellectuele arbeid te verrichten. Eerst kwam er een groep aan de beurt die alles tot in den perfectie had voorbereid. Wij vroegen ons af of ons sympathieke papertje wel aan die maatstaven zou voldoen. Onze held hield echter goede moed. Hij mocht zich sinds de dag tevoren tenslotte ook al 'medio-avanzato' in de taal van Dante, die ook wel eens in de Caput Mundi gesproken werd, hoewel het Romeins toch net iets anders was. Rick was echter nog steeds niet aan de beurt, zodat de Amsterdammer zich afvroeg of hij niet beter in bed had kunnen blijven liggen. De volgende groep had een Erasmus student, de schone Spaanse Esther, in zich, maar die liet gedurende de presentatie eigenlijk niet zo veel van zich horen. het was inmiddels tegen twaalven. Ze sloegen zich er geroutineerd doorheen. De groep die hierna kwam bleek een ander verhaal, de anders zo bedaarde grijsaard Malusardi, bleek ineens fel van leer te trekken tegen deze Romeinen. De professor, had onze hoofdpersoon dan ook al in het begin gewaarschuwd tegen deze verzameling mezzogiornisten. Rick liet nog maar van cafeïne zijn keel binnenglijden. Een cappuccino, het was immers nog voor het pranzo. Emanuela, het lieftallige meisje in het viertal waarvan ook onze goër deel van uitmaakte raakte al lichtelijk in paniek, zodat slechts sussende woorden 'tu non devi preoccuparti', van onze benjamin in het gezelschap haar door deze moeilijke tijd konden slepen. Eindelijk was het onze beurt. Malusardi was weer tot zichzelf gekeerd en keek ons met geruststellende blik aan. Hij vroeg was, wij antwoordden. Wij wezen wat op onze kaarten aan. Rick onderscheidde zich met een discorso over de bonificazione, overigens nog door Mussolini, van het laagliggende gedeelte van ons compresorio, en hoe dat zich verhoudt met de Hollandse polders, Marsman werd inderdaad geciteerd. Hierna tok de zeventigjarige (?) zich terug. We voelden ons redelijk tevreden. Na vijftien minuten en enig bureaucratisch gezever mochten we terugkomen. Het verlossende woord klonk al snel. We kregen een ventotto, een achtenentwintig. Zelfs als je er mee rekening houdt het maximum drie maal zo hoog ligt als in Nederland, dan nog klonk het hoog. Rick twijfelde enigszins aan de wetenschappelijke waarde van zijn werk, maar klaagde niet, 'les douleurs sont follies' schreef Marcel Proust al in zijn recherche du temps perdu (1923). Malusardi werd nu ineens enthousiast, wilde copieën van alle foto's waar hij opstond en meteen een afpraak voor het Groene Hart regelen Dit moest natuurlijk gevierd worden en we vertrokken naar de PizzaRe, waar we inderdaad een vorstelijke schijf voortgezet kregen. Ook bleek hier definitief, hoewel een scherp observator als de schrijver dezes dit al lang doorhad, dat Emanuela tijdens dit vak wat met Daniele had gekregen. Waar planologie al niet goed voor is. Veteranen onder ons kunnen zich misschien de enigszins stukgelopen romance tussen Paul en Alies uit het midden van de jaren negentig van de vorige eeuw herinneren. Laten we hopen dat deze relatie een iets beter lot beschoren is. De volgende halte was een Oostenrijkse birreria, alwaar, nadat gecontroleerd was of geen enkel ingrediënt uit het land van Haider afkomstig was, genoten kon worden van een heerlijk Apfelstrüdel en onze Rivierenbuurter op de hem zo bekende subtiele wijze, de aanwezige toeristen de grond in boorde. Thuis viel onze moegestreden held direct in slaap, zodat hij het telefoontje van Mireia mistte, maar dankzij het wonder van de SMS kon hij toch nog een afspraak maken met zijn Catalaans vriendinnetje in San Callisto. Al daar trof hij een bont gezelschap van bekenden, van franÇaises met neusbelletjes tot verstrooide portugezen, zodat nog tot in de late uurtjes de wetenschappelijke prestaties van onze Monteverdiaan konden worden gevierd."
