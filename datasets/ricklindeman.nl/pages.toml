["https://ricklindeman.nl/co-creatie-tegen-de-crisis"]
title = "Co-creatie tegen de Crisis – Rick Lindeman"
full_description = "Co-creatie tegen de Crisis admin | August 18, 2013 | Publicaties | No Comments Ik schreef dit Paper samen met RWS collega Klaartje Arntzen voor het Planologisch Speurwerk. Hieronder de samenvatting De overheid wil de trein aantrekkelijker maken voor steeds meer mensen. Dit begint ermee dat de reis van en naar het station prettiger moet verlopen. In opdracht van het Ministerie van Infrastructuur & Milieu ontwikkelden we een campagne: de Nationale Reisvraag. Via social media en in co-creatiesessies werd de reiziger uitgedaagd zelf met ideeën voor verbeteringen te komen. Voor de Nationale reisvraag is gekozen om te werken met een ontwerpfilosofie die bekend staat onder de naam Service Design Thinking. Deze methodiek kenmerkt zich door een sterke divergerende onderzoeksfase in het begin van het ontwerp. Daarnaast staan samenwerking met stakeholders en co-creatie met gebruikers centraal. De methode vraagt wel wat van de deelnemers: veel organisaties zijn nog niet in staat in te springen op de snelheid van reactie die de dynamiek van een succesvolle campagne eist. Het resultaat is een groot aantal ideeën waardoor het voor- en natransport verbeterd kan worden. De plaatsing van deze ideeën ten opzichte van de reis van de klant levert bovendien een kwalitatief onderzoek op van waar de pijn van de klant zit. Hieruit blijkt dat voor de ov-reiziger vaak de kleine zaken goed in orde moeten zijn. Zaken als een goede fietsenstalling en goede overzichtelijke bewegwijzering zijn vaak veel belangrijker dan nieuwe bussen of weer een nieuwe koffietent. In de woorden van de Staatssecretaris: “Het zijn vaak kleine ideeën. Maar ze tonen aan dat reizigers mee willen denken en werken aan een beter OV. En dat is de grootste winst van de Nationale Reisvraag!” In Nederland zijn steeds meer voorbeelden te vinden van Service Design. Dit gaat niet alleen om ontwerpzaken als nieuwe kiosk van de NS. Ook het aansluiten bij de behoeften van de reiziger van het programma Beter Benutten in Nijmegen is op deze manier getoetst. Aan te bevelen is dan ook om dit perspectief waar inzetbaar te gebruiken met de ontwikkeling van nieuw beleid. Een goede omgang met gebruikers is niet iets dat een extra last is, maar juist zorgt voor een groter draagvlak van het uiteindelijke ontwerp. Daarnaast kan de eenmaal opgebouwde community ingezet worden voor nieuwe vraagstukken. Het omgaan met je gebruiker is dan ook geen ‘extra-tje’, maar de kern van je uitvoering. jQuery(document).ready(function($) { $.post('https://ricklindeman.nl/wp-admin/admin-ajax.php', {action: 'wpt_view_count', id: '29'}); }); Related Posts Experimenteren in de keten No Comments | Oct 27, 2013 Het voorkomen van een braindrain No Comments | Jun 18, 2013 Managementboek No Comments | Oct 1, 2017 Kumasi No Comments | Oct 5, 2017 About The Author rickthuis"
