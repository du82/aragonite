["http://www.ricklindeman.nl/files/9dcdb59c439e1f12f0787826ef9ab616-259.html"]
title = "Op ontdekkingstocht door Kennisoverdracht en Regelgeving | Werk | rick filosofeert"
full_description = '''Op ontdekkingstocht door Kennisoverdracht en Regelgeving12/01/06 19:59 Opgeslagen in: Werk"Ooit vroeg iemand ons of ze een milieuvergunning nodig hadden om leeuwenmest in te blikken”, verhaalt Marcel Taal, projectadviseur bij InfoMil. “De meeste vragen zijn minder ongewoon". Hij vertelt dat decentrale overheden, maar ook bedrijven en derden met allerlei verschillende typen vragen bij de helpdesk van InfoMil komen. "Maar ons taakveld is meer dan de helpdesk alleen…” In het taakveld Kennisoverdracht en Regelgeving is de hoofdopdracht InfoMil. Dit was een samenwerkingsverband tussen Senter en Novem dat voornamelijk als vraagbaak en kenniscentrum diende voor gemeenten en andere decentrale overheden. Naast de helpdesk bestaat InfoMil uit de hoofdfuncties ondersteuning beleid & autorisatie èn kenniscentrum. Marcel werkt voornamelijk op het gebied van beleidsondersteuning. "We fungeren als de rechterarm van VROM en adviseren en onderhandelen mee over de implementatie van milieuregelgeving in Den Haag, Brussel tot in Sevilla aan toe." vertelt hij. Zo is InfoMil bezig met de IPPC -Richtlijn (integrated pollution prevention control ) van de Europese commissie. Ook voert het taakveld sinds kort programma's uit buiten InfoMil, zoals het project Strijdige regels (in opdracht van EZ) en ondersteunt het VROM bij de toekomstagenda milieu en bij de implementatie van de VROM-vergunning.Zo'n 50 van de 70 medewerkers van InfoMil werken voor de helpdesk, vaak in deeltijd. Het taakveld geeft voorlichting over milieuwetgeving. Dit werkt twee kanten op. Aan de ene kant merkt zij aan de vragen die zij krijgt dat er iets ontbreekt aan de voorlichting of een besluit te ingewikkeld is en stelt voor aan het ministerie van VROM om de voorlichting aan te passen. Aan de andere kant denkt zij actief mee met het ministerie bij het opstellen van nieuwe besluiten over hoe de voorlichting vorm te geven. Dit gebeurt steeds meer in samenspraak met andere afdelingen binnen Milieu en Leefomgeving. Bodem+ en Uitvoering Afvalbeheer hebben ook een voorlichtende taak en de medewerkers van Bodem+ draaien mee in de helpdesk.Soms doen zich er wel rare situaties voor. De ene afdeling van SenterNovem moet vanuit een EZ opdracht een maatregel stimuleren, terwijl vanuit InfoMil juist wordt gezien dat die maatregel conflicten oplevert met de milieuwetgeving.InfoMil wordt steeds meer een onderdeel van SenterNovem. De merknaam is echter, zoals bij veel samenwerkings verbanden nog heel sterk. Het zou verwarrend zijn voor het veld om deze op te geven. InfoMillers voelen zich echter steeds meer welkom. Waar ze vroeger niet echt bij Senter en niet echt bij Novem hoorden, zijn ze nu echte SenterNovemmers.'''
