["http://www.ricklindeman.nl/files/archive-apr-2005.html"]
title = "Rick filosofeert"
full_description = '''Apr 2005 Rick filosofeert | Jul 2005 | Mar 2005 Awakenings April 200525/04/05 10:20 Opgeslagen in: PartyWas ook weer een heerlijke topper, voor het eerst weer terug in de gashouder.Tags: AwakeningsGridrunner+++23/04/05 14:32 Opgeslagen in: GamesGeschreven voor Macgames.beJeff 'YAK' Minter begon begin jaren'80 met het schrijven van computerspellen. Hij wist al snel veel een grote schare fans op te bouwen door zijn focus op pure gameplay, gebruik van ongebruikelijke helden als Kamelen en Lama's. Beroemde spellen waren Idiris Alpha en Attack of the Mutant camels voor de Commodore 64 en Gridrunner voor de Vic20. Na de tijd van de 8 bit spelcomputers werd het steeds moeilijker om in je eentje een software huis te runnen. Minters bedrijf, Llamasoft had het dan ook erg moeilijk.Hij besloot zijn volgende spel, Llamatron, een kloon van het klassieke arcadespel Robotron voor de Amiga en Atari ST, maar dan met Lama's in de hoofdrol uit te brengen als shareware. Dit was een gigantisch succes, en het shareware concept werd sindsdien veel vaker gebruikt. Jeff maakte vervolgens een aantal spellen in dienst van andere bedrijven, zoals het klassieke Tempest 2000 voor de Atari Jaguar. Hierin bleek ook het tweede element dat kenmerkend bleek voor Yak als game designer. Het psychadelische element in spellen, waardoor je volkomen in trance raakt probeert hij actief te stimuleren, door de muziek en beeld in veel felle kleuren op elkaar af te stemmen. Hij heeft ook een aantal programma's gemaakt, zogenaamde licht synthesizers, waarin je niets anders doet dan schilderen met licht. Deze trance wordt door hardcore gamers het bereiken van 'The Zone' genoemd. Dit overkomt mensen vooral in klassieke arcade spellen, maar ook in moderne 'first person shooters' kunnen mensen hier in raken. Een ander voorbeeld hiervan is het schitterende Ikaruga (Dreamcast/Gamecube), wat aan de oppervlakte een simpel verticale shoot'em up lijkt, maar een in de praktijk een welhaast zen-boeddhistische ervaring oplevert, wanneer met tussen de veilige eigen kleur en de vijandelijke andere kleur heen laveert, en wanneer dit uitkomt deze twee juist omwisselt. Gridrunner op de Vic-20Maar nu is het de vraag of Yak dit nog steeds kan. Immers, Games zijn tegenwoordig nog veel grotere massaproducties dan tien jaar geleden. Wat voor kans heeft een invidu nog om een hit te scoren nu de spellen industrie gedomineerd worden door mensen die elk jaar een nieuwe versie van hun voetbalspel massief marketen in plaats van met liefde een nieuw idee creeëren? Yak gaf zichzelf weinig kans en besloot in 2001 spellen voor de PocketPC te schrijven. Dit kleine formaat zou meer passen bij de bescheiden, doch leuke spellen die hij voor ogen had. Hij ontwikkelde Hover Bover en Deflex voor dit formaat. Hij moest ze echter toch testen, dus ontwikkelde hij een 'Virtual Machine" waarop hij dat kon. Op de PC bleken ze een nog veel groter succes dan op de pocketPC. Gridrunner ++ startte ook als product voor deze PDA, maar al snel groeide het spel uit zijn jasje en eind 2002 werd het alleen op de PC geproduceerd. Steeds meer bezoekers van zijn forum kochten echter een Mac, en dus ontstond er vraag naar een conversie. Gary 'Gravy' Liddon heeft dit uiteindelijk op zich genomen en zo is er nu Gridrunner++ voor de Mac.Gridrunner++ is een update van het klassieke Gridrunner (1982) op de Vic 20. Dit was een variant op Centipede (Atari, 1980). In Gridrunner komen grote wormen vanaf de bovenkant van het raster slalommend naar beneden. Jouw taak is om deze kapot te schieten. Aan de zijkanten van het raster staan twee schepen klaar om een hele lijn van het raster voor jou dodelijk te maken. Gridrunner++ neemt deze basis elementen (wormen, schieten, raster, dodelijke lijnen), gooit ze door elkaar, voegt geweldige samples, upgrades en psychadelische graphics toe en maakt er een heel nieuw spel van. Je beweegt nu vrij over het beelscherm, spaart schaapjes voor betere wapens, zet met een druk op de knop de gevreesde 'sheepiezapper aan het werk, en na 10 schapjes krijg je hulp van een groot schapenhoofd dat de wormen voor je vernietigd. Maar het is de vraag of een remix van een spel uit 1982 anno 2004 nog steeds hip en leuk. Laten we analyseren of dat zo is. Het eerste wat opvalt zijn de graphics. De beelden zijn los van elkaar niet echt bijzonder, maar het samenspel van alles dat uit elkaar plof maakt het tot heerlijke chaos, die desondanks altijd te volgen blijft. Daarnaast zijn ze in elk level anders. Het geluid ondersteunt dit met perfecte en soms zelfs erg grappige samples. Voor de PC is er zelfs een extra versie met scheldwoorden. Samen is het een ultieme trippy ervaring, zeker op een volledige scherm, wanneer de lichten zacht staan en het geluid hard.Toch was dit allemaal niet van belang geweest als het niet zo verschrikkelijk goed speelde. Je bedient je schip met de muis, wat een heel aparte ervaring is. Daarnaast zijn alle aanvalspatronen zo goed ingesteld, dat je alleen door je eigen imperfectie sterft. Zoals het een goede shoot\em up betaamd, is de verhouding tussen risico en beloning steeds optimaal. Telkens weer moet je afwegen een schaapje te pakken of veilig in de hoek te blijven. Bovendien krijgen we een betere versie dan de PC. Highscores worden bij de Mac-versie online bewaard. Op dit moment staat mijn score van 3.3 miljoen nog trots in de top 20 allertijden, maar deze zal snel sneuvelen nu het spel echt uit is. Ook krijgen we een Turbo Nutter Mode, die zo intensief is dat iemand hem op het Llamasoftforum beschreef als 'de 100 meter lopen, omdraaien en dan weer opnieuw.' In een recensie hoort natuurlijk ook kritiek. Allereerst, je moet wel van schietspellen houden natuurlijk, en ter vergelijking met Project Nomads, of Railroad Tycoon 3 is dit spel misschien enigszins simpel, maar wie maalt daarom als hij vloeken en zuchtend een level verder komt en zich trots voelt omdat hij een paar vliegende vulcaanballen heeft vernietigd. Wel heeft het spel af en toe last van OSX. als mail wordt opgehaald of met de muis perongelijk in het Dock terechtkomt merk je vertraging.Conclusie: Het is het ideale spel om op de achtergrond te laten draaien en even vijf minuten op te starten. Hoewel, vaak blijk je dan pas uren later te kunnen stoppen. Het spel is goedkoop en je steunt direct de maker en niet een groot softwarehuis, zodat onafhankelijke creatieve geesten kunnen blijven ontwikkelen. Koop dit spel. Als je nog nooit in 'de zone' bent geweest zal je leven hierdoor een ervaring rijker zijn.Ontwikkelaar: Llamasoft Prijs: 6 pond en is bij hier Een demo van het spel kun je hier downloaden Score: • Grafisch: 8 • Geluid: 8 • Speelbaar: 10Totaal Score: P.S.: Er gaan geruchten dat Jeff binnenkort gaat beginnen aan Llamatron ++ op de Mac. Het zou het eerste spel zijn dat hij zelf ontwikkeld op de Mac. We zijn benieuwd, eerst werkt hij aan het mega project Unity op de Gamecube. Ondertussen kan je de meeste oude spellen van Llamasoft spelen via een emulator, zoals Llamatron bijvoorbeeld via NoSTalgia, of Gridrunner via Power20 (meer info hierover op macretro) The hotel of Felipe06/04/05 08:12 Opgeslagen in: Sport : EnglishI have been a Fluminense fan since i first heard of the legendary Fla-Flu derbies. In the early 90s there was no way of obtaining information about them in the Netherlands. Luckily, in 1994 Sensible World of Soccer arrived. the first great football game to include teams from all over the world. I played the Fla-Flu derby with heroes like Rogerinho and Ricardo Rocha. Read More...Games in the Favela01/04/05 16:13 Opgeslagen in: Games : English was in Vigario Geral, last month. It’s a favela – or shanty-town – in Rio de Janeiro, near to the International Airport.In August 1993, 21 civilians were killed there, when a group of hooded, heavily armed men fired indiscriminately at residents for a couple of hours. The attack was carried out by military police officers in revenge for the killing of four policemen at the hands of Vigario Geral-based drug-runners. At one point, they gunned down a family of seven in their own home. Read More...'''
