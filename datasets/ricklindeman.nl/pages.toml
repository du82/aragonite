["http://www.ricklindeman.nl/files/0f9db95991c91b2ffac2b9db9d727536-256.html"]
title = "3x Tijgers! | Sport | rick filosofeert"
full_description = '''3x Tijgers!18/12/05 12:20 Opgeslagen in: SportOm 8u kwamen de helden in de Jaap Eden hal.Sommigen waren in Woerden blijven steken.Maar dat mocht de pret niet drukken.Bij Sjaak Swart werd geproost op het nadere succes van de Amstel Tijgers.De hal van de eerste wereldkampioen schaatsen vulde zich langzaam.Ze gingen er eens goed klaar voor zittenTilburg begon iets sterker. Toen het onvermijdelijke eerste doelpunt viel.Bleken we midden tussen de trapperstifosi te zitten,die ondanks de slechte competitiestart,Met een gevulde bus waren gekomen.De tweede periode klonk het "Let's go Tigers!" steeds vaker.Onze jongens, bevrijd van een sponsor die hun naam vervuilde,Vielen krachtig aan.En Schutte wist in een chaotische situatie de puk over de lijn te krijgen.In de derde periode wilden de trappers wel,Maar langzaam voelden de tijgers fans aanDat we het zouden winnen. en dus volgde de 2-1, door Kalousek.Een laatste wanhoopsoffensief der Brabanders werd geneutraliseerdEn de empty netter bekroonde het werk.Veel bier van Sjaak volgde nog.De Trappers verdronken hun puntloze status.Wij namen een voorschot op het kampioenschap.De avond was echter nog niet over.Een snel toegezwinde tram 9Bracht ons tot de Meander.Alwaar een Damesjaarclub op ons wachtteDeze Groningsen heetten niet toevallig Tigre,En de avond werd volgedansd,Zeker toen vers uit haar bed de nieuwe geliefde ener topper kwam opdagen.De volgende ochtend was zwaar voor de schrijver dezes.De derde groep tijgers wachtte namelijk op hemZe waren uit tour uit de stad der kakkerlakken,En brachten een middag voor Argentijns Cinema genot met zich mee.Meer foto's van deze avond vind je hierDe discussie op het ijshockey forum over deze wedstrijd vind je hierTags: Icehockey'''
