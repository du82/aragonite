["http://www.ricklindeman.nl/files/359b64d2ac32cdaf9991ff1376c7d694-269.html"]
title = "Awakenings | Party | rick filosofeert"
full_description = 'Awakenings16/02/06 10:44 Opgeslagen in: PartyEen rustige Awakenings dit keer, maar toch weer vol toppers. DJ Preach was voor ons de grootste held, zoals je zelf kan beluisteren via deze set. Er waren ook nieuwe helden.Om 22.15 was Rick in onze nieuwe stamkroeg "De Staatsman". Hij was nog alleen, maar al snel zag hij iemand iemand binnenstormen. Hij vermoedde dat het BJ was, de zwager van de Twentse topper. Toen hij vroeg het hem inderdaad was, keek het aanwezige Amsterdamse publiek of ze een homo-blind date zagen, maar dat mocht de pret niet drukken.Al snel moest de Twent afscheid nemen van zijn gade en konden we de gashal betreden. Het begon redelijk rustig met Remi, maar toen Bart Skills en later Preach en Jay Denham kwamen, was het ouderwets hakken. en onze BJ bleek toch veel oude bekenden hier te hebben. We zagen hem niet meer terug. Om 7u was de Awakenings weer veel te snel voorbij. In april is er gelukkig weer een. Maar dat stelt ons weer voor een nieuw probleem. Zowel de zaterdag als de vrijdag zijn te goed!Awakenings profiel'
