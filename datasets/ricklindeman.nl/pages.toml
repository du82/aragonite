["http://www.ricklindeman.nl/files/abcdcb2e517855cbbce06b2373024e47-41.html"]
title = "Pantani � Morto | Sport | rick filosofeert"
full_description = "Pantani è Morto14/02/04 17:55 Opgeslagen in: Sport16 januari 2004De Piraat is niet meer. Hij is dood. De Man die het wielerennen liet geloven in de illusie is slachtoffer geworden van de tragiek die de ware wielerheld omlijst. Als Icarus daalde hij van de hoogste hoogten van 1998 tot het diepste dal in een hotelkamer in Rimini.Hij was de klimmer die wij het meeste bewonderden. We hebben zijn vader ontmoet in zijn bar (zie hier) en gejuicht toen hij Ulrich versloeg op de toppen van de alpen. Het olifantje is vertrokken.Marco Pantani, 1970-2004. Rust zacht. Tags: Wielrennen, dode_helden"
