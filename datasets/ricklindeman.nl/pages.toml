["https://ricklindeman.nl/de-betekenis-van-reizen"]
title = "De Betekenis van Reizen – Rick Lindeman"
full_description = "De Betekenis van Reizen admin | November 29, 2021 | Publicaties | No Comments Samen met Klaartje Arntzen en Mirella Schutgens schreef ik deze paper over de betekenis van Reizen voor het Colloquium Vervoersplanologisch Speurwerk 2021 te Utrecht. Het hele paper is hier online te lezen Teresie fietst van Kaapstad naar de Noordkaap. De Noorse was ooit voor studie in Zuid-Afrika beland, maar wilde niet meer vliegen. Het klimaat immers. Tijdens reis ontmoet ze mensen van Botswana tot Oostenrijk (Eén van de auteurs kwam haar tegen ). Ondertussen legde ze aan schoolklassen over de hele route het belang van klimaatneutraal reizen uit. Als er één reis betekenis heeft, dan is dat misschien een dergelijke reis. Maar als de afgelopen jaren ons iets hebben geleerd is het dat ook onze dagelijkse fietstochtjes waarde en betekenis hebben. View this post on Instagram A post shared by Teresie Hommersand (@teresiehommersand) Over de effecten van mobiliteit zijn boeken volgeschreven. Betekenis gaat over meer: over een doel hebben, het ergens bij horen, verhalen, en het onderdeel zijn van iets groters. En daarom moeten we breder kijken dan alleen reistijdverlies. De term ‘voertuigverliesuren’ kan op de schop, deze gaat immers uit van een negatieve of ten hoogste neutrale waarde van reistijd. Andersoortige effecten zijn hiermee onvoldoende in beeld. En ook de betekenis van de ene vorm van reizen als belangrijk onderdeel van een reis met een andere modaliteit is ook vaak onderbelicht. Zo is fietsen de grotere drijfveer achter het treingebruik in ons land. Een bredere scope leidt tot andere waardering en afwegingen bij investeringen in ons mobiliteitssysteem, en past beter bij het streven naar brede welvaart en sustainable development goals. In het boek “The Power of Meaning” geeft Emily Esafani Smith (2017) lading aan de term betekenis. In haar werk beschrijft ze dat geluk misschien niet is waar we naar moeten streven, maar naar het betekenis geven aan de dingen die we doen. Smith onderscheidt 4 aspecten. 1. Allereerst willen we ergens bijhoren (belonging). 2. Ook geeft hebben van een doel (purpose) onze zaken betekenis. 3. Het vertellen van verhalen (story telling) bij de koffieautomaat is van wezenlijk belang. 4. Tenslotte beschrijft Smith transcendente ervaringen, die het normale overstijgen We willen het gevoel hebben dat we behoren tot iets dat groter is dan onszelf, alsof we de grenzen van onze dagelijkse en persoonlijke bestaan overstijgen en onderdeel worden van iets dat groter is dan onszelf. Dat fietsen gezond is weet iedereen. Vooral de fysieke aspecten zijn meetbaar, maar de sociale en mentale aspecten zijn vaak nog onderbelicht. De waarde van ontmoetingen en sociale interactie wordt maar zelden meegenomen in afwegingen. Dit terwijl fietsen een van de weinige manieren van vervoer is, wat zowel als middel fungeert om ergens te komen, als ook een doel op zichzelf kan zijn. En zelfs een middel voor het geestelijk verwerken van zowel heftige gebeurtenissen als creatieve hersenspinsels. Fietsen heeft ook betekenis in de zin dat het een onderdeel is van de identiteit. Het gaat dan zowel om de identiteit van personen als van onze sociale samenleving als geheel. Initiatieven als ‘Doortrappen’ zorgen ervoor dat ouderen langer blijven fietsen en sociaal actief kunnen blijven. Over die betekenis willen we het in dit kampvuur met elkaar hebben. Het hele paper is hier online te lezen. Je kan Teresie hier steunen. jQuery(document).ready(function($) { $.post('https://ricklindeman.nl/wp-admin/admin-ajax.php', {action: 'wpt_view_count', id: '196'}); }); Related Posts Games in the Favela No Comments | Oct 27, 2017 Archeologie onder water No Comments | Jun 14, 2023 Experimenteren in de keten No Comments | Oct 27, 2013 Het voorkomen van een braindrain No Comments | Jun 18, 2013 About The Author rickthuis"
