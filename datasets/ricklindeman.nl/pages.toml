["http://www.ricklindeman.nl/files/5a228803730422d276e2fa972ab12bba-319.html"]
title = "Renzo Piano | Rome | rick filosofeert"
full_description = "Renzo Piano13/12/99 10:14 Opgeslagen in: RomeOok Italianen zijn geïnteresseerd in het ‘heilige’ Nederlandse planningsstelsel. Dit bleek op het eerste college van de dag. Garano gaf aan Rick een voorstel van het Italiaanse verbond van aannemers (Associazione nazionale construttori edili) voor een herziening van de Italiaanse planologische wetgeving. Hierin stond een uitgebreide analyse van de Nederlandse praktijk, vanaf de corona van onze regina Beatrice, tot de consiglio comunale. Hopelijk zal onze student hier nog wat aanhebben. Thuis werd verder gewerkt aan de kaarten voor het Latina-project, met op de achtergrond Rachmaninov. Hierna vertrok Rick naar de stad. Per e-mail stuurde onze arme stakker een noodkreet naar zijn ouders om meer geld, waar gelukkig snel op werd gereageerd.Om 17u begon een workshop over het werk van Renzo Piano op de Facoltà. Dit is de geniale architect die ondermeer het Amsterdamse NewMetropolis en de nieuwe kerk voor de zalig verklaarde Padre Pio heeft gebouwd. Zijn werk werd uitvoerig belicht, maar helaas moest onze architectuurstudent snel weg. Omdat een meeting met zijn Latina-groep hem wachtte. Het geleverde werk werd besproken en Ricks colbertje werd elegant gevonden. Na een nieuwe afspraak gepland te hebben vertrok onze Odysseus naar het Piazza Repubblica, alwaar hij met Mireia had afgesproken om naar de film te gaan. De film werd una relazione privata, een heel erg ‘franse’ film (liaison pornografique was de originele titel), waarin beschaafd werd verteld hoe mensen die begonnen om een ‘onschuldige’ fantasie te beleven, welke bleef onbekend, eindigden in een psychologisch drama. Na de film vertrok onze ‘liaison’ naar Vitinia, waar we Adria troffen. Hij was volgens Mireia jaloers op onze Amsterdammer geworden. Op een Barcelonees tijdstip werd daarna het avondmaal genoten waarna Beatrice Dante de eerste glimpen van het paradijs liet zien."
