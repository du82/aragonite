["http://www.ricklindeman.nl/files/archive-aug-2005.html"]
title = "Rick filosofeert"
full_description = '''Aug 2005 Rick filosofeert | Sep 2005 | Jul 2005 Trouwfeest Suzan a la France29/08/05 10:33 Opgeslagen in: WerkOpeens was ze aan het Pogo'nHet leek niet meer uit te maken of ze een trouwjurk aanhad.Stevig botste ze tegen Angelique aan.Maar nu mocht ze ookHet feest was immers goed gegaan.Jo had een indrukwekkende maaltijd neergezet.De zon scheenEn wat belangrijker was:Niemand had zo'n vervelend stukje gedaan.En dus kon er gedanst worden tot diep in de nacht.Meer foto's hierBachelor Brazilieiro!29/08/05 10:02 Opgeslagen in: PartyEn toen stonden ze daar eensIn het kanariegeelOm de man te begeleiden op zijn laatste stapavond als vrijgezel.Met verre uitzichten.Ondeugende vrouwenSpannen LikeurLekker etenGoed 'Ricken'& echte vrienden.Wat wil een man nog meer? Jullie zijn helden!Meer foto'sUrbi et Orbi29/08/05 09:40 Opgeslagen in: SportWe waren met velen.We kwamen op achterstandMaar toen kwam de Dappre SneijderEn zette Urbi dapper aan,Ajax in de Champions League! FC Thun?Meer hierTags: AjaxLegendarisch concert de Dijk25/08/05 00:54 In een nu al legendarisch concert trad de Dijk op in Bloemendaal. Niet gehinderd door regen stonden Jolanda, Paula, Edwin en ondergetekende de helden aan te moedigen. Van de Lubbe gaf aan dat hij een kaartje voor ons had moeten kopen.Meer foto's hierSuzan getrouwd23/08/05 16:52 Rick kon net oefenen voor het ja-woord, daar één van zijn favoriete collegae, Suzan Reitsma (Vlijmen, 1975) net in het huwelijk trad. Zaterdag volgt het feest in Frankrijk.klik hier voor meer foto'sEn Garde19/08/05 21:51 Door Ineke van HoutenOp 17 augustus hebben het oud bestuur van JongEZ (Op Scherp) en het nieuwe bestuur ‘Van Alle Markten Thuis’ de degens gekruist! Naeen pikant etentje bij de Thai togen zij naar het sportpark in Leiden, alwaar de basisbeginselen van het schermen hen werd bijgebracht. Stinkende pakken en schrammen negerend maakten zij zich op voor de ultieme krachtmeting. De oude garde tegen de jonge secondanten, met de eeuwige roem als inzet, hetwerd een memorabele avond met een hoog Zorro-gehalte! Ondanks de vliegende start van de nieuwelingen en de strijd op het scherpst van de snede, wist uiteindelijk de ervaring en kalmte van het oud bestuur de doorslag te geven. Hoewel het oud bestuur het zwaard inmiddels heeft overgedragen, moet dan ook geconstateerd worden dat zij nog niks van hun scherpzinnigheid hebben verloren!Foto's op mijn Flickr StroomMooie Oogst19/08/05 17:19 Ik wilde even melden dat bij ons de introweek is begonnen; bij jullie duurt dat nog even.Ik ben tot nu toe zeer te spreken over de oogst.Als je even vergeet dat het voor mij dit jaar 10 jaar geleden isEn dus de dames uit 1987 komen. Doch gisteren wandelend door de stadviel mij op hoe fris en sprankelendDe lichting van dit jaar waggelde door de stad.Van sport-activiteitje op de mariaplaats.tot biertje op de gracht.Het ziet er heerlijk uit. De slagroom op het toetje was echter.Het stringetje van het meisje dat gisteren voor me skateDat ondeugend boven de broek uitstak.Toen ik naar huis fietste. Het leven is toch zo mooi en simpel af en toe. RickDancevalley15/08/05 17:19 Opgeslagen in: PartyDancevalley 2005Dancevalley 2005 was een modderig maar heerlijk feest. Juist omdat het weer zo wisselvalligwas ontstond er een "I survived dancevalley'05 sfeertje. 's Avonds zijn we nog naar een afterparty geweest. Deze rare column werd daar over geschreven.Ook was de recensie van het feest nogal eenzijdig, vandaar deze gepubliceerd ingezonden brief in de volkskrant.Geachte Volkskrant, Hoewel ik met genoegen uw recensie van Dancevalley las, vond ik toch dat de regen wel heel erg de nadruk kreeg. Juist doordat die er was was het net iets minder druk, en ontstond er een 'we survived Dancevalley'05' gevoel, wat bij de meesterlijke optredens van JP en Carl Cox tot een uitzinnige sfeer leidde. Er wordt wel verwezen naar de witheid van het hardstyle-publiek, maar niet naar het feit dat house juist meer en meer een kleurrijk publiek lijkt aan te spreken; waar anders in Nederland zie je zoveel Marokkanen en Nederlanders een grote duim naar elkaar opsteken? De commercialiteit werd genoemd, maar er waren juist weer goedkopere biertjes, en het hele busstation dat gebouwd werd voor een goede doorstroming maakte zelfs op mij als planoloog een grote indruk. Het was een heerlijke dag en dat mijn wasmachine overuren moest draaien, dat mocht de pret niet drukken.Rick Lindeman'''
