["http://www.ricklindeman.nl/files/archive-apr-2004.html"]
title = "Rick filosofeert"
full_description = '''Apr 2004 Rick filosofeert | Jun 2004 | Feb 2004 Rick wint de gold-race14/04/04 22:51 Opgeslagen in: SportHij houdt het in ieder geval volOm 5.15 werd Rick uit zijn bed gebeld door Braakensiek, zijn oude Nabelfuhrer; over een half uur zou deze DJ annex tandenborstelverkoper voor de deur staan, om onze held op te halen. Vandaag zou Rick voor de tweede keer de Amstel Gold Race fietsen.Zijn gedachten gingen uit naar de weinige voorbereiding die hij had gehad, een rondje naar de oude-vestingstad Woerden en een paar keer de brug over het romantische Amsterdam-Rijnkanaal over. Doch, vastberaden als hij was, zou hij zich hier niet door laten afschrikkenBraakensiek was wat laat, daar de koelvloeistof uit opwinding over wat zou komen reeds was weggevloeid, en dus tilde Lindeman zijn fiets in de Golf, terwijl Menno vloeistof in zijn dampende wagen des volks goot. Al ras gingen zij met een kilometer of 145 per uur over de Route du Soleil om tegen achten te arriveren in de oude mijnstad. Hier werd Rick's voiture helaas afgekeurd, maar na een kleine operatie van het ros kon hij zijn weg vervolgen.Samen met Paul, de fameuze Limburgse onderwijzer, klikte hij zijn schoenen vast op de pedalen, om na een foto-shot aan de eerste beklimmingen te beginnen. De start viel om 9.32, Braakensiek en De Twent waren al eerder begonnen. Het begin viel niet tegen, constateerde Rick nadat hij om 11.55 op de helft van de Route aanschoof voor de de lunch.Toen begon helaas de echte uitdaging, na kilometers vals plat en tegenwind deed de beklimming van de Bergseweg pijn, om nauwelijks herstel later aan onze Wielerheld te bieden. Gelukkig gaf de Fromberg weer moed aan Rick, met steeds een klein klimmetje en een herstelstuk er na. Vervolgens volgde de gevreesde Keutenberg. Rick stond al snel bijna stil, maar wist toch door te trappen. Todat iemand voor hem afstapte. Toen was Rick verloren en moest verder om hoog lopen.Vanaf de top van de Keutenberg restte hem slechts een winderig plateau, waarna een lange afdaling hem tot in het centrum van Valkenburg bracht. Daar werd werden de renners binnen gehaald als helden, met de terrassen aan beide zijden van de koers gevuld. Toch wachtte er nog een hindernis, de Cauberg, onder de lezers van deze site vooral bekend met een andere betekenis. Rick zette nog een keer aan, kreeg toen hij het even moeilijk kreeg nog een zet, en klom dapper door, tot hij de speaker het verlossende "en daar komt Rick Lindeman uit Utrecht, na 100 zwaar bevochte kilometers" hoorde zeggen.Vervolgens begon het lange wachten, onder het genot van het gele gerstenat der hoofdsponsor. De Limburger was reeds eerder gearriveerd. Tweeenhalf uur later kwamen de geslagen helden van de 155 kilometer binnen en kon de reis terug worden aanvaard.Een dag later versloeg Davide Rebellin Michael Boogerd in de sprint op diezelfde Cauberg en won de 36ste Amstel Gold Race.Tags: WielrennenAwakenings Svezia11/04/04 09:09 Opgeslagen in: Party ￼ Vanuit Goteborg en Stockholm daalt een pure Techno-vorm af naar onze streken. Op eerste paasdag stonden wij (Tijkotte en den schrijver dezes) op een koude pont, die ons bracht naar de loods, waar ook vroeger de boten uit Scandinavie afmeerden. Geverfd in geel en blauw betraden wij de arena. Er waren alleen Zweedse DJ's bij deze Aflevering van Awakenings. Het was nog rustig, maar de geluiden van de beekdschone DJ Shiva begeleiden ons naar de garderobe. Hier was er een nieuwe innovatie: iedereen kon een kluissleutel huren, zodat er niet aan het einde een enorme rij ging ontstaan. ￼ De muziek installatie draaide ook eindelijk naar behoren, na tegenvallende sounds in eerdere afleveringen. Al snel troffen wij Jossie, dans-heldin uit Rimini. En samen met Roberta, onze inspiratiebron van Dancevalley, gingen wij op zoek naar de andere helden: Walter, Richard, Suzanne, Martijn. Doordat het buiten vrij koud was, was het binnen een keer niet te heet, en konden de waaiers in de zakken blijven. ￼ De muziek versnelde al spoedig, om in zuiver Techno over het leger der Vikingen neer te dalen, onze helden voelden zich in een waar Walhalla. DJ Dahlback, Hardcell & Grindvik en Adam Beyer vulden de avond. Het sfeertje was weer klassiek awakienings, geheel geen agressie of drukte, gewoon liefhebbers onder elkaar. Op maandag ochtend, terwijl het ochtendzonnetje gloorde gingen onze helden met een tevreden glimlach weer naar huis, om daar helaas te ontdekken dat Jimmy in de tussen tijd op avontuur was gegaan.... RickTags: Awakenings'''
