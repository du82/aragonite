title = "Voorspelbare, maar verrassende nieuwe Gibson  | rick filosofeert"
full_description = "Voorspelbare, maar verrassende nieuwe Gibson 17/01/01 16:31 De nieuwe film van Mel Gibson ‘What women want’ is een romantische komedie. Hij is dan ook vrij voorspelbaar. Als Yup ontdekt hij de ware liefde door een ‘gimmick’. De situaties die de ‘gimmick’ oplevert, zijn de moeite waard.Nick Marshal (Gibson) is een ‘echte man’. Voor hem zijn geld en mooie vrouwen het belangrijkste in het leven. Hij is een succesvolle reclameman en verwacht promotie te maken. Nick is dan ook geschokt als een vrouw ‘zijn’ functie krijgt. Darcy McGuire (Helen Hunt) wordt aangenomen om de vrouwelijke doelgroep te benaderen.Terwijl hij allerlei vrouwenproducten probeert, om ook reclame voor de vrouw te kunnen ontwikkelen, krijgt hij een ongelukje. Nick kan ineens horen wat vrouwen denken. In het begin ziet hij deze gave vooral als een last. Later ontdekt hij dat hij haar kan gebruiken. Zijn kunstje is niet alleen nuttig om vrouwen het bed in te praten, ook kan hij het gebruiken om de ideeën van zijn baas af te pakken.Zoals verwacht mag worden in een romantische komedie, wordt hij verliefd op de vrouw die hij eerst bestreed en wordt leert de hoofdpersoon ook zelf iets. Voor het verhaal hoef je dan ook niet te gaan. De film levert wel mooie scènes op als Gibson direct reageert op wat vrouwen denken. Die vrouwen geven niet altijd aan zichzelf toe wat ze denken, wat in het echt misschien ook wel eens het geval is.Voor mannen is het misschien moedeloos om te zien dat vrouwen toch heel anders zijn dan ze denken. Voor Gibson is het ook een schok om te zien dat hij toch niet het geschenk van god aan de vrouw is. Hij wordt op den duur een beter mens van.Door deze film zal je niet snel zelf een beter mens worden. Voor een gezellig avondje uit met je nieuwe liefde lijkt hij wel geschikt. In de film is eens een andere Gibson te zien dan de held uit Braveheart of de gladde politieagent in ‘Lethal Weapon’ Hij blijft echter zichzelf.Rick Lindeman‘What women want’Regie Nancy MeyersMet Mel Gibson, Helen Hunt, Mariso Tomei, Mark FeuersteinVanaf 8 februari in de bioscoopO.a. In de grote Pathé Theaters"
