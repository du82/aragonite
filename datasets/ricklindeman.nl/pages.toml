title = "Mooie Oogst | rick filosofeert"
full_description = "Mooie Oogst19/08/05 17:19 Ik wilde even melden dat bij ons de introweek is begonnen; bij jullie duurt dat nog even.Ik ben tot nu toe zeer te spreken over de oogst.Als je even vergeet dat het voor mij dit jaar 10 jaar geleden isEn dus de dames uit 1987 komen. Doch gisteren wandelend door de stadviel mij op hoe fris en sprankelendDe lichting van dit jaar waggelde door de stad.Van sport-activiteitje op de mariaplaats.tot biertje op de gracht.Het ziet er heerlijk uit. De slagroom op het toetje was echter.Het stringetje van het meisje dat gisteren voor me skateDat ondeugend boven de broek uitstak.Toen ik naar huis fietste. Het leven is toch zo mooi en simpel af en toe. Rick"
