["http://www.ricklindeman.nl/files/archive-feb-2006.html"]
title = "Rick filosofeert"
full_description = '''Feb 2006 Rick filosofeert | Mar 2006 | Jan 2006 Skating hero16/02/06 19:39 Rick participated at the 28th winter olympics on tuesday, or did he?Film courtesy of the Dutch Railways and their Torino InitiativeAwakenings16/02/06 10:44 Opgeslagen in: PartyEen rustige Awakenings dit keer, maar toch weer vol toppers. DJ Preach was voor ons de grootste held, zoals je zelf kan beluisteren via deze set. Er waren ook nieuwe helden.Om 22.15 was Rick in onze nieuwe stamkroeg "De Staatsman". Hij was nog alleen, maar al snel zag hij iemand iemand binnenstormen. Hij vermoedde dat het BJ was, de zwager van de Twentse topper. Toen hij vroeg het hem inderdaad was, keek het aanwezige Amsterdamse publiek of ze een homo-blind date zagen, maar dat mocht de pret niet drukken.Al snel moest de Twent afscheid nemen van zijn gade en konden we de gashal betreden. Het begon redelijk rustig met Remi, maar toen Bart Skills en later Preach en Jay Denham kwamen, was het ouderwets hakken. en onze BJ bleek toch veel oude bekenden hier te hebben. We zagen hem niet meer terug. Om 7u was de Awakenings weer veel te snel voorbij. In april is er gelukkig weer een. Maar dat stelt ons weer voor een nieuw probleem. Zowel de zaterdag als de vrijdag zijn te goed!Awakenings profielInterview in Retrogamer10/02/06 14:16 Opgeslagen in: English : GamesRick was interviewed by Retrogamer. I was about his mac emulation site www.macretro.tk. Click the cover for scans. Alcmaria Victrix01/02/06 20:33 Opgeslagen in: SportYesterday was the Quarter final of the Dutch cup.I admit, it misses some of the glory of the FA cup,but i did found something here which I though we had lost.MVV Maastricht, a small first division side, reached the quarter final for the first time in 10 years.I had followed them during their cup run,Seeing them defeating the noble dillettant side of AFC in the old Olympic stadium of Amsterdam, built for the 1928 games of the IXth Olympiad.But the club from the city of the infamous treaty, now had to go to Alkmaar, to the mighty AZ.It was more than just a match between two clubs, it was a match between a club filled with money and a club which just managed to survive only a few years ago.AZ, sponsored by the Evil Scheringa, a loan shark, but who buys hisindulgentia by sponsoring lots of positive things.On the other hand, it can't be praised enough, for playing the most attractive football in the Netherlands.So, our little team from Maastricht wouldn't stand a chance.We had to face the mighty Louis van Gaal, return from Barcelona to his home soilWe had to face two footballers who had come from MVV and were now internationals, Perez, prince of the rotten kingdom of Denmark and Denny Landzaat.We had to enter the arena where European giant like Villareal and theGlasgow Rangers had to bow.But the stadium, the old Alkmaarderhout, was the first thing thatfilled our hearts with love.Built in 1948, it was kept together by ropes and the skyboxes wereliterally hanging in the sky, from the roof of the stands.We could stand in the stadiumNext year it would be replaced by the "DSB management stadium", but for now the old theatre was still standing.First we had to get our tickets though.As we came from Amsterdam, we didn't have the obligatory Bus-Ticketcombi ticket from Maastricht.Luckily here it appeared that Maastricht is nearer to the Italianstronghold of Liège then to AmsterdamA local Don Corleone provided us with a white envelope, after we hadgiven him a similar envelope.Nothing was said, but we had our tickets.A friendly pub was nearby.The barmaid represented for us the very essense of North-Hollandic beautyShe was tall, blond, not that elegant, but her front would have made any man happy.Although we were easily recognisable between the North-Hollanders we shared our Beer.We went to stadium.We stood between 600 Maastrichtenaren.The motto of Alkmaar is "Alcmaria Victrix"Remembering that the struggle for independance against the spaniards started at siege of the city.MVV lost, inevitably, 4-0But on the other had, the real football and its sphere that we love won, Alcamaria Victrix.And the Maastrichtenaren kept singing for the whole 90 minutes and during the night."Come with us to Maastricht,If you don't know where it is,It is the city in the extreme south,The pearl of the Limburgian lands,The city on the roaring meuse,Not often chanted about, alas,Founded and built by the RomansCome with us, to Maastricht."** it rhymes in dutch, obviously....Klik op de filmspeler of hier om de film te zienKlik hier voor de topic op de MVV Maastricht-forumsRick wint nutteloze prijs!01/02/06 20:00 Opgeslagen in: WerkOké, het is niet echt de nobelprijs voor de vrede maar zie hier,Rick die de SenterNovem-Mailbox-Opruim-award in ontvangst neemt.'''
