["http://www.ricklindeman.nl/files/366d5e9eadd3840718404b31afae25e0-474.html"]
title = "Reserveren | Rome | rick filosofeert"
full_description = "Reserveren22/12/99 11:22 Opgeslagen in: RomeOp de zeventwintigste trouwdag van zijn ouders bestond het werk van onze modelzoon vooral uit het voorbereiden voor hun bezoek. Het huis werd goed gestofzuigd, de kamer opgeruimd, de was gedaan.Hierna vertrok hij naar de stad, naar zijn email. Hieruit bleek dat Jasper hoteldebotel verliefd was. Hij zette zich daarna aan een Queeste voor een kado. Het werd uiteindelijk een kalender. Ze hangen zelf immers meestal de meest vreselijke kalenders op het toilet. De gedachte aan de 'spaarpottenkalender' doen bij Rick nog steeds de haren ten berge rijzen.Vervolgens werd Trastevere binnengetrokken om een restaurant voor eerste kerstdag te reserveren. Trastevere is hierin echt de Pijp van Rome dus al snel werd een leuk uitziend restaurant gevonden. We zullen zien of het ook lekker is.De avond werd voor de tweede keer op rij gevuld met telefoon uit Spanje. Was het gisteren Carolina die van alles vergeten was in Rome. Vandaag was het Mireia. Het blijft een mooi gevoel: als Nederlander in Italië gebeld worden door een Spaanse."
