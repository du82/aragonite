["http://www.ricklindeman.nl/files/4986257d48347f78b2bcd2e512fee272-254.html"]
title = "De vereniging van geheel onthouders | Sport | rick filosofeert"
full_description = "De vereniging van geheel onthouders11/12/05 18:02 Opgeslagen in: SportEn zo kwamen wij aan bij de Apeldoornse geheel onthouders vereniging..De Trein had vertraging, zo konden wij het Apeldoornse pubiek reeds hun helden horen toezingen.Het uitvak was buitengewoon schattig, en met zo'n 80 man van MVV goed gevuld.Voortdurend werd het Zoepen in ons thuisstadion bewiekrookt..Over de wedstrijd moet maar kort gesproken worden.MVV had zeker een punt of meer verdient.Het voordeel van het kleine stadion was wel dat Brncic vanaf nabij bezongen kon worden,Na de enige Goal van us MVV.De supporters van AGOVV hadden ook iets bedacht.Ze vonden het zelf op hun forum zeer geslaagd.Ze hadden namelijk Sleutelhangers....... met blauwe lampjes..Wat verlangden wij toen naar de Angelside..Na afloop deelden we de bus terug.Met een speler van AGOVV.Hij had niet gespeeld.Maar de leasebak was nog niet ingevoerd.Wij gingen terug naar onze hoofdstad,Waar we omschakelden op weg naar het trendy Barca..Na een Dansje in de Quinto en de GieterSloten we de avond af in New Orleans..Hier was Bourbonstreet gelukkig niet ondergelopenEn dansten we met drie schone dames.Meer foto's hier en zo als slideshow"
