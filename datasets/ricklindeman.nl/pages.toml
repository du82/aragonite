full_description = "Triviant07/01/02 17:50 Silvia keek gespannen toe.Paul vroeg zich af of hij nog iets kon manipuleren.Celine bedacht dat die Lambrusco toch eigenlijk wel bocht was.Rick had al drie vragen goed.Nog één goed antwoord, en de prijs was binnen.Celine hield zijn hand vast.Silvia schonk zich nog eens in.En toen klonk het verlossende antwoord.Vier goed, de buit was binnen!Rick kreeg een zoentje van zijn geliefde.Het bleef die avond nog lang gezellig op de Lorrainelaan,met nog wat wijn en wat bier.Paul en Silvia wonnen nog een keer het rummikub.En toen gingen Celine & Rick en Paul & Silvia naar boven.Daar was het vast ook héél gezellig."
