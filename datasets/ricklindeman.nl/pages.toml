title = "Rick filosofeert"
full_description = "Jan 2001 Rick filosofeert | Feb 2001 | Nov 2000 Regen in de PC. Hooft 25/01/01 16:54 Vanochtend liep ik door de PC Hooftstraat. Ik moest er weer eens netjes uitzien. Ik dacht dan ook wel te slagen in één van de weinige straten in Nederland die ook maar op de Romeinse Via dei Condotti lijkt. Dat lukte ook, maar wat zag de straat er slecht uit.Waar ooit grote namen het straatbeeld domineerden, leek nu het woord ‘Sale’ het enige zichtbare. Natuurlijk, om het iets meer klasse te geven stond er ook wel eens op zijn Italiaans ‘Saldi’. Daar hielden de hoogtepunten echter al snel op.De Zara is onlangs geopend. De Barcelonese keten zit tussen de H&M en designerkleding in. Dit is één van de weinige hoogtepuntjes die je nu ziet op de straat van de zeventiende-eeuwse dichter. Eigenlijk hoort ook die winkel ook niet thuis tussen Prada en Boss.Het is echter nog hoopgevend, want voor de rest lijken dumpwinkels een plaats te hebben veroverd in de straat. Omdat de huren zo hoog werden en de Nederlander nog steeds weinig uitgeeft aan kleding, kunnen ze tijdelijk een pand huren voordat een nieuwe zaak het probeert. Vanochtend werd ik nat van de regen en kon alleen met weemoed denken aan de tijd dat ik nog in Rome woonde en iedereen er molto gentile uitzag.Voorspelbare, maar verrassende nieuwe Gibson 17/01/01 16:31 De nieuwe film van Mel Gibson ‘What women want’ is een romantische komedie. Hij is dan ook vrij voorspelbaar. Als Yup ontdekt hij de ware liefde door een ‘gimmick’. De situaties die de ‘gimmick’ oplevert, zijn de moeite waard.Nick Marshal (Gibson) is een ‘echte man’. Voor hem zijn geld en mooie vrouwen het belangrijkste in het leven. Hij is een succesvolle reclameman en verwacht promotie te maken. Nick is dan ook geschokt als een vrouw ‘zijn’ functie krijgt. Darcy McGuire (Helen Hunt) wordt aangenomen om de vrouwelijke doelgroep te benaderen.Terwijl hij allerlei vrouwenproducten probeert, om ook reclame voor de vrouw te kunnen ontwikkelen, krijgt hij een ongelukje. Nick kan ineens horen wat vrouwen denken. In het begin ziet hij deze gave vooral als een last. Later ontdekt hij dat hij haar kan gebruiken. Zijn kunstje is niet alleen nuttig om vrouwen het bed in te praten, ook kan hij het gebruiken om de ideeën van zijn baas af te pakken.Zoals verwacht mag worden in een romantische komedie, wordt hij verliefd op de vrouw die hij eerst bestreed en wordt leert de hoofdpersoon ook zelf iets. Voor het verhaal hoef je dan ook niet te gaan. De film levert wel mooie scènes op als Gibson direct reageert op wat vrouwen denken. Die vrouwen geven niet altijd aan zichzelf toe wat ze denken, wat in het echt misschien ook wel eens het geval is.Voor mannen is het misschien moedeloos om te zien dat vrouwen toch heel anders zijn dan ze denken. Voor Gibson is het ook een schok om te zien dat hij toch niet het geschenk van god aan de vrouw is. Hij wordt op den duur een beter mens van.Door deze film zal je niet snel zelf een beter mens worden. Voor een gezellig avondje uit met je nieuwe liefde lijkt hij wel geschikt. In de film is eens een andere Gibson te zien dan de held uit Braveheart of de gladde politieagent in ‘Lethal Weapon’ Hij blijft echter zichzelf.Rick Lindeman‘What women want’Regie Nancy MeyersMet Mel Gibson, Helen Hunt, Mariso Tomei, Mark FeuersteinVanaf 8 februari in de bioscoopO.a. In de grote Pathé TheatersAmsterdammer betaalt nog steeds voor Vitesse04/01/01 16:33 Opgeslagen in: SportDe verstokte Ajax-fans in Amsterdam blijven het raar vinden. Ooit betaalden ze voor de energie aan het Gemeentelijk Energie Bedrijf. Toen werd het de ENW. En nu, nu betalen ze aan de NUON, hoofdsponsor van Vitesse.Veel mensen vragen zich af waarom NUON eigenlijk naamsbekendheid moet genereren. NUON zelf meldt dat ze die naamsbekend nodig hebben wanneer de energiemarkt vrij komt in 2004. Het is echter de vraag of de consument dan makkelijk van de ene naar de andere maatschappij kan overstappen. Een cynicus zou kunnen wijzen op de goede band die het NUON bestuur altijd had met het bestuur van de Stichting Betaald Voetbal Vitesse. Vorig jaar besloot het voormalige Nutsbedrijf de voetbalclub te redden, nadat Karel Aalbers zijn financiële speelruimte had overschat. Diezelfde cynicus zou kunnen wijzen op de gewoonte van directeuren van voormalige staatsbedrijven om te willen meespelen met de ‘grote jongens’ en daardoor zich in sponsoring en reclame te storten, nadat ze eerst hun salaris hadden verveelvoudigt.In ‘Het Parool’ komt Menno Berkman aan het woord. Hij zegt zijn rekening niet geheel te willen betalen, omdat de NUON het toch maar uitgeeft aan reclames met boeren die zich richten op NUONs ‘core-business’. Het reclamebudget van de NUON is de laatste jaren explosief gestegen.Karel Aalbers staat op het punt met een mysterieuze geldschieter voor ƒ 100 miljoen Vitesse over te nemen. Hierdoor is de NUON verlost aan zijn verplcihtingen en kan het zich weer richten op stroom maken. De Vitesse-fans staan, getuige de fansite op hem te wachten"
year_published = 2025
