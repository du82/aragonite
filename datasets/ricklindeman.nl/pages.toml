["http://www.ricklindeman.nl/files/archive-jan-2000.html"]
title = "Rick filosofeert"
full_description = '''Jan 2000 Rick filosofeert | Feb 2000 | Dec 1999 Dolce far niente22/01/00 16:25 Opgeslagen in: RomeDe lijn van het 'dolce far niente' werd het weekend doorgetrokken. Rick bleef zich rondwentelen in zijn bed en kwam er pas uit toen hij zich realiseerde dat hij een knoop voor zijn Armani wilde kopen, die er om onbegrijpelijke redenen was afgesprongen. Het werd dus mezzogiorno vol boodschappen, waarbij bij de Todis de boodschappen werden volgeladen. Onze held las wat in Paul Johnson's ' Birth of the Modern' (vol irritatie over zijn theorie over stoomauto's en zijn afschilderen van Bolivar als boef)voordat hij naar de bar om de hoek vertrok.De hele straat was weer verzameld voor de wedstrijd van Roma. Piacenza stond onder zware druk, maar wistr toch te scoren. Het werd een emotionele tweede helft, waar alle Ropmeinse parolacci vielen in de kleine kroeg. Roma won uiteindelijk wel, door een magistrale Totti met 2-1Na de Paëlla werd een mooie fles Whisky opengetrokken. Het was dan geen 30 jarig Glenmorgan, maar Italië ligt dan ook iets verder van Scozia. Toch deed het onze drinkeboer terugverlangen naar mooie avonden in de L&B aan de Leidsedwarsstraat. De Fransen konden de Gouda-kaas wel waarderen, zodat nadat de alcohol onder de Acid-Jazz van Alex-o-plex naar binnen was gegoten, met een warm gevoel de nachtrust konden worden aanvaard.Craxi19/01/00 09:19 Opgeslagen in: RomeHet was de dag dat Bettino Craxi StierfDe meest corrupte politicus uit de eerste republiek mocht nu zijn eigen plek in de achtste cirkel van de hel opzoeken. Het was ook de dag dat Rick bij het verlaten van zijn condominium een nieuwe brief uit Barcelona aantrof.Mireia schreef onze engel dat men haar tegenwoordig met een 'brillantezza speciale negli occhi' aantrof en dat ze Ricks twijfels na een relatie 'cosi intensa' wel begreep. Rick nam hierdoor in gedachten verzonken de bus. Aangekomen in la città unìvèrsìtaria schreef hij zijn brieven richting Moskou en 's-Hertogenbosch, waarna hij richting de mensa vertrok. Het verwelkomen van oude bekenden ging verder, daar ook Adria en Chiaro uit het land der stieren warnew treruggekeerd. De les Italiaans bestond voor uit huishoudelijke mededelingen en een verhaal over zigeuners, gekken, forenzen en het vuil van de romeinse metro. Mensen uit Lima, Mexico of Cairo zouden het kunnen begrijpen. Nadat ieder zijn weg had gevonden nam, onze Amsterdammer vervolgens dezelfde metro om thuis op de bank ineen te zakken en het Telegiornale over Craxi uit een te zijn wijden.Tags: PolitiekNakata16/01/00 16:44 Opgeslagen in: RomeOndanks zijn financiële crisis mocht het eitje bij het ontbijt op de dag des heres natuurlijk niet ontbreken. De fransen bleken het concept scrambled eggs niet te kennen en Antonio vroeg zich af of het geen Tortilla was.Rick at glimlachen zijn ontbijt en liep naar de bar die Maurizio en zijn broer al voor Roma-Verona hadden ingelicht. Verona was nog onwetend dat Tim Parks een jaar later alles over haar zou beschrijven, en zeker over welke degradaties voor de trotse kampioen van 1985 zouden volgen.Alle ogen waren gericht op Nakata. Een grote Japanse vlag, maar dan in het geelrood van Roma domineerde het Olimpico. Roma won, al was het niet zo overtuigend door een eigen goal van de mannen uit de stad van die andere Arena. Nakata kreeg zelfs een publiekswissel en Roma liep een puntje op Lazio in, aangezien dat gelijkspeelde.Rick wandelde weer naar huis, las Hemingway uit en at met de Fransen. "Zondag blijft toch gewoon zondag", dacht hij terwijl hij zijn pen neerlegde en de red hotchilli peppers de Californication van de wereld bezongen. Brel09/01/00 16:35 Opgeslagen in: RomeRick's vitá Universitaria begon weer. Hij stortte zich op de Synthese van Garano en belde Emanuella voor de status. Op de achtergrond klonk Brel. De Fransen hadden Het platte land in het Frans opgezet. Rick le plat pays in het Vlaams. Jan Bos stond op A3 formaat in Gazzetta. Schaatsen?">Mireia belde 's avonds. Ze was toch niet echt blij dat er een Russische vrouw had gelogeerd Aurelio kwam ziekthuis., Hij wijtte dat, als echte Fransman aan de hamburger van het bedrijf met de duivelse M. Roma -Milan werd gevolgd via de locale TV-zender. . Het beeld was natuurlijk alleen via betaal TV te ontvangen, maar hier gaven ze live -commentaar op de beelden. 2-2Tags: dode_heldenEen knieval08/01/00 16:32 Opgeslagen in: RomeHet voelde allemaal wat beter aan, toen Rick iets na het midden van de dag het bed verliet. Op deze dag kwam de Italiaanse pers tot de schokkende conclusie dat het voetbal weer een concessie van gedaan aan de commercie. Wegens de vele live-wedstrijden zou Parma-Juve al om één uur 's-jmiddags beginnen. De kranten publiceerden het hele dagrooster, inclusief eeregels voor de spelers. Ouders05/01/00 10:30 Opgeslagen in: Rome : FamigliaCaro figlio,Vanuit de Nederlanden kwamen jij en wij naar Rome. Vanuit die wetenschap zingen wij niet van oorlog, maar wel van Rick die door het lot van het leven verjaagd naar Italie kwam aan het Lavinische strand, veel over landen en zeeen geslingerd door de wil van de wetenschappers,waaronder hijzelf, door de hartstocht naar kennis en avontuur gekweld, totdat hij zijn stad zou bereiken en zijn gedachten tot in Latium zou brengen - de oorsprong van het geslacht der Latijnen, van de vaders van Alba, van de hoge muren van Rome. Muze, zeg mij waarom, waardoor gekwetst of bedroefd, Rick, even uitblinkend door vroomheid als Aeneas, zulk een reeks van gevaren, zoveel leed wilde verduren. De vroomheid zou zich juist rond Natale 1999 uiten, aan de vooravond van het nieuwe millennium Aan het begin daarvan kende de regerende paus, de bisschop van Rome, zo’n grote betekenis toe. Wij waren met jouw hulp daarbij. Mede aan de hand van Vergilius werden wij, eveals Dante en Beatrice, langs onverwachte paden geleid.Op het vliegveld haalde je ons op. We moesten heel lang op de koffers wachten, maar die verschenen niet. Dat zou de volgende dag gebeuren. Het wachten bleek alleen maar een kwelling om ons op de proef te stellen. Vanuit de hemel werd ons dit duidelijk gemaakt. Want daarna kwamen, als genezende tegenstelling, heerlijke dagen vol gezonde beweging (ik zag dat niet altijd zo, want ik wilde al het schoons in alle rust bewonderen, maar dat ligt geheel aan mijn tempo-gevoel), vol prachtige kunstwerken, en vol gezelligheid. Jeugdjaren en jaren van ouder worden kwamen op natuurlijke wijze samen in de uitdrukkelijke oudheid der klassieke kultuur. Ook de Griekse invloed ondervonden we, zowel tot uiting komend in de Romeinse kunstwerken, als in onze eigen beleving toen we in Ostia na veel inspanning de zee bereikten. We riepen immers op het moment dat we de zee bereikten, in onze eigen bewoordingen, “Thalassa! Thalassa!”Je hebt ons een onvergetelijke impressie gegeven van de aspecten van het Rome met als uitgangspunten lijn 8 en de “oude” Piramidevorm. Aspecten, want bij ieder bezoek wisselt de indruk van Rome. Hoe je Rome ziet, hangt ook sterk af van degene die je ontvangt en met wie je reist. Wellicht kan ik je hartelijke gastvrijheid niet beter omschrijven, want we hebben genoten. We sliepen heerlijk op het matras, en koesterden ons eten en onze dranken in het verscholen licht van de huiskamer. De lichte schemering deed ons eerbiedig beseffen dat we het Licht van Rome nooit geheel zullen begrijpen. Alles deden we onder het oog van Johannes XXIII en met de zegen van Johannes Paulus II.Onze dank, en wij wensen je toe dat je je verblijf in Rome als een vruchtbare ervaring met je meedraagt.Il Tuo Padre Pompei03/01/00 13:20 Opgeslagen in: RomeGewekt door de Japanners die nog voor het rijzen der zon zon opstonden vertrokken onze helden alvroeg om naar Pompei te gaan. Op Napoli Mergellina, een oude Rococo station, dat omgebouwd was tot station in een van de weinige metrolijnen die in Napels wel voor de voor de Eeuwisseling gebouwd werden. De metro bracht ons door een oude tunnel naar Piazza Garibaldi. Hier stapten we in de Circumvesuvio, de regionale trein naar Pompei. Samen met de Aanwezige Argentijnse Aristocratie ontdekten we dat de opgravingen toch een overstap nodig hadden.Even later slenterden we door de straatjes van Pompei/. op sommige momenten kon je de angst van de mensen die uit de slagerijen renden, van het Forum vluchtten of uit de Tempel schreeuwden voelen. Op andere momenten verbaasde je je over de pornografische fresco's.Treno02/01/00 14:22 Opgeslagen in: RomeNeapolis. Eindelijk zou Rick de stad in het oude Magna Graecia te zien krijgen. De wekker ging vroeg, om meer tijd te hebben in de stad waar Diego Armando Maradona nog werd verafgood.In het koude Rome, schoot het eerste dag des heres van het nieuwe jaar nog niet echt op, zodat de trein van 9 uur gemiost werd. toen we het 'Bordello'van de rijen hadden doorstaan bleek dat de zondagsrust bovendien ervoor zorgden dat de trein van 10 uur niet ging. Eerst werd dus uitgebreid ontbeten. De treinreis is misschien wel het mooiste van een uitje. De vraag is ook lang niet altijd waar je naar toe gaat, maar waar je langskomt. We reden langs de Lupinische alpen, waar we bergtoppen met sneeuw zagen, over bruggen en langs steden. Zo zuidelijk warn onze Noorse goden nog nooit geweest.Toen we aankwamen liepen we zonder veel voorkennis, als Charles Dickens 'Pictures of Rome' de stad in. we troffen de verwachte chaos aan, maar ook schitterende binnenstraatjes en schattige kerkjes. Toen we eenmaal een kaart en gids (de eerste boeken die met 00 gedateerd moeten worden) hadden gescoord, vertrokken we naar het koninklijk paleis van de Bourbons Deze hadden in het settecento over Napels geregeerd. hoierachter lag de Sam Francisco di Paolo.Toen we op het Piazza di Trieste e Trento onze jeugdherberg hadden gebeld, bleek dat deze op loopafstand lag. Onderweg troffen we een sprookjesachjtig uitzicht over de baai. de lichtjes van de stad schitterden aan de overkant, zodat we snmapten wat Goethe bedoelde toen hij op 27 februari 787 schreef dat iemand nooit ongelukkig kon zijn, zolang hij terug kon denken aan NapelsEenmaal aangekomen troffen we een gespannen japanner en een onwillige deur aan. toen die met de masterkey geopend was ploften we uitgeput neer. Zo werd het adagium "vedere napoli e poi muori wel erg snel bewaarheid. Na een uur waren we zo ver dat we ons op het eten konden richten. Napels, de plek waar Regina Margeritha haar naam aan stads' beroemde uitvinding schonk: de PizzaNa geconstateerd te hebben dat de restaurants op de boulevard ietwat boven ons studenten budget uitkwamen, vonden we vlak bij ons' Ostello een pizzeria die er erg gezellig leek uit te zien. Leek, want binnen was het fel licht en vergat de bediening ons. Toch gold ook hier: hoe ongezelliger een Italiaans restaurant, hoe beter het eten. De pizza was erg goed, met heeeele grote stukken inktvis Nieuw jaar01/01/00 13:22 Opgeslagen in: RomeTegen drieën konden we ons aan het bed ontworstelen, waarna we nu echt geconfronteerd werden met de rotzooi. Nadat contact was gezocht met geliefden in verre buitenlanden en een ontbijt met tompouce was verorberd vertrokken we voor een rustige wandeling door Villa Pamphili, waar we rustig filosoferend wakker konden worden. Hiervan teruggekeerd werd samen met de fransen het huis gereinigd, waarna een Gouter met ragout dit afrondde. Het begin van het jaar had voor weinig problemen gezorgd. De diverse telegiornales toonden feestende mensen van Tonga tot New York. De eerste avond van het nieuwe jaar werd rustig doorgebracht in verband met de reis van de volgende dag. Een zalmpasta werd afgerond met een mooie witte wijn, waarna de studenten gingen slapen, net nadat Marco was opgestaan.'''
