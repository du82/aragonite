title = "Rick filosofeert"
full_description = '''Aug 2008 Rick filosofeert | Sep 2008 | Jul 2008 Kameryck22/08/08 10:53 Opgeslagen in: WerkRond de schattige dorpjes bij WoerdenOp de banen van KameryckSpeelden wij Golf, als Tiger WoodsA Good Walk Ruined,zoals Oscar Wilde schreef?Nee, laat die Ryder cup maar KomenFoto'sMerseyside Mayhem22/08/08 10:29 Opgeslagen in: Reizen : Werk : EnglishMore photosThe joys of low cost travelling made me touch down in the city of the 5 times European Cup winner long after midnight. Luckily the proponent of Umihara Kawasa, Matt, stood on John Lennon Airport with a sign Rick "Mario" Lindeman. He brought me to my hotel.It would be a short visit, I would spent only 16 hours in the lands of her most royal majesty, Elisabeth II. Thursday, a rainy morning as one would expect on the shores of the Irish see, I had to work. John, from Austin Analytics picked me up, and brought me to an English breakfast bar. Brown, and wood, and without presumption. The corner stone of English Society.Duke StreetWe went to talk with the boss of Mersey Travel, so naturally we used Liverpool's underground. It was a combination of older rail lines, refurbished some 30 years ago. The boss himself was approachable and told us about all his new projects, his submarine and South Parkway Station. He would join us at LinkI went to see South Parkway Station. It lay lush in the green fields, and really open and sustainable, but without many passengers. I had forgotten how England looked, with its typics stone houses and streets. The city was filled with Lamb Bananas, decorated copies of a a famous sculpture, made for Liverpool Culture Capital 2008.Lamb Bananas at Lime StreetBack at Lime Street, after train trip through an impressive gorge of Lime Stone, Matt was there and went to Sapporo, a Tepanyaki restaurant. This was good food and good for my understanding of Liverpool. As we set there, 3 girls, who could be footballers wifes joined us at the table. They were dressed up, a bit sleazy but up to alevel, and i will never forget their accents.We enjoyed the cheaper Video Games, at Liverpool One, the new mega real estate urban renewal (good or bad, you decide) in the centre of the city. Later we went to see both Goodison Park and Anfield road, mere metres from eachother. Matt had been a blue boy all his life, but explained being blue didn't mean you had to be that anti-red, just during derbies. Respect was given to the victims of the Hillsborough disaster.Bar at AnfieldIt was almost time to go home, we drove through Penny Lane, back to John Lennon Airport. Meanwhile in Peking, we won the Waterpolo and marathon swimming. We competed at our own Olympics, getting our DSs out and playing New International Track and Field, and of course Mario Kart.Tags: LinkDramatic semi final13/08/08 09:22 Opgeslagen in: Games : EnglishI don't have words to decribe it, it reminded me of Deportivo-Milan, so over to correspondent, myoptikaBloody hell, what a dramatic semi-final day at the BeeX Stadium.After an action-packed "friendly" (I use quotation marks as I managed to get two players sent off) which finished 2-1 to myoptika's Forumites, we both had problems connecting to each other, which resulted in a bizarre situation where we both saw different teams on the same player selection screen and the game crashing out when the players arrived on the pitch! Read More...Italia12/08/08 09:28 Opgeslagen in: RomeAs many of you know, and my forum name suggests, I lived in Italy for some time in the late 90s/early 00s. One of the most memorable nights was november 9, 1999, 10 years after the fall of the Berlin Wall. I went to a meeting in the Palazzo del Lavoro, in EUR, a Merlusconi built quarter, fascist in style for the cancelled Rome World Expo of 1940. Read More...Tags: PolitiekBurgermeester11/08/08 10:16 Opgeslagen in: OpmerkelijkJens en Lars waren op de opening van de Burgermeester,het nieuwe high-end Burgerrestaurant van Amsterdam,Jammie!>Meer foto's Read More...Tags: AmsterdamStadions11/08/08 09:42 Opgeslagen in: SportEr worden veel stadions gebouwd in Nederland.Meestal als nieuwe impuls voor de club.Het avondje NAC, Het Abe Lenstra, de Grolschveste, de Nieuwe Goffert.Allemaal een grote verbetering. Read More...Tags: JupilerleagueNieuwe heldinnen, verwelkomd in de toekomst04/08/08 10:06 Opgeslagen in: PartyHet zou niet zo mooi weer worden als vorig jaar.Dat was al snel duidelijkMaar misschien was dat ook maar goed.Want toen verbloemde de zon de matige muziek Read More...Tags: FestivalsZonsverduistering01/08/08 10:03 Opgeslagen in: OpmerkelijkEr was een zonsverduistering op 1 augustus.,Niet zo stoer als die in 1999Maar toch mooi een excuus om te gaan,naar die mooie plek waar ik trouwde.Tags: Utrecht'''
