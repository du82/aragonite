["https://ricklindeman.nl/faciliterenzonderomwegen"]
title = "Het voorkomen van een braindrain – Rick Lindeman"
full_description = "Het voorkomen van een braindrain admin | June 18, 2013 | Publicaties | No Comments Vorig jaar werd ik gevraagd mee te schrijven aan een boek over faciliteren door de IAF, de beroepsvereniging van Facilitators. Dit boek moest anders worden dan alle andere boeken over faciliteren. Het ging niet over tips en trucs voor facilitators, maar over wat een gefaciliteerde sessie voor de opdrachtgever kan betekenen. Het is een erg leuk boek geworden, met 24 praktijkcases, een checklist voor het inhuren van een facilitator en een beschrijving van de toegevoegde waarde. Met 24 praktijkvoorbeelden toont dit boek de mogelijkheden en resultaten van het vak faciliteren. Een goed gefaciliteerd proces levert antwoorden op vragen waar menige organisatie en manager tegenaan loopt. Boekcover Steeds weer is de vraag: hoe gaan we om met veranderingen en hoe creëren we beweging in een gewenste richting? In dit boek geven zowel facilitators als opdrachtgevers vanuit de praktijk antwoord op deze vraag. De voorbeelden variëren van grootschalige projecten op nationaal of internationaal niveau, tot kleinschalige processen binnen een kleine organisatie of afdeling. Ze spelen zich af in zowel profit als non-profit sectoren . Dit boek verschaft opdrachtgevers en professionals, betrokken bij veranderende organisaties, inzicht hoe faciliteren nieuwe wegen kan banen. Mijn artikel ging over het opzetten van een traject voor kennisbehoud met bijvoorbeeld ‘Expert debriefs’ binnen Agentschap NL. Het is hieronder te lezen en te downloaden. jQuery(document).ready(function($) { $.post('https://ricklindeman.nl/wp-admin/admin-ajax.php', {action: 'wpt_view_count', id: '32'}); }); Related Posts Van Fiets en Vis No Comments | Jul 6, 2021 Hollandsche Steden in de Republiek No Comments | Oct 5, 2017 De Betekenis van Reizen No Comments | Nov 29, 2021 Archeologie onder water No Comments | Jun 14, 2023 About The Author rickthuis"
