["http://www.ricklindeman.nl/files/archive-aug-2000.html"]
title = "Rick filosofeert"
full_description = 'Aug 2000 Rick filosofeert | Sep 2000 | Jul 2000 De terugkeer van vakantie24/08/00 17:25 De eerste studenten komen al weer terug van vakantie en zijn al weer druk aan de studie. Houden universiteiten daar ook rekening mee?Langzaam schuiven ze de hete zalen binnen. Sommigen zijn wat gebruind. Anderen wat meer verbrand. Ze kijken nog wat onwennig om zich heen. Echt gemotiveerd lijken ze ook nog niet. Toch weten ze dat ze niet anders kunnen.Het zijn de studenten die alweer op de universiteit moeten zijn, hoewel het academisch jaar nog niet begint tot begin september. Sommigen hebben een hertentamen en moeten hard leren om hun 21 punten te halen. Voor anderen is het nooit echt vakantie geweest. Zij zijn namelijk met hun scriptie bezig.We spreken begin augustus. Studenten van de faculteit Economie en de (voormalige) faculteit der Ruimtelijke Wetenschappen aan de universiteit van Amsterdam kunnen een maand niet terecht in de Piersonbibliotheek, hun faculteitsbibliotheek op het Roeterseiland. Nieuwe bronnen aanboren wordt ineens een stuk moeilijker; ook al omdat een groot aantal vaktijdschriften wel op internet staat, maar slechts vanaf de computers van de bibliotheek te raadplegen zijn.Inleveren kan wel, maar alleen bij de portier, als de kaartjes die daartoe aanmanen niet door de chaotische administratie van de Alma Mater al niet naar het verkeerde adres zijn gestuurd. Maar ach, verzuchtte Nietzsche niet al in 1886 over de chaos op zijn universiteit: "Nu hoeven later onze bewonderaars tenminste een bedevaartsoord minder te bezoeken? "Rick Lindeman Gepubliceerd op campusbar.com'
