full_description = "Aug 2002 Rick filosofeert | Sep 2002 | Jul 2002 Loveparade 200211/08/02 09:22 Opgeslagen in: Party : ReizenLoveparade 2002 - We were ThereHet meest beroemde house Event ter wereld: De Loveparade. Dit jaar zouden wij er eindelijk heen gaan. Vrienden werden omgetrommeld, en met Jochem, Peter en Wai-Hong vertrokken onze held met zijn gade Celine naar de Duitse hoofdstadAldaar namens zij de intrek in pension Purwins, in het oosten van de stad. Verzorgd door een echte Duitse mama, was dit het bastion waaruit de stad en de parade werden verkend. 's Avonds ondekten ze culinaire genoegens van Mitte. Een van de spannendste stadsdelen na de herenigingDe volgende dag was de dag van de parade. Vanaf de Brandenburger Tor vertrokken zij, om ergens in de avond bij Zoo aan te komen. Heerlijk dansend op DJ Motte en al zijn vrienden, tussen 500.000 man. Access Peace!!!!De volgende dag was meer voor bezinning: een bezoek aan het heiligdom voor Marlène Diettrich: het filmmuseum van Berlijn. Het ligt in het 'neue mitte': de Potsdamer Platz. Dit pelin lag midden in het sperrgebiet van de muur, Erg commercieel, maar best stoer...Tags: FestivalsArie11/08/02 09:10 Opgeslagen in: OpmerkelijkIn Memoriam, Arie de Kanarie.(7.9.2001 - 11.8.2002)Arie stierf een vreedzame dood in augustus 2002, in het midden van het verhuizen van zijn meester. Hij was genoemd naar de beroemde griekse toneelschrijver Aristophanes (456-380 v.Chr.), schrijver van 'De Vogels'It was Chaos and Night at thefirst, and the blackness of darkness, and hell's broad border;Earth was not, nor air, neitherheaven; when in depths of the womb of the dark without orderFirst thing first born of theblack-plumed Night was a wind-egg hatched in her bosom,Whence timely, with season revolvingagain, sweet Love burst out as a blossom,Gold wings glittering forthof his back, like whirlwinds gustily turningHe, after his wedlock with Chaos,whose wings are of darkness in hell broad-burning.For his nestings begat him arace of birds first and upraised us to light new-lighted.Aristophanes, 'The Birds' Zeilen in Fryslân01/08/02 20:02 Opgeslagen in: ReizenWanneer je nu echt ontspannen op vakantie wil gaan,ga je gewoon zeilen over de Friese Meren. Het windje duwt je voort,je neemt een biertje en je gsm heeft geen bereik....Rick ging mee met een groepje Goërs bij Hoora in Heeg, te zien op de kaart links. Ze stopten de Valk (foto rechts) vol en trokken er op uit. Vervolgens zeilden ze het Heegermeer op. Ons bootje miste ergens een afslag, dus we kwamen pas laat aan het Schone Woudsend. Het werd windstil, dus het was bomen in de rakken...De volgende dag begon rustig. We zeilden naar Langweer, alwaar Yorin die avond een Sail-in Movie zou draaien. (foto rechts). Die avond kwamen we aan in Joure. Hier werd gekookt bij een beginnend regenbuitje, waarna het Jouster nachtleven werd ontdekt. Na café Herman volgden de Stam (met het wereld beroemde striptoilet) en het Tolhuis.Voor alle fans: Elwin bijna naakt in het water op zoek naar zijn Zonnebril in JoureAkkrumDe volgende dagen werd het heftiger, zondag kwamen we niet verder dan Goingaryp, waar wel een heerlijk restaurant, waar met heerlijke wijn en een goede Cognac het leed van die dag werd weggedronken.Vervolgens op weg naar Grou, waar een BBQ de aanwezige mannen vol op gelegenheid gaf hun mannelijkheid te bbewijzen, wat de ene beter lukte dan de anderen, ik noem geen namen........Bas & JeroenIn LangweerTags: Go"
