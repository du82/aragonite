["http://www.ricklindeman.nl/files/archive-feb-2012.html"]
title = "Rick filosofeert"
full_description = "Feb 2012 Rick filosofeert | May 2012 | Jan 2012 Twitter volgers10/02/12 20:18 Opgeslagen in: OpmerkelijkIn navolging van @dinadinekeEen versje over mijn 256ste volger.Daar ik niet kan zingenEen gedichtje….----2^8 volgers...Eerst was er BriannaEen Amerikaanse schoneDie toch niet echt bleek.Ze verdween zo snel uit twitterDat ik niet eensHaar foto kon reddenUit de vergetelheid.Maar toen was er Martin Duits.Een collega.Die ik al lang ken,Maar toch ook weer niet zo goed.Het MKB is zijn passie.Innoveren zijn missie.En om dat te doen.Maakt zijn Gijs een tekeningMaxime retweet hij vaak.Is de jezuïet zijn messias.Of zorgt hij voor de bitterballenIn zijn groep op Linked in.En na als dit werkIs het misschien niet zo gekDat volger 2^8+1Een boodschap in zich had.„@neemonslag volgt uw op twitter”Was het begin van mijn werkweek.A song about Rick01/02/12 13:15 Opgeslagen in: Opmerkelijk : EnglishDineke (@dinadineke)Somebody I probably met only once.In one of the furthest outpostsOf the Go subcultureI was once part of.Or maybe still am.But, as one knows.Social Networks have that strange habit.Of joining up people,Who don’t really know each other.And thus when I saw a tweet.By Pool legend @jtvanderlindeI couldn’t help but press follow.And fresh from Austin, Texas.Or indeed Amsterdam-WestA singer songer-writer appeared.Social-Liberal?Shoe-addict? Phonecover thief?No one knows.But she made this.And that made me feel special.And in these woeful times.That’s just about the best one can hope for…."
