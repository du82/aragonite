["http://www.ricklindeman.nl/files/759a68ff27fbadca0ac3c346c628a0ee-514.html"]
title = "Vulkanen en Trams | Reizen | rick filosofeert"
full_description = '''Vulkanen en Trams22/04/09 11:37 Opgeslagen in: ReizenAlle tenerife foto'sEen bericht uit een stukje Europees Afrika, Tenerife. Dat het Afrika was, bleek gisteren bij het Wrak van El Condesito, op 17 meter onder de Atlantische Oceaan spiegel. Trompetvissen en Papagaaivissen hadden het in 1970 veroverd. Duikfoto'sEuropees bleek het ook, maandag in Santa Cruz. Tot grote vreugde van Jens bleek er sinds vorig jaar een tram te rijden. Hij wilde er steeds in "Trein!, trein". Nog even komen er nieuwe projecten op gang. De economische crisis slaat ook hier toe, en de Europese kraan gaat dicht.Verder is het hier Derby dag zaterdag. CD Tenerife is vorig jaar gedegradeed en staat nu voor het eerst sinds jaren tegen UD Las Palmas van het naburige Gran Canaria. De locale kranten staan er vol mee. Tenerife zou de derby met 2-0 winnen.Het resort en het plaatsje er om heen is niet echt iets voor ons (en men probeert ons Timeshare te verkopen), en vandaag -oi- hebben we het ziekenhuis van Los Cristianos mogen verkennen, want Jens was op zijn hoofd gevallen, gelukkig was hij weer heel dapper, en bleek uit de Rontgen dat het goed was. Nog ff zonnen en dan zijn we er weer...(dat laatste is Jens´ nieuwste zinnetje). De laatste dagen was het weer gelukkig super!Vliegtuig Vliegtuig!'''
