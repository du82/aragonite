["http://www.ricklindeman.nl/files/1e1ffecff07b81fa8b8dd41579ad92a3-250.html"]
title = "Op ontdekkingstocht door Duurzaamheid & Samenleving | Werk | rick filosofeert"
full_description = 'Op ontdekkingstocht door Duurzaamheid & Samenleving02/12/05 09:17 Opgeslagen in: Werk"Het lijkt dan wel of in dit taakveld een samengeraapt zooitje is, maar dat is het zeker niet" opent taakmanager Roel Salden zijn vlammende betoog over de unieke positie die het taakveld Duurzaamheid en Samenleving binnen onze directie inneemt. Na zijn tocht in het Haagse in de fascinerende omgeving van Bodem+ was Rick Lindeman op zijn nieuwe expeditie in een heel andere wereld terecht gekomen, dat was meteen duidelijk. Het taakveld D&L is samen met Mobiliteit en Ruimte één van de twee taakvelden van Milieu & Leefomgeving die niet aan één grote opdracht werken, maar voor een scala aan opdrachten en opdrachtgevers. Verdeeld over Zwolle, Utrecht en in toenemende mate Den Haag werken zo’n 60 mensen met een breed palet van beschikbare instrumenten en een zeer gevarieerde doelgroep aan het bevorderen van duurzame maatschappelijke veranderingsprocessen.Roel en opdrachtmanager Duurzame Ontwikkeling Herry Nijhuis vertelden hoe ze bij het opzetten van hun taakveld blij verrast waren om te ontdekken dat er een sterke samenhang binnen het taakveld lag. "Er zijn drie pilaren waar we aan het werken" tekent Roel voor me. Aan de ene kant werken we aan de ‘harde kant’: we geven subsidie voor het ontwikkelen van milieutechnologie (M&T) en bedrijven kunnen via ons hun investering in milieuvriendelijke technologieën aftrekken (MIA/Vamil) om zo een grootschalige toepassing te bevorderen. Aan de andere kant zijn we sinds dit jaar steeds actiever aan de ‘zachte kant’: we zoeken voorlopers in de transitie (CCT), en helpen ambtenaren, en burgers een duurzame afweging te maken (LVDO). De derde poot zijn we nog aan het ontwikkelen: externe veiligheid wordt een nieuw component van ons werk in de toekomst. Al deze opdrachten werken samen op duurzame maatschappelijke veranderingsprocessen voor elkaar te krijgen. "Het mooie van ons taakveld" schetst Roel "is de diversiteit van deskundigheid en de instrumenten die we in zetten." We hebben fiscalisten, techneuten en organisatiedeskundigen. Op onze gezamenlijke dag in het dierenpark van Apeldoorn bleek hoeveel die gemeen hadden. Ze benaderen de problematiek vanuit een andere hoek en dat leverde interessante nieuwe benaderingen op. Ook richting de opdrachtgever kunnen we nu goed verkopen wat onze toegevoegde waarde is." Binnen de directie komen ook steeds meer verbindingen naar boven. D&S trekt samen met Mobiliteit & Ruimte op in de problematiek van de fijnstof. Aangezien dit een hot-item is, verwachten de heren dat hier kansen liggen.Het Competentie Centrum Transities leert veel van de benaderingen die zijn ontwikkeld in de verschillende transitieprogramma’s en krijgt daardoor een steeds sterkere band met de Energietransitie. Het centrum is opgezet om de voorlopers op het gebied van transitie uit te rusten met de vaardigheden die ze nodig hebben. Transities zijn langdurige veranderingen met een grote impact, zoals bijvoorbeeld de grote veranderingen die hebben plaatsgevonden ten aanzien van de mobiliteit van mensen in de 19e en 20e eeuw.. "Eigenlijk zoeken we de kwajongens (en kwameisjes)!" grapt Herry, "We zoeken de sleutelfiguren die niet bang zijn om een ontwikkeling te trekken. Vervolgens kunnen we ze helpen en faciliteren om een transitie op gang te brengen en te houden". Naast deze voorlopers is zijn team ook bezig met het verankeren van duurzaamheid in de samenleving. In het programma Leren voor Duurzame ontwikkeling gebeurt dit door aan te haken op de doelen in het reguliere onderwijs, ambtenaren te leren duurzame afwegingen te maken en burgers te betrekken in maatschappelijke besluitvormingstrajecten.'
