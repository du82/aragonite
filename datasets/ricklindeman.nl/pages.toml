title = "Vakantieoord | Rome | rick filosofeert"
full_description = "Vakantieoord12/12/99 10:09 Opgeslagen in: RomeNa voor een treinreis van 20 uur aangenaam geslapen te hebben, wat uiteraard tegen elke verwachting inging – tenslotte was ik in Amsterdam gewaarschuwd voor deze ‘dronkenmansreis’ – was het eerste dat ik zag de San-Pietro, hetgeen de ochtend meer dan opvrolijkte. Op Termini werd een slaperige Romein aangetroffen, die naar de naam Rick luistert. Uiteraard was het eerste dat Rome mij te bieden had, een kopje Espresso, waarna het laatste stukje van de reis naar Vakantieoord ‘Lindeman’ kon worden voltooid. Gelukkig werd mijn nieuwsgierigheid naar de inhoud van de twee door Ricks moeder meegegeven tassen snel bevredigd.‘Op naar Rome’ was het motto.De eerste dag in een vreemd oord zal waarschijnlijk altijd wel de mooiste blijven.Uw reiziger viel van verbazing in verbazing. Zelfs eenvoudige arbeiderswoningen kwamen als waar kunststuk op mij over. Wij trokken van grasveld (Circus Maximus) naar Ruïne (Colosseum) en alles was prachtig. Ik was trots op mijn beslissing om naar Rome te komen. In de avond werd mijn eerste Italiaanse maaltijd genuttigd, die tot het toetje als eenvoudig doch voedzaam gold. Voor het toetje zelf schoten woorden echter tekort; het was als Rome zelf!De tweede dagen werden mijn ondertussen vijf dagen oude schoenen op de proef gesteld. Maar dit was niets vergeleken bij wat mijn ogen hadden te verduren. Ook deze dag werden de wonderen van de oudheid bewonderd. De avonden werden ondertussen aangenaam gevuld met wijn, voetbal, Catalanen en uiteraard het wegwerken van de laatste energievoorraden die mijn lichaam bezat (dansen). Het mooiste dat Rome naar mijn bescheiden mening te bieden heeft is Vaticaanstad. Twee dagen werden aan deze stad in een stad gewijd en geen moment heb ik rust gehad, Ik kan mijn niet voorstellen dat iemand gedachteloos kan blijven bij het zien van de Sint-Pieter, alhoewel het geïrriteerde Romeinse verkeer dicht in de buurt kwam; Barbaren zijn het!De eerste helft van de week stond voornamelijk in het teken van de cultuur. De tweede helft werd vooral gewijd aan de innerlijke mens, al dan niet in combinatie met Catalanen.Hier werd weer eens duidelijk gemaakt dat de Babyloniërs zich niet met het begrip taal hadden mogen bemoeien, maar gelukkig blijven knipogen en dergelijke internationaalbekend. Het mooiste voorbeeld was waarschijnlijk de Go-partij tegen een Italiaan waarbij Japans maar als voertaal werd gebruikt.Ik wil graag besluiten met het aanraden van vakantieoord ‘Lindeman’ Het ontbijt is altijd een verrassing, al blijft gelukkig de koffie een stabiele factor. Kennis over Rome is ook in overmaat aanwezig en zeker na een paar slokken wijn slaapt het briljant.Bas"
