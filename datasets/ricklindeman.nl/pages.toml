["https://ricklindeman.nl/effectief-innoveren-in-voor-en-natransport-met-oog-voor-de-reiziger"]
title = "Effectief innoveren in voor- en natransport met oog voor de reiziger – Rick Lindeman"
full_description = "Effectief innoveren in voor- en natransport met oog voor de reiziger admin | October 26, 2013 | Publicaties | No Comments Samen met Klaartje Arntzen Voor- en natransport speelt een belangrijke rol in de keuze om wel of niet met de trein te reizen. Het gemak waarmee de reis van huis naar het station of van het station naar de eindbestemming verloopt is in belangrijke mate van invloed op de invulling van die mobiliteitsbehoefte. Het programma Innovatief reizen van en naar het station stimuleerde innovaties op dit terrein vanuit verschillende perspectieven. Het laat zien dat recente innovaties uit het programma met name gaan over verbeteringen in de dienstverlening en randvoorwaarden voor gebruik, en niet zozeer in de modaliteiten zelf. Een groot deel van de marktinitiatieven betreffen nieuwe diensten voor fietsen en taxivervoer. Reizigers blijken behoefte te hebben aan veel concretere en praktischer verbeteringen: wegnemen van onzekerheden in het reizen en overstappen (aansluitingen, afstand en looproutes, plaats in de fietsenstalling etc.), voorzieningen voor slecht weer en aangenamer wachten. Kortom, ideeën die niet zozeer gaan om een snellere reis, maar aan de beleving van een snellere, comfortabeler overstap. Er is dus in zekere zin een mismatch tussen vraag en aanbod: er bestaan andere beelden bij verschillende innoverende partijen en reizigers over de richting van de innovaties die nodig zijn om het huidige voor- en natransport aantrekkelijker te maken. Tegelijkertijd is juist marktvraag onder reizigers nodig om van een succesvol experiment een rendabele nieuwe dienst te maken. In tijden van crisis zijn financiële middelen schaars en is draagvlak voor nemen van risico’s klein. Meer oog voor reizigerswensen zorgt voor efficiënter besteden van schaarse middelen van ondernemers, vervoerders en overheid. Daarbij behelst voor- en natransport een hele reisketen met diverse partijen, waarin onduidelijk is wie initiatief moet nemen voor verbeteringen of voor overall behoeftenverkenning van de reiziger. Inventariseren en ontwikkelen over ‘schotten’ heen gaat niet vanzelf. Voor wat meer baanbrekende innovaties die verder kijken dan het bestaande regime, zijn andere samenwerkingsvormen en ideeën van nieuwkomers essentieel. Dit vraagt inzet van minder traditionele instrumenten ter stimulering van vernieuwingen. En zicht op waardecreatie voor reizigers en verbinding met hun behoeften. jQuery(document).ready(function($) { $.post('https://ricklindeman.nl/wp-admin/admin-ajax.php', {action: 'wpt_view_count', id: '143'}); }); Related Posts Leren over de fiets in disruptieve tijden No Comments | Nov 24, 2017 Experimenteren in de keten No Comments | Oct 27, 2013 Managementboek No Comments | Oct 1, 2017 Ab Urban Condita No Comments | May 27, 2001 About The Author rickthuis"
