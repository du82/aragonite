["http://www.ricklindeman.nl/files/f510fa5294f6d1d8c4985153a63ce9c4-331.html"]
title = "Loutering in Vlaanderen | Sport | rick filosofeert"
full_description = '''Loutering in Vlaanderen03/04/06 11:08 Opgeslagen in: SportOm 6 uur reden ze weg uit de hoofdstad,Bevreesd voor wat komen zou.Met 130 scheurden ze over de lege wegen,Op weg naar schone Vlaamse landenTegen acht uur stonden ze in een file vol cyclotoeristenZe waren blijkbaar niet de enigen die de ronden gingen fietsen.Niet de enigen, die de pelgrimstocht naar de Vlaamse wielerhemel zouden afleggen.Menno was zelfs uit het rijk der Noormannen komen afreizen.De helden voor de tochtDe toch begon met helse regenbuien.Met tegenwind trokken we door ZottegemDe regenjas ging aan in Rozebeke.We vroegen ons af wat we eigenlijk aan het doen waren.Soppend in onze schoenen trapten we echter door.Tot we eindelijk licht in de duisternis zagen.Rick in de beklimming van de muurToen moest de ronde echter pas echt beginnen.De bergen naderden.We kregen bericht van de helden die de 140 deden, dat er slechts gelopen werd op de Koppenberg.De Leberg was een prettige startDe Berendries deed de kuiten al meer pijn.Op de Valkenberg, zou Leif Hoste de dag erna de belsissende demarage plaatsen,Omdat de wind zo fijn tegen stond.Na de revitaillering in het dorp van Van Petegem"De Zwarte van Brakel",Vlak na de TenbosscheKwam het bedevaartsoord in zicht.Rick bij de kapel voor Maria, boven op de muur.De naam "Geraardsbergen" deed ons hart sneller koppen.De muur maakte ons zenuwachtig.Grammont heet in dorp in het Frans.Misschien komt dat wel van Grand mont.De Kasseien kwamen,De muur bracht ongekende krachten in ons boven.Het gejuich van de Vlamingen bracht ons omhoog.Naar de verlossing, die na de beklimming van de Louteringsberg zou volgen."E canterò di quel secondo regnodove l'umano spirito si purgae di salire al ciel diventa degno*(Dante Purgatorio I)De ronde van Vlaanderen wordt ook wel de Hoogmis van het vlaamse wielrennen genoemd.Als je de muur naar de kapel van Maria beklimd is duidelijk waarom.De extase is niet te beschrijven.Het monument boven op de muur met Michel er voorMaar we waren er nog nog niet.Het licht bij Rick ging nu uit.De bosberg bleek een zware beproeving.Daarna was het slechts afdalen.Een groot feest.De finish in Meerbeke was bereiktRick vertrok snel naar Luik voor het toetje van de dag,Samen met Paul schreeuwden we Standard naar de overwinning op Mouscroun.De hele Belgische sport op één dag.Alle foto'sDe helden140 km.Jasper TijkotteMenno Braakensiek75 kmMichel OverwaterJosefien BraakensiekRick Lindeman* En nu zing ik over het tweede rijk,Waar de ziel zich zuivert,en waardig gemaakt wordt om op te stijgen naar de hemel.Tags: Wielrennen, Jupilerleague'''
