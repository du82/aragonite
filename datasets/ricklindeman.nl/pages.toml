["http://www.ricklindeman.nl/files/913164cf218ebfbc7cc4295a7f20221d-328.html"]
title = "Carthago | Rome | rick filosofeert"
full_description = "Carthago20/12/99 10:27 Opgeslagen in: RomeDe wekker ging al om half negen, maar Rick bleef nog even liggen, waar door hij wel erg laat op college kwam. De professor vond het concept van onze slaapkop goed, dus Rick heeft de komende weken weer wat werk te doen. Hierna vertrok ons druk bezet baasje naar de mensa om voor het laatst de maaltijd te delen met Judith en Carolina, die de volgende dag naar huis gingen. De mensa was op deze dag in een feeststemming. Er werd champagne geschonken en Panettone, een Italiaanse kersttulband, uitgedeeld. De foto’s van de afgelopen feesten werden bekeken en na een laatste kop koffie klonk het ‘Ci Vediamo’Op de Via Flaminia bleek dat Rick wel was gewaarschuwd voor de staking, maar dat het interne communicatienetwerk van de Via Jenner gefaald heeft. Marco dacht dat de Amsterdammer nog sliep, terwijl hij in wezen al op pad was. Na een plan te hebben gemaakt voor de komende weken vertokken onze studenten naar een Chinees restaurant vlak bij de Sint-Pieter. De vakantie moest natuurlijk worden gevierd. Onze veelvraat at een basale babi pangang variant en dronk chinees bier, Tsjing-Tseo.Thuis bleken de Carthagers na twee Punische oorlogen nog niet verslagen. Rick versloeg, spelend als het volk van koningin Dido de Romeinen. Rick kon zo zijn nieuwe stadsgenoten op hun tekortkomingen wijzen. Cato had gelijk toen hij zei ‘Cetero censio Cartaghinem delendam esse’"
year_published = 2012
