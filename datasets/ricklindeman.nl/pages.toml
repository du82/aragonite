["http://www.ricklindeman.nl/files/archive-aug-2012.html"]
title = "Rick filosofeert"
full_description = "Aug 2012 Rick filosofeert | Jul 2012 Palmeiras29/08/12 08:37 Opgeslagen in: SportDit stukje schreef ik in januari voor de Hard Gras site, nu hierMorgen Ajax-Palmeiras..Mooie wat statige club uit Sao Paolo..Niet de club van het volk, dat is Corinthiansniet de club van het succes, dat is Sao PaoloMaar misschien wel de club van de melancholie.Het begon als Palestra-Italia. Misschien daarom de melancholie van Napels, van het zuiden.Na Mussolini werd het Palmeiras.Succes volgde.. Het Torneio Rodrigo Pedrosa werd gewonnen. en weer.Maar dat was geen titel. Er was nog geen Braziliaanse titel in de jaren 50 en 60.Toen ik in Sao Paolo was.Was er wat defaitisme is de Palmeiras fans die ik sprak..Taxi-chauffeurs, Oudjes die de Lance! lazen.Japanners aan de Sushi..Die derby zouden ze niet winnen. En dat deden ze nietMaar toch werd hun hunker onlangs beloond.Dat Torneio werd alsnog erkend.En ineens was Palmeiras (bijna) record kampioen.En was het eens zo fletse groen, weer het trotse VerdãoTags: Brazilia"
