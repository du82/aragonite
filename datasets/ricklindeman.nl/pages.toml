title = "il Treno | Rome | rick filosofeert"
full_description = "il Treno19/12/99 10:26 Opgeslagen in: RomeIn qualche luogo del percorso Firenze-Roma, 19 dicembre 1999Appena mi sono svegliata e Rick mi ha chiesto di scrivere nel suo diario, non potevo rifiutare l’offerta. Abbiamo passato un buon fine-settimane Firenze, non abbiamo visto i grandi musei, ma abbiamo passegiato per le stradine della città, l’ambiente natale che sentiva nell’aria, la gente camina le vie del centro. Noi, turisti, siamo rimasti con la bocca aperta davanti alla belleza,, così mi piacerei chiamare alla città perchè ogni angolo, ogni strada, ogni piazza visto ha la belleza in se, La città ci ha colpito, sembra che a ognono di maniere diverse, per fortune, sempre ricorderemo nostro primo viaggio a FirenzeCarolina"
