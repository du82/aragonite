["http://www.ricklindeman.nl/files/archive-feb-2004.html"]
title = "Rick filosofeert"
full_description = "Feb 2004 Rick filosofeert | Apr 2004 | Dec 2003 Pantani è Morto14/02/04 17:55 Opgeslagen in: Sport16 januari 2004De Piraat is niet meer. Hij is dood. De Man die het wielerennen liet geloven in de illusie is slachtoffer geworden van de tragiek die de ware wielerheld omlijst. Als Icarus daalde hij van de hoogste hoogten van 1998 tot het diepste dal in een hotelkamer in Rimini.Hij was de klimmer die wij het meeste bewonderden. We hebben zijn vader ontmoet in zijn bar (zie hier) en gejuicht toen hij Ulrich versloeg op de toppen van de alpen. Het olifantje is vertrokken.Marco Pantani, 1970-2004. Rust zacht. Tags: Wielrennen, dode_heldenSchokkende Foto's Woning13/02/04 19:48 Maar verder een heel gezellige verjaardagCeline werd 28, en dat was natuurlijk een reden voor een feestje op de Lombokstraat. Helaas waren dames uit het Zuiden ziek, dus moest het Noorden voor de Sfeer zorgen.Al snel stroomden helden binnen en onder de genoeglijke klanken ener Ipod vermaakten zich allen prima, als hier de Dames Koot en GrootWoning was op pad om schokkende foto's te maken, zoals van de helikopter, doch werd even later zelf in schokkende pose aangetroffen. ik moet u waarschuwen, lieve kijkers van de Superbowl, u kunt dit schokkerend vinden!Natuurlijk waren er ook andere klassieke toppers. zoals hier de zwager van de jarige en ene medewerker van Philips.Tot slot nog een woordje voor deze twee jarigen, daar zij slechts vierentwintig uur later zelf een feestje gaven, waar ook Celine en haar gade aanwezig waren, wat weer voor een aanzienlijke hoeveelheid autokilometerszorgde"
