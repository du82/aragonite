["http://www.ricklindeman.nl/files/07c5f0e7fe5e66e78cd59349b10fb6de-312.html"]
title = "Chinezen | Rome | rick filosofeert"
full_description = "Chinezen08/12/99 09:58 Opgeslagen in: RomeNa de broodnodige acht uur slaap stond onze Amsterdammers op; ze hadden zich wat dikker aangekleed dan de dag tevoren. Tijdens de terugtocht was het toch wel koud geweest. Het aanwezige Franse en Italiaanse publiek werd ingeweid in het concept amandelstaaf , waarna de (toch misschien wel ergens religieuze) studenten naar het Vaticaan vertrokken.Binnentreden in de Sint Pieter is altijd ongelooflijk; je bevindt je midden in een kunstwerk. Waar elders in Rome ook de werken van Michelangelo en Bernini staan is deze basiliek de plek waar het allemaal samenkomt. Het is het hoogtepunt van drie eeuwen kunst in één gebouw. De zetel van St. Petrus, de Pietà, de koepel en de nog gesloten heilige deur. Zelfs een mis werd hier speciaal.Hierna bezochten ze de engelenburcht, het mausoleum van Hadrianus, waarna via diens brug de tocht huiswaarts werd aangevangen. Na een Chianti Borrel werd de reis naar restaurant ‘Simpatico’ aangevangen. Dit restaurant was een Chinees restaurant. Het is opmerkelijk dat de Chinezen hier heel ergens anders vandaan komen dan die in Nederland en voor een andere smaak koken. Bas nam een kip-kerrieschotel en Rick pikante kip. Dit werd aangevuld met een gezonde portie Kantonese rijst. Onze helden genoten van hun culinaire uitstapje; het was zo anders dan de wekelijkse portie chinees-indisch in het Vaderland. Terug bleek Mireia te hebben gebeld. Om haar terug te bellen moest de - toen weer - GSM-loze Rick natuurlijk naar een Telefooncel. De zesde bleek uiteindelijk te werken. De andere hadden alle opengebroken hoornen of ruis. Mireia bleek uiteindelijk niet veel te melden hebben. Ze vond dat ze wel erg snel weggegaan was de dag tevoren. Met een lief ciaociao werd deze dag afgesloten."
year_published = 2025
