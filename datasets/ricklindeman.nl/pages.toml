["http://www.ricklindeman.nl/files/6afb112a5ec32ed47dcad0537835011f-309.html"]
title = "Villa Adriana | Rome | rick filosofeert"
full_description = "Villa Adriana04/12/99 09:46 Opgeslagen in: RomeTegen enen vertrok onze tourist richting Tivoli om daar de Villa Adriana te gaan bekijken. Het was een lange reis. Hij ging eerst naar Termini om daar de Metro naar het busstation te pakken. Dit bleek te liggen in een grauwe buitenwijk van Rome. De blauwe CoTraL-bus vertrok al snel om via een gevangenis, waar de inwoners aan het voetballen waren, uiteindelijk bij de heuvels rond Tivoli te belanden. Fietsliefhebbers hadden Rick al geschreven dat het hier goed toeven was en nu kon hij zien waarom. Tegen een geschakeerde wolkenhemel staken de uitlopers van de Appennijnen schril af.De Villa Adriana was het buitenverblijf van Keizer Hadrianus (117-128). Deze was de eerste keizer die zich niet richtte op al maar verdere expansie, maar op het herstructureren en verdedigen van het gigantische imperium. Zo bouwde hij bijvoorbeeld de muur om de schotten uit zijn Rijk te weren. Paxman schrijft dat hieraan de Engelsen eignelijk hun eenheid te danken hebben. Hadrianus zorgde ook voor het hoogtepunt in de Romeinse architectuur, waarvan dit uitgebreide park er zeker één is. Het staat vol met bibliotheken, tempels, meren en fonteinen. Rick keek zijn ogen uit. Hij moest zelfs van het park worden verwijderd om dat het al lang dicht was.In het Tivoli raakte Rick aan de praat met de locale slijter, die hem er van overtuigde dat hij beter een andere bus kon nemen, wat verder maar met een hogere frequentie. Hier door miste onze planoloog tuurlijk de bus die hij eerst wilde nemen. Hij nam maar een slokje van de locale wijn. Uiteindelijk ging hij terug naar Rome in een bus vol nonnen die hem vrij snel bij Termini bracht. De rest van de terugreis duurde wel erg lang. Rick had ruim de tijd om alvast een Sinterklaas gedichtje te schrijven voor Marco."
year_published = 2025
