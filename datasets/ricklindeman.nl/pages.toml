["https://ricklindeman.nl/wielrennen"]
title = "Wielrennen – Rick Lindeman"
full_description = "Wielrennen admin | September 12, 2017 | interesses | No Comments In het begin van de Eeuw wilde ik naast schrijven over wielrennen ook zelf meer gaan fietsen. Ik fietste onder meer de Amstel Gold Race en de Ronde van Vlaanderen voor wielerliefhebbers. Door dat ik kinderen kreeg had ik helaas meer tijd. Maar toen de 40 er aan kwam, zei ik ‘Dan wil ik de Mont Ventoux beklimmen. En dat heb ik gedaan met een groep vrienden in September 2017. De aanloop vanuit Bedoin. Het verschrikkelijke Bos. Het maanlandschap. En dan de finish bij het weermeetstation onder applaus. Ik zal’t nooit vergeten. Voor een gamer als mijzelf wordt het fietsen bovendien leuker. Het bijhouden van Ritten op Strava motiveert (naast dat de data voor mijn werk nuttig is). Ook kreeg ik voor mijn verjaardag een setup om Zwift op te spelen. Hierin kan je je race fiets zetten op een thuisstandaard om virtueel te fietsen. Je kan dus de winter door fietsen. En virtueel racen. Mijn Ventoux foto’s vind je hier &lt;align=right&gt; jQuery(document).ready(function($) { $.post('https://ricklindeman.nl/wp-admin/admin-ajax.php', {action: 'wpt_view_count', id: '113'}); }); Related Posts Duiken & De Oceaan No Comments | Aug 18, 2018 Het is Koers! No Comments | Aug 18, 2015 Go No Comments | Apr 15, 2016 (Retro) Videogames No Comments | Jun 25, 2015 About The Author rickthuis"
