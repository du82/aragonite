title = "Rick filosofeert"
full_description = "Feb 2009 Rick filosofeert | Mar 2009 | Dec 2008 AFC-ACF26/02/09 14:26 Opgeslagen in: SportOp de verjaardag van misschien wel onze grootste Ajax fan.Speelden we eindelijk weer een echt Europa cup duel.Voor het eerst in 12 jaar zagen we Fiorentina weer spelen.En voor het eerst in misschien wel even langWonnen we een duel van een tegenstander van naamOver twee wedstrijden...Meer foto'sTags: AjaxBBC Radio17/02/09 10:14 Opgeslagen in: Sport : EnglishI made it onto the BBC Radio. In their football-phone in on tuesday, they have a section for the Totalitarian league. Here they imagine what would happen if there were only 20 teams allowed in Britain. I made the case for AFC Ajax. Listen what happened. The original mail? Read More...Tags: InterviewAjax-Feyenoord16/02/09 14:25 Opgeslagen in: Amsterdam : SportHeerlijke tweede helft, mooie Tifo en wat een rij!Druk!Tifo (mooi filmpje hier)Tags: AjaxSlumdog Millionaire16/02/09 14:24 Opgeslagen in: OpmerkelijkSlumdog Millionaire is een geweldige film. Ga er heen! Daarnaast komen de Oscars eraan, mijn favoriete films ooit op imdb.Interview in Retro Gamer16/02/09 14:18 Opgeslagen in: GamesIk werd geïnterviewd door Retro Gamer. Hieronder een scan (klik erop voor een grotere versie)Tags: InterviewNieuwjaarsfeest Evoluon15/02/09 14:54 Opgeslagen in: WerkZoals vaker was het nieuwjaarsfeest van Sn weer mooi.Meer foto'sWorld of Goo02/02/09 13:13 Opgeslagen in: Games : EnglishWhen Tim Burton realised “The Nightmare before christmas” at the end of 1993. He succeeded in many ways. One of the most peculiar was people loving and even adoring a macrable black gothic vision.Fifteen years later a video game achieves this same feat, but it is only one of the reasons World of Goo just might just be the perfect video game. Read More..."
