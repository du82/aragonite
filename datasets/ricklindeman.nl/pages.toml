["http://www.ricklindeman.nl/files/8ba84da58d64fdbd178a8ea0ab9574ea-539.html"]
title = "Nieuw jaar | Rome | rick filosofeert"
full_description = "Nieuw jaar01/01/00 13:22 Opgeslagen in: RomeTegen drieën konden we ons aan het bed ontworstelen, waarna we nu echt geconfronteerd werden met de rotzooi. Nadat contact was gezocht met geliefden in verre buitenlanden en een ontbijt met tompouce was verorberd vertrokken we voor een rustige wandeling door Villa Pamphili, waar we rustig filosoferend wakker konden worden. Hiervan teruggekeerd werd samen met de fransen het huis gereinigd, waarna een Gouter met ragout dit afrondde. Het begin van het jaar had voor weinig problemen gezorgd. De diverse telegiornales toonden feestende mensen van Tonga tot New York. De eerste avond van het nieuwe jaar werd rustig doorgebracht in verband met de reis van de volgende dag. Een zalmpasta werd afgerond met een mooie witte wijn, waarna de studenten gingen slapen, net nadat Marco was opgestaan."
