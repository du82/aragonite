["http://www.ricklindeman.nl/files/Mersey.html"]
title = "Merseyside Mayhem | Reizen, Werk, English | rick filosofeert"
full_description = '''Merseyside Mayhem22/08/08 10:29 Opgeslagen in: Reizen : Werk : EnglishMore photosThe joys of low cost travelling made me touch down in the city of the 5 times European Cup winner long after midnight. Luckily the proponent of Umihara Kawasa, Matt, stood on John Lennon Airport with a sign Rick "Mario" Lindeman. He brought me to my hotel.It would be a short visit, I would spent only 16 hours in the lands of her most royal majesty, Elisabeth II. Thursday, a rainy morning as one would expect on the shores of the Irish see, I had to work. John, from Austin Analytics picked me up, and brought me to an English breakfast bar. Brown, and wood, and without presumption. The corner stone of English Society.Duke StreetWe went to talk with the boss of Mersey Travel, so naturally we used Liverpool's underground. It was a combination of older rail lines, refurbished some 30 years ago. The boss himself was approachable and told us about all his new projects, his submarine and South Parkway Station. He would join us at LinkI went to see South Parkway Station. It lay lush in the green fields, and really open and sustainable, but without many passengers. I had forgotten how England looked, with its typics stone houses and streets. The city was filled with Lamb Bananas, decorated copies of a a famous sculpture, made for Liverpool Culture Capital 2008.Lamb Bananas at Lime StreetBack at Lime Street, after train trip through an impressive gorge of Lime Stone, Matt was there and went to Sapporo, a Tepanyaki restaurant. This was good food and good for my understanding of Liverpool. As we set there, 3 girls, who could be footballers wifes joined us at the table. They were dressed up, a bit sleazy but up to alevel, and i will never forget their accents.We enjoyed the cheaper Video Games, at Liverpool One, the new mega real estate urban renewal (good or bad, you decide) in the centre of the city. Later we went to see both Goodison Park and Anfield road, mere metres from eachother. Matt had been a blue boy all his life, but explained being blue didn't mean you had to be that anti-red, just during derbies. Respect was given to the victims of the Hillsborough disaster.Bar at AnfieldIt was almost time to go home, we drove through Penny Lane, back to John Lennon Airport. Meanwhile in Peking, we won the Waterpolo and marathon swimming. We competed at our own Olympics, getting our DSs out and playing New International Track and Field, and of course Mario Kart.Tags: Link'''
