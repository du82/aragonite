["http://www.ricklindeman.nl/files/a5e5e3f5ac77d4ef5ba803094d828e21-397.html"]
title = "Welcome to the Future | Party | rick filosofeert"
full_description = "Welcome to the Future15/08/07 10:22 Opgeslagen in: PartyHet Twiske is meestal zo'n fijn recreatie gebied. Lekker rustig. Om met je zoontje te fietsen.Maar daar, bij het huis van Ferdi. E., is ook de wieg van de heren van ID&TEn dus moest er een festival komen.De helden verzamelden al vroeg, achter het CSSinds 1897 vertrekt daar al de pont, naar het verre Noord.Tijkotte straalde uit dat hij de weg kende.En dus sloten er meer feestgangers zich bij ons aan.We gingen door Noord, we namen een toeristische route.De ov-fiets bewees zijn waarde wederom.Maar kijk, daar al naderde de Noordelijke ringweg,Voor velen, de grens der beschaving.Ondanks zero-tolerance geluiden, was de ingang ontspannen.Bij de deur volgde een button.Het eerste gerstenat stroomde naar binnen.Eindelijk een festival met zon.Dat was lang geleden.Maar het verbloemde ook veel.Want de muziek was wel heel rustig.Maar eigenlijk was dat op dat moment niet zo erg.Lekker dansen in de zon.Onverwachte ontmoetingen, met buren, met mooie dames.En zoals altijd is dance het best met goede vrienden.In de avond ging het gelukkig wel los.Derrick May was er.Eindelijk een beetje doordansen.Er liepen wel enge mannen rond.En toen het eenmaal twaalf uur was.Was de avond nog lang niet voorbij.Syl kreeg eindelijk zijn zinEen afterparty volgde.En daar, in club LatidoWerd er nog lang gehakt,Met moppies uit Mokum. Officiële sitePartyflock pagina / AfterMijn foto's op FlickrTags: Festivals"
