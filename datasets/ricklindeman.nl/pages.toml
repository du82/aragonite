["http://www.ricklindeman.nl/files/aba241e6e95ab1cdf2c8d16bf1dc99a2-130.html"]
title = "Bloesjesdag  \t | rick filosofeert"
full_description = "Bloesjesdag 28/02/01 17:15 Vanochtend was ik trouw vroeg naar de universiteit gegaan. Snel ging mijn Ericsson echter al weer af. Of ik in het zonnetje een kopje koffie kwam drinken. Dat sloeg ik natuurlijk niet af. Het zijn deze dagen weer de bloesjesdagen. De meisjes steken hun nog net iets te witte, doch frisse, ledematen uit korte bloesjes en mijn hormonen spelen weer op. Natuurlijk, ik zal me netjes gedragen, maar oh-oh, het uitzicht is toch eigenlijk te mooi. Zo zaten we net weer schandelijk elk voorbijlopend 'veulen' te beoordelen. Zo word je als nette intellectueel toch ineens weer die puber. Ineens is te begrijpen hoe men in Victoriaanse tijden al opgewonden werd van een ontbloot dijbeen. Als je een hele winter lang niets hebt gezien dan smelt je hart toch? Ik ben wel hard voor mezelf geweest. Ik zit tenslotte nu (2.04 PM) alweer even achter de computer. Alleen god weet hoelang ik het hier nog vol zal houden en weer lekker aan het bier zal gaan. Het is tè mooi weer. Ach, denk ik maar, ik heb een excuus: ik doe inspiratie buiten op voor deze stukjes?.Column gepubliceerd op campusbar.com"
