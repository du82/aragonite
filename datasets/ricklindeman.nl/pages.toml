["http://www.ricklindeman.nl/files/51fe48fb2730a8fbfd188d802297db98-452.html"]
title = "Football is War | Games, English | rick filosofeert"
full_description = '''Football is War20/04/08 08:05 Opgeslagen in: Games : EnglishFootball is WarPro Evo 2008 WiiThe best way to view a football game is to go to a stadium. While watching a race or baseball might actually be more rewarding from your special 156" HDMI Bravia Super Flat Wide Turbo TV, for football you have to be in the stadium. And I'm not talking about the lovely atmosphere I felt when I was at the e Derby">Curva Sud or in the Maracana. I'm talking about the overview you have when being on the stands. So why do most football games try to look like a footy match on TV?If you're on the stand you can see that free space on the left, and you want to scream to Sneijder to pass it there, because that is the place Arjen Robben will be in just a few seconds. On TV you just see Sneijder having doubts. When playing Fifa or PES on the 360 you are Sneijder, but only if you know by experience that Robben will be there and not practicing his Theatre performance, you will pass there.Pro Evo Wii is different. The birds eye view is back, for the first time since Sensi. You see Sneijder and Robben walking in lovely Orange. You point at Robben, hold B, and move to the empty space. There you release the B-button and see Sneijder passing to Robben with a lovely cross.Football is War, Fifa coach of the Century Rinus Michels said. And given his legacy, it is strange that no one before this game approached the jogo benito as a Real Time Strategy game. Because that is another way to look at Pro Evo Wii. You control your troops, and send them to the position they are needed. Out flank the enemy, let the wings cavalry setup your main knights.Since licensing became an issue in football games, the games concentrated on the individual player. Let's make Ronaldinho look as much as possible as he does in real life. Next the aesthetic doubts if it wise to do so, it is also denying what football really. It is a team game. And while it is great that individual players can make an action, the system is as important to win.And this is where Pro Evo excells. Not since Sensible Soccer, the team has been so much as the centre of the game. It shows you what football really is. Kieron Gillen wrote that Sensi allowed him to understand the game*. It showed him what the trick was. And the trick is that football, more than any other major sport, is one of constant fluidity.The core of Pro Evo Wii is brilliant, but how is it implemented, you might be wondering. The graphics look like they were on the ps2, but they are bright enough. As we are in the middle of the season,all stats are allready out of date. Dutch, Italian, Spanish and French leagues are licensed, but not the Premier League. The Master League of old Pes is gone. The manual is useless and daunting. It starts with a bloody tutorial you can't skip.But when you start a game it doesn't meather one yota. You are playing a fluent passing game a la Arsenal, Barcelona of mid-90s Ajax within seconds. Goals you regarded as dream goals in PES, are now common place. Defending is another thing. The first times you are helplessly clicking, but after a while yousee: you have to cover people and intercept passes, rather than rushing towards the player with the ball and trying to tackle him. There are some good instruction videos around to help you.It is a game filled with nice touches. After you won your first tournament, you can play a game with your Mii's. Jesus saves has never been taken so literally. The Champions Road, the replacement for the Master League is fun too. Everytime you defeat an opponent, you can acquire one of his players. Your team is constantly changing and getting better. You start with a fantasy team, at the end of the road your team is filled with players you only could dream of.Online is surprisingly good too, with lag free matches. This is surprising, as Konami is not really well known for their good online facilities. One downer however is that games between territories seem to be impossible.Pro Evo peaked previously around 2003, when WE6FE appeared on the Gamecube. After that game every single iteration seemed to get worse. All fun was taken out of it. But Konami gave this game to another team, and what no one expected happened. Not that it is a perfect game, but this new direction, is such a welcome breath of fresh air, and the most important thing to happen to football games since Sensible Soccer arrived in 1992.'''
year_published = 2004
