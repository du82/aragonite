title = "Het NatuurCanvas – Duurzaam Innoveren voor een Robuust Businessmodel – Rick Lindeman"
full_description = "Het NatuurCanvas – Duurzaam Innoveren voor een Robuust Businessmodel admin | September 11, 2023 | Publicaties | No Comments In Augustus 2023 verscheen mijn eerste boek. Je kan er meer over vinden en het bestellen op hetnatuurcanvas.nl. Diit is de preview die managementboek ervoor maakte. Verandertrajecten, Kwartiermakers en reorganisaties. Iedereen wordt er gek van. ‘Veranderen is goed’, aldus veranderaar Rick Lindeman. ‘Maar het is goed om af en toe van een afstandje naar de situatie te kijken. Hij schreef ‘Het natuurcanvas’. Een boek vol verhalen uit de natuur èn een praktische tool om je team te versterken. Hij vertelt erover in deze preview. Rick Lindeman|11 september 2023|2-3 minuten leestijd Een aantal jaren geleden fietste ik langs mijn bijenvolk. Dat volk was aan het zwermen, zoals dat heet. De lente was warm geweest en het volk was stevig gegroeid. De kast was dan ook behoorlijk vol. Dan maakt zo’n volk nieuwe koninginnencellen aan. De oude koningin vertrekt, samen met de helft van haar bijenvolk: Een zwerm. Terwijl ik samen met een andere imker de zwerm ving in een zesramer (een klein bijenkastje) begon ik na te denken. Hoe zouden de bijen eigenlijk een nieuwe plek hebben gevonden als ik ze niet had gevangen? Hoe maken ze dit soort keuzes? KEUZES Mensen hebben ook vaak niet door hoe hun eigen keuzes tot stand komen. Vaak denken ze dat die heel rationeel zijn, maar in de praktijk is dat helemaal niet zo. Keuzes komen bijvoorbeeld vaak tot stand doordat mensen kiezen wat anderen ook zouden kiezen. Door mensen een spiegel voor te houden, zoals die van de bijen, leren ze ook over hun eigen keuzes. Er zijn meer aansprekende voorbeelden uit de natuur. Nooit zal ik vergeten hoe ik in Indonesië op het koraalrif dook en voor het eerst clownvissen in actie zag. Die bewegen tussen de anemonen, en beide organismen profiteren daarvan. Er zijn vissen die tuinieren. Heel verschillende soorten vissen werken samen om een andere vis te vangen. Hoe werkt hun samenwerking, en wat kunnen wij daarvan leren? De ervaringen die ik in de praktijk als imker en duiker heb opgedaan, versterk ik in dit boek met de kennis uit mijn werkpraktijk en met wetenschappelijke kennis. KIJKEN MET EEN ANDERE BRIL Vaak kijk je vanuit je eigen positie naar je werkplek. Dan is het moeilijk om je te verbeelden dat het ook anders kan. Dit boek biedt een andere bril, die van principes uit de natuur. De natuur ontwikkelt zich immers al miljarden jaren door evolutie en weet zich aan steeds andere omstandigheden aan te passen. Met deze bril en het natuurcanvas dat erbij hoort, kun je aan de slag om te komen tot verbeteringen in je organisatie, en jouw plek daarin. Met de voorbeelden uit de natuur kun je kritisch kijken naar je eigen situatie. Met het canvas ontwikkel je vervolgens samen oplossingen. PRAKTISCH VERANDEREN Het natuurcanvas is een gereedschap om samen je vrienden of collega’s eens met een andere bril naar je organisatie te kijken en ermee aan de slag te gaan. Bij het boek zitten alle tools die je nodig hebt. Deze zijn gratis te downloaden en te gebruiken. Samen met je team kun je in een middagje aan de slag rond de thema’s samenwerken, verbinden, vernieuwen en besluiten. Met deze invalshoek hoop ik een uniek inkijkje te bieden in wat de natuur voor bedrijven en organisaties kan betekenen en je aan het denken te zetten over je eigen gedrag. Want voor de complexe problemen waarvoor wij tegenwoordig staan, kan leren van de natuur weleens de enige oplossing zijn. Het boek is te bestellen via onze managementboeklink jQuery(document).ready(function($) { $.post('https://ricklindeman.nl/wp-admin/admin-ajax.php', {action: 'wpt_view_count', id: '233'}); }); Related Posts Cycling data as change agent for Sustainable Mobility No Comments | Jun 3, 2019 Co-creatie tegen de Crisis No Comments | Aug 18, 2013 Het voorkomen van een braindrain No Comments | Jun 18, 2013 Kumasi No Comments | Oct 5, 2017 About The Author rickthuis"
