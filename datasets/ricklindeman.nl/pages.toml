["http://www.ricklindeman.nl/files/62e0007e4b6d17c7923ae1a5b7d7fc61-296.html"]
title = """
Regen in de PC. Hooft
 | rick filosofeert"""
full_description = "Regen in de PC. Hooft 25/01/01 16:54 Vanochtend liep ik door de PC Hooftstraat. Ik moest er weer eens netjes uitzien. Ik dacht dan ook wel te slagen in één van de weinige straten in Nederland die ook maar op de Romeinse Via dei Condotti lijkt. Dat lukte ook, maar wat zag de straat er slecht uit.Waar ooit grote namen het straatbeeld domineerden, leek nu het woord ‘Sale’ het enige zichtbare. Natuurlijk, om het iets meer klasse te geven stond er ook wel eens op zijn Italiaans ‘Saldi’. Daar hielden de hoogtepunten echter al snel op.De Zara is onlangs geopend. De Barcelonese keten zit tussen de H&M en designerkleding in. Dit is één van de weinige hoogtepuntjes die je nu ziet op de straat van de zeventiende-eeuwse dichter. Eigenlijk hoort ook die winkel ook niet thuis tussen Prada en Boss.Het is echter nog hoopgevend, want voor de rest lijken dumpwinkels een plaats te hebben veroverd in de straat. Omdat de huren zo hoog werden en de Nederlander nog steeds weinig uitgeeft aan kleding, kunnen ze tijdelijk een pand huren voordat een nieuwe zaak het probeert. Vanochtend werd ik nat van de regen en kon alleen met weemoed denken aan de tijd dat ik nog in Rome woonde en iedereen er molto gentile uitzag."
year_published = 2025
