["https://ricklindeman.nl/archeologie-onder-water"]
title = "Archeologie onder water – Rick Lindeman"
full_description = "Archeologie onder water admin | June 14, 2023 | Publicaties | No Comments Ter nagedachtenis aan mijn vader, een groot liefhebber van archeologie deed ik in maart (theorie) en april (praktijkonderzoek) een cursus onderwaterarcheologie bij de LWAOW. Een mooie combi, aangezien ik van duiken hou. Hier het onderzoeksverslag Deze bout van het wrak zat los, is terruggeplaatst. Het hele verslag is via Issuu te lezen Dit is het verslag van het onderzoek in het kader van de Basiscursus Maritietieme Archeologie 2023 van de Landelijke Werkgroep Archeologie Onder Water. In deze opleiding doet een groep een begeleid praktijkonderzoek naar een wrak. In ons geval ging het om een wrak op botterkerkhof van Spakenburg. Ons team van 4 – Koen Ammerlaan, Gerrit de Groot, Herman Massing en Rick Lindeman – onderzocht wrak 27. In dit rapport worden de resultaten van dit onderzoek getoond. Het wrak tov de haven van Spakenburg. De stadions zijn net ten Westen van deze foto In de voorbereiding hebben we gebruikgemaakt van de diverse scans die aanwezig waren en historische bronnen die zijn verzameld. Tijdens het theorieweekend hebben we skills opgedaan om te komen tot een plan van aanpak en het onderzoeksdoel voor het praktijkonderzoek. Dit doel was het inzichtelijk maken van wrak 27 in situ op het botterkerkhof te Spakenburg, ook wel het Sjutenkarkhof genoemd, zodat de Gemeente Bunschoten een startpunt heeft om eventueel beslissingen te nemen om wrak 27 wel of niet te beschermen tegen (verder) verval. Neet en Verweij (2021) geven aan dat de verre doelstelling is om ‘synthetische reconstructies’ van de wrakken te maken. Sidescan met behulp van een zogenaamde humminbird. Wrak bij de blauwe puntjes Vervolgens hebben we in drie duiken de benodigde gegevens verzameld en het wrak ingemeten. De resultaten hebben we verwerkt in een vlaktekenin. Hierdoor konden we gedeeltelijk antwoord geven op de onderzoeksvragen. Het wrak was voor sommige vragen al te verweerd. De criteria voor de BMA geven aan dat we ons moeten richten op het onderhanden onderzoek en dat hebben we uiteraard gedaan. Toch werden we ook gestimuleerd om verder na te denken en met behulp van een aantal vuistregels kan er een hypothese worden ondersteund dat we inderdaad te maken hebben met een botter. Het rapport wordt afgesloten met een aantal reflecties op de geweldige cursus die we hebben doorlopen en een aanbeveling over het onderzoek: kijk naar het verval over de tijd, maar graaf het schip niet op. De waarde zit niet in die ene botter, maar in het feit dat ze allemaal bij elkaar liggen. Foto’s van de cursus staan hier jQuery(document).ready(function($) { $.post('https://ricklindeman.nl/wp-admin/admin-ajax.php', {action: 'wpt_view_count', id: '209'}); }); Related Posts Ab Urban Condita No Comments | May 27, 2001 Het NatuurCanvas – Duurzaam Innoveren voor een Robuust Businessmodel No Comments | Sep 11, 2023 Hollandsche Steden in de Republiek No Comments | Oct 5, 2017 Van Fiets en Vis No Comments | Jul 6, 2021 About The Author rickthuis"
