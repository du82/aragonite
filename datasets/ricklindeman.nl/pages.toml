title = "Koninginnedag 2002 | rick filosofeert"
full_description = "Koninginnedag 200230/04/02 17:45 Ondanks dat Burgemeester Job Cohen en zijn voorganger Schelto Patijn er alles aan gedaan hebben om de dag door regels te verpesten, werd er ook op 30 april 2002 gewoon gefeest in de hoofdstad.De avond van de 29ste werd gevierd in Hans en Grietje. Vorig jaar al hadden B&W de Nieuwmarkt tot zwijgen gebracht. Gelukkig was dit café een goed alternatief. Gehuld in Oranje trokken Rick en zijn gade naar dit café, waar tientallen bekenden hun weg naar de dronkenschap meemaakten.De Volgende dag bleven onze helden een beetje uitslapen. Ook bleek de onderbuurman weer van zich te hebben laten spreken. Toch waren onze helden vol goede moed om half twee bij het concertgebouw. Hier ontmoetten ze Tara, Paula, Jolanda, Dennis en BrigittaHet concert van 538 wilde niet echt loskomen. Toen het 'Liberté' klonk werd er eindelijk gedanst. Hier waren de omringende musea bang voor, Maar dat mocht de pret niet drukken. Toen kwam de surprise act: Queen. Zonder Freddy M. (r.i.p) was de band helaas was magertjes, maar het 'Radio Gaga' deed toch de sfeer stijgenVervolgens was het nu wel tijd om deze commerciële ellende achter ons te laten en de stad in te trekken. Het Max Euwe-plein was al een verbetering. Op het Leidseplein gebeurde echter maar weinig. Naast het Cinecenter bleek ineens een Oranje-discotheek gevestigd die zorgde dat de de temperatuur wat steeg en er lekker gedanst kon worden. De eerste biertjes waren intussen ook al weer naar binnen gegoten.De Jordaan was wel druk als vanouds en vooral gevuld met verwijzingen naar Pim F. Het over het water met de katapult elementen in Pim' achterste gooien had was verreweg de populairste attractie.De Rozengracht was door Ome Job. ook stilgelegd. Onze helden waren nu aan wat versterking toe en stortten zich gretig op het eethuis bij de Mazzo. Dennis en Rick hadden zich ook al aan een Saté gewaagd, doch of die hygiënisch verantwoord was?Tenslotte was er het traditionele hooigooien bij de Koe op het Weteringcircuit. Maar toen waren Celine & Rick al weer zo vermoeid dat ze tevreden, doch toch een beetje teleurgesteld huiswaarts keerden."
