["https://ricklindeman.nl/lindeman-drank"]
title = "Lindeman & Drank – Rick Lindeman"
full_description = "Lindeman & Drank admin | February 22, 2017 | interesses | No Comments Om één of andere redenen maken de verschillende familie Lindeman(s) veel dranken. Ik hou trouwens ook van een mooi biertje, zie mijn Untappd”-profiel voor de meer dan 350 verschillende biertjes die ik heb geproefd. Ook organiseerde ik ooit een bierverjaardagsfietstocht Hier staan de Lindeman-drankconnecties op een rijtje. De geschiedenis van Asbach Uralt In 1892 stichtte de broer van de overgrootmoeder van Rick, Hugo Asbach in Rüdesheim de destilleerderij Asbach, waar men tot op heden Asbach Uralt maakt, de grootste Weinbrand (cognac) van duitsland. Wanneer je het pittoreske dorpje Rüdesheim bezoekt, zal je overvallen worden, aangezien alles er op gericht is de mensen die het reisje langs de rijn maken, zoveel mogelijk cognac en gerelateerde produkten te verkopen. Echter, om de ware geest van de wijn te proeven, is niets zo lekker als een glas Asbach. Site van Asbach De geschiedenis van Lindemans wijnen De Engelse arts Henry Lindeman ontdekte tijdens zijn reizen door Europa de heilzame werking van wijn. in 1840 emigreerde Lindeman naar Australië. hij vestigde zich in de Hunter Valley en plantte in 1843 in Cawarra zijn eerste wijnstokken. Lindeman zag wijn als wezenlijk onderdeel van de voeding. Zijn wijnen waren bedoeld voor dagelijks gebruik en moesten direct na aankoop drinkbaar zijn. De productie van wijn stond toen nog in de kinderschoenen. In die tijd hadden alle rode wijnen jaren nodig om zich te onwikkelen en zacht te worden. Om de wijnen te laten rijpen bouwde hij een grote kelder. Pas als Henry Lindeman zijn wijn op dronk vond, mocht de fles over de toonbank. Lindeman en zijn Engelse vrouw kregen 10 kinderen. Vijf zoons werkten mee in de wijngaard en het bedrijf groeide. Nu, anderhalve eeuw later, beschikt Lindemans over wijngaarden, wijnhuizen en kelders verspreid over heel Zuidoost-Australië. Voortdurend wordt gezocht naar vernieuwingen om nog beter fruit te oogsten en dus wijnen van hogere kwaliteit te maken. Vooral de bin wijnen zijn bekend. Dit zijn inmiddels klassiekers die wereldwijd naam hebben gemaakt. Rick’s tip: De Shiraz Cabernet Site van Lindemans wijnen De geschiedenis van Brouwerij Lindemans Acht generaties geleden, in 1809, exploiteerde familie Lindemans een boerderij in Vlezenbeek, aan de rand van Brussel. Om tijdens de wintermaanden iedereen aan het werk te houden, werd besloten een klein lambik-brouwerijtje op de boerderij in te planten. Door het groeiende succes van de lambik werd het brouwen stilaan belangrijker met als gevolg dat de landbouwactiviteiten werden stopgezet in 1930. Vanaf dat ogenblik begon de familie Lindemans Geuze en Kriek te produceren. In 1978 werd Faro, een populaire volksdrank ten tijde van Breughel, opnieuw gelanceerd nadat ze bijna volledig van de markt verdwenen was. Framboise werd voor het eerst op de markt gebracht in 1980, en ten gevolgen van het succes van dit fruitbier creëerde Lindemans 2 nieuwe fruitbieren: Cassis in 1986 en Pecheresse (perzikenlambik) in 1987. Door de nog steeds groeiende vraag naar lambikbieren was de capaciteit van de verouderde brouwzaal te klein geworden om de productie te volgen. In 25 jaar tijd groeide de productie van 5.000 Hl naar 50.000 Hl. Om de lambik te vrijwaren voor een kwaliteitsdaling ten gevolgen van overproductie, werd in 1991 besloten om naast de oude brouwerij een nieuwe brouwzaal op te richten, met een capaciteit die drie keer hoger lag. In 1995 werd er opnieuw creatief met lambik geëxperimenteerd, en zag een ongewoon bier het licht: het Tea Beer, een bier met een verrassende citroenzuur -zoete smaak. Door de jarenlange ervaring met lambik en door steeds een perfecte kwaliteit na te streven, bleven ook de resultaten niet uit: In 1985 riep Michael Jakson (The Beerhunter) Lindemans Kriek uit als één van de 5 beste bieren van de wereld. W.B.C. Festival 1994-1995: Lindemans Kriek Lambic : Platina medaille Lindemans Pecheresse: gouden medaille Cal. B. Festival 1995: Lindemans Framboise: Gouden medaille Lindemans Geuze Lambic: gouden medaille W.B.C. 1996: brouwerij Lindemans werd uitgeroepen tot één van de tien beste brouwerijen van de wereld. W.B.C. 1997: brouwerij Lindemans werd uitgeroepen tot één van de tien beste brouwerijen van de wereld. Deze onderscheidingen brachten met zich mee dat Brouwerij Lindemans, samen met de brouwerij Orval, het grootste aandeel heeft gekregen in de export van Belgische bieren naar de U.S.A. Het streefdoel van brouwerij Lindemans bestaat hierin om de steeds evoluerende markt te volgen op een creatieve wijze, zonder het respect te verliezen voor het traditioneel moederbier; lambik. Heden ten dagen is de boerderij-brouwerij volledig ingepalmd door de brouwzaal, fermentatiezolders en -kelders, de bottelarij en stockageplaatsen. De produktiecapaciteit van de brouwerij in 2003 was 50.000Hl, waarvan 30% bestemd was voor export naar o.a. Frankrijk, Verenigde Staten, Zwitserland, Duitsland, Zweden, Nederland, Japan, Argentinië, Engeland, Italië, Portugal,… De brouwerij wordt beheerd door René en Nestor Lindemans, geholpen door hun zonen Dirk en Geert Lindemans, en de exportmanager Tony Dillen. Site van de brouwerij Lindemans Rick’s bier, streekbier uit Voeren Rick’s bier is van hoge gisting met nagisting op de fles en in alles een typisch product uit de nog steeds raadselachtige Voerstreek. De ambachtelijk bereide appel- en perenstroop of kersen geeft dit kwaliteitsbier van en voor alle seizoenen een opmerkelijk karakter: Geserveerd op de juiste temperatuur en in het speciaal daarvoor ontworpen glas ontwaart men pas een dunne nevel die dit gerstenat siert en ons lijkt te willen zeggen: ‘Slechts op de tong geef ik iets van mijn Voerens mysterie prijs’ De schenktemperatuur ligt tussen 6 en 10°C. Het bier is te koop in het VVV-kantoor van ‘s-Gravenvoeren jQuery(document).ready(function($) { $.post('https://ricklindeman.nl/wp-admin/admin-ajax.php', {action: 'wpt_view_count', id: '101'}); }); Related Posts Rome en AS Roma No Comments | Feb 22, 2017 (Retro) Videogames No Comments | Jun 25, 2015 Wielrennen No Comments | Sep 12, 2017 Go No Comments | Apr 15, 2016 About The Author rickthuis"
