full_description = "Overgeleverd aan gekken28/02/01 16:34 Vandaag mocht ik op audiëntie komen. Helaas niet bij de paus, maar bij mijn huisbaas. Het is een echte huisjesmelker in de Rivierenbuurt. Hij is de eigenaar van een aantal panden in de Roerstraat en omgeving. Dus ik ging er op af door de sneeuw.De man deed open. Hij was nog niet helemaal wakker. Het is de zoon van de eigenlijk huisbaas. De man weet ook niet wat hij met zijn geërfde positie moet doen. Hij was gekleed in een jogging pak en was nog niet hersteld van de weedlucht die we af en toe uit zijn huisje ruiken.Er wordt verbouwd bij mij. We denken dat hij ons er eigenlijk het liefst er uit zou willen hebben om de panden te verkopen. Dan kan hij al het geld verbrassen en hoeft hij helemaal niet meer te werken. Voorlopig lijkt hij echter geaccepteerd te hebben dat wij er nog even zitten.Wel moet de ruimte brandveilig gemaakt worden. Na Volendam kan hij zich al helemaal niet veroorloven de aanschrijvingen van het stadsdeel te negeren. En dus stond de man dinsdagochtend ineens met een dikke en een oude bouwvakker voor onze deur. Of ze de keuken er even mochten uithalen.Nu zijn we allemaal bijna afgestudeerd en zullen dan eens in een echt huis gaan wonen. Voorlopig studeren we echter nog en moeten we nog met de grillen van de huisbaas rekening houden. En met zijn bouwvakkers die vanochtend hun simpele wereldbeeld tot vervelens toe aan mij aan het vertellen waren."
