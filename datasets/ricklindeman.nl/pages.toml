full_description = "Awakenings Svezia11/04/04 09:09 Opgeslagen in: Party ￼ Vanuit Goteborg en Stockholm daalt een pure Techno-vorm af naar onze streken. Op eerste paasdag stonden wij (Tijkotte en den schrijver dezes) op een koude pont, die ons bracht naar de loods, waar ook vroeger de boten uit Scandinavie afmeerden. Geverfd in geel en blauw betraden wij de arena. Er waren alleen Zweedse DJ's bij deze Aflevering van Awakenings. Het was nog rustig, maar de geluiden van de beekdschone DJ Shiva begeleiden ons naar de garderobe. Hier was er een nieuwe innovatie: iedereen kon een kluissleutel huren, zodat er niet aan het einde een enorme rij ging ontstaan. ￼ De muziek installatie draaide ook eindelijk naar behoren, na tegenvallende sounds in eerdere afleveringen. Al snel troffen wij Jossie, dans-heldin uit Rimini. En samen met Roberta, onze inspiratiebron van Dancevalley, gingen wij op zoek naar de andere helden: Walter, Richard, Suzanne, Martijn. Doordat het buiten vrij koud was, was het binnen een keer niet te heet, en konden de waaiers in de zakken blijven. ￼ De muziek versnelde al spoedig, om in zuiver Techno over het leger der Vikingen neer te dalen, onze helden voelden zich in een waar Walhalla. DJ Dahlback, Hardcell & Grindvik en Adam Beyer vulden de avond. Het sfeertje was weer klassiek awakienings, geheel geen agressie of drukte, gewoon liefhebbers onder elkaar. Op maandag ochtend, terwijl het ochtendzonnetje gloorde gingen onze helden met een tevreden glimlach weer naar huis, om daar helaas te ontdekken dat Jimmy in de tussen tijd op avontuur was gegaan.... RickTags: Awakenings"
