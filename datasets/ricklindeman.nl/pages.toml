["https://ricklindeman.nl/go"]
title = "Go – Rick Lindeman"
full_description = "Go admin | April 15, 2016 | interesses | No Comments Go is het mooiste bordspel ter wereld. De grote belofte die een leeg bord biedt. De grote strategische zetten. De kleine gevechten in de hoeken. Het belang van mooie vormen. Het belang van intuïtie het kiezen van de juiste stap. Onverslaanbaar achtten we ons als Go-spelers. Dat schaken allang tot de computer verslagen was, bewees ons gelijk. Go was het meest pure spel dat er was. Totdat de realiteit ons in de vroege lente van 2016 inhaalde. Wereldkampioen Lee Sedol werd met 4-1 verslagen door AlphaGo, een neuraal netwerk van een Britse loot aan de Google-stam. Ik ben zelf maar een matig Go-speler. Beter dan een 5de kou werd ik niet, met een 17de plek op het NK voor Club teams met het het Legendarische team “Oogstfeest” als beste resultaat. Een ander hoogtepunt was deelname aan het EK in Marseille in 1997. Aan de voet van het Velodrome verdedigden we nationale eer. Ik had het spel ontdekt naar aanleiding van een column van Jan-Joost Lindner in de Volkskrant “Homo Ludens“, de spelende mens. Ook kan ik me een stuk in de “Commodore Dossier” herinneren waar geprobeerd werd om het beige bakbeest een edel spel te laten spelen. In het Go-centrum zat ik liever aan de Bar. En dus werd ik maar bobo. Eind jaren 90 was ik bestuurslid en later voorzitter van Go-vereniging de Twee Ogen (De op een na grootste Go-club van het land) en accountmanager van de Nederlandsche Go Bond. Helaas kom ik nog maar zelden toe aan een spel Go, maar niks is mooie, dan een elegante strijd over 300 zetten, die door één of meer keiharde gevechten wordt beslist met maar een paar punten verschil. jQuery(document).ready(function($) { $.post('https://ricklindeman.nl/wp-admin/admin-ajax.php', {action: 'wpt_view_count', id: '75'}); }); Related Posts Lindeman & Drank No Comments | Feb 22, 2017 Familie No Comments | Jul 19, 2015 (Retro) Videogames No Comments | Jun 25, 2015 Het is Koers! No Comments | Aug 18, 2015 About The Author rickthuis"
