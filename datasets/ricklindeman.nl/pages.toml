["http://www.ricklindeman.nl/files/a0ac2af5d363cb8e9ed3e359c62ce3d1-311.html"]
title = "Pepernoten | Rome | rick filosofeert"
full_description = "Pepernoten06/12/99 09:55 Opgeslagen in: RomeOm kwart voor negen verliet Rick het huis, een slapende Bas achterlatend in la sua stanza. Garano's college bleek helaas een integrale herhaling van het college van de donderdag, toen er maar weinigen aanwezig waren. Was Rick hiervoor uit zijn bed gekropen? Hij deelde maar pepernoten uit. Thuis trof hij Bas en na de koffie vertrokken ze naar de Todis, de Italiaanse Aldi om de voorraad van de heilige cafeïne drank aan te vullen. Er werd echter op miraculeuze wijze vergeten het zwarte goedje aan te schaffen zodat ze alsnog langs een alimentari gingen. Wel werd de Chianti-voorraad ruim bijgevuld.Om twee uur waren onze Amsterdammers in de stad, waar Rick gids speelde voor onze Bas. Eerst voelden ze zich weer nietig in het Pantheon, werkelijk in 27 v. chr. geconstrueerd om de mensen op zijn ondergeschiktheid te wijzen. De Piazza Navona was het volgende doel. Hoewel de kerstmarkt die er stond gezellig was, verstoorde ze helaas de zichtlijn tussen de drie fonteinen met de meesterlijke Fontein der Vier Rivieren van Bernini. Ook de andere geniale fontein van de meesterarchitect, de Trevi-fontein, was niet helemaal ideaal. Bas voelde zich nou niet helemaal Marcello Mastroianni toen hij slechts beton in verbouwing aantrof. De zichtlijn vanaf de Spaanse trappen door de Via dei Condotti was gelukkig wel ideaal met een ongelooflijke zonsondergang.Ten besluit van dit Toeristisch intermezzo werd de Piazza del Popolo aangedaan, waar de tweelingkerken met trots de poort van het volk bedwingen. Door deze poort gingen onze studenten daar de Via Flaminia, zoals vroeger al Goethe zo de stad verliet. Bas moest namelijk mee naar het college. De aanwezige groepsleden waren nogal geschokt door het optreden van Rick de donderdag ervoor. Malusardi was er ondanks zijn verlies van de woensdag tevoren. Hij bracht evaluatieformulieren met zich mee zodat onze Uva'er nu invloed had op het onderwijs aan de grootste universiteit van West-Europa.Thuis at Bas zijn eerste echte Italiaanse pasta en belde Jasper om te melden dat hij nu zeker langskomt. Bas Rick proostten nog een glaasje Chianti uit 1997 om de avond uit te luidden."
