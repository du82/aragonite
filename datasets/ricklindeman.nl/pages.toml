["http://www.ricklindeman.nl/files/archive-aug-2009.html"]
title = "Rick filosofeert"
full_description = '''Aug 2009 Rick filosofeert | Sep 2009 | Jul 2009 Mijn eerste keer Ajax19/08/09 13:04 Opgeslagen in: SportIk vond in de rommel van mijn ouders.Het programma van het Amsterdam 713 toernooi.Het werkte als een Madeleine bij Proust.Ik was er vlak bij geboren, 300 meter ofzo.Die betonnen roestbak.En later weer die schitterende Stijl van WilsEr talloze malen om heen gefietst, op weg naar OmaEr achterlangs getramd of gevaren.Maar nuDeze 5de augustus 1988.Zou ik er naar binnen treden.Eindelijk zien wat er achter die Citroën gebouwen lag.Op mijn 9de hing er een poster van Mexico'86 in onze gangEen jaar later was er die voorzet van Silooy op Van Basten1988 bracht ons allen verlossing.Ajax - Lokomotive Leipzig 1-0, mijn eerste bewuste europacup finaleEn dus gingen we naar binnen.Een blik op de welkomstwoorden 21 jaar later.Laat zien hoe heerlijk kneuterig voetbal in de jaren 80 nog was.Gullit was net naar Milaan. Af en toe zagen we Don Leo in Madrid.Welkomstwoorden, hele folderDe eerste wedstrijd was tussen Benfica SL en Sampdoria.Benfica, dat hier ooit eens een van de mooiste Europacup finales had gewonnen.Eusebio, schim van het verleden.Het werd een ordinaire schopparij. De Italianen kregen 5 penalties.Maar toen kwam ons aller Ajax.Het club lied werd nog niet meegezongen.Ajax had er weinig zin in.Maar toch.. Ajax!!Ze speelden tegen Flamengo.De rubanegra uit Rio. Net verslagen in het CariocaWat een magische naam. 16 jaar voordat ik zelf het Maracana zou betreden.Maar dat wist ik niet. Ik werd slechts warm van de exotische klanken.Vasco-Flamengo 2-1, Carioca (Staatskampioenschap van Rio) 1988Ik was met mijn vader en mijn grote broer. Die was al eens geweest.Mijn vaders oom was voor het oude Blauw-wit, waarvan de opvolger hier nog maar een paar jaar geleden,- op het bijveld - speelde. Maar dat hadden wij nooit bewust meegemaakt.En papa was voor Ajax. Wij hadden nooit anders gekend.John en Johnny kwamen bij ons in het dorp.Zoals de familie Reiziger met ons te kerke ging.Ajax verloor. Het was ook laat.Maar vooral dat gebouw, de stank, maar ook de massa.De architectuur, maar ook de traditie.een liefde was ontwaakt.Het rood-witte hart begon nu echt te kloppen.Om nooit meer stil te staan.Tags: AjaxEr is een renner getrouwd17/08/09 13:05 Opgeslagen in: PartyLieve Jasper,Altijd ben je vol verwachting,Kijkend naar je apparaat,Dat één met je is geworden.Jaren geleden al,Had je een Zuid-Afrikaanse site ontdekt.Die gratis berichten kon versturen.En dus bereikten je stapverhalen ons.In brokjes van 164 tekens.Vaak door elkaar.Op koers met Hanneke, Met Maud de Cauberg op,Het uitzicht op Ballon d’Alsace met Sanne..En recenter nog, de onbereikbare sogno van de Côte de JulietteOp een feest zien we hem staan.Na een lange kleipartij.Genietend van de muziek,Maar ook wachtend op een boodschap van zijn grote liefde. Want, lieve Jacq,Alleen dan, wanneer hij leest dat alles goed gaat met jou,Dan, kan hij pas echt genieten.Hij zocht altijd naar een Mont Ventoux om te beklimmen.Kijkend naar de helden in de gele trui.Schaatsend, lopend, roeiend.Met stapels Mens Health onder zijn bed.Hopend dat die hem konden helpen.Stapels Folia’s. Stapels krantenartikelen.En huis vol snuisterijen ……Die allemaal, ja zelfs de derde TV en de vierde stofzuiger, moesten meeverhuizen.Jaren geleden zagen we je onverstaanbaar onze Amstelstad binnen fietsen.Die eerste avond, in Amstelveen, ondertekende je reeds met jouw persoonlijk markering. Jaren nog voordat bij Voltt een bijzondere, bij Martijn niet zo geliefde, traditie haar intrede deed ….Daar was hij dan, een Twent in Amsterdam.Genietend van ’t klootschieten, maar nooit in het oude Diekman geweest.Wel bij de bekerfinale, maar juichend voor Wit-Rood-Wit. Ben je nu een echte Twent of vind je vooral dat je een echte Twent moet zijn? Meer en meer werd Mokum deel van jou.Geniet je van ’t Jordaanfestival en huil je om Koning Dré.Op YouTube “Ik leid m’n eigen leven” en “Bloed, Zweet en Tranen” in de Godentempel.En zelfs, heb je nu een gedeelde seizoenkaart van Ons Aller Ajax, Onze Vreugd en Trots Bezit! Stukje bij beetje wist Jasper zijn eigen plek te veroveren.Nooit echt de geboren student.Langzaam ontdekkend welke onderdelen van het studentenleven hem bevielen.Van roeipogingen in het begin, naar zweven op de techno,Om de volgende dag gezellig naar Bataviastad te gaan…Loyaal tot in het uiterste.Altijd op bezoek bij vrienden in ’t verre.Ook niet af te brengen van een bestemming.En schattig gefrustreerd als alleen hij daar heen wilde.Om zijn ellende vervolgens in epistels oeverloos te analyseren.Wat hebben we van je genoten in Barcelona en Lombardije.Beroofd werd je, door hoeren ,op de Ramblas, van geld, en erger, je telefoon.En Mart Smeets aansprekend op het vliegveld van Bergamo. De grote Mart, die diep geroerd was omdat je iets moois voor Bogey ging doen! En uiteindelijk maakte hij het af. En vond hij een baan die hij wilde.Van de planologische speeltuin op IJburg via de maxisbrug naar Muiden.En dat heeft je rust gegeven.De rust om deze stap te zetten.Klaar om verder te gaan, zeilend naar de toekomst.Lieve Jasper,Geniet van je Jacq, geniet van ’t leven en deel dat leven met ons!Gefeliciteerd!Loïs!11/08/09 08:51 Opgeslagen in: FamigliaLoïs Sofie Lindeman is geboren, kijk op haar eigen site voor veel meer foto'swww.loislindeman.nl. Direct naar de foto's op flickrPapa en Mama blij!Sogni08/08/09 09:30 Opgeslagen in: PartyDe hele bachelor set foto'sWe hadden hem al gek gemaakt.Met verhalen, van een vreemde Francaiseuit Velsen.Hij stond alIn jurk, op de Gay-paradeSymbool van onze Mokumse vrijheid.Maar nu waren we hem aan het opwachten.De mannen waarmee hij het einde van zijn vrijheid wilde vieren.Op het terras, langs die lange weg naar Amstelveen.Hij kwam aangefietst, in wieleroutfit.Schijnbaar nog onbekend, met wat er stond te gebeuren.Zijn afkomst werd niet verloochend.Er werd kloot geschoten, door een prof uit Tubbergen.Wij hadden zelf een potentiële WK-deelnemer in ons midden.Toen spoedden de renners ons naar de stad zelf.Zo rap zelfs dat de gastvrijheid van ons mokum aan anderenvoor even op de proef werd gesteld door de ploegleider.De Gazzetta della Giulietta schreef er schande van.We genoten van de drank, de Jajum, in al zijn vormen,en verwelkomden vrienden, terug uit Aziatische gronden.Om vervolgens te belanden in de relaxte omgeving van broeders' boot.Daar werd onze Twent nogmaals beproefdOver juist dat waar hij zo trots op was,Zijn data, zijn bergen.Tenslotte keerden we terug, waar heel veel begon, in de Gieter, Plek van valse illusies en studentikoze drank.Toen splitsen de wegen zich.De Twent zelf zweefde in J_Dano_25th_Anniversary.html" rel="self">Paradiso, De avond voor hemzelf afrondend.Tewwijl anderen hun geluk beproefden in Joop.Zich moeizaam staande houdend tussen de veulens.Alea Iacta Est06/08/09 10:02 Opgeslagen in: Sport"Cesar triomfeert in Romeins bad"Het was de kop in de sport die me brak,In de ooit zo roomse VolkskrantMeer nog dan de hommage aan Michaël zelf, enige pagina's ervoorWant juist daar vlakbij, op het forum van Mussolini.Zette ik mijn eerste stappen, in mijn toekomstige woonplaats.Hoewel een lauwerkrans bij de vorm van zijn hoofd paste.Krijg ik meer een van hem, als iemand die woekeraars wegjaagt uit de tempel.Wat was ik blij dat juist hij correspondent werd in mijn geliefde Rome.Wie anders kon verslag doen van de kwetsbaarheid, van de diepe ziel van de eeuwige stad,Maar die toch ook de moderne cultuur van de straten wist op te vangen. Ooit zag ik in het theater op het Largo ArgentinaEen opvoering van Macchiavellis MandragolaOver de beperkingen van de mensheid.Ik dacht even dat hem de hoofdrol zag spelen,Als vertolker van een eeuwenoude boodschap.Tags: dode_helden, Rome'''
