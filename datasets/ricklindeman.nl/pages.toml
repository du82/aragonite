["http://www.ricklindeman.nl/files/archive-apr-2008.html"]
title = "Rick filosofeert"
full_description = '''Apr 2008 Rick filosofeert | May 2008 | Mar 2008 Boulets a la Liegeoise28/04/08 11:41 Opgeslagen in: Sport : ReizenVeel meer foto's vind je hierHet was het weekend van Kasmussen.Niet alleen was het zijn idee.Op de Stockeu liet hij de Twent en de Kasseienlegger ver achter zich.Kasmussen en Merckx, kampioenenMaar het was ook vooral het weekend der Luikse ballen.Op de tafel, op de markt, bij de Vogels, As OuhesEn ook natuurlijk bij de damesIn de Escalier, de Meander van Luik.CindyEn dat was nog maar zaterdag.Nog voor de avontuurlijke wandelingVan de halve Cruyff.Al was het maar langlaufen en geen afdaling.Of toch juist wel.Lichte wandelingen in NinglingspooMaar toen kwam het hoofdrecht.Wederom vol Luikse ballenStaande op de Redoute.Michien niet meer altijd de scherprechter.Maar toch de mooiste bergOok in de 93ste aflevering van La Doyenne.Daar scheen de zon.En waren we twee weken geleden een week te vroeg in de stad van een winnaar van een Jupiler LeagueNu zagen we het staartje van de winnaar van een andere.Na 25 jaar was Standard weer kampioen.Lalalalalala, Standard de LiegeTussen de fans van Philippe Gilbert.Zagen we eerst kanslozen naar boven klimmen.Dat hoorde bij de koersToen kwam de lokale held zelf.Maar al spoedig werd die gevolgd door de echte klappers.Speelballen zijn hetDoor Cunego, door de Schlecks, door Kirchen, door Dekker en Gesink.Het was niet de dag van de Rabo's.Een beetje de dag van de LuxemburgersMaar toch vooral die van Valverde.In een zetel werd hij naar Ans gebracht. Filmverslagje camera Tijkotte; soundtrack BrelWij keken nog naar wat Luikse ballenEn ander lokaal voedsel,Draaiend aan het spit.Lokale gerechtenEn voor wie de het proeven wil.Hier is het recept.Luikse ballenBoulets a la LiegeoiseBenodigheden:300 gr gekookt (soep)vlees300 gr rundergehakt1 ei, peper, zout nootmuskaatlaurier1 kruidnagel2 witte boterhammen1 1/2 ui2 dl water1 koffielepel Luikse siroopmargarine1/2 suikerklontje1 koffielepel tomatenpuree1 eetlepel zetmeelHet vlees malen samen met 1 1/2 ui en het brood.Gehakt, ei, nootmuskaat, zout peper toevoegen en alles goed mengen.De ballen maken en 15 minuten fruiten in wat margarine.De siroop met water verdunnen en suiker toevoegen.Laurierblad, kruidnagel, tomatenpuree, zout en peper en een scheutje azijn toevoegen.Binden met de zetmeel die met water is aangelengd.De ballen in de saus leggen en twee uur laten sudderen.Bon Appetit!Tags: Jupilerleague, WielrennenFootball is War20/04/08 08:05 Opgeslagen in: Games : EnglishThe best way to view a football game is to go to a stadium. While watching a race or baseball might actually be more rewarding from your special 156" HDMI Bravia Super Flat Wide Turbo TV, for football you have to be in the stadium. And I'm not talking about the lovely atmosphere I felt when I was at the Curva Sud or in the Maracana. I'm talking about the overview you have when being on the stands. So why do most football games try to look like a footy match on TV? Read More...Volendam16/04/08 10:45 Opgeslagen in: SportWaar ooit eens de Blauwe Tram Noord Holland door trokWaarvan de laatste de Lindeman-express wasGenoemd naar mijn oudoom LouDaar reed nu Arriva, dat de Noord-Zuid-Holandsche Tram Maatschappij (NZHTM) had weggeconcurreerdOnze helden namen deze nieuwe Blauwe TramOp weg naar weer een nieuwe helden strijd,Waar de stoere jongens van het Dorp een plek probeerden te veroverenTussen Godenzonen en Kakkerlakken. Read More...Tags: JupilerleagueKumasi02/04/08 08:51 Opgeslagen in: Studies : EnglishUrban waste is one the largest problems in developing countries. Some time ago I wrote a study together with Katja Martins and Audrey Sluiter, about how to deal with this problem. As a case they take the city of Kumasi, Ghana. With a population of 1,517,000, Kumasi is the second-largest city in the country.It is located near the Lake Bosomtwe, in the Rain Forest Region about 250 km (by road) northwest of Accra. Kumasi is approximately 300 miles north of the Equator and 100 miles north of the Gulf of Guinea. It is popularly known as "The Garden City" because of its many beautiful species of flowers and plants.You can find the report here Read More...'''
