["http://www.ricklindeman.nl/files/archive-jul-2000.html"]
title = "Rick filosofeert"
full_description = "Jul 2000 Rick filosofeert | Aug 2000 | Jun 2000 Twee Zussen20/07/00 17:03 Opgeslagen in: Reizen : PartyZe stonden tegenover elkaar die avond.De ene, de hand van haar Jasper vasthoudend.De ander, een beetje geirriteerd door het ontbrekenvan een hand om vast te houden.Het was zo anders geweest, aan het begin van de vakantie.Toen ze die Amsterdammers voor het eerst tegenkwamen.Jasper was wel goedgekeurd.Hun vriendinnen vonden hem zelfs een lekker ding.Hanneke had natuurlijk te veel tijd aan hem gegeven.Maar het zou allemaal weer goed komen.Zoals het altijd weer goed komt tussen zussen.Ook als ze uit Overijssel komen.Tineke17/07/00 17:01 Opgeslagen in: Reizen : PartyEen huis-, tuin- en keuken naam eigenlijk.Zelf was ze wat specialer.Rick zag haar praten met zijn buurman. Hij mengde zich even in het gesprek.Toen ging hij dansen, met een Poolse blondine.Ze brachten de dansvloer in vervoering.Toen werden de Polen weggeroepen door hun secretaris-generaal.Rick keek om zich heen, en zag haar weer staan.In een hoekje, dansend, alleen voor zichzelf.Britney klonk uit de luidsprekers.Tineke keek hem uitdagend aan.Hun lijven bewogen al snel in hetzelfde ritme.De chemie bracht hun nader tot elkaar.Ze verkenden elkaar zoals een vis een nieuwe kom onderzoekt,Vrij, Dartelend, in een nieuwe speelruimte,Rick miste de bus, maar dat vond hij al niet meer erg.Met haar liep hij lachend door de plassen.Veel later lag hij pas in zijn bedje, verhalend over de dagen en nachten.Papa13/07/00 17:00 Opgeslagen in: Sport : ReizenDe zaak was gevuld met klanten.Hij zou dan ook weer vele piadine verkopen.Zijn zoon zou bovendien zeker de volgende dag winnen ,op die winderige berg.Rick nam een hapje van zijn piadina en knikte naar de man.Die knikte terug.De volgende dag keek Rick de etappe naar de Mont Ventoux,aan het strand van Cesenatico.Pantani won.Dus papa zou ook de volgende dag,tevreden in zijn restaurantje kunnen zitten.Tags: WielrennenExen en Station Zuid01/07/00 17:47 Rick keek niet zo scherp om zich heen.Hij was dan ook nog niet helemaal over de avond tevoren heen.Met de fiets was hij vanuit de Sluisstraat gekomen, waar hij geslapenhad bij zijn ex-vriendin. Wat dat nu wel zo'n goed idee geweest? Hijwas nu in ieder geval te moe om daar serieus over na te denken. En hijvoelde die Vodka-Grapefruit nog steeds eigenlijk.Eerst maar een krantje kopen dacht hij. Dat moest toch kunnen. Zuidwas tenslotte een van de grootste stations van het land. De AKO wasgesloten. De lachende jongen achter de kiosk kon hem ook niet veelverder helpen.Rick zou naar Groningen gaan, uitgerekend de plaats waar het drie jaargeleden was misgelopen met die ex-vriendin. Maar ook de plaats waarover enige jaren de Giro zou beginnen; dan zou Rick er weer zijn, endat op de dag dat de Tour begon.De Trein kwam het station binnen lopen. Hij zocht een plekje aan hetraam, waar hij eigenlijk meteen weer een beetje indutte. Misschien wastwee uur slaap toch wat weinig geweest. Rick werd een paar keer wakkergebeld en vervloekte even de dag dat hij toch aan zo'n ding wasgegaan. Elke keer zag hij bovendien het weer verslechteren.Toen hij dan ook in Groningen aankwam, na nog allerlei verhalen overhoe het vroeger allemaal beter was te hebben aangehoord, regende het.Zijn blonde Egyptische wachtte hem al op in de hal, en leidde hem snelnaar een warm en gezellig plekje om wat te drinken en een paar jaarbij te praten. Silvia had ook wel wat dingen beleefd was nu in eensemi-relatie verwikkeld. Rick glimlachte en vertelde hoe hij zich delaatste tijd had misdragen. Hij hoopte op een strenge reprimande, maarniemand gaf hem die. Ze gingen eten, een creatieve geblenderdepasta-variant, nadat ze bij de Edah geweest waren, waar de Groningersvoor hele weeshuizen leken in te kopen.Silvia zou de hele nacht nog moeten werken, dus Rick vertrok voor devolgende Etappe. Hij kwam bij Brigitte aan. hier werd fanatiekmeegeleefd met een Nederlandse tennisser, die uiteindelijk na vijf uurheroische het onderspit moest delven. Ondertussen kwamen er steedsmeer mensen binnen. Wat Farmaceuten. Wat Haren-Hooligans. En anderen.Die Rick zou moeten kennen. Wat bleek, na twee en een half jaar wasBrigitte nog meer wintersportvriendjes niet vergeten.Brigitte zelf begon haar J.P. Chenet ondertussen steeds lekker tevinden. Terwijl de heren een beetje Amstel dronken, werden haar glazensteeds voller en voller. Ze begon haar vriendje een beetje te pesten.Die bleef er opvallend rustig onder. Hij was blijkbaar wel meergewend, hoewel al zijn ex-vriendinnetjes de reveu passeerden en hij ergenadeloos mee werd gefronteerd. Op een gegeven moment zag Brigitteook wel in dat ze nu genoeg had gedronken, hoewel er drastischemaatregelen voor nodig waren.Ze gingen maar slapen en Rick werd nog wel een beetje helder wakkerook. Hij dronk snel een paar koppen koffie om nog even langs Bob tegaan. De ex-kroegbaas bleek nog steeds niet over donderdag heen, en dedrank van de dag tevoren was hem ook zwaar te moede, maar toch kon hijRick nog mooie verhalen vertellen. De Amsterdammer haalde nog net debus, om zich daarna weer over de rails naar Station Zuid te latenvervoeren....."
