["http://www.ricklindeman.nl/files/044c990e53af1eb144e25ac4592ef4cf-325.html"]
title = "Schaatsen bij de Santa Croce | Rome, Sport | rick filosofeert"
full_description = "Schaatsen bij de Santa Croce19/12/99 10:23 Opgeslagen in: Rome : SportPas na een douche voelde Rick zich weer enigszins mens. Toen hij wat hersteld was vertrok hij naar het station om te kijken wat de handigste trein was. Ze besloten naïef om om zes uur terug te gaan. Hierna werd de nodige cafeïne en nicotine aangeschaft zodat ze weer verder konden gaan. Onze kunstliefhebbers vertrokken naar de Santa Croce, die pas om drie uur zou open gaan. Op de Piazza Santa Croce was er bovendien een ijsbaan, die ook op dat tijdstip zou overgaan. De volgende stap was de Piazzale Michangelo; hier kan men onder het toeziend oog van de David schitterend neerkijken op de stad met de lelie in het wapen. Onze helden namen een broodje met prosciutto di Parma en genoten. Toen ze om drie uur weer terug waren op de Piazza Santa Croce bond Rick de schaatsen onder. Onze Rintje Ritsma schaatste met botte ijshockey schaatsen subtiel om alle vallende Italianen heen. Hij had zich niet meer zo Hollands gevoeld sinds hij begin december een rookworst ontdekte in zijn tas. In de Santa Croce werd eer bewezen aan de tombes van Dante en Macchiavelli. Deze waren helaas beiden leeg, aangezien de Florentijnen nog wel eens hun beroemdste inwoners uit de stad jaagden in het verleden. Het koude Florence werd afgesloten met een warme Chocolade, die hier ook echt uit gesmolten chocolade bestond, met room in een extra kannetje.De trein van 18.12 bleek achteraf een wat mindere keuze. De eerste vier stations werden doorgebracht in een snikheet halletje met iets teveel mensen. Zo ongeveer moet Dante’s Purgatorio eruit hebben gezien. Toen Rick eenmaal kon zitten moest hij nog een plan op stellen voor zijn Tesina. Het moest een vergelijk worden van assessment methoden voor EU-progjecten in Nederland en Italië. De buste van Dante die onze hoofdrolspeler had gekocht keek begripvol op hem, want Rick zag er moe uit:‘Oh quali, io vidi quoi che son disfattiPer lor superbia! E le palle del’oroFiorenza in tutti suoi gran fatti’(Paradisio, 16)"
