["http://www.ricklindeman.nl/files/6d1af4f1e1f315b13e54bc1ae3561ee0-481.html"]
title = "Stadions | Sport | rick filosofeert"
full_description = "Stadions11/08/08 09:42 Opgeslagen in: SportMeer foto's - MVVM thread - L1 verslagEr worden veel stadions gebouwd in Nederland.Meestal als nieuwe impuls voor de club.Het avondje NAC, Het Abe Lenstra, de Grolschveste, de Nieuwe Goffert.Allemaal een grote verbetering.Maar in Zwolle snappen ze het geloof ik niet.Het is dan wel nieuw, maar het ziet er uit alsof het in de tijd van de Geusselt gebouwd is.En dan op een koude manier.Betonnen muren, met rare raampjes.Hoog boven het veld.Nauwelijks beter dan het oude Oosterenk,Toen we daar verloren in die ijskoude nacht.Ongeschikt, voor het afscheid van een grote, als van Stam.In Amerika is juist de fantastische trend bezig om retro stadios te bouwen.Het nieuwe Citifield van de Mets, wordt gebaseerd op het oude stadion van de Dodgers, voordat die verhuisden.Het legendarische Ebbetsfield, waar de fans nog de trams moesten 'dodgen'En hier kunnen we het toch ook.Iedereen die meegeweest is naar AFC-MVV weet hoe mooi het Olympisch stadion is opgeknapt.De creatie van Jan Wils, slechts 300 m van mijn geboortebed.De lichten stonden op de sintelbaan gericht, maar toch.Maar toch stonden we er op 8/8/8.En wat hadden we een zin in voetbal.De competitie was alweer zolang geleden.Het kriebelde.Er was echt bier. De barvrouw charmantDe Teams hadden er blijkbaar nog niet zoveel zin in.Bang om te verliezen, in de eerste echte wedstrijd van het nieuwe stadion.De tweede helft was 'us mvv'; beter,Wellicht geinspireerd door Henk Wolters, de locale Wolter Kroes.Maar echt drukken konden we niet.Toch, een punt meer dan vorig jaar.Tags: Jupilerleague"
