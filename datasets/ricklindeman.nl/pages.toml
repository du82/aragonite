["https://ricklindeman.nl/experimenteren-in-de-keten"]
title = "Experimenteren in de keten – Rick Lindeman"
full_description = "Experimenteren in de keten admin | October 27, 2013 | Publicaties | No Comments Uit verkeerskunde (7/2013) Lessen uit twee jaar investeren in innovatiever voor- en natransport Klaartje Arntzen en Rick Lindeman, Rijkswaterstaat Door verbeteringen van de afzonderlijke schakels, verbetert de kwaliteit van de totale reisketen. En dat levert meer (trein)reizigers op. Dé gedachte achter het programma ‘Innovatief reizen van en naar het station’, onderdeel van het ‘Actieplan groei op het spoor’ van het ministerie van Infrastructuur en Milieu. De analyse van het instrumentarium, van de uitdagingen aan reizigers en markt en van al hun oplossingen, levert weer nieuwe leerpunten op. In de periode 2010-2012 zijn door AgentschapNL/Rijkswaterstaat diverse experimenten met innovaties in voor- en natransport ondersteund. (Vanaf begin dit jaar voert Rijkswaterstaat een aantal kennis- en uitvoeringstaken op het gebied van milieu en leefomgeving uit die voorheen door Agentschap NL werden uitgevoerd). Bij de innovaties in voor- en natransport lag de focus op: beschikbaarheid, simpelheid en comfort voor de reiziger. De reikwijdte van innovatieve verbetervoorstellen betrof zowel nieuwe vormen als het verbeteren van bestaande vormen en condities en omvatte alle aspecten die een reiziger tegenkomt voorafgaand aan de reis per trein, vanaf zijn vertrekpunt, en na de reis per trein tot aan zijn bestemming. Instrumenten In het programma is bewust gekozen voor een mix van instrumenten om verschillende partijen, markt en reizigers, uit te dagen hun ideeën over verbeteringen in het systeem in te brengen, te delen of uit te werken. De instrumenten varieerden van een subsidie, een SBIR, small business innovation research, tot een (nationale) prijsvraag. Markt en reizigers Vanuit de markt dienden in totaal 93 (combinaties van) bedrijven en organisaties een projectvoorstel in. Hiervan zijn uiteindelijk 18 projecten daadwerkelijk ondersteund bij hun experimentele ontwikkeling. Daarnaast hebben ruim 300 reizigers hun ideeën gedeeld over gewenste verbeteringen via de Nationale Reisvraag. Deze prijsvraag liep van begin september tot eind oktober 2012. Via social media en in co-creatiesessies werden reizigers uitgedaagd om hun ideeën in te zenden en ook met anderen te delen. Bij deze groep lag de focus op waardecreatie voor de reiziger en niet op het belang van de vervoerbedrijven zelf om hun diensten te verbeteren. Deze focus werd als verfrissend ervaren, zo blijkt. Deze aanpak sluit ook aan op de trend bij burgers en bij de overheid om burgers eerder in beleidsvorming te betrekken. Meer oplossingen voor fiets dan voor bus of taxi De inzendingen vanuit de reizigers en de manier van interactie mét reizigers bood een uniek inkijkje in de pijn en de behoeften van de reiziger. Zo kwamen er beduidend meer reacties en inzendingen binnen rond het cluster fietsen(stallingen)dan rond de taxi en de bus. Aanbevelingen rond de bus betreffen vooral aansluitingen van bus op trein- en wachtvoorzieningen, terwijl het bij de taxiopvallend veel gaat om fietstaxi-achtige voorstellen. Gaat het om de auto, dan worden parkeerruimte, P+R en meerij-faciliteiten genoemd. Daarnaast worden ook nieuwe vormen van vervoer genoemd, zoals steppen (beperkter ruimtebeslag dan fietsen), loopbanden en monorails. Deze laatste zijn dan vooral bedoeld om ruimtegebrek rond stations te ontlasten met ‘hubs’ iets verderop en om korte afstanden te overbruggen naar drukke bestemmingen dichtbij stations. Ergernissen over wachten, weer en (ruimte voor) de fiets Uit de analyse blijkt ook dat veel ideeën van reizigers oplossingen betreffen voor ‘ergernissen’. Daarbij scoren ‘wachten’ en ‘het weer’ (buienrader, paraplu app) nadrukkelijk hoog. De meest genoemde problemen betreffen de fietsenstalling (ruimtegebrek, weesfietsen en het niet kunnen terugvinden van je fiets). Ook is er ergernis over onduidelijke inrichting en looproutes op stations, onnodig omlopen, drukte in treinen en bij in- en uitstappen, en overtreding van regels in stiltecoupe’s. De OV-chipcard kan ook beter: meer duidelijkheid en logica over plaatsing van de in/uitcheckpalen en bijvoorbeeld een ‘nood-uitcheckpaal’. Daarnaast zijn veel ideeën gericht op het wegnemen van onzekerheden in het reizen en overstappen (fiets-trein, trein-trein), zoals over aansluitingen, afstanden en looproutes of plaatsen in fietsenstalling. Deze problemen sluiten aan bij onderzoek van Mark van Hagen van NS bij UT Twente waaruit het belang van subjectieve tijdbeleving blijkt. Zo dragen veel ideeën niet feitelijk bij aan een snellere overstap, maar wel aan de beleving van een snellere, comfortabeler overstap. Zo zijn er ook nauwelijks oproepen voor rollende tapijten of snellere roltrappen (of een snellere naast een langzame roltrap). Concrete diensten Veel reizigersideeën gaan over meer informatie. Denk aan vertrekinfo over treinen in fietsenstallingen, over bussen in de stationshal en buienradar/regenprognose bij aankomst op een station. Ook zien reizigers kansen voor nieuwe diensten: zoals OV-chipcard koppelen aan betalen voor een kopje koffie. En zien zij nog uitbreiding van het OV-fietssysteem met paraplu, OV-kids, OV-garantie, OV-buggy’s, OV-vouwfiets en OV-fietsen met versnellingen en bagagemanden. Daarnaast vertalen reizigers een verschil tussen reizigers als consument en reizigers als reiziger, in directe, snelle routes, versus langzamere loopstromen en verblijfsgebieden.Verder denken zij aan: een poncho-automaat, een koudeklauwenstang, een rugzak met uitklapbare regenkap. En ook aan een mini-cursus tijdens je reis, een entertainbus, perrondating, kletscoupes of weetjes op bushalte over de stad en regio. Opvouwbare scooter als zitplaats in de trein De innovatieve ideeën uit de markt richten zich vooral op fietsen, taxi-vervoer en lopen, en minder op de bus. De meeste projecten borduren voort op bestaande modaliteiten en versterken de huidige voor- en na transportsystemen. Een enkel consortium ontwerpt een nieuwe modaliteit, zoals de GiGi, een opvouwbare scooter die in de trein dienstdoet als extra zitplaats. Ook is het veel aandacht voor het uitwisselen van modaliteiten. Een opvallend project richt zich op publiek-private samenwerking in een BIZ, een bedrijveninvesteringszone. Hierin verenigen werkgevers zich en ontwikkelen samen duurzame mobiliteitsinitiatieven voor- en natransport. Conclusie en lessen Evaluatie van het programma toont aan dat de financiële ondersteuning een kritische factor was voor het soort innovaties dat het programma opleverde. Van producten of diensten die vanaf de grond moeten worden ontwikkeld, kunnen de kosten veelal moeilijk aan klanten doorberekend worden. Mede omdat nieuwe bedrijven en producten nog geen relatie met hun (potentiële) klanten hebben opgebouwd. Daadwerkelijk baanbrekende zaken brengen daarbij meer risico en onzekerheden met zich mee, en zijn daardoor vaak lastiger te honoreren als project. ‘Haalbaarheid’ is immers vaak een beoordelingscriterium voor verdeling van gelden. Ontwikkelen over ‘schotten’ heen gaat niet vanzelf. Voor wat meer baanbrekende innovaties die verder kijken dan het bestaande regime, zijn andere samenwerkingsvormen en ideeën van nieuwkomers essentieel. Dit vraagt inzet van minder traditionele instrumenten ter stimulering van vernieuwingen. jQuery(document).ready(function($) { $.post('https://ricklindeman.nl/wp-admin/admin-ajax.php', {action: 'wpt_view_count', id: '134'}); }); Related Posts Van Fiets en Vis No Comments | Jul 6, 2021 Archeologie onder water No Comments | Jun 14, 2023 Gedragsverandering in Europa No Comments | Aug 18, 2015 Kumasi No Comments | Oct 5, 2017 About The Author rickthuis"
year_published = 2013
