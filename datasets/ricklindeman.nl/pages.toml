["http://www.ricklindeman.nl/files/2b4827a3738495a5ce5a0babe1856d11-315.html"]
title = "Feest in Vitinia | Rome | rick filosofeert"
full_description = "Feest in Vitinia10/12/99 10:06 Opgeslagen in: RomeNadat tegen enen werd opgestaan, begon de dag niet echt voorspoedig. De kranten staakten weer eens, zodat de uitslag van Mallorca-Ajax een mysterie bleef. De pinpas wilde niet meer dan L. 100.000 uitkeren en de fotoboetiek was dicht. Hierdoor niet ontmoedigd vertrok onze Rick naar college. Garano, die vandaag een beetje op Bolkestein leek, ga een discourse over onteigening en het Italiaanse cijfer systeem; een 18 is hier voldoende; een 30 een tien. Terug stortte de hemel zich op onze batavier en toen hij de tram bereikte trof hij daar Bas die het ook niet echt lang met dit weer in de stad had uitgehouden. Thuis konden nu wel de foto’s worden gehaald en een flesje wijn gekocht omdat we bij Mireia gingen eten.Om 7.10 werd in een opgedroogd Rome de reis naar Vitinia aangevangen. Op Piramide troffen Rick en Bas Judith en haar huisgenoten, die ook nog eens wisten waar we in dat dorp heen moesten en ze dus niet angstvallig moesten wachten op het station op een onbekende. Zij woonde in een mooi appartement, dat eigenlijk te netjes was voor de Amsterdamse studenten. Het lag wel op 20km van Rome. Spoedig arriveerden ook Andreas en Jorge zodat het Catalaanse feestmaal kon beginnen. Bijna iedereen had wel een flesje wijn meegenomen, en daarmee smaakte de tortilla en de pasta-variant nog wat lekkerder. Ook Rick mocht nog culinair helpen bij de Patomaco, een Catalaans Brood - Tomaat gerecht.Daarna werd het een mooi feestje. Judith en Jorge hadden elkaar een beetje gevonden. Andreas en Bas debatteerden over Whiskeysoorten. Laatstgenoemde drank vloeide rijkelijk, naast de liters Sangria die Mireia bereid had.Rick had zich ondertussen met Mireia teruggetrokken, waar zij een complex persoontje bleek, maar toch ook de Ballon D’Alsace werd beklommen. Uiteindelijk vertrokken de Nederlanders, samen met Israel, met de tweede trein. Op het station observeerden ze een man die de hele dag in een hokje van 70x70 werkte. Het enige wat hij volgens hen deed, was elke keer dat een trein passeerde, een kruisje zetten. De schoonheid van eenvoudige arbeid werd geroemd. Om 6.06 stapten onze feestgangers in de trein, zodat tegen zevenen de nachtrust werd genoten."
