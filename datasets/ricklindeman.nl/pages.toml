["http://www.ricklindeman.nl/files/archive-aug-2003.html"]
title = "Rick filosofeert"
full_description = "Aug 2003 Rick filosofeert | Sep 2003 | Jul 2003 Dancevalley 200302/08/03 09:15 Opgeslagen in: PartyRick op avontuur: Dansen in de vallei.. Op 2 augustus 2003 was het eindelijk zover. De helden gingen naar Dance Valley 2003. Als echte hollanders uit Malta en Roermond werd er een flink stuk per fiets afgelegdFietspromoter RJ had trots over zijn werk verteld en liet dus iedereen per ov-fiets vertrekken. Een uur later en wat wegen later kwamen ze aan.Het zonnetje scheen heerlijk en dus stonden onze helden al snel genietend van een duur biertje in de zon te dansen. De held vroeg in de middag van Junkie XL, die ons bij het main-stage vermaakte, voordat we bij het het hardstyle-podium uit ons dak gingen en bijna een broertje kwijt raakten!)De helden nuttigden gezonde waren, om zo de avond in de gaan in het nog steeds zomerse Spaarnwoude. Op de heuvel zag je massa's mensen meedeinen en zich verzamelen. Aan het begin van de avond was Carl Cox de held die ons, naar later bleek nog op TV deed terechtkomen Toen was het tijd voor de finale. Iedereen op het hoofdveld voor DJ Tiesto!!! Duizenden mensen, dansend in een grote vallei.Toen was het afgelopen, veel te vroeg natuurlijk! Je echter niet zomaar thuis; eerst duur het een uur voordat je van het terrein af bent. Vervolgens moest er nog een klein uurtje terug gefietst voordat de laatste trein naar CS net gemist kon worden.Dancevalley #9Rick op avontuur: Dansen in de vallei.. Op 2 augustus 2003 was het eindelijk zover. De helden gingen naar Dance Valley 2003. Als echte hollanders uit Malta en Roermond werd er een flink stuk per fiets afgelegdFietspromoter RJ had trots over zijn werk verteld en liet dus iedereen per ov-fiets vertrekken. Een uur later en wat wegen later kwamen ze aan.Het zonnetje scheen heerlijk en dus stonden onze helden al snel genietend van een duur biertje in de zon te dansen. De held vroeg in de middag van Junkie XL, die ons bij het main-stage vermaakte, voordat we bij het het hardstyle-podium uit ons dak gingen en bijna een broertje kwijt raakten!)De helden nuttigden gezonde waren, om zo de avond in de gaan in het nog steeds zomerse Spaarnwoude. Op de heuvel zag je massa's mensen meedeinen en zich verzamelen. Aan het begin van de avond was Carl Cox de held die ons, naar later bleek nog op TV deed terechtkomen Toen was het tijd voor de finale. Iedereen op het hoofdveld voor DJ Tiesto!!! Duizenden mensen, dansend in een grote vallei.Toen was het afgelopen, veel te vroeg natuurlijk! Je echter niet zomaar thuis; eerst duur het een uur voordat je van het terrein af bent. Vervolgens moest er nog een klein uurtje terug gefietst voordat de laatste trein naar CS net gemist kon worden.Tags: Festivals"
