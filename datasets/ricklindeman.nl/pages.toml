title = "Bijen – Rick Lindeman"
full_description = "Bijen admin | August 18, 2015 | interesses | No Comments In 2015 ben ik begonnen met een basiscursus bijenhouden bij de Bijenhouders vereniging Utrecht. Hiermee ben ik begonnen om een aantal redenen. Ik maak me oprecht zorgen over de biodiversiteit van ons land. Maar daarnaast vind ik het als facilitator ook machtig interessant. Inmiddels ben ik gecertificeerd imker. Ik heb eind 2015 een Pecha Kucha gegeven over de lessen die je kan leren van de bijen op het gebied van besluitvorming. Immers als facilitator zijn wij steeds bezig met hoe een groep besluiten neemt. Daarnaast kijken we naar de verhoudingen, wie doet wat en waarom. Welke signalen geven ze af? Hoe verhouden ze zich tot de leider? Als facilitator beginnen we ook steeds meer te weten van het onbewuste. Hoe reageren mensen op de omgeving? Hoe sluiten we aan bij onze primaire behoeften (veiligheid, eten, voortplanting)? Wat gebeurt er dan in onze hersenen? En dan worden bijen steeds interessanter. Immers een bijenkolonie is soms te zien als een groep neuronencellen in het wild. De signalen die de werksters onderling uitwisselen, zijn als de synapsen tussen de hersencellen. We leerden bijvoorbeelden hoe de werksters “Stertselen”. Ze gaan (zie de video) met hun achterlijf omhoog staan als signaal om andere werksters die achter zijn gebleven te lokken met geurstoffen. Ook staat er rond de rondwandelende koningin ook een “hofstaat” van werksters klaar. Maar dit bleek slechts het begin. Ik werd namelijk gewezen op het geweldige boek “Honeybee Democracy” . In dit boek beschrijft Thomas Seeley hoe bijen besluiten nemen. En hij trekt daaruit ook conclusies voor mensen. In het begin van de twintigste eeuw werd in Beieren voor het eerst serieus onderzoek gedaan naar de communicatie van bijen. Karl von Frisch en zijn leerling Martin Lindauer volgden de bijen op hun zoektocht naar honing en zag hoe ze de plek van honing communiceerden. Dit deden ze doormiddel van een dans. De hoek van die dans t.o.v. de zon gaf aan welke kant die bijen op moesten voor een goede honing spot. Daarnaast gaf de afstand aan hoe ver het was. Seeley ging vervolgens verder. Lindauer ontdekte al dat ook een zwerm bijen op zoek naar een nieuw huis dergelijke dansen deed. Maar hoe besluit een zwerm bijen welke optie het beste is? In Honeybee Democracy beschrijft Seeley op kleurrijke wijze hoe hij dit onderzocht. Hij kwam zelfs in aanraking met de KGB. Op een klein rotseiland op 12 mijl van de Atlantische kust kon hij echt onderzoek verrichten waarin alle andere omstandigheden werden uitgeschakeld. Bijen bleken een actief debat te voeren. Als een bij een mooie locatie had gevonden (minstens 15 liter (liefst 40), ingang klein en aan de goede kant), adverteerde hij dat door een dans. Andere bijen adverteerden andere locaties. Neutrale bijen ging ook bij de plekken kijken. Ze verdeelden zich aan de hand van het enthousiasme van de adverterende scouts. Dit werd gemeten aan het aantal dansjes dat de bij deed. Ze maakten daar een onafhankelijke analyse. Als ze de mening deelden, gingen ze ook die plek delen met een dans. Zo kwamen er steeds meer bijen bij goede plekken. Het geniale in de systematiek zit in hoe vervolgens het besluit tot stand komt. Consensus is immers niet makkelijk te bereiken met 10.000 bijen in een zwerm. Een bijen stoppen na een aantal keer (en een aantal bezoeken) met hun dans. Dit betekent dat een plek steeds nieuwe aanwas moet krijgen om populair te blijven. Hierdoor krijgen in de loop van het debat (5-20 uur), meer plekken een kans om aanhangers te werven. Maar wanneer namen de bijen een besluit? Ze deden dat wanneer een plek het Quorum had bereikt. Dit ligt ongeveer rond de 30 adverterende scout bijen tegelijker tijd. Doordat dit weer andere bijen zijn dan de oorspronkelijke dansers, hebben dan in totaal zo’n honderd bijen de plek bezocht. Er zijn dan zo’n 400 bijen in debat geweest over de beste plek. Hierdoor zijn verschillende opinies ruim aan bod gekomen. Dan gebeurt er nog iets interessants. Ze moeten vertrekken naar de goede plek. De bijen die bij de locatie horen spelen hierin ook een faciliterende rol. Ze geven een piepend signaal door waardoor de bijen zich klaar gaan maken. Als dat gebeurt is, vertrekken ze. Tijdens de vlucht sturen de scout bijen ook. Niet door vooraan te vliegen. Ze vliegen steden door de grote zwerm heen, in korte snelle bewegingen om de richting en snelheid aan te geven. Ook een manier van leiding geven. En zo is een bijenkorf dus niet een maatschappij met een allesbeslissende koningin in het midden. Ze is weliswaar het genetische hart, maar geheel overgeleverd aan de werksters, die bijvoorbeeld ook voor de vlucht haar dwingen te eten, om aan te komen, zodat ze weer kan vliegen. Seeley probeerde de principes van de bijendemocratie ook mee te nemen naar zijn eigen faculteitsoverleg. Hij keek hiervoor naar de klassieke Town-meetings in New England. Zijn vijf tips aan de mensheid en facilitators in het bijzonder zijn: 1. Stel een groep samen die bestaat uit individuen met een gedeeld belang en wederzijdsrespect. De bijen kunnen alleen gezamenlijk overleven 2. Minimaliseer de invloed van de leider op het denken van de groep Immers de koningin weet niet alles 3. Zoek verschillende oplossingen voor een probleem De bijen onderzoeken verschillende nestplaatsen 4. Aggregeer the wijsheid van de groep door een debat Door het debat wordt de beste plek voor een nieuw huis gekozen 5. Gebruik een quorum voor een snelle, maar accurate beslissing Consensus kan immers (te) lang duren De wereld van de imkers is trouwens ook vol debat (bv over de Varroamijt), en groepsdynamica, maar daarover misschien een andere keer meer… jQuery(document).ready(function($) { $.post('https://ricklindeman.nl/wp-admin/admin-ajax.php', {action: 'wpt_view_count', id: '7'}); }); Related Posts Het is Koers! No Comments | Aug 18, 2015 Wielrennen No Comments | Sep 12, 2017 Lindeman & Drank No Comments | Feb 22, 2017 Familie No Comments | Jul 19, 2015 About The Author rickthuis"
