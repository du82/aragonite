["https://ricklindeman.nl/fietsen-bij-rws"]
title = "Fietsen bij RWS – Rick Lindeman"
full_description = "Fietsen bij RWS admin | August 12, 2017 | Projecten | No Comments Ik ben sinds 2015 projectleider Fiets bij RWS, Ik werd daar onlangs over geïnterviewd. Fiets als alternatief voor auto Nederland is een fietsland bij uitstek. Er zijn een miljoen elektrische fietsen in het land, 26 procent van alle verplaatsingen doen we met ons ‘stalen ros’, waarvan 12 procent met de e-bike. De fiets speelt dan ook een steeds belangrijkere rol in het verbeteren van lokale en regionale bereikbaarheid. ‘Voor de afstand Rotterdam-Den Haag is de e-bike ineens een goed alternatief voor de auto’, zegt Rick Lindeman (WVL). Hij werkte sinds 2015 aan het opstellen van een ‘routekaart voor de fiets’, waarin de rol van RWS, en hoe die ingevuld moet worden, beschreven wordt. Deze routekaart is 9 juni vastgesteld. Daarbij ligt de focus in eerste instantie op het zorgen dat ons eigen netwerk op orde is. RWS heeft zelf tussen de 500 en 600 km aan fietspaden in beheer. Deze liggen onder meer langs onze dijken, bruggen en sluizen, zoals het fietspad op de Afsluitdijk. Ook ligt er nog ongeveer 1.800 km aan fietspad op ons grondgebied dat door andere wegbeheerders onderhouden wordt. Als onderdeel van de routekaart, wil Rijkswaterstaat zorgen dat er bij projecten steeds meer rekening gehouden wordt met de fiets. Zo was de onderdoorgang van de Galecopperbrug in de A12 vanwege onderhoud 2 jaar lang dicht voor fietsers, zonder een goed alternatief te bieden. Door fietstunnels of –bruggen aan te leggen voorkomen we dat er onnodig barrières voor fietsers ontstaan. Een ander aspect van het op orde brengen van ons netwerk, is het werken aan eisen waaraan het onderhoud van onze fietspaden moet voldoen. Doordat deze ontbreken, ontstaan er soms misverstanden: ‘Het fietspad langs de N65 haalde door de slechte staat de media. We hebben de aannemer langs gestuurd, maar een tijd later schreef de pers er weer over. Er bleek een misverstand te bestaan over wat de aannemer qua onderhoud precies moest doen. Een medewerker van Rijkswaterstaat heeft toen, al fietsend, met een lid van de lokale Fietsersbond de slechte stukken gemarkeerd met verf.’ Snelfietsroute Door de fiets een centralere plek te geven in ons werk, dragen we bij aan het oplossen van de toenemende druk op onze infrastructuur. ‘We experimenteren onder meer met het aanleggen van snelfietspaden’, legt Rick uit. ‘We onderzoeken hoe we deze fietspaden veilig kunnen inrichten, zodat je met een elektrische fiets snel grotere afstanden kunt afleggen. Dit kan ervoor zorgen dat er in de toekomst veel minder auto’s op de weg te vinden zijn.’ Bovendien draagt RWS hiermee bij aan een betere leefbaarheid en het stimuleren van een gezondere levensstijl. De samenwerking met de regio is hierbij van groot belang. Doordat de fiets steeds populairder wordt om afstanden tot 30 km af te leggen, moeten er goede regionale afspraken gemaakt worden. ‘We denken altijd mee met de fietsmogelijkheden die ons gebied en objecten bieden’, zegt Rick. Zo werd er door de samenwerking tussen de provincie Utrecht, RWS en het ministerie mogelijk dat een nieuwe fietsbrug wordt aangelegd over het Amsterdam-Rijnkanaal. Ook wordt er samengewerkt, onder meer bij de financiering, van nieuw stuk fietspad langs de A9 Gaasperdammerweg. Roadshow Om de routekaart te promoten en te zorgen dat de fiets een niet weg te denken aspect wordt van de RWS-werkwijze, is er nog werk aan de winkel. Rick: ‘Natuurlijk moet iedereen weten wat de plannen zijn. Daarom gaan we langs de verschillende regio’s om te vertellen wat er precies in de routekaart staat en op te halen welke uitdagingen er in de regio spelen. Voor het einde van het jaar hopen we overal langs te zijn geweest.’ Ook wordt er nagedacht over een checkmoment in onze processen om te zorgen dat de fiets niet vergeten wordt en zijn we in gesprek om ook het budget voor de onderhoud van fietspaden structureel met het ministerie te regelen. jQuery(document).ready(function($) { $.post('https://ricklindeman.nl/wp-admin/admin-ajax.php', {action: 'wpt_view_count', id: '116'}); }); Related Posts Duurzaamheid en Beter Benutten No Comments | Aug 15, 2017 Presentaties No Comments | Jan 2, 2017 WK Sensible Soccer No Comments | Nov 2, 2016 Faciliteren No Comments | Aug 18, 2015 About The Author rickthuis"
