["https://rightclicksave.com/article/are-nfts-the-first-truly-global-art-movement"]
title = "Are NFTs the First Truly Global Art Movement?"
description = "Jason Bailey speaks to Aparajita Jain, founder of terrain.art and Director at Nature Morte Gallery, about how NFTs can unleash the creator economy in India"
full_description = "‍Aparajita Jain: I think that discourse is critical. I had an interview for another magazine today, with a journalist who was very anti-NFTs, who asked “how are they democratic?” And I said that when any new technology appears in the public sphere, one always has a number of deviants who are going to try and spoil it, or try and take advantage of it for the dark side. But the majority, even 85% of people, are benefiting from it. So to not allow the 85% to benefit while we’re trying to resolve the 15% of deviance would be a tragedy. So is it a perfect space? Perhaps not. But is it important and critical? Yes. ‍JB: I agree. Whenever we introduce new technology that challenges the status quo, people get anxious, and rightfully so, because there’s always a percentage of bad actors. But why do you think people are particularly mad about NFTs? ‍AJ: I think the right question to ask would be, who is getting more emotional and angry with this? Is it the web creator, who’s making money? Hell no. Is it the fine artist? Yes. Is it the traditional gatekeepers? Yes. So the people who are angry are the ones that have something to lose. If it’s environmentalists, then that anger is justified, but it’s often people who just don’t understand it. So I think the question to ask is really: “Who is getting upset about it?” And then trying to understand why. Is there plagiarism? Yes, a lot of content is rubbish. But hello, what about the fact that we finally have methods of certification and provenance and security? What if there’s a real way of obtaining royalties? What if there are new creators able to become artists? To me, these are so much more compelling as questions. JB: I think it changes who can participate too. Perhaps it’s not as fully democratized as people wanted, and maybe it’s a smaller star system, but the people being elevated are emerging from different routes: Not the Ivy League schools nor the gallery system in the US or Europe. I know you’re highly respected in the traditional art world given your background with Nature Morte Gallery, based in New Delhi. But why is it that you don't feel intimidated by this new movement when perhaps others do?"
