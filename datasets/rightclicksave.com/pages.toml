full_description = "‍Robert Hodgin is a digital artist living in Brooklyn with his husband and two cats. He is a co-founder and partner of Rare Volume, a design and technology studio with offices in New York and Austin. Hodgin’s work is featured in the V&A, Smithsonian Design Museum, The Exploratorium, Wired, and Wing Luke Museum.‍‍ ‍Nat Sarkissian is a generative artist interested in impressionistic, abstract, and simulated systems. His work has involved studies of representation, as well as experiments with light, color, and geometry. ‍Marcelo Soria-Rodríguez is an artist and strategist. His artistic practice is centered on the whole span of possibilities of a given system and how it can engage with human emotions, as well as the potential emergence of a machine version of the same phenomenon. He has released critically acclaimed generative art collections on fxhash and Art Blocks Curated. He also co-founded a global data practice at BBVA, a global financial firm, and Databeers, an informal data literacy movement active in ten countries. He writes occasionally on his personal website about art and strategy.‍ Sputniko! (Hiromi Ozaki) is an artist and filmmaker who explores the themes of gender, futures, and feminism. She is also the founder and CEO of women’s health startup Cradle. She has held the role of Assistant Professor at MIT Media Lab, serving as director of the Design Fiction Group from 2013 to 2017, and is currently an Associate Professor at Tokyo University of the Arts. In 2013, Sputniko! was awarded Vogue Japan Woman of the Year, and has since been selected as one of the Young Global Leaders by the World Economic Forum, moderating sessions at Davos 2020. Her work is in the permanent collections of the V&A, London; and the 21st Century Museum of Contemporary Art, Kanazawa. Kazuhiro Tanimoto is a generative artist and materials research and development chemist based in Japan. He holds a Master of Engineering and a PhD in engineering. In this capacity, He has been developing dyes, functional molecules, and environmentally-friendly plastics. Aside from his engineering work, Kazuhiro has been creating digital art since the 1990s, and he regards scientific research and art-making as intimately related activities. In addition to his generative work published digitally, Kazuhiro has exhibited at events in Japan, including the Japan Media Arts Festival, and internationally.‍"
