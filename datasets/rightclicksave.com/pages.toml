["https://rightclicksave.com/article/how-many-nfts-are-actually-on-the-blockchain"]
title = "How many NFTs are actually on the blockchain?"
description = "Nick Hladek surveys the precarious state of NFT security"
full_description = "In early 2022, a web page titled YourNFTs.org surfaced on the Internet, with its anonymous author asserting that they had “downloaded all the NFTs on the Ethereum blockchain.” This claim quickly caught the attention of Jason Bailey, whose startup, ClubNFT, had debunked a similar claim made by Geoffrey Huntley in late 2021. Huntley had created a parody of The Pirate Bay titled, The NFT Bay, making available a torrent file that allegedly linked to “all NFT's [sic] from Ethereum & Solana.” ClubNFT team members found the claim to be fictitious and the linked files to be completely empty. Like Huntley, the author of YourNFTs.org also provided a torrent file pointing to their purported bounty: over 5GB of NFT metadata, contract addresses, and token IDs. However, unlike Huntley, the author of YourNFTs.org also provided a detailed analysis of the data as well as a photomosaic of images apparently incorporating Ethereum-based NFTs. According to the analysis, 9% of NFTs had their data stored entirely on chain, 55% had data stored via HTTP or a centralized web server, and 36% had data stored via the InterPlanetary File System (IPFS), a decentralized file storage protocol. “NFT” stands for “non-fungible token,” where the token is a record stored on a blockchain. In the case of Ethereum-based NFTs, these records are typically associated with smart contracts conforming to the EIP-721 or EIP-1155 standards and are secured by the Ethereum network itself. Assuming a well-written smart contract and a secure blockchain, it is nearly impossible for a third party to modify an NFT’s record. This makes NFTs an excellent way to record digital ownership. However, blockchains are not great at storing large amounts of data: images, videos, or audio files that are commonly associated with NFTs. Instead, these files are often stored off chain using IPFS or HTTP storage solutions. In their analysis, the author of YourNFTs.org broadly classified NFTs according to their storage solutions: on chain, HTTP, or IPFS. “On chain” refers to an NFT whose content is stored entirely on the blockchain. Storing content on the blockchain can be prohibitively expensive and is usually implemented via clever smart contract designs. Nevertheless, there are a number of NFT artists and projects that make use of on-chain data storage, including 0xDEAFBEEF, Blitmap, and CyberBrokers. HTTP refers to an NFT whose content is stored on a centralized web server. Content stored on HTTP is at the most risk of disappearing because it is subject to a single point of failure and cannot practically be restored once offline. Even if the content does stay online, there is no guarantee that the files will not be modified from their original state. Some early works, such as John Karel’s genesis NFT, Skull Still Life (2018), have already had content disappear due to their reliance on HTTP storage solutions."
year_published = 2025
