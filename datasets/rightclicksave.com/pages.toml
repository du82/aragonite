["https://rightclicksave.com/article/alternative-evolution-william-latham-interview-generative-art"]
title = "Alternative Evolution | William Latham"
description = "Following the release of his Mutator Infinity series, the artist discusses his remarkable career with Rachel Falconer"
full_description = "‍Rachel Falconer: The origin of your practice is a deep fascination with the natural world and its logics of evolutionary patterning. How would you describe your relationship with the ever-diminishing binaries between human and more-than-human entities, including the collaborative dynamics of generative art? ‍William Latham: I became fascinated by evolutionary processes and patterns while studying in London at the Royal College of Art (RCA) in the 1980s. During that period, I spent countless hours at the Natural History Museum nearby and the feeling of wonder at nature that I experienced there has never left me. You mention the logics of evolutionary patterning but alongside the awe-inspiring grand design(s) of evolution there is this tremendous variety of individual forms. There’s also a sense of abundance that is overpowering at times — masses of writhing worms or wiggly maggots feature strongly in my current work. I read and was deeply influenced by the mathematician Benoit Mandelbrot, who coined the term “fractal” to describe natural phenomena such as coastlines, snowflakes, mountains, and trees, whose patterns repeat themselves at smaller and smaller scales. Against that background, I began my FormSynth rule-based evolutionary hand drawings, in which a limited list of seven primitive geometric 3D forms were subjected to shape-changing operations that deformed the forms in specific ways. These drawings showed multiple generations of forms, with each generation showing the impact of the operation selected. They were vast, intricate and, of course, very laborious. Toward the end of my time at the RCA I began experimenting with the BBC microcomputer, programming in BBC BASIC, whereby primitive shapes could be input and a series of operations output. The computer randomly selected the FormSynth operation to be used, and I would imagine the effect of the 3D transformation and draw the outcome by hand. This was a hybrid between a hand-drawn system and a computer-programmed system that I suppose would fall, albeit only just, into the category of “more than human.”"
