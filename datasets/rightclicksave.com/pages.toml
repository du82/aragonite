full_description = "‍Melissa Wiederrecht was raised in Wyoming, but lives and works in Mecca, Saudi Arabia. From 2006 to 2014, she studied at the University of Wyoming, obtaining degrees in Computer Science. Since graduating, she has employed code and algorithms to create abstract compositions that evoke a connection to the infinite. While her artistic medium relies on technology, it explores how generated outputs can connect to timeless and ancient concepts. Born in the US, Melissa chose to live her life as a Muslim woman in Saudi Arabia, immersing herself fully while also being surrounded by Sudanese people and culture. She actively participates in the generative art movement, participating in online communities and presenting code-based art on the blockchain. With her art, Melissa aims to celebrate the strange and beautiful blend of these diverse cultures, showcasing how they coexist and influence one another in a harmonious symphony of creativity."
