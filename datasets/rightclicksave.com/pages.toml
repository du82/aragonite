["https://rightclicksave.com/article/ai-art-and-uncanniness-cory-doctorow-artificial-intelligence-copyright"]
title = "AI “Art” and Uncanniness"
description = "Rewriting copyright law to combat AI won’t protect creators but a new labor law might, argues Cory Doctorow"
full_description = "Measuring the steady contraction of vocabulary in successive Agatha Christie novels turns out to offer a fascinating window into her dementia. Programmatic analysis of scraped online speech is also critical to the burgeoning formal analyses of language spoken by minorities, producing a vibrant account of the rigorous grammar of dialects that have long been dismissed as “slang.” Since 1988, UCL Survey of English Language has maintained its “International Corpus of English,” and scholars have plumbed its depth to draw important conclusions about the wide variety of Englishes spoken around the world, especially in postcolonial English-speaking countries. The final step in training a model is publishing the conclusions of the quantitative analysis of temporarily copied documents as software code. Are models infringing? Well, they certainly can be. In some cases, it’s clear that models have “memorized” some of the data in their training set, turning the fair use, transient copy into an infringing, permanent one. That is generally considered to be the result of a programming error, and it could certainly be prevented (say, by comparing the model to the training data and removing any memorizations that appear). However, not every apparent act of memorization is a memorization. While models vary widely, the amount of data from each training item retained by a model is very small. For example, Midjourney retains about one byte of information from each image in its training data. If we’re talking about a typical low-resolution web image of 300KB, that would be one three-hundred-thousandth (0.0000033%) of the original image. Typically, in copyright discussions, when a work contains 0.0000033% of another work, we don’t even raise the question of fair use. Rather, we dismiss the use as de minimis — short for de minimis non curat lex or “The law does not concern itself with trifles”). But some works or elements of work appear many times online. For example, the Getty Images watermark appears on millions of similar images of people standing on red carpets and runways, so a model that takes even an infinitesimal sample of each one of those works might still end up being able to produce a whole, recognizable Getty Images watermark. The same is true for wire-service articles or other widely syndicated texts: there might be dozens or even hundreds of copies of these works in training data, resulting in the memorization of long passages from them."
year_published = 2025
