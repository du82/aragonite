["https://rightclicksave.com/article/what-does-on-chain-really-mean"]
title = "What Does “On-Chain” Really Mean?"
description = "With the concept of on-chain art growing in popularity, the JPG community considers the state of NFTs both on and off the blockchain"
full_description = "‍William M. Peaster: Chainleft, how would you define an on-chain NFT to someone unfamiliar with the conversation? What is the starting point? ‍Chainleft: Even today, it’s something that we are trying to define. I’ve been in this niche part of the NFT space for a long while, and my opinion can change through these ongoing conversations that we’re having. As we’ve already seen, some NFTs’ metadata have essentially vanished due to server failures or being altered, or sometimes even unpinned IPFS content. For someone who comes to me and asks, “what is an on-chain NFT?” I respond that it’s a type of NFT whose art isn’t possible to be lost. But there is also a lot of nuance there [because] you can say: “Oh, that’s an NFT that is stored fully as a file on the blockchain, which you can render directly on the chain.” Alternatively, even if the art might not be served from the chain directly, it is possible to reconstruct the art with the elements that are stored on the chain. At a minimum [an on-chain NFT] is the kind of NFT whose art elements are stored on the same blockchain as the NFT. ‍WMP: I know you put a big emphasis in your introduction to the JPG On-Chain Canon about what you call, “on-chain edge cases.” Tokenfox in the JPG Discord mentioned how some collections are on-chain, but because of HTML constraints, they have thumbnails that are served from IPFS, which wouldn’t satisfy some purists. What are the edge cases that you find most interesting? ‍C: There are cases where collections store their metadata on the blockchain but the art or code that generates the art is not on the chain. Personally, I wouldn’t consider that “on-chain” because you can’t actually reconstruct the art from the elements that are inside the chain. Then there are cases where an NFT contract doesn’t have any art on-chain, but then someone else puts it on-chain via another contract. The most popular example here is CryptoPunks (2017), but there are other examples like CrypToadz. The [issue] there is that there is no link between the two contracts, which makes it hard to say whether it’s really on-chain or not. I’m in favor of being inclusive, so I usually prefer to say “yes, they are on-chain.” But people can have different opinions. That is why we have this ongoing conversation, including on Discord."
