["https://rightclicksave.com/article/how-inclusive-is-the-nft-space"]
title = "How Inclusive is the NFT Space?"
description = "The NFT Asia community argues it’s time Web3 embraced the global majority"
full_description = "Eri Harigai: As a digital artist, there weren’t many options for me to sustain a living other than through full-time or client work. It has also allowed me to dive deeper into my personal practice, something that was more difficult to devote time to in my career prior to NFTs. ‍Zenavï: For me, NFTs are about freedom, both artistic and financial. With a background doing client work, I have always had to follow brand guidelines or rules. With NFTs, I am minting personal artwork, which is both exciting and daunting as you’re really putting yourself out there. But the feeling of having someone collect your work is ecstatic. Trends emerge and fade rapidly with NFTs. We’re all talking about AI right now and I know some artists are against it or reluctant to learn about it. But, to be honest, those who can adapt are the ones who will survive in the NFT space, where time passes quickly and people are constantly pushing the use of technology in art. This has forced me to experiment and try out new styles and approaches. ‍Ninaad Kothawade: As a designer, working with NFTs has been the perfect gateway for me to learn about Web3 and the crypto space. The ability to mint my own work as NFTs has allowed me to take time out from my commercial commitments. Being an early adopter also meant I encountered something closer to a level playing field, where it was easier to connect with brilliant creatives around the world and to sculpt our own space in the community. ‍Muhammad Nafay: NFTs have brought many artists, known or undervalued, to a community where we could discover each other’s work and make meaningful connections, especially via Discord and Twitter. Knowing that people look forward to collecting your work is a great motivator to create. ‍Radiosolace: I am a co-founder of 0xStudio, a Web3 studio that works with artists to help them launch their NFT collections. Our goals are to foster awareness and adoption of digital assets, to help artists establish their careers, and to uplift standards in the NFT industry, including artists’ living standards."
