["https://www.rightclicksave.com/article/from-mp3s-to-nfts"]
title = "From MP3s to NFTs"
description = "Joe Looney traces a history of digital ownership, data security, and rarity"
full_description = "It’s the year 2000. On a Tuesday evening as my parents and siblings are preoccupied watching Kyle Chandler in the latest episode of Early Edition, I’m sitting in the dining room at the family computer getting it prepared for a busy night ahead. I will attempt to download three different songs on Napster simultaneously, praying the dial-up connection holds on long after everyone has turned in for the night. Fast forward to 2022 and while the world is a very different place, variations of these same questions are still being asked when it comes to digital media and the applications we use to share and store it. Indeed, these questions have become particularly poignant when it comes to NFTs and the media associated with them. The advent and proliferation of computers created a new bifurcated reality for humans, which accelerated with the rise of the Internet. We now live in a sort of dual reality — half digital, half physical — with the dividing line increasingly blurred. NFTs are now the latest digital abstraction to force people to question the reality of the digital. With NFTs, much of the focus remains on the public blockchain infrastructure that enables digital scarcity. But what the token looks like (or the media associated with it) is just as important to the story we tell ourselves about these digital objects. Napster was a major inflection point for digital media owing to its freely downloadable software that allowed users to download files directly from other users while bypassing the constraint of centralized, highly censorious servers. This facility was extended further with the release of BitTorrent, an open source communication protocol for peer-to-peer file sharing. As a protocol, BitTorrent enabled decentralization not only of peer discovery but also of software itself. The early peer-to-peer file sharing protocols laid the groundwork for the protocols and networks used today for NFTs. The two most popular systems, IPFS and Arweave, are leveraged to ensure data is available to NFT users and applications when needed."
year_published = 2025
