["https://rightclicksave.com/article/painting-and-the-personal-computer-samia-halaby"]
title = "Painting and the Personal Computer | Samia Halaby"
description = "The pioneering painter and digital artist explains what makes the computer the ultimate tool of abstraction"
full_description = "Samia Halaby: My place is in New York. But if life was good and everything were just and hunky dory, I’d be in Jerusalem — my birthplace.‍ AE: Tell us about your background and how you came to produce computer-based kinetic art alongside your painting practice. ‍SH: All I can say is that I was always very interested in the visual. And when it came time to study seriously, I was committed to the idea of independence — to learn how to support myself. I graduated in 1963 with an MFA in painting from Indiana University at a time when there were only big monster computers. I can remember visiting an exhibition by IBM sometime during my student years that had a huge influence on me, imprinting my brain with permanent excitement for all things digital. My friends in the Computer Science department would discuss their experiences programming the university’s mainframe computer with white punch cards. My next fascination was with Sketchpad — a program written by a graduate student at MIT in 1963. Back then, my work was based on perspective and I was making paintings of geometrical still lifes, so the idea that a computer could work in 3D and rotate objects was exciting. When I ended up returning to the university as a professor in 1971, I was invited to join the computer lab. But then all of a sudden an academic position opened up at Yale University, which closed the door on the enthusiasm that had been slowly building. I ended up buying an Amiga 1000 at a blowout sale. It had obviously underwhelmed the financial community, but to me it was magic. I sat at home with my two manuals and got lost in a new world of thought. For three years, all I did was program that computer, making abstract paintings that I term “kinetic painting.” My aesthetic life had shifted. ‍AE: I’ve read that you’re influenced by a myriad of different sources: Islamic architecture, the Bauhaus, the Russian avant-garde, Josef Albers. What are your most lingering aesthetic or conceptual interests?"
year_published = 2025
