["https://rightclicksave.com/article/the-new-crypto-artists-anya-asano-shaga-onhan-flora-marquez-interview"]
title = "The New Crypto Artists"
description = "RCS celebrates a new class of digital creators building careers with NFTs"
full_description = "However, since the birth of crypto art (or “CryptoArt” as the OGs have it), this utopian vision has been undermined by the reality that Web3 lies at the intersection of multiple male-dominated spaces in the art, science, and tech industries, privileging college graduates with access to advanced software and computing materials. The fact that STEM disciplines mark the principal entry points for so many artists in Web3 means that women are inevitably underrepresented in the space. Many of the largest IRL events still take place in the same locations as the traditional art world. Indeed, those events that do seek to cultivate a more inclusive and tolerant ecosystem, such as Historic NFT Fest and FEMGEN, tend to occur on the margins. They are therefore indicative of a movement — and border economy — under constant threat from the forces of centralization and exclusivity that continue to shape the legacy art world. For the artist Sputniko!, whose recent proposal for a wearable allowing avatars to bleed red was rejected by Decentraland, “although people talk about trying to make Web3 or the metaverse more inclusive, ironically it just feels like traditional values and perspectives are being perpetuated.” While there remain a number of projects that continue to widen participation — not least fxhash, Processing, and ClubNFT’s Pathfinder tool — their effectiveness is blunted by a Web3 art world that, even in its infancy, is still reproducing the very star system it once purported to quash. By spotlighting a trio of emerging crypto artists, the following conversation seeks to address the challenges faced by the current generation of hybrid creators, in whom the roles of artist, collector, and curator all coalesce. Together, Anya Asano, Flora Márquez, and Shaga O’Nhan are united by their eclecticism as well as the fact that they have all been surfaced by Pathfinder, which seeks to familiarize collectors with artists who tend to go unnoticed. What makes such conversations so important is that it is only by listening to the priorities of emerging artists that we can return to the kind of horizontal and inclusive ecosystem that might effect meaningful change."
year_published = 2025
