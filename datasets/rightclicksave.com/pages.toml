["https://rightclicksave.com/article/the-emergent-artists-of-fx-hash-interview-generative-art"]
title = "The Emergent Artists of fx(hash)"
description = "RCS hosts a special cast of generative artists who have enriched the ecosystem"
full_description = "Estelle Flores is a Brazilian contemporary artist who has explored video game art since early 2021, developing her collection, “Contain Real Ingredients,” a practice of painting inside the game The Sims 4. Now, this exploration of play continues in the fields of AI, generative art, and code through research into the personal myths and emotional shortcuts produced by nostalgia. ‍Olga Fradina is a generative and digital artist from Ukraine who is also an internationally recognized interior designer. In 2022, she began a series of experiments with the help of different software, working with procedural 3D graphics and creative coding to establish her own approach to AI. Her works are characterized by abstract and biomorphic forms, alongside a focus on emotional states. ‍Andreas Gysin is a designer and artist based in Switzerland. Research, experimentation, analysis, and discovery are all fundamental to his process across both artistic and commercial projects. ‍Ella Hoeppner is a generative artist based in Virginia. She is known for her work with particle systems, her focus on real-time and interactive pieces, and her vivid and abstract textural imagery. She draws inspiration from biology, physics, and mathematics. With a passion for novel and experimental algorithms, Ella’s practice seeks out new directions for code-based generative art. Her work has been exhibited globally, including at Art Basel Miami Beach; Bright Moments, Berlin; and Non Fungible Conference, Lisbon. ‍William Mapan is an artist, coder, and teacher based in Paris, France. While he works primarily with computers and code, his curiosity leads him to explore a wide range of different media and techniques. Through his use of organic forms and rich textural elements, Mapan seeks to bridge the gap between the artificial and the human, creating works that are both technically impressive and emotionally resonant. He is best known for his series, Dragons (2021), Anticyclone (2022), and Sketchbook A (2023).‍"
