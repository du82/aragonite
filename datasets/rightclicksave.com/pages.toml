["https://www.rightclicksave.com/article/the-hawala-history-of-the-nft"]
title = "The Hawala History of the NFT"
description = "As the art world responds to the new trustless economy, Megha Ralapati shares the lessons of centuries of decentralization"
full_description = "From its founding in late 2006 inside artist Shezad Dawood’s London home, Paradise Row has presented an exciting program of local and international artists to much acclaim. Led by curator Nick Hackworth, the gallery created intimate and spectacular encounters between the work of living artists and a curious public. Despite its untimely inaugural exhibition of work by the Chapman Brothers just prior to the global financial crisis, Paradise Row persisted in nurturing talent — offering a platform for artists to show new work, while cultivating trust among a small group of interested collectors. But, like many other mid-sized galleries, its position in the contemporary art ecosystem was vulnerable, its financial footing precarious. Pricey London rent, the year-round circuit of international art fairs, and competition to retain artists eventually proved insurmountable, forcing the gallery’s closure in 2014. Last year, it re-emerged in the form of Paradise Row Projects, a year-long curatorial enterprise led by Hackworth alongside collector Pippa Hornby that tinkers with the traditional gallery model, nudging it away from art for art’s sake (or at least for profit’s sake) toward social and environmental benefit. In New York, Candice Madey opened her gallery, On Stellar Rays, in 2008, on the eve of Lehman Brothers’ collapse. In spite of everything, she successfully operated the space through 2017, gaining recognition as a visionary and strategic dealer-curator. The years leading up to the crisis had seen a period of economic expansion, low inflation and falling interest rates, which piqued collectors’ interest in emerging markets and encouraged a number of young dealers to open shop on New York’s Lower East Side. Madey recalls the period as “vibrant and remarkably collaborative,” as peer galleries reflected together on their role in the art economy. Although financially stable, Madey closed the gallery to rethink its business model according to new metrics of success. Last year, she reopened an eponymous gallery at the same address, sharing space with two culture-centered businesses, an experimental chamber music ensemble and an architecture firm — all sharing in and supporting each other’s programs. Adaptation is critical for mid-sized galleries, and Madey now accepts cryptocurrency as payment."
year_published = 2025
