["https://rightclicksave.com/article/when-tyler-hobbs-met-0xdeafbeef-generative-art-interview"]
title = "When Tyler Hobbs Met 0xDEAFBEEF"
description = "The artists discuss the physical craft of generative art with Elisabeth Sweet and Alex Estorick"
full_description = "‍Elisabeth Sweet: Could you both say a bit about yourselves and tell us about your Feral File projects, F(l)ight (2021) and Sketches in Iron (2022)? ‍Tyler Hobbs: I’m a generative artist and, since 2014, I have built my practice primarily around code. I will typically construct an algorithm that generates static, 2D, abstract visual imagery. But I’ve always spent a lot of time drawing by hand as well. One channel of my work has been looking at ways to integrate the hand and the algorithm. F(l)ight came out of a particular approach to capturing drawings by hand as vector data that can be manipulated by the algorithm — looking for ways to modify and expand on what the hand is able to do. There’s something special to me about birds in flight as a subject, so I did a lot of preparatory drawings and ended up selecting five different kinds of birds, and then manipulated them algorithmically to produce a final set of 30 works, all of which were then executed as pen-plotter drawings on paper. All the works in the “-GRAPH” show were centered around the plotter, which is a simple two-axis robot that you can put a pin in and give instructions to draw something. It’s a great way to translate a digital idea into the physical world. F(l)ight was also concerned with the actual physical production of these works, and so a lot of the quality and character of that work is driven by the need to execute it physically. ‍0xDEAFBEEF: For the past 20 years, I’ve been immersed in a wide assortment of fields that overlap art and tech. I’ve studied music and electrical engineering; I’ve run a music recording studio; I’ve done some research and computer graphics; and, until recently, I supported myself as a blacksmith running an artisan craft business making hand-forged jewelry out of alternative metals. I like to explore and tinker, usually in a self-directed solitary way. Currently, I’m best known in this space as an audiovisual generative artist. In recent years, I’ve adopted an art practice that intentionally used a minimal toolset. I purposely chose a cheap laptop and a C compiler, and then tried to write code from scratch that can produce sound and animation without using any type of external library. Now I attempt to make code-based work that incorporates generative sound and music, while exploring some of the unique affordances of programmable blockchains."
