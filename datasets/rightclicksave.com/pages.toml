["https://rightclicksave.com/article/art-blocks-and-the-data-of-generative-art"]
title = "Art Blocks and the Data of Generative Art"
description = "Following a year in which generative art went mainstream, Kyle Waters mines the data behind the platform that launched a new movement"
full_description = "Humans have been making art with computers for over half a century. Pioneers like Georg Nees, Frieder Nake, and Michael Noll were important early innovators in generating art with computer code. Georg Nees’s 1969 thesis, Generative Computergraphik, presented sublime works created not from hand-made brush strokes but from sets of rules interpreted by a computer. Today, generative art has arguably never been more popular and recognized by the wider public. While the recent sale of Vera Molnár’s work, 2% of disorder in co-operation #01 (2022) on the occasion of the artist’s 98th birthday reinforces the tightening thread of generative art history. A quick scan of Google Trends — a cursory yet potent gauge of general interest — shows that worldwide searches for “generative art” reached an all-time high in 2021. But what was behind this rise? Enter Art Blocks. By now, even casual followers of the NFT ecosystem will likely be aware of Art Blocks, the Ethereum-based generative art platform. When I recently reviewed data in the year of the NFT, Art Blocks stood out among crypto art platforms, recording $1.4 billion in total sales volume. From this data, it was clear that Art Blocks deserved an analysis in its own right. Here, I explain the Art Blocks platform and examine the data behind its rise to cultural prominence. Art Blocks was first launched in November 2020 with founder Erick (Snowfro) Calderon’s project, Chromie Squiggle (2020) — simple, colorful, and memorable strokes which have now morphed into the platform’s logo and overall brand design. Art Blocks emphasizes that it is “generative art on the blockchain.” Generative art describes works of art that are created entirely from computer code, and generative artists on Art Blocks write code to express their artistic vision. They program functions and scripts, taking as input some arbitrary data that then deterministically produce a visual output in the form of a GIF, static image, or interactive experience. Each NFT maps to an individual artwork produced by the given algorithm."
year_published = 2025
