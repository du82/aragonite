["https://rightclicksave.com/article/art-and-resilience-at-the-world-economic-forum"]
title = "Art and Resilience at the World Economic Forum"
description = "The presence of artists at the Forum’s annual meeting poses big questions for policymakers, writes Mia Stern"
full_description = "The title of the 2025 edition: “Collaboration for the Intelligent Age” follows the thrust of a recent article by the Forum’s Head of Arts & Culture, Joseph Fowler. The WEF has incorporated an arts and culture program for more than 30 years to enrich and diversify its thinking around core issues discussed at the conference, including sustainability and social progress. In 2023, a number of creatives were invited to speak about their practices under the banner of “Cultural Leaders as Catalysts of Change.” Artist and architect Maya Lin discussed public art and the environment, using her talk to inform listeners about the destruction of natural habitats and consequent extinction of species, while proposing impactful solutions to the very people who have the power to act. In turn, artists were invited to exchange ideas with executives from the likes of IBM and McKinsey & Company. The intermingling of arts and culture with discussions at the Forum is seen as one way of fostering the kinds of resilience that “The Great Reset” was calling for during the pandemic. Resilience on these terms is really tensile strength applied to socio-economics: the ability to be flexible in order to resist stress. While Schwab was reacting principally to the COVID crisis, other stresses he pointed to were social inequality and climate emergency. Faced with such threats, what he argued should be resilient is growth, an interesting position to defend given that growth for growth’s sake is often regarded as a leading cause of social inequity and environmental degradation. ‍ Of course, resilience is also essential for contemporary artists, activists, and artist-activists if they are to navigate an economy that so often undervalues their material and immaterial labor. Three of the artists shown at the WEF in 2024 and 2025: Benjamin Von Wong, the Yawanawá people, and Gary Tyler, question what resilience means for contemporary creators while testing the resilience of the global economic system."
