["https://rightclicksave.com/article/when-poetry-took-over-the-blockchain-theverseverse"]
title = "When Poetry Took Over the Blockchain"
description = "A groundbreaking exhibition prompts Derek Beaulieu and Alex Estorick to consider the place of poetry in Web3"
full_description = "The advent of Web3 technologies — blockchain, NFTs, and smart contracts — has created the conditions for a vastly expanded cultural economy premised on radical inclusivity. In this new creative sociality, art forms that were previously incapable of mass marketization are gamified and financialized for the benefit of a hybrid community of creator-collectors and subject-objects. Where digital art served as a proof of concept for NFTs, in the past year blockchain poetry has emerged as a new cross-border currency and vital index of human-machine interactions. Alternative economies have often been founded on toleration and trust, from the hinterland between medieval Byzantium and Islam to the vast hawala networks of South Asia. Today’s ecotone — where different communities cross-fertilize — is instead an exchange of human and machine intelligence. “POÈME SBJKT” widens the pool of posthuman interactions initiated by theVERSEverse, whose community has revived poetry as a potent form of cultural capital. Taking its cue from Breton’s poem objects that combined art with poetry for the revelation of the unconscious, this exhibition challenges poetry’s canonical limitations by reversing word’s subservience to image. It therefore follows conceptualism in dematerializing art to an idea while at the same time commodifying language through tokenization. It also challenges legacy artistic and literary establishments that continue to depend on centralized controls and old disciplinary divisions. As these creators make abundantly clear, it is porousness and plurality that will found the new cultural economy. Normative poetry remains ensconced in a 1950s modernist aesthetic: clean design; a logical, controllable narrative of graphic beauty and heroic lyricism. While much contemporary poetry arose from that mandate, we can swerve the beauty away from the sales pitch. Just as logos continuously wash over us, let poetry do the same; part of the written landscape we occupy."
year_published = 2025
