description = "The iconic curator of Cybernetic Serendipity discusses the legacy of the Japanese avant-garde for generative and AI art"
full_description = "Jasia Reichardt is a writer on art and an exhibition organizer. She was Assistant Director of the Institute of Contemporary Arts (ICA) in London (1963-71) and Director of the Whitechapel Art Gallery (1974-76). She has taught at the Architectural Association, as well as other colleges and wrote several books including Robots, Fact, Fiction and Prediction (1978). She is principally interested in art that encroaches on science and has spent many years following up the connections between art and technology, including in her column in New Scientist. Among her exhibitions staged in Britain, the best known is “Cybernetic Serendipity” (1968) about the computer and the arts. During the 1990s she worked on Japan’s Art and Technology Biennale, ARTEC, in Nagoya, and in Tokyo. She also curated an exhibition, “Electronically Yours,” in which the works of art communicated with the viewers. Her last exhibition dealing with art and technology, called “Nearly Human,” was about the history of artificial life. Her most recent book is Cybernetic Serendipity, a Walk Around the Exhibition (2023).‍ “Patterns of Flow” runs from 25 September to 6 October 2024 on Feral File and at NEORT++ in Tokyo."
