["https://www.rightclicksave.com/article/rhizome-and-the-seed-of-digital-arts-future-trlab-interview"]
title = "Rhizome and the SEED of Digital Art’s Future"
description = "As Rhizome opens up its archive to TRLab, Michael Connor and Audrey Ou discuss their new collaboration with Jason Bailey"
full_description = "Jason Bailey: I’m curious, how did the two of you meet and what prompted the collaboration between Rhizome and TRLab?‍ Michael Connor: We got to know each other through Rhizome’s Seven on Seven (7x7) program, which was an initiative that paired artists with technologists, asking them to make something new as part of a short-term collaboration. Famously, in 2014, Kevin McCoy minted the “first” NFT at Seven on Seven with Anil Dash — that’s one of our claims to fame but it’s been a long-running program. ‍ Audrey Ou: Michael came to one of the talks that I did when we launched season one of TRLab’s partnership with the Calder Foundation. TRLab specializes in using the capabilities of Web3 and blockchain technology to create online experiences that educate people and allow them to participate interactively with art in a new way rather than simply selling NFT art. ‍We’ve wanted to find a way to build more connections between our work and that community, and we were interested in TRLab’s desire to experiment and willingness to take risks. ‍AO: For TRLab, what we always care about is creating customized digital journeys through archives that highlight historical context. There are newcomers to the space who are unaware of generative art’s long history, including how it relates to net art. I first found out about Rhizome from a friend back in 2016, who told me about how much they had done to support artists in the born-digital art scene. When Michael and I sat down, Rhizome had been working on its Net Art Anthology and revamping the website. We discussed the potential ways in which we could collaborate on something that TRLab is good at in order to highlight Rhizome further.‍ MC: The conversation also started just as the market was changing a lot. For a non-profit, engaging with the heat of the market in 2021 felt really difficult. There was an expectation that Rhizome could just capitalize on this incredible run, but it was really difficult to engage beyond saying: “we’re here to contextualize and create space for conversation in a way that keeps the long game in view.” Now that has really shifted."
