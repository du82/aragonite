["https://rightclicksave.com/article/tyler-hobbs-on-qql-and-the-future-of-generative-art"]
title = "Tyler Hobbs on QQL and the Future of Generative Art"
description = "Fresh from his new collaboration with Dandelion Wist, the artist speaks to Alex Estorick about his search for the grail"
full_description = "‍Tyler Hobbs: QQL (2022) doesn’t actually stand for anything. I tend to select names for my work that don’t impart a clear meaning. I want the viewer to approach the work initially with a neutral mindset and for the work to establish itself visually. The approach that Dandelion and I took this time for QQL was simply to pick a name that had three letters that sounded good, without assigning a particular meaning to them. We actually had a little generative workshop to create the name that involved a bit of programming as well as curating. QQL was the output we liked the best. ‍AE: You’ve described the project as “an experiment in generative collaboration.” How has your experience of Art Blocks prepared you for this project, and what did you want to do differently this time? ‍TH: This project absolutely would not have happened without Art Blocks and Fidenza (2021) and seeing that model play out so thoroughly. This project in some ways goes back to pre-Art Blocks generative art and in other ways it moves forward. Before Art Blocks, most generative artists, including myself, would have a curation step in their artistic process. So once the algorithm was complete, I would generate hundreds of images, curate a handful of my favorites, and turn those into finished works via unique prints, for example. With Art Blocks there is no curation step — every single output ends up in the hands of the collectors. And that really places some strong constraints on the kind of algorithm you can craft because the minimum standard of quality for the outputs has to be extremely high. That normally prevents you from taking certain risks with the algorithm. That also tied in really nicely with the involvement of the community because, with QQL, it’s not me or Dandelion curating the output, it’s the entire collective community. That also dramatically shapes what kinds of outputs get selected, how many outputs get viewed, and the entire approach to the artwork. It’s a very different model. But without Fidenza and Art Blocks I wouldn’t even be thinking along these lines — QQL grows out of that style of work."
