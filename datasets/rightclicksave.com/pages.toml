["https://rightclicksave.com/article/the-interview-jared-s-tarbell-generative-art-etsy"]
title = "The Interview | Jared S. Tarbell"
description = "The iconic creator shares how generative art can unite computation and spirituality with Kate Vass and Alex Estorick"
full_description = "Jared S. Tarbell is a generative artist, developer, and programmer who has worked with code for over 30 years. Born in Albuquerque, New Mexico, Tarbell’s initial encounter with personal computers in 1987 sparked a lifelong passion. Fascinated by the system-like intricacies of the world, he visualizes abstract truths by observing multiple outputs and refining his algorithms. His works bridge mathematical beauty and abstract exploration, uniting spirituality with computational precision.‍ Kate Vass is the founder of Kate Vass Galerie, a pioneering art gallery established in Zurich, Switzerland in 2016. She has since launched a curated marketplace, K011, which empowers AI and generative artists through a long-form AI engine called 0KAI that enables the creation of long-form AI artworks on the blockchain. Kate Vass Galerie has hosted a number of ground-breaking exhibitions, including “Perfect & Priceless: Value Systems on the Blockchain” (2018-19) and “Automat Und Mensch,” which explored the history of generative art. Recognized for her contributions to global art and tech culture, in 2021 Kate Vass was named as one of the Art & Tech 40 under 40 and featured on the Artnet NFT 30 list.‍"
