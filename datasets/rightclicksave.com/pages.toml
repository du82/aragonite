["https://rightclicksave.com/article/can-ai-unlock-the-unconscious"]
title = "Can AI Unlock the Unconscious?"
description = "Ian Cheng and Bettina Kames speak to Ann Marie Alanes about the power of immersive exhibitions in Web3"
full_description = "Ann Marie Alanes: Ian, you were producing digitally native works before the NFT. How has your experience of NFTs and specifically your recent project, 3FACE, changed your approach? Do you plan to continue the story of Life After BOB? If so, how do you foresee that emerging? ‍Ian Cheng: I had a great experience launching 3FACE with Outland. 3FACE was all about making an artwork that can adapt itself to each viewer/holder. It is the beginning of a longer exploration of adaptive art that I want eventually to apply to Life After BOB. This is firstly a narrative project, trying to tell origin stories of new kinds of archetypal humans who figure out how to live in a changing world. One dream is to let the viewer pause an episode and begin to improvise a conversation with a character or narrator. My daughter does this — we will be reading a bedtime story, and she will pause me to ask about some detail or to have me improvise what a character should be doing differently. ‍IC: I love western animation — Disney, Pixar, etc. — but I relate to the energy and priorities found in anime more. Anime’s attention to the interior lives of its characters: the care in depicting nature; the wabi-sabi aspect-to-aspect way of setting a location as simultaneously a mood; the economy of certain shots where almost nothing moves but the story advances; and, of course, the nerve to explore adult subject matter in the medium of animation. In western animation, it is presumed that the inner child of a person dies by adulthood and that cartoons are a simplified media for kids to inhabit, [which is] so lame. Life After BOB is about mental health, and about the existential pain of rewriting one’s life path. The strong tools and tropes of anime seem well suited. ‍AMA: Amira Gad, Head of Programmes at LAS (Light Art Space), described the programmable version of Life After BOB as “Disneyfication.” This implies that the participants feel safe in an unsettling context. You seem to have mixed feelings about AI — you enjoy working with AI concepts and AI-based systems, but then the narrative of Life After BOB shows humans using it in the worst ways. How do you reconcile the two ends of this spectrum?"
