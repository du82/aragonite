["https://www.rightclicksave.com/article/an-interview-with-manfred-mohr"]
title = "An Interview with Manfred Mohr"
description = "The legendary computer artist speaks to Aleksandra Jovanić about algorithms, music, and the logic of generative art"
full_description = "Manfred Mohr: I didn’t wake up one morning and suddenly use code and a computer — it was a very long thinking process in my life. I come from the abstract world of music. Music is always the basis of all my thinking. My early interest in visual art was therefore strongly influenced by jazz and classical modern music, reflecting a kind of action painting. The problem was, I could not really control my artwork. In music, I could write down tunes, etc., but with action painting I had no real control. It was only when I got into the philosophy of Max Bense in the early 1960s that I understood that “rational” thinking in art, as Bense proposed, could solve that problem. One has to create the logic of what one wants to do before one starts. Aleksandra Jovanić: We all make an algorithm whenever we make our generative pieces. At the beginning of last year, I was part of a team that was developing an interdisciplinary course for high school students. The aim was to connect art, mathematics, and programming. I dedicated one of the chapters to your Random Walk, which is one of my favorite algorithms because when I don’t know how to continue with one piece, then I try to take the next step in a random way. Do you have a favorite algorithm or set of algorithms?‍ MM: If you have four sons, you cannot say you have a favorite one. All algorithms are equal in their logical sense. But, I must say, Random Walk from 1969 was one of the first algorithms I wrote which worked and therefore has a special historic value to me. Like all digital artworks, I see it as a three-fold interdependent process. Ice, water, and steam are all the same, but represent different states. I see the code/logic as one state; the running of the program and getting a data file (result) as a second state; and the visual result as the third state. None of them can exist without the other. MM: Sometimes I have an exact idea and sometimes I have only a vague idea of what I want to do. Sometimes, I make some sketches; it depends on what it is. I start by writing the code and at the same time figure out how everything builds up logically. I remember very well when I met Pierre Barbaud, the French composer, in 1967, who was one of the first composers to write music with a computer. He explained to me how he composed his music: putting bits of sound, which he called “êtres musicaux,” together and then calling these in a program through subroutines which generated an output based on statistical decisions."
