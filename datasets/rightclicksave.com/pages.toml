["https://www.rightclicksave.com/article/poetry-and-the-new-meaning-of-curation"]
title = "Poetry and the New Meaning of Curation"
description = "As Web3 increasingly embraces poetry as an art form, Ana Maria Caballero proposes curation as disruption"
full_description = "Verse is revered, but it isn’t transacted in a way that reflects its contribution to culture. Books containing dozens of meticulously sculpted poems sell for $14.99, if at all. For better or worse, society establishes the commercial valuation of its objects through their exchange. Indeed, the US tax code treats cryptocurrencies as property, triggering a tax when coins are bought and sold. No taxable event occurs while holding — trade pronounces value. Western systems of valuation are inadequate, but if you zoom out far enough they gain some logic. Van Gogh died a pauper, but, today, his works are invaluable. Of course, not everything of value is important, but the more esteemed cultural outputs tend to price up. This hasn’t happened for poetry, which is also rarely exhibited as art. Here’s how a poem usually gets published: A poet pays editors at a journal to read their work, waits several months (even years) to receive a rejection. In the rare event that an editor accepts a poem, it’s unclear who, in the end, will read and enjoy its tender craft. Typically, the only currency exchanged is the fee paid by the writer to have their work considered. No editor is involved, though some platforms do screen applications. Apart from copyright and offensive-content concerns, there’s no panel weighing a work’s quality before you mint. This is particularly true of platforms on the Tezos blockchain, where there are no applications at all and the absence of expensive gas fees democratizes the minting process further. Of course, the Web3 model of publication raises the question of quality control. To curate or not to curate is an abiding dilemma for the cryptoverse, one that strikes at its core ethos of decentralization and inclusivity. What makes a blockchain poem “good”? Who gets to decide? Does a wholesale lack of curation diminish NFT literary culture? While such questions have been posed of crypto art, they are yet to be addressed when it comes to poetry. To get there, I’ll take the scenic route."
