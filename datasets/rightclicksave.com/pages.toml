["https://rightclicksave.com/article/can-an-app-transform-nft-collecting"]
title = "Can an App Transform NFT Collecting?"
description = "With collectors increasingly supporting a narrow range of artists, Jason Bailey proposes a new solution"
full_description = "Art is and always has been the best part of my life. When I was growing up, painters were my heroes and I spent all my time painting, drawing, and reading about art. I then studied studio art and art history in college. Upon graduation I realized that those who had warned me in advance were right — there was little opportunity to carve out a living as an artist. My response, like hundreds of my peers, was to give up and find another path. As I created less and less art myself, the art of others kept me afloat. Museums were my sanctuary and in down moments I would surf the Web like an addict craving new work to replenish my soul. That is how I fell in love with digital art. My life was spent largely chained to a laptop and the Internet offered an escape to a vast and vibrant world of new artists. Yet I promptly realized that few, if any, of the many thousands of digital creators were able to make a living wage from their work. When I discovered the nascent crypto art community in late 2017 I was overjoyed. Where the old star system had failed so miserably to support digital artists, this new grassroots movement had generated a viable alternative. Inspired by crypto’s disruption of traditional finance, a new wave of collectors began to explore crypto art’s decentralized ecosystem. More than anything, crypto art (or CryptoArt) was driven by new collecting platforms. Yes there were individual artists incorporating blockchain into their art, but it was thanks to community platforms like Rare Pepe Wallet (RPW) and Dada.nyc that crypto art reached the necessary escape velocity to trigger a revolution. In 2016, RPW became the first NFT marketplace that focused on art — rather than gaming — to develop a large community of both artists and collectors. Based on the playful conceit of collecting provably rare tokens tied to JPEGs of frog memes, it ultimately became the blueprint for all subsequent NFT marketplaces. As its creator Joe Looney has said, RPW was not interested in being a central authority that decided which art was good or bad, it simply filtered out any work that was NSFW (“not safe for work”). This hyper-inclusive approach represented the antithesis of the legacy art world’s winner-takes-all model. Yet equally revolutionary was RPW’s decision to take zero commission from artists’ sales, both on the primary and secondary markets. In the traditional art market, it is common for galleries to take a 50% cut."
