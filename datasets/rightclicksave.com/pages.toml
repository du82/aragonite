["https://rightclicksave.com/article/web3-and-the-new-social-contract"]
title = "Web3 and the New Social Contract"
description = "Alex Estorick hosts Paolo Cirio and Max Haiven in conversation about the prospects and perils of blockchain technology"
full_description = "Alex Estorick: Both Paolo’s art and Max’s writing skewer vertical systems in ways that feel especially resonant in Web3. Max, you’ve written about Paolo’s work in the past, and I’d like to use that as the basis for a conversation about blockchain, NFTs, and Web3 that addresses the reality they are engineering. Specifically, you’ve talked about how contemporary art and finance are parasitic on the real economy, feeding off wealth external to them: ‍It seems to me that most artists working with NFTs have now accepted this as fact — that the NFT financializes digital creativity in some fundamental way — but many are embracing it anyway to unlock artistic careers that were previously inaccessible to them. Max Haiven: I was thinking today, before we began, that it’s strange that Paolo’s Derivatives (2020) work and my book on art and money were being completed just as NFTs were emerging in the public consciousness — almost like they were flashes before the storm. Had I written my book a year or two later, it would have been a completely different project. And I think if you were starting to do the Derivatives project now, Paolo, it would have to be a different project. ‍ Paolo Cirio: That happens to me quite often. I remember when I was finishing the Art Commodities (2014) project, which was about the financialization of digital art, there were these other artists in New York working on the same idea based on the blockchain. So it was definitely in the air. I’m not all that positive about decentralization for its own sake. In 2014, I did a project about the potential of decentralization, called Global Direct, which was about the promise of global direct democracy through the decentralization of the Web. But that mainly concerned the new political movements springing up at the time, particularly in Europe, that were using Web2. The dilemma then was how to moderate disinformation in a decentralized network, and how to ensure accountability for bad actors or indeed politicians who wished to remain anonymous. The question now is: “How do we establish a common constitution based on ethical principles?” Because we do need some rules in the world, otherwise it’s not a fair game. But we also need to enforce those rules."
