["https://rightclicksave.com/article/our-fathers-chuck-csuri-and-d-p-henry"]
title = "Our Fathers | Chuck Csuri and D. P. Henry"
description = "Caroline Csuri and Elaine O’Hanrahan reflect on two pioneering generative artists with Douglas Dodds and Leslie Jones"
full_description = "Douglas Dodds: It’s a real honor to be talking to the daughters of two artists of a certain generation. Elaine, your father, Desmond Paul (D. P.) Henry (1921-2004) and Caroline’s father, Charles “Chuck” Csuri (1922-2022) were virtually the same age, living in different countries, pursuing different paths, but nevertheless ended up being involved in this wonderful world of digital, algorithmic, and computer art. They both went through the Second World War, which obviously had a bearing on their work. Elaine, according to your website, your father took part in the Normandy landings in 1944. How do you think that experience informed his work? ‍Elaine O’Hanrahan: Well, there were two waves of Normandy landings. My father was in the support unit, the Royal Electrical and Mechanical Engineers, so he arrived on the Normandy beaches six days after the first wave. When he was traveling with the British Liberation Army through Germany, he was particularly struck by the destruction that British bombers had inflicted. He was a traditional artist to start with, working by hand to depict gaunt, distorted faces behind swirling forms as well as figures hanging from trees. Some of his machine drawings bear grim titles, like “The dead rising from some forgotten battlefield.” Nevertheless, he saw the technology as something that was protecting them. He worked with anti-aircraft guns and their predictor systems — that’s what helped him understand the bombsight computers that he would later adapt into drawing machines. The war really changed his life, and it was thanks to the war that he got to university because it meant he received a grant as an ex-serviceman. Before the war, he was a waterworks clerk for Huddersfield Water Works, and then he ended up being this medieval philosopher at Manchester University. Caroline Csuri: Yes, he got the Bronze Star Medal for heroism having volunteered at the age of 20. During the Battle of the Bulge his US Army unit lost communications with headquarters; Chuck ran through an open field against enemy lines and a barrage of bombs and machine-gun fire to restore communications. He claimed that his experience as a football player and sheer terror helped him to dodge the bullets, though one grazed his helmet. Like D. P., my father was also profoundly impacted by the war, but until recently he only communicated its effect through his art."
