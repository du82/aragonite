["https://rightclicksave.com/article/the-artists-who-rewired-web2"]
title = "The Artists Who Rewired Web2"
description = "A generation of female creators has been challenging algorithmic domination for years writes Nina Knaack"
full_description = "Web2 is defined by the centralized control of a few tech companies and a shadow economy in which data is captured and sold with the user rarely in the loop. Artists experimenting with algorithms have often faced skepticism, ridicule, and marginality with their work dismissed as either tech fetish or gimmick. Amid this stifling air of conformity, which mirrors the art world’s own entrenched hierarchy, artists including Gretchen Andrew, Sougwen Chung (愫君), Stephanie Dinkins, Lauren Lee McCarthy, Mimi Onuoha, and Hito Steyerl have all held a mirror up to the corrupt operations of tech systems that are hardwired to reiterate old biases and bad behaviors. By scrutinizing the data used to train algorithms as well as the “optimization” of search engines, they challenge the underlying assumptions that underpin these systems, raising awareness and provoking conversation about the ethical, social, and political consequences of our ongoing digital dependency. As Tatiana Bazzichelli and Geoff Cox asserted in their book Disrupting Business: Art & Activism in Times of Financial Crisis (2016), artists play a crucial role in exposing the hidden structures that shape our understanding of the world. These writers celebrate successful strategies that exploit loopholes in order to subvert digital systems. They argue that creative interventions by artists and activists can expose the systemic flaws and biases inherent in contemporary society, prompting a critical re-evaluation of the status quo in order to bring about systemic change. Disrupting Business champions the transformative power of art, encouraging resistance and resilience in the face of adversity. The book extends Bazzichelli’s own model, developed in her earlier work, Networked Disruption (2013), of the artist as a virus capable of challenging established systems of power by disrupting its networks of distribution. More recently, Max Haiven identified an alternative approach of “tactical parasitics” whereby artists gain access to dominant systems via monetary flows in order to subvert them from within.¹ By adopting such tactics, artists working with technology are able to deconstruct the (algorithmic) processes that perpetuate discrimination. This approach confronts the capitalist logic of “algorithmic identity,” whereby our digital (and therefore real) selves are actively reconstructed according to a series of “measurable types” — and therefore assimilated within appropriate customer segments.²"
