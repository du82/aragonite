["https://rightclicksave.com/article/the-lumen-prize-nft-award"]
title = "The Lumen Prize NFT Award"
description = "Right Click Save is pleased to announce its sponsorship of a new award celebrating work at the cutting edge of the NFT ecosystem"
full_description = "As part of our mission to bring NFTs to the heart of the art world, Right Click Save has partnered with Lumen Art Projects to launch The Lumen Prize NFT Award. Founded by Carla Rapoport, The Lumen Prize is presented every year to pre-eminent digital artists from around the globe. We hope that by bringing the Lumen Prize to the NFT community, we can ensure recognition of the most important NFT artists across the wider world of art and technology.‍ The NFT Award is for excellence in work by an artist, artist collective, or DAO that represents the cutting edge of the NFT ecosystem, including but not limited to works that demonstrate a sophisticated use of blockchain technology, creative implementation of the non-fungible token format, and cross-disciplinary projects.‍ Ania Catherine and Dejha Ti, winners of The Lumen Prize BCS Immersive Environment Award 2021 for I’d rather be in a dark silence than, on how an NFT Award can benefit artists...‍ Lumen have done so much as an independent organization over the years with no intention other than a pure desire to support and elevate artists who work with technology, us included. Their jury members come from the world’s top institutions, and take their time to evaluate each work, considering creativity and technical execution, and evaluating work with a rich understanding of the history of new media art. We were shortlisted in 2020 and won in 2021, which was a milestone moment for us. ‍ While we don’t think winning awards is any indication of a work’s quality, we can say with confidence that winning the Lumen Prize has opened doors for us. Given the growing public interest in digital art, it is increasingly important to have trusted organizations evaluating art — who can separate what is original from what is derivative, what is simply large in scale from an unprecedented technical undertaking, and what merely looks techy from work that brings out the poetry in technology. Beyond that, as two women creating large-scale and highly technical projects (which require a lot of trust and resources from partners and institutions), validation of our work from respected entities like Lumen is definitely helpful.‍"
year_published = 2025
