["https://rightclicksave.com/article/pattern-anarchy-and-the-promise-of-old-media"]
title = "Pattern Anarchy and the Promise of Old Media"
description = "Artists are engineering new modes of perception by embracing ornament, argues Corinna Kirsch"
full_description = "In an age of screen-based mediation, there arises a desire for firstness — a sense of direct experience. This desire taps into the dreams of Web3, in which techniques to take away intermediary barriers are intended to close the gaps between oneself and others in a technological environment. The unstated mantra here may be to remove the middle — that which mediates — and you shall be free. In media-based art practice, the desire for firstness sometimes gets equated with techniques that merge the worlds of the digital and the real by transforming the domain of the flesh into hyperrealistic, HD simulations, as if we all lived inside a cyberpunk video game. But this is not the only process artists consider when searching for a way to balance direct and mediated experience. Another, more deeply haptic and historically considered, form of practice charts out new parameters of interaction through terms that oppose these sleek, polished, and smooth surfaces. Works by artists like LoVid, Travess Smalley, and Tauba Auerbach, among many others, integrate the analog with digital considerations to produce noisy, textured, and ornamental work that looks both handmade and algorithmically generative. But hopefully, by noting this prevalent condition in art practice, other writers, artists, and curators can take up and add to this genealogy. There is an element of disorder in these patterned compositions, recalling sci-fi author Bruce Sterling’s well-known invocation of the World Wide Web of the 1990s as a “true, modern, functional anarchy.”² But the informal and open-ended nature of cyberspace is not the only layer of anarchy in these works. There is a long history recalled by these patterns going back to practitioners of video in the 1970s, who played with both analog and digital synthesizers as a form of sound and image processing to expand one’s connections to the screen-based world through tactile interactions. This dimension of tactility expresses itself as a sort of surface tension between what media theorist Giuliana Bruno refers to as the immaterial and material relations of an image.³"
year_published = 2025
