["https://rightclicksave.com/article/the-art-of-money-ashmolean-museum-money-talks-artifacts-interview"]
title = "The Art of Money"
description = "A new show at the Ashmolean Museum considers the place of digital art in the history of currency"
full_description = "Shailendra Bhandare is Assistant Keeper, South Asian, and Far-Eastern Numismatics and Paper Money Collections, a Fellow of St. Cross College and a member of the Faculty of Oriental Studies. He started his career as a numismatist with a visiting fellowship at the Fitzwilliam Museum, University of Cambridge. He was then appointed as a post-doctoral fellow of the Society for South Asian Studies, and worked as a curator in the British Museum on the coins of Later Mughals and the Indian Princely States. He was appointed as curator of coins in the Ashmolean Museum in 2002. He was born and brought up in Mumbai, India where he received his first degree in Pharmaceutical Sciences. He holds a Masters degree in History and a Doctorate in Ancient Indian Culture from the University of Mumbai.‍ Ana María Caballero is an award-winning literary artist whose work explores how biology delimits societal and cultural rites. She is the recipient of an Academy of American Poets Prize, the Beverly International Prize, Colombia’s José Manuel Arango National Poetry Prize, the Steel Toe Books Poetry Prize, a Future Art Writers Award, and a Sevens Foundation Grant. In 2024, she became the first living poet to sell a poem at Sotheby’s and has sold the first digital poem via live auction in Spain. Her Pushcart Prize and Best of the Net-nominated work has been published extensively and exhibited as fine art at museums and leading international venues, such as the Wroclaw Contemporary Museum, Museo de Arte Miguel Urrutia, bitforms, Office Impart, Poetry Society of America, Gazelli Art House, New World Center, and Times Square. The author of six books, she also co-founded the digital poetry gallery theVERSEverse.‍ Larva Labs is John Watkinson and Matt Hall, long-time creative technologists and early innovators in blockchain art. In 2017 they created the Cryptopunks, one of the earliest examples of NFTs on the Ethereum blockchain. Along with a mechanism for digital ownership, the Cryptopunks contract also includes a fully decentralized zero-fee marketplace that has processed over $2 billion dollars worth of Cryptopunk transactions. Further work includes Autoglyphs (2019), the first fully on-chain generative artwork, and The Meebits (2021), generative 3D characters with an integrated zero-fee trading system.‍"
