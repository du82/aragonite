["https://rightclicksave.com/article/an-interview-with-marina-abramovic"]
title = "An Interview with Marina Abramović"
description = "The legendary performance artist speaks to Alex Estorick about her genesis NFTs and the new age of heroes"
full_description = "Throughout her career, Marina Abramović has pioneered performance as an art form, putting her body at the center of events in space and time to engage with contemporary artistic, social, and political circumstances. This month sees the launch of her first NFT project, The Hero 25FPS, a collaboration with CIRCA due to be minted on Tezos on 25 July, 2022. Described as “a performance hosted on the blockchain,” the work revives the central theme of 2001’s The Hero, to be presented across the CIRCA global network of screens in London, Seoul, Milan, Berlin, Tokyo, Dublin, and New York — appearing every evening at 20:22 for three months. Filmed at 25 frames per second, unreleased material from the original work has now been separated into thousands of unique frames. Audiences will be invited to collect either a single unique frame (JPEG) or multiple unique frames in the form of a GIF. Given the artist’s centrality to the world of contemporary art, her decision to embrace the NFT community has profound implications for the future of the art world.‍ Alex Estorick: Are there any ways in which NFTs and blockchain technology change the way you view performance, or indeed time-based media? When I was 14, I asked my father to give me oil paints — because oil paints mean you are a serious artist. My father didn’t really care about art but he knew this soldier, Filo Filipović, who became an abstract painter after the war. Filo came with me and my father to the shop and we bought canvases, pigment, some plaster, cement, and lots of different things. We went home and he gave me my first painting lesson, which I will never forget for the rest of my life. First of all, he cut the canvas and placed it on the floor. Then, he threw some glue on top and then some white paint and then yellow pigment and lots of red pigment. Then he put some cement on the back and began to pour gasoline all over the place. This was a really important lesson. I then waited a long, long time until everything dried before hanging Filo’s sunset on a nail on my bedroom wall. This was around August time and so I went on summer holidays with my parents. When we returned a few weeks later, the light was hitting the canvas so that all of the glue, cement, and pigments melted away and left behind only a pile of dust on the floor. Nothing was left apart from its memory."
