["https://www.rightclicksave.com/article/can-web3-automate-equity"]
title = "Can Web3 Automate Equity?"
description = "Sparrow Read, Matt Kane, and Judy Mam share what makes The Platform a different kind of NFT marketplace"
full_description = "Sparrow Read: As I progressed through the NFT space as an artist, I found limitations on all of the platforms, which failed to explore the possibilities of what NFTs could be. Over the last year of the hype cycle, new platforms were coming online that were really just cookie-cutter marketplaces replicating what had been formulated back in 2017 with the likes of Dada and CryptoKitties. Matt and I were considering what defined the NFT, and he suggested that the single image isn’t the entire finished piece, but in fact the artwork comprises the layers upon layers of text that is written about it, as well as everything that went into making the work. We concluded that that’s what the NFT should really be. That conclusion then led to a conversation with Judy, who relayed that most NFT books so far have been either PDFs, EPUBs, or else simply text attached to a token. In Web3, anyone can see an image, but a token defines who owns the image. That digital ownership is the true innovation. Applying that to books, we did not want to token-gate them because these stories should be as freely available as artworks are to view. ‍Matt Kane: I’ve been lucky to have Sparrow to speak to for the past several years, notably after June 2021, when I had work in Sotheby’s first NFT sale, “Natively Digital.” For Meules after Claude Monet (2021), I wanted to create an NFT that was an archive of context for the artwork. So it included all of the layers, including a GLV [low-resolution video] file. I also started a big Twitter thread about what the future of NFTs should be in terms of providing context for everything, not simply artwork. One of the issues for me as an artist is that I was never making art for a market. For nearly a decade, I wasn’t bringing art to market, but I was making art. So I’ve always found it important to archive my work. And because I work with code, there’s also always more than a single image. I’m glad that Sparrow is here to question things and push forth in this direction because NFTs are more than merely JPEGs. There’s so much more rigorous activity happening in terms of what is being tokenized — it’s infinitely more expansive."
