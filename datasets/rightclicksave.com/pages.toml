["https://rightclicksave.com/article/the-true-value-of-tokens-interview-rachel-odwyer"]
title = "The True Value of Tokens"
description = "Rachel O’Dwyer discusses the ancient art of money with Alex Estorick and Ana María Caballero"
full_description = "‍Alex Estorick: In recent years, NFTs (non-fungible-tokens) have come to prominence alongside voting tokens. Why are tokens so important all of a sudden? Has something fundamental changed or simply the language used?‍ Rachel O’Dwyer: Tokens have always ghosted the real economy. Before blockchain or Bitcoin or any of the experiments in money post-2008, we had tokens that worked in various guises. By “tokens” I mean exchange media that are both more and less than state-backed money. They are “less” than money because while money is, at least in theory, fungible — one euro is the same as any other — tokens come with strings attached; they can usually only be spent by certain people or redeemed for certain goods or in certain places or if certain conditions have been met. Take, for example, the beer tokens used in student union bars that don’t have an alcohol license. There are multiple historical examples of these tokens. There were special tokens for married women who didn’t have access to their own money. These women got by through store accounts or postal orders or invisible dollars. Similarly there were relief vouchers and food stamps and alms for the poor because cash was (and still is) seen as a dangerous form of relief for the underprivileged. In the past, there were special tokens that were designed to exploit workers, not just through the wage relation but also at the point of redemption — employers paid workers in tokens called “scrip” that could only be redeemed in a company store at a price set by the employer. If that sounds arcane, today Amazon pays its Mechanical Turk workers outside the US and more recently in India in Amazon gift balances that are tied to the workers’ identity and are non-transferable. Tokens are also “more” than money. They name an exchange value but they are also used to brag and flex and troll, control, communicate, survey, and much more. There were multiple example of tokens in Greek and Roman antiquity that were money-like but which also blended the functions of exchange and transaction with judicial, administrative, and public functions: tokens for accounting purposes; tokens as shares and ownership rights; tokens to record debts and credits; tokens to confer access to secret societies; tokens for transparency; tokens for voting rights; tokens for games; tokens as prestige and bragging rights."
year_published = 2025
