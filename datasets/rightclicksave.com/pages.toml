["https://rightclicksave.com/article/the-interview-kim-asendorf-generative-art-digital-art"]
title = "The Interview | Kim Asendorf"
description = "The artist discusses how digital art has evolved from Web2 to Web3 with River Davis"
full_description = "Kim Asendorf is a German visual artist who employs a fusion of experimental and conceptual strategies to craft abstract animations, images, and sculptures. Through the use of automations and algorithms, he engineers natively digital aesthetics to forge an immersive artistic experience. Asendorf is renowned as the creator of a pixel-sorting algorithm that, thanks to its open source nature, has been used by thousands of artists and designers since 2012. He has exhibited globally, including at Transmediale, Berlin; ZKM Karlsruhe; Kunstmuseum Gelsenkirchen; Edith-Russ-Haus für Medienkunst, Oldenburg; NCCA Yekaterinburg; Eyebeam, New York, Netherlands Media Art Institute (NIMk); and the Overlapping Biennial, Bucharest. He has received honorary mentions and created controversial discussions on major blogs, art magazines, and television. ‍River Davis (Dr. Banner) is an American multimedia artist who explores social consciousness in post-internet culture through novel consumer engagement systems. In 2023, he was featured in eight group exhibitions and holds the distinction of being the youngest artist to produce work for the Venet Foundation’s annual exhibition. River’s participatory installations fuse emergent technologies and conditional systems with historical mediums, inviting his audiences to co-create with him."
