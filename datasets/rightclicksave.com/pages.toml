["https://rightclicksave.com/article/an-interview-with-tyler-hobbs-part-2"]
title = "An Interview with Tyler Hobbs | Part 2"
description = "The artist addresses the growing public interest in generative art"
full_description = "Jason Bailey: Something I often hear is: “This generative art looks like wallpaper, how is this not just design?” How do you respond to those types of comments? ‍Tyler Hobbs: I think it’s totally fair to link it to wallpaper. Here’s why: Wallpaper is a mechanistic, process-oriented product — as is almost everything around us. To me, that’s even more of a compelling reason for artists to think systematically and in terms of process. It also poses the question: How can we make more interesting systems and processes so that we don’t just have these same boring, repetitive things going on all around us, especially in software, where the costs of doing something unique every time are low? ‍JB: Essentially, everything around us is a system. Generative art acknowledges that and celebrates it in a way that maybe other traditional art forms simply haven’t yet. ‍TH: Yeah, the universe is generative, and everything that’s happening around us is a result of these processes, right? They might be really complex processes — weather systems and geological systems — guided by the laws of physics and chemistry, but nature is process driven. Thinking in terms of systems and processes is a really beautiful way to analyze and appreciate the world around us. As generative artists, we talk a lot about emergence. But earth is one hell of an emergent artifact in the universe. So I feel incredibly lucky to get to experience it. ‍JB: How much does the display of your work matter to you? I’m guessing the majority of people consume your work on their laptop or their phone. How do you feel about that as an artist? What level of control do you want to have? ‍TH: The format of display and the context of display are crucial for our work. It’s a little bit tough as a digital artist that I lose a lot of control over how people are viewing the work. As you mentioned, probably quite a few people are seeing my work on a cell phone screen. And that’s such a difficult environment because, first of all, the image is tiny, with limited resolution, and the color accuracy might not be great. Sometimes I try to take that into account when designing the work, to make it robust at smaller scales. But as the artist, anytime that I can have more control, to guarantee a better viewing experience, I always want to take that."
