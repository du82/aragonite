["https://www.rightclicksave.com/article/curating-in-postreality"]
title = "Curating in Postreality"
description = "Jesse Damiani lays out a bold vision for art in expanding fields"
full_description = "As a species, we tell stories to make sense of the realities we inhabit. The formal role of “curator” is a historically recent convention, one often troubled by multi- and interdisciplinary practitioners. But in the abstract, it’s the curator’s job to identify, connect, and clarify the thoughts that “think thoughts” in a given reality and weave them into broader narrative coherence. This has never been a simple endeavor, but there are unique challenges, as well as opportunities, in a reality saturated with digital capabilities. What follows is an attempt to frame the contemporary reality paradigm, to examine how the curatorial act remains integral to cultural production, and to highlight artistic efforts that embody this contemporary condition. ‍The most common misconceptions about Postreality are that it refers to the breakdown of fact as a result of “fake news”; the proliferation of mis- and disinformation on social media; or the rise of AI-doctored “synthetic media” like deepfakes. These are all symptomatic of Postreality, but not actually how I mean it. I use Postreality as a historical marker and framework to make sense of our contemporary reality paradigm. In my view, this reality paradigm began to take shape in the mid-1900s, and is now coming into clearer view. The word “reality” can mean different things depending on the speaker and context, so I’ll take a moment to clarify my assumptions: ‍Reality is often presumed to be the objective structure of the universe, but this is incorrect. There is an ongoing debate in the sciences about whether an objective universe exists at all, but even if it does, our experience of it is heavily filtered by the limitations of our minds and senses. Even those who believe we experience anything resembling an “objective” reality must concede that it is a vanishingly thin slice. Cognitive psychologist Donald D. Hoffman has used simulations-based research to demonstrate that human beings have evolved specifically not to perceive objective reality, but rather to project mental models onto it in ways that are conducive to our survival as a species."
year_published = 2025
