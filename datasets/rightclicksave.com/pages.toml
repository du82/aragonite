["https://rightclicksave.com/article/artists-against-algorithms"]
title = "Artists Against Algorithms"
description = "Gretchen Andrew and WAAMBAT tell Cody Edison how they are adapting their SEO strategies to suit Web3"
full_description = "Cody Edison: How have our expectations of the Internet changed in the years since Y2K and, especially, since the loss of net neutrality? Is Web3 changing those expectations?‍ WAAMBAT: I uploaded my first video to YouTube in 2008 after a room full of fellow art students suggested I put my videos on the platform. A couple million views later, one of my early experiments ended up being shown at the Guggenheim Museum as part of YouTube Play. Together, the museum curators had gone through 23,000 video submissions, and mine had made it to the shortlist. Originally devised as a “biennial,” mysteriously, the event never happened again. At the time, YouTube’s algorithm was evolving, with large corporations moving onto the platform. As a result, its prospects as a playground for experimental art quickly became a thing of the past — net neutrality had faded away. In turn, YouTube began to resemble low-production broadcast television while my unusual style led to my being buried by the algorithm. As the Web2 walls closed in, I left the platform to become a digital nomad. Video art has always had a hard time finding a place to live, and while blockchain makes for a compelling alternative to centralized control, the truth is that it remains an enticing mystery. This is part of the beauty that comes with starting over. We’re currently terraforming a whole new territory. ‍Gretchen Andrew: It is hard to believe now that in 1999 there was mass concern about the breadth of control technology had over our lives. I am nostalgic for that. When Y2K didn’t end the world we were told that our worries about centralized controls of technology were unfounded. At the time, we were embarrassed by our concern. When net neutrality was still an aspiration, society wasn’t worried about its absence. The same was true for privacy, especially in America. A quarter of a century later, we are trying to get people to pay attention. Ultimately, I think the forces of capitalism and convenience will be too strong for Web3 to not be co-opted into existing power structures run by corporations and governments. But that doesn’t mean freedom isn’t worth fighting for. ‍"
year_published = 2025
