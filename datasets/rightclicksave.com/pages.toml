["https://www.rightclicksave.com/article/ciphrd-on-fxhash"]
title = "CIPHRD on FXHASH"
description = "After integrating with ClubNFT, fxhash’s founder speaks with Fffflood about the need to safeguard generative art"
full_description = "Fffflood: Since we met at Proof of People, fxhash has released a number of new features, including a partnership with ClubNFT. What made you decide to integrate fxhash with ClubNFT? ‍Ciphrd: In the physical world, museums and galleries have a broad array of protective tools at their disposal to ensure the longevity of artworks. Special glass, climate control, LED lighting, and art restorers all play a role in the preservation process. While digital artworks may not face the same types of risks as physical pieces, they are prone to a unique set of dangers that threaten their longevity. ‍C: The decision to implement IPFS was based on the belief that the creative process should have as few limits as possible. Right now, on-chain storage is limiting in the extreme and drastically restricts the assets artists can work with. It is also highly cost-prohibitive. Ideally, you want the lowest layers in a Web3 system to have the lowest barriers to entry because anything built on top of those layers will also naturally inherit their barriers. That’s why, for a strong combination of accessibility and immutability, we decided to start with our current hybrid architecture — consisting of Tezos on-chain and IPFS components. Our next generation of contracts will give artists the ability to decide between storing their code off chain or on chain. We don’t want artists to need to seek grants just to publish generative tokens, nor do we want to limit their range of expression. ‍F: It’s exciting that fxhash has grown its collector base so extensively over the past year. Many collectors dabbling in Tezos for the first time have migrated from Ethereum. How important is it for you that fxhash and the wider community of collectors are blockchain agnostic? ‍ C: The way fxhash is growing is amazing and shows how much people resonate not only with artistic freedom but community-led curatorial freedom as well. That openness has enabled entirely new and overlapping relations between what used to be pretty strictly-defined roles — artist, curator, and collector. Now you see artist-collectors and collector-curators among many emerging assemblages, all cohabiting in this open space we call fxhash."
