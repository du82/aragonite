["https://rightclicksave.com/article/what-the-punk"]
title = "What the Punk!"
description = "Jason Bailey speaks with the team behind the new CryptoPunks documentary"
full_description = "With several years having passed since both the inception of the CryptoArt movement and, later, the speculative explosion in interest for NFTs, efforts are now underway to understand, contextualize, and document what happened for future generations. Earlier this year, we published our contribution — a collection of essays from RightClickSave, representing a wide variety of voices from across the community gathered over several years. Additionally, we saw the release of OnNFTs, an extensive (and expensive) book by respected publisher Taschen, positioned as an official catalog of the movement. In the world of CryptoArt, which prioritizes radical inclusion and decentralization, there won't be just one official history. Instead, we can expect to see numerous books, documentaries, and oral histories. These accounts will showcase the diversity of the individuals who contributed to the early stages of the CryptoArt movement. Additionally, they will highlight the significant disparities in outcomes for participants, especially those who joined during later, more speculative phases. What The Punk! is a fresh documentary directed by Hervé Martin-Delpierre and co-produced by Darjeeling, ARTE, and the OG CryptoArt collector TokenAngels. The film seeks to capture the essence of CryptoArt by spotlighting the community and the boom/bust market that emerged around CryptoPunks. It balances this narrative with the personal journey of an artist named Robness, a real-life crypto punk deeply involved in cryptocurrency and CryptoArt since the movement's inception. I recently had a discussion with Hervé and TokenAngels about their film ahead of its premiere at Digital Art Mile during Art Basel. Hervé Martin-Delpierre: Well, it's quite a story. I met Marc Lustigman in Sweden about four years ago, who introduced me to NFTs. Honestly, I was taken aback because I didn't know much about NFTs at the time. Marc Lustigman suggested making a documentary about them, which piqued my interest. Exploring this new world felt like diving into a new artistic revolution. As I delved deeper, I noticed similarities with past projects, like when I made a film about Daft Punk and electronic music. Initially, people dismissed it as not real music, similar to the skepticism around digital art, especially CryptoPunks. It also reminded me of when I explored manga and people said it was simple and insignificant. It's a recurring theme — new art forms often face criticism before being recognized."
