["https://rightclicksave.com/article/holly-herndon-mat-dryhurst-tyler-hobbs-liquid-images-interview-generative-art-ai-long-form"]
title = "Herndon, Dryhurst, and Hobbs on Liquid Images"
description = "Three of the world’s leading artists discuss generative art and AI with Alex Estorick"
full_description = "This conversation is excerpted from a longer interview to be featured in Matthias Bruhn and Katharina Weinstock (eds.), Generativität, Munich, 2025. Further contributions by Matthias Bruhn, Yannick Fritz, Adam Harvey, Charlotte Kent, Moritz Konrad, Roland Meyer and Katharina Weinstock. The project is funded by DFG: Deutsche Forschungsgemeinschaft, the Priority Program “The Digital Image” and HfG Karlsruhe University of Arts and Design. The book will be available through Open Access. Find it here in March 2025.‍ ‍Holly Herndon and Mat Dryhurst are artists renowned for their pioneering work in machine learning, software, and music. They develop their own technology and protocols for living with the technology of others, often with a focus on the ownership and augmentation of digital identity and voice. These technical systems not only facilitate expansive artworks across media, but are proposed as artworks unto themselves. They were awarded the 2022 Ars Electronica STARTS prize for digital art. They have sat on ArtReview’s Power 100 list since 2021. Holly holds a PhD in Computer Music from Stanford CCRMA. Mathew is largely self-taught. They have held faculty positions at NYU, the European Graduate School, Strelka Institute, and the Antikythera program at the Berggruen Institute. They publish their studio research openly through the Interdependence podcast, and co-founded Spawning, an organization building AI models on consenting data. Their critically acclaimed musical works are released through 4AD and RVNG Intl. ‍Tyler Hobbs is a visual artist from Austin, Texas who works primarily with algorithms, plotters, and paint. Hobbs’ artwork focuses on computational aesthetics, how they are shaped by the biases of modern computer hardware and software, and how they relate to and interact with the natural world around us. Hobbs’ Fidenza (2021) series profoundly impacted the generative art landscape, reshaping perceptions of “long-form” generative art. Hobbs’ two most recent solo exhibitions were at Pace Gallery in New York and Unit in London. His work is in the collections of multiple prominent institutions including the Los Angeles County Museum of Art and the San Francisco Museum of Modern Art."
