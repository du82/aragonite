["https://www.rightclicksave.com/article/a-longer-history-of-generative-art"]
title = "A Longer History of Generative Art"
description = "One of the world’s leading scholars of computer art, Nick Lambert, traces a history of generative aesthetics up to NFTs"
full_description = "To properly understand the importance of NFTs as a means of transacting digital works of art, it is useful to review the origins of generative art and consider how its most radical feature was also the greatest barrier to its wider acceptance by the art world. The meteoric success of NFTs has provided generative art with much needed visibility in the art world, but its history spans more than six decades and its evolution has been largely discrete and separate. Growing up in the 1980s, my introduction to computer imagery came through the Commodore Amiga which was first released in 1985. As part of the marketing campaign, the company commissioned Andy Warhol to participate in the launch of the Amiga A1000 on 23 July, 1985 at New York’s Lincoln Center. Using a video camera linked to a digitizer, he produced a recognizably Warholian rendition of Debbie Harry to demonstrate the new computer’s multimedia and creative potential. Six months later, interviewers from Amiga World magazine found him most enthusiastic about the computer’s potential as an artistic tool and he had some interesting thoughts about its role in visual art: From the outset, both the interviewers and Warhol grasped the special problem of digitally-generated art: it is inherently duplicable. Anything created on a computer — whether an image, sound, animation, or interactive experience — comprises a sequence of code that can be copied exactly. Unlike analog media where the original is inscribed into a physical material and copies are iterative, digital copies lose nothing between generations.² In his seminal book, The Reconfigured Eye (1992), William J. Mitchell considered digital images to be “problematic” since they lack negatives or any other unique instance. “An image file may be copied endlessly, and the copy is distinguishable from the original only by its date since there is no loss of quality.” He also pointed out that digital images synthesized from geometric data have no obvious original due to the range of possible renderings of the same data. “Is the rendering procedure really the original”?³"
year_published = 2025
