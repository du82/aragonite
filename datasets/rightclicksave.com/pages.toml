["https://rightclicksave.com/article/is-ai-art-sustainable"]
title = "Is AI Art Sustainable?"
description = "A trio of specialists discusses how artists can respond to the environmental cost of generative AI with Diane Drubay"
full_description = "‍Diane Drubay: AI has become integral to many artists’ practices, whether to generate visuals and soundscapes or else to explore text and code. Over the past decade, artists such as Memo Akten, Sougwen Chung, and Mario Klingemann have all explored new forms of co-creation with machines. As AI rapidly reshapes artistic expression, what deeper insights or challenges is it introducing into your creative workflows?‍ Sasha Stiles: Artists today use AI in incredible ways, from visual explorations to sonic experiments to literary endeavors; from generative text to writing code. At the heart of it all is the idea of co-creation with a system that augments our human capacities, which, of course, has deep roots in human culture; automata are present in ancient myth, and artists have been exploring the power and meaning of algorithmic expression for ages. Artists have always been early adopters of such seismic technologies because inventions of this order of magnitude — literacy, linear perspective, the printing press, cameras, the personal computer, the internet — evolve consciousness, reshape self-awareness, our perception of the world around us, and our place in it. Since I was a student, my poetry has reflected on language in such contexts, and on the relationship between humans and our technological offspring. I started integrating natural language processing into my poetry in 2018, using large language models like GPT-2 and GPT-3 that I fine-tuned on my own work to generate text, serving alternately as co-author, editor, and muse. It has continuously challenged my understanding of language itself, of imagination and originality, forcing me to reconsider what I thought I knew about inspiration and the creative process, and taking my poetry into uncharted territory. ‍DD: Artists have always engaged with emerging technologies, but AI presents unique challenges and polarizes opinion. Is the art world moving toward or away from AI?‍ Alistair Alexander: The art world appears trapped in the “reality distortion field” around AI, responding to it either as a genuinely transcendent new technology with limitless potential or as one that presents existential risk — in other words, in precisely the same terms as the tech industry is presenting it. I feel that the art world needs to define its own terms for engaging with new technologies. Generally, it looks as if the environmental impact is not fully understood or acknowledged as a critical factor when considering AI, or any other technology for that matter. In our current moment, we need to consider the ecological impact of everything we do before pretty much everything else."
