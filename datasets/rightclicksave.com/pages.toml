["https://www.rightclicksave.com/article/are-smart-contracts-real-contracts"]
title = "Are Smart Contracts Real Contracts?"
description = "Alana Kushnir traces a history of contract automation, assessing the enforceability of smart contracts in the age of NFTs"
full_description = "Alongside the rise of NFTs, smart contracts have received quite the fanfare over the past year. But, in truth, they’re a pretty old-school phenomenon. In fact, the first smart contracts had little to do with NFTs, blockchain, or the internet, and more to do with the humble vending machine. The first fully automated, coin-operated vending machines were introduced around 150 years ago to London railway stations and post offices, offering merchandise for sale in a convenient manner. When the requisite amount of money was inserted into the machine, the product — perhaps a postcard or postage stamp — would be dispensed automatically and a contract of sale automatically executed between seller and purchaser. Though the range of products available for purchase through vending machines has since evolved to encompass pretty much any commodity, from credit vouchers to NFTs, the automation of sales transactions continues today. In 1996, more than a decade before the release of the original blockchain white paper by Satoshi Nakamoto, the computer scientist, cryptographer, and legal scholar Nick Szabo published an article in which he first used the phrase “smart contract.” At the time, he was completing a graduate degree in Law from The George Washington University Law School. In the text, Szabo defined a smart contract as “a set of promises, specified in digital form, including protocols within which the parties perform on these promises.” And he expressly linked smart contracts to vending machines, describing them as the “primitive ancestor of smart contracts.” But Szabo pushed the automation concept even further, suggesting that “[s]mart contracts [could] go beyond the vending machine in proposing to embed contracts in all sorts of property that is valuable and controlled by digital means.” In this way, he saw the potential of smart contracts to address the challenges of enforcing legally binding contracts. He also questioned the requirement for a judicial system to decide what physical steps are to be taken by an enforcement agency, if contractual arrangements were readily verifiable. For Szabo, contractual enforcement could become proactive, rather than reactive, if smart contracts were “embedded in the world.”"
year_published = 2025
