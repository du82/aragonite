["https://www.rightclicksave.com/article/anna-lucia-and-the-quilters-of-gees-bend-interview"]
title = "Anna Lucia and the Quilters of Gee’s Bend"
description = "As generative art collides with quilting, the artists discuss their masterpiece of co-creation with ARSNL"
full_description = "‍Matthew Dunnerstick: Anna Lucia, when was the first time you heard about the quilters of Gee’s Bend? ‍Anna Lucia: When I first saw images of quilts from Gee’s Bend a year and a half ago, I was immediately captivated by their vibrant colors, bold patterns, and expressive compositions. Robert Hill, the co-producer on the project and an Alabama native, told me about them after learning about my project, Loom (2021). At the time, I didn’t know that I would end up diving so deep into the patterns of the quilts. AL: You know, as artists get together, it is always striking how quickly the conversation turns to technique, especially among generative artists. The same was true as I listened to the quilters talking about different types of stitching, how colors are chosen, where fabrics are found, etc. What I found interesting was that although the quilts of Gee’s Bend share a recognizable style, each story and approach differed. ‍ AL: I’m not a quilter but I do know my way around a sewing machine. My mother taught me how to sew when I was around ten years old, and I studied fashion design for a year before going into engineering. I will make a stab at quilting an output from Generations. ‍MD: Your Art Blocks project, Loom, was inspired by female textile artists of the Bauhaus. What is it about the art of textile production that interests you? ‍ AL: I’m not the only artist working with code who makes connections to textile art. Besides the historical link between the earliest automated looms and the first computers, there seems to be an intuitive connection between the two media. Earlier computer artists like Charlotte Johannesson and Peter Struycken made pixelated tapestries, while current colleagues like Andreas Rau and Kristen Roos have also made the link between computer systems and textiles. What set me on my own path was reading about the female designers of the Bauhaus movement. Women studying at the school were often nudged into the weaving workshop because other crafts seemed inappropriate for women at the time. This struck a chord with me because, almost a century later, I could relate to their story."
