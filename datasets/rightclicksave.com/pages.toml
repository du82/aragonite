["https://www.rightclicksave.com/article/what-can-web1-teach-web3"]
title = "What Can Web1 Teach Web3?"
description = "Virginia Valenzuela considers the legacy of Internet art for the NFT space"
full_description = "Consuming art and media in Web3, one becomes accustomed to ever-advancing technology, to wondering what more is to come. Modern computer graphics can recreate a virtual doppelgänger of our physical reality; artificial intelligence can make art, write poetry, and feel; and digital art is sold for astronomical sums on marketplaces built on blockchains. Everything Web3 seems to move at lightning speed, iterating monthly, such that what was once impossible seems tangible, just before it is rendered irrelevant. But among the surfeit of 3D sculpture, Photoshop brushwork, and animated GIFs, one also encounters new forms of pixel art, animation, and geometric continua reminiscent of long-lost screensavers from 1999. For those working in Web3, it can feel like a moment of calm within a cryptographic storm. Late at night, scouring platforms like Hic et Nunc or Teia, one grows particularly nostalgic. With their solid backdrops and dancing pixels, rotating cubes, and glitch motifs, not to mention color palettes à la Windows 98, works like ynom* (2022) by p1xelfool or CAN I? (2022) by Kaspar recapture a moment before the wholesale commodification of the Web. Maybe it’s the lo-fi aesthetics or the buzz of underexplored technology, but as a child of the 1990s, I couldn’t have imagined what the computer and its close companion, the Internet, were truly capable of. The Internet of the ’90s was a true Wild West. No communications system had ever been so efficient, so emotive, so ubiquitous. It combined the written word with a new aesthetic, one whose familiar images existed on unfamiliar digital terrain. Web pages, emails, and chat rooms were the new books, letters, and parlors — emerging slowly, and then all at once. With the advent of the personal computer, the Internet turned progressively from an instrument demanding high-level clearance into an escape from the daily “reality” of the home, promptly being adopted as a tool by that most inquisitive of communities: artists."
