["https://rightclicksave.com/article/the-edges-of-code-iskra-velitchkova-zach-lieberman-interview-generative-art-feral-file"]
title = "The Edges of Code"
description = "Iskra Velitchkova and Zach Lieberman discuss the art of generative collaboration"
full_description = "‍Alex Estorick: One thread running through recent conversations around generative art is the notion of co-creation. Did the results of your collaboration surprise you at all? ‍Iskra Velitchkova: Fxhash was organizing this huge celebration after one year of activity, and they wrote asking me to participate. In 2022, I was in this hurricane of projects, and I had to decline because it was impossible. There is something interesting in how we built the whole thing. I have a very personal style, and I’m very connected with what I’ve been doing. At the same time, I’m amazed by Zach’s light projections — how he plays with shaders, light, and movement. I’ve never done that before, so it was very challenging. At the time, my practice was very focused on playing with lines, their width, and how that can create shades and volumes. That challenge was achieved by playing with color. If I use my technique, I iterate a lot with the background and with lines. For me, it was more a conceptual [question] of how I could use my tools to get closer to his style. ‍Zach Lieberman: It was fun that we stumbled into that construction. We really wanted to avoid having a bit of one style and a bit of another but rather use this as an opportunity to get to know each other’s work. That is a gift we gave each other. It’s a challenge as an artist to understand how other people see your work, which is the one superpower I wish I had or that I wish I could give to other artists — to see with someone else’s eyes how they see your work. In the end, this notion of me as me, me as you, me as you as me, proved really interesting and gave us a lot of time to meditate. I spent a lot of time looking at Iskra’s work and imagining how I would create that using my own approach. I was playing with lines because Iskra’s work is so much about lines on top of lines on top of lines, and I remember sketching and feeling that I was getting nowhere. ‍AE: The subject of the horizon is important in a formal sense, as a unifier, but it’s also important from a conceptual standpoint. I tend to think of generative art as a born-digital project. On the other hand, I’m conscious that the most high-resolution output is still a physical print. Did this project change how you think about the materiality of code — sitting on the edge of the physical and the digital?"
year_published = 2025
