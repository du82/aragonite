["https://www.rightclicksave.com/article/poetry-at-the-edge-of-the-human"]
title = "Poetry at the Edge of the Human"
description = "RCS speaks to Ana Maria Caballero, Kalen Iwamoto, and Sasha Stiles of theVERSEverse, alongside data poet Ross Goodwin"
full_description = "RCS: This week, theVERSEverse is hosting multiple events and a live poetry reading. How does audience participation change your poetry? ‍Ana Maria Caballero: At “Proof of People,” theVERSEverse will be presenting live AI poetic minting via our autonomous poet VERSA, as well as a Listening Room, workshop, and poetry reading. All have a strong participatory component to them. I wouldn’t say this participation changed how we set out to design these installations. Rather, it inspired them. The Listening Room is particularly interesting because it offers a poetic interaction that is both participatory and private. It’s a place where we hope to connect people to poetry in a way that they might not have done so in their lives — via sound alone. There will be no texts, no visual stimuli to accompany the looped, widely diverse poems in The Listening Room. Each audio poem is recited by its author, offering the audience the opportunity to interact with a broad spectrum of voices. It’s a rare gift to listen, without any other form of stimulation, and allow the words of another to become our own. Poetry generates visceral introspection, which grows in importance in our increasingly outward-facing worlds. ‍Sasha Stiles: All poetry is participatory and immersive. The origins of literature are rooted in oral tradition and performance, in the dynamic between a voice and an ear, and poems are powered by sounds and tone and rhythm and rhyme and volume and silence, and by how they are received and transmitted. Live readings remind me of how important it is for poetry to live in the body and the mouth and the breath and the air, even as my ongoing work with AI natural language processing challenges my own assumptions about embodied cognition and creativity. It’s also been interesting to see how audiences respond to media-rich elements — augmented word poetry. I’m always thinking about poetry screenings, poetry performances, and immersive poetry installations rather than readings, which is why it’s especially exciting to have experiential and interactive poetry at “Proof of People.” Having shifted from oral to written language, we humans now seem to be moving toward a metaversal, media-rich literature that merges the visual with the vocal, as well as the virtual, the written, the performative, the oral, the electronic, and the aesthetic, manifesting transhuman emotion and experience in novel yet deeply familiar ways. I’m very grateful to get to explore that via theVERSEverse and elsewhere.‍"
