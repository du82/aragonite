["https://rightclicksave.com/article/cure3-unites-the-art-world-to-cure-parkinsons-digital-generative-art"]
title = "Cure³ Unites the Art World to Cure Parkinson’s"
description = "The latest edition of the iconic fundraising exhibition at Bonhams puts digital artists center stage"
full_description = "Emily Edelman: I feel lucky to be able to contribute my hard work to important research. Cure³ is a meaningful cause to me because it honors and elevates art as an asset powerful enough to create value toward good. I’m proud to participate! ‍ Auriea Harvey & Michaël Samyn: For quite a while now, Michael has had a desire to create generative art based on historical ornamentation. While Auriea, despite having minted many NFT artworks and in spite of multiple invitations, has never gotten around to long-form generative art. That Cure³ supports the search for a cure for a frustratingly debilitating disease only made it better for us. Participating in such a project gives us an opportunity to practice the love of our neighbor and care for the sick, for which we are very grateful as Christians. As a child, Michael witnessed the effects of Parkinson’s on an elderly colleague of his father’s. The periods of uncontrollable shaking interspersed with virtual paralysis made a deep impression on his memory. So, yes: let’s cure this awful thing!‍ Licia He: Artmaking is the most magical and rewarding way to spend my time. I see each of my works as part of my life. Creating art for a good cause like Cure³ is always empowering for me. Besides creating positive energy and connections, such projects also remind me of the power of art — that these pieces of my life could bring a positive impact to people in need. ‍Aleksandra Jovanić: We live in a time when constant reminders are necessary to guide our focus toward important causes. I feel grateful for the opportunity to take part in this exhibition, and in the process highlight and support scientific research into Parkinson’s disease. Hopefully, there will be more initiatives like this one, ensuring that progress continues for the benefit of those affected and future generations.‍ Kitel: First of all, this is a tremendous honor for me. Over the past few years, I’ve been amazed at the twists and turns life can bring to an ordinary person. Things that once seemed completely impossible or highly unlikely have now become a reality. Sometimes these twists are joyful, sometimes painful, but if someone had told me a few years ago that what started as a hobby or mere curiosity would lead to me participating in a charity fundraiser for the fight against Parkinson’s disease, I would have hardly believed it. What makes Cure³ particularly meaningful to me is that, perhaps naively, it allows me, albeit indirectly, to feel like a doctor or scientist, helping those in need.‍"
