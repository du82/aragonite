["https://www.rightclicksave.com/article/an-interview-with-vera-molnar"]
title = "An Interview with Vera Molnar"
description = "The pioneering artist speaks to Zsofi Valyi-Nagy about NFTs, generative art, and the machine imaginaire"
full_description = "‍ZSVN: It launched earlier this year, and it’s online only. So there’s no print version of it. But what it means is… ‍ZSVN: The magazine recently ran interviews with Frieder Nake and Herbert W. Franke, who passed away recently. I’m sure you heard? ‍ZSVN: What does the word “generative” mean to you, if anything? And do you think it accurately describes your work? ‍VM: First of all, I don’t know what “generative” means. It’s an English word, isn’t it? What does it mean? ‍ZSVN: It depends on who you ask, of course. But it refers to art made using an algorithm. So, it can refer to artists working with computers, but not necessarily. So let’s say that you can take two different approaches to making art. One starting point is [to say]: “I’m a sanctified genius, I know everything, and everything I make is genius.” Picasso said, “Je ne cherche pas, je trouve” (“I don’t seek, I find”). The other approach is the total opposite of this. It’s a lot more modest: “I would like to understand, to grasp.” And this [approach] very quickly turns to algorithms. One of my first works made using an algorithm was for the cover of a collection of works by the composer, Pierre Barbaud. It was still handmade, of course, [with the] machine imaginaire. ‍ ‍VM: Instead of starting from “I am a genius and every work I make is a masterpiece,” I instead come up with a system with which […] I can check what changes were made and what that [change] provoked in me. It’s an experimental method, [taken] step by step. The computer is fantastic for this purpose. The computer isn’t dumb. So I called [the process] machine imaginaire.‍ So I wake up every morning to the thought: et si? (“What if?”) And I could only imagine this [kind of approach] with algorithms, or laws, or rules of the game. Naturally, the computer was a blessing for this, but even before the computer you could start thinking about, or with [algorithms]. So I guess my mind was just always set on that."
