["https://www.rightclicksave.com/article/the-generations-of-generative-art-interview-gazelli-art-house"]
title = "The Generations of Generative Art"
description = "A groundbreaking exhibition uncovers new histories of human-machine interaction"
full_description = "‍RCS: What can you tell us about the work you’re exhibiting in “GEN/GEN: Generative Generations”? ‍Darien Brito: My project is called Laterals, which refers to the various rotations given to the cuboids that conform to the scenes. I constrained myself to use fundamental shapes in computer graphics, such as lines, spheres, and cubes, to try and evoke a deliberate sense of structure despite the heavily aleatoric nature of the underlying algorithm. The organization of the objects in the scene originates from different noise distributions. I chose an isometric projection to create a certain ambiguity in depth, which allows for interesting dynamics of color, light, and shadow. Due to the short time I had to complete the project, I decided to pre-curate outputs based on minting numbers, which warrant coherence over the 50 available editions. ‍ Sougwen Chung: For “GEN/GEN” I'm sharing process artifacts from my collaborative research with the fourth generation of my Drawing Operations project — focused on biofeedback and digitized drawing memory. The work was created alongside the D.O.U.G._4 system, which I designed to understand the possibilities of enacting robotic movement with my biosignals. The system works via a camera attached to the end of the robotic arm, which relays my hand position as data. As I make marks on canvas, D.O.U.G._4 responds based on real-time interpretations of my brainwaves, to which I then respond. This deceptively simple process creates a feedback loop of overlapping paint strokes that result in a visual outcome. ‍Ernest Edmonds: I started using software to make art in 1968. My work in “GEN/GEN” picked it up in 1985 when I first showed an AI-based generative movie, Fragment (1984-85). Another movie in black and white was Jasper (1988), owing to the unreliability of color monitors at that time. The painting, Jasper B (1988), was one of my color experiments preparing for improved monitors. From the start, I was interested in interaction and the Shaping Form (2013) included in the show is an example of my interactive generative art, where data from the camera changes the generative rules so that the work evolves. It also shows my generative color systems in action. My recent painting, Dazzle (2019), illustrates the dialogue I conduct between static reflective color and dynamic transmitted color."
