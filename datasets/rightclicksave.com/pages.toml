["https://rightclicksave.com/article/digital-art-mile-at-art-basel"]
title = "The Digital Art Mile at Basel"
description = "The Tickle’s Johnny Dean Mann with a First-Hand Report on Art Basel 2024"
full_description = "Art Basel 2024 was a narrative of separation, but also of meaningful progress. Digital art, once again, existed awkwardly at the periphery, for the most part outside the grand halls of the Messe, but a refiguring of the genre within the big picture of the art world was encouraging. In previous years, Tezos had facilitated the visibility of a few notable digital artists, initially a showcase of the leading lights of Hic et Nunc (RIP) and, in subsequent years, a display of generative artistry from fx(hash). The location of these booths, past the onerous security barrier of the main entrance, was a statement of intent among an art world not historically too kind or even aware of the more obscure outposts of the genre. In this context, the absence of a similar presence in 2024’s edition could have been taken as a step back. However, Tezos instead sponsored the first dedicated satellite event during Art Basel — The Digital Art Mile — and, despite being situated downtown a few streets, the presence of the genre was emboldened, showing a maturity in both content and expression. One step back, two steps forward, perhaps. The Tickle traveled to Switzerland to compare the old world with the new. There was always a sense that, despite some encouraging moves towards digital art, acceptance by the organizers of Art Basel, the premier art fair in the world, was pushing back slightly against the inclusion of artists too heavily associated with the notion of NFTs. Digital art’s enthusiasm for the technology — understandably so, given its transformative effect on the genre — was seen as too outwardly associated with pure commerce. This was at the point of NFTs during their worst (publicly perceived) moment of greed, speculation, and environmental damage, so the reaction is perhaps understandable. This is all in addition to the historical ghettoization of digital art, often seen as the lesser cousin of photography and video art. Each Tezos presence at the fair was, of course, entirely separate from the worst excesses of the NFT boom. Their environmental credentials, at the very least, have always been peerless. Each booth was a superb aesthetic experience — a tightly curated expression of the best of Tezos-based art and, subsequently, as its appeal broadened, the mostly generative web3 avant-garde, backed by the expertise and reputation of fx(hash). A wide range of panels complemented the experience, featuring some of the most cerebral practitioners and eloquent voices from both within the space and the traditional art world."
