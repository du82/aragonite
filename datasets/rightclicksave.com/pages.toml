["https://www.rightclicksave.com/article/making-sense-of-the-40b-nft-market"]
title = "Making Sense of the $40B NFT Market"
description = "Brian L. Frye on why NFTs aren’t so novel after all"
full_description = "What if everything we thought we knew about financial markets was wrong? Everyone has always assumed that the value of a share reflects the value of the business it represents. It stands to reason. Why else would anyone value securities? And yet, in 2021, people traded more than $40 billion dollars worth of NFTs. Why? An NFT is literally nothing. When you buy an NFT, you get a unique cryptographic token, with no intrinsic value. Sure, NFTs typically represent nominal “ownership” of a work of digital art. But NFT owners don’t usually “own” the works represented by their NFTs in the conventional sense. NFTs rarely convey copyright, and so most NFT owners don’t really own anything other than their NFT, and whatever meaning people ascribe to it. NFTs are nonsense. Why would anyone pay anything to own what amounts to a cryptographic receipt for a work of digital art that’s available to the public for free, let alone millions of dollars? Sure, there’s a sucker born every minute, but suckers expect the moon, not an IOU. After all, George C. Parker sold the Brooklyn Bridge, not the Hess Triangle. But NFT enthusiasts are delighted to pay millions of dollars for the right to say they “own” an 8-bit sprite or an anthropomorphic ape, even if they can’t do anything with it, other than jazz up their social media profile. It’s bananas. What do they think they’re buying, what are they actually buying, and what does it mean? I don’t know why everyone is so surprised and confused by the emergence of the NFT market or its rapid growth. I’m not. The NFT market is exactly the same as any other financial market. It only seems different because we haven’t rationalized it yet. If the NFT market persists — and there’s no guarantee it will — everyone will eventually take it for granted, just like they do every other financial market. Unless, just maybe, NFTs make people ask what those markets are for, what those markets value, and whether those markets are valuable."
year_published = 2025
