["https://www.rightclicksave.com/article/the-power-of-processing-casey-reas-and-lauren-lee-mccarthy-interview-generative-art"]
title = "The Power of Processing"
description = "Casey Reas and Lauren Lee McCarthy explore the future of social software with Alex Estorick"
full_description = "‍Alex Estorick: Looking around the world of digital art, what becomes clear is that the politics of a particular community are encoded in its language. Recently, Alida Sun drew attention to Processing for its transparent open-source community and p5.js for its ethics. Casey, could you perhaps say something about how the Processing community emerged all those years ago?‍ Casey Reas: In the early days of Processing, the code language prioritized being minimal, quick, and light. Built into all of that is the layer of things being non-proprietary, open-source, and completely free. That meant that people had the freedom to look at the source code, modify it, and download it without having to pay for the software, which, in the arts community of the early 2000s, was really rare. The early days of Processing focused on three things: the community, the language — and how to use it for sketching with code — and education. The ethos of the early online forums was about helping each other and sharing. When it first started, it was a relatively small group of people; I’d say there were hundreds of people using it. Ben [Fry] and I would often spend hours a day on the forum listening to people. It was a really generous community whose kindness and openness was there from the start. ‍AE: For the Processing Community Catalog, one of the questions asked was: “what does being a part of the community mean to you?” Lauren, how would you answer that question?‍ Lauren Lee McCarthy: I think the community is the essential aspect; it definitely was for me working on the p5.js project. For me, it was never about making tools, but more about how we could come together as a community and make something. From the start, Processing felt different and really welcoming. As a woman of color starting out in the space in around 2011, it felt difficult to get into some of these tools or to really be a part of the community because it was so male-dominated. From the beginning, Processing has been about thinking through access and who has access to these tools."
