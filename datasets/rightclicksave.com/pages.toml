["https://rightclicksave.com/article/pathfinder-and-the-new-logic-of-nft-collecting"]
title = "Pathfinder and the New Logic of NFT Collecting"
description = "Nick Hladek outlines how ClubNFT’s new discovery tool will support both collectors and artists"
full_description = "At current estimates, over 3.9 million unique NFTs have been minted on the Tezos blockchain by creators using approximately 74,000 different addresses. Virtually all of these NFTs were minted on or after March 2021, when the chain’s first major NFT platform, Hic et Nunc (HEN), came online. This equates to over 6,000 NFTs minted on Tezos per day. However, given the expanding volumes of art available on the blockchain, it is becoming increasingly difficult for artists and collectors to form meaningful connections within the Tezos ecosystem. While a number of NFT projects predate Hic et Nunc, most credit the platform with legitimizing Tezos as a destination for digital art. Named after the Latin for “here and now,” Hic et Nunc was a slow, clunky, and borderline unusable NFT platform that first appeared on the Tezos blockchain in early 2021. Meanwhile, at a time when Ethereum was becoming prohibitive for artists, the minimal network fees helped to foster a truly global user base. In the early days of the Hic et Nunc era, finding high quality, affordable art was almost too easy. One needed look no further than the front page, a feed of the most recently minted NFTs on the platform — that is, if it loaded. The community was small and the vast majority of work was minted on a single contract. Inevitably, the Tezos ecosystem expanded beyond the walls of the Hic et Nunc garden, with the new demands of artists and collectors giving way to myriad platforms and tools. Objkt, for example, provides a central, contract-agnostic marketplace on Tezos. While fxhash offers an open platform to create and collect long-form generative art. Versum carries the ethos of Hic et Nunc into a new era, while Teia has emerged from HEN’s ashes following its untimely demise. TezTok provides a contract-agnostic indexing service for a thriving community of independent developers. As a result, navigating the Tezos ecosystem has become increasingly complex, especially for newcomers. With millions of tokens, tens of thousands of artists, and dozens of platforms to pick from, finding art on Tezos is not a problem."
year_published = 2025
