["https://rightclicksave.com/article/how-to-decentralize-a-museum"]
title = "How to Decentralize a Museum"
description = "As HEK Basel launches its new DAO, a group of friends explores how the institution is evolving"
full_description = "‍Sabine Himmelsbach: HEK recently launched its own decentralized autonomous organization (DAO), Friends of HEK, replacing a traditional membership card with a new model of tokenized community. This allows members of the DAO to participate in decision-making and in the curation of exhibitions. Why have you joined Friends of HEK? What do you see as being the long-term benefits of this kind of collaboration between museums and their audiences? Is something fundamental changing?‍ Armin Blasbichler: Friends of HEK isn’t precisely a DAO. Rather, it is a globally distributed community of individuals who share the same values and are incentivized to engage in shared agency. I am grateful to have had the opportunity to collaborate on the conception of this project, which left me with no reason not to join it. In my vision, the project encapsulates a kind of earth-moon relationship — distinct bodies sharing a core material while possessing independent orbits and characteristics, interconnected by the gravitational interactions they exert upon each other. ‍Damjanski: I consider this an experiment and a very interesting one. It’s an intriguing approach to transforming the conventional one-way communication of an institution into a multiway conversation. In its most radical manifestation, it has the potential to pave the way for a novel institutional operating model in the future. Imagine all visitors could have an impact on what will be shown. I’m curious to see how this plays out and what happens next!‍ Linda Loh: I have wonderful memories of my visit to HEK in 2017. I was interested in digital art long before that, but the art world wasn’t, so it was exciting to feel immersed in “my artists” after doing the rounds of all the art in Basel and beyond. I joined Friends of HEK because it felt like a way to keep in touch with a progressive community at the forefront of current developments. Because I’m based in Australia, I won’t be a regular in-person visitor to HEK, but it’s a novelty being connected despite being on the other side of the world. As an artist, the potential to participate in exhibitions was a factor, and I like the idea of hearing about online events and exhibitions that I might not notice otherwise."
