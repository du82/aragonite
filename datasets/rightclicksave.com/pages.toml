["https://rightclicksave.com/article/an-interview-with-jesse-draxler"]
title = "An Interview with Jesse Draxler"
description = "The artist shares what it takes to succeed in Web2 and Web3 with Alex Estorick"
full_description = "Alex Estorick: I often think of you as the quintessential hybrid because of the way you operate across both fine art and commercial contexts, working with Prince, Alexander McQueen, and The New York Times. What is it that unifies your practice across these different channels? ‍Jesse Draxler: I’ve spent my artistic career exploring different media, but my focus has always been on developing my own visual language. People have told me that it doesn’t matter that my work is so disparate — no matter how they view it, they know it’s mine. Although most of my commercial clients come to me because they want Jesse Draxler, they don’t come to me saying, “we have this idea, can you implement it?” It’s more like, “hey, we love your work, we want you to wrap it around what we’re doing.” That can create tension because of the need to compromise. ‍AE: Artists have always been “worldbuilders,” but that notion is especially live at the moment. As someone who operates across so many different disciplines, it feels like you’re ready for the metaverse. ‍JD: When I talk about worldbuilding I’m talking about showing other people the world inside of me. I always wanted the aesthetic of my world to be influential, so I thought: “how can I seep this imagery into culture?” [I do it] through illustrations for The New York Times and for fashion, music, and obviously social media. ‍AE: A number of artists have sought recently to critique Web2 and the algorithmic oppressions instituted by social media. When you talk about disrupting pre-existing media through an insidious project, is it a political project? ‍JD: It depends on what you mean by “political.” I have a very anti- mentality. For example, I love working with fashion imagery largely because I hate it. I’m seduced by it in a way that you’re supposed to be seduced, but I hate how fake and vacuous it is. I have days where I’m completely repulsed by the world because of the sheer amount of advertising; it’s so manufactured. A lot of my work responds to that and channels aggression toward traditional systems."
