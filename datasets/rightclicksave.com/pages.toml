["https://www.rightclicksave.com/article/when-art-entered-the-computer-age"]
title = "When Art Entered the Computer Age"
description = "The curator of a groundbreaking new exhibition of computer art at LACMA speaks to Lady Cactoid"
full_description = "Opening at the Los Angeles County Museum of Art on February 12, 2023, “Coded: Art Enters the Computer Age, 1952-1982” is a pivotal reappraisal of art in the age of the mainframe. Organized by Leslie Jones, Curator of Prints and Drawings at LACMA, “Coded” examines the critical, but long-overlooked relationship between early computer art and other art movements of the time, such as Op art, conceptual art, Fluxus, and Minimalism. Accompanied by a richly illustrated scholarly catalogue, the exhibition begins in the early 1950s when access to computers, originally the purview of government, the military, or large corporations, was severely limited. In contrast to other recent exhibitions, such as 2016’s “Electronic Superhighway” at the Whitechapel Gallery, which examined early computer art from a contemporary vantage point, “Coded” goes to great lengths to explore the specific contexts surrounding early experiments with computers. Artists, who often relied on universities for access to these expensive and massive new machines, either had to find engineers with whom to collaborate, or teach themselves coding languages such as Fortran. But even once they had, they encountered a range of obstacles — from exceedingly slow render times to the absence of monitors and digital printers — which necessitated that they work “blind,” unaware of their final outputs until they could translate them to plotters or microfilm readers. Investigating art, poetry, film, dance, and music created with computers or in response to them, “Coded” immerses viewers in the realities of the era so that we might see more clearly its dynamic innovations as they emerged. Although many early works of computer art were created by scientists, from the beginning there was a strong desire to engage art history, often with the aim of legitimizing the new tools as artistic media. Both Bell Labs’ engineer A. Michael Noll and German mathematician Frieder Nake used the modernism of Piet Mondrian and Paul Klee as launching pads for their own contemporary probings of code-based art. While, for Jones, Hungarian-born Vera Molnar’s work stands out for the way it extends the legacies of Constructivism, Concrete art, and GRAV, with which she was associated."
year_published = 2025
