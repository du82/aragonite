["https://rightclicksave.com/article/what-is-the-future-of-generative-media-interview-claire-silver-maya-man-luke-shannon-christies-gucci"]
title = "What is the Future of Generative Media?"
description = "Maya Man, Luke Shannon, and Claire Silver discuss the fusion of AI, digital art, and fashion"
full_description = "‍Maya Man is an artist focused on contemporary identity culture on the internet. Her websites, generative series, and installations examine dominant narratives around femininity, authenticity, and the performance of self online. She is the creator of the browser extension, Glance Back (2022), and the Art Blocks curated collection, FAKE IT TILL YOU MAKE IT (2022). She has exhibited globally, including at bitforms, New York; SOOT Gallery, Tokyo; Vellum, Los Angeles; Power Station of Art, Shanghai; and online on Feral File. Maya holds BA degrees in Computer Science and Media Studies from Pomona College and an MFA in Media Art from UCLA. ‍ Luke Shannon is a generative artist and maker based in Princeton, New Jersey. Previous projects include The Opera (2021) with Art Blocks and Orchids with Bright Moments, which have been displayed in New York, London, Mexico City, and Art Basel Miami. He was a researcher and artist in residence for the Council on Science and Technology at Princeton University in 2022, and is currently an Art Blocks artist consultant and R&D contractor. Shannon specializes in producing physical generative art, including embroidery, plotting, CNC (Computerized Numerical Control) machining, laser cutting, book production, and glass blowing. He is interested in ideas of performance, self, and creativity within constraints. ‍Claire Silver is an anonymous AI-collaborative artist who works with oil, acrylic, collage, photography, and different digital mediums. She often blends the classical style and mythos into her art, producing work that feels at once familiar and strange. Her practice is an ongoing visual conversation with AI, exploring themes of innocence, trauma, the hero’s journey, and how our view of them will change in an increasingly transhumanist future. Claire’s art is included in the permanent collection of LACMA and has been exhibited in galleries, museums, and festivals all over the world, as well as Sotheby’s London and Christie’s New York. She takes every opportunity to explore her unending fascination with AI, fight for visibility for the budding art movement, and wonder at the magnitude of this moment in history. She often feels like a caveman painting fire. Claire is vocal in her belief that with the rise of AI, for the first time, the barrier of skill is swept away. In this evolving era, taste is the new skill."
year_published = 2025
