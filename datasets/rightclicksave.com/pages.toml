["https://www.rightclicksave.com/article/rare-digital-art-festival-anniversary-larva-labs"]
title = "Rare Digital Art Festival #1 Anniversary: Larva Labs"
description = "RCS speaks to the creators of CryptoPunks, Autoglyphs, and Meebits about the rise of the PFP phenomenon"
full_description = "RCS: Hey Matt and John! We’re looking to avoid asking the same questions you always get and to celebrate Rare AF by looking back on the last four years. Do you have any memories from the event itself that you’d like to share? RCS: We were all young and idealistic back at Rare AF, imagining a new decentralized future for creatives. What are some of the things you think we got right? And what did we maybe get wrong? RCS: What has been a highlight for you in the NFT space since Rare AF in 2018? Was there a particular moment that stood out? Why? RCS: I remember you had some hesitancy to call yourselves artists at first, but your work is now world-famous and even in museum collections. Have the last four years changed how you think about your identities and the work you do? RCS: I think a lot of people assume having three hugely successful projects like CryptoPunks, Autoglyphs, and Meebits, must have changed your life for the better. But I wonder if it also makes things more complicated and challenging too? RCS: CryptoPunks complicate the boundary between digital art and collectibles. Is this debate important to you and what do you consider the likely consequences of a rise in generative art projects? RCS: Have NFTs shifted the value of art further away from creativity towards the status accrued through ownership? RCS: Autoglyphs seem to reference a long lineage: From Piet Mondrian to Sol LeWitt to the computer art of the 1960s. Do you think it’s important to connect the art of the NFT space with art historical prototypes? RCS: Owing to its extraordinary success, CryptoPunks has ironically become something of a standard template for the 1/10K PFP NFT. How do you feel about inventing a genre and the current tsunami of PFP projects? RCS: Is there any work out there at the moment that you find particularly interesting or innovative and are you planning to release any new NFT-related projects yourselves? We’d love to hear about anything you’re working on currently."
