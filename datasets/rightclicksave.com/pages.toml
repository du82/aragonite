["https://www.rightclicksave.com/article/right-click-live-and-japan-new-nft-scene"]
title = "Right Click Live and Japan’s New NFT Scene"
description = "Yusuke Shono reflects on a day of conversations in downtown Tokyo that spoke to an emerging movement"
full_description = "For those who might have missed it, Right Click Live was an event held in Tokyo on December 11, 2022. A collaboration between Right Click Save and KUMALEON, coverage of the day’s proceedings is still available online in Japanese and English translations. This was the first international NFT art event in Japan, comprising artist introductions and panel discussions that provoked free dialog between all participants. As an art writer myself, it was exactly what I had been looking for — a first opportunity to reflect on the current state of the NFT scene in Japan as well as the ongoing challenges facing the technology. While few admit it publicly, NFTs have not done well thus far in Japan. As in other parts of the world, mainstream conversation about NFTs is still preoccupied with sale prices over and above the artistic potential of the technology. Goh Uozumi, an artist who has been minting NFTs since 2019, wrote on his blog that “[t]he lack of criticality in the early days of [the] NFT […] was one of the factors that set the course for the subsequent dominance of hype.” While it is undoubtedly necessary for Japan to explore new economic opportunities, the greed fostered by the 2021 bubble has so far dissuaded many Japanese art professionals from engaging with NFTs. Generative artist Alexis André, who has lived and worked in Japan for many years, opened his panel by asking passionately: “why aren’t [more] Japanese artists participating on Art Blocks?” While Shunsuke Takawo, who himself advocates daily coding, also laments the lack of awareness of generative art in Japan. His work, Generativemasks (2021), is one of the most successful NFT projects by a Japanese artist so far, but there has been little debate about it in the domestic art world. Despite Japan’s historical embrace of video games, and its channeling of sci-fi culture through manga and anime, it tends to regard new trends with suspicion. In recent years, many of the micro-communities that have emerged have promptly disappeared, indicative of our collective tendency to scrap and rebuild. Every generation is consequently locked into its own memory. On the other hand, there are always individuals eager to explore new territory in the field of technology."
year_published = 2025
