["https://www.rightclicksave.com/article/herbert-w-franke-on-art-after-the-nft"]
title = "Herbert W. Franke on Art After the NFT"
description = "As the Francisco Carolinum hosts a new exhibition of the artist’s work, Georg Bak talks to the father of computer art about how his theories became reality"
full_description = "‍Herbert W. Franke: When I studied physics in Vienna after the war, I photographed landscapes and caves, but also drew and wrote stories. But even then, I wasn’t thinking of becoming an artist. However, I was interested in aesthetics and art theory, so I asked myself why it was that we often find images from science beautiful. I saw myself, above all, as a scientist who wanted to get to the bottom of this phenomenon of art — to understand it fully — through the experimental methods and mechanical means that I had learned as a physicist. After accepting a position at Siemens in 1953, I was able to conduct all kinds of photographic experiments in the photo lab, outside of working hours, in order to create visual worlds with light, that is, with electrons. Within a year, I already had my own analog computer, which my fellow student Franz Raimann had assembled for me. With it, I was able to calculate light oscillations for the first time. Under the guidance of art historian Franz Roh (1890-1965), I decided as early as the 1950s to declare my work as art, even though no one was particularly interested in it at the time, of course. ‍HWF: The exhibition “Experimental Aesthetic” at the Museum of Applied Arts in Vienna took place in 1959, at which all of my work from the period was shown. This included my light forms, the oscillograms with the analog computer, and my X-ray works. ‍GB: How was computer art received by the art world at the time, and how did the theory of computer art relate to postmodern art theory? ‍HWF: The reception of the exhibition was, of course, close to zero. I did distribute a text through a press agency which was at least printed by a few small daily newspapers in a slightly edited form. In general, however, it was better to be met with disinterest, because as soon as any established critics entered the scene, one could expect negative coverage. But computer art did radically change aesthetic experience, in the same way that digital technology catalyzed a new approach to rational aesthetics. As a consequence, philosophical and historical elements were no longer the focus, whilst it became possible to turn art into an experimental field of exact science according to information psychology. That was, of course, a field made for me."
