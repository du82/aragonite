["https://www.rightclicksave.com/article/robness-and-the-trash-art-revolution"]
title = "ROBNESS AND THE TRASH ART REVOLUTION"
description = "The enfant terrible speaks to Aleksandra Artamonovskaja about memes, fakes, and freedom"
full_description = "Aleksandra Artamonovskaja: Over the years, your art and your narrative have inspired a whole movement. Why do you think your work has had such a powerful impact? ‍ROBNESS: IF I WAS TO ACTUALLY NAIL DOWN HOW THE #TRASHART SCENE GREW AS IT DID, I’D HAVE TO SAY IT WAS A DASH OF ARTISTIC STUBBORN PRIDE TOPPED OFF WITH THE SUPPORT OF ARTISTS ON THE OUTSKIRTS OF THE CRYPTOART SCENE. THE EARLY DAYS OF RARIBLE WERE IMPORTANT BECAUSE PEOPLE WHO WERE NOT ADMITTED OR WHO WERE STILL WAITING FOR ADMISSION ONTO OTHER PLATFORMS HAD A CHANCE TO CREATE FREELY. QUESTIONS OR WORRIES ABOUT COPYRIGHT INFRINGEMENT WERE THE FARTHEST FROM IMPORTANCE. THE IMPACT I BELIEVE WAS A UNIQUE COMMON GROUND. WE ALL CAME FROM NOTHING, YET WE’D LIVED IN THE ARTS FOR A DOMINANT PART OF OUR LIVES AND WERE DETERMINED NOT TO LOOK BACK AND ASSUME SOME SORT OF WEIRD NEW DESTINY FOR THIS RENAISSANCE WE ALL CLAIMED WAS COMING. ‍R: MY REFLECTION IS MORE OF A GRATITUDE. ANY CHANCE I GET I HAVE TO GIVE CREDIT TO ALL THE OTHER ARTISTS WHO GAVE A PART OF THEIR SOUL TO EXPRESS THE TOTER IN THEIR OWN WAY. EVERY TIME I SEE A PIECE EMANATE IT HUMBLES ME. ‍AA: We witnessed several versions of ROBNESS on Twitter over the years, including V2, ZORRO, and DIGITAL ART BITCH. How central is performance to your practice? ‍R: JUST AS ACTORS PUT ON COSTUMES AND MASKS, I BEGAN TO SEE THE DIGITAL TOWN SQUARE PLAY HOST TO ALL SORTS OF CHARACTERS IN THE CRYPTOART AND NFT SPACE. HOWEVER, I BEGAN TO FOCUS ON THE ANONYMOUS INFLUENCER ENTITIES BEGINNING TO DEVELOP. I THOUGHT IT WAS A NEW PARADIGM IN SOCIAL NETWORK CULTURE AND WHAT BETTER WAY TO REFLECT THAT AS ART THAN TO ASSUME AN IDENTITY. DIGITAL ART BITCH WAS BORN AS A WEEK-LONG EXPRESSION OF HOW ANONYMOUS ENTITIES ON TWITTER CAN INFLUENCE CULTURE STRONGLY AND SOMETIMES WITH IMPUNITY. ‍R: ALWAYS FINDING A NEW VISUAL VOICE. I’M KNOWN IN THE SPACE AS BEING CONSISTENTLY INCONSISTENT, WHICH I AM PROUD OF. THE TOUGHEST PART IS TO JUMP FROM ONE TO THE OTHER. ‍AA: Your crypto art journey began with the Rare Pepe series, and now your most recent piece, PEPESHINICHI (2022), is part of the so-called “Fake Rares.” Could you tell us more about the project and the card?"
