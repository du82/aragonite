["https://www.rightclicksave.com/article/when-stephanie-dinkins-met-harm-van-den-dorpel"]
title = "When Stephanie Dinkins Met Harm van den Dorpel"
description = "Two of the foremost artists working with technology share their thoughts on Web3 with Alex Estorick"
full_description = "‍Alex Estorick: You both adopt critical approaches to algorithms, which have become the scripts whereby tech systems shape our real life experiences. Stephanie, central to your practice is an unveiling of how Web2 hinders communities of color, as well as a preserving of local community knowledges away from capture. Harm, your recent work also reveals a closeness between algorithmic and genetic forms of engineering, leveraging the blockchain in the process. It seems to me that, at this early stage of Web3, we really need strategies that prevent Web2 circuits of oppression from simply reiterating themselves. Of course, one of the central benefits of the blockchain is its capacity to return financial agency to the artist. On the other hand, it represents the ultimate financialization of human activity, recorded on a ledger for all to see. Do you think Web3 changes how we think about algorithms?‍ Stephanie Dinkins: I hear a lot about Web3 and, honestly, I don’t know how it differs from anything we already have in our spectrum. We say it’s different and that it does all these things, but at the bottom of it, it’s who we are, what we put into it, and then how we employ it that matters. For me, it comes back to the question of how we treat, consider, and care for each other. I think of algorithms in the same way — as a set of steps that take information, or data, or ideas and come to conclusions. Algorithms do that within us in Web2 and, as I understand it, they’re going to do that in Web3. For me, it all comes back to the questions of “what the heck are we doing? How are we handling this information? And how are we handling the systems that we’re working with?” But with all the developments taking place with quantum computing, I don’t know if I can waste my time on Web3. ‍Harm van den Dorpel: I think Web3 is a bit of a marketing term and a way to get buzz. I do believe that blockchain is a much bigger jump than anything we’ve had in computing so far, though it’s not of the same order of magnitude as a quantum computer."
year_published = 2025
