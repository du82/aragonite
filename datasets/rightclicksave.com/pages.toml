["https://www.rightclicksave.com/article/an-interview-with-qubibi"]
title = "An Interview with Qubibi"
description = "The legendary generative artist shares his vision of a brave new NFT world with Toshiaki Takase"
full_description = "‍qubibi (Kazumasa Teshigawara) is an artist, interactive web designer, and Lecturer in Integrated Design at Tama Art University. A self-taught programmer, qubibi has created multiple projects using screen-based media. In 2010, he released his video work, hello world, based on a unique real-time animation algorithm. His current solo exhibition with Verse, “wiwizn Part III,” is the third and final chapter of his wiwizn series. ‍qubibi on qubibi: Born in Ikebukuro, Tokyo. Used to live with my mother in the beginning. Later moved in with a new family. Was taken around bars while still young. Hostesses used to like me a lot. I stopped going to school. Played games at home. Cried out of fear when collectors banged at the door for money. Father ran away, got caught. Graduated elementary school. Got into an accident and hurt my neck. Father came back. Father died. Graduated secondary high. Worked at Nihonbashi Textile Processing Factory. Got into an accident, almost died, and hurt my neck. Got into music. Quit point drawing. Bought a Mac. Met some weird people. Said goodbye. Unknowingly entered a bad content design firm and quit immediately. Was scared for days after I quit because the company got hold of me. Worked and quit a number of jobs. At 21, discovered the fun of design. Eventually got married. Had a kid. Got separated. Got the kid. Taking care of the kid. Working quietly under the label “qubibi”. Would like to make a lot of things.‍ ‍Toshiaki Takase is a Japanese NFT Art producer best known for his involvement in Generativemasks, KUMALEON, and Nishikigoi NFT. ‍qubibi’s third exhibition with Verse, “wiwizn Part III,” is at Cromwell Place, London until January 29, 2023."
