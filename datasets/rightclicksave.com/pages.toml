["https://rightclicksave.com/article/are-nfts-really-a-wild-west"]
title = "Are NFTs Really a Wild West?"
description = "Yayoi Shionoiri and Alana Kushnir argue that code is not law, at least not for the moment"
full_description = "In his seminal 2008 documentary, The Mona Lisa Curse, art critic Robert Hughes declared that “apart from drugs, art is the biggest unregulated market in the world.” Today, “unregulated” is still a familiar refrain. But as art lawyers, we see the impact of regulations on the art world on a daily basis. For example, the EU’s Fifth Anti-Money Laundering Directive (5AMLD) has forced dealers and galleries to adapt their sales practices by conducting due diligence on sales exceeding €10,000 (inclusive of taxes). Courts and legislators are also starting to recognize resale royalty rights, including drafting new copyright law reforms. If the art world really was unregulated, we’d probably be out of a job. Curiously, the argument for greater regulation is often espoused by both crypto critics and believers. Indeed, the pendulum swings the opposite way in some countries where laws have been implemented significantly restricting cryptocurrency activity, including in China where its central bank announced a ban on all cryptocurrency transactions in the Fall of 2021. The blockchain has heralded the dawn of an era characterized by both resistance to third-party control and libertarian “reverence for freedom of choice as the ultimate right.” Decentralization gives agency to users and creators to control how their data is used and monetized — directly connecting supply and demand. For Satoshi Nakamoto, “[t]he root problem with conventional currency is all the trust that’s required to make it work.” Decentralized cryptocurrencies look to eliminate costly intermediaries, allowing for smoother transactions that leave more for the recipients of funds. In a decentralized utopia, users know what’s best for them, and cryptocurrencies seek to remove the external structures that limit what would otherwise transpire organically in the market. Yet, critics of crypto markets and NFTs identify a lack of structure in these systems as both the cause and effect of the Wild West. One site, sarcastically titled, “web3 is going just great,” catalogues anecdotes of daily rug pulls and other scandals, swindles, and instances of fraud. Many of these reported events imply that, had there been some sort of safety network — for instance, consumer protections or legal guard rails such as securities regulation — consumers would have been better protected."
year_published = 2025
