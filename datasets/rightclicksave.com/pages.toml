["https://www.rightclicksave.com/article/pixel-art-and-the-age-of-technostalgia"]
title = "Pixel Art and the Age of Technostalgia"
description = "As a new exhibition opens at Unit London, its artists discuss the aesthetics and politics of pixel art with Charlotte Kent"
full_description = "‍Charlotte Kent: How did you come to pixel art and what appealed to you about it as an artistic vocabulary? ‍Peter Burr: Broadly speaking, I don’t identify my work as “pixel art,” which, in common parlance, evokes an aesthetic wrapper and a style common to video games that points toward nostalgia or retro vibe. Cory Arcangel, Paper Rad, and E*Rock‍ acknowledged this trend 20 years ago and spun it into a commercial enterprise called WYLD FiLE, describing their approach as “Faxel Art” — vector-based pixel art made with the software, Flash. At the time, I thought it was a fun joke and a nice way to highlight logical gaps between music videos for commercial television and installations for fine art museums (the old gap between art and entertainment). The style WYLD FiLE embraced back in the day was a by-product of an often invisible technology that surrounds many of us every day. Each screen is made of stuff — physical material that acts as a bridge between the fantasy of the virtual image and the reality of the world we can touch and shape with our skin. I am personally interested in the quality of what’s invisible. ‍Eboy: My first experience with pixels was in the 1970s on my father’s Apple II. For eBoy as a collective, our commitment to a fully digital workflow led us to pixel art. Working on a screen naturally prompted us to control every aspect, making pixels an ideal medium. We quickly found pixel art enjoyable, particularly at low resolutions. Its constraints and the agility of the creative process proved both liberating and gratifying. ‍LoVid: The first video instrument we built in 2004 — in collaboration with Douglas Repetto — was an 8-bit synthesizer called Dragon Slayer. This was before we started building analog video tools and a time of cross-pollination within the DIY art scene, where technological art included net art, hardware hacking, and circuit bending. We had previously worked with a modified toy called My First Sony, which was a video drawing tablet that plugged into a TV. Not only did it produce pretty pixelated low-res images, but it also included an oscillator, which meant that the sound would change pitch, following a drawn line up and down, left or right. That was one of the ways we focused on technology as an extension of the human hand while highlighting the connections between image and sound."
