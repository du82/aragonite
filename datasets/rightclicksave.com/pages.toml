full_description = "Foteini Valeonti is the Lead Author of “Crypto Collectibles, Museum Funding and OpenGLAM: Challenges, Opportunities and the Potential of Non-Fungible Tokens (NFTs),” one of the first in-depth studies of the NFT as it relates to the cultural heritage sector. Dr Valeonti is a Research Fellow at UCL and the Founder of USEUM Collectibles, a UCL spin-out company, providing research-driven consulting to cultural institutions on NFTs and Web3, whose clients include major institutions such as the Natural History Museum in London. She holds a BSc in Computer Science and a PhD in Digital Humanities. She is currently advising policymakers while helping major museums, companies, and smaller heritage institutions to leverage NFTs for public benefit. Cure3 is delighted to present works by a specially commissioned selection of generative artists minting NFTs. Curated by Foteini Valeonti and Alex Estorick, with the support of fxhash, the works will be presented at Bonhams, London and for sale to raise money and help find a cure for Parkinson’s. Works will be available for purchase from 6pm GMT / 1pm ET on Thursday 12 January on various platforms, all accessible via the Cure3 website."
