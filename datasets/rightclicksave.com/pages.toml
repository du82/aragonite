["https://rightclicksave.com/article/is-art-getting-closer-to-science-interview-monica-bello-alex-cagan-wellcome-sanger-cern"]
title = "Is Art Getting Closer to Science?"
description = "With digital technology increasingly fundamental to both art and science, two leading thinkers discuss the evolving relationship with Alex Estorick"
full_description = "‍Mónica Bello: I’m a curator and have been working on hybrid projects across art, science, technology, and society for the past 20 years. Regardless of the institution involved, all my projects examine the nature of art and science, asking: what are we trying to achieve and what is the framework we are trying to identify? I’m interested in the old philosophical question of how we engage with something we cannot yet predict, and art and science are both good tools for that. CERN, where I’ve been working since 2015, is the best place on earth to ask the fundamental questions. When you work with artists in this environment — which is a particle physics lab — there is more technology than you can ever imagine: from computing to civil engineering, hardware and software. The fundamental question is: what is all the stuff around us in the universe and at the end of the universe? ‍Alex Cagan: I originally trained as an anthropologist, before moving into genetics and science. The Wellcome Sanger Institute is similar to CERN, but it deals in genomics, generating huge data sets to try and address fundamental questions about biology, human genetics, and health. I research mutations and how we accumulate mutations as we age. But I also do artwork that seeks to establish new ways to communicate science. I’m very interested in the relationship between science and art because, on a day-to-day basis, visuals are used to communicate science but I think there’s a bigger role for art in its own right. There are also different ways in which art and science can relate to one another. ‍Alex Estorick: Art since the Enlightenment has been often regarded as a world of elite activity set apart from science as well as popular culture. Even today, art’s functionlessness underpins the market for contemporary art. Yet utility is often baked into works of digital creativity, while NFTs have blurred the markets for fine and commercial art to the point where it feels like we are now living in one big world of artists. How does functionality change the nature of art from your perspective?‍"
