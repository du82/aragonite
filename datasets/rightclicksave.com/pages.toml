["https://rightclicksave.com/article/nfts-and-the-new-power-of-performance-art"]
title = "NFTs and the New Power of Performance Art"
description = "Dajana Krüger speaks with Alex Estorick about how NFTs can rehumanize the digital condition"
full_description = "‍Alex Estorick: How did your particular brand of video art emerge from your work as a photographer? ‍Dajana Krüger: I started as a conceptual photographer making portraits of people and selling them to international magazines. I then altered my focus, trying to find a new way of portraying people that injected a level of emotion beyond that of a still image. This led me to develop my 360-degree portraits. My installation, Spinning Communion, captures the performance artists from every angle in the style of a hologram, revealing their emotions and emotional connections in detail. ‍AE: We talk a lot these days about code as an art form. But we don’t always consider the body as a language. You’ve said you want to turn intimate poses into “digital hieroglyphs.” What do you mean by that? ‍DK: I’m not simply portraying people from multiple angles, I’m also trying to develop a language that communicates ideas, emotions, and feelings in a single sculptural pose. This was always my task — to create symbols out of the people I work with. For this, I need to know that the performers are able to project a particular emotion. Music helps in this process as does teamwork. But I always try to find the perfect pose for the individual. We have a conversation, and then they become a performance artist for 30 seconds. It’s a highly meditative process for all concerned. I don’t limit myself to using professional performers — it’s important for me to be inclusive because the project is ultimately about community. For my recent exhibition at the Galerie Monica Ruppert, most of the audience knew my portraits from Instagram, but when they experienced the physical installation for the first time it carried greater emotional weight. Some spent hours viewing the details and, because the installation follows a loop, they would find new details every time. ‍DK: They certainly connect with each character. But I think my viewers also have favorites. One of my 360-degree portraits, Soulmate, depicts a pair of twins clasping each other’s hands, while The Creation of Me shows two characters in physical contact for the very first time. In the physical installation, they became a new image."
year_published = 2025
