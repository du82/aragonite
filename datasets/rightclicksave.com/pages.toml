["https://rightclicksave.com/article/the-interview-john-gerrard-crystalline-work"]
title = "The Interview | john gerrard"
description = "Following the launch of crystalline work, the artist discusses how digital ecologies can regenerate reality with Whitney Hart"
full_description = "‍john gerrard is a key figure in the development of simulation within contemporary art. Appearing deceptively like film or video, his works are virtual worlds made using real-time computer graphics, a technology developed by the military and now used extensively in the gaming industry. gerrard’s works are is in the collections of Tate, London; MoMA, New York; SFMOMA, San Francisco; LACMA, Los Angeles; Hirshhorn Museum and Sculpture Garden, Washington; Kistefos Museum, Norway; IMMA, Dublin; Borusan Contemporary, Istanbul; M+, Hong Kong; and many private collections internationally. His work Western Flag (2017) was the first tokenized artwork (NFT) to enter LACMA’s permanent collection. gerrard received a BFA from Oxford University in 1997 and an MFA from the School of the Art Institute of Chicago in 2000. He is represented by Pace Gallery globally. ‍‍Whitney Hart is the Director of Exhibitions and Head of Growth at Feral File. She works with artists and curators on realizing their most ambitious blockchain-based creative visions, with cultural institutions on advancing their Web3 strategies, and with collectors and consumers on building the tools and technology needed to enjoy digital art in day-to-day life. Beyond her role at Feral File, Hart is a digital art collector and cultural advisor specializing in emerging technology. She sits on the Advisory Board of the Blaffer Art Museum in Houston, Texas. ‍ The performance of “crystalline work” commences today on Feral File. Works may be collected throughout the exhibition, which runs until June 21, 2025."
