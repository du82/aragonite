["https://www.rightclicksave.com/article/the-power-of-the-plotter-generative-art-aleksandra-jovanic-julien-gachadoat-feral-file-graph-interview"]
title = "The Power of the Plotter"
description = "Feral File’s new exhibition, +GRAPH, celebrates the art of generative drawing"
full_description = "‍+GRAPH is now open on Feral File, presenting works by Licia He, Joanie Lemercier, Aleksandra Jovanić, James Merrill, Iskra Velitchkova, and Julien Gachadoat. The collecting period runs for 24 hours from Thursday 16 November at 16.00 UTC. Julien Gachadoat has been exploring generative drawing for many years, creating unique art with algorithms. He works with the emergence of abstract form, combining monochrome and geometric shapes, playing with repetition, and using random operations to generate an element of surprise. Developing his own tools of creation based on simple graphic rules, Julien uses the computer — “this unique performer” (Vera Molnár) — to explore the formal possibilities that ensue. It is through the process of printing these unique pieces using plotters that he creates a link between text and code. He brings together the computer and the pencil on paper while combining the rigor of code with the poetry of art. Julien grew up making visuals with code as part of the demoscene of the 1990s and programming languages have been his principal creative tools ever since. ‍Aleksandra Jovanić is an artist and programmer from Belgrade, Serbia. She holds a doctorate in digital arts and a BSc in computer science. In her research and artistic practice she combines various media, mainly in the field of interactive art, art games, and generative art. Jovanić’s recent works focus on the aesthetic of data visualization and optical illusions, as well as explorations of accepted concepts of truth and reality. Her work has been exhibited internationally in exhibitions at Unit London, VERTICAL, Feral File, Vellum LA, and Art Basel. As an assistant professor, she currently teaches all three levels of study at the Faculty of Fine Arts in Belgrade, at MA level at the Faculty of Applied Arts, and at PhD level at the University of Arts in Belgrade."
