["https://rightclicksave.com/article/molly-ipfs-interview"]
title = "The IPFS Interview"
description = "Molly Mackinlay of Protocol Labs tells Chris King how collectors can achieve agency over their NFTs"
full_description = "Chris King: How did you come to be involved with IPFS (InterPlanetary File System)? What is your role in the community?‍ Molly Mackinlay: I got involved back when I was working on education technology. I was building a mobile app for teachers and students called Google Classroom, which also had a desktop component to do in-class communication, assignments, and note-taking — a lot of schools use it these days. Its biggest problem was that it was built on top of a super centralized tech stack. So if the Wi-Fi ever went out in a school, it would suddenly stop working and students would no longer be able to do their assignments or turn in school work to the teacher right in front of them. We’d created this failure point and lack of resiliency through an overreliance on Google data centers and strong bandwidth connections to those data centers. I’d heard of IPFS at the time, so I started taking part in the IPFS ecosystem as an open source contributor, trying to figure out how to improve offline local communication in a school environment. Unfortunately for Google Classroom, it was directly tied to the Google Drive stack. I joined Protocol Labs in 2018 as a product manager where I worked on the core Go IPFS implementation while putting together the Local Offline Collaboration Working Group. I then spent a year and a half as project lead for the Go and JavaScript implementations, working with the wider IPFS community and ecosystem, running the first IPFS camp, and doing all sorts of community building in order to understand who was building on IPFS and what they needed. Now when new people start working on IPFS-related projects, I try to make sure that we are supporting them and building them up. ‍CK: I don’t know if you remember, but that’s actually how we met. ClubNFT and Protocol Labs go back a bit. ‍MM: Yeah, I remember very well. It was during the dark days of Hic et Nunc (HEN) going down. HEN had been running its entire marketplace on top of IPFS, which is awesome. But suddenly, creators were left wondering what was going to happen to the persistence of their NFTs on that platform. As soon as we heard the news, we got involved — reaching out to various parties in order to figure out the migration plan for long-term persistence of these NFTs."
