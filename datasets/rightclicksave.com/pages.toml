["https://rightclicksave.com/article/the-fx-hash-conversation-ciphrd-and-zancan-interview-generative-art"]
title = "The fx(hash) Conversation | Ciphrd and Zancan"
description = "The founder of fx(hash) and the revered generative artist discuss the art of nature and the platform’s bright future"
full_description = "Alex Estorick: Ciphrd, you’ve described fx(hash) as “the world’s largest repository of generative art,” so any major changes are significant for the community of gen artists and collectors. What is changing with fx(hash) 2.0? ‍Ciphrd: A lot of engineering has gone into making this happen. The obvious change is that we are integrating Ethereum alongside Tezos. We considered how it would take form on the product side, wanting everything under the same feed to be cohesive and seamless. Upon launch, we’ll ship Ethereum open editions, while also publishing a new release calendar. This will ultimately translate into a full artist studio where artists can prepare their projects off-chain in advance and refine them in a more sophisticated environment. They will then be able to release a project by clicking a single button without having to go through the full flow the day before a release, which can be very stressful. They will also be able to toggle projects between public and private. That is coming shortly after launch along with some other quality-of-life improvements. ‍Zancan: If you are putting your work into a calendar weeks before a release, it becomes more public, which is good. That is all part of the work of communication around a project. Some collectors who are following specific artists want to know in advance when they will have to be there to buy a work. ‍C: I think that it may be suited to your practice as well — not so much the release plan but the ability to have a stable state that you can iterate on, update the script, and see all the changes side by side. We’ve tried to keep artists’ different practices in mind when building out the feature, which has been in my head for a long time. We’ve done our very best. ‍Z: If you can have your working process there until you press the release button, and you can iterate and make modifications even for an Ethereum project, that’s big. In the past, trying out your project on testnet required access to Goerli coins, which can be tricky to get. If I’ve needed to fix something, even just a single character, I’ve often had to pay a fee to replace the entire block. If one can skip those steps entirely, then it is game-changing as you are only paying a one-time gas fee when minting the project on the blockchain."
