["https://rightclicksave.com/article/the-interview-jacek-markusiewicz-generative-art-architecture"]
title = "The Interview | Jacek Markusiewicz"
description = "The generative artist discusses how he is altering the parameters of digital architecture with Kaloh"
full_description = "Jacek Markusiewicz is an architect, artist, and creative coder who blends traditional and modern techniques. He holds a PhD in architecture and urban planning from Warsaw University of Technology and earned a Masters in Advanced Architecture at IaaC Barcelona. Skilled in parametric architecture, programming, and responsive design, Markusiewicz has released a number of art collections, including Unbuilt (2021), Hollow (2022) and Barbarians (2024) utilizing platforms such as Bright Moments, fx(hash), Objkt.com, and Verse. He has also played a role in international architecture projects in Barcelona, Warsaw, and Beirut. Markusiewicz shares his expertise as a lecturer at Warsaw University of Technology and IaaC, maintaining strong ties with academia. ‍Kaloh is a writer, podcaster, curator, and founder with a decade of experience in the tech industry. Through his newsletter, he shares insights about digital art, technology, and culture in the blockchain realm. He also hosts Kaloh’s Podcast, featuring interviews with key figures in Web3. He founded the Blind Gallery, a digital space for generative and AI art, and is developing Academy by Blind Gallery to train future blockchain creatives and art professionals."
