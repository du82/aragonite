["https://rightclicksave.com/article/an-interview-with-sputniko"]
title = "An Interview with Sputniko!"
description = "The artist speaks to Jason Bailey about life on the border of art and technology"
full_description = "Jason Bailey: As an artist who grew up as the black sheep in a family of engineers, I’d love to know how your passion for mathematics and computer science came together with art. ‍Sputniko!: I was born in Tokyo in 1985. My mother is British and my father is Japanese. My parents were both mathematics researchers and professors, so math was talked about a lot in my household. With both specializing in time series analysis, my parents had a lot of computers in the house, which I played with from a very young age. I started programming in elementary school when I was around 11 years old. I figured out how to connect my computer to the Internet, so I was considered a computer geek and I got bullied so much for it, also because I’m half-British, which is unusual in Japan. My classmates used to call me: “Gaijin!” — the derogatory term for foreigners. That experience trained me to not be particularly interested in mainstream labels. I’ve become so used to being the odd one out that I don’t hesitate to cross borders and question labels. When I was growing up, I loved using computers to draw things and to make music and animations. So I had this love for creating. But when you’re young, and your parents are both math professors, they assume you’ll study mathematics as well. In 2003, I moved to London to study mathematics and computer science at Imperial College. I used to code ActionScript for a living, making interactive websites for BBC, MTV, Nike, and Shonen Jump manga in Japan. A lot of people thought I was going to continue as an engineer. But, growing up as a teenager in Japan, my inspirations were female artists and performers like Laurie Anderson, Sofia Coppola, and Miranda July who adopted feminist, gender-based messaging as a means of empowerment. That really struck me growing up in Japan, where the level of gender inequality is quite bad. I had another realization at university, where I was only one of very few female students studying computer science. While I was very excited to be learning about early machine learning, neural networks, and bioinformatics, I started to feel that these technologies didn’t really solve some of the issues faced by women and minorities. This was particularly true of the issue of women’s health, including menstruation, menopause, and pregnancy."
