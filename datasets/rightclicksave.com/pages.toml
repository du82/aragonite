["https://rightclicksave.com/article/the-aesthetic-of-a-protocol"]
title = "The Aesthetic of a Protocol"
description = "An interview with Distributed Gallery"
full_description = "Georg Bak: What does Distributed Gallery stand for and how did your collaboration as artists get started? Distributed Gallery: First of all, it should be noted that Distributed Gallery is not a gallery. We are a small collective of artists, carpenters, and hackers. A small multitude of friends. Our aim is to counteract the over-interpretation of 'artistic intentions' and advocate for a different approach to artwork, one where the artwork serves merely as a specific and situated experience of a protocol; namely, a set of technical, economic, and social rules that extend beyond the artwork itself. I'm not entirely sure why we favor this perspective. Perhaps it's because with a protocol, there's an aesthetic of anonymity. Protocols are essentially nobody. They organize without revealing themselves, acting as hosts for things other than themselves. They simultaneously create freedom while governing. Also, most of the time — in art, at least — we don't talk about protocols because they are behind things. They are the worlds behind the world that silently organize our lives, life itself. Protocols are somewhat akin to anonymous power; it’s seductive and could be scary. So I'd say we engage in protocol art because we have an affinity for the aesthetic of protocols, and there is an aesthetic because there is a poetry of protocols. To give you an example, a brilliant piece of protocol art, which may not explicitly define itself as such, but is significant to us and could serve as inspiration for our works, is Blake Fall-Conroy's Minimum Wage Machine. It's an artwork that allows anybody to work for minimum wage. As long as they turn the crank, the user is paid in pennies over time. For instance, if the minimum wage is $7.25 an hour, then the worker is compensated one penny every 4.97 seconds. If they cease turning the crank, they stop receiving money. Here, it is placed in service of a magisterial idea: to enable the experiential understanding of the sensory aspect of what is essentially just a legal rule, namely, the minimum wage. In the rotating movement of the crank and the accompanying sound of the coins cascading, the artwork profoundly deepens our comprehension of the economic world by translating it into a sensory experience. There's a strong likelihood that individuals will cease quickly due to discomfort in the wrist and a sense of futility. This aspect encapsulates the poetic essence of protocols."
