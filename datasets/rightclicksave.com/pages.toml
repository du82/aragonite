["https://rightclicksave.com/article/an-interview-with-ganbrood"]
title = "An Interview with Ganbrood"
description = "The artist discusses how human artists can survive the age of artificial intelligence with Alex Estorick"
full_description = "Alex Estorick: Could you introduce yourself as an artist, and as a human who collaborates with machines?‍ Ganbrood: I was born and raised in Amsterdam and I have always been engaged in activities that circled around art, but I have only been working with autonomous systems for a short time. I feel like a fast-growing, sci-fi test-tube baby. I have always been interested in visual storytelling, illusion, and special effects, whether for film, commercials, or video games. Throughout my career I have always been trying to synthesize life. ‍AE: Tell me about your work before the NFT came along and before GANs (generative adversarial networks) entered your life. ‍G: I started out as a CGI artist involved in special effects compositing and 3D animation until I became an art director for Sony Interactive Entertainment. I then left the digital realm and worked for 14 years as a documentary and reportage photographer, using no special effects or digital enhancements. Three and a half years ago, a friend of mine showed me Ganbreeder (now Artbreeder) which was a very easy interface for playing around with AI, neural networks, and GANs. I was immediately hooked. There was also an element of serendipity because the pandemic had left me without contract work as a photographer. It also coincided with the emergence of NFTs. At the time, I tried to get on some Ethereum platforms, but I read about it being bad for the environment and decided it might not be for me. Then some artists that I was following on social media — Mario Klingemann, Memo Akten, and Joanie Lemercier — suddenly started talking about Tezos as a great alternative. So I joined Hic et Nunc in its second week and I’ve been rabidly engaged with the community ever since, both as an artist and as a collector. ‍AE: Early GAN art always seems derivative of human creativity, but your work conjures worlds that are fundamentally hybrid and chimeric, implying nonhuman creativity. ‍G: I’ve actually always been intrigued by pure styles, whether Greco-Roman, Jugenstil, or comic art. Somehow I find in GANs — we call it now diffusion — a way to tie everything together in a coherent way that aligns with my personal fantasies, tastes, and ideas."
