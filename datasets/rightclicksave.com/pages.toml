full_description = "Cozomo de’ Medici is a pseudonymous collector, investor, and thought leader who has become one of the most popular and prominent names in the digital art community. The Medici Collection includes defining works of the digital renaissance, such as XCOPY’s Right-click and Save-As Guy and Some Asshole (Both works 2018), DeeKay Motion’s Destiny (2021) and Life and Death (2022), Sam Spratt’s I. Birth of Luci (2021) and VII. Wormfood (2022), multiple elite CryptoPunks, and “God Mode” Fidenza #938 (2021) by Tyler Hobbs. These sit alongside many unique 1/1 works from diverse and emerging artists across multiple chains. ‍Artnome (Jason Bailey) is the creator of the art and tech blog Artnome.com and founder of GreenNFTs and ClubNFT, where he serves as CEO. ‍This article first appeared on Medici Minutes, a once-a-week newsletter by Cozomo de’ Medici, where his insights and musings on digital art are shared with over 31,000 artists and patrons."
