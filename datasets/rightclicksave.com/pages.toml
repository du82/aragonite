["https://www.rightclicksave.com/article/get-liked-or-die-tryin"]
title = "Get Liked or Die Tryin’"
description = "Erin Bailey speaks to Mark Wilson, better known as “die with the most likes,” about the fine line between misery and hilarity"
full_description = "Mark Wilson: What did the preparation look like for this? Maybe microdosing a lot of Heineken 0.0s, or perhaps a couple BuzzBallz? ‍EB: I am halfway done with your book, An Eye for an Eye and Your Other Eye and the Rest of Your Family (2020). I think the repeated, subtle reference to the Earth being 6,000 years old is hilarious. ‍MW: Thank you. It’s something that seems to have been prevalent in both of our upbringings. But you know, it’s funny, that particular book was inspired originally by my dad. I found this book on his bookshelf called Monday Night Jihad (2007), which was absolutely horrific, reprehensible. So I got into the mindset of making a satire of that book and just absolutely destroying it. Because it was so comical that it had been published. I’m like, “Maybe I could write this and then start hiding it around Hudson News around the country” so that when somebody gets on a flight, they think it’s a best-selling psychological crime thriller, and they would start it and be like, “Oh, this is pretty good!” And then it would eventually ruin their flight. It’d be really funny. ‍EB: You’ve said, “I create for the sake of creation. I used to put all this stuff out on Instagram, and porn spam bots would be the only ones liking it.” But when did people start liking your stuff? ‍MW: It was first on Twitter, for sure. I still don’t really have an Instagram following at all. I think I have like 1,000 followers on there, mostly porn bots. It started picking up with Hic Et Nunc, the Tezos-based platform. That was crazy and punk and nuts. ‍EB: Your Twitter name is “die with the most likes” and your handle is @toadswiback. Can you clear up the discrepancy? ‍MW: So my Twitter name was always toadswiback — a reference to Under Siege (1992), the legendary Steven Seagal movie. And there’s a piece that I made five or six years ago that has always been really meaningful to me. It was a bunch of people connected to respirators dying in hospital beds and having their digital adoration fueling the last pathetic moments of their lives."
