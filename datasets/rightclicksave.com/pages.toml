["https://www.rightclicksave.com/article/time-on-the-blockchain"]
title = "Time On The Blockchain"
description = "With block time changing history, Charlotte Kent and Alex Estorick survey the artists exploring new temporalities"
full_description = "If artists are the alarm systems of society then blockchain artists are well placed to address the corruptions of linear time. Certainly, the most recent pandemic bent time, not least by compressing the experience of space into a largely digital frame. For Venkatesh Rao, “Pandemic time is an experience of time whose principal feature, for the majority of us, is its radically decentralized, accelerated and atomized nature.” ‍This disorientation has forced us to reckon with our position in the world: our rights and privileges of access; our interconnectedness and alienation; the constant proximity of death to life. Such spatialized epithets also confound the sense of time, as well as histories cultural, social, political, and medical while entrenching the creep of capitalist clock time whose “benefits” are so dependent on place. Back in 1987, the writer Jeremy Rifkin wrote about the impact of computer programs in his book, Time Wars. He argued that astronomical timekeeping introduced the notion of cycles, while mechanical timekeeping produced the concept of fixed, linear time, which computers subsequently unraveled for the kind of associative relations pervasive in the unconscious: Blockchain artists are best placed to pick up the shards of time, dealing as they do in blocks, which is to say the discrete temporalities that define the operations of Web3. Blockchain itself is a data storage system, one that is deeply invested in time as a container for culture. It is also a space in which (on which?) past information is used to organize the commercial performance of the future, principally via smart contracts. And while it operates as a particular form of computer time, its infrastructure is nonetheless rooted in a psychology of exchange. Lauren Lee McCarthy’s Good Night (2020-ongoing) is a performance art NFT for one person. Whoever owns it receives a notification via their preferred messaging platform — Instagram, Twitter, Discord, etc. — of the artist’s own sleep patterns. For McCarthy, “This gesture represents a commitment to a set of rules I have set out for myself, the performance is the lived attempt to meet that commitment.”"
year_published = 2025
