["https://www.rightclicksave.com/article/the-interview-refik-anadol-moma"]
title = "The Interview | Refik Anadol"
description = "The artist discusses MoMA, memory, and machine learning with Alex Estorick"
full_description = "In celebration of Refik Anadol: Unsupervised at The Museum of Modern Art, visitors were offered a free NFT memento of the installation through the Autonomy wallet. Minted in limited quantity on Tezos, each memento features different moving-image or still-image exhibition documentation as well as a Web3 glossary. Refik Anadol is an internationally-renowned media artist, director, and pioneer in the aesthetics of data and machine intelligence. He is the Director of Refik Anadol Studio in Los Angeles and Lecturer in UCLA’s Department of Design Media Arts. Anadol’s work locates creativity at the intersection of humans and machines. Taking the data that surrounds us as primary material, and the neural network of a computerized mind as a collaborator, Anadol offers us radical visualizations of our digitized memories and expands the possibilities of interdisciplinary arts. Anadol’s site-specific data paintings and sculptures, live audio/visual performances, and immersive installations take many forms, while encouraging us to rethink our engagement with the physical world, collective experiences, public art, decentralized networks, and the creative potential of AI. Anadol’s work has been exhibited at venues including MoMA, Centre Pompidou-Metz, Art Basel, National Gallery of Victoria, Venice Architecture Biennale, Hammer Museum, Arken Museum, Dongdaemun Design Plaza, Ars Electronica, Istanbul Modern, and ZKM Center for Art and New Media. Anadol has received a number of awards and prizes including the Lorenzo il Magnifico Lifetime Achievement Award for New Media Art, Microsoft Research’s Best Vision Award, German Design Award, UCLA Art+Architecture Moss Award, Columbia University’s Breakthrough in Storytelling Award, and Google’s Artists and Machine Intelligence Artist Residency Award."
