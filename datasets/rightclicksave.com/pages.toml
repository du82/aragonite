["https://rightclicksave.com/article/notes-on-retrofuturism"]
title = "Notes On Retrofuturism"
description = "With Web3 consumed by technostalgia, the artist Dev Harlan goes back to the future in search of new ecosystems"
full_description = "‍1. The past itself, as historical change continues to accelerate, has become the most surreal of subjects…¹ (Susan Sontag) ‍ 2. Technostalgia can be described as the fuzzy feeling one gets when seeing a device one used to use, having forgotten all its limitations or why it was upgraded. It is the warm endearment toward home computers of the 1980s that one might have encountered as a child, or else an unexplained fetishism for technology that predates one’s own lifetime but which represents a certain idea of the future — usually the optimistic future that one wishes to inhabit, not the messy, complicated, fraught present. Nostalgia is a longing for an imagined past which allows one to gloss over unpleasant or undesirable histories in order to cope with the present. In this way, technostalgia privileges an imagined history of technology and an anesthetized view of that history. 3. Web3 is the province of IT technophiles, a group that sociologist Colin Campbell regards as the “trailblazers” of new tech.² These early adopters are essential to persuading the neophiles — the consumers of the new — to accept new technologies. Technophiles have a consumerist appetite for anything that “creates a rapidly changing and continuous sequence of new wants” as well as a high frequency of “want turnover.” Web3 unites the technophiles and neophiles in a natively digital ecosystem in which the NFT market makes for a natural home. Themes and memes about chunky beige and pink computers varnish the aesthetics of Web3 culture like a well-worn Pong controller. Moreover, pathos for bygone tech acts to normalize obsolescence, perpetuating an economy fueled by solutionism and fast fashions. The result of such techno-infatuation is a level of critical disengagement that, to quote an early study of crypto art, “merely entrenches a state of neoliberal numbness in which aesthetics and ethics remain permanently uncoupled.” ‍4. Technophiles and neophiles are natural sci-fi lovers. But an obsession with the future does not preclude the reproduction of historical tropes. George Lucas is nostalgic. He owns a hoard of paintings by Norman Rockwell and is a prominent donor to the Norman Rockwell Foundation. These works, together with his larger collection of early American illustration are the foundation of his eponymous Lucas Museum of Narrative Art, currently under construction in Los Angeles."
