["https://rightclicksave.com/article/nfts-and-the-digital-democratization-of-culture"]
title = "NFTs and the Digital Democratization of Museums"
description = "Frances Liddell considers how cultural institutions can engage in meaningful ways with NFTs and blockchain technology"
full_description = "It is well documented that digital technologies offer an opportunity to “democratize” heritage and museum collections. Web2 ideology — encased in ideas around openness and participation — has also fuelled this idea and encouraged cultural institutions to make their collections accessible through online spaces. To this end, digital technologies widen access to collections. The concept of democratization in museums is also driven by paradigm shifts within Western museum practices that are motivated by post-structuralist thinking. Terms such as Eilean Hooper-Greenhill’s “post-museum” have helped to foster the image of museums as dynamic entities, whose collections are formed of different relations between museums and different communities and cultures. This highlights another form of democratization whereby institutions break away from the singular interpretation of a museum artifact, and replace it with the idea of layered meaning which explores how different perspectives can be communicated through the object. Digital technologies offer a means to enact this process of democratization, with digital objects understood as a way of capturing these different relations and exploring new avenues for participation. This might be through digital storytelling, such as, for example, the Museums Connect project between the Museum of Samoa and the American Museum of Natural History, or through digital reciprocation and discussion, such as the Talking Objects Collective at the British Museum. Web3 might also offer an interesting perspective on the discussion around democratization. NFTs in particular are grounded in ideas around decentralized ownership whereby users “reclaim” digital ownership in what is often seen as a “post-ownership” economy. But does this idea of decentralized ownership contribute anything meaningful to the democratizing practices of museums? In the context of the “post-museum,” democratization involves using the digital as a tool to explore marginalized voices among the histories and cultures presented in collections, thereby ensuring wider representation. My PhD research with National Museums Liverpool (NML) combined these ideas to explore how NFTs might be used within audience and community engagement practices by exploring different perspectives on the collections within the token. We worked with a group of participants to co-develop an online exhibition called “Crypto-Connections” that explored our personal relationship to museum artifacts. As part of the project, NFTs of these objects were minted and gifted to each of the participants. In the process, the NFT became like a personal edition of the collection that could be permanently owned."
year_published = 2025
