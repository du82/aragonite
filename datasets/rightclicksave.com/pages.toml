["https://www.rightclicksave.com/article/the-interview-melissa-wiederrecht-generative-art"]
title = "The Interview | Melissa Wiederrecht"
description = "The artist explores the space between generative art and identity with Whitney Hart"
full_description = "‍Whitney Hart: What are some of your earliest memories of making art and working with computation? How did these experiences lead you to become a generative artist?‍ Melissa Wiederrecht: I have always loved art of all kinds, even since I was a tiny kid. I remember being asked in second grade what I wanted to be when I grew up, and I responded: “I want to be a famous artist,” which seems to me an odd memory because I don’t actually remember any specific art I made that early or have any memories of making it. During middle and high school I invented a system of drawing mandala-like motifs with coins. I would choose a single coin at random and trace either a three-, four-, or six-way rotation, and then choose another coin and trace it all the way around, touching two other traced circles exactly, and then I would repeat over and over. Around the age of 12, I taught myself to code a computer. I went to the local library and found a book on HTML, which is how I learned to code. I went through the entire thing from start to finish and then convinced my parents to get me books online. I devoured a book on Visual Basic and then a few on Perl. On the day I turned 14 and was legally allowed to work, I was hired as a web designer and I kept that job for four years until I went to college. It was there that I learned Macromedia Flash and ActionScript, discovering a book called Flash Math Creativity that gave examples of work by different artists who coded in Flash. Finding that book was one of those moments in my life when everything seemed to come together perfectly and I was 100% obsessed, determined, and passionate, thinking: “the world better watch out because this is what I want to do.” I spent a lot of time playing with Photoshop during middle and high school, familiarizing myself with blending modes, brushes, layers, masks, and gradients, and becoming more than a little obsessed with the idea of coding my own Photoshop filters. In 2011, I received a BS in Computer Science and Math, followed by an MS in Computer Science in 2014. As soon as I had graduated, I picked up generative art again, learned Processing, and have been making generative art non-stop ever since."
year_published = 2025
