full_description = "‍elekhlekha (Nitcha Tothong and Kengchakaj Kengkarnka) are a collaborative artist group whose work develops subversive storytelling using sound and visual archives. Their research-based practice examines past histories, using multimedia and technology to experiment, explore, and define decolonized possibilities. Their first collaborative project, Jitr (จิตร), a speculative, imaginary electronics ensemble, premiered at Wonderville NYC and, in 2022, was awarded The Lumen Prize Gold Award. Elekhlekha have performed in small community and larger institutional spaces, including at LiveCode.NYC, the Jamaica Center for the Arts & Learning, The Jazz Gallery, New York; and online at Homeward Bound and CultureHub. In 2021, the artists received a City Artist Corps Grant for Jitr (จิตร), along with funding from Queens Council on the Arts and Babycastles. They are currently based in Occupied Lenapehoking, the unceded lands of the Lenni-Lenape and home for many Indigenous peoples past, present, and future."
