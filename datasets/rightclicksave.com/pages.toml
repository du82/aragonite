["https://rightclicksave.com/article/the-interview-operator"]
title = "The Interview | Operator"
description = "Following the launch of Human Unreadable, the celebrated duo discusses the private power of generative performance with Alex Estorick"
full_description = "Alex Estorick: How does your new Art Blocks project, Human Unreadable, extend the Privacy Collection? ‍ Dejha Ti: The Privacy Collection focuses on the tension between privacy and transparency in blockchain technology, while also seeking to bring the human body into crypto art in a meaningful way. Human Unreadable does this by hiding the human body in plain sight — it’s on-chain and site-specific, but it also translates raw human expression into code and therefore obfuscates human movements in a way that is illegible to humans. The system is transparent yet the human body is still hidden — privacy and transparency. The roots of the Privacy Collection, which comprises the Privacy Key 00, Attempts, Privacy Portraits, Unknown Sitter, and now Human Unreadable, lie in our works prior to Web3. First, our museum commission On View (2019), which was our way of analyzing selfie culture from the perspective of artists whose practice was being co-opted by experiential marketing, similar to Yayoi Kusama’s Infinity Rooms. On View coincided closely with the release of Shoshana Zuboff’s book, The Age of Surveillance Capitalism (2019). Our next project, I’d rather be in a dark silence than (2020), which won The Lumen Prize, is a signal-blocking trench coat that brought fashion, function, and conceptual art together to create a non-solution solution for how to combat the creep of extractive technologies into our daily lives. Both projects looked at privacy through a Web2 lens, so when we embarked on the Privacy Collection, we shifted our focus to how privacy functions within a Web3 context. The criteria for each lot of the Privacy Collection is as follows. One, it needs to address the tension between privacy and transparency. Two, it has to be site-specific to crypto culture. Of course, one tends to think of site-specificity in relation to physical space, but, for us, site-specificity in Web3 is more a mindset wherein the social dynamics and the technology itself are the four walls."
