["https://www.rightclicksave.com/article/the-nft-collector-richard-kim"]
title = "​​The NFT Collector | Richard Kim"
description = "One of the leading NFT collectors speaks to Jason Bailey about his passion for generative art and the rise of Tezos"
full_description = "‍Richard Kim: First and foremost, it’s the participation in a community process. For me, art was always one of those things you could buy and hang on your wall. And that’s cool. But it’s something maybe I’d do when I’m 50, not something I would do in my 30s. Having community as the creation layer of content, as well as the commerce engine of this thing that, at its extremes, is like a cult, is very familiar to the millennial and Gen Z generations — the symbiotic combination of art with market. As you know, I’m not a big fan of the PFP. But communities can create their own art. And, if we adopt an old-guard mentality, I think we’re likely to miss a lot of what makes the next wave interesting. Fxhash was initially belittled by a lot of the collecting community precisely because it had no curation layer. But for me, that was the upside. There was no approval, and no gatekeeper. That was a really cool thing to see. JB: I had something of a crisis when Art Blocks first became popular, because if we’re all going to agree before a drop that it’s going to be a hot drop, is that even really collecting? How do you distinguish between curated platforms like Art Blocks and non-curated platforms like fxhash? ‍RK: Art Blocks is interesting because, over time, collecting a complete set became more important than the quality of the art itself. That became something of a burden for me. I remember very distinctly the day I posted on Twitter that I was going to break my Art Blocks set. That was a good example of what you’re talking about, with crypto Twitter influencers saying: “Oh, this set is awesome...” But the price was absurd. Why would I spend $25,000, or whatever it was, on this thing that looked like a cutscene from a video game, when I could buy a car with that instead? That was the moment I realized this whole cult had become divorced from reality. ‍JB: It sounds like the competitive, completionist approach was maybe eroding your raw passion for art. Has collecting on fxhash restored some of that for you?"
