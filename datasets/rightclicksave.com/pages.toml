["https://rightclicksave.com/article/eztv-and-las-digital-underground-video-art-technology"]
title = "EZTV and LA’s Digital Underground"
description = "Michael J. Masucci charts a history of radical inclusivity in California with Dina Chang"
full_description = "Michael J. Masucci is an award-winning artist and producer who has been curating digital art since 1984 and producing digital and multimedia since 1980. As a founding member of EZTV he has collaborated on projects that have been presented at the Museum of Modern Art and Lincoln Center, New York; Institute of Contemporary Arts, London; Centre Pompidou, Paris; SIGGRAPH; and on PBS, as well as at numerous festivals, and professional conferences. He has authored articles and spoken on topics ranging from information security to transhumanism and the role of art in the digital world. His work is included in the permanent collection of USC, and next year his early video will be included at an exhibition at The Getty Center, Los Angeles and will be screened at REDCAT Theater. He has been included in The Getty’s PST ART initiative and co-founded DNA Festival Santa Monica. He is also a Commissioner for the Santa Monica Arts Commission where he has served as Chair, and has been an artist-in-residence at 18th Street Arts Center since 2000. A cisgender man, he helped save an archive of seminal early Queer media art. According to the V&A, an early digital art gallery he co-created “literally put digital art on the map.” ‍Dina Chang is an American artist and curator. Her work is a fusion of traditional photography mixed with machine learning, video, misused software, and science. Recent projects have included the DNA Digital Art Festival, collaborations with Adobe and Intel, curation for “Glitch: Beyond Binary” at Sotheby’s, Refraction Festival, Objkt, and programming as co-director of NFTuesday Los Angeles. She is also co-founder of Setta, a creative studio based in Los Angeles."
