title = "The Blockchain Was Invented For NFTs, Not Currency"
description = "A candid interview with the inventors of the blockchain"
full_description = '''Jason Bailey: I often introduce the two of you as my good friends “who invented the blockchain.” I usually get a look of disbelief followed by, “No, Satoshi invented the blockchain,” even from people who have been into Bitcoin/crypto for many years. Can you help folks better understand your contributions and how those represent part of the foundation that Satoshi built upon? Stuart Haber: Okay, let me tell the story by going back about three decades in history to discuss what, at least from my perspective, marked the beginning of the blockchain. This all happened in 1989 when Scott Stornetta and I were young scientists at Bellcore (Bell Communications Research). I worked as a cryptographer. Scott had just joined. He wanted to find a solution to ensure that the integrity of digital records could be proven, guaranteed, and maintained through certain procedures or algorithmic means. Scott strongly suspected that cryptography would play a role in this. So along with Dave Bayer, we wrote a couple of papers and created an architecture to address this problem. Scott Stornetta: Stuart and I have developed a distinctive style of collaboration characterized by a yin-and-yang dynamic and a continuous exchange of ideas. I tend to get deeply absorbed in my thoughts on problems like this. The challenge was that I had no knowledge of the underlying mathematics or cryptography that could be applied to address it. I had a question but was clueless about how to find a solution. This knowledge gap has been a driving force behind our productive collaboration. SH: For those familiar with such concepts, both digital signatures and cryptographic hash functions had been proposed, implemented, and well understood by the fall of ‘89. These tools suggested a relatively straightforward solution to the problem, which required a single trusted entity — whether a person, a piece of software, or hardware — to ensure the integrity of records within a specific domain. For many, this solution was deemed satisfactory. In our narrative, we sometimes refer to it as a "journeyman solution" to the challenge of ensuring record integrity. However, it was actually unsatisfactory to both Scott and me because we sought a solution that didn't necessitate trusting any party at all or trusting as few individuals, entities, and mathematical assumptions as possible.'''
year_published = 2025
