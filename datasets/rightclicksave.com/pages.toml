title = "Why We Need a Generative Art Award"
description = "Carla Rapoport speaks to the master collectors at Metaversal about the value of The Lumen Prize’s new Generative Art Award"
full_description = "Aleksandra Artamonovskaja is the Founder of Electric Artefacts studio for digital art, and partnerships lead at Joyn.xyz, the co-creation platform for Web3 communities. She has led award-winning Web3 art projects and is a prominent speaker, writer, and educator on the role of decentralized technologies in the creative industry.‍ Matt Miller is a lead art collector and investment analyst at Metaversal. He brings a real estate and finance background with a passion and enthusiasm for digital art and, in particular, generative art. He also co-hosts the Twitter Spaces, Art Unfiltered alongside VonMises, ayyybee, and esteemed guests.‍ Julia Tao leads marketing, content, and partnerships at Metaversal. She writes and advocates for inclusivity, partnership, and a human-centered approach to building the creative and technological revolution of Web3. Prior to Metaversal, she was a founding member of a Web3 female-led startup incubator, a service design and change management consultant, and a marketing strategist in tech corporations and startups. ‍Thefunnyguys was Metaversal’s first investment analyst and currently serves as a trusted advisor. He is a Belgian generative art collector who shares his collection with his two brothers. He has been collecting NFTs since late 2020 and, since discovering Art Blocks, generative art has been his main passion. He is the Founder of the generative art fund and institution Le Random. ‍Gillian Varney leads strategic projects at Metaversal. With roots in the New York, Paris, London, and Los Angeles art worlds, she brings a uniquely global perspective to her work in Web3. Gillian has managed art and fashion collections for blue-chip clients, collected art for hedge fund executives, and directed global client service strategies for multicultural operations teams. She is passionate about preserving our shared cultural legacy across mediums, and looks to the metaverse as the future of creativity. ‍Carla Rapoport is an interdisciplinary arts entrepreneur, speaker, and writer who aims to create new audiences and opportunities for artists creating with technology around the world. In 2012, she founded The Lumen Prize for Art and Technology following a career as a financial journalist working for the Financial Times, Fortune Magazine, and The Economist Group. In 2018, she founded Lumen Art Projects to manage both the prize and a growing business that provides consultancy, exhibitions, and commissions featuring artists in the Lumen community to a global roster of clients. This community now numbers over 500 artists who have been longlisted, shortlisted, or won The Lumen Prize."
