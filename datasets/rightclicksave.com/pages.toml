["https://rightclicksave.com/article/when-generative-art-became-contemporary-art-pace-verso-art-blocks-interview"]
title = "When Generative Art Became Contemporary Art"
description = "Erick Calderon, KarateKid, and John Gerrard discuss the impact of the Pace Verso x Art Blocks partnership with Ariel Hudes"
full_description = "Ariel Hudes: I thought we would start by going back in time and talking about how we each came to generative art. John, how did you come to work generatively?‍ John Gerrard: My starting point was with 3D scanning, which is sculptural. That was probably in 1994 when I was an undergraduate at Oxford University. I’ve been thinking about the image as an object ever since. My relationship with generative art is less online and much more about the game engine, which is a key language for contemporary art that I’ve championed for 20 years. After 15 or 16 years making game engine-based artworks, Pace Verso approached me with their partnership with Art Blocks. In the space of just a few short weeks, we turned around Petro National (2022) using a technology called WebGL, which allows you to put the engine in the browser. What motivates me the most is putting WebGL data worlds into this context. And so that’s what I’m doing. ‍AH: KarateKid, how did you come to generative art? What are some of the first projects that got you excited?‍ KarateKid: I got my first Bitcoin in 2014, so pretty early. But, like many people, I didn’t do much with it. Many years later, I discovered Hashmasks, which was super interesting in how the project was constructed. Then I got interested in CryptoPunks. As a newbie to the Punks Discord, trying to figure out which Punk to get, Erick was so generous with his time and his tips. That’s how I ended up with the CryptoPunk that’s my avatar today. At the time, the CryptoPunks Discord comprised nearly half of the people from the Art Blocks Discord, so everybody was talking about it. ‍ Elementals (2021) season one was my first experience of the magic of minting. Ringers (2021) had already been minted, but I was immediately drawn to the elegance of Dmitri Cherniak’s algorithm with pretty high conviction. I was like: “wow, this is going to be in a museum someday. I just really have to get this.” The Discord was also a super welcoming community and the Ringers channel very intimate and celebratory. Then came Fidenza (2021) and that was just sheer beauty — you could feel the power of long-form generative art, and I’ve never looked back since.‍"
