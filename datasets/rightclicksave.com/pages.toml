["https://rightclicksave.com/article/on-generative-pixel-art"]
title = "On Generative Pixel Art"
description = "As The Pixel Generation opens at Unit London, Alex Estorick asks a group of generative artists why they are embracing technostalgia"
full_description = "Alex Estorick: We feel lucky to have such a range of artists participating in “The Pixel Generation.” What can you tell us about your work for the exhibition? ‍Fay Carsons: I focus on aesthetics at the edge of human experience — 3D objects that, while appearing severe and foreign, are to me familiar and human, and the result of a mind wrestling with inputs it cannot properly process. I think of divine madness, psychedelia, psychosis, and the Book of Ezekiel if it took place in the present or future. I like to call these objects, “angels,” regarding them as beings that visit during intense transcendent states. Regardless of their medium, my works are often heavily inspired by William Burroughs and Georges Bataille. Given the theme of this exhibition, it only made sense to meld that interest with the aesthetics of failure and haywire tech, which is a pairing that I will continue to explore. ‍Elsif: My work for this show, Last Rain of April, applies pixel sorting techniques to an abstract generative landscape. Most of my generative works are created in JavaScript, using a combination of the Canvas API, p5.js, and Three.js libraries. For this exhibition, I developed a new program to draw, paint, and then sort the pixels, using many off-screen canvases in the process. The drawing step uses a few solid colors and precise lines; the painting step then blends the line colors and paints millions of small ellipses. I also used these techniques in my last long-form collection, For Algernon (2023). The sorting step is a new addition that takes place at the end, iterating over all pixels individually multiple times to sort them based on their perceived brightness. The end result is a soft painterly glitch effect. ‍Galo: My work for this show is part of a series called COMPUTATION. The artworks are generated algorithmically using a modified version of an existing JavaScript program I developed last year for a long-form project on fxhash. I used this program to generate new outputs that I could then selectively curate into a new series. Instead of real-time artworks, this series comprises looping animated GIFs. COMPUTATION references many different types of imagery from early punch-card programs to low-res video game graphics."
