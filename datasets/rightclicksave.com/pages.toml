["https://rightclicksave.com/article/frank-stella-and-the-rights-of-the-artist"]
title = "Frank Stella and the Rights of the Artist"
description = "The iconic artist and Artists Rights Society share what makes their NFT collaboration groundbreaking in the eyes of the law"
full_description = "At 86 years old, Frank Stella intuitively understands the zeitgeist as well as the potential of NFTs. Long a champion of artists’ rights, often in conjunction with Artists Rights Society (ARS) and now with ARSNL as well, the idea of automated royalties driven by smart contracts, and a push for a more equitable system for artists, clearly resonate. Aware that the market for his work prices out most younger collectors, digital editions also appeal as a way to increase accessibility to a new generation. Stella was already using computers in the early 1990s to devise forms and shapes that would be difficult if not impossible to conceive of with analog tools alone. His new NFT project, “Geometries” (2022), therefore represents the culmination of a thirty-year dialogue with computation and a sixty-year exploration of painting and physical space driven by one of the most iconic artists of his generation. As an artist known for challenging and expanding standards, not for following them, his new works push the potential of NFTs by licensing his 3D models for future remix by their owners — as ever leading the way by fearlessly opening new avenues of exploration for others to follow. To celebrate the launch of Frank Stella’s genesis NFTs, I asked Jessica Fjeld from Harvard Law School to join me in exploring the legal implications of Stella and ARSNL’s groundbreaking project. ‍Frank Stella: I’d heard chatter for a while, but the first time we began to take them seriously was at the suggestion of a friend of mine, Danny Sullivan, who is a former race car driver. Then we started talking to ARS (Artists Rights Society) to help us figure out if this was something that might be good. ‍ JB & JF: What appeals to you about NFTs generally, and specifically in seeing your work minted as an NFT? ‍FS: Part of the appeal of the project is the hope that the geometrical ideas that we’ve developed might be interesting to other people, and that they might be able to do something exciting with them. ‍"
