["https://rightclicksave.com/article/the-macro-state-of-the-nft-market"]
title = "The Macro State of the NFT Market"
description = "Kyle Waters sees green shoots in the data despite the current downturn in crypto markets"
full_description = "In his General Theory, John Maynard Keynes surmised that “the difficulty lies not so much in developing new ideas as in escaping from old ones.” The crypto economy, like the broader macroeconomy, has developed in pronounced boom and bust cycles in its nascent history. As crypto markets face a new price crunch in 2022, current observers are tempted to draw comparisons with past cycles, especially 2018 when ETH fell from $1,380 early on to $82 by the end of the year. Until crypto-asset prices rose in late 2020, the intervening years were branded by some as a “crypto winter” — a period of prolonged inactivity in the crypto economy. In 2022, crypto markets have once again been stricken with volatility, with the prices of Ethereum’s ETH and Tezos’s XTZ down 75% and 70% respectively. While the future remains uncertain, the blockchain’s information richness is also providing us with a steady stream of real-time data about the crypto economy and NFT market. Here, I weigh in on the macro state of the NFT market, addressing the key macro indicators to keep an eye on, while bearing in mind the history of the crypto market. Close followers of the NFT market will be dialed into the health of the blockchains underpinning the most prominent NFT ecosystems, such as Ethereum, Tezos, and Solana. For brevity’s sake, I focus here on Ethereum, but the same sort of analysis is relevant to other blockchain networks. One of the best high-level indicators of activity is active addresses/wallets (i.e. addresses that were involved in at least one transaction during the specified time interval). This is the closest thing that crypto has to an active user count. The daily number of active addresses on Ethereum has trended downward slightly in the last few weeks from around 550,000 per day in early May to under 500,000 in the first week of June. A similar trend is noticeable for weekly active addresses, which has fallen from ~2.5 million to 2 million over the last month. While monthly active addresses have fallen from ~7.5 million to ~6.5 million over the last month."
year_published = 2025
