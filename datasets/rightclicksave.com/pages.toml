["https://www.rightclicksave.com/article/the-art-of-the-profile-picture-portrait"]
title = "The Art of the Profile Picture Portrait"
description = "Katherine Howatson-Tout considers the place of PFPs in the history of portraiture"
full_description = "PFPs (profile pictures) project new selves at a moment when our hybrid identities are increasingly performed in digital space. They permeate much of the Web today, often in the form of cartoons and comic-art avatars that stand in as online body doubles. Frequently posed in bust length and three-quarter profile, these avatars sit unquestionably within the Western canon of portraiture, reincarnating our social identities in new virtual worlds. That they often wilfully mask rather than reveal an inner self also ties them back to histories of aristocratic portraiture, which often (though not always) sought to aggrandize and airbrush “reality” in order to make a public statement. In fact, PFPs achieve many of the same goals as portraits five hundred years ago. The stakes are high in portraiture, in which a sitter’s social status and their perceived moral character can hinge on minute details of place and face. Subtle tweaks of pose and lighting produce different effects and invite different responses. Winston Churchill famously despised his 1954 portrait by Graham Sutherland, who was only painting what he “saw.” Yet the image was ultimately burned by members of Churchill’s staff for its perceived denigration of the aging prime minister. Traditional portraitists have adopted strategies to elevate their subjects socially and politically through idealization. Sitters are frequently shown surrounded by their worldly possessions: signifiers of power, intellect, and moral fiber. Holbein’s double portrait of The Ambassadors (1533) is a paradigm in this respect, its two full-length figures framing an array of luxury objects that serves to enhance their reputations as noble and venerable souls. In the words of sixteenth-century writer, Baldassare Castiglione, “external appearances often bear witness to what is within.” But they can also be used to mask that interior.¹ In recent years, the portrait has infiltrated the world of online gaming, with the human body dissolved and re-embodied as a digital skin. Likewise, today’s in-game acquisitions serve to bolster one’s legend within a new status hierarchy. A notched pickaxe in The Elder Scrolls V: Skyrim (2011) is as much of a ranked attribute as a fur-trimmed cloak in a fifteenth-century portrait, lending gravitas to its owner as it once did to the sitter. For a prototype PFP project like CryptoPunks (2017), the rarity of a Punk’s attributes contributes to the perceived value of the Punk itself. While CryptoKitties (2017) incorporated a “breeding” feature that allowed collectors to generate new and unique “cattributes” down the generations. For PFP projects ever since, rarity has become the native metric of the avatar as it always was for the aristocrat."
