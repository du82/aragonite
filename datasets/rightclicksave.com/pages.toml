["https://www.rightclicksave.com/article/tezos-and-the-new-digital-geography-of-nfts"]
title = "Tezos and the New Digital Geography of NFTs"
description = "Diane Drubay speaks to some of the leading creators in the Tezos ecosystem about the art of building community in Web3"
full_description = "With lower gas fees and a proof-of-stake protocol that doesn’t carry the environmental baggage of proof of work, Tezos is unleashing a new creator economy in parts of the world where artists have historically lacked international exposure. The root of this new ecosystem is Hic et Nunc (HEN), a marketplace launched in March 2021 on the Tezos blockchain, comprising a majority of members from South America (especially Brazil, Columbia, and Argentina), Southeast Asia (Malaysia and the Philippines), and India. Where the traditional art market has relied historically on competition and exclusion, the core of the NFT community is collaborative and supportive. The increased affordability of NFT minting and collecting has also led a number of artists to become collectors themselves, supporting their fellow creators and accelerating the secondary market. For the Tezos community, collection and donation are now habitual behaviors — indicative of Web3’s potential to draft new social contracts and generate greater equity. I spoke to five of the most active members of the community to discover the projects most important to them, as well as their hopes for this new digital geography. ‍The Bad Lament: I’ve had a great experience working in Web3 over the last two-and-a-half years, mostly due to the friendships and connections I’ve made in the NFT arts community, as well as the opportunities I’ve been given. As a working artist, it has given me another outlet and distribution model to receive income for my work. ‍Numa: Intense. It’s like a roller coaster and gives one a lot of anxiety, but it’s been my most productive time artistically. It has also given me access and connections that were previously unimaginable. ‍Mumu the Stan: I’ve learned so much over the past year — from tech aspects to artistic disciplines I wasn’t previously aware of, to getting involved with community building. It’s exciting to be in the early stages, shaping the future. ‍Bjorn Calleja: It has mostly been great. It gave me the opportunity to present my animations and my art to a bigger audience, while offering a platform to exhibit and market the animations and digital work I create. I’ve also made new connections and friends all over the world through Web3. During the early period, it gave me the feeling of excitement about starting all over with my art practice and exploring ways to contribute to the space and the community. Eventually, the rapid phasing somehow burned me out. Now I am learning to work with it in my own time."
