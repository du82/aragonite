["https://rightclicksave.com/article/royalties-and-the-new-collector-economy"]
title = "Royalties and the New Collector Economy"
description = "Brian L. Frye considers the future of artists’ resale royalties in a divided NFT ecosystem"
full_description = "Everyone in the NFT community is talking about resale royalties. Artists love them, collectors hate them, and marketplaces are caught in the middle, trying to decide whether and how to enforce them. In a nutshell, resale royalties are bounties paid to artists when their NFTs sell on the secondary market. A resale royalty consists of a percentage of the sale price of a work, set by the artist who minted the NFT. So if an artist incorporates a 5% resale royalty into their smart contract and a collector sells the NFT for 10 ETH, the artist gets 5% of the sale price or 0.5 ETH. Until recently, most NFT marketplaces enabled artists to set resale royalties for their NFTs, with certain restrictions depending on the marketplace. For example, OpenSea permitted a maximum resale royalty of 10% and Rarible a maximum of 50%. Unsurprisingly, most NFT collectors hate resale royalties, which are effectively a sales tax on NFTs. It’s a drag to see your 10 ETH profit become a 9.5 ETH profit because you have to pay the artist a 5% cut. What’s more, resale royalties apply even when a collector sells an NFT at a loss. So if a collector buys an NFT for 20 ETH and sells it for 10 ETH, a 5% resale royalty will still give the artist 0.5 ETH. Up to now, many collectors have tried to avoid paying resale royalties by selling their NFTs on royalty-free or royalty-optional marketplaces like X2Y2, LooksRare, or Blur. Not even OpenSea is able to enforce resale royalties for NFTs created on its platform if they are then sold through a different NFT marketplace. Of course, artists can always write a resale royalty into their smart contracts rather than relying on NFT marketplaces. But they usually don’t, because it would make their NFTs unappealing to collectors. What’s more, there is no way to write a resale royalty into an NFT’s smart contract retroactively, so NFTs created without an on-chain royalty will always have to rely on off-chain enforcement. During the hype machine of 2021, successful NFT artists collected plenty of resale royalties, even despite deadbeat collectors. But the harshness of the current crypto winter has altered that reality. While OpenSea held the line as long as it could, change was inevitable. In February 2023, Blur announced that it would enforce resale royalties, but only if artists blocked OpenSea from listing their NFTs. OpenSea responded by making all off-chain royalties optional. Make no mistake, these decisions pose an existential threat to royalties in the NFT space. But are resale royalties actually a good thing? It depends who you ask."
