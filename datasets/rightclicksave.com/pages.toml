["https://rightclicksave.com/article/you-cant-copyright-ai-art-yet"]
title = "You Can’t Copyright AI Art (Yet)"
description = "Sarah Conley Odenkirk explains the importance of the Kashtanova decision for artists working with generative AI"
full_description = "On February 22, 2023, the US Copyright Office made a long-awaited decision on the fate of Kristina Kashtanova’s copyright for their graphic novel, Zarya of the Dawn (2022). The drama began last Fall when Kashtanova received a copyright registration for the comic book despite having failed to disclose that images contained in it were generated with the assistance of the artificial intelligence image generator Midjourney. Following Kashtanova’s announcement on social media that they had received a registration for the entire work, including the AI images, the Copyright Office backtracked on the registration and sought further information from the artist as to the details of their authorship. After receiving additional information from Kashtanova’s attorney, the artist was granted protection for the text and compilation of the comic book, but not for the images. The Copyright Office determined that, despite Kashtanova’s labor in crafting prompts and selecting the final images to be used in the comic book, based on prior case law and established policy standards, “the images… generated by the Midjourney technology are not the product of human authorship.” The Office justified its decision on the basis that prompts are more like suggestions from which the AI then makes its own unpredictable choices. As a result, the process is not controlled by the artist and so, from the Office’s perspective, Midjourney is the real author of the images generated. And because Midjourney is not human, no copyright can be conferred. It was on this basis that the Office determined that the artwork incorporated into Kashtanova’s comic book is not subject to the protection of copyright. In contrast to technologies like photography or Adobe Photoshop, which the Copyright Office regards as “tools” and therefore sufficiently precise to confer authorship (and therefore copyright) on the artist, it is the “unpredictable” nature of Midjourney’s creative process that sets it apart. Of course, by distinguishing Midjourney for its lack of predictability, the Office sets the stage to exclude other forms of art that rely on chance in the future."
year_published = 2025
