["https://rightclicksave.com/article/the-truth-of-generative-art-interview-adam-berninger-feral-file"]
title = "The Truth of Generative Art"
description = "Adam Berninger shares his curatorial vision for Feral File’s new show with Emily Edelman"
full_description = "‍Adam Berninger is an artist, curator, and founder based in New York and a graduate of Rhode Island School of Design. For the past 20 years, he has created works in photographic, painted, algorithmic, and written media, and served as a creative director for industry-leading brands with a high regard for taste. His work maintains an exploration of how technology, beauty, the written word, and interactive experiences can provoke a deeper understanding of our shared existence. Adam is also the founder of TENDER, a generative art hub, community, and advocate serving to advance the medium of computational art. Through TENDER, he collaborates with generative artists to create new long-form series. At the heart of his practice across platforms, artworks, and media is a dedication to revealing the essence of art itself.‍ Emily Edelman is a digital artist and designer who lives and works in Brooklyn. With a background in typography and the design of physical spaces, her work pushes the definition of text and communication as art objects. Emily’s first long-form generative series was Asemica, released on Art Blocks Curated in November 2021. She has also exhibited with Artsy, Bright Moments, EXPANDED.ART, theVERSEverse, VellumLA, Verse, and Vertical Crypto Art. She holds a BFA in Graphic Design from RISD and is the co-founder of Token Art, an art and tech unconference. In 2023, she curated the exhibition, “On Water,” at The Seaport in New York City. ‍"
