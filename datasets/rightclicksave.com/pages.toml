["https://rightclicksave.com/article/on-net-art-postinternet-and-cryptoart-interview"]
title = "On net.art, postinternet, and CryptoArt"
description = "Vuk Ćosić, Marisa Olson, Auriea Harvey, and Jason Bailey discuss the changing language of digital art with Alex Estorick"
full_description = "‍Alex Estorick: Vuk, what do you recall from the early days of net.art and how do you feel about terms like “postinternet” and “CryptoArt” that emerged subsequently? ‍Vuk Ćosić: Although none of us here is comfortable with this model of representing a decade or group of people, if we play nice and compare these generations or waves, I like to begin with central motivations. Why did we go into our practice? What was creating our community of practice? I believe that, for the first generation of the early ’90s and for my group that came about a bit later in 1994 or ’95, the motivation was absolute autonomy. We were fascinated by concepts such as artist-run centers and publicly accessible art such as street art. For our musical preferences, we were into punk or new wave, and we also saw the disaster of grunge in terms of their super-rapid emancipation and avalanche of suicides that came immediately after. These were the cultural influences and surroundings that we appreciated. Without being evil or cynical about it, maybe it is possible to say for postinternet art — and I’m really keen to hear what Marisa has to say about it — there was not such a rough, confrontational attitude toward the art system as ours. We were full of piss and vinegar. Then, a generation later, we have seen an equally soft relationship to the art market of crypto, which I guess is how the generations differ. Our motive was to stay away deliberately from the art system and the art market because we thought that they were damaging to sublime artistic practices and high ideals. For us, everything else was a sell-out and we were cross with our friends who went to work in art schools. We thought they had sold out. Exhibiting in a gallery was like a defeat and the dialogues we had were brutal. We were purists who held to this idea of our own continent where you run and run and, as the first one, you look back and see your traces all the way to the horizon. That was the beauty and the adrenaline rush, and it lasted for a very brief period of time until we realized: “Oh, we need a critical and theoretical apparatus.”"
