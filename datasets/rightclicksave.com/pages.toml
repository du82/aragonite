["https://rightclicksave.com/article/is-blockchain-a-medium"]
title = "Is Blockchain a Medium?"
description = "A group of all-star artists shares its answers with Anika Meier, Micol Ap, and Jesse Damiani"
full_description = "“When Crypto Meets Conceptual Art, Things Get Weird” was the headline of a 2018 article in The New York Times about Irish artist Kevin Abosch. Four years on, and things are even weirder. NFTs have disturbed the conversation about art on the blockchain, with hype driving a new market for digital assets. The crypto crash of 2022 offers a chance to reflect on how digital art might be valued beyond a mere vehicle for speculation. At RCS we believe that, wherever possible, artists should be the ones to shape the terms by which their work is critically evaluated. To this end, Anika Meier, Micol Ap, and Jesse Damiani invited eight leading artists from the NFT movement to reflect on the history of art on the blockchain, which they have been so instrumental in writing. ‍Kevin Abosch: I began using blockchain as a method in my work in late 2012. I cut my teeth by mining Dogecoin to help better understand the mechanics of it all. As an artist, I try to stay up to date on emerging technologies. I ask myself, “How can I leverage technology in my practice as an artist?” Immediately I recognized the potential to use the blockchain as a medium. I had already been working with cryptography for years. These magical alphanumerics that had this potential to serve as stores of value dovetailed nicely with my generative work, which more often than not deals with distilling emotional value from a given subject using both natural and synthetic proxies. For me, these alphanumerics worked perfectly as proxies. The blockchain for me is like a playground, a forest, or even like the inside of my head. When AI and deep learning are added to the equation, truths can emerge from all of this encrypted data. Things that were never meant to be seen may perhaps be seen. By 2018, when things really kicked off, I tokenized myself on the blockchain as a reaction to feeling commodified as an artist due to some successes I’d had in the past. ‍AM: I am glad to hear that you keep finding new ways to use blockchain as a medium. Rhea, how did you get started?"
