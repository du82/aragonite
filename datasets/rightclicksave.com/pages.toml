["https://www.rightclicksave.com/article/on-the-early-days-of-hic-et-nunc"]
title = "On the Early Days of Hic Et Nunc"
description = "Tais Koshino and Michael Straeubig reflect on the moment when crypto art converged on Tezos"
full_description = "RCS: Tais, how did you get into Hic et Nunc (HEN) and what was your experience of the early community? Can you give us an insight into what HEN means from the vantage point of Brazil? ‍Tais Koshino: I wanted a democratic place where people from the Global South and those from the queer community could be agents in a decentralized environment. My research is around the practice of contemporary drawing. In 2020, with the onset of the pandemic, I started attending an artistic mentorship group. Our task was to create a three-dimensional artwork, which led me created the digital simulation, jardim | 枯山水 | garden (2021), alongside my brother, KOSHA, who is also an artist working with game design. In February 2021, I joined a new mentorship focused on digital art. My brother told me about an NFT platform that a friend of ours, Rafael Lima, was creating. I had heard about NFTs, and because I could write and had practiced curation, he invited me to be part of the team. Rafael’s main goal was to create a platform where anyone could mint an NFT. On March 1, he deployed it officially on Tezos and I created my first NFT. In less than a week more than 2,000 objects had been created. Everything got so big so fast, but it was not our intention. Everyone was talking about how Ethereum was bad for the environment, so we launched a very minimal platform that was nostalgic for digital artists. We also had several big names from the digital art scene, including Mario Klingemann and Micol from VerticalCrypto Art, who were advocating for HEN. We weren’t prepared for what happened and we didn’t have much structure. But by the end of March, after less than a month, we were already celebrating the milestone of 10,000 objects. I organized an event, OBJKT4OBJKT, with Amelie Maia. She had reached out and invited me to co-found a collective because I’m a Japanese Brazilian cis woman and lesbian. I think this movement made the Brazilian community grow quickly. A lot of people wanted to create NFTs who didn’t have the opportunity or the money because it was very expensive at the time to mint on Ethereum. HEN filled a lot of gaps — anyone could mint for less than $1 and, as a proof-of-stake chain, Tezos was more environmentally friendly. Even digital artists who didn’t think their work would succeed as NFTs due to their associated aesthetics were getting involved. On HEN, people were starting to experiment with minting images that had a totally different aesthetic. Those from different backgrounds and artistic practices now had an opportunity to create in the NFT space. It felt like anything was possible."
year_published = 2025
