["https://www.rightclicksave.com/article/art-in-the-age-of-co-creation"]
title = "Art in the Age of Co-Creation"
description = "Peter Bauman considers the place of NFTs in the history of audience participation, from Constructivism to GRAV"
full_description = "NFTs have integrated art into our everyday lives more intimately than ever before, allowing both marginalized creators and audiences to participate in the market for digital art. They have democratized the art world into what I have termed Art3 and, in the process, have decentralized creativity. In this NFT space, collectors can view their collections, purchase new works, and even shape artistic outputs simply by connecting a crypto wallet. While blockchain technology and NFTs have catalyzed this development in the present, the principle of using new technologies to make art more accessible, removing it from the confines of the physical gallery, and reimagining the role of the artist emerged over a century ago with Constructivism. A crucial figure in the movement, Vladimir Tatlin believed that artists should be retrained as engineers to bring about a modern, industrial society. His plans for the Monument to the Third International (1919-20) — a rotating tower of iron, glass, and steel that was never executed — heavily influenced the kinetic constructions of Naum Gabo and Antoine Pevsner that, in turn, foreshadowed the experiments of Groupe de Recherche d’Art Visuel (GRAV) four decades later. GRAV was a collective of eleven opto-kinetic artists active in Paris from 1960 to 1968. Founded by Julio Le Parc, François Morellet, and others including pioneering computer artist Vera Molnar, GRAV represented a spiritual successor to Constructivism in its focus on technical mastery, mechanical movement, and industrial materials. As expressed in its 1963 manifesto, the movement sought to engage the public through participatory environments. These included a Labyrinth, produced for the third Paris Biennial of 1963, whose goal was to provoke different audience reactions and to critique legacy art world institutions. The thrust of this critique was three-fold: that art should not be found only in museums or galleries; that the concept of individual authorship was outdated; and that art should not be accessible only to an intellectual elite. Rather, enhanced interactivity required that art be taken directly to the public, should involve co-creation (and shared authorship), as well as universal accessibility."
year_published = 2025
