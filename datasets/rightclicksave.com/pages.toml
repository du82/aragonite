["https://rightclicksave.com/article/decentering-the-human-kadine-james-interview"]
title = "Decentering the Human | Kadine James"
description = "The artist and immersive curator is exploring the dynamic nature of digital identity"
full_description = "‍‍‍Alex Estorick: You’ve stated categorically that “the metaverse conversation is over”. Is it now possible to imagine virtual space beyond a land grab or is virtual real estate the new reality? ‍Kadine James: That is right, I think the metaverse conversation has moved on and will continue to evolve as we build the future of the internet. I am constantly searching for new ways to experience the future of the web. Over the years, I have built multiple worlds and multi-user games with Unity and Unreal Engine. I have also built the Immersive Kind Gallery on Oculus with London-based architects Nicola and Seth Rutt of Studio MULTI, observing the rise and fall of land-grabbers. I am also thinking about AI and our digital citizenship and how this will evolve as the technology allows us to do more. At Artificial Rome, we’ve seen this vision come to life through projects including Diesel’s Metamorph Experience and Legacy of Tomorrow, which involves metahumans. We have also created an interactive billboard for Mercedes-Benz that blends virtual and physical experience. ‍AE: You’ve described a process of “becoming other” through avatars and data bodies that inhabit different spaces simultaneously while speaking multiple languages. How do you understand identity in a more-than-human context? Tell us about some of the projects you’ve experienced that decenter the human.‍ KJ: Identity in a more-than-human context involves embracing the fluidity and multiplicity of our digital selves. Through avatars and data bodies, we can inhabit various spaces simultaneously, expressing different facets of our identity. XR [extended reality] cloud technologies allow us to experience environments that decenter the human by integrating AI with the immersive 3D web, fostering a sense of shared existence with communities and digital entities. This redefines identity — moving beyond a singular, anthropocentric perspective toward a more interconnected, dynamic experience."
year_published = 2025
