["https://rightclicksave.com/article/nft-artists-must-unite-against-ip-trolls"]
title = "NFT Artists Must Unite Against IP Trolls"
description = "Without a Digital Art Defense Fund, artists will soon be forced to foot hefty legal bills all on their own"
full_description = "If you have ever taken an Uber or Lyft in New York City, you may have noticed you were charged a small fee on top of the price of your ride. If you ask your driver the reason, they will tell you every rider pays it, and it goes into The Black Car Fund to support drivers injured on the job. Before New York state legislators created The Fund in 1999, livery drivers were on their own if they got injured. Today, the Fund pools resources to cover medical bills, physical therapy expenses, and lost wages. As we’ve noted previously, artists who are creating innovative digital works take on a potentially costly burden when they mint NFTs — that they will have to defend themselves against copyright or trademark infringement lawsuits. Copyright law is intended to promote progress in the arts, and US courts should ultimately decide that NFTs made using GANs do not infringe copyright. US trademark law also recognizes “fair use,” a category into which many fine art NFTs should fall. However, those decisions will likely come at a steep cost. Some unlucky artists will have to pay the price of making the arguments in federal court. Not only is it unfair that they’ll be answering individually for the activities of the whole community, but the whole community will be impacted by the outcomes. How persuasive these initial defenses are will set a precedent for the field as a whole. NFT artists who are sued for infringement in the coming months and years will need access to resources, just like injured ride-share drivers. We are therefore proposing that a fund be created to offer support with the legal fees. The Digital Art Defense Fund would operate in much the same way as The Black Car Fund. The Fund can then disperse the funds, according to predetermined criteria, to artists defending themselves against infringement lawsuits. The Fund could be managed via DAO, or through another trust-like mechanism. The Digital Art Defense Fund would serve many purposes. First, it would dampen the coercive effects of the threat of suit. The current Notice-and-Takedown process makes it easy to complain about copyright violations and have materials quickly removed. For the most part, host sites simply remove the object of alleged infringement, leaving creators with little ability to push back. This is because to object (by filing a “counter notice,” in the terms of the statute) is to agree to show up in court wherever it is requested. Few people take this lightly since federal litigation is expensive. The Fund would give creators more leeway, freeing them from the burden of defending their work alone. This should embolden artists to fight back against takedowns, keeping more material online and accessible to the public."
year_published = 2025
