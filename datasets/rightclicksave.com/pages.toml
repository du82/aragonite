["https://rightclicksave.com/article/the-art-of-embodied-immersion-alida-sun-interview"]
title = "The Art of Embodied Immersion | Alida Sun"
description = "The elusive creator discusses the power of generative art to encode ethics in digital aesthetics"
full_description = "‍Alex Estorick: As an artist whose work combines generative art with immersive experiences, do you feel different from your peers in Web3? ‍Alida Sun: When you have a practice that is grounded in technology, it’s a great entry point for supporting other artists who don’t get the recognition and compensation that they deserve. I actually got into generative art through sound and audiovisual practices. I’m not a musician myself, more a noise artist, but sound has been integral since the beginning. I’ve also collaborated with sound artists, including the DJ and composer, Miro, who, in a matter of days, crafted the most incredible musical accompaniment and soundscape for my installation performance at Kraftwerk Berlin. I have massive respect for musicians. This space would be so much better if we could onboard the many people who have experienced the horrors of the music industry. When I started out with interactive installations, sound was often an element that allowed people to interact with the work, to generate it, and help drive its life. As I’ve delved more into the work of sound artists, including Fluxus, alongside critiques of the attention economy, it’s become clear to me that sound and noise transform one’s everyday experience. The mundane is oftentimes very inspiring to me, but my interactive audiovisual noise experiments don’t really follow convention. I respect a lot of the more skeuomorphic works out there, but my focus and inspiration has always gone more toward sensory real-time experience. I think that synesthesia is a lot more common than people realize. Based on the responses I’ve received through my work with immersive platforms that are geared toward diverse audiences, simply by viewing an audiovisual sketch people feel transformed and their headaches clear up. We’re seeing an increasing amount of ableism against neurodivergence, and while some social media platforms are dumpster fires, they are also a means for people to understand how their own brains work and to reconsider what constitutes “normal” brain behavior beyond data extracted from a very specific group of white men."
year_published = 2025
clearnet = "https://rightclicksave.com/article/the-art-of-embodied-immersion-alida-sun-interview"
