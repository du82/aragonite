["https://rightclicksave.com/article/on-crypto-arts-mexican-roots"]
title = "On Crypto Art’s Mexican Roots"
description = "NFTs continue to offer hope for a fairer society in Mexico argues Alonso Cedillo"
full_description = "Mexico City is a promising hub for contemporary art. It’s relatively cheap to live in, especially for the expat community, and restrictions are non-existent. However, this reality shouldn’t be romanticized. When the expats started calling Mexico City the “New Berlin” a few years ago, outrage spread as this couldn’t be further from the truth. Our city is extremely violent and dangerous outside of its tourist areas, where Mexicans are being displaced by rising rents, some of them even dollarized. The national homicide rate is frighteningly high, while more than half of the population is unbanked. It might look cheap if you earn in dollars and spend in pesos, but here the minimum wage is approximately 1.09 USD per hour. The writer Fran Ilich is a pioneer of this movement, which followed the emergence of tactical media and post-internet art alongside the Zapatistas (EZLN). In 1998, the Electronic Disturbance Theatre created FloodNet, a virtual sit-in to protest against the Acteal massacre. A year later, Ilich relocated to Berlin, where he became part of Nettime, developing long-term collaborations with figures including Natalie Bookchin, Ricardo Dominguez, Geert Lovink, Florian Schneider, Pit Schultz, and Alexei Shulgin. Seven years later, Ilich was living in Mexico City when the EZLN announced via their Sixth Declaration of the Lacandon Jungle that they had become an educational guerilla. That was the beginning of The Other Campaign to recognize and support indigenous rights in Mexico, which adopted the motto “Another world is possible.” To this end, an open call for projects was put out to imagine new worlds founded on togetherness. Ilich ran the Zapatista servers and in 2005 created the Digital Material Sunflower (DMS) — a digital coin — and Spacebank, a rebellious virtual bank and exchange that offered credits, commodities, and stocks to the unbanked. In 2009, he was a keynote speaker at the First World Festival of Dignified Rage alongside leading members of the Zapatista army, as well as artists Francisco Barrios (“El Mastuerzo”) and Roco of Maldita Vecindad."
year_published = 2025
