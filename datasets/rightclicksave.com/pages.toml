["https://www.rightclicksave.com/article/an-interview-with-frieder-nake"]
title = "An Interview with Frieder Nake"
description = "The mathematician and pioneer of computer art speaks to Mark Amerika about the early movement and the differences between machines and humans"
full_description = "I’ve known Frieder Nake, one of the pioneers of computer art, for 25 years. Our friendship began at the University of Colorado, where I serve as Founding Director of the Doctoral Program in Intermedia Art, Writing and Performance. Nake’s arrival at CU Boulder in the 1990s as a Visiting Professor of Computer Science prompted a decades-long dialog between us about art, algorithms, information aesthetics, semiotics, artificial intelligence, remix culture, and the political toxicity of neoliberal capitalism. Nake, who celebrates his 84th birthday later this year, is an historical figure who, in 1965, exhibited in one of the first shows of computer art in Stuttgart alongside fellow Algorist Georg Nees. In 1968, his works were included in the exhibition, “Cybernetic Serendipity,” at the ICA in London and in “Tendencies 4” in Zagreb. As part of the first generation of computer artists, including Vera Molnar, Manfred Mohr, and A. Michael Noll, Nake pioneered a radical break from traditional artistic media, building a platform for computer-based generative art to gain a foothold in contemporary art. Nake’s radicalism can be summed up in a statement he made in the 1960s: Given the recent explosion of interest in generative art, I asked the artist how he feels about current developments and his own place in art history. MA: Even as generative art becomes de rigueur not just in the digital art space but in the larger contemporary art world, including recent auctions at Sotheby’s and Phillips, there was a time in the early 1960s when you, as a young man studying mathematics, were given an opportunity to develop a software program for a newly constructed automatic flatbed drawing machine — the Zuse Graphomat Z64. Can you describe what it was like to suddenly find yourself in this position and what you discovered?‍ FN: The factual story part to this is simple. We are in the year 1963. I am still a student, as you mention, but I am approaching the end of my studies. Our situation as students in West Germany is extremely liberal (compared to the US). As students of mathematics, it is even more liberal. I am working in the Computing Center at the University of Stuttgart. My position is something like a teaching assistant or software developer. My position is, indeed, marvelous: I am helping the person who is in charge of the “program library.”"
