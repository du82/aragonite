["https://rightclicksave.com/article/the-interview-bjorn-staal"]
title = "The Interview | Bjørn Staal"
description = "The artist discusses how generative art entangles new technology with community"
full_description = "Bjørn Staal, also known as nonfigurativ, is a Norwegian artist, programmer, and researcher whose work explores the dynamic interactions between digital systems and human perception and behavior. With more than a decade of experience in multidisciplinary design and software development, Staal co-founded the experimental art and design studio Void in 2015. Focused mainly on the development of large-scale interactive installations, Void has gained international recognition for its work at the intersection of design, architecture, technology, and art. Since leaving Void in 2023, Staal has focused on his own artistic practice, exploring how algorithms can enrich our understanding of what it means to be human in an age where our agency is increasingly outsourced to tech companies. His work has been exhibited nationally and internationally in online and physical exhibitions as well as installations in public spaces. In September 2024, Staal had his first solo exhibition at Wintercircus in Ghent, Belgium."
