["https://www.rightclicksave.com/article/the-color-of-code-interview-jeff-davis"]
title = "The Color of Code | Jeff Davis"
description = "The artist tells Alex Estorick how he turned painting into a digital system to generate art"
full_description = "‍Jeff Davis: I’ve been producing art since the early 1990s, after studying fine art as an undergraduate. I’m trained in traditional printmaking techniques and have an MFA in painting and drawing. At the beginning, I was making very hard-edged geometric work that probably looked digital. In grad school, I got hold of design software for the first time — early digital tools like Adobe Photoshop and Illustrator, which I used for planning and sketching. The digital component helped me to map out the proportions, scale, and color relationships in my work. At the time, printing technology wasn’t fantastic and I wasn’t keen on the quality of the digital prints I was seeing. Something shifted in the late ’90s, when I discovered printing technology that was suitable for a fine art context. Around 1999, I transitioned from preparing works digitally to becoming a digital printmaker. But it was still a non-generative and non-computational form of abstraction based primarily on architecture — the skyline of Chicago, for instance. I would take the basic mathematics of my surroundings, simplify them, find the order, and then rebuild them into highly austere geometric abstractions. That led me to develop a geometric framework and a compositional and color framework with which to approach art. I then began introducing randomness into that system in order to build things with their own volition. Initially, I would create Excel spreadsheets to make random compositional decisions for me, but that became tedious. Around 2010, I discovered Processing and found that I could build a system to make random decisions that could also do all the drawing for me. I’ve been working that way ever since. ‍AE: I’m trying to understand the difference between developing an idea to be painted and developing an algorithm to be generated. Do you find yourself more influenced by painters or computational artists? ‍JD: Even when I was a painter working with traditional media, I was still thinking structurally and systematically. Over time, I developed an unconscious system with an inherent rule set — right angles, whole number ratios, thick black lines, flat colors, and color relationships born of numeric sequences. I started to think that there were three or four related things that are serial, that always use the same rule set or concepts. It was a natural transition for me to go from my original way of working to thinking about the system set itself. Now I let randomization happen inside of that system, which removes one part of the decision-making process."
year_published = 2025
