["https://rightclicksave.com/article/shunsuke-takawo-on-generative-art-in-japan"]
title = "Shunsuke Takawo on Generative Art in Japan"
description = "Ahead of Right Click Live in Tokyo, the artist shares his own local and global influences with Alex Estorick"
full_description = "Alex Estorick: Takawo-san, the Japanese tradition of ukiyo-e, especially its visions of a floating world, continues to influence Western image-making. In what ways does your own generative art practice cross-fertilize different traditions? ‍Shunsuke Takawo: Thank you very much, Alex-san. Indeed! Recently I was excited to find some great artworks, such as Mark Webster’s series, Searching for Hiroshige (2021) and Richard Nadler’s “Japanese GenArt Collection” (2022). Above all, their research is meticulous and beautiful, and I respect their work. Japanese culture and traditions such as the four seasons, patterns, and colors are established through subtle combinations. Although I often refer to them in my code, they are imprinted naturally on a subconscious level. But I also love rigid, Western frameworks, including the designs of Josef and Anni Albers at the Bauhaus and Bernd and Hilla Becher’s photographs. Several factors have contributed to the growing interest in Japanese culture in Web3. Manga and anime are prominent exports of contemporary Japanese culture, and people often refer to Otaku culture as a meme. In the context of generative art, much respect is owed to computer art OGs such as Hiroshi Kawano and Computer Technique Group (CTG). ‍ST: In 2008, I graduated from the Institute of Advanced Media Arts and Sciences (IAMAS) where I researched new ways of viewing digital photography and created an interactive application. I subsequently exhibited my work, Depth of the Field - Processing Photography Blink Series (2008) at Yamaguchi Center for Arts and Media (YCAM), which used computer vision to detect the blink of an eye when viewing a photograph. However, it was when I met Zach Lieberman, who has also used openFrameworks, that I yearned for the freedom to express myself with code. In 2015, I started writing a daily personal code using Processing. Then, in 2019, I started writing code in p5.js, publishing it in OpenProcessing under a Creative Commons license. Through my #dailycoding I have come to regard programming languages as natural languages, as much as they are also sophisticated algorithms."
