["https://rightclicksave.com/article/living-artwork-alexandra-daisy-ginsberg-interview"]
title = "Living Artwork | Alexandra Daisy Ginsberg"
description = "With the environmental cost of AI increasingly apparent, one digital artist is regenerating natural ecosystems"
full_description = "Dr Alexandra Daisy Ginsberg is a multidisciplinary artist examining our fraught relationships with nature and technology. Through artworks, writing, and curatorial projects, Daisy’s work explores subjects as diverse as artificial intelligence, synthetic biology, conservation, biodiversity, and evolution, as she investigates the human impulse to “better” the world. She experiments with simulation, representation, and the nonhuman perspective to question the contemporary fixation on innovation over conservation, despite the environmental crisis. Daisy spent over ten years experimentally engaging with the field of synthetic biology, developing new roles for artists and designers. She is the lead author of Synthetic Aesthetics: Investigating Synthetic Biology’s Designs on Nature (MIT Press, 2014), and in 2017 completed Better, her PhD by practice, at London’s Royal College of Art, interrogating how individuals’ powerful dreams of “better” futures shape the things that get designed. She read architecture at the University of Cambridge, was a visiting scholar at Harvard University, and received her MA in Design Interactions from the RCA. In June 2023, Daisy won the S+T+ARTS Grand Prize — Artistic Exploration from the European Commission for her experimental interspecies living artwork Pollinator Pathmaker. Commissioned Editions have been planted for LAS Art Foundation at Museum für Naturkunde Berlin, for the Serpentine, London, and at the Eden Project, Cornwall. Daisy exhibits internationally, including at MoMA, New York; the Museum of Contemporary Art Tokyo; the National Museum of China; the Centre Pompidou, Paris; and the Royal Academy, London. Her work is held in private and museum permanent collections, including The Art Institute of Chicago; Cooper Hewitt, Smithsonian Design Museum, New York; Therme Art, Berlin; and ZKM Karlsruhe. Daisy is a resident at Somerset House Studios, London, and opened her first American solo exhibition at the Toledo Museum of Art in April 2023."
