["https://rightclicksave.com/article/empire-state-of-crypto-art-interview-nft-gallery-how-high-the-moon"]
title = "Empire State of Crypto Art"
description = "As a new show opens in New York, a group of African artists discusses the power of an NFT gallery"
full_description = "Jessica Deutsch: The mainstream art market has often shown an interest in African art. What makes the NFT space different, in principle, is that artists stand to benefit personally from their own creations by controlling their works’ circulation. How did you get into NFTs and what has been their impact on your career so far? ‍AFROSCOPE: A mix of curiosity and good fortune led me to NFTs. I was invited to Clubhouse in late 2020 and I kept coming across different rooms where NFTs were being discussed. The more I discovered, the more I felt the urge to dive in fully. I started experimenting and spreading the word to folks in my various communities. Since then, NFTs have had a significant impact on my career, pushing me to better articulate what my work is about, build new connections with other creative professionals, and participate in exhibitions all over the world, as well as councils, DAOs, and even a crypto art residency. These are all things that would probably have never happened had I not dipped my toe into NFTs. ‍Anthony Azekwoh: I entered the space in late 2020 just as I was discovering crypto. That was huge because, as an African, you’re automatically disadvantaged financially by your geography. Services like Paypal, Stripe, etc. don’t work, so the ability to plug into a global market changed everything for me and it’s been a crazy ride since then. ‍Delphine Diallo: It certainly had a significant impact on my life. I wasn’t particularly fortunate, but [my] location played a crucial role. I’m based in New York, and when it comes to finance and the art world, especially in terms of NFTs and cryptocurrencies, New York is the epicenter. My friends started talking to me about NFTs and the crypto scene around 2020, and I had a collector friend who is a financial advisor for major companies. He was the first to approach me about this market, but initially I wasn’t very interested. It felt like a whole new world, and I didn’t want to dive in without understanding it fully."
