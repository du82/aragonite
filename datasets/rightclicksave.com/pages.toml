["https://rightclicksave.com/article/on-the-hypercentralization-of-crypto-art-buenos-aires-argentina"]
title = "On the Hypercentralization of Crypto Art"
description = "As Bright Moments arrives in Buenos Aires, the local community considers the prospects for digital art in Latin America"
full_description = "We find it difficult to distinguish the digital from the traditional art scene. In Latin America, digital art and experimentation with computational processes derive from traditional art. From the pioneers of electronic art in the 1960s to the present, digital art is a fundamental part of contemporary art curricula. Digital art is fundamental to contemporary art in Argentina and Chile, and it is common to see exhibitions that establish connections between the two. The concepts and problematics addressed in contemporary digital art are similar to those questioned since the beginning of electronic art. While some artists without a traditional art background may mistakenly believe that their approaches are novel, this is simply due to a lack of knowledge of the vast conceptual and theoretical framework established in the early days of electronic art. We do not like to base the discussion on the premise of “emerging and hard-working artists” but rather on a latent scene that enhances the collection and circulation of art. Our art transcends current circumstances with resilience and effort, but mainly with art. It is amusing but also concerning to see how the validation of promoters and curators is concentrated within certain hubs. This reflects a somewhat myopic view of the global digital art panorama. If the discourse is based on decentralization and providing opportunities on the margins, then why is it still centered around Western capitals? Why are the same artists always curated into exhibitions and events? There is not one single “crypto art” community, but rather a landscape with many active sub-communities brought together out of mutual respect and artistic appreciation. We are very interested in projects like Refraction, which aim to foster horizontal collaboration, respect, and mutual admiration rather than fetishizing the margins or tokenizing demographic diversity. We all inhabit information-circulation-validation bubbles inclined towards certain types of art and aesthetics, which can be centralizing. We will need to reformulate our vision to question the status quo and change this in the future."
year_published = 2025
