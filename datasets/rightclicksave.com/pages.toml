["https://www.rightclicksave.com/article/nfts-and-the-risk-of-perpetual-colonialism"]
title = "NFTs and the Risk of Perpetual Colonialism"
description = "Luke Hespanhol asks whether Web3 can really avoid the oppressions of Web2"
full_description = "But despite the many artists who have established new audiences and revenue streams through the affordances of the NFT, for many, those benefits remain a mirage. While arguments about the feasibility, suitability, and sustainability of NFTs continue to rage wildly, I would like to address the underlying tenets of the crypto ecosystem and its advocacy, and how they may risk, intentionally or not, perpetuating centuries-old colonial practices.‍ Before continuing, it is necessary to explain my position toward this subject. I was born and grew up in Brazil, a former colony of Portugal. While independent as a nation since 1822, echoes of colonialism continue to play out in Brazil (and Latin America more broadly) to this day, through practices of socio-economic exclusion directed particularly toward Indigenous and Black people. I am neither Indigenous nor Black, having come from a family of European migrants, and acknowledge my privilege within that context, undoubtedly translated into the opportunities I had access to, including higher education. Later in life, I migrated to Australia, where I currently live and work as an academic researching design, technology, culture, places, and communities. Like Brazil, Australia is a former European colony, and British colonial dynamics continue to define cultural narratives today, reflected in the denial of past and current atrocities toward Aboriginal and Torres Strait Islanders, as well as refugees and many migrant groups. This background shapes my approach to the topic of this essay, which, I caution the reader, is itself biased.‍ It is no coincidence that proponents of new technologies are often referred to as “tech evangelists.” The uncritical optimism that characterizes much of the current discourse on Web3, the non-negotiable adherence to its principles, and the assumption about the inevitability not only of the technology, but also of the context and world view in which they operate, often veer into dogmatism. As argued by Jeff Doctor (Cayuga from Six Nations of the Grand River Territory (in the land today known as Canada)), tech evangelism operates on the premise of how new technology can benefit people, empowering them with abilities they previously lacked.¹ Under these narratives, new technologies are sold as tools of emancipation, if only people can accept them — an approach reminiscent of colonial missions which, in the past, crossed the seas with the self-declared goals of rescuing natives who would otherwise live obliviously in darkness, eternally."
