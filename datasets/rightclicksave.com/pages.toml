["https://www.rightclicksave.com/article/is-it-possible-to-decolonize-the-blockchain-and-nfts"]
title = "Is it Possible to Decolonize the Blockchain and NFTs?"
description = "A group of international scholars addresses the current barriers to progress"
full_description = "Luke Hespanhol: With the hype around NFTs reaching a peak in 2021, we have seen many individuals and communities taking the opportunity to raise awareness about their art and culture. That includes some First Nations groups and those in the so-called Global South. Is there a risk here of buying into a nebulous ecosystem that provides quick gains in the short term, yet ultimately reinforces colonial structures?‍ Soraya Kouadri Mostéfaoui and Victoria Neumann: As argued by Mustafa Ali “the computing phenomenon itself is inherently colonial as it is founded upon, and continues to embody aspects of colonialism.” NFTs are no different and certainly reinforce the legacy of colonial structures (social classes). ‍Gustavo Romano: I see quick profits only for a select few. NFTs, like social networks, help to establish a new capitalist pyramid, whereby a few “influencers” rest on a multitude of followers. And as in any pyramid dynamic, the later you join, the less likely you are to make a profit, thereby feeding the pyramid and validating its dynamics.‍ Eduardo Navas: NFTs are the latest stage in a dematerialization of economic exchange. The problem for the blockchain, which goes back to early barter economies is: Who is able to perform and regulate its transactions? Blockchain technology may be decentralized at the moment, but the people who developed it as a form of exchange are part of, or emerged from, the ruling class, and hence have the proper knowledge to disrupt it. They may have what appears to be a subversive approach but, eventually, blockchain technology and NFTs will be absorbed by the established system. What is promising about moments like this, when major technological changes take effect, is that people in disadvantaged positions can find ways to participate. This contributes to cultural changes that provide opportunities to develop more stable lives and even wealth. However, this is meaningless if those who are able to join the fray allow pre-existing paradigms of subjugation to remain in place. Whichever paradigm emerges will have a different set of groups struggling against each other. This is the nature of social networks when we look at human history — struggle remains, but the players will be different and more diverse. In-groups will not be defined simply by race and ethnicity, but will follow more complex ideological divisions. This is already happening."
year_published = 2025
