title = "The Case for Classical Music NFTs"
description = "NFTs can help to revive an industry hit hard by the pandemic argue Christos A. Makridis and Soula Parassidis"
full_description = "It may surprise you that roughly $1.2 billion of NFT sales have so far involved music NFTs. But given its importance to the prehistory of generative art, classical music is yet to realize its market potential in the NFT space. Aside from isolated examples, the classical music industry remains behind the curve, partly due to repeated COVID-19 lockdowns that have forced musicians to find novel solutions to the lack of live recitals. Sadly, a number of studies show that classical musicians have suffered disproportionately in their mental health over the course of the pandemic. While recent data reveals that, between 2019 and 2020, the US arts economy shrank at nearly twice the rate of the economy as a whole, with a 40% decline in motion picture and video production, performing arts presenting, and performing arts companies. As we pointed out in our recent whitepaper, in the US at least, artists have been earning below the national average income despite higher levels of educational attainment. Of course, the pandemic also catalyzed an NFT explosion that stands to level the playing field by allowing creators across the arts to build their own markets based on their skills and followings. The most recent available data shows that classical music streaming revenue more than doubled between 2016 and 2018 to $140.8 million worldwide. This proves that classical music has a future as a digital product. What needs to change is how musicians are compensated. By cutting out (or at least eroding the hegemony of) traditional publishers, NFTs allow creators to connect directly with their fans. Platforms like OneOf aim to support musicians by leveraging their brands, while Royal is purpose-built to ensure that artists receive income every time a song is streamed. Classical music has particular qualities that are tailored to the current market for digital art. First, with practically all classical music now in the public domain, digital artists can save on licensing fees if they want to use music to enhance audience experiences. Second, classical music provides an intellectual foundation for the recent surge of interest in code-based art, whose long history reinforces the cultural importance of NFTs in reviving generative practices. Multiple pioneers of generative art have spoken recently of the overlap between musical and visual systems, with Vera Molnar asserting:"
