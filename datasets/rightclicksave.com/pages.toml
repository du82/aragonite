["https://rightclicksave.com/article/an-interview-with-alicja-kwade"]
title = "An Interview with Alicja Kwade"
description = "Following the launch of her genesis NFT, the artist tells Anika Meier why blockchain is the perfect way to share her DNA"
full_description = "Alicja Kwade is, unquestionably, one of the most important contemporary artists working today. Having previously participated in the Helsinki Biennial, Desert X, Setouchi Triennale, and the 57th Venice Biennale, in 2019, she was selected for The Roof Garden Commission for The Metropolitan Museum of Art. Titled, ParaPivot (2019), her work conjured a miniature solar system in steel and stone. A German artist with Polish heritage, Kwade creates sculptures, photographs, videos, installations, and now NFTs that utilize the alchemical properties of material to reveal the systems that underpin the world. Here, she speaks to Anika Meier about value and power in the art world, reflecting on blockchain as a medium through her first NFT project, Self-Portrait. Alicja Kwade: I made the conscious decision when I was about five years old. It has something to do with my family history. My father is an art historian and my mother a cultural scientist. My father ran a gallery in Poland when I was a kid. I was a shy and fearful child. I didn’t like talking to other people and preferred to be alone. My parents sent me to art kindergarten because I was always drawing. I was good at it and found self-affirmation in it, so I showed [my work] to the other kids and earned their admiration, which was fantastic. There were many artists around me, and I had no idea you could do anything else with your life. When I arrived in Germany in 1986, after my parents had fled from Poland, [art] became a helpful tool for me, as I did not know the German language but had a means of finding connection and recognition. Being diagnosed with dyslexia [also] meant that my spelling was no longer allowed to be assessed in any subject. But at the age of 19, after achieving surprisingly above average grades, I applied and was accepted to study medicine at the Humboldt University of Berlin. I studied the subject for two semesters, and then decided I wanted to do art exclusively. ‍AM: You wanted to work with a gallery while you were still a student [at Berlin University of the Arts]. Why was that, and are galleries still as important today as they were 20 years ago? ‍"
