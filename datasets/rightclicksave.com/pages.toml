["https://rightclicksave.com/article/interview-when-ix-shells-met-fingacode"]
title = "When IX Shells Met Fingacode"
description = "Two of the world’s leading generative artists tell Abigail Miller about the importance of community to the art of code"
full_description = "Abigail Miller: You both use pseudonyms. Junior, you go by the name, Fingacode, and Itzel you’re known as IX Shells. Why do you use a pseudonym in this space? ‍Fingacode: I’ve always shared my stuff via my personal accounts on social media. But you know how algorithms are — you don’t really get interactions and that’s frustrating to me. So I thought: “let me see if it’s the people or the algorithms that don’t like my work, so I created a separate account and gave it the name “Fingacode.” When the account blew up it made sense to stick with it rather than create a new thing. ‍IX Shells: My name is Itzel, but in my native language it translates as IX Shells. For some reason, people can’t say IX Shells in English so I started trying to find meanings for different aspects of the name. IX is one of my favorite numbers, while Ix is my favorite planet in the novel, Dune (1965). A shell is a computer program that refers to keeping something safe inside. ‍ ‍F: I’ve been coding since I was about 13 but I didn’t know it was called “generative art” until Itzel told me maybe a year ago. I’ve been in the NFT space for about 12 months now, but I’ve been creating stuff with code and producing digital art for over ten years. ‍IXS: I was studying Computer Science and the first thing I learned in school involved cryptography and how to hide information in pixels. I learned about Mondrian and the basics of Computer Science and then I continued learning online with The Coding Train. However, I don’t think I fell in love with it until I found TouchDesigner, which is a visual programming language that lets you see what’s going on within every section of the code. I’m a visual person, so I thought that would keep me connected to what I was doing. So far, I’ve been able to stick to this without getting bored. ‍ F: I also love TouchDesigner. I spent most of 2020-21 playing with that program, especially during lockdown. As a coder, I’ve always been a bit of a purist about how I approach certain things but the ability to learn an idea so quickly within Touch was something I absolutely adored. TouchDesigner abstracts away the complexities and gives you a very simple interface to deal with. You can actually learn the principles of coding in a visual way rather than some of the programs where you get a more shielded approach to design."
