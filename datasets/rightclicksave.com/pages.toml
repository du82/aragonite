["https://rightclicksave.com/article/how-to-reworld-reality-catalyst-epoch-honor-fraser-gallery"]
title = "How to Reworld Reality"
description = "Honor Fraser and Peter Wu+ discuss the power of hybrid exhibitions to model new ecosystems"
full_description = "April Baca: The curatorial statement for “Catalyst” designates the position of each artist and their contributing works as an impetus to “accelerate change.” EPOCH’s virtual exhibition covers an incredible array of sites, affects, and identities that range from the obfuscation of physical human bodies in algorithmic learning systems (Auriea Harvey’s Slave Ship Diagram (2022) series and Carla Gannis’s short-form Virtues and Vices (2023)), rampant climate catastrophe (Caroline Sinders, The Rig, 01, 2023), and indeterminate or future forms (Tanya Aguiniga, Mi Nepantla (2023) and Trulee Hall, Mermaid Mutations (2023)). How does EPOCH seek to address change in a climate of tech solutionism? ‍Peter Wu+: When setting out to create and curate “Catalyst,” the goal was to interweave speculative futures and transformative narratives. The virtual exhibition leads the viewer through divergent timelines and personal transformations, prompting an interplay of time and transformation, as well as the collective (re)imagining of our futures. The virtual environment of “Catalyst” exists within two speculative time frames: one envisioning a post-apocalyptic future Los Angeles, and the other rendering the yet-to-be-completed LACMA (Los Angeles County Museum of Art) building, designed to house its permanent collection in a pre-emptive future. The works of the seven participating artists explore pivotal moments of self-actualized transformation embedded within the merging temporalities of the exhibition. Tanya Aguiñiga’s contribution materializes as a dual-faced cave, occupying space between the embodied and the metaphysical. Carla Gannis’s work explodes the boundaries between her identity and those of her pantheon of avatars. Trulee Hall’s claymation envisions a transmuted utopia inhabited by evolved sexual beings, triggered by a cataclysmic flood. ‍ Auriea Harvey inverts historical narrative through technology while concurrently probing its inherent limitations. Bahareh Khoshooee’s #EverChangingFacade (Virtual Iteration) (2023) is a layered animated video sculpture that serves as a self-portrait of assumed and imagined identities from the perspective of a femme Iranian immigrant based in America. Caroline Sinders positions herself within a futuristic world accelerated by the climate crisis. Sammie Veeler converges timelines within her work, We Become Our Own Ancestors (2023), archiving her present, future, and former self, which she refers to as her “dead husband.”"
