["https://rightclicksave.com/article/joe-kennedy-and-artnome-interview-on-rebuilding-the-art-world"]
title = "Joe Kennedy and Artnome on Rebuilding the Art World"
description = "As RCS collaborates with Unit London on a new show, the gallery’s co-founder shares his experience of bucking the system with Jason Bailey"
full_description = "Jason Bailey: I’m a big fan of what you’re doing, and while I don’t want to make assumptions, I think we probably both feel that art should be expanded to a wider audience. Let’s start with your background — I’m always curious about how people get into art. ‍Joe Kennedy: Making art accessible to a wider audience is the driver for us. For the entire team at Unit London, it’s always been about frustration with the art world. I originally came to art through my own painting at school, where I met my co-founder Jonny, and we’ve always appreciated how art fits into a wider conversation about creativity and culture. I think the majority of artists are almost martyrs to creativity, having to struggle to make a living from their work. But, ultimately, I think creativity exists in everyone to varying degrees, and that should be celebrated. Probably my first exposure to art was going to see an exhibition of an Irish expressionist painter, Louis Le Brocquy, with my uncle. I was a young kid and I just remember the experience of being in such a grand environment, which felt so strange and different. Back at school, Jonny and I were doing private commissions, making little sales to our friends, nothing special. The entire environment: the architecture, the design of the space, the language of the press release, the whole experience felt designed to make you feel small or inferior. Of course, that’s how the contemporary art world builds value into material objects — by manufacturing an elitist culture through a particular kind of artspeak. That was the impetus for us to start Unit London. We were incredibly passionate about supporting artists. But we didn’t like our experience of the art world. The gallery grew out of a group exhibition that included our own works in a small pop-up space in West London, a tiny old charity shop that had been empty for nearly six months. We deliberated for a long time about what we wanted to achieve with the gallery, ultimately deciding that we wanted to create a brand that people could identify with based on a new set of conversations around contemporary art. We asked ourselves: how do we introduce unknown artists who maybe didn’t go to the right art schools, or didn’t come from the right families, or whose work wasn’t commercially viable for some reason? How do we give these artists a voice and introduce their work to a mass audience in a way that doesn’t discriminate and is authentic and accessible?"
