["https://rightclicksave.com/article/an-interview-with-tyler-hobbs-part-1"]
title = "An Interview with Tyler Hobbs | Part 1"
description = "The artist explores his practice in conversation with Jason Bailey"
full_description = "Jason Bailey: Thanks for agreeing to an interview after what’s been a pretty wild ride this past year. ‍Tyler Hobbs: I’m also glad to have the opportunity to talk again. I figured it was just a matter of time. ‍TH: I started to get really serious about being an artist in my early 20s, after studying Computer Science at UT (The University of Texas). I started working as a programmer after school at a tech startup in Austin, working on a database engine, which was a really fun job. But I was always working on artwork in my spare time. Eventually, I knew that the artwork needed to be more personal and needed to involve my skill set. Programming was such a big part of my life, it really molded how I thought about the world in terms of patterns and processes. So I figured I needed to involve that programming in my artwork in some way. I made a few failed attempts at integrating math into my drawings and paintings — mathematical concepts and equations, and some other bad things like paintings of coding environments. I didn’t know about generative art at the time, or I didn’t know what it was formally. Maybe the closest references I knew were things like screensavers, or a couple of digital artists here and there. But it didn’t seem like a real possibility to me. I asked myself: “I wonder if I can write a program that creates a painting?” I’d been doing these mathematical drawings by hand — very tedious, very laborious. And I was wondering: “Can I just cut out the middleman and have the program do this stuff directly?” So I started putting together some works with Matplotlib, hacking it a little bit to create my first generative art. And then later I found out about Processing and Casey Reas and the whole tradition and started to educate myself more. ‍JB: It sounds like you went through the struggle of finding it yourself, inventing it in your own way. When you discovered Casey and the Processing community, what was that moment like for you, as someone trying to put your finger on this thing that you want to do?"
