["https://rightclicksave.com/article/kitel-a-generative-artist-for-ukraine"]
title = "Kitel | A Generative Artist for Ukraine"
description = "Following the success of his project, Fields of the Abandoned Homeland, Kitel shares the story behind his defining image of peace"
full_description = "There is a long history of war artists, not to mention history painters who have romanticized conflict. But earlier this month, a new project emerged on fxhash that replaced the fog of spasmodic war reporting with a vision of Ukraine at peace. It was produced by an artist currently living in Kyiv who had been forced to leave his home in Kharkiv by Russian rocket bombardment. Kitel’s long-form generative work, Fields of the Abandoned Homeland (2023), is an epic cycle of hope at a moment of extraordinary hardship for the Ukrainian people. Through his sequences of twinkling tower blocks, fertile wheat fields, and proud electrical pylons, Kitel conjures a country in which nature and industry exist in harmony. The logic is clear — this is a series for all Ukrainians, whether urban, rural, or temporarily displaced. Despite their deserted appearance, humanity pulses throughout these landscapes, which recall the metaphysical worlds of Giorgio de Chirico as well as the digital work of Igor Piwowarczyk. That the emergence of generative art as a mainstream art form has coincided with the war in Ukraine makes Kitel’s project especially poignant. Here, the artist shares his story with Alex Estorick. ‍Alex Estorick: Before we discuss your work as an artist, I wonder if you might share your experience of the war over the last year. ‍Kitel: The day of the beginning of the war was an unpleasant surprise for me. I never expected that it could happen. The day before was my wife’s birthday, so we had a great celebration and then my family went to bed. I work as an engineer for one of Ukraine’s biggest internet providers and I was woken at around 5am by an alarm I have on my phone which told me something was wrong with our equipment. At the time, I didn’t understand the reason for the problem so I had to take a taxi to the place where our servers are situated and fix them. I called the taxi and we drove around 100 meters from our house when I heard the first explosions. I returned home to my wife, who didn’t understand what was happening. The war had started. So we collected some warm clothes, documents, and money while our daughter was sleeping, and we moved a bit deeper into our neighborhood where my wife’s parents live."
