["https://rightclicksave.com/article/data-and-the-art-of-nft-discovery"]
title = "Data and the Art of NFT Discovery"
description = "Kyle Waters asks how we can develop recommendation systems for NFTs without reproducing old power structures"
full_description = "Today, there are millions of NFTs, tens of thousands of ERC-721 smart contracts, and dozens of marketplaces across multiple blockchains. As a result, the NFT ecosystem is full of noise and fragmentation. Whether you’re a newbie collector or a crypto OG it’s hard to find new and compelling work. But the problem of content recommendation is not unique to Web3. Perhaps the simplest approach to NFT discovery is locating sales volume. For better or worse, rankings and leaderboards are convenient data points for establishing the most popular collections. They also serve as a natural point of gravity for collectors, who often sort by sales volume. A benefit of this approach is its verifiability — blockchain data is readily available and anyone can independently verify rankings by running an Ethereum node and collecting the data themselves. After all, blockchain data enables us to peer into complex networks of artists and collectors. Network scientists immediately recognized the power of NFT data to unveil emergent ownership patterns. However, Wash trading — when collectors sell works to themselves to give the appearance of volume and interest — remains a thorny issue for NFT marketplaces. It often takes independent crypto researchers like takenstheorem to visualize the links between accounts trading back and forth with each other. Another approach to NFT discovery is analyzing collectors who are similar to you. This approach assumes that if two collectors own works by an overlapping set of artists, they probably have similar tastes and might benefit from learning about artists whom one collects but not the other. This follows the logic of Facebook’s “mutual friends.” With its transparent, distributed, and live record of who owns what, the blockchain is especially rich in data fit for network graph analysis. Any time an NFT is transferred, it is logged on the public ledger of the relevant chain, establishing a new connection between two crypto wallets. This data can then be used to develop a collector’s social graph. Below, I’ve used my network visualization tool to analyze Jason Bailey’s collector network on SuperRare. This tool is also capable of visualizing an artist’s community of collectors, so I’ve included generative artist Manoloide for good measure."
year_published = 2025
