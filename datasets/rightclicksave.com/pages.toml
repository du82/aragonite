["https://rightclicksave.com/article/an-interview-with-snowfro"]
title = "An Interview with Snowfro"
description = "Alex Estorick sits down with Erick Calderon, better known as Snowfro, to discuss Art Blocks and the future of generative art"
full_description = "Alex Estorick: What can you tell us about your collaboration between Art Blocks and Pace Verso? How did that come about? ‍Snowfro: I was introduced to the President and CEO of Pace, Marc Glimcher, in February or March of 2021. And something Marc demonstrated early on was a curiosity not only about NFTs but also the concept of generative minting. He was particularly interested in the idea — one that we’ve always fought for at Art Blocks — that the artist can watch the birth of a collection at the same time as the collector. Marc introduced me and Jeff Davis (Chief Creative Officer at Art Blocks) to his wonderful team and we started having conversations about what it might look like for Pace to introduce artists to Art Blocks, and to the concept of generative, on-demand minting. Obviously, we’ve established ourselves as a great place to do this type of work — we have the technology, we have a collector base that seems to truly understand art, and we’re excited to share that group of people with the traditional art world. ‍AE: It’s often assumed that the people who collect crypto art and those who collect mainstream contemporary art are different people. How true is that from your experience?‍ S: I think originally they were different people. I sure as hell didn’t feel comfortable walking into an art gallery a year and a half ago. I didn’t know much about contemporary art other than the artists I’ve always followed like James Turrell, Robert Irwin, and Donald Judd (1928-1994). So we are different people. But we are also settling on a joint appreciation of something that’s pretty new and special. Both traditional art collectors and NFT degenerates — which I consider myself — are supportive of artists, both on the primary market and through secondary market royalties. This is something extra powerful in the generative space where there are so many more mints, and where people are constantly trading one piece for another, because they like red more than yellow, etc. There’s just so much more movement and dynamism in a market like that. Art Blocks and Pace Verso are collaborating in order to enjoy that together.‍"
