["https://rightclicksave.com/article/squiggles-bring-out-the-best-in-web3-in-tribute-to-hal-finney"]
title = "Squiggles Bring Out the Best in Web3 in Tribute to Hal Finney"
description = "As a special auction celebrates the early pioneer of Bitcoin, Snowfro shares what makes Chromie Squiggles special to him"
full_description = "After the success of Cure³ earlier this year in raising over $250,000 for Cure Parkinson’s through the sale of NFTs, we are pleased to announce that yesterday RCS repeated the feat, raising 149.04 ETH ($265,000) through a special charitable auction of ten unminted Chromie Squiggles in support of The ALS Association via The Giving Block. Together with our friends at VerticalCrypto Art and thanks to the generosity of the artist Snowfro, we are proud to continue supporting the cause of generative artists in fighting degenerative diseases. The ALS Association provides assistance for people with ALS (Amyotrophic Lateral Sclerosis), coordinating multidisciplinary care, fostering government partnerships, and enhancing quality of life while aggressively searching for new treatments and a cure. Chromie Squiggles are a universal symbol of the inclusive power of Web3, which makes this auction of some of the last unminted Squiggles a fitting tribute to the towering legacy of Hal Finney, the pioneer of Bitcoin who sadly passed away in 2014 after being diagnosed with ALS. Hal’s wife Fran continues to raise funds to benefit those suffering from ALS via an annual half marathon, the Running Bitcoin Challenge, that pays tribute to Hal’s love of running as well as his most famous tweet. A distinguished cryptographer and active member of the “obscure” yet legendary cypherpunks mailing list, Finney is widely known in Web3 as the recipient of the first ever Bitcoin transaction and the first person, after Satoshi Nakamoto, to run a Bitcoin node, mining blocks for the Bitcoin blockchain network. Speculation continues today that Finney and Satoshi Nakamoto are one and the same, with even Ethereum founder, Vitalik Buterin, stating that Finney may have been Bitcoin’s inventor. But beyond Finney’s own repeated denials, this notion has also been challenged. Whatever the truth of the matter, Finney’s contribution to modern day cryptography and digital privacy is indisputable. As a volunteer and then employee of the PGP (Pretty Good Privacy) Corporation, working closely with its founder Philip Zimmermann he helped to develop what later became the most widely used software for email and file protection. Contributing to the growing body of research on proof of work (PoW) in the 1990s, in 2004, Finney developed a prototype for Reusable Proof of Work."
