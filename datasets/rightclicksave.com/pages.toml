title = "The Metamagic of Mathematics"
description = "A pioneering generation of artists discusses the creative power of computation with Bronac Ferran"
full_description = "Joshua Davis is an American designer, technologist, author, and visual artist. Creator of praystation.com, which won the 2001 Prix Ars Electronica Golden Nica, he was an early advocate of open-source software, sharing its source code publicly. Davis also contributed to the visualization of IBM’s Watson for Jeopardy! project in 2011, where IBM’s Watson DeepQA computer made history by defeating the TV quiz show’s two foremost all-time champions. His work is in the Smithsonian’s Cooper Hewitt Design Museum and was featured in the 2006 National Design Triennial. He has spoken at TED and 99U about algorithmic image-making. His art has been exhibited at venues including the Tate Modern, Ars Electronica, Design Museum London, Centre Pompidou, ICA London, and MoMA PS1, New York. Golan Levin is a Pittsburgh-based artist and educator, active in software art since 1995. His work explores intersections of machine code, visual culture, and critical making to highlight our relationship with machines and expand human creativity. Levin’s art is in the permanent collections of the MoMA, New York; Tate London; ZKM, Karlsruhe; and the Cooper-Hewitt Smithsonian Design Museum, and has been exhibited at venues such as the Whitney Biennial, New York; V&A and ICA, London; and Ars Electronica. He holds degrees from MIT and has been a Professor of electronic art at Carnegie Mellon University since 2004. With Tega Brain, he co-authored Code as Creative Medium (MIT Press, 2021), a guide for creative coding educators. LIA is an Austrian artist and pioneer in software and net art, active since 1995. Her work encompasses video, performance, software, installations, sculpture, projections, and digital applications. Using code as her primary medium, LIA creates generative artworks that blend the traditions of drawing and painting with the aesthetics of digital images and algorithms. She translates her concept into a formal written structure that then becomes used to create a “machine” that generates real-time multimedia outputs. She focuses on the translation of certain experienced principles into abstract forms, movements and colours in order to allow the viewer to explore the same on a subconscious level."
year_published = 2025
