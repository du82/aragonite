["https://rightclicksave.com/article/web3-and-the-game-of-creation"]
title = "Web3 and the Game of Creation"
description = "Alternate reality games can teach us how to build community in the age of NFTs argues Caitlin Burns"
full_description = "On March 8, 2001, a new experiment in online role playing launched as part of Warner Bros’ promotion for A.I. Artificial Intelligence ahead of the film’s release later that summer. Titled, The Beast, the game invited players to work together in forums to solve a murder mystery, with developers placing breadcrumbs in both digital and physical worlds as clues for audience participants. When it promptly received one of the inaugural Peabody Awards, the game’s lead designer, Elan Lee, described the audience as “so much smarter than we thought they were. The very first day, they solved all six months worth of content in about two hours.” Often regarded as the first alternate reality game (ARG), a number of those involved in The Beast would go on to manage 42 Entertainment, the company responsible for a string of viral marketing experiences: from Why So Serious? for The Dark Knight (2008) to I Love Bees for Halo 2 (2004) to Year Zero, which elaborated Nine Inch Nails’ concept album of the same name by conjuring a dystopian vision of the year 2022. Because they involve real-world participation, ARGs can be distinguished from other types of game that provide a closed interactive game space. Instead they require players to collaborate among themselves to complete challenges, solve puzzles, and move storylines along. Clues are often distributed throughout public spaces, including on websites or social media channels as well as billboards and print advertisements, with players using their own social accounts to coordinate, solve, and share insights and accomplishments. I myself have collaborated on a few, multi-year ARGs for big storyworlds, including Auradon Buzz for Descendants (2015), The Daily Bugle for The Amazing Spiderman (2012), and Flynn Lives for Tron: Legacy (2010). At the time, I was developing multi-year transmedia strategies to connect with fans before and between major film and game releases. This involved inviting people to experience the storyworlds behind the projects they loved, while giving them the opportunity to play together and share in that affection. I never had the chance to play The Beast, but I’d grown up playing table-top games with my father. My favorite was 221B Baker Street (1975), a Sherlock Holmes mystery that required reading newspapers and case files, interviewing other players, and reviewing old cases in order to uncover additional clues. While the stories might be fake, the personal relationships at the heart of these communities are very real."
