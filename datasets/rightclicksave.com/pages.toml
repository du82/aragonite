["https://rightclicksave.com/article/an-interview-with-dmitri-cherniak"]
title = "An Interview with Dmitri Cherniak"
description = "The artist discusses the moment generative art went mainstream with Jason Bailey"
full_description = "‍Dmitri Cherniak: When I saw Autoglyphs (2019), I thought: “that’s how I should be doing this.” Except, I wanted to use JavaScript tools. At the time, I was rendering individual frames or outputs from the code running on my computer. I would write an algorithmic system, but instead of capturing it in its full diversity, I might just mint one or two of my favorite outputs. It felt like something was missing because the edge cases and nuance of all the possibilities weren’t always visible to observers. Back then, I was minting on SuperRare, but I felt constrained by the fact that I could only upload image and video files, which limited the possibilities for interactive and live-coded works on the platform. To highlight generative art and help people understand it in context, we needed more. I basically asked SuperRare to make Art Blocks but they said they weren’t interested. So I started working on an idea where I would take a Raspberry Pi, put the code on it and lock it down entirely. But I knew we’d need some provenance to understand where the works originated — that was where the blockchain fit in. In 2019, I met Sofia Garcia from ARTXCODE. We messaged on Instagram and decided we wanted to help make generative art a “bigger thing.” We were both so surprised at how little people understood about generative art, and we thought it could be well received by a wider audience. We started putting works into shows like CADAF in New York and Miami. Things were going well — my works were selling and people were learning about generative art. There were a lot of really great artists making incredible work, including Helena Sarin and Manolo [Gamboa Naon]. We felt like we were on a roll, and then COVID happened. The way NFTs were presented at Christie’s in the form of Robbie Barrat’s AI-Generated Nude Portraits — the so-called “Lost Robbies” — also showed that NFTs definitely worked. But, for me, the most natural rendition of the piece was a tokenized form of the output created by the code."
year_published = 2025
