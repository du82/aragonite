["https://rightclicksave.com/article/how-to-regulate-nfts"]
title = "How to Regulate NFTs"
description = "Two lawyers consider the case of Shvembldr and how it can help to shape NFT law for the better"
full_description = "From the beginning, the principal attraction of NFTs has been the ability for creators to monetize digital art, to shape the terms of their own markets through smart contracts, and to bypass traditional gatekeepers. However, because NFTs can technically represent any type of asset, including physical objects, it can be difficult to ascertain the legality of activities employing NFTs. The cross-border nature of NFT transactions, as well as the widespread use of unhosted (non-custodial) wallets, makes Web3 a difficult ecosystem to regulate. The potential of NFTs to be used for money laundering, tax evasion, price manipulation, and other illicit activities is a growing concern for regulators and law enforcement. Recent research suggests that the manipulable nature of NFT prices could theoretically help criminals to justify their illicit proceeds to tax authorities on the basis that they were legitimate earnings from NFT trading. Unable to evaluate the true cost of NFTs tied to illicit trading activity, authorities face great difficulty in establishing genuine criminality. Right now, crime represents a small proportion of overall NFT trading at 0.02%. However, it has a disproportionate impact on the industry’s reputation, undermining investor and consumer protection. On February 10, 2022, Latvian generative artist Ilja “Shvembldr” Borisovs had his bank accounts frozen by Latvian law enforcement on the grounds of alleged money laundering. If found guilty, he is likely to face a 12-year jail sentence. On 18 July, 2022, Borisovs published a website, Art is Crime, detailing how law enforcement went about freezing his bank accounts without communicating the nature of the allegations against him. According to Borisovs, in 2021, he minted and sold 3,557 NFTs on the Ethereum blockchain, earning 4253 ETH (€8.7 million) in the process, which was then deposited in his Latvian bank account. Due to a lack of clear crypto tax regulations in Latvia, a European Union (EU) Member State, Borisovs initiated contact with the Latvian State Revenue Service (VID) on how to become tax compliant with his cryptocurrency earnings. Borisovs was allegedly advised to register as a “self-employed” individual and to pay taxes on the amount deposited in Euros. At the time of writing, Borisovs owes Latvia €2.23 million as annual income tax for 2021 and €3.10 million in total, with interest accruing at an unknown daily rate, all while his bank account remains frozen."
