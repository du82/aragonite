["https://www.rightclicksave.com/article/robbie-barrat-on-the-lost-robbies"]
title = "Robbie Barrat on “The Lost Robbies”"
description = "Jason Bailey speaks to Robbie Barrat about his latest work and his (mixed) feelings about the big Sotheby’s sale"
full_description = "Robbie Barrat: I’m fine, I have a week off school so that’s nice. It allows me to do work that is not part of school. RB: I’ve been doing a lot of cyanotypes lately — analog work in the form of icons. But I’m also making digital work such as landscapes. I’m trying to make work that I enjoy. I became interested in Orthodox Christian icons because they have a highly defined visual language. But they also influence my allegorical work about how the game Counter-Strike, especially older versions of the game, are currently changing. This is particularly true of the community game mode, called “surf,” which changes Counter-Strike from a fairly realistic shooter, set in the Middle East, into a non-violent game concerned with movement, almost like a dance. I wanted to explore this change through the the characters — The terrorists and counter-terrorists — using iconography. I’ve recently been overtaken by icons, which bring me back to my first experiences of AI, trying to figure out whether it was a medium, a tool, or a creative agent. With icons, there isn’t the same spatial depth as we tend to see in Western art. Instead perspective is reversed. With Orthodox icons, you aren’t looking into a focal point within the image, you are the focal point, enveloped by the icon. I had a brief conversation with a priest about the possibilities for icons on digital screens and whether or not that’s ok or allowed. They seemed to lean towards no. But I think it had something to do with the capacity of the Holy Spirit to inhabit the icon. I don’t want to pretend I fully understand their reasoning as Orthodoxy is a new interest for me.‍ RB: I don’t know how much of it is about technology and how much of it is the fact that there is no real material component. Icons can be replicated and multiples can be displayed at once, all representing the same prototype. A lot of icons, especially of saints, involve engagement with the saint through prayer and prayer is conversation. In the early internet, people would log onto 3D avatar programs like Onlive Traveler and speak to each other through their avatars. And I thought that’s kind of like prayer."
