["https://www.rightclicksave.com/article/the-interview-a-michael-noll"]
title = "The Interview | A. Michael Noll"
description = "One of the fathers of computer art discusses his career at Bell Labs and beyond with Douglas Dodds"
full_description = "I first met A. Michael Noll in person a decade ago, though I’d been familiar with his work for much longer. After exchanging emails for several years, I included him in a V&A exhibition I co-curated in 2009, entitled “Digital Pioneers.” We then attended a seminar at the School of Visual Arts in New York in 2013 in connection with an exhibition entitled, “The American Algorists: Linear Sublime.” We spoke at the event and got on well, thankfully! A few months later, in March 2014, I visited Michael at his home in New Jersey, passing close to Bell Labs on my way, where he had undertaken groundbreaking research in the 1960s. In 1965, iconic works such as Gaussian-Quadratic (1963), Computer Composition with Lines (1964), Vertical-Horizontal No. 3 (1964), and Ninety Parallel Sinusoids with Linearly Increasing Period (1964) were exhibited alongside those of Béla Julesz as part of “Computer-Generated Pictures” at the Howard Wise Gallery in New York. The exhibition is thought to be the first public display of computer art in a commercial gallery in North America, and one of the first in the world. His works have since been exhibited in numerous major shows, from “Cybernetic Serendipity” at London’s Institute of Contemporary Arts (ICA) in 1968, to “Chance and Control: Art in the Age of Computers” (2018) at the V&A, to “Coded: Art Enters the Computer Age, 1952-1982” (2023) at LACMA. Sitting in his home office back in 2014, we discussed his time at Bell Labs, his work for the Executive Office of the President, as well as the future of artificial intelligence and digital art. Sadly, I didn’t manage to record our conversation at the time, so it was a real pleasure to have the chance to speak to him again earlier this year for Right Click Save. The following transcript represents just a few highlights from our wide-ranging conversation, which lasted for several hours and could have gone on for much longer!‍ Michael Noll: It all began in 1961 when I was working at Bell Telephone Laboratories Incorporated, also known as Bell Labs in Murray Hill, New Jersey. During the summer of 1962, I had an internship in the research division where I was working mostly on speech processing, pitch detection, and technical things involving the microfilm plotter — plotting out data, and using their big IBM 7090 digital computer."
