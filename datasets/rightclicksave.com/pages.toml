["https://rightclicksave.com/article/joe-looney-on-ordinals"]
title = "Joe Looney on Ordinals"
description = "The founder of Rare Pepe Wallet explains the new class of Bitcoin NFTs to Jason Bailey"
full_description = "‍Jason Bailey: It felt like we were going to have a quiet year. The majority of people didn’t seem so interested in NFTs anymore, and the markets were starting to die. But that seems like prime Bitcoin time. After all, Rare Pepes were born in a down market. I don’t fully understand what Ordinals are, but I’m excited to figure it out. ‍Joe Looney: We go in cycles — everything old is new again. But I think part of the market was ready for something different. A lot of the people who jumped on Ordinals were Ethereum people figuring out how to run a Bitcoin node. In fact, there’s a whole group of Bitcoiners who don’t like how Ordinals put all the images and media on-chain. The last couple of weeks have been like a gold rush. I’m hoping things start to die down and that we’ll see fees come down a little bit. Ordinals raise a lot of philosophical questions that nobody really talks about — they’re forcing people to have those conversations. ‍JL: In 2012, Colored Coins looked at the smallest unit of Bitcoin, the Satoshi. Eight decimal places deep is the lowest you can go, the smallest whole unit, so Satoshis are the pennies of Bitcoin. Colored Coins regarded individual Satoshis as tokens, marking them as, for example, green or blue. The problem with that type of implementation is that the issuer of the token holds all the data anchored to the chain that has been colored. So if you don’t know that something is a Colored Coin transaction, it just looks like a regular Bitcoin transaction. At the end of 2013 a platform called Mastercoin (now Omni Layer) emerged, which was the first ever ICO (initial coin offering) in crypto. Mastercoin embedded data in Bitcoin transactions and, through its indexing software, was able to examine every Bitcoin block to build a picture of a token’s ecosystem. So issuing tokens would be one type of transaction, and sending tokens would be another type of transaction. Now, everyone in the Mastercoin ecosystem could see each other, and no one was on an island — network effect was possible. But because Mastercoin required you to be on a whitelist to issue a token, you couldn’t achieve network effect after all."
