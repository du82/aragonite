["https://rightclicksave.com/article/proof-of-pixels"]
title = "PROOF OF PIXELS"
description = "A new exhibition from PROOF Curated considers generative art as an alternative form of growth"
full_description = "‍AE: Emily, I’m interested in the concept of the artist as a curator, which seems quite common in Web3. How has your own practice fed into this show? ‍Emily Xie: I’d say that my work as an artist has directly informed my decision to address the theme of growth. I had the subject in mind because, coming up on my first year as a full-time artist, I’ve been reflecting on how much I’ve grown. As artists, we are never stagnant: we continually learn, grow, and mutate, and we express this outwardly through what we produce. For this show, I decided specifically to curate artists who work with computation. The concept of growth is particularly front and center for those of us practicing in that medium — technology moves fast and relentlessly shapes the landscape around us, so there’s a constant pressure to keep up in the face of such rapid change. ‍AE: Feileacan, this concept of growth and the closeness between machinic and natural emergence has been central to your work for a while. How have your thoughts on this subject evolved over time and how do they frame your work for this exhibition? ‍Feileacan McCormick for Entangled Others: A big part of our approach involves trying to erase some of the perceived divide between nature — the more-than-human — and the digital, framing them as part of the same ecosystem. Since early on in our collaboration, we have been collecting water samples for examination under a microscope, watching a whole world expand. ‍AE: Cory, in what ways is growth both the explicit subject of your work and implicit in the practice of a generative artist? ‍Cory Haber: As someone who started out doing single editions combined with plotter work, growth was a perfect theme for me. This was a new opportunity to do something in long form and in JavaScript. I’ve done a lot of work relating to nature in the past and, as this work started to develop, I noticed the lines originating from a central point. I was looking at the flower as a metaphor for growth, potential, and, of course, our own connection to nature (or lack thereof)."
