["https://rightclicksave.com/article/the-worlds-largest-gif"]
title = "The World’s Largest GIF"
description = "Marius Watz Interviews Jason Salavon on Generative Art vs. Data-Driven Art"
full_description = "Since the 1990s, Jason Salavon has worked around art, culture, code, and data. Using self-authored software, he creates visually arresting artworks from culturally loaded, yet accessible, material: U.S. Census data, the IKEA catalog, episodes of The Simpsons, Wikipedia pages, the history of Western painting. Born in Indiana, raised in Texas, and based in Chicago, Salavon earned his MFA at The School of the Art Institute of Chicago and his BA from The University of Texas at Austin. His work has been exhibited in museums and galleries around the world and been featured in publications such as The New York Times, Artforum, Art in America, and WIRED. Examples of his artwork are included in the permanent collections of the Museum of Modern Art, Metropolitan Museum of Art, the Whitney Museum of Art, and the Art Institute of Chicago, among many others. He was employed for numerous years as an artist and programmer in the video game industry and is currently associate professor in the Department of Visual Arts at the University of Chicago. Marius Watz (Norway, 1973) is an artist who has worked with code and visual abstraction since the mid-1990’s. Self-taught, he dropped out of Computer Science studies to create visuals for the early Oslo rave culture. In the 2000’s he focused on generative art, working with realtime software as well as physical artifacts produced using digital fabrication. In 2005 he founded Generator.x as a curatorial platform to produce a series of exhibitions, concerts and workshops for code-based art, design and audiovisual performance. Watz has exhibited internationally at venues like the V&A in London, ITAU Cultural in Sao Paulo and Museumsquartier in Vienna. He has lectured extensively and taught at schools like NYU ITP and Oslo School of Architecture and Design."
year_published = 2025
