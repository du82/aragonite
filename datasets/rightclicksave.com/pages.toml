["https://rightclicksave.com/article/photography-after-the-nft-web3"]
title = "Photography After the NFT"
description = "Leading photographers discuss what is changing in Web3 with Danielle Ezzo"
full_description = "Danielle Ezzo: Walter Benjamin argued that the development of art from a unique object into a reproducible commodity destroyed its aura. As an artist, how do you reckon with the NFT, which combines digital “uniqueness” with hyper-commodification? ‍Aaron Huey: How I reckon with the NFT is still an open question for sure, largely because all of my projects relevant to this conversation, though in the works for a year and a half in some cases, only started coming into public view last summer. Most are launching over the coming months. My first NFTs were photographs from the edges of metaverse worlds and leaps from those edges, but I’m not sure they have an aura. I want a collector to have ownership of my unique image/moment, and I don’t consider the sale of it wrapped in a smart contract to dim any of its light (aura)! The market has definitely figured out how to manufacture and sell digital “uniqueness,” but hyper-commodification feels more characteristic of a PFP project with 10,000 images. The art we are talking about today seems less in danger of that label. ‍Eman Ali: As an artist, I believe the emergence of NFTs presents an interesting opportunity. They allow me to maintain control over the distribution and ownership of my artwork, while ensuring that it is unique and authentic. This allows me to monetize my work differently than I would have been able to in the traditional art world system. One could argue that the commodification of digital artworks through NFT technology is a step away from the traditional aura of artwork, thereby detracting from its authenticity. But, as an artist, I’m trying to create digital artwork that retains its aura and is part of the NFT market. ‍Akosua Viktoria Adu-Sanyah: ​​I had a show in Zurich’s old town a few years ago, but there was no means of delivering the pieces by car, so I needed to carry my large-scale experimentally framed photographs in the tram. I had no assistance and was panting and sweating throughout the journey. I was getting trapped in between strollers, tearing the bubble wrap here and there — I’m clumsy sometimes — and in doing so, partially revealed one of my handmade chromogenic prints. I don’t remember if my hysterical laughter at another temporary existential crisis confused the people around me or whether it only took place in my head."
