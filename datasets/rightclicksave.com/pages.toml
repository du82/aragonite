["https://rightclicksave.com/article/patterns-of-flow-revisiting-hiroshi-kawano-japanese-digital-generative-art"]
title = "Patterns of Flow | Revisiting Hiroshi Kawano"
description = "Hasaqui Yamanobe looks back at a pioneer of computer art and surveys the new generation of Japanese digital artists"
full_description = "This article is also available in Japanese via Massage Magazine. “Patterns of Flow” runs to 6 October 2024 on Feral File and at NEORT++ in Tokyo. ‍‍‍ ‍Hasaqui Yamanobe (hasaqui) is an artist and researcher who engages in the production of generative art using p5.js and creates drawing works inspired by it. He participates as one of the organizers in the planning of generative art exhibitions such as “dialog() Asian Generative Art Exhibition 2024,” which tours Tokyo, Taipei, Seoul, and Beijing, and “Proof of X,” which focuses on blockchain as a medium. Publications include dialog(Asia, Contemporary, Generative Art) (2024), NFT and Blockchain as ‘Inscription System’ (2023), and Discourse NFT Network (2022). He also writes a serialized column, titled: “Re-thinking the Dawn of Computer Art in Japan” for Massage Magazine. ¹ In Kazufumi Oizumi’s interviews with Hiroshi Kawano on August 18, 2008 and July 24, 2010, Kawano reflected on those times. Oizumi kindly shared excerpts from these interviews with me and this exhibition’s curators. ² A version from 1964, archived at MSU Zagreb, is referenced in Armin Medosch’s “Automation, Cybernation and the Art of New Tendencies (1961-1973)”, Doctoral thesis, Goldsmiths, University of London, 2012, 177. A version created with FORTRAN IV and HITAC 5020 was published in the November 1969 issue of Computopia. ³ JR Pierce’s Symbols, Signals and Noise, originally published in 1961, was translated by Yasuo Shizume and published by Hakuyo-sha in 1963. ⁴ Hiroshi Kawano’s “History of Computer Art” is included in H Kawano, 芸術情報の理論 [Informatics of Art], Tokyo: Shinyo-sha, 1972, 286. ⁵ Max Bense’s “Introduction to Information Aesthetics: Basics and Applications” was translated into Japanese by Koji Kusabuka and Keiso Shobo in 1997. ⁶ The August 12, 2024 talk event, “Weaving the Narratives: The Past, Present, and Future of Japanese Generative Art” during dialog() Asian Generative Art Exhibition 2024, included discussion of Hiroshi Kawano. Akihiro Kubota and I continued our discussions after the event, which comprised speakers Akihiro Kubota, Kaori Tada, and Hasaqui Yamanobe moderated by Ayumu Nagamatsu."
