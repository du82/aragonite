["https://rightclicksave.com/article/the-worldbuilders-of-web3"]
title = "The Worldbuilders of Web3"
description = "As Krista Kim’s Continuum absorbs audiences worldwide and Lawrence Lek inaugurates Nepenthe Valley, Alex Estorick asks them to share their thoughts on the metaverse still under construction"
full_description = "Alex Estorick: There’s obviously a conversation to be had here about digital architecture, including virtual worldbuilding, but also one about property relations in the metaverse. At least from my perspective, when I think about works by Lawrence like Geomancer (2017), there’s a kind of critical politics that underpins it all. While Krista has commodified NFT architecture through the Mars House (2020) and envisioned a native Web3 virtual world. One area you both align is in the importance of digital consciousness, psychological states, and well-being to your different worlds. And I am interested in the ontological shift that may or may not be taking place as we move into the metaverse. I think sometimes when we talk about NFTs, there’s a temptation to start history over at year zero, but both of you are mindful of the histories in which you’re operating. ‍ Krista Kim: I am a student of Marshall McLuhan. I love his book, Understanding Media (1964), which taught me a lot about the world. Back when I started out in 2013, I was getting addicted to my phone. So McLuhan’s dictum that “the medium is the message” began to really make sense to me, whereby this invasive, ubiquitous technology — smartphones and social media in particular — were taking over my consciousness through relentless distraction and reinforced behaviors like dopamine hits. This was a disturbing realization for me. So I basically decided that, as someone who practices regular meditation in order to mitigate anxiety and depression, I was very sensitive to the inputs of the world on my inner sanctum. And so meditation and the expression of the sublime in our environment was something that I thought would help me, so I began to create art with light, influenced by the work of Rothko and James Turrell. Many of us don’t realize that the screen can be repurposed to create a state of Zen. I was born in Canada, but my background is Korean. And when I lived in Japan for three years, I would often travel from Tokyo to Kyoto, which became my favorite place in the world. Kyoto is a place where every design decision in the environment — from architecture to landscaping, cuisine to fashion — was imbued with Zen consciousness. It was in the Ryōan-ji temple garden where I realized that our environment is a mirror of the mind. And so I knew that art can be of service to humanity, which became my revelation."
