["https://www.rightclicksave.com/article/have-nfts-lost-their-way"]
title = "Have NFTs lost their way?"
description = "OSINACHI in conversation with Jason Bailey"
full_description = "Jason Bailey: It’s been a crazy couple of years since we first met, with NFTs taking off during the pandemic. How are you holding up? Osinachi: Yeah, it’s been really crazy, mostly in a good way as an artist in the space: from January, when I bought my home; to October when I had the auction at Christie’s. But because the whole thing is moving so fast, it takes some effort on my part to try to slow things down. I receive so many email requests for collaboration, most of which I say no to because of course, I have my plans. On the other hand, you can have everything planned out and then it gets disrupted, sometimes in a good way. JB: I was revisiting your solo show at Kate Vass Galerie and it struck me that you always manage to tackle the big topics that people are dealing with: Environmentalism, or police brutality, or COVID. But when other people tackle them, it feels almost artificial. Somehow you find a way to express your lived experience without apparent artifice, to address issues that are relevant to all of us. If you told an artist, maybe with less experience, to make a work about COVID, they might produce a work about death: Something huge and heavy. I mean, COVID is horrible. But one of its repercussions has also been emotional loneliness. You manage to address these aspects that are perhaps more subtle yet also universal. O: The pandemic is something that has affected everybody. For me, it was extraordinary to arrive in Lagos in March 2020 just a few days before our lockdown was announced. That meant that my partner and I had to sleep on the floor for a few days before being able to order things via the internet and have them delivered. But there were also so many things that we couldn’t actually buy. So the pandemic was a formative period for me, because it also gave birth to my COVID-19 series. Most of my work develops from a space where something’s affecting me so much that I try to find a way to let it out. During COVID, people were trying to take charge of their lives, isolating themselves for protection. But in isolation, there are certain things you also need to avoid going crazy. And one is entertainment."
year_published = 2025
