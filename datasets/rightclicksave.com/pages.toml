title = "Web3 and the World Creator Economy"
description = "Beth Jochim speaks to a group of artists helping to decentralize and decolonize the art world"
full_description = "Web3 is premised on the ability of digital creators to leverage their skills and social media followings to forge careers in an expanded art world. In this new iteration of the Internet, online space is evolving into an on-chain geography that has already launched the careers of crypto artists previously barred from participating in the old system. Unfortunately, despite the NFT explosion of 2021, the utopian potential of decentralization is still to deliver a truly global marketplace. In order to establish a more progressive Web3, a number of micro-communities are now developing strategies to engineer inclusion and decolonization in the creator economy. One project that epitomizes this is transnational arts and human rights organization, Engendered. Led by Myna Mukherjee, Engendered was responsible for two separate “Techné Disruptors” shows in New Delhi and New York last year, blending cutting-edge technologies with non-Western artistic traditions. Mukherjee described the second exhibition at High Line Nine as “conceived through the lens of urbanism and a post-colonial gaze [...] engag[ing] Indian futurisms, indigenous technologies, and future-forward aesthetics while retaining the notion of cultural perpetuity.” For this week’s special edition on “Art in Expanding Fields,” Beth Jochim caught up with four of the artists from “Techné Disruptors (II)” who are currently rebuilding Web3 as a new critical geography. ‍Harshit Agrawal: I have worked with Myna Mukherjee in the past. She curated my solo show “Exo-Stential: AI Musings on the Posthuman” in 2021. In a lot of ways, I think both Myna and I are techno-optimists. We feel we can speak of our present-day narratives in a more authentic manner by engaging with technology. I was excited to be part of a show that brought together artists working with more traditional media to build layers of technological materiality. This intertwined deep-rooted practices of traditional media with the contemporary technological reality."
