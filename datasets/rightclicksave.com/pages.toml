["https://rightclicksave.com/article/when-moma-went-web3-interview-autonomy-artnome"]
title = "When MoMA Went Web3"
description = "The architects of the MoMA Postcard share how they engineered a global work of art with Jason Bailey"
full_description = "Jason Bailey: How did MoMA and Autonomy initially come together? And, Sean, what is the relationship between Autonomy, Bitmark, and Feral File? ‍Sean Moss-Pultz: I started Bitmark in 2014 after becoming obsessed with Bitcoin and the idea of decentralizing important things like money. The first advisor I brought to the company was Casey Reas, whom I had met and befriended in the early 2000s. When I started Bitmark, digital money was becoming a thing and I felt that people would soon want to collect art online. That was why I brought in Casey as an advisor. I had no idea that no one would care until 2020. For the first six years, Bitmark struggled to stay alive, zigging and zagging until the two communities of crypto people and artists working in the digital format overlapped, and all this wonderful stuff emerged. MoMA approached us to do a show together, which became our November 2020 solo exhibition with Refik Anadol. That was our first experience working with any institution, let alone one of the caliber of the MoMA, so it was a privilege. Feral File was an initiative under Bitmark, but a rather strange beast. Casey Reas is a co-founder of Feral File, so it’s a startup working with an artist to create what we thought at the time were new opportunities for artists. Autonomy came about in the fall of 2021. A year prior, Casey had pointed me toward Hic Et Nunc and all of this stuff happening on Tezos. [At the time] you had to get a different wallet for Tezos, a different wallet for Ethereum, and a different wallet for Bitmark. I had three wallets, and none of them would show me my artwork, which I could only see by logging into my laptop. Last September, we were working with MoMA to install Refik’s “Unsupervised” project in the lobby and our team thought it would be nice to gift visitors with an NFT. They could experience this artwork in person and take home a digital memento, which, for most people, would be their first NFT. The collaboration between Autonomy and MoMA required solving the problem of how to allow people to scan a QR code with essentially zero friction and end up with a true Web3 wallet — a non-custodial, self-sovereign wallet — to allow them to find their memento right away."
year_published = 2025
