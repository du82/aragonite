["https://www.rightclicksave.com/article/the-nft-apocalypse"]
title = "THE NFT APOCALYPSE"
description = "Jason Bailey explains why more than half of your NFT collection will likely break in the next five years"
full_description = "Many NFT collectors are living under a potentially devastating misapprehension — that their NFTs exist fully on the blockchain and are therefore safe. The reality is that the artwork and metadata for roughly 90% of NFTs are not stored on the blockchain. Typically the token itself lives “on chain” and links out to the art, metadata, and other assets “off chain.” This raises some critical questions that all NFT collectors should be asking but rarely do. Where does the artwork and metadata for my NFT live if it is not on chain? Who is paying to store the artwork associated with my NFT? And what would happen to the value of my NFT if the artwork and metadata permanently disappeared? This may sound technical, but if you collect NFTs I strongly urge you to stick with me. For this article, I’ve analyzed and backed up my own NFT collection using ClubNFT’s tools to show you how to analyze and backup your own collection for free. Should you have questions while reading this, feel free to Tweet me @artnome and I promise to do my best to answer your question. In an ideal world, all NFTs would be on chain and I wouldn’t be writing an article about the inevitable NFT Apocalypse. Unfortunately, storing large files like images and videos on chain is crazy expensive and almost nobody does it. To put it into perspective, one megabyte of data on Ethereum can cost thousands of dollars at recent market rates. As a result, very few projects store everything on chain. Out of my collection of over 1,000 NFTs, only one project, EthWords, is fully on chain. Because EthWords does not incorporate images, it remained affordable for them to keep it fully on chain. I expect that lots of people will be surprised when they first run their collection through ClubNFT’s backup tool to discover that many well-known NFT projects that are marketed as “on chain” really only store a portion of the NFT — the image, metadata, or code — fully on chain. Still other “on-chain” projects redundantly pin information on IPFS in addition to being on chain. If a project you thought was on chain shows up in your ClubNFT backup as “web” or “IPFS,” it doesn’t mean our analysis is wrong or broken. More likely it means that the project claims to be “on chain” but the NFT incorporates “off-chain” elements."
year_published = 2025
