["https://rightclicksave.com/article/an-interview-with-william-mapan"]
title = "An Interview with William Mapan"
description = "The artist tells Jason Bailey about getting lost in code, the market for generative art, and the creator community in France"
full_description = "Jason Bailey: Most generative artists I know either started in programming and later took an interest in art or started in art and later learned to program. What was your experience? ‍William Mapan: While I had some programming classes, I actually started in motion design with Flash and Adobe After Effects. I rapidly hacked my way through them and started programming again by building tools to suit my needs. I quickly moved from Flash to Processing and then, ultimately, to JavaScript. Art has always been a part of my studies, I just wasn’t paying attention. Big classrooms with a teacher reciting literature to hundreds of students weren’t really my thing. Eventually, I became a “Creative Developer” — whatever that means — so that I could mix different skills in my day job. Then five years later, I returned naturally to art and suddenly the teaching I’d received in the past made sense! I still consider myself a newborn artist; I know I lack some knowledge, but I like how art helps me to grow as a human being too. There are so many levels to dig into — it’s inspiring! ‍JB: How did you discover generative art and who were the first generative artists you looked up to? ‍WM: I always loved to doodle and make quick sketches. I’ve also always loved how only a few lines of code can generate imagery. That’s still crazy to me. At a certain point, I wanted to combine my growing love of art with my programming skills. In the meantime, I also started to go to more museums and exhibitions, whilst also scrolling Pinterest, before eventually stumbling on the work of Manfred Mohr. At that moment, I was finally able to put a name to all this — generative art. ‍JB: Generative art has gone from having very few collectors to receiving enormous interest overnight, with artists apparently increasing their output to match demand. Do you think this pace is sustainable or is it just a short-term trend? Is there a risk that artists will overproduce? ‍WM: That’s an interesting question. There’s still a long way to go but, with NFTs, I feel generative art is having a formidable run and is finally getting wide recognition. A lot is happening, from websites to galleries, exhibitions, DAOs, and communities — a lot of opportunities to share and make visible one’s work. Now that there’s a new market with a growing number of collectors, I feel the global rhythm of creation has definitely spiked. I’m not good with trends, so I don’t know if this will persist, but I do know it’s not sustainable to always make art for sale."
