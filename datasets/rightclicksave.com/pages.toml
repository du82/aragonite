["https://rightclicksave.com/article/femmebit-and-the-new-california-interview-video-art"]
title = "FEMMEBIT and the New California"
description = "Feral File’s new exhibition celebrates a collective of digital artists upending Hollywood fantasy"
full_description = "‍Elisabeth Sweet: Few cities are more relevant to film than Los Angeles, which also has a vibrant Web3 community. How does the city of Los Angeles simultaneously play a role in your work and oppose it? ‍Petra Cortright: I have a love-hate relationship with Los Angeles as a city, as well as the state of California, but I love the landscapes of California. I live on the edge of the city in the county at the foot of the San Gabriel Mountains. Although I consider car culture to be a wider American theme, it’s definitely a large component of living in the Western United States. In the videos I’ve made, there is a bit of “driving”/POV feeling, almost like flying through the landscapes. ‍Eve-Lauryn LaFountain: Los Angeles was my home for 12 years. My family has a long history there. My grandparents were relocated from our reservation in North Dakota to LA in the 1950s as part of the Indian Relocation Act. My father was born in Compton, and when I moved to Echo Park in 2008 my uncle told me stories about playing with toy boats in the lake as a kid. I often think about the uprootedness my family must have felt when they lived in Los Angeles. I felt it too when I moved there. My work often explores the cycles of the city in relation to the cycles of the planets. Everything is swirling — the traffic creates light rivers, the stars and satellites are indistinguishable from one another. The work I have in “In Media Res” is meant to blur the lines between the natural and the man-made, the spirit world and reality. Los Angeles is so much more than what is seen on the silver screen. It’s a magical city full of dreams, but it’s also full of struggle. And while it’s drenched in golden sunshine, it’s also the smog that makes the sunsets so gorgeous. My work about the city is both a celebration of its beauty and a meditation on its contradictions. ‍Ellie Pritts: The landscapes featured in the series I created for this exhibition have been the backdrop of many Hollywood films, music videos, and photo shoots. There is a lot of pop culture tied to Joshua Tree. I feel that these desert parks have been glamorized when, in reality, they are harsh and unforgiving places whose ecosystems are fragile and threatened. I have tremendous respect for the desert and an endless fascination with it. In this series I wanted to juxtapose the vibrant color and splashy aesthetic of LA with the stark desert scenery just outside the city."
