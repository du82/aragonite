["https://rightclicksave.com/article/the-poetics-of-protest-poesia-de-protesta"]
title = "The Poetics of Protest"
description = "A new collection of visual poems reimagines how protest is performed, expressed, and experienced"
full_description = "Protesting with a poetic voice, expressing dissent under cover of linguistic acrobatics, and employing rhetoric as a resource are ways to split difficult realities. Poesía de Protesta (Protest Poetry) is a collection of visual poems that gathers the voices of fifteen Hispanic women poets in collaboration with diverse visual artists. The resulting transdisciplinary artworks create a critical dialogue about the contexts from which they emerge. Although protest may be linked to artistic activism and political art, this collection adopts a widened conception of protest in which intimate universes and individual landscapes overlap global practices — individual experiences merge to shape the collective discourse. These poems argue against prevailing ideologies and address issues such as gendered violence, exile, economic marginalization, fragmented identities, and erotic otherness. The revindication of the marginalized is here dynamized via collaborative, collectible digital verse. Technology expands the ethical and aesthetic possibilities of the network, invigorating the ways in which protest might be performed, expressed, and experienced. Artist collaborators transform the text, imparting new meaning and ushering in new audiences to embrace the poetic expression of protest. ‍ Poesía de Protesta marks an important milestone for theVERSEverse, a digital poetry gallery devoted to presenting poems as fine art, whose mission is to elevate a diverse array of the world’s leading poets. The first iteration of this collection debuted at Refraction Festival in Miami in 2022 with the second edition launching this week at PROOF OF PEOPLE x REFRACTION in New York. To accompany the event, we are pleased to share a selection of works from Poesía de Protesta on Right Click Save. Poesía de Protesta is supported by the generosity of the Tezos Foundation, a Refraction Creative Grant, the Broward Cultural Division, and MAD Arts. Works from the collection may be purchased from Objkt.com."
year_published = 2025
