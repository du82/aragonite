["https://rightclicksave.com/article/boundless-bodies-and-nfts"]
title = "Boundless Bodies and NFTs"
description = "Three digital artists share their visions of a posthuman future with Katherine Howatson-Tout"
full_description = "Katherine Howatson-Tout: The human body, whether obscured, distorted, or reinvented, is central to all of your practices. Do you feel that you are crafting posthumans? ‍Tripura: The human body, or its partial representation, is the focus of my work, which seeks to realize immersive habitats that reorient perception, evolution, and metamorphosis. It is as if our body were a large eye and impressions from the future appear on its retina. These are not dreams or a product of the subconscious, but real imprints of the multiple worlds of the future. ‍Stella Particula: My project, Stella Particula, began with my experience of depression. I avoided its hard reality by creating new visions through which I would travel. In my work, the human body represents a feeling or state of mind drawn from the past, present, or future. But in every image there is a sparkle of hope and light — a projection of survival instinct that guides someone to expect a better future. So yes, I think I’m crafting posthumans: humans that are a projection of the future through their present or past state. ‍Anna Dart: I have reimagined the human form in various ways to explore the place of emotions and memory in the complex journey of globalization. I find the body to be a powerful symbol for communicating complex ideas and issues, from the human condition to societal norms to climate action. The human form has a unique ability to evoke empathy and understanding, making it an effective means of exploring the realities of our world. As the boundaries between physical and digital realms continue to blur, the depiction of the body in art will be increasingly relevant and important. Entering the metaverse, we are going to face further challenges as a civilization. It is essential to make a statement about what kind of future we look for. Today we have the opportunity to use different mediums to address these possible futures. ‍SP: I create the bodies I use in my works in 3D but they are often drawn from the same model, like my avatar. The digital enables me to create something visible but intangible, while my practice also involves glitch in its distortion of vision and light. Despite their digital form, these bodies are sentient while the glitch distorts their emotions. I layer colors and textures so that light illuminates hope.‍"
