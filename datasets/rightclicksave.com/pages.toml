["https://rightclicksave.com/article/art-in-the-age-of-algorithmic-selection"]
title = "Art in the Age of Algorithmic Selection"
description = "Three digital artists share what makes Web3 a different kind of marketplace with Katherine Howatson-Tout"
full_description = "Katherine Howatson-Tout: Right now, new generative forms of art-making point to an increased alignment between human, machine, and natural forms of creation. The use of algorithms or machine learning platforms that result in randomized outputs could be said to resemble organic processes that can be seen in nature. Does the evolution of technology still place it at odds with the natural world? How do you address this relationship in your work? ‍Evelyn Bencicova: My work addresses the relationships between humans, nature, and technology from a conceptual standpoint. Even though I have not yet explored the possibility of algorithms and machine learning in the creative process, these topics are so apparent in the world around us that they are difficult to avoid or overlook. Certainly, they are often present in the work of contemporary creatives who use both digital and more traditional media. For me, the idea that nature and technology stand as opposites is quite pessimistic and outdated. Technology is a tool that can be directed in many different ways. So if we are to speak about damage, human decisions and motivations are the real problem to be addressed. In one of my works, Anti-Atlantis (2021), I use multisensory VR to create an experience that takes the viewer through environmental catastrophe and its effect on our own body. It is a warning for a future that could still be avoided if we change our values and behavior. Virtual reality makes it possible to immerse the audience in an experience that has not yet happened — and hopefully will not — with the goal that we might take better care of the world around us. ‍Technology will remain at odds with the natural world so long as it has deleterious effects on the environment. Are my screens biodegradable? Can I use a computer that does not require mining rare earth minerals? The spectacular creative fruits born of technological tools are always inextricably linked to a system of capital, extractive industries, and unchecked consumption. This is the subtext behind much of my current work.‍"
