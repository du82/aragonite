["https://rightclicksave.com/article/the-interview-danielle-king-generative-ai-art"]
title = "The Interview | Danielle King"
description = "The artist discusses how she navigates machine collaboration with Adam Berninger"
full_description = "Danielle King is an artist, collector, writer, and curator based in Western Massachusetts. She studied studio art and art history at Harvard University, working primarily in photography, film, and mixed media. Her recent work uses AI technologies to explore alternative art histories and timelines, experiment with memory and the duality of self, and investigate capitalist and art historical ideals of beauty and femininity. After receiving her MBA from the Yale School of Management, she spent eight years managing the Department of Painting and Sculpture at the Museum of Modern Art in New York. She is currently the CFO & COO of ClubNFT and Right Click Save. Danielle is a partner artist with ThreeSpaces and an advisor to Emergent Properties. She was a member of the fifth cohort of the VerticalCrypto Art Residency and is now a mentor for the program. She is also the mother of two boys. ‍Adam Berninger is an artist, curator, and founder based in New York and a graduate of Rhode Island School of Design. For the past 20 years, he has created works in photographic, painted, algorithmic, and written media, and has served as a creative director for industry-leading brands. His work explores how technology, beauty, the written word, and interactive experiences can provoke a deeper understanding of our shared existence. Adam is also the founder of TENDER, a generative art hub, community, and advocate serving to advance the medium of computational art. Through TENDER, he collaborates with generative artists to create new long-form series. At the heart of his practice across platforms, artworks, and media is a dedication to revealing the essence of art itself."
