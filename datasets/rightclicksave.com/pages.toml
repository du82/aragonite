["https://rightclicksave.com/article/hello-world-the-moma-postcard-digital-artists-interview"]
title = "HELLO WORLD | The MoMA Postcard"
description = "A new project from The Museum of Modern Art celebrates co-creation on the blockchain"
full_description = "It's exciting to see MoMA exploring ways to interact with the blockchain, and I’m thrilled to be a part of it. Instead of launching an NFT collection, the MoMA Postcard project makes creating and interacting with the blockchain accessible to a broader public. The constraints on the number of pixels and colors you can use to design your stamp make it easy to collaborate yet offer enough space to be playful and creative. I don’t have a formal art education — collaboration and co-creation are a way to educate myself. When I initially started teaching myself how to code, I wasn’t connected to anyone working with the same medium. I am proud to be here as one of the 15 selected artists and happy I have the ability to share my voice and vision with a larger audience. It has been uplifting as a digitally native artist to see support from the MoMA for digital and blockchain-based artists. There is something remarkably special in Web3 that can impact contemporary art. [...] One clarification to make is that gatekeeping and curation are not the same — as artists begin to adopt this technology, I hope to see more important bodies of curation shape the way digital art is consumed. That is how this model will survive. The ability to share assets via blockchain will be at a scale never seen before in human history. The MoMA Postcard helps mark the beginning of this technological transition. While participation in the blockchain isn’t technically restricted to anyone, there is a steep learning curve involved in gaining the confidence to navigate it safely. The MoMA Postcard project makes this otherwise daunting journey fun and educational. The combination of the MoMA’s reputation with the playful and community-oriented mechanics of this project can introduce people to the blockchain and get them excited about its potential. During my time in Web3, I have had the opportunity to engage in co-creation — collaborating with peers to build a body of work, co-curating exhibitions, and experimenting together with new tools. Building with others has become an integral part of my practice. It is true that, much like every institution in the world, the blockchain is overwhelmingly male, and white. But, in my opinion, that’s poised to change. Some of the most vibrant blockchain ecosystems are in Africa, and I am convinced that the future of the blockchain is in the Global South."
