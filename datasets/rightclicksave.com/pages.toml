["https://www.rightclicksave.com/article/casey-reas-on-the-art-of-code"]
title = "Casey Reas on the Art of Code"
description = "The artist and co-founder of Feral File speaks to Stina Gustafsson about art in the age of hybrid creativity"
full_description = "‍Stina Gustafsson: The close proximity between engineers and artists is central to the exhibition, “Ecotone,” launched recently on Feral File. How do you see the concept of the artist-engineer developing in the future? ‍Casey Reas: There are so many ways forward. Some artists really are true hybrids. They have deep technical, conceptual, and craft skills. Some artists work best with a single technical collaborator. Working in larger teams is also an excellent model for realizing projects at scale and bringing together more areas (e.g. a synthesis of sound, performance, architecture, image.) My own path is to mostly code my own work, but I sometimes commission a specific element of code that’s beyond my current skills. When I work with sound, I bring in a collaborator because I don’t have depth in that domain. I love to collaborate; it always pushes me into new territory. At one point, creating art code required a computer that cost hundreds of thousands of dollars and years of technical training to operate. This was the era of artist-engineer collaboration sponsored by organizations like Bell Labs and E.A.T. in New York in the 1960s. Also, academic systems forced people to choose art or technology. Artists who were curious about coding needed to enroll in computer science classes. That only worked for a few people. New academic programs and new approaches to teaching computer science have opened the doors for the change we see today. ‍SG: Artists exhibiting on Feral File are now able to mint on Tezos. How important is it for Web3 platforms to be blockchain agnostic and how do you see Feral File continuing to grow in the coming years? ‍CR: At its core, Feral File has a set of Artist and Collector Rights and goes beyond a specific blockchain. Feral File is committed to its artists through the blockchains they want to use. We started on the Bitmark blockchain and now we’re thrilled to be minting on Tezos. We’ll also be minting on Ethereum post-Merge. Moving forward, the curator and artist for each exhibition will select the chain they want to mint on. We’re focusing on our contracts and having them work across marketplaces and different chains to automate secondary sale payments for the artists who work with us. As things change, we plan to add support for other blockchains. We’ll follow the artists."
