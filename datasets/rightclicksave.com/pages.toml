["https://rightclicksave.com/article/the-art-of-diy-education-interdisciplinary-goldsmiths"]
title = "The Art of DIY Education"
description = "A group of digital art scholars discusses how an interdisciplinary approach can disrupt old knowledge regimes"
full_description = "‍Rachel Falconer: As a curator who has worked within industry and academia, with artists, with research practice, and, in my past life as a creative director, in the film, advertising, and gaming industries, there’s always been a superficial alignment of disciplines in order to tout one’s business as an interdisciplinary practitioner. In an academic situation, those kinds of rhythms are sometimes accentuated because of the politics of being in a department that, in and of itself, is interdisciplinary. At Goldsmiths, I don’t think that there is enough porousness between departments. ‍Andrea Khôra: I’m a PhD researcher in the Art Department and also an Associate Lecturer here, kind of floating between things. My practice itself is quite interdisciplinary, working between the worlds of science, computing, digital media, and fine art. There’s a lot of [time spent] trying to figure out how to translate methodologies and how they can fit within various sectors. ‍AE: How does one map such a hybrid practice onto the departmental or disciplinary structure in which you find yourself? ‍AK: I think in the department it’s quite simple, actually, because it is so open and everyone is in their own niche project. But, as an overall institution, I don’t feel that there is much crossover. I think I met Rachel at a Goldsmiths event, and then we were able to collaborate on a few projects after that. ‍Daniel Rourke: I’m based in the Department of Media, Communications and Cultural Studies and also did a PhD at Goldsmiths in the Art department. I found myself here at a time when there was a new MFA called Art Writing. Before that, I had done an MA in Creative Writing, and, before that, a BA in Philosophy. In a sense, the points where disciplines apparently meet have often been points where I’ve found a home for myself, but not by intent necessarily. That happened when I joined my current department right at the moment when the pre-existing Cultural Studies department had been subsumed into Media and Communications. It was a baptism of fire to be entered into this strange performance of interdisciplinarity, playing out in a place which is bureaucratic at the level of egos and resources. A lot of that has really settled now. To watch a small, independent department have to manifest a new position for itself within a big department was fascinating because there are points at which you wish there was more permeability between things. To see those egos dissolve and people find a new place, building alliances and allegiances was a really exciting and important thing to watch happen."
