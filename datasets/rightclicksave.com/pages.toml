["https://rightclicksave.com/article/what-is-the-future-of-digital-fashion-in-web3"]
title = "What is the Future of Digital Fashion in Web3?"
description = "With the fashion industry increasingly embracing the phygital, leading designers share their predictions with Ashumi Sanghvi"
full_description = "‍Ashumi Sanghvi: How far is digital fashion reiterating legacy practices from the fashion industry and where do you see genuine innovation right now? Is phygital fashion the future? ‍Dani Loftus for DRAUP: Traditional fashion brands and luxury groups tend to rely on exclusivity in order to capture a colossal proportion of market share, thereby earning the title of “super winners.” New designers trying to break in are therefore faced with Goliaths who have achieved dominance in terms of economies of scale and through close relationships with the fashion press that ensure walls around media distribution. Likewise, only a small number of brand fans possess the wealth and connections to wear a high end brand’s designs. It also allows young designers to create clothes at little more than the cost of a computer, while technologies like augmented reality (AR) and virtual rendering expand who can wear what. Designers can now bypass the approval of the fashion illuminati, relying instead on the algorithmic assistance of social media. Due to the hypothetically infinite scalability of digital clothing, price tags can also be lowered while clothes can be shipped anywhere, which allows a wider body of consumers to engage with the formerly gated world of high fashion. A number of traditional market leaders, including Chanel, Dior, and Balenciaga, have developed collections of “skins” for Fortnite and Roblox — played by 75% of 9 to 12 year olds in the US — while others such as Gucci and Tommy Hilfiger have set up full-time shops in in-game worlds. Others are establishing pop-ups as a marketing ploy to gain attention from gamers for their physical clothes and then getting out. For these high-end brands, mind-space means market share because young buyers will eventually consume more expensive physicals when they do possess the purchasing power. ‍Marco Marchesi for The Fabricant: When I joined The Fabricant in 2021, my naive ambition was to use game engines and different programming languages to generate fashion through code. I was surprised to find that, across the many digital fashion houses, designers were largely using software tools conceived for the traditional fashion industry. This was partly inherent in pre-existing fashion education, whereby students would learn to design physical fashion first, following the rules of garments and fabrics, and subsequently switching into the digital world. However, the constraints of different digital platforms also created serious challenges for creatives who sought to make fashion for the metaverse. I’m pleased to see that visual quality is now increasing significantly, while newly interoperable solutions and AI are creating new opportunities to innovate."
year_published = 2025
