full_description = "For Right Click Radio’s inaugural podcast, Alex Estorick sat down with Danielle King, CFO of ClubNFT and former Manager of Painting and Sculpture at MoMA to discuss what’s been going on in the NFT space over the last month. Jason Bailey, CEO at ClubNFT, speaks to Aparajita Jain, founder of terrain.art and Director at Nature Morte Gallery, about how NFTs can unleash the creative economy in India. RCS Editor-in-Chief Alex Estorick sat down with Krista Kim and Lawrence Lek to talk about their hopes for the metaverse currently under construction RCS Editor-in-Chief Alex Estorick hosts a conversation between Christiane Paul, Adjunct Curator of Digital Art at the Whitney Museum of American Art, and Jason Bailey, CEO of ClubNFT. They discuss the consequences of NFTs for digital art as well the new Lumen Prize NFT Award, sponsored by RCS. Two of the foremost artists working with technology, Stephanie Dinkins and Harm van den Dorpel, share their hopes and fears for blockchain, NFTs, and Web3 with Alex Estorick David Cash, Curator of Decentraland Fashion Week, joins RCS Editor-in-Chief Alex Estorick to discuss the future of art, fashion, and identity in the metaverse. Emann Odufu speaks to Nancy Baker Cahill about how the blockchain can help to turn public art into a new caring economy. The artist speaks to Benjamin Kandler about blockchain art, smart contracts, and the legacy of Harold Cohen. Erin Bailey interviews Mark Wilson, better known as “die with the most likes,” about the fine line between misery and hilarity. Jason Bailey speaks to the artist and CEO of women’s health startup, Cradle, about life on the border of art and technology. Fresh from his new collaboration with Dandelion Wist, the artist speaks to Alex Estorick about his search for the grail. Simon Denny speaks with Karamia Müller and Guile Twardowski about decentralized curation and the tech resurrection. As Right Click Save celebrates its first birthday, Jason Bailey and Danielle King make their predictions for the year ahead."
