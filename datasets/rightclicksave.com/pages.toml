["https://www.rightclicksave.com/article/the-future-of-creative-ai-machine-learning"]
title = "The Future of Creative AI"
description = "Two leaders in the field of machine learning assess its progressive potential for art and beyond"
full_description = "‍Luba Elliott: Since I started working in creative AI in 2016, I’ve seen the space explode in popularity, beginning with DeepDream, followed by the controversial Christie’s auction of the blurry GAN-generated portrait by Obvious, and now finally the rise of prompt-based art and its increasingly close relationship to the field to NFTs. It feels to me that the latest generation of artists is much more focused on producing images as opposed to using AI as a tool within the broader creative process. As someone who has been in the field of AI for many years, how have you seen the space change in its concerns, terminology, and artistic output? ‍ Mick Grierson: There has been huge change, much of it in a positive direction, but now we’re in a new place and there are new questions at play. It’s been interesting to experience this change. The idea that AI could become aware and/or be an independent threat is still very much a live issue in some areas due to the way artificial general intelligence (AGI) has been used as a carrot to entice investment. I am contacted quite regularly by researchers in industry who are tasked with creating AGI. They sometimes want my advice on how to program systems that can simulate human creativity. They also have huge, speculative, philosophical theories about human creativity which make no sense whatsoever to anyone with experience in creative fields, yet somehow they think it’s possible to simulate human processes such as creative action without knowing anything about them — purely by modeling the output data (e.g. paintings). I take seriously what they’re trying to do because they will certainly produce something, even though the way they have been asked to achieve it borders on the insane. Artists such as Parag Mital, Terry Broad, and Memo Akten have been exploring the affordances of AI and ML (machine learning) among other things, from the perspective of creators. I encouraged them to develop new kinds of core ML tech based on what was becoming available, driven by how people go about making things rather than by how computers might simulate creativity. This is mainly because I care about how new tech enables new affordances and, potentially, new artistic voices in computational arts. That is how historic figures like Daphne Oram, John Whitney Sr., and Vibeke Sorensen developed new kinds of technology through practice."
