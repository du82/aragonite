["https://rightclicksave.com/article/the-new-precisionists-interview-digital-art"]
title = "The New Precisionists"
description = "A trio of artists is repurposing hard-edged aesthetics for the Fourth Industrial Revolution"
full_description = "Jeremy Booth is a contemporary artist known for his minimalist and cinematic approach to pop art. His work is a fusion of classic Western themes and modern design elements, creating a unique style that has captivated collectors worldwide. He has been profiled in top art and design publications such as Juxtapoz, Creative Boom, Design Milk, and Dwell, while his work has been featured on leading digital art platforms, including Foundation, Nifty Gateway, and SuperRare. Booth’s blending of traditional Western iconography with a contemporary sensibility has made him one of the most exciting artists in digital and traditional art.‍ Abayomi Okeowo (artist name Yomi Dinero) is a 23-year-old digital artist from Nigeria. He is currently studying at the University of Lagos and has been practicing digital art for seven years. His work is a fusion of minimalism and precisionism, telling stories through the use of lines, geometric shapes, and simple colors that reveal beauty in simplicity. His inspirations range from architectural design to his surrounding environment to life experiences and memories. Yomi joined Web3 in early 2022 to give more value to his art and to connect with creatives across the world. He has exhibited globally and his works have sold on NFT marketplaces including Foundation, Objkt, Opensea, and SuperRare. Since his early teenage years, Dylan Wade has created hundreds of personal videos whose wide-ranging content is unified by nostalgia. His work captures moments through the meaningful compilation of different clips, eliciting feelings, old memories, and familiarity in the process. Through suggestive shapes and ambiguous scenes, hopefully viewers will find their own memories in his work."
