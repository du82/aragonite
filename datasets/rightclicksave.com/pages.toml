["https://www.rightclicksave.com/article/a-brief-history-of-rare-pepe"]
title = "A Brief History of Rare Pepe"
description = "How a viral meme went from outcast to art museum by Martin Lukas Ostachowski"
full_description = "Since the exhibition “DYOR” opened in October 2022, visitors to Kunsthalle Zürich have encountered the surprising figure of Pepe the cartoon Frog surrounded by historic works of crypto art. Curated by Nina Roehrs, “DYOR” (Do Your Own Research) emphasizes the role played by Rare Pepe, a bitcoin-based project centered on the popular meme, in the development of crypto art in general. The exhibition incorporates a prominent living room-style Pepe space, sub-curated by Fabian Wyss, that traces a history of the distinctive, endlessly redrawn frog on its way to becoming the millennial Mickey Mouse. Rare Pepes are collectible digital trading cards that explore the life of the irresistibly memetic Pepe, created by Matt Furie back in 2005 for his self-made zine Playtime. The project ultimately evolved into a handmade comic book, Boy’s Club, with Pepe one of four postcollegiate slacker roommates, described by Furie as “little critters who represent my early-20s lifestyle.” Furie scanned the comics, which then went viral among bodybuilder and anime communities when he posted them on his Myspace account. Following Pepe’s meteoric rise to becoming the Internet’s unofficial mascot, the Rare Pepe project hit a peak in 2014 when celebrities such as Katy Perry and Nicki Minaj posted viral frog memes on their social media channels. Around that time, message board users started introducing the concept of rarity, adding watermarks to their memes, while christening them “Rare Pepes”. Users began creating collections of Pepe memes, exchanging them like trading cards, with the number of different variants promptly exceeding one thousand. Within months, such collections began surfacing across online marketplaces, from eBay to Craigslist. One prominent auction in April 2015 was removed by eBay with a highest bid of $99,166. Then, in September 2016, an anonymous user called “Mike” created three Pepe trading cards, backing them on the Counterparty protocol — an application layer of the Bitcoin blockchain. The user tokenized the trading cards as Counterparty assets in indistinguishable editions."
