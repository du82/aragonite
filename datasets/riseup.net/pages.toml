["https://riseup.net/de/about-us/policy/tos"]
title = "Nutzungsbedingungen - riseup.net"
full_description = "Dieses Dokument beschreibt, welche Aktivitäten erlaubt sind, unter welchen Voraussetzungen wir deinen Account schließen können und es erklärt unsere Haftungsbeschränkungen. Es gilt für alle Interaktionen mit riseup.net. Wenn du Dienste von riseup.net nutzt, erklärst du dich mit diesen Nutzungsbedingungen einverstanden. Wir bitten dich darum, unsere (Datenschutzrichtlinie) zu beachten, damit du weißt, wie wir deine Daten sammeln und verarbeiten. Alle Inhalte, unabhängig davon ob sie öffentlich gepostet oder privat übertragen wurden, liegen in der alleinigen Verantwortung der Person, die sie verfasst hat. Wir dürfen die Inhalte, die über unsere Dienste gepostet werden weder überprüfen noch kontrollieren und können für sie keine Verantwortung übernehmen. Jegliche Nutzung von und jegliches Vertrauen auf Inhalte die über unsere Dienste gepostet wurden, oder die du durch unsere Dienste erhalten hast, geschieht auf eigene Gefahr. Du bist verantwortlich für deine Nutzung unserer Dienste und für alle Inhalte, die du zur Verfügung stellst und alle daraus resultierenden Konsequenzen. riseup.net kann die Bereitstellung von Diensten zu jeder Zeit aus jedem beliebigen Grund einstellen. Normalerweise jedoch werden Accounts gelöscht aus einem der folgenden Gründe: Du stimmst zu, dass riseup.net dir oder anderen Beteiligten gegenüber nicht haftbar gemacht werden kann für direkte, indirekte, beiläufige, konkrete, mittelbare oder vorsätzliche Schäden, einschließlich aber nicht beschränkt auf Schäden durch Verlust von Gewinn, Ansehen, Nutzen, Daten oder durch andere immaterielle Verluste, unabhängig davon ob wir auf die Möglichkeit eines solchen Schadens hingewiesen wurden. Im Fall dass geltendes Recht die Eingrenzung oder den Ausschluss der Haftung für beiläufige oder mittelbare Schäden nicht zulässt, treffen die oben beschriebenen Beschränkungen oder Ausschlüsse möglicherweise auf dich nicht vollständig zu, unsere Haftung wird allerdings soweit wie durch geltendes