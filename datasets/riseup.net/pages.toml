description = "How to create a form on your website which allows someone to subscribe to a riseup.net list."
full_description = "If you want to put a form on your website which allows someone to subscribe to a riseup.net list, here is a simple HTML snippet which will do the job: NOTE: replace listname with the name of your list. For example, if your list was anarchism101@lists.riseup.net, replace listname with anarchism101. Also, the action must be use SSL (ie ) for the form to work. If you are able to write a script to handle the processing of the form, you can send mail to listname-subscribe@lists.riseup.net with the “From:” mail header set to address of the person who wants to subscribe. This way, the user will not get redirected to the lists.riseup.net website and will stay on your site. This method is preferable, since currently the web interface to sympa is a bit awkward: when you try to subscribe via the web, it sends you a password in the mail that you then need to copy back to the website. For email based subscription requests, you just need to reply back to the message. It is possible to manage most aspects of a list remotely using SOAP. Currently, we do not have SOAP enabled, but we probably will soon. SOAP is not for the faint of heart and requires serious programming. If you want to dive into SOAP for sympa, let us know and read up on it at www.sympa.org/."
