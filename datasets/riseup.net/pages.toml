["https://riseup.net/en/email/clients/thunderbird"]
title = "Thunderbird - riseup.net"
full_description = "Thunderbird is the mail client recommended by riseup.net. It is Free Software and is available for Linux, Windows, and Mac OS X. You can download Thunderbird from the thunderbird website. As Free Software, Thunderbird is part of the digital commons, a kind of common treasury for all. Outlook, on the other hand, is Microsoft’s tool for world domination. Thunderbird has many features, including: IMAP and POP support, multiple accounts, quick search, spell as you type, advanced spam controls, RSS, virtual folder views, message filtering, addressbook, and support for OpenPGP encryption. The first time you run Thunderbird, the account wizard will walk you through setting up an account. If the wizard does not open, you can do this: If this does not work, you may have entered your username or password wrong. Click Start Over and try again. Otherwise… Per default every time you open a mail or change the status Thunderbird connects to the mail server. For slow connections or when Riseup’s servers are busy this can be pain. Luckily there is a fix: Thunderbird has some hidden options, that a does a complete sync when connecting the server. This will speed up your workflow and makes your day better. Do you really need to keep all that email? You can configure thunderbird to automatically delete your old email. To do this, navigate to Account Settings —> Local Folders —> Disk space. You can set thunderbird to delete messages once they get to be X days old."
