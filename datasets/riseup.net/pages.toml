full_description = "Falls das nicht funktionieren sollte ist die wahrscheinlichste Ursache, dass die ‘unsubscribe’-Email von einem anderen Email-Account aus gesendet wurde als dem, für das das Listen-Abonnement eingerichtet wurde. Wenn möglich stelle also bitte sicher, dass Du die ‘unsubscribe’-Email von dem Email-Account, für den das Listen-Abo eingerichtet ist, gesendet wird. Falls das nicht möglich ist verfahre bitte folgendermaßen: Stelle bitte sicher, dass der Email-Account, von dem aus Du die Email schickst, derjenige ist, für den Du die Liste Abonnieren möchtest. Im ‘Zusammenfassungs-Modus’ bekommst Du viele Postings an die Liste in einer Email zusammengefasst statt als separate Emails. Der Listen-Administrator hat festgelegt, ob Dein Account Zusammenfassungen empfangen kann und über welchen Zeitraum Postings zusammengefasst werden. Falls Du dann keine Zusammenfassungen erhältst könnte es sein, dass der Listen-Administrator noch die Zusammenfassungs-Optionen für die Liste einrichten muss. Die Uhrzeit für das Zusammenfassungsintervall muss größer als eins und kleiner gleich 22 (10 Uhr abends) sein. Diese Option legt fest, wann die Zusammenfassung gesendet wird. Liegt die gewählte Zeit zu nah an Mitternacht wird die Zusammenfassung nicht funktionieren (ein Bug in der Mailinglisten-Software). Du Kannst den Listen-Administrator mit einer Email an listname-admin@lists.riseup.net kontaktieren. Manchmal ist es gewünscht, eine Liste abonniert zu haben, aber keine Emails von der Liste zu bekommen. Beispielsweise, wenn die Liste für mehrere Deiner Email-Accounts abonniert ist, Du aber nur auf einem Account Emails von der Liste empfangen möchtest. Der Wechsel in den „no-mail“-Modus erfolgt folgendermaßen:"
