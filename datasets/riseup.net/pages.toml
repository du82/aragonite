["https://riseup.net/pt/about-us/policy/privacy-policy"]
title = "Política de Privacidade - riseup.net"
full_description = "Este documento descreve quais são as informações que colhemos e para que as usamos. Ele se aplica a todas as interações com riseup.net. A sua utilização dos serviços de riseup.net indica que você concorda com esta Política de Privacidade. Por favor, leia também nossos Termos de Serviço. Sabemos que você espera privacidade ao se comunicar, transferir e armazenar dados com este sistema de informação. Nós coletamos pouquíssimas informações pessoais, que jamais compartilhamos. Quando você cria uma conta, nós registramos a data do cadastro (arredondada para o trimestre mais próximo). As informações de solicitação de conta são excluídas depois de quatro meses, e o status do convite, depois de um mês. Se você decidir especificar um e-mail de recuperação de conta, nós o guardaremos, mas em um formato ilegível por nós (ele será armazenado em hash, de forma similar a uma senha). O conteúdo de qualquer tíquete de ajuda que você cria ou comenta depois de se autenticar fica associado à sua conta. Você pode preencher um tíquete de ajuda anonimamente criando-o sem, antes, fazer login. Nós apagamos, periodicamente, tíquetes de ajuda antigos e já resolvidos. Quando você entra no sistema, nós salvamos, no seu computador, um identificador de sessão temporário, usado pelo navegador para confirmar que você se autenticou. Ele é apagado assim que você sai do sistema ou que sua sessão expira. Não usamos cookies de terceiros, nem fazemos rastreamento de nenhum tipo. Para detectarmos quando nossos servidores sofrem ataques de “bomba de spam” ou quando alguém usa nosso sistema para mandar spam, nós mantemos registros das informações de remetente e destinatário de todas as mensagens enviadas e recebidas. Esses registros são destruídos diariamente. Nós registramos o mês e o ano da sua última autenticação bem-sucedida para poder desabilitar e apagar contas inativas. Não registramos a hora nem o dia do último login. Por exemplo, a data pode ser salva como “Q3 2018”."
year_published = 2025
clearnet = "https://riseup.net/pt/about-us/policy/privacy-policy"
tags = ["acadêmica", "ajuda", "armazenamos", "cadastro", "coletadas", "colhemos", "como", "compartilhamos", "conta", "criptografia"]
