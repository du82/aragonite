title = "Donate - riseup.net"
full_description = 'Riseup works tirelessly to create grassroots technology alternatives that address the communication needs of people and organizations working for social change. When you get a service from a corporation that doesn’t charge you, chances are that the money comes from extensive surveillance. Riseup, on the other hand, relies on donations by users like you who believe in supporting democratic alternatives. For more information about Riseup, you can meet our members and check out our project areas. Riseup is a registered nonprofit under section 501(c)(4) of the US Internal Revenue Code. Donations to riseup.net are not tax-deductible. If you would like to make a tax-deductible donation (US), you can contribute to our sister organization, Riseup Labs. If you have a big list with over a hundred subscribers or with high traffic and lots of archives, increase the suggested donation amount several fold. Please consider donating more if you can afford it. Any money left over after we have met our basic expenses gets folded back into providing service to more users. If you are making a large donation (thank you!), then please consider sending a check or money order through the mail–online payment systems take a cut of about 3%. All financial decisions by the Riseup Collective are made using the consensus process by collective members. Unfortunately, we don’t have the labor to send you a letter of thanks when we receive your donation. Please know that we are so incredibly grateful: your support is our lifeblood and makes all our hard work possible. We love you for putting your money where your values are! Exception: We are required by law to annually report the identity of any donor who gives more than $5,000 USD. var regular_id = "BPFRUBU4TVYYS" var micro_id = "94WVNL67BW6VN" function updatePaypal(form, field) { if (field.value < 11.90476) { form.business.value = micro_id } else { form.business.value = regular_id } } Paypal क्रेडिट कार्ड स्वीकार करता है और आव