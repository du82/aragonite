["https://riseup.net/pt/security"]
title = "Segurança - riseup.net"
full_description = "Pressionado pelo tempo? Ocupado demais resistindo a opressão ou construindo um mundo melhor? Ótimo! Nós sugerimos a você iniciar sua jornada de segurança com esses passos fáceis que todo mundo pode seguir para tornar sua vida digital muito menos vulnerável. A importância crescente da informação e da comunicação trouxe consigo um outro fenômeno: o surgimento de uma sociedade da vigilância. Você pode pensar na vigilância como uma tentativa dos poderosos de manter sua dominação pelo controle da comunicação. Os Estados nacionais responderam às novas tecnologias de comunicação montando uma infraestrutura que pode ser facilmente utilizada para o controle social total. Diferentemente das eras anteriores das comunicações, a natureza da tecnologia atual requer que nossas informações ou estejam segura de uma maneira que frustre os governos, ou estejam totalmente inseguras de um jeito que possibilta o monitoramento amplo e detalhado de uma população inteira. As corporações descobriram que a coleta e análise de quantidades massivas de dados pessoais é necessária se elas quiserem manter-se competitivas num mundo rico em informação. Em particular, quase toda a publicidade está se voltando para o monitoramento dos nossos comportamentos pessoais. Quando as pessoas começam a aprender sobre o crescimento da vigilância elas começam a se sentir totalmente subjulgadas. Algumas decidem que é impossível estarem seguras, e então se resignam a viver sob vigilância perpétua ou abandonam todas as formas de comunicação digital. No Riseup, nós acreditamos que existe um terceiro caminho: nosso objetivo é fazer com que um alto nível de segurança seja fácil e acessível para todxs. Muito da luta contra a vigilância se dá no sistema legal e nós aplaudimos aqueles engajados nessa área. Em contraste, o foco do Riseup é na tecnologia. Quando as leis são injustas, nós acreditamos que uma nova realidade técnica seja necessária pra alterar as possibilidades legais e políticas."
