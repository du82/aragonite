["https://riseup.net/en/about-us/projects/programmers-wanted"]
title = "Programmers Wanted - riseup.net"
full_description = "Let’s face it: the technology and infrastructure that are available to social movements will not be adequate in the coming years. As we enter a wave of worldwide social unrest and organizing, we are faced with two trends: We simply do not have the technology or the infrastructure we are going to need. Riseup is working to help build the infrastructure. Ultimately, however, Riseup is only as good as the technology we run. To be able to address the future communication needs of social movements, we are going to need much better tech and we are going to need it real soon. If you are a programmer, we need your help. Now is the time to use your skills for good. Write to collective@riseup.net. In the near future, Riseup will be switching over to use the LEAP platform. Please see https://leap.se for how you can contribute to this effort."
