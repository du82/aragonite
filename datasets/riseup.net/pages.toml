["https://riseup.net/en/security/human-security/passwords"]
title = "Passwords - riseup.net"
description = "Better living through better passwords"
full_description = "The use of a password manager is one of the most important changes you can make to increase your personal security. A password manager application will allow you to use both strong and unique passwords. With a password manager, you just remember a single password that opens up your secure file or account, which in turn stores all of your other passwords. Regardless of what you choose, what really matters is that you use a password manager. Please keep in mind two important tips: Strong passwords are randomly generated. Except for the password to unlock your device, and the password to unlock your password manager, all your passwords should be randomly generated by a password manager, should be at least 12 characters, but does not need to be more than 26 characters. Humans are very bad at coming up with secure passwords, but computers are excellent. Let the computer do it for you. For passwords that you must remember, there are many ways to generate strong passwords, if you are using a password manager, let it generate them for you. There is a guide in Security Self-defense for Creating Strong Passwords. Diceware is a fun and effective scheme for creating random yet memorable passwords using everyday objects and a word list. One other great way to make a strong password is to come up with a silly sentence that no one’s ever said before and use the first letter or two of each word as your password, mixing in other types of characters. It is important to apply strong passwords to all accounts, as access to a single account can often be leveraged into access to other systems. This is especially relevant for any email accounts that can be used to reset or recover other passwords (usually via a “forgot password” link). Following this practice is a great way to minimize the risk of using third-party technology services. If you don’t reuse passwords, someone learning your username and password for one service through a leak or break-in won’t make it easy to access the other accounts you use. Use different passwords for each service so you aren’t relying on the services you’re logging into to protect your most important secret. This will be easy to do if you use a password manager."
year_published = 2025
clearnet = "https://riseup.net/en/security/human-security/passwords"
