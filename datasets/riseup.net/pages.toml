title = "VPN - riseup.net"
full_description = "Riseup sta testando in beta un nuovo client chiamato RiseupVPN. Questo client VPN è facilissimo da usare! Semplicemente, installalo e lancialo— non sono necessarie configurazioni e non è necessario creare alcun account. Si tratta di un esperimento per vedere se possiamo creare un servizio VPN che sia semplice da usare per tutti e che si possa sostenere con le donazioni delle persone. Su Mac, Windows e Linux, RiseupVPN crea un menu nella barra delle applicazioni con un'icona che indica se la VPN è connessa o no: Per attivare o disattivare la VPN, clicca l'icona nella barra delle applicazioni e seleziona la voce di menu desiderata. Il servizio RiseupVPN è finanziato interamente dalle donazioni degli utenti. Se per te un servizio no-profit e facile da usare che non traccia gli utenti ha un valore, dai un contributo per mantenere RiseupVPN in vita. Il costo che sosteniamo per offrire RiseupVPN è di circa 60 USD l'anno per ogni persona. Se usi la VPN, prendi in considerazione di fare una donazione almeno dello stesso importo. Grazie! Nota: nel caso tu faccia una donazione da un'altra pagina, non sapremo che stai facendo una donazione per la VPN. Aiutaci a capire se questo servizio è sostenibile facendo la donazione usando i link che si trovano su questa pagina. Liberapay è un servizio no-profit che permette di effettuare donazioni ricorrenti; i loro servizi sono basati su software libero. Per creare un ticket di richiesta di aiuto per RiseupVPN, visita support.riseup.net. Se dovessi trovare un malfunzionamento, crea una segnalazione di malfunzionamento anziché un ticket di richiesta d'aiuto (vedi sotto). Ti puoi unire a RiseupVPN e bitmask tester mailing list. Lì potrai fare domande ed prendere parte alle discussioni della community riguardanti le versioni di sviluppo del nostro beneamato client VPN."
