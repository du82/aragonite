["https://riseup.net/zh/security"]
title = "安全 - riseup.net"
full_description = "时间不够？忙于抵制压迫或建设一个更好的世界？很好! 我们建议你从这些简单的步骤开始你的安全之旅，每个人都可以采取这些步骤，使他们的数字生活少受伤害。 信息和通信的重要性日益增加也带来了另一种现象：*社会监视*的崛起。您可以把监控作为向通过对通信的控制来维持其主导地位的一个强大进攻。 国家 通过推行基础设施来轻易地对整个社会控制重新规划，已对新的通信技术作出回应。不像早期的通信时代，目前的技术性质要求我们的信息要么在一定程度上挫败政府，要么是完全不安全，在一定程度上使广泛和详细的监视整个人口成为可能。 企业 已经发现，如果他们希望在一个信息丰富的世界保持竞争性，收集和分析海量个人数据是有必要的。尤其是，几乎所有的广告正在向基于监视跟踪我们的个人能习惯的方向转变。 犯罪分子 已经发现，攻击个人设备和云账户以赎回数据或勒索用户是非常有利可图的。 当人们开始了解到监控的增加，他们开始感到不知所措。有些人决定不可能做到安全，所以他们认命地生活在永久的监控之下，或者放弃所有形式的数字通信。在Riseup，我们相信有第三种方法：我们的目标是让每个人都能轻松获得高度的安全。 另外，请查看安全资源页面，以获得更多的安全指南和社运积极人士提供者的链接。 如果你需要就你的Riseup账户或Riseup本身的安全相关问题联系Riseup，请给我们发送一个加密电子邮件。"
