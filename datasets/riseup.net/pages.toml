full_description = "Unfortunately the Snap package is currently out of support. Please don’t install riseup-vpn from the Snap store, as it is an out of date version. We would like to get it working again, but we need some help from the community. There is a riseup-vpn package in the official Debian repositories beginning with Debian Bookworm. For a newer version, please install from backports or unstable. Install it by running the following command in a terminal, or look for the riseup-vpn package in your favorite package manager: The are AUR (Arch User Repo) packages for Arch Linux and Manjaro. The version with the -git suffix builds the latest developer version. To install, run: If the launcher icon does not work, you can run RiseupVPN from the command line in order to identify the problem: In recent GNOME versions, tray icons are not shown by default, or are shown in a tiny tray in the bottom right of the screen. In order to have RiseupVPN’s icon visible in the top-right corner of the screen, you can install the AppIndicator GNOME extension and enable it: For Debian-based distributions (only tested on Debian Buster): * Install package gnome-shell-extension-appindicator, from the package manager or using this command line in a terminal: sudo apt install gnome-shell-extension-appindicator * Close your session and reopen it, or restart the computer * Open the Tweaks application, and in the left pane, select Extensions * Enable “Kstatusnotifieritem/appindicator support” * Enjoy :) RiseupVPN’s clients are based on the open source software Bitmask. The code for the Linux client can be found here."
