full_description = "Riseup has a VPN client called RiseupVPN. This VPN client is super easy to use! You just install it and run it—no configuration, no account registration. This is an experiment to see if we can create a VPN service that is easy enough for everyone to use and that people will donate enough to sustain. On Mac, Windows and Linux RiseupVPN will create a system tray menu with an icon that indicates if the VPN is connected or not: The RiseupVPN service is entirely funded through donations from users. If you value an easy, non-profit VPN service that does not track users, then please contribute to keeping RiseupVPN alive. The cost for us to offer RiseupVPN is approximately $60 USD per person per year. If you use the VPN, please consider donating at least this much. Thank you! Note: If you donate using a different page, we will not know that you are donating for the VPN. Please help us figure out if this service can be sustainable by donating using only the links on this page. Donations to riseupvpn can be by credit or debit card (Visa, MasterCard, American Express), or by direct debit of a Euro bank account (for donations in Euro only). We use Liberapay, a non-profit subscription donation and payment service based on free software. To fill out a support ticket for RiseupVPN, please visit support.riseup.net. If you found a bug, please fill out a bug report instead of a support ticket (see below). You can join the RiseupVPN and bitmask tester mailing list. There you can ask questions and be part of a community conversation around the development versions of our beloved VPN client."
