["https://riseup.net/ru/about-us"]
title = "О нас - riseup.net"
full_description = "Можете ли вы положиться на корпоративного поставщика услуг электронной почты в плане конфиденциальности? Они не только сканируют и записывают содержание ваших сообщений для огромного количества различных целей, они ещё соглашаются с требованиями правительств по ограничению цифровой свободы и не могут придерживаться строгой политики касательно конфиденциальности своих пользователей. Это даже не говоря об очевидных коммерческих интересах, это противопоставляет коммерческие структуры, предоставляющие услуги электронной почты, тому, что делаем мы. Правительство США практикует «полный мониторинг каналов» и ассоциативное картирование, которое позволяет им создавать подробную карту того, как организованы наши общественные движения, но хуже всего то, что это даёт им информацию о том, какие связи требуется разрушить, чтобы нарушить жизнь даже очень больших общественных движений. Мы считаем, что основная коммуникационная инфраструктура должна контролироваться движениями и организациями, а не корпорациями и правительством. Мы стремимся к тому, чтоб наша почта была настолько безопасной и конфиденциальной, несколько это для нас возможно. Мы не записываем вашего IP адреса. (Большинство сервисов хранят подробные записи о каждой машине, подключающейся к серверам. Мы же храним только ту информацию, которая не может быть использована для уникальной идентификации вашей машины). Все ваши данные, включая вашу почту, хранятся riseup.net в зашифрованном виде. Мы усердно работаем над тем, чтобы наши серверы были безопасны и хорошо защищены от атак злоумышленников. Мы не делимся какими-либо пользовательскими данными с кем бы то ни было. Мы активно боремся с любой попыткой использования судебных повесток и других средств с целью получения какой-либо пользовательской информации и журналов. Мы не читаем, не выполняем поиск, не обрабатываем ваши входящие и исходящие сообщения электронной почты, сообщения лишь проходят проверку с целью защитить вас от вирусов и спама, либо для решения проблем при условии, что вы сами об этом попросили."
year_published = 2025
