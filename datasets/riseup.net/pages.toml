title = "Courriel - riseup.net"
full_description = "Si vous ne trouvez pas ce que vous cherchez, remplissez un billet de dépannage. Une fois que l’on a répondu à vos questions, faites nous savoir en quoi ces pages d’aide pourraient être améliorées. Si vous avez oublié votre mot de passe, le seul moyen pour obtenir à nouveau l’accès à votre compte est un code de récupération. Il n’y a pas d’autre moyen, Riseup ne peut pas vous aider si vous avez perdu votre code de récupération. Vous devez absolument sauvegarder ce code dans un endroit sûr. Si vous ne l’avez pas déjà fait, veuillez mettre votre code de récupération dans un endroit sûr maintenant. Si vous ne l’avez pas écrit lorsque vous avez créé votre compte, visitez vos paramètres de compte pour en créer un nouveau et écrivez-le. Il ne peut y avoir qu’un seul code de récupération à la fois. Quand vous en créez un nouveau, il remplace l’ancien code. Visitez account.riseup.net pour changer votre mot de passe, remplacer votre code de récupération, ajouter des alias d’adresse courriel, créer des filtres pour vos courriels, changer votre quota, détruire vos données, configurer des mots de passe spécifiques à des services et demander de l’aide. Internet grouille de personnes qui veulent vous voler votre compte courriel. Vous recevrez probablement un jour un courriel frauduleux d’une personne tentant de se faire passer pour Riseup. Ces courriels vous dirons que vous devez faire une quelconque action pour conserver votre compte. Les courriels dans certains dossiers spéciaux sont supprimés automatiquement après un certain nombre de jours: Pour différentes raisons, nous ne pouvons fournir que 1 GB d’espace de stockage pour les courriels. Si vous avez besoin de plus d’espace, nous vous conseillons de télécharger vos courriels à l’aide d’un client de messagerie. Nous vous encourageons à utiliser l’espace de stockage chiffré de votre compte si ce n’est pas déjà le cas (n’oubliez pas de sauvegarder le code de récupération !). En savoir plus sur les quotas."
