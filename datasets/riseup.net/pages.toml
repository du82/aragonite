["https://riseup.net/en/spam"]
title = "Spam - riseup.net"
full_description = "Well, you are not alone. Most of all email traffic these days is spam. Spammers have all kinds of tricky and evil methods of getting your email address, including scanning web pages, creating viruses to harvest addresses from your friend’s computer, and sending spam to random email addresses in the hopes that some will match. Most spam now comes from “zombie networks,” where the spammers use viruses to hijack a normal home or office computer for the purpose of sending massive amounts of spam. Customize your spam settings: By default, all your incoming mail is scanned for spam. However, you can improve its sensitivity and accuracy by customizing your spam settings. Create a Spam folder: If you have a folder called Spam, then any incoming mail that is suspected of being spam will get delivered directly to that folder. You should check the Spam folder periodically to make sure that the filter did not incorrectly classify a good message as spam. The folder must be named Spam and not spam. Create a temporary disposable alias: A temporary alias is an email alias which you only use for a limited amount of time, and then destroy. This is useful if you need to give your email address to a corporation or you need to post it to a website. Once you start getting spam sent to that alias, just delete the alias. You can create aliases for your riseup.net account by logging in at account.riseup.net. Change your email address: If you really want to cut down on spam, you can simply rename your account. The disadvantage is that then you need to notify everyone that your account changed, but this can be very effective at eliminating spam. If any legitimate mail gets put in your Spam folder, drag it over to your INBOX so our statistical spam filter can learn from its mistakes. A recent study has shown that over 95% of the email traffic on the internet is spam! Yes, 95%! For you and me, it is just a nuisance, but for riseup’s poor servers, it’s a huge hassle. Riseup has deployed a number of tools to combat spam and sometimes a legitimate user’s email will be incorrectly identified as spam. Before contacting us, please review the steps listed here to see if you can resolve the problem."
year_published = 2025
clearnet = "https://riseup.net/en/spam"
