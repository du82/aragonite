full_description = "Μπορείτε να στηριχτείτε σε μία επιχείρηση παροχής email για την εμπιστευτικότητα των ευαίσθητων συνομιλιών σας; Πέραν του ότι συνηθίζουν να σκανάρουν το περιεχόμενο των μηνυμάτων σας για πολλούς και διάφορους λόγους, επιπλέον υποκύπτουν στις απαιτήσεις κυβερνήσεων οι οποίες περιορίζουν την ηλεκτρονική ελευθερία, ενώ δεν έχουν αυστηρές και ξεκάθαρα ορισμένες πολιτικές απορρήτου. Αυτά χωρίς να γίνει καν λόγος στα σαφώς οικονομικά ενδιαφέροντα των επιχειρήσεων παροχής email- σε πλήρη αντίθεση με εμάς. Η κυβέρνηση των Η.Π.Α. εξασκεί παρακολούθηση εύρους διευθύνσεων IP και χαρτογράφηση συσχετίσεων, πράγμα που τους επιτρέπει να δημιουργήσουν μία λεπτομερή καταγραφή του πώς τα κοινωνικά κινήματα οργανώνονται. Ακόμα σημαντικότερα, αυτό τους δίνει ακριβείς πληροφορίες για το ποιές συνδέσεις πρέπει να σπάσουν ώστε οι μεγάλης κλίμακας κινήσεις να διασπαστούν. Πιστεύουμε ότι είναι κρίσιμο οι βασικές υποδομές επικοινωνίας να ελέγχονται από κινηματικές οργανώσεις και όχι από πολυεθνικές και κυβερνήσεις. Επιδιώκουμε σθεναρά να κρατήσουμε τα mail μας όσο το δυνατόν πιο ιδιωτικά και ασφαλή. Δεν καταγράφουμε την διεύθυνση IP σας. (Οι περισσότερες υπηρεσίες διατηρούν λεπτομερείς καταγραφές της κάθε μηχανής που συνδέεται με τους διακομιστές της. Εμείς κρατάμε μόνο πληροφορίες οι οποίες δεν μπορούν να χρησιμοποιηθούν για την απομόνωση και ταυτοποίηση της μηχανής σας). Όλα τα δεδομένα σας, συμπεριλαμβανωμένων και των email σας, αποθηκεύεται από την Riseup.net σε κρυπτογραφημένη μορφή. Εργαζόμαστε σκληρά για να κρατήσουμε τους διακομιστές μας ασφαλείς και καλά προστατευμένους εναντίον οποιασδήποτε κακόβουλης επίθεσης. Δεν μοιραζόμαστε τα δεδομένα χρηστών μας με κανέναν. Θα πολεμήσουμε ενεργά κάθε απόπειρα συλλογής (δικαστική και μη) των καταγραφολογίων και των στοιχείων σας. Δε θα διαβάσουμε, ψάξουμε, ούτε θα επεξεργαστούμε τα εισερχόμενα και εξερχόμενα μηνύματά σας, εκτός μέσω αυτοματοποιημένων μέσων προστασίας από ιούς και spam, εκτός και να μας το ζητήσετε οι ίδιοι για επίλυση τυχόν προβλημάτων."
