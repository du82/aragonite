["https://riseup.net/en/about-us/projects"]
title = "Projects - riseup.net"
description = "A list of some of the projects that Riseup works on."
full_description = "There is a problem with email. The U.S. government practices “full pipe monitoring” and association mapping, which gives them the ability to build a detailed map of how our social movements are organized. For more information on email privacy, see our security primer for activists. We believe it is vital that essential communication infrastructure be controlled by movement organizations and not corporations or the government. For this reason, we provide email service with an unique level of security and privacy. Unlike almost all other email providers, our logs and email headers contain no personally identifiable information. Additionally, all mail is stored on encrypted partitions and transmitted over encrypted connections whenever possible. As far as we can tell, riseup.net is the largest non-profit list hosting service, outside of public universities. We host over 14,000 mailing lists, supporting over four million subscribers. In order to help other technology collectives get established, we provide free servers, bandwidth, and technical support to over a dozen groups around the world. Riseup provides very affordable, secure, and reliable server co-location on a sliding scale basis, based on need. We host about 30 servers, including servers from social justice movement organizations in the US, UK, Germany, France, Italy, Mexico, Brazil, and Canada. Tor is a system designed to enable online anonymity through a network of servers that can hide information about users that may identify them. When you use tor, it is much harder to trace internet traffic to a particular user. It is well known that Tor provides a vitally important service to many, be they activists under surveillance, whistle blowers, journalists, dissidents facing state repression, those wishing to evade censorship, abuse victims, or just regular people who just don’t want their privacy breached by unscrupulous corporate entities betraying the trust of the commons through advertising profiling. While the list of positive benefits that Tor has is innumerable, it wouldn’t be possible without Tor exit nodes and relays. Riseup contributes to the Tor network by providing nodes on quality bandwidth. We run nodes that are in the top 30 in relative bandwidth contribution to the Tor network."
