["https://riseup.net/en/email/webmail"]
title = "Webmail - riseup.net"
full_description = "The primary reason to use webmail is if you do not have your own device that you can install a mail client on. Sometimes people use webmail because they don’t want to leave a record of what email account they use on the device. Webmail is not a good solution for this, because web browsers leave behind all sorts of temporary files, and session files can be recovered with the right tools. For security reasons, we require cookies. Without cookies, it is impossible to make your login session secure. Unfortunately, cookies also allow advertisers and companies like google to track you nearly all your activity on the web. If you are concerned about tracking, we suggest that you simply disable third party cookies, see Better Web Browsing. Alternately, you can block all cookies by default and then enable cookies for the sites you want. The most common question we receive is this: “why can’t I login?” This page will help you figure out what is wrong and help you fix it. If you still cannot login, you should next figure out if the problem is with your account or with your computer. It is possible that the server is down. You can view the status of the mail server, and read any service notices, at this page: If none of the above seem to work, then fill out a help ticket. But please, try these suggestions first! Also, include in your description of the problem a summary of the things you have already tried. To enhance connection security you can use Onion Service configuration to connect to Webmail via Riseup’s .onion services. Look for the according mail.*.onion address on the linked page."
