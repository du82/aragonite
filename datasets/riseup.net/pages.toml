["https://riseup.net/en/lists/list-user/sending-mail"]
title = "Sending Mail - riseup.net"
full_description = "Mail is not archived immediately. Be patient, it will (probably) show up eventually. Sometimes, it never shows up and the archives need to get rebuilt. If this happens, fill out a help ticket. Currently, the maximum list email size is set to 500k, which we feel is more than enough. Big attachments consume lots of computer resources for little benefit. They are rude to people who are forced to download them, and most often the large attachment is not needed by the whole list. Please use shared web documents instead. To contact the list owners, send an email to listname-admin@lists.riseup.net. To contact the list moderators, send an email to listname-editor@lists.riseup.net. It is possible to send HTML mail to riseup.net lists. But first, we ask you that you reconsider sending formatted (aka HTML) messages to a mailing list. If, for some unexplainable reason, you still insist on sending HTML email to a mailing list, this is how you do it: That is it. It will not work to paste HTML fragments into your normal email or to paste HTML into the web based “Post Message” page. There are two possible reasons for this. You may have your subscription options for the list set to not receive copies of your own posts. To find out: If you are still not receiving copies of your own posts, you may have a gmail account. Gmail thinks it is clever by not showing you posts that you make. We can’t do anything about this, you have to check with Gmail to fix that problem. If you’re still having trouble, fill out a help ticket. A recent study has shown that over 95% of the email traffic on the internet is spam! Yes, 95%! For you and me, it is just a nuisance, but for riseup’s poor servers, it’s a huge hassle. Riseup has deployed a number of tools to combat spam and sometimes a legitimate user’s email will be incorrectly identified as spam. Before contacting us, please review the steps listed here to see if you can resolve the problem. First, let’s identify the problem. If your mail is being bounced by riseup, our servers will give a reason for the bounce. Look at the bounce message and compare it to our sample messages below. If you find a match, try the steps listed before contacting us."
