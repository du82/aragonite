["https://riseup.net/es/email"]
title = "Email - riseup.net"
full_description = "Bienvenido a la página de ayuda sobre email de Riseup. Aquí encontrarás la información sobre las cuentas de correo que ofrecemos. Si no encuentras lo que estas buscando cumplimenta un ticket de ayuda. Una vez que tu pregunta sea respondida, por favor, ayúdanos a mantener al día estas páginas enviando cualquier cambio o incorporando la información que desees compartir con otras personas. Visita account.riseup.net desde ahí, puedes cambiar tu contraseña, añadir un alias a tu email, configurar filtros, cambiar tu cuota o solicitar ayuda. Destruimos automáticamente la información que nos proporcionas cuando nos pides que te abramos una cuenta. Deberías considerar eliminar, desde la página de configuración de tu cuenta, cualquier información que pueda identificarte como pueden ser tu nombre, tu cumpleaños, la pregunta secreta o el email secundario. Sin embargo, si pierdes tu contraseña y no has establecido esta información, o has olvidado qué has guardado, o el correo secundario no tienes acceso al correo secundario, perderás el acceso a tu cuenta. En internet hay gente interesada en robarte tu cuenta de correo electrónico. En algún momento, probablemente recibas un email fraudulento procedente de alguien que suplanta a riseup.net. Estos correos pretenderán que realices determinadas acciones para mantener tu cuenta. Por distintas razones solo podemos brindar 1 GB de almacenamiento para tu e-mail. Si necesitas más espacio, plantéate descargar tus correos usando un cliente de e-mail. Te recomendamos habilitar el almacenamiento cifrado para tu cuenta si no lo estás usando aún (¡pero asegúrate de guardar bien el código de recuperación!). Leer más sobre la Quota. Aunque la interfaz web de riseup.net no tiene muchas funcionalidades, puedes usar tu cuenta de correo electrónico de riseup.net con un cliente IMAP o POP, estás aplicaciones tienen mucho potencial y están diseñadas específicamente para gestionar tus correos. Échale un ojo a nuestros tutoriales para los clientes email más populares."
