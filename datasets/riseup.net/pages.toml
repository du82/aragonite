["https://riseup.net/fr/about-us/policy/privacy-policy"]
title = "Politique de confidentialité - riseup.net"
full_description = "Ce document décrit les informations nous collectons et pourquoi elles sont utilisées. Cette politique s'applique pour l'ensemble des interactions avec riseup.net. En utilisant les services de riseup.net, vous acceptez notre politique de confidentialité. Nous vous recommandons fortement de lire nos conditions d'utilisation. Vous avez des attentes raisonnables sur la sécurité des communications et des données qui transitent ou qui sont stockées par ce système d'information. Nous ne collectons que très peu d'informations personnelles et nous ne partageons jamais celles qui sont collectées. Quand vous créez un compte, nous conservons la date de création du compte (arondie au trimestre le plus près). Les informations utilisées lors de la demande d'une compte sont supprimées après quatre mois et les informations sur les invitations sont supprimées après un mois. Si vous décidez d'utiliser un courriel de récupération, nous conserverons cette information dans un format chiffré que nous ne pouvons pas consulter (comme pour nos mots de passe, nous utilisons une valeur de hachage pour chiffrer cette valeur). Le contenu de tous les billets d'aide que vous créez ou sur lesquels vous commentez une fois authentifié seront associés à votre compte d'utilisateur. Vous pouvez choisir de remplir un billet d'aide de manière anonyme en créant des billets d'aide sans vous connecter avec votre compte. Nous effaçons périodiquement les vieux billets d'aide qui sont fermés. Quand vous êtes connecté avec votre compte, nous conservons un identifiant de session temporaire sur votre ordinateur que vos programmes utilisent pour prouver votre état d'authentification. Cet identifiant est supprimé immédiatement quand vous vous déconnectez ou que votre session arrive à terme. Nous n'utilisons pas de cookies de tierces parties ou tout autre forme de surveillance. Pour être en mesure de détecter quand nos serveurs sont attaqués par une “bombe de spam” or quand un spammer utilise nos systèmes, nous conservons des journaux des informations “de” et “à” (“from” et “to”) pour chaque messages relayés. Ces journaux sont supprimés quotidiennement."
