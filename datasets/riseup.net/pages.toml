["https://riseup.net/en/email/settings/smtp"]
title = "Sending Mail - riseup.net"
full_description = "SMTP stands for Simple Mail Transfer Protocol. It is how mail servers talk to each other to deliver mail. If you want to send any mail on the internet, you need an SMTP server. If you are using web mail, then all this is handled automatically for you, you don’t need to worry about what SMTP server to use. If you are using a mail client, you must enter a specific SMTP server as your ‘outgoing mail server’. Riseup.net’s outgoing mail service requires authentication and a secure connection (SSL or TLS) for security and anti-spam reasons. To use riseup.net as your outgoing mail server (SMTP), use these settings: If you plan on sending thousands of messages using SMTP, you may need to ask us first before it will work. Send mail to support@riseup.net. This problem appears when you do not have your mail client configured to authenticate to the outgoing mail server."
