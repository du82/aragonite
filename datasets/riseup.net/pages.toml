["https://riseup.net/pt/about-us"]
title = "Quem Somos - riseup.net"
full_description = "Você pode confiar em provedores de email corporativos para confidencialidade de suas comunicações de email sensíveis? Não apenas eles tipicamente examinam e gravam o conteúdo de suas mensagens para uma ampla variedade de propósitos, mas também cedem às demandas do governo que restringem a liberdade digital e falham em ter políticas estritas acerca da privacidade dos usuários. Sem mencionar que seus interesses comerciais obviamente colocam provedores de email comerciais em estranhamento com o que estamos fazendo. O governo estadounidense pratica o monitoramento total das redes¹ e o mapeamento por associação, que a ele conferem a habilidade de construir um mapa detalhado de como nossos movimentos sociais são organizados, ainda pior, isso dá-lhes precisas informações sobre que ligações devem ser rompidas a fim de romper com movimentos sociais amplos. Acreditamos que é vital que infraestruturas essenciais de comunicação sejam controladas por organizações de movimentos e não por corporações ou governos. Nós lutamos para manter nosso email o mais seguro e privado possível. Nós não registramos seu endereço IP. (A maioria do serviços mantém gravações detalhadas de cada máquina que se conecta a seus servidores. Nós mantemos apenas a informação que não pode ser usada para unicamente identificar sua máquina). Todos os teus dados, incluindo teu email, é armazenado pelo riseup.net de forma encriptada. Nós trabalhamos duro para manter nossos servidores seguros e bem defendidos contra ataques maliciosos. Não compartilhamos nenhum de nossos dados de usuários com ninguém. Iremos ativamente combater qualquer tentativa de intimação ou diferente obtenção de qualquer informação de usuário. Nós não leremos, pesquisaremos, ou processaremos qualquer um de teus emails enviados ou recebidos, a não ser por meios automáticos para protegê-los de vírus ou spam, ou quando requisitado por ti a fazê-lo para solução de problemas. O Coletivo Riseup é um corpo autônomo sediado em Seattle e com membros no mundo todo. Nosso propósito é apoiar na criação de uma sociedade livre, um mundo com liberdade de querer e liberdade de expressar-se, um mundo sem opressão ou hierarquia, onde o poder é compartilhado igualmente. Nós fazemos isso fornecendo comunicação e recursos computacionais para aliados comprometidos em lutas contra o capitalismo e outras formas de opressão."
year_published = 2025
