title = "S'abonner aux listes - riseup.net"
full_description = "Si cela ne fonctionne pas, la cause la plus probable est que vous avez envoyé le message pour vous désabonnement en utilisant une autre adresse courriel que celle qui est inscrite à la liste. Ceci peut arriver si vous avez plusieurs adresses (ou alias) pour la même boîte courriel. Si possible, assurez vous que l’adresse d’expédition de votre courriel de désabonnement correspond à celui que vous avez utilisé pour l’inscription. Si ceci n’est pas possible, suivez ces étapes : Assurez vous que le compte courriel que vous utilisez à ce moment est celui que vous voulez inscrire. Si vous ne pouvez pas envoyer une confirmation à partir de la même adresse que vous voulez inscrire, vous devez suivre une autre procédure. Voici les étapes nécessaires en ce cas: Dans le mode ‘compilation’, vous recevez plusieurs messages envoyés à la liste en un seul courriel, et non pas chaque message séparément. La personne administrant la liste décide si vous êtes autorisé à vous abonner à la liste en mode ‘compilation’ ainsi que la période couverte dans la compilation. Si vous ne recevez pas les compilations il est possible que la personne administrant la liste n’a pas configuré la compilation. Pour ce faire, il faut que cette dernière choisisse entre 01h et 22h pour la compilation. Si cette heure est trop proche de minuit, la compilation ne fonctionnera pas (c’est un bug dans le logiciel). Vous pouvez contacter la personne administrant la liste en lui envoyant un courriel au nomdelaliste-admin@lists.riseup.net. Parfois, vous voulez restez inscrit à une liste sans en recevoir les messages. Ceci peut arriver si vous avez plusieurs adresses courriels ou si vous préférez lire les messages dans l’archive en ligne. Dans ce cas, vous pouvez activer le mode sans courriels ainsi:"
