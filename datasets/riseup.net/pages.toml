["https://riseup.net/it/email"]
title = "Email - riseup.net"
full_description = "Benvenuta/o nella pagina di aiuto sull’email. Qui troverai informazioni relative alle caselle di posta elettronica di riseup.net. Se non trovi quello che stai cercando apri un ticket per ottenere aiuto. Una volta che la tua domanda avrà ottenuto una risposta, aiutaci a mantenere queste pagine aggiornate inviando gli aggiornamenti o le aggiunte che vorrai condividere con gli altri utenti. Visita account.riseup.net , da lì potrai cambiare la tua password, aggiungere un alias alla tua casella, impostare filtri per la posta elettronica, modificare lo spazio a tua disposizione e richiedere aiuto. Noi distruggiamo le informazioni che ci fornisci quando richiedi la tua casella di posta. Dovresti prendere in considerazione di rimuovere dalle impostazioni della tua casella qualsiasi informazione che possa identificarti, come ad esempio il tuo nome, il tuo compleanno, le domande segrete e gli indirizzi di posta alternativi. Tuttavia, se dimenticherai la tua password e questa informazioni non saranno impostate (o se hai dimenticato le informazioni o il tuo indirizzo di posta alternativo non è più accessibile), avrai perso l’accesso al tua casella. Internet è piena di gente che tenta di rubare il tuo account di posta elettronica. Con ogni probabilità, ad un certo punto riceverai un email fraudolenta da qualcuno che fingerà di essere riseup.net. Questi messaggi ti chiederanno di fare qualcosa per mantenere il tuo indirizzo di posta. I messaggi contenuti in alcune cartelle speciali vengono cancellati automaticamente dopo un certo periodo di tempo: Per diverse ragioni, non forniamo molto spazio per i messaggi di posta elettronica. Se hai bisogno di più spazio, considera la possibilità di scaricare le tue mail usando un client di posta oppure aumenta la tua quota di spazio visitando account.riseup.net. Approfondimenti sulla Quota. Sebbene l’interfaccia basata su web di riseup.net non abbia molte funzionalità, puoi usare la tua casella di posta elettronica di riseup.net con un client POP o IMAP, un applicazione ricca di funzionalità fatta apposta per gestire le tue email. Dai un’occhiata a nostri tutorial per molti client di posta elettronica."
