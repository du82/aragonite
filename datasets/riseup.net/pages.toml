title = "Donar - riseup.net"
full_description = 'Riseup trabaja sin descanso para crear tecnologías de base que se ocupen de las necesidades de comunicación de la gente y las organizaciones que trabajan por el cambio social. Cuando recibes un servicio de una empresa que no te cobra, lo más probable es que saquen dinero por vigilarte de forma intensiva. Riseup, en cambio, depende de las donaciones de sus usuarias y usuarios, que como tú, creen en el mantenimiento de alternativas democráticas. Para más información sobre Riseup, puedes conocer a nuestra gente y echar un ojo a nuestros proyectos. Riseup es una organización sin ánimo de lucro registrada en la sección 501(c)(4) del Código de Rentas de los EE.UU. Las donaciones a favor de riseup.net no pueden deducirse. Si quieres hacer una donación que pueda deducirse (en los EE.UU.), colaborar con nuestra organización hermana, Riseup Labs. Si tienes una lista grande, con más de un centenar de suscriptores o con un gran tráfico y muchos archivos, aumenta varias veces las cantidades propuestas. Por favor, considera hacer una donación mayor si puedes permitírtelo. Todo el dinero que nos sobra después de cubrir los gastos básicos se guarda para poder dar servicio a más usuarios. Si vas a hacer una donación considerable (¡gracias!), por favor, plantéate enviarlo a través de un cheque o una transferencia ya que los sistemas de pago online se llevarían en torno al 3%. Desafortunadamente, no tenemos capacidad para enviarte una carta de agradecimiento cuando recibimos tu donación. Tienes que saber que te estamos increíblemente agradecidos: tu ayuda es nuestra alma y hace posible todo este duro trabajo. ¡Te adoramos por poner tu dinero en el mismo bando de tus ideales! Nota: Estamos legalmente obligados a proporcionar la identidad de aquellas personas que donen más de 5.000 USD. var regular_id = "BPFRUBU4TVYYS" var micro_id = "94WVNL67BW6VN" function updatePaypal(form, field) { if (field.value < 11.90476) { form.business.value = micro_id } else { form.business.value = regular_id } }'
