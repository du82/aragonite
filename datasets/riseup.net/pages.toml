["https://riseup.net/en/lists/list-admin/faq"]
title = "List Admin FAQ - riseup.net"
full_description = "If you have filled out the password reminder form and you are still unable to login using the correct password and email address, the most likely culprit is your browser. Make sure that cookies are enabled for the domain lists.riseup.net. If unsure, try using a different browser or a different computer. Q: By default, every message sent to my list gets the name of the list added to the subject line (enclosed in square brackets). How do I change this? A: Edit the list config and under “Sending/receiving” you can change the “Subject tagging” setting. If you leave the value blank, there will be no custom text in the subject line of messages. Note that this setting is very different from subject, which is the short summary of what the list is for which is printed in the list directory and on the list information page. A: By default, the footer is sent out as an attachment. The advantage of this is that it is not included in replies. Unfortunately, this means that some people don’t see it. To change the type, go to the list’s admin page and there under “Edit List Config” → “Sending/reception” you can change the “Attachment type” option from “mime” to “append”. The list won’t actually be deleted immediately, but it will no longer be viewable and the whole list will be deleted after some time. Unfortunately, there is no way to block certain email addresses. If you are running an open discussion, you can unsubscribe the person and ask them to not re-subscribe. If that fails, you can always set the “subscribe” variable to “anyone, authorization is asked to owners (owner)”. This way, every time someone tries to subscribe, you (the owner) must approve it. This will only work if the send option is set to private. The maximum email size is restricted to 500k. If you need, we might be able to raise the limit, although probably not. There are many reasons to limit the size of list email: The default “reply to” header on all lists is set to the sender, and not the list. This is for many reasons:"
