["https://riseup.net/ru/email"]
title = "Email - riseup.net"
full_description = "Добро пожаловать, на этой странице вы найдете всю необходимую вам информацию о почтовом сервисе riseup.net. Если вы не смогли найти какую-либо информацию, задайте этот вопрос нам. Как только вы получите ответ на вопрос, вы можете помочь нам поддерживать эту страницу в актуальном состоянии, добавляя недостающую информацию. Посетите account.riseup.net. Там вы сможете изменить свой пароль, добавить почтовые псевдонимы, настроить фильтры, изменить квоту и запросить помощь. Мы автоматически уничтожаем всю информацию о вас, которую вы оставляли при запросе на регистрацию вашего аккаунта. Решение об удалении остальной информации о вас, такой как ваше имя, дата рождения, секретный вопрос и дополнительный почтовый адрес – полностью ложится на вас. Однако, вы должны помнить, что если вы забудете или потеряете пароль от своего аккаунта, а дополнительный почтовый ящик не указан, или недоступен, то вы потеряете доступ к своему аккаунту. Интернет переполнен людьми которые хотят украсть ваш почтовый аккаунт. Когда-нибудь, вы, вероятно, получите мошенническое письмо от кого-то, кто выдаст себя за сервис riseup.net. Зачастую, в этих письмах говорится о том, что вам необходимо выполнить ряд дейстиий, чтобы не потерять доступ к своему аккаунту."
