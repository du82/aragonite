["https://riseup.net/en/lists/list-admin/configuration/list-definition"]
title = "List Definition - riseup.net"
description = "There are many options you have for configuring different aspects of your list. Please see below for help on the different ones available."
full_description = "There are many options you have for configuring different aspects of your list. Please see below for help on the different ones available. In order to change any of the list configuration options, you must be a list owner. List owners can also be subscribers or editors of the list, but but this is not automatic: if you are the list owner and you want to also be an editor, you must add your email as an editor as well, if you want to receive the messages from the list, you must subscribe. A moderator, or list editor, is able approve or reject posts to a list. Only if the list has a send option set to moderated will posts be held for review by the moderators. You can have as many moderators as you want. Moderators can also be subscribers or owners of the list, but this is not automatic: if you are a moderator and you also want to receive messages from the list, you must subscribe. Some configuration options will give editors other privileges as well, such as the ability to edit the list of subscribers or to edit the shared web space. Every list has a short description associated with it. The short description is used in the directory of lists. Confusingly, the variable for this is called subject. One the front page of lists.riseup.net is a directory of lists grouped by topic. If you want your list to be in the directory, you must associate one or more topics with your list."
year_published = 2025
clearnet = "https://riseup.net/en/lists/list-admin/configuration/list-definition"
