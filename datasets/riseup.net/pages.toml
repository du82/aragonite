title = "Donare - riseup.net"
full_description = "Riseup lavora instancabilmente nel creare tecnologie alternative di base che indirizzino le necessità relative alle comunicazioni delle persone e delle organizzazioni che lavorano per il cambiamento sociale. Quando usi un servizio da un'azienda che non ti fa pagare nulla, è probabile che i soldi provengano dalla sorveglianza e dalla vendita dei tuoi dati. Riseup, d'altra parte, fa affidamento sulle donazioni degli utenti come te che credono nel supporto delle alternative democratiche. Per ulteriori informazioni su Riseup, puoi incontrare i nostri membri e dare un'occhiata ai nostri progetti. Riseup è una organizzazione no-profit sottoposta alla sezione 501(c)(4) dell'US Internal Revenue Code. Le donazioni fatte a Riseup non sono deducibili. Se vuoi fare una donazione deducibile dalle tasse (negli Stati Uniti), puoi contribuire alla nostra organizzazione sorella, Riseup Labs Se hai una mailing list grande con più di cento iscritti o che generi molto traffico e molti archivi, aumenta l'importo della donazione suggerita di diverse volte. Per favore, se te lo puoi permettere, prendi in considerazione di donare di più. I soldi avanzati dopo aver coperto le nostre spese di base, vengono reinvestiti nel fornire servizi a più utenti. Se stai facendo una grande donazione (grazie!), per favore considera la possibilità di inviarci un assegno o un vaglia tramite posta–i sistemi di pagamento online trattengono circa di 3% di commissioni. Tutte le decisioni finanziarie del Collettivo Riseup sono prese dai membri del collettivo usando il metodo del consenso. Purtroppo, non abbiamo la manodopera per inviarti una lettera di ringraziamento quando riceviamo la tua donazione. Per favore, sappi che ti siamo incredibilmente grati: il tuo supporto è la nostra linfa vitale e rende tutto il nostro duro lavoro possibile. Noi ti vogliamo bene per il fatto che metti i tuoi soldi lì dove sono i tuoi valori! Eccezione: Siamo obbligati per legge a rendicontare annualmente l'identità di ogni donatore che ci da più di 5.000 USD."
