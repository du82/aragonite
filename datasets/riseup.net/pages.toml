["https://riseup.net/en/email/clients"]
title = "Email Clients - riseup.net"
full_description = "These days, most people are more familiar with web-based mail, where you check your mail using a web browser such as Firefox or Chrome. A mail client, on the other hand, is a specialized application designed specifically for checking and composing email. There are several free and/or Free Software mail clients available for most platforms. Although some mail clients are able to automatically configure themselves, most require some basic information in order to connect to your Riseup email account. The secure connection may be of type TLS or STARTTLS. For security reasons, we no longer support SSL. Note: Don’t enable secure passwords or secure authentication. These are somewhat of a misnomer. These methods of specifying passwords require that the email server keep a cleartext copy of your password. We would consider this a security risk, so we don’t enable “secure passwords.” Because the connection to riseup.net is encrypted anyway, these are not needed. Tor Note: SMTP port 465 is often blocked by exit nodes, but port 587 is less frequently blocked. If you have a problem sending mail, try 587 or configure your client to use Riseup’s email hidden service in place of the regular mail.riseup.net domain. This is better than sending traffic through a Tor exit as it is MITM resistant, but it will generate certificate errors on the client side. Thunderbird is the mail client recommend for use with riseup.net. Sadly, The Mozilla Foundation has essentially abandoned Thunderbird, but it is still the best option for a free software cross-platform mail client. Thunderbird will automatically configure itself to use your riseup.net email account. See our Thunderbird tutorials for more details. Yes, you can switch back and forth easily. Often, people will use a mail client when at home or at work, and use the web-based email when traveling. If you do use both options, you should be familiar with the difference between IMAP and POP."
year_published = 2025
