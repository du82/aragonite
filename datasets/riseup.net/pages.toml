["https://riseup.net/hi/about-us"]
title = "हमारे बारे में - riseup.net"
full_description = "क्या आप अपने संवेदनशील ईमेल संचार की गोपनीयता के लिए किसी कॉर्पोरेट ईमेल प्रदाता पर भरोसा कर सकते हैं? वे न केवल आम तौर पर स्कैन और उद्देश्यों की एक विस्तृत विविधता के लिए अपने संदेश की सामग्री को रिकॉर्ड करते हैं, साथ ही डिजिटल स्वतंत्रता को सीमित और उनके उपयोगकर्ता की गोपनीयता के बारे में सख्त नीतियों है विफल करने के लिए है कि सरकारों की मांगों को मानते हैं. उनकी स्पष्ट रूप से व्यावसायिक हितों के साथ अंतर पर वाणिज्यिक ईमेल सुविधाओ का हमसे उल्लेख नही करते। The U.S. government practices “full pipe monitoring” and association mapping, which gives them the ability to build a detailed map of how our social movements are organized, worse this gives them precise information about what linkages should be disrupted in order to disrupt large social movements. We believe it is vital that essential communication infrastructure be controlled by movement organizations and not corporations or the government. We strive to keep our mail as secure and private as we can. We do not log your IP address. (Most services keep detailed records of every machine which connects to the servers. We keep only information which cannot be used to uniquely identify your machine). All your data, including your mail, is stored by riseup.net in encrypted form. We work hard to keep our servers secure and well defended against any malicious attack. We do not share any of our user data with anyone. We will actively fight any attempt to subpoena or otherwise acquire any user information or logs. We will not read, search, or process any of your incoming or outgoing mail other than by automatic means to protect you from viruses and spam or when directed to do so by you when troubleshooting."
