["https://riseup.net/ru/security"]
title = "Безопасность - riseup.net"
full_description = "Постоянный цейтнот? Слишком занят борьбой с угнетением или строишь лучшую версию мира? Супер! Вот несколько простых шагов, с помощью которых любой человек сможет сделать свой цифровой мир менее уязвимым Возрастающая важность информации и коммуникации принесла с собой другой феномен: восход общества надзора. Вы можете считать слежку попыткой свласть имущих сохранить своё доминирующее положение, утвердив контроль над коммуникациями. Государства ответили на новые технологии коммуникации развитием инфраструктуры, которая может быть легко перепрофилирована для тоталького контроля над обществом. В отличие от ранней эры коммуникаций, природа существующий технологии требует, чтоб наша информация была либо в безопасности, что обижает правительства, либо абсолютно незащищёной, что делает возможным широкомасштабный и детальный мониторинг всего населения. Корпорации открыли, что сбор и анализ большого количества персональных данных необходим, если они хотят оставаться конкурентоспособными в мире, насыщенном информацией. В частности, практически вся реклама ориентирована на отслеживание вашего персонального поведения. В данном контексте, безопасность коммуникации стала жизненно необходимой."
