["https://riseup.net/en/security/device-security/software-safety"]
title = "Software Safety - riseup.net"
description = "Best practices for installing and updating software"
full_description = "Nearly every time an attacker is able to compromise a computer through a software vulnerability the attack could have been prevented if the software was up to date. This is because almost all vulnerabilities are known to the software developers and have already been fixed by the time attackers learn to take advantage of the flaws. It is especially important to keep your operating system up to date, since the operating system has privileged access to everything that happens on your device. When possible, it is best to install software from the official application store for your operating system, for several reasons: Note: You need to use caution with the official Android application store, Google Play, as there are often copycat applications designed to impersonate the real application. The proliferation of mobile apps, browser extensions and other free (as in zero-cost, not open source) programs has caused numerous security problems. Avoid software that hasn’t been created by a company you already have a trust relationship with (i.e., any company whose tools you are already using at your organization). Software that appears to have good intentions (like antivirus scanning) or beneficial features may be masking malicious activities in the background. In most browsers and mobile devices, an application will ask for certain permissions at installation–the information and hardware it can access on your device. These are worth looking at to make sure they at least vaguely reflect what is expected. For example, if a flashlight app asks for permissions to your contacts or to make phone calls, you probably don’t want to install it. Permissions to be especially cautious around granting include access to your calls, contacts, camera, microphone, location services, or entire storage. The way to look at permissions after installation depends on the context. In Chrome, go to chrome://extensions/ and click the permissions link for each one. On iOS devices, under Settings is a list of all permissions; under each permission is the list of apps that use it. On Android devices, go to Settings > Application Manager to view a list of apps; under each app is the list of permissions it uses."
year_published = 2025
clearnet = "https://riseup.net/en/security/device-security/software-safety"
tags = ["advanced", "apple", "application", "attacks", "authenticity", "automatic", "automatically", "best", "careful", "check"]
