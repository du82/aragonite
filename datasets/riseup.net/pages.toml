["https://riseup.net/es/about-us"]
title = "Acerca de nosotros - riseup.net"
full_description = "¿Puedes confiar en un proveedor de correo electrónico empresarial para que tus comunicaciones de correo electrónico sean confidenciales? No sólo normalmente escanean y graban el contenido de tus mensajes para una amplia variedad de propósitos, sino que también ceden a las exigencias de los gobiernos para que restrinjan la libertad digital y dejen de tener políticas estrictas con respecto a la privacidad de sus usuarias y usuarios. Por no hablar del obvio interés mercantil que ponen los proveedores de correo electrónico comerciales al contrario de lo que hace nuestro colectivo. El gobierno de los EE.UU. practica el “monitoreo masivo” y el rastreo de asociaciones, lo que les da la capacidad de construir un mapa detallado de cómo se organizan nuestros movimientos sociales, peor aún, esto les da información precisa sobre qué vínculos deben romper con el fin de perturbar los grandes movimientos sociales. Creemos que es de vital importancia que la infraestructura de comunicación esencial sea controlada por las organizaciones sociales y no por empresas o gobiernos. Nos esforzamos por mantener nuestro correo tan seguro y privado como podemos. No guardaremos tu dirección IP. (La mayoría de los servicios llevan registros detallados de cada máquina que se conecta a sus servidores). Guardamos únicamente información que no se pueda utilizar para identificar tu equipo. Todos tus datos, incluyendo correo, es almacenada por riseup.net de forma cifrada. Trabajamos duro para mantener nuestros servidores seguros y bien defendidos contra cualquier ataque malicioso. No compartimos ninguno de los datos de nuestras usuarias y usuarios con nadie. Vamos a combatir activamente contra cualquier requerimiento o intento de adquirir información o registros de nuestra infraestructura. No vamos a leer, buscar, procesar o cualquiera de tus correos entrantes o salientes aparte de lo que se lleve a cabo por medios automáticos para protegerte de virus o spam, o cuando nos lo pidas para solucionar algún problema."
