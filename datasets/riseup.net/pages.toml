["https://riseup.net/de/vpn"]
title = "VPN - riseup.net"
full_description = "Riseup testet einen neuen eigenen Client namens RiseupVPN. Unser VPN-Client benötigt keinerlei Einrichtung oder Accounts, und ist daher super einfach zu benutzen. Diese Beta ist ein Versuch von uns, ob wir einen VPN-Service stellen können, der einfach genug für jeden ist, und für den auch genügend Leute spenden um diesen zu erhalten. Teste bitte auch unseren Client und gib uns Feedback. Und erzähl auch deinen Freunden von diesem VPN-Client! Auf Linux, Mac und Windows wird RiseupVPN ein Symbol in der Taskleiste oder Statusbar erstellen, das den Status des Clients anzeigt. Um das VPN an- oder auszuschalten, klick einfach auf das Symbol und wähl die entsprechende Einstellung. RiseupVPN ist ein komplett durch Spenden von Nutzern finanzierter Service. Wenn du einen benutzerfreundliche und gewinnorientierten VPN-Service wertschätzt, der nichts von seinen Benutzern trackt, hilf bitte durch deine Spende, diesen zu erhalten. Unsere Kosten für RiseupVPN liegen jährlich bei ungefähr $60 USD (54€) pro Person. Wenn du unseren VPN-Client benutzt, spende bitte mindestens diesen Betrag. Achtung: Wenn du über eine andere Seite spendest, werden wir nicht wissen, dass du für das VPN spendest. Um eine Übersicht zu haben, ob sich dieser Service finanzieren kann, spende bitte nur über diese Seite. Um eine Support-Anfrage für RiseupVPN auszufüllen, besuche bitte support.riseup.net. Wenn du einen Bug gefunden hast, schick uns bitte einen Bug report anstelle einer Support-Anfrage. (siehe unten)."
