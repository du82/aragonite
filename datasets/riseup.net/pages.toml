["https://riseup.net/en/email/settings/quota"]
title = "Quota - riseup.net"
full_description = "We would like to, but it is expensive. Hard drives are super cheap, but the computers that house these drives and the rent on the space to house the computers is expensive. It would be very time consuming for the server to calculate an exact quota usage. Instead, the quota number is a guess. Often, it is a very accurate guess. However, sometimes the guess can be wildly off. You will never go over quota (and start bouncing message) unless you actually have used up all your storage space. Another thing the mail server does to save time is to only update the quota “guess” when you receive a new message. This means that if you delete a message, your quota will not appear to change until the next time you receive an email. All messages in your folders count towards your quota, including messages in the special folders Trash, Sent and Spam. We really encourage you to download your e-mail, but we know that in some cases that’s not an option as when multiple people have access to a single mail account. If your group or collective project have really the needs for more e-mail storage, please open a support a ticket at support.riseup.net after you reach at least 60% of your quota so we can discuss options."
