["https://riseup.net/zh/email"]
title = "Email - riseup.net"
full_description = "欢迎进入riseup.net邮件帮助。 在这里你可以找到关于riseup.net *邮件账户*的信息。 如果你没有找到你要找的填写求助单。一旦你的问题被解答了，请帮助我们保持这些页面提交的任何修改或补充，以便与其他用户分享。 如果你忘记了你的密码，唯一的方法就是使用恢复密码来重新获得你的账户。这是没有办法的，如果你丢失了恢复密码，Riseup无法帮助你。所以，你绝对要把这个密码保存在安全的地方。 如果你还没有这样做，请现在就把你的恢复密码放在安全的地方。如果你在创建账户时没有写下它，请访问你的账户设置创建一个新的账户，然后写下它。 每次只有一个恢复代码。当你创建一个新的恢复代码，它将取代旧的恢复代码。 请访问 account.riseup.net ，更改你的密码，更换你的恢复代码，添加电子邮件别名，设置电子邮件过滤器，更改你的配额，销毁你的数据，设置特定服务的密码，并请求帮助。 互联网上到处都是试图窃取你的电子邮件帐户的人。在某些时候，你可能会收到一封来自假装是Riseup的人的欺诈性电子邮件。这些邮件会声称你必须执行一些行动以保持你的账户。 由于各种原因，我们只能为电子邮件提供1GB的存储空间。如果你需要更多的空间，请考虑使用邮件客户端下载你的电子邮件。如果你的账户目前没有使用加密存储，我们鼓励你为你的账户启用加密存储（但一定要保存恢复代码！）。阅读更多关于配额的事项。 作为一种选择，我们建议你下载并安装一个专门的电子邮件客户端应用程序。请查看我们的 许多流行的电子邮件客户端的教程。 Riseup 建议使用 Thunderbird，一个免费开源的邮件客户端。你只需提供邮箱地址和密码，thunderbird将会自动正确配置。 你的Riseup电子邮件账户是个很好的东西! 虽然我们没有提供像监控资助的企业电子邮件供应商那样多的存储配额，但Riseup电子邮件有很多不寻常的功能："
