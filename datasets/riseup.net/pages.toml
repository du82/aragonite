["https://riseup.net/hi/lists/list-user/subscribing"]
title = "Subscribing - riseup.net"
full_description = "If this doesn’t work, then almost certainly the problem is that you sent the ‘unsubscribe’ email from an different address then the address which is subscribed to the list. This can happen if you have multiple email addresses (or aliases) for a single mail box. If possible, make sure the from address on your unsubscribe email matches the address you are subscribed with. If this is not possible, follow these steps: If you are unable to send the confirmation email from the same address as you are subscribing with, you must use a different method. Follow these steps instead: In ‘digest’ mode, you receive multiple posts to the list in one email instead of separate emails. The list admin determines if you are able to subscribe in digest mode and over what period the digest covers. If you do not actually receive digests, it may be that the list administrator still needs to set the digest settings for the list. Have them make sure that the hour option is greater than 1 and no more than 22 (10pm). This option determines when the digest is sent. If it is too close to midnight, the digests won’t work (a bug in the mailing list software). You can contact the list admin by sending mail to listname-admin@lists.riseup.net. Sometimes, you may want to be a member of a list, but not receive postings from the list. This could happen if you have multiple email addresses or perhaps you read the emails on the online archive. You can change your subscription status to “no-mail” by doing the following:"
