["https://riseup.net/de/privacy-policy"]
title = "Datenschutzrichtlinie - riseup.net"
full_description = "Dieses Dokument beschreibt, welche Informationen wir sammeln und wofür. Es gilt für Interaktionen mit riseup.net, außer unsere neuen “black”-Dienste, für welche eine andere Datenschutzrichtlinie gilt. Durch die Benutzung der Dienste von riseup.net stimmst du unserer Datenschutzrichtlinie zu. Bitte lies auch unsere Nutzungsbedingungen. Du kannst aus guten Gründen den Respekt deiner Privatssphäre erwarten hinsichtlich jeglicher Kommunikation und allen transferierten und auf unseren Systemen gespeicherten Daten. Wir sammeln sehr wenige persönliche Informationen und keine der Informationen, die wir sammeln, wird jemals geteilt. Bei der Erstellung von Konten speichern wir das Quartal der Registrierung. Informationen über Kontoanfragen werden nach vier Monaten gelöscht und der Einladungsstatus nach einem Monat. Wenn sie nicht von dir entfernt wird, speichern wir eine von dir vergebene alternative E-Mailadresse. Du kannst diese entfernen, aber dann lässt sich der Zugriff auf dein Konto nicht wiederherstellen, wenn du dein Passwort verlierst. Der Inhalt jedes Hilfe-Tickets, das du erstellst oder kommentierst, während du angemeldet bist, wird mit deinem Konto verknüpft. Du kannst ein Hilfe-Ticket anonym ausfüllen, wenn du nicht angemeldet bist. Wir löschen regelmäßig alte Tickets, die geschlossen wurden. Während einer Sitzung speichern wir temporäre Sitzungsidentifikatoren auf unserem Computer, die von unserer Software benutzt wird, um den Status der Authentifzierung zu prüfen. Dieser wird sofort gelöscht, wenn du dich ausloggst, oder die Sitzung ausläuft. Wir benutzen keinerlei Cookies von Drittanbietern oder irgendeine Art von Tracking. Um zu erkennen, ob unsere Server mittels “Spambomben” angegriffen werden, oder wenn ein Spammer unsere Systeme benutzt, speichern wir die “Von”- und “An”-Kopfzeile jeder weitergeleiteten Nachricht. Diese Logs werden täglich gelöscht. Wir speichern Monat und Jahr der letzten erfolgreichen Anmeldung (um ungenutzte Konten zu deaktivieren und zu löschen). Wir speichern weder Tag oder Zeit der letzten Anmeldung."
year_published = 2025
