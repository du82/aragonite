["https://riseup.net/it/about-us"]
title = "Chi siamo - riseup.net"
full_description = "Puoi fare affidamento su un provider di posta elettronica commerciale per quanto riguarda la riservatezza delle tue comunicazioni email? I provider commerciali non solo esaminano e registrano il contenuto dei tuoi messaggi per una vasta quantità di scopi, ma non hanno politiche rigorose riguardo la privacy dei loro utenti e cedono alle richieste dei governi che limitano le libertà digitali. Per non parlare dei loro ovvi interessi commerciali nel mettere i provider di posta elettronica commerciali in contrasto con quanto stiamo facendo. Le pratiche di monitoraggio “full-pipe” e di mappatura delle associazioni effettuate dal governo degli Stati Uniti, permettono a quest'ultimo di costruire una mappa dettagliata di come sono organizzati i movimenti e gli fornisce informazioni precise su quali sono i collegamenti che devono essere interrotti per distruggere grandi movimenti sociali. Riteniamo vitale che le infrastrutture di comunicazione di base siano controllate dalle organizzazioni di movimento e non dalle aziende o dai governi. Ci battiamo per mantenere la nostra posta il più sicura e privata possibile. Non teniamo traccia del tuo indirizzo IP. (Molti servizi mantengono registrazioni dettagliate su ogni macchina che si connette con i server. Noi teniamo solo informazioni che non possono essere usate per identificare in maniera univoca la tua macchina). Tutti i tuoi dati, inclusa la tua posta, viene memorizzata da riseup.net in forma crittografata. Noi lavoriamo al meglio per mantenere i nostri server sicuri e ben difesi da qualsiasi attacco. Non condividiamo i tuoi dati con nessuno. Combattiamo attivamente ogni tentativo di citazione in giudizio e di acquisizione di informazioni degli utenti e dei log. Non leggiamo, ricerchiamo o esaminiamo nessuno dei tuoi messaggi di posta in entrata o in uscita, se non con degli strumenti automatici necessari per proteggerti da virus e posta indesiderata o quando ce lo richiedi esplicitamente per risolvere qualche problema."
