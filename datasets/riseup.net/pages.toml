full_description = "Se não encontrar o que está procurando, preencha um tíquete de ajuda. Quando sua pergunta for respondida, por favor, ajude-nos a manter este guia atualizado e edite a página pertinente para incluir as informações que você achar importantes e quiser compartilhar. Se você esquecer sua senha, a única forma de recuperar sua conta é com um código de recuperação. Não há jeitinho possível, o Riseup não poderá ajudar se você perder seu código de recuperação. É fundamental que você o guarde em local seguro. Se ainda não o fez, guarde seu código de recuperação em local seguro agora mesmo. Se não o anotou quando criou sua conta, acesse suas configurações de conta para criar um novo, então anote-o. Acesse account.riseup.net. Lá você pode alterar sua senha, substituir seu código de recuperação, configurar o redirecionamento de e-mails, ajustar filtros, redefinir sua cota, apagar seus dados permanentemente, configurar senhas específicas para serviços distintos e pedir ajuda. Na internet não falta gente interessada em roubar seu e-mail. Em algum momento, é provável que você receba um e-mail falso de alguém que afirme ser do Riseup. Mensagens desse tipo normalmente cobram de você alguma ação para impedir que sua conta seja excluída. Em algumas pastas especiais, as mensagens são apagadas automaticamente após um certo número de dias: Por várias razões, nós não oferecemos muito espaço de armazenamento para e-mail. Se você precisa de mais espaço, baixe suas mensagens usando um cliente de e-mail ou aumente sua cota em account.riseup.net. Leia mais sobre cota. Outra opção é baixar e instalar um cliente de e-mail dedicado. Confira nossos tutoriais sobre vários clientes populares. A recomendação do Riseup é que você use o Thunderbird, um cliente gratuito e de código aberto. O programa se configurará corretamente, bastando apenas que você informe seu endereço de e-mail Riseup e senha. Sua conta de e-mail Riseup é incrível! Embora não ofereça tanto espaço de armazenamento