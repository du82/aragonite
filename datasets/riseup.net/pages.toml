["https://riseup.net/el/%CF%83%CF%85%CE%BD%CE%B5%CE%B9%CF%83%CF%86%CE%AD%CF%81%CE%B5%CF%84%CE%B5"]
title = "Συνεισφέρετε - riseup.net"
full_description = "Η Riseup εργάζεται ακούραστα για να δημιουργήσει εναλλακτικές τεχνολογίες βάση που διευθετούν τις ανάγκες για επικοινωνία των ανθρώπων και των οργανώσεων που παλεύουν για την κοινωνική αλλαγή. Όταν παίρνεται μια υπηρεσία από μια εταιρεία που δεν σας χρεώνει, υπάρχουν σοβαρές πιθανότητες το κέρδος της να προέρχεται από εκτεταμένη παρακολούηθηση των χρηστών. Η Riseup από την άλλη, βασίζεται σε δωρεές από χρήστες σαν εσάς οι οποίοι πιστεύουν στη στήριξη των δημοκρατικών εναλλακτικών. Για περισσότερες πληροφορίες σχετικά με την Riseup, μπορείτε να γνωρίσετε τα μέλη μας και να δείτε τα [project μας -> projects]. Η Riseup είναι καταχωρημένη ως μη κερδοσκοπική σύμφωνα με την ενότητα 501(c)(4) του κώδικα περί εισοδήματος στις ΗΠΑ. Οι δωρεές στο riseup.net δεν εκπίπτουν από τη φορολογία. Αν θέλετε να κάνετε μια μη-φορολογήσιμη δωρεά (ΗΠΑ), μπορείτε να συνεισφέρετε στην αδερφή οργάνωσή μας, Riseup Labs. Αν είστε προγραμματιστής, μπορείτε να στηρίξετε τη Riseup γράφοντας κώδικα. Αν έχετε μια μεγάλη λίστα με πάνω από 100 εγγεγραμμένους ή με υψηλή κίνηση και μεγάλο αρχείο, αυξήστε το προτεινόμενο ποσό δωρεάς μερικές φορές. Παρακολούμε σκεφτείτε να συνειφέρετε περισσότερ αν μπορείτε. Τα χρήματα που απομένουν αφότου έχουμε καλύψει τα βασικά μας έξοδα, ρίχνονται στο να προσφέρουμε υπηρεσίες σε περισσότερους χρήστες. Αν κάνετε μια μεγάλη δωρεά (σας ευχαριστούμε!), τότε σκεφτείτε να στείλετε ένα τσεκ ή χρήματα μέσω ταχυδρομείου – οι online τρόποι πληρωμής έχουν μια κράτηση της τάξης του 3%."
