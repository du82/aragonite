title = "Mail Passwords - riseup.net"
full_description = "You should change your password regularly. Pick a password that contains letters, numbers and symbols. A password should consist of more than just words from the dictionary. And do not use a password you use for anything else! Because passwords are almost always the weakest link in any security system where they are used, the first step to better security is better password practice. How do you create a password that is strong and yet easy to remember? This can be really tough. There are three generally approved methods: Don’t try to remember passwords. Instead, generate random passwords for all the different services and websites you use, and store them in a secure password locker. You could turn “The Revolution Will Not Be Televised” into “trwNbt” and then add a few random characters for “trwNbt!42”. To reset your account, you must have an active alternate email set and can use the lost password form. If your password works on mail.riseup.net but not with your mail client, you should check to see if you are using any special characters in your password. Some mail clients do not recognize special characters and will not work. You can change your password at account.riseup.net"
