["https://riseup.net/fr/vpn"]
title = "VPN - riseup.net"
full_description = "Riseup est actuellement en train de tester un nouveau client nommé RiseupVPN. Ce client VPN est très facile à utiliser! Il suffit de l'installer et de le faire rouler — aucune configuration n'est requise. Pas besoin d'enregister un compte non plus! Ce test est une expérience. Nous souhaitons savoir si nous pouvons créer un service de VPN qui est assez facile pour que tout le monde puisse l'utiliser et qui reçoit assez de dons pour rester à flot. Sur Mac, Windows et Linux, RiseupVPN crée une icône dans la barre de tâches qui indique si le VPN est connecté ou non: Pour allumer ou éteindre le VPN, il suffit de cliquer sur l'icône dans la barre de tâches et sélectionner l'item souhaité dans le menu qui s'affiche. Le service RiseupVPN est entièrement financé par les dons des utilisatrices et des utilisateurs. Si vous appréciez ce service de VPN facile d'utilisation, à but non lucratif et qui n'espionne personne, merci de faire un don pour garder RiseupVPN en vie. Notre coût pour offrir RiseupVPN est d'environ 60$ USD par personne par année. Si vous utilisez le VPN, nous vous demandons de considérer un don au moins aussi grand. Merci! Veuillez noter: si vous faites un don à partir d'une page différente, nous ne pourrons pas savoir que c'est un don pour le VPN. Aidez-nous à savoir si ce service peut être maintenu en vie en donnant pour le VPN exclusivement sur cette page. Liberpay est une organisation à but non lucratif qui permet de faire des dons récurrents. Leurs services utilisent des logiciels libres. Pour créer un ticket d'aide pour RiseupVPN, veuillez visitez support.riseup.net. Si vous avez plutôt trouvé un bug, veuillez remplir un rapport de bug plutôt qu'ouvrir un ticket d'aide (voir plus bas). Vous pouvez rejoindre la liste courriel de développement de RiseupVPN et bitmask. Vous pouvez y poser des questions et rejoindre les discutions de la communauté sur le développement de notre cher client VPN. Il existe également un canal irc pour avoir des conversations plus instantanées: #leap @ irc.libera.chat"
