title = "Radikale Server - riseup.net"
full_description = "Anti-kapitalistische, anti-hierarchische, autonome, feministischem oder radikale Serverprojekte, revolutionäre Kollektive, die Dienste frei oder auf Basis gegenseitiger Hilfe für radikale und Graswurzel-Bewegungen anbieten. Hackerspaces are community-operated physical places, where people can meet and work on their projects. This website is for Anyone and Everyone who wants to share their hackerspace stories and questions with the global hackerspaces community. HackThisSite.org is a free, safe and legal training ground for hackers to test and expand their ethical hacking skills with challenges, CTFs, and more. Active since 2003, we are more than just another hacker wargames site. We are a living, breathing community devoted to learning and sharing ethical hacking knowledge, technical hobbies, programming expertise, with many active projects in development. Join our IRC, Discord, and our forums where users can discuss hacking, network security, and more. Tune in to the hacker underground and get involved with the project! Tachanka basiert auf der Idee, technische Dienste für emanzipatorische Projekte und Gruppen für sozialen Wandel bereitzustellen. Hinter dieser Ideen stehen diese Gruppen und es gibt mehrere überlappende Kollektive, die dabei helfen, Projkete aufrecht zu erhalten, aber Tachanka hat mehrere gemeinsame Prinzipien, auf der das Unterstützungsnetzwerk mit gemeinsamen Zielen basiert. Die Kollektive sind international und haben das Ziel, die globale Solidarität zu stärken. Die wichtigsten Prinzipien von Tachanka sind dabei die Positionen von People’s Global Action und der Debian-Gesellschaftsvertrag. Take Back The Tech! ist eine weltweise Kampagne, das Thema Gewalt gegen Frauen und Informations und Kommunikationstechnologie (ICT). Es geht darum, die Bewusstheit zu stärken über die Arten der Gewalt gegenüber Frauen auf ICT-Plattformen wie das Internet und Mobiltelefonen und alle Menschen aufzurufen, ICT für Aktivismus, um Gewalt gegen Frauen zu beenden. Die Kampagne wurde initiert durch Association for Progressive Communications (apc.org), Women’s Networking Support Programme, 2006. Seitdem wurde sie von Individuen, Kollektiven und NGOs in mindestens 24 Ländern aufegriffen und verstärkt. Mehr auf Wikipedia (englisch)"
