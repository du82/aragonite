["https://riseup.net/en/email"]
title = "Email - riseup.net"
full_description = "If you don’t find what you are looking for fill out a help ticket. Once your question has been answered, please help us keep these pages updated by submitting any changes or additions you would like to share with other users. If you forget your password, the only way to regain access to your account is with a recovery code. There is no way around this, Riseup cannot help you if you lose your recovery code. You absolutely must save this code somewhere safe. If you haven’t already, please put your recovery code somewhere safe now. If you did not write it down when you created your account, visit your account settings to create a new one, and then write it down. Visit account.riseup.net to change your password, replace your recovery code, add email aliases, set up email filters, change your quota, destroy your data, setup service-specific passwords, and request help. The Internet is crawling with people trying to steal your email account. At some point, you will probably receive a fraudulent email from someone pretending to be Riseup. These emails will claim that you must perform some action in order to keep your account. For different reasons we can only provide 1 GB of storage space for e-mail. If you need more space, consider downloading your email using a mail client. We encourage you to enable the encrypted storage for your account if your account is not currently using it (but be sure to save the recovery code!). Read more about Quota. As an alternative, we recommend you download and install a dedicate email client application. Check out our tutorials for many popular email clients. Riseup recommends Thunderbird, a free and open source mail client. Thunderbird will automatically configure itself correctly if you just give it your Riseup email address and password. Your Riseup email account is a wonderful thing! Although we don’t provide as much storage quota as surveillance-funded corporate email providers, Riseup email has many unusual features: Full disk encryption Our physical servers are protected in ways that do not allow anyone other than Riseup to access them. They are not hosted “in the cloud”. As an additional measure, all of our servers use full disk encryption that can only be unlocked by Riseup. Additionally, all communications between our servers is also always encrypted. These measures protect against unauthorized physical access, theft and attempts to investigate the data on the storage medium."
year_published = 2025
