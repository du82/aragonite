["https://riseup.net/en/lists/list-user/accounts"]
title = "Accounts - riseup.net"
full_description = "To create a list account all you have to do is subscribe to a list. To subscribe, send mail to listname-subscribe@lists.riseup.net, where listname is the name of the list you want to subscribe to. When you create an account, Sympa (the mail list software we use) creates a random password and mails it to your email address. This prevents others from subscribing you without your permission and verifies that your address is real. You should change the random password as soon as possible to a password which you can remember. Note that the accounts for lists at lists.riseup.net are completely different from email accounts at riseup.net. Login using your full email address and password, then click the Preferences link near the top of the page. There you will find a form for changing your password. If someone else subscribed you to a list, it is possible that you do not have a password. Fill out the new password form. A temporary password will be sent to the email address you specify, along with directions for changing it. NOTE: You do not want to use this form if you are a list owner or moderator. It will result in you losing ownership of your lists! Roughly, follow these steps instead: Because passwords are almost always the weakest link in any security system where they are used, the first step to better security is better password practice. How do you create a password that is strong and yet easy to remember? This can be really tough. There are three generally approved methods: Don’t try to remember passwords. Instead, generate random passwords for all the different services and websites you use, and store them in a secure password locker. You could turn “The Revolution Will Not Be Televised” into “trwNbt” and then add a few random characters for “trwNbt!42”."
