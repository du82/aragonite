["https://riseup.net/en/lists/list-admin/maintenance/bounces"]
title = "Bounces - riseup.net"
full_description = "A list subscriber is bouncing if we tried to send them email but the message got rejected by their mail server. Typically, this happens if the user is over quota, no longer has an account, or the email address is typed wrong. Once a subscriber is listed as bouncing, they will remain listed as bouncing even after they start receiving mail. After ten days, if they continue to receive mail without error they will be no longer be marked as bouncing. The bounce message can be a little confusing, but somewhere buried in that message should be some text describing exactly why the message was rejected. One thing you cannot rely on is the column which lists if the bounce was ‘permanent’ or ‘temporary’. This value is based on the error code which the user’s mail server returned. Unfortunately, different servers return different codes so you cannot tell much from this information. A vital part of being a list administrator is regular removal of bouncing subscribers. Email addresses which are totally invalid and continue to bounce will remain subscribed to your list until you unsubscribe them. So how do you decide when to remove bouncing addresses? The bounce count is pretty good indication if the address is valid or not. Compare the bounce count with the period over which the subscriber is bouncing. If it seems like they are bouncing most messages, then you should remove them. After ten days of correctly receiving mail, subscribers marked as bouncing will automatically be marked again as having no errors. So really, you don’t need to reset the errors manually. However, it is usually safe to go ahead and reset the errors for subscribers who have only bounced a few times over a long span of time or only bounced once over a short span of time. Hotmail is notoriously buggy. There is a known error with hotmail where list traffic is often rejected incorrectly. It only shows up once in a while, but when it happens every hotmail address on your list will be marked as bouncing. If you see this, you can safely reset their status. You might also repost the message they missed."
year_published = 2025
clearnet = "https://riseup.net/en/lists/list-admin/maintenance/bounces"
