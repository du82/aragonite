full_description = "Riseup 提供的个人 VPN 服务可以帮助您加密互联网流量，以躲避网络审查或隐藏自己的真实位置。此服务先将你的全部流量加密发送至 riseup.net 的服务器, 再通过 riseup.net 的服务器将流量发送至互联网中的目的地。 Riseup 提供简单易用的 VPN 客户端 RiseupVPN。只需下载并点击运行——无需设置，也无需注册账户。 目前，这只是一个测试。我们希望测试我们能否利用人们的捐赠，提供并维护一个简单易用、面向所有人的 VPN 服务。 中国内地特别提示：受中国内地防火墙影响，此 VPN 服务在内地可能无法正常使用。 我们坚信，让每个人都能使用诸如 VPN 或 Tor 的服务来加密他们的互联网流量是至关重要的。这是因为，在政府、互联网提供商（ISP）和一些企业的监管下，互联网已变得透明，您的安全和隐私将受到威胁。RiseupVPN 将帮助您解决这一难题。 使用所有的 VPN 服务都将面临一些限制和风险（例如：当地法律法规、客户端自身的安全性），因此在使用 VPN 服务前，请仔细阅读该须知，并确认您已经理解这些限制和风险。 在 macOS、Windows 和 Linux 操作系统上，RiseupVPN 会在系统托盘（任务栏）中显示一个图标，以表明 VPN 的连接状态： RiseupVPN 服务是完全由用户的捐款资助的。如果你看重一个简单的、非盈利的、不追踪用户的VPN服务，那么请为维持RiseupVPN的生命而捐款。 我们提供 RiseupVPN 的成本支出大约是每人每年 60 美元。如果你使用了 VPN 服务，请考虑至少捐献这些金额。谢谢你！ 注意：如果你使用其他的捐款页面捐款，我们将不知道你是专门为了VPN捐款。为了帮助我们了解VPN项目的可持续性，只使用本页面的链接为此专项捐赠。 对 RiseupVPN 的捐款可以通过信用卡或借记卡（Visa、MasterCard、American Express），或通过欧元银行账户的直接借记（仅用于欧元捐款）。我们使用 Liberapay，这是一个基于免费软件的非营利性订阅捐款和支付服务。"
