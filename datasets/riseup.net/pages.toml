["https://riseup.net/fr/security"]
title = "Sécurité - riseup.net"
full_description = "Peu de temps devant vous? Trop occupé-e pour résister à l’oppression généralisée ou pour tenter de bâtir un monde meilleur? Super! Nous croyons que votre aventure vers une meilleure sécurité informatique devrait commencer ici. Avec ces étapes faciles à réaliser, tout le monde peut réduire la vulnérabilité de leurs systèmes informatiques. L’augmentation de l’importance de l’information et de la communication a apporté avec elle un autre phénomène : l’élévation d’une société de surveillance. Vous pouvez entendre par surveillance une tentative des lobbys pour maintenir leur dominance en insérant un contrôle de la communication. Les États-nations ont répondu à la nouvelle technologie des communications en poursuivant une infrastructure qui peut être facilement redirigée pour un total contrôle du social. Contrairement aux ères de communications précédentes, la nature de la technologie présente requiert que nos informations soient sécurisées de manière frustrante pour les gouvernements, ou bien de façon complètement non-sécurisée qui permette un contrôle étendu et détaillé de populations entières. Les entreprises ont découvert que la collecte et l’analyse d’une quantité massive de données personnelles est nécessaire si elles souhaitent rester dans la compétition d’un monde riche en information. En particulier, la quasi-totalité des publicités bascule sur une démarche de pistage de notre comportement personnel. Le principal du conflit contre la surveillance prend place à travers le système légal et nous applaudissons ceux qui travaillent dans cette arène. En contraste, Riseup se concentre sur la technologie. Dès lors que les lois sont injustes, nous croyons qu’une nouvelle réalité technique est nécessaire de manière à altérer les possibilités légales et politiques. Une fois cela posé, il est important pour les personnes qui font face à la perspective de la répression ciblée d’employer de la sécurité de leur matériel et de leur communications, bien que cela puisse prendre un certain temps à apprendre. Ces pages d’aide vous aideront en cette voie."
year_published = 2025
