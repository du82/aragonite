full_description = 'O Riseup trabalha sem descanso para criar alternativas tecnológicas de base que vão ao encontro das necessidades de comunicação de pessoas e organizações que trabalham por mudanças sociais. Quando você recebe um serviço de uma empresa que não cobra por isso, são grandes as chances do financiamento vir da ampla vigilância das suas atividades. O Riseup, por outro lado, se sustenta por doações de pessoas que, como você, acreditam em apoiar alternativas democráticas. Para mais informações sobre o Riseup, você pode conhecer nossa equipe e dar uma olhada nos nossos projetos. O Riseup é uma entidade sem fins lucrativos registrada na seção 501(c)(4) do Código Tributário dos Estados Unidos (US Internal Revenue Code). As doações para riseup.net são dedutíveis de impostos. Se você deseja fazer uma doação dedutível de impostos (Estados Unidos), contribua para nossa organização irmã, Riseup Labs. Se você tem uma lista grande, com mais de cem membros ou com intenso tráfego de mensagens e muitos arquivos, a quantia doada deve ser maior. Por favor, considere doar mais se puder. Todo recurso que sobra após cobrirmos nossas despesas básicas é revertido para prover serviços para mais pessoas. Se estiver fazendo uma doação grande (agradecemos!), então envie um cheque ou dinheiro pelo correio – sistemas de pagamento on-line cobram uma taxa de até 3%. Todas as decisões financeiras do Coletivo Riseup são tomadas pelos membros do grupo usando o processo de consenso. Infelizmente, não temos força de trabalho suficiente para te enviar uma carta de agradecimento quando recebemos sua doação. Por favor, saiba que nossa gratidão não tem tamanho: seu apoio é vital e faz que todo o nosso trabalho duro seja possível. Adoramos você por investir naquilo em que acredita! var regular_id = "BPFRUBU4TVYYS" var micro_id = "94WVNL67BW6VN" function updatePaypal(form, field) { if (field.value < 11.90476) { form.business.value = micro_id } else { form.business.value = regular_id } }'
