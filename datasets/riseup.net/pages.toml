["https://riseup.net/es/security"]
title = "Seguridad - riseup.net"
full_description = "¿Presionada por el tiempo? ¿Demasiado ocupada resistiendo la opresión o construyendo un mundo mejor? ¡Excelente! Te sugerimos que comiences tu viaje de seguridad con estos sencillos pasos que todas pueden seguir para que su vida digital sea mucho menos vulnerable. La creciente importancia de la información y la comunicación han traído consigo otro problema: el ascenso de una sociedad vigilada. Tú podrías pensar que la vigilancia proviene solo de los poderosos para mantener su dominio, afirmando su control sobre las comunicaciones. Los estados naciones han respondido con nuevas tecnologías, buscando una infraestructura que puede ser fácilmente repropuesta a favor de un total control social. A diferencia de antiguas formas de comunicación, la naturaleza de la tecnología actual requiere que nuestra información también sea segura en dirección a frustrar gobiernos; o bien, ser totalmente insegura en una dirección, haciendo posible la difusión de un detallado monitoreo de la población entera. Por otra parte, las corporaciones han descubierto que la recopilación y análisis masivo de grandes cantidades de información es necesaria si quieren permanecer competitivos en un mundo rico en información. En particular, cerca de todos los negocios publicitarios se están volcando a un sistema basado en la vigilancia y rastreo de nuestra conducta. Cuando la gente empieza a aprender sobre el incremento de la vigilancia, comienzan a sentirse abrumados. Algunos deciden, por lo tanto, que es imposible estar seguros, así que se resignan a vivir bajo perpetua vigilancia o a abandonar cualquier forma de comunicación digital. Pero nosotros, en Riseup, creemos que hay una tercera salida: nuestro objetivo es alcanzar un alto grado de seguridad, que sea fácil y accesible para cualquiera. Gran parte de la pelea contra la vigilancia toma lugar a través del sistema legal, y aplaudimos a aquellos que trabajan en esa área. Pero en contraste, el foco de Riseup es la tecnología. Cuando todas las leyes son injustas, creemos que una nueva realidad tecnológica es necesaria, en orden de alterar las posibilidades legales y políticas."
year_published = 2025
clearnet = "https://riseup.net/es/security"
