["https://riseup.net/en/security/human-security/message-hygiene"]
title = "Message Hygiene - riseup.net"
description = "Simple tips for using email and messaging more safely"
full_description = "The primary reason that email is the source of most attacks in an organization is that there is no way to verify the identity of the “From” address. Let’s repeat that: Anyone can spoof the “From” address and can make any email appear to come from anyone else. Because it is difficult to verify the sender, your inbox is a common source of Phishing Attacks and Malware Attacks. Generally, anything unexpected in your email should be looked at with suspicion. Be wary of any messages that ask you to do something, including clicking a link, opening an attachment, or emailing back information - even if they are from someone you know! If someone has broken into your account, you may see reply messages you don’t understand, additional sent items, new folders or filters being created, or other changes to settings. Suspicious emails or account behavior should be reported to a technical support person and you should preemptively change your password. Links, often innocuous looking or even hidden within emails, are the major way attackers steal your data and take over your devices. The best practice is to never click links in emails. If you must click a link, follow this checklist: Never click on links or open files from unknown senders or in otherwise suspicious emails. Unlike people you know and are working with, someone you don’t know will never send you a file that you actually need; if a link from an unknown sender actually contains useful information, you will be able to access it via another, more trusted method (for example, a web search). If you do click a link in your email, it is very important to not log in to the website that is opened. If the website prompts you to log in, you should instead follow these steps: Email attachments present several risks, including their use as a mechanism for phishing. They are not protected from being viewed or altered between recipients, so you cannot ensure that the document you send is the same one that the recipient receives. A malicious server between you and the sender could replace it with any program or file they want, including a virus or malware. Additionally, file attachments tend to remain in recipients' email in-boxes, where they are harder to control. For example, if you filled out an order form using your organizational credit card, and emailed it to a vendor as a PDF, someone who breached their email account would have access to a document containing your credit card information for as long as it was not deleted from the server."
year_published = 2025
clearnet = "https://riseup.net/en/security/human-security/message-hygiene"
tags = ["attachments", "attack", "attacks", "avoid", "clicking", "email", "emails", "hygiene", "link", "links"]
