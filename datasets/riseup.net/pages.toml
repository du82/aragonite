["https://riseup.net/en/lists/list-admin/configuration/sending-and-reception"]
title = "Sending and Reception - riseup.net"
description = "Configuration options for who can send messages, digests, how the list subjects are represented, etc."
full_description = "Configuration options for who can send messages, digests, how the list subjects are represented, etc. A list owner/administrator can set this in the ‘Who can send messages’ field under ‘Admin’ → ‘Edit List Config’ → ‘Sending/reception’. These are the options for who can send messages to the list: The digest frequency determines when members who are subscribed in digest mode receive the digest. The digest contains all the list traffic (since the last digest) in one big email. Currently, the digests are only sent in MIME format: this means that each message is included as a MIME attachment. If you have a modern mail client, this is really nice. If you have an older mail client which requires you to manually open each attachment, then this can be a big pain. Unfortunately, the software we use doesn’t support plain text digests. By default, when you reply to a list message, the reply gets sent to the individual who posted the message. You can change this option to allow the reply to go to the list instead. It is often useful to have every email sent from a list include an identifiable subject line. This allows people to quickly scan their inbox, and determine which emails are from the list. By default, all lists have Subject tagging set to the name of the list. For example, if your list was named anarchism101@riseup.net, then the Subject tagging is set to ‘anarchism101’, and all mail will include: [anarchism101] in the subject line."
