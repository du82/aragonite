title = "Bar - Ristorante Ruccio"
full_description = "BAR – GELATERIA Fiore all’occhiello del Ristorante Bar Ruccio è la consolidata tradizione artigianale che raggiunge il top con la preparazione dei gelati che vede il signor Gerardo protagonista assoluto. Una buona giornata non può iniziare senza uno splendido caffè, preparato ad arte, per poi continuare con un brunch, e aperitivi da consumarsi in un’atmosfera frizzante. Al sopraggiungere della notte c’è una vasta scelta di cocktails, per coloro che vogliono concedersi un momento di relax, o deliziare il palato con le specialità dello chef in un clima informale ed accogliente …"
