["https://ristoranteruccio.com"]
title = "Ristorante Bar Ruccio, a pochi metri dal mare sul porto di Sorrento"
description = "Situato a pochi metri dal mare, il Ristorante Bar Ruccio, si affaccia sul porto di Sorrento, uno dei panorami più belli della Penisola Sorrentina."
full_description = '''setREVStartSize({c: 'rev_slider_1_1',rl:[1240,1024,778,480],el:[],gw:[1170],gh:[900],type:'standard',justify:'',layout:'fullwidth',mh:"0"}); var revapi1, tpj; function revinit_revslider11() { jQuery(function() { tpj = jQuery; revapi1 = tpj("#rev_slider_1_1"); tpj.noConflict(); if(revapi1==undefined || revapi1.revolution == undefined){ revslider_showDoubleJqueryError("rev_slider_1_1"); }else{ revapi1.revolution({ visibilityLevels:"1240,1024,778,480", gridwidth:1170, gridheight:900, lazyType:"all", spinner:"spinner3", perspectiveType:"local", responsiveLevels:"1240,1024,778,480", progressBar: { color:"rgba(0,0,0,0.15)", size:5 }, navigation: { mouseScrollNavigation:false, onHoverStop:false, touch: { touchenabled:true }, arrows: { enable:true, style:"hesperiden", left: { }, right: { } } }, fallbacks: { allowHTML5AutoPlayOnAndroid:true }, }); } }); } // End of RevInitScript var once_revslider11 = false; if (document.readyState === "loading") {document.addEventListener('readystatechange',function() { if((document.readyState === "interactive" || document.readyState === "complete") && !once_revslider11 ) { once_revslider11 = true; revinit_revslider11();}});} else {once_revslider11 = true; revinit_revslider11();} Benvenuti da Ruccio Sorrento Situato a pochi metri dal mare, il Ristorante Ruccio, si affaccia sul porto di Sorrento, un antico borgo marinaro, ed uno dei panorami più belli della Penisola Sorrentina. È un locale semplice ed accogliente, recentemente ristrutturato, dove gli ospiti possono intrattenersi piacevolmente sulla splendida terrazza che affaccia sul mare creando un’atmosfera davvero suggestiva. Qui si respira il mare, ed il menù è sempre in grado di soddisfare le curiosità culinarie dei più esigenti, viziandoli con le migliori specialità, a base di pesce fresco, ma anche con piatti che prediligono la cucina mediterranea sempre accompagnati da un servizio impeccabile. È possibile raggiungerci via mare con la propria imbarcazione, sostare nel porto di Sorrento e gustare le nostre specialità, per informazioni contattaci. Ruccio... in pellicola Ruccio è stato anche set cinematografico per “Pane, amore e…” con la celebre ed indimenticabile Sofia Loren. Gin C Right on the dock, most restaurants with good view do not come with good food but here is exceptional. Fresh, simply and great taste , excellent service. Please come lovely food,lovely people wonderful place to eat drink,staff and owner brilliant! and very kind.cannot recommend this restaurant highly enough! when we were leaving for the airport last Friday I even got a hug and kiss goodbye from the wonderful blonde waitress! not bad for an old boy!! Ottima vista. E piuttosto Abbiamo preso i passi della piazza principale che conducono al porto dove abbiamo preso il caffè in questa caffetteria. Viste incantevoli e piacevole e tranquillo, ma hanno bisogno più posti a sedere al sole INFO UTILI SERVIZI Connessione Wi-Fi gratuita Servizio navetta Parcheggio gratuito dalle ore 20.00 Accettiamo pagamenti con carte di credito ORARI DI APERTURA Il ristorante e il bar Ruccio al momento sono chiusi. Di seguito gli orari del bar Lunedì: chiuso Martedì: 7.00 – 22.00 Mercoledì: 7.00 – 22.00 Giovedì: 7.00 – 22.00 Venerdì: 7.00 – 22.00 Sabato: 7.00 – 22.00 Domenica: 7.00 – 22.00 PRENOTA UN TAVOLO Prenota il tuo tavolo con un semplice click!'''
