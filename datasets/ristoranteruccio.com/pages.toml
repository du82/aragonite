full_description = "IL RISTORANTE Situato a Marina Piccola, direttamente sul mare, il Ristorante Bar Ruccio ha come filosofia quella di cullare il cliente tra il piacere del gusto e quello dell’ospitalità. Abbandonare la frenesia di tutti i giorni per vivere altri ritmi, più rilassanti in un ambiente, raccolto ed elegante, col Vesuvio che fa da cornice ed il rumore delle onde che s’infrangono sugli scogli come sottofondo. Durante il periodo estivo si può usufruire della meravigliosa terrazza sul mare, mentre in quello invernale ci si trasferisce nell’accogliente saletta interna. LA CUCINA La cucina è prevalentemente mediterranea, tipica, legata ai prodotti del territorio,tra i tanti piatti proposti ci sono numerosi antipasti prelibati, i paccheri di Gragnano con vongole veraci e pomodori pachino della penisola sorrentina e tanto pesce fresco di mare per ricette genuine ed appetitose. All Antipasti Dolci Primi piatti Secondi piatti Pomodorini freschi Pomodoro e Mozzarella Frittura di mare Coda d’aragosta Delizia al Limone Babà Caprese Tiramisù Polipetto Tonno scottato Frittura di mare Paccheri"
