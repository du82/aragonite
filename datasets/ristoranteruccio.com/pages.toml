title = "Restaurant - Ristorante Ruccio"
description = "Fresh cherry Tomatoes"
full_description = "RESTAURANT The Ristorante Bar Ruccio is located in Marina Piccola, by the sea. Its own philosophy is that to rock guests between the taste’s pleasure and that of hospitality. Leaving away the frenzy of everyday life for other and more relaxed rhythms in an elegant and cosy atmosphere with the sound of the breakers crashing on the rocks and with Vesuvius as a frame. In the summertime you can enjoy the beautiful terrace on the sea, while in the wintertime you move to the welcoming lounge bar. THE CUISINE The cuisine is mainly Mediterranean, typical, based on local products; among the many dishes there are a lot of delicious appetizers, paccheri of Gragnano with clams and Sorrento Peninsula pachino tomatoes, and fresh sea fish for genuine and delicious recipes. All Appetizers Dessert First dishes Second dishes Fresh cherry Tomatoes Tomato and Mozzarella Fried seafood Coda d’aragosta Lemon cake Babà Caprese Tiramisù Polipetto Tuna fish Fried seafood Paccheri"
