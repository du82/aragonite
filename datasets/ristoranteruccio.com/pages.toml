title = "Partner - Ristorante Ruccio"
full_description = "PARTNER La famiglia Ruccio è sempre al vostro fianco. Nella calda accoglienza di Villa Carolina, nella freschezza della nostra macchina del ghiaccio situata al porto di Sorrento. O all’interno di una coppetta della gelateria il Duomo, magari consumata tra le stradine del centro storico. Le altre attività del nostro gruppo vi aspettano per un assaggio dell’ospitalità che ha reso Sorrento una delle mete turistiche più rinomate al mondo. Perché qui da noi troverete sempre un ambiente familiare. Villa Carolina Più che ospite, un nuovo componente della famiglia Ruccio www.villacarolinasorrento.com Macchina del ghiaccio Il giusto modo di rompere il ghiaccio con la famiglia Ruccio www.facebook.com/macchinaghiaccio Il Duomo Il dolce benvenuto della famiglia Ruccio www.gelateriailduomo.com"
