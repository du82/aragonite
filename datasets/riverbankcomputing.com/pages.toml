["https://riverbankcomputing.com/software/qscintilla/intro"]
title = "Riverbank Computing | Introduction"
full_description = "As well as features found in standard text editing components, QScintilla includes features especially useful when editing and debugging source code. These include support for syntax styling, error indicators, code completion and call tips. The selection margin can contain markers like those used in debuggers to indicate breakpoints and the current line. Styling choices are more open than with many editors, allowing the use of proportional fonts, bold and italics, multiple foreground and background colours and multiple fonts. QScintilla, unlike Scintilla, uses the same license model as PyQt. QScintilla is available under the GNU GPL v3 and under a commercial license. The commercial version of QScintilla is bundled with the commercial version of PyQt. You can purchase the commercial version of PyQt here. Please contact sales@riverbankcomputing.com if you would like a copy of the Riverbank Commercial License."
