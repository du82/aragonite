["https://riverbankcomputing.com/commercial/license-faq"]
title = "Riverbank Computing | License FAQ"
full_description = "Here we use the term proprietary application to mean any application that is distributed under the terms of a license that is not compatible with the relevant version of the GPL and has been developed using a copy of any sofware licensed under the Riverbank Commercial License. Although we refer to PyQt specifically the same answers apply to all software licensed under the Riverbank Commercial License. It depends entirely on what license you are going to use to distribute your application. If your license is incompatible with the GPL then you need a commercial PyQt license. If your license is also incompatible with the LGPL then you also need a commercial Qt license. (Note that some parts of Qt, QtCharts and Qt Data Visualization for example, are licensed under the GPL rather than the LGPL.) Riverbank Computing derives all its income from commercial sales of PyQt. If we were sure that this income would not be significantly reduced by switching to the LGPL then we would do so. However it is not a decision that can be reversed once made. In summary, you may only distribute PyQt in binary form either statically linked with your application, as extension modules able to be imported by your application (and no other, including the standard Python interpreter), or so that you may fulfil your obligations under the LGPL if you are using the LGPL version of Qt. No, you only need to renew you licenses each year if you wish to continue to receive updates to new versions and support. If you choose not to renew then you will no longer have access to your account on our website. The price of a renewal is around 60% of the current purchase price. No, a commercial license covers a number of developers. We only require that the total number of developers at any time does not exceed the number covered by your license. Yes, so long as you have purchased the commercial version of PyQt before you distribute your proprietary application for the first time. (Note that this is different to the terms of the Qt commercial license.)"
