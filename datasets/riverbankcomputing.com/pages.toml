["https://riverbankcomputing.com/commercial/pyqt"]
title = "Riverbank Computing | PyQt Commercial Version"
full_description = "Like Qt itself, Riverbank's software (PyQt, PyQt-3D, PyQt-Charts, PyQt-DataVisualization, PyQt-NetworkAuth, PyQt-Purchasing, PyQt-WebEngine and QScintilla) is provided under a number of licenses depending on how it is going to be used. The free versions are licensed under the GNU General Public License version 3. If your use of Riverbank's software is compatible with the GPL then you do not need to buy a commercial license. If your use of Riverbank's software is not compatible with the GPL then you require a commercial license. There is no functional difference between the GPL versions and the commercial versions of Riverbank's software. The right for a single developer to write applications under Windows, UNIX, Linux, macOS, iOS and Android. The right to distribute the required PyQt6 modules, PyQt5 modules, PyQt4 modules, PyQt-3D modules, PyQt-Charts modules, PyQt-DataVisualization modules, PyQt-NetworkAuth modules, PyQt-Purchasing modules, PyQt-WebEngine modules and QScintilla library with your applications. PyQt, PyQt-3D, PyQt-Charts, PyQt-DataVisualization, PyQt-NetworkAuth, PyQt-Purchasing, PyQt-WebEngine and QScintilla updates for a period of a year. In order to continue receiving updates after a year you must renew your license. If you do not renew your license then you will lose the ability to download from your account on our website. We do not provide formal support contracts for PyQt, PyQt-3D, PyQt-Charts, PyQt-DataVisualization, PyQt-NetworkAuth, PyQt-Purchasing or QScintilla. Instead we provide informal support as best we can and give priority to commercial license holders. In relation to PyQt, PyQt-3D, PyQt-Charts, PyQt-DataVisualization, PyQt-NetworkAuth and PyQtPurchasing, support is limited to problems specific to PyQt, PyQt-3D, PyQt-Charts, PyQt-DataVisualization, PyQt-NetworkAuth and PyQt-Purchasing themselves. We do not provide general Qt development support. In relation to QScintilla, support is limited to problems specific to the Qt code and Python bindings. We do not provide support for the core Scintilla code."
