["https://www.riverbankcomputing.com/static/Docs/QScintilla"]
title = "QScintilla: QScintilla - a Port to Qt v5 and Qt v6 of Scintilla"
full_description = "As well as features found in standard text editing components, Scintilla includes features especially useful when editing and debugging source code: QScintilla is a port or Scintilla to the Qt GUI toolkit from The Qt Company and runs on any operating system supported by Qt (eg. Windows, Linux, macOS, iOS and Android). QScintilla works with Qt v5 and v6. QScintilla also includes language bindings for Python. These require that PyQt v5 or v6 is also installed. QScintilla is available under the GNU General Public License v3 and the Riverbank Commercial License. The commercial license allows closed source applications using QScintilla to be developed and distributed. At the moment the commercial version of QScintilla is bundled with, but packaged separately from, the commercial version of PyQt. As supplied QScintilla will be built as a shared library/DLL and installed in the same directories as the Qt libraries and include files. If you wish to build a static version of the library then pass CONFIG+=staticlib on the qmake command line. On macOS, if you wish to build a dynamic version of the library that supports both x86_64 and arm64 architectures then edit the file qscintilla.pro in the src directory and comment in the definition of QMAKE_APPLE_DEVICE_ARCHS. Similar changes can be made to the .pro files for the Designer plugin and the example application. If you want to make more significant changes to the configuration then edit the file qscintilla.pro in the src directory. If you do make changes, specifically to the names of the installation directories or the name of the library, then you may also need to update the src/features/qscintilla2.prf file. The underlying Scintilla code may support additional compile-time options. These can be configured by passing appropriate arguments to qmake. For example, if you have an old C++ compiler that does not have a working std::regex then invoke qmake as follows: Before compiling QScintilla on Windows you should remove the Qsci directory containing the QScintilla header files from any previous installation. This is because the Makefile generated by qmake will find these older header files instead of the new ones."
