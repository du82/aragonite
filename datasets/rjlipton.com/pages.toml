description = "Joseph Cheriyan is on the faculty in the Combinatorics & Optimization Department of the University of Waterloo---see here. He is also an organizer of the conference celebrating the 100th anniversary of Ray Fulkerson's birthday (August 14, 1924). It is planned for July 17-19, 2024 at Waterloo. Cornell University will host a parallel event, from September…"
full_description = "The 100th anniversary of Fulkerson’s Birthday May 15, 2024 Joseph Cheriyan is on the faculty in the Combinatorics & Optimization Department of the University of Waterloo—see here. He is also an organizer of the conference celebrating the 100th anniversary of Ray Fulkerson’s birthday (August 14, 1924). It is planned for July 17-19, 2024 at Waterloo. Cornell University will host a parallel event, from September 20, 21, 2024 that will also focus on the life and contributions of Fulkerson. While the two events are independent, we are coordinating with the organizers of the two events. Cheriyan asked if we could help announce the conference being organized to honor Fulkerson. So we will. The Conference at Waterloo Here is a summary of the conference: Fulkerson 100 is a meeting organized to celebrate Fulkerson’s legacy and impact in discrete mathematics, especially in the fields of graph theory, optimization, and operations research. The workshop will feature invited talks in graph theory, combinatorics, optimization, and theoretical computer science, given by some of the foremost researchers in these areas. It will also feature lightning talks and a poster session devoted to students and postdocs. By bringing together various leading researchers in discrete mathematics with junior researchers and students, the workshop aims to boost research in the areas pioneered by Fulkerson, while (implicitly) commemorating his vision and contributions. The Algorithm Fulkerson was an American mathematician who co-developed the Ford-Fulkerson algorithm, one of the most well-known algorithms to solve the maximum flow problem in networks. L. R. Ford Jr. published it in 1956 with Fulkerson here. It made fundamental and lasting contributions to combinatorial mathematics, optimization, and operations research. In 1962 they produced a book-length description of their method. In 1971 Fulkerson moved to Cornell University as the Maxwell Upson Professor of Engineering. He was diagnosed with Crohn’s disease and was limited in his teaching. A Related Problem Jack Edmonds and Richard Karp created in computer science, the Edmonds-Karp algorithm which is an implementation of the Ford-Fulkerson method for computing the maximum flow in a flow network. See here. The algorithm was first published by Yefim Dinitz in 1970, and independently published by Edmonds and Karp in 1972. Dinitz’s algorithm includes additional techniques that reduced the running time. Open Problems Thanks to Waterloo and Cornell for these interesting conferences. Thanks to Cheriyan for his work on the Waterloo version. Share this:RedditFacebookLike this:Like Loading... Related from → Uncategorized ← Just Jim Quantum Computers on Wall Street → 6 Comments leave one → JG permalink May 15, 2024 5:35 pm Regarding the “suicide of Fulkerson” — I believe Dick copied this line verbatim from the Wikipedia page (https://en.wikipedia.org/wiki/D._R._Fulkerson). I should point out that the reference (https://www.informs.org/Explore/History-of-O.R.-Excellence/Biographical-Profiles/Fulkerson-D.-Ray) cited after that line in Wikipedia doesn’t contain any mention of suicide. It does mention the Crohn’s disease. Just saying. Loading... Reply Blog Runner permalink May 15, 2024 6:37 pm Are there NC algorithms to approximate maxflow? Loading... Reply Gabriel Verret permalink May 15, 2024 10:17 pm I don’t think that picture is of the correct Jack Edmonds. Loading... Reply rjlipton permalink* May 16, 2024 6:50 am Thanks Loading... Reply Joe Cheriyan permalink May 17, 2024 6:09 pm Thank you for posting about the F100 events. Much appreciated. Full disclosure: The organizers of the Waterloo event are Chaitanya Swamy, Bertrand Guenin and I, and the main organizers of the Cornell event (https://www.orie.cornell.edu/orie-events/dr-fulkerson-centennial-celebration) are David Shmoys and David Williamson. Aside: As far as I know, the Wikipedia article is correct. There are articles on Ray’s math and life by Billera and Lucas (1976) https://rdcu.be/dIhiM https://doi.org/10.1007/BFb0121190 Bland & Orlin (2005) https://onlinelibrary.wiley.com/doi/pdf/10.1111/j.1475-3995.2005.00506.x and Chvatal (1976) https://pubsonline.informs.org/doi/epdf/10.1287/moor.1.4.311 Chvatal concludes with “His mathematics, which has excited and stimulated us over the years, will continue to excite and stimulate future generations …” agreed, but the maestro adds 7 more words “… long after all of us are gone.” Loading... Reply javaid aslam permalink July 2, 2024 12:28 pm Looks like everybody is busy enjoing the summer? Loading... Reply Leave a ReplyCancel reply document.addEventListener('DOMContentLoaded', function () { var commentForms = document.getElementsByClassName('jetpack_remote_comment'); for (var i = 0; i < commentForms.length; i++) { commentForms[i].allowTransparency = false; commentForms[i].scrolling = 'no'; } });"
