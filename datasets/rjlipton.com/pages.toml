full_description = 'January 7, 2025 new theory 1 Comment from → Uncategorized Women In Theory September 20, 2024 My dear wife, Kathryn Farley, just woke me this Friday the 20th from a nap with something that she said was amazing. She told me it was the top most viewed video of the entire day—over a million views. It was indeed terrific—especially for a video by women who work in complexity theory. A Result From Simons As part of their flashback series, they are sharing one of the most popular videos from our SimonsTV YouTube channel. In May 2020, the Women in Theory conference, which was scheduled to take place at the Simons Institute, was held online due to coronavirus restrictions. In connection with the event, the group released a video of a special theoretical—computer-science version of Gloria Gaynor’s classic song “I Will Survive”. See it here with new lyrics by Avi Wigderson. Today this video was indeed the top most watched one of the day. It beat out a president candidate singing about cats and dogs—see here. And is much cooler. Leave a comment from → Uncategorized Biblical Codes September 5, 2024 This Sunday’s NYTimes had an article on Eliyahu Rips who just just passed away at 75. He was an Israeli mathematician known for his research in geometric group theory. He had became known to the general public years ago following his co-authoring a paper on what is popularly known as Bible code, the supposed coded messaging in the Hebrew text of the Torah. The book by Michael Drosnin claimed that historical and future events were encoded in the Old Testament, although he couldn’t explain how or why. Find Secrets in Public Documents Drosnin began researching the Bible Code in 1992 after meeting the mathematician Eliyahu Rips in Israel. His work was deeply inspired by the publication of the academic article entitled Equidistant Letter Sequences in the Book of Genesis by Doron Witztum, Eliyahu Rips, and Yoav Rosenberg in the journal Statistical Science, published by the Institute of Mathematical Statistics, in August 1994. He had also become convinced that statistical tools and newer, more powerful computers that were becoming available in the 1980s could be used to identify hidden meaning within the Bible, and he teamed up with his two partners to discover them. Their biggest finding was the names of 32 Jewish scholars in the text, along with their birth or death dates; several of the scholars had lived thousands of years after Genesis was written. Open Problems The idea is to have a document D that is public. Then they run some search that finds some object S that is encoded inside D. This is suppose to show that D is more interesting than we previously thought. The object S is not obviously hidden in D—this is the whole point. There is an old Jewish tradition about a “hidden text” in the Hebrew Pentateuch (the Five Books of Moses), consisting of words or phrases expressed in the form of equidistant letter sequences (ELS’s) — that is by selecting sequences of equally spaced letters in the text. Since this tradition was passed orally, only few expressions that belong to the “hidden text” were preserved in writing (Rabbenu Bahya, 1492 and Cordovero, 1592); actually almost all the words and the syntax are unknown. Rabbi H.M.D. Weissmandel (Weissmandel, 1958) was the first to try to show the existence of such a “hidden text”, by finding interesting patterns consisting of ELS’s. 1 Comment from → Uncategorized Foundations of Computer Science August 22, 2024 Santosh Vempala is the chair of this FOCS 2024 conference. Here is the schedule of the talks. And in our next section are the accepted papers with links so you can see the results now. His committee is: Daniel Alabi, Columbia Nima Anari, Stanford Maryam Aliakbarpour, Rice Xiaotie Deng, Peking University Jelena Diakonikolas, Wisconsin Alina Ene, BU Funda Ergun, Indiana Vipul Goyal, NTT Research Sean Hallgren, Penn State Russell Impagliazzo, UCSD Varun Kanade, Oxford Ravi Kannan, C