full_description = "Quantum Computers on Wall Street May 22, 2024 Bob Henderson is a reporter for the Wall Street Journal. Like other reporters he also has a PhD in theoretical physics from the University of Rochester, an MFA in writing from Columbia University, degrees in electrical engineering from Rensselaer Polytechnic Institute and the University of Southern California, and in photojournalism from Syracuse University. Just kidding. He is special. His recent article covers the work of several experts on quantum computing: Quantum Computing Gets Real: It Could Even Shorten Your Airport Connection. Quantum Model One expert is Angelo Bassi who has a degree in Physics from the University of Trieste in 1998 and the PhD in Physics in 2001. He has a neat model of what makes quantum computation different from classic. Imagine a surfer who is about to hit a rock in their path. The surfer can go left or right with respect to the rock. But compare the surfer to a wave: the wave can do more since it can go both ways. It could go some to the left and some to the right. This is perhaps more powerful since a wave can effectively go both ways. This seems like a terrific way to see quantum’s advantage. Another expert in the article is Scott Aaronson—our long time friend. He is a professor of computer science at University of Texas at Austin and director of its Quantum Information Center. Scott is famous for his blog which is on theory and especially on quantum computers. Scott thinks current quantum tricks are likely to be still modest but in the future who knows? Open Problems What do you think? Do you like the surfer analogy? Share this:RedditFacebookLike this:Like Loading... Related from → Uncategorized ← The 100th anniversary of Fulkerson’s Birthday A Most Important Number → 2 Comments leave one → Lance Fortnow permalink May 22, 2024 7:44 am I found the article quite naive. There’s no reason, practically or theoretically, to think quantum will give an advantage in optimization problems in general, especially since we have very good classical attacks on these kinds of problems. The statement “A quantum computer containing just 350 qubits could theoretically keep track of all the possible solutions to the 50-aircraft-to-100-gate flight-assignment problem.” is a complete misunderstanding of quantum parallelism. How does this get published? Loading... Reply kodlu permalink May 22, 2024 3:25 pm I agree with Fortnow. On the other hand, even famous physicists get away with claiming string theory is “testable”, the proof it works and explains the whole universe is “just around the corner”. So we can’t expect WSJ to have particularly high standards. The quantum parallelism statement is exactly how such parallelism is presented in popular accounts. Loading... Reply Leave a ReplyCancel reply document.addEventListener('DOMContentLoaded', function () { var commentForms = document.getElementsByClassName('jetpack_remote_comment'); for (var i = 0; i < commentForms.length; i++) { commentForms[i].allowTransparency = false; commentForms[i].scrolling = 'no'; } });"
