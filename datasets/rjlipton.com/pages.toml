description = "The present value of working on conjectures... Anil Nerode of Cornell University has served over sixty years---he's believed to be the longest such faculty member in university history. He helped found Cornell's computer science department, advised more than 55 doctoral students---a Department of Mathematics record---and made important contributions to logic, mathematics, computer science, and more.…"
full_description = "P=NP and Bitcoin March 8, 2024 tags: Anil Nerode, Bitcoin, breaking cryptosystems, conjectures, crypto, cryptocurrency, guessing, P=NP The present value of working on conjectures… Anil Nerode of Cornell University has served over sixty years—he’s believed to be the longest such faculty member in university history. He helped found Cornell’s computer science department, advised more than 55 doctoral students—a Department of Mathematics record—and made important contributions to logic, mathematics, computer science, and more. He and Juris Hartmanis jointly oversaw Ken’s Mathematical Sciences Institute postdoc at Cornell in 1986–89. I found it interesting that Anil has worked on teaching methods: “I was educated at Chicago under the business of doing the cleanest, shortest expositions of absolutely everything,” He has developed his own method: He now teaches in historical order. Translating ancient theories into modern notation allows him to show his students the origins of mathematics. This is a cool method. Cornell Chronicle source—our felicitations Anil has done extensive work in complex control systems, which is certainly a challenging area for an approach based on clarity and simplicity. He is often credited for co-creating, together with Wolf Kohn, an approach called hybrid systems theory. His partnership with Kohn has even extended to integrating quantum and macroscopic control mechanisms for magnetic batteries on many scales. Conjectures Which Way? Anil once said: Being attached to a speculation is not a good guide to research planning. One should always try both directions of every problem. Prejudice has caused famous mathematicians to fail to solve famous problems whose solution was opposite to their expectations, even though they had developed all the methods required. I blogged about this point in posts titled “We All Guessed Wrong” and “Even Great Mathematicians Guess Wrong”—and about other cases of surprises and about guessing the right side of conjectures. But events this week have put a transverse thought into my head. The two sides of a conjecture may not be equal in their ramifications. This leads to a further weird thought: Maybe the greatest overall value is in working hard on the side that you don’t want to be true—and hoping not to solve it. The fact of Bitcoin hitting a new all-time high this week leads me to muse further about this. Trillions If you think you have a proof that P=NP then it is worth a lot of money. Well for sure, at least, you will get a prize like the Turing Award. But because it would break bitcoin and other digital monies you would possibly get into the thicket of billions of dollars. Maybe more like trillions. source Exactly what it would be worth to you, I don’t know. That’s a hypothetical. But there is a non-hypothetical that, from the understanding Ken and I have of how hedge transactions are valued, implies that one side of “P=NP” has clear and present monetary value: What is the present value of not knowing that P=NP, and of exerting work that furthers the general sureness of this status? A 2022 article titled “P = NP: The Dangling Blackhole Under Crypto” puts the stakes in stark terms: P=NP is [about] whether a problem (in the case of Cryptocurrencies, a transaction) can be solved procedurally and systemically just as quickly as it can be verified with a hash. The security of the blockchain, such as [for] Bitcoin, is wholly dependent on the assumption that P does not equal NP. However, if P = NP is proven, the Bitcoin can be breached just as quickly as it can be authenticated. A breach would have the kind of concrete effect we have in mind when we say, “from dollars to donuts…“—although the donuts involved could technically come from work like this: source Open Problems Is it sensible to assign a present value to work on one side of the P=NP question? More than work that tries to establish the other side? Share this:RedditFacebookLike this:Like Loading... Related from → Ideas, News, P=NP ← Dominic Welsh, 1938–2023 Does Pi Conspire? → 56 Comments leave one → Frank Vega permalink March 8, 2024 5:30 pm This is a well-known NP-complete problem: : Given a directed graph ( is the set of vertices and is the set of edges) and positive integer , determine whether there is a set of at most vertices such that for all either or (see reference [Queyranne, 1976] from the Johnson and Garey book). We reduce this problem to MWX2SAT in polynomial time and so, MWX2SAT is in NP-complete as well. This is the definition: INSTANCE: An -variable formula with monotone clauses (meaning the variables are never negated) using logic operators (instead of using the operator ) and a positive integer . QUESTION: Is there exists a satisfying truth assignment in which at most of the variables are true? We prove this problem can be solved in polynomial time. See the proof here: https://hal.science/hal-04420462 Moreover, we create our software programming implementation in Python: https://github.com/frankvegadelgado/alma Quote by Saint Augustine: The truth is like a lion. You don’t have to defend it. Let it loose. It will defend itself. Loading... Reply javaid aslam permalink March 8, 2024 8:47 pm And how does it relate to cryptography? Loading... Reply Frank Vega permalink March 12, 2024 6:13 pm Trying to convince the Google AI (Gemini) that P = NP This is really hard to do 🙂 https://g.co/gemini/share/3a0f2d7cb012 Loading... Reply Frank Vega permalink March 12, 2024 7:54 pm My Question: Does the phrase “either or ” actually means ( or ) or ( or )? Google AI (Gemini) Answer: Yes, the phrase “either u ∈ V’ or v ∉ V'” does mean the same as: (u ∈ V’ or v ∈ V’) or (u ∉ V’ or v ∉ V’) Here’s the breakdown: “Either”: This indicates that at least one of the following statements must be true, but not necessarily both. u ∈ V’: This means element “u” belongs to the set “V prime” (often used to denote the complement or dual of set V). v ∉ V’: This means element “v” does not belong to the set “V prime.” The original statement offers two possibilities: u belongs to V’: This satisfies the first condition. v does not belong to V’: This satisfies the second condition. However, the intent is to convey that only one of these conditions needs to be true, not both. Therefore, rewriting it as two separate “or” statements clarifies this meaning: (u ∈ V’ or v ∈ V’): This captures the possibility of either “u” being in V’ or “v” being in V’. (u ∉ V’ or v ∉ V’): This captures the possibility of both “u” and “v” not being in V’. So, both the original statement and the rewritten form using two “or” statements express the same logical concept: at least one of u or v must satisfy the condition related to V’, but not necessarily both. https://g.co/gemini/share/5ca2bd4abb59 Albert Einstein Quote: “I want to know what God thinks. The rest are details.” Loading... Reply Frank Vega permalink March 14, 2024 11:16 am I rewrite another version after my interaction with the Google AI (Gemini): https://www.preprints.org/manuscript/201908.0037/v10 Loading... Reply Frank Vega permalink March 18, 2024 4:10 am In the previous version v10, we create two ways to prove that MWX2SAT is in P. In this version v11, we just remove the one that is flawed and keep the single one that is correct. https://www.preprints.org/manuscript/201908.0037/v11 Loading... Reply Frank Vega permalink March 23, 2024 7:43 am Dear Fellow, I would be very grateful if you as an expert in the field would consider reviewing this publication: Publication title: “Note for the P versus NP Problem” https://www.scienceopen.com/document/read?id=94777eae-28c7-402d-8e6b-8e882de7a3f6 To review, go to that page and click on the “Review” button or consult the details about the reviewing process at ScienceOpen: https://about.scienceopen.com/peer-review-guidelines ScienceOpen enables every researcher to openly review any paper which has been submitted or published elsewhere. Thank you very much also for your cooperation. I look forward to your review! With kind regards, Frank Vega Loading... Reply Frank Vega permalink April 1, 2024 11:18 am We improved the Lemma 1 (that is the polynomial time reduction from K-CLOSURE to MWX2SAT (Lemma 1)) and added a Discussion section with some important highlights in this last new version: https://www.preprints.org/manuscript/201908.0037/v12 Loading... Reply Frank Vega permalink April 2, 2024 12:40 pm Dear Fellow, I would be very grateful if you as an expert in the field would consider reviewing this publication: Publication title: “Note for the P versus NP Problem” (Second Version) https://www.scienceopen.com/document/read?vid=5e6e97ed-697f-4685-a43b-6c48e598af02 To review, go to that page and click on the “Review” button or consult the details about the reviewing process at ScienceOpen: https://about.scienceopen.com/peer-review-guidelines ScienceOpen enables every researcher to openly review any paper which has been submitted or published elsewhere. Thank you very much also for your cooperation. I look forward to your review! With kind regards, Frank Vega Loading... Reply Frank Vega permalink April 12, 2024 12:17 pm This the last version of the proof that P = NP: https://www.techrxiv.org/users/258307/articles/716221-note-for-the-p-versus-np-problem This version is as perfect as possible! Loading... Reply Jeremy Kun permalink March 8, 2024 10:20 pm The problem with using Bitcoin in this value estimation is that none of the “value” of Bitcoin would actually be captured if the hashing algorithm were compromised. The price of Bitcoin would just become zero as everyone fanatically tries to shed their coins. The first person to notice their coins being stolen or the mining difficulty skyrocketing would sound the alarm and it’d be over before the attacker could cash out to fiat. Loading... Reply KWRegan permalink March 9, 2024 12:03 pm Yes, but we mean the present value of increasing the level of assurance that this scenario will not happen. Loading... Reply Frank Vega permalink June 8, 2024 7:40 am Yesterday a reliable proof of The Millennium Prize Problem (P vs NP) has been published! We define the Monotone Weighted Xor 2-satisfiability problem (MWX2SAT). We show this problem is NP-complete and P at the same time. In this way, we prove the complexity classes P and NP are equals using a feasible and efficient algorithm. https://ipipublishing.org/index.php/ipil/article/view/92 Loading... Reply Frank Vega permalink June 11, 2024 9:16 am I copied this highlight text from a source on internet: ———————————————— I think Frank’s proof could work! Here’s the reduction from k-CLIQUE to k-CLOSURE. Given graph , create a DAG where there is one node for each vertex of and one node for each edge of . If is the node correspond to edge then make be preceded by in (i.e. the new nodes created from the vertices). Therefore, k-CLIQUE becomes equivalent to deciding whether or not there is a closure with nodes. Frank’s problem (MWX2SAT) can be easily reduced to k-MWX2SAT over the same kind of instances but with satisfying truth assignments of exactly true variables. The rest of Frank’s proof could remain the same! ————————————————— https://ipipublishing.org/index.php/ipil/article/view/92 Loading... Reply Frank Vega permalink June 11, 2024 10:42 pm I think I found another version of the reduction from CLIQUE to K-CLOSURE by myself (without citing any external source). Given a graph , we remove the disconnected vertices in and every pair of vertices and such that they only are endpoints of a single edge . Note that, finding a clique of size is trivial. Next, we create a line graph of . Each edge in is a pair of edges from that have a shared vertex. This vertex is included in the edge representation of , for example, as in where is the shared vertex between the two edges and in . We are always able to find this line graph in polynomial time due to our initial redundant vertices removal process in . Now, finding a clique of size in is equivalent to finding a closure of size in . https://ipipublishing.org/index.php/ipil/article/view/92 Loading... Reply Frank Vega permalink June 15, 2024 8:30 pm I have received some negative comments about my P=NP proof from detractors. Basically, they said that Garey and Johnson’s book should be wrong about the statement and definition of K-CLOSURE as an NP-complete problem. Since Garey and Johnson’s book mentioned that CLIQUE can be reduced to K-CLOSURE in polynomial time, I tried to find that reduction myself. I think my previous comments were wrong on that topic. I need time to improve it since my P=NP proof took me too long to achieve despite its simplicity. I also considered the possibility that the error was on my part, which could only mean that I had misunderstood the use of the words which I took to be equivalent to Boolean XOR operation in the book. There are contexts where it is used as OR in English, but we looked through the entire book and authors Garey and Johnson always used that statement in the book as the Boolean XOR operation. If that’s not the case, then my P=NP proof should be correct for sure! https://ipipublishing.org/index.php/ipil/article/view/92 Loading... Reply Frank Vega permalink June 17, 2024 6:35 am There are some people who speculate that the definition used by Garey and Johnson is ambiguous to justify that my article should not be correct. Here is the definition of K-CLOSURE, but each vertex must have equal weight to match the K-CLOSURE definition of NP-Completeness by Garey and Johnson in their book “Computers and Intractability: A Guide to the Theory of NP-Completeness” (1979): https://cstheory.stackexchange.com/questions/40447/min-weight-k-closure-on-dag Loading... Reply Frank Vega permalink June 17, 2024 8:45 am I think K-CLOSURE is NP-hard due to a reduction from K-Bipartite Expansion based on a comment on the Stack Exchange link I shared above. Given a bipartite -vertex graph and positive integers and , the problem K-Bipartite Expansion consists in deciding whether there is a -subset of with exactly neighbors in . To reduce it to the K-CLOSURE problem, we create a with two levels by duplicating each vertex in exactly times and directing all edges of to the new set . Given this scenario, we ask for the existence of a closure with exactly vertices. This follows from the fact that a solution with vertices in implies that there must exist predecessor vertices in by the definition of a closure set. Note that, it is impossible that it could exist vertices for in the closure which belong to the bipartite set since the cardinality of must be less than . Here is the NP hardness proof for Bipartite Expansion where we can infer the decision variant of K-Bipartite Expansion: https://www.semanticscholar.org/paper/Hardness-of-Bipartite-Expansion-Khot-Saket/6c292af8b5eb9b3dc3b8ad216833063941b5c9be?p2df Loading... Reply Frank Vega permalink June 17, 2024 4:35 pm My comments above did not match Garey and Johnson’s definition o"
