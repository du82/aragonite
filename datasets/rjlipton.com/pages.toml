ersity of Finance and Economics) An Improved Pseudopolynomial Time Algorithm for Subset Sum Lin Chen, Jiayi Lian, Yuchen Mao, Guochuan Zhang (Zhejiang University) Fully Dynamic k-Clustering with Fast Update Time and Small Recourse Sayan Bhattacharya, Martin Costa (University of Warwick); Naveen Garg (IIT Delhi); Silvio Lattanzi, Nikos Parotsidis (Google Research) Constant-Depth Arithmetic Circuits for Linear Algebra Problems Robert Andrews, Avi Wigderson (Institute for Advanced Study) Dynamic Deterministic Constant-Approximate Distance Oracles with $n^{\epsilon}$ Worst-Case Update Time Bernhard Haeupler (ETH Zurich \& Carnegie Mellon University); Yaowei Long, Thatchaphol Saranurak (University of Michigan) Lempel-Ziv (LZ77) Factorization in Sublinear Time Dominik Kempa (Stony Brook University); Tomasz Kociumaka (Max Planck Institute for Informatics) The Tractability Border of Reachability in Simple Vector Addition Systems with States Dmitry Chistikov (Centre for Discrete Mathematics and its Applications (DIMAP) \& Department of Computer Science, University of Warwick, Coventry, UK); Wojciech Czerwiski, ukasz Orlikowski, Filip Mazowiecki (University of Warsaw); Henry Sinclair-Banks (Centre for Discrete Mathematics and its Applications (DIMAP) \& Department of Computer Science, University of Warwick, Coventry, UK); Karol W?grzycki (Saarland University and Max Planck Institute for Informatics, Saarbrucken, Germany) Semi-Bandit Learning for Monotone Stochastic Optimization Arpit Agarwal (Columbia University); Rohan Ghuge (Georgia Institute of Technology); Viswanath Nagarajan (University of Michigan) Sparse graph counting and Kelley—Meka bounds for binary systems Yuval Filmus (Technion—Israel Institute of Technology); Hamed Hatami (McGill University); Kaave Hosseini (University of Rochester); Esty Kelman (MIT, Boston University) Replicability in High Dimensional Statistics Max Hopkins, Russell Impagliazzo, Daniel Kane, Sihan Liu, Christopher Ye (University of California, 