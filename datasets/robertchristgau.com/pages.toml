["https://robertchristgau.com/xg/bn/2012-02.php"]
title = "Robert Christgau: Tough Love"
full_description = '''Etta James's death at 73 on January 20th was not a surprise. Her leukemia had been declared incurable in December; her dementia was ongoing; her kidneys were bad. The gastric bypass surgery that put the 400-pound singer back on her feet in 2002 had long since proven more dangerous than promised. And though none of the many laudatory obits mentioned it, there was also her liver, which, having soldiered through decades of heroin, alcohol, cocaine, and painkiller addiction, must have been ready for a rest. Prepared by these hard facts for the inevitable sales uptick--James even appeared briefly in the Top 10 of the Rhapsody streaming site after she died, though never as high as Adele, who has said James inspired her to become a singer--Universal asked ace compiler Andy McKaie to prepare a four-CD set to supplant or supplement 2000's excellent three-CD The Chess Box. This he achieved by adding nine tracks from 1954-58 and 22 from 1977-2007 while subtracting 19 from James's Chess/Argo/Cadet years, 1960-76. Because this arrangement respects James's extraordinary longevity, Heart & Soul: A Retrospective would appear to be where to catch up with this essential artist you may well have ignored. But it's not like those omitted Chess tracks would waste your time. Even before she died, they kept sounding better, just like the five years we'd always thought Aretha Franklin threw away at Columbia. Great voices get more precious with the years. Great voices are also difficult to describe, so much so that obituaries seldom try, although Peter Keepnews recalled a few useful words from Jon Pareles in The New York Times: "a huge range, a multiplicity of tones and vast reserves of volume." All true, and relevant, but if range and volume did the trick there'd be great voices by the thousand--it's in those unspecified tones that the vocal "grain" resides. Preliminarily, say that James, who began recording at 15, was often girlish and always not, and that her jailbait clarity coexisted readily with her big-mama grit. Combined with her range, volume, and knack for drama, those contradictions rendered her a sing-the-phone-book original, which served her well with the generic r&b ditties of her pre-Chess teens and also in her fifties and sixties, when she turned out some 20 rather miraculous if somewhat hit-or-miss albums. That she should have recorded effectively for so many decades, from 1955 till 2012--leukemia and dementia notwithstanding, her 2011 farewell, The Dreamer, is more hit than miss--puts her in a class with Ray Charles, Johnny Cash, and James Brown, slightly older artists who unlike James never identified as rock and roll or targeted teenagers. She wasn't merely "influential."'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bn/2012-02.php"
