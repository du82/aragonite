["https://robertchristgau.com/todo/cg.php"]
title = "Robert Christgau: To Do: Consumer Guide"
full_description = '''We have started a couple of pages for background information on Consumer Guides, but these haven't progressed very far: The Consumer Guide database currently has all CG entries and reviews that correspond to the three published decade books plus any additional entries/reviews from posted Consumer Guide columns (almost complete from late-1983, plus some early columns from 1969-1970 and the retrospective Consumer Guide to 1967). This represents a drop from 5274 missing reviews on Nov. 11, 2001, to 0 on Mar. 2, 2002 (so yes, we're working on this). There are a relatively small number of CG reviews in missing columns between 1969-83 that still need to be added. The Consumer Guide database was assembled rapidly from several sources, and has not been proofread for accuracy, consistency, and conformance to conventions. Each source brings its own set of problems: Another issue: CG has always flagged "import" albums, but this information has not been maintained. My thinking is that common names (e.g., Columbia) should be listed as separate labels for each country: Columbia, Columbia (U.K.), Columbia (France), etc. Alternatively, we could add a nation field to the label field.'''
