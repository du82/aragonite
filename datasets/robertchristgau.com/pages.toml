["https://robertchristgau.com/xg/bk-aow/beatles.php"]
title = "Robert Christgau: Living Without the Beatles"
full_description = '''Not one but two of George Harrison's friends got more applause than the best-selling ex-Beatle at the Bangla-Desh concert at Madison Square Garden. Dylan did, of course--New York is his turf--but unless I am deceiving myself, so did Ringo. Admittedly, self-deception is a real possibility. I clapped and shouted enough to provide Ringo's margin of victory all by myself, and that epiphany exhausted, sat and gazed upon my hero through opera glasses. I was only twenty rows back, among the industry freebies, but I craved detail, and wouldn't you know? George kept getting in the way. His white suit had obscured Ringo's grand ole black-on-black for most of "It Don't Come Easy" as well, but both times Ringo seemed aware that he was being upstaged. He looked calm and even complacent, brimming with quiet happiness, as if after eight years he still couldn't quite believe his own good fortune--a seat right up on stage, the best industry freebie of all. That's why we love him, after all, and why unlike the others he remains immune to the vagaries of our affection. Ringo is our representative on the Beatles. Think about it. Ringo joined the group in the summer of 1962, replacing the corny good looks of Pete Best with a homely corrective to all that genius. The Beatles were on the brink of their fame. They had just signed with George Martin and EMI and dominated the thriving Liverpool pop scene. In less than a year they would become a national craze, with international Beatlemania already imminent. What a time that must have been for Ringo, a continual up among three intimidating near-strangers. In retrospect it must seem the high point of his life, but if he's passed his peak, he's not complaining. Ringo may not be able to describe the dark chamber of his future, but he knows it's his, and that suffices. He is a family man now, unalienated from his lifework and identity. Four or five years ago, when John was talking about expanding into films and George was learning sitar and transcendental meditation and Paul was turning in on himself in a London town house, Ringo also had plans of his own--he wanted to start a Beatle museum. And now that the breakup is real, he has written a song, his fourth, called "Early 1970," the B side of the best single any ex-Beatle has released. Perhaps you saw the lyrics in Howard Smith's column. After devoting a stanza each to Paul ("When he comes to town, I wonder if he'll play with me"), John ("When he comes to town, I know he's gonna play with me"), and George ("He's always in town, playing for you with me"), he goes on to himself: "I play guitar, A D E/ I don't play bass cos that's too hard for me/ I play the piano if it's in C/ And when I go to town I want to see all three." He really is the ultimate Beatle fan.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-aow/beatles.php"
