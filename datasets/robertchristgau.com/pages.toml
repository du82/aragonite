["https://robertchristgau.com/books.php"]
title = "Robert Christgau: Books"
full_description = "Book Reports: A Music Critic on His First Love, Which Was Reading Paperback, 2019. Duke University Press, 416 pages. In this generous collection of book reviews and literary essays, legendary Village Voice rock critic Robert Christgau showcases the passion that made him a critic--his love for the written word. Many selections address music, from blackface minstrelsy to punk and hip-hop, artists from Lead Belly to Patti Smith, and fellow critics from Ellen Willis and Lester Bangs to Nelson George and Jessica Hopper. But Book Reports also teases out the popular in the Bible and 1984 as well as pornography and science fiction, and analyzes at length the cultural theory of Raymond Williams, the detective novels of Walter Mosley, the history of bohemia, and the 2008 financial crisis. It establishes Christgau as not just the Dean of American Rock Critics, but one of America's most insightful cultural critics as well. Is It Still Good to Ya? Fifty Years of Rock Criticism 1967-2017 Paperback, 2018. Duke University Press, 456 pages. Is It Still Good to Ya? sums up the career of longtime Village Voice stalwart Robert Christgau, who for half a century has been America's most widely respected rock critic, honoring a music he argues is only more enduring because it's sometimes simple or silly. While compiling historical overviews going back to Dionysus and the gramophone along with artist analyses that range from Louis Armstrong to M.I.A., this definitive collection also explores pop's African roots, response to 9/11, and evolution from the teen music of the '50s to an art form compelled to confront mortality as its heroes pass on. A final section combines searching obituaries of David Bowie, Prince, and Leonard Cohen with awed farewells to Bob Marley and Ornette Coleman. Going Into the City: Portrait of a Critic as a Young Man Paperback, 2016, Dey Street Books, 384 pages. Hardcover, 2015, Dey Street Books, 384 pages. Robert Christgau takes us on a heady tour through his life and times in this vividly atmospheric and visceral memoir that is both a love letter to a New York long past and a tribute to the transformative power of art. . . . Christgau chronicled many of the key cultural shifts of the last half century and revolutionized the cultural status of the music critic in the process. Going Into the City is a look back at the upbringing that grounded him, the history that transformed him, and the music, books, and films that showed him the way. . . . It's an homage to the city of Christgau's youth from Queens to the Lower East Side -- a city that exists mostly in memory today. And it's a love story about the Greenwich Village girl who roamed this realm of possibility with him."
