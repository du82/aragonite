["https://robertchristgau.com/bk-cg90s.php"]
title = "Robert Christgau: Christgau's Consumer Guide: Albums of the 90s"
full_description = '''The '90s saw more albums produced and distributed than any other decade. It was a fertile era for new genres, from alt-rock to Afropop, hip hop to techno. Rock critic Robert Christgau's obsessive ear and authoritative pen have covered it all--over 3,800 albums graded and classified, from A+'s to his celebrated turkeys and duds. A rich appendix section ensures that nothing has been left out--from "Subjects for Further Research" to "Everything Rocks and Nothing Ever Dies." Christgau's Consumer Guide is essential reading and reference for any dedicated listener. Appendix How to Use These Appendices Subjects for Further Research Everything Rocks and Nothing Ever Dies Compilations'''
