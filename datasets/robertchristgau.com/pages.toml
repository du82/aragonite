["https://robertchristgau.com/xg/bn/2009-07.php"]
title = "Robert Christgau: Forty Years of History, Thirty Seconds of Joy"
full_description = '''His analysis of four recent love lyrics as encoded cries of social uncertainty and isolation--the kind of interpretive leap that leaves many popular culture scholars flat on their ass with a twisted ankle--isn't just convincing, it's wrenching. Just before midnight at Manhattan's Irving Plaza last November 8, two hours after the announced showtime for the Congolese soukous ensemble JB Mpiana & Wenge Musica BCBG, I listened along with as many as 80 smartly dressed Africans while a band comprising two guitars, two synthesizers, bass, congas, and trap drums was gradually augmented by six vocalists. Four of these were singers, two "animateurs," their job whipping up the crowd with shouted slogans and namechecks. All wore identical white T-shirts bearing the message "Peace Grows." Guitars purled, synths percussed, voices joined and split off--always melodic, always in pulsating motion. I was especially impressed by the sweet, piercing showpiece of a little guy sporting an overstuffed baseball cap and multiple eyebrow rings and by two singers who at around 1 a.m. climaxed the loosely synchronized choreography with competitive somersaults. Helluva show, except for one thing. Where was JB Mpiana? So the band vamped on as frontmen teasingly promised "the boss" until at last a light-skinned big man progressed out to the vacant center mike. No T-shirt for the boss--he wore a jacket with a JB Mpiana billboard on the back and brought along two female dancers, the plumper of whom chewed gum through the entire concert. Less than two minutes after Mpiana added his pretty, soaring vocals, the wonderful music entered some other realm--a serial climax I felt would never end and couldn't believe would last another 20 seconds. By my watch, it went on for 22 minutes, but the lull was so momentary that there was no appreciable pause, just a more relaxed ecstatic number that didn't subside for 25 more minutes, when finally, on my feet for over two hours, I wandered to the back of the somewhat fuller house and sat against a wall, even dozing briefly, only to arise circa 2:30, re-energized by a gently undulating sung chorus that continued for, say, seven minutes and culminated in fans affixing U.S. currency to the musicians' sweaty bodies. I was so entranced I didn't notice when Mpiana, who had stopped singing somewhere in there, left the stage. The guitarists kept rippling and the chorus kept harmonizing until the venue lowered a screen behind which the band wound down as the crowd strolled toward the exit. I assume the music ended. But I don't know when. Next day my legs ached.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bn/2009-07.php"
tags = ["forty", "history,", "seconds", "thirty", "years"]
language = "en"
