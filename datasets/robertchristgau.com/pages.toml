["https://robertchristgau.com/xg/bn/2010-04.php"]
title = "Robert Christgau: Pops as Pop"
full_description = '''Like millions of other Americans, I was fortunate enough to witness a Louis Armstrong show once, in the winter of 1959. A college freshman too young to have seen much live jazz, I strode home through the snow babbling happily about a concert where the only songs I recall recognizing were "Muskrat Ramble" and "Mack the Knife." Back at the dorm, however, a sophomore called me on my naivet�. Armstrong was corny, I was informed, and it must have sunk in, because the next time I listened seriously to Louis Armstrong was in 1975, when Gary Giddins got evangelical about the Smithsonian's canonizing Louis Armstrong and Earl Hines 1928. Giddins's work on Armstrong--particularly his gorgeous 1988 polemic Satchmo--initiated the phase of Armstrong appreciation that doesn't worry overmuch about corny. Inspired by Terry Teachout's Pops to dare an Armstrong piece of my own, I would ordinarily have peppered Gary with requests for context--I edited him for decades and we remain good friends. But recognizing that he has a horse in this race, I haven't phoned or emailed him since I got Teachout's book. Giddins can scarcely be ignored in what follows. But this one's on me. Since Satchmo is biographical criticism rather than a full biography, Pops will remain the definitive Armstrong bio until somebody tops it, which somebody should. Its major competitors, jazz specialist James Lincoln Collier's 1983 Louis Armstrong: An American Genius and popular historian Laurence Bergreen's 1997 Louis Armstrong: An Extravagant Life, have their uses. But Bergreen loves cheap color and doesn't have much to say about music, and while Collier can be good on the recordings he admires, he doesn't admire enough of them, cultivating a supercilious streak that's doubly unbecoming in such a flat-footed stylist. Both Collier and Bergreen devote the great bulk of their books to the pre-World War II period, though Armstrong lived from 1901 to 1971 and toured till the year he died. Like Gunther Schuller and many older jazz critics, and also like that sophomore, Collier finds so little "genius" in Armstrong's later music that these proportions make a kind of sense. But in Bergreen they're ludicrous unless he believes hanging with prostitutes and gangsters makes a musician more "extravagant" than dinners with royalty and audiences with the pope. Leaving ample room for Armstrong's impoverished New Orleans boyhood, Chicago and its Hot Five and Seven sessions, the thug-ridden compromises of the big-band '30s, and a long postwar career as an American icon leading the pared-down All-Stars, Teachout's 382-page text reaches 1938 with 150 pages to go because he truly respects Armstrong's life and artistic choices. "He was born poor, died rich, and never hurt anyone along the way," said Duke Ellington. "I know of no man for whom I had more admiration and respect," said Bing Crosby. No matter how drastically you believe Armstrong's music deteriorated, he deserves to be chronicled in toto.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bn/2010-04.php"
