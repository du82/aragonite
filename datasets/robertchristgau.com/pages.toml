["https://robertchristgau.com/xg/bn/2009-11.php"]
title = "Robert Christgau: Paisley's Progress"
full_description = '''Fifteen seconds of tune-up precede a partying rock riff that's corny even by Nashville standards. But it sure does rock, and soon it takes on virtuoso flourishes. Finally, 40 seconds in, there's a rather un-Nashville lyric: "She's got Brazilian leather boots on the pedal of her German car/Listenin' to the Beatles singin' 'Back in the U.S.S.R.'" Thus begins the lead and title cut of Brad Paisley's American Saturday Night. So optimistic it's intrepid and shameless at the same time, American Saturday Night rejects the anxious escapism and dark undercurrents of actually existing country, pop, and rock convention. As it strives to touch every human being in a nation Paisley knows is less unified and forward- looking than he pretends, the farthest it deviates from message is two breakup songs of uncommon tenderness and dignity. There's not a bum track on it--unless you're one of those sophisticates who's a priori nauseated by tunes more memorable than striking, lyrics that parse, pitch-corrected vocal harmonies, waveform compression, and strawberry ice cream. Serving up an enjoyably crafted, commercially successful album in the warm months of every odd year, Brad Paisley has tasted fine to me since 1999, when I admired how confidently he opened for Loretta Lynn at Town Hall. A 26-year-old newcomer riding a good little debut few in Manhattan knew existed, he seemed more at home than she did. But I never expected he'd headline Madison Square Garden a decade later. As happens in Nashville, the hits that kept on coming were soon indistinguishable from genre exercises. Beyond the funny stuff--great in "Me Neither," where he disavows a series of lame pickup lines as each is shot down, not so great in "Celebrity," where he lobs paintballs at a reality-show jerkola--what stood out most was his guitar, which got a showcase instrumental every time out. Genre exercises work fine in the country market as such, where "repository of tradition" is part of the job description. But the real America--right, I'm being arch, punch in "the typical American music consumer" if you like--expects forceful identities from its standard-bearers, and that goes double for dudes from the sticks.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bn/2009-11.php"
