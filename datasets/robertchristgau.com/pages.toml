["https://robertchristgau.com/bk-isitya.php"]
title = "Robert Christgau: Is It Still Good to Ya?"
full_description = '''Hardcover, [October 28] 2018, Duke University Press, 456 pages, $109.95. Paperback, [October 28] 2018, Duke University Press, 456 pages, $24.95. Is It Still Good to Ya? sums up the career of longtime Village Voice stalwart Robert Christgau, who for half a century has been America's most widely respected rock critic, honoring a music he argues is only more enduring because it's sometimes simple or silly. While compiling historical overviews going back to Dionysus and the gramophone along with artist analyses that range from Louis Armstrong to M.I.A., this definitive collection also explores pop's African roots, response to 9/11, and evolution from the teen music of the '50s to an art form compelled to confront mortality as its heroes pass on. A final section combines searching obituaries of David Bowie, Prince, and Leonard Cohen with awed farewells to Bob Marley and Ornette Coleman. "Christgau is the last true-blue record critic on earth. That's pretty much who I make my records for. He's like the last of that whole Lester Bangs generations of record reviewers, and I still heed his words." -- Ahmir Questlove Thompson "All these years later, Robert Christgau is not just rock criticism's "Dean," he's its most rabid defender and most withering internal vetter. His prose is still brilliant, offering as much pleasure, sentence by sentence, as anyone's. This book nearly always excited me, and the writing buoyed me along even when the ideas made me want to hurl it across the room. I'm glad I didn't: this is a book to be treasured." -- Jody Rosen "Robert Christgau is music writing's great omnivore, and his appetite hasn't diminished in the sixth and seventh decades of his life. The twenty-first century has been a tumultuous one in popular music and Christgau brings his gimlet-eyed wit, deep knowledge, and inimitable heart to this era with the same verve he had as a countercultural kid. Long may the Dean live; as this collection proves with ease, we still need him." -- Ann Powers'''
year_published = 2025
