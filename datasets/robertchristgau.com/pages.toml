["https://robertchristgau.com/todo/writings.php"]
title = "Robert Christgau: To Do: Writings"
full_description = '''Current standard for all writings is to provide the original publication name and year. CG columns also have month, since year alone doesn't adequately distinguish them. I would like to allow for greater precision, especially as we add articles to a bibliographic database. Each section has an index.php which automatically generates new listings as new pages are added. These have stubs for introductions and end matter, but these stubs are rarely used. In the longer term, we may wish to replace some/all of these indexes with custom indexes. The Consumer Guide columns are largely redundant to the CG database. They add a (generally brief) introduction, historical context, and (sometimes) additional consumer news. Because they are historical, the question arises whether to update the CG reviews when they are subsequently changed (thus far, in CG books). We've tended to do just that, and have added "[Original grade: . . . ]" where the grade has changed. But this has actually been done in very few cases. In updating, a special problem arises when the grade of a reviewed record is changed to a non-review grade (e.g., Kronos Quartet's Voices of Africa was downgraded from A- to . In these cases, I've kept the original review and added a "[Later grade: . . . ]" note. Note that the Addresses sections have been dropped. Not sure what the shelf life is on them, but chances are many are long gone. We could try to maintain address info (including URLs) in the label table, but we discussed this and decided not to try. The columns generally have a "Dud of the Month," which is set off under a sub-head. Should we also note "Pick Hit(s)"? (These are not noted in the WP sources for the columns.) Very few columns have titles. I think a title looks better, even if it is just "Christgau's Consumer Guide." Since the date is the major variation, should we include it at the top? We might want to design some sort of banner for these pages. The stock-generated index is especially lame here, even with the trick to force the sort order. A hand-crafted index.php may be in order. There should be some introduction text, possibly in index.php, and links to other sources. Also, there is an obvious chronological browsing order here, so next/previous links on each page would be very nice to have.'''
year_published = 2025
