["https://robertchristgau.com/xg/bk-aow/fool.php"]
title = "Robert Christgau: All My Friends Call Me a Fool"
full_description = '''Sometimes I feel silly carrying the torch for AM radio. Ultimately, I know this is a hopeless affair. The radio isn't ever going to be what I want it to be, which only proves that I care about the radio more than the radio cares about me. Or is it so simple? It hasn't always been this one-sided, after all, and we've had a lot of wonderful times together just because our aspirations are so divergent. No matter what those sophisticated-type songwriters say, unrequited love is not a bore. You learn all kinds of things. Like so much of the best popular culture, AM radio once attracted an audience diverse and open enough to encourage creative latitude but not so spread out that it could be covered only with a mass-cult leveler. This audience began to develop in the midfifties, when certain programmers decided that teen-agers, who consumed most popular music anyway, would consume it more enthusiastically if made to feel it was theirs by proprietary right--ergo, top-forty rock and roll. For a long time, however, the programmers couldn't bring themselves to abandon adults and grownupoids altogether, which together with the ups and downs of rock and roll itself meant that pop pap persisted. The Beatles hit just when the top-forty audience became identical to the rock and roll generation, clearing away the crap for a golden era that lasted roughly into 1966. Inevitably, the disintegration began. Some of the most acute rock and rollers banded with reprobate folkies and others to form what was then called the underground and has now broadened into the FM rock audience. As Beatlemania waned, ex-teen-agers went back to being grown-ups and demanded music to soothe their not-so-savage souls. The black audience became more self-conscious, its music less accessible to white listeners. Programmers discovered preteens. The result was AM radio that tried to provide a little schlock for everyone. Yet because it is so massively impersonal, AM can still give me a thrill. I guess it's the thrill of being a citizen. Tired of selecting my own music or afflicted with a busted changer, I put on some FM rock, but because it is programmed by members of my presumed subculture, I expect too much, so that I end up annoyed with its bland pretension rather than excited by some bold discovery or juxtaposition. But driving along with my ray-dee-oh, I discern a gem amid the dreck and wham on the volume--for the Marvellettes' "Playboy" or the latest Stones or some concoction from the music biz's vast left field. Suddenly I have made contact with the outside world. Thousands of people, most of them nothing like me, are listening to this song.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-aow/fool.php"
