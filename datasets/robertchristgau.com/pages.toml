["https://robertchristgau.com/u/cd/fiction/surviving-death.php"]
title = "Surviving Death (i)"
full_description = "My body had always been a disappointment to me, so its death early in 1997 should have come as no surprise. It did, though. It was only then that I fully understood a saying which had puzzled me throughout my life: the dead are always the last to know. Another thing you hear said about death is you cannot explain it, and this also is true. Death is very much like a bridge party, where cliches and tedious old sayings are as close as we get to the truth. You can't explain death. You may think--for instance, I was talking to Larry about this, in a session years before we died--how can something change so much so fast? I was right to wonder. Death is wonderful. It is certainly more absolute than birth. For instance, before birth you have a body. After death, you don't. At least I don't. I'm not certain that this is universally true of the dead. I see no bodies, but since, as far as I can tell, I have none myself, and that would include eyes, I am for all intents and purposes blind. So if other dead did have their bodies, I'd be the last to know. There are many things said about death, though, that are not true, and the main one is that the dead are dead. I know I'm not, and although I'm blind and have therefore seen no corroborating evidence, I can't believe an exception of that magnitude would be made in my case solely. Immortality may well not be universal, but it must be fairly common, unless I was somehow overlooked in some big sweep, but even so, when you think of how much life there has been throughout history, how likely is it that this would never have happened before? I used to think: death will be all right, I won't know I'm dead. I was completely wrong. I do know I'm dead. But I was right, too. It is all right. Tedious, though. I don't sleep, or eat, but I rest. I rest most of the time. It is hard to do anything else. And by the way, if you were thinking of killing yourself because life is hard, don't bother. Life is even harder when you're dead, though you have no expenses whatever and need not work, so there is that. Still, the simplest actions, rolling over for instance, are so difficult, you might as well be working in the salt mines. Obviously, I roll over as rarely as possible, but one does get stiff; and there are bedsores."
year_published = 2025
clearnet = "https://robertchristgau.com/u/cd/fiction/surviving-death.php"
