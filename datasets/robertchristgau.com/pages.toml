["https://robertchristgau.com/xg/bk-cg80/in_mgap.php"]
title = "Robert Christgau: CG 80s: Introduction: Music Gap"
full_description = '''Between 1980 and 1990, rock evolved drastically, meaningfully, essentially, and crucially--though not self-sufficiently--as music. Mere music. Most of the innovators ignored the melodic and harmonic details that fascinate trained music critics, and while art-rock types made their contributions, it was along the meld lines of punk-disco fusion that the most telling changes appeared. As quasi-organ keyb, the synthesizer, a plaything of dance wimps before arena bands and pop factories took it up, transformed the timbral identity of a music that's always been more about sound than notes--pop partisan Stephen Holden believes such archetypes as Boy George and Madonna even sing like synthesizers. And in the epochal sampler form, the synthesizer both epitomized and undermined rock's reduction to capital. On the dire side, studio schlockmeisters learned to construct full arrangements from taped libraries of licks and beats, so that musicians became extraneous even in "band" music, and some believe rappers and dance DIY-ers were even worse--that by sampling hooks whole from old hits and flops they cannibalized history, robbing the past of more than they could possibly give the future. I say their claim-jumps were righteous and past due. Rap sampling was postmodernism without the fuss, traditionalism giving traditionalists the finger. It was the people taking control of technology, joining a pop battle that began when rogue entrepreneurs discovered that Edison's phonograph wasn't a dictaphone. It won't be the whole future. But it's here to stay. And the synthesizer wasn't even the big story, because the '80s were a rhythm decade like no decade since the '50s--a decade of drummers as well as drum programmers, disco over the edge, funk grooves motorvating the most piddly PoMo and New Pop and CHR, B-boys and -girls who talked more musically than their churchified counterparts sang. It was the decade that appreciated Charlie Watts and made James Brown its Elvis. Maybe attitude was the secret of punk, maybe Tommy Ramone was; the secret of postpunk was rhythm, young drummers coming out of nowhere by the hundreds. Only it turned out they weren't good enough, for if anything was killing indie rock by decade's end, it was the death-rattle of the solid four and its fancier variants--or else the inability of its practitioners to come up with a message, attitude, chord change, or whatever as interesting as a decent dancebeat. Less slyly offhand than Paul Westerberg or Chuck Berry, the vain, nasty, prolix eloquence of street-rhyme tradition was something new in rock and roll, but to comprehend rap you had to parse its groove. Put the muscular funk of the Sugarhill Gang up against the herky-jerk hither-and-yon of De La Soul and you'll learn plenty about their respective lyrics--and more. And the information will be direct and accessible like Steely Dan's chords never were.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-cg80/in_mgap.php"
