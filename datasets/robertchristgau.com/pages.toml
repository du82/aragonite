["https://robertchristgau.com/xgausez.php"]
title = "Robert Christgau: Xgau Sez"
full_description = "These are questions submitted by readers, and answered by Robert Christgau. New ones will appear in batches every third Tuesday. Louis Armstrong and the Beatles in book form, 'Brat' but it's a lowish A but also still 'Brat,' Emmylou Harris and Wussy grades grubbed, and combating the evil which is going on. [Q] My wife Rachel is loving the Ricky Riccardi interview with Terry Gross and what she's learning about Louis Armstrong. I liked your thoughtful summary of the biographies. In your opinion has there been anything better than Teachout in the years since you wrote that? And thank you for everything you do. -- Aldan G. Wylde, Oakland [A] Armstrong being Armstrong, there probably has been, but that's not the kind of thing I keep track of. My big Terry Teachout-hooked piece was a lot of work and ended up one of the best things I ever wrote. Recently there was an Armstrong-inspired Broadway musical called A Wonderful World that I found accurate and admirable and thought-provoking as regards the strong women in his life should some version come your way. But do I want to read another Armstrong book? That depends. For sure the profusely illustrated Gary Giddins retrospective Satchmo: The Genius of Louis Armstrong is worth having around to look at as well as read. [Q] I hope you have not answered this before but what are the best books about the Beatles? -- Dave W, Swarthmore, Pennsylvania [A] Oddly enough, I haven't read that many Beatles books. But I'd be very surprised if there was a better one than Rob Sheffield's Dreaming the Beatles, which pays close attention to the female fans he argues were the band's too often neglected artistic secret. That said, Philip Norman's Shout: The Beatles in Their Generation was early and excellent, and Brian Epstein's very early A Cellarful of Noise, which I bought from a drugstore paperback rack circa 1966, is embedded deep in my heart. May Pang's strange and sometimes embarrassing Loving John has stuck with me, as has Norman's 2008 Lennon bio and for that matter The John Lennon Letters, which I found so engrossing I reviewed it. As I began by admitting, I'm no expert, and as you may have noticed I keep going back to JL. But I guarantee you'll get plenty from the Sheffield."
