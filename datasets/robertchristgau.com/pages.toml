["https://robertchristgau.com/xg/bb/berry-17.php"]
title = "Robert Christgau: Chuck Berry: 1926-2017"
full_description = '''"While no individual can be said to have invented rock and roll," hedged the Rock and Roll Hall of Fame upon inducting Chuck Berry into its 1986 freshman class along with Elvis Presley, Little Richard, Jerry Lee Lewis, Buddy Holly, Fats Domino and others--"Chuck Berry came the closest of any single figure to being the one who put all the essential pieces together." And of course the hedge was justified in many ways, among them Presley's preeminence and the equally momentous although not quite rock'n'roll innovations of classmates Ray Charles and James Brown. But now that the man has died--on March 18, unexpectedly, at 90--let's get real. Chuck Berry did in fact invent rock'n'roll. Of course similar musics would have sprung up without him. Elvis was Elvis before he'd ever heard of Chuck Berry. Charles' proto-soul vocals and Brown's everything-is-a-drum were innovations as profound as Berry's. Bo Diddley was a more accomplished guitarist. Doo-wop and New Orleans were moving right along. Et cetera. But none of those musics would have been as rich or seminal without him. After all, it was Chuck Berry who had the cultural ambition to sing as if the color of his skin wasn't a thing--mixing crystalline enunciation with a bad-boy timbre devoid of melisma and burr, he took aim at both the country fans he coveted and the white teenagers he saw coming. Nor did teen-targeted hits like "Rock and Roll Music," "Sweet Little Sixteen" and "School Day" merely play to the kids Elvis had transformed into the biz's next big market. With his instinct for the historical moment, alertness to the fads and folkways of his young fans, delight in an unprecedented American prosperity, matchless verbal facility and autobiographical recall, Berry played a major role in inventing teendom itself--in augmenting its self-awareness and turning it into a subculture. And crucially, he established rock'n'roll as a songwriter's medium. Some in his cohort wrote a fair amount, others barely at all. But it was Berry in particular who presaged Buddy Holly, the 1950s' second great-songwriter-cum-great-performer. Between them they established the artistic template of '60s rock, where self-written material was a prerequisite. And with the '60s in the mix, consider Chuck Berry's guitar.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bb/berry-17.php"
tags = ["berry", "chuck", "invented", "rock", "roll--and", "singer-songwriters.", "teenagers", "yes,"]
