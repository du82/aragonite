["https://robertchristgau.com/xg/bk-cg80/glossary.php"]
title = "Robert Christgau: CG 80s: Glossary"
full_description = '''Afrobeat: specifically, Fela's jazz- and rock-influenced extension of Nigerian highlife; sometimes used to point vaguely in the direction of all rockish African pop Amerindie: short for American independent, designating the network of "alternative" labels, clubs, stores, and radio outlets that developed in the U.S. postpunk AOR: album-oriented rock, the culturally conservative, arena-rock-oriented radio format that happened to the "progressive" FM of the '60s after radio formatters got hold of it b.p.m.: beats per minute, a measure of decisive significance to dance DJs since the rationalization of disco in the middle '70s B-boy: the quintessential rap fan; though it originally designated a teenager adhering to a New York street style of sweatshirts and unlaced sneakers, it's now used to categorize any young black male thought to be of juvenile-delinquent mien CHR: Contemporary Hits Radio, a face-saving moniker devised for top 40 after top 40 was declared dead by radio savants countrypolitan: early Nashville crossover concept, usually distinguished by genteel diction, nonspecific subject matter, hosts of glee clubs, and lotsa strings crossover: originally devised to describe movement from the black charts to the pop charts, it now designates any record that gets its start in a specialized market and then goes pop DOR: dance-oriented rock, a euphemistic acronym concocted to signify a nonlovydovy disco-punk fusion--disco white bohemians would dance to dub: in reggae, a spare, spacy "version"; essentially a new piece of music derived from a few selected elements--bass lines, keyboard fragments, vocal phrases--of the original forcebeat: John Piccarella coinage designating the ideal punk rhythm, which might be described as a flat four-four that moves faster than your body thinks it should go go: D.C.-based funk-r&b fusion characterized by an unusually swinging dance rhythm and, sometimes, rap or rap-influenced vocals harmolodic: Ornette Coleman's name for his musical theory; some believe even he doesn't understand it; many believe they recognize it when they hear it regardless'''
year_published = 2025
