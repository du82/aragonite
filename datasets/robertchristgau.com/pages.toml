["https://robertchristgau.com/xg/bn/2011-09.php"]
title = "Robert Christgau: Brag Like That"
full_description = '''In August appeared two albums that qualified as blockbusters by the meager measure of our era. That both were hip-hop was unsurprising--half the blockbusters these days are--and that the rappers involved were very prominent could hardly be a secret. But what struck me was a rarer confluence of events: a moment when commercial and critical anticipation ran parallel. Not only are Jay-Z, Kanye West, and Lil Wayne bestsellers of the first magnitude, they are also major artists-as-artists. In rock, only U2 and Radiohead enjoyed comparable status in the '00s, and even they didn't quite match up--artistically in U2's case, commercially in Radiohead's. Unfortunately, this new world order was sunk forthwith by Lil Wayne. Tha Carter IV eked out a sales victory over Jay-Z and Kanye West's Watch the Throne, and has its moments, as does the Sorry 4 the Wait mixtape that prepared its way, but its stunted sense of play is summed up by the T-Pain-aided "How to Hate." In contrast, Watch the Throne rules. Not that the raves are unanimous, or that the collaboration between the premier rapper of his generation and his most gifted prot�g� quite matches the solo albums that led up to it. But from the first minute of "No Church in the Wild"--rolling bass over strong, simple drumbeat to stealth-thematic hook and starter rap, with organ enlarging a sound whose size is imposing from bar one--its musical command is startling. "No Church in the Wild" stitches doomy old Spooky Tooth, artier-than-Bryan-Ferry Phil Manzanera, and an expostulation from a neglected James Brown classic into an anthem that doesn't so much crush everything in its path as gather it up. Before you begin to think what it means, it tells you what it is. Its pop grandeur will not be denied by any better album 2011 puts before us. That grandeur is owned by West, who had production input on 12 of 16 tracks. It's a funkier and less ornate variant of the prog-rap of 2010's acclaimed My Beautiful Dark Twisted Fantasy, where West rescued his faltering music from his staggering celebrity. But that doesn't make this West's record. It moves too good, and that has become Jay's way. He's always been the defter rapper rhythmically; the most prominent outside producer is his old standby Swizz Beatz; and though he made his own Euro moves on 2009's The Blueprint 3, which showed haters who could count--sales, years, their fingers and toes--that 40 was the new 30, they were aimed directly at the dancefloor. So with all that established, what does this shared show of pop power mean?'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bn/2011-09.php"
