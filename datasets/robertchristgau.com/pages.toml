["https://robertchristgau.com/xg/bk-cg70/further.php"]
title = "Robert Christgau: CG 70s: Subjects for Further Research"
full_description = '''Kevin Ayers: With his bananas and borrowed pataphysics, Ayers has always been an oddball's oddball, and his best-regarded work has never been released here. At the proper time, whateverhesingsillreview. David Bromberg: He's certainly overrated by his cult--what cult artist isn't?--but I think rock and rollers are too hard on him. You have to give some credit to a Jewish boy with glasses who makes his living doing Blind Willie McTell imitations and then begins a song: "When I got up this morning I had Someone Else's Blues." Can: Next to Henry Cow, this durable (and variable) German contingent is art-rock's most genuinely avant-garde band, adapting Stockhausen and Coleman to rock rhythms and sonorities in a way that is usually interesting if rarely (in my experience) compelling. All this and their own studio in Cologne without touching the American market or gaining any reliable American distribution. The almighty Deutschmark. Bruce Cockburn: This born-again Episcopalian (he's the type who appreciates oxymorons) is genuinely literate as well as genuinely musical. But I've been boycotting poetic types who admire the Church of England ever since escaping John Crowe Ransom as an undergraduate. Nick Drake: I'm not inclined to revere suicides. But Drake's jazzy folk-pop is admired by a lot of people who have no use for Kenny Rankin, and I prefer to leave open the possibility that he's yet another English mystic (romantic?) I'm too set in my ways to hear. John Fahey: Fahey is immersed in country blues, from which he derives his own unique guitar music--eerie, funny, stately, and incredibly calm. The best tranquilizing music I know, because instead of palming off a fantasy of sodden deliverance it seems to speak of real reserves of self-control inside the American psyche. That said, I'll add that tranquilizing music has never been a priority of mine. The only one of the albums on his own Takoma label I listen to is the first, The Legend of Blind Joe Death. My real favorites are Of Rivers and Religion and After the Ball--both orchestrated, both long out of print on Reprise. Avoid the Vanguard stuff, which tends to wander--and boy, can he wander.'''
year_published = 2025
