title = "Robert Christgau: CG 70s: Credits"
full_description = "This book is based on Consumer Guides and other pieces written for The Village Voice between July 1969 and March 1972, and between September 1974 and January 1981, and on capsule reviews and other pieces written for Newsday between April 1972 and August 1974. Creem compiled my Newsday work into a Consumer Guide of its own, reprints the Voice Consumer Guide, and collected some of the reviews written especially for this book into Consumer Guides which it published in 1980 and 1981. Most of the reviews from the first six years of the decade have been substantially revised or written entirely for this volume, and the same is true of many from the remaining four. Citing the source of each of almost three thousand reviews would obviously be impossibly unwieldy, but I would like to gratefully acknowledge permission from the Voice, Newsday, and Creem to reprint material that first appeared in their pages. Copyright 1970, 1971, 1972, 1974, 1975, 1976, 1977, 1978, The Village Voice, Inc.; copyright 1978, 1979, 1980, 1981 News Group Publications, Inc.; copyright 1972, 1973, 1974, Newsday, Inc.; copyright 1980, 1981 Creem magazine."
