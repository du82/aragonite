["https://robertchristgau.com/xg/dontstop/doyle-24.php"]
title = "Robert Christgau: Behind Closed Doors"
description = "Roddy Doyle, The Women Behind the Door"
full_description = '''This was originally published as free content, in Robert Christgau's And It Don't Stop newsletter. You can have Christgau's posts delivered to your mailbox if you subscribe. Having reviewed two of Dubliner Roddy Doyle's novels—The Commitments for the Voice in 1989 and The Woman Who Walked Into Doors for Spin in 1996, the latter of which I packed into my Book Reports collection—I was delighted to get his just-published The Women Behind the Door in the mail. But soon I was surprised to turn to its "By the Same Author" page and find 20 titles unfamiliar to me listed under "Fiction," three under "Non-Fiction," and eight more under "For Children"—and then even more surprised to poke around in my own records and learn that by 2006 I'd downed seven more Doyle novels, some of which I kind of recalled and some of which, obviously, I didn't. The last of these was 2006's Paula Spencer, the name of both the woman who walked into doors and now of one the women behind the door as well. As I trust most readers have intuited, this walking into doors thing is supposed to function as transparent code for spousal abuse. It's how Paula and her husband Charlo explained the bruises and worse he left on her body until she finally brained him with the frying pan his mother had given her—a suitable preamble to Charlo's imminent death, shot down by the police during one of the robberies with which he supported himself and his family, though they were always augmented and once he was dead replaced by Paula's long hours as a charwoman. But by the time of this new novel she's 66 and leading a rather different life—her alcoholism under control, her her oldest and most successful daughter Nicola paired off with a much better man than Charlo, and her older son John Paul, once a heroin addict, now sober, though her favorite son Jack, now teaching college in Chicago, keeps his distance emotionally as well as physically. She has a moderately classy longtime boyfriend who enjoys how smart she is and a job she likes in a dry cleaning store via one of the claque of girlfriends she's gathered around her, all of whom giggle through the rigmarole of getting vaxxed for Covid as the novel begins.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/dontstop/doyle-24.php"
