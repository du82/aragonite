["https://robertchristgau.com/xg/bk-aow/dead.php"]
title = "Robert Christgau: Dead Heads Pay Their Dues"
full_description = "A Grateful Dead concert at the Felt Forum is postflower America reveling in its contradictions, but Dominique was reminded of the Soviet Union, where the queue has not withered away, and elbowing ahead of your comrades is a national pastime. As we pushed on in toward our complimentary third-row seats, the crowd got heavier, and so did the contradictions. The cross section of Dead heads--heavy music proles and suburban folkies and old rock and rollers--is a confusing combination of our fabled new community and the nightmare mob of Ortega y Gasset. Half the audience avoids the crush, but the remainder presses forward, packing the aisles and the front rows, and everyone is up and boogieing. To boogie, you just stand and move to the music, relating to your brothers and sisters no matter how stoned you are because your brothers and sisters are sweating and boogieing on all sides. It isn't a dance, and not just because there isn't room at a concert--even in seatless halls the floor is always tight up front. Folks do dance with each other in back, but for most the exhilaration of the boogie increases exponentially with the proximity of the musicians, and if Jerry beams his cosmic grin down at someone, he/she will not shriek like a twelve-year-old chickie at the TAMI Show but just boogie harder. The dismay of the mass-culture theorists and their politely raised offspring is understandable--too many people in too little space, all competing to get to the fore of the hero-worshiping swarm, ignoring the hard-earned wisdom of the fire laws and damaging property that they and their sibling consumers will pay for in the end. Many of the boogiers are usurpers who buy cheap seats and confidently move up or just sneak in to begin with. Despite the love-and-community rhetoric and sacramental joint-passing, the boogiers do discriminate against the weak and the short and the timid--a few always pass out, many more get sick, and eventually someone will die--and a boogieing biker is almost as likely to knock your head off at a Dead concert as anywhere else. Yet when we finally reached our seats, we had no trouble claiming them, and the wallet and cigarettes that Dominique had unknowingly dropped at the other end of the row were passed down a minute later. A girl standing in front of us started to bum out but revived when an orange miraculously materialized. Regulars greeted other regulars, remembered from previous boogies, and compared this event with a downer in Boston or a fabulous night in Arizona."
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-aow/dead.php"
