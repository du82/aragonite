["https://robertchristgau.com/xg/bk-aow/bfart.php"]
title = "Robert Christgau: Capt. B. Fart"
full_description = '''It was Wednesday night, before the good captain had wearied of the Bitter End West, but you still couldn't understand what the fuck he was saying. Fantastic, yes, he was fantastic, but . . . He came out wearing his Trout Mask Replica hat, which is shaped like . . . which is shaped like a standard topper with a sand pail upside down on top of it, if you really want to know, except that it's all the same black cloth hat and there is a shuttlecock which might be taken for the tip of a duckpin or the end of a plastic penis on top of that. Dutch-looking, that hat, though perhaps it only seems so because you know the captain's other name is Van Vliet. The rest of his appearance is less extraordinary. His stage demeanor is friendly but preoccupied; at odd moments, he smiles. He is fat, but not rotund and robust like Mama Cass or Bob Hite, more like Jim Morrison during those periods when he will permit no photographs, pallid and jowly. This would seem to support the popular suspicion that the captain is tripped out or strung out or doing one of those vegetable imitations for which heroes of the underground are so notorious, except that (according to an adulatory but credible cover story by Langdon Winner in Rolling Stone) he eschews all inebriants. In short, Captain Beefheart is a somewhat confusing figure, but he is oh so definitely weird. He has gigged perhaps thirty times since convening his Magic Band in 1964. Those performances are legendary. Lately, he has acquired a new manager; his engagement at the Bitter End West was his third billing around Los Angeles this fall. Beefheart's association with Frank Zappa, a teenage chum who controls his present record company, has inspired an unfortunate tendency to put him on the Bizarre Freek List--Wild Man Fischer, Alice Cooper, the GTOs, Captain Beefheart. But not only is Beefheart more profoundly interesting than any of Zappa's permanent floating seminars in the psychoses of late capitalism, he is also, I think, a lot more interesting (and certainly more likable) than Zappa himself. Zappa receives rather uncritical approval from most of the "serious" rock audience, especially that portion which maintains loyalties to jazz or traditional music. This is mostly because his expert image manipulation has everybody buffaloed: it isn't the products of his apparent musical sophistication that attract his fans so much as the way he has sold the idea.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-aow/bfart.php"
