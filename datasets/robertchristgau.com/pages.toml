["https://robertchristgau.com/xg/bn/2011-05.php"]
title = "Robert Christgau: Sister Oh Sister"
full_description = '''Released in 1976 and 1977, with the marginal movements of punk and disco revolutionizing popular music, Kate and Anna McGarrigle's Kate & Anna McGarrigle and Dancer With Bruised Knees are cult records. The McGarrigles were folkies who will never become iconic the way the Ramones and Saturday Night Fever soon did. But neither were they obscure: when Kate died of cancer early last year, the tributes flooded in like she was Marlene Dietrich. It helped that Kate's son with Loudon Wainwright III, Rufus Wainwright, is more renowned than either of his parents. It also helped that the McGarrigles hailed from Canada, which promotes its artists like the national assets they are. But the main reason is the two albums themselves. Cult records they are. Classics they also are. Though the McGarrigles ended up recording less music than I'd hoped in 1976, there's enough, and most of it will endure. But the first two albums are indelible--since 1980, I've revisited them more often than any of my punk-era faves except maybe Rocket to Russia. In part it's the material, in part something subtler, as came clear when I somewhat apprehensively test-played the bonus disc of Tell My Sister, Nonesuch's handsome, economical reissue of the two classics. Only Dylanologists and smitten fanboys need the detritus that fills most bonus discs. But that wasn't how this one felt even though half of its 21 songs were also available on the two accompanying albums--in what must be, given how I've been raving, definitive interpretations. I appreciated the previously unheard material, especially a lost masterpiece about the almost carefree pleasures of a hippie summer called "Saratoga Summer Song." But mostly the bonus disc succeeds for the same reasons I'm always introjecting these records into my musically oversaturated home life. I've called the McGarrigles folkies, a mildly belittling characterization that seems fairer than ever now that I've read the Dane Lanken coffee-table book Kate and Anna McGarrigle: Songs and Stories, which I liked so much that my wife bought me one for my birthday. But as is invariably pointed out, Kate and Anna were domestic folkies. They made piano-and-accordion music not guitar music, parlor music not campfire music, stay-at-home music not on-the-road music; rather than pretty or gorgeous or powerful, their voices were just beautiful, in a proudly plain way. Products of a household where everybody sang, they meshed perfectly with the give-and-take sociability of chopping vegetables and reading in bed.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bn/2011-05.php"
tags = ["sister"]
