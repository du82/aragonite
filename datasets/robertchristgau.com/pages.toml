["https://robertchristgau.com/xg/bn/2010-03.php"]
title = "Robert Christgau: The Triumph of the Id"
full_description = '''With his first prison bid set to launch simultaneously with his first official album since Tha Carter III, it seemed an excellent time to ponder Lil Wayne. Only then, Wayne's year on Rikers Island was delayed so the rapper could, well, go to the dentist. Some speculated that Wayne has so much bling in his mouth he was removing it for safekeeping, while jayhovawitness at the Rap Radar site snapped, "Hell, I know niggas that go to jail just to get their teeth fixed." Soon another Rap Radar comedian took care of the new, rock-styled Rebirth: "Judge: Cancel the release of 'Rebirth' and we'll let you free. Wayne: OK." On February 16, however, Wayne was subjected to eight root canals along with repairs on several implants and scattered remaining original teeth, not to mention many hits of nitrous oxide or something stronger. And on March 8, Dwayne Carter did in fact go to jail, allaying suspicions that he and his new grill might ascend into heaven instead. Even for admirers, there's a temptation to make light of Lil Wayne's legal problems. The code of the streets whence hip-hop supposedly springs defines prison as part of the life, and many rappers--including Slick Rick, Shyne, Mystikal, and most recently and prominently T.I.--have already been incarcerated. True, the others perpetrated crimes of violence where Lil Wayne went down on gun possession solely. But we Second Amendment relativists support gun laws, and seldom approve when rich guys walk even if they have undergone undue police scrutiny. And though we may not place much credence in the crime tales that once dominated Lil Wayne's repertoire, we sure don't believe he lives within the law. Prison? You could say he was asking for it. But you also could say his disregard for the law is what we admire him for. Being a Lil Wayne fan renders you complicit not just in his musical and verbal compulsions but in the lifestyle of an unpackable, untrackable workaholic hedonist. Scarfing beats, slurping rhymes, verbalizing desires as boundless as language itself like they're a joke he's sharing with his crew as they all play an ESPN videogame, Lil Wayne puts so much id into his labors he could make any cop nervous--in fact, any functioning adult. The ultimate locus of our complicity is our own infantile urges.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bn/2010-03.php"
tags = ["triumph"]
language = "en"
internal-references = ["none"]
