["https://robertchristgau.com/xg/dontstop/wedding-24.php"]
title = "Robert Christgau: The Big Lookback: You Never Can Tell"
full_description = '''This was originally published as free content, in Robert Christgau's And It Don't Stop newsletter. You can have Christgau's posts delivered to your mailbox if you subscribe. On December 21, I will have been married to the great Carola Dibbell and she to mere me for exactly 50 years. That might not be the legal date, because at the behest of my by now long gone and deeply lamented Dartmouth pal Bruce Ennis, an attorney with the New York Civil Liberties Union before he moved on to the ACLU, we were refused legal matrimony by a New York City Clerk who refused to put his seal of approval on any woman wearing pants like those of the gray velvet suit Carola bought to go with my blue velvet one. So instead we were legally wed by a judge in chambers and then on the 21st in the one that really counted: our rewrite of the traditional vows read by four married couples—two sets of parents, our Dibbell in-laws Joy and Larry Harvey, and my Dartmouth roommate George Szanto and his wife Kit. The site was the brownstone Greenwich Village co-op where Carola grew up, where Larry still resides, and where Joy passed away on August 30 of last year. The night before the main event, however, we gave a mostly-Voicers party in my painter friend Bob Stanley's Crosby Street loft. It was several months before I got around to pondering what it was like for us to put together music for that party on what I recall as two reel-to-reel tapes I have so far failed to locate—a disappointment so bitter I didn't see the point of rerunning the Voice piece that eventuated. That is, until Carola wracked her magic memory briefly and came up some titles: the Rolling Stones' "Let's Spend the Night Together," Dusty Springfield's "Just a Little Lovin'," Bonnie Raitt's "Good Enough," Dionne Warwick's "Don't Make Me Over," Ella and Louis's "I'm Puttin' All My Eggs in One Basket," Stevie Wonder's "Contract on Love," Sly Stone's "Family Affair," the Dixie Cups' "Chapel of Love," Buddy Holly's "Peggy Sue Got Married," John Lennon's "Oh Yoko," and Thelonious Monk's "Tea for Two."'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/dontstop/wedding-24.php"
