["https://robertchristgau.com/xg/bk-fest/frith.php"]
title = "Robert Christgau: An Essay on Criticism"
full_description = '''In his introduction to Grown Up All Wrong, Robert Christgau describes his return to New York from California in 1972 and the launch of his career as a full-time rock writer. "I was out of academia," he writes. "And glad enough of it." I started my life as a full-time academic the same year, and Christgau's throwaway satisfaction here is to me disingenuous. Christgau has been, after all, happy to be billed as the Dean (I think he first claimed the title--"the Dean of the Long Island Rock Critics"--in Newsday in 1972), and in the very first line of Grown Up All Wrong he takes care to remind us that he was once a professor. The account of his life as a rock critic which follows is different from the account which kicks off his 1973 collection, Any Old Way You Choose It if only because in 1998 he is making sense of a critical life that in 1977 was still being sketched out. "I want to do other things in the world than write rock criticism," he had written in Any Old Way You Choose It. Grown Up All Wrong explains why he didn't need to, and in this can only be understood as a conversation with the academic he might have been. Given what rock criticism has since become, this may not be surprising. We are well used now to academics who dabble in rock criticism and rock critics who dabble in the academy. There are schools of rock criticism which are clearly "academic," even if written by journalists with no academic credentials at all, and classes in rock criticism taught by instructors who have never written a critical line in their lives. But only Christgau has had the determination--and the brains and the spirit--to take the academy on directly. Why bother? Most critics still have no interest in academic work at all; most academics know that scholarly work on popular culture, particularly theoretical work (the kind Christgau finds interesting) is a matter for journalistic derision. Christgau writes that he was temperamentally suited to be a journalist, a "wordslinger for hire in a world half bohemia and half media." But this doesn't explain his ongoing interest in the academy and is, anyway, misleading. Christgau is not a bohemian as a matter of fact--his life as loving husband and father is crucial for his critical persona--nor as a writer. He lacks the narcissistic mischief making and sheer self pity of a Richard Meltzer or, come to that, Lester Bangs.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-fest/frith.php"
