["https://robertchristgau.com/xg/bk-cg80/in_canons.php"]
title = "Robert Christgau: CG 80s: Introduction: Canons and Listening Lists"
full_description = "In the A lists way in back you will find representatives of all the aforementioned strains and others besides, listed by year in an order of preference as exact as fond memory and available replay time could make it. If you've read this far, I hope you've managed to infer the sensibility if not exactly the criteria that went into those lists. But it's only polite to try to lay it out. I am a rock-and-roller--my attraction to 90 per cent of the pop and semipop I like was set in motion by Chuck Berry thirty-five years ago. So I go for a lyric that says something, with some wit would be nice. And I like a good beat. (Next time you play Chuck Berry, who isn't ordinarily regarded as the rhythmic equal of Jerry Lee Lewis or Panama Francis, concentrate on his beat for a while. He smokes.) Overproduction having rendered these cultural commodities too easy to come by, my standards have been sharpened. Unlike the change addicts of indieland, I've been in the game long enough to know the difference between novel and new, and I'm not such a knee-jerk progressive that I believe new is always better. But I'm obviously not a golden-ager, either. There was popular music in the '50s and '60s and now the '70s (as well as the '20s and '30s and '40s) that retains an irreducible and unduplicatable magic. But anybody who thinks that kind of magic disappeared in the '80s understands neither history nor Parliament-Funkadelic. (The Sex Pistols, maybe. Not the Ramones.) In case it needs saying, I am who I am: a white male born into the Queens lower-middle class in 1942, my left politics and B.A. in English chosen rather than thrust upon me. Except to note that my daughter's tastes in entertainment cut into my listening time, I admit to no hardening of the tympanum. Sure I enjoy special rapport with my contemporaries, but I also know when they're full of shit, which is usually. In fact, I'd argue that twenty-year-olds have a harder time recognizing a mediocre Lou Reed record than I have recognizing a mediocre Replacements record. Youth comes with the musical territory, and by now my eternal attraction to the theme is so disinterested that all youth music partakes of sociology and the field report. To me, Thelonious Monster, Michelle Shocked, L.L. Cool J, and the Pet Shop Boys are all kids working out their identities, and in each case I get off tuning in."
year_published = 2025
