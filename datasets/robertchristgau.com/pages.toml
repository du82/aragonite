["https://robertchristgau.com/bk-bkreps.php"]
title = "Robert Christgau: Book Reports"
full_description = '''Hardcover, [May 3] 2019, Duke University Press, 416 pages, $104.95. Paperback, [May 3] 2019, Duke University Press, 416 pages, $28.95, ISBN 978-1-4780-0030-3. In this generous collection of book reviews and literary essays, legendary Village Voice rock critic Robert Christgau showcases the passion that made him a critic--his love for the written word. Many selections address music, from blackface minstrelsy to punk and hip-hop, artists from Lead Belly to Patti Smith, and fellow critics from Ellen Willis and Lester Bangs to Nelson George and Jessica Hopper. But Book Reports also teases out the popular in the Bible and 1984 as well as pornography and science fiction, and analyzes at length the cultural theory of Raymond Williams, the detective novels of Walter Mosley, the history of bohemia, and the 2008 financial crisis. It establishes Christgau as not just the Dean of American Rock Critics, but one of America's most insightful cultural critics as well. "[A] substantial collection of nearly 100 eclectic, thought-provoking, and idea-laden book reviews. . . . [Christgau's] range of topics is impressive, and his references are prolific. These sprightly, highly opinionated 'adventures of an autodidact' reveal Christgau to be a highly literate, astute, and discerning book critic." -- Kirkus Reviews "Christgau mostly writes on books by or about notable musicians, though he hits other cultural touchstones too, such as George Orwell's 1984. It's in these nonmusic pieces that Christgau is most successful, shifting focus from his encyclopedic music-industry knowledge to the nuances of language. His essay on books about the 2008 financial crisis is a highlight." -- Publishers Weekly "There are few critics working today with the life-long commitment, focus, and curiosity of Robert Christgau. Book Reports doesn't scan the over half-century of the man's work, and that's what makes it all the more impressive. He's still searching, still pulling volumes from the shelves, looking at new or old ideas, cracking open the spines of preconceived notions all in the service of taking just one more look before walking away with the promise of yet another return." -- Christopher John Stephens, Popmatters'''
year_published = 2025
clearnet = "https://robertchristgau.com/bk-bkreps.php"
