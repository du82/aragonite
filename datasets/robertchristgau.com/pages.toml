["https://robertchristgau.com/xg/bk-fest/miles.php"]
title = "Robert Christgau: Consumer Guide to Consumer Guides"
full_description = '''A couple of these Consumer Guide entries alterted my ears to styles of music that nourish me to this day. A couple others, more important, helped me understand my perceptions, articulated what my art passions meant about myself. As a personal Greatest Hits, this commentary is neither intensive nor haphazard. A measure of the source material's richness is that I feel if I just went through the '70s, '80s and '90s Consumer Guide collections one more time, I'd find my lost supreme favorite. Some are treasured examples of journalistic concision. Some are definitive summaries of albums, eras and artists. Some are small joys that glisten every time I pick them up. Many don't appear because I ran out of space and time. Africa Dances (Authentic '73). What The Harder They Come does for reggae, this sampler attempts to do for the American-influenced urban music of Africa. Its scope is necessarily broad, but only once does an alien-sounding rhythm (Arabic tarabu) interfere with its remarkable listenability. The mood might be described as folk music with brass, for although the horn techniques are familiar from big-band jazz, r&b, and especially salsa, the overall effect is much less biting than that would imply. There's something penetratingly decent, humorous and even civil about this music, as if the equanimity of tribal cultures at peace at least with themselves has not yet been overwhelmed by media-nourished cross-cultural complexities. If this is my misapprehension, perhaps it is reinforced by the fact that the lyrics aren't in English, although I don't get anything similar from salsa. Anyway, a find. A Jackson Browne: The Pretender (Asylum, '76). This is an impressive record, but a lot of the time I hate it: my grade is an average, not a judgment. Clearly Jon Landau has gotten more out of Browne's voice than anyone knew was there, and the production jolts Ol' Brown Eyes out of his languor again and again. But languor is Browne's best mask, and what's underneath isn't always so impressive. The shallowness of his kitschy doom-saying and sentimental sexism is well-known, but I'm disappointed as well in his depth of craft. How can apparently literate people mistake a received metaphor like "sleep's dark and silent gate" for interesting poetry of gush over a versifier capable of such rhyming-dictionary pairings as "pretender" and "ice cream vendor" (the colloquial term, JB, is "ice cream man")? Similar shortcomings flaw the production itself--the low-register horns on "Daddy's Tune" complement its somber undertone perfectly, but when the high blare kicks in at the end the song degenerates into a Honda commercial. Indeed, at times I've wondered whether some of this isn't intended as parody, but a sense of humor has never been one of Browne's virtues. B'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-fest/miles.php"
