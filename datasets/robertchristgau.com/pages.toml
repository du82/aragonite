["https://robertchristgau.com/bk-guaw.php"]
title = "Robert Christgau: Grown Up All Wrong"
full_description = '''Paperback, 2000, Harvard University Press, 528 pages. Hardcover, 1998, Harvard University Press, 528 pages. From publisher's catalog page: A critical compendium of points of interest in American popular music and its far-flung diaspora, this book ranges from the 1950s singer-songwriter tradition through hip-hop, alternative, and beyond. With unfailing style and grace, Christgau negotiates the straits of great music and thorny politics, as in the cases of Public Enemy, blackface artist Emmett Miller, KRS-One, the Beastie Boys, and Lynyrd Skynyrd. He illuminates legends from pop music and the beginnings of rock and roll--George Gershwin, Nat King Cole, B. B. King, Chuck Berry, and Elvis Presley--and looks at the subtle transition to just plain "rock" in the music of Janis Joplin, the Rolling Stones, Eric Clapton, Aretha Franklin, James Brown, and others. He praises the endless vitality of Al Green, George Clinton, and Neil Young. And from the Rolling Stones to Sonic Youth to Nirvana, from Bette Midler to Michael Jackson to DJ Shadow, he shows how money calls the tune in careers that aren't necessarily compromised by their intercourse with commerce. Where "Rock and Roll" Began Across the Great Divide: Nat King Cole Let's Call the Whole Thing Pop: George Gershwin The Complete Work of B. B. King The Blank Slate: George Jones Black Face, Whose Voice? Emmett Miller Brown Eyed Handsome Rock and Roller: Chuck Berry Elvis in Literature: Elvis Presley Where "Rock" Began Spontaneity by the Seat of the Pants: Janis Joplin Our First Bohemians: The Rolling Stones God Grows Up: Eric Clapton Genius Dumb: Led Zeppelin Jimi Plays History: Jimi Hendrix Out of This World: Aretha Franklin Nothing To Say but Everything, or, As Far as He Could Go: John Lennon with John Piccarella Why the Beatles Broke Up James Brown's Great Expectations Snatched from the Maw of Commerce Stevie Wonder Is All Things to All People A Boogie Band that Loves the Governor (Boo Boo Boo): Lynyrd Skynyrd Turn On, Drop In, Find Out: The Grateful Dead Music for Smart People: Randy Newman Time Waits for No One: Richard Thompson Father Alone Farther Along: Loudon Wainwright III Born to Be Mature: Bonnie Raitt Two Rock and Rollers Who Won't Change the World: Pete Fowler & Andy Fairweather Low'''
