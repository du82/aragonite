["https://robertchristgau.com/xg/bk-fest/smith.php"]
title = "Robert Christgau: The Talk"
full_description = 'Me and a car full of wingnuts drove in from Detroit one late-�70s winter break. "Blitzkrieg Bop" was playing on WPIX as we came through the Holland Tunnel. Lester Bangs� band was on the bill at Max�s. Joey, Lester, downtown, a lot of stuff from then seems a million miles away right now, but not the guy I dropped in on out of the blue. I just walked in the door, told the receptionist I always wanted to meet him, and Bob Christgau gave me his time. He showed me a manuscript that had come in over the transom from another young writer--Barry Michael Cooper, as it happens--and whatever else we talked about, mostly what I remember is that this guy who had never met me before was sitting there talking about craft and the Stones and how he liked to work with new writers. He wouldn�t stop talking, and I was glad. Just one more life he was changing. A few years later I wrote Bob, inquiring about work. I was moving from Buffalo, and he said to give him a call when I arrived. An appointment was set up. Here is how the interview went: I drove down in a snowstorm, and the car was totaled when a bus skidded sideways on ice and plowed into it. I called from around Rochester, saying I needed to reschedule. I started to explain why but Bob said it was just as well because he and Carola were trying to procreate, and the fertility doctors had told him that the moment of our interview would be the optimal time for sex, but the problem was that they were having difficulty getting along at that moment, and the sex was getting complicated so the dilemma was�. This was a guy I had met once, and I was being pulled into some kind of verbal-psychological construct I don�t recall existing in my corner of the Midwest. I was way over my head, and I couldn�t believe my good fortune. Here is how our first edit went: "You�re full of shit, RJ," Bob boomed. I think I saw Richard Goldstein�s dome swivel and gape in my direction. "I want you to know you�re full of shit. I�m going to print this, but I want you to know . . . ." It was the first review I wrote for him. I freaked. The truth was, I had written something I hoped would piss him off/get his attention. He�d just minutes before introduced me to The Walk--where he would take your just-handed-in manuscript and without saying a word, V-2 out of his chair, tear off pacing around the Voice office as he read. Was I supposed to follow him somewhere?'
year_published = 2025
