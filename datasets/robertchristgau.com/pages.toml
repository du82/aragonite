["https://robertchristgau.com/xg/bkrev/nirvana-ny.php"]
title = "Robert Christgau: Nevermore: Nirvana"
full_description = '''The recorded legacy of Nirvana is ungodly small--three studio albums, the first of which cost six hundred and six dollars and seventeen cents to make, plus one miscellany and two posthumously released live CDs. Given the exploitations that might well have ensued after Kurt Cobain killed himself in April of 1994, we should be grateful that the band's catalogue hasn't been stuffed with one of those four-CD boxes of redundant concert tapes that now diminish Jimi Hendrix, the Monkees, and the Doors. This exercise of discretion has been good for the band's image, and for our fond memories. There the six titles are on the shelf. Each sounds different from the others, and each sounds at least as vital today as it did when Nirvana was a historical force rather than a historical anomaly. Taken as a unit, Nirvana's albums are living proof of the subtlety and variety of what conventional musicology still regards as a crude, undeveloped genre. Although the three members of Nirvana--Cobain, Krist Novoselic, and Dave Grohl--looked like hippie-manque undesirables, their cultural identification was punk, and in 1991, fifteen years after the Sex Pistols turned the British music business upside down, they stormed American pop with it. But they worked hard and long before that. In a compelling new biography of Cobain, Heavier Than Heaven (Hyperion, $24.95), Charles R. Cross dates the band's first gig to a March, 1987 house party in Raymond, Washington, a nowhere logging town thirty minutes south of Aberdeen, the nowhere logging home town of the then twenty-year-old Cobain. That's four and a half years before Nirvana broke through with their second album, the cunningly produced major-label debut Nevermind. It's also eighty-seven pages into the three-hundred-and-fifty-two-page text, which reaches its midpoint before Nevermind is released. While this structure inevitably shortchanges the achievement of Nirvana itself, it's a crucial source of the book's considerable power. Cross asserts his compulsion to ask "questions concerning spirituality, the role of madness in artistic genius, the ravages of drug abuse on a soul"; the drug details are especially wrenching. But what emerges far more emphatically is the life story of someone who never grew up, someone whose maturation was half done before he was twenty-one, somone who extracted art from a perpetual adolescence that was over much too soon.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bkrev/nirvana-ny.php"
