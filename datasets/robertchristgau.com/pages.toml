["https://robertchristgau.com/xg/bk-aow/dcfive.php"]
title = "Robert Christgau: In Memory of the Dave Clark Five"
full_description = '''This column is dedicated to the Dave Clark Five primarily because the Dave Clark Five, a totally unpretentious yet much-despised group that was ascendant during my favorite period in rock & roll &, 1964 through 1966, once recorded a hit called "Bits and Pieces," a wonderfully serviceable rock throwaway, raucous and meaningless, perfect for shouting into the night. This column will collect bits and pieces of observation that interest me. Its unstructured quality will reflect the fact that my life is also in bits and pieces at the moment, and even music can't pull it together. I am writing because it's been quite a while, and it always makes me feel better to say hello to you folks out there in newspaper-land. I am also writing because I have made a pact with myself: I have sworn to write a real column for every Consumer Guide I concoct. There's lots of powerful good and powerful mediocre records out there for me to rate, and that will always get me off my ass. My form has to be the travel diary. Over the past two months I have spent a lot of time driving and flying around the country. Such transience, especially when accompanied by other kinds of stress, gives music an exacerbated importance, somewhat distorted because my exposure becomes at once more selective and more intensive in the absence of the usual flow of new releases, press information, publications, and industry gossip. I gain new perspectives. Two years ago I was driving across the desert in a drive-away with no radio--no radio, the desert, can you dig it? At around sunset, somewhere in New Mexico--Grants, I believe--we picked up a hitchhiker. He was about eighteen, and he had grown up about two miles from me in Queens. One day in September he had just stuck out his thumb at the Whitestone Bridge. One ride had taken him to Columbia, Ohio, where he stayed a month and stuck out his thumb again. That ride took him to Grants. He had been waiting fifteen minutes when we picked him up. He was wearing light clothing, and all he carried in his pack was some socks and underwear and--get ready--a portable stereo. Plus some records, of course. He tried to balance the stereo on the seat, but it was too bumpy, so he decided to cradle it in his two hands, cushioning it against the shock in midair. We listened to both sides of the first Grateful Dead album before his arms gave out. And it was that kid's unspoiled faith in the benignness of the universe, as we cut through the desert night, that transformed the Grateful Dead for me forever.'''
