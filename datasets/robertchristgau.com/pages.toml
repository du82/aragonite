["https://robertchristgau.com/xg/bk-cg70/ack.php"]
title = "Robert Christgau: CG 70s: Acknowledgments"
full_description = "The number of friends, acquaintances, publicists, and editors who have made a tangible contribution to the Consumer Guide must total over five hundred. For eleven years I've asked people what they're listening to, played records for strangers in the hope of garnering new shreds of insight, and stolen ideas, facts, and wisecracks shamelessly. Even to name only those who've helped get the material into book form would be impossible, and I apologize to anyone I've left out. One of my biggest hassles was obtaining out-of-print albums. Essential to this task was my upstairs neighbor Vince Aletti, whose vast black-music collection saved me many hours of searching; I should add that I've been picking his brain since 1970. John Morthland, Tom Hull, Joe McEwen, Stephen Holden, and my sister Georgia Christgau perused my outline and suggested additions from their own shelves. Boston's incomparable Jeep Holland, whom I've never laid eyes on, generously opened his hoard of rarities to me. Tom Smucker, also an upstairs neighbor, offered jokes, advice, and emotional support as well as pieces of plastic. Others who lent me records--sometimes dozens, sometimes just one--include Billy Altman, Michael Beinhorn, Karin Berg, Alan Betrock, Barry Cooper, Karen Durbin, Ken Emerson, Gary Giddins, Eliot Hubbard, Greil Marcus, Dave Marsh, Steve McAvoy, John Milward, Richard Mortifoglio, Paul Nelson, Jon Pareles, John Piccarella, Kit Rachlis, John Rockwell, Don Shewey, Davitt Sigerson, Danny Stanger, Chip Stern, and Roger Trilling. As diligent consumers soon discover, records that are still in the Schwann catalogue can be even harder to find than out-of-print items, and here company publicists prove invaluable. Special thanks must go to Eliot Hubbard of Epic, whose heroic interactions with CBS's New Jersey warehouse kept me working in the worst days of August. Barbara Pepe at RCA, Liz Rosenberg and Stacy Greene Mizrahi at Warners, Paul Batson at Columbia, Suzanne Scivoletti and Sherrie Levy at Phonogram, Bill Schubert at Philo, Caroline Prutzman at ABC and EMI/UA, Andy McKaie at Arista, and Joanne Toker and Pat Cox at Atlantic did discographical research as well as obtaining records for me. Kathy Schenker at A&M, Maureen O'Connor and Doreen D'Agostino at Capitol, and Lynn Kellerman at MCA tolerated many more phone calls than were necessary. My appreciation also to Irene Simmons at Island, Terry Hinte at Fantasy, and Bruce Iglauer at Alligator."
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-cg70/ack.php"
