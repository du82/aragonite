["https://robertchristgau.com/xg/dontstop/jordan-24.php"]
title = "Robert Christgau: Louis Jordan: The Grandfather of Rock and Roll"
full_description = "This was originally published as free content, in Robert Christgau's And It Don't Stop newsletter. You can have Christgau's posts delivered to your mailbox if you subscribe. Formally, this jump-blues pioneer presaged rock and roll, though he was decades older than Chuck Berry, Fats Domino, or Little Richard. The first thing to remember about Louis Jordan is that he was born in 1908, which makes him three years older than rock and rolling blues hitmaker Big Joe Turner and decades older than Chuck Berry, Fats Domino, or Little Richard, nearly 40 when he began to hit it big in 1945 and 1946. The second is that not only was his father and chief music teacher James Jordan a touring professional musician, the kind of professional heritage only the Everly Brothers came near among '50s hitmakers, but he was a blackface minstrel, primarily in a famous troupe that was still mounting shows in 1959 called the Rabbit's Foot Minstrels, where many major black entertainers including the seminal blueswoman Ma Rainey got their start. And it was in the Rabbit's Foot Minstrels that Jordan broke into show business as a clarinetist and comedian when he was 17, in 1925. Whether that means he blacked up is unclear from the evidence I've found so far, but I'd say probably. For sure he had plenty of experience in minstrelsy-style humor, which by his time played mostly although by no means exclusively to black audiences in the South--Jordan himself was a dark-skinned man who grew up in rural Arkansas. You should also be aware that although Billboard ignored his death in 1975, in 1987 he became a charter member of the Rock and Roll Hall of Fame as what was called an Early Influence. In short, the trademark humor of the Grandfather of Rock and Roll, as he's been called, traced directly back to blackface minstrelsy. According to the great discographer Joel Whitburn, Jordan had 19 charting pop hits going back to 1944 in the pre-rock era. This was nowhere near as many as Armstrong, Holiday, Fitzgerald, Fats Waller, Nat King Cole, the Mills Brothers, or the Ink Spots, but remakable for a black performer and supreme in the postwar style he pioneered called jump blues, because that style was created principally within and for the African-American market even though Jordan crossed over pop with many of his singles. It was rhythm-and-blues rather than pop or jazz."
year_published = 2025
