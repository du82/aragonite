["https://robertchristgau.com/xg/bk-aow/cg16.php"]
title = "Robert Christgau: Any Old Way: Consumer Guide (16)"
full_description = "The humblest form creates its own imperatives, even the lowly Consumer Guide. This abstract, which began as sensible conservation of energy, has gathered its own inertia, until now it has changed my listening habits and perhaps my taste itself. As I've explained before, reviewers share the occupational hazard of ennui and for that reason tend to flatter work that is idiosyncratic or formally elegant. In an effort to combat this prejudice--not that I could ever hope (or want) to conquer it entirely--I listen to certain records more and more. These are mostly efforts that seem competent but undistinguished on the surface yet nevertheless (usually due to some sort of hype, to be honest, although a word from one of my far-flung advisers or some quirkish detail will also suffice) offer some hope of quality. After all, I say to myself, the guy who pays cash for an album isn't going to give up after one or two tries, so why should I? Often I find myself getting into stuff I dismissed at first, which is all right except that it tends to flatten my response simply because I spread it so thin. Even the pattern of my pleasure-listening changes. I often find myself playing records I kind of like, even for visitors, and eventuallyI kind of like them more. All of which balls up my trusty rating system and spoils my fun. After all, who wants to give eight A's out of twenty records. Not nasty old me. As I keep insisting, I do believe there is an objective correlative, as we used to say. That is, music is getting better all the time, and only a few labels release a consistent stream of crud. There is still quite a bit of crud, of course, some of it well received by all the fools who don't agree with me, most of it ignored by everyone. What's getting harder and harder is to distinguish between good, better, and best, and I'm no longer sure the Consumer Guide helps much. Well, what the hell. You just read it for yocks anyway, right? So here's another. Eric Burdon and War: The Black-Man's Burdon (MGM). On the front cover of this album is a black man in silhouette. On the back cover Eric, looking paunchy, rests his head in the crotch of a black woman straddled above him. He also holds her ankles. Inside the jacket seven men, presumably the band, occupy the background of a full-length photo of a grassy field. Six of the men are black; five are bare-chested. In the foreground recline two naked blondes who obviously belong in a centerfold. The left hand of one is thrown back to reveal a clean-shaven and possibly airbrushed underarm, so that her right does not quite conceal her pubic hair. Her companion hides her sex with both hands. The only man who is standing appears to be walking toward the women. He has removed the belt from his pants. D plus."
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-aow/cg16.php"
