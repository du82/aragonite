["https://robertchristgau.com/xg/bk-aow/drifters.php"]
title = "Robert Christgau: Any Old Way: The Drifters in History"
full_description = '''Rock and roll is here to stay in the Garden of Eden in Northport, Long Island, oldies night for the swinging singles and marauding marrieds of Sunken Meadow. Last week the Cadillacs, next week the Shirelles, and now, ladies and gentlemen, the Drifters. Jackets required, of course--you think this is some roughneck joint? The bassist and the drummer from the house band, looking even gaudier than the flamingos in the audience with their black jumpsuits and ruffled lavender shirts, are already on stage. A portly, coffee-colored man in a tux is tuning a guitar. On his cue the makeshift combo goes into a familiar riff, and four Afro-American men--all in their mid-to-late thirties, all wearing identical cream suits and chocolate shirts--swing past the bar and onto the tiny makeshift stage. It's "Up on the Roof," a top-ten million-seller in 1963, followed quickly by "Honey Love," a number-one rhythm-and-blues hit in 1954. The dance routine is a little sloppy, although it's twice as energetic and ten times as difficult as anything any of the seventy-five or so patrons is likely to try, and the singing is just a little disappointing. Which is not to suggest that complete satisfaction is possible. When the Drifters recorded "Up on the Roof," the lead singer was Rudy Lewis, who died in 1964. When the Drifters recorded "Honey Love," the lead singer was Clyde McPhatter, who died in 1972. Although he was gospel-trained, Lewis was one author of the Drifters' smooth pop style, and the Garden of Eden version is a credible if somewhat flat replica. But "Honey Love" doesn't make it. McPhatter's rendition was a masterpiece of concupiscence, the sexiest song of the year of the sexy song. In the Garden of Eden it sounds campy. To me, that is. I happen to know McPhatter's version, not because I was one of those superhip white kids who listened to black radio in 1954, but because Scott Muni played it on WOR-FM in 1967 and I flipped for it. The audience is happy in its ignorance, and it ought to be--this is a fine show. The Drifters perform ten songs, every one either top-thirty pop or top-five r&b, and there are plenty more where those came from. The excitement builds effortlessly, and the show climaxes with an encore of the first Drifters' hit, "Money Honey," and the seminal "There Goes My Baby." In 1959 "There Goes My Baby" introduced the big string arrangement to rock and roll, and the Drifters to the mass teen public. Ben E. King's vocal on the record is a landmark of early soul music. Fittingly, the 1972 version is slower, even more strained and soulful. For what is supposed to be nostalgia, this is powerful stuff, and the crowd goes as wild as crowds go in such circumstances.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-aow/drifters.php"
tags = ["drifters", "history"]
language = "en"
