["https://robertchristgau.com/todo.php"]
title = "Robert Christgau: To Do"
full_description = '''This and the remaining todo files are relatively obsolete: they are scratchpads of ideas, many of which are done, some of which are forgotten. Eventually there will be a major rewrite of the software, and at least some of these problems won't be tackled until then. Meanwhile, the Help List provides a prioritized list of things that we need help on. This and the other "to do" lists are the project documentation for developing this web site. They are also, at least implicitly, an admission and warning of various mistakes in the current design and/or implementation of the web site. These lists are public because, well, why the hell not? Maybe you (the reader) have a better idea? Why not tell us about it? (Write to webmaster.) Also note that most of the ideas here are mere proposals (mostly by Tom Hull), and are as likely to disappear as to be implemented. Also note that these files are more than a little out of date; i.e., some "to do" things have been done, others have been done differently, and some ideas are cooking that haven't been detailed at all. It would be a good thing to straighten this out. Maybe soon. The general page design was hacked together in about ten minutes, mostly testing color combinations on some earlier work, then typesetting the banner graphic. The page design is concentrated in one PHP file and one CSS file, and can be easily changed. The pros and cons on the design should probably be thrashed out in a separate file. We could make the banner a link back to the home page. I haven't seen this done, but it's fairly logical. I want to add a bibliographic database, which can be used both for URLs and print references. This would be split out into three tables, which currently exist but are empty: author, publication, and article. Meanwhile, we have Joe Yanosik's bibliographic notes, which among other thing sprovide a check-list for figuring out what early writings we do/do not have online as yet. Most of this has been done, except that the plink table hasn't been populated. A similar table exists for linking artists to URLs, which is used for "See also" links from CG artist pages to other web pages.'''
year_published = 2025
