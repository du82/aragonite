["https://robertchristgau.com/xg/bk-cg80/dnce.php"]
title = "Robert Christgau: CG 80s: Distinctions Not Cost Effective"
full_description = '''Accept: As I walked behind two teenaged boys with a boombox one hot vacation afternoon in 1983, these Swedish metalists knocked me out for at least thirty seconds. I must have been in a great mood. Asleep at the Wheel: Commander Cody with chops--which isn't what they (or Commander Cody) originally had in mind. Blue Oyster Cult: Though the power-packed Career of Evil compilation stole great slabs of 1982's Extraterrestrial Live, only two of its songs were written in the '80s. They should know. Laura Branigan: Her big, anonymous voice and safe, Irish-American looks went debut gold in 1982, but dance-pop is fickle and Laura's not too talented. So she picked up a check in Sun City in 1988 and--unusually for such a "name"--returned in 1989. Guess she liked the culture. Lonnie Brooks: Back in the Depression, it made sense for bluesmen to choose Chicago over Mississippi. The ones from New Orleans didn't want to leave. Jimmy Buffett: His best title since A White Sport Coat and a Pink Crustacean told us what had become of him: Last Mango in Paris. John Cale: Provided more proof that he'd studied at Juilliard. Subcontracted his lyrics to a Dylanologist. Cherelle: I'll never forget the charcoal-gray number she wore on the cover of . . . what was it called again? Rodney Crowell: Once this ace writer-producer vied for country-rock auteur, but soon his records sounded more like pop demos. And he was too much the pro to get anywhere on the neotrad gravy train. Dissidenten: So German pop-rock isn't your stein of beer? And Middle Eastern music still seems a little alien? Now imagine a fusion. Howard Hewett: No matter how adorable Brits found Jeffrey Daniel, Howard was Shalamar. But that's all he was. The Isley Brothers: They started the decade with Go All the Way, Inside You, and Between the Sheets. Then they announced a two-for-one stock split. The Jets: Tongans transplanted to Minnesota, the black-pop Osmonds were discovered wearing native garb in a Holiday Inn. For their Apollo debut they dressed like African-American street kids. Clean-cut ones, of course.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-cg80/dnce.php"
