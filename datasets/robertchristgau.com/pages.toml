["https://robertchristgau.com/xg/bk-cg90/intro.php"]
title = "Robert Christgau: CG 90s: Introduction"
full_description = "This isn't supposed to be where I tell you how I wrote this book. This is supposed to be where I tell you how I conceive the '90s. Only, how I wrote this book dovetails with how I conceive that decade. So let me outline my method of business. The time-consuming work of engaging a multiplicity of recordings--of learning how they sound and discovering how they feel--has been standard in my life since the summer of 1969, when as a fledgling Village Voice rock columnist I thought up the Consumer Guide. For the next two decades, I dispatched 20 LPs a month with a brief review and a letter grade from A plus to E minus (A to C minus, practically speaking). But after I transformed my '80s columns into a book worthy of its ISBN, a task that involved double listening for a year or two, something had to give. I wanted to hear as much music as ever, from 10 to 18 hours a day of it. I just wanted to enjoy it more. As long as you prefer compact cars and have never understood why people burden themselves with country houses, rock criticism is a peachy job. It would be graceless to complain about a life whose chief drawback is a shortage of shelf space. But one thing has always bothered me. I probably take active pleasure in more records than any critic out there--and not casually, either. By the time I parcel out an A or an A minus, I've heard the CD five or 10 times, concentrated hard at least once or twice, perused the credits and the lyric sheet if there is one, and ascertained that it gives me a charge I can't resist. If it doesn't, it's not worth an A or A minus--that's the main way I tell. My other secret is that I count cuts, avoiding the temptation to listen through the humdrum songs that interlard or trail off from the galvanizing few, which is how critics itching to announce their latest discovery fool themselves. But once the judgment is rendered and the review written, the record sometimes leaves my life forever. Looking over my A List from 1992, say, I can pick out half a dozen titles I don't remember playing since I wrote about them--records I wish I could play right now. Only I can't, because I'm listening to something newer that I want to know about."
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-cg90/intro.php"
