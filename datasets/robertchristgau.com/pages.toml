["https://robertchristgau.com/xg/bk-aow/gfunk.php"]
title = "Robert Christgau: Mark, Don, Mel, and Terry"
full_description = '''The title of the seventh Grand Funk Railroad album is printed simply but grandly across the front cover--Mark, Don & Mel--and on the back there are some incredible liner notes by the fourth Grand Funk Railroad, Terry Knight. The clerk gave me a glance as I was scanning the notes, so I asked him how the set was selling. "Can't tell yet," he said, "just came in," and in a moment he was volunteering his critical opinion: "If I had my way, I'd burn every one of their albums." He told me he was twenty-one, college dropout, son of an advertising man, into music. That last was why he was so vehement. They weren't good musicians, there were so many good ones out there, it just wasn't fair, and it made him mad. Then someone who had worked at the store longer came over to explain the Grand Funk hype. Because Capitol Records controlled a big distributing company, he said, it could push discount and display deals and create a blitz for its product, especially in the big general outlets. He recalled how twenty-five copies of the first Grand Funk album had languished in his racks for months. Then, wham, the hype took hold, and they all went like that. He was a little unclear, however, about just why the hype took hold when it did. A few minutes later I was reading the notes to some friends, who were laughing. This was a bizarre piece of writing, even for Knight, whose capacity for bull is almost limitless. Its central conceit was that the members of Grand Funk Railroad were among those rare world heroes--including Jesus, Napoleon, Twiggy, and Mao, one of whom had recently concluded a business deal with Knight--who come to be known by first name only. It is noteworthy that at the time Knight was writing he was preparing lawsuits for fifty-five million dollars against the members of Grand Funk Railroad. It is also noteworthy that when I pronounced the deathless first names that climaxed this panegyric, my friends responded with a resounding "Who?" This was not an unfair question. Even more than the lawsuit, it indicated how grand Knight's conceit really was. And yet, and yet, this all made sense somehow.'''
