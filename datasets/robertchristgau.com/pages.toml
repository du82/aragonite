["https://robertchristgau.com/xg/music/60s-det.php"]
title = "Robert Christgau: Classic Rock"
full_description = '''Note: This was a point-counterpoint with Julian Dibbell. Christgau's piece was the counter and carried this note: "Village Voice senior editor Robert Christgau, forty-nine [in 1991], has been a rock critic since 1967. He is Julian Dibbell's uncle." No no no, you've got it all wrong. Kids today, jeez. It's like we used to say--never trust anyone under 30. (Wasn't that it?) I know classic rock isn't the issue, exactly. In its orthodox form, classic rock is for people who aren't quite as cool as Joe and Jo College--people who may go to college, but who don't go away to college, if you catch my drift. Yet somehow classic rock seems like the key concept here: art that's stood the test of time, as my professors used to put it. And although it would be foolish to claim that critics created this concept--the buying audience has never taken us that seriously--we certainly collaborated in establishing the canon. For if the early rock critics were more enamored of Chuck Berry than the typical progressive jock, and also more receptive to punk than any population group this side of SoHo, we did play the game of vaunting our "generation"'s "artistic achievement." We celebrated pop flux, insisting--despite our distaste for if-it-feels-good-do-it, love-the-one-you're-with, hope-I-die-before-I-get-old banality--that music, like life itself, was best experienced in the present. But we couldn't resist valorizing it in the historicist terminology of the academy. I'm not sure we had an alternative, either. As is obvious now, somebody was gonna do the canonizing, and I guarantee you it wasn't us who enshrined paragons of excess Jim Morrison and Led Zeppelin--Genuine Artists though both may have been--so near the top of the heap. So we put our two cents in, plumping for Van Morrison, say, or Randy Newman--figures of relatively minor renown who needed all the help they could get--as well as validating Hendrix and the Beatles and the Stones. We did our damnedest to absorb the shock of the new, and almost invariably caught on to future icons quicker than radio or retail. We got hip to our own history, listening beyond the hits of our youth till we got to know parallel geniuses (George Jones, Thelonious Monk), major minor artists (Wanda Jackson, the Five Royales), and loads of great predecessors (Hank Williams, Billie Holiday, Louis Armstrong, Franz Liszt). And if none of this turned out as we would have wished, from shooting-star-of-the-week on the cover of you-name-it to the Rock & Roll Hall of Fame, well, who ever said we ruled the world? Not us. So it seems like a good time to point out some stuff.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/music/60s-det.php"
tags = ["classic", "rock"]
language = "en"
