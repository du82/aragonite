["https://robertchristgau.com/xg/bk-aow/berry.php"]
title = "Robert Christgau: Chuck Berry: Eternal Rock and Roller"
full_description = '''Chuck Berry is the greatest of the rock and rollers. Elvis competes with Tom Jones. Little Richard cavorts after hours for Dick and Johnny, Fats Domino looks old, and Jerry Lee Lewis looks down his noble honker at die-hards who refuse to understand that Jerry Lee has chosen to become a great country singer. But for a fee--only two thousand dollars until recently--Chuck Berry will hop a plane and play some rock and roll. In this year of the boogie the man who used to be the ideal second attraction, drawing a core of raving fanatics like me and a broad base of casual admirers who dug to get off on a legend every once in a while, has come into his own. Everyone from the folkies to the heavy metal kids claims his songs for encores, and much better than that, Chuck Berry himself is back on top: The London Chuck Berry Sessions reached top ten in the wake of a number-one single, his first certified million-seller, "My Ding-a-Ling." For those who skipped fourth grade, let me make clear that "ding-a-ling" is a play on words that engenders quips like the one Chuck made when he was awarded his gold record at Madison Square Garden on October 13: "I never knew `My Ding-a-Ling' would get so big." A lot of his raving fanatics are mortified. We've always dreamed of another big single for our hero--his last was "You Never Can Tell" in the Beatle summer of 1964--but "My Ding-a-Ling" has been embarrassing us at concerts for years, and not because we wouldn't sing along. It was juts dumb, inappropriate to the sophistication of his new, collegiate audience. Anyway, that's how the rationalization went. Obviously, what we meant was that it wasn't sophisticated enough for us--his other stuff was so much better. But popularity has changed the song. I feel sure that it's delighting all the twelve-year-olds who get to figure out that they've snuck something dirty onto the AM radio--a rock and roll tradition that has been neglected since the concept of dirty became so pass�--because I'm fairly delighted myself. Believe me, twenty-one thousand rock and roll revivalists filling Madison Square Garden to shout along with a fourth-grade wee-wee joke constitutes a cultural event as impressive as it is odd, a magnificent and entirely apposite triumph in Chuck Berry's very own tradition. For Chuck Berry isn't merely the greatest of the rock and rollers, or rather, there's nothing mere about it. Unless we somehow recycle the concept of the great artist so that it supports Chuck Berry as well as it does Marcel Proust, we might as well trash it altogether.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-aow/berry.php"
