["https://robertchristgau.com/get_rlist.php"]
title = "Robert Christgau: Random A-List"
full_description = '''Aaliyah: I Care 4 You [2002, Blackground] A half measure that's anything but "definitive" and the best we're likely to get until she's a trivia question: both soundtrack smashes plus a hit-or-miss best-of and six previously unreleaseds whose consistency rescues the project. From "Age Ain't Nothing but a Number" when she was 15 to "More Than a Woman" just before she died (the latter included, the former discreetly not), she was lithe and dulcet in a way that signified neither jailbait nor hottie--an ingenue whose selling point was sincerity, not innocence and the obverse it implies. Timbaland's beats add essential eccentricity, but R. Kelly's ditties suited her almost as well. And what can it mean that a good new one celebrates the machinations of the bitch queen of All My Children? Such mysteries are beyond the ken of mortal males like me. A- Air: Air Lore [1979, Arista Novus] Demonstrating not only that ragtime (Scott Joplin) and New Orleans (Jelly Roll Morton) are Great Art consonant with Contemporary Jazz, but also that they're Corny. And that both Great Art and Corn can be fun. Which is why the somewhat stiff, if not corny, readings of the themes, especially "King Porter Stomp," don't get in the way. Although just what could get in the way of Henry Threadgill improvising over an explicit pulse for a whole album I can't imagine. A The Chi-Lites: Greatest Hits [1972, Brunswick] The Delfonics and the Moments may have staked first claim on Eugene Record's love man, but Record demolishes the competition, if such a macho concept is permissible in this context (and it certainly is). Not only does he outwrite the other fellas, he doesn't trip over his bassman when the tempo speeds up or make a fool of himself when analyzing the dilemmas of contemporary civilization. The fifteen-song compilation includes the entire first side (plus one) of Give More Power to the People and may actually be too generous--it is possible to OD on this stuff. But everything you want is here, and what you think you don't want you might. A'''
year_published = 2025
clearnet = "https://robertchristgau.com/get_rlist.php"
