["https://robertchristgau.com/xg/bn/2010-02.php"]
title = "Robert Christgau: Smart and Smarter"
full_description = '''The nonsense about Vampire Weekend being in any definitive way "African" has dispersed somewhat with the release of their second album, Contra. And though they still offend the usual gaggle of indie purists, it's worth emphasizing that Vampire Weekend's indie ties are more structural rather than cultural--they chose the clubs-and-blogosphere route because the demo-and-a&r route was closed to art-band traffic years ago. The source of contention that remains is class--the four Columbia graduates' access to privilege and, supposedly, their celebration of privilege. Class is America's nastiest secret, always worth raising in pop. But the concept is at its most slippery in the U S of A, where economic power is wielded by an ever-changing alliance of the wealthy and the well-born. Although indeed Ivy Leaguers, another vexed concept, the members of Vampire Weekend come from backgrounds that are managerial if that. Bassist Chris Baio's parents are lawyers, although his dad was a child actor and he's related to '80s teenthrob Scott Baio. Drummer Chris Tomson's father is an engineer. Having escaped Iran shortly after the ayatollahs took over, keyboard maestro Rostam Batmanglij's mother Najmieh is a renowned Persian cooking expert, his father Mohammed a publisher of books on Iran who gave $250 to Howard Dean in 2004. Frontman, wordsmith, cutie-pie, and scholarship boy Ezra Koenig is the son of a set designer and an academic. This is all still privilege. But it's no closer to ruling-class power than it is to the affluence of the average American geekboy who gets to insult music he resents online. I initially reacted to the "Upper West Side Soweto" imbroglio by slotting Vampire Weekend as a fine little pop band. What I didn't get at first--what you often don't get with pop bands until their light touch endures--was how fine. My epiphany came one sunny but pensive 4:30 last summer, playing their debut on a whim as I drove a rented compact to a state beach east of New Haven with my wife and daughter. There was the boyish, educated Koenig delivering the album's enigmatic first verse--which cites, let me point out, not just a mansard roof but garbage and concrete. After a repeat, a non-African guitar figure strummed hard over Tomson's marchlike clatter raised the emotional ante, and then an ahistorical verse about some Argentine-with-a-long-I sea battle adduced imperialism and the insubstantiality of all things before livelying all things up with the same strum-and-clatter.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bn/2010-02.php"
