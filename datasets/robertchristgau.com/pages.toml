["https://robertchristgau.com/xg/bk-cg80/further.php"]
title = "Robert Christgau: CG 80s: Subjects for Further Research"
full_description = '''Arrow: I could be wrong, but I'm not physically attracted to soca. I find that unlike competing Caribbean grooves--from Cuba, Puerto Rico, the Antilles, Haiti, Jamaica for damn sure, though maybe not the Dominican, there's something in the up-up-up of merengue that hits me the same way--it has no give in it. That's why I never followed up the middecade foray into the style that taught me to love Sparrow, and also why the attempted U.S. breakthrough of this strong-voiced, weak-minded Trinidadian left me lukewarm lukewarm lukewarm. Birdsongs of the Mesozoic: Though Mission of Burma's answer to hearing damage slipped into bombast and soundtrack even on the ace Magnetic Flip, they were usually good for a nice postmodern version of the kick vintage fusion or art-rock used to provide occasionally. Debussy meets the electric guitar, sort of. Rykodisc's Sonic Geology collected their works. And of course there were offshoots, too. Bobby Bland: After MCA hung him out to dry he found a home at Biloxi-based Malaco, where Z.Z. Hill had become a belated hero by reproducing his mannerisms. He got good songs in a sympathetic environment, but with Bland the physical instrument was always crucial, and near as I could tell it had lost its edge. Hope I was wrong. Brave Combo: Carl Finch's conceptual conjunto starts with norte�o's unlikely polkas and makes connections--to "pol-ska," which I guess is obvious, and to "Skokiaan," and to "O Holy Night Cha Cha Cha." And to "Rosemary's Baby" as a waltz. And to "People Are Strange" as a hora. In short, he interprets universal humanism as the dance music of a thousand cruise ships. The idea is wonderful live--getting this silly in the company of a crowd that's half in on the world-music joke (and statement) can border on euphoria. But the records are too cute: not since 1982's Urban Grown-Ups EP have they made a serious stab at normal songwriting. The 1987 Rounder CD Musical Varieties is a representatively excessive selection for truly modern fun-seekers.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-cg80/further.php"
