["https://robertchristgau.com/xg/bk-cg80/in_decade.php"]
title = "Robert Christgau: CG 80s: Introduction: Decade"
full_description = "The '80s were above all a time of international corporatization, as one major after another gave it up to media moguls in Europe and Japan. By 1990, only two of the six dominant American record companies were headquartered in the U.S. Bizzers acted locally while thinking globally in re audiences/markets (will it sell in Germany? Australia? Venezuela? Indonesia now that we've sunk the pirates? the U.S.S.R.?) and artists/suppliers (world music was a concept whose geoeconomic time had come). After a feisty start, independent labels accepted farm-team status that could lead to killings with the bigs. Cross-promotional hoohah became the rule--the soundtrack album, the sponsored tour, the golden-oldie commercial, the T-shirt franchise, the video as song ad and pay-for-play programming and commodity fetish. Record executives became less impresarios than arbitragers, speculating in abstract bundles of rights whose physical characteristics meant little or nothing to them. Rock was mere music no longer. It was reconceived as intellectual property, as a form of capital itself. The '80s were when stars replaced artists as bearers of significance. The '70s had yielded their honorable quota of Van Morrisons and Randy Newmans and Patti Smiths and John Prines, all of whom were still around, as were new variants like Blood Ulmer and Laurie Anderson and the Mekons and Kid Creole. Those are only my nominees, however; yours are different. Nobody blinked when break-even commercial nonentities like Morrison and and Newman were ranked with the Stones and Stevie Wonder among the crucial rockers of the '70s. But in the '80s the only list that computed was pure megaplatinum--Prince and Bruce and U2 and Michael Jackson and Madonna, with maybe a few million-selling status symbols like Sting, Talking Heads, R.E.M., or Public Enemy (sorry, not Elvis Costello) tacked on for appearance's sake. When art is intellectual property, image and aura subsume aesthetic substance, whatever exactly that is. When art is capital, sales interface with aesthetic quality--Thriller's numbers are part of its experience."
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-cg80/in_decade.php"
