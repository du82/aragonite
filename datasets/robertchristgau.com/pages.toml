["https://robertchristgau.com/xg/bk-fest/hull.php"]
title = "Robert Christgau: A Rock & Roll Critic Is Something to Be"
full_description = '''Geologists draw extraordinary conclusions from scant evidence: that the earth is over 4200 million years old; that single-celled life appeared no later than 3700 million years ago, but that our familiar animal phyla only emerged 560 million years ago; that continents move; that whole categories of life have been wiped out by freak events. Such insights are possible because physical processes are simple and ineluctable: the steady decay of radioactive isotopes, the dynamics of heat, the pull of gravity, the orderly piling up of strata, the timely burial of fossils. While evolution is more complex, it too is constrained by genetics into an orderly phylogeny. It is safe to say that all of today's vertebrates descend from Cambrian chordata, because there's no other way to get here except from there. Scant data can be a blessing: a more manageable set of points to connect, less noise, a clearer path to the big picture. On the other hand, historians can be plagued by too much data, too many idiosyncratic details to discern a big picture. In the early 1970's, I didn't know squat about geology, but I did know a fair amount about history and its pitfalls, and I was keen on sleuthing out big pictures. I had dropped out of high school, and cocooned myself for what turned out to be a five year crash course in remedial self-education. Starting with beat poetry and the theater of the absurd, I moved on to Eugene Genovese's marxist historiography and Robert Paul Wolff's neokantian philosophy, eventually finding a way to reason about the world. Then, transformed, I ventured out to college, finding a nest of new leftists in St. Louis and an underground paper to work on. It was there that I stumbled onto rock & roll as subject matter. One guy submitted a tome on the Beach Boys, with a conclusion that I couldn't stomach: "The Beach Boys have created high art." Until then, I had paid scant attention to music, but all my instincts and learning told me that art was class warfare, and high art had to be the vilest form. So I went to work marshalling my arguments, researching, listening, grooving. In the end, I found depth and beauty in Brian Wilson's tunes, but nothing I would taint by placing on a pedestal. Besides, Jan & Dean were more to my taste: faster and trashier.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-fest/hull.php"
