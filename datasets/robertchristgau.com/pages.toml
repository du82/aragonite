["https://robertchristgau.com/xg/bk-aow/altamont.php"]
title = "Robert Christgau: The Rolling Stones: Can't Get No Satisfaction"
full_description = '''The night a friend in California called and told me about Altamont, I was having dinner with a woman I'd met a week before--just when the crowd at the speedway was beginning to gather, in fact. We had sat in my apartment and listened to Let It Bleed, and as Mick Jagger sang out the climax of "Gimme Shelter" to Merry Clayton--"Love, sister, it's just a kiss away, it's just a kiss away"--I touched her for the first time. There were contradictions there--did I love her just because I wanted to kiss her?--and contradictions within contradictions--did Mick really mean that?--but I ignored them as always. The Rolling Stones epitomized the thing I loved most in the world, rock and roll, and they could induce me to ignore anything. I played their records all the time. The phone call from California changed that. In the year or so after Altamont--the end of 1969, all of 1970, and into 1971--I almost stopped listening to the Stones, and whenever I did, the contradictions welled up in me. Admittedly, my reaction was uncommonly intense, and most of those who shared it had always dug the Stones as symbols, not as a rock and roll group. Their response to Altamont was comparably abstract.As Mick Jagger told an interviewer recently: "Of course some people wanted to say Altamont was the end of an era. People like that are fashion writers. Perhaps it was the end of their era, the end of their na�vet�. I would have thought it ended long before Altamont." Yet one must suspect an artist as subtle as Jagger of being disingenuous here, as if he were ever anything else. Writers focus on Altamont not because it brought on the end of an era but because it provided such a complex metaphor for the way an era ended. Time: the final month of the decade that spawned that unprecedented and probably insupportable contradiction in terms, mass bohemia, popularly known as the counterculture. Occasion: On America's ultimate frontier some three hundred thousand bohemians come together with their chosen images, five formerly lower- to middle-class Englishmen who fuse Afro-American music with European sensibility. Denouement: An Afro-American bohemian is murdered by a lower-class white Hell's Angel while the Englishmen do a song called "Sympathy for the Devil."'''
year_published = 2025
