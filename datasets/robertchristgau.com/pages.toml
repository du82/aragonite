["https://robertchristgau.com/xg/bk-aow/festival.php"]
title = "Robert Christgau: Anatomy of a Love Festival"
full_description = '''"This is the love crowd, right?" One A.M. Sunday, the apogee of the Monterey International Pop Festival, and Otis Redding surveyed his audience. They were free and white, but were they twenty-one? In any case, they were cheering again. "All right," Redding said. Then, on some unheard but nevertheless precise beat, Redding began to . . . well, emote, part-singing, part-talking, part-moaning: "I've been [Steve Cropper lightly on guitar] loving you [pause] too long [lone shout from press section] to stop now," and the Mar-Keys started to blow, and the arena was in an uproar again. Superspade was flying high. Redding had come to Monterey with misgivings. The summer before, he had played San Francisco's Fillmore Auditorium to appreciative but restrained applause. Redding, a veteran entertainer who is a demigod on the soul circuit, is used to better than that, and anyway, the festival was only paying expenses. But finally, between the honor, charity, and an untapped market, he came, the only mainstream black performer to do so, and his success was exemplary. Of demigods, at least, this audience demanded nothing--no build, no work, no show. All Otis had to do was trot his big self onto the stage and rock into his rather medium-sized hit, "Shake," and he had it made, wham bam thank-you-ma'am. The rest of his act--the dancing, the chuckling, the running around, the whole image of masculine ease on which his career is founded--was icing. They were just cheering him. The L.A. record exec in the velour turtleneck was up on his feet again, shouting "Heavy! Heavy!" Brian Jones felt the beginnings of tears in his eyes. The cheap seats were standing. The love crowd was screaming its head off. When Redding said "love crowd," he of course meant "hippies," but there are no hippies--they have disappeared in an avalanche of copy. Most of the originals who were living in the Haight in 1966, when the journalists started nosing around, have fled from the bus tour and the LSD-Burgers and the panhandling flower children who will be back in school next semester. Those who remain do not conform to the stereotype any more than those who have left. They seem to have their share of ego, though on a more sophisticated level than, say, the average Reagan supporter, and they think a lot about "the movement." There really is a movement, administered by the media and inspired in a fairly direct way by those hard-core bohemian remnants who are still talking. "The love crowd" is as good a name for it as any.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-aow/festival.php"
