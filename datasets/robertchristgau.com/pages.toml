["https://robertchristgau.com/xg/bk-aow/column2.php"]
title = "Robert Christgau: Columns: December 1967"
full_description = '''In case you've been in New Guinea or something, you ought to be told that the Beatles have a new album out. It is called Sgt. Pepper's Lonely Hearts Club Band, and even before its release on June 2 it was the subject of all kinds of published and unpublished rumors. Afterward, the information barrage was overwhelming. Capitol Records sent out an extraordinary feature, spiced with terms like "modals," "atonality," and--egad!--"bowels" and casting aspersions upon the "Tin Pan Alley-spawned lyrical clich�." There were stories in Life (in which Paul McCartney, to the surprise of no one and the shock of quite a few, revealed that he had sampled the dreaded lysergic acid diethylamide; he was seconded quickly by John and George, but Ringo, lovely Ringo, has remained silent), Time (in which George Martin, the group's producer, who has a degree in music and is thus permitted to be a genius, was singled out as the brains of the operation), and Newsweek (in which the former kings of rock and roll were compared, unpejoratively and in order, to Alfred Lord Tennyson, Edith Sitwell, Charlie Chaplin, Donald Barthelme, Harold Pinter, and T.S. Eliot--and not to Elvis Presley or even Bob Dylan). The trades bristled with excited little pieces that always seemed to contain the word "artistic." And in The New York Times Richard Goldstein put the album down and was almost lynched. Goldstein, who has had his own story in Newsweek, is the best-known critic of pop in the country. Like any rising star, he engendered the inevitable ressentiment, always masquerading, of course, as contempt for the phony, the sellout, etc.. I often disagree with Goldstein, but a sellout he is not. He is unfailingly honest and about as malevolent as Winnie-the-Pooh. There are very few "pop critics" who can match him even occasionally for incisiveness, perspective, and wit. Goldstein was disappointed with Sgt. Pepper. After an initial moment of panic, I wasn't. In fact, I was exalted by it, although a little of that has worn off. Which is just the point. Goldstein may have been wrong, but he wasn't that wrong. Sgt. Pepper is not the world's most perfect work of art. But that is what the Beatles' fans have come to assume their idols must produce.'''
year_published = 2025
