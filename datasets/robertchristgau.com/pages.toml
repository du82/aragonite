["https://robertchristgau.com/xg/bk-aow/counter.php"]
title = "Robert Christgau: A Counter in Search of a Culture"
full_description = '''As of now, early 1973, it is clear that rock is neither the ultimate in cultural hallucinogens nor last year's rush. It is an established, pervasive social force, and it is still growing. Note that I refer not to "rock and roll," the pop-happy big beat that was disdained by nearly everyone except the kids who listened to it between 1955 and 1964, but to "rock," a term that signifies something like "all music deriving primarily from the energy and influence of the Beatles--and maybe Bob Dylan, and maybe you should stick pretensions in there someplace." Rock and roll is mine by birthright. I'm committed to it. In its self-conscious version it is still very much kicking. But rock, which subsumes rock and roll is the subject of this book. In fact, maybe what distinguishes rock from rock and roll is that you write criticism about it. Although that was not the life I'd planned for myself when I began my column for Esquire in early 1967, it seems to be what I end up doing. My disinclination was for criticism, not for rock, or rock and roll. Except for four years of college, where the apex of my career as a high aesthete coincided with a dearth of top-forty radio, I had been a rock and roll fan ever since the sainted Alan Freed arrived in New York in 1954. In high school my own fanaticism did not center around dancing, the Brooklyn Paramount, and autographed pictures on the wall. Instead, I was crazy for the radio and the trade magazines to which an even crazier friend subscribed. In college I turned to jazz and literature, and not even in that order of preference, but when I returned to New York in 1962, Phil Spector and early Motown were waiting for me. Once again I became a fanatic, even compiling charts, just like in high school, yet somehow I didn't make the connection between rock and roll and the meager short stories with which I justified my evasion of a graduate degree. Then, early in 1963, I walked into the Green Gallery on West 57th Street. The show was eight or ten of Tom Wesselmann's Great American Nudes--sprawling flat-pink ladies surrounded by outsized magazine-ad images, with vistas from Better Homes and Gardens pasted behind each window and the miniature Mondrians and Mona Lisas on the walls. The paintings exhilarated me, but what really turned me around was something I heard--Connie Francis singing "V-A-C-A-T-I-O-N." The music wasn't coming from a transistor Sony in the office, either. Into one of his paintings Wesselmann had built a real radio, and there in that art gallery it was tuned to WABC. What an epiphany.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-aow/counter.php"
