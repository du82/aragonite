["https://robertchristgau.com/index.php"]
title = "Robert Christgau: Home"
full_description = '''Robert Christgau's newsletter And It Don't Stop appears three (or four) times a month on Substack. Subscribe here. Book Reports features reviews of not only the pop-music tomes you'd predict but also literary fiction, Marxist-adjacent cultural commentary, feminist debates over pornography, and even books about the past decade's financial crisis. It follows a collection that Christgau published last year, Is It Still Good to Ya? Fifty Years of Rock Criticism, 1967-2017, which includes Christgau's takes on, among many other things, classic rock, Kanye West, the music of Desert Storm, Lollapalooza, Ladysmith Black Mambazo, and so-called guilty pleasures--a category that Christgau rejects, since, for rock critics, as he puts it, "pleasure is where meaning begins." Together, these collections make the sneaky case that Christgau is not just the Dean of American Rock Critics, his self-awarded and perhaps slightly off-putting nickname, but one of America's sharper public intellectuals of the past half century, and certainly one of its most influential--not to mention one of the better stylists in that cohort. Fun is a big part of why. Robert Christgau published a piece, An Immigrant's Tale -- Maruta Lietiņš Ray, "Refugee Girl: A Memoir" (2021, 248 pages) -- as part of his subscription newsletter, And It Don't Stop. The piece has been archived here. Robert Christgau published his monthly Xgau Sez q&a section -- Louis Armstrong and the Beatles in book form, 'Brat' but it's a lowish A but also still 'Brat,' Emmylou Harris and Wussy grades grubbed, and combating the evil which is going on. -- in his Substack newsletter And It Don't Stop. Like all of Xgau Sez, this is archived here. Robert Christgau published his Consumer Guide: February, 2025: A smart and sexy woman's frustrating quest for true love, a polyrhythmic meeting of Peruvian electronica and Congolese guitar, mean jokes and next-level feminism, and gnomic wisecracks postpunk style. Reviews of: Amadou & Mariam, Amyl and the Sniffers, Robert Sarazin Blake, Sabrina Carpenter, Manu Chao, Dingonek Street Band, El Khat, Future & Metro Boomin', Ale Hop & Titi Bakorta, Hurray for the Riff Raff, Jax, Nobro, Jack White. This is part of his subscription newsletter, And It Don't Stop. Also archived here.'''
