["https://robertchristgau.com/xg/bk-cg70/guide.php"]
title = "Robert Christgau: CG 70s: The Guide"
full_description = '''When I became Esquire's "secular music" columnist in early 1967, I didn't know I'd found a vocation--I was just staking my journalistic claim to a subject I'd been passionately analytic about since Alan Freed hit New York in 1954. I could imagine myself in 1977 (at thirty-five, God) doing a record review column for Cosmopolitan or somewhere: rock and roll would be a professional base, something to fall back on, not a career, or an obsession. Hadn't I rejected criticism as a way of life when I decided to skip graduate school? Apparently not. When the column dried up two years later, I quickly hustled down to The Village Voice, where I was allotted one 2500-word piece per month, a deal that quartered my rock-related income as it tripled my workload. And still I craved more. By then there were lots of rock critics--we gossiped at concerts, mooched meals at press parties, palled around. I even lived with one. We'd all fallen for a hype or two. We'd all learned to separate achievement from intention, real thing from phony, art from product, and maybe even to tell when those distinctions were meaningless. In short, we were all more or less skeptical. Yet for some reason I was less skeptical than most, as my unusual work habits proved--I tried to listen to everything the record companies sent me, a task so time- and soul-consuming that my rockcrit cohab, Ellen Willis, would banish me and my dreck to a backup apartment whenever the drone began to get to her. It was strange that I felt compelled to do this. According to my theory of pop, in which rock and roll's broad appeal was intrinsic to its aesthetic value, record-bizzers and radio programmers comprised an unwittingly beneficient distribution system: given the inevitable exceptions and time lags, the way to find good music in 1969 was the same as in 1954 and 1964--by turning on the radio and watching the charts. Admittedly, there was a polemical contrariness in this idea, a reaction against the elitist left sentimentalism in which The People are thwarted in their progress toward Good Music by a conspiracy of Establishment Reactionaries. But in 1969 I still believed it sincerely, and in 1969 it was still true. Not all of the most popular rock was good, but most of the good rock seemed to be popular. Of course, the meaning of popular was changing--it wasn't just top forty any more. While I continued to love AM and paid special attention to albums by the soul and tennybopper singles artists the counterculture ignored, I was aware that FM's free-form progressivism (har har) had proven essential to the pop process. But the new radio was only another example of the quirkish vitality of a new mass culture (call it youth, call it pop) that seemed destined to defy the status quo. Or so I argued.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-cg70/guide.php"
