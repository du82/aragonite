["https://robertchristgau.com/xg/bk-cg70/notebr.php"]
title = "Robert Christgau: CG 70s: A Note for British Readers"
full_description = '''This book assumes a consensus that whenever it was in the mid-sixties, the Beatles crystallized "rock culture" and that whenever it was in the late seventies, the Sex Pistols shattered it. During that period, for better or worse, a multinational corporate hegemony serviced the American market with every saleable rock LP made. Since commercial potential was thought by the more enlightened powers-that-were to connect at times to art, very few good rock albums went unreleased in the USA. Two exceptions that deserve mention are music not in English (by Italy's Lucio Dalla, say, or Nigerians like Fela and Sunny Ade, or any of the Brazilian rhythm masters who might qualify as rock by my catholic definition) and reggae, in which freelance capitalism has always made discography chancey anyway. But I can't say I regret having all but ignored British imports before 1977. Sure I missed a few gems (the first Matching Mole, for instance), but I suspect they wouldn't have compensated for the collected works of Curved Air. In the late seventies, though, the hegemony broke down as the established companies, their courage and profits in disarray, withdrew from music that smaller and more passionate entrepreneurs could still make money on. The resurgence of independent labels actually began in the USA, where they'd always persisted in country and r&b, and where by 1975 the likes of Alligator and Rounder had taken up the blues and folk artists the majors found they had no more time for. But the UK success of first Virgin, then Stiff and Rough Trade, all of whom combated industrial conservatism in rock itself, was the real breakthrough. By 1980 things had changed so much on both sides of the Atlantic that fifteen of my forty-nine A and A− albums had no major-label distribution, excluding titles on Takoma (Chrysalis-affiliated), I.R.S. (A&M-affiliated), and Sugarhill (an old-style r&b company). In 1970 I'd found only two such records, plus two James Browns on King. Furthermore, it had been a while since all the interesting British rock was sure to be released here; my rules permitting, I'd add three imports to my 1980 list (Poly Styrene's Translucence, Pere Ubu's New Picnic Time, and Oi!--The Album), with no confidence that I haven't missed others. And it was no longer true that the best new rock was automatically put on album--singles and EPs had replaced concept albums as conveyors of significance.'''
year_published = 2025
