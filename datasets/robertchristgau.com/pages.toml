["https://robertchristgau.com/xg/bk-cg80/in_howto.php"]
title = "Robert Christgau: CG 80s: Introduction: How to Use This Book"
full_description = "This guide is arranged alphabetically by individuals' last name (Styrene, B., Petty), title (Captain, Mr., DJ), or nickname (Kid, Biz, L.L.) and groups' first word (Cocteau, They, Orchestra). Alphabetization proceeds as if spaces and punctuation weren't there, with English-language articles ignored; foreign-language articles are treated as words, numbers and abbreviations as if spelled out. Artist names will vary slightly when their billing does--I respect the record as text, compensating as sanely as possible for internal inconsistencies (which usually means following the label rather than the cover art). Drastic anomalies (Lucinda Williams was just Lucinda on her 1980 album) are cross-referenced, as are collaborations that might get lost in the shuffle. Nearly 150 compilations and soundtracks are interspersed alphabetically by title through the text and indexed in the appendix. As I've explained, completeness was impossible in the '80s, and maybe inappropriate too. I've located every U.S.-released rock B+ I could, including cassettes and twelve-inch EPs. But I'm sure I've missed dozens, maybe hundreds, and in the various rock-related styles, not to mention the other genres that tickle my sensibility--especially those available only as imports, where my forays are sporadic--my breadth of coverage is even less reliable. I've tried to trace the outlines of recording careers, but a good many listings stop short in the middle, or begin and end with a single review. If I admire one record by an artist, especially a rock-and-roller, I almost certainly know the surrounding work, so figure when I skip something that I consider it disappointing in a boring way. It's common for a group to hit it right once, often on a debut album, and then sink into drought, confusion, compromise, or self-imitation, and there are only so many times you can say that before your readers wonder why you're bothering. Why I choose to say it about some records and not others is often somewhat arbitrary, though critical hyperbole or unwarranted chart action do get me going. Similarly, while I've been diligent about B+'s, I've been negligent about B's--competent records with a few striking cuts on them. Most of the records I don't review--by artists on the New Wave list, for instance--are probably a little worse, in the B- or C+ range, where moderately clever, hard-working, and original people make music that sounds OK and rarely if ever catches you short. But some would no doubt turn out to be B's if I gave them my full attention for a play. I just don't have the time. I've learned from doing the job with newsworthy artists that distinguishing a B from a B- from a C+ is the most soul-wearying aspect of music processing, and I'm not mad enough to pursue it; often the B's I do write about are albums I want to like more, because they're conceptually worthy or have a couple of gems on them. So it's conceivable that I missed a thousand B's in the '80s. No one will ever know, or care--including me."
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-cg80/in_howto.php"
