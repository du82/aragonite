["https://robertchristgau.com/xg/web/ew2intro.php"]
title = "Robert Christgau: Expert Witness: The Story Till Now"
full_description = '''I've been writing graded capsule album reviews since 1969, mostly for The Village Voice and, after the Voice fired me in 2006, MSN Music. By now I've logged 14,000 of them, some million words worth. These capsules were compiled more or less monthly in a feature called the Consumer Guide until 2010, when I converted to a twice-weekly blog dubbed Expert Witness, which MSN killed along with the rest of its freelance content in the fall of 2013. Now Medium will publish a version of that blog every Friday--a much looser version, because where MSN required me to produce two album reviews twice a week for a monthly stipend, Medium is welcoming whatever output I have to offer every Friday. Two or more album reviews seems like a good template, but as I get a feel for the new environment I'm sure I'll vary it. I'll usually append briefer reviews--Honorable Mentions, awarded three, two, or one stars rather than a letter grade--when they add context. Sometimes I may run all Honorable Mentions. But other permutations will arise. Sometimes I might even comment on a topic that doesn't have an album attached. Still, what most readers want from Consumer Guide/Expert Witness is the lowdown on what I call "A records," albums and EPs graded: A+ (the rare masterwork), A (the meat of my leisure listening), A– (at least two thirds the total), and B+ (too close to deny half a cigar). Because I was finishing a book when Microsoft shut me down, for a while I stopped grading albums altogether, but soon I found myself writing up a few for my own mental clarity. This kind of judgment is the gut and backbone, not just of my work but of my fandom--by the time I'm done writing a capsule, I know and understand the record in a way I didn't before, which readies me to revisit it in the future. This work is time-consuming, but also so much part of my life that I was thinking about blogging capsules gratis until Medium called. That said, getting paid has lit a fire under me as it usually does--I've been buckling down to a decision whenever I had a few hours ever since Medium took me on.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/web/ew2intro.php"
