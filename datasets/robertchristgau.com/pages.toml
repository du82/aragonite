["https://robertchristgau.com/xg/bn/2011-06.php"]
title = "Robert Christgau: Monster Anthems"
full_description = '''Even if you've never seen Lady Gaga on the small screen or listened consciously to a minute of her music, you've probably gathered that she isn't just, well, Britney Spears. Nor is she Katy Perry, Miley Cyrus, Rihanna, Beyonc�, or Christina Aguilera. All these artists differ markedly in content, persona, attitude, and musical worth. But they all have more in common with each other than they do with Lady Gaga. And that's because they're all celebrities. Obviously I'm playin' with ya here. Lady Gaga, whose Born This Way recently sold more copies in its first week than any album since 2005, is also a celebrity--by many accounts the biggest in the world. In Forbes's 2011 "Celebrity 100," in fact, she and her supposed $90 million income surpassed Oprah and her supposed $290 million income "because of her social media power." But of course the Forbes list is no less arbitrary and mind-numbing than any of the other Best/Worst/Hottest/Scuzziest/Greediest/Intriguingest countdowns with which massive media compete for stunted brainspace. As a baseball fan who has dabbled in the list business himself and a pop critic who had his life changed when Ellen Willis wrote the gorgeous and prophetic sentence "In the same sense that pop art is about commodities, Dylan's art is about celebrity," I am both appalled and abashed by these developments. The list was boyish fun, the complexity of celebrity an essential aesthetic insight. Over the decades, however, the culture industry has had its trivializing way with both. Defying these odds, Lady Gaga is complex. She's compared to Madonna not because both emerged from dance music but because nobody since Madonna has wielded celebrity so audaciously, a failure of collective nerve for which the pop singer who looked like a movie star is partly to blame. The visualization of music that began with MTV gave us other beauty queens--the still-fine Tina Turner, the then-exquisite Whitney Houston. But as history played out, all the pop dollies named above inhabit the world Madonna made--a world in which female vocalists are obliged to be far more glamorous than the "girl singers" who rose up after the big band bubble popped. However "attractive" they were, Doris Day, Patti Page, Jo Stafford, et al. didn't have to play the sex bomb.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bn/2011-06.php"
tags = ["anthems", "monster"]
