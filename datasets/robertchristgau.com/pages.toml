["https://robertchristgau.com/xg/bk-aow/column5.php"]
title = "Robert Christgau: Columns: November 1968"
full_description = '''Marvin Rainwater or no Marvin Rainwater, I assume it is emblematic of something when Buffy Sainte-Marie, a Cree Indian--in fact, if I am not being unkind, a professional Cree Indian, in the same honest sense that Dick Gregory, say, is a professional Afro-American--goes to Nashville, Tennessee (read: Music City, U.S.A.), to record an album of her own country-western songs. C&w is, after all, the white man's music. Yet the jacket is right in front of me, graced with a color photograph of Buffy, her characteristic ebony hair and uncharacteristic alabaster teeth gleaming with equal luster, her right eye hidden by a gray slouch hat that presumably goes with the title. Which is: I'm Gonna Be a Country Girl Again. Now, I believe Buffy when she insists that this effort is nothing more calculating or (ugh) commercial than a long-distance friendship with Chet Atkins, Nashville's elder gittar man. But not everyone can be expected to concur, especially down in Music City, where the record is doubtless taken as one more proof that good country music has taken over. I wouldn't be surprised if someone tried to marry her off to Marvin Rainwater--or Charley Pride. In New York this interpretation is subject to shrewd modifications on the order of: "Country music is happening, baby!" The industry is trend-hungry, and the best-hyped new thing of the year is America's rediscovery--like Sainte-Marie's "Again," the prefix is of dubious specificity--of c&w. The phenomenon, such as it is, is overdue. I began waiting for it almost three years ago, when I learned that country music dominated the jukebox at Max's Kansas City. A couple of years later I gave up, and sometime after that Bob Dylan released John Wesley Harding, which I take as signaling, if not actually causing, the present boomlet. For despite the hoopla, the revival is small as yet, nothing more than an inevitable accommodation. In this decade, especially since the Beatles, country music has been the victim of xenophobia. Theoretically, a hip college kid might prefer country culture (although c&w has long since left the country, it still expresses rural values) to that of his parents. When faced with the actual choice--usually while driving across Nebraska--he plays Perry Como (or nothing) in preference to Merle Haggard or Tammy Wynette. When rock and roll was achieving status in the midsixties, little was made of its debt to c&w, even though the Stones dug Gene Pitney, and Chuck Berry himself was a fan of Kitty Wells. Instead, blues roots were emphasized. But as Ray Charles made clear when he began recording country music almost seven years ago, c&w and r&b have much in common.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-aow/column5.php"
