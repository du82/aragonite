["https://robertchristgau.com/xg/bk-cg80/in_meaning.php"]
title = "Robert Christgau: CG 80s: Introduction: The Meaning of Rock"
full_description = '''That's one of the many questions this book will glance off without answering. It has everything to do with rock and roll but much less to do with the record reviewing that for more than twenty years has been the cornerstone of my criticism. To the extent that most artists' careers can be understood in terms of their musical output, and that as far as history is concerned this output will consist of record albums, the method still makes sense. But with Madonna a legitimate contender for rock hero of the decade, its limitations are definitely showing. I've always been relentless about consistency. Sure the lead cuts are great, I'd scoff, but can you name anything else on the record? To many discerning consumers, however, consistency is now at best a bonus--they want three good songs. The '80s were terrible for singles sales, but only in metal, rap, and new age (and rarely there) did albums go platinum without a promotional boost from a "hit" single. MTV is a singles medium, as is "adult contemporary" radio; even AOR devotes the contemporary portion of its programming to putative singles. Not counting dance DJs--who kept the single alive with twelve-inches but would groove to anything, the odd LP track included--the album's only significant new outlet was college radio. Nor would I swear any longer to the ultimate importance of individual artists' recording careers--of oeuvres and one-shots that as often as not emanate from safely outside the belly of the pop beast. Without doubt there's a sense in which rock criticism's subject has always been a cultural organism that doesn't generate fixed meanings--whose meanings are defined not just by artists (even collectively), but by "noncreative" workers in the distribution network and, crucially, by fans who convert product to their own uses. And while it's philistine to pretend that the music has no formal attractions of its own, that it doesn't produce works that impinge unaided upon those who know the language, it's evasive if not effete to make too much of the microcosm those works create.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-cg80/in_meaning.php"
