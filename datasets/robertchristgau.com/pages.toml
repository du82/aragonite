["https://robertchristgau.com/xg/bk-cg90/further.php"]
title = "Robert Christgau: CG 90s: Subjects for Further Research"
full_description = '''Barenaked Ladies: Humorous Canadian folk-rock group with name suggesting fascination/discomfort with s-e-x--oh great. But in a wide-open singles market where any hooky novelty had a shot, they scored a few. By the time I heard 1996's Rock Spectacle doubled as a de facto best-of, however, I'd skipped it (live album by humorous Canadian folk-rock group with name suggesting fascination/discomfort with s-e-x--oh really great). While indeed hooky, "One Week" wasn't humorous enough to change my ways. Maybe someday there'll be a real best-of. And maybe there won't. Frank Black: As the face of the Pixies, the former Black Francis was dandyishly to devilishly arch, epitomizing what people who can't stand "college rock" can't stand about college rock. So though the Pixies had more slash and burn than any art band between H�sker D� and Nirvana, Fran sorely needed the fierce musicianship of Joey Santiago and, I like to think, the sweet humanizing gravity of Kim Deal. On his own he's generated plenty of tune, plenty of 'tude, yet seemed silly anyway. If you were to start with 1998's Frank Black and the Catholics you might think better of him. The pseudo-Pixies comp lurking in his catalogue includes Frank Black's "Fu Manchu" and Pistolero's "So. Bay." Bongwater: This collaboration between performance artist Ann Magnuson and guitarist-entrepreneur Kramer had its moments--the acid "Kisses Sweeter Than Wine" was pretty mean. But Magnuson was never as funny as she was supposed to be, and the rock settings Kramer tossed off were trapped in the genericism they postmodernized, which is what he gets for thinking rock and roll is easy. The pair released four albums on Kramer's Shimmy-Disc label before learning to hate each other. In 1998 Shimmy-Disc vouchsafed us the four-CD A Box of Bongwater. Very conceptual. Boredoms: Never trust a band beholden to Metal Machine Music. Never trust a band who dare you to take their horrible name literally, either. I checked out random albums and concluded that this drone-prone Osaka avant-rock collective wasn't for me. I mean, if "ambient hardcore" and a concept where all titles include the word "Anal" are your kind of thing, maybe you should be consulting some other expert. But I liked their track on the Cosmic Kurushi Monsters comp, and, rechecking, I agree that 1990's Soul Discharge is kinda funny--and that 1998's Super AE has a ritualistic vibe. This must mean they're mellowing.'''
