title = "Robert Christgau: As I Get Old"
full_description = 'I�ve never been one to hope I die before I get old. In these sky-falling days, I merely hope I get old before I die. But there was a time when I chanted the Who�s bratty little mantra like every other kid clinging to rock and roll, as if the music�s noisy present could save me from any circumstances but its own. When I was young, I believed that Pete Townshend�s statement was what it seemed: a sneer of rebellion. Now, like the phrase itself, I am edging into middle age, and I can feel the trepidation beneath its cheek. Rockers hope they die before they get old because they�re not sure how to keep being themselves once they�ve lost their grip on immaturity. This isn�t a new problem any more. Weird old coots have become a category in rock, as dependable as preening peacocks and king snakes. Bob Dylan twirls his pencil moustache at death and keeps winning slathering devotion; Lucinda Williams hits menopause, and we still admire her leopard-skin leather jeans. Members of my indie generation have taken to making kids� records to keep up their Subaru Outback payments. This is a good thing, right? We want rock to help us through our whole long lives. Lately, though, I�m wondering if growing older makes all of us who�ve given our lives to rock, artists and fans alike, go through a strangely healthy kind of death. So many heroes are doing it so badly. Face lifts, paternity suits, endless reunion tours--from Jagger on down, it�s a shame. Ian Anderson wrote "Too Old To Rock and Roll, Too Young To Die" a quarter-century ago, and he�s still out flogging the Aqualung. Even Spinal Tap, a band created solely to satirize decrepit rockers, has been around for nearly 20 years. Graceful retirement isn�t an option when you make as little dough as do most musicians, even fairly famous ones. The occasional lucky one gets into soundtracks or production, but most keep hitting the road and hoping for an impossible second act. In the four years I spent in the trenches reviewing shows, comebacks took up a growing chunk of my schedule. I couldn�t figure out how to feel about them, especially when they involved personal faves. I loved moshing to X at Randall�s Island in 1998, half my lifetime after my first time seeing the band, but afterwards I sheepishly derided myself for it. Reading the concert calendar, I�d spy engagements for heartthrobs of my pubescence like the Psychedelic Furs and pray for a scheduling conflict, as if reviewing those former dream dates would be as uncomfortable as running into a regretted old beau. I don�t deny the validity of my adolescent taste--"Talk Talk Talk" still sends the blood rushing to my ears--but the emotions these artists first stimulated in me are at once so foreign and so fixed in my memory that I can hardly bear to summon them up. In youth, your favorite music�s hunger is your hunger. Later, it becomes an excess, fondly remembered, but to be avoided.'
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-fest/powers.php"
