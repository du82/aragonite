["https://robertchristgau.com/xg/bk-aow/columns.php"]
title = "Robert Christgau: Columns: June 1967"
full_description = "I ought to warn that I am one of the barbarians--I love rock and roll. Secular music, hell. I have been proselytized by Chuck Berry and Alan Freed, tempted by the Weavers and Thelonious Monk, regenerated by Phil Spector and the Shirelles, and transfigured by the Beatles and Dionne Warwick. I feel--and not with total justice, I'll admit--that rock and roll is popular music. Miles Davis and Cecil Taylor are fine. I like Ella Fitzgerald; I even like Barbra Streisand. But I love rock and roll. Yet what I used to like and what I like now are, almost, two different things. The original pastiche, ushered into ascendancy by greedy broadcasters who wanted to break the hold of the American Society of Composers, Authors & Publishers on radio profits, was fairly simple: varying portions of rhythm-and-blues and country-western, augmented by some primitive electronics and infused with enough pap, especially in the lyrics, to make it palatable to white urban teen-agers. The resulting big beat was ersatz, repetitious, sometimes imbecilic; it was also danceable and sexual and at its best had a vitality the ASCAP pros couldn't even approximate. Inevitably, the music became more complex--orchestration was added, gimmicks invented, and audio and recording techniques refined. And then the Beatles came along. Until 1964, rock and roll was divided along clear racial lines; only a few of the top performers, like Elvis Presley and Chuck Berry, came near to bridging the gap. The Beatles, and a few other English groups, did the impossible--sang black music their own way and made it work as something original. Maybe this was genius, maybe just freedom from sociological hang-ups. Anyway, they were a revelation in America, inspiring hundreds of groups that were neither grease (Connie Francis, Fabian, et al.) nor soul (black). Many of the new rock performers are fringe bohemians; they regard their music as self-expression first, vocation second. What jazz was to the beats, rock is to the hippies. In a way, that is good. In a way, it is very bad."
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-aow/columns.php"
