["https://robertchristgau.com/xg/dontstop/carter-25.php"]
title = "Robert Christgau: The Big Lookback: Jimmy Carter's Inaugural"
full_description = "This was originally published as free content, in Robert Christgau's And It Don't Stop newsletter. You can have Christgau's posts delivered to your mailbox if you subscribe. In 1976, a year and a half into a tour as a salaried editorial employee of The Village Voice that would last until an unimaginable 2005, I attracted the attention of my lefty colleagues by allowing as how I knew quite a bit about the fundamentalist Christianity of Georgia-based dark horse Democrat Jimmy Carter, who was vying with the likes of Jerry Brown, Mo Udall, and a biding-his-time Hubert Humphrey to run for president against Republican veep-turned-president Gerald Ford. My colleagues weren't all of Jewish or Catholic heritage, although most of them were. But they felt so much more comfortable with Jesuit-educated Brown and ex-Mormon Udall than with Southern Baptist Carter that I was assigned to write what proved to be a rather long essay on the fundamentalism I'd grown up with—and also, to be clear, rejected as a college sophomore beset by existential anxiety I had soon traded in on what another high-IQ going-on-ex Christian quickly convinced me to call not agnosticism but atheism. And then Carter beat Ford by a squeaky two percent, and the Voice as it was reconceiving itself needed someone to cover the inauguration. So as his defender of sorts I got the assignment. Rereading what I wrote half a century later, I'm struck especially by what a pivot point 1976 was for the left-identified but never quite activist '60s babies I at 34 and Carola at 31 still were. Not that we'd eschewed electoral politics—in the McGovern-versus-Nixon election of 1972 we drove elderly voters to the polls in the East Village. But our '60s orientation, which for Carola only fully began when she returned from London to a hyperactively radical-feminist NYC in 1969, still dominated our politics, which is why my inauguration piece is haunted by Yippies and other vanishing subspecies trying to prove they still had some mojo. Nonetheless, it was an interesting assignment in which my certifiable press bona fides and the connections of an old Dartmouth pal who was then working (all too briefly, it turned out) for Senator Adlai Stevenson III eased our way. We got bleacher seats for the inauguration itself on a sunny day where the temperatures were on the wrong side of 10 degrees. But as a rock critic dammit I focused on the music. Carola still remembers that Mercer Ellington's version of his father's band generated a groove so smooth even I could dance to it. And of course I stuck with atypically political country singer James Talley, whose albums I was one of the few critics to hype and who, ta-da, Rosalynn Carter dug so much she made sure he got his own slot at the festivities. I was right to get off a potshot at incoming HEW secretary Joseph Califano, whose anti-abortion stance remained all too staunch, although as it turned out he also made significant pro-gay rulings. As we're now reading everywhere, Carter's Christianity proved to have enough faith, hope, and charity in it to put into motion one of most humane post-presidencies in U.S. history—compared to the '60s left I still identified with, post-1980 he ended up putting more good in motion than just about any ex-president. I had no way of knowing that when I wrote this very much post-'60s piece. Then again, neither did anyone else except maybe Carter himself."
year_published = 2025
clearnet = "https://robertchristgau.com/xg/dontstop/carter-25.php"
tags = ["carter's", "inaugural", "jimmy", "lookback:"]
