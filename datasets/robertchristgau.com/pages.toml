["https://robertchristgau.com/xg/bk-aow/column6.php"]
title = "Robert Christgau: Columns: April 1969"
full_description = "April, 1969: kiddie music, singles and albums, middle-class soul, Biff Rose, miscellaneous, Stones and Beatles The old complaint that mass culture is designed for eleven-year-olds is, of course, a shameful canard. The key age has traditionally been more like fourteen. This makes sense for the entertainment industry--the fourteen-year-old is almost a full consumer, and because he no longer thinks of himself as a child, it is possible to treat him, willy-nilly, as an adult--and I suppose it is deplorable, but it behooves me, as Esquire's token youth cultist, to explain why. The trouble with mass cult is not that it must appeal to high-school sophomores but that it must also appeal their parents. Better one or the other. Left to themselves, the fourteens are as worthy a target as the thirty-fours--sometimes worthier--and in the end it is less pernicious to cater (as comic books do) than to level (as does television). Less pernicious, perhaps, but also less respectable. The people who program television are generally regarded with relative charity by those who regard such things--just fools who provide other fools with what they deserve. In contrast, those who make it their business to furnish diversion for the young( excluding professional educators, of course) have commonly been classed with white slavers and other seducers of the innocent. Until recently, this stereotype was applied with special gusto to denizens of the Brill Building, the record barons who conspire to foist their mindless caterwaul on the unsuspecting hope of America. In actuality, the conspiracy always invovled more guesswork than calculation. The small-label operatives who made rock and roll possible were no better at manipulating teen-agers than any other representative group of parents. Even when they dealt in payola they were only insuring (or trying to insure) that a specific release would hit; its unsubsidized alternative probably wouldn't have sounded much different. And it is significant that Brian Epstein, who perpetrated the greatest hype of them all, turned out to be promoting genius. There was exploitation of a sort, of course; in the classic pattern an alliance of producer, songwriter, and businessman would parley hunches about what the little bastards wanted into hit singles, and when the hunch happened to be embodied by a performer, he could be counted on to obey orders."
