["https://robertchristgau.com/xg/dontstop/love-24.php"]
title = "Robert Christgau: Defintions of Love"
full_description = '''This was originally published as free content, in Robert Christgau's And It Don't Stop newsletter. You can have Christgau's posts delivered to your mailbox if you subscribe. In the introduction to my 2015 memoir Going Into the City, I venture the likelihood that, like me, the "aging male music obsessives" who dominate my fanbase are adepts of what I dubbed "the uxorious way of knowledge"—who recognize and appreciate the degree to which their musical responses, observations, tastes, and ideas owed the sensibilities and intellects of their wives, consorts, and girlfriends. I was proud of that phrase, which I thought long overdue, and was disappointed that although my notices tended pretty good, only one reviewer cited it: a woman, Dana Stevens of Slate. I should add that although "uxorious" is an unusual word it just popped into my head when I was writing. "Wife-loving," sure—I've been flaunting my vocabulary since I aced the College Boards. And for that reason I never thought to look it up until a few weeks ago, when I was brooding casually about how "uxorious way of knowledge" had never won public notice from anyone except Dana Stevens. So I opened the Eleventh Edition of Merriam-Webster's Collegiate Dictionary atop my desk to U, and this is what I found: "excessively fond of or submissive to a wife." In other words: "uxor" equals "wife." OK, give her some credit—just don't overdo it. There are other not quite identical definitions, sure. Random House Unabridged, 1987: "doting upon, foolishly fond of, or affectionately submissive toward one's wife." Oxford English Dictionary, 1971: "dotingly or submissively fond of a wife; devotedly attached to a wife." Up-to-the-minute online Wiktionary, which has the advantage of not endangering your elbow when you pull it off a shelf: "very devoted and possibly submissive to one's wife"; "excessive uxorial devotion." Another online source suggests that "the female equivalent of uxorious" is "maritorious." (Really? At least there is one, I guess.) For the record, I poked around hoping against hope that some obscure Latinate adjective utilizing the root "matri" or maybe "femina" might serve the wife-positive function I'd attributed to uxorious. For sure there ought to be one. But alas, there isn't—at least, hint hint, not yet. Instead, I learned that the OED provides online charts mapping words' estimated frequency per "million words in modern written English" by the decade, in "uxorious"'s case from 1750 (0.20) steadily down to 2010 (0.03). Adjacent info indicates that John Milton was its most prominent fan, as in "That uxorious King, whose heart . . . Beguil'd by fair Idolatresses, fell To Idols foul." In other words, Eve was the one with the forbidden fruit. Never could get with Paradise Lost myself, and I'm proud to admit it.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/dontstop/love-24.php"
