["https://robertchristgau.com/xg/bk-cg80/in_post.php"]
title = "Robert Christgau: CG 80s: Introduction: Postpunk-Postdisco Fusion"
full_description = "In 1980, when I brought forth a comparable book about the '70s, I was untroubled by such dark thoughts. Taking for granted the theoretically depressing themes of fragmentation and the semipopular whilst thumbing my nose at '60s crybabyism, I argued that the '70s were when the music had come into its own: only after countercultural upheaval could individual musicians buck rationalization's conformist tide to create oeuvres and one-shots of spunk and substance in the belly of the pop beast. It helped that I got off on the '70s more than most rock and roll lifers--I thought Steely Dan and Lynyrd Skynyrd were great bands then, and I still do--and it also helped that the future looked bright. Just like some '70s-haters, I felt as if the punk insurrection had been designed to my specifications, unpredictability included. For all its antihippie rhetoric, punk meant to make something of a not dissimilar cultural upheaval, only without the '60s' icky, and fatal, softheadedness. From this vantage I can see that my confidence was bolstered by a consensus more sustaining than what I got out of Monterey or Woodstock or Chicago '68 or the Mobilization or any number of excellent Grateful Dead concerts. The core of this consensus was colleagues and correspondents of shared yet far-flung musical enthusiasms, its body and soul the cohort that materialized at any number of punk-etc. gigs. On the one hand, an inferred community of music-lovers cum discophiles; on the other, a lived-in community of music-lovers cum night people. Predicated here on a shitload of discrete sound-objects whose aesthetic was so legible you could build a canon around it, there on a burgeoningly inchoate scene that didn't shrivel up and die when the Sex Pistols quit on us. Predicated here on the biz, there on bohemia. For anybody who loved punk, 1980 was an exciting time, because punk's flakstorm, christened postpunk in the twinkling of a convolution, was still raging. Just like real revolutionary movements, punk was at its best before the world got it down, but that doesn't mean its diffusion into strictly musical issues was a perversion--a view now promulgated by true believers as well as dilettantes who've gone on to better things. Maybe John Rotten-Lydon hated rock and roll, but we loved the stuff--and we were sure we understood it better than the keepers of the pop machine. However, reduced our spiritual ambitions, the growing legions of postpunk fans and postpunk musicians were fighting all kinds of battles as the decade began--for airplay, for venues, for viable business structures. And by any reasonable standard we won those battles. Commercial radio is as reactionary as ever, but the college variety gets more music to more people than Tom Donahue ever dreamed. The painfully nurtured alternative club circuit is now so taken for granted that every breach in its integrity is bewailed as an attack on the natural order. And though the Record Industry Association of America didn't know it, there were more records available to the dedicated fan in the '80s than in the glut years of the middle '70s--certainly more of spunk if not substance. No one can know how many more only because no one sees all of them, not with the engine of production a profusion of sporadically distributed independent and import labels, many very specialized or local, for whom a run of five thousand spells a hit."
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-cg80/in_post.php"
