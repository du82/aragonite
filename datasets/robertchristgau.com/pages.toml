["https://robertchristgau.com/xg/dontstop/wussy-24.php"]
title = "Robert Christgau: Live From Cincinnati: Wussy"
full_description = '''This was originally published as free content, in Robert Christgau's And It Don't Stop newsletter. You can have Christgau's posts delivered to your mailbox if you subscribe. Everybody's incredibly exhausted right now. Many still stunned by an election that turned power over to an autocrat, waiting for unknowable things that could be coming. Many are still recovering from the pandemic, or burying friends and parents. Like Wussy, those of us who came to the music years ago contemplate communing with dead heroes as much as live ones going forward. Wussy are tired, too. At their first show in four years (other than acoustic shows that Chuck Cleaver and Lisa Walker have done together as Wussy Duo) they owned their fatigue, sharing their feelings with friends and family and fans who had come from various parts of the Midwest and beyond to see a great band play in their hometown, Cincinnati. Their eighth album and first in six years, Cincinnati Ohio is soaked in their midwestern gothic manner—earthbound and smoldering, a gloom that is born in leaky basements and collapsed garages, expressed by hometown monster movie hosts and bar tales. The scary things are real and multiplying. It is exhausting. I lived in Cincinnati for half a decade and this may be the best show I've seen them play. The Woodward Theater audience was full of local heroes: I spotted the record store owner who puts out their records and heard him say how surprised and happy he was when Cleaver said they had made a new one. Squeezing to the front with his wife and daughter was the law school professor and community radio DJ who has championed the band since they began, and in the back was the librarian who had commemorated the band in public art displayed in the building. Nobody was bigger in Cincinnati that night; when they tore into opener "Airborne," the response could not have been bigger for anyone playing in the entire state. And everybody seemed to know the fan who wore a sports jersey with the name Erhardt in block letters across his shoulders. That was a reference to the band's late pedal steel guitar John Erhardt, who died at the beginning of the pandemic.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/dontstop/wussy-24.php"
