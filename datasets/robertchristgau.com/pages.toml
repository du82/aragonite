["https://robertchristgau.com/u/cd/fiction/misunder-77.php"]
title = "A Misunderstanding"
full_description = '''I wake all night from dreams, delighted by three reprieves against the terrible morning. The waking must be to remind me: Don't forget the children or you shall go mad. Children simply wander through the ordinary dreams. Sam then stirs, says nonsense and I argue back with him for fun. "That's nonsense, Sam," I tell him firmly. It isn't Samuel but Sami Hassan. I've married him because he is Indian and quite wretched, a good boy, whereas I am rotten; though, of course, it isn't true, none of that, I'm simply arch enough to snap, which is the reason for the dreams and they do their job, apparently, for if I'm not mad now, when should I be? It's black as night when I draw the thin curtain and so cold I want to die at once. Sometimes I've squeezed so tight to keep my warmth in at night that I wake aching in my joints. Twenty-three years old! Next, I must see Sam out of bed or he might stay in all morning and miss work. He promises every day I don't need to see him put his feet on the floor but if I take him at his word he doesn't get up till noon and we simply can't afford for him to lose another job or we never shall leave this disgusting city. I set a cup of coffee on the night table and beg Sam to jump out quickly. "Please get up right now." He stares, rigid. He does not know who I am. I add formally, "This is London and I'm your wife. Get out of bed right now. Please," and I grip his shoulder till he starts to promise, but I haven't the time to listen through. "Please, Sam, please get up now, I haven't the time." Dazed, he swings his long starved legs to the cold floor and reaches for tobacco and papers, and I leave for school. He never gets up first, never. He still promises every Friday to shop for me Saturday, but by now I tell him, "Never mind, Sam, you know you won't and I don't really mind as long as I'm not counting on you to do it." But he insists, so I warn him, "Now if you say you'll get up, get up, but don't ask me to wake you. If you can't wake yourself up, only tell me and I'll shop, myself, because I'd rather shop than wake you up, that's no holiday for me." But he does promise and of course he's not up by noon, and the shops close before one, and if we don't shop then, we'll have no food in for the weekend and we can't afford to eat out and would be spending next week's dinner money if we bought from the high-priced, late-closing shops down the road, so I get up and slip out by myself. He's still snoozing when I come back an hour later with a cut in the palm of each hand from my two shopping bags. I wake him neatly with the morning paper, right in the face, and he bounces up like a ball: "What is it? What is it?" he asks.'''
year_published = 2025
clearnet = "https://robertchristgau.com/u/cd/fiction/misunder-77.php"
tags = ["misunderstanding"]
