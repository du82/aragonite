["https://robertchristgau.com/xg/bk-aow/cg1.php"]
title = "Robert Christgau: Any Old Way: Consumer Guide (1)"
full_description = "Unless you are very rich and very freaky, your relationship to rock is nothing like mine. By profession, I am surfeited with records and live music. Virtually every rock LP produced in this country is mailed to me automatically, and I'm asked to go to more concerts than I can bear. I own about 90 percent of the worthwhile rock albums released since the start of the Beatles era, and occasionally I play every one of them, although I haven't heard half the LP's in my collection in six months. All this has a double-edged effect. On the one hand, I am impatient with music that is derivative and see through cheap gimmicks easily. On the other, I can afford to revel in marginal differentiation, delighting in odd and minor talents that might not be worth the money of someone who has to pay for his music. Rock writers in general are so sick of the mediocrity and the bad hype that they simply don't listen to most of the records they receive. I try to, but my methods are necessarily somewhat mechanical. Even if I spent sixteen hours a day listening to music--I would estimate the actual figure, by the way, at around eight--I couldn't give each group the time each group believes its record deserves. So I tend to make a lot of snap judgments, sometimes based on decidedly extramusical criteria (like what label it's on, or what the group looks like), and since I believe that rock is supposed to grab you, I demand that groups I haven't heard of--and most of those that I have--do just that. I divide my life between two apartments. One is equipped with an excellent stereo system, the other with a pretty good portable. In the first I store records I really like--the permanent collection. In the other I store records I kind of like or think I kind of like or think I should hold on to--the reference collection. After I lug the day's haul home from the post office, I divide it immediately into three categories: Maybe, Conceivable, and Forget It. Maybes are placed near the good sound system; the rest are transported to the second apartment and placed in either a sell pile or a listen pile. Maybes I have usually been hyped on somehow (some of them are really Certains) or else look interesting. Records from the relatively dependable labels--Warner Bros., Atlantic, Columbia, Stax--are usually Maybes. The Forget It category includes movie soundtracks, third-rate country artists, most straight pop and soul jazz. Conceivables are everything in between. I play every rock record I receive at least once."
