["https://robertchristgau.com/xg/web/ack.php"]
title = "Robert Christgau: Acknowledgments"
full_description = '''Robert Christgau and Carola Dibbell wrote and directed the content on this website, without which it would be nothing. Tom Hull did a lot of work on this web site: wrote the software, collated most of the content, typed in quite a few older articles and reviews, wrote the HOWTO and some other pieces, not to mention the amateurish graphic design. He also answers most of the webmaster mail. Joe Yanosik helped find a number of mistakes in the content, shared his extensive bibliography of Christgau articles, and has retyped a number of hard-to-find articles, and forwarded many photocopies. Other folks who have retyped articles, consumer guides, and helped sort out the bibliography include: George Allan, Allen Belz, Robert Jon Brown, Jonathan Culp, Tim Dabareiner, Scott Manzler, Michaelangelo Matos, Bradley Sroka, John Tiglias, Harold Wexler, and Stanley Whyte. And others who have helped out by sending in photocopies of articles: Cam Patterson, James Talley, John Tiglias. The corrigendas to the CG books and other error corrections have benefitted especially from the sleuthing of: Allen Belz, Len Blanks, Pat Buzby, Jonathan Culp, Bob Evans, Lucas Fagen, Jesse Fuchs, Andrew Hamlin, Philip Howe, Roy Kasten, Jim Kiest, Steve Rubio, David Schweitzer, Pete Shanks, Jenkinsom Smith, Liam Smith, Peter Stenhouse, Ken Stillman, Michael Tatum, Stanley Whyte, and Joe Yanosik. Jeff Salamon provided the essays and details for Don't Stop 'til You Get Enough, and we'd like to thank the authors for their permission to reprint sections. Other people should no doubt be mentioned here, especially those who have made suggestions, pointed out typos (or much worse errors), or just asked questions that spurred us on. Although we've made quite a bit of progress toward collecting Robert Christgau's early work, there is still a lot of work to be done. If you would like to help out, one thing you can do is to join the email list of what Christgau has called "a small cybercoterie of devoted fans." To sign up, change your address or unsubscribe, please bug the webmaster. See also the helplist file.'''
year_published = 2025
