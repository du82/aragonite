["https://robertchristgau.com/xg/bk-aow/excreed.php"]
title = "Robert Christgau: What Ever Happened to Creedence Clearwater Revival?"
full_description = '''I was curious, so perhaps you are too: "Goodbye Media Man," Tom Fogerty's first single as a single, is unextraordinary musically, simplistic lyrically, and also Tom doesn't sing too good. Part II is better than Part I, should you run into it on a jukebox in Lodi; it's also shorter and has less words. Get back, Tom. Creedence Clearwater Revival: Mardi Gras (Fantasy). Creedence is no longer a one-man band, which has disoriented a lot of John Fogerty fans, myself included, but once you get used to the new group, which is really what using Doug Clifford and Stu Cook to compose and sing amounts to, it sounds as good as the old, and potentially even better. A minus. Tom Fogerty (Fantasy). This is not quite incompetent, but it is exceptionally unoriginal--even a pretension or two would be welcome. Good thing identity crises weren't so fashionable in the days of David and Ricky Nelson. D. Doug "Cosmo" Clifford (Fantasy). Some of "Cosmo's" work on Mardi Gras sounded promising, but he must have been fibbing. Docked a notch for time: 27:32. D. It's official: The members of Creedence Clearwater Revival, which only two years ago was the most successful American band in the world, have decided to pursue separate careers. John Fogerty's current project is producing a seven-man band called the Blue Ridge Rangers. Strange thing is, all seven profiles on the dust jacket look just like John Fogerty. Chances are the Blue Ridge Rangers will never pursue separate careers.'''
year_published = 2025
