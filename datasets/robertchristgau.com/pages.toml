title = "Robert Christgau: CG '70s: Missing Consumer Guides"
full_description = "The following records were released in the 1970-1979 timespan of Christgau's Record Guide: Rock Albums of the '70s, but were not included in the book. In most cases these are outside the scope of the book. Some artists moved to Subjects for Further Research. Some were dropped for negligible interest. And some were reviewed after the book deadline. This list is sort of a first pass. It is limited by the fact that we have very few non-book consumer guides online. Please let us know if you find any errors or omissions. Note that while the Consumer Guide started in 1969, records that were released in 1969 were omitted from the book. For those records, see Consumer Guide Index by Year: 1969."
