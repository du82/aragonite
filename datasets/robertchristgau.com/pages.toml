["https://robertchristgau.com/xg/bk-fest/contribs.php"]
title = "Robert Christgau: Contributors"
full_description = '''Marshall Berman, author of All That is Solid Melts Into Air and Adventures in Marxism, teaches at CCNY/CUNY. He is currently working on One Hundred Years of Spectacle, a book on Times Square whose earliest incarnation was a Village Voice article commissioned by Bob Christgau. Perry Brandston lives at the opposite end of 12th Street from Robert Christgau. He doesn't even know what emo is. Tom Carson is a former staff writer for LA Weekly and the Village Voice and the current "Screen" columnist at Esquire. His novel Gilligan's Wake will be published by Picador in early 2003. Georgia Christgau writes when she can and teaches English at an alternative public high school in New York City. Debra Rae Cohen is Visiting Assistant Professor of English at the University of Arkansas in Fayetteville, where she is learning to garden, among other non-New Yorkish pursuits. She is the author of Remapping the Home Front: Locating Citizenship in British Women's Great War Fiction (Northeastern University Press, 2002). After highly educational stints as a New York-based talent scout for A&M, Columbia and RMM Records, Carol Cooper still freelances for various domestic and foreign publications, along with running her tiny music-publishing company, Nega Fulo Music. She also intermittently releases indie records and small-press publications through her own imprint, Rhythm Tattoo Productions. Carola Dibbell publishes rock criticism sporadically and fiction rarely. She lives in the East Village with her husband, Robert Christgau, and their daughter, Nina. Julian Dibbell writes about technology and culture. He is currently a visiting fellow at Stanford University's Center for Internet and Society. Jon Dolan is a senior associate editor at Spin. He lives in Manhattan where he avidly supports the Minnesota Twins and fondly recalls the womb. Steve Erickson is the author of six novels, including Days Between Stations, Arc d'X and The Sea Came In at Midnight, which have been published in ten languages, and two books on American politics and popular culture. He writes the film column for Los Angeles magazine and teaches at the California Institute of the Arts.'''
