["https://robertchristgau.com/xg/bk-cg70/dnce.php"]
title = "Robert Christgau: CG 70s: Distinctions Not Cost-Effective"
full_description = '''Rick Derringer: The first cut on his solo debut was called "Let Me In," and it should have. Later he started trying to knock down the door. Earth Quake: Their "Friday on My Mind" (on Beserkley Chartbusters) cut Bowie and the Easybeats. The rest was Saturday-night swindle. Gentle Giant: The first "progressive" band ever produced by a "progressive" radio programmer--AOR theoretician Lee Abrams, who was to the '70s what Mitch Miller was to the '50s. The Grass Roots: I found only one of their many hits tolerable--1967's tragically inaccurate "Let's Live for Today." Sammy Hagar: He covered Patti Smith's "Free Money." He also covered Donovan's "Catch the Wind." And this is a heavy metal guy. Peter Hammill/Van Der Graaf Generator: Jon Pareles argues that if we honor high school punks we should also honor high school poets. I say we stick to high school punk poets. Paul Kelly: One great song--"Stealin' in the Name of the Lord"--was good for a decade's worth of rep. And the song wasn't all that great. The Manhattans: I recommend their 1980 best-of, but for albums I'll take the Chi-Lites. Or the Detroit Emeralds. Maybe even Boston. The Moody Blues: In 1970, while under the influence of marijuana and my new Toyota, I bought "Question," which sure beats Mantovani, reportedly their greatest influence. Giorgio Moroder: As a solo artist he was the Ross Bagdasarian of his time, but without Alvin Chipmunk who could care? The Partridge Family: At least the Osmonds were a cultural presence. All David Cassidy had going was nice nipples and prime time. Pearls Before Swine/Tom Rapp: I never understood who they/he thought they/he were/was throwing their/his accretions at/before. Renaissance: Truly pseudo-genteel art rock--they get into the country club, where the Moody Blues would be blackballed by some opera-lover. REO Speedwagon: When the banality achieves a certain density, I thought, velocity no longer matters. Then they began to score hit ballads. Cliff Richard: Everyone knows the only great rock 'n' roll record ever to come out of England was by Lonnie Donegan.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-cg70/dnce.php"
