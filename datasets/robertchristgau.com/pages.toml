["https://robertchristgau.com/xg/bk-cg70/decade.php"]
title = "Robert Christgau: CG 70s: The Decade"
full_description = '''The decade is of course an arbitrary schema itself--time doesn't just execute a neat turn toward the future every ten years. But like a lot of artificial concepts--money, say--the category does take on a reality of its own once people figure out how to put it to work. "The '60s are over," a slogan one only began to hear in 1972 or so, mobilized all those eager to believe that idealism had become passe, and once they were mobilized, it had. In popular music, embracing the '70s meant both an elitist withdrawal from the messy concert and counterculture scene and a profiteering pursuit of the lowest common denominator in FM radio and album rock. But soon after this process began, the spectre of the previous decade was invoked to rather different ends. Nascent punks reviled the '60s because they had spawned the '70s, blaming the excesses and dishonesty of hippiedom for everything softheaded, long-haired, and piggy in rock industry grown flatulent beyond its greediest fantasies. If the '60s were over in 1972, the '70s were in trouble by 1977. Don't get me wrong--the Eagles and Foreigner and Earth, Wind & Fire are, er, survivors. Good or bad they're careerists, they jog two miles a day, and they're all destined to outlast the Ramones. But you don't get the sense that these quintessential '70s bands conceive themselves as '70s bands. After all, what kind of a distinction is that? Rock may have turned into a multibillion-dollar industry in the '70s, it may have doubled its market in ten years, but at the same time it suffered a loss of cultural prestige that not even a trade magazine could twist with statistics. Maybe the Bee Gees became more popular than the Beatles, but they were never more popular than Jesus. Insofar as the music retained any mythic power, the myth was self-referential -- there were lots of songs about the rock and roll life but very few about how rock could change the world, except as a new brand of painkiller. Jerry Brown and Jimmy Carter--Jimmy Carter!--exploited the music to youthen up their images, not to affect opinion; even the antinukers acted more like bait than inspiration. And by most people's standards, a rough matchup of '60s and '70s artists--Smokey Robinson vs. Gamble & Huff, Bob Dylan vs. Neil Young, the Beatles vs. Rod Stewart or Stevie Wonder or Elton John or Linda Ronstadt or Fleetwood Mac (or some combination of the five), the Stones vs. Led Zeppelin, Aretha Franklin or Sam Cooke or Otis Redding vs. Al Green, James Brown vs. James Brown, Jimi Hendrix vs. God, Sly Stone vs. George Clinton, Lou Reed vs. Johnny Rotten--pits genius against talent again and again.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-cg70/decade.php"
tags = ["decade"]
language = "en"
