["https://robertchristgau.com/xg/bk-aow/airplane.php"]
title = "Robert Christgau: Any Old Way: We Should Be Together"
full_description = '''For the past few weeks I have attended the Alternate U.'s course in Rock and Revolution. If that sounds like a dubious enterprise to you, you're right, and the radicals in the course know it--but they gotta try anyway. Roughly speaking, their purpose is threefold: to analyze how capitalism perverts and vitiates rock, to envision how the music might change in a less exploitative system, and to implement those changes. Since I believe rock embodies many of the virtues of capitalism as well as some of its faults--rather than containing the seeds of the New Culture--my objections to the analytic approach ought to be obvious. But the specific targets of the action projects--the concert scene, the Woodstock ripoff, support for local bands--are good ones, at least in theory. I think Warners ought to give a print of Woodstock to the Movement, but I don't think this goal is best accomplished by calling Jack Warner a pig before spitting ritually in his eye--especially since Warners is now owned by Kinney and Jack Warner is dead. A few days before the Panther demo in New Haven, several R&R students tried to convince Jefferson Airplane to come to New Haven and abandon its Fillmore-sponsored free Sunday concert in Central Park, which it was feared would split that mysterious entity radicals refer to as "the community." Reportedly, this request caused some consternation in the band, with Grace and Marty tempted and the others reluctant. The objections were more tactical than political--where another group might have questioned the purpose of the demonstration itself, the Airplane apparently raised a smokescreen of petty and paranoid reservations. Now, rock musicians do have reason to worry about being used by politicos: many movement people regard rock as bait, nothing more. That wasn't the case this time, however. Anyway, the Airplane not only has revolutionary pretensions, it sells them. Saturday night the Airplane played Stony Brook, where Grace reportedly berated the audience for not being in New Haven. They were in Central Park Sunday. As it turned out, the demonstrators were already home. Abbie Hoffman tried to take the stage but was beaten off by a few greenshirt heavies. Thursday night I went to see the Airplane at the Fillmore East. I was stoned and didn't try to take notes, so what follows is in a sense my fantasy. It always is anyway. This sure was a strange one.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-aow/airplane.php"
