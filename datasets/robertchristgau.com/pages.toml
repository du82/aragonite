["https://robertchristgau.com/xg/bn/2009-12.php"]
title = "Robert Christgau: Not So Misterioso"
full_description = '''November 1959, say. Four or five of us sit around the medium-fi record player in Dartmouth's College Hall. Sandy Lattimore, poet son of classicist Richmond and the guy who dubbed me Xgau, is spinning Thelonious Monk's Misterioso, recorded live at the Five Spot on Cooper Square in 1958. The special source of his beaming, chortling delight is Johnny Griffin's tenor solo on "In Walked Bud," which 50 years later remains this fireman's son's favorite five minutes of recorded music. June 1960. At 18, I am old enough to go to bars in NYC. I celebrate abstemiously in the cheap seats (a buck? two bucks?) of the Jazz Gallery on St. Mark's Place, where the bill is shared--you could look it up--by the Thelonious Monk Quartet and the John Coltrane Quartet. I see Monk many times here. Charlie Rouse always plays tenor, with Monk comping and dancing. July 1960, as I recall. A British salesman at Sam Goody's advises Brilliant Corners over Misterioso. Objectively, he's right. I all but memorize Brilliant Corners. But in the end I prefer Misterioso. September-October 1964. The Jazz Gallery has folded and the Termini brothers have moved the Five Spot up to the corner of Third and St. Mark's. A friend with a nearby sublet spends late evenings outside the club's open windows, listening to Monk. Sometimes we park ourselves on the garbage cans in the St. Mark's Hotel next door. Once or twice I pay the minimum inside. Still Charlie Rouse on tenor. I caught Monk live after that, but it stopped being so personal. He was beginning to dry up and rock was beginning to flower; also, I had a girlfriend who countered my impolite distaste for folk music with an impolite distaste for jazz. Only then, two years before Monk disappeared to spend his last six years in silent seclusion, editing Gary Giddins at The Village Voice got me back into jazz. A girlfriend who liked jazz helped as well. Monk's "Tea for Two" was on our wedding tape, and Misterioso proved a lifetime companion. One could even say Monk is my favorite artist. I have myself.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bn/2009-12.php"
