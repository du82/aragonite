["https://robertchristgau.com/xg/bkrev/holiday-nat.php"]
title = "Robert Christgau: The First Lady of Song: Billie Holiday"
full_description = '''As with Frank Sinatra, as with Aretha Franklin, as with Elvis Presley, as with George Jones, as with Nat King Cole, as with Sarah Vaughan, as with Johnny Cash, as with Al Green, as with Kurt Cobain, as with--unfortunately, but it must be said--Snoop Dogg, coming to terms with Billie Holiday means penetrating an unfathomable mystery: her voice. To one extent or another this holds for most good singers, and my list--while politely making room for Vaughan and her gravitas in addition to the odious Dogg--is limited by age, happenstance and personal bias as well as the need to stop somewhere. For instance, it excludes the "classical" tradition, whereas Roland Barthes's seminal 1972 essay "The Grain of the Voice" was inspired by lieder specialist Dietrich Fischer-Dieskau, who Barthes reported "reigns more or less unchallenged over the recording of vocal music," as if Billie Holiday, Frank Sinatra and for that matter Edith Piaf had never existed. Nevertheless, it is in popular music, so much less stringent as to technical standards and so much more invested in performer mystique, that grain reigns. That Billie Holiday was blessed with an extraordinary instrument isn't immediately apparent even to those who admire her. As Henry Pleasants put it, she had "a meager voice--small, hoarse at the bottom and thinly shrill on top, with top and bottom never very far apart." And what little she had she wrecked. When I discovered her in 1959, she had died a few months earlier at 43, so like most of my contemporaries, I formed my bond with the Holiday the rock critic Carol Cooper calls "our lady of perpetual suffering." By the mid-1950s, her timbre often cracked and her melodies sometimes staggered, especially on off-label live recordings like the one I bought. If you'd asked me why I liked her, I would have cited her ability to contain pain (only then I would have made the verb a bald and inaccurate "express"), her sly improvisations (which often prove less radical than that truism implies) and her "swing," a concept that like "flow" in hip-hop covers up a myriad of inexactitudes--Holiday's time in particular is a wonder that resists analysis as unflappably as her sound. These were and continue to be the standard answers, and they're all essential to her matchless achievement. But they don't nearly explain her fascination.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bkrev/holiday-nat.php"
