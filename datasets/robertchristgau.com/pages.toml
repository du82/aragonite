["https://robertchristgau.com/xg/dontstop/newman-25.php"]
title = "Robert Christgau: A Few Words in Praise of Randy Newman"
full_description = "This was originally published as free content, in Robert Christgau's And It Don't Stop newsletter. You can have Christgau's posts delivered to your mailbox if you subscribe. From his Los Angeles Times stronghold, Robert Hilburn spent 35 years as one of America's most prominent rock critics, and since his 2005 retirement has kept at it with the first-rate collection Cornflakes With John Lennon and four biographies. Of the first three of these I admired the far-reaching and thorough Johnny Cash while never getting around to the Paul Simon and assuming the Springsteen has been outflanked. But I opened his 455-page A Few Words in Defense of Our Country: The Biography of Randy Newman as soon as it arrived in the mail, and not just to see how well the graf Hilburn asked me to chip in came out. I craved the facts and insights I hoped and believed Hilburn would provide, and I wasn't disappointed. Unlike Cash, Simon, and Springsteen, Newman is an Angeleno, long may they survive (his roots are in Pacific Palisades itself). And crucially, he's also the scion of what in L.A. terms is a matchless musical family—three of his uncles were major soundtrack composers, with Alfred Newman winning nine Oscars and nominated for, wow, 45. Hilburn quickly establishes not just how deep the roots of this family tree are, but how sturdily they underpin his social and business connections, even tracking a friendship going back to first grade with biz kid Lenny Waronker, who ended up running Warner Records as well as producing or co-producing all but three of Newman's 12 studio albums. As boys the two were even deeper into baseball than music, which as Hilburn makes clear typifies how Newman's mind works. Sure music is deeply ingrained and always there. But immersed in it though he is, he's also a cultural sponge, a voracious reader and television addict as well as a sports fan. Thus he's always been among other things his own species of protest singer, far broader both musically and intellectually than the leftwing guitar strummers who pioneered that term but much more ironic, unafraid to risk what is crudely called political incorrectness. Thus the title Hilburn arrived at for his biography, lifted from a track on Newman's 2008 Harps and Angels, one of just two 21st-century albums-as-albums (as opposed to 2016's odds-and-ends/greatest moments comp The Randy Newman Songbook Vol. 3), the other being 2017's foolishly underrated or just ignored Dark Matter, top 10 for me that year and 13th in Rolling Stone but not even top 50 at Pitchfork or NPR."
year_published = 2025
clearnet = "https://robertchristgau.com/xg/dontstop/newman-25.php"
