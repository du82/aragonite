["https://robertchristgau.com/xg/bn/2010-06.php"]
title = "Robert Christgau: Who Knows It Feels It"
full_description = '''As Chris Salewicz's Bob Marley: The Untold Story isn't the first to report, many human beings worldwide--he cites Hopis, Maoris, Indonesians, and of course Africans--regard Bob Marley as a "Redeemer figure coming to lead this planet out of confusion," and some consider him nothing less than the literal second coming of Jesus Christ. Say what you will about the adoration accorded John Coltrane, John Lennon, Elvis Presley, Michael Jackson, Um Kulthum--this is another order of iconicity. Say what you will about the religious dimensions of pop fandom--Marley's Rastafarianism renders the metaphor literal. These mystifications bode ill for Marley's biographers, who number at least 15 or 20 by now. Take for instance Stephen Davis, who closes with two triple-indented lines: "Bob Marley lives. He's a god./'History proves.'" And Davis's bio is one of the good ones. Maybe it's the ganja--well, definitely it's the ganja, with its built-in third eye, its aura of secret significance. More fundamentally, though, it's the transport, the release--the suprarational rewards music lovers love music for, which Marley claims are owed solely to the divinity of the Ethiopian autocrat Haile Selassie. Who are we to gainsay him, especially we white Babylonians? He has bestowed upon us this feeling of transcendence, and not only that, articulated a political consciousness that needs articulating. "I remember on the slave ship/How they brutalized our very souls/Today they say that we are free/Only to be chained in poverty" might not turn many heads at a socialist scholars conference, but by pop standards it's a smart, blunt, hard-headed augury of militance. As a result, many all too readily suspend their disbelief when the politics turn out to herald twistier "reasonings," as Rastas call their stoned biblical bull sessions. So when I noticed Salewicz embellishing his first-chapter account of Marley's fatal cancer with matriarch Cedella Booker's conspiracy theories and backup singer Judy Mowatt's lightning-bolt premonition, I said uh-oh. But these were feints. Davis's Bob Marley is wrenching on Marley's final months, Timothy White's Catch a Fire provides unmatched blow-by-blow on the Marley estate, and both bring their own details to the life story proper. But Salewicz's book is faster, fuller, and fairer than either. It's faster because through plenty of incident it sticks to the story, a welcome improvement on Salewicz's bloated 2007 Joe Strummer bio. It's fuller due not to Salewicz's relatively late and limited personal contact with his subject, but to the spadework of the 11 other biographers he cites, the low-lying fruit he picked up during two years of living in Jamaica, and what looks from here like some plain old digging. As for fairer, well, Salewicz admires Bob Marley deeply without deifying him. That's what I call reasoning.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bn/2010-06.php"
tags = ["feels", "knows"]
