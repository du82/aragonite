["https://robertchristgau.com/xg/bk-aow/cg31.php"]
title = "Robert Christgau: Any Old Way: Consumer Guide (31)"
full_description = '''Despite the proliferation of A records this month--three of them--I have settled on a depressing thesis: I don't believe artists are trying to make good albums any more. The basic reason is a lack of material. Every time a group breaks up or a leader goes solo, not only does a lot of collaborative experience go out the window, but the songwriting talent thins out. The record companies don't care, though, because they know that albums have been established as the basic "artistic" units of the music. This once seemed like a useful idea, but it has turned into a commercial fiction, just like the autonomous power of the "artist"-star. All the companies want is product. An artist with a lot of charisma--which is to say, an artist who is willing to break his ass touring a couple of times a year--can count on a core of fans who will buy three or four mediocre albums before they wise up. All that is necessary is two or three cuts that are good programming, AM or FM, and a moderately intriguing stage act that can be reduced by plastic. Shades of payola and the fabulous fifties, and where does it all lead? Into the shit. Tune in next month for more depressing prognostications. Eric Andersen: Blue River (Columbia). I was ready to discard this, but because it was so pretty I suffered second thoughts, which is too bad for both of us. In 1967 Andersen sounded like early electric Dylan, so now he sounds like . . . James Taylor. He's honest enough to back himself with a girlie chorus, but that's as far as his honesty goes. If I'm liable to run into noodleheads like Andersen walking down some country road, I'll have more fun in Central Park. C. Marc Benno: Ambush (A&M). In a lot of ways this is a perfect record--easy studio funk unmarred by a single error of commission. Benno does Boz Scaggs a lot looser and happier than Boz Scaggs has for a while, and Bobby Keys stands out among the sidemen (Radle, Keltner, Utley) only because he's never sounded better. It's even divided into a dance side and a listening side. Yet I no longer trust such basically unthinking supercompetence to provide lasting pleasure. Anyone who doesn't share my reservations should probably buy this, and even if you do--well, I keep playing it. B plus.'''
year_published = 2025
