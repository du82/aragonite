["https://robertchristgau.com/xg/dontstop/newman2-25.php"]
title = "Robert Christgau: The Big Lookback: Randy Newman"
full_description = '''This was originally published as free content, in Robert Christgau's And It Don't Stop newsletter. You can have Christgau's posts delivered to your mailbox if you subscribe. Although I no longer recall when I first got wind of Randy Newman, I do remember who first assigned me to write about him—Russell Sanjek, a sweetheart of a veteran pop music journo whose laborious three-volume American Popular Music and Its Business I panned respectfully, regretfully, and posthumously in 1989. I met him circa 1969, around the time I was transitioning from my Secular Music column at Esquire to Rock & Roll & at The Village Voice, when as editor of the BMI house mag he asked me for a one-page brief about this up-and-coming Newman fella whose eponymous 1968 album, if I'm lucky enough to have the timeline right, I already admired, and whose 1970 12 Songs I was destined to give an A plus. So I interviewed Newman in his modest Studio City corner house, after which we played one-on-one basketball in a nearby park. Although he had several inches on me, I did hustle some rebounds. Sad to say, I don't remember who won. Unfortunately, that BMI piece hasn't surfaced in my files. But Newman and I had gotten along fine, and when he came through New York in the fall of 1972, when I was well into my tour as the pop music critic at Newsday, I was more than happy to beef up a critical piece with an interview, not normally my preferred m.o. Note FYI that my sole review of Tom Rapp's Pearls Before Swine went "I never understood who they/he were/was throwing their/his accretions at/before" and that my David Ackles C minus read "'I won't get maudlin,' Ackles promises midway into the second side, locking himself in the barn as the dappled stallion gallops to join his brothers and sisters on the open range with his mane flying free in the breeze." There were certainly much better singer-songwriters than those two saps, including a few L.A. buddies who Newman would hook up with occasionally throughtout his career. But because that was the kind of treacle too many late folkies trafficked in, it was gratifying to resort to Newman as their opposite number even if it was too bad that his very excellence seemed destined to keep him off the singles chart.'''
year_published = 2025
