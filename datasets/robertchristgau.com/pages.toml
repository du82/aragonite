["https://robertchristgau.com/xg/bk-cg80/in_mproc.php"]
title = "Robert Christgau: CG 80s: Introduction: Music Processing"
full_description = '''That was rock in the '80s, all right. But for better or worse, this isn't a book about rock in the '80s. It's a book about rock records--rock albums--in the '80s, and the '80s have taught us (hammered home the old truth, really) that records don't equal rock and roll. Which doesn't mean, unfortunately, that a book about the records of the '80s is immune to the aforementioned complications. There's no way any decent critic can respond to records without bumping up against every one of them now and then. But there's also no way a mere record reviewer can address them systematically. If this guide isn't fun, I should go into another line of work. But for sure it's always partial and often contradictory. And though I don't believe it's incomprehensible, I'd never claim it was comprehensive. Every month I write capsule reviews of 20 albums and arrange them alphabetically by artist into a Village Voice column called the Consumer Guide. Those columns are the basis of this book. Mostly I cover "rock," but I've felt free to wander ever since falling for Terry Riley's A Rainbow in Curved Air in 1970, and in the '80s, with categories crumbling all around me, I wandered plenty: in addition to "accessible" "downtown" "classical" items, relevant (note fudge-word) jazz, and hard-edged or crossover-prone country, all of which I'd been paying some heed since the middle '70s, I dipped early and often into the international musics that trickled then flowed my way. But by no means did my tastes prove catholic or impartial--they wouldn't be tastes if they were. I've never really gotten salsa, and to this day the only Caribbean or Latin American music I know well is reggae, although albums from Trinidad and Cuba and the Antilles and Haiti and Brazil and Argentina and Colombia and Chile and El Salvador have won my heart. And though China and Algeria and various European countries are represented, you'll hardly notice them amid the dozens upon dozens of records from sub-Saharan Africa, which for me proved the decade's great untapped pop mine.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-cg80/in_mproc.php"
