["https://robertchristgau.com/xg/bk-cg70/criteria.php"]
title = "Robert Christgau: CG 70s: The Criteria"
full_description = '''When I became a critic, I believed in the magic that could free my soul--through the modern miracles of mass production and marginal differentiation, rock and roll seemed capable of giving me pleasure for the rest of my life. And it probably will. But if late-'70s power pop proved anything, it's that the best melodies and snappiest beats don't in themselves guarantee spontaneity, innocence, discovery, conviction, youthful lyricism, youthful anger, or democratic aura. The best artists have nurtured rock and roll's connection to all these things by opening up their music and their audience--myself included. It's not enough for me simply to identify my musical preoccupations as beat, electricity, and song--rock and rollers keep revealing new possibilities in apparently transparent forms. But it's a good start. In 1967 I was addicted to the r&b backbeat, sometimes whitened and/or mechanized, sometimes softened with a Caribbean fillip. Now I listen for, and am turned on by, rhythm (especially polyrhythm, in funk and the great world outside), repetition (rock as electronic trance music and vice versa), and tempo (faster, faster). That's what I mean by beat. Electricity comprises perfectionism (studiomania in the manner of Steely Dan or the great L.A. producers at their young best), power (as orchestrated by the few worthwhile heavy metal bands as well as many raving punks), and galvanic noise (investigated most fruitfully by guitarists, although explorers from other fields like Gram Parsons, Philip Glass, and Miles Davis have taught us a lot. Song is most of what's left. Alec Wilder, that renowned connoisseur of "American popular song," claims that it pretty much died around 1950, so I guess I'm attracted to something else. Maybe it's streetsong, or electric folksong, or (forgive me) songpoetry, or just American semipopular song, a neat term that unfortunately sounds too arty. For if the '70s taught me to respect the idea of songpoetry, they also taught me to treasure the common wisdom of the pop lyric.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-cg70/criteria.php"
