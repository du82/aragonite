["https://robertchristgau.com/xg/bk-aow/eagles.php"]
title = "Robert Christgau: Trying to Understand the Eagles"
full_description = '''The Eagles--Glen Frey, Bernie Leadon, Randy Meisner, and Don Henley--are the tightest and most accomplished rock band to emerge since Neil Young's Crazy Horse. The usual compilation of credits--Poco and the Burritos and the Stone Canyon Band, Bob Seger and Linda Ronstadt--does not mean the usual compilation of disgruntled sidemen doing battle with their own well-deserved anonymity. The difference is partly chemistry--the Eagles are an organic group, not a mixture of musicians--but mostly raw talent. These guys can execute. Not only do they all sing and compose, which is nothing new--they're good at it. The Eagles are a culmination of the vaguely country-oriented mainstream of American rock. Building its following from a core of white college and precollege males, this music extends from electric citybillies like the Flying Burrito Bros. at one extreme to thrice-removed folkies like America at the other. Most such bands either undermine their popularity with purism--diluted purism, to be sure but even steel guitars and bluegrass harmonies and traditional material cut into the mass audiences--or seem to design their music for broadcast into elevators. In contrast, the Eagles have a basic commitment to rock and roll, probably by way of Frey, who grew up in hard-rock central, Detroit. Commercially and aesthetically, this is a big plus. Another thing that interests me about the Eagles is that I hate them. "Hate" is the kind of up-tight word that automatically excludes one from polite posthippie circles, a good reason to use it, but it is also meant to convey an anguish that is very intense, yet difficult to pinpoint. Do I hate music that has been giving me pleasure all weekend, made by four human beings I've never met? Yeah, I think so. Listening to the Eagles has left me feeling alienated from things I used to love. As the culmination of rock's country strain, the group is also the culmination of the counterculture reaction that strain epitomizes. Rock musicians differ from their fans in several crucial respects. For one thing, those who succeed earn a lot of money, and they usually have money even before success hits, from the studio and back-up gigs where they make their recording contacts. Their work is meaningful even when it isn't profitable and provides them with automatic status. The rock star is the perfect fantasy hero--not only has he beaten America's options, but he also gets laid. Considering their privileges, it's no wonder that many musicians are turning into spokesmen of hip reaction.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-aow/eagles.php"
