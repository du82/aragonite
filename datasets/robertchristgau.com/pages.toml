["https://robertchristgau.com/xg/bk-cg90/introapp.php"]
title = "Robert Christgau: CG 90s: How to Use These Appendices"
full_description = '''In a dogged stab at completism, I had some fun with the back matter in my '70s and '80s books, where I divided artists who hadn't made the text proper into three categories: honorable Subjects for Further Research, laughable Distinctions Not Cost-Effective, and unspeakable Meltdown. For the '80s I added a classification designated New Wave, which listed in order of preference precisely 200 bands vaguely deserving of that cheap, dated badge of rock coolness. Partly because new methods expand my coverage, and partly because new glut renders expansion futile, I've cut back on these strategems--completism isn't even a good joke anymore. Distinctions and Meltdown are gone, and Subjects for Further Research is shortened. With four artists--Steve Coleman, Fugazi, Huun-Huur-Tu, and Uz Jsme Doma--I've kept the album that got me interested (meaning the one I'm sure of) in the appropriate A List; with one--Jimi Hendrix, the exception to every rule--I stopped reviewing mid-decade and explained why in the appendix. The A Lists, which add best-ofs to revised versions of the Dean's Lists I publish in the Voice's Pazz & Jop Critics' Poll every February, continue unchanged: registers of every A record released in a given year. As always, these are arranged in order of preference, with some caveats. Let me be clear: I have not relistened to all 870-odd A and A minus records to find out how well they held up. Listening to each one just once would take roughly eight 14-hour seven-day weeks--or, please mister, 20 work weeks as conceived by any self-respecting American union member. As part of my ongoing criticism-can-be-fun program, I have checked out titles whose positioning looked way wrong; I've also relistened to albums newly reviewed or revised for this book, and moved other titles up and down according to the use, pleasure, and stimulation they've been good for over the years. This can be tricky, especially with best-ofs pitting whole careers and genres against single albums; committed grader, rater, and quantifier though I am, I almost had an anxiety attack comparing Anthology of American Folk Music and ESPN Slam Jams Vol. 1, some pair, to my favorite true 1997 releases, Arto Lindsay's Mundo Civilizado and Sleater-Kinney's Dig Me Out. I expect my final order--Mundo-Anthology-ESPN-Dig--will seem esoteric if not bananas to part-timers who believe, sanely, that even if these are all "rock" records in my expansive sense, they're also incommensurably different. So what would you think were I then to claim that the ringer of the four is the six-CD Anthology, whose many dull moments are toned up considerably by their positioning in the monument?'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-cg90/introapp.php"
