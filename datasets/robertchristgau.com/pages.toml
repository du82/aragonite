["https://robertchristgau.com/tips_albums.php"]
title = "Robert Christgau: Search Tips: Search for Album Title"
full_description = "When you enter an album title search string, we first convert it to the character set used in our simplified title strings (i.e., we convert upper case to lower case, and drop out any non alphanumeric characters). We then look for your search string in our list of simplified titles. Any album whose simplified title contains your search string as a substring is matched. If more than one album title matches, we print CG reviews for all of the matches, up to a limit. The matches are sorted by artist, with compilations and soundtracks at the end. The default limit is 50 CG reviews. If your search string matches more than this limit, we provide an option to re-run the search with a larger limit."
