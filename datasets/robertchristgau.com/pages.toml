["https://robertchristgau.com/xg/bk-aow/dylan.php"]
title = "Robert Christgau: Any Old Way: Four Pieces about Bob Dylan"
full_description = '''I think people are missing the point of Nashville Skyline, which is as it should be, since they were probably supposed to. The beauty of the album is that it is totally undemanding. In the past, it was always possible to enjoy Dylan without understanding him; I don't think he would have achieved his postfolk popularity otherwise. Even if you found his metaphors opaque and his situations surreal, you could dig him--Dylan-himself in the most showbiz that-man-himself sense, Dylan the presentation--for, comprehensible or not, Bob Superstar was always lurking in the inflections of that endless wit as well as out front in the persona shifts that have always defined his career. It was fun to wrestle with him. But you never held him for the count of three. Granting the two obvious exceptions--"Down Along the Cove" and "I'll Be Your Baby Tonight"--even the songs on that great blow for simplicity (and it was, it was), John Wesley Harding, were as gnomic as any of his previous work--less action-packed, less grandiloquent, but finally elusive. Only the kind of know-nothing know-it-alls that Dylan seems to attract by the thousands could ever believe they had pinned that album down. But as everyone knows, this record is different. The songs are so one-dimensional that they seem contrived, as if daring A.J. Weberman to search out the secret symbolic meaning. Unfortunately, even though Dylan is in too genial a mood to actually be daring anybody, the know-it-alls can be expected to take him up on it. This time they will be ignored, which is good, because stupidity should always be ignored, but also bad, because there is still some trickery going on, and I get the feeling nobody wants to know about it. As usual, it has to do with image. For the past four years, since the traumatic turn to rock, Dylan has been as private a celebrity as J.D. Salinger. In the beginning he was shy, perhaps wary of his own fame, but at the same time a funny and engaging, hence beloved, performer. After Newport, 1965, however, he stopped doing his half. Public appearances became rare, and because he was in demand as a profile subject, his distaste for reporters became notorious. Even before the accident he was difficult to reach; afterward he became an unequivocal recluse. But although none of his fans were sure he would ever be heard from again, they continued and in fact intensified the one-sided affair. Then, after two and a half years, the ice began to crack.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-aow/dylan.php"
