["https://robertchristgau.com/xg/bk-aow/column3.php"]
title = "Robert Christgau: Columns: May 1968"
full_description = '''May, 1968: Dylan-Beatles-Stones-Donovan-Who, Dionne Warwick and Dusty Springfield, John Fred, California The thing about Phil Ochs is that he's unquestionably a nice guy. He's so sincere, you know? It's impossible to dislike someone who can annotate his own record with eight poems by Mao Tse-tung and the inscription: "Is This the enemy?" Too bad his voice shows an effective range of about half an octave, almost no dramatic quality, and a built-in vibrato that makes it sound warped; too bad his guitar playing would not suffer much if his right hand were webbed. Very bad indeed that he has learned so little from Mao Tse-tung's poetry, which is terse and understated, but instead has adapted Mao's political theory not to politics, where it at least holds its own, but to music. Phil Ochs is a musical Red Guard. Revolution in the (cultural) revolution--his musical leaps forward are doing him in. Ochs has always made a joke of his admiration for his old friend Bob Dylan, but it's no joke: Dylan is a dangerous man to admire. He has a genius's full quota of excesses, and even in his folky period Ochs displayed every one: indifferent melodies, hypertrophic images, philosophical crudity, etc., etc. Then Ochs discovered the Beatles, who he said "set a level of pure musical sound that is a tantalizing carrot to many an American group." And then, dutifully, he bit. Not only did he fail to get the carrot, but he helped pull the wagon into a bad rut. Pleasures of the Harbor, his most recent and most popular LP, epitomizes the decadence that has infected pop since Sgt. Pepper. Cluttered with gaudy musical settings that inspire nostalgia for the three-chord strum, it is "artistic" but never artful. The lyrics, socially conscious at a level one convolution beyond that of the rich liberal who hates himself because he hates himself for being a rich liberal, can most tastefully be left undiscussed. And to compound all this the record is 52:13 long, with one side containing three eight-minute . . . works. Popular songs rarely run over four minutes for a reason: Without a narrative (as in a ballad) or a great singer (like Mick Jagger) or a sophisticated but available structure (as in Jim & Jean's version of Ochs's own "Crucifixion") it becomes geometrically more difficult to sustain interest at about that time. Not impossible, mind you--those attempts that succeed (like "A Quick One While He's Away" or "Like a Rolling Stone") are marvelous indeed. But those that fail, like "Pleasures of the Harbor" and all the rest, are enervating bores. Good intentions are never enough.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-aow/column3.php"
tags = ["1968:", "columns", "may,"]
