["https://robertchristgau.com/xg/bn/2013-07.php"]
title = "Robert Christgau: Gypsy Is His Autopilot"
full_description = '''I hate nostalgia so much that my favorite quatrain of the century goes, "There were never any good old days / They are today, they are tomorrow / It's a stupid thing we say / Cursing tomorrow with sorrow." Gargled out in a harsh Eastern European accent, kicked off with and topped off by a half-articulated shout and a sawing, guitar-fortified violin hook, the song is "Ultimate," which leads Gogol Bordello's fourth and greatest album, 2007's Super Taranta! It also led their sold-out Music Hall of Williamsburg concert July 23rd, the day they released their pretty damn fine sixth album, Pura Vida Conspiracy. My wife and I hadn't seen the band for five years, and it did our hearts good to hear Eugene Hutz give pride of place to an old credo reaffirmed. At the top of the bleachers we bopped and hugged. Nostalgic? Nous? Not counting my beloved Wussy, who I'll leave out of this, Gogol Bordello are my favorite rock band of the new century. By way of clarifying comparison, I'd say their chief competitors, all of whom I've celebrated in this space, are the Drive-By Truckers, Vampire Weekend, and the Hold Steady. Like Gogol, all three do something many of their youngish co-culturalists do not, from Foo Fighters on the rawk side to Grizzly Bear on the prawg side--write songs whose lyrics and melodies both please and parse. Partly as a consequence, all have enjoyed commercial success as this era defines it, and as many tomorrows will too: they make a decent living creating and playing music, but only because they've learned to tolerate and even enjoy touring for multiple months every year. Yet here's the thing--while the other three bands are fairly familiar, I suspect few readers can place Gogol Bordello. That's because the NYC-spawned aggregation isn't especially big in the U.S. Its success is a worldwide phenomenon of the "secondary markets" more commonly serviced by acts whose name recognition is based on hits long gone. (Ever hear of British Goth-poppers Placebo? In Croatia they remember.) For Gogol Bordello, the logic is different. Whether their rhythms cant Balkan or Latin or Jamaican, and by now it's all three, they always generate a crude, loud, rock-identified drive. And rock they are--Hutz plays guitar, as does Oliver Charles full-time and utility man Pedro Erazo-Segovia when the occasion arises. Yet at the same time they're an immigrant band. The 40-year-old Hutz grew up in Ukraine until Chernobyl set his family scurrying to Vermont, and energetically explores and exploits the Gypsy roots of his Roma grandmother. Violinist Sergey Ryabtsev is Russian, accordionist Pasha Newmer Belarusian, bassist Thomas Gobena Ethiopian, vocalist-percussionist Elizabeth Sun Scottish-born Hong Kong Chinese, multitasking Erazo-Segovia Ecuadoran. And their music affirms their mongrel heritage. On their excellent 2005 Gypsy Punks: Underdog World Strike, Hutz expostulates in his thick accent about getting "categorized" and "naturalized," "pencilled in as a goddam white," but enjoys the last laugh with his fellow "immigrant punks": "I gotta friends, we gotta band / We still make sound you can't stand."'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bn/2013-07.php"
tags = ["autopilot", "gypsy"]
language = "en"
