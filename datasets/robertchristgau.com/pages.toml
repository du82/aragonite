["https://robertchristgau.com/xg/bk-aow/creedence.php"]
title = "Robert Christgau: Creedence: Where Do You Go From the Top?"
full_description = '''Creedence Clearwater Revival, the Berkeley, California rock band, recently spent thirty thousand dollars on a party designed to attract attention. Since 1970 Creedence was the leading record-seller in the United States, Great Britain, West Germany, Canada, Israel, Switzerland, Norway, and El Salvador, this would appear a somewhat redundant exercise, albeit tax-deductible, but in fact it wasn't. For Creedence finds itself in a quandary as perplexing as it is enviable. Riveted onto the most inflexible hard-rock framework this side of the Stooges and Grand Funk Railroad--which is to say, a framework with just enough variety in the vocals and hook riffs to qualify for the second station of rock fixity--the band has turned off the kind of fan who exults every time he identifies a chord change, who assumes a hit single is a bad record, and who talks about rock rather than rock and roll. Worse still, Creedence has not infused its public--a category that subsumes a remarkable range of high-school students, truck-stoppers, heads, and miscellaneous--with the kind of ardor public idols are expected to expect. The trouble is, both failings are inextricable from the success they accompany, which is based on a fanatical devotion to the music of rock and roll. The most reasonable complaint about Creedence's music is that it always sounds the same, excuse enough for the chord-change crowd to put it down. The Doors, a group of comparable importance (and structure), are often subjected to the same complaint, but there is a difference. Listen first to The Doors and Morrison Hotel, then to Creedence Clearwater Revival and Cosmo's Factory. To an outsider, all four records (excluding "The End" and "Alabama Song") probably sound pretty much the same. The rock devotee would probably argue that each pair shows a similar paucity of development. But the rock and roll fan, accustomed to taking his differentiation in small increments, perceives no sameness and no stasis. For Creedence, Cosmo's Factory is in a dozen tiny respects an elaboration. The most obvious change is in the songwriting, especially the lyrics, but there are others, e.g.: John Fogerty's singing has become surer and more subtle, the four musicians are more integral, the sound of the recording is fuller, "I Heard It Through the Grapevine" apotheosizes "Suzie Q"'s artless concept of rock improvisation, and so forth. Morrison Hotel, on the other hand, represents a deterioration for the Doors, not in the work of Krieger, Manzarek, and Densmore--though they are victimized by a certain inevitable guilt by association--but in Jim Morrison's vocal presence. As he discovers his real affection for rock and roll music--one side of the album is called "Hard Rock Cafe"--he uncovers his ability to relate wholeheartedly to it. Suddenly, Morrison's timbre loses much of its former mystery with no gain in directness, his phrasing lacks wit, and the music, while competent enough, excites only those hung over on the persona he once managed to project with such ferocious intensity--those entranced by an afterimage, so to speak.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-aow/creedence.php"
