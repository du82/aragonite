["https://robertchristgau.com/xg/bk-aow/column4.php"]
title = "Robert Christgau: Columns: June 1968"
full_description = '''I don't know anything about music, which ought to be a damaging admission but isn't, or I wouldn't be making it. The fact is that pop writers in general shy away from such arcana as key signature and beats to the measure. (Those few who don't run in fear from the English language instead.) I used to confide my worries about this to friends in the record industry, who reassured me. They didn't know anything about music either. The technical stuff didn't matter. You just gotta dig it. Well, I do dig it, but I'm not sure that's enough. These days, I often suspect that the rock musicians who pride themselves on just such musical sophistication are engaged in a dangerous self-contradiction. The innovations of the rock avant-garde, as it is called, sound suspiciously like middlebrow subterfuges borrowed from classical music and jazz and elevated by an ignorant audience that applauds the novel whether it is bogus or not. Granted, my suspicions ignore legitimate questions of context--whether those borrowings don't have renewed validity for an unsophisticated audience, and whether the pop-rock framework doesn't hybridize them in a truly new way. But most of the classical devotees who think about rock at all would rather it retain its folk vitality and stop dabbling. Those who approve of the new filigrees do so, once again, because of context. Performed by kids who have just discovered them, old modes don't sound so outmoded. Jazz people, more directly threatened by this rival blues-based music, are not so olympian. Charlie Byrd harrumphs about "juvenile music," and Lionel Hampton complains of "dozens of press agents yelling `rah-rah.'" Just like other old men, old jazzmen can't stand these freaky kids. They resent their unpredictable musicianship and--of course--their money. But their distaste is not universal. Among creative younger jazz players not involved in the more recondite avant-gardism--John Handy, Charles Lloyd, Gary Burton, Don Ellis--there is respect for the seriousness, the vitality, and even the musicality of the best rock. And naturally there is talk of a jazz-rock merger.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-aow/column4.php"
tags = ["1968:", "columns", "june,"]
