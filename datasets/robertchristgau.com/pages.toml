["https://robertchristgau.com/xg/bk-cg70/basics.php"]
title = "Robert Christgau: CG 70s: A Basic Record Library: The Fifties and Sixties"
full_description = '''The lists that follow, dominated by standbys that have given me pleasure for years, are for context--where my judgments are coming from--as well as guidance. They've taken some relistening, but not the kind of scrutiny that went into the body of the book, and they're less than comprehensive, based largely on albums in my non-collector's collection. Nevertheless, similar criteria apply. I've named records, not artists--great, listenable records as opposed to important ones, records rarely marred by humdrum cuts. I've included urban blues because it differs from rock and roll only in stylistic rigor and target audience, and ignored country music because the styles only began to merge fully in the '70s (honky-tonkers like George Jones and Hank Williams--not to mention Country Jerry Lee--are/were more rock and roll than Willie Nelson, but singer-songwriter Nelson is definitively "rock"). Certain faves (More Chuck Berry, Aretha's I Never Loved a Man) have been passed over to avoid duplication with best-ofs. There are twenty-five LPs from the '50s and seventy-five from the '60s because those round numbers are about where the quality begins to tail off. As suits what was basically a singles music, all but three of the '50s selections are greatest-hits albums, most of them put together in the '70s. I've omitted such classic multiple-artist compilations as 18 King Size Rhythm & Blues Hits (Columbia), You Must Remember These (Bell), History of Rhythm & Blues Vol. 3 (Atlantic), Echoes of a Rock Era and Golden Goodies (Roulette), and American Graffiti (MCA) in favor of twenty-five forty-fives by artists whose LPs--if they exist at all--didn't make the grade. A lot of best-ofs show up in the '60s as well because outside of the fab five--Beatles-Dylan-Stones-Who-Redding--great albums-as-albums were rare before 1967. The good old days? We'll ever know.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/bk-cg70/basics.php"
