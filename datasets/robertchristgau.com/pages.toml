["https://robertchristgau.com/xg/web/cgusers.php"]
title = "Robert Christgau: User's Guide to the Consumer Guide"
full_description = '''The Consumer Guide has a long history. I wrote my first batch of letter-graded capsule reviews for The Village Voice in July, 1969, and published them regularly till I was hired by Long Island's Newsday in March, 1972. A monthly Consumer Guide was compiled from my Newsday work in Creem, which then reprinted the column after I returned to the Voice in August, 1974, which published the Consumer Guide until August, 2006, when I was fired by new owners. Since I was hardly the only reject, this was no shock, and it worked out well for me, because now I have three gigs. My Rock&Roll& essays appear online in The Barnes & Noble Review. I do regular record pieces at NPR's All Things Considered. And Microsoft MSN Music publishes the Consumer Guide monthly. Originally the Consumer Guide used an A-to-E grading system that I waggishly explained in the first of three decade-spanning books based on my published columns. These weren't like grades in school--there were too many B plus records for anything lower to count as a recommendation. Yet every month I rated plenty of albums B or below. By 1990, however, I'd had it with calibrating the not-so-hot. That was for critics, I reasoned--consumers were just looking for records to buy. So I'd limit myself to what I refer to as "A records," meaning those rated A plus (very rare, three a year is a lot and zero not uncommon, mostly because prolonged enjoyment is so tricky to predict), A (annually there are a dozen or 15 of those), and A minus (in a good year I find 60 or 70). Then there'd be a few "high B plusses" (which I agonize over so long I figure they have something but not quite enough). Only I soon decided there'd be other records I couldn't overlook altogether. At first there were maybe half a dozen of these "Honorable Mentions." But as album production increased tenfold in the '90s, so that twice as many hours of music were recorded annually than there were hours in a year, Honorable Mentions mushroomed. Engaged competence with flashes of inspiration became the essence of our musical condition. I'd changed formats just in time.'''
year_published = 2025
clearnet = "https://robertchristgau.com/xg/web/cgusers.php"
