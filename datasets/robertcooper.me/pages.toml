["https://robertcooper.me/post/vscode-vs-webstorm"]
title = "VSCode vs WebStorm"
description = "Noteworthy differences between VSCode and WebStorm for web development purposes."
full_description = '''<img alt="VSCode VS WebStorm" srcSet="/_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fcover.jpg&amp;w=2048&amp;q=75 1x, /_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fcover.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fcover.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> I've been switching back and forth between VSCode and WebStorm for web development purposes. I'll lay out some noteworthy differences between VSCode and WebStorm in this article. Ultimately, if I had to choose one editor, I would lean towards WebStorm because it has better refactoring abilities such as moving function/variables to different files. However, I often switch between both editors based on what tool I find best for the job. Here's the breakdown of different features compare in VSCode and WebStorm. Auto importing Auto importing works better in WebStorm. I can copy and paste some code from one file to another in WebStorm and WebStorm can automatically import any missing symbols that are not already imported in the file. This only happens if you have the appropriate setting configured in WebStorm. <img alt="My WebStorm settings for auto importing." srcSet="/_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fwebstorm-eslint-fix-setting.png&amp;w=384&amp;q=75 1x, /_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fwebstorm-eslint-fix-setting.png&amp;w=750&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fwebstorm-eslint-fix-setting.png&amp;w=750&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> My WebStorm settings for auto importing Autocomplete Autocomplete works well in both VSCode and WebStorm. I did hit one hiccup with WebStorm not showing the right suggestions and had to open up a support ticket to figure out how I could get the autocomplete suggestions showing up for express. However, that seems to be a rare edge case and it works in most cases. <img alt="VSCode autocomplete" srcSet="/_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fvscode-autocomplete.png&amp;w=1200&amp;q=75 1x, /_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fvscode-autocomplete.png&amp;w=3840&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fvscode-autocomplete.png&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> VSCode autocomplete <img alt="WebStorm autocomplete" srcSet="/_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fwebstorm-autocomplete.png&amp;w=1080&amp;q=75 1x, /_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fwebstorm-autocomplete.png&amp;w=3840&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fwebstorm-autocomplete.png&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> WebStorm autocomplete Not necessarily "autocomplete", but VSCode recently introduced GitHub Copilot which uses AI to provide suggestions on what code to write. As of this writing, it's still in technical preview, but I've been able to use it and I've been impressed by the results. Theming WebStorm by default looks crummy, but if you install the Material Theme UI Lite plugin, you can pick a theme that looks great. VSCode also looks good and there is a much larger choice of themes built by the community for VSCode. The only thing that bugs me about the WebStorm look is that you cannot change the color of the title bar's background. <img alt="WebStorm default title bar styles" srcSet="/_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fwebstorm-unstyled-titlebar.png&amp;w=3840&amp;q=75 1x" src="/_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fwebstorm-unstyled-titlebar.png&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> WebStorm default title bar styles Plugins & Extensions WebStorm calls them plugins. VSCode calls them extensions. VSCode has a much greater amount of extensions than WebStorm has plugins. This isn't a big deal for me since I don't rely on that many extensions/plugins anyways. Almost all of my extensions/plugins are "nice to have" things that I can live without. That being said, I'm probably not leveraging VSCode extensions as much as I could be. Here are some of my favorite extensions and plugins: VSCode GitLens - Inline git blame + other git enhancements Error Lens - Shows errors inline in your editor Toggle Quotes - Easily toggle between different quote types Better Comments - Syntax highlighting for comments (This is built-in to WebStorm) <img alt="VSCode extensions" srcSet="/_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fvscode-extensions.png&amp;w=1080&amp;q=75 1x, /_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fvscode-extensions.png&amp;w=1920&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fvscode-extensions.png&amp;w=1920&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> VSCode extensions <img alt="WebStorm plugins" srcSet="/_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fwebstorm-plugins.png&amp;w=1920&amp;q=75 1x, /_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fwebstorm-plugins.png&amp;w=3840&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fwebstorm-plugins.png&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> WebStorm plugins WebStorm GitToolbox - Inline git blame + other git enhancements I don't use any other noteworthy plugins. Refactoring WebStorm is better at refactoring JavaScript/TypeScript code. You're able to move functions and variables from one file to another, which VSCode does not support. That being said, VSCode can meet the majority of my refactoring needs, such as renaming symbols or converting function parameters to a single object. WebStorm can also extract a block of code into a function whereas VSCode can't. I tried using the Abracadabra extension for this in VSCode, but it didn't extract things properly. WebStorm is also able to convert a block of JSX into a React component. It will oftentimes make some weird assumptions for the component props, but it still helps you quickly refactor things. <img alt="Select a block of JSX you would like to move into a new React component in WebStorm" srcSet="/_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fjsx-refactor.png&amp;w=1920&amp;q=75 1x, /_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fjsx-refactor.png&amp;w=3840&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fjsx-refactor.png&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> Select a block of JSX you would like to move into a new React component in WebStorm <img alt="The component WebStorm automatically generated based off of the JSX I wanted to extract" srcSet="/_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Frefactored-react-component.png&amp;w=1920&amp;q=75 1x, /_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Frefactored-react-component.png&amp;w=3840&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Frefactored-react-component.png&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> The component WebStorm automatically generated based off of the JSX I wanted to extract. In this case, the generated props were what I would have picked myself. The only thing I would change is using object destructuring in the props parameter. <img alt="WebStorm dialog that allows for moving members from one file to another" srcSet="/_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fwebstorm-move-members.png&amp;w=2048&amp;q=75 1x, /_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fwebstorm-move-members.png&amp;w=3840&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fwebstorm-move-members.png&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> WebStorm dialog that allows for moving members from one file to another VSCode refactoring a function's parameters to be a destructured object. I do this very often Format on save VSCode and WebStorm are both able to quickly format files on save. I usually have ESLint and Prettier set up in my projects and formatting is always done via ESLint's --fix argument. Both VSCode and WebStorm have good support to allow ESLint to run --fix on save. <img alt="WebStorm configuration for formatting via ESLint on save" srcSet="/_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fwebstorm-eslint-settings.png&amp;w=750&amp;q=75 1x, /_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fwebstorm-eslint-settings.png&amp;w=1920&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fwebstorm-eslint-settings.png&amp;w=1920&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> WebStorm configuration for formatting via ESLint on save <img alt="VSCode configuration for formatting via ESLint on save" srcSet="/_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fvscode-eslint-settings.png&amp;w=384&amp;q=75 1x, /_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fvscode-eslint-settings.png&amp;w=750&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fvscode-eslint-settings.png&amp;w=750&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> VSCode configuration for formatting via ESLint on save See this article I wrote on how to set up ESLint + Prettier in a TypeScript project with VSCode. Debugging VSCode and WebStorm both have good debugging of Node.js and React applications with their integrated debuggers. There doesn't seem to be any major advantage in using one editor's debugger over the other. In both editors, you can specify debug configurations to run your apps. In one of my projects, I've got debug configurations set up to run a web app, run/debug a server, and debug a web app. <img alt="VSCode menu to run and debug apps" srcSet="/_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fvscode-debugger.png&amp;w=1200&amp;q=75 1x, /_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fvscode-debugger.png&amp;w=3840&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fvscode-debugger.png&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> VSCode menu to run and debug apps <img alt="WebStorm menu to run and debug apps" srcSet="/_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fwebstorm-debugger.png&amp;w=750&amp;q=75 1x, /_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fwebstorm-debugger.png&amp;w=1920&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fwebstorm-debugger.png&amp;w=1920&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> WebStorm menu to run and debug apps Side note 📝Learning how to debug is a good investmentLearning how to use the editor debugger has been such a good return on investment in terms of the time I've saved trying to figure out issues to problems. Before I relied on using console.log, but I find that is not always the best tool to find the root cause of some issues, especially if you don't have a good idea as to where the root cause is located. Code style and best practices One thing I like about WebStorm is that it gives you hints related to any duplicated code it finds in your project which could be a good indication that things should be refactored for better re-usability. <img alt="WebStorm duplicate code hint" srcSet="/_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fwebstorm-duplicate-code.png&amp;w=640&amp;q=75 1x, /_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fwebstorm-duplicate-code.png&amp;w=1080&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fwebstorm-duplicate-code.png&amp;w=1080&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> Dead code hints WebStorm will tell you if exported variables are not used anywhere in your project and can be safely deleted. VSCode can only tell you if a variable is not being used in the current file. This helps with removing unnecessary code in your project. <img alt="WebStorm unused code hint" srcSet="/_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fwebstorm-unused-code.png&amp;w=1920&amp;q=75 1x, /_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fwebstorm-unused-code.png&amp;w=3840&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fvscode-vs-webstorm%2Fwebstorm-unused-code.png&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style'''
