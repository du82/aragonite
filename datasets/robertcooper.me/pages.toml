["https://robertcooper.me/post/git-commit-messages"]
title = "How to write a commit message that will make your mom proud"
description = "Learn how to style and format a commit message for optimal readability, especially if using GitHub to host your git repository."
full_description = '''Here are some guidelines on how to best structure and write a commit message, especially if you are using GitHub to host your git repository. WARNING: This is a highly opinionated article and could cause some developers to lose their minds. I do not claim responsibility for all lost minds caused as a result of reading this article. Commit anatomy Example commit message Subject line less than or equal to 72 characters in length Body line length limited to 80 characters Use sentence case for commit subject line with no period Use present tense imperative for the subject line and present tense for body text Use the footer to reference related issues Using VSCode to write commit messages Related tools Conventional Commits Commitlint Final note Related resources Commit anatomy Before going over the guidelines, it's best to review the anatomy of a commit message. A commit message is comprised of a subject, body, and footer, with both the body and footer being optional. The subject is a single line that best sums up the changes made in the commit. The body text is used to provide more details regarding the changes made in the commit. The footer text is found immediately below the body and is a place to reference issues related to the commit changes. The body is separated by the subject by an empty line and similarly, the footer is separated from the body by an empty line. Example commit message text1Add end-to-end test to shopping cart page2 3This adds several tests to the shopping cart page to catch potential regressions4introduced to the payment flow by the addition of new features.5 6The following functionality is tested:7- Adding multiple items to the cart8- Removing items from the cart9- Adding discount code to the cart10- Sending the user to payment details page when pressing the payment button11 12Issue #123 Subject line less than or equal to 72 characters in length To prevent a commit message's subject to be cut off in GitHub, make sure to limit the character length to 72 characters. This character limit is irrespective of the character width (i.e. even if an "I" character takes up less horizontal space than a "W" character in the GitHub UI, you will not be able to display more than 72 "I" characters). <img alt="72 &quot;W&quot; characters in the GitHub UI." srcSet="/_next/image?url=%2Fposts%2Fgit-commit-messages%2F72ws.png&amp;w=1920&amp;q=75 1x, /_next/image?url=%2Fposts%2Fgit-commit-messages%2F72ws.png&amp;w=3840&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fgit-commit-messages%2F72ws.png&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> No cutoff text shown when using 72 "W"s for the commit message subject. <img alt="72 &quot;I&quot; characters in the GitHub UI." srcSet="/_next/image?url=%2Fposts%2Fgit-commit-messages%2F72is.png&amp;w=1920&amp;q=75 1x, /_next/image?url=%2Fposts%2Fgit-commit-messages%2F72is.png&amp;w=3840&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fgit-commit-messages%2F72is.png&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> Just like with wide "W" characters, 72 "I" characters will appear just fine. <img alt="73 &quot;W&quot; characters in the GitHub UI." srcSet="/_next/image?url=%2Fposts%2Fgit-commit-messages%2F73ws.png&amp;w=1920&amp;q=75 1x, /_next/image?url=%2Fposts%2Fgit-commit-messages%2F73ws.png&amp;w=3840&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fgit-commit-messages%2F73ws.png&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> The commit subject gets cutoff when there are 73 "W"s. What ends up showing up are 69 "W"s in the main upper area with 3 dots that will reveal the remaining 4 "W" when clicked. <img alt="72 &quot;I&quot; characters in the GitHub UI." srcSet="/_next/image?url=%2Fposts%2Fgit-commit-messages%2F73ws.png&amp;w=1920&amp;q=75 1x, /_next/image?url=%2Fposts%2Fgit-commit-messages%2F73ws.png&amp;w=3840&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fgit-commit-messages%2F73ws.png&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> Again, similar to the "W" characters, 73 "I" characters in the commit subject will be displayed as cutoff, with the cutoff text reveal only when clicking the 3 dots. Body line length limited to 80 characters The line length for the body text of a commit message should be constrained to 80 characters. Regardless of if you manually wrap the body line length to 80 characters or not, the body text will appear as wrapped as 80 characters in the GitHub UI. However, limiting the line length to 80 characters makes commit messages more readable when trying to read them in the command line (such as when executing the command git log). <img alt="Non-constrained commit message body text in the GitHub UI." srcSet="/_next/image?url=%2Fposts%2Fgit-commit-messages%2Ffull_body.png&amp;w=1920&amp;q=75 1x, /_next/image?url=%2Fposts%2Fgit-commit-messages%2Ffull_body.png&amp;w=3840&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fgit-commit-messages%2Ffull_body.png&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> Here's how a commit message looks like in GitHub when not manually limiting the line length. Notice the text is automatically constrained to an 80 character line-length limit. <img alt="Commit body spanning the full width of the command line." srcSet="/_next/image?url=%2Fposts%2Fgit-commit-messages%2Ffull_body_cli.png&amp;w=3840&amp;q=75 1x" src="/_next/image?url=%2Fposts%2Fgit-commit-messages%2Ffull_body_cli.png&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> However, if the line length is not manually constrained to 80 characters, the commit body will span the full width of the command line making the commit message more difficult to read. <img alt="Commit body spanning a maximum of 80 characters in line length in the command line." srcSet="/_next/image?url=%2Fposts%2Fgit-commit-messages%2F80_body_cli.png&amp;w=3840&amp;q=75 1x" src="/_next/image?url=%2Fposts%2Fgit-commit-messages%2F80_body_cli.png&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> Wraping text at 80 characters prevents text from spanning the full width of your command line window and allows for better readability of commits. The reason why having text span a large line length makes things less readable is because when reading multiple lines of text, your eyes need to be able to jump from the end of one line of text to the beginning of the next line of text. Having a longer line length makes this visual jump more difficult. This is easily illustrated by trying to read text that has a long line-length and a very small line-height (decreased line-height exacerbates this issue). <img alt="Here&#x27;s a look how the message body looks like in GitHub when manually limitting line length to 80 characters." srcSet="/_next/image?url=%2Fposts%2Fgit-commit-messages%2Fline_length.png&amp;w=3840&amp;q=75 1x" src="/_next/image?url=%2Fposts%2Fgit-commit-messages%2Fline_length.png&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> Notice how difficult this paragraph with a long line length is to read. This is because your eyes require more effort to identify the start of the next line. The only issue I see with wrapping body messages at 80 characters is that when you open a new pull request on GitHub and the pull request only has a single commit (which is a majority of my pull requests), GitHub will populate the pull request description with the text from the commit message body. With the text wrapped at 80 characters, there will be some whitespace in the pull request description. If you did not limit the commit body line length to 80 characters, then the default pull request description will fill the full space of the pull request description. Yes, you can simply remove this whitespace manually in the pull request description, but it's slightly annoying. <img alt="Here&#x27;s a look at the whitespace that is left in the pull request description when wrapping commit message body text at 80 characters." srcSet="/_next/image?url=%2Fposts%2Fgit-commit-messages%2F80_body_pr.png&amp;w=1920&amp;q=75 1x, /_next/image?url=%2Fposts%2Fgit-commit-messages%2F80_body_pr.png&amp;w=3840&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fgit-commit-messages%2F80_body_pr.png&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> Here's a look at the whitespace that is left in the pull request description when wrapping commit message body text at 80 characters. <img alt="Another look at the whitespace in the pull request description when not in &quot;edit mode&quot;." srcSet="/_next/image?url=%2Fposts%2Fgit-commit-messages%2F80_body_pr_2.png&amp;w=1920&amp;q=75 1x, /_next/image?url=%2Fposts%2Fgit-commit-messages%2F80_body_pr_2.png&amp;w=3840&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fgit-commit-messages%2F80_body_pr_2.png&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> Another look at the whitespace in the pull request description when not in "edit mode". Use sentence case for commit subject line with no period Use sentence case (without an ending period) for the commit subject line. This makes the subject read like the header for an article section. The commit body text should be punctuated and cased as you would expect from any normal paragraph of text (i.e. sentence case with periods). Example text1Fix the lag while typing in the search bar2 3Now the logic for filtering the search results is debounced which gets rid of4the noticeable lag that appeared while typing in the search bar. Use present tense imperative for the subject line and present tense for body text The present imperative should be used for the subject line of commit messages. This is what has been standardized by git itself. For example, when merging one branch into another, git will search a commit message in the form of Merge branch 'branch-name'. For a good discussion diving into the pros and cons of present vs past tense, see this stack overflow post. Use the footer to reference related issues The footer is the perfect place to reference issues that are affected by changes made in the commit. For example, if using JIRA to manage your project tasks, then refer to any JIRA issues in the footer. text1Fix the lag while typing in the search bar2 3Now the logic for filtering the search results is debounced which gets rid of4the noticeable lag that appeared while typing in the search bar.5 6Issue ABC-1337 Decide on a format on how you want to list issues in the footer and stick with it. Also, GitHub has a feature that allows you to automatically create links from text that matches a specific pattern in a pull request description. Therefore, if creating a pull request that has a single commit, the pull request description will include the commit message footer and if it matches the format you've configured in the GitHub settings, it will generate a link for you automatically (e.g. a link pointing the JIRA issue) 🎉. Using VSCode to write commit messages Most times I write my commit messages from the command line, but if I expect to write a long commit message, I'll usually do so in VSCode. You can set VSCode as your default git editor by first installing the VSCode command-line interface and then execute the following command in your shell: bash1git config --global core.editor "code --wait" With VSCode set as your default git editor, whenever you execute git commit, VSCode will open up for you to type in your commit message. The commit message is saved once you've closed the VSCode tab (can be done with ⌘ + w). What is especially nice about this is that you can configure VSCode to set vertical rulers that can act as guides for the line length limits you wish to follow: <img alt="Vertical line rulers indicating character line limits for both the commit subject (72 characters) and body (80 characters)." srcSet="/_next/image?url=%2Fposts%2Fgit-commit-messages%2Fvscode.png&amp;w=3840&amp;q=75 1x" src="/_next/image?url=%2Fposts%2Fgit-commit-messages%2Fvscode.png&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> To set these rulers, just add the following to the VSCode global settings.json file: 1"[git-commit]": {2 "editor.rulers": [72, 80]3} Related tools It's worth mentioning that there are some great tools out there related to commit guidelines and enforcing commit message rules. Conventional Commits Conventional Commits is a commit convention that is useful for describing how commit changes are related to the semantic version of an app as well as enable for some automated tooling that can leverage this specific commit convention. These types of commits take the following form: 1feat(home): add signup link to home page 1fix(signup): allow signup button to be clicked This is a very popular commit standard that is followed, but unless you want to do some things like automaticall'''
author = "Robert Cooper"
year_published = 2020
year_updated = 2020
clearnet = "https://robertcooper.me/post/git-commit-messages"
tags = ["anatomy", "automatically", "body", "case", "changes", "character", "characters", "characters,", "command", "commit"]
