title = "Deploy an app to multiple environments with Vercel"
description = "Learn how to deploy an app to multiple environments accessible at different custom domains on the Vercel platform."
full_description = "It's possible to deploy an application hosted on the Vercel platform (formerly Zeit Now) to multiple environments with a little extra configuration. This post will explain the following: How to deploy an application to two different environments (e.g. staging & production) that are accessible at 2 different subdomains (e.g. staging.app.com and app.com). Deploy to multiple environments from a local machine that is already authenticated with Vercel using now login Deploy to multiple environments from a CI machine that is not authenticated with Vercel Vercel project setup In order to deploy an app to 2 different environments, it's required to have Vercel projects for each environment. In your project directory, you can execute the now command to deploy a new project. Once you've deployed the project for one environment (e.g. staging), take note of the projectId and orgId values found in the generated .now/project.json file as those values will be needed later. Once the projectId and orgId values have been recorded somewhere for the first environment, delete the .now directory and re-execute the now command to setup a project for the other environment (e.g. prod). Again, record the projectId and orgId values found in the generated .now/project.json file and then delete the .now directory. If you've already created a project in Vercel, you can still run the now command above since the now command will prompt you to create a new project OR link to an existing project. Each environment will likely have a different set of environment variable values, so make sure to setup 2 different now.json configuration files for each environment. For example you can create a now.staging.json and a now.prod.json file to map your environment variables to the appropriate Now secret. Make sure to configure the domain names for each environment in the Vercel dashboard in order to have the deployed apps accessible at custom domain names. Deploy from local machine that is already authenticated with Vercel With the projectId and orgId values known for each environment and the Vercel configuration files set for each environment, it's possible to deploy to both environments using the Vercel CLI. bash1# Deploy to staging environment2export NOW_PROJECT_ID=xxx && export NOW_ORG_ID=xxx && now --prod --local-config ./now.staging.json3# Deploy to prod environment4export NOW_PROJECT_ID=xxx && export NOW_ORG_ID=xxx && now --prod --local-config ./now.prod.json Replace the xxx for NOW_PROJECT_ID and NOW_ORG_ID with the values of projectId and orgId, respectively, that correspond with the Vercel project you wish to deploy. The above commands sets the NOW_PROJECT_ID and NOW_ORG_ID environment variables which are used by the Now CLI to determine to which project the app should be deployed. Personally, I use the dotenv-cli library to set the NOW_PROJECT_ID and NOW_ORG_ID environment variables. It requires installing dotenv-cli and creating a file that will hold the values of the environment variables. bash1# .now.env.staging2NOW_ORG_ID=xxx3NOW_PROJECT_ID=xxx Then the command to deploy to Vercel is as follows: bash1# Deploy to staging environment2dotenv -e now.env.staging -- now --prod --local-config ./now.staging.json3# Deploy to prod environment4dotenv -e now.env.prod -- now --prod --local-config ./now.prod.json This allows me to store the values of the NOW_ORG_ID and NOW_PROJECT_ID environment variables in files that can be ignored by git so I don't need to commit secrets to source control. Deploy from CI machine that is not authenticated with Vercel On CI machines, make sure to load the environment variables using the environment variable system that comes with your CI provider. For example, with GitHub actions you would set GitHub secrets that contain the projectId and orgId for all your deployment environments and then map the values of those secrets to environment variables specified in a workflow file. Also, in order to run Now CLI commands from a CI machine, it is required to provide a ZEIT Now token to the Now CLI command to be executed. You can generate a Vercel token here. bash1now --prod --local-config ./now.staging.json --token xxx References Spectrum chat discussion on project linking and CI/CD pipelines GitHub issue comment by Honza Javorek about the environment variables needed to be set"
author = "Robert Cooper"
year_published = 2020
year_updated = 2020
clearnet = "https://robertcooper.me/post/deploy-app-to-multiple-environments-vercel"
tags = ["--local-config", "--prod", "already", "authenticated", "command", "cooper", "deploy", "different", "dotenv-cli", "environment"]
language = "en"
internal-references = ["none"]
external-references = ["circleci.com", "codepen.io", "ctrl.blog", "deno.land", "developer.mozilla.org", "docker.com", "docs.docker.com", "gatsbyjs.org", "github.com", "joshwcomeau.com", "jsfiddle.net", "kentcdodds.com", "npmjs.com", "repl.it", "stackoverflow.com", "statamic.com", "static-gatsbyjs.netlify.com", "testing-library.com", "twitter.com", "vercel.com"]

["https://robertcooper.me/post/stop-using-gifs"]
title = "Stop Using GIFs on Websites"
description = "GIFs are not optimal file formats for usage on the web, but luckily they can be replaced with WebM and MPEG4 videos for optimal performance."
full_description = '''GIFs are an omnipresent part of the internet. They are used on Twitter as a way to react to something, they are used in blog posts to make them more interesting, and they are used for the majority of conversations amongst coworkers on Slack (or maybe that's just me?). With that being said, GIFs are not good for the web. GIFs are not optimized to be used on the web: their file size is very large and decoding GIFs in the browser is not a very performant operation. However, there is a better alternative to using GIFs and that alternative is to use videos instead. Video files are much smaller than GIFs and they are more easily decoded in the browsers compared to GIFs. Actually, when you post a GIF on Twitter, Twitter converts the GIF into a video, which dramatically reduces the file size. This is something very important for Twitter, where users may encounter many GIFs while scrolling their timeline (which translates to more data being downloaded on a user's phone). By reducing the amount of data a user needs to download to view content, they are able to load assets faster as well as use less mobile data (which can be very expensive, especially for us Canadians). Currently, the best article i've found on replacing GIFs with videos is this Google Web Fundamentals article that I suggest you read if you're interested in all this. Evaluating GIFs in existing web apps Because Twitter does GIF optimizations, I was curious to see if other web apps also tried to optimized GIFs that are uploaded to their app. As an experiment i've taken a GIF of Fogel from Superbad and uploaded it on three web apps to see how each app handles GIFs and analyze the final file size of the optimized GIFs. The three web apps i've looked at are Twitter, Dev Community, and Medium. GIF used to test how existing web apps optimize uploaded GIFs. As a reference, the size of the above raw GIF used for this experiment is 1.0 MB. Twitter As mentioned earlier, Twitter converts GIF files to video files (specifically MPEG4). <img alt="HTML element corresponding to uploaded GIF" srcSet="/_next/image?url=%2Fposts%2Fstop-using-gifs%2Ftwitter-html.png&amp;w=828&amp;q=75 1x, /_next/image?url=%2Fposts%2Fstop-using-gifs%2Ftwitter-html.png&amp;w=1920&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fstop-using-gifs%2Ftwitter-html.png&amp;w=1920&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> HTML video element corresponding to the upload GIF of Fogel. <img alt="Loaded asset as shown in the chrome developer tools" srcSet="/_next/image?url=%2Fposts%2Fstop-using-gifs%2Ftwitter-size.png&amp;w=1920&amp;q=75 1x, /_next/image?url=%2Fposts%2Fstop-using-gifs%2Ftwitter-size.png&amp;w=3840&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fstop-using-gifs%2Ftwitter-size.png&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> MPEG4 file size of 58.7 KB and load time of 49 ms. Twitter reduces the size of the original GIF asset by 94% by converting it to a MPEG4 file! Medium On Medium, you have to ability to upload GIFs to the articles you write. As it turns out, Medium doesn't do any sort of optimizations for the uploaded GIFs: <img alt="HTML element corresponding to uploaded GIF" srcSet="/_next/image?url=%2Fposts%2Fstop-using-gifs%2Fmedium-html.png&amp;w=1200&amp;q=75 1x, /_next/image?url=%2Fposts%2Fstop-using-gifs%2Fmedium-html.png&amp;w=3840&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fstop-using-gifs%2Fmedium-html.png&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> HTML image element corresponding to the upload GIF of Fogel. <img alt="Loaded asset as shown in the chrome developer tools" srcSet="/_next/image?url=%2Fposts%2Fstop-using-gifs%2Fmedium-size.png&amp;w=1920&amp;q=75 1x, /_next/image?url=%2Fposts%2Fstop-using-gifs%2Fmedium-size.png&amp;w=3840&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fstop-using-gifs%2Fmedium-size.png&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> GIF file size of 1.0 MB and load time of 485 ms. The original files ize of the GIF remains unchanged and the load time for the GIF is around 10 times the load time of the MPEG4 file that Twitter uses. That being said, Medium does do a cool optimization where they show a very blurred image of your GIF until it has fully loaded the GIF, so that the user can at least see something while waiting for the GIF to load. Dev Community The Dev Community, just like Medium, doesn't optimize uploaded GIFs for articles written on the platform. <img alt="HTML element corresponding to uploaded GIF" srcSet="/_next/image?url=%2Fposts%2Fstop-using-gifs%2Fdev-html.png&amp;w=1080&amp;q=75 1x, /_next/image?url=%2Fposts%2Fstop-using-gifs%2Fdev-html.png&amp;w=1920&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fstop-using-gifs%2Fdev-html.png&amp;w=1920&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> HTML image element corresponding to the upload GIF of Fogel. <img alt="Loaded asset as shown in the chrome developer tools" srcSet="/_next/image?url=%2Fposts%2Fstop-using-gifs%2Fdev-size.png&amp;w=1920&amp;q=75 1x, /_next/image?url=%2Fposts%2Fstop-using-gifs%2Fdev-size.png&amp;w=3840&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fstop-using-gifs%2Fdev-size.png&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> GIF file size of 1.0 MB and load time of 386 ms. Again, the original file size of the GIF remains unchanged, but the load time is faster compared to Medium (386 ms vs 485 ms). Not sure why this is, but the load time of an asset depends on many factors, network speed being one of them. One interesting thing to point out is that the Dev Community uses the loading="lazy" attribute on their <img> elements. This allows for the GIF to only be loaded when a user scrolls near it. However, at the time of writing, the loading attribute is only currently supported in the latest version of chrome, and can only be enabled through a feature flag. <img alt="Native lazy loaded image support" srcSet="/_next/image?url=%2Fposts%2Fstop-using-gifs%2Flazy-load.png&amp;w=1920&amp;q=75 1x, /_next/image?url=%2Fposts%2Fstop-using-gifs%2Flazy-load.png&amp;w=3840&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fstop-using-gifs%2Flazy-load.png&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> Support for the loading attribute on img elements at the time of writing (See current support here). One other thing that I've noticed with the Dev Community is that they are using Cloudinary as a CDN for their image and video assets (notice the URL of the GIF source in the HTML <img> element). Because they are using Cloudinary, the Dev Community could take advantage of Cloudinary's ability to use lossy compression to compress any uploaded GIF assets and reduce the file size by around 50% without losing too much quality. Even better, Cloudinary can automatically convert GIFs to WebM and/or MPEG4 videos which will result in even more savings in file size compared to the lossy GIF compression. Best video format There are 2 video formats that are popular choices for videos on the web: WebM and MPEG4. MPEG4 is the format that's been around for the longest since around 1999 and enjoys great browser support. As shown above, Twitter uses MPEG4 videos to replace GIFs. WebM has been around since 2010 and has a slight advantage over MPEG4 in that it can achieve equal quality video at a smaller file size compared to MPEG4. Unfortunately, WebM video browser support isn't as good as that of MPEG4. <img alt="MPEG4 browser support" srcSet="/_next/image?url=%2Fposts%2Fstop-using-gifs%2Fmpeg4-support.png&amp;w=1920&amp;q=75 1x, /_next/image?url=%2Fposts%2Fstop-using-gifs%2Fmpeg4-support.png&amp;w=3840&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fstop-using-gifs%2Fmpeg4-support.png&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> Browser support for MPEG4 videos at the time of writing (See current support here). <img alt="WebM browser support" srcSet="/_next/image?url=%2Fposts%2Fstop-using-gifs%2Fwebm-support.png&amp;w=1920&amp;q=75 1x, /_next/image?url=%2Fposts%2Fstop-using-gifs%2Fwebm-support.png&amp;w=3840&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fstop-using-gifs%2Fwebm-support.png&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> Browser support for WebM videos at the time of writing (See current support here). Converting GIFs to WebM and MPEG4 using ffmpeg ffmpeg is a free command line tool that can be used to convert GIFs into WebM or MPEG4 video files. You can do a lot of audio and video manipulations with ffmpeg, but I will admit that knowing the right commands to use is not obvious when reading their documentation or if you are new to audio/video-specific terminology. In order to run any ffmpeg command, you'll need to first install it on your machine. Personally, what I end up doing is that I convert a .gif file (or .mov if I do a screen recording on my mac) into both a .webm and .mp4 file. Specifically, the two commands that I use are the following: Convert .gif to .webm bash1ffmpeg -i input-name.gif -c:v libvpx-vp9 -b:v 0 -crf 40 output-name.webm -i input-name.gif -> Specify the input file -c:v libvpx-vp9 -> Selects the VP9 webm video encoder -b:v 0 -> Specify a bitrate of 0 to enable "Constant Quality" mode. -crf 40 -> Specify the video quality to be used. A lower number corresponds with a higher quality video, but also a larger file size. Convert .gif to .mp4 bash1ffmpeg -i input-name.gif -b:v 0 -crf 25 output.mp4 -i input-name.gif -> Specify the input file. -b:v 0 -> Specify a bitrate of 0 to enable "Constant Rate Factor" mode for the MPEG4 encoder. -crf 25 -> Specify the video quality to be used. A lower number corresponds with a higher quality video, but also a larger file size. Notice how the -crf value passed to the MPEG4 command is lower than that of the value passed to the WebM command, which might make you think you're getting a higher quality video with MPEG4. However, since we're using different encoders between both WebM and MPEG4 conversions, the -crf values are not comparable. You need to evaluate quality by watching the outputted video. When converting the Fogel GIF that I used earlier in the article to WebM and MPEG4 using the above commands, I get a WebM file size of 59 KB and and MPEG4 file size of 105 KB. To demonstrate the visual quality of both videos, i've added them below, with the WebM video first and the MPEG4 video second. Of course, if you're viewing the WebM video on an unsupported browser, it sadly won't work for you. WebM video of the Superbad GIFMPEG4 video of the Superbad GIF Adding videos to HTML You can add videos to your HTML using the <video> element along with nested <source> elements. What's cool is that you can add multiple sources inside your <video> element in order to specify fallback videos in case a particular video type is not supported. For example, if we want to use WebM videos for browsers that support WebM and MPEG4 videos for browsers that don't support WebM, we could use the following markup: html1<video>2 <source src="my-video.webm" type="video/webm" />3 <source src="my-video.mp4" type="video/mp4" />4</video> Furthermore, if you'd like to have the video behave similarly to a GIF by having it autoplay and infinitely loop, you can add the boolean attributes autoplay, loop, muted, and playsinline to the <video> element. html1<video autoplay loop muted playsinline>2 <source src="my-video.webm" type="video/webm" />3 <source src="my-video.mp4" type="video/mp4" />4</video> As you can see, GIFs are ill-suited for usage on the web, but videos can replace them. Of course, it does take some work on the developers side in order to convert GIFs to videos, but that can result in a meaningful impact to end users. As alluded to earlier, there are some tools that can help automate the conversion of GIFs to videos, by using services such as Cloudinary to host your image and video assets.'''
author = "Robert Cooper"
year_published = 2019
year_updated = 2019
