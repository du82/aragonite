lains what it is and how to use Docker images, containers, volumes, and networks.How to get your first 1000 reputation on Stack OverflowAugust 09, 2020•🕙9 min readBeing able to reach 1000 reputation on Stack Overflow is an achievement that brings along a certain level of respect and opportunities.How to make a table row a linkJuly 16, 2020•🕙8 min readLearn possible solutions and workarounds for turning HTML rows into clickable links.How to write a commit message that will make your mom proudJune 17, 2020•🕙9 min readLearn how to style and format a commit message for optimal readability, especially if using GitHub to host your git repository.Deploy an app to multiple environments with VercelApril 04, 2020•🕙4 min readLearn how to deploy an app to multiple environments accessible at different custom domains on the Vercel platform.Setup Dokku on Digital OceanMarch 22, 2020•🕙9 min readInstall the latest version of Dokku a Digital Ocean Droplet and deploy a web application using Dokku.Have Confidence in Your Redux Apps With Integration and Unit TestingAugust 19, 2019•🕙13 min readReact applications built with Redux should include both integration and unit tests for make sure your app runs with confidence.Stop Using GIFs on WebsitesAugust 05, 2019•🕙9 min readGIFs are not optimal file formats for usage on the web, but luckily they can be replaced with WebM and MPEG4 videos for optimal performance.Comparing NextJS and GatsbyJS Static Site GenerationJuly 29, 2019•🕙5 min readLearn the differences between how NextJS and GatsbyJS generate files used for a static website and which tool is best for which situations.Premature Optimize the Heck Out of Your React Apps Using MemoizationJuly 22, 2019•🕙11 min readOptimize React applications using memoization techniques such as the useCallback and useMemo hooks along with the React.memo higher order component.How Yarn Lock Files Work and Upgrading DependenciesJuly 16, 2019•🕙6 min readLearn why yarn generates a lock file, why a lock file is