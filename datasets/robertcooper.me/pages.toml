["https://robertcooper.me/post/get-started-with-typescript-in-2019"]
title = "Get Started With Typescript in 2019"
description = "TypeScript is gaining more popularity in the JavaScript community and there is no better time than 2019 to start using TypeScript in your projects."
full_description = '''Based on the Stack Overflow Developer survey in 2018, TypeScript is more "loved" as a programming language than JavaScript. The reason TypeScript is so loved amongst JavaScript developers is because adding types to JavaScript allows you to spot errors before running your code. The errors provided by the TypeScript compiler will give a good indication of how an error can be fixed. Adding types to JavaScript also allows code editors to provide some more advanced features, such as code completion, project-wide refactoring, and automatic module importing. <img alt="Results of the most loved programming languages survey question from the 2018 Stack Overflow Developer Survey" srcSet="/_next/image?url=%2Fposts%2Fget-started-with-typescript-in-2019%2Fimage-1.png&amp;w=1920&amp;q=75 1x, /_next/image?url=%2Fposts%2Fget-started-with-typescript-in-2019%2Fimage-1.png&amp;w=3840&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fget-started-with-typescript-in-2019%2Fimage-1.png&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> Results of the "most loved programming languages" survey question from the 2018 Stack Overflow Developer Survey Learning TypeScript might seem intimidating if you come to think of it as a completely new programming language. However, TypeScript is just an added layer to JavaScript and you by no means have to know every bit of syntax that comes along with TypeScript before you can start using it. TypeScript allows you to easily convert a JavaScript file by changing the file extension from .js to .ts and all the code will compile properly as TypeScript. You can configure TypeScript to be more restrictive if you want to enforce a larger percentage of type coverage in your TypeScript files, but that can be done once you get more familiar with the language. This article aims to bring you up to speed with around 95% of the scenarios you will typically encounter in a standard TypeScript project. For that last 5%, well, Google is your friend and I've added links to useful TypeScript resources at the bottom of the article. Setting Up TypeScript Of course, to begin writing TypeScript that compiles correctly, a properly configured development environment is required. 1. Install the TypeScript compiler To start off, the TypeScript compiler will need to be installed in order to convert TypeScript files into JavaScript files. To do this, TypeScript can either be installed globally (available anywhere in your file system) or locally (only available at the project level). bash1# NPM Installation Method2 3npm install --global typescript # Global installation4npm install --save-dev typescript # Local installation5 6# Yarn Installation Method7 8yarn global add typescript # Global installation9yarn add --dev typescript # Local installation Commands to run from the command line to install TypeScript globally or locally on your computer 2. Make sure your editor is setup to support TypeScript You'll want to make sure your editor is properly configured to work with TypeScript. For example, you may need to install a plugin (such as atom-typescript if using the atom editor), in order to fully take advantage of TypeScript in your editor. If using VS Code, TypeScript support is built-in, so there are no extensions required 😎. 3. Create a tsconfig.json file A tsconfig.json file is used to configure TypeScript project settings. The tsconfig.json file should be put in the project's root directory. The file allows you to configure the TypeScript compiler with different options. You can have the tsconfig.json contain an empty JSON object if you just want to get TypeScript to work, but if you need the TypeScript compiler to behave differently (such as output transpiled JavaScript files in a specific output directory), you can read more about which settings can be configured. Note: You can also run the tsc --init to generate a tsconfig.json file with some default options set for you and a bunch of other options commented out 4. Transpile TypeScript to JavaScript In order to transpile your TypeScript code to JavaScript, the tsc command needs to be run in the terminal. Running tsc will have the TypeScript compiler search for the tsconfig.json file which will determine the project's root directory as well as which options to use when compiling the TypeScript and transpiling .ts files to .js files. To quickly test that the setup works, you can create a test TypeScript file and then run tsc in the command line and see if a JavaScript file is generated beside the TypeScript file. For example, this TypeScript file… typescript1const greeting = (person: string) => {2 console.log('Good day ' + person);3};4 5greeting('Daniel'); Example TypeScript syntax Should transpile to this JavaScript file… javascript1var greeting = function(person) {2 console.log('Good day ' + person);3};4 5greeting('Daniel'); JavaScript file that gets generated from transpiling TypeScript If you'd like for the TypeScript compiler to watch for changes in your TypeScript files and automatically trigger the transpilation of .ts to .js files, you can run the tsc -p. command in your project's repository. In VS Code, you can use ⌘⇧B to bring up a menu that can run the transpiler in either normal or watch modes (tsc:build or tsc:watch, respectively). <img alt="The VS Code build tasks menu that can be brought up using ⌘⇧B" srcSet="/_next/image?url=%2Fposts%2Fget-started-with-typescript-in-2019%2Fimage-2.png&amp;w=1920&amp;q=75 1x, /_next/image?url=%2Fposts%2Fget-started-with-typescript-in-2019%2Fimage-2.png&amp;w=3840&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fget-started-with-typescript-in-2019%2Fimage-2.png&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> The VS Code build tasks menu that can be brought up using ⌘⇧B Understanding Static and Dynamic Types JavaScript comes with 7 dynamic types: Undefined Null Boolean Number String Symbol Object The above types are called dynamic since they are used at runtime. TypeScript brings along static types to the JavaScript language, and those types are evaluated at compile time (without having to run the code). Static types are what predict the value of dynamic types and this can help warn you of possible errors without having to run the code. Basic Static Types Alright, let's dive into the syntax of TypeScript. What follows are the most commonly seen types in TypeScript. Note: I've left out the never and object types since, in my experience, they are not very commonly used. boolean The simple true and false values you've come to know and love. typescript1let isAwesome: boolean = true; boolean type annotation string Textual data surrounded in either single quotes ('), double quotes ("), or back ticks (```). typescript1let name: string = 'Chris';2let breed: string = 'Border Collie'; string type annotation If using back ticks, the string is called a template literal and expressions can be interpolated within them. typescript1let punchline: string = 'Because it was free-range.';2let joke: string = `3 Q: Why did the chicken cross the road?4 A: ${punchline}5`; string type annotation with the use of template literals number Any floating point number is given the type of number. The four types of number literals that are supported as part of TypeScript are decimal, binary, octal and hexadecimal. typescript1let decimalNumber: number = 42;2let binaryNumber: number = 0b101010; // => 423let octalNumber: number = 0o52; // => 424let hexadecimalNumber: number = 0x2a; // => 42 number type annotation Note: If the binary, octal, and hexadecimal numbers confuse you, you're not alone. array Array types in TypeScript can be written in two ways. The first way requires that [] be postfixed to the type of elements that are found in the array. typescript1let myPetFamily: string[] = ['rocket', 'fluffly', 'harry']; array of strings using the square bracket notation The alternative way to write Array types is to use Array followed by the type of elements that are found in the array (within angle brackets). typescript1let myPetFamily: Array<string> = ['rocket', 'fluffly', 'harry']; array of strings using the angle bracket notation tuple A tuple is an array that contains a fixed number of elements with associated types. typescript1let myFavoriteTuple: [string, number, boolean];2 3myFavoriteTuple = ['chair', 20, true]; // ✅4myFavoriteTuple = [5, 20, true]; // ❌ - The first element should be a string, not a number Declaring a tuple with 3 elements and then assigning values to the tuple enum An enum is a way to associate names to a constant value, which can be either a number or a string. Enums are useful when you want to have a set of distinct values that have a descriptive name associated with it. By default, enums are assigned numbers that start at 0 and increase by 1 for each member of the enum. typescript1enum Sizes {2 Small,3 Medium,4 Large,5}6 7Sizes.Small; // => 08Sizes.Medium; // => 19Sizes.Large; // => 2 Example of an enum starting at 0 The first value can be set to a value other than 0. typescript1enum Sizes {2 Small = 1,3 Medium,4 Large,5}6 7Sizes.Small; // => 18Sizes.Medium; // => 29Sizes.Large; // => 3 Example of an enum starting at a value other than 0 Enums are by default assigned numbers, however, string values can also be assigned to an enum. typescript1enum ThemeColors {2 Primary = 'primary',3 Secondary = 'secondary',4 Dark = 'dark',5 DarkSecondary = 'darkSecondary',6} Example of an enum with string values any If the type of a variable is not known and we don't want the type checker to complain at compilation time, then the type of any can be used. typescript1let whoKnows: any = 4; // assigned a number2 3whoKnows = 'a beautiful string'; // can be reassigned to a string4whoKnows = false; // can be reassigned to a boolean Example of the any type any will likely frequently be used when starting out with TypeScript. However, it's best to try to reduce the usage of any since the usefulness of TypeScript decreases when the compiler isn't aware of the types associated with variables. void When there is no type associated with something, the void type should be used. It is most commonly used when specifying the return value of a function that doesn't return anything. typescript1const darkestPlaceOnEarth = (): void => {2 console.log('Marianas Trench');3}; Example of using the void type null and undefined Both null and undefined correspond to the types of the null and undefined values you might see in JavaScript. These types aren't very useful when used on their own. typescript1let anUndefinedVariable: undefined = undefined;2let aNullVariable: null = null; Example of how the null and undefined types could be used By default the null and undefined types are subtypes of all other types, meaning that a variable of type string can be assigned a value of null or undefined. This is often undesirable behavior and thus it's usually recommended to set the strictNullChecks compiler option in a tsconfig.json file to true. Setting the strictNullChecks option to true makes it so that null and undefined need to be explicitly set as a type for a variable. Type Inference Fortunately, you don' have to specify types absolutely everywhere in your code because TypeScript has what is called Type Inference. Type inference is what the TypeScript compiler uses to automatically determine types. Basic Type Inference TypeScript can infer types during variable initialization, when default parameter values are set, and while determining function return values. typescript1// Variable initialization2let x = 10; // x is given the number type Example of type inference where the x variable has an inferred type of number In the above example, x is assigned a number, TypeScript associates the x variable with a type of number. typescript1// Default function parameters2const tweetLength = (message = 'A default tweet') => {3 return message.length;4}; An inferred type of string is given to the message parameter In the above example, the message parameter is assigned a default value which is of type string, so therefore the TypeScript compiler infers that message is of type string and therefore doesn't throw a compilation error when the length property is being accessed. typescript1function add(a: number, b: number) {2 return a + b;3}4 5const result = add(2, 4);6 7result.toFixed(2); // ✅8result.length; // ❌ - length is not a property of number types An inferred type of number is assigned to the return value of the add function based on the types of the function's parameters In the above example, since TypeScript is told that both parameters to the add function have a type of number, it can infer that the return type will also be a number. Best Common Type Inference When a type is being inferred from multiple possible types, TypeScript uses a Best Common Type algorithm to pick a type that works with all the other candidates. typescript1let list = [10, 22, 4, null, 5];2 3list.push(6); // ✅4list.push(null); // ✅5list.push('nope'); // ❌ - type 'string' is neither of type 'number' or 'null' The best common type algorithm determines that only number and null types should be allowed as elements to the list array In the above example, the array is composed of both number and null types, and therefore TypeScript expects only number and null values to be a part of the array. Type Annotation When the Type Inference system is not enough, you will need to declare types on variables and objects. Basic Types All the types introduced in the Basic Static Types section can be declared using a : followed by the name of the type. typescript1let aBoolean: boolean = true;2let aNumber: number = 10;3let aString: string = 'woohoo'; Examples of annotating basic types Arrays As shown in the section talking about the array type, arrays can be annotated one of two ways. typescript1// First method is using the square bracket notation2let messageArray: string[] = ['hello', 'my name is fred', 'bye'];3 4// Second method uses the Array keyword notation5let messageArray: Array<string> = ['hello', 'my name is fred', 'bye']; Annotating arrays Interfaces One way to put together multiple type annotations is by using an interface. typescript1interface Animal {2 kind: string;3 weight: number;4}5 6let dog: Animal;7 8dog = {9 kind: 'mammal',10 weight: 10,11}; // ✅12 13dog = {14 kind: true,15 weight: 10,16}; // ❌ - kind should be a string Annotating types using an interface Type Alias To make things confusing, TypeScript also allows you to specify multiple type annotations using a type alias. typescript1type Animal = {2 kind: string'''
