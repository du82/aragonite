["https://robertcooper.me/post/grid-does-not-replace-flexbox"]
title = "CSS Grid Is Not a Replacement for Flexbox"
description = "CSS grid cannot completely replace the need for flexbox layout when it comes to styling HTML elements."
full_description = "I've only recently started using CSS grid properties when styling HTML elements. In order to force myself to become comfortable with the CSS grid properties, I wanted to completely stop using flexbox properties in my code and instead use CSS grid properties. However, I quickly found out that CSS grid is not a replacement for flexbox since there are a few scenarios in which you can only style a layout with flexbox. This post will highlight one of the scenarios in which a layout can only be styled with flexbox and not CSS grid: Wrapping Elements Flexbox should be used if items are to be wrapped to the next line when the width of the flex container becomes narrower. This can be done using the flex-wrap property. CSS grid is capable of having varying column widths and adjusting the number of columns based on the width of the container and the width of the child elements. This can be done using the grid-template-columns property in combination with the auto-fit or auto-fill keywords (read more about that in this article by Sara Soueidan). However, the wrapped elements cannot be centered relative to the parent like they can be in flexbox. Take a look at the following example of elements that wrap to the next line when the container width changes. In the flexbox example, when the width of the parent container decreases, the wrapped element becomes centered relative to the parent container. When the same resizing action is done in the grid example, the element wraps onto the next line, but it cannot be centered relative the the parent container. You can try out the example yourself by dragging the handle on the bottom right of the parent container of each example to change the width. Otherwise, there is a video of the demo that can be viewed. Flexbox Example .css-5vucii{border:4px solid #564787;width:100%;max-width:100%;margin:auto;resize:horizontal;overflow:auto;display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;padding:5px;-webkit-flex-wrap:wrap;-ms-flex-wrap:wrap;flex-wrap:wrap;-webkit-box-pack:space-around;-webkit-justify-content:space-around;-ms-flex-pack:space-around;justify-content:space-around;}.css-1h82jue{height:100px;border:4px solid #dbcbd8;max-width:100%;-webkit-flex-basis:220px;-ms-flex-preferred-size:220px;flex-basis:220px;margin:5px;} Flexbox Video Demo Grid Example .css-3ui2kf{border:4px solid #564787;width:100%;max-width:100%;margin:auto;resize:horizontal;overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));grid-gap:10px;-webkit-box-pack:center;-webkit-justify-content:center;-ms-flex-pack:center;justify-content:center;}.css-1cwf12i{height:100px;border:4px solid #dbcbd8;max-width:100%;justify-self:center;width:220px;} Grid Video Demo Useful Resources The following links explain whether CSS grid of flexbox is the most appropriate tool for styling a particular layout: Cris Coyier: Quick! What’s the Difference Between Flexbox and Grid? Rachel Andrew: Use Cases For Flexbox"
author = "Robert Cooper"
year_published = 2019
year_updated = 2019
clearnet = "https://robertcooper.me/post/grid-does-not-replace-flexbox"
