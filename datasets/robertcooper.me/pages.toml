["https://robertcooper.me/docker-guide"]
title = "Docker guide"
description = "A comprehensive guide about Docker that explains what it is and how to use Docker images, containers, volumes, and networks."
full_description = '''<img alt="Docker guide" srcSet="/_next/image?url=%2Fposts%2Fdocker-guide%2Fcover.jpg&amp;w=2048&amp;q=75 1x, /_next/image?url=%2Fposts%2Fdocker-guide%2Fcover.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fdocker-guide%2Fcover.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> The purpose of this guide is to explain the most important concepts related to Docker to be able to effectively work with Docker for application development purposes. Table of contentsWhat is Docker?What about virtual machines?Docker engineInstalling DockerDockerfileDocker imagesBuilding and tagging imagesListing imagesImage registries and pulling/pushing imagesRemoving imagesSaving and loading imagesDocker containersRunning containersDetached mode and viewing logsExposing portsStopping and removing containersListing containersExecute commands in a running containerGet details of a containerDocker volumesDocker networksRemoving unused images, containers, and volumesDocker ComposeManaging environment variablesDeploying and running Docker applicationsDokkuHeroku and Digital Ocean App PlatformKubernetesAvoiding the Docker command lineDocker DesktopVisual Studio CodeDockstationDebugging dockerized appsVisual Studio CodeJetBrains IDEsNavigating the Docker documentationAdditional resources What is Docker? Docker is a tool that helps run applications in isolated environments. There has always been a need to make sure applications can run in isolated environments for applications to run as expected on different machines/servers. This is important to be able to develop applications on a local machine and have them run as expected in a deployed environment. It's also important for developers to be able to run applications as expected on any computer to get up and running quickly and collaborate with other developers no matter how they've configured their computer. The reason why running applications on different machines is so difficult is that all the right versions of an application's dependencies must be installed for it to run as expected. For example, if trying to run an API that is built with Node.js, and it was developed and tested on a machine using Node.js 12.8, it might not necessarily run the same on a machine that has Node.js version 10.18 installed. The same goes for any other dependency used in applications, such as python, ruby, php, typescript, nginx, apache, mysql, postgres, etc. Docker makes it possible to build containerized applications that hold the right versions of all dependencies and can run as intended on different machines. Docker has 4 types of "objects" it uses to be able to create these isolated environments: images, containers, volumes, and networks. The two objects users will most often be directly working with are Docker images and Docker containers. <img alt="Docker objects: images, containers, volumes, and networks" srcSet="/_next/image?url=%2Fposts%2Fdocker-guide%2Fdocker-objects.jpg&amp;w=3840&amp;q=75 1x" src="/_next/image?url=%2Fposts%2Fdocker-guide%2Fdocker-objects.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> Docker images contain the code that is needed to run an application and Docker containers are the isolated environments that are running the code from Docker images. A Docker image can be thought of as the blueprints and code used by a Docker container. Docker images can be saved to image registries for others to download the images. The most popular Docker image registry is Docker Hub. You can think of image registries as the NPM equivalent for Docker images. Read more about Docker images and containers in the Docker images and Docker containers sections of the guide, respectively. Docker volumes are used to persist data that is generated by running Docker containers. By saving data to a Docker volume, it will permit an application to have the same data even if the Docker container has been removed, recreated, or restarted. Docker volumes are also useful if two different containers should have access to the same data since both containers can point to the same volume. Docker networks are used to make sure containers are isolated from each other and are also used to allow containers to communicate with each other. Read more about Docker volumes and networks in the Docker volumes and Docker networks sections of the guide, respectively. Resources 📝Related resources "Docker Overview" from the official Docker documentation What about virtual machines? Virtual machines (VMs) often come up in the same conversation as Docker since they are both be used to create isolated environments. With Docker, applications run in isolated environments called containers and each one of these containers share the same operating system kernel on a machine. On the other hand, applications that run on virtual machines run in their own operating system and don't share an underlying kernel. Virtual machines operate with the help of a hypervisor which is responsible for managing which operating system to run. <img alt="Type 1 Hypervisors" srcSet="/_next/image?url=%2Fposts%2Fdocker-guide%2Fhypervisors-type-1.jpg&amp;w=3840&amp;q=75 1x" src="/_next/image?url=%2Fposts%2Fdocker-guide%2Fhypervisors-type-1.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> Type 1 Hypervisors (Paravirtualization): Hypervisor sits on bare metal hardware and each OS sits on the hypervisor. e.g. VMware ESXi, Oracle VM Server, Microsoft Hyper-V <img alt="Type 2 Hypervisors" srcSet="/_next/image?url=%2Fposts%2Fdocker-guide%2Fhypervisors-type-2.jpg&amp;w=3840&amp;q=75 1x" src="/_next/image?url=%2Fposts%2Fdocker-guide%2Fhypervisors-type-2.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> Type 2 Hypervisors (Emulation): Hypervisor sits on top of the host OS. e.g. Oracle VirtualBox, Parallels, VMware Workstation Side note 📝Linux kernel is fundamentally usedTo run Linux Docker containers, a Linux kernel needs to be present on the machine. Docker handles this for you if you install the Docker Desktop app for Mac OS or Windows, which ships with LinuxKit: a lightweight Linux kernel that runs on Mac OS or Windows operating systems and is used by the Docker engine. The lightweight Linux kernel sits on a hypervisor that ships natively with Windows (reference) and Mac OS (reference).<img alt="Docker hardware and software breakdown on Linux, Mac OS, and Windows OS" srcSet="/_next/image?url=%2Fposts%2Fdocker-guide%2Fdocker-on-linux-windows-mac.jpg&amp;w=3840&amp;q=75 1x" src="/_next/image?url=%2Fposts%2Fdocker-guide%2Fdocker-on-linux-windows-mac.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> The advantages of using Docker over virtual machines overwhelmingly tip the scales in favor of using Docker. Compared to virtual machines, Docker containers can get up in running within seconds compared to minutes, are lightweight (magnitude of MBs compared to GBs), are easily configurable, and use a small amount of resources. Perhaps the only reason to use a virtual machine over docker is if a high level of isolation is desired because of concerns about security vulnerabilities associated with having Docker containers using a shared kernel on the host operating system. Resources 📝Related resources Explanation of the types of hypervisors by Geek University Explanation of the pros and cons of Docker and Virtual Machines by Geekflare Explanation of Docker containers and the differences between containers and virtual machines in the Docker documentation "How is Docker different from a virtual machine?" question on Stack Overflow with many useful answers, including this one defining paravirtualization and emulation Docker engine The Docker engine needs to be installed and running on any machine that wants to do anything related to Docker. Starting the engine means that a long-running background process (the Docker daemon which also corresponds with the dockerd command) gets started to create a server that can be interacted with via a REST API. The Docker CLI is the way most people interact with the REST API to manage Docker objects, but 3rd party apps are also able to interact directly with the REST API or via Docker engine SDKs. <img alt="Docker engine" srcSet="/_next/image?url=%2Fposts%2Fdocker-guide%2Fdocker-engine.jpg&amp;w=3840&amp;q=75 1x" src="/_next/image?url=%2Fposts%2Fdocker-guide%2Fdocker-engine.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> Resources 📝Related resources "Docker Engine overview" in the Docker documentation Installing Docker The easiest way to install all Docker related dependencies is to install Docker Desktop. Docker Desktop comes with several Docker related tools including the Docker Engine, Docker CLI, and Docker Compose CLI (read about Docker Compose here). Docker Desktop is available for download on Mac and Windows: Mac download Windows download Once the above is installed, ensure that the Docker Desktop is running. If the Docker Desktop is running it means that the Docker engine is running and the Docker CLI commands mentioned in this guide will be able to be executed. <img alt="Docker Desktop is running indicator" srcSet="/_next/image?url=%2Fposts%2Fdocker-guide%2Fdocker-desktop-running.png&amp;w=384&amp;q=75 1x, /_next/image?url=%2Fposts%2Fdocker-guide%2Fdocker-desktop-running.png&amp;w=640&amp;q=75 2x" src="/_next/image?url=%2Fposts%2Fdocker-guide%2Fdocker-desktop-running.png&amp;w=640&amp;q=75" decoding="async" data-nimg="true" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"/> Indication in the Mac OS menu bar that Docker Desktop is running. For Linux users, there is no Docker Desktop, so each component must be installed individually: Docker Engine + CLI Docker Compose On Linux, the Docker daemon must be started using the following command: $sudo systemctl start docker The above command should work since systemctl ships with most Linux distributions, but if not, use sudo service docker start. There is also a way to automatically have Linux start Docker on system boot. Resources 📝Related resources "Docker Desktop overview" in the Docker documentation Dockerfile A Dockerfile is a file that holds the instructions on how to build an image. The file generally begins by specifying a base image that will be used as the basis of the Docker image to be built. For example, if building a python based API, a base image that is made up of a Linux OS with python installed on it can be used. After specifying a base image, other instructions are used that can specify the following details on how to the Docker image should be built: Environment variables to set in a container Ports exposed by the image Which files should be copied into the image Which dependencies should be installed Command to be executed when starting a container (e.g. yarn start if starting a Node.js API) And more... As an example, an image for a Node.js API might have a Dockerfile similar to the following: Dockerfile1# Base image that has Node version 12.16.1 installed on a Linux OS.2# This is an alpine Linux image that is smaller than the non-alpine Linux equivalent images.3FROM node:12.16.1-alpine3.114 5# Installs some dependencies required for the Node.js API6RUN apk add --no-cache make g++7 8# Indicates that the API exposes port 30009EXPOSE 300010 11# Specifies the working directory. All the paths referenced after this point will be relative to this directory.12WORKDIR /usr/src/app13 14# Copy all local source files into the Docker container's working directory15COPY . .16 17# Installs NPM dependencies using yarn18RUN yarn install19 20# Command to start the API which will get executed when a Docker container using this image is started.21CMD [ "yarn", "start" ] Frequently used instructions are described in the table below. The full list of instructions can be found in the Dockerfile reference documentation. Instruction Description FROM Defines a base image RUN Executes command in a new image layer CMD Command to be executed when running a container EXPOSE Documents which ports are exposed (not used for anything other than documentation) ENV Sets environment variables COPY Copies files/directories into the image ADD A more feature-rich version of the COPY instruction. COPY is preferred over ADD. ENTRYPOINT Define a container's executable. See the difference between the CMD instruction here. VOLUME Defines which directory in an image should be treated as a volume. The volume will be given a random name which can be found using docker inspect command. WORKDIR Defines the working directory for subsequent instructions in the Dockerfile ARG Defines variables that can be passed by the docker build --build-arg command and used within the Dockerfile. If some files should be prevented from being copied into the Docker image, a .dockerignore file can be added at the same level as the Dockerfile where files that should not be copied over into the Docker image can be specified. This means that if using a COPY or ADD instruction in a Dockerfile to specify the files to be added into a Docker image, any file specified in the .dockerignore file will be ignored and not added into the Docker image. This may be desirable to prevent files that contain sensitive information (e.g. .env files that hold API keys) or large unnecessary files from being added to a Docker image. Make sure to know the correct syntax to use when specifying files to be ignored in the .dockerignore file. Pro tip ⭐️Use Alpine Linux base imagesMany base images have an Alpine Linux equivalent which is much smaller than their non-apline equivalent. Building smaller Docker images is advantageous because y'''
author = "Robert Cooper"
year_published = 2020
year_updated = 2020
clearnet = "https://robertcooper.me/docker-guide"
