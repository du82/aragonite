description = "The home page of Robin Sloan, author of the novels Moonbound, Sourdough, and Mr. Penumbra's 24-Hour Bookstore."
full_description = "Robin Sloan,a fiction writer I’m the author of Moonbound, Sourdough, and Mr. Penumbra’s 24-Hour Bookstore, pub­lished by MCD×FSG in the United States, Tokyo Sogensha in Japan, and many others around the world. I am also … co-owner of Fat Gold and co-author of this guide to extra virgin olive oil one half of The Cotton Modules, a band creator of this app, this e-book template, etc. Here are today’s counts of e-book and audio­book holds for my novels at public libraries across the U.S.: Moonbound: ... Sourdough: ... Penumbra: ... My newsletter goes out every 29 ½ days. It ranges widely, across books and media and modern life, and I always try to make it feel like a note from a friend. My blog is about media and technology, cre­ative computing, AI aesthetics, & more. Basically, it’s devoted to the topics that are too nerdy for my newsletter. I’ve pub­lished a lot of mate­rial across a few dif­ferent internet eras. Here’s a direc­tory of what’s avail­able on this web­site and elsewhere. Basics About me Contact info Instagram account RSS feed Newsletter archives Main newsletter Lab newsletter Novels Mr. Penumbra’s 24-Hour Bookstore Sourdough Moonbound ★ Novellas Annabel Scheme Ajax Penumbra 1969 ★ Annabel Scheme and the Adventure of the New Golden Gate The Suitcase Clone Special projects Fish, an app The Greatest Remaining Hits, a sci-fi concept album ★ Shadow Planet, a sci-fi non-concept album platforms.fyi, a rhetorical exhibit The amulet, a new kind of poem The Fat Gold Guide to Extra Virgin Olive Oil Short stories The Writer and the Witch ★ The Wrong Plane Last Beautiful The Truth About the East Wind The Counselor Terraform Proposal for a Book to Be Adapted Into a Movie Starring Dwayne The Rock Johnson Julie Rubicon Facebook The Sleep Consultant My Father the Druid, My Mother the Tree The Conspiracy Museum (The Atlantic) Elyse Flayme and the Final Flood MIT Technology Review Harriet Amber in the Conan Arcade Commercial Type Author’s Note Google In the Stacks Brand New Box Notable essays An app can be a home-cooked meal Reckoning with Detective Comics Notes on Web3 Return to Nib’s Knoll Aeon ★ I Played Fortnite and Figured Out the Universe The Atlantic Dancing the flip-flop The Wiggle of Least Resistance The New York Times The waybacklist A collection of notes, blog posts, etc. This web­site was most recently updated on March 1, 2025. If you’re here because you are curious about my writing and/or thinking, I encourage you to start with my novels. They’re avail­able wher­ever books can be pur­chased or borrowed. The audio­book edi­tions are great, too. Thanks for stopping by!"
