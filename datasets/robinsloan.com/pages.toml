description = "A detective story about all the possible versions of a place, presented in a lightweight web format."
full_description = "Annabel Scheme and the Adventure of the New Golden Gate This is a detec­tive story about all the pos­sible ver­sions of a place. It fea­tures a bustling city built on a filled-in San Fran­cisco Bay, a pop star tech genius named Quintessandra, and internet teeth. The web edition This story was ini­tially pub­lished as a daily serial in two Bay Area newspapers, the Mer­cury News and East Bay Times, in the summer of 2020. Fol­lowing that serialization, a group of a thou­sand patrons joined a lo-fi crowd­funding cam­paign, paying $9 each to receive a dig­ital edi­tion for them­selves and also unlock this web edi­tion for everyone. Read now The code An addi­tional goal of the crowd­funding cam­paign was to sup­port the release of the web edi­tion’s code, which is now available on GitHub."
