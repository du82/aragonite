full_description = "router32: 2011-12-15 в 13:00 Чудесная статья! Большое спасибо автору! Войдите, чтобы ответить rikzi_em: 2012-01-18 в 20:45 А почему линия А0 (к которой подключена кнопка) настроена как плавающий вход(GPIO_Mode_IN_FLOATING)??? Всегда использовал внутреннюю подтяжку к питанию. Соответственно когда кнопка не нажата, то на выводе уровень логической единицы, если нажали кнопку — на выводе контроллера логический ноль. Так же можно здесь сделать??? Войдите, чтобы ответить burjui: 2012-01-19 в 12:19 Можно, но если заглянуть в STM32VLDiscovery User manual, то там вы найдёте принципиальную схему платы, на которой видно, что пользовательская кнопка уже прижата к земле через резистор R21 (10 K). R22 (0) — это просто перемычка, если что. Пожалуй, не лишним будет упомянуть это в статье. Кстати, одного вопросительного знака мне вполне достаточно, чтобы заметить вопросительную интонацию предложения (: rikzi_em: 2012-01-19 в 16:18 Спасибо за ответ. За знаки вопроса извините — дурная привычка :). В одной из статей вы написали будем всё делать через библиотеку SPL — с регистрами возится на данном этапе не резон Чем обосновывается ваш выбор работы с библиотекой периферии, а не напрямую через регистры?"
