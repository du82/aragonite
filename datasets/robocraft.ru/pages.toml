["https://robocraft.ru/blog/2911"]
title = "Генератор синусоиды на Arduino или ЦАП R-2R – RoboCraft"
description = "Генератор синусоиды на Arduino или ЦАП R-2R – RoboCraft"
full_description = "wowa: 2013-04-02 в 15:48 И всёже для преобразователя напряжения бы было лучше использовать синусоиду генерированую через ШИМ 🙂 Меньше потерь в транзисторах. Войдите, чтобы ответить Ghost_D: 2013-04-03 в 20:03 Возможно 😉 Но у меня была другая задача, а именно — «красивая синусоида». Как говорил Райкин: «К пуговицам претензии есть?». wowa: 2013-04-03 в 20:30 Есть 🙂 Для расчёта ненужна таблица полного колебания — достаточно четверти — потом можно увеличить дискретность. Из таблицы в 256 элементов потом генерить синус на 1024… Как то так… Mirmik: 2013-04-03 в 20:08 А чем плох ШИМ?.. Кроме того, таблица, это круто, конечно… Но чем не угодила стандартная библиотечная реализация функции синуса? Войдите, чтобы ответить wowa: 2013-04-03 в 20:27 Ну тут всё просто — таблица даёт результат за одинаково короткое время. Функция которая его высчитывает — будет работать с большим розбросом по времени. Я лично тоже пользуюсь таблицами. Mirmik: 2013-04-04 в 01:20 Для того, чтобы получать результат за одинаковое время на использовать таймеры. Таблица — это хорошо… Но это плохой стиль. Шаг влево, шаг вправо, чуть поменяли дискретизацию и таблицу надо пересчитывать. В таблице ничего плохого, конечно нет… Но, если использовать таблицу, то лучше бы контроллер высчитывал ее сам. Войдите, чтобы ответить"
author = "Ghost_D"
year_published = 2013
year_updated = 2022
