description = "Часто задаваемые вопросы * В чем принципиальное отличие Arduino от CraftDuino? Программирование * У меня слабые познания в С++, смогу ли я начать работать с CraftDuino, постепенно улучшая свои навыки в C++ или же требуется сразу высокий уровень? * Могу ли я работать с CraftDuino на C#/Basic/Delphi/PERL/Python ? Разное * Можно ли вставить вместо 168ой […]"
full_description = 'FAQ Часто задаваемые вопросы * В чем принципиальное отличие Arduino от CraftDuino? Программирование * У меня слабые познания в С++, смогу ли я начать работать с CraftDuino, постепенно улучшая свои навыки в C++ или же требуется сразу высокий уровень? * Могу ли я работать с CraftDuino на C#/Basic/Delphi/PERL/Python ? Разное * Можно ли вставить вместо 168ой 328ую атмегу и прошить в неё бутлоадер на этой же плате? * Выбирает ли плата CraftDuino автоматически, с какого коннектора брать питание - USB или внешнее? * Для подключения-отключения элементов нужно отключать питание (USB)? * Вы сами собирайте CraftDuino? * Делая ставку на Arduino, вы предполагаете, что многие коллективы будут пользоваться ею при разработке и делать на её базе устройства. А так ли это на самом деле? * Это плата для работы с сервоприводами или чем я захочу? * Как прошить в Arduino загрузчик(бутлоадер) если у меня нет совместимых с Arduino IDE программаторов? * LCD-экранчик WH1602M - как его подключать? * Как на Arduino Duemilanove отключить автоперезагрузку? * Хочу собрать Arduino сам, но нашлась только Atmega8-10PU - на 10МГц (Atmega8-8PU - на 8МГц и т.п.), не нашлось кварца на 16МГц * Подключил CraftDuino, установил драйвера Win7x32. Порт видится нормально. При попытке залить скетч - вываливается ошибка avrdude: stk500_getsync(): not in sync: resp=0x00 avrdude: stk500_disable(): protocol error, expect=0x14, resp=0x51 * Как можно собрать управляемого робота? * Нужен двигатель(серва) не могу выбрать - не понимаю что значит параметр момент(усилие) кг*см. * Возможно ли заказать у вас Arduino Uno? * Возможно ли управлять модулем ардуино, подавая команды не на его входы, а с компьютера по какому-либо интерфейсу (usb, ethernet)? * Как библиотеку openCV подключить к Arduino? * Как рассчитать какой резистор для какого светодиода мне необходим? * Есть задача из браузера передать данные по serial port через USB в ардуино. * Как подключить библиотеку к Arduino IDE? * Скажите, а возможно ли питать сервомашинку напрямую от Arduino? * При тестировании сервы, Arduino/CraftDuino при старте уходит в постоянную перезагрузку . Питаю от USB. Где ошибка? * Чем Arduino UNO отличается от CraftDuino? * Здесь нет ответа на мой вопрос :( Вопрос-ответ Q: В чем принципиальное отличие Arduino от CraftDuino? A: Все отличия перечислены в статье про CraftDuino. Q: Можно ли вставить вместо 168ой 328ую атмегу и прошить в неё бутлоадер на этой же плате? A: Да, возможно. Вы это сможете сделать самостоятельно, но для этого нужно будет использовать программатор (или BitBang). Q: Выбирает ли плата CraftDuino автоматически, с какого коннектора брать питание - USB или внешнее? A: Да выбирает, если джампер "11" стоит в положении AutoPWR(по стрелочке): Если в противоположном положении - то питание берётся только от внешнего источника. Q: Для подключения-отключения элементов нужно отключать питание (USB)? A: Да. Перед сборкой или внесением изменений в схему, электропитание стоит отключать. Q: Вы сами собирайте CraftDuino? A: Да. Q: У меня слабые познания в С++, смогу ли я начать работать с CraftDuino, постепенно улучшая свои навыки в C++ или же требуется сразу высокий уровень? A: Разумеется сможете! Ничего сложного там нет. Это просто вызов функций и методов классов, которые и составляют собой ядро ардуиновской библиотеки. Взгляните на простую программу, а вот здесь описано, как происходит обработка скетча ардуино в обычную программу на С++. В любом случае - если у Вас возникнут вопросы - обращайтесь! Q: Могу ли я работать с CraftDuino на C#/Basic/Delphi/PERL/Python ? A: Сама плата программируется на С++ Одно из перспективны направлений использования CraftDuino - как шлюза между ПК и внешним миром и тут уже плата через USB просто подключается к ПК и работа с ней ведётся, как с COM-портом: разумеется, можно и на С/С++/С#/PERL/Python Q: Делая ставку на Arduino, вы предполагаете, что многие коллективы будут пользоваться ею при разработке и делать на её базе устройства. А так ли это на самом деле? A: Не просто надеемся - именно так и есть. Arduino уже очень популярная и действительно очень удобная платформа для "малой автоматизации" и быстрого прототипирования (пока больше распространена на западе, но не без нашего скромного участия получает распространение и в России). В качестве целевой аудитории больше рассматриваются программисты, сис. администраторы. Т.е. технически достаточно грамотные пользователи. Однако, даже в России множатся примеры, когда Arduino пробуют использовать в школах. Q: Это плата для работы с сервоприводами или чем я захочу? A: это универсальный контроллер. Т.е. с помощью этой платы можно управлять и сервой и любым другим оборудованием. Например, устройствами 220. Q: Как прошить в Arduino загрузчик(бутлоадер) если у меня нет совместимых с Arduino IDE программаторов? A: Почитайте вот эти статьи /arduino/49 /arduino/50 например, свой программатор можно подружить с Arduino IDE. Но, фактически прошивка осуществляется через avrdude(А он поддерживает почти всё=). Бутлоадер можно залить и самостоятельно из-под произвольной программы-прошивальшика. Hex-ы бутлоадера идут в составе IDE (hardware\arduino\bootloaders\). Там же находятся Makefile-ы в которых можно увидеть какие фьюзы нужно выставлять. Q: LCD-экранчик WH1602M - как его подключать? A: На нашем сайте есть замечательная статья Q: Как на Arduino Duemilanove отключить автоперезагрузку? A: Чтобы её убрать - надо снять паяльно-дорожечный джампер RESET-EN - капля припоя( или тоооненькая дорожка между площадками) сразу за USB-разъёмом Q: Хочу собрать Arduino сам, но нашлась только Atmega8-10PU - на 10МГц (Atmega8-8PU - на 8МГц и т.п.), не нашлось кварца на 16МГц A: Ну например 10МГц-овая атмега гонится на 16МГц кварц(проверяли=) Но это недокументированная фича, так что, как и сколько оно будет работать покажет только жизнь=)) т.е. на свой страх и риск. Мы пробовали такой режим работы - всё хорошо работало. Но долго и тщательно работа в этом режиме не тестировалась. Либо просто собрать плату а-ля Ардуино, но с кварцем на 8МГц (10МГц и т.п. ) и программировать, как обычный МК на чистом С. Или поправить ИДЕ-шку (чтоб и такую плату понимала) и бутлоадер, почитать про такие модификации среды и бутлоадера можно тут. Q: Подключил CraftDuino, установил драйвера Win7x32. Порт видится нормально. При попытке залить скетч - вываливается ошибка avrdude: stk500_getsync(): not in sync: resp=0x00 avrdude: stk500_disable(): protocol error, expect=0x14, resp=0x51 Что я делаю не так? A: проверьте в каком положении джампер авторезет. А так же - какую плату выбрали в настройках ( должна быть на ATmega328 ) Q: Как можно собрать управляемого робота? A: Например, можно сделать простого 3-х-колёсного робота с дистанционным управлением с ПК. Камеру поставить Wi-Fi и обработку видео делать на том же ПК. итого: 1. тележка (самодельное шасси или старая игрушка) 2. два мотор-редуктора 3. контроллер (можно взять самый простой типа Arduino/CraftDuino) 4. драйвер двигателей (в простом случае - на L293D) 5. аккумуляторы :) 6. радиомодуль (ZBee, Wi-Fi, ...) 7. камера (Wi-Fi, а можно использовать обычную web-камеру через Wi-Fi-роутер) 8. ПК Q: Нужен двигатель(серва) не могу выбрать - не понимаю что значит параметр момент(усилие) кг*см. A: внимательно прочитайте конец статьи про сервомашики - там и поясняющая картинка есть. Скажем нужно открывать кран. Чтобы определиться с выбором - нужно определить момент, требуемый для поворота крана. Это можно сделать с помощью линейки и безмена (на кухне :)). Крепим безмен к крану и тянем. Запоминаем показания при которых кран пошёл открываться. Теперь замеряем расстояние от оси вращения до места крепления безмена. Момент вычисляется простым перемножением(килограммов на сантиметры). Q: Возможно ли заказать у вас Arduino Uno? A: Возможно, однако, почему вы хотите использовать именно UNO? Обычного контроллера Arduino прошлых версий более чем хватает для большинства задач. Q: Возможно ли управлять модулем ардуино, подавая команды не на его входы, а с компьютера по какому-либо интерфейсу (usb, ethernet)? A: Можно. посмотрите в сторону протокола Firmata в примерах есть скетч StandardFirmata, который превращает Arduin-у в плату ввода-вывода. примеры использования Q: Как библиотеку openCV подключить к Arduino? A: OpenCV на ардуино работать не может. Q: Как рассчитать какой резистор для какого светодиода мне необходим? A: По закону Ома. Калькулятор для расчёта можно найти в интернете. Q: Как подключить библиотеку к Arduino IDE? A: 1. распаковать архив библиотеки 2. поместить директорию библиотеки в библиотечную директорию Arduino IDE (\hardware\libraries\) или создать в папке своих скетчей такую же библиотеку libraries и поместить её туда 3. перезапустить IDE см. Программирование Arduino - создание своей библиотеки. Практическое программирование Arduino/CraftDuino - подключаем мышку PS/2 Q: Скажите, а возможно ли питать сервомашинку напрямую от Arduino? A: Да, если хватит мощности источника питания и стабилизатора на плате (0,8А) Если мощности питания не хватит плата будет перезагружается - мигать светодиодом "L" и пытаться выполнять программу сначала. Но лучше запитать серву от отдельного источника помощней (+5В на красный провод сервы, минусы источников соединить) Q: При тестировании сервы, Arduino/CraftDuino при старте уходит в постоянную перезагрузку. Питаю от USB. Где ошибка? A: ошибки нет - действительно просто не хватает мощности источника питания (USB) Попробуйте на другом компе, от блока питания, от батарейки Серва дёргается — возрастает потребление тока, напряжение просаживается — МК перезагружается и т.д. Можно попробовать поставить электролит на питание сервы но это вряд ли что-то даст. Q: Чем Arduino UNO отличается от CraftDuino? A: Arduino UNO, отличается от Arduino Duemilanove или CraftDuino только реализацией конвертора USB-Serial. Там, вместо FT232 (собственно непосредственно хардварного преобразователя USB-Serial) стоит Atmega8U2 в неё залита прошивка такого конвертора, но её (прошивку) можно сменить. Это нужно для создания устройств использующих иные способы коммуникации с компьютером, нежели виртуальный ком-порт - миди клавиатуры, мыши и т.д. А вот что именно "т.д.", мне лично, до сих пор не вполне ясно. И чего-то пока не видно интересных (да и не интересных то же) проектов использующих эту фичу. Естественно, если вам нужна плата именно под проект миди-клавиатуры, мыши или чего-нибудь в этом духе то конечно - тут только Arduino UNO. И если вы собираетесь писать программу обмена с компом (прошивку для того самого нового преобразователя на Atmega8U2) самостоятельно или использовать для этого дела исходники значительных обьёмов, то тут выбор Arduino UNO R3 безусловно оправдан - там вместо 8U2 стоит более жирная Atmega16U2 (у неё памяти в 2-а раза больше). В противном случае, будет иметь место переплата за то, что вам не нужно. Так же, там вроде еще добавлено вот это: Обновлено назначение разъемов платы до версии 1.0: добавлены два вывода - SDA и SCL для интерфейса TWI рядом с выводом AREF . Еще два новых вывода появились рядом с выводом RESET:IOREF для согласования шилдов с напряжением питания процессорной платы и один резервный пин, который пока не задействован. Улучшена стабильность цепей сброса микроконтроллера. Да добавили, но они дублирующие ( SDA и SCL и так сидят на 4 и 5 аналоговых входах ) и функционал не расширяют Резервный пин болтается в воздухе - никуда не подключен. А IOREF на глухо соединенно с 5Вольтами. Под IOREF пока нету ни шилдов ни плат. Это на туманное будущее. ИМХО на это дело пока крайне рано смотреть. Появление таких шилдов, думаю, стоит ожидать в течении полугода в лучшем случае, а их мало-мальски широкое распространение и того дольше (пару лет) Вытеснение "старых" шилдов вообще не ожидаю, чего-то принципиально нового эти решения не дают - новые перспективы для создания новых шилдов не открываются. Q: Здесь нет ответа на мой вопрос :( A: Вы можете задать вопрос через форму обратной связи.'
