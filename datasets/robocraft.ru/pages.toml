["https://robocraft.ru/arduino/14"]
title = "Arduino – RoboCraft"
description = "Arduino – RoboCraft"
full_description = "sol13: 2010-03-23 в 23:53 вот назрел вопрос: atmega можно заменить на данной плате? Войдите, чтобы ответить noonv: 2010-03-24 в 10:18 заменить на другую atmeg-у (8/168/328)- без проблем — нужно только будет прошить новый контроллер ардуиновским загрузчиком. sol13: 2010-03-24 в 14:04 я имею ввиду замена одного микроконтроллера 328 на другой 328, то есть демонтаж его. но получается, что можно. Войдите, чтобы ответить oleg_kishko: 2010-10-21 в 00:52 Ребята! Никто не пробовал собрать на ATMega16, не могу найти бутлоадер. Войдите, чтобы ответить Zoltberg: 2010-10-23 в 00:47 Мы не пробовали.=) Но в принципе это возможно, правда не только бутлоадер другой нужен, придётся ИДЕ править также. посмотрите здесь и тут, ну и поиск по офф сайту тоже вам в помощь progessman: 2013-09-08 в 15:17 Получается Arduino это обыкновенный контроллер, который имеет несколько наворотов, а именно: встроенный программатор, удобные выводы, много доступных и понятных мануалов в сети… я ничего не упустил? С тем же успехом реально заменить его любым микропроцессором, так? Войдите, чтобы ответить Zoltberg: 2013-09-08 в 16:19 упустили=) 0. То что имеет ардуина для контроллеров наворотами назвать сложно=) 1. Огромное количество библиотек и примеров кода (это != мануалы) 2. Куча плат расширения никаким микропроцессором контроллер не замиенить, вы понятия путаете, это совершенно разные вещи — почитайте(там в начале) или тут — больше подробностей. Ардуину непосредственно покупать/делать не обязательно — вместо неё можно воткнуть полуголый микроконтроллер Atmega8/168/328/1280/2560 и использовать все програмные (ну и схемотехнические) наработки, да. Ничего волшебного и панацейного в ардуине нет. Да это просто о плата с минимальным обвязом для МК, но работает из коробки и имеет могучее сообщество. Всё что на ней сделано, можно сделать(и часто лучше/дешевле/красивей) на базе других МК, да."
