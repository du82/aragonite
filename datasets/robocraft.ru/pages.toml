title = "О сайте – RoboCraft"
description = "РобоКрафт. Роботы? Это просто! Реализуем проекты в областях: образовательной, исследовательской и персональной робототехники. RoboCraft.ru - это сообщество любителей робототехники, электроники и программирования, на котором можно: почитать новости робототехники;ознакомиться с различными технологиями и примерами их использования;опубликовать свои заметки, идеи и наработки.Цели проектаделать роботов :)делиться своими идеями и наработками друг с другом,найти единомышленников,сделать будущее ближе!ПравилаНаш проект не […]"
full_description = "О сайте РобоКрафт. Роботы? Это просто! Реализуем проекты в областях: образовательной, исследовательской и персональной робототехники. RoboCraft.ru - это сообщество любителей робототехники, электроники и программирования, на котором можно: почитать новости робототехники;ознакомиться с различными технологиями и примерами их использования;опубликовать свои заметки, идеи и наработки.Цели проектаделать роботов :)делиться своими идеями и наработками друг с другом,найти единомышленников,сделать будущее ближе!ПравилаНаш проект не является обычной блоговой платформой, и персональные блоги — это не синоним ЖЖ. RoboCraft.ru — это не livejournal.com, blogger.com и другие блого-площадки. RoboCraft.ru - это модерируемый тематический ресурс.Каждый топик — это какая-то полезная для сообщества мысль, описание проекта и т.п. На ресурсе не приветствуется: размещение бессмысленных публикаций и комментариев (спам, флуд и т.п.);публикация рекламы продукции и услуг (особенно далеких от тематики проекта);любой публичный вид ругани (особенно с использованием нецензурной лексики);конфликтный стиль общения.Условия перепечатки материалов с сайтаМатериалы сайта являются авторскими. Копирование и публикация материалов без разрешения автора запрещены! По всем вопросам пишите — admin[AT]robocraft.ru Мы в социальных сетяхGithubВКонтактеFacebookTwitterКак присоединиться к команде RoboCraftПрисоединиться к команде RoboCraft очень просто! Для этого нужно только: желание, адекватность и время. Если у Вас есть желание: изучать новое,сделать этот мир лучше/проще/безопаснее,конструировать роботов, электронные модули и т.п.изучать робототехнику/электронику/программирование и сопутствующие материалы (ИИ, машинное обучение, компьютерное зрение и т.п.),делиться своими знаниями и наработками. Если Вы адекватны и правильно принимаете советы и критику сообщеста, и, при этом, у Вас есть время на то чтобы: делать роботов,рассказывать об этом,активно участвовать в жизни сообщества RoboCraft.ruпомогать развивать проекты сообщества. То тогда - Добро пожаловать в команду RoboCraft! Зарегистрируйтесь в сообществе и присоединяйтесь к нам!"
