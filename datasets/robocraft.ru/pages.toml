["https://robocraft.ru/computervision/275"]
title = "7. OpenCV шаг за шагом. Захват видео с камеры – RoboCraft"
description = "7. OpenCV шаг за шагом. Захват видео с камеры – RoboCraft"
full_description = "Upryamyj: 2011-01-07 в 18:23 Скопировал пример один к одному. Все скомпилировалось, программа запускается, но выдает разрешение 0*0 и серый квадрат. Камера в других приложения (проводник, VLC) нормально работает. В чем может быть дело? Войдите, чтобы ответить noonv: 2011-01-10 в 20:43 версия OpenCV? какая камера? пробовали изменить разрешение/ не изменять разрешения (оставить дефолтным)? Upryamyj: 2011-01-10 в 21:21 OpenCV 2.2.0, ОС Windows, VC++ 2005 Express Edition. Библиотеки скомпилировались без ошибок, сделал все уроки со 2-го по 23-й, все работает, кроме захвата с камеры. Камера в китайском телефоне, подключается телефон по USB, работает во всех приложениях без драйверов. Пробовал не указывать разрешение, 320*240, 540*480. Результат — серый квадрат, а в консоли информация о разрешении 0*0. noonv: 2011-01-14 в 10:49 похоже проблема именно в доступе к камере — попробуйте использовать библиотеку videoInput CaptNemo: 2015-05-03 в 11:03 Была та же проблема. Помогает videoInput. И еще у меня заработало после включения программы WebcamMax. Кто-нибудь знает как работает эта программа? passick: 2011-01-10 в 20:20 Тоже самое, что и у «Upryamyj»-серый квадрат и разрешение 0*0. Что делать? Может, проблемы с камерой? Войдите, чтобы ответить"
