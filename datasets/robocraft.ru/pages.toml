title = "OpenCV – RoboCraft"
description = "OpenCV – (Open Computer Vision) — библиотека компьютерного зрения с открытым исходным кодом, предоставляющая набор типов данных и численных алгоритмов для обработки изображений алгоритмами компьютерного зрения. Реализована на C/C++. OpenCV шаг за шагом. 1. Введение. 2. Установка. (установка OpenCV под OC Linux, установка 2.3.1 ) 3. Hello World. 4. Загрузка картинки. 5. Вывод видео 6. […]"
full_description = "OpenCV OpenCV – (Open Computer Vision) — библиотека компьютерного зрения с открытым исходным кодом, предоставляющая набор типов данных и численных алгоритмов для обработки изображений алгоритмами компьютерного зрения. Реализована на C/C++. OpenCV шаг за шагом. 1. Введение. 2. Установка. (установка OpenCV под OC Linux, установка 2.3.1 ) 3. Hello World. 4. Загрузка картинки. 5. Вывод видео 6. Ползунок 7. Захват видео с камеры 8. Запись видео 9. События от мышки 10. Обработка изображения - сглаживание 11. Обработка изображения - изменение размеров 12. ROI - интересующая область изображения 13. Типы данных OpenCV 14. Матрица 15. Сохранение данных в XML 16. Генерация случайных чисел 17. Обработка изображения - морфологические преобразования 18. Обработка изображения - морфологические преобразования 2 19. Обработка изображения - заливка части изображения 20. Обработка изображения - альфа-смешивание 21. Обработка изображения - пороговое преобразование 22. Поиск объекта по цвету - RGB. 23. Поиск объекта по цвету. Цветовое пространство HSV. 24. Работа с камерой через библиотеку videoInput. 25. Обработка изображения - свёртка. 26. Обработка изображения — операторы Собеля и Лапласа 27. Обработка изображения — детектор границ Кенни (Canny) 28. Преобразование Хафа 29. Интегральное изображение 30. Трансформация изображения - аффинные преобразования, гомография 31. Типы данных OpenCV - хранилище памяти, последовательность 32. Нахождение контуров и операции с ними 33. Сравнение контуров через суммарные характеристики - моменты Детектирование объектов - поиск объекта по шаблону (Template matching) Методы OpenCV Алгоритм кластеризации k-means Вопросы OpenCV Пороговое преобразование над цветной картинкой Как сжать IplImage в jpeg без промежуточного сохранения в файл? как заставить мою программу с OpenCV работать на другом компьютере? Использование OpenCV под C# Разное Сравнение изображений и генерация картинки отличий Сравнение изображений через хэш Раскрашиваем картинку в градациях серого Голографическое кодирование картинки OpenCV - определение доминирующих цветов на изображении OpenCV benchmark Kinect - начало работы - настройка OpenCV OpenCV и работа с видео Автор: Vladimir (noonv), 2010-2011 Эксклюзивно для robocraft.ru копирование на другие ресурсы и публикация без разрешения автора запрещены. Ссылки http://opencv.org http://sourceforge.net/projects/opencvlibrary/ http://tech.dir.groups.yahoo.com/group/OpenCV/"
