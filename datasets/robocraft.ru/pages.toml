["https://robocraft.ru/arduino/18"]
title = "Ардуино что это и зачем? – RoboCraft"
description = "Ардуино что это и зачем? – RoboCraft"
full_description = "Graf34: 2009-09-06 в 01:15 Уважаемый Zoltberg! задумал я одну примочку в машину сделать с применением контроллера, но не хватает подхвата теории. нуждаюсь в помощи! если есть свободная минутка напишите в аську 397-260-167 или на http://www.art833@yandex.ru Войдите, чтобы ответить Alek: 2010-09-02 в 19:41 Хочу сделать приблуду чтобы она следила за температурой и в зависимости от неё регулировала напругу на куллере. Возможно ли такое сделать на Ардуино(Х-дуино)? п.с. а то насколько я понял ардуино позволяет только от 0 до 5В баловаться, а куллер от 7 стартует, да иногда требуеться включить на полную. Какой Х-друино мне подойдет? Войдите, чтобы ответить Zoltberg: 2010-09-02 в 19:54 Никакой=) Одной дуиной тут не обойтись, придётся ставить транзистор, тогда сможете запитать свой куллер хоть от 25вольт. Alek: 2010-09-03 в 11:50 оперативненько! Если я правильно понимаю к PWM паяю транзистор и вуаля? и все же какую модель лучше взять? надо пасти 3 температурных датчика и питать 3 куллера Zoltberg: 2010-09-04 в 22:58 Правильно, главно транзистор правильно подпаять;) Модель, любую — и аппаратных и вычислительных возможностей хватит за глаза. Такое приминение дуины очень избыточно, яб добавил функций. Хотяб экранчик прицепить для индикации этихже темпиратур, или, напимер, такую штуку тудаже приделать."
