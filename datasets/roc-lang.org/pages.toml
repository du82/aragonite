["https://roc-lang.org/tutorial"]
title = "Tutorial | Roc"
description = "Learn the Roc programming language."
full_description = '''close REPL Building an Application Pattern Matching Types Crashing Testing Modules Advanced Concepts Tutorialcontents Welcome to Roc! This tutorial will teach you how to build Roc applications. Along the way, you'll learn how to write tests, use the REPL, and more! Installation Roc doesn’t have a numbered release or an installer yet, but you can follow the install instructions for your OS here . If you get stuck, friendly people will be happy to help if you open a topic in #beginners on Roc Zulip Chat and ask for assistance! LLM Docs We have experimental LLM-friendly text files for our tutorial and standard library that you can use to prompt your favorite LLM to answer your questions about Roc! REPL Let's start by getting acquainted with Roc's Read-Eval-Print-Loop, or REPL for short. You can use the online REPL at roc-lang.org/repl. Or you can run this in a terminal: roc repl, and if Roc is installed, you should see this: The rockin’ roc repl ──────────────────────── Enter an expression, or :help, or :q to quit. So far, so good! Hello, World! Try typing this in the REPL and pressing Enter: "Hello, World!" The REPL should cheerfully display the following: "Hello, World!" : Str Congratulations! You've just written your first Roc code. Naming Things When you entered the expression "Hello, World!", the REPL printed it back out. It also printed : Str, because Str is that expression's type. We'll talk about types later; for now, let's ignore the : and whatever comes after it whenever we see them. You can assign specific names to expressions. Try entering these lines: greeting = "Hi" audience = "World" From now until you exit the REPL, you can refer to either greeting or audience by those names! We'll use these later on in the tutorial. Arithmetic Now let's try using an operator, specifically the + operator. Enter this: 1 + 1 You should see this output: 2 : Num * According to the REPL, one plus one equals two. Sounds right! Roc will respect order of operations when using multiple arithmetic operators like + and -, but you can use parentheses to specify exactly how they should be grouped. 1 + 2 * (3 - 4) -1 : Num * Calling Functions Let's try calling a function: Str.concat("Hi ", "there.") "Hi there." : Str Here we're calling the Str.concat function and passing two arguments: the string "Hi " and the string "there.". This concatenates the two strings together (that is, it puts one after the other) and returns the resulting combined string of "Hi there.". The Str.concat function has a dot in its name. In Str.concat, Str is the name of a module, and concat is the name of a function inside that module. We'll get into more depth about modules later, but for now you can think of a module as a named collection of functions. Eventually we'll discuss how to use them for more than that. String Interpolation An alternative syntax for Str.concat is string interpolation, which looks like this: "${greeting} there, ${audience}." This is syntax sugar for calling Str.concat several times, like so: Str.concat(greeting, Str.concat(" there, ", Str.concat(audience, "."))) You can put entire single-line expressions inside the parentheses in string interpolation. For example: "Two plus three is: ${Num.to_str(2 + 3)}" By the way, there are many other ways to put strings together! Check out the documentation for the Str module for more. Building an Application Let's move out of the REPL and create our first Roc application! Make a file named main.roc and put this in it: app [main!] { pf: platform "https://github.com/roc-lang/basic-cli/releases/download/0.19.0/Hj-J_zxz7V9YurCSTFcFdu6cQJie4guzsPMUi5kBYUk.tar.br" } import pf.Stdout main! = |_args| Stdout.line!("Hi there, from inside a Roc app. 🎉") Try running this with: roc main.roc You should see a message about a file being downloaded, followed by this: Hi there, from inside a Roc app. 🎉 Congratulations, you've written your first Roc application! We'll go over what the parts above main do later, but let's play around a bit first. Defs Try replacing the main line with this: birds = 3 iguanas = 2 total = Num.to_str(birds + iguanas) main! = |_args| Stdout.line!("There are ${total} animals.") Now run roc main.roc again. This time the "Downloading ..." message won't appear; the file has been cached from last time, and won't need to be downloaded again. You should see this: There are 5 animals. main.roc now has four definitions (defs for short) birds, iguanas, total, and main!. A definition names an expression. The first two defs assign the names birds and iguanas to the expressions 3 and 2. The next def assigns the name total to the expression Num.to_str(birds + iguanas). Once we have a def, we can use its name in other expressions. For example, the total expression refers to birds and iguanas, and Stdout.line!("There are ${total} animals.") refers to total. You can name a def using any combination of letters and numbers, but they have to start with a lowercase letter. Note: Defs are constant; they can't be reassigned. We'd get an error if we wrote these two defs in the same scope: birds = 3 birds = 2 Defining Functions So far we've called functions like Num.to_str, Str.concat, and Stdout.line. Next let's try defining a function of our own. birds = 3 iguanas = 2 total = add_and_stringify(birds, iguanas) main! = |_args| Stdout.line!("There are ${total} animals.") add_and_stringify = |num1, num2| Num.to_str(num1 + num2) This new add_and_stringify function we've defined accepts two numbers, adds them, calls Num.to_str on the result, and returns that. The |num1, num2| syntax defines a function's arguments, and the expression after the final | is the body of the function. Whenever a function gets called, its body expression gets evaluated and returned. if-then-else expressions Let's modify this function to return an empty string if the numbers add to zero. add_and_stringify = |num1, num2| sum = num1 + num2 if sum == 0 then "" else Num.to_str(sum) We did two things here: We introduced a local def named sum, and set it equal to num1 + num2. Because we defined sum inside add_and_stringify, it's local to that scope and can't be accessed outside that function. We added an if-then-else conditional to return either "" or Num.to_str(sum) depending on whether sum == 0. Every if must be accompanied by both then and also else. Having an if without an else is an error, because if is an expression, and all expressions must evaluate to a value. If there were ever an if without an else, that would be an expression that might not evaluate to a value! else if expressions We can combine if and else to get else if, like so: add_and_stringify = |num1, num2| sum = num1 + num2 if sum == 0 then "" else if sum < 0 then "negative" else Num.to_str(sum) Note that else if is not a separate language keyword! It's just an if/else where the else branch contains another if/else. This is easier to see with different indentation: add_and_stringify = |num1, num2| sum = num1 + num2 if sum == 0 then "" else if sum < 0 then "negative" else Num.to_str(sum) This differently-indented version is equivalent to writing else if sum < 0 then on the same line, although the convention is to use the original version's style. Comments This is a comment in Roc: # The 'name' field is unused by add_and_stringify Whenever you write # it means that the rest of the line is a comment, and will not affect the running program. Roc does not have multiline comment syntax. Doc Comments Comments that begin with ## are "doc comments" which will be included in generated documentation (roc docs). They can include code blocks by adding five spaces after ##. ## This is a comment for documentation, and includes a code block. ## ## x = 2 ## expect x == 2 Like other comments, doc comments do not affect the running program. Records Currently our add_and_stringify function takes two arguments. We can instead make it take one argument like so: total = add_and_stringify({ birds: 5, iguanas: 7 }) add_and_stringify = |counts| Num.to_str(counts.birds + counts.iguanas) The function now takes a record, which is a group of named values. Records are not objects; they don't have methods or inheritance, they just store information. The expression { birds: 5, iguanas: 7 } defines a record with two fields (the birds field and the iguanas field) and then assigns the number 5 to the birds field and the number 7 to the iguanas field. Order doesn't matter with record fields; we could have also specified iguanas first and birds second, and Roc would consider it the exact same record. When we write counts.birds, it accesses the birds field of the counts record, and when we write counts.iguanas it accesses the iguanas field. When we use == on records, it compares all the fields in both records with ==, and only considers the two records equal if all of their fields are equal. If one record has more fields than the other, or if the types associated with a given field are different between one field and the other, the Roc compiler will give an error at build time. Note: Some other languages have a concept of "identity equality" that's separate from the "structural equality" we just described. Roc does not have a concept of identity equality; this is the only way equality works! Accepting extra fields The add_and_stringify function will accept any record with at least the fields birds and iguanas, but it will also accept records with more fields. For example: total = add_and_stringify({ birds: 5, iguanas: 7 }) # The `note` field is unused by add_and_stringify total_with_note = add_and_stringify({ birds: 4, iguanas: 3, note: "Whee!" }) add_and_stringify = |counts| Num.to_str(counts.birds + counts.iguanas) This works because add_and_stringify only uses counts.birds and counts.iguanas. If we were to use counts.note inside add_and_stringify, then we would get an error because total is calling add_and_stringify passing a record that doesn't have a note field. Record shorthands Roc has a couple of shorthands you can use to express some record-related operations more concisely. Instead of writing |record| record.x we can write .x and it will evaluate to the same thing: a function that takes a record and returns its x field. You can do this with any field you want. For example: # return_foo is a function that takes a record # and returns the `foo` field of that record. return_foo = .foo return_foo({ foo: "hi!", bar: "blah" }) # returns "hi!" Sometimes we assign a def to a field that happens to have the same name—for example, { x: x }. In these cases, we shorten it to writing the name of the def alone—for example, { x }. We can do this with as many fields as we like; here are several different ways to define the same record: { x: x, y: y } { x, y } { x: x, y } { x, y: y } Record destructuring We can use destructuring to avoid naming a record in a function argument, instead giving names to its individual fields: add_and_stringify = |{ birds, iguanas }| Num.to_str(birds + iguanas) Here, we've destructured the record to create a birds def that's assigned to its birds field, and an iguanas def that's assigned to its iguanas field. We can customize this if we like: add_and_stringify = |{ birds, iguanas: lizards }| Num.to_str(birds + lizards) In this version, we created a lizards def that's assigned to the record's iguanas field. (We could also do something similar with the birds field if we like.) Finally, destructuring can be used in defs too: { x, y } = { x: 5, y: 10 } Making records from other records So far we've only constructed records from scratch, by specifying all of their fields. We can also construct new records by using another record to use as a starting point, and then specifying only the fields we want to be different. For example, here are two ways to get the same record: original = { birds: 5, zebras: 2, iguanas: 7, goats: 1 } from_scratch = { birds: 4, zebras: 2, iguanas: 3, goats: 1 } from_original = { original & birds: 4, iguanas: 3 } The from_scratch and from_original records are equal, although they're defined in different ways. from_scratch was built using the same record syntax we've been using up to this point. from_original created a new record using the contents of original as defaults for fields that it didn't specify after the &. Note that & can't introduce new fields to a record, or change the types of existing fields. (Trying to do either of these will result in an error at build time!) Debugging with dbg Print debugging is the most common debugging technique in the history of programming, and Roc has a dbg keyword to facilitate it. Here's an example of how to use dbg: pluralize = |singular, plural, count| dbg count if count == 1 then singular else plural Whenever this dbg line of code is reached, the value of count will be printed to stderr, along with the source code file and line number where the dbg itself was written: [pluralize.roc 6:8] 5 Here, [pluralize.roc 6:8] tells us that this dbg was written in the file pluralize.roc on line 6, column 8. You can give dbg any expression you like, for example: dbg Str.concat(singular, plural) You can also use dbg as a function inside an expression, which will print the function argument to stderr and then return the argument to the caller. For example: inc = |n| 1 + dbg n Tuples One way to have dbg print multiple values at a time is to wrap them in a record: dbg { text: "the value of count is:", value: count } A more concise way would be to wrap them in a tuple, like so: dbg ("the value of count is:", count) Visually, tuples in Roc look like lists (but with parentheses instead of square brackets). However, a tuple is much more like a record - in fact, tuples and records compile down to the exact same representation at runtime! So anywhere you would use a tuple, you can use a record instead, and the in-memory representation will be exactly the same. Like records, tuples are fixed-length and can't be iterated over. Also, they can contain values of different types. The difference is that in a record, each field is labeled (and their position doesn't matter), whereas in a tuple, each field is specified by its position. Accessing values in tuples Just like how there are two ways to access a record's fields (namely, the . operator and record destructuring), there are also two similar ways to access tuple fields: # tuple field access tuple = ("hello", 42, ["list"]) first = tuple.0 # "hello" second = tuple.1 # 42 third = tuple.2 # ["list"]# tuple destructuring (first, second, third) = ("hello", 42, ["list"]) Pronouncing Tuple By the way, there are two common ways to pronounce "tuple"—one sounds like "two-pull" and the other rhymes with "supple"—and although no clear consensus has emerged in the programming world, people seem generally accepting when others pronounce it differently than they do. Pattern Matching Sometimes we want to represent that something can have one of several values. For example: stoplight_color = if something > 0 then Red '''
year_published = 2025
clearnet = "https://roc-lang.org/tutorial"
