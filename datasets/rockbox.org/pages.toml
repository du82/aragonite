["https://www.rockbox.org/mail"]
title = "Rockbox mail"
full_description = "Our mailing lists have several hundred subscribers each and we want order and proper netiquette to be followed for things to run smooth. Please read this before you decide to post to any of our lists. This is the big users and discussion list. It has many subscribers and quite intense traffic at times. The list is only open for subscribers. You can not send mail to this list without being subscribed to it! This list is also archived as a newgroup on Gmane. Connect your news reader to news.gmane.io and look for the group gmane.comp.systems.archos.rockbox.general. Note that you still need to be subscribed to the list to post to it through gmane! This is the developers list. We talk source code, bugs, internal design, commit reviews, porting issues and how to write efficient code. The list is only open for subscribers. You can not send mail to this list without being subscribed to it! This list is also archived as a newgroup on Gmane. Connect your news reader to news.gmane.io and look for the group gmane.comp.systems.archos.rockbox.devel. Note that you still need to be subscribed to the list to post to it through Gmane! This list monitors the Git commits and recieves one mail for each commit. It is read-only and unarchived. This list monitors the Flyspray bug reports and feature requests and receives one mail for new and modified entries. It is read-only and unarchived."
