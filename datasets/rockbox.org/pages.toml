["https://rockbox.org/devcon"]
title = "Rockbox - Rockbox Developer Conference 2002"
full_description = '''Well, almost. :-) Bj�rn, Linus, Daniel and Kjell sat down at Linus' house friday night (2002-04-19) with our Archoses and had a long and fruitful discussion about software design. Here are a few things that we discussed: We want to try to stick to POSIX where these exist and are practical. The reason is simply that many people already know these APIs well. Here are a few which haven't already been defined in the code: We also decided that we will use the 'newlib' standard C library, replacing some functions with smaller variants as we move forward. We spent much time discussing and debating task scheduling, or the lack thereof. First, we went with the idea that we don't really need "real" scheduling. Instead, a simple "tree-task" system would be used: A main-loop, a timer tick and a "bottom half" low-priority interrupt, each with an event queue. At the same time, we agreed that we should not walk into the common trap of engaging in "job splitting". That is, to split up jobs in small chunks so they don't take so long to finish. The problem with job splitting is that it makes the code flow very complex. After much scratching our collective heads over how to make a primitive "three-task" system be able to do everything we wanted without resorting to complex job splitting, we finally came to the conclusion that we were heading down the wrong road: Even though a scheduler adds complexity, it makes the rest of the code so much more straight-forward that the total net result is less overall complexity. To keep it simple, we decided to use a cooperative scheduler. That is, one in which the threads themselves decide when scheduling is performed. The big gain from this, apart from making the scheduler itself less complex, is that we don't have to worry as much about making all code "multithread safe". In addition to the threads, we need a timer interrupt with the ability to send messages to threads at specific intervals. This will also be used to scan the keys of the jukebox and handle key repeat detection (when a key has been pressed for a number of ticks).'''
author = "Rockbox Contributors"
year_published = 2025
