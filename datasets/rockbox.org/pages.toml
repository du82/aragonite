["https://rockbox.org/history.html"]
title = "Rockbox - History"
full_description = '''2023-10-14: Due to the ...erratic new management of twitter, use of the @rockboxcommits handle has been discontinued. 2020-05-27: gerrit and git moved to new hosts. Github integration fixed, and https enabled for gerrit. 2011-04-03: Rockbox participates in the Google Summer of Code 2011 and we welcome students to apply for doing projects for and with us! 2010-02-15: Rockbox will be applying for Google Summer of Code 2010. Please suggest possible projects or ask to be a mentor or student on our IRC channel. 2009-03-18: Rockbox has been accepted as a mentor organization for Google Summer of Code 2009. Look here for project ideas. 2007-11-23: New USB stack with limited capability. Currently it only requests full charging power. Ignore driver popups from Windows. 2007-05-06: Scheduled server maintenance. build.rockbox.org and download.rockbox.org will be down approximately 00:00 to 10:00 CET. 2007-03-29: Announcing the 2007-03-15: Rockbox has been accepted as a mentor organization of Google's summer of code 2007 2006-12-25: The recent instabilities might be cured now as we run only single-CPU on the server now. Removed CVS builds from this server to reduce some load. 2006-12-14: Michiel van der Kolk, sometimes known as HCl, is dead. He passed away yesterday. He will be missed and remembered as maestro of Rockboy and his eager work on the initial tag database amongst other things. more... 2006-07-07: Site is back up again after a few days downtime due to yet another break-in/attack. The twiki parts are still disabled and will be brought back once we believe we have them "secured" properly. 2006-02-23: We have migrated to a new bugtracker: Flyspray. It's faster and better in practically every aspect. See it here. 2005-09-21: The Wiki pages are now restored as much as possible with the exception of the WPS Gallery. The Wiki has been upgraded and the hole is plugged. Backups are done manually currently - work is underway to fix the automatic system that failed us. 2005-09-19: An oldish backup restored, work in progress on getting pages more up-to-date. Mailing lists are up again, but check that you are still subscribed!'''
