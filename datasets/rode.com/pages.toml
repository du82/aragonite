["https://rode.com/about/news-info/rodecaster-pro-ii-and-duo-can-now-connect-rode-wireless-mics-via-usb"]
title = "RØDECaster Pro II and Duo can now Connect RØDE Wireless Mics via USB | RØDE"
description = "The latest 1.5.0 firmware update allows Series IV wireless microphone receivers to connect to the RØDECaster’s USB 2 input, expanding your connectivity options even further."
full_description = "RØDECaster Pro II and Duo can now Connect RØDE Wireless Mics via USB We’re constantly working to improve our products so they can continue performing at their peak and keep you creating. Now, thanks to a firmware update for the RØDECaster Pro II and RØDECaster Duo, we’ve made these extremely flexible devices even moreso. With this latest update (1.5.0), you can now connect your RØDE Series IV wireless receiver to your RØDECaster via USB 2 (much like you would a RØDE USB microphone). This opens up a few new configuration possibilities, including the ability to use up to four wireless microphones at once, or to simply free up a combo input when using a wireless microphone. Alongside this, we have made a number of optimisations and improvements to the RØDECaster's APHEX audio processing to reduce overall latency. As always, we appreciate all the feedback you give us, so keep it coming, and we hope you enjoy the new update."
