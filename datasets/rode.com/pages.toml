n to increase FPY and reduce the costs to produce. Programming Yamaha Pick & Place machine highly regarded. Programming and process variation activities on SPI, AOI, Stencil Printer and Reflow Oven is essential Experience maintaining and creating work instructions, control plans, process flowcharts, and process failure modes effects analysis documents. Ability to interpret engineering documentation including drawings, BOMs, change orders. SMT Electronics design experience highly regarded. Ability to present process improvements to all levels of the Business. Please note, you will be requested through the interview process to demonstrate the above requirements. Our campus is designed to create an atmosphere which reflects our love of cutting-edge technology, collaboration, and our deep connection to music, film and all things audio. Our production facilities are cutting-edge and are constantly expanding as we increase our capability with new manufacturing technologies and processes. RØDE's investment in our in-house capability is aggressive, unmatched in the industry. Our plant boasts the finest technologies in metal engineerinf and production, Surface-Mount Technology electronics production, military grade finishing, plastic-injection mould manufacture, and a brand-new, best-practice toolmaking facility. If you are interested in pursuing a unique opportunity to work with one of the most exciting, forward-thinking companies in Australia, inspiring millions of people around the world to realise their creative vision, apply today. We want you! RØDE values diversity in the workplace and encourages applications from people of all genders, ages and backgrounds."
