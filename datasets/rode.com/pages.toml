description = "The RØDECaster Pro II joins the rest of the RØDE White Collection, including the PodMic, Wireless ME, PSA1+, NTH-100 and RØDECaster Duo."
full_description = "Introducing the RØDECaster Pro II in White We are excited to introduce a new white edition of the RØDECaster Pro II, the world’s most powerful audio production console for creators. It joins its smaller sibling, the RØDECaster Duo, and a number of other products in the RØDE White Collection, including the PodMic microphone, PSA1+ studio arm, NTH-100 headphones and the recently released Wireless ME Dual Set. The RØDECaster Pro II has joined the White Collection alongside the rest of RØDE’s podcasting and streaming range. The RØDECaster Pro II is our flagship audio production console for creators. Combining revolutionary features with superior sound quality, endless customisability and unmatched ease of use, the RØDECaster Pro II is the ultimate all-in-one solution for podcasting, content creation and streaming. Now, with the white edition of the RØDECaster Pro II, you can bring a bright, clean aesthetic to your desktop, bedroom or studio, and introduce a splash of colour to your space with the customisable RGB lighting. When paired with the rest of the RØDE White Collection, you can build an entirely white setup to better suit your style, whether you want to stand out on-camera or simply make your workspace your own. Check out the RØDECaster Pro II and RØDECaster Duo in white."
author = "William Chan"
