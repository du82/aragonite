full_description = "Engineering Cadetship At RØDE we are Passionate about Audio Want to work for one of the fastest-growing, most innovative manufacturer-exporters in audio technology in the world today? Are you interested in using your expertise to challenge yourself and the industry, designing and building precision tools of creativity for a hungry world market? Part of The Freedman Group, RØDE is a leading manufacturer of high-quality microphones and audio equipment, which can be found in studios, venues, on-location, and in the hands of creatives in every corner of the world. Our products are designed and primarily manufactured by our industry-leading team in Sydney and are exported to over 119 countries globally. The Opportunity Come and discover the opportunity to join RØDE at our campus in Silverwater as a Mechanical Engineering Cadet. Our Cadetship program creates an opportunity to accelerate your personal and professional growth as you combine paid work with study; a two-for-one situation placing you far ahead of your peers! Cadetships provide a combination of part-time study and part-time work. Cadetships at RØDE are open to university students entering their 2nd or 3rd year of study. Working within highly skilled and supportive teams, and under the guidance of experienced engineers and technical specialists, you will gain exposure to a range of areas and projects across RØDE relating to your degree. Our cadetships offer you experience while providing financial support for your studies. Each week you are given time to attend university, as well as allocated time to sit exams. Course fees and a textbook subsidy are paid by RØDE, enabling you to graduate debt-free. What will you do? You’ll gain invaluable on-the-job experience on our equipment, machinery, software and operations. Your exposure will include, but not be limited to, the implementation and design of tooling, automation cells, robotic programming, jigs and fixture design and process continuous improvements for our technical manufacturing facility, with an opportunity to be involved in projects and strategy planning. You will validate your designs and support ideas with engineering calculations and best-practice engineering methods. This will provide you with an understanding of the fundamentals of the equipment and machinery involved in manufacturing our audio products and the critical role a mechanical engineer plays in manufacturing. The role offers the opportunity to experience many different fields of mechanical engineering and to find your preferred field, where you can continue to grow and apply your strengths. A focus on the preferred engineering field can then be set later in the cadetship. Potential fields of engineering: Additive manufacturing Injection mould design Press tool design Diecasting design Jigs and fixture design Automation and robotic cell design and implementation Programming of robots and automation equipment Prototyping and testing More About You You will be enthusiastic to embark on your engineering journey in a business and manufacturing context, you’ll have the desire to grow and develop yourself as an engineer, along with a commitment to the safety of yourself and others. You’ll thrive working within a team, willingly collaborate and share ideas, and actively contribute to your team’s success. You’ll currently be in your second or third year of study in mechanical engineering or similar. Please note, that it is a requirement to upload a copy of your resume and academic transcript as part of your application."
