screet aesthetic Take Your Studio On The Road The Backpack is purpose-made to securely transport your entire studio setup – perfect for creators on the move. It features a custom-designed compartment for your RØDECaster Pro or Pro II, a padded sleeve for laptops up to 16-inches, side pouches for studio arms, tripods or water bottles, and even a dedicated pocket for an AirTag or similar tracking device. Plus, with customisable partitioning, you can configure the Backpack exactly to your needs. Sleek, Secure and Stylish Not only does the Backpack sport a sleek, understated aesthetic, but it has luxurious comfort and rugged durability to match. Its exterior is constructed from weather-resistant, ballistic-grade nylon, it features a lush Alcantara® carry handle, it features ergonomic shoulder straps and sternum strap, and the interior is lined with padding and brushed polyester to keep your gear immaculate. Specifications"
