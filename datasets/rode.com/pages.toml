["https://rode.com/about/news-info/introducing-wireless-micro-our-smallest-simplest-and-sleekest-wireless-mic-yet"]
title = "Introducing Wireless Micro: Our Smallest, Simplest and Sleekest Wireless Mic Yet | RØDE"
description = "The Wireless Micro is a pocket-sized wireless microphone system tailor-made for smartphone creators, available in version for either USB-C or Lightning phones."
full_description = "Introducing Wireless Micro: Our Smallest, Simplest and Sleekest Wireless Mic Yet We are incredibly excited to announce our smallest, simplest and sleekest wireless microphone to date – the Wireless Micro. RØDE has been the premier brand for cutting-edge, high-quality wireless microphones for over a decade. The Wireless GO™ was the world’s first compact wireless microphone system, revolutionising on-camera audio for creators around the world. Its small size, clip-and-go design, professional sound quality and in-built microphones formed the foundation of our wireless range, which soon grew to include wireless audio solutions for creators at every level and across every category. Now, the Wireless Micro is changing the game again, revolutionising smartphone content creation by delivering our wireless foundation in its most accessible format yet. The Wireless Micro is a pocket-sized wireless microphone system tailor-made for smartphone creators. Available in both black and white, and with versions for either USB-C or Lightning devices, the slimline receiver connects directly to a phone with no need for cables, making for a super compact and tidy recording setup. It features two ultra-compact, ultra-lightweight transmitters with integrated clips and magnetic attachments that are incredibly easy to mount on a subject while remaining discreet on camera. The built-in microphones are housed in acoustic chambers with a patent-pending design, purpose-built to capture exceptionally clear and intelligible audio while mitigating wind noise. Combining this innovative design with our legacy of pristine wireless audio transmission and intelligent GainAssist technology, the Wireless Micro delivers perfectly balanced audio, every time. Finally, the super sleek charging case is perfectly pocket-sized and delivers two full recharges for up to 21 hours of battery life, all while keeping the system safe and secure – the ideal grab-and-go solution for smartphone creators. Key Features of the Wireless Micro: In-built microphones and automatic pairing makes it incredibly easy to use Receiver connects directly to a smartphone with no cables required (USB-C or Lightning version available) Patent-pending acoustic chamber design purpose-built to capture exceptionally clear and intelligible audio while mitigating wind noise Intelligent GainAssist technology automatically controls audio levels for perfectly balanced sound in any application Pocket-sized charging case provides additional two charges for up to 21 hours battery life, making it the ideal grab-and-go companion Ultra-compact, ultra-lightweight form factor with a sleek design for discreet on-camera presence and elegant aesthetic Additional furry windshields included Works seamlessly with RØDE’s free iOS video app, RØDE Capture Available in both black and white The Wireless Micro is available in either black or white, and in versions for USB-C or Lightning smartphones. No Cables, No Complications, Pure Creativity The Wireless Micro makes it easier than ever to capture crystal-clear wireless audio for your smartphone content, removing as much friction from the creative process as possible. The transmitters are automatically paired and feature integrated clips, magnetic mounts and built-in, high-quality microphones, so they’re ready to roll right away. Simply connect the receiver directly to your phone, clip on the transmitters, and start recording – no cables or complicated controls to worry about. The Wireless Micro also features our intelligent GainAssist technology, which automatically controls volume levels on-the-fly, removing the need to constantly fuss over settings and mitigating the risk of accidentally ruining a take with clipped or quiet recordings. This feature means you can record upload-ready audio right away, no matter how much of a background you have in audio. Not only that, but this immediacy also removes the need for any editing or post-processing – a huge win for the mobile workflow. The Wireless Micro features intelligent GainAssist technology that automatically adjusts your levels for perfectly balanced audio every time. Always Sound your Best While modern smartphones are more than capable of recording exceptional video footage, their integrated microphones are generally lacking, especially when it comes to capturing audio at a distance. This is where the Wireless Micro comes in. Each transmitter features a patent-pending acoustic chamber design, which houses the microphone and is purpose-built to mitigate wind noise and capture exceptionally clear audio while remaining as compact as possible. The omnidirectional pickup pattern captures sound from all around, making placement and positioning super simple. Combining this with GainAssist makes for perfectly balanced, even audio, even if the microphone moves during recording or its placement isn’t ideal. The Wireless Micro’s included pocket-sized charging case provides an additional two recharges for 21 hours of operation. Tell Your Story, Wherever it Takes You The Wireless Micro was born of our mission to condense our exceptional legacy of pristine wireless audio into its most compact and portable format yet. The result is the ultimate pocket-sized companion for creators on the go, with a super sleek and premium design that inspires confidence with every use. The transmitters’ ultra-compact form factor and ultra-lightweight build – weighing just 12 grams – make them perfect for clipping onto talent while remaining discreet on-camera, and their splashproof design means they can even handle inclement weather. The pocket-sized charging case keeps the system safe and secure on the move and, with an extra two recharges on-board for a total battery life of 21 hours, the Wireless Micro is ready whenever and wherever you take it. The release of the Wireless Micro marks another milestone in the evolution of creator technology, and another step in our mission to provide high-quality, accessible audio solutions for today’s creative generation. Learn more about the Wireless Micro."
