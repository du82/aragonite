["https://rode.com/about/news-info/introducing-the-wireless-go-gen-3-the-next-generation-of-the-worlds-most-popular-wireless-mic"]
title = "Introducing the Wireless GO (Gen 3) – the Next Generation of the World’s Most Popular Wireless Mic | RØDE"
description = "The Wireless GO (Gen 3) is a powerful compact microphone system that features 32-bit float recording, intelligent GainAssist and a wide range of professional features."
full_description = "Introducing the Wireless GO (Gen 3) – the Next Generation of the World’s Most Popular Wireless Mic We're excited to announce the third generation of the iconic Wireless GO. Building on the success of the world’s most popular wireless microphone platform, the Wireless GO (Gen 3) boasts every feature and convenience you could possibly need while ensuring that the intuitive grab-and-go operation that the range is known for remains intact. With 32-bit float on-board recording, intelligent GainAssist technology and a host of next-generation features, the Wireless GO is the perfect companion for elevating your content with pristine wireless audio. Plus, for the first time in the history of the iconic RØDE Wireless range, the Wireless GO is available not only in black and white, but also in an expansive suite of limited-edition colours, giving creators yet another avenue for expression. Key Features Dual-channel compact wireless microphone system RØDE’s state-of-the-art Series IV 2.4 GHz digital transmission with 128-bit encryption for crystal-clear, incredibly stable audio at ranges up to 260m (line of sight) Over 40 hours of 32-bit float on-board recording for the recovery of clipped or quiet audio files Intelligent GainAssist technology, flexible output gain control and safety channel for ensuring pristine audio when recording direct to camera Universal compatibility with cameras, smartphones and computers for ultimate flexibility Locking lavalier connectors for complete security and peace of mind Headphone monitoring with on-board level control Automatic plug-in power detect for extended battery life Easy configuration on a computer or smartphone via RØDE Central Bright LCD display and intuitive controls for quickly and easily adjusting settings on-the-fly Compatible with all RØDE Series IV devices, including RØDECaster Pro II and RØDECaster Duo, RØDECaster Video, Wireless PRO, Interview PRO and more Available in timeless black and iconic white, as well as a range of limited-edition colours, including red, orange, green, purple, pink, blue, cobalt, clay, lilac, stone, rose and moss Designed and made in RØDE’s precision facilities in Sydney, Australia “The original Wireless GO established an entirely new category when it was released in 2019,” says RØDE CEO Damien Wilson. “It completely changed the game for creators, giving them a compact and simple solution to recording wireless audio without sacrificing the quality and stability that their craft demands. The Wireless GO II took this even further, adding a host of new features that quickly established itself as a new standard in the industry. And now, with the third generation of the iconic wireless mic system, the Wireless GO is more powerful, more colourful and more feature-packed than ever and ready to raise the bar once again. We can’t wait to see what you create.” Flawless Sound with Every Take The Wireless GO is loaded with cutting-edge features that allow you to record flawless audio with total confidence. Both transmitters feature professional built-in microphones with an omnidirectional pickup pattern and the same improved design and upgraded preamp circuitry as found in our Wireless PRO system. This makes them ideal for recording clear and intelligible speech from all around – even if placement is less than ideal – while minimising the risk of plosives and other audio artifacts. With its 32-bit float on-board recording, you can capture your audio directly to each transmitter without having to worry about it clipping or being too quiet – both can be recovered in post. This game-changing technology ensures that you will always have a pristine backup of your audio, even when recording in the most challenging and dynamic environments. Each of the transmitters also feature a dedicated recording button for starting and stopping recordings, and over 40 hours of on-board memory. Building on the success of the world’s most popular wireless microphone platform, the Wireless GO (Gen 3) boasts every feature and convenience a content creator could possibly need. If you’d prefer to record straight into your camera, the Wireless GO boasts a suite of features designed to make it as seamless as possible, with little-to-no editing required in post. At its core is RØDE’s revolutionary GainAssist technology, which uses intelligent algorithms to dynamically balance audio levels on-the-fly, delivering a silky-smooth output without the wild fluctuations typically found in a raw recording. GainAssist is available in two distinct modes – Auto and Dynamic, the latter of which produces a well-balanced signal while retaining more of the nuanced dynamics of your recording, or you can turn the feature off if you’d prefer to rely on manually adjusting the 30dB of flexible output gain control. To round it all out, the Wireless GO also features a safety channel that records a second copy of your audio track at a lower volume, protecting your audio from being lost to hot signals. These features combine to make bad recordings a thing of the past. Whatever your workflow, the Wireless GO has your back, delivering flawless audio in any situation and freeing you up to focus on creating your best work yet. The Mic for Every Setup and Every Setting As the RØDE Wireless range has become renowned for, the Wireless GO (Gen 3) is extremely versatile. It features both digital (USB-C) and analog (3.5mm TRRS) outputs, allowing you to record pristine wireless audio directly into your camera, phone, laptop, tablet or just about any device imaginable. In fact, the transmitters can even pair directly to a range of other RØDE Series IV compatible products, such as the RØDECaster Pro II and Duo, the recently released RØDECaster Video, and other wireless receivers in the Series IV lineup. The Wireless GO also marks the return of RØDE’s unique wireless form factor, with its integrated clip design that allows for quick and easy attachment to belts, collars, clothing and cold shoe mounts. This design combined with its immensely flexible connectivity options make the Wireless GO a creative chameleon – just as home shooting with a DSLR or mirrorless camera as it is in a smartphone recording rig, USB microphone setup or even used as a field recorder. The Wireless GO (Gen 3) features USB-C and 3.5mm outputs, allowing you to connect to cameras, phones, tablets and even computers. More Features, More Flexibility Alongside its improved built-in microphones, powerful on-board recording capabilities, robust gain control and versatile connectivity, the Wireless GO boasts an array of professional features that make it uniquely powerful for creators. Both transmitters feature locking connectors that ensure total security when using an external lavalier or another microphone with a locking connector. The intelligent plug-in power detect feature extends battery life in the field by automatically powering the Wireless GO on and off in sync with a connected camera, making sure you’re always ready to record, keeping you running for longer. The receiver is also equipped with a 3.5mm TRRS jack, enabling headphone monitoring with adjustable output levels as well as compatibility with TRRS microphones, such as headsets or lavaliers. Additional features, including merged and split recording modes, marker dropping, customisable buttons and flexible recording options, make the Wireless GO one of the most adaptable wireless microphone systems available. The Wireless GO can be conveniently configured via a computer or smartphone using the RØDE Central companion app, allowing users to tailor their setup on the fly wherever they are. The included SC33 Charging Hub allows you to charge all three of your Wireless GO (Gen 3) units at the same time, as well as access on-board recordings and adjust settings. Your Sound, Your Style, Your Story In addition to timeless black and iconic white, the Wireless GO comes in a range of striking finishes, including the vibrant red, orange, green, purple, pink and blue options, and the more subdued cobalt, clay, lilac, stone, rose and moss in the tonal palette. This is the first time any product in RØDE’s Wireless range has been available in colours other than black or white, allowing you to personalise your on-camera presence to suit your style. This coloured range will be available in limited quantities exclusively from RØDE. Charge Case+ To coincide with the launch of the Wireless GO, RØDE is also releasing a dedicated charging and travel case accessory – the Charge Case+. This is a compact case for the Wireless GO (Gen 3) that keeps the entire system safe and secure when storing or taking it out on the road. It features an integrated battery that delivers two full recharges for up to 21 hours of use and allows simultaneous data access to the complete system for transferring recordings, adjusting settings and updating firmware. The Charge Case+ is available separately. The third-generation Wireless GO is a more-than-worthy successor to the world’s most popular wireless microphone. It delivers a suite of powerful features and improvements to the platform that are designed to reduce friction and empower creators, making it easier than ever to focus on what matters most – creating. Learn more about the Wireless GO (Gen 3)"
author = "William Chan"
year_published = 2025
