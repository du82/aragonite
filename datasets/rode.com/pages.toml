["https://rode.com/about/news-info/rode-appoints-nick-engel-as-senior-director-of-engineering"]
title = "RØDE Appoints Nick Engel as Senior Director of Engineering | RØDE"
description = "With over 20 years of experience developing cutting-edge audio technology for consumer products, Nick is a key hire for RØDE."
full_description = "RØDE Appoints Nick Engel as Senior Director of Engineering We’re thrilled to announce the appointment of Nick Engel as Senior Director of Engineering. Nick joins RØDE with a wealth of experience in the audio technology industry, having held senior engineering positions at Dolby and Apple. With over 20 years of experience developing cutting-edge audio technology for consumer products, Nick is a key hire as we continue to innovate and expand our product offerings into entirely new frontiers. Nick joins RØDE with a wealth of experience in the audio technology industry, having held senior engineering positions at Dolby and Apple. In his role, Nick will oversee all aspects of engineering for the New Product Group, leveraging his extensive expertise in consumer audio technology, both hardware and software to lead our ongoing commitment to delivering world-class creative solutions. His leadership will be instrumental in driving the development of our future product roadmap, furthering our mission to create groundbreaking tools for creators across the globe. Commenting on the appointment, RØDE CEO Damien Wilson said, “We are incredibly excited to welcome Nick Engel to the RØDE team. His impressive background in audio engineering and his experience working with some of the world’s most iconic technology brands make him the perfect fit for our team. Nick’s expertise will be crucial as we push the boundaries of what’s possible creative technology and continue to create exceptional products for the next generation of creators.” “I was drawn to RØDE because RØDE is a global leader in its field,” said Nick Engel. “I’ve always been able to rely on RØDE products both professionally and in my creative personal life, so it’s an honour to join the company at such an exciting time. RØDE’s commitment to excellence in product design and engineering is truly inspiring. I look forward to working alongside the talented team here to build on the company’s legacy of delivering industry-leading products that empower creators around the world.”"
author = "William Chan"
year_published = 2025
