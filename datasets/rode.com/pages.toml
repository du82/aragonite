full_description = "SC21 USB-C to Lightning Cable (30cm) The SC21 is a high-quality 30cm (1') Lightning Accessory Cable designed to connect MFi-certified microphones and other devices with a USB-C output to iOS devices with a Lightning input. It's available in a range of colours, including black, orange, red, purple, pink, green and blue. Note: this cable will not charge or sync your iOS device. High-quality Lightning to USB-C cable 30cm (1 ft) long MFi-certified Available in a range of colours: black, orange, red, purple, pink, green and blue Specifications FAQs Q. Is there a difference in functionality between the SC15 and SC21? A. There is no difference in functionality – both cables allow connection to MFi-certified microphones, such as the AI-Micro or Wireless GO II, to iOS devices that have a Lightning input. The SC15 cable has a right-angled connector on one end and a straight connector on the other, whereas both ends of the SC21 cable are straight. Additionally, the SC15 has a junction box for cable management. Q. Does this cable work with all RØDE USB devices? A. While almost every current RØDE USB audio device is MFi-certified and works flawlessly with iOS devices when using a Lightning cable such as the SC21, some earlier legacy devices are not, including the original Wireless GO, NT-USB Mini, and XCM-50."
