["https://rode.com/about/news-info/introducing-the-rodecaster-video-all-in-one-production-console"]
title = "Introducing the RØDECaster Video All-in-One Production Console | RØDE"
description = "The RØDECaster Video is a revolutionary all-in-one video and audio production console that provides intuitive control over every element of your content."
full_description = '''Introducing the RØDECaster Video All-in-One Production Console We are excited to announce a groundbreaking production console that seamlessly combines state-of-the-art video switching, production and recording capabilities with a complete professional audio studio. Just as the original RØDECaster Pro revolutionised the podcasting landscape, the RØDECaster Video now does the same for video production, offering a comprehensive and intuitive all-in-one solution for content creation, video podcasting, live streaming and broadcast that’s as versatile as it is powerful. Boasting an unprecedented feature set not found in any video switcher or audio mixer alone, the RØDECaster Video delivers groundbreaking flexibility and unmatched control for today's creators, whether you are a solo streamer or creator at home, or a producer operating large-scale video productions and events. This is video production, evolved. The RØDECaster Video is a revolutionary all-in-one video and audio production console that provides intuitive control over every element of your content. Key Features of the RØDECaster Video: High-performance octa-core CPU with a next-generation video engine, built from the ground up, allows for an innovative scene-based architecture that makes it super simple to create, configure and switch between complex multi-source layouts Four HDMI inputs and two flexible USB-C inputs allow for connecting and switching between six video sources simultaneously, including USB webcams Two studio-grade Neutrik® combo jacks with ultra-low-noise, high-gain Revolution Preamps™ for capturing pristine audio from XLR microphones, instruments and other audio equipment Dual internal wireless receivers for connecting RØDE Series IV wireless microphones such as the Wireless PRO, Wireless ME and Wireless GO IIPowerful APHEX® audio processing, including an EQ, compressor, noise gate, high-pass filter, de-esser and the legendary Aural Exciter™, Big Bottom™ and Compellor™ effects Automatic green screen or blue screen for effortlessly replacing backgrounds and using video sources in scenes Innovative "Inspect" feature for quick-and-easy preview and configuration of any input or scene Intelligent audio-based auto-switching for seamless hands-free switching between video sources and scenes Stream directly to all major platforms via Wi-Fi, Ethernet or USB and record directly to an external USB storage device, including multitrack and isolated (ISO) recording for complete post-editing flexibility Remote control, user-assignable graphics and media, custom scene building, audio mixing and effects, and other advanced configuration options via RØDE Central Designed and made in RØDE’s state-of-the-art facilities in Sydney, Australia “For decades, our mission has been to empower creators with professional yet accessible audio equipment,“ says RØDE CEO Damien Wilson. “Groundbreaking innovations like the RØDECaster Pro and Wireless GO have changed the way that people approach creating content across multiple categories, placing studio-grade audio solutions within the reach of today’s creators. With the RØDECaster Video, we are doing the same for video production.” “With its intuitive interface, scene-based architecture and seamless combination of professional video and audio in one compact device, it delivers unprecedented power and versatility to the next generation of content creators. The RØDECaster Video marks a huge step in the evolution of RØDE, and a massive milestone for creator technology.” Video Production, Evolved At its core, the RØDECaster Video is a video switcher, offering creators a hands-on solution for creating dynamic content, both live and recorded. But with its rich feature set, advanced processing and integrated audio capabilities, it reinvents the category entirely, establishing a new high-water mark for the industry. It provides you with all the tools needed to create engaging video productions while being incredibly easy to use, making professional video production more accessible than ever. The RØDECaster Video features a next-generation video engine, built from the ground up by the team here at RØDE. This engine, built around an extremely powerful and flexible CPU, allows for an innovative scene-based switching architecture that simply isn’t possible on a traditional FPGA-based system used by other video switchers. This architecture allows creators to build and configure complex scenes consisting of video sources, custom graphics, media playback and more, and then switch between these scenes with the press of a button. This means that an entire production can be planned, crafted and laid out across the RØDECaster Video’s seven scene buttons, and you can simply switch between them throughout your show. Another massive advantage that the RØDECaster Video’s groundbreaking architecture boasts is its unique, dual-engine processing. This allows you to view entire scenes and complex compositions in a preview screen whilst sending an entirely different composition to the live program feed – no more guessing what your live stream or broadcast will look like when you make the switch. From features and functionality to versatility and ease of use, the RØDECaster Video is unlike anything that has come before, it represents a significant paradigm shift in the world of video production. Incredible Video and Audio, All-in-one The RØDECaster Video is the first product in its class to combine comprehensive video production capabilities with professional audio mixing and processing functionality. In addition to its next-generation video engine, flexible video connectivity options, innovative switching workflow and powerful production features, it is also a complete audio production solution, giving you everything you need to create content that looks and sounds incredible. With two studio-grade Neutrik® combo jacks, a pair of built-in wireless receivers, Bluetooth connectivity and flexible audio over USB, the RØDECaster Video can capture a wide range of audio equipment – from XLR microphones and line-level studio equipment to RØDE Series IV wireless transmitters and RØDE USB microphones. The two combo inputs feature ultra-low-noise, high-gain Revolution Preamps™ for capturing pristine audio, and each of the nine audio channels boasts professional audio processing and effects powered by APHEX® to give your sound a professional sheen, including compressors, noise-gates, de-essers and the coveted Aural Exciter™, Big Bottom™ and Compellor™ processors. Just like its RØDECaster siblings, the RØDECaster Video also offers super flexible audio mixing, custom routing and multitrack recording, making it easier than ever to tailor your production or stream to your exact needs. With the combination of a next-generation video engine and audio prowess built on the pedigree of the RØDECaster range, the RØDECaster Video provides creators with everything they need to make exceptional content in a single device. The ideal central hub for any creative workflow. Ultimate Versatility for Maximum Creative Possibility With its wide array of versatile video and audio inputs and outputs, you can tailor the RØDECaster Video to your exact needs. Configure each of the two HDMI outputs to show preview, program or multiview feeds for external monitoring, use any combination of six USB or HDMI video sources simultaneously, and mix nine channels of stereo audio from a huge selection of potential sources – the possibilities are endless. Beyond connectivity, the RØDECaster Video’s core architecture is designed with flexibility in mind. Choosing between “instant” or “studio” switching modes alters the fundamental switching and previewing behaviour, allowing you to opt for a quick, on-the-fly workflow better suited to solo productions, or a more traditional broadcast operation with multiple people. The powerful custom video engine allows for tremendous flexibility thanks to its unique scene-based operation. Each of the seven scene buttons can contain completely customised layouts with multiple sources of video, images, videos and even keyed inputs, making it easier than ever to set up complex configurations involving green screens, logos, graphics and more. Whether streaming live or recording a show to edit later, the RØDECaster Video offers a range of options to suit any manner of workflow. Creating a custom streaming profile for Twitch, YouTube Live and other popular platforms allows for direct streaming from the device via Wi-Fi or Ethernet. Connecting external USB storage such as an SSD or thumb drive allows creators to record shows in their entirety, including the ability to capture each video source independently as an ISO recording to edit later. The same post-production flexibility applies to audio as well, with multitrack recording capturing each source separately, and with the option to create custom routing for each of your audio outputs, entirely separate mixes can be sent to the live stream, recording, headphones and more. Pro Video Production, Simplified Designed from the ground up to streamline and simplify the video production process while bypassing the limitations of other devices, the RØDECaster Video makes producing exceptional content more accessible than ever. Its interface offers the perfect blend of intuitive control and flexible function, with large, dedicated buttons to switch video sources and scenes, start and stop recording, enable automatic transitioning, and directly access typically hidden functions such as chroma key control, multi-source layouts, graphics and media. A large 2-inch touchscreen and versatile encoder enables quick-and-easy navigation of video, audio and other settings, transition type and timing, as well as displaying critical information about your show. The innovative Inspect button allows you to safely preview and configure any inputs, scenes or media at the press of a button – a revolutionary feature that takes the guesswork out of video switching. While the RØDECaster Video offers plenty of hands-on control on the device itself, you can enhance your production with the RØDE Central companion software. Alongside advanced configuration options, RØDE Central allows for remote control over Wi-Fi or Ethernet, giving you an option to wirelessly preview and control your production when you need to sit further away from the console. It is also home to the advanced scene builder, providing complete freedom over the construction and layout of each scene in a show, including the ability to resize frames and manage video, image and audio files. It also features an expanded audio mixer for fine-tuning the processing, effects and levels of each sound source. If you don’t have someone to act as a dedicated operator, or simply want a more autonomous and hands-free workflow, the RØDECaster Video features intelligent auto-switching technology. This will automatically switch between cameras or inputs based on which host, guest or subject is speaking. The system is fully configurable and is based on priority settings and screen time calculations, ensuring that the switching feels natural and creative, emulating the master touch of an experienced producer. The RØDECaster Video is the ultimate video and audio production console, offering everything you needs to make incredible looking and sounding content in an intuitive, powerful, versatile and compact package. Learn more about the RØDECaster Video.'''
