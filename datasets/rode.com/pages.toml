full_description = "General Hand At RØDE we are Passionate about Audio Want to work for one of the fastest-growing, most innovative manufacturer-exporters in audio technology in the world today? We have a vacancy for a General Hand to join the business. This role will support RØDE’s CNC team. Part of The Freedman Group, RØDE is a leading manufacturer of high-quality microphones and audio equipment, which can be found in studios, venues, on-location, and in the hands of creatives in every corner of the world. Our products are designed and primarily manufactured by our industry-leading team in Sydney and are exported to over 119 countries globally through more than 6000 dealers, including Amazon, Best Buy, Sweetwater, Guitar Center, Thomann and JB Hi-Fi. Our employees are passionate, hard working, talented and are pivotal to our success. Your responsibilities will include: Support all CNC processes – including loading and unloading machines Support the CNC team with packaging, palletising, labelling etc. Participate as a general hand for any maintenance related tasks. Maintain records. Ensure housekeeping rules are adhered to. Inspection of parts pre and post processing. To comply with all reasonable requests made by the management to support the business needs. You will require the following skills and experience to be successful: Experience as a General hand in a manufacturing environment – desirable. Excellent written and communication skills. Ability to work independently and prioritise tasks effectively in a fast-paced manufacturing environment. High level of attention to detail. Work on own initiative or as part of a team. Conscientious and dynamic. Excellent timekeeping and attendance. Flexible as there may be a requirement to work shifts or overtime to support the business needs. Basic understanding of WHS. Our campus is designed to create an atmosphere which reflects our love of cutting edge technology, collaboration, and our deep connection to music, film and all things audio. Our production facilities are cutting-edge and are constantly expanding as we increase our capability with new manufacturing technologies and processes. RØDE’s investment in our in-house capability is aggressive, unmatched in the industry. Our plant boasts the finest technologies in metal engineering and production, Surface-Mount Technology electronics production, military grade finishing, plastic-injection mould manufacture, and a brand-new, best-practice toolmaking facility. If you are interested in pursuing a unique opportunity to work with one of the most exciting, forward-thinking companies in Australia, inspiring millions of people around the world to realise their creative vision, apply today. We want you! RØDE values diversity in the workplace and encourages applications from people of all genders, ages and backgrounds."
