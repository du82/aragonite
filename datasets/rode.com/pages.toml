["https://rode.com/about/news-info/how-to-record-a-wireless-podcast"]
title = "How to Record a Wireless Podcast | RØDE"
description = "In this article, we’ll take a look at how to set up and record a wireless podcast using the RØDECaster Pro II or RØDECaster Duo and our wireless microphone systems."
full_description = '''How to Record a Wireless Podcast A wireless podcasting setup is an excellent choice if you want to establish an environment with a more casual feel, or if you’re keen to condense and declutter your podcasting setup. Obviously, this means you won’t have to worry about cables running to each of your microphones, but it also means you might not have any need for microphone stands or even the desk they sit on. In this article, we’ll take a look at how to set up and record a wireless podcast using the RØDECaster Pro II or RØDECaster Duo. Wireless Microphones with the RØDECaster Pro II and Duo First up, let’s take a look at the heart of our wireless podcast setup – the RØDECaster. These all-in-one podcasting consoles allow you to record multiple guests, apply processing and effects, play back sounds and music, and perform a wide range of podcast-specific functions all with one compact console. The most important feature for this setup, though, is that both the RØDECaster Pro II and RØDECaster Duo feature a wireless receiver. The RØDECaster Pro II and RØDECaster Duo both feature wireless receivers for pairing with any RØDE Series IV wireless transmitter. This means that you can pair up to two RØDE Series IV wireless transmitters and have them record on independent channels, allowing you to apply processing, effects and balance levels separately for each speaker, in the same way you can with any cabled microphone. Any Series IV transmitter will work here, including the Wireless PRO, Wireless ME, Wireless GO II and the Interview PRO. Just make sure that your wireless product and RØDECaster firmware are both updated to the latest version to ensure compatibility. Wireless Systems and Lavalier Microphones For a more compact and discreet setup, let’s take a look at using the Wireless PRO and its included lavalier microphones. To pair a transmitter to the RØDECaster Pro II or Duo, first select the “wireless” option from the microphone preset menu in the channel assignment screen. Now, tap “pair” on-screen and short-press the power button on your transmitter while it's powered on and unpaired. Select the “Wireless" option from the microphone preset menu in the RØDECaster Pro II and Duo’s channel assignment screen to pair your transmitters. Once you’ve paired both transmitters and assigned them to their own channel on your RØDECaster, connect the Lavalier II mics, clip the transmitters to your belt-line, and clip the lavalier onto your clothing, about a handspan away from your mouth. This is a great setup for more natural conversations where you’d prefer not to feel like you’re being recorded at all. For an even simpler setup, you can do away with the lavaliers and clip the transmitters directly to your clothing, using their built-in microphones instead. Handheld Wireless Microphones The Interview PRO is the perfect choice if you and your guest feel more comfortable holding something while talking, and you’re after professional, studio-grade sound quality. Just like the Wireless PRO, the Interview PRO is Series IV wireless transmitter, but in a more traditional presenter form factor and with a broadcast-grade condenser capsule for rich, detailed voice capture. You can pair two Interview PRO’s and have one for each speaker on the podcast, or if you’re recording interview-style content, a single mic passed back-and-forth may suit you better. The Interview PRO is a Series IV wireless transmitter that features a broadcast-grade condenser capsule and traditional, handheld form factor. Improving the Sound Quality of Your Wireless Podcast To avoid the need to monitor your audio throughout the podcast, you can connect a pair of headphones to your RØDECaster to check levels before you start recording and, if you’re using the Wireless PRO, Wireless ME or Interview PRO, enable GainAssist to automatically keep your audio balanced. Lastly, try and implement the same tricks you’d use to prepare your space for any audio recording — try and make sure your space is as quiet as possible by closing all the doors and windows you can, turning off air conditioning, and using curtains, carpets and other soft furnishings to dampen echos. Now just hit record on your RØDECaster, sit back, get comfortable and start chatting – it’s that simple! Our industry-leading range of podcasting equipment offers everything you need to record a podcast, from microphones, studio arms and headphones to complete, all-in-one production studios.'''
author = "William Chan"
year_published = 2025
