["https://rode.com/about/news-info/rode-announces-inaugural-sponsorship-of-the-australian-commonwealth-scholarship-for-the-royal-college-of-music"]
title = "RØDE Announces Inaugural Sponsorship of the Australian Commonwealth Scholarship for the Royal College of Music | RØDE"
description = "The Australian Commonwealth Scholarship aims to support Australian musicians in their pursuit of excellence, giving them a platform to shine on the global stage."
full_description = "RØDE Announces Inaugural Sponsorship of the Australian Commonwealth Scholarship for the Royal College of Music We are excited to announce RØDE’s sponsorship of the inaugural Australian Commonwealth Scholarship, launched to support Australian musicians in their pursuit of excellence at the Royal College of Music (RCM), London. The scholarship, the first of its kind, was unveiled during a prestigious reception held at NSW Government House, hosted by Her Excellency the Honourable Margaret Beazley AC KC, Governor of New South Wales. The event featured a special appearance by Dame Kiri Te Kanawa, one of the world’s most celebrated sopranos, and a breathtaking performance by the inaugural scholarship recipient, Ariana Ricci. From left to right: Peter Freedman AM, Ariana Ricci, Her Excellency the Honourable Margaret Beazley AC KC, Dame Kiri Te Kanawa, Natalia Ricci Peter Freedman AM, Founder and Chairman of RØDE, expressed his excitement about the partnership: “Supporting musicians is deeply personal to me. Music and the arts are vital to our culture and identity, and this scholarship will provide a platform for Australian talent to shine on the global stage, much like RØDE itself has done. We are committed to empowering creatives, and this collaboration with the Royal College of Music is a perfect extension of that mission.” The Australian Commonwealth Scholarship will enable talented musicians to study at the Royal College of Music, widely regarded as the world’s leading institution for musical education. This initiative underscores our dedication to nurturing creative excellence and amplifying Australian voices on an international scale. Ariana Ricci, the inaugural scholarship recipient, shared her gratitude: “I am incredibly honoured to receive this scholarship and deeply thankful to RØDE and the Royal College of Music for their support. This opportunity not only helps me pursue my dreams but also highlights the importance of nurturing Australian musicians and artists, ensuring our stories are heard around the world.” The Australian Commonwealth Scholarship reflects a shared vision to invest in the future of the arts and support Australian musicians in achieving greatness on the world stage. With RØDE as the inaugural sponsor, the program aims to inspire and empower emerging artists, paving the way for cultural and creative enrichment both locally and internationally."
