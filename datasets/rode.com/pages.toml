["https://rode.com/about/news-info/introducing-the-rode-creator-of-the-year-awards-2024"]
title = "Introducing the RØDE Creator of the Year Awards 2024 | RØDE"
description = "The RØDE Creator of the Year Awards celebrates the next generation of content creators, with US$250,000 in cash to be won."
full_description = "Introducing the RØDE Creator of the Year Awards We are incredibly excited to announce the debut of an all-new competition for creatives – the RØDE Creator of the Year Awards. Carrying on the legacy of My RØDE Reel and My RØDE Cast, the RØDE Creator of the Year Awards celebrate the next generation of content creators, sharing your work with the world and giving you the chance to win a share in US$250,000 cash and over US$100,000 in prizes. The RØDE Creator of the Year Awards 2024, with US$250,000 in cash and over US$100,000 in prizes to be won. What are the RØDE Creator of the Year Awards? “Celebrating creators is part of our DNA”, says RØDE CEO, Damien Wilson. “For years, the My RØDE Reel competition shone light on the incredible work of filmmakers and was, in fact, the world’s largest short film competition. We did the same for podcasters with the My RØDE Cast competition, giving them a global platform to share their work. Now, with the RØDE Creator of the Year Awards, RØDE and its partners are celebrating a new generation of creators – giving back to a community that inspires the world.” The RØDE Creator of the Year Awards recognises a diverse range of creators across YouTube, Instagram and TikTok – anyone using a RØDE product with a channel or account on one of these platforms is eligible to enter. The awards span across 22 content categories: Adventure and Outdoors ASMR Beauty Comedy DIY and Hobbies Entertainment Review Fashion Food and Cooking Gaming Gear and Tech Reviews Gym and Fitness Health and Wellness Home and Studio Tours How-to and Tutorial Interview Journalism Music Production and Performance Science Short Film and Documentary Sports Travel and Lifestyle Video Podcasts What Awards and Prizes are on Offer? Alongside the major Creator of the Year Award, there’s also an Emerging Creator of the Year Award to highlight the efforts of up-and-coming content creators – specifically, those that have started their channel in the last year. Each of the 22 content categories will have two awards – one judged by us and the other voted for by you, the community. Even as a voter, you have a chance to win, with 10 RØDE prize packs up for grabs. Creator of the Year Award — US$20,000 in cash and over US$30,000 in prizes. Emerging Creator of the Year Award – US$10,000 in cash and over US$25,000 in prizes. Category Awards – US$5,000 in cash and a partner prize pack. People’s Choice Awards – US$5,000 in cash and a partner prize pack. Voter Prizes – RØDE prize pack. How to Enter? To enter the competition, simply visit creatorawards.rode.com, click “Enter Now” and complete the registration and submission form before October 1. You will need to select a category that best describes the content you produce, provide 1-3 links to your content that best represents your channel or account, and tell us which RØDE product you use to create your content. If you are successfully shortlisted for your chosen category, community voting will run from October 15 until October 31 in order to select the People’s Choice Award for each category. For more information on the RØDE Creator of the Year Awards, please visit creatorawards.rode.com/faqs and for the complete terms and conditions, please visit creatorawards.rode.com/terms."
author = "William Chan"
