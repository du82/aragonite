["http://www.rodsbooks.com/fixparts"]
title = "FixParts Tutorial"
full_description = "First created: 3/12/2011, referencing FixParts version 0.7.0; last Web page update: 2/19/2024, referencing FixParts version 1.0.10 I'm a technical writer and consultant specializing in Linux technologies. This Web page, and the associated software, is provided free of charge and with no annoying outside ads; however, I did take time to prepare it, and Web hosting does cost money. If you find GPT fdisk or this Web page useful, please consider making a small donation to help keep this site up and running. Thanks! The FixParts program is an offshoot of my GPT fdisk (gdisk, cgdisk, and sgdisk) software. FixParts is a text-mode tool for Linux, FreeBSD, macOS, and Windows that's designed to correct some common problems with computer partition tables. The usual symptom of the problems FixParts is intended to fix is a disk that shows no partitions in GParted or similar tools, although you know the disk to contain partitions because they're visible to the Linux kernel or to other partitioning software. This page describes the symptoms in more detail. FixParts is a specialized partitioning tool. It has three main design goals, although it can do a few other things as well: If this talk of primary, extended, and logical partitions has you scratching your head, take a detour and read this page on the topic. One small correction: In terms of the on-disk data structures, the theoretical limit on the number of logical partitions is approximately 2 billion. I myself have created a disk with over 128 logical partitions. I've never heard of a serious installation using more than one or two dozen partitions, though. FixParts has a limit of 128 partitions. I do not recommend using FixParts for routine partitioning tasks such as deleting partitions, changing the active/bootable flag, or changing type codes. Although the program can do these things, these features are provided as conveniences when repairing more serious problems. The reason to not use FixParts for such routine tasks is that FixParts is not shy about making changes to partition numbering that might require changing the /etc/fstab file or boot loader configuration. Making such changes is a small price to pay if you've got a real problem with your disk, but it's an undesirable nuisance if your disk's data structures are legal. Thus, I recommend using fdisk, parted, GParted, or some other tool for routine partitioning tasks."
year_published = 2025
