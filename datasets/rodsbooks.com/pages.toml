["https://rodsbooks.com/wpfonts/wpfonts-screen.html"]
title = "On-Screen WordPerfect Fonts"
full_description = '''WordPerfect includes its own font rasterizer, which it uses both for printing and for displaying fonts on the screen. The program also includes its own selection of Type 1 fonts. Unfortunately, many people find WordPerfect for Linux's font handling to be inferior to that in Windows. There are a number of reasons for this, which are described here, with illustrative screen shots of text in Times, Helvetica, and Courier. Here is a sample of WordPerfect's 8.0's font display as delivered. My system was configured for a 1024x768 display, using XFree86 3.3.2 and the downloaded version of WordPerfect 8.0. Here is the same text as rendered in Windows 98 by WordPerfect for Windows. I've changed the fonts to use Times New Roman, Arial, and Courier New (the Windows standard fonts). It should be obvious that the Windows text is clearer than the Linux text. One reason for this is that the Windows text is larger, so there are more pixels per character. I'll come back to this in a while. In general, two other reasons why text can look bad are a poor font and a poor font rasterizer. As WordPerfect's rasterizer is built in, there's nothing that can be done about that; however, the font files themselves are another matter. Before going further, though, let's see what can be done in Linux and XFree86. Here's the same text as rendered by the xfsft font server and Microsoft's free TrueType fonts, using ApplixWare: This text is only marginally larger than the original WordPerfect for Linux text, but it's much more legible. Why? A lot of it has to do with TrueType vs. Type 1 fonts. TrueType includes more and better means of "hinting" a font -- that is, telling the software that renders the font how to handle the font at low resolutions. The xfsft font server handles the TrueType hinting quite well, so any font that uses this hinting benefits greatly under xfsft (or under Windows or MacOS). Many TrueType fonts do not include good hinting, though, and they'll look poor with xfsft (or in any other environment). Microsoft's core TrueType fonts are very well hinted, and so when used with xfsft, they look very good. (This wasn't always the case; early Microsoft TrueType fonts were much cruder than those Microsoft makes available today.)'''
