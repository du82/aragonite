["https://rodsbooks.com/efi-bootloaders/elilo.html"]
title = "Managing EFI Boot Loaders for Linux: Using ELILO"
full_description = "This Web page is provided free of charge and with no annoying outside ads; however, I did take time to prepare it, and Web hosting does cost money. If you find this Web page useful, please consider making a small donation to help keep this site up and running. Thanks! This page is part of my Managing EFI Boot Loaders for Linux document. If a Web search has brought you to this page, you may want to start at the beginning. The EFI Linux Loader (ELILO) is the oldest and most stable EFI boot loader for Linux. It's similar to the old Linux Loader (LILO) BIOS boot loader, so Linux old-timers should find ELILO familiar. Unfortunately, work on the program stopped in 2013. It still works, but it's no longer provided with most Linux distributions and it may eventually break. ELILO does not explicitly support Secure Boot, which is an increasingly important limitation. Overall, ELILO is a poor choice for most installations, but you can use it if you like. I've had little success using ELILO on my 32-bit Intel-based Mac Mini, but it works well on three 64-bit UEFI-based PCs and both 32- and 64-bit VirtualBox setups. I've also seen reports online of ELILO working on Macs, so I suspect there's a model-specific problem with my system, or perhaps a Mac configuration quirk I haven't mastered. Because of its obsolescence and limitations, I can't recommend ELILO for general use. It's of interest mainly to those who are nostalgic about LILO. Its principle advantage—easy manual configuration—is shared by other programs, such as gummiboot/systemd-boot and, in a different way, rEFInd. ELILO installation works just as described in EFI Boot Loader Installation. Some distributions include scripts that are intended to help with the file copying and configuring required by ELILO, but in my experience, these scripts often get things badly wrong. Therefore, I recommend not using them. Because the scripts sometimes run automatically when you upgrade your kernel, it's probably best to install ELILO from binary or source tarball rather than from a distribution's package. (The package file available from the ELILO Sourceforge download page includes binary .efi files for three architectures and a source code tarball.) On the other hand, perhaps the bugs I've encountered will be fixed by the time you read this, or perhaps your distribution will have a better package. (I encountered the worst problems with OpenSUSE, as I recall.)"
