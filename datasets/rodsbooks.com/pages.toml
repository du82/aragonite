["https://www.rodsbooks.com/kossel-xl"]
title = "My Kossel XL Printer Build"
full_description = '''This Web page is provided free of charge and with no annoying outside ads; however, I did take time to prepare it, and Web hosting does cost money. If you find this Web page useful, please consider making a small donation to help keep this site up and running. Thanks! This page describes my experiences building a Kossel variant delta-style 3D printer from scratch (not from a kit). If you know what this means and are interested, but are not yet an expert at building 3D printers, then read on. If you don't know what 3D printing, and especially building your own 3D printer, is about, then you may want to stop reading now, or check out the RepRap wiki, and particularly its page on the Kossel design, for some background information. In brief, the replicating rapid prototyper (or RepRap) project is intended to create designs for 3D printers that anybody with sufficient skill, interest, and money can build themselves. These printers can then be used to (among other things) create some (but not all) of the parts necessary to build a new 3D printer, other useful things, toys, decorative objects, and other less-useful items. In 2018, 3D printer technology shows a lot of promise, but it's nowhere near the "replicators" of Star Trek. Current home and small business 3D printers are slow (they take hours to print an object the size of a baseball), finicky, and print only in plastic (although exotic printers that print in other materials do exist). Nonetheless, the technology is advancing rapidly, and it's useful in some professions and industries — architects and engineers, among others, rely on 3D printers to do real work. For others, including myself, 3D printers are more of a hobby. There are only so many soap dishes and figurines you can print before the novelty wears off. That said, the ability to print unusual or even one-off products, such as cases for Raspberry Pis or brackets sized as needed, can be handy. For reasons described shortly, I decided to build my own 3D printer starting in December 2017. This project took several weeks to reach a point where the printer could be considered useful, and much longer to fine-tune it to the point where I was satisfied with the prints it produced. I'm sure an expert could have gotten it working in a day or two (not counting waiting for deliveries), with another couple days to fine-tune it. In the process, I learned a lot about 3D printers, and experienced the satisfaction of having built one from scratch myself. I also now have two 3D printers — the one I built and the one I bought ready-made some time before that. Thus, one printer can produce spare parts for the other, should one go down because of a broken plastic part.'''
