["https://rodsbooks.com/wpfonts/wpfonts-wphistory.html"]
title = "Word Processing Font History"
full_description = '''WordPerfect originated in the days when top-of-the-line printers were daisywheel impact devices requiring manual intervention to change fonts, and when on-screen displays were restricted to a single monospaced font. Particularly flexible dot-matrix printers included half a dozen fonts. In this environment, it made sense for a word processor to give the user a limited choice of fonts, which would be printed but not displayed in anything resembling a WYSIWYG ("what you see is what you get") fashion. WordPerfect, in particular, adopted a strategy, consistent with its code-based design, of embedding font change codes in the document. WordPerfect maintained a database of character widths for various fonts, which it used to compute the ends of lines. WordPerfect also maintained an extensive set of printer drivers, which, in terms of font support, served as a means of telling the printer to switch from one font to another. All of this was simple on an individual-printer basis, and effective, but crude by today's standards. It also required a massive library of printer drivers. With the arrival of popular GUIs (mainly the Mac and Windows), as well as more flexible printer font handling, things changed. The demand for WYSIWYG word processing led to the emergence of a new font and printer strategy, where the word processor relied upon the underlying OS for font handling, both for the on-screen display and the printer. In the conceptually simplest case, the word processor goes to the OS with a font request, and the OS then displays text in the desired font. When it comes time to print, the OS uses the same font file to print to the printer. Because the Mac and Windows include printer driver support in the OS, it's possible in these environments to strip away the extensive collection of printer drivers from the word processing application. This makes co-ordinating on-screen and printer fonts relatively simple, at least from the word processor's point of view. Of course, the details of such an arrangement can become tedious, especially when mixing font types (say, TrueType fonts in the OS, but a PostScript printer requiring Type 1 fonts). The word processor, however, needn't concern itself with most of these details; the tedium is handled by the OS and its drivers. Unfortunately, X doesn't directly provide printer support, so this approach doesn't work in Unix.'''
year_published = 2025
clearnet = "https://rodsbooks.com/wpfonts/wpfonts-wphistory.html"
