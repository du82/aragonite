["https://rodsbooks.com/efi-bootloaders/refind.html"]
title = "Managing EFI Boot Loaders for Linux: Using rEFInd"
full_description = "This Web page is provided free of charge and with no annoying outside ads; however, I did take time to prepare it, and Web hosting does cost money. If you find this Web page useful, please consider making a small donation to help keep this site up and running. Thanks! This page is part of my Managing EFI Boot Loaders for Linux document. If a Web search has brought you to this page, you may want to start at the beginning. rEFIt's author has abandoned the program; it hasn't been updated since March of 2010. Because rEFIt is very useful but has a number of limitations, I decided to fork a new project, rEFInd, to address them. Like rEFIt, rEFInd is a boot manager, not a boot loader; however, when paired with a kernel that includes EFI stub support, rEFInd can boot a Linux kernel without the help of any other boot loader. Compared to rEFIt, rEFInd offers other configurability improvements, bug fixes related to UEFI systems, and additional icons for specific Linux distributions. If you're already using GRUB, there's little reason to add rEFInd to the picture unless you're having problems with GRUB 2 or if one of rEFInd's advantages not shared with GRUB 2 is important to you. In practice, rEFInd's boot loader auto-detection can be a great boon in a multi-boot environment; a large number of GRUB 2 problem reports relate to problems detecting or launching other OSes. rEFInd tends to handle such issues better, although it does have a tendency to pick up too many boot options. (You can trim them in various ways, as described in the rEFInd documentation.) Overall, rEFInd is a capable modern boot manager. Like GRUB 2, it's low-maintenance once set up, but for different reasons; however, as GRUB 2 is the default boot loader for most distributions, GRUB 2 has an edge in initial configuration, especially if Secure Boot is enabled on the computer. rEFInd is easier than GRUB 2 to configure manually, including the sort of tweaks that are usually necessary when installing multiple Linux distributions. Like gummiboot/systemd-boot, rEFInd is a boot manager, not a boot loader, so it requires the use of the EFI stub loader."
year_published = 2025
