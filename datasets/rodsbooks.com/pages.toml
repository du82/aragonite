["https://rodsbooks.com/efi-programming/hello.html"]
title = 'Programming for EFI: Creating a "Hello, World" Program'
full_description = '''I'm a technical writer and consultant specializing in Linux technologies. This Web page is provided free of charge and with no annoying outside ads; however, I did take time to prepare it, and Web hosting does cost money. If you find this Web page useful, please consider making a small donation to help keep this site up and running. Thanks! Note: This page is a sub-page of my Programming for EFI document. If a Web search has brought you here, you may want to start at the introductory page. The traditional first program for a new compiler or environment is "Hello, World." I therefore present such a program for EFI, including the program itself, a Makefile for the program, and instructions on how to compile and run it. A "Hello, World" program for EFI demonstrates some of the unique features of EFI programming. To begin, consider the program itself: If you want to try compiling the program itself, cut-and-paste the preceding lines into a file called main.c; the Makefile presented shortly assumes this name. Many of this program's features are similar to those of a similar program for Linux, Windows, or other OSes and environments; however, there are some significant differences, too: More complex programs will of course expose additional differences between a C program written for most OSes and one written for EFI. Most of these differences relate to library differences between EFI and other environments. If you were building a "Hello, World" program for Linux in a Linux environment, you could compile it without a Makefile. Building the program in Linux for EFI, though, is essentially a cross-compilation operation. As such, it necessitates using unusual compilation and linker options, as well as a post-linking operation to convert the program into a form that the EFI will accept. Although you could type all the relevant commands by hand, a Makefile helps a lot. Such a file to build the preceding program file looks like this: If you cut-and-paste this code into a text editor, be sure to convert stretches of eight characters to tabs! Also, be aware that you may need to adjust the EFIINC, LIB, and EFILIB variables to point to the relevant portions of your GNU-EFI installation directory. EFIINC should, of course, point to your GNU-EFI include files; LIB should point to the directory that holds the libefi.a and libgnuefi.a files; and EFILIB should point to the directory that holds the crt0-efi-x86_64.o and elf_x86_64_efi.lds files (or equivalents for another architecture). The Makefile shown here works on a Fedora 18 installation. On Ubuntu 13.04, both LIB and EFILIB must be set to /usr/lib; and on Gentoo, they must both be set to /usr/lib64.'''
year_published = 2025
clearnet = "https://rodsbooks.com/efi-programming/hello.html"
