["https://rodsbooks.com/efi-bootloaders/sb-modules.html"]
title = "Managing EFI Boot Loaders for Linux: Signing Kernel Modules for Secure Boot"
full_description = "This Web page is provided free of charge and with no annoying outside ads; however, I did take time to prepare it, and Web hosting does cost money. If you find this Web page useful, please consider making a small donation to help keep this site up and running. Thanks! This page is part of my Managing EFI Boot Loaders for Linux document. If a Web search has brought you to this page, you may want to start at the beginning. Pre-boot malware exists, by definition, in software run before the OS has booted; but other software components can be quite sensitive, too. The OS's kernel is prime among these, and modern Linux distributions that support Secure Boot all provide signed Linux kernels. Boot loaders that honor Secure Boot, including GRUB 2 and rEFInd, refuse to launch a Linux kernel unless it's been signed with a key that matches one in the Secure Boot db or MOK list. If you compile your own kernel, you can sign it yourself with your own key, as described on an earlier page. This isn't the end of the story, though. Linux kernel binaries rely on a series of drivers, known as modules in the Linux world, which may be compiled into the main kernel binary or, more commonly, exist as separate files. These kernel modules help the kernel perform low-level tasks, such as read from and write to hard disks, manage network devices, and interface with USB hardware. If an attacker were to replace a kernel module file with a modified version, the consequences could be as serious as if the attacker replaced the main kernel file or boot loader. Note: Linux distributions normally pack the modules required to boot the kernel into an initial RAM disk (initrd or initramfs). This file is not normally signed with a Secure Boot key, but the kernel modules it contains are — at least, when the kernel requires signed modules. To protect against this possibility, the Linux kernel permits the signing of kernel module files, and provides mechanisms to check that these signatures are valid. If you use a major distribution that supports Secure Boot, such as Fedora, openSUSE, or Ubuntu, this detail is normally transparent, although there are exceptions to this rule. This page exists to help you navigate those exceptions, or to properly sign your kernel modules if you're using a distribution, such as Gentoo, that does not distribute pre-signed kernel modules. Although the kernel's checks on module validity are not technically part of Secure Boot, the two are related, and Secure Boot keys can be used to sign kernel modules."
