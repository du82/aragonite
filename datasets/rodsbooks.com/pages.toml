["https://rodsbooks.com/irobot/index.html"]
title = 'Review of the "I, Robot" Movie'
full_description = "Warning: This review contains mild spoilers. If you want to go into the film knowing nothing about it, read no further! Ordinarily I don't post movie reviews, as I've got better things to do with my time; however, I feel compelled to make an exception for this film. I'll preface my brief review by saying that I'm a long-time Asimov fan. In fact, I recall reading his I, Robot short story collection (whose cover now bears a shot of Will Smith from the movie, at least on the Amazon Web site) when I was in 6th grade. As with most Asimov stories, I was enchanted, and in fact, I saw the movie on the strength of the short stories. Having seen the previews that feature action-packed scenes of robots chasing Will Smith, I had my qualms. On the other hand, I was also cautiously optimistic because the film was directed by Alex Proyas, who was responsible for Dark City, which is an excellent film. I should have listened to my qualms. I knew going into the film that its plot bore little resemblance to that of the book of the same name. That's acceptable and understandable; after all, the book is a collection of short stories with no single plot. To be sure, others have attempted to create a unified plot from these stories. Harlan Ellison's screenplay is one notable example, and one that's infinitely superior to the film that was ultimately created. Still, building a single plot from a series of short stories isn't easy, and I'm not one who insists on slavish adherence to a book's plot in its film adaptation, so I went into the film willing to see a new creation. First, some preliminaries: The film is set in 2035 and features Will Smith as Del Spooner, a Chicago detective who investigates the apparent suicide of Dr. Alfred Lanning (played by James Cromwell). Along the way, Spooner meets up with and is aided by Susan Calvin (Bridget Moynahan), the only major character who appeared in the original Asimov stories. Spooner has an innate distrust of robots, and immediately suspects foul play. So far, so good; an Asimov story could easily have begun this way. Sadly, the story goes downhill from here."
