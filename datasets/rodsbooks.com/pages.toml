title = "Linux Power Tools"
full_description = "My eleventh book, Linux Power Tools, is a guide to Linux for intermediate to advanced users. Instead of spending time on basic topics such as system installation and using basic X features, the book emphasizes issues that involve advanced or tricky configuration, such as network-based scanning with SANE, using Xft fonts, resizing filesystems, and using NTP to synchronize time between systems. This book can help you get the most out of a Linux system, but you should have at least a basic grounding in using the OS first. Because the Linux world is so diverse, this book provides explicit coverage of five popular distributions: Debian, Mandrake, Red Hat, Slackware, and SuSE. (Some online retailers incorrectly state that the book covers UnitedLinux.) Page count: 611. In the weeks and months to come, I'll update this site with any errata or additional information that may be useful as developments in the Linux world warrant. I am making every attempt to keep these web pages viewable from any web browser. Of course, not all browsers support all features used by these pages, but I've tried to make such items harmless to these browsers. These pages have been checked using weblint, as well as with a variety of browsers. If you encounter a problem accessing these pages from your browser, please notify me."
