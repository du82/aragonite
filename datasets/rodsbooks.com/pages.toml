["https://rodsbooks.com/axfonts/fonts-fonttastic.html"]
title = "FontTastic Font Installation"
full_description = "It's relatively easy to install PostScript Type 1 (aka ATM) or TrueType fonts via the FontTastic font server software provided with ApplixWare. To do so, perform the following steps: This procedure is relatively easy, and offers the advantage of being able to temporarily disable a set of fonts, so you can install, say, seldom-used Gothic fonts but still be able to get at them by exiting ApplixWare, starting up the FontTastic font manager, activating those fonts, and re-starting ApplixWare. This also lets you use the fonts on both PostScript (or Ghostscript-driven) and PCL printers, whether the fonts are Type 1 or TrueType. Activating and de-activating fonts becomes easier if you change the permissions on the appropriate directories and files; then you can do it as an ordinary user, not just as root. Unfortunately, this procedure has the disadvantage of causing ApplixWare to download the font to the printer as a 300 dpi bitmap, so if you have a 600 dpi or better printer, you'll lose the benefits of your printer's resolution when printing with any fonts you install this way. The 300 dpi bitmaps also get embedded in the PostScript or PCL files you create, so if you change fonts or font sizes a lot you can create some truly enormous print files, which might be a concern if you're short on disk space or have a true PostScript printer with limited memory. It was these problems that made me look for another solution, and I found one with some help from the mailing list and a lot of experimentation."
