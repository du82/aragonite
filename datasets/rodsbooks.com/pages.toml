title = "TrueType Font Installation"
full_description = "If you have a collection of TrueType fonts you'd like to install in Applix, you have basically three options for how to proceed: As of version 3.3.2, there is no support for TrueType fonts built into XFree86. I've successfully used xfsft, a TrueType font server that uses the FreeType library. I actually used the glibc binary with FreeType statically linked from J�rg Pomnitz' xfsft page. According to the documentation, there are plans/hopes to integrate xfsft's TrueType capabilities into XFree86, so with any luck the need for a separate server will eventually evaporate. The xfstt server also handles TrueType fonts, and in principle should work as well as xfsft to serve TrueType fonts to Applix. I've not tested it, however, and some of the details of font server configuration will differ from what I describe below. Installing xfsft needn't be difficult, but the instructions on testing it produce nothing but crashes with some (now older) versions of the binary. Even these older binaries work fine in operation, however. Here's how I did it: I recommend doing the testing from a text mode startup of X, not an XDM login. The reason is that if there's a problem, XDM won't be able to start up, and you'll be locked out of your computer unless you have network login capabilities. If you start X manually from text mode, it'll just crash back to text mode if there's a problem, and you can work to correct the problem from there. Once the TrueType server is up and running, you can modify the Applix fontmap.dir file, as in the PostScript install section, to tell Applix to use the TrueType fonts for display purposes. Note that you'll still need a Type 1-format .afm file to give Applix the font metrics. This can be generated using the ttf2pfa utility from the freeware TrueType to Type 1 conversion utility. If your font is from a collection with both TrueType and Type 1 fonts, it may have an appropriate .afm file. There may be some other way to generate this file, too. To make the TrueType fonts automatically available whenever you start X, you'll need to auto-start xfsft. This can be done by adding it to your /etc/rc.d/rc.local file, as in the following entry:"
