["http://www.rodsbooks.com/linux-fs-code/index.html"]
title = "Using the GPT Linux Filesystem Data Type Code"
full_description = '''I'm a technical writer and consultant specializing in Linux technologies. This Web page is provided free of charge and with no annoying outside ads; however, I did take time to prepare it, and Web hosting does cost money. If you find this Web page useful, please consider making a small donation to help keep this site up and running. Thanks! A relatively new (June, 2011) partition type code for Linux-native filesystems on GUID Partition Table (GPT) disks holds the promise to reduce the risk of problems on dual-boot Linux/Windows systems. Unfortunately, this type code has not yet (as of October of 2012) been widely adopted by most partitioning software, although it's now "in the pipeline" and so should become used by default on most Linux distributions within a few months. In the meantime, many systems, particularly those that dual-boot Windows and Linux on Unified Extensible Firmware Interface (UEFI) computers, are vulnerable to accidental destruction of their Linux installations from Windows. The solution is simple, and this page describes how to implement the solution even if your distribution hasn't yet adopted it. Disk partition tables include type codes, which are coded names or numbers associated with specific uses of partitions. OSes can use the type codes as they see fit. For the most part, Linux ignores partition type codes, but Windows doesn't—it uses partition type codes as a filter to determine which partitions to attempt to use. Specifically, the Microsoft Basic Data type code (EBD0A0A2-B9E5-4433-87C0-68B6B72699C7) identifies a filesystem that Windows can understand, such as FAT or NTFS. Unfortunately, for years Linux has used this same type code to identify its filesystem partitions on GPT disks; however, Windows can't read Linux filesystems without extra drivers. This means that Windows shows Linux filesystem partitions as unformatted disks in its file manager, and if you attempt to access one, Windows asks you if you want to format it, as shown below. This makes it far too easy to accidentally trash your Linux installation from Windows if you place Linux filesystem partitions on a GPT disk. This problem does not affect the older Master Boot Record (MBR) partitioning system, which is the most common partitioning system on pre-2011 computers. Thus, on older Linux/Windows dual-boot systems, Windows won't show the Linux partitions in its file manager. Also, this problem does not apply to Linux swap, LVM, or RAID partitions, even on GPT disks; it only affects Linux filesystem partitions that are given the Microsoft Basic Data partition type code on GPT disks.'''
