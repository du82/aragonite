["https://www.rodsbooks.com/linux-uefi"]
title = "Linux on UEFI: A Quick Installation Guide"
full_description = '''This Web page is provided free of charge and with no annoying outside ads; however, I did take time to prepare it, and Web hosting does cost money. If you find this Web page useful, please consider making a small donation to help keep this site up and running. Thanks! For several years, a new firmware technology has been lurking in the wings, unknown to most ordinary users. Known as the Extensible Firmware Interface (EFI), or more recently as the Unified EFI (UEFI, which is essentially EFI 2.x), this technology has begun replacing the older Basic Input/Output System (BIOS) firmware with which most experienced computer users are at least somewhat familiar. This page is a quick introduction to EFI for Linux users, including advice on getting started installing Linux to such a computer. Unfortunately, EFI is a dense topic; the EFI software itself is complex, and many implementations have system-specific quirks and even bugs. Thus, I cannot describe everything you'll need to know to install and use Linux on an EFI computer on this one page. It's my hope that you'll find this page a useful starting point, though, and links within each section and in the References section at the end will point you toward additional documentation. EFI is a type of firmware, meaning that it's software built into the computer to handle low-level tasks. Most importantly, the firmware controls the computer's boot process, which in turn means that EFI-based computers boot differently than do BIOS-based computers. (A partial exception to this rule is described shortly.) This difference can greatly complicate the design of OS installation media, but it has little effect on the day-to-day operation of the computer, once everything is set up and running. Note that most manufacturers use the term "BIOS" to refer to their EFIs. I consider this usage confusing, so I avoid it; in my view, EFIs and BIOSes are two different types of firmware. Note: The EFI that Apple uses on Macs is unusual in many respects. Although much of this page applies to Macs, some details differ, particularly when it comes to setting up EFI boot loaders. This task is best handled from OS X by using the Mac's bless utility, which I don't describe here.'''
year_published = 2025
