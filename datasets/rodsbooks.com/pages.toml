["https://rodsbooks.com/wpfonts/wpfonts-recs.html"]
title = "Font & Printer Recommendations"
full_description = '''First, if you're using WordPerfect 7, you may want to consider an upgrade to WordPerfect 8. In my experience, WordPerfect 8 is substantially more stable than version 7 was (though some others have reported no stability problems with WordPerfect 7). In addition, WordPerfect 8's font installer doesn't pose as many problems in mapping font attributes as does the installer in version 7. On the other hand, to get the font installer benefits, you'll need to purchase the retail version of the program, since the freely-available downloadable version lacks this utility (as well as assorted other features, like the equation editor and drawing module). For most Linux users, the basic choice is one of whether to use a WordPerfect driver that's native to the printer in question or to use a PostScript driver and print via Ghostscript. Which option will work better depends on the specific printer in question, and perhaps on the definition of "better." In the short time I used my Brother HL-660 with WordPerfect for Linux, I used it with its WordPerfect PCL driver for most things. The native driver's output looks as good, on the whole, as the Ghostscript output, but the HL-660 driver produces its output much faster. There are a few subtle differences between the two approaches, mostly relating to apostrophes so far as I've discovered, but I don't think either driver has the edge here. For my Epson Stylus Color 400, on the other hand, I must use the Ghostscript option, since the WordPerfect native Epson Stylus Color driver doesn't work on the ESC 400. If I were using an ESC 1520, I'd probably use Ghostscript as well, since the WordPerfect ESC driver doesn't produce output that looks as good as the Ghostscript-driven output on that printer. I can use a 1200 dpi PostScript driver, a PCL driver, or use PostScript in conjunction with Ghostscript with the HP LaserJet 4000 that's replaced my Brother. Using native PostScript seems to make the most sense for most things; I'm keeping the other two options just in case I run into problems with native PostScript on some document.'''
year_published = 2025
