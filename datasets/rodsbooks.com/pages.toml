["https://rodsbooks.com/efi-programming/efi_services.html"]
title = "Programming for EFI: Using EFI Services"
full_description = '''I'm a technical writer and consultant specializing in Linux technologies. This Web page is provided free of charge and with no annoying outside ads; however, I did take time to prepare it, and Web hosting does cost money. If you find this Web page useful, please consider making a small donation to help keep this site up and running. Thanks! Note: This page is a sub-page of my Programming for EFI document. If a Web search has brought you here, you may want to start at the introductory page. Although libraries such as GNU-EFI and TianoCore EDK 2 provide system calls such as Print(), many EFI features are accessed through a more general interface. Recall from the "Hello, World" program that the efi_main() program received two parameters: The EFI_SYSTEM_TABLE is the key to accessing most of an EFI environment's features. This data structure includes a number of pointers, some of which point to additional data structures that provide access to EFI system calls. In GNU-EFI, the EFI_SYSTEM_TABLE structure is defined in /usr/include/efi/efiapi.h: Some of these variables have obvious meanings, such as FirmwareVendor. The ConIn, ConOut, and StdErr variables point to data structures that in turn contain pointers to functions to handle console I/O. Ultimately, the Print() call used in "Hello, World" relies on these calls, and in fact the program could use a direct call to ConOut->OutputString() instead of to Print(). (This would require wrapping the call, though, as described shortly.) The InitializeLib() call sets up the global ST variable as a quick way to access this data structure. The RuntimeServices variable points to a structure that contains pointers to functions provided by the firmware. These services are available both in the pre-boot environment and after the OS has taken control of the computer. For the most part, these functions handle the system clock, NVRAM variables, and system reset operations. The InitializeLib() call in "Hello, World" sets up the global RT variable as a simpler way to reference SystemTable->RuntimeServices.'''
year_published = 2025
