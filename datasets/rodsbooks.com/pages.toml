["https://rodsbooks.com/efi-bootloaders/refit.html"]
title = "Managing EFI Boot Loaders for Linux: Using rEFIt"
full_description = "This Web page is provided free of charge and with no annoying outside ads; however, I did take time to prepare it, and Web hosting does cost money. If you find this Web page useful, please consider making a small donation to help keep this site up and running. Thanks! This page is part of my Managing EFI Boot Loaders for Linux document. If a Web search has brought you to this page, you may want to start at the beginning. rEFIt is a boot manager, not a boot loader; its sole purpose is to launch other boot loaders. These include other EFI boot loaders that exist on the ESP, EFI boot loaders in a Mac's main partition, and as BIOS-style boot code detected in the disk's MBR and partitions' boot sectors. Before reading further, be aware that rEFIt's author has discontinued the project; it hasn't been updated since 2010, and now bears a notice directing readers to my own project, rEFInd, which is a fork of rEFIt. Although some Mac users might still prefer rEFIt to rEFInd because of better Mac support in terms of installers and ancillary tools, rEFInd has significant improvements, particularly for use on UEFI-based PCs. In fact, rEFIt now has serious deficits on recent versions of macOS because of Apple's use of System Integrity Protection (SIP), which complicates rEFIt installation using macOS. SIP also complicates installation of rEFInd or any other boot loader or boot manager in macOS, but how to work around it is at least documented for rEFInd. A second fork of rEFIt, Clover, is primarily a Hackintosh boot loader—it enables booting macOS on non-Apple hardware. You could use Clover in a non-Hackintosh environment much as rEFIt was intended to be used, but outside of Hackintosh needs, Clover offers few advantages over rEFInd, or even the original rEFIt. Although I've noted more advantages than disadvantages to rEFIt, some of the disadvantages are pretty major, and rEFInd inherits most of rEFIt's advantages, adds more advantages, and removes most of rEFIt's disadvantages. In practice, if you use rEFIt, you're likely to have to use it in conjunction with ELILO, SYSLINUX, GRUB Legacy, or GRUB 2. When used in this way, you'll need to factor in the follow-on boot loader's features, such as whether it can read a kernel from a Linux filesystem. Overall, rEFIt is not a good choice for most modern installations."
