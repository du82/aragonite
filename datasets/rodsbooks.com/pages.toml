["https://rodsbooks.com/efi-bootloaders/syslinux.html"]
title = "Managing EFI Boot Loaders for Linux: Using SYSLINUX"
full_description = "This Web page is provided free of charge and with no annoying outside ads; however, I did take time to prepare it, and Web hosting does cost money. If you find this Web page useful, please consider making a small donation to help keep this site up and running. Thanks! This page is part of my Managing EFI Boot Loaders for Linux document. If a Web search has brought you to this page, you may want to start at the beginning. SYSLINUX is a family of boot loaders for Linux. Often employed as a means to boot Linux installation discs, SYSLINUX can also be used on hard disks. Prior to version 6 (introduced in 2013), it did not include an EFI version; but more recent versions include this support. SYSLINUX is reasonably reliable in my experience, although that experience is limited. As I write (summer, 2018), the latest version is 6.0.3, and has not been updated since 2014, so it's beginning to look like it's been abandoned. SYSLINUX is similar in capabilities to ELILO, but it's easier to create a conventional menu system with SYSLINUX than with ELILO. Overall, I can't recommend SYSLINUX for general use, for much the same reasons I can't recommend ELILO—both are limited and seem to be unsupported. SYSLINUX's principle advantage—easy manual configuration—is shared by other programs, such as gummiboot/systemd-boot and, in a different way, rEFInd. SYSLINUX installation works just as described in EFI Boot Loader Installation. A major caveat is that SYSLINUX requires a number of support files be installed on your ESP, and it may not be obvious what files need to go there. To help simplify things, I've created an x86-64 binary tarball of SYSLINUX 6.03+dfsg-14, based on an Ubuntu Linux package. To use this binary, you should unpack it in your ESP's root directory—that is, normally in /boot/efi or sometimes in /boot. When unpacked, this package creates a directory called EFI/syslinux, which holds the syslinux.efi boot loader binary, syslinux.cfg configuration file, and several support files. Note that the configuration file works on my Ubuntu 16.10 installation with its 4.8.0-58-generic kernel, but will require changes to work on other systems."
