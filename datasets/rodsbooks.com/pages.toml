["https://www.rodsbooks.com/gdisk"]
title = "GPT fdisk Tutorial"
full_description = '''This Web page, and the associated software, is provided free of charge and with no annoying outside ads; however, I did take time to prepare it, and Web hosting does cost money. If you find GPT fdisk or this Web page useful, please consider making a small donation to help keep this site up and running. Thanks! GPT fdisk (consisting of the gdisk, cgdisk, sgdisk, and fixparts programs) is a set of text-mode partitioning tools for Linux, FreeBSD, macOS, and Windows. The gdisk, cgdisk, and sgdisk programs work on Globally Unique Identifier (GUID) Partition Table (GPT) disks, rather than on the older (and once more common) Master Boot Record (MBR) partition tables. The fixparts program repairs certain types of damage to MBR disks and enables changing partition types from primary to logical and vice-versa. You can learn more about fixparts on its dedicated Web page. If gdisk, cgdisk, and sgdisk sound interesting to you, then read on (or skip straight to the "Obtaining GPT fdisk" link if you don't need the GPT pep talk). If you don't know what a GPT is, be sure to read the first section! FreeBSD users: The FreeBSD version of GPT fdisk can't normally save changes to your partition table if any partition from the disk is mounted. If you want to modify your FreeBSD boot disk, the safest way to do so is from an emergency system or from a dual boot to another OS. Alternatively, you can type sysctl kern.geom.debugflags=16 at a shell prompt to enable FreeBSD to write to active disks. This limitation is shared by at least some other FreeBSD partitioning tools, such as gpt and FreeBSD's fdisk. This limitation does not exist in the Linux, macOS, or Windows versions of the software. MacOS 10.11 ("El Capitan") and later users: MacOS 10.11 added a feature called System Integrity Protection (SIP), or less formally, "rootless." This system blocks access to certain critical aspects of the OS and hardware by third-party programs, including GPT fdisk. Thus, GPT fdisk's capabilities are limited under macOS 10.11 or later unless SIP is disabled. Specifically, low-level access to the system disk is forbidden, so you cannot repartition it. Access to USB flash drives remains possible, though. Disabling SIP is covered on several Web sites, including here and here. My rEFInd boot manager can disable SIP, as described here. Alternatively, you can run GPT fdisk from a Linux emergency disk.'''
