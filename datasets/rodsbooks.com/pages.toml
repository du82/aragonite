["https://rodsbooks.com/wpfonts/wpfonts-fonts.html"]
title = "WordPerfect Font Handling"
full_description = '''Actually installing fonts in WordPerfect for Linux isn't very difficult. What can be difficult, especially with WordPerfect 7, is configuring the font mapping so that you can use bold, italic, and bold-italic versions of the fonts you install. To install fonts, you will need to be root. There are two ways to do the installation; either use the shbin10/xwpfi utility, or launch WordPerfect with the -adm switch and then select any of a number of menu sequences to get you into the font installation utility. One such sequence is "Format-> Font" (or hitting the < F9> key) and then pressing the "Install Fonts" button. If you wish to install soft fonts, be sure the printer for which you wish to install them is the current printer before entering the font installation utility. (If you use the xwpfi program instead, you'll be asked to select the printer to which to install the soft fonts). As I've mentioned on the problems page, the version of WordPerfect 8 that's available for download does not include the xwpfi install program. As this program is how the main binary installs fonts, this means that there's no way to install fonts in this free version of WordPerfect, unless you use the xwpfi binary from an earlier version of WordPerfect, or upgrade to a commercial release of WordPerfect 8. Prior to installing fonts, you should copy the font files, or create links to the font files, to the shlib10 directory. WordPerfect requires both .pfb and .afm files to install a Type 1 font. If you're looking for fonts for use with WordPerfect, check the recommendations section, which includes notes about and links to various font sources. Graphics fonts are necessary to display a font on the screen. They can also be used to print to most printers (as far as I know, only daisywheel printers can't use graphics fonts). The printing of graphics fonts is accomplished by WordPerfect rasterizing the font into a bitmap and then either printing the entire page as a huge graphic or by downloading the bitmap font to the printer. In either case, graphics fonts will print at whatever resolution WordPerfect believes the printer can handle.'''
year_published = 2025
