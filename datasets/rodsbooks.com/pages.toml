["https://rodsbooks.com/wpfonts/wpfonts-problems.html"]
title = "Font and Printing Problems"
full_description = '''Following are some of the most important problems I've encountered in trying to figure out the details of fonts and printing under WordPerfect for Linux. I don't claim this list is comprehensive, and I don't present full solutions here -- for that, see the next three sections of this document. The downloadable version of WordPerfect 8.0 for Linux doesn't include the font installation utility, so unless you've got the xwpfi program from a previous version of WordPerfect for Linux, you won't be able to install your own fonts in this version of the program. The personal retail version of WordPerfect 8, though, does include the font installer, and in fact it works better than the installer from WordPerfect 7, so buying this version is definitely the way to go if you want to install lots of third-party fonts. Initial shipments of the personal retail version of WordPerfect 8 were missing the fonts promised on the box. If you've got one of these early shipments, you can contact Corel to have them ship you an updated CD with the fonts. After installing new fonts, it's often the case that WordPerfect 7 will use the wrong font when an attribute (bold or italic, mainly) is selected. This is because the "automatic font change" ("AFC") feature has been set up incorrectly -- whatever algorithm WordPerfect uses to set this up doesn't work as well as it might. Fortunately, it is possible to manually edit the AFC map, so this problem can be worked around. WordPerfect 8 seldom displays this problem. I've found that WordPerfect correctly groups variants of fonts that fall in the same font family when the variants have conventional names -- for instance, if you have fonts that are called FooBar, FooBar italic, FooBar bold, and FooBar bold-italic, they'll likely appear in WordPerfect's font menu as a single item, FooBar. You'll then be able to set the AFC map, if it wasn't set correctly initially, to have the font work as expected. If the font uses different names for its variant forms, such as "oblique" instead of "italic" or "black" instead of "bold," however, you may get multiple font entries. In some cases it's possible to map the fonts correctly for one version to call the others, so you've just got to be careful which font you select.'''
