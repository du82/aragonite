title = "Broadband Internet Connections"
full_description = "My eighth book, Broadband Internet Connections: A User's Guide to DSL and Cable, describes how to get the most out of a high-speed Internet connection. The book begins with a discussion of the technologies involved (DSL, cable, satellite, and so on), proceeds on to hardware and software configuration, and moves on to discussions of running popular servers, sharing a connection among several computers, and broadband security issues. I wrote the book with small businesses and home users in mind, and especially those who want to go beyond merely browsing the Web at high speed. Broadband connections open up a world of possibilities that aren't often explored with dial-up connections, and this book serves as an introduction to these possibilities. Approximate page count: 600. This page exists to provide additional information on the book and links to additional useful information. More information is available on: In the weeks and months to come, I'll update this site with any errata or additional information that may be useful as developments in the broadband world warrant. I am making every attempt to keep these web pages viewable from any web browser. Of course, not all browsers support all features used by these pages, but I've tried to make such items harmless to these browsers. These pages have been checked using weblint, as well as with a variety of browsers. If you encounter a problem accessing these pages from your browser, please notify me."
