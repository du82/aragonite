["https://rodsbooks.com/efi-bootloaders/csm-good-bad-ugly.html"]
title = "Managing EFI Boot Loaders for Linux: CSM: The Good, the Bad, and the Ugly"
full_description = '''This Web page is provided free of charge and with no annoying outside ads; however, I did take time to prepare it, and Web hosting does cost money. If you find this Web page useful, please consider making a small donation to help keep this site up and running. Thanks! This page is part of my Managing EFI Boot Loaders for Linux document. If a Web search has brought you to this page, you may want to start at the beginning. Most modern Extensible Firmware Interfaces (EFIs) and Unified EFIs (UEFIs) include a feature called the Compatibility Support Module (CSM). This feature enables an EFI-based computer to use BIOS-mode boot loaders, much like WINE enables Linux to run Windows binaries. CSM is often activated in the firmware setup utility by enabling a feature called "legacy mode." Thus, three names (BIOS, CSM, and legacy) may refer to the same thing. Although CSM sounds like a wonderful feature, it has some serious drawbacks, as this document explains. If you must use it, you should understand how to make best use of it on your computer. Note: A partial exception to the rule of EFIs being fundamentally different from BIOSes is some early EFIs for x86-64 computers, which were built atop a conventional BIOS. Such implementations generally lack CSMs per se and instead use the BIOS itself for BIOS-mode booting. My one experience with such a system, a Gigabyte Hybrid EFI, left me wishing I'd never encountered it. I strongly recommend avoiding such firmware if at all possible. Before delving into the main points of this page, I'd like to address some common misconceptions. First, an EFI is not a BIOS. Many people (even manufacturers) refer to EFIs as "BIOSes," but this nomenclature encourages thinking of EFIs in BIOS terms, as if an EFI were a simple add-on to a BIOS. An EFI is a fundamentally new type of firmware, though, and if you think of it in BIOS terms, you're likely to apply a lot of BIOS assumptions to EFI that are flat-out wrong. Related to this is the way the CSM interacts with the EFI. The CSM is an add-on EFI feature. Some people refer to "enabling EFI support," but that's exactly backwards—on most EFI-based computers, EFI is the native mode. It's the CSM (aka "legacy mode") that may be optionally enabled. (The sidebar to the right describes an exception to this rule.) When the CSM is enabled, the EFI is still working. In fact, as described in more detail shortly, enabling the CSM does not guarantee a BIOS-mode boot. Note, however, that some EFIs' user interfaces present EFI/UEFI and BIOS/CSM/legacy options as if they were mutually exclusive. In some cases this user interface design is accurate; the EFI might create strict one-mode boot pathways. In other cases, the user interface is deceptive; the selected boot mode is more of a suggestion than a command.'''
year_published = 2025
clearnet = "https://rodsbooks.com/efi-bootloaders/csm-good-bad-ugly.html"
