["https://rodsbooks.com/wpfonts/wpfonts-nonps.html"]
title = "Non-PostScript WordPerfect Printers"
full_description = '''One way to print from WordPerfect for Linux is to use WordPerfect's driver for your specific printer, or for a compatible model. This technique avoids the use of Ghostscript, which is the usual way of printing to non-PostScript printers from Linux. Because Ghostscript rasterizes an entire page and prints it as a large graphic, whereas WordPerfect's drivers can use the printer's built-in fonts or will (when possible) download a font to the printer, printing using the WordPerfect driver may be faster than printing via a PostScript driver through Ghostscript. Printing via a WordPerfect driver may or may not produce results that are as good as printing via Ghostscript, however. You'll have to try both ways with your specific printer to be sure. Setting up a Linux printer queue for printing via a WordPerfect driver means that you must have some way to pass "raw" data through to the printer. Depending upon your distribution and how you've configured your printer, you may or may not currently be able to do this. If not, adding an /etc/printcap entry for the task isn't too difficult. Here's what I use on my system: This sets up a printer queue called "pcl" that sends the data through unchanged. It's also necessary to create the spool directory (/var/spool/lpd/pcl in the above). I actually created this entry by using the Red Hat 5.0 printtool utility and creating a printer without specifying the printer type. I then modified the /etc/printcap entry by adding the ":sf:\" line, since on my Brother HL-660, WordPerfect was spewing an extra sheet of paper after every print job, and the ":sf:\" line prevents that. (This line also keeps the system from ejecting the last page of print jobs that originate from most programs except WordPerfect, but this isn't a big deal to me since I seldom use this queue except from WordPerfect.) Adding the ":sf:\" line may or may not be necessary, depending upon your printer and how your print queue is configured. Some "magic filters" may automatically detect PCL (or whatever) code and send it through unchanged, so setting up a separate print queue may or may not be necessary. In addition to utilities like Red Hat's printtool that come with specific Linux distributions, WordPerfect itself has a tool for configuring print queues. It's called xwpdest, and is in the shbin10 directory in the WordPerfect distribution. I've never tried using this, though, and so can't comment on how well it works.'''
year_published = 2025
clearnet = "https://rodsbooks.com/wpfonts/wpfonts-nonps.html"
