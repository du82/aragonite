["http://www.rodsbooks.com/refind/getting.html"]
title = "The rEFInd Boot Manager: Getting rEFInd"
full_description = "This Web page is provided free of charge and with no annoying outside ads; however, I did take time to prepare it, and Web hosting does cost money. If you find this Web page useful, please consider making a small donation to help keep this site up and running. Thanks! This page is part of the documentation for the rEFInd boot manager. If a Web search has brought you here, you may want to start at the main page. Note: I consider rEFInd to be beta-quality software! I'm discovering bugs (old and new) and fixing them every few days. That said, rEFInd is a usable program in its current form on many systems. If you have problems, feel free to drop me a line. You can find the rEFInd source code and binary packages at its SourceForge page. Note that rEFInd is OS-independent—it runs before the OS, so you can download the same binary package for any OS (although some OS-specific packages are also available, for ease of installation). You can obtain rEFInd in several different forms: Note: At the moment, neither the bootable CD-R image file nor the bootable USB flash drive image file supports booting with Secure Boot active. The x86-64 version of the ALT Linux Rescue disc uses a Secure Boot-enabled rEFInd, though, so you may find that useful in some situations. Tip: If you want to make your own bootable USB flash drive, download the binary zip file or CD-R image file, prepare a USB flash drive with a FAT32 partition, and then use the refind-install program's --usedefault option, and perhaps the --alldrivers option, as in bash refind-install --usedefault /dev/sdd1 --alldrivers to install to the first partition on /dev/sdd. This procedure should work even on a BIOS-booted computer. If you're using a platform other than x86, x86-64, or ARM64, you can give rEFInd a try; however, you'll need to build it from source code yourself or track down a binary from another source. (Perhaps by the time you read this it will be included in Linux distributions built for unusual CPUs.) To extract the files from the zip file images I've provided, you'll need a tool such as unzip, which is included with Linux and Mac OS X. Numerous Windows utilities also support this format, such as PKZIP and 7-Zip. The source files come in tarball format, for which a tool such as the Unix/Linux tar utility is appropriate."
