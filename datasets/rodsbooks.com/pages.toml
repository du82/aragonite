["https://rodsbooks.com/books/books-network.html"]
title = "Books about Linux Networking"
full_description = '''This page exists to list books about Linux networking. I've written two such books, but the topic of Linux networking is broad enough that you may need something other than or in addition to my book, so I list several possibilities on this page. In addition to this page, I've devoted a separate page to Samba, the file and print server package. (One of my Linux networking books is about Samba.) My ninth book, Advanced Linux Networking, is a general-purpose Linux networking book, but its focus is unique: This book covers advanced topics and those that don't get much coverage in typical Linux networking books. For instance, the chapter on Samba includes information on using Samba's scripting features to set up a network-accessible CD-burning station, and there are chapters on time servers, font servers, and other often-overlooked servers. This book is of interest to professional system administrators or advanced Linux hobbyists who want a compact reference and tutorial to help them expand their Linux networking expertise. I maintain a separate Web page on this book. Page count: 752. This book has been reviewed by Michael J. Jordan on Linux Online. He writes "if you want to take advantage of Linux's strengths in a networked environment, this is the book for you. I highly recommend it." My eighth book, Broadband Internet Connections: A User's Guide to DSL and Cable, describes how to get the most out of a high-speed Internet connection. The book begins with a discussion of the technologies involved (DSL, cable, satellite, and so on), proceeds on to hardware and software configuration, and moves on to discussions of running popular servers, sharing a connection among several computers, and broadband security issues. I wrote the book with small businesses and home users in mind, and especially those who want to go beyond merely browsing the Web at high speed. Broadband connections open up a world of possibilities that aren't often explored with dial-up connections, and this book serves as an introduction to these possibilities. It's not strictly a Linux book, but includes Linux coverage along with information on configuring Windows and MacOS systems for boradband. I maintain a separate Web page on this book. Approximate page count: 600.'''
year_published = 2025
clearnet = "https://rodsbooks.com/books/books-network.html"
