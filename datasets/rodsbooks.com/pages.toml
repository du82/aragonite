["http://www.rodsbooks.com/network"]
title = "Linux: Networking for Your Office"
full_description = "My second Linux book, Linux: Networking for Your Office (hereafter L:NfYO), ISBN 0672317923, is published by Sams and is available now. You can order it at Fatbrain.com, Amazon.com, or you can read more about it and other books you might find interesting. L:NfYO covers many of the small office/home office (SOHO) networking tasks at which Linux has proven its worth. The book's main focus is on file and printer sharing using NFS, lpd, Samba, and Netatalk. Additional topics include IP masquerading, PPP connections, and security. Although it's marketed towards businesses, L:NfYO covers the topics you're most likely to want covered when setting up a small home network with Linux at its centerpiece, so home users shouldn't be scared off by the title. The book also includes a CD with Red Hat Linux 6.0, Linux networking utilities, and networking tools for both Windows and MacOS. The tools on this CD will help you build an intranet around your Linux server. Note that, although the book comes with Red Hat Linux, L:NfYO will be helpful to you even if you run another Linux distribution. Although I describe how to perform some tasks using Red Hat's linuxconf tool, I always provide alternative methods to perform those tasks that can be used with other distributions. The Linux world moves quickly, so aspects of my book which were accurate and complete at the time I wrote them have become inaccurate or incomplete, even by the book's release date. There may also be a few outright errors lurking in the text, although I've made every attempt to spot these before publication. This is where you'll find information on both types of item. I am making every attempt to keep these web pages viewable from any web browser. Of course, not all browsers support all features used by these pages, but I've tried to make such items harmless to these browsers. These pages have been checked using weblint, as well as with a variety of browsers. If you encounter a problem accessing these pages from your browser, please notify me."
