["http://www.rodsbooks.com/books"]
title = "Rod Smith's Books Page"
full_description = "This page exists to help you order my books. The following books are listed in reverse chronological order. I've been writing books about computers since 1999, so some of these titles are decidedly out of date. Even some of these still produce an occasional e-mail from a reader, though! I used to reference a bunch of additional titles here in one list, but it's become a bit awkward, so I'm splitting my additional recommendations off into sub-pages by topic. The CompTIA Linux+ Study Guide: 2009 Exam is a textbook designed to help candidates pass the Linux+ exam by CompTIA. This exam is an entry-level Linux certification, so the book is an entry-level text on Linux use and administration. In addition to helping you pass the Linux+ exam, the book should prove to be a useful reference for many general Linux tasks. I also maintain a separate Web page on this book. The 4th edition, which covers the 2009 version of the exam, is due out in October of 2009. Earlier editions of the book cover earlier versions of the Linux+ exam. Approximate page count: 587 (4th edition); 539 (3rd edition). The LPIC-1 Linux+ Study Guide is a textbook designed to help candidates pass the Linux Professional Institute's level 1 (101 and 102) certification exam. This exam is an entry-level Linux certification, so the book is an entry-level text on Linux use and administration. In addition to helping you pass the Linux+ exam, the book should prove to be a useful reference for many general Linux tasks. I also maintain a separate Web page on this book. The 2nd edition covers the 2009 version of the exam. The first edition of the book covered an earlier version of the LPIC-1 exam. Approximate page count: 544 (2nd edition); 580 (1st edition). Linux Administrator Street Smarts is a textbook that's intended to supplement either a generic Linux system administration title or a certification-specific title, such as my LPIC-1 or Linux+ titles. This book emphasizes hands-on exercises to help you learn the skills you'll need as a Linux system administrator, but it's not geared to any specific exam, so you should definitely study with the objectives of any exam you plan to take in mind. I also maintain a separate Web page on this book. Approximate page count: 323."
