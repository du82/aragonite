["https://rodsbooks.com/efi-bootloaders/grub2.html"]
title = "Managing EFI Boot Loaders for Linux: Using GRUB 2"
full_description = "This Web page is provided free of charge and with no annoying outside ads; however, I did take time to prepare it, and Web hosting does cost money. If you find this Web page useful, please consider making a small donation to help keep this site up and running. Thanks! This page is part of my Managing EFI Boot Loaders for Linux document. If a Web search has brought you to this page, you may want to start at the beginning. The GRand Unified Bootloader (GRUB) is actually two boot loaders. This page describes GRUB 2, which is the current version of the boot loader. The previous page, Using GRUB Legacy, describes the previous (and now discontinued) version of the boot loader. Note: GRUB 2 is by far the most complex boot loader described in these pages. Therefore, if you have problems with GRUB 2, I strongly recommend that you locate additional documentation, such as the Ubuntu UEFIBooting page (despite its hosting on an Ubuntu site, it applies to all distributions) or the official GRUB 2 documentation. Note that the first link is to older documentation that provides in-depth low-level configuration details. The newer documentation referenced on that site is more Ubuntu-specific and provides less help on doing low-level configuration tasks. GRUB 2 is the default EFI-mode boot loader for many distributions, including current releases of Ubuntu, OpenSUSE, and Fedora. Therefore, GRUB 2 is usually easy to install and use from such distributions. If you install Linux in EFI mode and if the OS installer configures GRUB 2 properly, it is likely to work adequately. Its biggest flaw is that its support scripts tend to get hung up on complex configurations—for instance, when you install multiple Linux distributions on one computer. In general, I prefer to use the kernel's EFI stub loader in conjunction with an EFI boot manager (typically my own rEFInd) on such computers. GRUB 2 installation works just as described in EFI Boot Loader Installation. It can be installed in any of three ways, depending on the way in which the program was compiled:"
year_published = 2025
clearnet = "https://rodsbooks.com/efi-bootloaders/grub2.html"
