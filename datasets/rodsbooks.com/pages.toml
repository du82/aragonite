["https://rodsbooks.com/efi-bootloaders/index.html"]
title = "Managing EFI Boot Loaders for Linux"
full_description = "This Web page is provided free of charge and with no annoying outside ads; however, I did take time to prepare it, and Web hosting does cost money. If you find this Web page useful, please consider making a small donation to help keep this site up and running. Thanks! Most computers today boot using Extensible Firmware Interface (EFI) firmware, or its version-2.x variant, Unified EFI (UEFI). The way EFI computers boot is very different from the way older computers based on the Basic Input/Output System (BIOS) boot. This fact is both positive and negative. On the plus side, the EFI boot method is much more flexible and, in theory, easier to configure than is the BIOS boot method. On the minus side, EFI skills and documentation still lags BIOS skills and documentation, so people experienced in the BIOS method of booting often make mistakes when dealing with newer EFI-based computers. Even EFI support in Linux distributions continues to be a source of occasional problems, particularly with respect to obscure or unusual situations. I've written this set of Web pages with the goal of explaining some of the basics of the EFI boot methods, most notably including how to install and manage EFI boot loaders. This document is broken into a number of sections, as detailed below. Recommendations: GRUB 2 is the default EFI boot loader for most Linux distributions and is therefore an easy choice for most users; however, if you're reading this page, chances are you're dissatisfied with GRUB 2. In this case, I recommend you look into rEFInd if you want something with more graphical pizzazz that's easy to maintain; or gummiboot/systemd-boot if you want something lean that uses simple manual configuration files. Both of these tools are boot managers, rather than boot loaders; although you may not need to be too concerned with the details, these programs rely on the EFI stub loader behind the scenes. Although ELILO, SYSLINUX, and GRUB Legacy all continue to work today, they all have serious limitations compared to these other programs. ELILO and GRUB Legacy are no longer being developed, and SYSLINUX may be in this category, as well. rEFIt is the out-of-development predecessor to rEFInd and is more limited than rEFInd in most respects."
