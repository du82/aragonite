["http://www.rodsbooks.com/samba3"]
title = "The Definitive Guide to Samba 3"
full_description = "My twelfth book, The Definitive Guide to Samba 3, is, as you might guess, a book on version 3.0 of Samba. Unlike my previous Samba book, Linux Samba Server Administration, which covers Samba 2.0, this new book describes Samba and its operation on multiple OSs, including Linux, FreeBSD, MacOS X, and others. It includes coverage of Samba 3.0's new features, such as the ability to migrate a domain from a Windows NT domain controller and the new net utility. I maintain a separate Web page on this book. Approximate page count: 600. Here is a page with some information and support scripts on using the Samba wins hook parameter. I wrote it to support the book when it appeared that the script wasn't going to ship with Samba 3.0, but it was added back at the last minute. The book's readers probably don't need it, but it was already written, so what the heck.... I am making every attempt to keep these web pages viewable from any web browser. Of course, not all browsers support all features used by these pages, but I've tried to make such items harmless to these browsers. These pages have been checked using weblint, as well as with a variety of browsers. If you encounter a problem accessing these pages from your browser, please notify me."
