["https://rodsbooks.com/secure-boot/index.html"]
title = "UEFI Secure Boot and Your Computer"
full_description = '''On September 20, 2011, Matthew Garrett, a developer for Red Hat, made a blog post. In it, he pointed out that a new computer feature might pose the risk of limiting users' ability to install and use the OSes they choose to use on their own computers. This new feature, secure boot, is intended as a security measure: For years, some types of computer malware has inserted itself into the computer's boot process, which enables it to hide even from the OS itself. Secure boot is intended to block such nastiness by requiring that key OS files, as well as software components of plug-in cards, be digitally "signed" before the computer will run them. Malware authors would (presumably) be unable to sign their software, and so it wouldn't run. This sounds like a good feature, but there's a catch: The way secure boot works requires keys to be stored on a chip in the computer's motherboard, and there's no centralized way to add or remove such keys. This means that computer manufacturers will have control over whose software can run on the computers that they manufacture. Microsoft, of course, will always have its keys embedded in PC makers' computers, simply because of its market dominance. What's more, Microsoft is requiring that manufacturers include the secure boot feature, and ship client computers with this feature enabled, in order to attain the right to use a Windows 8 logo on future computers. (Windows 8 is expected to be released sometime in 2012.) Thus, some have accused Microsoft of pushing secure boot as a way of stifling what little competition it has. Whether or not there's truth to this claim, the fact is that a restrictive implementation of secure boot could artificially limit what you, the owner of a PC, can do with it. Smaller software vendors and open source OS projects such as Linux and FreeBSD don't have Microsoft's clout, and so their keys are unlikely to be included with many PCs. A locked-in secure boot is also likely to cause problems for the manufacturers of plug-in devices, such as video cards, network adapter cards, and so on. Such products often rely on firmware (software embedded in the hardware) to work, and such firmware must be signed in order for a secure boot system to use the plug-in devices. Such vendors would need to negotiate with dozens, if not hundreds, of PC manufacturers to get their keys included on shipping computers. For some, this obstacle is an impossible burden.'''
year_published = 2025
clearnet = "https://rodsbooks.com/secure-boot/index.html"
