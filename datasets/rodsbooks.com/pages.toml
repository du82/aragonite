["http://www.rodsbooks.com/efi-bootloaders/grub_legacy.html"]
title = "Managing EFI Boot Loaders for Linux: Using GRUB Legacy"
full_description = "This Web page is provided free of charge and with no annoying outside ads; however, I did take time to prepare it, and Web hosting does cost money. If you find this Web page useful, please consider making a small donation to help keep this site up and running. Thanks! This page is part of my Managing EFI Boot Loaders for Linux document. If a Web search has brought you to this page, you may want to start at the beginning. The GRand Unified Bootloader (GRUB) is actually two boot loaders. This page describes GRUB Legacy, which is the first, and now officially discontinued, version of the boot loader. The next page, Using GRUB 2, describes the current version of the boot loader. The official version of GRUB Legacy doesn't support EFI booting; however, through version 17, Fedora used a greatly modified version that includes EFI support. This page therefore describes this variant of GRUB Legacy. GRUB Legacy is, in some respects, a step up from ELILO and SYSLINUX, in that it provides some valuable extra features. It has, however, been discontinued in favor of GRUB 2. As a general rule, GRUB Legacy proved reliable to me; however, I have not used it since 2013 or thereabouts. I have encountered significant system-to-system differences in how well it has worked. Specifically: Because Fedora's version of GRUB Legacy is so heavily modified, installing it on other distributions can be a challenge. I provide links to both RPMs and tarballs below to help overcome this problem. Overall, in 2018 GRUB Legacy is probably best left unused, and this page should be considered mainly of historical interest. Its main advantage at this point is that it's a simple boot loader that can both chainload to other EFI boot programs and load a Linux kernel from a supported Linux-native filesystem. Neither ELILO nor SYSLINUX can do these things; and although GRUB 2 can do them, it's much more complex to set up if you must do so manually. GRUB Legacy installation works just as described in EFI Boot Loader Installation. If you're using a Fedora 17 or earlier system, GRUB Legacy should have been automatically installed for you, so you might not need to do anything else. (Fedora 18 has switched to GRUB 2 for EFI-mode booting.) If you're not using a Fedora system, here are links to some relevant package files from Fedora 17:"
