["https://www.rodsbooks.com/robo3d-upgrade"]
title = "Upgrading a Robo3D R1+ Mainboard"
full_description = "This Web page is provided free of charge and with no annoying outside ads; however, I did take time to prepare it, and Web hosting does cost money. If you find this Web page useful, please consider making a small donation to help keep this site up and running. Thanks! This page documents my experiences upgrading the control board on a Robo3D R1+ 3D printer from its original 8-bit board running Marlin to a new 32-bit board running RepRapFirmware. This now-discontinued printer is a fairly typical Cartesian i3-style printer. If you don't know what any of this means, chances are this page isn't for you. If you do understand it, though, and if you're interested in improving the functionality of your Robo3D R1+ (or of another 3D printer), then read on! Note that installing a new motherboard in a 3D printer requires familiarity with handling electronics, possibly including crimping new connectors, soldering, and using a multi-meter. You don't need to be a master at any of these things, but you'll likely have to do more than unplug wires from the old board and plug them into the new one. In addition, my project involved installing a bleeding-edge firmware build of a type that's not officially supported by the new board's manufacturer. Finally, I installed a new LCD control panel, again replacing the firmware with an unsupported community-developed branch. You should undertake such a project only if you're comfortable with these tasks, or are willing to learn (and possibly do damage to your printer in the process). Scaling back the project to avoid tasks that give you pause is possible; use your own judgment about how much to undertake. In late 2017, I purchased my first 3D printer: a Robo3D R1+. (Figure 1 shows this printer after my upgrades.) At the time, I found the printer to be frustrating and unreliable; however, I was fascinated by the technology, and I went on to build an entirely different 3D printer (a Kossel XL delta printer design). Three years after buying the Robo3D, I decided to begin upgrading it to make it more reliable and more versatile."
