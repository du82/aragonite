["https://rodsbooks.com/bios2uefi/index.html"]
title = "A BIOS to UEFI Transformation"
full_description = "I'm a technical writer and consultant specializing in Linux technologies. This Web page is provided free of charge and with no annoying outside ads; however, I did take time to prepare it, and Web hosting does cost money. If you find this Web page useful, please consider making a small donation to help keep this site up and running. Thanks! You've heard of the Extensible Firmware Interface (EFI) and the Unified EFI (UEFI), and you're curious. Perhaps you're even desperate: You know that UEFI is the key to booting Windows on a disk larger than 2 TiB, but your computer uses the old-style Basic Input/Output System (BIOS). Perhaps you're in-between: You're fed up with the Master Boot Record (MBR) partitioning system, but you can't get Windows to boot from a new GUID Partition Table (GPT) disk on your BIOS-based computer. In any of these cases, you may be interested in exploring a way to turn a BIOS-based computer into one that at least seems like it's built atop UEFI. This article outlines how to do this, beginning with some background information, steps needed to set up the software, using the software, and some final words about problems and possible workarounds to them. Be aware that the tools and techniques I describe on this Web page are highly experimental. The software might not work at all; in fact, it could endanger your data! The software works more reliably on Intel CPUs than on AMD models. If you do get it working, it's likely to be at the cost of some hairs pulled from your head. It won't work as well as a real UEFI-based computer, so if you've got the cash, you're better off upgrading your computer if you really need UEFI. If it sounds like I'm trying to scare you off, to a certain extent you're right. Following the advice on this page is not for most people. If you're technically inclined, sufficiently motivated, and up for an adventure, though, read on! One final caveat: I'm a Linux person, and some of the preparatory tools described here are built around Linux. If you don't know Linux, you can still proceed, either finding other ways to do things or using Linux on an optical disc or USB flash drive (I offer some specific recommendations later)."
