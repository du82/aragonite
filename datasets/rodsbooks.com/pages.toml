["http://www.rodsbooks.com/samba"]
title = "Linux Samba Server Administration"
full_description = '''My fifth book, Linux Samba Server Administration (part of the Craig Hunt Linux Library from Sybex), describes Samba, the file and print server package for Linux and other UNIXes. This package allows Linux/UNIX to serve files and printers using the SMB/CIFS protocols that are most frequently used by Windows computers, but also by others (including OS/2 and DOS). This book covers all the major Samba configuration parameters, and keeps an eye on the fact that Samba isn't an isolated program -- it interacts with other programs and servers running on the same computer, not to mention other computers on the network. The book is structured so that the first few chapters should be all you need to get a basic Samba server up and running, while subsequent chapters cover the topics you'll need in dealing with a more sophisticated setup or in maintaining a system over the long haul. Page count: 600. A review by Matt Franz in the February, 2001 issue of Cisco's Security Bytes Newsletter called this "simply the best book on the Samba in print" and went on to say that "it should be required reading for any UNIX admins who must deal with Windows boxes on a regular basis." Chapter 14 of this book, "Samba Security Considerations," has been excerpted in Sybex's Security Complete, which you can buy from Fatbrain or Amazon. Chapters 1-5 have been excerpted in Sybex's Linux Complete, 2nd Edition, again available from Fatbrain or Amazon. These excerpts include some updated information on more recent versions of Samba than were available when Linux Samba Server Administration was written. This book is part of a series from Sybex on Linux topics, and follows the same overall structure as others in the series. (I've co-authored one other book in the series, Linux System Administration. I've got some information on it on my introductory Linux books page.) Here's a list of the book's chapters: In the weeks and months to come, I'll update this site with any errata or additional information that may be useful as developments in the Samba world warrant.'''
