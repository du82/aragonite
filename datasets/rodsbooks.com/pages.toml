["https://rodsbooks.com/efi-programming/prepare.html"]
title = "Programming for EFI: Preparing a Development Environment"
full_description = "I'm a technical writer and consultant specializing in Linux technologies. This Web page is provided free of charge and with no annoying outside ads; however, I did take time to prepare it, and Web hosting does cost money. If you find this Web page useful, please consider making a small donation to help keep this site up and running. Thanks! Note: This page is a sub-page of my Programming for EFI document. If a Web search has brought you here, you may want to start at the introductory page. To write an EFI program, you must install suitable development tools. As of mid-2013, two such tools are widely available and under active development: Note: It's often possible to add interfaces from the TianoCore source code to a program that compiles under GNU-EFI. Finding the appropriate code in the TianoCore source tree can be a challenge, though! You'll also need to adapt the code to GNU-EFI conventions. Because of the complexity and strangeness (to a Linux programmer's eyes) of the TianoCore EDK II, I've chosen to use the GNU-EFI toolkit as the reference for these Web pages. The TianoCore toolkit may be preferable for some purposes, though, such as if you need to access certain advanced or very new EFI features, which the GNU-EFI toolkit supports poorly or not at all. As you'll learn, GNU-EFI also requires awkward wrapping of certain function calls. If it were easier to install and use under Linux, I would recommend TianoCore EDK II over GNU-EFI; but for a Linux programmer just starting out with EFI programming, GNU-EFI gets the nod because of its lower barrier to entry. If you're using a recent Linux distribution, chances are you can install GNU-EFI by using your package system to install a package called, appropriately enough, gnu-efi. If you're using a distribution from before 2013, though, beware: Many distributions allowed their GNU-EFI packages to become hopelessly out of date by mid-to-late 2012. As I write, the current version of GNU-EFI is 3.0t. (GNU-EFI version numbers have been stable at 3.0 for years, with the following digit denoting improvements.) Changes with recent versions are critical for enabling some features to work, as well as to enable signing an EFI application with a Secure Boot key. Unfortunately, versions 3.0s and 3.0t often produce binaries that hang when launched. According to a GNU-EFI bug report, this problem can be overcome by adding the -DGNU_EFI_USE_MS_ABI compiler flag, but this hasn't worked for me. Thus, if you run into problems, I recommend downgrading to version 3.0r."
year_published = 2025
clearnet = "https://rodsbooks.com/efi-programming/prepare.html"
tags = ["development", "efi:preparing", "environment", "gnu-efi", "note:", "programming", "tianocore"]
