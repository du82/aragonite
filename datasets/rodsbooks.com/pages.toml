title = "PostScript Font Installation"
full_description = '''I'll refer to this as a "PostScript installation" because it tells ApplixWare to use the PostScript Type 1 font files a bit more directly than does the FontTastic installation. I use this name despite the fact that much of what I describe here also applies to TrueType fonts installed with the help of a TrueType font server such as xfsft. This method is more of a pain than the FontTastic method, and it has its own problems, but it also has its advantages. Note that this involves editing (at least) three files with similar names in different directories: fonts.dir, fontmap.dir, and Fontmap. I describe what each is, but be sure to keep them straight. To do this type of installation, do the following: Whether or not to include a Type1FontFileName entry is up to you. If you do include it, that'll make your PostScript files larger, but they'll be more portable (in case you want to create a printout file on one machine and print it elsewhere) -- but distributing the fonts in this form in a PostScript file may violate the copyright on the font, so I don't recommend doing this with any file you might want to make broadly available. The fonts.dir and Fontmap entries for a set of fonts can be generated automatically by a handy utility called type1inst. (Sorry, I don't recall any more where I found it -- try a web search, or browse a Linux archive site like sunsite.) This certainly does help a lot in adding many fonts. I've found that with some fonts, though, it creates bizarre entries -- for instance, an entry with no font name in the fonts.dir file for a font called Benquad from an Expert Software CD. In fairness to type1inst, I suspect this is because of malformed information in the font itself, though the font works fine when I manually edit the relevant file(s). As an example of this procedure as a whole, consider the entries I've created for News 701 Italic, a font from a Bitstream CD. First, here's the fonts.dir file entry for this font: Note that the font name ("news 701") includes a space. There's also a fonts.scale file in the same directory with the same information. I'm not an X fonts expert, but I get the impression that X uses the fonts.dir file for display purposes, but fonts.scale is used to generate the fonts.dir file, so that's the one that's important. It wouldn't hurt to create both files, though. My Ghostscript Fontmap entry for this font is also just one line:'''
