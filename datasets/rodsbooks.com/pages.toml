["http://www.rodsbooks.com/refind/installing.html"]
title = "The rEFInd Boot Manager: Installing and Uninstalling rEFInd"
full_description = '''This Web page is provided free of charge and with no annoying outside ads; however, I did take time to prepare it, and Web hosting does cost money. If you find this Web page useful, please consider making a small donation to help keep this site up and running. Thanks! This page is part of the documentation for the rEFInd boot manager. If a Web search has brought you here, you may want to start at the main page. Don't be scared by the length of this page! Only portions of this page apply to any given user, and most people can install rEFInd from an RPM or Debian package in a matter of seconds or by using the refind-install script in minute or two. Once you've obtained a rEFInd binary file, as described on the preceding page, you must install it to your computer's EFI System Partition (ESP) (or conceivably to some other location). The details of how you do this depend on your OS and your computer (UEFI-based PC vs. Macintosh). The upcoming sections provide details. See the Contents sidebar to the left for links to specific installation procedures. For most Linux users, an RPM or Debian package is the best way to go. If your Linux system doesn't support these formats, though, or if you're running macOS, using the refind-install script can be a good way to go. If you're using Windows, you'll have to install manually. Important: A rEFInd zip file, when uncompressed, creates a directory called refind-version, where version is the version number. This directory includes a subdirectory called refind that holds the rEFInd binary along with another that holds documentation, as well as miscellaneous files in refind-version itself. When I refer to "the refind directory" on this page, I mean the directory with that precise name, not the refind-version directory that is its parent. Note: As of version 10.12 ("Sierra"), Apple has renamed its OS X OS to macOS. I now use "macOS" to refer to any version of this OS. Every time Apple upgrades macOS, I see reports of problems. These are generally caused by a boot coup, as described on this page of the rEFInd documentation, Version 0.12.0 of rEFInd had a bug that caused it to hang with some Apple EFIs, though, and as Apple often upgrades Macs' EFIs as part of the OS upgrade, this bug caused problems for some users after upgrading macOS. The best solution is to upgrade rEFInd to the latest version. Apple has also changed its boot loader location from time to time, which has required changes to rEFInd; and in late 2020, the introduction of ARM-based Macs is causing a splash, but as of early 2021, I know of no other OS that properly supports these computers, so multi-booting them is definitely a "bleeding edge" activity.'''
