["https://rodsbooks.com/ubuntu-efi/index.html"]
title = "EFI-Booting Ubuntu on a Mac"
full_description = "I'm a technical writer and consultant specializing in Linux technologies. This Web page is provided free of charge and with no annoying outside ads; however, I did take time to prepare it, and Web hosting does cost money. If you find this Web page useful, please consider making a small donation to help keep this site up and running. Thanks! Note: This page is written using a rather elderly 32-bit Mac Mini as a reference, and using Ubuntu 12.04 as a reference. Developments in the last year have rendered certain of the procedures on this page sub-optimal. I've tried to point these out, but I haven't fully researched better replacements, and I lack the modern hardware on which to test some of the better methods on more recent 64-bit Macs. Thus, you may need to deviate from these instructions on modern computers. When installing Ubuntu Linux on an Intel-based Macintosh, most people follow any of several guides available on the Internet, such as this Ubuntu document. Most of these guides, however, rely on features of the Macintosh that are intended to enable it to boot Windows. In particular, these guides typically end up creating a configuration that boots Linux using its Compatibility Support Module (CSM), which provides BIOS emulation on the Mac. In this mode, the Mac sets up a Basic Input Output System (BIOS) layer that the OS can use, rather than rely on the Extensible Firmware Interface (EFI) that OS X uses to run on the computer. BIOS emulation is expedient, and it's the only way that most versions of Windows can boot directly on a Mac, but it's got several drawbacks: As far as I can tell, BIOS emulation mode only works when a hybrid MBR is present on the hard disk or when a BIOS-bootable optical disk is inserted in the optical drive. Thus, you can't use BIOS emulation mode with a conventional GPT disk unless you plan to use a bootable optical disc to boot Linux. Ubuntu can use the BIOS emulation and hybrid MBR that enable Windows to boot on Macs, but it doesn't need to! If you don't use these features, you won't see their problems. Hybrid MBRs, in particular, are a Bad Idea (with a capital B and a capital I). I've seen numerous problems reported at the Ubuntu Forums related to Ubuntu installations on Macs with hybrid MBRs, and more problems with similar configurations elsewhere. See my hybrid MBR Web page for a technical description of what they are and what can go wrong with them. In short, they can get out of sync, cause confusion about which partition is which, and become damaged in frustrating ways. Whenever I think I've heard of every possible problem with hybrid MBRs, I stumble across a new one. You're better off without one, if that's possible—and it is, if you dual-boot OS X and Linux but not Windows."
