["http://www.rodsbooks.com/refind"]
title = "The rEFInd Boot Manager"
full_description = '''This Web page is provided free of charge and with no annoying outside ads; however, I did take time to prepare it, and Web hosting does cost money. If you find this Web page useful, please consider making a small donation to help keep this site up and running. Thanks! Note: I've seen reports that rEFInd is failing to boot macOS 11 ("Big Sur"). There seem to be two problems. First, and confusingly, macOS 11 requires booting via the boot loader Preboot partition, not the main macOS installation partition. With recent versions of macOS, rEFInd normally presents both options, but users might reasonably hide the poorly-named Preboot option, which is the only one that works. Second, a bug in rEFInd 0.12.0's memory management could cause it to hang on some EFIs, including some that Apple rolled out as part of the macOS 11 upgrade. Using rEFInd 0.13.0 and booting via the Preboot loader option should work around these problems. If all else fails, the new (rEFInd 0.13.0) feature to boot via an EFI firmware boot option may help; see the description of this feature here. This page describes rEFInd, my fork of the rEFIt boot manager for computers based on the Extensible Firmware Interface (EFI) and Unified EFI (UEFI). Like rEFIt, rEFInd is a boot manager, meaning that it presents a menu of options to the user when the computer first starts up, as shown below. rEFInd is not a boot loader, which is a program that loads an OS kernel and hands off control to it. Many popular boot managers, such as the Grand Unified Bootloader (GRUB), are also boot loaders, which can blur the distinction in many users' minds. All EFI-capable OSes include boot loaders, so this limitation isn't a problem. If you're using Linux, you should be aware that several EFI boot loaders are available, so choosing between them can be a challenge. In fact, since version 3.3.0, the Linux kernel can function as an EFI boot loader for itself, which gives rEFInd characteristics similar to a boot loader for Linux. See my Web page on this topic for more information.'''
