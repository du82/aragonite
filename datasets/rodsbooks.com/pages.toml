["https://rodsbooks.com/books/books-linintro.html"]
title = "General Books on Linux"
full_description = "This page exists to list books about Linux. I've written other books about Linux, and have co-authored one introductory title. That said, I'm not familiar with most of the current introductory Linux titles, although I've read earlier versions of several, and have at least looked through some on bookstore shelves. Most of these recommendations are therefore based on discussions I've seen about the books on Usenet newsgroups. Linux Power Tools is a guide to Linux for intermediate to advanced users. Instead of spending time on basic topics such as system installation and using basic X features, the book emphasizes issues that involve advanced or tricky configuration, such as network-based scanning with SANE, using Xft fonts, resizing filesystems, and using NTP to synchronize time between systems. This book can help you get the most out of a Linux system, but you should have at least a basic grounding in using the OS first. Because the Linux world is so diverse, this book provides explicit coverage of five popular distributions: Debian, Mandrake, Red Hat, Slackware, and SuSE. (Some online retailers incorrectly state that the book covers UnitedLinux.) Estimated age count: 650. This book should be available in late June, 2003. I wrote Linux System Administration, part of Sybex's Craig Hunt Linux Library, in conjunction with Vicki Stanfield. This is a book on Linux fundamentals. It can be used as an introduction to Linux for those unfamiliar with the OS, or as a reference for experienced administrators. The target audience of this book is computer professionals -- people who want to learn Linux because it's required in their jobs, rather than casual home users. Of course, home users can also get a lot out of this book, but it doesn't cover the sort of material many individual Linux users need, like rundowns of Linux productivity applications. This book includes chapters on installation, startup and shutdown procedures, account maintenance, security, software administration, Linux filesystems, backups, printing, networking, the X Window System, and troubleshooting, among others. In 2002, a second edition of the book became available. You can still find the first edition, if for some reason you want the older version. Page count: 624."
