["http://www.rodsbooks.com/multiboot"]
title = "The Multi-Boot Configuration Handbook"
full_description = "My third book, The Multi-Boot Configuration Handbook, covers topics of interest to anybody wanting to run more than one OS on a single x86 PC. The book starts with basic information on PC architecture, including the BIOS, the hardware, and the history of the PC and how it influences multi-OS configurations. It proceeds from there to practical advice on partitioning, OS installation, data exchange, cross-platform utilities, networking, and modern hardware. I've written this book with the goal of helping those who are new to multi-OS configurations or who have multi-OS setups but who want to optimize them to get the best possible configurations. If you want to add Linux to your stable of OSs, and wonder which Linux to install, you may want to check my Linux distributions web page. According to Amazon.com, people who bought this book also bought Red Hat Linux Network Management Tools, Internet Core Protocols: The Definitive Guide, Oracle 8i: The Complete Reference, and Professional Linux Deployment. In the weeks and months to come, I'll update this site with any errata or additional information that may be useful as developments in the OS world warrant. I am making every attempt to keep these web pages viewable from any web browser. Of course, not all browsers support all features used by these pages, but I've tried to make such items harmless to these browsers. These pages have been checked using weblint, as well as with a variety of browsers. If you encounter a problem accessing these pages from your browser, please notify me."
