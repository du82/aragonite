["https://rodsbooks.com/books/books-noncomp.html"]
title = "Miscellaneous Linux Books"
full_description = "These are some of the books I've read recently and enjoyed or that are long-time favorites of mine. Mostly these are science fiction titles. The Harry Potter books by J. K. Rowling have become quite popular of late, and justifiably so. They're children's books, but if you're an adult, don't dismiss them out of hand for that, since they're quite entertaining, with amusing characters and plot twists. David Brin has been one of my favorite science fiction authors for several years, because of his ability to create fascinating aliens and to construct plots that build almost imperceptibly in intensity, leaving one unable to put the book down. Plan to read the final half of most Brin books in a single sitting. Larry Niven, like David Brin, is one of my favorite authors because of his creative aliens and future history, Known Space. Niven's plots tend not to be nearly as complex as are Brin's, however, and his characters are not generally as well-drawn. Nessus, from Ringworld and a few short stories, remains one of my favorite alien characters, however. Buy from Amazon: Tales of Known Space, Neutron Star, Three Books of Known Space, N-Space, Playgrounds of the Mind. If you have problems with or comments about this web page, please e-mail me at rodsmith@rodsbooks.com. Thanks."
