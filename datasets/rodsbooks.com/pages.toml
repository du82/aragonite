["https://www.rodsbooks.com/ev-roadtrip"]
title = "How to Optimize an EV Road Trip"
full_description = '''This Web page is provided free of charge and with no annoying outside ads; however, I did take time to prepare it, and Web hosting does cost money. If you find this Web page useful, please consider making a small donation to help keep this site up and running. Thanks! Battery electric vehicles (BEVs; or EVs for short, although fuel cell electric vehicles, or FCEVs, are another type of EV not covered on this page) are starting to move from fringe products to mainstream ones. BEV sales as a percentage of all new car sales in the United States rose from 2.5% in Q1 of 2021 to 5.2% in Q1 of 2022 to 7% in January of 2023. Most analysts expect this trend to continue, and many nations are taking steps to ensure it does, by passing legislation to ban the sale of cars powered by internal combustion engines (ICE vehicles) after some date. Seeing the writing on the wall, many manufacturers have announced the end of ICE development efforts, and are instead shifting to research and development of batteries and electric drivetrains, and are converting factories to build batteries and EVs rather than ICEs, transmissions, and ICE vehicles. Note: Even when run on electricity generated 100% by coal, the efficiency of EVs means that they emit less CO2 than similar gas-powered cars per mile driven, so they can recoup their up-front higher CO2 emissions for their manufacture over their lifetimes. According to the US Department of Energy, in the US in 2023, about 22% of electricity was generated by coal, 37% by natural gas, 19% by nuclear, and about 20% by "green" sources. This varies greatly regionally, of course. EVs are gaining in market share for a number of reasons. They're quiet, they produce excellent acceleration from a stop, they accelerate smoothly (without the shifts associated with ICE vehicles' transmissions), they're inexpensive to run and to maintain, and they produce less CO2 emissions over their lifetimes than do ICE vehicles. EVs make excellent day-to-day commuting vehicles. In the US, the average car is driven about 35 miles each day, which is well within the range of any modern EV. Owners who have a place to charge at home can plug in when they get home and leave with a full charge the next day, thus simplifying the task of "fueling" the car. The electricity to drive an EV is usually less expensive than gasoline or diesel used to drive a comparable ICE vehicle.'''
