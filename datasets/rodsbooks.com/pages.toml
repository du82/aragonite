["https://rodsbooks.com/lenses/index.html"]
title = "Informal Lens Tests"
full_description = '''Photography is my hobby. I own several cameras, most of which use the Pentax K mount, but I've also got a few others, including a Soviet Kristall that uses the Zenit M39 mount. In an effort to determine the quality of various lenses I own, I did a simple and informal test: I loaded a Zenit APk camera with Ilford Pan F+ ISO 50 film, mounted it on a tripod, and shot a test scene with nine lenses. Note that this is a very informal test; I don't present it with any claims of precision or repeatability. The lenses are of varying ages, and I got some of them used, so I can't vouch for their pedigree. It's possible that the focus wasn't perfect on some tests, or that vibrations caused problems. That said, the lenses I tested were: The Tamrons used Ricoh K-mount adapters and the Zenit M39 lenses used both M39-to-M42 and M42-to-K-mount adapters. I shot a piece of 8.5"x11" paper with the lens name, slightly off center, for each lens. For the wide angle and normal lenses, I shot at f/5.6, but for the longer lenses, I used f/8 because f/5.6 was just too close to the Tamron's maximum aperture. I let the Zenit APk's exposure meter determine the shutter speed. (The day was mostly clear, but a few stray clouds changed the light slightly during the course of the test.) I tested the Tamron 28-70mm twice, once at 35mm and once at 50mm. I tested the Tamron 70-210mm at 135mm, to compare it directly with the fixed lenses of roughly that length. I moved the camera on its tripod when switching between different classes of lens lengths to approximate the same view for each lens type. I developed the film myself in Kodak D-76. This was only the second roll of film I've developed myself, and I had problems with the reels on the tank. This resulted in some film buckling that caused crescent-shaped artifacts on some of the frames. I scanned the negatives with a Minolta DiMAGE Scan Elite 5400 at 2700 dpi using VueScan. To sum up, the winners in each category were the Mir-1, the Helios-44K-4, and the Pentax Takumar 135mm.'''
year_published = 2025
clearnet = "https://rodsbooks.com/lenses/index.html"
