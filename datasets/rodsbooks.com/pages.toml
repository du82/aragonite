["https://rodsbooks.com/efi-bootloaders/principles.html"]
title = "Managing EFI Boot Loaders for Linux: Basic Principles"
full_description = "This Web page is provided free of charge and with no annoying outside ads; however, I did take time to prepare it, and Web hosting does cost money. If you find this Web page useful, please consider making a small donation to help keep this site up and running. Thanks! This page is part of my Managing EFI Boot Loaders for Linux document. If a Web search has brought you to this page, you may want to start at the beginning. At the dawn of the PC era in 1981, IBM shipped its Personal Computer 5150 with firmware known as the Basic Input/Output System (BIOS). The BIOS was intended to be an interface between many hardware devices and the Disk Operating System (DOS). As the years progressed, though, the BIOS became less important because it was written using 16-bit code, and operating systems progressed to 32-bit and, now, 64-bit code. Such advanced OSes can't use the BIOS's features without a performance penalty, so modern OSes instead rely on drivers to talk to hardware. Today, therefore, the main role of the BIOS is to begin the boot process. Once the system is booted, the BIOS is essentially irrelevant. Still, booting the computer is an important task, and the BIOS's ancient design creates limitations. For instance, the BIOS begins the boot process by loading just 512 bytes of data—the contents of the first sector of the boot disk—and executing it. Therefore, whatever program resides in that tiny location (the Master Boot Record, or MBR) controls how the computer boots. Often, the MBR code loads additional code from elsewhere in order to present a menu of options. There is no universal standard for how this is done, though, and it's common for OSes to wipe out existing MBR code, and therefore working boot loader configurations, upon installation. UEFI is essentially EFI version 2.x. Intel-based Macs ship with a customized version of EFI 1.x, whereas many PCs introduced in 2011 and later (and a few sold in previous years) use UEFI 2.x. For the most part, the two versions of EFI are identical for the purposes of these Web pages. Macs, however, are a bit odd from an EFI perspective. For instance, their EFI implementations can read OS X's native Hierarchical File System Plus (HFS+), and they normally boot from a boot loader placed on an HFS+ partition rather than in the EFI System Partition (ESP) described on this page. (Apple's new Apple Filesystem, or APFS, can be read by newer Apple EFI implementations, too.)"
