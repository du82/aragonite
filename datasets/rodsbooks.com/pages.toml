["https://rodsbooks.com/efi-bootloaders/efistub.html"]
title = """
Managing EFI Boot Loaders for Linux: Using the Kernel's EFI Stub
Loader"""
full_description = "This Web page is provided free of charge and with no annoying outside ads; however, I did take time to prepare it, and Web hosting does cost money. If you find this Web page useful, please consider making a small donation to help keep this site up and running. Thanks! This page is part of my Managing EFI Boot Loaders for Linux document. If a Web search has brought you to this page, you may want to start at the beginning. In late 2011, Linux kernel developers began work on a new way to boot Linux on EFI-based systems. This approach turns the Linux kernel into an EFI application. Once loaded, the kernel takes over the computer, effectively bypassing the need for a boot loader in the strictest sense. This approach has its own unique advantages and disadvantages, as detailed on this page. (If you're interested in the technical details, you can read about them in the Linux Kernel Mailing List thread on this topic.) The Linux kernel's EFI stub loader has a number of unique features. Some are positive, some are negative, and some can be either. Broadly speaking, reasons you might want to use it include: In practice, the EFI stub loader is generally used with a separate boot manager program—most commonly rEFInd or gummiboot/systemd-boot, but GRUB 2 can be used this way, too. rEFInd's filesystem drivers can mitigate the first EFI stub loader disadvantage, and the configuration features of any of these boot managers mitigates the second disadvantage. The third is only a problem if you want to boot a very old kernel. The use of a separate boot manager also eliminates the first advantage, and the second is largely theoretical. Thus, the advantages and disadvantages of the EFI stub loader are largely irrelevant or depend on the features of the boot manager with which the EFI stub loader is paired. One partial exception is if you configure your computer's built-in boot manager to launch a Linux kernel. In this case, the kernel must reside on the ESP or some other EFI-accessible partition; and configuration becomes awkward, because it must be done through the efibootmgr utility. Some people like this minimalist approach to booting, though."
year_published = 2025
clearnet = "https://rodsbooks.com/efi-bootloaders/efistub.html"
