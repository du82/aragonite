["https://rodsbooks.com/wpfonts/wpfonts-macro.html"]
title = "WordPerfect Combined Characters"
full_description = '''If you frequently find the need to create combination characters such as À or î, you may find WordPerfect for Linux's usual method of doing so awkward -- you must normally select the Symbols dialog box (by choosing Insert - > Symbol or < Ctrl-W > ) and pick the symbol you want from that dialog. This procedure can be awkward if you need to do it very often. Fortunately, Bas Jordans has created a very handy macro to help make life easier. You can download the macro by clicking on any of its links on this page. It's called ctrl2.wcm, and it's a binary WordPerfect macro file. (I've put it on the server as a zip file both to save download bandwidth and because Netscape in Windows corrupts the file if this isn't done.) Once you've got the file, you should install it in a suitable macro directory. On a typical WordPerfect for Linux installation, one suitable directory is the wpmacros subdirectory of the main WordPerfect installation tree (such as /opt/wp8/wpmacros or /usr/WordPerfect/wpmacros). You'll normally need to have root access to install this file in this way. An alternative method of installing the file is to put it in a directory owned by you as a user, such as the ~/.wprc directory in which your configuration files reside. You must then ensure that the ~/.wprc directory appears on your WordPerfect macro path. You do this from the Preferences dialog box (choose Preferences from the WordPerfect control window). Click the Files button to get the Files Preferences dialog box, then click the Macros/Toolbar/Keyboard radio button and enter "~/.wprc" in the Default Directory field. To use the macro, type < Ctrl-2 > . This action produces a small dialog box in which you type the two characters you want to combine. For instance, to produce î you would type "i^" (without the quote marks). The macro doesn't actually create overstruck characters; instead, it uses the two characters you type as an index into WordPerfect's extended character set, and inserts the character you might have selected from the Symbol dialog box if you'd done it that way. Therefore, not all character combinations are legal. Many are, however, including those most frequently needed in many European languages.'''
