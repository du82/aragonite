["https://rodsbooks.com/sodas/index.html"]
title = "Alternatives to SodaStream or Primo Flavorstation Flavorings"
full_description = '''This Web page is provided free of charge and with no annoying outside ads; however, I did take time to prepare it, and Web hosting does cost money. If you find this Web page useful, please consider making a small donation to help keep this site up and running. Thanks! The makers of the SodaStream and Primo Flavorstation devices would love for their customers to use nothing but their own flavor syrups. By the very nature of these devices, though, it's easy to use other flavorings. The major obstacle is simply finding suitable products—supermarkets don't exactly abound with soft drink syrups. This Web page describes one approach to finding and using alternative carbonated beverage flavorings. A SodaStream Jet, flanked by supplies: 4-ounce, 1-pint, and 1-quart bottles of snow cone concentrate (left) and a 4-ounce bottle of 25% sucralose solution (right) After seeing a SodaStream carbonated beverage maker, I became intrigued and bought one myself. Although I'm pleased with the device overall, some of the claimed advantages of the SodaStream don't really pan out: SodaStream's CO2 cost estimates may be a bit optimistic. I got 53 liters from my first CO2 cartridge, compared to the 60 claimed. Others online report getting between about 30 and a bit over 60 liters. If you like your soda very fizzy, you'll get fewer liters out of each cartridge, thus raising costs. Of course, other advantages that SodaStream claims are real—there's less lugging of bottles or cans involved, fewer bottles or cans to recycle or ship to landfills, and most of their flavors have less sodium and/or caffeine than other brands. For non-diet drinkers, most non-diet flavors have fewer calories, thanks to the mix of sugar and sucralose SodaStream uses in them. These factors, along with the "fun" aspect of it, were enough to convince me to buy my SodaStream; but I also hoped to find a way to improve on those two more suspect items. That's what this page is about, with an emphasis on the flavor syrups.'''
year_published = 2025
clearnet = "https://rodsbooks.com/sodas/index.html"
