["https://rodsbooks.com/efi-bootloaders/gummiboot.html"]
title = "Managing EFI Boot Loaders for Linux: Using gummiboot/systemd-boot"
full_description = "This Web page is provided free of charge and with no annoying outside ads; however, I did take time to prepare it, and Web hosting does cost money. If you find this Web page useful, please consider making a small donation to help keep this site up and running. Thanks! This page is part of my Managing EFI Boot Loaders for Linux document. If a Web search has brought you to this page, you may want to start at the beginning. The systemd-boot boot manager is, as the name implies, part of the Linux systemd startup system. This boot manager was previously known as gummiboot, which is German for rubber boat. Under either name, it is, like rEFIt and rEFInd, a boot manager, not a boot loader; you can use systemd-boot to select which OS to boot or to launch a 3.3.0 or later kernel, but not to launch another OS's kernel. Despite its linkage to systemd, systemd-boot can be used even if you don't use systemd; and if your distribution uses systemd (as most do), you can use a boot manager other than systemd-boot. Compared to rEFIt and rEFInd, systemd-boot is a very simple boot manager. Overall, conditions when you might want to consider using systemd-boot include: Because systemd-boot is a boot manager and not a boot loader, you'll need to use a separate boot loader to launch Linux. In practice, this is likely to be the EFI stub loader. Although you could use systemd-boot to chainload to GRUB 2 or some other boot loader, there would be little advantage to using systemd-boot in such a configuration. systemd-boot is sparsely documented. (The Arch Linux systemd-boot documentation is more extensive than the documentation on systemd-boot's own page.) Overall, systemd-boot is a good choice for those wanting a minimal boot experience and who don't mind some manual configuration, both when installing the boot program and when updating kernels. As a practical matter, it's a logical successor to ELILO and SYSLINUX; although they are boot loaders, whereas systemd-boot is a boot manager, in practice all three will be set up and configured in a similar way. The biggest advantage of systemd-boot is that it's under active development. If your needs are more complex (including a need to boot a kernel from a partition other than the ESP) or if you want to deal less with reconfiguration whenever you update a kernel, GRUB 2 or rEFInd will be a better option."
year_published = 2025
