["https://rodsbooks.com/wpfonts/wpfonts-ps.html"]
title = "PostScript WordPerfect Printers"
full_description = "Setting up a PostScript or Ghostscript-driven printer is actually very much like setting up a non-PostScript printer, and you should read that section for details on where to get drivers and how to install them. If you have a choice between using a WordPerfect driver for a non-PostScript printer and using a PostScript driver and piping the results through Ghostscript, you may want to try both approaches. For my Brother HL-660 600 dpi PCL 5e printer, the WordPerfect drivers seem to work a little better, since they're faster than printing through Ghostscript. For my Epson Stylus Color 400, the WordPerfect Epson Stylus Color drivers don't work at all, and I suspect that if they did there'd be little speed difference. Printing via Ghostscript produces better-quality output on an Epson Stylus Color 1520, I suspect because the WordPerfect drivers aren't specific to the 1520, but are general for all Epson Stylus Color models, and so don't produce the higher resolution output of which the 1520 is capable. To set up a PostScript-capable Linux printer queue for a non-PostScript printer, the queue must pipe the output through Ghostscript. This can be done in any of a number of ways. Some distributions, such as Red Hat, include utilities to help set up a printer queue that will use Ghostscript. The details of setting up such a queue are well beyond the scope of this document; I suggest checking your distribution's documentation, a good Linux book, or the Linux Printing HOWTO for details. For the PostScript-enabled Linux printer queue to work on a system printing to a non-PostScript printer, you'll also need Ghostscript. All major Linux distributions ship with Ghostscript, but they often include older versions that may not include the best drivers, or even have the driver for your printer. You may therefore want to look into getting a more recent version. The main Ghostscript web site is at http://www.cs.wisc.edu/~ghost. This site includes the latest Ghoscript source code, FAQs, etc. If you're using a system that uses Red Hat's RPM system for package distribution, the site http://www.users.dircon.co.uk/~typhoon/ includes both libc5 and glibc RPMs for Ghostscript 5.10, including the most commonly-requested drivers."
