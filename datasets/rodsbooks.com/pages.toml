title = "FreeBSD: The Complete Reference"
full_description = '''My tenth book, FreeBSD: The Complete Reference, is a guide to FreeBSD, including information on installation, system administration, network configuration, server maintenance, desktop applications, and so on. This book was written with FreeBSD 5.0 in mind, and comes with that version of FreeBSD on CD-ROM. Page count: 869. On June 9, 2003, version 5.1 of FreeBSD was released. This version features improved stability and an assortment of new features; check the links for details. Check the list of mirrors to discover where you can obtain CD-R image files, where to buy CD-ROMs, or how to obtain FreeBSD in other ways. Chapter 2 of my book covers these issues in more detail. Note that version 5.1 is still considered a "new technology" release, and the 4.x series is still under active development. For those more interested in stability than the latest features, version 4.8 is the current version, as of 6/9/03. In the weeks and months to come, I'll update this site with any errata or additional information that may be useful as developments in the FreeBSD world warrant. I am making every attempt to keep these web pages viewable from any web browser. Of course, not all browsers support all features used by these pages, but I've tried to make such items harmless to these browsers. These pages have been checked using weblint, as well as with a variety of browsers. If you encounter a problem accessing these pages from your browser, please notify me.'''
