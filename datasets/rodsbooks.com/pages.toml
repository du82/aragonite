["http://www.rodsbooks.com/axfonts"]
title = "Applix Fonts"
full_description = '''I've added instructions on using xfsft, the FreeType-based TrueType font server, to handle screen font display for Applix. This can be combined with Ghostscript's TrueType font handling to use 100% TrueType fonts, if you so desire. I've also added a section on using a variety of fonts from various sources in place of the bitmapped fonts delivered with Applix. I've removed the section on "hybrid" procedures as being largely moot with the advent of xfsft. I've been using ApplixWare (or, more precisely, Applix Words) under Linux for some time, and have wanted to install several fonts so that I can use them from Applix. Unfortunately, this turned out to be a more daunting task than I had first anticipated. Although Applix comes with the FontTastic font server to aid in this task, adding fonts in this way resulted in relatively klunky 300 dpi printouts on my 600 dpi printer. Thus, I went in search of a better way to install fonts, and this document is the result. It seems that font handling under Applix is very finicky, and I had to do a lot of experimentation, beyond the helpful information I received from the net, to get it working. Font handling can be done in Applix in either of two basic ways: Using the FontTastic font server that comes with Applix; or installing fonts in X and modifying an Applix configuration file to map fonts appropriately between the screen and the printer. In either case, PostScript Type 1 (aka "ATM") or TrueType fonts can be used, though TrueType fonts are harder to configure for the second case. They do offer certain advantages, however. A note on paths: When I refer to a file or directory in the Applix installation tree, I begin the reference with "applix" (e.g., "applix/foo/bar"). This is because Applix is a relocatable package, and may appear in different locations on different systems. When I refer to a file or directory that's likely to be in the same location on all systems, I use the full pathname (e.g., "/usr/local/foo/bar"). Of course, if you've installed such packages in non-standard locations, you'll have to adjust these references accordingly.'''
