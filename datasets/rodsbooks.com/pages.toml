["https://rodsbooks.com/efi-bootloaders/bootrepair.html"]
title = "Managing EFI Boot Loaders for Linux: Repairing Boot Repair"
full_description = '''This Web page is provided free of charge and with no annoying outside ads; however, I did take time to prepare it, and Web hosting does cost money. If you find this Web page useful, please consider making a small donation to help keep this site up and running. Thanks! Archival Note: This page is largely obsolete because of changes in Boot Repair's default options. Specifically, Boot Repair no longer automatically performs the "Backup and rename EFI files" operation described later on this page. Nonetheless, I'm leaving this page in place both as a warning to not use that option unless you're reasonably certain it's necessary and as a cautionary tale to be careful about over-application of fixes that are necessary in only a few cases. This page is part of my Managing EFI Boot Loaders for Linux document. If a Web search has brought you to this page, you may want to start at the beginning. Ubuntu's Boot Repair tool is a user-friendly GUI program that's intended to fix a wide variety of boot issues. Although it often works, its user interface is intentionally very simple, and it therefore often does more than is necessary. In an EFI context, this can create new problems, particularly if you don't want to use Ubuntu's version of GRUB 2. This page will help you overcome these problems. Boot Repair presents a simple user interface with just a few options in its main window, as shown to the right. Most users, confronted with a computer that's not booting one or more OSes, will naturally click the button labeled Recommended Repair. Experts might click Advanced Options to see what else is available—but the result is a dialog box with a plethora of options that can be a little unclear even to an expert. To understand what Boot Repair does (and, in some cases, does wrong), I prerformed an experiment. I began by doing a fresh installation of Ubuntu 13.04 in a VirtualBox environment. I then installed two copies of rEFInd on the virtual computer: Once as the fallback boot loader and a second copy as a stand-in for the Windows boot loader. The result was the following boot loader files in the EFI System Partition (ESP):'''
