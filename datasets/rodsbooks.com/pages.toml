["http://www.rodsbooks.com/gdisk/bios.html"]
title = "Legacy BIOS Issues with GPT"
full_description = "This Web page, and the associated software, is provided free of charge and with no annoying outside ads; however, I did take time to prepare it, and Web hosting does cost money. If you find GPT fdisk or this Web page useful, please consider making a small donation to help keep this site up and running. Thanks! Today, new x86-64 computers ship with firmware known as the Extensible Firmware Interface (EFI) or its variant, the Unified EFI (UEFI), which is essentially EFI 2.x. GPT was created as part of the EFI specification, so of course GPT works well with EFI-based computers. In the past, most desktop, laptop, and server computers used a firmware knwon as the Basic Input/Output System (BIOS). which is so simple that it doesn't understand the partition table type used on the disk — it's the role of the boot loader and subsequent software to interpret the partition table. Thus, in theory there should be no problem using GPT with BIOS-based computers. Unfortunately, in practice, there are occasional BIOS/GPT quirks or even downright incompatibilities. Furthermore, many modern computers with EFIs provide a Compatibility Support Module (CSM), which enables them to boot using BIOS-mode boot loaders. The trouble is that the firmware may use the partition table type as a cue for what type of boot mode to use, thus causing problems when trying to boot in BIOS mode from a GPT disk. In either case, a computer with a GPT disk may not boot or will boot very slowly because the BIOS power-on self-test (POST) takes an inordinately long time to finish. This page exists to help you if you encounter such problems. It must be emphasized that, as of 2022, BIOS is a fading technology; you should not encounter such problems on most computers made since 2011, although enabling the CSM or using a GPT with a hybrid MBR can sometimes cause problems, as described on this page. BIOS problems with GPT are quite peculiar, since as far as I know the BIOS should not attempt to read the disks, beyond verifying their presence and reading the boot code in the MBR. In most cases, incompatibility manifests as an inability to boot the computer — either a BIOS-mode OS won't boot or the computer will freeze during its power-on self-test (POST) when you attach a GPT disk. There are two specific bugs I'm aware of that cause this type of problem, but there may be others:"
year_published = 2025
clearnet = "http://www.rodsbooks.com/gdisk/bios.html"
