description = "Matt Zoller Seitz is the Editor at Large of RogerEbert.com, TV critic for New York Magazine, the creator of many video essays about film history and style, a finalist for the Pulitzer Prize in criticism, and the author of The Wes Anderson Collection. His writing on film and TV has appeared in The New York Times, Salon, New York Press, The Star-Ledger and Dallas Observer. (Banner illustration by Max Dalton)"
full_description = "30 Minutes On: “Watership Down” Matt Zoller Seitz Our editor-at-large on one of his favorite movies. February 20, 2025 Life, the Movie: Why Documentary Filmmaking Should Return to, You Know, Documenting Stuff Matt Zoller Seitz If nonfiction films are determined to look, feel, and move like fiction, what’s the point of nonfiction filmmaking? February 7, 2025 The Unloved, Part 134: The Better Angels Scout Tafoya Our series on unloved films gets to A.J. Edwards’ Lincoln drama. February 3, 2025 Out of the Ashes: Let the 2025 Oscars Be a Telethon for Wildfire Relief Matt Zoller Seitz In the wake of the California wildfires, it’s time for Hollywood to turn its biggest night into a chance to do good. January 24, 2025 The Metaphor Years: Writing Lessons from “The Twilight Zone” Matt Zoller Seitz A look back at a show that never shied away from commenting on the world around it. January 20, 2025 Somehow, James Gunn Always Gets You: An Appreciation of “Creature Commandos” Matt Zoller Seitz An appreciation of James Gunn in light of the conclusion of Creature Commandos. January 17, 2025 Book Excerpt: Foreword to The Wes Anderson Collection: Asteroid City by David Bordwell The Editors The foreword from Matt Zoller Seitz’s new book, written by David Bordwell. January 16, 2025 Not Everything Needs to be for Sale: on the Integrity of the Watch Duty App Matt Zoller Seitz As the California wildfires rage on, one of the most necessary tools for keeping people safe chooses to maintain its autonomy. January 14, 2025 What’s gone can never be replaced: thoughts on Los Angeles, disasters, and the present moment Matt Zoller Seitz A few thoughts on the LA wildfires, and what it is doing to American entertainment, culture, and our collective psyches. January 9, 2025 The Unloved, Part 133: Here Scout Tafoya An ode to Robert Zemeckis’ latest masterwork, written off mere months after its release earlier this year. January 1, 2025 The Unloved, Part 132: Anatomy of Hell Scout Tafoya Catherine Breillat gets the love this month. December 2, 2024"
