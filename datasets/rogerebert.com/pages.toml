full_description = "Roger Ebert Roger Ebert was the film critic of the Chicago Sun-Times from 1967 until his death in 2013. In 1975, he won the Pulitzer Prize for distinguished criticism. Chaz Ebert Chaz is the CEO of several Ebert enterprises, including the President of The Ebert Company Ltd, and of Ebert Digital LLC, Publisher of RogerEbert.com, President of Ebert Productions and Chairman of the Board of The Roger and Chaz Ebert Foundation, and Co-Founder and Producer of Ebertfest, the film festival now in its 24th year. Brian Tallerico Brian Tallerico is the Managing Editor of RogerEbert.com, and also covers television, film, Blu-ray, and video games. He is also a writer for Vulture, The Playlist, The New York Times, and GQ, and the President of the Chicago Film Critics Association. Robert Daniels Robert Daniels is Associate Editor at RogerEbert.com, and has written for the New York Times, the Los Angeles Times, Reverse Shot, Screen Daily, and the Criterion Collection. He has covered film festivals ranging from Cannes to Sundance to Toronto to the Berlinale and Locarno. He lives in Chicago, and is a member of the Chicago Film Critics Association. Matt Zoller Seitz Matt Zoller Seitz is the Editor-at-Large of RogerEbert.com, TV critic for New York Magazine and Vulture.com, and a finalist for the Pulitzer Prize in criticism. Clint Worthington Clint Worthington is the Assistant Editor at RogerEbert.com, and the founder and editor-in-chief of The Spool, as well as a Senior Staff Writer for Consequence. He is also a member of the Chicago Film Critics Association and Critics Choice Association. You can also find his byline at Vulture, Block Club Chicago, and elsewhere. Simon Abrams Simon Abrams is a native New Yorker and freelance film critic whose work has been featured in The New York Times, Vanity Fair, The Village Voice, and elsewhere. Monica Castillo Monica Castillo is a critic, journalist, programmer, and curator based in New York City. She is the Senior Film Programmer at the Jacob Burns Film Center and a contributor to RogerEbert.com."
