["https://www.rogerebert.com/festivals/a-preview-of-the-2025-rendez-vous-with-french-cinema"]
title = "A Preview of the 2025 Rendez-Vous with French Cinema | Festivals & Awards | Roger Ebert"
description = "A preview of the year's best U.S. event for Francophiles."
full_description = "Now marking its 30th year, the annual “Rendez-Vous with French Cinema” festival returns to give American audiences a taste of what is happening in contemporary French cinema. Running March 6-16th at New York’s Walter Reade Theatre, the program offers up 23 films—a number of which are making their U.S./North American premieres—that include both the latest efforts from a number of France’s most notable names on both sides of the camera to the early works of those soon joining their ranks. In addition, a number of the films will be accompanied by introductions and post-screening Q&A’s with the filmmakers. There will also be a couple of on-stage discussions that will be open to the public, including one on March 11 with actress Judith Godreche, discussing her role as one of the leading figures in France’s #MeToo movement and the effect that it has had on the film industry. The festival kicks off with the New York premiere of “Three Friends” (March 6), the latest from Emmanuel Mouret, whose “Diary of a Fleeting Affair” was part of the 2023 lineup. This one is a romantic drama that features allusions to such classics of the form as “La Ronde” and “Hannah and her Sisters,” without ever quite rising to their level. It centers on three close friends and their various romantic entanglements. Joan (India Hair, who will present the film with Mouret) is a woman who has just lost her husband (Vincent Macaigne) and is struggling to move on because of the guilt she feels over the fact that she confessed her unhappiness with their marriage just before his death. Alice (Camille Cottin) is becoming convinced that her partner, Eric (Gregorio Ludig) is having an affair and contemplates having one with a renowned artist she has met. They live vicariously through the exploits of Rebecca (Sara Forestier), who they know is having an affair with a married man but who they don’t realize is Eric. Although it contains a few amusing bits of dialogue here and there and a strong and convincing performance from Hair, the film soon becomes an overly talky and repetitive work that is nowhere near as deep or insightful as it pretends to be. This year’s festival stands as a sort of unofficial tribute to one of France’s leading actors, Vincent Lindon, who will be on hand to present no less than three films on the program in which he is featured. In “The Quiet Son” (March 8, 11), the third feature from Delphine and Muriel Coulin, he plays a widower whose loving relationship with his two children is rocked when he discovers that his older son (Benjamin Voisin) has recently fallen in with a group of violent right-wing nationalists in a performance that earned him the Best Actor award at last year’s Venice Film Festival. In “Cross Away” (March 7, 10), he puts on a literal one-man show in a remake of Steven Knight’s 2013 drama “Locke,” in which he plays a construction foreman who suddenly takes off on the eve of a major job to drive towards an uncertain destination while juggling several phone calls that gradually reveal the precariousness of both his personal and professional lives. Although the film does not veer too dramatically from its predecessor, Lindon finds a new and more lived-in approach to the role previously played by Tom Hardy that allows it to feel still relatively fresh. The final Lindon selection—and perhaps my favorite of all the films in this year’s lineup—is “The Second Act” (March 8, 13), the latest bit of weirdness from the prolific Quentin Dupieux, the mind behind such mind-benders as “Rubber,” “Mandibles” and “Smoking Causes Coughing.” This time around, he plays one of a quartet of actors (joined by Lea Seydoux, Louis Garrell and Raphael Quenard) who have little enthusiasm for either the project they are ensnared in (which appears to be directed entirely by AI) or each other and who continually find themselves breaking the fourth wall (and more) until it becomes impossible to tell what we are watching at any given point. Although I confess to being mixed on Dupieux as a whole, this is arguably his best and certainly his most consistent. He playfully deconstructs the mysteries of the filmmaking process while coming up with inspired running gags regarding everything from a supremely nervous bit player who keeps messing up takes to none other than Paul Thomas Anderson, that are delivered expertly by his more-than-game cast. The festival also includes the local premiere of the latest film from perhaps France’s most celebrated actress, the incomparable Isabelle Huppert. In “Visiting Hours” (March 8, 10), the latest from Patricia Mazuy (whose previous film was the brutal thriller “Saturn Bowling”), she plays Alma, the well-to-do wife of a man who is currently serving time in prison for an auto mishap for which he received a scandalously light sentence, presumably due to his wealth and prestige. While at the prison one day to visit him, she meets Mina (“The Secret of the Grain” Star Hafsia Herzi), who is there to see her husband, who is serving a far longer sentence than Alma’s husband for a much less serious crime. Alma impulsively decides to take Mina and her two children in to live with her in her large house, which is ostensibly closer to the prison than where Mina currently lives, and the two gradually begin to bond, though the vast differences in their respective circumstances eventually threaten to come between them. Although the narrative is somewhat uneven, especially with the introduction of a subplot in which Mina is threatened by the brother of one of her husband’s colleagues over some stolen watches that ends up dominating the final stretch, the film is still worth watching for both its quiet but unmistakable observations of the inequities of the French penal system and the inspired interplay between Huppert, working in a lighter mode than usual, and Harzi. Among the notable filmmakers whose latest efforts are in the lineup is Francois Ozon, who returns to the festival with “When Fall is Coming” (March 7, 16), a quirky (surprise) blend of quiet family drama and dark comedy. Here, retiree Michele (Helene Vincent) is living a peaceful life in the country, spending time in the country with her longtime BFF Marie-Claude (Josiane Balasko) and awaiting visits from her beloved grandchild, Lucas (Garlan Erlos). Alas, she and her daughter, Valerie (Ludivine Sagnier) have a rocky relationship and when a visit goes wrong following a culinary disaster, there is the possibility that she may never be allowed to see Lucas again. At the same time, Marie-Claude’s son, Vincent (Pierre Lottin), has just been released from prison and is looking to make a fresh start and I would not dream of saying anything more about what ensues. Although working in a far more naturalistic mode than in his previous work, the super-stylized “The Crime is Mine,” Ozon conjures up a fascinating and occasionally outrageous meditation on the notions of family and friendship that is anchored by the strong performance by Vincent and given additional frisson by his reunion with Sagnier, who are working together for the first time since the great “Swimming Pool” more than 20 years ago. “Suspended Time” (March 14, 16) marks the latest work from Olivier Assayas. While he has made some extraordinary films in the past, such as “Summer Hours,” “Personal Shopper,” and both the film and television versions of “Irma Vep,” this is not one of his better works. Set in April of 2020, during the early days of the worldwide COVID-19 shutdown, it tells the semi-autobiographical story of two brothers—celebrated filmmaker Paul (Vincent Macaigne) and music journalist Etienne (Micha Lescot)—who have holed up in their family home in the provinces with their respective romantic partners to ride things out and are slowly driven to distraction by both the close quarters and their general isolation from the outside world. There have been a number of films that have used the pandemic lockdown as a dramatic springboard. Still, while Assayas certainly provides a more picturesque take than most, he doesn’t have much to say about those strange days or their effect on us. Instead, he goes for an auto-fiction approach that grows less interesting as things go on. “This Life of Mine” (March 6, 10) marks the final film from writer-director Sophie Fillieres, who passed away shortly after completing shooting, having passed on notes to her children (who will be on hand to present the film) as to how the editing should go. In it, Agnes Joui plays a middle-aged woman with two grown children who no longer need her and a boring corporate job that only serves to remind her of the writing career she abandoned long ago. Already struggling with her mental health, a chance encounter with a long-forgotten friend sends her off on a spiral that lands her in a residential hospital for a spell but also inspires her to take stock of her life and what she wants to get out of it. Although the film works for a while, shifting from a more overtly comedic opening third into more serious-minded areas in the middle section, the final segment is a little too mawkish and uneven to work, though how much of this is due to Fillieres’s absence from the editing process is impossible to ascertain, However, the performance from Joui is undeniably winning and proves to be more than enough to hold one’s interest, even when the narrative starts to go off-track. Another strong performance in the service of a so-so-film is the one that Anamaria Vartolomei, the breakthrough star of “Happening,” delivers in “Being Maria” (March 15), the sophomore feature from Jessica Palud which fulfills the need for every film festival of note to contain at least one work that deals in part with the filmmaking process itself. This one presents the story of Maria Schneider, the French actress who was plucked from virtual obscurity to appear opposite superstar Marlon Brando in Bernardo Bertolucci’s “Last Tango in Paris,” an intense production that culminated with the infamous “get the butter” sequence that Brando (Matt Dillon) and Bertolucci (Giuseppe Maggio) planned without her approval or consent to capture her authentic surprised reaction. Based in part on the controversy surrounding this scene, the film would be celebrated and vilified worldwide. Still, while Bertolucci and Brando went on to greater triumphs, Schneider was left to face the fallout herself and, constrained from giving voice to her feelings towards what happened, spiraled off into a drug habit, rocky relationships, and a career that saw filmmakers more interested in her body and notoriety than her talent. When the focus is on the “Tango” shoot and its immediate aftermath, the film is intriguing. Still, when it goes into Schneider’s later career, it is more interested in seeing her as a simple martyr than a person and becomes another middling showbiz biopic. That said, Vartolomei (who will be on hand to present the film with Dillion) is quite good, making you wish she had been given the chance to portray Schneider in a film with more interest and curiosity about her as a whole than this can muster. One of the more ambitious films in this year’s collection is Aude Lea Rapin’s techno-thriller “Planet B” (March 12, 14). Set in 2039, the film concerns a group of environmental activists, led by Julia (Adele Exarchopoulos), who are arrested following an action that goes sideways and wake up to discover that they have been sentenced to Planet B, the world’s first virtual prison where they are constantly being tempted to inform on each other by those in charge in exchange for their freedom. Meanwhile, Noiur (Souheila Yacoub), an Iraqi journalist whose documentation is about to expire, inadvertently stumbles upon evidence of Planet B and tries to find a way inside to reveal its existence to the world. By tapping into current fears regarding virtual reality, climate change, and the treatment of prisoners while at the same time offering a portrait of what might be coming before too long, Rapin’s film sometimes bites off more than it can adequately chew. Still, it remains reasonably watchable and compelling throughout, aided in no small part by the impressive driving score from none other than filmmaker Bertrand Bonello. The struggles of migrants trying to make their way through contemporary France are at the heart of two of the festival’s more gripping films. In Jonathan Millet’s “Ghost Trail” (March 9, 11), Adam Bessa stars as Hamid, a migrant who, two years after being released from a Syrian jail, is struggling to make ends meet as a construction worker in Strasbourg while at the same time determined to track down the man who tortured him during his period of imprisonment. This brief description might make the film sound like a simple revenge thriller. Still, Millet instead presents us with a more complicated and nuanced portrayal of the contemporary migrant experience, both in terms of trying to rebuild their lives and in coming to terms with what caused them to flee in the first place. Meanwhile, Boris Lojkine’s “Souleymane’s Story” (March 9, 14) follows a Guinean immigrant (Abou Sangare, a non-professional actor who won the Best Actor prize in the Un Certain Regard section of Cannes last year) over the course of two days as he struggles to keep up with his punishing work as a bicycle food deliverer while trying to prepare himself for an imminent and all-important interview regarding his asylum status. Shot largely on the fly with concealed cameras and edited for maximum intensity, Lojkine’s film has the form of a breakneck thriller but just underneath is a thoughtful and powerful drama examining life on the margins of society through the eyes of the sort for whom the system seems to be set up almost specifically to fail. The importance of the press in times of political upheaval is the focus of two more of the films, though one proves to be far more successful at it than the others. Based on the novel by Jerome Ferrari, “In His Own Image” (March 12, 14), the latest from filmmaker Thierry de Peretti, tells the story of Antonia (Clara-Maria Laredo), a young photographer from Corsica who chronicles the upheaval in her country from the ’80s to the beginning of the 21st century while at the same time being entwined in a long-standing affair with a radical activist (Louis Starace) whose activities end up forcing her to realize that separating the personal from the political is not as easy as some like to make it sound. Although handsomely mounted, the film is undone by a clumsy, flashback-heavy structure that saps most of the tension out of each individual scene and an approach to Antonia that is so determined to make her seem enigmatic that it forgets to make her interesting. Far more intriguing is “Meeting with Pol Pot” (March 7, 13), in which Cambodian-born filmmaker Rithy Panh takes an innovative and eye-opening look at one of the darker moments in his country’s history. Based on the nonfiction book b"
