full_description = "Scout Tafoya Scout Tafoya Scout Tafoya is a film critic, video essayist, filmmaker, and author of Cinemaphagy: On The Psychedelic Classical Form of Tobe Hooper, the first book-length critical study of the director of “The Texas Chain Saw Massacre.” Originally from from Doylestown, PA, he is the creator of RogerEbert.com’s The Unloved, the longest running video essay series on the web, about movies in need of a second look. His writing has appeared in the Village Voice, Film Comment, Nylon Magazine, the Los Angeles Review of Books, and The Film Stage among others. He is the director of over 25 feature films including “Eyam,” “House of Little Deaths,” and “Beata Virgo Viscera,” which debuted on RogerEbert.com. His features and his extensive video essay work can be found at Patreon.com/honorszombie. Latest from Scout Tafoya Tributes I Think Of Them As The Work: Gene Hackman (1930-2025) 1 day ago Features Book Excerpt: An Anthony Mann Reader by Scout Tafoya February 6, 2025 MZS The Unloved, Part 134: The Better Angels February 3, 2025 MZS The Unloved, Part 133: Here January 1, 2025 MZS The Unloved, Part 132: Anatomy of Hell December 2, 2024 MZS The Unloved, Part 131: Dark City November 1, 2024 MZS The Unloved, Part 130: Hollow Man October 1, 2024 MZS The Unloved, Part 129: The Power September 2, 2024 Features The Unloved, Part 128: Cobweb July 28, 2024 MZS The Unloved, Part 127: Highlander II: The Quickening June 27, 2024 Tributes The Hard Way, Or My Way? RIP Bill Cobbs (1934-2024) June 27, 2024 MZS The Unloved, Part 126: Zardoz June 3, 2024 MZS The Unloved, Part 125: Mother Night April 30, 2024 MZS The Unloved, Part 124: Play Dirty April 1, 2024 Tributes I Need Your Magic: M. Emmett Walsh (1935-2024) March 22, 2024 MZS The Unloved, Part 123: Birth February 29, 2024 MZS The Unloved, Part 122: Silent Night January 31, 2024 MZS The Unloved, Part 121: The International December 31, 2023 MZS The Unloved, Part 120: The Claim November 30, 2023 MZS The Unlo